  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: threshold_head_exactly_at_species_floor
        grounds:
          - calculations.reporter_threshold_determination
          - calculations.reporter_threshold_determination.constants.THRESHOLD_HEAD_BY_SPECIES
          - entities.Registration.fields.measured_head
          - entities.Registration.fields.determination_outcome
          - endpoints.POST_/registrations/{id}/determine
        boundary_metric: "Registration.measured_head against threshold_head 125000 for CATTLE (inclusive >=), plus the floor of the pooled five-year total"
        distinguishing_aspect: |
          Metric is measured_head vs the species threshold, exercised on
          POST /registrations/{id}/determine. Four entities straddle the single
          boundary at 124999 / 125000 / 125001 and a fourth whose pooled total 625002
          floors to exactly 125000 — proving both that the comparison is inclusive and
          that the floor happens after pooling (per-year averaging would give 125000.4
          and any rounding-up would flip 124999 to MANDATORY).
        test_recipe:
          setup:
            - "Four CATTLE reporting entities, each with exactly one ACTIVE plant, all filing FIVE_YEAR_AVERAGE registrations for determination_year 2026 (lookback years 2021-2025)."
            - "Below: five years of 124999 head (total 624995, floor 124999). At: five years of 125000 (total 625000). Above: five years of 125001 (total 625005). Floor-at: 125000 x4 plus 125002 (total 625002, quotient 125000.4)."
          setup_api_calls:
            - call: "POST /reporting-entities"
              payload: { legal_name: "Below Beef", entity_type: "PACKER", species_scope: "CATTLE" }
              as: ProgramAdmin
              captures: { ent_lo: $.data.id }
            - call: "POST /reporting-entities"
              payload: { legal_name: "Exact Beef", entity_type: "PACKER", species_scope: "CATTLE" }
              as: ProgramAdmin
