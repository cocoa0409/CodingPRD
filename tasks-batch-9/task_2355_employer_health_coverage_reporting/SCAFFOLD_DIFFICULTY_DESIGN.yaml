  - rule_id: non_linear_state_machine
    instances:
      - name: transmittal_rejected_rebuild_increments_cycle_number
        grounds:
          - state_machines.Transmittal.REJECTED_to_BUILT
          - state_machines.Transmittal.TRANSMITTED_to_REJECTED
          - entities.Transmittal.fields.cycle_number
          - validations[priority=42]
        distinguishing_aspect: |
          Transmittal cycle BUILT -> TRANSMITTED -> REJECTED -> BUILT: the entity returns to
          a state it already occupied while cycle_number advances 1 -> 2, and the attached
          form travels PENDING_FILING -> ATTACHED so the whole submission can be replaced.
        test_recipe:
          setup:
            - "FilingSeason 2026 OPEN; ControlledGroup DETERMINED_ALE; GroupMember with measurement_method MONTHLY; one employee with an ORIGINAL Form1095C."
            - "Transmittal T1 (ORIGINAL) holds that form, was built by preparer-1, transmitted PAPER by agent-1 and rejected by the agency, so its status is REJECTED with cycle_number 1."
