  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: issue_state_precondition_outranks_community_suspension_gate
        grounds:
          - validations[priority=40]
          - validations[priority=56]
          - errors[ERR_PERMIT_NOT_APPROVED]
          - errors[ERR_COMMUNITY_SUSPENDED]
        distinguishing_aspect: |
          Category pair state (priority 40) vs business_safety (priority 56): an already ISSUED
          permit inside a SUSPENDED community returns ERR_PERMIT_NOT_APPROVED with HTTP 409,
          never ERR_COMMUNITY_SUSPENDED with HTTP 403.
        test_recipe:
          setup:
            - "Community with a permit already in ISSUED."
            - "Three CRITICAL violations worth 12 points each (36 total) and no A510 credit, so compliance_posture is SUSPENDED."
          setup_api_calls:
            - call: "POST /floodplain/communities"
              payload: { name: "Bayou City", state_code: "TX", cid_number: "480001", freeboard_ft: 1.5, cumulative_period_years: 10 }
              as: StateNfipCoordinator
              as_user_id: "snc-01"
              captures: { comm_id: $.data.id }
