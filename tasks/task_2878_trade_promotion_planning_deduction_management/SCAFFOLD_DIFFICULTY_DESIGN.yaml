  - rule_id: non_linear_state_machine
    instances:
      - name: promotion_revision_cycle_bounded_at_two_rounds
        grounds:
          - state_machines.Promotion.lifecycle_status
          - entities.Promotion.fields.revision_round
          - validations.priority_82
          - errors.ERR_MAX_REVISION_ROUNDS
        distinguishing_aspect: |
          The lifecycle is cyclic, not linear: DRAFT -> SUBMITTED -> CHANGES_REQUESTED -> DRAFT
          returns the promotion to a state it already occupied, so state alone cannot decide
          whether the next revise is legal. revision_round is the loop counter and it is NOT
          reset by the re-submission that follows a revise, so the third revise is refused with
          409 ERR_MAX_REVISION_ROUNDS while the promotion stays in CHANGES_REQUESTED. An
          implementation that treats revise as a plain CHANGES_REQUESTED -> DRAFT edge, or that
          zeroes the counter on submit, admits an unbounded loop.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01."
            - "One program, brand, customer and APPROVED allocation."
            - "One promotion, window 2026-08-03 -> 2026-08-31, with one PLANNED TPR tactic so that submit is admissible."
            - "Two complete revision loops are driven: submit / request-changes / revise, twice, leaving revision_round at 2."
            - "A third submit and request-changes put the promotion back in CHANGES_REQUESTED with the counter already exhausted."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: TradeFinanceAnalyst
