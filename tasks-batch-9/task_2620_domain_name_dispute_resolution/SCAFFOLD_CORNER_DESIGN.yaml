        excluded_because:
          difficulty_instance: dual_variant_calc / response_deadline_provisional_at_dispatch_vs_final_at_delivery_moves_backwards
          rationale: "That instance shows the FINAL variant landing EARLIER than the PROVISIONAL one on a fast POSTAL delivery, which is the signed-delta claim this calculation exists to make."

