              as: Bookkeeper
            - call: "POST /students"
              payload: { external_ref: "S-2", full_name: "Ben", grade_level: 10, family_id: "fam-b" }
              as: Bookkeeper
              captures: { s2_id: $.data.id }
            - call: "POST /school-years/${y_id}/student-accounts"
              payload: { student_id: "${s2_id}" }
