  # ===========================================================================
  - section: complexity_layers
    instances:
      - name: occ_stale_tour_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[royalty-config-stale-tour]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Two strictly sequential config PATCHes carrying the same observed tour version: the first succeeds (version 2 -> 3), the second is rejected with ERR_STALE_VERSION 412 because its expected_tour_version no longer matches."
        test_recipe:
          setup: ["ACTIVE tour; version captured after activation"]
          setup_api_calls:
            - call: "POST /merch/tours"
              payload: { name: "CC1 Tour", artist_name: "Artist", cash_variance_tolerance_cents: 1000, standard_rate_bps: 1000, tier_threshold_cents: 500000, tier_bonus_bps: 500, licensed_flat_per_unit_cents: 500, licensed_rate_bps: 2000 }
              as: TourManager
              as_user_id: "tm-1"
              captures: { t_id: $.data.id }
            - call: "POST /merch/tours/${t_id}/activate"
              payload: {}
              as: TourManager
              as_user_id: "tm-1"
              captures: { t_v: $.data.version }
          trigger:
            - call: "PATCH /merch/tours/${t_id}/royalty-config"
              payload: { standard_rate_bps: 1500, tier_threshold_cents: 500000, tier_bonus_bps: 500, licensed_flat_per_unit_cents: 500, licensed_rate_bps: 2000, expected_tour_version: "${t_v}" }
              as: TourManager
              as_user_id: "tm-1"
            - call: "PATCH /merch/tours/${t_id}/royalty-config"
              payload: { standard_rate_bps: 2500, tier_threshold_cents: 500000, tier_bonus_bps: 500, licensed_flat_per_unit_cents: 500, licensed_rate_bps: 2000, expected_tour_version: "${t_v}" }
              as: TourManager
              as_user_id: "tm-1"
              captures: { err: $.data.error_id }
          assert:
            - "first PATCH succeeds: Tour.${t_id}.standard_rate_bps == 1500 and version == ${t_v} + 1"
            - "second PATCH with the same observed version: err == ERR_STALE_VERSION, HTTP 412"
            - "Tour.${t_id}.standard_rate_bps stays 1500 (losing write fully rejected)"

      - name: occ_stale_show_product_version_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[show-price-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Same OCC pattern on the price row: a reprice carrying the pre-change version is accepted once, and the replay with the now-stale version is rejected 412 — version increments by exactly 1 per accepted write."
        test_recipe:
          setup: ["tour with SCHEDULED show and a ShowProduct priced 4000; version captured at creation"]
          setup_api_calls:
            - call: "POST /merch/tours"
              payload: { name: "CC2 Tour", artist_name: "Artist", cash_variance_tolerance_cents: 1000, standard_rate_bps: 1000, tier_threshold_cents: 500000, tier_bonus_bps: 500, licensed_flat_per_unit_cents: 500, licensed_rate_bps: 2000 }
              as: TourManager
              as_user_id: "tm-1"
              captures: { t_id: $.data.id }
            - call: "POST /merch/shows"
              payload: { tour_id: "${t_id}", city: "Ogden", venue_name: "CC2 Hall", show_date: "2026-09-21T20:00:00Z", commission_mode: "FLAT", flat_commission_bps: 1500 }
              as: TourManager
              as_user_id: "tm-1"
              captures: { s_id: $.data.id }
            - call: "POST /merch/products"
              payload: { tour_id: "${t_id}", sku: "CC2-TEE", name: "Tee", product_type: "REGULAR", royalty_treatment: "STANDARD", sized: false, base_price_cents: 4000, initial_stock_by_size: { OS: 100 } }
              as: TourManager
              as_user_id: "tm-1"
              captures: { p_id: $.data.id }
            - call: "POST /merch/show-products"
              payload: { show_id: "${s_id}", product_id: "${p_id}", price_cents: 4000 }
              as: TourManager
              as_user_id: "tm-1"
              captures: { sp_id: $.data.id, sp_v: $.data.version }
          trigger:
            - call: "PATCH /merch/show-products/${sp_id}"
              payload: { price_cents: 4200, expected_show_product_version: "${sp_v}" }
              as: TourManager
              as_user_id: "tm-1"
            - call: "PATCH /merch/show-products/${sp_id}"
              payload: { price_cents: 4400, expected_show_product_version: "${sp_v}" }
              as: TourManager
              as_user_id: "tm-1"
              captures: { err: $.data.error_id }
          assert:
            - "first reprice succeeds: price_cents == 4200, version == ${sp_v} + 1"
            - "replayed reprice with stale version: err == ERR_STALE_VERSION, HTTP 412; price stays 4200"

      - name: receive_creates_missing_destination_allocation
        claim_type: derived_field_reconciliation
        grounds: [state_machines.Shipment.DISPATCHED_to_RECEIVED, entities.Allocation.fields.quantity_allocated]
        distinguishing_aspect: "Receiving 10 OS units into a show with no prior allocation row upserts one with quantity_allocated == 10, and warehouse stock reconciles to 990 — the derived fields on both sides reflect the move."
        test_recipe:
          setup: ["tour; OS product warehouse stock 1000; SCHEDULED show on 2026-08-10; shipment of 10 dispatched by tm-1"]
          setup_api_calls:
            - call: "POST /merch/tours"
              payload: { name: "CC3 Tour", artist_name: "Artist", cash_variance_tolerance_cents: 1000, standard_rate_bps: 1000, tier_threshold_cents: 500000, tier_bonus_bps: 500, licensed_flat_per_unit_cents: 500, licensed_rate_bps: 2000 }
              as: TourManager
              as_user_id: "tm-1"
              captures: { t_id: $.data.id }
            - call: "POST /merch/shows"
              payload: { tour_id: "${t_id}", city: "Logan", venue_name: "CC3 Hall", show_date: "2026-08-10T20:00:00Z", commission_mode: "FLAT", flat_commission_bps: 1500 }
              as: TourManager
              as_user_id: "tm-1"
              captures: { s_id: $.data.id }
            - call: "POST /merch/products"
              payload: { tour_id: "${t_id}", sku: "CC3-TEE", name: "Tee", product_type: "REGULAR", royalty_treatment: "STANDARD", sized: false, base_price_cents: 4000, initial_stock_by_size: { OS: 1000 } }
              as: TourManager
              as_user_id: "tm-1"
              captures: { p_id: $.data.id }
            - call: "POST /merch/shipments"
              payload: { tour_id: "${t_id}", origin_type: "WAREHOUSE", destination_show_id: "${s_id}", lines: [ { product_id: "${p_id}", size: "OS", quantity: 10 } ] }
              as: TourManager
              as_user_id: "tm-1"
              captures: { sh_id: $.data.id }
            - call: "POST /merch/shipments/${sh_id}/dispatch"
              payload: {}
              as: TourManager
              as_user_id: "tm-1"
          trigger:
            - call: "POST /merch/shipments/${sh_id}/receive"
              payload: {}
              as: TourManager
              as_user_id: "tm-2"
            - call: "GET /merch/allocations"
              payload: { show_id: "${s_id}", product_id: "${p_id}" }
              as: TourManager
              as_user_id: "tm-1"
              captures: { a_id: "$.data[0].id" }
          assert:
            - "Shipment.${sh_id}.status == RECEIVED"
            - "exactly one Allocation row exists for (show, product): size OS, quantity_allocated == 10 (created by the receive upsert)"
            - "GET /merch/products/${p_id}: warehouse_stock_by_size.OS == 990"

      - name: show_to_show_transfer_moves_units
        claim_type: cascading_side_effects
        grounds: [state_machines.Shipment.DRAFT_to_DISPATCHED, state_machines.Shipment.DISPATCHED_to_RECEIVED, calculations.warehouse_stock_reconciliation]
        distinguishing_aspect: "A SHOW-origin shipment decrements the origin show's allocation at dispatch (100 -> 70) and creates the destination show's row at receive (30) — tour routing between cities without touching warehouse stock."
        test_recipe:
          setup: ["tour; show SRC (2026-08-10, venue CC4 One) with 100 OS allocated; show DST (2026-08-12, venue CC4 Two); SHOW-origin shipment of 30"]
          setup_api_calls:
            - call: "POST /merch/tours"
              payload: { name: "CC4 Tour", artist_name: "Artist", cash_variance_tolerance_cents: 1000, standard_rate_bps: 1000, tier_threshold_cents: 500000, tier_bonus_bps: 500, licensed_flat_per_unit_cents: 500, licensed_rate_bps: 2000 }
              as: TourManager
              as_user_id: "tm-1"
              captures: { t_id: $.data.id }
            - call: "POST /merch/shows"
              payload: { tour_id: "${t_id}", city: "Provo", venue_name: "CC4 One", show_date: "2026-08-10T20:00:00Z", commission_mode: "FLAT", flat_commission_bps: 1500 }
              as: TourManager
              as_user_id: "tm-1"
              captures: { s_src: $.data.id }
            - call: "POST /merch/shows"
              payload: { tour_id: "${t_id}", city: "Orem", venue_name: "CC4 Two", show_date: "2026-08-12T20:00:00Z", commission_mode: "FLAT", flat_commission_bps: 1500 }
              as: TourManager
              as_user_id: "tm-1"
              captures: { s_dst: $.data.id }
            - call: "POST /merch/products"
              payload: { tour_id: "${t_id}", sku: "CC4-TEE", name: "Tee", product_type: "REGULAR", royalty_treatment: "STANDARD", sized: false, base_price_cents: 4000, initial_stock_by_size: { OS: 0 } }
              as: TourManager
              as_user_id: "tm-1"
              captures: { p_id: $.data.id }
            - call: "POST /merch/shows/${s_src}/allocations/generate"
              payload: { product_id: "${p_id}", total_units: 100 }
              as: TourManager
              as_user_id: "tm-1"
              captures: { a_src: "$.data[0].id" }
            - call: "POST /merch/shipments"
              payload: { tour_id: "${t_id}", origin_type: "SHOW", origin_show_id: "${s_src}", destination_show_id: "${s_dst}", lines: [ { product_id: "${p_id}", size: "OS", quantity: 30 } ] }
              as: TourManager
              as_user_id: "tm-1"
              captures: { sh_id: $.data.id }
          trigger:
            - call: "POST /merch/shipments/${sh_id}/dispatch"
              payload: {}
              as: TourManager
              as_user_id: "tm-1"
            - call: "POST /merch/shipments/${sh_id}/receive"
              payload: {}
              as: TourManager
              as_user_id: "tm-2"
            - call: "GET /merch/allocations"
              payload: { show_id: "${s_dst}", product_id: "${p_id}" }
              as: TourManager
              as_user_id: "tm-1"
              captures: { a_dst: "$.data[0].id" }
          assert:
            - "after dispatch: Allocation.${a_src}.quantity_allocated == 70 (origin decremented immediately)"
            - "after receive: Allocation.${a_dst}.quantity_allocated == 30 (destination row created)"
            - "warehouse stock untouched: warehouse_stock_by_size.OS == 0 throughout"

      - name: bundle_fulfill_decrements_component_stock
        claim_type: cascading_side_effects
        grounds: [state_machines.OnlineOrder.PLACED_to_FULFILLED, entities.Product.fields.bundle_components]
        distinguishing_aspect: "Fulfilling 10 fan-pack bundles (1 poster + 2 stickers each) decrements component OS stock to 90 and 180 while the virtual bundle itself holds no stock; royalty final uses the bundle's own gross (60000 -> 6000 at 1000 bps)."
        test_recipe:
          setup: ["ACTIVE tour; poster (OS 100) and sticker (OS 200); BUNDLE priced 6000 = 1x poster + 2x sticker; order qty 10"]
          setup_api_calls:
            - call: "POST /merch/tours"
              payload: { name: "CC5 Tour", artist_name: "Artist", cash_variance_tolerance_cents: 1000, standard_rate_bps: 1000, tier_threshold_cents: 500000, tier_bonus_bps: 500, licensed_flat_per_unit_cents: 500, licensed_rate_bps: 2000 }
              as: TourManager
              as_user_id: "tm-1"
              captures: { t_id: $.data.id }
            - call: "POST /merch/tours/${t_id}/activate"
              payload: {}
              as: TourManager
              as_user_id: "tm-1"
            - call: "POST /merch/products"
              payload: { tour_id: "${t_id}", sku: "CC5-POSTER", name: "Poster", product_type: "REGULAR", royalty_treatment: "STANDARD", sized: false, base_price_cents: 2000, initial_stock_by_size: { OS: 100 } }
              as: TourManager
              as_user_id: "tm-1"
              captures: { po_id: $.data.id }
            - call: "POST /merch/products"
              payload: { tour_id: "${t_id}", sku: "CC5-STICKER", name: "Sticker", product_type: "REGULAR", royalty_treatment: "STANDARD", sized: false, base_price_cents: 500, initial_stock_by_size: { OS: 200 } }
              as: TourManager
              as_user_id: "tm-1"
              captures: { st_id: $.data.id }
            - call: "POST /merch/products"
              payload: { tour_id: "${t_id}", sku: "CC5-PACK", name: "Fan Pack", product_type: "BUNDLE", royalty_treatment: "STANDARD", sized: false, base_price_cents: 6000, bundle_components: [ { component_product_id: "${po_id}", qty_per_bundle: 1 }, { component_product_id: "${st_id}", qty_per_bundle: 2 } ] }
              as: TourManager
              as_user_id: "tm-1"
              captures: { bun_id: $.data.id }
            - call: "POST /merch/online-orders"
              payload: { tour_id: "${t_id}", product_id: "${bun_id}", quantity: 10 }
              as: TourManager
              as_user_id: "tm-1"
              captures: { o_id: $.data.id }
          trigger:
            - call: "POST /merch/online-orders/${o_id}/fulfill"
              payload: {}
              as: TourManager
              as_user_id: "tm-1"
          assert:
            - "Product.${po_id}.warehouse_stock_by_size.OS == 90 (100 - 10 x 1)"
            - "Product.${st_id}.warehouse_stock_by_size.OS == 180 (200 - 10 x 2)"
            - "OnlineOrder.${o_id}: gross_cents == 60000, artist_royalty_final_cents == 6000, status == FULFILLED"

      - name: variance_override_only_tourmanager
        claim_type: rate_threshold_triggers
        grounds: ["validations[priority=8.5]", state_machines.SellerSession.COUNTED_OUT_to_VERIFIED]
        distinguishing_aspect: "Over-tolerance variance blocks a Seller verifier even when they pass variance_override=true (ERR_VARIANCE_OVERRIDE_REQUIRED); only a TourManager override verifies the same session."
        test_recipe:
          setup: ["ACTIVE tour (tolerance 1000); OPEN show; seller A session with cash sale 100 units @4000 (expected 405000), counted 410000 (variance +5000); seller B rostered"]
          setup_api_calls:
            - call: "POST /merch/tours"
              payload: { name: "CC6 Tour", artist_name: "Artist", cash_variance_tolerance_cents: 1000, standard_rate_bps: 1000, tier_threshold_cents: 500000, tier_bonus_bps: 500, licensed_flat_per_unit_cents: 500, licensed_rate_bps: 2000 }
              as: TourManager
              as_user_id: "tm-1"
              captures: { t_id: $.data.id }
            - call: "POST /merch/tours/${t_id}/activate"
              payload: {}
              as: TourManager
              as_user_id: "tm-1"
            - call: "POST /merch/shows"
              payload: { tour_id: "${t_id}", city: "Moab", venue_name: "CC6 Hall", show_date: "2026-09-22T20:00:00Z", commission_mode: "FLAT", flat_commission_bps: 1500 }
              as: TourManager
              as_user_id: "tm-1"
              captures: { s_id: $.data.id }
            - call: "POST /merch/products"
              payload: { tour_id: "${t_id}", sku: "CC6-TEE", name: "Tee", product_type: "REGULAR", royalty_treatment: "STANDARD", sized: false, base_price_cents: 4000, initial_stock_by_size: { OS: 500 } }
              as: TourManager
              as_user_id: "tm-1"
              captures: { p_id: $.data.id }
            - call: "POST /merch/show-products"
              payload: { show_id: "${s_id}", product_id: "${p_id}", price_cents: 4000 }
              as: TourManager
              as_user_id: "tm-1"
            - call: "POST /merch/shows/${s_id}/allocations/generate"
              payload: { product_id: "${p_id}", total_units: 200 }
              as: TourManager
              as_user_id: "tm-1"
              captures: { a_id: "$.data[0].id" }
            - call: "POST /merch/sellers"
              payload: { tour_id: "${t_id}", display_name: "Seller A", seller_code: "CC6-A" }
              as: TourManager
              as_user_id: "tm-1"
              captures: { sl_a: $.data.id }
            - call: "POST /merch/sellers"
              payload: { tour_id: "${t_id}", display_name: "Seller B", seller_code: "CC6-B" }
              as: TourManager
              as_user_id: "tm-1"
              captures: { sl_b: $.data.id }
            - call: "POST /merch/shows/${s_id}/open"
              payload: {}
              as: TourManager
              as_user_id: "tm-1"
            - call: "POST /merch/seller-sessions"
              payload: { show_id: "${s_id}", seller_id: "${sl_a}", cash_float_cents: 5000 }
              as: TourManager
              as_user_id: "tm-1"
              captures: { ss_id: $.data.id }
            - call: "POST /merch/sale-records"
              payload: { session_id: "${ss_id}", allocation_id: "${a_id}", quantity: 100, tender: "CASH" }
              as: Seller
              as_user_id: "${sl_a}"
            - call: "POST /merch/seller-sessions/${ss_id}/count-out"
              payload: { counted_cash_cents: 410000 }
              as: Seller
              as_user_id: "${sl_a}"
          trigger:
            - call: "POST /merch/seller-sessions/${ss_id}/verify"
              payload: { decision: "APPROVE", variance_override: true }
              as: Seller
              as_user_id: "${sl_b}"
              captures: { err: $.data.error_id }
            - call: "POST /merch/seller-sessions/${ss_id}/verify"
              payload: { decision: "APPROVE", variance_override: true }
              as: TourManager
              as_user_id: "tm-1"
          assert:
            - "Seller with override flag: err == ERR_VARIANCE_OVERRIDE_REQUIRED, HTTP 409 (override is TourManager-only)"
            - "TourManager with override flag: succeeds, SellerSession.${ss_id}.status == VERIFIED"

      - name: expected_cash_tracks_voids
        claim_type: derived_field_reconciliation
        grounds: [calculations.session_cash_reconciliation]
        excluded_because:
          difficulty_instance: sale_then_void_leaves_expected_cash_unchanged
          rationale: "The record-then-void invariant asserts expected_cash_cents returning to exactly the float baseline."

