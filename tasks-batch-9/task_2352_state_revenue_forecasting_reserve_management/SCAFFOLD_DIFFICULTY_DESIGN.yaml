            - call: "POST /revenue-sources"
              payload: { name: "Personal Income Tax", tax_type: "PIT", base_year_receipts_cents: 1234567800, elasticity_employment_bps: 4150, elasticity_wage_income_bps: 7825, elasticity_retail_bps: 640, elasticity_asset_bps: 1420, volatility_class: "MEDIUM" }
