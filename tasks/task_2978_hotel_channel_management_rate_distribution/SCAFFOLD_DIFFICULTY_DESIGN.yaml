      - name: freeze_windows_are_half_open_instants_widened_by_a_pre_buffer
        grounds:
          - endpoints[POST /distribution/channel-connections/{id}/freeze-windows]
          - entities.ConnectivityFreezeWindow.fields.effective_starts_at
          - errors[ERR_FREEZE_WINDOW_OVERLAP]
          - validations[priority=21]
        distinguishing_aspect: |
          Resource entity ConnectivityFreezeWindow: sub-day INSTANTS on a HALF-OPEN interval
          [effective_starts_at, ends_at), and the interval under test is not the one submitted - it is
          widened backwards by FREEZE_PRE_BUFFER_MINUTES 60. So two windows whose raw starts_at values
          are an hour apart still collide, the touching instant belongs to the later window, and
          ends_at itself is already thawed - the exact opposite convention from the closed inclusive
          date ranges of the two instances above.
        test_recipe:
          setup:
            - "Property HTL-SFO; room type KING with master hash 'kingv1' and 5 master images."
            - "Channel OTA1 with a HEALTHY connection."
            - "Rate plan BAR ACTIVE at 25000 (version 2 after activation) and one VERIFIED, IN_PARITY mapping BAR x OTA1 x KING."
            - "BAR is patched (ceiling 40000 -> 41000, leaving the distributed rate at 25000) so one QUEUED RATE DistributionBatch with a single QUEUED job is waiting to be dispatched."
            - "Logical clock starts at 2026-08-25T00:00:00.000Z, i.e. before every freeze window below."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-25T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /distribution/properties"
              payload: { code: "HTL-SFO", name: "Harborview SFO", currency_code: "USD", overbooking_pct_bp: 1000, booking_horizon_days: 365, mix_window_days: 30, rate_mismatch_tolerance_cents: 200, required_image_count: 5 }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /distribution/properties/${prop_id}/room-types"
              payload: { code: "KING", name: "King Room", physical_capacity_units: 10, master_description_hash: "kingv1", master_image_count: 5 }
              as: RevenueManager
              captures: { king_id: $.data.id }
            - call: "POST /distribution/properties/${prop_id}/channels"
              payload: { code: "OTA1", channel_kind: "OTA_PUBLIC", commission_bp: 1750, sell_adjustment_bp: 0 }
              as: PlatformAdmin
              captures: { ota1_id: $.data.id }
            - call: "POST /distribution/channels/${ota1_id}/connections"
              payload: { protocol: "JSON_PUSH", endpoint_url: "https://ota1.example.com/ari" }
              as: ChannelOpsEngineer
              captures: { conn_id: $.data.id }
            - call: "POST /distribution/channel-connections/${conn_id}/activate"
              payload: {}
              as: ChannelOpsEngineer
            - call: "POST /distribution/properties/${prop_id}/rate-plans"
              payload: { code: "BAR", rate_class: "PUBLIC", base_amount_cents: 25000, floor_amount_cents: 18000, ceiling_amount_cents: 40000 }
              as: RevenueManager
              captures: { bar_id: $.data.id }
            - call: "POST /distribution/rate-plans/${bar_id}/activate"
              payload: {}
              as: RevenueManager
              captures: { bar_v: $.data.version }
            - call: "POST /distribution/channel-mappings"
              payload: { rate_plan_id: "${bar_id}", channel_id: "${ota1_id}", room_type_id: "${king_id}", external_rate_code: "BAR-OTA1-KING", content_description_hash: "kingv1", content_image_count: 5 }
              as: ChannelOpsEngineer
              captures: { map_id: $.data.id }
            - call: "POST /distribution/channel-mappings/${map_id}/verify"
              payload: {}
              as: ChannelOpsEngineer
            - call: "PATCH /distribution/rate-plans/${bar_id}"
              payload: { expected_rate_plan_version: "${bar_v}", ceiling_amount_cents: 41000 }
              as: RevenueManager
            - call: "GET /distribution/distribution-batches"
              payload: { property_id: "${prop_id}", payload_kind: "RATE" }
              as: ChannelOpsEngineer
              captures: { batch_id: "$.data[0].id" }
          trigger:
            - call: "POST /distribution/channel-connections/${conn_id}/freeze-windows"
              payload: { starts_at: "2026-08-26T10:00:00.000Z", ends_at: "2026-08-26T12:00:00.000Z", reason: "MAINTENANCE" }
              as: ChannelOpsEngineer
              captures: { fw1_id: $.data.id }
            - call: "POST /distribution/channel-connections/${conn_id}/freeze-windows"
              payload: { starts_at: "2026-08-26T12:30:00.000Z", ends_at: "2026-08-26T13:30:00.000Z", reason: "CERTIFICATION" }
              as: ChannelOpsEngineer
            - call: "POST /distribution/channel-connections/${conn_id}/freeze-windows"
              payload: { starts_at: "2026-08-26T13:00:00.000Z", ends_at: "2026-08-26T14:00:00.000Z", reason: "CERTIFICATION" }
              as: ChannelOpsEngineer
              captures: { fw3_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-26T09:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /distribution/distribution-batches/${batch_id}/dispatch"
              payload: {}
              as: ChannelOpsEngineer
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-26T12:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /distribution/distribution-batches/${batch_id}/dispatch"
              payload: {}
              as: ChannelOpsEngineer
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-26T14:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /distribution/distribution-batches/${batch_id}/dispatch"
              payload: {}
              as: ChannelOpsEngineer
          assert:
            - "FW1 (10:00 -> 12:00): HTTP 201 with ConnectivityFreezeWindow.${fw1_id}.effective_starts_at == 2026-08-26T09:00:00.000Z, starts_at == 2026-08-26T10:00:00.000Z, ends_at == 2026-08-26T12:00:00.000Z, and no version field in the response (the entity is immutable)"
            - "FW2 (12:30 -> 13:30): HTTP 409 with data.error_id == ERR_FREEZE_WINDOW_OVERLAP - its buffered start 11:30 falls inside FW1's buffered [09:00, 12:00), even though the raw ranges 10:00-12:00 and 12:30-13:30 are disjoint"
            - "FW3 (13:00 -> 14:00): HTTP 201, because its buffered start 12:00 equals FW1's exclusive ends_at; ConnectivityFreezeWindow.${fw3_id}.effective_starts_at == 2026-08-26T12:00:00.000Z"
            - "GET /distribution/channel-connections/${conn_id}/freeze-windows returns total_count == 2 with data holding only FW1 and FW3"
            - "Dispatch at clock 2026-08-26T09:00:00.000Z: HTTP 409 with data.error_id == ERR_CONNECTION_FROZEN - the buffered start is inclusive, so the freeze bites a full hour before the partner's own starts_at"
            - "Dispatch at clock 2026-08-26T12:00:00.000Z: HTTP 409 with data.error_id == ERR_CONNECTION_FROZEN again - FW1 has thawed but the touching instant belongs to FW3's buffered window"
            - "After both refusals the batch is untouched: DistributionBatch.${batch_id}.batch_state == QUEUED, total_jobs == 1, applied_jobs == 0, rejected_jobs == 0, and the child job is still QUEUED with attempt_count == 0"
            - "Dispatch at clock 2026-08-26T14:00:00.000Z: HTTP 200 - ends_at is exclusive, so the connection is already thawed; the child job is APPLIED with attempt_count == 1, DistributionBatch.${batch_id}.batch_state == APPLIED with applied_jobs == 1"
            - "ChannelMapping.${map_id}.last_pushed_rate_cents == 25000 and last_push_at == 2026-08-26T14:00:00.000Z"

  # =====================================================================================
  - rule_id: compensating_invariant
    instances:

      - name: unit_conservation_survives_allotment_draw_pool_draw_cancellation_and_release
        grounds:
          - calculations.inventory_pool_state
          - state_machines.Reservation.transitions[CONFIRMED->CANCELLED]
          - state_machines.ChannelAllocation.transitions[OPEN->RELEASED]
          - entities.InventoryDay.fields.shared_pool_units
        distinguishing_aspect: |
          Conserved quantity UNITS: overbooking_ceiling_units == allocated_units + committed_units +
          shared_pool_units must hold after every single event, and the five events deliberately move
          units along DIFFERENT edges - an allotment draw moves one unit allocated->committed, a pool
          draw moves one unit shared->committed, each cancellation reverses its own edge (not merely the
          most recent one, since the cancellations run in reverse order of a different draw source), and
          the final release moves the whole remaining allotment allocated->shared.
        test_recipe:
          setup:
            - "Property HTL-SFO with overbooking_pct_bp 1000; room type KING capacity 10 -> overbooking_ceiling_units 11."
            - "Inventory day 2026-09-10 open; channels OTA1 (commission_bp 1750) and BRAND (commission_bp 0) both with HEALTHY connections; rate plan BAR ACTIVE at 25000 with no promotions."
            - "OTA1 holds an OPEN allotment of 4 units over the single date 2026-09-10, so the day starts at allocated 4 / committed 0 / shared 7 and 11 == 4 + 0 + 7."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-25T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /distribution/properties"
              payload: { code: "HTL-SFO", name: "Harborview SFO", currency_code: "USD", overbooking_pct_bp: 1000, booking_horizon_days: 365, mix_window_days: 30, rate_mismatch_tolerance_cents: 200, required_image_count: 5 }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /distribution/properties/${prop_id}/room-types"
              payload: { code: "KING", name: "King Room", physical_capacity_units: 10, master_description_hash: "kingv1", master_image_count: 5 }
              as: RevenueManager
              captures: { king_id: $.data.id }
            - call: "POST /distribution/properties/${prop_id}/channels"
              payload: { code: "OTA1", channel_kind: "OTA_PUBLIC", commission_bp: 1750 }
              as: PlatformAdmin
              captures: { ota1_id: $.data.id }
            - call: "POST /distribution/channels/${ota1_id}/connections"
              payload: { protocol: "JSON_PUSH", endpoint_url: "https://ota1.example.com/ari" }
              as: ChannelOpsEngineer
              captures: { ota1_conn_id: $.data.id }
            - call: "POST /distribution/channel-connections/${ota1_conn_id}/activate"
              payload: {}
              as: ChannelOpsEngineer
            - call: "POST /distribution/properties/${prop_id}/channels"
              payload: { code: "BRAND", channel_kind: "DIRECT_BRAND", commission_bp: 0 }
              as: PlatformAdmin
              captures: { brand_id: $.data.id }
            - call: "POST /distribution/channels/${brand_id}/connections"
              payload: { protocol: "JSON_PUSH", endpoint_url: "https://brand.example.com/ari" }
              as: ChannelOpsEngineer
              captures: { brand_conn_id: $.data.id }
            - call: "POST /distribution/channel-connections/${brand_conn_id}/activate"
              payload: {}
              as: ChannelOpsEngineer
            - call: "POST /distribution/properties/${prop_id}/rate-plans"
              payload: { code: "BAR", rate_class: "PUBLIC", base_amount_cents: 25000, floor_amount_cents: 18000, ceiling_amount_cents: 40000 }
              as: RevenueManager
              captures: { bar_id: $.data.id }
            - call: "POST /distribution/rate-plans/${bar_id}/activate"
              payload: {}
              as: RevenueManager
            - call: "POST /distribution/room-types/${king_id}/inventory-days"
              payload: { stay_date: "2026-09-10" }
              as: RevenueManager
              captures: { inv_10_id: $.data.id }
            - call: "GET /distribution/room-types/${king_id}"
              payload: {}
              as: RevenueManager
              captures: { king_v1: $.data.version }
            - call: "POST /distribution/room-types/${king_id}/allocations"
              payload: { channel_id: "${ota1_id}", allocated_units: 4, start_date: "2026-09-10", end_date: "2026-09-10", expected_room_type_version: "${king_v1}" }
              as: RevenueManager
              captures: { alloc_id: $.data.id }
          trigger:
            - call: "POST /distribution/reservations"
              payload: { channel_id: "${ota1_id}", rate_plan_id: "${bar_id}", room_type_id: "${king_id}", arrival_date: "2026-09-10", nights: 1 }
              as: RevenueManager
              captures: { res_ota1_id: $.data.id }
            - call: "POST /distribution/reservations"
              payload: { channel_id: "${brand_id}", rate_plan_id: "${bar_id}", room_type_id: "${king_id}", arrival_date: "2026-09-10", nights: 1 }
              as: RevenueManager
              captures: { res_brand_id: $.data.id }
            - call: "POST /distribution/reservations/${res_brand_id}/cancel"
              payload: {}
              as: RevenueManager
            - call: "POST /distribution/reservations/${res_ota1_id}/cancel"
              payload: {}
              as: RevenueManager
            - call: "POST /distribution/allocations/${alloc_id}/release"
              payload: {}
              as: RevenueManager
          assert:
            - "Start state: InventoryDay.${inv_10_id} == { allocated_units: 4, committed_units: 0, shared_pool_units: 7, overbooking_ceiling_units: 11, pooled_state: OPEN } and ChannelAllocation.${alloc_id}.consumed_units == 0"
            - "After the OTA1 booking, which draws from the allotment because OTA1 holds an OPEN allotment with an unconsumed unit on every night: ChannelAllocation.${alloc_id}.consumed_units == 1 and allocation_state still OPEN, InventoryDay.${inv_10_id} == { allocated_units: 3, committed_units: 1, shared_pool_units: 7 } - shared_pool_units did NOT move, and 11 == 3 + 1 + 7"
            - "After the BRAND booking, which draws from the shared pool because BRAND holds no allotment: ChannelAllocation.${alloc_id}.consumed_units is still 1, InventoryDay.${inv_10_id} == { allocated_units: 3, committed_units: 2, shared_pool_units: 6 } - allocated_units did NOT move, and 11 == 3 + 2 + 6"
            - "After cancelling the BRAND reservation: the POOL edge is reversed, InventoryDay.${inv_10_id} == { allocated_units: 3, committed_units: 1, shared_pool_units: 7 }, ChannelAllocation.${alloc_id}.consumed_units still 1, and 11 == 3 + 1 + 7"
            - "After cancelling the OTA1 reservation: the ALLOTMENT edge is reversed, ChannelAllocation.${alloc_id}.consumed_units back to 0, InventoryDay.${inv_10_id} == { allocated_units: 4, committed_units: 0, shared_pool_units: 7, pooled_state: OPEN } - byte-for-byte the start state, no drift"
            - "After the release: ChannelAllocation.${alloc_id}.allocation_state == RELEASED and InventoryDay.${inv_10_id} == { allocated_units: 0, committed_units: 0, shared_pool_units: 11, pooled_state: OPEN } - the released allotment leaves the allocated_units sum entirely, and 11 == 0 + 0 + 11"
            - "Both reservations end in reservation_state CANCELLED with cancelled_at == 2026-08-25T00:00:00.000Z, and no Restriction of origin AUTO_OVERBOOK_GUARD was ever created (the day never went OVERSOLD)"

      - name: money_conservation_survives_cancellation_while_counters_stay_monotonic
        grounds:
          - calculations.channel_revenue_ledger
          - calculations.reservation_charge_breakdown
          - state_machines.Reservation.transitions[CONFIRMED->CANCELLED]
          - entities.Channel.fields.cancellations_count
        distinguishing_aspect: |
          Conserved quantity MONEY on the channel ledger: gross_revenue_cents == net_revenue_cents +
          commission_accrued_cents after every booking and every cancellation, with per-night
          round_half_up commission that must not re-round on reversal. Crucially the compensation is
          PARTIAL by design - the money and room-night totals unwind to exactly zero while
          bookings_count and cancellations_count are monotonic and are never reversed, which is the
          opposite of the units invariant above where every field returns to its start value.
        test_recipe:
          setup:
            - "Property HTL-SFO with mix_window_days 30; room type KING capacity 10; inventory days 2026-09-10, 2026-09-11, 2026-09-12 and 2026-09-20 open."
            - "Channel OTA1 with commission_bp 1750, allows_member_rate true, geo_market_codes [US-CA] and a HEALTHY connection; its ledger starts at the EMPTY_LEDGER."
