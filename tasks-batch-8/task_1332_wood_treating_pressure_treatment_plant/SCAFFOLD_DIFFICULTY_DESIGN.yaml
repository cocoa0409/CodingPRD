              as: PlantOperator
              captures: { cycle1_id: $.data.id }
            - call: "POST /treatment-plants/${plant_id}/cylinders/${cyl_id}/cycles/${cycle1_id}/start"
              as: PlantOperator
            - call: "POST /treatment-plants/${plant_id}/cylinders/${cyl_id}/cycles/${cycle1_id}/begin-drain"
              as: PlantOperator
            - call: "POST /treatment-plants/${plant_id}/cylinders/${cyl_id}/cycles/${cycle1_id}/complete"
              payload: { gross_absorption_pcf: 0.85 }
              as: PlantOperator
            # Assay PASS so we can tag
            - call: "POST /treatment-plants/${plant_id}/charges/${charge_id}/retention-assays"
              payload:
                cycle_id: "${cycle1_id}"
                assay_method: "TITRATION"
                sample_count: 5
                mean_retention_pcf: 0.42
                min_sample_retention_pcf: 0.39
                recorded_by_agency: "PLANT_LAB"
                recorded_at: "2026-08-10T18:00:00Z"
              as: LabTechnician
            - call: "POST /treatment-plants/${plant_id}/charges/${charge_id}/drip-pad-logs"
              payload: { pad_code: "PAD-A", entered_pad_at: "2026-08-10T18:00:00Z", exited_pad_at: "2026-08-12T18:30:00Z", drip_volume_liters: 4.0 }
              as: PlantOperator
            - call: "POST /treatment-plants/${plant_id}/charges/${charge_id}/tag"
              as: PlantOperator
              captures: { charge_v_tagged: $.data.version }
            - call: "POST /treatment-plants/${plant_id}/charges/${charge_id}/warranty-registrations"
              payload: { registered_by_user_id: "op-1", warranty_term_years: 25, expected_charge_version: "${charge_v_tagged}" }
              as: PlantOperator
              captures: { warranty_id: $.data.id }
            # Now force the charge back to ASSAYED_FAIL (test-driving endpoint)
            - call: "POST /_charges/${charge_id}/force-state"
              payload: { target_status: "ASSAYED_FAIL" }
              as: ComplianceOfficer
              captures: { charge_v_after_force: $.data.version }
          trigger:
            - call: "POST /treatment-plants/${plant_id}/charges/${charge_id}/order-retreat"
              payload: { expected_charge_version: "${charge_v_after_force}" }
              as: QualityManager
              captures: { charge_v_after_retreat: $.data.version }
            - call: "GET /treatment-plants/${plant_id}/charges/${charge_id}/warranty-registrations/${warranty_id}"
              as: QualityManager
              captures: { w_status: $.data.status }
          assert:
            - "Charge.${charge_id}.status == RE_TREAT_PENDING (hop 1)"
            - "Charge.${charge_id}.version incremented from ${charge_v_after_force} to ${charge_v_after_retreat}"
            - "WarrantyRegistration.${warranty_id}.status == VOIDED_BY_RETREAT (hop 2)"
            - "Cascade is depth-2 and charge-driven; order-retreat does NOT directly touch WarrantyRegistration"

  # ===========================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_safety_priority_on_tag_endpoint
        grounds:
          - validations[priority=5]
          - validations[priority=10]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_INCISING_REQUIRED]
        distinguishing_aspect: |
          Error-category pair: state (priority 5) vs business_safety (priority 10).
          Request that violates BOTH — charge in IN_CYLINDER (wrong state) AND
          would require incising — MUST return ERR_INVALID_STATE (state wins
          because priority 5 < 10).
        test_recipe:
          setup:
            - "Plant P, Cylinder C, preservative ready"
            - "Charge Q DOUGLAS_FIR UC4B (requires_incising = true) in IN_CYLINDER"
            - "Piece NOT incised"
          setup_api_calls:
            - call: "POST /treatment-plants"
              payload: { plant_name: "P1", alsc_license_number: "A1" }
              as: ComplianceOfficer
              captures: { plant_id: $.data.id }
            - call: "POST /treatment-plants/${plant_id}/cylinders"
              payload: { cylinder_code: "C1", max_volume_mbf: 50.0, supported_process_types: ["FULL_CELL"] }
              as: PlantOperator
              captures: { cyl_id: $.data.id }
            - call: "POST /treatment-plants/${plant_id}/preservatives"
              payload: { chemical_family: "CCA", concentrate_assay_pct: 6.0, inventory_gallons: 5000, min_working_assay_pct: 5.0 }
              as: LabTechnician
              captures: { pres_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T08:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /treatment-plants/${plant_id}/cylinders/${cyl_id}/slots"
              payload: { slot_start: "2026-08-10T08:00:00Z", slot_end: "2026-08-12T23:59:00Z", slot_kind: "TREATMENT" }
              as: PlantOperator
            - call: "POST /treatment-plants/${plant_id}/cylinders/${cyl_id}/charges"
              payload:
                ownership_type: "PLANT_STOCK"
                species_group: "DOUGLAS_FIR"
                use_category: "UC4B"
                volume_mbf: 5.0
                piece_manifest: [{ piece_tag: "A", length_ft: 8, width_in: 5.5, thickness_in: 1.5 }]
              as: PlantOperator
              captures: { charge_id: $.data.id }
          trigger:
            - call: "POST /treatment-plants/${plant_id}/charges/${charge_id}/tag"
              as: PlantOperator
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_CHARGE_NOT_ASSAYED_PASS (state check fires first at priority 5)"
            - "NOT ERR_INCISING_REQUIRED (business_safety check would also fail but is lower priority 10)"

      - name: business_safety_vs_business_fiscal_priority_on_charge_create
        grounds:
          - validations[priority=6]
          - validations[priority=17]
          - errors[ERR_CYLINDER_CAPACITY_EXCEEDED]
          - errors[ERR_CUSTOMER_CREDIT_HOLD]
        distinguishing_aspect: |
          Error-category pair: business_safety (capacity, priority 6) vs
          business_fiscal (credit hold, priority 17). A charge request that
          exceeds cylinder capacity AND is for a CREDIT_HOLD customer MUST
          return ERR_CYLINDER_CAPACITY_EXCEEDED (safety first, priority 6 < 17).
          Different error-category pair than the state_vs_business_safety
          instance.
        test_recipe:
          setup:
            - "Plant P, Cylinder C (max 25 mbf)"
            - "Cylinder already has 20 mbf loaded"
            - "Customer CU in CREDIT_HOLD (balance > limit)"
            - "Attempt to load 10 mbf CUSTOM_TREAT charge for CU — exceeds capacity AND customer on credit hold"
          setup_api_calls:
            - call: "POST /treatment-plants"
              payload: { plant_name: "P1", alsc_license_number: "A1" }
              as: ComplianceOfficer
              captures: { plant_id: $.data.id }
            - call: "POST /treatment-plants/${plant_id}/cylinders"
              payload: { cylinder_code: "C1", max_volume_mbf: 25.0, supported_process_types: ["FULL_CELL"] }
              as: PlantOperator
              captures: { cyl_id: $.data.id }
            - call: "POST /treatment-plants/${plant_id}/preservatives"
              payload: { chemical_family: "CCA", concentrate_assay_pct: 6.0, inventory_gallons: 5000, min_working_assay_pct: 5.0 }
              as: LabTechnician
            - call: "POST /customers"
              payload: { customer_name: "Bad Credit Inc", credit_limit_cents: 1000 }
              as: AccountsReceivable
              captures: { cust_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T08:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /treatment-plants/${plant_id}/cylinders/${cyl_id}/slots"
              payload: { slot_start: "2026-08-10T08:00:00Z", slot_end: "2026-08-12T23:59:00Z", slot_kind: "TREATMENT" }
              as: PlantOperator
            # First load: 20 mbf PLANT_STOCK (fills most capacity)
            - call: "POST /treatment-plants/${plant_id}/cylinders/${cyl_id}/charges"
              payload:
                ownership_type: "PLANT_STOCK"
                species_group: "SYP"
                use_category: "UC3B"
                volume_mbf: 20.0
                piece_manifest: [{ piece_tag: "A", length_ft: 8, width_in: 5.5, thickness_in: 1.5 }]
              as: PlantOperator
              captures: { q1_id: $.data.id }
            # Force customer to CREDIT_HOLD: bump outstanding_balance above credit_limit
            # (Use a low-limit customer and post a warranty fee that exceeds it)
            # For simplicity: use force-state on customer or use record-payment with negative... actually force-state only on charge.
            # Better: create a small charge and register warranty that exceeds credit limit
            # Simpler: directly use force-state for customer is not available. Instead, set credit_limit = 0 initially? But that breaks charge create.
            # Actually: create customer with credit_limit = 1000 (small). Post CUSTOM_TREAT charge with warranty that exceeds limit, then force CREDIT_HOLD via
            # the natural mechanism. But we haven't done the warranty yet.
            # For test simplicity, we use a different approach: rely on the fact that CUSTOM_TREAT charge create with credit_limit=0 fails fiscal check.
            # Update: we just need to make the customer CREDIT_HOLD before the trigger.
            # Since CustomerAccount status transitions to CREDIT_HOLD only when balance > limit (system),
            # and we cannot directly set status, we'll make limit small and force an outstanding balance.
            # Skip this complexity: just create the customer with credit_limit_cents = 1 (tiny), then attempt to create a charge.
            # Actually: just creating a CUSTOM_TREAT charge for a customer with limit=1 will trigger the credit check.
            # But our test already has customer with limit=1000; we need to make outstanding > limit.
            # Solution: do a separate small CUSTOM_TREAT first that succeeds and posts a fee larger than 1000 — pushing balance over limit.
            # That requires more setup. For now, force-state is on charge only.
            # Final solution: have the trigger be on a customer with limit=0 (no setup), or simply skip the fiscal triggering setup
            # and rely on the conflict between capacity (priority 6) vs fiscal (priority 17). The test verifies ordering:
            #   capacity_exceeded error wins because safety has lower priority number.
            # To trigger BOTH failures simultaneously, we need a customer in CREDIT_HOLD.
            # Use the simplest possible mechanism: we create the customer with credit_limit_cents=1000, then create a CUSTOM_TREAT charge
            # whose warranty fee exceeds 1000. The customer's status flips to CREDIT_HOLD only AFTER the warranty posts, not before.
            # For the priority conflict test, we need a customer ALREADY in CREDIT_HOLD.
            # Workaround: temporarily set the customer limit very low via a small balance that exceeds it, then have the trigger attempt
            # a NEW charge for the same customer. To get outstanding > limit, register a warranty whose fee exceeds limit.
            # Pre-step: create a small CUSTOM_TREAT charge with UC4C 25yr that posts fee >> 1000, flipping customer to CREDIT_HOLD.
            # But cylinder capacity is already 20 mbf; the cylinder can hold 25. We have 5 mbf left.
            # The pre-charge must fit: use volume 4.0 mbf UC4C 25yr -> fee = round(round(round(9100*1.0,0)*1.18,0)*1.45,0) = round(9100*1.18)*1.45 = 10738 * 1.45 = 15570 >> 1000.
            # Then trigger the failing charge.
            - call: "POST /treatment-plants/${plant_id}/cylinders/${cyl_id}/charges"
              payload:
                customer_id: "${cust_id}"
                ownership_type: "CUSTOM_TREAT"
                species_group: "SYP"
                use_category: "UC4C"
                volume_mbf: 4.0
                piece_manifest: [{ piece_tag: "PRE", length_ft: 8, width_in: 5.5, thickness_in: 1.5 }]
              as: PlantOperator
              captures: { pre_charge_id: $.data.id }
            - call: "POST /treatment-plants/${plant_id}/cylinders/${cyl_id}/cycles"
              payload: { process_type: "FULL_CELL", preservative_id: "${pres_id}", vacuum_inhg: 25, pressure_psi: 140, pressure_minutes: 60 }
              as: PlantOperator
              captures: { pre_cyc_id: $.data.id }
            - call: "POST /treatment-plants/${plant_id}/cylinders/${cyl_id}/cycles/${pre_cyc_id}/start"
              as: PlantOperator
            - call: "POST /treatment-plants/${plant_id}/cylinders/${cyl_id}/cycles/${pre_cyc_id}/begin-drain"
              as: PlantOperator
            - call: "POST /treatment-plants/${plant_id}/cylinders/${cyl_id}/cycles/${pre_cyc_id}/complete"
              payload: { gross_absorption_pcf: 0.85 }
              as: PlantOperator
            - call: "POST /treatment-plants/${plant_id}/charges/${pre_charge_id}/retention-assays"
              payload:
                cycle_id: "${pre_cyc_id}"
                assay_method: "TITRATION"
                sample_count: 5
                mean_retention_pcf: 0.65
                min_sample_retention_pcf: 0.60
                recorded_by_agency: "PLANT_LAB"
                recorded_at: "2026-08-10T18:00:00Z"
              as: LabTechnician
            - call: "POST /treatment-plants/${plant_id}/charges/${pre_charge_id}/drip-pad-logs"
              payload: { pad_code: "PAD-A", entered_pad_at: "2026-08-10T18:00:00Z", exited_pad_at: "2026-08-12T18:30:00Z", drip_volume_liters: 1.0 }
              as: PlantOperator
            - call: "POST /treatment-plants/${plant_id}/charges/${pre_charge_id}/tag"
              as: PlantOperator
              captures: { pre_charge_v: $.data.version }
            - call: "POST /treatment-plants/${plant_id}/charges/${pre_charge_id}/warranty-registrations"
              payload: { registered_by_user_id: "op-1", warranty_term_years: 25, expected_charge_version: "${pre_charge_v}" }
              as: PlantOperator
            # Customer now has outstanding_balance ~ 15570 > credit_limit 1000 → CREDIT_HOLD
            # Cylinder now has 24 mbf used (20+4), 1 mbf free
          trigger:
            - call: "POST /treatment-plants/${plant_id}/cylinders/${cyl_id}/charges"
              payload:
                customer_id: "${cust_id}"
                ownership_type: "CUSTOM_TREAT"
                species_group: "SYP"
                use_category: "UC3B"
                volume_mbf: 5.0
                piece_manifest: [{ piece_tag: "X", length_ft: 8, width_in: 5.5, thickness_in: 1.5 }]
              as: PlantOperator
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_CYLINDER_CAPACITY_EXCEEDED (24+5=29 > 25; safety fires at priority 6)"
            - "NOT ERR_CUSTOMER_CREDIT_HOLD (fiscal check would also fail at priority 17 but is lower priority)"

  # ===========================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: cylinder_capacity_equality_allowed_boundary
        grounds:
          - calculations.cylinder_capacity_check
          - validations[priority=6]
          - errors[ERR_CYLINDER_CAPACITY_EXCEEDED]
        distinguishing_aspect: |
          Metric: volume_mbf (numeric threshold). Boundary: at exactly
          max_volume_mbf, load is ALLOWED (<= comparison). One mbf over,
          rejected. Endpoint: POST /charges. Different metric than retention
          threshold (pcf).
        test_recipe:
          setup:
            - "Plant P, Cylinder C max_volume_mbf = 10.0"
            - "No charges yet"
          setup_api_calls:
            - call: "POST /treatment-plants"
              payload: { plant_name: "P1", alsc_license_number: "A1" }
              as: ComplianceOfficer
              captures: { plant_id: $.data.id }
            - call: "POST /treatment-plants/${plant_id}/cylinders"
              payload: { cylinder_code: "C1", max_volume_mbf: 10.0, supported_process_types: ["FULL_CELL"] }
              as: PlantOperator
              captures: { cyl_id: $.data.id }
            - call: "POST /treatment-plants/${plant_id}/preservatives"
              payload: { chemical_family: "CCA", concentrate_assay_pct: 6.0, inventory_gallons: 5000, min_working_assay_pct: 5.0 }
              as: LabTechnician
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T08:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /treatment-plants/${plant_id}/cylinders/${cyl_id}/slots"
              payload: { slot_start: "2026-08-10T08:00:00Z", slot_end: "2026-08-12T23:59:00Z", slot_kind: "TREATMENT" }
              as: PlantOperator
          trigger:
            - call: "POST /treatment-plants/${plant_id}/cylinders/${cyl_id}/charges"
              payload:
                ownership_type: "PLANT_STOCK"
                species_group: "SYP"
                use_category: "UC3B"
                volume_mbf: 10.0
                piece_manifest: [{ piece_tag: "A", length_ft: 8, width_in: 5.5, thickness_in: 1.5 }]
              as: PlantOperator
              captures: { charge_id: $.data.id }
          assert:
            - "Charge created successfully at exactly max_volume_mbf (= 10.0); boundary equality allowed (<= comparison)"
            - "Charge.${charge_id}.status == IN_CYLINDER"
            - "Cylinder now has 0 mbf remaining"

      - name: retention_assay_exact_target_passes_boundary
        grounds:
          - calculations.assay_outcome_rule
          - validations[priority=8]
        distinguishing_aspect: |
          Metric: retention_pcf threshold. Boundary: mean_retention_pcf exactly
          equal to target_retention_pcf passes (>= inclusive). Also
          min_sample_retention_pcf exactly equal to pass_threshold_pcf (=0.90 *
          target) passes. Endpoint: POST /retention-assays. Different metric
          (retention pcf vs volume mbf) AND different endpoint than the
          capacity boundary instance.
        test_recipe:
          setup:
            - "Plant P, Cylinder C, preservative ready"
            - "Charge Q SYP UC3B (target_retention_pcf = 0.25), CYCLE_COMPLETE"
          setup_api_calls:
            - call: "POST /treatment-plants"
              payload: { plant_name: "P1", alsc_license_number: "A1" }
              as: ComplianceOfficer
              captures: { plant_id: $.data.id }
            - call: "POST /treatment-plants/${plant_id}/cylinders"
              payload: { cylinder_code: "C1", max_volume_mbf: 50.0, supported_process_types: ["FULL_CELL"] }
              as: PlantOperator
              captures: { cyl_id: $.data.id }
            - call: "POST /treatment-plants/${plant_id}/preservatives"
              payload: { chemical_family: "CCA", concentrate_assay_pct: 6.0, inventory_gallons: 5000, min_working_assay_pct: 5.0 }
              as: LabTechnician
              captures: { pres_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T08:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /treatment-plants/${plant_id}/cylinders/${cyl_id}/slots"
              payload: { slot_start: "2026-08-10T08:00:00Z", slot_end: "2026-08-12T23:59:00Z", slot_kind: "TREATMENT" }
              as: PlantOperator
            - call: "POST /treatment-plants/${plant_id}/cylinders/${cyl_id}/charges"
              payload:
                ownership_type: "PLANT_STOCK"
                species_group: "SYP"
                use_category: "UC3B"
                volume_mbf: 5.0
                piece_manifest: [{ piece_tag: "A", length_ft: 8, width_in: 5.5, thickness_in: 1.5 }]
              as: PlantOperator
              captures: { charge_id: $.data.id }
            - call: "POST /treatment-plants/${plant_id}/cylinders/${cyl_id}/cycles"
              payload: { process_type: "FULL_CELL", preservative_id: "${pres_id}", vacuum_inhg: 25, pressure_psi: 140, pressure_minutes: 60 }
              as: PlantOperator
              captures: { cycle_id: $.data.id }
            - call: "POST /treatment-plants/${plant_id}/cylinders/${cyl_id}/cycles/${cycle_id}/start"
              as: PlantOperator
            - call: "POST /treatment-plants/${plant_id}/cylinders/${cyl_id}/cycles/${cycle_id}/begin-drain"
              as: PlantOperator
            - call: "POST /treatment-plants/${plant_id}/cylinders/${cyl_id}/cycles/${cycle_id}/complete"
              payload: { gross_absorption_pcf: 0.5 }
              as: PlantOperator
          trigger:
            # Boundary: mean = exactly target (0.25), min_sample = exactly pass_threshold (0.225 = 0.90 * 0.25)
            - call: "POST /treatment-plants/${plant_id}/charges/${charge_id}/retention-assays"
              payload:
                cycle_id: "${cycle_id}"
                assay_method: "TITRATION"
                sample_count: 5
                mean_retention_pcf: 0.250
                min_sample_retention_pcf: 0.225
                recorded_by_agency: "PLANT_LAB"
                recorded_at: "2026-08-10T18:00:00Z"
              as: LabTechnician
              captures: { outcome: $.data.outcome }
          assert:
            - "RetentionAssay.outcome == PASS (mean 0.250 >= target 0.250, min_sample 0.225 >= pass_threshold 0.225)"
            - "Charge.${charge_id}.status == ASSAYED_PASS"
            - "Boundary >= is INCLUSIVE at both thresholds"

  # ===========================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: charge_create_gated_by_customer_status
        grounds:
          - state_machines.Charge.STAGED_to_IN_CYLINDER
          - state_machines.CustomerAccount
          - entities.Charge.fields.customer_id
          - errors[ERR_CUSTOMER_CREDIT_HOLD]
        distinguishing_aspect: |
          Entity pair: Charge → CustomerAccount. Charge cannot transition
          STAGED → IN_CYLINDER when its customer is in CREDIT_HOLD or CLOSED.
        test_recipe:
          setup:
            - "Plant P, Cylinder C, preservative ready"
            - "Customer CU with credit_limit_cents = 100; outstanding already > 100 → CREDIT_HOLD"
          setup_api_calls:
            - call: "POST /treatment-plants"
              payload: { plant_name: "P1", alsc_license_number: "A1" }
              as: ComplianceOfficer
              captures: { plant_id: $.data.id }
            - call: "POST /treatment-plants/${plant_id}/cylinders"
              payload: { cylinder_code: "C1", max_volume_mbf: 50.0, supported_process_types: ["FULL_CELL"] }
              as: PlantOperator
              captures: { cyl_id: $.data.id }
            - call: "POST /treatment-plants/${plant_id}/preservatives"
              payload: { chemical_family: "CCA", concentrate_assay_pct: 6.0, inventory_gallons: 5000, min_working_assay_pct: 5.0 }
              as: LabTechnician
              captures: { pres_id: $.data.id }
            - call: "POST /customers"
              payload: { customer_name: "Tiny Credit LLC", credit_limit_cents: 100 }
              as: AccountsReceivable
              captures: { cust_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T08:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /treatment-plants/${plant_id}/cylinders/${cyl_id}/slots"
              payload: { slot_start: "2026-08-10T08:00:00Z", slot_end: "2026-08-12T23:59:00Z", slot_kind: "TREATMENT" }
              as: PlantOperator
            # Build a small CUSTOM_TREAT charge and run through to release, posting a fee > 100 to flip customer to CREDIT_HOLD
            - call: "POST /treatment-plants/${plant_id}/cylinders/${cyl_id}/charges"
              payload:
                customer_id: "${cust_id}"
                ownership_type: "CUSTOM_TREAT"
                species_group: "SYP"
                use_category: "UC4C"
                volume_mbf: 2.0
                piece_manifest: [{ piece_tag: "P0", length_ft: 8, width_in: 5.5, thickness_in: 1.5 }]
              as: PlantOperator
              captures: { q_pre_id: $.data.id }
            - call: "POST /treatment-plants/${plant_id}/cylinders/${cyl_id}/cycles"
              payload: { process_type: "FULL_CELL", preservative_id: "${pres_id}", vacuum_inhg: 25, pressure_psi: 140, pressure_minutes: 60 }
              as: PlantOperator
              captures: { cyc_pre_id: $.data.id }
            - call: "POST /treatment-plants/${plant_id}/cylinders/${cyl_id}/cycles/${cyc_pre_id}/start"
              as: PlantOperator
            - call: "POST /treatment-plants/${plant_id}/cylinders/${cyl_id}/cycles/${cyc_pre_id}/begin-drain"
              as: PlantOperator
            - call: "POST /treatment-plants/${plant_id}/cylinders/${cyl_id}/cycles/${cyc_pre_id}/complete"
              payload: { gross_absorption_pcf: 0.85 }
              as: PlantOperator
            - call: "POST /treatment-plants/${plant_id}/charges/${q_pre_id}/retention-assays"
              payload:
                cycle_id: "${cyc_pre_id}"
                assay_method: "TITRATION"
                sample_count: 5
                mean_retention_pcf: 0.65
                min_sample_retention_pcf: 0.60
                recorded_by_agency: "PLANT_LAB"
                recorded_at: "2026-08-10T18:00:00Z"
              as: LabTechnician
            - call: "POST /treatment-plants/${plant_id}/charges/${q_pre_id}/drip-pad-logs"
              payload: { pad_code: "P", entered_pad_at: "2026-08-10T18:00:00Z", exited_pad_at: "2026-08-12T18:30:00Z", drip_volume_liters: 1.0 }
              as: PlantOperator
            - call: "POST /treatment-plants/${plant_id}/charges/${q_pre_id}/tag"
              as: PlantOperator
              captures: { q_pre_v: $.data.version }
            - call: "POST /treatment-plants/${plant_id}/charges/${q_pre_id}/warranty-registrations"
              payload: { registered_by_user_id: "op-1", warranty_term_years: 50, expected_charge_version: "${q_pre_v}" }
              as: PlantOperator
            # Customer is now CREDIT_HOLD (fee 9100*1.18*1.95 = 20942 > 100)
            - call: "POST /treatment-plants/${plant_id}/cylinders/${cyl_id}/mark-cleaned"
              as: PlantOperator
          trigger:
            - call: "POST /treatment-plants/${plant_id}/cylinders/${cyl_id}/charges"
              payload:
                customer_id: "${cust_id}"
                ownership_type: "CUSTOM_TREAT"
                species_group: "SYP"
                use_category: "UC3B"
                volume_mbf: 1.0
                piece_manifest: [{ piece_tag: "Q", length_ft: 8, width_in: 5.5, thickness_in: 1.5 }]
              as: PlantOperator
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_CUSTOMER_CREDIT_HOLD (CustomerAccount.status == CREDIT_HOLD gates Charge creation)"
            - "No charge created"

      - name: cycle_start_gated_by_preservative_status
        grounds:
          - state_machines.TreatmentCycle.SCHEDULED_to_RUNNING
          - state_machines.PreservativeConcentrate
          - entities.TreatmentCycle.fields.preservative_id
          - errors[ERR_PRESERVATIVE_QUARANTINED]
        distinguishing_aspect: |
          Entity pair: TreatmentCycle → PreservativeConcentrate. Cycle cannot
          transition SCHEDULED → RUNNING when its preservative is QUARANTINED.
          Different entity pair than Charge → CustomerAccount.
        test_recipe:
          setup:
            - "Plant P, Cylinder C, preservative CCA initially IN_STOCK"
            - "Charge Q loaded; Cycle scheduled"
            - "Preservative quarantined by lab tech"
          setup_api_calls:
            - call: "POST /treatment-plants"
              payload: { plant_name: "P1", alsc_license_number: "A1" }
              as: ComplianceOfficer
              captures: { plant_id: $.data.id }
            - call: "POST /treatment-plants/${plant_id}/cylinders"
              payload: { cylinder_code: "C1", max_volume_mbf: 50.0, supported_process_types: ["FULL_CELL"] }
              as: PlantOperator
              captures: { cyl_id: $.data.id }
            - call: "POST /treatment-plants/${plant_id}/preservatives"
              payload: { chemical_family: "CCA", concentrate_assay_pct: 6.0, inventory_gallons: 5000, min_working_assay_pct: 5.0 }
              as: LabTechnician
              captures: { pres_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T08:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /treatment-plants/${plant_id}/cylinders/${cyl_id}/slots"
              payload: { slot_start: "2026-08-10T08:00:00Z", slot_end: "2026-08-12T23:59:00Z", slot_kind: "TREATMENT" }
              as: PlantOperator
            - call: "POST /treatment-plants/${plant_id}/cylinders/${cyl_id}/charges"
              payload:
                ownership_type: "PLANT_STOCK"
                species_group: "SYP"
                use_category: "UC3B"
                volume_mbf: 5.0
                piece_manifest: [{ piece_tag: "A", length_ft: 8, width_in: 5.5, thickness_in: 1.5 }]
              as: PlantOperator
              captures: { charge_id: $.data.id }
            - call: "POST /treatment-plants/${plant_id}/cylinders/${cyl_id}/cycles"
              payload: { process_type: "FULL_CELL", preservative_id: "${pres_id}", vacuum_inhg: 25, pressure_psi: 140, pressure_minutes: 60 }
              as: PlantOperator
              captures: { cycle_id: $.data.id }
            - call: "POST /treatment-plants/${plant_id}/preservatives/${pres_id}/quarantine"
              payload: { reason: "Contamination detected" }
              as: LabTechnician
          trigger:
            - call: "POST /treatment-plants/${plant_id}/cylinders/${cyl_id}/cycles/${cycle_id}/start"
              as: PlantOperator
              captures: { err: $.data.error_id }
          assert:
            - "Response error_id == ERR_PRESERVATIVE_QUARANTINED (PreservativeConcentrate.status == QUARANTINED gates cycle start)"
            - "TreatmentCycle.${cycle_id}.status remains SCHEDULED"
            - "Cylinder status remains LOADED (did not transition to CYCLE_RUNNING)"

  # ===========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: cylinder_slot_half_open_interval_with_buffer
        grounds:
          - calculations.slot_overlap_check
          - errors[ERR_CYLINDER_SLOT_CONFLICT]
        distinguishing_aspect: |
          Resource: TreatmentCylinder. Interval semantics: half-open
          [slot_start, slot_end + buffer) with turnover buffer appended.
          Adjacency is allowed (s_new == effective_end_existing → no conflict).
          Buffer extends the blocked window beyond slot_end.
        test_recipe:
          setup:
            - "Plant P, Cylinder C"
            - "Existing slot S1: 09:00–10:00, buffer=30 → effective [09:00, 10:30)"
          setup_api_calls:
            - call: "POST /treatment-plants"
              payload: { plant_name: "P1", alsc_license_number: "A1" }
              as: ComplianceOfficer
              captures: { plant_id: $.data.id }
            - call: "POST /treatment-plants/${plant_id}/cylinders"
              payload: { cylinder_code: "C1", max_volume_mbf: 50.0, supported_process_types: ["FULL_CELL"] }
              as: PlantOperator
              captures: { cyl_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T08:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /treatment-plants/${plant_id}/cylinders/${cyl_id}/slots"
              payload: { slot_start: "2026-08-10T09:00:00Z", slot_end: "2026-08-10T10:00:00Z", slot_kind: "TREATMENT", buffer_minutes: 30 }
              as: PlantOperator
          trigger:
            # Adjacent at exactly 10:30 (effective end of S1): should be ALLOWED
            - call: "POST /treatment-plants/${plant_id}/cylinders/${cyl_id}/slots"
              payload: { slot_start: "2026-08-10T10:30:00Z", slot_end: "2026-08-10T12:00:00Z", slot_kind: "TREATMENT", buffer_minutes: 30 }
              as: PlantOperator
              captures: { slot2_id: $.data.id }
            # Overlapping 10:29 (one minute before effective end): should FAIL
            - call: "POST /treatment-plants/${plant_id}/cylinders/${cyl_id}/slots"
              payload: { slot_start: "2026-08-10T10:29:00Z", slot_end: "2026-08-10T12:00:00Z", slot_kind: "TREATMENT", buffer_minutes: 30 }
              as: PlantOperator
              captures: { err: $.data.error_id }
          assert:
            - "First trigger (10:30 start) succeeds — adjacency to effective_end (10:30) is ALLOWED (half-open semantics)"
            - "Second trigger (10:29 start) fails with ERR_CYLINDER_SLOT_CONFLICT (10:29 < 10:30 → overlap)"

      - name: quality_inspection_window_membership_check
        grounds:
          - state_machines.QualityInspection.SCHEDULED_to_IN_PROGRESS
          - errors[ERR_INSPECTION_WINDOW_MISSED]
        distinguishing_aspect: |
          Resource: QualityInspection. Interval semantics: closed-interval
          window membership — begin allowed only when now ∈
          [inspection_window_start, inspection_window_end] (both endpoints
          INCLUSIVE, not half-open). Different resource (inspection vs cylinder)
          and different interval semantics (closed-interval membership vs
          half-open overlap with buffer).
        test_recipe:
          setup:
            - "Plant P"
            - "QualityInspection scheduled with window [2026-08-10T09:00, 2026-08-10T17:00]"
          setup_api_calls:
            - call: "POST /treatment-plants"
              payload: { plant_name: "P1", alsc_license_number: "A1" }
              as: ComplianceOfficer
              captures: { plant_id: $.data.id }
            - call: "POST /treatment-plants/${plant_id}/inspections"
              payload:
                agency_code: "ALSC"
                inspection_window_start: "2026-08-10T09:00:00Z"
                inspection_window_end: "2026-08-10T17:00:00Z"
                charges_in_scope: []
                severity: "MINOR"
              as: QualityAgencyInspector
              captures: { insp_id: $.data.id }
            # Set clock BEFORE window
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T08:59:59Z" }
              as: ComplianceOfficer
          trigger:
            # Begin before window → fail
            - call: "POST /treatment-plants/${plant_id}/inspections/${insp_id}/begin"
              as: QualityAgencyInspector
              captures: { err1: $.data.error_id }
            # Begin exactly at window start → succeed (closed interval inclusive)
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T09:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /treatment-plants/${plant_id}/inspections/${insp_id}/begin"
              as: QualityAgencyInspector
              captures: { insp_status: $.data.status }
          assert:
            - "Trigger[0] (begin at 08:59:59) fails with ERR_INSPECTION_WINDOW_MISSED (now < window_start)"
            - "Trigger[1] (begin at 09:00:00 = window_start) succeeds — closed-interval lower bound INCLUSIVE"
            - "QualityInspection.${insp_id}.status == IN_PROGRESS"

  # ===========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: customer_balance_payment_invariant
        grounds:
          - entities.CustomerAccount.fields.outstanding_balance_cents
          - state_machines.CustomerAccount.CREDIT_HOLD_to_ACTIVE
          - calculations.registration_fee_calc
        distinguishing_aspect: |
          Conserved quantity: outstanding_balance_cents. Forward action:
          warranty registration posts registration_fee_cents to
          outstanding_balance. Compensating action: record-payment reduces it
          by the same amount. Invariant: balance_after_payment ==
          balance_before_registration - amount_cents.
        test_recipe:
          setup:
            - "Plant P, Cylinder C, preservative ready"
            - "Customer CU ACTIVE with credit_limit 100000000"
            - "Charge Q CUSTOM_TREAT fully processed to TAGGED"
          setup_api_calls:
            - call: "POST /treatment-plants"
              payload: { plant_name: "P1", alsc_license_number: "A1" }
              as: ComplianceOfficer
              captures: { plant_id: $.data.id }
            - call: "POST /treatment-plants/${plant_id}/cylinders"
              payload: { cylinder_code: "C1", max_volume_mbf: 50.0, supported_process_types: ["FULL_CELL"] }
              as: PlantOperator
              captures: { cyl_id: $.data.id }
            - call: "POST /treatment-plants/${plant_id}/preservatives"
              payload: { chemical_family: "CCA", concentrate_assay_pct: 6.0, inventory_gallons: 5000, min_working_assay_pct: 5.0 }
              as: LabTechnician
              captures: { pres_id: $.data.id }
            - call: "POST /customers"
              payload: { customer_name: "CU", credit_limit_cents: 100000000 }
              as: AccountsReceivable
              captures: { cust_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T08:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /treatment-plants/${plant_id}/cylinders/${cyl_id}/slots"
              payload: { slot_start: "2026-08-10T08:00:00Z", slot_end: "2026-08-12T23:59:00Z", slot_kind: "TREATMENT" }
              as: PlantOperator
            - call: "POST /treatment-plants/${plant_id}/cylinders/${cyl_id}/charges"
              payload:
                customer_id: "${cust_id}"
                ownership_type: "CUSTOM_TREAT"
                species_group: "SYP"
                use_category: "UC3B"
                volume_mbf: 5.0
                piece_manifest: [{ piece_tag: "A", length_ft: 8, width_in: 5.5, thickness_in: 1.5 }]
              as: PlantOperator
              captures: { charge_id: $.data.id }
            - call: "POST /treatment-plants/${plant_id}/cylinders/${cyl_id}/cycles"
              payload: { process_type: "FULL_CELL", preservative_id: "${pres_id}", vacuum_inhg: 25, pressure_psi: 140, pressure_minutes: 60 }
              as: PlantOperator
              captures: { cycle_id: $.data.id }
            - call: "POST /treatment-plants/${plant_id}/cylinders/${cyl_id}/cycles/${cycle_id}/start"
              as: PlantOperator
            - call: "POST /treatment-plants/${plant_id}/cylinders/${cyl_id}/cycles/${cycle_id}/begin-drain"
              as: PlantOperator
            - call: "POST /treatment-plants/${plant_id}/cylinders/${cyl_id}/cycles/${cycle_id}/complete"
              payload: { gross_absorption_pcf: 0.85 }
              as: PlantOperator
            - call: "POST /treatment-plants/${plant_id}/charges/${charge_id}/retention-assays"
              payload:
                cycle_id: "${cycle_id}"
                assay_method: "TITRATION"
                sample_count: 5
                mean_retention_pcf: 0.42
                min_sample_retention_pcf: 0.39
                recorded_by_agency: "PLANT_LAB"
                recorded_at: "2026-08-10T18:00:00Z"
              as: LabTechnician
            - call: "POST /treatment-plants/${plant_id}/charges/${charge_id}/drip-pad-logs"
              payload: { pad_code: "P", entered_pad_at: "2026-08-10T18:00:00Z", exited_pad_at: "2026-08-12T18:30:00Z", drip_volume_liters: 1.0 }
              as: PlantOperator
            - call: "POST /treatment-plants/${plant_id}/charges/${charge_id}/tag"
              as: PlantOperator
              captures: { charge_v: $.data.version }
            - call: "GET /customers/${cust_id}"
              as: AccountsReceivable
              captures: { balance_before: $.data.outstanding_balance_cents }
          trigger:
            # Forward action: register warranty (debits customer)
            - call: "POST /treatment-plants/${plant_id}/charges/${charge_id}/warranty-registrations"
              payload: { registered_by_user_id: "op-1", warranty_term_years: 25, expected_charge_version: "${charge_v}" }
              as: PlantOperator
              captures: { fee: $.data.registration_fee_cents }
            - call: "GET /customers/${cust_id}"
              as: AccountsReceivable
              captures: { balance_after_reg: $.data.outstanding_balance_cents }
            # Compensating action: record-payment of exactly the fee
            - call: "POST /customers/${cust_id}/record-payment"
              payload: { amount_cents: "${fee}" }
              as: AccountsReceivable
            - call: "GET /customers/${cust_id}"
              as: AccountsReceivable
              captures: { balance_after_pay: $.data.outstanding_balance_cents }
          assert:
            - "balance_after_reg == balance_before + fee"
            - "balance_after_pay == balance_before (payment fully compensates registration)"
            - "Invariant: balance_after_pay == balance_before"

      - name: cylinder_loaded_volume_invariant_via_charge_scrap
        grounds:
          - calculations.cylinder_capacity_check
          - entities.TreatmentCylinder.fields.max_volume_mbf
          - state_machines.Charge.RE_TREAT_PENDING_to_SCRAPPED
        distinguishing_aspect: |
          Conserved quantity: current_loaded_mbf on cylinder (sum of
          volume_mbf over charges in {IN_CYLINDER, CYCLE_COMPLETE}). Forward
          action: charge load adds volume_mbf to the cylinder's loaded sum.
          Compensating action: charge scrap removes it. Invariant: after load
          then scrap, current_loaded_mbf returns to the pre-load value.
          Different conserved quantity than customer balance (volume vs cents).
        test_recipe:
          setup:
            - "Plant P, Cylinder C max 50 mbf, 20 mbf already loaded"
            - "A 5 mbf charge Q ASSAYED_FAIL with FAIL_GROSS outcome (cannot be retreated, must scrap)"
          setup_api_calls:
            - call: "POST /treatment-plants"
              payload: { plant_name: "P1", alsc_license_number: "A1" }
              as: ComplianceOfficer
              captures: { plant_id: $.data.id }
            - call: "POST /treatment-plants/${plant_id}/cylinders"
              payload: { cylinder_code: "C1", max_volume_mbf: 50.0, supported_process_types: ["FULL_CELL"] }
              as: PlantOperator
              captures: { cyl_id: $.data.id }
            - call: "POST /treatment-plants/${plant_id}/preservatives"
              payload: { chemical_family: "CCA", concentrate_assay_pct: 6.0, inventory_gallons: 5000, min_working_assay_pct: 5.0 }
              as: LabTechnician
              captures: { pres_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T08:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /treatment-plants/${plant_id}/cylinders/${cyl_id}/slots"
              payload: { slot_start: "2026-08-10T08:00:00Z", slot_end: "2026-08-12T23:59:00Z", slot_kind: "TREATMENT" }
              as: PlantOperator
            # First charge 20 mbf
            - call: "POST /treatment-plants/${plant_id}/cylinders/${cyl_id}/charges"
              payload:
                ownership_type: "PLANT_STOCK"
                species_group: "SYP"
                use_category: "UC3B"
                volume_mbf: 20.0
                piece_manifest: [{ piece_tag: "A", length_ft: 8, width_in: 5.5, thickness_in: 1.5 }]
              as: PlantOperator
              captures: { q1_id: $.data.id }
            # Second charge 5 mbf — this will fail gross
            - call: "POST /treatment-plants/${plant_id}/cylinders/${cyl_id}/charges"
              payload:
                ownership_type: "PLANT_STOCK"
                species_group: "SYP"
                use_category: "UC3B"
                volume_mbf: 5.0
                piece_manifest: [{ piece_tag: "B", length_ft: 8, width_in: 5.5, thickness_in: 1.5 }]
              as: PlantOperator
              captures: { q2_id: $.data.id }
            # Force Q2 through cycle to CYCLE_COMPLETE
            - call: "POST /_charges/${q2_id}/force-state"
              payload: { target_status: "CYCLE_COMPLETE" }
              as: ComplianceOfficer
            - call: "POST /treatment-plants/${plant_id}/cylinders/${cyl_id}/cycles"
              payload: { process_type: "FULL_CELL", preservative_id: "${pres_id}", vacuum_inhg: 25, pressure_psi: 140, pressure_minutes: 60 }
              as: PlantOperator
              captures: { cycle_id: $.data.id }
            # Record FAIL_GROSS assay on Q2
            - call: "POST /treatment-plants/${plant_id}/charges/${q2_id}/retention-assays"
              payload:
                cycle_id: "${cycle_id}"
                assay_method: "TITRATION"
                sample_count: 5
                mean_retention_pcf: 0.10
                min_sample_retention_pcf: 0.08
                recorded_by_agency: "PLANT_LAB"
                recorded_at: "2026-08-10T18:00:00Z"
              as: LabTechnician
              captures: { outcome: $.data.outcome }
            # Now Q2 is ASSAYED_FAIL with outcome FAIL_GROSS; must go RE_TREAT_PENDING then SCRAPPED
            - call: "GET /treatment-plants/${plant_id}/charges/${q2_id}"
              as: QualityManager
              captures: { q2_v: $.data.version }
            - call: "POST /treatment-plants/${plant_id}/charges/${q2_id}/order-retreat"
              payload: { expected_charge_version: "${q2_v}" }
              as: QualityManager
              captures: { err_retreat: $.data.error_id }
            # Retreat fails because outcome was FAIL_GROSS — so scrap directly
            # But scrap requires RE_TREAT_PENDING state per state machine. Force it.
            - call: "POST /_charges/${q2_id}/force-state"
              payload: { target_status: "RE_TREAT_PENDING" }
              as: ComplianceOfficer
          trigger:
            - call: "POST /treatment-plants/${plant_id}/charges/${q2_id}/scrap"
              as: QualityManager
            - call: "GET /treatment-plants/${plant_id}/cylinders/${cyl_id}"
              as: PlantOperator
              captures: { cyl_after: $.data }
          assert:
            - "Before scrap: cylinder has 25 mbf loaded (20 + 5)"
            - "After scrap: current_loaded_mbf back to 20 (only Q1 remains)"
            - "Invariant: scrap restores loaded volume to pre-load baseline"
            - "Charge.${q2_id}.status == SCRAPPED"
