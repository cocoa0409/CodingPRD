            - call: "POST /rmd/customers/${cust_id}/origination-actions"
              payload: { action: "ENABLE" }
              as: ProviderAdmin
              as_user_id: "${prov_id}"
            - call: "POST /rmd/blocking-events"
              payload: { provider_id: "${prov_id}", customer_id: "${cust_id}", calling_number: "+12025551901", analytics_score: 0.7000, reason: "ANALYTICS_SCORE" }
              as: FraudAnalyst
              as_user_id: "fraud-1"
              captures: { evt_id: $.data.id }
            - call: "POST /rmd/blocking-disputes"
              payload: { blocking_event_id: "${evt_id}", claim_note: "First claim of legitimacy" }
