scenario: "Senior Center & Congregate Programs: registration & demographics, activity/class calendar & signup, congregate-meal reservation & count, transportation linkage, donation vs grant-funded units, volunteer-hour tracking, evidence-based wellness program, OAA reporting"
domain_name: "senior-center-congregate"
api_prefix: ""   # flat topology: all resource collections are top-level siblings

complexity_profile:
  primary_archetype: "Quota / allocation"      # finite grant funds + donation pool waterfall over billable units of service
  secondary_archetype: "Temporal windowing"     # room/vehicle interval scheduling with distinct overlap semantics
  complexity_layers:
    - optimistic_concurrency        # OCC on GrantAward.version and MealServiceDay.version for finite-pool CREATE races
    - cascading_side_effects        # grant suspend -> reverse allocations -> participant ledger; participant deactivate -> cancel reservations -> service-day counts
    - dual_variant_calculation      # provisional vs final reimbursable meal count; projected vs final wellness graduation
    - derived_field_reconciliation  # available_cents, reserved_count, available_seats, funded_cents kept consistent with source rows
  entity_topology: flat             # peer entities linked by foreign keys, no nested resource URLs
  state_machine_shape: cyclic       # GrantAward ACTIVE<->SUSPENDED and WellnessEnrollment ACTIVE<->LAPSED loops
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: peer_roles            # CenterAdmin, Coordinator, Participant (entity-backed self-service), Auditor
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Participant
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Participant legal name"
      - name: birth_date
        type: datetime
        source: input
        description: "Date of birth (ISO 8601); drives OAA age computation against the logical clock"
      - name: gender
        type: enum
        source: input
        description: "Self-reported gender for OAA demographics"
        constraints: "one of {FEMALE, MALE, OTHER, DECLINED}"
      - name: ethnicity
        type: enum
        source: input
        description: "OAA Hispanic-origin category"
        constraints: "one of {HISPANIC, NON_HISPANIC, DECLINED}"
      - name: race
        type: enum
        source: input
        description: "OAA race category"
        constraints: "one of {WHITE, BLACK, ASIAN, NATIVE, PACIFIC, MULTI, DECLINED}"
      - name: poverty_status
        type: enum
        source: input
        description: "Self-declared poverty status (OAA prohibits means testing; self-report only)"
        constraints: "one of {BELOW, AT_OR_ABOVE, DECLINED}"
      - name: lives_alone
        type: boolean
        source: input
        description: "OAA social-isolation indicator"
      - name: rural
        type: boolean
        source: input
        description: "OAA rural-residence indicator"
      - name: veteran
        type: boolean
        source: input
        description: "OAA veteran indicator"
      - name: disability_count
        type: integer
        source: input
        description: "Number of self-reported ADL/IADL limitations"
        default: 0
      - name: status
        type: enum
        source: system
        description: "Lifecycle status; ACTIVE at registration"
        default: "ACTIVE"
        constraints: "one of {ACTIVE, INACTIVE}"
      - name: funded_cents
        type: integer
        source: computed
        description: "Maintained ledger: sum of grant_amount_cents+donation_amount_cents over this participant's FundedService rows with status==APPLIED"
        default: 0
      - name: age
        type: integer
        source: computed
        description: "Whole years between birth_date and the logical clock's current UTC date"

  - name: GrantAward
    parent: null
    common_fields: true
    fields:
      - name: title
        type: string
        source: input
        description: "Grant award title"
      - name: oaa_title
        type: enum
        source: input
        description: "Older Americans Act funding title"
        constraints: "one of {IIIB, IIIC1, IIIC2, IIID, IIIE}"
      - name: category
        type: enum
        source: input
        description: "Service category this grant funds"
        constraints: "one of {CONGREGATE_MEAL, TRANSPORTATION, WELLNESS, ACTIVITY}"
      - name: authorized_cents
        type: integer
        source: input
        description: "Total funds authorized under the award, in cents"
        constraints: "> 0"
      - name: committed_cents
        type: integer
        source: computed
        description: "Cents committed to APPLIED FundedService allocations drawing on this grant"
        default: 0
      - name: available_cents
        type: integer
        source: computed
        description: "authorized_cents - committed_cents; initialized to authorized_cents at creation"
      - name: status
        type: enum
        source: system
        description: "Award lifecycle; DRAFT at creation"
        default: "DRAFT"
        constraints: "one of {DRAFT, ACTIVE, SUSPENDED}"

  - name: Donation
    parent: null
    common_fields: true
    fields:
      - name: donor_name
        type: string
        source: input
        description: "Donor display name"
      - name: category
        type: enum
        source: input
        description: "Category the donation is earmarked for; UNRESTRICTED funds any category"
        constraints: "one of {CONGREGATE_MEAL, TRANSPORTATION, WELLNESS, ACTIVITY, UNRESTRICTED}"
      - name: amount_cents
        type: integer
        source: input
        description: "Original donation amount in cents"
        constraints: "> 0"
      - name: remaining_cents
        type: integer
        source: computed
        description: "Unspent donation balance; initialized to amount_cents, decremented as FundedService allocations draw on it"
      - name: restricted
        type: boolean
        source: computed
        description: "True when category != UNRESTRICTED"

  - name: FundedService
    parent: null
    common_fields: true
    fields:
      - name: participant_id
        type: string
        source: input
        description: "FK -> Participant.id; the recipient of the service"
      - name: category
        type: enum
        source: input
        description: "OAA service category of this delivered unit"
        constraints: "one of {CONGREGATE_MEAL, TRANSPORTATION, WELLNESS, ACTIVITY}"
      - name: quantity
        type: integer
        source: input
        description: "Number of countable OAA units delivered (e.g. meals served, one-way trips)"
        constraints: ">= 1"
      - name: service_date
        type: datetime
        source: input
        description: "Date the service was delivered (ISO 8601)"
      - name: grant_award_id
        type: string
        source: input
        description: "FK -> GrantAward.id; primary funding source, drawn first by the waterfall"
      - name: donation_id
        type: string
        source: input
        description: "FK -> Donation.id; supplemental funding source drawn after the grant; null when none supplied"
      - name: billable_cents
        type: integer
        source: computed
        description: "quantity * UNIT_COST_CENTS[category] (constants in 1.3 funding_waterfall)"
      - name: grant_amount_cents
        type: integer
        source: computed
        description: "Cents funded from the grant by the waterfall"
      - name: donation_amount_cents
        type: integer
        source: computed
        description: "Cents funded from the donation by the waterfall"
      - name: unfunded_amount_cents
        type: integer
        source: computed
        description: "Residual cents the waterfall could not cover"
      - name: funding_status
        type: enum
        source: computed
        description: "FUNDED when unfunded_amount_cents==0; UNFUNDED when nothing was applied; else PARTIALLY_FUNDED"
        constraints: "one of {FUNDED, PARTIALLY_FUNDED, UNFUNDED}"
      - name: status
        type: enum
        source: system
        description: "APPLIED on creation; REVERSED after compensation"
        default: "APPLIED"
        constraints: "one of {APPLIED, REVERSED}"

  - name: Room
    parent: null
    common_fields: false
    fields:
      - name: name
        type: string
        source: input
        description: "Room display name"
      - name: capacity
        type: integer
        source: input
        description: "Maximum seats"
        constraints: ">= 1"

  - name: ActivitySession
    parent: null
    common_fields: true
    fields:
      - name: title
        type: string
        source: input
        description: "Class/activity title"
      - name: category
        type: enum
        source: input
        description: "Programmatic category of the session"
        default: "ACTIVITY"
        constraints: "one of {ACTIVITY, WELLNESS}"
      - name: room_id
        type: string
        source: input
        description: "FK -> Room.id; the room the session occupies"
      - name: starts_at
        type: datetime
        source: input
        description: "Session start (ISO 8601)"
      - name: ends_at
        type: datetime
        source: input
        description: "Session end (ISO 8601); must be > starts_at"
      - name: capacity
        type: integer
        source: input
        description: "Maximum confirmed signups"
        constraints: ">= 1"
      - name: enrolled_count
        type: integer
        source: computed
        description: "Count of ActivitySignup rows for this session with status==CONFIRMED"
        default: 0
      - name: status
        type: enum
        source: system
        description: "SCHEDULED at creation"
        default: "SCHEDULED"
        constraints: "one of {SCHEDULED, CANCELLED}"

  - name: ActivitySignup
    parent: null
    common_fields: true
    fields:
      - name: session_id
        type: string
        source: input
        description: "FK -> ActivitySession.id"
      - name: participant_id
        type: string
        source: input
        description: "FK -> Participant.id"
      - name: status
        type: enum
        source: system
        description: "CONFIRMED at creation"
        default: "CONFIRMED"
        constraints: "one of {CONFIRMED, CANCELLED}"

  - name: Vehicle
    parent: null
    common_fields: false
    fields:
      - name: name
        type: string
        source: input
        description: "Vehicle display name"
      - name: seat_capacity
        type: integer
        source: input
        description: "Rider seats"
        constraints: ">= 1"

  - name: TransportationRequest
    parent: null
    common_fields: true
    fields:
      - name: participant_id
        type: string
        source: input
        description: "FK -> Participant.id; rider"
      - name: vehicle_id
        type: string
        source: input
        description: "FK -> Vehicle.id; assigned vehicle"
      - name: linked_session_id
        type: string
        source: input
        description: "FK -> ActivitySession.id; the activity this ride serves"
      - name: starts_at
        type: datetime
        source: input
        description: "Pickup window start (ISO 8601)"
      - name: ends_at
        type: datetime
        source: input
        description: "Dropoff window end (ISO 8601); must be > starts_at"
      - name: eligibility_status
        type: enum
        source: system
        description: "Eligibility dimension; PENDING at creation, evolves independently of trip_status"
        default: "PENDING"
        constraints: "one of {PENDING, APPROVED}"
      - name: trip_status
        type: enum
        source: system
        description: "Operational dimension; SCHEDULED at creation once a vehicle+window is assigned, evolves independently of eligibility_status"
        default: "SCHEDULED"
        constraints: "one of {SCHEDULED, COMPLETED}"

  - name: MealServiceDay
    parent: null
    common_fields: true
    fields:
      - name: service_date
        type: datetime
        source: input
        description: "Meal service date (ISO 8601)"
      - name: site_name
        type: string
        source: input
        description: "Congregate meal site name"
      - name: capacity
        type: integer
        source: input
        description: "Maximum confirmed reservations (seats)"
        constraints: ">= 1"
      - name: reserved_count
        type: integer
        source: computed
        description: "Count of MealReservation rows for this day with status IN {CONFIRMED, CHECKED_IN}"
        default: 0
      - name: available_seats
        type: integer
        source: computed
        description: "capacity - reserved_count; initialized to capacity"
      - name: served_count
        type: integer
        source: computed
        description: "Count of MealReservation rows with status==CHECKED_IN"
        default: 0
      - name: provisional_reimbursable_units
        type: integer
        source: computed
        description: "Provisional variant of meal_reimbursable_count: count of MealReservation rows with status IN {CONFIRMED, CHECKED_IN} (forward-looking projection; equals reserved_count)"
        default: 0
      - name: final_reimbursable_units
        type: integer
        source: computed
        description: "Final variant of meal_reimbursable_count: count of MealReservation rows with status==CHECKED_IN (chronological actual)"
        default: 0
      - name: status
        type: enum
        source: system
        description: "OPEN at creation"
        default: "OPEN"
        constraints: "one of {OPEN, CLOSED}"

  - name: MealReservation
    parent: null
    common_fields: true
    fields:
      - name: service_day_id
        type: string
        source: input
        description: "FK -> MealServiceDay.id"
      - name: participant_id
        type: string
        source: input
        description: "FK -> Participant.id"
      - name: suggested_contribution_cents
        type: integer
        source: input
        description: "Voluntary participant contribution pledged for the meal (OAA: never a fee, never a means test)"
        default: 0
      - name: status
        type: enum
        source: system
        description: "CONFIRMED at creation"
        default: "CONFIRMED"
        constraints: "one of {CONFIRMED, CANCELLED, CHECKED_IN}"

  - name: WellnessProgram
    parent: null
    common_fields: true
    fields:
      - name: title
        type: string
        source: input
        description: "Evidence-based wellness program title"
      - name: model
        type: enum
        source: input
        description: "Recognized evidence-based model"
        constraints: "one of {CDSMP, DPP, ENHANCE_FITNESS, MATTER_OF_BALANCE}"
      - name: total_sessions
        type: integer
        source: input
        description: "Total sessions in the workshop series"
        constraints: ">= 1"
      - name: fidelity_min_sessions
        type: integer
        source: input
        description: "Minimum sessions attended for a fidelity-valid completion (graduation threshold)"
        constraints: ">= 1 and <= total_sessions"

  - name: WellnessEnrollment
    parent: null
    common_fields: true
    fields:
      - name: program_id
        type: string
        source: input
        description: "FK -> WellnessProgram.id"
      - name: participant_id
        type: string
        source: input
        description: "FK -> Participant.id"
      - name: sessions_attended
        type: integer
        source: computed
        description: "Count of attended sessions logged against this enrollment"
        default: 0
      - name: consecutive_absences
        type: integer
        source: computed
        description: "Running count of consecutive absence logs; reset to 0 on any attended log"
        default: 0
      - name: absences_total
        type: integer
        source: computed
        description: "Monotonic count of all absence (attended=false) logs against this enrollment"
        default: 0
      - name: projected_graduation_status
        type: enum
        source: computed
        description: "Provisional variant of wellness_completion: WILL_GRADUATE when (WellnessProgram.total_sessions - absences_total) >= fidelity_min_sessions, else AT_RISK"
        constraints: "one of {WILL_GRADUATE, AT_RISK}"
      - name: status
        type: enum
        source: system
        description: "ACTIVE at creation"
        default: "ACTIVE"
        constraints: "one of {ACTIVE, LAPSED, GRADUATED, WITHDRAWN}"

  - name: VolunteerShift
    parent: null
    common_fields: true
    fields:
      - name: volunteer_name
        type: string
        source: input
        description: "Volunteer display name (opaque grouping key for hour aggregation)"
      - name: role
        type: string
        source: input
        description: "Volunteer role for the shift (e.g. meal-server, driver)"
      - name: hours
        type: number
        source: input
        description: "Hours worked in the shift"
        constraints: "> 0"
      - name: service_date
        type: datetime
        source: input
        description: "Shift date (ISO 8601)"

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: GrantAward
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /grant-awards/{id}/activate"
        actor: CenterAdmin
        preconditions: ["status == DRAFT"]
        side_effects: ["set status = ACTIVE", "increment GrantAward.version by 1"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /grant-awards/{id}/activate"
        actor: CenterAdmin
        preconditions: ["status == SUSPENDED"]
        side_effects: ["set status = ACTIVE (resume; funds remain committed)", "increment GrantAward.version by 1"]
        note: "Closes the ACTIVE<->SUSPENDED cycle (non-linear shape)."
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /grant-awards/{id}/suspend"
        actor: CenterAdmin
        preconditions: ["status == ACTIVE"]
        side_effects:
          - "set status = SUSPENDED"
          - "CASCADE hop B: for each FundedService fs where fs.grant_award_id == this.id AND fs.status == APPLIED, set fs.status = REVERSED"
          - "each reversed fs returns fs.grant_amount_cents to this grant: committed_cents -= fs.grant_amount_cents, available_cents += fs.grant_amount_cents"
          - "each reversed fs returns fs.donation_amount_cents to its Donation.remaining_cents (when fs.donation_id is set)"
          - "each reversed fs sets fs.funding_status = UNFUNDED and fs.grant_amount_cents=0, fs.donation_amount_cents=0, fs.unfunded_amount_cents = fs.billable_cents"
          - "CASCADE hop C: each reversed fs decrements Participant.funded_cents (participant fs.participant_id) by the pre-reversal (fs.grant_amount_cents + fs.donation_amount_cents)"
          - "increment version by 1 on GrantAward, and on every mutated FundedService, Donation, and Participant"
        note: "Transitive cascade transitive_cascade/grant_suspend_unfunds_services (depth 3): GrantAward -> FundedService -> Participant."

  - entity: FundedService
    initial_state: APPLIED
    terminal_states: [REVERSED]
    transitions:
      - from: APPLIED
        to: REVERSED
        trigger: "POST /funded-services/{id}/reverse"
        actor: Coordinator
        preconditions: ["status == APPLIED"]
        side_effects:
          - "return grant_amount_cents to GrantAward: committed_cents -= grant_amount_cents, available_cents += grant_amount_cents (compensating_invariant/grant_funds_conservation)"
          - "return donation_amount_cents to Donation.remaining_cents (when donation_id set)"
          - "decrement Participant.funded_cents by (grant_amount_cents + donation_amount_cents)"
          - "set grant_amount_cents=0, donation_amount_cents=0, unfunded_amount_cents=billable_cents, funding_status=UNFUNDED"
          - "increment version by 1 on FundedService, GrantAward, Donation (if any), Participant"
        note: "Compensating action for the funding waterfall; preserves authorized_cents = committed_cents + available_cents on the grant."

  - entity: MealServiceDay
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /meal-service-days/{id}/close"
        actor: CenterAdmin
        preconditions: ["status == OPEN"]
        side_effects: ["set status = CLOSED (freezes new reservations; provisional reimbursable count fixed)", "increment MealServiceDay.version by 1"]
        note: "After CLOSED, reservation CREATE is rejected by a state precondition (ERR_SERVICE_DAY_CLOSED)."

  - entity: MealReservation
    initial_state: CONFIRMED
    terminal_states: [CANCELLED]
    transitions:
      - from: CONFIRMED
        to: CHECKED_IN
        trigger: "POST /meal-reservations/{id}/check-in"
        actor: Coordinator
        preconditions: ["status == CONFIRMED", "MealServiceDay.status IN {OPEN, CLOSED}"]
        side_effects:
          - "set status = CHECKED_IN"
          - "increment MealServiceDay.served_count by 1"
          - "increment version by 1 on MealReservation and MealServiceDay"
        note: "reserved_count is unchanged (CHECKED_IN still counts as an occupied seat)."
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /meal-reservations/{id}/cancel"
        actor: Participant
        preconditions: ["status == CONFIRMED"]
        side_effects:
          - "set status = CANCELLED"
          - "decrement MealServiceDay.reserved_count by 1, increment MealServiceDay.available_seats by 1 (compensating_invariant/meal_seat_conservation)"
          - "increment version by 1 on MealReservation and MealServiceDay"

  - entity: ActivitySession
    initial_state: SCHEDULED
    terminal_states: [CANCELLED]
    transitions:
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /activity-sessions/{id}/cancel"
        actor: Coordinator
        preconditions: ["status == SCHEDULED"]
        side_effects:
          - "set status = CANCELLED"
          - "increment ActivitySession.version by 1"
        note: "A CANCELLED session can no longer back a transport approval (cross_entity_state_dependency: TransportationRequest.approve requires linked session SCHEDULED)."

  - entity: ActivitySignup
    initial_state: CONFIRMED
    terminal_states: [CANCELLED]
    transitions:
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /activity-signups/{id}/cancel"
        actor: Participant
        preconditions: ["status == CONFIRMED"]
        side_effects: ["set status = CANCELLED", "decrement ActivitySession.enrolled_count by 1", "increment version by 1 on ActivitySignup and ActivitySession"]

  - entity: TransportationRequest
    initial_state: "eligibility_status=PENDING, trip_status=SCHEDULED"
    terminal_states: ["trip_status == COMPLETED"]
    transitions:
      - from: "eligibility_status == PENDING"
        to: "eligibility_status == APPROVED"
        trigger: "POST /transportation-requests/{id}/approve"
        actor: Coordinator
        preconditions: ["eligibility_status == PENDING", "linked ActivitySession.status == SCHEDULED (cross_entity_state_dependency)"]
        side_effects: ["set eligibility_status = APPROVED (trip_status unchanged - parallel dimension)", "increment TransportationRequest.version by 1"]
        note: "Eligibility axis; independent of trip_status."
      - from: "trip_status == SCHEDULED"
        to: "trip_status == COMPLETED"
        trigger: "POST /transportation-requests/{id}/complete"
        actor: Coordinator
        preconditions: ["trip_status == SCHEDULED", "eligibility_status == APPROVED"]
        side_effects: ["set trip_status = COMPLETED (eligibility_status unchanged - parallel dimension)", "increment TransportationRequest.version by 1"]
        note: "Operational axis; the two axes evolve independently (parallel non-linear shape)."

  - entity: WellnessEnrollment
    initial_state: ACTIVE
    terminal_states: [GRADUATED, WITHDRAWN]
    transitions:
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /wellness-enrollments/{id}/log-session with attended=true"
        actor: Coordinator
        preconditions: ["status == ACTIVE"]
        side_effects: ["increment sessions_attended by 1", "set consecutive_absences = 0", "increment WellnessEnrollment.version by 1"]
      - from: ACTIVE
        to: LAPSED
        trigger: "POST /wellness-enrollments/{id}/log-session with attended=false"
        actor: Coordinator
        preconditions: ["status == ACTIVE", "consecutive_absences + 1 >= LAPSE_ABSENCE_THRESHOLD (=2)"]
        side_effects: ["increment consecutive_absences by 1", "increment absences_total by 1", "set status = LAPSED", "increment WellnessEnrollment.version by 1"]
        note: "A single attended=false log when consecutive_absences is already 1 lapses the enrollment."
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /wellness-enrollments/{id}/log-session with attended=false (first absence)"
        actor: Coordinator
        preconditions: ["status == ACTIVE", "consecutive_absences + 1 < LAPSE_ABSENCE_THRESHOLD (=2)"]
        side_effects: ["increment consecutive_absences by 1 (stays ACTIVE)", "increment absences_total by 1", "increment WellnessEnrollment.version by 1"]
      - from: LAPSED
        to: ACTIVE
        trigger: "POST /wellness-enrollments/{id}/log-session with attended=true"
        actor: Coordinator
        preconditions: ["status == LAPSED"]
        side_effects: ["increment sessions_attended by 1", "set consecutive_absences = 0", "set status = ACTIVE (re-engagement closes the ACTIVE<->LAPSED cycle)", "increment WellnessEnrollment.version by 1"]
        note: "Non-linear cyclic shape."
      - from: ACTIVE
        to: GRADUATED
        trigger: "POST /wellness-enrollments/{id}/finalize"
        actor: Coordinator
        preconditions: ["status IN {ACTIVE, LAPSED}", "sessions_attended >= WellnessProgram.fidelity_min_sessions"]
        side_effects: ["set status = GRADUATED", "increment WellnessEnrollment.version by 1"]
        note: "Final-variant boundary: >= fidelity_min_sessions."
      - from: ACTIVE
        to: WITHDRAWN
        trigger: "POST /wellness-enrollments/{id}/finalize"
        actor: Coordinator
        preconditions: ["status IN {ACTIVE, LAPSED}", "sessions_attended < WellnessProgram.fidelity_min_sessions"]
        side_effects: ["set status = WITHDRAWN", "increment WellnessEnrollment.version by 1"]
      - from: LAPSED
        to: GRADUATED
        trigger: "POST /wellness-enrollments/{id}/finalize"
        actor: Coordinator
        preconditions: ["status == LAPSED", "sessions_attended >= WellnessProgram.fidelity_min_sessions"]
        side_effects: ["set status = GRADUATED", "increment WellnessEnrollment.version by 1"]
      - from: LAPSED
        to: WITHDRAWN
        trigger: "POST /wellness-enrollments/{id}/finalize"
        actor: Coordinator
        preconditions: ["status == LAPSED", "sessions_attended < WellnessProgram.fidelity_min_sessions"]
        side_effects: ["set status = WITHDRAWN", "increment WellnessEnrollment.version by 1"]

  - entity: Participant
    initial_state: ACTIVE
    terminal_states: [INACTIVE]
    transitions:
      - from: ACTIVE
        to: INACTIVE
        trigger: "POST /participants/{id}/deactivate"
        actor: CenterAdmin
        preconditions: ["status == ACTIVE"]
        side_effects:
          - "set status = INACTIVE"
          - "CASCADE hop B: for each MealReservation mr where mr.participant_id == this.id AND mr.status == CONFIRMED, set mr.status = CANCELLED"
          - "CASCADE hop C: each cancelled mr decrements its MealServiceDay.reserved_count by 1 and increments MealServiceDay.available_seats by 1"
          - "increment version by 1 on Participant, every cancelled MealReservation, and every affected MealServiceDay"
        note: "Transitive cascade transitive_cascade/participant_deactivate_frees_meal_seats (depth 3): Participant -> MealReservation -> MealServiceDay."

# =============================================================================
# 1.2.1 Concurrency Rules (OCC on parent version)
# =============================================================================
concurrency_rules:
  - rule_id: funded-service-create-stale-grant
    parent_entity: GrantAward
    write_endpoint: "POST /funded-services"
    occ_field: "expected_grant_award_version"
    description: |
      Creating a FundedService against a GrantAward whose version has advanced
      since the client last observed it is rejected. Another FundedService
      creation (which legitimately draws down the same finite available_cents
      pool) has since committed funds and advanced the grant's version, so the
      current writer's view of the grant is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: meal-reservation-create-stale-day
    parent_entity: MealServiceDay
    write_endpoint: "POST /meal-reservations"
    occ_field: "expected_service_day_version"
    description: |
      Creating a MealReservation against a MealServiceDay whose version has
      advanced since the client last observed it is rejected. Another
      reservation has since taken a seat from the same finite capacity and
      advanced the day's version, so the current writer's view is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: funding_waterfall
    trigger: "On POST /funded-services (creation); re-evaluated (zeroed) on POST /funded-services/{id}/reverse and on the GrantAward suspend cascade"
    algorithm: waterfall_allocation
    formula: |
      billable_cents = quantity * UNIT_COST_CENTS[category]
      # Bucket 1 - grant drawn first (grant is validated ACTIVE and category-matching before this runs)
      grant_amount_cents = min(billable_cents, grant.available_cents)
      remaining = billable_cents - grant_amount_cents
      # Bucket 2 - donation drawn second, only if a donation is supplied and its
      # category matches or is UNRESTRICTED (validated before this runs)
      if donation_id is not null:
          donation_amount_cents = min(remaining, donation.remaining_cents)
      else:
          donation_amount_cents = 0
      unfunded_amount_cents = remaining - donation_amount_cents
      if unfunded_amount_cents == 0:
          funding_status = FUNDED
      elif (grant_amount_cents + donation_amount_cents) == 0:
          funding_status = UNFUNDED
      else:
          funding_status = PARTIALLY_FUNDED
      # side effects: grant.committed_cents += grant_amount_cents;
      #   grant.available_cents -= grant_amount_cents;
      #   donation.remaining_cents -= donation_amount_cents;
      #   participant.funded_cents += (grant_amount_cents + donation_amount_cents)
    input_set: "One FundedService's grant (status==ACTIVE, category match) and optional donation (category match or UNRESTRICTED); ordered grant-then-donation."
    constants:
      UNIT_COST_CENTS: { CONGREGATE_MEAL: 850, TRANSPORTATION: 1200, WELLNESS: 1500, ACTIVITY: 400 }
    precision: "integer cents; no rounding (all inputs and outputs are whole cents)"
    variants:
      - name: on_apply
        when: "POST /funded-services"
        difference: "Commits funds forward: grant first (min with available_cents), then donation (min with remaining_cents), residual is unfunded."
      - name: on_reverse
        when: "POST /funded-services/{id}/reverse or grant suspend cascade"
        difference: "Compensating: returns grant_amount_cents and donation_amount_cents to their sources, zeroes the three amount fields, sets unfunded_amount_cents = billable_cents, funding_status = UNFUNDED."

  - name: participant_contribution_statement
    trigger: "GET /participants/{id}/contribution-statement?month=YYYY-MM"
    algorithm: aggregation
    formula: |
      meals = MealReservation rows where participant_id == id
              AND status == CHECKED_IN
              AND service_date in [first day of month 00:00:00Z, last day of month 23:59:59Z]
      per_meal_cents = round_half_up(UNIT_COST_CENTS_CONGREGATE_MEAL * CONTRIBUTION_RATE)
      # PINNED ORDER: round each meal's suggested contribution to whole cents FIRST,
      # THEN sum. (sum-then-round is NOT used and would differ.)
      total_suggested_contribution_cents = sum over meals of per_meal_cents
      meal_count = count(meals)
    input_set: "CHECKED_IN meal reservations for the participant within the requested calendar month (UTC)."
    constants:
      UNIT_COST_CENTS_CONGREGATE_MEAL: 850
      CONTRIBUTION_RATE: 0.15
    precision: "round half up to whole cents PER MEAL, then sum; rounding order is pinned (per-item, not aggregate)"

  - name: meal_reimbursable_count
    trigger: "Computed field pair on GET /meal-service-days/{id}"
    algorithm: aggregation
    formula: |
      provisional_reimbursable_units = count(MealReservation where service_day_id == day.id AND status IN {CONFIRMED, CHECKED_IN})
      final_reimbursable_units       = count(MealReservation where service_day_id == day.id AND status == CHECKED_IN)
    input_set: "All MealReservation rows for the service day; the two variants filter on different statuses."
    precision: "integer counts"
    variants:
      - name: provisional
        when: "Reported for OAA meal reimbursement projection when the day is CLOSED"
        difference: "Counts held seats (CONFIRMED or CHECKED_IN); forward-looking, includes people who reserved but have not yet attended."
      - name: final
        when: "Reported for OAA meal reimbursement after check-ins"
        difference: "Counts CHECKED_IN reservations only (actual attendance); differs from provisional by the no-shows."

  - name: wellness_completion
    trigger: "Computed field on GET /wellness-enrollments/{id}; final decided at POST /wellness-enrollments/{id}/finalize"
    algorithm: threshold
    formula: |
      # Provisional variant (optimistic: assumes the participant attends every remaining session)
      remaining_sessions = program.total_sessions - sessions_attended - absences_total
      projected_attended = sessions_attended + max(0, remaining_sessions)
                         = program.total_sessions - absences_total   (since remaining_sessions >= 0)
      projected_graduation_status = WILL_GRADUATE if (program.total_sessions - absences_total) >= program.fidelity_min_sessions else AT_RISK
      # Final variant (at finalize)
      final_graduated = (sessions_attended >= program.fidelity_min_sessions)
    input_set: "One WellnessEnrollment plus its WellnessProgram.total_sessions and fidelity_min_sessions."
    constants:
      LAPSE_ABSENCE_THRESHOLD: 2
    precision: "integer session counts; threshold uses >= (fidelity boundary)"
    variants:
      - name: projected
        when: "Any read before finalize"
        difference: "Optimistic: WILL_GRADUATE while remaining sessions could still reach fidelity_min ((total - absences_total) >= fidelity_min)."
      - name: final
        when: "POST /wellness-enrollments/{id}/finalize"
        difference: "Pessimistic: GRADUATED only if sessions_attended already >= fidelity_min; otherwise WITHDRAWN. Diverges from projected when a WILL_GRADUATE enrollment is finalized before enough sessions are actually attended."

  - name: oaa_units_report
    trigger: "GET /reports/oaa-units?category=<C>&from=<ISO>&to=<ISO>"
    algorithm: aggregation
    formula: |
      fs = FundedService rows where category == C AND status == APPLIED
           AND service_date in [from, to]  (inclusive both ends)
      total_units          = sum(fs.quantity)
      total_billable_cents = sum(fs.billable_cents)
      grant_funded_cents   = sum(fs.grant_amount_cents)
      donation_funded_cents= sum(fs.donation_amount_cents)
      unfunded_cents       = sum(fs.unfunded_amount_cents)
      if total_units > 0:
          cost_per_unit_cents = round_half_up(total_billable_cents / total_units)
      else:
          cost_per_unit_cents = 0    # empty-set boundary: no division by zero
    input_set: "APPLIED FundedService rows in the given category and inclusive [from, to] service_date window; REVERSED rows are excluded."
    precision: "round half up to whole cents for cost_per_unit_cents; counts are integers"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Acting role is permitted for the operation per 1.7; for Participant-owned self-service writes, X-User-ID must equal the target participant_id"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "All ids in the path and all FK ids in the body resolve to existing entities, validated left-to-right"
    error_id: "ERR_*_NOT_FOUND (entity-specific)"
    http_status: 404
    applies_to: "all"
  - priority: 4
    category: state
    check: "OCC: expected_<parent>_version equals the parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /funded-services, POST /meal-reservations"
  - priority: 5
    category: state
    check: "Target resource is in a state permitting the transition (e.g. grant ACTIVE for funding; day OPEN for reservations; enrollment ACTIVE/LAPSED for finalize; participant ACTIVE for self-service writes)"
    error_id: "ERR_INVALID_STATE / ERR_GRANT_NOT_ACTIVE / ERR_SERVICE_DAY_CLOSED / ERR_SESSION_NOT_SCHEDULED / ERR_PARTICIPANT_INACTIVE"
    http_status: 409
    applies_to: "all state-changing endpoints"
  - priority: 6
    category: business_temporal
    check: "Time-window validity: starts_at < ends_at for sessions and transport; activity signup only before the session's starts_at (logical clock)"
    error_id: "ERR_INVALID_TIME_WINDOW / ERR_SIGNUP_CLOSED"
    http_status: 422
    applies_to: "POST /activity-sessions, POST /transportation-requests, POST /activity-signups"
  - priority: 7
    category: business_constraint
    check: "Resource overlap and capacity/uniqueness: room double-booking, vehicle overlap with turnaround buffer, session capacity full, duplicate active signup"
    error_id: "ERR_ROOM_DOUBLE_BOOKED / ERR_VEHICLE_UNAVAILABLE / ERR_SESSION_FULL / ERR_DUPLICATE_SIGNUP"
    http_status: 409
    applies_to: "POST /activity-sessions, POST /transportation-requests, POST /activity-signups"
  - priority: 8
    category: business_referential
    check: "Funding category coherence: FundedService.category must equal grant.category; donation.category must equal FundedService.category or be UNRESTRICTED"
    error_id: "ERR_GRANT_CATEGORY_MISMATCH / ERR_DONATION_CATEGORY_MISMATCH"
    http_status: 422
    applies_to: "POST /funded-services"
  - priority: 9
    category: business_fiscal
    check: "Meal seat capacity: a new reservation requires reserved_count < capacity on the service day"
    error_id: ERR_MEAL_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /meal-reservations"
  - priority: 10
    category: business_constraint
    check: "Duplicate active meal reservation: same participant may not hold two CONFIRMED/CHECKED_IN reservations for the same service day"
    error_id: ERR_DUPLICATE_RESERVATION
    http_status: 409
    applies_to: "POST /meal-reservations"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Participant ----
  - method: POST
    path: "/participants"
    description: "Register a participant with OAA demographics"
    roles: [CenterAdmin, Coordinator]
    code: 201
    input: [full_name, birth_date, gender, ethnicity, race, poverty_status, lives_alone, rural, veteran, "disability_count?"]
    output: Participant
    side_effects: ["status = ACTIVE", "funded_cents = 0"]
  - method: GET
    path: "/participants/{id}"
    description: "Fetch a participant"
    roles: [CenterAdmin, Coordinator, Participant, Auditor]
    code: 200
    input: []
    output: Participant
  - method: POST
    path: "/participants/{id}/deactivate"
    description: "Deactivate a participant; cascades cancellation of their CONFIRMED meal reservations"
    roles: [CenterAdmin]
    code: 200
    input: []
    output: Participant
    side_effects: ["status = INACTIVE", "cascade transitive_cascade/participant_deactivate_frees_meal_seats"]
  - method: GET
    path: "/participants/{id}/contribution-statement"
    description: "Monthly voluntary-contribution statement (participant_contribution_statement calc)"
    roles: [CenterAdmin, Coordinator, Participant, Auditor]
    code: 200
    input: [month]
    output: { total_suggested_contribution_cents: integer, meal_count: integer }

  # ---- GrantAward ----
  - method: POST
    path: "/grant-awards"
    description: "Create a grant award (DRAFT)"
    roles: [CenterAdmin]
    code: 201
    input: [title, oaa_title, category, authorized_cents]
    output: GrantAward
    side_effects: ["status = DRAFT", "committed_cents = 0", "available_cents = authorized_cents"]
  - method: GET
    path: "/grant-awards/{id}"
    description: "Fetch a grant award"
    roles: [CenterAdmin, Coordinator, Auditor]
    code: 200
    input: []
    output: GrantAward
  - method: POST
    path: "/grant-awards/{id}/activate"
    description: "Activate a DRAFT grant or resume a SUSPENDED grant (ACTIVE<->SUSPENDED cycle)"
    roles: [CenterAdmin]
    code: 200
    input: []
    output: GrantAward
    side_effects: ["status = ACTIVE", "increment GrantAward.version by 1"]
  - method: POST
    path: "/grant-awards/{id}/suspend"
    description: "Suspend an ACTIVE grant; cascades reversal of its APPLIED funded services"
    roles: [CenterAdmin]
    code: 200
    input: []
    output: GrantAward
    side_effects: ["status = SUSPENDED", "cascade transitive_cascade/grant_suspend_unfunds_services", "increment GrantAward.version by 1"]

  # ---- Donation ----
  - method: POST
    path: "/donations"
    description: "Record a donation into the funding pool"
    roles: [CenterAdmin]
    code: 201
    input: [donor_name, category, amount_cents]
    output: Donation
    side_effects: ["remaining_cents = amount_cents", "restricted = (category != UNRESTRICTED)"]
  - method: GET
    path: "/donations/{id}"
    description: "Fetch a donation"
    roles: [CenterAdmin, Coordinator, Auditor]
    code: 200
    input: []
    output: Donation

  # ---- FundedService (OAA unit + funding waterfall) ----
  - method: POST
    path: "/funded-services"
    description: "Record a delivered OAA unit and run the grant-then-donation funding waterfall (OCC on grant version)"
    roles: [CenterAdmin, Coordinator]
    code: 201
    input: [participant_id, category, quantity, service_date, grant_award_id, "donation_id?", expected_grant_award_version]
    output: FundedService
    side_effects: ["funding_waterfall (on_apply)", "GrantAward.committed_cents += grant_amount_cents; available_cents -= grant_amount_cents", "Donation.remaining_cents -= donation_amount_cents", "Participant.funded_cents += (grant_amount_cents + donation_amount_cents)", "increment GrantAward.version by 1"]
  - method: GET
    path: "/funded-services/{id}"
    description: "Fetch a funded service"
    roles: [CenterAdmin, Coordinator, Auditor]
    code: 200
    input: []
    output: FundedService
  - method: GET
    path: "/funded-services"
    description: "List funded services; filter by participant, grant, donation, or category"
    roles: [CenterAdmin, Coordinator, Auditor]
    code: 200
    input: ["participant_id?", "grant_award_id?", "donation_id?", "category?", "limit?", "offset?"]
    output: FundedService[]
  - method: POST
    path: "/funded-services/{id}/reverse"
    description: "Reverse an APPLIED funded service; compensating funding_waterfall (returns funds, conserves grant totals)"
    roles: [CenterAdmin, Coordinator]
    code: 200
    input: []
    output: FundedService
    side_effects: ["funding_waterfall (on_reverse)", "return funds to GrantAward and Donation", "Participant.funded_cents -= returned amount", "increment version on FundedService, GrantAward, Donation, Participant"]

  # ---- Room + ActivitySession + ActivitySignup ----
  - method: POST
    path: "/rooms"
    description: "Create a room resource"
    roles: [CenterAdmin]
    code: 201
    input: [name, capacity]
    output: Room
  - method: POST
    path: "/activity-sessions"
    description: "Schedule an activity/class session in a room (half-open room-overlap check)"
    roles: [CenterAdmin, Coordinator]
    code: 201
    input: [title, "category?", room_id, starts_at, ends_at, capacity]
    output: ActivitySession
    side_effects: ["status = SCHEDULED", "enrolled_count = 0", "resource_temporal_overlap/room_half_open check"]
  - method: GET
    path: "/activity-sessions/{id}"
    description: "Fetch an activity session"
    roles: [CenterAdmin, Coordinator, Participant, Auditor]
    code: 200
    input: []
    output: ActivitySession
  - method: GET
    path: "/activity-sessions"
    description: "List activity sessions; filter by room"
    roles: [CenterAdmin, Coordinator, Participant, Auditor]
    code: 200
    input: ["room_id?", "limit?", "offset?"]
    output: ActivitySession[]
  - method: POST
    path: "/activity-sessions/{id}/cancel"
    description: "Cancel a scheduled session"
    roles: [CenterAdmin, Coordinator]
    code: 200
    input: []
    output: ActivitySession
    side_effects: ["status = CANCELLED", "increment ActivitySession.version by 1"]
  - method: POST
    path: "/activity-signups"
    description: "Sign a participant up for a session (temporal cutoff + capacity checks)"
    roles: [Participant, Coordinator]
    code: 201
    input: [session_id, participant_id]
    output: ActivitySignup
    side_effects: ["status = CONFIRMED", "increment ActivitySession.enrolled_count by 1", "increment ActivitySession.version by 1"]
  - method: GET
    path: "/activity-signups/{id}"
    description: "Fetch a signup"
    roles: [CenterAdmin, Coordinator, Participant, Auditor]
    code: 200
    input: []
    output: ActivitySignup
  - method: GET
    path: "/activity-signups"
    description: "List signups; filter by session or participant"
    roles: [CenterAdmin, Coordinator, Participant, Auditor]
    code: 200
    input: ["session_id?", "participant_id?", "limit?", "offset?"]
    output: ActivitySignup[]
  - method: POST
    path: "/activity-signups/{id}/cancel"
    description: "Cancel a confirmed signup, freeing a seat"
    roles: [Participant, Coordinator]
    code: 200
    input: []
    output: ActivitySignup
    side_effects: ["status = CANCELLED", "decrement ActivitySession.enrolled_count by 1", "increment version on signup and session"]

  # ---- Vehicle + TransportationRequest ----
  - method: POST
    path: "/vehicles"
    description: "Create a vehicle resource"
    roles: [CenterAdmin]
    code: 201
    input: [name, seat_capacity]
    output: Vehicle
  - method: POST
    path: "/transportation-requests"
    description: "Request a ride to an activity on a vehicle (buffered vehicle-overlap check)"
    roles: [Participant, Coordinator]
    code: 201
    input: [participant_id, vehicle_id, linked_session_id, starts_at, ends_at]
    output: TransportationRequest
    side_effects: ["eligibility_status = PENDING", "trip_status = SCHEDULED", "resource_temporal_overlap/vehicle_buffered check (15-min turnaround)"]
  - method: GET
    path: "/transportation-requests/{id}"
    description: "Fetch a transportation request"
    roles: [CenterAdmin, Coordinator, Participant, Auditor]
    code: 200
    input: []
    output: TransportationRequest
  - method: GET
    path: "/transportation-requests"
    description: "List transportation requests; filter by participant, vehicle, or linked session"
    roles: [CenterAdmin, Coordinator, Participant, Auditor]
    code: 200
    input: ["participant_id?", "vehicle_id?", "linked_session_id?", "limit?", "offset?"]
    output: TransportationRequest[]
  - method: POST
    path: "/transportation-requests/{id}/approve"
    description: "Approve ride eligibility (requires the linked session to be SCHEDULED)"
    roles: [Coordinator]
    code: 200
    input: []
    output: TransportationRequest
    side_effects: ["eligibility_status = APPROVED (trip_status unchanged)", "increment TransportationRequest.version by 1"]
  - method: POST
    path: "/transportation-requests/{id}/complete"
    description: "Mark the trip completed (requires eligibility APPROVED)"
    roles: [Coordinator]
    code: 200
    input: []
    output: TransportationRequest
    side_effects: ["trip_status = COMPLETED (eligibility_status unchanged)", "increment TransportationRequest.version by 1"]

  # ---- MealServiceDay + MealReservation ----
  - method: POST
    path: "/meal-service-days"
    description: "Open a congregate meal service day"
    roles: [CenterAdmin]
    code: 201
    input: [service_date, site_name, capacity]
    output: MealServiceDay
    side_effects: ["status = OPEN", "reserved_count = 0", "available_seats = capacity"]
  - method: GET
    path: "/meal-service-days/{id}"
    description: "Fetch a meal service day (includes provisional/final reimbursable unit counts)"
    roles: [CenterAdmin, Coordinator, Participant, Auditor]
    code: 200
    input: []
    output: MealServiceDay
  - method: POST
    path: "/meal-service-days/{id}/close"
    description: "Close a meal service day for new reservations"
    roles: [CenterAdmin]
    code: 200
    input: []
    output: MealServiceDay
    side_effects: ["status = CLOSED", "increment MealServiceDay.version by 1"]
  - method: POST
    path: "/meal-reservations"
    description: "Reserve a congregate meal seat (OCC on day version; capacity + duplicate checks)"
    roles: [Participant, Coordinator]
    code: 201
    input: [service_day_id, participant_id, "suggested_contribution_cents?", expected_service_day_version]
    output: MealReservation
    side_effects: ["status = CONFIRMED", "increment MealServiceDay.reserved_count by 1; decrement available_seats by 1", "increment MealServiceDay.version by 1"]
  - method: GET
    path: "/meal-reservations/{id}"
    description: "Fetch a meal reservation"
    roles: [CenterAdmin, Coordinator, Participant, Auditor]
    code: 200
    input: []
    output: MealReservation
  - method: GET
    path: "/meal-reservations"
    description: "List meal reservations; filter by service day or participant"
    roles: [CenterAdmin, Coordinator, Participant, Auditor]
    code: 200
    input: ["service_day_id?", "participant_id?", "limit?", "offset?"]
    output: MealReservation[]
  - method: POST
    path: "/meal-reservations/{id}/cancel"
    description: "Cancel a confirmed reservation, freeing a seat (compensating meal_seat_conservation)"
    roles: [Participant, Coordinator]
    code: 200
    input: []
    output: MealReservation
    side_effects: ["status = CANCELLED", "decrement MealServiceDay.reserved_count by 1; increment available_seats by 1", "increment version on reservation and day"]
  - method: POST
    path: "/meal-reservations/{id}/check-in"
    description: "Check a participant in for their reserved meal"
    roles: [Coordinator]
    code: 200
    input: []
    output: MealReservation
    side_effects: ["status = CHECKED_IN", "increment MealServiceDay.served_count by 1", "increment version on reservation and day"]

  # ---- WellnessProgram + WellnessEnrollment ----
  - method: POST
    path: "/wellness-programs"
    description: "Create an evidence-based wellness program"
    roles: [CenterAdmin, Coordinator]
    code: 201
    input: [title, model, total_sessions, fidelity_min_sessions]
    output: WellnessProgram
  - method: POST
    path: "/wellness-enrollments"
    description: "Enroll a participant in a wellness program"
    roles: [Coordinator]
    code: 201
    input: [program_id, participant_id]
    output: WellnessEnrollment
    side_effects: ["status = ACTIVE", "sessions_attended = 0", "absences_total = 0"]
  - method: GET
    path: "/wellness-enrollments/{id}"
    description: "Fetch a wellness enrollment (includes projected_graduation_status)"
    roles: [CenterAdmin, Coordinator, Participant, Auditor]
    code: 200
    input: []
    output: WellnessEnrollment
  - method: GET
    path: "/wellness-enrollments"
    description: "List wellness enrollments; filter by program or participant"
    roles: [CenterAdmin, Coordinator, Participant, Auditor]
    code: 200
    input: ["program_id?", "participant_id?", "limit?", "offset?"]
    output: WellnessEnrollment[]
  - method: POST
    path: "/wellness-enrollments/{id}/log-session"
    description: "Log a session attendance (attended true/false); drives the ACTIVE<->LAPSED cycle"
    roles: [Coordinator]
    code: 200
    input: [attended]
    output: WellnessEnrollment
    side_effects: ["attended=true: sessions_attended++, consecutive_absences=0, LAPSED->ACTIVE if lapsed", "attended=false: consecutive_absences++, absences_total++, ACTIVE->LAPSED at threshold", "increment WellnessEnrollment.version by 1"]
  - method: POST
    path: "/wellness-enrollments/{id}/finalize"
    description: "Finalize enrollment: GRADUATED if sessions_attended >= fidelity_min_sessions, else WITHDRAWN"
    roles: [Coordinator]
    code: 200
    input: []
    output: WellnessEnrollment
    side_effects: ["status = GRADUATED or WITHDRAWN (wellness_completion final variant)", "increment WellnessEnrollment.version by 1"]

  # ---- VolunteerShift ----
  - method: POST
    path: "/volunteer-shifts"
    description: "Log a volunteer shift with hours"
    roles: [CenterAdmin, Coordinator]
    code: 201
    input: [volunteer_name, role, hours, service_date]
    output: VolunteerShift
  - method: GET
    path: "/volunteer-shifts"
    description: "List volunteer shifts; filter by volunteer for hour totals"
    roles: [CenterAdmin, Coordinator, Auditor]
    code: 200
    input: ["volunteer_name?", "limit?", "offset?"]
    output: VolunteerShift[]

  # ---- Reports + Clock ----
  - method: GET
    path: "/reports/oaa-units"
    description: "OAA units-of-service report by category over a service_date window (oaa_units_report calc; empty-set safe)"
    roles: [CenterAdmin, Auditor]
    code: 200
    input: [category, from, to]
    output: { category: string, total_units: integer, total_billable_cents: integer, grant_funded_cents: integer, donation_funded_cents: integer, unfunded_cents: integer, cost_per_unit_cents: integer }
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint: set the logical clock. Server default before any call is 2026-03-01T00:00:00Z (never real wall-clock)."
    roles: [CenterAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing/unknown X-User-Role or missing X-User-ID header"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "Role not permitted for the operation, or Participant acting on a resource they do not own"
  - id: ERR_VALIDATION
    http: 400
    condition: "Malformed body, missing required field, bad enum value, or non-positive amount/quantity"
  - id: ERR_PARTICIPANT_NOT_FOUND
    http: 404
    condition: "Referenced participant id does not exist"
  - id: ERR_GRANT_NOT_FOUND
    http: 404
    condition: "Referenced grant award id does not exist"
  - id: ERR_DONATION_NOT_FOUND
    http: 404
    condition: "Referenced donation id does not exist"
  - id: ERR_FUNDED_SERVICE_NOT_FOUND
    http: 404
    condition: "Referenced funded service id does not exist"
  - id: ERR_ROOM_NOT_FOUND
    http: 404
    condition: "Referenced room id does not exist"
  - id: ERR_SESSION_NOT_FOUND
    http: 404
    condition: "Referenced activity session id does not exist"
  - id: ERR_SIGNUP_NOT_FOUND
    http: 404
    condition: "Referenced activity signup id does not exist"
  - id: ERR_VEHICLE_NOT_FOUND
    http: 404
    condition: "Referenced vehicle id does not exist"
  - id: ERR_TRANSPORT_NOT_FOUND
    http: 404
    condition: "Referenced transportation request id does not exist"
  - id: ERR_SERVICE_DAY_NOT_FOUND
    http: 404
    condition: "Referenced meal service day id does not exist"
  - id: ERR_RESERVATION_NOT_FOUND
    http: 404
    condition: "Referenced meal reservation id does not exist"
  - id: ERR_PROGRAM_NOT_FOUND
    http: 404
    condition: "Referenced wellness program id does not exist"
  - id: ERR_ENROLLMENT_NOT_FOUND
    http: 404
    condition: "Referenced wellness enrollment id does not exist"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_<parent>_version does not match the parent's current version (OCC)"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Transition not permitted from the entity's current state (generic)"
  - id: ERR_GRANT_NOT_ACTIVE
    http: 409
    condition: "Funding a service against a grant whose status is not ACTIVE"
  - id: ERR_SERVICE_DAY_CLOSED
    http: 409
    condition: "Reserving/checking-in against a meal service day whose status is CLOSED"
  - id: ERR_SESSION_NOT_SCHEDULED
    http: 409
    condition: "Approving a transportation request whose linked session is not SCHEDULED"
  - id: ERR_PARTICIPANT_INACTIVE
    http: 409
    condition: "Self-service write for a participant whose status is INACTIVE"
  - id: ERR_INVALID_TIME_WINDOW
    http: 422
    condition: "starts_at is not strictly before ends_at"
  - id: ERR_SIGNUP_CLOSED
    http: 422
    condition: "Signing up for a session at or after its starts_at (logical clock)"
  - id: ERR_ROOM_DOUBLE_BOOKED
    http: 409
    condition: "New session's [starts_at, ends_at) overlaps an existing SCHEDULED session in the same room (adjacency allowed)"
  - id: ERR_VEHICLE_UNAVAILABLE
    http: 409
    condition: "New trip window (+/- 15-min turnaround buffer) overlaps an existing non-CANCELLED trip on the same vehicle"
  - id: ERR_SESSION_FULL
    http: 409
    condition: "Signing up when the session's enrolled_count is already >= capacity"
  - id: ERR_DUPLICATE_SIGNUP
    http: 409
    condition: "Participant already holds a CONFIRMED signup for the session"
  - id: ERR_GRANT_CATEGORY_MISMATCH
    http: 422
    condition: "FundedService.category != grant.category"
  - id: ERR_DONATION_CATEGORY_MISMATCH
    http: 422
    condition: "donation.category is neither the FundedService.category nor UNRESTRICTED"
  - id: ERR_MEAL_CAPACITY_EXCEEDED
    http: 409
    condition: "Reserving when reserved_count is already >= capacity on the service day"
  - id: ERR_DUPLICATE_RESERVATION
    http: 409
    condition: "Participant already holds a CONFIRMED/CHECKED_IN reservation for the same service day"

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: CenterAdmin
    description: "Center administrator: manages grants, donations, rooms, vehicles, meal days, programs, participant lifecycle, and reporting"
    identity: "opaque"
    exclusive_operations:
      - "POST /grant-awards, POST /grant-awards/{id}/activate, POST /grant-awards/{id}/suspend"
      - "POST /donations"
      - "POST /rooms, POST /vehicles"
      - "POST /meal-service-days, POST /meal-service-days/{id}/close"
      - "POST /participants/{id}/deactivate"
    shared_operations:
      - "POST /participants (with Coordinator)"
      - "POST /funded-services, POST /funded-services/{id}/reverse (with Coordinator)"
      - "POST /wellness-programs, POST /volunteer-shifts (with Coordinator)"
      - "GET /reports/oaa-units (with Auditor)"
      - "POST /_clock/set_current_utc"
      - "GET reads"
  - name: Coordinator
    description: "Program coordinator: runs sessions, signups, transportation, reservations, wellness enrollments, and funded-service entry"
    identity: "opaque"
    exclusive_operations:
      - "POST /activity-sessions, POST /activity-sessions/{id}/cancel"
      - "POST /transportation-requests/{id}/approve, POST /transportation-requests/{id}/complete"
      - "POST /wellness-enrollments, POST /wellness-enrollments/{id}/log-session, POST /wellness-enrollments/{id}/finalize"
      - "POST /meal-reservations/{id}/check-in"
    shared_operations:
      - "POST /participants (with CenterAdmin)"
      - "POST /funded-services, POST /funded-services/{id}/reverse (with CenterAdmin)"
      - "POST /activity-signups, POST /activity-signups/{id}/cancel (with Participant)"
      - "POST /transportation-requests (with Participant)"
      - "POST /meal-reservations, POST /meal-reservations/{id}/cancel (with Participant)"
      - "POST /wellness-programs, POST /volunteer-shifts (with CenterAdmin)"
      - "GET reads"
  - name: Participant
    description: "A registered participant performing self-service signups, reservations, and ride requests on their own behalf"
    identity: "entity_backed:Participant"
    exclusive_operations: []
    shared_operations:
      - "POST /activity-signups, POST /activity-signups/{id}/cancel (own participant_id)"
      - "POST /transportation-requests (own participant_id)"
      - "POST /meal-reservations, POST /meal-reservations/{id}/cancel (own participant_id)"
      - "GET own resources"
  - name: Auditor
    description: "Read-only oversight role for OAA reporting and record review"
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "GET /reports/oaa-units (with CenterAdmin)"
      - "GET reads"



