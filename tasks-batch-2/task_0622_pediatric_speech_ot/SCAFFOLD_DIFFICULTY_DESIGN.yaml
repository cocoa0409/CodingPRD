  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: visit_pool_conserved_book_then_cancel
        grounds:
          - state_machines.Appointment.SCHEDULED_to_CANCELLED
          - calculations.visit_balance
          - entities.Authorization.fields.available_visits
          - entities.Authorization.fields.authorized_visits
        distinguishing_aspect: |
          Conserved quantity = the authorization free visit pool. Booking
          (reserved+1) followed by its compensating cancel (reserved-1) leaves
          available_visits == authorized_visits and reserved_visits ==
          committed_visits == 0: authorized_visits - available_visits ==
          reserved_visits + committed_visits holds at 0 throughout.
        test_recipe:
          setup:
            - "ACTIVE authorization authorized_visits=2, available=2, reserved=0, committed=0. No appointments yet."
          setup_api_calls:
            - call: "POST /clinic/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-05T12:00:00Z" }
              as: ClinicAdmin
            - call: "POST /clinic/therapists"
              payload: { full_name: "T Cons", discipline: "OT", max_caseload: 5, weekly_visit_minutes_cap: 600 }
