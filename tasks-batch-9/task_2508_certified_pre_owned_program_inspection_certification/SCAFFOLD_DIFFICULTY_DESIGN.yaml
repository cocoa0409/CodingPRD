      - name: vehicle_coverage_window_adjacency_allowed
        grounds:
          - calculations.vehicle_coverage_overlap
          - calculations.warranty_coverage
          - validations[priority=31]
          - errors.ERR_COVERAGE_WINDOW_OVERLAP
          - state_machines.Vehicle.cpo_state.DECERTIFIED_to_CERTIFICATION_PENDING
          - state_machines.Certification.SUBMITTED_to_ACTIVE
        distinguishing_aspect: |
          A retail-sold certification keeps its interval reserved on the vehicle, so re-certifying the
          returned vehicle is refused while the candidate window would straddle it and permitted the
          moment the candidate starts exactly on the retained end date. The half-open convention that
          makes 2027-08-01 acceptable is precisely the convention the technician-slot instance
          forbids, and the retry succeeds without any new submission because only the clock moved.
