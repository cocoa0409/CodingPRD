# =============================================================================
# §1.8 Scaffold Difficulty Design — Wire Transfer Operations & Sanctions
# Two instances per Difficulty Rule (§0.5), 18 instances total.
# All chains replay against SCAFFOLD.yaml §1.2/§1.4/§1.5/§1.6.
# Clock: server default logical time is 2026-08-01T00:00:00Z unless a chain
# sets it explicitly via POST /wire-ops/_clock/set_current_utc.
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------- Rule 1
  - rule_id: dual_variant_calc
    instances:
      - name: fee_provisional_vs_final_diverge_on_charge_input_set
        grounds:
          - calculations.fee_assessment
          - entities.FeeAssessment.fields.kind
          - entities.CorrespondentCharge.fields.source
          - state_machines.WireTransfer.RELEASING_to_EXECUTED
        distinguishing_aspect: |
          Same wire, same fee formula: the PROVISIONAL variant (input set
          restricted to source = PROVISIONAL_ESTIMATE) yields 3000 cents while
          the FINAL variant (input set restricted to source = ACTUAL_ADVICE)
          yields 7500 cents — a dual-variant divergence on the FEE domain,
          distinct from the risk-scoring domain of the sibling instance.
        test_recipe:
          setup:
            - "Customer C1 (risk MEDIUM), Account A1 (limit 250000000), Beneficiary B1, BusinessDate 2026-08-03 OPEN"
            - "Wire W1: Fedwire, NORMAL, charge_mode OUR, amount 1000000 ($10k, below callback threshold), initiated by op-1"
            - "One PROVISIONAL_ESTIMATE charge of 1000 cents (DEDUCTED_FROM_PRINCIPAL) posted while W1 is INITIATED"
            - "PROVISIONAL assessment requested pre-submission"
            - "W1 submitted and dual-approved; two ACTUAL_ADVICE charges posted while APPROVED: 4000 cents OUR + 2000 cents DEDUCTED_FROM_PRINCIPAL"
          setup_api_calls:
            - { call: "POST /wire-ops/customers", payload: { legal_name: "Acme Trading Co", risk_rating: "MEDIUM" }, as: WireOpsAdmin, captures: { cust1: $.data.id } }
            - { call: "POST /wire-ops/accounts", payload: { customer_id: "${cust1}", account_number: "A-1001", daily_outgoing_limit_cents: 250000000 }, as: WireOpsAdmin, captures: { acct1: $.data.id } }
            - { call: "POST /wire-ops/beneficiaries", payload: { customer_id: "${cust1}", name: "Supplier One", bank_name: "BankOne", account_number: "B-9001", country_code: "DE" }, as: WireOperator, captures: { ben1: $.data.id } }
            - { call: "POST /wire-ops/business-dates", payload: { business_date: "2026-08-03" }, as: WireOpsAdmin, captures: { bd1: $.data.id } }
            - { call: "POST /wire-ops/wires", payload: { ordering_account_id: "${acct1}", beneficiary_id: "${ben1}", amount_cents: 1000000, method: "Fedwire", purpose: "invoice 44" }, as: WireOperator, as_user_id: "op-1", captures: { w1: $.data.id } }
            - { call: "POST /wire-ops/wires/${w1}/charges", payload: { correspondent_name: "CorrBank Est", charge_type: "DEDUCTED_FROM_PRINCIPAL", amount_cents: 1000, source: "PROVISIONAL_ESTIMATE" }, as: WireOperator }
            - { call: "POST /wire-ops/wires/${w1}/fees/assess", payload: { kind: "PROVISIONAL" }, as: WireOperator, captures: { fee_prov: $.data.id, fee_prov_total: $.data.total_fee_cents } }
            - { call: "POST /wire-ops/wires/${w1}/submit", payload: { business_date: "2026-08-03" }, as: WireOperator, as_user_id: "op-1" }
            - { call: "GET /wire-ops/wires/${w1}", as: WireOperator, captures: { w1_v_sub: $.data.version } }
            - { call: "POST /wire-ops/wires/${w1}/approve", payload: { expected_wire_version: "${w1_v_sub}" }, as: WireApprover, as_user_id: "ap-1" }
            - { call: "GET /wire-ops/wires/${w1}", as: WireOperator, captures: { w1_v_a1: $.data.version } }
            - { call: "POST /wire-ops/wires/${w1}/approve", payload: { expected_wire_version: "${w1_v_a1}" }, as: WireApprover, as_user_id: "ap-2" }
            - { call: "POST /wire-ops/wires/${w1}/charges", payload: { correspondent_name: "CorrBank", charge_type: "OUR", amount_cents: 4000, source: "ACTUAL_ADVICE" }, as: WireOperator }
            - { call: "POST /wire-ops/wires/${w1}/charges", payload: { correspondent_name: "CorrBank", charge_type: "DEDUCTED_FROM_PRINCIPAL", amount_cents: 2000, source: "ACTUAL_ADVICE" }, as: WireOperator }
          trigger:
            - { call: "GET /wire-ops/wires/${w1}", as: WireOperator, captures: { w1_v_rel: $.data.version } }
            - { call: "POST /wire-ops/wires/${w1}/release", payload: { expected_wire_version: "${w1_v_rel}" }, as: WireOperator, as_user_id: "op-1" }
            - { call: "GET /wire-ops/wires/${w1}/fees", as: WireOperator, captures: { fee_final: "$.data[1].id", fee_final_total: "$.data[1].total_fee_cents", fee_prov_status: "$.data[0].status" } }
            - { call: "GET /wire-ops/wires/${w1}", as: WireOperator, captures: { w1_fee_field: $.data.fee_assessed_cents, w1_net: $.data.net_principal_cents } }
          assert:
            - "FeeAssessment.${fee_prov}.kind == PROVISIONAL and ${fee_prov_total} == 3000 (2500 base + round_half_up(1000*0.50)=500; ACTUAL_ADVICE charges excluded)"
            - "After execution: FeeAssessment.${fee_prov}.status == SUPERSEDED (observed as ${fee_prov_status})"
            - "FeeAssessment.${fee_final}.kind == FINAL and ${fee_final_total} == 7500 (2500 + 4000*1.00 + round_half_up(2000*0.50)=1000; PROVISIONAL_ESTIMATE charge excluded)"
            - "WireTransfer.${w1}.fee_assessed_cents == 7500 (${w1_fee_field})"
            - "WireTransfer.${w1}.net_principal_cents == 998000 (${w1_net} == 1000000 - 2000)"
            - "PROVISIONAL total 3000 != FINAL total 7500 for identical wire identity"

      - name: risk_score_swift_conservative_variant_on_new_beneficiary
        grounds:
          - calculations.risk_score
          - entities.Beneficiary.fields.first_used_at
          - state_machines.WireTransfer.INITIATED_to_PENDING_APPROVAL
        distinguishing_aspect: |
          The BENEFICIARY_CONSERVATIVE variant (applied iff method = SWIFT)
          keys the new-beneficiary term on the beneficiary BANK's history on
          this account, not on the beneficiary record: wire B reuses BankOne/DE
          (seen on a prior EXECUTED wire) with a brand-new beneficiary record,
          so the conservative score is 0 where the record-based reading gives
          10 — a dual-variant divergence on the RISK domain, a different entity
          domain from the fee instance.
        test_recipe:
          setup:
            - "Customer C2 (risk LOW, high_risk_jurisdiction false), Account A2 (limit 250000000, ACTIVE), BusinessDate 2026-08-04 OPEN"
            - "Beneficiary B1 (person one) at bank BankOne/DE; Wire WA: Fedwire 50000000 ($500k, no callback) fully EXECUTED — B1.first_used_at set, BankOne/DE now seen on A2"
            - "Beneficiary B2 (person two) also at bank BankOne/DE, never used (first_used_at null)"
            - "Wire WB: SWIFT 50000000 to B2 — below every threshold except the contested new-beneficiary term"
          setup_api_calls:
            - { call: "POST /wire-ops/customers", payload: { legal_name: "Beta Holdings", risk_rating: "LOW", high_risk_jurisdiction: false }, as: WireOpsAdmin, captures: { cust2: $.data.id } }
            - { call: "POST /wire-ops/accounts", payload: { customer_id: "${cust2}", account_number: "A-2001", daily_outgoing_limit_cents: 250000000 }, as: WireOpsAdmin, captures: { acct2: $.data.id } }
            - { call: "POST /wire-ops/beneficiaries", payload: { customer_id: "${cust2}", name: "Person One", bank_name: "BankOne", account_number: "B-9101", country_code: "DE" }, as: WireOperator, captures: { ben_p1: $.data.id } }
            - { call: "POST /wire-ops/business-dates", payload: { business_date: "2026-08-04" }, as: WireOpsAdmin }
            - { call: "POST /wire-ops/wires", payload: { ordering_account_id: "${acct2}", beneficiary_id: "${ben_p1}", amount_cents: 50000000, method: "Fedwire", purpose: "seed wire" }, as: WireOperator, as_user_id: "op-1", captures: { wa: $.data.id } }
            - { call: "POST /wire-ops/wires/${wa}/submit", payload: { business_date: "2026-08-04" }, as: WireOperator, as_user_id: "op-1" }
            - { call: "GET /wire-ops/wires/${wa}", as: WireOperator, captures: { wa_v1: $.data.version } }
            - { call: "POST /wire-ops/wires/${wa}/approve", payload: { expected_wire_version: "${wa_v1}" }, as: WireApprover, as_user_id: "ap-1" }
            - { call: "GET /wire-ops/wires/${wa}", as: WireOperator, captures: { wa_v2: $.data.version } }
            - { call: "POST /wire-ops/wires/${wa}/approve", payload: { expected_wire_version: "${wa_v2}" }, as: WireApprover, as_user_id: "ap-2" }
            - { call: "GET /wire-ops/wires/${wa}", as: WireOperator, captures: { wa_v3: $.data.version } }
            - { call: "POST /wire-ops/wires/${wa}/release", payload: { expected_wire_version: "${wa_v3}" }, as: WireOperator, as_user_id: "op-1" }
            - { call: "POST /wire-ops/beneficiaries", payload: { customer_id: "${cust2}", name: "Person Two", bank_name: "BankOne", account_number: "B-9102", country_code: "DE" }, as: WireOperator, captures: { ben_p2: $.data.id } }
            - { call: "POST /wire-ops/wires", payload: { ordering_account_id: "${acct2}", beneficiary_id: "${ben_p2}", amount_cents: 50000000, method: "SWIFT", purpose: "variant probe" }, as: WireOperator, as_user_id: "op-1", captures: { wb: $.data.id } }
          trigger:
            - { call: "POST /wire-ops/wires/${wb}/submit", payload: { business_date: "2026-08-04" }, as: WireOperator, as_user_id: "op-1", captures: { wb_risk: $.data.risk_score, wb_screen: $.data.screening_status } }
          assert:
            - "WireTransfer.${wb}.risk_score == 0 (${wb_risk}): amount band 0, geo 0, watchlist 0, velocity 0 (50000000 <= 1000000000), behavior 0 because method = SWIFT applies BENEFICIARY_CONSERVATIVE and bank BankOne/DE already appeared on EXECUTED wire ${wa}"
            - "The record-based (non-variant) reading of the same facts yields 10 (B2.first_used_at is null) — the variant selection, keyed on method = SWIFT, is what zeroes the term"
            - "WireTransfer.${wb}.screening_status == CLEAR (${wb_screen}) since 0 < RISK_REVIEW_THRESHOLD 50 and no party match"

  # ---------------------------------------------------------------- Rule 2
  - rule_id: combinatorial_formula
    instances:
      - name: fee_full_stack_tiered_components
        grounds:
          - calculations.fee_assessment
          - entities.WireTransfer.fields.charge_mode
          - state_machines.WireTransfer.RELEASING_to_EXECUTED
        distinguishing_aspect: |
          Mode (a) — a formula with >=3 inputs and non-linear interaction:
          method-tiered base fee, conditional SAME_DAY surcharge, a
          SWIFT-only beneficiary-remuneration branch keyed on charge_mode, and
          a per-charge-type correspondent share — all four components land in
          one assessment (9900 cents).
        test_recipe:
          setup:
            - "Customer C3 (MEDIUM), Account A3 (limit 250000000), Beneficiary B3 (bank CH/ Zurich), BusinessDate 2026-08-05 OPEN"
            - "Wire W3: SWIFT, SAME_DAY, charge_mode BENEFICIARY_REMUNERATION, amount 5000000 ($50k, no callback)"
            - "W3 submitted and dual-approved; while APPROVED: ACTUAL_ADVICE charges 3000 cents DEDUCTED_FROM_PRINCIPAL and 2500 cents OUR"
          setup_api_calls:
            - { call: "POST /wire-ops/customers", payload: { legal_name: "Gamma Imports", risk_rating: "MEDIUM" }, as: WireOpsAdmin, captures: { cust3: $.data.id } }
            - { call: "POST /wire-ops/accounts", payload: { customer_id: "${cust3}", account_number: "A-3001", daily_outgoing_limit_cents: 250000000 }, as: WireOpsAdmin, captures: { acct3: $.data.id } }
            - { call: "POST /wire-ops/beneficiaries", payload: { customer_id: "${cust3}", name: "Swiss Supplier", bank_name: "ZurichBank", account_number: "B-9301", country_code: "CH" }, as: WireOperator, captures: { ben3: $.data.id } }
            - { call: "POST /wire-ops/business-dates", payload: { business_date: "2026-08-05" }, as: WireOpsAdmin }
            - { call: "POST /wire-ops/wires", payload: { ordering_account_id: "${acct3}", beneficiary_id: "${ben3}", amount_cents: 5000000, method: "SWIFT", priority: "SAME_DAY", charge_mode: "BENEFICIARY_REMUNERATION", purpose: "machinery" }, as: WireOperator, as_user_id: "op-1", captures: { w3: $.data.id } }
            - { call: "POST /wire-ops/wires/${w3}/submit", payload: { business_date: "2026-08-05" }, as: WireOperator, as_user_id: "op-1" }
            - { call: "GET /wire-ops/wires/${w3}", as: WireOperator, captures: { w3_v1: $.data.version } }
            - { call: "POST /wire-ops/wires/${w3}/approve", payload: { expected_wire_version: "${w3_v1}" }, as: WireApprover, as_user_id: "ap-1" }
            - { call: "GET /wire-ops/wires/${w3}", as: WireOperator, captures: { w3_v2: $.data.version } }
            - { call: "POST /wire-ops/wires/${w3}/approve", payload: { expected_wire_version: "${w3_v2}" }, as: WireApprover, as_user_id: "ap-2" }
            - { call: "POST /wire-ops/wires/${w3}/charges", payload: { correspondent_name: "CorrA", charge_type: "DEDUCTED_FROM_PRINCIPAL", amount_cents: 3000, source: "ACTUAL_ADVICE" }, as: WireOperator }
            - { call: "POST /wire-ops/wires/${w3}/charges", payload: { correspondent_name: "CorrB", charge_type: "OUR", amount_cents: 2500, source: "ACTUAL_ADVICE" }, as: WireOperator }
          trigger:
            - { call: "GET /wire-ops/wires/${w3}", as: WireOperator, captures: { w3_v3: $.data.version } }
            - { call: "POST /wire-ops/wires/${w3}/release", payload: { expected_wire_version: "${w3_v3}" }, as: WireOperator, as_user_id: "op-1" }
            - { call: "GET /wire-ops/wires/${w3}/fees", as: WireOperator, captures: { w3_fee_id: "$.data[0].id" } }
            - { call: "GET /wire-ops/fees/${w3_fee_id}", as: WireOperator, captures: { f_base: $.data.base_fee_cents, f_prio: $.data.priority_fee_cents, f_ben: $.data.beneficiary_share_cents, f_corr: $.data.correspondent_share_cents, f_total: $.data.total_fee_cents } }
            - { call: "GET /wire-ops/wires/${w3}", as: WireOperator, captures: { w3_net: $.data.net_principal_cents, w3_status: $.data.status } }
          assert:
            - "FeeAssessment.${w3_fee_id}.base_fee_cents == 3500 (SWIFT tier), priority_fee_cents == 1000 (SAME_DAY)"
            - "beneficiary_share_cents == 1400 (round_half_up(3500 * 0.40); branch active because method = SWIFT and charge_mode = BENEFICIARY_REMUNERATION)"
            - "correspondent_share_cents == 4000 (round_half_up(3000*0.50)=1500 + 2500*1.00=2500)"
            - "total_fee_cents == 9900 (${f_total}); WireTransfer.${w3}.net_principal_cents == 4997000 (${w3_net} == 5000000 - 3000); status == EXECUTED (${w3_status})"

      - name: fee_per_charge_rounding_order_pinned
        grounds:
          - calculations.fee_assessment
          - entities.FeeAssessment.fields.correspondent_share_cents
        distinguishing_aspect: |
          Mode (b) — nested rounding where order matters: two
          DEDUCTED_FROM_PRINCIPAL charges of 999 cents each. Pinned order
          (round per charge, then sum) yields 500 + 500 = 1000 cents of
          correspondent share; the rejected alternative (sum, then round)
          yields round_half_up(1998 * 0.50) = 999. The assessment total 3500
          versus 3499 discriminates the two orders. Different mode from the
          tiered-components instance.
        test_recipe:
          setup:
            - "Customer C4 (MEDIUM), Account A4 (limit 250000000), Beneficiary B4"
            - "Wire W4: Fedwire, NORMAL, charge_mode OUR, amount 1000000, status INITIATED"
            - "Two PROVISIONAL_ESTIMATE DEDUCTED_FROM_PRINCIPAL charges of 999 cents each posted while INITIATED"
          setup_api_calls:
            - { call: "POST /wire-ops/customers", payload: { legal_name: "Delta LLC", risk_rating: "MEDIUM" }, as: WireOpsAdmin, captures: { cust4: $.data.id } }
            - { call: "POST /wire-ops/accounts", payload: { customer_id: "${cust4}", account_number: "A-4001", daily_outgoing_limit_cents: 250000000 }, as: WireOpsAdmin, captures: { acct4: $.data.id } }
            - { call: "POST /wire-ops/beneficiaries", payload: { customer_id: "${cust4}", name: "Vendor Four", bank_name: "BankFour", account_number: "B-9401", country_code: "US" }, as: WireOperator, captures: { ben4: $.data.id } }
            - { call: "POST /wire-ops/wires", payload: { ordering_account_id: "${acct4}", beneficiary_id: "${ben4}", amount_cents: 1000000, method: "Fedwire", purpose: "rounding probe" }, as: WireOperator, as_user_id: "op-1", captures: { w4: $.data.id } }
            - { call: "POST /wire-ops/wires/${w4}/charges", payload: { correspondent_name: "CorrX", charge_type: "DEDUCTED_FROM_PRINCIPAL", amount_cents: 999, source: "PROVISIONAL_ESTIMATE" }, as: WireOperator }
            - { call: "POST /wire-ops/wires/${w4}/charges", payload: { correspondent_name: "CorrY", charge_type: "DEDUCTED_FROM_PRINCIPAL", amount_cents: 999, source: "PROVISIONAL_ESTIMATE" }, as: WireOperator }
          trigger:
            - { call: "POST /wire-ops/wires/${w4}/fees/assess", payload: { kind: "PROVISIONAL" }, as: WireOperator, captures: { w4_corr: $.data.correspondent_share_cents, w4_total: $.data.total_fee_cents } }
          assert:
            - "correspondent_share_cents == 1000 (${w4_corr}): round_half_up(999 * 0.50) = 500 per charge, summed — NOT round_half_up(1998 * 0.50) = 999"
            - "total_fee_cents == 3500 (${w4_total} = 2500 base + 0 priority + 0 beneficiary + 1000)"

  # ---------------------------------------------------------------- Rule 3
  - rule_id: non_linear_state_machine
    instances:
      - name: wire_repair_cycle_with_parallel_screening_dimension
        grounds:
          - state_machines.WireTransfer.PENDING_APPROVAL_to_REPAIR
          - state_machines.WireTransfer.REPAIR_to_PENDING_APPROVAL
          - state_machines.WireTransfer.NOT_SCREENED_to_REVIEW
          - state_machines.WireTransfer.REVIEW_to_CLEAR
          - concurrency_rules[wire-repair-stale-version]
        distinguishing_aspect: |
          WireTransfer exhibits TWO non-linear shapes at once: a cyclic repair
          loop (PENDING_APPROVAL -> REPAIR -> PENDING_APPROVAL) on the status
          dimension and an independent screening_status dimension
          (NOT_SCREENED -> REVIEW -> CLEAR) that flips mid-loop without
          touching status. Distinct entity from the Investigation instance.
        test_recipe:
          setup:
            - "Customer C5 (MEDIUM), Account A5 (limit 250000000), Beneficiary B5, BusinessDate 2026-08-06 OPEN"
            - "Wire W5: Fedwire 1000000 by op-1, submitted (screening CLEAR, risk 10), first approval by ap-1 recorded"
          setup_api_calls:
            - { call: "POST /wire-ops/customers", payload: { legal_name: "Epsilon Corp", risk_rating: "MEDIUM" }, as: WireOpsAdmin, captures: { cust5: $.data.id } }
            - { call: "POST /wire-ops/accounts", payload: { customer_id: "${cust5}", account_number: "A-5001", daily_outgoing_limit_cents: 250000000 }, as: WireOpsAdmin, captures: { acct5: $.data.id } }
            - { call: "POST /wire-ops/beneficiaries", payload: { customer_id: "${cust5}", name: "Vendor Five", bank_name: "BankFive", account_number: "B-9501", country_code: "US" }, as: WireOperator, captures: { ben5: $.data.id } }
            - { call: "POST /wire-ops/business-dates", payload: { business_date: "2026-08-06" }, as: WireOpsAdmin }
            - { call: "POST /wire-ops/wires", payload: { ordering_account_id: "${acct5}", beneficiary_id: "${ben5}", amount_cents: 1000000, method: "Fedwire", purpose: "cycle probe" }, as: WireOperator, as_user_id: "op-1", captures: { w5: $.data.id } }
            - { call: "POST /wire-ops/wires/${w5}/submit", payload: { business_date: "2026-08-06" }, as: WireOperator, as_user_id: "op-1" }
            - { call: "GET /wire-ops/wires/${w5}", as: WireOperator, captures: { w5_v1: $.data.version } }
            - { call: "POST /wire-ops/wires/${w5}/approve", payload: { expected_wire_version: "${w5_v1}" }, as: WireApprover, as_user_id: "ap-1" }
            - { call: "GET /wire-ops/wires/${w5}", as: WireOperator, captures: { w5_v2: $.data.version } }
            - { call: "POST /wire-ops/wires/${w5}/repair", payload: { expected_wire_version: "${w5_v2}", purpose: "corrected purpose text" }, as: RepairSpecialist, as_user_id: "rs-1", captures: { w5_status_repair: $.data.status, w5_attempts: $.data.repair_attempts } }
            - { call: "POST /wire-ops/wires/${w5}/resubmit", payload: {}, as: RepairSpecialist, as_user_id: "rs-1" }
            - { call: "POST /wire-ops/_screening/simulate", payload: { wire_id: "${w5}", matched_list: "INTERNAL_WATCH", matched_party: "Vendor Five", match_score: 61 }, as: SanctionsScreener, captures: { w5_hit: $.data.id } }
            - { call: "GET /wire-ops/wires/${w5}", as: SanctionsScreener, captures: { w5_status_mid: $.data.status, w5_screen_mid: $.data.screening_status } }
            - { call: "POST /wire-ops/sanctions-hits/${w5_hit}/release", payload: { rationale: "false positive: different Vendor Five" }, as: SanctionsScreener, as_user_id: "ss-1" }
            - { call: "GET /wire-ops/wires/${w5}", as: WireOperator, captures: { w5_screen_after: $.data.screening_status, w5_status_after: $.data.status, w5_v3: $.data.version } }
          trigger:
            - { call: "POST /wire-ops/wires/${w5}/approve", payload: { expected_wire_version: "${w5_v3}" }, as: WireApprover, as_user_id: "ap-1", captures: { w5_after_reapprove: $.data.status } }
            - { call: "GET /wire-ops/wires/${w5}", as: WireOperator, captures: { w5_v4: $.data.version } }
            - { call: "POST /wire-ops/wires/${w5}/approve", payload: { expected_wire_version: "${w5_v4}" }, as: WireApprover, as_user_id: "ap-2", captures: { w5_final_status: $.data.status } }
          assert:
            - "After repair: status == REPAIR (${w5_status_repair}), repair_attempts == 1 (${w5_attempts}) — cycle leg 1 taken"
            - "Mid-loop parallel dimension: after hit injection, status == PENDING_APPROVAL (${w5_status_mid}) while screening_status == REVIEW (${w5_screen_mid}) — the two dimensions move independently"
            - "After hit release: screening_status == CLEAR (${w5_screen_after}) while status remains PENDING_APPROVAL (${w5_status_after})"
            - "ap-1 may approve again after resubmit (prior record superseded): first re-approval leaves status == PENDING_APPROVAL (${w5_after_reapprove}); ap-2 completes the cycle at APPROVED (${w5_final_status})"

      - name: investigation_tracer_answer_loop_with_cap
        grounds:
          - state_machines.Investigation.OPEN_to_AWAITING_RESPONSE
          - state_machines.Investigation.AWAITING_RESPONSE_to_OPEN
          - entities.Investigation.fields.tracer_count
          - errors[ERR_TRACER_LIMIT_EXCEEDED]
        distinguishing_aspect: |
          Investigation is a cyclic machine (OPEN -> AWAITING_RESPONSE -> OPEN,
          repeatable) whose loop count is governed by max_tracers = 3: exactly
          three outbound tracers succeed, the fourth is rejected. Cyclic shape
          on a DIFFERENT entity from the WireTransfer instance.
        test_recipe:
          setup:
            - "Customer C6 (MEDIUM), Account A6 (limit 250000000), Beneficiary B6, BusinessDate 2026-08-07 OPEN"
            - "Wire W6: CHIPS 750000, fully EXECUTED"
            - "Investigation I6 (type TRACER) opened on W6"
          setup_api_calls:
            - { call: "POST /wire-ops/customers", payload: { legal_name: "Zeta Partners", risk_rating: "MEDIUM" }, as: WireOpsAdmin, captures: { cust6: $.data.id } }
            - { call: "POST /wire-ops/accounts", payload: { customer_id: "${cust6}", account_number: "A-6001", daily_outgoing_limit_cents: 250000000 }, as: WireOpsAdmin, captures: { acct6: $.data.id } }
            - { call: "POST /wire-ops/beneficiaries", payload: { customer_id: "${cust6}", name: "Vendor Six", bank_name: "BankSix", account_number: "B-9601", country_code: "GB" }, as: WireOperator, captures: { ben6: $.data.id } }
            - { call: "POST /wire-ops/business-dates", payload: { business_date: "2026-08-07" }, as: WireOpsAdmin }
            - { call: "POST /wire-ops/wires", payload: { ordering_account_id: "${acct6}", beneficiary_id: "${ben6}", amount_cents: 750000, method: "CHIPS", purpose: "loop probe" }, as: WireOperator, as_user_id: "op-1", captures: { w6: $.data.id } }
            - { call: "POST /wire-ops/wires/${w6}/submit", payload: { business_date: "2026-08-07" }, as: WireOperator, as_user_id: "op-1" }
            - { call: "GET /wire-ops/wires/${w6}", as: WireOperator, captures: { w6_v1: $.data.version } }
            - { call: "POST /wire-ops/wires/${w6}/approve", payload: { expected_wire_version: "${w6_v1}" }, as: WireApprover, as_user_id: "ap-1" }
            - { call: "GET /wire-ops/wires/${w6}", as: WireOperator, captures: { w6_v2: $.data.version } }
            - { call: "POST /wire-ops/wires/${w6}/approve", payload: { expected_wire_version: "${w6_v2}" }, as: WireApprover, as_user_id: "ap-2" }
            - { call: "GET /wire-ops/wires/${w6}", as: WireOperator, captures: { w6_v3: $.data.version } }
            - { call: "POST /wire-ops/wires/${w6}/release", payload: { expected_wire_version: "${w6_v3}" }, as: WireOperator, as_user_id: "op-1" }
            - { call: "POST /wire-ops/investigations", payload: { wire_id: "${w6}", type: "TRACER", note: "beneficiary claims non-receipt" }, as: WireInvestigator, as_user_id: "inv-1", captures: { inv6: $.data.id } }
          trigger:
            - { call: "POST /wire-ops/investigations/${inv6}/tracers", payload: { body: "tracer 1" }, as: WireInvestigator, as_user_id: "inv-1", captures: { t1_seq: $.data.sequence_no } }
            - { call: "POST /wire-ops/investigations/${inv6}/respond", payload: { body: "reply 1" }, as: WireInvestigator, as_user_id: "inv-1" }
            - { call: "POST /wire-ops/investigations/${inv6}/tracers", payload: { body: "tracer 2" }, as: WireInvestigator, as_user_id: "inv-1", captures: { t2_seq: $.data.sequence_no } }
            - { call: "POST /wire-ops/investigations/${inv6}/respond", payload: { body: "reply 2" }, as: WireInvestigator, as_user_id: "inv-1" }
            - { call: "POST /wire-ops/investigations/${inv6}/tracers", payload: { body: "tracer 3" }, as: WireInvestigator, as_user_id: "inv-1", captures: { t3_seq: $.data.sequence_no } }
            - { call: "POST /wire-ops/investigations/${inv6}/respond", payload: { body: "reply 3" }, as: WireInvestigator, as_user_id: "inv-1" }
            - { call: "POST /wire-ops/investigations/${inv6}/tracers", payload: { body: "tracer 4" }, as: WireInvestigator, as_user_id: "inv-1", captures: { t4_err: $.data.error_id } }
            - { call: "GET /wire-ops/investigations/${inv6}", as: WireInvestigator, captures: { inv6_count: $.data.tracer_count, inv6_status: $.data.status } }
          assert:
            - "Outbound tracers carry sequence_no 1, 2, 3 (${t1_seq}, ${t2_seq}, ${t3_seq}); INBOUND replies do not consume sequence budget"
            - "Fourth tracer rejected: ${t4_err} == ERR_TRACER_LIMIT_EXCEEDED"
            - "Investigation.${inv6}.tracer_count == 3 (${inv6_count}) and status == OPEN (${inv6_status}) — the cycle returned to OPEN after each reply and the cap held"

  # ---------------------------------------------------------------- Rule 4
  - rule_id: transitive_cascade
    instances:
      - name: sanctions_confirm_cascades_hit_wire_account
        grounds:
          - state_machines.SanctionsHit.OPEN_to_CONFIRMED
          - state_machines.WireTransfer.REVIEW_to_CONFIRMED_HIT
          - entities.Account.fields.daily_reserved_cents
        distinguishing_aspect: |
          Depth-3 chain originating at POST /sanctions-hits/{id}/confirm:
          SanctionsHit OPEN -> CONFIRMED (link 1); that disposition drives the
          WireTransfer PENDING_APPROVAL -> REJECTED with reservation_active
          false (link 2, caused by link 1); the wire's rejection debits the
          Account's daily_reserved_cents (link 3, caused by link 2). Trigger
          differs from the recall-completion instance.
        test_recipe:
          setup:
            - "Customer C7 (MEDIUM), Account A7 (limit 250000000), Beneficiary B7, BusinessDate 2026-08-10 OPEN"
            - "Wire W7: Fedwire 400000 by op-1, submitted; daily_reserved_cents == 400000"
            - "One OPEN OFAC_SDN hit H7 on W7 (screening_status == REVIEW)"
          setup_api_calls:
            - { call: "POST /wire-ops/customers", payload: { legal_name: "Eta Goods", risk_rating: "MEDIUM" }, as: WireOpsAdmin, captures: { cust7: $.data.id } }
            - { call: "POST /wire-ops/accounts", payload: { customer_id: "${cust7}", account_number: "A-7001", daily_outgoing_limit_cents: 250000000 }, as: WireOpsAdmin, captures: { acct7: $.data.id } }
            - { call: "POST /wire-ops/beneficiaries", payload: { customer_id: "${cust7}", name: "Vendor Seven", bank_name: "BankSeven", account_number: "B-9701", country_code: "US" }, as: WireOperator, captures: { ben7: $.data.id } }
            - { call: "POST /wire-ops/business-dates", payload: { business_date: "2026-08-10" }, as: WireOpsAdmin }
            - { call: "POST /wire-ops/wires", payload: { ordering_account_id: "${acct7}", beneficiary_id: "${ben7}", amount_cents: 400000, method: "Fedwire", purpose: "cascade probe" }, as: WireOperator, as_user_id: "op-1", captures: { w7: $.data.id } }
            - { call: "POST /wire-ops/wires/${w7}/submit", payload: { business_date: "2026-08-10" }, as: WireOperator, as_user_id: "op-1" }
            - { call: "POST /wire-ops/_screening/simulate", payload: { wire_id: "${w7}", matched_list: "OFAC_SDN", matched_party: "Vendor Seven", match_score: 97 }, as: SanctionsScreener, captures: { h7: $.data.id } }
            - { call: "GET /wire-ops/accounts/${acct7}", as: WireOperator, captures: { a7_reserved_pre: $.data.daily_reserved_cents } }
          trigger:
            - { call: "POST /wire-ops/sanctions-hits/${h7}/confirm", payload: { rationale: "exact match on SDN entry" }, as: SanctionsScreener, as_user_id: "ss-1" }
            - { call: "GET /wire-ops/sanctions-hits/${h7}", as: SanctionsScreener, captures: { h7_status: $.data.status } }
            - { call: "GET /wire-ops/wires/${w7}", as: WireOperator, captures: { w7_status: $.data.status, w7_screen: $.data.screening_status, w7_res_active: $.data.reservation_active } }
            - { call: "GET /wire-ops/accounts/${acct7}", as: WireOperator, captures: { a7_reserved_post: $.data.daily_reserved_cents } }
          assert:
            - "Link 1: SanctionsHit.${h7}.status == CONFIRMED (${h7_status})"
            - "Link 2: WireTransfer.${w7}.status == REJECTED (${w7_status}), screening_status == CONFIRMED_HIT (${w7_screen}), reservation_active == false (${w7_res_active})"
            - "Link 3: Account.${acct7}.daily_reserved_cents fell from 400000 (${a7_reserved_pre}) to 0 (${a7_reserved_post}) as a consequence of the wire's rejection, not of the confirm call directly"

      - name: recall_completion_cascades_recall_wire
        grounds:
          - state_machines.RecallRequest.BENEFICIARY_RESPONDED_to_COMPLETED
          - state_machines.WireTransfer.EXECUTED_to_RECALLED
          - calculations.recall_compensation
        distinguishing_aspect: |
          Depth-2 chain originating at POST /recalls/{id}/complete: the
          RecallRequest reaches COMPLETED (link 1); that completion — not the
          operator's call directly — transitions the WireTransfer EXECUTED ->
          RECALLED (link 2) and books recall compensation. Different trigger
          and different propagation pattern from the sanctions-confirm chain.
        test_recipe:
          setup:
            - "Customer C8 (MEDIUM), Account A8 (limit 250000000), Beneficiary B8, BusinessDate 2026-08-11 OPEN"
            - "Wire W8: Fedwire 10000000 ($100k), fully EXECUTED, no correspondent charges (net_principal_cents == 10000000)"
            - "Recall R8 (reason ERROR_AMOUNT, amount_to_recall_cents 5000000) REQUESTED, then SENT, then beneficiary bank answered FUNDS_RETURNED"
          setup_api_calls:
            - { call: "POST /wire-ops/customers", payload: { legal_name: "Theta Corp", risk_rating: "MEDIUM" }, as: WireOpsAdmin, captures: { cust8: $.data.id } }
            - { call: "POST /wire-ops/accounts", payload: { customer_id: "${cust8}", account_number: "A-8001", daily_outgoing_limit_cents: 250000000 }, as: WireOpsAdmin, captures: { acct8: $.data.id } }
            - { call: "POST /wire-ops/beneficiaries", payload: { customer_id: "${cust8}", name: "Vendor Eight", bank_name: "BankEight", account_number: "B-9801", country_code: "US" }, as: WireOperator, captures: { ben8: $.data.id } }
            - { call: "POST /wire-ops/business-dates", payload: { business_date: "2026-08-11" }, as: WireOpsAdmin }
            - { call: "POST /wire-ops/wires", payload: { ordering_account_id: "${acct8}", beneficiary_id: "${ben8}", amount_cents: 10000000, method: "Fedwire", purpose: "recall probe" }, as: WireOperator, as_user_id: "op-1", captures: { w8: $.data.id } }
            - { call: "POST /wire-ops/wires/${w8}/submit", payload: { business_date: "2026-08-11" }, as: WireOperator, as_user_id: "op-1" }
            - { call: "GET /wire-ops/wires/${w8}", as: WireOperator, captures: { w8_v1: $.data.version } }
            - { call: "POST /wire-ops/wires/${w8}/approve", payload: { expected_wire_version: "${w8_v1}" }, as: WireApprover, as_user_id: "ap-1" }
            - { call: "GET /wire-ops/wires/${w8}", as: WireOperator, captures: { w8_v2: $.data.version } }
            - { call: "POST /wire-ops/wires/${w8}/approve", payload: { expected_wire_version: "${w8_v2}" }, as: WireApprover, as_user_id: "ap-2" }
            - { call: "GET /wire-ops/wires/${w8}", as: WireOperator, captures: { w8_v3: $.data.version } }
            - { call: "POST /wire-ops/wires/${w8}/release", payload: { expected_wire_version: "${w8_v3}" }, as: WireOperator, as_user_id: "op-1" }
            - { call: "POST /wire-ops/recalls", payload: { wire_id: "${w8}", reason: "ERROR_AMOUNT", amount_to_recall_cents: 5000000 }, as: WireOperator, as_user_id: "op-1", captures: { r8: $.data.id } }
            - { call: "POST /wire-ops/recalls/${r8}/send", payload: {}, as: WireOperator, as_user_id: "op-1" }
            - { call: "POST /wire-ops/recalls/${r8}/respond", payload: { response: "FUNDS_RETURNED" }, as: BeneficiaryBank, as_user_id: "benebank-1" }
          trigger:
            - { call: "POST /wire-ops/recalls/${r8}/complete", payload: {}, as: WireOperator, as_user_id: "op-1", captures: { r8_status: $.data.status } }
            - { call: "GET /wire-ops/wires/${w8}", as: WireOperator, captures: { w8_status: $.data.status, w8_net: $.data.net_principal_cents } }
          assert:
            - "Link 1: RecallRequest.${r8}.status == COMPLETED (${r8_status})"
            - "Link 2: WireTransfer.${w8}.status == RECALLED (${w8_status}) — caused by the recall completion, not by any direct wire call"
            - "Recall compensation: partial recall of 5000000 against net_principal_cents 10000000 (${w8_net}) books an unrecovered recall loss of 5000000; the wire's amount/net/charge decomposition is untouched"

  # ---------------------------------------------------------------- Rule 5
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: submit_cutoff_temporal_beats_callback_safety
        grounds:
          - validations[priority=8]
          - validations[priority=11]
          - errors[ERR_CUTOFF_PASSED]
          - errors[ERR_CALLBACK_NOT_VERIFIED]
        distinguishing_aspect: |
          Error-category pair business_temporal vs business_safety: a submit
          that violates BOTH the cutoff rule (priority 8, date CUTOFF_PASSED)
          AND the callback rule (priority 11, callback PENDING) must surface
          ERR_CUTOFF_PASSED — the lower priority number wins regardless of
          which check an implementation happens to code first.
        test_recipe:
          setup:
            - "Customer C9 (MEDIUM), Account A9 (limit 250000000), Beneficiary B9"
            - "BusinessDate 2026-08-12 created and immediately cutoff-closed (status CUTOFF_PASSED)"
            - "Wire W9: Fedwire 100000000 (exactly $1,000,000.00) -> status CALLBACK_PENDING, callback_status PENDING, case OPEN and unresolved"
          setup_api_calls:
            - { call: "POST /wire-ops/customers", payload: { legal_name: "Iota Inc", risk_rating: "MEDIUM" }, as: WireOpsAdmin, captures: { cust9: $.data.id } }
            - { call: "POST /wire-ops/accounts", payload: { customer_id: "${cust9}", account_number: "A-9001", daily_outgoing_limit_cents: 250000000 }, as: WireOpsAdmin, captures: { acct9: $.data.id } }
            - { call: "POST /wire-ops/beneficiaries", payload: { customer_id: "${cust9}", name: "Vendor Nine", bank_name: "BankNine", account_number: "B-9901", country_code: "US" }, as: WireOperator, captures: { ben9: $.data.id } }
            - { call: "POST /wire-ops/business-dates", payload: { business_date: "2026-08-12" }, as: WireOpsAdmin, captures: { bd9: $.data.id } }
            - { call: "POST /wire-ops/business-dates/${bd9}/close-cutoff", payload: {}, as: WireOpsAdmin }
            - { call: "POST /wire-ops/wires", payload: { ordering_account_id: "${acct9}", beneficiary_id: "${ben9}", amount_cents: 100000000, method: "Fedwire", purpose: "priority probe" }, as: WireOperator, as_user_id: "op-1", captures: { w9: $.data.id, w9_cb_status: $.data.callback_status } }
          trigger:
            - { call: "POST /wire-ops/wires/${w9}/submit", payload: { business_date: "2026-08-12" }, as: WireOperator, as_user_id: "op-1", captures: { w9_err: $.data.error_id } }
          assert:
            - "Setup held: WireTransfer.${w9}.callback_status == PENDING (${w9_cb_status}) and BusinessDate 2026-08-12 is CUTOFF_PASSED — both violations live"
            - "Response error_id == ERR_CUTOFF_PASSED (${w9_err}), priority 8 temporal beats priority 11 safety; HTTP 409"
            - "WireTransfer.${w9}.status unchanged (CALLBACK_PENDING); no reservation created"

      - name: wire_create_referential_mismatch_beats_customer_frozen_safety
        grounds:
          - validations[priority=5]
          - validations[priority=7]
          - errors[ERR_BENEFICIARY_ACCOUNT_MISMATCH]
          - errors[ERR_CUSTOMER_FROZEN]
        distinguishing_aspect: |
          Error-category pair business_referential vs business_safety (a
          DIFFERENT pair from the temporal/safety instance): initiation that
          violates BOTH the beneficiary-account consistency rule (priority 5)
          AND the frozen-customer rule (priority 7) must surface
          ERR_BENEFICIARY_ACCOUNT_MISMATCH.
        test_recipe:
          setup:
            - "Customer C10 (MEDIUM, then FROZEN by admin) with Account A10 (limit 250000000)"
            - "Customer C11 (MEDIUM, ACTIVE) with Beneficiary B11 registered under C11"
          setup_api_calls:
            - { call: "POST /wire-ops/customers", payload: { legal_name: "Kappa Frozen", risk_rating: "MEDIUM" }, as: WireOpsAdmin, captures: { cust10: $.data.id } }
            - { call: "POST /wire-ops/accounts", payload: { customer_id: "${cust10}", account_number: "A-10001", daily_outgoing_limit_cents: 250000000 }, as: WireOpsAdmin, captures: { acct10: $.data.id } }
            - { call: "POST /wire-ops/customers", payload: { legal_name: "Lambda Active", risk_rating: "MEDIUM" }, as: WireOpsAdmin, captures: { cust11: $.data.id } }
            - { call: "POST /wire-ops/beneficiaries", payload: { customer_id: "${cust11}", name: "Vendor Eleven", bank_name: "BankEleven", account_number: "B-1101", country_code: "US" }, as: WireOperator, captures: { ben11: $.data.id } }
            - { call: "POST /wire-ops/customers/${cust10}/freeze", payload: {}, as: WireOpsAdmin }
          trigger:
            - { call: "POST /wire-ops/wires", payload: { ordering_account_id: "${acct10}", beneficiary_id: "${ben11}", amount_cents: 500000, method: "Fedwire", purpose: "priority probe 2" }, as: WireOperator, as_user_id: "op-1", captures: { w10_err: $.data.error_id } }
          assert:
            - "Response error_id == ERR_BENEFICIARY_ACCOUNT_MISMATCH (${w10_err}), HTTP 422 — priority 5 referential beats priority 7 safety even though the frozen-customer violation also holds"
            - "No wire is created (GET /wire-ops/wires?ordering_account_id=${acct10} returns an empty list)"

  # ---------------------------------------------------------------- Rule 6
  - rule_id: boundary_precision_check
    instances:
      - name: callback_threshold_inclusive_at_exactly_one_million
        grounds:
          - calculations.callback_requirement
          - entities.WireTransfer.fields.requires_callback
          - state_machines.WireTransfer.INITIATED_to_CALLBACK_PENDING
        distinguishing_aspect: |
          Numeric threshold metric with inclusive >= semantics: exactly
          100000000 cents ($1,000,000.00) REQUIRES callback verification while
          99999999 cents does not. Reached via POST /wire-ops/wires (creation)
          and observed via GET /wire-ops/wires/{id}/callbacks — distinct
          metric and endpoint from the daily-limit instance.
        test_recipe:
          setup:
            - "Customer C12 (MEDIUM), Account A12 (limit 250000000), Beneficiary B12"
          setup_api_calls:
            - { call: "POST /wire-ops/customers", payload: { legal_name: "Mu Ltd", risk_rating: "MEDIUM" }, as: WireOpsAdmin, captures: { cust12: $.data.id } }
            - { call: "POST /wire-ops/accounts", payload: { customer_id: "${cust12}", account_number: "A-12001", daily_outgoing_limit_cents: 250000000 }, as: WireOpsAdmin, captures: { acct12: $.data.id } }
            - { call: "POST /wire-ops/beneficiaries", payload: { customer_id: "${cust12}", name: "Vendor Twelve", bank_name: "BankTwelve", account_number: "B-1201", country_code: "US" }, as: WireOperator, captures: { ben12: $.data.id } }
          trigger:
            - { call: "POST /wire-ops/wires", payload: { ordering_account_id: "${acct12}", beneficiary_id: "${ben12}", amount_cents: 100000000, method: "Fedwire", purpose: "boundary hi" }, as: WireOperator, as_user_id: "op-1", captures: { w_hi: $.data.id, w_hi_req: $.data.requires_callback, w_hi_status: $.data.status } }
            - { call: "GET /wire-ops/wires/${w_hi}/callbacks", as: WireOperator, captures: { w_hi_cb_id: "$.data[0].id", w_hi_cb_status: "$.data[0].status" } }
            - { call: "POST /wire-ops/wires", payload: { ordering_account_id: "${acct12}", beneficiary_id: "${ben12}", amount_cents: 99999999, method: "Fedwire", purpose: "boundary lo" }, as: WireOperator, as_user_id: "op-1", captures: { w_lo: $.data.id, w_lo_req: $.data.requires_callback, w_lo_status: $.data.status } }
            - { call: "GET /wire-ops/wires/${w_lo}/callbacks", as: WireOperator, captures: { w_lo_cb_list: $.data } }
          assert:
            - "amount_cents == 100000000 (at threshold): requires_callback == true (${w_hi_req}), status == CALLBACK_PENDING (${w_hi_status}), exactly one CallbackVerification OPEN (${w_hi_cb_status})"
            - "amount_cents == 99999999 (threshold - 1 cent): requires_callback == false (${w_lo_req}), status == INITIATED (${w_lo_status}), zero callback cases"
            - "CallbackVerification.${w_hi_cb_id}.expires_at == opened_at + 4 hours"

      - name: daily_limit_exact_fit_then_one_cent_over
        grounds:
          - calculations.daily_limit_check
          - entities.Account.fields.daily_released_cents
          - errors[ERR_DAILY_LIMIT_EXCEEDED]
        distinguishing_aspect: |
          Aggregate-threshold metric on a DIFFERENT endpoint (release): with
          available == amount_cents exactly, execution proceeds; with
          available == amount_cents - 1 cent, release is rejected and the wire
          stays APPROVED with its reservation intact.
        test_recipe:
          setup:
            - "Customer C13 (MEDIUM), Account A13 (daily_outgoing_limit_cents 1500000), Beneficiary B13, BusinessDate 2026-08-13 OPEN"
            - "Wire WA13 (900000) fully EXECUTED -> daily_released_cents == 900000, available == 600000"
            - "Wire WB13 (600001) APPROVED; Wire WC13 (600000) APPROVED"
          setup_api_calls:
            - { call: "POST /wire-ops/customers", payload: { legal_name: "Nu Corp", risk_rating: "MEDIUM" }, as: WireOpsAdmin, captures: { cust13: $.data.id } }
            - { call: "POST /wire-ops/accounts", payload: { customer_id: "${cust13}", account_number: "A-13001", daily_outgoing_limit_cents: 1500000 }, as: WireOpsAdmin, captures: { acct13: $.data.id } }
            - { call: "POST /wire-ops/beneficiaries", payload: { customer_id: "${cust13}", name: "Vendor Thirteen", bank_name: "Bank13", account_number: "B-1301", country_code: "US" }, as: WireOperator, captures: { ben13: $.data.id } }
            - { call: "POST /wire-ops/business-dates", payload: { business_date: "2026-08-13" }, as: WireOpsAdmin }
            - { call: "POST /wire-ops/wires", payload: { ordering_account_id: "${acct13}", beneficiary_id: "${ben13}", amount_cents: 900000, method: "Fedwire", purpose: "limit seed" }, as: WireOperator, as_user_id: "op-1", captures: { wa13: $.data.id } }
            - { call: "POST /wire-ops/wires/${wa13}/submit", payload: { business_date: "2026-08-13" }, as: WireOperator, as_user_id: "op-1" }
            - { call: "GET /wire-ops/wires/${wa13}", as: WireOperator, captures: { wa13_v1: $.data.version } }
            - { call: "POST /wire-ops/wires/${wa13}/approve", payload: { expected_wire_version: "${wa13_v1}" }, as: WireApprover, as_user_id: "ap-1" }
            - { call: "GET /wire-ops/wires/${wa13}", as: WireOperator, captures: { wa13_v2: $.data.version } }
            - { call: "POST /wire-ops/wires/${wa13}/approve", payload: { expected_wire_version: "${wa13_v2}" }, as: WireApprover, as_user_id: "ap-2" }
            - { call: "GET /wire-ops/wires/${wa13}", as: WireOperator, captures: { wa13_v3: $.data.version } }
            - { call: "POST /wire-ops/wires/${wa13}/release", payload: { expected_wire_version: "${wa13_v3}" }, as: WireOperator, as_user_id: "op-1" }
            - { call: "POST /wire-ops/wires", payload: { ordering_account_id: "${acct13}", beneficiary_id: "${ben13}", amount_cents: 600001, method: "Fedwire", purpose: "one cent over" }, as: WireOperator, as_user_id: "op-1", captures: { wb13: $.data.id } }
            - { call: "POST /wire-ops/wires/${wb13}/submit", payload: { business_date: "2026-08-13" }, as: WireOperator, as_user_id: "op-1" }
            - { call: "GET /wire-ops/wires/${wb13}", as: WireOperator, captures: { wb13_v1: $.data.version } }
            - { call: "POST /wire-ops/wires/${wb13}/approve", payload: { expected_wire_version: "${wb13_v1}" }, as: WireApprover, as_user_id: "ap-1" }
            - { call: "GET /wire-ops/wires/${wb13}", as: WireOperator, captures: { wb13_v2: $.data.version } }
            - { call: "POST /wire-ops/wires/${wb13}/approve", payload: { expected_wire_version: "${wb13_v2}" }, as: WireApprover, as_user_id: "ap-2" }
            - { call: "POST /wire-ops/wires", payload: { ordering_account_id: "${acct13}", beneficiary_id: "${ben13}", amount_cents: 600000, method: "Fedwire", purpose: "exact fit" }, as: WireOperator, as_user_id: "op-1", captures: { wc13: $.data.id } }
            - { call: "POST /wire-ops/wires/${wc13}/submit", payload: { business_date: "2026-08-13" }, as: WireOperator, as_user_id: "op-1" }
            - { call: "GET /wire-ops/wires/${wc13}", as: WireOperator, captures: { wc13_v1: $.data.version } }
            - { call: "POST /wire-ops/wires/${wc13}/approve", payload: { expected_wire_version: "${wc13_v1}" }, as: WireApprover, as_user_id: "ap-1" }
            - { call: "GET /wire-ops/wires/${wc13}", as: WireOperator, captures: { wc13_v2: $.data.version } }
            - { call: "POST /wire-ops/wires/${wc13}/approve", payload: { expected_wire_version: "${wc13_v2}" }, as: WireApprover, as_user_id: "ap-2" }
          trigger:
            - { call: "GET /wire-ops/wires/${wb13}", as: WireOperator, captures: { wb13_v3: $.data.version } }
            - { call: "POST /wire-ops/wires/${wb13}/release", payload: { expected_wire_version: "${wb13_v3}" }, as: WireOperator, as_user_id: "op-1", captures: { wb13_err: $.data.error_id } }
            - { call: "GET /wire-ops/wires/${wb13}", as: WireOperator, captures: { wb13_status: $.data.status, wb13_res: $.data.reservation_active } }
            - { call: "GET /wire-ops/wires/${wc13}", as: WireOperator, captures: { wc13_v3: $.data.version } }
            - { call: "POST /wire-ops/wires/${wc13}/release", payload: { expected_wire_version: "${wc13_v3}" }, as: WireOperator, as_user_id: "op-1", captures: { wc13_status: $.data.status } }
            - { call: "GET /wire-ops/accounts/${acct13}", as: WireOperator, captures: { a13_released: $.data.daily_released_cents, a13_reserved: $.data.daily_reserved_cents } }
          assert:
            - "available (1500000 - 900000 = 600000) < amount 600001 by exactly 1 cent: release rejected with ERR_DAILY_LIMIT_EXCEEDED (${wb13_err})"
            - "WireTransfer.${wb13}.status == APPROVED (${wb13_status}) and reservation_active == true (${wb13_res}) — the abort is atomic, nothing partially applied"
            - "available == amount exactly (600000): release succeeds, WireTransfer.${wc13}.status == EXECUTED (${wc13_status})"
            - "Account.${acct13}.daily_released_cents == 1500000 (${a13_released}); daily_reserved_cents == 600001 (${a13_reserved} — only the failed wire's reservation remains)"

  # ---------------------------------------------------------------- Rule 7
  - rule_id: cross_entity_state_dependency
    instances:
      - name: release_gated_by_business_date_posture
        grounds:
          - state_machines.WireTransfer.APPROVED_to_RELEASING
          - state_machines.BusinessDate.OPEN_to_CUTOFF_PASSED
          - validations[priority=16]
        distinguishing_aspect: |
          Entity pair WireTransfer -> BusinessDate: a fully approved,
          sanctions-CLEAR, unheld wire cannot release once the BusinessDate of
          its value_date leaves OPEN — the aggregate ops-day posture gates the
          child transition.
        test_recipe:
          setup:
            - "Customer C14 (MEDIUM), Account A14 (limit 250000000), Beneficiary B14, BusinessDate 2026-08-14 OPEN"
            - "Wire W14: Fedwire 300000, submitted (value_date 2026-08-14), dual-approved: status APPROVED, screening CLEAR, no holds"
          setup_api_calls:
            - { call: "POST /wire-ops/customers", payload: { legal_name: "Xi Ltd", risk_rating: "MEDIUM" }, as: WireOpsAdmin, captures: { cust14: $.data.id } }
            - { call: "POST /wire-ops/accounts", payload: { customer_id: "${cust14}", account_number: "A-14001", daily_outgoing_limit_cents: 250000000 }, as: WireOpsAdmin, captures: { acct14: $.data.id } }
            - { call: "POST /wire-ops/beneficiaries", payload: { customer_id: "${cust14}", name: "Vendor Fourteen", bank_name: "Bank14", account_number: "B-1401", country_code: "US" }, as: WireOperator, captures: { ben14: $.data.id } }
            - { call: "POST /wire-ops/business-dates", payload: { business_date: "2026-08-14" }, as: WireOpsAdmin, captures: { bd14: $.data.id } }
            - { call: "POST /wire-ops/wires", payload: { ordering_account_id: "${acct14}", beneficiary_id: "${ben14}", amount_cents: 300000, method: "Fedwire", purpose: "posture probe" }, as: WireOperator, as_user_id: "op-1", captures: { w14: $.data.id } }
            - { call: "POST /wire-ops/wires/${w14}/submit", payload: { business_date: "2026-08-14" }, as: WireOperator, as_user_id: "op-1" }
            - { call: "GET /wire-ops/wires/${w14}", as: WireOperator, captures: { w14_v1: $.data.version } }
            - { call: "POST /wire-ops/wires/${w14}/approve", payload: { expected_wire_version: "${w14_v1}" }, as: WireApprover, as_user_id: "ap-1" }
            - { call: "GET /wire-ops/wires/${w14}", as: WireOperator, captures: { w14_v2: $.data.version } }
            - { call: "POST /wire-ops/wires/${w14}/approve", payload: { expected_wire_version: "${w14_v2}" }, as: WireApprover, as_user_id: "ap-2" }
            - { call: "POST /wire-ops/business-dates/${bd14}/close-cutoff", payload: {}, as: WireOpsAdmin }
          trigger:
            - { call: "GET /wire-ops/wires/${w14}", as: WireOperator, captures: { w14_v3: $.data.version } }
            - { call: "POST /wire-ops/wires/${w14}/release", payload: { expected_wire_version: "${w14_v3}" }, as: WireOperator, as_user_id: "op-1", captures: { w14_err: $.data.error_id } }
            - { call: "GET /wire-ops/wires/${w14}", as: WireOperator, captures: { w14_status: $.data.status, w14_res: $.data.reservation_active } }
          assert:
            - "Release rejected: ${w14_err} == ERR_CUTOFF_PASSED (BusinessDate CUTOFF_PASSED gates the wire's APPROVED -> RELEASING)"
            - "WireTransfer.${w14}.status == APPROVED (${w14_status}) and reservation_active == true (${w14_res}) — reservation preserved for next-day handling"

      - name: beneficiary_retire_gated_by_open_wire
        grounds:
          - state_machines.Beneficiary.ACTIVE_to_RETIRED
          - validations[priority=30]
          - errors[ERR_BENEFICIARY_IN_USE]
        distinguishing_aspect: |
          Entity pair Beneficiary -> WireTransfer (DIFFERENT pair from
          WireTransfer -> BusinessDate): retiring a beneficiary is rejected
          while any non-terminal wire references it, and succeeds once the
          wire reaches a terminal state.
        test_recipe:
          setup:
            - "Customer C15 (MEDIUM), Account A15 (limit 250000000), Beneficiary B15, BusinessDate 2026-08-17 OPEN"
            - "Wire W15: Fedwire 200000 to B15, submitted (PENDING_APPROVAL, non-terminal)"
          setup_api_calls:
            - { call: "POST /wire-ops/customers", payload: { legal_name: "Omicron SA", risk_rating: "MEDIUM" }, as: WireOpsAdmin, captures: { cust15: $.data.id } }
            - { call: "POST /wire-ops/accounts", payload: { customer_id: "${cust15}", account_number: "A-15001", daily_outgoing_limit_cents: 250000000 }, as: WireOpsAdmin, captures: { acct15: $.data.id } }
            - { call: "POST /wire-ops/beneficiaries", payload: { customer_id: "${cust15}", name: "Vendor Fifteen", bank_name: "Bank15", account_number: "B-1501", country_code: "US" }, as: WireOperator, captures: { ben15: $.data.id } }
            - { call: "POST /wire-ops/business-dates", payload: { business_date: "2026-08-17" }, as: WireOpsAdmin }
            - { call: "POST /wire-ops/wires", payload: { ordering_account_id: "${acct15}", beneficiary_id: "${ben15}", amount_cents: 200000, method: "Fedwire", purpose: "retire gate" }, as: WireOperator, as_user_id: "op-1", captures: { w15: $.data.id } }
            - { call: "POST /wire-ops/wires/${w15}/submit", payload: { business_date: "2026-08-17" }, as: WireOperator, as_user_id: "op-1" }
          trigger:
            - { call: "POST /wire-ops/beneficiaries/${ben15}/retire", payload: {}, as: WireOperator, as_user_id: "op-1", captures: { ben15_err: $.data.error_id } }
            - { call: "POST /wire-ops/wires/${w15}/cancel", payload: {}, as: WireOperator, as_user_id: "op-1" }
            - { call: "POST /wire-ops/beneficiaries/${ben15}/retire", payload: {}, as: WireOperator, as_user_id: "op-1", captures: { ben15_status: $.data.status } }
          assert:
            - "First retire rejected: ${ben15_err} == ERR_BENEFICIARY_IN_USE (non-terminal wire PENDING_APPROVAL references the beneficiary)"
            - "After the wire reaches terminal CANCELLED, the same retire succeeds: Beneficiary.${ben15}.status == RETIRED (${ben15_status})"

  # ---------------------------------------------------------------- Rule 8
  - rule_id: resource_temporal_overlap
    instances:
      - name: callback_window_strict_deadline_semantics
        grounds:
          - state_machines.CallbackVerification.OPEN_to_CONFIRMED
          - state_machines.CallbackVerification.OPEN_to_EXPIRED
          - validations[priority=18]
          - errors[ERR_CALLBACK_WINDOW_EXPIRED]
        distinguishing_aspect: |
          Interval semantics: a strict point-instant deadline on the
          CallbackVerification resource — recording is valid while now <
          expires_at and invalid AT now == expires_at (the instant itself is
          expired, half-open [opened_at, expires_at)); expiry destroys the
          wire (auto-CANCELLED). Different resource and different interval
          geometry from the 72-hour recall window.
        test_recipe:
          setup:
            - "Customer C16 (MEDIUM), Account A16 (limit 250000000), Beneficiary B16"
            - "Wire WA16: Fedwire 100000000 -> CALLBACK_PENDING at the default clock 2026-08-01T00:00:00Z; case CA16 OPEN, expires 2026-08-01T04:00:00Z"
            - "Wire WB16: Fedwire 100000000 created at clock 2026-08-01T03:59:59Z; case CB16 OPEN, expires 2026-08-01T07:59:59Z"
          setup_api_calls:
            - { call: "POST /wire-ops/customers", payload: { legal_name: "Pi Corp", risk_rating: "MEDIUM" }, as: WireOpsAdmin, captures: { cust16: $.data.id } }
            - { call: "POST /wire-ops/accounts", payload: { customer_id: "${cust16}", account_number: "A-16001", daily_outgoing_limit_cents: 250000000 }, as: WireOpsAdmin, captures: { acct16: $.data.id } }
            - { call: "POST /wire-ops/beneficiaries", payload: { customer_id: "${cust16}", name: "Vendor Sixteen", bank_name: "Bank16", account_number: "B-1601", country_code: "US" }, as: WireOperator, captures: { ben16: $.data.id } }
            - { call: "POST /wire-ops/wires", payload: { ordering_account_id: "${acct16}", beneficiary_id: "${ben16}", amount_cents: 100000000, method: "Fedwire", purpose: "window probe A" }, as: WireOperator, as_user_id: "op-1", captures: { wa16: $.data.id } }
            - { call: "GET /wire-ops/wires/${wa16}/callbacks", as: WireOperator, captures: { ca16: "$.data[0].id", ca16_exp: "$.data[0].expires_at" } }
            - { call: "POST /wire-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T03:59:59Z" }, as: WireOpsAdmin }
            - { call: "POST /wire-ops/wires", payload: { ordering_account_id: "${acct16}", beneficiary_id: "${ben16}", amount_cents: 100000000, method: "Fedwire", purpose: "window probe B" }, as: WireOperator, as_user_id: "op-1", captures: { wb16: $.data.id } }
            - { call: "GET /wire-ops/wires/${wb16}/callbacks", as: WireOperator, captures: { cb16: "$.data[0].id" } }
          trigger:
            - { call: "POST /wire-ops/callbacks/${ca16}/record", payload: { outcome: "CONFIRMED", contact_name: "Treasurer A", contact_phone: "+1-555-0100" }, as: WireOperator, as_user_id: "op-1", captures: { ca16_status: $.data.status } }
            - { call: "POST /wire-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T07:59:59Z" }, as: WireOpsAdmin }
            - { call: "POST /wire-ops/callbacks/${cb16}/record", payload: { outcome: "CONFIRMED", contact_name: "Treasurer B", contact_phone: "+1-555-0101" }, as: WireOperator, as_user_id: "op-1", captures: { cb16_err: $.data.error_id } }
            - { call: "GET /wire-ops/callbacks/${cb16}", as: WireOperator, captures: { cb16_status: $.data.status } }
            - { call: "GET /wire-ops/wires/${wb16}", as: WireOperator, captures: { wb16_status: $.data.status } }
          assert:
            - "Recorded at now (03:59:59) < expires_at (04:00:00): CallbackVerification.${ca16}.status == CONFIRMED (${ca16_status}) — one second inside the window is valid"
            - "Recorded at now (07:59:59) == expires_at (07:59:59): ${cb16_err} == ERR_CALLBACK_WINDOW_EXPIRED — the deadline instant itself is excluded (strict <)"
            - "Lazy expiry side effects: CallbackVerification.${cb16}.status == EXPIRED (${cb16_status}); WireTransfer.${wb16}.status == CANCELLED (${wb16_status})"

      - name: recall_response_window_72h_deferred_deadline
        grounds:
          - state_machines.RecallRequest.SENT_TO_BENEFICIARY_BANK_to_BENEFICIARY_RESPONDED
          - state_machines.RecallRequest.SENT_TO_BENEFICIARY_BANK_to_EXPIRED
          - validations[priority=20]
          - errors[ERR_RECALL_EXPIRED]
        distinguishing_aspect: |
          Interval semantics: a deferred multi-day window on the RecallRequest
          resource — response_due_at is only fixed when the recall is SENT
          (not at creation), and expiry at the deadline leaves the wire
          EXECUTED (the recall dies, the payment survives) — unlike the
          callback window whose expiry kills the wire. Different resource,
          different window semantics, different adjacency treatment.
        test_recipe:
          setup:
            - "Customer C17 (MEDIUM), Account A17 (limit 250000000), Beneficiary B17, BusinessDate 2026-08-18 OPEN"
            - "Wires WA17 and WB17: Fedwire 1000000 each, both fully EXECUTED"
            - "Clock set to 2026-08-01T00:00:00Z; Recall RA17 on WA17 sent at 2026-08-01T00:00:00Z (due 2026-08-04T00:00:00Z); Recall RB17 on WB17 sent at 2026-08-01T01:00:00Z (due 2026-08-04T01:00:00Z)"
          setup_api_calls:
            - { call: "POST /wire-ops/customers", payload: { legal_name: "Rho LLC", risk_rating: "MEDIUM" }, as: WireOpsAdmin, captures: { cust17: $.data.id } }
            - { call: "POST /wire-ops/accounts", payload: { customer_id: "${cust17}", account_number: "A-17001", daily_outgoing_limit_cents: 250000000 }, as: WireOpsAdmin, captures: { acct17: $.data.id } }
            - { call: "POST /wire-ops/beneficiaries", payload: { customer_id: "${cust17}", name: "Vendor Seventeen", bank_name: "Bank17", account_number: "B-1701", country_code: "US" }, as: WireOperator, captures: { ben17: $.data.id } }
            - { call: "POST /wire-ops/business-dates", payload: { business_date: "2026-08-18" }, as: WireOpsAdmin }
            - { call: "POST /wire-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: WireOpsAdmin }
            - { call: "POST /wire-ops/wires", payload: { ordering_account_id: "${acct17}", beneficiary_id: "${ben17}", amount_cents: 1000000, method: "Fedwire", purpose: "recall window A" }, as: WireOperator, as_user_id: "op-1", captures: { wa17: $.data.id } }
            - { call: "POST /wire-ops/wires/${wa17}/submit", payload: { business_date: "2026-08-18" }, as: WireOperator, as_user_id: "op-1" }
            - { call: "GET /wire-ops/wires/${wa17}", as: WireOperator, captures: { wa17_v1: $.data.version } }
            - { call: "POST /wire-ops/wires/${wa17}/approve", payload: { expected_wire_version: "${wa17_v1}" }, as: WireApprover, as_user_id: "ap-1" }
            - { call: "GET /wire-ops/wires/${wa17}", as: WireOperator, captures: { wa17_v2: $.data.version } }
            - { call: "POST /wire-ops/wires/${wa17}/approve", payload: { expected_wire_version: "${wa17_v2}" }, as: WireApprover, as_user_id: "ap-2" }
            - { call: "GET /wire-ops/wires/${wa17}", as: WireOperator, captures: { wa17_v3: $.data.version } }
            - { call: "POST /wire-ops/wires/${wa17}/release", payload: { expected_wire_version: "${wa17_v3}" }, as: WireOperator, as_user_id: "op-1" }
            - { call: "POST /wire-ops/recalls", payload: { wire_id: "${wa17}", reason: "DUPLICATE", amount_to_recall_cents: 1000000 }, as: WireOperator, as_user_id: "op-1", captures: { ra17: $.data.id } }
            - { call: "POST /wire-ops/recalls/${ra17}/send", payload: {}, as: WireOperator, as_user_id: "op-1" }
            - { call: "POST /wire-ops/wires", payload: { ordering_account_id: "${acct17}", beneficiary_id: "${ben17}", amount_cents: 1000000, method: "Fedwire", purpose: "recall window B" }, as: WireOperator, as_user_id: "op-1", captures: { wb17: $.data.id } }
            - { call: "POST /wire-ops/wires/${wb17}/submit", payload: { business_date: "2026-08-18" }, as: WireOperator, as_user_id: "op-1" }
            - { call: "GET /wire-ops/wires/${wb17}", as: WireOperator, captures: { wb17_v1: $.data.version } }
            - { call: "POST /wire-ops/wires/${wb17}/approve", payload: { expected_wire_version: "${wb17_v1}" }, as: WireApprover, as_user_id: "ap-1" }
            - { call: "GET /wire-ops/wires/${wb17}", as: WireOperator, captures: { wb17_v2: $.data.version } }
            - { call: "POST /wire-ops/wires/${wb17}/approve", payload: { expected_wire_version: "${wb17_v2}" }, as: WireApprover, as_user_id: "ap-2" }
            - { call: "GET /wire-ops/wires/${wb17}", as: WireOperator, captures: { wb17_v3: $.data.version } }
            - { call: "POST /wire-ops/wires/${wb17}/release", payload: { expected_wire_version: "${wb17_v3}" }, as: WireOperator, as_user_id: "op-1" }
            - { call: "POST /wire-ops/recalls", payload: { wire_id: "${wb17}", reason: "FRAUD", amount_to_recall_cents: 1000000 }, as: WireOperator, as_user_id: "op-1", captures: { rb17: $.data.id } }
            - { call: "POST /wire-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T01:00:00Z" }, as: WireOpsAdmin }
            - { call: "POST /wire-ops/recalls/${rb17}/send", payload: {}, as: WireOperator, as_user_id: "op-1" }
          trigger:
            - { call: "POST /wire-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T23:59:59Z" }, as: WireOpsAdmin }
            - { call: "POST /wire-ops/recalls/${ra17}/respond", payload: { response: "FUNDS_RETURNED" }, as: BeneficiaryBank, as_user_id: "benebank-1", captures: { ra17_status: $.data.status } }
            - { call: "POST /wire-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-04T01:00:00Z" }, as: WireOpsAdmin }
            - { call: "POST /wire-ops/recalls/${rb17}/respond", payload: { response: "FUNDS_RETURNED" }, as: BeneficiaryBank, as_user_id: "benebank-1", captures: { rb17_err: $.data.error_id } }
            - { call: "GET /wire-ops/recalls/${rb17}", as: WireOperator, captures: { rb17_status: $.data.status } }
            - { call: "GET /wire-ops/wires/${wb17}", as: WireOperator, captures: { wb17_status: $.data.status } }
          assert:
            - "Response one second before the 72h deadline (due 2026-08-04T00:00:00Z, now 2026-08-03T23:59:59Z): RecallRequest.${ra17}.status == BENEFICIARY_RESPONDED (${ra17_status})"
            - "Response exactly AT the deadline (due 2026-08-04T01:00:00Z, now 2026-08-04T01:00:00Z): ${rb17_err} == ERR_RECALL_EXPIRED (strict < semantics, same half-open shape but on a deferred window fixed at send time)"
            - "RecallRequest.${rb17}.status == EXPIRED (${rb17_status}); WireTransfer.${wb17}.status == EXECUTED (${wb17_status}) — recall expiry does NOT cancel the wire, unlike callback expiry"

  # ---------------------------------------------------------------- Rule 9
  - rule_id: compensating_invariant
    instances:
      - name: reservation_conservation_across_lifecycle_exits
        grounds:
          - calculations.daily_limit_check
          - entities.Account.fields.daily_reserved_cents
          - state_machines.WireTransfer.PENDING_APPROVAL_to_REJECTED
          - state_machines.WireTransfer.APPROVED_to_RELEASING
        distinguishing_aspect: |
          Conserved quantity: the account's daily reservation balance.
          Invariant: Account.daily_reserved_cents == sum of amount_cents over
          wires with reservation_active = true — verified across FOUR
          different exits (reject, release-conversion, amount-changing repair,
          cancel), each of which must leave the invariant exact.
        test_recipe:
          setup:
            - "Customer C18 (MEDIUM), Account A18 (limit 250000000), Beneficiary B18, BusinessDate 2026-08-19 OPEN"
            - "Wires W1 (500000), W2 (300000), W3 (200000) all submitted: daily_reserved_cents == 1000000"
          setup_api_calls:
            - { call: "POST /wire-ops/customers", payload: { legal_name: "Sigma SA", risk_rating: "MEDIUM" }, as: WireOpsAdmin, captures: { cust18: $.data.id } }
            - { call: "POST /wire-ops/accounts", payload: { customer_id: "${cust18}", account_number: "A-18001", daily_outgoing_limit_cents: 250000000 }, as: WireOpsAdmin, captures: { acct18: $.data.id } }
            - { call: "POST /wire-ops/beneficiaries", payload: { customer_id: "${cust18}", name: "Vendor Eighteen", bank_name: "Bank18", account_number: "B-1801", country_code: "US" }, as: WireOperator, captures: { ben18: $.data.id } }
            - { call: "POST /wire-ops/business-dates", payload: { business_date: "2026-08-19" }, as: WireOpsAdmin }
            - { call: "POST /wire-ops/wires", payload: { ordering_account_id: "${acct18}", beneficiary_id: "${ben18}", amount_cents: 500000, method: "Fedwire", purpose: "res w1" }, as: WireOperator, as_user_id: "op-1", captures: { w18a: $.data.id } }
            - { call: "POST /wire-ops/wires/${w18a}/submit", payload: { business_date: "2026-08-19" }, as: WireOperator, as_user_id: "op-1" }
            - { call: "POST /wire-ops/wires", payload: { ordering_account_id: "${acct18}", beneficiary_id: "${ben18}", amount_cents: 300000, method: "Fedwire", purpose: "res w2" }, as: WireOperator, as_user_id: "op-1", captures: { w18b: $.data.id } }
            - { call: "POST /wire-ops/wires/${w18b}/submit", payload: { business_date: "2026-08-19" }, as: WireOperator, as_user_id: "op-1" }
            - { call: "POST /wire-ops/wires", payload: { ordering_account_id: "${acct18}", beneficiary_id: "${ben18}", amount_cents: 200000, method: "Fedwire", purpose: "res w3" }, as: WireOperator, as_user_id: "op-1", captures: { w18c: $.data.id } }
            - { call: "POST /wire-ops/wires/${w18c}/submit", payload: { business_date: "2026-08-19" }, as: WireOperator, as_user_id: "op-1" }
            - { call: "GET /wire-ops/accounts/${acct18}", as: WireOperator, captures: { a18_res_0: $.data.daily_reserved_cents } }
          trigger:
            - { call: "POST /wire-ops/wires/${w18b}/reject", payload: { reason: "duplicate instruction" }, as: WireApprover, as_user_id: "ap-1" }
            - { call: "GET /wire-ops/accounts/${acct18}", as: WireOperator, captures: { a18_res_1: $.data.daily_reserved_cents } }
            - { call: "GET /wire-ops/wires/${w18a}", as: WireOperator, captures: { w18a_v1: $.data.version } }
            - { call: "POST /wire-ops/wires/${w18a}/approve", payload: { expected_wire_version: "${w18a_v1}" }, as: WireApprover, as_user_id: "ap-1" }
            - { call: "GET /wire-ops/wires/${w18a}", as: WireOperator, captures: { w18a_v2: $.data.version } }
            - { call: "POST /wire-ops/wires/${w18a}/approve", payload: { expected_wire_version: "${w18a_v2}" }, as: WireApprover, as_user_id: "ap-2" }
            - { call: "GET /wire-ops/wires/${w18a}", as: WireOperator, captures: { w18a_v3: $.data.version } }
            - { call: "POST /wire-ops/wires/${w18a}/release", payload: { expected_wire_version: "${w18a_v3}" }, as: WireOperator, as_user_id: "op-1" }
            - { call: "GET /wire-ops/accounts/${acct18}", as: WireOperator, captures: { a18_res_2: $.data.daily_reserved_cents, a18_rel_2: $.data.daily_released_cents } }
            - { call: "GET /wire-ops/wires/${w18c}", as: WireOperator, captures: { w18c_v1: $.data.version } }
            - { call: "POST /wire-ops/wires/${w18c}/repair", payload: { expected_wire_version: "${w18c_v1}", amount_cents: 250000 }, as: RepairSpecialist, as_user_id: "rs-1" }
            - { call: "GET /wire-ops/accounts/${acct18}", as: WireOperator, captures: { a18_res_3: $.data.daily_reserved_cents } }
            - { call: "POST /wire-ops/wires/${w18c}/cancel", payload: {}, as: WireOperator, as_user_id: "op-1" }
            - { call: "GET /wire-ops/accounts/${acct18}", as: WireOperator, captures: { a18_res_4: $.data.daily_reserved_cents, a18_rel_4: $.data.daily_released_cents } }
          assert:
            - "After three submissions: daily_reserved_cents == 1000000 (${a18_res_0})"
            - "After reject of the 300000 wire: daily_reserved_cents == 700000 (${a18_res_1}) — rejection compensates the reservation exactly"
            - "After release of the 500000 wire: daily_reserved_cents == 200000 (${a18_res_2}) AND daily_released_cents == 500000 (${a18_rel_2}) — reservation converts, never double-counted"
            - "After repair re-basing 200000 -> 250000: daily_reserved_cents == 250000 (${a18_res_3}) — the delta (+50000) is applied, not a re-add"
            - "After cancel: daily_reserved_cents == 0 (${a18_res_4}) with daily_released_cents still 500000 (${a18_rel_4}) — every forward action paired with its compensating exit leaves the named quantity exact"

      - name: principal_decomposition_invariant_across_recall
        grounds:
          - calculations.recall_compensation
          - entities.WireTransfer.fields.net_principal_cents
          - state_machines.RecallRequest.BENEFICIARY_RESPONDED_to_COMPLETED
        distinguishing_aspect: |
          Conserved quantity of a DIFFERENT type: money decomposition on the
          wire itself — amount_cents == net_principal_cents +
          correspondent_deducted_cents must hold at execution AND still hold
          after a partial recall completes (recall bookkeeping must not drift
          the wire's own decomposition).
        test_recipe:
          setup:
            - "Customer C19 (MEDIUM), Account A19 (limit 250000000), Beneficiary B19, BusinessDate 2026-08-20 OPEN"
            - "Wire W19: Fedwire 10000000 ($100k), ACTUAL_ADVICE DEDUCTED_FROM_PRINCIPAL charges 4000 and 2000 posted while APPROVED, fully EXECUTED"
            - "Recall R19 (ERROR_AMOUNT, 5000000) progressed to BENEFICIARY_RESPONDED with FUNDS_RETURNED"
          setup_api_calls:
            - { call: "POST /wire-ops/customers", payload: { legal_name: "Tau Inc", risk_rating: "MEDIUM" }, as: WireOpsAdmin, captures: { cust19: $.data.id } }
            - { call: "POST /wire-ops/accounts", payload: { customer_id: "${cust19}", account_number: "A-19001", daily_outgoing_limit_cents: 250000000 }, as: WireOpsAdmin, captures: { acct19: $.data.id } }
            - { call: "POST /wire-ops/beneficiaries", payload: { customer_id: "${cust19}", name: "Vendor Nineteen", bank_name: "Bank19", account_number: "B-1901", country_code: "US" }, as: WireOperator, captures: { ben19: $.data.id } }
            - { call: "POST /wire-ops/business-dates", payload: { business_date: "2026-08-20" }, as: WireOpsAdmin }
            - { call: "POST /wire-ops/wires", payload: { ordering_account_id: "${acct19}", beneficiary_id: "${ben19}", amount_cents: 10000000, method: "Fedwire", purpose: "invariant probe" }, as: WireOperator, as_user_id: "op-1", captures: { w19: $.data.id } }
            - { call: "POST /wire-ops/wires/${w19}/submit", payload: { business_date: "2026-08-20" }, as: WireOperator, as_user_id: "op-1" }
            - { call: "GET /wire-ops/wires/${w19}", as: WireOperator, captures: { w19_v1: $.data.version } }
            - { call: "POST /wire-ops/wires/${w19}/approve", payload: { expected_wire_version: "${w19_v1}" }, as: WireApprover, as_user_id: "ap-1" }
            - { call: "GET /wire-ops/wires/${w19}", as: WireOperator, captures: { w19_v2: $.data.version } }
            - { call: "POST /wire-ops/wires/${w19}/approve", payload: { expected_wire_version: "${w19_v2}" }, as: WireApprover, as_user_id: "ap-2" }
            - { call: "POST /wire-ops/wires/${w19}/charges", payload: { correspondent_name: "CorrP", charge_type: "DEDUCTED_FROM_PRINCIPAL", amount_cents: 4000, source: "ACTUAL_ADVICE" }, as: WireOperator }
            - { call: "POST /wire-ops/wires/${w19}/charges", payload: { correspondent_name: "CorrQ", charge_type: "DEDUCTED_FROM_PRINCIPAL", amount_cents: 2000, source: "ACTUAL_ADVICE" }, as: WireOperator }
            - { call: "GET /wire-ops/wires/${w19}", as: WireOperator, captures: { w19_v3: $.data.version } }
            - { call: "POST /wire-ops/wires/${w19}/release", payload: { expected_wire_version: "${w19_v3}" }, as: WireOperator, as_user_id: "op-1" }
            - { call: "GET /wire-ops/wires/${w19}", as: WireOperator, captures: { w19_amt: $.data.amount_cents, w19_net: $.data.net_principal_cents } }
            - { call: "POST /wire-ops/recalls", payload: { wire_id: "${w19}", reason: "ERROR_AMOUNT", amount_to_recall_cents: 5000000 }, as: WireOperator, as_user_id: "op-1", captures: { r19: $.data.id } }
            - { call: "POST /wire-ops/recalls/${r19}/send", payload: {}, as: WireOperator, as_user_id: "op-1" }
            - { call: "POST /wire-ops/recalls/${r19}/respond", payload: { response: "FUNDS_RETURNED" }, as: BeneficiaryBank, as_user_id: "benebank-1" }
          trigger:
            - { call: "POST /wire-ops/recalls/${r19}/complete", payload: {}, as: WireOperator, as_user_id: "op-1" }
            - { call: "GET /wire-ops/wires/${w19}", as: WireOperator, captures: { w19_status: $.data.status, w19_amt_post: $.data.amount_cents, w19_net_post: $.data.net_principal_cents } }
            - { call: "GET /wire-ops/wires/${w19}/charges", as: WireOperator, captures: { w19_chg0: "$.data[0].amount_cents", w19_chg1: "$.data[1].amount_cents" } }
          assert:
            - "At execution: amount_cents 10000000 (${w19_amt}) == net_principal_cents 9994000 (${w19_net}) + correspondent_deducted 6000 (4000 + 2000) — invariant holds"
            - "After recall completion: amount_cents == 10000000 (${w19_amt_post}) and net_principal_cents == 9994000 (${w19_net_post}) unchanged; POSTED charge amounts still 4000 and 2000 (${w19_chg0}, ${w19_chg1}) — invariant amount == net + deducted survives the recall, WireTransfer.${w19}.status == RECALLED (${w19_status})"
            - "Recall delta bookkeeping: 5000000 recovered of 9994000 net leaves a 4994000 unrecovered recall loss — no drift leaks into the wire's principal fields"
