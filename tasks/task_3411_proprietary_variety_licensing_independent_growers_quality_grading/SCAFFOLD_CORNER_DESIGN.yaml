            - call: "POST /licensing/growers/00000000-0000-4000-8000-000000000002/suspend"
              payload: {}
              as: ComplianceOfficer
              captures: { e2: $.data.error_id }
            - call: "GET /licensing/agreements/00000000-0000-4000-8000-000000000003"
              payload: {}
              as: ComplianceOfficer
              captures: { e3: $.data.error_id }
            - call: "GET /licensing/plant-lots/00000000-0000-4000-8000-000000000004"
              payload: {}
              as: ComplianceOfficer
              captures: { e4: $.data.error_id }
            - call: "GET /licensing/plantings/00000000-0000-4000-8000-000000000005"
              payload: {}
              as: ComplianceOfficer
              captures: { e5: $.data.error_id }
            - call: "GET /licensing/harvest-lots/00000000-0000-4000-8000-000000000006"
              payload: {}
              as: ComplianceOfficer
              captures: { e6: $.data.error_id }
            - call: "GET /licensing/harvest-windows/00000000-0000-4000-8000-000000000007"
              payload: {}
              as: ComplianceOfficer
              captures: { e7: $.data.error_id }
            - call: "GET /licensing/pool-periods/00000000-0000-4000-8000-000000000008"
              payload: {}
              as: ComplianceOfficer
              captures: { e8: $.data.error_id }
            - call: "POST /licensing/recall-orders/00000000-0000-4000-8000-000000000009/enforce"
              payload: {}
              as: ComplianceOfficer
              captures: { e9: $.data.error_id }
          assert:
            - "all nine responses are 404 with response_type error"
            - "e1 == ERR_VARIETY_NOT_FOUND, e2 == ERR_GROWER_NOT_FOUND, e3 == ERR_AGREEMENT_NOT_FOUND, e4 == ERR_PLANT_LOT_NOT_FOUND, e5 == ERR_PLANTING_NOT_FOUND, e6 == ERR_HARVEST_LOT_NOT_FOUND"
            - "e7 == ERR_NOT_FOUND, e8 == ERR_NOT_FOUND, e9 == ERR_NOT_FOUND (generic code for window/pool/statement/recall-order misses)"

      - name: decide_approve_on_development_variety_rejected
        claim_type: Violation -> Error
        grounds:
          - validations[priority=7]
          - errors.ERR_VARIETY_NOT_RELEASED
        distinguishing_aspect: "Approving an agreement whose variety is still DEVELOPMENT fails 409 ERR_VARIETY_NOT_RELEASED — the release gate lives at decide time, not at agreement creation."
        test_recipe:
          setup: ["V1 created but NOT released; G1 ACTIVE; A1 PENDING_REVIEW."]
          setup_api_calls:
            - *c_clock
            - *c_v1
            - *c_g1
            - *c_a1
          trigger:
            - call: "POST /licensing/agreements/${a1_id}/decide"
              payload: { decision: "APPROVE" }
              as: ComplianceOfficer
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 409 with error_id == ERR_VARIETY_NOT_RELEASED"
            - "GrowerAgreement.${a1_id} stays PENDING_REVIEW"

      - name: grade_before_receive_rejected
        claim_type: Violation -> Error
        grounds:
          - validations[priority=7]
          - errors.ERR_LOT_NOT_RECEIVED
        distinguishing_aspect: "Grading an IN_TRANSIT lot fails 409 ERR_LOT_NOT_RECEIVED; nothing is stored (grade_status stays UNGRADED, grade_version stays 0)."
        test_recipe:
          setup: ["Canonical chain through H1 created (IN_TRANSIT)."]
          setup_api_calls:
            - *c_clock
            - *c_v1
            - *c_v1_rel
            - *c_g1
            - *c_a1
            - *c_a1_dec
            - *c_l1
            - *c_w1
            - *c_p1
            - *c_clock_aug
            - *c_p1_conf
            - *c_clock_h1a
            - *c_h1
          trigger:
