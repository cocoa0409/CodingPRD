              - call: "POST /finops/business-units"
                payload: { name: "Ops", cost_center_code: "CC-400", chargeback_enabled: true, headcount: 10 }
                as: PlatformAdmin
                as_user_id: "admin-1"
                captures: { bu_id: "$.data.id" }
              - call: "POST /finops/business-units"
