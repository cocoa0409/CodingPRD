            - "A FamilyConference invited to both contacts, CONVENED with Alice attending, so quorum_met == true."
            - "A VENDOR_ENGAGEMENT ConferenceDecision by Alice in status RATIFIED."
            - "A ServiceAuthorization naming that decision as authorizing_decision_id, in auth_status AUTHORIZED, covering 8 hours with 1 caregiver, so coverage_gap_flag is false and risk_posture is ROUTINE."
          setup_api_calls:
