# =============================================================================
# Task 1245: Jet Card & Block-Hour Program — Corner Design (§1.9)
# Breadth coverage: every testable claim not covered by §1.8.
# =============================================================================

scaffold_corner_design:
  # ---------------------------------------------------------------------------
  # Section: entities
  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: card_program_creation_required_fields
        claim_type: creation
        grounds: [entities.CardProgram, "endpoints.POST /programs"]
        distinguishing_aspect: "POST /programs with all required fields returns 201 + fields populated; missing required field returns ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: Ops
          trigger:
            - call: "POST /programs"
              payload:
                program_code: "CORNER_P1"
                aircraft_category: "MIDSIZE"
                hours_purchased: 50
                purchase_price_cents: 30000000
                swap_ratio_to_lower: 0.85
                swap_ratio_to_higher: 1.30
                expiry_months: 24
                taxi_minutes_per_leg: 12
                min_billable_minutes_per_leg: 60
                peak_surcharge_pct: 0.15
                availability_window_hours: 24
                round_trip_discount_pct: 0.10
                early_termination_penalty_pct: 0.20
                fractional_upgrade_ratio: 0.0625
              as: Ops
              captures: { prog_c_id: $.data.id }
          assert:
            - "response.status == 201"
            - "CardProgram.${prog_c_id}.program_code == CORNER_P1"
            - "CardProgram.${prog_c_id}.version == 1"

      - name: member_creation_and_default_status
        claim_type: defaults
        grounds: [entities.Member.fields.member_status, "endpoints.POST /members"]
        distinguishing_aspect: "POST /members creates Member with member_status defaulted to ACTIVE (system-set, not input)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: Ops
          trigger:
            - call: "POST /members"
              payload:
                email: "cd@x.com"
                full_name: "Cd Member"
                tier: "INDIVIDUAL"
                home_base_icao: "KTEB"
              as: Ops
              captures: { m_c_id: $.data.id }
          assert:
            - "Member.${m_c_id}.member_status == ACTIVE"

      - name: card_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]", "endpoints.GET /cards/{cardId}"]
        distinguishing_aspect: "GET /cards/<non-existent-uuid> returns ERR_NOT_FOUND 404."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: Ops
          trigger:
            - call: "GET /cards/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: Ops
          assert:
            - "error_id == ERR_NOT_FOUND"
            - "http_status == 404"

      - name: jet_card_expires_at_computed
        claim_type: computed_fields
        grounds: [entities.JetCard.fields.expires_at, "endpoints.POST /cards/{cardId}/activate"]
        distinguishing_aspect: "expires_at is computed as purchased_at + program.expiry_months; client input for expires_at is ignored."
        test_recipe:
          setup: ["Program expiry_months=18; card activated at 2026-01-15"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-15T00:00:00Z" }
              as: Ops
            - call: "POST /programs"
              payload:
                program_code: "CORNER_EXP"
                aircraft_category: "LIGHT"
                hours_purchased: 25
                purchase_price_cents: 10000000
                swap_ratio_to_lower: 0.90
                swap_ratio_to_higher: 1.25
                expiry_months: 18
                taxi_minutes_per_leg: 12
                min_billable_minutes_per_leg: 60
                peak_surcharge_pct: 0.15
                availability_window_hours: 24
                round_trip_discount_pct: 0.10
                early_termination_penalty_pct: 0.20
                fractional_upgrade_ratio: 0.0625
              as: Ops
              captures: { prog_e_id: $.data.id }
            - call: "POST /members"
              payload:
                email: "ce@x.com"
                full_name: "Ce Member"
                tier: "INDIVIDUAL"
                home_base_icao: "KTEB"
              as: Ops
              captures: { m_e_id: $.data.id }
            - call: "POST /members/${m_e_id}/cards"
              payload: { program_id: "${prog_e_id}" }
              as: Ops
              captures: { c_e_id: $.data.id }
          trigger:
            - call: "POST /cards/${c_e_id}/activate"
              payload: {}
              as: Ops
          assert:
            - "Card.${c_e_id}.expires_at == 2027-07-15T00:00:00Z (purchased_at + 18 months)"

  # ---------------------------------------------------------------------------
  # Section: state_machines
  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: trip_invalid_from_state_confirm_from_dispatched
        claim_type: invalid_transition
        grounds: [state_machines.TripRequest, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "POST /trips/{id}/confirm on a trip already in DISPATCHED state returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["Trip in DISPATCHED state"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: Ops
            - call: "POST /programs"
              payload:
                program_code: "SM1"
                aircraft_category: "LIGHT"
                hours_purchased: 25
                purchase_price_cents: 10000000
                swap_ratio_to_lower: 0.90
                swap_ratio_to_higher: 1.25
                expiry_months: 18
                taxi_minutes_per_leg: 12
                min_billable_minutes_per_leg: 60
                peak_surcharge_pct: 0.15
                availability_window_hours: 24
                round_trip_discount_pct: 0.10
                early_termination_penalty_pct: 0.20
                fractional_upgrade_ratio: 0.0625
              as: Ops
              captures: { prog_sm1: $.data.id }
            - call: "POST /members"
              payload:
                email: "sm1@x.com"
                full_name: "SM One"
                tier: "INDIVIDUAL"
                home_base_icao: "KTEB"
              as: Ops
              captures: { m_sm1: $.data.id }
            - call: "POST /members/${m_sm1}/cards"
              payload: { program_id: "${prog_sm1}" }
              as: Ops
              captures: { c_sm1: $.data.id }
            - call: "POST /cards/${c_sm1}/activate"
              payload: {}
              as: Ops
            - call: "POST /aircraft"
              payload:
                tail_number: "N111LT"
                category: "LIGHT"
                home_base_icao: "KTEB"
                seats: 6
                reposition_rate_cents_per_nm: 80
              as: Ops
              captures: { ac_sm1: $.data.id }
            - call: "POST /cards/${c_sm1}/trips"
              payload:
                trip_kind: "ONE_WAY"
                departure_icao: "KTEB"
                arrival_icao: "KPBI"
                requested_departure_utc: "2026-01-15T15:00:00Z"
                pax_count: 4
                requested_category: "LIGHT"
              as: Member
              as_user_id: "${m_sm1}"
              captures: { t_sm1: $.data.id }
            - call: "POST /trips/${t_sm1}/confirm"
              payload: {}
              as: Member
              as_user_id: "${m_sm1}"
            - call: "POST /trips/${t_sm1}/dispatch"
              payload: { dispatched_aircraft_id: "${ac_sm1}" }
              as: Ops
          trigger:
            - call: "POST /trips/${t_sm1}/confirm"
              payload: {}
              as: Member
              as_user_id: "${m_sm1}"
          assert:
            - "error_id == ERR_INVALID_STATE"
            - "http_status == 409"

      - name: card_terminal_state_lockdown_expired
        claim_type: terminal_state_lockdown
        grounds: [state_machines.JetCard]
        distinguishing_aspect: "Card in EXPIRED terminal state: no transitions allowed (suspend/resume fail with ERR_INVALID_STATE)."
        test_recipe:
          setup: ["Card EXPIRED via sweep"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: Ops
            - call: "POST /programs"
              payload:
                program_code: "SM2"
                aircraft_category: "LIGHT"
                hours_purchased: 25
                purchase_price_cents: 10000000
                swap_ratio_to_lower: 0.90
                swap_ratio_to_higher: 1.25
                expiry_months: 1
                taxi_minutes_per_leg: 12
                min_billable_minutes_per_leg: 60
                peak_surcharge_pct: 0.15
                availability_window_hours: 24
                round_trip_discount_pct: 0.10
                early_termination_penalty_pct: 0.20
                fractional_upgrade_ratio: 0.0625
              as: Ops
              captures: { prog_sm2: $.data.id }
            - call: "POST /members"
              payload:
                email: "sm2@x.com"
                full_name: "SM Two"
                tier: "INDIVIDUAL"
                home_base_icao: "KTEB"
              as: Ops
              captures: { m_sm2: $.data.id }
            - call: "POST /members/${m_sm2}/cards"
              payload: { program_id: "${prog_sm2}" }
              as: Ops
              captures: { c_sm2: $.data.id }
            - call: "POST /cards/${c_sm2}/activate"
              payload: {}
              as: Ops
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: Ops
            - call: "POST /ops/run"
              payload: {}
              as: Ops
          trigger:
            - call: "POST /cards/${c_sm2}/suspend"
              payload: {}
              as: Ops
          assert:
            - "error_id == ERR_INVALID_STATE"
            - "Card.${c_sm2}.card_status == EXPIRED (unchanged)"

      - name: card_initial_state_pending_payment
        claim_type: initial_state
        grounds: [state_machines.JetCard]
        distinguishing_aspect: "Newly created JetCard starts in PENDING_PAYMENT state."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: Ops
            - call: "POST /programs"
              payload:
                program_code: "SM3"
                aircraft_category: "LIGHT"
                hours_purchased: 25
                purchase_price_cents: 10000000
                swap_ratio_to_lower: 0.90
                swap_ratio_to_higher: 1.25
                expiry_months: 18
                taxi_minutes_per_leg: 12
                min_billable_minutes_per_leg: 60
                peak_surcharge_pct: 0.15
                availability_window_hours: 24
                round_trip_discount_pct: 0.10
                early_termination_penalty_pct: 0.20
                fractional_upgrade_ratio: 0.0625
              as: Ops
              captures: { prog_sm3: $.data.id }
            - call: "POST /members"
              payload:
                email: "sm3@x.com"
                full_name: "SM Three"
                tier: "INDIVIDUAL"
                home_base_icao: "KTEB"
