              as: PlantController
              captures: { prod_v_8: "$.data.version" }
            - call: "POST /dairy/tanker-receipts/${rcpt}/release"
              payload: { expected_producer_version: "${prod_v_8}" }
              as: QualityAssuranceManager
            - call: "GET /dairy/producers/${prod_id}"
              as: PlantController
              captures: { v_after: $.data.version }
          assert:
            - "v_before == 1"
            - "v_after == 2 (release incremented Producer.version by exactly 1)"

      - name: cascading_abort_scraps_batches_and_invalidates_assays
        claim_type: cascading_side_effects
        grounds: [state_machines.PasteurizerRun.RUNNING_to_ABORTED]

        distinguishing_aspect: "Aborting a RUNNING run cascades: each IN_PRODUCTION batch → SCRAPPED; ComponentAssay records consumed by the run become ineligible for pooling."
        test_recipe:
          setup: ["Run RUNNING with one batch IN_PRODUCTION"]
          setup_api_calls:
            - call: "POST /dairy/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T06:00:00Z" }
              as: PlantController
            - call: "POST /dairy/grade-a-permits"
              payload: { permit_number: "GA-CC", issued_at: "2026-01-01T00:00:00Z", expires_at: "2027-01-01T00:00:00Z" }
              as: StateInspector
            - call: "POST /dairy/pasteurizer-runs"
              payload: { pasteurizer_id: "HTST-1", scheduled_start_at: "2026-05-10T08:00:00Z", scheduled_end_at: "2026-05-10T12:00:00Z", flow_rate_gph: 5000, min_hold_temp_f: 161 }
              as: PasteurizerOperator
              captures: { run_id: $.data.id }
            - call: "POST /dairy/pasteurizer-runs/${run_id}/cip-cycles"
              payload: { started_at: "2026-05-10T06:00:00Z", caustic_conductivity_ms: 90.0, rinse_ph: 7.0 }
              as: PasteurizerOperator
              captures: { cip: $.data.id }
            - call: "POST /dairy/pasteurizer-runs/${run_id}/cip-cycles/${cip}/validate"
              payload: {}
              as: QualityAssuranceManager
            - call: "POST /dairy/pasteurizer-runs/${run_id}/start"
              payload: {}
              as: PasteurizerOperator
            - call: "POST /dairy/pasteurizer-runs/${run_id}/batches"
              payload: { product_code: "WHOLE_MILK", quantity_gallons: 1000, shelf_life_days: 14 }
              as: PasteurizerOperator
              captures: { batch: $.data.id }
            - call: "POST /dairy/pasteurizer-runs/${run_id}/batches/${batch}/begin"
              payload: {}
              as: PasteurizerOperator
          trigger:
            - call: "POST /dairy/pasteurizer-runs/${run_id}/abort"
              payload: {}
              as: PasteurizerOperator
            - call: "GET /dairy/pasteurizer-runs/${run_id}/batches"
              as: PasteurizerOperator
              captures: { first_batch_status: "$.data[0].status" }
          assert:
            - "PasteurizerRun.${run_id}.status == ABORTED"
            - "ProductBatch.${batch}.status == SCRAPPED (cascaded from abort)"

  # =========================================================================
  # Section: consistency_model (immediate)
  # =========================================================================
  - section: consistency_model
    instances:
      - name: release_response_reflects_new_state_immediately
        claim_type: immediate_consistency
        grounds: [complexity_profile.consistency_model]

        distinguishing_aspect: "The POST /release response body itself contains disposition=RELEASED_FOR_PROCESSING and updated net_weight_lbs/pool totals — no stale-read window."
        test_recipe:
          setup: ["Receipt with passing labs"]
          setup_api_calls:
            - call: "POST /dairy/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlantController
            - call: "POST /dairy/producers"
              payload: { producer_code: "PCO", farm_name: "FCO", base_hauling_rate_cents_per_cwt: 100 }
              as: PlantController
              captures: { prod_id: $.data.id }
            - call: "POST /dairy/haulers"
              payload: { hauler_code: "HCO", company_name: "Haul", license_expires_at: "2027-01-01T00:00:00Z" }
              as: PlantController
              captures: { hauler_id: $.data.id }
            - call: "POST /dairy/grade-a-permits"
              payload: { permit_number: "GA-CO", issued_at: "2026-01-01T00:00:00Z", expires_at: "2027-01-01T00:00:00Z" }
              as: StateInspector
            - call: "POST /dairy/tanker-receipts"
              payload: { producer_id: "${prod_id}", hauler_id: "${hauler_id}", arrived_at: "2026-05-05T08:00:00Z", gross_weight_lbs: 50000, tare_weight_lbs: 30000, temperature_f: 40 }
              as: QualityAssuranceManager
              captures: { rcpt: $.data.id }
            - call: "POST /dairy/tanker-receipts/${rcpt}/lab-tests"
              payload: { test_type: "ANTIBIOTIC", result_value: 0, lab_technician_id: "lt1" }
              as: LabTechnician
              captures: { lt1: $.data.id }
            - call: "POST /dairy/tanker-receipts/${rcpt}/lab-tests"
              payload: { test_type: "SCC", result_value: 300000, lab_technician_id: "lt1" }
              as: LabTechnician
              captures: { lt2: $.data.id }
            - call: "POST /dairy/tanker-receipts/${rcpt}/lab-tests/${lt1}/complete"
              payload: {}
              as: LabTechnician
            - call: "POST /dairy/tanker-receipts/${rcpt}/lab-tests/${lt2}/complete"
              payload: {}
              as: LabTechnician
          trigger:
            - call: "GET /dairy/producers/${prod_id}"
              as: PlantController
              captures: { prod_v_9: "$.data.version" }
            - call: "POST /dairy/tanker-receipts/${rcpt}/release"
              payload: { expected_producer_version: "${prod_v_9}" }
              as: QualityAssuranceManager
              captures: { disp: $.data.disposition, net: $.data.net_weight_lbs }
          assert:
            - "Response body disposition == RELEASED_FOR_PROCESSING (visible in same request, no re-GET needed)"
            - "Response body net_weight_lbs == 20000 (computed field visible immediately)"
