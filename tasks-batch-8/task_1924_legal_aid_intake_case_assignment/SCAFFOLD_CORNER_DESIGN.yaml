  - section: calculations
    instances:
      - name: poverty_percentage_household_three_precision
        claim_type: correct_result
        grounds: [calculations.poverty_percentage_screen]
        distinguishing_aspect: "Constants + precision: household_size 3 uses FPL 1,506,000 + 2 x 538,000 = 2,582,000 cents; income 3,000,000 -> 116.189...% -> 2dp round_half_up == 116.19, ELIGIBLE."
        test_recipe:
          setup: ["VenueRule (CountyA, BENEFITS_APPEAL); client household_size 3, gross 3,000,000"]
          setup_api_calls:
            - { call: "POST /venue-rules", payload: { county: "CountyA", case_type: "BENEFITS_APPEAL", venue: "ADMIN_TRIBUNAL", priority_base_weight: 40, extended_eligible: false }, as: ProgramDirector }
            - { call: "POST /staff-members", payload: { full_name: "Intake One", staff_type: "INTAKE_SPECIALIST", admitted_counties: ["CountyA"], practice_areas: ["BENEFITS_APPEAL"] }, as: ProgramDirector, captures: { intake_id: "$.data.id" } }
            - { call: "POST /clients", payload: { full_name: "Cli H3", residence_county: "CountyA", household_size: 3, annual_gross_income_cents: 3000000, annual_countable_income_cents: 2900000, receives_means_tested_benefits: false }, as: IntakeSpecialist, as_user_id: "${intake_id}", captures: { client_id: "$.data.id" } }
            - { call: "POST /intake-applications", payload: { client_id: "${client_id}", case_type: "BENEFITS_APPEAL", opposing_party_name: "Agency", incident_county: "CountyA" }, as: IntakeSpecialist, as_user_id: "${intake_id}", captures: { app_id: "$.data.id" } }
          trigger:
            - { call: "POST /intake-applications/${app_id}/screen", payload: {}, as: IntakeSpecialist, as_user_id: "${intake_id}", captures: { pct: "$.data.gross_poverty_percentage", det: "$.data.eligibility_determination" } }
          assert:
            - "gross_poverty_percentage == 116.19 (3000000 / 2582000 * 100 = 116.1890 -> round_half_up 2dp)"
            - "eligibility_determination == ELIGIBLE (116.19 <= 125.00)"

      - name: priority_score_capped_at_100
        claim_type: constants_applied
        grounds: [calculations.priority_score]
        distinguishing_aspect: "Both caps bind: vulnerability multiplier caps at 1.75 for n >= 5, and the final score caps at 100.00 — base 80 x 1.75 + 20 = 160 is stored as exactly 100.00."
        test_recipe:
          setup: ["VenueRule (CountyA, FAMILY_DV, base 80); client with 5 vulnerability factors"]
          setup_api_calls:
            - { call: "POST /venue-rules", payload: { county: "CountyA", case_type: "FAMILY_DV", venue: "FAMILY_COURT", priority_base_weight: 80, extended_eligible: true }, as: ProgramDirector }
            - { call: "POST /staff-members", payload: { full_name: "Intake One", staff_type: "INTAKE_SPECIALIST", admitted_counties: ["CountyA"], practice_areas: ["FAMILY_DV"] }, as: ProgramDirector, captures: { intake_id: "$.data.id" } }
            - { call: "POST /clients", payload: { full_name: "Cli Max", residence_county: "CountyA", household_size: 1, annual_gross_income_cents: 1000000, annual_countable_income_cents: 900000, receives_means_tested_benefits: false, vulnerability_factors: ["ELDERLY", "DISABLED", "DV_SURVIVOR", "HOMELESS", "VETERAN"] }, as: IntakeSpecialist, as_user_id: "${intake_id}", captures: { client_id: "$.data.id" } }
            - { call: "POST /intake-applications", payload: { client_id: "${client_id}", case_type: "FAMILY_DV", opposing_party_name: "Abuser", incident_county: "CountyA" }, as: IntakeSpecialist, as_user_id: "${intake_id}", captures: { app_id: "$.data.id" } }
