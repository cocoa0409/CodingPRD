          trigger:
            - call: "POST /api/phases"
              payload: { parcel_id: "${wp2}", phase_name: "BAD", sequence_number: 1, planned_lot_count: 5, selling_window_start: "2027-03-01T00:00:00Z", selling_window_end: "2026-09-01T00:00:00Z" }
              as: DeveloperOperator
              captures: { err: $.data.error_id }
          assert:
            - "captured err == ERR_INVALID_WINDOW (400)"

