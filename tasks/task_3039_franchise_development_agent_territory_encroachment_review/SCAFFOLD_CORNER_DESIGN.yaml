              payload: { legal_name: "KDP", contact_email: "da@kdp.example", agreement_start: "2026-01-01T00:00:00Z", agreement_end: "2031-01-01T00:00:00Z" }
              as: FranchisorOps
              captures: { da: $.data.id }
            - call: "POST /territories/${terr_id}/assign-agent"
              payload: { agent_id: "${da}" }
              as: FranchisorOps
            - call: "GET /territories/${terr_id}"
              payload: {}
              as: FranchisorOps
              captures: { terr_v: $.data.version }
            - call: "POST /franchisees"
              payload: { legal_name: "APP", contact_email: "a@example.com" }
              as: FranchisorOps
              captures: { appf: $.data.id }
            - call: "POST /site-applications"
              payload: { territory_id: "${terr_id}", applicant_franchisee_id: "${appf}", proposed_address: "1 First Ave", proposed_lat: 40.05, proposed_lng: -75.05, proposed_open_date: "2027-01-01T00:00:00Z", expected_territory_version: "${terr_v}" }
              as: DevelopmentAgent
              as_user_id: "${da}"
          trigger:
            - call: "POST /site-applications"
              payload: { territory_id: "${terr_id}", applicant_franchisee_id: "${appf}", proposed_address: "2 Second Ave", proposed_lat: 40.06, proposed_lng: -75.06, proposed_open_date: "2027-02-01T00:00:00Z", expected_territory_version: "${terr_v}" }
              as: DevelopmentAgent
