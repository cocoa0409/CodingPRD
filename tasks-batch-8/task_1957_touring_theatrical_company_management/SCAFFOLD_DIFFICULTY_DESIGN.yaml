  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: settlement_dispute_cycle
        grounds:
          - state_machines.Settlement.SUBMITTED_to_DISPUTED
          - state_machines.Settlement.DISPUTED_to_SUBMITTED
        distinguishing_aspect: |
          Cyclic machine on Settlement (distinct entity from Stop/InjuryEvent): the
          SUBMITTED -> DISPUTED -> SUBMITTED loop may repeat; resubmission re-arms
          submitted_by, and royalty accrues exactly once at the final APPROVE.
        test_recipe:
          setup:
            - "Closed stop; settlement with figures; submitted by trs-1 then disputed by Producer with a reason"
          setup_api_calls:
            - call: "POST /tours"
              payload: { name: "Tour A", budget_total_cents: 50000000, capitalization_cents: 10000000, per_diem_policy: FULL_WEEK, per_diem_daily_cents: 20000, royalty_tier_threshold_cents: 1000000 }
              as: Producer
              captures: { tour_id: "$.data.id", tour_v: "$.data.version "}
            - call: "POST /venues"
              payload: { name: "Venue V", city: "Chicago", stage_width_ft: 44, fly_capacity_lines: 30, power_amps: 400, crew_available: 20 }
              as: Producer
              captures: { venue_id: "$.data.id "}
            - call: "POST /tours/${tour_id}/stops"
              payload: { venue_id: "${venue_id}", play_week_start: "2026-09-07", play_week_end: "2026-09-13", load_in_date: "2026-09-05", travel_in_days: 1, guarantee_cents: 4000000, split_pct: 70, expected_tour_version: "${tour_v}" }
              as: TourManager
              captures: { stop_id: "$.data.id "}
            - call: "PUT /stops/${stop_id}"
              payload: { status: CONTRACTED }
              as: Producer
            - call: "PUT /stops/${stop_id}"
              payload: { status: ADVANCED }
              as: TourManager
            - call: "POST /stops/${stop_id}/tech-checks"
              payload: { item: STAGE_WIDTH_FT, required_value: 40 }
              as: TourManager
              captures: { check_id: "$.data.id "}
            - call: "PUT /tech-checks/${check_id}"
              payload: { actual_value: 42 }
              as: TourManager
            - call: "PUT /stops/${stop_id}"
              payload: { status: READY }
              as: TourManager
            - call: "POST /stops/${stop_id}/performances"
              payload: { perf_date: "2026-09-08", curtain_time: "19:30", duration_minutes: 150 }
              as: TourManager
              captures: { perf_id: "$.data.id "}
            - call: "PUT /performances/${perf_id}"
              payload: { status: PLAYED, gross_cents: 750000 }
              as: Treasurer
            - call: "GET /stops/${stop_id}/settlement"
              as: Producer
              captures: { s_id: "$.data[0].id" }
            - call: "PUT /settlements/${s_id}"
              payload: { audited_gross_cents: 6000000, taxes_cents: 300000, levies_cents: 200000 }
              as: Treasurer
            - call: "PUT /settlements/${s_id}"
              payload: { status: SUBMITTED }
              as: Treasurer
              as_user_id: trs-1
            - call: "PUT /settlements/${s_id}"
              payload: { status: DISPUTED, dispute_reason: "levies misclassified" }
              as: Producer
              as_user_id: prod-1
              captures: { st_disputed: "$.data.status "}
          trigger:
            - call: "PUT /settlements/${s_id}"
              payload: { status: SUBMITTED }
              as: Treasurer
              as_user_id: trs-2
              captures: { st_resub: "$.data.status", submitter: "$.data.submitted_by "}
            - call: "PUT /settlements/${s_id}"
              payload: { status: APPROVED }
              as: Producer
              as_user_id: prod-1
              captures: { royalty: "$.data.royalty_cents "}
            - call: "GET /tours/${tour_id}"
              as: Producer
              captures: { accrued: "$.data.royalty_accrued_cents "}
          assert:
            - "Settlement.${s_id}.status == DISPUTED after dispute, then SUBMITTED after resubmission (cycle traversed)"
            - "Settlement.${s_id}.submitted_by == trs-2 after resubmission (re-armed)"
            - "Settlement.${s_id}.royalty_cents == 105000 after final approve"
            - "Tour.${tour_id}.royalty_accrued_cents == 105000 (accrued exactly once across the cycle)"

      - name: stop_parallel_dimensions
        grounds:
          - state_machines.Stop.booking_status
          - state_machines.Stop.compliance_status
        distinguishing_aspect: |
          Parallel state dimensions on ONE entity (distinct from Settlement's cycle and
          InjuryEvent's fork): booking_status and compliance_status evolve independently —
          a late FAIL flips compliance to NON_COMPLIANT and drags booking READY->ADVANCED
          while no direct booking transition was requested.
        test_recipe:
          setup:
            - "Stop ADVANCED with two checks; one PASS recorded, one still PENDING"
          setup_api_calls:
            - call: "POST /tours"
              payload: { name: "Tour A", budget_total_cents: 50000000, capitalization_cents: 10000000, per_diem_policy: FULL_WEEK, per_diem_daily_cents: 20000, royalty_tier_threshold_cents: 1000000 }
              as: Producer
              captures: { tour_id: "$.data.id", tour_v: "$.data.version "}
            - call: "POST /venues"
              payload: { name: "Venue V", city: "Chicago", stage_width_ft: 44, fly_capacity_lines: 30, power_amps: 400, crew_available: 20 }
              as: Producer
              captures: { venue_id: "$.data.id "}
            - call: "POST /tours/${tour_id}/stops"
              payload: { venue_id: "${venue_id}", play_week_start: "2026-09-07", play_week_end: "2026-09-13", load_in_date: "2026-09-05", travel_in_days: 1, guarantee_cents: 4000000, split_pct: 70, expected_tour_version: "${tour_v}" }
              as: TourManager
              captures: { stop_id: "$.data.id "}
            - call: "PUT /stops/${stop_id}"
              payload: { status: CONTRACTED }
              as: Producer
            - call: "PUT /stops/${stop_id}"
              payload: { status: ADVANCED }
              as: TourManager
            - call: "POST /stops/${stop_id}/tech-checks"
              payload: { item: STAGE_WIDTH_FT, required_value: 40 }
              as: TourManager
              captures: { chk_a: "$.data.id "}
            - call: "POST /stops/${stop_id}/tech-checks"
              payload: { item: FLY_LINES, required_value: 30 }
              as: TourManager
              captures: { chk_b: "$.data.id "}
            - call: "PUT /tech-checks/${chk_a}"
              payload: { actual_value: 42 }
              as: TourManager
          trigger:
            - call: "PUT /stops/${stop_id}"
              payload: { status: READY }
              as: TourManager
              captures: { err1: "$.data.error_id "}
            - call: "PUT /tech-checks/${chk_b}"
              payload: { actual_value: 30 }
              as: TourManager
            - call: "PUT /stops/${stop_id}"
              payload: { status: READY }
              as: TourManager
              captures: { bk1: "$.data.booking_status", cp1: "$.data.compliance_status "}
            - call: "PUT /tech-checks/${chk_a}"
              payload: { actual_value: 38 }
              as: TourManager
            - call: "GET /stops/${stop_id}"
              as: Producer
              captures: { bk2: "$.data.booking_status", cp2: "$.data.compliance_status "}
          assert:
            - "First READY attempt fails with ERR_STOP_NOT_COMPLIANT (compliance IN_PROGRESS gates booking)"
            - "After both PASS: booking_status == READY and compliance_status == COMPLIANT"
            - "After chk_a flips to FAIL: booking_status == ADVANCED and compliance_status == NON_COMPLIANT (dimension drag)"

      - name: injury_branching_fork
        grounds:
          - state_machines.InjuryEvent
          - calculations.calc_coverage_selection
        distinguishing_aspect: |
          Branching fork (distinct from Settlement cycle and Stop parallel dims): REPORTED
          fans into COVERED vs REPLACED with divergent side-effect sets — COVERED activates
          a coverage and leaves the member ON_LEAVE; REPLACED activates nothing and moves
          the member straight to terminal REPLACED.
        test_recipe:
          setup:
            - "Tour with two CONTRACTED principals P1 (track T1 with STANDBY understudy U1) and P2 (track T2 required_covers=1, no coverage); injuries reported on both"
          setup_api_calls:
            - call: "POST /tours"
              payload: { name: "Tour A", budget_total_cents: 50000000, capitalization_cents: 10000000, per_diem_policy: FULL_WEEK, per_diem_daily_cents: 20000, royalty_tier_threshold_cents: 1000000 }
              as: Producer
              captures: { tour_id: "$.data.id "}
            - call: "POST /tours/${tour_id}/cast"
              payload: { name: "P1", contract_type: PRINCIPAL, weekly_salary_cents: 800000 }
              as: CompanyManager
              captures: { p1: "$.data.id "}
            - call: "POST /tours/${tour_id}/cast"
              payload: { name: "P2", contract_type: PRINCIPAL, weekly_salary_cents: 700000 }
              as: CompanyManager
              captures: { p2: "$.data.id "}
            - call: "POST /tours/${tour_id}/cast"
              payload: { name: "U1", contract_type: UNDERSTUDY, weekly_salary_cents: 500000 }
              as: CompanyManager
              captures: { u1: "$.data.id "}
            - call: "PUT /cast/${p1}"
              payload: { status: CONTRACTED }
              as: CompanyManager
            - call: "PUT /cast/${p2}"
              payload: { status: CONTRACTED }
              as: CompanyManager
            - call: "PUT /cast/${u1}"
              payload: { status: CONTRACTED }
              as: CompanyManager
            - call: "POST /tours/${tour_id}/tracks"
              payload: { track_name: "Lead", required_covers: 1, principal_member_id: "${p1}" }
              as: CompanyManager
              captures: { t1: "$.data.id "}
            - call: "POST /tours/${tour_id}/tracks"
              payload: { track_name: "Villain", required_covers: 1, principal_member_id: "${p2}" }
              as: CompanyManager
              captures: { t2: "$.data.id "}
            - call: "POST /tracks/${t1}/coverages"
              payload: { cast_member_id: "${u1}", kind: UNDERSTUDY, priority_rank: 1 }
              as: CompanyManager
              captures: { cov1: "$.data.id "}
          trigger:
            - call: "POST /cast/${p1}/injuries"
              payload: { notes: "ankle" }
              as: CompanyManager
              captures: { inj1: "$.data.id", inj1_status: "$.data.status", inj1_cov: "$.data.covered_by_coverage_id "}
            - call: "POST /cast/${p2}/injuries"
              payload: { notes: "voice" }
              as: CompanyManager
              captures: { inj2: "$.data.id", inj2_status: "$.data.status", inj2_cov: "$.data.covered_by_coverage_id "}
            - call: "GET /cast/${p1}"
              as: CompanyManager
              captures: { p1_status: "$.data.status "}
            - call: "GET /cast/${p2}"
              as: CompanyManager
              captures: { p2_status: "$.data.status "}
            - call: "GET /tracks/${t1}"
              as: CompanyManager
              captures: { t1_avail: "$.data.available_covers", t1_exp: "$.data.exposed "}
          assert:
            - "InjuryEvent.${inj1}.status == COVERED and covered_by_coverage_id == ${cov1}"
            - "InjuryEvent.${inj2}.status == REPLACED and covered_by_coverage_id == null (empty pool fallback)"
            - "CastMember.${p1}.status == ON_LEAVE while CastMember.${p2}.status == REPLACED (divergent branches)"
            - "CharacterTrack.${t1}.available_covers == 0 and exposed == true (activated cover is not available)"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: injury_coverage_exposure_cascade
        grounds:
          - state_machines.InjuryEvent
          - state_machines.CastMember.CONTRACTED_to_ON_LEAVE
          - state_machines.CoverageAssignment.STANDBY_to_ACTIVATED
          - state_machines.CoverageAssignment.STANDBY_to_SUSPENDED
          - entities.CharacterTrack.fields.exposed
        distinguishing_aspect: |
          Depth-4 chain from the injury trigger (distinct from the tech-fail trigger):
          injury -> CastMember ON_LEAVE (link 1) -> selected coverage ACTIVATED while the
          member's own cover on a sibling track SUSPENDS (links 2/2b) -> BOTH tracks
          recompute available_covers and flip exposed (link 3). Each link is caused by the
          previous mutation, not by the original POST.
        test_recipe:
          setup:
            - "Tour with CONTRACTED principals P1 (track T1, required_covers 1) and P2 (track T2, required_covers 1); U1 UNDERSTUDY rank 1 STANDBY on T1; P1 also STANDBY-covers T2 as UNDERSTUDY rank 1"
          setup_api_calls:
            - call: "POST /tours"
              payload: { name: "Tour A", budget_total_cents: 50000000, capitalization_cents: 10000000, per_diem_policy: FULL_WEEK, per_diem_daily_cents: 20000, royalty_tier_threshold_cents: 1000000 }
              as: Producer
              captures: { tour_id: "$.data.id "}
            - call: "POST /tours/${tour_id}/cast"
              payload: { name: "P1", contract_type: PRINCIPAL, weekly_salary_cents: 800000 }
              as: CompanyManager
              captures: { p1: "$.data.id "}
            - call: "POST /tours/${tour_id}/cast"
              payload: { name: "P2", contract_type: PRINCIPAL, weekly_salary_cents: 700000 }
