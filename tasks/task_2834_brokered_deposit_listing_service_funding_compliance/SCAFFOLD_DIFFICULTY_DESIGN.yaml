          A different entity from the placement instance: BrokerAgreement combines a
          bounded revision cycle (UNDER_DILIGENCE -> RFI_ISSUED -> UNDER_DILIGENCE, capped
          at rfi_round_count 2) with a fork on one trigger — APPROVE lands in CONDITIONAL
          at diligence_score 68 and in APPROVED at 74, driving different
