          assert:
            - "The first trigger call returns 412 with data.error_id == ERR_STALE_VENUE_VERSION: verifying RESEED bumped the version past ${venue_v_stale}"
            - "That refusal leaves the ledger untouched — bond_released_cents is still 0 and bond_held_cents is still 1000000"
            - "The third trigger call returns 200 with bond_released_cents == 1000000, bond_held_cents == 0 and bond_forfeited_cents == 0, and site_posture is still OPEN because only a FINAL settlement closes the parcel out"
            - "The fourth trigger call returns 412 with data.error_id == ERR_STALE_VENUE_VERSION, so an accepted token cannot be replayed"
            - "The two task shares 540541 and 459459 sum to exactly 1000000, and the accepted settlement booked each share once"

      - name: the_four_level_cascade_runs_end_to_end_on_one_write
        claim_type: cascading_side_effects
        excluded_because:
          difficulty_instance: vacating_the_only_marshal_cascades_staff_to_obstacle_to_course_to_wave
          rationale: "§1.8 verifies the whole staff -> obstacle -> course -> wave chain from one vacate, including the 45-minute holdback window that decides which heats are held."

      - name: the_expiry_cascade_reaches_every_dependent_row
        claim_type: cascading_side_effects
        excluded_because:
          difficulty_instance: permit_expiry_at_the_clock_freezes_venue_courses_waves_and_festival_services
          rationale: "§1.8 drives the permit -> venue -> course -> wave -> festival-service fan-out from a single clock advance and asserts each level."

      - name: the_capacity_thresholds_bite_exactly_at_their_boundary
        claim_type: rate_threshold_triggers
        excluded_because:
          difficulty_instance: three_overlapping_heats_share_the_corral_budget_and_the_window_rolls_forward
          rationale: "§1.8 tests the corral-rate threshold at the boundary, in the over-limit case and after the window rolls forward, which is the rate-threshold claim for this API."

      - name: the_two_readings_are_computed_and_reconciled_independently
        claim_type: dual_variant_calculation
        excluded_because:
          difficulty_instance: entry_elapsed_provisional_gun_reading_vs_official_chip_reading
          rationale: "§1.8 computes both elapsed variants on one entry, pins the delta and shows the official reading being restamped by an adjudication."

  - section: Consistency Model
    instances:
      - name: every_cascade_effect_is_visible_on_the_first_read_after_the_write
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - state_machines[StaffAssignment]
          - calculations.course_bottleneck_capacity
        distinguishing_aspect: "The declared model is immediate, so the derived fields two and three hops from the write are already correct on the very first read — no second read, retry or settling delay is permitted anywhere in the chain."
        test_recipe:
          setup:
            - "A venue with an APPROVED permit and a DRAFT course whose station 1 needs 2 marshals and has 2, while stations 2 and 3 need 1 each and have 1."
            - "Fully staffed the effective rates are 12.00, 7.50 and 12.00, so readiness_posture is OPEN and bottleneck_capacity_pph is floor(60 × 7.50) = 450."
          setup_api_calls:
            - call: "POST /ocr/venues"
              payload: { name: "Ridgeline Quarry", terrain_type: "QUARRY", water_access: "NONE", land_use_zone: "AG-2", protected_acreage_sqm: 2000, restoration_bond_cents: 1000000 }
              as: PermitOfficer
              captures: { venue_id: $.data.id }
            - call: "POST /ocr/venues/${venue_id}/permits"
              payload: { permit_number: "C-2924-52", water_use_allowed: false, max_disturbed_area_sqm: 5000, quiet_hours_start_hour_utc: 22, quiet_hours_end_hour_utc: 6, valid_until_utc: "2026-12-31T00:00:00Z", restoration_deadline_utc: "2026-10-01T00:00:00Z" }
              as: CourseDesigner
              captures: { permit_id: $.data.id }
            - call: "POST /ocr/permits/${permit_id}/submit"
              payload: {}
              as: CourseDesigner
              as_user_id: "designer-1"
            - call: "POST /ocr/permits/${permit_id}/decision"
              payload: { decision: "APPROVED", decision_note: "Approved as filed" }
              as: PermitOfficer
              as_user_id: "officer-1"
            - call: "POST /ocr/venues/${venue_id}/courses"
              payload: { name: "Quarry Gauntlet", total_distance_m: 10000, corral_release_rate_per_min: 12.00, corral_throughput_capacity: 200 }
              as: CourseDesigner
              captures: { course_id: $.data.id }
            - call: "POST /ocr/courses/${course_id}/obstacles"
              payload: { name: "Cargo Net", station_index: 1, difficulty_rating: 3, lane_count: 4, service_rate_per_min: 3.00, marshals_required: 2, footprint_sqm: 1200, water_contact: false, bypass_mode: "NONE", penalty_seconds: 0 }
              as: CourseDesigner
              captures: { o1_id: $.data.id }
            - call: "POST /ocr/courses/${course_id}/obstacles"
              payload: { name: "Mud Trench", station_index: 2, difficulty_rating: 5, lane_count: 3, service_rate_per_min: 2.50, marshals_required: 1, footprint_sqm: 1500, water_contact: false, bypass_mode: "MANDATORY", penalty_seconds: 120 }
              as: CourseDesigner
              captures: { o2_id: $.data.id }
            - call: "POST /ocr/courses/${course_id}/obstacles"
              payload: { name: "Wall Climb", station_index: 3, difficulty_rating: 7, lane_count: 3, service_rate_per_min: 3.00, marshals_required: 1, footprint_sqm: 1000, water_contact: false, bypass_mode: "TIMED_PENALTY", penalty_seconds: 90 }
              as: CourseDesigner
              captures: { o3_id: $.data.id }
            - call: "POST /ocr/courses/${course_id}/staff-assignments"
              payload: { staff_person_id: "STAFF-1", staff_role: "MARSHAL", certification_level: "BASIC", shift_start_utc: "2026-09-12T06:00:00Z", shift_end_utc: "2026-09-12T14:00:00Z", obstacle_id: "${o1_id}" }
              as: SafetyOfficer
              captures: { sa1_id: $.data.id }
            - call: "POST /ocr/courses/${course_id}/staff-assignments"
              payload: { staff_person_id: "STAFF-2", staff_role: "MARSHAL", certification_level: "BASIC", shift_start_utc: "2026-09-12T06:00:00Z", shift_end_utc: "2026-09-12T14:00:00Z", obstacle_id: "${o1_id}" }
              as: SafetyOfficer
              captures: { sa2_id: $.data.id }
            - call: "POST /ocr/courses/${course_id}/staff-assignments"
              payload: { staff_person_id: "STAFF-3", staff_role: "MARSHAL", certification_level: "BASIC", shift_start_utc: "2026-09-12T06:00:00Z", shift_end_utc: "2026-09-12T14:00:00Z", obstacle_id: "${o2_id}" }
              as: SafetyOfficer
              captures: { sa3_id: $.data.id }
            - call: "POST /ocr/courses/${course_id}/staff-assignments"
              payload: { staff_person_id: "STAFF-4", staff_role: "MARSHAL", certification_level: "BASIC", shift_start_utc: "2026-09-12T06:00:00Z", shift_end_utc: "2026-09-12T14:00:00Z", obstacle_id: "${o3_id}" }
              as: SafetyOfficer
              captures: { sa4_id: $.data.id }
          trigger:
            - call: "POST /ocr/staff-assignments/${sa2_id}/vacate"
              payload: { reason: "Reassigned to the festival gate" }
              as: SafetyOfficer
            - call: "GET /ocr/obstacles/${o1_id}"
              payload: {}
              as: SafetyOfficer
            - call: "GET /ocr/courses/${course_id}"
              payload: {}
              as: CourseDesigner
            - call: "GET /ocr/staff-assignments"
              payload: { obstacle_id: "${o1_id}", status: "CONFIRMED", limit: 10, offset: 0 }
              as: SafetyOfficer
          assert:
            - "The vacate response itself already reports StaffAssignment.${sa2_id}.status == VACATED with vacated_at_utc stamped"
            - "The very first obstacle read shows confirmed_marshal_count == 1, staffing_state == PARTIAL and effective_clearance_rate_per_min == 7.20 — no second read is needed"
            - "The very first course read shows bottleneck_capacity_pph == 432 and readiness_posture == OPEN, both recomputed from the same write"
            - "The filtered staff-assignment list already excludes ${sa2_id} and returns total_count 1 for station 1"
            - "No assertion in this recipe requires a retry, sleep or re-read: the declared consistency model is immediate"
