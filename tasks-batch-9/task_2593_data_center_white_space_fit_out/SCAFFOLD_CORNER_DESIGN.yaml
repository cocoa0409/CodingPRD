              payload: { decision: "APPROVE", comment: "Change board sign-off." }
              as: ChangeManager
              as_user_id: "u-cm-1"
              captures: { h_status_1: $.data.status, h_count_1: $.data.approval_count }
            - call: "POST /mops/${mop_h_id}/approvals"
