            - "the seven project reads return byte identical data objects, including screening_score 79.00 and dev_status SCREENED"
            - "the business case read answers 200 for RegulatoryApprover even though that role may only decide labels"
            - "the forecast line list answers 200 for SalesAccountManager with total_count == 1"
            - "GET /innovation-projects/${rs_p_id}/launch-readiness answers 200 with launch_readiness_pct 0.00, since no LAUNCH_READY gate is configured"
            - "InnovationProject.${rs_p_id}.version is unchanged at ${rs_p_v2} after all ten reads"

      - name: rbac_segregation_of_duties_keys_on_user_identity_not_role
        claim_type: guard_ladder
        grounds:
          - errors[ERR_SELF_APPROVAL_FORBIDDEN]
          - errors[ERR_OWNER_CANNOT_VOTE]
          - errors[ERR_CHAIR_CANNOT_VOTE_AND_CLOSE]
          - validations[priority 8]
        distinguishing_aspect: |
          The three segregation of duties refusals compare acting user ids, not roles, so a
          submitter wearing the reviewer role cannot approve their own item, the project owner
          wearing the reviewer role cannot vote, and a chair who cast a vote cannot then close the
          review while a different chair user can, at which point the quorum check finally answers.
        test_recipe:
          setup:
            - "Empty database, logical clock at 2026-08-03T00:00:00Z."
            - "A SNACK gate 2 requiring PILOT_SCALE_UP_REPORT with quorum_size 2, and a screened project owned by owner-sod."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T00:00:00Z" }
              as: PortfolioAdmin
            - call: "POST /stage-gates"
              payload: { gate_number: 2, category: "SNACK", stage_from: "SCREENED", stage_to: "PILOT_QUALIFIED", required_deliverable_types: ["PILOT_SCALE_UP_REPORT"], quorum_size: 2, veto_functions: [], npv_hurdle_usd: 0.00, payback_months_max: 24, gross_margin_floor_pct: 0.00, readiness_floor_index: 0.00 }
              as: PortfolioAdmin
              captures: { sd_g2_id: $.data.id }
            - call: "POST /innovation-projects"
              payload: { name: "Duty Split Bars", brand: "GrainWell", category: "SNACK", project_type: "LINE_EXTENSION", strategic_fit_score: 8, consumer_need_score: 7, target_gross_margin_pct: 36, category_attractiveness_score: 7, development_budget_cap_usd: 300000.00 }
              as: InnovationLead
              as_user_id: "owner-sod"
              captures: { sd_p_id: $.data.id }
            - call: "POST /innovation-projects/${sd_p_id}/screen"
              payload: { screening_notes: "Into stage 2." }
              as: GateChair
              as_user_id: "chair-sod"
            - call: "GET /deliverables?project_id=${sd_p_id}&gate_id=${sd_g2_id}"
              as: GateChair
              captures: { sd_d0_id: "$.data[0].id" }
            - call: "POST /deliverables/${sd_d0_id}/submit"
              payload: { evidence_url: "https://npd.example/sod/pilot" }
              as: RnDLead
              as_user_id: "sub-sod"
            - call: "POST /innovation-projects/${sd_p_id}/gate-reviews"
              payload: { gate_id: "${sd_g2_id}", scheduled_at: "2026-08-10T09:00:00Z" }
              as: GateChair
              as_user_id: "chair-sod"
              captures: { sd_gr_id: $.data.id }
            - call: "POST /gate-reviews/${sd_gr_id}/open"
              as: GateChair
              as_user_id: "chair-sod"
          trigger:
            - call: "POST /deliverables/${sd_d0_id}/decide"
              payload: { decision: "APPROVE", comment: "Signing off on my own pack." }
              as: FunctionalReviewer
              as_user_id: "sub-sod"
            - call: "POST /deliverables/${sd_d0_id}/decide"
              payload: { decision: "APPROVE", comment: "Independent review." }
              as: FunctionalReviewer
              as_user_id: "rev-sod"
            - call: "POST /gate-reviews/${sd_gr_id}/votes"
              payload: { function: "MARKETING", vote: "APPROVE", rationale: "My own project." }
              as: FunctionalReviewer
              as_user_id: "owner-sod"
            - call: "POST /gate-reviews/${sd_gr_id}/votes"
              payload: { function: "OPERATIONS", vote: "APPROVE", rationale: "Capacity confirmed." }
              as: FunctionalReviewer
              as_user_id: "chair-sod"
            - call: "POST /gate-reviews/${sd_gr_id}/close"
              as: GateChair
              as_user_id: "chair-sod"
            - call: "POST /gate-reviews/${sd_gr_id}/close"
              as: GateChair
              as_user_id: "chair2-sod"
          assert:
            - "the submitter's own decide answers 403 ERR_SELF_APPROVAL_FORBIDDEN and Deliverable.${sd_d0_id}.status is still SUBMITTED"
            - "the independent decide answers 200 with status APPROVED, so the role was never the problem"
            - "the owner's vote answers 403 ERR_OWNER_CANNOT_VOTE and GET /gate-reviews/${sd_gr_id}/votes returns total_count == 0 at that point"
            - "the chair user's vote answers 201, since casting a vote is not itself forbidden"
            - "the close by chair-sod answers 403 ERR_CHAIR_CANNOT_VOTE_AND_CLOSE while GateReview.${sd_gr_id}.status is still IN_SESSION"
            - "the close by chair2-sod answers 422 ERR_QUORUM_NOT_MET, since only one of the required two votes exists, which shows priority 8 ran ahead of priority 12"
            - "InnovationProject.${sd_p_id}.dev_status is still SCREENED and next_gate_number is still 2"

      - name: rbac_role_refusal_precedes_path_existence_returns_403
        claim_type: guard_precedence
        grounds:
          - errors[ERR_UNAUTHORIZED]
          - errors[ERR_PROJECT_NOT_FOUND]
          - validations[priority 2]
        distinguishing_aspect: |
          Authorisation is decided from the endpoint alone, so an unknown project id addressed by a
          role that may not call the endpoint answers 403 and leaks no existence information, while
          the same unknown id addressed by the authorised role answers 404.
        test_recipe:
          setup:
            - "Empty database, logical clock at 2026-08-03T00:00:00Z, no projects at all."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T00:00:00Z" }
              as: PortfolioAdmin
          trigger:
            - call: "POST /innovation-projects/00000000-0000-0000-0000-0000000000ff/screen"
              payload: { screening_notes: "Wrong role, unknown id." }
              as: InnovationLead
            - call: "POST /innovation-projects/00000000-0000-0000-0000-0000000000ff/screen"
              payload: { screening_notes: "Right role, unknown id." }
              as: GateChair
              as_user_id: "chair-rp"
            - call: "POST /innovation-projects/00000000-0000-0000-0000-0000000000ff/post-launch-periods"
              payload: { period_index: 1, actual_units: 10, actual_net_revenue_usd: 10.00, actual_gross_margin_usd: 1.00, attainment_basis: "CUMULATIVE" }
              as: SalesAccountManager
            - call: "POST /innovation-projects/00000000-0000-0000-0000-0000000000ff/post-launch-periods"
              payload: { period_index: 1, actual_units: 10, actual_net_revenue_usd: 10.00, actual_gross_margin_usd: 1.00, attainment_basis: "CUMULATIVE" }
              as: PortfolioAdmin
          assert:
            - "the wrong role screen answers 403 ERR_UNAUTHORIZED"
            - "the authorised screen on the same unknown id answers 404 ERR_PROJECT_NOT_FOUND"
            - "the wrong role period write answers 403 ERR_UNAUTHORIZED"
            - "the authorised period write on the same unknown id answers 404 ERR_PROJECT_NOT_FOUND"
            - "GET /innovation-projects returns total_count == 0 throughout"

  - section: cross-cutting complexity layers
    instances:
      - name: xc_pagination_defaults_and_bounds_on_a_twelve_row_child_list
        claim_type: pagination_contract
        grounds:
          - endpoints[GET /innovation-projects/{id}/concept-tests]
          - entities[ConceptTest]
        distinguishing_aspect: |
          The list honours limit 10 by default with has_more true and a total_count that counts every
          row rather than the page, walks to a short final page, accepts the maximum limit of 100 and
          returns an empty page past the end, and holds its declared fielded_at descending with
          created_at ascending order stable across every page, while total_count and the
          is_authoritative flag stay unaffected by which window is requested.
        test_recipe:
          setup:
            - "Empty database, logical clock at 2026-08-03T00:00:00Z."
            - "One IDEA project with twelve concept tests created in descending fielded_at order, so the first row created is the authoritative one."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T00:00:00Z" }
              as: PortfolioAdmin
            - call: "POST /innovation-projects"
              payload: { name: "Paged Concepts", brand: "GrainWell", category: "SNACK", project_type: "LINE_EXTENSION", strategic_fit_score: 8, consumer_need_score: 7, target_gross_margin_pct: 36, category_attractiveness_score: 7, development_budget_cap_usd: 300000.00 }
              as: InnovationLead
              as_user_id: "lead-pg"
              captures: { pg_p_id: $.data.id }
