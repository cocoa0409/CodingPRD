            - { call: "POST /api/adjustments/${a2}/decision", payload: { decision: APPROVE, expected_plan_version: "${pv2}" }, as: RemediationApprover, as_user_id: "user-approver-1" }
            - { call: "GET /api/remediation-plans/${plan_c}", payload: {}, as: RemediationApprover, captures: { pv3: "$.data.version" } }
            - { call: "POST /api/adjustments/${a3}/decision", payload: { decision: APPROVE, expected_plan_version: "${pv3}" }, as: RemediationApprover, as_user_id: "user-approver-1" }
            - { call: "GET /api/remediation-plans/${plan_c}", payload: {}, as: RemediationApprover, captures: { plan_status_pre: "$.data.status" } }
          trigger:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "GET /api/adjustments/${a1}", payload: {}, as: CompAnalyst, captures: { a1_status: "$.data.status" } }
            - { call: "GET /api/adjustments/${a2}", payload: {}, as: CompAnalyst, captures: { a2_status: "$.data.status" } }
            - { call: "GET /api/adjustments/${a3}", payload: {}, as: CompAnalyst, captures: { a3_status: "$.data.status" } }
            - { call: "GET /api/gap-findings/${fc}", payload: {}, as: CompAnalyst, captures: { f_status: "$.data.status" } }
            - { call: "GET /api/remediation-plans/${plan_c}", payload: {}, as: CompAnalyst, captures: { plan_status: "$.data.status" } }
            - { call: "GET /api/pay-equity-studies/${sc}", payload: {}, as: CompAnalyst, captures: { study_status: "$.data.status" } }
          assert:
            - "plan_status_pre == FULLY_COMMITTED (committed 2700000 == total 2700000 after the third approval)"
            - "a1_status == EFFECTIVE and a2_status == EFFECTIVE and a3_status == EFFECTIVE (link 1: clock sweep at effective_date, inclusive)"
            - "GapFinding.${fc}.status == RESOLVED (link 2: no PROPOSED/APPROVED adjustments remain and >= 1 is EFFECTIVE)"
            - "RemediationPlan.${plan_c}.status == COMPLETED (all adjustments terminal, >= 1 EFFECTIVE)"
            - "PayEquityStudy.${sc}.status == MONITORING (link 3: zero unresolved findings + plan COMPLETED triggers the auto-transition)"

      - name: finalize_generation_cascade
        grounds:
          - state_machines.ModelRun.PROVISIONAL_to_FINAL
          - state_machines.ComparatorGroup.LOCKED_to_ANALYZED
          - entities.GapFinding.fields.model_run_id
        distinguishing_aspect: |
          Depth-2 cascade from POST /api/model-runs/{id}/finalize (a different
          trigger than the clock sweep): the run becoming FINAL generates one
          FLAGGED GapFinding per protected-class dimension present in the group
          (link 1), and the completion of finding generation flips the group
          LOCKED -> ANALYZED (link 2).
        test_recipe:
          setup:
            - "Study D (period 2025-01-01..2025-12-31, protected_classes [GENDER, AGE_BAND], min_group_size 4) MODELING; group GD (ENG, CA, level 5) LOCKED with 4 members: MALE/UNDER_40 10000000, MALE/FORTY_PLUS 11000000, FEMALE/UNDER_40 9000000, FEMALE/FORTY_PLUS 9500000; a COHORT_MEDIAN run is PROVISIONAL"
          setup_api_calls:
            - { call: "POST /api/pay-equity-studies", payload: { name: "StudyD", analysis_period_start: "2025-01-01", analysis_period_end: "2025-12-31", protected_classes: ["GENDER", "AGE_BAND"], min_group_size: 4 }, as: CompAnalyst, captures: { sd: "$.data.id" } }
            - { call: "POST /api/employee-snapshots", payload: { study_id: "${sd}", employee_ref: "DM1", gender_class: MALE, ethnicity_class: WHITE, age_band: UNDER_40, job_family: ENG, job_level: 5, location_code: CA, fte_factor: 1.0, base_salary_cents: 10000000, bonus_cents: 0, hire_date: "2020-01-01" }, as: PeopleOpsAdmin, captures: { d_m1: "$.data.id" } }
            - { call: "POST /api/employee-snapshots", payload: { study_id: "${sd}", employee_ref: "DM2", gender_class: MALE, ethnicity_class: WHITE, age_band: FORTY_PLUS, job_family: ENG, job_level: 5, location_code: CA, fte_factor: 1.0, base_salary_cents: 11000000, bonus_cents: 0, hire_date: "2015-01-01" }, as: PeopleOpsAdmin, captures: { d_m2: "$.data.id" } }
            - { call: "POST /api/employee-snapshots", payload: { study_id: "${sd}", employee_ref: "DF1", gender_class: FEMALE, ethnicity_class: WHITE, age_band: UNDER_40, job_family: ENG, job_level: 5, location_code: CA, fte_factor: 1.0, base_salary_cents: 9000000, bonus_cents: 0, hire_date: "2020-01-01" }, as: PeopleOpsAdmin, captures: { d_f1: "$.data.id" } }
            - { call: "POST /api/employee-snapshots", payload: { study_id: "${sd}", employee_ref: "DF2", gender_class: FEMALE, ethnicity_class: WHITE, age_band: FORTY_PLUS, job_family: ENG, job_level: 5, location_code: CA, fte_factor: 1.0, base_salary_cents: 9500000, bonus_cents: 0, hire_date: "2015-01-01" }, as: PeopleOpsAdmin, captures: { d_f2: "$.data.id" } }
            - { call: "POST /api/comparator-groups", payload: { study_id: "${sd}", name: "GD", job_family: ENG, min_job_level: 5, max_job_level: 5, location_code: CA }, as: CompAnalyst, captures: { gd: "$.data.id" } }
            - { call: "PATCH /api/employee-snapshots/${d_m1}", payload: { comparator_group_id: "${gd}" }, as: PeopleOpsAdmin }
            - { call: "PATCH /api/employee-snapshots/${d_m2}", payload: { comparator_group_id: "${gd}" }, as: PeopleOpsAdmin }
            - { call: "PATCH /api/employee-snapshots/${d_f1}", payload: { comparator_group_id: "${gd}" }, as: PeopleOpsAdmin }
            - { call: "PATCH /api/employee-snapshots/${d_f2}", payload: { comparator_group_id: "${gd}" }, as: PeopleOpsAdmin }
            - { call: "POST /api/pay-equity-studies/${sd}/advance", payload: {}, as: CompAnalyst }
            - { call: "POST /api/comparator-groups/${gd}/lock", payload: {}, as: CompAnalyst, captures: { gvd: "$.data.version" } }
            - { call: "POST /api/model-runs", payload: { comparator_group_id: "${gd}", methodology: COHORT_MEDIAN, expected_group_version: "${gvd}" }, as: CompAnalyst, captures: { run_d: "$.data.id" } }
            - { call: "GET /api/comparator-groups/${gd}", payload: {}, as: CompAnalyst, captures: { g_status_pre: "$.data.status" } }
          trigger:
            - { call: "POST /api/model-runs/${run_d}/finalize", payload: {}, as: CompAnalyst, captures: { run_status: "$.data.status", fin_at: "$.data.finalized_at" } }
            - { call: "GET /api/gap-findings", payload: { model_run_id: "${run_d}" }, as: CompAnalyst, captures: { findings_list: "$.data" } }
            - { call: "GET /api/comparator-groups/${gd}", payload: {}, as: CompAnalyst, captures: { g_status_post: "$.data.status" } }
          assert:
            - "g_status_pre == LOCKED before finalize"
            - "run_status == FINAL and finalized_at == 2026-08-01T00:00:00Z (logical clock default)"
            - "exactly 2 GapFindings generated (GENDER:FEMALE and AGE_BAND:FORTY_PLUS), each with model_run_id == ${run_d} and status FLAGGED (link 1)"
            - "GENDER:FEMALE finding: adjusted_gap_pct == 11.9048, p_value == 0.0403, is_actionable == true"
            - "AGE_BAND:FORTY_PLUS finding: adjusted_gap_pct == -7.8947, p_value == 0.0596, is_actionable == false (adverse direction is against the reference, negative gap is not actionable)"
            - "g_status_post == ANALYZED (link 2: finding generation flipped the group)"

  # ---------------------------------------------------------------------------
  # Rule 5 — priority_pair_validation_conflict (different error-category pairs)
  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: adjustment_decision_state_beats_budget
        grounds:
          - validations[priority=4]
          - validations[priority=9]
          - errors[ERR_PLAN_NOT_APPROVED]
          - errors[ERR_BUDGET_EXCEEDED]
        distinguishing_aspect: |
          Pair {state, business_fiscal}: the decision violates BOTH plan state
          (plan DRAFT, not APPROVED/EXECUTING) AND budget (committed 0 +
          proposed 2000000 > total 1000000); priority 4 state beats priority 9
          fiscal, so the response is ERR_PLAN_NOT_APPROVED, never
          ERR_BUDGET_EXCEEDED.
        test_recipe:
          setup:
            - "Study E (period 2024-01-01..2024-12-31, [GENDER], min_group_size 6) REMEDIATION_OPEN; 6-member group MEDIAN-analyzed; finding TARGETED; plan budget 1000000 still DRAFT (never submitted); adjustment proposed 2000000 effective 2026-09-01 created by user-analyst-1"
          setup_api_calls:
            - { call: "POST /api/pay-equity-studies", payload: { name: "StudyE", analysis_period_start: "2024-01-01", analysis_period_end: "2024-12-31", protected_classes: ["GENDER"], min_group_size: 6 }, as: CompAnalyst, captures: { se: "$.data.id" } }
            - { call: "POST /api/employee-snapshots", payload: { study_id: "${se}", employee_ref: "EM1", gender_class: MALE, ethnicity_class: WHITE, age_band: UNDER_40, job_family: FIN, job_level: 5, location_code: NY, fte_factor: 1.0, base_salary_cents: 11000000, bonus_cents: 0, hire_date: "2020-01-01" }, as: PeopleOpsAdmin, captures: { e_m1: "$.data.id" } }
            - { call: "POST /api/employee-snapshots", payload: { study_id: "${se}", employee_ref: "EM2", gender_class: MALE, ethnicity_class: WHITE, age_band: UNDER_40, job_family: FIN, job_level: 5, location_code: NY, fte_factor: 1.0, base_salary_cents: 10000000, bonus_cents: 0, hire_date: "2020-01-01" }, as: PeopleOpsAdmin, captures: { e_m2: "$.data.id" } }
            - { call: "POST /api/employee-snapshots", payload: { study_id: "${se}", employee_ref: "EM3", gender_class: MALE, ethnicity_class: WHITE, age_band: UNDER_40, job_family: FIN, job_level: 5, location_code: NY, fte_factor: 1.0, base_salary_cents: 9000000, bonus_cents: 0, hire_date: "2020-01-01" }, as: PeopleOpsAdmin, captures: { e_m3: "$.data.id" } }
            - { call: "POST /api/employee-snapshots", payload: { study_id: "${se}", employee_ref: "EF1", gender_class: FEMALE, ethnicity_class: WHITE, age_band: UNDER_40, job_family: FIN, job_level: 5, location_code: NY, fte_factor: 1.0, base_salary_cents: 9500000, bonus_cents: 0, hire_date: "2020-01-01" }, as: PeopleOpsAdmin, captures: { e_f1: "$.data.id" } }
            - { call: "POST /api/employee-snapshots", payload: { study_id: "${se}", employee_ref: "EF2", gender_class: FEMALE, ethnicity_class: WHITE, age_band: UNDER_40, job_family: FIN, job_level: 5, location_code: NY, fte_factor: 1.0, base_salary_cents: 9000000, bonus_cents: 0, hire_date: "2020-01-01" }, as: PeopleOpsAdmin, captures: { e_f2: "$.data.id" } }
            - { call: "POST /api/employee-snapshots", payload: { study_id: "${se}", employee_ref: "EF3", gender_class: FEMALE, ethnicity_class: WHITE, age_band: UNDER_40, job_family: FIN, job_level: 5, location_code: NY, fte_factor: 1.0, base_salary_cents: 8500000, bonus_cents: 0, hire_date: "2020-01-01" }, as: PeopleOpsAdmin, captures: { e_f3: "$.data.id" } }
            - { call: "POST /api/comparator-groups", payload: { study_id: "${se}", name: "GE", job_family: FIN, min_job_level: 5, max_job_level: 5, location_code: NY }, as: CompAnalyst, captures: { ge: "$.data.id" } }
            - { call: "PATCH /api/employee-snapshots/${e_m1}", payload: { comparator_group_id: "${ge}" }, as: PeopleOpsAdmin }
            - { call: "PATCH /api/employee-snapshots/${e_m2}", payload: { comparator_group_id: "${ge}" }, as: PeopleOpsAdmin }
            - { call: "PATCH /api/employee-snapshots/${e_m3}", payload: { comparator_group_id: "${ge}" }, as: PeopleOpsAdmin }
            - { call: "PATCH /api/employee-snapshots/${e_f1}", payload: { comparator_group_id: "${ge}" }, as: PeopleOpsAdmin }
            - { call: "PATCH /api/employee-snapshots/${e_f2}", payload: { comparator_group_id: "${ge}" }, as: PeopleOpsAdmin }
            - { call: "PATCH /api/employee-snapshots/${e_f3}", payload: { comparator_group_id: "${ge}" }, as: PeopleOpsAdmin }
            - { call: "POST /api/pay-equity-studies/${se}/advance", payload: {}, as: CompAnalyst }
            - { call: "POST /api/comparator-groups/${ge}/lock", payload: {}, as: CompAnalyst, captures: { gve: "$.data.version" } }
            - { call: "POST /api/model-runs", payload: { comparator_group_id: "${ge}", methodology: COHORT_MEDIAN, expected_group_version: "${gve}" }, as: CompAnalyst, captures: { run_e: "$.data.id" } }
            - { call: "POST /api/model-runs/${run_e}/finalize", payload: {}, as: CompAnalyst }
            - { call: "POST /api/pay-equity-studies/${se}/submit-legal-review", payload: {}, as: CompAnalyst }
            - { call: "POST /api/pay-equity-studies/${se}/legal-decision", payload: { decision: APPROVE }, as: LegalCounsel }
            - { call: "POST /api/pay-equity-studies/${se}/open-remediation", payload: {}, as: LegalCounsel }
            - { call: "POST /api/remediation-plans", payload: { study_id: "${se}", total_budget_cents: 1000000 }, as: CompAnalyst, captures: { plan_e: "$.data.id" } }
            - { call: "GET /api/gap-findings", payload: { study_id: "${se}" }, as: CompAnalyst, captures: { fe: "$.data[0].id" } }
            - { call: "POST /api/gap-findings/${fe}/disposition", payload: { disposition: TARGETED }, as: CompAnalyst }
            - { call: "POST /api/adjustments", payload: { plan_id: "${plan_e}", gap_finding_id: "${fe}", employee_snapshot_id: "${e_f1}", proposed_increase_cents: 2000000, effective_date: "2026-09-01" }, as: CompAnalyst, as_user_id: "user-analyst-1", captures: { adj_e: "$.data.id" } }
            - { call: "GET /api/remediation-plans/${plan_e}", payload: {}, as: RemediationApprover, captures: { pv_e: "$.data.version" } }
          trigger:
            - { call: "POST /api/adjustments/${adj_e}/decision", payload: { decision: APPROVE, expected_plan_version: "${pv_e}" }, as: RemediationApprover, as_user_id: "user-approver-1", captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_PLAN_NOT_APPROVED (http 409), NOT ERR_BUDGET_EXCEEDED — the plan-state check (priority 4) precedes the fiscal check (priority 9) even though both would fail"
            - "Adjustment.${adj_e}.status remains PROPOSED"

      - name: model_run_create_occ_beats_state
        grounds:
          - validations[priority=3.5]
          - validations[priority=4]
          - concurrency_rules[model-run-create-stale-group]
          - errors[ERR_STALE_GROUP_VERSION]
          - errors[ERR_GROUP_INVALID_STATE]
        distinguishing_aspect: |
          Pair {concurrency, state}: the run creation violates BOTH OCC
          (expected_group_version 1 vs current 2 after a membership PATCH) AND
          state (group still DRAFT, never locked); priority 3.5 OCC beats
          priority 4 state — a different category pair than {state,
          business_fiscal} in adjustment_decision_state_beats_budget.
        test_recipe:
          setup:
            - "Study F (period 2025-01-01..2025-12-31, [GENDER], default min_group_size 30) DRAFT; group GF (ENG, CA, 5) DRAFT at version 1 at creation; one snapshot assigned afterwards bumps the group to version 2"
          setup_api_calls:
            - { call: "POST /api/pay-equity-studies", payload: { name: "StudyF", analysis_period_start: "2025-01-01", analysis_period_end: "2025-12-31", protected_classes: ["GENDER"] }, as: CompAnalyst, captures: { sf: "$.data.id" } }
            - { call: "POST /api/employee-snapshots", payload: { study_id: "${sf}", employee_ref: "FM1", gender_class: MALE, ethnicity_class: WHITE, age_band: UNDER_40, job_family: ENG, job_level: 5, location_code: CA, fte_factor: 1.0, base_salary_cents: 10000000, bonus_cents: 0, hire_date: "2020-01-01" }, as: PeopleOpsAdmin, captures: { f_m1: "$.data.id" } }
            - { call: "POST /api/comparator-groups", payload: { study_id: "${sf}", name: "GF", job_family: ENG, min_job_level: 5, max_job_level: 5, location_code: CA }, as: CompAnalyst, captures: { gf: "$.data.id", gv_stale: "$.data.version" } }
            - { call: "PATCH /api/employee-snapshots/${f_m1}", payload: { comparator_group_id: "${gf}" }, as: PeopleOpsAdmin }
          trigger:
            - { call: "POST /api/model-runs", payload: { comparator_group_id: "${gf}", methodology: COHORT_MEDIAN, expected_group_version: "${gv_stale}" }, as: CompAnalyst, captures: { err: "$.data.error_id" } }
          assert:
            - "err == ERR_STALE_GROUP_VERSION (http 412), NOT ERR_GROUP_INVALID_STATE — the OCC check (priority 3.5) precedes the group-state check (priority 4) even though the group is also DRAFT"
            - "No ModelRun is created for the group"

  # ---------------------------------------------------------------------------
  # Rule 6 — boundary_precision_check (different metrics, different endpoints)
  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: four_fifths_ratio_exactly_at_threshold_not_flagged
        grounds:
          - calculations.adverse_impact_ratio
          - entities.PipelineAnalysis.fields.adverse_impact_flag
        distinguishing_aspect: |
          Metric = adverse-impact ratio on POST /api/pipeline-analyses: the flag
          fires on a STRICT less-than against 0.80, so a ratio of exactly 0.8000
          is NOT flagged while 0.7875 is — tested at the exact boundary.
        test_recipe:
          setup:
            - "Study H exists (period 2025-01-01..2025-12-31)"
          setup_api_calls:
            - { call: "POST /api/pay-equity-studies", payload: { name: "StudyH", analysis_period_start: "2025-01-01", analysis_period_end: "2025-12-31", protected_classes: ["GENDER"] }, as: CompAnalyst, captures: { sh: "$.data.id" } }
          trigger:
            - { call: "POST /api/pipeline-analyses", payload: { study_id: "${sh}", stage: HIRE, cohort_period_start: "2026-01-01", cohort_period_end: "2026-03-31", records: [ { class_label: "MAJORITY", count_in: 100, count_passed: 80 }, { class_label: "MINORITY", count_in: 100, count_passed: 64 } ] }, as: CompAnalyst, captures: { pa_h: "$.data.id", ratio_h: "$.data.adverse_impact_ratio", flag_h: "$.data.adverse_impact_flag" } }
          assert:
            - "ratio_h == 0.8 (exactly 0.8000 at 4dp)"
            - "flag_h == false — the boundary value itself is compliant (strict < 0.80 required to flag)"
            - "PipelineAnalysis.${pa_h}.highest_rate_class == MAJORITY"

      - name: budget_commit_at_exact_total_allowed
        grounds:
          - calculations.plan_budget_reconciliation
          - state_machines.RemediationPlan.EXECUTING_to_FULLY_COMMITTED
          - errors[ERR_BUDGET_EXCEEDED]
        distinguishing_aspect: |
          Metric = committed cents on POST /api/adjustments/{id}/decision: the
          budget check is inclusive (committed + proposed <= total), so an
          approval landing exactly ON total_budget_cents succeeds and flips the
          plan FULLY_COMMITTED — a different metric and endpoint than the
          adverse-impact ratio boundary.
        test_recipe:
          setup:
            - "Study I (period 2024-01-01..2024-12-31, [GENDER], min_group_size 6) REMEDIATION_OPEN; 6-member group MEDIAN-analyzed; finding TARGETED; plan budget 2700000 APPROVED with two PROPOSED adjustments 1500000 and 1200000 (effective 2026-09-01)"
