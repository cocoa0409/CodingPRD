  # ---------------------------------------------------------------- Rule 6
  - rule_id: boundary_precision_check
    instances:
      - name: peak_rush_threshold_at_exactly_30_minutes
        grounds:
          - calculations.calc_changeover_time
          - entities.Show.fields.peak_rush_minutes
        distinguishing_aspect: |
          Numeric threshold boundary on peak_rush_minutes via
          POST /shows/{id}/schedule-rehearsal: peak_rush_indicator uses >= 30, so
          exactly 30 minutes ADDS the 20-minute rush surcharge (changeover = 80
          with no adjacent format transition) while 29 minutes does not
          (changeover = 60).
