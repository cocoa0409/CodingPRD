  # ---------------------------------------------------------------- Rule 7
  - rule_id: cross_entity_state_dependency
    instances:
      - name: allocation_selector_skips_pledged_receipt
        grounds:
          - calculations.allocation_selector
          - state_machines.StorageReceipt.OPEN_to_PLEDGED
          - entities.StorageReceipt.fields.status
        distinguishing_aspect: |
          Entity pair DeliveryCall x StorageReceipt: the FIFO allocation
          selector's eligibility filter excludes receipts in PLEDGED status,
          so allocation on the call lands on the SECOND-oldest receipt even
          though the pledged one is FIFO-earlier — the call's outcome depends
          on LoanPledge-driven receipt state. Paired instance crosses
          FarmerStockLoad x Grower, a different entity pair.
        test_recipe:
          setup:
            - "Foundation (schedule ACTIVE, WH-G 2000); grower G1 quota 100"
            - "Load A 25.0t STORED at 09:00 (receipt rcptA, FIFO-first); clock advanced; load B 25.0t STORED at 10:00 (receipt rcptB)"
            - "LoanPledge on rcptA for its full 25.0t => rcptA PLEDGED (principal 887500 = 25 x 35500)"
            - "Contract 20t ACTIVE (accepts_segregated false); call requested 20t ISSUED"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T09:00:00Z" }, as: BuyingPointAdmin }
            - call: "POST /buying-points"
              payload: { name: "Tifton BP", crop_year: 2026, drying_rate_per_cycle_cents: 9000, quota_price_cents_per_ton: 56000, additional_price_cents_per_ton: 40000, loan_rate_quota_cents_per_ton: 35500, loan_rate_additional_cents_per_ton: 30000 }
