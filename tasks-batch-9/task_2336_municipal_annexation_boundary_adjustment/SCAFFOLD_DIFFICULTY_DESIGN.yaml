      - name: de_annexation_reverses_the_municipal_tax_base_and_refunds_the_remainder
        grounds:
          - calculations.tax_roll_proration
          - calculations.de_annexation_refund
          - calculations.territory_qualification
          - entities.Municipality.fields.taxable_assessed_value_cents
          - state_machines.AnnexationCase.POSTED_to_REVERSED
          - state_machines.AnnexationCase.EFFECTIVE_to_DE_ANNEXED
          - state_machines.UtilityAccount.INSIDE_CITY_ACTIVE_to_OUTSIDE_CITY
        distinguishing_aspect: |
          Conserved quantity Municipality.taxable_assessed_value_cents: posting the tax roll adds
          exactly 14,629,200 cents and the successor DE_ANNEXATION case must remove exactly that
          amount, returning the municipal base to 0 while the predecessor's tax_roll_status goes
          POSTED -> REVERSED, its utility account returns to the 7,500-cent surcharge rate, and the
          unused remainder of the fiscal year is refunded as 1,711 cents (32,864 x 19 / 365) rather
          than the whole 32,864 that was posted.
        test_recipe:
          setup:
            - "One StatuteProfile with required_service_types [POLICE, WATER], fiscal_year_end_month_day 12-31, effective_date_rule IMMEDIATE, de_annexation_allowed true and de_annexation_refund_basis DAILY_PRORATION."
            - "One Municipality with general_fund_millage_rate 10.0, utility_outside_surcharge_pct 0.50 and taxable_assessed_value_cents 0."
            - "One ANNEXATION case with four parcels of 3,657,300 cents each and one WATER utility account (monthly_base_cents 5,000) driven to EFFECTIVE on 2026-10-11 and then POSTED, so tax_roll_transferred_tax_cents is 32,864 and the municipal base is 14,629,200."
            - "One DE_ANNEXATION case in the same municipality whose predecessor_case_id is that case; it owns no parcels of its own, so its territory aggregates read through the predecessor."
            - "The de-annexation leg runs on its own clock ladder: notice 2026-10-11T09:00:00Z, hearing held 2026-11-12T18:00:00Z, protest closed and ordinance adopted 2026-12-13T09:00:00Z."
