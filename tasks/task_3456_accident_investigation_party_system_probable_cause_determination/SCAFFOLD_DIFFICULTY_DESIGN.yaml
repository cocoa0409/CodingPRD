# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# task_3456 — NTSB accident-investigation party system & probable cause.
# 9 rules × 2 instances. Anchored base-chain calls are defined once (in the
# first heavy instance) and aliased thereafter; each instance is still replayed
# against a fresh database by the downstream unit-test-generator.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: dual_variant_launch_scores_diverge_on_hazmat_case
        grounds:
          - calculations.statutory_launch_score
          - calculations.risk_adjusted_launch_score
          - entities.AccidentCase.fields.statutory_score
          - entities.AccidentCase.fields.risk_adjusted_score
        distinguishing_aspect: "Dual-variant pair 1 operates on the AccidentCase domain: one formula set is the flat integer statutory sum, the other is the per-component-rounded weighted variant — identical severity inputs (HAZMAT, 2 fatalities, 3 injuries, 5000000 cents) yield statutory_score 58 vs risk_adjusted_score 73.8, and only the statutory variant gates adoption."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: BoardAdmin
          trigger:
            - call: "POST /accident-cases"
              payload: { report_number: "NTSB-2026-0101", category: "HAZMAT", occurred_at: "2026-08-30T04:12:00Z", location_state: "LA", fatalities_count: 2, injuries_count: 3, damage_estimate_cents: 5000000, is_public_transport: false }
              as: DutyOfficer
              captures: { hz_case_id: $.data.id }
          assert:
            - "AccidentCase.${hz_case_id}.statutory_score == 58  (40 + 15 + 3 + 0)"
            - "AccidentCase.${hz_case_id}.risk_adjusted_score == 73.8  (round1(40*1.0)=40.0 + round1(15*2.0)=30.0 + round1(3*1.25)=3.8 + round1(0*0.5)=0.0)"
            - "AccidentCase.${hz_case_id}.suggested_mode == LIMITED  (statutory 58 < 60 even though risk-adjusted 73.8 >= 60 — the risk variant never gates)"

      - name: dual_variant_recommendation_aging_calendar_vs_business
        grounds:
          - calculations.recommendation_aging
          - entities.SafetyRecommendation.fields.calendar_elapsed_days
          - entities.SafetyRecommendation.fields.business_elapsed_days
          - entities.SafetyRecommendation.fields.aging_bucket
        distinguishing_aspect: "Dual-variant pair 2 operates on the SafetyRecommendation domain (a different entity domain than launch scoring): the same issued_at and the same clock produce calendar_elapsed_days 84 but business_elapsed_days 60 at 2026-11-24, and the variants drive different fields (overdue vs aging_bucket)."
        test_recipe:
          setup:
            - "Investigation in ANALYSIS with docket OPEN; one OPERATOR organization designated; one recommendation issued to it at 2026-09-01T00:00:00Z."
          setup_api_calls:
            - &d_clock
              call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: BoardAdmin
            - &d_case
              call: "POST /accident-cases"
              payload: { report_number: "NTSB-2026-0001", category: "HIGHWAY", occurred_at: "2026-08-31T14:22:00Z", location_state: "VA", fatalities_count: 1, injuries_count: 0, damage_estimate_cents: 0, is_public_transport: true }
              as: DutyOfficer
              captures: { case_id: $.data.id, case_v: $.data.version }
            - &d_propose
              call: "POST /accident-cases/${case_id}/launch-decisions"
              payload: { mode: "FULL_GO_TEAM", expected_accident_case_version: "${case_v}" }
              as: ManagingDirector
              as_user_id: "md-1"
              captures: { decision_id: $.data.launch_decisions.0.decision_id }
            - &d_adopt
              call: "POST /accident-cases/${case_id}/launch-decisions/${decision_id}/adopt"
              payload: { iic_user_id: "iic-1" }
              as: ManagingDirector
              as_user_id: "md-2"
            - &d_fetch_inv
              call: "GET /investigations"
              payload: { accident_case_id: "${case_id}" }
              as: DutyOfficer
              captures: { inv_id: "$.data[0].id" }
            - &d_group
              call: "POST /groups"
              payload: { investigation_id: "${inv_id}", specialty: "OPERATIONS", chairman_user_id: "gc-1" }
              as: IIC
              as_user_id: "iic-1"
              captures: { grp_id: $.data.id }
            - &d_adv_onscene
              call: "POST /investigations/${inv_id}/advance-phase"
              payload: { to_phase: "ON_SCENE" }
              as: IIC
              as_user_id: "iic-1"
            - &d_org
              call: "POST /party-organizations"
              payload: { legal_name: "Blue Ridge Transit Authority", org_type: "OPERATOR" }
              as: PartyCoordinator
              captures: { org_id: $.data.id }
            - &d_designation
              call: "POST /party-designations"
              payload: { investigation_id: "${inv_id}", organization_id: "${org_id}" }
              as: PartyCoordinator
              captures: { dsg_id: $.data.id }
            - &d_seat
              call: "POST /party-designations/${dsg_id}/seats"
              payload: { group_id: "${grp_id}" }
              as: IIC
              as_user_id: "iic-1"
              captures: { seat_id: $.data.group_seats.0.seat_id }
            - &d_adv_factual
              call: "POST /investigations/${inv_id}/advance-phase"
              payload: { to_phase: "FACTUAL" }
              as: IIC
              as_user_id: "iic-1"
            - &d_report
              call: "POST /groups/${grp_id}/factual-reports"
              payload: { report_kind: "GROUP_FACTUAL", content: "Factual record: brake system teardown results." }
              as: GroupChairman
              as_user_id: "gc-1"
              captures: { rpt_id: $.data.factual_reports.0.report_id }
            - &d_verify
              call: "POST /groups/${grp_id}/factual-reports/${rpt_id}/verify"
              payload: {}
              as: IIC
              as_user_id: "iic-1"
            - &d_complete
              call: "POST /groups/${grp_id}/complete"
              payload: {}
              as: GroupChairman
              as_user_id: "gc-1"
            - &d_release
              call: "POST /investigations/${inv_id}/release-docket"
              payload: {}
              as: DocketOfficer
            - &d_adv_analysis
              call: "POST /investigations/${inv_id}/advance-phase"
              payload: { to_phase: "ANALYSIS" }
              as: IIC
              as_user_id: "iic-1"
            - &d_rec
              call: "POST /safety-recommendations"
              payload: { investigation_id: "${inv_id}", addressee_org_id: "${org_id}", recommendation_text: "Require quarterly brake-line inspection intervals." }
              as: IIC
              as_user_id: "iic-1"
              captures: { rec_id: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-23T00:00:00Z" }
              as: BoardAdmin
            - call: "GET /safety-recommendations/${rec_id}"
              payload: {}
              as: ManagingDirector
              as_user_id: "md-1"
              captures: { bucket_d83: $.data.aging_bucket }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-24T00:00:00Z" }
              as: BoardAdmin
            - call: "GET /safety-recommendations/${rec_id}"
              payload: {}
              as: ManagingDirector
              as_user_id: "md-1"
          assert:
            - "issued_at == 2026-09-01T00:00:00Z for SafetyRecommendation.${rec_id}"
            - "at 2026-11-23T00:00:00Z: calendar_elapsed_days == 83 and business_elapsed_days == 59 and aging_bucket == GREEN and overdue == false"
            - "at 2026-11-24T00:00:00Z: calendar_elapsed_days == 84 and business_elapsed_days == 60 and aging_bucket == AMBER and overdue == false"
            - "the two variants disagree on the day count for identical inputs (84 vs 60 at the same clock), and bucket selection follows the business-day variant (60 >= 60 -> AMBER), not the calendar variant"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: combinatorial_statutory_score_clamp_and_modal_bump
        grounds:
          - calculations.statutory_launch_score
          - state_machines.LaunchDecision.PROPOSED_to_ADOPTED
        distinguishing_aspect: "Mode (a): a >= 3-input formula with nested min(), tiered damage rates, conditional category bump, and a ceiling clamp — the AVIATION fixture composes all four (fatality 40+15, damage tier 25, injury min(15,10)=10, public 20+10) to 120, which clamps to 100, and the clamped value still satisfies the FULL_GO_TEAM adoption threshold."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - *d_clock
            - call: "POST /accident-cases"
              payload: { report_number: "NTSB-2026-0102", category: "AVIATION", occurred_at: "2026-08-29T19:40:00Z", location_state: "AK", fatalities_count: 5, injuries_count: 15, damage_estimate_cents: 10000000, is_public_transport: true }
              as: DutyOfficer
              captures: { av_case_id: $.data.id, av_case_v: $.data.version }
          trigger:
            - call: "POST /accident-cases/${av_case_id}/launch-decisions"
              payload: { mode: "FULL_GO_TEAM", expected_accident_case_version: "${av_case_v}" }
              as: ManagingDirector
              as_user_id: "md-1"
              captures: { av_decision_id: $.data.launch_decisions.0.decision_id }
            - call: "POST /accident-cases/${av_case_id}/launch-decisions/${av_decision_id}/adopt"
              payload: { iic_user_id: "iic-9" }
              as: ManagingDirector
              as_user_id: "md-2"
          assert:
            - "AccidentCase.${av_case_id}.statutory_score == 100  (55 + 25 + 10 + 30 = 120 clamped at SCORE_MAX 100)"
            - "AccidentCase.${av_case_id}.risk_adjusted_score == 100  (55.0 + 25.0 + 12.5 + 15.0 = 107.5 clamped)"
            - "AccidentCase.${av_case_id}.suggested_mode == FULL_GO_TEAM"
            - "the adopt response status is 200 and AccidentCase.${av_case_id}.status == LAUNCHED — the clamped 100 satisfies the >= 60 threshold"
            - "GET /investigations?accident_case_id=${av_case_id} returns exactly 1 row with phase GO_TEAM_ASSEMBLED"

      - name: combinatorial_risk_adjusted_per_component_rounding_order
        grounds:
          - calculations.risk_adjusted_launch_score
          - entities.AccidentCase.fields.risk_adjusted_score
        distinguishing_aspect: "Mode (b) nested rounding where order matters: the MARINE fixture has two half-cent components (damage 15*1.25 = 18.75 and injury 3*1.25 = 3.75); the pinned order rounds each component to 1 decimal BEFORE summation giving 62.6, whereas sum-then-round would give 62.5 — a different result from mode (a)'s tiered composition in the sibling instance."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Empty database."
          setup_api_calls:
            - *d_clock
          trigger:
            - call: "POST /accident-cases"
              payload: { report_number: "NTSB-2026-0103", category: "MARINE", occurred_at: "2026-08-28T02:05:00Z", location_state: "WA", fatalities_count: 1, injuries_count: 3, damage_estimate_cents: 5000000, is_public_transport: false }
              as: DutyOfficer
              captures: { mr_case_id: $.data.id }
          assert:
            - "AccidentCase.${mr_case_id}.statutory_score == 58  (40 + 15 + 3 + 0)"
            - "AccidentCase.${mr_case_id}.risk_adjusted_score == 62.6  (40.0 + round1(18.75)=18.8 + round1(3.75)=3.8 + 0.0)"
            - "AccidentCase.${mr_case_id}.risk_adjusted_score != 62.5  (the sum-then-round order is forbidden)"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: non_linear_launch_decision_reconsider_cycle
        grounds:
          - state_machines.LaunchDecision.ADOPTED_to_PROPOSED
          - state_machines.LaunchDecision.PROPOSED_to_ADOPTED
          - state_machines.AccidentCase.LIMITED_TRACK_to_SCREENING
        distinguishing_aspect: "Cycle on the LaunchDecision entity: PROPOSED -> ADOPTED -> PROPOSED (reconsider) -> ADOPTED, dragging AccidentCase through LIMITED_TRACK -> SCREENING -> LAUNCHED; distinct from the Investigation phase revert cycle of the sibling instance."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. A MARINE case scoring 58 (LIMITED band) with an adopted LIMITED decision."
          setup_api_calls:
            - *d_clock
            - call: "POST /accident-cases"
              payload: { report_number: "NTSB-2026-0104", category: "MARINE", occurred_at: "2026-08-27T11:00:00Z", location_state: "OR", fatalities_count: 1, injuries_count: 3, damage_estimate_cents: 5000000, is_public_transport: false }
              as: DutyOfficer
              captures: { cyc_case_id: $.data.id, cyc_case_v: $.data.version }
            - call: "POST /accident-cases/${cyc_case_id}/launch-decisions"
              payload: { mode: "LIMITED", expected_accident_case_version: "${cyc_case_v}" }
              as: ManagingDirector
              as_user_id: "md-1"
              captures: { cyc_decision_id: $.data.launch_decisions.0.decision_id }
            - call: "POST /accident-cases/${cyc_case_id}/launch-decisions/${cyc_decision_id}/adopt"
              payload: {}
              as: ManagingDirector
              as_user_id: "md-2"
          trigger:
            - call: "POST /accident-cases/${cyc_case_id}/launch-decisions/${cyc_decision_id}/reconsider"
              payload: { is_public_transport: true, rationale: "New evidence: the vessel was under public-ferry contract." }
              as: ManagingDirector
              as_user_id: "md-1"
              captures: { cyc_case_v2: $.data.version }
            - call: "POST /accident-cases/${cyc_case_id}/launch-decisions/${cyc_decision_id}/adopt"
              payload: { iic_user_id: "iic-1" }
              as: ManagingDirector
              as_user_id: "md-2"
          assert:
            - "after the first adopt, AccidentCase.${cyc_case_id}.status == LIMITED_TRACK"
            - "reconsider returns the SAME decision ${cyc_decision_id} to PROPOSED and the case to SCREENING"
            - "the severity override recomputes statutory_score to 78  (40 + 15 + 3 + 20) and suggested_mode to FULL_GO_TEAM"
            - "exactly one PROPOSED decision exists on the case after reconsider"
            - "the second adopt (mode FULL_GO_TEAM) succeeds: case status == LAUNCHED and GET /investigations?accident_case_id=${cyc_case_id} returns exactly 1 row"
            - "decision.snapshot_statutory_score == 78 after the reconsideration refresh"

      - name: non_linear_investigation_factual_analysis_revert
        grounds:
          - state_machines.Investigation.ANALYSIS_to_FACTUAL
          - state_machines.Investigation.FACTUAL_to_ANALYSIS
          - state_machines.InvestigativeGroup.COMPLETE_to_ACTIVE
        distinguishing_aspect: "Revert cycle on the Investigation entity (a different entity than LaunchDecision): FACTUAL -> ANALYSIS -> FACTUAL via reopen-factual, with COMPLETE groups reverting to ACTIVE while the OPEN docket is never re-sealed, then re-completion drives the loop forward to ANALYSIS a second time."
        test_recipe:
          setup:
            - "Base chain: investigation in ANALYSIS, docket OPEN, one COMPLETE group with a DOCKETED report and one SEATED seat."
          setup_api_calls:
            - *d_clock
            - *d_case
            - *d_propose
            - *d_adopt
            - *d_fetch_inv
            - *d_group
            - *d_adv_onscene
            - *d_org
            - *d_designation
            - *d_seat
            - *d_adv_factual
            - *d_report
            - *d_verify
            - *d_complete
            - *d_release
            - *d_adv_analysis
          trigger:
            - call: "POST /investigations/${inv_id}/reopen-factual"
              payload: {}
              as: IIC
              as_user_id: "iic-1"
            - call: "POST /groups/${grp_id}/complete"
              payload: {}
              as: GroupChairman
              as_user_id: "gc-1"
            - call: "POST /investigations/${inv_id}/advance-phase"
              payload: { to_phase: "ANALYSIS" }
              as: IIC
              as_user_id: "iic-1"
          assert:
            - "the reopen-factual response shows phase == FACTUAL and docket_status == OPEN (the docket is not re-sealed)"
            - "after reopen, GET /groups/${grp_id} shows status == ACTIVE (reverted from COMPLETE)"
            - "after reopen, GET /investigations/${inv_id} shows docket_completeness_pct == 0 (the ACTIVE group is unsatisfied)"
            - "the group re-completes successfully even though its only report is DOCKETED (DOCKETED satisfies the completion gate)"
            - "the final advance-phase returns phase == ANALYSIS — the cycle closed forward"
            - "the embedded report ${rpt_id} keeps status DOCKETED throughout (public factual record is never withdrawn by an analysis reopen)"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: transitive_cascade_expulsion_empties_complete_group
        grounds:
          - state_machines.PartyDesignation.ACTIVE_to_EXPELLED
          - state_machines.GroupSeat.SEATED_to_REMOVED
          - state_machines.InvestigativeGroup.COMPLETE_to_ACTIVE
          - calculations.docket_completeness_pct
        distinguishing_aspect: "Depth-4 cascade triggered by expulsion: designation EXPELLED (link 1) -> its seat REMOVED (link 2, caused by link 1) -> the now-empty COMPLETE group reverts to ACTIVE (link 3, caused by link 2) -> docket_completeness_pct recomputed on the investigation (link 4, caused by link 3); a different trigger than the board-close cascade of the sibling instance."
        test_recipe:
          setup:
            - "Base chain through release-docket: docket OPEN, one COMPLETE group whose only seat belongs to designation ${dsg_id}, docket_completeness_pct == 100."
          setup_api_calls:
            - *d_clock
            - *d_case
            - *d_propose
            - *d_adopt
            - *d_fetch_inv
            - *d_group
            - *d_adv_onscene
            - *d_org
            - *d_designation
            - *d_seat
            - *d_adv_factual
            - *d_report
            - *d_verify
            - *d_complete
            - *d_release
          trigger:
            - call: "POST /party-designations/${dsg_id}/seats/${seat_id}/conduct-violations"
              payload: { violation_kind: "PREMATURE_PUBLIC_STATEMENT", detail: "Party counsel briefed reporters on the factual record before the board meeting." }
              as: IIC
              as_user_id: "iic-1"
            - call: "POST /party-designations/${dsg_id}/expel"
              payload: { reason: "Premature public statement on investigation findings." }
              as: ManagingDirector
              as_user_id: "md-1"
          assert:
            - "PartyDesignation.${dsg_id}.status == EXPELLED and expulsion_reason is recorded"
            - "GET /party-designations/${dsg_id} shows group_seats.0.status == REMOVED (link 2)"
            - "GET /groups/${grp_id} shows status == ACTIVE and seated_count == 0 (link 3: the COMPLETE group reverted because its last seat was removed)"
            - "GET /investigations/${inv_id} shows docket_completeness_pct == 0 (link 4: was 100 before expulsion)"
            - "GET /investigations/${inv_id} shows docket_status == OPEN (an opened public docket is not re-sealed by expulsion)"

      - name: transitive_cascade_board_adoption_closes_case
        grounds:
          - state_machines.BoardMeeting.IN_SESSION_to_COMPLETED
          - state_machines.Investigation.BOARD_REVIEW_to_ADOPTED
          - state_machines.AccidentCase.LAUNCHED_to_CLOSED_ADOPTED
          - calculations.adoption_outcome
        distinguishing_aspect: "Depth-3 cascade triggered by board-meeting close (a different trigger than expulsion): meeting COMPLETED with outcome ADOPTED (link 1) -> investigation phase ADOPTED with docket FINAL and groups DISBANDED (link 2, caused by link 1) -> accident case CLOSED_ADOPTED (link 3, caused by link 2)."
        test_recipe:
          setup:
            - "Base chain through ANALYSIS, plus a scheduled board meeting (3 sitting members) moved into session by the clock; votes 2 ADOPT / 1 REJECT-with-dissent."
          setup_api_calls:
            - *d_clock
            - *d_case
            - *d_propose
            - *d_adopt
            - *d_fetch_inv
            - *d_group
            - *d_adv_onscene
            - *d_org
            - *d_designation
            - *d_seat
            - *d_adv_factual
            - *d_report
            - *d_verify
            - *d_complete
            - *d_release
            - *d_adv_analysis
            - call: "POST /board-meetings"
              payload: { investigation_id: "${inv_id}", room_id: "room-1", window_start_utc: "2026-09-02T09:00:00Z", window_end_utc: "2026-09-02T10:00:00Z", sitting_member_ids: ["bm-1", "bm-2", "bm-3"] }
              as: BoardAdmin
              captures: { mtg_id: $.data.id, mtg_v: $.data.version }
            - call: "POST /investigations/${inv_id}/advance-phase"
              payload: { to_phase: "BOARD_REVIEW" }
              as: IIC
              as_user_id: "iic-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T09:00:00Z" }
              as: BoardAdmin
            - call: "POST /board-meetings/${mtg_id}/votes"
              payload: { position: "ADOPT", expected_meeting_version: "${mtg_v}" }
              as: BoardMember
              as_user_id: "bm-1"
              captures: { mtg_v2: $.data.version }
            - call: "POST /board-meetings/${mtg_id}/votes"
              payload: { position: "ADOPT", expected_meeting_version: "${mtg_v2}" }
              as: BoardMember
              as_user_id: "bm-2"
              captures: { mtg_v3: $.data.version }
            - call: "POST /board-meetings/${mtg_id}/votes"
              payload: { position: "REJECT", dissent_text: "The probable cause underweights maintenance culture.", expected_meeting_version: "${mtg_v3}" }
              as: BoardMember
              as_user_id: "bm-3"
          trigger:
            - call: "POST /board-meetings/${mtg_id}/close"
              payload: {}
              as: BoardAdmin
          assert:
            - "BoardMeeting.${mtg_id}.status == COMPLETED and outcome == ADOPTED (adopt_count 2 > reject_count 1)"
            - "BoardMeeting.${mtg_id}.dissenting_member_ids == [\"bm-3\"] (link 1 materializes the dissent record)"
            - "GET /investigations/${inv_id} shows phase == ADOPTED and docket_status == FINAL (link 2)"
            - "GET /groups/${grp_id} shows status == DISBANDED (link 2 side effect)"
            - "GET /accident-cases/${case_id} shows status == CLOSED_ADOPTED (link 3)"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: priority_pair_designation_phase_state_beats_party_exclusion
        grounds:
          - validations[priority=4]
          - validations[priority=7]
          - errors.ERR_INVESTIGATION_PHASE_INVALID
          - errors.ERR_PARTY_TYPE_EXCLUDED
        distinguishing_aspect: "Error-category pair state vs business_constraint: a designation created while the investigation is in ANALYSIS AND for a CLAIMANT_COUNSEL organization violates both rules, and the state error (priority 4) wins over the exclusion error (priority 7); the sibling instance exercises the business_safety vs business_constraint pair instead."
        test_recipe:
          setup:
            - "Base chain through ANALYSIS; a registered CLAIMANT_COUNSEL organization."
          setup_api_calls:
            - *d_clock
            - *d_case
            - *d_propose
            - *d_adopt
            - *d_fetch_inv
            - *d_group
            - *d_adv_onscene
            - *d_org
            - *d_designation
            - *d_seat
            - *d_adv_factual
            - *d_report
            - *d_verify
            - *d_complete
            - *d_release
            - *d_adv_analysis
            - call: "POST /party-organizations"
              payload: { legal_name: "Crockett & Wimborne LLP", org_type: "CLAIMANT_COUNSEL" }
              as: PartyCoordinator
              captures: { lawfirm_id: $.data.id }
          trigger:
            - call: "POST /party-designations"
              payload: { investigation_id: "${inv_id}", organization_id: "${lawfirm_id}" }
              as: PartyCoordinator
              captures: { err_state: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_INVESTIGATION_PHASE_INVALID"
            - "error_id != ERR_PARTY_TYPE_EXCLUDED (the state gate at priority 4 shadows the exclusion at priority 7)"
            - "GET /party-designations?organization_id=${lawfirm_id} returns 0 rows"

      - name: priority_pair_docket_safety_beats_group_completeness
        grounds:
          - validations[priority=6]
          - validations[priority=7]
          - errors.ERR_RECORDER_READOUT_INCOMPLETE
          - errors.ERR_DOCKET_INCOMPLETE
        distinguishing_aspect: "Error-category pair business_safety vs business_constraint: docket release with a readout session still in the future AND a group that is not complete violates both rules, and the recorder-protection safety error (priority 6) wins over the docket-completeness constraint (priority 7) — a different category pair than the sibling instance."
        test_recipe:
          setup:
            - "Investigation in FACTUAL with one seated but never-completed group (no factual report), and one recorder whose readout session ends after the current clock."
          setup_api_calls:
            - *d_clock
            - *d_case
            - *d_propose
            - *d_adopt
            - *d_fetch_inv
            - *d_group
            - *d_adv_onscene
            - *d_org
            - *d_designation
            - *d_seat
            - *d_adv_factual
            - call: "POST /recorders"
              payload: { investigation_id: "${inv_id}", recorder_type: "CVR", condition: "INTACT" }
              as: RecorderCustodian
              captures: { rec_pkg_id: $.data.id }
            - call: "POST /recorders/${rec_pkg_id}/readout-sessions"
              payload: { bench_id: "bench-1", window_start_utc: "2026-09-03T10:00:00Z", window_end_utc: "2026-09-03T12:00:00Z" }
              as: RecorderCustodian
          trigger:
            - call: "POST /investigations/${inv_id}/release-docket"
              payload: {}
              as: DocketOfficer
              captures: { err_safety: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_RECORDER_READOUT_INCOMPLETE"
            - "error_id != ERR_DOCKET_INCOMPLETE (recorder data protection at priority 6 shadows group completeness at priority 7)"
            - "GET /investigations/${inv_id} shows docket_status == SEALED"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: boundary_launch_threshold_sixty_inclusive
        grounds:
          - calculations.statutory_launch_score
          - errors.ERR_LAUNCH_THRESHOLD_NOT_MET
          - endpoints.POST_/accident-cases/{id}/launch-decisions/{decision_id}/adopt
        distinguishing_aspect: "Metric statutory_score at the >= 60 FULL_GO_TEAM adoption boundary (inclusive): exactly 60 adopts, 59 rejects; the 59 case also pins the inclusive lower bound of the damage tier (exactly 1000000 cents scores 15, not 5). A different metric and endpoint than the recommendation-overdue boundary of the sibling instance."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Case A scoring exactly 60; case B scoring exactly 59."
          setup_api_calls:
            - *d_clock
            - call: "POST /accident-cases"
              payload: { report_number: "NTSB-2026-0105", category: "HIGHWAY", occurred_at: "2026-08-31T06:00:00Z", location_state: "VA", fatalities_count: 1, injuries_count: 0, damage_estimate_cents: 0, is_public_transport: true }
              as: DutyOfficer
              captures: { case_a_id: $.data.id, case_a_v: $.data.version }
            - call: "POST /accident-cases"
              payload: { report_number: "NTSB-2026-0106", category: "HIGHWAY", occurred_at: "2026-08-31T07:00:00Z", location_state: "MD", fatalities_count: 1, injuries_count: 4, damage_estimate_cents: 1000000, is_public_transport: false }
              as: DutyOfficer
              captures: { case_b_id: $.data.id, case_b_v: $.data.version }
            - call: "POST /accident-cases/${case_a_id}/launch-decisions"
              payload: { mode: "FULL_GO_TEAM", expected_accident_case_version: "${case_a_v}" }
              as: ManagingDirector
              as_user_id: "md-1"
              captures: { decision_a_id: $.data.launch_decisions.0.decision_id }
            - call: "POST /accident-cases/${case_b_id}/launch-decisions"
              payload: { mode: "FULL_GO_TEAM", expected_accident_case_version: "${case_b_v}" }
              as: ManagingDirector
              as_user_id: "md-1"
              captures: { decision_b_id: $.data.launch_decisions.0.decision_id }
          trigger:
            - call: "POST /accident-cases/${case_a_id}/launch-decisions/${decision_a_id}/adopt"
              payload: { iic_user_id: "iic-1" }
              as: ManagingDirector
              as_user_id: "md-2"
            - call: "POST /accident-cases/${case_b_id}/launch-decisions/${decision_b_id}/adopt"
              payload: { iic_user_id: "iic-1" }
              as: ManagingDirector
              as_user_id: "md-2"
              captures: { err_b: $.data.error_id }
          assert:
            - "AccidentCase.${case_a_id}.statutory_score == 60  (40 + 0 + 0 + 20)"
            - "AccidentCase.${case_b_id}.statutory_score == 59  (40 + 15 + 4 + 0; exactly 1000000 cents takes the 15-point tier)"
            - "case A adopt returns 200 and AccidentCase.${case_a_id}.status == LAUNCHED (60 >= 60)"
            - "case B adopt returns 422 and err_b == ERR_LAUNCH_THRESHOLD_NOT_MET (59 < 60)"
            - "AccidentCase.${case_b_id}.suggested_mode == LIMITED and its decision remains PROPOSED"

      - name: boundary_overdue_strictly_greater_than_ninety_days
        grounds:
          - calculations.recommendation_aging
          - entities.SafetyRecommendation.fields.overdue
          - endpoints.GET_/safety-recommendations/{id}
        distinguishing_aspect: "Metric calendar_elapsed_days at the strict > 90 overdue boundary: at exactly 90 days overdue is false, at 91 it flips true — observed through the recommendation read endpoint, a different metric (elapsed days vs launch score) and a different endpoint than the sibling boundary instance."
        test_recipe:
          setup:
            - "Base chain through ANALYSIS with one recommendation issued at 2026-09-01T00:00:00Z and never answered."
          setup_api_calls:
            - *d_clock
            - *d_case
            - *d_propose
            - *d_adopt
            - *d_fetch_inv
            - *d_group
            - *d_adv_onscene
            - *d_org
            - *d_designation
            - *d_seat
            - *d_adv_factual
            - *d_report
            - *d_verify
            - *d_complete
            - *d_release
            - *d_adv_analysis
            - *d_rec
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-30T00:00:00Z" }
              as: BoardAdmin
            - call: "GET /safety-recommendations/${rec_id}"
              payload: {}
              as: DutyOfficer
              captures: { overdue_d90: $.data.overdue }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-01T00:00:00Z" }
              as: BoardAdmin
            - call: "GET /safety-recommendations/${rec_id}"
              payload: {}
              as: DutyOfficer
          assert:
            - "at 2026-11-30T00:00:00Z (exactly 90 days after issuance): calendar_elapsed_days == 90 and overdue == false (strict > does not trigger)"
            - "at 2026-12-01T00:00:00Z (91 days): calendar_elapsed_days == 91 and overdue == true"
            - "SafetyRecommendation.${rec_id}.status remains OPEN_AWAITING_RESPONSE at both reads (aging never mutates lifecycle state)"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: cross_entity_designation_gated_by_investigation_phase
        grounds:
          - state_machines.Investigation
          - state_machines.PartyDesignation
          - errors.ERR_INVESTIGATION_PHASE_INVALID
        distinguishing_aspect: "Entity pair PartyDesignation <- Investigation: designation creation succeeds while the phase dimension is in {GO_TEAM_ASSEMBLED, ON_SCENE, FACTUAL} and fails with ERR_INVESTIGATION_PHASE_INVALID once the same investigation reaches ANALYSIS; the sibling instance crosses a different pair (GroupSeat <- InvestigativeGroup)."
        test_recipe:
          setup:
            - "Base chain through ANALYSIS; one eligible OPERATOR organization not yet designated."
          setup_api_calls:
            - *d_clock
            - *d_case
            - *d_propose
            - *d_adopt
            - *d_fetch_inv
            - *d_group
            - *d_adv_onscene
            - *d_org
            - *d_designation
            - *d_seat
            - *d_adv_factual
            - *d_report
            - *d_verify
            - *d_complete
            - *d_release
            - *d_adv_analysis
            - call: "POST /party-organizations"
              payload: { legal_name: "Seaboard Railcar Manufacturing", org_type: "MANUFACTURER" }
              as: PartyCoordinator
              captures: { mfr_id: $.data.id }
          trigger:
            - call: "POST /party-designations"
              payload: { investigation_id: "${inv_id}", organization_id: "${mfr_id}" }
              as: PartyCoordinator
              captures: { err_phase: $.data.error_id }
          assert:
            - "the earlier designation ${dsg_id} succeeded while the investigation was in ON_SCENE (the positive leg: PartyDesignation.${dsg_id}.status == ACTIVE)"
            - "the ANALYSIS-phase designation returns 409 and err_phase == ERR_INVESTIGATION_PHASE_INVALID"
            - "GET /party-designations?organization_id=${mfr_id} returns 0 rows"

      - name: cross_entity_seat_gated_by_group_status
        grounds:
          - state_machines.InvestigativeGroup
          - state_machines.GroupSeat
          - errors.ERR_GROUP_NOT_ACTIVE
        distinguishing_aspect: "Entity pair GroupSeat <- InvestigativeGroup (different from PartyDesignation <- Investigation): seating an ACTIVE designation onto a group that has already completed is rejected with ERR_GROUP_NOT_ACTIVE even though the designation itself is perfectly valid."
        test_recipe:
          setup:
            - "Base chain through group completion (phase FACTUAL, group COMPLETE); a second designated ACTIVE party without a seat."
          setup_api_calls:
            - *d_clock
            - *d_case
            - *d_propose
            - *d_adopt
            - *d_fetch_inv
            - *d_group
            - *d_adv_onscene
            - *d_org
            - *d_designation
            - *d_seat
            - *d_adv_factual
            - *d_report
            - *d_verify
            - *d_complete
            - call: "POST /party-organizations"
              payload: { legal_name: "Allied Signalmens Union", org_type: "UNION" }
              as: PartyCoordinator
              captures: { union_id: $.data.id }
            - call: "POST /party-designations"
              payload: { investigation_id: "${inv_id}", organization_id: "${union_id}" }
              as: PartyCoordinator
              captures: { dsg2_id: $.data.id }
          trigger:
            - call: "POST /party-designations/${dsg2_id}/seats"
              payload: { group_id: "${grp_id}" }
              as: IIC
              as_user_id: "iic-1"
              captures: { err_grp: $.data.error_id }
          assert:
            - "PartyDesignation.${dsg2_id}.status == ACTIVE (the designation itself is valid — only the group state blocks)"
            - "the seat creation returns 409 and err_grp == ERR_GROUP_NOT_ACTIVE"
            - "GET /groups/${grp_id} still shows seated_count == 1 and status == COMPLETE"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: resource_temporal_overlap_bench_half_open_sessions
        grounds:
          - validations[priority=8]
          - errors.ERR_BENCH_WINDOW_CONFLICT
          - entities.ReadoutSession.fields.bench_id
        distinguishing_aspect: "Half-open interval semantics on the lab-bench resource: [10:00,12:00) then [12:00,14:00) on the same bench is ALLOWED (touching endpoints do not overlap), while [11:30,13:00) conflicts — a different interval semantics than the room buffer rule of the sibling instance."
        test_recipe:
          setup:
            - "Investigation launched (GO_TEAM_ASSEMBLED); one recorder registered."
          setup_api_calls:
            - *d_clock
            - *d_case
            - *d_propose
            - *d_adopt
            - *d_fetch_inv
            - call: "POST /recorders"
              payload: { investigation_id: "${inv_id}", recorder_type: "FDR", condition: "DAMAGED" }
              as: RecorderCustodian
              captures: { fdr_id: $.data.id }
          trigger:
            - call: "POST /recorders/${fdr_id}/readout-sessions"
              payload: { bench_id: "bench-7", window_start_utc: "2026-09-02T10:00:00Z", window_end_utc: "2026-09-02T12:00:00Z" }
              as: RecorderCustodian
            - call: "POST /recorders/${fdr_id}/readout-sessions"
              payload: { bench_id: "bench-7", window_start_utc: "2026-09-02T12:00:00Z", window_end_utc: "2026-09-02T14:00:00Z" }
              as: RecorderCustodian
            - call: "POST /recorders/${fdr_id}/readout-sessions"
              payload: { bench_id: "bench-7", window_start_utc: "2026-09-02T11:30:00Z", window_end_utc: "2026-09-02T13:00:00Z" }
              as: RecorderCustodian
              captures: { err_bench: $.data.error_id }
          assert:
            - "the first session returns 201 and moves RecorderPackage.${fdr_id} to IN_READOUT"
            - "the second session returns 201 — start == prior end is allowed under half-open semantics"
            - "the third session returns 409 and err_bench == ERR_BENCH_WINDOW_CONFLICT"
            - "GET /recorders/${fdr_id} shows exactly 2 embedded readout_sessions"

      - name: resource_temporal_overlap_room_turnaround_buffer
        grounds:
          - validations[priority=8]
          - errors.ERR_ROOM_WINDOW_CONFLICT
          - entities.BoardMeeting.fields.room_id
        distinguishing_aspect: "Buffer-expanded interval semantics on the hearing-room resource: a meeting ending at 10:00 blocks a new meeting starting at 10:30 in the same room (inside the 60-minute turnaround buffer) but allows one starting at exactly 11:00 — different geometric treatment (mandatory gap) than the bench's touching-allowed half-open rule, on a different resource entity."
        test_recipe:
          setup:
            - "Base chain through ANALYSIS; no board meetings yet."
          setup_api_calls:
            - *d_clock
            - *d_case
            - *d_propose
            - *d_adopt
            - *d_fetch_inv
            - *d_group
            - *d_adv_onscene
            - *d_org
            - *d_designation
            - *d_seat
            - *d_adv_factual
            - *d_report
            - *d_verify
            - *d_complete
            - *d_release
            - *d_adv_analysis
          trigger:
            - call: "POST /board-meetings"
              payload: { investigation_id: "${inv_id}", room_id: "room-1", window_start_utc: "2026-09-20T09:00:00Z", window_end_utc: "2026-09-20T10:00:00Z", sitting_member_ids: ["bm-1", "bm-2", "bm-3"] }
              as: BoardAdmin
              captures: { mtg_a_id: $.data.id }
            - call: "POST /board-meetings"
              payload: { investigation_id: "${inv_id}", room_id: "room-1", window_start_utc: "2026-09-20T10:30:00Z", window_end_utc: "2026-09-20T11:00:00Z", sitting_member_ids: ["bm-1", "bm-2", "bm-3"] }
              as: BoardAdmin
              captures: { err_room: $.data.error_id }
            - call: "POST /board-meetings"
              payload: { investigation_id: "${inv_id}", room_id: "room-1", window_start_utc: "2026-09-20T11:00:00Z", window_end_utc: "2026-09-20T12:00:00Z", sitting_member_ids: ["bm-1", "bm-2", "bm-3"] }
              as: BoardAdmin
              captures: { mtg_c_id: $.data.id }
          assert:
            - "meeting A (${mtg_a_id}) returns 201"
            - "the 10:30 meeting returns 409 and err_room == ERR_ROOM_WINDOW_CONFLICT (10:30 < 10:00 + 60 minutes)"
            - "the 11:00 meeting (${mtg_c_id}) returns 201 — the buffer expires exactly at 11:00 (11:00 < 11:00 is false)"
            - "GET /board-meetings?investigation_id=${inv_id} returns exactly 2 rows"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: compensating_invariant_seat_then_expel_conserves_seating
        grounds:
          - calculations.seated_count
          - state_machines.PartyDesignation.ACTIVE_to_EXPELLED
          - state_machines.GroupSeat.SEATED_to_REMOVED
        distinguishing_aspect: "Conserved quantity = InvestigativeGroup.seated_count: seating party D raises it 1 -> 2, and the compensating expulsion of D returns it to exactly 1 with the unrelated party E's seat untouched; a different conserved quantity than the vote-tally invariant of the sibling instance."
        test_recipe:
          setup:
            - "Investigation ON_SCENE with one ACTIVE group; party E seated (seated_count 1); party D designated and then seated (seated_count 2)."
          setup_api_calls:
            - *d_clock
            - *d_case
            - *d_propose
            - *d_adopt
            - *d_fetch_inv
            - *d_group
            - *d_adv_onscene
            - *d_org
            - *d_designation
            - *d_seat
            - call: "POST /party-organizations"
              payload: { legal_name: "Piedmont Airframe Works", org_type: "MANUFACTURER" }
              as: PartyCoordinator
              captures: { orgd_id: $.data.id }
            - call: "POST /party-designations"
              payload: { investigation_id: "${inv_id}", organization_id: "${orgd_id}" }
              as: PartyCoordinator
              captures: { dsgd_id: $.data.id }
            - call: "POST /party-designations/${dsgd_id}/seats"
              payload: { group_id: "${grp_id}" }
              as: IIC
              as_user_id: "iic-1"
              captures: { seatd_id: $.data.group_seats.0.seat_id }
          trigger:
            - call: "POST /party-designations/${dsgd_id}/seats/${seatd_id}/conduct-violations"
              payload: { violation_kind: "PREMATURE_PUBLIC_STATEMENT", detail: "Manufacturer issued a press release attributing cause before the factual docket opened." }
              as: IIC
              as_user_id: "iic-1"
            - call: "POST /party-designations/${dsgd_id}/expel"
              payload: { reason: "Premature public statement." }
              as: ManagingDirector
              as_user_id: "md-1"
          assert:
            - "before expulsion, GET /groups/${grp_id} showed seated_count == 2"
            - "after expulsion, GET /groups/${grp_id} shows seated_count == 1 — the seat+expel pair leaves the conserved quantity unchanged"
            - "GET /party-designations/${dsg_id} shows its seat still SEATED (party E unaffected)"
            - "GET /party-designations/${dsgd_id} shows status EXPELLED and its seat REMOVED"
            - "GET /groups/${grp_id} still shows status == ACTIVE (an ACTIVE group does not revert; only COMPLETE groups do)"

      - name: compensating_invariant_vote_cast_then_retract_conserves_tallies
        grounds:
          - calculations.adoption_outcome
          - entities.BoardMeeting.fields.adopt_count
          - errors.ERR_NO_VOTE_TO_RETRACT
        distinguishing_aspect: "Conserved quantity = the meeting vote tallies (adopt_count / reject_count / abstain_count): casting ADOPT then RETRACTing it returns every tally to 0 and member_votes to empty, with only the OCC version advancing — a different conserved quantity than group seating."
        test_recipe:
          setup:
            - "Base chain through ANALYSIS; a 3-member board meeting in session (clock at window start); no votes yet."
          setup_api_calls:
            - *d_clock
            - *d_case
            - *d_propose
            - *d_adopt
            - *d_fetch_inv
            - *d_group
            - *d_adv_onscene
            - *d_org
            - *d_designation
            - *d_seat
            - *d_adv_factual
            - *d_report
            - *d_verify
            - *d_complete
            - *d_release
            - *d_adv_analysis
            - call: "POST /board-meetings"
              payload: { investigation_id: "${inv_id}", room_id: "room-2", window_start_utc: "2026-09-02T09:00:00Z", window_end_utc: "2026-09-02T10:00:00Z", sitting_member_ids: ["bm-1", "bm-2", "bm-3"] }
              as: BoardAdmin
              captures: { mtg_id: $.data.id, mtg_v: $.data.version }
            - call: "POST /investigations/${inv_id}/advance-phase"
              payload: { to_phase: "BOARD_REVIEW" }
              as: IIC
              as_user_id: "iic-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T09:00:00Z" }
              as: BoardAdmin
          trigger:
            - call: "POST /board-meetings/${mtg_id}/votes"
              payload: { position: "ADOPT", expected_meeting_version: "${mtg_v}" }
              as: BoardMember
              as_user_id: "bm-1"
              captures: { mtg_v2: $.data.version }
            - call: "POST /board-meetings/${mtg_id}/votes"
              payload: { position: "RETRACT", expected_meeting_version: "${mtg_v2}" }
              as: BoardMember
              as_user_id: "bm-1"
          assert:
            - "after the ADOPT vote, the response showed adopt_count == 1"
            - "after RETRACT, GET /board-meetings/${mtg_id} shows adopt_count == 0 and reject_count == 0 and abstain_count == 0 and member_votes == []"
            - "BoardMeeting.${mtg_id}.outcome is still null (tally conservation, not a decision)"
            - "BoardMeeting.${mtg_id}.version == 3 (both mutations incremented the OCC version even though the tallies round-tripped)"
