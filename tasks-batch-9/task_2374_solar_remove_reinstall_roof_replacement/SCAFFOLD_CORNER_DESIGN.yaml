      - name: corner_scoping_a_high_flashing_finding_does_not_reopen_the_approved_permit
        claim_type: conditional_cascade
        grounds:
          - state_machines.DeckFinding.transitions["OPEN -> UPGRADE_SCOPED"].side_effects
          - entities.DeckFinding.fields.requires_repermit
          - calculations.deck_upgrade_cost
          - calculations.project_posture
        distinguishing_aspect: "The re-permit cascade is guarded by requires_repermit, which is true only for HIGH/CRITICAL SHEATHING_ROT or STRUCTURAL_DEFLECTION. A HIGH FLASHING_FAILURE therefore leaves the APPROVED permit and its PASSED inspection completely untouched, yet still drops posture to RESTRICTED because a HIGH finding is UPGRADE_SCOPED - the two effects are independent."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; the jurisdiction requires re-permitting (repermit_required_for_reinstall true) so the cascade would fire if requires_repermit were true."
            - "Permit is APPROVED and one ROOF_DECK inspection on it has PASSED before the finding is scoped; the backlog floor is clock_now + 2 days = 2026-08-03T00:00:00Z, and the inspection window starts 2026-08-05T15:00:00Z."
            - "Cost arithmetic: area 120 sqft -> 100*950 + 20*780 = 110600; attachments 6 * 4200 * 1.25 (FLASHING_FAILURE surcharge) = 31500; severity HIGH 1.40 with no emergency bump because posture is RESTRICTED, not FROZEN; raw = (110600 + 31500) * 1.40 = 198940, under the 2500000 cap and above both floors."
          setup_api_calls:
            - call: "POST /reroof/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProjectCoordinator
            - call: "POST /reroof/parties"
              payload: { name: "Ridgeline Roofing", party_type: "ROOFER", contact_email: "ops@ridgeline.example" }
              as: ProjectCoordinator
              captures: { roofer_id: $.data.id }
            - call: "POST /reroof/parties"
              payload: { name: "Alvarez Household", party_type: "SOLAR_OWNER", contact_email: "owner2@example.com" }
              as: ProjectCoordinator
              captures: { owner_id: $.data.id }
            - call: "POST /reroof/parties"
              payload: { name: "SunSystem Crew A", party_type: "SOLAR_CONTRACTOR", contact_email: "crew.a@sunsystem.example" }
              as: ProjectCoordinator
              captures: { crew_id: $.data.id }
            - call: "POST /reroof/jurisdictions"
              payload: { name: "Westvale AHJ", code: "WESTVALE", repermit_required_for_reinstall: true, reinspection_required: true, inspection_slots_per_day: 2, backlog_days: 2, permit_review_days: 10 }
              as: ProjectCoordinator
              captures: { juris_id: $.data.id }
            - call: "POST /reroof/projects"
              payload: { site_address: "77 Ocotillo Ln, Chandler AZ", ownership_model: "HOST_OWNED", system_dc_kw: 6.0, roofer_party_id: "${roofer_id}", solar_owner_party_id: "${owner_id}", solar_contractor_party_id: "${crew_id}", baseline_daily_kwh: 30.0, downtime_days_estimated: 4, upgrade_budget_cents: 2000000 }
              as: ProjectCoordinator
              captures: { p1: $.data.id }
            - call: "POST /reroof/permit-applications"
              payload: { project_id: "${p1}", jurisdiction_id: "${juris_id}", scope: "STRUCTURAL_UPGRADE" }
              as: ProjectCoordinator
              captures: { perm_id: $.data.id }
            - call: "POST /reroof/permit-applications/${perm_id}/submission"
              as: ProjectCoordinator
            - call: "POST /reroof/permit-applications/${perm_id}/decision"
              payload: { decision: "APPROVE" }
              as: AHJInspector
              as_user_id: "${juris_id}"
            - call: "POST /reroof/permit-applications/${perm_id}/inspections"
              payload: { inspection_type: "ROOF_DECK", slot_date: "2026-08-05", window_start_utc: "2026-08-05T15:00:00Z", window_end_utc: "2026-08-05T17:00:00Z" }
              as: ProjectCoordinator
              captures: { insp_id: $.data.id }
            - call: "POST /reroof/inspections/${insp_id}/result"
              payload: { result: "PASS", result_note: "deck acceptable" }
              as: AHJInspector
              as_user_id: "${juris_id}"
            - call: "POST /reroof/projects/${p1}/deck-findings"
              payload: { finding_type: "FLASHING_FAILURE", severity: "HIGH", affected_area_sqft: 120.0, attachment_count_affected: 6 }
              as: RoofingContractor
              as_user_id: "${roofer_id}"
              captures: { f1: $.data.id }
          trigger:
            - call: "POST /reroof/deck-findings/${f1}/upgrade"
              payload: { action: "SCOPE" }
              as: RoofingContractor
              as_user_id: "${roofer_id}"
          assert:
            - "HTTP status == 200"
            - "DeckFinding.${f1}.status == UPGRADE_SCOPED"
            - "DeckFinding.${f1}.requires_repermit == false"
            - "DeckFinding.${f1}.upgrade_cost_cents == 198940"
            - "DeckFinding.${f1}.scoped_by_party_id == ${roofer_id}"
            - "PermitApplication.${perm_id}.status == APPROVED"
            - "PermitApplication.${perm_id}.revision_count == 0"
            - "PermitApplication.${perm_id}.reopened_by_finding_id == null"
            - "PermitApplication.${perm_id}.fee_cents == 51100"
            - "Inspection.${insp_id}.status == PASSED"
            - "Inspection.${insp_id}.attempt_number == 1"
            - "ReroofProject.${p1}.posture == RESTRICTED"
            - "ReroofProject.${p1}.scoped_upgrade_cost_cents == 198940"

      - name: corner_handling_and_condition_dimensions_are_independent
        claim_type: parallel
        excluded_because:
          difficulty_instance: hardware_unit_handling_and_condition_dimensions_advance_independently
          rationale: "That difficulty instance already drives the two HardwareUnit dimensions through non-matching sequences and asserts the combined (handling_status, condition_grade) pair after each write, which is exactly the parallel-shape claim."

      - name: corner_removal_is_guarded_by_the_units_own_circuit_isolation
        claim_type: guarded transitions
        excluded_because:
          difficulty_instance: panel_removal_depends_on_its_own_array_circuit_isolation_not_a_sibling_circuit
          rationale: "That difficulty instance is the cross-entity guard test: it isolates one circuit, proves removal succeeds there, and proves the sibling circuit's unit is refused with ERR_CIRCUIT_NOT_ISOLATED."

      - name: corner_veto_reverses_every_side_effect_of_authorization
        claim_type: compensation
        excluded_because:
          difficulty_instance: system_owner_veto_unwinds_consents_reserved_credit_and_scheduled_windows
          rationale: "That difficulty instance walks the whole compensation set - consents reset to PENDING, reserved credit released with credit_authorized_cents conserved, scheduled windows REVOKED - with pre-computed literals, so a separate compensation corner would duplicate it."

      - name: corner_critical_structural_scoping_cascades_down_four_levels
        claim_type: cascade_down
        excluded_because:
          difficulty_instance: critical_structural_scoping_reopens_permit_invalidates_inspection_and_downgrades_posture
          rationale: "That difficulty instance is the depth-4 cascade end to end (finding -> permit revert and refee -> inspection invalidation -> posture), including the recomputed fee and review deadline."

  - section: calculations
    instances:
      - name: corner_ppa_provisional_credit_applies_the_zero_point_eight_five_ownership_factor
        claim_type: correct_result
        grounds:
          - calculations.downtime_production_loss_credit.constants.OWNERSHIP_FACTOR_PPA
          - state_machines.ReroofProject.transitions["AUTHORIZED -> DEENERGIZED"].side_effects
          - endpoints["GET /reroof/projects/{id}/downtime-summary"]
        distinguishing_aspect: "The PPA ownership factor 0.85 is exercised on its own: 33.6 kWh * 5 estimated days * 14 cents * 0.85 = 1999.2, which round_half_up to whole cents makes 1999 - a value no other factor can produce, and the single rounding happens at the very end of the product, not per day."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "A PPA project therefore needs three consents (roofer, solar owner, third-party system owner) before it can be authorized and de-energized."
