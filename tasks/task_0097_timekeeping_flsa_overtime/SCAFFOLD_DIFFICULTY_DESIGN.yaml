  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: punch_overlap_closed_interval_changeover
        grounds:
          - validations[priority=13]
          - errors[ERR_PUNCH_OVERLAP]
          - entities.TimePunch.fields.clock_in
        distinguishing_aspect: |
          INTERVAL SEMANTICS: CLOSED-on-both-ends on the Employee timeline. A second punch
          whose clock_in (16:00) exactly equals a prior CLOSED punch's clock_out (16:00)
          DOES collide — adjacency is NOT permitted because the worker cannot be in two
          places at the changeover instant. Resource = TimePunch.
        test_recipe:
          setup:
            - "CA worksite; NON_EXEMPT employee with a CLOSED punch 08:00-16:00 on 2026-06-01; a second SCHEDULED shift starting 16:00."
          setup_api_calls:
            - call: "POST /employers"
              payload: { legal_name: "Acme" }
              as: PayrollAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /wage-rulesets"
              payload: { employer_id: "${emp_id}", state_code: "CA", daily_ot_enabled: true }
              as: PayrollAdmin
            - call: "POST /worksites"
              payload: { employer_id: "${emp_id}", name: "CA site", state_code: "CA" }
              as: PayrollAdmin
              captures: { ws_ca: $.data.id }
            - call: "POST /employees"
              payload: { employer_id: "${emp_id}", home_worksite_id: "${ws_ca}", full_name: "Cathy", classification: "NON_EXEMPT", base_rate_cents: 2000 }
              as: PayrollAdmin
              captures: { e_ca: $.data.id }
            - call: "POST /shifts"
              payload: { employee_id: "${e_ca}", worksite_id: "${ws_ca}", scheduled_start: "2026-06-01T08:00:00Z", scheduled_end: "2026-06-01T16:00:00Z" }
              as: Supervisor
              captures: { sh_1: $.data.id }
            - call: "POST /shifts/${sh_1}/punches"
              payload: { clock_in: "2026-06-01T08:00:00Z" }
              as: Employee
              as_user_id: "${e_ca}"
              captures: { p_1: $.data.id }
            - call: "POST /punches/${p_1}/close"
              payload: { clock_out: "2026-06-01T16:00:00Z" }
              as: Employee
              as_user_id: "${e_ca}"
            - call: "POST /shifts"
              payload: { employee_id: "${e_ca}", worksite_id: "${ws_ca}", scheduled_start: "2026-06-01T16:00:00Z", scheduled_end: "2026-06-01T20:00:00Z" }
              as: Supervisor
              captures: { sh_2: $.data.id }
          trigger:
            - call: "POST /shifts/${sh_2}/punches"
              payload: { clock_in: "2026-06-01T16:00:00Z" }
              as: Employee
              as_user_id: "${e_ca}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_PUNCH_OVERLAP"

      - name: shift_overlap_half_open_adjacency_allowed
        grounds:
          - validations[priority=16]
          - errors[ERR_SHIFT_OVERLAP]
          - entities.Shift.fields.scheduled_start
        distinguishing_aspect: |
          DIFFERENT INTERVAL SEMANTICS (HALF-OPEN [start,end)) on a DIFFERENT resource
          (Shift): a back-to-back shift whose scheduled_start equals a prior shift's
          scheduled_end is ALLOWED (no overlap), whereas a shift that genuinely straddles
          (starts before the prior end) is rejected ERR_SHIFT_OVERLAP. The trigger creates
          a straddling shift to prove rejection.
        test_recipe:
          setup:
            - "CA worksite; NON_EXEMPT employee with a SCHEDULED shift 08:00-16:00 on 2026-06-01."
          setup_api_calls:
            - call: "POST /employers"
              payload: { legal_name: "Acme" }
              as: PayrollAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /wage-rulesets"
              payload: { employer_id: "${emp_id}", state_code: "CA", daily_ot_enabled: true }
              as: PayrollAdmin
            - call: "POST /worksites"
              payload: { employer_id: "${emp_id}", name: "CA site", state_code: "CA" }
              as: PayrollAdmin
              captures: { ws_ca: $.data.id }
            - call: "POST /employees"
              payload: { employer_id: "${emp_id}", home_worksite_id: "${ws_ca}", full_name: "Cathy", classification: "NON_EXEMPT", base_rate_cents: 2000 }
              as: PayrollAdmin
              captures: { e_ca: $.data.id }
            - call: "POST /shifts"
              payload: { employee_id: "${e_ca}", worksite_id: "${ws_ca}", scheduled_start: "2026-06-01T08:00:00Z", scheduled_end: "2026-06-01T16:00:00Z" }
              as: Supervisor
              captures: { sh_1: $.data.id }
            - call: "POST /shifts"
              payload: { employee_id: "${e_ca}", worksite_id: "${ws_ca}", scheduled_start: "2026-06-01T16:00:00Z", scheduled_end: "2026-06-01T20:00:00Z" }
              as: Supervisor
              captures: { sh_2: $.data.id }
          trigger:
            - call: "POST /shifts"
              payload: { employee_id: "${e_ca}", worksite_id: "${ws_ca}", scheduled_start: "2026-06-01T15:00:00Z", scheduled_end: "2026-06-01T18:00:00Z" }
              as: Supervisor
              captures: { err: $.data.error_id }
          assert:
            - "Shift.${sh_2}.status == SCHEDULED"
            - "response.status == 409"
            - "response.data.error_id == ERR_SHIFT_OVERLAP"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: payroll_include_then_cancel_conserves_gross
        grounds:
          - state_machines.TimesheetWeek.APPROVED_to_LOCKED
          - state_machines.PayrollRun.OPEN_to_CANCELLED
          - entities.PayrollRun.fields.total_gross_cents
          - entities.PayrollRun.fields.included_week_count
        distinguishing_aspect: |
          CONSERVED QUANTITY: payroll gross dollars. Forward (include) adds the week's
          16000 cents into PayrollRun.total_gross_cents and bumps included_week_count to 1;
          the compensating cancel MUST return total_gross_cents to 0 and included_week_count
          to 0 — no drift in the run's gross ledger.
        test_recipe:
          setup:
            - "CA worksite; NON_EXEMPT employee; APPROVED 8h week; OPEN payroll run; week LOCKED into run (run gross 16000)."
          setup_api_calls:
            - call: "POST /employers"
              payload: { legal_name: "Acme" }
              as: PayrollAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /wage-rulesets"
              payload: { employer_id: "${emp_id}", state_code: "CA", daily_ot_enabled: true }
              as: PayrollAdmin
            - call: "POST /worksites"
              payload: { employer_id: "${emp_id}", name: "CA site", state_code: "CA" }
              as: PayrollAdmin
              captures: { ws_ca: $.data.id }
            - call: "POST /employees"
              payload: { employer_id: "${emp_id}", home_worksite_id: "${ws_ca}", full_name: "Cathy", classification: "NON_EXEMPT", base_rate_cents: 2000 }
              as: PayrollAdmin
              captures: { e_ca: $.data.id }
            - call: "POST /shifts"
              payload: { employee_id: "${e_ca}", worksite_id: "${ws_ca}", scheduled_start: "2026-06-01T08:00:00Z", scheduled_end: "2026-06-01T16:00:00Z" }
              as: Supervisor
              captures: { sh_ca: $.data.id }
            - call: "POST /shifts/${sh_ca}/punches"
              payload: { clock_in: "2026-06-01T08:00:00Z" }
              as: Employee
              as_user_id: "${e_ca}"
              captures: { p_ca: $.data.id }
            - call: "POST /punches/${p_ca}/close"
              payload: { clock_out: "2026-06-01T16:00:00Z" }
              as: Employee
              as_user_id: "${e_ca}"
            - call: "POST /timesheet-weeks"
              payload: { employee_id: "${e_ca}", workweek_start: "2026-06-01" }
              as: Supervisor
              captures: { tw: $.data.id }
            - call: "POST /timesheet-weeks/${tw}/submit"
              payload: {}
              as: Supervisor
              as_user_id: "sup-1"
              captures: { tw_v_sub: $.data.version }
            - call: "POST /timesheet-weeks/${tw}/approve"
              payload: { expected_timesheet_week_version: "${tw_v_sub}" }
              as: Supervisor
              as_user_id: "sup-2"
              captures: { tw_v_appr: $.data.version }
            - call: "POST /payroll-runs"
              payload: { employer_id: "${emp_id}", period_start: "2026-06-01", period_end: "2026-06-07" }
              as: PayrollAdmin
              captures: { run: $.data.id }
            - call: "POST /payroll-runs/${run}/include"
              payload: { timesheet_week_id: "${tw}", expected_timesheet_week_version: "${tw_v_appr}" }
              as: PayrollAdmin
              captures: { gross_locked: $.data.total_gross_cents }
          trigger:
            - call: "POST /payroll-runs/${run}/cancel"
              payload: {}
              as: PayrollAdmin
              captures: { gross_after: $.data.total_gross_cents }
          assert:
            - "PayrollRun.${run}.total_gross_cents == 0"
            - "PayrollRun.${run}.included_week_count == 0"
            - "TimesheetWeek.${tw}.status == APPROVED"

      - name: tip_pool_distribute_conserves_tip_cents
        grounds:
          - state_machines.TipPool.OPEN_to_DISTRIBUTED
          - calculations.tip_pool_allocation
          - entities.TipPool.fields.pooled_cents
          - entities.TipPool.fields.distributed_cents
        distinguishing_aspect: |
          A DIFFERENT CONSERVED QUANTITY (pooled tip cents, not payroll gross): after
          distribute, distributed_cents MUST exactly equal pooled_cents (10000) — the floor
          + waterfall-remainder allocation conserves every cent (no rounding drift), unlike
          instance 1's payroll-gross conservation.
        test_recipe:
          setup:
            - "CA worksite; two NON_EXEMPT tipped employees A (10h) and B (5h) on 2026-06-01; OPEN pool with A=6000, B=4000 cents (total 10000)."
          setup_api_calls:
            - call: "POST /employers"
              payload: { legal_name: "Acme" }
              as: PayrollAdmin
              captures: { emp_id: $.data.id }
            - call: "POST /wage-rulesets"
              payload: { employer_id: "${emp_id}", state_code: "CA", daily_ot_enabled: true }
              as: PayrollAdmin
            - call: "POST /worksites"
              payload: { employer_id: "${emp_id}", name: "CA site", state_code: "CA" }
              as: PayrollAdmin
              captures: { ws_ca: $.data.id }
            - call: "POST /employees"
