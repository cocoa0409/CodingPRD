          trigger:
            - call: "GET /wetlease/utilization-periods/${period_id}/settlement-preview"
              payload: {}
              as: BillingAdmin
          assert:
            - "response.data.mgh_effective_hours == 5.0000"
            - "response.data.provisional_credited_hours == 8.5000"
            - "response.data.provisional_gross_charge_cents == 4512000"
            - "response.data.final_credited_hours == 6.5000"
            - "response.data.final_overrun_hours == 1.5000"
            - "response.data.final_gross_charge_cents == 3216000"
            - "response.data.reliability_penalty_cents == 0"
            - "response.data.projected_final_charge_cents == 3216000"
            - "response.data.provisional_gross_charge_cents - response.data.final_gross_charge_cents == 1296000"
            - "UtilizationPeriod.${period_id}.status == OPEN (the preview persists nothing)"

