            - { call: "POST /termination-cases/${c_d}/begin-distributions", payload: {}, as: PlanAdministrator }
            - { call: "GET /participants/${p_d}", payload: {}, as: PlanAdministrator, captures: { p_d_v: "$.data.version" } }
            - { call: "POST /distribution-elections", payload: { participant_id: "${p_d}", election_method: DIRECT_ROLLOVER_IRA, expected_participant_version: "${p_d_v}" }, as: PlanAdministrator, captures: { e_d: "$.data.id" } }
            - { call: "POST /distribution-elections/${e_d}/accept", payload: {}, as: PlanAdministrator }
            - { call: "GET /distribution-elections/${e_d}/payouts", payload: {}, as: PlanAdministrator, captures: { pay_d: "$.data[0].id" } }
            - { call: "POST /payouts/${pay_d}/mark-cleared", payload: {}, as: Recordkeeper }
            - { call: "POST /termination-cases/${c_d}/advance-to-reconciliation", payload: {}, as: PlanAdministrator }
            - { call: "POST /fiduciary-log-entries", payload: { termination_case_id: "${c_d}", entry_type: CLOSURE_SIGNOFF, narrative: "All participants resolved, residual zero, notices and searches documented; case is ready for closure review." }, as: PlanAdministrator }
          trigger:
            - { call: "POST /termination-cases/${c_d}/close", payload: {}, as: IndependentFiduciary, as_user_id: "fid-1", captures: { err_dlr: "$.data.error_id" } }
          assert:
            - "DeterminationLetterRequest.${dlr_d}.status == FILED at trigger time"
