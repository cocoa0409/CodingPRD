            - "LicenseEntitlement.${eid}.available_units == 8       # 8 - 0 consumed"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_fiscal_on_install_activate
        grounds:
          - validations[priority=5]
          - validations[priority=17]
          - state_machines.InstallationRecord.PENDING_to_ACTIVE
        distinguishing_aspect: |
          Error-category pair {state (priority 5) vs business_fiscal (priority 17)}: an install that is
          already ACTIVE (state violation) AND whose entitlement is exhausted (fiscal violation) returns
          ERR_INVALID_STATE, not ERR_ENTITLEMENT_EXCEEDED — state outranks fiscal.
        test_recipe:
          setup:
            - "Entitlement entitled=1; one install activated (consumed=1, pool full); re-activate the same now-ACTIVE install."
          setup_api_calls:
            - call: "POST /assets/vendors"
              payload: { name: "SW Co", vendor_type: "SOFTWARE", support_email: "s@sw.com" }
              as: AssetManager
              captures: { vid: $.data.id }
            - call: "POST /assets/software-products"
              payload: { vendor_id: "${vid}", name: "EditorPro", license_model: "PER_SEAT" }
              as: AssetManager
              captures: { pid: $.data.id }
            - call: "POST /assets/entitlements"
              payload: { software_product_id: "${pid}", vendor_id: "${vid}", entitled_units: 1, unit_price_cents: 1000, term_start: "2025-01-01T00:00:00.000Z", term_end: "2025-12-31T00:00:00.000Z" }
              as: AssetManager
              captures: { eid: $.data.id }
            - call: "POST /assets/entitlements/${eid}/activate"
              payload: {}
              as: AssetManager
              captures: { ev: $.data.version }
            - call: "POST /assets/hardware"
              payload: { vendor_id: "${vid}", asset_tag: "TAG-PV", category: "DESKTOP", purchase_cost_cents: 100000, in_service_date: "2025-01-01T00:00:00.000Z" }
              as: AssetManager
              captures: { aid: $.data.id }
            - call: "POST /assets/installations"
              payload: { software_product_id: "${pid}", hardware_asset_id: "${aid}", license_entitlement_id: "${eid}", expected_entitlement_version: "${ev}" }
              as: AssetManager
              captures: { iid: $.data.id }
            - call: "POST /assets/installations/${iid}/activate"
              payload: {}
              as: AssetManager
          trigger:
            - call: "POST /assets/installations/${iid}/activate"
              payload: {}
              as: AssetManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE   # state (p5) wins over fiscal exhaustion (p17)"

      - name: segregation_beats_state_on_disposal_approve
        grounds:
          - validations[priority=5]
          - validations[priority=7]
          - state_machines.DisposalRequest.SUBMITTED_to_APPROVED
        distinguishing_aspect: |
          Different error-category pair {business_safety segregation (priority 7) vs state (priority 5)}:
          approving an already-APPROVED disposal AS the original submitter returns ERR_INVALID_STATE
          (state p5 is checked before the segregation safety check p7), distinguishing this priority
          conflict from the state-vs-fiscal pairing above.
        test_recipe:
          setup:
            - "Disposal SUBMITTED by mgr-1, APPROVED by co-1; then mgr-1 (the submitter) attempts approve again."
          setup_api_calls:
            - call: "POST /assets/vendors"
              payload: { name: "HW Corp", vendor_type: "HARDWARE", support_email: "s@hw.com" }
              as: AssetManager
              captures: { vid: $.data.id }
            - call: "POST /assets/hardware"
              payload: { vendor_id: "${vid}", asset_tag: "TAG-SG", category: "LAPTOP", purchase_cost_cents: 100000, in_service_date: "2025-01-01T00:00:00.000Z" }
              as: AssetManager
              captures: { aid: $.data.id }
            - call: "POST /assets/disposal-requests"
              payload: { hardware_asset_id: "${aid}", reason: "END_OF_LIFE" }
              as: AssetManager
              as_user_id: "mgr-1"
              captures: { dr: $.data.id }
            - call: "POST /assets/disposal-requests/${dr}/approve"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
          trigger:
            - call: "POST /assets/disposal-requests/${dr}/approve"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "mgr-1"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE   # state (p5, request already APPROVED) wins over segregation (p7)"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: entitlement_exceeded_at_exact_capacity
        grounds:
          - validations[priority=17]
          - calculations.required_core_units
          - entities.LicenseEntitlement.fields.consumed_units
          - state_machines.InstallationRecord.PENDING_to_ACTIVE
        distinguishing_aspect: |
          Numeric boundary on the entitlement seat metric at the /installations/{id}/activate endpoint:
          consumed=4, entitled=5 → activating +1 (==5) SUCCEEDS (<= allowed); consumed=5 → activating +1
          (==6) FAILS with ERR_ENTITLEMENT_EXCEEDED. The boundary is consumed_units + required <= entitled.
        test_recipe:
          setup:
            - "Entitlement entitled=5; 4 installs activated (consumed=4); a 5th PENDING install ready; a 6th PENDING install ready."
          setup_api_calls:
            - call: "POST /assets/vendors"
