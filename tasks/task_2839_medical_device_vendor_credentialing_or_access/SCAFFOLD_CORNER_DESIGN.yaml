            - "VendorRep.${rep_ada_id}.suspension_reason == CREDENTIAL_LAPSED and credential_posture == LAPSED"
            - "VendorRep.${rep_ada_id}.reinstated_at_utc == 2026-09-02T00:00:00Z and revoked_at_utc is still 2026-08-15T00:00:00Z"
            - "Vendor.${v_applv_id}.adjudicated_compliance_score == 94 (100 - W_LAPSED_REP 6 frozen by the sweep), scorecard_tier == TIER_PLATINUM, access_quota_in_effect == 6 and compliance_status == IN_GOOD_STANDING"

