            - call: "POST /health-indicators"
              payload: { cycle_id: "${cyc}", domain: "BEHAVIORAL_HEALTH", name: "Adult anxiety prevalence", benchmark_value: 12.0 }
              as: CommunityBenefitOfficer
              captures: { ind_b: $.data.id }
            - call: "POST /health-indicators/${ind_b}/data-points"
              payload: { population_subgroup: "OVERALL", source_type: "PUBLIC_DATASET", value: 12.0, collected_on: "2026-03-01" }
              as: DataSteward
            - call: "POST /health-indicators/${ind_b}/data-points"
              payload: { population_subgroup: "BLACK_NH", source_type: "PUBLIC_DATASET", value: 14.0, collected_on: "2026-03-01" }
              as: DataSteward
            - call: "POST /health-indicators/${ind_b}/data-points"
              payload: { population_subgroup: "WHITE_NH", source_type: "PUBLIC_DATASET", value: 10.0, collected_on: "2026-03-01" }
