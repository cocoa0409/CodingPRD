            - "Appointment.${ap_live}.chair_id is null after A1 goes out of service, yet its chair_minutes is still 240 and it still counts in the SCHEDULED numerator"
            - "InfusionCenter.${ctr}.available_chair_count == 0 after both patches"

      - name: rolling_six_window_caps_at_six_rows_and_renormalises_a_short_window
        claim_type: weighted_scoring
        grounds:
          - calculations.no_show_risk_score
          - calculations.no_show_risk_score.constants.ROLLING_WINDOW_SIZE
          - calculations.no_show_risk_score.constants.WEIGHT_STEP
          - endpoints[GET /patients/{id}/no-show-risk]
        distinguishing_aspect: |
          Two patients pin both ends of the weight vector. The seven-visit patient's oldest
          row is the only NO_SHOW and falls outside the six-row window, so the score is
          0.00 over considered_appointment_count 6 — a seventh weight of 10 over total_w
          385 would leak 2.60. The two-visit patient shows total_w is the sum over the rows
          actually present (100 + 85 == 185) and not the full 375: a single recent NO_SHOW
          scores 100/185*100 == 54.05 and lifts the tier to INTENSIVE, where a hard-coded
          375 would report 26.67 and ELEVATED.
        test_recipe:
          setup:
            - "One center, the standing drug, a MID template, and two patients each with an ACTIVE 12-cycle plan. No chairs or nurses are needed because injected history holds neither."
            - "Patient SEVEN receives seven terminal rows injected OUT of date order: the six COMPLETED visits 2026-06-08 .. 2026-07-13 first, then the NO_SHOW of 2026-06-01 last."
            - "Patient TWO receives a COMPLETED visit on 2026-07-13 and a NO_SHOW on 2026-07-20."
