# =============================================================================
# SCAFFOLD_CORNER_DESIGN — §1.9 Coverage Index for Non-Difficulty Tests
# Statutory Digital Performance Royalty Collection & Split
# Breadth sweep per references/claim-extraction-guide.md. Instances already
# exercised by §1.8 are emitted as excluded_because stubs (no test_recipe).
# =============================================================================

scaffold_corner_design:
  - section: entities
    instances:
      - name: create_licensee_with_required_fields_returns_201
        claim_type: creation
        grounds: ["entities.Licensee", "endpoints.'POST /licensees'"]
        distinguishing_aspect: "POST /licensees with all required fields returns 201, license_status DRAFT, version 1, server-minted id."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /licensees"
              payload: { legal_name: "NewCo", service_category: "BUSINESS_ESTABLISHMENT", notice_date: "2026-01-01T00:00:00Z" }
              as: Admin
              captures: { lic: $.data.id }
          trigger:
            - call: "GET /licensees/${lic}"
              payload: {}
              as: Admin
          assert:
            - "Licensee.${lic}.license_status == DRAFT"
            - "Licensee.${lic}.version == 1"
            - "Licensee.${lic}.id matches a UUID format with no type prefix"

      - name: create_licensee_missing_service_category_returns_invalid_request
        claim_type: required_fields
        grounds: ["entities.Licensee.fields.service_category", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required input service_category on POST /licensees is rejected with ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /licensees"
              payload: { legal_name: "NoCat" }
              as: Admin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REQUEST"

      - name: create_licensee_invalid_enum_service_category_rejected
        claim_type: type_constraints
        grounds: ["entities.Licensee.fields.service_category", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "service_category outside the declared enum is rejected with ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /licensees"
              payload: { legal_name: "BadCat", service_category: "INTERACTIVE", notice_date: "2026-01-01T00:00:00Z" }
              as: Admin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REQUEST"

      - name: licensee_computed_annual_minimum_fee_input_ignored_returns_201
        claim_type: computed_fields
        grounds: ["entities.Licensee.fields.annual_minimum_fee_cents"]
        distinguishing_aspect: "annual_minimum_fee_cents is computed from the effective schedule; any client-supplied value in the create payload is ignored."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /licensees"
              payload: { legal_name: "FirmCo", service_category: "NONSUBSCRIPTION_AD_SUPPORTED", notice_date: "2026-01-01T00:00:00Z", annual_minimum_fee_cents: 999999999 }
              as: Admin
              captures: { lic: $.data.id }
          assert:
            - "Licensee.${lic}.annual_minimum_fee_cents != 999999999 (input ignored)"

      - name: get_nonexistent_recording_returns_not_found
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]", "endpoints.'GET /recordings/{id}'"]
        distinguishing_aspect: "GET /recordings/{random-uuid} returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /recordings/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: Admin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_NOT_FOUND"

      - name: list_licensees_pagination_envelope
        claim_type: listing
        grounds: ["response_envelope", "endpoints.'GET /licensees'"]
        distinguishing_aspect: "GET /licensees returns response_type array with limit/offset/total_count/has_more per the fixed envelope; default limit is 10."
        test_recipe:
          setup: ["two licensees exist"]
          setup_api_calls:
            - call: "POST /licensees"
              payload: { legal_name: "P1", service_category: "NONSUBSCRIPTION_AD_SUPPORTED", notice_date: "2026-01-01T00:00:00Z" }
              as: Admin
            - call: "POST /licensees"
              payload: { legal_name: "P2", service_category: "NONSUBSCRIPTION_AD_SUPPORTED", notice_date: "2026-01-01T00:00:00Z" }
              as: Admin
          trigger:
            - call: "GET /licensees"
              payload: {}
              as: Admin
          assert:
            - "response contains meta.api_request_id and meta.api_request_timestamp"
            - "response_type == array; pagination fields present with total_count == 2 and has_more == false"

      - name: recording_duplicate_isrc_rejected
        claim_type: type_constraints
        grounds: ["entities.Recording.fields.isrc", "errors[ERR_DUPLICATE_ISRC]"]
        distinguishing_aspect: "Registering a second recording with an already-used ISRC fails ERR_DUPLICATE_ISRC (409)."
        test_recipe:
          setup: ["VERIFIED RO + FA; recording ISRC-DUP already registered"]
          setup_api_calls:
            - call: "POST /rights-owners"
              payload: { legal_name: "LD", contact_email: "ld@x.com" }
              as: PayeeAdmin
              captures: { ro: $.data.id }
            - call: "POST /rights-owners/${ro}/verify"
              payload: {}
              as: PayeeAdmin
            - call: "POST /artists"
              payload: { stage_name: "AD", contact_email: "ad2@x.com" }
              as: PayeeAdmin
              captures: { fa: $.data.id }
            - call: "POST /artists/${fa}/verify"
              payload: {}
              as: PayeeAdmin
            - call: "POST /recordings"
              payload: { isrc: "ISRC-DUP", track_title: "one", rights_owner_id: "${ro}", featured_artist_id: "${fa}" }
              as: Admin
          trigger:
            - call: "POST /recordings"
              payload: { isrc: "ISRC-DUP", track_title: "two", rights_owner_id: "${ro}", featured_artist_id: "${fa}" }
              as: Admin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_DUPLICATE_ISRC"

      - name: rate_schedule_end_before_start_rejected
        claim_type: type_constraints
        grounds: ["entities.RateSchedule.fields.effective_end", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "effective_end <= effective_start violates the declared constraint and returns ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /rate-schedules"
              payload: { proceeding_ref: "D-X", effective_start: "2026-06-01T00:00:00Z", effective_end: "2026-06-01T00:00:00Z", rate_per_performance_microcents: 2600, min_fee_cents: 100000, category: "NONSUBSCRIPTION_AD_SUPPORTED" }
              as: Admin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REQUEST"

      - name: play_line_zero_performances_rejected
        claim_type: type_constraints
        grounds: ["entities.PlayLine.fields.performance_count", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "performance_count == 0 violates the > 0 constraint; ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["licensee ACTIVE; DRAFT report exists"]
          setup_api_calls:
            - call: "POST /licensees"
              payload: { legal_name: "ZC", service_category: "NONSUBSCRIPTION_AD_SUPPORTED", notice_date: "2026-01-01T00:00:00Z" }
              as: Admin
              captures: { lic: $.data.id }
            - call: "POST /licensees/${lic}/activate"
              payload: {}
              as: Admin
            - call: "POST /usage-reports"
              payload: { licensee_id: "${lic}", period_start: "2026-01-01T00:00:00Z", period_end: "2026-01-31T00:00:00Z" }
              as: Licensee
              as_user_id: "${lic}"
              captures: { rep: $.data.id }
          trigger:
            - call: "POST /usage-reports/${rep}/play-lines"
              payload: { isrc: "X", track_title: "t", artist_name: "a", performance_count: 0 }
              as: Licensee
              as_user_id: "${lic}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_REQUEST"

      - name: unclaimed_pool_created_with_zero_accrual_defaults
        claim_type: defaults
        grounds: ["entities.UnclaimedPool.fields.accrued_unmatched_cents", "entities.UnclaimedPool.fields.campaign_count"]
        distinguishing_aspect: "New pool starts ACCRUING with accrued_unmatched_cents == 0 and campaign_count == 0."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /unclaimed-pools"
              payload: { period_start: "2026-01-01T00:00:00Z", period_end: "2026-12-31T00:00:00Z" }
              as: Admin
              captures: { pool: $.data.id }
          assert:
            - "UnclaimedPool.${pool}.pool_status == ACCRUING"
            - "UnclaimedPool.${pool}.accrued_unmatched_cents == 0"
            - "UnclaimedPool.${pool}.campaign_count == 0"

  - section: state_machines
    instances:
      - name: licensee_terminal_lockdown_after_termination
        claim_type: terminal_lockdown
        grounds: ["state_machines.Licensee"]
        distinguishing_aspect: "From TERMINATED no transition exists: suspend, reinstate, and terminate again all fail ERR_INVALID_STATE."
        test_recipe:
          setup: ["licensee L terminated straight from DRAFT (no in-flight artifacts)"]
          setup_api_calls:
            - call: "POST /licensees"
              payload: { legal_name: "TermCo", service_category: "NONSUBSCRIPTION_AD_SUPPORTED", notice_date: "2026-01-01T00:00:00Z" }
              as: Admin
              captures: { lic: $.data.id }
            - call: "POST /licensees/${lic}/terminate"
              payload: {}
              as: Admin
          trigger:
            - call: "POST /licensees/${lic}/suspend"
              payload: { reason: "post-mortem" }
              as: Admin
              captures: { err1: $.data.error_id }
            - call: "POST /licensees/${lic}/reinstate"
              payload: {}
              as: Admin
              captures: { err2: $.data.error_id }
          assert:
            - "err1 == ERR_INVALID_STATE"
            - "err2 == ERR_INVALID_STATE"
            - "Licensee.${lic}.license_status == TERMINATED"

      - name: suspend_reinstate_cycle_restores_submission
        claim_type: valid_transition
        grounds: ["state_machines.Licensee.ACTIVE_to_SUSPENDED", "state_machines.Licensee.SUSPENDED_to_ACTIVE"]
        distinguishing_aspect: "The ACTIVE -> SUSPENDED -> ACTIVE cycle is reachable via explicit admin actions and re-enables report submission."
        test_recipe:
          setup: ["licensee L ACTIVE under an EFFECTIVE NS-1 schedule"]
          setup_api_calls:
            - call: "POST /rate-schedules"
              payload: { proceeding_ref: "D-2025-01", effective_start: "2026-01-01T00:00:00Z", effective_end: "2026-12-31T00:00:00Z", rate_per_performance_microcents: 2600, min_fee_cents: 100000, category: "NONSUBSCRIPTION_AD_SUPPORTED" }
              as: Admin
              captures: { s: $.data.id }
            - call: "POST /rate-schedules/${s}/activate"
              payload: {}
              as: Admin
            - call: "POST /licensees"
              payload: { legal_name: "CycLic", service_category: "NONSUBSCRIPTION_AD_SUPPORTED", notice_date: "2026-01-01T00:00:00Z" }
              as: Admin
              captures: { lic: $.data.id }
            - call: "POST /licensees/${lic}/activate"
              payload: {}
              as: Admin
          trigger:
            - call: "POST /licensees/${lic}/suspend"
              payload: { reason: "review" }
              as: Admin
            - call: "POST /licensees/${lic}/reinstate"
              payload: {}
              as: Admin
            - call: "POST /usage-reports"
              payload: { licensee_id: "${lic}", period_start: "2026-01-01T00:00:00Z", period_end: "2026-01-31T00:00:00Z" }
              as: Licensee
              as_user_id: "${lic}"
              captures: { rep: $.data.id }
            - call: "POST /usage-reports/${rep}/play-lines"
              payload: { isrc: "NM-S", track_title: "s", artist_name: "s", performance_count: 5 }
              as: Licensee
              as_user_id: "${lic}"
            - call: "POST /usage-reports/${rep}/submit"
              payload: {}
              as: Licensee
              as_user_id: "${lic}"
          assert:
            - "Licensee.${lic}.license_status == ACTIVE"
            - "Licensee.${lic}.suspended_reason == null after reinstate"
            - "UsageReport.${rep}.report_status == SUBMITTED"

      - name: liability_write_off_is_terminal
        claim_type: terminal_lockdown
        grounds: ["state_machines.RoyaltyLiability"]
        distinguishing_aspect: "A WRITTEN_OFF liability cannot be billed or paid; both attempts fail ERR_INVALID_STATE."
        test_recipe:
          setup: ["licensee ACTIVE under NS-1; report ACCEPTED (10000 perfs); liability computed and BILLED"]
          setup_api_calls:
            - call: "POST /rate-schedules"
              payload: { proceeding_ref: "D-2025-01", effective_start: "2026-01-01T00:00:00Z", effective_end: "2026-12-31T00:00:00Z", rate_per_performance_microcents: 2600, min_fee_cents: 100000, category: "NONSUBSCRIPTION_AD_SUPPORTED" }
              as: Admin
              captures: { s: $.data.id }
            - call: "POST /rate-schedules/${s}/activate"
              payload: {}
              as: Admin
            - call: "POST /licensees"
              payload: { legal_name: "WOCo", service_category: "NONSUBSCRIPTION_AD_SUPPORTED", notice_date: "2026-01-01T00:00:00Z" }
              as: Admin
              captures: { lic: $.data.id }
            - call: "POST /licensees/${lic}/activate"
              payload: {}
              as: Admin
            - call: "POST /usage-reports"
              payload: { licensee_id: "${lic}", period_start: "2026-01-01T00:00:00Z", period_end: "2026-01-31T00:00:00Z" }
              as: Licensee
              as_user_id: "${lic}"
              captures: { rep: $.data.id }
            - call: "POST /usage-reports/${rep}/play-lines"
              payload: { isrc: "NM-W", track_title: "w", artist_name: "w", performance_count: 10000 }
              as: Licensee
              as_user_id: "${lic}"
            - call: "POST /usage-reports/${rep}/submit"
              payload: {}
              as: Licensee
              as_user_id: "${lic}"
              captures: { rep_v: $.data.version }
            - call: "POST /usage-reports/${rep}/accept"
              payload: {}
              as: RoyaltyOps
            - call: "POST /usage-reports/${rep}/compute-liability"
              payload: { expected_usage_report_version: "${rep_v}" }
              as: RoyaltyOps
              captures: { liab: $.data.id }
            - call: "POST /royalty-liabilities/${liab}/bill"
              payload: {}
              as: RoyaltyOps
            - call: "POST /royalty-liabilities/${liab}/write_off"
              payload: { reason: "uncollectible" }
              as: Admin
          trigger:
            - call: "POST /royalty-liabilities/${liab}/record_payment"
              payload: {}
              as: RoyaltyOps
              captures: { err: $.data.error_id }
          assert:
            - "RoyaltyLiability.${liab}.liability_status == WRITTEN_OFF"
            - "err == ERR_INVALID_STATE"

      - name: claim_reject_and_withdraw_terminal_states
        claim_type: invalid_transition
        grounds: ["state_machines.OwnershipClaim"]
        distinguishing_aspect: "withdraw is only valid from OPEN (fails from UNDER_REVIEW); resolve only from UNDER_REVIEW (fails from OPEN); both reject and withdraw are terminal."
        test_recipe:
          setup: ["VERIFIED RO1/RO2 + FA; ACTIVE recording owned by RO1; two claims C1 (left OPEN) and C2 (UNDER_REVIEW)"]
          setup_api_calls:
            - call: "POST /rights-owners"
              payload: { legal_name: "O1", contact_email: "o1@x.com" }
              as: PayeeAdmin
              captures: { ro1: $.data.id }
            - call: "POST /rights-owners/${ro1}/verify"
              payload: {}
              as: PayeeAdmin
            - call: "POST /rights-owners"
              payload: { legal_name: "O2", contact_email: "o2@x.com" }
              as: PayeeAdmin
              captures: { ro2: $.data.id }
            - call: "POST /rights-owners/${ro2}/verify"
              payload: {}
              as: PayeeAdmin
            - call: "POST /artists"
              payload: { stage_name: "OA", contact_email: "oa@x.com" }
              as: PayeeAdmin
              captures: { fa: $.data.id }
            - call: "POST /artists/${fa}/verify"
              payload: {}
              as: PayeeAdmin
            - call: "POST /recordings"
              payload: { isrc: "ISRC-OC", track_title: "oc", rights_owner_id: "${ro1}", featured_artist_id: "${fa}" }
              as: Admin
              captures: { rec: $.data.id }
            - call: "POST /recordings/${rec}/ownership-claims"
              payload: { claimant_type: "RIGHTS_OWNER", claimant_id: "${ro2}", claimed_share_pct: 50 }
              as: PayeeAdmin
              captures: { c1: $.data.id }
          trigger:
            - call: "POST /ownership-claims/${c1}/resolve"
              payload: { outcome: "REJECTED", resolution_note: "premature" }
              as: PayeeAdmin
              captures: { err1: $.data.error_id }
            - call: "POST /ownership-claims/${c1}/withdraw"
              payload: {}
              as: PayeeAdmin
            - call: "POST /ownership-claims/${c1}/start_review"
              payload: {}
              as: PayeeAdmin
              captures: { err2: $.data.error_id }
          assert:
            - "err1 == ERR_INVALID_STATE (resolve requires UNDER_REVIEW)"
            - "OwnershipClaim.${c1}.claim_status == WITHDRAWN after withdraw from OPEN"
            - "err2 == ERR_INVALID_STATE (terminal lockdown)"

      - name: rate_proceeding_publish_before_decide_rejected
        claim_type: invalid_transition
        grounds: ["state_machines.RateProceeding", "errors[ERR_RATE_PROCEEDING_INVALID]"]
        distinguishing_aspect: "publish on an OPEN proceeding fails; close on DECIDED (skipping publish) fails."
        test_recipe:
          setup: ["one OPEN proceeding"]
          setup_api_calls:
            - call: "POST /rate-proceedings"
              payload: { docket_no: "DKT-X" }
              as: StatutoryBoard
              captures: { proc: $.data.id }
          trigger:
            - call: "POST /rate-proceedings/${proc}/publish"
              payload: {}
              as: StatutoryBoard
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_RATE_PROCEEDING_INVALID"
            - "RateProceeding.${proc}.proceeding_status == OPEN"

      - name: pool_expire_before_window_rejected
        claim_type: precondition_enforcement
        grounds: ["state_machines.UnclaimedPool.ACCRUING_to_EXPIRED", "errors[ERR_POOL_NOT_EXPIRABLE]", "validations[priority=21]"]
        distinguishing_aspect: "expire at a clock before period_end + 365 days fails ERR_POOL_NOT_EXPIRABLE; after moving the clock past the window it succeeds."
        test_recipe:
          setup: ["pool P (2026-01-01..2026-12-31) ACCRUING; clock at 2026-09-01"]
          setup_api_calls:
            - call: "POST /unclaimed-pools"
              payload: { period_start: "2026-01-01T00:00:00Z", period_end: "2026-12-31T00:00:00Z" }
              as: Admin
              captures: { pool: $.data.id }
          trigger:
            - call: "POST /unclaimed-pools/${pool}/expire"
              payload: {}
              as: Admin
              captures: { err: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2028-01-01T00:00:00Z" }
              as: Admin
            - call: "POST /unclaimed-pools/${pool}/expire"
              payload: {}
              as: Admin
          assert:
            - "err == ERR_POOL_NOT_EXPIRABLE (clock 2026-09-01 <= period_end + 365d)"
            - "UnclaimedPool.${pool}.pool_status == EXPIRED after clock advance to 2028-01-01"

      - name: pool_complete_campaign_requires_matching_campaign_state
        claim_type: precondition_enforcement
        grounds: ["state_machines.UnclaimedPool", "errors[ERR_CAMPAIGN_NOT_OPEN]"]
        distinguishing_aspect: "complete_campaign on an ACCRUING pool (never started) fails ERR_CAMPAIGN_NOT_OPEN."
        test_recipe:
          setup: ["pool P ACCRUING with accrual 0"]
          setup_api_calls:
            - call: "POST /unclaimed-pools"
              payload: { period_start: "2026-01-01T00:00:00Z", period_end: "2026-12-31T00:00:00Z" }
              as: Admin
              captures: { pool: $.data.id }
          trigger:
            - call: "POST /unclaimed-pools/${pool}/complete_campaign"
              payload: {}
              as: MatchingAgent
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_CAMPAIGN_NOT_OPEN"

      - name: play_line_mutation_locked_after_submit
        claim_type: invalid_transition
        grounds: ["errors[ERR_PLAY_LINE_IMMUTABLE]", "state_machines.UsageReport.DRAFT_to_SUBMITTED"]
        distinguishing_aspect: "Adding or deleting play lines on a SUBMITTED report fails ERR_PLAY_LINE_IMMUTABLE."
        test_recipe:
          setup: ["licensee ACTIVE under NS-1; report SUBMITTED with one line"]
          setup_api_calls:
            - call: "POST /rate-schedules"
              payload: { proceeding_ref: "D-2025-01", effective_start: "2026-01-01T00:00:00Z", effective_end: "2026-12-31T00:00:00Z", rate_per_performance_microcents: 2600, min_fee_cents: 100000, category: "NONSUBSCRIPTION_AD_SUPPORTED" }
              as: Admin
              captures: { s: $.data.id }
            - call: "POST /rate-schedules/${s}/activate"
              payload: {}
              as: Admin
            - call: "POST /licensees"
              payload: { legal_name: "PLCo", service_category: "NONSUBSCRIPTION_AD_SUPPORTED", notice_date: "2026-01-01T00:00:00Z" }
              as: Admin
              captures: { lic: $.data.id }
            - call: "POST /licensees/${lic}/activate"
              payload: {}
              as: Admin
            - call: "POST /usage-reports"
              payload: { licensee_id: "${lic}", period_start: "2026-01-01T00:00:00Z", period_end: "2026-01-31T00:00:00Z" }
              as: Licensee
              as_user_id: "${lic}"
              captures: { rep: $.data.id }
            - call: "POST /usage-reports/${rep}/play-lines"
              payload: { isrc: "NM-PL", track_title: "pl", artist_name: "pl", performance_count: 5 }
              as: Licensee
              as_user_id: "${lic}"
            - call: "POST /usage-reports/${rep}/submit"
              payload: {}
              as: Licensee
              as_user_id: "${lic}"
          trigger:
            - call: "POST /usage-reports/${rep}/play-lines"
              payload: { isrc: "NM-PL2", track_title: "pl2", artist_name: "pl2", performance_count: 5 }
              as: Licensee
              as_user_id: "${lic}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_PLAY_LINE_IMMUTABLE"

      - name: batch_cancel_only_from_planned
        claim_type: invalid_transition
        grounds: ["state_machines.DistributionBatch", "errors[ERR_BATCH_NOT_CANCELLABLE]"]
        distinguishing_aspect: "Cancelling an EXECUTED batch fails ERR_BATCH_NOT_CANCELLABLE."
        test_recipe:
          setup: ["full pipeline executed: licensee ACTIVE, report ACCEPTED, liability PAID, pool exists, batch EXECUTED"]
          setup_api_calls:
            - call: "POST /rate-schedules"
              payload: { proceeding_ref: "D-2025-01", effective_start: "2026-01-01T00:00:00Z", effective_end: "2026-12-31T00:00:00Z", rate_per_performance_microcents: 2600, min_fee_cents: 100000, category: "NONSUBSCRIPTION_AD_SUPPORTED" }
              as: Admin
              captures: { s: $.data.id }
            - call: "POST /rate-schedules/${s}/activate"
              payload: {}
              as: Admin
            - call: "POST /licensees"
              payload: { legal_name: "CanCo", service_category: "NONSUBSCRIPTION_AD_SUPPORTED", notice_date: "2026-01-01T00:00:00Z" }
              as: Admin
              captures: { lic: $.data.id }
            - call: "POST /licensees/${lic}/activate"
              payload: {}
              as: Admin
            - call: "POST /usage-reports"
