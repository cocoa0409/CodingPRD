  - rule_id: combinatorial_formula
    instances:

      - name: conflict_score_financial_carveout_beats_a_larger_but_decayable_disclosure
        grounds:
          - calculations.panelist_conflict_score
          - entities.PanelistAppointment.fields.conflict_score
          - entities.PanelistAppointment.fields.conflict_factors
          - state_machines.PanelistAppointment.NOMINATED_to_CONFLICTED
          - state_machines.PanelistAppointment.NOMINATED_to_ACCEPTED
        distinguishing_aspect: |
          Two screenings on the SAME seat at the SAME staleness of 36 months invert the ordering of
          their raw scores: a lone financial interest (raw 60) yields conflict_score 60.00 and
          CONFLICTED because the financial term is carved out before the decay multiplier and added
          back at full weight, while prior representation plus same firm (raw 80, a strictly LARGER
          raw total) yields 20.00 and ACCEPTED because the whole 80 is multiplied by the floored decay
          of 0.25 - so the formula's carve-out step, not the magnitude of the disclosure, decides the
          seat.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z throughout."
            - "Registrar IANA-4004 ACTIVE; domain carveout.example under it."
            - "Complainant Carve SA (country_code FR), mutual_jurisdiction US, remedy TRANSFER, panel_election SINGLE."
            - "150000 paid by COMPLAINANT, compliance cleared by cm-002, verification answered lock_applied true, EMAIL notification delivered, respondent files a response WITHOUT electing a three-member panel."
            - "Panelist Bauer (DE) and panelist Rossi (IT) are both on the roster with max_overlapping_engagements 5 and no blackout."
            - "Case is PANEL_APPOINTMENT with the SOLE seat held by a NOMINATED row for Bauer."
          setup_api_calls:
            - call: "POST /udrp/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProviderAdmin
            - call: "POST /udrp/registrars"
              payload: { name: "Regis Four", iana_id: "IANA-4004", contact_email: "abuse@regisfour.example", verification_response_hours: 48 }
              as: ProviderAdmin
              captures: { reg_id: "$.data.id" }
            - call: "POST /udrp/domains"
              payload: { domain_name: "carveout.example", registrar_id: "${reg_id}", registrant_name_public: "Carve Holder", registrant_email_public: "holder@proxy.example", registration_date: "2023-02-11T00:00:00Z", expiry_date: "2027-02-11T00:00:00Z" }
              as: ProviderAdmin
              captures: { dom_id: "$.data.id" }
            - call: "POST /udrp/complainants"
              payload: { legal_name: "Carve SA", country_code: "FR", email: "ip@carve.example" }
              as: CaseManager
              as_user_id: "cm-001"
              captures: { cpl_id: "$.data.id" }
            - call: "POST /udrp/cases"
              payload: { complainant_id: "${cpl_id}", domain_id: "${dom_id}", mutual_jurisdiction: "US", remedy_requested: "TRANSFER", panel_election: "SINGLE" }
              as: Complainant
              as_user_id: "${cpl_id}"
              captures: { case_id: "$.data.id" }
            - call: "POST /udrp/cases/${case_id}/grounds"
              payload: { ground_type: "TRADEMARK_RIGHTS", assertion_text: "CARVE is a registered mark for software services.", evidence_count: 2, similarity_claim: "IDENTICAL" }
              as: Complainant
              as_user_id: "${cpl_id}"
            - call: "POST /udrp/cases/${case_id}/grounds"
              payload: { ground_type: "NO_LEGITIMATE_INTEREST", assertion_text: "No authorisation was ever granted to the registrant.", evidence_count: 1 }
              as: Complainant
              as_user_id: "${cpl_id}"
            - call: "POST /udrp/cases/${case_id}/grounds"
              payload: { ground_type: "BAD_FAITH", assertion_text: "The domain resolves to a pay-per-click farm targeting the mark.", evidence_count: 2 }
              as: Complainant
              as_user_id: "${cpl_id}"
            - call: "POST /udrp/cases/${case_id}/fee-transactions"
