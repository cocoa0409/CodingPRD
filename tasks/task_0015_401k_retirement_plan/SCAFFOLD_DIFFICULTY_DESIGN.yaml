      - name: loan_disburse_then_repay_preserves_outstanding_loan_principal
        grounds:
          - state_machines.Loan.REQUESTED_to_DISBURSED
          - state_machines.Loan.DISBURSED_to_REPAID
          - entities.Participant.fields.outstanding_loan_principal_cents
        distinguishing_aspect: |
          Different conserved quantity: Participant.outstanding_loan_principal_cents.
          Invariant: outstanding_loan_principal_cents_pre_disburse ==
          outstanding_loan_principal_cents_post_repay (both 0). The
          disburse/repay pair returns the named quantity to its starting value
          with no drift.
        test_recipe:
          setup:
            - "Clock at 2026-06-15."
            - "ACTIVE plan; ENROLLED participant with seeded balances; one REQUESTED Loan principal=10000 cents."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-15T00:00:00Z" }
              as: PlanAdmin
            - call: "POST /plans"
              payload: { name: "Inv2", plan_year: 2026, match_formula: "TIERED", vesting_schedule: "GRADED_6" }
              as: PlanAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /plans/${plan_id}/activate"
              payload: {}
              as: PlanAdmin
            - call: "POST /participants"
              payload: { plan_id: "${plan_id}", full_name: "O", date_of_birth: "1980-06-15T00:00:00Z", hire_date: "2018-06-15T00:00:00Z", annual_compensation_cents: 50000000, deferral_rate_bps: 400 }
              as: PlanAdmin
              captures: { p_id: $.data.id }
            - call: "POST /participants/${p_id}/enroll"
              payload: {}
              as: PlanAdmin
            - call: "POST /contribution-periods"
              payload: { participant_id: "${p_id}", period_end_date: "2026-06-15T00:00:00Z", gross_compensation_cents: 10000000 }
              as: PlanAdmin
              captures: { cp_id: $.data.id }
            - call: "POST /contribution-periods/${cp_id}/close"
              payload: {}
              as: PlanAdmin
            - call: "POST /loans"
              payload: { participant_id: "${p_id}", principal_cents: 10000, term_months: 12, annual_interest_rate_bps: 700 }
              as: PlanAdmin
              captures: { loan_id: $.data.id }
            - call: "GET /participants/${p_id}"
              payload: {}
              as: PlanAdmin
              captures: { pre_outstanding: $.data.outstanding_loan_principal_cents }
          trigger:
            - call: "POST /loans/${loan_id}/disburse"
              payload: {}
              as: PlanAdmin
            - call: "GET /participants/${p_id}"
              payload: {}
              as: PlanAdmin
              captures: { mid_outstanding: $.data.outstanding_loan_principal_cents }
            - call: "POST /loans/${loan_id}/repay"
              payload: { amount_cents: 10000 }
              as: PlanAdmin
            - call: "GET /participants/${p_id}"
              payload: {}
              as: PlanAdmin
              captures: { post_outstanding: $.data.outstanding_loan_principal_cents }
          assert:
            - "${pre_outstanding} == 0"
            - "${mid_outstanding} == 10000"
            - "${post_outstanding} == 0"
            - "Loan.${loan_id}.status == REPAID"
            - "Loan.${loan_id}.outstanding_principal_cents == 0"
