            - "SafetyEvent.${ev17}.status is still INCIDENT_REVIEW"

      - name: complete_with_handoff_complete_requires_a_signed_handoff
        claim_type: guarded_transitions
        grounds:
          - endpoints.POST_observation_sitter_assignments__id_complete
          - errors.ERR_HANDOFF_NOT_SIGNED
          - state_machines.SitterAssignment.documentation_status
        distinguishing_aspect: "The watch dimension's ON_WATCH -> COMPLETED edge is guarded by the OTHER dimension of the same row: completion_reason HANDOFF_COMPLETE is legal only while documentation_status is HANDOFF_SIGNED, so a drafted-but-uncountersigned handoff must fail with 422 and leave the watch open."
        test_recipe:
          setup:
            - "One unit budget 250000, one admitted patient age 60, one ACTIVE FALL-only order."
            - "Two sitters at 2000 cents/hour: outgoing 08:00Z -> 16:00Z (ON_WATCH from 08:00Z) and incoming 16:00Z -> 2026-08-02T00:00Z (SCHEDULED)."
            - "A handoff has been drafted by the outgoing sitter but never countersigned, so documentation_status is HANDOFF_DRAFTED."
          setup_api_calls:
            - call: "POST /observation/units"
              payload: { unit_code: "UNIT-C18", name: "Corner Unit Eighteen", observation_cost_budget_cents: 250000, video_monitoring_enabled: false }
