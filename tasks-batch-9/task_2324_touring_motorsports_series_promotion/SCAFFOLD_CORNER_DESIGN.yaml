  - section: state_machines
    instances:
      - name: corner_venue_booking_initial_state_and_terminal_lockdown
        claim_type: Initial State
        grounds:
          - state_machines.VenueBooking
          - state_machines.VenueBooking.TERMS_PROPOSED_to_WITHDRAWN
          - errors.ERR_INVALID_STATE_TRANSITION
        distinguishing_aspect: "A booking is born in TERMS_PROPOSED with negotiation_round 1 and terms_source PROMOTER; WITHDRAWN is terminal, so after withdrawal every one of counter, revise and accept must be refused from that same row."
        test_recipe:
          setup:
            - "A Season and a Venue; one booking created and immediately withdrawn"
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "2026-27 Thunder Tour", year: 2026, season_start_date: "2026-10-01", season_end_date: "2027-03-31", total_marketing_budget_cents: 40000000 }
              as: SeriesPromoter
              captures: { season: "$.data.id" }
            - call: "POST /venues"
              payload: { name: "Atlanta Dome", market_code: "ATL", city: "Atlanta", state_code: "GA", seat_capacity: 9000, floor_type: "DIRT", catch_fence_max_height_ft: 10, medical_bay_count: 2, load_in_hours_required: 10, staging_bay_count: 4, turnaround_hours: 12 }
              as: SeriesPromoter
              captures: { venue_atl: "$.data.id" }
          trigger:
            - call: "POST /venue-bookings"
              payload: { season_id: "${season}", venue_id: "${venue_atl}", tour_date: "2026-11-14", rental_base_cents: 3000000, revenue_share_pct: 0.12, per_ticket_facility_fee_cents: 350, load_in_start_utc: "2026-11-13T14:00:00Z", tear_down_end_utc: "2026-11-15T06:00:00Z" }
              as: SeriesPromoter
              captures: { b_atl: "$.data.id" }
            - call: "POST /venue-bookings/${b_atl}/withdraw"
              payload: { reason: "date released back to the building" }
              as: SeriesPromoter
            - call: "POST /venue-bookings/${b_atl}/accept"
              payload: {}
              as: SeriesPromoter
              captures: { err_accept: "$.data.error_id" }
            - call: "POST /venue-bookings/${b_atl}/counter"
              payload: { rental_base_cents: 3200000, revenue_share_pct: 0.13, per_ticket_facility_fee_cents: 360 }
              as: VenueManager
              as_user_id: "${venue_atl}"
              captures: { err_counter: "$.data.error_id" }
            - call: "POST /venue-bookings/${b_atl}/revise"
              payload: { rental_base_cents: 2900000, revenue_share_pct: 0.11, per_ticket_facility_fee_cents: 340 }
              as: SeriesPromoter
              captures: { err_revise: "$.data.error_id" }
          assert:
            - "after trigger call 1: VenueBooking.${b_atl}.state == TERMS_PROPOSED, negotiation_round == 1, terms_source == PROMOTER, confirmed_at is null"
            - "after trigger call 2: VenueBooking.${b_atl}.state == WITHDRAWN with withdraw_reason == \"date released back to the building\""
            - "trigger calls 3, 4 and 5 each return HTTP 409 with ERR_INVALID_STATE_TRANSITION: ${err_accept}, ${err_counter} and ${err_revise} are all ERR_INVALID_STATE_TRANSITION"
            - "no TourStop was ever created for ${b_atl}: GET /tour-stops with venue_booking_id ${b_atl} returns an empty list"
            - "VenueBooking.${b_atl}.negotiation_round is still 1 after the refused counter, so a rejected transition leaves no trace"

      - name: corner_idempotent_retry_of_pay_is_refused_on_the_second_attempt
