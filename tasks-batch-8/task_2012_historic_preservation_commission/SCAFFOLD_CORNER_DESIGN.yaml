        grounds: ["entities.Application.fields.guideline_set_id", "errors[ERR_GUIDELINE_SET_SUPERSEDED]", "state_machines.DesignGuidelineSet"]
        distinguishing_aspect: "Acceptance pins the ADOPTED guideline set; adopting a newer set before decision blocks decide (ERR_GUIDELINE_SET_SUPERSEDED) unless guideline_override_ack=true, which re-pins to the new set."
        test_recipe:
          setup: ["district with GS-1 ADOPTED; STAFF-track application ACCEPTED (pinned GS-1); GS-2 then adopted, superseding GS-1"]
          setup_api_calls:
            - call: "POST /preservation/districts"
