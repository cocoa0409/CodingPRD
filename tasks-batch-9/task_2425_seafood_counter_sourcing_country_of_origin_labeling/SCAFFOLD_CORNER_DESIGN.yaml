          setup:
            - "logical clock advanced to 2026-08-01T14:00:00Z"
            - "Atlantic Cod SupplierLot cased into slot 2"
            - "two breaching readings on slot 2 four hours apart (09:00 at 5.0 C, 13:00 at 4.9 C), giving one OPEN excursion with exposure_minutes 240 and severity CRITICAL"
            - "the lot is therefore HELD and the Counter posture is RESTRICTED"
