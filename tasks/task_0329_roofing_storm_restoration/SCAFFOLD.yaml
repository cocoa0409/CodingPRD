    path: "/jobs"
    description: "Create a storm-restoration job (lead)"
    roles: [FieldAdjuster]
    code: 201
    input: [customer_name, property_address, peril, assigned_estimator_id, "insurance_carrier?", "retainage_pct?"]
    output: Job
    side_effects: ["status=LEAD; ledger fields initialized to 0; version=1"]

  - method: GET
    path: "/jobs/{id}"
    description: "Get a job with computed ledger fields"
    roles: [FieldAdjuster, Estimator, ProductionManager]
    code: 200
    input: []
    output: Job
    side_effects: []

  - method: GET
    path: "/jobs"
    description: "List jobs (paginated)"
    roles: [FieldAdjuster, Estimator, ProductionManager]
    code: 200
    input: ["status?", "assigned_estimator_id?"]
    output: Job[]
    side_effects: []

  - method: POST
    path: "/jobs/{id}/mark-inspected"
    description: "Advance LEAD -> INSPECTED"
    roles: [FieldAdjuster]
    code: 200
    input: []
    output: Job
    side_effects: ["status -> INSPECTED; version+1"]

  - method: POST
    path: "/jobs/{id}/mark-estimated"
    description: "Advance INSPECTED -> ESTIMATED"
    roles: [Estimator]
    code: 200
    input: []
    output: Job
    side_effects: ["status -> ESTIMATED; version+1"]

  - method: POST
    path: "/jobs/{id}/contract"
    description: "Bind a finalized estimate and advance ESTIMATED -> CONTRACTED"
    roles: [Estimator]
    code: 200
    input: [estimate_id]
    output: Job
    side_effects:
      - "status -> CONTRACTED; bound_estimate_id set; other FINALIZED estimates -> SUPERSEDED"
      - "contract_value_cents = bound estimate final_total_cents; remaining_billable_cents set; version+1"

  - method: POST
    path: "/jobs/{id}/start-production"
    description: "Advance CONTRACTED -> IN_PRODUCTION"
    roles: [ProductionManager]
    code: 200
    input: []
    output: Job
    side_effects: ["status -> IN_PRODUCTION; version+1"]

  - method: POST
    path: "/jobs/{id}/complete"
    description: "Advance IN_PRODUCTION -> COMPLETED"
    roles: [ProductionManager]
    code: 200
    input: []
    output: Job
    side_effects: ["status -> COMPLETED; version+1"]

  - method: POST
    path: "/jobs/{id}/lose"
    description: "Mark a pre-contract job LOST"
    roles: [FieldAdjuster]
    code: 200
    input: [lost_reason]
    output: Job
    side_effects: ["status -> LOST; version+1"]

  # ---- Inspection ----
  - method: POST
    path: "/inspections"
    description: "Schedule an inspection (DAMAGE_ASSESSMENT or PERMIT_FINAL)"
    roles: [FieldAdjuster]
    code: 201
    input: [job_id, kind, scheduled_start, scheduled_end, "permit_id?"]
    output: Inspection
    side_effects: ["status=SCHEDULED; PERMIT_FINAL enforces buffer (§1.3 permit_inspection_buffer)"]

  - method: GET
    path: "/inspections/{id}"
    description: "Get an inspection"
    roles: [FieldAdjuster, Estimator, ProductionManager]
    code: 200
    input: []
