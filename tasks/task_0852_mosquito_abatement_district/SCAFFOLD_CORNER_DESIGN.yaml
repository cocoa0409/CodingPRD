        distinguishing_aspect: "With the clock at 2026-06-01, a collection dated 2026-05-24 is 8 days old and SUBMIT is refused with ERR_COLLECTION_WINDOW_EXPIRED, while one dated 2026-05-25 is exactly 7 days old and submits successfully."
        test_recipe:
