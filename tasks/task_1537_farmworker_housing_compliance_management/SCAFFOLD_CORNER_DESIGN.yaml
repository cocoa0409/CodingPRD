# =============================================================================
# Section 1.9: Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# =============================================================================
scaffold_corner_design:
  # ===========================================================================
  - section: entities
    instances:
      - name: create_site_returns_defaults
        claim_type: creation_defaults
        grounds: [entities.HousingSite.fields.status, entities.HousingSite.fields.compliance_posture]
        distinguishing_aspect: "A created site starts DRAFT with posture NORMAL, version 1, and a server-minted bare-UUID id."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - { call: "POST /housing-sites", payload: { name: "Dawn Site", state_code: "CA" }, as: OperatorAdmin, captures: { sid: $.data.id, st: $.data.status, po: $.data.compliance_posture, v: $.data.version } }
          trigger: []
          assert:
            - "st == DRAFT and po == NORMAL and v == 1"
            - "HousingSite.${sid}.id matches the bare UUID shape with no type prefix"

      - name: create_site_missing_state_code_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.HousingSite.fields.state_code, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required input state_code yields 400 ERR_INVALID_REQUEST and persists nothing."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /housing-sites", payload: { name: "No State" }, as: OperatorAdmin, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_REQUEST with HTTP 400"

      - name: get_site_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_SITE_NOT_FOUND]"]
        distinguishing_aspect: "Reading a random UUID yields ERR_SITE_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /housing-sites/00000000-0000-4000-8000-000000000000", as: OperatorAdmin, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_SITE_NOT_FOUND with HTTP 404"

      - name: list_sites_pagination_defaults
        claim_type: listing_pagination
        grounds: [response_envelope]
        distinguishing_aspect: "With 12 sites, the default list page returns 10 rows with has_more true; limit/offset paging walks the remainder."
        test_recipe:
          setup: ["12 sites S00..S11 exist"]
          setup_api_calls:
            - { call: "POST /housing-sites", payload: { name: "S00", state_code: "CA" }, as: OperatorAdmin }
            - { call: "POST /housing-sites", payload: { name: "S01", state_code: "CA" }, as: OperatorAdmin }
            - { call: "POST /housing-sites", payload: { name: "S02", state_code: "CA" }, as: OperatorAdmin }
            - { call: "POST /housing-sites", payload: { name: "S03", state_code: "CA" }, as: OperatorAdmin }
            - { call: "POST /housing-sites", payload: { name: "S04", state_code: "CA" }, as: OperatorAdmin }
            - { call: "POST /housing-sites", payload: { name: "S05", state_code: "CA" }, as: OperatorAdmin }
            - { call: "POST /housing-sites", payload: { name: "S06", state_code: "CA" }, as: OperatorAdmin }
            - { call: "POST /housing-sites", payload: { name: "S07", state_code: "CA" }, as: OperatorAdmin }
            - { call: "POST /housing-sites", payload: { name: "S08", state_code: "CA" }, as: OperatorAdmin }
            - { call: "POST /housing-sites", payload: { name: "S09", state_code: "CA" }, as: OperatorAdmin }
            - { call: "POST /housing-sites", payload: { name: "S10", state_code: "CA" }, as: OperatorAdmin }
            - { call: "POST /housing-sites", payload: { name: "S11", state_code: "CA" }, as: OperatorAdmin }
          trigger:
            - { call: "GET /housing-sites", as: OperatorAdmin }
            - { call: "GET /housing-sites", payload: { limit: 10, offset: 10 }, as: OperatorAdmin }
          assert:
            - "first call: response_type array, data length == 10, total_count == 12, has_more == true (defaults limit 10 / offset 0)"
            - "second call: data length == 2, has_more == false"

      - name: member_is_minor_computed_from_clock
        claim_type: computed_fields
        grounds: [entities.HouseholdMember.fields.is_minor]
        distinguishing_aspect: "is_minor derives from date_of_birth vs the logical clock: born 2015-06-01 is a minor at 2026-08-01; born 2008-08-01 turns exactly 18 and is NOT a minor (strict < 18)."
        test_recipe:
          setup: ["Household H exists"]
          setup_api_calls:
            - { call: "POST /households", payload: { head_of_household_name: "Fam M", annual_family_income_cents: 6000000, ag_work_verified: true }, as: IntakeCoordinator, captures: { hh_id: $.data.id } }
          trigger:
            - { call: "POST /household-members", payload: { household_id: "${hh_id}", full_name: "Kid", date_of_birth: "2015-06-01", relationship: "CHILD" }, as: IntakeCoordinator, captures: { m1: $.data.is_minor } }
            - { call: "POST /household-members", payload: { household_id: "${hh_id}", full_name: "Adult", date_of_birth: "2008-08-01", relationship: "CHILD" }, as: IntakeCoordinator, captures: { m2: $.data.is_minor } }
            - { call: "GET /households/${hh_id}", as: IntakeCoordinator, captures: { mc: $.data.member_count, nc: $.data.minor_count } }
          assert:
            - "m1 == true (age 11 at the 2026-08-01 default clock)"
            - "m2 == false (exactly 18 — the boundary is strict)"
            - "mc == 2 and nc == 1"

      - name: unit_computed_fields_default_on_create
        claim_type: computed_fields
        grounds: [entities.HousingUnit.fields.current_occupancy, entities.HousingUnit.fields.under_pest_exclusion]
        distinguishing_aspect: "A new unit starts REGISTERED with occupancy 0, both habitability scores 0, and no pest exclusion."
        test_recipe:
          setup: ["site + building exist"]
          setup_api_calls:
            - { call: "POST /housing-sites", payload: { name: "S", state_code: "CA" }, as: OperatorAdmin, captures: { site_id: $.data.id } }
            - { call: "POST /buildings", payload: { site_id: "${site_id}", name: "B1" }, as: OperatorAdmin, captures: { bld_id: $.data.id } }
          trigger:
            - { call: "POST /housing-units", payload: { building_id: "${bld_id}", site_id: "${site_id}", unit_code: "U1", unit_type: "FAMILY_UNIT", max_occupancy: 4, monthly_rent_cents: 90000 }, as: OperatorAdmin, captures: { st: $.data.status, occ: $.data.current_occupancy, cum: $.data.habitability_score_cumulative, wc: $.data.habitability_score_worst_case, pe: $.data.under_pest_exclusion } }
          assert:
            - "st == REGISTERED, occ == 0, cum == 0, wc == 0, pe == false"

      - name: system_field_input_ignored_on_create
        claim_type: system_fields
        grounds: [entities.HousingSite.fields.status]
        distinguishing_aspect: "Client-supplied status/version/id on create are ignored: the server mints its own values."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /housing-sites", payload: { name: "S", state_code: "CA", status: "OPEN", version: 99 }, as: OperatorAdmin, captures: { st: $.data.status, v: $.data.version } }
          assert:
            - "st == DRAFT and v == 1 — client-supplied system fields are ignored, not honored"

      - name: invalid_enum_unit_type_rejected
        claim_type: type_constraints
        grounds: [entities.HousingUnit.fields.unit_type, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "unit_type outside {FAMILY_UNIT, SEASONAL_DORM} is a 400."
        test_recipe:
          setup: ["site + building exist"]
          setup_api_calls:
            - { call: "POST /housing-sites", payload: { name: "S", state_code: "CA" }, as: OperatorAdmin, captures: { site_id: $.data.id } }
            - { call: "POST /buildings", payload: { site_id: "${site_id}", name: "B1" }, as: OperatorAdmin, captures: { bld_id: $.data.id } }
          trigger:
            - { call: "POST /housing-units", payload: { building_id: "${bld_id}", site_id: "${site_id}", unit_code: "U1", unit_type: "LUXURY", max_occupancy: 4, monthly_rent_cents: 90000 }, as: OperatorAdmin, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_REQUEST with HTTP 400"

      - name: household_ag_work_default_and_verify_gate
        claim_type: defaults
        grounds: [entities.Household.fields.ag_work_verified, "errors[ERR_AG_WORK_NOT_VERIFIED]", "validations[priority=16]"]
        distinguishing_aspect: "ag_work_verified defaults to false; verifying ELIGIBLE against the default fails 422 ERR_AG_WORK_NOT_VERIFIED, and succeeds after a household with ag_work_verified true."
        test_recipe:
          setup: ["household H1 created without ag_work_verified; household H2 created with ag_work_verified true"]
          setup_api_calls:
            - { call: "POST /households", payload: { head_of_household_name: "NoDoc", annual_family_income_cents: 3000000 }, as: IntakeCoordinator, captures: { h1: $.data.id, ag1: $.data.ag_work_verified } }
            - { call: "POST /households", payload: { head_of_household_name: "Doc", annual_family_income_cents: 3000000, ag_work_verified: true }, as: IntakeCoordinator, captures: { h2: $.data.id } }
          trigger:
            - { call: "PUT /households/${h1}", payload: { eligibility_status: "ELIGIBLE" }, as: IntakeCoordinator, captures: { err: $.data.error_id } }
            - { call: "PUT /households/${h2}", payload: { eligibility_status: "ELIGIBLE" }, as: IntakeCoordinator, captures: { st2: $.data.eligibility_status } }
          assert:
            - "ag1 == false (default applied when the field is omitted)"
            - "err == ERR_AG_WORK_NOT_VERIFIED with HTTP 422"
            - "st2 == ELIGIBLE"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: initial_states_on_create
        claim_type: initial_state
        grounds: [state_machines.HousingSite, state_machines.HousingUnit, state_machines.UnitCertification, state_machines.Household, state_machines.Tenancy, state_machines.WorkOrder, state_machines.PestTreatment, state_machines.Complaint, state_machines.RegulatoryInspection, state_machines.ServiceReferral, state_machines.DeductionAuthorization, state_machines.SeasonWindow]
        distinguishing_aspect: "Every entity lands in its declared initial state on creation; the activation-posted RENT ledger entry starts POSTED."
        test_recipe:
          setup:
            - "Full chain: site OPEN with certified unit; household ELIGIBLE with 1 member; authorization ACTIVE; tenancy ACTIVE (produces one POSTED RENT entry); one work order; one pest treatment; one complaint; one inspection; one HEALTH referral"
          setup_api_calls:
            - { call: "POST /housing-sites", payload: { name: "Site IS", state_code: "CA" }, as: OperatorAdmin, captures: { site_id: $.data.id, site_st: $.data.status, site_v: $.data.version } }
            - { call: "POST /buildings", payload: { site_id: "${site_id}", name: "B1" }, as: OperatorAdmin, captures: { bld_id: $.data.id } }
            - { call: "POST /housing-units", payload: { building_id: "${bld_id}", site_id: "${site_id}", unit_code: "U1", unit_type: "FAMILY_UNIT", max_occupancy: 4, monthly_rent_cents: 90000 }, as: OperatorAdmin, captures: { u_id: $.data.id, u_st: $.data.status } }
            - { call: "POST /unit-certifications", payload: { unit_id: "${u_id}" }, as: ComplianceInspector, captures: { c_id: $.data.id, c_st: $.data.status } }
            - { call: "PUT /unit-certifications/${c_id}", payload: { status: "IN_PROGRESS" }, as: ComplianceInspector }
            - { call: "PUT /unit-certifications/${c_id}", payload: { status: "PASSED", deficiency_count: 0 }, as: ComplianceInspector }
            - { call: "POST /season-windows", payload: { site_id: "${site_id}", label: "S", planned_open_date: "2026-08-01", planned_close_date: "2026-11-30", expected_site_version: "${site_v}" }, as: OperatorAdmin, captures: { w_id: $.data.id, w_st: $.data.status } }
            - { call: "PUT /housing-sites/${site_id}", payload: { status: "OPENING" }, as: OperatorAdmin }
            - { call: "PUT /housing-sites/${site_id}", payload: { status: "OPEN" }, as: OperatorAdmin }
            - { call: "POST /households", payload: { head_of_household_name: "Fam IS", annual_family_income_cents: 6000000, ag_work_verified: true }, as: IntakeCoordinator, captures: { hh_id: $.data.id, hh_st: $.data.eligibility_status } }
            - { call: "POST /household-members", payload: { household_id: "${hh_id}", full_name: "IS One", date_of_birth: "1990-01-01", relationship: "HEAD" }, as: IntakeCoordinator }
            - { call: "GET /households/${hh_id}", as: IntakeCoordinator, captures: { hh_v: $.data.version } }
            - { call: "POST /deduction-authorizations", payload: { household_id: "${hh_id}", cap_percent: 0.25, purpose: "RENT", effective_date: "2026-08-01", expected_household_version: "${hh_v}" }, as: IntakeCoordinator, captures: { a_st: $.data.status } }
            - { call: "PUT /households/${hh_id}", payload: { eligibility_status: "ELIGIBLE" }, as: IntakeCoordinator }
            - { call: "GET /housing-units/${u_id}", as: IntakeCoordinator, captures: { u_v: $.data.version } }
            - { call: "POST /tenancies", payload: { household_id: "${hh_id}", unit_id: "${u_id}", move_in_date: "2026-08-11", expected_unit_version: "${u_v}" }, as: IntakeCoordinator, captures: { t_id: $.data.id, t_st: $.data.status } }
            - { call: "PUT /tenancies/${t_id}", payload: { status: "ACTIVE" }, as: IntakeCoordinator }
            - { call: "POST /work-orders", payload: { unit_id: "${u_id}", category: "OTHER", severity: "MINOR", description: "d" }, as: MaintenanceLead, captures: { wo_st: $.data.status } }
            - { call: "POST /pest-treatments", payload: { unit_id: "${u_id}", treatment_type: "ROUTINE", scheduled_date: "2026-09-01", reentry_buffer_days: 2 }, as: SiteManager, captures: { pt_st: $.data.status } }
            - { call: "POST /complaints", payload: { tenancy_id: "${t_id}", category: "OTHER", description: "d" }, as: IntakeCoordinator, captures: { co_st: $.data.status } }
            - { call: "POST /regulatory-inspections", payload: { site_id: "${site_id}", agency: "HUD", scheduled_date: "2026-09-01" }, as: ComplianceInspector, captures: { in_st: $.data.status } }
            - { call: "POST /service-referrals", payload: { household_id: "${hh_id}", referral_type: "HEALTH", agency_name: "Clinic" }, as: IntakeCoordinator, captures: { sr_st: $.data.status } }
            - { call: "GET /charge-ledger-entries?tenancy_id=${t_id}", as: OperatorAdmin, captures: { le_st: $.data.0.status } }
          trigger: []
          assert:
            - "site_st == DRAFT, u_st == REGISTERED, c_st == SCHEDULED, w_st == PLANNED, hh_st == PENDING_ELIGIBILITY, a_st == ACTIVE, t_st == PENDING_MOVE_IN, wo_st == REPORTED, pt_st == SCHEDULED, co_st == FILED, in_st == SCHEDULED, sr_st == INITIATED"
            - "le_st == POSTED (the activation RENT charge)"

      - name: cert_schedule_to_passed_invalid_transition
        claim_type: invalid_transition
        grounds: [state_machines.UnitCertification.SCHEDULED_to_IN_PROGRESS, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "SCHEDULED -> PASSED is not a declared transition; the cert must pass through IN_PROGRESS."
        test_recipe:
          setup: ["site + building + unit; cert SCHEDULED"]
          setup_api_calls:
            - { call: "POST /housing-sites", payload: { name: "S", state_code: "CA" }, as: OperatorAdmin, captures: { site_id: $.data.id } }
            - { call: "POST /buildings", payload: { site_id: "${site_id}", name: "B1" }, as: OperatorAdmin, captures: { bld_id: $.data.id } }
            - { call: "POST /housing-units", payload: { building_id: "${bld_id}", site_id: "${site_id}", unit_code: "U1", unit_type: "FAMILY_UNIT", max_occupancy: 4, monthly_rent_cents: 90000 }, as: OperatorAdmin, captures: { u_id: $.data.id } }
            - { call: "POST /unit-certifications", payload: { unit_id: "${u_id}" }, as: ComplianceInspector, captures: { c_id: $.data.id } }
          trigger:
            - { call: "PUT /unit-certifications/${c_id}", payload: { status: "PASSED", deficiency_count: 0 }, as: ComplianceInspector, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_STATE with HTTP 409; cert remains SCHEDULED"

      - name: tenancy_pending_to_terminated_invalid_transition
        claim_type: invalid_transition
        grounds: [state_machines.Tenancy.PENDING_MOVE_IN_to_CANCELLED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "PENDING_MOVE_IN allows only ACTIVE or CANCELLED; TERMINATED is rejected."
        test_recipe:
          setup: ["site OPEN; certified unit; ELIGIBLE household 1 member; tenancy PENDING_MOVE_IN"]
          setup_api_calls:
            - { call: "POST /housing-sites", payload: { name: "S", state_code: "CA" }, as: OperatorAdmin, captures: { site_id: $.data.id, site_v: $.data.version } }
            - { call: "POST /buildings", payload: { site_id: "${site_id}", name: "B1" }, as: OperatorAdmin, captures: { bld_id: $.data.id } }
            - { call: "POST /housing-units", payload: { building_id: "${bld_id}", site_id: "${site_id}", unit_code: "U1", unit_type: "FAMILY_UNIT", max_occupancy: 4, monthly_rent_cents: 90000 }, as: OperatorAdmin, captures: { u_id: $.data.id } }
            - { call: "POST /unit-certifications", payload: { unit_id: "${u_id}" }, as: ComplianceInspector, captures: { c_id: $.data.id } }
            - { call: "PUT /unit-certifications/${c_id}", payload: { status: "IN_PROGRESS" }, as: ComplianceInspector }
            - { call: "PUT /unit-certifications/${c_id}", payload: { status: "PASSED", deficiency_count: 0 }, as: ComplianceInspector }
            - { call: "POST /season-windows", payload: { site_id: "${site_id}", label: "S", planned_open_date: "2026-08-01", planned_close_date: "2026-11-30", expected_site_version: "${site_v}" }, as: OperatorAdmin }
            - { call: "PUT /housing-sites/${site_id}", payload: { status: "OPENING" }, as: OperatorAdmin }
            - { call: "PUT /housing-sites/${site_id}", payload: { status: "OPEN" }, as: OperatorAdmin }
            - { call: "POST /households", payload: { head_of_household_name: "Fam T", annual_family_income_cents: 6000000, ag_work_verified: true }, as: IntakeCoordinator, captures: { hh_id: $.data.id } }
            - { call: "PUT /households/${hh_id}", payload: { eligibility_status: "ELIGIBLE" }, as: IntakeCoordinator }
            - { call: "POST /household-members", payload: { household_id: "${hh_id}", full_name: "T One", date_of_birth: "1990-01-01", relationship: "HEAD" }, as: IntakeCoordinator }
            - { call: "GET /housing-units/${u_id}", as: IntakeCoordinator, captures: { u_v: $.data.version } }
            - { call: "POST /tenancies", payload: { household_id: "${hh_id}", unit_id: "${u_id}", move_in_date: "2026-08-11", expected_unit_version: "${u_v}" }, as: IntakeCoordinator, captures: { t_id: $.data.id } }
          trigger:
            - { call: "PUT /tenancies/${t_id}", payload: { status: "TERMINATED", move_out_date: "2026-08-20" }, as: IntakeCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_STATE; tenancy remains PENDING_MOVE_IN"

      - name: tenancy_cancelled_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Tenancy]
        distinguishing_aspect: "A CANCELLED tenancy rejects every further trigger (here: NOTICE)."
        test_recipe:
          setup: ["site OPEN; certified unit; ELIGIBLE household 1 member; tenancy CANCELLED from PENDING_MOVE_IN"]
          setup_api_calls:
            - { call: "POST /housing-sites", payload: { name: "S", state_code: "CA" }, as: OperatorAdmin, captures: { site_id: $.data.id, site_v: $.data.version } }
            - { call: "POST /buildings", payload: { site_id: "${site_id}", name: "B1" }, as: OperatorAdmin, captures: { bld_id: $.data.id } }
            - { call: "POST /housing-units", payload: { building_id: "${bld_id}", site_id: "${site_id}", unit_code: "U1", unit_type: "FAMILY_UNIT", max_occupancy: 4, monthly_rent_cents: 90000 }, as: OperatorAdmin, captures: { u_id: $.data.id } }
            - { call: "POST /unit-certifications", payload: { unit_id: "${u_id}" }, as: ComplianceInspector, captures: { c_id: $.data.id } }
            - { call: "PUT /unit-certifications/${c_id}", payload: { status: "IN_PROGRESS" }, as: ComplianceInspector }
            - { call: "PUT /unit-certifications/${c_id}", payload: { status: "PASSED", deficiency_count: 0 }, as: ComplianceInspector }
            - { call: "POST /season-windows", payload: { site_id: "${site_id}", label: "S", planned_open_date: "2026-08-01", planned_close_date: "2026-11-30", expected_site_version: "${site_v}" }, as: OperatorAdmin }
            - { call: "PUT /housing-sites/${site_id}", payload: { status: "OPENING" }, as: OperatorAdmin }
            - { call: "PUT /housing-sites/${site_id}", payload: { status: "OPEN" }, as: OperatorAdmin }
            - { call: "POST /households", payload: { head_of_household_name: "Fam TL", annual_family_income_cents: 6000000, ag_work_verified: true }, as: IntakeCoordinator, captures: { hh_id: $.data.id } }
            - { call: "PUT /households/${hh_id}", payload: { eligibility_status: "ELIGIBLE" }, as: IntakeCoordinator }
            - { call: "POST /household-members", payload: { household_id: "${hh_id}", full_name: "TL One", date_of_birth: "1990-01-01", relationship: "HEAD" }, as: IntakeCoordinator }
            - { call: "GET /housing-units/${u_id}", as: IntakeCoordinator, captures: { u_v: $.data.version } }
            - { call: "POST /tenancies", payload: { household_id: "${hh_id}", unit_id: "${u_id}", move_in_date: "2026-08-11", expected_unit_version: "${u_v}" }, as: IntakeCoordinator, captures: { t_id: $.data.id } }
            - { call: "PUT /tenancies/${t_id}", payload: { status: "CANCELLED" }, as: IntakeCoordinator }
          trigger:
            - { call: "PUT /tenancies/${t_id}", payload: { status: "NOTICE" }, as: IntakeCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_STATE — terminal CANCELLED is a lockdown state"

      - name: ledger_double_void_rejected
        claim_type: idempotency
        grounds: [state_machines.ChargeLedgerEntry.POSTED_to_VOIDED, "errors[ERR_ENTRY_ALREADY_VOIDED]", "validations[priority=18]"]
        distinguishing_aspect: "Voiding an already-VOIDED entry is rejected with ERR_ENTRY_ALREADY_VOIDED; the balance does not move again."
        test_recipe:
          setup: ["site OPEN; certified unit; ELIGIBLE household 1 member; tenancy ACTIVE (RENT entry 60968)"]
          setup_api_calls:
            - { call: "POST /housing-sites", payload: { name: "S", state_code: "CA" }, as: OperatorAdmin, captures: { site_id: $.data.id, site_v: $.data.version } }
            - { call: "POST /buildings", payload: { site_id: "${site_id}", name: "B1" }, as: OperatorAdmin, captures: { bld_id: $.data.id } }
            - { call: "POST /housing-units", payload: { building_id: "${bld_id}", site_id: "${site_id}", unit_code: "U1", unit_type: "FAMILY_UNIT", max_occupancy: 4, monthly_rent_cents: 90000 }, as: OperatorAdmin, captures: { u_id: $.data.id } }
            - { call: "POST /unit-certifications", payload: { unit_id: "${u_id}" }, as: ComplianceInspector, captures: { c_id: $.data.id } }
            - { call: "PUT /unit-certifications/${c_id}", payload: { status: "IN_PROGRESS" }, as: ComplianceInspector }
            - { call: "PUT /unit-certifications/${c_id}", payload: { status: "PASSED", deficiency_count: 0 }, as: ComplianceInspector }
            - { call: "POST /season-windows", payload: { site_id: "${site_id}", label: "S", planned_open_date: "2026-08-01", planned_close_date: "2026-11-30", expected_site_version: "${site_v}" }, as: OperatorAdmin }
            - { call: "PUT /housing-sites/${site_id}", payload: { status: "OPENING" }, as: OperatorAdmin }
            - { call: "PUT /housing-sites/${site_id}", payload: { status: "OPEN" }, as: OperatorAdmin }
