      - name: batch_ticket_sequential_numbering_per_plant
        claim_type: side_effect
        grounds: ["entities.BatchTicket.fields.ticket_number"]
        distinguishing_aspect: "ticket_number is a deterministic per-plant sequence: the first two batches on the plant get 1 and 2 in batch order."
        test_recipe:
          setup: ["standard catalog; order qty 16.0; two SCHEDULED loads on T1 and T2"]
          setup_api_calls:
