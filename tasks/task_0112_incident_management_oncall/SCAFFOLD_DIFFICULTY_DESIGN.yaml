  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: schedule_shift_half_open_overlap_rejected_backtoback_ok
        grounds:
          - calculations.schedule_shift_overlap
          - validations[priority=10]
          - errors[ERR_SHIFT_OVERLAP]
        distinguishing_aspect: |
          ScheduleShift uses half-open [start,end) intervals on an OnCallSchedule: a shift
          overlapping an existing one is rejected, but a back-to-back shift starting
          exactly at the prior end is accepted — zero-buffer adjacency-allowed geometry.
        test_recipe:
          setup:
            - "Schedule Sch with one shift [10:00,12:00); attempt an overlapping [11:00,13:00) then a back-to-back [12:00,14:00)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /services"
              payload: { name: "S", tier: "TIER_2", error_budget_minutes: 1000 }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /responders"
              payload: { full_name: "R", email: "r@x.com", sms_number: "+15550013" }
              as: PlatformAdmin
              captures: { r_id: $.data.id }
            - call: "POST /on-call-schedules"
              payload: { name: "Sch", service_id: "${s_id}" }
              as: PlatformAdmin
              captures: { sch_id: $.data.id }
            - call: "POST /schedule-shifts"
              payload: { schedule_id: "${sch_id}", responder_id: "${r_id}", starts_at: "2026-06-01T10:00:00Z", ends_at: "2026-06-01T12:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /schedule-shifts"
              payload: { schedule_id: "${sch_id}", responder_id: "${r_id}", starts_at: "2026-06-01T11:00:00Z", ends_at: "2026-06-01T13:00:00Z" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
            - call: "POST /schedule-shifts"
              payload: { schedule_id: "${sch_id}", responder_id: "${r_id}", starts_at: "2026-06-01T12:00:00Z", ends_at: "2026-06-01T14:00:00Z" }
              as: PlatformAdmin
              captures: { ok_shift_id: $.data.id }
          assert:
            - "first trigger response error_id == 'ERR_SHIFT_OVERLAP' (11:00 < 12:00 overlap)"
            - "second trigger creates a ScheduleShift (12:00 == prior end, half-open, allowed)"

      - name: maintenance_window_closed_interval_buffer_rejected
        grounds:
          - calculations.maintenance_window_spacing
          - validations[priority=11]
          - errors[ERR_WINDOW_OVERLAP]
        distinguishing_aspect: |
          MaintenanceWindow uses closed [start,end] intervals on a Service WITH a positive
          30-minute buffer: a second window starting only 10 minutes after the first ends
          is rejected even though the closed intervals do not strictly overlap — different
          interval semantics (buffer/adjacency) on a different resource than ScheduleShift.
        test_recipe:
          setup:
            - "Service S with one window [10:00,11:00]; attempt a second [11:10,12:00] (10-min gap < 30-min buffer)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /services"
              payload: { name: "S", tier: "TIER_2", error_budget_minutes: 1000 }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /maintenance-windows"
              payload: { service_id: "${s_id}", starts_at: "2026-06-01T10:00:00Z", ends_at: "2026-06-01T11:00:00Z" }
              as: PlatformAdmin
              captures: { mw1_id: $.data.id }
          trigger:
            - call: "POST /maintenance-windows"
              payload: { service_id: "${s_id}", starts_at: "2026-06-01T11:10:00Z", ends_at: "2026-06-01T12:00:00Z" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "trigger response error_id == 'ERR_WINDOW_OVERLAP' (10-min gap < MIN_WINDOW_GAP_MINUTES=30)"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: suppression_conserves_service_error_budget_minutes
        grounds:
          - state_machines.Incident.TRIGGERED_to_SUPPRESSED
          - calculations.error_budget_consumed
          - entities.Incident.fields.counts_against_budget
        distinguishing_aspect: |
          Conserved quantity #1 = Service.error_budget_consumed_minutes. Triggering an
