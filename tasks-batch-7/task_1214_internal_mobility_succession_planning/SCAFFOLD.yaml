# =============================================================================
# Task 1214 — Internal Mobility & Succession Planning (corporate talent management)
# Seed tables: single source of truth for PRD, tests, and implementation.
# =============================================================================

scenario: |
  generate task hard than expert level! 1214. Internal Mobility & Succession Planning (corporate talent management): critical role identification & bench strength assessment, successor readiness rating & development plan, internal posting policy & manager consent rules, talent review calibration sessions, high-potential program nomination & tracking, retention risk assessment & action, vacancy fill from succession slate, diversity of pipeline measurement

domain_name: internal-mobility-succession
api_prefix: /talent

complexity_profile:
  primary_archetype: multi_party_negotiation   # manager consent windows, calibration ratification, nomination endorsement with segregation of duties
  secondary_archetype: posture_driven_gating   # CriticalRole.bench_posture (derived from slate) drives alerts and auto-created retention assessments
  complexity_layers:
    - selector_policy            # vacancy fill from succession slate: eligibility filter + ranking + tie-break + empty-pool fallback
    - rate_threshold_triggers    # bench posture bands, retention risk bands, HiPo capacity, hold limit
    - derived_field_reconciliation # bench_strength / readiness_score / enrolled_count recomputed on every upstream mutation
    - optimistic_concurrency     # OCC on CriticalRole.version for PATCH and slate supersede-create
  entity_topology: flat                        # peer entities joined by FK references; no nested aggregate roots
  state_machine_shape: cyclic                  # CriticalRole ACTIVE<->VACANT; CalibrationEntry PROPOSED<->CHALLENGED; HiPoNomination ACTIVE<->UNDER_REVIEW; branching on PostingApplication
  relationship_patterns: [many_to_many, self_referential, cross_aggregate]
  # many_to_many: CriticalRole <-> Employee via SuccessorEntry; CalibrationSession <-> Employee via CalibrationEntry
  # self_referential: Employee.current_manager_id -> Employee.id
  # cross_aggregate: PostingApplication -> InternalPosting -> Vacancy -> CriticalRole
  role_model: segregation_of_duties            # HiPo endorser != nominator; calibration ratifier != proposer
  consistency_model: immediate                 # every mutation + cascade is atomic within the request

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Employee
    parent: null
    common_fields: true
    fields:
      - { name: employee_code, type: string, source: input, description: "Unique human-readable employee code", constraints: "unique across all employees" }
      - { name: full_name, type: string, source: input, description: "Full legal name" }
      - { name: department, type: string, source: input, description: "Department name (free-form scope key used by calibration sessions and diversity snapshots)" }
      - { name: job_level, type: integer, source: input, description: "Job level 1..10", constraints: "1 <= job_level <= 10" }
      - { name: hire_date, type: string, source: input, description: "ISO calendar date of hire (YYYY-MM-DD); tenure is derived from it against the logical clock" }
      - { name: demographic_group, type: enum, source: input, default: UNDISCLOSED, description: "Self-reported diversity group", constraints: "GROUP_A | GROUP_B | GROUP_C | GROUP_D | UNDISCLOSED; underrepresented set = {GROUP_C, GROUP_D}" }
      - { name: performance_rating, type: enum, source: input, description: "Current performance rating; supplied at creation, afterwards mutated ONLY by calibration application (system)", constraints: "LOW | SOLID | STRONG | EXCEPTIONAL" }
      - { name: rating_history, type: array, source: system, description: "Append-only list of {rating, applied_at, session_id} written when a calibration session is finalized; latest entry last; drives the TREND retention variant" }
      - { name: current_manager_id, type: string, source: input, description: "FK -> Employee.id; nullable for top-of-chain employees; self-referential reporting line", constraints: "must reference an existing ACTIVE employee or be null" }
      - { name: employment_status, type: enum, source: system, description: "ACTIVE initially; TERMINATED after POST /employees/{id}/terminate", constraints: "ACTIVE | TERMINATED" }
      - { name: is_high_potential, type: boolean, source: computed, description: "true iff the employee has a HiPoNomination with status in {ACTIVE, UNDER_REVIEW}" }
      - { name: active_hold_count, type: integer, source: computed, description: "Count of the employee's PostingApplications currently in MANAGER_HOLD; bounded by MAX_ACTIVE_HOLDS = 1" }

  - name: CriticalRole
    parent: null
    common_fields: true
    fields:
      - { name: role_title, type: string, source: input, description: "Title of the critical role" }
      - { name: department, type: string, source: input, description: "Owning department" }
      - { name: criticality_tier, type: enum, source: input, description: "Business criticality tier used as diversity weight", constraints: "TIER_1 | TIER_2 | TIER_3" }
      - { name: assessment_method, type: enum, source: input, description: "Selects the bench_strength variant for this role; immutable after creation (absent from PATCH input)", constraints: "WEIGHTED | COVERAGE" }
      - { name: incumbent_employee_id, type: string, source: system, description: "FK -> Employee.id; null until activation; rewritten by vacancy fill", constraints: "references an ACTIVE employee when set" }
      - { name: status, type: enum, source: system, description: "PROPOSED -> ACTIVE -> VACANT -> ACTIVE (cycle) -> RETIRED", constraints: "PROPOSED | ACTIVE | VACANT | RETIRED" }
      - { name: bench_strength, type: number, source: computed, description: "0-100 bench strength over ACTIVE slate entries, computed per assessment_method (see calculations.bench_strength); 2 decimal places" }
      - { name: bench_posture, type: enum, source: computed, description: "Derived band of bench_strength: EMPTY == 0; THIN in (0,40); ADEQUATE in [40,70); STRONG >= 70", constraints: "EMPTY | THIN | ADEQUATE | STRONG" }
      - { name: posture_alert, type: boolean, source: system, description: "Set true when bench_posture degrades into THIN or EMPTY from ADEQUATE or STRONG; cleared when posture recovers to ADEQUATE or STRONG" }

  - name: SuccessorEntry
    parent: null
    common_fields: true
    fields:
      - { name: critical_role_id, type: string, source: system, description: "FK -> CriticalRole.id; taken from the creation path" }
      - { name: employee_id, type: string, source: input, description: "FK -> Employee.id; the successor candidate" }
      - { name: readiness_rating, type: enum, source: input, description: "HRBP-assessed readiness band; input at creation and via PATCH; auto-upgraded when a development plan completes with a higher target_readiness", constraints: "READY_NOW | READY_1_2 | READY_3_PLUS" }
      - { name: slate_position, type: integer, source: input, description: "Position on the role's slate (1 = primary); unique among non-terminal entries of the same role; on supersede, omitted value inherits the superseded entry's position", constraints: "1 <= slate_position <= 5" }
      - { name: readiness_score, type: number, source: computed, description: "0-100 blend: 0.5 * RATING_POINTS[employee.performance_rating] + 0.5 * plan completion_pct (0 when no plan in ACTIVE/COMPLETED); 2 decimal places" }
      - { name: status, type: enum, source: system, description: "DRAFT -> ACTIVE <-> SUSPENDED -> REMOVED; ACTIVE -> PROMOTED on vacancy fill", constraints: "DRAFT | ACTIVE | SUSPENDED | REMOVED | PROMOTED" }
      - { name: suspension_reason, type: enum, source: input, description: "Required when PATCH suspends the entry", constraints: "PERFORMANCE_CONCERN | EMPLOYEE_REQUEST | ORG_CHANGE" }
      - { name: supersedes_entry_id, type: string, source: system, description: "Set at creation when this entry was created with supersede_entry_id; otherwise null" }

  - name: DevelopmentPlan
    parent: null
    common_fields: true
    fields:
      - { name: successor_entry_id, type: string, source: system, description: "FK -> SuccessorEntry.id; taken from the creation path; at most one plan per successor entry", constraints: "unique per successor entry" }
      - { name: target_readiness, type: enum, source: input, description: "Readiness band the plan builds toward", constraints: "READY_NOW | READY_1_2 | READY_3_PLUS" }
      - { name: completion_pct, type: integer, source: input, description: "Progress 0..100, maintained via PATCH; feeds readiness_score while plan status is ACTIVE or COMPLETED", constraints: "0 <= completion_pct <= 100" }
      - { name: status, type: enum, source: system, description: "DRAFT -> ACTIVE -> COMPLETED | ABANDONED; transitions via PATCH status", constraints: "DRAFT | ACTIVE | COMPLETED | ABANDONED" }

  - name: Vacancy
    parent: null
    common_fields: true
    fields:
      - { name: critical_role_id, type: string, source: system, description: "FK -> CriticalRole.id; vacancy is auto-created when an ACTIVE role's incumbent is terminated" }
      - { name: status, type: enum, source: system, description: "OPEN -> FILLED | CLOSED_UNFILLED", constraints: "OPEN | FILLED | CLOSED_UNFILLED" }
      - { name: fill_deadline, type: datetime, source: system, description: "created_at + FILL_WINDOW_DAYS (60); slate fills after this instant are rejected with ERR_FILL_WINDOW_EXPIRED" }
      - { name: filled_by_employee_id, type: string, source: system, description: "FK -> Employee.id; null until FILLED", constraints: "nullable" }
      - { name: fill_source, type: enum, source: system, description: "Which channel filled the vacancy", constraints: "SUCCESSION_SLATE | INTERNAL_POSTING; null until FILLED" }
      - { name: closed_reason, type: enum, source: input, description: "Optional reason recorded on manual close", constraints: "NO_VIABLE_CANDIDATE | ORG_CHANGE" }

  - name: InternalPosting
    parent: null
    common_fields: true
    fields:
      - { name: vacancy_id, type: string, source: system, description: "FK -> Vacancy.id; taken from the creation path" }
      - { name: title, type: string, source: input, description: "Posting title" }
      - { name: min_tenure_months, type: integer, source: input, default: 12, description: "Minimum whole-calendar-month tenure required of applicants" }
      - { name: min_job_level, type: integer, source: input, default: 1, description: "Minimum job_level required of applicants" }
      - { name: planned_open_date, type: string, source: input, description: "ISO date the posting window opens" }
      - { name: planned_close_date, type: string, source: input, description: "ISO date the posting window closes; window is a CLOSED interval [planned_open_date, planned_close_date] inclusive of both dates", constraints: ">= planned_open_date" }
      - { name: status, type: enum, source: system, description: "DRAFT -> OPEN -> CLOSED; DRAFT -> CANCELLED via close", constraints: "DRAFT | OPEN | CLOSED | CANCELLED" }
      - { name: application_count, type: integer, source: computed, description: "Count of non-terminal applications (status not in {OFFER_ACCEPTED, OFFER_DECLINED, REJECTED, WITHDRAWN}) on this posting" }

  - name: PostingApplication
    parent: null
    common_fields: true
    fields:
      - { name: posting_id, type: string, source: system, description: "FK -> InternalPosting.id; taken from the creation path" }
      - { name: employee_id, type: string, source: system, description: "FK -> Employee.id; the applicant; equals X-User-ID of the creating Employee caller" }
      - { name: submitted_at, type: datetime, source: system, description: "Logical-clock timestamp of submission" }
      - { name: consent_deadline, type: datetime, source: system, description: "submitted_at + CONSENT_WINDOW_DAYS (14); manager consent/hold accepted only while now < consent_deadline (strict)" }
      - { name: status, type: enum, source: system, description: "PENDING_MANAGER_CONSENT -> MANAGER_HOLD | CONSENT_GRANTED -> INTERVIEWING -> OFFER_EXTENDED -> OFFER_ACCEPTED | OFFER_DECLINED; REJECTED / WITHDRAWN from non-terminal states. Initial state is CONSENT_GRANTED (skipping consent) when the applicant has no current manager", constraints: "PENDING_MANAGER_CONSENT | MANAGER_HOLD | CONSENT_GRANTED | INTERVIEWING | OFFER_EXTENDED | OFFER_ACCEPTED | OFFER_DECLINED | REJECTED | WITHDRAWN" }
      - { name: hold_reason, type: enum, source: input, description: "Required on hold", constraints: "CRITICAL_PROJECT | PERFORMANCE_PLAN | RECENT_MOVE" }
      - { name: hold_at, type: datetime, source: system, description: "Logical-clock timestamp when the hold was placed; null unless MANAGER_HOLD" }
      - { name: hold_expires_at, type: datetime, source: system, description: "hold_at + HOLD_DURATION_DAYS (30); deadline processing auto-advances expired holds to CONSENT_GRANTED" }

  - name: CalibrationSession
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Session name" }
      - { name: department_scope, type: string, source: input, description: "Department whose employees are calibrated; sessions of the same department_scope must not overlap in time" }
      - { name: scheduled_start, type: datetime, source: input, description: "Planned start (logical clock domain)" }
      - { name: scheduled_end, type: datetime, source: input, description: "Planned end; session window is the HALF-OPEN interval [scheduled_start, scheduled_end): a new session starting exactly at another's scheduled_end is allowed", constraints: "> scheduled_start" }
      - { name: status, type: enum, source: system, description: "SCHEDULED -> IN_PROGRESS -> FINALIZED", constraints: "SCHEDULED | IN_PROGRESS | FINALIZED" }
      - { name: entry_count, type: integer, source: computed, description: "Number of CalibrationEntries in the session" }
      - { name: ratified_count, type: integer, source: computed, description: "Number of entries with status in {RATIFIED, APPLIED}" }

  - name: CalibrationEntry
    parent: null
    common_fields: true
    fields:
      - { name: session_id, type: string, source: system, description: "FK -> CalibrationSession.id; taken from the creation path" }
      - { name: employee_id, type: string, source: input, description: "FK -> Employee.id; the employee under review; unique within the session", constraints: "at most one entry per employee per session" }
      - { name: proposed_rating, type: enum, source: input, description: "Rating proposed by the employee's manager", constraints: "LOW | SOLID | STRONG | EXCEPTIONAL" }
      - { name: proposed_by_manager_id, type: string, source: system, description: "FK -> Employee.id; equals X-User-ID of the proposing Manager caller" }
      - { name: calibrated_rating, type: enum, source: system, description: "Final rating fixed at ratify time (final_rating input); null until RATIFIED", constraints: "LOW | SOLID | STRONG | EXCEPTIONAL" }
      - { name: challenge_count, type: integer, source: system, description: "Increments by 1 on each challenge", default: 0 }
      - { name: status, type: enum, source: system, description: "PROPOSED -> CHALLENGED -> PROPOSED (revise loop) -> RATIFIED -> APPLIED (on session finalize)", constraints: "PROPOSED | CHALLENGED | RATIFIED | APPLIED" }

  - name: HiPoProgramCycle
    parent: null
    common_fields: true
    fields:
      - { name: cycle_name, type: string, source: input, description: "Unique cycle label, e.g. 2026-C1", constraints: "unique" }
      - { name: capacity, type: integer, source: input, description: "Maximum number of nominations with status in {ACTIVE, UNDER_REVIEW}", constraints: ">= 1" }
      - { name: enrolled_count, type: integer, source: computed, description: "Count of the cycle's nominations with status in {ACTIVE, UNDER_REVIEW}" }
      - { name: status, type: enum, source: system, description: "OPEN -> CLOSED; closing graduates active members and rejects pending ones", constraints: "OPEN | CLOSED" }

  - name: HiPoNomination
    parent: null
    common_fields: true
    fields:
      - { name: cycle_id, type: string, source: system, description: "FK -> HiPoProgramCycle.id; taken from the creation path" }
      - { name: employee_id, type: string, source: input, description: "FK -> Employee.id; the nominee; unique per cycle among non-terminal nominations", constraints: "at most one non-terminal nomination per employee per cycle" }
      - { name: nominated_by_manager_id, type: string, source: system, description: "FK -> Employee.id; equals X-User-ID of the nominating Manager caller" }
      - { name: endorsed_by_id, type: string, source: system, description: "Employee id of the endorsing HRBusinessPartner; null until endorsed; segregation of duties forbids endorser == nominator" }
      - { name: review_count, type: integer, source: system, description: "Increments on every completed review cycle", default: 0 }
      - { name: status, type: enum, source: system, description: "NOMINATED -> ENDORSED -> ACTIVE -> UNDER_REVIEW -> ACTIVE | REMOVED; ACTIVE -> REMOVED; cycle close: ACTIVE|UNDER_REVIEW -> GRADUATED, NOMINATED|ENDORSED -> REJECTED", constraints: "NOMINATED | ENDORSED | ACTIVE | UNDER_REVIEW | REMOVED | REJECTED | GRADUATED" }

  - name: RetentionAssessment
    parent: null
    common_fields: true
    fields:
      - { name: employee_id, type: string, source: system, description: "FK -> Employee.id; taken from the creation path (or set by the bench-thin auto-cascade)" }
      - { name: assessment_method, type: enum, source: input, description: "Selects the retention_risk_score variant; immutable after creation", constraints: "POINT_IN_TIME | TREND" }
      - { name: trigger_source, type: enum, source: system, description: "MANUAL for HRBP-created assessments; BENCH_THIN_AUTO when auto-created by a bench-posture degradation", constraints: "MANUAL | BENCH_THIN_AUTO" }
      - { name: risk_score, type: number, source: computed, description: "0-100 retention risk per calculations.retention_risk_score; 1 decimal place; recomputed on creation and again at close-with-MITIGATED" }
      - { name: risk_level, type: enum, source: computed, description: "LOW < 30; MEDIUM in [30,60); HIGH in [60,85); CRITICAL >= 85", constraints: "LOW | MEDIUM | HIGH | CRITICAL" }
      - { name: action_type, type: enum, source: input, description: "Retention action chosen at plan-action", constraints: "STAY_INTERVIEW | COMP_REVIEW | ROLE_REDESIGN | RETENTION_BONUS" }
      - { name: action_deadline, type: datetime, source: input, description: "Deadline committed at plan-action" }
      - { name: status, type: enum, source: system, description: "OPEN -> ACTION_PLANNED -> ESCALATED -> ACTION_PLANNED (re-plan loop); OPEN -> DISMISSED; ACTION_PLANNED -> MITIGATED", constraints: "OPEN | ACTION_PLANNED | ESCALATED | MITIGATED | DISMISSED" }

  - name: DiversitySnapshot
    parent: null
    common_fields: false   # immutable append-only record: id + created_at only
    fields:
      - { name: scope_type, type: enum, source: input, description: "Which pipeline population is measured", constraints: "DEPARTMENT | HIPO_CYCLE" }
      - { name: scope_ref, type: string, source: input, description: "Polymorphic scope key: a department name when scope_type=DEPARTMENT, a HiPoProgramCycle id when scope_type=HIPO_CYCLE; stored verbatim, not a strict FK" }
      - { name: total_subjects, type: integer, source: computed, description: "Population size included in the measurement (see calculations.diversity_index input_set)" }
      - { name: underrepresented_count, type: integer, source: computed, description: "Subjects whose demographic_group is in UNDERREPRESENTED_GROUPS {GROUP_C, GROUP_D}" }
      - { name: diversity_index, type: number, source: computed, description: "0-100 index, 2 decimal places; null when the population is empty", constraints: "nullable" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Employee
    initial_state: ACTIVE
    terminal_states: [TERMINATED]
    transitions:
      - from: ACTIVE
        to: TERMINATED
        trigger: POST /talent/employees/{id}/terminate
        actor: HRAdmin
        preconditions:
          - "employee.employment_status == ACTIVE (else ERR_ALREADY_TERMINAL)"
        side_effects:
          - "L1: employment_status -> TERMINATED"
          - "L2: every CriticalRole R with R.incumbent_employee_id == employee.id AND R.status == ACTIVE transitions to VACANT (caused by L1); R.version increments"
          - "L3: for each role that became VACANT in L2, a Vacancy is auto-created (status OPEN, fill_deadline = now + 60 days) (caused by L2)"
          - "L4: every SuccessorEntry S with S.employee_id == employee.id AND S.status in {DRAFT, ACTIVE, SUSPENDED} transitions to REMOVED (caused by L1)"
          - "L5: for each role whose slate lost an entry in L4, bench_strength and bench_posture recompute; if bench_posture degrades into THIN or EMPTY from ADEQUATE or STRONG, posture_alert is set true (caused by L4)"
          - "L6: for each role whose posture_alert was set in L5, one RetentionAssessment (trigger_source BENCH_THIN_AUTO, status OPEN, assessment_method POINT_IN_TIME) is auto-created for every remaining SuccessorEntry on that role with status ACTIVE and readiness_rating READY_NOW (caused by L5)"
          - "L7: every PostingApplication with employee_id == employee.id in a non-terminal status transitions to WITHDRAWN (frees any active hold); every HiPoNomination with employee_id == employee.id in {NOMINATED, ENDORSED, ACTIVE, UNDER_REVIEW} transitions to REMOVED (enrolled_count of the cycle recomputes)"

  - entity: CriticalRole
    initial_state: PROPOSED
    terminal_states: [RETIRED]
    transitions:
      - from: PROPOSED
        to: ACTIVE
        trigger: POST /talent/critical-roles/{id}/activate
        actor: HRBusinessPartner
        preconditions:
          - "role.status == PROPOSED (else ERR_ROLE_INVALID_STATE)"
          - "incumbent_employee_id input references an existing employee with employment_status == ACTIVE (else ERR_NOT_FOUND / ERR_EMPLOYEE_NOT_ACTIVE)"
        side_effects:
          - "incumbent_employee_id := input; status -> ACTIVE; version increments"
      - from: ACTIVE
        to: VACANT
        trigger: system — incumbent termination (see Employee terminate L2)
        actor: system
        preconditions: []
        side_effects:
          - "status -> VACANT; auto-create Vacancy (OPEN, fill_deadline = now + 60d); version increments"
      - from: VACANT
        to: ACTIVE
        trigger: system — vacancy filled (fill-from-slate or posting offer acceptance)
        actor: system
        preconditions: []
        side_effects:
          - "status -> ACTIVE; incumbent_employee_id := filling employee; version increments"
      - from: ACTIVE
        to: RETIRED
        trigger: POST /talent/critical-roles/{id}/retire
        actor: HRBusinessPartner
        preconditions:
          - "role.status in {ACTIVE, VACANT} (else ERR_ROLE_INVALID_STATE)"
        side_effects:
          - "all SuccessorEntries of the role in {DRAFT, ACTIVE, SUSPENDED} -> REMOVED"
          - "if an OPEN vacancy exists for the role, it transitions to CLOSED_UNFILLED; OPEN postings of that vacancy -> CLOSED; their non-terminal applications -> REJECTED"
      - from: VACANT
        to: RETIRED
        trigger: POST /talent/critical-roles/{id}/retire
        actor: HRBusinessPartner
        preconditions:
          - "role.status in {ACTIVE, VACANT} (else ERR_ROLE_INVALID_STATE)"
        side_effects:
          - "same cascade as ACTIVE -> RETIRED"

  - entity: SuccessorEntry
    initial_state: DRAFT
    terminal_states: [REMOVED, PROMOTED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: PATCH /talent/successors/{id} with status=ACTIVE
        actor: HRBusinessPartner
        preconditions:
          - "entry.status == DRAFT (else ERR_SUCCESSOR_INVALID_STATE)"
          - "critical role status in {ACTIVE, VACANT} (else ERR_ROLE_NOT_ACTIVE)"
        side_effects:
          - "role bench_strength / bench_posture recompute (entry joins the ACTIVE slate); version increments on both"
      - from: ACTIVE
        to: SUSPENDED
        trigger: PATCH /talent/successors/{id} with status=SUSPENDED
        actor: HRBusinessPartner
        preconditions:
          - "entry.status == ACTIVE (else ERR_SUCCESSOR_INVALID_STATE)"
          - "suspension_reason provided (else ERR_INVALID_REQUEST)"
        side_effects:
          - "role bench_strength / bench_posture recompute (entry leaves the ACTIVE slate); posture_alert maintained"
      - from: SUSPENDED
        to: ACTIVE
        trigger: PATCH /talent/successors/{id} with status=ACTIVE
        actor: HRBusinessPartner
        preconditions:
          - "entry.status == SUSPENDED (else ERR_SUCCESSOR_INVALID_STATE)"
          - "critical role status in {ACTIVE, VACANT} (else ERR_ROLE_NOT_ACTIVE)"
        side_effects:
          - "role bench_strength / bench_posture recompute"
      - from: DRAFT
        to: REMOVED
        trigger: POST /talent/successors/{id}/remove
        actor: HRBusinessPartner
        preconditions:
          - "entry.status in {DRAFT, ACTIVE, SUSPENDED} (else ERR_SUCCESSOR_INVALID_STATE)"
        side_effects:
          - "role bench_strength / bench_posture recompute if entry was ACTIVE"
      - from: ACTIVE
        to: REMOVED
        trigger: POST /talent/successors/{id}/remove
        actor: HRBusinessPartner
        preconditions:
          - "entry.status in {DRAFT, ACTIVE, SUSPENDED} (else ERR_SUCCESSOR_INVALID_STATE)"
        side_effects:
          - "role bench_strength / bench_posture recompute; posture_alert maintained"
      - from: SUSPENDED
        to: REMOVED
        trigger: POST /talent/successors/{id}/remove
        actor: HRBusinessPartner
        preconditions:
          - "entry.status in {DRAFT, ACTIVE, SUSPENDED} (else ERR_SUCCESSOR_INVALID_STATE)"
        side_effects: []
      - from: ACTIVE
        to: PROMOTED
        trigger: system — vacancy fill selects this entry (fill-from-slate or posting offer acceptance by this employee)
        actor: system
        preconditions: []
        side_effects:
          - "role bench_strength / bench_posture recompute (entry leaves ACTIVE slate)"
      - from: SUSPENDED
        to: PROMOTED
        trigger: system — posting offer acceptance by this employee for the same role's vacancy
        actor: system
        preconditions: []
        side_effects:
          - "entry -> PROMOTED"

  - entity: DevelopmentPlan
    initial_state: DRAFT
    terminal_states: [COMPLETED, ABANDONED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: PATCH /talent/development-plans/{id} with status=ACTIVE
        actor: HRBusinessPartner
        preconditions:
          - "plan.status == DRAFT (else ERR_PLAN_INVALID_STATE)"
          - "successor entry status == ACTIVE (else ERR_SUCCESSOR_INVALID_STATE)"
        side_effects:
          - "successor entry readiness_score recomputes (plan now counts); role bench_strength recomputes"
      - from: ACTIVE
        to: COMPLETED
        trigger: PATCH /talent/development-plans/{id} with status=COMPLETED
        actor: HRBusinessPartner
        preconditions:
          - "plan.status == ACTIVE (else ERR_PLAN_INVALID_STATE)"
          - "completion_pct == 100 (else ERR_PLAN_INCOMPLETE)"
        side_effects:
          - "readiness_score recomputes"
          - "if target_readiness outranks the entry's current readiness_rating (rank: READY_NOW > READY_1_2 > READY_3_PLUS), entry.readiness_rating := target_readiness (auto-upgrade)"
          - "role bench_strength / bench_posture recompute; posture_alert maintained"
      - from: DRAFT
        to: ABANDONED
        trigger: PATCH /talent/development-plans/{id} with status=ABANDONED
        actor: HRBusinessPartner
        preconditions:
          - "plan.status in {DRAFT, ACTIVE} (else ERR_PLAN_INVALID_STATE)"
        side_effects:
          - "successor entry readiness_score recomputes (plan stops counting); role bench_strength recomputes"
      - from: ACTIVE
        to: ABANDONED
        trigger: PATCH /talent/development-plans/{id} with status=ABANDONED
        actor: HRBusinessPartner
        preconditions:
          - "plan.status in {DRAFT, ACTIVE} (else ERR_PLAN_INVALID_STATE)"
        side_effects:
          - "successor entry readiness_score recomputes (plan stops counting); role bench_strength recomputes"

  - entity: Vacancy
    initial_state: OPEN
    terminal_states: [FILLED, CLOSED_UNFILLED]
    transitions:
      - from: OPEN
        to: FILLED
        trigger: POST /talent/vacancies/{id}/fill-from-slate
        actor: HRBusinessPartner
        preconditions:
          - "vacancy.status == OPEN (else ERR_VACANCY_NOT_OPEN)"
          - "now <= vacancy.fill_deadline (else ERR_FILL_WINDOW_EXPIRED)"
          - "eligible successor pool non-empty per calculations.slate_fill_selection (else ERR_NO_ELIGIBLE_SUCCESSOR)"
        side_effects:
          - "selected SuccessorEntry -> PROMOTED; vacancy.filled_by_employee_id := selected employee; fill_source := SUCCESSION_SLATE"
          - "critical role VACANT -> ACTIVE with incumbent := selected employee; role.version increments"
          - "role bench_strength / bench_posture recompute (selected entry left the ACTIVE slate)"
          - "postings of the vacancy are NOT touched: the posting channel winds down independently (HRBP closes it manually); applications already INTERVIEWING later fail offer-extension with ERR_VACANCY_NOT_OPEN"
      - from: OPEN
        to: FILLED
        trigger: system — posting offer accepted (see PostingApplication respond-offer ACCEPT)
        actor: system
        preconditions: []
        side_effects:
          - "fill_source := INTERNAL_POSTING; filled_by_employee_id := applicant; role VACANT -> ACTIVE with new incumbent; role.version increments; role bench recomputes"
      - from: OPEN
        to: CLOSED_UNFILLED
        trigger: POST /talent/vacancies/{id}/close
        actor: HRBusinessPartner
        preconditions:
          - "vacancy.status == OPEN (else ERR_VACANCY_NOT_OPEN)"
        side_effects:
          - "any OPEN InternalPosting of this vacancy -> CLOSED; its non-terminal applications -> REJECTED"

  - entity: InternalPosting
    initial_state: DRAFT
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: DRAFT
        to: OPEN
        trigger: POST /talent/postings/{id}/publish
        actor: HRBusinessPartner
        preconditions:
          - "posting.status == DRAFT (else ERR_POSTING_INVALID_STATE)"
          - "parent vacancy.status == OPEN (else ERR_VACANCY_NOT_OPEN)"
          - "no other posting of the same vacancy with status OPEN whose CLOSED window [planned_open_date, planned_close_date] intersects this posting's window — intersection iff new.planned_open_date <= existing.planned_close_date AND existing.planned_open_date <= new.planned_close_date (else ERR_POSTING_WINDOW_CONFLICT)"
        side_effects: []
      - from: OPEN
        to: CLOSED
        trigger: POST /talent/postings/{id}/close
        actor: HRBusinessPartner
        preconditions:
          - "posting.status == OPEN (else ERR_POSTING_INVALID_STATE)"
        side_effects:
          - "all non-terminal applications of the posting -> REJECTED (any MANAGER_HOLD freed)"
      - from: DRAFT
        to: CANCELLED
        trigger: POST /talent/postings/{id}/close
        actor: HRBusinessPartner
        preconditions:
          - "posting.status == DRAFT (else ERR_POSTING_INVALID_STATE)"
        side_effects: []

  - entity: PostingApplication
    initial_state: PENDING_MANAGER_CONSENT
    terminal_states: [OFFER_ACCEPTED, OFFER_DECLINED, REJECTED, WITHDRAWN]
    transitions:
      - from: PENDING_MANAGER_CONSENT
        to: CONSENT_GRANTED
        trigger: POST /talent/applications/{id}/consent
        actor: Manager
        preconditions:
          - "application.status == PENDING_MANAGER_CONSENT (else ERR_APPLICATION_INVALID_STATE)"
          - "X-User-ID == applicant.current_manager_id (else ERR_NOT_REPORTING_MANAGER)"
          - "now < application.consent_deadline (strict; else ERR_CONSENT_WINDOW_CLOSED)"
        side_effects: []
      - from: PENDING_MANAGER_CONSENT
        to: MANAGER_HOLD
        trigger: POST /talent/applications/{id}/hold
        actor: Manager
        preconditions:
          - "application.status == PENDING_MANAGER_CONSENT (else ERR_APPLICATION_INVALID_STATE)"
          - "X-User-ID == applicant.current_manager_id (else ERR_NOT_REPORTING_MANAGER)"
          - "now < application.consent_deadline (strict; else ERR_CONSENT_WINDOW_CLOSED)"
          - "applicant.active_hold_count < MAX_ACTIVE_HOLDS (1) (else ERR_HOLD_LIMIT_REACHED)"
          - "hold_reason provided (else ERR_INVALID_REQUEST)"
        side_effects:
          - "hold_at := now; hold_expires_at := now + 30 days; applicant.active_hold_count recomputes (+1)"
      - from: MANAGER_HOLD
        to: CONSENT_GRANTED
        trigger: POST /talent/applications/{id}/release-hold
        actor: Manager
        preconditions:
          - "application.status == MANAGER_HOLD (else ERR_APPLICATION_INVALID_STATE)"
          - "X-User-ID == applicant.current_manager_id (else ERR_NOT_REPORTING_MANAGER)"
        side_effects:
          - "applicant.active_hold_count recomputes (-1); compensating action: hold followed by release-hold leaves active_hold_count unchanged"
      - from: MANAGER_HOLD
        to: CONSENT_GRANTED
        trigger: "POST /talent/consent-deadlines/process (system batch: hold_expires_at <= now)"
        actor: HRAdmin
        preconditions: []
        side_effects:
          - "applicant.active_hold_count recomputes (-1)"
      - from: PENDING_MANAGER_CONSENT
        to: CONSENT_GRANTED
        trigger: "POST /talent/consent-deadlines/process (system batch: consent_deadline <= now without manager action = deemed consent)"
        actor: HRAdmin
        preconditions: []
        side_effects: []
      - from: CONSENT_GRANTED
        to: INTERVIEWING
        trigger: POST /talent/applications/{id}/advance with target_state=INTERVIEWING
        actor: HRBusinessPartner
        preconditions:
          - "application.status == CONSENT_GRANTED (else ERR_APPLICATION_INVALID_STATE)"
        side_effects: []
      - from: INTERVIEWING
        to: OFFER_EXTENDED
        trigger: POST /talent/applications/{id}/advance with target_state=OFFER_EXTENDED
        actor: HRBusinessPartner
        preconditions:
          - "application.status == INTERVIEWING (else ERR_APPLICATION_INVALID_STATE)"
          - "posting.status == OPEN (else ERR_POSTING_INVALID_STATE)"
          - "posting's vacancy.status == OPEN (else ERR_VACANCY_NOT_OPEN)"
        side_effects: []
      - from: CONSENT_GRANTED
        to: REJECTED
        trigger: POST /talent/applications/{id}/advance with target_state=REJECTED
        actor: HRBusinessPartner
        preconditions:
          - "application.status in {CONSENT_GRANTED, INTERVIEWING} (else ERR_APPLICATION_INVALID_STATE)"
        side_effects: []
      - from: INTERVIEWING
        to: REJECTED
        trigger: POST /talent/applications/{id}/advance with target_state=REJECTED
        actor: HRBusinessPartner
        preconditions:
          - "application.status in {CONSENT_GRANTED, INTERVIEWING} (else ERR_APPLICATION_INVALID_STATE)"
        side_effects: []
      - from: OFFER_EXTENDED
        to: OFFER_ACCEPTED
        trigger: POST /talent/applications/{id}/respond-offer with decision=ACCEPT
        actor: Employee
        preconditions:
          - "application.status == OFFER_EXTENDED (else ERR_APPLICATION_INVALID_STATE)"
          - "X-User-ID == application.employee_id (else ERR_APPLICANT_NOT_SELF)"
        side_effects:
          - "vacancy OPEN -> FILLED (fill_source INTERNAL_POSTING, filled_by_employee_id := applicant)"
          - "critical role VACANT -> ACTIVE; incumbent := applicant; role.version increments"
          - "posting OPEN -> CLOSED; all OTHER non-terminal applications of the posting -> REJECTED"
          - "if the applicant has a SuccessorEntry on this role with status in {ACTIVE, SUSPENDED}, that entry -> PROMOTED; role bench recomputes"
      - from: OFFER_EXTENDED
        to: OFFER_DECLINED
        trigger: POST /talent/applications/{id}/respond-offer with decision=DECLINE
        actor: Employee
        preconditions:
          - "application.status == OFFER_EXTENDED (else ERR_APPLICATION_INVALID_STATE)"
          - "X-User-ID == application.employee_id (else ERR_APPLICANT_NOT_SELF)"
        side_effects: []
      - from: PENDING_MANAGER_CONSENT
        to: WITHDRAWN
        trigger: POST /talent/applications/{id}/withdraw
        actor: Employee
        preconditions:
          - "application.status not terminal (else ERR_APPLICATION_INVALID_STATE)"
          - "X-User-ID == application.employee_id (else ERR_APPLICANT_NOT_SELF)"
        side_effects:
          - "if status was MANAGER_HOLD, applicant.active_hold_count recomputes (-1)"
      - from: MANAGER_HOLD
        to: WITHDRAWN
        trigger: POST /talent/applications/{id}/withdraw
        actor: Employee
        preconditions:
          - "application.status not terminal (else ERR_APPLICATION_INVALID_STATE)"
          - "X-User-ID == application.employee_id (else ERR_APPLICANT_NOT_SELF)"
        side_effects:
          - "applicant.active_hold_count recomputes (-1)"
      - from: CONSENT_GRANTED
        to: WITHDRAWN
        trigger: POST /talent/applications/{id}/withdraw
        actor: Employee
        preconditions:
          - "application.status not terminal (else ERR_APPLICATION_INVALID_STATE)"
          - "X-User-ID == application.employee_id (else ERR_APPLICANT_NOT_SELF)"
        side_effects: []
      - from: INTERVIEWING
        to: WITHDRAWN
        trigger: POST /talent/applications/{id}/withdraw
        actor: Employee
        preconditions:
          - "application.status not terminal (else ERR_APPLICATION_INVALID_STATE)"
          - "X-User-ID == application.employee_id (else ERR_APPLICANT_NOT_SELF)"
        side_effects: []
      - from: OFFER_EXTENDED
        to: WITHDRAWN
        trigger: POST /talent/applications/{id}/withdraw
        actor: Employee
        preconditions:
          - "application.status not terminal (else ERR_APPLICATION_INVALID_STATE)"
          - "X-User-ID == application.employee_id (else ERR_APPLICANT_NOT_SELF)"
        side_effects: []

  - entity: CalibrationSession
    initial_state: SCHEDULED
    terminal_states: [FINALIZED]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: POST /talent/calibration-sessions/{id}/start
        actor: TalentManager
        preconditions:
          - "session.status == SCHEDULED (else ERR_SESSION_INVALID_STATE)"
        side_effects: []
      - from: IN_PROGRESS
        to: FINALIZED
        trigger: POST /talent/calibration-sessions/{id}/finalize
        actor: TalentManager
        preconditions:
          - "session.status == IN_PROGRESS (else ERR_SESSION_INVALID_STATE)"
          - "entry_count >= 1 (else ERR_SESSION_EMPTY)"
          - "every entry status == RATIFIED, i.e. ratified_count == entry_count (else ERR_UNRATIFIED_ENTRIES_REMAIN)"
        side_effects:
          - "L1: every RATIFIED entry -> APPLIED"
          - "L2: each APPLIED entry writes Employee.performance_rating := entry.calibrated_rating and appends {rating, applied_at: now, session_id} to Employee.rating_history (caused by L1)"
          - "L3: every SuccessorEntry with status in {ACTIVE, SUSPENDED} whose employee was updated in L2 recomputes readiness_score (caused by L2)"
          - "L4: every CriticalRole whose slate contains an entry updated in L3 recomputes bench_strength / bench_posture; posture_alert maintained (caused by L3)"

  - entity: CalibrationEntry
    initial_state: PROPOSED
    terminal_states: [APPLIED]
    transitions:
      - from: PROPOSED
        to: CHALLENGED
        trigger: POST /talent/calibration-entries/{id}/challenge
        actor: TalentManager
        preconditions:
          - "entry.status == PROPOSED (else ERR_ENTRY_INVALID_STATE)"
          - "parent session.status == IN_PROGRESS (else ERR_SESSION_INVALID_STATE)"
        side_effects:
          - "challenge_count increments by 1"
      - from: CHALLENGED
        to: PROPOSED
        trigger: POST /talent/calibration-entries/{id}/revise
        actor: Manager
        preconditions:
          - "entry.status == CHALLENGED (else ERR_ENTRY_INVALID_STATE)"
          - "parent session.status == IN_PROGRESS (else ERR_SESSION_INVALID_STATE)"
          - "X-User-ID == entry.proposed_by_manager_id (else ERR_NOT_ENTRY_PROPOSER)"
        side_effects:
          - "proposed_rating := input proposed_rating (revision loop)"
      - from: PROPOSED
        to: RATIFIED
        trigger: POST /talent/calibration-entries/{id}/ratify
        actor: TalentManager
        preconditions:
          - "entry.status in {PROPOSED, CHALLENGED} (else ERR_ENTRY_INVALID_STATE)"
          - "parent session.status == IN_PROGRESS (else ERR_SESSION_INVALID_STATE)"
          - "X-User-ID != entry.proposed_by_manager_id (segregation of duties; else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "calibrated_rating := input final_rating; session.ratified_count recomputes"
      - from: CHALLENGED
        to: RATIFIED
        trigger: POST /talent/calibration-entries/{id}/ratify
        actor: TalentManager
        preconditions:
          - "entry.status in {PROPOSED, CHALLENGED} (else ERR_ENTRY_INVALID_STATE)"
          - "parent session.status == IN_PROGRESS (else ERR_SESSION_INVALID_STATE)"
          - "X-User-ID != entry.proposed_by_manager_id (segregation of duties; else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "calibrated_rating := input final_rating; session.ratified_count recomputes"
      - from: RATIFIED
        to: APPLIED
        trigger: system — parent session finalize
        actor: system
        preconditions: []
        side_effects:
          - "employee performance_rating := calibrated_rating; rating_history appended; downstream readiness_score and bench recomputes per session finalize cascade"

  - entity: HiPoProgramCycle
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: POST /talent/hipo-cycles/{id}/close
        actor: HRAdmin
        preconditions:
          - "cycle.status == OPEN (else ERR_CYCLE_INVALID_STATE)"
        side_effects:
          - "nominations in {ACTIVE, UNDER_REVIEW} -> GRADUATED; nominations in {NOMINATED, ENDORSED} -> REJECTED; enrolled_count recomputes to 0"

  - entity: HiPoNomination
    initial_state: NOMINATED
    terminal_states: [GRADUATED, REMOVED, REJECTED]
    transitions:
      - from: NOMINATED
        to: ENDORSED
        trigger: POST /talent/hipo-nominations/{id}/endorse
        actor: HRBusinessPartner
        preconditions:
          - "nomination.status == NOMINATED (else ERR_NOMINATION_INVALID_STATE)"
          - "cycle.status == OPEN (else ERR_CYCLE_INVALID_STATE)"
          - "X-User-ID != nomination.nominated_by_manager_id (segregation of duties; else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "endorsed_by_id := X-User-ID"
      - from: NOMINATED
        to: REJECTED
        trigger: POST /talent/hipo-nominations/{id}/reject
        actor: HRBusinessPartner
        preconditions:
          - "nomination.status == NOMINATED (else ERR_NOMINATION_INVALID_STATE)"
        side_effects: []
      - from: ENDORSED
        to: ACTIVE
        trigger: POST /talent/hipo-nominations/{id}/enroll
        actor: TalentManager
        preconditions:
          - "nomination.status == ENDORSED (else ERR_NOMINATION_INVALID_STATE)"
          - "cycle.status == OPEN (else ERR_CYCLE_INVALID_STATE)"
          - "cycle.enrolled_count < cycle.capacity (else ERR_PROGRAM_AT_CAPACITY)"
        side_effects:
          - "cycle.enrolled_count recomputes (+1); employee.is_high_potential recomputes (becomes true)"
      - from: ACTIVE
        to: UNDER_REVIEW
        trigger: POST /talent/hipo-nominations/{id}/start-review
        actor: TalentManager
        preconditions:
          - "nomination.status == ACTIVE (else ERR_NOMINATION_INVALID_STATE)"
        side_effects: []
      - from: UNDER_REVIEW
        to: ACTIVE
        trigger: POST /talent/hipo-nominations/{id}/complete-review with outcome=RETAIN
        actor: TalentManager
        preconditions:
          - "nomination.status == UNDER_REVIEW (else ERR_NOMINATION_INVALID_STATE)"
        side_effects:
          - "review_count increments by 1"
      - from: UNDER_REVIEW
        to: REMOVED
        trigger: POST /talent/hipo-nominations/{id}/complete-review with outcome=REMOVE
        actor: TalentManager
        preconditions:
          - "nomination.status == UNDER_REVIEW (else ERR_NOMINATION_INVALID_STATE)"
        side_effects:
          - "review_count increments by 1 (every completed review)"
          - "cycle.enrolled_count recomputes (-1); employee.is_high_potential recomputes"
      - from: ACTIVE
        to: REMOVED
        trigger: POST /talent/hipo-nominations/{id}/remove
        actor: TalentManager
        preconditions:
          - "nomination.status == ACTIVE (else ERR_NOMINATION_INVALID_STATE)"
        side_effects:
          - "cycle.enrolled_count recomputes (-1); compensating action: enroll followed by remove leaves enrolled_count unchanged; employee.is_high_potential recomputes"

  - entity: RetentionAssessment
    initial_state: OPEN
    terminal_states: [MITIGATED, DISMISSED]
    transitions:
      - from: OPEN
        to: ACTION_PLANNED
        trigger: POST /talent/retention-assessments/{id}/plan-action
        actor: HRBusinessPartner
        preconditions:
          - "assessment.status in {OPEN, ESCALATED} (else ERR_ASSESSMENT_INVALID_STATE)"
        side_effects:
          - "action_type := input; action_deadline := input"
      - from: ESCALATED
        to: ACTION_PLANNED
        trigger: POST /talent/retention-assessments/{id}/plan-action
        actor: HRBusinessPartner
        preconditions:
          - "assessment.status in {OPEN, ESCALATED} (else ERR_ASSESSMENT_INVALID_STATE)"
        side_effects:
          - "action_type := input; action_deadline := input (re-plan loop)"
      - from: ACTION_PLANNED
        to: ESCALATED
        trigger: POST /talent/retention-assessments/{id}/escalate
        actor: HRBusinessPartner
        preconditions:
          - "assessment.status == ACTION_PLANNED (else ERR_ASSESSMENT_INVALID_STATE)"
          - "assessment.risk_level in {HIGH, CRITICAL} (else ERR_RISK_NOT_ESCALATABLE)"
        side_effects: []
      - from: ACTION_PLANNED
        to: MITIGATED
        trigger: POST /talent/retention-assessments/{id}/close with outcome=MITIGATED
        actor: HRBusinessPartner
        preconditions:
          - "assessment.status == ACTION_PLANNED (else ERR_ASSESSMENT_INVALID_STATE)"
          - "risk_score recomputed at close with the assessment's method yields risk_level in {LOW, MEDIUM} (else ERR_RISK_STILL_HIGH)"
        side_effects:
          - "risk_score / risk_level refreshed to the recomputed values"
      - from: OPEN
        to: DISMISSED
        trigger: POST /talent/retention-assessments/{id}/close with outcome=DISMISSED
        actor: HRBusinessPartner
        preconditions:
          - "assessment.status == OPEN (else ERR_ASSESSMENT_INVALID_STATE)"
        side_effects: []

# =============================================================================
# 1.2.1 Concurrency Rules (OCC on CriticalRole.version only)
# =============================================================================
concurrency_rules:
  - rule_id: critical-role-patch-stale-version
    parent_entity: CriticalRole
    write_endpoint: "PATCH /talent/critical-roles/{id}"
    occ_field: expected_critical_role_version
    description: |
      Updating a CriticalRole whose version has advanced since the client last
      observed it is rejected. The client's view of the role (title, tier,
      posture-relevant fields) is stale relative to intervening writes.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: slate-supersede-stale-role
    parent_entity: CriticalRole
    write_endpoint: "POST /talent/critical-roles/{id}/successors"
    occ_field: expected_critical_role_version
    description: |
      Creating a SuccessorEntry against a CriticalRole whose version has
      advanced since the client last observed it is rejected. This captures
      the case where another writer has just created an entry (including one
      that legitimately supersedes an ACTIVE entry under the slate-replacement
      rule) and the current writer's view of the slate is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: bench_strength
    trigger: "any mutation to the role's slate (entry create / supersede / DRAFT->ACTIVE / suspend / reinstate / remove / PROMOTED), any readiness_rating change, any readiness_score-affecting change (plan PATCH, calibration-applied rating)"
    algorithm: weighted_scoring
    formula: |
      input_set: SuccessorEntry e where e.critical_role_id == role.id AND e.status == ACTIVE.
      WEIGHTED variant (role.assessment_method == WEIGHTED):
        per-entry raw contribution c_e = READINESS_WEIGHT[e.readiness_rating]
                                         * POSITION_DECAY^(e.slate_position - 1)
                                         * (e.readiness_score / 100)
        ROUNDING ORDER IS PINNED: first round each c_e to 3 decimal places
        (round_half_up), then sum the rounded contributions, then normalize:
        bench_strength = round_half_up( sum(c_e_rounded) / MAX_POSSIBLE * 100, 2 dp ).
        Empty input set -> bench_strength = 0.00.
      COVERAGE variant (role.assessment_method == COVERAGE):
        bench_strength = round_half_up(
          count(ACTIVE entries with readiness_rating in {READY_NOW, READY_1_2})
          / SLATE_MAX * 100, 0 dp )  — an integer percentage.
      The two variants produce different values for identical slate data.
    input_set: "ACTIVE SuccessorEntries of the role only; DRAFT / SUSPENDED / REMOVED / PROMOTED excluded"
    constants:
      READINESS_WEIGHT: { READY_NOW: 1.0, READY_1_2: 0.6, READY_3_PLUS: 0.3 }
      POSITION_DECAY: 0.9
      SLATE_MAX: 5
      MAX_POSSIBLE: 4.0951   # sum_{p=1..5} 1.0 * 0.9^(p-1), all READY_NOW at score 100
    precision: "WEIGHTED: contributions 3 dp round_half_up, final 2 dp round_half_up; COVERAGE: 0 dp round_half_up"
    variants:
      - name: WEIGHTED
        when: "role.assessment_method == WEIGHTED"
        difference: "readiness-weighted, position-decayed, score-scaled sum normalized by MAX_POSSIBLE; sensitive to readiness_score"
      - name: COVERAGE
        when: "role.assessment_method == COVERAGE"
        difference: "pure head-count coverage of ready-enough entries over SLATE_MAX; ignores readiness_score and slate_position"

  - name: bench_posture
    trigger: "after every bench_strength recompute"
    algorithm: threshold
    formula: |
      bench_posture = EMPTY    if bench_strength == 0
                    | THIN     if 0 < bench_strength < 40
                    | ADEQUATE if 40 <= bench_strength < 70
                    | STRONG   if bench_strength >= 70
      Boundaries: 0 is EMPTY (not THIN); 40.00 is ADEQUATE (not THIN);
      70.00 is STRONG (not ADEQUATE). posture_alert set when the band
      degrades into {THIN, EMPTY} from {ADEQUATE, STRONG}; cleared when the
      band recovers into {ADEQUATE, STRONG}.
    input_set: "the role's current bench_strength"
    constants:
      POSTURE_ADEQUATE_MIN: 40
      POSTURE_STRONG_MIN: 70
    precision: "comparison against the stored (already rounded) bench_strength"

  - name: readiness_score
    trigger: "entry creation; PATCH /talent/successors/{id}; development-plan create / PATCH (completion_pct or status); calibration finalize cascade for the employee"
    algorithm: weighted_scoring
    formula: |
      plan_pct = completion_pct of the entry's DevelopmentPlan when the plan
                 exists and its status in {ACTIVE, COMPLETED}; otherwise 0.
      readiness_score = round_half_up(
          0.5 * RATING_POINTS[employee.performance_rating]
        + 0.5 * plan_pct, 2 dp )
    input_set: "the entry's employee current performance_rating and the entry's plan"
    constants:
      RATING_POINTS: { LOW: 20, SOLID: 50, STRONG: 80, EXCEPTIONAL: 100 }
    precision: "2 decimal places, round_half_up"

  - name: retention_risk_score
    trigger: "RetentionAssessment creation; recomputed again inside close with outcome=MITIGATED"
    algorithm: weighted_scoring
    formula: |
      POINT_IN_TIME variant:
        base = 100 - RATING_POINTS[employee.performance_rating]
      TREND variant:
        let hist = up to the 3 most recent rating_history entries, latest first;
        weights w = [0.5, 0.3, 0.2] truncated to len(hist), each divided by
        sum(truncated weights) (renormalization when fewer than 3 entries);
        weighted_rating = sum(w_i * RATING_POINTS[hist_i.rating])
        base = 100 - weighted_rating
        If rating_history is empty, TREND falls back to POINT_IN_TIME.
      Modifiers (both variants, applied in this order):
        + TENURE_RISK_DELTA (+15) if months_between(hire_date, now) < TENURE_RISK_MONTHS (24)
        - HIPO_RISK_DELTA (10) if employee.is_high_potential
        + READY_NOW_RISK_DELTA (+20) if the employee has any SuccessorEntry
          with status == ACTIVE and readiness_rating == READY_NOW
      risk_score = round_half_up( clamp(base + modifiers, 0, 100), 1 dp )
      The two variants produce different scores for identical employees
      whenever the trajectory differs from the latest rating.
    input_set: "the assessed employee (rating, rating_history, hire_date, is_high_potential, ACTIVE READY_NOW slate memberships); 'now' is the logical clock"
    constants:
      RATING_POINTS: { LOW: 20, SOLID: 50, STRONG: 80, EXCEPTIONAL: 100 }
      TREND_WEIGHTS: [0.5, 0.3, 0.2]
      TENURE_RISK_MONTHS: 24
      TENURE_RISK_DELTA: 15
      HIPO_RISK_DELTA: 10
      READY_NOW_RISK_DELTA: 20
    precision: "1 decimal place, round_half_up; intermediate weighted_rating 3 dp round_half_up"
    variants:
      - name: POINT_IN_TIME
        when: "assessment.assessment_method == POINT_IN_TIME"
        difference: "uses only the current performance_rating"
      - name: TREND
        when: "assessment.assessment_method == TREND"
        difference: "uses the decay-weighted trajectory of up to 3 calibration-applied ratings, renormalized when fewer exist"

  - name: risk_level
    trigger: "after every retention_risk_score computation"
    algorithm: threshold
    formula: |
      risk_level = LOW      if risk_score < 30
                 | MEDIUM   if 30 <= risk_score < 60
                 | HIGH     if 60 <= risk_score < 85
                 | CRITICAL if risk_score >= 85
    input_set: "the assessment's current risk_score"
    constants:
      RISK_MEDIUM_MIN: 30
      RISK_HIGH_MIN: 60
      RISK_CRITICAL_MIN: 85
    precision: "comparison against the stored (already rounded) risk_score"

  - name: slate_fill_selection
    trigger: "POST /talent/vacancies/{id}/fill-from-slate"
    algorithm: constraint_propagation
    formula: |
      eligibility: SuccessorEntry e where e.critical_role_id == vacancy.critical_role_id
        AND e.status == ACTIVE
        AND e.readiness_rating in {READY_NOW, READY_1_2}
        AND e.employee.employment_status == ACTIVE
      ranking: readiness_rank ASC (READY_NOW = 0, READY_1_2 = 1)
               -> readiness_score DESC
               -> slate_position ASC
               -> created_at ASC   (final tie-break; never id)
      fallback: empty pool -> ERR_NO_ELIGIBLE_SUCCESSOR.
      The single top-ranked entry is selected.
    input_set: "slate of the vacancy's critical role at request time"
    constants:
      READINESS_RANK: { READY_NOW: 0, READY_1_2: 1 }
    precision: "readiness_score compared at its stored 2 dp"

  - name: diversity_index
    trigger: "POST /talent/diversity-snapshots"
    algorithm: aggregation
    formula: |
      UNDERREPRESENTED_GROUPS = {GROUP_C, GROUP_D}.
      DEPARTMENT scope (scope_ref = department name):
        roles = CriticalRoles with department == scope_ref AND status in {ACTIVE, VACANT};
        for each role consider its ACTIVE SuccessorEntries;
        only roles with >= 1 ACTIVE entry participate;
        tier_weight: TIER_1 = 3, TIER_2 = 2, TIER_3 = 1;
        per_role_ratio r_role = underrepresented_active_entries / total_active_entries;
        diversity_index = round_half_up(
          sum(tier_weight_role * r_role) / sum(tier_weight_role) * 100, 2 dp )
        total_subjects = sum of total_active_entries over participating roles;
        if no role participates: total_subjects = 0, underrepresented_count = 0,
        diversity_index = null.
      HIPO_CYCLE scope (scope_ref = cycle id):
        population = nominations of the cycle with status in {ACTIVE, UNDER_REVIEW, GRADUATED};
        diversity_index = round_half_up( underrepresented / total * 100, 2 dp );
        empty population -> diversity_index = null, counts 0.
    input_set: "ACTIVE slate entries of in-scope roles (DEPARTMENT) or in-scope nominations (HIPO_CYCLE), measured at the logical-clock now"
    constants:
      UNDERREPRESENTED_GROUPS: [GROUP_C, GROUP_D]
      TIER_WEIGHT: { TIER_1: 3, TIER_2: 2, TIER_3: 1 }
    precision: "2 decimal places, round_half_up"

  - name: months_between
    trigger: "tenure checks (application eligibility) and retention risk tenure modifier"
    algorithm: chronological
    formula: |
      whole calendar months between hire_date (a date) and the logical-clock
      now: full month count, i.e. (now.year - hire.year) * 12 + (now.month -
      hire.month), minus 1 when now.day < hire.day. Comparison for posting
      eligibility: tenure_months >= min_tenure_months (equality passes).
      Comparison for retention modifier: tenure_months < TENURE_RISK_MONTHS.
    input_set: "employee.hire_date, logical clock"
    constants: {}
    precision: "integer months"

  - name: consent_deadline_arithmetic
    trigger: "application creation; consent / hold validation; deadline batch processing"
    algorithm: threshold
    formula: |
      consent_deadline = submitted_at + CONSENT_WINDOW_DAYS (14 days).
      Manager consent or hold is accepted iff now < consent_deadline
      (STRICT — at exactly the deadline the window is closed).
      hold_expires_at = hold_at + HOLD_DURATION_DAYS (30 days).
      Batch processing advances: PENDING_MANAGER_CONSENT with
      consent_deadline <= now -> CONSENT_GRANTED (deemed consent);
      MANAGER_HOLD with hold_expires_at <= now -> CONSENT_GRANTED.
      Vacancy.fill_deadline = vacancy.created_at + FILL_WINDOW_DAYS (60 days);
      fill accepted iff now <= fill_deadline (INCLUSIVE).
    input_set: "application timestamps, vacancy timestamps, logical clock"
    constants:
      CONSENT_WINDOW_DAYS: 14
      HOLD_DURATION_DAYS: 30
      FILL_WINDOW_DAYS: 60
      MAX_ACTIVE_HOLDS: 1
    precision: "second-precision datetimes; strict vs inclusive inequality pinned per rule above"

  - name: session_window_overlap
    trigger: "POST /talent/calibration-sessions"
    algorithm: interval_merge
    formula: |
      Session windows are HALF-OPEN intervals [scheduled_start, scheduled_end).
      A new session conflicts with an existing session of the SAME
      department_scope whose status in {SCHEDULED, IN_PROGRESS} iff
      new.start < existing.end AND existing.start < new.end.
      Adjacency (new.start == existing.end, or new.end == existing.start) is
      ALLOWED — zero-gap back-to-back sessions do not conflict.
      Resource being protected: the department's calibration calendar.
    input_set: "existing sessions of the same department_scope with status in {SCHEDULED, IN_PROGRESS}"
    constants: {}
    precision: "second-precision datetimes; half-open semantics"

  - name: posting_window_overlap
    trigger: "POST /talent/postings/{id}/publish"
    algorithm: interval_merge
    formula: |
      Posting windows are CLOSED date intervals [planned_open_date,
      planned_close_date] inclusive of both dates. At publish time the new
      posting conflicts with any OTHER posting of the SAME vacancy whose
      status == OPEN iff new.planned_open_date <= existing.planned_close_date
      AND existing.planned_open_date <= new.planned_close_date.
      Because the interval is closed at day granularity, a posting whose
      planned_open_date EQUALS the other's planned_close_date CONFLICTS
      (contrast with the half-open session calendar, where adjacency is
      allowed). Resource being protected: the vacancy's posting channel.
    input_set: "other postings of the same vacancy with status OPEN"
    constants: {}
    precision: "day granularity; closed-interval semantics"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present and role recognized", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "X-User-Role is listed in the endpoint's roles", error_id: ERR_UNAUTHORIZED, http_status: 403, applies_to: "all" }
  - { priority: 3, category: existence, check: "request body well-formed: required fields present, enum members valid, no undeclared fields (fields absent from the endpoint input schema, e.g. assessment_method on PATCH, are rejected)", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all" }
  - { priority: 4, category: existence, check: "path identifiers resolve to existing resources, validated left-to-right", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all templated endpoints" }
  - { priority: 5, category: state, check: "state preconditions of the requested operation, covering: per-entity transition validity (ERR_ROLE_INVALID_STATE on activate/retire and on slate-add to a RETIRED role; ERR_SUCCESSOR_INVALID_STATE; ERR_PLAN_INVALID_STATE; ERR_VACANCY_NOT_OPEN; ERR_POSTING_INVALID_STATE including apply-to-non-OPEN-posting; ERR_APPLICATION_INVALID_STATE; ERR_SESSION_INVALID_STATE; ERR_ENTRY_INVALID_STATE; ERR_CYCLE_INVALID_STATE; ERR_NOMINATION_INVALID_STATE; ERR_ASSESSMENT_INVALID_STATE; ERR_ALREADY_TERMINAL)", error_id: ERR_*_INVALID_STATE, http_status: 409, applies_to: "all transition endpoints and state-dependent creations" }
  - { priority: 6, category: state, check: "OCC: expected_critical_role_version equals the role's current version", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "PATCH /talent/critical-roles/{id}; POST /talent/critical-roles/{id}/successors" }
  - { priority: 7, category: business_safety, check: "segregation of duties: HiPo endorser != nominator; calibration ratifier != proposer", error_id: ERR_SEGREGATION_OF_DUTIES, http_status: 409, applies_to: "POST /talent/hipo-nominations/{id}/endorse; POST /talent/calibration-entries/{id}/ratify" }
  - { priority: 8, category: business_referential, check: "reporting-line ownership: X-User-ID must equal the subject employee's current_manager_id", error_id: ERR_NOT_REPORTING_MANAGER, http_status: 403, applies_to: "POST /talent/applications/{id}/consent; POST /talent/applications/{id}/hold; POST /talent/applications/{id}/release-hold; POST /talent/hipo-cycles/{id}/nominations; POST /talent/calibration-sessions/{id}/entries" }
  - { priority: 9, category: business_referential, check: "applicant self-service ownership: X-User-ID must equal application.employee_id", error_id: ERR_APPLICANT_NOT_SELF, http_status: 403, applies_to: "POST /talent/applications/{id}/withdraw; POST /talent/applications/{id}/respond-offer" }
  - { priority: 10, category: business_referential, check: "revision authorship: X-User-ID must equal entry.proposed_by_manager_id", error_id: ERR_NOT_ENTRY_PROPOSER, http_status: 403, applies_to: "POST /talent/calibration-entries/{id}/revise" }
  - { priority: 11, category: business_temporal, check: "consent/hold only while now < consent_deadline (strict)", error_id: ERR_CONSENT_WINDOW_CLOSED, http_status: 409, applies_to: "POST /talent/applications/{id}/consent; POST /talent/applications/{id}/hold" }
  - { priority: 12, category: business_temporal, check: "slate fill only while now <= fill_deadline (inclusive)", error_id: ERR_FILL_WINDOW_EXPIRED, http_status: 409, applies_to: "POST /talent/vacancies/{id}/fill-from-slate" }
  - { priority: 13, category: business_constraint, check: "referenced employees have employment_status == ACTIVE (applicant, successor candidate, nominee, incumbent at activation)", error_id: ERR_EMPLOYEE_NOT_ACTIVE, http_status: 409, applies_to: "POST /talent/postings/{id}/applications; POST /talent/critical-roles/{id}/successors; POST /talent/hipo-cycles/{id}/nominations; POST /talent/critical-roles/{id}/activate" }
  - { priority: 14, category: business_constraint, check: "applicant tenure_months >= posting.min_tenure_months", error_id: ERR_TENURE_REQUIREMENT, http_status: 409, applies_to: "POST /talent/postings/{id}/applications" }
  - { priority: 15, category: business_constraint, check: "applicant job_level >= posting.min_job_level", error_id: ERR_JOB_LEVEL_REQUIREMENT, http_status: 409, applies_to: "POST /talent/postings/{id}/applications" }
  - { priority: 16, category: business_constraint, check: "no other non-terminal application by the same employee on the same posting", error_id: ERR_DUPLICATE_APPLICATION, http_status: 409, applies_to: "POST /talent/postings/{id}/applications" }
  - { priority: 17, category: business_constraint, check: "no other non-terminal slate entry for the same employee on the same role", error_id: ERR_DUPLICATE_SLATE_ENTRY, http_status: 409, applies_to: "POST /talent/critical-roles/{id}/successors" }
  - { priority: 18, category: business_constraint, check: "non-terminal slate size < SLATE_MAX (5) unless supersede_entry_id is supplied", error_id: ERR_SLATE_FULL, http_status: 409, applies_to: "POST /talent/critical-roles/{id}/successors" }
  - { priority: 19, category: business_constraint, check: "slate_position free among the role's non-terminal entries (evaluated after any supersede removal)", error_id: ERR_SLATE_POSITION_TAKEN, http_status: 409, applies_to: "POST /talent/critical-roles/{id}/successors" }
  - { priority: 20, category: business_constraint, check: "at most one development plan per successor entry", error_id: ERR_PLAN_ALREADY_EXISTS, http_status: 409, applies_to: "POST /talent/successors/{id}/development-plan" }
  - { priority: 21, category: business_constraint, check: "cycle.enrolled_count < cycle.capacity at enrollment", error_id: ERR_PROGRAM_AT_CAPACITY, http_status: 409, applies_to: "POST /talent/hipo-nominations/{id}/enroll" }
  - { priority: 22, category: business_constraint, check: "no other non-terminal nomination of the same employee in the same cycle", error_id: ERR_DUPLICATE_NOMINATION, http_status: 409, applies_to: "POST /talent/hipo-cycles/{id}/nominations" }
  - { priority: 23, category: business_constraint, check: "session window half-open overlap within department_scope", error_id: ERR_SESSION_WINDOW_CONFLICT, http_status: 409, applies_to: "POST /talent/calibration-sessions" }
  - { priority: 24, category: business_constraint, check: "posting window closed-interval overlap within the vacancy at publish", error_id: ERR_POSTING_WINDOW_CONFLICT, http_status: 409, applies_to: "POST /talent/postings/{id}/publish" }
  - { priority: 25, category: business_constraint, check: "at most one calibration entry per employee per session", error_id: ERR_DUPLICATE_SESSION_SUBJECT, http_status: 409, applies_to: "POST /talent/calibration-sessions/{id}/entries" }
  - { priority: 26, category: business_constraint, check: "applicant.active_hold_count < MAX_ACTIVE_HOLDS (1) when placing a hold", error_id: ERR_HOLD_LIMIT_REACHED, http_status: 409, applies_to: "POST /talent/applications/{id}/hold" }
  - { priority: 27, category: business_constraint, check: "session finalize requires entry_count >= 1", error_id: ERR_SESSION_EMPTY, http_status: 409, applies_to: "POST /talent/calibration-sessions/{id}/finalize" }
  - { priority: 28, category: business_constraint, check: "session finalize requires ratified_count == entry_count", error_id: ERR_UNRATIFIED_ENTRIES_REMAIN, http_status: 409, applies_to: "POST /talent/calibration-sessions/{id}/finalize" }
  - { priority: 29, category: business_constraint, check: "plan completion requires completion_pct == 100", error_id: ERR_PLAN_INCOMPLETE, http_status: 409, applies_to: "PATCH /talent/development-plans/{id}" }
  - { priority: 30, category: business_constraint, check: "slate fill requires a non-empty eligible successor pool", error_id: ERR_NO_ELIGIBLE_SUCCESSOR, http_status: 409, applies_to: "POST /talent/vacancies/{id}/fill-from-slate" }
  - { priority: 31, category: business_constraint, check: "retention escalation requires risk_level in {HIGH, CRITICAL}", error_id: ERR_RISK_NOT_ESCALATABLE, http_status: 409, applies_to: "POST /talent/retention-assessments/{id}/escalate" }
  - { priority: 32, category: business_constraint, check: "close with outcome=MITIGATED requires recomputed risk_level in {LOW, MEDIUM}", error_id: ERR_RISK_STILL_HIGH, http_status: 409, applies_to: "POST /talent/retention-assessments/{id}/close" }
  - { priority: 33, category: business_constraint, check: "successor activation/reinstatement requires role status in {ACTIVE, VACANT}", error_id: ERR_ROLE_NOT_ACTIVE, http_status: 409, applies_to: "PATCH /talent/successors/{id}" }

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Employee ---
  - { method: POST, path: "/talent/employees", description: "Create an employee", roles: [HRAdmin], code: 201, input: [employee_code, full_name, department, job_level, hire_date, performance_rating, "demographic_group?", "current_manager_id?"], output: Employee, side_effects: ["rating_history initialized empty; employment_status ACTIVE; computed fields derived"] }
  - { method: GET, path: "/talent/employees", description: "List employees with filters", roles: [HRAdmin, HRBusinessPartner, TalentManager, Manager, Employee], code: 200, input: ["department?", "employment_status?", "current_manager_id?", "limit?", "offset?"], output: "Employee[]", side_effects: [] }
  - { method: GET, path: "/talent/employees/{id}", description: "Get one employee", roles: [HRAdmin, HRBusinessPartner, TalentManager, Manager, Employee], code: 200, input: [], output: Employee, side_effects: [] }
  - { method: POST, path: "/talent/employees/{id}/terminate", description: "Terminate an employee; fires the vacancy / slate-removal / posture-alert / auto-assessment cascade", roles: [HRAdmin], code: 200, input: [], output: Employee, side_effects: ["Employee terminate cascade L1-L7 (see state_machines.Employee)"] }

  # --- CriticalRole ---
  - { method: POST, path: "/talent/critical-roles", description: "Identify a critical role (PROPOSED)", roles: [HRBusinessPartner], code: 201, input: [role_title, department, criticality_tier, assessment_method], output: CriticalRole, side_effects: ["bench_strength := 0.00; bench_posture := EMPTY; posture_alert := false"] }
  - { method: GET, path: "/talent/critical-roles", description: "List critical roles with filters", roles: [HRAdmin, HRBusinessPartner, TalentManager, Manager, Employee], code: 200, input: ["department?", "status?", "bench_posture?", "incumbent_employee_id?", "limit?", "offset?"], output: "CriticalRole[]", side_effects: [] }
  - { method: GET, path: "/talent/critical-roles/{id}", description: "Get one critical role", roles: [HRAdmin, HRBusinessPartner, TalentManager, Manager, Employee], code: 200, input: [], output: CriticalRole, side_effects: [] }
  - { method: PATCH, path: "/talent/critical-roles/{id}", description: "Update role attributes (OCC-guarded)", roles: [HRBusinessPartner], code: 200, input: ["role_title?", "department?", "criticality_tier?", expected_critical_role_version], output: CriticalRole, side_effects: ["increments CriticalRole.version by 1; updated_at refreshed"] }
  - { method: POST, path: "/talent/critical-roles/{id}/activate", description: "Activate a PROPOSED role with its incumbent", roles: [HRBusinessPartner], code: 200, input: [incumbent_employee_id], output: CriticalRole, side_effects: ["status -> ACTIVE; incumbent set; increments CriticalRole.version by 1"] }
  - { method: POST, path: "/talent/critical-roles/{id}/retire", description: "Retire a role; cascades to slate, vacancy, postings, applications", roles: [HRBusinessPartner], code: 200, input: [], output: CriticalRole, side_effects: ["status -> RETIRED; non-terminal entries REMOVED; OPEN vacancy CLOSED_UNFILLED; OPEN postings CLOSED; their non-terminal applications REJECTED; increments CriticalRole.version by 1"] }

  # --- SuccessorEntry ---
  - { method: POST, path: "/talent/critical-roles/{id}/successors", description: "Add a successor entry (optionally superseding an existing entry atomically; OCC-guarded)", roles: [HRBusinessPartner], code: 201, input: [employee_id, readiness_rating, "slate_position?", "supersede_entry_id?", expected_critical_role_version], output: SuccessorEntry, side_effects: ["if supersede_entry_id given: that entry -> REMOVED first (frees its slate_position), then new entry created DRAFT; slate cardinality |{e: status in {DRAFT,ACTIVE,SUSPENDED}}| unchanged by a supersede; increments CriticalRole.version by 1; readiness_score computed"] }
  - { method: GET, path: "/talent/successors", description: "List successor entries with filters", roles: [HRAdmin, HRBusinessPartner, TalentManager, Manager, Employee], code: 200, input: ["critical_role_id?", "employee_id?", "status?", "limit?", "offset?"], output: "SuccessorEntry[]", side_effects: [] }
  - { method: GET, path: "/talent/successors/{id}", description: "Get one successor entry", roles: [HRAdmin, HRBusinessPartner, TalentManager, Manager, Employee], code: 200, input: [], output: SuccessorEntry, side_effects: [] }
  - { method: PATCH, path: "/talent/successors/{id}", description: "Update readiness_rating and/or drive status transitions DRAFT->ACTIVE, ACTIVE->SUSPENDED, SUSPENDED->ACTIVE", roles: [HRBusinessPartner], code: 200, input: ["readiness_rating?", "status?", "suspension_reason?"], output: SuccessorEntry, side_effects: ["on ACTIVE-set changes: role bench_strength / bench_posture recompute; posture_alert maintained; version increments"] }
  - { method: POST, path: "/talent/successors/{id}/remove", description: "Remove a non-terminal entry from the slate", roles: [HRBusinessPartner], code: 200, input: [], output: SuccessorEntry, side_effects: ["status -> REMOVED; role bench recomputes if entry was ACTIVE; posture_alert maintained"] }

  # --- DevelopmentPlan ---
  - { method: POST, path: "/talent/successors/{id}/development-plan", description: "Create the (single) development plan for a successor entry", roles: [HRBusinessPartner], code: 201, input: [target_readiness], output: DevelopmentPlan, side_effects: ["status DRAFT; completion_pct := 0"] }
  - { method: GET, path: "/talent/successors/{id}/development-plan", description: "Get the development plan of a successor entry (array of 0 or 1)", roles: [HRAdmin, HRBusinessPartner, TalentManager, Manager, Employee], code: 200, input: [], output: "DevelopmentPlan[]", side_effects: [] }
  - { method: PATCH, path: "/talent/development-plans/{id}", description: "Update completion_pct and/or drive status transitions DRAFT->ACTIVE, ACTIVE->COMPLETED, DRAFT|ACTIVE->ABANDONED", roles: [HRBusinessPartner], code: 200, input: ["completion_pct?", "status?"], output: DevelopmentPlan, side_effects: ["readiness_score recompute; on COMPLETED with higher target_readiness: entry.readiness_rating auto-upgrade; role bench recomputes"] }

  # --- Vacancy ---
  - { method: GET, path: "/talent/vacancies", description: "List vacancies with filters", roles: [HRAdmin, HRBusinessPartner, TalentManager, Manager, Employee], code: 200, input: ["critical_role_id?", "status?", "filled_by_employee_id?", "limit?", "offset?"], output: "Vacancy[]", side_effects: [] }
  - { method: GET, path: "/talent/vacancies/{id}", description: "Get one vacancy", roles: [HRAdmin, HRBusinessPartner, TalentManager, Manager, Employee], code: 200, input: [], output: Vacancy, side_effects: [] }
  - { method: POST, path: "/talent/vacancies/{id}/fill-from-slate", description: "Fill the vacancy with the top-ranked eligible successor (selector policy)", roles: [HRBusinessPartner], code: 200, input: [], output: Vacancy, side_effects: ["selected entry -> PROMOTED; vacancy FILLED (SUCCESSION_SLATE); role VACANT -> ACTIVE with new incumbent; role.version increments; bench recomputes; postings and applications of the vacancy are NOT modified by a slate fill"] }
  - { method: POST, path: "/talent/vacancies/{id}/close", description: "Close the vacancy unfilled", roles: [HRBusinessPartner], code: 200, input: ["closed_reason?"], output: Vacancy, side_effects: ["OPEN postings -> CLOSED; their non-terminal applications -> REJECTED"] }

  # --- InternalPosting ---
  - { method: POST, path: "/talent/vacancies/{id}/postings", description: "Create a posting (DRAFT) for the vacancy", roles: [HRBusinessPartner], code: 201, input: [title, planned_open_date, planned_close_date, "min_tenure_months?", "min_job_level?"], output: InternalPosting, side_effects: [] }
  - { method: GET, path: "/talent/postings", description: "List postings with filters", roles: [HRAdmin, HRBusinessPartner, TalentManager, Manager, Employee], code: 200, input: ["vacancy_id?", "status?", "limit?", "offset?"], output: "InternalPosting[]", side_effects: [] }
  - { method: GET, path: "/talent/postings/{id}", description: "Get one posting", roles: [HRAdmin, HRBusinessPartner, TalentManager, Manager, Employee], code: 200, input: [], output: InternalPosting, side_effects: [] }
  - { method: POST, path: "/talent/postings/{id}/publish", description: "Publish a DRAFT posting (window-overlap check against the vacancy's OPEN postings)", roles: [HRBusinessPartner], code: 200, input: [], output: InternalPosting, side_effects: ["status -> OPEN"] }
  - { method: POST, path: "/talent/postings/{id}/close", description: "Close an OPEN posting (or cancel a DRAFT one)", roles: [HRBusinessPartner], code: 200, input: [], output: InternalPosting, side_effects: ["OPEN -> CLOSED: non-terminal applications -> REJECTED; DRAFT -> CANCELLED"] }

  # --- PostingApplication ---
  - { method: POST, path: "/talent/postings/{id}/applications", description: "Apply to a posting (applicant = X-User-ID); eligibility and consent-window policy applied", roles: [Employee], code: 201, input: [], output: PostingApplication, side_effects: ["status PENDING_MANAGER_CONSENT, or CONSENT_GRANTED when the applicant has no current manager; submitted_at / consent_deadline stamped from the logical clock; posting.application_count recomputes"] }
  - { method: GET, path: "/talent/applications", description: "List applications with filters", roles: [HRAdmin, HRBusinessPartner, TalentManager, Manager, Employee], code: 200, input: ["posting_id?", "employee_id?", "status?", "limit?", "offset?"], output: "PostingApplication[]", side_effects: [] }
  - { method: GET, path: "/talent/applications/{id}", description: "Get one application", roles: [HRAdmin, HRBusinessPartner, TalentManager, Manager, Employee], code: 200, input: [], output: PostingApplication, side_effects: [] }
  - { method: POST, path: "/talent/applications/{id}/consent", description: "Manager grants mobility consent within the consent window", roles: [Manager], code: 200, input: [], output: PostingApplication, side_effects: ["status -> CONSENT_GRANTED"] }
  - { method: POST, path: "/talent/applications/{id}/hold", description: "Manager places a hold (reason required; consumes the applicant's single active-hold slot)", roles: [Manager], code: 200, input: [hold_reason], output: PostingApplication, side_effects: ["status -> MANAGER_HOLD; hold_at / hold_expires_at stamped; applicant.active_hold_count recomputes"] }
  - { method: POST, path: "/talent/applications/{id}/release-hold", description: "Manager releases a hold early (compensating action for hold)", roles: [Manager], code: 200, input: [], output: PostingApplication, side_effects: ["status -> CONSENT_GRANTED; applicant.active_hold_count recomputes"] }
  - { method: POST, path: "/talent/applications/{id}/withdraw", description: "Applicant withdraws a non-terminal application", roles: [Employee], code: 200, input: [], output: PostingApplication, side_effects: ["status -> WITHDRAWN; frees active hold if MANAGER_HOLD; posting.application_count recomputes"] }
  - { method: POST, path: "/talent/applications/{id}/advance", description: "HRBP advances: CONSENT_GRANTED->INTERVIEWING, INTERVIEWING->OFFER_EXTENDED, CONSENT_GRANTED|INTERVIEWING->REJECTED", roles: [HRBusinessPartner], code: 200, input: [target_state], output: PostingApplication, side_effects: ["OFFER_EXTENDED requires posting OPEN and vacancy OPEN"] }
  - { method: POST, path: "/talent/applications/{id}/respond-offer", description: "Applicant accepts or declines an extended offer; acceptance fills the vacancy", roles: [Employee], code: 200, input: [decision], output: PostingApplication, side_effects: ["ACCEPT: vacancy FILLED (INTERNAL_POSTING); role VACANT -> ACTIVE; posting CLOSED; other non-terminal applications REJECTED; applicant's entry on this role (ACTIVE|SUSPENDED) -> PROMOTED; bench recomputes"] }
  - { method: POST, path: "/talent/consent-deadlines/process", description: "Batch: advance applications whose consent window lapsed without manager action (deemed consent) and whose holds expired", roles: [HRAdmin], code: 200, input: [], output: { advanced_consent_count: integer, advanced_hold_count: integer }, side_effects: ["expired PENDING_MANAGER_CONSENT -> CONSENT_GRANTED; expired MANAGER_HOLD -> CONSENT_GRANTED with active_hold_count recompute"] }

  # --- CalibrationSession / CalibrationEntry ---
  - { method: POST, path: "/talent/calibration-sessions", description: "Schedule a calibration session (department-calendar half-open overlap check)", roles: [TalentManager], code: 201, input: [name, department_scope, scheduled_start, scheduled_end], output: CalibrationSession, side_effects: [] }
  - { method: GET, path: "/talent/calibration-sessions", description: "List calibration sessions with filters", roles: [HRAdmin, HRBusinessPartner, TalentManager, Manager, Employee], code: 200, input: ["department_scope?", "status?", "limit?", "offset?"], output: "CalibrationSession[]", side_effects: [] }
  - { method: GET, path: "/talent/calibration-sessions/{id}", description: "Get one calibration session", roles: [HRAdmin, HRBusinessPartner, TalentManager, Manager, Employee], code: 200, input: [], output: CalibrationSession, side_effects: [] }
  - { method: POST, path: "/talent/calibration-sessions/{id}/start", description: "Open the session for calibration", roles: [TalentManager], code: 200, input: [], output: CalibrationSession, side_effects: ["status -> IN_PROGRESS"] }
  - { method: POST, path: "/talent/calibration-sessions/{id}/finalize", description: "Finalize: apply all ratified ratings and fire the rating -> readiness_score -> bench cascade", roles: [TalentManager], code: 200, input: [], output: CalibrationSession, side_effects: ["session finalize cascade L1-L4 (see state_machines.CalibrationSession)"] }
  - { method: POST, path: "/talent/calibration-sessions/{id}/entries", description: "Propose a rating for an employee (proposer = their current manager)", roles: [Manager], code: 201, input: [employee_id, proposed_rating], output: CalibrationEntry, side_effects: ["session.entry_count recomputes; proposed_by_manager_id := X-User-ID"] }
  - { method: GET, path: "/talent/calibration-entries", description: "List calibration entries with filters", roles: [HRAdmin, HRBusinessPartner, TalentManager, Manager, Employee], code: 200, input: ["session_id?", "employee_id?", "proposed_by_manager_id?", "status?", "limit?", "offset?"], output: "CalibrationEntry[]", side_effects: [] }
  - { method: GET, path: "/talent/calibration-entries/{id}", description: "Get one calibration entry", roles: [HRAdmin, HRBusinessPartner, TalentManager, Manager, Employee], code: 200, input: [], output: CalibrationEntry, side_effects: [] }
  - { method: POST, path: "/talent/calibration-entries/{id}/challenge", description: "Challenge a proposed rating (opens the revise loop)", roles: [TalentManager], code: 200, input: [], output: CalibrationEntry, side_effects: ["status -> CHALLENGED; challenge_count + 1"] }
  - { method: POST, path: "/talent/calibration-entries/{id}/revise", description: "Original proposer revises a challenged rating", roles: [Manager], code: 200, input: [proposed_rating], output: CalibrationEntry, side_effects: ["status -> PROPOSED; proposed_rating := input"] }
  - { method: POST, path: "/talent/calibration-entries/{id}/ratify", description: "Ratify an entry with its final rating (ratifier != proposer)", roles: [TalentManager], code: 200, input: [final_rating], output: CalibrationEntry, side_effects: ["status -> RATIFIED; calibrated_rating := final_rating; session.ratified_count recomputes"] }

  # --- HiPoProgramCycle / HiPoNomination ---
  - { method: POST, path: "/talent/hipo-cycles", description: "Open a high-potential program cycle with a seat capacity", roles: [HRAdmin], code: 201, input: [cycle_name, capacity], output: HiPoProgramCycle, side_effects: ["enrolled_count := 0"] }
  - { method: GET, path: "/talent/hipo-cycles", description: "List program cycles", roles: [HRAdmin, HRBusinessPartner, TalentManager, Manager, Employee], code: 200, input: ["status?", "limit?", "offset?"], output: "HiPoProgramCycle[]", side_effects: [] }
  - { method: GET, path: "/talent/hipo-cycles/{id}", description: "Get one program cycle", roles: [HRAdmin, HRBusinessPartner, TalentManager, Manager, Employee], code: 200, input: [], output: HiPoProgramCycle, side_effects: [] }
  - { method: POST, path: "/talent/hipo-cycles/{id}/close", description: "Close the cycle; graduate active members, reject pending nominations", roles: [HRAdmin], code: 200, input: [], output: HiPoProgramCycle, side_effects: ["ACTIVE|UNDER_REVIEW nominations -> GRADUATED; NOMINATED|ENDORSED -> REJECTED; enrolled_count := 0"] }
  - { method: POST, path: "/talent/hipo-cycles/{id}/nominations", description: "Nominate a direct report into the cycle", roles: [Manager], code: 201, input: [employee_id], output: HiPoNomination, side_effects: ["nominated_by_manager_id := X-User-ID"] }
  - { method: GET, path: "/talent/hipo-nominations", description: "List nominations with filters", roles: [HRAdmin, HRBusinessPartner, TalentManager, Manager, Employee], code: 200, input: ["cycle_id?", "employee_id?", "nominated_by_manager_id?", "status?", "limit?", "offset?"], output: "HiPoNomination[]", side_effects: [] }
  - { method: GET, path: "/talent/hipo-nominations/{id}", description: "Get one nomination", roles: [HRAdmin, HRBusinessPartner, TalentManager, Manager, Employee], code: 200, input: [], output: HiPoNomination, side_effects: [] }
  - { method: POST, path: "/talent/hipo-nominations/{id}/endorse", description: "HRBP endorses a nomination (endorser != nominator)", roles: [HRBusinessPartner], code: 200, input: [], output: HiPoNomination, side_effects: ["status -> ENDORSED; endorsed_by_id := X-User-ID"] }
  - { method: POST, path: "/talent/hipo-nominations/{id}/reject", description: "HRBP rejects a pending nomination", roles: [HRBusinessPartner], code: 200, input: [], output: HiPoNomination, side_effects: ["status -> REJECTED"] }
  - { method: POST, path: "/talent/hipo-nominations/{id}/enroll", description: "Enroll an endorsed nomination (capacity check)", roles: [TalentManager], code: 200, input: [], output: HiPoNomination, side_effects: ["status -> ACTIVE; cycle.enrolled_count recomputes; employee.is_high_potential recomputes"] }
  - { method: POST, path: "/talent/hipo-nominations/{id}/remove", description: "Remove an ACTIVE member (frees the seat; compensating action for enroll)", roles: [TalentManager], code: 200, input: [], output: HiPoNomination, side_effects: ["status -> REMOVED; cycle.enrolled_count recomputes; employee.is_high_potential recomputes"] }
  - { method: POST, path: "/talent/hipo-nominations/{id}/start-review", description: "Open a periodic review of an ACTIVE member", roles: [TalentManager], code: 200, input: [], output: HiPoNomination, side_effects: ["status -> UNDER_REVIEW"] }
  - { method: POST, path: "/talent/hipo-nominations/{id}/complete-review", description: "Complete the review: RETAIN returns to ACTIVE (review_count + 1); REMOVE ends membership (seat freed)", roles: [TalentManager], code: 200, input: [outcome], output: HiPoNomination, side_effects: ["RETAIN: status -> ACTIVE, review_count + 1; REMOVE: status -> REMOVED, enrolled_count recomputes, is_high_potential recomputes"] }

  # --- RetentionAssessment ---
  - { method: POST, path: "/talent/employees/{id}/retention-assessments", description: "Create a retention risk assessment for an employee (risk computed per method variant)", roles: [HRBusinessPartner], code: 201, input: [assessment_method], output: RetentionAssessment, side_effects: ["risk_score / risk_level computed; trigger_source := MANUAL"] }
  - { method: GET, path: "/talent/retention-assessments", description: "List retention assessments with filters", roles: [HRAdmin, HRBusinessPartner, TalentManager, Manager, Employee], code: 200, input: ["employee_id?", "status?", "risk_level?", "trigger_source?", "limit?", "offset?"], output: "RetentionAssessment[]", side_effects: [] }
  - { method: GET, path: "/talent/retention-assessments/{id}", description: "Get one retention assessment", roles: [HRAdmin, HRBusinessPartner, TalentManager, Manager, Employee], code: 200, input: [], output: RetentionAssessment, side_effects: [] }
  - { method: POST, path: "/talent/retention-assessments/{id}/plan-action", description: "Commit a retention action (from OPEN or ESCALATED)", roles: [HRBusinessPartner], code: 200, input: [action_type, action_deadline], output: RetentionAssessment, side_effects: ["status -> ACTION_PLANNED"] }
  - { method: POST, path: "/talent/retention-assessments/{id}/escalate", description: "Escalate an ACTION_PLANNED assessment (requires HIGH or CRITICAL risk)", roles: [HRBusinessPartner], code: 200, input: [], output: RetentionAssessment, side_effects: ["status -> ESCALATED"] }
  - { method: POST, path: "/talent/retention-assessments/{id}/close", description: "Close: outcome=MITIGATED (from ACTION_PLANNED, risk recompute must be LOW/MEDIUM) or DISMISSED (from OPEN)", roles: [HRBusinessPartner], code: 200, input: [outcome], output: RetentionAssessment, side_effects: ["MITIGATED: risk_score / risk_level refreshed to recomputed values"] }

  # --- DiversitySnapshot ---
  - { method: POST, path: "/talent/diversity-snapshots", description: "Capture an immutable pipeline-diversity measurement for a department or HiPo cycle", roles: [HRAdmin], code: 201, input: [scope_type, scope_ref], output: DiversitySnapshot, side_effects: ["diversity_index / counts computed at the logical-clock now"] }
  - { method: GET, path: "/talent/diversity-snapshots", description: "List diversity snapshots with filters", roles: [HRAdmin, HRBusinessPartner, TalentManager, Manager, Employee], code: 200, input: ["scope_type?", "limit?", "offset?"], output: "DiversitySnapshot[]", side_effects: [] }
  - { method: GET, path: "/talent/diversity-snapshots/{id}", description: "Get one diversity snapshot", roles: [HRAdmin, HRBusinessPartner, TalentManager, Manager, Employee], code: 200, input: [], output: DiversitySnapshot, side_effects: [] }

  # --- Logical clock (test-driving) ---
  - { method: POST, path: "/talent/_clock/set_current_utc", description: "Set the logical clock. Startup default is exactly 2026-05-01T00:00:00Z; before any set_current_utc call the clock reads this default and never falls back to wall-clock time. All deadlines, windows, tenure and timestamps derive from this clock.", roles: [HRAdmin], code: 200, input: [to_iso8601], output: { current_utc: string }, side_effects: ["logical clock advanced to to_iso8601"] }

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or unrecognized X-User-Role / X-User-ID headers" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted on this endpoint" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body: missing required field, invalid enum member, undeclared field (e.g. immutable assessment_method on PATCH), constraint violation (job_level out of 1..10, completion_pct out of 0..100, planned_close_date < planned_open_date, scheduled_end <= scheduled_start)" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "A path identifier does not resolve to an existing resource (checked left-to-right)" }
  - { id: ERR_ALREADY_TERMINAL, http: 409, condition: "Terminate invoked on an employee already TERMINATED" }
  - { id: ERR_ROLE_INVALID_STATE, http: 409, condition: "CriticalRole transition attempted from an invalid status (activate non-PROPOSED; retire from PROPOSED/RETIRED; slate entry added to a RETIRED role)" }
  - { id: ERR_ROLE_NOT_ACTIVE, http: 409, condition: "Successor activation/reinstatement while the role is not in {ACTIVE, VACANT}" }
  - { id: ERR_SUCCESSOR_INVALID_STATE, http: 409, condition: "SuccessorEntry transition attempted from an invalid status (suspend non-ACTIVE, reinstate non-SUSPENDED, remove a terminal entry, plan activation for a non-ACTIVE entry)" }
  - { id: ERR_PLAN_INVALID_STATE, http: 409, condition: "DevelopmentPlan transition attempted from an invalid status" }
  - { id: ERR_PLAN_INCOMPLETE, http: 409, condition: "Plan completion requested with completion_pct < 100" }
  - { id: ERR_PLAN_ALREADY_EXISTS, http: 409, condition: "Second development plan created for the same successor entry" }
  - { id: ERR_VACANCY_NOT_OPEN, http: 409, condition: "Operation requires an OPEN vacancy (fill, close, posting publish, offer extension) but the vacancy is FILLED or CLOSED_UNFILLED" }
  - { id: ERR_FILL_WINDOW_EXPIRED, http: 409, condition: "fill-from-slate attempted after vacancy.fill_deadline (now > fill_deadline)" }
  - { id: ERR_NO_ELIGIBLE_SUCCESSOR, http: 409, condition: "Selector pool empty: no ACTIVE slate entry with readiness in {READY_NOW, READY_1_2} whose employee is ACTIVE" }
  - { id: ERR_POSTING_INVALID_STATE, http: 409, condition: "Posting transition attempted from an invalid status (publish non-DRAFT, close non-OPEN/non-DRAFT, apply to a non-OPEN posting)" }
  - { id: ERR_POSTING_WINDOW_CONFLICT, http: 409, condition: "Publishing would overlap another OPEN posting of the same vacancy under CLOSED date-interval semantics (shared open/close date counts as conflict)" }
  - { id: ERR_APPLICATION_INVALID_STATE, http: 409, condition: "Application transition attempted from an invalid status (including advance target not allowed from the current status, or any action on a terminal application)" }
  - { id: ERR_NOT_REPORTING_MANAGER, http: 403, condition: "X-User-ID is not the subject employee's current_manager_id (consent, hold, release-hold, nomination, calibration proposal)" }
  - { id: ERR_NOT_ENTRY_PROPOSER, http: 403, condition: "Revise attempted by someone other than the entry's proposing manager" }
  - { id: ERR_APPLICANT_NOT_SELF, http: 403, condition: "Employee self-service action (withdraw, respond-offer) attempted on another employee's application" }
  - { id: ERR_CONSENT_WINDOW_CLOSED, http: 409, condition: "Consent or hold attempted at or after application.consent_deadline (window is strict: now < deadline)" }
  - { id: ERR_HOLD_LIMIT_REACHED, http: 409, condition: "Hold attempted while the applicant already has MAX_ACTIVE_HOLDS (1) application in MANAGER_HOLD" }
  - { id: ERR_TENURE_REQUIREMENT, http: 409, condition: "Applicant tenure_months < posting.min_tenure_months" }
  - { id: ERR_JOB_LEVEL_REQUIREMENT, http: 409, condition: "Applicant job_level < posting.min_job_level" }
  - { id: ERR_DUPLICATE_APPLICATION, http: 409, condition: "Same employee already has a non-terminal application on this posting" }
  - { id: ERR_DUPLICATE_SLATE_ENTRY, http: 409, condition: "Same employee already has a non-terminal entry on this role's slate" }
  - { id: ERR_SLATE_FULL, http: 409, condition: "Role already has SLATE_MAX (5) non-terminal entries and no supersede_entry_id was supplied" }
  - { id: ERR_SLATE_POSITION_TAKEN, http: 409, condition: "Requested slate_position is occupied by another non-terminal entry of the role (after any supersede removal)" }
  - { id: ERR_SESSION_INVALID_STATE, http: 409, condition: "CalibrationSession transition attempted from an invalid status (start non-SCHEDULED, finalize non-IN_PROGRESS) or entry action while the session is not IN_PROGRESS" }
  - { id: ERR_SESSION_WINDOW_CONFLICT, http: 409, condition: "Session window overlaps another session of the same department_scope under HALF-OPEN semantics (adjacency allowed)" }
  - { id: ERR_SESSION_EMPTY, http: 409, condition: "Finalize attempted with entry_count == 0" }
  - { id: ERR_UNRATIFIED_ENTRIES_REMAIN, http: 409, condition: "Finalize attempted while ratified_count < entry_count" }
  - { id: ERR_ENTRY_INVALID_STATE, http: 409, condition: "CalibrationEntry transition attempted from an invalid status (challenge non-PROPOSED, revise non-CHALLENGED, ratify non-PROPOSED/non-CHALLENGED)" }
  - { id: ERR_DUPLICATE_SESSION_SUBJECT, http: 409, condition: "Second calibration entry for the same employee in the same session" }
  - { id: ERR_CYCLE_INVALID_STATE, http: 409, condition: "Operation requires an OPEN cycle (endorse, enroll, nominate) but the cycle is CLOSED, or close attempted on a CLOSED cycle" }
  - { id: ERR_NOMINATION_INVALID_STATE, http: 409, condition: "HiPoNomination transition attempted from an invalid status" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 409, condition: "Same person performs two segregated steps: HiPo endorser equals nominator, or calibration ratifier equals proposer" }
  - { id: ERR_PROGRAM_AT_CAPACITY, http: 409, condition: "Enroll attempted while cycle.enrolled_count >= cycle.capacity" }
  - { id: ERR_DUPLICATE_NOMINATION, http: 409, condition: "Same employee already has a non-terminal nomination in this cycle" }
  - { id: ERR_ASSESSMENT_INVALID_STATE, http: 409, condition: "RetentionAssessment transition attempted from an invalid status" }
  - { id: ERR_RISK_NOT_ESCALATABLE, http: 409, condition: "Escalate attempted while risk_level is LOW or MEDIUM" }
  - { id: ERR_RISK_STILL_HIGH, http: 409, condition: "Close with outcome=MITIGATED but the recomputed risk_level is HIGH or CRITICAL" }
  - { id: ERR_EMPLOYEE_NOT_ACTIVE, http: 409, condition: "Referenced employee is TERMINATED (applicant, successor candidate, nominee, incumbent at activation)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_critical_role_version does not match the role's current version (OCC)" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: HRAdmin
    description: "Central HR operations administrator; owns employee lifecycle, program cycles, diversity measurement, the logical clock, and deadline batch processing"
    identity: opaque
    exclusive_operations:
      - "POST /talent/employees"
      - "POST /talent/employees/{id}/terminate"
      - "POST /talent/hipo-cycles"
      - "POST /talent/hipo-cycles/{id}/close"
      - "POST /talent/diversity-snapshots"
      - "POST /talent/consent-deadlines/process"
      - "POST /talent/_clock/set_current_utc"
    shared_operations: ["all GET endpoints"]

  - name: HRBusinessPartner
    description: "HR business partner; owns critical roles, succession slates, development plans, vacancies, postings, application advancement, retention assessments, HiPo endorsement"
    identity: entity_backed:Employee
    exclusive_operations:
      - "POST /talent/critical-roles and PATCH /talent/critical-roles/{id}"
      - "POST /talent/critical-roles/{id}/activate and /retire"
      - "POST /talent/critical-roles/{id}/successors"
      - "PATCH /talent/successors/{id} and POST /talent/successors/{id}/remove"
      - "POST /talent/successors/{id}/development-plan and PATCH /talent/development-plans/{id}"
      - "POST /talent/vacancies/{id}/fill-from-slate and /close"
      - "POST /talent/vacancies/{id}/postings; POST /talent/postings/{id}/publish and /close"
      - "POST /talent/applications/{id}/advance"
      - "POST /talent/employees/{id}/retention-assessments; plan-action / escalate / close"
      - "POST /talent/hipo-nominations/{id}/endorse and /reject"
    shared_operations: ["all GET endpoints"]

  - name: TalentManager
    description: "Talent management facilitator; runs calibration sessions and administers HiPo program membership"
    identity: entity_backed:Employee
    exclusive_operations:
      - "POST /talent/calibration-sessions; /start; /finalize"
      - "POST /talent/calibration-entries/{id}/challenge and /ratify"
      - "POST /talent/hipo-nominations/{id}/enroll, /remove, /start-review, /complete-review"
    shared_operations: ["all GET endpoints"]

  - name: Manager
    description: "People manager (an employee with direct reports); proposes calibration ratings, consents to or holds team members' internal applications, nominates direct reports to HiPo"
    identity: entity_backed:Employee
    exclusive_operations:
      - "POST /talent/calibration-sessions/{id}/entries"
      - "POST /talent/calibration-entries/{id}/revise"
      - "POST /talent/applications/{id}/consent, /hold, /release-hold"
      - "POST /talent/hipo-cycles/{id}/nominations"
    shared_operations: ["all GET endpoints"]

  - name: Employee
    description: "Individual contributor self-service: apply to internal postings, withdraw applications, respond to offers"
    identity: entity_backed:Employee
    exclusive_operations:
      - "POST /talent/postings/{id}/applications"
      - "POST /talent/applications/{id}/withdraw"
      - "POST /talent/applications/{id}/respond-offer"
    shared_operations: ["all GET endpoints"]
