    grounds:
    - calculations.tariff_schedule_resolution
    - entities.VesselOrder.fields.tariff_schedule_id
    distinguishing_aspect: With S1 effective 2026-01-01 and S2 effective 2026-07-01 (both <= clock 2026-08-01), the ACTIVE schedule is S2; S1 reads SUPERSEDED; a new order pins S2 and prices at S2's rates.
    test_recipe:
      setup:
      - S1 (single tier rate 20) then S2 (single tier rate 100) published
      setup_api_calls:
      - call: POST /pilotage/tariff-schedules
        payload:
          effective_from: '2026-01-01T00:00:00Z'
          tiers:
          - min_gt_exclusive: 0
            max_gt_inclusive: null
            rate_cents_per_gt: 20
          draft_surcharge_threshold_dm: 100
          draft_surcharge_pct: 0.15
