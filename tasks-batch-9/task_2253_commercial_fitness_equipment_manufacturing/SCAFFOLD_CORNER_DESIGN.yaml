  - name: parts_receipt_accumulates_stock_without_touching_reservations
    claim_type: action
    grounds:
    - endpoints[POST /service-partners/{id}/parts-receipt]
    - calculations.spare_stock_ledger
    - entities.ServicePartner.fields.spare_stock_received_units
    distinguishing_aspect: Two receipts against the same partner accumulate rather than overwrite (12 then 8 -> received 20) and land entirely in on_hand, leaving reserved and consumed at 0 so the conservation
      identity received == on_hand + reserved + consumed holds after each call.
    test_recipe:
      setup:
      - Partner Meridian Service Co exists with no spare stock and no maintenance visits.
      setup_api_calls:
      - call: POST /service-partners
        payload: {name: Meridian Service Co, region: R_NORTH, certified_categories: [CARDIO], certified_technician_count: 3, certified_hours_capacity: 100.0, training_current_until: '2027-12-31T00:00:00Z'}
        as: ServiceOpsAdmin
        captures: {p1: $.data.id}
      trigger:
      - call: POST /service-partners/${p1}/parts-receipt
        payload: {units: 12}
        as: ServiceOpsAdmin
      - call: GET /service-partners/${p1}
        payload: {}
        as: ServiceOpsAdmin
      - call: POST /service-partners/${p1}/parts-receipt
        payload: {units: 8}
        as: ServiceOpsAdmin
      - call: GET /service-partners/${p1}
        payload: {}
        as: ServiceOpsAdmin
      assert:
      - the first receipt returns 200 with spare_stock_received_units == 12 and spare_stock_on_hand_units == 12
      - after the first receipt spare_stock_reserved_units == 0 and spare_stock_consumed_units == 0
      - the second receipt returns 200 with spare_stock_received_units == 20 (accumulated, not replaced) and spare_stock_on_hand_units == 20
      - 'the conservation identity holds after both calls: 20 == 20 + 0 + 0'
      - ServicePartner.${p1}.committed_hours == 0.00 and coverage_status == ACTIVE — stock does not touch capacity
