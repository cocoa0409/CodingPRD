              payload: { current_utc: "2026-04-21T09:00:00Z" }
              as: ProgramAdmin
            - call: "GET /ei/referrals/${ref_id}/timeline-compliance"
              as: ProgramAdmin
          assert:
            - "Trigger 1: response.data.monthly_contact_status == \"DUE\" and last_qualifying_contact_date == null"
            - "Trigger 2: HTTP 201 with response.data.qualifies_for_monthly_requirement == false and contact_month == \"2026-03\""
            - "Trigger 3: response.data.monthly_contact_status == \"DUE\" — an EMAIL contact never satisfies the requirement"
            - "Trigger 4: HTTP 201 with response.data.qualifies_for_monthly_requirement == true"
            - "Trigger 5: response.data.monthly_contact_status == \"COMPLIANT\" and last_qualifying_contact_date == \"2026-03-20\""
            - "Trigger 7: response.data.monthly_contact_status == \"DELINQUENT\" — April has no qualifying contact and day 21 is past GRACE_DAY_OF_MONTH 20; last_qualifying_contact_date is still \"2026-03-20\""

      - name: exit_progress_categories_span_regression_progress_and_age_level
        claim_type: correct_result
        grounds:
          - calculations.child_outcome_progress_category
          - entities.Referral.fields.service_duration_days
          - endpoints[POST /ei/referrals/{referralId}/exit]
        distinguishing_aspect: |
          One exit exercises three different COSF branches at once from entry 3/4/3 to exit 2/5/6 over
          195 service days: social regressed (2 < 3) -> a, knowledge progressed but is still below the
          age-expected 6 (5 > 4, 5 < 6) -> c, and needs reached the age-expected level from below
          (6 >= 6 with entry 3 < 6) -> d. A single shared branch cannot produce all three.
        test_recipe:
          setup:
            - "An ACTIVE_SERVICES referral with entry ratings 3 / 4 / 3 recorded on 2026-03-20 and services_start_date 2026-03-20."
            - "Logical clock advanced to 2026-10-01T09:00:00Z, exactly 195 days after the service start."
