            - call: "POST /car-hire/disputes"
              payload: { settlement_cycle_id: "${cycle_id}", movement_id: "${m3_id}", dispute_reason: "DUPLICATE_CHARGE", disputed_amount_cents: 4700, expected_cycle_version: "${cyc_v}" }
              as: CarHireAccountant
