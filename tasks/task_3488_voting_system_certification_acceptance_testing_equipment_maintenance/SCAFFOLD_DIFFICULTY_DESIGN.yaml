# =============================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3488_voting_system_certification_acceptance_testing_equipment_maintenance
# Depth probe: 9 Difficulty Rules x >=2 instances, grounded in SCAFFOLD.yaml
# 1.1-1.7. All times are logical-clock times; default clock 2026-09-01T00:00:00Z.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: campaign_conformity_screen_vs_final_diverge
        grounds:
          - calculations.campaign_conformity_score
          - entities.CertificationCampaign.fields.conformity_screen_bp
          - entities.CertificationCampaign.fields.conformity_final_bp
        distinguishing_aspect: "On the certification-campaign domain, the LAB_SCREEN (forward-looking) and FINAL_AUDIT (chronological, aging) variants score identical counter state differently: with 1 critical + 2 major + 3 minor open, 1 resubmission and 14 days of aging, screen=7725 but final=7430."
        test_recipe:
          setup:
            - "Campaign with resubmission_count 1, open counts 1 critical / 2 major / 3 minor, last_submitted_at 2026-09-01, current clock 2026-09-15."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /evote/voting-systems"
              payload: { vendor_name: "Election Systems and Software", model_name: "DS450", software_baseline_version: "1.0.0", hardware_class: "OPTICAL_SCANNER" }
              as: PlatformAdmin
              captures: { sys_id: $.data.id }
            - call: "POST /evote/test-laboratories"
              payload: { lab_code: "LAB-A", lab_name: "Alpha Test Lab", accreditation_scope: "DUAL", max_concurrent_campaigns: 3 }
              as: PlatformAdmin
              captures: { lab_id: $.data.id }
            - call: "POST /evote/certification-campaigns"
              payload: { voting_system_id: "${sys_id}", lab_id: "${lab_id}", guidelines_baseline: "VVSG_2_0", state_code: "CA" }
              as: VendorRep
              captures: { camp_id: $.data.id }
            - call: "POST /evote/certification-campaigns/${camp_id}/transitions"
              payload: { to_state: "IN_TEST" }
              as: LabAgent
              as_user_id: "${lab_id}"
            - call: "POST /evote/certification-campaigns/${camp_id}/transitions"
              payload: { to_state: "DEFICIENCIES_FILED", critical_count: 0, major_count: 0, minor_count: 1 }
              as: LabAgent
              as_user_id: "${lab_id}"
            - call: "POST /evote/certification-campaigns/${camp_id}/transitions"
              payload: { to_state: "SUBMITTED", resolved_critical: 0, resolved_major: 0, resolved_minor: 1 }
              as: VendorRep
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /evote/certification-campaigns/${camp_id}/transitions"
              payload: { to_state: "IN_TEST" }
              as: LabAgent
              as_user_id: "${lab_id}"
            - call: "POST /evote/certification-campaigns/${camp_id}/transitions"
              payload: { to_state: "DEFICIENCIES_FILED", critical_count: 1, major_count: 2, minor_count: 3 }
              as: LabAgent
              as_user_id: "${lab_id}"
          trigger:
            - call: "GET /evote/certification-campaigns/${camp_id}"
              payload: {}
              as: CertificationAuthority
          assert:
            - "CertificationCampaign.${camp_id}.conformity_screen_bp == 7725"
            - "CertificationCampaign.${camp_id}.conformity_final_bp == 7430"
            - "conformity_screen_bp != conformity_final_bp for identical counter state"
            - "CertificationCampaign.${camp_id}.status == DEFICIENCIES_FILED and resubmission_count == 1"

      - name: fleet_readiness_optimistic_exceeds_conservative
        grounds:
          - calculations.fleet_readiness
          - entities.EquipmentUnit.fields.operational_status
          - endpoints.GET_/evote/election-definitions/{id}/readiness
        distinguishing_aspect: "On the equipment-fleet domain (different domain from campaign_conformity_score), the OPTIMISTIC variant counts stored units and in-maintenance units projected done before election day while CONSERVATIVE counts only IN_SERVICE + SECURED + sub-500-cycle + zero-excursion units: same four units yield optimistic=4 but conservative=1."
        test_recipe:
          setup:
            - "Certified CA system with an ACCEPTED procurement and a DRAFT election definition (election 2026-11-03, 3 precincts); four units: U1 deployed clean, U2 deployed with a broken-seal transfer (UNSEALED), U3 in maintenance with a work order finishing 2026-10-05, U4 in storage."
          setup_api_calls:
            - &d_clock0901
              call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - &d_sys
              call: "POST /evote/voting-systems"
              payload: { vendor_name: "Election Systems and Software", model_name: "DS450", software_baseline_version: "1.0.0", hardware_class: "OPTICAL_SCANNER" }
              as: PlatformAdmin
              captures: { sys_id: $.data.id }
            - &d_lab
              call: "POST /evote/test-laboratories"
              payload: { lab_code: "LAB-A", lab_name: "Alpha Test Lab", accreditation_scope: "DUAL", max_concurrent_campaigns: 3 }
              as: PlatformAdmin
              captures: { lab_id: $.data.id }
            - &d_camp
              call: "POST /evote/certification-campaigns"
              payload: { voting_system_id: "${sys_id}", lab_id: "${lab_id}", guidelines_baseline: "VVSG_2_0", state_code: "CA" }
              as: VendorRep
              captures: { camp_id: $.data.id }
            - &d_begin
              call: "POST /evote/certification-campaigns/${camp_id}/transitions"
              payload: { to_state: "IN_TEST" }
              as: LabAgent
              as_user_id: "${lab_id}"
            - &d_certify
              call: "POST /evote/certification-campaigns/${camp_id}/transitions"
              payload: { to_state: "CERTIFIED" }
              as: CertificationAuthority
            - &d_getcert
              call: "GET /evote/certificates"
              payload: { campaign_id: "${camp_id}" }
              as: CertificationAuthority
              captures: { cert_id: "$.data[0].id" }
            - &d_jur
              call: "POST /evote/jurisdictions"
              payload: { name: "Mono County", state_code: "CA", budget_total_cents: 100000000 }
              as: PlatformAdmin
              captures: { jur_id: $.data.id }
            - &d_off1
              call: "POST /evote/jurisdictions/${jur_id}/officials"
              payload: { full_name: "Ann Lee", badge_no: "B001" }
              as: PlatformAdmin
              captures: { off1_id: $.data.id }
            - &d_off2
              call: "POST /evote/jurisdictions/${jur_id}/officials"
              payload: { full_name: "Ben Ray", badge_no: "B002" }
              as: PlatformAdmin
              captures: { off2_id: $.data.id }
            - &d_proc
              call: "POST /evote/procurements"
              payload: { jurisdiction_id: "${jur_id}", voting_system_id: "${sys_id}", certificate_id: "${cert_id}", quantity: 10, unit_price_cents: 2500000 }
              as: ElectionOfficial
              as_user_id: "${off1_id}"
              captures: { proc_id: $.data.id }
            - &d_deliver
              call: "POST /evote/procurements/${proc_id}/transitions"
              payload: { to_state: "DELIVERED" }
              as: ElectionOfficial
              as_user_id: "${off1_id}"
            - &d_beginacc
              call: "POST /evote/procurements/${proc_id}/transitions"
              payload: { to_state: "ACCEPTANCE_TESTING" }
              as: ElectionOfficial
              as_user_id: "${off1_id}"
            - &d_hwtest
              call: "POST /evote/procurements/${proc_id}/acceptance-tests"
              payload: { test_type: "HARDWARE_DIAGNOSTIC", critical_defects: 0, major_defects: 0, minor_defects: 0 }
              as: ElectionOfficial
              as_user_id: "${off1_id}"
            - &d_caltest
              call: "POST /evote/procurements/${proc_id}/acceptance-tests"
              payload: { test_type: "BALLOT_SCAN_CALIBRATION", critical_defects: 0, major_defects: 0, minor_defects: 0 }
              as: ElectionOfficial
              as_user_id: "${off1_id}"
            - &d_accept
              call: "POST /evote/procurements/${proc_id}/transitions"
              payload: { to_state: "ACCEPTED" }
              as: ElectionOfficial
              as_user_id: "${off1_id}"
            - &d_ed
              call: "POST /evote/election-definitions"
              payload: { jurisdiction_id: "${jur_id}", procurement_id: "${proc_id}", name: "2026 General", election_date: "2026-11-03", precinct_count: 3 }
              as: ElectionOfficial
              as_user_id: "${off1_id}"
              captures: { ed_id: $.data.id, ed_v: $.data.version }
            - call: "POST /evote/equipment-units"
              payload: { jurisdiction_id: "${jur_id}", voting_system_id: "${sys_id}", serial_number: "SN-U1", initial_custodian_id: "${off1_id}" }
              as: ElectionOfficial
              as_user_id: "${off1_id}"
              captures: { u1_id: $.data.id }
            - call: "POST /evote/equipment-units/${u1_id}/transitions"
              payload: { to_state: "IN_SERVICE" }
              as: ElectionOfficial
              as_user_id: "${off1_id}"
            - call: "POST /evote/equipment-units/${u1_id}/record-usage"
              payload: { cycles_used: 100 }
              as: ElectionOfficial
              as_user_id: "${off1_id}"
            - call: "POST /evote/equipment-units"
              payload: { jurisdiction_id: "${jur_id}", voting_system_id: "${sys_id}", serial_number: "SN-U2", initial_custodian_id: "${off1_id}" }
              as: ElectionOfficial
              as_user_id: "${off1_id}"
              captures: { u2_id: $.data.id }
            - call: "POST /evote/equipment-units/${u2_id}/transitions"
              payload: { to_state: "IN_SERVICE" }
              as: ElectionOfficial
              as_user_id: "${off1_id}"
            - call: "POST /evote/equipment-units/${u2_id}/custody-transfers"
              payload: { to_official_id: "${off2_id}", seal_number: "SEAL-U2-1", seal_intact: false }
              as: ElectionOfficial
              as_user_id: "${off1_id}"
            - call: "POST /evote/equipment-units"
              payload: { jurisdiction_id: "${jur_id}", voting_system_id: "${sys_id}", serial_number: "SN-U3", initial_custodian_id: "${off1_id}" }
              as: ElectionOfficial
              as_user_id: "${off1_id}"
              captures: { u3_id: $.data.id }
            - call: "POST /evote/maintenance-work-orders"
              payload: { equipment_unit_id: "${u3_id}", work_type: "BATTERY_REPLACEMENT", scheduled_start: "2026-10-01T00:00:00Z", scheduled_end: "2026-10-05T00:00:00Z" }
              as: ElectionOfficial
              as_user_id: "${off1_id}"
              captures: { wo3_id: $.data.id }
            - call: "POST /evote/maintenance-work-orders/${wo3_id}/transitions"
              payload: { to_state: "IN_PROGRESS" }
              as: ElectionOfficial
              as_user_id: "${off1_id}"
            - call: "POST /evote/equipment-units"
              payload: { jurisdiction_id: "${jur_id}", voting_system_id: "${sys_id}", serial_number: "SN-U4", initial_custodian_id: "${off1_id}" }
              as: ElectionOfficial
              as_user_id: "${off1_id}"
          trigger:
            - call: "GET /evote/election-definitions/${ed_id}/readiness"
              payload: {}
              as: ElectionOfficial
              as_user_id: "${off1_id}"
          assert:
            - "readiness.unit_count == 4"
            - "readiness.optimistic_ready_count == 4  (U1 in service, U2 in service, U3 in maintenance with WO ending 2026-10-05 <= election 2026-11-03, U4 in storage)"
            - "readiness.conservative_ready_count == 1  (only U1: IN_SERVICE + SECURED + battery_cycles 100 < 500 + zero excursions)"
            - "optimistic_ready_count != conservative_ready_count for the identical fleet"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: acceptance_index_weights_branch_by_test_type
        grounds:
          - calculations.acceptance_deficiency_index
          - entities.AcceptanceTest.fields.deficiency_index
        distinguishing_aspect: "Mode (a) >=3 inputs with a conditional branch: identical small defect counts score differently per test_type branch — BALLOT_SCAN_CALIBRATION (0/2/3) -> min(100, 29) = 29 FAIL, LOGIC_VERIFICATION (0/1/1) -> 16 PASS — and the nested min() clamps HARDWARE_DIAGNOSTIC (0/5/40) to exactly 100."
        test_recipe:
          setup:
            - "Procurement in ACCEPTANCE_TESTING for a certified CA system."
          setup_api_calls:
            - *d_clock0901
            - *d_sys
            - *d_lab
            - *d_camp
            - *d_begin
            - *d_certify
            - *d_getcert
            - *d_jur
            - *d_off1
            - *d_proc
            - *d_deliver
            - *d_beginacc
          trigger:
            - call: "POST /evote/procurements/${proc_id}/acceptance-tests"
              payload: { test_type: "BALLOT_SCAN_CALIBRATION", critical_defects: 0, major_defects: 2, minor_defects: 3 }
              as: ElectionOfficial
              as_user_id: "${off1_id}"
              captures: { cal_idx: $.data.deficiency_index, cal_res: $.data.result }
            - call: "POST /evote/procurements/${proc_id}/acceptance-tests"
              payload: { test_type: "LOGIC_VERIFICATION", critical_defects: 0, major_defects: 1, minor_defects: 1 }
              as: ElectionOfficial
              as_user_id: "${off1_id}"
              captures: { log_idx: $.data.deficiency_index, log_res: $.data.result }
            - call: "POST /evote/procurements/${proc_id}/acceptance-tests"
              payload: { test_type: "HARDWARE_DIAGNOSTIC", critical_defects: 0, major_defects: 5, minor_defects: 40 }
              as: ElectionOfficial
              as_user_id: "${off1_id}"
              captures: { hw_idx: $.data.deficiency_index, hw_res: $.data.result }
          assert:
            - "first AcceptanceTest: deficiency_index == 29 (30*0 + 10*2 + 3*3) and result == FAIL (29 > ACCEPTANCE_INDEX_MAX 20)"
            - "second AcceptanceTest: deficiency_index == 16 (40*0 + 12*1 + 4*1) and result == PASS"
            - "third AcceptanceTest: deficiency_index == 100 (min clamps 25*0 + 8*5 + 2*40 = 120) and result == FAIL"
            - "any single critical defect forces FAIL regardless of index: the branch on test_type changes the weight triple, not just a scalar"

      - name: print_estimate_per_precinct_ceil_then_aggregate_tier
        grounds:
          - calculations.ballot_print_cost
          - endpoints.GET_/evote/election-definitions/{id}/print-estimate
        distinguishing_aspect: "Mode (b) nested rounding with pinned order: the per-precinct ceil (501 ballots -> 2 reams) is applied BEFORE aggregation and the price tier is selected on the AGGREGATE ream count — 3 precincts yield 6 reams * 4200 = 25200 cents (not 16800 from aggregating first), and crossing the 100-ream aggregate boundary makes 102 reams (397800) cheaper than 100 reams (420000)."
        test_recipe:
          setup:
            - "One ACCEPTED procurement; three election definitions with precinct_count 3, 50 and 51."
          setup_api_calls:
            - *d_clock0901
            - *d_sys
            - *d_lab
            - *d_camp
            - *d_begin
            - *d_certify
            - *d_getcert
            - *d_jur
            - *d_off1
            - *d_proc
            - *d_deliver
            - *d_beginacc
            - *d_hwtest
            - *d_caltest
            - *d_accept
            - *d_ed
            - call: "POST /evote/election-definitions"
              payload: { jurisdiction_id: "${jur_id}", procurement_id: "${proc_id}", name: "2026 Primary", election_date: "2026-11-03", precinct_count: 50 }
              as: ElectionOfficial
              as_user_id: "${off1_id}"
              captures: { ed50_id: $.data.id }
            - call: "POST /evote/election-definitions"
              payload: { jurisdiction_id: "${jur_id}", procurement_id: "${proc_id}", name: "2027 Special", election_date: "2026-11-03", precinct_count: 51 }
              as: ElectionOfficial
              as_user_id: "${off1_id}"
              captures: { ed51_id: $.data.id }
          trigger:
            - call: "GET /evote/election-definitions/${ed_id}/print-estimate"
              payload: { ballots_per_precinct: 501 }
              as: ElectionOfficial
              as_user_id: "${off1_id}"
            - call: "GET /evote/election-definitions/${ed50_id}/print-estimate"
              payload: { ballots_per_precinct: 600 }
              as: ElectionOfficial
              as_user_id: "${off1_id}"
            - call: "GET /evote/election-definitions/${ed51_id}/print-estimate"
              payload: { ballots_per_precinct: 600 }
              as: ElectionOfficial
              as_user_id: "${off1_id}"
          assert:
            - "3-precinct estimate: reams_per_precinct == 2 (ceil(501/500)), total_reams == 6, tier_price_cents == 4200, total_cost_cents == 25200"
            - "50-precinct estimate: total_reams == 100, tier_price_cents == 4200, total_cost_cents == 420000"
            - "51-precinct estimate: total_reams == 102, tier_price_cents == 3900, total_cost_cents == 397800"
            - "397800 < 420000: crossing the aggregate tier boundary lowers the total despite more reams — proving the tier is selected on aggregated reams, not per precinct"

      - name: modification_lead_time_computed_before_suspension_cascade
        grounds:
          - calculations.recertification_lead_time_days
          - state_machines.SoftwareModification.PROPOSED_to_RECERTIFICATION_PENDING
          - entities.SoftwareModification.fields.lead_time_days
        distinguishing_aspect: "Mode (c) circular-looking dependency with pinned evaluation order: classifying RECERTIFICATION_REQUIRED suspends the system's ACTIVE federal certificate, but the lead time MUST be evaluated pre-cascade — 30 base + 60 scope-touching (TABULATION_FIRMWARE) + 45 federal-certificate = 135 days; evaluated post-cascade it would wrongly be 90."
        test_recipe:
          setup:
            - "System with an ACTIVE FEDERAL-scope certificate (federal-only campaign, no state_code) and no other modifications."
          setup_api_calls:
            - *d_clock0901
            - call: "POST /evote/voting-systems"
              payload: { vendor_name: "Election Systems and Software", model_name: "DS8500", software_baseline_version: "2.4.1", hardware_class: "CENTRAL_TABULATOR" }
              as: PlatformAdmin
              captures: { sys_id: $.data.id }
            - *d_lab
            - call: "POST /evote/certification-campaigns"
              payload: { voting_system_id: "${sys_id}", lab_id: "${lab_id}", guidelines_baseline: "VVSG_2_0" }
              as: VendorRep
              captures: { camp_id: $.data.id }
            - *d_begin
            - *d_certify
            - *d_getcert
            - call: "GET /evote/voting-systems/${sys_id}"
              payload: {}
              as: VendorRep
              captures: { sys_v: $.data.version }
            - call: "POST /evote/software-modifications"
              payload: { voting_system_id: "${sys_id}", description: "Tabulation firmware 2.4.2 hotfix", component_codes: ["TABULATION_FIRMWARE"], expected_voting_system_version: "${sys_v}" }
              as: VendorRep
              captures: { mod_id: $.data.id }
          trigger:
            - call: "POST /evote/software-modifications/${mod_id}/transitions"
              payload: { to_state: "RECERTIFICATION_PENDING" }
              as: CertificationAuthority
            - call: "GET /evote/certificates/${cert_id}"
              payload: {}
              as: CertificationAuthority
          assert:
            - "SoftwareModification.${mod_id}.lead_time_days == 135 (30 + 60 + 45 evaluated against the PRE-classification ACTIVE federal certificate)"
            - "SoftwareModification.${mod_id}.classification == RECERTIFICATION_REQUIRED and status == RECERTIFICATION_PENDING"
            - "Certificate.${cert_id}.status == SUSPENDED after the classify call (the cascade fires AFTER the lead-time evaluation)"
            - "had the lead time been evaluated post-cascade it would be 90; the persisted 135 pins the evaluation order"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: campaign_resubmission_cycle_increments_count
        grounds:
          - state_machines.CertificationCampaign
          - entities.CertificationCampaign.fields.resubmission_count
        distinguishing_aspect: "Cyclic machine on CertificationCampaign: SUBMITTED -> IN_TEST -> DEFICIENCIES_FILED -> SUBMITTED loops twice, resubmission_count reaches 2 and version reaches 7 — a linear pipeline could not re-enter SUBMITTED at all."
        test_recipe:
          setup:
            - "Fresh campaign at SUBMITTED."
          setup_api_calls:
            - *d_clock0901
            - *d_sys
            - *d_lab
            - *d_camp
          trigger:
            - call: "POST /evote/certification-campaigns/${camp_id}/transitions"
              payload: { to_state: "IN_TEST" }
              as: LabAgent
              as_user_id: "${lab_id}"
            - call: "POST /evote/certification-campaigns/${camp_id}/transitions"
              payload: { to_state: "DEFICIENCIES_FILED", critical_count: 0, major_count: 0, minor_count: 1 }
              as: LabAgent
              as_user_id: "${lab_id}"
            - call: "POST /evote/certification-campaigns/${camp_id}/transitions"
              payload: { to_state: "SUBMITTED", resolved_critical: 0, resolved_major: 0, resolved_minor: 1 }
              as: VendorRep
            - call: "POST /evote/certification-campaigns/${camp_id}/transitions"
              payload: { to_state: "IN_TEST" }
              as: LabAgent
              as_user_id: "${lab_id}"
            - call: "POST /evote/certification-campaigns/${camp_id}/transitions"
              payload: { to_state: "DEFICIENCIES_FILED", critical_count: 0, major_count: 2, minor_count: 0 }
              as: LabAgent
              as_user_id: "${lab_id}"
            - call: "POST /evote/certification-campaigns/${camp_id}/transitions"
              payload: { to_state: "SUBMITTED", resolved_critical: 0, resolved_major: 2, resolved_minor: 0 }
              as: VendorRep
          assert:
            - "CertificationCampaign.${camp_id}.status == SUBMITTED after two full deficiency/resubmission loops"
            - "CertificationCampaign.${camp_id}.resubmission_count == 2"
            - "CertificationCampaign.${camp_id}.open_critical_count == 0 and open_major_count == 0 and open_minor_count == 0"
            - "CertificationCampaign.${camp_id}.version == 7 (create + 6 transitions)"

      - name: equipment_parallel_dimensions_evolve_independently
        grounds:
          - state_machines.EquipmentUnit
          - entities.EquipmentUnit.fields.operational_status
          - entities.EquipmentUnit.fields.custody_status
        distinguishing_aspect: "Parallel state dimensions on EquipmentUnit (different entity from CertificationCampaign): a broken-seal custody transfer flips custody_status to UNSEALED while operational_status stays IN_SERVICE; a RESEAL work order moves operational to IN_MAINTENANCE and back while only the completion touches custody."
        test_recipe:
          setup:
            - "FIELDED system, jurisdiction with two officials, unit U deployed (IN_SERVICE) with off1 as custodian."
          setup_api_calls:
            - *d_clock0901
            - *d_sys
            - *d_lab
            - *d_camp
            - *d_begin
            - *d_certify
            - *d_jur
            - *d_off1
            - *d_off2
            - call: "POST /evote/equipment-units"
              payload: { jurisdiction_id: "${jur_id}", voting_system_id: "${sys_id}", serial_number: "SN-P1", initial_custodian_id: "${off1_id}" }
              as: ElectionOfficial
              as_user_id: "${off1_id}"
              captures: { u_id: $.data.id }
            - call: "POST /evote/equipment-units/${u_id}/transitions"
              payload: { to_state: "IN_SERVICE" }
              as: ElectionOfficial
              as_user_id: "${off1_id}"
          trigger:
            - call: "POST /evote/equipment-units/${u_id}/custody-transfers"
              payload: { to_official_id: "${off2_id}", seal_number: "SEAL-P1-A", seal_intact: false }
              as: ElectionOfficial
              as_user_id: "${off1_id}"
            - call: "GET /evote/equipment-units/${u_id}"
              payload: {}
              as: ElectionOfficial
              as_user_id: "${off1_id}"
              captures: { op_mid: $.data.operational_status, cu_mid: $.data.custody_status }
            - call: "POST /evote/maintenance-work-orders"
              payload: { equipment_unit_id: "${u_id}", work_type: "RESEAL", scheduled_start: "2026-09-02T00:00:00Z", scheduled_end: "2026-09-03T00:00:00Z" }
              as: ElectionOfficial
              as_user_id: "${off2_id}"
              captures: { wo_id: $.data.id }
            - call: "POST /evote/maintenance-work-orders/${wo_id}/transitions"
              payload: { to_state: "IN_PROGRESS" }
              as: ElectionOfficial
              as_user_id: "${off2_id}"
            - call: "GET /evote/equipment-units/${u_id}"
              payload: {}
              as: ElectionOfficial
              as_user_id: "${off1_id}"
              captures: { op_wo: $.data.operational_status, cu_wo: $.data.custody_status }
            - call: "POST /evote/maintenance-work-orders/${wo_id}/transitions"
              payload: { to_state: "COMPLETED", resolution_note: "resealed with SEAL-P1-B" }
              as: ElectionOfficial
              as_user_id: "${off2_id}"
            - call: "GET /evote/equipment-units/${u_id}"
              payload: {}
              as: ElectionOfficial
              as_user_id: "${off1_id}"
              captures: { op_end: $.data.operational_status, cu_end: $.data.custody_status, cust_end: $.data.current_custodian_id }
          assert:
            - "after the broken-seal transfer: operational_status == IN_SERVICE (unchanged) and custody_status == UNSEALED"
            - "after the RESEAL work order starts: operational_status == IN_MAINTENANCE and custody_status still == UNSEALED"
            - "after completion: operational_status restored to IN_SERVICE and custody_status == SECURED"
            - "current_custodian_id == ${off2_id} throughout (custody identity untouched by the maintenance dimension)"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: recert_classification_cascades_cert_suspend_definition_revert_la_challenge
        grounds:
          - state_machines.SoftwareModification.PROPOSED_to_RECERTIFICATION_PENDING
          - state_machines.Certificate.ACTIVE_to_SUSPENDED
          - state_machines.ElectionDefinition.LA_PASSED_to_DRAFT
          - state_machines.LogicAccuracyTest.CONDUCTED_to_CHALLENGED
        distinguishing_aspect: "Depth-3 cascade from a modification classify: hop1 suspends the ACTIVE certificate, hop2 reverts PROGRAMMED/LA_PASSED election definitions pinning that certificate to DRAFT, hop3 challenges their still-CONDUCTED L&A tests — each hop is caused by the previous hop, not by the classify call directly, and the already-CERTIFIED L&A test is untouched."
        test_recipe:
          setup:
            - "Certified CA system; ACCEPTED procurement; election definition in LA_PASSED with one CERTIFIED PASS L&A test and a second L&A test still CONDUCTED."
          setup_api_calls:
            - *d_clock0901
            - *d_sys
            - *d_lab
            - *d_camp
            - *d_begin
            - *d_certify
            - *d_getcert
            - *d_jur
            - *d_off1
            - *d_off2
            - *d_proc
            - *d_deliver
            - *d_beginacc
            - *d_hwtest
            - *d_caltest
            - *d_accept
            - *d_ed
            - &d_layout
              call: "PUT /evote/election-definitions/${ed_id}/layout"
              payload: { ballot_layout: { contests: [{ code: "PRES", choices: 4 }] }, paper_weight_gsm: 90, paper_thickness_microns: 100, paper_coating: "UNCOATED", expected_election_definition_version: "${ed_v}" }
              as: ElectionOfficial
              as_user_id: "${off1_id}"
            - &d_program
              call: "POST /evote/election-definitions/${ed_id}/transitions"
              payload: { to_state: "PROGRAMMED" }
              as: ElectionOfficial
              as_user_id: "${off1_id}"
            - &d_la
              call: "POST /evote/election-definitions/${ed_id}/la-tests"
              payload: { expected_tallies: { PRES: 12000, SEN: 8000 }, scanned_tallies: { PRES: 12000, SEN: 8000 } }
              as: ElectionOfficial
              as_user_id: "${off1_id}"
              captures: { lat1_id: $.data.id }
            - &d_la_cert
              call: "POST /evote/logic-accuracy-tests/${lat1_id}/transitions"
              payload: { to_state: "CERTIFIED" }
              as: ElectionOfficial
              as_user_id: "${off2_id}"
            - &d_lapass
              call: "POST /evote/election-definitions/${ed_id}/transitions"
              payload: { to_state: "LA_PASSED" }
              as: ElectionOfficial
              as_user_id: "${off1_id}"
            - call: "POST /evote/election-definitions/${ed_id}/la-tests"
              payload: { expected_tallies: { PRES: 12000, SEN: 8000 }, scanned_tallies: { PRES: 12010, SEN: 8000 } }
              as: ElectionOfficial
              as_user_id: "${off1_id}"
              captures: { lat2_id: $.data.id }
            - call: "GET /evote/voting-systems/${sys_id}"
              payload: {}
              as: VendorRep
              captures: { sys_v: $.data.version }
            - call: "POST /evote/software-modifications"
              payload: { voting_system_id: "${sys_id}", description: "EMS UI refresh", component_codes: ["ELECTION_MANAGEMENT_UI"], expected_voting_system_version: "${sys_v}" }
              as: VendorRep
              captures: { mod_id: $.data.id }
          trigger:
            - call: "POST /evote/software-modifications/${mod_id}/transitions"
              payload: { to_state: "RECERTIFICATION_PENDING" }
              as: CertificationAuthority
          assert:
            - "Certificate.${cert_id}.status == SUSPENDED (hop 1)"
            - "ElectionDefinition.${ed_id}.status == DRAFT and status_reason == CERTIFICATE_SUSPENDED (hop 2, caused by hop 1's suspension)"
            - "LogicAccuracyTest.${lat2_id}.status == CHALLENGED (hop 3, caused by hop 2's revert)"
            - "LogicAccuracyTest.${lat1_id}.status == CERTIFIED (terminal-state tests are not cascaded)"
            - "Procurement.${proc_id}.cert_hold == false (ACCEPTED procurements are outside the {DELIVERED, ACCEPTANCE_TESTING} hold set)"

      - name: audit_escalation_quarantines_units_and_aborts_work_orders
        grounds:
          - state_machines.PostElectionAudit.FINDINGS_FILED_to_CLOSED_ESCALATED
          - state_machines.EquipmentUnit.IN_SERVICE_to_QUARANTINED
          - state_machines.MaintenanceWorkOrder.SCHEDULED_to_ABORTED
        distinguishing_aspect: "Depth-2 cascade from a different trigger (audit escalation, not modification classify): hop1 quarantines every IN_SERVICE/IN_STORAGE/IN_MAINTENANCE unit of the audited jurisdiction+system, hop2 aborts each quarantined unit's open work orders — the abort is caused by the quarantine, not by the audit directly."
        test_recipe:
          setup:
            - "Election definition CANVASSING (clock at election day 2026-11-03); unit U5 IN_SERVICE with a SCHEDULED preventive work order; unit U6 IN_STORAGE with no work order; an audit with one critical finding filed."
          setup_api_calls:
            - *d_clock0901
            - *d_sys
            - *d_lab
            - *d_camp
            - *d_begin
            - *d_certify
            - *d_getcert
            - *d_jur
            - *d_off1
            - *d_off2
            - *d_proc
            - *d_deliver
            - *d_beginacc
            - *d_hwtest
            - *d_caltest
            - *d_accept
            - *d_ed
            - *d_layout
            - *d_program
            - *d_la
            - *d_la_cert
            - *d_lapass
            - &d_lock
              call: "POST /evote/election-definitions/${ed_id}/transitions"
              payload: { to_state: "LOCKED" }
              as: ElectionOfficial
              as_user_id: "${off1_id}"
            - call: "POST /evote/equipment-units"
              payload: { jurisdiction_id: "${jur_id}", voting_system_id: "${sys_id}", serial_number: "SN-U5", initial_custodian_id: "${off1_id}" }
              as: ElectionOfficial
              as_user_id: "${off1_id}"
              captures: { u5_id: $.data.id }
            - call: "POST /evote/equipment-units/${u5_id}/transitions"
              payload: { to_state: "IN_SERVICE" }
              as: ElectionOfficial
              as_user_id: "${off1_id}"
            - call: "POST /evote/maintenance-work-orders"
              payload: { equipment_unit_id: "${u5_id}", work_type: "PREVENTIVE", scheduled_start: "2026-11-10T00:00:00Z", scheduled_end: "2026-11-12T00:00:00Z" }
              as: ElectionOfficial
              as_user_id: "${off1_id}"
              captures: { wo5_id: $.data.id }
            - call: "POST /evote/equipment-units"
              payload: { jurisdiction_id: "${jur_id}", voting_system_id: "${sys_id}", serial_number: "SN-U6", initial_custodian_id: "${off1_id}" }
              as: ElectionOfficial
              as_user_id: "${off1_id}"
              captures: { u6_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-11-03T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /evote/election-definitions/${ed_id}/transitions"
              payload: { to_state: "CANVASSING" }
              as: ElectionOfficial
              as_user_id: "${off1_id}"
            - call: "POST /evote/post-election-audits"
              payload: { election_definition_id: "${ed_id}", audit_type: "RISK_LIMITING" }
              as: Auditor
              captures: { aud_id: $.data.id }
            - call: "POST /evote/post-election-audits/${aud_id}/transitions"
              payload: { to_state: "FINDINGS_FILED", critical_findings: 1, major_findings: 0, minor_findings: 2 }
              as: Auditor
          trigger:
            - call: "POST /evote/post-election-audits/${aud_id}/transitions"
              payload: { to_state: "CLOSED_ESCALATED" }
              as: Auditor
          assert:
            - "PostElectionAudit.${aud_id}.status == CLOSED_ESCALATED"
            - "EquipmentUnit.${u5_id}.operational_status == QUARANTINED (hop 1)"
            - "EquipmentUnit.${u6_id}.operational_status == QUARANTINED (hop 1)"
            - "MaintenanceWorkOrder.${wo5_id}.status == ABORTED (hop 2, caused by hop 1's quarantine)"
            - "EquipmentUnit.${u5_id}.custody_status == SECURED (escalation touches only the operational dimension)"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: scope_mismatch_referential_beats_budget_fiscal
        grounds:
          - validations[priority=19]
          - validations[priority=20]
          - errors[ERR_CERTIFICATE_SCOPE_MISMATCH]
          - errors[ERR_BUDGET_EXCEEDED]
        distinguishing_aspect: "Error-category pair business_referential (priority 19) vs business_fiscal (priority 20): one request violating both a TX-only STATE certificate scope AND the CA jurisdiction's 1000-cent budget MUST return ERR_CERTIFICATE_SCOPE_MISMATCH (422), never ERR_BUDGET_EXCEEDED."
        test_recipe:
          setup:
            - "TX STATE-scope certificate; CA jurisdiction with budget_total_cents 1000; procurement total would be 25,000,000 cents (fiscal failure) AND scope mismatch (referential failure)."
          setup_api_calls:
            - *d_clock0901
            - *d_sys
            - *d_lab
            - call: "POST /evote/certification-campaigns"
              payload: { voting_system_id: "${sys_id}", lab_id: "${lab_id}", guidelines_baseline: "VVSG_2_0", state_code: "TX" }
              as: VendorRep
              captures: { camp_id: $.data.id }
            - *d_begin
            - *d_certify
            - *d_getcert
            - call: "POST /evote/jurisdictions"
              payload: { name: "Tiny County", state_code: "CA", budget_total_cents: 1000 }
              as: PlatformAdmin
              captures: { jur_id: $.data.id }
            - *d_off1
          trigger:
            - call: "POST /evote/procurements"
              payload: { jurisdiction_id: "${jur_id}", voting_system_id: "${sys_id}", certificate_id: "${cert_id}", quantity: 10, unit_price_cents: 2500000 }
              as: ElectionOfficial
              as_user_id: "${off1_id}"
              captures: { err: $.data.error_id }
          assert:
            - "the response is 422 with error_id == ERR_CERTIFICATE_SCOPE_MISMATCH"
            - "error_id != ERR_BUDGET_EXCEEDED even though total_price_cents 25000000 > available_cents 1000 — referential (p19) precedes fiscal (p20)"

      - name: invalid_state_beats_battery_safety
        grounds:
          - validations[priority=8]
          - validations[priority=12]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_BATTERY_CYCLE_LIMIT]
        distinguishing_aspect: "Error-category pair state (priority 8) vs business_safety (priority 12): deploying a QUARANTINED unit that also has 500 battery cycles MUST return ERR_INVALID_STATE (409) because the from-state check precedes the battery safety check."
        test_recipe:
          setup:
            - "Unit deployed, driven to exactly 500 battery cycles, then QUARANTINED by the CertificationAuthority."
          setup_api_calls:
            - *d_clock0901
            - *d_sys
            - *d_lab
            - *d_camp
            - *d_begin
            - *d_certify
            - *d_jur
            - *d_off1
            - call: "POST /evote/equipment-units"
              payload: { jurisdiction_id: "${jur_id}", voting_system_id: "${sys_id}", serial_number: "SN-Q1", initial_custodian_id: "${off1_id}" }
              as: ElectionOfficial
              as_user_id: "${off1_id}"
              captures: { uq_id: $.data.id }
            - call: "POST /evote/equipment-units/${uq_id}/transitions"
              payload: { to_state: "IN_SERVICE" }
              as: ElectionOfficial
              as_user_id: "${off1_id}"
            - call: "POST /evote/equipment-units/${uq_id}/record-usage"
              payload: { cycles_used: 500 }
              as: ElectionOfficial
              as_user_id: "${off1_id}"
            - call: "POST /evote/equipment-units/${uq_id}/transitions"
              payload: { to_state: "QUARANTINED" }
              as: CertificationAuthority
          trigger:
            - call: "POST /evote/equipment-units/${uq_id}/transitions"
              payload: { to_state: "IN_SERVICE" }
              as: ElectionOfficial
              as_user_id: "${off1_id}"
              captures: { err: $.data.error_id }
          assert:
            - "the response is 409 with error_id == ERR_INVALID_STATE (QUARANTINED has no IN_SERVICE transition)"
            - "error_id != ERR_BATTERY_CYCLE_LIMIT even though battery_cycles == 500 violates the safety rule — state (p8) precedes safety (p12)"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: la_discrepancy_exactly_at_50bp_passes_one_unit_above_fails
        grounds:
          - calculations.la_tabulation_verification
          - endpoints.POST_/evote/election-definitions/{id}/la-tests
        distinguishing_aspect: "Boundary on the tabulation-discrepancy metric via the la-tests endpoint: with total_expected 20000, discrepancy 100 passes (100*10000 <= 50*20000, exact integer comparison) while discrepancy 101 fails — and both display discrepancy_bp == 50 because the floored display value is never used for the pass/fail decision."
        test_recipe:
          setup:
            - "Election definition in PROGRAMMED (layout stored)."
          setup_api_calls:
            - *d_clock0901
            - *d_sys
            - *d_lab
            - *d_camp
            - *d_begin
            - *d_certify
            - *d_getcert
            - *d_jur
            - *d_off1
            - *d_off2
            - *d_proc
            - *d_deliver
            - *d_beginacc
            - *d_hwtest
            - *d_caltest
            - *d_accept
            - *d_ed
            - *d_layout
            - *d_program
          trigger:
            - call: "POST /evote/election-definitions/${ed_id}/la-tests"
              payload: { expected_tallies: { PRES: 12000, SEN: 8000 }, scanned_tallies: { PRES: 12100, SEN: 8000 } }
              as: ElectionOfficial
              as_user_id: "${off1_id}"
              captures: { latA_res: $.data.result, latA_bp: $.data.discrepancy_bp }
            - call: "POST /evote/election-definitions/${ed_id}/la-tests"
              payload: { expected_tallies: { PRES: 12000, SEN: 8000 }, scanned_tallies: { PRES: 12101, SEN: 8000 } }
              as: ElectionOfficial
              as_user_id: "${off1_id}"
              captures: { latB_res: $.data.result, latB_bp: $.data.discrepancy_bp }
          assert:
            - "test A: total_discrepancy 100 -> result == PASS (100*10000 == 50*20000 exactly, boundary is inclusive)"
            - "test A: discrepancy_bp == 50"
            - "test B: total_discrepancy 101 -> result == FAIL (101*10000 > 50*20000)"
            - "test B: discrepancy_bp == 50 (floored display) — identical displayed bp, opposite verdicts; the decision uses exact integer arithmetic"

      - name: battery_deploy_at_500_blocked_499_allowed
        grounds:
          - calculations.fleet_readiness
          - validations[priority=12]
          - endpoints.POST_/evote/equipment-units/{id}/transitions
        distinguishing_aspect: "Boundary on the battery-cycle metric via the unit transitions endpoint (different metric and endpoint from the L&A boundary): 499 cycles deploys, exactly 500 is rejected with ERR_BATTERY_CYCLE_LIMIT — the guard is strict less-than against BATTERY_CYCLE_MAX."
        test_recipe:
          setup:
            - "Units U499 and U500 each deployed once, driven to 499 / 500 cycles, then stored in-band (20C, 40%)."
          setup_api_calls:
            - *d_clock0901
            - *d_sys
            - *d_lab
            - *d_camp
            - *d_begin
            - *d_certify
            - *d_jur
            - *d_off1
            - call: "POST /evote/equipment-units"
              payload: { jurisdiction_id: "${jur_id}", voting_system_id: "${sys_id}", serial_number: "SN-499", initial_custodian_id: "${off1_id}" }
              as: ElectionOfficial
              as_user_id: "${off1_id}"
              captures: { u499_id: $.data.id }
            - call: "POST /evote/equipment-units/${u499_id}/transitions"
              payload: { to_state: "IN_SERVICE" }
              as: ElectionOfficial
              as_user_id: "${off1_id}"
            - call: "POST /evote/equipment-units/${u499_id}/record-usage"
              payload: { cycles_used: 499 }
              as: ElectionOfficial
              as_user_id: "${off1_id}"
            - call: "POST /evote/equipment-units/${u499_id}/transitions"
              payload: { to_state: "IN_STORAGE", storage_temperature_c: 20, storage_humidity_pct: 40 }
              as: ElectionOfficial
              as_user_id: "${off1_id}"
            - call: "POST /evote/equipment-units"
              payload: { jurisdiction_id: "${jur_id}", voting_system_id: "${sys_id}", serial_number: "SN-500", initial_custodian_id: "${off1_id}" }
              as: ElectionOfficial
              as_user_id: "${off1_id}"
              captures: { u500_id: $.data.id }
            - call: "POST /evote/equipment-units/${u500_id}/transitions"
              payload: { to_state: "IN_SERVICE" }
              as: ElectionOfficial
              as_user_id: "${off1_id}"
            - call: "POST /evote/equipment-units/${u500_id}/record-usage"
              payload: { cycles_used: 500 }
              as: ElectionOfficial
              as_user_id: "${off1_id}"
            - call: "POST /evote/equipment-units/${u500_id}/transitions"
              payload: { to_state: "IN_STORAGE", storage_temperature_c: 20, storage_humidity_pct: 40 }
              as: ElectionOfficial
              as_user_id: "${off1_id}"
          trigger:
            - call: "POST /evote/equipment-units/${u499_id}/transitions"
              payload: { to_state: "IN_SERVICE" }
              as: ElectionOfficial
              as_user_id: "${off1_id}"
            - call: "POST /evote/equipment-units/${u500_id}/transitions"
              payload: { to_state: "IN_SERVICE" }
