          - validations[priority 39 ERR_DUPLICATE_POLICY_DEFECT_CLASS]
        distinguishing_aspect: "defect_class is the natural key of ArbitrationPolicy, so a second MECHANICAL policy with entirely different numbers is refused with 409 ERR_DUPLICATE_POLICY_DEFECT_CLASS and the original row is untouched."
        test_recipe:
