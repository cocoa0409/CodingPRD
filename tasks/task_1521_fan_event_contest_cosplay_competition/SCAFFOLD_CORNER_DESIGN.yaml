            - { call: "POST /prejudging-slots", payload: { category_id: "${cat}", panel_name: "P06", start_at: "2026-08-15T10:00:00Z", end_at: "2026-08-15T11:00:00Z" }, as: ContestLead }
            - { call: "POST /prejudging-slots", payload: { category_id: "${cat}", panel_name: "P07", start_at: "2026-08-15T10:00:00Z", end_at: "2026-08-15T11:00:00Z" }, as: ContestLead }
            - { call: "POST /prejudging-slots", payload: { category_id: "${cat}", panel_name: "P08", start_at: "2026-08-15T10:00:00Z", end_at: "2026-08-15T11:00:00Z" }, as: ContestLead }
