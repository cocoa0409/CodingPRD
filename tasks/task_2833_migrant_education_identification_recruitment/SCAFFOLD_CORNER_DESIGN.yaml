          - endpoints[POST /mep/recruiter-assignments]
        distinguishing_aspect: "The pass side of all three coverage rules on one area: a PRIMARY interval that strictly contains the peak season, a second recruiter so no pairwise overlap exists, and a buffered occupancy peak of 2 against recruiter_capacity 3 - the BACKUP interval is accepted even though it does NOT contain the peak season, because rule 3 is PRIMARY-only."
        test_recipe:
          setup:
            - "logical clock at its 2026-08-01T00:00:00Z startup default"
            - "one OPEN AgriculturalArea with peak season 2026-06-01..2026-09-30 and recruiter_capacity 3"
