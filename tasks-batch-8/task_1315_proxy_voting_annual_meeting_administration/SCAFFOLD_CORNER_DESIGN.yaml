            - "meeting status remains MEETING_IN_PROGRESS"

      - name: vote_referencing_other_meeting_proposal_returns_cross_meeting_reference
        claim_type: cross_entity_validation
        grounds: ["validations[priority=7]", "errors[ERR_CROSS_MEETING_REFERENCE]"]
        distinguishing_aspect: "A vote whose proposal_id belongs to a different meeting than the body's meeting_id fails with ERR_CROSS_MEETING_REFERENCE (422) — referential integrity across aggregates."
        test_recipe:
          setup: ["two meetings m1 (VOTING_OPEN, account a1, proposal p_other belongs to m2) and m2 with its own proposal"]
          setup_api_calls:
