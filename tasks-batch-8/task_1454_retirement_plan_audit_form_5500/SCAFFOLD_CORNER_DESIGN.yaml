            - "Form5500Filing.${fil}.filed_date == \"2026-08-20\""

  # ===========================================================================
  # Section: validations
  # ===========================================================================
  - section: validations
    instances:
      - name: missing_auth_headers_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"]
        distinguishing_aspect: "A request without X-User-Role/X-User-ID is rejected with 400 before any role or existence check."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /plan-audit/engagements"
              payload: { sponsor_ein: "12-3456789", plan_number: "401", plan_name: "NoAuth Plan", plan_year_start: "2025-01-01", plan_year_end: "2026-01-01", plan_type: "DC", funding_arrangement: "TRUST", prior_year_schedule_type: "I" }
              as: Any
              captures: { err: $.data.error_id }
          assert:
            - "error_id == \"ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER\" (or ERR_FORBIDDEN_FOR_ROLE if only the role header is missing; priority 1 fires before priority 2)"

      - name: duplicate_participant_ref_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_DUPLICATE_PARTICIPANT_REF]"]
        distinguishing_aspect: "external_ref is unique per engagement; reusing it is a 409, but the same ref under a DIFFERENT engagement is fine."
        test_recipe:
          setup: ["engagement 402 with participant P-001; engagement 403 empty"]
          setup_api_calls:
            - call: "POST /plan-audit/engagements"
              payload: { sponsor_ein: "12-3456789", plan_number: "402", plan_name: "DupRef Plan A", plan_year_start: "2025-01-01", plan_year_end: "2026-01-01", plan_type: "DC", funding_arrangement: "TRUST", prior_year_schedule_type: "I" }
              as: SponsorAdmin
              captures: { eng_a: $.data.id }
            - call: "POST /plan-audit/engagements"
              payload: { sponsor_ein: "12-3456789", plan_number: "403", plan_name: "DupRef Plan B", plan_year_start: "2025-01-01", plan_year_end: "2026-01-01", plan_type: "DC", funding_arrangement: "TRUST", prior_year_schedule_type: "I" }
              as: SponsorAdmin
              captures: { eng_b: $.data.id }
            - call: "POST /plan-audit/participants"
              payload: { engagement_id: "${eng_a}", external_ref: "P-001", eligibility_date: "2024-06-01", entry_date: "2024-07-01", is_eligible: true, is_hce: false, compensation_cy_cents: 5000000, deferral_amount_cy_cents: 0, opening_balance_cents: 0 }
              as: SponsorAdmin
          trigger:
            - call: "POST /plan-audit/participants"
              payload: { engagement_id: "${eng_a}", external_ref: "P-001", eligibility_date: "2024-06-01", entry_date: "2024-07-01", is_eligible: true, is_hce: false, compensation_cy_cents: 5000000, deferral_amount_cy_cents: 0, opening_balance_cents: 0 }
              as: SponsorAdmin
              captures: { err: $.data.error_id }
            - call: "POST /plan-audit/participants"
              payload: { engagement_id: "${eng_b}", external_ref: "P-001", eligibility_date: "2024-06-01", entry_date: "2024-07-01", is_eligible: true, is_hce: false, compensation_cy_cents: 5000000, deferral_amount_cy_cents: 0, opening_balance_cents: 0 }
              as: SponsorAdmin
              captures: { p_b: $.data.id }
          assert:
            - "err == \"ERR_DUPLICATE_PARTICIPANT_REF\""
            - "Participant.${p_b} created successfully (HTTP 201)"

      - name: contribution_deposit_before_payroll_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=6]", "errors[ERR_INVALID_DATE_ORDER]"]
        distinguishing_aspect: "deposit_date earlier than payroll_date is a 422 temporal error."
        test_recipe:
          setup: ["engagement 404 with participant"]
          setup_api_calls:
            - call: "POST /plan-audit/engagements"
              payload: { sponsor_ein: "12-3456789", plan_number: "404", plan_name: "DateOrder Plan", plan_year_start: "2025-01-01", plan_year_end: "2026-01-01", plan_type: "DC", funding_arrangement: "TRUST", prior_year_schedule_type: "I" }
              as: SponsorAdmin
              captures: { eng: $.data.id }
            - call: "POST /plan-audit/participants"
              payload: { engagement_id: "${eng}", external_ref: "P-001", eligibility_date: "2024-06-01", entry_date: "2024-07-01", is_eligible: true, is_hce: false, compensation_cy_cents: 5000000, deferral_amount_cy_cents: 100000, opening_balance_cents: 0 }
              as: SponsorAdmin
              captures: { p1: $.data.id }
          trigger:
            - call: "POST /plan-audit/contributions"
              payload: { engagement_id: "${eng}", participant_id: "${p1}", type: "ELECTIVE_DEFERRAL", payroll_date: "2025-06-16", deposit_date: "2025-06-10", amount_cents: 100000 }
              as: SponsorAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == \"ERR_INVALID_DATE_ORDER\""
            - "HTTP status == 422"

      - name: match_outside_statement_period_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=7]", "errors[ERR_STATEMENT_PERIOD_MISMATCH]"]
        distinguishing_aspect: "Matching a contribution whose deposit_date falls outside the statement's closed period is a 422 referential error."
        test_recipe:
          setup: ["engagement 405 with participant, statement covering [2025-01-01, 2025-06-30], and a contribution deposited 2025-08-15"]
          setup_api_calls:
            - call: "POST /plan-audit/engagements"
              payload: { sponsor_ein: "12-3456789", plan_number: "405", plan_name: "Mismatch Plan", plan_year_start: "2025-01-01", plan_year_end: "2026-01-01", plan_type: "DC", funding_arrangement: "TRUST", prior_year_schedule_type: "I" }
              as: SponsorAdmin
              captures: { eng: $.data.id }
            - call: "POST /plan-audit/participants"
              payload: { engagement_id: "${eng}", external_ref: "P-001", eligibility_date: "2024-06-01", entry_date: "2024-07-01", is_eligible: true, is_hce: false, compensation_cy_cents: 5000000, deferral_amount_cy_cents: 100000, opening_balance_cents: 0 }
              as: SponsorAdmin
              captures: { p1: $.data.id }
            - call: "POST /plan-audit/trust-statements"
              payload: { engagement_id: "${eng}", period_start: "2025-01-01", period_end: "2025-06-30", custodian: "National Trust Co", certification: "UNCERTIFIED", reported_deposit_total_cents: 100000 }
              as: SponsorAdmin
              captures: { ts: $.data.id }
            - call: "POST /plan-audit/contributions"
              payload: { engagement_id: "${eng}", participant_id: "${p1}", type: "ELECTIVE_DEFERRAL", payroll_date: "2025-08-01", deposit_date: "2025-08-15", amount_cents: 100000 }
              as: SponsorAdmin
              captures: { c1: $.data.id }
          trigger:
            - call: "POST /plan-audit/contributions/${c1}/match"
              payload: { trust_statement_id: "${ts}" }
              as: SponsorAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == \"ERR_STATEMENT_PERIOD_MISMATCH\""
            - "Contribution.${c1}.match_status == \"UNMATCHED\""

      - name: second_filing_per_engagement_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_FILING_ALREADY_EXISTS]"]
        distinguishing_aspect: "An engagement supports exactly one Form 5500 filing record (amendments live on the same record)."
        test_recipe:
          setup: ["engagement 406 with an existing filing"]
          setup_api_calls:
            - call: "POST /plan-audit/engagements"
              payload: { sponsor_ein: "12-3456789", plan_number: "406", plan_name: "OneFiling Plan", plan_year_start: "2025-01-01", plan_year_end: "2026-01-01", plan_type: "DC", funding_arrangement: "TRUST", prior_year_schedule_type: "I" }
              as: SponsorAdmin
              captures: { eng: $.data.id }
            - call: "POST /plan-audit/filings"
              payload: { engagement_id: "${eng}" }
              as: TPASpecialist
          trigger:
            - call: "POST /plan-audit/filings"
              payload: { engagement_id: "${eng}" }
              as: TPASpecialist
              captures: { err: $.data.error_id }
          assert:
            - "error_id == \"ERR_FILING_ALREADY_EXISTS\""

      - name: distribution_exceeding_balance_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_DISTRIBUTION_EXCEEDS_BALANCE]"]
        distinguishing_aspect: "Executing a corrective distribution larger than the participant's balance is a 422 fiscal error (standalone, no competing higher-priority violation)."
        test_recipe:
          setup: ["engagement 407; participant balance 4000c; acknowledged finding; approved distribution of 5000c"]
          setup_api_calls:
            - call: "POST /plan-audit/engagements"
              payload: { sponsor_ein: "12-3456789", plan_number: "407", plan_name: "Overdraw Plan", plan_year_start: "2025-01-01", plan_year_end: "2026-01-01", plan_type: "DC", funding_arrangement: "TRUST", prior_year_schedule_type: "I" }
              as: SponsorAdmin
              captures: { eng: $.data.id }
            - call: "POST /plan-audit/participants"
              payload: { engagement_id: "${eng}", external_ref: "P-001", eligibility_date: "2024-06-01", entry_date: "2024-07-01", is_eligible: true, is_hce: true, compensation_cy_cents: 10000000, deferral_amount_cy_cents: 500000, opening_balance_cents: 4000 }
              as: SponsorAdmin
              captures: { p1: $.data.id }
            - call: "POST /plan-audit/findings"
              payload: { engagement_id: "${eng}", category: "NONDISCRIMINATION_FAILURE", severity: "MEDIUM", description: "refund due" }
              as: PlanAuditor
              captures: { f1: $.data.id }
            - call: "POST /plan-audit/findings/${f1}/acknowledge"
              payload: {}
              as: SponsorAdmin
              as_user_id: "u-sponsor-1"
            - call: "POST /plan-audit/corrective-actions"
              payload: { engagement_id: "${eng}", finding_id: "${f1}", action_type: "CORRECTIVE_DISTRIBUTION", principal_cents: 5000, planned_execution_date: "2026-03-01", participant_id: "${p1}" }
              as: SponsorAdmin
              as_user_id: "u-sponsor-1"
              captures: { ca: $.data.id }
            - call: "POST /plan-audit/corrective-actions/${ca}/approve"
              payload: {}
              as: EngagementManager
              as_user_id: "u-mgr-1"
          trigger:
            - call: "POST /plan-audit/corrective-actions/${ca}/execute"
              payload: {}
              as: SponsorAdmin
              as_user_id: "u-sponsor-1"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == \"ERR_DISTRIBUTION_EXCEEDS_BALANCE\""
            - "CorrectiveAction.${ca}.status == \"APPROVED\""
            - "Participant.${p1}.account_balance_cents == 4000"

      - name: corrective_action_on_waived_finding_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=4]", "errors[ERR_CORRECTION_NOT_ALLOWED]"]
        distinguishing_aspect: "Creating a corrective action against a WAIVED (terminal) finding is rejected at the state layer."
        test_recipe:
          setup: ["engagement 408; LOW finding waived by EngagementManager"]
          setup_api_calls:
            - call: "POST /plan-audit/engagements"
              payload: { sponsor_ein: "12-3456789", plan_number: "408", plan_name: "WaivedFinding Plan", plan_year_start: "2025-01-01", plan_year_end: "2026-01-01", plan_type: "DC", funding_arrangement: "TRUST", prior_year_schedule_type: "I" }
              as: SponsorAdmin
              captures: { eng: $.data.id }
            - call: "POST /plan-audit/findings"
              payload: { engagement_id: "${eng}", category: "FILING_DEFECT", severity: "LOW", description: "cosmetic" }
              as: PlanAuditor
              captures: { f1: $.data.id }
            - call: "POST /plan-audit/findings/${f1}/waive"
              payload: { justification: "immaterial" }
              as: EngagementManager
          trigger:
            - call: "POST /plan-audit/corrective-actions"
              payload: { engagement_id: "${eng}", finding_id: "${f1}", action_type: "FEE_REDISCLOSURE", principal_cents: 100, planned_execution_date: "2026-04-01" }
              as: SponsorAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == \"ERR_CORRECTION_NOT_ALLOWED\""

      - name: lost_earnings_action_requires_confirmed_assessment
        claim_type: violation_to_error
        grounds: ["validations[priority=4]", "errors[ERR_ASSESSMENT_NOT_CONFIRMED]"]
        distinguishing_aspect: "A LOST_EARNINGS_DEPOSIT referencing an ASSESSED (not yet CONFIRMED) assessment is rejected."
        test_recipe:
          setup: ["engagement 409 small plan; late contribution scanned (assessment ASSESSED, not confirmed); manual finding acknowledged"]
          setup_api_calls:
            - call: "POST /plan-audit/engagements"
              payload: { sponsor_ein: "12-3456789", plan_number: "409", plan_name: "Unconfirmed Plan", plan_year_start: "2025-01-01", plan_year_end: "2026-01-01", plan_type: "DC", funding_arrangement: "TRUST", prior_year_schedule_type: "I" }
              as: SponsorAdmin
              captures: { eng: $.data.id }
            - call: "POST /plan-audit/participants"
              payload: { engagement_id: "${eng}", external_ref: "P-001", eligibility_date: "2024-06-01", entry_date: "2024-07-01", is_eligible: true, is_hce: false, compensation_cy_cents: 5000000, deferral_amount_cy_cents: 100000, opening_balance_cents: 0 }
              as: SponsorAdmin
              captures: { p1: $.data.id }
            - call: "POST /plan-audit/engagements/${eng}/recompute_participant_count"
              payload: {}
              as: TPASpecialist
            - call: "POST /plan-audit/contributions"
              payload: { engagement_id: "${eng}", participant_id: "${p1}", type: "ELECTIVE_DEFERRAL", payroll_date: "2025-06-16", deposit_date: "2025-06-30", amount_cents: 100000 }
              as: SponsorAdmin
            - call: "POST /plan-audit/engagements/${eng}/late-deposit-scan"
              payload: {}
              as: TPASpecialist
            - call: "GET /plan-audit/late-contribution-assessments"
              payload: { engagement_id: "${eng}" }
              as: Any
              captures: { asm: "$.data[0].id" }
            - call: "POST /plan-audit/findings"
              payload: { engagement_id: "${eng}", category: "LATE_REMITTANCE", severity: "MEDIUM", description: "manual companion finding" }
              as: PlanAuditor
              captures: { f1: $.data.id }
            - call: "POST /plan-audit/findings/${f1}/acknowledge"
              payload: {}
              as: SponsorAdmin
              as_user_id: "u-sponsor-1"
          trigger:
            - call: "POST /plan-audit/corrective-actions"
              payload: { engagement_id: "${eng}", finding_id: "${f1}", action_type: "LOST_EARNINGS_DEPOSIT", principal_cents: 100000, planned_execution_date: "2026-02-27", assessment_id: "${asm}" }
              as: SponsorAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == \"ERR_ASSESSMENT_NOT_CONFIRMED\""
            - "LateContributionAssessment.${asm}.status == \"ASSESSED\""

      - name: existence_check_left_to_right
        claim_type: priority_ordering
        grounds: ["validations[priority=3]", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "With a bad engagement id AND a bad finding id, the leftmost path/body reference (engagement) reports 404 first."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /plan-audit/findings"
              payload: { engagement_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", category: "FILING_DEFECT", severity: "LOW", description: "x", contribution_id: "1b2c3d4e-5f6a-4b7c-8d9e-0f1a2b3c4d5e" }
              as: PlanAuditor
              captures: { err: $.data.error_id }
          assert:
            - "error_id == \"ERR_NOT_FOUND\""
            - "HTTP status == 404"

  # ===========================================================================
  # Section: endpoints
  # ===========================================================================
  - section: endpoints
    instances:
      - name: findings_list_filter_by_status
        claim_type: list_filtering
        grounds: [endpoints]
        distinguishing_aspect: "GET /plan-audit/findings?status=OPEN returns only OPEN findings of the engagement."
        test_recipe:
          setup: ["engagement 501 with one OPEN finding and one WAIVED finding"]
          setup_api_calls:
            - call: "POST /plan-audit/engagements"
              payload: { sponsor_ein: "12-3456789", plan_number: "501", plan_name: "Filter Plan", plan_year_start: "2025-01-01", plan_year_end: "2026-01-01", plan_type: "DC", funding_arrangement: "TRUST", prior_year_schedule_type: "I" }
              as: SponsorAdmin
              captures: { eng: $.data.id }
            - call: "POST /plan-audit/findings"
              payload: { engagement_id: "${eng}", category: "FILING_DEFECT", severity: "LOW", description: "one" }
              as: PlanAuditor
              captures: { f1: $.data.id }
            - call: "POST /plan-audit/findings"
              payload: { engagement_id: "${eng}", category: "FEE_DISCLOSURE_GAP", severity: "LOW", description: "two" }
              as: PlanAuditor
              captures: { f2: $.data.id }
            - call: "POST /plan-audit/findings/${f2}/waive"
              payload: { justification: "immaterial" }
              as: EngagementManager
          trigger:
            - call: "GET /plan-audit/findings"
              payload: { engagement_id: "${eng}", status: "OPEN" }
              as: Any
          assert:
            - "response contains exactly 1 finding, with id == ${f1}"
            - "total_count == 1"

      - name: amendment_on_non_accepted_filing_rejected
        claim_type: conditional_action
        grounds: [state_machines.Form5500Filing, "errors[ERR_AMENDMENT_NOT_ALLOWED]"]
        distinguishing_aspect: "amendments on a DRAFT filing is rejected; the amend path exists only from ACCEPTED."
        test_recipe:
          setup: ["engagement 502 with filing in DRAFT"]
          setup_api_calls:
            - call: "POST /plan-audit/engagements"
              payload: { sponsor_ein: "12-3456789", plan_number: "502", plan_name: "AmendGate Plan", plan_year_start: "2025-01-01", plan_year_end: "2026-01-01", plan_type: "DC", funding_arrangement: "TRUST", prior_year_schedule_type: "I" }
              as: SponsorAdmin
              captures: { eng: $.data.id }
