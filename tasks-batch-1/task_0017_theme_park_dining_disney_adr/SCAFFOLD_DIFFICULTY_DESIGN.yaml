            - call: "POST /v1/guests"
              payload: { email: "g_ci2b@x.com", full_name: "CI2B Guest", home_timezone: "America/New_York" }
              as: PlatformAdmin
              captures: { g_b_id: $.data.id }
            - call: "POST /v1/dining-plans"
              payload: { guest_id: "${g_b_id}", tier: "DELUXE", table_service_credits_initial: 10, valid_from: "2026-01-01T00:00:00Z", valid_until: "2026-12-31T00:00:00Z" }
