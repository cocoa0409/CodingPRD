            - { call: "POST /midway/fairs", payload: { name: "Fair B", operator_company_name: "OtherCo", location: "Lot B", setup_start_date: "2026-08-01", opening_date: "2026-08-03", closing_date: "2026-08-05", teardown_end_date: "2026-08-07", midway_capacity: 300 }, as: StateProgramAdmin, captures: { fair_b: "$.data.id" } }
