            - call: "POST /proctor-sessions"
              payload: { course_enrollment_id: "${enr_id}", proctor_station_id: "${stn_id}", scheduled_start: "2026-08-05T09:00:00.000Z", scheduled_end: "2026-08-05T10:00:00.000Z" }
