  # ===========================================================================
  - section: calculations
    instances:

      - name: compare_at_substantiation_gate_and_omission_boundary
        claim_type: Variant Divergence
        grounds:
          - calculations.compare_at_substantiation
          - entities.Ticket.fields.compare_at_omitted
        distinguishing_aspect: "In vendor_claim zone MT (multiplier 2.0): a claim of exactly ceil(9999*2.0)=19998 substantiates (>=), 19997 is omitted without rejecting the ticket — the ticket is issued either way, only compare_at_cents changes."
        test_recipe:
          setup:
            - "Clock 2026-09-01. Season SS2027 OPEN. Vendor STANDARD zone MT. Lot accepted with two lines both target_retail 10000 (ticket retail 9999): line A claim 19998, line B claim 19997."
          setup_api_calls:
            - *k_clock
            - *k_season
            - call: "POST /merchandise-seasons/${k_season_id}/open"
              payload: {}
              as: PlanningLead
            - *k_zone_mt
            - *k_vendor
            - call: "POST /lots"
              payload: { lot_code: "CA1", vendor_id: "${k_vendor_id}", season_id: "${k_season_id}", lot_type: "CLOSEOUT", disposition: "IMMEDIATE", asking_price_cents: 1000000, unit_count: 100, expected_sell_through_pct: 0.9, estimated_unit_retail_cents: 5000, offer_expires_at: "2026-12-01T00:00:00Z" }
              as: Buyer
              captures: { lot_ca_id: $.data.id }
            - call: "POST /lots/${lot_ca_id}/lot-lines"
              payload: { style_code: "CA-A", department: "APPAREL", quantity: 50, unit_cost_cents: 11500, compare_at_claim_cents: 19998, target_retail_cents: 10000 }
              as: Buyer
              captures: { line_caa_id: $.data.id }
            - call: "POST /lots/${lot_ca_id}/lot-lines"
              payload: { style_code: "CA-B", department: "APPAREL", quantity: 50, unit_cost_cents: 11500, compare_at_claim_cents: 19997, target_retail_cents: 10000 }
              as: Buyer
              captures: { line_cab_id: $.data.id }
            - call: "POST /lots/${lot_ca_id}/evaluate"
              payload: {}
              as: Buyer
            - call: "POST /lots/${lot_ca_id}/accept"
              payload: { expected_season_version: "${k_season_v}" }
              as: Buyer
          trigger:
            - call: "POST /tickets"
              payload: { lot_line_id: "${line_caa_id}", zone_code: "MT" }
              as: PricingAnalyst
              captures: { ticket_caa: $.data.id }
            - call: "POST /tickets"
              payload: { lot_line_id: "${line_cab_id}", zone_code: "MT" }
