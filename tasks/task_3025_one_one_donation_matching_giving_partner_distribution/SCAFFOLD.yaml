  - method: GET
    path: "/impact-program/sales-order-lines"
    description: "List sales order lines across orders, filterable by order, product or variant"
    roles: [CustomerService, ImpactAuditor, ProvisioningPartner]
    code: 200
    input: ["sales_order_id?", "donation_product_id?", "donation_product_line_id?", "status?", "limit?", "offset?"]
    output: "SalesOrderLine[]"
    side_effects: []

  - method: GET
    path: "/impact-program/sales-order-lines/{line_id}"
    description: "Get one sales order line by its own id"
    roles: [CustomerService, ImpactAuditor, ProvisioningPartner]
    code: 200
    input: []
    output: SalesOrderLine
    side_effects: []

  - method: GET
    path: "/impact-program/impact-seasons/{season_id}/audits"
    description: "Find the audits raised against a season"
    roles: [ImpactAuditor, MarketingManager]
    code: 200
    input: ["audit_kind?", "status?", "limit?", "offset?"]
    output: "ImpactAudit[]"
    side_effects: []

  - method: GET
    path: "/_healthz"
    description: "Liveness probe used by the harness"
    roles: [GivingPartnerCoordinator, ProvisioningPartner, AllocationPlanner, FulfillmentOperator, CustomerService, MarketingManager, ImpactAuditor, ProductDesigner]
    code: 200
    input: []
    output: { status: string, logical_clock_default: string, server_started_at: string }
    side_effects: []

# =============================================================================
# Table 6 (SKILL §1.6): Error Code Catalog
# Every entry is triggerable and names the validation priority or transition
# that raises it.
# =============================================================================
errors:

  - id: ERR_MISSING_AUTH_CONTEXT
    http: 401
    condition: "X-User-Role or X-User-ID absent, or X-User-Role names a role not declared in §1.7"
    raised_by: "validations[priority=1]"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "The acting role is not permitted for the endpoint, or the acting entity_backed role does not own the resource it is addressing"
    raised_by: "validations[priority=2]"
  - id: ERR_PARTNER_NOT_FOUND
    http: 404
    condition: "No GivingPartner exists for the partner_id path segment"
    raised_by: "validations[priority=3]"
  - id: ERR_PRODUCT_NOT_FOUND
    http: 404
    condition: "No DonationProduct exists for the product_id path segment"
    raised_by: "validations[priority=3]"
  - id: ERR_DONATION_PRODUCT_LINE_NOT_FOUND
    http: 404
    condition: "No DonationProductLine exists for the line_id path segment"
    raised_by: "validations[priority=3]"
  - id: ERR_SALES_ORDER_NOT_FOUND
    http: 404
    condition: "No SalesOrder exists for the order_id path segment"
    raised_by: "validations[priority=3]"
  - id: ERR_SALES_ORDER_LINE_NOT_FOUND
    http: 404
    condition: "No SalesOrderLine exists for the line_id path segment, or it belongs to a different order"
    raised_by: "validations[priority=3]"
  - id: ERR_SEASON_NOT_FOUND
    http: 404
    condition: "No ImpactSeason exists for the season_id path segment or the requested season_code"
    raised_by: "validations[priority=3]"
  - id: ERR_LIABILITY_NOT_FOUND
    http: 404
    condition: "No DonationLiability exists for the liability_id path segment"
    raised_by: "validations[priority=3]"
  - id: ERR_CLAIM_NOT_FOUND
    http: 404
    condition: "No MarketingClaim exists for the claim_id path segment"
    raised_by: "validations[priority=3]"
  - id: ERR_ALLOCATION_NOT_FOUND
    http: 404
    condition: "No DonationAllocation exists for the allocation_id path segment"
    raised_by: "validations[priority=3]"
  - id: ERR_DISTRIBUTION_NOT_FOUND
    http: 404
    condition: "No DonationDistribution exists for the distribution_id path segment"
    raised_by: "validations[priority=3]"
  - id: ERR_AUDIT_NOT_FOUND
    http: 404
    condition: "No ImpactAudit exists for the audit_id path segment"
    raised_by: "validations[priority=3]"
  - id: ERR_VETTING_ROUND_NOT_FOUND
    http: 404
    condition: "No GivingPartnerVetting exists for the vetting_id path segment"
    raised_by: "validations[priority=3]"
  - id: ERR_RETURN_REQUEST_NOT_FOUND
    http: 404
    condition: "No ReturnRequest exists for the return_id path segment"
    raised_by: "validations[priority=3]"
  - id: ERR_CAPACITY_PROFILE_NOT_FOUND
    http: 404
    condition: "No PartnerCapacityProfile exists for the profile_id path segment"
    raised_by: "validations[priority=3]"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "A required body field is missing, an enum member is undeclared, or an integer range is violated"
    raised_by: "validations[priority=4]"
  - id: ERR_INVALID_STATE_TRANSITION
    http: 409
    condition: "The target resource is not in a state from which the requested transition is declared"
    raised_by: "validations[priority=5]; state_machines.DonationAllocation.APPROVED_to_APPROVED"
  - id: ERR_FULFILLMENT_REGRESSION
    http: 409
    condition: "The requested fulfillment_status is not strictly later than the stored fulfillment_status"
    raised_by: "validations[priority=6]"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_<parent>_version does not equal the stored parent version"
    raised_by: "validations[priority=7]; concurrency_rules[benefit-allocation-stale-partner], [claim-substantiation-stale-liability], [season-freeze-stale-season], [audit-finalize-stale-audit], [return-creation-stale-order-line], [allocation-reallocation-stale-allocation]"
  - id: ERR_PARTNER_SUSPENDED
    http: 409
    condition: "The naming partner's status is SUSPENDED and the allocation's priority_tier is not EMERGENCY"
    raised_by: "validations[priority=8]"
  - id: ERR_PARTNER_NOT_APPROVED
    http: 409
    condition: "The naming partner's status is not APPROVED for a benefit allocation (SUSPENDED, INACTIVE, REJECTED or REJECTED_FINAL)"
    raised_by: "validations[priority=9]"
  - id: ERR_DUPLICATE_RESOURCE
    http: 409
    condition: "A unique key already exists — duplicate order_number, duplicate (partner_id, season_code) capacity profile, or a second season already FROZEN"
    raised_by: "validations[priority=10]"
  - id: ERR_CAPACITY_PROFILE_AMBIGUOUS
    http: 409
    condition: "Two selectable PartnerCapacityProfile rows resolve for the same partner and season"
    raised_by: "validations[priority=11]"
  - id: ERR_SEASON_FROZEN
    http: 409
    condition: "The write instant falls after the resolved season's freezes_at, or the target season's status is FINALIZED"
    raised_by: "validations[priority=12]"
  - id: ERR_RETURN_WINDOW_CLOSED
    http: 422
    condition: "The return request falls outside the line's return window and is neither a defect claim nor covered by a season window reset"
    raised_by: "validations[priority=13]"
  - id: ERR_ADDON_TIER_BOUNDARY
    http: 409
    condition: "The add-on tier divisor was selected on base_units after the surcharge was already added"
    raised_by: "validations[priority=14]"
  - id: ERR_CAPACITY_EXCEEDED
    http: 409
    condition: "capacity_utilization_units would exceed max_allocatable_units for the resolved (partner, season) profile"
    raised_by: "validations[priority=15]; state_machines.PartnerCapacityProfile.ACTIVE_to_EXHAUSTED"
  - id: ERR_LIABILITY_INSUFFICIENT
    http: 409
    condition: "The liability's available units are fewer than allocated_units, or the covering claim is OVERSTATED"
    raised_by: "validations[priority=16]"
  - id: ERR_CLAIM_PERIOD_UNSUPPORTED
    http: 409
    condition: "The claim's stated_reference_period is null or names a window the season does not cover"
    raised_by: "validations[priority=17]"
  - id: ERR_ENTITY_UNRESOLVED
    http: 409
    condition: "Referenced resources disagree on their external identity — gtin mismatch, replacement product not ACTIVE, or a claim for a different product"
    raised_by: "validations[priority=18]"
  - id: ERR_NEED_SCORE_BELOW_MINIMUM
    http: 409
    condition: "Computed need_score is below 40 at the instant of vetting approval"
    raised_by: "state_machines.GivingPartner.VETTING_to_APPROVED"
  - id: ERR_VETTING_ROUND_TERMINAL
    http: 409
    condition: "The vetting round is already EXPIRED, so no outcome can be recorded against it"
    raised_by: "state_machines.GivingPartnerVetting.REQUESTED_to_EXPIRED"
  - id: ERR_PARTNER_REJECTION_FINAL
    http: 409
    condition: "GivingPartner.total_rejections is already 2, so the rejection cannot be reopened"
    raised_by: "state_machines.GivingPartner.REJECTED_to_VETTING"
  - id: ERR_REGISTRY_NOT_VERIFIED
    http: 409
    condition: "registry_verified is false, or one of the four verification flags is false, at the instant of vetting approval"
    raised_by: "state_machines.GivingPartner.VETTING_to_APPROVED"
  - id: ERR_DESIGN_WEIGHT_BELOW_MINIMUM
    http: 409
    condition: "design_weight_score is below 60, so a DRAFT donation product cannot be activated"
    raised_by: "state_machines.DonationProduct.DRAFT_to_ACTIVE"
  - id: ERR_LINE_NOT_DONATION_ELIGIBLE
    http: 409
    condition: "The SalesOrderLine's DonationProductLine has donation_eligible false, so no obligation accrues"
    raised_by: "state_machines.DonationLiability.ACCUMULATING_to_ACCUMULATING"
  - id: ERR_OBLIGATION_ALREADY_VESTED
    http: 409
    condition: "The line's obligation has already vested into a non-OPEN season and cannot be reverted"
    raised_by: "state_machines.DonationProductLine.VESTED_to_ACTIVE"
  - id: ERR_PARTNER_CAPACITY_LOCKED
    http: 409
    condition: "Every capacity profile for the partner and season is LOCKED or SUPERSEDED"
    raised_by: "state_machines.PartnerCapacityProfile.LOCKED_to_ACTIVE"
  - id: ERR_ALLOCATION_NOT_REVERSIBLE
    http: 409
    condition: "The allocation is not RECEIVED, or its impact_units_confirmed is non-zero while the season delta is non-negative"
    raised_by: "state_machines.DonationAllocation.RECEIVED_to_REVERSED"
  - id: ERR_REVERSAL_REQUIRES_RECEIVED
    http: 409
    condition: "A REVERSAL allocation was attempted from a status other than RECEIVED"
    raised_by: "state_machines.DonationAllocation.RECEIVED_to_REVERSED"
  - id: ERR_SHIPMENT_EXCEEDS_ALLOCATION
    http: 409
    condition: "shipped_units exceeds the allocation's allocated_units"
    raised_by: "state_machines.DonationAllocation.APPROVED_to_SHIPPED"
  - id: ERR_RECEIPT_EXCEEDS_SHIPMENT
    http: 409
    condition: "Cumulative confirmed received_units exceeds shipped_units"
    raised_by: "state_machines.DonationDistribution.PARTIALLY_RECEIVED_to_RECEIVED"
  - id: ERR_DISTRIBUTION_NOT_IN_TRANSIT
    http: 409
    condition: "A receipt was confirmed against a distribution that is COMPLETED, WRITTEN_OFF or VOIDED"
    raised_by: "state_machines.DonationDistribution.SHIPPED_to_RECEIVED"
  - id: ERR_DISCREPANCY_NOT_RAISED
    http: 409
    condition: "A write-off was attempted on a distribution that is not DISCREPANCY_CLAIMED"
    raised_by: "state_machines.DonationDistribution.DISCREPANCY_CLAIMED_to_WRITTEN_OFF"
  - id: ERR_ZERO_SHIPPED_UNITS
    http: 409
    condition: "An audit finalization was attempted against a season with shipped_units_verified of 0, so the clearance rate is undefined"
    raised_by: "state_machines.ImpactAudit.IN_PROGRESS_to_FINALIZED"
  - id: ERR_OUTSTANDING_DISTRIBUTIONS
    http: 409
    condition: "A season finalization was attempted while a distribution in the season is still SHIPPED or PARTIALLY_RECEIVED with non-zero impact_units_confirmed"
    raised_by: "state_machines.ImpactSeason.PLANNED_to_FINALIZED"
  - id: ERR_CARRY_PRECONDITION_UNMET
    http: 409
    condition: "A carry-forward was attempted while required_stated_units is not greater than frozen_units, or the named source season is not CLOSED"
    raised_by: "state_machines.DonationLiability.FROZEN_to_CARRIED"
  - id: ERR_CLAIM_ALREADY_REVOKED
    http: 409
    condition: "A claim in status REVOKED was addressed by any further substantiation or derive-build call"
    raised_by: "state_machines.MarketingClaim.SUBSTANTIATED_to_REVOKED"
  - id: ERR_CLAIM_WINDOW_UNSUBSTANTIATED
    http: 409
    condition: "The claim's stated_reference_period window contains no shipped or capacity-committed units to draw on"
    raised_by: "state_machines.MarketingClaim.DRAFT_to_SUBSTANTIATED"
  - id: ERR_AUDIT_ALREADY_FINALIZED
    http: 409
    condition: "Fieldwork was started or an exception count rewritten on an audit already in FINALIZED"
    raised_by: "state_machines.ImpactAudit.SCHEDULED_to_IN_PROGRESS"
  - id: ERR_AUDIT_LOCK_NOT_RESETTABLE
    http: 409
    condition: "An audit reopen or a liability unfreeze was attempted while the RESET_AUDIT_LOCK flag is false"
    raised_by: "state_machines.ImpactAudit.FINALIZED_to_REOPENED"
  - id: ERR_AUDIT_SOD_VIOLATION
    http: 403
    condition: "The acting X-User-ID performed the preliminary review of the same audit and therefore cannot finalize it"
    raised_by: "state_machines.ImpactAudit.IN_PROGRESS_to_FINALIZED"
  - id: ERR_RECEIPT_SAMPLE_EXCEEDS_PLAN
    http: 409
    condition: "transaction_test_exceptions exceeds transaction_test_sample_size, or the declared sample size is below the pinned sample formula's floor"
    raised_by: "calculations.impact_audit_reconciliation"
  - id: ERR_SALES_ORDER_ALREADY_PAID
    http: 409
    condition: "Payment was captured on an order that is already PAID or DONATION_SATISFIED"
    raised_by: "state_machines.SalesOrder.CREATED_to_PAID"
  - id: ERR_SALES_ORDER_CANCELLED
    http: 409
    condition: "A line was added, settled or paid on an order whose status is CANCELLED"
    raised_by: "state_machines.SalesOrder.CREATED_to_CANCELLED"
  - id: ERR_LINE_ALREADY_RETURNED
    http: 409
    condition: "A return request was opened for a line whose status is already RETURNED_CREDITED outside a PLANNED season"
    raised_by: "state_machines.SalesOrderLine.RETURNED_CREDITED_to_RETURN_REQUESTED"
  - id: ERR_EXCHANGE_REPLACEMENT_INVALID
    http: 409
    condition: "is_exchange is true but replacement_product_id does not name an ACTIVE DonationProduct"
    raised_by: "state_machines.SalesOrderLine.RETURN_APPROVED_to_EXCHANGED_REPLACED"
  - id: ERR_EXEMPTION_REASON_INVALID
    http: 409
    condition: "A line exemption was requested with a reason other than GOODWILL or DEFECT"
    raised_by: "state_machines.SalesOrderLine.OPEN_to_EXEMPTED"
  - id: ERR_CLOCK_ROLL_CONFLICT
    http: 409
    condition: "The requested clock instant would re-enter an already materialized season or move backwards across a frozen boundary"
    raised_by: "endpoints.POST_/_clock/set_current_utc"
  - id: ERR_ALLOCATION_VERSION_SUPERSEDED
    http: 409
    condition: "A reallocation was attempted against an allocation whose cancellation has already been superseded by a reversal"
    raised_by: "concurrency_rules[allocation-reallocation-stale-allocation]"
  - id: ERR_ALLOCATION_DISTRIBUTION_EXISTS
    http: 409
    condition: "A cancel or reallocation was attempted after a distribution for the allocation shipped one or more units"
    raised_by: "state_machines.DonationAllocation.APPROVED_to_CANCELLED"

# =============================================================================
# Table 7 (SKILL §1.7): RBAC Matrix
# Role model: segregation_of_duties. No role may both commit an allocation and
# finalize the audit that grades it, and the three storage roles are split
# across three roles so no single actor holds the whole path from commitment to
# verification.
# =============================================================================
roles:

  - name: GivingPartnerCoordinator
    description: "Onboards and vets partner organizations, records vetting evidence, declares capacity, and confirms partner receipts"
    identity: opaque
    exclusive_operations:
      - "POST /giving-partners"
      - "PUT /giving-partners/{partner_id}"
      - "POST /giving-partners/{partner_id}/capacity-profiles"
      - "PUT /vetting-rounds/{vetting_id}"
      - "POST /vetting-rounds/{vetting_id}/approve"
      - "POST /vetting-rounds/{vetting_id}/reject"
      - "POST /vetting-rounds/{vetting_id}/reopen"
      - "POST /distributions/{distribution_id}/receipts"
    shared_operations:
      - "GET /giving-partners, GET /giving-partners/{partner_id}"
      - "GET /giving-partners/{partner_id}/capacity-profiles, GET /giving-partners/{partner_id}/vetting-rounds"
      - "GET /vetting-rounds, GET /vetting-rounds/{vetting_id}"
      - "GET /giving-partners/{partner_id}/allocations, GET /allocations, GET /allocations/{allocation_id}"
      - "GET /distributions, GET /distributions/{distribution_id}, GET /allocations/{allocation_id}/distributions"
      - "GET /impact-seasons, GET /impact-seasons/{season_id}, GET /impact-seasons/{season_id}/distributions"
      - "PUT /giving-partners/{partner_id}/status (shared with ImpactAuditor)"
      - "GET /marketing-claims, GET /marketing-claims/{claim_id}"

  - name: GivingPartnerOrg
    description: "The partner organization acting as itself; may confirm receipt only for allocations attributed to its own GivingPartner id and read only its own roll-ups"
    identity: entity_backed:GivingPartner
    exclusive_operations: []
    shared_operations:
      - "POST /distributions/{distribution_id}/receipts (ownership-filtered: X-User-ID must equal the allocation's giving_partner_id)"
      - "GET /giving-partners/{partner_id} (ownership-filtered)"
      - "GET /giving-partners/{partner_id}/attributed-units (ownership-filtered)"
      - "GET /giving-partners/{partner_id}/return-exposure (ownership-filtered)"

  - name: ProvisioningPartner
    description: "Owns donation product design, the sold-versus-donated split and the operational plan behind the pledge"
    identity: opaque
    exclusive_operations:
      - "POST /donation-products"
      - "PUT /donation-products/{product_id}"
      - "POST /donation-products/{product_id}/activate"
      - "POST /donation-products/{product_id}/lines"
      - "PUT /donation-product-lines/{line_id}"
    shared_operations:
      - "GET /donation-products, GET /donation-products/{product_id}"
      - "GET /donation-products/{product_id}/lines, GET /donation-product-lines/{line_id}"
      - "GET /giving-partners, GET /giving-partners/{partner_id}/return-exposure"
      - "GET /sales-order-lines, GET /sales-order-lines/{line_id}"
      - "GET /return-requests, GET /return-requests/{return_id}"

  - name: AllocationPlanner
    description: "Chooses beneficiaries, commits benefit allocations against partner capacity, reallocates and reverses supply, and carries unsubstantiated units forward"
    identity: opaque
    exclusive_operations:
      - "POST /allocation-plans/{plan_id}/commit"
      - "POST /allocation-plans/{plan_id}/allocate"
      - "POST /allocation-plans/{plan_id}/revert"
      - "POST /allocations/{allocation_id}/approve"
      - "POST /allocations/{allocation_id}/cancel"
      - "POST /allocations/{allocation_id}/reallocations"
      - "POST /allocations/{allocation_id}/reversals"
      - "POST /liabilities/{liability_id}/carry-forward"
    shared_operations:
      - "GET /allocation-plans/{plan_id}"
      - "GET /allocations, GET /allocations/{allocation_id}"
      - "GET /capacity-profiles, GET /capacity-profiles/{profile_id}, GET /giving-partners/{partner_id}/capacity-profiles"
      - "GET /liabilities, GET /liabilities/{liability_id}, GET /donation-products/{product_id}/liabilities"
      - "GET /impact-seasons, GET /impact-seasons/{season_id}, GET /impact-seasons/{season_id}/allocations, GET /impact-seasons/{season_id}/liabilities"
      - "GET /giving-partners, GET /giving-partners/{partner_id}, GET /giving-partners/{partner_id}/allocations"

  - name: FulfillmentOperator
    description: "Ships committed units, settles donation lines out of the warehouse, and closes, writes off or voids distributions"
    identity: opaque
    exclusive_operations:
      - "POST /allocations/{allocation_id}/distributions"
      - "POST /distributions/{distribution_id}/complete"
      - "POST /distributions/{distribution_id}/discrepancies"
      - "POST /distributions/{distribution_id}/write-off"
      - "POST /distributions/{distribution_id}/void"
      - "POST /sales-orders/{order_id}/lines/{line_id}/settle"
      - "PATCH /sales-orders/{order_id}/fulfillment"
    shared_operations:
      - "GET /allocations, GET /allocations/{allocation_id}"
      - "GET /distributions, GET /distributions/{distribution_id}, GET /allocations/{allocation_id}/distributions"
      - "GET /impact-seasons/{season_id}, GET /impact-seasons/{season_id}/allocations, GET /impact-seasons/{season_id}/distributions"
      - "GET /giving-partners/{partner_id}/allocations"

  - name: CustomerService
    description: "Creates retail orders, takes payment, and processes returns and exchanges without ever touching partner allocation or audit state"
    identity: opaque
    exclusive_operations:
      - "POST /sales-orders"
      - "POST /sales-orders/{order_id}/lines"
      - "POST /sales-orders/{order_id}/pay"
      - "POST /sales-orders/{order_id}/cancel"
      - "POST /sales-orders/{order_id}/lines/{line_id}/return-requests"
      - "POST /sales-orders/{order_id}/lines/{line_id}/exempt"
      - "POST /return-requests"
      - "POST /return-requests/{return_id}/approve"
      - "POST /return-requests/{return_id}/reject"
      - "POST /return-requests/{return_id}/credit"
    shared_operations:
      - "GET /sales-orders, GET /sales-orders/{order_id}, GET /sales-orders/{order_id}/lines, GET /sales-orders/{order_id}/lines/{line_id}"
      - "GET /sales-order-lines, GET /sales-order-lines/{line_id}"
      - "GET /return-requests, GET /return-requests/{return_id}, GET /sales-orders/{order_id}/lines/{line_id}/return-requests"
      - "GET /donation-products, GET /donation-products/{product_id}, GET /donation-products/{product_id}/lines, GET /donation-product-lines/{line_id}"

  - name: MarketingManager
    description: "Publishes donation claims and holds the sole authority to substantiate, derive-build or revoke them"
    identity: opaque
    exclusive_operations:
      - "POST /marketing-claims"
      - "POST /marketing-claims/{claim_id}/substantiate"
      - "POST /marketing-claims/{claim_id}/derive-build"
      - "POST /marketing-claims/{claim_id}/revoke"
    shared_operations:
      - "GET /marketing-claims, GET /marketing-claims/{claim_id}"
      - "GET /donation-products/{product_id}/claims, GET /impact-seasons/{season_id}/claims"
      - "GET /impact-seasons, GET /impact-seasons/{season_id}, GET /impact-seasons/{season_id}/summary"
      - "GET /giving-partners, GET /giving-partners/{partner_id}, GET /giving-partners/{partner_id}/attributed-units"
      - "GET /impact-audits, GET /impact-audits/{audit_id}, GET /impact-audits/{audit_id}/summary"
      - "GET /liabilities, GET /liabilities/{liability_id}"
      - "GET /sales-orders, GET /sales-orders/{order_id}"

  - name: ImpactAuditor
    description: "Runs annual impact and partner performance audits, finalizes the season reporting claim, and suspends partners; may not create allocations"
    identity: opaque
    exclusive_operations:
      - "POST /impact-seasons"
      - "PUT /impact-seasons/{season_id}/frozen-state"
      - "POST /impact-seasons/{season_id}/close"
      - "POST /impact-seasons/{season_id}/reopen"
      - "POST /impact-audits"
      - "POST /impact-audits/{audit_id}/start"
      - "POST /impact-audits/{audit_id}/finalize"
      - "POST /impact-audits/{audit_id}/reopen"
      - "PUT /liabilities/{liability_id}/unfreeze"
      - "PUT /giving-partners/{partner_id}/status (shared with GivingPartnerCoordinator)"
    shared_operations:
      - "GET /impact-seasons, GET /impact-seasons/{season_id}, GET /impact-seasons/{season_id}/summary, GET /impact-seasons/{season_id}/audits"
      - "GET /impact-audits, GET /impact-audits/{audit_id}, GET /impact-audits/{audit_id}/summary"
      - "GET /giving-partners, GET /giving-partners/{partner_id}, GET /giving-partners/{partner_id}/attributed-units, GET /giving-partners/{partner_id}/return-exposure"
      - "GET /allocations, GET /allocations/{allocation_id}, GET /giving-partners/{partner_id}/allocations"
      - "GET /distributions, GET /distributions/{distribution_id}, GET /impact-seasons/{season_id}/distributions"
      - "GET /liabilities, GET /liabilities/{liability_id}, GET /impact-seasons/{season_id}/liabilities"
      - "GET /marketing-claims, GET /marketing-claims/{claim_id}"
      - "GET /capacity-profiles, GET /capacity-profiles/{profile_id}, GET /giving-partners/{partner_id}/capacity-profiles"
      - "GET /vetting-rounds, GET /vetting-rounds/{vetting_id}, GET /giving-partners/{partner_id}/vetting-rounds"
      - "GET /sales-orders, GET /sales-orders/{order_id}, GET /sales-order-lines, GET /sales-order-lines/{line_id}"
      - "GET /return-requests, GET /return-requests/{return_id}"
      - "GET /allocation-plans/{plan_id}"

