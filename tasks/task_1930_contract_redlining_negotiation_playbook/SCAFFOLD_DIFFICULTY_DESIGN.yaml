        grounds:
          - validations[priority=17]
          - entities.SignaturePacket.fields.signature_window_opens_at
          - entities.SignaturePacket.fields.signature_window_closes_at
        distinguishing_aspect: |
          Interval semantics: CLOSED interval [opens_at, closes_at] — both
          endpoints inclusive. A signature timestamp exactly equal to
          opens_at succeeds; one exactly equal to closes_at succeeds; one
          microsecond outside either fails with ERR_SIGNATURE_WINDOW_VIOLATION.
          Resource: SignaturePacket; metric: signature timestamp.
        test_recipe:
          setup:
            - "SignaturePacket with window [2026-08-10T00:00:00Z, 2026-08-20T23:59:59Z]"
            - "Two signatories; clock controllable"
