  - rule_id: compensating_invariant
    instances:
      - name: correction_reversal_preserves_shipped_unit_conservation_and_ledger_sum
        grounds:
          - calculations.distribution_unit_conservation
          - validations[priority=56]
          - entities.DistributionRecord.fields.units_outstanding
          - entities.ComplianceLedgerEntry.fields.signed_units_delta
        distinguishing_aspect: |
          Conserved quantity #1: SHIPPED UNITS. Across three records, verified + outstanding must equal
          units_shipped after every entry, and the withdrawal's shipped_units_total must never move. A
          CORRECTION_REVERSAL of 100 verified-return units is the compensating write: it walks the
          verified bucket back down, pushes the outstanding count back up by the same amount, and
          appends a negative UNIT_MOVEMENT ledger delta so the running ledger sum still reconciles to
          the verified total. A reversal larger than the bucket balance is refused rather than driving
          the bucket negative, so the invariant cannot be broken from either direction.
        test_recipe:
          setup:
            - "one REGISTERED facility, one ResponsiblePerson, one DRAFT listing with lot_authorized_units 2000"
            - "three DistributionRecord rows on distinct lots: 600, 500 and 400 units (1500 shipped in total)"
            - "a VOLUNTARY_NOTICE / CLASS_II RecallAction accepted by OFF-1, an OPEN withdrawal opened by OFF-2 with all three records produced"
            - "verified recoveries of 400 (record 1), 200 (record 2) and 100 (record 3), so verified_recovered_units is 700 and outstanding_units_total is 800"
          setup_api_calls:
            - call: "POST /cosmetics/facilities"
              payload: { facility_name: "Windrow Fill Services", owner_operator_name: "Windrow Inc", facility_type: "PROCESSOR", country_code: "US", state_or_province: "IA" }
              as: FacilityRegistrant
              captures: { fac_id: $.data.id }
            - call: "POST /cosmetics/facilities/${fac_id}/submit-registration"
              payload: {}
              as: FacilityRegistrant
              as_user_id: "${fac_id}"
            - call: "POST /cosmetics/facilities/${fac_id}/registration-decision"
              payload: { decision: "APPROVE" }
              as: RegulatoryReviewer
              as_user_id: "RVW-1"
            - call: "POST /cosmetics/responsible-persons"
              payload: { legal_name: "Windrow Brands LLC", us_address_line: "6 Prairie Rd, Des Moines IA 50309", contact_phone: "+1-202-555-0125", contact_email: "rp@windrow.example" }
              as: ResponsiblePersonAgent
              captures: { rp_id: $.data.id }
            - call: "POST /cosmetics/listings"
              payload: { facility_id: "${fac_id}", responsible_person_id: "${rp_id}", product_name: "Windrow Suntan Lotion", category_code: "12A", product_form: "LEAVE_ON", professional_use_only: false, label_contact_type: "ELECTRONIC_CONTACT", label_contact_value: "care@windrow.example", lot_authorized_units: 2000 }
              as: ResponsiblePersonAgent
              as_user_id: "${rp_id}"
              captures: { lst_id: $.data.id }
            - call: "POST /cosmetics/listings/${lst_id}/distribution-records"
              payload: { lot_code: "LOT-W1", consignee_name: "Prairie Wholesale", consignee_class: "WHOLESALE", ship_date: "2026-08-04T00:00:00Z", delivery_date: "2026-08-08T00:00:00Z", units_shipped: 600 }
              as: ResponsiblePersonAgent
              as_user_id: "${rp_id}"
              captures: { dr1_id: $.data.id }
            - call: "POST /cosmetics/listings/${lst_id}/distribution-records"
              payload: { lot_code: "LOT-W2", consignee_name: "Cornbelt Retail", consignee_class: "RETAIL", ship_date: "2026-08-04T00:00:00Z", delivery_date: "2026-08-08T00:00:00Z", units_shipped: 500 }
              as: ResponsiblePersonAgent
              as_user_id: "${rp_id}"
              captures: { dr2_id: $.data.id }
            - call: "POST /cosmetics/listings/${lst_id}/distribution-records"
              payload: { lot_code: "LOT-W3", consignee_name: "River City Pharmacy", consignee_class: "CONSUMER", ship_date: "2026-08-04T00:00:00Z", delivery_date: "2026-08-08T00:00:00Z", units_shipped: 400 }
              as: ResponsiblePersonAgent
              as_user_id: "${rp_id}"
              captures: { dr3_id: $.data.id }
            - call: "POST /cosmetics/listings/${lst_id}/recall-actions"
              payload: { initiation_basis: "VOLUNTARY_NOTICE", hazard_class: "CLASS_II" }
              as: EnforcementOfficer
              as_user_id: "OFF-1"
              captures: { rec_id: $.data.id }
            - call: "POST /cosmetics/recall-actions/${rec_id}/plan"
              payload: { corrective_summary: "Retail retrieval of three lots", distribution_depth: "RETAIL" }
              as: ResponsiblePersonAgent
              as_user_id: "${rp_id}"
            - call: "POST /cosmetics/recall-actions/${rec_id}/plan-decision"
              payload: { decision: "ACCEPT" }
              as: EnforcementOfficer
              as_user_id: "OFF-1"
              captures: { rec_v: $.data.version }
            - call: "POST /cosmetics/recall-actions/${rec_id}/withdrawals"
              payload: { scope_depth: "RETAIL", expected_recall_action_version: "${rec_v}" }
              as: EnforcementOfficer
              as_user_id: "OFF-2"
              captures: { wd_id: $.data.id }
            - call: "POST /cosmetics/withdrawals/${wd_id}/records-production"
              payload: { distribution_record_ids: ["${dr1_id}", "${dr2_id}", "${dr3_id}"] }
              as: ResponsiblePersonAgent
              as_user_id: "${rp_id}"
            - call: "POST /cosmetics/withdrawals/${wd_id}/recovery-entries"
              payload: { entry_kind: "VERIFIED_RETURN", distribution_record_id: "${dr1_id}", units: 400 }
              as: ResponsiblePersonAgent
              as_user_id: "${rp_id}"
            - call: "POST /cosmetics/withdrawals/${wd_id}/recovery-entries"
              payload: { entry_kind: "VERIFIED_RETURN", distribution_record_id: "${dr2_id}", units: 200 }
              as: ResponsiblePersonAgent
              as_user_id: "${rp_id}"
            - call: "POST /cosmetics/withdrawals/${wd_id}/recovery-entries"
              payload: { entry_kind: "VERIFIED_DESTRUCTION", distribution_record_id: "${dr3_id}", units: 100 }
              as: ResponsiblePersonAgent
              as_user_id: "${rp_id}"
          trigger:
            - call: "POST /cosmetics/withdrawals/${wd_id}/recovery-entries"
              payload: { entry_kind: "CORRECTION_REVERSAL", distribution_record_id: "${dr1_id}", units: 100, reversal_target_bucket: "units_verified_returned" }
              as: ResponsiblePersonAgent
              as_user_id: "${rp_id}"
              captures: { dr1_outstanding: $.data.units_outstanding, dr1_verified_returned: $.data.units_verified_returned }
            - call: "POST /cosmetics/withdrawals/${wd_id}/recovery-entries"
              payload: { entry_kind: "CORRECTION_REVERSAL", distribution_record_id: "${dr1_id}", units: 400, reversal_target_bucket: "units_verified_returned" }
              as: ResponsiblePersonAgent
              as_user_id: "${rp_id}"
          assert:
            - "before the trigger: DistributionRecord.${dr1_id}.units_verified_returned == 400 and units_outstanding == 200; MarketWithdrawal.${wd_id}.verified_recovered_units == 700 and outstanding_units_total == 800"
            - "after trigger[0]: ${dr1_verified_returned} == 300 and ${dr1_outstanding} == 300 — INVARIANT 1 holds: 300 + 0 + 300 == units_shipped 600"
            - "after trigger[0]: MarketWithdrawal.${wd_id}.verified_recovered_units == 600, outstanding_units_total == 900, and shipped_units_total is STILL 1500 (INVARIANT 2: 600 + 900 == 1500)"
            - "after trigger[0]: ProductListing.${lst_id}.distributed_units_total is STILL 1500 — recovery activity never changes what was shipped"
            - "after trigger[0]: the facility ledger holds UNIT_MOVEMENT entries with signed_units_delta +400, +200, +100 and -100 in append order, summing to 600 == verified_recovered_units (INVARIANT 3)"
            - "trigger[1] returns ERR_REVERSAL_EXCEEDS_RECORDED with http 422: 400 exceeds the 300 remaining in units_verified_returned, so no bucket is driven below zero"
            - "after trigger[1]: every field of DistributionRecord.${dr1_id} is unchanged from after trigger[0] and no new ledger entry was appended"

      - name: late_renewal_restores_the_designation_slot_count_it_released
        grounds:
          - state_machines.Facility.LAPSED_to_REGISTERED
          - state_machines.ProductListing.SUSPENDED_to_LISTED
          - calculations.registration_period_bounds
          - entities.ResponsiblePerson.fields.active_designation_count
          - entities.RegistrationPeriod.fields.period_kind
        distinguishing_aspect: |
          A DIFFERENT conserved quantity: the DESIGNATION SLOT count (and, alongside it, the gap-free
          biennial period timeline). The lapse cascade releases the slot and the listing; the late
          renewal inside the grace window is the compensating transition that restores exactly what
          was released — one listing back to LISTED, active_designation_count back to 1, ACTIVE again,
          listed_product_count back to 1 — while the successor period still starts the day after the
          prior period ended, so the biennial cadence never drifts despite the lapse. The safety
          dimension is deliberately NOT restored: the revalidation cascade is one-way.
        test_recipe:
          setup:
            - "one REGISTERED facility approved at clock 2026-08-01T00:00:00Z (period 2026-08-01 .. 2028-07-31, renewal window opens 2028-05-02, grace ends 2028-09-29)"
            - "one ResponsiblePerson (cap 25) holding one LISTED + SUBSTANTIATED listing, so active_designation_count is 1 and status is ACTIVE"
            - "logical clock advanced to 2028-08-01T00:00:00Z and one compliance sweep run, which lapses the facility and releases the slot"
          setup_api_calls:
            - call: "POST /cosmetics/facilities"
              payload: { facility_name: "Havenbrook Cosmetics", owner_operator_name: "Havenbrook Ltd", facility_type: "BOTH", country_code: "US", state_or_province: "MD" }
