    instances:
      - name: placement_encumbrance_correct_for_residential_day_and_night_mix
        claim_type: Correct Result
        grounds:
          - "calculations.placement_encumbrance"
          - "state_machines.Placement[PROPOSED->CONTRACTED]"
          - "entities.TuitionRateSchedule.fields.residential_rate_cents"
        distinguishing_aspect: |
          placement_encumbrance sums a tuition component and a residential component, and the
          residential component exists only for placement_type RESIDENTIAL. With 180 contracted
          instructional days at the 32000 day rate and 300 contracted residential nights at the
          51500 residential rate, contract_encumbrance_cents must be
          180*32000 + 300*51500 = 5760000 + 15450000 = 21210000. Service addenda and transport
          are explicitly NOT part of this figure, so the other three components stay at 0.
