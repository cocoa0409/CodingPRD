              as: ComplianceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "err == 'ERR_DUPLICATE_REPORT'"

      - name: insufficient_fruit_on_blend_line
        claim_type: violation_to_error
        grounds:
          - "validations[priority=15]"
          - "errors[ERR_INSUFFICIENT_FRUIT]"
        distinguishing_aspect: |
          Adding a BlendLine whose weight exceeds lot.unpressed_weight_lbs
          returns ERR_INSUFFICIENT_FRUIT.
        test_recipe:
          setup: ["lot weight=1000 already partially consumed (800 used, 200 unpressed)"]
          setup_api_calls:
            - call: "POST /cidery/varieties"
              payload: { code: "VIF", tannin_g_per_l: 1.0, brix_at_harvest: 13.0, acidity_g_per_l: 6.0, is_bittersweet: false }
              as: OrchardManager
              captures: { vif: $.data.id }
            - call: "POST /cidery/contracts"
              payload: { grower_name: "IF", region_code: "NY", season_year: 2026, committed_weight_lbs: 1000, price_per_lb_cents: 80 }
              as: OrchardManager
              captures: { cif: $.data.id, cif_v: $.data.version }
            - call: "POST /cidery/contracts/${cif}/activate"
              payload: { expected_contract_version: "${cif_v}" }
              as: OrchardManager
            - call: "POST /cidery/contracts/${cif}/harvest-lots"
              payload: { variety_id: "${vif}", received_at: "2026-09-15T10:00:00Z", weight_lbs: 1000, measured_brix: 13.0, measured_tannin_g_per_l: 1.0 }
              as: OrchardManager
              captures: { hif: $.data.id }
            # Consume 800 of the lot via a started press batch
            - call: "POST /cidery/press-batches"
              payload:
                scheduled_press_date: "2026-09-16T08:00:00Z"
                press_window_minutes: 60
