      - name: attest_enforces_data_as_of_before_audit_opinion
        claim_type: precondition_enforcement
        grounds:
          - validations.priority_24
          - state_machines[CycleContentItem].DRAFT->READY
          - errors[ERR_CONTENT_DATA_AS_OF_REQUIRED]
          - errors[ERR_AUDIT_OPINION_REQUIRED]
        distinguishing_aspect: >-
          Priority 24 declares an INTERNAL order: sub-check (a) data_as_of_date/source_document_ref
          runs before sub-check (b) audit_opinion_type. An item on an AUDITED_FINANCIALS
          requirement that is missing BOTH must return ERR_CONTENT_DATA_AS_OF_REQUIRED, not
          ERR_AUDIT_OPINION_REQUIRED — so the two errors cannot be produced by a single
          unordered "readiness" check.
        test_recipe:
          setup:
            - "One OUTSTANDING BondIssue, one ACTIVE Undertaking, one AUDITED_FINANCIALS ContentRequirement at 10000 bp (requires_audit_opinion is therefore computed true), and one FY2026 cycle whose single item is moved to DRAFT with only source_document_ref supplied."
          setup_api_calls:
            - call: "POST /disclosure/bond-issues"
              payload: { issuer_program_code: "CIVICCENTER", series_designation: "2026A", security_type: "REVENUE", dated_date: "2026-04-01", final_maturity_date: "2056-04-01", original_par_amount_cents: 100000000 }
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { issue_id: "$.data.id" }
            - call: "POST /disclosure/undertakings"
              payload: { issue_id: "${issue_id}", fiscal_year_end_month_day: "06-30" }
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { und_id: "$.data.id" }
            - call: "POST /disclosure/content-requirements"
              payload: { undertaking_id: "${und_id}", kind: "AUDITED_FINANCIALS", label: "Audited Financial Statements", weight_bp: 10000 }
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { req_id: "$.data.id", req_opinion: "$.data.requires_audit_opinion" }
            - call: "POST /disclosure/annual-report-cycles"
              payload: { undertaking_id: "${und_id}", fiscal_year_label: "FY2026", period_start_date: "2025-07-01", period_end_date: "2026-06-30" }
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { cycle_id: "$.data.id" }
            - call: "GET /disclosure/cycle-content-items?cycle_id=${cycle_id}&content_requirement_id=${req_id}"
              payload: {}
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { item_id: "$.data[0].id" }
            - call: "PATCH /disclosure/cycle-content-items/${item_id}"
              payload: { source_document_ref: "CAFR-FY2026.pdf" }
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { s_draft: "$.data.status" }
          trigger:
            - call: "POST /disclosure/cycle-content-items/${item_id}/attest"
              payload: {}
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { e_first: "$.data.error_id" }
            - call: "PATCH /disclosure/cycle-content-items/${item_id}"
              payload: { data_as_of_date: "2026-06-30" }
              as: DisclosureOfficer
              as_user_id: "off-prep"
            - call: "POST /disclosure/cycle-content-items/${item_id}/attest"
              payload: {}
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { e_second: "$.data.error_id" }
            - call: "PATCH /disclosure/cycle-content-items/${item_id}"
              payload: { audit_opinion_type: "QUALIFIED" }
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { s_still_draft: "$.data.status" }
            - call: "POST /disclosure/cycle-content-items/${item_id}/attest"
              payload: {}
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { s_ready: "$.data.status", f_ready: "$.data.readiness_factor" }
            - call: "GET /disclosure/annual-report-cycles/${cycle_id}"
              payload: {}
              as: DisclosureOfficer
              as_user_id: "off-prep"
              captures: { score: "$.data.completeness_score_pct" }
          assert:
            - "${req_opinion} == true and ${s_draft} == DRAFT"
            - "${e_first} == ERR_CONTENT_DATA_AS_OF_REQUIRED with HTTP 409 — sub-check (a) fires first even though the audit opinion is ALSO missing"
            - "${e_second} == ERR_AUDIT_OPINION_REQUIRED with HTTP 409 — only once (a) is satisfied does (b) become visible"
            - "${s_still_draft} == DRAFT — a second PATCH is a DRAFT->DRAFT self-loop, not a promotion"
            - "${s_ready} == READY and ${f_ready} == 1.0"
            - "${score} == 80.00 — readiness 1.0 times the QUALIFIED opinion multiplier 0.8 on the full 10000 bp; a READY item is NOT automatically worth 100"

      - name: defease_requires_escrow_at_least_equal_to_outstanding_par
        claim_type: precondition_enforcement
        grounds:
          - state_machines[BondIssue].OUTSTANDING->DEFEASED
          - errors[ERR_ESCROW_INSUFFICIENT]
          - validations.priority_34
        distinguishing_aspect: >-
          The escrow floor is defeasance_type dependent: LEGAL demands escrow >=
          outstanding_par_amount_cents while ECONOMIC demands only >= 1. One cent short of par
          under LEGAL is refused, yet that same amount is accepted under ECONOMIC — a single
          shared threshold cannot satisfy both probes.
        test_recipe:
          setup:
            - "Two OUTSTANDING BondIssues, each with outstanding_par_amount_cents 100000000."
          setup_api_calls:
            - call: "POST /disclosure/bond-issues"
              payload: { issuer_program_code: "CIVICCENTER", series_designation: "2026A", security_type: "REVENUE", dated_date: "2026-04-01", final_maturity_date: "2056-04-01", original_par_amount_cents: 100000000 }
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { issueA_id: "$.data.id" }
            - call: "POST /disclosure/bond-issues"
              payload: { issuer_program_code: "CIVICCENTER", series_designation: "2026B", security_type: "REVENUE", dated_date: "2026-04-01", final_maturity_date: "2056-04-01", original_par_amount_cents: 100000000 }
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { issueB_id: "$.data.id" }
          trigger:
            - call: "POST /disclosure/bond-issues/${issueA_id}/defease"
              payload: { defeasance_type: "LEGAL", escrow_deposit_cents: 99999999, occurrence_date: "2026-08-01" }
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { e_legal: "$.data.error_id" }
            - call: "POST /disclosure/bond-issues/${issueB_id}/defease"
              payload: { defeasance_type: "ECONOMIC", escrow_deposit_cents: 0, occurrence_date: "2026-08-01" }
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { e_econ: "$.data.error_id" }
            - call: "POST /disclosure/bond-issues/${issueB_id}/defease"
              payload: { defeasance_type: "ECONOMIC", escrow_deposit_cents: 99999999, occurrence_date: "2026-08-01" }
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { b_status: "$.data.status", b_par: "$.data.outstanding_par_amount_cents", b_escrow: "$.data.escrow_deposit_cents", b_type: "$.data.defeasance_type", b_at: "$.data.defeased_at", b_open: "$.data.open_material_event_count" }
            - call: "POST /disclosure/bond-issues/${issueA_id}/defease"
              payload: { defeasance_type: "LEGAL", escrow_deposit_cents: 100000000, occurrence_date: "2026-08-01" }
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { a_status: "$.data.status", a_par: "$.data.outstanding_par_amount_cents" }
            - call: "GET /disclosure/material-event-notices?issue_id=${issueA_id}"
              payload: {}
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { a_notice_total: "$.total_count", a_notice_type: "$.data[0].event_type", a_notice_status: "$.data[0].status", a_notice_perse: "$.data[0].per_se_material", a_notice_deadline: "$.data[0].filing_deadline_date" }
          assert:
            - "${e_legal} == ERR_ESCROW_INSUFFICIENT with HTTP 409 — one cent short under LEGAL"
            - "${e_econ} == ERR_ESCROW_INSUFFICIENT with HTTP 409 — zero fails the >= 1 ECONOMIC floor"
            - "${b_status} == DEFEASED with the SAME 99999999 that LEGAL refused, ${b_type} == ECONOMIC, ${b_escrow} == 99999999, ${b_par} == 0, ${b_at} == \"2026-08-01T00:00:00.000Z\", ${b_open} == 1"
            - "${a_status} == DEFEASED and ${a_par} == 0 once escrow exactly equals par — the comparison is >=, not >"
            - "${a_notice_total} == 1 with ${a_notice_type} == DEFEASANCE, ${a_notice_status} == DETERMINATION_PENDING, ${a_notice_perse} == true, ${a_notice_deadline} == \"2026-08-14\" — defeasance mints its own per-se notice"

      - name: waive_requires_a_waivable_requirement_and_a_stated_reason
        claim_type: precondition_enforcement
        grounds:
          - state_machines[CycleContentItem].NOT_STARTED->WAIVED
          - errors[ERR_REQUIREMENT_NOT_WAIVABLE]
          - errors[ERR_WAIVER_REASON_REQUIRED]
          - validations.priority_27
          - validations.priority_40
        distinguishing_aspect: >-
          waivable lives on the immutable ContentRequirement, not on the item, so the gate is a
          cross-entity read of the item's snapshot parent; and priority 27 (not waivable) outranks
          priority 40 (reason missing), so a request that is BOTH aimed at a non-waivable
          requirement AND missing its reason returns ERR_REQUIREMENT_NOT_WAIVABLE.
        test_recipe:
          setup:
            - "One OUTSTANDING BondIssue, one ACTIVE Undertaking, two ContentRequirements: DEBT_SERVICE_SCHEDULE 5000 with waivable false (the default) and ENTERPRISE_STATISTICS 5000 with waivable true. One FY2026 cycle, so both items exist in NOT_STARTED."
