      - name: escrow_exact_full_funding_boundary
        grounds:
          - state_machines.SalesOrder.PENDING_ESCROW_to_ESCROW_FUNDED
          - entities.SalesOrder.fields.escrow_funded_cents
        distinguishing_aspect: |
          Metric escrow_funded_cents on endpoint POST /sales-orders/{id}/escrow/deposit:
          cumulative 49999 of required 50000 leaves the order PENDING_ESCROW, and one
          more cent reaching exactly == required flips it to ESCROW_FUNDED (== admits,
          no overshoot allowed) — a zero-remainder boundary, not a threshold ratio.
        test_recipe:
          setup:
