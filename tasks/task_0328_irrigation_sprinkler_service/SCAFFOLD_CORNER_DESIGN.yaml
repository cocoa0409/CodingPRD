              payload: { property_id: "${prop_id}", quote_type: "INSTALL", line_items: [ { description: "heads", quantity: 1, unit_rate_cents: 5000 } ] }
              as: Dispatcher
              captures: { quote_id: $.data.id }
            - call: "POST /service-quotes/${quote_id}/send"
              payload: {}
              as: Dispatcher
          trigger:
            - call: "POST /service-quotes/${quote_id}/approve"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { wo_id: $.data.linked_work_order_id, st: $.data.quote_state }
          assert:
            - "ServiceQuote.${quote_id}.quote_state == APPROVED"
            - "ServiceQuote.${quote_id}.linked_work_order_id is non-null"
            - "GET /work-orders/${wo_id} returns origin_quote_id == ${quote_id}"
