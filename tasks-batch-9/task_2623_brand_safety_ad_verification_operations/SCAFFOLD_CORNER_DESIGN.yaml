          One DisputeOfficer call must move four different entities: the
          disputed PageClassification to VACATED, the Page to RECLASSIFIED
          pointing at a system-minted APPEAL_REMEDY record, the CLAIMED
          MeasurementBatch to a non-breaching assessment, and the SUBMITTED
