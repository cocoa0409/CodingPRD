            - { call: "POST /pd/meetings/${m2}/attendance", payload: { records: [ { registration_id: "${r1}", mark: "PRESENT" }, { registration_id: "${r2}", mark: "PRESENT" } ] }, as: Instructor, as_user_id: "${ins1}" }
            - { call: "POST /pd/meetings/${m3}/attendance", payload: { records: [ { registration_id: "${r1}", mark: "PRESENT" }, { registration_id: "${r2}", mark: "PRESENT" } ] }, as: Instructor, as_user_id: "${ins1}" }
            - { call: "POST /pd/meetings/${m4}/attendance", payload: { records: [ { registration_id: "${r1}", mark: "PRESENT" }, { registration_id: "${r2}", mark: "ABSENT" } ] }, as: Instructor, as_user_id: "${ins1}" }
            - { call: "POST /pd/meetings/${m5}/attendance", payload: { records: [ { registration_id: "${r1}", mark: "ABSENT" }, { registration_id: "${r2}", mark: "ABSENT" } ] }, as: Instructor, as_user_id: "${ins1}" }
          trigger:
            - { call: "POST /pd/registrations/${r1}/verify-attendance", payload: {}, as: Instructor, as_user_id: "${ins1}", captures: { a1: "$.data.attendance_status" } }
            - { call: "POST /pd/registrations/${r2}/verify-attendance", payload: {}, as: Instructor, as_user_id: "${ins1}", captures: { a2: "$.data.attendance_status" } }
          assert:
            - "R1 attendance_status == VERIFIED (4 attended of 5: 4*5 == 20 >= 5*4 == 20 — boundary is inclusive)"
            - "R2 attendance_status == ABSENT (3 of 5: 15 >= 20 is false)"
            - "Integer cross-multiplication, no float rounding: exactly 80% passes"

      - name: boundary_seat_last_seat_vs_waitlist
        grounds:
          - calculations.seat_and_waitlist_allocation
          - entities.Section.fields.seats_open
          - entities.Registration.fields.waitlist_seq
        distinguishing_aspect: |
          Metric: seat count. With capacity 2, the registration taken when
          seats_open == 1 succeeds as REGISTERED (>= 1 is the boundary) while the
          next registration at seats_open == 0 becomes WAITLISTED with
          waitlist_seq == 1 — count boundary on POST /pd/registrations, a
          different metric and endpoint than the attendance ratio sibling.
        test_recipe:
          setup:
            - "Building B1; teachers T1, T2, T3; instructor INS1; course fee 0"
            - "Section S capacity 2 PUBLISHED with meeting M (std dates)"
          setup_api_calls:
            - { call: "POST /pd/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PDCoordinator }
            - { call: "POST /pd/buildings", payload: { name: "B Seven", building_code: "B7" }, as: PDCoordinator, captures: { b1: "$.data.id" } }
            - { call: "POST /pd/employees", payload: { full_name: "T H", email: "th@x.com", employee_kind: "TEACHER", primary_building_id: "${b1}", base_lane: "BA" }, as: PDCoordinator, captures: { t1: "$.data.id" } }
            - { call: "POST /pd/employees", payload: { full_name: "T I", email: "ti@x.com", employee_kind: "TEACHER", primary_building_id: "${b1}", base_lane: "BA" }, as: PDCoordinator, captures: { t2: "$.data.id" } }
            - { call: "POST /pd/employees", payload: { full_name: "T J", email: "tj@x.com", employee_kind: "TEACHER", primary_building_id: "${b1}", base_lane: "BA" }, as: PDCoordinator, captures: { t3: "$.data.id" } }
            - { call: "POST /pd/employees", payload: { full_name: "I G", email: "ig@x.com", employee_kind: "SPECIALIST", primary_building_id: "${b1}", base_lane: "MA" }, as: PDCoordinator, captures: { ins1: "$.data.id" } }
            - { call: "POST /pd/courses", payload: { course_code: "SEAT-1", title: "Seat Course", delivery_mode: "IN_PERSON", clock_hours: 5, fee_cents: 0 }, as: PDCoordinator, captures: { c1: "$.data.id" } }
            - { call: "POST /pd/sections", payload: { course_id: "${c1}", term: "2026-FALL", instructor_id: "${ins1}", building_id: "${b1}", room: "R1", seat_capacity: 2, starts_at: "2026-08-15T09:00:00Z", ends_at: "2026-08-20T17:00:00Z", registration_opens_at: "2026-08-01T00:00:00Z", registration_closes_at: "2026-08-10T00:00:00Z" }, as: PDCoordinator, captures: { s1: "$.data.id" } }
            - { call: "POST /pd/sections/${s1}/meetings", payload: { starts_at: "2026-08-15T10:00:00Z", ends_at: "2026-08-15T12:00:00Z", room: "R1" }, as: PDCoordinator }
            - { call: "POST /pd/sections/${s1}/publish", payload: {}, as: PDCoordinator }
          trigger:
            - { call: "POST /pd/registrations", payload: { teacher_id: "${t1}", section_id: "${s1}" }, as: Teacher, as_user_id: "${t1}", captures: { st1: "$.data.status" } }
            - { call: "POST /pd/registrations", payload: { teacher_id: "${t2}", section_id: "${s1}" }, as: Teacher, as_user_id: "${t2}", captures: { st2: "$.data.status" } }
            - { call: "POST /pd/registrations", payload: { teacher_id: "${t3}", section_id: "${s1}" }, as: Teacher, as_user_id: "${t3}", captures: { st3: "$.data.status", seq3: "$.data.waitlist_seq" } }
            - { call: "GET /pd/sections/${s1}", payload: {}, as: PDCoordinator, captures: { reg_n: "$.data.seats_registered", open_n: "$.data.seats_open" } }
          assert:
            - "T1 registration status == REGISTERED (seats_open was 2)"
            - "T2 registration status == REGISTERED (seats_open was exactly 1 — last-seat boundary succeeds)"
            - "T3 registration status == WAITLISTED (seats_open == 0 — never an error, waitlist instead)"
            - "T3 waitlist_seq == 1"
            - "section.seats_registered == 2 and seats_open == 0"
  # ---------------------------------------------------------------------------
  # Rule 7 — cross_entity_state_dependency (different entity pairs)
  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: cross_entity_registration_requires_approved_plan
        grounds:
          - state_machines.GrowthPlan
          - "validations[priority=8]"
          - "errors[ERR_PLAN_NOT_APPROVED]"
        distinguishing_aspect: |
          Pair Registration -> GrowthPlan: a registration carrying
          growth_plan_id is valid only while the referenced plan is APPROVED or
          FULFILLED; the same request against a DRAFT plan fails with
          ERR_PLAN_NOT_APPROVED. Distinct entity pair from the sibling
          (ComplianceAssignment -> Registration).
        test_recipe:
          setup:
            - "Building B1; teacher T1 (version captured); instructor INS1; course fee 0"
            - "GrowthPlan P1 for T1 school_year 2026-2027, status DRAFT (created, never submitted)"
            - "Section S PUBLISHED with meeting (std dates), seat available"
          setup_api_calls:
            - { call: "POST /pd/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PDCoordinator }
            - { call: "POST /pd/buildings", payload: { name: "B Eight", building_code: "B8" }, as: PDCoordinator, captures: { b1: "$.data.id" } }
            - { call: "POST /pd/employees", payload: { full_name: "T K", email: "tk@x.com", employee_kind: "TEACHER", primary_building_id: "${b1}", base_lane: "BA" }, as: PDCoordinator, captures: { t1: "$.data.id", t_ver: "$.data.version" } }
            - { call: "POST /pd/employees", payload: { full_name: "I H", email: "ih@x.com", employee_kind: "SPECIALIST", primary_building_id: "${b1}", base_lane: "MA" }, as: PDCoordinator, captures: { ins1: "$.data.id" } }
            - { call: "POST /pd/growth-plans", payload: { teacher_id: "${t1}", school_year: "2026-2027", focus_areas: ["math"], target_credits: 2.0, expected_employee_version: "${t_ver}" }, as: Teacher, as_user_id: "${t1}", captures: { p1: "$.data.id", p1_st: "$.data.status" } }
            - { call: "POST /pd/courses", payload: { course_code: "XENT-1", title: "Aligned Course", delivery_mode: "VIRTUAL", clock_hours: 15, fee_cents: 0 }, as: PDCoordinator, captures: { c1: "$.data.id" } }
            - { call: "POST /pd/sections", payload: { course_id: "${c1}", term: "2026-FALL", instructor_id: "${ins1}", building_id: "${b1}", room: "R1", seat_capacity: 5, starts_at: "2026-08-15T09:00:00Z", ends_at: "2026-08-20T17:00:00Z", registration_opens_at: "2026-08-01T00:00:00Z", registration_closes_at: "2026-08-10T00:00:00Z" }, as: PDCoordinator, captures: { s1: "$.data.id" } }
            - { call: "POST /pd/sections/${s1}/meetings", payload: { starts_at: "2026-08-15T10:00:00Z", ends_at: "2026-08-15T12:00:00Z", room: "R1" }, as: PDCoordinator }
            - { call: "POST /pd/sections/${s1}/publish", payload: {}, as: PDCoordinator }
          trigger:
            - { call: "POST /pd/registrations", payload: { teacher_id: "${t1}", section_id: "${s1}", growth_plan_id: "${p1}", aligned_focus_area: "math" }, as: Teacher, as_user_id: "${t1}", captures: { err: "$.data.error_id" } }
          assert:
            - "Plan P1 was created in DRAFT (captured ${p1_st} == DRAFT)"
            - "error_id == ERR_PLAN_NOT_APPROVED — Registration creation depends on GrowthPlan's state, not just its existence"

      - name: cross_entity_assignment_satisfied_by_completion
        grounds:
          - state_machines.ComplianceAssignment.ASSIGNED_to_IN_PROGRESS
          - state_machines.ComplianceAssignment.SATISFIED
          - state_machines.Registration.REGISTERED_to_COMPLETED
        distinguishing_aspect: |
          Pair ComplianceAssignment -> Registration: the assignment's transitions
          are DRIVEN by the registration's state — REGISTERED flips it to
          IN_PROGRESS, COMPLETED flips it to SATISFIED and spawns the recurrence
          successor (due = completed_at + 12 months). Different pair than the
          sibling (Registration -> GrowthPlan).
        test_recipe:
          setup:
            - "Building B1; teacher T1; instructor INS1"
            - "Compliance course C1 (compliance_tag CPR, recurrence_months 12, 3 h, fee 0)"
            - "Assignment A1 (T1, C1) due 2027-06-01T00:00:00Z, ASSIGNED"
            - "Section S of C1 PUBLISHED with meeting; T1 REGISTERED (A1 -> IN_PROGRESS)"
            - "Attendance VERIFIED, survey WAIVED; clock 2026-08-16T00:00:00Z; ops-run -> S IN_SESSION"
          setup_api_calls:
            - { call: "POST /pd/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PDCoordinator }
            - { call: "POST /pd/buildings", payload: { name: "B Nine", building_code: "B9" }, as: PDCoordinator, captures: { b1: "$.data.id" } }
            - { call: "POST /pd/employees", payload: { full_name: "T L", email: "tl@x.com", employee_kind: "TEACHER", primary_building_id: "${b1}", base_lane: "BA" }, as: PDCoordinator, captures: { t1: "$.data.id" } }
            - { call: "POST /pd/employees", payload: { full_name: "I I", email: "ii@x.com", employee_kind: "SPECIALIST", primary_building_id: "${b1}", base_lane: "MA" }, as: PDCoordinator, captures: { ins1: "$.data.id" } }
            - { call: "POST /pd/courses", payload: { course_code: "CPR-1", title: "CPR Training", delivery_mode: "IN_PERSON", clock_hours: 3, fee_cents: 0, compliance_tag: "CPR", recurrence_months: 12 }, as: PDCoordinator, captures: { c1: "$.data.id" } }
            - { call: "POST /pd/compliance-assignments", payload: { employee_id: "${t1}", course_id: "${c1}", due_date: "2027-06-01T00:00:00Z" }, as: PDCoordinator, captures: { a1: "$.data.id" } }
            - { call: "POST /pd/sections", payload: { course_id: "${c1}", term: "2026-FALL", instructor_id: "${ins1}", building_id: "${b1}", room: "R1", seat_capacity: 5, starts_at: "2026-08-15T09:00:00Z", ends_at: "2026-08-20T17:00:00Z", registration_opens_at: "2026-08-01T00:00:00Z", registration_closes_at: "2026-08-10T00:00:00Z" }, as: PDCoordinator, captures: { s1: "$.data.id" } }
            - { call: "POST /pd/sections/${s1}/meetings", payload: { starts_at: "2026-08-15T10:00:00Z", ends_at: "2026-08-15T12:00:00Z", room: "R1" }, as: PDCoordinator, captures: { m1: "$.data.id" } }
            - { call: "POST /pd/sections/${s1}/publish", payload: {}, as: PDCoordinator }
            - { call: "POST /pd/registrations", payload: { teacher_id: "${t1}", section_id: "${s1}" }, as: Teacher, as_user_id: "${t1}", captures: { r1: "$.data.id" } }
            - { call: "GET /pd/compliance-assignments/${a1}", payload: {}, as: PDCoordinator, captures: { st_inprog: "$.data.status" } }
            - { call: "POST /pd/meetings/${m1}/attendance", payload: { records: [ { registration_id: "${r1}", mark: "PRESENT" } ] }, as: Instructor, as_user_id: "${ins1}" }
            - { call: "POST /pd/registrations/${r1}/verify-attendance", payload: {}, as: Instructor, as_user_id: "${ins1}" }
            - { call: "POST /pd/registrations/${r1}/waive-survey", payload: { reason: "w" }, as: PDCoordinator }
            - { call: "POST /pd/_clock/set_current_utc", payload: { to_iso8601: "2026-08-16T00:00:00Z" }, as: PDCoordinator }
            - { call: "POST /pd/ops-runs", payload: {}, as: PDCoordinator }
          trigger:
            - { call: "POST /pd/registrations/${r1}/complete", payload: {}, as: PDCoordinator, captures: { st_done: "$.data.status", comp_at: "$.data.completed_at" } }
            - { call: "GET /pd/compliance-assignments/${a1}", payload: {}, as: PDCoordinator, captures: { st_sat: "$.data.status", sat_at: "$.data.satisfied_at" } }
            - { call: "GET /pd/compliance-assignments", payload: { employee_id: "${t1}", status: "ASSIGNED" }, as: PDCoordinator, captures: { succ_due: "$.data[0].due_date", succ_course: "$.data[0].course_id" } }
            - { call: "GET /pd/employees/${t1}", payload: {}, as: PDCoordinator, captures: { bal: "$.data.lane_credit_balance" } }
          assert:
            - "After registration: A1.status == IN_PROGRESS (cross-entity flip on REGISTERED)"
            - "After completion: R1.status == COMPLETED with completed_at == 2026-08-16T00:00:00Z"
            - "A1.status == SATISFIED with satisfied_at == 2026-08-16T00:00:00Z"
            - "Recurrence successor exists: status ASSIGNED, course_id == ${c1}, due_date == 2027-08-16T00:00:00Z (completed_at + 12 months)"
            - "Employee lane_credit_balance == 0.0 (compliance-tagged course awards counts_toward_lane == false)"

  # ---------------------------------------------------------------------------
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: overlap_teacher_schedule_half_open
        grounds:
          - "validations[priority=10]"
          - "errors[ERR_SCHEDULE_CONFLICT]"
        distinguishing_aspect: |
          Semantics: half-open [starts_at, ends_at) on the teacher's schedule —
          back-to-back sections (one ends exactly when the other starts) do NOT
          conflict, but any strict interior overlap does. Resource: the teacher's
          registered-section timeline, checked on POST /pd/registrations.
        test_recipe:
          setup:
            - "Building B1; teacher T1; instructor INS1; courses CA/CB/CC (fee 0)"
            - "S1 session 2026-09-10 09:00-12:00 (window open 08-01..09-01), S2 2026-09-10 12:00-15:00 (adjacent), S3 2026-09-10 11:00-13:00 (overlaps both); all PUBLISHED with one meeting each"
            - "T1 REGISTERED in S1 and S2 (adjacency accepted); trigger registers S3"
          setup_api_calls:
            - { call: "POST /pd/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PDCoordinator }
            - { call: "POST /pd/buildings", payload: { name: "B Ten", building_code: "B10" }, as: PDCoordinator, captures: { b1: "$.data.id" } }
            - { call: "POST /pd/employees", payload: { full_name: "T M", email: "tm@x.com", employee_kind: "TEACHER", primary_building_id: "${b1}", base_lane: "BA" }, as: PDCoordinator, captures: { t1: "$.data.id" } }
            - { call: "POST /pd/employees", payload: { full_name: "I J", email: "ij@x.com", employee_kind: "SPECIALIST", primary_building_id: "${b1}", base_lane: "MA" }, as: PDCoordinator, captures: { ins1: "$.data.id" } }
            - { call: "POST /pd/courses", payload: { course_code: "OVL-A", title: "A", delivery_mode: "IN_PERSON", clock_hours: 3, fee_cents: 0 }, as: PDCoordinator, captures: { ca: "$.data.id" } }
            - { call: "POST /pd/courses", payload: { course_code: "OVL-B", title: "B", delivery_mode: "IN_PERSON", clock_hours: 3, fee_cents: 0 }, as: PDCoordinator, captures: { cb: "$.data.id" } }
            - { call: "POST /pd/courses", payload: { course_code: "OVL-C", title: "C", delivery_mode: "IN_PERSON", clock_hours: 2, fee_cents: 0 }, as: PDCoordinator, captures: { cc: "$.data.id" } }
            - { call: "POST /pd/sections", payload: { course_id: "${ca}", term: "2026-FALL", instructor_id: "${ins1}", building_id: "${b1}", room: "R1", seat_capacity: 5, starts_at: "2026-09-10T09:00:00Z", ends_at: "2026-09-10T12:00:00Z", registration_opens_at: "2026-08-01T00:00:00Z", registration_closes_at: "2026-09-01T00:00:00Z" }, as: PDCoordinator, captures: { s1: "$.data.id" } }
            - { call: "POST /pd/sections/${s1}/meetings", payload: { starts_at: "2026-09-10T09:30:00Z", ends_at: "2026-09-10T10:30:00Z", room: "R1" }, as: PDCoordinator }
            - { call: "POST /pd/sections/${s1}/publish", payload: {}, as: PDCoordinator }
            - { call: "POST /pd/sections", payload: { course_id: "${cb}", term: "2026-FALL", instructor_id: "${ins1}", building_id: "${b1}", room: "R2", seat_capacity: 5, starts_at: "2026-09-10T12:00:00Z", ends_at: "2026-09-10T15:00:00Z", registration_opens_at: "2026-08-01T00:00:00Z", registration_closes_at: "2026-09-01T00:00:00Z" }, as: PDCoordinator, captures: { s2: "$.data.id" } }
            - { call: "POST /pd/sections/${s2}/meetings", payload: { starts_at: "2026-09-10T12:30:00Z", ends_at: "2026-09-10T13:30:00Z", room: "R2" }, as: PDCoordinator }
            - { call: "POST /pd/sections/${s2}/publish", payload: {}, as: PDCoordinator }
            - { call: "POST /pd/sections", payload: { course_id: "${cc}", term: "2026-FALL", instructor_id: "${ins1}", building_id: "${b1}", room: "R3", seat_capacity: 5, starts_at: "2026-09-10T11:00:00Z", ends_at: "2026-09-10T13:00:00Z", registration_opens_at: "2026-08-01T00:00:00Z", registration_closes_at: "2026-09-01T00:00:00Z" }, as: PDCoordinator, captures: { s3: "$.data.id" } }
            - { call: "POST /pd/sections/${s3}/meetings", payload: { starts_at: "2026-09-10T11:30:00Z", ends_at: "2026-09-10T12:00:00Z", room: "R3" }, as: PDCoordinator }
            - { call: "POST /pd/sections/${s3}/publish", payload: {}, as: PDCoordinator }
            - { call: "POST /pd/registrations", payload: { teacher_id: "${t1}", section_id: "${s1}" }, as: Teacher, as_user_id: "${t1}", captures: { r1_st: "$.data.status" } }
            - { call: "POST /pd/registrations", payload: { teacher_id: "${t1}", section_id: "${s2}" }, as: Teacher, as_user_id: "${t1}", captures: { r2_st: "$.data.status" } }
          trigger:
            - { call: "POST /pd/registrations", payload: { teacher_id: "${t1}", section_id: "${s3}" }, as: Teacher, as_user_id: "${t1}", captures: { err: "$.data.error_id" } }
          assert:
            - "S1 registration REGISTERED"
            - "S2 registration REGISTERED — S2.starts_at == S1.ends_at is adjacency, allowed under half-open semantics"
            - "S3 registration rejected with ERR_SCHEDULE_CONFLICT (11:00-13:00 strictly overlaps both 09:00-12:00 and 12:00-15:00)"

      - name: overlap_room_turnover_buffer
        grounds:
          - "validations[priority=10]"
          - "errors[ERR_ROOM_CONFLICT]"
          - entities.SectionMeeting.fields.room
        distinguishing_aspect: |
          Semantics: buffered closed-gap on the ROOM resource — same-room meetings
          conflict unless the gap is >= 30 minutes, so 0-minute adjacency AND a
          29-minute gap are rejected while exactly 30 minutes passes. Different
          geometry (buffered) and different resource/endpoint (SectionMeeting via
          POST /pd/sections/{id}/meetings) than the sibling's half-open teacher
          schedule.
        test_recipe:
          setup:
            - "Building B1; instructor INS1; course C1; section S PUBLISHED with meeting M1 = 2026-08-15 09:00-10:00 room RB"
          setup_api_calls:
            - { call: "POST /pd/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PDCoordinator }
            - { call: "POST /pd/buildings", payload: { name: "B Eleven", building_code: "B11" }, as: PDCoordinator, captures: { b1: "$.data.id" } }
            - { call: "POST /pd/employees", payload: { full_name: "I K", email: "ik@x.com", employee_kind: "SPECIALIST", primary_building_id: "${b1}", base_lane: "MA" }, as: PDCoordinator, captures: { ins1: "$.data.id" } }
            - { call: "POST /pd/courses", payload: { course_code: "ROOM-1", title: "Room Course", delivery_mode: "IN_PERSON", clock_hours: 6, fee_cents: 0 }, as: PDCoordinator, captures: { c1: "$.data.id" } }
            - { call: "POST /pd/sections", payload: { course_id: "${c1}", term: "2026-FALL", instructor_id: "${ins1}", building_id: "${b1}", room: "RB", seat_capacity: 5, starts_at: "2026-08-15T08:00:00Z", ends_at: "2026-08-15T18:00:00Z", registration_opens_at: "2026-08-01T00:00:00Z", registration_closes_at: "2026-08-10T00:00:00Z" }, as: PDCoordinator, captures: { s1: "$.data.id" } }
            - { call: "POST /pd/sections/${s1}/meetings", payload: { starts_at: "2026-08-15T09:00:00Z", ends_at: "2026-08-15T10:00:00Z", room: "RB" }, as: PDCoordinator, captures: { m1: "$.data.id" } }
            - { call: "POST /pd/sections/${s1}/publish", payload: {}, as: PDCoordinator }
          trigger:
            - { call: "POST /pd/sections/${s1}/meetings", payload: { starts_at: "2026-08-15T10:00:00Z", ends_at: "2026-08-15T10:30:00Z", room: "RB" }, as: PDCoordinator, captures: { err1: "$.data.error_id" } }
            - { call: "POST /pd/sections/${s1}/meetings", payload: { starts_at: "2026-08-15T10:29:00Z", ends_at: "2026-08-15T11:00:00Z", room: "RB" }, as: PDCoordinator, captures: { err2: "$.data.error_id" } }
            - { call: "POST /pd/sections/${s1}/meetings", payload: { starts_at: "2026-08-15T10:30:00Z", ends_at: "2026-08-15T11:00:00Z", room: "RB" }, as: PDCoordinator, captures: { m4: "$.data.id" } }
          assert:
            - "10:00 meeting rejected ERR_ROOM_CONFLICT (gap 0 < 30 min — adjacency NOT sufficient here)"
            - "10:29 meeting rejected ERR_ROOM_CONFLICT (gap 29 < 30)"
            - "10:30 meeting CREATED (gap exactly 30 == buffer, inclusive pass)"
            - "Created meeting id ${m4} != null"

  # ---------------------------------------------------------------------------
  # Rule 9 — compensating_invariant (different conserved quantities)
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: invariant_budget_conservation_register_drop
        grounds:
          - calculations.budget_availability
          - state_machines.Registration.REGISTERED_to_DROPPED
          - entities.BuildingBudget.fields.available_cents
        distinguishing_aspect: |
          Conserved quantity: money. allocated_cents == encumbered_cents +
          spent_cents + available_cents MUST hold after the forward action
          (register, +20000 encumbered) and after its compensating action (drop),
          which returns encumbered_cents to exactly its pre-action value 0.
        test_recipe:
          setup:
            - "Building B1, FY2026 budget allocated 500000 OPEN"
            - "Teacher T1 (B1); instructor INS1; course fee 20000; section S PUBLISHED with meeting (std dates)"
            - "T1 REGISTERED (encumbrance 20000); pre-drop budget snapshot captured"
          setup_api_calls:
            - { call: "POST /pd/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PDCoordinator }
            - { call: "POST /pd/buildings", payload: { name: "B Twelve", building_code: "B12" }, as: PDCoordinator, captures: { b1: "$.data.id" } }
            - { call: "POST /pd/budgets", payload: { building_id: "${b1}", fiscal_year: 2026, allocated_cents: 500000 }, as: BusinessOfficer, captures: { bud1: "$.data.id" } }
            - { call: "POST /pd/budgets/${bud1}/open", payload: {}, as: BusinessOfficer }
            - { call: "POST /pd/employees", payload: { full_name: "T N", email: "tn@x.com", employee_kind: "TEACHER", primary_building_id: "${b1}", base_lane: "BA" }, as: PDCoordinator, captures: { t1: "$.data.id" } }
            - { call: "POST /pd/employees", payload: { full_name: "I L", email: "il@x.com", employee_kind: "SPECIALIST", primary_building_id: "${b1}", base_lane: "MA" }, as: PDCoordinator, captures: { ins1: "$.data.id" } }
            - { call: "POST /pd/courses", payload: { course_code: "INV-1", title: "Invariant Course", delivery_mode: "IN_PERSON", clock_hours: 10, fee_cents: 20000 }, as: PDCoordinator, captures: { c1: "$.data.id" } }
            - { call: "POST /pd/sections", payload: { course_id: "${c1}", term: "2026-FALL", instructor_id: "${ins1}", building_id: "${b1}", room: "R1", seat_capacity: 5, starts_at: "2026-08-15T09:00:00Z", ends_at: "2026-08-20T17:00:00Z", registration_opens_at: "2026-08-01T00:00:00Z", registration_closes_at: "2026-08-10T00:00:00Z" }, as: PDCoordinator, captures: { s1: "$.data.id" } }
            - { call: "POST /pd/sections/${s1}/meetings", payload: { starts_at: "2026-08-15T10:00:00Z", ends_at: "2026-08-15T12:00:00Z", room: "R1" }, as: PDCoordinator }
            - { call: "POST /pd/sections/${s1}/publish", payload: {}, as: PDCoordinator }
            - { call: "POST /pd/registrations", payload: { teacher_id: "${t1}", section_id: "${s1}" }, as: Teacher, as_user_id: "${t1}", captures: { r1: "$.data.id" } }
            - { call: "GET /pd/budgets/${bud1}", payload: {}, as: PDCoordinator, captures: { pre_enc: "$.data.encumbered_cents", pre_spent: "$.data.spent_cents", pre_avail: "$.data.available_cents" } }
          trigger:
            - { call: "POST /pd/registrations/${r1}/drop", payload: {}, as: Teacher, as_user_id: "${t1}" }
            - { call: "GET /pd/budgets/${bud1}", payload: {}, as: PDCoordinator, captures: { post_enc: "$.data.encumbered_cents", post_spent: "$.data.spent_cents", post_avail: "$.data.available_cents" } }
          assert:
            - "After register (forward): encumbered == 20000, spent == 0, available == 480000, and 500000 == 20000 + 0 + 480000"
            - "After drop (compensating): encumbered == 0, spent == 0, available == 500000, and 500000 == 0 + 0 + 500000"
            - "Net drift of the register+drop pair on encumbered_cents == 0"

      - name: invariant_seat_conservation_drop_promote
        grounds:
          - calculations.seat_and_waitlist_allocation
          - state_machines.Registration.WAITLISTED_to_REGISTERED
          - entities.Section.fields.seats_registered
        distinguishing_aspect: |
          Conserved quantity: seats. seat_capacity == seats_registered +
          seats_open MUST hold across the drop+promotion pair: capacity 1 stays
          exactly fully consumed (1 registered + 0 open) before AND after the
          drop promotes the waitlisted teacher — a different conserved quantity
          (seat count) than the sibling's money.
        test_recipe:
          setup:
            - "Building B1; teachers T1, T2; instructor INS1; course fee 0 (isolates seats from budget)"
            - "Section S capacity 1 PUBLISHED with meeting (std dates)"
            - "T1 REGISTERED (seats_registered 1, seats_open 0); T2 WAITLISTED seq 1"
          setup_api_calls:
            - { call: "POST /pd/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: PDCoordinator }
            - { call: "POST /pd/buildings", payload: { name: "B Thirteen", building_code: "B13" }, as: PDCoordinator, captures: { b1: "$.data.id" } }
            - { call: "POST /pd/employees", payload: { full_name: "T O", email: "to@x.com", employee_kind: "TEACHER", primary_building_id: "${b1}", base_lane: "BA" }, as: PDCoordinator, captures: { t1: "$.data.id" } }
            - { call: "POST /pd/employees", payload: { full_name: "T P", email: "tp@x.com", employee_kind: "TEACHER", primary_building_id: "${b1}", base_lane: "BA" }, as: PDCoordinator, captures: { t2: "$.data.id" } }
            - { call: "POST /pd/employees", payload: { full_name: "I M", email: "im@x.com", employee_kind: "SPECIALIST", primary_building_id: "${b1}", base_lane: "MA" }, as: PDCoordinator, captures: { ins1: "$.data.id" } }
            - { call: "POST /pd/courses", payload: { course_code: "SEAT-INV", title: "Seat Invariant", delivery_mode: "IN_PERSON", clock_hours: 4, fee_cents: 0 }, as: PDCoordinator, captures: { c1: "$.data.id" } }
            - { call: "POST /pd/sections", payload: { course_id: "${c1}", term: "2026-FALL", instructor_id: "${ins1}", building_id: "${b1}", room: "R1", seat_capacity: 1, starts_at: "2026-08-15T09:00:00Z", ends_at: "2026-08-20T17:00:00Z", registration_opens_at: "2026-08-01T00:00:00Z", registration_closes_at: "2026-08-10T00:00:00Z" }, as: PDCoordinator, captures: { s1: "$.data.id" } }
            - { call: "POST /pd/sections/${s1}/meetings", payload: { starts_at: "2026-08-15T10:00:00Z", ends_at: "2026-08-15T12:00:00Z", room: "R1" }, as: PDCoordinator }
            - { call: "POST /pd/sections/${s1}/publish", payload: {}, as: PDCoordinator }
            - { call: "POST /pd/registrations", payload: { teacher_id: "${t1}", section_id: "${s1}" }, as: Teacher, as_user_id: "${t1}", captures: { r1: "$.data.id", r1_st: "$.data.status" } }
            - { call: "POST /pd/registrations", payload: { teacher_id: "${t2}", section_id: "${s1}" }, as: Teacher, as_user_id: "${t2}", captures: { r2: "$.data.id", r2_st: "$.data.status" } }
            - { call: "GET /pd/sections/${s1}", payload: {}, as: PDCoordinator, captures: { pre_reg: "$.data.seats_registered", pre_open: "$.data.seats_open" } }
          trigger:
            - { call: "POST /pd/registrations/${r1}/drop", payload: {}, as: Teacher, as_user_id: "${t1}" }
            - { call: "GET /pd/sections/${s1}", payload: {}, as: PDCoordinator, captures: { post_reg: "$.data.seats_registered", post_open: "$.data.seats_open" } }
            - { call: "GET /pd/registrations/${r2}", payload: {}, as: PDCoordinator, captures: { r2_st2: "$.data.status" } }
          assert:
            - "Pre-drop: seats_registered == 1 and seats_open == 0 (1 == 1 + 0 == seat_capacity)"
            - "Post drop+promotion: seats_registered == 1 and seats_open == 0 — conserved, the seat changed occupants not count"
            - "R2.status == REGISTERED after promotion"
            - "R1 pre-drop status == REGISTERED and R2 pre-drop status == WAITLISTED"
