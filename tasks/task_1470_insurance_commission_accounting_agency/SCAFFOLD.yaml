# =============================================================================
# Task 1470 — Insurance Commission Accounting & Agency Billing
# Scaffold seed tables (§1.0–§1.7). §1.8 lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml;
# §1.9 lives in SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  Insurance Commission Accounting & Agency Billing (insurance agency accounting):
  commission schedule by product/carrier & tier, statement reconciliation against
  expected commission, chargeback on cancellation & unearned commission recovery,
  downline/override hierarchy calculation, agency-bill vs direct-bill accounting &
  trust funds, producer compensation disclosure, delinquent premium & policy
  cancellation for nonpayment, 1099 reporting to producers

domain_name: insurance-commission-accounting
api_prefix: /agency

# =============================================================================
# Complexity Profile (§0.1–§0.4) — Expert band, driven by 8 scenario bullets
# =============================================================================
complexity_profile:
  primary_archetype: ledger_reconciliation        # expected commission vs carrier statement
  secondary_archetype: compliance_audit           # trust funds, disclosures, 1099
  complexity_layers:
    - dual_variant_calculation    # annualized vs advance-limited booking; cash vs accrual 1099
    - cascading_side_effects      # cancellation → chargeback → balance → suspension
    - optimistic_concurrency      # OCC on Product.version / Producer.version
    - derived_field_reconciliation  # producer balance, trust balance, statement totals

  entity_topology: flat           # peer entities joined by FK references; flat URL space
  state_machine_shape: cyclic     # Policy ACTIVE↔GRACE cure loop; CarrierStatement RECONCILING↔DISPUTED

  relationship_patterns:
    - one_to_many           # Carrier→Product→CommissionSchedule; Policy→PremiumInvoice
    - self_referential      # Producer.upline_producer_id (downline/override hierarchy)
    - cross_aggregate       # CommissionEntry ties Policy/Producer/Schedule/Statement

  role_model: hierarchical_override   # AgencyAdmin superset + override power over AgencyAccountant

  consistency_model: immediate    # every mutation + cascade visible in the same response/read

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Producer
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Producer full name" }
      - { name: license_number, type: string, source: input, description: "State license number; unique across all producers", constraints: "unique" }
      - { name: tier, type: enum, source: input, default: "STANDARD", description: "Compensation tier", constraints: "STANDARD | GOLD | PLATINUM" }
      - { name: upline_producer_id, type: string, source: input, description: "FK -> Producer.id; immediate upline (upline agency). Null = no upline", constraints: "nullable" }
      - { name: tax_form_on_file, type: boolean, source: input, default: false, description: "W-9 on file; payouts blocked while false" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED | TERMINATED. SUSPENDED is system-driven when pending chargebacks exceed threshold" }
      - { name: commission_balance_cents, type: integer, source: computed, description: "Earned-but-unpaid = sum(CommissionEntry.amount_cents with status in {EXPECTED, MATCHED} for this producer as recipient) - sum(ProducerPayout.amount_cents with status PAID)" }
      - { name: pending_chargebacks_cents, type: integer, source: computed, description: "Sum of Chargeback.amount_cents - recovered_cents over PENDING chargebacks for this producer" }

  - name: Carrier
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Carrier name" }
      - { name: carrier_code, type: string, source: input, description: "Unique carrier code", constraints: "unique" }
      - { name: trust_balance_cents, type: integer, source: computed, description: "Agency-bill premium held in trust = sum(invoice payments received on this carrier's AGENCY_BILL policies) - sum(reversals) - sum(remittances)" }
      - { name: total_remitted_cents, type: integer, source: computed, description: "Cumulative remittances sent to this carrier" }

  - name: Product
    parent: null
    common_fields: true
    fields:
      - { name: carrier_id, type: string, source: input, description: "FK -> Carrier.id" }
      - { name: product_code, type: string, source: input, description: "Product code, unique per carrier", constraints: "unique per carrier_id" }
      - { name: name, type: string, source: input, description: "Product name" }
      - { name: line_of_business, type: enum, source: input, description: "LIFE | ANNUITY | HEALTH | PROPERTY_CASUALTY" }

  - name: CommissionSchedule
    parent: null
    common_fields: true
    fields:
      - { name: product_id, type: string, source: system, description: "FK -> Product.id (from path)" }
      - { name: tier, type: enum, source: input, description: "Producer tier this row prices: STANDARD | GOLD | PLATINUM" }
      - { name: commission_rate_bps, type: integer, source: input, description: "First-year commission rate in basis points of annual premium (0..10000)" }
      - { name: override_rate_bps, type: integer, source: input, description: "Override rate in bps of annual premium paid to the nearest ACTIVE-status ancestor" }
      - { name: advance_months, type: integer, source: input, description: "Months of first-year commission the carrier books at bind (1..12); 12 selects variant ANNUALIZED_FULL, otherwise ADVANCE_LIMITED" }
      - { name: effective_from, type: string, source: input, description: "ISO date; window start (inclusive)" }
      - { name: effective_to, type: string, source: input, description: "ISO date; window end (EXCLUSIVE — half-open interval). Null = open-ended", constraints: "nullable" }
      - { name: status, type: enum, source: system, description: "ACTIVE | RETIRED. RETIRED set when superseded by a newer same-tier schedule" }

  - name: Policy
    parent: null
    common_fields: true
    fields:
      - { name: policy_number, type: string, source: input, description: "Unique policy number (statement lines match on this)", constraints: "unique" }
      - { name: product_id, type: string, source: input, description: "FK -> Product.id" }
      - { name: producer_id, type: string, source: input, description: "FK -> Producer.id; writing agent" }
      - { name: insured_name, type: string, source: input, description: "Insured party name" }
      - { name: billing_type, type: enum, source: input, description: "AGENCY_BILL (agency collects premium into trust) | DIRECT_BILL (carrier bills insured directly)" }
      - { name: premium_annual_cents, type: integer, source: input, description: "Annualized premium in cents (> 0)" }
      - { name: effective_date, type: string, source: input, description: "ISO date coverage starts" }
      - { name: status, type: enum, source: system, description: "QUOTED | ACTIVE | GRACE | CANCELLED_VOLUNTARY | CANCELLED_NONPAY" }
      - { name: cancel_effective_date, type: string, source: system, description: "ISO date cancellation takes effect (null until cancelled)", constraints: "nullable" }
      - { name: cancelled_at, type: datetime, source: system, description: "Timestamp of cancellation (null until cancelled)", constraints: "nullable" }

  - name: PremiumInvoice
    parent: null
    common_fields: true
    fields:
      - { name: policy_id, type: string, source: system, description: "FK -> Policy.id" }
      - { name: amount_cents, type: integer, source: computed, description: "= policy.premium_annual_cents at bind" }
      - { name: paid_total_cents, type: integer, source: computed, description: "Sum of recorded, non-reversed payments" }
      - { name: due_date, type: string, source: computed, description: "= policy.effective_date + 30 calendar days" }
      - { name: status, type: enum, source: system, description: "OPEN | DELINQUENT | PAID" }

  - name: CarrierStatement
    parent: null
    common_fields: true
    fields:
      - { name: carrier_id, type: string, source: input, description: "FK -> Carrier.id" }
      - { name: period_start, type: string, source: input, description: "ISO date; statement period start (inclusive)" }
      - { name: period_end, type: string, source: input, description: "ISO date; statement period end (INCLUSIVE — closed interval)" }
      - { name: lines, type: array, source: input, description: "Array of { line_ref (policy_number string), reported_amount_cents (integer) }; each line gains computed match_status in {UNMATCHED, MATCHED, VARIANCE_FLAGGED, ORPHAN, WAIVED} and matched_entry_id (nullable)" }
      - { name: total_reported_cents, type: integer, source: computed, description: "Sum of lines[].reported_amount_cents" }
      - { name: matched_total_cents, type: integer, source: computed, description: "Sum of reported_amount_cents over lines with match_status MATCHED" }
      - { name: expected_matched_total_cents, type: integer, source: computed, description: "Sum of amount_cents over CommissionEntries linked to lines (pinned rounding: entries were individually round_half_up at creation; totals sum the per-entry rounded values — never round after summing)" }
      - { name: variance_total_cents, type: integer, source: computed, description: "= matched_total_cents - expected_matched_total_cents" }
      - { name: status, type: enum, source: system, description: "RECEIVED | RECONCILING | DISPUTED | RECONCILED" }

  - name: CommissionEntry
    parent: null
    common_fields: true
    fields:
      - { name: policy_id, type: string, source: system, description: "FK -> Policy.id" }
      - { name: producer_id, type: string, source: system, description: "FK -> Producer.id; recipient (writing agent for BASE, ancestor for OVERRIDE)" }
      - { name: schedule_id, type: string, source: system, description: "FK -> CommissionSchedule.id used at bind" }
      - { name: entry_type, type: enum, source: system, description: "BASE | OVERRIDE | EARNED_ADJUSTMENT | VARIANCE_ADJUSTMENT" }
      - { name: amount_cents, type: integer, source: computed, description: "round_half_up booked amount; negative for downward VARIANCE_ADJUSTMENT" }
      - { name: annualized_full_amount_cents, type: integer, source: computed, description: "The ANNUALIZED_FULL variant value for the same policy/schedule (informational; equals amount_cents when variant is ANNUALIZED_FULL)" }
      - { name: variant, type: enum, source: system, description: "ANNUALIZED_FULL (advance_months == 12) | ADVANCE_LIMITED (advance_months < 12)" }
      - { name: status, type: enum, source: system, description: "EXPECTED | MATCHED | VARIANCE | CHARGED_BACK" }
      - { name: matched_statement_id, type: string, source: system, description: "FK -> CarrierStatement.id; set when matched or variance-flagged during reconciliation", constraints: "nullable" }
      - { name: matched_at, type: datetime, source: system, description: "Timestamp when status became MATCHED", constraints: "nullable" }
      - { name: source_entry_id, type: string, source: system, description: "FK -> CommissionEntry.id; for EARNED_ADJUSTMENT / VARIANCE_ADJUSTMENT entries, the original BASE/OVERRIDE entry", constraints: "nullable" }

  - name: Chargeback
    parent: null
    common_fields: true
    fields:
      - { name: policy_id, type: string, source: system, description: "FK -> Policy.id" }
      - { name: producer_id, type: string, source: system, description: "FK -> Producer.id; who owes the recovery" }
      - { name: commission_entry_id, type: string, source: system, description: "FK -> CommissionEntry.id; original entry being clawed back" }
      - { name: reason, type: enum, source: system, description: "CANCELLATION_UNEARNED | NONPAY_LAPSE | OVERPAYMENT_VARIANCE" }
      - { name: amount_cents, type: integer, source: computed, description: "Unearned/overpaid commission to recover (> 0)" }
      - { name: recovered_cents, type: integer, source: computed, description: "Cash recovered so far" }
      - { name: outstanding_cents, type: integer, source: computed, description: "= amount_cents - recovered_cents" }
      - { name: status, type: enum, source: system, description: "PENDING | RECOVERED | WRITTEN_OFF" }

  - name: ProducerDisclosure
    parent: null
    common_fields: true
    fields:
      - { name: policy_id, type: string, source: system, description: "FK -> Policy.id (one disclosure per policy)" }
      - { name: producer_id, type: string, source: system, description: "FK -> Producer.id; writing agent being disclosed" }
      - { name: projected_comp_cents, type: integer, source: computed, description: "Projected first-year BASE commission at policy creation using the ACTIVE schedule for (product, producer.tier) covering effective_date; 0 if none exists yet" }
      - { name: status, type: enum, source: system, description: "GENERATED | DELIVERED | ACKNOWLEDGED" }
      - { name: disclosed_at, type: datetime, source: system, description: "When delivered", constraints: "nullable" }
      - { name: acknowledged_at, type: datetime, source: system, description: "When the producer acknowledged", constraints: "nullable" }

  - name: ProducerPayout
    parent: null
    common_fields: true
    fields:
      - { name: producer_id, type: string, source: system, description: "FK -> Producer.id (from path)" }
      - { name: amount_cents, type: integer, source: input, description: "Gross payout amount (> 0)" }
      - { name: status, type: enum, source: system, description: "INITIATED | PAID" }
      - { name: paid_at, type: datetime, source: system, description: "Logical-clock timestamp when marked PAID (drives 1099 cash-basis year)", constraints: "nullable" }

  - name: TaxForm1099
    parent: null
    common_fields: true
    fields:
      - { name: producer_id, type: string, source: system, description: "FK -> Producer.id" }
      - { name: tax_year, type: integer, source: system, description: "Calendar year (e.g. 2026)" }
      - { name: cash_basis_total_cents, type: integer, source: computed, description: "Sum of ProducerPayout.amount_cents with status PAID and paid_at within [tax_year-01-01, (tax_year+1)-01-01)" }
      - { name: accrual_basis_total_cents, type: integer, source: computed, description: "Sum of CommissionEntry.amount_cents with status MATCHED and matched_at within the tax year (all entry_types, incl. negative VARIANCE_ADJUSTMENT)" }
      - { name: status, type: enum, source: system, description: "DRAFT | FINALIZED" }
      - { name: finalized_at, type: datetime, source: system, description: "When finalized; totals recomputed and locked at this moment", constraints: "nullable" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Producer
    initial_state: ACTIVE
    terminal_states: [TERMINATED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system (immediately after any Chargeback creation leaves sum of PENDING chargeback outstanding_cents > 500000)"
        actor: system
        preconditions: []
        side_effects:
          - "Producer.version increments by 1; updated_at refreshed"

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /agency/producers/{id}/reactivate"
        actor: AgencyAdmin | AgencyAccountant
        preconditions:
          - "No PENDING chargebacks for this producer (else ERR_PRODUCER_STILL_SUSPENDED)"
        side_effects: []

      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /agency/producers/{id}/terminate"
        actor: AgencyAdmin
        preconditions: []
        side_effects:
          - "PENDING chargebacks stay PENDING (recoverable or writable-off after termination)"

      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /agency/producers/{id}/terminate"
        actor: AgencyAdmin
        preconditions: []
        side_effects: []

  - entity: CommissionSchedule
    initial_state: ACTIVE
    terminal_states: [RETIRED]
    transitions:
      - from: ACTIVE
        to: RETIRED
        trigger: "system (when POST /agency/products/{id}/commission-schedules arrives with supersede_existing=true and the same tier: the previously ACTIVE same-tier schedule's effective_to := new effective_from and status := RETIRED)"
        actor: system
        preconditions: []
        side_effects:
          - "Product.version increments by 1"

  - entity: Policy
    initial_state: QUOTED
    terminal_states: [CANCELLED_VOLUNTARY, CANCELLED_NONPAY]
    transitions:
      - from: QUOTED
        to: ACTIVE
        trigger: "POST /agency/policies/{id}/bind"
        actor: AgencyAdmin | AgencyAccountant
        preconditions:
          - "Writing Producer.status == ACTIVE (ERR_PRODUCER_NOT_ACTIVE)"
          - "An ACTIVE CommissionSchedule exists for (policy.product_id, producer.tier) whose half-open window covers policy.effective_date (ERR_NO_EFFECTIVE_SCHEDULE)"
          - "The policy's ProducerDisclosure.status in {DELIVERED, ACKNOWLEDGED} (ERR_DISCLOSURE_REQUIRED)"
        side_effects:
          - "Create BASE CommissionEntry via expected_commission (variant selected by schedule.advance_months)"
          - "Create OVERRIDE CommissionEntry for the nearest ancestor producer with status == ACTIVE via override_commission (skip ancestors whose status != ACTIVE; none created if no ACTIVE ancestor or override_rate_bps == 0)"
          - "AGENCY_BILL only: create PremiumInvoice (amount = premium_annual_cents, due_date = effective_date + 30 days, status OPEN)"
          - "DIRECT_BILL: no PremiumInvoice is created"

      - from: ACTIVE
        to: GRACE
        trigger: "system (POST /_clock/set_current_utc sweep: policy is AGENCY_BILL and has a PremiumInvoice with status DELINQUENT)"
        actor: system
        preconditions: []
        side_effects: []

      - from: GRACE
        to: ACTIVE
        trigger: "system (POST /agency/premium-invoices/{id}/payments: when the payment flips the invoice to PAID and the policy has no other DELINQUENT invoices)"
        actor: system
        preconditions: []
        side_effects: []

      - from: GRACE
        to: CANCELLED_NONPAY
        trigger: "system (POST /_clock/set_current_utc sweep: current time > oldest DELINQUENT invoice.due_date + 30 days)"
        actor: system
        preconditions: []
        side_effects:
          - "cancel_effective_date := that invoice.due_date + 30 days; cancelled_at := now"
          - "Cascade (link 2): every CommissionEntry of this policy with status in {EXPECTED, MATCHED} -> CHARGED_BACK; per such entry, create EARNED_ADJUSTMENT entry (status MATCHED, matched_at = now) for the earned portion via chargeback_unearned_commission; if unearned > 0 create Chargeback PENDING (reason NONPAY_LAPSE)"
          - "Cascade (link 3): each affected Producer's derived fields recompute; if a producer's PENDING chargeback outstanding total > 500000 and status == ACTIVE -> SUSPENDED"

      - from: ACTIVE
        to: CANCELLED_VOLUNTARY
        trigger: "POST /agency/policies/{id}/cancel"
        actor: AgencyAdmin | AgencyAccountant
        preconditions:
          - "cancel_effective_date >= policy.effective_date (ERR_INVALID_REQUEST)"
        side_effects:
          - "cancelled_at := now"
          - "Cascade (link 2): same entry CHARGED_BACK / EARNED_ADJUSTMENT / Chargeback PENDING (reason CANCELLATION_UNEARNED) chain as CANCELLED_NONPAY"
          - "Cascade (link 3): same producer recompute and > 500000 suspension check"

      - from: GRACE
        to: CANCELLED_VOLUNTARY
        trigger: "POST /agency/policies/{id}/cancel"
        actor: AgencyAdmin | AgencyAccountant
        preconditions:
          - "cancel_effective_date >= policy.effective_date (ERR_INVALID_REQUEST)"
        side_effects:
          - "Same cascade links 2 and 3 as ACTIVE -> CANCELLED_VOLUNTARY"

  - entity: PremiumInvoice
    initial_state: OPEN
    terminal_states: [PAID]
    transitions:
      - from: OPEN
        to: DELINQUENT
        trigger: "system (POST /_clock/set_current_utc sweep: current time > due_date and paid_total_cents < amount_cents)"
        actor: system
        preconditions: []
        side_effects:
          - "Owning AGENCY_BILL Policy in ACTIVE -> GRACE"

      - from: OPEN
        to: PAID
        trigger: "POST /agency/premium-invoices/{id}/payments"
        actor: AgencyAdmin | AgencyAccountant
        preconditions:
          - "amount_cents > 0 (ERR_INVALID_REQUEST)"
          - "payment amount <= amount_cents - paid_total_cents (ERR_OVERPAYMENT)"
        side_effects:
          - "paid_total_cents += payment; Carrier.trust_balance_cents += payment"
          - "If policy in GRACE and no other DELINQUENT invoices: policy -> ACTIVE"

      - from: DELINQUENT
        to: PAID
        trigger: "POST /agency/premium-invoices/{id}/payments"
        actor: AgencyAdmin | AgencyAccountant
        preconditions:
          - "payment amount <= amount_cents - paid_total_cents (ERR_OVERPAYMENT)"
        side_effects:
          - "paid_total_cents += payment; Carrier.trust_balance_cents += payment"
          - "If policy in GRACE and no other DELINQUENT invoices: policy -> ACTIVE"

      - from: OPEN
        to: OPEN
        trigger: "POST /agency/premium-invoices/{id}/reverse-payments (invoice stays OPEN, payments unwound)"
        actor: AgencyAdmin | AgencyAccountant
        preconditions:
          - "paid_total_cents > 0 (ERR_NOTHING_TO_REVERSE)"
          - "Carrier.trust_balance_cents >= paid_total_cents (ERR_TRUST_INSUFFICIENT — funds already remitted)"
        side_effects:
          - "Carrier.trust_balance_cents -= paid_total_cents; paid_total_cents := 0"

      - from: DELINQUENT
        to: DELINQUENT
        trigger: "POST /agency/premium-invoices/{id}/reverse-payments (invoice stays DELINQUENT, payments unwound)"
        actor: AgencyAdmin | AgencyAccountant
        preconditions:
          - "paid_total_cents > 0 (ERR_NOTHING_TO_REVERSE)"
          - "Carrier.trust_balance_cents >= paid_total_cents (ERR_TRUST_INSUFFICIENT)"
        side_effects:
          - "Carrier.trust_balance_cents -= paid_total_cents; paid_total_cents := 0"
        note: "Partial payments leave the invoice in its current status (OPEN or DELINQUENT); only reaching paid_total_cents == amount_cents flips to PAID. PAID is terminal: further payments -> ERR_INVALID_STATE; reversal of a PAID invoice -> ERR_INVALID_STATE."

  - entity: CarrierStatement
    initial_state: RECEIVED
    terminal_states: [RECONCILED]
    transitions:
      - from: RECEIVED
        to: RECONCILING
        trigger: "POST /agency/carrier-statements/{id}/start-reconciliation"
        actor: AgencyAdmin | AgencyAccountant
        preconditions: []
        side_effects:
          - "Matching per line (statement_reconciliation): find BASE CommissionEntry whose policy.policy_number == line.line_ref, policy carrier == statement.carrier_id, status == EXPECTED; if several, pick earliest CommissionEntry.created_at ASC. |reported - expected| <= 100 -> entry MATCHED (matched_statement_id, matched_at set) and line MATCHED; else entry -> VARIANCE and line VARIANCE_FLAGGED. No such entry -> line ORPHAN"

      - from: RECONCILING
        to: DISPUTED
        trigger: "POST /agency/carrier-statements/{id}/dispute"
        actor: AgencyAdmin | AgencyAccountant
        preconditions: []
        side_effects: []

      - from: DISPUTED
        to: RECONCILING
        trigger: "POST /agency/carrier-statements/{id}/resume"
        actor: AgencyAdmin | AgencyAccountant
        preconditions: []
        side_effects: []
        note: "RECONCILING -> DISPUTED -> RECONCILING rework cycle; may repeat without bound."

      - from: RECONCILING
        to: RECONCILED
        trigger: "POST /agency/carrier-statements/{id}/close"
        actor: AgencyAdmin | AgencyAccountant
        preconditions:
          - "Every line match_status in {MATCHED, WAIVED} AND no CommissionEntry with matched_statement_id == this statement remains in VARIANCE (ERR_UNMATCHED_STATEMENT_LINES)"
        side_effects:
          - "Statement totals frozen (matched_total_cents, expected_matched_total_cents, variance_total_cents)"

  - entity: CommissionEntry
    initial_state: EXPECTED
    terminal_states: [MATCHED, CHARGED_BACK]
    transitions:
      - from: EXPECTED
        to: MATCHED
        trigger: "system (statement start-reconciliation, within tolerance) — see CarrierStatement"
        actor: system
        preconditions: []
        side_effects: ["matched_statement_id and matched_at set; Producer.commission_balance_cents recomputed"]

      - from: EXPECTED
        to: VARIANCE
        trigger: "system (statement start-reconciliation, |reported - expected| > 100 cents)"
        actor: system
        preconditions: []
        side_effects: ["matched_statement_id set"]

      - from: VARIANCE
        to: MATCHED
        trigger: "POST /agency/commission-entries/{id}/resolve-variance"
        actor: AgencyAdmin | AgencyAccountant
        preconditions:
          - "accept_amount_cents >= 0 (ERR_INVALID_REQUEST)"
        side_effects:
          - "Entry amount unchanged (immutable); matched_at := now; the flagging statement line VARIANCE_FLAGGED -> MATCHED"
          - "Cascade (link 2): create VARIANCE_ADJUSTMENT CommissionEntry (status MATCHED, amount = accept_amount_cents - original amount_cents, source_entry_id = this entry)"
          - "Cascade (link 3): if adjustment amount < 0, create Chargeback PENDING (reason OVERPAYMENT_VARIANCE, amount = -adjustment); if that leaves the producer's PENDING total > 500000 and status == ACTIVE -> SUSPENDED"

      - from: EXPECTED
        to: CHARGED_BACK
        trigger: "system (policy cancellation cascade — see Policy)"
        actor: system
        preconditions: []
        side_effects: ["EARNED_ADJUSTMENT entry + Chargeback created per Policy cascade"]

      - from: MATCHED
        to: CHARGED_BACK
        trigger: "system (policy cancellation cascade)"
        actor: system
        preconditions: []
        side_effects: ["EARNED_ADJUSTMENT entry + Chargeback created per Policy cascade"]

  - entity: Chargeback
    initial_state: PENDING
    terminal_states: [RECOVERED, WRITTEN_OFF]
    transitions:
      - from: PENDING
        to: RECOVERED
        trigger: "POST /agency/chargebacks/{id}/recoveries"
        actor: AgencyAdmin | AgencyAccountant
        preconditions:
          - "amount_cents > 0 (ERR_INVALID_REQUEST)"
          - "amount_cents <= outstanding_cents (ERR_RECOVERY_EXCEEDS_OUTSTANDING)"
        side_effects:
          - "recovered_cents += amount; status -> RECOVERED exactly when recovered_cents == amount_cents (partial recovery leaves PENDING)"

      - from: PENDING
        to: WRITTEN_OFF
        trigger: "POST /agency/chargebacks/{id}/write-off"
        actor: AgencyAdmin
        preconditions:
          - "Chargeback.producer's status == TERMINATED (ERR_PRODUCER_NOT_TERMINATED)"
        side_effects: []

  - entity: ProducerDisclosure
    initial_state: GENERATED
    terminal_states: [ACKNOWLEDGED]
    transitions:
      - from: GENERATED
        to: DELIVERED
        trigger: "POST /agency/producer-disclosures/{id}/deliver"
        actor: AgencyAdmin | AgencyAccountant
        preconditions: []
        side_effects: ["disclosed_at := now"]

      - from: DELIVERED
        to: ACKNOWLEDGED
        trigger: "POST /agency/producer-disclosures/{id}/acknowledge"
        actor: Producer
        preconditions:
          - "X-User-ID == disclosure.producer_id (ERR_NOT_RESOURCE_OWNER)"
        side_effects: ["acknowledged_at := now"]

  - entity: ProducerPayout
    initial_state: INITIATED
    terminal_states: [PAID]
    transitions:
      - from: INITIATED
        to: PAID
        trigger: "POST /agency/payouts/{id}/mark-paid"
        actor: AgencyAdmin | AgencyAccountant
        preconditions:
          - "Producer still ACTIVE (ERR_PRODUCER_NOT_ACTIVE)"
          - "amount_cents <= producer.commission_balance_cents at this moment (ERR_PAYOUT_EXCEEDS_BALANCE)"
        side_effects:
          - "paid_at := logical clock now; Producer.commission_balance_cents -= amount_cents (drives 1099 cash basis)"

  - entity: TaxForm1099
    initial_state: DRAFT
    terminal_states: [FINALIZED]
    transitions:
      - from: DRAFT
        to: FINALIZED
        trigger: "POST /agency/tax-forms/{id}/finalize"
        actor: AgencyAdmin
        preconditions: []
        side_effects:
          - "cash_basis_total_cents and accrual_basis_total_cents recomputed as of now and locked; finalized_at := now"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on parent version; true create-with-supersede races only)
# =============================================================================
concurrency_rules:
  - rule_id: schedule-create-stale-product
    parent_entity: Product
    write_endpoint: "POST /agency/products/{productId}/commission-schedules"
    occ_field: "expected_product_version"
    description: |
      Creating a CommissionSchedule against a Product whose version has advanced
      since the client last observed it is rejected. This captures the case where
      another writer has just created a superseding schedule (which legitimately
      retires the prior ACTIVE same-tier schedule and bumps Product.version) and
      the current writer's view of the product's schedule set is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: payout-create-stale-producer
    parent_entity: Producer
    write_endpoint: "POST /agency/producers/{producerId}/payouts"
    occ_field: "expected_producer_version"
    description: |
      Creating a ProducerPayout against a Producer whose version has advanced since
      the client last observed it is rejected: any successful payout creation, or
      any cascade such as chargeback-driven suspension, legitimately advances
      Producer.version, so a stale expected_producer_version means the client's
      view of commission_balance_cents is no longer current.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: expected_commission
    trigger: "Policy bind (QUOTED -> ACTIVE)"
    algorithm: tiered_pricing
    formula: |
      annual_full = round_half_up(premium_annual_cents * commission_rate_bps / 10000)
      variant selection (pinned): schedule.advance_months == 12 -> ANNUALIZED_FULL else ADVANCE_LIMITED
      if ANNUALIZED_FULL: amount_cents = annual_full
      if ADVANCE_LIMITED: amount_cents = round_half_up(annual_full * advance_months / 12)
      entry.annualized_full_amount_cents = annual_full (always, for both variants)
    input_set: "The policy being bound; the ACTIVE schedule covering (product_id, producer.tier, effective_date)"
    constants:
      COMMISSION_YEAR_MONTHS: 12
    precision: "0 decimal places (whole cents), round_half_up applied per entry at creation"
    variants:
      - name: ANNUALIZED_FULL
        when: "schedule.advance_months == 12"
        difference: "Books the entire first-year commission at bind"
      - name: ADVANCE_LIMITED
        when: "schedule.advance_months < 12"
        difference: "Books only advance_months/12 of the first-year commission at bind; identical policy data yields a smaller entry"

  - name: override_commission
    trigger: "Policy bind (after BASE entry creation)"
    algorithm: constraint_propagation
    formula: |
      recipient = first ancestor found walking Producer.upline_producer_id from the
                  writing producer whose status == ACTIVE at bind time
                  (ancestors with status in {SUSPENDED, TERMINATED} are skipped);
                  if none, no OVERRIDE entry is created (empty-pool fallback: skip)
      raw_override = round_half_up(premium_annual_cents * override_rate_bps / 10000)
      cap = round_half_up(BASE entry amount_cents * MAX_OVERRIDE_SHARE_BPS / 10000)
      override_cents = min(raw_override, cap)
      if override_rate_bps == 0: no entry
    input_set: "Writing producer's upline chain; the schedule used for the BASE entry"
    constants:
      MAX_OVERRIDE_SHARE_BPS: 2500   # override capped at 25% of the BASE entry amount
    precision: "0 decimal places, round_half_up"

  - name: statement_reconciliation
    trigger: "POST /agency/carrier-statements/{id}/start-reconciliation"
    algorithm: chronological
    formula: |
      for each line in statement.lines (processed in array order):
        candidates = CommissionEntry where policy.policy_number == line.line_ref
                     AND policy.product.carrier_id == statement.carrier_id
                     AND entry_type == BASE AND status == EXPECTED
        if candidates empty -> line.match_status = ORPHAN
        else entry = earliest by CommissionEntry.created_at ASC (tie impossible:
             created_at is unique per creation order)
        if |line.reported_amount_cents - entry.amount_cents| <= VARIANCE_TOLERANCE_CENTS
             -> entry -> MATCHED; line MATCHED
        else -> entry -> VARIANCE; line VARIANCE_FLAGGED
      totals: matched_total_cents = sum(reported over MATCHED lines)
              expected_matched_total_cents = sum(entry.amount_cents over linked entries)
      ROUNDING ORDER (pinned): entry amounts were each round_half_up at creation;
      totals sum those per-entry rounded integers. Summing unrounded products and
      rounding once is NOT the rule and yields different cents.
    input_set: "Statement lines; CommissionEntries with status EXPECTED for the carrier"
    constants:
      VARIANCE_TOLERANCE_CENTS: 100
    precision: "whole cents; per-entry rounding pinned above"

  - name: chargeback_unearned_commission
    trigger: "Policy cancellation (voluntary or nonpayment lapse)"
    algorithm: chronological
    formula: |
      months_earned = whole calendar months from effective_date to cancel_effective_date:
        m = (year2-year1)*12 + (month2-month1); if day2 < day1 then m -= 1;
        clamp m to [0, 12]
      for each CommissionEntry of the policy with status in {EXPECTED, MATCHED}:
        annual_full = entry.annualized_full_amount_cents
        earned = min(round_half_up(annual_full * months_earned / 12), entry.amount_cents)
        unearned = entry.amount_cents - earned
        entry -> CHARGED_BACK
        create EARNED_ADJUSTMENT entry (amount = earned, status MATCHED, matched_at = now,
          source_entry_id = entry.id) even when earned == 0
        if unearned > 0: create Chargeback PENDING (amount = unearned) — never created
          when unearned == 0
      invariant: chargeback.amount_cents + earned_adjustment.amount_cents == entry.amount_cents
    input_set: "Entries of the cancelled policy with status in {EXPECTED, MATCHED}"
    precision: "whole cents, round_half_up"

  - name: trust_remittance
    trigger: "POST /agency/carriers/{id}/remit"
    algorithm: aggregation
    formula: |
      trust_balance_cents = sum(invoice payments received on this carrier's AGENCY_BILL
                                policies) - sum(reversed payments) - sum(remittances)
      retained_commission_cents = sum(CommissionEntry.amount_cents with status in
          {EXPECTED, MATCHED} on this carrier's AGENCY_BILL policies, all entry_types)
      remittable_cents = trust_balance_cents - retained_commission_cents
      request amount_cents must satisfy 0 < amount_cents <= remittable_cents
      (ERR_REMIT_EXCEEDS_REMITTABLE)
    input_set: "Payments and entries tied to the carrier's AGENCY_BILL policies only; DIRECT_BILL money never enters trust"
    precision: "whole cents"

  - name: producer_compensation_1099
    trigger: "POST /agency/tax-forms/generate and POST /agency/tax-forms/{id}/finalize"
    algorithm: aggregation
    formula: |
      cash_basis_total_cents   = sum(ProducerPayout.amount_cents where status == PAID
                                 and paid_at in [year-01-01, (year+1)-01-01))
      accrual_basis_total_cents = sum(CommissionEntry.amount_cents where status == MATCHED
                                 and matched_at in the tax year; all entry_types including
                                 negative VARIANCE_ADJUSTMENT)
      a DRAFT TaxForm1099 is generated for a producer iff cash_basis_total_cents >= 60000
      and no TaxForm1099 (any status) already exists for (producer, tax_year)
    input_set: "Payouts and entries of the producer within the tax year window"
    constants:
      FORM_1099_THRESHOLD_CENTS: 60000   # >= triggers; 59999 does not
    precision: "whole cents"
    variants:
      - name: CASH_BASIS
        when: "regulatory 1099 reporting and generation threshold"
        difference: "Counts money actually paid in the year (PAID payouts)"
      - name: ACCRUAL_BASIS
        when: "book earnings view surfaced on the same form"
        difference: "Counts commissions matched against carrier statements in the year regardless of payment; identical producer data yields a different total"

  - name: producer_balance_recompute
    trigger: "Any mutation to CommissionEntry, ProducerPayout, or Chargeback involving the producer"
    algorithm: aggregation
    formula: |
      commission_balance_cents =
          sum(CommissionEntry.amount_cents where producer is recipient
              and status in {EXPECTED, MATCHED})
        - sum(ProducerPayout.amount_cents where status == PAID)
      pending_chargebacks_cents =
          sum(Chargeback.outstanding_cents where producer and status == PENDING)
      suspension rule: immediately after any Chargeback creation, if
        pending_chargebacks_cents > SUSPEND_THRESHOLD_CENTS and producer ACTIVE -> SUSPENDED
    input_set: "Producer's entries (all entry_types), payouts, chargebacks"
    constants:
      SUSPEND_THRESHOLD_CENTS: 500000   # strictly greater than $5,000.00 suspends
    precision: "whole cents"

  - name: delinquency_evaluation
    trigger: "POST /_clock/set_current_utc (sweep after the clock moves)"
    algorithm: threshold
    formula: |
      for each PremiumInvoice with status == OPEN and due_date < current date
        and paid_total_cents < amount_cents: -> DELINQUENT
      for each AGENCY_BILL Policy with status == ACTIVE having any DELINQUENT invoice: -> GRACE
      for each Policy with status == GRACE: let d = oldest DELINQUENT invoice.due_date;
        if current date > d + GRACE_DAYS: -> CANCELLED_NONPAY with
        cancel_effective_date = d + GRACE_DAYS, firing the cancellation cascade
      DIRECT_BILL policies never enter this sweep
    input_set: "OPEN/DELINQUENT invoices; ACTIVE/GRACE AGENCY_BILL policies"
    constants:
      GRACE_DAYS: 30
      INVOICE_DUE_DAYS: 30   # due_date = effective_date + 30 days
    precision: "calendar-day comparison on ISO dates; the due date itself is still payable (boundary: current date > due_date, not >=)"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and role is a declared role"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all endpoints"

  - priority: 2
    category: auth
    check: "Caller role is listed in the endpoint's roles"
    error_id: ERR_FORBIDDEN_FOR_ROLE
    http_status: 403
    applies_to: "all endpoints"

  - priority: 3
    category: existence
    check: "Path ids exist (validated left-to-right); body FK references (product_id, producer_id, upline_producer_id, carrier_id) exist"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all resource endpoints"

  - priority: 4
    category: state
    check: "Target resource in a state allowing the operation; OCC expected_<parent>_version matches current parent version (checked here, after existence)"
    error_id: "ERR_INVALID_STATE | ERR_STALE_VERSION"
    http_status: "409 | 412"
    applies_to: "all action endpoints; OCC per §1.2.1"

  - priority: 5
    category: business_safety
    check: "Compliance gates: policy bind requires disclosure DELIVERED/ACKNOWLEDGED (ERR_DISCLOSURE_REQUIRED); payout creation requires producer.tax_form_on_file == true (ERR_PRODUCER_TAX_HOLD)"
    error_id: "ERR_DISCLOSURE_REQUIRED | ERR_PRODUCER_TAX_HOLD"
    http_status: 409
    applies_to: "POST /agency/policies/{id}/bind; POST /agency/producers/{id}/payouts"

  - priority: 6
    category: business_temporal
    check: "Temporal window rules: bind needs an ACTIVE schedule covering effective_date (ERR_NO_EFFECTIVE_SCHEDULE); non-supersede schedule windows must not overlap same product+tier, half-open semantics (ERR_SCHEDULE_WINDOW_OVERLAP); statement periods must not overlap same carrier, closed-interval semantics (ERR_STATEMENT_PERIOD_OVERLAP)"
    error_id: "ERR_NO_EFFECTIVE_SCHEDULE | ERR_SCHEDULE_WINDOW_OVERLAP | ERR_STATEMENT_PERIOD_OVERLAP"
    http_status: 409
    applies_to: "bind; schedule create; statement create"

  - priority: 7
    category: business_referential
    check: "Cross-entity state: writing producer ACTIVE at bind (ERR_PRODUCER_NOT_ACTIVE); producer ACTIVE at payout create/mark-paid (ERR_PRODUCER_NOT_ACTIVE); chargeback write-off requires producer TERMINATED (ERR_PRODUCER_NOT_TERMINATED); producer acknowledge requires ownership (ERR_NOT_RESOURCE_OWNER, 403)"
    error_id: "ERR_PRODUCER_NOT_ACTIVE | ERR_PRODUCER_NOT_TERMINATED | ERR_NOT_RESOURCE_OWNER"
    http_status: "409 | 409 | 403"
    applies_to: "bind; payouts; write-off; acknowledge"

  - priority: 8
    category: business_constraint
    check: "Uniqueness and aggregate constraints: policy_number unique (ERR_POLICY_NUMBER_EXISTS); license_number unique (ERR_LICENSE_NUMBER_EXISTS); product_code unique per carrier (ERR_PRODUCT_CODE_EXISTS); statement close requires zero unresolved lines (ERR_UNMATCHED_STATEMENT_LINES); reactivate requires zero PENDING chargebacks (ERR_PRODUCER_STILL_SUSPENDED)"
    error_id: "ERR_POLICY_NUMBER_EXISTS | ERR_LICENSE_NUMBER_EXISTS | ERR_PRODUCT_CODE_EXISTS | ERR_UNMATCHED_STATEMENT_LINES | ERR_PRODUCER_STILL_SUSPENDED"
    http_status: 409
    applies_to: "policy create; producer create; product create; statement close; producer reactivate"

  - priority: 9
    category: business_fiscal
    check: "Money limits: payment <= invoice remainder (ERR_OVERPAYMENT); reversal needs paid_total > 0 (ERR_NOTHING_TO_REVERSE) and trust cover (ERR_TRUST_INSUFFICIENT); remit <= remittable (ERR_REMIT_EXCEEDS_REMITTABLE); recovery <= outstanding (ERR_RECOVERY_EXCEEDS_OUTSTANDING); payout requires no PENDING chargebacks (ERR_OUTSTANDING_CHARGEBACK) then amount <= balance (ERR_PAYOUT_EXCEEDS_BALANCE)"
    error_id: "ERR_OVERPAYMENT | ERR_NOTHING_TO_REVERSE | ERR_TRUST_INSUFFICIENT | ERR_REMIT_EXCEEDS_REMITTABLE | ERR_RECOVERY_EXCEEDS_OUTSTANDING | ERR_OUTSTANDING_CHARGEBACK | ERR_PAYOUT_EXCEEDS_BALANCE"
    http_status: 409
    applies_to: "payments; reverse-payments; remit; recoveries; payouts"

  - priority: 10
    category: business_constraint
    check: "Request shape: required fields present, amounts positive integers, enum values valid, cancel_effective_date >= effective_date"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all endpoints with a body"
    note: "Malformed-body checks run after role/existence/state so domain errors win over shape errors for known-bad targets; a body that cannot be parsed at all fails here."

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Clock (test-driving; logical clock) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Startup default is exactly 2026-08-01T00:00:00Z; before any set call the clock reads that default and never falls back to wall-clock. Moving the clock fires the delinquency_evaluation sweep."
    roles: [AgencyAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["delinquency_evaluation sweep: invoices -> DELINQUENT, policies ACTIVE->GRACE, GRACE->CANCELLED_NONPAY with full chargeback/suspension cascade"]

  # --- Producer ---
  - method: POST
    path: "/agency/producers"
    description: "Create a producer"
    roles: [AgencyAdmin, AgencyAccountant]
    code: 201
    input: [name, license_number, "tier?", "upline_producer_id?", "tax_form_on_file?"]
    output: Producer
    side_effects: ["status=ACTIVE; tier defaults STANDARD; tax_form_on_file defaults false"]

  - method: GET
    path: "/agency/producers"
    description: "List producers"
    roles: [AgencyAdmin, AgencyAccountant, Producer]
    code: 200
    input: ["upline_producer_id?", "status?", "tier?", "limit?", "offset?"]
    output: "Producer[]"
    side_effects: []

  - method: GET
    path: "/agency/producers/{producerId}"
    description: "Get a producer"
    roles: [AgencyAdmin, AgencyAccountant, Producer]
    code: 200
    input: []
    output: Producer
    side_effects: []

  - method: POST
    path: "/agency/producers/{producerId}/reactivate"
    description: "Reactivate a SUSPENDED producer"
    roles: [AgencyAdmin, AgencyAccountant]
    code: 200
    input: []
    output: Producer
    side_effects: ["status SUSPENDED -> ACTIVE"]

  - method: POST
    path: "/agency/producers/{producerId}/terminate"
    description: "Terminate a producer"
    roles: [AgencyAdmin]
    code: 200
    input: []
    output: Producer
    side_effects: ["status -> TERMINATED"]

  - method: POST
    path: "/agency/producers/{producerId}/payouts"
    description: "Create a payout (OCC on Producer.version)"
    roles: [AgencyAdmin, AgencyAccountant]
    code: 201
    input: [amount_cents, expected_producer_version]
    output: ProducerPayout
    side_effects:
      - "increments Producer.version by 1"
      - "validations: producer ACTIVE (state); tax_form_on_file (safety); no PENDING chargebacks (ERR_OUTSTANDING_CHARGEBACK); amount_cents <= commission_balance_cents (ERR_PAYOUT_EXCEEDS_BALANCE)"
      - "payout status=INITIATED"

  - method: GET
    path: "/agency/payouts/{payoutId}"
    description: "Get a payout"
    roles: [AgencyAdmin, AgencyAccountant, Producer]
    code: 200
    input: []
    output: ProducerPayout
    side_effects: []

  - method: GET
    path: "/agency/payouts"
    description: "List payouts"
    roles: [AgencyAdmin, AgencyAccountant, Producer]
    code: 200
    input: ["producer_id?", "status?", "limit?", "offset?"]
    output: "ProducerPayout[]"
    side_effects: []

  - method: POST
    path: "/agency/payouts/{payoutId}/mark-paid"
    description: "Mark a payout PAID"
    roles: [AgencyAdmin, AgencyAccountant]
    code: 200
    input: []
    output: ProducerPayout
    side_effects: ["status -> PAID; paid_at := clock now; Producer.commission_balance_cents -= amount_cents"]

  # --- Carrier ---
  - method: POST
    path: "/agency/carriers"
    description: "Create a carrier"
    roles: [AgencyAdmin, AgencyAccountant]
    code: 201
    input: [name, carrier_code]
    output: Carrier
    side_effects: ["trust_balance_cents=0; total_remitted_cents=0"]

  - method: GET
    path: "/agency/carriers/{carrierId}"
    description: "Get a carrier"
    roles: [AgencyAdmin, AgencyAccountant, Producer]
    code: 200
    input: []
    output: Carrier
    side_effects: []

  - method: POST
    path: "/agency/carriers/{carrierId}/remit"
    description: "Remit trust funds to the carrier"
    roles: [AgencyAdmin]
    code: 200
    input: [amount_cents]
    output: Carrier
    side_effects: ["trust_balance_cents -= amount_cents; total_remitted_cents += amount_cents; ERR_REMIT_EXCEEDS_REMITTABLE if amount > remittable"]

  # --- Product ---
  - method: POST
    path: "/agency/products"
    description: "Create a product"
    roles: [AgencyAdmin, AgencyAccountant]
    code: 201
    input: [carrier_id, product_code, name, line_of_business]
    output: Product
    side_effects: []

  - method: GET
    path: "/agency/products"
    description: "List products"
    roles: [AgencyAdmin, AgencyAccountant, Producer]
    code: 200
    input: ["carrier_id?", "limit?", "offset?"]
    output: "Product[]"
    side_effects: []

  - method: GET
    path: "/agency/products/{productId}"
    description: "Get a product"
    roles: [AgencyAdmin, AgencyAccountant, Producer]
    code: 200
    input: []
    output: Product
    side_effects: []

  # --- CommissionSchedule ---
  - method: POST
    path: "/agency/products/{id}/commission-schedules"
    description: "Create a commission schedule (OCC on Product.version). supersede_existing=true retires the current ACTIVE same-tier schedule (effective_to := new effective_from); without it, overlapping same-tier windows are rejected (half-open semantics)."
    roles: [AgencyAdmin, AgencyAccountant]
    code: 201
    input: [tier, commission_rate_bps, override_rate_bps, advance_months, effective_from, "effective_to?", "supersede_existing?", expected_product_version]
    output: CommissionSchedule
    side_effects:
      - "increments Product.version by 1"
      - "if supersede_existing: prior ACTIVE same-tier schedule -> RETIRED with effective_to := new effective_from"
      - "ERR_SCHEDULE_WINDOW_OVERLAP when not superseding and the half-open window intersects another same-tier schedule window"

  - method: GET
    path: "/agency/products/{id}/commission-schedules"
    description: "List schedules of a product"
    roles: [AgencyAdmin, AgencyAccountant, Producer]
    code: 200
    input: ["tier?", "status?", "limit?", "offset?"]
    output: "CommissionSchedule[]"
    side_effects: []

  - method: GET
    path: "/agency/commission-schedules/{scheduleId}"
    description: "Get a schedule"
    roles: [AgencyAdmin, AgencyAccountant, Producer]
    code: 200
    input: []
    output: CommissionSchedule
    side_effects: []

  # --- Policy ---
  - method: POST
    path: "/agency/policies"
    description: "Create a policy (QUOTED); auto-generates its ProducerDisclosure (GENERATED)"
    roles: [AgencyAdmin, AgencyAccountant]
    code: 201
    input: [policy_number, product_id, producer_id, insured_name, billing_type, premium_annual_cents, effective_date]
    output: Policy
    side_effects: ["ProducerDisclosure created (GENERATED) with projected_comp_cents from the covering ACTIVE schedule (0 if none)"]

  - method: GET
    path: "/agency/policies"
    description: "List policies"
    roles: [AgencyAdmin, AgencyAccountant, Producer]
    code: 200
    input: ["producer_id?", "product_id?", "status?", "billing_type?", "limit?", "offset?"]
    output: "Policy[]"
    side_effects: []

  - method: GET
    path: "/agency/policies/{policyId}"
    description: "Get a policy"
    roles: [AgencyAdmin, AgencyAccountant, Producer]
    code: 200
    input: []
    output: Policy
    side_effects: []

  - method: POST
    path: "/agency/policies/{policyId}/bind"
    description: "Bind a QUOTED policy"
    roles: [AgencyAdmin, AgencyAccountant]
    code: 200
    input: []
    output: Policy
    side_effects: ["status -> ACTIVE; BASE + OVERRIDE CommissionEntries created; AGENCY_BILL: PremiumInvoice created"]

  - method: POST
    path: "/agency/policies/{policyId}/cancel"
    description: "Voluntarily cancel an ACTIVE or GRACE policy"
    roles: [AgencyAdmin, AgencyAccountant]
    code: 200
    input: [cancel_effective_date]
    output: Policy
    side_effects: ["status -> CANCELLED_VOLUNTARY; chargeback cascade (entries CHARGED_BACK, EARNED_ADJUSTMENT entries, Chargeback PENDING, suspension check)"]

  # --- PremiumInvoice ---
  - method: GET
    path: "/agency/policies/{id}/invoices"
    description: "List invoices of a policy"
    roles: [AgencyAdmin, AgencyAccountant, Producer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "PremiumInvoice[]"
    side_effects: []

  - method: GET
    path: "/agency/premium-invoices/{invoiceId}"
    description: "Get an invoice"
    roles: [AgencyAdmin, AgencyAccountant, Producer]
    code: 200
    input: []
    output: PremiumInvoice
    side_effects: []

  - method: POST
    path: "/agency/premium-invoices/{invoiceId}/payments"
    description: "Record an insured premium payment (partial allowed)"
    roles: [AgencyAdmin, AgencyAccountant]
    code: 200
    input: [amount_cents]
    output: PremiumInvoice
    side_effects: ["paid_total_cents += amount; Carrier.trust_balance_cents += amount; -> PAID at full; may cure policy GRACE -> ACTIVE"]

  - method: POST
    path: "/agency/premium-invoices/{invoiceId}/reverse-payments"
    description: "Reverse all payments on an invoice (compensating action)"
    roles: [AgencyAdmin, AgencyAccountant]
    code: 200
    input: []
    output: PremiumInvoice
    side_effects: ["trust debited; paid_total_cents := 0; invoice returns to OPEN/DELINQUENT"]

  # --- CarrierStatement ---
  - method: POST
    path: "/agency/carrier-statements"
    description: "Import a carrier statement (closed-interval period overlap with same-carrier statements rejected)"
    roles: [AgencyAdmin, AgencyAccountant]
    code: 201
    input: [carrier_id, period_start, period_end, lines]
    output: CarrierStatement
    side_effects: ["status=RECEIVED; total_reported_cents computed; ERR_STATEMENT_PERIOD_OVERLAP on closed-interval overlap"]

  - method: GET
    path: "/agency/carrier-statements"
    description: "List statements"
    roles: [AgencyAdmin, AgencyAccountant, Producer]
    code: 200
    input: ["carrier_id?", "status?", "limit?", "offset?"]
    output: "CarrierStatement[]"
    side_effects: []

  - method: GET
    path: "/agency/carrier-statements/{statementId}"
    description: "Get a statement"
    roles: [AgencyAdmin, AgencyAccountant, Producer]
    code: 200
    input: []
    output: CarrierStatement
    side_effects: []

  - method: POST
    path: "/agency/carrier-statements/{statementId}/start-reconciliation"
    description: "Match lines against EXPECTED entries"
    roles: [AgencyAdmin, AgencyAccountant]
    code: 200
    input: []
    output: CarrierStatement
    side_effects: ["status -> RECONCILING; per-line matching per statement_reconciliation"]

  - method: POST
    path: "/agency/carrier-statements/{statementId}/dispute"
    description: "Flag the statement as disputed"
    roles: [AgencyAdmin, AgencyAccountant]
    code: 200
    input: []
    output: CarrierStatement
    side_effects: ["status RECONCILING -> DISPUTED"]

  - method: POST
    path: "/agency/carrier-statements/{statementId}/resume"
    description: "Resume reconciliation after a dispute"
    roles: [AgencyAdmin, AgencyAccountant]
    code: 200
    input: []
    output: CarrierStatement
    side_effects: ["status DISPUTED -> RECONCILING"]

  - method: POST
    path: "/agency/carrier-statements/{statementId}/close"
    description: "Close reconciliation (requires zero unresolved lines)"
    roles: [AgencyAdmin, AgencyAccountant]
    code: 200
    input: []
    output: CarrierStatement
    side_effects: ["status -> RECONCILED; totals frozen; ERR_UNMATCHED_STATEMENT_LINES otherwise"]

  - method: POST
    path: "/agency/carrier-statements/{statementId}/waive-line"
    description: "Waive an ORPHAN statement line"
    roles: [AgencyAdmin]
    code: 200
    input: [line_ref]
    output: CarrierStatement
    side_effects: ["line ORPHAN -> WAIVED"]

  # --- CommissionEntry ---
  - method: GET
    path: "/agency/commission-entries"
    description: "List commission entries"
    roles: [AgencyAdmin, AgencyAccountant, Producer]
    code: 200
    input: ["policy_id?", "producer_id?", "schedule_id?", "matched_statement_id?", "source_entry_id?", "status?", "entry_type?", "limit?", "offset?"]
    output: "CommissionEntry[]"
    side_effects: []

  - method: GET
    path: "/agency/commission-entries/{entryId}"
    description: "Get an entry"
    roles: [AgencyAdmin, AgencyAccountant, Producer]
    code: 200
    input: []
    output: CommissionEntry
    side_effects: []

  - method: POST
    path: "/agency/commission-entries/{entryId}/resolve-variance"
    description: "Accept the carrier-reported amount for a VARIANCE entry"
    roles: [AgencyAdmin, AgencyAccountant]
    code: 200
    input: [accept_amount_cents]
    output: CommissionEntry
    side_effects: ["entry VARIANCE -> MATCHED; VARIANCE_ADJUSTMENT entry created; negative adjustment creates Chargeback PENDING and may suspend the producer"]

  # --- Chargeback ---
  - method: GET
    path: "/agency/chargebacks"
    description: "List chargebacks"
    roles: [AgencyAdmin, AgencyAccountant, Producer]
    code: 200
    input: ["policy_id?", "producer_id?", "commission_entry_id?", "status?", "limit?", "offset?"]
    output: "Chargeback[]"
    side_effects: []

  - method: GET
    path: "/agency/chargebacks/{chargebackId}"
    description: "Get a chargeback"
    roles: [AgencyAdmin, AgencyAccountant, Producer]
    code: 200
    input: []
    output: Chargeback
    side_effects: []

  - method: POST
    path: "/agency/chargebacks/{chargebackId}/recoveries"
    description: "Record a recovery payment against a chargeback"
    roles: [AgencyAdmin, AgencyAccountant]
    code: 200
    input: [amount_cents]
    output: Chargeback
    side_effects: ["recovered_cents += amount; -> RECOVERED when fully recovered"]

  - method: POST
    path: "/agency/chargebacks/{chargebackId}/write-off"
    description: "Write off a chargeback (producer must be TERMINATED)"
    roles: [AgencyAdmin]
    code: 200
    input: []
    output: Chargeback
    side_effects: ["status -> WRITTEN_OFF"]

  # --- ProducerDisclosure ---
  - method: GET
    path: "/agency/producer-disclosures"
    description: "List disclosures"
    roles: [AgencyAdmin, AgencyAccountant, Producer]
    code: 200
    input: ["policy_id?", "producer_id?", "status?", "limit?", "offset?"]
    output: "ProducerDisclosure[]"
    side_effects: []

  - method: GET
    path: "/agency/producer-disclosures/{disclosureId}"
    description: "Get a disclosure"
    roles: [AgencyAdmin, AgencyAccountant, Producer]
    code: 200
    input: []
    output: ProducerDisclosure
    side_effects: []

  - method: POST
    path: "/agency/producer-disclosures/{disclosureId}/deliver"
    description: "Deliver the disclosure to the producer"
    roles: [AgencyAdmin, AgencyAccountant]
    code: 200
    input: []
    output: ProducerDisclosure
    side_effects: ["status GENERATED -> DELIVERED; disclosed_at set"]

  - method: POST
    path: "/agency/producer-disclosures/{disclosureId}/acknowledge"
    description: "Producer acknowledges their own disclosure"
    roles: [Producer]
    code: 200
    input: []
    output: ProducerDisclosure
    side_effects: ["status DELIVERED -> ACKNOWLEDGED; acknowledged_at set"]

  # --- TaxForm1099 ---
  - method: POST
    path: "/agency/tax-forms/generate"
    description: "Generate DRAFT 1099 forms for all producers whose cash-basis year total >= 60000 cents and who lack a form for that year"
    roles: [AgencyAdmin]
    code: 200
    input: [tax_year]
    output: "{ generated_count: integer, tax_form_ids: string[] }"
    side_effects: ["creates DRAFT TaxForm1099 rows (totals computed at generation)"]

  - method: GET
    path: "/agency/tax-forms"
    description: "List 1099 forms"
    roles: [AgencyAdmin, AgencyAccountant, Producer]
    code: 200
    input: ["producer_id?", "tax_year?", "status?", "limit?", "offset?"]
    output: "TaxForm1099[]"
    side_effects: []

  - method: GET
    path: "/agency/tax-forms/{formId}"
    description: "Get a 1099 form"
    roles: [AgencyAdmin, AgencyAccountant, Producer]
    code: 200
    input: []
    output: TaxForm1099
    side_effects: []

  - method: POST
    path: "/agency/tax-forms/{formId}/finalize"
    description: "Finalize a 1099 form (recompute and lock totals)"
    roles: [AgencyAdmin]
    code: 200
    input: []
    output: TaxForm1099
    side_effects: ["status -> FINALIZED; totals recomputed then locked; finalized_at set"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http: 400
    condition: "X-User-ID or X-User-Role header missing or role not a declared role"
  - id: ERR_FORBIDDEN_FOR_ROLE
    http: 403
    condition: "Role authenticated but not in the endpoint's roles"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Path id or body FK reference does not exist"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing required field, non-positive amount, invalid enum, cancel_effective_date before effective_date, malformed body"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Resource not in a state that allows the transition (incl. terminal-state lockdown, paying a PAID invoice, reversing a PAID invoice)"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_<parent>_version does not match the parent's current version (OCC, §1.2.1)"
  - id: ERR_POLICY_NUMBER_EXISTS
    http: 409
    condition: "policy_number already in use"
  - id: ERR_LICENSE_NUMBER_EXISTS
    http: 409
    condition: "license_number already in use"
  - id: ERR_PRODUCT_CODE_EXISTS
    http: 409
    condition: "product_code already in use for this carrier"
  - id: ERR_PRODUCER_NOT_ACTIVE
    http: 409
    condition: "Writing producer not ACTIVE at bind, or payout create/mark-paid for a non-ACTIVE producer"
  - id: ERR_PRODUCER_NOT_TERMINATED
    http: 409
    condition: "Chargeback write-off attempted while producer is not TERMINATED"
  - id: ERR_PRODUCER_STILL_SUSPENDED
    http: 409
    condition: "Reactivate attempted while PENDING chargebacks remain"
  - id: ERR_DISCLOSURE_REQUIRED
    http: 409
    condition: "Bind attempted while the policy's ProducerDisclosure is still GENERATED"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "Producer attempted to acknowledge a disclosure belonging to another producer"
  - id: ERR_PRODUCER_TAX_HOLD
    http: 409
    condition: "Payout creation attempted while producer.tax_form_on_file is false"
  - id: ERR_NO_EFFECTIVE_SCHEDULE
    http: 409
    condition: "No ACTIVE schedule for (product, producer.tier) covering policy.effective_date at bind"
  - id: ERR_SCHEDULE_WINDOW_OVERLAP
    http: 409
    condition: "Non-supersede schedule's half-open window [effective_from, effective_to) intersects an existing same product+tier schedule window"
  - id: ERR_STATEMENT_PERIOD_OVERLAP
    http: 409
    condition: "Statement's closed interval [period_start, period_end] intersects an existing statement of the same carrier (shared boundary date counts as overlap)"
  - id: ERR_OVERPAYMENT
    http: 409
    condition: "Payment exceeds the invoice's remaining balance"
  - id: ERR_NOTHING_TO_REVERSE
    http: 409
    condition: "reverse-payments on an invoice with paid_total_cents == 0"
  - id: ERR_TRUST_INSUFFICIENT
    http: 409
    condition: "Reversal would drive the carrier trust balance negative (funds already remitted)"
  - id: ERR_REMIT_EXCEEDS_REMITTABLE
    http: 409
    condition: "Remittance amount exceeds trust_balance minus retained commission"
  - id: ERR_UNMATCHED_STATEMENT_LINES
    http: 409
    condition: "Statement close attempted with any line not in {MATCHED, WAIVED} or any linked entry still VARIANCE"
  - id: ERR_RECOVERY_EXCEEDS_OUTSTANDING
    http: 409
    condition: "Recovery amount exceeds chargeback outstanding_cents"
  - id: ERR_OUTSTANDING_CHARGEBACK
    http: 409
    condition: "Payout creation attempted while the producer has any PENDING chargeback"
  - id: ERR_PAYOUT_EXCEEDS_BALANCE
    http: 409
    condition: "Payout amount exceeds producer.commission_balance_cents at creation or at mark-paid"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: AgencyAdmin
    description: "Agency principal / superuser: all operations plus exclusive control of terminations, write-offs, trust remittance, statement line waivers, tax-form generation/finalization, and the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /agency/producers/{id}/terminate"
      - "POST /agency/carriers/{id}/remit"
      - "POST /agency/carrier-statements/{id}/waive-line"
      - "POST /agency/chargebacks/{id}/write-off"
      - "POST /agency/tax-forms/generate"
      - "POST /agency/tax-forms/{id}/finalize"
    shared_operations:
      - "All AgencyAccountant operations"
      - "All GET endpoints"

  - name: AgencyAccountant
    description: "Agency back-office operator: producers, carriers, products, schedules, policies, premiums, statements, entries, recoveries, disclosures, payouts"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "POST /agency/producers; POST /agency/producers/{id}/reactivate; POST /agency/producers/{id}/payouts"
      - "POST /agency/carriers; POST /agency/products; POST /agency/products/{id}/commission-schedules"
      - "POST /agency/policies; POST /agency/policies/{id}/bind; POST /agency/policies/{id}/cancel"
      - "POST /agency/premium-invoices/{id}/payments; POST /agency/premium-invoices/{id}/reverse-payments"
      - "POST /agency/carrier-statements and its start-reconciliation/dispute/resume/close"
      - "POST /agency/commission-entries/{id}/resolve-variance; POST /agency/chargebacks/{id}/recoveries"
      - "POST /agency/producer-disclosures/{id}/deliver; POST /agency/payouts/{id}/mark-paid"
      - "All GET endpoints"

  - name: Producer
    description: "Licensed producer (writing agent or upline); can read and acknowledge only their own compensation disclosure"
    identity: "entity_backed:Producer"
    exclusive_operations:
      - "POST /agency/producer-disclosures/{id}/acknowledge"
    shared_operations:
      - "All GET endpoints"
