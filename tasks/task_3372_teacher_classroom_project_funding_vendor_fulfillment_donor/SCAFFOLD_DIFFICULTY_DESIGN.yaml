# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3372_teacher_classroom_project_funding_vendor_fulfillment_donor
# 9 Difficulty Rules x 2 instances = 18 instances. Every instance grounds in
# SCAFFOLD.yaml §1.1–§1.7 and is executable from empty-DB via §1.5 endpoints.
#
# Shared fixture (anchored below): logical clock 2026-09-01T00:00:00Z; school
# "Ridgeview Elementary" (TX, poverty 80.0, ell 90.0); verified teacher Ada;
# vendor SchoolMart with item SM-BOOK-1 (2500c, 10oz, zone A); project with 4
# units -> items 10000c + shipping 959c => goal_cents 10959, funding window
# 30 days (deadline 2026-10-01T00:00:00Z).
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: project_quote_provisional_moves_pinned_immune
        grounds:
          - calculations.project_cost_quote
          - entities.Project.fields.provisional_total_cents
          - entities.Project.fields.pinned_items_total_cents
          - endpoints.PATCH_/giving/vendors/{vendor_id}/catalog-items/{item_id}
        distinguishing_aspect: |
          Project-domain dual variant: the same item set yields provisional_total_cents
          that MOVES with a catalog price PATCH while the project is DRAFT (10959 ->
          12959), but once submitted the pinned face (pinned_items_total_cents=12000,
          goal_cents=12959) is IMMUNE to a further price PATCH to 4000.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z; verified teacher; vendor with item SM-BOOK-1 at 2500c; DRAFT project holding 4 units."
          setup_api_calls:
            - &dd_clock
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - &dd_school
              call: "POST /giving/schools"
              payload: { name: "Ridgeview Elementary", state_code: "TX", district: "Ridgeview ISD", poverty_pct: 80.0, ell_pct: 90.0 }
              as: PlatformAdmin
              captures: { s1: $.data.id }
            - &dd_teacher
              call: "POST /giving/teachers"
              payload: { full_name: "Ada Lovelace", email: "ada@example.org", school_id: "${s1}", subjects_taught: ["LITERACY"] }
              as: Anonymous
              captures: { t1: $.data.id }
            - &dd_verify
              call: "POST /giving/teachers/${t1}/employment-review"
              payload: { action: "VERIFY" }
              as: PlatformAdmin
            - &dd_vendor
              call: "POST /giving/vendors"
              payload: { name: "SchoolMart", ship_from_state: "TX", contact_email: "ops@schoolmart.example" }
              as: PlatformAdmin
              captures: { v1: $.data.id }
            - &dd_item
              call: "POST /giving/vendors/${v1}/catalog-items"
              payload: { sku: "SM-BOOK-1", name: "Leveled Readers Set", category: "BOOKS", subject_tags: ["LITERACY"], unit_price_cents: 2500, weight_oz: 10, shipping_zone: "A" }
              as: PlatformAdmin
              captures: { i1: $.data.id }
            - &dd_project
              call: "POST /giving/projects"
              payload: { title: "Books for Budding Readers", description: "Classroom library for grade 3-5 readers.", subject: "LITERACY", grade_band: "G3_5", funding_window_days: 30 }
              as: Teacher
              as_user_id: "${t1}"
              captures: { p1: $.data.id, p_v: $.data.version }
            - &dd_add
              call: "POST /giving/projects/${p1}/items"
              payload: { catalog_item_id: "${i1}", quantity: 4, expected_project_version: "${p_v}" }
              as: Teacher
              as_user_id: "${t1}"
            - call: "GET /giving/projects/${p1}"
              payload: {}
              as: Teacher
              as_user_id: "${t1}"
              captures: { prov_before: $.data.provisional_total_cents, p_v2: $.data.version }
            - &dd_patch3000
              call: "PATCH /giving/vendors/${v1}/catalog-items/${i1}"
              payload: { unit_price_cents: 3000 }
              as: PlatformAdmin
            - call: "GET /giving/projects/${p1}"
              payload: {}
              as: Teacher
              as_user_id: "${t1}"
              captures: { prov_after: $.data.provisional_total_cents }
          trigger:
            - call: "POST /giving/projects/${p1}/submit"
              payload: { expected_project_version: "${p_v2}" }
              as: Teacher
              as_user_id: "${t1}"
            - call: "PATCH /giving/vendors/${v1}/catalog-items/${i1}"
              payload: { unit_price_cents: 4000 }
              as: PlatformAdmin
            - call: "GET /giving/projects/${p1}"
              payload: {}
              as: Teacher
              as_user_id: "${t1}"
          assert:
            - "prov_before == 10959 (4 x 2500 + shipping 959 at current prices)"
            - "prov_after == 12959 (the 3000c PATCH moved the DRAFT provisional quote)"
            - "Project.${p1}.status == IN_REVIEW and provisional_total_cents is null after submit"
            - "Project.${p1}.pinned_items_total_cents == 12000 (4 x 3000 pinned at submit)"
            - "Project.${p1}.goal_cents == 12959 even after the post-submit PATCH to 4000c"
            - "Project.${p1}.pinned_shipping_total_cents == 959"

      - name: equity_scores_banded_vs_weighted_ranking_inversion
        grounds:
          - calculations.school_equity_scores
          - entities.School.fields.equity_score_banded
          - entities.School.fields.equity_score_weighted
          - calculations.equity_allocation_selector
        distinguishing_aspect: |
          School-domain dual variant (different entity domain than the Project quote
          instance): school S1 (poverty 80.0, ell 90.0) scores banded=80, weighted=83.0;
          school S2 (poverty 92.0, ell 10.0) scores banded=100, weighted=67.4. Banded
          ranks S2 first, weighted ranks S1 first — the allocation selector follows
          WEIGHTED, so S1's project wins despite S2's higher poverty and banded score.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z; two TX schools S1/S2; two verified teachers each with a FUNDING project (same goal fixture 10959); equity fund TX, min_poverty_pct 75.0, no subject restriction, window [2026-09-01, 2026-12-31]."
          setup_api_calls:
            - *dd_clock
            - call: "POST /giving/schools"
              payload: { name: "Ridgeview Elementary", state_code: "TX", district: "Ridgeview ISD", poverty_pct: 80.0, ell_pct: 90.0 }
              as: PlatformAdmin
              captures: { s1: $.data.id }
            - call: "POST /giving/schools"
              payload: { name: "Cactus Middle", state_code: "TX", district: "Cactus ISD", poverty_pct: 92.0, ell_pct: 10.0 }
              as: PlatformAdmin
              captures: { s2: $.data.id }
            - *dd_vendor
            - *dd_item
            - call: "POST /giving/teachers"
              payload: { full_name: "Ada Lovelace", email: "ada@example.org", school_id: "${s1}", subjects_taught: ["LITERACY"] }
              as: Anonymous
              captures: { t1: $.data.id }
            - call: "POST /giving/teachers/${t1}/employment-review"
              payload: { action: "VERIFY" }
              as: PlatformAdmin
            - call: "POST /giving/projects"
              payload: { title: "Books for Budding Readers", description: "Classroom library for grade 3-5 readers.", subject: "LITERACY", grade_band: "G3_5", funding_window_days: 30 }
              as: Teacher
              as_user_id: "${t1}"
              captures: { p1: $.data.id, p1_v: $.data.version }
            - call: "POST /giving/projects/${p1}/items"
              payload: { catalog_item_id: "${i1}", quantity: 4, expected_project_version: "${p1_v}" }
              as: Teacher
              as_user_id: "${t1}"
            - call: "GET /giving/projects/${p1}"
              payload: {}
              as: Teacher
              as_user_id: "${t1}"
              captures: { p1_v2: $.data.version }
            - call: "POST /giving/projects/${p1}/submit"
              payload: { expected_project_version: "${p1_v2}" }
              as: Teacher
              as_user_id: "${t1}"
            - call: "POST /giving/projects/${p1}/review"
              payload: { stage: "SCREEN", outcome: "APPROVE" }
              as: Reviewer
              as_user_id: "rev-ana"
            - call: "POST /giving/projects/${p1}/review"
              payload: { stage: "VET", outcome: "APPROVE" }
              as: Reviewer
              as_user_id: "rev-ben"
            - call: "POST /giving/teachers"
              payload: { full_name: "Alan Turing", email: "alan@example.org", school_id: "${s2}", subjects_taught: ["LITERACY"] }
              as: Anonymous
              captures: { t2: $.data.id }
            - call: "POST /giving/teachers/${t2}/employment-review"
              payload: { action: "VERIFY" }
              as: PlatformAdmin
            - call: "POST /giving/projects"
              payload: { title: "Reading Nook Revival", description: "Fresh books for the middle-school nook.", subject: "LITERACY", grade_band: "G6_8", funding_window_days: 30 }
              as: Teacher
              as_user_id: "${t2}"
              captures: { p2: $.data.id, p2_v: $.data.version }
            - call: "POST /giving/projects/${p2}/items"
              payload: { catalog_item_id: "${i1}", quantity: 4, expected_project_version: "${p2_v}" }
              as: Teacher
              as_user_id: "${t2}"
            - call: "GET /giving/projects/${p2}"
              payload: {}
              as: Teacher
              as_user_id: "${t2}"
              captures: { p2_v2: $.data.version }
            - call: "POST /giving/projects/${p2}/submit"
              payload: { expected_project_version: "${p2_v2}" }
              as: Teacher
              as_user_id: "${t2}"
            - call: "POST /giving/projects/${p2}/review"
              payload: { stage: "SCREEN", outcome: "APPROVE" }
              as: Reviewer
              as_user_id: "rev-ana"
            - call: "POST /giving/projects/${p2}/review"
              payload: { stage: "VET", outcome: "APPROVE" }
              as: Reviewer
              as_user_id: "rev-ben"
            - call: "POST /giving/equity-funds"
              payload: { name: "Lone Star Equity Fund", state_code: "TX", min_poverty_pct: 75.0, budget_cents: 500000, window_start: "2026-09-01T00:00:00Z", window_end: "2026-12-31T00:00:00Z" }
              as: PlatformAdmin
              captures: { f1: $.data.id }
          trigger:
            - call: "POST /giving/equity-funds/${f1}/allocate"
              payload: {}
              as: PlatformAdmin
              captures: { grant_project: $.data.project_id, grant_amount: $.data.amount_cents }
            - call: "GET /giving/schools/${s1}"
              payload: {}
              as: PlatformAdmin
              captures: { s1_banded: $.data.equity_score_banded, s1_weighted: $.data.equity_score_weighted }
            - call: "GET /giving/schools/${s2}"
              payload: {}
              as: PlatformAdmin
              captures: { s2_banded: $.data.equity_score_banded, s2_weighted: $.data.equity_score_weighted }
          assert:
            - "s1_banded == 80 and s1_weighted == 83.0 (same inputs, two variants, different numbers)"
            - "s2_banded == 100 and s2_weighted == 67.4"
            - "grant_project == ${p1} — the selector followed equity_score_weighted DESC (83.0 > 67.4), NOT banded (which ranks S2's 100 first)"
            - "grant_amount == 10959 == min(Project.${p1} remaining need, fund remaining 500000)"
            - "Project.${p1}.status == FUNDED (grant tipped it) and Project.${p2}.status == FUNDING"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: po_shipping_nested_clamp_fragile_zone
        grounds:
          - calculations.po_shipping_quote
          - calculations.po_issuance
          - entities.PurchaseOrder.fields.shipping_fee_cents
        distinguishing_aspect: |
          Combinatorial mode (a): >=3 inputs with non-linear interaction — weight
          tier selection (240oz -> TIER3 899), per-pound zone rate via MAX over
          lines (zone B 180 over A 120), conditional fragile flat (+350), then a
          nested min(4999, max(199, raw)) clamp. Fixture computes exactly 3949;
          a tier/rate/fragile/clamp error in any term changes the cents.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z; verified teacher; one vendor with two items: SM-BOOK-1 (2500c, 10oz, zone A) and SM-LAB-1 (800c, 200oz, zone B, fragile); project holds 4x SM-BOOK-1 and 1x SM-LAB-1 and is FUNDING with goal 14749 (10800 + 3949 shipping)."
          setup_api_calls:
            - *dd_clock
            - *dd_school
            - *dd_teacher
            - *dd_verify
            - *dd_vendor
            - *dd_item
            - call: "POST /giving/vendors/${v1}/catalog-items"
              payload: { sku: "SM-LAB-1", name: "Glass Beaker Set", category: "LAB_EQUIPMENT", subject_tags: ["SCIENCE"], unit_price_cents: 800, weight_oz: 200, shipping_zone: "B", fragile: true }
              as: PlatformAdmin
              captures: { i2: $.data.id }
            - *dd_project
            - *dd_add
            - call: "GET /giving/projects/${p1}"
              payload: {}
              as: Teacher
              as_user_id: "${t1}"
              captures: { p_v2: $.data.version }
            - call: "POST /giving/projects/${p1}/items"
              payload: { catalog_item_id: "${i2}", quantity: 1, expected_project_version: "${p_v2}" }
              as: Teacher
              as_user_id: "${t1}"
            - call: "GET /giving/projects/${p1}"
              payload: {}
              as: Teacher
              as_user_id: "${t1}"
              captures: { p_v3: $.data.version }
            - call: "POST /giving/projects/${p1}/submit"
              payload: { expected_project_version: "${p_v3}" }
              as: Teacher
              as_user_id: "${t1}"
            - call: "POST /giving/projects/${p1}/review"
              payload: { stage: "SCREEN", outcome: "APPROVE" }
              as: Reviewer
              as_user_id: "rev-ana"
            - call: "POST /giving/projects/${p1}/review"
              payload: { stage: "VET", outcome: "APPROVE" }
              as: Reviewer
              as_user_id: "rev-ben"
            - call: "POST /giving/donors"
              payload: { display_name: "Dana", email: "dana@example.org" }
              as: Anonymous
              captures: { d1: $.data.id }
            - call: "POST /giving/projects/${p1}/donations"
              payload: { amount_cents: 14749 }
              as: Donor
              as_user_id: "${d1}"
          trigger:
            - call: "GET /giving/purchase-orders"
              payload: { project_id: "${p1}" }
              as: PlatformAdmin
              captures: { po_fee: "$.data[0].shipping_fee_cents", po_lines: "$.data[0].line_total_cents" }
            - call: "GET /giving/projects/${p1}"
              payload: {}
              as: PlatformAdmin
          assert:
            - "Project.${p1}.status == FUNDED and goal_cents == 14749"
            - "exactly one PurchaseOrder exists for the project (single vendor)"
            - "po_lines == 10800 (4 x 2500 + 1 x 800, pinned prices)"
            - "po_fee == 3949 — tier3 base 899 (240oz > 128) + ceil(240/16)=15 lbs x max-zone rate 180 + fragile flat 350, inside [199, 4999] clamp"
            - "Project.${p1}.pinned_shipping_total_cents == 3949"

      - name: match_rounded_per_donation_not_per_sum
        grounds:
          - calculations.match_allocation
          - entities.Donation.fields.matched_cents
          - entities.MatchCampaign.fields.matched_so_far_cents
        distinguishing_aspect: |
          Combinatorial mode (b) — different mode than the clamp formula: nested
          rounding where the ORDER is pinned. Two 101-cent donations at ratio 0.5
          must round per donation THEN sum: round_half_up(50.5)=51 twice, so
          matched_so_far_cents == 102. The forbidden sum-then-round order would
          give round_half_up(202 x 0.5) == 101.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z; FUNDING project (goal 10959); ACTIVE match campaign ratio 0.5, budget 100000, min 0, target STATE TX, window [2026-09-01, 2026-12-01)."
          setup_api_calls:
            - *dd_clock
            - *dd_school
            - *dd_teacher
            - *dd_verify
            - *dd_vendor
            - *dd_item
            - *dd_project
            - *dd_add
            - call: "GET /giving/projects/${p1}"
              payload: {}
              as: Teacher
              as_user_id: "${t1}"
              captures: { p_v2: $.data.version }
            - call: "POST /giving/projects/${p1}/submit"
              payload: { expected_project_version: "${p_v2}" }
              as: Teacher
              as_user_id: "${t1}"
            - call: "POST /giving/projects/${p1}/review"
              payload: { stage: "SCREEN", outcome: "APPROVE" }
              as: Reviewer
              as_user_id: "rev-ana"
            - call: "POST /giving/projects/${p1}/review"
              payload: { stage: "VET", outcome: "APPROVE" }
              as: Reviewer
              as_user_id: "rev-ben"
            - call: "POST /giving/match-campaigns"
              payload: { sponsor_name: "Acme Foundation", match_ratio: 0.5, budget_cents: 100000, target_type: "STATE", target_value: "TX", starts_at: "2026-09-01T00:00:00Z", ends_at: "2026-12-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { mc1: $.data.id }
            - call: "POST /giving/donors"
              payload: { display_name: "Dana", email: "dana@example.org" }
              as: Anonymous
              captures: { d1: $.data.id }
          trigger:
            - call: "POST /giving/projects/${p1}/donations"
              payload: { amount_cents: 101, match_campaign_id: "${mc1}" }
              as: Donor
              as_user_id: "${d1}"
              captures: { dn1: $.data.id, m1: $.data.matched_cents }
            - call: "POST /giving/projects/${p1}/donations"
              payload: { amount_cents: 101, match_campaign_id: "${mc1}" }
              as: Donor
              as_user_id: "${d1}"
              captures: { dn2: $.data.id, m2: $.data.matched_cents }
            - call: "GET /giving/match-campaigns/${mc1}"
              payload: {}
              as: PlatformAdmin
              captures: { so_far: $.data.matched_so_far_cents, remaining: $.data.remaining_budget_cents }
          assert:
            - "m1 == 51 and m2 == 51 (each donation rounded independently: round_half_up(101 x 0.5) = round_half_up(50.5) = 51)"
            - "so_far == 102 — per-donation-then-sum; sum-then-round would give 101"
            - "remaining == 99898"
            - "Project.${p1}.funded_cents == 304 (101+51 twice)"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: project_revision_cycle_returns_to_review
        grounds:
          - state_machines.Project.IN_REVIEW_to_RETURNED
          - state_machines.Project.RETURNED_to_IN_REVIEW
          - state_machines.Project.VETTING_to_RETURNED
        distinguishing_aspect: |
          Cyclic machine on Project: the draft-review loop runs IN_REVIEW ->
          RETURNED -> IN_REVIEW -> VETTING -> RETURNED -> IN_REVIEW -> VETTING ->
          FUNDING; each resubmit re-pins prices, clears the reviewer attribution,
          and the cycle terminates only when both stages approve in order.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z; verified teacher; vendor with item; DRAFT project with 4 units (goal fixture 10959, window 30 days)."
          setup_api_calls:
            - *dd_clock
            - *dd_school
            - *dd_teacher
            - *dd_verify
            - *dd_vendor
            - *dd_item
            - *dd_project
            - *dd_add
            - call: "GET /giving/projects/${p1}"
              payload: {}
              as: Teacher
              as_user_id: "${t1}"
              captures: { p_v2: $.data.version }
            - call: "POST /giving/projects/${p1}/submit"
              payload: { expected_project_version: "${p_v2}" }
              as: Teacher
              as_user_id: "${t1}"
            - call: "POST /giving/projects/${p1}/review"
              payload: { stage: "SCREEN", outcome: "RETURN" }
              as: Reviewer
              as_user_id: "rev-ana"
              captures: { st1: $.data.status }
            - call: "GET /giving/projects/${p1}"
              payload: {}
              as: Teacher
              as_user_id: "${t1}"
              captures: { p_v3: $.data.version }
            - call: "POST /giving/projects/${p1}/submit"
              payload: { expected_project_version: "${p_v3}" }
              as: Teacher
              as_user_id: "${t1}"
              captures: { st2: $.data.status }
            - call: "POST /giving/projects/${p1}/review"
              payload: { stage: "SCREEN", outcome: "APPROVE" }
              as: Reviewer
              as_user_id: "rev-ana"
              captures: { st3: $.data.status }
            - call: "POST /giving/projects/${p1}/review"
              payload: { stage: "VET", outcome: "RETURN" }
              as: Reviewer
              as_user_id: "rev-ben"
              captures: { st4: $.data.status }
            - call: "GET /giving/projects/${p1}"
              payload: {}
              as: Teacher
              as_user_id: "${t1}"
              captures: { p_v4: $.data.version }
            - call: "POST /giving/projects/${p1}/submit"
              payload: { expected_project_version: "${p_v4}" }
              as: Teacher
              as_user_id: "${t1}"
            - call: "POST /giving/projects/${p1}/review"
              payload: { stage: "SCREEN", outcome: "APPROVE" }
              as: Reviewer
              as_user_id: "rev-ana"
          trigger:
            - call: "POST /giving/projects/${p1}/review"
              payload: { stage: "VET", outcome: "APPROVE" }
              as: Reviewer
              as_user_id: "rev-ben"
              captures: { st5: $.data.status, deadline: $.data.funding_deadline, sb: $.data.screened_by_id, vb: $.data.vetted_by_id }
          assert:
            - "st1 == RETURNED and st2 == IN_REVIEW (first cycle)"
            - "st3 == VETTING and st4 == RETURNED (return from vetting loops back)"
            - "st5 == FUNDING after the second pass through both stages"
            - "sb == \"rev-ana\" and vb == \"rev-ben\" (re-recorded on the final pass)"
            - "deadline == \"2026-10-01T00:00:00Z\" (funding_started_at 2026-09-01T00:00:00Z + 30 days)"

      - name: donation_choice_fork_divergent_side_effects
        grounds:
          - state_machines.Donation.CHOICE_PENDING_to_REFUNDED
          - state_machines.Donation.CHOICE_PENDING_to_REALLOCATED
          - entities.Donation.fields.refund_reason
        distinguishing_aspect: |
          Branching fork on Donation (different entity than the Project cycle):
          from CHOICE_PENDING, REFUND credits donor.lifetime_refunded_cents while
          REALLOCATE credits donor.lifetime_reallocated_cents AND the target equity
          fund's remaining_cents — same source state, divergent side-effect sets.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z; FUNDING project (goal 10959) with two 4000c donations from donor Dana (funded 8000 < goal); clock advanced to 2026-10-01T00:00:00Z and swept, so the project is EXPIRED and both donations CHOICE_PENDING with choice_deadline 2026-10-15T00:00:00Z; ACTIVE TX equity fund (window [2026-09-01, 2026-12-31], budget 50000)."
          setup_api_calls:
            - *dd_clock
            - *dd_school
            - *dd_teacher
            - *dd_verify
            - *dd_vendor
            - *dd_item
            - *dd_project
            - *dd_add
            - call: "GET /giving/projects/${p1}"
              payload: {}
              as: Teacher
              as_user_id: "${t1}"
              captures: { p_v2: $.data.version }
            - call: "POST /giving/projects/${p1}/submit"
              payload: { expected_project_version: "${p_v2}" }
              as: Teacher
              as_user_id: "${t1}"
            - call: "POST /giving/projects/${p1}/review"
              payload: { stage: "SCREEN", outcome: "APPROVE" }
              as: Reviewer
              as_user_id: "rev-ana"
            - call: "POST /giving/projects/${p1}/review"
              payload: { stage: "VET", outcome: "APPROVE" }
              as: Reviewer
              as_user_id: "rev-ben"
            - call: "POST /giving/donors"
              payload: { display_name: "Dana", email: "dana@example.org" }
              as: Anonymous
              captures: { d1: $.data.id }
            - call: "POST /giving/projects/${p1}/donations"
              payload: { amount_cents: 4000 }
              as: Donor
