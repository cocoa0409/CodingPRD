  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: deposit_floor_inclusive_boundary
        grounds:
          - state_machines.Condemnation.FILED_to_DEPOSIT_MADE
          - validations[priority=12]
          - entities.Condemnation.fields.just_compensation_snapshot_cents
        distinguishing_aspect: |
          The deposit floor is inclusive (>=): a deposit of exactly 28,000,000 == just_compensation_snapshot_cents is accepted
          (status -> DEPOSIT_MADE), whereas 27,999,999 (one cent below) would be rejected with ERR_DEPOSIT_BELOW_COMPENSATION.
