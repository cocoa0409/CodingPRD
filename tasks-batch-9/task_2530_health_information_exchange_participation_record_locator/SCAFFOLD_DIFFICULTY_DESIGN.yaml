              payload: { profile: "ADT_PUBLISHER", scheduled_start: "2026-08-01T00:00:00Z", scheduled_end: "2026-08-01T06:00:00Z" }
              as: HieAdmin
              captures: { ctN4_id: $.data.id, ctN4_attempt: $.data.attempt_number }
            - call: "POST /hie/conformance-tests/${ctN4_id}/results"
