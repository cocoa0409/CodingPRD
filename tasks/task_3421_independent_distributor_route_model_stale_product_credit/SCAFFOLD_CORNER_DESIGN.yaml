            - "StaleReturnClaim.${claim_w1_id}.status == APPROVED and issued_credit_cents is null"
            - "Distributor.${dist_id}.trade_balance_cents == 1280 (delivery charge unchanged)"

      - name: distributor_b_cannot_read_distributor_a_orders
        claim_type: RBAC Denial (ownership scope)
        grounds:
          - roles.Distributor
          - validations[priority=3]
          - errors.ERR_NOT_RESOURCE_OWNER
        distinguishing_aspect: "entity_backed identity: Distributor role with X-User-ID of distributor B listing distributor A's orders gets 403 ERR_NOT_RESOURCE_OWNER even though the endpoint allows the Distributor role generally."
