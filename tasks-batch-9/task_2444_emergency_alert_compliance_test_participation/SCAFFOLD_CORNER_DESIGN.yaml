          - "§1.2 state_machines.FilingRecord initial_state SUBMITTED, terminal_states [REVERSED], transitions SUBMITTED -> ACCEPTED, SUBMITTED -> REVERSED and ACCEPTED -> REVERSED"
          - "§1.5 POST /filing-records/{id}/accept input [] and POST /filing-records/{id}/reverse input [reversal_reason], both [ComplianceAdmin]"
        distinguishing_aspect: "ACCEPTED is a one-way door for accept but not for reverse: the second accept is ERR_FILING_NOT_SUBMITTED while reverse still succeeds from ACCEPTED, and only after REVERSED (the sole terminal state) does reverse itself become ERR_FILING_NOT_REVERSIBLE."
