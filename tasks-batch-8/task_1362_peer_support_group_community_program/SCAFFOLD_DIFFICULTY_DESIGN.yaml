            - call: "POST /facilitators/${rev}/training-completions"
              payload: { course_id: "${tc2}", completed_at: "2026-07-01T00:00:00Z", score: 95 }
              as: ProgramAdmin
            - call: "POST /facilitators/${rev}/advance-to-practice"
              payload: {}
              as: ProgramAdmin
            - call: "POST /facilitators/${rev}/certify"
              payload: {}
              as: ProgramAdmin
            - call: "POST /facilitators/${fid}/supervision-reviews"
              payload: { reviewer_id: "${rev}", occurred_at: "2026-07-15T00:00:00Z", rating: 4 }
              as: ProgramAdmin
            - call: "POST /facilitators/${fid}/certify"
              payload: {}
              as: ProgramAdmin
            # F: training_points=1 (level_weight=1 course), supervision_bonus=0 (only 1 rating>=4 review, //2 = 0)
            # level = min(5, max(1, 1+1+0)) = 2 — below required 3
            - call: "POST /programs/${pid}/groups/${gid}/sessions"
              payload: { start_at: "2026-08-03T10:00:00Z", end_at: "2026-08-03T11:00:00Z", primary_facilitator_id: "${fid}" }
              as: ProgramAdmin
              captures: { sid: $.data.id }
            - call: "GET /facilitators/${fid}"
              payload: {}
