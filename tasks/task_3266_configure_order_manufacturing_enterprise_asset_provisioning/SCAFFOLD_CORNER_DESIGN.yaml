            - { call: "POST /api/orders/${vv4_o}/lines", payload: { configuration_id: "${vv4_cf}", qty: 1, ship_to_mode: "SINGLE_ADDRESS" }, as: CustomerUser, as_user_id: "${vv4_a}" }
