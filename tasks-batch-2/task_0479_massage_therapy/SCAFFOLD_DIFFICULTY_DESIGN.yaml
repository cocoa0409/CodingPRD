          - entities.Client.fields.no_show_strikes
        distinguishing_aspect: |
          Conserved quantity = Client.no_show_strikes (a strike count). The forward action (no-show, +1)
          paired with its compensating action (waive-no-show, -1) MUST leave Client.no_show_strikes
          unchanged at its pre-no-show value (0), and no_show_fee_cents back to 0.
