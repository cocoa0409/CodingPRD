              as: NamedUser
              as_user_id: "${carol_id}"
              captures: { citem: $.data.id, citem_v: $.data.version }
            - call: "POST /geo-orgs/content-items/${citem}/transition"
              payload: { target_status: "PUBLISHED" }
              as: NamedUser
              as_user_id: "${carol_id}"
            - call: "POST /geo-orgs/content-items/${citem}/share"
