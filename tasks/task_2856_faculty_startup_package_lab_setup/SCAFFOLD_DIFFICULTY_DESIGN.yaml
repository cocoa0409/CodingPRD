          [available_on, expires_on) of the waterfall candidate set, probed at the exact closing
          instant. Activating one appointment at 2027-06-30T23:59:59Z - the last instant inside the
          window - must succeed, and activating a second appointment at exactly
          2027-07-01T00:00:00Z, the tranche's expires_on, must fail with the empty-candidate-set
