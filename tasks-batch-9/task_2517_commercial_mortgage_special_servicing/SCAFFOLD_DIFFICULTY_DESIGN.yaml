            - call: "POST /special-servicing/transfer-events"
              payload: { loan_id: "${loan_id}", event_code: "RECEIVERSHIP", occurred_on: "2026-07-10T00:00:00Z", evidence_note: "receiver appointed over the property" }
              as: MasterServicer
              as_user_id: "ms-001"
            - call: "POST /special-servicing/loans/${loan_id}/servicing-status"
              payload: { to_status: "SPECIAL_SERVICING" }
              as: MasterServicer
              as_user_id: "ms-001"
            - call: "POST /special-servicing/borrower-requests"
              payload: { loan_id: "${loan_id}", request_type: "ASSUMPTION", processing_fee_deposit_usd: 15000, requested_terms_note: "assumption by affiliate purchaser", assumption_buyer_name: "Northgate Holdings LLC" }
              as: Borrower
              as_user_id: "${loan_id}"
              captures: { req_id: "$.data.id" }
            - call: "POST /special-servicing/borrower-requests/${req_id}/status"
              payload: { to_status: "UNDER_ANALYSIS" }
              as: SpecialServicerAssetManager
              as_user_id: "amgr-001"
            - call: "POST /special-servicing/borrower-requests/${req_id}/analysis"
              payload: { npv_recovery_with_request_usd: 21597500, npv_recovery_without_request_usd: 21500000, analysis_discount_rate_pct: 9.5 }
              as: SpecialServicerAssetManager
              as_user_id: "amgr-001"
              captures: { lap1_conclusion: "$.data.servicing_standard_conclusion" }
            - call: "POST /special-servicing/borrower-requests/${req_id}/status"
              payload: { to_status: "INFO_REQUESTED" }
              as: SpecialServicerAssetManager
              as_user_id: "amgr-001"
              captures: { count_after_lap1: "$.data.info_request_count", conclusion_after_lap1: "$.data.servicing_standard_conclusion" }
            - call: "POST /special-servicing/borrower-requests/${req_id}/status"
              payload: { to_status: "UNDER_ANALYSIS" }
              as: SpecialServicerAssetManager
              as_user_id: "amgr-001"
            - call: "POST /special-servicing/borrower-requests/${req_id}/status"
              payload: { to_status: "INFO_REQUESTED" }
              as: SpecialServicerAssetManager
              as_user_id: "amgr-001"
              captures: { count_after_lap2: "$.data.info_request_count" }
            - call: "POST /special-servicing/borrower-requests/${req_id}/status"
              payload: { to_status: "UNDER_ANALYSIS" }
              as: SpecialServicerAssetManager
              as_user_id: "amgr-001"
          trigger:
            - call: "POST /special-servicing/borrower-requests/${req_id}/status"
              payload: { to_status: "INFO_REQUESTED" }
              as: SpecialServicerAssetManager
              as_user_id: "amgr-001"
              captures: { error_id: "$.data.error_id" }
          assert:
            - "Lap one recorded servicing_standard_conclusion SERVICING_STANDARD_MET with margin 97500.00"
            - "After the first INFO_REQUESTED, info_request_count == 1 and servicing_standard_conclusion is null and servicing_standard_margin_usd is null"
            - "After the second INFO_REQUESTED, info_request_count == 2 and the request is back in UNDER_ANALYSIS after re-entry"
            - "The third INFO_REQUESTED returns HTTP 422 with error_id ERR_INFO_REQUEST_LIMIT_EXCEEDED"
            - "BorrowerRequest.${req_id}.status remains UNDER_ANALYSIS and info_request_count remains 2 — the refused lap left no trace"

      - name: workout_plan_objection_revision_cycle_capped_at_three_rounds
        grounds:
          - state_machines.WorkoutPlan.CONSULTATION_to_OBJECTED
          - state_machines.WorkoutPlan.OBJECTED_to_DRAFT
          - state_machines.WorkoutAlternative.SCORED_to_PROPOSED
          - entities.WorkoutPlan.fields.revision_round
          - validations[priority=22]
          - errors.ERR_REVISION_LIMIT_EXCEEDED
        distinguishing_aspect: |
          The plan machine contains a four-node cycle (DRAFT -> SCORED -> RECOMMENDED -> CONSULTATION
          -> OBJECTED -> DRAFT) that resets its own scoring artefacts on every lap — alternatives fall
          back from SCORED/SELECTED/DISCARDED to PROPOSED with rank, npv_usd and discounted_pv_usd
          nulled — while revision_round monotonically climbs. Three laps are permitted; the fourth
          OBJECTED -> DRAFT is refused with ERR_REVISION_LIMIT_EXCEEDED (422), leaving the plan
          stranded in OBJECTED with no path back to DRAFT.
