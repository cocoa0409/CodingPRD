        excluded_because:
          difficulty_instance: boundary_precision_check / holding_time_exactly_at_limit_is_compliant_one_second_past_is_not
          rationale: "That §1.8 instance asserts both sides of the 336.00-hour holding-time boundary, including the INVALIDATED flip one second past."

