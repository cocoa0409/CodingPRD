              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { pm: $.data.id }
            - call: "POST /molds"
              payload: { mold_code: "MLD-X9C-3", product_model_id: "${pm}", size_class: "MID", cavity_count: 3, nominal_charge_kg: 24.000, service_interval_cycles: 10 }
