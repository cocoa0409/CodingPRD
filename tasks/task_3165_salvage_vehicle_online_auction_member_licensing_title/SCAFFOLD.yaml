# =============================================================================
# PRD Benchmark Seed Tables — task_3165
# Salvage Vehicle Online Auction, Member Licensing & Title Processing
# =============================================================================

scenario: |
  Salvage Vehicle Online Auction, Member Licensing & Title Processing (Copart): vehicle assignment from insurers with pickup, storage and title acquisition timelines, condition documentation with imaging, damage coding and run-and-drive verification, buyer registration tiers where certain vehicles require a dealer or dismantler license by state, online bidding with preliminary bids, live auction sequencing and reserve handling, gate pass and load-out scheduling with storage fees after a free period, title transfer including branded, salvage and non-repairable designations by jurisdiction, seller settlement with fee schedules and net proceeds, export documentation for international buyers

domain_name: salvage-vehicle-auction
api_prefix: /salvage-auction

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: quota_allocation
  complexity_layers:
    - rate_threshold_triggers
    - cascading_side_effects
    - optimistic_concurrency
    - dual_variant_calculation
  entity_topology: flat
  state_machine_shape: parallel
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: peer_roles
  consistency_model: immediate

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Yard
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Yard display name" }
      - { name: state_code, type: string, source: input, description: "Two-letter US state where the yard physically sits; drives jurisdiction rules" }
      - { name: daily_storage_rate_cents, type: integer, source: input, description: "Per-calendar-day storage fee charged to the WINNER after the free period; must be > 0" }
      - { name: free_storage_days, type: integer, source: input, description: "Whole calendar days after the sale day during which load-out is free; must be >= 0" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | CLOSED; CLOSED yards reject new assignments and new slot bookings" }

  - name: Seller
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Insurer / seller organization name" }
      - { name: seller_type, type: enum, source: input, description: "INSURER | DEALER | FLEET" }
      - { name: fee_schedule, type: enum, source: input, description: "STANDARD | VOLUME; selects the seller settlement fee schedule" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | SUSPENDED; SUSPENDED sellers cannot receive new vehicle assignments" }

  - name: Member
    parent: null
    common_fields: true
    fields:
      - { name: email, type: string, source: input, description: "Login email; unique per Member" }
      - { name: full_name, type: string, source: input, description: "Member legal name" }
      - { name: home_state, type: string, source: input, description: "Two-letter US state of residence/business" }
      - { name: tier, type: enum, source: input, description: "BASIC | PREMIER | BUSINESS; base buying tier before license upgrades" }
      - { name: country_code, type: string, source: input, default: "US", description: "ISO country; non-US members are exporters and require an ExportDocument per vehicle" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | SUSPENDED" }

  - name: License
    parent: null
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; owning buyer member" }
      - { name: state_code, type: string, source: input, description: "Two-letter US state that issued the license; matched against the YARD's state, not the member's home_state" }
      - { name: license_type, type: enum, source: input, description: "DEALER | DISMANTLER | SALVAGE_BROKER" }
      - { name: expires_on, type: string, source: input, description: "ISO date (YYYY-MM-DD); license is valid on a bid date D iff expires_on >= D (comparison against the date part of the logical clock)" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | REVOKED" }

  - name: Vehicle
    parent: null
    common_fields: true
    fields:
      - { name: seller_id, type: string, source: input, description: "FK -> Seller.id; assigning insurer/seller" }
      - { name: yard_id, type: string, source: input, description: "FK -> Yard.id; storage yard; also fixes the licensing jurisdiction (yard.state_code) and the title jurisdiction" }
      - { name: vin, type: string, source: input, description: "17-character VIN; unique system-wide" }
      - { name: year, type: integer, source: input, description: "Model year" }
      - { name: make, type: string, source: input, description: "Vehicle make" }
      - { name: model, type: string, source: input, description: "Vehicle model" }
      - { name: lot_type, type: enum, source: input, description: "STANDARD | DEALER_ONLY | DISMANTLER_ONLY | EXPORT_ONLY; gates which members may bid, evaluated against the yard's state_code" }
      - { name: reserve_price_cents, type: integer, source: input, description: "Reserve floor in cents; must be >= 0" }
      - { name: sale_type, type: enum, source: input, description: "PURE | MINIMUM_BID | ON_APPROVAL; reserve handling mode" }
      - { name: damage_codes, type: array, source: input, default: [], description: "List of damage code strings; nonempty required to leave intake" }
      - { name: primary_damage, type: enum, source: computed, default: NONE, description: "FRONT | REAR | SIDE | TOP | MECHANICAL | FLOOD | FIRE | NONE; set by condition submission, may be revised while AWAITING_CONDITION" }
      - { name: run_and_drive_status, type: enum, source: computed, default: UNKNOWN, description: "RUN_AND_DRIVE | STARTS | STATIONARY | UNKNOWN; set by condition submission, may be revised while AWAITING_CONDITION" }
      - { name: image_ids, type: array, source: computed, default: [], description: "Ordered list of server-minted image ids; exactly >= 5 required to leave intake" }
      - { name: image_count, type: integer, source: computed, default: 0, description: "Count of images currently attached" }
      - { name: odometer_reading, type: integer, source: input, description: "Odometer miles at assignment; must be >= 0" }
      - { name: title_brand, type: enum, source: computed, default: NONE, description: "NONE | REBUILT; on sale of a vehicle whose title_type is in {NON_REPAIRABLE, PARTS_ONLY} and title jurisdiction is in {FL, MI} this is force-set to REBUILT (reachable via PARTS_ONLY, which is EXPORT_ONLY in FL/MI; NON_REPAIRABLE in FL/MI is NON_TRANSFERABLE and can never sell)" }
      - { name: assigned_at, type: datetime, source: system, description: "Logical-clock timestamp of assignment creation" }
      - { name: received_at, type: datetime, source: computed, description: "Logical-clock timestamp when intake completed; null until MARK_READY" }
      - { name: status, type: enum, source: system, default: ASSIGNED, description: "ASSIGNED | AWAITING_CONDITION | SALE_READY | LISTED | LIVE | SOLD | ON_APPROVAL_PENDING | RELEASED | LOADED_OUT | CANCELLED" }

  - name: TitleRecord
    parent: null
    common_fields: true
    fields:
      - { name: vehicle_id, type: string, source: input, description: "FK -> Vehicle.id; exactly one TitleRecord per Vehicle (unique)" }
      - { name: jurisdiction_state, type: string, source: computed, description: "Copied from Vehicle.yard.state_code at creation; immutable" }
      - { name: title_type, type: enum, source: input, description: "CLEAN | SALVAGE | REBUILT | NON_REPAIRABLE | PARTS_ONLY | CERTIFICATE_OF_DESTRUCTION" }
      - { name: received_at, type: datetime, source: system, description: "Logical-clock timestamp of title acquisition; the title acquisition SLA is measured against Vehicle.assigned_at" }
      - { name: transferability, type: enum, source: computed, description: "TRANSFERABLE | EXPORT_ONLY | NON_TRANSFERABLE; derived at issue from (jurisdiction_state, title_type) per the jurisdiction rule table" }
      - { name: late, type: boolean, source: computed, default: false, description: "True when (received_at - Vehicle.assigned_at) > TITLE_SLA_DAYS days; drives Settlement.title_late_penalty_cents" }
      - { name: status, type: enum, source: system, default: PENDING, description: "PENDING | RECEIVED | TRANSFERRED" }

  - name: Auction
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Auction event name" }
      - { name: scheduled_start, type: datetime, source: input, description: "Logical-clock instant when sequencing is allowed to begin" }
      - { name: status, type: enum, source: system, default: SCHEDULED, description: "SCHEDULED | LIVE | COMPLETED" }
      - { name: current_sequence_number, type: integer, source: computed, default: 0, description: "Sequence number of the lot currently LIVE; 0 before the first open-lot" }

  - name: AuctionItem
    parent: null
    common_fields: true
    fields:
      - { name: auction_id, type: string, source: input, description: "FK -> Auction.id" }
      - { name: vehicle_id, type: string, source: input, description: "FK -> Vehicle.id; a vehicle appears in at most one non-CANCELLED auction item at a time" }
      - { name: sequence_number, type: integer, source: computed, description: "1-based contiguous running order assigned by the deterministic selector; null while auction SCHEDULED" }
      - { name: prelim_high_bid_cents, type: integer, source: computed, default: 0, description: "Maximum of PRELIM bids placed before the lot opened; snapshot taken at open-lot" }
      - { name: prelim_high_bidder_id, type: string, source: computed, description: "Member.id of the prelim high bidder; null when prelim_high_bid_cents == 0" }
      - { name: high_bid_cents, type: integer, source: computed, default: 0, description: "Current high bid across PRELIM snapshot and LIVE bids; updated on every accepted bid" }
      - { name: high_bidder_id, type: string, source: computed, description: "Member.id of the current high bidder; null when high_bid_cents == 0" }
      - { name: reserve_met, type: boolean, source: computed, default: false, description: "True iff high_bid_cents >= Vehicle.reserve_price_cents; recomputed on every accepted bid" }
      - { name: status, type: enum, source: system, default: QUEUED, description: "QUEUED | LIVE | CLOSED | CANCELLED" }

  - name: Bid
    parent: null
    common_fields: false
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID (no type prefix); identity only — never used in selector or ranking decisions" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, three fractional digits; logical-clock stamp of acceptance" }
      - { name: auction_item_id, type: string, source: input, description: "FK -> AuctionItem.id" }
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; bidding member (== X-User-ID for role Buyer)" }
      - { name: amount_cents, type: integer, source: input, description: "Bid amount in cents; must be > 0" }
      - { name: bid_type, type: enum, source: computed, description: "PRELIM when item QUEUED, LIVE when item LIVE" }
      - { name: is_winning, type: boolean, source: computed, default: false, description: "True on at most one Bid per AuctionItem; maintained by the anti-snipe/outbid cascade" }
      - { name: placed_at, type: datetime, source: system, description: "Logical-clock timestamp of acceptance" }

  - name: Sale
    parent: null
    common_fields: true
    fields:
      - { name: vehicle_id, type: string, source: input, description: "FK -> Vehicle.id" }
      - { name: auction_item_id, type: string, source: computed, description: "FK -> AuctionItem.id; the item whose close produced this sale" }
      - { name: winner_member_id, type: string, source: computed, description: "FK -> Member.id" }
      - { name: winning_bid_cents, type: integer, source: computed, description: "Hammer price in cents" }
      - { name: buyer_fee_cents, type: integer, source: computed, description: "Tiered buyer premium computed at close" }
      - { name: gate_pass_expires_at, type: datetime, source: computed, description: "Null until APPROVE; on APPROVE set to logical clock + 72h; -1s granularity pin: expiry is strict (expires_at <= now means expired)" }
      - { name: status, type: enum, source: system, default: PENDING_APPROVAL, description: "PENDING_APPROVAL | AWAITING_PAYMENT | PAID | CANCELLED" }

  - name: GatePass
    parent: null
    common_fields: true
    fields:
      - { name: sale_id, type: string, source: input, description: "FK -> Sale.id" }
      - { name: slot_start, type: datetime, source: input, description: "Load-out window start (logical clock)" }
      - { name: slot_end, type: datetime, source: input, description: "Load-out window end; must satisfy slot_end > slot_start and duration <= 8 hours" }
      - { name: status, type: enum, source: system, default: ISSUED, description: "ISSUED | CHECKED_IN | COMPLETED | EXPIRED" }
      - { name: storage_fee_cents, type: integer, source: computed, default: 0, description: "Winner storage fee computed at check-in; see storage_fee calculation" }

  - name: Settlement
    parent: null
    common_fields: true
    fields:
      - { name: sale_id, type: string, source: computed, description: "FK -> Sale.id; exactly one Settlement per Sale" }
      - { name: seller_id, type: string, source: computed, description: "FK -> Seller.id; copied from Vehicle.seller_id" }
      - { name: gross_proceeds_cents, type: integer, source: computed, description: "Hammer price, copied from Sale.winning_bid_cents" }
      - { name: seller_fee_cents, type: integer, source: computed, description: "Fee from Seller.fee_schedule (STANDARD | VOLUME); see seller_settlement calculation" }
      - { name: storage_recovery_cents, type: integer, source: computed, description: "Storage fees accrued against the SELLER from Vehicle.received_at until the sale day, minus per-seller free allowance; see storage_fee calculation" }
      - { name: title_late_penalty_cents, type: integer, source: computed, description: "Flat 15000 cents when title acquisition exceeded TITLE_SLA_DAYS; else 0" }
      - { name: net_proceeds_cents, type: integer, source: computed, description: "gross - seller_fee - storage_recovery - title_late_penalty; may be negative" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "DRAFT | FINALIZED | PAID" }

  - name: ExportDocument
    parent: null
    common_fields: true
    fields:
      - { name: sale_id, type: string, source: input, description: "FK -> Sale.id; required when Sale.winner is a non-US member" }
      - { name: document_type, type: enum, source: input, description: "BILL_OF_LADING | EXPORT_DECLARATION | CUSTOMS_MANIFEST" }
      - { name: destination_country, type: string, source: input, description: "ISO country code; must equal winner Member.country_code" }
      - { name: status, type: enum, source: system, default: SUBMITTED, description: "SUBMITTED | VERIFIED | REJECTED" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: Vehicle
    initial_state: ASSIGNED
    terminal_states: [LOADED_OUT, CANCELLED]
    transitions:
      - from: ASSIGNED
        to: AWAITING_CONDITION
        trigger: "POST /vehicles/{id}/images when the upload makes image_count >= 5 (auto)"
        actor: system
        preconditions:
          - "image_count reaches >= 5 with this upload"
        side_effects:
          - "Vehicle.image_count incremented; image id appended to Vehicle.image_ids"
        note: "The 5th image auto-advances the vehicle; fewer than 5 images leaves it ASSIGNED and MARK_READY is rejected with ERR_VEHICLE_NOT_IMAGE_READY."

      - from: AWAITING_CONDITION
        to: AWAITING_CONDITION
        trigger: "POST /vehicles/{id}/condition (revision re-submission)"
        actor: YardOperator
        preconditions:
          - "Vehicle.status == AWAITING_CONDITION (ERR_VEHICLE_INVALID_STATE otherwise)"
        side_effects:
          - "primary_damage and run_and_drive_status overwritten with the new submission (revision loop, no cycle bound)"
          - "damage_codes replaced when the payload carries a non-empty damage_codes array"
          - "increments Vehicle.version by 1"

      - from: ASSIGNED
        to: ASSIGNED
        trigger: "POST /vehicles/{id}/images while image_count stays < 5; POST /vehicles/{id}/condition while still ASSIGNED"
        actor: YardOperator
        preconditions:
          - "Vehicle.status == ASSIGNED (condition reports accepted early so READY can be reached the moment imaging completes)"
        side_effects:
          - "condition submission sets primary_damage / run_and_drive_status / damage_codes same as the AWAITING_CONDITION revision"
          - "increments Vehicle.version by 1"
        note: "Self-loop so condition submission order (before or after the 5th image) does not change the reachable set."

      - from: AWAITING_CONDITION
        to: SALE_READY
        trigger: "POST /vehicles/{id}/mark-ready"
        actor: YardOperator
        preconditions:
          - "Vehicle.image_count >= 5 (ERR_VEHICLE_NOT_IMAGE_READY)"
          - "Vehicle.damage_codes non-empty (ERR_VEHICLE_INCOMPLETE_CONDITION)"
          - "Vehicle.primary_damage != NONE and Vehicle.run_and_drive_status != UNKNOWN, i.e. a condition report has been submitted at least once (ERR_VEHICLE_INCOMPLETE_CONDITION)"
          - "Vehicle has a TitleRecord with status RECEIVED (ERR_TITLE_NOT_RECEIVED)"
          - "OCC: payload expected_vehicle_version == Vehicle.version (ERR_STALE_VERSION, 412)"
        side_effects:
          - "Vehicle.received_at := logical clock now"
          - "increments Vehicle.version by 1"

      - from: SALE_READY
        to: LISTED
        trigger: "POST /auctions/{id}/items (listing into a SCHEDULED auction)"
        actor: Auctioneer
        preconditions:
          - "Vehicle.status == SALE_READY (ERR_VEHICLE_NOT_SALE_READY)"
          - "Auction.status == SCHEDULED (ERR_AUCTION_NOT_SCHEDULED)"
          - "No other AuctionItem for this vehicle with status in {QUEUED, LIVE} (ERR_VEHICLE_ALREADY_LISTED)"
        side_effects:
          - "AuctionItem created with status QUEUED, sequence_number null"
          - "increments Vehicle.version by 1"

      - from: LISTED
        to: SALE_READY
        trigger: "POST /auctions/{id}/items/{itemId}/cancel"
        actor: Auctioneer
        preconditions:
          - "AuctionItem.status == QUEUED (ERR_AUCTION_ITEM_NOT_QUEUED)"
        side_effects:
          - "AuctionItem.status := CANCELLED"
          - "increments Vehicle.version by 1"

      - from: LISTED
        to: LIVE
        trigger: "POST /auctions/{id}/items/{itemId}/open-lot"
        actor: Auctioneer
        preconditions:
          - "Auction.status == LIVE (ERR_AUCTION_NOT_LIVE)"
          - "AuctionItem.sequence_number == Auction.current_sequence_number + 1 (out-of-order open rejected, ERR_AUCTION_ITEM_OUT_OF_ORDER)"
          - "No other AuctionItem in this Auction with status LIVE (ERR_AUCTION_ITEM_ALREADY_LIVE)"
        side_effects:
          - "AuctionItem.status := LIVE"
          - "AuctionItem.prelim_high_bid_cents / prelim_high_bidder_id snapshotted from PRELIM bids (0 / null when none); high_bid_cents / high_bidder_id initialized to the same snapshot"
          - "AuctionItem.reserve_met := (prelim_high_bid_cents >= Vehicle.reserve_price_cents)"
          - "Auction.current_sequence_number := AuctionItem.sequence_number"
          - "increments Vehicle.version by 1 and Auction.version by 1"

      - from: LIVE
        to: SOLD
        trigger: "POST /auctions/{id}/items/{itemId}/close-lot (hammer falls)"
        actor: Auctioneer
        preconditions:
          - "AuctionItem.status == LIVE (ERR_AUCTION_ITEM_NOT_LIVE)"
          - "A winning bid exists: high_bid_cents > 0 (ERR_NO_BIDS otherwise)"
          - "Vehicle.sale_type in {PURE, MINIMUM_BID} (ON_APPROVAL vehicles ALWAYS route to ON_APPROVAL_PENDING, even when the reserve is met)"
          - "reserve_met == true (ERR_RESERVE_NOT_MET)"
          - "TitleRecord.transferability != NON_TRANSFERABLE (ERR_TITLE_NON_TRANSFERABLE)"
        side_effects:
          - "Sale created with status AWAITING_PAYMENT; winning_bid_cents, winner_member_id copied; buyer_fee_cents computed via buyer_premium; gate_pass_expires_at := logical clock + 72h"
          - "Settlement created DRAFT via seller_settlement (seller_fee, storage_recovery, title_late_penalty, net_proceeds)"
          - "TitleRecord.status := TRANSFERRED; if TitleRecord.title_type in {NON_REPAIRABLE, PARTS_ONLY} and jurisdiction in {FL, MI}: Vehicle.title_brand := REBUILT (state-specific brand stamping)"
          - "If winner Member.country_code != 'US': an ExportDocument requirement attaches to the Sale (load-out requires a VERIFIED ExportDocument)"
          - "Winning Bid.is_winning locked true; all other bids on the item remain is_winning false"
          - "AuctionItem.status := CLOSED"
          - "increments Vehicle.version by 1"

      - from: LIVE
        to: ON_APPROVAL_PENDING
        trigger: "POST /auctions/{id}/items/{itemId}/close-lot when Vehicle.sale_type == ON_APPROVAL (regardless of reserve_met)"
        actor: Auctioneer
        preconditions:
          - "AuctionItem.status == LIVE"
          - "A high bid exists: high_bid_cents > 0 (ERR_NO_BIDS)"
          - "TitleRecord.transferability != NON_TRANSFERABLE (ERR_TITLE_NON_TRANSFERABLE)"
        side_effects:
          - "Sale created with status PENDING_APPROVAL; buyer_fee_cents computed via buyer_premium"
          - "AuctionItem.status := CLOSED"
          - "increments Vehicle.version by 1"

      - from: ON_APPROVAL_PENDING
        to: SOLD
        trigger: "POST /sales/{id}/approve"
        actor: SellerAgent
        preconditions:
          - "Sale.status == PENDING_APPROVAL and Sale belongs to acting Seller (ERR_SALE_NOT_PENDING_APPROVAL / ERR_SELLER_MISMATCH)"
          - "Vehicle.status == ON_APPROVAL_PENDING (ERR_VEHICLE_INVALID_STATE)"
        side_effects:
          - "Sale.status := AWAITING_PAYMENT"
          - "Sale.gate_pass_expires_at := logical clock + 72h"
          - "Settlement created DRAFT (same side-effect set as the LIVE->SOLD close, including title transfer, REBUILT stamping and ExportDocument requirement)"
          - "increments Vehicle.version by 1"

      - from: ON_APPROVAL_PENDING
        to: SALE_READY
        trigger: "POST /sales/{id}/reject-offer"
        actor: SellerAgent
        preconditions:
          - "Sale.status == PENDING_APPROVAL and Sale belongs to acting Seller"
        side_effects:
          - "Sale.status := CANCELLED"
          - "Winning Bid.is_winning := false (bid released)"
          - "increments Vehicle.version by 1"

      - from: SOLD
        to: RELEASED
        trigger: "POST /sales/{id}/payments (payment clears)"
        actor: Buyer
        preconditions:
          - "Sale.status == AWAITING_PAYMENT (ERR_SALE_NOT_AWAITING_PAYMENT)"
          - "Payment amount == winning_bid_cents + buyer_fee_cents + GatePass.storage_fee_cents accrued so far (ERR_PAYMENT_AMOUNT_MISMATCH); when no GatePass exists yet the storage term is 0"
          - "Buyer acting on own Sale (X-User-ID == Sale.winner_member_id)"
        side_effects:
          - "Sale.status := PAID"
          - "Settlement.status := FINALIZED (seller proceeds locked)"
          - "increments Vehicle.version by 1"

      - from: RELEASED
        to: LOADED_OUT
        trigger: "POST /gate-passes/{id}/check-in followed by POST /gate-passes/{id}/complete"
        actor: YardOperator
        preconditions:
          - "GatePass.status == ISSUED at check-in (ERR_GATE_PASS_INVALID_STATE)"
          - "At check-in: logical clock <= Sale.gate_pass_expires_at (ERR_GATE_PASS_EXPIRED)"
          - "At check-in: slot window valid — GatePass.slot_start <= now <= GatePass.slot_end and no other GatePass with status in {ISSUED, CHECKED_IN} overlaps this yard-slot (aggregate capacity: max 4 overlapping ISSUED/CHECKED_IN passes per yard per 1-hour window; ERR_SLOT_CAPACITY_EXCEEDED)"
          - "At check-in: if winner is non-US, a VERIFIED ExportDocument exists for the Sale (ERR_EXPORT_DOCUMENT_REQUIRED)"
          - "At complete: GatePass.status == CHECKED_IN"
        side_effects:
          - "At check-in: GatePass.storage_fee_cents computed via storage_fee (winner-side), GatePass.status := CHECKED_IN"
          - "At complete: GatePass.status := COMPLETED; Vehicle.status := LOADED_OUT; Settlement.status := PAID"
          - "increments Vehicle.version by 1 at complete"

      - from: SOLD
        to: SALE_READY
        trigger: "POST /sales/{id}/cancel (seller/admin unwind before payment)"
        actor: SellerAgent
        preconditions:
          - "Sale.status in {PENDING_APPROVAL, AWAITING_PAYMENT} (ERR_SALE_NOT_CANCELLABLE)"
        side_effects:
          - "Sale.status := CANCELLED; Settlement remains DRAFT with all money fields zeroed"
          - "TitleRecord.status := RECEIVED (transfer rolled back); Vehicle.title_brand restored to prior value"
          - "Winning Bid.is_winning := false"
          - "increments Vehicle.version by 1"

      - from: ASSIGNED
        to: CANCELLED
        trigger: "POST /vehicles/{id}/cancel"
        actor: SellerAgent
        preconditions:
          - "Vehicle.status in {ASSIGNED, AWAITING_CONDITION, SALE_READY, LISTED, LIVE} (ERR_VEHICLE_NOT_CANCELLABLE)"
          - "If LISTED: the QUEUED AuctionItem is auto-cancelled"
        side_effects:
          - "If LISTED: AuctionItem.status := CANCELLED"
          - "increments Vehicle.version by 1"
        note: "Same transition shape applies from AWAITING_CONDITION, SALE_READY, LISTED and LIVE (from-set enumerates all five)."

      - from: AWAITING_CONDITION
        to: CANCELLED
        trigger: "POST /vehicles/{id}/cancel"
        actor: SellerAgent
        preconditions: ["Vehicle.status in the cancel-eligible set"]
        side_effects: ["increments Vehicle.version by 1"]

      - from: SALE_READY
        to: CANCELLED
        trigger: "POST /vehicles/{id}/cancel"
        actor: SellerAgent
        preconditions: ["Vehicle.status in the cancel-eligible set"]
        side_effects: ["increments Vehicle.version by 1"]

      - from: LISTED
        to: CANCELLED
        trigger: "POST /vehicles/{id}/cancel"
        actor: SellerAgent
        preconditions: ["Vehicle.status in the cancel-eligible set"]
        side_effects:
          - "AuctionItem.status := CANCELLED"
          - "increments Vehicle.version by 1"

      - from: LIVE
        to: CANCELLED
        trigger: "POST /vehicles/{id}/cancel while the lot is live"
        actor: SellerAgent
        preconditions:
          - "Vehicle.status == LIVE"
        side_effects:
          - "AuctionItem.status := CANCELLED (from LIVE)"
          - "Every Bid on the item with is_winning == true is released (is_winning := false)"
          - "increments Vehicle.version by 1"
        note: "Auction auto-completes when no QUEUED or LIVE items remain."

  - entity: Auction
    initial_state: SCHEDULED
    terminal_states: [COMPLETED]
    transitions:
      - from: SCHEDULED
        to: LIVE
        trigger: "POST /auctions/{id}/start"
        actor: Auctioneer
        preconditions:
          - "Auction.status == SCHEDULED (ERR_AUCTION_NOT_SCHEDULED)"
          - "logical clock >= Auction.scheduled_start (ERR_AUCTION_NOT_YET_STARTED)"
          - "At least one QUEUED AuctionItem (ERR_AUCTION_EMPTY)"
        side_effects:
          - "Sequence numbers assigned by the deterministic selector: candidate set = QUEUED items of this auction; ranking = item.created_at ASC; tie-break = none needed (created_at unique per insertion order at 3-fractional-digit precision; if a tie persists, Vehicle.vin ASC); sequence_number assigned 1..N contiguously"
          - "increments Auction.version by 1"

      - from: LIVE
        to: COMPLETED
        trigger: "system (automatic when the last LIVE item closes and no QUEUED items remain)"
        actor: system
        preconditions:
          - "All AuctionItems in {CLOSED, CANCELLED}"
        side_effects:
          - "increments Auction.version by 1"

  - entity: Bid
    initial_state: null
    terminal_states: []
    transitions: []
    note: >
      Bid is an immutable event row (common_fields: false). Its lifecycle is
      captured by the is_winning flag maintained on the Vehicle/AuctionItem
      machines: each accepted bid flips the previous winning bid's
      is_winning to false and sets its own to true. No explicit Bid state
      machine; transitions above document the flag cascade.

  - entity: TitleRecord
    initial_state: PENDING
    terminal_states: [TRANSFERRED]
    transitions:
      - from: PENDING
        to: RECEIVED
        trigger: "POST /vehicles/{id}/title"
        actor: TitleClerk
        preconditions:
          - "Vehicle has no TitleRecord yet (ERR_TITLE_ALREADY_EXISTS)"
          - "Vehicle.status != CANCELLED"
        side_effects:
          - "transferability derived: title_type in {CLEAN, SALVAGE, REBUILT} -> TRANSFERABLE; PARTS_ONLY in {CA, TX} -> NON_TRANSFERABLE else EXPORT_ONLY; NON_REPAIRABLE in {FL, MI} -> NON_TRANSFERABLE else EXPORT_ONLY; CERTIFICATE_OF_DESTRUCTION -> NON_TRANSFERABLE everywhere"
          - "If (received_at - Vehicle.assigned_at) > TITLE_SLA_DAYS days: flag late so Settlement.title_late_penalty_cents = 15000 at settlement creation"
        note: "PENDING is virtual: creation of the TitleRecord is itself the receipt; the row is persisted directly in RECEIVED. PENDING exists only as the documented initial state before POST /vehicles/{id}/title."

      - from: RECEIVED
        to: TRANSFERRED
        trigger: "system (side effect of Vehicle LIVE->SOLD or ON_APPROVAL_PENDING->SOLD)"
        actor: system
        preconditions:
          - "TitleRecord.transferability != NON_TRANSFERABLE (a NON_TRANSFERABLE title blocks the SOLD transition with ERR_TITLE_NON_TRANSFERABLE unless the winner is non-US and transferability == EXPORT_ONLY... EXPORT_ONLY titles require winner.country_code != 'US'; a US winner on an EXPORT_ONLY title is rejected at bid time with ERR_TITLE_EXPORT_ONLY)"
        side_effects:
          - "REBUILT stamping per Vehicle machine"

  - entity: Settlement
    initial_state: DRAFT
    terminal_states: [PAID]
    transitions:
      - from: DRAFT
        to: FINALIZED
        trigger: "system (side effect of POST /sales/{id}/payments)"
        actor: system
        preconditions: []
        side_effects: []

      - from: FINALIZED
        to: PAID
        trigger: "system (side effect of POST /gate-passes/{id}/complete)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: GatePass
    initial_state: ISSUED
    terminal_states: [COMPLETED, EXPIRED]
    transitions:
      - from: ISSUED
        to: CHECKED_IN
        trigger: "POST /gate-passes/{id}/check-in"
        actor: YardOperator
        preconditions:
          - "See Vehicle RELEASED->LOADED_OUT check-in preconditions"
        side_effects:
          - "storage_fee_cents computed (winner-side storage_fee)"

      - from: ISSUED
        to: EXPIRED
        trigger: "system (logical clock passes Sale.gate_pass_expires_at while ISSUED) or POST /gate-passes/{id}/check-in after expiry (rejected ERR_GATE_PASS_EXPIRED and marked EXPIRED)"
        actor: system
        preconditions: []
        side_effects:
          - "GatePass.status := EXPIRED; a new GatePass may be issued via POST /sales/{id}/gate-passes"

      - from: CHECKED_IN
        to: COMPLETED
        trigger: "POST /gate-passes/{id}/complete"
        actor: YardOperator
        preconditions:
          - "GatePass.status == CHECKED_IN (ERR_GATE_PASS_INVALID_STATE)"
        side_effects:
          - "Vehicle -> LOADED_OUT; Settlement -> PAID"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: vehicle-mark-ready-stale-version
    parent_entity: Vehicle
    write_endpoint: "POST /vehicles/{id}/mark-ready"
    occ_field: "expected_vehicle_version"
    description: |
      Marking a vehicle SALE_READY carries the caller's last-observed
      Vehicle.version. Because an intervening condition revision
      (AWAITING_CONDITION -> AWAITING_CONDITION) legitimately overwrites the
      condition report the caller based readiness on, a stale
      expected_vehicle_version is rejected with 412 rather than allowing the
      readiness decision to stand on superseded data.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: buyer_premium
    trigger: "Sale creation (close-lot -> SOLD, and approve for ON_APPROVAL)"
    algorithm: tiered_pricing
    formula: |
      # MARGINAL tiered premium over the hammer price B = Sale.winning_bid_cents.
      # Tier boundaries (cents, inclusive lower bounds):
      #   T1: [0, 500000)        -> 12% of the portion in this tier
      #   T2: [500000, 2000000)  -> 9% of the portion in this tier
      #   T3: [2000000, inf)     -> 6% of the portion in this tier
      # fee = 0.12 * min(B, 500000)
      #     + 0.09 * max(0, min(B, 2000000) - 500000)
      #     + 0.06 * max(0, B - 2000000)
      # Evaluation order: compute each tier's portion in whole cents, round the
      # tier contribution (round_half_up to whole cents) PER TIER, then sum.
      # Rounding per tier then summing is the pinned order; sum-then-round is
      # the forbidden variant.
    input_set: "the winning Bid (is_winning == true) on the closed AuctionItem"
    constants:
      TIER1_CAP_CENTS: 500000
      TIER2_CAP_CENTS: 2000000
      TIER1_RATE: 0.12
      TIER2_RATE: 0.09
      TIER3_RATE: 0.06
    precision: "whole cents, round_half_up per tier, then sum"
    variants:
      - name: marginal_per_tier_round
        when: "always (pinned)"
        difference: "round each tier contribution, then sum"
      - name: flat_round_after_sum
        when: "FORBIDDEN — documented only to pin the divergence"
        difference: "sum unrounded tier contributions, then round once; differs by up to 2 cents"

  - name: seller_settlement
    trigger: "Settlement creation (Sale -> AWAITING_PAYMENT)"
    algorithm: waterfall_allocation
    formula: |
      # CIRCULAR-LOOKING dependency, evaluation order pinned 1..5:
      #   1. gross := Sale.winning_bid_cents
      #   2. seller_fee:
      #        STANDARD: max(2500, round_half_up(0.10 * gross)) + 5000 fixed title fee
      #        VOLUME:   max(1500, round_half_up(0.075 * gross)) + 5000 fixed title fee
      #      (The fixed 5000 title fee is NOT part of the max() floor.)
      #   3. storage_recovery := seller-side storage_fee over the window
      #        [Vehicle.received_at, sale day] with seller free allowance
      #        SELLER_FREE_STORAGE_DAYS = 7 (independent of the yard's winner-side
      #        free_storage_days): full days in window beyond 7, times
      #        Yard.daily_storage_rate_cents.
      #   4. title_late_penalty := 15000 if the TitleRecord was received more
      #        than TITLE_SLA_DAYS after Vehicle.assigned_at, else 0.
      #        Boundary: exactly TITLE_SLA_DAYS elapsed -> NOT late (> is strict).
      #   5. net_proceeds := gross - seller_fee - storage_recovery - title_late_penalty
      #      (may be negative; negative nets are legal and persisted)
      # The dependency looks circular because storage_recovery keys off the sale
      # day which the same transition fixes; the pinned order resolves it.
    input_set: "the Sale, its Vehicle, the Vehicle's Yard, the Seller's fee_schedule, the TitleRecord"
    constants:
      STANDARD_FEE_RATE: 0.10
      STANDARD_FEE_FLOOR_CENTS: 2500
      VOLUME_FEE_RATE: 0.075
      VOLUME_FEE_FLOOR_CENTS: 1500
      TITLE_FEE_CENTS: 5000
      TITLE_SLA_DAYS: 30
      TITLE_LATE_PENALTY_CENTS: 15000
      SELLER_FREE_STORAGE_DAYS: 7
    precision: "whole cents, round_half_up"
    variants:
      - name: standard_schedule
        when: "Seller.fee_schedule == STANDARD"
        difference: "10% rate, 2500 floor"
      - name: volume_schedule
        when: "Seller.fee_schedule == VOLUME"
        difference: "7.5% rate, 1500 floor — same gross yields a strictly smaller fee for gross > 0"

  - name: storage_fee
    trigger: "GatePass check-in (winner side) and Settlement creation (seller side)"
    algorithm: threshold
    formula: |
      # Day-granule definition (pinned): a "storage day" is a whole calendar day
      # boundary crossed in the UTC date domain. days_held(from_ts, to_ts) =
      # date(to_ts) - date(from_ts) in whole days (e.g. received 2026-09-01T23:00,
      # sold 2026-09-03T00:30 -> 2 days).
      #
      # WINNER side (GatePass.storage_fee_cents, at check-in):
      #   free_days := Yard.free_storage_days counted from the SALE DAY
      #     (the UTC date of the close-lot / approve transition)
      #   chargeable := max(0, date(check_in) - date(sale day) - free_days)
      #   fee := chargeable * Yard.daily_storage_rate_cents
      #
      # SELLER side (Settlement.storage_recovery_cents, at sale):
      #   chargeable := max(0, date(sale day) - date(Vehicle.received_at) - SELLER_FREE_STORAGE_DAYS)
      #   fee := chargeable * Yard.daily_storage_rate_cents
      #
      # The two sides measure DIFFERENT windows against DIFFERENT free
      # allowances over the SAME rate — dual-variant over one rate field.
    input_set: "Vehicle.received_at, sale day, check-in instant, Yard.daily_storage_rate_cents, Yard.free_storage_days"
    constants:
      SELLER_FREE_STORAGE_DAYS: 7
    precision: "whole cents (integer day counts times integer rate)"
    variants:
      - name: winner_window
        when: "GatePass check-in"
        difference: "window [sale day, check-in], free allowance = Yard.free_storage_days"
      - name: seller_window
        when: "Settlement creation"
        difference: "window [received_at, sale day], free allowance = SELLER_FREE_STORAGE_DAYS (7)"

  - name: license_eligibility
    trigger: "POST /bids (prelim and live), evaluated before amount validation"
    algorithm: constraint_propagation
    formula: |
      # Effective tier E(member, vehicle) — evaluated against the YARD's state
      # (Vehicle.yard_id -> Yard.state_code), never the member's home_state:
      #   base: BASIC -> {STANDARD}; PREMIER -> {STANDARD};
      #         BUSINESS -> {STANDARD}
      #   upgrades: an ACTIVE License L with L.member_id == member.id AND
      #     L.state_code == yard.state_code AND L.expires_on >= date(now):
      #       DEALER         adds DEALER_ONLY
      #       DISMANTLER     adds DISMANTLER_ONLY
      #       SALVAGE_BROKER adds {DEALER_ONLY, DISMANTLER_ONLY}
      #   EXPORT_ONLY lots: biddable by any tier iff member.country_code != 'US'.
      #   Member.status must be ACTIVE (ERR_MEMBER_SUSPENDED).
      #   TitleRecord.transferability == EXPORT_ONLY additionally forbids
      #   US winners: a US member's bid on such a vehicle is rejected
      #   (ERR_TITLE_EXPORT_ONLY). NON_TRANSFERABLE titles do NOT block bids
      #   at bid time — they block close-lot (ERR_TITLE_NON_TRANSFERABLE).
      # Rejection when lot_type not in E -> ERR_LICENSE_REQUIRED.
      # Expired-on-date: expires_on == date(now) is still VALID (>= boundary).
    input_set: "Member, their Licenses, Vehicle.lot_type, Yard.state_code, TitleRecord.transferability, logical clock date"
    constants: {}
    precision: "date granularity; expires_on compared with >= against the UTC date of the logical clock"

  - name: sequence_assignment
    trigger: "Auction SCHEDULED -> LIVE (POST /auctions/{id}/start)"
    algorithm: topological
    formula: |
      # Deterministic running order:
      #   candidate set := AuctionItems of this auction with status QUEUED
      #   sort key      := AuctionItem.created_at ASC
      #   tie-break     := Vehicle.vin ASC (lexicographic) when created_at ties
      #   fallback      := empty candidate set -> ERR_AUCTION_EMPTY
      # Assign sequence_number 1..N contiguously in that order.
      # open-lot then requires item.sequence_number == current_sequence_number + 1.
    input_set: "QUEUED AuctionItems of the Auction"
    constants: {}
    precision: "integer sequence, 1-based, no gaps"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present; X-User-Role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all endpoints except POST /_clock/set_current_utc (PlatformAdmin-only, still authed)"

  - priority: 2
    category: auth
    check: "Role permitted for this endpoint per §1.7; entity-backed ownership where declared (Buyer acts on own bids/sales; SellerAgent acts on own seller's vehicles/sales)"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Path ids exist, validated left-to-right (vehicle before title, auction before item, sale before gate-pass/export-document)"
    error_id: "ERR_VEHICLE_NOT_FOUND | ERR_AUCTION_NOT_FOUND | ERR_AUCTION_ITEM_NOT_FOUND | ERR_SALE_NOT_FOUND | ERR_GATE_PASS_NOT_FOUND | ERR_MEMBER_NOT_FOUND | ERR_TITLE_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path ids"

  - priority: 4
    category: existence
    check: "Request-body referenced entities exist (yard_id, seller_id, member_id, vehicle_id, auction_id, sale_id)"
    error_id: "ERR_YARD_NOT_FOUND | ERR_SELLER_NOT_FOUND | ERR_MEMBER_NOT_FOUND | ERR_VEHICLE_NOT_FOUND | ERR_AUCTION_NOT_FOUND | ERR_SALE_NOT_FOUND"
    http_status: 404
    applies_to: "creation endpoints with body FKs"

  - priority: 5
    category: existence
    check: "Required fields present and well-typed; enum values in declared sets; VIN 17 chars; end > start where applicable; amounts > 0"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

  - priority: 6
    category: business_constraint
    check: "Uniqueness: Member.email unique; Vehicle.vin unique system-wide; one TitleRecord per Vehicle; one QUEUED/LIVE AuctionItem per Vehicle"
    error_id: "ERR_EMAIL_TAKEN | ERR_VIN_DUPLICATE | ERR_TITLE_ALREADY_EXISTS | ERR_VEHICLE_ALREADY_LISTED"
    http_status: 409
    applies_to: "creation endpoints"

  - priority: 7
    category: state
    check: "Target resource state precondition for the transition (per §1.2 from-states); includes ERR_VEHICLE_INVALID_STATE, ERR_VEHICLE_NOT_SALE_READY, ERR_AUCTION_NOT_SCHEDULED, ERR_AUCTION_NOT_LIVE, ERR_AUCTION_ITEM_NOT_QUEUED, ERR_AUCTION_ITEM_NOT_LIVE, ERR_AUCTION_ITEM_ALREADY_LIVE, ERR_AUCTION_ITEM_OUT_OF_ORDER, ERR_SALE_NOT_PENDING_APPROVAL, ERR_SALE_NOT_AWAITING_PAYMENT, ERR_SALE_NOT_CANCELLABLE, ERR_GATE_PASS_INVALID_STATE, ERR_VEHICLE_NOT_CANCELLABLE"
    error_id: "ERR_VEHICLE_INVALID_STATE et al."
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 8
    category: business_safety
    check: "License/title gating on bids: license_eligibility — lot_type vs effective tier (yard-state license match, expiry >= date(now)), Member.status == ACTIVE, EXPORT_ONLY title blocks US winners, NON_TRANSFERABLE title blocks close"
    error_id: "ERR_LICENSE_REQUIRED | ERR_MEMBER_SUSPENDED | ERR_TITLE_EXPORT_ONLY | ERR_TITLE_NON_TRANSFERABLE"
    http_status: 403
    applies_to: "POST /bids; POST /auctions/{id}/items/{itemId}/close-lot"

  - priority: 9
    category: business_constraint
    check: "Bid amount: live bids must be >= high_bid_cents + 2500 (MIN_INCREMENT_CENTS); prelim bids must be > 0; a member may not outbid themself when already high bidder"
    error_id: "ERR_BID_INCREMENT_TOO_SMALL | ERR_BID_SELF_OUTBID"
    http_status: 422
    applies_to: "POST /bids"

  - priority: 10
    category: business_temporal
    check: "Clock-based gates: auction start requires now >= scheduled_start; mark-ready requires received title; check-in requires now <= Sale.gate_pass_expires_at (expired gate pass rejected and marked EXPIRED); license expiry evaluated on date(now)"
    error_id: "ERR_AUCTION_NOT_YET_STARTED | ERR_TITLE_NOT_RECEIVED | ERR_GATE_PASS_EXPIRED"
    http_status: 409
    applies_to: "POST /auctions/{id}/start; POST /vehicles/{id}/mark-ready; POST /gate-passes/{id}/check-in; POST /bids"

  - priority: 11
    category: business_safety
    check: "Export compliance: load-out check-in for a non-US winner requires a VERIFIED ExportDocument with destination_country == winner Member.country_code"
    error_id: ERR_EXPORT_DOCUMENT_REQUIRED
    http_status: 409
    applies_to: "POST /gate-passes/{id}/check-in"

  - priority: 12
    category: business_constraint
    check: "Slot capacity: at check-in, the 1-hour window containing slot_start at the vehicle's yard must hold fewer than 4 other GatePasses with status in {ISSUED, CHECKED_IN} whose [slot_start, slot_end) overlaps it (half-open; touching boundaries do NOT overlap)"
    error_id: ERR_SLOT_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /sales/{id}/gate-passes (creation-time overlap check) and POST /gate-passes/{id}/check-in"

  - priority: 13
    category: business_fiscal
    check: "Payment exactness: payment amount must equal winning_bid_cents + buyer_fee_cents + outstanding winner storage (0 before first GatePass check-in)"
    error_id: ERR_PAYMENT_AMOUNT_MISMATCH
    http_status: 422
    applies_to: "POST /sales/{id}/payments"

  - priority: 14
    category: business_fiscal
    check: "Reserve handling: PURE/MINIMUM_BID close requires reserve_met; no-bid close rejected"
    error_id: "ERR_RESERVE_NOT_MET | ERR_NO_BIDS"
    http_status: 409
    applies_to: "POST /auctions/{id}/items/{itemId}/close-lot"

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

endpoints:
  # --- test-driving ---
  - method: POST
    path: "/salvage-auction/_clock/set_current_utc"
    description: "Set the logical clock. Before any call, the logical clock reads exactly 2026-09-01T00:00:00Z and MUST NOT fall back to wall-clock time. All timestamps, deadlines, licence-expiry and storage-day computations read this clock."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: []

  # --- Yard ---
  - method: POST
    path: "/salvage-auction/yards"
    description: "Create a yard"
    roles: [PlatformAdmin]
    code: 201
    input: [name, state_code, daily_storage_rate_cents, free_storage_days]
    output: Yard
    side_effects: ["status = ACTIVE"]

  - method: GET
    path: "/salvage-auction/yards"
    description: "List yards"
    roles: [PlatformAdmin, YardOperator, Auctioneer, SellerAgent, Buyer, TitleClerk]
    code: 200
    input: ["limit?", "offset?", "state_code?"]
    output: "Yard[]"
    side_effects: []

  - method: GET
    path: "/salvage-auction/yards/{id}"
    description: "Get a yard"
    roles: [PlatformAdmin, YardOperator, Auctioneer, SellerAgent, Buyer, TitleClerk]
    code: 200
    input: []
    output: Yard
    side_effects: []

  # --- Seller ---
  - method: POST
    path: "/salvage-auction/sellers"
    description: "Create a seller (insurer)"
    roles: [PlatformAdmin]
    code: 201
    input: [name, seller_type, fee_schedule]
    output: Seller
    side_effects: ["status = ACTIVE"]

  - method: GET
    path: "/salvage-auction/sellers"
    description: "List sellers"
    roles: [PlatformAdmin, YardOperator, Auctioneer, SellerAgent, Buyer, TitleClerk]
    code: 200
    input: ["limit?", "offset?"]
    output: "Seller[]"
    side_effects: []

  - method: GET
    path: "/salvage-auction/sellers/{id}"
    description: "Get a seller"
    roles: [PlatformAdmin, YardOperator, Auctioneer, SellerAgent, Buyer, TitleClerk]
    code: 200
    input: []
    output: Seller
    side_effects: []

  # --- Member ---
  - method: POST
    path: "/salvage-auction/members"
    description: "Register a buyer member"
    roles: [PlatformAdmin]
    code: 201
    input: [email, full_name, home_state, tier, "country_code?"]
    output: Member
    side_effects: ["status = ACTIVE"]

  - method: GET
    path: "/salvage-auction/members"
    description: "List members"
    roles: [PlatformAdmin, Auctioneer, TitleClerk]
    code: 200
    input: ["limit?", "offset?", "tier?", "home_state?"]
    output: "Member[]"
    side_effects: []

  - method: GET
    path: "/salvage-auction/members/{id}"
    description: "Get a member"
    roles: [PlatformAdmin, Auctioneer, TitleClerk, Buyer]
    code: 200
    input: []
    output: Member
    side_effects: []

  # --- License ---
  - method: POST
    path: "/salvage-auction/members/{id}/licenses"
    description: "Attach a state-issued license to a member"
    roles: [PlatformAdmin, TitleClerk]
    code: 201
    input: [state_code, license_type, expires_on]
    output: License
    side_effects: ["status = ACTIVE"]

  - method: GET
    path: "/salvage-auction/members/{id}/licenses"
    description: "List a member's licenses"
    roles: [PlatformAdmin, Auctioneer, TitleClerk, Buyer]
    code: 200
    input: ["limit?", "offset?"]
    output: "License[]"
    side_effects: []

  - method: GET
    path: "/salvage-auction/licenses/{id}"
    description: "Get a license"
    roles: [PlatformAdmin, Auctioneer, TitleClerk, Buyer]
    code: 200
    input: []
    output: License
    side_effects: []

  # --- Vehicle ---
  - method: POST
    path: "/salvage-auction/vehicles"
    description: "Insurer assigns a vehicle to a yard (seller must be ACTIVE else ERR_SELLER_SUSPENDED; yard must be ACTIVE else ERR_YARD_CLOSED)"
    roles: [SellerAgent]
    code: 201
    input: [seller_id, yard_id, vin, year, make, model, lot_type, reserve_price_cents, sale_type, odometer_reading, "damage_codes?"]
    output: Vehicle
    side_effects: ["status = ASSIGNED", "assigned_at := logical clock", "image_count = 0, primary_damage = NONE, run_and_drive_status = UNKNOWN, title_brand = NONE"]

  - method: GET
    path: "/salvage-auction/vehicles"
    description: "List vehicles"
    roles: [PlatformAdmin, YardOperator, Auctioneer, SellerAgent, Buyer, TitleClerk]
    code: 200
    input: ["limit?", "offset?", "status?", "yard_id?", "seller_id?", "lot_type?"]
    output: "Vehicle[]"
    side_effects: []

  - method: GET
    path: "/salvage-auction/vehicles/{id}"
    description: "Get a vehicle"
    roles: [PlatformAdmin, YardOperator, Auctioneer, SellerAgent, Buyer, TitleClerk]
    code: 200
    input: []
    output: Vehicle
    side_effects: []

  - method: POST
    path: "/salvage-auction/vehicles/{id}/images"
    description: "Attach one condition image (server mints the image id)"
    roles: [YardOperator]
    code: 201
    input: [image_url]
    output: "{ image_id: string, image_count: integer }"
    side_effects: ["image_count += 1; image id appended; auto-transition ASSIGNED -> AWAITING_CONDITION at count >= 5"]

  - method: POST
    path: "/salvage-auction/vehicles/{id}/condition"
    description: "Submit or revise the condition report (damage codes, primary damage, run-and-drive verification)"
    roles: [YardOperator]
    code: 200
    input: [primary_damage, run_and_drive_status, "damage_codes?"]
    output: Vehicle
    side_effects: ["Sets primary_damage, run_and_drive_status, damage_codes; increments Vehicle.version"]

  - method: POST
    path: "/salvage-auction/vehicles/{id}/mark-ready"
    description: "Advance AWAITING_CONDITION vehicle to SALE_READY (OCC-guarded)"
    roles: [YardOperator]
    code: 200
    input: [expected_vehicle_version]
    output: Vehicle
    side_effects: ["Vehicle.status := SALE_READY", "received_at := logical clock", "increments Vehicle.version by 1"]

  - method: POST
    path: "/salvage-auction/vehicles/{id}/cancel"
    description: "Seller cancels a pre-sale vehicle"
    roles: [SellerAgent]
    code: 200
    input: []
    output: Vehicle
    side_effects: ["Vehicle.status := CANCELLED; any QUEUED AuctionItem auto-CANCELLED"]

  # --- TitleRecord ---
  - method: POST
    path: "/salvage-auction/vehicles/{id}/title"
    description: "Record title acquisition for a vehicle (one per vehicle)"
    roles: [TitleClerk]
    code: 201
    input: [title_type]
    output: TitleRecord
    side_effects: ["status := RECEIVED; received_at := logical clock; jurisdiction_state := vehicle's yard state; transferability derived per jurisdiction rule table; late flag when elapsed > TITLE_SLA_DAYS"]

  - method: GET
    path: "/salvage-auction/vehicles/{id}/title"
    description: "Get the title record for a vehicle (array of 0 or 1)"
    roles: [PlatformAdmin, YardOperator, Auctioneer, SellerAgent, Buyer, TitleClerk]
    code: 200
    input: []
    output: "TitleRecord[]"
    side_effects: []

  - method: GET
    path: "/salvage-auction/titles/{id}"
    description: "Get a title record by id"
    roles: [PlatformAdmin, YardOperator, Auctioneer, SellerAgent, TitleClerk]
    code: 200
    input: []
    output: TitleRecord
    side_effects: []

  # --- Auction ---
  - method: POST
    path: "/salvage-auction/auctions"
    description: "Schedule an auction event"
    roles: [Auctioneer]
    code: 201
    input: [name, scheduled_start]
    output: Auction
    side_effects: ["status = SCHEDULED", "current_sequence_number = 0"]

  - method: GET
    path: "/salvage-auction/auctions"
    description: "List auctions"
    roles: [PlatformAdmin, YardOperator, Auctioneer, SellerAgent, Buyer, TitleClerk]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "Auction[]"
    side_effects: []

  - method: GET
    path: "/salvage-auction/auctions/{id}"
    description: "Get an auction"
    roles: [PlatformAdmin, YardOperator, Auctioneer, SellerAgent, Buyer, TitleClerk]
    code: 200
    input: []
    output: Auction
    side_effects: []

  - method: POST
    path: "/salvage-auction/auctions/{id}/start"
    description: "Open the auction: assigns the deterministic running order"
    roles: [Auctioneer]
    code: 200
    input: []
    output: Auction
    side_effects: ["sequence_assignment over QUEUED items; status := LIVE"]

  # --- AuctionItem ---
  - method: POST
    path: "/salvage-auction/auctions/{id}/items"
    description: "List a SALE_READY vehicle into a SCHEDULED auction"
    roles: [Auctioneer]
    code: 201
    input: [vehicle_id]
    output: AuctionItem
    side_effects: ["AuctionItem QUEUED, sequence_number null; Vehicle LISTED"]

  - method: GET
    path: "/salvage-auction/auctions/{id}/items"
    description: "List items of an auction"
    roles: [PlatformAdmin, YardOperator, Auctioneer, SellerAgent, Buyer, TitleClerk]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "AuctionItem[]"
    side_effects: []

  - method: GET
    path: "/salvage-auction/vehicles/{id}/auction-items"
    description: "List auction items for a vehicle (FK reverse reachability)"
    roles: [PlatformAdmin, YardOperator, Auctioneer, SellerAgent, Buyer, TitleClerk]
    code: 200
    input: ["limit?", "offset?"]
    output: "AuctionItem[]"
    side_effects: []

  - method: GET
    path: "/salvage-auction/auction-items/{id}"
    description: "Get an auction item"
    roles: [PlatformAdmin, YardOperator, Auctioneer, SellerAgent, Buyer, TitleClerk]
    code: 200
    input: []
    output: AuctionItem
    side_effects: []

  - method: POST
    path: "/salvage-auction/auctions/{id}/items/{itemId}/open-lot"
    description: "Open the next lot in sequence"
    roles: [Auctioneer]
    code: 200
    input: []
    output: AuctionItem
    side_effects: ["Item LIVE; prelim snapshot; high_bid initialized from prelim; reserve_met computed; Auction.current_sequence_number advanced; Vehicle LIVE"]

  - method: POST
    path: "/salvage-auction/auctions/{id}/items/{itemId}/close-lot"
    description: "Close the live lot; produces Sale per sale_type and reserve handling"
    roles: [Auctioneer]
    code: 200
    input: []
    output: Sale
    side_effects: ["Item CLOSED; Vehicle SOLD or ON_APPROVAL_PENDING; Sale + Settlement side effects per state machine"]

  - method: POST
    path: "/salvage-auction/auctions/{id}/items/{itemId}/cancel"
    description: "Cancel a queued item"
    roles: [Auctioneer]
    code: 200
    input: []
    output: AuctionItem
    side_effects: ["Item CANCELLED; Vehicle back to SALE_READY"]

  # --- Bid ---
  - method: POST
    path: "/salvage-auction/bids"
    description: "Place a preliminary (item QUEUED) or live (item LIVE) bid"
    roles: [Buyer]
    code: 201
    input: [auction_item_id, amount_cents]
    output: Bid
    side_effects: ["bid_type derived from item status; license_eligibility evaluated; previous winning bid's is_winning := false; this bid is_winning := true; high_bid_cents / high_bidder_id and reserve_met recomputed; increments AuctionItem.version"]

  - method: GET
    path: "/salvage-auction/bids"
    description: "List bids (filterable by item and member)"
    roles: [PlatformAdmin, YardOperator, Auctioneer, SellerAgent, Buyer, TitleClerk]
    code: 200
    input: ["limit?", "offset?", "auction_item_id?", "member_id?"]
    output: "Bid[]"
    side_effects: []

  - method: GET
    path: "/salvage-auction/bids/{id}"
    description: "Get a bid"
    roles: [PlatformAdmin, YardOperator, Auctioneer, SellerAgent, Buyer, TitleClerk]
    code: 200
    input: []
    output: Bid
    side_effects: []

  # --- Sale ---
  - method: GET
    path: "/salvage-auction/sales"
    description: "List sales"
    roles: [PlatformAdmin, YardOperator, Auctioneer, SellerAgent, Buyer, TitleClerk]
    code: 200
    input: ["limit?", "offset?", "status?", "winner_member_id?", "vehicle_id?", "auction_item_id?"]
    output: "Sale[]"
    side_effects: []

  - method: GET
    path: "/salvage-auction/sales/{id}"
    description: "Get a sale"
    roles: [PlatformAdmin, YardOperator, Auctioneer, SellerAgent, Buyer, TitleClerk]
    code: 200
    input: []
    output: Sale
    side_effects: []

  - method: POST
    path: "/salvage-auction/sales/{id}/approve"
    description: "Seller approves an on-approval sale"
    roles: [SellerAgent]
    code: 200
    input: []
    output: Sale
    side_effects: ["Sale AWAITING_PAYMENT; gate_pass_expires_at := now + 72h; Settlement + title-transfer side effects; Vehicle SOLD"]

  - method: POST
    path: "/salvage-auction/sales/{id}/reject-offer"
    description: "Seller rejects an on-approval high bid"
    roles: [SellerAgent]
    code: 200
    input: []
    output: Sale
    side_effects: ["Sale CANCELLED; winning bid released; Vehicle SALE_READY"]

  - method: POST
    path: "/salvage-auction/sales/{id}/cancel"
    description: "Seller unwinds a sale before payment"
    roles: [SellerAgent]
    code: 200
    input: []
    output: Sale
    side_effects: ["Sale CANCELLED; Settlement DRAFT zeroed; TitleRecord RECEIVED; title_brand restored; Vehicle SALE_READY"]

  - method: POST
    path: "/salvage-auction/sales/{id}/payments"
    description: "Buyer pays the exact hammer + buyer fee (+ accrued storage)"
    roles: [Buyer]
    code: 201
    input: [amount_cents]
    output: Sale
    side_effects: ["Sale PAID; Settlement FINALIZED; Vehicle RELEASED"]

  # --- GatePass ---
  - method: POST
    path: "/salvage-auction/sales/{id}/gate-passes"
    description: "Issue a gate pass with a load-out slot (sale must be PAID else ERR_SALE_NOT_PAID; only one ISSUED/CHECKED_IN pass per sale else ERR_GATE_PASS_ALREADY_ACTIVE; slot_end > slot_start and duration <= 8h else ERR_SLOT_WINDOW_INVALID)"
    roles: [Buyer, YardOperator]
    code: 201
    input: [slot_start, slot_end]
    output: GatePass
    side_effects: ["status ISSUED; storage_fee_cents = 0 until check-in"]

  - method: GET
    path: "/salvage-auction/sales/{id}/gate-passes"
    description: "List gate passes for a sale"
    roles: [PlatformAdmin, YardOperator, Auctioneer, SellerAgent, Buyer, TitleClerk]
    code: 200
    input: ["limit?", "offset?"]
    output: "GatePass[]"
    side_effects: []

  - method: GET
    path: "/salvage-auction/gate-passes/{id}"
    description: "Get a gate pass"
    roles: [PlatformAdmin, YardOperator, Auctioneer, SellerAgent, Buyer, TitleClerk]
    code: 200
    input: []
    output: GatePass
    side_effects: []

  - method: POST
    path: "/salvage-auction/gate-passes/{id}/check-in"
    description: "Check in at the yard inside the slot window; computes winner storage fee"
    roles: [YardOperator]
    code: 200
    input: []
    output: GatePass
    side_effects: ["status CHECKED_IN; storage_fee_cents computed (winner_window variant)"]

  - method: POST
    path: "/salvage-auction/gate-passes/{id}/complete"
    description: "Complete load-out"
    roles: [YardOperator]
    code: 200
    input: []
    output: GatePass
    side_effects: ["status COMPLETED; Vehicle LOADED_OUT; Settlement PAID"]

  # --- Settlement ---
  - method: GET
    path: "/salvage-auction/sales/{id}/settlement"
    description: "Get the settlement for a sale (array of 0 or 1)"
    roles: [PlatformAdmin, Auctioneer, SellerAgent, TitleClerk]
    code: 200
    input: []
    output: "Settlement[]"
    side_effects: []

  - method: GET
    path: "/salvage-auction/settlements"
    description: "List settlements, filterable by seller"
    roles: [PlatformAdmin, Auctioneer, SellerAgent, TitleClerk]
    code: 200
    input: ["limit?", "offset?", "seller_id?", "status?"]
    output: "Settlement[]"
    side_effects: []

  - method: GET
    path: "/salvage-auction/settlements/{id}"
    description: "Get a settlement by id"
    roles: [PlatformAdmin, Auctioneer, SellerAgent, TitleClerk]
    code: 200
    input: []
    output: Settlement
    side_effects: []

  # --- ExportDocument ---
  - method: POST
    path: "/salvage-auction/sales/{id}/export-documents"
    description: "Submit an export document for a sale won by a non-US member"
    roles: [Buyer, PlatformAdmin]
    code: 201
    input: [document_type, destination_country]
    output: ExportDocument
    side_effects: ["status SUBMITTED"]

  - method: GET
    path: "/salvage-auction/sales/{id}/export-documents"
    description: "List export documents for a sale"
    roles: [PlatformAdmin, YardOperator, Auctioneer, SellerAgent, Buyer, TitleClerk]
    code: 200
    input: ["limit?", "offset?"]
    output: "ExportDocument[]"
    side_effects: []

  - method: GET
    path: "/salvage-auction/export-documents/{id}"
    description: "Get an export document"
    roles: [PlatformAdmin, YardOperator, Auctioneer, SellerAgent, Buyer, TitleClerk]
    code: 200
    input: []
    output: ExportDocument
    side_effects: []

  - method: POST
    path: "/salvage-auction/export-documents/{id}/verify"
    description: "Verify a submitted export document"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: ExportDocument
    side_effects: ["status VERIFIED (from SUBMITTED only, ERR_EXPORT_DOC_INVALID_STATE)"]

  - method: POST
    path: "/salvage-auction/export-documents/{id}/reject"
    description: "Reject a submitted export document"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: ExportDocument
    side_effects: ["status REJECTED (from SUBMITTED only, ERR_EXPORT_DOC_INVALID_STATE)"]

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-ID / X-User-Role header missing or role not declared" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for endpoint, or entity-backed ownership check failed (Buyer not the sale winner; SellerAgent not the vehicle's seller)" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, malformed type, enum outside declared set, VIN not 17 chars, slot_end <= slot_start, amount <= 0" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_vehicle_version does not match Vehicle.version at mark-ready" }
  - { id: ERR_YARD_NOT_FOUND, http: 404, condition: "yard id does not exist" }
  - { id: ERR_SELLER_NOT_FOUND, http: 404, condition: "seller id does not exist" }
  - { id: ERR_MEMBER_NOT_FOUND, http: 404, condition: "member id does not exist" }
  - { id: ERR_LICENSE_NOT_FOUND, http: 404, condition: "license id does not exist" }
  - { id: ERR_VEHICLE_NOT_FOUND, http: 404, condition: "vehicle id does not exist" }
  - { id: ERR_TITLE_NOT_FOUND, http: 404, condition: "title record id does not exist" }
  - { id: ERR_AUCTION_NOT_FOUND, http: 404, condition: "auction id does not exist" }
  - { id: ERR_AUCTION_ITEM_NOT_FOUND, http: 404, condition: "auction item id does not exist" }
  - { id: ERR_SALE_NOT_FOUND, http: 404, condition: "sale id does not exist" }
  - { id: ERR_GATE_PASS_NOT_FOUND, http: 404, condition: "gate pass id does not exist" }
  - { id: ERR_EXPORT_DOC_NOT_FOUND, http: 404, condition: "export document id does not exist" }
  - { id: ERR_EMAIL_TAKEN, http: 409, condition: "member email already registered" }
  - { id: ERR_VIN_DUPLICATE, http: 409, condition: "VIN already assigned to another vehicle" }
  - { id: ERR_TITLE_ALREADY_EXISTS, http: 409, condition: "vehicle already has a title record" }
  - { id: ERR_VEHICLE_ALREADY_LISTED, http: 409, condition: "vehicle already has a QUEUED or LIVE auction item" }
  - { id: ERR_SELLER_SUSPENDED, http: 409, condition: "SUSPENDED seller cannot assign new vehicles" }
  - { id: ERR_YARD_CLOSED, http: 409, condition: "CLOSED yard cannot receive new assignments" }
  - { id: ERR_VEHICLE_INVALID_STATE, http: 409, condition: "vehicle not in a state that allows this operation" }
  - { id: ERR_VEHICLE_NOT_IMAGE_READY, http: 409, condition: "mark-ready with image_count < 5" }
  - { id: ERR_VEHICLE_INCOMPLETE_CONDITION, http: 409, condition: "mark-ready without a submitted condition report or with empty damage_codes" }
  - { id: ERR_VEHICLE_NOT_SALE_READY, http: 409, condition: "listing requires vehicle in SALE_READY" }
  - { id: ERR_VEHICLE_NOT_CANCELLABLE, http: 409, condition: "cancel requires vehicle in ASSIGNED | AWAITING_CONDITION | SALE_READY | LISTED | LIVE" }
  - { id: ERR_TITLE_NOT_RECEIVED, http: 409, condition: "mark-ready requires a RECEIVED title record" }
  - { id: ERR_TITLE_NON_TRANSFERABLE, http: 409, condition: "close-lot blocked: title transferability NON_TRANSFERABLE" }
  - { id: ERR_TITLE_EXPORT_ONLY, http: 403, condition: "bid by US member on a vehicle whose title transferability is EXPORT_ONLY" }
  - { id: ERR_AUCTION_NOT_SCHEDULED, http: 409, condition: "operation requires auction in SCHEDULED" }
  - { id: ERR_AUCTION_NOT_LIVE, http: 409, condition: "open-lot requires auction LIVE" }
  - { id: ERR_AUCTION_NOT_YET_STARTED, http: 409, condition: "start before scheduled_start" }
  - { id: ERR_AUCTION_EMPTY, http: 409, condition: "start with no QUEUED items" }
  - { id: ERR_AUCTION_ITEM_NOT_QUEUED, http: 409, condition: "cancel requires item QUEUED" }
  - { id: ERR_AUCTION_ITEM_NOT_LIVE, http: 409, condition: "close-lot requires item LIVE" }
  - { id: ERR_AUCTION_ITEM_ALREADY_LIVE, http: 409, condition: "another lot is already LIVE in this auction" }
  - { id: ERR_AUCTION_ITEM_OUT_OF_ORDER, http: 409, condition: "open-lot skipped the running order (sequence_number != current_sequence_number + 1)" }
  - { id: ERR_NO_BIDS, http: 409, condition: "close-lot with no bids (high_bid_cents == 0)" }
  - { id: ERR_RESERVE_NOT_MET, http: 409, condition: "close-lot on PURE / MINIMUM_BID vehicle with reserve_met == false" }
  - { id: ERR_LICENSE_REQUIRED, http: 403, condition: "vehicle lot_type not covered by the member's effective tier for the yard's state (license missing, wrong state, revoked, or expired)" }
  - { id: ERR_MEMBER_SUSPENDED, http: 403, condition: "SUSPENDED member cannot bid" }
  - { id: ERR_BID_INCREMENT_TOO_SMALL, http: 422, condition: "live bid < high_bid_cents + 2500" }
  - { id: ERR_BID_SELF_OUTBID, http: 422, condition: "member is already the high bidder on this item" }
  - { id: ERR_SALE_NOT_PENDING_APPROVAL, http: 409, condition: "approve / reject-offer requires sale PENDING_APPROVAL" }
  - { id: ERR_SALE_NOT_AWAITING_PAYMENT, http: 409, condition: "payment requires sale AWAITING_PAYMENT" }
  - { id: ERR_SALE_NOT_CANCELLABLE, http: 409, condition: "sale cancel requires PENDING_APPROVAL or AWAITING_PAYMENT" }
  - { id: ERR_SELLER_MISMATCH, http: 403, condition: "SellerAgent does not own the seller of this sale/vehicle" }
  - { id: ERR_PAYMENT_AMOUNT_MISMATCH, http: 422, condition: "payment != winning_bid_cents + buyer_fee_cents + outstanding winner storage" }
  - { id: ERR_SALE_NOT_PAID, http: 409, condition: "gate pass issuance requires sale PAID" }
  - { id: ERR_GATE_PASS_ALREADY_ACTIVE, http: 409, condition: "sale already has an ISSUED or CHECKED_IN gate pass" }
  - { id: ERR_GATE_PASS_INVALID_STATE, http: 409, condition: "check-in requires ISSUED; complete requires CHECKED_IN" }
  - { id: ERR_GATE_PASS_EXPIRED, http: 409, condition: "check-in after Sale.gate_pass_expires_at (pass marked EXPIRED)" }
  - { id: ERR_SLOT_WINDOW_INVALID, http: 400, condition: "slot duration > 8 hours or slot_end <= slot_start" }
  - { id: ERR_SLOT_CAPACITY_EXCEEDED, http: 409, condition: "slot would make 5 or more overlapping ISSUED/CHECKED_IN gate passes at the yard in the containing 1-hour window" }
  - { id: ERR_EXPORT_DOCUMENT_REQUIRED, http: 409, condition: "check-in for non-US winner without a VERIFIED export document" }
  - { id: ERR_EXPORT_DOC_INVALID_STATE, http: 409, condition: "verify/reject requires export document SUBMITTED" }
  - { id: ERR_EXPORT_DOC_COUNTRY_MISMATCH, http: 422, condition: "destination_country != winner Member.country_code" }

# =============================================================================
# Table 7: RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Platform operator; manages yards, sellers, members, licenses; verifies export documents; drives the test clock"
    identity: opaque
    exclusive_operations:
      - "POST /yards"
      - "POST /sellers"
      - "POST /members"
      - "POST /_clock/set_current_utc"
      - "POST /export-documents/{id}/verify"
      - "POST /export-documents/{id}/reject"
    shared_operations:
      - "POST /members/{id}/licenses (with TitleClerk)"
      - "POST /sales/{id}/export-documents (with Buyer)"
      - "All GET endpoints"

  - name: SellerAgent
    description: "Insurer/seller representative; assigns vehicles, decides on-approval sales, unwinds pre-payment sales"
    identity: "entity_backed:Seller"
    exclusive_operations:
      - "POST /vehicles"
      - "POST /vehicles/{id}/cancel"
      - "POST /sales/{id}/approve"
      - "POST /sales/{id}/reject-offer"
      - "POST /sales/{id}/cancel"
    shared_operations:
      - "GET endpoints for yards, sellers, vehicles, auctions, items, bids, sales, settlements, gate passes"

  - name: YardOperator
    description: "Yard staff; documents condition, images, readiness, gate pass check-in/completion"
    identity: opaque
    exclusive_operations:
      - "POST /vehicles/{id}/images"
      - "POST /vehicles/{id}/condition"
      - "POST /vehicles/{id}/mark-ready"
      - "POST /gate-passes/{id}/check-in"
      - "POST /gate-passes/{id}/complete"
    shared_operations:
      - "POST /sales/{id}/gate-passes (with Buyer)"
      - "GET endpoints"

  - name: Auctioneer
    description: "Runs auction events; schedules, lists items, sequences lots, falls the hammer"
    identity: opaque
    exclusive_operations:
      - "POST /auctions"
      - "POST /auctions/{id}/start"
      - "POST /auctions/{id}/items"
      - "POST /auctions/{id}/items/{itemId}/open-lot"
      - "POST /auctions/{id}/items/{itemId}/close-lot"
      - "POST /auctions/{id}/items/{itemId}/cancel"
    shared_operations:
      - "GET endpoints"

  - name: Buyer
    description: "Registered bidding member; bids, pays, books load-out"
    identity: "entity_backed:Member"
    exclusive_operations:
      - "POST /bids"
      - "POST /sales/{id}/payments"
    shared_operations:
      - "POST /sales/{id}/gate-passes (with YardOperator) — only on own sale"
      - "POST /sales/{id}/export-documents (with PlatformAdmin) — only on own sale"
      - "GET endpoints"

  - name: TitleClerk
    description: "Title processing clerk; records title acquisition, supports licensing"
    identity: opaque
    exclusive_operations:
      - "POST /vehicles/{id}/title"
    shared_operations:
      - "POST /members/{id}/licenses (with PlatformAdmin)"
      - "GET endpoints"
