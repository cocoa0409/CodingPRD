              as: SafetyOfficer
              as_user_id: "so-1"
              captures: { final_score: $.data.final_un_score, outcome: $.data.outcome }
          assert:
            - "Dossier.${doss_id}.final_un_score == 85.0"
            - "Dossier.${doss_id}.outcome == PASS"

