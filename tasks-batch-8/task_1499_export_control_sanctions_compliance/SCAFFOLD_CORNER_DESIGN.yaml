            - "Party.${party_id}.screening_posture == \"CLEAR\""

  # =================================================================
  # Section: calculations
  # =================================================================
  - section: calculations
    instances:
      - name: de_minimis_boundary_group_e_ten_percent
        claim_type: threshold_boundary
        grounds: [calculations.license_determination]
        distinguishing_aspect: "De minimis boundary is strictly-greater: controlled_content_pct exactly == 10 to Group-E destination IRN is NOT_REQUIRED; 11 is LICENSE_REQUIRED. (No EMBARGOED_COUNTRY entry exists for IRN, so order creation is allowed.)"
        test_recipe:
          setup:
            - "Product LOW (pct 10) and product HIGH (pct 11), both EAR ECCN 5A002 CLASSIFIED; clean party"
          setup_api_calls:
            - call: "POST /compliance/products"
              payload: { sku: "P-020", name: "Chip Low", controlled_content_pct: 10, unit_value_cents: 100 }
              as: ComplianceAnalyst
              captures: { pl_id: $.data.id, pl_v: $.data.version }
            - call: "POST /compliance/classifications"
              payload: { product_id: "${pl_id}", expected_product_version: "${pl_v}", jurisdiction: "EAR", classification_code: "5A002", determination_basis: "SELF_CLASSIFICATION" }
              as: ComplianceAnalyst
              captures: { cl_id: $.data.id }
            - call: "POST /compliance/classifications/${cl_id}/submit"
              payload: {}
              as: ComplianceAnalyst
              as_user_id: "analyst-1"
            - call: "POST /compliance/classifications/${cl_id}/review"
              payload: { decision: "APPROVE" }
              as: ComplianceManager
              as_user_id: "manager-1"
            - call: "POST /compliance/products"
              payload: { sku: "P-021", name: "Chip High", controlled_content_pct: 11, unit_value_cents: 100 }
              as: ComplianceAnalyst
              captures: { ph_id: $.data.id, ph_v: $.data.version }
            - call: "POST /compliance/classifications"
              payload: { product_id: "${ph_id}", expected_product_version: "${ph_v}", jurisdiction: "EAR", classification_code: "5A002", determination_basis: "SELF_CLASSIFICATION" }
              as: ComplianceAnalyst
              captures: { ch_id: $.data.id }
            - call: "POST /compliance/classifications/${ch_id}/submit"
              payload: {}
              as: ComplianceAnalyst
              as_user_id: "analyst-1"
            - call: "POST /compliance/classifications/${ch_id}/review"
              payload: { decision: "APPROVE" }
              as: ComplianceManager
              as_user_id: "manager-1"
            - call: "POST /compliance/parties"
              payload: { legal_name: "Caspian Trade PJSC", country_code: "IRN", city: "Tehran", party_type: "CUSTOMER" }
              as: TradeOpsSpecialist
              captures: { party_id: $.data.id }
          trigger:
            - call: "POST /compliance/orders"
              payload: { product_id: "${pl_id}", party_id: "${party_id}", destination_country: "IRN", end_use: "CIVILIAN", quantity: 1 }
              as: TradeOpsSpecialist
              captures: { o_low: $.data.id, det_low: $.data.provisional_determination }
            - call: "POST /compliance/orders"
              payload: { product_id: "${ph_id}", party_id: "${party_id}", destination_country: "IRN", end_use: "CIVILIAN", quantity: 1 }
              as: TradeOpsSpecialist
              captures: { o_high: $.data.id, det_high: $.data.provisional_determination }
          assert:
            - "det_low == \"NOT_REQUIRED\" (10 > 10 is false)"
            - "det_high == \"LICENSE_REQUIRED\" (11 > 10)"

      - name: itar_jurisdiction_always_requires_license
        claim_type: correct_result
        grounds: [calculations.license_determination]
        distinguishing_aspect: "ITAR jurisdiction short-circuits de minimis and end-use analysis: even a CIVILIAN order to an allied destination (GBR) with 0% content is LICENSE_REQUIRED."
        test_recipe:
          setup: ["product with ACTIVE ITAR classification (USML category XI); clean party"]
          setup_api_calls:
            - call: "POST /compliance/products"
              payload: { sku: "P-022", name: "Launcher Part", controlled_content_pct: 0, unit_value_cents: 5000 }
              as: ComplianceAnalyst
              captures: { p_id: $.data.id, p_v: $.data.version }
            - call: "POST /compliance/classifications"
              payload: { product_id: "${p_id}", expected_product_version: "${p_v}", jurisdiction: "ITAR", classification_code: "XI", determination_basis: "CJ_DETERMINATION" }
              as: ComplianceAnalyst
              captures: { c_id: $.data.id }
            - call: "POST /compliance/classifications/${c_id}/submit"
              payload: {}
              as: ComplianceAnalyst
              as_user_id: "analyst-1"
            - call: "POST /compliance/classifications/${c_id}/review"
              payload: { decision: "APPROVE" }
              as: ComplianceManager
              as_user_id: "manager-1"
            - call: "POST /compliance/parties"
              payload: { legal_name: "Royal Armouries Ltd", country_code: "GBR", city: "Leeds", party_type: "CUSTOMER" }
              as: TradeOpsSpecialist
              captures: { party_id: $.data.id }
          trigger:
