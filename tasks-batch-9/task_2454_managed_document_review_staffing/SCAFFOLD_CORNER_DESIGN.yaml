            - "Assignment.${af_id}.billable_amount_cents == 127800 (600 * 213) and pace_dph == 55.38"
            - "GET /matters/${m_id}/spend-projection reports basis_applied \"LEDGER_REPLAY_BASIS\", ledger_replay_basis_cents 127800, qc_surcharge_cents 2556, provisional_total_cents 130356, volume_discount_pct 0.03, volume_discount_cents 3911 and invoice_total_cents 126445"

      - name: closed_matter_and_released_batch_reject_further_writes
        claim_type: terminal_state_lockdown
        grounds:
