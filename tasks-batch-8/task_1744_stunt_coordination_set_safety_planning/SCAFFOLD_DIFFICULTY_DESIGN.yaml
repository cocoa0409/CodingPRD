# =============================================================================
# Task 1744 — §1.8 Scaffold Difficulty Design (Test Targeting Index)
# 21 instances across the nine Difficulty Rules of SKILL.md §0.5
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  # Rule 1 — dual_variant_calc (risk domain on StuntSequence; pay domain on PayAdjustment)
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: dv_risk_screening_vs_board_divergence
        grounds:
          - calculations.risk_score
          - state_machines.StuntSequence.DRAFT_to_DESIGN_LOCKED
          - entities.RiskAssessment.fields.screening_score
          - entities.StuntSequence.fields.board_score
        distinguishing_aspect: |
          Risk domain (StuntSequence/RiskAssessment): identical severity 5 x likelihood 5 data yields
          screening_score 25 (band CRITICAL) under the screening variant, but board_score 27 under the board
          variant with FIGHT hazard weight — the same data passes category consistency yet fails the lock
          threshold; the mitigation credit (-3) brings the same SxL to 24 and locks.
        test_recipe:
          setup:
            - "Production in SETUP (no activation needed for design lock)"
            - "Sequence A: FIGHT / CRITICAL, assessment S5 L5, no mitigation -> screening 25, board 27"
            - "Sequence B: FIGHT / CRITICAL, assessment S5 L5, with mitigation notes -> screening 25, board 24"
          setup_api_calls:
            - call: "POST /api/productions"
              payload: { name: "DV Risk Prod", total_budget_cents: 10000000 }
              as: ProductionExecutive
              captures: { prod_id: $.data.id }
            - call: "POST /api/stunt-sequences"
              payload: { production_id: "${prod_id}", name: "Seq A", hazard_class: "FIGHT", risk_category: "CRITICAL", scheduled_execution_start: "2026-08-05T00:00:00Z", scheduled_execution_end: "2026-08-06T00:00:00Z", required_equipment_ids: [] }
              as: StuntCoordinator
              as_user_id: "coord-1"
              captures: { seq_a: $.data.id, seq_a_v: $.data.version }
            - call: "POST /api/risk-assessments"
              payload: { production_id: "${prod_id}", sequence_id: "${seq_a}", severity_rating: 5, likelihood_rating: 5, expected_sequence_version: "${seq_a_v}" }
              as: StuntCoordinator
              as_user_id: "coord-1"
              captures: { ra_a: $.data.id, ra_a_screening: $.data.screening_score }
            - call: "POST /api/risk-assessments/${ra_a}/submit"
              as: StuntCoordinator
              as_user_id: "coord-1"
            - call: "POST /api/risk-assessments/${ra_a}/approve"
              as: SafetyOfficer
              as_user_id: "so-1"
            - call: "POST /api/stunt-sequences"
              payload: { production_id: "${prod_id}", name: "Seq B", hazard_class: "FIGHT", risk_category: "CRITICAL", scheduled_execution_start: "2026-08-05T00:00:00Z", scheduled_execution_end: "2026-08-06T00:00:00Z", required_equipment_ids: [] }
              as: StuntCoordinator
              as_user_id: "coord-1"
              captures: { seq_b: $.data.id, seq_b_v: $.data.version }
            - call: "POST /api/risk-assessments"
              payload: { production_id: "${prod_id}", sequence_id: "${seq_b}", severity_rating: 5, likelihood_rating: 5, mitigation_notes: "Full wire decelerator rig and doubled spotters", expected_sequence_version: "${seq_b_v}" }
              as: StuntCoordinator
              as_user_id: "coord-1"
              captures: { ra_b: $.data.id }
            - call: "POST /api/risk-assessments/${ra_b}/submit"
              as: StuntCoordinator
              as_user_id: "coord-1"
            - call: "POST /api/risk-assessments/${ra_b}/approve"
              as: SafetyOfficer
              as_user_id: "so-1"
          trigger:
            - call: "POST /api/stunt-sequences/${seq_a}/lock-design"
              as: StuntCoordinator
              as_user_id: "coord-1"
              captures: { err_a: $.data.error_id }
            - call: "POST /api/stunt-sequences/${seq_b}/lock-design"
              as: StuntCoordinator
              as_user_id: "coord-1"
              captures: { seq_b_board: $.data.board_score }
          assert:
            - "RiskAssessment.${ra_a}.screening_score == 25"
            - "lock-design on ${seq_a} rejected: err_a == ERR_RISK_SCORE_ABOVE_THRESHOLD, http 422 (board 27 >= 26)"
            - "lock-design on ${seq_b} succeeds: StuntSequence.${seq_b}.board_score == 24 and status == DESIGN_LOCKED"
            - "Same severity/likelihood (5x5) yields screening 25 but board 27 or 24 depending solely on variant inputs"

      - name: dv_pay_provisional_vs_final_settlement
        grounds:
          - calculations.adjustment_payout
          - entities.PayAdjustment.fields.provisional_estimate_cents
          - entities.PayAdjustment.fields.final_amount_cents
          - entities.PayAdjustment.fields.payable_amount_cents
          - state_machines.StuntExecution.ATTEMPTED_to_COMPLETED
        distinguishing_aspect: |
          Pay domain (PayAdjustment, different entity domain from dv_risk): provisional_estimate assumes one
          planned take with requested_pct, while final_settlement uses negotiated current_pct plus the ACTUAL
          completed take count; identical base 200000 / pct 0.10 data yields provisional 270000 vs payable
          320000 after two completed takes.
        test_recipe:
          setup:
            - "ACTIVE production with FILED insurance; LOW/FIGHT sequence in READY (1 rehearsal done, 4 signoffs signed)"
            - "QUALIFIED performer with FIGHT certification; AGREED adjustment base 200000 pct 0.10"
          setup_api_calls:
            - call: "POST /api/productions"
              payload: { name: "DV Pay Prod", total_budget_cents: 10000000 }
              as: ProductionExecutive
              captures: { prod_id: $.data.id }
            - call: "POST /api/productions/${prod_id}/file-insurance"
              payload: { declared_exposure_cents: 50000000 }
              as: ProductionExecutive
            - call: "POST /api/productions/${prod_id}/activate"
              as: ProductionExecutive
            - call: "POST /api/stunt-sequences"
              payload: { production_id: "${prod_id}", name: "Fight Seq", hazard_class: "FIGHT", risk_category: "LOW", scheduled_execution_start: "2026-08-05T00:00:00Z", scheduled_execution_end: "2026-08-06T00:00:00Z", required_equipment_ids: [] }
              as: StuntCoordinator
              as_user_id: "coord-1"
              captures: { seq_id: $.data.id, seq_v: $.data.version }
            - call: "POST /api/risk-assessments"
              payload: { production_id: "${prod_id}", sequence_id: "${seq_id}", severity_rating: 2, likelihood_rating: 2, expected_sequence_version: "${seq_v}" }
              as: StuntCoordinator
              as_user_id: "coord-1"
              captures: { ra_id: $.data.id }
            - call: "POST /api/risk-assessments/${ra_id}/submit"
              as: StuntCoordinator
              as_user_id: "coord-1"
            - call: "POST /api/risk-assessments/${ra_id}/approve"
              as: SafetyOfficer
              as_user_id: "so-1"
            - call: "POST /api/stunt-sequences/${seq_id}/lock-design"
              as: StuntCoordinator
              as_user_id: "coord-1"
            - call: "POST /api/performers"
              payload: { production_id: "${prod_id}", first_name: "Rey", last_name: "Koa", base_day_rate_cents: 200000, union_status: "NON_UNION" }
              as: StuntCoordinator
              as_user_id: "coord-1"
              captures: { perf_id: $.data.id }
            - call: "POST /api/certifications"
              payload: { performer_id: "${perf_id}", discipline: "FIGHT", level: "ADVANCED", issued_at: "2026-01-01T00:00:00Z", expires_at: "2027-01-01T00:00:00Z" }
              as: StuntCoordinator
              as_user_id: "coord-1"
            - call: "POST /api/rehearsals"
              payload: { production_id: "${prod_id}", sequence_id: "${seq_id}", performer_id: "${perf_id}", facility: "Stage 1", scheduled_start: "2026-08-02T10:00:00Z", scheduled_end: "2026-08-02T11:30:00Z" }
              as: StuntCoordinator
              as_user_id: "coord-1"
              captures: { reh_id: $.data.id }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T10:30:00Z" }
              as: ProductionExecutive
            - call: "POST /api/rehearsals/${reh_id}/complete"
              as: StuntCoordinator
              as_user_id: "coord-1"
            - call: "POST /api/safety-meetings"
              payload: { production_id: "${prod_id}", sequence_id: "${seq_id}", facility: "Stage 2", scheduled_start: "2026-08-03T10:00:00Z", scheduled_end: "2026-08-03T11:00:00Z" }
              as: StuntCoordinator
              as_user_id: "coord-1"
              captures: { mtg_id: $.data.id }
            - call: "POST /api/safety-meetings/${mtg_id}/start"
              as: SafetyOfficer
              as_user_id: "so-1"
            - call: "GET /api/department-signoffs?meeting_id=${mtg_id}&department=CAMERA"
              as: SafetyOfficer
              captures: { sg_cam: "$.data[0].id" }
            - call: "GET /api/department-signoffs?meeting_id=${mtg_id}&department=ELECTRIC"
              as: SafetyOfficer
              captures: { sg_ele: "$.data[0].id" }
            - call: "GET /api/department-signoffs?meeting_id=${mtg_id}&department=GRIP"
              as: SafetyOfficer
              captures: { sg_grip: "$.data[0].id" }
            - call: "GET /api/department-signoffs?meeting_id=${mtg_id}&department=STUNTS"
              as: SafetyOfficer
              captures: { sg_stunts: "$.data[0].id" }
            - call: "POST /api/department-signoffs/${sg_cam}/sign"
              as: DepartmentHead
              as_user_id: "dh-1"
            - call: "POST /api/department-signoffs/${sg_ele}/sign"
              as: DepartmentHead
              as_user_id: "dh-1"
            - call: "POST /api/department-signoffs/${sg_grip}/sign"
              as: DepartmentHead
              as_user_id: "dh-1"
            - call: "POST /api/department-signoffs/${sg_stunts}/sign"
              as: DepartmentHead
              as_user_id: "dh-1"
            - call: "POST /api/safety-meetings/${mtg_id}/complete"
              as: SafetyOfficer
              as_user_id: "so-1"
            - call: "POST /api/stunt-sequences/${seq_id}/mark-ready"
              as: StuntCoordinator
              as_user_id: "coord-1"
              captures: { seq_v_ready: $.data.version }
            - call: "POST /api/pay-adjustments"
              payload: { production_id: "${prod_id}", sequence_id: "${seq_id}", performer_id: "${perf_id}", adjustment_type: "HAZARD_BUMP", base_amount_cents: 200000, requested_pct: 0.10 }
              as: Performer
              as_user_id: "${perf_id}"
              captures: { adj_id: $.data.id, adj_prov: $.data.provisional_estimate_cents }
            - call: "POST /api/pay-adjustments/${adj_id}/agree"
              as: StuntCoordinator
              as_user_id: "coord-1"
              captures: { adj_final: $.data.final_amount_cents }
          trigger:
            - call: "POST /api/stunt-executions"
              payload: { production_id: "${prod_id}", sequence_id: "${seq_id}", take_number: 1, expected_sequence_version: "${seq_v_ready}" }
              as: StuntCoordinator
              as_user_id: "coord-1"
              captures: { ex1: $.data.id }
            - call: "POST /api/stunt-executions/${ex1}/complete"
              as: StuntCoordinator
              as_user_id: "coord-1"
            - call: "GET /api/stunt-sequences/${seq_id}"
              as: StuntCoordinator
              captures: { seq_v2: $.data.version }
            - call: "POST /api/stunt-executions"
              payload: { production_id: "${prod_id}", sequence_id: "${seq_id}", take_number: 2, expected_sequence_version: "${seq_v2}" }
              as: StuntCoordinator
              as_user_id: "coord-1"
              captures: { ex2: $.data.id }
            - call: "POST /api/stunt-executions/${ex2}/complete"
              as: StuntCoordinator
              as_user_id: "coord-1"
            - call: "GET /api/pay-adjustments/${adj_id}"
              as: StuntCoordinator
              captures: { adj_payable: $.data.payable_amount_cents }
          assert:
            - "adj_prov == 270000 (200000 + round_half_up(200000*0.10) + 50000*1 planned take)"
            - "adj_final == 220000 (200000 + 20000)"
            - "adj_payable == 320000 after two COMPLETED takes (220000 + 50000*2)"
            - "Identical base/pct data: provisional 270000 != payable 320000 — the two variants diverge on planned vs actual takes"

  # ---------------------------------------------------------------------------
  # Rule 2 — combinatorial_formula (three instances, modes a, b, c)
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: cf_bump_bounds_tiered_floor_cap
        grounds:
          - calculations.hazard_bump_bounds
          - validations[priority=13]
        distinguishing_aspect: |
          Mode (a): the bound formula has >=3 inputs with non-linear interaction — a SAG_AFTRA floor via
          max(10% of base, 15000), a tiered per-category cap, and a special-equipment cap surcharge;
          bump 10000 is rejected below the union floor while 20000 passes against cap 35000.
        test_recipe:
          setup:
            - "Production SETUP; MEDIUM/FIGHT sequence in DRAFT; QUALIFIED SAG_AFTRA performer (base 100000)"
          setup_api_calls:
            - call: "POST /api/productions"
              payload: { name: "Bounds Prod", total_budget_cents: 10000000 }
              as: ProductionExecutive
              captures: { prod_id: $.data.id }
            - call: "POST /api/stunt-sequences"
              payload: { production_id: "${prod_id}", name: "Medium Seq", hazard_class: "FIGHT", risk_category: "MEDIUM", scheduled_execution_start: "2026-08-05T00:00:00Z", scheduled_execution_end: "2026-08-06T00:00:00Z", required_equipment_ids: [] }
              as: StuntCoordinator
              as_user_id: "coord-1"
              captures: { seq_id: $.data.id }
            - call: "POST /api/performers"
              payload: { production_id: "${prod_id}", first_name: "Uma", last_name: "Sag", base_day_rate_cents: 100000, union_status: "SAG_AFTRA" }
              as: StuntCoordinator
              as_user_id: "coord-1"
              captures: { perf_id: $.data.id }
            - call: "POST /api/certifications"
              payload: { performer_id: "${perf_id}", discipline: "FIGHT", level: "BASIC", issued_at: "2026-01-01T00:00:00Z", expires_at: "2027-01-01T00:00:00Z" }
              as: StuntCoordinator
              as_user_id: "coord-1"
          trigger:
            - call: "POST /api/pay-adjustments"
              payload: { production_id: "${prod_id}", sequence_id: "${seq_id}", performer_id: "${perf_id}", adjustment_type: "HAZARD_BUMP", base_amount_cents: 100000, requested_pct: 0.10 }
              as: Performer
              as_user_id: "${perf_id}"
              captures: { err_low: $.data.error_id }
            - call: "POST /api/pay-adjustments"
              payload: { production_id: "${prod_id}", sequence_id: "${seq_id}", performer_id: "${perf_id}", adjustment_type: "HAZARD_BUMP", base_amount_cents: 100000, requested_pct: 0.20 }
              as: Performer
              as_user_id: "${perf_id}"
              captures: { adj_id: $.data.id, adj_prov: $.data.provisional_estimate_cents }
          assert:
            - "First create rejected: err_low == ERR_BUMP_OUT_OF_RANGE (bump 10000 < union floor max(10000, 15000) = 15000)"
            - "Second create succeeds: adj_prov == 170000 (100000 + 20000 + 50000), within cap round_half_up(100000*0.35)=35000"

      - name: cf_rollup_per_line_rounding_order
        grounds:
          - calculations.production_cost_rollup
          - entities.Production.fields.committed_pay_cents
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters — the scaffold pins round-half-up PER LINE then sum;
          two AGREED lines of 133507 (base 100005, pct 0.335) commit 267014, whereas the unpinned
          sum-then-round interpretation yields 267013.
        test_recipe:
          setup:
            - "Production SETUP budget 10000000; MEDIUM/FIGHT sequence DRAFT; two QUALIFIED NON_UNION performers"
          setup_api_calls:
            - call: "POST /api/productions"
              payload: { name: "Rollup Prod", total_budget_cents: 10000000 }
              as: ProductionExecutive
              captures: { prod_id: $.data.id }
            - call: "POST /api/stunt-sequences"
              payload: { production_id: "${prod_id}", name: "Rollup Seq", hazard_class: "FIGHT", risk_category: "MEDIUM", scheduled_execution_start: "2026-08-05T00:00:00Z", scheduled_execution_end: "2026-08-06T00:00:00Z", required_equipment_ids: [] }
              as: StuntCoordinator
              as_user_id: "coord-1"
              captures: { seq_id: $.data.id }
            - call: "POST /api/performers"
              payload: { production_id: "${prod_id}", first_name: "Ann", last_name: "One", base_day_rate_cents: 100005, union_status: "NON_UNION" }
              as: StuntCoordinator
              as_user_id: "coord-1"
              captures: { perf1: $.data.id }
            - call: "POST /api/performers"
              payload: { production_id: "${prod_id}", first_name: "Bob", last_name: "Two", base_day_rate_cents: 100005, union_status: "NON_UNION" }
              as: StuntCoordinator
              as_user_id: "coord-1"
              captures: { perf2: $.data.id }
            - call: "POST /api/certifications"
              payload: { performer_id: "${perf1}", discipline: "FIGHT", level: "BASIC", issued_at: "2026-01-01T00:00:00Z", expires_at: "2027-01-01T00:00:00Z" }
              as: StuntCoordinator
              as_user_id: "coord-1"
            - call: "POST /api/certifications"
              payload: { performer_id: "${perf2}", discipline: "FIGHT", level: "BASIC", issued_at: "2026-01-01T00:00:00Z", expires_at: "2027-01-01T00:00:00Z" }
              as: StuntCoordinator
              as_user_id: "coord-1"
            - call: "POST /api/pay-adjustments"
              payload: { production_id: "${prod_id}", sequence_id: "${seq_id}", performer_id: "${perf1}", adjustment_type: "HAZARD_BUMP", base_amount_cents: 100005, requested_pct: 0.335 }
              as: Performer
              as_user_id: "${perf1}"
              captures: { adj1: $.data.id }
            - call: "POST /api/pay-adjustments"
              payload: { production_id: "${prod_id}", sequence_id: "${seq_id}", performer_id: "${perf2}", adjustment_type: "HAZARD_BUMP", base_amount_cents: 100005, requested_pct: 0.335 }
              as: Performer
              as_user_id: "${perf2}"
              captures: { adj2: $.data.id }
          trigger:
            - call: "POST /api/pay-adjustments/${adj1}/agree"
              as: StuntCoordinator
              as_user_id: "coord-1"
              captures: { adj1_final: $.data.final_amount_cents }
            - call: "POST /api/pay-adjustments/${adj2}/agree"
              as: StuntCoordinator
              as_user_id: "coord-1"
            - call: "GET /api/productions/${prod_id}"
              as: ProductionExecutive
              captures: { committed: $.data.committed_pay_cents }
          assert:
            - "adj1_final == 133507 (100005 + round_half_up(100005*0.335 = 33501.675) = 133507)"
            - "Production.${prod_id}.committed_pay_cents == 267014 — per-line rounding then sum"
            - "267014 != 267013 which sum-then-round would produce; rounding order is observable"

      - name: cf_budget_reserve_evaluation_order
        grounds:
          - calculations.budget_authority_check
          - validations[priority=14]
        distinguishing_aspect: |
          Mode (c): circular-looking dependency — the 10% reserve depends on committed pay which the agreement
          itself changes; the pinned order evaluates the reserve on the PRE-request committed snapshot, so after
          a 900000 commitment the available headroom is exactly 90000 and a 90001 line is rejected.
        test_recipe:
          setup:
            - "Production SETUP budget 1000000; MEDIUM/FIGHT sequence DRAFT; two QUALIFIED NON_UNION performers"
            - "Adjustment 1 base 900000 pct 0.0 AGREED (line 900000 == available 900000 passes at equality)"
          setup_api_calls:
            - call: "POST /api/productions"
              payload: { name: "Budget Prod", total_budget_cents: 1000000 }
              as: ProductionExecutive
              captures: { prod_id: $.data.id }
            - call: "POST /api/stunt-sequences"
              payload: { production_id: "${prod_id}", name: "Budget Seq", hazard_class: "FIGHT", risk_category: "MEDIUM", scheduled_execution_start: "2026-08-05T00:00:00Z", scheduled_execution_end: "2026-08-06T00:00:00Z", required_equipment_ids: [] }
              as: StuntCoordinator
              as_user_id: "coord-1"
              captures: { seq_id: $.data.id }
            - call: "POST /api/performers"
              payload: { production_id: "${prod_id}", first_name: "Cal", last_name: "Tre", base_day_rate_cents: 900000, union_status: "NON_UNION" }
              as: StuntCoordinator
              as_user_id: "coord-1"
              captures: { perf1: $.data.id }
            - call: "POST /api/performers"
              payload: { production_id: "${prod_id}", first_name: "Dee", last_name: "Qua", base_day_rate_cents: 90001, union_status: "NON_UNION" }
              as: StuntCoordinator
              as_user_id: "coord-1"
              captures: { perf2: $.data.id }
            - call: "POST /api/certifications"
              payload: { performer_id: "${perf1}", discipline: "FIGHT", level: "BASIC", issued_at: "2026-01-01T00:00:00Z", expires_at: "2027-01-01T00:00:00Z" }
              as: StuntCoordinator
              as_user_id: "coord-1"
            - call: "POST /api/certifications"
              payload: { performer_id: "${perf2}", discipline: "FIGHT", level: "BASIC", issued_at: "2026-01-01T00:00:00Z", expires_at: "2027-01-01T00:00:00Z" }
              as: StuntCoordinator
              as_user_id: "coord-1"
            - call: "POST /api/pay-adjustments"
              payload: { production_id: "${prod_id}", sequence_id: "${seq_id}", performer_id: "${perf1}", adjustment_type: "HAZARD_BUMP", base_amount_cents: 900000, requested_pct: 0.0 }
              as: Performer
              as_user_id: "${perf1}"
              captures: { adj1: $.data.id }
            - call: "POST /api/pay-adjustments"
              payload: { production_id: "${prod_id}", sequence_id: "${seq_id}", performer_id: "${perf2}", adjustment_type: "HAZARD_BUMP", base_amount_cents: 90001, requested_pct: 0.0 }
              as: Performer
              as_user_id: "${perf2}"
              captures: { adj2: $.data.id }
            - call: "POST /api/pay-adjustments/${adj1}/agree"
              as: StuntCoordinator
              as_user_id: "coord-1"
          trigger:
            - call: "POST /api/pay-adjustments/${adj2}/agree"
              as: StuntCoordinator
              as_user_id: "coord-1"
              captures: { err2: $.data.error_id }
            - call: "GET /api/productions/${prod_id}"
              as: ProductionExecutive
              captures: { committed: $.data.committed_pay_cents }
          assert:
            - "Adjustment 1 agree succeeded at exact equality: line 900000 <= available 900000 (reserve 100000 on pre-request committed 0)"
            - "Adjustment 2 agree rejected: err2 == ERR_BUDGET_EXCEEDED, http 402 — reserve computed on pre-request committed 900000 gives available 90000 < 90001"
            - "Production.${prod_id}.committed_pay_cents == 900000 (rejected agreement commits nothing)"
  # ---------------------------------------------------------------------------
  # Rule 3 — non_linear_state_machine (cycle on RiskAssessment; parallel dims on Production)
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: nsm_assessment_revision_cycle
        grounds:
          - state_machines.RiskAssessment
          - calculations.risk_score
        distinguishing_aspect: |
          Cyclic machine on RiskAssessment: DRAFT -> SUBMITTED -> REJECTED -> (revise) DRAFT -> SUBMITTED ->
          APPROVED; the revise loop recomputes screening_score from the new ratings (8 -> 9) while the second
          machine instance (nsm_production_parallel_dimensions) lives on a different entity.
        test_recipe:
          setup:
            - "Production SETUP; MEDIUM/FIGHT sequence DRAFT; assessment v1 S2 L4 (screening 8, MEDIUM band)"
          setup_api_calls:
            - call: "POST /api/productions"
              payload: { name: "Cycle Prod", total_budget_cents: 10000000 }
              as: ProductionExecutive
              captures: { prod_id: $.data.id }
            - call: "POST /api/stunt-sequences"
              payload: { production_id: "${prod_id}", name: "Cycle Seq", hazard_class: "FIGHT", risk_category: "MEDIUM", scheduled_execution_start: "2026-08-05T00:00:00Z", scheduled_execution_end: "2026-08-06T00:00:00Z", required_equipment_ids: [] }
              as: StuntCoordinator
              as_user_id: "coord-1"
              captures: { seq_id: $.data.id, seq_v: $.data.version }
            - call: "POST /api/risk-assessments"
              payload: { production_id: "${prod_id}", sequence_id: "${seq_id}", severity_rating: 2, likelihood_rating: 4, expected_sequence_version: "${seq_v}" }
              as: StuntCoordinator
              as_user_id: "coord-1"
              captures: { ra_id: $.data.id }
            - call: "POST /api/risk-assessments/${ra_id}/submit"
              as: StuntCoordinator
              as_user_id: "coord-1"
            - call: "POST /api/risk-assessments/${ra_id}/reject"
              payload: { reason: "Mitigations insufficient" }
              as: SafetyOfficer
              as_user_id: "so-1"
          trigger:
            - call: "POST /api/risk-assessments/${ra_id}/revise"
              payload: { severity_rating: 3, likelihood_rating: 3, mitigation_notes: "Added wire decelerators" }
              as: StuntCoordinator
              as_user_id: "coord-1"
              captures: { ra_status: $.data.status, ra_screen: $.data.screening_score }
            - call: "POST /api/risk-assessments/${ra_id}/submit"
              as: StuntCoordinator
              as_user_id: "coord-1"
            - call: "POST /api/risk-assessments/${ra_id}/approve"
              as: SafetyOfficer
              as_user_id: "so-1"
              captures: { ra_final: $.data.status }
          assert:
            - "After revise: ra_status == DRAFT and ra_screen == 9 (3x3 recomputed)"
            - "After resubmit + approve: ra_final == APPROVED — the REJECTED -> DRAFT loop closed and converged"

      - name: nsm_production_parallel_dimensions
        grounds:
          - state_machines.Production (posture machine)
          - state_machines.Production (insurance_status machine)
          - entities.Production.fields.posture
          - entities.Production.fields.insurance_status
        distinguishing_aspect: |
          Parallel state dimensions on Production (a different entity from the RiskAssessment cycle): posture
          SETUP -> ACTIVE -> STOPPED -> ACTIVE evolves independently of insurance_status UNFILED -> FILED ->
          ACKNOWLEDGED; filing is possible while ACTIVE and stoppage never touches insurance state.
        test_recipe:
          setup:
            - "Fresh production; insurance filed after activation to prove the dimensions are independent"
          setup_api_calls:
            - call: "POST /api/productions"
              payload: { name: "Parallel Prod", total_budget_cents: 10000000 }
              as: ProductionExecutive
              captures: { prod_id: $.data.id }
            - call: "POST /api/productions/${prod_id}/activate"
              as: ProductionExecutive
              captures: { err_act: $.data.error_id }
            - call: "POST /api/productions/${prod_id}/file-insurance"
              payload: { declared_exposure_cents: 50000000 }
              as: ProductionExecutive
              captures: { premium: $.data.endorsement_premium_cents }
            - call: "POST /api/productions/${prod_id}/activate"
              as: ProductionExecutive
              captures: { posture1: $.data.posture, ins1: $.data.insurance_status }
            - call: "POST /api/productions/${prod_id}/acknowledge-insurance"
              as: ProductionExecutive
              captures: { posture2: $.data.posture, ins2: $.data.insurance_status }
            - call: "POST /api/productions/${prod_id}/stop"
              payload: { reason: "Weather hold" }
              as: SafetyOfficer
              as_user_id: "so-1"
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T00:00:00Z" }
              as: ProductionExecutive
          trigger:
            - call: "POST /api/productions/${prod_id}/lift-stoppage"
              as: ProductionExecutive
              captures: { posture3: $.data.posture, ins3: $.data.insurance_status }
          assert:
            - "Activate while UNFILED rejected: err_act == ERR_INSURANCE_NOT_FILED, http 409"
            - "premium == 1000000 (50000000 x 0.02 first tier)"
            - "After file+activate: posture1 == ACTIVE and ins1 == FILED (posture moved, insurance independent)"
            - "After acknowledge while ACTIVE: posture2 == ACTIVE and ins2 == ACKNOWLEDGED"
            - "After stop + exact 86400s cooldown + lift: posture3 == ACTIVE and ins3 == ACKNOWLEDGED (stoppage did not touch the insurance dimension)"

  # ---------------------------------------------------------------------------
  # Rule 4 — transitive_cascade (incident trigger depth 3; inspection trigger depth 3)
  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: tc_incident_stoppage_cascade
        grounds:
          - state_machines.Incident
          - state_machines.Production.ACTIVE_to_STOPPED
          - state_machines.StuntSequence.READY_to_SAFETY_HOLD
          - state_machines.Rehearsal.SCHEDULED_to_CANCELLED
        distinguishing_aspect: |
          Depth-3 chain originating from incident reporting: Incident(SERIOUS) -> Production STOPPED (link 1)
          -> READY StuntSequence SAFETY_HOLD (link 2, caused by the posture change) -> its SCHEDULED Rehearsal
          CANCELLED (link 3, caused by the sequence hold); each link is caused by the previous, not by the
          original POST.
        test_recipe:
          setup:
            - "READY LOW/FIGHT sequence (quota met, meeting signed) with one extra SCHEDULED rehearsal r2 in the future"
            - "Production ACTIVE with FILED insurance"
          setup_api_calls:
