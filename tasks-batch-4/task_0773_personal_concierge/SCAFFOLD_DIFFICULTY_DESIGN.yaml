            - { call: "POST /concierge/vendors/${v_id}/suspend", payload: {}, as: AccountManager }
          trigger:
            - { call: "POST /concierge/vendor-engagements/${eng_id}/confirm", payload: {}, as: ConciergeAgent, captures: { err: "$.data.error_id" } }
          assert:
            - "HTTP 409"
            - "response error_id == ERR_VENDOR_INACTIVE"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: member_schedule_half_open_overlap
        grounds:
          - validations[priority=15]
          - state_machines.ServiceRequest.SUBMITTED_to_IN_PROGRESS
          - entities.ServiceRequest.fields.scheduled_start
        distinguishing_aspect: |
          Half-open [start,end) interval semantics on the Membership's own calendar:
          09:00-10:00 (IN_PROGRESS) collides with 09:30-10:30 -> ERR_MEMBER_SCHEDULE_CONFLICT,
          while an adjacent 10:00-11:00 would be allowed. Resource: Membership.
        test_recipe:
          setup:
            - "ACTIVE member + membership; request r1 accepted with window 09:00-10:00 (IN_PROGRESS); request r2 SUBMITTED"
          setup_api_calls:
            - { call: "POST /concierge/members", payload: { full_name: "O", email: "o@x.com" }, as: AccountManager, captures: { m_id: "$.data.id" } }
            - { call: "POST /concierge/members/${m_id}/activate", payload: {}, as: AccountManager, captures: { m_v: "$.data.version" } }
            - { call: "POST /concierge/retainer-plans", payload: { name: "Std", monthly_retainer_cents: 100000, included_hours: 5, overage_rate_cents_per_hour: 6000, default_markup_pct: 0.10, max_pass_through_cents: 40000 }, as: AccountManager, captures: { plan_id: "$.data.id" } }
            - { call: "POST /concierge/members/${m_id}/memberships", payload: { plan_id: "${plan_id}", vip_tier: "STANDARD", expected_member_version: "${m_v}" }, as: AccountManager, captures: { ms_id: "$.data.id" } }
            - { call: "POST /concierge/service-requests", payload: { membership_id: "${ms_id}", category: "ERRAND", title: "r1" }, as: Member, as_user_id: "${m_id}", captures: { sr1: "$.data.id" } }
            - { call: "POST /concierge/service-requests/${sr1}/accept", payload: { scheduled_start: "2026-03-02T09:00:00Z", scheduled_end: "2026-03-02T10:00:00Z" }, as: ConciergeAgent }
            - { call: "POST /concierge/service-requests", payload: { membership_id: "${ms_id}", category: "ERRAND", title: "r2" }, as: Member, as_user_id: "${m_id}", captures: { sr2: "$.data.id" } }
          trigger:
            - { call: "POST /concierge/service-requests/${sr2}/accept", payload: { scheduled_start: "2026-03-02T09:30:00Z", scheduled_end: "2026-03-02T10:30:00Z" }, as: ConciergeAgent, captures: { err: "$.data.error_id" } }
          assert:
            - "HTTP 409"
            - "response error_id == ERR_MEMBER_SCHEDULE_CONFLICT"

      - name: vendor_buffer_closed_interval_overlap
        grounds:
          - validations[priority=20]
          - state_machines.VendorEngagement.PROPOSED_to_CONFIRMED
          - entities.VendorEngagement.fields.service_start
        distinguishing_aspect: |
          Closed-interval-plus-buffer semantics on the Vendor: engagement e1 10:00-11:00
          CONFIRMED blocks e2 11:15-12:15 because the 15-minute gap is below VENDOR_BUFFER_MINUTES=30
          even though the intervals do not overlap -> ERR_VENDOR_WINDOW_CONFLICT. Resource: Vendor
          (a different resource and different interval arithmetic than the half-open member calendar).
        test_recipe:
          setup:
            - "ACTIVE member + membership; two BOOKING requests; one ACTIVE BOOKING vendor; e1 CONFIRMED 10:00-11:00; e2 PROPOSED 11:15-12:15"
          setup_api_calls:
            - { call: "POST /concierge/members", payload: { full_name: "P", email: "p@x.com" }, as: AccountManager, captures: { m_id: "$.data.id" } }
            - { call: "POST /concierge/members/${m_id}/activate", payload: {}, as: AccountManager, captures: { m_v: "$.data.version" } }
            - { call: "POST /concierge/retainer-plans", payload: { name: "Std", monthly_retainer_cents: 100000, included_hours: 5, overage_rate_cents_per_hour: 6000, default_markup_pct: 0.10, max_pass_through_cents: 40000 }, as: AccountManager, captures: { plan_id: "$.data.id" } }
            - { call: "POST /concierge/members/${m_id}/memberships", payload: { plan_id: "${plan_id}", vip_tier: "STANDARD", expected_member_version: "${m_v}" }, as: AccountManager, captures: { ms_id: "$.data.id" } }
            - { call: "POST /concierge/vendors", payload: { name: "Bk", category: "BOOKING" }, as: AccountManager, captures: { v_id: "$.data.id" } }
            - { call: "POST /concierge/service-requests", payload: { membership_id: "${ms_id}", category: "BOOKING", title: "r1" }, as: Member, as_user_id: "${m_id}", captures: { sr1: "$.data.id" } }
            - { call: "POST /concierge/service-requests/${sr1}/engagements", payload: { vendor_id: "${v_id}", billing_mode: "MARKUP", markup_pct: 0.10, estimated_cost_lines: [1000], service_start: "2026-03-06T10:00:00Z", service_end: "2026-03-06T11:00:00Z" }, as: ConciergeAgent, captures: { eng1: "$.data.id" } }
            - { call: "POST /concierge/vendor-engagements/${eng1}/confirm", payload: {}, as: ConciergeAgent }
            - { call: "POST /concierge/service-requests", payload: { membership_id: "${ms_id}", category: "BOOKING", title: "r2" }, as: Member, as_user_id: "${m_id}", captures: { sr2: "$.data.id" } }
            - { call: "POST /concierge/service-requests/${sr2}/engagements", payload: { vendor_id: "${v_id}", billing_mode: "MARKUP", markup_pct: 0.10, estimated_cost_lines: [1000], service_start: "2026-03-06T11:15:00Z", service_end: "2026-03-06T12:15:00Z" }, as: ConciergeAgent, captures: { eng2: "$.data.id" } }
          trigger:
            - { call: "POST /concierge/vendor-engagements/${eng2}/confirm", payload: {}, as: ConciergeAgent, captures: { err: "$.data.error_id" } }
          assert:
            - "HTTP 409"
            - "response error_id == ERR_VENDOR_WINDOW_CONFLICT"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: time_entry_reverse_conserves_minutes
        grounds:
          - state_machines.TimeEntry.FINALIZED_to_REVERSED
          - calculations.overage_charge
          - calculations.hour_bank_remaining
          - entities.BillingCycle.fields.consumed_minutes
        distinguishing_aspect: |
          Conserved quantity = minutes. Invariant BillingCycle.consumed_minutes == sum of
          FINALIZED TimeEntry.minutes for the cycle: after logging 700 then reversing it,
          consumed_minutes returns to 0, overage_charge_cents to 0, hour_bank to 600.
        test_recipe:
          setup:
            - "ACTIVE member + GOLD membership; OPEN cycle 0 (included 600); one request; 700 minutes logged (consumed 700, overage 12000)"
          setup_api_calls:
            - { call: "POST /concierge/members", payload: { full_name: "Q", email: "q@x.com" }, as: AccountManager, captures: { m_id: "$.data.id" } }
            - { call: "POST /concierge/members/${m_id}/activate", payload: {}, as: AccountManager, captures: { m_v: "$.data.version" } }
            - { call: "POST /concierge/retainer-plans", payload: { name: "Gold", monthly_retainer_cents: 300000, included_hours: 10, overage_rate_cents_per_hour: 8000, default_markup_pct: 0.15, max_pass_through_cents: 50000 }, as: AccountManager, captures: { plan_id: "$.data.id" } }
            - { call: "POST /concierge/members/${m_id}/memberships", payload: { plan_id: "${plan_id}", vip_tier: "GOLD", expected_member_version: "${m_v}" }, as: AccountManager, captures: { ms_id: "$.data.id" } }
            - { call: "GET /concierge/billing-cycles?membership_id=${ms_id}", payload: {}, as: AccountManager, captures: { cyc0: "$.data[0].id" } }
            - { call: "POST /concierge/service-requests", payload: { membership_id: "${ms_id}", category: "ERRAND", title: "task" }, as: Member, as_user_id: "${m_id}", captures: { sr_id: "$.data.id" } }
            - { call: "POST /concierge/service-requests/${sr_id}/time-entries", payload: { minutes: 700 }, as: ConciergeAgent, captures: { te_id: "$.data.id" } }
          trigger:
            - { call: "POST /concierge/time-entries/${te_id}/reverse", payload: {}, as: ConciergeAgent }
          assert:
            - "BillingCycle.${cyc0}.consumed_minutes == 0"
            - "BillingCycle.${cyc0}.overage_minutes == 0"
            - "BillingCycle.${cyc0}.overage_charge_cents == 0"
            - "Membership.${ms_id}.hour_bank_remaining_minutes == 600"
            - "Membership.${ms_id}.outstanding_balance_cents == 0"

      - name: engagement_void_conserves_cents
        grounds:
          - state_machines.VendorEngagement.CONFIRMED_to_VOID
          - calculations.membership_outstanding_balance
          - entities.Member.fields.lifetime_billed_cents
        distinguishing_aspect: |
          Conserved quantity = cents (a different quantity than minutes). Invariant
          Membership.outstanding_balance_cents == overage_total + sum of CONFIRMED/RECONCILED
          engagement charges: confirming adds provisional 1100, voiding removes it, so
          outstanding returns to 0 and Member.lifetime_billed_cents to 0.
        test_recipe:
          setup:
            - "ACTIVE member + membership; BOOKING request; engagement CONFIRMED (provisional 1100, outstanding 1100)"
          setup_api_calls:
            - { call: "POST /concierge/members", payload: { full_name: "R", email: "r@x.com" }, as: AccountManager, captures: { m_id: "$.data.id" } }
            - { call: "POST /concierge/members/${m_id}/activate", payload: {}, as: AccountManager, captures: { m_v: "$.data.version" } }
            - { call: "POST /concierge/retainer-plans", payload: { name: "Std", monthly_retainer_cents: 100000, included_hours: 5, overage_rate_cents_per_hour: 6000, default_markup_pct: 0.10, max_pass_through_cents: 40000 }, as: AccountManager, captures: { plan_id: "$.data.id" } }
            - { call: "POST /concierge/members/${m_id}/memberships", payload: { plan_id: "${plan_id}", vip_tier: "STANDARD", expected_member_version: "${m_v}" }, as: AccountManager, captures: { ms_id: "$.data.id" } }
            - { call: "POST /concierge/vendors", payload: { name: "Bk", category: "BOOKING" }, as: AccountManager, captures: { v_id: "$.data.id" } }
            - { call: "POST /concierge/service-requests", payload: { membership_id: "${ms_id}", category: "BOOKING", title: "reserve" }, as: Member, as_user_id: "${m_id}", captures: { sr_id: "$.data.id" } }
            - { call: "POST /concierge/service-requests/${sr_id}/engagements", payload: { vendor_id: "${v_id}", billing_mode: "MARKUP", markup_pct: 0.10, estimated_cost_lines: [1000], service_start: "2026-03-06T10:00:00Z", service_end: "2026-03-06T11:00:00Z" }, as: ConciergeAgent, captures: { eng_id: "$.data.id" } }
            - { call: "POST /concierge/vendor-engagements/${eng_id}/confirm", payload: {}, as: ConciergeAgent }
          trigger:
            - { call: "POST /concierge/vendor-engagements/${eng_id}/void", payload: {}, as: ConciergeAgent }
          assert:
            - "VendorEngagement.${eng_id}.status == VOID"
            - "Membership.${ms_id}.outstanding_balance_cents == 0"
            - "Member.${m_id}.lifetime_billed_cents == 0"
