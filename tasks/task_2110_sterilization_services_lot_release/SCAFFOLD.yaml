# =============================================================================
# Cross-cutting invariants (compensating-action pairs)
# =============================================================================
invariants:
  - name: abated_eto_mass_ledger
    conserved_quantity: "post-abatement ethylene-oxide mass, in kilograms, held on EmissionPermit.consumed_kg_ytd"
    formula: |
      EmissionPermit.consumed_kg_ytd
        == round_half_up( SUM over Cycle C of C.abated_eto_kg
                          WHERE Chamber(C.chamber_id).permit_id == permit.id
                            AND C.status != CANCELLED , 3 )
      AND
      EmissionPermit.total_emission_fee_usd
        == round_half_up( SUM over the same cycle set of C.emission_fee_usd , 2 )
    forward_action: "POST /sterilization/cycles/{id}/start"
    compensating_action: "POST /sterilization/cycles/{id}/abort from RUNNING"
    note: "The abort credits back exactly the stored abated_eto_kg and emission_fee_usd - not a recomputation - so no drift can accumulate across a start/abort pair even when the tier boundary moved in between."

  - name: pallet_conservation
    conserved_quantity: "discrete pallet count, held jointly on Lot.total_pallet_count / staged_pallet_count / available_pallet_count and Cycle.loaded_pallet_count"
    formula: |
      for every Lot L:
        L.staged_pallet_count + L.available_pallet_count == L.total_pallet_count
        AND L.staged_pallet_count == SUM over LoadPosition p WHERE p.lot_id == L.id of p.pallet_count
      for every Cycle C:
        C.loaded_pallet_count == SUM over LoadPosition p WHERE p.cycle_id == C.id of p.pallet_count
    forward_action: "POST /sterilization/cycles/{id}/load-positions"
    compensating_action: "DELETE /sterilization/cycles/{id}/load-positions/{position_id}"
    note: "Both equalities must hold after every load-map mutation, including cascade-driven removals in CASCADE A hop 4 and the bulk removals performed by an abort."
