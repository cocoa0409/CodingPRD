      - name: refresh_cooldown_closed_interval_rejects_exact_upper_bound
        grounds:
          - validations[priority=27]
          - errors[ERR_REFRESH_COOLDOWN_ACTIVE]
          - state_machines.InventoryLot.SELLABLE_to_SELLABLE
          - entities.InventoryLot.fields.last_refresh_charged_at
        distinguishing_aspect: |
          Interval semantics on the InventoryLot resource are CLOSED at both ends: the
          72-hour cooldown occupies [2026-08-01T00:00:00Z, 2026-08-04T00:00:00Z] and a
          refresh landing exactly on the upper bound is INSIDE it and rejected, whereas
          the carrier axis would have accepted a touching boundary. One second later the
          same call succeeds.
        test_recipe:
          setup:
            - "One hazmat-endorsed TX warehouse and model IB-SLF-5 with self_discharge_pct_per_month 5.0."
            - "One 20-unit lot manufactured 2026-03-01 that has just received its first refresh charge at the default clock 2026-08-01T00:00:00Z, so refresh_charge_count is 1 and condition_state is SELLABLE."
            - "The logical clock has been moved to exactly 2026-08-04T00:00:00Z, the closed upper bound of the cooldown."
          setup_api_calls:
            - call: "POST /distribution/warehouses"
              payload: { code: "TX-DAL", state_code: "TX", hazmat_endorsement: true, storm_reserve_pct: 0.0, dock_capacity_kg_per_window: 100000.0 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { wh_tx: $.data.id }
            - call: "POST /distribution/battery-models"
              payload: { sku: "IB-SLF-5", chemistry: "AGM", nominal_voltage: 12, amp_hour_capacity: 100, peukert_exponent: 1.10, unit_weight_kg: 20.0, lead_content_kg: 10.0, core_deposit_cents: 2000, list_price_cents: 20000, warranty_free_replacement_months: 24, warranty_prorata_months: 36, shelf_life_days: 540, self_discharge_pct_per_month: 5.0 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { m_slf: $.data.id }
            - call: "POST /distribution/inventory-lots"
              payload: { battery_model_id: "${m_slf}", warehouse_id: "${wh_tx}", manufactured_on: "2026-03-01", quantity_on_hand: 20 }
              as: WarehouseOperator
              as_user_id: "op-1"
              captures: { lot: $.data.id, soc0: $.data.state_of_charge_pct }
            - call: "POST /distribution/inventory-lots/${lot}/refresh-charge"
              payload: { measured_open_circuit_voltage: 12.75 }
              as: WarehouseOperator
              as_user_id: "op-1"
              captures: { cnt1: $.data.refresh_charge_count, soc1: $.data.state_of_charge_pct }
            - call: "POST /distribution/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-04T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /distribution/inventory-lots/${lot}/refresh-charge"
              payload: { measured_open_circuit_voltage: 12.80 }
              as: WarehouseOperator
              as_user_id: "op-1"
              captures: { err: $.data.error_id }
            - call: "POST /distribution/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-04T00:00:01Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /distribution/inventory-lots/${lot}/refresh-charge"
              payload: { measured_open_circuit_voltage: 12.80 }
              as: WarehouseOperator
              as_user_id: "op-1"
              captures: { cnt2: $.data.refresh_charge_count }
          assert:
            - "${soc0} == 75.0"
            - "${cnt1} == 1"
            - "${soc1} == 100.0"
            - "HTTP status of the first trigger call == 409"
            - "${err} == ERR_REFRESH_COOLDOWN_ACTIVE"
            - "${cnt2} == 2"
            - "InventoryLot.${lot}.last_refresh_charged_at == 2026-08-04T00:00:01.000Z"
            - "InventoryLot.${lot}.condition_state == SELLABLE"

  - rule_id: compensating_invariant
    instances:

      - name: allocate_then_cancel_conserves_reserved_unit_count
        grounds:
          - state_machines.Order.SUBMITTED_to_ALLOCATED
          - state_machines.Order.ALLOCATED_to_CANCELLED
          - entities.InventoryLot.fields.quantity_reserved
          - entities.InventoryLot.fields.quantity_on_hand
          - calculations.lot_allocation_selector
        distinguishing_aspect: |
          Conserved quantity: physical UNITS. The named invariant is
          sum over lots of quantity_reserved == sum of allocated_quantity over OrderLines
          whose Order.fulfillment_status IN {ALLOCATED, SHIPPED}, and quantity_on_hand is
          untouched by both the forward and the compensating action. After allocate the
          pair reads 12 and 12; after cancel it reads 0 and 0 with quantity_on_hand still
          40.
        test_recipe:
          setup:
            - "One hazmat-endorsed TX warehouse, one STANDARD TX account, model IB-31-FLD and a single 40-unit lot manufactured 2026-06-01."
            - "One order of 12 units with core_expected_count 0, submitted and then allocated against that lot."
          setup_api_calls:
            - call: "POST /distribution/warehouses"
              payload: { code: "TX-DAL", state_code: "TX", hazmat_endorsement: true, storm_reserve_pct: 0.0, dock_capacity_kg_per_window: 100000.0 }
              as: PlatformAdmin
              as_user_id: "admin-1"
              captures: { wh_tx: $.data.id }
