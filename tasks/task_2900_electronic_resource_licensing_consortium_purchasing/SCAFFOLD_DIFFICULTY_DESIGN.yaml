          DECIDED_RESTRUCTURE, the contract axis is ACTIVE and the title swap is well formed, but six
          off-campus incidents have driven access_health_score to 52 and degraded the access axis. The
          RESTRUCTURE execution alone carries an access_status == CONFIGURED precondition, so the call
