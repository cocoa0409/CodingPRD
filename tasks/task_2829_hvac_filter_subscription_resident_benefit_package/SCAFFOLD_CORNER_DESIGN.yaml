  - section: cross_cutting_complexity_layers
    instances:

      - name: stale_expected_subscription_version_on_transfer_create_returns_412
        claim_type: optimistic_concurrency
        grounds: [concurrency_rules.transfer-create-stale-subscription, validations.priority_7, errors.ERR_STALE_SUBSCRIPTION_VERSION]
        distinguishing_aspect: "This is OCC on a CREATE rather than an update: the client's token is the parent Subscription's version, that version advances behind the client's back when an unrelated write lands, and the refused create must neither consume the token nor bump the version."
        test_recipe:
          setup:
            - "Fixture A activated 2026-08-05: Subscription version becomes 2 and the client records that value."
            - "An unrelated write — a renewal survey, which also increments Subscription.version — advances the row to version 3 behind the client's back."
            - "Destination unit A-201 is AVAILABLE and the clock stays at 2026-08-05 so priorities 25 and 26 are both satisfied."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramOperator
            - call: "POST /filter-skus"
