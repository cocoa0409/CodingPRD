        distinguishing_aspect: "After a re-assessment the old assessment is still a perfectly valid row that can be fetched by id, but it can no longer carry advice: quoting it on POST /dispositions is refused while the replacement assessment is accepted in the same call state, so the check reads the assessment's own status rather than the call's."
