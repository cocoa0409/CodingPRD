          rationale: "Activation precondition ERR_PLAN_RETIRED requires a plan-retire endpoint that does not exist in §1.5. The cross-entity state dependency for Subscription activate is already covered by the access-profile instance; the RETIRED branch is not independently reachable without additional endpoints."

