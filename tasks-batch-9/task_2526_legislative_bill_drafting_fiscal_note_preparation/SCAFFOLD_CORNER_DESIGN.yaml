          - validations[priority 140].ERR_UNAPPLIED_CORRECTIONS
          - validations[priority 130].ERR_SUBSTANTIVE_CORRECTION_FORBIDDEN
        distinguishing_aspect: "The final signature is conditional on state living in a CHILD collection: the chain itself is complete and in order, yet transmittal is refused purely because one proposed correction is still open, and the correction can only be cleared by a counsel other than its proposer."
        test_recipe:
          setup:
            - "CONVENED session; HOUSE bill b (appropriation 0) reported FAVORABLE, passed and enrolled, so the EnrolledBill sits at PREPARED with origin_signature_role SPEAKER and expected_next_signature SPEAKER."
            - "Drafter d1 proposes the correction; senior counsel rc2 (not the proposer) is available to apply it."
