              payload: { report_basis: "CALENDAR", period_year: 2027, report_note: "next year" }
              as: Licensee
              as_user_id: "u_lic_a"
              captures: { err_future: $.data.error_id }
            - call: "POST /relicensing/orders/${order}/annual-report"
              payload: { report_basis: "CALENDAR", period_year: 2026, report_note: "first calendar report" }
              as: Licensee
              as_user_id: "u_lic_a"
              captures: { assessed1: $.data.assessed_obligation_count, non1: $.data.noncompliant_obligation_count, score1: $.data.compliance_score, state1: $.data.compliance_state, basis1: $.data.last_report_basis }
            - call: "POST /relicensing/orders/${order}/annual-report"
              payload: { report_basis: "CALENDAR", period_year: 2026, report_note: "same pair again" }
              as: Licensee
              as_user_id: "u_lic_a"
              captures: { err_dup: $.data.error_id }
            - call: "POST /relicensing/orders/${order}/annual-report"
              payload: { report_basis: "LICENSE_ANNIVERSARY", period_year: 2026, report_note: "anniversary report" }
              as: Licensee
              as_user_id: "u_lic_a"
              captures: { assessed2: $.data.assessed_obligation_count, non2: $.data.noncompliant_obligation_count, score2: $.data.compliance_score, state2: $.data.compliance_state, basis2: $.data.last_report_basis }
            - call: "GET /relicensing/projects/${proj}"
              payload: {}
              as: Regulator
              captures: { flags: $.data.compliance_flag_count, posture: $.data.regulatory_posture }
          assert:
            - "${eff} == 2026-08-01 and the only obligation is due 2027-02-01"
            - "${err_future} == ERR_REPORT_PERIOD_INVALID with HTTP 409 (CALENDAR 2027 starts 2027-01-01, after the clock)"
            - "${assessed1} == 0, ${non1} == 0, ${score1} == 100.00, ${state1} == EFFECTIVE and ${basis1} == CALENDAR"
            - "${err_dup} == ERR_REPORT_PERIOD_INVALID with HTTP 409 for the repeated CALENDAR 2026 pair"
            - "${assessed2} == 1, ${non2} == 1, ${score2} == 0.00 and ${basis2} == LICENSE_ANNIVERSARY (window 2026-08-01 .. 2027-07-31 catches the 2027-02-01 obligation)"
            - "${state2} == COMPLIANCE_FLAGGED, ${flags} == 1 and ${posture} == FROZEN"

      - name: application_filing_priority_between_stage_and_burden_checks
        claim_type: priority_conflict
        grounds:
          - validations[priority=43]
          - validations[priority=72]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / application_filing_stage_error_precedes_burden_ratio_error
          rationale: "The named §1.8 instance violates both rules in one request and asserts the stage error, then repairs the stage to surface ERR_BURDEN_RATIO_EXCEEDED."

      - name: study_creation_priority_between_window_and_clearance_checks
        claim_type: priority_conflict
        grounds:
          - validations[priority=60]
          - validations[priority=65]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / study_creation_window_conflict_precedes_cultural_clearance_error
          rationale: "The named §1.8 instance violates the window rule and the clearance rule in one payload and asserts the window error wins."

      - name: study_window_overlap_at_the_same_site_rejected
        claim_type: temporal_validation
        grounds:
          - validations[priority=60]
          - errors[ERR_SITE_WINDOW_CONFLICT]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / study_site_half_open_window_plus_rest_buffer_boundary
          rationale: "The named §1.8 instance tests the half-open boundary with and without the rest buffer, including the exact touch case."

      - name: dam_activity_capacity_is_an_aggregate_check
        claim_type: aggregate_validation
        grounds:
          - validations[priority=66]
          - errors[ERR_DAM_ACTIVITY_CAPACITY_EXCEEDED]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / dam_activity_capacity_counts_closed_windows_touching_at_one_day
          rationale: "The named §1.8 instance schedules individually valid windows until the aggregate exceeds max_concurrent_field_activities."

      - name: settlement_execution_requires_an_approved_plan
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=51]
          - errors[ERR_STUDY_PLAN_NOT_APPROVED]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / settlement_execution_blocked_by_unapproved_study_plan_state
          rationale: "The named §1.8 instance tallies with a plan that is only UNDER_AGENCY_REVIEW and then executes after approval."

  # ===========================================================================
  - section: endpoints
    instances:
      - name: project_patch_updates_the_name_and_bumps_the_version
        claim_type: standard_crud
        grounds:
          - endpoints["PATCH /relicensing/projects/{project_id}"]
          - endpoints["POST /relicensing/projects"]
        distinguishing_aspect: "The only update endpoint on the registry accepts each optional field independently: a name-only patch bumps the version and leaves the ledger untouched, while patching base_annual_generation_mwh re-runs the ledger and the posture in the same request."
        test_recipe:
          setup:
            - "One project P-9042 with base_annual_generation_mwh 250000 and no measures, so every ledger field is zero."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: Regulator
            - call: "POST /relicensing/projects"
              payload: { license_number: "P-9042", project_name: "Patch Reach", installed_capacity_mw: 12.0, base_annual_generation_mwh: 250000, license_expiration_date: "2035-06-30" }
              as: Regulator
              captures: { proj: $.data.id, v0: $.data.version }
          trigger:
            - call: "PATCH /relicensing/projects/${proj}"
              payload: { project_name: "Patch Reach Renamed" }
              as: Regulator
              captures: { name1: $.data.project_name, v1: $.data.version, cost1: $.data.total_pme_annual_cost_usd, ratio1: $.data.burden_ratio_pct }
            - call: "PATCH /relicensing/projects/${proj}"
              payload: { base_annual_generation_mwh: 500000, infeasibility_waiver_granted: true }
              as: Regulator
              captures: { base2: $.data.base_annual_generation_mwh, waiver2: $.data.infeasibility_waiver_granted, v2: $.data.version, ratio2: $.data.burden_ratio_pct, infeas2: $.data.economically_infeasible, posture2: $.data.regulatory_posture }
            - call: "GET /relicensing/projects/${proj}"
              payload: {}
              as: Licensee
              as_user_id: "u_lic_a"
              captures: { name3: $.data.project_name, lic3: $.data.license_number, v3: $.data.version }
          assert:
            - "${v0} == 1, ${v1} == 2 and ${v2} == 3 (one increment per patch)"
            - "${name1} == Patch Reach Renamed while ${cost1} == 0.00 and ${ratio1} == 0.00"
            - "${base2} == 500000, ${waiver2} == true, ${ratio2} == 0.00, ${infeas2} == false and ${posture2} == OPEN"
            - "${name3} == Patch Reach Renamed, ${lic3} == P-9042 and ${v3} == 3 (the read does not bump the version)"

      - name: signature_links_a_settlement_to_a_party
        claim_type: cross_reference_link
        grounds:
          - endpoints["POST /relicensing/signatures"]
          - endpoints["GET /relicensing/signatures"]
          - entities.SettlementSignature
        distinguishing_aspect: "A signature is the junction row between a Settlement and a SettlementParty: both referenced rows must exist, the row is stamped with the settlement's current round_number, share_pct stays null until the tally, and the link is reachable from the party side."
        test_recipe:
          setup:
            - "Project P-9043 with an APPROVED study plan, an AGENCY party (u_agency) and a TRIBE party (u_tribe), and a CIRCULATED settlement in round 1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: Regulator
            - call: "POST /relicensing/projects"
              payload: { license_number: "P-9043", project_name: "Signature Reach", installed_capacity_mw: 12.0, base_annual_generation_mwh: 250000, license_expiration_date: "2035-06-30" }
              as: Regulator
              captures: { proj: $.data.id }
            - call: "POST /relicensing/sites"
              payload: { project_id: "${proj}", site_code: "S1", river_mile: 1.0 }
              as: Licensee
              as_user_id: "u_lic_a"
              captures: { site: $.data.id }
            - call: "POST /relicensing/projects/${proj}/pre-application-document"
              payload: { filing_note: "PAD" }
              as: Licensee
              as_user_id: "u_lic_a"
            - call: "POST /relicensing/study-plans"
              payload: { project_id: "${proj}", plan_title: "Study Plan 1" }
              as: Licensee
              as_user_id: "u_lic_a"
              captures: { plan: $.data.id }
            - call: "POST /relicensing/studies"
              payload: { study_plan_id: "${plan}", site_id: "${site}", resource_category: "RECREATION", study_title: "Recreation use survey", fieldwork_window_start: "2026-09-01", fieldwork_window_end: "2026-10-01" }
              as: Licensee
              as_user_id: "u_lic_a"
              captures: { study: $.data.id }
            - call: "POST /relicensing/study-plans/${plan}/submit"
              payload: { submission_note: "plan for review" }
              as: Licensee
              as_user_id: "u_lic_a"
            - call: "POST /relicensing/studies/${study}/fieldwork"
              payload: { action: "START" }
              as: Licensee
              as_user_id: "u_lic_a"
            - call: "POST /relicensing/studies/${study}/fieldwork"
              payload: { action: "COMPLETE" }
              as: Licensee
              as_user_id: "u_lic_a"
            - call: "POST /relicensing/studies/${study}/report"
              payload: { report_note: "final report" }
              as: Licensee
              as_user_id: "u_lic_report"
            - call: "POST /relicensing/parties"
              payload: { project_id: "${proj}", party_name: "State Fish Agency", party_type: "AGENCY", has_conditioning_authority: true, vote_weight: 1, contact_user_id: "u_agency" }
              as: Regulator
              captures: { pa: $.data.id }
            - call: "POST /relicensing/parties"
              payload: { project_id: "${proj}", party_name: "River Tribe", party_type: "TRIBE", vote_weight: 1, contact_user_id: "u_tribe" }
              as: Regulator
              captures: { pt: $.data.id }
            - call: "POST /relicensing/studies/${study}/review-decision"
              payload: { decision: "ACCEPT" }
              as: AgencyReviewer
              as_user_id: "u_agency"
            - call: "POST /relicensing/study-plans/${plan}/determination"
              payload: { determination: "APPROVE" }
              as: AgencyReviewer
              as_user_id: "u_agency"
            - call: "GET /relicensing/projects/${proj}"
              payload: {}
              as: Licensee
              as_user_id: "u_lic_a"
              captures: { pv: $.data.version }
            - call: "POST /relicensing/settlements"
              payload: { project_id: "${proj}", title: "Comprehensive settlement", expected_project_version: "${pv}" }
              as: Licensee
              as_user_id: "u_lic_a"
              captures: { stl: $.data.id }
            - call: "POST /relicensing/settlements/${stl}/circulate"
              payload: { circulation_note: "round 1 for signature" }
              as: Licensee
              as_user_id: "u_lic_a"
          trigger:
            - call: "POST /relicensing/signatures"
              payload: { settlement_id: "00000000-0000-4000-8000-000000000000", party_id: "${pa}", position: "SUPPORT" }
              as: AgencyReviewer
              as_user_id: "u_agency"
              captures: { err_stl: $.data.error_id }
            - call: "POST /relicensing/signatures"
              payload: { settlement_id: "${stl}", party_id: "00000000-0000-4000-8000-000000000000", position: "SUPPORT" }
              as: AgencyReviewer
              as_user_id: "u_agency"
              captures: { err_party: $.data.error_id }
            - call: "POST /relicensing/signatures"
              payload: { settlement_id: "${stl}", party_id: "${pa}", position: "SUPPORT" }
              as: AgencyReviewer
              as_user_id: "u_agency"
              captures: { sig: $.data.id, rnd: $.data.round_number, share: $.data.share_pct, pos: $.data.position }
            - call: "GET /relicensing/signatures"
              payload: { party_id: "${pa}" }
              as: Licensee
              as_user_id: "u_lic_a"
              captures: { back_stl: "$.data[0].settlement_id", back_party: "$.data[0].party_id" }
            - call: "GET /relicensing/signatures"
              payload: { party_id: "${pt}" }
              as: Licensee
              as_user_id: "u_lic_a"
          assert:
            - "${err_stl} == ERR_SETTLEMENT_NOT_FOUND with HTTP 404"
            - "${err_party} == ERR_PARTY_NOT_FOUND with HTTP 404"
            - "the third call returns HTTP 201 with ${rnd} == 1, ${pos} == SUPPORT and ${share} == null"
            - "${back_stl} == ${stl} and ${back_party} == ${pa} with total_count == 1 for the agency party"
            - "the last list returns total_count == 0 rows for the tribe party, which never signed"

      - name: compliance_sweep_is_idempotent_at_a_fixed_clock
        claim_type: action_endpoint
        grounds:
          - endpoints["POST /relicensing/projects/{project_id}/run-compliance-sweep"]
          - complexity_layers.ops_run_checkpoint
        distinguishing_aspect: "The ops-run checkpoint is a no-op the second time it runs at the same clock: the certification it just waived keeps its original decided_at instead of being re-stamped, and no counter moves."
        test_recipe:
          setup:
            - "Project P-9044 in STUDY_PHASE with a REQUESTED certification whose statutory_waiver_date is 2027-08-01, clock moved to exactly that date."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: Regulator
            - call: "POST /relicensing/projects"
              payload: { license_number: "P-9044", project_name: "Sweep Reach", installed_capacity_mw: 12.0, base_annual_generation_mwh: 250000, license_expiration_date: "2035-06-30" }
              as: Regulator
              captures: { proj: $.data.id }
            - call: "POST /relicensing/projects/${proj}/pre-application-document"
              payload: { filing_note: "PAD" }
              as: Licensee
              as_user_id: "u_lic_a"
            - call: "POST /relicensing/study-plans"
              payload: { project_id: "${proj}", plan_title: "Study Plan 1" }
              as: Licensee
              as_user_id: "u_lic_a"
            - call: "POST /relicensing/water-quality-certifications"
              payload: { project_id: "${proj}", certifying_agency_name: "State DEQ" }
              as: Licensee
              as_user_id: "u_lic_a"
              captures: { wqc: $.data.id, waive: $.data.statutory_waiver_date }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-08-01T00:00:00Z" }
              as: Regulator
          trigger:
            - call: "POST /relicensing/projects/${proj}/run-compliance-sweep"
              payload: {}
              as: Regulator
              captures: { w1: $.data.wqc_status, sweep1: $.data.last_sweep_at, flags1: $.data.compliance_flag_count, posture1: $.data.regulatory_posture }
            - call: "GET /relicensing/water-quality-certifications/${wqc}"
              payload: {}
              as: Regulator
              captures: { st1: $.data.status, dec1: $.data.decided_at }
            - call: "POST /relicensing/projects/${proj}/run-compliance-sweep"
              payload: {}
              as: Regulator
              captures: { w2: $.data.wqc_status, sweep2: $.data.last_sweep_at, flags2: $.data.compliance_flag_count, posture2: $.data.regulatory_posture }
            - call: "GET /relicensing/water-quality-certifications/${wqc}"
              payload: {}
              as: Regulator
              captures: { st2: $.data.status, dec2: $.data.decided_at }
          assert:
            - "${waive} == 2027-08-01 (requested_at date plus 12 months)"
            - "${st1} == WAIVED, ${dec1} == 2027-08-01T00:00:00Z, ${w1} == WAIVED and ${sweep1} == 2027-08-01T00:00:00Z"
            - "${st2} == WAIVED and ${dec2} == 2027-08-01T00:00:00Z (the second sweep does not re-stamp the decision)"
            - "${w2} == WAIVED, ${sweep2} == 2027-08-01T00:00:00Z, ${flags1} == 0, ${flags2} == 0 and ${posture1} == ${posture2} == OPEN"

      - name: application_cure_is_only_available_from_deficient_or_suspended
