              payload: { service_code: "CONTRACEPTIVE_COUNSELING", provider_id: "${provx_id}", channel: "TELEHEALTH", patient_location_state: "TX", scheduled_start: "2026-09-11T10:00:00Z", scheduled_end: "2026-09-11T10:30:00Z" }
              as: FrontDeskStaff
              captures: { err_id: $.data.error_id }
          assert:
            - "ProviderLicense.${licx_id}.status == EXPIRED (derived from logical clock)"
            - "status 422 and error_id == ERR_TELEHEALTH_LICENSE_GAP"
            - "GET /family-planning/patients/${x1_id}/encounters returns 0 rows"

      - name: claim_creation_gated_by_encounter_clinical_state
        grounds:
          - state_machines.Encounter.transitions
          - state_machines.Claim.DRAFT_to_SUBMITTED
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: |
          Entity pair Claim -> Encounter (different pair from instance 1): claim
          creation is only legal once the parent Encounter's clinical axis reaches
          COMPLETED — on an IN_PROGRESS encounter the same call is a state error.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01 -> 2026-09-10T10:00:00Z. Affiliate TX, tiers A-D, catalog CONTRACEPTIVE_COUNSELING, licensed provider."
            - "Adult insured non-confidential tier-C patient; encounter started (IN_PROGRESS) but not completed."
          setup_api_calls:
            - *clock_0901
            - *aff_tx
            - *tier_a
            - *tier_b
            - *tier_c
            - *tier_d
            - *cat_counsel
            - *prov_tx
            - *lic_tx
            - call: "POST /family-planning/affiliates/${aff_id}/patients"
              payload: { external_ref: "X2", date_of_birth: "1990-01-01", insurance_policy_id: "POL-X2" }
              as: FrontDeskStaff
              captures: { x2_id: $.data.id, x2_v: $.data.version }
            - call: "POST /family-planning/patients/${x2_id}/household-assessments"
              payload: { household_size: 1, annual_income_cents: 2635500, income_basis: "DOCUMENTED", expected_patient_version: "${x2_v}" }
              as: FrontDeskStaff
            - call: "POST /family-planning/patients/${x2_id}/encounters"
              payload: { service_code: "CONTRACEPTIVE_COUNSELING", provider_id: "${prov_id}", channel: "IN_PERSON", scheduled_start: "2026-09-10T10:00:00Z", scheduled_end: "2026-09-10T10:30:00Z" }
              as: FrontDeskStaff
              captures: { encx2_id: $.data.id }
            - call: "POST /family-planning/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T10:00:00Z" }
              as: GrantAdministrator
            - call: "POST /family-planning/encounters/${encx2_id}/start"
              payload: {}
              as: Clinician
          trigger:
            - call: "POST /family-planning/encounters/${encx2_id}/claims"
              payload: {}
              as: BillingSpecialist
              captures: { err_id: $.data.error_id }
          assert:
            - "status 409 and error_id == ERR_INVALID_STATE"
            - "GET /family-planning/encounters/${encx2_id}/claims returns 0 rows"
            - "Encounter.${encx2_id}.billing_status == UNBILLED (unchanged)"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: telehealth_license_must_contain_whole_encounter_interval
        grounds:
          - calculations.telehealth_licensure_window
          - errors.ERR_TELEHEALTH_LICENSE_GAP
        distinguishing_aspect: |
          Interval semantics 1 (containment): the license interval must CONTAIN the
          entire half-open encounter interval — a license expiring mid-encounter
          fails even though it covers the start instant. Resource: ProviderLicense.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. Affiliate TX, tiers A-D, catalog CONTRACEPTIVE_COUNSELING telehealth_eligible."
            - "Provider with TX license [2026-09-10T09:00, 2026-09-10T10:30) — deliberately short."
            - "Adult tier-D patient with CURRENT assessment."
          setup_api_calls:
            - *clock_0901
            - *aff_tx
            - *tier_a
            - *tier_b
            - *tier_c
            - *tier_d
            - *cat_counsel
            - *prov_tx
            - call: "POST /family-planning/providers/${prov_id}/licenses"
              payload: { state_code: "TX", valid_from: "2026-09-10T09:00:00Z", valid_until: "2026-09-10T10:30:00Z" }
              as: GrantAdministrator
            - call: "POST /family-planning/affiliates/${aff_id}/patients"
              payload: { external_ref: "T1", date_of_birth: "1990-01-01" }
              as: FrontDeskStaff
              captures: { t1_id: $.data.id, t1_v: $.data.version }
            - call: "POST /family-planning/patients/${t1_id}/household-assessments"
              payload: { household_size: 1, annual_income_cents: 4000000, income_basis: "DOCUMENTED", expected_patient_version: "${t1_v}" }
              as: FrontDeskStaff
          trigger:
            - call: "POST /family-planning/patients/${t1_id}/encounters"
              payload: { service_code: "CONTRACEPTIVE_COUNSELING", provider_id: "${prov_id}", channel: "TELEHEALTH", patient_location_state: "TX", scheduled_start: "2026-09-10T09:30:00Z", scheduled_end: "2026-09-10T10:00:00Z" }
              as: FrontDeskStaff
              captures: { encok_id: $.data.id }
            - call: "POST /family-planning/patients/${t1_id}/encounters"
              payload: { service_code: "CONTRACEPTIVE_COUNSELING", provider_id: "${prov_id}", channel: "TELEHEALTH", patient_location_state: "TX", scheduled_start: "2026-09-10T10:00:00Z", scheduled_end: "2026-09-10T11:00:00Z" }
              as: FrontDeskStaff
              captures: { err_id: $.data.error_id }
          assert:
            - "encounter [09:30, 10:00) fully inside license [09:00, 10:30): created successfully (Encounter.${encok_id} exists)"
            - "encounter [10:00, 11:00) starting inside but ending past valid_until: status 422, error_id == ERR_TELEHEALTH_LICENSE_GAP"
            - "point-in-time coverage of the start instant is NOT sufficient — whole-interval containment is required"

      - name: privacy_hold_adjacent_intervals_do_not_overlap
        grounds:
          - calculations.privacy_hold_overlap
          - errors.ERR_PRIVACY_HOLD_OVERLAP
        distinguishing_aspect: |
          Interval semantics 2 (half-open adjacency vs overlap) on a different
          resource (PrivacyHold): a new hold whose hold_start equals an existing
          hold's hold_end is ADJACENT and accepted; one starting a second earlier
          OVERLAPS and is rejected with ERR_PRIVACY_HOLD_OVERLAP.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. Affiliate TX, one adult patient (no assessment needed for holds)."
            - "Existing ACTIVE hold H1 scope ALL [2026-09-01T00:00, 2026-09-10T00:00)."
          setup_api_calls:
            - *clock_0901
            - *aff_tx
            - call: "POST /family-planning/affiliates/${aff_id}/patients"
              payload: { external_ref: "T2", date_of_birth: "1990-01-01" }
              as: FrontDeskStaff
              captures: { t2_id: $.data.id }
            - call: "POST /family-planning/patients/${t2_id}/privacy-holds"
              payload: { hold_start: "2026-09-01T00:00:00Z", hold_end: "2026-09-10T00:00:00Z", scope: "ALL", authorized_staff_ids: [] }
              as: PrivacyOfficer
              captures: { h1_id: $.data.id }
          trigger:
            - call: "POST /family-planning/patients/${t2_id}/privacy-holds"
              payload: { hold_start: "2026-09-10T00:00:00Z", hold_end: "2026-09-20T00:00:00Z", scope: "ALL", authorized_staff_ids: [] }
              as: PrivacyOfficer
              captures: { h2_id: $.data.id }
            - call: "POST /family-planning/patients/${t2_id}/privacy-holds"
              payload: { hold_start: "2026-09-19T23:59:59Z", hold_end: "2026-09-25T00:00:00Z", scope: "ALL", authorized_staff_ids: [] }
              as: PrivacyOfficer
              captures: { err_id: $.data.error_id }
          assert:
            - "adjacent hold H2 created: PrivacyHold.${h2_id}.status == ACTIVE (hold_start == H1.hold_end does not overlap)"
            - "overlapping hold attempt: status 409 and error_id == ERR_PRIVACY_HOLD_OVERLAP"
            - "GET /family-planning/patients/${t2_id}/privacy-holds returns exactly 2 rows"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: stock_reserve_release_conserves_available_units
        grounds:
          - state_machines.DeviceReservation.RESERVED_to_RELEASED
          - entities.ContraceptiveStockLot.fields.on_hand
          - entities.ContraceptiveStockLot.fields.reserved_out
        distinguishing_aspect: |
          Conserved quantity 1 (inventory pool): available_units = on_hand -
          reserved_out. reserve (forward) followed by release (compensating) MUST
          leave available_units AND on_hand bit-identical to the pre-reserve values;
          fulfill instead keeps available_units constant while dropping the physical
          total on_hand + reserved_out by exactly 1.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. Affiliate TX, tiers A-D, catalog LARC_INSERTION fee 50000, licensed provider."
            - "Two adult tier-D patients with SCHEDULED LARC_INSERTION encounters 2026-09-15 (E1, E2)."
            - "Lot Q: IMPLANT, on_hand 3, expires 2027-01-01 (available 3)."
          setup_api_calls:
            - *clock_0901
            - *aff_tx
            - *tier_a
            - *tier_b
            - *tier_c
            - *tier_d
            - call: "POST /family-planning/affiliates/${aff_id}/service-catalog"
              payload: { service_code: "LARC_INSERTION", in_scope: true, telehealth_eligible: false, full_fee_cents: 50000 }
              as: GrantAdministrator
            - *prov_tx
            - *lic_tx
            - call: "POST /family-planning/affiliates/${aff_id}/patients"
              payload: { external_ref: "Q1", date_of_birth: "1990-01-01" }
              as: FrontDeskStaff
              captures: { q1_id: $.data.id, q1_v: $.data.version }
            - call: "POST /family-planning/patients/${q1_id}/household-assessments"
              payload: { household_size: 1, annual_income_cents: 4000000, income_basis: "DOCUMENTED", expected_patient_version: "${q1_v}" }
              as: FrontDeskStaff
            - call: "POST /family-planning/patients/${q1_id}/encounters"
              payload: { service_code: "LARC_INSERTION", provider_id: "${prov_id}", channel: "IN_PERSON", scheduled_start: "2026-09-15T10:00:00Z", scheduled_end: "2026-09-15T10:30:00Z" }
              as: FrontDeskStaff
              captures: { encq1_id: $.data.id }
            - call: "POST /family-planning/affiliates/${aff_id}/patients"
              payload: { external_ref: "Q2", date_of_birth: "1990-01-01" }
              as: FrontDeskStaff
              captures: { q2_id: $.data.id, q2_v: $.data.version }
            - call: "POST /family-planning/patients/${q2_id}/household-assessments"
              payload: { household_size: 1, annual_income_cents: 4000000, income_basis: "DOCUMENTED", expected_patient_version: "${q2_v}" }
              as: FrontDeskStaff
            - call: "POST /family-planning/patients/${q2_id}/encounters"
              payload: { service_code: "LARC_INSERTION", provider_id: "${prov_id}", channel: "IN_PERSON", scheduled_start: "2026-09-15T11:00:00Z", scheduled_end: "2026-09-15T11:30:00Z" }
              as: FrontDeskStaff
              captures: { encq2_id: $.data.id }
            - call: "POST /family-planning/affiliates/${aff_id}/stock-lots"
              payload: { device_code: "IMPLANT", lot_number: "LOT-Q", unit_cost_cents: 40000, on_hand: 3, expires_on: "2027-01-01" }
              as: SupplyCoordinator
              captures: { lotq_id: $.data.id }
          trigger:
            - call: "POST /family-planning/encounters/${encq1_id}/device-reservations"
              payload: { lot_id: "${lotq_id}" }
              as: SupplyCoordinator
              captures: { resq1_id: $.data.id }
            - call: "POST /family-planning/device-reservations/${resq1_id}/release"
              payload: {}
              as: SupplyCoordinator
            - call: "POST /family-planning/encounters/${encq2_id}/device-reservations"
              payload: { lot_id: "${lotq_id}" }
              as: SupplyCoordinator
              captures: { resq2_id: $.data.id }
            - call: "POST /family-planning/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T12:00:00Z" }
              as: GrantAdministrator
            - call: "POST /family-planning/encounters/${encq2_id}/start"
              payload: {}
              as: Clinician
            - call: "POST /family-planning/encounters/${encq2_id}/complete"
              payload: {}
              as: Clinician
          assert:
            - "after reserve + release: ContraceptiveStockLot.${lotq_id}.on_hand == 3 and reserved_out == 0 — invariant available_units restored to 3 exactly"
            - "after second reserve: on_hand == 3, reserved_out == 1 (available 2)"
            - "after fulfill on E2 completion: on_hand == 2 and reserved_out == 0 (available still 2; physical total dropped by exactly 1)"
            - "DeviceReservation.${resq2_id}.status == FULFILLED"

      - name: claim_payment_recoupment_conserves_receivable_identity
        grounds:
          - calculations.claim_billed_amount
          - state_machines.Claim.transitions
          - entities.Claim.fields.net_receivable_cents
          - errors.ERR_RECOUPMENT_EXCEEDS_PAID
        distinguishing_aspect: |
          Conserved quantity 2 (payer-accounting identity, a different type from
          inventory): billed_cents == paid_cents - recouped_cents +
          net_receivable_cents MUST hold after every forward (adjudicate) and
          compensating (recoup) action; over-recoupment is rejected so the identity
          can never be violated by drift.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01 -> 2026-09-10T10:00:00Z. Affiliate TX, tiers A-D, catalog CONTRACEPTIVE_COUNSELING fee 20000, licensed provider."
            - "Adult insured non-confidential tier-C patient (charge 10000); encounter completed; claim submitted (billed 10000)."
          setup_api_calls:
            - *clock_0901
            - *aff_tx
            - *tier_a
            - *tier_b
            - *tier_c
            - *tier_d
            - *cat_counsel
            - *prov_tx
            - *lic_tx
            - call: "POST /family-planning/affiliates/${aff_id}/patients"
              payload: { external_ref: "CI1", date_of_birth: "1990-01-01", insurance_policy_id: "POL-CI" }
              as: FrontDeskStaff
              captures: { ci1_id: $.data.id, ci1_v: $.data.version }
            - call: "POST /family-planning/patients/${ci1_id}/household-assessments"
              payload: { household_size: 1, annual_income_cents: 2635500, income_basis: "DOCUMENTED", expected_patient_version: "${ci1_v}" }
              as: FrontDeskStaff
            - call: "POST /family-planning/patients/${ci1_id}/encounters"
              payload: { service_code: "CONTRACEPTIVE_COUNSELING", provider_id: "${prov_id}", channel: "IN_PERSON", scheduled_start: "2026-09-10T10:00:00Z", scheduled_end: "2026-09-10T10:30:00Z" }
              as: FrontDeskStaff
              captures: { encci_id: $.data.id }
            - call: "POST /family-planning/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T10:00:00Z" }
              as: GrantAdministrator
            - call: "POST /family-planning/encounters/${encci_id}/start"
              payload: {}
              as: Clinician
            - call: "POST /family-planning/encounters/${encci_id}/complete"
              payload: {}
              as: Clinician
            - call: "POST /family-planning/encounters/${encci_id}/claims"
              payload: {}
              as: BillingSpecialist
              captures: { claimci_id: $.data.id }
            - call: "POST /family-planning/claims/${claimci_id}/submit"
              payload: {}
              as: BillingSpecialist
          trigger:
            - call: "POST /family-planning/claims/${claimci_id}/adjudicate"
              payload: { amount_cents: 10000 }
              as: BillingSpecialist
            - call: "POST /family-planning/claims/${claimci_id}/recoup"
              payload: { amount_cents: 4000 }
              as: BillingSpecialist
            - call: "POST /family-planning/claims/${claimci_id}/recoup"
              payload: { amount_cents: 6001 }
              as: BillingSpecialist
              captures: { err_id: $.data.error_id }
          assert:
            - "after adjudicate: paid_cents == 10000, recouped_cents == 0, net_receivable_cents == 0 (10000 == 10000 - 0 + 0)"
            - "after recoup 4000: recouped_cents == 4000, net_receivable_cents == 4000 (identity: 10000 == 10000 - 4000 + 4000)"
            - "recoup 6001 rejected: status 422, error_id == ERR_RECOUPMENT_EXCEEDS_PAID (6001 > 10000 - 4000 = 6000)"
            - "identity still holds after the rejection: paid_cents == 10000, recouped_cents == 4000, net_receivable_cents == 4000"
