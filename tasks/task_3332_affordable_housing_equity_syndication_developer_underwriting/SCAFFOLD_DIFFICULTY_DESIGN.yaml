# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3332_affordable_housing_equity_syndication_developer_underwriting
#
# Every instance grounds in elements already declared in SCAFFOLD.yaml §1.1-§1.7.
# `setup_api_calls` and `trigger` are structured, executable call chains.
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:

      - name: underwriting_equity_preliminary_vs_final_on_same_project
        grounds:
          - calculations.underwriting_equity
          - calculations.underwriting_equity.variants.preliminary
          - calculations.underwriting_equity.variants.final
          - entities.Project.fields.preliminary_equity_cents
          - entities.Project.fields.final_equity_cents
          - entities.Project.fields.underwritten_equity_cents
        distinguishing_aspect: "Both variants of underwriting_equity run against the identical Project row and produce different cents — 490198755 preliminary versus 529436038 final — because the preliminary variant prices the budget gap net of a quality uplift while the final variant caps equity at the priced credit award and subtracts a capped sponsor-experience uplift."
        test_recipe:
          setup:
            - "Developer Cedar Ridge Communities is onboarded and derives to ELIGIBLE."
            - "Investor Meridian Capital Group subscribes 460000000 cents to fund ECP Housing Fund IV and pays it in full."
            - "The fund moves to CLOSING because subscribed equity clears close_threshold_pct of the target."
            - "Project Riverside Commons exists in UNDERWRITING with underwriting_stage PRELIMINARY."
          setup_api_calls:
            - &clock_0902
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-02T00:00:00Z" }
              as: PlatformAdmin
            - &dev_cedar
              call: "POST /developers"
              payload: { name: "Cedar Ridge Communities", developer_type: "FOR_PROFIT", sponsor_experience_months: 96, projects_completed: 4, net_worth_cents: 2000000000, liquid_assets_cents: 30000000 }
              as: PlatformAdmin
              captures: { dev_id: $.data.id }
            - &inv_meridian
              call: "POST /investors"
              payload: { name: "Meridian Capital Group", investor_type: "BANK", committed_capacity_cents: 500000000, risk_tier: "TIER_3" }
              as: PlatformAdmin
              captures: { inv_id: $.data.id }
            - &fund_iv
              call: "POST /funds"
              payload: { fund_name: "ECP Housing Fund IV", target_equity_cents: 500000000, price_per_credit_dollar: 0.9123, target_yield_pct: 0.07, close_threshold_pct: 0.85, subscription_open_date: "2026-09-01T00:00:00Z", subscription_close_date: "2026-12-31T00:00:00Z" }
              as: Underwriter
              captures: { fund_id: $.data.id, fund_after_create: $.data.version }
            - call: "POST /funds/${fund_id}/subscriptions"
              payload: { investor_id: "${inv_id}", committed_cents: 460000000, payin_schedule: [{ milestone: "CONSTRUCTION_START", share_pct: 0.2 }, { milestone: "CONSTRUCTION_50PCT", share_pct: 0.2 }, { milestone: "LEASE_UP_50PCT", share_pct: 0.2 }, { milestone: "LEASE_UP_STABILIZED", share_pct: 0.2 }, { milestone: "PLACED_IN_SERVICE", share_pct: 0.2 }], expected_fund_version: "${fund_after_create}" }
              as: Investor
              as_user_id: "${inv_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /subscriptions/${sub_id}/payins"
              payload: { amount_cents: 460000000 }
              as: Investor
              as_user_id: "${inv_id}"
            - &proj_riverside
              call: "POST /projects"
              payload: { developer_id: "${dev_id}", fund_id: "${fund_id}", project_name: "Riverside Commons", state_code: "OR", total_credit_dollars_cents: 912345678, construction_budget_cents: 1234567890, construction_loan_cents: 700000000, operating_pro_forma_noi_cents: 72000000, debt_service_cents: 60000000, market_study_absorption_score: 0.83, sponsor_experience_months: 96, placed_in_service_deadline: "2028-12-31T00:00:00Z", compliance_period_months: 180 }
              as: Underwriter
              captures: { proj_id: $.data.id, proj_after_create: $.data.version }
          trigger:
            - call: "PUT /projects/${proj_id}"
              payload: { underwriting_action: "FINALIZE", expected_project_version: "${proj_after_create}" }
              as: Underwriter
              captures: { proj_id_final: $.data.id }
          assert:
            - "Project.${proj_id}.preliminary_equity_cents == 490198755"
            - "Project.${proj_id}.final_equity_cents == 529436038"
            - "Project.${proj_id}.underwriting_stage == FINAL"
            - "Project.${proj_id}.underwritten_equity_cents == 529436038"
            - "Project.${proj_id}.final_equity_cents - Project.${proj_id}.preliminary_equity_cents == 39237283"

      - name: fund_yield_priced_vs_realized_divergence_on_same_fund
        grounds:
          - calculations.fund_pricing_yield
          - calculations.fund_pricing_yield.variants.priced
          - calculations.fund_pricing_yield.variants.realized
          - entities.SyndicationFund.fields.priced_yield_pct
          - entities.SyndicationFund.fields.realized_yield_pct
          - entities.Allocation.fields.delivered_credit_dollars_cents
        distinguishing_aspect: "Both variants of fund_pricing_yield read the same SyndicationFund row and return different numbers — 0.983360 priced against -0.021739 realized — because the priced variant divides awarded credit dollars by subscribed equity while the realized variant divides delivered credit dollars by funded equity."
        test_recipe:
          setup:
            - "Developer Cedar Ridge Communities onboarded, ELIGIBLE."
            - "Investor Meridian Capital Group holds a fully funded 460000000-cent subscription in fund ECP Housing Fund IV."
            - "Project Riverside Commons is COMMITTED with one COMMITTED Allocation of 912345678 awarded credit dollars against which 450000000 delivered credit dollars have been recorded."
          setup_api_calls:
            - *clock_0902
            - *dev_cedar
            - *inv_meridian
            - *fund_iv
            - call: "POST /funds/${fund_id}/subscriptions"
              payload: { investor_id: "${inv_id}", committed_cents: 460000000, payin_schedule: [{ milestone: "CONSTRUCTION_START", share_pct: 0.2 }, { milestone: "CONSTRUCTION_50PCT", share_pct: 0.2 }, { milestone: "LEASE_UP_50PCT", share_pct: 0.2 }, { milestone: "LEASE_UP_STABILIZED", share_pct: 0.2 }, { milestone: "PLACED_IN_SERVICE", share_pct: 0.2 }], expected_fund_version: "${fund_after_create}" }
              as: Investor
              as_user_id: "${inv_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /subscriptions/${sub_id}/payins"
              payload: { amount_cents: 460000000 }
              as: Investor
              as_user_id: "${inv_id}"
            - *proj_riverside
            - call: "POST /projects/${proj_id}/allocations"
              payload: { action: "CREATE", state_agency: "Oregon Housing and Community Services", awarded_credit_dollars_cents: 912345678, commitment_fee_pct: 0.014, awarded_date: "2026-08-15T00:00:00Z", placed_in_service_deadline: "2028-12-31T00:00:00Z" }
              as: Underwriter
              captures: { alloc_id: $.data.id }
            - call: "PUT /projects/${proj_id}"
              payload: { underwriting_action: "FINALIZE", expected_project_version: "${proj_after_create}" }
              as: Underwriter
              captures: { proj_after_finalize: $.data.version }
            - call: "POST /projects/${proj_id}/commit"
              payload: {}
              as: Underwriter
            - call: "POST /projects/${proj_id}/allocations"
              payload: { action: "RECORD_DELIVERY", allocation_id: "${alloc_id}", delivered_credit_dollars_cents: 450000000 }
              as: AssetManager
          trigger:
            - call: "GET /funds/${fund_id}"
              payload: {}
              as: Underwriter
          assert:
            - "SyndicationFund.${fund_id}.priced_yield_pct == 0.983360"
            - "SyndicationFund.${fund_id}.realized_yield_pct == -0.021739"
            - "SyndicationFund.${fund_id}.awarded_credits_total_cents == 912345678"
            - "SyndicationFund.${fund_id}.delivered_credits_total_cents == 450000000"
            - "SyndicationFund.${fund_id}.priced_yield_pct != SyndicationFund.${fund_id}.realized_yield_pct"

  - rule_id: combinatorial_formula
    instances:

      - name: capital_call_adjusted_amount_pinned_two_step_rounding
        grounds:
          - calculations.capital_call_amount
          - calculations.capital_call_amount.variants.issue_time
          - calculations.capital_call_amount.variants.adjust_time
          - entities.CapitalCall.fields.called_amount_cents
          - state_machines.CapitalCall.transitions.ISSUED_to_ADJUSTED
          - validations[priority=6]
        distinguishing_aspect: "The call amount rounds the milestone share first and only then applies the credit-delivery adjuster, so a 0.15 share at an adjuster of 0.20 yields 95300488 while the single-step product yields 95300487; the adjuster also ratchets — a delivery correction moves the band from 0.05 to 0.20, raising both stored adjusters and never lowering one."
        test_recipe:
          setup:
            - "Fund ECP Housing Fund IV has a fully funded 460000000-cent subscription and is CLOSING."
            - "Project Riverside Commons is COMMITTED with a FINAL underwriting of 529436038 cents of equity and one COMMITTED Allocation of 912345678 awarded credit dollars carrying 830000000 delivered credit dollars."
            - "Capital call C1 on milestone CONSTRUCTION_START carries milestone_share 0.20 and was issued while the delivery band was 0.05; it has been settled in full."
            - "Capital call C2 on milestone CONSTRUCTION_50PCT carries milestone_share 0.15 and is ISSUED at the same 0.05 band."
            - "A later downward delivery correction sets the recorded delivery to 500000000, which moves the band to 0.20."
          setup_api_calls:
            - *clock_0902
            - *dev_cedar
            - *inv_meridian
            - *fund_iv
            - call: "POST /funds/${fund_id}/subscriptions"
              payload: { investor_id: "${inv_id}", committed_cents: 460000000, payin_schedule: [{ milestone: "CONSTRUCTION_START", share_pct: 0.2 }, { milestone: "CONSTRUCTION_50PCT", share_pct: 0.2 }, { milestone: "LEASE_UP_50PCT", share_pct: 0.2 }, { milestone: "LEASE_UP_STABILIZED", share_pct: 0.2 }, { milestone: "PLACED_IN_SERVICE", share_pct: 0.2 }], expected_fund_version: "${fund_after_create}" }
              as: Investor
              as_user_id: "${inv_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /subscriptions/${sub_id}/payins"
              payload: { amount_cents: 460000000 }
              as: Investor
              as_user_id: "${inv_id}"
            - *proj_riverside
            - call: "POST /projects/${proj_id}/allocations"
              payload: { action: "CREATE", state_agency: "Oregon Housing and Community Services", awarded_credit_dollars_cents: 912345678, commitment_fee_pct: 0.014, awarded_date: "2026-08-15T00:00:00Z", placed_in_service_deadline: "2028-12-31T00:00:00Z" }
              as: Underwriter
              captures: { alloc_id: $.data.id }
            - call: "POST /projects/${proj_id}/allocations"
              payload: { action: "RECORD_DELIVERY", allocation_id: "${alloc_id}", delivered_credit_dollars_cents: 830000000 }
              as: AssetManager
            - call: "PUT /projects/${proj_id}"
              payload: { underwriting_action: "FINALIZE", expected_project_version: "${proj_after_create}" }
              as: Underwriter
              captures: { proj_after_finalize: $.data.version }
            - call: "POST /projects/${proj_id}/commit"
              payload: {}
              as: Underwriter
              captures: { proj_after_commit: $.data.version }
            - call: "POST /projects/${proj_id}/capital-calls"
              payload: { milestone: "CONSTRUCTION_START", scheduled_date: "2026-10-01T00:00:00Z", due_date: "2026-10-31T00:00:00Z", milestone_share: 0.2, expected_project_version: "${proj_after_commit}" }
              as: AssetManager
              captures: { call1_id: $.data.id, proj_after_call1: $.data.version, call1_after_create: $.data.status }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /capital-calls/${call1_id}/transitions"
              payload: { action: "ISSUE" }
              as: AssetManager
            - call: "POST /capital-calls/${call1_id}/transitions"
              payload: { action: "SETTLE", funded_amount_cents: 105887208 }
              as: Investor
              as_user_id: "${inv_id}"
            - call: "POST /projects/${proj_id}/capital-calls"
              payload: { milestone: "CONSTRUCTION_50PCT", scheduled_date: "2026-11-15T00:00:00Z", due_date: "2026-12-15T00:00:00Z", milestone_share: 0.15, expected_project_version: "${proj_after_call1}" }
              as: AssetManager
              captures: { call2_id: $.data.id, proj_after_call2: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-11-20T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /capital-calls/${call2_id}/transitions"
              payload: { action: "ISSUE" }
              as: AssetManager
            - call: "POST /projects/${proj_id}/allocations"
              payload: { action: "RECORD_DELIVERY", allocation_id: "${alloc_id}", delivered_credit_dollars_cents: 500000000 }
              as: AssetManager
          trigger:
            - call: "POST /capital-calls/${call1_id}/transitions"
              payload: { action: "ADJUST" }
              as: AssetManager
              captures: { call1_amount: $.data.called_amount_cents }
          assert:
            - "CapitalCall.${call2_id}.base_call_cents == 79415406"
            - "CapitalCall.${call2_id}.credit_delivery_adjuster_pct == 0.20"
            - "CapitalCall.${call2_id}.called_amount_cents == 95300488"
            - "CapitalCall.${call1_id}.base_call_cents == 105887208"
            - "CapitalCall.${call1_id}.credit_delivery_adjuster_pct == 0.20"
            - "CapitalCall.${call1_id}.called_amount_cents == 127064650"
            - "CapitalCall.${call1_id}.status == ADJUSTED"

      - name: watch_list_risk_score_term_weights_and_ceiling_clamp
        grounds:
          - calculations.watch_list_risk_score
          - entities.PortfolioReview.fields.risk_score
          - state_machines.PortfolioReview.transitions.PENDING_to_ESCALATED
          - state_machines.PortfolioReview.transitions.PENDING_to_COMPLIANT
        distinguishing_aspect: "The score sums a rounded occupancy term, a rounded and ceiling-capped DSCR term, a reserve shortfall term and a 15-point term per date violation, then clamps to [0, 100] — so a review whose raw sum is 115 reports exactly 100 while an otherwise similar review reports 89 and flips to ESCALATED."
        test_recipe:
          setup:
            - "Project Riverside Commons exists in UNDERWRITING with placed_in_service_deadline 2028-12-31T00:00:00Z."
            - "Review A of period 0 is PENDING with period end 2026-07-31, occupancy 0.87, DSCR 1.20 and reserves 20000000."
            - "Review B of period 1 is PENDING with period end 2026-08-31, occupancy 0.10, DSCR 0.10 and reserves 40000000."
            - "The logical clock is 2026-09-02T00:00:00Z."
          setup_api_calls:
            - *clock_0902
            - *dev_cedar
            - *inv_meridian
            - *fund_iv
            - *proj_riverside
            - call: "POST /projects/${proj_id}/reviews"
              payload: { review_period_index: 0, review_period_end: "2026-07-31T00:00:00Z", occupancy_pct: 0.87, dscr_observed: 1.2, reserve_balance_cents: 20000000 }
              as: AssetManager
              captures: { review_a_id: $.data.id }
            - call: "POST /projects/${proj_id}/reviews"
              payload: { review_period_index: 1, review_period_end: "2026-08-31T00:00:00Z", occupancy_pct: 0.1, dscr_observed: 0.1, reserve_balance_cents: 40000000 }
              as: AssetManager
              captures: { review_b_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2029-01-15T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /projects/${proj_id}/reviews"
              payload: { review_period_index: 2, review_period_end: "2028-12-31T00:00:00Z", occupancy_pct: 1.0, dscr_observed: 1.5, reserve_balance_cents: 40000000 }
              as: ComplianceOfficer
              captures: { review_c_id: $.data.id }
            - call: "POST /reviews/${review_a_id}/resolve"
              payload: {}
              as: AssetManager
          assert:
            - "PortfolioReview.${review_c_id}.risk_score == 100"
            - "PortfolioReview.${review_a_id}.risk_score == 89"
            - "PortfolioReview.${review_a_id}.status == ESCALATED"
            - "PortfolioReview.${review_b_id}.risk_score == 41"

  - rule_id: non_linear_state_machine
    instances:

      - name: project_status_revision_cycle_through_distressed_and_back
        grounds:
          - state_machines.Project.transitions.COMPLIANCE_PERIOD_to_DISTRESSED
          - state_machines.Project.transitions.DISTRESSED_to_COMPLIANCE_PERIOD
          - state_machines.PortfolioReview.transitions.PENDING_to_ESCALATED
          - state_machines.PortfolioReview.transitions.NONCOMPLIANT_to_CURED
          - calculations.fund_posture
        distinguishing_aspect: "Project.status is cyclic rather than a forward pipeline: COMPLIANCE_PERIOD → DISTRESSED → COMPLIANCE_PERIOD revisits the identical state, and the fund's derived posture swings OPEN → FROZEN → OPEN with it."
        test_recipe:
          setup:
            - "Fund ECP Housing Fund IV holds one fully funded 460000000-cent subscription."
            - "Project Riverside Commons is COMPLIANCE_PERIOD with one COMMITTED Allocation of 912345678 awarded credit dollars and its milestone calls PAID."
            - "Review of period 0 is PENDING with period end 2026-08-31 and risk inputs that score below 70."
            - "The logical clock is 2026-09-02T00:00:00Z."
          setup_api_calls:
            - *clock_0902
            - *dev_cedar
            - *inv_meridian
            - *fund_iv
            - call: "POST /funds/${fund_id}/subscriptions"
              payload: { investor_id: "${inv_id}", committed_cents: 460000000, payin_schedule: [{ milestone: "CONSTRUCTION_START", share_pct: 0.2 }, { milestone: "CONSTRUCTION_50PCT", share_pct: 0.2 }, { milestone: "LEASE_UP_50PCT", share_pct: 0.2 }, { milestone: "LEASE_UP_STABILIZED", share_pct: 0.2 }, { milestone: "PLACED_IN_SERVICE", share_pct: 0.2 }], expected_fund_version: "${fund_after_create}" }
              as: Investor
              as_user_id: "${inv_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /subscriptions/${sub_id}/payins"
              payload: { amount_cents: 460000000 }
              as: Investor
              as_user_id: "${inv_id}"
            - *proj_riverside
            - call: "POST /projects/${proj_id}/allocations"
              payload: { action: "CREATE", state_agency: "Oregon Housing and Community Services", awarded_credit_dollars_cents: 912345678, commitment_fee_pct: 0.014, awarded_date: "2026-08-15T00:00:00Z", placed_in_service_deadline: "2028-12-31T00:00:00Z" }
              as: Underwriter
            - call: "PUT /projects/${proj_id}"
              payload: { underwriting_action: "FINALIZE", expected_project_version: "${proj_after_create}" }
              as: Underwriter
            - call: "POST /projects/${proj_id}/commit"
              payload: {}
              as: Underwriter
              captures: { proj_after_commit: $.data.version }
            - call: "POST /projects/${proj_id}/milestones"
              payload: { milestone: "CONSTRUCTION_START" }
              as: AssetManager
              captures: { proj_after_cs: $.data.version }
            - call: "POST /projects/${proj_id}/milestones"
              payload: { milestone: "LEASE_UP_50PCT" }
              as: AssetManager
              captures: { proj_after_lu: $.data.version }
            - call: "POST /projects/${proj_id}/milestones"
              payload: { milestone: "LEASE_UP_STABILIZED" }
              as: AssetManager
              captures: { proj_after_stab: $.data.version }
            - call: "POST /projects/${proj_id}/milestones"
              payload: { milestone: "PLACED_IN_SERVICE" }
              as: AssetManager
              captures: { proj_after_pis: $.data.version }
            - call: "POST /projects/${proj_id}/reviews"
              payload: { review_period_index: 0, review_period_end: "2026-08-31T00:00:00Z", occupancy_pct: 0.95, dscr_observed: 1.4, reserve_balance_cents: 60000000 }
              as: ComplianceOfficer
              captures: { review_id: $.data.id }
          trigger:
            - call: "POST /reviews/${review_id}/resolve"
              payload: { outcome: "ESCALATED" }
              as: ComplianceOfficer
            - call: "POST /projects/${proj_id}/reviews"
              payload: { review_period_index: 1, review_period_end: "2027-08-31T00:00:00Z", occupancy_pct: 0.96, dscr_observed: 1.4, reserve_balance_cents: 60000000 }
              as: ComplianceOfficer
              captures: { review2_id: $.data.id }
            - call: "POST /reviews/${review2_id}/resolve"
              payload: { outcome: "CURED" }
              as: ComplianceOfficer
              captures: { review2_status: $.data.status }
          assert:
            - "Project.${proj_id}.status == COMPLIANCE_PERIOD"
            - "PortfolioReview.${review_id}.status == ESCALATED"
            - "PortfolioReview.${review2_id}.status == CURED"
            - "Project.${proj_id}.status after the resolve above is DISTRESSED when only the first resolve has run, and COMPLIANCE_PERIOD again once the escalated review is cured"
            - "SyndicationFund.${fund_id}.posture == OPEN"

      - name: fund_subscription_cyclic_refund_and_refund_reversal
        grounds:
          - state_machines.FundSubscription.transitions.FULLY_FUNDED_to_PARTIALLY_FUNDED
          - state_machines.FundSubscription.transitions.PLEDGED_to_DEFAULTED
          - state_machines.SyndicationFund.transitions.CLOSING_to_FORMING
          - calculations.capital_call_amount
        distinguishing_aspect: "FundSubscription.status loops rather than advancing: it reaches FULLY_FUNDED, is knocked back to PARTIALLY_FUNDED by an adjusted capital call, and returns to FULLY_FUNDED only by paying the reclaimed delta, while the fund itself falls from CLOSING back to FORMING."
        test_recipe:
          setup:
            - "Fund ECP Housing Fund IV has subscription S1 with investor Meridian Capital Group for 460000000 cents, paid in full."
            - "Project Riverside Commons is COMMITTED with a FINAL underwriting of 529436038 cents and one COMMITTED Allocation carrying 830000000 delivered credit dollars."
            - "Capital call C1 on milestone CONSTRUCTION_START for milestone_share 0.20 was issued and settled in full at the 0.05 band."
            - "A delivery correction subsequently drops recorded delivery to 500000000."
          setup_api_calls:
            - *clock_0902
            - *dev_cedar
            - *inv_meridian
            - *fund_iv
            - call: "POST /funds/${fund_id}/subscriptions"
              payload: { investor_id: "${inv_id}", committed_cents: 460000000, payin_schedule: [{ milestone: "CONSTRUCTION_START", share_pct: 0.2 }, { milestone: "CONSTRUCTION_50PCT", share_pct: 0.2 }, { milestone: "LEASE_UP_50PCT", share_pct: 0.2 }, { milestone: "LEASE_UP_STABILIZED", share_pct: 0.2 }, { milestone: "PLACED_IN_SERVICE", share_pct: 0.2 }], expected_fund_version: "${fund_after_create}" }
              as: Investor
              as_user_id: "${inv_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /subscriptions/${sub_id}/payins"
              payload: { amount_cents: 460000000 }
              as: Investor
              as_user_id: "${inv_id}"
              captures: { sub_after_payin: $.data.status }
            - *proj_riverside
            - call: "POST /projects/${proj_id}/allocations"
              payload: { action: "CREATE", state_agency: "Oregon Housing and Community Services", awarded_credit_dollars_cents: 912345678, commitment_fee_pct: 0.014, awarded_date: "2026-08-15T00:00:00Z", placed_in_service_deadline: "2028-12-31T00:00:00Z" }
              as: Underwriter
              captures: { alloc_id: $.data.id }
            - call: "POST /projects/${proj_id}/allocations"
              payload: { action: "RECORD_DELIVERY", allocation_id: "${alloc_id}", delivered_credit_dollars_cents: 830000000 }
              as: AssetManager
            - call: "PUT /projects/${proj_id}"
              payload: { underwriting_action: "FINALIZE", expected_project_version: "${proj_after_create}" }
              as: Underwriter
              captures: { proj_after_finalize: $.data.version }
            - call: "POST /projects/${proj_id}/commit"
              payload: {}
              as: Underwriter
              captures: { proj_after_commit: $.data.version }
            - call: "POST /projects/${proj_id}/capital-calls"
              payload: { milestone: "CONSTRUCTION_START", scheduled_date: "2026-10-01T00:00:00Z", due_date: "2026-10-31T00:00:00Z", milestone_share: 0.2, expected_project_version: "${proj_after_commit}" }
              as: AssetManager
