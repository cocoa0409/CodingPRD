            - { call: "POST /h2a/job-orders/${jo0}/submit", payload: {}, as: ContractorAdmin }
            - { call: "POST /h2a/wage-determinations", payload: { state_code: "CA", crop: "LETTUCE", activity: "HARVEST", effective_year: 2026, aewr_hourly_cents: 1975, prevailing_hourly_cents: 1775, prevailing_piece_rate_cents_per_unit: 450, piece_unit_name: "BOX" }, as: ProgramReviewer, captures: { wd2: $.data.id } }
            - { call: "POST /h2a/job-orders", payload: { grower_id: "${g1}", wage_determination_id: "${wd2}", title: "J2 late", crop: "LETTUCE", activity: "HARVEST", worksite_state: "CA", work_start_date: "2026-09-01", work_end_date: "2026-10-20", daily_standard_hours: 8, workers_requested: 4, offered_hourly_cents: 1800, offered_piece_rate_cents_per_unit: 400, inbound_transport_cents: 60000, outbound_transport_cents: 75000 }, as: ContractorAdmin, captures: { jo2: $.data.id } }
          trigger:
            - { call: "GET /h2a/job-orders/${jo0}", as: ContractorAdmin, captures: { j0_floor: $.data.required_hourly_floor_cents, j0_lock: $.data.locked_aewr_hourly_cents } }
            - { call: "GET /h2a/job-orders/${jo2}", as: ContractorAdmin, captures: { j2_floor: $.data.required_hourly_floor_cents } }
          assert:
            - "J0: locked_aewr_hourly_cents == 1850 and required_hourly_floor_cents == 1850 (immune to the supersede)"
            - "J2 (DRAFT, references WD2): required_hourly_floor_cents == 1975 (live read of the new determination)"

