  - rule_id: transitive_cascade
    instances:

      - name: overrun_completion_cascades_to_frozen_posture_and_suspended_frame
        grounds:
          - state_machines.Interview.SCHEDULED_to_COMPLETED
          - state_machines.SamplingFrame.SEALED_to_SUSPENDED
          - calculations.interview_incentive_amount
          - calculations.program_incentive_posture
          - entities.Program.fields.posture
          - entities.SamplingFrame.fields.status
        distinguishing_aspect: |
          Depth-4 chain, each link strictly caused by the previous one:
          (1) POST /interviews/{id}/complete on an 80-minute actual interval sets
          incentive_final_usd 312.50 and flips incentive_status COMMITTED -> PAID;
          (2) because of (1) the program ledger moves 250.00 out of committed and
          312.50 into paid; (3) because of (2) program_incentive_posture recomputes
          utilization 312.50 / 300.00 = 1.0417 >= POSTURE_FROZEN_AT and posture
          becomes FROZEN; (4) because of (3) every SEALED SamplingFrame of that
          program transitions to SUSPENDED. Truncating the chain at link 3 leaves
          the frame SEALED; truncating at link 2 leaves posture OPEN.
        test_recipe:
          setup:
            - "Program ACTIVE with a deliberately tight incentive_budget_usd of 300.00, interview_incentive_cap_usd 500.00 (so the cap does not clip 312.50), min_deal_value_usd 50000.00."
            - "ENTERPRISE LOST deal drawn into a SEALED frame; consented ECONOMIC_BUYER contact; INTERNAL analyst."
            - "Interview booked 2026-08-10T14:00Z -> 15:00Z: 60 minutes, factor 1.00, incentive_provisional_usd 250.00, Program.incentive_committed_usd 250.00, utilization 250.00/300.00 = 0.8333 < POSTURE_RESTRICTED_AT so posture is still OPEN and the frame is still SEALED."
            - "All three required guide topics recorded so the coverage gate passes."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /programs"
