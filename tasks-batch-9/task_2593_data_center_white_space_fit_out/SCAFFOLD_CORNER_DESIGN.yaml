      - name: segregation_of_duties_binds_user_identity_not_role_header
        claim_type: segregation_of_duties
        grounds:
          - "§1.7 segregation-of-duties note (2): a MOP author may not approve their own MOP (validation 28), no approver may vote twice in a round (validation 29), and a HIGH risk MOP needs one ChangeManager AND one OperationsManager (validation 30)"
          - "errors[ERR_APPROVER_IS_AUTHOR] 422 and errors[ERR_DUPLICATE_APPROVER] 409"
        distinguishing_aspect: "Both duty separations are keyed on X-User-ID, not on the role header, so swapping hats does not create a second person: the author u-elec-1 wearing OperationsManager is still the author (422), and u-cm-1 who already approved as ChangeManager is still the same approver when it returns as OperationsManager (409) even though that second vote would satisfy the two-distinct-roles quorum. Only a genuinely different human closes the quorum. An implementation that stores approvals keyed by role passes the first check and fails this one."
        test_recipe:
          setup: "Hall CX88 in PLANNING with PDU-A1 and BW-A1. One HIGH-risk MOP on BW-A1 authored by u-elec-1 and submitted, so it needs one ChangeManager and one OperationsManager approval from two distinct users."
