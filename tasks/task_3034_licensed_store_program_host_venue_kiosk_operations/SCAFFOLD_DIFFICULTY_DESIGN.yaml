  # ===========================================================================
  # Rule 5 — priority_pair_validation_conflict (different category pairs)
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_fiscal_on_order_submit
        grounds:
          - validations[priority=10]
          - validations[priority=35]
        distinguishing_aspect: |
          Category pair state (10) vs business_fiscal (35): submitting an over-budget order
          against a SUSPENDED store returns ERR_STORE_NOT_OPERATING, not ERR_ORDER_BUDGET_EXCEEDED.
        test_recipe:
          setup:
            - "Store OPERATING then suspended by BrandProgramAdmin; DRAFT order totaling 25000000 cents (over ORDER_BUDGET_MAX_CENTS 20000000) created while suspended"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: BrandProgramAdmin }
            - { call: "POST /licensing/licensees", payload: { name: "LC", legal_entity_code: "LE-10" }, as: BrandProgramAdmin, captures: { lic_id: $.data.id } }
            - { call: "POST /licensing/host-venues", payload: { name: "V", venue_type: "GROCERY", open_time_utc: "06:00", close_time_utc: "22:00", access_restricted: false, max_equipment_footprint_units: 100, security_badge_required: false }, as: BrandProgramAdmin, captures: { ven_id: $.data.id } }
