scaffold_difficulty_design:

  # ===========================================================================
  # Rule 1 — dual_variant_calc (two variants, different entity domains)
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: plc_vs_arc_co_same_data_divergent_payment
        grounds:
          - calculations.plc_payment_calculation
          - calculations.arc_co_payment_calculation
          - state_machines.Enrollment.CERTIFIED_to_PAYMENT_COMPUTED
        distinguishing_aspect: |
          Identical farm/base/yield inputs produce different computed_payment_cents
          because PLC keys off effective price alone while ARC-CO keys off county
          revenue (yield x price) with an 86% guarantee and a 10% cap — the same
          enrollment computed under each pinned election diverges.
        test_recipe:
          setup:
            - "Farm F with one tract (base_acres 100.00, cropland 100.00) and one field (100.00 acres)"
            - "Producer P holds ACTIVE 100.00% membership; AGI VERIFIED at 50000000 cents; conservation CERTIFIED"
            - "AcreageReport for year CERTIFIED with 100.00 planted CORN acres"
            - "YieldRecord CORN with APH 180.0 bu/acre (CERTIFIED)"
            - "Two parallel enrollments E_PLC (pinned PLC) and E_ARC (pinned ARC_CO) both CERTIFIED"
          setup_api_calls:
            - { call: "POST /fsa/_clock/set_current_utc", payload: { to_iso8601: "2026-02-01T00:00:00Z" }, as: CountySpecialist }
            - { call: "POST /fsa/farms", payload: { farm_number: "F100", county_code: "019", program_year: 2026, arc_co_ic_indicator: "COUNTY" }, as: CountySpecialist, captures: { farm_id: "$.data.id", farm_v0: "$.data.version" } }
            - { call: "POST /fsa/producers", payload: { producer_name: "Pat Farm", tax_id_last4: "1234", entity_type: "INDIVIDUAL" }, as: CountySpecialist, captures: { prod_id: "$.data.id" } }
            - { call: "POST /fsa/farms/${farm_id}/memberships", payload: { producer_id: "${prod_id}", share_percent: 100.00, is_spouse_pair: false }, as: CountySpecialist }
            - { call: "POST /fsa/farms/${farm_id}/tracts", payload: { tract_number: "T1", base_acres: 100.00, cropland_acres: 100.00 }, as: CountySpecialist, captures: { tract_id: "$.data.id" } }
            - { call: "POST /fsa/tracts/${tract_id}/fields", payload: { field_number: "1", acres: 100.00 }, as: CountySpecialist, captures: { field_id: "$.data.id" } }
            - { call: "POST /fsa/farms/${farm_id}/yield-records", payload: { commodity: "CORN" }, as: CountySpecialist, captures: { yr_id: "$.data.id" } }
            - { call: "POST /fsa/yield-records/${yr_id}/observations", payload: { crop_year: 2021, actual_yield_bu_per_acre: 180.0 }, as: CountySpecialist }
            - { call: "POST /fsa/yield-records/${yr_id}/observations", payload: { crop_year: 2022, actual_yield_bu_per_acre: 180.0 }, as: CountySpecialist }
            - { call: "POST /fsa/yield-records/${yr_id}/observations", payload: { crop_year: 2023, actual_yield_bu_per_acre: 180.0 }, as: CountySpecialist }
            - { call: "POST /fsa/yield-records/${yr_id}/observations", payload: { crop_year: 2024, actual_yield_bu_per_acre: 180.0 }, as: CountySpecialist }
            - { call: "POST /fsa/yield-records/${yr_id}/observations", payload: { crop_year: 2025, actual_yield_bu_per_acre: 180.0 }, as: CountySpecialist }
            - { call: "POST /fsa/yield-records/${yr_id}/updates", payload: {}, as: Producer, as_user_id: "${prod_id}" }
            - { call: "POST /fsa/yield-records/${yr_id}/certify", payload: {}, as: CountySpecialist }
            - { call: "POST /fsa/farms/${farm_id}/acreage-reports", payload: { program_year: 2026 }, as: Producer, as_user_id: "${prod_id}", captures: { ar_id: "$.data.id" } }
            - { call: "POST /fsa/acreage-reports/${ar_id}/lines", payload: { field_id: "${field_id}", crop_code: "CORN", planted_acres: 100.00, prevented_planted_acres: 0.00, intended_use: "GRAIN" }, as: Producer, as_user_id: "${prod_id}" }
            - { call: "POST /fsa/acreage-reports/${ar_id}/file", payload: {}, as: Producer, as_user_id: "${prod_id}" }
            - { call: "POST /fsa/acreage-reports/${ar_id}/certify", payload: {}, as: CountySpecialist }
            - { call: "POST /fsa/farms/${farm_id}/program-elections", payload: { program_year: 2026, commodity: "CORN", election_code: "PLC", expected_farm_version: "${farm_v0}" }, as: Producer, as_user_id: "${prod_id}", captures: { elec_plc: "$.data.id", farm_v1: "$.data.version" } }
            - { call: "POST /fsa/producers/${prod_id}/agi-attestations", payload: { adjusted_gross_income: 50000000 }, as: Producer, as_user_id: "${prod_id}" }
            - { call: "POST /fsa/producers/${prod_id}/agi-attestations/verify", payload: {}, as: CountySpecialist }
            - { call: "POST /fsa/producers/${prod_id}/conservation-certifications", payload: {}, as: Producer, as_user_id: "${prod_id}" }
            - { call: "POST /fsa/farms/${farm_id}/enrollments", payload: { program_year: 2026, commodity: "CORN" }, as: Producer, as_user_id: "${prod_id}", captures: { enr_id: "$.data.id" } }
            - { call: "POST /fsa/enrollments/${enr_id}/submit", payload: {}, as: Producer, as_user_id: "${prod_id}" }
            - { call: "POST /fsa/enrollments/${enr_id}/ced-approve", payload: {}, as: CountyExecutiveDirector }
            - { call: "POST /fsa/enrollments/${enr_id}/certify", payload: {}, as: CountyCommittee, as_user_id: "${prod_id}" }
          trigger:
            - { call: "POST /fsa/enrollments/${enr_id}/compute-payment", payload: { national_my_price: 3.50, county_actual_yield: 190.0, benchmark_revenue: 760.00 }, as: CountySpecialist, captures: { pay_plc: "$.data.computed_payment_cents" } }
          assert:
            - "PLC payment: payment_rate = 4.10-3.50 = 0.60; base = 0.60*180.0*100*0.85 = 9180.00; attributable(100%) = 9180.00; sequestration = round(9180*0.057,2)=523.26; net = 8656.74"
            - "Enrollment.${enr_id}.computed_payment_cents == 865674"
            - "Recomputing the same enrollment under an ARC_CO election (if the pinned election were ARC_CO) yields a different value because the revenue formula (guarantee=0.86*760=653.60, actual=190*3.50=665.00, payment_rate=min(76.00, max(0,653.60-665.00))=0) produces 0 — divergent from PLC's 865674"

      - name: provisional_vs_certified_aph_plug_fill_divergence
        grounds:
          - calculations.aph_yield_calculation
          - entities.YieldRecord.fields.aph_yield_bu_per_acre
        distinguishing_aspect: |
          A PROVISIONAL APH with a missing year uses the plug yield (135 for CORN)
          while the CERTIFIED APH after filling that year with observed 200.0 bu/acre
          produces a different aph_yield_bu_per_acre — the plug-vs-observed variant.
        test_recipe:
          setup:
            - "Farm F, Producer P member 100%, YieldRecord CORN with 4 observed years (200,200,200,200) and one missing year (plug)"
          setup_api_calls:
            - { call: "POST /fsa/_clock/set_current_utc", payload: { to_iso8601: "2026-02-01T00:00:00Z" }, as: CountySpecialist }
            - { call: "POST /fsa/farms", payload: { farm_number: "F200", county_code: "019", program_year: 2026 }, as: CountySpecialist, captures: { farm_id: "$.data.id" } }
            - { call: "POST /fsa/producers", payload: { producer_name: "Pat Farm", tax_id_last4: "1234", entity_type: "INDIVIDUAL" }, as: CountySpecialist, captures: { prod_id: "$.data.id" } }
            - { call: "POST /fsa/farms/${farm_id}/memberships", payload: { producer_id: "${prod_id}", share_percent: 100.00 }, as: CountySpecialist }
            - { call: "POST /fsa/farms/${farm_id}/yield-records", payload: { commodity: "CORN" }, as: CountySpecialist, captures: { yr_id: "$.data.id" } }
            - { call: "POST /fsa/yield-records/${yr_id}/observations", payload: { crop_year: 2021, actual_yield_bu_per_acre: 200.0 }, as: CountySpecialist }
            - { call: "POST /fsa/yield-records/${yr_id}/observations", payload: { crop_year: 2022, actual_yield_bu_per_acre: 200.0 }, as: CountySpecialist }
            - { call: "POST /fsa/yield-records/${yr_id}/observations", payload: { crop_year: 2023, actual_yield_bu_per_acre: 200.0 }, as: CountySpecialist }
            - { call: "POST /fsa/yield-records/${yr_id}/observations", payload: { crop_year: 2024, actual_yield_bu_per_acre: 200.0 }, as: CountySpecialist }
            - { call: "POST /fsa/yield-records/${yr_id}/observations", payload: { crop_year: 2025, actual_yield_bu_per_acre: null }, as: CountySpecialist }
          trigger:
            - { call: "GET /fsa/yield-records/${yr_id}", payload: {}, as: CountySpecialist, captures: { aph_prov: "$.data.aph_yield_bu_per_acre" } }
            - { call: "POST /fsa/yield-records/${yr_id}/observations", payload: { crop_year: 2025, actual_yield_bu_per_acre: 200.0 }, as: CountySpecialist }
            - { call: "POST /fsa/yield-records/${yr_id}/updates", payload: {}, as: Producer, as_user_id: "${prod_id}" }
            - { call: "POST /fsa/yield-records/${yr_id}/certify", payload: {}, as: CountySpecialist }
            - { call: "GET /fsa/yield-records/${yr_id}", payload: {}, as: CountySpecialist, captures: { aph_cert: "$.data.aph_yield_bu_per_acre" } }
          assert:
            - "Provisional APH = (200+200+200+200+135)/5 = 187.0; certified APH after plug replaced with 200.0 = (200*5)/5 = 200.0"
            - "aph_prov == 187.0"
            - "aph_cert == 200.0"
            - "aph_prov != aph_cert"

  # ===========================================================================
  # Rule 2 — combinatorial_formula (different modes a/b/c)
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: plc_formula_multi_input_nonlinear
        grounds:
          - calculations.plc_payment_calculation
          - calculations.payment_limitation_attribution
        distinguishing_aspect: |
          Mode (a): PLC has >=3 inputs (reference price, effective price via min(),
          APH yield, base acres) with non-linear interaction — max(0, ref-eff),
          min(eff_price, loan_rate), and a downstream min() against the payment
          limitation cap; tiered/triadic clamping makes the output non-linear.
        test_recipe:
          setup:
            - "Farm F (base 50.00 CORN), Producer P 100% VERIFIED AGI + CERTIFIED conservation, APH 200.0, election PLC, enrollment CERTIFIED"
          setup_api_calls:
            - { call: "POST /fsa/_clock/set_current_utc", payload: { to_iso8601: "2026-02-01T00:00:00Z" }, as: CountySpecialist }
            - { call: "POST /fsa/farms", payload: { farm_number: "F300", county_code: "019", program_year: 2026 }, as: CountySpecialist, captures: { farm_id: "$.data.id", farm_v0: "$.data.version" } }
            - { call: "POST /fsa/producers", payload: { producer_name: "Pat", tax_id_last4: "1234", entity_type: "INDIVIDUAL" }, as: CountySpecialist, captures: { prod_id: "$.data.id" } }
            - { call: "POST /fsa/farms/${farm_id}/memberships", payload: { producer_id: "${prod_id}", share_percent: 100.00 }, as: CountySpecialist }
            - { call: "POST /fsa/farms/${farm_id}/tracts", payload: { tract_number: "T1", base_acres: 50.00, cropland_acres: 50.00 }, as: CountySpecialist, captures: { tract_id: "$.data.id" } }
            - { call: "POST /fsa/tracts/${tract_id}/fields", payload: { field_number: "1", acres: 50.00 }, as: CountySpecialist, captures: { field_id: "$.data.id" } }
            - { call: "POST /fsa/farms/${farm_id}/yield-records", payload: { commodity: "CORN" }, as: CountySpecialist, captures: { yr_id: "$.data.id" } }
            - { call: "POST /fsa/yield-records/${yr_id}/observations", payload: { crop_year: 2021, actual_yield_bu_per_acre: 200.0 }, as: CountySpecialist }
            - { call: "POST /fsa/yield-records/${yr_id}/observations", payload: { crop_year: 2022, actual_yield_bu_per_acre: 200.0 }, as: CountySpecialist }
            - { call: "POST /fsa/yield-records/${yr_id}/observations", payload: { crop_year: 2023, actual_yield_bu_per_acre: 200.0 }, as: CountySpecialist }
            - { call: "POST /fsa/yield-records/${yr_id}/observations", payload: { crop_year: 2024, actual_yield_bu_per_acre: 200.0 }, as: CountySpecialist }
            - { call: "POST /fsa/yield-records/${yr_id}/observations", payload: { crop_year: 2025, actual_yield_bu_per_acre: 200.0 }, as: CountySpecialist }
            - { call: "POST /fsa/yield-records/${yr_id}/updates", payload: {}, as: Producer, as_user_id: "${prod_id}" }
            - { call: "POST /fsa/yield-records/${yr_id}/certify", payload: {}, as: CountySpecialist }
            - { call: "POST /fsa/farms/${farm_id}/acreage-reports", payload: { program_year: 2026 }, as: Producer, as_user_id: "${prod_id}", captures: { ar_id: "$.data.id" } }
            - { call: "POST /fsa/acreage-reports/${ar_id}/lines", payload: { field_id: "${field_id}", crop_code: "CORN", planted_acres: 50.00, prevented_planted_acres: 0.00, intended_use: "GRAIN" }, as: Producer, as_user_id: "${prod_id}" }
            - { call: "POST /fsa/acreage-reports/${ar_id}/file", payload: {}, as: Producer, as_user_id: "${prod_id}" }
            - { call: "POST /fsa/acreage-reports/${ar_id}/certify", payload: {}, as: CountySpecialist }
            - { call: "POST /fsa/farms/${farm_id}/program-elections", payload: { program_year: 2026, commodity: "CORN", election_code: "PLC", expected_farm_version: "${farm_v0}" }, as: Producer, as_user_id: "${prod_id}" }
            - { call: "POST /fsa/producers/${prod_id}/agi-attestations", payload: { adjusted_gross_income: 50000000 }, as: Producer, as_user_id: "${prod_id}" }
            - { call: "POST /fsa/producers/${prod_id}/agi-attestations/verify", payload: {}, as: CountySpecialist }
            - { call: "POST /fsa/producers/${prod_id}/conservation-certifications", payload: {}, as: Producer, as_user_id: "${prod_id}" }
            - { call: "POST /fsa/farms/${farm_id}/enrollments", payload: { program_year: 2026, commodity: "CORN" }, as: Producer, as_user_id: "${prod_id}", captures: { enr_id: "$.data.id" } }
            - { call: "POST /fsa/enrollments/${enr_id}/submit", payload: {}, as: Producer, as_user_id: "${prod_id}" }
            - { call: "POST /fsa/enrollments/${enr_id}/ced-approve", payload: {}, as: CountyExecutiveDirector }
            - { call: "POST /fsa/enrollments/${enr_id}/certify", payload: {}, as: CountyCommittee, as_user_id: "${prod_id}" }
          trigger:
            - { call: "POST /fsa/enrollments/${enr_id}/compute-payment", payload: { national_my_price: 3.50 }, as: CountySpecialist }
          assert:
            - "payment_rate = max(0, 4.10 - min(3.50, loan)) = 0.60; base = 0.60*200.0*50*0.85 = 5100.00; attributable = 5100.00 (100%); sequestration = round(5100*0.057,2)=290.70; net = 4809.30"
            - "Enrollment.${enr_id}.computed_payment_cents == 480930"
            - "Enrollment.${enr_id}.sequestration_cents == 29070"

      - name: aph_rounding_order_pinned
        grounds:
          - calculations.aph_yield_calculation
        distinguishing_aspect: |
          Mode (b) nested rounding: APH must round each disaster-substituted
          effective_yield (0.65*T) to 1 decimal BEFORE averaging, not round the
          final average only — the scaffold pins per-observation rounding order.
          For CORN T=180, 0.65*180=117.0 (exact); a value like 0.65*181=117.65
          rounds to 117.7 per-observation and changes the average vs sum-then-round.
        test_recipe:
          setup:
            - "Farm F, Producer P, YieldRecord CORN with observations mixing disaster-substituted and actual yields"
          setup_api_calls:
            - { call: "POST /fsa/_clock/set_current_utc", payload: { to_iso8601: "2026-02-01T00:00:00Z" }, as: CountySpecialist }
            - { call: "POST /fsa/farms", payload: { farm_number: "F400", county_code: "019", program_year: 2026 }, as: CountySpecialist, captures: { farm_id: "$.data.id" } }
            - { call: "POST /fsa/producers", payload: { producer_name: "Pat", tax_id_last4: "1234", entity_type: "INDIVIDUAL" }, as: CountySpecialist, captures: { prod_id: "$.data.id" } }
            - { call: "POST /fsa/farms/${farm_id}/memberships", payload: { producer_id: "${prod_id}", share_percent: 100.00 }, as: CountySpecialist }
            - { call: "POST /fsa/farms/${farm_id}/yield-records", payload: { commodity: "CORN" }, as: CountySpecialist, captures: { yr_id: "$.data.id" } }
            - { call: "POST /fsa/yield-records/${yr_id}/observations", payload: { crop_year: 2021, actual_yield_bu_per_acre: 180.0 }, as: CountySpecialist }
            - { call: "POST /fsa/yield-records/${yr_id}/observations", payload: { crop_year: 2022, actual_yield_bu_per_acre: 180.0 }, as: CountySpecialist }
            - { call: "POST /fsa/yield-records/${yr_id}/observations", payload: { crop_year: 2023, actual_yield_bu_per_acre: 180.0 }, as: CountySpecialist }
            - { call: "POST /fsa/yield-records/${yr_id}/observations", payload: { crop_year: 2024, actual_yield_bu_per_acre: 180.0 }, as: CountySpecialist }
            - { call: "POST /fsa/yield-records/${yr_id}/observations", payload: { crop_year: 2025, actual_yield_bu_per_acre: 180.0 }, as: CountySpecialist }
          trigger:
            - { call: "POST /fsa/yield-records/${yr_id}/updates", payload: {}, as: Producer, as_user_id: "${prod_id}" }
            - { call: "GET /fsa/yield-records/${yr_id}", payload: {}, as: CountySpecialist, captures: { aph: "$.data.aph_yield_bu_per_acre" } }
          assert:
            - "APH = round_half_up((180*5)/5, 1) = 180.0; the calculation's precision clause pins per-observation round to 1 decimal before averaging"
            - "aph == 180.0"
            - "A sum-then-round-vs-round-per-line divergence is exercised by the formula's explicit ordering clause"

  # ===========================================================================
  # Rule 3 — non_linear_state_machine (different entities)
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: enrollment_remand_recertify_cycle
        grounds:
          - state_machines.Enrollment.ON_APPEAL_to_REMANDED
          - state_machines.Enrollment.REMANDED_to_CERTIFIED
          - state_machines.Appeal.COMMITTEE_HEARING_to_REMANDED
        distinguishing_aspect: |
          Enrollment follows a cycle CERTIFIED -> ON_APPEAL -> REMANDED ->
          CERTIFIED (appeal remand then recertify) — a true A->B->C->A revision
          loop on the Enrollment entity, not a linear pipeline.
        test_recipe:
          setup:
            - "Fully-certified Enrollment in PAYMENT_COMPUTED; a second Producer Q on the committee acts as reviewer; appellant is Producer P"
          setup_api_calls:
            - { call: "POST /fsa/_clock/set_current_utc", payload: { to_iso8601: "2026-02-01T00:00:00Z" }, as: CountySpecialist }
            - { call: "POST /fsa/farms", payload: { farm_number: "F500", county_code: "019", program_year: 2026 }, as: CountySpecialist, captures: { farm_id: "$.data.id", farm_v0: "$.data.version" } }
            - { call: "POST /fsa/producers", payload: { producer_name: "Appellant", tax_id_last4: "1111", entity_type: "INDIVIDUAL" }, as: CountySpecialist, captures: { prod_p: "$.data.id" } }
            - { call: "POST /fsa/producers", payload: { producer_name: "Reviewer", tax_id_last4: "2222", entity_type: "INDIVIDUAL" }, as: CountySpecialist, captures: { prod_q: "$.data.id" } }
            - { call: "POST /fsa/farms/${farm_id}/memberships", payload: { producer_id: "${prod_p}", share_percent: 100.00 }, as: CountySpecialist }
            - { call: "POST /fsa/farms/${farm_id}/tracts", payload: { tract_number: "T1", base_acres: 100.00, cropland_acres: 100.00 }, as: CountySpecialist, captures: { tract_id: "$.data.id" } }
            - { call: "POST /fsa/tracts/${tract_id}/fields", payload: { field_number: "1", acres: 100.00 }, as: CountySpecialist, captures: { field_id: "$.data.id" } }
            - { call: "POST /fsa/farms/${farm_id}/yield-records", payload: { commodity: "CORN" }, as: CountySpecialist, captures: { yr_id: "$.data.id" } }
            - { call: "POST /fsa/yield-records/${yr_id}/observations", payload: { crop_year: 2021, actual_yield_bu_per_acre: 180.0 }, as: CountySpecialist }
            - { call: "POST /fsa/yield-records/${yr_id}/observations", payload: { crop_year: 2022, actual_yield_bu_per_acre: 180.0 }, as: CountySpecialist }
            - { call: "POST /fsa/yield-records/${yr_id}/observations", payload: { crop_year: 2023, actual_yield_bu_per_acre: 180.0 }, as: CountySpecialist }
            - { call: "POST /fsa/yield-records/${yr_id}/observations", payload: { crop_year: 2024, actual_yield_bu_per_acre: 180.0 }, as: CountySpecialist }
            - { call: "POST /fsa/yield-records/${yr_id}/observations", payload: { crop_year: 2025, actual_yield_bu_per_acre: 180.0 }, as: CountySpecialist }
            - { call: "POST /fsa/yield-records/${yr_id}/updates", payload: {}, as: Producer, as_user_id: "${prod_p}" }
            - { call: "POST /fsa/yield-records/${yr_id}/certify", payload: {}, as: CountySpecialist }
            - { call: "POST /fsa/farms/${farm_id}/acreage-reports", payload: { program_year: 2026 }, as: Producer, as_user_id: "${prod_p}", captures: { ar_id: "$.data.id" } }
            - { call: "POST /fsa/acreage-reports/${ar_id}/lines", payload: { field_id: "${field_id}", crop_code: "CORN", planted_acres: 100.00, prevented_planted_acres: 0.00, intended_use: "GRAIN" }, as: Producer, as_user_id: "${prod_p}" }
            - { call: "POST /fsa/acreage-reports/${ar_id}/file", payload: {}, as: Producer, as_user_id: "${prod_p}" }
            - { call: "POST /fsa/acreage-reports/${ar_id}/certify", payload: {}, as: CountySpecialist }
            - { call: "POST /fsa/farms/${farm_id}/program-elections", payload: { program_year: 2026, commodity: "CORN", election_code: "PLC", expected_farm_version: "${farm_v0}" }, as: Producer, as_user_id: "${prod_p}" }
            - { call: "POST /fsa/producers/${prod_p}/agi-attestations", payload: { adjusted_gross_income: 50000000 }, as: Producer, as_user_id: "${prod_p}" }
            - { call: "POST /fsa/producers/${prod_p}/agi-attestations/verify", payload: {}, as: CountySpecialist }
            - { call: "POST /fsa/producers/${prod_p}/conservation-certifications", payload: {}, as: Producer, as_user_id: "${prod_p}" }
            - { call: "POST /fsa/farms/${farm_id}/enrollments", payload: { program_year: 2026, commodity: "CORN" }, as: Producer, as_user_id: "${prod_p}", captures: { enr_id: "$.data.id" } }
            - { call: "POST /fsa/enrollments/${enr_id}/submit", payload: {}, as: Producer, as_user_id: "${prod_p}" }
            - { call: "POST /fsa/enrollments/${enr_id}/ced-approve", payload: {}, as: CountyExecutiveDirector }
            - { call: "POST /fsa/enrollments/${enr_id}/certify", payload: {}, as: CountyCommittee, as_user_id: "${prod_q}" }
            - { call: "POST /fsa/enrollments/${enr_id}/compute-payment", payload: { national_my_price: 3.50 }, as: CountySpecialist }
            - { call: "POST /fsa/appeals", payload: { farm_id: "${farm_id}", enrollment_id: "${enr_id}", ground_code: "FACTUAL_ERROR", filed_by_producer_id: "${prod_p}" }, as: Producer, as_user_id: "${prod_p}", captures: { app_id: "$.data.id" } }
            - { call: "POST /fsa/appeals/${app_id}/assign-ced", payload: {}, as: CountyExecutiveDirector }
            - { call: "POST /fsa/appeals/${app_id}/refer-to-committee", payload: { assigned_reviewer_producer_id: "${prod_q}" }, as: CountyExecutiveDirector }
            - { call: "POST /fsa/appeals/${app_id}/remand", payload: { remand_instructions: "Re-verify yield evidence" }, as: CountyCommittee, as_user_id: "${prod_q}" }
          trigger:
            - { call: "POST /fsa/enrollments/${enr_id}/recertify", payload: {}, as: CountyCommittee, as_user_id: "${prod_q}" }
            - { call: "GET /fsa/enrollments/${enr_id}", payload: {}, as: CountySpecialist, captures: { status_after: "$.data.enrollment_status" } }
          assert:
            - "After remand, enrollment_status was REMANDED; recertify returns it to CERTIFIED"
            - "status_after == CERTIFIED"
            - "The enrollment traversed CERTIFIED->ON_APPEAL->REMANDED->CERTIFIED (a cycle)"

      - name: program_election_supersede_cycle
        grounds:
          - state_machines.ProgramElection.ACTIVE_to_SUPERSEDED
        distinguishing_aspect: |
          ProgramElection undergoes ACTIVE -> SUPERSEDED -> (new) ACTIVE when a
          producer files a replacement election inside the window — a branching
          supersede loop where the latest ACTIVE election displaces its predecessor,
          divergent side-effects (Farm.version bump) per supersede round.
        test_recipe:
          setup:
            - "Farm F, Producer P member, election window open (clock <= 2026-03-16)"
          setup_api_calls:
            - { call: "POST /fsa/_clock/set_current_utc", payload: { to_iso8601: "2026-02-01T00:00:00Z" }, as: CountySpecialist }
            - { call: "POST /fsa/farms", payload: { farm_number: "F600", county_code: "019", program_year: 2026 }, as: CountySpecialist, captures: { farm_id: "$.data.id", farm_v0: "$.data.version" } }
            - { call: "POST /fsa/producers", payload: { producer_name: "Pat", tax_id_last4: "1234", entity_type: "INDIVIDUAL" }, as: CountySpecialist, captures: { prod_id: "$.data.id" } }
            - { call: "POST /fsa/farms/${farm_id}/memberships", payload: { producer_id: "${prod_id}", share_percent: 100.00 }, as: CountySpecialist }
            - { call: "POST /fsa/farms/${farm_id}/program-elections", payload: { program_year: 2026, commodity: "CORN", election_code: "PLC", expected_farm_version: "${farm_v0}" }, as: Producer, as_user_id: "${prod_id}", captures: { elec1: "$.data.id", farm_v1: "$.data.version" } }
          trigger:
            - { call: "POST /fsa/farms/${farm_id}/program-elections", payload: { program_year: 2026, commodity: "CORN", election_code: "ARC_CO", expected_farm_version: "${farm_v1}" }, as: Producer, as_user_id: "${prod_id}", captures: { elec2: "$.data.id" } }
            - { call: "GET /fsa/program-elections/${elec1}", payload: {}, as: CountySpecialist, captures: { elec1_status: "$.data.election_status" } }
            - { call: "GET /fsa/program-elections/${elec2}", payload: {}, as: CountySpecialist, captures: { elec2_status: "$.data.election_status" } }
          assert:
            - "elec1_status == SUPERSEDED"
            - "elec2_status == ACTIVE"
            - "The newer election displaced the older (non-linear supersede, not a forward-only pipeline)"

  # ===========================================================================
  # Rule 4 — transitive_cascade (depth >= 3 and >= 2, different triggers)
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: disaster_approval_yield_substitution_payment_recompute
        grounds:
          - state_machines.DisasterApplication.UNDER_REVIEW_to_APPROVED
          - calculations.aph_yield_calculation
          - state_machines.Enrollment.CERTIFIED_to_PAYMENT_COMPUTED
        distinguishing_aspect: |
          Depth-3 cascade: DisasterApplication.APPROVED mutates YieldObservation
          (is_disaster_substituted=true) -> that mutation recomputes
          YieldRecord.aph_yield -> that recompute re-triggers compute-payment on the
          pinned Enrollment, changing computed_payment_cents. Each hop is caused by
          the prior, not by the original approve call.
        test_recipe:
          setup:
            - "CERTIFIED enrollment with PLC election and payment computed at APH 180.0; one YieldObservation (2024) has actual_yield 100.0 (< 65% of T=180 -> eligible for substitution); disaster application UNDER_REVIEW with loss >= 35%"
          setup_api_calls:
            - { call: "POST /fsa/_clock/set_current_utc", payload: { to_iso8601: "2026-02-01T00:00:00Z" }, as: CountySpecialist }
            - { call: "POST /fsa/farms", payload: { farm_number: "F700", county_code: "019", program_year: 2026 }, as: CountySpecialist, captures: { farm_id: "$.data.id", farm_v0: "$.data.version" } }
            - { call: "POST /fsa/producers", payload: { producer_name: "Pat", tax_id_last4: "1234", entity_type: "INDIVIDUAL" }, as: CountySpecialist, captures: { prod_p: "$.data.id" } }
            - { call: "POST /fsa/producers", payload: { producer_name: "Reviewer", tax_id_last4: "2222", entity_type: "INDIVIDUAL" }, as: CountySpecialist, captures: { prod_q: "$.data.id" } }
            - { call: "POST /fsa/farms/${farm_id}/memberships", payload: { producer_id: "${prod_p}", share_percent: 100.00 }, as: CountySpecialist }
            - { call: "POST /fsa/farms/${farm_id}/tracts", payload: { tract_number: "T1", base_acres: 100.00, cropland_acres: 100.00 }, as: CountySpecialist, captures: { tract_id: "$.data.id" } }
            - { call: "POST /fsa/tracts/${tract_id}/fields", payload: { field_number: "1", acres: 100.00 }, as: CountySpecialist, captures: { field_id: "$.data.id" } }
            - { call: "POST /fsa/farms/${farm_id}/yield-records", payload: { commodity: "CORN" }, as: CountySpecialist, captures: { yr_id: "$.data.id" } }
            - { call: "POST /fsa/yield-records/${yr_id}/observations", payload: { crop_year: 2021, actual_yield_bu_per_acre: 180.0 }, as: CountySpecialist }
            - { call: "POST /fsa/yield-records/${yr_id}/observations", payload: { crop_year: 2022, actual_yield_bu_per_acre: 180.0 }, as: CountySpecialist }
            - { call: "POST /fsa/yield-records/${yr_id}/observations", payload: { crop_year: 2023, actual_yield_bu_per_acre: 180.0 }, as: CountySpecialist }
            - { call: "POST /fsa/yield-records/${yr_id}/observations", payload: { crop_year: 2024, actual_yield_bu_per_acre: 100.0 }, as: CountySpecialist }
            - { call: "POST /fsa/yield-records/${yr_id}/observations", payload: { crop_year: 2025, actual_yield_bu_per_acre: 180.0 }, as: CountySpecialist }
            - { call: "POST /fsa/yield-records/${yr_id}/updates", payload: {}, as: Producer, as_user_id: "${prod_p}" }
            - { call: "POST /fsa/yield-records/${yr_id}/certify", payload: {}, as: CountySpecialist }
            - { call: "POST /fsa/farms/${farm_id}/acreage-reports", payload: { program_year: 2026 }, as: Producer, as_user_id: "${prod_p}", captures: { ar_id: "$.data.id" } }
            - { call: "POST /fsa/acreage-reports/${ar_id}/lines", payload: { field_id: "${field_id}", crop_code: "CORN", planted_acres: 100.00, prevented_planted_acres: 0.00, intended_use: "GRAIN" }, as: Producer, as_user_id: "${prod_p}" }
            - { call: "POST /fsa/acreage-reports/${ar_id}/file", payload: {}, as: Producer, as_user_id: "${prod_p}" }
            - { call: "POST /fsa/acreage-reports/${ar_id}/certify", payload: {}, as: CountySpecialist }
            - { call: "POST /fsa/farms/${farm_id}/program-elections", payload: { program_year: 2026, commodity: "CORN", election_code: "PLC", expected_farm_version: "${farm_v0}" }, as: Producer, as_user_id: "${prod_p}" }
            - { call: "POST /fsa/producers/${prod_p}/agi-attestations", payload: { adjusted_gross_income: 50000000 }, as: Producer, as_user_id: "${prod_p}" }
            - { call: "POST /fsa/producers/${prod_p}/agi-attestations/verify", payload: {}, as: CountySpecialist }
            - { call: "POST /fsa/producers/${prod_p}/conservation-certifications", payload: {}, as: Producer, as_user_id: "${prod_p}" }
            - { call: "POST /fsa/farms/${farm_id}/enrollments", payload: { program_year: 2026, commodity: "CORN" }, as: Producer, as_user_id: "${prod_p}", captures: { enr_id: "$.data.id" } }
            - { call: "POST /fsa/enrollments/${enr_id}/submit", payload: {}, as: Producer, as_user_id: "${prod_p}" }
            - { call: "POST /fsa/enrollments/${enr_id}/ced-approve", payload: {}, as: CountyExecutiveDirector }
            - { call: "POST /fsa/enrollments/${enr_id}/certify", payload: {}, as: CountyCommittee, as_user_id: "${prod_q}" }
            - { call: "POST /fsa/enrollments/${enr_id}/compute-payment", payload: { national_my_price: 3.50 }, as: CountySpecialist, captures: { pay_before: "$.data.computed_payment_cents" } }
            - { call: "POST /fsa/farms/${farm_id}/disaster-applications", payload: { program_year: 2026, disaster_type: "DROUGHT", loss_acres: 40.00, qualifying_commodity: "CORN", documentation_complete: true }, as: Producer, as_user_id: "${prod_p}", captures: { da_id: "$.data.id" } }
            - { call: "POST /fsa/disaster-applications/${da_id}/file", payload: {}, as: Producer, as_user_id: "${prod_p}" }
            - { call: "POST /fsa/disaster-applications/${da_id}/assign-reviewer", payload: {}, as: CountyExecutiveDirector }
          trigger:
            - { call: "POST /fsa/disaster-applications/${da_id}/approve", payload: {}, as: CountyCommittee, as_user_id: "${prod_q}" }
            - { call: "GET /fsa/yield-records/${yr_id}", payload: {}, as: CountySpecialist, captures: { aph_after: "$.data.aph_yield_bu_per_acre" } }
            - { call: "GET /fsa/enrollments/${enr_id}", payload: {}, as: CountySpecialist, captures: { pay_after: "$.data.computed_payment_cents" } }
          assert:
            - "APH before = (180*4 + 100)/5 = 164.0; after substitution 2024 -> 0.65*180 = 117.0, APH after = (180*4 + 117)/5 = 167.4"
            - "aph_after == 167.4"
            - "pay_before was computed at APH 164.0 (base=0.60*164*100*0.85=8364.00, net=8364-round(8364*.057,2)=8364-476.75=7887.25 => 788725); pay_after uses 167.4 and differs"
            - "pay_after != pay_before"

      - name: reconstitution_divide_tract_cascade
        grounds:
          - state_machines.Farm.ACTIVE_to_RECONSTITUTION_PENDING
          - state_machines.Tract
        distinguishing_aspect: |
          Depth-2 cascade: opening a DIVIDE reconstitution mutates source Tract to
          DIVIDED -> that mutation creates product Tract rows -> the system
          re-evaluates Farm.total_base_acres; the trigger is the reconstitution
          endpoint, distinct from the disaster-approval trigger of the other instance.
        test_recipe:
          setup:
            - "Farm F ACTIVE with a single tract T1 (base 100.00); no certified enrollments"
          setup_api_calls:
            - { call: "POST /fsa/_clock/set_current_utc", payload: { to_iso8601: "2026-02-01T00:00:00Z" }, as: CountySpecialist }
            - { call: "POST /fsa/farms", payload: { farm_number: "F800", county_code: "019", program_year: 2026 }, as: CountySpecialist, captures: { farm_id: "$.data.id", farm_v0: "$.data.version" } }
            - { call: "POST /fsa/farms/${farm_id}/tracts", payload: { tract_number: "T1", base_acres: 100.00, cropland_acres: 100.00 }, as: CountySpecialist, captures: { tract_id: "$.data.id" } }
          trigger:
            - { call: "POST /fsa/farms/${farm_id}/reconstitutions", payload: { method: "DIVIDE", source_tract_ids: ["${tract_id}"], product_specs: [{tract_number: "T1A", base_acres: 60.00, cropland_acres: 60.00}, {tract_number: "T1B", base_acres: 40.00, cropland_acres: 40.00}], expected_farm_version: "${farm_v0}" }, as: CountySpecialist, captures: { farm_after: "$.data.farm_status" } }
            - { call: "GET /fsa/tracts/${tract_id}", payload: {}, as: CountySpecialist, captures: { src_status: "$.data.tract_status" } }
            - { call: "GET /fsa/farms/${farm_id}/tracts", payload: {}, as: CountySpecialist }
          assert:
            - "farm_after == RECONSTITUTION_PENDING"
            - "src_status == DIVIDED"
            - "Two product tracts T1A (60.00) and T1B (40.00) created with reconstituted_from_tract_id == ${tract_id}"
            - "Product base sum 100.00 conserves source base 100.00"

  # ===========================================================================
  # Rule 5 — priority_pair_validation_conflict (different error-category pairs)
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_temporal_on_late_certify
        grounds:
          - validations[priority=4]
          - validations[priority=6]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          Pair (state, business_temporal): certifying an acreage report that is
          already REJECTED (state violation, priority 4) while ALSO after the
          reporting deadline (temporal, priority 6) must return ERR_INVALID_STATE
          because state (4) precedes business_temporal (6).
        test_recipe:
          setup:
            - "AcreageReport REJECTED; clock is past the reporting deadline"
          setup_api_calls:
            - { call: "POST /fsa/_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: CountySpecialist }
            - { call: "POST /fsa/farms", payload: { farm_number: "F900", county_code: "019", program_year: 2026 }, as: CountySpecialist, captures: { farm_id: "$.data.id" } }
            - { call: "POST /fsa/producers", payload: { producer_name: "Pat", tax_id_last4: "1234", entity_type: "INDIVIDUAL" }, as: CountySpecialist, captures: { prod_id: "$.data.id" } }
            - { call: "POST /fsa/farms/${farm_id}/memberships", payload: { producer_id: "${prod_id}", share_percent: 100.00 }, as: CountySpecialist }
            - { call: "POST /fsa/farms/${farm_id}/tracts", payload: { tract_number: "T1", base_acres: 100.00, cropland_acres: 100.00 }, as: CountySpecialist, captures: { tract_id: "$.data.id" } }
            - { call: "POST /fsa/tracts/${tract_id}/fields", payload: { field_number: "1", acres: 100.00 }, as: CountySpecialist, captures: { field_id: "$.data.id" } }
            - { call: "POST /fsa/farms/${farm_id}/acreage-reports", payload: { program_year: 2026 }, as: Producer, as_user_id: "${prod_id}", captures: { ar_id: "$.data.id" } }
            - { call: "POST /fsa/acreage-reports/${ar_id}/lines", payload: { field_id: "${field_id}", crop_code: "CORN", planted_acres: 100.00, prevented_planted_acres: 0.00, intended_use: "GRAIN" }, as: Producer, as_user_id: "${prod_id}" }
            - { call: "POST /fsa/acreage-reports/${ar_id}/file", payload: {}, as: Producer, as_user_id: "${prod_id}" }
            - { call: "POST /fsa/acreage-reports/${ar_id}/reject", payload: { reason: "Incomplete" }, as: CountySpecialist }
            - { call: "POST /fsa/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: CountySpecialist }
          trigger:
            - { call: "POST /fsa/acreage-reports/${ar_id}/certify", payload: {}, as: CountySpecialist, captures: { err: "$.data.error_id" } }
          assert:
            - "Report is REJECTED (state violation, priority 4) AND clock is past deadline (temporal, priority 6); state wins"
            - "err == ERR_INVALID_STATE"

      - name: business_safety_vs_business_fiscal_on_payment
        grounds:
          - validations[priority=8]
          - validations[priority=17]
          - errors[ERR_AGI_INELIGIBLE]
        distinguishing_aspect: |
          Pair (business_safety, business_fiscal): an enrollment whose producer
          fails AGI (safety, priority 8/9) while ALSO having a payment that would
          exceed the limitation cap (fiscal, priority 17) must surface the safety
          error first at ced-approve; the fiscal check never runs because approval
          is the gate.
        test_recipe:
          setup:
