# =============================================================================
# §1.9 Scaffold Corner Design — Avionics Shop & STC Installation
# Breadth coverage of §1.1–§1.7 claims not already probed by §1.8.
# =============================================================================

scaffold_corner_design:
  # ---------------------------------------------------------------------------
  - section: entities
    instances:
      - name: customer_create_applies_defaults
        claim_type: creation_defaults
        grounds: ["entities.Customer.fields.customer_kind", "response_envelope"]
        distinguishing_aspect: "Omitting customer_kind yields INDIVIDUAL; system fields id/version/created_at are server-minted; success envelope carries meta.api_request_id."
        test_recipe:
          setup: ["empty database; logical clock at startup default 2026-08-01T00:00:00Z"]
          setup_api_calls:
            - { call: "POST /avionics/customers", payload: { name: "Default Dana", contact_email: "dana@x.com" }, as: ShopManager, captures: { cust_id: "$.data.id", kind: "$.data.customer_kind" } }
          trigger: []
          assert:
            - "Customer.${cust_id}.customer_kind == INDIVIDUAL (default applied)"
            - "Customer.${cust_id}.version == 1 and created_at == 2026-08-01T00:00:00Z (startup default clock)"
            - "response envelope contains meta.api_request_id and response_type == object"

      - name: aircraft_create_missing_required_tail_number
        claim_type: required_fields
        grounds: ["entities.Aircraft.fields.tail_number", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "Omitting required tail_number on aircraft create fails with ERR_VALIDATION (400) at schema priority before any existence check."
        test_recipe:
          setup: ["one customer exists"]
          setup_api_calls:
            - { call: "POST /avionics/customers", payload: { name: "Req Ruth", contact_email: "r@x.com", customer_kind: "INDIVIDUAL" }, as: ShopManager, captures: { cust_id: "$.data.id" } }
          trigger:
            - { call: "POST /avionics/aircraft", payload: { customer_id: "${cust_id}", make_model: "Cessna 182T", baseline_empty_weight_lb: 1800.0, baseline_arm_in: 40.0, cg_min_arm_in: 35.0, cg_max_arm_in: 41.5 }, as: ShopManager, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_VALIDATION and http status 400"

      - name: aircraft_duplicate_tail_number_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_DUPLICATE_TAIL_NUMBER]"]
        distinguishing_aspect: "A second aircraft with an already-registered tail_number is rejected with ERR_DUPLICATE_TAIL_NUMBER (uniqueness is global, not per-customer)."
        test_recipe:
          setup: ["one customer with aircraft N600DP already registered"]
          setup_api_calls:
            - { call: "POST /avionics/customers", payload: { name: "Dup Dan", contact_email: "d@x.com", customer_kind: "INDIVIDUAL" }, as: ShopManager, captures: { cust_id: "$.data.id" } }
            - { call: "POST /avionics/aircraft", payload: { customer_id: "${cust_id}", tail_number: "N600DP", make_model: "Cessna 182T", baseline_empty_weight_lb: 1800.0, baseline_arm_in: 40.0, cg_min_arm_in: 35.0, cg_max_arm_in: 41.5 }, as: ShopManager, captures: { ac_id: "$.data.id" } }
          trigger:
            - { call: "POST /avionics/aircraft", payload: { customer_id: "${cust_id}", tail_number: "N600DP", make_model: "Cirrus SR22", baseline_empty_weight_lb: 1700.0, baseline_arm_in: 40.0, cg_min_arm_in: 35.0, cg_max_arm_in: 41.5 }, as: ShopManager, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_DUPLICATE_TAIL_NUMBER (409)"
            - "Aircraft.${ac_id} unchanged (version == 1)"

      - name: install_task_create_invalid_enum_rejected
        claim_type: type_constraints
        grounds: ["entities.InstallTask.fields.task_kind", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "task_kind outside {HARNESS_FABRICATION, PANEL_ASSEMBLY, INSTALLATION} fails schema validation with ERR_VALIDATION."
        test_recipe:
          setup: ["work order in INSTALLATION (zero-line design approved)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: ShopManager }
            - { call: "POST /avionics/customers", payload: { name: "Enum Erin", contact_email: "e@x.com", customer_kind: "INDIVIDUAL" }, as: ShopManager, captures: { cust_id: "$.data.id" } }
            - { call: "POST /avionics/aircraft", payload: { customer_id: "${cust_id}", tail_number: "N610EN", make_model: "Cessna 182T", baseline_empty_weight_lb: 1800.0, baseline_arm_in: 40.0, cg_min_arm_in: 35.0, cg_max_arm_in: 41.5 }, as: ShopManager, captures: { ac_id: "$.data.id" } }
            - { call: "POST /avionics/work-orders", payload: { aircraft_id: "${ac_id}", scope_description: "enum probe", estimated_downtime_days: 10, quoted_labor_hours: 5, bay_code: "BAY-1", bay_window_start: "2026-08-01T00:00:00Z", bay_window_end: "2026-08-20T00:00:00Z" }, as: ShopManager, captures: { wo_id: "$.data.id", wo_v1: "$.data.version" } }
            - { call: "POST /avionics/panel-designs", payload: { work_order_id: "${wo_id}", expected_work_order_version: "${wo_v1}", layout_notes: "x", equipment_list: [] }, as: ShopManager, captures: { pd_id: "$.data.id" } }
            - { call: "POST /avionics/panel-designs/${pd_id}/submit", payload: {}, as: ShopManager }
            - { call: "POST /avionics/work-orders/${wo_id}/submit-quote", payload: {}, as: ShopManager }
            - { call: "POST /avionics/panel-designs/${pd_id}/decide", payload: { outcome: "APPROVE" }, as: Customer, as_user_id: "${cust_id}" }
            - { call: "POST /avionics/work-orders/${wo_id}/begin-installation", payload: {}, as: ShopManager }
          trigger:
            - { call: "POST /avionics/install-tasks", payload: { work_order_id: "${wo_id}", task_kind: "AVIONICS_MAGIC", description: "bad kind", estimated_hours: 1.0 }, as: ShopManager, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_VALIDATION (400)"

      - name: work_order_create_invalid_window_rejected
        claim_type: type_constraints
        grounds: ["entities.WorkOrder.fields.bay_window_end", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "bay_window_end <= bay_window_start is a schema-level rejection (ERR_VALIDATION), checked before the bay-conflict temporal rule."
        test_recipe:
          setup: ["one customer, one available aircraft"]
          setup_api_calls:
            - { call: "POST /avionics/customers", payload: { name: "Win Wendy", contact_email: "w@x.com", customer_kind: "INDIVIDUAL" }, as: ShopManager, captures: { cust_id: "$.data.id" } }
            - { call: "POST /avionics/aircraft", payload: { customer_id: "${cust_id}", tail_number: "N620WN", make_model: "Cessna 182T", baseline_empty_weight_lb: 1800.0, baseline_arm_in: 40.0, cg_min_arm_in: 35.0, cg_max_arm_in: 41.5 }, as: ShopManager, captures: { ac_id: "$.data.id" } }
          trigger:
            - { call: "POST /avionics/work-orders", payload: { aircraft_id: "${ac_id}", scope_description: "bad window", estimated_downtime_days: 10, quoted_labor_hours: 5, bay_code: "BAY-1", bay_window_start: "2026-08-20T00:00:00Z", bay_window_end: "2026-08-20T00:00:00Z" }, as: ShopManager, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_VALIDATION (400); no work order persisted (aircraft remains AVAILABLE)"

      - name: work_order_get_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]", "validations[priority=4]"]
        distinguishing_aspect: "GET on a well-formed but nonexistent work-order UUID yields ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /avionics/work-orders/00000000-0000-0000-0000-000000000000", as: ShopManager, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_NOT_FOUND and http status 404"
            - "error envelope shape: response_type == error, data.message present"

      - name: work_order_list_pagination
        claim_type: listing
        grounds: ["response_envelope", "endpoints[GET /avionics/work-orders]"]
        distinguishing_aspect: "limit/offset/has_more/total_count behave per the fixed envelope: limit=1 page 1 has_more true, offset=1 page 2 has_more false, total_count == 2."
        test_recipe:
          setup: ["two work orders on two different aircraft (same customer)"]
          setup_api_calls:
            - { call: "POST /avionics/customers", payload: { name: "Page Pam", contact_email: "p@x.com", customer_kind: "INDIVIDUAL" }, as: ShopManager, captures: { cust_id: "$.data.id" } }
            - { call: "POST /avionics/aircraft", payload: { customer_id: "${cust_id}", tail_number: "N630PG", make_model: "Cessna 182T", baseline_empty_weight_lb: 1800.0, baseline_arm_in: 40.0, cg_min_arm_in: 35.0, cg_max_arm_in: 41.5 }, as: ShopManager, captures: { ac_1: "$.data.id" } }
            - { call: "POST /avionics/aircraft", payload: { customer_id: "${cust_id}", tail_number: "N631PH", make_model: "Cirrus SR22", baseline_empty_weight_lb: 1700.0, baseline_arm_in: 40.0, cg_min_arm_in: 35.0, cg_max_arm_in: 41.5 }, as: ShopManager, captures: { ac_2: "$.data.id" } }
            - { call: "POST /avionics/work-orders", payload: { aircraft_id: "${ac_1}", scope_description: "one", estimated_downtime_days: 5, quoted_labor_hours: 2, bay_code: "BAY-1", bay_window_start: "2026-08-01T00:00:00Z", bay_window_end: "2026-08-10T00:00:00Z" }, as: ShopManager }
            - { call: "POST /avionics/work-orders", payload: { aircraft_id: "${ac_2}", scope_description: "two", estimated_downtime_days: 5, quoted_labor_hours: 2, bay_code: "BAY-2", bay_window_start: "2026-08-01T00:00:00Z", bay_window_end: "2026-08-10T00:00:00Z" }, as: ShopManager }
          trigger:
            - { call: "GET /avionics/work-orders", payload: { limit: 1, offset: 0 }, as: ShopManager }
            - { call: "GET /avionics/work-orders", payload: { limit: 1, offset: 1 }, as: ShopManager }
          assert:
            - "page 1: exactly 1 row, total_count == 2, has_more == true"
            - "page 2: exactly 1 row, total_count == 2, has_more == false"

      - name: panel_design_create_supersedes_prior_draft
        claim_type: cross_reference_link
        grounds: ["state_machines.PanelDesign.DRAFT_to_SUPERSEDED", "concurrency_rules[panel-design-create-stale-work-order]"]
        distinguishing_aspect: "Creating revision 2 with the freshly-read work-order version supersedes the DRAFT revision 1 and advances WorkOrder.version to 3 (OCC success path)."
        test_recipe:
          setup: ["work order in DRAFT with one DRAFT panel design (revision 1)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: ShopManager }
            - { call: "POST /avionics/customers", payload: { name: "Sup Sue", contact_email: "s@x.com", customer_kind: "INDIVIDUAL" }, as: ShopManager, captures: { cust_id: "$.data.id" } }
            - { call: "POST /avionics/aircraft", payload: { customer_id: "${cust_id}", tail_number: "N640SP", make_model: "Cessna 182T", baseline_empty_weight_lb: 1800.0, baseline_arm_in: 40.0, cg_min_arm_in: 35.0, cg_max_arm_in: 41.5 }, as: ShopManager, captures: { ac_id: "$.data.id" } }
            - { call: "POST /avionics/work-orders", payload: { aircraft_id: "${ac_id}", scope_description: "supersede probe", estimated_downtime_days: 10, quoted_labor_hours: 5, bay_code: "BAY-1", bay_window_start: "2026-08-01T00:00:00Z", bay_window_end: "2026-08-20T00:00:00Z" }, as: ShopManager, captures: { wo_id: "$.data.id", wo_v1: "$.data.version" } }
            - { call: "POST /avionics/panel-designs", payload: { work_order_id: "${wo_id}", expected_work_order_version: "${wo_v1}", layout_notes: "rev1", equipment_list: [] }, as: ShopManager, captures: { pd1: "$.data.id" } }
            - { call: "GET /avionics/work-orders/${wo_id}", as: ShopManager, captures: { wo_v2: "$.data.version" } }
          trigger:
            - { call: "POST /avionics/panel-designs", payload: { work_order_id: "${wo_id}", expected_work_order_version: "${wo_v2}", layout_notes: "rev2", equipment_list: [] }, as: ShopManager, captures: { pd2: "$.data.id", rev2: "$.data.revision" } }
          assert:
            - "PanelDesign.${pd2}.revision == 2 and status == DRAFT"
            - "PanelDesign.${pd1}.status == SUPERSEDED (read back via GET /avionics/panel-designs/${pd1})"
            - "WorkOrder.${wo_id}.version == 3"

  # ---------------------------------------------------------------------------
  - section: state_machines
    instances:
      - name: work_order_initial_state_draft
        claim_type: initial_state
        grounds: ["state_machines.WorkOrder"]
        distinguishing_aspect: "A new work order starts in DRAFT with zeroed derived counts, null inducted_at/completed_at, overage_acknowledged false."
        test_recipe:
          setup: ["one customer, one available aircraft"]
          setup_api_calls:
            - { call: "POST /avionics/customers", payload: { name: "Init Ian", contact_email: "i@x.com", customer_kind: "INDIVIDUAL" }, as: ShopManager, captures: { cust_id: "$.data.id" } }
            - { call: "POST /avionics/aircraft", payload: { customer_id: "${cust_id}", tail_number: "N650IN", make_model: "Cessna 182T", baseline_empty_weight_lb: 1800.0, baseline_arm_in: 40.0, cg_min_arm_in: 35.0, cg_max_arm_in: 41.5 }, as: ShopManager, captures: { ac_id: "$.data.id" } }
          trigger:
            - { call: "POST /avionics/work-orders", payload: { aircraft_id: "${ac_id}", scope_description: "init", estimated_downtime_days: 10, quoted_labor_hours: 5, bay_code: "BAY-1", bay_window_start: "2026-08-01T00:00:00Z", bay_window_end: "2026-08-20T00:00:00Z" }, as: ShopManager, captures: { wo_id: "$.data.id" } }
          assert:
            - "WorkOrder.${wo_id}.status == DRAFT and parts_pending_count == 0 and tasks_unverified_count == 0"
            - "inducted_at == null, completed_at == null, overage_acknowledged == false, total_actual_labor_hours == 0"
            - "Aircraft.${ac_id}.status == IN_SHOP (auto-transition on work-order create)"

      - name: submit_quote_without_design_rejected
        claim_type: invalid_transition
        grounds: ["state_machines.WorkOrder.DRAFT_to_PENDING_APPROVAL", "errors[ERR_NO_PANEL_DESIGN]"]
        distinguishing_aspect: "submit-quote with no panel design at all fails with ERR_NO_PANEL_DESIGN (referential gate), not ERR_INVALID_STATE."
        test_recipe:
          setup: ["work order in DRAFT, no panel designs"]
          setup_api_calls:
            - { call: "POST /avionics/customers", payload: { name: "NoDesign Ned", contact_email: "n@x.com", customer_kind: "INDIVIDUAL" }, as: ShopManager, captures: { cust_id: "$.data.id" } }
            - { call: "POST /avionics/aircraft", payload: { customer_id: "${cust_id}", tail_number: "N660ND", make_model: "Cessna 182T", baseline_empty_weight_lb: 1800.0, baseline_arm_in: 40.0, cg_min_arm_in: 35.0, cg_max_arm_in: 41.5 }, as: ShopManager, captures: { ac_id: "$.data.id" } }
            - { call: "POST /avionics/work-orders", payload: { aircraft_id: "${ac_id}", scope_description: "no design", estimated_downtime_days: 10, quoted_labor_hours: 5, bay_code: "BAY-1", bay_window_start: "2026-08-01T00:00:00Z", bay_window_end: "2026-08-20T00:00:00Z" }, as: ShopManager, captures: { wo_id: "$.data.id" } }
          trigger:
            - { call: "POST /avionics/work-orders/${wo_id}/submit-quote", payload: {}, as: ShopManager, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_NO_PANEL_DESIGN; WorkOrder.${wo_id}.status remains DRAFT"

      - name: decide_draft_design_rejected
        claim_type: invalid_transition
        grounds: ["state_machines.PanelDesign.SUBMITTED_to_APPROVED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "decide on a DRAFT (never submitted) design is rejected with ERR_INVALID_STATE — decide is only valid from SUBMITTED."
        test_recipe:
          setup: ["work order DRAFT with a DRAFT design"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: ShopManager }
            - { call: "POST /avionics/customers", payload: { name: "Draft Dee", contact_email: "d@x.com", customer_kind: "INDIVIDUAL" }, as: ShopManager, captures: { cust_id: "$.data.id" } }
            - { call: "POST /avionics/aircraft", payload: { customer_id: "${cust_id}", tail_number: "N670DR", make_model: "Cessna 182T", baseline_empty_weight_lb: 1800.0, baseline_arm_in: 40.0, cg_min_arm_in: 35.0, cg_max_arm_in: 41.5 }, as: ShopManager, captures: { ac_id: "$.data.id" } }
            - { call: "POST /avionics/work-orders", payload: { aircraft_id: "${ac_id}", scope_description: "draft decide", estimated_downtime_days: 10, quoted_labor_hours: 5, bay_code: "BAY-1", bay_window_start: "2026-08-01T00:00:00Z", bay_window_end: "2026-08-20T00:00:00Z" }, as: ShopManager, captures: { wo_id: "$.data.id", wo_v1: "$.data.version" } }
            - { call: "POST /avionics/panel-designs", payload: { work_order_id: "${wo_id}", expected_work_order_version: "${wo_v1}", layout_notes: "x", equipment_list: [] }, as: ShopManager, captures: { pd_id: "$.data.id" } }
          trigger:
            - { call: "POST /avionics/panel-designs/${pd_id}/decide", payload: { outcome: "APPROVE" }, as: Customer, as_user_id: "${cust_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_INVALID_STATE; PanelDesign.${pd_id}.status remains DRAFT"

      - name: decide_approved_design_rejected
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.PanelDesign"]
        distinguishing_aspect: "APPROVED is terminal for a design: a second decide is rejected with ERR_INVALID_STATE."
        test_recipe:
          setup: ["work order PENDING_APPROVAL then approved via customer decide; design APPROVED"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: ShopManager }
            - { call: "POST /avionics/customers", payload: { name: "Term Tom", contact_email: "t@x.com", customer_kind: "INDIVIDUAL" }, as: ShopManager, captures: { cust_id: "$.data.id" } }
            - { call: "POST /avionics/aircraft", payload: { customer_id: "${cust_id}", tail_number: "N680TM", make_model: "Cessna 182T", baseline_empty_weight_lb: 1800.0, baseline_arm_in: 40.0, cg_min_arm_in: 35.0, cg_max_arm_in: 41.5 }, as: ShopManager, captures: { ac_id: "$.data.id" } }
            - { call: "POST /avionics/work-orders", payload: { aircraft_id: "${ac_id}", scope_description: "terminal", estimated_downtime_days: 10, quoted_labor_hours: 5, bay_code: "BAY-1", bay_window_start: "2026-08-01T00:00:00Z", bay_window_end: "2026-08-20T00:00:00Z" }, as: ShopManager, captures: { wo_id: "$.data.id", wo_v1: "$.data.version" } }
            - { call: "POST /avionics/panel-designs", payload: { work_order_id: "${wo_id}", expected_work_order_version: "${wo_v1}", layout_notes: "x", equipment_list: [] }, as: ShopManager, captures: { pd_id: "$.data.id" } }
            - { call: "POST /avionics/panel-designs/${pd_id}/submit", payload: {}, as: ShopManager }
            - { call: "POST /avionics/work-orders/${wo_id}/submit-quote", payload: {}, as: ShopManager }
            - { call: "POST /avionics/panel-designs/${pd_id}/decide", payload: { outcome: "APPROVE" }, as: Customer, as_user_id: "${cust_id}" }
          trigger:
            - { call: "POST /avionics/panel-designs/${pd_id}/decide", payload: { outcome: "REQUEST_CHANGES" }, as: Customer, as_user_id: "${cust_id}", captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_INVALID_STATE; PanelDesign.${pd_id}.status remains APPROVED"

      - name: cancelled_work_order_locks_actions
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.WorkOrder"]
        distinguishing_aspect: "CANCELLED is terminal: begin-installation on a cancelled work order fails with ERR_INVALID_STATE; the aircraft is released back to AVAILABLE by the cancel cascade."
        test_recipe:
          setup: ["work order cancelled from DRAFT"]
          setup_api_calls:
            - { call: "POST /avionics/customers", payload: { name: "Lock Lee", contact_email: "l@x.com", customer_kind: "INDIVIDUAL" }, as: ShopManager, captures: { cust_id: "$.data.id" } }
            - { call: "POST /avionics/aircraft", payload: { customer_id: "${cust_id}", tail_number: "N690LK", make_model: "Cessna 182T", baseline_empty_weight_lb: 1800.0, baseline_arm_in: 40.0, cg_min_arm_in: 35.0, cg_max_arm_in: 41.5 }, as: ShopManager, captures: { ac_id: "$.data.id" } }
            - { call: "POST /avionics/work-orders", payload: { aircraft_id: "${ac_id}", scope_description: "lock", estimated_downtime_days: 10, quoted_labor_hours: 5, bay_code: "BAY-1", bay_window_start: "2026-08-01T00:00:00Z", bay_window_end: "2026-08-20T00:00:00Z" }, as: ShopManager, captures: { wo_id: "$.data.id" } }
            - { call: "POST /avionics/work-orders/${wo_id}/cancel", payload: {}, as: ShopManager }
          trigger:
            - { call: "POST /avionics/work-orders/${wo_id}/begin-installation", payload: {}, as: ShopManager, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_INVALID_STATE; WorkOrder.${wo_id}.status remains CANCELLED"
            - "Aircraft.${ac_id}.status == AVAILABLE after the cancel cascade"

      - name: receive_planned_order_rejected
        claim_type: invalid_transition
        grounds: ["state_machines.EquipmentOrder.ORDERED_to_RECEIVED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "receive is valid only from ORDERED; a PLANNED order rejects with ERR_INVALID_STATE, then mark-ordered + receive walks the valid path."
        test_recipe:
          setup: ["work order PARTS_PENDING with one auto-created PLANNED order (one-line design approved)"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T09:00:00Z" }, as: ShopManager }
            - { call: "POST /avionics/customers", payload: { name: "Recv Rita", contact_email: "r2@x.com", customer_kind: "INDIVIDUAL" }, as: ShopManager, captures: { cust_id: "$.data.id" } }
            - { call: "POST /avionics/aircraft", payload: { customer_id: "${cust_id}", tail_number: "N700RC", make_model: "Cessna 172S", baseline_empty_weight_lb: 1800.0, baseline_arm_in: 40.0, cg_min_arm_in: 35.0, cg_max_arm_in: 41.5 }, as: ShopManager, captures: { ac_id: "$.data.id" } }
            - { call: "POST /avionics/work-orders", payload: { aircraft_id: "${ac_id}", scope_description: "recv probe", estimated_downtime_days: 20, quoted_labor_hours: 10, bay_code: "BAY-1", bay_window_start: "2026-08-01T00:00:00Z", bay_window_end: "2026-08-30T00:00:00Z" }, as: ShopManager, captures: { wo_id: "$.data.id", wo_v1: "$.data.version" } }
