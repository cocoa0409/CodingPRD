# =============================================================================
# PRD Benchmark Seed Tables — Hotel Group Sales & Room Block Management
# Sections §1.0 – §1.7 (see prd-bench-scaffold-generator SKILL.md)
# Difficulty design → SCAFFOLD_DIFFICULTY_DESIGN.yaml
# Corner design     → SCAFFOLD_CORNER_DESIGN.yaml
# =============================================================================

scenario: |
  2864. Hotel Group Sales & Room Block Management (hotel group sales office): lead qualification with dates, room night value, meeting space needs and displacement analysis, rate quoting with concession packages, comp room ratios and rebate structures, contract terms including attrition thresholds, cancellation damage schedules and force majeure language, room block setup with cutoff dates, sub-blocks and rooming list management, pickup monitoring against the block with release of unsold rooms and attrition liability calculation, upsell and ancillary revenue capture across banquets, audiovisual and parking, post-event reconciliation of actualized rooms, attrition billing and rebate payment, repeat business and rebooking incentives

domain_name: "hotel-group-sales"
api_prefix: "/group-sales"

complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: flat
  # Peer entities linked by explicit foreign keys. Child collections are reached
  # either by a filtered list (`GET /group-sales/rate-quotes?lead_id=...`) or by a
  # read-only sub-resource projection (`GET /group-sales/room-blocks/{id}/nights`);
  # no entity is *created* through a nested path except the two cascade-created
  # children (master RoomBlock + BlockNight) and the per-contract Reconciliation.

  state_machine_shape: cyclic
  # Lead cycles QUOTED -> DISPLACEMENT_REVIEW -> CLEARED -> QUOTED whenever a
  # revision raises the quoted peak rooms; RateQuote cycles PROPOSED -> COUNTERED
  # -> PROPOSED across negotiation rounds; RoomBlock carries two independent
  # dimensions (inventory_status x billing_status) that advance on their own axes.

  relationship_patterns:
    - one_to_many          # GroupAccount -> Lead, GroupContract -> RoomBlock
    - self_referential     # RoomBlock.parent_block_id -> RoomBlock.id (sub-blocks)
    - cross_aggregate      # RateQuote -> ConcessionPackage, Reconciliation -> AncillaryCharge
    - polymorphic: false

  role_model: segregation_of_duties
  # The RevenueManager user who requested a DisplacementAnalysis may not be the
  # user who overrides it; the user who prepared a Reconciliation may not be the
  # user who finalizes it, even when that human also holds AccountingClerk.

  consistency_model: immediate

  difficulty_level: expert_plus
  # 13 entities / 54 endpoints / 51 error codes / 13 calculations (2 with
  # divergent variants) / 9 state machines / 4 OCC rules / 32 ordered validations.

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: GroupAccount
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Legal name of the client organization"
        constraints: "1..120 chars, non-blank"
      - name: market_segment
        type: enum
        source: input
        description: "Segment used as the qualification multiplier"
        constraints: "CORPORATE | ASSOCIATION | GOVERNMENT | SMERF"
      - name: billing_contact_email
        type: string
        source: input
        description: "Where attrition invoices and rebate advices are sent"
        constraints: "must contain '@'"
      - name: credit_hold
        type: boolean
        source: input
        default: false
        description: "When true the account may not sign new contracts"
      - name: repeat_group_count
        type: integer
        source: computed
        default: 0
        description: "count of GroupContract rows reachable as GroupContract.quote_id -> RateQuote.lead_id -> Lead.account_id == this account AND GroupContract.status == COMPLETED"
      - name: lifetime_actualized_room_nights
        type: integer
        source: computed
        default: 0
        description: "sum of Reconciliation.actualized_room_nights over Reconciliation rows with status == FINALIZED whose contract resolves to this account"
      - name: last_completed_departure_date
        type: string
        source: computed
        description: "max GroupContract.departure_date over that account's GroupContract rows with status == COMPLETED; null when none"
        constraints: "ISO date YYYY-MM-DD or null"
      - name: rebooking_incentive_pct
        type: number
        source: computed
        default: 0.01
        description: "Repeat-business tier rate per calculations.account_rebooking_tier; re-evaluated on every read against the logical clock"
        constraints: "one of 0.01 | 0.03 | 0.05"

  - name: Lead
    parent: null
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: input
        description: "FK -> GroupAccount.id; owning client organization"
      - name: owner_user_id
        type: string
        source: system
        description: "X-User-ID of the SalesManager that created the lead"
      - name: program_name
        type: string
        source: input
        description: "Client-facing name of the program / convention"
        constraints: "1..120 chars"
      - name: arrival_date
        type: string
        source: input
        description: "First occupied stay date of the program"
        constraints: "ISO date YYYY-MM-DD"
      - name: departure_date
        type: string
        source: input
        description: "Departure date; the stay-date range is half-open [arrival_date, departure_date)"
        constraints: "ISO date, strictly greater than arrival_date"
      - name: nights_count
        type: integer
        source: computed
        description: "departure_date - arrival_date in whole days; equals the number of occupied stay dates"
      - name: peak_rooms
        type: integer
        source: input
        description: "Rooms requested on the peak night"
        constraints: ">= 1"
      - name: total_requested_room_nights
        type: integer
        source: input
        description: "Total room nights requested across the pattern"
        constraints: ">= 1"
      - name: meeting_space_sqft_needed
        type: integer
        source: input
        description: "Function space square footage the program needs"
        constraints: ">= 0"
      - name: decision_deadline_at
        type: datetime
        source: input
        description: "Client's stated decision date"
        constraints: "ISO 8601 UTC with three fractional digits accepted"
      - name: status
        type: enum
        source: system
        default: NEW
        description: "Lead lifecycle state per state_machines.Lead"
        constraints: "NEW | QUALIFIED | TURNED_DOWN | DISPLACEMENT_REVIEW | CLEARED | QUOTED | WON | LOST"
      - name: qualification_score
        type: integer
        source: computed
        description: "0..100 score written by POST /group-sales/leads/{id}/qualify; null before qualification"
      - name: estimated_room_night_value_cents
        type: integer
        source: computed
        description: "Projected group rooms revenue per calculations.lead_room_night_value; null before qualification"

  - name: InventoryDay
    parent: null
    common_fields: true
    fields:
      - name: stay_date
        type: string
        source: input
        description: "The calendar date this inventory row describes"
        constraints: "ISO date YYYY-MM-DD; unique across InventoryDay rows"
      - name: total_rooms
        type: integer
        source: input
        description: "Sellable rooms in the hotel on this date"
        constraints: ">= 1"
      - name: group_ceiling_rooms
        type: integer
        source: input
        description: "Maximum rooms on this date that may be held plus committed to groups"
        constraints: "0 <= group_ceiling_rooms <= total_rooms"
      - name: transient_demand_rooms
        type: integer
        source: input
        description: "Forecast unconstrained transient demand on this date"
        constraints: ">= 0"
      - name: transient_adr_cents
        type: integer
        source: input
        description: "Forecast transient average daily rate in cents"
        constraints: ">= 0"
      - name: historical_pickup_rooms
        type: integer
        source: input
        description: "Same-date-last-year realized transient rooms"
        constraints: ">= 0"
      - name: historical_adr_cents
        type: integer
        source: input
        description: "Same-date-last-year realized transient ADR in cents"
        constraints: ">= 0"
      - name: held_group_rooms
        type: integer
        source: computed
        default: 0
        description: "Rooms soft-held on this date by RateQuote rows with status IN {PROPOSED, COUNTERED}"
      - name: committed_group_rooms
        type: integer
        source: computed
        default: 0
        description: "Rooms hard-committed on this date by master RoomBlock rows (parent_block_id == null) whose BlockNight for this date is still unreleased"

  - name: ConcessionPackage
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Package label, e.g. PLATINUM_CITYWIDE"
        constraints: "1..60 chars"
      - name: room_rate_discount_pct
        type: number
        source: input
        description: "Fraction taken off the quoted base rate"
        constraints: "0 <= x <= 0.5"
      - name: comp_room_ratio
        type: integer
        source: input
        description: "One complimentary room night is earned per this many paid room nights"
        constraints: ">= 1"
      - name: rebate_per_room_night_cents
        type: integer
        source: input
        description: "Cents rebated to the client per billable room night at reconciliation"
        constraints: ">= 0"
      - name: banquet_discount_pct
        type: number
        source: input
        description: "Fraction taken off BANQUET ancillary charges"
        constraints: "0 <= x <= 0.5"
      - name: av_discount_pct
        type: number
        source: input
        description: "Fraction taken off AUDIOVISUAL ancillary charges"
        constraints: "0 <= x <= 0.5"
      - name: parking_discount_pct
        type: number
        source: input
        description: "Fraction taken off PARKING ancillary charges"
        constraints: "0 <= x <= 0.5"
      - name: min_peak_rooms
        type: integer
        source: input
        description: "Eligibility floor on Lead.peak_rooms"
        constraints: ">= 0"
      - name: min_total_room_nights
        type: integer
        source: input
        description: "Eligibility floor on Lead.total_requested_room_nights"
        constraints: ">= 0"
      - name: max_discount_stack_pct
        type: number
        source: input
        description: "Cap on the sum of the four discount fractions"
        constraints: "0 < x <= 1"
      - name: discount_stack_pct
        type: number
        source: computed
        description: "room_rate_discount_pct + banquet_discount_pct + av_discount_pct + parking_discount_pct"

  - name: DisplacementAnalysis
    parent: null
    common_fields: true
    fields:
      - name: lead_id
        type: string
        source: input
        description: "FK -> Lead.id; the lead whose dates are being analysed"
      - name: analysis_variant
        type: enum
        source: input
        description: "Which demand/ADR series the analysis consumes"
        constraints: "FORECAST_BASED | HISTORICAL_BASED"
      - name: requested_by_user_id
        type: string
        source: system
        description: "X-User-ID of the RevenueManager that requested the analysis"
      - name: decided_by_user_id
        type: string
        source: system
        description: "X-User-ID recorded by POST /group-sales/displacement-analyses/{id}/decide; null while PENDING"
      - name: status
        type: enum
        source: system
        default: PENDING
        description: "Analysis lifecycle state per state_machines.DisplacementAnalysis"
        constraints: "PENDING | APPROVED | REJECTED"
      - name: verdict
        type: enum
        source: computed
        description: "ACCEPT when net_benefit_cents >= 0, else OVERRIDE_REQUIRED"
        constraints: "ACCEPT | OVERRIDE_REQUIRED"
      - name: displaced_room_nights
        type: integer
        source: computed
        description: "Sum of per-date displaced transient rooms per calculations.displacement_cost"
      - name: displaced_revenue_cents
        type: integer
        source: computed
        description: "Displaced transient revenue in cents per calculations.displacement_cost"
      - name: group_revenue_cents
        type: integer
        source: computed
        description: "Copied from Lead.estimated_room_night_value_cents at analysis creation"
      - name: ancillary_projection_cents
        type: integer
        source: computed
        description: "Projected banquet/AV/parking spend per calculations.displacement_cost"
      - name: net_benefit_cents
        type: integer
        source: computed
        description: "group_revenue_cents + ancillary_projection_cents - displaced_revenue_cents"
      - name: override_reason
        type: string
        source: input
        description: "Written justification supplied on decide when verdict == OVERRIDE_REQUIRED; null otherwise"

  - name: RateQuote
    parent: null
    common_fields: true
    fields:
      - name: lead_id
        type: string
        source: input
        description: "FK -> Lead.id; the lead being quoted"
      - name: concession_package_id
        type: string
        source: input
        description: "FK -> ConcessionPackage.id; package whose terms are pinned onto this quote"
      - name: prepared_by_user_id
        type: string
        source: system
        description: "X-User-ID of the SalesManager that created the quote"
      - name: negotiation_round
        type: integer
        source: computed
        default: 1
        description: "Increments by 1 on every POST /group-sales/rate-quotes/{id}/revise"
      - name: status
        type: enum
        source: system
        default: DRAFT
        description: "Quote lifecycle state per state_machines.RateQuote"
        constraints: "DRAFT | PROPOSED | COUNTERED | ACCEPTED | WITHDRAWN | EXPIRED"
      - name: base_rate_cents
        type: integer
        source: input
        description: "Rack-side starting nightly rate before concessions"
        constraints: ">= 1"
      - name: quoted_peak_rooms
        type: integer
        source: input
        description: "Peak-night rooms this quote holds"
        constraints: ">= 1"
      - name: quoted_room_nights
        type: integer
        source: input
        description: "Total room nights this quote prices"
        constraints: ">= 1"
      - name: comp_room_ratio
        type: integer
        source: computed
        description: "Pinned copy of ConcessionPackage.comp_room_ratio taken at quote creation; later package edits do not move it"
      - name: rebate_per_room_night_cents
        type: integer
        source: computed
        description: "Pinned copy of ConcessionPackage.rebate_per_room_night_cents taken at quote creation"
      - name: effective_net_rate_cents
        type: integer
        source: computed
        description: "Net nightly rate per calculations.effective_net_rate"
      - name: total_quote_value_cents
        type: integer
        source: computed
        description: "effective_net_rate_cents * quoted_room_nights"
      - name: expires_at
        type: datetime
        source: input
        description: "Instant after which the quote may no longer be countered or accepted"
        constraints: "ISO 8601 UTC"
      - name: hold_placed
        type: boolean
        source: computed
        default: false
        description: "True while this quote's rooms are counted in InventoryDay.held_group_rooms"
      - name: countered_base_rate_cents
        type: integer
        source: input
        description: "Client's counter-offer nightly rate; null until POST /group-sales/rate-quotes/{id}/counter"
      - name: counter_note
        type: string
        source: input
        description: "Free-text counter rationale supplied by the GroupContact; null until countered"

  - name: GroupContract
    parent: null
    common_fields: true
    fields:
      - name: quote_id
        type: string
        source: input
        description: "FK -> RateQuote.id; the ACCEPTED quote this contract papers"
      - name: status
        type: enum
        source: system
        default: DRAFT
        description: "Contract lifecycle state per state_machines.GroupContract"
        constraints: "DRAFT | SENT | SIGNED | COMPLETED | CANCELLED | TERMINATED_FORCE_MAJEURE"
      - name: attrition_threshold_pct
        type: number
        source: input
        description: "Fraction of the contracted commitment the group must actualize to avoid damages"
        constraints: "0.5 <= x <= 1.0"
      - name: attrition_basis
        type: enum
        source: input
        description: "Which commitment the attrition test measures; selects the calculations.attrition_liability variant"
        constraints: "ROOM_NIGHTS | PEAK_NIGHT"
      - name: force_majeure_clause
        type: enum
        source: input
        description: "Strength of the force-majeure language; drives the FORCE_MAJEURE branch of calculations.cancellation_damages"
        constraints: "NONE | STANDARD | EXPANDED"
      - name: cutoff_days_before_arrival
        type: integer
        source: input
        description: "Days before arrival_date on which the block cuts off"
        constraints: "1 <= x <= 120"
      - name: contracted_room_nights
        type: integer
        source: input
        description: "Total room nights the client commits to"
        constraints: ">= 1; must equal the sum of nightly_allotments[].rooms; must be <= RateQuote.quoted_room_nights"
      - name: contracted_peak_rooms
        type: integer
        source: input
        description: "Committed rooms on the peak night"
        constraints: ">= 1; must equal max(nightly_allotments[].rooms)"
      - name: nightly_allotments
        type: array
        source: input
        description: "Per-date allotment plan, array of { stay_date, rooms }; consumed by the sign cascade to mint the master RoomBlock's BlockNight rows"
        constraints: "1..60 entries, stay_date values unique, each inside [arrival_date, departure_date), rooms >= 1"
      - name: contracted_rate_cents
        type: integer
        source: computed
        description: "Pinned copy of RateQuote.effective_net_rate_cents at contract creation"
      - name: arrival_date
        type: string
        source: computed
        description: "Copied from the quote's Lead.arrival_date at contract creation"
      - name: departure_date
        type: string
        source: computed
        description: "Copied from the quote's Lead.departure_date at contract creation"
      - name: nights_count
        type: integer
        source: computed
        description: "departure_date - arrival_date in whole days"
      - name: signed_by_user_id
        type: string
        source: system
        description: "X-User-ID of the ContractAdmin that signed; null before signature"
      - name: signed_at
        type: datetime
        source: system
        description: "Logical-clock instant of signature; null before signature"
      - name: signature_name
        type: string
        source: input
        description: "Printed name captured on the signature line; null before signature"
      - name: cancellation_reason
        type: enum
        source: system
        description: "Reason recorded by POST /group-sales/contracts/{id}/cancel; null unless cancelled"
        constraints: "CLIENT_CANCEL | FORCE_MAJEURE"
      - name: assessed_damages_cents
        type: integer
        source: computed
        default: 0
        description: "Attrition damages (from a FINALIZED Reconciliation) or cancellation damages, whichever path fired"
      - name: ancillary_posted_cents
        type: integer
        source: computed
        default: 0
        description: "Sum of AncillaryCharge.net_amount_cents for this contract with status == POSTED"
      - name: rebate_paid_cents
        type: integer
        source: computed
        default: 0
        description: "Rebate actually paid out by the FINALIZED Reconciliation; 0 otherwise"
      - name: receivable_total_cents
        type: integer
        source: computed
        default: 0
        description: "Conserved ledger quantity: ancillary_posted_cents + assessed_damages_cents - rebate_paid_cents"

  - name: RoomBlock
    parent: null
    common_fields: true
    fields:
      - name: contract_id
        type: string
        source: input
        description: "FK -> GroupContract.id; contract this block belongs to"
      - name: parent_block_id
        type: string
        source: input
        description: "FK -> RoomBlock.id; null on the master block, set on every sub-block"
      - name: name
        type: string
        source: input
        description: "Block label; the sign cascade names the master 'MASTER'"
        constraints: "1..60 chars"
      - name: is_master
        type: boolean
        source: computed
        description: "True when parent_block_id is null"
      - name: inventory_status
        type: enum
        source: system
        default: SETUP
        description: "Inventory dimension of state_machines.RoomBlock"
        constraints: "SETUP | OPEN | CUT_OFF | RELEASED | CLOSED"
      - name: billing_status
        type: enum
        source: system
        default: UNBILLED
        description: "Billing dimension of state_machines.RoomBlock, independent of inventory_status"
        constraints: "UNBILLED | ATTRITION_ASSESSED | WAIVED | SETTLED"
      - name: cutoff_date
        type: string
        source: computed
        description: "contract.arrival_date minus contract.cutoff_days_before_arrival, in whole days"
      - name: allotted_room_nights
        type: integer
        source: computed
        description: "Sum of this block's own BlockNight.rooms_allotted"
      - name: picked_up_room_nights
        type: integer
        source: computed
        default: 0
        description: "Room nights per calculations.block_pickup; on a master block this includes sub-block pickup, on a sub-block only its own"
      - name: released_room_nights
        type: integer
        source: computed
        default: 0
        description: "Sum of this block's own BlockNight.rooms_released"
      - name: peak_night_rooms
        type: integer
        source: computed
        default: 0
        description: "max over this block's BlockNight rows of rooms_picked_up (own reservations only)"
      - name: comp_room_nights
        type: integer
        source: computed
        default: 0
        description: "Room nights on this block's Reservation rows with is_comp == true and status != CANCELLED"
      - name: waived_by_user_id
        type: string
        source: system
        description: "X-User-ID of the RevenueManager that waived attrition on this block; null otherwise"
      - name: waiver_reason
        type: string
        source: input
        description: "Justification captured by POST /group-sales/room-blocks/{id}/waive-attrition; null otherwise"

  - name: BlockNight
    parent: RoomBlock
    common_fields: true
    fields:
      - name: block_id
        type: string
        source: input
        description: "FK -> RoomBlock.id; block this night belongs to"
      - name: stay_date
        type: string
        source: input
        description: "Occupied stay date"
        constraints: "ISO date; unique per block_id"
      - name: rooms_allotted
        type: integer
        source: input
        description: "Rooms allotted to this block on this date"
        constraints: ">= 1"
      - name: rooms_sub_allocated
        type: integer
        source: computed
        default: 0
        description: "Rooms of this night carved out to sub-blocks whose inventory_status != RELEASED"
      - name: rooms_picked_up
        type: integer
        source: computed
        default: 0
        description: "Rooms on this date taken by this block's own Reservation rows with status IN {PENDING, CONFIRMED, CHECKED_IN, CHECKED_OUT}"
      - name: rooms_released
        type: integer
        source: computed
        default: 0
        description: "Rooms handed back to transient by the cutoff cascade"
      - name: rooms_open
        type: integer
        source: computed
        description: "rooms_allotted - rooms_sub_allocated - rooms_picked_up - rooms_released"

  - name: Reservation
    parent: null
    common_fields: true
    fields:
      - name: block_id
        type: string
        source: input
        description: "FK -> RoomBlock.id; block the room night is drawn from"
      - name: guest_name
        type: string
        source: input
        description: "Rooming-list guest name"
        constraints: "1..80 chars; unique per (block_id, arrival_date) among non-CANCELLED reservations"
      - name: arrival_date
        type: string
        source: input
        description: "First occupied stay date of this reservation"
      - name: departure_date
        type: string
        source: input
        description: "Departure date; occupies the half-open range [arrival_date, departure_date)"
        constraints: "strictly greater than arrival_date"
      - name: source
        type: enum
        source: input
        description: "How the room night arrived"
        constraints: "ROOMING_LIST | INDIVIDUAL_CALL"
      - name: room_nights
        type: integer
        source: computed
        description: "departure_date - arrival_date in whole days"
      - name: is_comp
        type: boolean
        source: computed
        default: false
        description: "Complimentary designation per calculations.comp_room_entitlement"
      - name: rate_cents
        type: integer
        source: computed
        description: "0 when is_comp is true, else the contract's contracted_rate_cents"
      - name: status
        type: enum
        source: system
        default: PENDING
        description: "Reservation lifecycle state per state_machines.Reservation"
        constraints: "PENDING | CONFIRMED | CHECKED_IN | CHECKED_OUT | CANCELLED | NO_SHOW"
      - name: disposition_reason
        type: string
        source: input
        description: "Free text captured on cancel/no-show; null otherwise"

  - name: AncillaryCharge
    parent: null
    common_fields: true
    fields:
      - name: contract_id
        type: string
        source: input
        description: "FK -> GroupContract.id; contract the charge belongs to"
      - name: category
        type: enum
        source: input
        description: "Revenue stream; selects which package discount applies"
        constraints: "BANQUET | AUDIOVISUAL | PARKING | INTERNET"
      - name: gross_amount_cents
        type: integer
        source: input
        description: "Menu-price amount before concession discount"
        constraints: ">= 1"
      - name: discount_pct
        type: number
        source: computed
        description: "Package discount for this category per calculations.ancillary_net; INTERNET always 0"
      - name: net_amount_cents
        type: integer
        source: computed
        description: "round_half_up(gross_amount_cents * (1 - discount_pct))"
      - name: status
        type: enum
        source: system
        default: QUOTED
        description: "Charge lifecycle state per state_machines.AncillaryCharge"
        constraints: "QUOTED | POSTED | VOIDED"

  - name: Reconciliation
    parent: null
    common_fields: true
    fields:
      - name: contract_id
        type: string
        source: input
        description: "FK -> GroupContract.id; contract being reconciled"
      - name: status
        type: enum
        source: system
        default: DRAFT
        description: "Reconciliation lifecycle state per state_machines.Reconciliation"
        constraints: "DRAFT | FINALIZED | SUPERSEDED"
      - name: prepared_by_user_id
        type: string
        source: system
        description: "X-User-ID of the AccountingClerk that created the reconciliation"
      - name: finalized_by_user_id
        type: string
        source: system
        description: "X-User-ID that finalized it; null while DRAFT"
      - name: actualized_room_nights
        type: integer
        source: computed
        description: "Room nights on the contract's Reservation rows with status IN {CONFIRMED, CHECKED_IN, CHECKED_OUT, NO_SHOW}"
      - name: billable_room_nights
        type: integer
        source: computed
        description: "actualized_room_nights minus the actualized room nights whose Reservation.is_comp is true"
      - name: attrition_shortfall_room_nights
        type: integer
        source: computed
        description: "Shortfall per the contract's calculations.attrition_liability variant"
      - name: attrition_damages_cents
        type: integer
        source: computed
        description: "Damages per the contract's calculations.attrition_liability variant"
      - name: ancillary_net_cents
        type: integer
        source: computed
        description: "Sum of AncillaryCharge.net_amount_cents for this contract with status == POSTED"
      - name: gross_settlement_cents
        type: integer
        source: computed
        description: "attrition_damages_cents + ancillary_net_cents (step 1 of calculations.settlement_waterfall)"
      - name: rebate_payable_cents
        type: integer
        source: computed
        description: "Step 2 of calculations.settlement_waterfall"
      - name: net_before_incentive_cents
        type: integer
        source: computed
        description: "Step 3 of calculations.settlement_waterfall"
      - name: incentive_rate_snapshot
        type: number
        source: computed
        description: "GroupAccount.rebooking_incentive_pct read at reconciliation creation and frozen; the finalize cascade must not re-read it"
      - name: rebooking_incentive_cents
        type: integer
        source: computed
        description: "Step 5 of calculations.settlement_waterfall"
      - name: total_settlement_cents
        type: integer
        source: computed
        description: "Step 6 of calculations.settlement_waterfall"

  - name: FunctionSpaceHold
    parent: null
    common_fields: true
    fields:
      - name: lead_id
        type: string
        source: input
        description: "FK -> Lead.id; lead the meeting space is held for"
      - name: space_code
        type: enum
        source: input
        description: "Which function space is occupied"
        constraints: "GRAND_BALLROOM | SALON_A | SALON_B | BOARDROOM"
      - name: start_at
        type: datetime
        source: input
        description: "Occupation start instant"
        constraints: "ISO 8601 UTC"
      - name: end_at
        type: datetime
        source: input
        description: "Occupation end instant; the occupied interval is half-open [start_at, end_at)"
        constraints: "ISO 8601 UTC, strictly after start_at"
      - name: attendee_count
        type: integer
        source: input
        description: "Expected attendees in the set"
        constraints: ">= 1"
      - name: status
        type: enum
        source: system
        default: HELD
        description: "Hold lifecycle state per state_machines.FunctionSpaceHold"
        constraints: "HELD | CONFIRMED | RELEASED"

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  - entity: Lead
    initial_state: NEW
    terminal_states: [TURNED_DOWN, WON, LOST]
    shape: "cyclic — QUOTED -> DISPLACEMENT_REVIEW -> CLEARED -> QUOTED whenever a revision raises quoted_peak_rooms"
    transitions:
      - from: NEW
        to: QUALIFIED
        trigger: "POST /group-sales/leads/{id}/qualify"
        actor: SalesManager
        preconditions:
          - "lead.status == NEW"
          - "an InventoryDay row exists for every date in [lead.arrival_date, lead.departure_date)"
          - "calculations.lead_qualification_score >= QUALIFICATION_FLOOR (30)"
        side_effects:
          - "writes Lead.qualification_score from calculations.lead_qualification_score"
          - "writes Lead.estimated_room_night_value_cents from calculations.lead_room_night_value"
          - "increments Lead.version by 1"
      - from: NEW
        to: TURNED_DOWN
        trigger: "POST /group-sales/leads/{id}/qualify"
        actor: SalesManager
        preconditions:
          - "lead.status == NEW"
          - "an InventoryDay row exists for every date in [lead.arrival_date, lead.departure_date)"
          - "calculations.lead_qualification_score < QUALIFICATION_FLOOR (30)"
        side_effects:
          - "writes Lead.qualification_score from calculations.lead_qualification_score"
          - "writes Lead.estimated_room_night_value_cents from calculations.lead_room_night_value"
          - "cascade: every FunctionSpaceHold with lead_id == this lead and status == HELD moves to RELEASED"
          - "increments Lead.version by 1"
        note: "Branch point: the same trigger forks on the score threshold and the two branches carry different side-effect sets."
      - from: QUALIFIED
        to: DISPLACEMENT_REVIEW
        trigger: "POST /group-sales/displacement-analyses"
        actor: RevenueManager
        preconditions:
          - "lead.status IN {QUALIFIED, CLEARED, QUOTED, DISPLACEMENT_REVIEW}"
        side_effects:
          - "creates the DisplacementAnalysis row in PENDING"
          - "increments Lead.version by 1"
        note: "Only the FIRST study moves the lead's negotiation stage; re-studies (below) leave the stage where it is, which is what makes 'a PENDING analysis exists' independently observable from lead.status."
      - from: CLEARED
        to: CLEARED
        trigger: "POST /group-sales/displacement-analyses"
        actor: RevenueManager
        preconditions:
          - "lead.status IN {QUALIFIED, CLEARED, QUOTED, DISPLACEMENT_REVIEW}"
        side_effects:
          - "creates an additional PENDING DisplacementAnalysis (a re-study of already-cleared business); any earlier PENDING analysis stays PENDING"
          - "the negotiation stage does NOT move — the lead stays CLEARED while the study is open"
          - "increments Lead.version by 1"
      - from: QUOTED
        to: QUOTED
        trigger: "POST /group-sales/displacement-analyses"
        actor: RevenueManager
        preconditions:
          - "lead.status IN {QUALIFIED, CLEARED, QUOTED, DISPLACEMENT_REVIEW}"
        side_effects:
          - "creates an additional PENDING DisplacementAnalysis (a mid-negotiation re-study); the outstanding quote keeps its PROPOSED status and its inventory hold"
          - "increments Lead.version by 1 — while this study is PENDING the quote cannot be accepted (validations priority 18)"
      - from: DISPLACEMENT_REVIEW
        to: DISPLACEMENT_REVIEW
        trigger: "POST /group-sales/displacement-analyses"
        actor: RevenueManager
        preconditions:
          - "lead.status IN {QUALIFIED, CLEARED, DISPLACEMENT_REVIEW}"
        side_effects:
          - "creates an additional PENDING DisplacementAnalysis (a re-run under the other analysis_variant); earlier PENDING rows are left PENDING"
          - "increments Lead.version by 1 — this is the bump that strands a client still holding the pre-creation lead version on concurrency_rules[analysis-decide-stale-lead]"
        note: "Self-transition: the lead stays in DISPLACEMENT_REVIEW while a second analysis is requested."
      - from: DISPLACEMENT_REVIEW
        to: CLEARED
        trigger: "POST /group-sales/displacement-analyses/{id}/decide with decision == APPROVE"
        actor: RevenueManager
        preconditions:
          - "analysis.status == PENDING"
          - "analysis.lead_id == this lead and lead.status == DISPLACEMENT_REVIEW"
          - "payload.expected_lead_version == lead.version"
          - "analysis.verdict == ACCEPT, or a non-blank override_reason is supplied"
          - "X-User-ID != analysis.requested_by_user_id"
        side_effects:
          - "analysis.status becomes APPROVED and analysis.decided_by_user_id is stamped"
          - "increments Lead.version by 1"
      - from: CLEARED
        to: CLEARED
        trigger: "POST /group-sales/displacement-analyses/{id}/decide with decision == APPROVE"
        actor: RevenueManager
        preconditions:
          - "analysis.status == PENDING and analysis.lead_id == this lead"
          - "lead.status IN {CLEARED, QUOTED}"
          - "payload.expected_lead_version == lead.version"
          - "X-User-ID != analysis.requested_by_user_id"
        side_effects:
          - "analysis.status becomes APPROVED; the lead's negotiation stage is untouched because it was already past the first study"
          - "increments Lead.version by 1"
      - from: QUOTED
        to: QUOTED
        trigger: "POST /group-sales/displacement-analyses/{id}/decide with decision == APPROVE"
        actor: RevenueManager
        preconditions:
          - "analysis.status == PENDING and analysis.lead_id == this lead"
          - "lead.status IN {CLEARED, QUOTED}"
          - "payload.expected_lead_version == lead.version"
          - "X-User-ID != analysis.requested_by_user_id"
        side_effects:
          - "analysis.status becomes APPROVED; the outstanding quote becomes acceptable again because no PENDING analysis remains"
          - "increments Lead.version by 1"
      - from: QUOTED
        to: LOST
        trigger: "POST /group-sales/displacement-analyses/{id}/decide with decision == REJECT"
        actor: RevenueManager
        preconditions:
          - "analysis.status == PENDING and analysis.lead_id == this lead"
          - "lead.status IN {QUOTED, CLEARED}"
          - "payload.expected_lead_version == lead.version"
        side_effects:
          - "analysis.status becomes REJECTED and the deal dies mid-negotiation"
          - "same withdraw-and-release cascade as the DISPLACEMENT_REVIEW -> LOST transition"
          - "increments Lead.version by 1"
      - from: DISPLACEMENT_REVIEW
        to: LOST
        trigger: "POST /group-sales/displacement-analyses/{id}/decide with decision == REJECT"
        actor: RevenueManager
        preconditions:
          - "analysis.status == PENDING"
          - "payload.expected_lead_version == lead.version"
        side_effects:
          - "analysis.status becomes REJECTED"
          - "cascade: every RateQuote of the lead with status IN {DRAFT, PROPOSED, COUNTERED} moves to WITHDRAWN; each PROPOSED/COUNTERED quote releasing its hold decrements InventoryDay.held_group_rooms by quote.quoted_peak_rooms on every date in [lead.arrival_date, lead.departure_date)"
          - "cascade: every FunctionSpaceHold of the lead with status == HELD moves to RELEASED"
          - "increments Lead.version by 1"
      - from: CLEARED
        to: QUOTED
        trigger: "POST /group-sales/rate-quotes/{id}/propose"
        actor: SalesManager
        preconditions:
          - "quote.status == DRAFT and quote.lead_id == this lead"
          - "lead.status == CLEARED"
          - "for every date in [lead.arrival_date, lead.departure_date): held_group_rooms + committed_group_rooms + quote.quoted_peak_rooms <= group_ceiling_rooms"
        side_effects:
          - "quote.status becomes PROPOSED and quote.hold_placed becomes true"
          - "increments InventoryDay.held_group_rooms by quote.quoted_peak_rooms on every date in [arrival_date, departure_date)"
          - "increments Lead.version by 1"
      - from: QUOTED
        to: DISPLACEMENT_REVIEW
        trigger: "POST /group-sales/rate-quotes/{id}/revise with quoted_peak_rooms > quote.quoted_peak_rooms"
        actor: SalesManager
        preconditions:
          - "quote.status == COUNTERED and quote.lead_id == this lead"
          - "lead.status == QUOTED"
        side_effects:
          - "quote.status returns to DRAFT, quote.negotiation_round increments by 1, quote.hold_placed becomes false"
          - "decrements InventoryDay.held_group_rooms by the pre-revision quoted_peak_rooms on every date in [arrival_date, departure_date)"
          - "creates no analysis: a fresh DisplacementAnalysis must be requested and approved before the quote can be proposed again"
          - "increments Lead.version by 1"
        note: "Closes the cycle QUOTED -> DISPLACEMENT_REVIEW -> CLEARED -> QUOTED."
      - from: QUOTED
        to: WON
        trigger: "POST /group-sales/rate-quotes/{id}/accept"
        actor: GroupContact
        preconditions:
          - "quote.status IN {PROPOSED, COUNTERED} and quote.lead_id == this lead"
          - "lead.status == QUOTED"
          - "clock_now < quote.expires_at"
          - "the lead has a DisplacementAnalysis with status == APPROVED and no DisplacementAnalysis of the lead is still PENDING (validations priority 18)"
        side_effects:
          - "quote.status becomes ACCEPTED"
          - "cascade hop 2: because the quote is ACCEPTED the lead moves to WON"
          - "cascade hop 3: because the lead is WON every sibling RateQuote of the lead with status IN {DRAFT, PROPOSED, COUNTERED} moves to WITHDRAWN"
          - "cascade hop 4: because each sibling quote left PROPOSED/COUNTERED with hold_placed == true, its hold is released — InventoryDay.held_group_rooms decrements by that sibling's quoted_peak_rooms on every date in [arrival_date, departure_date) and the sibling's hold_placed becomes false"
          - "increments Lead.version by 1"

  - entity: DisplacementAnalysis
    initial_state: PENDING
    terminal_states: [APPROVED, REJECTED]
    shape: "branching — APPROVE and REJECT carry disjoint side-effect sets"
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /group-sales/displacement-analyses/{id}/decide with decision == APPROVE"
        actor: RevenueManager
        preconditions:
          - "analysis.status == PENDING"
          - "lead.status IN {DISPLACEMENT_REVIEW, CLEARED, QUOTED}"
          - "payload.expected_lead_version == lead.version"
          - "analysis.verdict == ACCEPT, or payload.override_reason is a non-blank string"
          - "X-User-ID != analysis.requested_by_user_id"
        side_effects:
          - "stamps decided_by_user_id and override_reason"
          - "moves the lead DISPLACEMENT_REVIEW -> CLEARED on a first study; a re-study approval leaves lead.status unchanged (CLEARED -> CLEARED or QUOTED -> QUOTED)"
      - from: PENDING
        to: REJECTED
        trigger: "POST /group-sales/displacement-analyses/{id}/decide with decision == REJECT"
        actor: RevenueManager
        preconditions:
          - "analysis.status == PENDING"
          - "lead.status IN {DISPLACEMENT_REVIEW, CLEARED, QUOTED}"
          - "payload.expected_lead_version == lead.version"
        side_effects:
          - "stamps decided_by_user_id"
          - "moves the lead to LOST (from DISPLACEMENT_REVIEW, CLEARED or QUOTED) with the quote-withdrawal and hold-release cascade declared on the Lead machine"

  - entity: RateQuote
    initial_state: DRAFT
    terminal_states: [ACCEPTED, WITHDRAWN, EXPIRED]
    shape: "cyclic — PROPOSED -> COUNTERED -> PROPOSED across negotiation rounds"
    transitions:
      - from: DRAFT
        to: PROPOSED
        trigger: "POST /group-sales/rate-quotes/{id}/propose"
        actor: SalesManager
        preconditions:
          - "quote.status == DRAFT"
          - "lead.status == CLEARED"
          - "the lead has a DisplacementAnalysis with status == APPROVED"
          - "for every date in [arrival_date, departure_date): held_group_rooms + committed_group_rooms + quoted_peak_rooms <= group_ceiling_rooms"
        side_effects:
          - "hold_placed becomes true and InventoryDay.held_group_rooms increases by quoted_peak_rooms on every occupied date"
          - "lead moves CLEARED -> QUOTED"
      - from: PROPOSED
        to: COUNTERED
        trigger: "POST /group-sales/rate-quotes/{id}/counter"
        actor: GroupContact
        preconditions:
          - "quote.status == PROPOSED"
          - "clock_now < quote.expires_at"
          - "X-User-ID == the lead's account_id"
        side_effects:
          - "stores countered_base_rate_cents and counter_note; the hold is retained (hold_placed stays true)"
      - from: COUNTERED
        to: PROPOSED
        trigger: "POST /group-sales/rate-quotes/{id}/revise with quoted_peak_rooms <= the current quoted_peak_rooms"
        actor: SalesManager
        preconditions:
          - "quote.status == COUNTERED"
          - "lead.status == QUOTED"
          - "for every occupied date: held_group_rooms - old quoted_peak_rooms + new quoted_peak_rooms + committed_group_rooms <= group_ceiling_rooms"
        side_effects:
          - "negotiation_round increments by 1"
          - "recomputes effective_net_rate_cents and total_quote_value_cents from the new base_rate_cents"
          - "adjusts InventoryDay.held_group_rooms by (new quoted_peak_rooms - old quoted_peak_rooms) on every occupied date"
        note: "Same trigger as the DRAFT branch below; the fork is the direction of the peak-rooms change."
      - from: COUNTERED
        to: DRAFT
        trigger: "POST /group-sales/rate-quotes/{id}/revise with quoted_peak_rooms > the current quoted_peak_rooms"
        actor: SalesManager
        preconditions:
          - "quote.status == COUNTERED"
          - "lead.status == QUOTED"
        side_effects:
          - "negotiation_round increments by 1; hold_placed becomes false"
          - "decrements InventoryDay.held_group_rooms by the pre-revision quoted_peak_rooms on every occupied date"
          - "lead moves QUOTED -> DISPLACEMENT_REVIEW, so a new analysis must be approved before re-proposing"
      - from: PROPOSED
        to: ACCEPTED
        trigger: "POST /group-sales/rate-quotes/{id}/accept"
        actor: GroupContact
        preconditions:
          - "quote.status IN {PROPOSED, COUNTERED}"
          - "clock_now < quote.expires_at"
          - "the lead has a DisplacementAnalysis with status == APPROVED and no DisplacementAnalysis of the lead is still PENDING (validations priority 18)"
          - "X-User-ID == the lead's account_id"
        side_effects:
          - "the four-hop accept cascade declared on the Lead machine fires"
          - "the accepted quote keeps its hold until the contract is signed"
      - from: COUNTERED
        to: ACCEPTED
        trigger: "POST /group-sales/rate-quotes/{id}/accept"
        actor: GroupContact
        preconditions:
          - "quote.status IN {PROPOSED, COUNTERED}"
          - "clock_now < quote.expires_at"
          - "the lead has a DisplacementAnalysis with status == APPROVED and no DisplacementAnalysis of the lead is still PENDING (validations priority 18)"
          - "X-User-ID == the lead's account_id"
        side_effects:
          - "identical to the PROPOSED -> ACCEPTED transition; the countered rate is what the contract pins"
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /group-sales/rate-quotes (a newer quote for the same lead supersedes this one) or the REJECT / accept cascades"
        actor: system
        preconditions:
          - "a sibling quote for the same lead is created, accepted, or the lead is rejected"
        side_effects:
          - "no hold movement (a DRAFT quote never held rooms)"
      - from: PROPOSED
        to: WITHDRAWN
        trigger: "system cascade from POST /group-sales/rate-quotes/{id}/accept on a sibling quote or from a REJECT decision"
        actor: system
        preconditions:
          - "quote.status IN {PROPOSED, COUNTERED} and a sibling quote of the same lead reached ACCEPTED, or the lead moved to LOST"
        side_effects:
          - "hold_placed becomes false and InventoryDay.held_group_rooms decrements by quoted_peak_rooms on every occupied date"
      - from: COUNTERED
        to: WITHDRAWN
        trigger: "system cascade from POST /group-sales/rate-quotes/{id}/accept on a sibling quote or from a REJECT decision"
        actor: system
        preconditions:
          - "quote.status IN {PROPOSED, COUNTERED} and a sibling quote of the same lead reached ACCEPTED, or the lead moved to LOST"
        side_effects:
          - "hold_placed becomes false and InventoryDay.held_group_rooms decrements by quoted_peak_rooms on every occupied date"
      - from: PROPOSED
        to: EXPIRED
        trigger: "POST /group-sales/rate-quotes/{id}/counter or /accept observed at or after quote.expires_at (lazy expiry evaluated on read-for-write)"
        actor: system
        preconditions:
          - "quote.status IN {PROPOSED, COUNTERED} and clock_now >= quote.expires_at"
        side_effects:
          - "quote.status becomes EXPIRED, hold_placed becomes false, InventoryDay.held_group_rooms decrements by quoted_peak_rooms on every occupied date, and the triggering request is rejected with ERR_QUOTE_EXPIRED"
      - from: COUNTERED
        to: EXPIRED
        trigger: "POST /group-sales/rate-quotes/{id}/counter or /accept observed at or after quote.expires_at"
        actor: system
        preconditions:
          - "quote.status IN {PROPOSED, COUNTERED} and clock_now >= quote.expires_at"
        side_effects:
          - "identical to the PROPOSED -> EXPIRED transition"

  - entity: GroupContract
    initial_state: DRAFT
    terminal_states: [COMPLETED, CANCELLED, TERMINATED_FORCE_MAJEURE]
    shape: "branching — SIGNED forks into COMPLETED (reconciled) or one of the two cancellation branches"
    transitions:
      - from: DRAFT
        to: SENT
        trigger: "POST /group-sales/contracts/{id}/send"
        actor: ContractAdmin
        preconditions:
          - "contract.status == DRAFT"
          - "quote.status == ACCEPTED"
        side_effects:
          - "increments GroupContract.version by 1"
      - from: SENT
        to: SIGNED
        trigger: "POST /group-sales/contracts/{id}/sign"
        actor: ContractAdmin
        preconditions:
          - "contract.status == SENT"
          - "the account reached through quote_id -> RateQuote.lead_id -> Lead.account_id has credit_hold == false"
          - "an InventoryDay row exists for every stay_date in nightly_allotments"
          - "for every nightly_allotments entry: held_group_rooms - accepted quote's quoted_peak_rooms + committed_group_rooms + rooms <= group_ceiling_rooms"
        side_effects:
          - "stamps signed_by_user_id, signature_name and signed_at = clock_now"
          - "creates the master RoomBlock (parent_block_id == null, name 'MASTER', inventory_status SETUP, billing_status UNBILLED) and one BlockNight per nightly_allotments entry"
          - "increments InventoryDay.committed_group_rooms by the entry's rooms on each allotment date"
          - "releases the accepted quote's soft hold: quote.hold_placed becomes false and InventoryDay.held_group_rooms decrements by quote.quoted_peak_rooms on every occupied date"
          - "cascade: every FunctionSpaceHold of the lead with status == HELD moves to CONFIRMED"
          - "increments GroupContract.version by 1"
      - from: SIGNED
        to: COMPLETED
        trigger: "POST /group-sales/reconciliations/{id}/finalize"
        actor: AccountingClerk
        preconditions:
          - "reconciliation.status == DRAFT and reconciliation.contract_id == this contract"
          - "contract.status == SIGNED"
          - "X-User-ID != reconciliation.prepared_by_user_id"
        side_effects:
          - "cascade hop 1: reconciliation.status becomes FINALIZED and finalized_by_user_id is stamped"
          - "cascade hop 2: because the reconciliation is FINALIZED the contract moves to COMPLETED, assessed_damages_cents := reconciliation.attrition_damages_cents, rebate_paid_cents := reconciliation.rebate_payable_cents, receivable_total_cents is recomputed, and every RoomBlock of the contract with billing_status == ATTRITION_ASSESSED moves to SETTLED while its inventory_status moves CUT_OFF -> CLOSED"
          - "cascade hop 3: because the contract is COMPLETED the GroupAccount recomputes repeat_group_count (+1), lifetime_actualized_room_nights (+ reconciliation.actualized_room_nights), last_completed_departure_date and re-tiers rebooking_incentive_pct per calculations.account_rebooking_tier"
          - "increments GroupContract.version by 1"
      - from: SIGNED
        to: CANCELLED
        trigger: "POST /group-sales/contracts/{id}/cancel with cancellation_reason == CLIENT_CANCEL"
        actor: ContractAdmin
        preconditions:
          - "contract.status IN {SENT, SIGNED}"
          - "clock_date < contract.arrival_date"
        side_effects:
          - "assessed_damages_cents := calculations.cancellation_damages (CLIENT_CANCEL branch); receivable_total_cents recomputed"
          - "every RoomBlock of the contract with inventory_status IN {SETUP, OPEN, CUT_OFF} moves to RELEASED; each of their BlockNight rows sets rooms_released := rooms_allotted - rooms_sub_allocated - rooms_released and rooms_picked_up := 0"
          - "for every master BlockNight released, InventoryDay.committed_group_rooms decrements by that night's remaining committed rooms"
          - "every Reservation of those blocks with status IN {PENDING, CONFIRMED} moves to CANCELLED"
          - "increments GroupContract.version by 1"
      - from: SENT
        to: CANCELLED
        trigger: "POST /group-sales/contracts/{id}/cancel with cancellation_reason == CLIENT_CANCEL"
        actor: ContractAdmin
        preconditions:
          - "contract.status IN {SENT, SIGNED}"
          - "clock_date < contract.arrival_date"
        side_effects:
          - "assessed_damages_cents := calculations.cancellation_damages (CLIENT_CANCEL branch, zero pickup); no blocks exist yet so no inventory movement"
          - "increments GroupContract.version by 1"
      - from: SIGNED
        to: TERMINATED_FORCE_MAJEURE
        trigger: "POST /group-sales/contracts/{id}/cancel with cancellation_reason == FORCE_MAJEURE"
        actor: ContractAdmin
        preconditions:
          - "contract.status IN {SENT, SIGNED}"
          - "clock_date < contract.arrival_date"
        side_effects:
          - "assessed_damages_cents := calculations.cancellation_damages (FORCE_MAJEURE branch — 0 when force_majeure_clause IN {STANDARD, EXPANDED})"
          - "every AncillaryCharge of the contract with status IN {QUOTED, POSTED} moves to VOIDED and ancillary_posted_cents becomes 0"
          - "receivable_total_cents recomputed — the compensating-invariant target of calculations.receivable_conservation"
          - "the same block-release and reservation-cancellation cascade as the CLIENT_CANCEL branch"
          - "increments GroupContract.version by 1"

  - entity: RoomBlock
    initial_state: SETUP
    terminal_states: [CLOSED, RELEASED]
    shape: "parallel dimensions — inventory_status (SETUP|OPEN|CUT_OFF|RELEASED|CLOSED) and billing_status (UNBILLED|ATTRITION_ASSESSED|WAIVED|SETTLED) advance on independent axes on the same row"
    transitions:
      - from: SETUP
        to: OPEN
        trigger: "POST /group-sales/room-blocks/{id}/open"
        actor: ReservationsAgent
        preconditions:
          - "block.inventory_status == SETUP"
          - "contract.status == SIGNED"
          - "clock_date <= block.cutoff_date"
        side_effects:
          - "increments RoomBlock.version by 1"
      - from: OPEN
        to: CUT_OFF
        trigger: "POST /group-sales/room-blocks/{id}/cutoff"
        actor: ReservationsAgent
        preconditions:
          - "block.inventory_status == OPEN"
          - "clock_date >= block.cutoff_date"
        side_effects:
          - "cascade hop 1: this block's inventory_status becomes CUT_OFF"
          - "cascade hop 2: because the block is CUT_OFF, every sub-block with parent_block_id == this block and inventory_status == OPEN also moves to CUT_OFF"
          - "cascade hop 3: because each of those blocks reached CUT_OFF, each of their BlockNight rows sets rooms_released := rooms_allotted - rooms_sub_allocated - rooms_picked_up and rooms_open becomes 0"
          - "cascade hop 4: because master BlockNight rows released rooms, InventoryDay.committed_group_rooms decrements by the released rooms on each affected stay_date (sub-block releases move no inventory — their rooms were already carved out of the master's allotment)"
          - "increments RoomBlock.version by 1 on every block touched"
      - from: CUT_OFF
        to: CLOSED
        trigger: "system cascade from POST /group-sales/reconciliations/{id}/finalize"
        actor: system
        preconditions:
          - "block.inventory_status == CUT_OFF and the contract's reconciliation reached FINALIZED"
        side_effects:
          - "billing_status moves ATTRITION_ASSESSED -> SETTLED on the same row (independent dimension)"
      - from: OPEN
        to: RELEASED
        trigger: "system cascade from POST /group-sales/contracts/{id}/cancel"
        actor: system
        preconditions:
          - "block.inventory_status IN {SETUP, OPEN, CUT_OFF} and the contract left SIGNED for CANCELLED or TERMINATED_FORCE_MAJEURE"
        side_effects:
          - "all remaining allotment is handed back: BlockNight.rooms_released absorbs the unpicked and picked rooms alike and InventoryDay.committed_group_rooms is decremented for master nights"
      - from: SETUP
        to: RELEASED
        trigger: "system cascade from POST /group-sales/contracts/{id}/cancel"
        actor: system
        preconditions:
          - "block.inventory_status IN {SETUP, OPEN, CUT_OFF} and the contract was cancelled or terminated"
        side_effects:
          - "same release cascade as the OPEN -> RELEASED transition"
      - from: CUT_OFF
        to: RELEASED
        trigger: "system cascade from POST /group-sales/contracts/{id}/cancel"
        actor: system
        preconditions:
          - "block.inventory_status IN {SETUP, OPEN, CUT_OFF} and the contract was cancelled or terminated"
        side_effects:
          - "same release cascade as the OPEN -> RELEASED transition"
      - from: "billing_status: UNBILLED"
        to: "billing_status: ATTRITION_ASSESSED"
        trigger: "POST /group-sales/contracts/{id}/reconciliations"
        actor: AccountingClerk
        preconditions:
          - "block.billing_status == UNBILLED"
          - "block.inventory_status IN {CUT_OFF, CLOSED}"
        side_effects:
          - "the block's share of calculations.attrition_liability is recorded and billing_status becomes ATTRITION_ASSESSED; inventory_status is untouched"
          - "increments RoomBlock.version by 1"
      - from: "billing_status: UNBILLED"
        to: "billing_status: WAIVED"
        trigger: "POST /group-sales/room-blocks/{id}/waive-attrition"
        actor: RevenueManager
        preconditions:
          - "block.billing_status == UNBILLED"
          - "no Reconciliation exists for the contract yet, so nothing needs recomputing"
        side_effects:
          - "stamps waived_by_user_id and waiver_reason; the block's allotted_room_nights will be outside the commitment base of whatever Reconciliation is opened later"
          - "increments RoomBlock.version by 1"
      - from: "billing_status: ATTRITION_ASSESSED"
        to: "billing_status: WAIVED"
        trigger: "POST /group-sales/room-blocks/{id}/waive-attrition"
        actor: RevenueManager
        preconditions:
          - "block.billing_status == ATTRITION_ASSESSED"
          - "the contract's newest Reconciliation has status == DRAFT"
        side_effects:
          - "stamps waived_by_user_id and waiver_reason"
          - "cascade: the DRAFT Reconciliation is recomputed — the waived block's allotted_room_nights leaves the attrition commitment base per calculations.attrition_liability, which re-derives attrition_shortfall_room_nights, attrition_damages_cents and every downstream step of calculations.settlement_waterfall"
          - "increments RoomBlock.version by 1"
      - from: "billing_status: ATTRITION_ASSESSED"
        to: "billing_status: SETTLED"
        trigger: "system cascade from POST /group-sales/reconciliations/{id}/finalize"
        actor: system
        preconditions:
          - "block.billing_status == ATTRITION_ASSESSED and the reconciliation reached FINALIZED"
        side_effects:
          - "inventory_status moves CUT_OFF -> CLOSED on the same row"
      - from: "billing_status: WAIVED"
        to: "billing_status: SETTLED"
        trigger: "system cascade from POST /group-sales/reconciliations/{id}/finalize"
        actor: system
        preconditions:
          - "block.billing_status == WAIVED and the reconciliation reached FINALIZED"
        side_effects:
          - "inventory_status moves CUT_OFF -> CLOSED, but the block contributes zero damages because its allotment already left the commitment base"

  - entity: Reservation
    initial_state: PENDING
    terminal_states: [CHECKED_OUT, CANCELLED, NO_SHOW]
    shape: "branching with compensation — the cancel branch reverses the pickup and re-derives comp designations"
    transitions:
      - from: PENDING
        to: CONFIRMED
        trigger: "POST /group-sales/reservations/{id}/advance with to_status == CONFIRMED"
        actor: ReservationsAgent
        preconditions:
          - "reservation.status == PENDING"
          - "block.inventory_status IN {OPEN, CUT_OFF}"
        side_effects:
          - "increments Reservation.version by 1; pickup counters are unchanged (PENDING already counted)"
      - from: CONFIRMED
        to: CHECKED_IN
        trigger: "POST /group-sales/reservations/{id}/advance with to_status == CHECKED_IN"
        actor: ReservationsAgent
        preconditions:
          - "reservation.status == CONFIRMED"
          - "clock_date >= reservation.arrival_date"
        side_effects:
          - "increments Reservation.version by 1"
      - from: CHECKED_IN
        to: CHECKED_OUT
        trigger: "POST /group-sales/reservations/{id}/advance with to_status == CHECKED_OUT"
        actor: ReservationsAgent
        preconditions:
          - "reservation.status == CHECKED_IN"
          - "clock_date >= reservation.departure_date"
        side_effects:
          - "increments Reservation.version by 1"
      - from: PENDING
        to: CANCELLED
        trigger: "POST /group-sales/reservations/{id}/cancel"
        actor: "ReservationsAgent | GroupContact"
        preconditions:
          - "reservation.status IN {PENDING, CONFIRMED}"
          - "block.inventory_status IN {OPEN, CUT_OFF}"
        side_effects:
          - "compensation: BlockNight.rooms_picked_up decrements by 1 on every date in [arrival_date, departure_date) and rooms_open increases by 1 on each of those dates when the block is still OPEN"
          - "cascade: the contract's comp designations are re-derived per calculations.comp_room_entitlement, so a surviving reservation may gain or lose is_comp and its rate_cents flips accordingly"
          - "the block's picked_up_room_nights, peak_night_rooms and comp_room_nights are recomputed"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /group-sales/reservations/{id}/cancel"
        actor: "ReservationsAgent | GroupContact"
        preconditions:
          - "reservation.status IN {PENDING, CONFIRMED}"
        side_effects:
          - "identical compensation and comp re-derivation as the PENDING -> CANCELLED transition"
      - from: CONFIRMED
        to: NO_SHOW
        trigger: "POST /group-sales/reservations/{id}/advance with to_status == NO_SHOW"
        actor: ReservationsAgent
        preconditions:
          - "reservation.status == CONFIRMED"
          - "clock_date >= reservation.arrival_date"
        side_effects:
          - "BlockNight.rooms_picked_up decrements by 1 on every occupied date (a no-show leaves the pickup set) but the room nights stay inside the actualized set used by calculations.attrition_liability"
          - "comp designations are re-derived per calculations.comp_room_entitlement"

  - entity: AncillaryCharge
    initial_state: QUOTED
    terminal_states: [VOIDED]
    shape: "linear with compensation"
    transitions:
      - from: QUOTED
        to: POSTED
        trigger: "POST /group-sales/ancillary-charges/{id}/post"
        actor: AccountingClerk
        preconditions:
          - "charge.status == QUOTED"
          - "contract.status == SIGNED"
        side_effects:
          - "contract.ancillary_posted_cents increases by net_amount_cents and receivable_total_cents is recomputed"
          - "increments AncillaryCharge.version by 1"
      - from: POSTED
        to: VOIDED
        trigger: "system cascade from POST /group-sales/contracts/{id}/cancel with cancellation_reason == FORCE_MAJEURE"
        actor: system
        preconditions:
          - "charge.status IN {QUOTED, POSTED} and the contract reached TERMINATED_FORCE_MAJEURE"
        side_effects:
          - "contract.ancillary_posted_cents decreases by net_amount_cents (returning to 0 when every charge is voided) and receivable_total_cents is recomputed"
      - from: QUOTED
        to: VOIDED
        trigger: "system cascade from POST /group-sales/contracts/{id}/cancel with cancellation_reason == FORCE_MAJEURE"
        actor: system
        preconditions:
          - "charge.status IN {QUOTED, POSTED} and the contract reached TERMINATED_FORCE_MAJEURE"
        side_effects:
          - "no ledger movement (a QUOTED charge was never posted)"
      - from: QUOTED
        to: VOIDED
        trigger: "POST /group-sales/ancillary-charges/{id}/void"
        actor: AccountingClerk
        preconditions:
          - "charge.status == QUOTED"
        side_effects:
          - "no ledger movement; the charge simply leaves the settlement input set"
          - "increments AncillaryCharge.version by 1"
      - from: POSTED
        to: VOIDED
        trigger: "POST /group-sales/ancillary-charges/{id}/void"
        actor: AccountingClerk
        preconditions:
          - "charge.status == POSTED"
          - "the contract has no FINALIZED Reconciliation (a settled receivable cannot be unwound)"
        side_effects:
          - "compensation: contract.ancillary_posted_cents decreases by net_amount_cents and receivable_total_cents is recomputed per calculations.receivable_conservation"
          - "increments AncillaryCharge.version by 1"

  - entity: Reconciliation
    initial_state: DRAFT
    terminal_states: [FINALIZED, SUPERSEDED]
    shape: "linear with supersede"
    transitions:
      - from: DRAFT
        to: FINALIZED
        trigger: "POST /group-sales/reconciliations/{id}/finalize"
        actor: AccountingClerk
        preconditions:
          - "reconciliation.status == DRAFT"
          - "contract.status == SIGNED"
          - "X-User-ID != reconciliation.prepared_by_user_id"
        side_effects:
          - "the three-hop finalize cascade declared on the GroupContract machine fires"
      - from: DRAFT
        to: SUPERSEDED
        trigger: "POST /group-sales/contracts/{id}/reconciliations (a newer draft supersedes the open one)"
        actor: AccountingClerk
        preconditions:
          - "reconciliation.status == DRAFT and a new reconciliation is created for the same contract"
          - "payload.expected_contract_version == contract.version"
        side_effects:
          - "the older row becomes SUPERSEDED and stops being the contract's newest reconciliation"

  - entity: FunctionSpaceHold
    initial_state: HELD
    terminal_states: [RELEASED]
    shape: "branching"
    transitions:
      - from: HELD
        to: CONFIRMED
        trigger: "system cascade from POST /group-sales/contracts/{id}/sign"
        actor: system
        preconditions:
          - "hold.status == HELD and the hold's lead is the contract's lead"
        side_effects:
          - "the buffered occupation stays in force for overlap checks"
      - from: HELD
        to: RELEASED
        trigger: "POST /group-sales/function-space-holds/{id}/release (also reached as a system cascade from the qualify TURNED_DOWN and decide REJECT paths)"
        actor: SalesManager
        preconditions:
          - "hold.status IN {HELD, CONFIRMED}"
        side_effects:
          - "the space stops occupying its buffered interval, so a later hold may take the slot"
      - from: CONFIRMED
        to: RELEASED
        trigger: "POST /group-sales/function-space-holds/{id}/release"
        actor: SalesManager
        preconditions:
          - "hold.status IN {HELD, CONFIRMED}"
        side_effects:
          - "same as the HELD -> RELEASED transition"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on the parent's `version` only)
# =============================================================================
concurrency_rules:
  - rule_id: quote-create-stale-lead
    parent_entity: Lead
    write_endpoint: "POST /group-sales/rate-quotes"
    occ_field: "expected_lead_version"
    description: |
      Creating a RateQuote against a Lead whose version has advanced since the
      client last observed it is rejected with a stale-version error. A newly
      created quote legitimately supersedes any DRAFT quote already on the lead,
      so a writer working from a stale view of the lead would silently discard a
      sibling quote it never saw.
    error_id: ERR_STALE_LEAD_VERSION
    http_status: 412

  - rule_id: analysis-decide-stale-lead
    parent_entity: Lead
    write_endpoint: "POST /group-sales/displacement-analyses/{id}/decide"
    occ_field: "expected_lead_version"
    description: |
      Deciding a PENDING DisplacementAnalysis while holding a lead version older
      than the lead's current version is rejected. Requesting an additional
      analysis under the other analysis_variant advances the lead's version, and
      clearing the lead from a stale view would approve a displacement picture the
      decider never inspected.
    error_id: ERR_STALE_LEAD_VERSION
    http_status: 412

  - rule_id: sub-block-create-stale-parent
    parent_entity: RoomBlock
    write_endpoint: "POST /group-sales/room-blocks"
    occ_field: "expected_parent_block_version"
    description: |
      Creating a sub-block against a parent RoomBlock whose version has advanced
      is rejected. Every sub-block carves rooms out of the parent's per-night
      allotment and bumps the parent's version, so a writer holding a stale parent
      version is reasoning about unallocated rooms that are already taken.
    error_id: ERR_STALE_BLOCK_VERSION
    http_status: 412

  - rule_id: reconciliation-create-stale-contract
    parent_entity: GroupContract
    write_endpoint: "POST /group-sales/contracts/{id}/reconciliations"
    occ_field: "expected_contract_version"
    description: |
      Creating a Reconciliation against a GroupContract whose version has advanced
      is rejected. A new draft legitimately supersedes an open DRAFT reconciliation,
      and an attrition waiver or a newly posted ancillary charge bumps the contract
      version, so a stale writer would settle on numbers that no longer hold.
    error_id: ERR_STALE_CONTRACT_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: lead_qualification_score
    trigger: "POST /group-sales/leads/{id}/qualify (writes Lead.qualification_score on both the QUALIFIED and TURNED_DOWN branches)"
    algorithm: weighted_scoring
    formula: |
      # combinatorial mode (a): five inputs, two nested min() caps, one tiered
      # bucket on a derived ratio, one tiered bucket on the logical clock, and a
      # multiplicative segment factor applied AFTER the additive raw score.
      room_night_points = min(40, floor(lead.total_requested_room_nights / 10))
      peak_points       = min(25, floor(lead.peak_rooms / 4))

      space_ratio = lead.meeting_space_sqft_needed / max(1, lead.peak_rooms)   # exact rational, not rounded
      space_points = 15 if space_ratio <= 30.0
                     else (8 if space_ratio <= 60.0 else 0)

      lead_time_days = whole_days(lead.arrival_date - date_of(clock_now))
      lead_time_points = 20 if lead_time_days >= 180
                         else (12 if lead_time_days >= 90 else 5)

      raw = room_night_points + peak_points + space_points + lead_time_points
      qualification_score = min(100, round_half_up(raw * SEGMENT_MULTIPLIER[account.market_segment]))

      # threshold branch (>= is inclusive):
      #   qualification_score >= QUALIFICATION_FLOOR -> Lead.status = QUALIFIED
      #   qualification_score <  QUALIFICATION_FLOOR -> Lead.status = TURNED_DOWN
    input_set: "the Lead row itself plus its GroupAccount.market_segment; requires an InventoryDay row for every date in [arrival_date, departure_date) (ERR_INVENTORY_DAY_MISSING otherwise) even though the score does not read inventory"
    constants:
      QUALIFICATION_FLOOR: 30
      SEGMENT_MULTIPLIER: { CORPORATE: 1.20, ASSOCIATION: 1.00, GOVERNMENT: 0.85, SMERF: 0.75 }
    precision: "integer score, round_half_up applied once to raw * multiplier, then clamped to 100"

  - name: lead_room_night_value
    trigger: "POST /group-sales/leads/{id}/qualify (writes Lead.estimated_room_night_value_cents)"
    algorithm: aggregation
    formula: |
      # Two-stage rounding, order pinned: the ADR average is rounded to whole
      # cents FIRST, the group-rate factor is applied to that rounded average and
      # rounded again, and only then is the product with room nights taken.
      dates = [lead.arrival_date .. lead.departure_date)            # half-open, ascending
      avg_transient_adr_cents = round_half_up(sum(InventoryDay(d).transient_adr_cents for d in dates) / count(dates))
      group_rate_cents = round_half_up(avg_transient_adr_cents * GROUP_RATE_FACTOR)
      estimated_room_night_value_cents = group_rate_cents * lead.total_requested_room_nights
    input_set: "exactly the InventoryDay rows whose stay_date lies in the half-open range [arrival_date, departure_date); the departure date is excluded"
    constants:
      GROUP_RATE_FACTOR: 0.82
    precision: "whole cents, round_half_up at each of the two rounding points, no rounding on the final multiplication"

  - name: displacement_cost
    trigger: "POST /group-sales/displacement-analyses (writes displaced_room_nights, displaced_revenue_cents, group_revenue_cents, ancillary_projection_cents, net_benefit_cents, verdict)"
    algorithm: forward_looking
    formula: |
      dates = [lead.arrival_date .. lead.departure_date)            # half-open, ascending
      displaced_room_nights = 0
      displaced_revenue_cents = 0
      for d in dates:
          day = InventoryDay(stay_date == d)                        # ERR_INVENTORY_DAY_MISSING when absent
          available_transient = day.total_rooms - day.committed_group_rooms - day.held_group_rooms
          demand_d, adr_d = SERIES(analysis_variant, day)
          displaced_d = max(0, demand_d + lead.peak_rooms - available_transient)
          displaced_room_nights   += displaced_d
          displaced_revenue_cents += displaced_d * adr_d
      group_revenue_cents = lead.estimated_room_night_value_cents          # snapshot, never recomputed here
      ancillary_projection_cents = round_half_up(lead.peak_rooms * lead.nights_count * ANCILLARY_PER_ROOM_NIGHT_CENTS)
      net_benefit_cents = group_revenue_cents + ancillary_projection_cents - displaced_revenue_cents
      verdict = ACCEPT if net_benefit_cents >= 0 else OVERRIDE_REQUIRED
    input_set: "InventoryDay rows on the half-open date range; committed_group_rooms and held_group_rooms are read at analysis-creation time, so an analysis run before and after a competing hold yields different numbers"
    constants:
      ANCILLARY_PER_ROOM_NIGHT_CENTS: 4500
    precision: "whole cents; the per-date products are exact integers so no intermediate rounding exists"
    variants:
      - name: FORECAST_BASED
        when: "analysis_variant == FORECAST_BASED"
        difference: "SERIES(d) = (day.transient_demand_rooms, day.transient_adr_cents) — the revenue-management forecast series"
      - name: HISTORICAL_BASED
        when: "analysis_variant == HISTORICAL_BASED"
        difference: "SERIES(d) = (day.historical_pickup_rooms, day.historical_adr_cents) — the same-date-last-year realized series. Identical lead and identical inventory rows produce a different displaced_room_nights, a different displaced_revenue_cents and can flip verdict between ACCEPT and OVERRIDE_REQUIRED."

  - name: effective_net_rate
    trigger: "POST /group-sales/rate-quotes and POST /group-sales/rate-quotes/{id}/revise (writes RateQuote.effective_net_rate_cents and total_quote_value_cents)"
    algorithm: tiered_pricing
    formula: |
      # combinatorial mode (b): nested rounding whose ORDER changes the cents.
      # PINNED ORDER = ROUND_EACH_COMPONENT_THEN_SUBTRACT.
      discount_component_cents   = round_half_up(base_rate_cents * package.room_rate_discount_pct)
      comp_amortization_cents    = round_half_up(base_rate_cents / (quote.comp_room_ratio + 1))
      rebate_component_cents     = quote.rebate_per_room_night_cents          # already whole cents
      effective_net_rate_cents = base_rate_cents
                                 - discount_component_cents
                                 - comp_amortization_cents
                                 - rebate_component_cents
      total_quote_value_cents  = effective_net_rate_cents * quote.quoted_room_nights
      # FORBIDDEN alternative (documented so the divergence is testable): computing
      # base_rate_cents - base*pct - base/(ratio+1) - rebate in exact arithmetic and
      # rounding once at the end differs by one cent whenever the two component
      # fractions each round down but their sum rounds up — e.g. base 23950,
      # pct 0.0725, ratio 40 gives 20880 under the pinned order and 20879 under the
      # single-rounding alternative.
    input_set: "the quote's own base_rate_cents plus the comp_room_ratio and rebate_per_room_night_cents PINNED onto the quote at creation — later edits to the ConcessionPackage never move an existing quote"
    constants: {}
    precision: "whole cents; round_half_up applied independently to each component BEFORE subtraction; no rounding on the final multiplication"

  - name: ancillary_net
    trigger: "POST /group-sales/ancillary-charges (writes AncillaryCharge.discount_pct and net_amount_cents)"
    algorithm: aggregation
    formula: |
      discount_pct = { BANQUET:     package.banquet_discount_pct,
                       AUDIOVISUAL: package.av_discount_pct,
                       PARKING:     package.parking_discount_pct,
                       INTERNET:    0.0 }[charge.category]
      net_amount_cents = round_half_up(gross_amount_cents * (1 - discount_pct))
    input_set: "the ConcessionPackage reached as contract.quote_id -> RateQuote.concession_package_id, read at charge-creation time"
    constants:
      INTERNET_DISCOUNT_PCT: 0.0
    precision: "whole cents, round_half_up once"

  - name: block_pickup
    trigger: "POST /group-sales/reservations, POST /group-sales/reservations/{id}/cancel, POST /group-sales/room-blocks/{id}/cutoff, and GET /group-sales/room-blocks/{id}/pickup-summary"
    algorithm: aggregation
    formula: |
      # PICKUP set (pre-event monitoring) — deliberately different from the
      # ACTUALIZED set used by attrition_liability.
      PICKUP_STATUSES = {PENDING, CONFIRMED, CHECKED_IN, CHECKED_OUT}
      BlockNight(b, d).rooms_picked_up =
          count(Reservation r : r.block_id == b
                                AND r.status IN PICKUP_STATUSES
                                AND r.arrival_date <= d < r.departure_date)
      RoomBlock(b).picked_up_room_nights =
          sum(BlockNight(b, d).rooms_picked_up for all d of b)
          + (sum over sub-blocks s of RoomBlock(s).picked_up_room_nights if b.is_master else 0)
      RoomBlock(b).peak_night_rooms = max over b's own BlockNight rows of rooms_picked_up   # 0 when the block has no nights
      BlockNight(b, d).rooms_open =
          rooms_allotted - rooms_sub_allocated - rooms_picked_up - rooms_released
    input_set: "reservations of the block only; CANCELLED and NO_SHOW rows leave the pickup set. A sub-block's pickup bubbles up into its master's picked_up_room_nights but NOT into the master's BlockNight.rooms_picked_up"
    constants: {}
    precision: "integers only"

  - name: comp_room_entitlement
    trigger: "POST /group-sales/reservations (designates the new row) and POST /group-sales/reservations/{id}/cancel (re-derives every row of the contract)"
    algorithm: threshold
    formula: |
      # Ordering is pinned by created_at ASC over ALL reservations of the contract
      # (every block in the contract's block tree). `id` is never consulted.
      ratio = contract.quote_id -> RateQuote.comp_room_ratio
      comp_count = 0
      paid_room_nights = 0
      for r in reservations(contract) where r.status != CANCELLED order by created_at ASC:
          if floor(paid_room_nights / ratio) > comp_count:
              r.is_comp   = true
              r.rate_cents = 0
              comp_count += 1
          else:
              r.is_comp   = false
              r.rate_cents = contract.contracted_rate_cents
              paid_room_nights += r.room_nights
      # INVARIANT (compensating action target): after any create or cancel,
      #   count(r : r.is_comp) == floor(paid_room_nights / ratio)
    input_set: "reservations of the whole contract block tree with status != CANCELLED, ordered by created_at ASC; ties on created_at cannot occur because the logical clock advances only through POST /_clock/set_current_utc and rows created at the same instant retain insertion order"
    constants: {}
    precision: "integers only"

  - name: attrition_liability
    trigger: "POST /group-sales/contracts/{id}/reconciliations, POST /group-sales/room-blocks/{id}/waive-attrition (recompute), and GET /group-sales/room-blocks/{id}/pickup-summary (projection)"
    algorithm: threshold
    formula: |
      ACTUALIZED_STATUSES = {CONFIRMED, CHECKED_IN, CHECKED_OUT, NO_SHOW}
      actualized_room_nights = sum(r.room_nights for r in reservations(contract)
                                   where r.status IN ACTUALIZED_STATUSES)
      billable_room_nights   = sum(r.room_nights for r in reservations(contract)
                                   where r.status IN ACTUALIZED_STATUSES AND r.is_comp == false)

      waived_room_nights = sum(b.allotted_room_nights for b in blocks(contract)
                               where b.billing_status == WAIVED)
      commitment_base_room_nights = contract.contracted_room_nights - waived_room_nights
      # threshold test is inclusive: actualized == commitment produces zero damages
      damages(shortfall_rn) = round_half_up(shortfall_rn * contract.contracted_rate_cents * ATTRITION_DAMAGE_FACTOR)
    input_set: "every Reservation in the contract's block tree (master and sub-blocks) with status IN {CONFIRMED, CHECKED_IN, CHECKED_OUT, NO_SHOW}; PENDING rows never actualize and CANCELLED rows are excluded"
    constants:
      ATTRITION_DAMAGE_FACTOR: 0.85
    precision: "whole cents, round_half_up applied once to the damages product; ceil() on the commitment"
    variants:
      - name: ROOM_NIGHTS
        when: "contract.attrition_basis == ROOM_NIGHTS"
        difference: |
          commitment = ceil(commitment_base_room_nights * contract.attrition_threshold_pct)
          attrition_shortfall_room_nights = max(0, commitment - actualized_room_nights)
          attrition_damages_cents = damages(attrition_shortfall_room_nights)
      - name: PEAK_NIGHT
        when: "contract.attrition_basis == PEAK_NIGHT"
        difference: |
          peak_commitment_rooms = ceil(contract.contracted_peak_rooms * contract.attrition_threshold_pct)
          peak_actual_rooms = max over stay dates d of
              count(r in reservations(contract) : r.status IN ACTUALIZED_STATUSES
                    AND r.arrival_date <= d < r.departure_date)
          shortfall_rooms = max(0, peak_commitment_rooms - peak_actual_rooms)
          attrition_shortfall_room_nights = shortfall_rooms * contract.nights_count
          attrition_damages_cents = damages(attrition_shortfall_room_nights)
          # Identical reservations produce a different shortfall than the
          # ROOM_NIGHTS variant whenever the pickup pattern is uneven across dates.

  - name: settlement_waterfall
    trigger: "POST /group-sales/contracts/{id}/reconciliations, and re-run on POST /group-sales/room-blocks/{id}/waive-attrition while the reconciliation is DRAFT"
    algorithm: waterfall_allocation
    formula: |
      # combinatorial mode (c): the incentive RATE is keyed on a value that is
      # itself an input to the total, which looks circular. The evaluation order
      # below is normative and resolves it — the rate is keyed on step 3's
      # net_before_incentive_cents, NEVER on total_settlement_cents.
      # 1
      gross_settlement_cents = attrition_damages_cents + ancillary_net_cents
      # 2
      rebate_cap_cents     = round_half_up(gross_settlement_cents * REBATE_CAP_PCT)
      rebate_earned_cents  = quote.rebate_per_room_night_cents * billable_room_nights
      rebate_payable_cents = min(rebate_earned_cents, rebate_cap_cents)
      # 3
      net_before_incentive_cents = gross_settlement_cents - rebate_payable_cents
      # 4
      size_bonus_pct = SIZE_BONUS_PCT if net_before_incentive_cents >= SIZE_BONUS_FLOOR_CENTS else 0.0
      incentive_rate = min(INCENTIVE_RATE_CAP, reconciliation.incentive_rate_snapshot + size_bonus_pct)
      # 5
      rebooking_incentive_cents = round_half_up(net_before_incentive_cents * incentive_rate)
      # 6
      total_settlement_cents = net_before_incentive_cents - rebooking_incentive_cents
    input_set: "attrition_damages_cents from calculations.attrition_liability; ancillary_net_cents over AncillaryCharge rows of the contract with status == POSTED only (QUOTED and VOIDED excluded); incentive_rate_snapshot frozen from GroupAccount.rebooking_incentive_pct at reconciliation creation"
    constants:
      REBATE_CAP_PCT: 0.25
      SIZE_BONUS_PCT: 0.02
      SIZE_BONUS_FLOOR_CENTS: 2000000
      INCENTIVE_RATE_CAP: 0.05
    precision: "whole cents; round_half_up at the rebate cap and at the incentive product; no other rounding"

  - name: cancellation_damages
    trigger: "POST /group-sales/contracts/{id}/cancel (writes GroupContract.assessed_damages_cents)"
    algorithm: tiered_pricing
    formula: |
      days_before_arrival = whole_days(contract.arrival_date - date_of(clock_now))
      tier_pct = 0.25 if days_before_arrival >= 180
                 else (0.50 if days_before_arrival >= 90
                 else (0.75 if days_before_arrival >= 30 else 1.00))
      picked_up_room_nights = master_block.picked_up_room_nights   # 0 when no block exists yet
      mitigated_base_cents = max(0, (contract.contracted_room_nights - picked_up_room_nights)
                                     * contract.contracted_rate_cents)
      if cancellation_reason == FORCE_MAJEURE and contract.force_majeure_clause IN {STANDARD, EXPANDED}:
          assessed_damages_cents = 0
      elif cancellation_reason == FORCE_MAJEURE:                  # force_majeure_clause == NONE
          assessed_damages_cents = round_half_up(mitigated_base_cents * tier_pct * FM_NO_CLAUSE_FACTOR)
      else:                                                       # CLIENT_CANCEL
          assessed_damages_cents = round_half_up(mitigated_base_cents * tier_pct)
    input_set: "the contract's own contracted_room_nights / contracted_rate_cents, the master RoomBlock's picked_up_room_nights per calculations.block_pickup, and the logical clock"
    constants:
      FM_NO_CLAUSE_FACTOR: 0.50
    precision: "whole cents, round_half_up once; the tier boundaries are inclusive at 180 / 90 / 30 days"

  - name: sub_block_allocation
    trigger: "POST /group-sales/room-blocks (sub-block creation)"
    algorithm: waterfall_allocation
    formula: |
      for entry in payload.nightly_allotments (processed in ascending stay_date order):
          parent_night = BlockNight(parent_block_id, entry.stay_date)
          if parent_night is absent: reject ERR_SUB_BLOCK_DATES_OUTSIDE_PARENT
          unallocated = parent_night.rooms_allotted
                        - parent_night.rooms_sub_allocated
                        - parent_night.rooms_picked_up
                        - parent_night.rooms_released
          if entry.rooms > unallocated: reject ERR_SUB_BLOCK_ALLOTMENT_EXCEEDED
      # on success, for each entry:
      #   parent_night.rooms_sub_allocated += entry.rooms  (parent_night.rooms_open shrinks by the same amount)
      #   a BlockNight is created on the sub-block with rooms_allotted = entry.rooms
      # INVARIANT (conserved quantity, per master night):
      #   rooms_allotted == rooms_sub_allocated + rooms_picked_up + rooms_released + rooms_open
    input_set: "the parent block's BlockNight rows; sub-blocks with inventory_status == RELEASED no longer contribute to rooms_sub_allocated"
    constants: {}
    precision: "integers only; the whole allotment plan is validated in ascending stay_date order and applied atomically — a single failing entry rejects the entire sub-block"

  - name: account_rebooking_tier
    trigger: "read of GroupAccount (GET /group-sales/accounts/{id}) and the finalize cascade of POST /group-sales/reconciliations/{id}/finalize"
    algorithm: decay_function
    formula: |
      base_pct = 0.05 if (repeat_group_count >= 3 or lifetime_actualized_room_nights >= 1500)
                 else (0.03 if (repeat_group_count >= 1 or lifetime_actualized_room_nights >= 400)
                 else 0.01)
      lapsed = last_completed_departure_date is not null
               and whole_days(date_of(clock_now) - last_completed_departure_date) > LAPSE_DAYS
      rebooking_incentive_pct = DECAY_ONE_TIER(base_pct) if lapsed else base_pct
      # DECAY_ONE_TIER: 0.05 -> 0.03, 0.03 -> 0.01, 0.01 -> 0.01
    input_set: "GroupContract rows of the account with status == COMPLETED and their FINALIZED Reconciliation rows; evaluated against the logical clock on every read"
    constants:
      LAPSE_DAYS: 730
    precision: "one of 0.01 / 0.03 / 0.05 exactly; no rounding"

  - name: receivable_conservation
    trigger: "POST /group-sales/ancillary-charges/{id}/post, POST /group-sales/contracts/{id}/cancel, POST /group-sales/reconciliations/{id}/finalize"
    algorithm: aggregation
    formula: |
      contract.ancillary_posted_cents = sum(c.net_amount_cents for c in AncillaryCharge
                                            where c.contract_id == contract.id and c.status == POSTED)
      contract.receivable_total_cents = contract.ancillary_posted_cents
                                        + contract.assessed_damages_cents
                                        - contract.rebate_paid_cents
      # INVARIANT (compensating action target): posting charges and then
      # terminating the contract under FORCE_MAJEURE with a STANDARD/EXPANDED
      # clause voids every charge and zeroes the damages, so
      # receivable_total_cents returns to exactly its pre-charge value (0) with
      # no drift.
    input_set: "AncillaryCharge rows of the contract with status == POSTED; VOIDED and QUOTED rows are excluded"
    constants: {}
    precision: "whole cents, exact integer arithmetic"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority — lower number wins when a
#      single request violates several rules)
# =============================================================================
validations:

  - priority: 1
    category: auth
    check: "X-User-ID header present and non-blank; X-User-Role header present and one of the seven declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
    description: "Runs before anything else, including request-schema parsing — a malformed body with no headers still returns ERR_UNAUTHENTICATED."

  - priority: 2
    category: auth
    check: "X-User-Role is listed in the endpoint's roles"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
    description: "Role gate only. Ownership (priority 5) and segregation of duties (priority 9) are separate, later checks."

  - priority: 3
    category: business_constraint
    check: "request body parses; every field named in the endpoint's input is present unless marked optional; types match §1.1; enum values are members of the declared set; integer money/room fields are integers (JSON numbers, never strings); date fields are YYYY-MM-DD and datetime fields are ISO-8601 UTC instants"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all write endpoints and every list endpoint's query parameters (limit outside 1..100 or a negative offset is also ERR_INVALID_REQUEST)"
    description: "Schema shape only — no cross-row lookups. Fields whose source is computed or system are ignored when supplied, never rejected."

  - priority: 4
    category: existence
    check: "every {id} in the path resolves, validated left to right"
    error_id: "ERR_ACCOUNT_NOT_FOUND | ERR_LEAD_NOT_FOUND | ERR_ANALYSIS_NOT_FOUND | ERR_QUOTE_NOT_FOUND | ERR_CONTRACT_NOT_FOUND | ERR_BLOCK_NOT_FOUND | ERR_RESERVATION_NOT_FOUND | ERR_CHARGE_NOT_FOUND | ERR_RECONCILIATION_NOT_FOUND | ERR_HOLD_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with a path parameter"
    description: "The error names the entity of the leftmost unresolved segment."

  - priority: 5
    category: auth
    check: "when X-User-Role is GroupContact, the X-User-ID must equal the GroupAccount id that owns the targeted row (resolved through lead.account_id, quote.lead_id -> lead.account_id, contract.quote_id -> quote.lead_id -> lead.account_id, or block.contract_id -> ... for reservations)"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "POST /group-sales/rate-quotes/{id}/counter, POST /group-sales/rate-quotes/{id}/accept, POST /group-sales/reservations, POST /group-sales/reservations/{id}/cancel, GET endpoints reached with role GroupContact"
    description: "Runs after path existence so a GroupContact probing another account's id gets 404 for a non-existent row and 403 for a real row it does not own."

  - priority: 6
    category: existence
    check: "every FK supplied in the request body resolves (account_id, lead_id, concession_package_id, quote_id, parent_block_id, contract_id, block_id)"
    error_id: "ERR_ACCOUNT_NOT_FOUND | ERR_LEAD_NOT_FOUND | ERR_PACKAGE_NOT_FOUND | ERR_QUOTE_NOT_FOUND | ERR_BLOCK_NOT_FOUND | ERR_CONTRACT_NOT_FOUND"
    http_status: 404
    applies_to: "POST /group-sales/leads, POST /group-sales/displacement-analyses, POST /group-sales/rate-quotes, POST /group-sales/contracts, POST /group-sales/room-blocks, POST /group-sales/reservations, POST /group-sales/ancillary-charges, POST /group-sales/function-space-holds"
    description: "Body FKs are checked in the field order listed by the endpoint's input."

  - priority: 7
    category: business_temporal
    check: "departure_date > arrival_date (leads, reservations); end_at > start_at (function-space holds); expires_at > current logical clock (quotes); every nightly_allotments entry has a distinct stay_date and the set is contiguous"
    error_id: ERR_INVALID_DATE_RANGE
    http_status: 422
    applies_to: "POST /group-sales/leads, POST /group-sales/reservations, POST /group-sales/function-space-holds, POST /group-sales/rate-quotes, POST /group-sales/rate-quotes/{id}/revise, POST /group-sales/contracts"
    description: "Pure intra-request date sanity; no other row is consulted."

  - priority: 8
    category: state
    check: "the expected_*_version in the body equals the current version of the named parent row (see §1.2.1 concurrency_rules)"
    error_id: "ERR_STALE_LEAD_VERSION | ERR_STALE_BLOCK_VERSION | ERR_STALE_CONTRACT_VERSION"
    http_status: 412
    applies_to: "POST /group-sales/rate-quotes, POST /group-sales/displacement-analyses/{id}/decide, POST /group-sales/room-blocks, POST /group-sales/contracts/{id}/reconciliations"
    description: "Precedes every state and business check, so a client holding a stale version learns that first even when the operation would also have been rejected on state grounds."

  - priority: 9
    category: auth
    check: "the acting X-User-ID differs from the user recorded on the row for the preceding step: analysis.requested_by_user_id on decide, reconciliation.prepared_by_user_id on finalize, quote.prepared_by_user_id on accept"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /group-sales/displacement-analyses/{id}/decide, POST /group-sales/reconciliations/{id}/finalize, POST /group-sales/rate-quotes/{id}/accept"
    description: "role_model: segregation_of_duties. The role gate at priority 2 already passed — this rejects the right role held by the wrong person."

  - priority: 10
    category: state
    check: "the target row is in a state from which this trigger has a declared transition in §1.2"
    error_id: "ERR_LEAD_INVALID_STATE | ERR_QUOTE_INVALID_STATE | ERR_CONTRACT_INVALID_STATE | ERR_BLOCK_INVALID_STATE | ERR_RESERVATION_INVALID_STATE | ERR_HOLD_INVALID_STATE | ERR_CHARGE_INVALID_STATE"
    http_status: 409
    applies_to: "every action endpoint"
    description: "Includes terminal-state lockdown: any trigger against a terminal state fails here."

  - priority: 11
    category: state
    check: "repeat of an already-consumed one-shot step: DisplacementAnalysis.status != PENDING on decide; Reconciliation.status != DRAFT on finalize; RoomBlock.billing_status IN {WAIVED, SETTLED} on waive-attrition"
    error_id: "ERR_ANALYSIS_ALREADY_DECIDED | ERR_RECONCILIATION_ALREADY_FINALIZED | ERR_BLOCK_ALREADY_BILLED"
    http_status: 409
    applies_to: "POST /group-sales/displacement-analyses/{id}/decide, POST /group-sales/reconciliations/{id}/finalize, POST /group-sales/room-blocks/{id}/waive-attrition"
    description: "Idempotency guard, expressed with row-specific errors so the second call is distinguishable from an ordinary wrong-state rejection."

  - priority: 12
    category: state
    check: "the block a reservation is being written into has inventory_status == OPEN (SETUP, CUT_OFF, RELEASED and CLOSED all reject)"
    error_id: ERR_BLOCK_NOT_OPEN
    http_status: 409
    applies_to: "POST /group-sales/reservations"
    description: "Cross-entity state gate on the reservation's parent block. Deliberately ordered ABOVE the fiscal allotment check (priority 26) — a request that both targets a SETUP block and asks for more rooms than remain returns ERR_BLOCK_NOT_OPEN."

  - priority: 13
    category: business_temporal
    check: "the RateQuote's expires_at is strictly after the current logical clock"
    error_id: ERR_QUOTE_EXPIRED
    http_status: 422
    applies_to: "POST /group-sales/rate-quotes/{id}/accept, POST /group-sales/contracts"
    description: "Ordered ABOVE the approved-displacement referential check (priority 18) — a quote that is both expired and lacks an APPROVED analysis returns ERR_QUOTE_EXPIRED."

  - priority: 14
    category: business_temporal
    check: "current logical clock date is strictly before block.cutoff_date"
    error_id: ERR_PAST_CUTOFF_DATE
    http_status: 422
    applies_to: "POST /group-sales/reservations"
    description: "Rooming-list additions stop at the cutoff date even when the block has not yet been mechanically cut off."

  - priority: 15
    category: business_temporal
    check: "current logical clock date is on or after block.cutoff_date"
    error_id: ERR_CUTOFF_DATE_NOT_REACHED
    http_status: 422
    applies_to: "POST /group-sales/room-blocks/{id}/cutoff"
    description: "The mirror of priority 14; together they make the cutoff date a hard partition of the block's timeline."

  - priority: 16
    category: business_temporal
    check: "current logical clock date is strictly before reservation.arrival_date"
    error_id: ERR_CANCEL_AFTER_ARRIVAL
    http_status: 422
    applies_to: "POST /group-sales/reservations/{id}/cancel"
    description: "After arrival a guest can only be advanced (CHECKED_IN) or marked NO_SHOW; the cancellation channel is closed."

  - priority: 17
    category: business_temporal
    check: "current logical clock date is on or after contract.departure_date"
    error_id: ERR_EVENT_NOT_CONCLUDED
    http_status: 422
    applies_to: "POST /group-sales/contracts/{id}/reconciliations"
    description: "Post-event reconciliation cannot open while the group is still in house."

  - priority: 18
    category: business_referential
    check: "the quote's lead has at least one DisplacementAnalysis with status == APPROVED, and no PENDING analysis remains"
    error_id: ERR_DISPLACEMENT_NOT_APPROVED
    http_status: 409
    applies_to: "POST /group-sales/rate-quotes/{id}/accept, POST /group-sales/contracts"
    description: "Cross-entity referential gate reached through quote.lead_id."

  - priority: 19
    category: business_referential
    check: "an InventoryDay row exists for every date in the half-open range the operation reads"
    error_id: ERR_INVENTORY_DAY_MISSING
    http_status: 422
    applies_to: "POST /group-sales/leads/{id}/qualify, POST /group-sales/displacement-analyses, POST /group-sales/rate-quotes/{id}/propose, POST /group-sales/contracts/{id}/sign"
    description: "The calendar must be seeded before any calculation that walks it; a gap is a data error, not a zero."

  - priority: 20
    category: business_referential
    check: "every nightly_allotments stay_date of a sub-block has a BlockNight on the parent block"
    error_id: ERR_SUB_BLOCK_DATES_OUTSIDE_PARENT
    http_status: 422
    applies_to: "POST /group-sales/room-blocks"
    description: "Checked in ascending stay_date order; the first offending date decides the error."

  - priority: 21
    category: business_referential
    check: "the reservation's stay range [arrival_date, departure_date) is covered by BlockNight rows of the target block"
    error_id: ERR_STAY_DATE_OUTSIDE_BLOCK
    http_status: 422
    applies_to: "POST /group-sales/reservations"
    description: "A guest may not shoulder a night the block does not hold, even when the contract's own date range covers it."

  - priority: 22
    category: business_referential
    check: "every RoomBlock of the contract has inventory_status IN {CUT_OFF, RELEASED, CLOSED}"
    error_id: ERR_BLOCKS_NOT_CUT_OFF
    http_status: 409
    applies_to: "POST /group-sales/contracts/{id}/reconciliations"
    description: "Attrition cannot be assessed while any sub-block can still take pickup."

  - priority: 23
    category: business_referential
    check: "sum(nightly_allotments[].rooms) == contracted_room_nights AND max(nightly_allotments[].rooms) == contracted_peak_rooms AND the allotment dates are exactly [quote.lead.arrival_date .. quote.lead.departure_date)"
    error_id: ERR_ALLOTMENT_PLAN_MISMATCH
    http_status: 422
    applies_to: "POST /group-sales/contracts"
    description: "Keeps the contract's headline numbers and its night-by-night plan from ever disagreeing, which is what makes the room-night conservation invariant checkable."

  - priority: 24
    category: business_safety
    check: "no other non-CANCELLED Reservation on the same contract has the same guest_name and arrival_date"
    error_id: ERR_DUPLICATE_ROOMING_LIST_ENTRY
    http_status: 409
    applies_to: "POST /group-sales/reservations"
    description: "Double-booking one guest inflates pickup and would corrupt attrition; treated as a data-integrity safety rule rather than a capacity rule."

  - priority: 25
    category: business_safety
    check: "no other HELD or CONFIRMED FunctionSpaceHold on the same space_code overlaps the requested interval once each existing interval is extended by TURNOVER_MINUTES at its end"
    error_id: ERR_FUNCTION_SPACE_CONFLICT
    http_status: 409
    applies_to: "POST /group-sales/function-space-holds"
    description: "Half-open comparison with a 45-minute turnover buffer: an interval starting exactly at an existing end_at collides, one starting exactly at end_at + 45 minutes does not. RELEASED holds are ignored."

  - priority: 26
    category: business_constraint
    check: "quote.quoted_peak_rooms >= package.min_peak_rooms AND quote.quoted_room_nights >= package.min_total_room_nights"
    error_id: ERR_CONCESSION_INELIGIBLE
    http_status: 422
    applies_to: "POST /group-sales/rate-quotes, POST /group-sales/rate-quotes/{id}/revise"
    description: "Both minimums are inclusive; the package's eligibility floors are re-checked on every revise because a revise may shrink the program."

  - priority: 27
    category: business_constraint
    check: "package.room_rate_discount_pct + package.banquet_discount_pct + package.av_discount_pct + package.parking_discount_pct <= package.max_discount_stack_pct"
    error_id: ERR_DISCOUNT_STACK_EXCEEDED
    http_status: 422
    applies_to: "POST /group-sales/concession-packages, POST /group-sales/rate-quotes"
    description: "Evaluated as the computed ConcessionPackage.discount_stack_pct; the comparison is inclusive at the cap."

  - priority: 28
    category: business_fiscal
    check: "for every date d in the lead's half-open stay range, InventoryDay(d).committed_group_rooms + InventoryDay(d).held_group_rooms + rooms_being_added <= InventoryDay(d).group_ceiling_rooms"
    error_id: ERR_GROUP_CEILING_EXCEEDED
    http_status: 409
    applies_to: "POST /group-sales/rate-quotes/{id}/propose, POST /group-sales/contracts/{id}/sign"
    description: "Aggregate capacity rule: each of two quotes can be individually admissible while their sum breaches the ceiling. Half-open, so a group departing on the date another arrives never collides."

  - priority: 29
    category: business_fiscal
    check: "for every stay date of the reservation, BlockNight(block, d).rooms_open >= 1"
    error_id: ERR_BLOCK_ALLOTMENT_EXCEEDED
    http_status: 409
    applies_to: "POST /group-sales/reservations"
    description: "Per-night allotment ceiling. Sits below the block-state gate at priority 12 on purpose."

  - priority: 30
    category: business_fiscal
    check: "for every requested nightly_allotments entry, entry.rooms <= parent BlockNight's rooms_allotted - rooms_sub_allocated - rooms_picked_up - rooms_released"
    error_id: ERR_SUB_BLOCK_ALLOTMENT_EXCEEDED
    http_status: 409
    applies_to: "POST /group-sales/room-blocks"
    description: "Sub-blocks may collectively carve up the master but never overdraw a single night of it."

  - priority: 31
    category: business_fiscal
    check: "analysis.net_benefit_cents >= 0, OR the decide call supplies a non-blank override_reason"
    error_id: ERR_DISPLACEMENT_NET_BENEFIT_NEGATIVE
    http_status: 422
    applies_to: "POST /group-sales/displacement-analyses/{id}/decide with decision == APPROVE"
    description: "Approving a value-destroying piece of business requires an explicit written override; a REJECT decision never needs one."

  - priority: 32
    category: business_fiscal
    check: "the contract's GroupAccount has credit_hold == false"
    error_id: ERR_ACCOUNT_CREDIT_HOLD
    http_status: 402
    applies_to: "POST /group-sales/contracts/{id}/sign, POST /group-sales/ancillary-charges/{id}/post"
    description: "Last gate of all: the account's financial standing is checked only after every other reason to reject has been exhausted."

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:

  # ---------------------------------------------------------------- accounts
  - method: POST
    path: "/group-sales/accounts"
    description: "Register a client organization. rebooking_incentive_pct starts at 0.01 and is re-derived on every read per calculations.account_rebooking_tier."
    roles: [SalesManager, RevenueManager]
    code: 201
    input: [name, market_segment, billing_contact_email, "credit_hold?"]
    output: GroupAccount
    side_effects: []

  - method: GET
    path: "/group-sales/accounts/{id}"
    description: "Read one account, with repeat_group_count, lifetime_actualized_room_nights, last_completed_departure_date and rebooking_incentive_pct freshly derived against the logical clock."
    roles: [SalesManager, RevenueManager, ContractAdmin, AccountingClerk, GroupContact]
    code: 200
    input: []
    output: GroupAccount
    side_effects: ["re-derives calculations.account_rebooking_tier on read (including the 730-day lapse decay)"]

  - method: GET
    path: "/group-sales/accounts/{id}/leads"
    description: "Reverse lookup of Lead.account_id. Paginated."
    roles: [SalesManager, RevenueManager, ContractAdmin, AccountingClerk, GroupContact]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Lead[]
    side_effects: []

  # ------------------------------------------------------- concession packages
  - method: POST
    path: "/group-sales/concession-packages"
    description: "Define a reusable concession package. discount_stack_pct is computed as the sum of the four discount percentages and must not exceed max_discount_stack_pct."
    roles: [RevenueManager]
    code: 201
    input: [name, room_rate_discount_pct, comp_room_ratio, rebate_per_room_night_cents, banquet_discount_pct, av_discount_pct, parking_discount_pct, min_peak_rooms, min_total_room_nights, max_discount_stack_pct]
    output: ConcessionPackage
    side_effects: ["computes discount_stack_pct", "validations priority 27 (ERR_DISCOUNT_STACK_EXCEEDED)"]

  - method: GET
    path: "/group-sales/concession-packages/{id}"
    description: "Read one concession package."
    roles: [SalesManager, RevenueManager, ContractAdmin, AccountingClerk]
    code: 200
    input: []
    output: ConcessionPackage
    side_effects: []

  # ----------------------------------------------------------- inventory days
  - method: POST
    path: "/group-sales/inventory-days"
    description: "Seed or replace one date of the house inventory calendar: capacity, group ceiling, the forward transient forecast series and the same-date-last-year realized series. Re-posting an existing stay_date replaces the input fields and preserves held_group_rooms / committed_group_rooms."
    roles: [RevenueManager]
    code: 201
    input: [stay_date, total_rooms, group_ceiling_rooms, transient_demand_rooms, transient_adr_cents, historical_pickup_rooms, historical_adr_cents]
    output: InventoryDay
    side_effects: []

  - method: GET
    path: "/group-sales/inventory-days"
    description: "List inventory days ordered by stay_date ascending, optionally windowed by from_date (inclusive) and to_date (exclusive). Paginated."
    roles: [SalesManager, RevenueManager, ContractAdmin, AccountingClerk]
    code: 200
    input: ["from_date?", "to_date?", "limit?", "offset?"]
    output: InventoryDay[]
    side_effects: []

  # ------------------------------------------------------------------- leads
  - method: POST
    path: "/group-sales/leads"
    description: "Capture an inbound group lead. owner_user_id is stamped from X-User-ID, nights_count is computed from the half-open date range, and status starts at NEW."
    roles: [SalesManager]
    code: 201
    input: [account_id, program_name, arrival_date, departure_date, peak_rooms, total_requested_room_nights, meeting_space_sqft_needed, decision_deadline_at]
    output: Lead
    side_effects: ["stamps owner_user_id from X-User-ID", "computes nights_count"]

  - method: GET
    path: "/group-sales/leads/{id}"
    description: "Read one lead."
    roles: [SalesManager, RevenueManager, ContractAdmin, AccountingClerk, GroupContact]
    code: 200
    input: []
    output: Lead
    side_effects: []

  - method: POST
    path: "/group-sales/leads/{id}/qualify"
    description: "Score the lead and route it. Requires an InventoryDay for every date of the half-open stay range. Writes qualification_score and estimated_room_night_value_cents on BOTH branches, then moves the lead to QUALIFIED (score >= 30) or TURNED_DOWN (score < 30)."
    roles: [SalesManager]
    code: 200
    input: []
    output: Lead
    side_effects: ["calculations.lead_qualification_score", "calculations.lead_room_night_value", "state transition NEW -> QUALIFIED | TURNED_DOWN"]

  - method: GET
    path: "/group-sales/leads/{id}/displacement-analyses"
    description: "Reverse lookup of DisplacementAnalysis.lead_id, ordered created_at ascending."
    roles: [SalesManager, RevenueManager, ContractAdmin]
    code: 200
    input: ["status?", "analysis_variant?"]
    output: DisplacementAnalysis[]
    side_effects: []

  - method: GET
    path: "/group-sales/leads/{id}/function-space-holds"
    description: "Reverse lookup of FunctionSpaceHold.lead_id, ordered start_at ascending."
    roles: [SalesManager, RevenueManager, ContractAdmin]
    code: 200
    input: ["space_code?", "status?"]
    output: FunctionSpaceHold[]
    side_effects: []

  # ------------------------------------------------------ function space holds
  - method: POST
    path: "/group-sales/function-space-holds"
    description: "Hold a meeting room for the lead's program. Overlap is judged half-open against HELD and CONFIRMED holds on the same space_code, with each existing interval extended 45 minutes at its end for turnover."
    roles: [SalesManager]
    code: 201
    input: [lead_id, space_code, start_at, end_at, attendee_count]
    output: FunctionSpaceHold
    side_effects: ["validations priority 25 (ERR_FUNCTION_SPACE_CONFLICT)"]

  - method: GET
    path: "/group-sales/function-space-holds/{id}"
    description: "Read one function-space hold."
    roles: [SalesManager, RevenueManager, ContractAdmin]
    code: 200
    input: []
    output: FunctionSpaceHold
    side_effects: []

  - method: POST
    path: "/group-sales/function-space-holds/{id}/release"
    description: "Release a HELD or CONFIRMED hold; the interval stops blocking new holds immediately."
    roles: [SalesManager, RevenueManager]
    code: 200
    input: []
    output: FunctionSpaceHold
    side_effects: ["state transition HELD | CONFIRMED -> RELEASED"]

  # ---------------------------------------------------- displacement analyses
  - method: POST
    path: "/group-sales/displacement-analyses"
    description: "Run a displacement study for the lead under one of the two series variants. Creating an analysis moves the lead to DISPLACEMENT_REVIEW and bumps Lead.version."
    roles: [RevenueManager]
    code: 201
    input: [lead_id, analysis_variant]
    output: DisplacementAnalysis
    side_effects: ["calculations.displacement_cost", "stamps requested_by_user_id from X-User-ID", "lead transition QUALIFIED | CLEARED | DISPLACEMENT_REVIEW -> DISPLACEMENT_REVIEW", "increments Lead.version"]

  - method: GET
    path: "/group-sales/displacement-analyses/{id}"
    description: "Read one displacement analysis with its full cost breakdown."
    roles: [SalesManager, RevenueManager, ContractAdmin]
    code: 200
    input: []
    output: DisplacementAnalysis
    side_effects: []

  - method: POST
    path: "/group-sales/displacement-analyses/{id}/decide"
    description: "Approve or reject the study. Approving a negative net_benefit_cents requires override_reason. The acting user must differ from requested_by_user_id. expected_lead_version guards the lead against a study run in the meantime."
    roles: [RevenueManager]
    code: 200
    input: [decision, expected_lead_version, "override_reason?"]
    output: DisplacementAnalysis
    side_effects: ["stamps decided_by_user_id", "analysis transition PENDING -> APPROVED | REJECTED", "on APPROVE, lead transition DISPLACEMENT_REVIEW -> CLEARED", "on REJECT, lead transition DISPLACEMENT_REVIEW -> LOST", "increments Lead.version"]

  # ------------------------------------------------------------- rate quotes
  - method: POST
    path: "/group-sales/rate-quotes"
    description: "Draft a quote against a CLEARED lead. comp_room_ratio and rebate_per_room_night_cents are PINNED from the package at creation; effective_net_rate_cents rounds each concession component to whole cents before subtracting. expected_lead_version guards against a lead that moved after the quote was composed."
    roles: [SalesManager]
    code: 201
    input: [lead_id, concession_package_id, base_rate_cents, quoted_peak_rooms, quoted_room_nights, expires_at, expected_lead_version]
    output: RateQuote
    side_effects: ["pins comp_room_ratio and rebate_per_room_night_cents", "calculations.effective_net_rate", "stamps prepared_by_user_id", "lead transition CLEARED -> QUOTED", "increments Lead.version"]

  - method: GET
    path: "/group-sales/rate-quotes/{id}"
    description: "Read one quote."
    roles: [SalesManager, RevenueManager, ContractAdmin, GroupContact]
    code: 200
    input: []
    output: RateQuote
    side_effects: []

  - method: GET
    path: "/group-sales/rate-quotes"
    description: "List quotes, filterable by lead_id and by concession_package_id. Ordered created_at ascending, paginated."
    roles: [SalesManager, RevenueManager, ContractAdmin, GroupContact]
    code: 200
    input: ["lead_id?", "concession_package_id?", "status?", "limit?", "offset?"]
    output: RateQuote[]
    side_effects: []

  - method: POST
    path: "/group-sales/rate-quotes/{id}/propose"
    description: "Send a DRAFT or COUNTERED quote to the client. Placing the quote in PROPOSED raises held_group_rooms on every InventoryDay of the program and sets hold_placed."
    roles: [SalesManager]
    code: 200
    input: []
    output: RateQuote
    side_effects: ["state transition DRAFT | COUNTERED -> PROPOSED", "raises InventoryDay.held_group_rooms by quoted_peak_rooms across the stay range", "sets hold_placed = true"]

  - method: POST
    path: "/group-sales/rate-quotes/{id}/counter"
    description: "Client counter-offer on a PROPOSED quote. Releases the inventory hold and returns the quote to COUNTERED."
    roles: [GroupContact]
    code: 200
    input: [countered_base_rate_cents, "counter_note?"]
    output: RateQuote
    side_effects: ["state transition PROPOSED -> COUNTERED", "releases InventoryDay.held_group_rooms", "sets hold_placed = false", "increments negotiation_round"]

  - method: POST
    path: "/group-sales/rate-quotes/{id}/revise"
    description: "Re-price a DRAFT or COUNTERED quote. Recomputes effective_net_rate_cents and total_quote_value_cents from the pinned concessions. A revise that raises quoted_peak_rooms forks the quote back to DRAFT instead of holding it in COUNTERED."
    roles: [SalesManager]
    code: 200
    input: [base_rate_cents, quoted_peak_rooms, quoted_room_nights, expires_at]
    output: RateQuote
    side_effects: ["calculations.effective_net_rate", "state transition COUNTERED -> DRAFT when quoted_peak_rooms increases, otherwise stays put"]

  - method: POST
    path: "/group-sales/rate-quotes/{id}/accept"
    description: "Client accepts a PROPOSED quote. Requires a non-expired quote whose lead carries an APPROVED displacement analysis and no PENDING one. The acting user must differ from prepared_by_user_id."
    roles: [GroupContact]
    code: 200
    input: []
    output: RateQuote
    side_effects: ["state transition PROPOSED -> ACCEPTED", "lead transition QUOTED -> WON", "increments Lead.version"]

  # ---------------------------------------------------------------- contracts
  - method: POST
    path: "/group-sales/contracts"
    description: "Paper an ACCEPTED quote. contracted_rate_cents is frozen from the quote's effective_net_rate_cents; arrival_date, departure_date and nights_count are copied from the lead; cutoff_date is derived at sign time from cutoff_days_before_arrival."
    roles: [ContractAdmin]
    code: 201
    input: [quote_id, attrition_threshold_pct, attrition_basis, force_majeure_clause, cutoff_days_before_arrival, contracted_room_nights, contracted_peak_rooms, nightly_allotments]
    output: GroupContract
    side_effects: ["freezes contracted_rate_cents from quote.effective_net_rate_cents", "copies the program dates off the lead", "validations priority 23 (ERR_ALLOTMENT_PLAN_MISMATCH)"]

  - method: GET
    path: "/group-sales/contracts/{id}"
    description: "Read one contract with its live receivable roll-up."
    roles: [SalesManager, RevenueManager, ContractAdmin, AccountingClerk, GroupContact]
    code: 200
    input: []
    output: GroupContract
    side_effects: []

  - method: GET
    path: "/group-sales/contracts"
    description: "List contracts, filterable by quote_id. Ordered created_at ascending, paginated."
    roles: [SalesManager, RevenueManager, ContractAdmin, AccountingClerk]
    code: 200
    input: ["quote_id?", "status?", "limit?", "offset?"]
    output: GroupContract[]
    side_effects: []

  - method: POST
    path: "/group-sales/contracts/{id}/send"
    description: "Issue the DRAFT contract to the client for signature."
    roles: [ContractAdmin]
    code: 200
    input: []
    output: GroupContract
    side_effects: ["state transition DRAFT -> SENT"]

  - method: POST
    path: "/group-sales/contracts/{id}/sign"
    description: "Countersign a SENT contract. This is the cascade that mints the master RoomBlock in SETUP with one BlockNight per nightly_allotments entry, converts the quote's held inventory into committed inventory, and derives cutoff_date."
    roles: [ContractAdmin]
    code: 200
    input: [signature_name]
    output: GroupContract
    side_effects: ["state transition SENT -> SIGNED", "creates the master RoomBlock (is_master = true, inventory_status = SETUP, billing_status = UNBILLED) and its BlockNight rows", "derives cutoff_date = arrival_date - cutoff_days_before_arrival", "moves InventoryDay.held_group_rooms into committed_group_rooms per night", "stamps signed_by_user_id and signed_at from X-User-ID and the logical clock", "validations priority 28 (ERR_GROUP_CEILING_EXCEEDED) and 32 (ERR_ACCOUNT_CREDIT_HOLD)"]

  - method: POST
    path: "/group-sales/contracts/{id}/cancel"
    description: "Cancel a SENT or SIGNED contract. CLIENT_CANCEL assesses tiered damages on the un-picked-up remainder; FORCE_MAJEURE with a STANDARD or EXPANDED clause terminates at zero damages and voids every posted ancillary charge; FORCE_MAJEURE with clause NONE halves the tiered figure."
    roles: [ContractAdmin]
    code: 200
    input: [cancellation_reason, "note?"]
    output: GroupContract
    side_effects: ["calculations.cancellation_damages", "state transition SENT | SIGNED -> CANCELLED (CLIENT_CANCEL) or TERMINATED_FORCE_MAJEURE (FORCE_MAJEURE)", "releases every non-terminal RoomBlock of the contract to CLOSED and returns its committed inventory", "cancels every PENDING and CONFIRMED Reservation of the block tree", "on FORCE_MAJEURE with a clause, voids POSTED AncillaryCharge rows and rewrites receivable_total_cents", "calculations.receivable_conservation"]

  - method: GET
    path: "/group-sales/contracts/{id}/reconciliations"
    description: "Reverse lookup of Reconciliation.contract_id, ordered created_at ascending."
    roles: [ContractAdmin, AccountingClerk, RevenueManager]
    code: 200
    input: ["status?"]
    output: Reconciliation[]
    side_effects: []

  - method: GET
    path: "/group-sales/contracts/{id}/ancillary-charges"
    description: "Reverse lookup of AncillaryCharge.contract_id, ordered created_at ascending."
    roles: [ContractAdmin, AccountingClerk, RevenueManager, GroupContact]
    code: 200
    input: ["category?", "status?"]
    output: AncillaryCharge[]
    side_effects: []

  # -------------------------------------------------------------- room blocks
  - method: POST
    path: "/group-sales/room-blocks"
    description: "Carve a sub-block out of an existing block. The master block is never created here — it is minted by the contract sign cascade. Every requested night must exist on the parent and fit inside its unallocated rooms. expected_parent_block_version guards the parent's allotment picture."
    roles: [ContractAdmin, ReservationsAgent]
    code: 201
    input: [parent_block_id, name, nightly_allotments, expected_parent_block_version]
    output: RoomBlock
    side_effects: ["calculations.sub_block_allocation", "creates BlockNight rows on the sub-block", "raises parent BlockNight.rooms_sub_allocated and lowers rooms_open", "inherits contract_id and cutoff_date from the parent", "is_master = false, inventory_status = SETUP", "increments the parent RoomBlock.version"]

  - method: GET
    path: "/group-sales/room-blocks/{id}"
    description: "Read one block with its live pickup roll-up."
    roles: [SalesManager, RevenueManager, ContractAdmin, ReservationsAgent, AccountingClerk, GroupContact]
    code: 200
    input: []
    output: RoomBlock
    side_effects: []

  - method: GET
    path: "/group-sales/room-blocks"
    description: "List blocks, filterable by contract_id and by parent_block_id (reverse lookup of the self-referential FK). Ordered created_at ascending, paginated."
    roles: [SalesManager, RevenueManager, ContractAdmin, ReservationsAgent, AccountingClerk]
    code: 200
    input: ["contract_id?", "parent_block_id?", "is_master?", "inventory_status?", "limit?", "offset?"]
    output: RoomBlock[]
    side_effects: []

  - method: GET
    path: "/group-sales/room-blocks/{id}/nights"
    description: "Reverse lookup of BlockNight.block_id, ordered stay_date ascending, optionally windowed by from_date (inclusive) and to_date (exclusive)."
    roles: [SalesManager, RevenueManager, ContractAdmin, ReservationsAgent, AccountingClerk, GroupContact]
    code: 200
    input: ["from_date?", "to_date?"]
    output: BlockNight[]
    side_effects: []

  - method: GET
    path: "/group-sales/room-blocks/{id}/reservations"
    description: "Reverse lookup of Reservation.block_id, ordered created_at ascending, paginated. Returns only the block's own reservations, never a sub-block's."
    roles: [SalesManager, RevenueManager, ContractAdmin, ReservationsAgent, AccountingClerk, GroupContact]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Reservation[]
    side_effects: []

  - method: GET
    path: "/group-sales/room-blocks/{id}/pickup-summary"
    description: "Computed read: the block's pickup against its allotment plus BOTH attrition-liability projections, so the ROOM_NIGHTS and PEAK_NIGHT bases can be compared before the contract commits to one."
    roles: [SalesManager, RevenueManager, ContractAdmin, AccountingClerk]
    code: 200
    input: []
    output: { block_id: string, allotted_room_nights: integer, picked_up_room_nights: integer, released_room_nights: integer, peak_night_rooms: integer, commitment_base_room_nights: integer, room_nights_basis_shortfall: integer, room_nights_basis_damages_cents: integer, peak_night_basis_shortfall: integer, peak_night_basis_damages_cents: integer }
    side_effects: ["calculations.block_pickup", "calculations.attrition_liability under both variants (read-only projection, nothing is persisted)"]

  - method: POST
    path: "/group-sales/room-blocks/{id}/open"
    description: "Open a SETUP block for pickup. Sub-blocks may be opened independently of their master."
    roles: [ContractAdmin, ReservationsAgent]
    code: 200
    input: []
    output: RoomBlock
    side_effects: ["state transition SETUP -> OPEN"]

  - method: POST
    path: "/group-sales/room-blocks/{id}/cutoff"
    description: "Cut off an OPEN block on or after its cutoff_date: unsold rooms are released night by night, the released inventory is handed back to the house, and every sub-block still OPEN is cut off in the same cascade."
    roles: [ReservationsAgent, ContractAdmin]
    code: 200
    input: []
    output: RoomBlock
    side_effects: ["state transition OPEN -> CUT_OFF", "per night, rooms_released += rooms_open then rooms_open = 0", "lowers InventoryDay.committed_group_rooms by the released rooms of each night", "cascades cutoff into every OPEN sub-block, each of which releases its own unsold rooms by the same per-night formula; a sub-block release moves no InventoryDay inventory and does not restore the master's rooms_open, because those rooms were already carved out of the master allotment as rooms_sub_allocated (see the normative 4-hop cascade in §1.2)", "recomputes released_room_nights and picked_up_room_nights"]

  - method: POST
    path: "/group-sales/room-blocks/{id}/waive-attrition"
    description: "Waive a block's attrition exposure. Its allotted room nights leave the contract's commitment base, and any DRAFT Reconciliation on the contract is recomputed in place."
    roles: [RevenueManager]
    code: 200
    input: [waiver_reason]
    output: RoomBlock
    side_effects: ["billing_status transition UNBILLED -> WAIVED", "stamps waived_by_user_id", "recomputes calculations.attrition_liability and calculations.settlement_waterfall on any DRAFT Reconciliation of the contract"]

  # ------------------------------------------------------------- reservations
  - method: POST
    path: "/group-sales/reservations"
    description: "Add a rooming-list entry to an OPEN block before its cutoff date. Comp designation is re-derived over the contract's whole reservation set in created_at order."
    roles: [ReservationsAgent, GroupContact]
    code: 201
    input: [block_id, guest_name, arrival_date, departure_date, source]
    output: Reservation
    side_effects: ["computes room_nights from the half-open stay range", "calculations.comp_room_entitlement", "raises BlockNight.rooms_picked_up and lowers rooms_open on every night of the stay", "recomputes the block's picked_up_room_nights and peak_night_rooms, and the master's roll-up"]

  - method: GET
    path: "/group-sales/reservations/{id}"
    description: "Read one reservation."
    roles: [SalesManager, RevenueManager, ContractAdmin, ReservationsAgent, AccountingClerk, GroupContact]
    code: 200
    input: []
    output: Reservation
    side_effects: []

  - method: POST
    path: "/group-sales/reservations/{id}/advance"
    description: "Move a reservation along its stay: PENDING -> CONFIRMED, CONFIRMED -> CHECKED_IN, CHECKED_IN -> CHECKED_OUT, or CONFIRMED -> NO_SHOW. Only NO_SHOW and CANCELLED change the pickup set."
    roles: [ReservationsAgent]
    code: 200
    input: [to_status]
    output: Reservation
    side_effects: ["state transition per to_status", "on NO_SHOW, leaves the pickup set but stays in the actualized set, so calculations.block_pickup falls while calculations.attrition_liability does not"]

  - method: POST
    path: "/group-sales/reservations/{id}/cancel"
    description: "Cancel a PENDING or CONFIRMED reservation before its arrival date. The comp designation of the contract's remaining reservations is re-derived from scratch."
    roles: [ReservationsAgent, GroupContact]
    code: 200
    input: [disposition_reason]
    output: Reservation
    side_effects: ["state transition PENDING | CONFIRMED -> CANCELLED", "returns the rooms to BlockNight.rooms_open on every night of the stay", "re-derives calculations.comp_room_entitlement across the contract, which can move the comp flag onto a different reservation"]

  # -------------------------------------------------------- ancillary charges
  - method: POST
    path: "/group-sales/ancillary-charges"
    description: "Quote banquet, audiovisual, parking or internet revenue against a SIGNED contract. The category's concession discount comes from the contract's package."
    roles: [ContractAdmin, AccountingClerk]
    code: 201
    input: [contract_id, category, gross_amount_cents]
    output: AncillaryCharge
    side_effects: ["calculations.ancillary_net", "status starts at QUOTED and is therefore excluded from settlement until posted"]

  - method: GET
    path: "/group-sales/ancillary-charges/{id}"
    description: "Read one ancillary charge."
    roles: [ContractAdmin, AccountingClerk, RevenueManager, GroupContact]
    code: 200
    input: []
    output: AncillaryCharge
    side_effects: []

  - method: POST
    path: "/group-sales/ancillary-charges/{id}/post"
    description: "Post a QUOTED charge to the contract's receivable, which admits it into the settlement waterfall."
    roles: [AccountingClerk]
    code: 200
    input: []
    output: AncillaryCharge
    side_effects: ["state transition QUOTED -> POSTED", "calculations.receivable_conservation", "validations priority 32 (ERR_ACCOUNT_CREDIT_HOLD)"]

  - method: POST
    path: "/group-sales/ancillary-charges/{id}/void"
    description: "Void a QUOTED or POSTED charge; a posted void removes it from the receivable."
    roles: [AccountingClerk]
    code: 200
    input: []
    output: AncillaryCharge
    side_effects: ["state transition QUOTED | POSTED -> VOIDED", "calculations.receivable_conservation"]

  # -------------------------------------------------------- reconciliations
  - method: POST
    path: "/group-sales/contracts/{id}/reconciliations"
    description: "Open the post-event settlement once the group has departed and every block is cut off. Runs the attrition variant the contract chose and the six-step settlement waterfall, snapshotting the account's incentive rate. expected_contract_version guards against a contract that moved after the numbers were read."
    roles: [AccountingClerk]
    code: 201
    input: [expected_contract_version]
    output: Reconciliation
    side_effects: ["calculations.attrition_liability", "calculations.settlement_waterfall", "snapshots incentive_rate_snapshot from GroupAccount.rebooking_incentive_pct", "stamps prepared_by_user_id", "supersedes any earlier DRAFT Reconciliation of the contract to SUPERSEDED", "increments GroupContract.version"]

  - method: GET
    path: "/group-sales/reconciliations/{id}"
    description: "Read one reconciliation with its full waterfall breakdown."
    roles: [ContractAdmin, AccountingClerk, RevenueManager, GroupContact]
    code: 200
    input: []
    output: Reconciliation
    side_effects: []

  - method: POST
    path: "/group-sales/reconciliations/{id}/finalize"
    description: "Finalize a DRAFT reconciliation: attrition is billed, the rebate is paid, the contract completes, and the account's repeat-business history advances. The finalizing user must differ from prepared_by_user_id."
    roles: [AccountingClerk]
    code: 200
    input: []
    output: Reconciliation
    side_effects: ["state transition DRAFT -> FINALIZED", "writes GroupContract.assessed_damages_cents, rebate_paid_cents and receivable_total_cents", "block billing_status UNBILLED -> ATTRITION_ASSESSED (or stays WAIVED), then SETTLED", "contract transition SIGNED -> COMPLETED and inventory_status CUT_OFF -> CLOSED on the block tree", "advances GroupAccount.repeat_group_count, lifetime_actualized_room_nights and last_completed_departure_date, re-tiering calculations.account_rebooking_tier"]

  # --------------------------------------------------------------- test clock
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint: set the server's logical clock to any instant. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z (the mandated startup default) and never falls back to wall-clock time. Every deadline, expiry, cutoff and lead-time rule reads this clock."
    roles: [SystemOperator]
    code: 200
    input: [to_iso8601]
    output: { current_utc: datetime }
    side_effects: ["moves the logical clock; no business row is mutated"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:

  # ---- authentication / authorization -------------------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-ID or X-User-Role header absent, blank, or naming a role outside the seven declared in §1.7"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the acting role is not listed in the endpoint's roles, or a GroupContact targets a row belonging to another GroupAccount"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the acting X-User-ID equals the user who performed the preceding step: analysis.requested_by_user_id on decide, reconciliation.prepared_by_user_id on finalize, quote.prepared_by_user_id on accept"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "missing required body field, wrong JSON type, money or room count sent as a string, unknown enum member, malformed date/datetime, limit outside 1..100, or negative offset"

  # ---- not found -----------------------------------------------------------
  - id: ERR_ACCOUNT_NOT_FOUND
    http: 404
    condition: "no GroupAccount matches the path id or the body's account_id"
  - id: ERR_LEAD_NOT_FOUND
    http: 404
    condition: "no Lead matches the path id or the body's lead_id"
  - id: ERR_PACKAGE_NOT_FOUND
    http: 404
    condition: "no ConcessionPackage matches the path id or the body's concession_package_id"
  - id: ERR_ANALYSIS_NOT_FOUND
    http: 404
    condition: "no DisplacementAnalysis matches the path id"
  - id: ERR_QUOTE_NOT_FOUND
    http: 404
    condition: "no RateQuote matches the path id or the body's quote_id"
  - id: ERR_CONTRACT_NOT_FOUND
    http: 404
    condition: "no GroupContract matches the path id or the body's contract_id"
  - id: ERR_BLOCK_NOT_FOUND
    http: 404
    condition: "no RoomBlock matches the path id, the body's block_id, or the body's parent_block_id"
  - id: ERR_RESERVATION_NOT_FOUND
    http: 404
    condition: "no Reservation matches the path id"
  - id: ERR_CHARGE_NOT_FOUND
    http: 404
    condition: "no AncillaryCharge matches the path id"
  - id: ERR_RECONCILIATION_NOT_FOUND
    http: 404
    condition: "no Reconciliation matches the path id"
  - id: ERR_HOLD_NOT_FOUND
    http: 404
    condition: "no FunctionSpaceHold matches the path id"

  # ---- optimistic concurrency (§1.2.1) ------------------------------------
  - id: ERR_STALE_LEAD_VERSION
    http: 412
    condition: "expected_lead_version does not equal the Lead's current version on POST /group-sales/rate-quotes or POST /group-sales/displacement-analyses/{id}/decide"
  - id: ERR_STALE_BLOCK_VERSION
    http: 412
    condition: "expected_parent_block_version does not equal the parent RoomBlock's current version on POST /group-sales/room-blocks"
  - id: ERR_STALE_CONTRACT_VERSION
    http: 412
    condition: "expected_contract_version does not equal the GroupContract's current version on POST /group-sales/contracts/{id}/reconciliations"

  # ---- state ---------------------------------------------------------------
  - id: ERR_LEAD_INVALID_STATE
    http: 409
    condition: "the Lead's status has no declared transition for this trigger (e.g. qualifying an already-QUALIFIED lead, or quoting a lead that is not CLEARED)"
  - id: ERR_QUOTE_INVALID_STATE
    http: 409
    condition: "the RateQuote's status has no declared transition for this trigger (e.g. countering a DRAFT quote, reviving a WITHDRAWN one, papering a quote that is not ACCEPTED)"
  - id: ERR_CONTRACT_INVALID_STATE
    http: 409
    condition: "the GroupContract's status has no declared transition for this trigger (e.g. signing a DRAFT contract, cancelling a COMPLETED one)"
  - id: ERR_BLOCK_INVALID_STATE
    http: 409
    condition: "the RoomBlock's inventory_status has no declared transition for this trigger (e.g. opening a CUT_OFF block, cutting off a RELEASED one, sub-allocating from a CLOSED master)"
  - id: ERR_BLOCK_NOT_OPEN
    http: 409
    condition: "a rooming-list write targets a block whose inventory_status is not OPEN"
  - id: ERR_RESERVATION_INVALID_STATE
    http: 409
    condition: "the Reservation's status has no declared transition for the requested to_status or for cancel (e.g. checking in a PENDING guest, cancelling a CHECKED_OUT one)"
  - id: ERR_CHARGE_INVALID_STATE
    http: 409
    condition: "posting a charge that is not QUOTED, or voiding one that is already VOIDED"
  - id: ERR_HOLD_INVALID_STATE
    http: 409
    condition: "releasing a FunctionSpaceHold that is already RELEASED"
  - id: ERR_ANALYSIS_ALREADY_DECIDED
    http: 409
    condition: "decide is called on a DisplacementAnalysis whose status is APPROVED or REJECTED"
  - id: ERR_RECONCILIATION_ALREADY_FINALIZED
    http: 409
    condition: "finalize is called on a Reconciliation whose status is FINALIZED or SUPERSEDED"
  - id: ERR_BLOCK_ALREADY_BILLED
    http: 409
    condition: "waive-attrition is called on a RoomBlock whose billing_status is WAIVED or SETTLED"
  - id: ERR_RECEIVABLE_ALREADY_SETTLED
    http: 409
    condition: "voiding a POSTED AncillaryCharge whose contract already carries a FINALIZED Reconciliation"

  # ---- temporal ------------------------------------------------------------
  - id: ERR_INVALID_DATE_RANGE
    http: 422
    condition: "departure_date <= arrival_date, end_at <= start_at, expires_at at or before the logical clock, or a nightly_allotments plan with duplicate or non-contiguous stay_dates"
  - id: ERR_QUOTE_EXPIRED
    http: 422
    condition: "the RateQuote's expires_at is at or before the logical clock when accept or contract creation is attempted"
  - id: ERR_PAST_CUTOFF_DATE
    http: 422
    condition: "a reservation is written on or after the block's cutoff_date"
  - id: ERR_CUTOFF_DATE_NOT_REACHED
    http: 422
    condition: "cutoff is called before the block's cutoff_date"
  - id: ERR_CANCEL_AFTER_ARRIVAL
    http: 422
    condition: "cancel is called on or after the reservation's arrival_date"
  - id: ERR_EVENT_NOT_CONCLUDED
    http: 422
    condition: "a reconciliation is opened before the contract's departure_date"

  # ---- referential ---------------------------------------------------------
  - id: ERR_DISPLACEMENT_NOT_APPROVED
    http: 409
    condition: "the quote's lead has no APPROVED DisplacementAnalysis, or still carries a PENDING one, when accept or contract creation is attempted"
  - id: ERR_INVENTORY_DAY_MISSING
    http: 422
    condition: "no InventoryDay exists for some date in the half-open range a calculation must walk"
  - id: ERR_SUB_BLOCK_DATES_OUTSIDE_PARENT
    http: 422
    condition: "a sub-block allotment names a stay_date the parent block does not hold"
  - id: ERR_STAY_DATE_OUTSIDE_BLOCK
    http: 422
    condition: "a reservation's half-open stay range is not fully covered by the target block's BlockNight rows"
  - id: ERR_BLOCKS_NOT_CUT_OFF
    http: 409
    condition: "a reconciliation is opened while some RoomBlock of the contract is still SETUP or OPEN"
  - id: ERR_ALLOTMENT_PLAN_MISMATCH
    http: 422
    condition: "nightly_allotments does not sum to contracted_room_nights, its maximum does not equal contracted_peak_rooms, or its dates are not exactly the lead's half-open stay range"

  # ---- safety --------------------------------------------------------------
  - id: ERR_DUPLICATE_ROOMING_LIST_ENTRY
    http: 409
    condition: "another non-CANCELLED Reservation on the same contract already has this guest_name and arrival_date"
  - id: ERR_FUNCTION_SPACE_CONFLICT
    http: 409
    condition: "the requested function-space interval overlaps a HELD or CONFIRMED hold on the same space_code once that hold is extended 45 minutes for turnover"

  # ---- constraint ----------------------------------------------------------
  - id: ERR_CONCESSION_INELIGIBLE
    http: 422
    condition: "quoted_peak_rooms < package.min_peak_rooms or quoted_room_nights < package.min_total_room_nights"
  - id: ERR_DISCOUNT_STACK_EXCEEDED
    http: 422
    condition: "the package's four discount percentages sum above max_discount_stack_pct"

  # ---- fiscal --------------------------------------------------------------
  - id: ERR_GROUP_CEILING_EXCEEDED
    http: 409
    condition: "held + committed + requested group rooms would exceed InventoryDay.group_ceiling_rooms on some date of the program"
  - id: ERR_BLOCK_ALLOTMENT_EXCEEDED
    http: 409
    condition: "some night of the requested stay has BlockNight.rooms_open == 0"
  - id: ERR_SUB_BLOCK_ALLOTMENT_EXCEEDED
    http: 409
    condition: "a requested sub-block night exceeds the parent night's unallocated rooms"
  - id: ERR_DISPLACEMENT_NET_BENEFIT_NEGATIVE
    http: 422
    condition: "APPROVE is requested on an analysis whose net_benefit_cents is below zero and no override_reason was supplied"
  - id: ERR_ACCOUNT_CREDIT_HOLD
    http: 402
    condition: "the contract's GroupAccount has credit_hold == true when signing a contract or posting an ancillary charge"

# =============================================================================
# §1.7 RBAC Matrix  (role_model: segregation_of_duties)
# =============================================================================
roles:

  - name: SalesManager
    description: "Group sales manager: owns the lead through qualification, function space, quoting and negotiation."
    identity: "opaque"
    exclusive_operations:
      - "POST /group-sales/leads"
      - "POST /group-sales/leads/{id}/qualify"
      - "POST /group-sales/function-space-holds"
      - "POST /group-sales/rate-quotes"
      - "POST /group-sales/rate-quotes/{id}/propose"
      - "POST /group-sales/rate-quotes/{id}/revise"
    shared_operations:
      - "POST /group-sales/accounts (with RevenueManager)"
      - "POST /group-sales/function-space-holds/{id}/release (with RevenueManager)"
      - "read access across accounts, leads, quotes, contracts, blocks, nights, reservations and pickup summaries"

  - name: RevenueManager
    description: "Revenue management: owns the house inventory calendar, concession packages, displacement decisions and attrition waivers."
    identity: "opaque"
    exclusive_operations:
      - "POST /group-sales/inventory-days"
      - "POST /group-sales/concession-packages"
      - "POST /group-sales/displacement-analyses"
      - "POST /group-sales/displacement-analyses/{id}/decide"
      - "POST /group-sales/room-blocks/{id}/waive-attrition"
    shared_operations:
      - "POST /group-sales/accounts (with SalesManager)"
      - "POST /group-sales/function-space-holds/{id}/release (with SalesManager)"
      - "read access across the whole surface except single reconciliation reads it shares with accounting"
    notes: "Segregation of duties: the same X-User-ID may not both request and decide a displacement analysis, even though one role covers both operations."

  - name: ContractAdmin
    description: "Contract administration: papers, issues, countersigns and cancels contracts, and carves sub-blocks."
    identity: "opaque"
    exclusive_operations:
      - "POST /group-sales/contracts"
      - "POST /group-sales/contracts/{id}/send"
      - "POST /group-sales/contracts/{id}/sign"
      - "POST /group-sales/contracts/{id}/cancel"
    shared_operations:
      - "POST /group-sales/room-blocks (with ReservationsAgent)"
      - "POST /group-sales/room-blocks/{id}/open (with ReservationsAgent)"
      - "POST /group-sales/room-blocks/{id}/cutoff (with ReservationsAgent)"
      - "POST /group-sales/ancillary-charges (with AccountingClerk)"
      - "read access across leads, quotes, contracts, blocks, charges and reconciliations"

  - name: ReservationsAgent
    description: "Reservations desk: manages the rooming list and the block's day-to-day pickup."
    identity: "opaque"
    exclusive_operations:
      - "POST /group-sales/reservations/{id}/advance"
    shared_operations:
      - "POST /group-sales/reservations (with GroupContact)"
      - "POST /group-sales/reservations/{id}/cancel (with GroupContact)"
      - "POST /group-sales/room-blocks (with ContractAdmin)"
      - "POST /group-sales/room-blocks/{id}/open (with ContractAdmin)"
      - "POST /group-sales/room-blocks/{id}/cutoff (with ContractAdmin)"
      - "read access to blocks, nights and reservations"

  - name: AccountingClerk
    description: "Group accounting: posts ancillary revenue, opens the post-event settlement and finalizes billing."
    identity: "opaque"
    exclusive_operations:
      - "POST /group-sales/ancillary-charges/{id}/post"
      - "POST /group-sales/ancillary-charges/{id}/void"
      - "POST /group-sales/contracts/{id}/reconciliations"
      - "POST /group-sales/reconciliations/{id}/finalize"
    shared_operations:
      - "POST /group-sales/ancillary-charges (with ContractAdmin)"
      - "read access to accounts, contracts, charges, reconciliations, blocks and pickup summaries"
    notes: "Segregation of duties: the clerk who prepared a reconciliation may not finalize it."

  - name: GroupContact
    description: "The client-side signatory acting for one GroupAccount: counters and accepts quotes, and manages its own rooming list."
    identity: "entity_backed:GroupAccount"
    exclusive_operations:
      - "POST /group-sales/rate-quotes/{id}/counter"
      - "POST /group-sales/rate-quotes/{id}/accept"
    shared_operations:
      - "POST /group-sales/reservations (with ReservationsAgent)"
      - "POST /group-sales/reservations/{id}/cancel (with ReservationsAgent)"
      - "read access limited to rows that resolve to its own GroupAccount"
    notes: "X-User-ID MUST equal the id of the GroupAccount the row resolves to (lead.account_id, quote.lead_id -> lead.account_id, block.contract_id -> contract.quote_id -> quote.lead_id -> lead.account_id). Any other id is ERR_UNAUTHORIZED (403), not 404. Segregation of duties also applies: a contact whose id happens to equal quote.prepared_by_user_id cannot accept that quote."

  - name: SystemOperator
    description: "Test/operations identity that owns only the logical clock."
    identity: "opaque"
    exclusive_operations:
      - "POST /_clock/set_current_utc"
    shared_operations: []
    notes: "Holds no business permissions; every business endpoint rejects it with ERR_UNAUTHORIZED."
