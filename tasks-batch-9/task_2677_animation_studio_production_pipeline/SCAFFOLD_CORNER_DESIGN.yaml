          trigger:
            - call: "POST /studio/render-jobs"
              payload: { render_pool_id: "${pool_id}", shot_stage_task_id: "${task_id}", priority: "NORMAL", requested_cores: 3, window_start: "2026-08-02T00:00:00Z", window_end: "2026-08-02T06:00:00Z", frame_count: 120, seconds_per_frame: 50, expected_render_pool_version: "${pool_v1}" }
              as: ProductionManager
