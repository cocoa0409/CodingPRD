          assert:
            - "${st1} == RECEIVED and ${rec1} == 2026-08-05T09:00:00Z and ${ver2} == 2  # ${ver1} was 1"
            - "${err} == ERR_TRADE_IN_NOT_RECEIVABLE  # HTTP 409 — the trigger is not idempotent"
            - "${st_after} == RECEIVED and ${rec_after} == ${rec1} and ${ver_after} == ${ver2}  # the refused call wrote nothing"

      - name: submitted_trade_in_refuses_authenticate_appeal_and_disposition
        claim_type: invalid_transitions
        grounds:
          - state_machines.TradeIn.transitions
          - errors[ERR_TRADE_IN_NOT_AUTHENTICATABLE]
          - errors[ERR_TRADE_IN_NOT_APPEALABLE]
          - errors[ERR_TRADE_IN_NOT_DISPOSITIONABLE]
        distinguishing_aspect: "From SUBMITTED the only declared trigger is /receive: /authenticate, /appeal and /disposition each return their own per-transition 409 state error rather than a shared one, and none of them advances the row."
        test_recipe:
          setup:
            - "One SUBMITTED MAIL_IN FOOTWEAR grade A trade-in owned by Ava."
          setup_api_calls:
            - call: "POST /recommerce/grade-policies"
              payload: { product_category: "FOOTWEAR", condition_grade: "A", base_credit_pct_bp: 3500, resale_price_pct_bp: 6500, refurb_budget_cap_pct_bp: 2500, restock_fee_pct_bp: 1200, warranty_days: 30 }
              as: ProgramAdmin
              as_user_id: "admin-001"
            - call: "POST /recommerce/credit-policies"
              payload: { code: "CORE-2026", expiry_days: 180, mail_in_bonus_pct_bp: 1000, max_redemption_pct_bp: 5000, min_cash_remainder_minor: 500, eligible_assortment: "BOTH" }
