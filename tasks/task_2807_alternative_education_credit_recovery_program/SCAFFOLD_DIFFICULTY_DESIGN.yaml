          assert:
            - "after the first trigger call Referral.${ref_id}.status == INFO_REQUESTED and missing_items == 'signed parent consent'"
            - "after the second trigger call Referral.${ref_id}.status == SCREENING (the cycle re-enters a state it already occupied) and missing_items == null"
            - "Referral.${ref_id}.deficiency_credits == 6.00 (retained from the first resubmit, not reset)"
            - "Referral.${ref_id}.priority_score == 0.5300 (recomputed on every resubmit; it was 0.3800 at submission)"
            - "after the third trigger call Referral.${ref_id}.status == PLACEMENT_OFFERED and offer_expires_on == '2026-08-11'"
            - "Referral.${ref_id}.promoted_from_waitlist == false"
            - "Referral.${ref_id}.version == 7 (one increment per transition: create, screen, request-info, resubmit, request-info, resubmit, offer)"
            - "Center.${ctr_id}.seats_reserved == 1 and Center.${ctr_id}.seats_available == 9"

      - name: enrollment_integrity_axis_independent_of_progress_axis
        grounds:
