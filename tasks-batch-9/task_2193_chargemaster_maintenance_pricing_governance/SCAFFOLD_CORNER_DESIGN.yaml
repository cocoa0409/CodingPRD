      - name: price_rule_overlap_yields_to_the_schema_check_while_abutting_and_superseding_rules_are_accepted
        claim_type: temporal_validation
        grounds:
          - validations[priority=11]
          - validations[priority=34]
          - endpoints[POST /chargemaster/price-rules]
          - complexity_layers.cascading_side_effects
        distinguishing_aspect: "A body that both inverts the interval (effective_to 2026-03-01 < effective_from 2026-06-01) and overlaps the live rule returns ERR_VALIDATION, not ERR_PRICE_RULE_OVERLAP; a well-formed overlapping interval then returns ERR_PRICE_RULE_OVERLAP; an abutting interval starting exactly at the incumbent's effective_to is accepted; and supersede_rule_id exempts the named rule from the check while truncating it and staling its priced items."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z; facility CCN-0001, revenue code 0300, department CC-100."
            - "Rule A for (facility, 0300): COST_PLUS_MARKUP with the default tiers, [2026-01-01, 2026-10-01)."
            - "DRAFT item CDM-1001 repriced under rule A: gross 240000, PRICED_CURRENT, version 2."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /chargemaster/facilities"
              payload: { name: "Mercy General", cms_certification_number: "CCN-0001", rounding_mode: "NEAREST_CENT" }
              as: SystemAdmin
              captures: { fac: $.data.id }
            - call: "POST /chargemaster/revenue-codes"
              payload: { code: "0300", description: "Laboratory", requires_hcpcs: false, allowed_code_types: ["CPT"], pricing_class: "PROCEDURE" }
              as: SystemAdmin
              captures: { rc300: $.data.id }
            - call: "POST /chargemaster/departments"
              payload: { facility_id: "${fac}", name: "Cardiac Cath Lab", cost_center_code: "CC-100", manager_user_id: "mgr_cath" }
              as: SystemAdmin
              captures: { dept: $.data.id }
            - call: "POST /chargemaster/price-rules"
              payload: { facility_id: "${fac}", revenue_code_id: "${rc300}", pricing_method: "COST_PLUS_MARKUP", effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-10-01T00:00:00Z", markup_tiers: [{ min_cost_basis_cents: 0, markup_bp: 32000 }, { min_cost_basis_cents: 50000, markup_bp: 24000 }, { min_cost_basis_cents: 250000, markup_bp: 18000 }], min_medicare_multiple_bp: 12000, market_cap_multiple_bp: 11000 }
              as: RevenueIntegrityAnalyst
              captures: { rule_a: $.data.id }
            - call: "POST /chargemaster/charge-items"
              payload: { facility_id: "${fac}", department_id: "${dept}", revenue_code_id: "${rc300}", cdm_number: "CDM-1001", description: "CARDIAC CATH BASIC", code_type: "CPT", code_value: "93458", cost_basis_cents: 100000, medicare_rate_cents: 50000, market_p75_cents: 900000, effective_from: "2026-09-01T00:00:00Z" }
              as: RevenueIntegrityAnalyst
              captures: { item: $.data.id }
            - call: "POST /chargemaster/charge-items/${item}/reprice"
              payload: {}
              as: RevenueIntegrityAnalyst
          trigger:
            - call: "POST /chargemaster/price-rules"
              payload: { facility_id: "${fac}", revenue_code_id: "${rc300}", pricing_method: "FLAT_FEE", flat_fee_cents: 500000, effective_from: "2026-06-01T00:00:00Z", effective_to: "2026-03-01T00:00:00Z" }
              as: RevenueIntegrityAnalyst
              captures: { e_schema: $.data.error_id }
            - call: "POST /chargemaster/price-rules"
              payload: { facility_id: "${fac}", revenue_code_id: "${rc300}", pricing_method: "FLAT_FEE", flat_fee_cents: 500000, effective_from: "2026-06-01T00:00:00Z" }
              as: RevenueIntegrityAnalyst
              captures: { e_overlap: $.data.error_id }
            - call: "POST /chargemaster/price-rules"
              payload: { facility_id: "${fac}", revenue_code_id: "${rc300}", pricing_method: "FLAT_FEE", flat_fee_cents: 500000, effective_from: "2026-10-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z", min_medicare_multiple_bp: 12000, market_cap_multiple_bp: 11000 }
              as: RevenueIntegrityAnalyst
              captures: { rule_b: $.data.id, rule_b_status: $.data.status }
            - call: "POST /chargemaster/price-rules"
              payload: { facility_id: "${fac}", revenue_code_id: "${rc300}", pricing_method: "COST_PLUS_MARKUP", effective_from: "2026-09-01T00:00:00Z", effective_to: "2026-10-01T00:00:00Z", markup_tiers: [{ min_cost_basis_cents: 0, markup_bp: 40000 }], min_medicare_multiple_bp: 12000, market_cap_multiple_bp: 11000, supersede_rule_id: "${rule_a}" }
              as: RevenueIntegrityAnalyst
