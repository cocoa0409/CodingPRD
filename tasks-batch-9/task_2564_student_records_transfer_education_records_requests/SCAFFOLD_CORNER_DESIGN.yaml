        distinguishing_aspect: "The schedule copies the district's own state rule at mint time: a TX student (7 years) yields destruction_eligible_at 2033-08-14T00:00:00.000Z, not the 2031 date a CA 5-year rule would produce, and before any disclosure both anchors coincide."
        test_recipe:
          setup:
