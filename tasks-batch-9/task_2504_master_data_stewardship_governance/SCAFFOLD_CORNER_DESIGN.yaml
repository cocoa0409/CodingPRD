      - name: lead_time_breadth_surcharge_appears_at_three_impacted_consumers
        claim_type: Correct Result
        grounds:
          - calculations.change_impact_lead_time
          - calculations.change_impact_lead_time.constants.BREADTH_TIER_1_COUNT
          - state_machines.ChangeRequest.DRAFT_to_SUBMITTED.side_effects
        distinguishing_aspect: "The breadth surcharge keys off the impacted COUNT, not the day figures: with two impacted consumers the answer is max(base 10, floor 5) + 0 = 10, and adding a third consumer that only needs 4 days still pushes the requirement to 11. The surcharge is added after the floor is applied, so it cannot be absorbed by the max()."
