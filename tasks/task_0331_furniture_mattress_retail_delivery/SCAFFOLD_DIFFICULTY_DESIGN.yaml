# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Furniture & Mattress Retail with Delivery — Expert
# Nine §0.5 rules × 2 instances each (18 instances total).
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: payoff_balance_installment_rebate_vs_lease_no_rebate
        grounds:
          - calculations.financing_payoff_balance
          - calculations.financing_monthly_payment
          - entities.FinancingPlan.fields.payoff_balance_cents
          - state_machines.FinancingPlan.CURRENT_to_PAID_OFF
        distinguishing_aspect: |
          Same principal (116802) and same 3 payments made: an INSTALLMENT plan rebates
          unearned interest (payoff 90026) while a LEASE_TO_OWN plan rebates nothing
          (payoff 113881); the two variants on the FinancingPlan domain diverge by 23855 cents.
        test_recipe:
          setup:
            - "One settled-by-financing order O2 (order_total 116802) approved as an INSTALLMENT plan term 12, monthly 10902, after 3 in-schedule payments."
            - "A parallel order O3 (identical config, order_total 116802) approved as a LEASE_TO_OWN plan term 12, monthly 12654, after 3 in-schedule payments."
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "SOFA-STD", name: "Aspen Sofa", category: "SOFA", base_price_cents: 100000, available_fabrics: [{ code: "STANDARD", surcharge_cents: 0 }, { code: "VELVET", surcharge_cents: 20000 }], available_sizes: [{ code: "STD", surcharge_cents: 0 }] }
              as: StoreManager
              captures: { sofa_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Ada Buyer", email: "ada@x.com", credit_score: 720, monthly_income_cents: 8000000, existing_monthly_obligations_cents: 1000000 }
              as: SalesAssociate
              captures: { cust_id: $.data.id }
            # ---- O2 installment ----
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", delivery_tier: "THRESHOLD" }
              as: SalesAssociate
              captures: { o2_id: $.data.id }
            - call: "POST /order-lines"
              payload: { order_id: "${o2_id}", product_id: "${sofa_id}", fabric_code: "STANDARD", size_code: "STD", quantity: 1 }
              as: SalesAssociate
            - call: "GET /orders/${o2_id}"
              as: SalesAssociate
              captures: { o2_v: $.data.version }
            - call: "POST /financing-plans"
              payload: { order_id: "${o2_id}", plan_type: "INSTALLMENT", term_months: 12, expected_order_version: "${o2_v}" }
              as: SalesAssociate
              captures: { fp2_id: $.data.id }
            - call: "POST /financing-plans/${fp2_id}/approve"
              as: StoreManager
            - call: "POST /financing-plans/${fp2_id}/payments"
              payload: { amount_cents: 10902 }
              as: SalesAssociate
            - call: "POST /financing-plans/${fp2_id}/payments"
              payload: { amount_cents: 10902 }
              as: SalesAssociate
            - call: "POST /financing-plans/${fp2_id}/payments"
              payload: { amount_cents: 10902 }
              as: SalesAssociate
            # ---- O3 lease-to-own ----
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", delivery_tier: "THRESHOLD" }
              as: SalesAssociate
              captures: { o3_id: $.data.id }
            - call: "POST /order-lines"
              payload: { order_id: "${o3_id}", product_id: "${sofa_id}", fabric_code: "STANDARD", size_code: "STD", quantity: 1 }
              as: SalesAssociate
            - call: "GET /orders/${o3_id}"
              as: SalesAssociate
              captures: { o3_v: $.data.version }
            - call: "POST /financing-plans"
              payload: { order_id: "${o3_id}", plan_type: "LEASE_TO_OWN", term_months: 12, expected_order_version: "${o3_v}" }
              as: SalesAssociate
              captures: { fp3_id: $.data.id }
            - call: "POST /financing-plans/${fp3_id}/approve"
              as: StoreManager
            - call: "POST /financing-plans/${fp3_id}/payments"
              payload: { amount_cents: 12654 }
              as: SalesAssociate
            - call: "POST /financing-plans/${fp3_id}/payments"
              payload: { amount_cents: 12654 }
              as: SalesAssociate
            - call: "POST /financing-plans/${fp3_id}/payments"
              payload: { amount_cents: 12654 }
              as: SalesAssociate
          trigger:
            - call: "GET /financing-plans/${fp2_id}"
              as: SalesAssociate
              captures: { payoff_installment: $.data.payoff_balance_cents }
            - call: "GET /financing-plans/${fp3_id}"
              as: SalesAssociate
              captures: { payoff_lease: $.data.payoff_balance_cents }
          assert:
            - "FinancingPlan.${fp2_id}.payoff_balance_cents == 90026"
            - "FinancingPlan.${fp3_id}.payoff_balance_cents == 113881"
            - "FinancingPlan.${fp3_id}.payoff_balance_cents - FinancingPlan.${fp2_id}.payoff_balance_cents == 23855"

      - name: return_refund_damaged_zero_restock_vs_changed_mind_restock
        grounds:
          - calculations.return_refund
          - entities.ReturnRequest.fields.restocking_fee_cents
          - entities.ReturnRequest.fields.refund_amount_cents
          - state_machines.ReturnRequest.REQUESTED_to_APPROVED
        distinguishing_aspect: |
          On the ReturnRequest domain, identical line_total 100000: a DAMAGED return refunds
          the full 100000 with restocking_fee 0, while a CHANGED_MIND return withholds a 15000
          restocking fee and refunds 85000 — the two valid refund treatments diverge by 15000.
        test_recipe:
          setup:
            - "Two delivered order lines, each line_total 100000 (sofa STANDARD qty1), on two delivered orders within the return window."
            - "One return reason DAMAGED, the other CHANGED_MIND; both APPROVED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T09:00:00Z" }
              as: StoreManager
            - call: "POST /products"
              payload: { sku: "SOFA-STD", name: "Aspen Sofa", category: "SOFA", base_price_cents: 100000, available_fabrics: [{ code: "STANDARD", surcharge_cents: 0 }], available_sizes: [{ code: "STD", surcharge_cents: 0 }] }
              as: StoreManager
              captures: { sofa_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Ben Buyer", email: "ben@x.com", credit_score: 700, monthly_income_cents: 9000000, existing_monthly_obligations_cents: 0 }
              as: SalesAssociate
              captures: { cust_id: $.data.id }
            - call: "POST /delivery-routes"
              payload: { region_code: "NORTH", service_date: "2026-03-01T00:00:00Z", shift_start_minute: 480, shift_end_minute: 1080, capacity_units: 5 }
              as: DeliveryDispatcher
              captures: { route_id: $.data.id, route_v: $.data.version }
            # ---- O-A delivered, DAMAGED ----
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", delivery_tier: "THRESHOLD" }
              as: SalesAssociate
              captures: { oa_id: $.data.id }
            - call: "POST /order-lines"
              payload: { order_id: "${oa_id}", product_id: "${sofa_id}", fabric_code: "STANDARD", size_code: "STD", quantity: 1 }
              as: SalesAssociate
              captures: { line_a_id: $.data.id }
            - call: "POST /orders/${oa_id}/pay-in-full"
              as: SalesAssociate
            - call: "POST /orders/${oa_id}/confirm"
              as: SalesAssociate
            - call: "POST /delivery-stops"
              payload: { route_id: "${route_id}", order_id: "${oa_id}", window_start_minute: 600, window_end_minute: 660, expected_route_version: "${route_v}" }
              as: DeliveryDispatcher
              captures: { stop_a_id: $.data.id, route_v2: $.data.version }
            # ---- O-B delivered, CHANGED_MIND ----
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", delivery_tier: "THRESHOLD" }
              as: SalesAssociate
              captures: { ob_id: $.data.id }
            - call: "POST /order-lines"
              payload: { order_id: "${ob_id}", product_id: "${sofa_id}", fabric_code: "STANDARD", size_code: "STD", quantity: 1 }
              as: SalesAssociate
              captures: { line_b_id: $.data.id }
            - call: "POST /orders/${ob_id}/pay-in-full"
              as: SalesAssociate
            - call: "POST /orders/${ob_id}/confirm"
              as: SalesAssociate
            - call: "POST /delivery-stops"
              payload: { route_id: "${route_id}", order_id: "${ob_id}", window_start_minute: 700, window_end_minute: 760, expected_route_version: "${route_v2}" }
              as: DeliveryDispatcher
              captures: { stop_b_id: $.data.id }
            # ---- lock, dispatch, complete both stops -> orders DELIVERED ----
            - call: "POST /delivery-routes/${route_id}/lock"
              as: DeliveryDispatcher
            - call: "POST /delivery-stops/${stop_a_id}/dispatch"
              as: DeliveryDispatcher
            - call: "POST /delivery-stops/${stop_a_id}/complete"
              as: DeliveryDispatcher
            - call: "POST /delivery-stops/${stop_b_id}/dispatch"
              as: DeliveryDispatcher
            - call: "POST /delivery-stops/${stop_b_id}/complete"
              as: DeliveryDispatcher
            # ---- file both returns (within window) ----
            - call: "POST /return-requests"
              payload: { order_line_id: "${line_a_id}", reason: "DAMAGED" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ret_a_id: $.data.id }
            - call: "POST /return-requests"
              payload: { order_line_id: "${line_b_id}", reason: "CHANGED_MIND" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ret_b_id: $.data.id }
          trigger:
            - call: "POST /return-requests/${ret_a_id}/approve"
              as: StoreManager
            - call: "POST /return-requests/${ret_b_id}/approve"
              as: StoreManager
          assert:
            - "ReturnRequest.${ret_a_id}.restocking_fee_cents == 0"
            - "ReturnRequest.${ret_a_id}.refund_amount_cents == 100000"
            - "ReturnRequest.${ret_b_id}.restocking_fee_cents == 15000"
            - "ReturnRequest.${ret_b_id}.refund_amount_cents == 85000"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: financing_monthly_payment_branch_and_ceil_nonlinear
        grounds:
          - calculations.financing_monthly_payment
          - entities.FinancingPlan.fields.monthly_payment_cents
          - entities.FinancingPlan.fields.total_of_payments_cents
          - state_machines.FinancingPlan.PENDING_APPROVAL_to_CURRENT
        distinguishing_aspect: |
          Mode (a) non-linear: monthly_payment depends on three inputs (principal 116802,
          plan_type branch, term 12) combined through a conditional branch (add-on interest
          vs flat markup) then an integer ceil — installment yields 10902, lease yields 12654.
        test_recipe:
          setup:
            - "An order O2 settled by an approved INSTALLMENT plan (principal 116802, term 12)."
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "SOFA-STD", name: "Aspen Sofa", category: "SOFA", base_price_cents: 100000, available_fabrics: [{ code: "STANDARD", surcharge_cents: 0 }], available_sizes: [{ code: "STD", surcharge_cents: 0 }] }
              as: StoreManager
              captures: { sofa_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Cara Buyer", email: "cara@x.com", credit_score: 750, monthly_income_cents: 9000000, existing_monthly_obligations_cents: 0 }
              as: SalesAssociate
              captures: { cust_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", delivery_tier: "THRESHOLD" }
              as: SalesAssociate
              captures: { o2_id: $.data.id }
            - call: "POST /order-lines"
              payload: { order_id: "${o2_id}", product_id: "${sofa_id}", fabric_code: "STANDARD", size_code: "STD", quantity: 1 }
              as: SalesAssociate
            - call: "GET /orders/${o2_id}"
              as: SalesAssociate
              captures: { o2_v: $.data.version }
            - call: "POST /financing-plans"
              payload: { order_id: "${o2_id}", plan_type: "INSTALLMENT", term_months: 12, expected_order_version: "${o2_v}" }
              as: SalesAssociate
              captures: { fp2_id: $.data.id }
          trigger:
            - call: "POST /financing-plans/${fp2_id}/approve"
              as: StoreManager
              captures: { monthly: $.data.monthly_payment_cents, top: $.data.total_of_payments_cents }
          assert:
            - "FinancingPlan.${fp2_id}.total_of_payments_cents == 130818"
            - "FinancingPlan.${fp2_id}.monthly_payment_cents == 10902"
            - "FinancingPlan.${fp2_id}.financed_principal_cents == 116802"

      - name: order_grand_total_sum_then_round_tax_order
        grounds:
          - calculations.order_grand_total
          - calculations.order_merchandise_subtotal
          - calculations.order_service_total
          - entities.Order.fields.order_total_cents
          - state_machines.Order.DRAFT_to_CONFIRMED
        distinguishing_aspect: |
          Mode (b) nested-rounding order: tax is computed ONCE on the combined taxable base
          (merchandise 120000 + service 24800 = 144800) → tax 11946 → total 156746; rounding
          per-component (merch tax 9900 + service tax 2046 = 11946 here, but the pinned single
          rounding is the authority) — the scaffold pins sum-then-round, asserting 156746.
        test_recipe:
          setup:
            - "A DRAFT order O1 with one VELVET sofa line (line_total 120000), WHITE_GLOVE tier, assembly add-on (4900)."
            - "Order settled by pay-in-full so it can be confirmed."
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "SOFA-STD", name: "Aspen Sofa", category: "SOFA", base_price_cents: 100000, available_fabrics: [{ code: "STANDARD", surcharge_cents: 0 }, { code: "VELVET", surcharge_cents: 20000 }], available_sizes: [{ code: "STD", surcharge_cents: 0 }] }
              as: StoreManager
              captures: { sofa_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Dan Buyer", email: "dan@x.com", credit_score: 700, monthly_income_cents: 9000000, existing_monthly_obligations_cents: 0 }
              as: SalesAssociate
              captures: { cust_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", delivery_tier: "WHITE_GLOVE" }
              as: SalesAssociate
              captures: { o1_id: $.data.id }
            - call: "POST /order-lines"
              payload: { order_id: "${o1_id}", product_id: "${sofa_id}", fabric_code: "VELVET", size_code: "STD", quantity: 1, add_assembly: true }
              as: SalesAssociate
            - call: "POST /orders/${o1_id}/pay-in-full"
              as: SalesAssociate
          trigger:
            - call: "POST /orders/${o1_id}/confirm"
              as: SalesAssociate
              captures: { total: $.data.order_total_cents, merch: $.data.merchandise_subtotal_cents, svc: $.data.service_total_cents }
          assert:
            - "Order.${o1_id}.merchandise_subtotal_cents == 120000"
            - "Order.${o1_id}.service_total_cents == 24800"
            - "Order.${o1_id}.order_total_cents == 156746"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: financing_plan_cyclic_current_pastdue_current
        grounds:
          - state_machines.FinancingPlan.CURRENT_to_PAST_DUE
          - state_machines.FinancingPlan.PAST_DUE_to_CURRENT
          - entities.FinancingPlan.fields.status
        distinguishing_aspect: |
          FinancingPlan is cyclic: CURRENT → PAST_DUE (mark-past-due) → CURRENT (catch-up
          payment), returning to the same node — a loop no linear pipeline allows.
        test_recipe:
          setup:
            - "An approved INSTALLMENT plan (monthly 10902, term 12); clock advanced 2 months with only 1 payment posted, so a period is owed."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: StoreManager
            - call: "POST /products"
              payload: { sku: "SOFA-STD", name: "Aspen Sofa", category: "SOFA", base_price_cents: 100000, available_fabrics: [{ code: "STANDARD", surcharge_cents: 0 }], available_sizes: [{ code: "STD", surcharge_cents: 0 }] }
              as: StoreManager
              captures: { sofa_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Eve Buyer", email: "eve@x.com", credit_score: 760, monthly_income_cents: 9000000, existing_monthly_obligations_cents: 0 }
              as: SalesAssociate
              captures: { cust_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", delivery_tier: "THRESHOLD" }
              as: SalesAssociate
              captures: { o2_id: $.data.id }
            - call: "POST /order-lines"
              payload: { order_id: "${o2_id}", product_id: "${sofa_id}", fabric_code: "STANDARD", size_code: "STD", quantity: 1 }
              as: SalesAssociate
            - call: "GET /orders/${o2_id}"
              as: SalesAssociate
              captures: { o2_v: $.data.version }
            - call: "POST /financing-plans"
              payload: { order_id: "${o2_id}", plan_type: "INSTALLMENT", term_months: 12, expected_order_version: "${o2_v}" }
              as: SalesAssociate
              captures: { fp2_id: $.data.id }
            - call: "POST /financing-plans/${fp2_id}/approve"
              as: StoreManager
            - call: "POST /financing-plans/${fp2_id}/payments"
              payload: { amount_cents: 10902 }
              as: SalesAssociate
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-02T00:00:00Z" }
              as: StoreManager
            - call: "POST /financing-plans/${fp2_id}/mark-past-due"
              as: StoreManager
          trigger:
            - call: "POST /financing-plans/${fp2_id}/payments"
              payload: { amount_cents: 10902 }
              as: SalesAssociate
            - call: "GET /financing-plans/${fp2_id}"
              as: SalesAssociate
              captures: { st: $.data.status }
          assert:
            - "FinancingPlan.${fp2_id}.status == CURRENT"
            - "FinancingPlan.${fp2_id}.payments_made_count == 2"
            - "FinancingPlan.${fp2_id}.paid_to_date_cents == 21804"

      - name: order_parallel_payment_and_fulfillment_axes
        grounds:
          - state_machines.Order.UNPAID_to_PAID_IN_FULL
          - state_machines.Order.DRAFT_to_CONFIRMED
          - entities.Order.fields.payment_status
          - entities.Order.fields.fulfillment_status
        distinguishing_aspect: |
          Order carries two independent state axes: pay-in-full moves payment_status
          UNPAID→PAID_IN_FULL while fulfillment_status stays DRAFT; confirm then moves
          fulfillment_status DRAFT→CONFIRMED while payment_status stays PAID_IN_FULL.
        test_recipe:
          setup:
            - "A DRAFT/UNPAID order with one ACTIVE line."
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "SOFA-STD", name: "Aspen Sofa", category: "SOFA", base_price_cents: 100000, available_fabrics: [{ code: "STANDARD", surcharge_cents: 0 }], available_sizes: [{ code: "STD", surcharge_cents: 0 }] }
              as: StoreManager
              captures: { sofa_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Finn Buyer", email: "finn@x.com", credit_score: 700, monthly_income_cents: 9000000, existing_monthly_obligations_cents: 0 }
              as: SalesAssociate
              captures: { cust_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", delivery_tier: "THRESHOLD" }
              as: SalesAssociate
              captures: { o_id: $.data.id }
            - call: "POST /order-lines"
              payload: { order_id: "${o_id}", product_id: "${sofa_id}", fabric_code: "STANDARD", size_code: "STD", quantity: 1 }
              as: SalesAssociate
          trigger:
            - call: "POST /orders/${o_id}/pay-in-full"
              as: SalesAssociate
              captures: { pay_after: $.data.fulfillment_status }
            - call: "POST /orders/${o_id}/confirm"
              as: SalesAssociate
              captures: { pmt_after: $.data.payment_status }
          assert:
            - "After pay-in-full: Order.${o_id}.payment_status == PAID_IN_FULL AND Order.${o_id}.fulfillment_status == DRAFT"
            - "After confirm: Order.${o_id}.fulfillment_status == CONFIRMED AND Order.${o_id}.payment_status == PAID_IN_FULL"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: refund_cascades_line_returned_then_protection_voided_depth3
        grounds:
          - state_machines.ReturnRequest.APPROVED_to_REFUNDED
          - state_machines.OrderLine.ACTIVE_to_RETURNED
          - state_machines.ProtectionPlan.ACTIVE_to_VOIDED
          - entities.Order.fields.amount_refunded_cents
        distinguishing_aspect: |
          Depth-3 transitive chain originating from refund: refund(ReturnRequest) → the covered
          OrderLine flips ACTIVE→RETURNED → that line's ProtectionPlan flips ACTIVE→VOIDED; the
          protection void is caused by the line change, not directly by the refund call.
        test_recipe:
          setup:
            - "A delivered line (line_total 100000) with an ACTIVE PREMIUM 3yr ProtectionPlan (premium 19500) and an APPROVED CHANGED_MIND return (refund 85000)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T09:00:00Z" }
              as: StoreManager
            - call: "POST /products"
              payload: { sku: "SOFA-STD", name: "Aspen Sofa", category: "SOFA", base_price_cents: 100000, available_fabrics: [{ code: "STANDARD", surcharge_cents: 0 }], available_sizes: [{ code: "STD", surcharge_cents: 0 }], protection_eligible: true }
              as: StoreManager
              captures: { sofa_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Gita Buyer", email: "gita@x.com", credit_score: 700, monthly_income_cents: 9000000, existing_monthly_obligations_cents: 0 }
              as: SalesAssociate
              captures: { cust_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", delivery_tier: "THRESHOLD" }
              as: SalesAssociate
              captures: { o_id: $.data.id }
            - call: "POST /order-lines"
              payload: { order_id: "${o_id}", product_id: "${sofa_id}", fabric_code: "STANDARD", size_code: "STD", quantity: 1 }
              as: SalesAssociate
              captures: { line_id: $.data.id }
            - call: "POST /protection-plans"
              payload: { order_line_id: "${line_id}", tier: "PREMIUM", coverage_years: 3 }
              as: SalesAssociate
              captures: { pp_id: $.data.id }
            - call: "POST /orders/${o_id}/pay-in-full"
              as: SalesAssociate
            - call: "POST /orders/${o_id}/confirm"
              as: SalesAssociate
            - call: "POST /delivery-routes"
              payload: { region_code: "NORTH", service_date: "2026-03-01T00:00:00Z", shift_start_minute: 480, shift_end_minute: 1080, capacity_units: 5 }
              as: DeliveryDispatcher
              captures: { route_id: $.data.id, route_v: $.data.version }
            - call: "POST /delivery-stops"
              payload: { route_id: "${route_id}", order_id: "${o_id}", window_start_minute: 600, window_end_minute: 660, expected_route_version: "${route_v}" }
              as: DeliveryDispatcher
              captures: { stop_id: $.data.id }
            - call: "POST /delivery-routes/${route_id}/lock"
              as: DeliveryDispatcher
            - call: "POST /delivery-stops/${stop_id}/dispatch"
              as: DeliveryDispatcher
            - call: "POST /delivery-stops/${stop_id}/complete"
              as: DeliveryDispatcher
            - call: "POST /return-requests"
              payload: { order_line_id: "${line_id}", reason: "CHANGED_MIND" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ret_id: $.data.id }
            - call: "POST /return-requests/${ret_id}/approve"
              as: StoreManager
          trigger:
            - call: "POST /return-requests/${ret_id}/refund"
              as: StoreManager
