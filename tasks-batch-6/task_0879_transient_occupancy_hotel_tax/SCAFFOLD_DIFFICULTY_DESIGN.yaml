# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Transient-Occupancy / Hotel-Tax Administration — Expert
# Logical-clock startup default: 2026-05-01T00:00:00Z
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: tax_recompute_standard_vs_audit
        grounds:
          - calculations.tax_due_computation
          - entities.Assessment.fields.deficiency_cents
          - state_machines.Audit.FIELDWORK_to_PROPOSED
        distinguishing_aspect: >
          STANDARD honors all CLAIMED exemptions (self-report) while AUDIT honors only VERIFIED
          exemptions; identical receipts yield TaxReturn.tax_due_cents=840000 vs
          Assessment.assessed_tax_cents=960000 — dual variant on the tax-accounting domain.
        test_recipe:
          setup:
            - "Active operator in a 12% jurisdiction with one property"
            - "DRAFT return period 2026-04, single line gross 10,000,000; GOV exemption 2,000,000 VERIFIED; LONG_TERM_30DAY exemption 1,000,000 left CLAIMED (stay 29)"
            - "Return FILED on-time (clock 2026-05-01, due 2026-05-31)"
            - "Audit opened for the same period, fieldwork begun, assessment PROPOSED with auditor taxable 8,000,000"
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "City A", tax_rate_bps: 1200 }
              as: TaxAdmin
              captures: { jur: $.data.id }
            - call: "POST /operators"
              payload: { jurisdiction_id: "${jur}", legal_name: "Op One", filing_frequency: "MONTHLY" }
              as: TaxAdmin
              captures: { op: $.data.id }
            - call: "POST /operators/${op}/activate"
              payload: {}
              as: TaxAdmin
            - call: "POST /properties"
              payload: { operator_id: "${op}", name: "P1", address: "1 A St" }
              as: TaxAdmin
              captures: { prop: $.data.id }
            - call: "POST /returns"
              payload: { operator_id: "${op}", period_start: "2026-04-01T00:00:00Z", period_end: "2026-04-30T00:00:00Z", reporting_method: "NET", line_items: [ { property_id: "${prop}", gross_receipts_cents: 10000000 } ] }
              as: TaxAdmin
              captures: { ret: $.data.id }
            - call: "POST /exemptions"
              payload: { tax_return_id: "${ret}", exemption_type: "GOVERNMENT", guest_ref: "G-1", amount_cents: 2000000 }
              as: TaxAdmin
              captures: { ex_gov: $.data.id }
            - call: "POST /exemptions/${ex_gov}/verify"
              payload: {}
              as: TaxAdmin
            - call: "POST /exemptions"
              payload: { tax_return_id: "${ret}", exemption_type: "LONG_TERM_30DAY", guest_ref: "G-2", stay_nights: 29, amount_cents: 1000000 }
              as: TaxAdmin
              captures: { ex_lt: $.data.id }
            - call: "POST /returns/${ret}/file"
              payload: {}
              as: Operator
              as_user_id: "${op}"
              captures: { self_tax: $.data.tax_due_cents }
            - call: "POST /audits"
              payload: { operator_id: "${op}", period_start: "2026-04-01T00:00:00Z", period_end: "2026-04-30T00:00:00Z" }
              as: Auditor
              captures: { aud: $.data.id }
            - call: "POST /audits/${aud}/begin-fieldwork"
              payload: {}
              as: Auditor
          trigger:
            - call: "POST /audits/${aud}/assessments"
              payload: { audited_taxable_cents: 8000000, classification: "NEGLIGENCE" }
              as: Auditor
              captures: { asmt: $.data.id }
          assert:
            - "TaxReturn.${ret}.tax_due_cents == 840000"
            - "Assessment.${asmt}.assessed_tax_cents == 960000"
            - "Assessment.${asmt}.self_reported_tax_cents == 840000"
            - "Assessment.${asmt}.deficiency_cents == 120000"

      - name: refund_interest_statutory_vs_audit
        grounds:
          - calculations.refund_interest_accrual
          - entities.RefundClaim.fields.interest_cents
          - state_machines.RefundClaim.REQUESTED_to_APPROVED
        distinguishing_aspect: >
          For identical principal 50,000 the OVERPAYMENT variant anchors interest at overpayment_date
          (6 months -> 1500) while AUDIT_ADJUSTMENT anchors at claim created_at (2 months -> 500) —
          dual variant on the refund domain, distinct from the tax-accounting variant.
        test_recipe:
          setup:
            - "Active operator holding a 60,000 overpayment credit (filed return tax 120,000 fully paid, then amended down to tax 60,000 -> account_balance -60,000)"
            - "Two refund claims of principal 50,000: reason OVERPAYMENT (overpayment_date 2026-02-01) and reason AUDIT_ADJUSTMENT (created at clock 2026-06-01)"
            - "Clock advanced to 2026-08-01, both claims APPROVED"
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "City B", tax_rate_bps: 1200 }
              as: TaxAdmin
              captures: { jur: $.data.id }
            - call: "POST /operators"
              payload: { jurisdiction_id: "${jur}", legal_name: "Op Two", filing_frequency: "MONTHLY" }
              as: TaxAdmin
              captures: { op: $.data.id }
            - call: "POST /operators/${op}/activate"
              payload: {}
              as: TaxAdmin
            - call: "POST /properties"
              payload: { operator_id: "${op}", name: "P1", address: "2 B St" }
              as: TaxAdmin
              captures: { prop: $.data.id }
            - call: "POST /returns"
              payload: { operator_id: "${op}", period_start: "2026-04-01T00:00:00Z", period_end: "2026-04-30T00:00:00Z", line_items: [ { property_id: "${prop}", gross_receipts_cents: 1000000 } ] }
              as: TaxAdmin
              captures: { ret: $.data.id }
            - call: "POST /returns/${ret}/file"
              payload: {}
              as: Operator
              as_user_id: "${op}"
            - call: "POST /remittances"
              payload: { tax_return_id: "${ret}", remitter: "OPERATOR", amount_cents: 120000 }
              as: TaxAdmin
              captures: { rem: $.data.id }
            - call: "POST /remittances/${rem}/clear"
              payload: {}
              as: TaxAdmin
            - call: "POST /returns/${ret}/amend"
              payload: { line_items: [ { property_id: "${prop}", gross_receipts_cents: 500000 } ] }
              as: Operator
              as_user_id: "${op}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: TaxAdmin
            - call: "POST /refund-claims"
              payload: { operator_id: "${op}", reason: "OVERPAYMENT", principal_cents: 50000, overpayment_date: "2026-02-01T00:00:00Z" }
              as: TaxAdmin
              captures: { rc_over: $.data.id }
            - call: "POST /refund-claims"
              payload: { operator_id: "${op}", reason: "AUDIT_ADJUSTMENT", principal_cents: 50000, overpayment_date: "2026-06-01T00:00:00Z" }
              as: TaxAdmin
              captures: { rc_audit: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: TaxAdmin
          trigger:
            - call: "POST /refund-claims/${rc_over}/approve"
              payload: {}
              as: TaxAdmin
            - call: "POST /refund-claims/${rc_audit}/approve"
              payload: {}
              as: TaxAdmin
          assert:
            - "RefundClaim.${rc_over}.interest_cents == 1500"
            - "RefundClaim.${rc_over}.total_refund_cents == 51500"
            - "RefundClaim.${rc_audit}.interest_cents == 500"
            - "RefundClaim.${rc_audit}.total_refund_cents == 50500"

  - rule_id: combinatorial_formula
    instances:
      - name: penalty_interest_time_tiered
        grounds:
          - calculations.penalty_interest_computation
          - state_machines.TaxReturn.DRAFT_to_FILED
          - entities.TaxReturn.fields.penalty_cents
        distinguishing_aspect: >
          Mode (a): penalty_rate = min(0.25, 0.10 + 0.05*(months_late-1)) is a nested min/max over
          {deficiency, months_late, rate constants}; at 3 months late on 120,000 tax it yields
          penalty 24000 and interest 3600, total_due 147600 (non-linear tier selection).
        test_recipe:
          setup:
            - "Active operator; DRAFT return period 2026-01 (due 2026-02-28), single line gross 1,000,000, no exemptions"
            - "Clock at 2026-05-30 (3 whole months past due) before filing"
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "City C", tax_rate_bps: 1200, interest_rate_monthly_bps: 100 }
              as: TaxAdmin
              captures: { jur: $.data.id }
            - call: "POST /operators"
              payload: { jurisdiction_id: "${jur}", legal_name: "Op Three", filing_frequency: "MONTHLY" }
              as: TaxAdmin
              captures: { op: $.data.id }
            - call: "POST /operators/${op}/activate"
              payload: {}
              as: TaxAdmin
            - call: "POST /properties"
              payload: { operator_id: "${op}", name: "P1", address: "3 C St" }
              as: TaxAdmin
              captures: { prop: $.data.id }
            - call: "POST /returns"
              payload: { operator_id: "${op}", period_start: "2026-01-01T00:00:00Z", period_end: "2026-01-31T00:00:00Z", line_items: [ { property_id: "${prop}", gross_receipts_cents: 1000000 } ] }
              as: TaxAdmin
              captures: { ret: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-30T00:00:00Z" }
              as: TaxAdmin
          trigger:
            - call: "POST /returns/${ret}/file"
              payload: {}
              as: Operator
              as_user_id: "${op}"
          assert:
            - "TaxReturn.${ret}.tax_due_cents == 120000"
            - "TaxReturn.${ret}.penalty_cents == 24000"
            - "TaxReturn.${ret}.interest_cents == 3600"
            - "TaxReturn.${ret}.total_due_cents == 147600"

      - name: tax_rounding_per_line_then_sum
        grounds:
          - calculations.tax_due_computation
          - state_machines.TaxReturn.DRAFT_to_FILED
          - entities.TaxReturn.fields.tax_due_cents
        distinguishing_aspect: >
          Mode (b): three lines of taxable 1005 at 12% — round-per-line-then-sum yields
          121*3 = 363, whereas sum-then-round yields round(361.8)=362; the scaffold pins per-line
          rounding so tax_due_cents == 363.
        test_recipe:
          setup:
            - "Active operator with three properties"
            - "DRAFT return period 2026-04 with three lines, each gross 1005, no exemptions; filed on-time (clock 2026-05-01)"
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "City D", tax_rate_bps: 1200 }
              as: TaxAdmin
              captures: { jur: $.data.id }
            - call: "POST /operators"
              payload: { jurisdiction_id: "${jur}", legal_name: "Op Four", filing_frequency: "MONTHLY" }
              as: TaxAdmin
              captures: { op: $.data.id }
            - call: "POST /operators/${op}/activate"
              payload: {}
              as: TaxAdmin
            - call: "POST /properties"
              payload: { operator_id: "${op}", name: "PA", address: "4 D St" }
              as: TaxAdmin
              captures: { pa: $.data.id }
            - call: "POST /properties"
              payload: { operator_id: "${op}", name: "PB", address: "5 D St" }
              as: TaxAdmin
              captures: { pb: $.data.id }
            - call: "POST /properties"
              payload: { operator_id: "${op}", name: "PC", address: "6 D St" }
              as: TaxAdmin
              captures: { pc: $.data.id }
            - call: "POST /returns"
              payload: { operator_id: "${op}", period_start: "2026-04-01T00:00:00Z", period_end: "2026-04-30T00:00:00Z", line_items: [ { property_id: "${pa}", gross_receipts_cents: 1005 }, { property_id: "${pb}", gross_receipts_cents: 1005 }, { property_id: "${pc}", gross_receipts_cents: 1005 } ] }
              as: TaxAdmin
              captures: { ret: $.data.id }
          trigger:
            - call: "POST /returns/${ret}/file"
              payload: {}
              as: Operator
              as_user_id: "${op}"
          assert:
            - "TaxReturn.${ret}.gross_receipts_cents == 3015"
            - "TaxReturn.${ret}.tax_due_cents == 363"

  - rule_id: non_linear_state_machine
    instances:
      - name: audit_cyclic_reopen_fieldwork
        grounds:
          - state_machines.Audit.FIELDWORK_to_PROPOSED
          - state_machines.Audit.RESPONSE_to_FIELDWORK
          - state_machines.Assessment.PROPOSED_to_ABATED
        distinguishing_aspect: >
          Audit cycles FIELDWORK -> PROPOSED -> RESPONSE -> FIELDWORK (a genuine A->..->A loop),
          abandoning the PROPOSED assessment to ABATED on re-entry — cyclic shape on the Audit entity.
        test_recipe:
          setup:
            - "Active operator with a FILED return in period 2026-04"
            - "Audit OPENED -> FIELDWORK -> PROPOSED (assessment created) -> RESPONSE"
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "City E", tax_rate_bps: 1200 }
              as: TaxAdmin
              captures: { jur: $.data.id }
            - call: "POST /operators"
              payload: { jurisdiction_id: "${jur}", legal_name: "Op Five", filing_frequency: "MONTHLY" }
              as: TaxAdmin
              captures: { op: $.data.id }
            - call: "POST /operators/${op}/activate"
              payload: {}
              as: TaxAdmin
            - call: "POST /properties"
              payload: { operator_id: "${op}", name: "P1", address: "7 E St" }
              as: TaxAdmin
              captures: { prop: $.data.id }
            - call: "POST /returns"
              payload: { operator_id: "${op}", period_start: "2026-04-01T00:00:00Z", period_end: "2026-04-30T00:00:00Z", line_items: [ { property_id: "${prop}", gross_receipts_cents: 1000000 } ] }
              as: TaxAdmin
              captures: { ret: $.data.id }
            - call: "POST /returns/${ret}/file"
              payload: {}
              as: Operator
              as_user_id: "${op}"
            - call: "POST /audits"
              payload: { operator_id: "${op}", period_start: "2026-04-01T00:00:00Z", period_end: "2026-04-30T00:00:00Z" }
              as: Auditor
              captures: { aud: $.data.id }
            - call: "POST /audits/${aud}/begin-fieldwork"
              payload: {}
              as: Auditor
            - call: "POST /audits/${aud}/assessments"
              payload: { audited_taxable_cents: 2000000, classification: "NEGLIGENCE" }
              as: Auditor
              captures: { asmt: $.data.id }
            - call: "POST /audits/${aud}/record-response"
              payload: {}
              as: Auditor
          trigger:
            - call: "POST /audits/${aud}/reopen-fieldwork"
              payload: {}
              as: Auditor
          assert:
            - "Audit.${aud}.status == FIELDWORK"
            - "Assessment.${asmt}.status == ABATED"

      - name: return_parallel_filing_and_settlement_axes
        grounds:
          - state_machines.TaxReturn.UNPAID_to_PARTIAL
          - state_machines.TaxReturn.FILED_to_AMENDED
          - entities.TaxReturn.fields.settlement_status
        distinguishing_aspect: >
          filing_status (FILED -> AMENDED) and settlement_status (UNPAID -> PARTIAL) evolve
          independently on the same TaxReturn row: amending does not reset the parallel settlement axis.
        test_recipe:
          setup:
            - "Active operator; FILED return period 2026-04, tax_due 120,000; one CLEARED remittance of 50,000 -> settlement PARTIAL"
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "City F", tax_rate_bps: 1200 }
              as: TaxAdmin
              captures: { jur: $.data.id }
            - call: "POST /operators"
              payload: { jurisdiction_id: "${jur}", legal_name: "Op Six", filing_frequency: "MONTHLY" }
              as: TaxAdmin
              captures: { op: $.data.id }
            - call: "POST /operators/${op}/activate"
              payload: {}
              as: TaxAdmin
            - call: "POST /properties"
              payload: { operator_id: "${op}", name: "P1", address: "8 F St" }
              as: TaxAdmin
              captures: { prop: $.data.id }
            - call: "POST /returns"
              payload: { operator_id: "${op}", period_start: "2026-04-01T00:00:00Z", period_end: "2026-04-30T00:00:00Z", line_items: [ { property_id: "${prop}", gross_receipts_cents: 1000000 } ] }
              as: TaxAdmin
              captures: { ret: $.data.id }
            - call: "POST /returns/${ret}/file"
              payload: {}
              as: Operator
              as_user_id: "${op}"
            - call: "POST /remittances"
              payload: { tax_return_id: "${ret}", remitter: "OPERATOR", amount_cents: 50000 }
              as: TaxAdmin
              captures: { rem: $.data.id }
            - call: "POST /remittances/${rem}/clear"
              payload: {}
              as: TaxAdmin
          trigger:
            - call: "POST /returns/${ret}/amend"
              payload: { line_items: [ { property_id: "${prop}", gross_receipts_cents: 1000000 } ] }
              as: Operator
              as_user_id: "${op}"
          assert:
            - "TaxReturn.${ret}.filing_status == AMENDED"
            - "TaxReturn.${ret}.settlement_status == PARTIAL"
            - "TaxReturn.${ret}.amount_paid_cents == 50000"

  - rule_id: transitive_cascade
    instances:
      - name: assessment_issue_to_delinquent_cascade
        grounds:
          - state_machines.Assessment.PROPOSED_to_ISSUED
          - state_machines.Operator.ACTIVE_to_DELINQUENT
          - entities.Operator.fields.account_balance_cents
          - entities.LedgerEntry.fields.entry_type
        distinguishing_aspect: >
          Depth-3 chain from assessment issuance: issue -> ASSESSMENT LedgerEntry (+660000) ->
          Operator.account_balance recomputed to 660000 -> Operator.status flips ACTIVE->DELINQUENT;
          each hop is caused strictly by the previous one.
        test_recipe:
          setup:
            - "Active operator; return period 2026-04 gross 1,000,000 FILED on-time and fully paid (balance 0)"
            - "Audit OPENED -> FIELDWORK -> PROPOSED with auditor taxable 6,000,000, classification NEGLIGENCE (deficiency 600,000, penalty 60,000, interest 0 -> total_assessed 660,000)"
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "City G", tax_rate_bps: 1200, lien_threshold_cents: 500000 }
              as: TaxAdmin
              captures: { jur: $.data.id }
            - call: "POST /operators"
              payload: { jurisdiction_id: "${jur}", legal_name: "Op Seven", filing_frequency: "MONTHLY" }
              as: TaxAdmin
              captures: { op: $.data.id }
            - call: "POST /operators/${op}/activate"
              payload: {}
              as: TaxAdmin
            - call: "POST /properties"
              payload: { operator_id: "${op}", name: "P1", address: "9 G St" }
              as: TaxAdmin
              captures: { prop: $.data.id }
            - call: "POST /returns"
              payload: { operator_id: "${op}", period_start: "2026-04-01T00:00:00Z", period_end: "2026-04-30T00:00:00Z", line_items: [ { property_id: "${prop}", gross_receipts_cents: 1000000 } ] }
              as: TaxAdmin
              captures: { ret: $.data.id }
            - call: "POST /returns/${ret}/file"
              payload: {}
              as: Operator
              as_user_id: "${op}"
            - call: "POST /remittances"
              payload: { tax_return_id: "${ret}", remitter: "OPERATOR", amount_cents: 120000 }
              as: TaxAdmin
              captures: { rem: $.data.id }
            - call: "POST /remittances/${rem}/clear"
              payload: {}
              as: TaxAdmin
            - call: "POST /audits"
              payload: { operator_id: "${op}", period_start: "2026-04-01T00:00:00Z", period_end: "2026-04-30T00:00:00Z" }
              as: Auditor
              captures: { aud: $.data.id }
            - call: "POST /audits/${aud}/begin-fieldwork"
              payload: {}
              as: Auditor
            - call: "POST /audits/${aud}/assessments"
              payload: { audited_taxable_cents: 6000000, classification: "NEGLIGENCE" }
              as: Auditor
              captures: { asmt: $.data.id }
          trigger:
            - call: "POST /assessments/${asmt}/issue"
              payload: {}
              as: TaxAdmin
          assert:
            - "Assessment.${asmt}.total_assessed_cents == 660000"
            - "Operator.${op}.account_balance_cents == 660000"
            - "Operator.${op}.status == DELINQUENT"

      - name: remittance_clear_settles_and_releases_lien
        grounds:
          - state_machines.Remittance.RECEIVED_to_CLEARED
          - state_machines.Operator.DELINQUENT_to_ACTIVE
          - state_machines.Lien.RECORDED_to_RELEASED
          - entities.Operator.fields.account_balance_cents
        distinguishing_aspect: >
          Depth-4 chain from a different trigger (remittance clear): clear -> REMITTANCE LedgerEntry
          (-600000) -> balance recomputed to 0 -> Operator DELINQUENT->ACTIVE -> RECORDED Lien -> RELEASED.
        test_recipe:
          setup:
            - "Active operator; past-due FILED return period 2026-01 gross 5,000,000 (tax 600,000, filed at clock 2026-03-15 -> 0 months late, balance 600,000, operator DELINQUENT)"
            - "A Lien RECORDED against the operator (balance 600,000 > threshold 500,000)"
            - "A RECEIVED remittance of 600,000 on the return"
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "City H", tax_rate_bps: 1200, lien_threshold_cents: 500000 }
              as: TaxAdmin
              captures: { jur: $.data.id }
            - call: "POST /operators"
              payload: { jurisdiction_id: "${jur}", legal_name: "Op Eight", filing_frequency: "MONTHLY" }
              as: TaxAdmin
              captures: { op: $.data.id }
            - call: "POST /operators/${op}/activate"
              payload: {}
              as: TaxAdmin
            - call: "POST /properties"
              payload: { operator_id: "${op}", name: "P1", address: "10 H St" }
              as: TaxAdmin
              captures: { prop: $.data.id }
            - call: "POST /returns"
              payload: { operator_id: "${op}", period_start: "2026-01-01T00:00:00Z", period_end: "2026-01-31T00:00:00Z", line_items: [ { property_id: "${prop}", gross_receipts_cents: 5000000 } ] }
              as: TaxAdmin
              captures: { ret: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-15T00:00:00Z" }
              as: TaxAdmin
            - call: "POST /returns/${ret}/file"
              payload: {}
              as: Operator
              as_user_id: "${op}"
            - call: "GET /operators/${op}"
              payload: {}
              as: TaxAdmin
              captures: { op_v: $.data.version }
            - call: "POST /operators/${op}/liens"
              payload: { expected_operator_version: "${op_v}" }
              as: TaxAdmin
              captures: { lien: $.data.id }
            - call: "POST /remittances"
              payload: { tax_return_id: "${ret}", remitter: "OPERATOR", amount_cents: 600000 }
              as: TaxAdmin
              captures: { rem: $.data.id }
          trigger:
            - call: "POST /remittances/${rem}/clear"
              payload: {}
              as: TaxAdmin
          assert:
            - "Operator.${op}.account_balance_cents == 0"
            - "Operator.${op}.status == ACTIVE"
            - "Lien.${lien}.status == RELEASED"
            - "TaxReturn.${ret}.settlement_status == PAID"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_fiscal_on_remittance_clear
        grounds:
          - validations[priority=5]
          - validations[priority=11]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_REMITTANCE_EXCEEDS_DUE]
        distinguishing_aspect: >
          A remittance on a DRAFT (unfiled) return with amount far exceeding due violates both the
          state precondition (priority 5) and the fiscal cap (priority 11); the state error wins.
        test_recipe:
          setup:
            - "Active operator; DRAFT return period 2026-04 gross 1,000,000 (never filed, total_due 0)"
            - "A RECEIVED remittance of 999,999,999 against it"
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "City I", tax_rate_bps: 1200 }
              as: TaxAdmin
              captures: { jur: $.data.id }
            - call: "POST /operators"
              payload: { jurisdiction_id: "${jur}", legal_name: "Op Nine", filing_frequency: "MONTHLY" }
              as: TaxAdmin
              captures: { op: $.data.id }
            - call: "POST /operators/${op}/activate"
              payload: {}
