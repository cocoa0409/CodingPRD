            - call: "POST /housing-units"
              payload: { address: "590 Firwood St", bedrooms: 0 }
              as: HousingCoordinator
              captures: { unit1: $.data.id }
            - call: "POST /housing-units"
              payload: { address: "600 Firwood St", bedrooms: 0 }
              as: HousingCoordinator
              captures: { unit2: $.data.id }
            - call: "POST /housing-setups"
              payload: { case_id: "${case_id}", housing_unit_id: "${unit1}", occupancy_start: "2026-08-10", occupancy_end: "2027-02-10" }
              as: HousingCoordinator
          trigger:
            - call: "POST /housing-setups"
              payload: { case_id: "${case_id}", housing_unit_id: "${unit2}", occupancy_start: "2026-08-10", occupancy_end: "2027-02-10" }
              as: HousingCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "error_id == 'ERR_SETUP_ALREADY_EXISTS' with http 409"

      - name: report_period_overlap_and_adjacency
        claim_type: temporal_validation
        grounds:
          - validations[priority=8]
          - errors[ERR_REPORT_PERIOD_OVERLAP]
          - entities.FederalReport.fields.period_start
        distinguishing_aspect: "Report periods are half-open: a new report overlapping an existing one ([2026-12-01, 2027-03-01) vs [2026-10-01, 2027-01-01)) fails with ERR_REPORT_PERIOD_OVERLAP, while a flush-adjacent period starting at the existing period_end (2027-01-01) is accepted."
        test_recipe:
          setup:
            - "Report R1 exists for [2026-10-01, 2027-01-01)"
          setup_api_calls:
            - call: "POST /federal-reports"
              payload: { period_start: "2026-10-01", period_end: "2027-01-01" }
              as: AgencyDirector
              captures: { report1: $.data.id }
          trigger:
            - call: "POST /federal-reports"
              payload: { period_start: "2026-12-01", period_end: "2027-03-01" }
              as: AgencyDirector
              captures: { err: $.data.error_id }
            - call: "POST /federal-reports"
              payload: { period_start: "2027-01-01", period_end: "2027-04-01" }
              as: AgencyDirector
              captures: { report3: $.data.id, report3_status: $.data.status }
          assert:
            - "overlapping period: error_id == 'ERR_REPORT_PERIOD_OVERLAP' with http 409"
            - "adjacent period [2027-01-01, 2027-04-01): created with status 'DRAFT' (half-open periods — period_end is exclusive)"

      - name: report_documentation_gate
        claim_type: conditional_validation
        grounds:
          - state_machines.FederalReport.DRAFT_to_SUBMITTED
          - errors[ERR_REPORT_DOCUMENTATION_INCOMPLETE]
          - entities.CaseNote
        distinguishing_aspect: "Submit is gated on documentation: while an included case has zero CaseNotes the submit fails with ERR_REPORT_DOCUMENTATION_INCOMPLETE (422); after adding one note the identical submit succeeds."
        test_recipe:
          setup:
            - "Case CASE-V18 (household_size 1, no members), READY 0-bedroom housing, arrived 2026-10-05 — no CaseNotes yet"
            - "DRAFT report for [2026-10-01, 2027-01-01) includes the case (cases_arrived_count 1)"
          setup_api_calls:
            - call: "POST /cases"
              payload: { case_number: "CASE-V18", agency_affiliate_code: "AFF-01", household_size: 1, scheduled_arrival_date: "2026-10-05" }
              as: CaseManager
              captures: { case_id: $.data.id }
            - call: "POST /housing-units"
              payload: { address: "610 Cherrywood St", bedrooms: 0 }
              as: HousingCoordinator
              captures: { unit_id: $.data.id }
            - call: "POST /housing-setups"
              payload: { case_id: "${case_id}", housing_unit_id: "${unit_id}", occupancy_start: "2026-10-05", occupancy_end: "2027-04-05" }
              as: HousingCoordinator
              captures: { setup_id: $.data.id }
            - call: "POST /housing-setups/${setup_id}/furnish"
              payload: { item: "BED" }
              as: HousingCoordinator
            - call: "POST /housing-setups/${setup_id}/furnish"
              payload: { item: "LINENS" }
              as: HousingCoordinator
            - call: "POST /housing-setups/${setup_id}/furnish"
              payload: { item: "TABLE" }
              as: HousingCoordinator
            - call: "POST /housing-setups/${setup_id}/furnish"
              payload: { item: "CHAIRS" }
              as: HousingCoordinator
            - call: "POST /housing-setups/${setup_id}/furnish"
              payload: { item: "COOKWARE" }
              as: HousingCoordinator
            - call: "POST /housing-setups/${setup_id}/furnish"
              payload: { item: "CLEANING_SUPPLIES" }
              as: HousingCoordinator
            - call: "POST /housing-setups/${setup_id}/ready"
              as: HousingCoordinator
            - call: "POST /cases/${case_id}/arrive"
              payload: { actual_arrival_date: "2026-10-05" }
              as: CaseManager
            - call: "POST /federal-reports"
              payload: { period_start: "2026-10-01", period_end: "2027-01-01" }
              as: AgencyDirector
              captures: { report_id: $.data.id, report_cases: $.data.cases_arrived_count }
          trigger:
            - call: "POST /federal-reports/${report_id}/submit"
              as: AgencyDirector
              captures: { err: $.data.error_id }
            - call: "POST /case-notes"
              payload: { case_id: "${case_id}", note_type: "GENERAL", body: "Case file opened and reviewed" }
              as: CaseManager
            - call: "POST /federal-reports/${report_id}/submit"
              as: AgencyDirector
              captures: { report_status: $.data.status, report_submitter: $.data.submitted_by_user_id }
          assert:
            - "first submit: error_id == 'ERR_REPORT_DOCUMENTATION_INCOMPLETE' with http 422 (the included case has no CaseNote)"
            - "after adding a note: status == 'SUBMITTED' and submitted_by_user_id == the AgencyDirector's X-User-ID"

      - name: sod_same_user_review_returns_segregation_error
        claim_type: segregation_of_duties
        grounds:
          - state_machines.FederalReport.SUBMITTED_to_ACCEPTED
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - roles[FederalOfficer]
        distinguishing_aspect: "Segregation of duties is enforced on the USER ID, not the role: a FederalOfficer whose X-User-ID equals the report's submitted_by_user_id is rejected with ERR_SEGREGATION_OF_DUTIES (403), while a different officer accepts."
        test_recipe:
          setup:
            - "Empty-period DRAFT report [2026-10-01, 2027-01-01) (no arrived cases, so the documentation gate passes vacuously), SUBMITTED by AgencyDirector user dir-1"
          setup_api_calls:
            - call: "POST /federal-reports"
              payload: { period_start: "2026-10-01", period_end: "2027-01-01" }
              as: AgencyDirector
              captures: { report_id: $.data.id }
            - call: "POST /federal-reports/${report_id}/submit"
              as: AgencyDirector
              as_user_id: "dir-1"
              captures: { submit_status: $.data.status }
          trigger:
            - call: "POST /federal-reports/${report_id}/review"
              payload: { decision: "ACCEPTED" }
              as: FederalOfficer
              as_user_id: "dir-1"
              captures: { err: $.data.error_id }
            - call: "POST /federal-reports/${report_id}/review"
              payload: { decision: "ACCEPTED" }
              as: FederalOfficer
              as_user_id: "off-2"
              captures: { report_status: $.data.status, report_reviewer: $.data.reviewed_by_user_id }
          assert:
            - "review by the submitter's own user id: error_id == 'ERR_SEGREGATION_OF_DUTIES' with http 403 (role is valid; the user identity is not)"
            - "review by a different officer: status == 'ACCEPTED' and reviewed_by_user_id == 'off-2'"

      - name: housing_not_ready_on_arrive
        claim_type: violation_to_error
        grounds: ["errors[ERR_HOUSING_NOT_READY]"]
        excluded_because:
          difficulty_instance: "cross_entity_state_dependency / arrive_blocked_until_housing_ready"
          rationale: "Asserted as the failure branch of the named §1.8 instance."

      - name: capacity_insufficient_trigger
        claim_type: violation_to_error
        grounds: ["errors[ERR_HOUSING_CAPACITY_INSUFFICIENT]"]
        excluded_because:
          difficulty_instance: "boundary_precision_check / housing_capacity_exact_fit"
          rationale: "Asserted with the one-bedroom-short case in the named §1.8 instance (and as the winning error in priority_pair_validation_conflict / housing_safety_vs_temporal_priority)."

      - name: unit_occupancy_conflict_trigger
        claim_type: violation_to_error
        grounds: ["errors[ERR_UNIT_OCCUPANCY_CONFLICT]"]
        excluded_because:
          difficulty_instance: "resource_temporal_overlap / housing_half_open_adjacency"
          rationale: "Asserted on the overlapping-window call in the named §1.8 instance."

      - name: session_schedule_conflict_trigger
        claim_type: violation_to_error
        grounds: ["errors[ERR_SESSION_SCHEDULE_CONFLICT]"]
        excluded_because:
          difficulty_instance: "resource_temporal_overlap / orientation_buffer_semantics"
          rationale: "Asserted on the in-buffer session create in the named §1.8 instance."

      - name: benchmark_not_pending_trigger
        claim_type: violation_to_error
        grounds: ["errors[ERR_BENCHMARK_NOT_PENDING]"]
        excluded_because:
          difficulty_instance: "priority_pair_validation_conflict / benchmark_state_vs_referential_priority"
          rationale: "Asserted as the winning error on fulfill of a WAIVED benchmark in the named §1.8 instance."

      - name: case_transfer_pending_on_sessions
        claim_type: violation_to_error
        grounds: ["errors[ERR_CASE_TRANSFER_PENDING]"]
        excluded_because:
          difficulty_instance: "cross_entity_state_dependency / transfer_open_blocks_orientation"
          rationale: "Asserted on the orientation-session create in the named §1.8 instance; the benefit-application freeze is covered separately by transfer_freeze_blocks_application_create."

  # ===========================================================================
  # Section: endpoints — pagination with filtering, response envelope shape.
  # ===========================================================================
  - section: endpoints
    instances:
      - name: benefit_applications_pagination_limit_offset
        claim_type: pagination_with_filtering
        grounds:
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
          - endpoints: "GET /benefit-applications"
        distinguishing_aspect: "Filter + paginate interact: three FILED applications on the case, queried with status filter and limit 2, return exactly 2 items with total_count 3 and has_more true; offset 2 returns the remaining 1 with has_more false."
        test_recipe:
          setup:
            - "Case CASE-EP1 (household_size 1) with one work-eligible adult member, READY 0-bedroom housing, arrived 2026-08-10"
            - "Three BenefitApplications (SSN, STATE_ID, MEDICAL) for the member, all transitioned to FILED"
          setup_api_calls:
            - call: "POST /cases"
              payload: { case_number: "CASE-EP1", agency_affiliate_code: "AFF-01", household_size: 1, scheduled_arrival_date: "2026-08-10" }
              as: CaseManager
              captures: { case_id: $.data.id }
            - call: "POST /members"
              payload: { case_id: "${case_id}", full_name: "Adult P", date_of_birth: "1990-01-01", relationship: "PRINCIPAL", work_eligible: true }
              as: CaseManager
              captures: { member_id: $.data.id }
            - call: "POST /housing-units"
              payload: { address: "620 Rosewood St", bedrooms: 0 }
              as: HousingCoordinator
              captures: { unit_id: $.data.id }
            - call: "POST /housing-setups"
              payload: { case_id: "${case_id}", housing_unit_id: "${unit_id}", occupancy_start: "2026-08-10", occupancy_end: "2027-02-10" }
              as: HousingCoordinator
              captures: { setup_id: $.data.id }
            - call: "POST /housing-setups/${setup_id}/furnish"
              payload: { item: "BED" }
              as: HousingCoordinator
            - call: "POST /housing-setups/${setup_id}/furnish"
              payload: { item: "LINENS" }
              as: HousingCoordinator
            - call: "POST /housing-setups/${setup_id}/furnish"
              payload: { item: "TABLE" }
              as: HousingCoordinator
            - call: "POST /housing-setups/${setup_id}/furnish"
              payload: { item: "CHAIRS" }
              as: HousingCoordinator
            - call: "POST /housing-setups/${setup_id}/furnish"
              payload: { item: "COOKWARE" }
              as: HousingCoordinator
            - call: "POST /housing-setups/${setup_id}/furnish"
              payload: { item: "CLEANING_SUPPLIES" }
              as: HousingCoordinator
            - call: "POST /housing-setups/${setup_id}/ready"
              as: HousingCoordinator
            - call: "POST /cases/${case_id}/arrive"
              payload: { actual_arrival_date: "2026-08-10" }
              as: CaseManager
            - call: "POST /benefit-applications"
              payload: { case_id: "${case_id}", member_id: "${member_id}", benefit_type: "SSN" }
              as: CaseManager
              captures: { app1: $.data.id }
            - call: "POST /benefit-applications"
              payload: { case_id: "${case_id}", member_id: "${member_id}", benefit_type: "STATE_ID" }
              as: CaseManager
              captures: { app2: $.data.id }
            - call: "POST /benefit-applications"
              payload: { case_id: "${case_id}", member_id: "${member_id}", benefit_type: "MEDICAL" }
              as: CaseManager
              captures: { app3: $.data.id }
            - call: "POST /benefit-applications/${app1}/transition"
              payload: { to_status: "FILED" }
              as: CaseManager
            - call: "POST /benefit-applications/${app2}/transition"
              payload: { to_status: "FILED" }
              as: CaseManager
            - call: "POST /benefit-applications/${app3}/transition"
              payload: { to_status: "FILED" }
              as: CaseManager
          trigger:
            - call: "GET /benefit-applications"
              payload: { case_id: "${case_id}", status: "FILED", limit: 2, offset: 0 }
              as: CaseManager
            - call: "GET /benefit-applications"
              payload: { case_id: "${case_id}", status: "FILED", limit: 2, offset: 2 }
              as: CaseManager
          assert:
            - "first page: data has exactly 2 items, all with status == 'FILED'; pagination total_count == 3 and has_more == true"
            - "second page (offset 2): data has exactly 1 item; pagination total_count == 3 and has_more == false"

      - name: response_envelope_success_and_error_shape
        claim_type: response_envelope
        grounds:
          - response_envelope
        distinguishing_aspect: "Both envelope shapes conform to §1.0: a successful create returns meta.api_request_id + response_type 'object' + data; a 404 returns response_type 'error' with data.error_id and data.message."
        test_recipe:
          setup:
            - "Empty database"
          setup_api_calls: []
          trigger:
            - call: "POST /cases"
              payload: { case_number: "CASE-EP2", agency_affiliate_code: "AFF-01", household_size: 1, scheduled_arrival_date: "2026-08-10" }
              as: CaseManager
              captures: { case_id: $.data.id }
            - call: "GET /cases/00000000-0000-0000-0000-000000000000"
              as: CaseManager
              captures: { err: $.data.error_id }
          assert:
            - "success response: meta.api_request_id present, meta.api_request_timestamp present, response_type == 'object', data.id == the created case id"
            - "error response: response_type == 'error', data.error_id == 'ERR_NOT_FOUND', data.message present (non-empty string)"

  # ===========================================================================
  # Section: rbac — exclusive operations enforced; shared operations work.
  # ===========================================================================
  - section: rbac
    instances:
      - name: waive_exclusive_to_director
        claim_type: rbac_denial
        grounds:
          - roles[AgencyDirector].exclusive_operations
          - errors[ERR_FORBIDDEN]
        distinguishing_aspect: "POST /benchmarks/{id}/waive is AgencyDirector-only: a CaseManager attempting it gets ERR_FORBIDDEN (403) even though the benchmark is PENDING and the payload is valid."
        test_recipe:
          setup:
            - "Case CASE-RB1 (household_size 1, no members), READY 0-bedroom housing, arrived 2026-08-10 (HOME_VISIT PENDING)"
          setup_api_calls:
            - call: "POST /cases"
              payload: { case_number: "CASE-RB1", agency_affiliate_code: "AFF-01", household_size: 1, scheduled_arrival_date: "2026-08-10" }
              as: CaseManager
              captures: { case_id: $.data.id }
            - call: "POST /housing-units"
              payload: { address: "630 Rosewood Ct", bedrooms: 0 }
              as: HousingCoordinator
              captures: { unit_id: $.data.id }
            - call: "POST /housing-setups"
              payload: { case_id: "${case_id}", housing_unit_id: "${unit_id}", occupancy_start: "2026-08-10", occupancy_end: "2027-02-10" }
              as: HousingCoordinator
              captures: { setup_id: $.data.id }
            - call: "POST /housing-setups/${setup_id}/furnish"
              payload: { item: "BED" }
              as: HousingCoordinator
            - call: "POST /housing-setups/${setup_id}/furnish"
              payload: { item: "LINENS" }
              as: HousingCoordinator
            - call: "POST /housing-setups/${setup_id}/furnish"
              payload: { item: "TABLE" }
              as: HousingCoordinator
            - call: "POST /housing-setups/${setup_id}/furnish"
              payload: { item: "CHAIRS" }
              as: HousingCoordinator
            - call: "POST /housing-setups/${setup_id}/furnish"
              payload: { item: "COOKWARE" }
              as: HousingCoordinator
            - call: "POST /housing-setups/${setup_id}/furnish"
              payload: { item: "CLEANING_SUPPLIES" }
              as: HousingCoordinator
            - call: "POST /housing-setups/${setup_id}/ready"
              as: HousingCoordinator
            - call: "POST /cases/${case_id}/arrive"
              payload: { actual_arrival_date: "2026-08-10" }
              as: CaseManager
            - call: "GET /cases/${case_id}/benchmarks"
              payload: { service_type: "HOME_VISIT" }
              as: CaseManager
              captures: { bm_id: "$.data[0].id" }
          trigger:
            - call: "POST /benchmarks/${bm_id}/waive"
              payload: { reason: "Manager attempting a director-only waiver" }
              as: CaseManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == 'ERR_FORBIDDEN' with http 403"

      - name: review_exclusive_to_officer
        claim_type: rbac_denial
        grounds:
          - roles[FederalOfficer].exclusive_operations
          - errors[ERR_FORBIDDEN]
        distinguishing_aspect: "POST /federal-reports/{id}/review is FederalOfficer-only: an AgencyDirector (who may submit) attempting to review gets ERR_FORBIDDEN (403) — the role-level half of segregation of duties."
        test_recipe:
          setup:
            - "DRAFT report for [2026-10-01, 2027-01-01), SUBMITTED by AgencyDirector dir-1"
          setup_api_calls:
            - call: "POST /federal-reports"
              payload: { period_start: "2026-10-01", period_end: "2027-01-01" }
              as: AgencyDirector
              captures: { report_id: $.data.id }
            - call: "POST /federal-reports/${report_id}/submit"
              as: AgencyDirector
              as_user_id: "dir-1"
          trigger:
            - call: "POST /federal-reports/${report_id}/review"
              payload: { decision: "ACCEPTED" }
              as: AgencyDirector
              as_user_id: "dir-9"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == 'ERR_FORBIDDEN' with http 403 (AgencyDirector lacks the review operation regardless of user id)"

      - name: housing_units_exclusive_to_coordinator
        claim_type: rbac_denial
        grounds:
          - roles[HousingCoordinator].exclusive_operations
          - errors[ERR_FORBIDDEN]
        distinguishing_aspect: "POST /housing-units is HousingCoordinator-only: a CaseManager gets ERR_FORBIDDEN (403)."
        test_recipe:
          setup:
            - "Empty database"
          setup_api_calls: []
          trigger:
            - call: "POST /housing-units"
              payload: { address: "640 Unaffiliated St", bedrooms: 1 }
              as: CaseManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == 'ERR_FORBIDDEN' with http 403"

      - name: plan_patch_exclusive_to_specialist
        claim_type: rbac_denial
        grounds:
          - roles[EmploymentSpecialist].exclusive_operations
          - errors[ERR_FORBIDDEN]
        distinguishing_aspect: "PATCH /employment-plans/{id} is EmploymentSpecialist-only: a CaseManager gets ERR_FORBIDDEN (403)."
        test_recipe:
          setup:
            - "Case CASE-RB4 (household_size 1, no members), READY 0-bedroom housing, arrived 2026-08-10; an ACTIVE EmploymentPlan exists"
          setup_api_calls:
