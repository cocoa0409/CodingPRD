    code: 200
    input: []
    output: PatientEncounter
    side_effects: ["Ticket IN_SERVICE -> QUEUED with new tail position", "PatientTicket.version incremented"]
  - method: GET
    path: "/clinic-events/{id}/encounters/{eid}/referrals"
    description: "List referrals for an encounter (sub-resource reverse reachability)"
    roles: [StationLead, EventDirector, CommunityPartnerRep, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: ReferralRecord[]
    side_effects: []
  - method: GET
    path: "/referrals"
    description: "Filtered list of referrals"
    roles: [StationLead, EventDirector, CommunityPartnerRep, PlatformAdmin]
    code: 200
    input: ["clinic_event_id?", "encounter_id?", "referral_type?", "limit?", "offset?"]
    output: ReferralRecord[]
    side_effects: []

  # --- Equipment & sterilization ---
  - method: POST
    path: "/clinic-events/{id}/manifests"
    description: "Create an equipment manifest (PACKED)"
    roles: [LogisticsCoordinator]
    code: 201
    input: [manifest_label, item_count, weight_kg, requires_loading_dock, contains_sterilizer]
    output: EquipmentManifest
    side_effects: []
  - method: GET
    path: "/clinic-events/{id}/manifests"
    description: "List manifests for an event"
    roles: [LogisticsCoordinator, EventDirector, PlatformAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: EquipmentManifest[]
    side_effects: []
  - method: GET
    path: "/manifests"
    description: "Filtered list of manifests across events"
    roles: [LogisticsCoordinator, EventDirector, PlatformAdmin]
    code: 200
    input: ["clinic_event_id?", "status?", "limit?", "offset?"]
    output: EquipmentManifest[]
    side_effects: []
  - method: POST
    path: "/clinic-events/{id}/manifests/{mid}/ship"
    description: "PACKED -> IN_TRANSIT; loading-dock check against confirmed site"
    roles: [LogisticsCoordinator]
    code: 200
    input: []
    output: EquipmentManifest
    side_effects: ["EquipmentManifest.version incremented"]
  - method: POST
    path: "/clinic-events/{id}/manifests/{mid}/deliver"
    description: "IN_TRANSIT -> DELIVERED"
    roles: [LogisticsCoordinator]
    code: 200
    input: []
    output: EquipmentManifest
    side_effects: ["EquipmentManifest.version incremented"]
  - method: POST
    path: "/clinic-events/{id}/manifests/{mid}/unpack"
    description: "DELIVERED -> UNPACKED; unlocks sterilization when contains_sterilizer"
    roles: [LogisticsCoordinator]
    code: 200
    input: []
    output: EquipmentManifest
    side_effects: ["EquipmentManifest.version incremented"]
  - method: POST
    path: "/clinic-events/{id}/manifests/{mid}/repack"
    description: "UNPACKED -> REPACKED (TEARDOWN only)"
    roles: [LogisticsCoordinator]
    code: 200
    input: []
    output: EquipmentManifest
    side_effects: ["EquipmentManifest.version incremented"]
  - method: POST
    path: "/clinic-events/{id}/sterilization-cycles"
    description: "Start a sterilization cycle (RUNNING); requires an UNPACKED manifest with contains_sterilizer"
    roles: [SterilizationTech]
    code: 201
    input: [instrument_batch_size]
    output: SterilizationCycle
    side_effects: ["cycle_sequence assigned", "backlog recomputed; stations may degrade"]
  - method: GET
    path: "/clinic-events/{id}/sterilization-cycles"
    description: "List cycles for an event"
    roles: [SterilizationTech, StationLead, EventDirector, PlatformAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: SterilizationCycle[]
    side_effects: []
  - method: GET
    path: "/sterilization-cycles"
    description: "Filtered list of cycles across events"
    roles: [SterilizationTech, EventDirector, PlatformAdmin]
    code: 200
    input: ["clinic_event_id?", "status?", "limit?", "offset?"]
    output: SterilizationCycle[]
    side_effects: []
  - method: POST
    path: "/clinic-events/{id}/sterilization-cycles/{cid}/complete"
    description: "RUNNING -> COMPLETED; clears stations and backlog"
    roles: [SterilizationTech]
    code: 200
    input: []
    output: SterilizationCycle
    side_effects: ["stations SET_UP -> STERILIZATION_CLEARED", "DEGRADED -> OPERATIONAL when backlog cleared", "sterilization_cycles_completed incremented", "ClinicEvent.version incremented"]
  - method: POST
    path: "/clinic-events/{id}/sterilization-cycles/{cid}/fail"
    description: "RUNNING -> FAILED; batch returns to backlog"
    roles: [SterilizationTech]
    code: 200
    input: []
    output: SterilizationCycle
    side_effects: ["backlog recomputed; stations may degrade"]

  # --- Reports & handoff ---
  - method: POST
    path: "/clinic-events/{id}/unmet-demand-reports"
    description: "Generate an unmet demand report snapshot (append-only)"
    roles: [EventDirector]
    code: 201
    input: [report_variant]
    output: UnmetDemandReport
    side_effects: []
  - method: GET
    path: "/clinic-events/{id}/unmet-demand-reports"
    description: "List reports for an event (reverse reachability; append-only)"
    roles: [EventDirector, PlatformAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: UnmetDemandReport[]
    side_effects: []
  - method: POST
    path: "/clinic-events/{id}/handoffs"
    description: "Create a community handoff (DRAFT)"
    roles: [EventDirector]
    code: 201
    input: [partner_org_name, teardown_checklist_complete]
    output: CommunityHandoff
    side_effects: []
  - method: GET
    path: "/clinic-events/{id}/handoffs"
    description: "List handoffs for an event"
    roles: [EventDirector, CommunityPartnerRep, PlatformAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: CommunityHandoff[]
    side_effects: []
  - method: GET
    path: "/handoffs"
    description: "Filtered list of handoffs across events"
    roles: [EventDirector, CommunityPartnerRep, PlatformAdmin]
    code: 200
    input: ["clinic_event_id?", "status?", "limit?", "offset?"]
    output: CommunityHandoff[]
    side_effects: []
  - method: POST
    path: "/clinic-events/{id}/handoffs/{hid}/assemble-packet"
    description: "DRAFT -> PACKET_ASSEMBLED; recomputes referral_packet_count"
    roles: [EventDirector]
    code: 200
    input: []
    output: CommunityHandoff
    side_effects: ["referral_packet_count recomputed", "CommunityHandoff.version incremented"]
  - method: POST
    path: "/clinic-events/{id}/handoffs/{hid}/accept"
    description: "PACKET_ASSEMBLED -> ACCEPTED; requires teardown checklist complete"
    roles: [CommunityPartnerRep]
    code: 200
    input: []
    output: CommunityHandoff
    side_effects: ["CommunityHandoff.version incremented"]
  - method: POST
    path: "/clinic-events/{id}/handoffs/{hid}/dispute"
    description: "PACKET_ASSEMBLED -> DISPUTED"
    roles: [CommunityPartnerRep]
    code: 200
    input: []
    output: CommunityHandoff
    side_effects: ["CommunityHandoff.version incremented"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or malformed X-User-Role / X-User-ID headers" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted for the endpoint per RBAC matrix" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path-referenced resource does not exist" }
  - { id: ERR_VALIDATION, http: 400, condition: "Missing required field, enum violation, or generic input validation failure" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource not in a valid from-state for the requested transition" }
  - { id: ERR_EVENT_POSTURE_FORBIDS, http: 409, condition: "Parent event posture does not permit the child operation" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_event_version does not match current ClinicEvent.version (OCC)" }
  - { id: ERR_SITE_NOT_VETTED, http: 422, condition: "Agreement confirm attempted against a Site not in VETTED status" }
  - { id: ERR_SITE_STATE_MISMATCH, http: 422, condition: "Site.state_code differs from ClinicEvent.host_state_code at confirm" }
  - { id: ERR_SITE_TOO_SMALL, http: 422, condition: "Site square_footage < 2000 at vet time" }
  - { id: ERR_SITE_IN_USE, http: 422, condition: "Retire attempted while live agreements reference the site" }
  - { id: ERR_INSURANCE_MISSING, http: 422, condition: "insurance_certificate_ref empty at agreement confirm" }
  - { id: ERR_LICENSE_FIELDS_REQUIRED, http: 422, condition: "Clinical volunteer (non-GENERAL) missing license_number/license_state_code/license_expiry_date at verification request" }
  - { id: ERR_LICENSE_EXPIRED, http: 422, condition: "license_expiry_date <= event.service_date at authorize" }
  - { id: ERR_STATE_PRACTICE_FORBIDDEN, http: 422, condition: "license_state_code != event host_state_code for a clinical discipline at authorize" }
  - { id: ERR_DISCIPLINE_MISMATCH, http: 422, condition: "Volunteer discipline incompatible with assignment/encounter discipline" }
  - { id: ERR_VOLUNTEER_NOT_AUTHORIZED, http: 422, condition: "Encounter completion attempted by a volunteer whose status is not AUTHORIZED" }
  - { id: ERR_CAPACITY_EXHAUSTED, http: 422, condition: "Ticket issue would exceed total_patient_capacity (>= boundary: issuing when tickets_issued_count == capacity is rejected)" }
  - { id: ERR_NOT_QUEUE_HEAD, http: 422, condition: "Call attempted on a ticket that is not the fair-sequence head for its requested_service" }
  - { id: ERR_REQUEUE_EXHAUSTED, http: 422, condition: "Second requeue attempted on the same ticket" }
  - { id: ERR_NO_STATION_AVAILABLE, http: 422, condition: "begin-service with no compatible OPERATIONAL station whose service window is open" }
  - { id: ERR_STATION_NOT_SERVING, http: 422, condition: "Encounter completion attempted at a station not in OPERATIONAL/DEGRADED" }
  - { id: ERR_STERILIZATION_NOT_CLEARED, http: 422, condition: "Sterilization gate failed: no COMPLETED cycle covers the requires_sterilization station" }
  - { id: ERR_BATCH_TOO_LARGE, http: 422, condition: "instrument_batch_size > 24 at cycle creation" }
  - { id: ERR_POWER_CAPACITY_EXCEEDED, http: 422, condition: "Station set-up would exceed confirmed site's power_capacity_kw budget" }
  - { id: ERR_LOADING_DOCK_REQUIRED, http: 422, condition: "Manifest requires_loading_dock but confirmed site lacks one at ship time" }
  - { id: ERR_MANIFEST_NOT_UNPACKED, http: 422, condition: "open-doors attempted while a manifest is not UNPACKED" }
  - { id: ERR_MANIFEST_NOT_REPACKED, http: 422, condition: "Event close attempted while a manifest is not REPACKED" }
  - { id: ERR_STATIONS_NOT_DISMANTLED, http: 422, condition: "Event close attempted while a station is not DISMANTLED" }
  - { id: ERR_ACTIVE_ENCOUNTERS_REMAIN, http: 422, condition: "end-service / take-offline attempted with CALLED/IN_SERVICE tickets or OPEN encounters remaining" }
  - { id: ERR_REFERRAL_REQUIRED, http: 422, condition: "Encounter with requires_followup == true completed without a referral bundle" }
  - { id: ERR_TEARDOWN_INCOMPLETE, http: 422, condition: "Handoff accept attempted with teardown_checklist_complete == false" }
  - { id: ERR_HANDOFF_NOT_ACCEPTED, http: 422, condition: "Event close attempted without an ACCEPTED CommunityHandoff" }
  - { id: ERR_TEMPORAL_WINDOW_INVALID, http: 422, condition: "Temporal window violated: close <= open, expired license vs service_date, or arrival outside service window" }
  - { id: ERR_REFERENCE_INVALID, http: 422, condition: "FK target missing or in an incompatible state" }
  - { id: ERR_FISCAL_RULE_VIOLATION, http: 422, condition: "Negative liability cap or fiscal rule violation on agreement" }
  - { id: ERR_DUPLICATE_EMAIL, http: 409, condition: "Volunteer email already registered" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: EventDirector
    description: "Owns the event lifecycle: posture transitions, agreement confirmation, reports, handoff assembly"
    identity: "opaque"
    exclusive_operations: [open-doors, end-service, close, cancel, confirm-agreement, reject-agreement, generate-unmet-demand-report, create-handoff, assemble-packet]
    shared_operations: [read-any]
  - name: LogisticsCoordinator
    description: "Owns sites, agreements negotiation, stations layout, equipment manifests"
    identity: "opaque"
    exclusive_operations: [create-site, vet-site, retire-site, create-agreement, submit-agreement, create-station, mark-set-up, dismantle-station, manifest-lifecycle]
    shared_operations: [read-any]
  - name: VolunteerCoordinator
    description: "Owns volunteer registration, verification requests, authorization, suspension, assignments"
    identity: "opaque"
    exclusive_operations: [register-volunteer, request-verification, authorize-volunteer, suspend-volunteer, reinstate-volunteer, create-assignment, confirm-assignment, release-assignment]
    shared_operations: [read-any]
  - name: CredentialingOfficer
    description: "Approves or denies license verifications; segregated from VolunteerCoordinator (the coordinator who requests a verification cannot approve it)"
    identity: "opaque"
    exclusive_operations: [approve-verification, deny-verification]
    shared_operations: [read-any]
  - name: QueueMarshal
    description: "Runs patient intake and the fair queue"
    identity: "opaque"
    exclusive_operations: [issue-ticket, call-ticket, requeue-ticket, mark-no-show, withdraw-ticket]
    shared_operations: [read-any]
  - name: StationLead
    description: "Runs clinical service delivery at stations"
    identity: "opaque"
    exclusive_operations: [mark-operational, take-offline, begin-service, complete-encounter, abandon-encounter, check-in-assignment]
    shared_operations: [read-any]
  - name: SterilizationTech
    description: "Runs sterilization cycles; segregated from StationLead (the lead who serves patients cannot certify sterilization)"
    identity: "opaque"
    exclusive_operations: [start-cycle, complete-cycle, fail-cycle]
    shared_operations: [read-any]
  - name: CommunityPartnerRep
    description: "Accepts or disputes the referral handoff on behalf of the community partner"
    identity: "opaque"
    exclusive_operations: [accept-handoff, dispute-handoff]
    shared_operations: [read-referrals, read-handoffs]
  - name: PlatformAdmin
    description: "Operator role for clock control and global reads"
    identity: "opaque"
    exclusive_operations: [set-clock]
    shared_operations: [read-any]
