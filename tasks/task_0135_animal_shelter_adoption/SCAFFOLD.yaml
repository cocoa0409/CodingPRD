scenario: "Animal Shelter & Adoption: intake (stray/surrender/transfer), kennel/stray-hold period, medical/spay-neuter, adoption application/fee, foster placement, return-to-owner, euthanasia decision, microchip registry"
domain_name: animal-shelter-adoption
api_prefix: ""

complexity_profile:
  primary_archetype: "Compliance / audit"
  secondary_archetype: "Workflow orchestration"
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: flat
  # All resources are peers linked by foreign keys (animal_id, kennel_id, foster_home_id,
  # adopter_id). No nested-ownership URL paths; every child is reached by a filtered list
  # endpoint carrying its FK as an optional query field.

  state_machine_shape: parallel
  # Animal carries two independent state axes (lifecycle_status × medical_status) that evolve
  # separately. AdoptionApplication is branching (SUBMITTED -> {APPROVED, REJECTED}). FosterPlacement
  # is cyclic (an animal can be placed, returned, and re-placed). EuthanasiaDecision is a guarded
  # two-actor approval.

  relationship_patterns:
    - one_to_many        # Animal has many MedicalRecords / KennelAssignments / AdoptionApplications
    - cross_aggregate    # KennelAssignment references Kennel; FosterPlacement references FosterHome

  role_model: segregation_of_duties
  # EuthanasiaDecision requires that the requesting user and the approving veterinarian are
  # distinct X-User-IDs in distinct roles. Other roles are peer/operational.

  consistency_model: immediate
  # Every cascade (finalize -> animal adopted -> kennel released -> occupancy decremented) is
  # atomic within the triggering request.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =====================================================================
# §1.1 Entity-Relationship Table
# =====================================================================
entities:
  - name: Shelter
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Shelter display name"
      - name: stray_hold_days
        type: integer
        source: input
        description: "Mandatory stray-hold period in whole days for STRAY-source intakes; SURRENDER and TRANSFER intakes have a zero-day hold"
        default: 5
        constraints: ">= 0"
      - name: promo_active
        type: boolean
        source: input
        description: "When true, the finalization-time adoption fee applies the promotional discount"
        default: false
      - name: collected_fee_cents
        type: integer
        source: computed
        description: "Running ledger: sum of net adoption fees of all FINALIZED, non-refunded AdoptionApplications. Debited back to zero contribution when an application is REFUNDED. Invariant target for compensating-action tests."
        default: 0
      - name: dog_daily_board_cents
        type: integer
        source: input
        description: "Base per-day board rate for DOG animals, before care fee"
        default: 1850
      - name: cat_daily_board_cents
        type: integer
        source: input
        description: "Base per-day board rate for CAT animals, before care fee"
        default: 1250

  - name: Kennel
    parent: null
    common_fields: true
    fields:
      - name: label
        type: string
        source: input
        description: "Human-readable kennel identifier, e.g. 'A-12'"
      - name: capacity
        type: integer
        source: input
        description: "Maximum concurrent active KennelAssignments. Single-occupancy kennels use 1."
        default: 1
        constraints: ">= 1"
      - name: occupied_count
        type: integer
        source: computed
        description: "Number of KennelAssignments on this kennel whose status == ACTIVE. Invariant: equals that count at all times."
        default: 0
      - name: status
        type: enum
        source: computed
        description: "Derived occupancy status: OPEN while occupied_count < capacity; FULL when occupied_count == capacity"
        default: OPEN
        constraints: "one of OPEN, FULL"

  - name: Animal
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Animal name"
      - name: species
        type: enum
        source: input
        description: "Species; selects the board rate"
        constraints: "one of DOG, CAT"
      - name: age_months
        type: integer
        source: input
        description: "Age in whole months at intake; selects the adoption-fee age band"
        constraints: ">= 0"
      - name: lifecycle_status
        type: enum
        source: computed
        description: "Lifecycle axis (independent of medical_status). INTAKE_PENDING on create, advances via intake and outcome transitions."
        default: INTAKE_PENDING
        constraints: "one of INTAKE_PENDING, IN_CUSTODY, AVAILABLE, FOSTERED, ADOPTED, RECLAIMED, EUTHANIZED"
      - name: medical_status
        type: enum
        source: computed
        description: "Medical axis (independent of lifecycle_status). Evolves separately via MedicalRecord transitions."
        default: UNEXAMINED
        constraints: "one of UNEXAMINED, EXAM_PENDING, NEEDS_TREATMENT, CLEARED"
      - name: microchipped
        type: boolean
        source: computed
        description: "True once a Microchip row exists for this animal; read at fee finalization to decide the microchip surcharge"
        default: false
      - name: stray_hold_release_at
        type: datetime
        source: computed
        description: "Computed at intake: for STRAY source, intake_at + shelter.stray_hold_days days; for SURRENDER/TRANSFER, equals intake_at (zero hold). Null before intake."
        default: null

  - name: IntakeRecord
    parent: null
    common_fields: true
    fields:
      - name: animal_id
        type: string
        source: input
        description: "FK -> Animal.id; the animal being taken into custody"
      - name: source
        type: enum
        source: input
        description: "Intake channel; STRAY triggers the stray-hold clock, SURRENDER and TRANSFER do not"
        constraints: "one of STRAY, SURRENDER, TRANSFER"
      - name: intake_at
        type: datetime
        source: system
        description: "Server clock at the moment the intake is recorded"
      - name: surrendering_party
        type: string
        source: input
        description: "Name of the surrendering owner or transferring organization; required for SURRENDER and TRANSFER, ignored for STRAY"
        default: null
      - name: stray_hold_release_at
        type: datetime
        source: computed
        description: "Snapshot of the computed release instant copied onto the Animal; intake_at for non-STRAY sources"

  - name: KennelAssignment
    parent: null
    common_fields: true
    fields:
      - name: kennel_id
        type: string
        source: input
        description: "FK -> Kennel.id; the kennel occupied by this assignment"
      - name: animal_id
        type: string
        source: input
        description: "FK -> Animal.id; the animal occupying the kennel"
      - name: start_at
        type: datetime
        source: system
        description: "Half-open interval start; server clock at assignment creation"
      - name: end_at
        type: datetime
        source: computed
        description: "Half-open interval end; set when the assignment is released, null while ACTIVE. Overlap arithmetic treats the interval as [start_at, end_at)."
        default: null
      - name: status
        type: enum
        source: computed
        description: "ACTIVE while the animal occupies the kennel; RELEASED once vacated"
        default: ACTIVE
        constraints: "one of ACTIVE, RELEASED"
      - name: actual_board_cents
        type: integer
        source: computed
        description: "Finalized board cost over occupied days, round-per-day then sum (see calculations.actual_board_cost). Null while ACTIVE."
        default: null

  - name: MedicalRecord
    parent: null
    common_fields: true
    fields:
      - name: animal_id
        type: string
        source: input
        description: "FK -> Animal.id; the examined animal"
      - name: record_type
        type: enum
        source: input
        description: "EXAM advances medical_status to NEEDS_TREATMENT or CLEARED; SPAY_NEUTER records the sterilization procedure"
        constraints: "one of EXAM, SPAY_NEUTER, VACCINATION"
      - name: outcome
        type: enum
        source: input
        description: "For EXAM records: CLEAR sets medical_status CLEARED, HOLD sets NEEDS_TREATMENT. Ignored for non-EXAM types."
        default: null
        constraints: "one of CLEAR, HOLD"
      - name: notes
        type: string
        source: input
        description: "Free-text clinical notes"
        default: null

  - name: Microchip
    parent: null
    common_fields: false
    fields:
      - name: animal_id
        type: string
        source: input
        description: "FK -> Animal.id; the chipped animal"
      - name: chip_number
        type: string
        source: input
        description: "Globally unique microchip serial; uniqueness enforced across all Microchips"
        constraints: "unique"
      - name: owner_name
        type: string
        source: input
        description: "Registered owner name in the microchip registry"
        default: null
      - name: owner_phone
        type: string
        source: input
        description: "Registered owner contact phone"
        default: null

  - name: OwnerClaim
    parent: null
    common_fields: true
    fields:
      - name: animal_id
        type: string
        source: input
        description: "FK -> Animal.id; the animal being claimed by an owner (return-to-owner)"
      - name: claimant_name
        type: string
        source: input
        description: "Name of the person claiming ownership"
      - name: proof_chip_number
        type: string
        source: input
        description: "Microchip serial the claimant presents as proof of ownership; must match an existing Microchip on this animal"
        default: null
      - name: status
        type: enum
        source: computed
        description: "Claim lifecycle"
        default: PENDING
        constraints: "one of PENDING, APPROVED, DENIED"

  - name: AdopterAccount
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Adopter's full name"
      - name: email
        type: string
        source: input
        description: "Adopter contact email; unique across AdopterAccounts"
        constraints: "unique"
      - name: phone
        type: string
        source: input
        description: "Adopter contact phone"
        default: null

  - name: AdoptionApplication
    parent: null
    common_fields: true
    fields:
      - name: animal_id
        type: string
        source: input
        description: "FK -> Animal.id; the animal applied for"
      - name: adopter_id
        type: string
        source: input
        description: "FK -> AdopterAccount.id; the applicant"
      - name: status
        type: enum
        source: computed
        description: "Application lifecycle; branching at review into APPROVED or REJECTED"
        default: SUBMITTED
        constraints: "one of SUBMITTED, APPROVED, REJECTED, FINALIZED, REFUNDED"
      - name: estimated_fee_cents
        type: integer
        source: computed
        description: "Adoption fee snapshot computed at submit time (see calculations.adoption_fee, provisional variant)"
      - name: final_fee_cents
        type: integer
        source: computed
        description: "Adoption fee recomputed at finalization (see calculations.adoption_fee, final variant); may differ from estimated_fee_cents if microchip/promo state changed. Null until FINALIZED."
        default: null
      - name: refunded
        type: boolean
        source: computed
        description: "True once the finalized fee has been refunded; removes this application's contribution from Shelter.collected_fee_cents"
        default: false

  - name: FosterHome
    parent: null
    common_fields: true
    fields:
      - name: contact_name
        type: string
        source: input
        description: "Foster caregiver name"
      - name: max_concurrent
        type: integer
        source: input
        description: "Maximum number of animals that may be on ACTIVE foster placement at this home at once (aggregate capacity)"
        default: 2
        constraints: ">= 1"
      - name: cooldown_days
        type: integer
        source: input
        description: "Required gap in whole days between the end of one placement and the start of the next at this home (buffer interval semantics)"
        default: 3
        constraints: ">= 0"
      - name: active_placement_count
        type: integer
        source: computed
        description: "Number of FosterPlacements at this home whose status == ACTIVE. Invariant: equals that count at all times."
        default: 0

  - name: FosterPlacement
    parent: null
    common_fields: true
    fields:
      - name: foster_home_id
        type: string
        source: input
        description: "FK -> FosterHome.id; the hosting home"
      - name: animal_id
        type: string
        source: input
        description: "FK -> Animal.id; the fostered animal"
      - name: start_at
        type: datetime
        source: system
        description: "Closed-interval start; server clock at placement creation"
      - name: end_at
        type: datetime
        source: computed
        description: "Closed-interval end; set when the placement is returned, null while ACTIVE. Overlap arithmetic treats the interval as [start_at, end_at] inclusive and additionally reserves cooldown_days after end_at."
        default: null
      - name: status
        type: enum
        source: computed
        description: "Placement lifecycle; cyclic — a returned animal may be placed again"
        default: ACTIVE
        constraints: "one of ACTIVE, RETURNED"

  - name: EuthanasiaDecision
    parent: null
    common_fields: true
    fields:
      - name: animal_id
        type: string
        source: input
        description: "FK -> Animal.id; the animal under euthanasia review"
      - name: requested_by_user_id
        type: string
        source: system
        description: "X-User-ID of the requesting operator, captured at request time"
      - name: reason
        type: enum
        source: input
        description: "Documented justification"
        constraints: "one of MEDICAL_UNTREATABLE, BEHAVIORAL, COURT_ORDER"
      - name: approved_by_user_id
        type: string
        source: system
        description: "X-User-ID of the approving veterinarian; set at approval. MUST differ from requested_by_user_id (segregation of duties)."
        default: null
      - name: status
        type: enum
        source: computed
        description: "Decision lifecycle"
        default: REQUESTED
        constraints: "one of REQUESTED, APPROVED, REJECTED, EXECUTED"

# =====================================================================
# §1.2 State Machine Table
# =====================================================================
state_machines:
  - entity: Animal
    initial_state: INTAKE_PENDING
    terminal_states: [ADOPTED, RECLAIMED, EUTHANIZED]
    note: "lifecycle_status axis. medical_status is a parallel, independent axis defined in the second machine below."
    transitions:
      - from: INTAKE_PENDING
        to: IN_CUSTODY
        trigger: "POST /intake-records"
        actor: IntakeOfficer
        preconditions:
          - "Animal.lifecycle_status == INTAKE_PENDING"
          - "no prior IntakeRecord exists for this animal"
        side_effects:
          - "create IntakeRecord with source and intake_at = clock now"
          - "compute Animal.stray_hold_release_at via calculations.stray_hold_release (STRAY: intake_at + shelter.stray_hold_days days; else intake_at)"
          - "set Animal.lifecycle_status = IN_CUSTODY"
      - from: IN_CUSTODY
        to: AVAILABLE
        trigger: "POST /animals/{id}/make-available"
        actor: AdoptionCounselor
        preconditions:
          - "Animal.lifecycle_status == IN_CUSTODY"
          - "Animal.medical_status == CLEARED"
          - "clock now >= Animal.stray_hold_release_at (stray-hold elapsed)"
          - "Animal has no OwnerClaim in status PENDING"
        side_effects:
          - "set Animal.lifecycle_status = AVAILABLE"
      - from: AVAILABLE
        to: FOSTERED
        trigger: "POST /foster-placements"
        actor: FosterCoordinator
        preconditions:
          - "Animal.lifecycle_status == AVAILABLE"
        side_effects:
          - "create FosterPlacement(status=ACTIVE, start_at=clock now)"
          - "increment FosterHome.active_placement_count by 1"
          - "set Animal.lifecycle_status = FOSTERED"
      - from: FOSTERED
        to: AVAILABLE
        trigger: "POST /foster-placements/{id}/return"
        actor: FosterCoordinator
        preconditions:
          - "Animal.lifecycle_status == FOSTERED"
          - "the FosterPlacement.status == ACTIVE"
        side_effects:
          - "set FosterPlacement.status = RETURNED, end_at = clock now"
          - "decrement FosterHome.active_placement_count by 1"
          - "set Animal.lifecycle_status = AVAILABLE (cyclic: animal may be re-fostered or adopted)"
      - from: AVAILABLE
        to: ADOPTED
        trigger: "POST /adoption-applications/{id}/finalize"
        actor: AdoptionCounselor
        preconditions:
          - "Animal.lifecycle_status == AVAILABLE"
          - "the AdoptionApplication.status == APPROVED"
        side_effects:
          - "set AdoptionApplication.status = FINALIZED"
          - "compute AdoptionApplication.final_fee_cents via calculations.adoption_fee (final variant)"
          - "add final_fee_cents to Shelter.collected_fee_cents"
          - "set Animal.lifecycle_status = ADOPTED"
          - "release the animal's ACTIVE KennelAssignment if any (cascade — see KennelAssignment machine)"
        note: "Depth-3+ cascade origin: finalize -> application FINALIZED -> animal ADOPTED -> kennel assignment RELEASED -> kennel occupied_count decremented."
      - from: IN_CUSTODY
        to: RECLAIMED
        trigger: "POST /owner-claims/{id}/approve"
        actor: ShelterAdmin
        preconditions:
          - "Animal.lifecycle_status == IN_CUSTODY"
          - "the OwnerClaim.status == PENDING"
          - "OwnerClaim.proof_chip_number matches an existing Microchip.chip_number on this animal"
        side_effects:
          - "set OwnerClaim.status = APPROVED"
          - "set Animal.lifecycle_status = RECLAIMED"
          - "release the animal's ACTIVE KennelAssignment if any (cascade)"
        note: "Different-trigger depth-2+ cascade: approve claim -> animal RECLAIMED -> kennel assignment RELEASED -> kennel occupied_count decremented."
      - from: IN_CUSTODY
        to: EUTHANIZED
        trigger: "POST /euthanasia-decisions/{id}/execute"
        actor: Veterinarian
        preconditions:
          - "Animal.lifecycle_status == IN_CUSTODY"
          - "the EuthanasiaDecision.status == APPROVED"
          - "clock now >= Animal.stray_hold_release_at (cannot euthanize a stray during its hold)"
        side_effects:
          - "set EuthanasiaDecision.status = EXECUTED"
          - "set Animal.lifecycle_status = EUTHANIZED"
          - "release the animal's ACTIVE KennelAssignment if any (cascade)"

  - entity: Animal
    initial_state: UNEXAMINED
    terminal_states: []
    note: "medical_status axis — parallel to lifecycle_status. The two axes never share a transition; this is what makes Animal a parallel-dimension state machine."
    transitions:
      - from: UNEXAMINED
        to: NEEDS_TREATMENT
        trigger: "POST /medical-records (record_type=EXAM, outcome=HOLD)"
        actor: Veterinarian
        preconditions:
          - "Animal.medical_status in {UNEXAMINED, NEEDS_TREATMENT}"
        side_effects:
          - "set Animal.medical_status = NEEDS_TREATMENT"
      - from: UNEXAMINED
        to: CLEARED
        trigger: "POST /medical-records (record_type=EXAM, outcome=CLEAR)"
        actor: Veterinarian
        preconditions:
          - "Animal.medical_status in {UNEXAMINED, NEEDS_TREATMENT}"
        side_effects:
          - "set Animal.medical_status = CLEARED"
      - from: NEEDS_TREATMENT
        to: CLEARED
        trigger: "POST /medical-records (record_type=EXAM, outcome=CLEAR)"
        actor: Veterinarian
        preconditions:
          - "Animal.medical_status in {UNEXAMINED, NEEDS_TREATMENT}"
        side_effects:
          - "set Animal.medical_status = CLEARED"

  - entity: KennelAssignment
    initial_state: ACTIVE
    terminal_states: [RELEASED]
    transitions:
      - from: (none)
        to: ACTIVE
        trigger: "POST /kennel-assignments"
        actor: IntakeOfficer
        preconditions:
          - "Kennel.status == OPEN (occupied_count < capacity)"
          - "no other ACTIVE KennelAssignment occupies [start_at, end_at) on this kennel (overlap)"
          - "Animal.lifecycle_status == IN_CUSTODY"
          - "expected_kennel_version matches Kennel.version (OCC)"
        side_effects:
          - "create KennelAssignment(status=ACTIVE, start_at=clock now)"
          - "increment Kennel.occupied_count by 1"
          - "recompute Kennel.status (FULL when occupied_count == capacity)"
          - "increments Kennel.version by 1"
      - from: ACTIVE
        to: RELEASED
        trigger: "system cascade from Animal ADOPTED / RECLAIMED / EUTHANIZED, or POST /kennel-assignments/{id}/release"
        actor: system
        preconditions:
          - "KennelAssignment.status == ACTIVE"
        side_effects:
          - "set end_at = clock now"
          - "compute actual_board_cents via calculations.actual_board_cost (round-per-day then sum)"
          - "decrement Kennel.occupied_count by 1"
          - "recompute Kennel.status (OPEN when occupied_count < capacity)"
          - "increments Kennel.version by 1"

  - entity: AdoptionApplication
    initial_state: SUBMITTED
    terminal_states: [REJECTED, REFUNDED]
    transitions:
      - from: (none)
        to: SUBMITTED
        trigger: "POST /adoption-applications"
        actor: Adopter
        preconditions:
          - "Animal.lifecycle_status == AVAILABLE"
          - "no other AdoptionApplication for this animal in status {APPROVED, FINALIZED}"
        side_effects:
          - "compute estimated_fee_cents via calculations.adoption_fee (provisional variant)"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /adoption-applications/{id}/approve"
        actor: AdoptionCounselor
        preconditions:
          - "AdoptionApplication.status == SUBMITTED"
          - "Animal.lifecycle_status == AVAILABLE"
          - "Animal.medical_status == CLEARED"
          - "no other AdoptionApplication for this animal already in status {APPROVED, FINALIZED}"
        side_effects:
          - "set status = APPROVED"
        note: "Branch A of the SUBMITTED fork."
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /adoption-applications/{id}/reject"
        actor: AdoptionCounselor
        preconditions:
          - "AdoptionApplication.status == SUBMITTED"
        side_effects:
          - "set status = REJECTED"
        note: "Branch B of the SUBMITTED fork; terminal, no side effects on Animal."
      - from: APPROVED
        to: FINALIZED
        trigger: "POST /adoption-applications/{id}/finalize"
        actor: AdoptionCounselor
        preconditions:
          - "AdoptionApplication.status == APPROVED"
          - "Animal.lifecycle_status == AVAILABLE"
        side_effects:
          - "compute final_fee_cents via calculations.adoption_fee (final variant)"
          - "add final_fee_cents to Shelter.collected_fee_cents"
          - "drive Animal AVAILABLE -> ADOPTED (cascade, releasing kennel assignment)"
      - from: FINALIZED
        to: REFUNDED
        trigger: "POST /adoption-applications/{id}/refund"
        actor: ShelterAdmin
        preconditions:
          - "AdoptionApplication.status == FINALIZED"
        side_effects:
          - "set refunded = true, status = REFUNDED"
          - "subtract final_fee_cents from Shelter.collected_fee_cents (compensating action; ledger invariant restored)"

  - entity: OwnerClaim
    initial_state: PENDING
    terminal_states: [APPROVED, DENIED]
    transitions:
      - from: (none)
        to: PENDING
        trigger: "POST /owner-claims"
        actor: ShelterAdmin
        preconditions:
          - "Animal.lifecycle_status == IN_CUSTODY"
        side_effects: []
      - from: PENDING
        to: APPROVED
        trigger: "POST /owner-claims/{id}/approve"
        actor: ShelterAdmin
        preconditions:
          - "OwnerClaim.status == PENDING"
          - "Animal.lifecycle_status == IN_CUSTODY"
          - "proof_chip_number matches an existing Microchip.chip_number on this animal"
        side_effects:
          - "drive Animal IN_CUSTODY -> RECLAIMED (cascade, releasing kennel assignment)"
      - from: PENDING
        to: DENIED
        trigger: "POST /owner-claims/{id}/deny"
        actor: ShelterAdmin
        preconditions:
          - "OwnerClaim.status == PENDING"
        side_effects: []

  - entity: FosterPlacement
    initial_state: ACTIVE
    terminal_states: [RETURNED]
    note: "Cyclic at the Animal level: ACTIVE -> RETURNED frees the animal back to AVAILABLE, which may be placed again (a new FosterPlacement row)."
    transitions:
      - from: (none)
        to: ACTIVE
        trigger: "POST /foster-placements"
        actor: FosterCoordinator
        preconditions:
          - "Animal.lifecycle_status == AVAILABLE"
          - "FosterHome.active_placement_count < FosterHome.max_concurrent (aggregate capacity)"
          - "start_at is >= cooldown_days after the end_at of the most recent RETURNED placement at this home (buffer)"
        side_effects:
          - "increment FosterHome.active_placement_count by 1"
          - "drive Animal AVAILABLE -> FOSTERED"
      - from: ACTIVE
        to: RETURNED
        trigger: "POST /foster-placements/{id}/return"
        actor: FosterCoordinator
        preconditions:
          - "FosterPlacement.status == ACTIVE"
        side_effects:
          - "set end_at = clock now"
          - "decrement FosterHome.active_placement_count by 1"
          - "drive Animal FOSTERED -> AVAILABLE"

  - entity: EuthanasiaDecision
    initial_state: REQUESTED
    terminal_states: [REJECTED, EXECUTED]
    transitions:
      - from: (none)
        to: REQUESTED
        trigger: "POST /euthanasia-decisions"
        actor: AdoptionCounselor
        preconditions:
          - "Animal.lifecycle_status == IN_CUSTODY"
        side_effects:
          - "set requested_by_user_id = caller X-User-ID"
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /euthanasia-decisions/{id}/approve"
        actor: Veterinarian
        preconditions:
          - "EuthanasiaDecision.status == REQUESTED"
          - "caller X-User-ID != requested_by_user_id (segregation of duties)"
        side_effects:
          - "set approved_by_user_id = caller X-User-ID, status = APPROVED"
      - from: REQUESTED
        to: REJECTED
        trigger: "POST /euthanasia-decisions/{id}/reject"
        actor: Veterinarian
        preconditions:
          - "EuthanasiaDecision.status == REQUESTED"
        side_effects: []
      - from: APPROVED
        to: EXECUTED
        trigger: "POST /euthanasia-decisions/{id}/execute"
        actor: Veterinarian
        preconditions:
          - "EuthanasiaDecision.status == APPROVED"
          - "Animal.lifecycle_status == IN_CUSTODY"
          - "clock now >= Animal.stray_hold_release_at"
        side_effects:
          - "drive Animal IN_CUSTODY -> EUTHANIZED (cascade, releasing kennel assignment)"

# =====================================================================
# §1.2.1 Concurrency Rules
# =====================================================================
concurrency_rules:
  - rule_id: kennel-assign-stale-version
    parent_entity: Kennel
    write_endpoint: "POST /kennel-assignments"
    occ_field: "expected_kennel_version"
    description: |
      Creating a KennelAssignment against a Kennel whose version has advanced
      since the client last observed it is rejected. This captures the case
      where another writer has already filled the single-occupancy kennel
      (its occupied_count rose and version advanced), so the current writer's
      view that the kennel was OPEN is stale. The losing create carries an
      expected_kennel_version below the kennel's current version and is
      rejected before any occupancy mutation.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =====================================================================
# §1.3 Calculation Rules Table
# =====================================================================
calculations:
  - name: adoption_fee
    trigger: "AdoptionApplication submit (provisional variant) and finalize (final variant)"
    algorithm: tiered_pricing
    formula: |
      # Evaluation order is pinned: age_band -> base -> microchip surcharge -> promo discount -> floor.
      age_band = PUPPY_KITTEN  if animal.age_months < 6
               = SENIOR        if animal.age_months >= 84
               = ADULT         otherwise
      base = BASE_FEE_CENTS[age_band]
      microchip_fee = 0 if animal.microchipped else MICROCHIP_SURCHARGE_CENTS
      gross = base + microchip_fee
      if shelter.promo_active:
          pct_off = round_half_up(gross * PROMO_PCT)        # nearest cent
          discount = max(PROMO_FLAT_CENTS, pct_off)         # nested max over 2 candidates + base inputs
      else:
          discount = 0
      fee = max(MIN_FEE_CENTS, gross - discount)
    input_set: "Single Animal + its Shelter. animal.microchipped and shelter.promo_active are read at the moment of evaluation."
    constants:
      BASE_FEE_CENTS: { PUPPY_KITTEN: 25000, ADULT: 15000, SENIOR: 5000 }
      MICROCHIP_SURCHARGE_CENTS: 2500
      PROMO_PCT: 0.20
      PROMO_FLAT_CENTS: 3000
      MIN_FEE_CENTS: 0
    precision: "integer cents; round_half_up when computing pct_off"
    variants:
      - name: provisional
        when: "computed at POST /adoption-applications (submit), stored in estimated_fee_cents"
        difference: "reads animal.microchipped and shelter.promo_active as they stand at submit time"
      - name: final
        when: "recomputed at POST /adoption-applications/{id}/finalize, stored in final_fee_cents"
        difference: "reads animal.microchipped and shelter.promo_active as they stand at finalize time; if the animal was microchipped or promo toggled in between, final_fee_cents != estimated_fee_cents"

  - name: actual_board_cost
    trigger: "KennelAssignment ACTIVE -> RELEASED (release or cascade)"
    algorithm: aggregation
    formula: |
      # Day count uses half-open interval [start_at, end_at): occupancy of any part of a
      # calendar-equivalent 24h window counts as one full day; minimum one day.
      occupied_days = max(1, ceil((end_at - start_at) / 24h))
      daily_base = shelter.dog_daily_board_cents if animal.species == DOG
                 else shelter.cat_daily_board_cents
      # Rounding order is PINNED: round the per-day charged amount FIRST, then sum across days.
      daily_charged = round_half_up(daily_base * (1 + CARE_FEE_PCT))
      actual_board_cents = daily_charged * occupied_days
      # The forbidden alternative round_half_up(daily_base * (1+CARE_FEE_PCT) * occupied_days)
      # yields a different total and is NOT used.
    input_set: "Single KennelAssignment + its Animal + the Shelter board rates."
    constants:
      CARE_FEE_PCT: 0.075
      HOURS_PER_DAY: 24
    precision: "integer cents; round_half_up per day, then integer multiply"
    variants:
      - name: provisional_projection
        when: "informational projection at kennel assignment, GET /kennel-assignments/{id}/projected-board"
        difference: "forward-looking: projects occupied_days from start_at to the animal's stray_hold_release_at (expected earliest release) rather than the actual end_at; on a STRAY this assumes the full hold, diverging from the actual chronological cost when released earlier"
      - name: actual
        when: "chronological, computed at release using the real end_at"
        difference: "uses the actual occupied interval; this is the value stored in actual_board_cents"

  - name: stray_hold_release
    trigger: "POST /intake-records (intake transition)"
    algorithm: threshold
    formula: |
      if source == STRAY:
          stray_hold_release_at = intake_at + (shelter.stray_hold_days * 24h)
      else:  # SURRENDER, TRANSFER
          stray_hold_release_at = intake_at
      # Downstream gate uses >= : an action at exactly stray_hold_release_at is permitted;
      # one instant before is rejected.
    input_set: "Single IntakeRecord.source + Shelter.stray_hold_days + intake_at."
    constants:
      HOURS_PER_DAY: 24
    precision: "datetime, millisecond ISO 8601 UTC"

  - name: foster_home_occupancy
    trigger: "FosterPlacement create (+1) and return (-1)"
    algorithm: aggregation
    formula: |
      active_placement_count = count of FosterPlacement
                               where foster_home_id == home.id AND status == ACTIVE
      # Aggregate-capacity gate: a new ACTIVE placement is allowed only while
      # active_placement_count < max_concurrent (strict <, boundary at equality rejects).
    input_set: "All FosterPlacements at the home filtered to status == ACTIVE."
    precision: "integer count"

# =====================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =====================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and well-formed"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all except POST /shelters bootstrap"
  - priority: 2
    category: auth
    check: "caller's role is permitted for the endpoint per §1.7"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "every path id and every FK in the body resolves to an existing resource, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all id-bearing endpoints"
  - priority: 4
    category: existence
    check: "required body fields present and of correct type; enum fields hold a declared member"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "all write endpoints"
  - priority: 4
    category: business_constraint
    check: "pagination limit within [1,100] and offset >= 0"
    error_id: ERR_VALIDATION_LIMIT
    http_status: 422
    applies_to: "all list (GET collection) endpoints"
  - priority: 5
    category: state
    check: "target resource is in a state from which the requested transition is defined"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"
  - priority: 6
    category: business_referential
    check: "OwnerClaim approve / euthanasia execute: proof_chip_number (claim) matches an existing Microchip.chip_number on the same animal"
    error_id: ERR_CHIP_MISMATCH
    http_status: 409
    applies_to: "POST /owner-claims/{id}/approve"
  - priority: 7
    category: business_safety
    check: "segregation of duties — euthanasia approver X-User-ID must differ from the decision's requested_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: "POST /euthanasia-decisions/{id}/approve"
  - priority: 8
    category: business_temporal
    check: "stray-hold gate — make-available, euthanasia execute require clock now >= Animal.stray_hold_release_at"
    error_id: ERR_STRAY_HOLD_ACTIVE
    http_status: 409
    applies_to: "POST /animals/{id}/make-available, POST /euthanasia-decisions/{id}/execute"
  - priority: 9
    category: business_safety
    check: "make-available and adoption approve require Animal.medical_status == CLEARED"
    error_id: ERR_NOT_MEDICALLY_CLEARED
    http_status: 409
    applies_to: "POST /animals/{id}/make-available, POST /adoption-applications/{id}/approve"
  - priority: 10
    category: business_constraint
    check: "kennel temporal/occupancy — kennel must be OPEN and no ACTIVE assignment may overlap [start_at, end_at) on it"
    error_id: ERR_KENNEL_OCCUPIED
    http_status: 409
    applies_to: "POST /kennel-assignments"
  - priority: 11
    category: business_constraint
    check: "foster aggregate capacity — FosterHome.active_placement_count must be < max_concurrent"
    error_id: ERR_FOSTER_HOME_FULL
    http_status: 409
    applies_to: "POST /foster-placements"
  - priority: 12
    category: business_temporal
    check: "foster cooldown — new placement start_at must be >= cooldown_days after the most recent RETURNED placement's end_at at this home"
    error_id: ERR_FOSTER_COOLDOWN
    http_status: 409
    applies_to: "POST /foster-placements"
  - priority: 13
    category: business_constraint
    check: "single-active-application — no second AdoptionApplication may be APPROVED/FINALIZED while another is APPROVED/FINALIZED for the same animal"
    error_id: ERR_APPLICATION_CONFLICT
    http_status: 409
    applies_to: "POST /adoption-applications/{id}/approve"
  - priority: 14
    category: business_constraint
    check: "microchip uniqueness — chip_number must be globally unique"
    error_id: ERR_DUPLICATE_CHIP
    http_status: 409
    applies_to: "POST /microchips"
  - priority: 14
    category: business_constraint
    check: "adopter email uniqueness — email must be globally unique across AdopterAccounts"
    error_id: ERR_DUPLICATE_EMAIL
    http_status: 409
    applies_to: "POST /adopter-accounts"
  - priority: 15
    category: business_constraint
    check: "OCC — expected_kennel_version must equal Kennel.version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /kennel-assignments"

# =====================================================================
# §1.5 API Endpoint Table
# =====================================================================
endpoints:
  # ---- Shelter (singleton config + ledger) ----
  - method: POST
    path: "/shelters"
    description: "Bootstrap the shelter configuration"
    roles: [ShelterAdmin]
    code: 201
    input:
      - "name"
      - "stray_hold_days?"
      - "promo_active?"
      - "dog_daily_board_cents?"
      - "cat_daily_board_cents?"
    output: Shelter
    side_effects: []
  - method: GET
    path: "/shelters/{id}"
    description: "Read shelter config + ledger"
    roles: [ShelterAdmin, IntakeOfficer, AdoptionCounselor, Veterinarian, FosterCoordinator]
    code: 200
    input: []
    output: Shelter
    side_effects: []
  - method: PATCH
    path: "/shelters/{id}"
    description: "Update shelter policy (e.g., toggle promo_active, change stray_hold_days)"
    roles: [ShelterAdmin]
    code: 200
    input:
      - "stray_hold_days?"
      - "promo_active?"
      - "dog_daily_board_cents?"
      - "cat_daily_board_cents?"
    output: Shelter
    side_effects: []

  # ---- Kennel ----
  - method: POST
    path: "/kennels"
    description: "Create a kennel"
    roles: [ShelterAdmin]
    code: 201
    input:
      - "label"
      - "capacity?"
    output: Kennel
    side_effects: []
  - method: GET
    path: "/kennels/{id}"
    description: "Read a kennel (occupied_count, status, version)"
    roles: [ShelterAdmin, IntakeOfficer, AdoptionCounselor, Veterinarian, FosterCoordinator]
    code: 200
    input: []
    output: Kennel
    side_effects: []
  - method: GET
    path: "/kennels"
    description: "List kennels"
    roles: [ShelterAdmin, IntakeOfficer, AdoptionCounselor, Veterinarian, FosterCoordinator]
    code: 200
    input:
      - "status?"
      - "limit?"
      - "offset?"
    output: Kennel[]
    side_effects: []

  # ---- Animal ----
  - method: POST
    path: "/animals"
    description: "Register an animal record (pre-intake)"
    roles: [ShelterAdmin, IntakeOfficer]
    code: 201
    input:
      - "name"
      - "species"
      - "age_months"
    output: Animal
    side_effects: ["lifecycle_status=INTAKE_PENDING, medical_status=UNEXAMINED"]
  - method: GET
    path: "/animals/{id}"
    description: "Read an animal (both state axes, microchipped, stray_hold_release_at)"
    roles: [ShelterAdmin, IntakeOfficer, AdoptionCounselor, Veterinarian, FosterCoordinator, Adopter]
    code: 200
    input: []
    output: Animal
    side_effects: []
  - method: GET
    path: "/animals"
    description: "List animals with filters"
    roles: [ShelterAdmin, IntakeOfficer, AdoptionCounselor, Veterinarian, FosterCoordinator, Adopter]
    code: 200
    input:
      - "lifecycle_status?"
      - "medical_status?"
      - "species?"
      - "limit?"
      - "offset?"
    output: Animal[]
    side_effects: []
  - method: POST
    path: "/animals/{id}/make-available"
    description: "Move a medically-cleared, hold-elapsed animal to AVAILABLE"
    roles: [AdoptionCounselor]
    code: 200
    input: []
    output: Animal
    side_effects: ["lifecycle_status IN_CUSTODY -> AVAILABLE"]

  # ---- IntakeRecord ----
  - method: POST
    path: "/intake-records"
    description: "Record an intake; drives Animal INTAKE_PENDING -> IN_CUSTODY and computes stray_hold_release_at"
    roles: [IntakeOfficer]
    code: 201
    input:
      - "animal_id"
      - "source"
      - "surrendering_party?"
    output: IntakeRecord
    side_effects: ["create IntakeRecord", "compute stray_hold_release_at", "Animal IN_CUSTODY"]
  - method: GET
    path: "/intake-records/{id}"
    description: "Read an intake record"
    roles: [ShelterAdmin, IntakeOfficer, AdoptionCounselor, Veterinarian]
    code: 200
    input: []
    output: IntakeRecord
    side_effects: []
  - method: GET
    path: "/intake-records"
    description: "List intake records, filterable by animal"
    roles: [ShelterAdmin, IntakeOfficer, AdoptionCounselor, Veterinarian]
    code: 200
    input:
      - "animal_id?"
      - "source?"
      - "limit?"
      - "offset?"
    output: IntakeRecord[]
    side_effects: []

  # ---- KennelAssignment ----
  - method: POST
    path: "/kennel-assignments"
    description: "Assign an in-custody animal to an OPEN kennel (OCC-guarded on kennel version)"
    roles: [IntakeOfficer]
    code: 201
    input:
      - "kennel_id"
      - "animal_id"
      - "expected_kennel_version"
    output: KennelAssignment
    side_effects: ["increment Kennel.occupied_count", "recompute Kennel.status", "increments Kennel.version by 1"]
  - method: GET
    path: "/kennel-assignments/{id}"
    description: "Read a kennel assignment"
    roles: [ShelterAdmin, IntakeOfficer, AdoptionCounselor, Veterinarian, FosterCoordinator]
    code: 200
    input: []
    output: KennelAssignment
    side_effects: []
  - method: GET
    path: "/kennel-assignments"
    description: "List kennel assignments, filterable by kennel or animal"
    roles: [ShelterAdmin, IntakeOfficer, AdoptionCounselor, Veterinarian, FosterCoordinator]
    code: 200
    input:
      - "kennel_id?"
      - "animal_id?"
      - "status?"
      - "limit?"
      - "offset?"
    output: KennelAssignment[]
    side_effects: []
  - method: GET
    path: "/kennel-assignments/{id}/projected-board"
    description: "Forward-looking projected board cost (provisional variant) to expected stray-hold release"
    roles: [ShelterAdmin, IntakeOfficer, AdoptionCounselor]
    code: 200
    input: []
    output: "{ projected_board_cents: integer, projected_occupied_days: integer }"
    side_effects: []
  - method: POST
    path: "/kennel-assignments/{id}/release"
    description: "Manually release an active assignment (also fires as a cascade from animal outcomes)"
    roles: [ShelterAdmin, IntakeOfficer]
    code: 200
    input: []
    output: KennelAssignment
    side_effects: ["set end_at", "compute actual_board_cents", "decrement Kennel.occupied_count", "increments Kennel.version by 1"]

  # ---- MedicalRecord ----
  - method: POST
    path: "/medical-records"
    description: "Record an exam/spay-neuter/vaccination; EXAM advances medical_status"
    roles: [Veterinarian]
    code: 201
    input:
      - "animal_id"
      - "record_type"
      - "outcome?"
      - "notes?"
    output: MedicalRecord
    side_effects: ["EXAM CLEAR -> medical_status CLEARED; EXAM HOLD -> NEEDS_TREATMENT"]
  - method: GET
    path: "/medical-records/{id}"
    description: "Read a medical record"
    roles: [ShelterAdmin, Veterinarian, AdoptionCounselor]
    code: 200
    input: []
    output: MedicalRecord
    side_effects: []
  - method: GET
    path: "/medical-records"
    description: "List medical records, filterable by animal"
    roles: [ShelterAdmin, Veterinarian, AdoptionCounselor]
    code: 200
    input:
      - "animal_id?"
      - "record_type?"
      - "limit?"
      - "offset?"
    output: MedicalRecord[]
    side_effects: []

  # ---- Microchip ----
  - method: POST
    path: "/microchips"
    description: "Register a microchip for an animal (unique chip_number); sets Animal.microchipped"
    roles: [Veterinarian, ShelterAdmin]
    code: 201
    input:
      - "animal_id"
      - "chip_number"
      - "owner_name?"
      - "owner_phone?"
    output: Microchip
    side_effects: ["set Animal.microchipped = true"]
  - method: GET
    path: "/microchips/{id}"
    description: "Read a microchip registry entry"
    roles: [ShelterAdmin, Veterinarian, AdoptionCounselor, IntakeOfficer]
    code: 200
    input: []
    output: Microchip
    side_effects: []
  - method: GET
    path: "/microchips"
    description: "List/lookup microchips, filterable by animal or chip_number"
    roles: [ShelterAdmin, Veterinarian, AdoptionCounselor, IntakeOfficer]
    code: 200
    input:
      - "animal_id?"
      - "chip_number?"
      - "limit?"
      - "offset?"
    output: Microchip[]
    side_effects: []

  # ---- OwnerClaim ----
  - method: POST
    path: "/owner-claims"
    description: "Open a return-to-owner claim against an in-custody animal"
    roles: [ShelterAdmin, IntakeOfficer]
    code: 201
    input:
      - "animal_id"
      - "claimant_name"
      - "proof_chip_number?"
    output: OwnerClaim
    side_effects: []
  - method: GET
    path: "/owner-claims/{id}"
    description: "Read an owner claim"
    roles: [ShelterAdmin, IntakeOfficer, AdoptionCounselor]
    code: 200
    input: []
    output: OwnerClaim
    side_effects: []
  - method: GET
    path: "/owner-claims"
    description: "List owner claims, filterable by animal"
    roles: [ShelterAdmin, IntakeOfficer, AdoptionCounselor]
    code: 200
    input:
      - "animal_id?"
      - "status?"
      - "limit?"
      - "offset?"
    output: OwnerClaim[]
    side_effects: []
  - method: POST
    path: "/owner-claims/{id}/approve"
    description: "Approve a claim; cascades Animal IN_CUSTODY -> RECLAIMED and releases the kennel"
    roles: [ShelterAdmin]
    code: 200
    input: []
    output: OwnerClaim
    side_effects: ["Animal RECLAIMED", "release ACTIVE KennelAssignment", "decrement Kennel.occupied_count"]
  - method: POST
    path: "/owner-claims/{id}/deny"
    description: "Deny a claim"
    roles: [ShelterAdmin]
    code: 200
    input: []
    output: OwnerClaim
    side_effects: []

  # ---- AdopterAccount ----
  - method: POST
    path: "/adopter-accounts"
    description: "Register an adopter account"
    roles: [ShelterAdmin, AdoptionCounselor, Adopter]
    code: 201
    input:
      - "full_name"
      - "email"
      - "phone?"
    output: AdopterAccount
    side_effects: []
  - method: GET
    path: "/adopter-accounts/{id}"
    description: "Read an adopter account"
    roles: [ShelterAdmin, AdoptionCounselor, Adopter]
    code: 200
    input: []
    output: AdopterAccount
    side_effects: []

