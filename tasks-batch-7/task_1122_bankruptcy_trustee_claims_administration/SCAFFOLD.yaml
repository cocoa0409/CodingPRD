    side_effects: ["claim resolved per outcome", "case.allowed_claims_total_cents updated on ALLOW/PARTIAL", "case.version += 1"]

  - method: POST
    path: "/trustee/objections/{id}/withdraw"
    description: "Trustee withdraws objection -> claim back to UNDER_REVIEW"
    roles: [Trustee]
    code: 200
    input: []
    output: ClaimObjection
    side_effects: ["claim -> UNDER_REVIEW", "claim.objection_id = null", "case.version += 1"]

  # --- Asset ---
  - method: POST
