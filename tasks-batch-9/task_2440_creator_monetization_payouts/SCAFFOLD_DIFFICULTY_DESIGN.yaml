  - rule_id: transitive_cascade
    instances:
      - name: substantiate_investigation_five_hop_clawback_waterfall_cascade
        trigger_transition: "Investigation OPEN -> SUBSTANTIATED via POST /monetization/investigations/{investigation_id}/substantiate"
        depth: 5
        grounds:
          - "state_machines.Investigation.transitions[OPEN -> SUBSTANTIATED]"
          - calculations.clawback_waterfall
          - calculations.payout_state_resolution
          - calculations.eligibility_evaluation
          - entities.RevenueEvent.fields.status
          - entities.EarningsStatement.fields.clawback_applied_cents
          - entities.Creator.fields.outstanding_clawback_cents
          - entities.Creator.fields.payout_state
          - entities.Payout.fields.state
          - entities.LedgerEntry.fields.entry_type
          - "state_machines.EarningsStatement.transitions[status IN {FINALIZED, ADJUSTED} -> ADJUSTED]"
          - "state_machines.Payout.transitions[PENDING -> VOIDED]"
        distinguishing_aspect: |
          Depth 5, each hop caused strictly by the previous one and none of them
          a fan-out of the trigger: (1) SUBSTANTIATED sweeps the two in-window
          ACCRUED RevenueEvents to CLAWED_BACK and fixes clawback_base_cents
          30000; (2) BECAUSE a base now exists, the waterfall debits the only
          unattached FINALIZED statement, absorbing 15000 and flipping it to
          ADJUSTED; (3) BECAUSE 15000 of 30000 was recovered, one CLAWBACK
          LedgerEntry of -15000 is appended and the 15000 shortfall lands in
          Creator.outstanding_clawback_cents; (4) BECAUSE outstanding_clawback_cents
          is now positive, payout_state_resolution's top clause forces ARREARS,
          overriding the HOLD the open investigation had imposed; (5) BECAUSE the
          creator is in arrears, the still-PENDING Payout is VOIDED with a
          PAYOUT_REVERSAL of +30000 and its statement is detached. The freed
          statement is deliberately NOT re-swept, so it keeps
          clawback_applied_cents 0.
        test_recipe:
          setup:
            - "Clock starts at 2026-08-01T00:00:00Z and is later moved once to 2026-09-01T00:00:00Z."
            - "One US Creator, payout_method BANK_TRANSFER, follower_count 10000, watch_time_minutes_365d 240000, evaluated to ELIGIBLE, with a VERIFIED W9 TaxProfile (tin_provided true) so every statement resolves to 0 bps withholding."
            - "A TIPS RevenueProduct (5000/5000, min_payable_cents 0)."
            - "Period P1 [2026-07-01T00:00:00Z, 2026-08-01T00:00:00Z) held two ACCRUED events (gross 40000 on 2026-07-05 -> share 20000; gross 20000 on 2026-07-20 -> share 10000); P1 is CLOSED and its statement S1 is FINALIZED with creator_share_cents 30000, event_count 2, withholding_cents 0, net_payable_cents 30000."
            - "A Payout exists in PENDING with payable_before_fee_cents 30000, fee_cents 200, amount_cents 29800, and S1 is attached to it, so statement_payable_cents is 0 while it is in flight."
            - "Period P2 [2026-08-01T00:00:00Z, 2026-09-01T00:00:00Z) then held one ACCRUED event (gross 30000 on 2026-08-05 -> share 15000); P2 is CLOSED and statement S2 is FINALIZED with net_payable_cents 15000 and payout_id null, so S2 is the only waterfall bucket."
            - "PolicyReviewer reviewer-r1 opened an Investigation with hold_payouts true over the CLOSED window [2026-07-01T00:00:00Z, 2026-07-31T23:59:59Z]; hold_amount_cents was snapshotted at 15000 and payout_state became HOLD, so available_balance_cents is 0."
            - "Ledger before the trigger: ACCRUAL +20000, ACCRUAL +10000, PAYOUT_DEBIT -29800, PAYOUT_FEE -200, ACCRUAL +15000 -> ledger_balance_cents 15000."
          setup_api_calls:
            - call: "POST /monetization/creators"
              payload: { display_name: "Ivy Sweep", country_code: "US", follower_count: 10000, watch_time_minutes_365d: 240000, payout_method: "BANK_TRANSFER" }
              as: PlatformAdmin
              captures: { cr_id: "$.data.id" }
            - call: "POST /monetization/creators/${cr_id}/evaluate"
              payload: {}
              as: FinanceOperator
              captures: { cr_v2: "$.data.version" }
            - call: "POST /monetization/tax-profiles"
              payload: { creator_id: "${cr_id}", form_type: "W9", country_code: "US", tin_provided: true, treaty_claimed: false, expected_creator_version: "${cr_v2}" }
              as: FinanceOperator
              captures: { tp_id: "$.data.id" }
            - call: "POST /monetization/tax-profiles/${tp_id}/submit"
              payload: {}
              as: Creator
              as_user_id: "${cr_id}"
            - call: "POST /monetization/tax-profiles/${tp_id}/verify"
              payload: { decision: "VERIFY" }
              as: FinanceOperator
            - call: "POST /monetization/revenue-products"
              payload: { product_type: "TIPS", name: "Tips Flat", creator_share_bps: 5000, platform_fee_bps: 5000, min_payable_cents: 0 }
              as: PlatformAdmin
              captures: { tips_id: "$.data.id" }
            - call: "POST /monetization/earnings-periods"
              payload: { label: "2026-07", period_start: "2026-07-01T00:00:00Z", period_end: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { p1_id: "$.data.id" }
            - call: "POST /monetization/earnings-periods"
              payload: { label: "2026-08", period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { p2_id: "$.data.id" }
            - call: "POST /monetization/revenue-events"
              payload: { creator_id: "${cr_id}", product_id: "${tips_id}", gross_amount_cents: 40000, occurred_at: "2026-07-05T00:00:00Z" }
              as: FinanceOperator
              captures: { ev1_id: "$.data.id" }
            - call: "POST /monetization/revenue-events"
              payload: { creator_id: "${cr_id}", product_id: "${tips_id}", gross_amount_cents: 20000, occurred_at: "2026-07-20T00:00:00Z" }
              as: FinanceOperator
              captures: { ev2_id: "$.data.id" }
            - call: "POST /monetization/earnings-periods/${p1_id}/close"
              payload: {}
              as: FinanceOperator
            - call: "GET /monetization/earnings-statements"
              payload: { creator_id: "${cr_id}", period_id: "${p1_id}" }
              as: FinanceOperator
              captures: { s1_id: "$.data[0].id" }
            - call: "POST /monetization/earnings-statements/${s1_id}/finalize"
              payload: {}
              as: FinanceOperator
              captures: { s1_net: "$.data.net_payable_cents" }
            - call: "POST /monetization/payouts"
              payload: { creator_id: "${cr_id}" }
              as: FinanceOperator
              captures: { po_id: "$.data.id", po_fee: "$.data.fee_cents", po_amount: "$.data.amount_cents" }
            - call: "POST /monetization/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /monetization/revenue-events"
              payload: { creator_id: "${cr_id}", product_id: "${tips_id}", gross_amount_cents: 30000, occurred_at: "2026-08-05T00:00:00Z" }
              as: FinanceOperator
              captures: { ev3_id: "$.data.id" }
            - call: "POST /monetization/earnings-periods/${p2_id}/close"
              payload: {}
              as: FinanceOperator
            - call: "GET /monetization/earnings-statements"
              payload: { creator_id: "${cr_id}", period_id: "${p2_id}" }
              as: FinanceOperator
              captures: { s2_id: "$.data[0].id" }
            - call: "POST /monetization/earnings-statements/${s2_id}/finalize"
              payload: {}
              as: FinanceOperator
              captures: { s2_net: "$.data.net_payable_cents" }
            - call: "POST /monetization/investigations"
              payload: { creator_id: "${cr_id}", scope: "Suspected incentivised-view farm during July.", violation_window_start: "2026-07-01T00:00:00Z", violation_window_end: "2026-07-31T23:59:59Z", hold_payouts: true }
              as: PolicyReviewer
              as_user_id: "reviewer-r1"
              captures: { inv_id: "$.data.id", inv_hold: "$.data.hold_amount_cents" }
            - call: "GET /monetization/creators/${cr_id}"
              payload: {}
              as: FinanceOperator
              captures: { pre_state: "$.data.payout_state", pre_ledger: "$.data.ledger_balance_cents" }
          trigger:
            - call: "POST /monetization/investigations/${inv_id}/substantiate"
              payload: { finding: "Confirmed: 62 percent of July watch time originated from a paid view farm." }
              as: PolicyReviewer
              as_user_id: "reviewer-r2"
              captures: { inv_base: "$.data.clawback_base_cents", inv_rec: "$.data.clawback_recovered_cents", inv_unrec: "$.data.clawback_unrecovered_cents" }
          assert:
            - "${s1_net} == 30000 and ${s2_net} == 15000 and ${po_fee} == 200 and ${po_amount} == 29800"
            - "${inv_hold} == 15000 and ${pre_state} == HOLD and ${pre_ledger} == 15000"
            - "hop 1: Investigation.${inv_id}.state == SUBSTANTIATED, resolved_by_user_id == 'reviewer-r2', resolved_at == '2026-09-01T00:00:00.000Z', ${inv_base} == 30000"
            - "hop 1: RevenueEvent.${ev1_id}.status == CLAWED_BACK and RevenueEvent.${ev2_id}.status == CLAWED_BACK and RevenueEvent.${ev3_id}.status == ACCRUED (2026-08-05 is outside the closed window)"
            - "hop 1: Creator.${cr_id}.active_strike_count == 1 and eligibility_status == SUSPENDED and last_evaluation_failed_criteria == ['POLICY_COMPLIANCE']"
            - "hop 2: EarningsStatement.${s2_id}.status == ADJUSTED and clawback_applied_cents == 15000 and net_payable_cents == 15000 (net_payable_cents is never rewritten)"
            - "hop 2: ${inv_rec} == 15000 and ${inv_unrec} == 15000 (S1 was attached to a Payout and therefore was NOT a bucket)"
            - "hop 3: GET /monetization/creators/${cr_id}/ledger-entries?entry_type=CLAWBACK returns exactly one row with amount_cents == -15000 and source_entity == INVESTIGATION and source_id == ${inv_id}"
            - "hop 3: Creator.${cr_id}.outstanding_clawback_cents == 15000"
            - "hop 4: Creator.${cr_id}.payout_state == ARREARS (ARREARS outranks the HOLD that the same investigation was imposing)"
            - "hop 5: Payout.${po_id}.state == VOIDED and settled_at == null"
            - "hop 5: GET /monetization/creators/${cr_id}/ledger-entries?entry_type=PAYOUT_REVERSAL returns exactly one row with amount_cents == 30000 and source_entity == PAYOUT and source_id == ${po_id}"
            - "hop 5: EarningsStatement.${s1_id}.payout_id == null and status == FINALIZED and clawback_applied_cents == 0 (statements freed by hop 5 are not re-swept in the same request)"
            - "Creator.${cr_id}.consecutive_payment_failures == 0 (a void is not a payment failure)"
            - "Creator.${cr_id}.ledger_balance_cents == 30000 (15000 - 15000 + 30000) and held_cents == 0 and available_balance_cents == 30000"
            - "GET /monetization/creators/${cr_id}/ledger-entries returns 7 rows in occurred_at order: ACCRUAL +20000, ACCRUAL +10000, PAYOUT_DEBIT -29800, PAYOUT_FEE -200, ACCRUAL +15000, CLAWBACK -15000, PAYOUT_REVERSAL +30000"

      - name: rate_content_red_three_hop_accrual_reversal_cascade
        trigger_transition: "ContentItem suitability_rating UNRATED -> RED via POST /monetization/content-items/{content_item_id}/rate"
        depth: 3
        grounds:
          - "endpoints.POST /monetization/content-items/{content_item_id}/rate"
          - entities.ContentItem.fields.suitability_rating
          - entities.ContentItem.fields.monetization_state
          - calculations.revenue_share_split
          - entities.RevenueEvent.fields.effective_share_bps
          - entities.RevenueEvent.fields.status
          - entities.LedgerEntry.fields.entry_type
          - entities.Creator.fields.ledger_balance_cents
        distinguishing_aspect: |
          A different triggering transition (a ContentItem re-rating, not an
          Investigation resolution) drives a strictly serial depth-3 chain:
          (1) the rating write flips suitability_rating to RED and derives
          monetization_state DEMONETIZED; (2) BECAUSE the item's rating moved and
          the product is suitability_sensitive, every ACCRUED event on that item
          is re-scored under RESCORE_ON_RERATING with
          SUITABILITY_MULT_BPS[RED] == 0, so effective_share_bps drops to 0 and
          the RED-specific status REVERSED (not BELOW_MINIMUM) is written;
          (3) BECAUSE each re-scored delta is negative, one ACCRUAL_REVERSAL
          LedgerEntry per event is appended in occurred_at ASC order with
          running balance_after_cents 4000 then 0.
        test_recipe:
          setup:
            - "One GB Creator (follower_count 10000, watch_time_minutes_365d 240000) evaluated to ELIGIBLE, lifetime_paid_cents 0."
            - "One ADVERTISING RevenueProduct with creator_share_bps 8000, platform_fee_bps 2000, min_payable_cents 0 (suitability_sensitive true)."
            - "One ContentItem of that creator published 2026-07-01T00:00:00Z, still at its default suitability_rating GREEN / monetization_state MONETIZED / rating_source DEFAULT."
            - "One OPEN period [2026-07-01T00:00:00Z, 2026-08-01T00:00:00Z) holding two ACCRUED events on that item: gross 10000 on 2026-07-05 -> effective_share_bps 8000, creator_share_cents 8000; gross 5000 on 2026-07-06 -> creator_share_cents 4000."
            - "Ledger before the trigger: ACCRUAL +8000 then ACCRUAL +4000, so ledger_balance_cents == 12000."
          setup_api_calls:
            - call: "POST /monetization/creators"
              payload: { display_name: "Jo Rerate", country_code: "GB", follower_count: 10000, watch_time_minutes_365d: 240000 }
              as: PlatformAdmin
              captures: { cr_id: "$.data.id" }
            - call: "POST /monetization/creators/${cr_id}/evaluate"
              payload: {}
              as: FinanceOperator
            - call: "POST /monetization/revenue-products"
              payload: { product_type: "ADVERTISING", name: "Ads Standard", creator_share_bps: 8000, platform_fee_bps: 2000, min_payable_cents: 0 }
              as: PlatformAdmin
              captures: { ads_id: "$.data.id" }
            - call: "POST /monetization/content-items"
              payload: { creator_id: "${cr_id}", title: "Street Interview", published_at: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { ci_id: "$.data.id" }
            - call: "POST /monetization/earnings-periods"
              payload: { label: "2026-07", period_start: "2026-07-01T00:00:00Z", period_end: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { p1_id: "$.data.id" }
            - call: "POST /monetization/revenue-events"
              payload: { creator_id: "${cr_id}", product_id: "${ads_id}", content_item_id: "${ci_id}", gross_amount_cents: 10000, occurred_at: "2026-07-05T00:00:00Z" }
              as: FinanceOperator
              captures: { ev1_id: "$.data.id", ev1_share: "$.data.creator_share_cents" }
            - call: "POST /monetization/revenue-events"
              payload: { creator_id: "${cr_id}", product_id: "${ads_id}", content_item_id: "${ci_id}", gross_amount_cents: 5000, occurred_at: "2026-07-06T00:00:00Z" }
              as: FinanceOperator
              captures: { ev2_id: "$.data.id", ev2_share: "$.data.creator_share_cents" }
          trigger:
            - call: "POST /monetization/content-items/${ci_id}/rate"
              payload: { suitability_rating: "RED", rating_source: "MANUAL", note: "Depicts unsafe stunts." }
              as: PolicyReviewer
              as_user_id: "reviewer-r1"
              captures: { ci_rating: "$.data.suitability_rating", ci_mon: "$.data.monetization_state" }
          assert:
            - "${ev1_share} == 8000 and ${ev2_share} == 4000 (GREEN accrual baseline)"
            - "hop 1: ${ci_rating} == RED and ${ci_mon} == DEMONETIZED"
            - "hop 1: ContentItem.${ci_id}.rating_source == MANUAL and last_rated_by_user_id == 'reviewer-r1' and last_rated_at == '2026-08-01T00:00:00.000Z'"
            - "hop 2: RevenueEvent.${ev1_id}.effective_share_bps == 0 and creator_share_cents == 0 and status == REVERSED and suitability_rating_at_accrual == RED"
            - "hop 2: RevenueEvent.${ev2_id}.effective_share_bps == 0 and creator_share_cents == 0 and status == REVERSED"
