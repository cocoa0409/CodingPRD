  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:

      - name: stale_hit_version_sweep_is_rejected_with_stale_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[hit-sweep-expired-stale-version]
          - errors.ERR_STALE_VERSION
        distinguishing_aspect: "After accepting an assignment bumps HIT.version to 2, a sweep carrying the pre-acceptance version 1 is rejected 412 ERR_STALE_VERSION even though the sweep itself is otherwise valid."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. One 1-slot 100c HIT with time_limit_minutes 300; W1 accepts the slot at T0, which advances the HIT version past the value observed at creation."
          setup_api_calls:
            - call: "POST /mkt/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /mkt/requesters"
              payload: { name: "Acme StaleSweep" }
              as: Anonymous
              captures: { rid: $.data.id }
            - call: "POST /mkt/requesters/${rid}/deposits"
              payload: { amount_cents: 1000 }
              as: Requester
              as_user_id: "${rid}"
              captures: { dep1: $.data.id }
            - call: "POST /mkt/requester-deposits/${dep1}/settle"
              payload: { outcome: "SUCCEEDED" }
              as: PlatformAdmin
            - call: "POST /mkt/hits"
              payload: { requester_id: "${rid}", title: "StaleSweep Probe", reward_cents: 100, max_assignments: 1, assignment_duration_minutes: 60, time_limit_minutes: 300 }
              as: Requester
              as_user_id: "${rid}"
              captures: { hit1: $.data.id, hit1_v1: $.data.version }
            - call: "POST /mkt/hits/${hit1}/publish"
              payload: {}
              as: Requester
              as_user_id: "${rid}"
            - call: "POST /mkt/workers"
              payload: { display_name: "W1 StaleSweep", country: "US" }
              as: Anonymous
              captures: { w1: $.data.id }
            - call: "POST /mkt/hits/${hit1}/assignments"
              payload: { worker_id: "${w1}" }
              as: Worker
              as_user_id: "${w1}"
              captures: { a1: $.data.id }
          trigger:
