              payload: {}
              as: UnderwritingReviewer
            - call: "POST /agents/${agent_a}/commission-schedules"
              payload: { line_of_business: "AUTO", effective_start: "2026-01-01T00:00:00Z", tiers: [{ up_to_cents: null, rate_pct: 0.10 }], contingent_bonus_eligible: false, expected_agent_version: "${agent_v} + 1" }
              as: CarrierAdmin
            - call: "POST /consumers"
              payload: { email: "c13@example.com", full_name: "Casey Thirteen", date_of_birth: "1990-01-01", home_state_code: "TX" }
              as: Anonymous
              captures: { cons_id: $.data.id }
            - call: "POST /quotes"
              payload: { consumer_id: "${cons_id}", product_id: "${p_flat}", channel: "AGENT", agent_id: "${agent_a}", coverages: [{ coverage_code: "FLAT", tier: "TIER_D" }] }
              as: Agent
              as_user_id: "${agent_a}"
              captures: { q1: $.data.id }
            - call: "POST /quotes/${q1}/submit"
              payload: {}
              as: Agent
              as_user_id: "${agent_a}"
            - call: "POST /quotes/${q1}/bind"
              payload: {}
              as: Agent
              as_user_id: "${agent_a}"
              captures: { pol1: $.data.id }
            - call: "POST /agents/${agent_a}/commission-statements"
              payload: { period_start: "2026-01-01T00:00:00Z", period_end: "2026-02-01T00:00:00Z" }
              as: CarrierAdmin
              captures: { stmt_id: $.data.id }
            - call: "POST /commission-statements/${stmt_id}/finalize"
              payload: {}
              as: CarrierAdmin
            - call: "POST /commission-statements/${stmt_id}/pay"
              payload: {}
              as: CarrierAdmin
            - call: "POST /_clock/set_current_utc"
