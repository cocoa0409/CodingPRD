  - section: validations
    instances:
      - name: request_missing_auth_headers_returns_unauthenticated
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request sent without X-User-Role / X-User-ID headers fails at priority 1 with 401 — before routing, existence, or any business check."
        test_recipe:
          setup: ["empty database; the request is dispatched with no auth headers (as: Anonymous marks the header-less call)"]
          setup_api_calls: []
          trigger:
            - { call: "GET /grillops/seasons/00000000-0000-4000-8000-000000000000", as: Anonymous, captures: { err: "$.data.error_id" } }
          assert:
            - "captured err == ERR_UNAUTHENTICATED (http 401) even though the season id would also 404 — auth precedes existence"

      - name: channel_rep_cannot_create_season_returns_unauthorized
        claim_type: violation_to_error
        grounds: ["validations[priority=2]", "errors[ERR_UNAUTHORIZED_ROLE]", roles.ChannelRep]
        distinguishing_aspect: "ChannelRep is absent from POST /grillops/seasons roles; the create is rejected 403 with ERR_UNAUTHORIZED_ROLE before any body validation."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /grillops/seasons", payload: { name: "Rogue Season", year: 2027, build_start: "2026-11-01T00:00:00Z", allocation_open: "2027-01-15T00:00:00Z", in_season_start: "2027-03-01T00:00:00Z", clearance_start: "2027-07-01T00:00:00Z", season_end: "2027-09-30T00:00:00Z", demand_forecast_units: 500 }, as: ChannelRep, as_user_id: "00000000-0000-4000-8000-0000000000bb", captures: { err: "$.data.error_id" } }
          assert:
            - "captured err == ERR_UNAUTHORIZED_ROLE (http 403); no season persisted"

      - name: channel_rep_cannot_accept_another_channels_allocation
        claim_type: violation_to_error
        grounds: ["validations[priority=4]", "errors[ERR_FORBIDDEN_OWNERSHIP]", roles.ChannelRep]
        distinguishing_aspect: "Ownership is identity-based: ChannelRep of CH-B holding the correct allocation version for CH-A's offer is rejected 403 ERR_FORBIDDEN_OWNERSHIP — the version being fresh does not help."
        test_recipe:
          setup: ["Season 2026 in ALLOCATION; channels CH-A and CH-B; one OFFERED allocation of 5 units addressed to CH-A"]
          setup_api_calls:
            - { call: "POST /grillops/_clock/set_current_utc", payload: { to_iso8601: "2026-02-01T00:00:00Z" }, as: PlannerAdmin }
            - { call: "POST /grillops/seasons", payload: { name: "Grilling Season 2026", year: 2026, build_start: "2026-01-05T00:00:00Z", allocation_open: "2026-02-01T00:00:00Z", in_season_start: "2026-03-01T00:00:00Z", clearance_start: "2026-08-01T00:00:00Z", season_end: "2026-09-30T00:00:00Z", demand_forecast_units: 1000 }, as: PlannerAdmin, captures: { s_id: "$.data.id" } }
            - { call: "POST /grillops/models", payload: { model_code: "GX-100", model_family: "GX", model_year: 2026, base_price_cents: 100000, demand_share_bp: 5000 }, as: PlannerAdmin, captures: { m_id: "$.data.id" } }
            - { call: "POST /grillops/channels", payload: { name: "CH-A", channel_type: "HOME_CENTER", allocation_priority: 10, credit_limit_cents: 100000000 }, as: PlannerAdmin, captures: { chA: "$.data.id" } }
            - { call: "POST /grillops/channels", payload: { name: "CH-B", channel_type: "SPECIALTY_DEALER", allocation_priority: 20, credit_limit_cents: 100000000 }, as: PlannerAdmin, captures: { chB: "$.data.id" } }
            - { call: "POST /grillops/seasons/${s_id}/lots", payload: { model_id: "${m_id}", build_week: "2026-W06", units_built: 10 }, as: PlannerAdmin }
            - { call: "POST /grillops/seasons/${s_id}/advance", payload: { target_status: "BUILD" }, as: PlannerAdmin }
            - { call: "POST /grillops/seasons/${s_id}/advance", payload: { target_status: "ALLOCATION" }, as: PlannerAdmin }
            - { call: "GET /grillops/seasons/${s_id}", as: PlannerAdmin, captures: { s_v2: "$.data.version" } }
            - { call: "POST /grillops/allocations", payload: { season_id: "${s_id}", channel_account_id: "${chA}", model_id: "${m_id}", allocated_units: 5, expected_season_version: "${s_v2}" }, as: PlannerAdmin, captures: { a_id: "$.data.id", a_v: "$.data.version" } }
          trigger:
            - { call: "POST /grillops/allocations/${a_id}/respond", payload: { action: "ACCEPT", expected_allocation_version: "${a_v}" }, as: ChannelRep, as_user_id: "${chB}", captures: { err: "$.data.error_id" } }
          assert:
            - "captured err == ERR_FORBIDDEN_OWNERSHIP (http 403): as_user_id ${chB} != allocation.channel_account_id ${chA}"
            - "Allocation.${a_id}.status remains OFFERED"

      - name: planner_cannot_accept_allocation_returns_unauthorized
        claim_type: violation_to_error
        grounds: ["validations[priority=2]", "errors[ERR_UNAUTHORIZED_ROLE]", roles.PlannerAdmin]
        distinguishing_aspect: "Action-level RBAC: PlannerAdmin is on the respond endpoint's role list but may only REVISE — ACCEPT from PlannerAdmin is ERR_UNAUTHORIZED_ROLE, enforcing the planner/channel segregation of duties."
        test_recipe:
          setup: ["Season 2026 in ALLOCATION; channel BigBox; one OFFERED allocation of 5"]
          setup_api_calls:
            - { call: "POST /grillops/_clock/set_current_utc", payload: { to_iso8601: "2026-02-01T00:00:00Z" }, as: PlannerAdmin }
            - { call: "POST /grillops/seasons", payload: { name: "Grilling Season 2026", year: 2026, build_start: "2026-01-05T00:00:00Z", allocation_open: "2026-02-01T00:00:00Z", in_season_start: "2026-03-01T00:00:00Z", clearance_start: "2026-08-01T00:00:00Z", season_end: "2026-09-30T00:00:00Z", demand_forecast_units: 1000 }, as: PlannerAdmin, captures: { s_id: "$.data.id" } }
            - { call: "POST /grillops/models", payload: { model_code: "GX-100", model_family: "GX", model_year: 2026, base_price_cents: 100000, demand_share_bp: 5000 }, as: PlannerAdmin, captures: { m_id: "$.data.id" } }
            - { call: "POST /grillops/channels", payload: { name: "BigBox", channel_type: "HOME_CENTER", allocation_priority: 10, credit_limit_cents: 100000000 }, as: PlannerAdmin, captures: { ch_id: "$.data.id" } }
            - { call: "POST /grillops/seasons/${s_id}/lots", payload: { model_id: "${m_id}", build_week: "2026-W06", units_built: 10 }, as: PlannerAdmin }
            - { call: "POST /grillops/seasons/${s_id}/advance", payload: { target_status: "BUILD" }, as: PlannerAdmin }
            - { call: "POST /grillops/seasons/${s_id}/advance", payload: { target_status: "ALLOCATION" }, as: PlannerAdmin }
            - { call: "GET /grillops/seasons/${s_id}", as: PlannerAdmin, captures: { s_v2: "$.data.version" } }
            - { call: "POST /grillops/allocations", payload: { season_id: "${s_id}", channel_account_id: "${ch_id}", model_id: "${m_id}", allocated_units: 5, expected_season_version: "${s_v2}" }, as: PlannerAdmin, captures: { a_id: "$.data.id", a_v: "$.data.version" } }
          trigger:
            - { call: "POST /grillops/allocations/${a_id}/respond", payload: { action: "ACCEPT", expected_allocation_version: "${a_v}" }, as: PlannerAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "captured err == ERR_UNAUTHORIZED_ROLE (http 403); allocation remains OFFERED"

      - name: assembler_cannot_start_job_assigned_to_peer
        claim_type: violation_to_error
        grounds: ["validations[priority=4]", "errors[ERR_FORBIDDEN_OWNERSHIP]", "errors[ERR_JOB_NOT_SCHEDULABLE]", "errors[ERR_ASSEMBLER_NOT_FOUND]", state_machines.AssemblyJob.SCHEDULED_to_IN_PROGRESS]
        distinguishing_aspect: "Three distinct rejections around job assignment: NO_SHOW on a REQUESTED job (state), ASSIGN naming an unknown assembler (existence), and START by a different certified assembler (ownership) — then the happy path proves the gates open."
        test_recipe:
          setup: ["Season 2026 IN_SEASON; DIRECT allocation 10; one sale; one REQUESTED RETAIL_ASSEMBLY job; certified assemblers ASM-A and ASM-B"]
          setup_api_calls:
            - { call: "POST /grillops/_clock/set_current_utc", payload: { to_iso8601: "2026-02-01T00:00:00Z" }, as: PlannerAdmin }
            - { call: "POST /grillops/seasons", payload: { name: "Grilling Season 2026", year: 2026, build_start: "2026-01-05T00:00:00Z", allocation_open: "2026-02-01T00:00:00Z", in_season_start: "2026-03-01T00:00:00Z", clearance_start: "2026-08-01T00:00:00Z", season_end: "2026-09-30T00:00:00Z", demand_forecast_units: 1000 }, as: PlannerAdmin, captures: { s_id: "$.data.id" } }
            - { call: "POST /grillops/models", payload: { model_code: "GX-100", model_family: "GX", model_year: 2026, base_price_cents: 100000, demand_share_bp: 5000 }, as: PlannerAdmin, captures: { m_id: "$.data.id" } }
            - { call: "POST /grillops/channels", payload: { name: "WebDirect", channel_type: "DIRECT", allocation_priority: 5, credit_limit_cents: 100000000 }, as: PlannerAdmin, captures: { ch_id: "$.data.id" } }
            - { call: "POST /grillops/seasons/${s_id}/lots", payload: { model_id: "${m_id}", build_week: "2026-W06", units_built: 50 }, as: PlannerAdmin }
            - { call: "POST /grillops/seasons/${s_id}/advance", payload: { target_status: "BUILD" }, as: PlannerAdmin }
            - { call: "POST /grillops/seasons/${s_id}/advance", payload: { target_status: "ALLOCATION" }, as: PlannerAdmin }
            - { call: "GET /grillops/seasons/${s_id}", as: PlannerAdmin, captures: { s_v2: "$.data.version" } }
            - { call: "POST /grillops/allocations", payload: { season_id: "${s_id}", channel_account_id: "${ch_id}", model_id: "${m_id}", allocated_units: 10, expected_season_version: "${s_v2}" }, as: PlannerAdmin, captures: { a_id: "$.data.id", a_v: "$.data.version" } }
            - { call: "POST /grillops/allocations/${a_id}/respond", payload: { action: "ACCEPT", expected_allocation_version: "${a_v}" }, as: ChannelRep, as_user_id: "${ch_id}" }
            - { call: "POST /grillops/_clock/set_current_utc", payload: { to_iso8601: "2026-04-01T00:00:00Z" }, as: PlannerAdmin }
            - { call: "POST /grillops/seasons/${s_id}/advance", payload: { target_status: "IN_SEASON" }, as: PlannerAdmin }
            - { call: "POST /grillops/sales", payload: { season_id: "${s_id}", model_id: "${m_id}", channel_account_id: "${ch_id}", quantity: 1, proof_of_purchase_token: "RCPT-P" }, as: ChannelRep, as_user_id: "${ch_id}", captures: { sale_id: "$.data.id" } }
            - { call: "POST /grillops/assembly-jobs", payload: { sale_id: "${sale_id}", job_type: "RETAIL_ASSEMBLY" }, as: ServiceAgent, captures: { j_id: "$.data.id" } }
            - { call: "POST /grillops/assemblers", payload: { name: "ASM-A", service_regions: ["NW"] }, as: PlannerAdmin, captures: { asmA: "$.data.id" } }
            - { call: "POST /grillops/assemblers/${asmA}/status", payload: { action: "CERTIFY" }, as: PlannerAdmin }
            - { call: "POST /grillops/assemblers", payload: { name: "ASM-B", service_regions: ["NW"] }, as: PlannerAdmin, captures: { asmB: "$.data.id" } }
            - { call: "POST /grillops/assemblers/${asmB}/status", payload: { action: "CERTIFY" }, as: PlannerAdmin }
          trigger:
            - { call: "POST /grillops/assembly-jobs/${j_id}/transition", payload: { action: "NO_SHOW" }, as: ServiceAgent, captures: { e1: "$.data.error_id" } }
            - { call: "POST /grillops/assembly-jobs/${j_id}/transition", payload: { action: "ASSIGN", assembler_id: "00000000-0000-4000-8000-0000000000cc", window_start: "2026-04-02T09:00:00Z", window_end: "2026-04-02T10:00:00Z" }, as: ServiceAgent, captures: { e2: "$.data.error_id" } }
            - { call: "POST /grillops/assembly-jobs/${j_id}/transition", payload: { action: "ASSIGN", assembler_id: "${asmA}", window_start: "2026-04-02T09:00:00Z", window_end: "2026-04-02T10:00:00Z" }, as: ServiceAgent, captures: { ok_st: "$.data.status" } }
            - { call: "POST /grillops/assembly-jobs/${j_id}/transition", payload: { action: "START" }, as: Assembler, as_user_id: "${asmB}", captures: { e3: "$.data.error_id" } }
            - { call: "POST /grillops/assembly-jobs/${j_id}/transition", payload: { action: "START" }, as: Assembler, as_user_id: "${asmA}", captures: { st2: "$.data.status" } }
          assert:
            - "captured e1 == ERR_JOB_NOT_SCHEDULABLE (NO_SHOW requires SCHEDULED; job was REQUESTED)"
            - "captured e2 == ERR_ASSEMBLER_NOT_FOUND (body reference existence)"
            - "captured ok_st == SCHEDULED"
            - "captured e3 == ERR_FORBIDDEN_OWNERSHIP (ASM-B starting ASM-A's job)"
            - "captured st2 == IN_PROGRESS (owner succeeds)"
