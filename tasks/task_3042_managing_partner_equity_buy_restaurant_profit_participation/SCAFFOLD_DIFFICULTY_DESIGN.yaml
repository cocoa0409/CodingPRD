            - "ProfitPeriod.${pp3_id}.market_override_cents == 300000 (5% of max(0, 6000000) under PER_RESTAURANT_POSITIVE)"
            - "identical revenue/cost data yields market_override_cents differing by exactly 150000 across the two bases"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: partner_share_marginal_tier_straddle
        grounds:
          - calculations.partner_share_tiering
          - state_machines.ProfitPeriod.COMPUTED_to_FINALIZED
        distinguishing_aspect: |
          Mode (a): >= 3 inputs with non-linear interaction — three marginal
          tier brackets with caps; a profit of 12000000 straddles all three
          tiers and must NOT be priced at the average (top) rate.
        test_recipe:
          setup:
            - "Logical clock at 2027-05-05T00:00:00Z. Restaurant R1 ACTIVE, contract C1 ACTIVE, no market group."
            - "Period PP4 [2027-04-01, 2027-05-01) OPEN with REVENUE 15000000 FINALIZED, LABOR 3000000 FINALIZED."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/partners"
              payload: { full_name: "Pat Morgan", email: "pm@x.com", role_in_program: "MANAGING_PARTNER" }
              as: HRRecruiter
              captures: { p1_id: $.data.id }
            - call: "POST /api/restaurants"
              payload: { name: "Roadhouse A", city: "Austin", state_code: "TX" }
              as: PlatformAdmin
              captures: { r1_id: $.data.id }
            - call: "POST /api/restaurants/${r1_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /api/managing-partner-contracts"
              payload: { partner_id: "${p1_id}", restaurant_id: "${r1_id}", term_start_date: "2027-01-01", term_end_date: "2032-01-01", buy_in_required_cents: 2500000 }
              as: CorporateController
              captures: { c1_id: $.data.id }
            - call: "POST /api/managing-partner-contracts/${c1_id}/submit"
              payload: {}
              as: CorporateController
            - call: "POST /api/managing-partner-contracts/${c1_id}/buy-in-payments"
              payload: { amount_cents: 2500000 }
              as: ManagingPartner
              as_user_id: "${p1_id}"
            - call: "POST /api/managing-partner-contracts/${c1_id}/activate"
              payload: {}
              as: CorporateController
            - call: "POST /api/profit-periods"
              payload: { restaurant_id: "${r1_id}", period_start_date: "2027-04-01", period_end_date: "2027-05-01" }
              as: OperationsAuditor
              captures: { pp4_id: $.data.id, pp4_v: $.data.version }
            - call: "POST /api/_clock/set_current_utc"
              payload: { current_utc: "2027-05-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/profit-periods/${pp4_id}/line-items"
              payload: { category: "REVENUE", amount_cents: 15000000, entry_status: "FINALIZED", expected_profit_period_version: "${pp4_v}" }
              as: OperationsAuditor
            - call: "GET /api/profit-periods/${pp4_id}"
              payload: {}
              as: OperationsAuditor
              captures: { pp4_v2: $.data.version }
            - call: "POST /api/profit-periods/${pp4_id}/line-items"
              payload: { category: "LABOR", amount_cents: 3000000, entry_status: "FINALIZED", expected_profit_period_version: "${pp4_v2}" }
              as: OperationsAuditor
            - call: "GET /api/profit-periods/${pp4_id}"
              payload: {}
              as: OperationsAuditor
              captures: { pp4_v3: $.data.version }
            - call: "POST /api/profit-periods/${pp4_id}/compute"
              payload: { expected_profit_period_version: "${pp4_v3}" }
              as: OperationsAuditor
          trigger:
            - call: "POST /api/profit-periods/${pp4_id}/finalize"
              payload: {}
              as: CorporateController
          assert:
            - "ProfitPeriod.${pp4_id}.final_distributable_profit_cents == 12000000"
            - "ProfitPeriod.${pp4_id}.partner_share_cents == 1140000 (8% of 5000000 = 400000 + 10% of 5000000 = 500000 + 12% of 2000000 = 240000 — marginal, NOT 12% of 12000000 = 1440000)"
            - "ProfitPeriod.${pp4_id}.market_override_cents == 0 (no market group)"
            - "ProfitPeriod.${pp4_id}.corporate_retained_cents == 10860000 (12000000 - 1140000 - 0)"

      - name: waste_charge_per_batch_rounding_beats_sum_then_round
        grounds:
          - calculations.meat_waste_charge
          - calculations.restaurant_profit_computation
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters — the scaffold pins
          round-per-batch-then-sum. Two batches with excess 0.005 lbs each at
          300 cents/lb give round_half_up(1.5)=2 per batch, consolidated 4;
          sum-then-round would give round_half_up(3.0)=3. Different cents.
        test_recipe:
          setup:
            - "Logical clock at 2027-06-10T00:00:00Z. Restaurant R1 ACTIVE, contract ACTIVE. YieldStandard cut RIB_1: expected_yield_pct 70, waste_tolerance_pct 0, standard_cost_per_lb_cents 300, active."
            - "Period PP5 [2027-06-01, 2027-07-01) OPEN with REVENUE 5000000 FINALIZED."
            - "Two RECORDED batches on PP5: each sub_primal_weight_lbs 10.000 (allowed waste = 3.000 lbs)."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/partners"
              payload: { full_name: "Pat Morgan", email: "pm@x.com", role_in_program: "MANAGING_PARTNER" }
              as: HRRecruiter
              captures: { p1_id: $.data.id }
            - call: "POST /api/restaurants"
              payload: { name: "Roadhouse A", city: "Austin", state_code: "TX" }
              as: PlatformAdmin
              captures: { r1_id: $.data.id }
            - call: "POST /api/restaurants/${r1_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /api/managing-partner-contracts"
              payload: { partner_id: "${p1_id}", restaurant_id: "${r1_id}", term_start_date: "2027-01-01", term_end_date: "2032-01-01", buy_in_required_cents: 2500000 }
              as: CorporateController
              captures: { c1_id: $.data.id }
            - call: "POST /api/managing-partner-contracts/${c1_id}/submit"
              payload: {}
              as: CorporateController
            - call: "POST /api/managing-partner-contracts/${c1_id}/buy-in-payments"
              payload: { amount_cents: 2500000 }
              as: ManagingPartner
              as_user_id: "${p1_id}"
            - call: "POST /api/managing-partner-contracts/${c1_id}/activate"
              payload: {}
              as: CorporateController
            - call: "POST /api/yield-standards"
              payload: { cut_code: "RIB_1", expected_yield_pct: 70, waste_tolerance_pct: 0, standard_cost_per_lb_cents: 300 }
              as: CorporateController
            - call: "POST /api/profit-periods"
              payload: { restaurant_id: "${r1_id}", period_start_date: "2027-06-01", period_end_date: "2027-07-01" }
              as: OperationsAuditor
              captures: { pp5_id: $.data.id, pp5_v: $.data.version }
            - call: "POST /api/_clock/set_current_utc"
              payload: { current_utc: "2027-06-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/profit-periods/${pp5_id}/line-items"
              payload: { category: "REVENUE", amount_cents: 5000000, entry_status: "FINALIZED", expected_profit_period_version: "${pp5_v}" }
              as: OperationsAuditor
            - call: "POST /api/meat-cut-batches"
              payload: { restaurant_id: "${r1_id}", profit_period_id: "${pp5_id}", cut_code: "RIB_1", sub_primal_weight_lbs: 10.0 }
              as: OperationsAuditor
              captures: { b1_id: $.data.id }
            - call: "POST /api/meat-cut-batches"
              payload: { restaurant_id: "${r1_id}", profit_period_id: "${pp5_id}", cut_code: "RIB_1", sub_primal_weight_lbs: 10.0 }
              as: OperationsAuditor
              captures: { b2_id: $.data.id }
            - call: "POST /api/meat-cut-batches/${b1_id}/audit"
              payload: { actual_yield_lbs: 6.995 }
              as: OperationsAuditor
            - call: "POST /api/meat-cut-batches/${b2_id}/audit"
              payload: { actual_yield_lbs: 6.995 }
              as: OperationsAuditor
            - call: "GET /api/profit-periods/${pp5_id}"
              payload: {}
              as: OperationsAuditor
              captures: { pp5_v2: $.data.version }
            - call: "POST /api/profit-periods/${pp5_id}/compute"
              payload: { expected_profit_period_version: "${pp5_v2}" }
              as: OperationsAuditor
          trigger:
            - call: "POST /api/profit-periods/${pp5_id}/finalize"
              payload: {}
              as: CorporateController
          assert:
            - "MeatCutBatch.${b1_id}.waste_charge_cents == 2 (excess 0.005 lbs * 300 = 1.5 -> round_half_up 2) and status == VARIANCE_CONFIRMED"
            - "MeatCutBatch.${b2_id}.waste_charge_cents == 2 and status == VARIANCE_CONFIRMED"
            - "ProfitPeriod.${pp5_id}.final_distributable_profit_cents == 4999996 (5000000 - 2 - 2; per-batch-then-sum; sum-then-round would wrongly give 4999997)"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: contract_renewal_cycle_extends_term_repeatedly
        grounds:
          - state_machines.ManagingPartnerContract.ACTIVE_to_RENEWAL_OFFERED
          - state_machines.ManagingPartnerContract.RENEWAL_OFFERED_to_ACTIVE
        distinguishing_aspect: |
          Cyclic machine on ManagingPartnerContract — ACTIVE -> RENEWAL_OFFERED
          -> ACTIVE twice in a row extends term_end_date twice and grows
          renewed_count to 2, and the expiry sweep must NOT fire between cycles
          even when the original term end passes.
        test_recipe:
          setup:
            - "Logical clock at 2031-06-01T00:00:00Z. ACTIVE contract C1, original term [2027-01-01, 2032-01-01), partner P1 placed."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
