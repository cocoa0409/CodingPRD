        distinguishing_aspect: "A CountyTreasurer calling open-protest on an already-FORMED district violates both authorization (priority 2, admin-only op) and state (priority 5, not PROPOSED); the authorization error ERR_UNAUTHORIZED wins — pair {auth, state}, distinct from {state, business_fiscal}."
