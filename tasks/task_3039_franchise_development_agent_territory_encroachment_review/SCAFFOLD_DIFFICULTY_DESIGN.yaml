            - call: "POST /impact-studies/${study_id}/finalize"
              payload: {}
              as: FranchisorOps
          assert:
            - "ImpactStudy.${study_id}.affected_store_count == 0 (empty input set)"
            - "ImpactStudy.${study_id}.provisional_impact_cents == 0 and final_impact_cents == 0"
            - "ImpactStudy.${study_id}.status == FINAL"
            - "a subsequent POST /site-applications/${app_id}/approve succeeds (zero-impact FINAL study satisfies the approval gate)"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: approve_requires_final_impact_study
        grounds:
          - state_machines.SiteApplication.transitions.IMPACT_REVIEW_to_APPROVED
          - errors.ERR_IMPACT_STUDY_NOT_FINAL
        distinguishing_aspect: |
          Entity pair SiteApplication -> ImpactStudy: the application's approve
          transition is gated on the linked study being FINAL; with the study
          still PROVISIONAL the approve is rejected with
          ERR_IMPACT_STUDY_NOT_FINAL, and succeeds only after finalize.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z (default)."
            - "Assigned territory, applicant franchisee; application in IMPACT_REVIEW with a PROVISIONAL study."
          setup_api_calls:
            - call: "POST /territories"
              payload: { code: "T-X1", region: "Cross", royalty_rate_pct: 0.08, development_quota_stores: 3 }
              as: FranchisorOps
              captures: { terr_id: $.data.id }
            - call: "POST /development-agents"
              payload: { legal_name: "KDP", contact_email: "da@kdp.example", agreement_start: "2026-01-01T00:00:00Z", agreement_end: "2031-01-01T00:00:00Z" }
              as: FranchisorOps
              captures: { da_id: $.data.id }
            - call: "POST /territories/${terr_id}/assign-agent"
              payload: { agent_id: "${da_id}" }
              as: FranchisorOps
            - call: "GET /territories/${terr_id}"
              payload: {}
              as: FranchisorOps
              captures: { terr_v: $.data.version }
            - call: "POST /franchisees"
              payload: { legal_name: "F2", contact_email: "f2@example.com" }
              as: FranchisorOps
              captures: { fr2: $.data.id }
            - call: "POST /site-applications"
              payload: { territory_id: "${terr_id}", applicant_franchisee_id: "${fr2}", proposed_address: "9 Oak", proposed_lat: 40.012, proposed_lng: -75.0, proposed_open_date: "2027-01-01T00:00:00Z", expected_territory_version: "${terr_v}" }
              as: DevelopmentAgent
              as_user_id: "${da_id}"
              captures: { app_id: $.data.id }
            - call: "POST /site-applications/${app_id}/submit"
              payload: {}
              as: DevelopmentAgent
              as_user_id: "${da_id}"
            - call: "POST /site-applications/${app_id}/impact-studies"
              payload: { radius_miles: 2.0 }
              as: FranchisorOps
              captures: { study_id: $.data.id }
          trigger:
            - call: "POST /site-applications/${app_id}/approve"
              payload: {}
              as: FranchisorOps
              captures: { err: $.data.error_id }
            - call: "POST /impact-studies/${study_id}/finalize"
              payload: {}
              as: FranchisorOps
            - call: "POST /site-applications/${app_id}/approve"
              payload: {}
              as: FranchisorOps
          assert:
            - "the first approve returns 422 and err == ERR_IMPACT_STUDY_NOT_FINAL"
            - "after finalize, the second approve returns 200 and SiteApplication.${app_id}.status == APPROVED"
            - "SiteApplication.${app_id}.store_id is non-null and references a PIPELINE store"

      - name: transfer_approve_requires_buyer_training_completed
        grounds:
          - state_machines.TransferRequest.transitions.PENDING_APPROVAL_to_APPROVED
          - state_machines.TransferRequest.transitions.BUYER_TRAINING_to_PENDING_APPROVAL
          - errors.ERR_BUYER_TRAINING_INCOMPLETE
        distinguishing_aspect: |
          Entity pair TransferRequest -> TrainingEnrollment (different pair than
          SiteApplication -> ImpactStudy): the request cannot leave BUYER_TRAINING
          until the buyer's enrollment flips COMPLETED, and the enrollment's
          record-result side effect — not the transfer endpoint — performs the
          advance.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z (default)."
            - "Territory with OPEN store S1 (owner FR1); transfer request TR1 to buyer FR2; buyer enrollment E1 (TRANSFER_BUYER) ENROLLED; TR1 advanced to BUYER_TRAINING."
          setup_api_calls:
            - call: "POST /territories"
              payload: { code: "T-X2", region: "Cross Two", royalty_rate_pct: 0.08, development_quota_stores: 3 }
              as: FranchisorOps
              captures: { terr_id: $.data.id }
            - call: "POST /franchisees"
              payload: { legal_name: "Seller", contact_email: "s@example.com" }
              as: FranchisorOps
              captures: { fr1: $.data.id }
            - call: "POST /franchisees"
              payload: { legal_name: "Buyer", contact_email: "b@example.com" }
              as: FranchisorOps
              captures: { fr2: $.data.id }
            - call: "POST /stores"
              payload: { store_number: "SX-2", territory_id: "${terr_id}", franchisee_id: "${fr1}", address: "1 X St", geo_lat: 40.0, geo_lng: -75.0, opened_on: "2020-01-01T00:00:00Z", estimated_weekly_sales_cents: 1000000, actual_avg_weekly_sales_cents: 1000000 }
              as: FranchisorOps
              captures: { s1: $.data.id, s1_v: $.data.version }
            - call: "POST /transfer-requests"
              payload: { store_id: "${s1}", buyer_franchisee_id: "${fr2}", sale_price_cents: 40000000, expected_store_version: "${s1_v}" }
              as: Franchisee
              as_user_id: "${fr1}"
              captures: { tr1: $.data.id }
            - call: "POST /training-enrollments"
              payload: { franchisee_id: "${fr2}", program_code: "TRANSFER_BUYER", expires_on: "2026-12-31T00:00:00Z" }
              as: FranchisorOps
              captures: { en1: $.data.id }
            - call: "POST /transfer-requests/${tr1}/advance-to-training"
              payload: {}
              as: FranchisorOps
            - call: "POST /transfer-requests/${tr1}/approve"
              payload: {}
              as: FranchisorOps
              captures: { err: $.data.error_id }
          trigger:
            - call: "POST /training-enrollments/${en1}/record-result"
              payload: { score: 85 }
              as: FranchisorOps
            - call: "POST /transfer-requests/${tr1}/approve"
              payload: {}
              as: FranchisorOps
          assert:
            - "the pre-completion approve returns 409 and err == ERR_INVALID_STATE (TR1 in BUYER_TRAINING, not PENDING_APPROVAL)"
            - "after record-result with score 85, TrainingEnrollment.${en1}.status == COMPLETED"
            - "the enrollment completion itself advances TransferRequest.${tr1}.status == PENDING_APPROVAL"
            - "the final approve returns 200 and TransferRequest.${tr1}.status == APPROVED"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: remodel_closure_half_open_buffer_conflict
        grounds:
          - state_machines.RemodelMandate.transitions.ISSUED_to_SCHEDULED
          - errors.ERR_CLOSURE_WINDOW_OVERLAP
          - errors.ERR_CLOSURE_BUFFER_VIOLATION
        distinguishing_aspect: |
          Half-open-with-buffer semantics on the Store resource: [start, end) —
          a window starting exactly at a prior closure_end is geometrically free
          of overlap yet still rejected by the 7-day buffer rule; only a start at
          or after closure_end + 7 days schedules cleanly.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z (default)."
            - "Assigned territory (agent DA) with OPEN store S1; mandate M1 SCHEDULED with closure [2026-10-01, 2026-10-15); mandates M2 and M3 ISSUED."
          setup_api_calls:
            - call: "POST /territories"
              payload: { code: "T-T1", region: "Temporal", royalty_rate_pct: 0.08, development_quota_stores: 3 }
              as: FranchisorOps
              captures: { terr_id: $.data.id }
            - call: "POST /development-agents"
              payload: { legal_name: "KDP", contact_email: "da@kdp.example", agreement_start: "2026-01-01T00:00:00Z", agreement_end: "2031-01-01T00:00:00Z" }
              as: FranchisorOps
              captures: { da_id: $.data.id }
            - call: "POST /territories/${terr_id}/assign-agent"
              payload: { agent_id: "${da_id}" }
              as: FranchisorOps
            - call: "POST /franchisees"
              payload: { legal_name: "F1", contact_email: "f1@example.com" }
              as: FranchisorOps
              captures: { fr1: $.data.id }
            - call: "POST /stores"
              payload: { store_number: "ST-1", territory_id: "${terr_id}", franchisee_id: "${fr1}", address: "1 T St", geo_lat: 40.0, geo_lng: -75.0, opened_on: "2020-01-01T00:00:00Z", estimated_weekly_sales_cents: 1000000, actual_avg_weekly_sales_cents: 1000000 }
              as: FranchisorOps
              captures: { s1: $.data.id }
            - call: "POST /remodel-mandates"
              payload: { store_id: "${s1}", due_by: "2026-12-31T00:00:00Z", financing_option: "SELF_FINANCED", estimated_cost_cents: 5000000 }
              as: FranchisorOps
              captures: { m1: $.data.id }
            - call: "POST /remodel-mandates/${m1}/schedule"
              payload: { closure_start: "2026-10-01T00:00:00Z", closure_end: "2026-10-15T00:00:00Z" }
              as: DevelopmentAgent
              as_user_id: "${da_id}"
            - call: "POST /remodel-mandates"
              payload: { store_id: "${s1}", due_by: "2026-12-31T00:00:00Z", financing_option: "SELF_FINANCED", estimated_cost_cents: 3000000 }
              as: FranchisorOps
              captures: { m2: $.data.id }
            - call: "POST /remodel-mandates"
              payload: { store_id: "${s1}", due_by: "2026-12-31T00:00:00Z", financing_option: "SELF_FINANCED", estimated_cost_cents: 3000000 }
              as: FranchisorOps
              captures: { m3: $.data.id }
          trigger:
            - call: "POST /remodel-mandates/${m2}/schedule"
              payload: { closure_start: "2026-10-15T00:00:00Z", closure_end: "2026-10-20T00:00:00Z" }
              as: DevelopmentAgent
              as_user_id: "${da_id}"
              captures: { err2: $.data.error_id }
            - call: "POST /remodel-mandates/${m3}/schedule"
              payload: { closure_start: "2026-10-22T00:00:00Z", closure_end: "2026-10-25T00:00:00Z" }
              as: DevelopmentAgent
              as_user_id: "${da_id}"
          assert:
            - "the M2 schedule returns 422 and err2 == ERR_CLOSURE_BUFFER_VIOLATION (start == prior end: no half-open overlap, but 0 days < 7-day buffer)"
            - "err2 != ERR_CLOSURE_WINDOW_OVERLAP"
            - "the M3 schedule at exactly closure_end + 7 days returns 200 and RemodelMandate.${m3}.status == SCHEDULED"
            - "RemodelMandate.${m3}.downtime_days == 3"

