  - rule_id: resource_temporal_overlap
    instances:
      - name: quote_window_expires_at_effective_minus_30d
        grounds:
          - state_machines.Quote.PROPOSED_to_EXPIRED
          - errors[ERR_QUOTE_NOT_PROPOSED]
        distinguishing_aspect: |
          Interval semantics = half-open occupation window on resource Quote: a PROPOSED quote
          occupies the window up to effective_date - 30 days; once the logical clock passes that
          cutoff (2026-12-02T00:00:00Z for effective 2027-01-01) the quote auto-transitions to
          EXPIRED and any later acceptance collides with the expired window
          (ERR_QUOTE_NOT_PROPOSED). Distinct resource and semantics from the claims-period instance.
        test_recipe:
          setup:
            - "Case QUOTED with quote Q PROPOSED, case effective_date 2027-01-01T00:00:00Z; clock at default 2026-08-01T00:00:00Z during setup"
          setup_api_calls:
            - { call: "POST /brokers", payload: { firm_name: "Apex Benefits", license_number: "LIC-CA-1001", state_code: "CA", commission_pct: 0.04 }, as: Underwriter, captures: { b: "$.data.id" } }
