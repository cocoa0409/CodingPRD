          - endpoints.POST_/counterfeit-reports/{report_id}/enforce
        distinguishing_aspect: "On a verified listing, a confirmed infringement whose suspect quantity exceeds the observed unit count is refused with ERR_COUNTERFEIT_OVERCOUNT — reaching the error that the §1.8 priority instance deliberately bypasses."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Licensor LICAB with a report on the verified listing VERIFIED-LIST-31 observing 40 units and no suspect quantity yet."
