        distinguishing_aspect: |
          Pair (business_referential vs business_fiscal): a payment with invalid amount_cents
          submitted when the org is suspended — the referential/standing check (priority 9)
          fires before the fiscal check (priority 16). (Uses a payment endpoint variant
          guarded by standing via agreement -> organization chain.)
        test_recipe:
          setup:
            - "Agreement A ACTIVE; Organization O suspended via breach on a different agreement"
