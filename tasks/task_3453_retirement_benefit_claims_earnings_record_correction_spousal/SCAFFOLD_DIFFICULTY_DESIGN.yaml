        as: SeniorAdjudicator
        as_user_id: sen-9
      - call: POST /ssa/correction-requests/${cor}/approve
        payload: {}
        as: ClaimsSpecialist
      assert:
      - 'After request-evidence: status == EVIDENCE_REQUESTED; after submit-evidence: PENDING_REVIEW (cycle 1 closed)'
      - 'After deny: status == DENIED with decided_by == ''spec-1''; after reopen by ''sen-9'': PENDING_REVIEW (cycle 2 closed)'
      - 'After approve: status == APPROVED'
      - EarningsYear(${wc}, 2023).posted_earnings_cents == 1925000 and corrected == true
