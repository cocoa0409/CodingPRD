            - "${det13a_route} == AUTHOR_PAYS"
            - "${det13a_covered} == 0"
            - "${det13a_agreement} == null"
            - "${det13a_reason} == NO_COVERAGE_AUTHOR_PAYS"
            - "${a13_fund_after_draft} == SELF_FUNDED"
            - "${ta13_status_active} == ACTIVE"
            - "${det13b_route} == TA_FULL"
            - "${det13b_covered} == 285000"
            - "${det13b_share} == 0"
            - "${det13b_agreement} == ${ta13_id}"
            - "${det13b_coverage} == ${cov13_id}"
            - "${det13b_quota_pos} == 1"
