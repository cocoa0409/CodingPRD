            - "${verified_post} == 284500.000"
            - "${rate_post} == 85.00"
            - "${credit_post} == 25500000.00"
            - "${claim_status_post} == SUBMITTED"
            - "${pending_post} == 25500000.00"
            - "${p3_net} == 250000.000"
            - "${cumulative_restored} == 549500.000"
