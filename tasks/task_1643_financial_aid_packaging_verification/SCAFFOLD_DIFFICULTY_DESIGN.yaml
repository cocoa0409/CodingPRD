                  - { efc_min: 500001, efc_max: 99999900, award_cents: 0 }
                verification_tracking_flag_rate: 0.50
              as: AidDirector
              captures: { ay_id: "$.data.id" }
            - call: "POST /api/fund-types"
              payload: { aid_year_id: "${ay_id}", fund_code: "SEOG", category: "FEDERAL_TITLE_IV", need_based: true, annual_cap_cents: 200000, pool_budget_cents: 350000, packaging_rank: 1, requires_verification_complete: false }
              as: AidDirector
              captures: { f_seog: "$.data.id" }
            - call: "POST /api/fund-types/${f_seog}/activate"
              payload: {}
              as: AidDirector
            - call: "POST /api/aid-years/${ay_id}/open"
              payload: {}
              as: AidDirector
            - call: "POST /api/students"
              payload: { ssn: "333445555", full_name: "Decliner A", email: "a@example.edu", residency: "IN_STATE", dependency_status: "DEPENDENT", enrollment_status: "FULL_TIME", grade_level: 1 }
              as: AidOfficer
              captures: { stu_a: "$.data.id" }
            - call: "POST /api/students"
              payload: { ssn: "123456789", full_name: "Holder B", email: "b@example.edu", residency: "IN_STATE", dependency_status: "DEPENDENT", enrollment_status: "FULL_TIME", grade_level: 1 }
              as: AidOfficer
              captures: { stu_b: "$.data.id" }
            - call: "POST /api/isir-records"
              payload: { student_id: "${stu_a}", aid_year_id: "${ay_id}", transaction_number: 1, received_at: "2026-02-01T00:00:00Z", household_size: 4, number_in_college: 1, agi_cents: 2000000, untaxed_income_cents: 0, asset_net_worth_cents: 0, cps_selection_flag: false }
              as: AidOfficer
            - call: "POST /api/isir-records"
              payload: { student_id: "${stu_b}", aid_year_id: "${ay_id}", transaction_number: 1, received_at: "2026-02-01T00:00:00Z", household_size: 4, number_in_college: 1, agi_cents: 2000000, untaxed_income_cents: 0, asset_net_worth_cents: 0, cps_selection_flag: false }
              as: AidOfficer
            - call: "POST /api/award-packages"
              payload: { student_id: "${stu_a}", aid_year_id: "${ay_id}" }
              as: AidOfficer
              captures: { pkg_a: "$.data.id" }
            - call: "POST /api/award-packages/${pkg_a}/build"
              payload: {}
              as: AidOfficer
            - call: "POST /api/award-packages/${pkg_a}/notify"
              payload: {}
              as: AidOfficer
            - call: "POST /api/award-packages"
              payload: { student_id: "${stu_b}", aid_year_id: "${ay_id}" }
              as: AidOfficer
              captures: { pkg_b: "$.data.id" }
            - call: "POST /api/award-packages/${pkg_b}/build"
              payload: {}
              as: AidOfficer
            - call: "POST /api/award-packages/${pkg_b}/notify"
              payload: {}
              as: AidOfficer
            - call: "GET /api/fund-types/${f_seog}"
              payload: {}
              as: AidOfficer
              captures: { seog_status_pre: "$.data.status" }
          trigger:
