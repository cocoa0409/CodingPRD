scenario: "2364. Outbound Contact Compliance (contact center compliance program): consent capture and storage by channel with express written consent requirements for marketing calls and texts, do-not-call list scrubbing against national, state and internal lists with scrub timing requirements, calling window enforcement by recipient time zone with holiday and emergency restrictions, dialer configuration with abandonment rate limits, call abandonment message requirements and answering machine detection rules, revocation of consent honored across channels with reasonable method acceptance and propagation timelines, wireless number identification with reassigned number database checks before dialing, complaint intake, litigation monitoring and pattern analysis, agent scripting, disclosure requirements and call recording consent by state"
domain_name: outbound-contact-compliance
api_prefix: /compliance

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: temporal_windowing
  complexity_layers:
    - rate_threshold_triggers
    - cascading_side_effects
    - dual_variant_calculation
    - optimistic_concurrency

  entity_topology: flat
  # Every entity is a peer collection under /compliance with FK references in the
  # body; the only nested URL paths are reverse-reachability reads
  # (GET /compliance/contacts/{id}/revocation-requests,
  #  GET /compliance/campaigns/{id}/scrub-jobs). No ownership tree.

  state_machine_shape: cyclic
  # ConsentRecord cycles ACTIVE -> SUSPENDED -> ACTIVE and REVOKED -> ACTIVE;
  # Campaign cycles ACTIVE -> SUSPENDED -> ACTIVE; DialerProfile cycles
  # APPROVED -> LOCKED -> APPROVED; AgentScript cycles DRAFT -> IN_REVIEW -> DRAFT;
  # RevocationRequest carries two independent state dimensions on one row
  # (intake_status and propagation_status advance under different triggers).

  relationship_patterns:
    - one_to_many          # Contact -> ConsentRecord / RevocationRequest / ContactAttempt / Complaint
    - cross_aggregate      # ContactAttempt references Campaign, Contact, ConsentRecord and CallingWindowPolicy
    - self_referential     # CallingWindowPolicy.supersedes_policy_id -> CallingWindowPolicy.id
    - polymorphic          # SuppressionEntry.list_type selects the matching rule (NATIONAL / STATE / INTERNAL)

  role_model: segregation_of_duties
  # The ComplianceOfficer user id that approved an AgentScript may never be the
  # ComplianceOfficer user id that certifies the launch of a Campaign pinned to
  # that script (ERR_SEGREGATION_OF_DUTIES).

  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: Contact
    parent: null
    common_fields: true
    fields:
      - name: phone_number
        type: string
        source: input
        description: E.164 phone number of the consumer
        constraints: "matches ^\\+[1-9][0-9]{7,14}$; unique across Contact rows"
      - name: state_code
        type: string
        source: input
        description: Two-letter US state code of the recipient; selects the CallingWindowPolicy that gates attempts
        constraints: "exactly two uppercase letters"
      - name: utc_offset_minutes
        type: integer
        source: input
        description: "Fixed offset of the recipient's local time from UTC; recipient_local_minutes = ((utc_hour*60 + utc_minute) + utc_offset_minutes) mod 1440"
        constraints: "-720 <= value <= 840"
      - name: time_zone_label
        type: string
        source: input
        description: IANA label shown to agents; display only, never used in any calculation
      - name: phone_type
        type: enum
        source: input
        description: Carrier classification captured at import
        default: UNKNOWN
        constraints: "one of WIRELESS, LANDLINE, UNKNOWN; UNKNOWN is treated as WIRELESS by the reassigned-number gate"
      - name: attempt_budget_total
        type: integer
        source: input
        description: Lifetime permitted-attempt allowance for this consumer (frequency cap)
        default: 3
        constraints: "1 <= value <= 20"
      - name: attempts_charged
        type: integer
        source: computed
        description: "Count of ContactAttempt rows with contact_id = this Contact and voided_at IS NULL"
        default: 0
      - name: attempt_budget_remaining
        type: integer
        source: computed
        description: "attempt_budget_total - attempts_charged; never below 0"
        default: 3
      - name: internal_dnc_status
        type: enum
        source: computed
        description: "SUPPRESSED iff (at least one ConsentRecord for this contact has status = REVOKED) OR risk_tier = CRITICAL; otherwise CLEAR"
        default: CLEAR
        constraints: "one of CLEAR, SUPPRESSED"
      - name: risk_tier
        type: enum
        source: computed
        description: "Derived from the maximum adjudicated_risk_score across this contact's Complaint rows with status = SUBSTANTIATED (see calculations.contact_risk_tier)"
        default: LOW
        constraints: "one of LOW, MEDIUM, HIGH, CRITICAL"
      - name: active_consent_count
        type: integer
        source: computed
        description: "Count of ConsentRecord rows for this contact with status = ACTIVE"
        default: 0
      - name: suspended_consent_count
        type: integer
        source: computed
        description: "Count of ConsentRecord rows for this contact with status = SUSPENDED"
        default: 0
      - name: revoked_consent_count
        type: integer
        source: computed
        description: "Count of ConsentRecord rows for this contact with status = REVOKED"
        default: 0
      - name: superseded_consent_count
        type: integer
        source: computed
        description: "Count of ConsentRecord rows for this contact with status = SUPERSEDED"
        default: 0
      - name: total_consent_count
        type: integer
        source: computed
        description: "Count of all ConsentRecord rows for this contact regardless of status; conserved quantity of calculations.consent_census_invariant"
        default: 0
      - name: rnd_result
        type: enum
        source: computed
        description: "Outcome of the most recent reassigned-number database check (POST /compliance/contacts/{id}/number-status-check)"
        default: NOT_CHECKED
        constraints: "one of NOT_CHECKED, NO_MATCH, REASSIGNED, NO_DATA"
      - name: rnd_checked_at
        type: datetime
        source: computed
        description: Timestamp of the most recent reassigned-number database check; null when never checked
      - name: rnd_claimed_consent_date
        type: string
        source: computed
        description: The consent date submitted to the reassigned-number database on the most recent check (YYYY-MM-DD); null when never checked
      - name: rnd_safe_harbor_eligible
        type: boolean
        source: computed
        description: "true iff rnd_result = NO_DATA (the database returned no record, which confers the safe harbour); false for every other rnd_result"
        default: false
      - name: overdue_propagation_count
        type: integer
        source: computed
        description: "Count of RevocationRequest rows for this contact with propagation_status = OVERDUE"
        default: 0

  - name: ConsentRecord
    parent: null
    common_fields: true
    fields:
      - name: contact_id
        type: string
        source: input
        description: "FK -> Contact.id; the consumer who granted this consent"
      - name: channel
        type: enum
        source: input
        description: Channel the consent covers
        constraints: "one of VOICE, SMS"
      - name: consent_type
        type: enum
        source: input
        description: Legal basis captured
        constraints: "one of EXPRESS_WRITTEN, EXPRESS_ORAL, ESTABLISHED_BUSINESS_RELATIONSHIP"
      - name: capture_method
        type: enum
        source: input
        description: How the consent was collected and stored
        constraints: "one of WEB_FORM, PAPER_FORM, IVR_RECORDING, SMS_DOUBLE_OPT_IN, AGENT_ATTESTATION"
      - name: disclosure_script_id
        type: string
        source: input
        description: "FK -> AgentScript.id; the script whose disclosure text was presented at capture"
      - name: disclosure_text_version
        type: integer
        source: input
        description: Version number of the disclosure text presented at capture; pinned and never rewritten
        constraints: "value >= 1"
      - name: signature_evidence
        type: string
        source: input
        description: "Stored evidence handle (signature image id, IVR recording id, or double opt-in token); required when consent_type = EXPRESS_WRITTEN"
      - name: captured_at
        type: datetime
        source: system
        description: Logical clock value at creation; sort key of the consent selector
      - name: status
        type: enum
        source: system
        description: Lifecycle status of the consent
        default: ACTIVE
        constraints: "one of ACTIVE, SUSPENDED, REVOKED, SUPERSEDED"
      - name: suspended_reason
        type: string
        source: computed
        description: Free-text reason recorded by the suspend transition; null otherwise
      - name: revoked_at
        type: datetime
        source: computed
        description: Clock value when the revocation cascade set status = REVOKED; null otherwise
      - name: reinstatement_count
        type: integer
        source: computed
        description: Number of times this record has been returned to ACTIVE by the reinstate transition
        default: 0

  - name: RevocationRequest
    parent: null
    common_fields: true
    fields:
      - name: contact_id
        type: string
        source: input
        description: "FK -> Contact.id; the consumer who asked to stop being contacted"
      - name: channel_received
        type: enum
        source: input
        description: Channel on which the revocation arrived
        constraints: "one of VOICE, SMS, EMAIL, WEB, MAIL"
      - name: method
        type: enum
        source: input
        description: Reasonable method the consumer used
        constraints: "one of REPLY_STOP, VERBAL_REQUEST, EMAIL_REQUEST, WEB_PORTAL, POSTAL_MAIL; REPLY_STOP requires channel_received = SMS"
      - name: scope
        type: enum
        source: input
        description: Which channels the revocation covers
        constraints: "one of ALL_CHANNELS, VOICE, SMS"
      - name: received_note
        type: string
        source: input
        description: Verbatim consumer wording captured at intake; optional
      - name: received_at
        type: datetime
        source: system
        description: Logical clock value at intake; base of the propagation deadline
      - name: intake_status
        type: enum
        source: system
        description: First independent state dimension; advanced by validate / reject
        default: RECEIVED
        constraints: "one of RECEIVED, VALIDATED, REJECTED"
      - name: propagation_status
        type: enum
        source: system
        description: Second independent state dimension on the same row; advanced by validate (to IN_PROGRESS) and propagate (to PROPAGATED or OVERDUE)
        default: NOT_STARTED
        constraints: "one of NOT_STARTED, IN_PROGRESS, PROPAGATED, OVERDUE"
      - name: propagation_deadline_at
        type: datetime
        source: computed
        description: "Computed at intake by calculations.propagation_deadline; the instant by which propagate must run to land PROPAGATED"
      - name: validated_at
        type: datetime
        source: computed
        description: Clock value when intake_status became VALIDATED; null otherwise
      - name: propagated_at
        type: datetime
        source: computed
        description: Clock value when propagation_status became PROPAGATED or OVERDUE; null otherwise
      - name: consent_records_revoked_count
        type: integer
        source: computed
        description: Number of ConsentRecord rows the validate cascade moved from ACTIVE or SUSPENDED to REVOKED
        default: 0
      - name: rejection_reason
        type: enum
        source: computed
        description: Reason recorded by the reject transition; null otherwise
        constraints: "one of NOT_CONSUMER, UNVERIFIABLE_IDENTITY, DUPLICATE"
      - name: target_systems
        type: array
        source: computed
        description: Downstream systems recorded by the propagate transition; null until propagate runs

  - name: SuppressionEntry
    parent: null
    common_fields: true
    fields:
      - name: list_type
        type: enum
        source: input
        description: Which do-not-call list this row belongs to
        constraints: "one of NATIONAL, STATE, INTERNAL"
      - name: phone_number
        type: string
        source: input
        description: E.164 number on the list
        constraints: "matches ^\\+[1-9][0-9]{7,14}$"
      - name: state_code
        type: string
        source: input
        description: State registry this row came from; required when list_type = STATE, ignored otherwise
        constraints: "exactly two uppercase letters when present"
      - name: source
        type: enum
        source: input
        description: Provenance of the row
        constraints: "one of FTC_DNC_DOWNLOAD, STATE_REGISTRY, CONSUMER_REQUEST, LITIGATION_HOLD"
      - name: source_refreshed_at
        type: datetime
        source: input
        description: When the source data behind this row was last refreshed; drives the list-currency check in scrub execution
      - name: status
        type: enum
        source: system
        description: Membership status
        default: ACTIVE
        constraints: "one of ACTIVE, REMOVED"
      - name: removed_at
        type: datetime
        source: computed
        description: Clock value when the row was removed; null while ACTIVE
      - name: removal_reason
        type: enum
        source: computed
        description: Why the row left the list; null while ACTIVE
        constraints: "one of CONSENT_REINSTATED, REGISTRY_DELISTING, DATA_ERROR"

  - name: ScrubJob
    parent: null
    common_fields: true
    fields:
      - name: campaign_id
        type: string
        source: input
        description: "FK -> Campaign.id; the campaign whose target set is scrubbed"
      - name: list_types
        type: array
        source: input
        description: "Which suppression lists this job scrubs against; non-empty subset of [NATIONAL, STATE, INTERNAL]"
        constraints: "length >= 1; values from NATIONAL, STATE, INTERNAL; no duplicates"
      - name: status
        type: enum
        source: system
        description: Job lifecycle
        default: PENDING
        constraints: "one of PENDING, COMPLETED, FAILED, SUPERSEDED, INVALIDATED"
      - name: requested_at
        type: datetime
        source: system
        description: Logical clock value at creation
      - name: completed_at
        type: datetime
        source: computed
        description: Clock value when execution produced COMPLETED; null otherwise
      - name: expires_at
        type: datetime
        source: computed
        description: "completed_at + SCRUB_VALIDITY_DAYS (see calculations.scrub_validity_window); null until COMPLETED"
      - name: contacts_scrubbed_count
        type: integer
        source: computed
        description: Contacts examined by this job
        default: 0
      - name: contacts_suppressed_count
        type: integer
        source: computed
        description: Examined contacts that matched a suppression source
        default: 0
      - name: eligible_target_count
        type: integer
        source: computed
        description: "contacts_scrubbed_count - contacts_suppressed_count; copied onto Campaign.eligible_target_count on COMPLETED"
        default: 0
      - name: failure_reason
        type: enum
        source: computed
        description: Why execution produced FAILED; null otherwise
        constraints: "one of STALE_OR_EMPTY_LIST"
      - name: invalidation_reason
        type: enum
        source: computed
        description: Why a COMPLETED job was invalidated; null otherwise
        constraints: "one of NEW_INTERNAL_SUPPRESSION"

  - name: Campaign
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Operator-facing campaign name
      - name: channel
        type: enum
        source: input
        description: Outbound channel this campaign dials or texts
        constraints: "one of VOICE, SMS"
      - name: campaign_purpose
        type: enum
        source: input
        description: Drives which consent basis the attempt gate demands
        constraints: "one of MARKETING, INFORMATIONAL, DEBT_COLLECTION"
      - name: target_state_codes
        type: array
        source: input
        description: States this campaign contacts; each needs an ACTIVE CallingWindowPolicy at launch
        constraints: "length >= 1; each element exactly two uppercase letters"
      - name: dialer_profile_id
        type: string
        source: input
        description: "FK -> DialerProfile.id; pacing, abandonment and AMD configuration"
      - name: agent_script_id
        type: string
        source: input
        description: "FK -> AgentScript.id; disclosure and recording-consent script"
      - name: status
        type: enum
        source: system
        description: Campaign lifecycle
        default: DRAFT
        constraints: "one of DRAFT, PENDING_LAUNCH, ACTIVE, SUSPENDED, CLOSED"
      - name: suspension_reason
        type: enum
        source: computed
        description: Why the campaign is SUSPENDED; null in every other status
        constraints: "one of MANUAL, ABANDONMENT_BREACH, SCRUB_STALE, EMERGENCY_RESTRICTION, PROFILE_LOCKED"
      - name: launch_certified_by_user_id
        type: string
        source: computed
        description: X-User-ID of the ComplianceOfficer who certified the launch; compared against AgentScript.approved_by_user_id by the segregation-of-duties rule
      - name: pinned_script_version
        type: integer
        source: computed
        description: AgentScript.version captured at launch; null before launch
      - name: latest_scrub_status
        type: enum
        source: computed
        description: "Status of the newest ScrubJob for this campaign ordered by requested_at DESC, tie-break created_at ASC; null when no job exists"
        constraints: "one of PENDING, COMPLETED, FAILED, SUPERSEDED, INVALIDATED"
      - name: eligible_target_count
        type: integer
        source: computed
        description: eligible_target_count of the newest COMPLETED ScrubJob; 0 when none
        default: 0
      - name: measurement_date
        type: string
        source: computed
        description: UTC calendar date (YYYY-MM-DD) the *_count_today fields describe; rolls over when an outcome is recorded on a later UTC date
      - name: live_answer_count_today
        type: integer
        source: computed
        description: "Attempts of this campaign with requested_at on measurement_date, voided_at IS NULL, outcome IN (CONNECTED_LIVE, ABANDONED)"
        default: 0
      - name: abandoned_count_today
        type: integer
        source: computed
        description: "Attempts of this campaign with requested_at on measurement_date, voided_at IS NULL, outcome = ABANDONED"
        default: 0
      - name: machine_count_today
        type: integer
        source: computed
        description: "Attempts of this campaign with requested_at on measurement_date, voided_at IS NULL, outcome = MACHINE_ANSWERED"
        default: 0
      - name: no_answer_count_today
        type: integer
        source: computed
        description: "Attempts of this campaign with requested_at on measurement_date, voided_at IS NULL, outcome = NO_ANSWER"
        default: 0
      - name: regulatory_abandonment_rate_pct
        type: number
        source: computed
        description: "Regulatory variant of calculations.abandonment_rate for measurement_date"
        default: 0.00
      - name: internal_abandonment_rate_pct
        type: number
        source: computed
        description: "Internal variant of calculations.abandonment_rate for measurement_date"
        default: 0.00
      - name: daily_rate_history
        type: array
        source: computed
        description: "Closed prior days, each { date, live_answer_count, abandoned_count, rate_pct }, appended when measurement_date rolls over; ordered by date ASC"
        default: []
      - name: rolling_compliance_rate_pct
        type: number
        source: computed
        description: "Seven-day mean of per-day regulatory rates (see calculations.rolling_compliance_rate)"
        default: 0.00
      - name: permitted_attempt_count
        type: integer
        source: computed
        description: "Count of ContactAttempt rows for this campaign with voided_at IS NULL"
        default: 0
      - name: voided_attempt_count
        type: integer
        source: computed
        description: "Count of ContactAttempt rows for this campaign with voided_at IS NOT NULL"
        default: 0

  - name: DialerProfile
    parent: null
    common_fields: true
    fields:
      - name: mode
        type: enum
        source: input
        description: Dialer pacing mode
        constraints: "one of PREVIEW, POWER, PREDICTIVE"
      - name: abandonment_limit_pct
        type: number
        source: input
        description: Operator-configured abandonment ceiling compared against the regulatory rate
        default: 3.00
        constraints: "0.01 <= value <= 100.00, two decimal places"
      - name: amd_enabled
        type: boolean
        source: input
        description: Whether answering machine detection runs; MACHINE_ANSWERED outcomes are only accepted when true
        default: false
      - name: amd_abandon_on_machine
        type: boolean
        source: input
        description: Whether a detected machine is dropped without an agent; recorded for audit, never changes the regulatory rate
        default: false
      - name: abandon_message_seconds
        type: integer
        source: input
        description: Length of the recorded abandonment message played on abandoned calls
        default: 2
        constraints: "1 <= value <= 10"
      - name: agents_available
        type: integer
        source: input
        description: Staffed agent count used by the pacing calculation
        constraints: "1 <= value <= 500"
      - name: requires_waiver
        type: boolean
        source: computed
        description: "true iff abandonment_limit_pct > REGULATORY_ABANDONMENT_CEILING_PCT (3.00); approval then demands waiver_reference"
        default: false
      - name: waiver_reference
        type: string
        source: computed
        description: Documented exception reference supplied at approval; null when requires_waiver is false
      - name: max_lines_last_computed
        type: integer
        source: computed
        description: "Most recent output of calculations.dialer_pacing_lines written by an attempt or an approval"
        default: 0
      - name: status
        type: enum
        source: system
        description: Configuration lifecycle
        default: DRAFT
        constraints: "one of DRAFT, APPROVED, LOCKED"
      - name: locked_reason
        type: enum
        source: computed
        description: Why the profile was locked; null otherwise
        constraints: "one of ABANDONMENT_BREACH"
      - name: approved_by_user_id
        type: string
        source: computed
        description: X-User-ID of the ComplianceOfficer who last approved this profile

  - name: AgentScript
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Script name shown to agents
      - name: channel
        type: enum
        source: input
        description: Channel this script is written for; must equal the Campaign channel that pins it
        constraints: "one of VOICE, SMS"
      - name: disclosure_blocks
        type: array
        source: input
        description: "Ordered disclosure blocks, each { block_type, text }; block_type one of IDENTIFICATION, PURPOSE, OPT_OUT, RECORDING_NOTICE"
        constraints: "length >= 1; must contain one IDENTIFICATION and one OPT_OUT block"
      - name: recording_consent_mode
        type: enum
        source: input
        description: Recording-consent posture the script satisfies
        constraints: "one of ONE_PARTY, ALL_PARTY"
      - name: covered_state_codes
        type: array
        source: input
        description: States whose disclosure requirements this script satisfies
        constraints: "length >= 1; each element exactly two uppercase letters"
      - name: status
        type: enum
        source: system
        description: Review lifecycle
        default: DRAFT
        constraints: "one of DRAFT, IN_REVIEW, APPROVED"
      - name: approved_by_user_id
        type: string
        source: computed
        description: X-User-ID of the approving ComplianceOfficer; the segregation-of-duties rule forbids this user from certifying a launch of a campaign pinned to this script
      - name: approved_at
        type: datetime
        source: computed
        description: Clock value at approval; null otherwise
      - name: change_note
        type: string
        source: computed
        description: Reviewer note recorded by the request-changes transition
      - name: review_cycle_count
        type: integer
        source: computed
        description: Number of times this script has been sent back to DRAFT by request-changes
        default: 0

  - name: CallingWindowPolicy
    parent: null
    common_fields: true
    fields:
      - name: state_code
        type: string
        source: input
        description: State this policy governs
        constraints: "exactly two uppercase letters"
      - name: window_start_local
        type: string
        source: input
        description: Earliest permitted recipient local time, HH:MM 24-hour
        constraints: "matches ^([01][0-9]|2[0-3]):[0-5][0-9]$"
      - name: window_end_local
        type: string
        source: input
        description: Exclusive end of the permitted recipient local window, HH:MM 24-hour
        constraints: "matches ^([01][0-9]|2[0-3]):[0-5][0-9]$; must be strictly after window_start_local"
      - name: window_start_minutes
        type: integer
        source: computed
        description: "window_start_local parsed to minutes after local midnight"
      - name: window_end_minutes
        type: integer
        source: computed
        description: "window_end_local parsed to minutes after local midnight"
      - name: holiday_dates
        type: array
        source: input
        description: "Recipient-local calendar dates (YYYY-MM-DD) on which no attempt may be placed and which are skipped when counting revocation propagation business days"
        default: []
      - name: recording_consent_regime
        type: enum
        source: input
        description: Recording-consent law of this state; ALL_PARTY demands an ALL_PARTY script for VOICE attempts
        constraints: "one of ONE_PARTY, ALL_PARTY"
      - name: effective_from
        type: datetime
        source: input
        description: Inclusive start of this policy's effective period
      - name: effective_to
        type: datetime
        source: input
        description: Exclusive end of this policy's effective period
        constraints: "must be strictly after effective_from"
      - name: supersedes_policy_id
        type: string
        source: input
        description: "FK -> CallingWindowPolicy.id; the ACTIVE policy for the same state that this one replaces; null for a first policy"
      - name: status
        type: enum
        source: system
        description: Whether this policy is still in force
        default: ACTIVE
        constraints: "one of ACTIVE, SUPERSEDED"
      - name: emergency_status
        type: enum
        source: system
        description: Emergency calling restriction for this state
        default: NONE
        constraints: "one of NONE, ACTIVE"
      - name: emergency_declared_at
        type: datetime
        source: computed
        description: Clock value when the emergency was declared; null when emergency_status = NONE
      - name: emergency_note
        type: string
        source: computed
        description: Declaring operator's note; null when emergency_status = NONE

  - name: ContactAttempt
    parent: null
    common_fields: true
    fields:
      - name: campaign_id
        type: string
        source: input
        description: "FK -> Campaign.id; the campaign placing the attempt"
      - name: contact_id
        type: string
        source: input
        description: "FK -> Contact.id; the consumer being contacted"
      - name: channel
        type: enum
        source: input
        description: Channel used; must equal Campaign.channel
        constraints: "one of VOICE, SMS"
      - name: consent_record_id
        type: string
        source: computed
        description: "FK -> ConsentRecord.id; the consent row the server selected as the legal basis (see calculations.consent_basis_selector)"
      - name: calling_window_policy_id
        type: string
        source: computed
        description: "FK -> CallingWindowPolicy.id; the policy row the server selected for the recipient state (see calculations.effective_calling_window)"
      - name: requested_at
        type: datetime
        source: system
        description: Logical clock value when the attempt was accepted
      - name: recipient_local_minutes
        type: integer
        source: computed
        description: "((requested_at UTC hour*60 + minute) + Contact.utc_offset_minutes) mod 1440"
      - name: recipient_local_time
        type: string
        source: computed
        description: recipient_local_minutes rendered HH:MM
      - name: effective_window_start_minutes
        type: integer
        source: computed
        description: Inclusive lower bound produced by calculations.effective_calling_window for this attempt
      - name: effective_window_end_minutes
        type: integer
        source: computed
        description: Exclusive upper bound produced by calculations.effective_calling_window for this attempt
      - name: cooldown_until
        type: datetime
        source: computed
        description: "requested_at + CONTACT_COOLDOWN_MINUTES; the closed interval [requested_at, cooldown_until] blocks further attempts on the same contact and channel"
      - name: max_lines_snapshot
        type: integer
        source: computed
        description: "Output of calculations.dialer_pacing_lines evaluated from state persisted before this attempt"
      - name: outcome
        type: enum
        source: system
        description: Disposition of the attempt
        default: PENDING
        constraints: "one of PENDING, CONNECTED_LIVE, ABANDONED, MACHINE_ANSWERED, NO_ANSWER, VOIDED"
      - name: agent_connect_seconds
        type: integer
        source: computed
        description: Seconds between live answer and agent connection, supplied when the outcome is recorded; null when not applicable
      - name: abandon_message_played
        type: boolean
        source: computed
        description: Whether the recorded abandonment message was played; must be true for an ABANDONED outcome
        default: false
      - name: outcome_recorded_at
        type: datetime
        source: computed
        description: Clock value when a non-PENDING outcome was recorded; null while PENDING
      - name: voided_at
        type: datetime
        source: computed
        description: Clock value when the attempt was voided; null otherwise
      - name: void_reason
        type: enum
        source: computed
        description: Why the attempt was voided; null otherwise
        constraints: "one of MISDIAL, CAMPAIGN_SUSPENDED, COMPLIANCE_CORRECTION"

  - name: Complaint
    parent: null
    common_fields: true
    fields:
      - name: contact_id
        type: string
        source: input
        description: "FK -> Contact.id; the complaining consumer"
      - name: campaign_id
        type: string
        source: input
        description: "FK -> Campaign.id; the campaign named in the complaint; null when the complaint is unattributed"
      - name: source
        type: enum
        source: input
        description: Where the complaint arrived from
        constraints: "one of DIRECT, STATE_AG, FTC, LITIGATION"
      - name: alleged_violation_type
        type: enum
        source: input
        description: What the consumer alleges
        constraints: "one of NO_CONSENT, DNC_VIOLATION, TIME_WINDOW, ABANDONMENT, RECORDING_CONSENT"
      - name: narrative
        type: string
        source: input
        description: Consumer's account as received
      - name: litigation_flag
        type: boolean
        source: input
        description: Whether counsel has been engaged on this matter
        default: false
      - name: received_at
        type: datetime
        source: system
        description: Logical clock value at intake; anchor of the verified-attempt lookback window
      - name: status
        type: enum
        source: system
        description: Adjudication status
        default: OPEN
        constraints: "one of OPEN, SUBSTANTIATED, DISMISSED"
      - name: provisional_risk_score
        type: number
        source: computed
        description: "Intake-time variant of calculations.complaint_risk_score"
      - name: adjudicated_risk_score
        type: number
        source: computed
        description: "Substantiation-time variant of calculations.complaint_risk_score; null until SUBSTANTIATED"
      - name: verified_attempt_count
        type: integer
        source: computed
        description: "Attempts counted by the substantiation lookback window; null until SUBSTANTIATED"
      - name: exposure_cents
        type: integer
        source: computed
        description: "Output of calculations.statutory_exposure; null until SUBSTANTIATED"
      - name: willful
        type: boolean
        source: computed
        description: Willfulness finding supplied at substantiation; null otherwise
      - name: finding_note
        type: string
        source: computed
        description: Investigator's finding recorded at substantiation; null otherwise
      - name: dismissal_note
        type: string
        source: computed
        description: Reason recorded at dismissal; null otherwise
      - name: pattern_cluster_size
        type: integer
        source: computed
        description: "Count of Complaint rows (this one included) with the same alleged_violation_type and the same campaign_id whose received_at falls in [this.received_at - PATTERN_WINDOW_DAYS, this.received_at]; recomputed for every row in the cluster on intake and on adjudication"
        default: 1

state_machines:
  - entity: Campaign
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: PENDING_LAUNCH
        trigger: "system event: a ScrubJob for this campaign reaches COMPLETED via POST /compliance/scrub-jobs/{id}/execute"
        actor: system
        preconditions:
          - "campaign.status == DRAFT"
          - "the executing ScrubJob passed the list-currency check and therefore landed COMPLETED (not FAILED)"
        side_effects:
          - "set Campaign.latest_scrub_status = COMPLETED"
          - "set Campaign.eligible_target_count = ScrubJob.eligible_target_count"
          - "increments Campaign.version by 1 and refreshes updated_at"
        note: "Compound/bubble-up: the campaign becomes launchable only because a child job completed. A campaign already in PENDING_LAUNCH stays in PENDING_LAUNCH and only its latest_scrub_status / eligible_target_count refresh."
      - from: PENDING_LAUNCH
        to: ACTIVE
        trigger: "POST /compliance/campaigns/{id}/launch"
        actor: ComplianceOfficer
        preconditions:
          - "campaign.status == PENDING_LAUNCH"
          - "payload expected_campaign_version == campaign.version"
          - "X-User-ID != AgentScript(campaign.agent_script_id).approved_by_user_id"
          - "AgentScript(campaign.agent_script_id).status == APPROVED and its channel == campaign.channel"
          - "DialerProfile(campaign.dialer_profile_id).status == APPROVED"
          - "the newest ScrubJob for this campaign has status == COMPLETED and expires_at > clock now"
          - "campaign.eligible_target_count >= 1"
          - "for every element of campaign.target_state_codes an ACTIVE CallingWindowPolicy covering clock now exists"
          - "for every element of campaign.target_state_codes that policy has emergency_status == NONE"
        side_effects:
          - "set Campaign.launch_certified_by_user_id = X-User-ID"
          - "set Campaign.pinned_script_version = AgentScript.version (version pinning; later script edits do not change it)"
          - "set Campaign.measurement_date = UTC date of clock now, all *_count_today = 0, both abandonment rates = 0.00"
          - "increments Campaign.version by 1"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /compliance/campaigns/{id}/suspend"
        actor: ComplianceOfficer
        preconditions: ["campaign.status == ACTIVE"]
        side_effects:
          - "set Campaign.suspension_reason = MANUAL"
          - "every ContactAttempt of this campaign with outcome == PENDING becomes outcome = VOIDED, voided_at = clock now, void_reason = CAMPAIGN_SUSPENDED"
          - "for each such voided attempt, its Contact.attempts_charged decreases by 1 and Contact.attempt_budget_remaining increases by 1 (calculations.attempt_budget_invariant holds)"
          - "increments Campaign.version by 1"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system event: abandonment breach detected while recording an outcome (POST /compliance/contact-attempts/{id}/outcome)"
        actor: system
        preconditions:
          - "campaign.status == ACTIVE"
          - "campaign.live_answer_count_today >= MIN_MEASURED_LIVE_ANSWERS (2) after the outcome is applied"
          - "campaign.regulatory_abandonment_rate_pct > DialerProfile(campaign.dialer_profile_id).abandonment_limit_pct after the outcome is applied"
        side_effects:
          - "set Campaign.suspension_reason = ABANDONMENT_BREACH"
          - "every ContactAttempt of this campaign with outcome == PENDING becomes VOIDED (void_reason CAMPAIGN_SUSPENDED) and credits its Contact's attempt budget"
          - "cascade hop 2: because this campaign was suspended for a breach, DialerProfile(campaign.dialer_profile_id).status becomes LOCKED with locked_reason = ABANDONMENT_BREACH and its version increments by 1"
          - "increments Campaign.version by 1"
        note: "Depth-3 cascade origin (calculations.abandonment_rate -> Campaign -> DialerProfile -> sibling Campaigns). Boundary is strict: a rate exactly equal to abandonment_limit_pct does NOT suspend."
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system event: the profile this campaign points at became LOCKED because a sibling campaign breached"
        actor: system
        preconditions:
          - "campaign.status == ACTIVE"
          - "DialerProfile(campaign.dialer_profile_id).status == LOCKED"
          - "this campaign is not the campaign whose breach caused the lock"
        side_effects:
          - "set Campaign.suspension_reason = PROFILE_LOCKED"
          - "every ContactAttempt of this campaign with outcome == PENDING becomes VOIDED (void_reason CAMPAIGN_SUSPENDED) and credits its Contact's attempt budget"
          - "increments Campaign.version by 1"
        note: "Cascade hop 3 of the abandonment chain: caused by the DialerProfile lock, not directly by the outcome call."
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system event: the newest ScrubJob of this campaign was INVALIDATED by a new internal suppression"
        actor: system
        preconditions:
          - "campaign.status == ACTIVE"
          - "Campaign.latest_scrub_status became INVALIDATED"
        side_effects:
          - "set Campaign.suspension_reason = SCRUB_STALE and Campaign.latest_scrub_status = INVALIDATED"
          - "every ContactAttempt of this campaign with outcome == PENDING becomes VOIDED (void_reason CAMPAIGN_SUSPENDED) and credits its Contact's attempt budget"
          - "increments Campaign.version by 1"
        note: "Cascade hop 4 of the revocation chain (RevocationRequest -> ConsentRecord -> Contact + SuppressionEntry -> ScrubJob -> Campaign)."
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system event: POST /compliance/calling-window-policies/{id}/declare-emergency for a state this campaign targets"
        actor: system
        preconditions:
          - "campaign.status == ACTIVE"
          - "the declaring policy's state_code is an element of campaign.target_state_codes"
        side_effects:
          - "set Campaign.suspension_reason = EMERGENCY_RESTRICTION"
          - "every ContactAttempt of this campaign with outcome == PENDING becomes VOIDED (void_reason CAMPAIGN_SUSPENDED) and credits its Contact's attempt budget"
          - "increments Campaign.version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /compliance/campaigns/{id}/resume"
        actor: ComplianceOfficer
        preconditions:
          - "campaign.status == SUSPENDED"
          - "if suspension_reason == SCRUB_STALE: the newest ScrubJob has status COMPLETED and expires_at > clock now"
          - "if suspension_reason IN (PROFILE_LOCKED, ABANDONMENT_BREACH): DialerProfile(campaign.dialer_profile_id).status == APPROVED"
          - "if suspension_reason == ABANDONMENT_BREACH: UTC date of clock now != campaign.measurement_date (the breached measurement day has closed)"
          - "if suspension_reason == EMERGENCY_RESTRICTION: every ACTIVE CallingWindowPolicy for campaign.target_state_codes has emergency_status == NONE"
        side_effects:
          - "clear Campaign.suspension_reason to null"
          - "increments Campaign.version by 1"
        note: "Cyclic shape: ACTIVE -> SUSPENDED -> ACTIVE, with the admissible resume guard depending on why the campaign was suspended and on another entity's state."
      - from: DRAFT
        to: CLOSED
        trigger: "POST /compliance/campaigns/{id}/close"
        actor: CampaignManager
        preconditions: ["campaign.status == DRAFT"]
        side_effects: ["increments Campaign.version by 1"]
      - from: PENDING_LAUNCH
        to: CLOSED
        trigger: "POST /compliance/campaigns/{id}/close"
        actor: CampaignManager
        preconditions: ["campaign.status == PENDING_LAUNCH"]
        side_effects: ["increments Campaign.version by 1"]
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /compliance/campaigns/{id}/close"
        actor: CampaignManager
        preconditions: ["campaign.status == ACTIVE"]
        side_effects:
          - "every ContactAttempt of this campaign with outcome == PENDING becomes VOIDED (void_reason CAMPAIGN_SUSPENDED) and credits its Contact's attempt budget"
          - "increments Campaign.version by 1"
      - from: SUSPENDED
        to: CLOSED
        trigger: "POST /compliance/campaigns/{id}/close"
        actor: CampaignManager
        preconditions: ["campaign.status == SUSPENDED"]
        side_effects: ["clear Campaign.suspension_reason to null", "increments Campaign.version by 1"]

  - entity: ConsentRecord
    initial_state: ACTIVE
    terminal_states: [SUPERSEDED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /compliance/consent-records/{id}/suspend"
        actor: ComplianceOfficer
        preconditions: ["consent.status == ACTIVE"]
        side_effects:
          - "set ConsentRecord.suspended_reason = payload reason"
          - "recompute Contact.active_consent_count and Contact.suspended_consent_count; Contact.total_consent_count unchanged"
          - "increments Contact.version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /compliance/consent-records/{id}/reinstate"
        actor: ComplianceOfficer
        preconditions:
          - "consent.status == SUSPENDED"
          - "no ACTIVE ConsentRecord already exists for the same (contact_id, channel)"
        side_effects:
          - "clear ConsentRecord.suspended_reason to null; increment ConsentRecord.reinstatement_count by 1"
          - "recompute Contact.active_consent_count and Contact.suspended_consent_count"
          - "increments Contact.version by 1"
        note: "Cycle ACTIVE -> SUSPENDED -> ACTIVE on the same row; the census invariant of calculations.consent_census_invariant is unchanged by the round trip."
      - from: ACTIVE
        to: REVOKED
        trigger: "system event: POST /compliance/revocation-requests/{id}/validate covering this channel"
        actor: system
        preconditions:
          - "consent.status == ACTIVE"
          - "the validated RevocationRequest.scope is ALL_CHANNELS or equals consent.channel"
        side_effects:
          - "set ConsentRecord.revoked_at = clock now"
          - "cascade hop 2: Contact.internal_dnc_status becomes SUPPRESSED and an ACTIVE INTERNAL SuppressionEntry is created for Contact.phone_number when none exists"
          - "recompute Contact.active_consent_count and Contact.revoked_consent_count"
          - "increments Contact.version by 1"
      - from: SUSPENDED
        to: REVOKED
        trigger: "system event: POST /compliance/revocation-requests/{id}/validate covering this channel"
        actor: system
        preconditions:
          - "consent.status == SUSPENDED"
          - "the validated RevocationRequest.scope is ALL_CHANNELS or equals consent.channel"
        side_effects:
          - "set ConsentRecord.revoked_at = clock now"
          - "recompute Contact.suspended_consent_count and Contact.revoked_consent_count"
          - "increments Contact.version by 1"
      - from: REVOKED
        to: ACTIVE
        trigger: "POST /compliance/consent-records/{id}/reinstate"
        actor: ComplianceOfficer
        preconditions:
          - "consent.status == REVOKED"
          - "no ACTIVE ConsentRecord already exists for the same (contact_id, channel)"
        side_effects:
          - "clear ConsentRecord.revoked_at to null; increment ConsentRecord.reinstatement_count by 1"
          - "recompute Contact.active_consent_count and Contact.revoked_consent_count (census total unchanged)"
          - "when the contact has no remaining REVOKED ConsentRecord and Contact.risk_tier != CRITICAL: Contact.internal_dnc_status becomes CLEAR and every ACTIVE INTERNAL SuppressionEntry for Contact.phone_number becomes REMOVED with removal_reason = CONSENT_REINSTATED"
          - "increments Contact.version by 1"
        note: "Compensating action for the revocation cascade; conserves Contact.total_consent_count."
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system event: POST /compliance/consent-records creates a newer consent for the same (contact_id, channel)"
        actor: system
        preconditions: ["consent.status == ACTIVE", "the new record's contact_id and channel match this record"]
        side_effects:
          - "recompute Contact.active_consent_count and Contact.superseded_consent_count"
          - "increments Contact.version by 1"

  - entity: RevocationRequest
    initial_state: RECEIVED
    terminal_states: [REJECTED]
    transitions:
      - from: RECEIVED
        to: VALIDATED
        trigger: "POST /compliance/revocation-requests/{id}/validate"
        actor: ComplianceOfficer
        preconditions: ["revocation.intake_status == RECEIVED"]
        side_effects:
          - "set validated_at = clock now"
          - "advance the independent propagation dimension: propagation_status NOT_STARTED -> IN_PROGRESS"
          - "cascade hop 1: every ConsentRecord of this contact whose status is ACTIVE or SUSPENDED and whose channel is covered by scope becomes REVOKED; consent_records_revoked_count is set to how many moved"
          - "cascade hop 2 (caused by hop 1): Contact.internal_dnc_status becomes SUPPRESSED, consent census counters recomputed, and an ACTIVE INTERNAL SuppressionEntry is created for Contact.phone_number when none exists"
          - "cascade hop 3 (caused by hop 2): every ScrubJob with status COMPLETED, expires_at > clock now, list_types containing INTERNAL, whose campaign's target_state_codes contains Contact.state_code becomes INVALIDATED with invalidation_reason = NEW_INTERNAL_SUPPRESSION"
          - "cascade hop 4 (caused by hop 3): every ACTIVE Campaign whose latest_scrub_status became INVALIDATED becomes SUSPENDED with suspension_reason = SCRUB_STALE, voiding its PENDING attempts and crediting those contacts' attempt budgets"
      - from: RECEIVED
        to: REJECTED
        trigger: "POST /compliance/revocation-requests/{id}/reject"
        actor: ComplianceOfficer
        preconditions: ["revocation.intake_status == RECEIVED"]
        side_effects:
          - "set rejection_reason = payload rejection_reason"
          - "propagation_status stays NOT_STARTED: the two dimensions move under different triggers and a rejected intake never propagates"
        note: "Branch B of the intake dimension; no ConsentRecord is touched, so the consent census is untouched."

  - entity: RevocationRequestPropagation
    initial_state: NOT_STARTED
    terminal_states: [PROPAGATED, OVERDUE]
    transitions:
      - from: NOT_STARTED
        to: IN_PROGRESS
        trigger: "system event: POST /compliance/revocation-requests/{id}/validate"
        actor: system
        preconditions: ["propagation_status == NOT_STARTED", "intake_status transitioned to VALIDATED in the same request"]
        side_effects: ["no field other than propagation_status changes on this dimension"]
        note: "Second state dimension of the RevocationRequest row (field propagation_status); it advances independently of intake_status."
      - from: IN_PROGRESS
        to: PROPAGATED
        trigger: "POST /compliance/revocation-requests/{id}/propagate"
        actor: ComplianceOfficer
        preconditions:
          - "propagation_status == IN_PROGRESS"
          - "intake_status == VALIDATED"
          - "clock now <= propagation_deadline_at"
        side_effects:
          - "set propagated_at = clock now and target_systems = payload target_systems"
      - from: IN_PROGRESS
        to: OVERDUE
        trigger: "POST /compliance/revocation-requests/{id}/propagate"
        actor: ComplianceOfficer
        preconditions:
          - "propagation_status == IN_PROGRESS"
          - "intake_status == VALIDATED"
          - "clock now > propagation_deadline_at"
        side_effects:
          - "set propagated_at = clock now and target_systems = payload target_systems"
          - "increment Contact.overdue_propagation_count by 1 and increments Contact.version by 1"
        note: "Deadline boundary is inclusive: propagating exactly at propagation_deadline_at lands PROPAGATED, one second later lands OVERDUE."

  - entity: ScrubJob
    initial_state: PENDING
    terminal_states: [FAILED, SUPERSEDED, INVALIDATED]
    transitions:
      - from: PENDING
        to: COMPLETED
        trigger: "POST /compliance/scrub-jobs/{id}/execute"
        actor: CampaignManager
        preconditions:
          - "job.status == PENDING"
          - "Campaign(job.campaign_id).status IN (DRAFT, PENDING_LAUNCH)"
          - "for each list_type in (NATIONAL, STATE) requested by this job, at least one SuppressionEntry with status ACTIVE and source_refreshed_at >= clock now - LIST_REFRESH_MAX_DAYS exists (STATE entries must carry a state_code in the campaign's target_state_codes)"
        side_effects:
          - "set contacts_scrubbed_count, contacts_suppressed_count, eligible_target_count per calculations.scrub_target_resolution"
          - "set completed_at = clock now and expires_at = completed_at + SCRUB_VALIDITY_DAYS"
          - "every other ScrubJob of the same campaign with status COMPLETED becomes SUPERSEDED"
          - "Campaign.latest_scrub_status = COMPLETED, Campaign.eligible_target_count = this job's eligible_target_count, and Campaign.status DRAFT -> PENDING_LAUNCH; increments Campaign.version by 1"
      - from: PENDING
        to: FAILED
        trigger: "POST /compliance/scrub-jobs/{id}/execute"
        actor: CampaignManager
        preconditions:
          - "job.status == PENDING"
          - "Campaign(job.campaign_id).status IN (DRAFT, PENDING_LAUNCH)"
          - "at least one of the requested NATIONAL / STATE list types has no ACTIVE SuppressionEntry refreshed within LIST_REFRESH_MAX_DAYS"
        side_effects:
          - "set failure_reason = STALE_OR_EMPTY_LIST; completed_at and expires_at stay null"
          - "Campaign.latest_scrub_status = FAILED and Campaign.status is unchanged; increments Campaign.version by 1"
        note: "Fork-join branch of the same trigger with a divergent side-effect set: COMPLETED promotes the campaign, FAILED leaves it where it was."
      - from: COMPLETED
        to: SUPERSEDED
        trigger: "system event: a newer ScrubJob for the same campaign reaches COMPLETED"
        actor: system
        preconditions: ["job.status == COMPLETED"]
        side_effects: ["Campaign.latest_scrub_status now reflects the newer job"]
      - from: COMPLETED
        to: INVALIDATED
        trigger: "system event: an ACTIVE INTERNAL SuppressionEntry was created for a phone number inside this job's target states"
        actor: system
        preconditions:
          - "job.status == COMPLETED"
          - "job.expires_at > clock now"
          - "job.list_types contains INTERNAL"
          - "Campaign(job.campaign_id).target_state_codes contains the newly suppressed Contact.state_code"
        side_effects:
          - "set invalidation_reason = NEW_INTERNAL_SUPPRESSION"
          - "cascade hop 4: the owning Campaign, when ACTIVE, becomes SUSPENDED with suspension_reason = SCRUB_STALE"

  - entity: DialerProfile
    initial_state: DRAFT
    terminal_states: []
    transitions:
      - from: DRAFT
        to: APPROVED
        trigger: "POST /compliance/dialer-profiles/{id}/approve"
        actor: ComplianceOfficer
        preconditions:
          - "profile.status == DRAFT"
          - "when profile.requires_waiver is true, payload waiver_reference is a non-empty string"
        side_effects:
          - "set approved_by_user_id = X-User-ID and waiver_reference = payload waiver_reference (null when requires_waiver is false)"
          - "set max_lines_last_computed per calculations.dialer_pacing_lines using a regulatory rate of 0.00"
      - from: APPROVED
        to: LOCKED
        trigger: "system event: a campaign using this profile was suspended for an abandonment breach"
        actor: system
        preconditions: ["profile.status == APPROVED"]
        side_effects:
          - "set locked_reason = ABANDONMENT_BREACH"
          - "cascade hop 3: every other ACTIVE Campaign pointing at this profile becomes SUSPENDED with suspension_reason = PROFILE_LOCKED"
      - from: LOCKED
        to: APPROVED
        trigger: "POST /compliance/dialer-profiles/{id}/approve"
        actor: ComplianceOfficer
        preconditions:
          - "profile.status == LOCKED"
          - "when profile.requires_waiver is true, payload waiver_reference is a non-empty string"
        side_effects:
          - "clear locked_reason to null and set approved_by_user_id = X-User-ID"
        note: "Cycle APPROVED -> LOCKED -> APPROVED; re-approval is what makes a PROFILE_LOCKED campaign resumable."

  - entity: AgentScript
    initial_state: DRAFT
    terminal_states: [APPROVED]
    transitions:
      - from: DRAFT
        to: IN_REVIEW
        trigger: "POST /compliance/agent-scripts/{id}/submit-review"
        actor: CampaignManager
        preconditions: ["script.status == DRAFT"]
        side_effects: ["clear change_note to null"]
      - from: IN_REVIEW
        to: DRAFT
        trigger: "POST /compliance/agent-scripts/{id}/request-changes"
        actor: ComplianceOfficer
        preconditions: ["script.status == IN_REVIEW"]
        side_effects: ["set change_note = payload change_note", "increment review_cycle_count by 1"]
        note: "Revision loop DRAFT -> IN_REVIEW -> DRAFT; review_cycle_count records how many rounds occurred."
      - from: IN_REVIEW
        to: APPROVED
        trigger: "POST /compliance/agent-scripts/{id}/approve"
        actor: ComplianceOfficer
        preconditions: ["script.status == IN_REVIEW"]
        side_effects:
          - "set approved_by_user_id = X-User-ID and approved_at = clock now"
        note: "approved_by_user_id is the segregation-of-duties key: this user may not certify the launch of a campaign pinned to this script."

  - entity: ContactAttempt
    initial_state: PENDING
    terminal_states: [VOIDED]
    transitions:
      - from: PENDING
        to: CONNECTED_LIVE
        trigger: "POST /compliance/contact-attempts/{id}/outcome with outcome = CONNECTED_LIVE"
        actor: DialerOperator
        preconditions:
          - "attempt.outcome == PENDING"
          - "payload agent_connect_seconds is present and <= ABANDON_CONNECT_SECONDS (2)"
        side_effects:
          - "set outcome_recorded_at = clock now and agent_connect_seconds = payload value"
          - "Campaign.live_answer_count_today increases by 1 (after any measurement-date rollover) and both abandonment rates are recomputed"
          - "Campaign.rolling_compliance_rate_pct recomputed; DialerProfile.max_lines_last_computed refreshed"
      - from: PENDING
        to: ABANDONED
        trigger: "POST /compliance/contact-attempts/{id}/outcome with outcome = ABANDONED"
        actor: DialerOperator
        preconditions:
          - "attempt.outcome == PENDING"
          - "payload abandon_message_played == true"
          - "payload agent_connect_seconds is absent or > ABANDON_CONNECT_SECONDS (2)"
        side_effects:
          - "set outcome_recorded_at = clock now and abandon_message_played = true"
          - "Campaign.live_answer_count_today and Campaign.abandoned_count_today each increase by 1; both abandonment rates and rolling_compliance_rate_pct are recomputed"
          - "when the breach condition holds, the ACTIVE Campaign becomes SUSPENDED (ABANDONMENT_BREACH), which locks the DialerProfile, which suspends sibling ACTIVE campaigns"
        note: "Divergent branch: only this outcome can trigger the abandonment cascade."
      - from: PENDING
        to: MACHINE_ANSWERED
        trigger: "POST /compliance/contact-attempts/{id}/outcome with outcome = MACHINE_ANSWERED"
        actor: DialerOperator
        preconditions:
          - "attempt.outcome == PENDING"
          - "DialerProfile(Campaign.dialer_profile_id).amd_enabled == true"
        side_effects:
          - "set outcome_recorded_at = clock now"
          - "Campaign.machine_count_today increases by 1; live_answer_count_today is untouched, so the regulatory rate does not move while the internal rate does"
      - from: PENDING
        to: NO_ANSWER
        trigger: "POST /compliance/contact-attempts/{id}/outcome with outcome = NO_ANSWER"
        actor: DialerOperator
        preconditions: ["attempt.outcome == PENDING"]
        side_effects:
          - "set outcome_recorded_at = clock now"
          - "Campaign.no_answer_count_today increases by 1; neither abandonment rate moves"
      - from: PENDING
        to: VOIDED
        trigger: "POST /compliance/contact-attempts/{id}/void, or system voiding when the campaign leaves ACTIVE"
        actor: ComplianceOfficer
        preconditions: ["attempt.voided_at IS NULL"]
        side_effects:
          - "set voided_at = clock now and void_reason (payload void_reason for the manual call, CAMPAIGN_SUSPENDED for the cascade)"
          - "Contact.attempts_charged decreases by 1 and Contact.attempt_budget_remaining increases by 1; increments Contact.version by 1"
          - "Campaign.permitted_attempt_count decreases by 1, voided_attempt_count increases by 1, counters and both rates for measurement_date recomputed"
      - from: CONNECTED_LIVE
        to: VOIDED
        trigger: "POST /compliance/contact-attempts/{id}/void"
        actor: ComplianceOfficer
        preconditions: ["attempt.voided_at IS NULL"]
        side_effects:
          - "set voided_at = clock now and void_reason = payload void_reason"
          - "Contact.attempts_charged decreases by 1 and Contact.attempt_budget_remaining increases by 1"
          - "Campaign.live_answer_count_today decreases by 1 and both abandonment rates are recomputed"
      - from: ABANDONED
        to: VOIDED
        trigger: "POST /compliance/contact-attempts/{id}/void"
        actor: ComplianceOfficer
        preconditions: ["attempt.voided_at IS NULL"]
        side_effects:
          - "set voided_at = clock now and void_reason = payload void_reason"
          - "Contact.attempts_charged decreases by 1 and Contact.attempt_budget_remaining increases by 1"
          - "Campaign.live_answer_count_today and abandoned_count_today each decrease by 1; both rates recomputed (a suspension already applied is NOT reversed)"
      - from: MACHINE_ANSWERED
        to: VOIDED
        trigger: "POST /compliance/contact-attempts/{id}/void"
        actor: ComplianceOfficer
        preconditions: ["attempt.voided_at IS NULL"]
        side_effects:
          - "set voided_at = clock now and void_reason = payload void_reason"
          - "Contact.attempts_charged decreases by 1 and Contact.attempt_budget_remaining increases by 1"
          - "Campaign.machine_count_today decreases by 1; the internal rate recomputes, the regulatory rate does not move"
      - from: NO_ANSWER
        to: VOIDED
        trigger: "POST /compliance/contact-attempts/{id}/void"
        actor: ComplianceOfficer
        preconditions: ["attempt.voided_at IS NULL"]
        side_effects:
          - "set voided_at = clock now and void_reason = payload void_reason"
          - "Contact.attempts_charged decreases by 1 and Contact.attempt_budget_remaining increases by 1"
          - "Campaign.no_answer_count_today decreases by 1"

  - entity: Complaint
    initial_state: OPEN
    terminal_states: [SUBSTANTIATED, DISMISSED]
    transitions:
      - from: OPEN
        to: SUBSTANTIATED
        trigger: "POST /compliance/complaints/{id}/substantiate"
        actor: ComplianceOfficer
        preconditions: ["complaint.status == OPEN"]
        side_effects:
          - "set willful = payload willful, finding_note = payload finding_note"
          - "set verified_attempt_count, adjudicated_risk_score (calculations.complaint_risk_score adjudicated variant) and exposure_cents (calculations.statutory_exposure)"
          - "recompute Contact.risk_tier from every SUBSTANTIATED complaint of that contact; increments Contact.version by 1"
          - "when the recomputed Contact.risk_tier == CRITICAL: Contact.internal_dnc_status becomes SUPPRESSED, an ACTIVE INTERNAL SuppressionEntry is created for the phone number when none exists, and every ACTIVE ConsentRecord of that contact becomes SUSPENDED with suspended_reason = 'CRITICAL risk tier'"
          - "recompute pattern_cluster_size for every Complaint in this row's cluster"
      - from: OPEN
        to: DISMISSED
        trigger: "POST /compliance/complaints/{id}/dismiss"
        actor: ComplianceOfficer
        preconditions: ["complaint.status == OPEN"]
        side_effects:
          - "set dismissal_note = payload dismissal_note"
          - "adjudicated_risk_score, verified_attempt_count, exposure_cents and willful stay null; Contact.risk_tier is NOT recomputed"
          - "recompute pattern_cluster_size for every Complaint in this row's cluster (a DISMISSED row leaves the cluster)"
        note: "Divergent branch: dismissal produces none of the substantiation side effects."

  - entity: SuppressionEntry
    initial_state: ACTIVE
    terminal_states: [REMOVED]
    transitions:
      - from: ACTIVE
        to: REMOVED
        trigger: "POST /compliance/suppression-entries/{id}/remove, or system removal when the last REVOKED consent of the contact is reinstated"
        actor: ComplianceOfficer
        preconditions: ["entry.status == ACTIVE"]
        side_effects:
          - "set removed_at = clock now and removal_reason (payload removal_reason for the manual call, CONSENT_REINSTATED for the cascade)"
          - "a removed INTERNAL entry no longer suppresses attempts, but ScrubJob rows already INVALIDATED stay INVALIDATED"

  - entity: CallingWindowPolicy
    initial_state: ACTIVE
    terminal_states: [SUPERSEDED]
    transitions:
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system event: POST /compliance/calling-window-policies naming this policy in supersedes_policy_id"
        actor: system
        preconditions:
          - "policy.status == ACTIVE"
          - "the new policy has the same state_code"
          - "the new policy's effective_from >= this policy's effective_from"
        side_effects:
          - "truncate this policy's effective_to to the new policy's effective_from, so the two periods are exactly adjacent"
          - "this policy is no longer a candidate of the attempt-time policy selector"
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /compliance/calling-window-policies/{id}/declare-emergency"
        actor: PlatformAdmin
        preconditions: ["policy.status == ACTIVE", "policy.emergency_status == NONE"]
        side_effects:
          - "set emergency_status = ACTIVE, emergency_declared_at = clock now, emergency_note = payload emergency_note"
          - "cascade: every ACTIVE Campaign whose target_state_codes contains this policy's state_code becomes SUSPENDED with suspension_reason = EMERGENCY_RESTRICTION, which voids those campaigns' PENDING attempts and credits the affected contacts' attempt budgets"
        note: "Self-loop on status with a change on the independent emergency_status field."

concurrency_rules:
  - rule_id: scrub-job-create-stale-campaign
    parent_entity: Campaign
    write_endpoint: "POST /compliance/scrub-jobs"
    occ_field: "expected_campaign_version"
    description: |
      Creating a ScrubJob against a Campaign whose version has advanced since the
      client last read it is rejected with a stale-version error. A newly created
      job legitimately supersedes the campaign's prior COMPLETED job once it
      executes, so the write cannot be resolved by a state precondition: a client
      holding an out-of-date view of the campaign (its script pinning, target
      states or scrub status changed) must re-read before scrubbing again.
    error_id: ERR_STALE_CAMPAIGN_VERSION
    http_status: 412
  - rule_id: consent-create-stale-contact
    parent_entity: Contact
    write_endpoint: "POST /compliance/consent-records"
    occ_field: "expected_contact_version"
    description: |
      Creating a ConsentRecord against a Contact whose version has advanced since
      the client last read it is rejected with a stale-version error. A new consent
      for an existing (contact, channel) pair legitimately supersedes the prior
      ACTIVE record, so the write would otherwise succeed on identical state; the
      version check forces the capturing client to observe the contact's current
      suppression status and consent census first.
    error_id: ERR_STALE_CONTACT_VERSION
    http_status: 412

calculations:
  - name: recipient_local_minutes
    trigger: "POST /compliance/contact-attempts, before any calling-window check"
    algorithm: projection
    formula: |
      utc_minutes = clock_now.hour * 60 + clock_now.minute
      recipient_local_minutes = ((utc_minutes + contact.utc_offset_minutes) mod 1440 + 1440) mod 1440
      recipient_local_date  = the calendar date reached by adding contact.utc_offset_minutes
                              to clock_now (may differ from the UTC date)
      recipient_local_time  = zero-padded "HH:MM" rendering of recipient_local_minutes
    input_set: "Contact.utc_offset_minutes only. Contact.time_zone_label is display-only and never enters this or any other calculation; there is no DST arithmetic anywhere in the domain."
    constants:
      MINUTES_PER_DAY: 1440
    precision: "integer minutes; recipient_local_time rendered as HH:MM with leading zeros"

  - name: effective_calling_window
    trigger: "POST /compliance/contact-attempts, after the governing CallingWindowPolicy is selected"
    algorithm: interval_merge
    formula: |
      # Step 1 - policy base window, in minutes past recipient-local midnight
      base_start = policy.window_start_minutes
      base_end   = policy.window_end_minutes

      # Step 2 - consent penalty: anything weaker than express written consent
      #          loses the first hour of the day
      consent_ext = 60 if consent_record.consent_type != EXPRESS_WRITTEN else 0

      # Step 3 - channel shift: texts are held to a window narrowed at BOTH ends
      channel_shift = 30 if attempt.channel == SMS else 0

      # Step 4 - federal floor / ceiling clamp, applied AFTER steps 2 and 3
      effective_start = max(base_start + consent_ext, FEDERAL_FLOOR_MINUTES + channel_shift)
      effective_end   = min(base_end   - channel_shift, FEDERAL_CEILING_MINUTES)

      # Step 5 - half-open admission test against recipient local time
      permitted = (effective_start <= recipient_local_minutes < effective_end)
    input_set: |
      The single ACTIVE CallingWindowPolicy chosen by calculations.policy_selector for
      Contact.state_code, the ConsentRecord chosen by calculations.consent_basis_selector,
      and the requested channel. SUPERSEDED policies and non-ACTIVE consent rows never
      contribute.
    constants:
      FEDERAL_FLOOR_MINUTES: 480      # 08:00 recipient local
      FEDERAL_CEILING_MINUTES: 1260   # 21:00 recipient local
      NON_WRITTEN_CONSENT_EXTENSION_MINUTES: 60
      SMS_NARROWING_MINUTES: 30
    precision: "integer minutes; the admission test is half-open: start is permitted, end is not"

  - name: abandonment_rate
    trigger: "POST /compliance/contact-attempts/{id}/outcome and POST /compliance/contact-attempts/{id}/void, on the owning Campaign"
    algorithm: threshold
    formula: |
      # measurement-date rollover happens first: when the UTC date of clock now differs
      # from campaign.measurement_date, the closing day's regulatory rate is appended to
      # campaign.daily_rate_history as { date, live_answer_count, abandoned_count, rate_pct }
      # and all *_count_today reset to 0 before the current outcome is counted.
      live    = campaign.live_answer_count_today      # CONNECTED_LIVE + ABANDONED
      aband   = campaign.abandoned_count_today
      machine = campaign.machine_count_today

      regulatory_abandonment_rate_pct = 0.00 if live == 0
                                        else round_half_up(100 * aband / live, 2)
      internal_abandonment_rate_pct   = 0.00 if (live + machine) == 0
                                        else round_half_up(100 * aband / (live + machine), 2)

      breach = (live >= MIN_MEASURED_LIVE_ANSWERS)
               and (regulatory_abandonment_rate_pct > dialer_profile.abandonment_limit_pct)
    input_set: |
      Only ContactAttempt rows of this campaign with voided_at IS NULL whose
      outcome_recorded_at falls on campaign.measurement_date. VOIDED attempts are excluded
      and their counters are given back on void. PENDING attempts contribute to neither rate.
    constants:
      MIN_MEASURED_LIVE_ANSWERS: 2
      REGULATORY_ABANDONMENT_CEILING_PCT: 3.00
    precision: "2 decimal places, round_half_up; the breach comparison is strict (>), so a rate exactly equal to the limit does not breach"
    variants:
      - name: regulatory
        when: "the regulatory abandonment measure - the only measure compared against DialerProfile.abandonment_limit_pct and therefore the only one that can suspend a campaign"
        difference: "denominator is live answers only (CONNECTED_LIVE + ABANDONED); MACHINE_ANSWERED attempts are excluded entirely"
      - name: internal
        when: "the internal quality measure, reported on every campaign read and never used as a gate"
        difference: "denominator additionally includes MACHINE_ANSWERED attempts, so for identical data it is always <= the regulatory rate and diverges the moment one machine answer exists"

  - name: rolling_compliance_rate
    trigger: "POST /compliance/contact-attempts/{id}/outcome, POST /compliance/contact-attempts/{id}/void, and GET /compliance/campaigns/{id}"
    algorithm: aggregation
    formula: |
      # Nested aggregation - per-day rates are rounded FIRST, then averaged.
      # window = the ROLLING_WINDOW_DAYS UTC dates ending at campaign.measurement_date
      #          (inclusive), i.e. measurement_date - 6 .. measurement_date
      daily = []
      for each date d in window:
          live_d  = live answers recorded on d   (from daily_rate_history, or today's counters
                                                  when d == campaign.measurement_date)
          aband_d = abandoned answers recorded on d
          if live_d > 0:
              daily.append(round_half_up(100 * aband_d / live_d, 2))   # step 1: round each day
      rolling_compliance_rate_pct = 0.00 if daily is empty
                                    else round_half_up(sum(daily) / count(daily), 2)  # step 2
    input_set: "Only the dates inside the window that have at least one live answer; dates with live_d == 0 are skipped entirely and do NOT contribute a 0.00 sample."
    constants:
      ROLLING_WINDOW_DAYS: 7
    precision: |
      2 decimal places, round_half_up, applied twice in this fixed order: round each day's
      rate to 2dp, then round the mean of those rounded values to 2dp. Aggregating the raw
      numerators and denominators across days first is WRONG and yields a different number
      (e.g. 1/3 on day one and 1/2 on day two give 41.67 here, 40.00 if aggregated first).

  - name: dialer_pacing_lines
    trigger: "POST /compliance/dialer-profiles/{id}/approve, POST /compliance/contact-attempts (snapshot onto the attempt), and after every outcome or void that moves a rate"
    algorithm: constraint_propagation
    formula: |
      # Ordered steps; each step consumes the previous step's clamped output.
      # Step 1 - headroom from the PERSISTED regulatory rate of the campaign being paced
      #          (0.00 when the profile has no campaign yet, e.g. at approval time)
      headroom = dialer_profile.abandonment_limit_pct - campaign.regulatory_abandonment_rate_pct
      # Step 2 - clamp headroom into [0, PACING_HEADROOM_CAP_PCT]
      clamped  = max(0.00, min(headroom, PACING_HEADROOM_CAP_PCT))
      # Step 3 - multiplier
      mult     = 1 + clamped * PACING_GAIN_PER_PCT
      # Step 4 - line count, floored, then clamped to at least 1 line per available agent
      max_lines = max(dialer_profile.agents_available,
                      floor(dialer_profile.agents_available * mult))
      # Step 5 - PREVIEW mode never over-dials
      if dialer_profile.mode == PREVIEW: max_lines = dialer_profile.agents_available
    input_set: "DialerProfile.agents_available and abandonment_limit_pct, plus the owning Campaign's persisted regulatory_abandonment_rate_pct. The internal rate is never used for pacing."
    constants:
      PACING_HEADROOM_CAP_PCT: 2.00
      PACING_GAIN_PER_PCT: 0.25
    precision: "integer lines; floor() applied only at step 4, never earlier - clamping after flooring gives different results"

  - name: complaint_risk_score
    trigger: "POST /compliance/complaints (provisional) and POST /compliance/complaints/{id}/substantiate (adjudicated)"
    algorithm: weighted_scoring
    formula: |
      w_src = SOURCE_WEIGHT[complaint.source]
      w_vio = VIOLATION_WEIGHT[complaint.alleged_violation_type]

      provisional_risk_score  = round_half_up(w_src * SOURCE_POINTS
                                            + w_vio * VIOLATION_POINTS
                                            + min(contact.attempts_charged, ATTEMPT_POINT_CAP)
                                              * PROVISIONAL_ATTEMPT_POINTS, 2)

      # verified_attempt_count = ContactAttempt rows of (complaint.contact_id,
      # complaint.campaign_id) with voided_at IS NULL and outcome != PENDING
      adjudicated_risk_score  = round_half_up(w_src * SOURCE_POINTS
                                            + w_vio * VIOLATION_POINTS
                                            + verified_attempt_count * ADJUDICATED_ATTEMPT_POINTS
                                            + (LITIGATION_BONUS if complaint.litigation_flag else 0), 2)
    input_set: |
      The provisional variant reads the contact's lifetime charged-attempt counter and caps
      it; the adjudicated variant counts only non-voided, outcome-recorded attempts of the
      complained-about campaign and adds a litigation bonus. Dismissed complaints keep a
      provisional score and never receive an adjudicated one.
    constants:
      SOURCE_WEIGHT: { DIRECT: 1.0, STATE_AG: 1.25, FTC: 1.5, LITIGATION: 2.0 }
      VIOLATION_WEIGHT: { NO_CONSENT: 1.5, DNC_VIOLATION: 1.25, TIME_WINDOW: 1.0, ABANDONMENT: 0.75, RECORDING_CONSENT: 1.1 }
      SOURCE_POINTS: 10
      VIOLATION_POINTS: 8
      PROVISIONAL_ATTEMPT_POINTS: 2
      ADJUDICATED_ATTEMPT_POINTS: 4
      ATTEMPT_POINT_CAP: 5
      LITIGATION_BONUS: 15
    precision: "2 decimal places, round_half_up"
    variants:
      - name: provisional
        when: "at intake, when nothing has been investigated yet"
        difference: "attempt contribution is capped at ATTEMPT_POINT_CAP attempts * 2 points and litigation_flag contributes nothing"
      - name: adjudicated
        when: "at substantiation, when the attempt evidence has been verified"
        difference: "attempt contribution is uncapped at 4 points per verified attempt and litigation_flag adds a flat 15; only this variant feeds contact_risk_tier"

  - name: contact_risk_tier
    trigger: "POST /compliance/complaints/{id}/substantiate"
    algorithm: threshold
    formula: |
      peak = max(adjudicated_risk_score of every Complaint of this contact with status
                 == SUBSTANTIATED)          # null -> LOW
      risk_tier = CRITICAL if peak >= CRITICAL_THRESHOLD
                  else HIGH if peak >= HIGH_THRESHOLD
                  else MEDIUM if peak >= MEDIUM_THRESHOLD
                  else LOW
    input_set: "Only SUBSTANTIATED complaints of that contact; OPEN and DISMISSED rows are ignored, so dismissing a complaint never raises a tier."
    constants:
      MEDIUM_THRESHOLD: 20
      HIGH_THRESHOLD: 40
      CRITICAL_THRESHOLD: 55
    precision: "comparisons are inclusive at each threshold (>=): a score of exactly 55.00 is CRITICAL, 54.99 is HIGH"

  - name: statutory_exposure
    trigger: "POST /compliance/complaints/{id}/substantiate"
    algorithm: aggregation
    formula: |
      exposure_cents = verified_attempt_count * STATUTORY_BASE_CENTS
                       * (WILLFUL_MULTIPLIER if payload willful else 1)
    input_set: "verified_attempt_count as defined by calculations.complaint_risk_score (non-voided, outcome-recorded attempts of the complained-about campaign for that contact)"
    constants:
      STATUTORY_BASE_CENTS: 50000
      WILLFUL_MULTIPLIER: 3
    precision: "integer cents; no rounding needed because every factor is an integer"

  - name: propagation_deadline
    trigger: "POST /compliance/revocation-requests"
    algorithm: chronological
    formula: |
      cursor = revocation.received_at            # time of day is preserved throughout
      remaining = PROPAGATION_BUSINESS_DAYS
      while remaining > 0:
          cursor = cursor + 1 day
          d = UTC date of cursor
          if weekday(d) in Mon..Fri and d not in holiday_dates(policy):
              remaining = remaining - 1
      propagation_deadline_at = cursor
    input_set: |
      holiday_dates come from the single ACTIVE CallingWindowPolicy selected for
      Contact.state_code at the moment the request is received (calculations.policy_selector).
      When no policy covers that state, only Sat/Sun are skipped.
    constants:
      PROPAGATION_BUSINESS_DAYS: 10
    precision: "whole days added to received_at with the original time-of-day preserved; the deadline comparison at propagation time is inclusive (now <= deadline is on time)"

  - name: scrub_validity_window
    trigger: "POST /compliance/scrub-jobs/{id}/execute (sets the window) and POST /compliance/contact-attempts / POST /compliance/campaigns/{id}/launch (consume it)"
    algorithm: threshold
    formula: |
      expires_at = completed_at + SCRUB_VALIDITY_DAYS days
      scrub_is_current = (clock_now < expires_at)          # strict: expiry instant is stale
    input_set: "the newest ScrubJob of the campaign whose status is COMPLETED; SUPERSEDED, INVALIDATED, FAILED and PENDING jobs never satisfy the currency test"
    constants:
      SCRUB_VALIDITY_DAYS: 31
    precision: "exact timestamp arithmetic; at exactly expires_at the scrub is already expired"

  - name: scrub_target_resolution
    trigger: "POST /compliance/scrub-jobs/{id}/execute"
    algorithm: aggregation
    formula: |
      targets = every Contact whose state_code is an element of
                Campaign(job.campaign_id).target_state_codes
      contacts_scrubbed_count = count(targets)
      suppressed = targets for which at least one SuppressionEntry exists with
                   status == ACTIVE, list_type IN job.list_types, phone_number == contact
                   .phone_number, and (list_type != STATE or state_code == contact.state_code)
      contacts_suppressed_count = count(suppressed)
      eligible_target_count     = contacts_scrubbed_count - contacts_suppressed_count
    input_set: "ACTIVE SuppressionEntry rows only, restricted to the list types this job requested; REMOVED entries do not suppress, and an INTERNAL entry is ignored by a job that did not request INTERNAL"
    constants:
      LIST_REFRESH_MAX_DAYS: 31
    precision: "integer counts; eligible_target_count is never negative because suppressed is a subset of targets"

  - name: consent_basis_selector
    trigger: "POST /compliance/contact-attempts"
    algorithm: chronological
    formula: |
      candidates = ConsentRecord rows with contact_id == attempt.contact_id
                   and channel == attempt.channel and status == ACTIVE
      if candidates is empty: reject (ERR_NO_CONSENT_ON_RECORD)
      order candidates by captured_at DESC, then by created_at ASC
      consent_record_id = first(candidates).id
      if campaign.campaign_purpose == MARKETING and
         selected.consent_type != EXPRESS_WRITTEN: reject (ERR_NO_EXPRESS_WRITTEN_CONSENT)
    input_set: "ACTIVE rows only; SUSPENDED, REVOKED and SUPERSEDED rows are invisible to the selector even when they are the newest rows for the channel"
    constants: {}
    precision: "ranking uses captured_at then created_at; entity ids never participate in the ranking"

  - name: policy_selector
    trigger: "POST /compliance/contact-attempts, POST /compliance/campaigns/{id}/launch, POST /compliance/revocation-requests"
    algorithm: chronological
    formula: |
      candidates = CallingWindowPolicy rows with state_code == Contact.state_code,
                   status == ACTIVE, effective_from <= clock_now < effective_to
      if candidates is empty: reject (ERR_CALLING_WINDOW_POLICY_MISSING)
      order candidates by effective_from DESC, then created_at ASC
      calling_window_policy_id = first(candidates).id
    input_set: "ACTIVE policies whose half-open effective period contains the clock instant; SUPERSEDED policies are excluded, which is what makes a superseding policy take over at exactly its effective_from"
    constants: {}
    precision: "period membership is half-open: effective_from is inside, effective_to is outside"

  - name: attempt_cooldown
    trigger: "POST /compliance/contact-attempts"
    algorithm: threshold
    formula: |
      last = the ContactAttempt of this contact with voided_at IS NULL and the greatest
             requested_at (tie-break: greatest created_at)
      if last exists:
          cooldown_until_prev = last.requested_at + CONTACT_COOLDOWN_MINUTES minutes
          if clock_now <= cooldown_until_prev: reject (ERR_CONTACT_COOLDOWN_ACTIVE)
      # on success the new attempt publishes its own cooldown horizon
      cooldown_until = clock_now + CONTACT_COOLDOWN_MINUTES minutes
    input_set: "non-voided attempts of the same contact across ALL campaigns and all channels; voiding an attempt removes it from the cooldown basis"
    constants:
      CONTACT_COOLDOWN_MINUTES: 30
    precision: "the guard is a CLOSED interval: an attempt exactly CONTACT_COOLDOWN_MINUTES after the previous one is still rejected; one second later is permitted"

  - name: rnd_check_currency
    trigger: "POST /compliance/contacts/{id}/number-status-check (sets it) and POST /compliance/contact-attempts (consumes it)"
    algorithm: threshold
    formula: |
      rnd_result = REASSIGNED if an /_rnd record exists for contact.phone_number whose
                                reassigned_on date is strictly after the submitted
                                claimed_consent_date
                   else NO_MATCH if an /_rnd record exists but reassigned_on <= claimed date
                   else NO_DATA
      rnd_safe_harbor_eligible = (rnd_result == NO_DATA)
      check_is_current = rnd_checked_at is not null
                         and clock_now < rnd_checked_at + RND_VALIDITY_DAYS days
      # a VOICE or SMS attempt to a WIRELESS or UNKNOWN number requires a current check
      # that did not come back REASSIGNED
    input_set: "the most recent number-status check of that contact only; a check older than RND_VALIDITY_DAYS is treated as if it had never happened"
    constants:
      RND_VALIDITY_DAYS: 31
    precision: "currency is strict (<); at exactly rnd_checked_at + 31 days the check is stale and the attempt is rejected with ERR_RND_CHECK_REQUIRED"

  - name: complaint_pattern_cluster
    trigger: "POST /compliance/complaints, POST /compliance/complaints/{id}/substantiate, POST /compliance/complaints/{id}/dismiss"
    algorithm: aggregation
    formula: |
      cluster(c) = Complaint rows with campaign_id == c.campaign_id
                   and alleged_violation_type == c.alleged_violation_type
                   and status IN (OPEN, SUBSTANTIATED)
                   and abs(received_at - c.received_at) <= PATTERN_WINDOW_DAYS days
      pattern_cluster_size = count(cluster(c))          # includes c itself when c qualifies
      # every member of the cluster is rewritten whenever a member joins or leaves,
      # so sizes stay mutually consistent
    input_set: "OPEN and SUBSTANTIATED complaints only; a DISMISSED complaint leaves the cluster and shrinks every remaining member's pattern_cluster_size"
    constants:
      PATTERN_WINDOW_DAYS: 30
    precision: "integer count; the window comparison is inclusive at exactly PATTERN_WINDOW_DAYS days apart"

  - name: attempt_budget_invariant
    trigger: "POST /compliance/contact-attempts, POST /compliance/contact-attempts/{id}/void, and every campaign suspension or closure that voids PENDING attempts"
    algorithm: aggregation
    formula: |
      attempts_charged         = count(ContactAttempt of contact with voided_at IS NULL)
      attempt_budget_remaining = attempt_budget_total - attempts_charged
      # conserved quantity, checkable after any sequence of operations:
      attempts_charged + attempt_budget_remaining == attempt_budget_total
      # creating an attempt charges 1; voiding it (manually or by cascade) credits exactly 1
      # back, so a create-then-void round trip returns the contact to its prior numbers
    input_set: "all non-voided attempts of the contact regardless of campaign, channel or outcome, including PENDING ones"
    constants: {}
    precision: "integer; attempt_budget_remaining is never negative because a create is rejected with ERR_ATTEMPT_BUDGET_EXHAUSTED when remaining is already 0"

  - name: consent_census_invariant
    trigger: "POST /compliance/consent-records and every ConsentRecord status transition"
    algorithm: aggregation
    formula: |
      total_consent_count == active_consent_count + suspended_consent_count
                             + revoked_consent_count + superseded_consent_count
      # total_consent_count only ever grows (one per created ConsentRecord); status moves
      # shuffle the four buckets without changing the total, so revoke-then-reinstate and
      # suspend-then-reinstate both restore the original bucket distribution
    input_set: "every ConsentRecord row of the contact, in any status; no row is ever deleted"
    constants: {}
    precision: "integer counts"

validations:
  - priority: 10
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and X-User-Role is one of the five declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 20
    category: auth
    check: "the acting X-User-Role appears in the endpoint's roles list"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all
  - priority: 25
    category: auth
    check: "when X-User-Role is Consumer, the payload contact_id equals X-User-ID (a consumer may only capture or revoke consent for their own Contact row)"
    error_id: ERR_NOT_CONTACT_OWNER
    http_status: 403
    applies_to: "POST /compliance/consent-records, POST /compliance/revocation-requests"
  - priority: 30
    category: business_constraint
    check: "request body parses, every required field is present, enum values are members of their declared set, numbers are inside their declared ranges, phone numbers match E.164, dates are ISO-8601, and pagination limit is 1..100"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all
  - priority: 40
    category: existence
    check: "the Contact named by a path {id} or by a payload contact_id exists"
    error_id: ERR_CONTACT_NOT_FOUND
    http_status: 404
    applies_to: "GET /compliance/contacts/{id}, POST /compliance/contacts/{id}/number-status-check, POST /compliance/consent-records, POST /compliance/revocation-requests, POST /compliance/contact-attempts, POST /compliance/complaints, GET /compliance/contacts/{id}/revocation-requests"
  - priority: 41
    category: existence
    check: "the Campaign named by a path {id} or by a payload campaign_id exists"
    error_id: ERR_CAMPAIGN_NOT_FOUND
    http_status: 404
    applies_to: "GET /compliance/campaigns/{id}, POST /compliance/campaigns/{id}/launch, POST /compliance/campaigns/{id}/suspend, POST /compliance/campaigns/{id}/resume, POST /compliance/campaigns/{id}/close, GET /compliance/campaigns/{id}/scrub-jobs, POST /compliance/scrub-jobs, POST /compliance/contact-attempts, POST /compliance/complaints"
  - priority: 42
    category: existence
    check: "the ConsentRecord named by the path {id} exists"
    error_id: ERR_CONSENT_RECORD_NOT_FOUND
    http_status: 404
    applies_to: "GET /compliance/consent-records/{id}, POST /compliance/consent-records/{id}/suspend, POST /compliance/consent-records/{id}/reinstate"
  - priority: 43
    category: existence
    check: "the RevocationRequest named by the path {id} exists"
    error_id: ERR_REVOCATION_REQUEST_NOT_FOUND
    http_status: 404
    applies_to: "POST /compliance/revocation-requests/{id}/validate, POST /compliance/revocation-requests/{id}/reject, POST /compliance/revocation-requests/{id}/propagate"
  - priority: 44
    category: existence
    check: "the SuppressionEntry named by the path {id} exists"
    error_id: ERR_SUPPRESSION_ENTRY_NOT_FOUND
    http_status: 404
    applies_to: "POST /compliance/suppression-entries/{id}/remove"
  - priority: 45
    category: existence
    check: "the ScrubJob named by the path {id} exists"
    error_id: ERR_SCRUB_JOB_NOT_FOUND
    http_status: 404
    applies_to: "POST /compliance/scrub-jobs/{id}/execute"
  - priority: 46
    category: existence
    check: "the DialerProfile named by the path {id} or by a payload dialer_profile_id exists"
    error_id: ERR_DIALER_PROFILE_NOT_FOUND
    http_status: 404
    applies_to: "GET /compliance/dialer-profiles/{id}, POST /compliance/dialer-profiles/{id}/approve, POST /compliance/campaigns"
  - priority: 47
    category: existence
    check: "the AgentScript named by the path {id}, by a payload agent_script_id, or by a payload disclosure_script_id exists"
    error_id: ERR_AGENT_SCRIPT_NOT_FOUND
    http_status: 404
    applies_to: "GET /compliance/agent-scripts/{id}, POST /compliance/agent-scripts/{id}/submit-review, POST /compliance/agent-scripts/{id}/approve, POST /compliance/agent-scripts/{id}/request-changes, POST /compliance/campaigns, POST /compliance/consent-records"
  - priority: 48
    category: existence
    check: "the CallingWindowPolicy named by the path {id} or by a payload supersedes_policy_id exists"
    error_id: ERR_CALLING_WINDOW_POLICY_NOT_FOUND
    http_status: 404
    applies_to: "GET /compliance/calling-window-policies/{id}, POST /compliance/calling-window-policies/{id}/declare-emergency, POST /compliance/calling-window-policies"
  - priority: 49
    category: existence
    check: "the ContactAttempt named by the path {id} exists"
    error_id: ERR_CONTACT_ATTEMPT_NOT_FOUND
    http_status: 404
    applies_to: "GET /compliance/contact-attempts/{id}, POST /compliance/contact-attempts/{id}/outcome, POST /compliance/contact-attempts/{id}/void"
  - priority: 50
    category: existence
    check: "the Complaint named by the path {id} exists"
    error_id: ERR_COMPLAINT_NOT_FOUND
    http_status: 404
    applies_to: "GET /compliance/complaints/{id}, POST /compliance/complaints/{id}/substantiate, POST /compliance/complaints/{id}/dismiss"
  - priority: 55
    category: state
    check: "payload expected_contact_version equals Contact.version (optimistic concurrency, §1.2.1 rule consent-create-stale-contact)"
    error_id: ERR_STALE_CONTACT_VERSION
    http_status: 412
    applies_to: "POST /compliance/consent-records"
  - priority: 56
    category: state
    check: "payload expected_campaign_version equals Campaign.version (optimistic concurrency, §1.2.1 rule scrub-job-create-stale-campaign and the launch certification)"
    error_id: ERR_STALE_CAMPAIGN_VERSION
    http_status: 412
    applies_to: "POST /compliance/scrub-jobs, POST /compliance/campaigns/{id}/launch"
  - priority: 60
    category: state
    check: "the Campaign is in a status from which this trigger is declared in §1.2 (launch needs PENDING_LAUNCH, suspend needs ACTIVE, resume needs SUSPENDED, close needs a non-CLOSED status, and creating a ScrubJob or a ContactAttempt needs DRAFT/PENDING_LAUNCH or ACTIVE respectively)"
    error_id: ERR_CAMPAIGN_STATE_INVALID
    http_status: 409
    applies_to: "POST /compliance/campaigns/{id}/launch, POST /compliance/campaigns/{id}/suspend, POST /compliance/campaigns/{id}/resume, POST /compliance/campaigns/{id}/close, POST /compliance/scrub-jobs, POST /compliance/scrub-jobs/{id}/execute, POST /compliance/contact-attempts"
  - priority: 61
    category: state
    check: "the ConsentRecord is in a status from which this trigger is declared (suspend needs ACTIVE; reinstate needs SUSPENDED or REVOKED; a SUPERSEDED record accepts nothing)"
    error_id: ERR_CONSENT_STATE_INVALID
    http_status: 409
    applies_to: "POST /compliance/consent-records/{id}/suspend, POST /compliance/consent-records/{id}/reinstate"
  - priority: 62
    category: state
    check: "the RevocationRequest dimension addressed by this call is in the right state (validate and reject need intake_status RECEIVED; propagate needs propagation_status IN_PROGRESS)"
    error_id: ERR_REVOCATION_STATE_INVALID
    http_status: 409
    applies_to: "POST /compliance/revocation-requests/{id}/validate, POST /compliance/revocation-requests/{id}/reject, POST /compliance/revocation-requests/{id}/propagate"
  - priority: 63
    category: state
    check: "the ScrubJob is PENDING (a COMPLETED, FAILED, SUPERSEDED or INVALIDATED job cannot be executed again)"
    error_id: ERR_SCRUB_JOB_STATE_INVALID
    http_status: 409
    applies_to: "POST /compliance/scrub-jobs/{id}/execute"
  - priority: 64
    category: state
    check: "the AgentScript is in a status from which this trigger is declared (submit-review needs DRAFT; approve and request-changes need IN_REVIEW; APPROVED is terminal)"
    error_id: ERR_SCRIPT_STATE_INVALID
    http_status: 409
    applies_to: "POST /compliance/agent-scripts/{id}/submit-review, POST /compliance/agent-scripts/{id}/approve, POST /compliance/agent-scripts/{id}/request-changes"
  - priority: 65
    category: state
    check: "the DialerProfile is DRAFT or LOCKED when approve is called (an already APPROVED profile rejects a second approval)"
    error_id: ERR_DIALER_PROFILE_STATE_INVALID
    http_status: 409
    applies_to: "POST /compliance/dialer-profiles/{id}/approve"
  - priority: 66
    category: state
    check: "the ContactAttempt is in a status from which this trigger is declared (outcome needs PENDING; void needs voided_at IS NULL)"
    error_id: ERR_ATTEMPT_STATE_INVALID
    http_status: 409
    applies_to: "POST /compliance/contact-attempts/{id}/outcome, POST /compliance/contact-attempts/{id}/void"
  - priority: 67
    category: state
    check: "the Complaint is OPEN (a SUBSTANTIATED or DISMISSED complaint is terminal)"
    error_id: ERR_COMPLAINT_STATE_INVALID
    http_status: 409
    applies_to: "POST /compliance/complaints/{id}/substantiate, POST /compliance/complaints/{id}/dismiss"
  - priority: 68
    category: state
    check: "the SuppressionEntry is ACTIVE when remove is called"
    error_id: ERR_SUPPRESSION_ENTRY_STATE_INVALID
    http_status: 409
    applies_to: "POST /compliance/suppression-entries/{id}/remove"
  - priority: 69
    category: state
    check: "the CallingWindowPolicy is ACTIVE and its emergency_status is NONE when declare-emergency is called (a SUPERSEDED policy or one already under emergency rejects the call)"
    error_id: ERR_POLICY_STATE_INVALID
    http_status: 409
    applies_to: "POST /compliance/calling-window-policies/{id}/declare-emergency"
  - priority: 70
    category: state
    check: "reinstating a ConsentRecord requires that no ACTIVE ConsentRecord already exists for the same (contact_id, channel)"
    error_id: ERR_CONSENT_CHANNEL_CONFLICT
    http_status: 409
    applies_to: "POST /compliance/consent-records/{id}/reinstate"
  - priority: 71
    category: state
    check: "the resume guard specific to Campaign.suspension_reason holds: SCRUB_STALE needs a current COMPLETED scrub, PROFILE_LOCKED and ABANDONMENT_BREACH need the DialerProfile back in APPROVED, ABANDONMENT_BREACH additionally needs the breached measurement day to have closed, and EMERGENCY_RESTRICTION needs every targeted state's policy back to emergency_status NONE"
    error_id: ERR_RESUME_BLOCKED
    http_status: 409
    applies_to: "POST /compliance/campaigns/{id}/resume"
  - priority: 72
    category: business_referential
    check: "an ACTIVE CallingWindowPolicy whose half-open effective period contains the clock instant exists for the recipient's state_code (every targeted state, for launch)"
    error_id: ERR_CALLING_WINDOW_POLICY_MISSING
    http_status: 422
    applies_to: "POST /compliance/contact-attempts, POST /compliance/campaigns/{id}/launch"
  - priority: 75
    category: business_safety
    check: "the recipient's phone number is not covered by any ACTIVE SuppressionEntry (NATIONAL or INTERNAL matching the number, or STATE matching the number and the contact's state_code), and Contact.internal_dnc_status is CLEAR"
    error_id: ERR_SUPPRESSED_NUMBER
    http_status: 409
    applies_to: "POST /compliance/contact-attempts"
  - priority: 76
    category: business_safety
    check: "at least one ACTIVE ConsentRecord exists for the (contact, requested channel) pair (calculations.consent_basis_selector found a candidate)"
    error_id: ERR_NO_CONSENT_ON_RECORD
    http_status: 422
    applies_to: "POST /compliance/contact-attempts"
  - priority: 77
    category: business_safety
    check: "for a campaign whose campaign_purpose is MARKETING, the selected ConsentRecord's consent_type is EXPRESS_WRITTEN"
    error_id: ERR_NO_EXPRESS_WRITTEN_CONSENT
    http_status: 422
    applies_to: "POST /compliance/contact-attempts"
  - priority: 78
    category: business_safety
    check: "for a WIRELESS or UNKNOWN phone_type, a reassigned-number database check exists that is younger than RND_VALIDITY_DAYS"
    error_id: ERR_RND_CHECK_REQUIRED
    http_status: 422
    applies_to: "POST /compliance/contact-attempts"
  - priority: 79
    category: business_safety
    check: "the most recent reassigned-number check did not return REASSIGNED (a reassigned number may not be dialed at all, safe harbour or not)"
    error_id: ERR_REASSIGNED_NUMBER
    http_status: 409
    applies_to: "POST /compliance/contact-attempts"
  - priority: 80
    category: business_safety
    check: "when the governing policy's recording_consent_regime is ALL_PARTY (all-party recording-consent state), the campaign's pinned AgentScript has recording_consent_mode ALL_PARTY"
    error_id: ERR_RECORDING_CONSENT_DISCLOSURE_MISSING
    http_status: 422
    applies_to: "POST /compliance/contact-attempts, POST /compliance/campaigns/{id}/launch"
  - priority: 81
    category: business_safety
    check: "the campaign's pinned AgentScript lists the recipient's state_code in covered_state_codes (every targeted state, for launch)"
    error_id: ERR_SCRIPT_STATE_NOT_COVERED
    http_status: 422
    applies_to: "POST /compliance/contact-attempts, POST /compliance/campaigns/{id}/launch"
  - priority: 84
    category: business_referential
    check: "the AgentScript referenced by the campaign is APPROVED"
    error_id: ERR_SCRIPT_NOT_APPROVED
    http_status: 409
    applies_to: "POST /compliance/campaigns/{id}/launch"
  - priority: 85
    category: business_referential
    check: "the AgentScript's channel equals the Campaign's channel"
    error_id: ERR_SCRIPT_CHANNEL_MISMATCH
    http_status: 422
    applies_to: "POST /compliance/campaigns, POST /compliance/campaigns/{id}/launch"
  - priority: 86
    category: business_referential
    check: "the DialerProfile referenced by the campaign has been approved at least once, i.e. its status is not DRAFT (a LOCKED profile falls to priority 87 instead, so both errors stay reachable)"
    error_id: ERR_DIALER_PROFILE_NOT_APPROVED
    http_status: 409
    applies_to: "POST /compliance/campaigns/{id}/launch"
  - priority: 87
    category: business_referential
    check: "the DialerProfile referenced by the campaign is not LOCKED"
    error_id: ERR_DIALER_PROFILE_LOCKED
    http_status: 409
    applies_to: "POST /compliance/campaigns/{id}/launch, POST /compliance/contact-attempts"
  - priority: 88
    category: business_referential
    check: "the newest ScrubJob of the campaign has status COMPLETED (not PENDING, FAILED, SUPERSEDED or INVALIDATED)"
    error_id: ERR_SCRUB_NOT_CURRENT
    http_status: 409
    applies_to: "POST /compliance/campaigns/{id}/launch, POST /compliance/contact-attempts"
  - priority: 89
    category: business_constraint
    check: "the launching campaign has at least one eligible target left after scrubbing"
    error_id: ERR_EMPTY_TARGET_SET
    http_status: 422
    applies_to: "POST /compliance/campaigns/{id}/launch"
  - priority: 90
    category: auth
    check: "the X-User-ID certifying the launch is different from the AgentScript.approved_by_user_id of the script the campaign points at (segregation of duties)"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /compliance/campaigns/{id}/launch"
  - priority: 92
    category: business_temporal
    check: "no ACTIVE CallingWindowPolicy for any state this campaign targets has emergency_status ACTIVE"
    error_id: ERR_EMERGENCY_RESTRICTION
    http_status: 409
    applies_to: "POST /compliance/contact-attempts, POST /compliance/campaigns/{id}/launch"
  - priority: 93
    category: business_temporal
    check: "the recipient's local calendar date is not listed in the governing policy's holiday_dates"
    error_id: ERR_HOLIDAY_RESTRICTION
    http_status: 409
    applies_to: "POST /compliance/contact-attempts"
  - priority: 94
    category: business_temporal
    check: "recipient_local_minutes falls inside the half-open window computed by calculations.effective_calling_window"
    error_id: ERR_OUTSIDE_CALLING_WINDOW
    http_status: 409
    applies_to: "POST /compliance/contact-attempts"
  - priority: 95
    category: business_temporal
    check: "the campaign's COMPLETED ScrubJob has not expired (clock now < expires_at, SCRUB_VALIDITY_DAYS = 31)"
    error_id: ERR_SCRUB_EXPIRED
    http_status: 409
    applies_to: "POST /compliance/contact-attempts, POST /compliance/campaigns/{id}/launch"
  - priority: 100
    category: business_constraint
    check: "phone_number is not already used by another Contact"
    error_id: ERR_DUPLICATE_PHONE_NUMBER
    http_status: 409
    applies_to: "POST /compliance/contacts"
  - priority: 101
    category: business_constraint
    check: "the new CallingWindowPolicy's effective period does not overlap an ACTIVE policy for the same state_code unless supersedes_policy_id names that policy (and window_start_local is strictly before window_end_local)"
    error_id: ERR_POLICY_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /compliance/calling-window-policies"
  - priority: 102
    category: business_constraint
    check: "no RevocationRequest for the same contact with intake_status RECEIVED already exists"
    error_id: ERR_DUPLICATE_REVOCATION_PENDING
    http_status: 409
    applies_to: "POST /compliance/revocation-requests"
  - priority: 103
    category: business_constraint
    check: "the revocation method is a reasonable one for the channel it arrived on: REPLY_STOP only on channel_received SMS, VERBAL_REQUEST only on VOICE, EMAIL_REQUEST only on EMAIL, WEB_PORTAL only on WEB, POSTAL_MAIL only on MAIL"
    error_id: ERR_METHOD_CHANNEL_MISMATCH
    http_status: 422
    applies_to: "POST /compliance/revocation-requests"
  - priority: 104
    category: business_constraint
    check: "the attempt's channel equals the campaign's channel"
    error_id: ERR_ATTEMPT_CHANNEL_MISMATCH
    http_status: 422
    applies_to: "POST /compliance/contact-attempts"
  - priority: 105
    category: business_constraint
    check: "an ABANDONED outcome carries abandon_message_played = true (the recorded abandonment message is mandatory)"
    error_id: ERR_ABANDON_MESSAGE_REQUIRED
    http_status: 422
    applies_to: "POST /compliance/contact-attempts/{id}/outcome"
  - priority: 106
    category: business_constraint
    check: "the outcome classification agrees with agent_connect_seconds: CONNECTED_LIVE requires a present value <= ABANDON_CONNECT_SECONDS (2), ABANDONED requires the value to be absent or > 2"
    error_id: ERR_ABANDON_CLASSIFICATION_INVALID
    http_status: 422
    applies_to: "POST /compliance/contact-attempts/{id}/outcome"
  - priority: 107
    category: business_constraint
    check: "a MACHINE_ANSWERED outcome requires the campaign's DialerProfile to have amd_enabled = true"
    error_id: ERR_AMD_NOT_ENABLED
    http_status: 422
    applies_to: "POST /compliance/contact-attempts/{id}/outcome"
  - priority: 108
    category: business_constraint
    check: "approving a DialerProfile whose abandonment_limit_pct exceeds REGULATORY_ABANDONMENT_CEILING_PCT (3.00), i.e. requires_waiver = true, requires a non-empty waiver_reference"
    error_id: ERR_ABANDONMENT_LIMIT_WAIVER_REQUIRED
    http_status: 422
    applies_to: "POST /compliance/dialer-profiles/{id}/approve"
  - priority: 110
    category: business_constraint
    check: "the previous non-voided attempt to this contact is more than CONTACT_COOLDOWN_MINUTES (30) old; the guard interval is closed at both ends"
    error_id: ERR_CONTACT_COOLDOWN_ACTIVE
    http_status: 409
    applies_to: "POST /compliance/contact-attempts"
  - priority: 120
    category: business_fiscal
    check: "the campaign's count of PENDING attempts is below the line ceiling from calculations.dialer_pacing_lines (instantaneous pacing capacity)"
    error_id: ERR_PACING_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /compliance/contact-attempts"
  - priority: 121
    category: business_fiscal
    check: "Contact.attempt_budget_remaining is at least 1 (frequency cap)"
    error_id: ERR_ATTEMPT_BUDGET_EXHAUSTED
    http_status: 409
    applies_to: "POST /compliance/contact-attempts"

endpoints:
  # ---------------- Contact ----------------
  - method: POST
    path: "/compliance/contacts"
    description: "Import a consumer contact record with its recipient time-zone offset, state and frequency cap."
    roles: [PlatformAdmin]
    code: 201
    input: [phone_number, state_code, utc_offset_minutes, time_zone_label, "phone_type?", "attempt_budget_total?"]
    output: Contact
    side_effects: ["attempts_charged = 0, attempt_budget_remaining = attempt_budget_total, internal_dnc_status = CLEAR, risk_tier = LOW, all consent census counters = 0, rnd_result = NOT_CHECKED"]
  - method: GET
    path: "/compliance/contacts/{id}"
    description: "Read a contact with its live suppression status, risk tier, consent census and attempt-budget numbers."
    roles: [PlatformAdmin, ComplianceOfficer, CampaignManager, DialerOperator, Consumer]
    code: 200
    input: []
    output: Contact
    side_effects: []
  - method: POST
    path: "/compliance/contacts/{id}/number-status-check"
    description: "Run a reassigned-number database check for this contact's phone number against the claimed consent date, recording the result and its currency stamp."
    roles: [DialerOperator, CampaignManager, ComplianceOfficer]
    code: 200
    input: [claimed_consent_date]
    output: Contact
    side_effects:
      - "sets rnd_result per calculations.rnd_check_currency, rnd_checked_at = clock now, rnd_claimed_consent_date = payload value, rnd_safe_harbor_eligible = (rnd_result == NO_DATA)"
      - "increments Contact.version by 1"
  - method: GET
    path: "/compliance/contacts/{id}/revocation-requests"
    description: "List every revocation request received for this contact, newest received_at first."
    roles: [ComplianceOfficer, DialerOperator, Consumer]
    code: 200
    input: ["intake_status?", "propagation_status?", "limit?", "offset?"]
    output: RevocationRequest[]
    side_effects: []

  # ---------------- ConsentRecord ----------------
  - method: POST
    path: "/compliance/consent-records"
    description: "Capture consent for one channel, superseding any prior ACTIVE record for the same (contact, channel) pair. Carries the contact's expected version (§1.2.1 consent-create-stale-contact)."
    roles: [Consumer, ComplianceOfficer]
    code: 201
    input: [contact_id, channel, consent_type, capture_method, disclosure_script_id, disclosure_text_version, signature_evidence, expected_contact_version]
    output: ConsentRecord
    side_effects:
      - "captured_at = clock now, status = ACTIVE"
      - "any prior ACTIVE ConsentRecord for the same (contact_id, channel) becomes SUPERSEDED"
      - "recomputes the contact's consent census (total_consent_count grows by 1) and increments Contact.version by 1"
  - method: GET
    path: "/compliance/consent-records/{id}"
    description: "Read one consent record with its status, revocation stamp and reinstatement count."
    roles: [ComplianceOfficer, CampaignManager, DialerOperator, Consumer]
    code: 200
    input: []
    output: ConsentRecord
    side_effects: []
  - method: GET
    path: "/compliance/consent-records"
    description: "List consent records, filterable by contact, by the disclosure script they were captured under, by channel and by status."
    roles: [ComplianceOfficer, CampaignManager, DialerOperator, Consumer]
    code: 200
    input: ["contact_id?", "disclosure_script_id?", "channel?", "status?", "limit?", "offset?"]
    output: ConsentRecord[]
    side_effects: []
  - method: POST
    path: "/compliance/consent-records/{id}/suspend"
    description: "Suspend an ACTIVE consent record pending investigation without destroying it."
    roles: [ComplianceOfficer]
    code: 200
    input: [reason]
    output: ConsentRecord
    side_effects: ["status ACTIVE -> SUSPENDED, suspended_reason set", "recomputes the contact's consent census and increments Contact.version by 1"]
  - method: POST
    path: "/compliance/consent-records/{id}/reinstate"
    description: "Return a SUSPENDED or REVOKED consent record to ACTIVE; reinstating the contact's last REVOKED record also clears the internal DNC suppression it caused."
    roles: [ComplianceOfficer]
    code: 200
    input: [reinstatement_note]
    output: ConsentRecord
    side_effects:
      - "status SUSPENDED|REVOKED -> ACTIVE, reinstatement_count incremented, suspended_reason and revoked_at cleared"
      - "when no REVOKED record remains and risk_tier != CRITICAL: Contact.internal_dnc_status becomes CLEAR and ACTIVE INTERNAL SuppressionEntry rows for the number become REMOVED with removal_reason CONSENT_REINSTATED"
      - "recomputes the contact's consent census (total unchanged) and increments Contact.version by 1"

  # ---------------- RevocationRequest ----------------
  - method: POST
    path: "/compliance/revocation-requests"
    description: "Log a consumer revocation received by any reasonable method, computing its 10-business-day propagation deadline from the governing state policy's holiday calendar."
    roles: [Consumer, DialerOperator, ComplianceOfficer]
    code: 201
    input: [contact_id, channel_received, method, scope, received_note]
    output: RevocationRequest
    side_effects:
      - "received_at = clock now, intake_status = RECEIVED, propagation_status = NOT_STARTED"
      - "propagation_deadline_at computed per calculations.propagation_deadline"
  - method: GET
    path: "/compliance/revocation-requests/{id}"
    description: "Read one revocation request with both of its state dimensions and its propagation deadline."
    roles: [ComplianceOfficer, DialerOperator, Consumer]
    code: 200
    input: []
    output: RevocationRequest
    side_effects: []
  - method: POST
    path: "/compliance/revocation-requests/{id}/validate"
    description: "Accept the revocation as genuine. Origin of the depth-4 cascade: consent rows revoke, the contact goes on the internal DNC list, dependent scrubs invalidate and their campaigns suspend."
    roles: [ComplianceOfficer]
    code: 200
    input: [validation_note]
    output: RevocationRequest
    side_effects:
      - "intake_status RECEIVED -> VALIDATED, validated_at = clock now, propagation_status NOT_STARTED -> IN_PROGRESS"
      - "hop 1: in-scope ACTIVE and SUSPENDED ConsentRecord rows of the contact become REVOKED; consent_records_revoked_count set"
      - "hop 2: Contact.internal_dnc_status = SUPPRESSED, census recomputed, Contact.version incremented, and an ACTIVE INTERNAL SuppressionEntry created for the number when none exists"
      - "hop 3: current COMPLETED ScrubJob rows covering that state and requesting INTERNAL become INVALIDATED with invalidation_reason NEW_INTERNAL_SUPPRESSION"
      - "hop 4: their ACTIVE campaigns become SUSPENDED with suspension_reason SCRUB_STALE, voiding PENDING attempts and crediting attempt budgets"
  - method: POST
    path: "/compliance/revocation-requests/{id}/reject"
    description: "Reject a revocation intake (wrong number, unverifiable). No consent row is touched and propagation never starts."
    roles: [ComplianceOfficer]
    code: 200
    input: [rejection_reason]
    output: RevocationRequest
    side_effects: ["intake_status RECEIVED -> REJECTED, rejection_reason set, propagation_status stays NOT_STARTED"]
  - method: POST
    path: "/compliance/revocation-requests/{id}/propagate"
    description: "Record propagation of an honoured revocation to the downstream systems; lands PROPAGATED when inside the deadline and OVERDUE when past it."
    roles: [ComplianceOfficer]
    code: 200
    input: [target_systems]
    output: RevocationRequest
    side_effects:
      - "propagated_at = clock now, target_systems stored"
      - "propagation_status IN_PROGRESS -> PROPAGATED when clock now <= propagation_deadline_at, otherwise -> OVERDUE"
      - "the OVERDUE branch increments Contact.overdue_propagation_count and Contact.version by 1"

  # ---------------- SuppressionEntry ----------------
  - method: POST
    path: "/compliance/suppression-entries"
    description: "Add a do-not-call entry to the national, state or internal list with the refresh stamp that proves list currency."
    roles: [ComplianceOfficer, PlatformAdmin]
    code: 201
    input: [list_type, phone_number, "state_code?", source, source_refreshed_at]
    output: SuppressionEntry
    side_effects:
      - "status = ACTIVE"
      - "an INTERNAL entry for a phone number belonging to an existing Contact invalidates that contact's states' current COMPLETED INTERNAL scrub jobs and suspends their ACTIVE campaigns with suspension_reason SCRUB_STALE"
  - method: GET
    path: "/compliance/suppression-entries"
    description: "List suppression entries by list type, phone number, state and status."
    roles: [ComplianceOfficer, CampaignManager, DialerOperator, PlatformAdmin]
    code: 200
    input: ["list_type?", "phone_number?", "state_code?", "status?", "limit?", "offset?"]
    output: SuppressionEntry[]
    side_effects: []
  - method: POST
    path: "/compliance/suppression-entries/{id}/remove"
    description: "Remove a suppression entry; already-invalidated scrub jobs stay invalidated."
    roles: [ComplianceOfficer]
    code: 200
    input: [removal_reason]
    output: SuppressionEntry
    side_effects: ["status ACTIVE -> REMOVED, removed_at = clock now, removal_reason set"]

  # ---------------- ScrubJob ----------------
  - method: POST
    path: "/compliance/scrub-jobs"
    description: "Queue a DNC scrub of a campaign's target states against the requested list types. Carries the campaign's expected version (§1.2.1 scrub-job-create-stale-campaign)."
    roles: [CampaignManager, ComplianceOfficer]
    code: 201
    input: [campaign_id, list_types, expected_campaign_version]
    output: ScrubJob
    side_effects: ["status = PENDING, requested_at = clock now", "increments Campaign.version by 1"]
  - method: GET
    path: "/compliance/scrub-jobs/{id}"
    description: "Read a scrub job with its counts, validity window and failure or invalidation reason."
    roles: [CampaignManager, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: ScrubJob
    side_effects: []
  - method: POST
    path: "/compliance/scrub-jobs/{id}/execute"
    description: "Run the queued scrub. Completes and promotes the campaign to PENDING_LAUNCH when every requested list is current, fails without promoting it otherwise."
    roles: [CampaignManager, ComplianceOfficer]
    code: 200
    input: []
    output: ScrubJob
    side_effects:
      - "COMPLETED branch: counts set per calculations.scrub_target_resolution, completed_at = clock now, expires_at = completed_at + 31 days, sibling COMPLETED jobs become SUPERSEDED, Campaign.latest_scrub_status = COMPLETED, Campaign.eligible_target_count updated, Campaign DRAFT -> PENDING_LAUNCH, Campaign.version incremented"
      - "FAILED branch: failure_reason = STALE_OR_EMPTY_LIST, Campaign.latest_scrub_status = FAILED, Campaign.status unchanged, Campaign.version incremented"
  - method: GET
    path: "/compliance/campaigns/{id}/scrub-jobs"
    description: "List every scrub job of a campaign, newest requested_at first."
    roles: [CampaignManager, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ScrubJob[]
    side_effects: []

  # ---------------- Campaign ----------------
  - method: POST
    path: "/compliance/campaigns"
    description: "Create a draft outbound campaign bound to a dialer profile and an agent script for a set of target states."
    roles: [CampaignManager]
    code: 201
    input: [name, channel, campaign_purpose, target_state_codes, dialer_profile_id, agent_script_id]
    output: Campaign
    side_effects: ["status = DRAFT, latest_scrub_status = null, all counters 0, both abandonment rates 0.00"]
  - method: GET
    path: "/compliance/campaigns/{id}"
    description: "Read a campaign with both abandonment measures, the rolling 7-day compliance rate, its scrub status and its suspension reason."
    roles: [CampaignManager, ComplianceOfficer, DialerOperator, PlatformAdmin]
    code: 200
    input: []
    output: Campaign
    side_effects: ["recomputes rolling_compliance_rate_pct per calculations.rolling_compliance_rate"]
  - method: GET
    path: "/compliance/campaigns"
    description: "List campaigns filterable by the agent script or dialer profile they reference and by status."
    roles: [CampaignManager, ComplianceOfficer, DialerOperator, PlatformAdmin]
    code: 200
    input: ["agent_script_id?", "dialer_profile_id?", "status?", "channel?", "limit?", "offset?"]
    output: Campaign[]
    side_effects: []
  - method: POST
    path: "/compliance/campaigns/{id}/launch"
    description: "Certify and launch a scrubbed campaign. The certifying officer may not be the officer who approved the pinned script (segregation of duties)."
    roles: [ComplianceOfficer]
    code: 200
    input: [certification_note, expected_campaign_version]
    output: Campaign
    side_effects:
      - "status PENDING_LAUNCH -> ACTIVE, launch_certified_by_user_id = X-User-ID, pinned_script_version = AgentScript.version"
      - "measurement_date = UTC date of clock now, all today counters 0, both rates 0.00"
      - "increments Campaign.version by 1"
  - method: POST
    path: "/compliance/campaigns/{id}/suspend"
    description: "Manually suspend an active campaign; every PENDING attempt is voided and its attempt budget credited back."
    roles: [ComplianceOfficer]
    code: 200
    input: [suspension_note]
    output: Campaign
    side_effects: ["status ACTIVE -> SUSPENDED with suspension_reason MANUAL", "PENDING attempts VOIDED (CAMPAIGN_SUSPENDED) and contacts' attempt budgets credited", "increments Campaign.version by 1"]
  - method: POST
    path: "/compliance/campaigns/{id}/resume"
    description: "Return a suspended campaign to ACTIVE once the condition named by suspension_reason has been cleared."
    roles: [ComplianceOfficer]
    code: 200
    input: [resume_note]
    output: Campaign
    side_effects: ["status SUSPENDED -> ACTIVE, suspension_reason cleared", "increments Campaign.version by 1"]
  - method: POST
    path: "/compliance/campaigns/{id}/close"
    description: "Close a campaign permanently from any non-terminal status, voiding its PENDING attempts."
    roles: [CampaignManager]
    code: 200
    input: [closure_note]
    output: Campaign
    side_effects: ["status -> CLOSED", "PENDING attempts VOIDED (CAMPAIGN_SUSPENDED) and contacts' attempt budgets credited", "increments Campaign.version by 1"]

  # ---------------- DialerProfile ----------------
  - method: POST
    path: "/compliance/dialer-profiles"
    description: "Define a dialer configuration: mode, abandonment limit, AMD behaviour, abandonment-message length and staffed agent count."
    roles: [DialerOperator, CampaignManager]
    code: 201
    input: [mode, agents_available, "abandonment_limit_pct?", "amd_enabled?", "amd_abandon_on_machine?", "abandon_message_seconds?"]
    output: DialerProfile
    side_effects: ["status = DRAFT", "requires_waiver = (abandonment_limit_pct > 3.00)", "max_lines_last_computed = agents_available"]
  - method: GET
    path: "/compliance/dialer-profiles/{id}"
    description: "Read a dialer profile with its waiver requirement, lock reason and last computed line ceiling."
    roles: [DialerOperator, CampaignManager, ComplianceOfficer, PlatformAdmin]
    code: 200
    input: []
    output: DialerProfile
    side_effects: []
  - method: POST
    path: "/compliance/dialer-profiles/{id}/approve"
    description: "Approve a draft profile, or re-approve one locked by an abandonment breach. A limit above the 3.00% regulatory ceiling requires a waiver reference."
    roles: [ComplianceOfficer]
    code: 200
    input: ["waiver_reference?"]
    output: DialerProfile
    side_effects: ["status DRAFT|LOCKED -> APPROVED, locked_reason cleared, approved_by_user_id = X-User-ID", "max_lines_last_computed recomputed per calculations.dialer_pacing_lines at a 0.00 regulatory rate"]

  # ---------------- AgentScript ----------------
  - method: POST
    path: "/compliance/agent-scripts"
    description: "Draft an agent script with its disclosure blocks, recording-consent mode and the states it is cleared for."
    roles: [CampaignManager, ComplianceOfficer]
    code: 201
    input: [name, channel, disclosure_blocks, recording_consent_mode, covered_state_codes]
    output: AgentScript
    side_effects: ["status = DRAFT, review_cycle_count = 0"]
  - method: GET
    path: "/compliance/agent-scripts/{id}"
    description: "Read an agent script with its approval stamp and review history counter."
    roles: [CampaignManager, ComplianceOfficer, DialerOperator, PlatformAdmin]
    code: 200
    input: []
    output: AgentScript
    side_effects: []
  - method: POST
    path: "/compliance/agent-scripts/{id}/submit-review"
    description: "Send a draft script to compliance review."
    roles: [CampaignManager, ComplianceOfficer]
    code: 200
    input: []
    output: AgentScript
    side_effects: ["status DRAFT -> IN_REVIEW, change_note cleared"]
  - method: POST
    path: "/compliance/agent-scripts/{id}/approve"
    description: "Approve a script under review. The approving user id becomes the segregation-of-duties key for every campaign pinned to it."
    roles: [ComplianceOfficer]
    code: 200
    input: [approval_note]
    output: AgentScript
    side_effects: ["status IN_REVIEW -> APPROVED, approved_by_user_id = X-User-ID, approved_at = clock now"]
  - method: POST
    path: "/compliance/agent-scripts/{id}/request-changes"
    description: "Send a script under review back to draft with a change note, incrementing the review cycle counter."
    roles: [ComplianceOfficer]
    code: 200
    input: [change_note]
    output: AgentScript
    side_effects: ["status IN_REVIEW -> DRAFT, change_note stored, review_cycle_count incremented by 1"]

  # ---------------- CallingWindowPolicy ----------------
  - method: POST
    path: "/compliance/calling-window-policies"
    description: "Publish a state calling-window policy with its holiday calendar, recording-consent regime and effective period, optionally superseding an existing policy for that state."
    roles: [PlatformAdmin, ComplianceOfficer]
    code: 201
    input: [state_code, window_start_local, window_end_local, recording_consent_regime, effective_from, effective_to, "holiday_dates?", "supersedes_policy_id?"]
    output: CallingWindowPolicy
    side_effects:
      - "status = ACTIVE, emergency_status = NONE, window_start_minutes and window_end_minutes derived from the HH:MM inputs"
      - "when supersedes_policy_id is present, that policy becomes SUPERSEDED and its effective_to is truncated to this policy's effective_from"
  - method: GET
    path: "/compliance/calling-window-policies/{id}"
    description: "Read a calling-window policy with its derived minute bounds and emergency status."
    roles: [PlatformAdmin, ComplianceOfficer, CampaignManager, DialerOperator]
    code: 200
    input: []
    output: CallingWindowPolicy
    side_effects: []
  - method: GET
    path: "/compliance/calling-window-policies"
    description: "List calling-window policies by state, by the policy they supersede, and by status."
    roles: [PlatformAdmin, ComplianceOfficer, CampaignManager, DialerOperator]
    code: 200
    input: ["state_code?", "supersedes_policy_id?", "status?", "emergency_status?", "limit?", "offset?"]
    output: CallingWindowPolicy[]
    side_effects: []
  - method: POST
    path: "/compliance/calling-window-policies/{id}/declare-emergency"
    description: "Declare an emergency calling restriction for a state, immediately suspending every active campaign that targets it."
    roles: [PlatformAdmin]
    code: 200
    input: [emergency_note]
    output: CallingWindowPolicy
    side_effects:
      - "emergency_status NONE -> ACTIVE, emergency_declared_at = clock now, emergency_note stored"
      - "every ACTIVE Campaign targeting this state becomes SUSPENDED with suspension_reason EMERGENCY_RESTRICTION, voiding its PENDING attempts and crediting those contacts' attempt budgets"

  # ---------------- ContactAttempt ----------------
  - method: POST
    path: "/compliance/contact-attempts"
    description: |
      Request a dial or text. Runs the full gate ladder in §1.4 priority order -
      campaign state, policy availability, suppression, consent basis, reassigned-number
      currency, recording-consent regime, script state coverage, profile status, scrub
      currency and expiry, emergency, holiday, calling window, cooldown, pacing capacity,
      then frequency cap - and only then creates a PENDING attempt.
    roles: [DialerOperator]
    code: 201
    input: [campaign_id, contact_id, channel]
    output: ContactAttempt
    side_effects:
      - "requested_at = clock now, outcome = PENDING"
      - "consent_record_id per calculations.consent_basis_selector, calling_window_policy_id per calculations.policy_selector"
      - "recipient_local_minutes, recipient_local_time, effective_window_start_minutes, effective_window_end_minutes recorded on the attempt"
      - "cooldown_until = clock now + 30 minutes, max_lines_snapshot per calculations.dialer_pacing_lines"
      - "Contact.attempts_charged incremented, attempt_budget_remaining decremented, Contact.version incremented"
      - "Campaign.permitted_attempt_count incremented"
  - method: GET
    path: "/compliance/contact-attempts/{id}"
    description: "Read an attempt with the consent basis and policy it was authorised under, the window it was measured against, and its outcome."
    roles: [DialerOperator, ComplianceOfficer, CampaignManager]
    code: 200
    input: []
    output: ContactAttempt
    side_effects: []
  - method: GET
    path: "/compliance/contact-attempts"
    description: "List attempts filterable by campaign, contact, the consent record relied on, the calling-window policy applied, and outcome."
    roles: [DialerOperator, ComplianceOfficer, CampaignManager]
    code: 200
    input: ["campaign_id?", "contact_id?", "consent_record_id?", "calling_window_policy_id?", "outcome?", "limit?", "offset?"]
    output: ContactAttempt[]
    side_effects: []
  - method: POST
    path: "/compliance/contact-attempts/{id}/outcome"
    description: "Record the dispositions of a pending attempt: live connect, abandonment (message mandatory), machine answer (AMD required) or no answer. Only the abandonment branch can breach the rate limit."
    roles: [DialerOperator]
    code: 200
    input: [outcome, "agent_connect_seconds?", "abandon_message_played?"]
    output: ContactAttempt
    side_effects:
      - "outcome_recorded_at = clock now, branch-specific fields stored"
      - "Campaign day counters rolled over when the UTC date has changed, then incremented; both abandonment measures and rolling_compliance_rate_pct recomputed; DialerProfile.max_lines_last_computed refreshed"
      - "ABANDONED past the profile limit with at least 2 measured live answers suspends the campaign (ABANDONMENT_BREACH), locks the profile, and suspends the profile's other ACTIVE campaigns (PROFILE_LOCKED)"
  - method: POST
    path: "/compliance/contact-attempts/{id}/void"
    description: "Void an attempt for compliance reasons from any status, crediting the contact's attempt budget and reversing its contribution to the campaign counters."
    roles: [ComplianceOfficer]
    code: 200
    input: [void_reason]
    output: ContactAttempt
    side_effects:
      - "voided_at = clock now, void_reason stored"
      - "Contact.attempts_charged decremented and attempt_budget_remaining incremented (calculations.attempt_budget_invariant), Contact.version incremented"
      - "the campaign counter this attempt had incremented is decremented and both abandonment measures recomputed; an already applied suspension is not reversed"

  # ---------------- Complaint ----------------
  - method: POST
    path: "/compliance/complaints"
    description: "Intake a consumer or regulator complaint, scoring it provisionally and sizing its pattern cluster for litigation monitoring."
    roles: [ComplianceOfficer, DialerOperator, Consumer]
    code: 201
    input: [contact_id, campaign_id, source, alleged_violation_type, narrative, "litigation_flag?"]
    output: Complaint
    side_effects:
      - "received_at = clock now, status = OPEN"
      - "provisional_risk_score per the provisional variant of calculations.complaint_risk_score"
      - "pattern_cluster_size recomputed for every member of this complaint's cluster"
  - method: GET
    path: "/compliance/complaints/{id}"
    description: "Read a complaint with both risk scores, its verified attempt count, statutory exposure and cluster size."
    roles: [ComplianceOfficer, CampaignManager, PlatformAdmin, Consumer]
    code: 200
    input: []
    output: Complaint
    side_effects: []
  - method: GET
    path: "/compliance/complaints"
    description: "List complaints filterable by contact, campaign, status, litigation flag and alleged violation type."
    roles: [ComplianceOfficer, CampaignManager, PlatformAdmin, Consumer]
    code: 200
    input: ["contact_id?", "campaign_id?", "status?", "litigation_flag?", "alleged_violation_type?", "limit?", "offset?"]
    output: Complaint[]
    side_effects: []
  - method: POST
    path: "/compliance/complaints/{id}/substantiate"
    description: "Substantiate a complaint: verify the attempt evidence, apply the adjudicated score, compute statutory exposure and re-tier the contact (a CRITICAL tier suppresses the contact and freezes their consents)."
    roles: [ComplianceOfficer]
    code: 200
    input: [willful, finding_note]
    output: Complaint
    side_effects:
      - "status OPEN -> SUBSTANTIATED, willful and finding_note stored"
      - "verified_attempt_count, adjudicated_risk_score and exposure_cents computed"
      - "Contact.risk_tier recomputed from the contact's SUBSTANTIATED peak score; Contact.version incremented"
      - "a CRITICAL tier sets Contact.internal_dnc_status = SUPPRESSED, creates an ACTIVE INTERNAL SuppressionEntry when none exists, and SUSPENDS every ACTIVE ConsentRecord of the contact"
      - "pattern_cluster_size recomputed for the cluster"
  - method: POST
    path: "/compliance/complaints/{id}/dismiss"
    description: "Dismiss a complaint; no score, exposure, tier change or suppression follows, and the complaint leaves its pattern cluster."
    roles: [ComplianceOfficer]
    code: 200
    input: [dismissal_note]
    output: Complaint
    side_effects: ["status OPEN -> DISMISSED, dismissal_note stored", "adjudicated_risk_score, verified_attempt_count, exposure_cents and willful stay null; Contact.risk_tier untouched", "pattern_cluster_size recomputed for the remaining cluster members"]

  # ---------------- test-driving endpoints (§1.5 priority ladder step 3) ----------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock every timestamp, window, deadline and expiry rule in this domain reads. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z; it never falls back to real wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects: ["no entity is mutated; subsequent requests observe the new clock instant"]
  - method: POST
    path: "/_rnd/records"
    description: "Seed the reassigned-number database that POST /compliance/contacts/{id}/number-status-check queries. A number with no seeded record yields rnd_result NO_DATA (safe harbour)."
    roles: [PlatformAdmin]
    code: 201
    input: [phone_number, reassigned_on]
    output: "{ phone_number: string, reassigned_on: string }"
    side_effects: ["no business entity is mutated; only the synthetic RND lookup table is populated"]

errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or the role is not one of the five declared roles"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "the acting role is not listed on the endpoint being called"
  - id: ERR_NOT_CONTACT_OWNER
    http: 403
    condition: "a Consumer submitted a consent capture or a revocation for a contact_id other than their own X-User-ID"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "malformed body, missing required field, unknown enum member, numeric value out of range, non-E.164 phone number, unparseable timestamp, or pagination limit outside 1..100"
  - id: ERR_CONTACT_NOT_FOUND
    http: 404
    condition: "no Contact exists for the path id or the payload contact_id"
  - id: ERR_CAMPAIGN_NOT_FOUND
    http: 404
    condition: "no Campaign exists for the path id or the payload campaign_id"
  - id: ERR_CONSENT_RECORD_NOT_FOUND
    http: 404
    condition: "no ConsentRecord exists for the path id"
  - id: ERR_REVOCATION_REQUEST_NOT_FOUND
    http: 404
    condition: "no RevocationRequest exists for the path id"
  - id: ERR_SUPPRESSION_ENTRY_NOT_FOUND
    http: 404
    condition: "no SuppressionEntry exists for the path id"
  - id: ERR_SCRUB_JOB_NOT_FOUND
    http: 404
    condition: "no ScrubJob exists for the path id"
  - id: ERR_DIALER_PROFILE_NOT_FOUND
    http: 404
    condition: "no DialerProfile exists for the path id or the payload dialer_profile_id"
  - id: ERR_AGENT_SCRIPT_NOT_FOUND
    http: 404
    condition: "no AgentScript exists for the path id, the payload agent_script_id, or the payload disclosure_script_id"
  - id: ERR_CALLING_WINDOW_POLICY_NOT_FOUND
    http: 404
    condition: "no CallingWindowPolicy exists for the path id or the payload supersedes_policy_id"
  - id: ERR_CONTACT_ATTEMPT_NOT_FOUND
    http: 404
    condition: "no ContactAttempt exists for the path id"
  - id: ERR_COMPLAINT_NOT_FOUND
    http: 404
    condition: "no Complaint exists for the path id"
  - id: ERR_STALE_CONTACT_VERSION
    http: 412
    condition: "expected_contact_version does not equal the Contact's current version on POST /compliance/consent-records"
  - id: ERR_STALE_CAMPAIGN_VERSION
    http: 412
    condition: "expected_campaign_version does not equal the Campaign's current version on POST /compliance/scrub-jobs or on launch"
  - id: ERR_CAMPAIGN_STATE_INVALID
    http: 409
    condition: "the Campaign's status does not admit this trigger (launching a DRAFT, suspending a SUSPENDED, resuming an ACTIVE, dialing a non-ACTIVE campaign, scrubbing a CLOSED one, or any trigger on a CLOSED campaign)"
  - id: ERR_CONSENT_STATE_INVALID
    http: 409
    condition: "the ConsentRecord's status does not admit this trigger (suspending a non-ACTIVE record, reinstating an ACTIVE one, or any trigger on a SUPERSEDED record)"
  - id: ERR_REVOCATION_STATE_INVALID
    http: 409
    condition: "validate or reject called when intake_status is not RECEIVED, or propagate called when propagation_status is not IN_PROGRESS"
  - id: ERR_SCRUB_JOB_STATE_INVALID
    http: 409
    condition: "execute called on a ScrubJob that is not PENDING"
  - id: ERR_SCRIPT_STATE_INVALID
    http: 409
    condition: "submit-review on a non-DRAFT script, or approve / request-changes on a script that is not IN_REVIEW (APPROVED is terminal)"
  - id: ERR_DIALER_PROFILE_STATE_INVALID
    http: 409
    condition: "approve called on a DialerProfile that is already APPROVED"
  - id: ERR_ATTEMPT_STATE_INVALID
    http: 409
    condition: "outcome recorded on an attempt that is not PENDING, or void called on an already VOIDED attempt"
  - id: ERR_COMPLAINT_STATE_INVALID
    http: 409
    condition: "substantiate or dismiss called on a Complaint that is not OPEN"
  - id: ERR_SUPPRESSION_ENTRY_STATE_INVALID
    http: 409
    condition: "remove called on a SuppressionEntry that is already REMOVED"
  - id: ERR_POLICY_STATE_INVALID
    http: 409
    condition: "declare-emergency called on a SUPERSEDED policy or on one whose emergency_status is already ACTIVE"
  - id: ERR_CONSENT_CHANNEL_CONFLICT
    http: 409
    condition: "reinstating a consent record while another ACTIVE record already covers the same (contact, channel) pair"
  - id: ERR_RESUME_BLOCKED
    http: 409
    condition: "resume called while the condition named by suspension_reason still holds (stale scrub, still-locked profile, unclosed breach day, or live emergency)"
  - id: ERR_CALLING_WINDOW_POLICY_MISSING
    http: 422
    condition: "no ACTIVE CallingWindowPolicy covers the recipient's state at the current clock instant (or a targeted state has none, at launch)"
  - id: ERR_SUPPRESSED_NUMBER
    http: 409
    condition: "the recipient's number is on an ACTIVE national, state or internal suppression list, or the contact's internal_dnc_status is SUPPRESSED"
  - id: ERR_NO_CONSENT_ON_RECORD
    http: 422
    condition: "no ACTIVE ConsentRecord exists for the requested (contact, channel) pair"
  - id: ERR_NO_EXPRESS_WRITTEN_CONSENT
    http: 422
    condition: "a MARKETING campaign attempted to reach a contact whose selected consent_type is not EXPRESS_WRITTEN"
  - id: ERR_RND_CHECK_REQUIRED
    http: 422
    condition: "a WIRELESS or UNKNOWN number was dialed with no reassigned-number check, or with one older than RND_VALIDITY_DAYS"
  - id: ERR_REASSIGNED_NUMBER
    http: 409
    condition: "the most recent reassigned-number check returned REASSIGNED"
  - id: ERR_RECORDING_CONSENT_DISCLOSURE_MISSING
    http: 422
    condition: "the governing policy's recording_consent_regime is ALL_PARTY but the pinned script's recording_consent_mode is ONE_PARTY"
  - id: ERR_SCRIPT_STATE_NOT_COVERED
    http: 422
    condition: "the pinned AgentScript does not list the recipient's state_code (or a targeted state, at launch) in covered_state_codes"
  - id: ERR_SCRIPT_NOT_APPROVED
    http: 409
    condition: "the campaign's AgentScript is not APPROVED at launch time"
  - id: ERR_SCRIPT_CHANNEL_MISMATCH
    http: 422
    condition: "the AgentScript's channel differs from the Campaign's channel"
  - id: ERR_DIALER_PROFILE_NOT_APPROVED
    http: 409
    condition: "the campaign's DialerProfile is still DRAFT at launch time"
  - id: ERR_DIALER_PROFILE_LOCKED
    http: 409
    condition: "the campaign's DialerProfile is LOCKED after an abandonment breach"
  - id: ERR_SCRUB_NOT_CURRENT
    http: 409
    condition: "the campaign's newest ScrubJob is PENDING, FAILED, SUPERSEDED or INVALIDATED rather than COMPLETED"
  - id: ERR_EMPTY_TARGET_SET
    http: 422
    condition: "launch attempted with eligible_target_count 0 - every target was suppressed by the scrub"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the X-User-ID certifying a launch is the same officer who approved the campaign's AgentScript"
  - id: ERR_EMERGENCY_RESTRICTION
    http: 409
    condition: "an ACTIVE policy for a targeted state has emergency_status ACTIVE"
  - id: ERR_HOLIDAY_RESTRICTION
    http: 409
    condition: "the recipient's local calendar date is listed in the governing policy's holiday_dates"
  - id: ERR_OUTSIDE_CALLING_WINDOW
    http: 409
    condition: "recipient_local_minutes falls outside the half-open effective window (before effective_start, or at/after effective_end)"
  - id: ERR_SCRUB_EXPIRED
    http: 409
    condition: "the campaign's COMPLETED scrub has reached or passed expires_at (31 days after completion)"
  - id: ERR_DUPLICATE_PHONE_NUMBER
    http: 409
    condition: "another Contact already holds this phone_number"
  - id: ERR_POLICY_PERIOD_OVERLAP
    http: 409
    condition: "the new policy's effective period overlaps an ACTIVE policy for the same state that it does not supersede, or window_start_local is not strictly before window_end_local"
  - id: ERR_DUPLICATE_REVOCATION_PENDING
    http: 409
    condition: "a RevocationRequest for the same contact is already sitting in intake_status RECEIVED"
  - id: ERR_METHOD_CHANNEL_MISMATCH
    http: 422
    condition: "the revocation method is not a reasonable one for the channel it arrived on"
  - id: ERR_ATTEMPT_CHANNEL_MISMATCH
    http: 422
    condition: "the attempt's channel differs from the campaign's channel"
  - id: ERR_ABANDON_MESSAGE_REQUIRED
    http: 422
    condition: "an ABANDONED outcome was recorded without abandon_message_played = true"
  - id: ERR_ABANDON_CLASSIFICATION_INVALID
    http: 422
    condition: "the outcome contradicts agent_connect_seconds - CONNECTED_LIVE above the 2-second threshold, or ABANDONED at or below it"
  - id: ERR_AMD_NOT_ENABLED
    http: 422
    condition: "a MACHINE_ANSWERED outcome was recorded on a campaign whose DialerProfile has amd_enabled false"
  - id: ERR_ABANDONMENT_LIMIT_WAIVER_REQUIRED
    http: 422
    condition: "approving a profile whose abandonment_limit_pct exceeds 3.00 without supplying waiver_reference"
  - id: ERR_CONTACT_COOLDOWN_ACTIVE
    http: 409
    condition: "a new attempt was requested at or before 30 minutes after this contact's previous non-voided attempt"
  - id: ERR_PACING_CAPACITY_EXCEEDED
    http: 409
    condition: "the campaign already holds as many PENDING attempts as calculations.dialer_pacing_lines permits"
  - id: ERR_ATTEMPT_BUDGET_EXHAUSTED
    http: 409
    condition: "the contact's attempt_budget_remaining is already 0"

roles:
  - name: Consumer
    description: "The consumer whose number is being contacted; may give consent for their own record, revoke it by any reasonable method, complain, and read their own compliance history."
    identity: "entity_backed:Contact"
    exclusive_operations: []
    shared_operations:
      - "POST /compliance/consent-records (only with contact_id == X-User-ID)"
      - "POST /compliance/revocation-requests (only with contact_id == X-User-ID)"
      - "POST /compliance/complaints"
      - "GET /compliance/contacts/{id}, GET /compliance/consent-records/{id}, GET /compliance/consent-records, GET /compliance/revocation-requests/{id}, GET /compliance/contacts/{id}/revocation-requests, GET /compliance/complaints/{id}, GET /compliance/complaints"
  - name: CampaignManager
    description: "Builds campaigns, drafts scripts and dialer profiles, queues scrubs and closes campaigns; may never approve a script, certify a launch or adjudicate a complaint."
    identity: opaque
    exclusive_operations:
      - "POST /compliance/campaigns"
      - "POST /compliance/campaigns/{id}/close"
      - "POST /compliance/agent-scripts/{id}/submit-review"
    shared_operations:
      - "POST /compliance/agent-scripts"
      - "POST /compliance/dialer-profiles"
      - "POST /compliance/scrub-jobs, POST /compliance/scrub-jobs/{id}/execute"
      - "POST /compliance/contacts/{id}/number-status-check"
      - "read endpoints for contacts, consent records, suppression entries, scrub jobs, campaigns, dialer profiles, agent scripts, calling-window policies, contact attempts and complaints"
  - name: ComplianceOfficer
    description: "Owns the compliance controls: approves scripts and dialer profiles, certifies launches, suspends and resumes campaigns, adjudicates revocations and complaints, voids attempts, manages suppression lists."
    identity: opaque
    exclusive_operations:
      - "POST /compliance/agent-scripts/{id}/approve, POST /compliance/agent-scripts/{id}/request-changes"
      - "POST /compliance/dialer-profiles/{id}/approve"
      - "POST /compliance/campaigns/{id}/launch, POST /compliance/campaigns/{id}/suspend, POST /compliance/campaigns/{id}/resume"
      - "POST /compliance/consent-records/{id}/suspend, POST /compliance/consent-records/{id}/reinstate"
      - "POST /compliance/revocation-requests/{id}/validate, POST /compliance/revocation-requests/{id}/reject, POST /compliance/revocation-requests/{id}/propagate"
      - "POST /compliance/suppression-entries/{id}/remove"
      - "POST /compliance/contact-attempts/{id}/void"
      - "POST /compliance/complaints/{id}/substantiate, POST /compliance/complaints/{id}/dismiss"
    shared_operations:
      - "POST /compliance/consent-records, POST /compliance/revocation-requests, POST /compliance/complaints"
      - "POST /compliance/agent-scripts, POST /compliance/agent-scripts/{id}/submit-review"
      - "POST /compliance/suppression-entries, POST /compliance/scrub-jobs, POST /compliance/scrub-jobs/{id}/execute"
      - "POST /compliance/calling-window-policies"
      - "POST /compliance/contacts/{id}/number-status-check"
      - "every read endpoint in the domain"
    note: "Segregation of duties is enforced within this single role by user id: the officer who approved a campaign's AgentScript is refused the launch certification of that campaign (ERR_SEGREGATION_OF_DUTIES), so two distinct ComplianceOfficer user ids are required to put a campaign on the wire."
  - name: DialerOperator
    description: "Runs the dialer: requests attempts, records dispositions, checks reassigned numbers, and logs revocations or complaints heard on a call."
    identity: opaque
    exclusive_operations:
      - "POST /compliance/contact-attempts"
      - "POST /compliance/contact-attempts/{id}/outcome"
    shared_operations:
      - "POST /compliance/dialer-profiles"
      - "POST /compliance/contacts/{id}/number-status-check"
      - "POST /compliance/revocation-requests, POST /compliance/complaints"
      - "read endpoints for contacts, consent records, revocation requests, suppression entries, campaigns, dialer profiles, agent scripts, calling-window policies and contact attempts"
  - name: PlatformAdmin
    description: "Operates the platform: imports contacts, publishes state calling-window policies, declares emergency restrictions, and drives the logical clock and the synthetic reassigned-number database."
    identity: opaque
    exclusive_operations:
      - "POST /compliance/contacts"
      - "POST /compliance/calling-window-policies/{id}/declare-emergency"
      - "POST /_clock/set_current_utc"
      - "POST /_rnd/records"
    shared_operations:
      - "POST /compliance/calling-window-policies"
      - "POST /compliance/suppression-entries"
      - "read endpoints for contacts, suppression entries, scrub jobs, campaigns, dialer profiles, agent scripts, calling-window policies and complaints"
