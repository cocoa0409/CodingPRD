  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_safety_release_invalid_state_wins
        grounds:
          - validations[priority=7]
          - validations[priority=9]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_EMBARGO_NOT_LIFTED]
        distinguishing_aspect: |
          A release attempted on a DRAFT (not SCHEDULED) PressRelease whose embargo_until is also
          still in the future fails both the state precondition (priority 7, ERR_INVALID_STATE)
          and the embargo safety check (priority 9, ERR_EMBARGO_NOT_LIFTED); the lower-priority
          state error wins — pairing category state vs business_safety.
        test_recipe:
          setup:
            - "An ACTIVE Campaign; a DRAFT PressRelease with embargo_until=2026-03-20T00:00:00Z (future vs default clock 2026-03-01)."
          setup_api_calls:
            - call: "POST /agency/clients"
              payload: { name: "Iota", industry: "TECH", monthly_retainer_cents: 250000, monthly_hours_cap: 25, overage_rate_cents: 9000 }
