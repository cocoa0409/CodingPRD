          - "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"
        distinguishing_aspect: "Requests without X-User-ID/X-User-Role fail at priority 1 with ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER before any other check."
        test_recipe:
          setup: ["one program exists"]
          setup_api_calls:
            - call: "POST /programs"
              payload: { program_code: "PRG-V1", peril_type: "RAINFALL_DEFICIT", regulatory_classification: "ADMITTED_INSURANCE", contract_wording_version: "CW-V1", exposure_limit_cents: 5000000 }
              as: ProgramManager
              captures: { prog_id: $.data.id }
          trigger:
            - call: "GET /programs/${prog_id}"
              payload: {}
              as: __NO_AUTH_HEADERS__
              captures: { err: $.data.error_id }
          assert:
            - "request with no auth headers -> (${err}) == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (400)"

