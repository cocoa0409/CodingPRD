  - section: errors
    instances:
      - name: every_unknown_id_read_returns_its_own_not_found_code
        claim_type: error_triggerable
        grounds:
          - errors[ERR_SCOPE_ITEM_NOT_FOUND]
          - errors[ERR_ENGAGEMENT_NOT_FOUND]
          - errors[ERR_TARGET_NOT_FOUND]
          - errors[ERR_TESTER_NOT_FOUND]
          - errors[ERR_ASSIGNMENT_NOT_FOUND]
          - errors[ERR_FINDING_NOT_FOUND]
          - errors[ERR_ALERT_NOT_FOUND]
          - errors[ERR_REMEDIATION_NOT_FOUND]
          - errors[ERR_RETEST_NOT_FOUND]
          - validations.priority_4
        distinguishing_aspect: "Each collection reports its own 404 code rather than a shared generic one: nine reads with the same syntactically valid but unknown UUID return nine distinct error_ids, all with HTTP 404 and a non-empty message."
        test_recipe:
          setup:
            - "An empty store — no rows of any kind are needed to prove the 404 mapping."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /pentest/scope-items/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { e_scope: $.data.error_id }
            - call: "GET /pentest/engagements/00000000-0000-4000-8000-000000000002"
              payload: {}
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { e_eng: $.data.error_id }
            - call: "GET /pentest/authorized-targets/00000000-0000-4000-8000-000000000003"
              payload: {}
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { e_tgt: $.data.error_id }
            - call: "GET /pentest/testers/00000000-0000-4000-8000-000000000004"
              payload: {}
              as: PlatformAdmin
              captures: { e_tester: $.data.error_id }
            - call: "GET /pentest/tester-assignments/00000000-0000-4000-8000-000000000005"
              payload: {}
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { e_asg: $.data.error_id }
            - call: "GET /pentest/findings/00000000-0000-4000-8000-000000000006"
              payload: {}
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { e_find: $.data.error_id }
            - call: "GET /pentest/critical-alerts/00000000-0000-4000-8000-000000000007"
              payload: {}
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { e_alert: $.data.error_id }
            - call: "GET /pentest/remediations/00000000-0000-4000-8000-000000000008"
              payload: {}
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { e_rem: $.data.error_id }
            - call: "GET /pentest/retest-verifications/00000000-0000-4000-8000-000000000009"
              payload: {}
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { e_rv: $.data.error_id }
          assert:
            - "${e_scope} == ERR_SCOPE_ITEM_NOT_FOUND and ${e_eng} == ERR_ENGAGEMENT_NOT_FOUND, both HTTP 404"
            - "${e_tgt} == ERR_TARGET_NOT_FOUND and ${e_tester} == ERR_TESTER_NOT_FOUND"
            - "${e_asg} == ERR_ASSIGNMENT_NOT_FOUND and ${e_find} == ERR_FINDING_NOT_FOUND"
            - "${e_alert} == ERR_ALERT_NOT_FOUND, ${e_rem} == ERR_REMEDIATION_NOT_FOUND and ${e_rv} == ERR_RETEST_NOT_FOUND"
            - "every response carries a non-empty message field alongside the error_id"

      - name: engagement_creation_checks_the_plan_state_before_the_candidate_state
        claim_type: error_triggerable
        grounds:
          - errors[ERR_PLAN_NOT_ACTIVE]
          - errors[ERR_SCOPE_ITEM_NOT_APPROVED]
          - validations.priority_11
          - validations.priority_13
        distinguishing_aspect: "On a DRAFT plan with a PROPOSED candidate both gates are violated and the answer is ERR_PLAN_NOT_ACTIVE; once the plan is ACTIVE the same call against the DEFERRED candidate returns ERR_SCOPE_ITEM_NOT_APPROVED, and only the APPROVED candidate produces an engagement."
        test_recipe:
          setup:
            - "A DRAFT plan with two PROPOSED candidates: A on a tier-1 asset and B on a tier-3 asset."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
