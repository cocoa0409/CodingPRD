            - "err2 == ERR_ENGINEERED_DESIGN_REQUIRED (TRENCH_BOX without engineered_certification)"
            - "TrenchSafetyPlan.${sp3_id}.status == SUBMITTED (certified TRENCH_BOX passes)"

      - name: window_in_past_beats_notice
        claim_type: priority_ordering
        grounds:
