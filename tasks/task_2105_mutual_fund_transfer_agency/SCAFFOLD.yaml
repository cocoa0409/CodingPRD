scenario: |
  desgin task harder than expert level.!!!! 2105. Mutual Fund Transfer Agency & NAV Processing
  (mutual fund transfer agent): shareholder account opening & registration types, trade capture
  with as-of/late-trade controls, NAV calculation & pricing error correction (materiality
  threshold), dividend/capital gain distribution & reinvestment, sales load, breakpoint & rights
  of accumulation, exchange & systematic plan processing, omnibus vs networked account
  reconciliation, blue-sky & state registration

domain_name: mutual-fund-transfer-agency
api_prefix: "/"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - derived_field_reconciliation
    - optimistic_concurrency
  entity_topology: flat
  state_machine_shape: parallel
  relationship_patterns:
    - one_to_many
    - self_referential
    - cross_aggregate
    - polymorphic
  role_model: segregation_of_duties
  consistency_model: immediate
  difficulty_level: expert_plus
  notes: |
    Flat peer entities linked by foreign keys (no nesting in the primary URL shape); Trade carries
    two independent state dimensions (execution_status x settlement_status); ShareholderAccount is
    self-referential through linked_primary_account_id, which forms the rights-of-accumulation
    household. The system clock is logical: it starts at 2026-08-01T00:00:00Z and only moves when
    POST /_clock/set_current_utc is called.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Fund
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: Registrant fund name.
        constraints: non-empty, max 120 chars
      - name: fund_family_code
        type: string
        source: input
        description: Fund-family grouping code; exchanges between share classes of the same fund_family_code are load-free.
        constraints: non-empty, max 12 chars
      - name: cutoff_time_utc
        type: string
        source: input
        description: Daily forward-pricing cutoff, HH:MM:SS in UTC. Orders received strictly before this time on a business day price at that day's NAV.
        default: "16:00:00"
        constraints: HH:MM:SS 24-hour
      - name: status
        type: enum
        source: input
        description: Offering posture of the fund.
        default: ACTIVE
        constraints: one of ACTIVE, CLOSED_TO_NEW

  - name: ShareClass
    parent: null
    common_fields: true
    fields:
      - name: fund_id
        type: string
        source: input
        description: FK -> Fund.id; the fund this class belongs to.
      - name: class_code
        type: string
        source: input
        description: Share class letter.
        constraints: one of A, B, C, I; unique per fund_id
      - name: seed_nav_per_share
        type: number
        source: input
        description: NAV used when total_shares_outstanding is exactly 0 (see calculation nav_per_share_strike).
        constraints: 4 decimal places, greater than 0
      - name: breakpoint_tiers
        type: array
        source: input
        description: Ordered sales-load tiers; each element is an object with min_qualifying_amount (number, 2dp) and load_pct (number, 4dp).
        constraints: at least one element; first element must have min_qualifying_amount 0; strictly ascending min_qualifying_amount; load_pct between 0 and 0.0850
      - name: cdsc_enabled
        type: boolean
        source: input
        description: When true, redemptions from this class carry a contingent deferred sales charge.
        default: false
      - name: twelve_b_one_fee_pct
        type: number
        source: input
        description: Annual 12b-1 distribution fee percentage; informational only.
        default: 0.0025
      - name: total_shares_outstanding
        type: number
        source: computed
        description: Transfer-agent share balance for this class; equals the sum of Position.shares over all positions of this class.
        default: 0.000
        constraints: 3 decimal places, never negative

  - name: ShareholderAccount
    parent: null
    common_fields: true
    fields:
      - name: registration_type
        type: enum
        source: input
        description: Legal registration of the account.
        constraints: one of INDIVIDUAL, JOINT_TENANTS, UGMA_UTMA, IRA_TRADITIONAL, ROTH_IRA, TRUST, CORPORATE
      - name: account_channel
        type: enum
        source: input
        description: Servicing channel; drives the rights-of-accumulation basis variant and reconciliation eligibility.
        constraints: one of DIRECT, NETWORKED, OMNIBUS
      - name: state_code
        type: string
        source: input
        description: Two-letter US state of the registered owner; selects the blue-sky registration consumed by purchases.
        constraints: exactly 2 uppercase letters
      - name: tax_id
        type: string
        source: input
        description: Taxpayer identification number of record.
        constraints: non-empty
      - name: primary_owner_name
        type: string
        source: input
        description: Name of the primary registered owner.
        constraints: non-empty
      - name: dealer_firm_code
        type: string
        source: input
        description: Selling dealer firm code; required when account_channel is NETWORKED or OMNIBUS, must be omitted or null when DIRECT.
        default: null
      - name: dividend_option
        type: enum
        source: input
        description: Standing instruction for distributions.
        default: CASH
        constraints: one of CASH, REINVEST
      - name: linked_primary_account_id
        type: string
        source: input
        description: FK -> ShareholderAccount.id; the rights-of-accumulation primary account this account is aggregated into. Null on a primary account. Only one level of linking is permitted.
        default: null
      - name: tin_certified
        type: boolean
        source: system
        description: Set from the activate call; when false, distributions carry backup withholding.
        default: false
      - name: status
        type: enum
        source: system
        description: Account lifecycle state.
        default: PENDING_DOCS
        constraints: one of PENDING_DOCS, ACTIVE, RESTRICTED, CLOSED
      - name: restriction_reason
        type: string
        source: system
        description: Free-text reason stamped by the restrict call; cleared on reinstate.
        default: null
      - name: household_basis_amount
        type: number
        source: computed
        description: Rights-of-accumulation basis of this account's household, recomputed on every position change (calculation roa_household_basis).
        default: 0.00
        constraints: 2 decimal places
      - name: household_basis_variant
        type: enum
        source: computed
        description: Which basis variant produced household_basis_amount.
        default: MARKET_VALUE_BASIS
        constraints: one of MARKET_VALUE_BASIS, HISTORICAL_COST_BASIS
      - name: closed_at
        type: datetime
        source: system
        description: Logical-clock instant the account moved to CLOSED.
        default: null

  - name: Position
    parent: null
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: system
        description: FK -> ShareholderAccount.id; owner of the position.
      - name: share_class_id
        type: string
        source: system
        description: FK -> ShareClass.id; class held.
      - name: shares
        type: number
        source: computed
        description: Current share balance; equals the sum of ShareLedgerEntry.share_delta for this position.
        default: 0.000
        constraints: 3 decimal places, never negative
      - name: cost_basis_amount
        type: number
        source: computed
        description: Aggregate cost basis in dollars, increased by the gross amount of purchases and reinvestments and reduced proportionally on redemptions.
        default: 0.00
        constraints: 2 decimal places
      - name: reinvested_shares
        type: number
        source: computed
        description: Cumulative shares acquired through distribution reinvestment; this bucket is exempt from contingent deferred sales charges.
        default: 0.000
        constraints: 3 decimal places
      - name: avg_cost_per_share
        type: number
        source: computed
        description: cost_basis_amount divided by shares, 4 decimal places; 0.0000 when shares is 0.000.
        default: 0.0000
        constraints: 4 decimal places
      - name: first_purchase_date
        type: string
        source: computed
        description: Trade date of the first settled purchase into this position; drives contingent deferred sales charge aging.
        default: null
        constraints: ISO date YYYY-MM-DD
      - name: current_roa_tier_pct
        type: number
        source: computed
        description: Sales-load percentage the owning account's household_basis_amount currently qualifies for in this share class's breakpoint_tiers.
        default: 0.0000
        constraints: 4 decimal places
      - name: market_value_amount
        type: number
        source: computed
        description: shares multiplied by the class's most recent priced NAV, 2 decimal places.
        default: 0.00
        constraints: 2 decimal places

  - name: NavRecord
    parent: null
    common_fields: true
    fields:
      - name: share_class_id
        type: string
        source: input
        description: FK -> ShareClass.id; class being priced.
      - name: valuation_date
        type: string
        source: input
        description: Business date the NAV applies to.
        constraints: ISO date YYYY-MM-DD, must be a Monday-Friday date, unique per share_class_id
      - name: total_net_assets
        type: number
        source: input
        description: Net assets of the class at the valuation date.
        constraints: 2 decimal places, never negative
      - name: shares_outstanding_snapshot
        type: number
        source: computed
        description: ShareClass.total_shares_outstanding captured at strike time.
        constraints: 3 decimal places
      - name: nav_per_share
        type: number
        source: computed
        description: Struck net asset value per share (calculation nav_per_share_strike).
        constraints: 4 decimal places, greater than 0
      - name: original_nav_per_share
        type: number
        source: computed
        description: The nav_per_share value in force before a pricing-error correction overwrote it; null until a correction lands.
        default: null
        constraints: 4 decimal places
      - name: status
        type: enum
        source: system
        description: Pricing state of the record.
        default: PRELIMINARY
        constraints: one of PRELIMINARY, FINAL, UNDER_ERROR_REVIEW, CORRECTED, STALE_REPRICE_REQUIRED
      - name: finalized_at
        type: datetime
        source: system
        description: Logical-clock instant the record was finalized.
        default: null

  - name: Trade
    parent: null
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: input
        description: FK -> ShareholderAccount.id; account the trade books to.
      - name: share_class_id
        type: string
        source: input
        description: FK -> ShareClass.id; class purchased, redeemed, or exchanged out of.
      - name: exchange_target_share_class_id
        type: string
        source: input
        description: FK -> ShareClass.id; class exchanged into. Required when trade_type is EXCHANGE, must be null otherwise.
        default: null
      - name: parent_distribution_id
        type: string
        source: system
        description: FK -> Distribution.id; set on system-created REINVESTMENT trades, null otherwise.
        default: null
      - name: originating_plan_id
        type: string
        source: system
        description: FK -> SystematicPlan.id; set on trades generated by a systematic plan execution, null otherwise.
        default: null
      - name: blue_sky_registration_id
        type: string
        source: system
        description: FK -> BlueSkyRegistration.id; the registration whose capacity this trade reserved, null for trades that consume no capacity.
        default: null
      - name: trade_type
        type: enum
        source: input
        description: Kind of transaction.
        constraints: one of PURCHASE, REDEMPTION, EXCHANGE, REINVESTMENT
      - name: gross_amount
        type: number
        source: input
        description: Dollar amount invested; required for PURCHASE, must be null for REDEMPTION and EXCHANGE.
        default: null
        constraints: 2 decimal places, greater than 0
      - name: shares_requested
        type: number
        source: input
        description: Shares to redeem or exchange out; required for REDEMPTION and EXCHANGE, must be null for PURCHASE.
        default: null
        constraints: 3 decimal places, greater than 0
      - name: as_of_date
        type: string
        source: input
        description: Past business date the client asks the trade to be priced at; null for ordinary forward-priced orders.
        default: null
        constraints: ISO date YYYY-MM-DD
      - name: dealer_reference
        type: string
        source: input
        description: Free-text dealer order reference retained for reconciliation.
        default: null
      - name: received_at
        type: datetime
        source: system
        description: Logical-clock instant the order was captured.
      - name: trade_date
        type: string
        source: computed
        description: Effective pricing date (calculation forward_pricing_trade_date).
        constraints: ISO date YYYY-MM-DD
      - name: execution_status
        type: enum
        source: system
        description: Pricing dimension of the trade lifecycle; evolves independently of settlement_status.
        default: RECEIVED
        constraints: one of RECEIVED, PENDING_AS_OF_APPROVAL, PRICED_PROVISIONAL, PRICED_FINAL, RESTATED, CANCELLED
      - name: settlement_status
        type: enum
        source: system
        description: Book-entry dimension of the trade lifecycle; evolves independently of execution_status.
        default: UNSETTLED
        constraints: one of UNSETTLED, SETTLED, REVERSED
      - name: pricing_variant
        type: enum
        source: computed
        description: Which NAV variant priced the trade.
        default: null
        constraints: one of PRELIMINARY_NAV, FINAL_NAV
      - name: nav_per_share_applied
        type: number
        source: computed
        description: NAV per share used to price the trade.
        default: null
        constraints: 4 decimal places
      - name: roa_qualifying_amount
        type: number
        source: computed
        description: Rights-of-accumulation amount used to select the breakpoint tier for this trade.
        default: null
        constraints: 2 decimal places
      - name: roa_basis_variant
        type: enum
        source: computed
        description: Basis variant used to compute roa_qualifying_amount.
        default: null
        constraints: one of MARKET_VALUE_BASIS, HISTORICAL_COST_BASIS
      - name: sales_load_pct
        type: number
        source: computed
        description: Front-end load percentage selected from the class breakpoint_tiers.
        default: null
        constraints: 4 decimal places
      - name: sales_load_amount
        type: number
        source: computed
        description: Front-end load charged in dollars.
        default: null
        constraints: 2 decimal places
      - name: net_invested_amount
        type: number
        source: computed
        description: gross_amount minus sales_load_amount.
        default: null
        constraints: 2 decimal places
      - name: shares_transacted
        type: number
        source: computed
        description: Signed share quantity booked by this trade; positive for PURCHASE and REINVESTMENT, negative for REDEMPTION and EXCHANGE.
        default: null
        constraints: 3 decimal places
      - name: gross_proceeds_amount
        type: number
        source: computed
        description: shares_requested multiplied by nav_per_share_applied for REDEMPTION and EXCHANGE.
        default: null
        constraints: 2 decimal places
      - name: cdsc_amount
        type: number
        source: computed
        description: Contingent deferred sales charge withheld from proceeds.
        default: null
        constraints: 2 decimal places
      - name: net_proceeds_amount
        type: number
        source: computed
        description: gross_proceeds_amount minus cdsc_amount.
        default: null
        constraints: 2 decimal places
      - name: exchange_target_shares
        type: number
        source: computed
        description: Shares acquired in the target class on an EXCHANGE settlement.
        default: null
        constraints: 3 decimal places
      - name: restated_share_delta
        type: number
        source: computed
        description: shares_transacted after a NAV correction minus shares_transacted before it.
        default: null
        constraints: 3 decimal places
      - name: captured_by_user_id
        type: string
        source: system
        description: X-User-ID of the actor that captured the order; used by the as-of segregation-of-duties check.
      - name: approved_by_user_id
        type: string
        source: system
        description: X-User-ID of the compliance officer that approved an as-of trade.
        default: null
      - name: cancel_reason
        type: string
        source: system
        description: Reason recorded when the trade was cancelled.
        default: null
      - name: reversal_reason
        type: string
        source: system
        description: Reason recorded when a settled trade was reversed.
        default: null

  - name: Distribution
    parent: null
    common_fields: true
    fields:
      - name: share_class_id
        type: string
        source: input
        description: FK -> ShareClass.id; class making the distribution.
      - name: distribution_type
        type: enum
        source: input
        description: Character of the distribution.
        constraints: one of ORDINARY_INCOME, SHORT_TERM_CAPITAL_GAIN, LONG_TERM_CAPITAL_GAIN
      - name: rate_per_share
        type: number
        source: input
        description: Declared rate per share.
        constraints: 4 decimal places, greater than 0
      - name: record_date
        type: string
        source: input
        description: Date on which holders of record are determined.
        constraints: ISO date YYYY-MM-DD
      - name: ex_date
        type: string
        source: input
        description: Ex-distribution date; its NAV prices reinvestment.
        constraints: ISO date YYYY-MM-DD, greater than or equal to record_date
      - name: pay_date
        type: string
        source: input
        description: Payment date.
        constraints: ISO date YYYY-MM-DD, greater than or equal to ex_date
      - name: status
        type: enum
        source: system
        description: Distribution lifecycle state.
        default: DECLARED
        constraints: one of DECLARED, RECORDED, PAID, REVERSED
      - name: payment_count
        type: integer
        source: computed
        description: Number of DistributionPayment rows created at record time.
        default: 0
      - name: total_gross_amount
        type: number
        source: computed
        description: Sum of the already-rounded per-payment gross_amount values.
        default: 0.00
        constraints: 2 decimal places
      - name: total_withholding_amount
        type: number
        source: computed
        description: Sum of per-payment withholding_amount values.
        default: 0.00
        constraints: 2 decimal places
      - name: total_cash_amount
        type: number
        source: computed
        description: Sum of per-payment cash_amount values.
        default: 0.00
        constraints: 2 decimal places
      - name: total_reinvested_amount
        type: number
        source: computed
        description: Sum of the net amounts routed into reinvestment.
        default: 0.00
        constraints: 2 decimal places
      - name: reinvest_nav_per_share
        type: number
        source: computed
        description: NAV per share of the ex_date NavRecord used to price reinvestment; stamped at pay time.
        default: null
        constraints: 4 decimal places

  - name: DistributionPayment
    parent: null
    common_fields: true
    fields:
      - name: distribution_id
        type: string
        source: system
        description: FK -> Distribution.id; parent declaration.
      - name: account_id
        type: string
        source: system
        description: FK -> ShareholderAccount.id; payee account.
      - name: position_id
        type: string
        source: system
        description: FK -> Position.id; position of record.
      - name: reinvestment_trade_id
        type: string
        source: system
        description: FK -> Trade.id; the REINVESTMENT trade created at pay time, null for cash payouts.
        default: null
      - name: shares_of_record
        type: number
        source: computed
        description: Position.shares captured when the distribution was recorded.
        constraints: 3 decimal places
      - name: gross_amount
        type: number
        source: computed
        description: shares_of_record multiplied by rate_per_share, rounded to cents before any summation.
        constraints: 2 decimal places
      - name: withholding_amount
        type: number
        source: computed
        description: Backup withholding retained from gross_amount.
        default: 0.00
        constraints: 2 decimal places
      - name: net_amount
        type: number
        source: computed
        description: gross_amount minus withholding_amount.
        constraints: 2 decimal places
      - name: cash_amount
        type: number
        source: computed
        description: Cash actually paid out; 0.00 for reinvested payments.
        default: 0.00
        constraints: 2 decimal places
      - name: reinvested_shares
        type: number
        source: computed
        description: Shares purchased with net_amount at the ex_date NAV; 0.000 for cash payments.
        default: 0.000
        constraints: 3 decimal places
      - name: payout_option
        type: enum
        source: computed
        description: The account's dividend_option captured at record time.
        constraints: one of CASH, REINVEST
      - name: status
        type: enum
        source: system
        description: Payment lifecycle state.
        default: PENDING
        constraints: one of PENDING, PAID, REVERSED

  - name: SystematicPlan
    parent: null
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: input
        description: FK -> ShareholderAccount.id; account the plan runs against.
      - name: source_share_class_id
        type: string
        source: input
        description: FK -> ShareClass.id; class invested into, redeemed from, or exchanged out of.
      - name: target_share_class_id
        type: string
        source: input
        description: FK -> ShareClass.id; class exchanged into. Required when plan_type is SYSTEMATIC_EXCHANGE, must be null otherwise.
        default: null
      - name: plan_type
        type: enum
        source: input
        description: Kind of systematic plan.
        constraints: one of SYSTEMATIC_INVESTMENT, SYSTEMATIC_WITHDRAWAL, SYSTEMATIC_EXCHANGE
      - name: amount
        type: number
        source: input
        description: Dollar amount per run for SYSTEMATIC_INVESTMENT; dollar amount to liquidate per run for SYSTEMATIC_WITHDRAWAL and SYSTEMATIC_EXCHANGE.
        constraints: 2 decimal places, greater than 0
      - name: frequency
        type: enum
        source: input
        description: Run cadence.
        constraints: one of MONTHLY, QUARTERLY
      - name: next_run_date
        type: string
        source: input
        description: Next date on which the plan may be executed.
        constraints: ISO date YYYY-MM-DD
      - name: status
        type: enum
        source: system
        description: Plan lifecycle state.
        default: ACTIVE
        constraints: one of ACTIVE, SUSPENDED, TERMINATED
      - name: executed_count
        type: integer
        source: computed
        description: Number of successful executions.
        default: 0
      - name: last_run_date
        type: string
        source: computed
        description: Date of the most recent successful execution.
        default: null
      - name: suspension_reason
        type: string
        source: system
        description: Reason stamped when the plan auto-suspends or is suspended by an operator.
        default: null

  - name: BlueSkyRegistration
    parent: null
    common_fields: true
    fields:
      - name: share_class_id
        type: string
        source: input
        description: FK -> ShareClass.id; class registered for sale.
      - name: state_code
        type: string
        source: input
        description: Two-letter US state the notice filing covers.
        constraints: exactly 2 uppercase letters
      - name: registered_amount
        type: number
        source: input
        description: Dollar amount of shares registered for sale in the state.
        constraints: 2 decimal places, greater than 0
      - name: effective_date
        type: string
        source: input
        description: First date of the registration window, inclusive.
        constraints: ISO date YYYY-MM-DD
      - name: expiration_date
        type: string
        source: input
        description: End of the registration window, exclusive.
        constraints: ISO date YYYY-MM-DD, strictly greater than effective_date
      - name: reserved_amount
        type: number
        source: computed
        description: Capacity held for captured but unsettled purchase-side trades.
        default: 0.00
        constraints: 2 decimal places
      - name: consumed_amount
        type: number
        source: computed
        description: Capacity permanently used by settled purchase-side trades.
        default: 0.00
        constraints: 2 decimal places
      - name: remaining_amount
        type: number
        source: computed
        description: registered_amount minus reserved_amount minus consumed_amount.
        constraints: 2 decimal places, never negative
      - name: status
        type: enum
        source: system
        description: Registration posture.
        default: ACTIVE
        constraints: one of ACTIVE, EXHAUSTED, EXPIRED

  - name: PricingErrorCase
    parent: null
    common_fields: true
    fields:
      - name: nav_record_id
        type: string
        source: input
        description: FK -> NavRecord.id; the mispriced record.
      - name: corrected_nav_per_share
        type: number
        source: input
        description: NAV the fund accountant believes is correct.
        constraints: 4 decimal places, greater than 0
      - name: error_reason
        type: string
        source: input
        description: Narrative cause of the mispricing.
        constraints: non-empty
      - name: original_nav_per_share
        type: number
        source: computed
        description: NavRecord.nav_per_share captured when the case opened.
        constraints: 4 decimal places
      - name: error_bps
        type: number
        source: computed
        description: Absolute pricing error in basis points of the original NAV.
        default: null
        constraints: 2 decimal places
      - name: materiality
        type: enum
        source: computed
        description: Materiality determination produced by the assess step.
        default: null
        constraints: one of MATERIAL, IMMATERIAL
      - name: status
        type: enum
        source: system
        description: Case lifecycle state.
        default: DETECTED
        constraints: one of DETECTED, ASSESSED, IMMATERIAL_CLOSED, MATERIAL_APPROVED, REPROCESSED, SUPERSEDED
      - name: detected_by_user_id
        type: string
        source: system
        description: X-User-ID of the fund accountant that opened the case.
      - name: approved_by_user_id
        type: string
        source: system
        description: X-User-ID of the compliance officer that approved or closed the case.
        default: null
      - name: reprocessed_by_user_id
        type: string
        source: system
        description: X-User-ID of the fund accountant that ran the reprocessing sweep.
        default: null
      - name: restated_trade_count
        type: integer
        source: computed
        description: Number of settled trades restated by the reprocessing sweep.
        default: 0
      - name: invalidated_nav_record_count
        type: integer
        source: computed
        description: Number of later PRELIMINARY NAV records driven to STALE_REPRICE_REQUIRED by the sweep.
        default: 0

  - name: OmnibusReconciliation
    parent: null
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: input
        description: FK -> ShareholderAccount.id; the omnibus or networked account being reconciled.
      - name: as_of_date
        type: string
        source: input
        description: Trade date the dealer file covers.
        constraints: ISO date YYYY-MM-DD
      - name: dealer_reported_purchase_amount
        type: number
        source: input
        description: Purchase dollars the dealer claims for as_of_date.
        constraints: 2 decimal places, never negative
      - name: dealer_reported_redemption_amount
        type: number
        source: input
        description: Redemption dollars the dealer claims for as_of_date.
        constraints: 2 decimal places, never negative
      - name: dealer_reported_net_shares
        type: number
        source: input
        description: Net share movement the dealer claims for as_of_date.
        constraints: 3 decimal places
      - name: ta_purchase_amount
        type: number
        source: computed
        description: Purchase dollars the transfer agent has settled for as_of_date.
        constraints: 2 decimal places
      - name: ta_redemption_amount
        type: number
        source: computed
        description: Redemption dollars the transfer agent has settled for as_of_date.
        constraints: 2 decimal places
      - name: ta_net_shares
        type: number
        source: computed
        description: Net share movement the transfer agent recorded for as_of_date.
        constraints: 3 decimal places
      - name: break_amount
        type: number
        source: computed
        description: Signed dollar difference between the transfer agent's net and the dealer's net.
        constraints: 2 decimal places
      - name: tolerance_amount
        type: number
        source: computed
        description: Dollar tolerance applied to break_amount.
        constraints: 2 decimal places
      - name: status
        type: enum
        source: system
        description: Reconciliation outcome state.
        constraints: one of MATCHED, BREAK_IDENTIFIED, RESOLVED, DISPUTED
      - name: adjustment_trade_id
        type: string
        source: system
        description: FK -> Trade.id; the settled as-of trade cited when the break was adjusted away.
        default: null
      - name: resolution_note
        type: string
        source: system
        description: Note recorded by the adjust call.
        default: null
      - name: dispute_note
        type: string
        source: system
        description: Note recorded by the dispute call.
        default: null

  - name: ShareLedgerEntry
    parent: null
    common_fields: false
    fields:
      - name: position_id
        type: string
        source: system
        description: FK -> Position.id; position the movement lands on.
      - name: trade_id
        type: string
        source: system
        description: FK -> Trade.id; trade that caused the movement, null for distribution-driven adjustments booked without a trade.
        default: null
      - name: share_delta
        type: number
        source: system
        description: Signed share movement.
        constraints: 3 decimal places, never exactly 0
      - name: entry_reason
        type: enum
        source: system
        description: Cause of the movement.
        constraints: one of PURCHASE_SETTLEMENT, REDEMPTION_SETTLEMENT, EXCHANGE_OUT, EXCHANGE_IN, DIVIDEND_REINVESTMENT, NAV_CORRECTION_RESTATEMENT, TRADE_REVERSAL, DISTRIBUTION_REVERSAL
      - name: effective_date
        type: string
        source: system
        description: Trade date the movement books to.
        constraints: ISO date YYYY-MM-DD
      - name: resulting_share_balance
        type: number
        source: system
        description: Position.shares immediately after this entry was appended.
        constraints: 3 decimal places

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: ShareholderAccount
    state_field: status
    initial_state: PENDING_DOCS
    terminal_states: [CLOSED]
    shape: branching_with_revert
    transitions:
      - from: PENDING_DOCS
        to: ACTIVE
        trigger: "POST /shareholder-accounts/{id}/activate"
        actor: TransferAgentOperator
        preconditions:
          - "account.status == PENDING_DOCS"
        side_effects:
          - "account.tin_certified := request.tin_certified"
          - "account.household_basis_amount recomputed by calculation roa_household_basis (0.00 for a new account)"
          - "increments ShareholderAccount.version by 1"
        note: "Only ACTIVE accounts may originate purchase-side trades."
      - from: ACTIVE
        to: RESTRICTED
        trigger: "POST /shareholder-accounts/{id}/restrict"
        actor: ComplianceOfficer
        preconditions:
          - "account.status == ACTIVE"
        side_effects:
          - "account.restriction_reason := request.restriction_reason"
          - "every SystematicPlan on this account with status == ACTIVE moves to SUSPENDED with suspension_reason 'ACCOUNT_RESTRICTED'"
          - "increments ShareholderAccount.version by 1"
        note: "RESTRICTED accounts may still redeem and still receive distributions, but may not purchase or exchange."
      - from: RESTRICTED
        to: ACTIVE
        trigger: "POST /shareholder-accounts/{id}/reinstate"
        actor: ComplianceOfficer
        preconditions:
          - "account.status == RESTRICTED"
        side_effects:
          - "account.restriction_reason := null"
          - "increments ShareholderAccount.version by 1"
        note: "Cycle ACTIVE -> RESTRICTED -> ACTIVE. Suspended systematic plans are NOT auto-resumed."
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /shareholder-accounts/{id}/close"
        actor: TransferAgentOperator
        preconditions:
          - "account.status IN {ACTIVE, RESTRICTED}"
          - "every Position with account_id == account.id has shares == 0.000"
          - "no Trade with account_id == account.id has settlement_status == UNSETTLED and execution_status NOT IN {CANCELLED}"
        side_effects:
          - "account.closed_at := logical clock now"
          - "every SystematicPlan on this account with status IN {ACTIVE, SUSPENDED} moves to TERMINATED"
          - "increments ShareholderAccount.version by 1"
      - from: RESTRICTED
        to: CLOSED
        trigger: "POST /shareholder-accounts/{id}/close"
        actor: TransferAgentOperator
        preconditions:
          - "account.status IN {ACTIVE, RESTRICTED}"
          - "every Position with account_id == account.id has shares == 0.000"
        side_effects:
          - "account.closed_at := logical clock now"
          - "every SystematicPlan on this account with status IN {ACTIVE, SUSPENDED} moves to TERMINATED"
          - "increments ShareholderAccount.version by 1"

  - entity: Trade
    state_field: execution_status
    initial_state: RECEIVED
    terminal_states: [CANCELLED]
    shape: cyclic_parallel_dimension
    note: "Pricing dimension. Evolves independently of settlement_status; the pair (execution_status, settlement_status) is the trade's full state."
    transitions:
      - from: RECEIVED
        to: PENDING_AS_OF_APPROVAL
        trigger: "POST /trades (with as_of_date present and inside the as-of window)"
        actor: TransferAgentOperator
        preconditions:
          - "as_of_date is a business date strictly before trade capture date, or equal to the capture date while the logical clock time is strictly before fund.cutoff_time_utc"
          - "business_days_between(as_of_date, current business date) <= AS_OF_MAX_BUSINESS_DAYS"
        side_effects:
          - "trade.trade_date := trade.as_of_date"
          - "trade.captured_by_user_id := X-User-ID"
          - "blue-sky capacity reserved for PURCHASE and EXCHANGE trades (calculation blue_sky_capacity_ledger)"
        note: "The order is created directly in PENDING_AS_OF_APPROVAL; it is not priced until compliance approves."
      - from: PENDING_AS_OF_APPROVAL
        to: RECEIVED
        trigger: "POST /trades/{id}/approve-as-of"
        actor: ComplianceOfficer
        preconditions:
          - "trade.execution_status == PENDING_AS_OF_APPROVAL"
          - "X-User-ID != trade.captured_by_user_id"
        side_effects:
          - "trade.approved_by_user_id := X-User-ID"
          - "increments Trade.version by 1"
      - from: RECEIVED
        to: PRICED_PROVISIONAL
        trigger: "POST /trades/{id}/price"
        actor: TransferAgentOperator
        preconditions:
          - "trade.execution_status == RECEIVED"
          - "a NavRecord exists for (trade.share_class_id, trade.trade_date)"
          - "that NavRecord.status == PRELIMINARY"
        side_effects:
          - "trade.pricing_variant := PRELIMINARY_NAV"
          - "pricing fields written by calculation purchase_trade_pricing or redemption_proceeds_with_cdsc"
        note: "Provisional pricing does not touch positions; settlement is blocked until the NAV is final."
      - from: PRICED_PROVISIONAL
        to: PRICED_FINAL
        trigger: "POST /trades/{id}/price"
        actor: TransferAgentOperator
        preconditions:
          - "trade.execution_status == PRICED_PROVISIONAL"
          - "the NavRecord for (trade.share_class_id, trade.trade_date) has status IN {FINAL, CORRECTED}"
        side_effects:
          - "trade.pricing_variant := FINAL_NAV"
          - "pricing fields recomputed against the final NAV; shares_transacted may differ from the provisional value"
      - from: RECEIVED
        to: PRICED_FINAL
        trigger: "POST /trades/{id}/price"
        actor: TransferAgentOperator
        preconditions:
          - "trade.execution_status == RECEIVED"
          - "the NavRecord for (trade.share_class_id, trade.trade_date) has status IN {FINAL, CORRECTED}"
        side_effects:
          - "trade.pricing_variant := FINAL_NAV"
          - "pricing fields written by calculation purchase_trade_pricing or redemption_proceeds_with_cdsc"
      - from: PRICED_PROVISIONAL
        to: RECEIVED
        trigger: "system cascade from POST /pricing-error-cases/{id}/reprocess (link 5)"
        actor: system
        preconditions:
          - "the NavRecord that priced this trade moved to STALE_REPRICE_REQUIRED as a consequence of the class share balance changing"
        side_effects:
          - "trade.pricing_variant := null"
          - "trade.nav_per_share_applied, sales_load_pct, sales_load_amount, net_invested_amount, shares_transacted, roa_qualifying_amount, roa_basis_variant := null"
        note: "Cycle RECEIVED -> PRICED_PROVISIONAL -> RECEIVED."
      - from: PRICED_FINAL
        to: RESTATED
        trigger: "system cascade from POST /pricing-error-cases/{id}/reprocess (link 2)"
        actor: system
        preconditions:
          - "trade.settlement_status == SETTLED"
          - "trade.trade_date == the corrected NavRecord.valuation_date and trade.share_class_id == that record's share_class_id"
        side_effects:
          - "trade.nav_per_share_applied := corrected NAV"
          - "trade.shares_transacted recomputed at the corrected NAV"
          - "trade.restated_share_delta := new shares_transacted minus previous shares_transacted"
      - from: RECEIVED
        to: CANCELLED
        trigger: "POST /trades/{id}/cancel"
        actor: TransferAgentOperator
        preconditions:
          - "trade.settlement_status == UNSETTLED"
          - "trade.execution_status IN {RECEIVED, PENDING_AS_OF_APPROVAL, PRICED_PROVISIONAL, PRICED_FINAL}"
        side_effects:
          - "trade.cancel_reason := request.cancel_reason"
          - "reserved blue-sky capacity released: registration.reserved_amount decreases by trade.gross_amount"
          - "if the registration's remaining_amount becomes greater than 0.00 and its status was EXHAUSTED, it returns to ACTIVE"
      - from: PENDING_AS_OF_APPROVAL
        to: CANCELLED
        trigger: "POST /trades/{id}/cancel"
        actor: ComplianceOfficer
        preconditions:
          - "trade.settlement_status == UNSETTLED"
        side_effects:
          - "trade.cancel_reason := request.cancel_reason"
          - "reserved blue-sky capacity released"
      - from: PRICED_PROVISIONAL
        to: CANCELLED
        trigger: "POST /trades/{id}/cancel"
        actor: TransferAgentOperator
        preconditions:
          - "trade.settlement_status == UNSETTLED"
        side_effects:
          - "trade.cancel_reason := request.cancel_reason"
          - "reserved blue-sky capacity released"
      - from: PRICED_FINAL
        to: CANCELLED
        trigger: "POST /trades/{id}/cancel"
        actor: TransferAgentOperator
        preconditions:
          - "trade.settlement_status == UNSETTLED"
        side_effects:
          - "trade.cancel_reason := request.cancel_reason"
          - "reserved blue-sky capacity released"

  - entity: Trade
    state_field: settlement_status
    initial_state: UNSETTLED
    terminal_states: [REVERSED]
    shape: linear_parallel_dimension
    note: "Book-entry dimension. Independent of execution_status apart from the stated cross-dimension preconditions."
    transitions:
      - from: UNSETTLED
        to: SETTLED
        trigger: "POST /trades/{id}/settle"
        actor: TransferAgentOperator
        preconditions:
          - "trade.execution_status == PRICED_FINAL"
          - "trade.settlement_status == UNSETTLED"
          - "for REDEMPTION and EXCHANGE, the owning Position has shares >= trade.shares_requested"
        side_effects:
          - "Position for (account_id, share_class_id) is created when absent, then Position.shares changes by trade.shares_transacted"
          - "a ShareLedgerEntry is appended with share_delta == trade.shares_transacted and the matching entry_reason"
          - "ShareClass.total_shares_outstanding changes by trade.shares_transacted"
          - "for PURCHASE: Position.cost_basis_amount increases by trade.gross_amount; blue-sky registration.reserved_amount decreases and consumed_amount increases by trade.gross_amount"
          - "for REDEMPTION: Position.cost_basis_amount decreases by round(cost_basis_amount * shares_requested / shares_before, 2)"
          - "for EXCHANGE: the target Position gains exchange_target_shares, a second ShareLedgerEntry with entry_reason EXCHANGE_IN is appended, and the target class blue-sky registration consumes gross_proceeds_amount"
          - "if the blue-sky registration's remaining_amount becomes exactly 0.00 its status moves to EXHAUSTED"
          - "the owning account's household_basis_amount is recomputed, and every Position of every household account has current_roa_tier_pct recomputed"
      - from: SETTLED
        to: REVERSED
        trigger: "POST /trades/{id}/reverse"
        actor: ComplianceOfficer
        preconditions:
          - "trade.settlement_status == SETTLED"
          - "trade.trade_type != REINVESTMENT"
          - "the resulting Position.shares would not be negative"
        side_effects:
          - "trade.reversal_reason := request.reversal_reason"
          - "a compensating ShareLedgerEntry with entry_reason TRADE_REVERSAL and share_delta == -1 * trade.shares_transacted is appended"
          - "Position.shares and ShareClass.total_shares_outstanding move back by the same magnitude"
          - "for PURCHASE: Position.cost_basis_amount decreases by trade.gross_amount and blue-sky registration.consumed_amount decreases by trade.gross_amount"
          - "if the registration's remaining_amount becomes greater than 0.00 and its status was EXHAUSTED, it returns to ACTIVE"
          - "the owning account's household_basis_amount and every household Position.current_roa_tier_pct are recomputed"

  - entity: NavRecord
    state_field: status
    initial_state: PRELIMINARY
    terminal_states: []
    shape: cyclic
    transitions:
      - from: PRELIMINARY
        to: FINAL
        trigger: "POST /nav-records/{id}/finalize"
        actor: FundAccountant
        preconditions:
          - "nav_record.status == PRELIMINARY"
        side_effects:
          - "nav_record.finalized_at := logical clock now"
          - "increments NavRecord.version by 1"
      - from: FINAL
        to: UNDER_ERROR_REVIEW
        trigger: "system cascade from POST /pricing-error-cases"
        actor: system
        preconditions:
          - "nav_record.status == FINAL"
        side_effects:
          - "increments NavRecord.version by 1"
        note: "Trades cannot be priced against a record while it is UNDER_ERROR_REVIEW."
      - from: UNDER_ERROR_REVIEW
        to: FINAL
        trigger: "system cascade from POST /pricing-error-cases/{id}/close-immaterial"
        actor: system
        preconditions:
          - "case.materiality == IMMATERIAL"
        side_effects:
          - "nav_record.original_nav_per_share := nav_record.nav_per_share"
          - "nav_record.nav_per_share := case.corrected_nav_per_share applied prospectively; already-settled trades are NOT restated"
          - "increments NavRecord.version by 1"
        note: "Cycle FINAL -> UNDER_ERROR_REVIEW -> FINAL."
      - from: UNDER_ERROR_REVIEW
        to: CORRECTED
        trigger: "system cascade from POST /pricing-error-cases/{id}/reprocess (link 1)"
        actor: system
        preconditions:
          - "case.status == MATERIAL_APPROVED"
        side_effects:
          - "nav_record.original_nav_per_share := nav_record.nav_per_share"
          - "nav_record.nav_per_share := case.corrected_nav_per_share"
          - "increments NavRecord.version by 1"
      - from: PRELIMINARY
        to: STALE_REPRICE_REQUIRED
        trigger: "system cascade from POST /pricing-error-cases/{id}/reprocess (link 4)"
        actor: system
        preconditions:
          - "nav_record.share_class_id == the corrected record's share_class_id"
          - "nav_record.valuation_date > the corrected record's valuation_date"
          - "nav_record.status == PRELIMINARY"
        side_effects:
          - "increments NavRecord.version by 1"
        note: "Triggered because ShareClass.total_shares_outstanding changed underneath the strike."
      - from: PRELIMINARY
        to: PRELIMINARY
        trigger: "POST /nav-records/{id}/repost"
        actor: FundAccountant
        preconditions:
          - "nav_record.status == PRELIMINARY"
        side_effects:
          - "nav_record.total_net_assets := request.total_net_assets"
          - "nav_record.shares_outstanding_snapshot and nav_per_share recomputed by calculation nav_per_share_strike"
          - "increments NavRecord.version by 1"
        note: "A preliminary strike may be revised any number of times before it is finalized; each revision overwrites nav_per_share, so a trade already priced PRICED_PROVISIONAL against it will produce a different share quantity when it is repriced."
      - from: STALE_REPRICE_REQUIRED
        to: PRELIMINARY
        trigger: "POST /nav-records/{id}/repost"
        actor: FundAccountant
        preconditions:
          - "nav_record.status == STALE_REPRICE_REQUIRED"
        side_effects:
          - "nav_record.total_net_assets := request.total_net_assets"
          - "nav_record.shares_outstanding_snapshot and nav_per_share recomputed by calculation nav_per_share_strike"
          - "increments NavRecord.version by 1"
        note: "Cycle PRELIMINARY -> STALE_REPRICE_REQUIRED -> PRELIMINARY."

  - entity: PricingErrorCase
    state_field: status
    initial_state: DETECTED
    terminal_states: [IMMATERIAL_CLOSED, REPROCESSED, SUPERSEDED]
    shape: branching
    transitions:
      - from: DETECTED
        to: ASSESSED
        trigger: "POST /pricing-error-cases/{id}/assess"
        actor: FundAccountant
        preconditions:
          - "case.status == DETECTED"
        side_effects:
          - "case.error_bps and case.materiality written by calculation pricing_error_materiality"
      - from: ASSESSED
        to: IMMATERIAL_CLOSED
        trigger: "POST /pricing-error-cases/{id}/close-immaterial"
        actor: ComplianceOfficer
        preconditions:
          - "case.status == ASSESSED"
          - "case.materiality == IMMATERIAL"
        side_effects:
          - "case.approved_by_user_id := X-User-ID"
          - "the NavRecord moves UNDER_ERROR_REVIEW -> FINAL with its nav_per_share replaced prospectively"
          - "no trade is restated and no position moves"
        note: "Branch A of the fork; side-effect set is disjoint from branch B."
      - from: ASSESSED
        to: MATERIAL_APPROVED
        trigger: "POST /pricing-error-cases/{id}/approve-correction"
        actor: ComplianceOfficer
        preconditions:
          - "case.status == ASSESSED"
          - "case.materiality == MATERIAL"
        side_effects:
          - "case.approved_by_user_id := X-User-ID"
        note: "Branch B of the fork; the reprocessing sweep is a separate, segregated step."
      - from: MATERIAL_APPROVED
        to: REPROCESSED
        trigger: "POST /pricing-error-cases/{id}/reprocess"
        actor: FundAccountant
        preconditions:
          - "case.status == MATERIAL_APPROVED"
          - "X-User-ID != case.detected_by_user_id"
        side_effects:
          - "case.reprocessed_by_user_id := X-User-ID"
          - "link 1: the NavRecord moves UNDER_ERROR_REVIEW -> CORRECTED and its nav_per_share is replaced by corrected_nav_per_share"
          - "link 2: because that NAV changed, every Trade with settlement_status SETTLED priced on it moves PRICED_FINAL -> RESTATED with shares recomputed at the corrected NAV; case.restated_trade_count counts them"
          - "link 3: because those trades' share quantities changed, a ShareLedgerEntry with entry_reason NAV_CORRECTION_RESTATEMENT is appended per restated trade, Position.shares moves by restated_share_delta and ShareClass.total_shares_outstanding moves by the same total"
          - "link 4: because total_shares_outstanding changed, every NavRecord of that class with a later valuation_date and status PRELIMINARY moves to STALE_REPRICE_REQUIRED; case.invalidated_nav_record_count counts them"
          - "link 5: because those NAV records were invalidated, every Trade priced against them with execution_status PRICED_PROVISIONAL moves back to RECEIVED and its pricing fields are cleared"
          - "each affected account's household_basis_amount and every household Position.current_roa_tier_pct are recomputed"
      - from: DETECTED
        to: SUPERSEDED
        trigger: "system cascade from POST /pricing-error-cases (a newer case opened on the same NavRecord)"
        actor: system
        preconditions:
          - "case.status IN {DETECTED, ASSESSED}"
        side_effects:
          - "case.materiality and case.error_bps are left as they stood"
      - from: ASSESSED
        to: SUPERSEDED
        trigger: "system cascade from POST /pricing-error-cases (a newer case opened on the same NavRecord)"
        actor: system
        preconditions:
          - "case.status IN {DETECTED, ASSESSED}"
        side_effects:
          - "case.materiality and case.error_bps are left as they stood"

  - entity: Distribution
    state_field: status
    initial_state: DECLARED
    terminal_states: [REVERSED]
    shape: linear_with_compensation
    transitions:
      - from: DECLARED
        to: RECORDED
        trigger: "POST /distributions/{id}/record"
        actor: FundAccountant
        preconditions:
          - "distribution.status == DECLARED"
          - "the logical clock date is greater than or equal to distribution.record_date"
        side_effects:
          - "one DistributionPayment is created per eligible Position (calculation distribution_payment_amounts)"
          - "distribution.payment_count, total_gross_amount and total_withholding_amount are written from the per-payment rounded values"
      - from: RECORDED
        to: PAID
        trigger: "POST /distributions/{id}/pay"
        actor: FundAccountant
        preconditions:
          - "distribution.status == RECORDED"
          - "the logical clock date is greater than or equal to distribution.pay_date"
          - "a NavRecord exists for (distribution.share_class_id, distribution.ex_date) with status IN {FINAL, CORRECTED}"
        side_effects:
          - "distribution.reinvest_nav_per_share := that NavRecord.nav_per_share"
          - "every DistributionPayment moves PENDING -> PAID"
          - "for payout_option REINVEST: a REINVESTMENT Trade is created with parent_distribution_id set, execution_status PRICED_FINAL and settlement_status SETTLED in one step; payment.reinvestment_trade_id is stamped"
          - "because that trade settled, Position.shares and Position.reinvested_shares increase by payment.reinvested_shares, a ShareLedgerEntry with entry_reason DIVIDEND_REINVESTMENT is appended, Position.cost_basis_amount increases by payment.net_amount and ShareClass.total_shares_outstanding increases by the same shares"
          - "because those position balances changed, each affected account's household_basis_amount is recomputed"
          - "because household_basis_amount changed, every Position of every affected household has current_roa_tier_pct recomputed from the class breakpoint_tiers"
          - "distribution.total_cash_amount and total_reinvested_amount are written"
      - from: PAID
        to: REVERSED
        trigger: "POST /distributions/{id}/reverse"
        actor: ComplianceOfficer
        preconditions:
          - "distribution.status == PAID"
          - "every REINVESTMENT trade created by this distribution still has settlement_status == SETTLED"
        side_effects:
          - "every DistributionPayment moves PAID -> REVERSED"
          - "each REINVESTMENT trade moves settlement_status SETTLED -> REVERSED with a compensating ShareLedgerEntry of entry_reason DISTRIBUTION_REVERSAL"
          - "Position.shares, Position.reinvested_shares, Position.cost_basis_amount and ShareClass.total_shares_outstanding return to their pre-payment values"
          - "distribution.total_cash_amount, total_reinvested_amount, total_withholding_amount and total_gross_amount are reset to 0.00 and payment_count is left unchanged"

  - entity: BlueSkyRegistration
    state_field: status
    initial_state: ACTIVE
    terminal_states: []
    shape: cyclic
    transitions:
      - from: ACTIVE
        to: EXHAUSTED
        trigger: "system cascade from POST /trades or POST /trades/{id}/settle"
        actor: system
        preconditions:
          - "registration.remaining_amount becomes exactly 0.00"
        side_effects:
          - "further purchase-side trades in this state are rejected with ERR_BLUE_SKY_CAPACITY_EXCEEDED"
      - from: EXHAUSTED
        to: ACTIVE
        trigger: "system cascade from POST /trades/{id}/cancel or POST /trades/{id}/reverse"
        actor: system
        preconditions:
          - "registration.remaining_amount becomes greater than 0.00"
        side_effects:
          - "purchase-side trades in this state are accepted again"
        note: "Cycle ACTIVE -> EXHAUSTED -> ACTIVE."
      - from: ACTIVE
        to: EXPIRED
        trigger: "system evaluation during POST /trades"
        actor: system
        preconditions:
          - "the trade's trade_date is greater than or equal to registration.expiration_date"
        side_effects:
          - "the capturing trade is rejected with ERR_BLUE_SKY_NOT_REGISTERED"

  - entity: SystematicPlan
    state_field: status
    initial_state: ACTIVE
    terminal_states: [TERMINATED]
    shape: cyclic
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "PATCH /systematic-plans/{id} with status SUSPENDED, or system cascade from POST /shareholder-accounts/{id}/restrict, or system branch inside POST /systematic-plans/{id}/execute"
        actor: TransferAgentOperator
        preconditions:
          - "plan.status == ACTIVE"
        side_effects:
          - "plan.suspension_reason := 'OPERATOR_REQUEST', 'ACCOUNT_RESTRICTED' or 'INSUFFICIENT_POSITION_VALUE' depending on the trigger"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "PATCH /systematic-plans/{id} with status ACTIVE"
        actor: TransferAgentOperator
        preconditions:
          - "plan.status == SUSPENDED"
          - "the owning account.status == ACTIVE"
        side_effects:
          - "plan.suspension_reason := null"
        note: "Cycle ACTIVE -> SUSPENDED -> ACTIVE."
      - from: ACTIVE
        to: TERMINATED
        trigger: "PATCH /systematic-plans/{id} with status TERMINATED, or system cascade from POST /systematic-plans (supersede) or POST /shareholder-accounts/{id}/close"
        actor: TransferAgentOperator
        preconditions:
          - "plan.status IN {ACTIVE, SUSPENDED}"
        side_effects:
          - "no further executions are possible"
      - from: SUSPENDED
        to: TERMINATED
        trigger: "PATCH /systematic-plans/{id} with status TERMINATED, or system cascade from POST /shareholder-accounts/{id}/close"
        actor: TransferAgentOperator
        preconditions:
          - "plan.status IN {ACTIVE, SUSPENDED}"
        side_effects:
          - "no further executions are possible"

  - entity: OmnibusReconciliation
    state_field: status
    initial_state: MATCHED
    terminal_states: [RESOLVED, DISPUTED]
    shape: branching
    note: "The initial state is decided at creation time by calculation omnibus_break_classification: MATCHED when the break is inside tolerance, BREAK_IDENTIFIED otherwise."
    transitions:
      - from: BREAK_IDENTIFIED
        to: RESOLVED
        trigger: "POST /omnibus-reconciliations/{id}/adjust"
        actor: ComplianceOfficer
        preconditions:
          - "reconciliation.status == BREAK_IDENTIFIED"
          - "the cited Trade exists, belongs to the same account, has trade_date == reconciliation.as_of_date and settlement_status == SETTLED"
          - "the cited Trade's booked dollar magnitude equals abs(reconciliation.break_amount)"
        side_effects:
          - "reconciliation.adjustment_trade_id := request.adjustment_trade_id"
          - "reconciliation.resolution_note := request.resolution_note"
      - from: BREAK_IDENTIFIED
        to: DISPUTED
        trigger: "POST /omnibus-reconciliations/{id}/dispute"
        actor: ComplianceOfficer
        preconditions:
          - "reconciliation.status == BREAK_IDENTIFIED"
        side_effects:
          - "reconciliation.dispute_note := request.dispute_note"

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: plan-create-stale-account
    parent_entity: ShareholderAccount
    write_endpoint: "POST /systematic-plans"
    occ_field: "expected_account_version"
    description: |
      Creating a SystematicPlan against a ShareholderAccount whose version has advanced since the
      client last read it is rejected. A new plan of the same plan_type and source_share_class_id
      legitimately supersedes the prior ACTIVE plan, so a writer holding a stale view of the account
      would silently terminate a plan it never saw.
    error_id: ERR_STALE_ACCOUNT_VERSION
    http_status: 412

  - rule_id: pricing-error-case-stale-nav
    parent_entity: NavRecord
    write_endpoint: "POST /pricing-error-cases"
    occ_field: "expected_nav_record_version"
    description: |
      Opening a PricingErrorCase against a NavRecord whose version has advanced since the client last
      read it is rejected. A newly opened case supersedes any case still in DETECTED or ASSESSED on
      the same record, so a writer holding a stale view of the record would supersede a determination
      it never observed.
    error_id: ERR_STALE_NAV_RECORD_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: forward_pricing_trade_date
    trigger: "POST /trades, for every captured order"
    algorithm: threshold
    entity_domain: Trade
    formula: |
      now      := logical clock instant (POST /_clock/set_current_utc, default 2026-08-01T00:00:00Z)
      d        := calendar date of now, in UTC
      t        := time-of-day of now, in UTC
      cutoff   := fund.cutoff_time_utc of the fund owning trade.share_class_id
      is_business_day(x) := x falls Monday..Friday (no holiday calendar is modelled)

      if trade.as_of_date is not null:
          trade_date := trade.as_of_date          # subject to the as-of validations
      else if is_business_day(d) and t < cutoff:
          trade_date := d
      else:
          trade_date := the earliest business day strictly after d

      business_days_between(a, b) := count of business days x with a < x <= b
    input_set: "The logical clock and the fund's cutoff. Weekends are non-business days; no holidays."
    constants:
      AS_OF_MAX_BUSINESS_DAYS: 3
      DEFAULT_CLOCK_UTC: "2026-08-01T00:00:00Z"
    precision: "trade_date is an ISO date; the cutoff comparison is strict (t < cutoff prices same day, t == cutoff prices next business day)"

  - name: roa_household_basis
    trigger: "Recomputed whenever a Position of any household member changes (trade settlement, trade reversal, NAV-correction restatement, distribution reinvestment or reversal), and read by purchase_trade_pricing and exchange_settlement_pricing"
    algorithm: aggregation
    entity_domain: ShareholderAccount
    formula: |
      primary(a)   := a.linked_primary_account_id is null ? a : the account whose id == a.linked_primary_account_id
      household(a) := { primary(a) } UNION { x : x.linked_primary_account_id == primary(a).id }
                      # only accounts with status IN {ACTIVE, RESTRICTED} participate; PENDING_DOCS
                      # and CLOSED accounts contribute 0.00

      price(p, on_date) := nav_per_share of the NavRecord for p.share_class_id with
                           status IN {FINAL, CORRECTED} and valuation_date <= on_date,
                           taking the greatest valuation_date; if two such records share that
                           valuation_date, take the one with the earliest created_at;
                           if no such record exists, price is undefined and the position
                           contributes its cost_basis_amount instead of a market value

      MARKET_VALUE_BASIS:
          basis := sum over p in positions(household(a)) with p.shares > 0.000 of
                   ( price(p, on_date) defined ? round(p.shares * price(p, on_date), 2)
                                               : p.cost_basis_amount )
      HISTORICAL_COST_BASIS:
          basis := sum over p in positions(household(a)) with p.shares > 0.000 of p.cost_basis_amount

      household_basis_amount := round(basis, 2)
    input_set: "Positions with shares > 0.000 owned by household accounts whose status is ACTIVE or RESTRICTED. on_date is the trade_date of the pricing trade, or the logical clock date when the field is recomputed outside a trade."
    constants: {}
    precision: "2 decimal places, round_half_up; each position is rounded to cents before summation"
    variants:
      - name: MARKET_VALUE_BASIS
        when: "account.account_channel IN {DIRECT, NETWORKED} — the transfer agent holds position-level records and can mark to the struck NAV"
        difference: "Values every household position at the most recent FINAL or CORRECTED NAV on or before on_date, so unrealized appreciation raises the qualifying amount."
      - name: HISTORICAL_COST_BASIS
        when: "account.account_channel == OMNIBUS — the transfer agent sees only dealer-supplied cost and may not mark the sub-accounts to market"
        difference: "Values every household position at cost_basis_amount, so appreciation never raises the qualifying amount and the same holdings can land in a lower breakpoint tier."

  - name: purchase_trade_pricing
    trigger: "POST /trades/{id}/price for trade_type PURCHASE and for system-created REINVESTMENT trades at POST /distributions/{id}/pay"
    algorithm: tiered_pricing
    entity_domain: Trade
    formula: |
      nav := nav_per_share of the NavRecord for (trade.share_class_id, trade.trade_date)

      # --- pinned evaluation order; the tier is NEVER re-derived from the net amount ---
      # step 1
      roa_qualifying_amount := account.household_basis_amount (computed by roa_household_basis
                               with on_date = trade.trade_date) + trade.gross_amount
      # step 2
      tier      := the element of share_class.breakpoint_tiers with the greatest
                   min_qualifying_amount such that min_qualifying_amount <= roa_qualifying_amount
      load_pct  := tier.load_pct
      # step 3
      sales_load_amount   := round(trade.gross_amount * load_pct, 2)
      # step 4
      net_invested_amount := trade.gross_amount - sales_load_amount
      # step 5
      shares_transacted   := round(net_invested_amount / nav, 3)

      # REINVESTMENT trades bypass steps 1-4 entirely: load_pct := 0.0000,
      # sales_load_amount := 0.00, net_invested_amount := payment.net_amount.
    input_set: "The household basis of the buying account, the class breakpoint tiers, and the NavRecord for the trade date."
    constants:
      SHARE_ROUNDING_DECIMALS: 3
      MONEY_ROUNDING_DECIMALS: 2
    precision: "shares 3 decimal places round_half_up; dollars 2 decimal places round_half_up; the load percentage itself is never rounded"
    variants:
      - name: PRELIMINARY_NAV
        when: "the NavRecord for the trade date has status PRELIMINARY at the moment POST /trades/{id}/price runs"
        difference: "Prices against the preliminary strike, leaves the trade in PRICED_PROVISIONAL, and blocks settlement. Repricing after the record is finalized overwrites shares_transacted, so the same order can carry two different share quantities during its life."
      - name: FINAL_NAV
        when: "the NavRecord for the trade date has status FINAL or CORRECTED at the moment POST /trades/{id}/price runs"
        difference: "Prices against the final strike, moves the trade to PRICED_FINAL, and permits settlement. The share quantity produced here is the one that reaches the ledger."

  - name: redemption_proceeds_with_cdsc
    trigger: "POST /trades/{id}/price for trade_type REDEMPTION"
    algorithm: waterfall_allocation
    entity_domain: Trade
    formula: |
      nav      := nav_per_share of the NavRecord for (trade.share_class_id, trade.trade_date)
      position := the Position for (trade.account_id, trade.share_class_id)

      gross_proceeds_amount := round(trade.shares_requested * nav, 2)

      if share_class.cdsc_enabled == false:
          cdsc_amount := 0.00
      else:
          holding_days       := calendar days from position.first_purchase_date to trade.trade_date
          cdsc_pct           := 0.0100 when holding_days < 365
                                0.0050 when 365 <= holding_days < 730
                                0.0000 when holding_days >= 730
          free_allowance     := round(position.shares * CDSC_FREE_ALLOWANCE_PCT, 3)
          reinvest_exclusion := min(position.reinvested_shares, trade.shares_requested)
          chargeable_shares  := max(0.000, trade.shares_requested - free_allowance - reinvest_exclusion)
          charge_basis       := min(position.avg_cost_per_share, nav)
          cdsc_amount        := round(chargeable_shares * charge_basis * cdsc_pct, 2)

      net_proceeds_amount := gross_proceeds_amount - cdsc_amount
      shares_transacted   := -1 * trade.shares_requested
    input_set: "The redeeming position's share balance, reinvested-share bucket, average cost and first purchase date, plus the NAV of the trade date."
    constants:
      CDSC_FREE_ALLOWANCE_PCT: 0.10
      CDSC_TIER_1_DAYS: 365
      CDSC_TIER_2_DAYS: 730
      CDSC_TIER_1_PCT: 0.0100
      CDSC_TIER_2_PCT: 0.0050
    precision: "dollars 2 decimal places round_half_up; the free allowance is rounded to 3 decimals before the subtraction; the multiplication chargeable_shares * charge_basis * cdsc_pct is rounded once, at the end"

  - name: exchange_settlement_pricing
    trigger: "POST /trades/{id}/price and POST /trades/{id}/settle for trade_type EXCHANGE"
    algorithm: constraint_propagation
    entity_domain: Trade
    formula: |
      source_nav := nav_per_share of the NavRecord for (trade.share_class_id, trade.trade_date)
      target_nav := nav_per_share of the NavRecord for (trade.exchange_target_share_class_id, trade.trade_date)

      gross_proceeds_amount := round(trade.shares_requested * source_nav, 2)
      cdsc_amount           := 0.00        # exchanges never carry a contingent deferred sales charge
      net_proceeds_amount   := gross_proceeds_amount

      if source_class.fund_id == target_class.fund_id:
          target_load_pct := 0.0000
      else:
          roa   := account.household_basis_amount + gross_proceeds_amount
          tier  := the element of target_class.breakpoint_tiers with the greatest
                   min_qualifying_amount such that min_qualifying_amount <= roa
          target_load_pct := tier.load_pct

      sales_load_amount     := round(gross_proceeds_amount * target_load_pct, 2)
      exchange_target_shares := round((gross_proceeds_amount - sales_load_amount) / target_nav, 3)
      shares_transacted      := -1 * trade.shares_requested
    input_set: "Both NavRecords for the trade date, the two share classes' fund_id values, and the household basis when the classes belong to different funds."
    constants: {}
    precision: "dollars 2 decimal places round_half_up; target shares 3 decimal places round_half_up"

  - name: nav_per_share_strike
    trigger: "POST /nav-records and POST /nav-records/{id}/repost"
    algorithm: aggregation
    entity_domain: NavRecord
    formula: |
      shares_outstanding_snapshot := share_class.total_shares_outstanding at the moment of the call

      if shares_outstanding_snapshot == 0.000:
          nav_per_share := share_class.seed_nav_per_share
      else:
          nav_per_share := round(total_net_assets / shares_outstanding_snapshot, 4)
    input_set: "The class share balance as maintained by the share ledger, and the operator-supplied total net assets."
    constants: {}
    precision: "4 decimal places, round_half_up"

  - name: pricing_error_materiality
    trigger: "POST /pricing-error-cases/{id}/assess"
    algorithm: threshold
    entity_domain: PricingErrorCase
    formula: |
      original  := case.original_nav_per_share
      corrected := case.corrected_nav_per_share
      error_bps := round(abs(corrected - original) / original * 10000, 2)

      materiality := MATERIAL   when error_bps >= MATERIALITY_THRESHOLD_BPS
                     IMMATERIAL when error_bps <  MATERIALITY_THRESHOLD_BPS
    input_set: "The NAV in force when the case was opened, and the corrected NAV supplied by the fund accountant."
    constants:
      MATERIALITY_THRESHOLD_BPS: 50
    precision: "error_bps 2 decimal places, round_half_up; the comparison against the threshold is inclusive at exactly 50.00 bps"

  - name: distribution_payment_amounts
    trigger: "POST /distributions/{id}/record for the per-payment amounts, POST /distributions/{id}/pay for the reinvestment quantities"
    algorithm: aggregation
    entity_domain: Distribution
    formula: |
      eligible := Positions p where p.share_class_id == distribution.share_class_id,
                  p.shares > 0.000, and the owning account.status IN {ACTIVE, RESTRICTED};
                  processed in ascending Position.created_at order

      # --- pinned rounding order: round per payment first, then sum. ---
      for each p in eligible:
          shares_of_record  := p.shares
          gross_amount      := round(shares_of_record * distribution.rate_per_share, 2)
          withholding_amount := account.tin_certified == false
                                  and account.registration_type NOT IN {IRA_TRADITIONAL, ROTH_IRA, UGMA_UTMA}
                                ? round(gross_amount * BACKUP_WITHHOLDING_RATE, 2)
                                : 0.00
          net_amount        := gross_amount - withholding_amount
          payout_option     := account.dividend_option

      distribution.total_gross_amount       := sum of the already-rounded gross_amount values
      distribution.total_withholding_amount := sum of the already-rounded withholding_amount values

      # at pay time, priced off the ex_date NavRecord:
      reinvest_nav := nav_per_share of the NavRecord for (share_class_id, ex_date)
      for each payment with payout_option == REINVEST:
          reinvested_shares := round(net_amount / reinvest_nav, 3)
          cash_amount       := 0.00
      for each payment with payout_option == CASH:
          reinvested_shares := 0.000
          cash_amount       := net_amount

      distribution.total_cash_amount        := sum of cash_amount
      distribution.total_reinvested_amount  := sum of net_amount over REINVEST payments
    input_set: "Positions of the declaring class with a non-zero balance whose account is ACTIVE or RESTRICTED, evaluated at record time. Positions created after the record call are never picked up."
    constants:
      BACKUP_WITHHOLDING_RATE: 0.24
    precision: |
      Dollars 2 decimal places round_half_up, shares 3 decimal places round_half_up. The rounding
      ORDER is pinned: each payment's gross_amount is rounded to cents BEFORE any summation, and the
      distribution totals are sums of those already-rounded values. Rounding the aggregate
      sum(shares) * rate_per_share instead is wrong and can differ by a cent or more.

  - name: blue_sky_capacity_ledger
    trigger: "POST /trades (reserve), POST /trades/{id}/settle (convert reserve to consumption), POST /trades/{id}/cancel (release reserve), POST /trades/{id}/reverse (release consumption)"
    algorithm: aggregation
    entity_domain: BlueSkyRegistration
    formula: |
      registration selector for a purchase-side trade:
          candidates := BlueSkyRegistration rows where share_class_id == the class being bought
                        (for EXCHANGE, the target class), state_code == account.state_code,
                        status IN {ACTIVE, EXHAUSTED},
                        effective_date <= trade.trade_date < expiration_date
          rank       := greatest effective_date first
          tie_break  := earliest created_at first
          empty pool := reject the capture with ERR_BLUE_SKY_NOT_REGISTERED

      remaining_amount := registered_amount - reserved_amount - consumed_amount

      capture  : require trade.gross_amount <= remaining_amount   (equality is allowed)
                 then reserved_amount += trade.gross_amount
      settle   : reserved_amount -= trade.gross_amount ; consumed_amount += trade.gross_amount
      cancel   : reserved_amount -= trade.gross_amount
      reverse  : consumed_amount -= trade.gross_amount

      status := EXHAUSTED when remaining_amount == 0.00, otherwise ACTIVE

      # For an EXCHANGE the amount that moves through the ledger is gross_proceeds_amount,
      # reserved at capture using the source NAV of the previous business day is NOT permitted:
      # exchanges reserve nothing at capture and consume gross_proceeds_amount at settlement.
    input_set: "One registration row per (share_class_id, state_code) window; only purchase-side dollars move through it. Redemptions never restore capacity."
    constants: {}
    precision: "2 decimal places, round_half_up; the invariant registered_amount == remaining_amount + reserved_amount + consumed_amount holds after every step"

  - name: omnibus_break_classification
    trigger: "POST /omnibus-reconciliations"
    algorithm: threshold
    entity_domain: OmnibusReconciliation
    formula: |
      ta_purchase_amount   := sum of gross_amount over Trades of this account with
                              trade_type IN {PURCHASE}, settlement_status == SETTLED and
                              trade_date == as_of_date
      ta_redemption_amount := sum of gross_proceeds_amount over Trades of this account with
                              trade_type IN {REDEMPTION}, settlement_status == SETTLED and
                              trade_date == as_of_date
      ta_net_shares        := sum of ShareLedgerEntry.share_delta over entries whose
                              effective_date == as_of_date and whose position belongs to this account

      ta_net     := ta_purchase_amount - ta_redemption_amount
      dealer_net := dealer_reported_purchase_amount - dealer_reported_redemption_amount

      break_amount     := round(ta_net - dealer_net, 2)
      dealer_gross     := dealer_reported_purchase_amount + dealer_reported_redemption_amount
      tolerance_amount := max(RECON_TOLERANCE_FLOOR, round(dealer_gross * RECON_TOLERANCE_RATE, 2))

      status := MATCHED           when abs(break_amount) <= tolerance_amount
                BREAK_IDENTIFIED  when abs(break_amount) >  tolerance_amount
    input_set: "Only SETTLED trades dated exactly as_of_date. Trades still UNSETTLED, CANCELLED or REVERSED are excluded; REINVESTMENT and EXCHANGE trades are excluded from both dollar sums."
    constants:
      RECON_TOLERANCE_FLOOR: 1.00
      RECON_TOLERANCE_RATE: 0.0001
    precision: "2 decimal places, round_half_up; the tolerance comparison is inclusive, so a break exactly equal to the tolerance is MATCHED"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority; lowest number wins)
# =============================================================================
validations:
  - priority: 10
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and X-User-Role is one of the five declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 20
    category: auth
    check: "The acting role appears in the endpoint's roles list in the API endpoint table"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 30
    category: business_constraint
    check: "Request body shape: every required field present, enums inside their declared value set, numbers within their declared decimal precision and sign, dates ISO YYYY-MM-DD, gross_amount present exactly for PURCHASE, shares_requested present exactly for REDEMPTION and EXCHANGE, exchange_target_share_class_id present exactly for EXCHANGE, target_share_class_id present exactly for SYSTEMATIC_EXCHANGE, dealer_firm_code present exactly for account_channel NETWORKED or OMNIBUS, breakpoint_tiers ascending and starting at min_qualifying_amount 0"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "all write endpoints"

  - priority: 40
    category: existence
    check: "Every resource named in the URL path exists, validated left to right"
    error_id: "ERR_FUND_NOT_FOUND | ERR_SHARE_CLASS_NOT_FOUND | ERR_ACCOUNT_NOT_FOUND | ERR_POSITION_NOT_FOUND | ERR_NAV_RECORD_NOT_FOUND | ERR_TRADE_NOT_FOUND | ERR_DISTRIBUTION_NOT_FOUND | ERR_PAYMENT_NOT_FOUND | ERR_PLAN_NOT_FOUND | ERR_REGISTRATION_NOT_FOUND | ERR_CASE_NOT_FOUND | ERR_RECONCILIATION_NOT_FOUND | ERR_LEDGER_ENTRY_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path parameters"

  - priority: 50
    category: existence
    check: "Every foreign key supplied in the request body resolves to an existing row"
    error_id: "ERR_FUND_NOT_FOUND | ERR_SHARE_CLASS_NOT_FOUND | ERR_ACCOUNT_NOT_FOUND | ERR_NAV_RECORD_NOT_FOUND | ERR_TRADE_NOT_FOUND"
    http_status: 404
    applies_to: "POST /share-classes, POST /shareholder-accounts, PATCH /shareholder-accounts/{id}, POST /nav-records, POST /blue-sky-registrations, POST /trades, POST /distributions, POST /systematic-plans, POST /pricing-error-cases, POST /omnibus-reconciliations, POST /omnibus-reconciliations/{id}/adjust"

  - priority: 60
    category: auth
    check: "When the acting role is AccountHolder, the account the request touches must be the account whose id equals X-User-ID"
    error_id: ERR_ACCOUNT_OWNERSHIP_REQUIRED
    http_status: 403
    applies_to: "GET /shareholder-accounts/{id}, PATCH /shareholder-accounts/{id}, GET /shareholder-accounts/{id}/positions, POST /trades, POST /systematic-plans, PATCH /systematic-plans/{id}"

  - priority: 62
    category: auth
    check: "When the acting role is DealerOperations, the account the request touches must have account_channel IN {NETWORKED, OMNIBUS}"
    error_id: ERR_DEALER_CHANNEL_REQUIRED
    http_status: 403
    applies_to: "POST /trades, POST /shareholder-accounts, POST /omnibus-reconciliations"

  - priority: 70
    category: state
    check: "expected_account_version equals ShareholderAccount.version; expected_nav_record_version equals NavRecord.version"
    error_id: "ERR_STALE_ACCOUNT_VERSION | ERR_STALE_NAV_RECORD_VERSION"
    http_status: 412
    applies_to: "POST /systematic-plans, POST /pricing-error-cases"

  - priority: 80
    category: state
    check: "The account referenced by the operation is in a state that permits it: purchase-side and redemption-side trade capture, systematic plan creation and plan execution all require account.status IN {ACTIVE, RESTRICTED}; PENDING_DOCS and CLOSED are rejected"
    error_id: ERR_ACCOUNT_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /trades, POST /systematic-plans, POST /systematic-plans/{id}/execute, POST /shareholder-accounts/{id}/activate, POST /shareholder-accounts/{id}/close"

  - priority: 82
    category: state
    check: "The target resource is in a state from which the requested transition is declared in the state machine table"
    error_id: "ERR_INVALID_TRADE_STATE | ERR_INVALID_NAV_STATE | ERR_INVALID_CASE_STATE | ERR_INVALID_DISTRIBUTION_STATE | ERR_INVALID_PLAN_STATE | ERR_INVALID_RECONCILIATION_STATE"
    http_status: 409
    applies_to: "every action endpoint that drives a state machine transition"

  - priority: 85
    category: state
    check: "A RESTRICTED account may not originate purchase-side activity: trade_type PURCHASE or EXCHANGE at capture, and systematic plan execution of plan_type SYSTEMATIC_INVESTMENT or SYSTEMATIC_EXCHANGE"
    error_id: ERR_ACCOUNT_RESTRICTED
    http_status: 409
    applies_to: "POST /trades, POST /systematic-plans/{id}/execute"

  - priority: 90
    category: business_safety
    check: "Segregation of duties: the compliance officer approving an as-of trade must not be the actor that captured it, and the fund accountant running a reprocessing sweep must not be the actor that opened the case"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /trades/{id}/approve-as-of, POST /pricing-error-cases/{id}/reprocess"

  - priority: 100
    category: business_safety
    check: "Late trading: an order whose as_of_date equals the current logical clock date and whose clock time is at or after the fund cutoff is rejected outright"
    error_id: ERR_LATE_TRADE_PROHIBITED
    http_status: 422
    applies_to: "POST /trades"

  - priority: 102
    category: business_safety
    check: "An as_of_date strictly after the current logical clock date, or falling on a Saturday or Sunday, is rejected"
    error_id: ERR_AS_OF_FUTURE_DATE
    http_status: 422
    applies_to: "POST /trades"

  - priority: 105
    category: business_safety
    check: "business_days_between(as_of_date, current business date) must be less than or equal to AS_OF_MAX_BUSINESS_DAYS (3)"
    error_id: ERR_AS_OF_WINDOW_EXCEEDED
    http_status: 422
    applies_to: "POST /trades"

  - priority: 110
    category: business_temporal
    check: "Blue-sky window overlap: for a given (share_class_id, state_code), the half-open interval [effective_date, expiration_date) of a new registration must not intersect that of an existing registration with status IN {ACTIVE, EXHAUSTED}. Touching endpoints do not intersect, so new.effective_date == existing.expiration_date is accepted."
    error_id: ERR_BLUE_SKY_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /blue-sky-registrations"

  - priority: 112
    category: business_temporal
    check: "Distribution period overlap: for a given (share_class_id, distribution_type), the CLOSED interval [record_date, pay_date] of a new declaration must not intersect that of an existing declaration with status IN {DECLARED, RECORDED, PAID}. Because both endpoints are inclusive, a new record_date equal to an existing pay_date IS an intersection and is rejected."
    error_id: ERR_DISTRIBUTION_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /distributions"

  - priority: 114
    category: business_constraint
    check: "At most one NavRecord may exist per (share_class_id, valuation_date)"
    error_id: ERR_NAV_DATE_DUPLICATE
    http_status: 409
    applies_to: "POST /nav-records"

  - priority: 116
    category: business_constraint
    check: "Rights-of-accumulation linking is single level and self-exclusive: linked_primary_account_id must not equal the account's own id, must reference an account whose own linked_primary_account_id is null, and must reference an account with status IN {ACTIVE, RESTRICTED}"
    error_id: ERR_ROA_LINK_INVALID
    http_status: 422
    applies_to: "POST /shareholder-accounts, PATCH /shareholder-accounts/{id}"

  - priority: 118
    category: business_constraint
    check: "An EXCHANGE trade's exchange_target_share_class_id must differ from share_class_id; a SYSTEMATIC_EXCHANGE plan's target_share_class_id must differ from source_share_class_id"
    error_id: ERR_EXCHANGE_TARGET_INVALID
    http_status: 422
    applies_to: "POST /trades, POST /systematic-plans"

  - priority: 120
    category: business_constraint
    check: "Reconciliation may only be opened against an account whose account_channel IN {NETWORKED, OMNIBUS}"
    error_id: ERR_RECON_CHANNEL_INVALID
    http_status: 422
    applies_to: "POST /omnibus-reconciliations"

  - priority: 122
    category: business_constraint
    check: "Purchase-side capture (trade_type PURCHASE or EXCHANGE) is refused when the owning Fund.status == CLOSED_TO_NEW"
    error_id: ERR_FUND_CLOSED_TO_NEW
    http_status: 422
    applies_to: "POST /trades"

  - priority: 125
    category: business_referential
    check: "A NavRecord must exist for (share_class_id, trade_date), and for EXCHANGE also for (exchange_target_share_class_id, trade_date); for distribution payment a NavRecord must exist for (share_class_id, ex_date)"
    error_id: ERR_NAV_NOT_AVAILABLE
    http_status: 409
    applies_to: "POST /trades/{id}/price, POST /distributions/{id}/pay"

  - priority: 127
    category: business_referential
    check: "The NavRecord that would price the operation must not be UNDER_ERROR_REVIEW or STALE_REPRICE_REQUIRED; for POST /distributions/{id}/pay it must additionally be FINAL or CORRECTED"
    error_id: ERR_NAV_NOT_FINAL
    http_status: 409
    applies_to: "POST /trades/{id}/price, POST /distributions/{id}/pay"

  - priority: 129
    category: business_referential
    check: "A purchase-side trade must resolve exactly one blue-sky registration for (class, account.state_code) whose window covers trade_date and whose status is not EXPIRED"
    error_id: ERR_BLUE_SKY_NOT_REGISTERED
    http_status: 422
    applies_to: "POST /trades"

  - priority: 131
    category: business_referential
    check: "The trade cited by a reconciliation adjustment must belong to the same account, carry trade_date == reconciliation.as_of_date, have settlement_status == SETTLED, and its booked dollar magnitude must equal abs(break_amount)"
    error_id: ERR_ADJUSTMENT_MISMATCH
    http_status: 422
    applies_to: "POST /omnibus-reconciliations/{id}/adjust"

  - priority: 136
    category: business_temporal
    check: "A systematic plan may only execute when the logical clock date is greater than or equal to plan.next_run_date"
    error_id: ERR_PLAN_NOT_DUE
    http_status: 409
    applies_to: "POST /systematic-plans/{id}/execute"

  - priority: 140
    category: business_fiscal
    check: "A purchase-side trade's gross_amount must be less than or equal to the selected registration's remaining_amount; equality is accepted and drives the registration to EXHAUSTED"
    error_id: ERR_BLUE_SKY_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /trades"

  - priority: 142
    category: business_fiscal
    check: "A REDEMPTION or EXCHANGE must not request more shares than the owning Position holds at capture and again at settlement"
    error_id: ERR_INSUFFICIENT_SHARES
    http_status: 422
    applies_to: "POST /trades, POST /trades/{id}/settle"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---------------------------------------------------------------- test clock
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Sets the logical clock every date and time rule reads. Before the first call the clock reads exactly 2026-08-01T00:00:00Z (a Saturday); it never falls back to real wall-clock time."
    roles: [TransferAgentOperator, FundAccountant, ComplianceOfficer]
    code: 200
    input: ["to_iso8601"]
    output: { current_utc: datetime }
    side_effects: ["all subsequent received_at, trade_date, plan due-date and distribution date comparisons read the new instant"]

  # ---------------------------------------------------------------- fund setup
  - method: POST
    path: "/funds"
    description: "Registers a fund."
    roles: [FundAccountant]
    code: 201
    input: ["name", "fund_family_code", "cutoff_time_utc?", "status?"]
    output: Fund
    side_effects: []

  - method: GET
    path: "/funds/{id}"
    description: "Reads one fund."
    roles: [TransferAgentOperator, FundAccountant, ComplianceOfficer, DealerOperations, AccountHolder]
    code: 200
    input: []
    output: Fund
    side_effects: []

  - method: POST
    path: "/share-classes"
    description: "Registers a share class with its breakpoint schedule."
    roles: [FundAccountant]
    code: 201
    input: ["fund_id", "class_code", "seed_nav_per_share", "breakpoint_tiers", "cdsc_enabled?", "twelve_b_one_fee_pct?"]
    output: ShareClass
    side_effects: ["total_shares_outstanding initialised to 0.000"]

  - method: GET
    path: "/share-classes/{id}"
    description: "Reads one share class including its live total_shares_outstanding."
    roles: [TransferAgentOperator, FundAccountant, ComplianceOfficer, DealerOperations, AccountHolder]
    code: 200
    input: []
    output: ShareClass
    side_effects: []

  - method: GET
    path: "/share-classes"
    description: "Lists share classes, optionally filtered by fund."
    roles: [TransferAgentOperator, FundAccountant, ComplianceOfficer, DealerOperations, AccountHolder]
    code: 200
    input: ["fund_id?", "class_code?", "limit?", "offset?"]
    output: ShareClass[]
    side_effects: []

  - method: GET
    path: "/share-classes/{id}/nav-records"
    description: "Lists the NAV records struck for a share class."
    roles: [TransferAgentOperator, FundAccountant, ComplianceOfficer, DealerOperations, AccountHolder]
    code: 200
    input: ["valuation_date?", "status?", "limit?", "offset?"]
    output: NavRecord[]
    side_effects: []

  - method: GET
    path: "/share-classes/{id}/blue-sky-registrations"
    description: "Lists the state registrations covering a share class."
    roles: [TransferAgentOperator, FundAccountant, ComplianceOfficer, DealerOperations, AccountHolder]
    code: 200
    input: ["state_code?", "status?", "limit?", "offset?"]
    output: BlueSkyRegistration[]
    side_effects: []

  - method: GET
    path: "/share-classes/{id}/distributions"
    description: "Lists the distributions declared on a share class."
    roles: [TransferAgentOperator, FundAccountant, ComplianceOfficer, DealerOperations, AccountHolder]
    code: 200
    input: ["distribution_type?", "status?", "limit?", "offset?"]
    output: Distribution[]
    side_effects: []

  # ------------------------------------------------------- shareholder accounts
  - method: POST
    path: "/shareholder-accounts"
    description: "Opens a shareholder account in PENDING_DOCS."
    roles: [TransferAgentOperator, DealerOperations]
    code: 201
    input: ["registration_type", "account_channel", "state_code", "tax_id", "primary_owner_name", "dividend_option?", "linked_primary_account_id?", "dealer_firm_code?"]
    output: ShareholderAccount
    side_effects: ["status initialised to PENDING_DOCS", "tin_certified initialised to false", "household_basis_amount initialised to 0.00", "household_basis_variant set from account_channel"]

  - method: GET
    path: "/shareholder-accounts/{id}"
    description: "Reads one shareholder account."
    roles: [TransferAgentOperator, FundAccountant, ComplianceOfficer, DealerOperations, AccountHolder]
    code: 200
    input: []
    output: ShareholderAccount
    side_effects: []

  - method: GET
    path: "/shareholder-accounts"
    description: "Lists shareholder accounts; linked_primary_account_id returns the rights-of-accumulation household members of a primary account."
    roles: [TransferAgentOperator, FundAccountant, ComplianceOfficer, DealerOperations]
    code: 200
    input: ["linked_primary_account_id?", "status?", "account_channel?", "state_code?", "limit?", "offset?"]
    output: ShareholderAccount[]
    side_effects: []

  - method: PATCH
    path: "/shareholder-accounts/{id}"
    description: "Updates the standing dividend instruction or the rights-of-accumulation link."
    roles: [TransferAgentOperator, AccountHolder]
    code: 200
    input: ["dividend_option?", "linked_primary_account_id?"]
    output: ShareholderAccount
    side_effects: ["household_basis_amount of both the old and the new household is recomputed when the link changes", "increments ShareholderAccount.version by 1"]

  - method: POST
    path: "/shareholder-accounts/{id}/activate"
    description: "Records receipt of the account documents and moves PENDING_DOCS to ACTIVE."
    roles: [TransferAgentOperator]
    code: 200
    input: ["tin_certified"]
    output: ShareholderAccount
    side_effects: ["status becomes ACTIVE", "tin_certified stamped", "increments ShareholderAccount.version by 1"]

  - method: POST
    path: "/shareholder-accounts/{id}/restrict"
    description: "Places a compliance restriction on the account."
    roles: [ComplianceOfficer]
    code: 200
    input: ["restriction_reason"]
    output: ShareholderAccount
    side_effects: ["status becomes RESTRICTED", "every ACTIVE SystematicPlan on the account becomes SUSPENDED with suspension_reason ACCOUNT_RESTRICTED", "increments ShareholderAccount.version by 1"]

  - method: POST
    path: "/shareholder-accounts/{id}/reinstate"
    description: "Lifts a compliance restriction."
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: ShareholderAccount
    side_effects: ["status returns to ACTIVE", "restriction_reason cleared", "suspended plans are NOT auto-resumed", "increments ShareholderAccount.version by 1"]

  - method: POST
    path: "/shareholder-accounts/{id}/close"
    description: "Closes an account that holds no shares and has no open trades."
    roles: [TransferAgentOperator]
    code: 200
    input: []
    output: ShareholderAccount
    side_effects: ["status becomes CLOSED", "closed_at stamped", "every ACTIVE or SUSPENDED SystematicPlan becomes TERMINATED", "increments ShareholderAccount.version by 1"]

  - method: GET
    path: "/shareholder-accounts/{id}/positions"
    description: "Lists the positions held by an account."
    roles: [TransferAgentOperator, FundAccountant, ComplianceOfficer, DealerOperations, AccountHolder]
    code: 200
    input: ["share_class_id?", "limit?", "offset?"]
    output: Position[]
    side_effects: []

  # -------------------------------------------------------- positions & ledger
  - method: GET
    path: "/positions/{id}"
    description: "Reads one position."
    roles: [TransferAgentOperator, FundAccountant, ComplianceOfficer, DealerOperations, AccountHolder]
    code: 200
    input: []
    output: Position
    side_effects: []

  - method: GET
    path: "/positions"
    description: "Lists positions filtered by account or by share class."
    roles: [TransferAgentOperator, FundAccountant, ComplianceOfficer, DealerOperations]
    code: 200
    input: ["account_id?", "share_class_id?", "limit?", "offset?"]
    output: Position[]
    side_effects: []

  - method: GET
    path: "/share-ledger-entries/{id}"
    description: "Reads one share ledger entry."
    roles: [TransferAgentOperator, FundAccountant, ComplianceOfficer]
    code: 200
    input: []
    output: ShareLedgerEntry
    side_effects: []

  - method: GET
    path: "/share-ledger-entries"
    description: "Lists the append-only share ledger, filtered by position, by trade, or by reason."
    roles: [TransferAgentOperator, FundAccountant, ComplianceOfficer]
    code: 200
    input: ["position_id?", "trade_id?", "entry_reason?", "effective_date?", "limit?", "offset?"]
    output: ShareLedgerEntry[]
    side_effects: []

  # --------------------------------------------------------------- blue sky
  - method: POST
    path: "/blue-sky-registrations"
    description: "Files a state registration window for a share class."
    roles: [ComplianceOfficer]
    code: 201
    input: ["share_class_id", "state_code", "registered_amount", "effective_date", "expiration_date"]
    output: BlueSkyRegistration
    side_effects: ["reserved_amount and consumed_amount initialised to 0.00", "remaining_amount initialised to registered_amount", "status initialised to ACTIVE"]

  - method: GET
    path: "/blue-sky-registrations/{id}"
    description: "Reads one state registration including its live capacity split."
    roles: [TransferAgentOperator, FundAccountant, ComplianceOfficer, DealerOperations]
    code: 200
    input: []
    output: BlueSkyRegistration
    side_effects: []

  # -------------------------------------------------------------- NAV records
  - method: POST
    path: "/nav-records"
    description: "Strikes a preliminary NAV for a share class and valuation date."
    roles: [FundAccountant]
    code: 201
    input: ["share_class_id", "valuation_date", "total_net_assets"]
    output: NavRecord
    side_effects: ["shares_outstanding_snapshot captured from ShareClass.total_shares_outstanding", "nav_per_share computed by calculation nav_per_share_strike", "status initialised to PRELIMINARY"]

  - method: GET
    path: "/nav-records/{id}"
    description: "Reads one NAV record."
    roles: [TransferAgentOperator, FundAccountant, ComplianceOfficer, DealerOperations, AccountHolder]
    code: 200
    input: []
    output: NavRecord
    side_effects: []

  - method: POST
    path: "/nav-records/{id}/finalize"
    description: "Finalizes a preliminary NAV so trades can settle against it."
    roles: [FundAccountant]
    code: 200
    input: []
    output: NavRecord
    side_effects: ["status becomes FINAL", "finalized_at stamped", "increments NavRecord.version by 1"]

  - method: POST
    path: "/nav-records/{id}/repost"
    description: "Re-strikes a NAV record: revises a still-preliminary strike, or re-strikes a record that was invalidated by a share-balance restatement. In both cases nav_per_share is recomputed from the supplied total net assets and the live share balance."
    roles: [FundAccountant]
    code: 200
    input: ["total_net_assets"]
    output: NavRecord
    side_effects: ["status is PRELIMINARY after the call, whether it was PRELIMINARY or STALE_REPRICE_REQUIRED before", "shares_outstanding_snapshot and nav_per_share recomputed by calculation nav_per_share_strike", "increments NavRecord.version by 1"]

  # ------------------------------------------------------------------- trades
  - method: POST
    path: "/trades"
    description: "Captures an order. The trade date follows the forward-pricing rule unless an as_of_date is supplied, in which case the as-of and late-trade controls apply."
    roles: [TransferAgentOperator, ComplianceOfficer, DealerOperations, AccountHolder]
    code: 201
    input: ["account_id", "share_class_id", "trade_type", "gross_amount?", "shares_requested?", "as_of_date?", "exchange_target_share_class_id?", "dealer_reference?"]
    output: Trade
    side_effects: ["received_at stamped from the logical clock", "trade_date computed by calculation forward_pricing_trade_date", "captured_by_user_id stamped from X-User-ID", "execution_status set to RECEIVED, or PENDING_AS_OF_APPROVAL when as_of_date is supplied", "for PURCHASE: blue_sky_registration_id resolved and registration.reserved_amount increased by gross_amount", "a registration whose remaining_amount reaches 0.00 becomes EXHAUSTED"]

  - method: GET
    path: "/trades/{id}"
    description: "Reads one trade with both status dimensions and every priced field."
    roles: [TransferAgentOperator, FundAccountant, ComplianceOfficer, DealerOperations, AccountHolder]
    code: 200
    input: []
    output: Trade
    side_effects: []

  - method: GET
    path: "/trades"
    description: "Lists trades filtered by account, class, exchange target, originating distribution or plan, reserved registration, either status dimension, or trade date."
    roles: [TransferAgentOperator, FundAccountant, ComplianceOfficer, DealerOperations, AccountHolder]
    code: 200
    input: ["account_id?", "share_class_id?", "exchange_target_share_class_id?", "parent_distribution_id?", "originating_plan_id?", "blue_sky_registration_id?", "execution_status?", "settlement_status?", "trade_date?", "trade_type?", "limit?", "offset?"]
    output: Trade[]
    side_effects: []

  - method: POST
    path: "/trades/{id}/approve-as-of"
    description: "Compliance approval that releases an as-of order for pricing."
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Trade
    side_effects: ["execution_status becomes RECEIVED", "approved_by_user_id stamped", "increments Trade.version by 1"]

  - method: POST
    path: "/trades/{id}/price"
    description: "Prices the order against the NAV of its trade date. Prices provisionally when that NAV is still preliminary, and finally once it is final or corrected."
    roles: [TransferAgentOperator, FundAccountant]
    code: 200
    input: []
    output: Trade
    side_effects: ["pricing_variant, nav_per_share_applied, roa_qualifying_amount, roa_basis_variant, sales_load_pct, sales_load_amount, net_invested_amount, shares_transacted, gross_proceeds_amount, cdsc_amount, net_proceeds_amount and exchange_target_shares written by the relevant pricing calculation", "execution_status becomes PRICED_PROVISIONAL or PRICED_FINAL"]

  - method: POST
    path: "/trades/{id}/settle"
    description: "Books the priced order to the share ledger."
    roles: [TransferAgentOperator]
    code: 200
    input: []
    output: Trade
    side_effects: ["settlement_status becomes SETTLED", "Position created when absent and Position.shares moved by shares_transacted", "ShareLedgerEntry appended", "ShareClass.total_shares_outstanding moved", "blue-sky reserved_amount converted to consumed_amount for PURCHASE, target-class capacity consumed for EXCHANGE", "owning account household_basis_amount and every household Position.current_roa_tier_pct recomputed"]

  - method: POST
    path: "/trades/{id}/cancel"
    description: "Cancels an unsettled order."
    roles: [TransferAgentOperator, ComplianceOfficer]
    code: 200
    input: ["cancel_reason"]
    output: Trade
    side_effects: ["execution_status becomes CANCELLED", "reserved blue-sky capacity released", "an EXHAUSTED registration whose remaining_amount rises above 0.00 returns to ACTIVE"]

  - method: POST
    path: "/trades/{id}/reverse"
    description: "Reverses a settled trade, unwinding every book entry it produced."
    roles: [ComplianceOfficer]
    code: 200
    input: ["reversal_reason"]
    output: Trade
    side_effects: ["settlement_status becomes REVERSED", "compensating ShareLedgerEntry appended with entry_reason TRADE_REVERSAL", "Position.shares, Position.cost_basis_amount and ShareClass.total_shares_outstanding returned to their pre-settlement values", "consumed blue-sky capacity released", "an EXHAUSTED registration whose remaining_amount rises above 0.00 returns to ACTIVE", "household_basis_amount and household Position.current_roa_tier_pct recomputed"]

  # ------------------------------------------------------------ distributions
  - method: POST
    path: "/distributions"
    description: "Declares an income or capital gain distribution on a share class."
    roles: [FundAccountant]
    code: 201
    input: ["share_class_id", "distribution_type", "rate_per_share", "record_date", "ex_date", "pay_date"]
    output: Distribution
    side_effects: ["status initialised to DECLARED"]

  - method: GET
    path: "/distributions/{id}"
    description: "Reads one distribution with its rounded totals."
    roles: [TransferAgentOperator, FundAccountant, ComplianceOfficer, DealerOperations, AccountHolder]
    code: 200
    input: []
    output: Distribution
    side_effects: []

  - method: POST
    path: "/distributions/{id}/record"
    description: "Freezes the holders of record and creates one payment row per eligible position."
    roles: [FundAccountant]
    code: 200
    input: []
    output: Distribution
    side_effects: ["status becomes RECORDED", "one DistributionPayment per eligible Position created in PENDING", "payment_count, total_gross_amount and total_withholding_amount written from the per-payment rounded values"]

  - method: POST
    path: "/distributions/{id}/pay"
    description: "Pays the recorded distribution, reinvesting where the standing instruction says so."
    roles: [FundAccountant]
    code: 200
    input: []
    output: Distribution
    side_effects: ["status becomes PAID", "reinvest_nav_per_share stamped from the ex_date NAV", "every payment becomes PAID", "a settled REINVESTMENT Trade is created per reinvesting payment", "positions, reinvested_shares, cost basis and ShareClass.total_shares_outstanding increase", "household_basis_amount and household Position.current_roa_tier_pct recomputed", "total_cash_amount and total_reinvested_amount written"]

  - method: POST
    path: "/distributions/{id}/reverse"
    description: "Reverses a paid distribution and unwinds every reinvestment it created."
    roles: [ComplianceOfficer]
    code: 200
    input: ["reversal_reason"]
    output: Distribution
    side_effects: ["status becomes REVERSED", "every payment becomes REVERSED", "each REINVESTMENT trade is reversed with a DISTRIBUTION_REVERSAL ledger entry", "positions and ShareClass.total_shares_outstanding return to their pre-payment values", "the four distribution money totals reset to 0.00"]

  - method: GET
    path: "/distribution-payments/{id}"
    description: "Reads one distribution payment."
    roles: [TransferAgentOperator, FundAccountant, ComplianceOfficer, DealerOperations, AccountHolder]
    code: 200
    input: []
    output: DistributionPayment
    side_effects: []

  - method: GET
    path: "/distribution-payments"
    description: "Lists distribution payments filtered by declaration, account, position or reinvestment trade."
    roles: [TransferAgentOperator, FundAccountant, ComplianceOfficer, DealerOperations, AccountHolder]
    code: 200
    input: ["distribution_id?", "account_id?", "position_id?", "reinvestment_trade_id?", "status?", "limit?", "offset?"]
    output: DistributionPayment[]
    side_effects: []

  # --------------------------------------------------------- systematic plans
  - method: POST
    path: "/systematic-plans"
    description: "Creates a systematic plan. A new plan of the same plan_type and source class supersedes the account's prior ACTIVE plan, so the caller must present the account version it last observed."
    roles: [TransferAgentOperator, AccountHolder]
    code: 201
    input: ["account_id", "plan_type", "source_share_class_id", "amount", "frequency", "next_run_date", "target_share_class_id?", "expected_account_version"]
    output: SystematicPlan
    side_effects: ["status initialised to ACTIVE", "any prior ACTIVE plan with the same plan_type and source_share_class_id on this account becomes TERMINATED", "increments ShareholderAccount.version by 1"]

  - method: GET
    path: "/systematic-plans/{id}"
    description: "Reads one systematic plan."
    roles: [TransferAgentOperator, FundAccountant, ComplianceOfficer, DealerOperations, AccountHolder]
    code: 200
    input: []
    output: SystematicPlan
    side_effects: []

  - method: GET
    path: "/systematic-plans"
    description: "Lists systematic plans filtered by account, source class, target class or status."
    roles: [TransferAgentOperator, FundAccountant, ComplianceOfficer, DealerOperations, AccountHolder]
    code: 200
    input: ["account_id?", "source_share_class_id?", "target_share_class_id?", "status?", "plan_type?", "limit?", "offset?"]
    output: SystematicPlan[]
    side_effects: []

  - method: PATCH
    path: "/systematic-plans/{id}"
    description: "Suspends, resumes, terminates or re-sizes a systematic plan."
    roles: [TransferAgentOperator, AccountHolder]
    code: 200
    input: ["status?", "amount?"]
    output: SystematicPlan
    side_effects: ["status transition applied per the SystematicPlan state machine", "suspension_reason set to OPERATOR_REQUEST on suspend and cleared on resume"]

  - method: POST
    path: "/systematic-plans/{id}/execute"
    description: "Runs a due plan, generating the corresponding order in RECEIVED and advancing the next run date."
    roles: [TransferAgentOperator]
    code: 200
    input: []
    output: SystematicPlan
    side_effects: ["a Trade with originating_plan_id set is created for SYSTEMATIC_INVESTMENT (PURCHASE), SYSTEMATIC_WITHDRAWAL (REDEMPTION) or SYSTEMATIC_EXCHANGE (EXCHANGE)", "executed_count incremented, last_run_date stamped, next_run_date advanced by one month for MONTHLY or three months for QUARTERLY with day clamped to the last day of the target month", "for SYSTEMATIC_WITHDRAWAL where the source position market_value_amount is below plan.amount, no trade is created, executed_count and next_run_date are left unchanged, and the plan moves to SUSPENDED with suspension_reason INSUFFICIENT_POSITION_VALUE"]

  # ------------------------------------------------------ pricing error cases
  - method: POST
    path: "/pricing-error-cases"
    description: "Opens a pricing error case against a finalized NAV record. Supersedes any case still open on the same record, so the caller must present the NAV version it last observed."
    roles: [FundAccountant]
    code: 201
    input: ["nav_record_id", "corrected_nav_per_share", "error_reason", "expected_nav_record_version"]
    output: PricingErrorCase
    side_effects: ["status initialised to DETECTED", "original_nav_per_share captured", "detected_by_user_id stamped", "the NavRecord moves FINAL to UNDER_ERROR_REVIEW", "any case on the same record in DETECTED or ASSESSED becomes SUPERSEDED", "increments NavRecord.version by 1"]

  - method: GET
    path: "/pricing-error-cases/{id}"
    description: "Reads one pricing error case."
    roles: [TransferAgentOperator, FundAccountant, ComplianceOfficer]
    code: 200
    input: []
    output: PricingErrorCase
    side_effects: []

  - method: GET
    path: "/pricing-error-cases"
    description: "Lists pricing error cases filtered by NAV record, status or materiality."
    roles: [TransferAgentOperator, FundAccountant, ComplianceOfficer]
    code: 200
    input: ["nav_record_id?", "status?", "materiality?", "limit?", "offset?"]
    output: PricingErrorCase[]
    side_effects: []

  - method: POST
    path: "/pricing-error-cases/{id}/assess"
    description: "Computes the error in basis points and the materiality determination."
    roles: [FundAccountant]
    code: 200
    input: []
    output: PricingErrorCase
    side_effects: ["error_bps and materiality written by calculation pricing_error_materiality", "status becomes ASSESSED"]

  - method: POST
    path: "/pricing-error-cases/{id}/close-immaterial"
    description: "Closes an immaterial case, applying the corrected NAV prospectively only."
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: PricingErrorCase
    side_effects: ["status becomes IMMATERIAL_CLOSED", "approved_by_user_id stamped", "the NavRecord returns to FINAL with original_nav_per_share retained and nav_per_share replaced", "no trade is restated and no position moves"]

  - method: POST
    path: "/pricing-error-cases/{id}/approve-correction"
    description: "Approves a material correction for reprocessing."
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: PricingErrorCase
    side_effects: ["status becomes MATERIAL_APPROVED", "approved_by_user_id stamped"]

  - method: POST
    path: "/pricing-error-cases/{id}/reprocess"
    description: "Runs the reprocessing sweep for an approved material correction. Must be run by a fund accountant other than the one that opened the case."
    roles: [FundAccountant]
    code: 200
    input: []
    output: PricingErrorCase
    side_effects: ["status becomes REPROCESSED and reprocessed_by_user_id stamped", "link 1: the NavRecord becomes CORRECTED with the corrected NAV", "link 2: settled trades priced on that record become RESTATED", "link 3: restatement ledger entries are appended and positions plus ShareClass.total_shares_outstanding move", "link 4: later PRELIMINARY NAV records of the class become STALE_REPRICE_REQUIRED", "link 5: provisionally priced trades against those records fall back to RECEIVED", "restated_trade_count and invalidated_nav_record_count written"]

  # -------------------------------------------------- omnibus reconciliations
  - method: POST
    path: "/omnibus-reconciliations"
    description: "Submits a dealer activity summary and classifies the break against the transfer agent's own settled activity."
    roles: [TransferAgentOperator, DealerOperations]
    code: 201
    input: ["account_id", "as_of_date", "dealer_reported_purchase_amount", "dealer_reported_redemption_amount", "dealer_reported_net_shares"]
    output: OmnibusReconciliation
    side_effects: ["ta_purchase_amount, ta_redemption_amount, ta_net_shares, break_amount and tolerance_amount computed by calculation omnibus_break_classification", "status initialised to MATCHED or BREAK_IDENTIFIED"]

  - method: GET
    path: "/omnibus-reconciliations/{id}"
    description: "Reads one reconciliation."
    roles: [TransferAgentOperator, FundAccountant, ComplianceOfficer, DealerOperations]
    code: 200
    input: []
    output: OmnibusReconciliation
    side_effects: []

  - method: GET
    path: "/omnibus-reconciliations"
    description: "Lists reconciliations filtered by account, status or the trade cited as the adjustment."
    roles: [TransferAgentOperator, FundAccountant, ComplianceOfficer, DealerOperations]
    code: 200
    input: ["account_id?", "adjustment_trade_id?", "status?", "as_of_date?", "limit?", "offset?"]
    output: OmnibusReconciliation[]
    side_effects: []

  - method: POST
    path: "/omnibus-reconciliations/{id}/adjust"
    description: "Closes an identified break by citing the settled as-of trade that corrected the books."
    roles: [ComplianceOfficer]
    code: 200
    input: ["adjustment_trade_id", "resolution_note"]
    output: OmnibusReconciliation
    side_effects: ["status becomes RESOLVED", "adjustment_trade_id and resolution_note stamped"]

  - method: POST
    path: "/omnibus-reconciliations/{id}/dispute"
    description: "Refers an identified break back to the dealer."
    roles: [ComplianceOfficer]
    code: 200
    input: ["dispute_note"]
    output: OmnibusReconciliation
    side_effects: ["status becomes DISPUTED", "dispute_note stamped"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or X-User-Role is not one of the five declared roles"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "The acting role is not listed for the endpoint"
  - id: ERR_ACCOUNT_OWNERSHIP_REQUIRED
    http: 403
    condition: "An AccountHolder touched an account other than the one whose id equals X-User-ID"
  - id: ERR_DEALER_CHANNEL_REQUIRED
    http: 403
    condition: "DealerOperations acted on an account whose account_channel is DIRECT"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The as-of approver equals the order's captured_by_user_id, or the reprocessing accountant equals the case's detected_by_user_id"
  - id: ERR_INVALID_REQUEST
    http: 422
    condition: "Missing required field, unknown enum value, wrong decimal precision or sign, malformed date, or a trade_type / plan_type field combination that does not match the declared shape rules"
  - id: ERR_FUND_NOT_FOUND
    http: 404
    condition: "No Fund with the supplied id"
  - id: ERR_SHARE_CLASS_NOT_FOUND
    http: 404
    condition: "No ShareClass with the supplied id"
  - id: ERR_ACCOUNT_NOT_FOUND
    http: 404
    condition: "No ShareholderAccount with the supplied id"
  - id: ERR_POSITION_NOT_FOUND
    http: 404
    condition: "No Position with the supplied id"
  - id: ERR_NAV_RECORD_NOT_FOUND
    http: 404
    condition: "No NavRecord with the supplied id"
  - id: ERR_TRADE_NOT_FOUND
    http: 404
    condition: "No Trade with the supplied id"
  - id: ERR_DISTRIBUTION_NOT_FOUND
    http: 404
    condition: "No Distribution with the supplied id"
  - id: ERR_PAYMENT_NOT_FOUND
    http: 404
    condition: "No DistributionPayment with the supplied id"
  - id: ERR_PLAN_NOT_FOUND
    http: 404
    condition: "No SystematicPlan with the supplied id"
  - id: ERR_REGISTRATION_NOT_FOUND
    http: 404
    condition: "No BlueSkyRegistration with the supplied id"
  - id: ERR_CASE_NOT_FOUND
    http: 404
    condition: "No PricingErrorCase with the supplied id"
  - id: ERR_RECONCILIATION_NOT_FOUND
    http: 404
    condition: "No OmnibusReconciliation with the supplied id"
  - id: ERR_LEDGER_ENTRY_NOT_FOUND
    http: 404
    condition: "No ShareLedgerEntry with the supplied id"
  - id: ERR_STALE_ACCOUNT_VERSION
    http: 412
    condition: "expected_account_version does not equal the current ShareholderAccount.version"
  - id: ERR_STALE_NAV_RECORD_VERSION
    http: 412
    condition: "expected_nav_record_version does not equal the current NavRecord.version"
  - id: ERR_ACCOUNT_NOT_ACTIVE
    http: 409
    condition: "The referenced account is PENDING_DOCS or CLOSED where the operation requires ACTIVE or RESTRICTED"
  - id: ERR_ACCOUNT_RESTRICTED
    http: 409
    condition: "A RESTRICTED account attempted purchase-side activity"
  - id: ERR_INVALID_TRADE_STATE
    http: 409
    condition: "The trade's execution_status or settlement_status does not permit the requested transition"
  - id: ERR_INVALID_NAV_STATE
    http: 409
    condition: "The NAV record's status does not permit the requested transition"
  - id: ERR_INVALID_CASE_STATE
    http: 409
    condition: "The pricing error case's status does not permit the requested transition, including a materiality determination that contradicts the requested branch"
  - id: ERR_INVALID_DISTRIBUTION_STATE
    http: 409
    condition: "The distribution's status does not permit the requested transition, or the record or pay date has not been reached on the logical clock"
  - id: ERR_INVALID_PLAN_STATE
    http: 409
    condition: "The systematic plan's status does not permit the requested transition"
  - id: ERR_INVALID_RECONCILIATION_STATE
    http: 409
    condition: "The reconciliation is not BREAK_IDENTIFIED where adjust or dispute requires it"
  - id: ERR_LATE_TRADE_PROHIBITED
    http: 422
    condition: "as_of_date equals the current logical clock date while the clock time is at or after the fund cutoff"
  - id: ERR_AS_OF_FUTURE_DATE
    http: 422
    condition: "as_of_date is after the current logical clock date, or falls on a Saturday or Sunday"
  - id: ERR_AS_OF_WINDOW_EXCEEDED
    http: 422
    condition: "More than AS_OF_MAX_BUSINESS_DAYS business days separate as_of_date from the current business date"
  - id: ERR_BLUE_SKY_WINDOW_OVERLAP
    http: 409
    condition: "A new registration's half-open window intersects an existing ACTIVE or EXHAUSTED window for the same class and state"
  - id: ERR_DISTRIBUTION_PERIOD_OVERLAP
    http: 409
    condition: "A new declaration's closed [record_date, pay_date] interval intersects an existing declaration of the same type on the same class"
  - id: ERR_NAV_DATE_DUPLICATE
    http: 409
    condition: "A NavRecord already exists for the (share_class_id, valuation_date) pair"
  - id: ERR_ROA_LINK_INVALID
    http: 422
    condition: "linked_primary_account_id is the account itself, points at an account that is itself linked, or points at an account that is not ACTIVE or RESTRICTED"
  - id: ERR_EXCHANGE_TARGET_INVALID
    http: 422
    condition: "The exchange or systematic-exchange target class equals the source class"
  - id: ERR_RECON_CHANNEL_INVALID
    http: 422
    condition: "Reconciliation was opened against an account whose account_channel is DIRECT"
  - id: ERR_FUND_CLOSED_TO_NEW
    http: 422
    condition: "Purchase-side capture on a class whose fund has status CLOSED_TO_NEW"
  - id: ERR_NAV_NOT_AVAILABLE
    http: 409
    condition: "No NavRecord exists for the class and date the operation must price against"
  - id: ERR_NAV_NOT_FINAL
    http: 409
    condition: "The pricing NAV record is UNDER_ERROR_REVIEW or STALE_REPRICE_REQUIRED, or a distribution payment's ex-date NAV is not FINAL or CORRECTED"
  - id: ERR_BLUE_SKY_NOT_REGISTERED
    http: 422
    condition: "No blue-sky registration covers the class, the account's state and the trade date"
  - id: ERR_BLUE_SKY_CAPACITY_EXCEEDED
    http: 422
    condition: "The purchase-side amount exceeds the selected registration's remaining_amount"
  - id: ERR_INSUFFICIENT_SHARES
    http: 422
    condition: "A redemption or exchange asks for more shares than the position holds"
  - id: ERR_ADJUSTMENT_MISMATCH
    http: 422
    condition: "The cited adjustment trade belongs to another account, carries a different trade date, is not settled, or its booked dollar magnitude differs from abs(break_amount)"
  - id: ERR_PLAN_NOT_DUE
    http: 409
    condition: "Plan execution attempted before plan.next_run_date on the logical clock"

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: TransferAgentOperator
    description: "Transfer agent shareholder-services desk. Owns account opening and lifecycle, order capture, pricing, settlement and systematic plan administration."
    identity: opaque
    exclusive_operations:
      - "POST /shareholder-accounts/{id}/activate"
      - "POST /shareholder-accounts/{id}/close"
      - "POST /trades/{id}/settle"
      - "POST /systematic-plans/{id}/execute"
    shared_operations:
      - "POST /shareholder-accounts (with DealerOperations)"
      - "POST /trades (with ComplianceOfficer, DealerOperations, AccountHolder)"
      - "POST /trades/{id}/price (with FundAccountant)"
      - "POST /trades/{id}/cancel (with ComplianceOfficer)"
      - "POST /systematic-plans and PATCH /systematic-plans/{id} (with AccountHolder)"
      - "PATCH /shareholder-accounts/{id} (with AccountHolder)"
      - "POST /omnibus-reconciliations (with DealerOperations)"
      - "POST /_clock/set_current_utc (with FundAccountant, ComplianceOfficer)"
      - "all GET endpoints"

  - name: FundAccountant
    description: "Fund accounting group. Owns fund and share-class reference data, the daily NAV strike, distribution declarations and pricing error case handling."
    identity: opaque
    exclusive_operations:
      - "POST /funds"
      - "POST /share-classes"
      - "POST /nav-records"
      - "POST /nav-records/{id}/finalize"
      - "POST /nav-records/{id}/repost"
      - "POST /distributions"
      - "POST /distributions/{id}/record"
      - "POST /distributions/{id}/pay"
      - "POST /pricing-error-cases"
      - "POST /pricing-error-cases/{id}/assess"
      - "POST /pricing-error-cases/{id}/reprocess"
    shared_operations:
      - "POST /trades/{id}/price (with TransferAgentOperator)"
      - "POST /_clock/set_current_utc (with TransferAgentOperator, ComplianceOfficer)"
      - "all GET endpoints except the account list"

  - name: ComplianceOfficer
    description: "Compliance and blue-sky desk. Owns state registrations, as-of approvals, account restrictions, material-correction sign-off, trade and distribution reversals, and break disposition."
    identity: opaque
    exclusive_operations:
      - "POST /blue-sky-registrations"
      - "POST /shareholder-accounts/{id}/restrict"
      - "POST /shareholder-accounts/{id}/reinstate"
      - "POST /trades/{id}/approve-as-of"
      - "POST /trades/{id}/reverse"
      - "POST /distributions/{id}/reverse"
      - "POST /pricing-error-cases/{id}/close-immaterial"
      - "POST /pricing-error-cases/{id}/approve-correction"
      - "POST /omnibus-reconciliations/{id}/adjust"
      - "POST /omnibus-reconciliations/{id}/dispute"
    shared_operations:
      - "POST /trades (with TransferAgentOperator, DealerOperations, AccountHolder)"
      - "POST /trades/{id}/cancel (with TransferAgentOperator)"
      - "POST /_clock/set_current_utc (with TransferAgentOperator, FundAccountant)"
      - "all GET endpoints"

  - name: DealerOperations
    description: "Selling dealer back office. May open and trade only on accounts it services, that is accounts whose account_channel is NETWORKED or OMNIBUS, and files the dealer activity summaries that drive reconciliation."
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "POST /shareholder-accounts (with TransferAgentOperator; NETWORKED or OMNIBUS only)"
      - "POST /trades (with TransferAgentOperator, ComplianceOfficer, AccountHolder; NETWORKED or OMNIBUS accounts only)"
      - "POST /omnibus-reconciliations (with TransferAgentOperator)"
      - "GET endpoints other than the share ledger and pricing error cases"

  - name: AccountHolder
    description: "The registered shareholder acting on their own account. X-User-ID is the ShareholderAccount id."
    identity: "entity_backed:ShareholderAccount"
    exclusive_operations: []
    shared_operations:
      - "GET /shareholder-accounts/{id} and GET /shareholder-accounts/{id}/positions for their own account"
      - "PATCH /shareholder-accounts/{id} for their own dividend option and rights-of-accumulation link"
      - "POST /trades on their own account"
      - "POST /systematic-plans and PATCH /systematic-plans/{id} on their own account"
      - "read-only access to funds, share classes, NAV records, trades, distributions and payments"
