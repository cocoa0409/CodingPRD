            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", delivery_tier: "THRESHOLD" }
              as: SalesAssociate
              captures: { ob_id: $.data.id }
            - call: "POST /order-lines"
              payload: { order_id: "${ob_id}", product_id: "${sofa_id}", fabric_code: "STANDARD", size_code: "STD", quantity: 1 }
              as: SalesAssociate
            - call: "POST /orders/${ob_id}/pay-in-full"
              as: SalesAssociate
            - call: "POST /orders/${ob_id}/confirm"
              as: SalesAssociate
          trigger:
            - call: "POST /delivery-stops"
              payload: { route_id: "${route_id}", order_id: "${ob_id}", window_start_minute: 650, window_end_minute: 710, expected_route_version: "${route_v2}" }
              as: DeliveryDispatcher
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response.data.error_id == ERR_STOP_OVERLAP"

      - name: white_glove_buffer_extends_occupancy_into_following_window
        grounds:
          - validations[priority=15]
          - errors[ERR_STOP_OVERLAP]
          - entities.DeliveryStop.fields.service_tier
          - entities.Order.fields.delivery_tier
        distinguishing_aspect: |
          WHITE_GLOVE interval semantics differ: a 30-minute service buffer extends occupancy past
          the window end, so a WHITE_GLOVE stop 600–660 occupies 600–690 and rejects an otherwise
          non-overlapping THRESHOLD stop at 680–740 with ERR_STOP_OVERLAP. Distinct buffer geometry
          from the THRESHOLD instance, on a WHITE_GLOVE-tier order.
        test_recipe:
          setup:
            - "A route with an existing WHITE_GLOVE stop 600–660 (occupies 600–690 incl. 30-min buffer)."
            - "A confirmed THRESHOLD order attempting to book 680–740 (would overlap the buffer)."
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "SOFA-STD", name: "Aspen Sofa", category: "SOFA", base_price_cents: 100000, available_fabrics: [{ code: "STANDARD", surcharge_cents: 0 }], available_sizes: [{ code: "STD", surcharge_cents: 0 }] }
              as: StoreManager
              captures: { sofa_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Pia Buyer", email: "pia@x.com", credit_score: 700, monthly_income_cents: 9000000, existing_monthly_obligations_cents: 0 }
              as: SalesAssociate
              captures: { cust_id: $.data.id }
            - call: "POST /delivery-routes"
              payload: { region_code: "NORTH", service_date: "2026-03-01T00:00:00Z", shift_start_minute: 480, shift_end_minute: 1080, capacity_units: 10 }
              as: DeliveryDispatcher
              captures: { route_id: $.data.id, route_v: $.data.version }
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", delivery_tier: "WHITE_GLOVE" }
              as: SalesAssociate
              captures: { oa_id: $.data.id }
            - call: "POST /order-lines"
              payload: { order_id: "${oa_id}", product_id: "${sofa_id}", fabric_code: "STANDARD", size_code: "STD", quantity: 1 }
              as: SalesAssociate
            - call: "POST /orders/${oa_id}/pay-in-full"
              as: SalesAssociate
            - call: "POST /orders/${oa_id}/confirm"
              as: SalesAssociate
            - call: "POST /delivery-stops"
              payload: { route_id: "${route_id}", order_id: "${oa_id}", window_start_minute: 600, window_end_minute: 660, expected_route_version: "${route_v}" }
              as: DeliveryDispatcher
              captures: { route_v2: $.data.version }
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", delivery_tier: "THRESHOLD" }
              as: SalesAssociate
              captures: { ob_id: $.data.id }
            - call: "POST /order-lines"
              payload: { order_id: "${ob_id}", product_id: "${sofa_id}", fabric_code: "STANDARD", size_code: "STD", quantity: 1 }
              as: SalesAssociate
            - call: "POST /orders/${ob_id}/pay-in-full"
              as: SalesAssociate
            - call: "POST /orders/${ob_id}/confirm"
              as: SalesAssociate
          trigger:
            - call: "POST /delivery-stops"
              payload: { route_id: "${route_id}", order_id: "${ob_id}", window_start_minute: 680, window_end_minute: 740, expected_route_version: "${route_v2}" }
              as: DeliveryDispatcher
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response.data.error_id == ERR_STOP_OVERLAP"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: stop_book_then_cancel_conserves_route_committed_units
        grounds:
          - state_machines.DeliveryStop.BOOKED_to_CANCELLED
          - entities.DeliveryRoute.fields.committed_units
          - entities.DeliveryStop.fields.unit_load
        distinguishing_aspect: |
          Conserved quantity = route.committed_units (capacity load). Booking a stop adds unit_load
          and cancelling it (the compensating action) subtracts the same unit_load, so committed_units
          returns to its pre-booking value (0) with zero drift: invariant committed_units == sum of
          unit_load over BOOKED/DISPATCHED stops.
        test_recipe:
          setup:
            - "An OPEN route capacity 5, committed_units 0; a confirmed order with unit_load 1."
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "SOFA-STD", name: "Aspen Sofa", category: "SOFA", base_price_cents: 100000, available_fabrics: [{ code: "STANDARD", surcharge_cents: 0 }], available_sizes: [{ code: "STD", surcharge_cents: 0 }] }
              as: StoreManager
              captures: { sofa_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Quin Buyer", email: "quin@x.com", credit_score: 700, monthly_income_cents: 9000000, existing_monthly_obligations_cents: 0 }
              as: SalesAssociate
              captures: { cust_id: $.data.id }
            - call: "POST /delivery-routes"
              payload: { region_code: "NORTH", service_date: "2026-03-01T00:00:00Z", shift_start_minute: 480, shift_end_minute: 1080, capacity_units: 5 }
              as: DeliveryDispatcher
              captures: { route_id: $.data.id, route_v: $.data.version }
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", delivery_tier: "THRESHOLD" }
              as: SalesAssociate
              captures: { o_id: $.data.id }
            - call: "POST /order-lines"
              payload: { order_id: "${o_id}", product_id: "${sofa_id}", fabric_code: "STANDARD", size_code: "STD", quantity: 1 }
              as: SalesAssociate
            - call: "POST /orders/${o_id}/pay-in-full"
              as: SalesAssociate
            - call: "POST /orders/${o_id}/confirm"
              as: SalesAssociate
            - call: "POST /delivery-stops"
              payload: { route_id: "${route_id}", order_id: "${o_id}", window_start_minute: 600, window_end_minute: 660, expected_route_version: "${route_v}" }
              as: DeliveryDispatcher
              captures: { stop_id: $.data.id }
          trigger:
            - call: "GET /delivery-routes/${route_id}"
              as: DeliveryDispatcher
              captures: { committed_after_book: $.data.committed_units }
            - call: "POST /delivery-stops/${stop_id}/cancel"
              as: DeliveryDispatcher
            - call: "GET /delivery-routes/${route_id}"
              as: DeliveryDispatcher
              captures: { committed_after_cancel: $.data.committed_units }
          assert:
            - "After booking: DeliveryRoute.${route_id}.committed_units == 1"
            - "After cancel: DeliveryRoute.${route_id}.committed_units == 0"

      - name: financing_approve_then_decline_conserves_open_financing_count
        grounds:
          - state_machines.FinancingPlan.PENDING_APPROVAL_to_CURRENT
          - state_machines.Order.DRAFT_to_CANCELLED
          - entities.Customer.fields.open_financing_count
        distinguishing_aspect: |
          A different conserved quantity = Customer.open_financing_count. Approving a plan increments
          it to 1; cancelling the order (the compensating action) cascades the plan to DECLINED and
          decrements open_financing_count back to 0 — invariant: open_financing_count == count of the
          customer's FinancingPlans in {CURRENT, PAST_DUE}, with zero drift.
        test_recipe:
          setup:
            - "A CONFIRMED order financed by an APPROVED (CURRENT) plan; customer.open_financing_count == 1; no delivery stop booked yet."
          setup_api_calls:
            - call: "POST /products"
              payload: { sku: "SOFA-STD", name: "Aspen Sofa", category: "SOFA", base_price_cents: 100000, available_fabrics: [{ code: "STANDARD", surcharge_cents: 0 }], available_sizes: [{ code: "STD", surcharge_cents: 0 }] }
              as: StoreManager
              captures: { sofa_id: $.data.id }
            - call: "POST /customers"
              payload: { full_name: "Rae Buyer", email: "rae@x.com", credit_score: 760, monthly_income_cents: 9000000, existing_monthly_obligations_cents: 0 }
              as: SalesAssociate
              captures: { cust_id: $.data.id }
            - call: "POST /orders"
              payload: { customer_id: "${cust_id}", delivery_tier: "THRESHOLD" }
              as: SalesAssociate
              captures: { o_id: $.data.id }
            - call: "POST /order-lines"
              payload: { order_id: "${o_id}", product_id: "${sofa_id}", fabric_code: "STANDARD", size_code: "STD", quantity: 1 }
              as: SalesAssociate
            - call: "GET /orders/${o_id}"
              as: SalesAssociate
              captures: { o_v: $.data.version }
            - call: "POST /financing-plans"
              payload: { order_id: "${o_id}", plan_type: "INSTALLMENT", term_months: 12, expected_order_version: "${o_v}" }
              as: SalesAssociate
              captures: { fp_id: $.data.id }
            - call: "POST /financing-plans/${fp_id}/approve"
              as: StoreManager
            - call: "POST /orders/${o_id}/confirm"
              as: SalesAssociate
          trigger:
            - call: "GET /customers/${cust_id}"
              as: SalesAssociate
              captures: { count_after_approve: $.data.open_financing_count }
            - call: "POST /orders/${o_id}/cancel"
              as: SalesAssociate
            - call: "GET /customers/${cust_id}"
              as: SalesAssociate
              captures: { count_after_cancel: $.data.open_financing_count }
          assert:
            - "After approve: Customer.${cust_id}.open_financing_count == 1"
            - "After cancel: Customer.${cust_id}.open_financing_count == 0 AND FinancingPlan.${fp_id}.status == DECLINED"
