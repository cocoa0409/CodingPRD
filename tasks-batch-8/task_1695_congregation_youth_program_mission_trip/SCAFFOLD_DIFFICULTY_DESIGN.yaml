      - name: need_score_weighted_caps_and_state_filtered_siblings
        grounds:
          - calculations.need_score
          - entities.ScholarshipApplication.fields.need_score
        distinguishing_aspect: |
          MODE (a): >=3 inputs with non-linear interaction — per-component caps
          (size bonus min(20, 5*(8-2))=20 not 30), a state-filtered sibling set
          (only APPROVED/CONFIRMED registrations of the same family_key count),
          and a three-way conditional fundraising branch. Applicant P2 scores 90
          (50+20+10+10); control applicant P1 scores 30 (20+0+10+0).
        test_recipe:
          setup:
            - "Two registrations on Trip Alpha sharing family_key fam-1, both APPROVED; P1 (reg1): BAND_C, household_size 2, no fundraising; P2 (reg2): BAND_A, household_size 8, fundraising goal 20000 met by one CASH 20000 donation"
