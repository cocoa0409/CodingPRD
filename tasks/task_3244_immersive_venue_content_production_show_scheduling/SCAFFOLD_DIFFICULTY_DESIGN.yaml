              as: ProductionDirector
            - call: "POST /venue/maintenance-windows/${mw1_id}/fail"
              payload: {}
              as: VenueOpsEngineer
            - call: "POST /venue/maintenance-windows"
              payload: { venue_system_id: "${vs_id}", start_time: "2026-09-01T01:15:00Z", end_time: "2026-09-01T01:45:00Z", buffer_minutes: 15 }
              as: VenueOpsEngineer
              captures: { mw2_id: $.data.id }
            - call: "POST /venue/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T01:30:00Z" }
              as: ProductionDirector
            - call: "POST /venue/maintenance-windows/${mw2_id}/fail"
              payload: {}
              as: VenueOpsEngineer
            - call: "POST /venue/render-batches"
              payload: { dispatch_mode: "STANDARD", asset_ids: ["${fa_id}"] }
              as: ContentProducer
              captures: { fb_id: $.data.id }
            - call: "POST /venue/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T01:50:00Z" }
              as: ProductionDirector
            - call: "POST /venue/render-batches/${fb_id}/dispatch"
              payload: {}
              as: ContentProducer
            - call: "POST /venue/maintenance-windows"
              payload: { venue_system_id: "${vs_id}", start_time: "2026-09-01T02:30:00Z", end_time: "2026-09-01T03:00:00Z", buffer_minutes: 15 }
              as: VenueOpsEngineer
              captures: { mw3_id: $.data.id }
            - call: "POST /venue/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T02:45:00Z" }
              as: ProductionDirector
          trigger:
            - call: "POST /venue/maintenance-windows/${mw3_id}/fail"
              payload: {}
              as: VenueOpsEngineer
          assert:
            - "VenueSystem.${vs_id}.consecutive_failed_windows == 3"
            - "VenueSystem.${vs_id}.status == OFFLINE (cascade hop 1)"
            - "RenderBatch.${fb_id}.status == FAILED (cascade hop 2, via the system transition)"
            - "Asset.${fa_id}.status == QC_FAILED (cascade hop 3, via the batch transition)"

