            - "the DROP_SHIP call returns 201 with OrderInvoice.${inv_pt_id}.margin_pct == 0.1000 and invoice_amount_cents == 900000"
            - "Partner.${p_pt_id}.trailing_revenue_cents == 0 (the new order is PENDING)"

      - name: credit_memo_bounds_are_strict_at_both_ends
        claim_type: violation_error
        grounds:
          - validations[priority=41]
          - validations[priority=40]
          - errors[ERR_CREDIT_EXCEEDS_INVOICE]
          - calculations.channel_margin_conservation
        distinguishing_aspect: "credit_memo_cents must satisfy 0 < c < invoice_amount_cents: both c == 0 and c == the full 900,000 are refused with ERR_CREDIT_EXCEEDS_INVOICE 422, while c == 1,000 is accepted and re-derives margin_pct to 0.1010."
        test_recipe:
          setup:
            - "Clock 2026-03-01T00:00:00.000Z; one REGISTERED RESELLER partner; one DROP_SHIP order of list 1,000,000 priced at margin 0.1000 (invoice 900,000, margin_value 100,000) and INVOICED."
            - "After a 1,000 credit: invoice_amount 899,000, margin_value = 1,000,000 - 899,000 = 101,000, margin_pct = round_half_up(101,000/1,000,000, 4) = 0.1010, still under TIER_MARGIN_CEILING_PCT[REGISTERED] 0.18."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-03-01T00:00:00.000Z" }
              as: ChannelOpsAnalyst
            - call: "POST /partners"
              payload: { company_name: "Aster Systems", partner_type: "RESELLER" }
              as: ChannelOpsAnalyst
              as_user_id: "u_ops_1"
              captures: { p_cm_id: $.data.id }
            - call: "POST /order-invoices"
              payload: { partner_id: "${p_cm_id}", order_type: "DROP_SHIP", list_amount_cents: 1000000 }
              as: ChannelOpsAnalyst
              as_user_id: "u_ops_1"
              captures: { inv_cm_id: $.data.id }
            - call: "POST /order-invoices/${inv_cm_id}/invoice"
              payload: {}
              as: ChannelOpsAnalyst
              as_user_id: "u_ops_1"
          trigger:
            - call: "POST /order-invoices/${inv_cm_id}/credit-memo"
              payload: { credit_memo_cents: 0, credit_reason: "zero credit" }
              as: ChannelOpsAnalyst
              as_user_id: "u_ops_1"
            - call: "POST /order-invoices/${inv_cm_id}/credit-memo"
              payload: { credit_memo_cents: 900000, credit_reason: "whole invoice" }
              as: ChannelOpsAnalyst
              as_user_id: "u_ops_1"
            - call: "POST /order-invoices/${inv_cm_id}/credit-memo"
              payload: { credit_memo_cents: 1000, credit_reason: "ship and debit adjustment" }
              as: ChannelOpsAnalyst
              as_user_id: "u_ops_1"
          assert:
            - "both refused calls return error_id == ERR_CREDIT_EXCEEDS_INVOICE with http_status 422"
            - "after the refusals OrderInvoice.${inv_cm_id}.status == INVOICED, credit_memo_cents == 0, invoice_amount_cents == 900000"
            - "the accepted call gives OrderInvoice.${inv_cm_id}.status == CREDITED, credit_memo_cents == 1000, invoice_amount_cents == 899000, margin_value_cents == 101000, margin_pct == 0.1010"
            - "list_amount_cents is still 1000000 and Partner.${p_cm_id}.trailing_revenue_cents == 899000"

      - name: special_pricing_decision_at_the_expiry_instant_is_rejected
        claim_type: temporal_validation
        grounds:
          - validations[priority=32]
          - errors[ERR_EXCLUSIVITY_WINDOW_EXPIRED]
          - endpoints[POST /special-pricing-requests]
        distinguishing_aspect: "expires_at is MIN(exclusivity_end_at, clock + 30 days), and the decision is refused at exactly that instant - the rule reads 'at or after expires_at', not strictly after."
        test_recipe:
          setup:
            - "Clock 2026-04-01T00:00:00.000Z; one RESELLER partner with one TECH_ASSOCIATE certification; one account; the ANALYTICS_ADDON registration approved at 2026-04-01, so the window is [2026-04-01T00:00:00.000Z, 2026-05-01T00:00:00.000Z)."
            - "At clock 2026-04-02T00:00:00.000Z the partner requests 0.03 extra margin: expires_at = MIN(2026-05-01T00:00:00.000Z, 2026-05-02T00:00:00.000Z) = 2026-05-01T00:00:00.000Z."
            - "The clock is then set to exactly 2026-05-01T00:00:00.000Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-04-01T00:00:00.000Z" }
              as: ChannelOpsAnalyst
            - call: "POST /partners"
              payload: { company_name: "Aster Systems", partner_type: "RESELLER", marketing_commitment_cents: 0 }
              as: ChannelOpsAnalyst
              as_user_id: "u_ops_1"
              captures: { p_sp_id: $.data.id }
            - call: "POST /partners/${p_sp_id}/certifications"
              payload: { engineer_name: "Iva Sorel", track: "TECH_ASSOCIATE", issued_at: "2025-06-01T00:00:00.000Z", expires_at: "2028-06-01T00:00:00.000Z" }
              as: ChannelOpsAnalyst
              as_user_id: "u_ops_1"
            - call: "POST /accounts"
              payload: { account_name: "Granite Health", region_code: "NA" }
              as: ChannelOpsAnalyst
              as_user_id: "u_ops_1"
              captures: { acc_sp2_id: $.data.id }
            - call: "POST /deal-registrations"
              payload: { partner_id: "${p_sp_id}", account_id: "${acc_sp2_id}", product_line: "ANALYTICS_ADDON", expected_amount_cents: 400000, expected_close_date: "2026-08-31T00:00:00.000Z" }
              as: Partner
              as_user_id: "${p_sp_id}"
              captures: { r_sp_id: $.data.id }
            - call: "POST /deal-registrations/${r_sp_id}/submit"
              payload: {}
              as: Partner
              as_user_id: "${p_sp_id}"
            - call: "POST /deal-registrations/${r_sp_id}/review"
              payload: { action: "START_REVIEW" }
              as: ChannelOpsAnalyst
              as_user_id: "u_ops_1"
            - call: "POST /deal-registrations/${r_sp_id}/decision"
              payload: { decision: "APPROVE" }
              as: ChannelDirector
              as_user_id: "u_dir_1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-04-02T00:00:00.000Z" }
              as: ChannelOpsAnalyst
            - call: "GET /deal-registrations/${r_sp_id}"
              payload: {}
              as: ChannelOpsAnalyst
              as_user_id: "u_ops_1"
              captures: { r_sp_v: $.data.version }
            - call: "POST /special-pricing-requests"
              payload: { registration_id: "${r_sp_id}", requested_extra_margin_pct: 0.03, justification: "competitive displacement", expected_registration_version: "${r_sp_v}" }
              as: Partner
              as_user_id: "${p_sp_id}"
              captures: { spr_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-05-01T00:00:00.000Z" }
              as: ChannelOpsAnalyst
          trigger:
            - call: "POST /special-pricing-requests/${spr_id}/decision"
              payload: { decision: "APPROVE" }
              as: ChannelDirector
              as_user_id: "u_dir_1"
          assert:
            - "SpecialPricingRequest.${spr_id}.expires_at == 2026-05-01T00:00:00.000Z (clamped by the exclusivity window, not by the 30-day validity)"
            - "the decision returns error_id == ERR_EXCLUSIVITY_WINDOW_EXPIRED with http_status 409"
            - "SpecialPricingRequest.${spr_id}.status == SUBMITTED, approved_extra_margin_pct == null, decided_by_user_id == null"
            - "DealRegistration.${r_sp_id}.version was incremented once by the special-pricing create and not again by the refused decision"

      - name: existence_outranks_shape_when_account_missing_required_field
        claim_type: priority_ordering
        grounds:
          - validations[priority=3]
          - validations[priority=5]
          - errors[ERR_ACCOUNT_NOT_FOUND]
        distinguishing_aspect: "A create that names a non-existent account AND omits the required expected_amount_cents returns the priority-3 ERR_ACCOUNT_NOT_FOUND 404, not the priority-5 ERR_INVALID_REQUEST."
        test_recipe:
          setup:
            - "Clock 2026-03-01T00:00:00.000Z; one RESELLER partner with one TECH_ASSOCIATE certification; NO account is ever created."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-03-01T00:00:00.000Z" }
              as: ChannelOpsAnalyst
            - call: "POST /partners"
              payload: { company_name: "Aster Systems", partner_type: "RESELLER" }
              as: ChannelOpsAnalyst
              as_user_id: "u_ops_1"
              captures: { p_po_id: $.data.id }
            - call: "POST /partners/${p_po_id}/certifications"
              payload: { engineer_name: "Iva Sorel", track: "TECH_ASSOCIATE", issued_at: "2025-06-01T00:00:00.000Z", expires_at: "2028-06-01T00:00:00.000Z" }
              as: ChannelOpsAnalyst
              as_user_id: "u_ops_1"
          trigger:
            - call: "POST /deal-registrations"
              payload: { partner_id: "${p_po_id}", account_id: "acc_00000000-0000-4000-8000-000000000000", product_line: "ANALYTICS_ADDON", expected_close_date: "2026-08-31T00:00:00.000Z" }
              as: Partner
              as_user_id: "${p_po_id}"
          assert:
            - "the response error_id == ERR_ACCOUNT_NOT_FOUND with http_status 404"
            - "the error envelope carries response_type == error and data.message is a non-empty string"
            - "no DealRegistration row exists for partner ${p_po_id}"

      - name: submit_by_unauthorized_role_returns_4xx_before_not_found
        claim_type: priority_ordering
        grounds:
          - validations[priority=2]
          - validations[priority=3]
          - roles.Partner.exclusive_operations
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: "POST /deal-registrations/{id}/submit is Partner-exclusive, so a ChannelDirector calling it against a completely fabricated id gets the priority-2 ERR_UNAUTHORIZED 403 and never reaches the priority-3 existence check."
        test_recipe:
          setup:
            - "Clock 2026-03-01T00:00:00.000Z; no registration with the fabricated id exists anywhere in the system."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-03-01T00:00:00.000Z" }
              as: ChannelOpsAnalyst
          trigger:
            - call: "POST /deal-registrations/reg_00000000-0000-4000-8000-000000000000/submit"
              payload: {}
              as: ChannelDirector
              as_user_id: "u_dir_1"
          assert:
            - "the response error_id == ERR_UNAUTHORIZED with http_status 403 (not ERR_REGISTRATION_NOT_FOUND 404)"
            - "the error envelope carries data.error_id and data.message and no data payload from the domain"

      - name: duplicate_registration_blocked_on_the_second_submit
        claim_type: violation_error
        grounds:
          - validations[priority=13]
          - errors[ERR_DUPLICATE_REGISTRATION]
        distinguishing_aspect: "The priority-13 rule counts only OTHER registrations of the same (partner, account, product_line) that are in flight, so the first submit succeeds and the second twin is refused with ERR_DUPLICATE_REGISTRATION 409 while the first is merely SUBMITTED - no approval is needed to block it."
        test_recipe:
          setup:
            - "Clock 2026-03-01T00:00:00.000Z; one RESELLER partner with one TECH_ASSOCIATE certification; one account; two DRAFT registrations with the same product_line ANALYTICS_ADDON."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-03-01T00:00:00.000Z" }
              as: ChannelOpsAnalyst
            - call: "POST /partners"
              payload: { company_name: "Aster Systems", partner_type: "RESELLER" }
              as: ChannelOpsAnalyst
              as_user_id: "u_ops_1"
              captures: { p_du_id: $.data.id }
            - call: "POST /partners/${p_du_id}/certifications"
              payload: { engineer_name: "Iva Sorel", track: "TECH_ASSOCIATE", issued_at: "2025-06-01T00:00:00.000Z", expires_at: "2028-06-01T00:00:00.000Z" }
              as: ChannelOpsAnalyst
              as_user_id: "u_ops_1"
            - call: "POST /accounts"
              payload: { account_name: "Granite Health", region_code: "NA" }
              as: ChannelOpsAnalyst
              as_user_id: "u_ops_1"
              captures: { acc_du_id: $.data.id }
            - call: "POST /deal-registrations"
              payload: { partner_id: "${p_du_id}", account_id: "${acc_du_id}", product_line: "ANALYTICS_ADDON", expected_amount_cents: 400000, expected_close_date: "2026-08-31T00:00:00.000Z" }
              as: Partner
              as_user_id: "${p_du_id}"
              captures: { r_du1_id: $.data.id }
            - call: "POST /deal-registrations"
              payload: { partner_id: "${p_du_id}", account_id: "${acc_du_id}", product_line: "ANALYTICS_ADDON", expected_amount_cents: 450000, expected_close_date: "2026-09-30T00:00:00.000Z" }
              as: Partner
              as_user_id: "${p_du_id}"
              captures: { r_du2_id: $.data.id }
          trigger:
            - call: "POST /deal-registrations/${r_du1_id}/submit"
              payload: {}
              as: Partner
              as_user_id: "${p_du_id}"
            - call: "POST /deal-registrations/${r_du2_id}/submit"
              payload: {}
              as: Partner
              as_user_id: "${p_du_id}"
          assert:
            - "DealRegistration.${r_du1_id}.status == SUBMITTED with submitted_at == 2026-03-01T00:00:00.000Z"
            - "the second submit returns error_id == ERR_DUPLICATE_REGISTRATION with http_status 409"
            - "DealRegistration.${r_du2_id}.status == DRAFT with submitted_at == null and revision_round == 0"
            - "Account.${acc_du_id}.coverage_state == OPEN_CHANNEL"

      - name: state_check_outranks_the_temporal_window_check
        claim_type: priority_conflict
        grounds:
          - validations[priority=10]
          - validations[priority=30]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / state_transition_outranks_exclusivity_conflict_on_submit
          rationale: "That instance violates priority 10 and priority 30 with one call and asserts the priority-10 error id."

      - name: compliance_freeze_outranks_the_fiscal_check
        claim_type: priority_conflict
        grounds:
          - validations[priority=21]
          - validations[priority=50]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / audit_remediation_overdue_outranks_mdf_insufficiency_on_claim_create
          rationale: "That instance violates the overdue-remediation freeze and the budget check together and asserts ERR_AUDIT_REMEDIATION_OVERDUE."

      - name: registration_submit_validity_depends_on_account_coverage
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=30]
          - state_machines.Account.terminal_states
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / registration_submit_depends_on_account_direct_locked_state
          rationale: "That instance submits the identical payload against an OPEN_CHANNEL and then a DIRECT_LOCKED account and asserts both outcomes."

      - name: claim_creation_validity_depends_on_allocation_status
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=11]
          - errors[ERR_ALLOCATION_CLOSED]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / mdf_claim_create_depends_on_allocation_closed_state
          rationale: "That instance creates the same claim against an OPEN and then a CLOSED allocation and asserts ERR_ALLOCATION_CLOSED for the second."

      - name: annual_fund_cap_is_an_aggregate_over_intersecting_periods
        claim_type: aggregate_validation
        grounds:
          - validations[priority=51]
          - errors[ERR_MDF_PERIOD_CAPACITY_EXCEEDED]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / mdf_period_capacity_over_inclusive_intersecting_periods
          rationale: "That instance sizes two individually legal allocations whose intersecting sum breaches ANNUAL_MDF_CAP_CENTS and asserts the refusal."

      - name: validation_requires_at_least_one_verified_proof
        claim_type: violation_error
        grounds:
          - validations[priority=42]
          - errors[ERR_NO_VERIFIED_PROOF]
        excluded_because:
          difficulty_instance: boundary_precision_check / zero_verified_proofs_blocks_claim_validation
          rationale: "That instance validates a claim holding one unverified proof and asserts ERR_NO_VERIFIED_PROOF, then verifies and succeeds."

  # =========================================================================
  # Table 5 - Endpoints
  # =========================================================================
  - section: endpoints
    instances:
      - name: direct_pursuit_on_an_open_channel_account_raises_no_conflict
        claim_type: conditional_action
        grounds:
          - endpoints[POST /accounts/{id}/direct-pursuit]
          - state_machines.Account.OPEN_CHANNEL_to_NAMED_DIRECT
          - endpoints[GET /accounts/{id}/conflict-cases]
        distinguishing_aspect: "The same direct-pursuit call branches on coverage_state: from OPEN_CHANNEL it simply moves the account to NAMED_DIRECT and creates NO ConflictCase, whereas from CHANNEL_PROTECTED it would fire CASCADE D."
        test_recipe:
          setup:
            - "Clock 2026-03-01T00:00:00.000Z; one account with no registrations at all, so coverage_state is OPEN_CHANNEL."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-03-01T00:00:00.000Z" }
              as: ChannelOpsAnalyst
            - call: "POST /accounts"
              payload: { account_name: "Granite Health", region_code: "NA" }
              as: ChannelOpsAnalyst
              as_user_id: "u_ops_1"
              captures: { acc_dp_id: $.data.id }
          trigger:
            - call: "POST /accounts/${acc_dp_id}/direct-pursuit"
              payload: { pursuit_note: "greenfield territory" }
              as: DirectSalesRep
              as_user_id: "u_dsr_1"
            - call: "GET /accounts/${acc_dp_id}/conflict-cases"
              payload: {}
              as: ChannelOpsAnalyst
              as_user_id: "u_ops_1"
          assert:
            - "Account.${acc_dp_id}.coverage_state == NAMED_DIRECT with direct_pursuit_owner_id == u_dsr_1 and direct_pursuit_declared_at == 2026-03-01T00:00:00.000Z"
            - "Account.${acc_dp_id}.protected_until, protected_partner_id and protected_product_line are all null"
            - "the nested conflict-case listing returns total_count == 0 and has_more == false"
            - "Account.${acc_dp_id}.version was incremented exactly once"

      - name: order_invoice_listing_filters_by_partner_and_status
        claim_type: cross_reference_link
        grounds:
          - endpoints[GET /order-invoices]
          - complexity_profile.entity_topology
        distinguishing_aspect: "partner_id and status on GET /order-invoices are independent reverse-reachability filters: filtering one partner's INVOICED rows excludes both the other partner's row and the same partner's PENDING row."
        test_recipe:
          setup:
            - "Clock 2026-03-01T00:00:00.000Z; two REGISTERED RESELLER partners."
            - "Partner A has two DROP_SHIP orders of list 1,000,000 (invoice 900,000 each), the first INVOICED and the second left PENDING; partner B has one INVOICED order of list 2,000,000 (prelim_net 1,800,000 -> NONE -> margin 0.1000 -> invoice 1,800,000)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-03-01T00:00:00.000Z" }
              as: ChannelOpsAnalyst
            - call: "POST /partners"
              payload: { company_name: "Aster Systems", partner_type: "RESELLER" }
              as: ChannelOpsAnalyst
              as_user_id: "u_ops_1"
              captures: { p_fa_id: $.data.id }
            - call: "POST /partners"
              payload: { company_name: "Borealis Resale", partner_type: "RESELLER" }
              as: ChannelOpsAnalyst
              as_user_id: "u_ops_1"
              captures: { p_fb_id: $.data.id }
            - call: "POST /order-invoices"
              payload: { partner_id: "${p_fa_id}", order_type: "DROP_SHIP", list_amount_cents: 1000000 }
              as: ChannelOpsAnalyst
              as_user_id: "u_ops_1"
              captures: { inv_fa1_id: $.data.id }
            - call: "POST /order-invoices/${inv_fa1_id}/invoice"
              payload: {}
              as: ChannelOpsAnalyst
              as_user_id: "u_ops_1"
            - call: "POST /order-invoices"
              payload: { partner_id: "${p_fa_id}", order_type: "DROP_SHIP", list_amount_cents: 1000000 }
              as: ChannelOpsAnalyst
              as_user_id: "u_ops_1"
              captures: { inv_fa2_id: $.data.id }
            - call: "POST /order-invoices"
              payload: { partner_id: "${p_fb_id}", order_type: "DROP_SHIP", list_amount_cents: 2000000 }
              as: ChannelOpsAnalyst
              as_user_id: "u_ops_1"
              captures: { inv_fb1_id: $.data.id }
            - call: "POST /order-invoices/${inv_fb1_id}/invoice"
              payload: {}
              as: ChannelOpsAnalyst
              as_user_id: "u_ops_1"
          trigger:
            - call: "GET /order-invoices"
              payload: { partner_id: "${p_fa_id}", status: "INVOICED" }
              as: ChannelOpsAnalyst
              as_user_id: "u_ops_1"
          assert:
            - "the listing returns exactly one row, ${inv_fa1_id}, with total_count == 1 and has_more == false"
            - "${inv_fa2_id} is excluded by the status filter and ${inv_fb1_id} by the partner filter"
            - "the same call with partner_id ${p_fa_id} and no status filter returns total_count == 2"
            - "OrderInvoice.${inv_fb1_id}.invoice_amount_cents == 1800000 and Partner.${p_fb_id}.trailing_revenue_cents == 1800000"

      - name: account_nested_registration_listing_filters_by_product_line
        claim_type: cross_reference_link
        grounds:
          - endpoints[GET /accounts/{id}/deal-registrations]
          - endpoints[POST /deal-registrations]
