              as: Patient
              as_user_id: "${prf}"
              captures: { orderrf: '$.data.id' }
            - call: "POST /catalog/home-kits"
              payload: { order_id: "${orderrf}", shipping_state_code: "CA" }
              as: Patient
              as_user_id: "${prf}"
            - call: "GET /catalog/order-lines?order_id=${orderrf}"
              as: CatalogAdmin
              captures: { olrf: '$.data[0].id' }
            - call: "POST /catalog/order-lines/${olrf}/collect"
              as: PhlebotomyTech
              captures: { specrf: '$.data.id' }
