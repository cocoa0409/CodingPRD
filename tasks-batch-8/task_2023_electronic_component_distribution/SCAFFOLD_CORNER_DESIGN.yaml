      - name: ship_more_than_allocated_rejected
        claim_type: violation_to_error
        grounds: ["errors[ERR_QUANTITY_EXCEEDS_AVAILABLE]", state_machines.OrderLine.ALLOCATED_to_SHIPPED]
        distinguishing_aspect: "Ship qty beyond the allocated remainder (allocated_qty - shipped_qty) fails with ERR_QUANTITY_EXCEEDS_AVAILABLE and moves nothing."
        test_recipe:
          setup: ["Line qty 10 ALLOCATED 5 (supply-constrained); nothing shipped yet"]
          setup_api_calls:
            - call: "POST /manufacturer-lines"
              payload: { line_code: "LIN-OQ", name: "OverQty Line", sourcing_channel: "FRANCHISED" }
