              payload: { amount_cents: 100000, method: "CARD" }
              as: FinancialCounselor
              captures: { dep1: $.data.id }
            - call: "POST /clearance/deposits/${dep1}/post"
              payload: {}
              as: FinancialCounselor
            - call: "POST /clearance/cases/${case_id}/deposits"
              payload: { amount_cents: 50000, method: "CHECK" }
              as: FinancialCounselor
              captures: { dep2: $.data.id }
            - call: "POST /clearance/deposits/${dep2}/post"
              payload: {}
              as: FinancialCounselor
            - call: "GET /clearance/cases/${case_id}"
              as: FinancialCounselor
              captures: { ledger_mid: $.data.deposit_posted_cents }
            - call: "POST /clearance/deposits/${dep1}/refund"
              payload: {}
              as: ClearanceSupervisor
              captures: { dep1_refund: $.data.refund_amount_cents }
            - call: "GET /clearance/cases/${case_id}"
              as: FinancialCounselor
              captures: { ledger_after: $.data.deposit_posted_cents }
          assert:
            - "ledger_before == 0"
            - "after posting 100000 and 50000: case.deposit_posted_cents == 150000 == sum of POSTED deposit amounts"
            - "refund of Deposit.${dep1}: refund_amount_cents == 100000 (>= 2 business days -> 100%)"
            - "after refund: case.deposit_posted_cents == 50000 == ledger_before + 50000 (post+refund pair left the ledger changed only by the surviving deposit; no drift)"
            - "Deposit.${dep1}.status == REFUNDED, Deposit.${dep2}.status == POSTED"

      - name: estimate_supersede_active_cardinality_conservation
        grounds:
          - state_machines.Estimate.DRAFT_to_SUPERSEDED
          - entities.FinancialClearanceCase.fields.active_estimate_id
        distinguishing_aspect: |
          Conserved quantity: active-estimate cardinality — exactly one estimate
          per case outside {SUPERSEDED, CANCELLED, EXPIRED} after every
          create (forward) + supersede (compensating) pair; three consecutive
          creates leave the count at 1, not 3. Different conserved quantity
          than the sibling (a count of live rows, not cents).
        test_recipe:
          setup:
            - "INS-A fixture: charge 27447; contract ACME rate 3000000; patient with snapshot; case service 2026-08-20, no estimates yet"
          setup_api_calls:
            - call: "POST /clearance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T09:00:00Z" }
              as: SystemAdmin
            - call: "POST /clearance/charge-items"
              payload: { cpt_code: "27447", description: "Total knee arthroplasty", list_price_cents: 5000000, requires_auth_prior: false }
              as: SystemAdmin
            - call: "POST /clearance/payer-contracts"
              payload: { payer_code: "ACME", payer_name: "Acme Health", bundling_rule: "MULTIPLE_PROCEDURE_REDUCTION", reduction_pct: 50 }
              as: SystemAdmin
              captures: { pc_id: $.data.id }
            - call: "POST /clearance/payer-contracts/${pc_id}/rates"
              payload: { cpt_code: "27447", rate_cents: 3000000, effective_from: "2026-01-01" }
              as: SystemAdmin
            - call: "POST /clearance/patients"
              payload: { mrn: "MRN-S-1", full_name: "Pat Supersede", date_of_birth: "1986-07-19" }
              as: Registrar
              captures: { pat_id: $.data.id, pat_v: $.data.version }
            - call: "POST /clearance/patients/${pat_id}/eligibility-snapshots"
              payload: { expected_patient_version: "${pat_v}", payer_code: "ACME", member_id: "M-S", deductible_total_cents: 150000, deductible_met_cents: 50000, oop_max_cents: 600000, oop_met_cents: 100000, coinsurance_pct: 20 }
              as: Registrar
              captures: { snap_id: $.data.id }
            - call: "POST /clearance/patients/${pat_id}/cases"
              payload: { service_date: "2026-08-20", service_description: "Knee replacement" }
              as: Registrar
              captures: { case_id: $.data.id, case_v1: $.data.version }
          trigger:
            - call: "POST /clearance/cases/${case_id}/estimates"
              payload: { expected_case_version: "${case_v1}", pricing_mode: "INSURED", eligibility_snapshot_id: "${snap_id}", lines: [{ cpt_code: "27447", quantity: 1 }] }
              as: FinancialCounselor
              captures: { est1: $.data.id, est1_rev: $.data.revision }
            - call: "GET /clearance/cases/${case_id}"
              as: FinancialCounselor
              captures: { case_v2: $.data.version }
            - call: "POST /clearance/cases/${case_id}/estimates"
              payload: { expected_case_version: "${case_v2}", pricing_mode: "INSURED", eligibility_snapshot_id: "${snap_id}", lines: [{ cpt_code: "27447", quantity: 1 }] }
              as: FinancialCounselor
              captures: { est2: $.data.id, est2_rev: $.data.revision }
            - call: "GET /clearance/cases/${case_id}"
              as: FinancialCounselor
              captures: { case_v3: $.data.version }
            - call: "POST /clearance/cases/${case_id}/estimates"
              payload: { expected_case_version: "${case_v3}", pricing_mode: "INSURED", eligibility_snapshot_id: "${snap_id}", lines: [{ cpt_code: "27447", quantity: 1 }] }
              as: FinancialCounselor
              captures: { est3: $.data.id, est3_rev: $.data.revision }
            - call: "GET /clearance/cases/${case_id}/estimates"
              as: FinancialCounselor
          assert:
            - "revisions are 1, 2, 3 in creation order (${est1_rev} == 1, ${est2_rev} == 2, ${est3_rev} == 3)"
            - "Estimate.${est1}.status == SUPERSEDED and Estimate.${est2}.status == SUPERSEDED; Estimate.${est3}.status == DRAFT"
            - "exactly 1 of the case's 3 estimates is outside {SUPERSEDED, CANCELLED, EXPIRED} — cardinality conserved at 1 across each create+supersede pair"
            - "Case.${case_id}.active_estimate_id == ${est3}"
