        claim_type: RBAC denial
        grounds:
          - roles.ProgramAdmin
          - roles.ClaimsAdjuster
        distinguishing_aspect: "ProgramAdmin (peer operational role) cannot adjudicate warranty claims — adjudication is ClaimsAdjuster-exclusive."
        test_recipe:
          setup:
