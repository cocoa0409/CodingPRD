              as: RecordsCustodian
              captures: { demo_total: $.data.total_complaints, demo_sustained: $.data.sustained_complaints, demo_rate: $.data.sustain_rate_pct, demo_min_cell: $.data.suppression_min_cell }
            - call: "GET /reports/complaint-outcomes"
