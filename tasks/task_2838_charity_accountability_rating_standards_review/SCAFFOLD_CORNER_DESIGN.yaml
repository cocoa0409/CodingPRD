      - name: the_transition_sweep_expires_grace_strictly_after_the_deadline
        claim_type: Action endpoint
        grounds:
          - endpoints.POST_/ops/transition-sweep
          - endpoints.GET_/transition-grants
          - endpoints.GET_/transition-grants/{transition_grant_id}
          - endpoints.POST_/rating-cycles
          - entities.TransitionGrant.fields.status
          - entities.Organization.fields.transition_grace_until
          - validations[priority=13]
          - errors.ERR_TRANSITION_GRACE_UNAVAILABLE
        distinguishing_aspect: |
          The sweep is the only way EXPIRED is reachable, and its condition is
          strict - grace_until < clock - while the priority-13 admission test is
          inclusive - grace_until >= clock. The two must therefore agree exactly on
          the deadline instant: a sweep run at exactly grace_until must expire
          nothing, and a cycle opened at exactly grace_until must still be admitted.
          This instance runs the sweep three times against the same grant - before
          the deadline, at the deadline and one second past it - and then checks the
          business consequence, which is that the same POST /rating-cycles the grant
          used to license is now refused. It also pins the two roll-up side effects
          the endpoint declares: the grant's own version increments once, and the
          organization's transition_grace_until is cleared only because no ACTIVE
          grant remains.
        test_recipe:
          setup:
            - call: "POST /methodology-versions"
              payload: { version_label: "M1", weight_financial_health: 0.40, weight_accountability: 0.25, weight_transparency: 0.20, weight_impact: 0.15, dimension_floor_score: 40.0 }
              as: MethodologyAdmin
              as_user_id: "admin-1"
              captures: { m1: $.data.id }
            - call: "POST /methodology-versions/${m1}/open-comment"
              payload: {}
