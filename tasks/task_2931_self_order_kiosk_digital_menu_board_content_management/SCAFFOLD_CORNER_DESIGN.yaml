              captures: { offline_count_2: $.data.offline_order_count }
            - call: "GET /kiosk-ops/order-handoffs/${order_id}"
              payload: {}
              as: StoreOperator
              as_user_id: "${store_id}"
              captures: { handoff2: $.data.handoff_state, pay2: $.data.payment_state }
          assert:
            - "${handoff0} == CACHED_OFFLINE with ${pay0} == AUTHORIZED and ${num0} == S001-0001 — an offline capture still consumes an order number"
            - "${offline_count_1} == 1 and ${handoff1} == CACHED_OFFLINE — a sync without the flag re-caches content only"
            - "${offline_count_2} == 0 and ${handoff2} == QUEUED_TO_KITCHEN after the flag is set"
            - "${pay2} == AUTHORIZED — the flush moves only the handoff dimension; capture still waits for KITCHEN_ACK"
            - "StoreItemAvailability.${avail_id}.reserved_units == 1 across both syncs: the flush is not a re-reservation"

      - name: upsell_rule_link_requires_both_referenced_menu_items_to_exist
        claim_type: cross_reference_link
        grounds:
          - endpoints.POST_/kiosk-ops/upsell-rules
          - validations.priority_6_ERR_REFERENCED_ENTITY_NOT_FOUND
          - entities.UpsellRule.fields.suggested_item_id
        distinguishing_aspect: "The junction row needs all three references resolvable: an unknown suggested_item_id returns ERR_REFERENCED_ENTITY_NOT_FOUND (404) even though the cluster and trigger item exist, and the valid link is then discoverable from either side via the suggested_item_id and trigger_item_id filters."
        test_recipe:
          setup:
            - "Clock 2026-08-05T17:00:00Z; cluster CL_WEST, Item A (ENTREE) and Item B (SIDE) exist."
          setup_api_calls:
            - call: "POST /kiosk-ops/_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T17:00:00Z" }
              as: PlatformAdmin
