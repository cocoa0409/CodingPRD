            - "${err} == ERR_INVALID_CLAIM_STATE"
            - "VictimClaim.${claim_id}.state == SUBMITTED"
            - "VictimClaim.${claim_id}.evidence_round == 0"
            - "VictimClaim.${claim_id}.packaging_photo_ref == null — the rejected call stored nothing"
