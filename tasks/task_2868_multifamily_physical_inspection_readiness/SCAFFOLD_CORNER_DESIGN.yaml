          - entities.Inspection.fields.final_score
          - entities.Inspection.fields.inside_area_points
        distinguishing_aspect: |
          A single INSIDE deduction of 4.80 gives area scores 100.00 / 95.20 / 100.00 and weighted
          products 50.00 / 28.56 / 20.00, summing to 98.56 which must be published as 98.6 - the
          rounding happens once at the end to one decimal, after the 2-decimal per-area products.
          Truncation yields 98.5 and rounding each product to one decimal first yields 98.7.
