      - name: enrollment_finalize_from_already_quoted_invalid
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Enrollment.READY_TO_QUOTE_to_QUOTED
          - "errors[ERR_ENROLLMENT_NOT_SCORING]"
        distinguishing_aspect: "finalize-scoring on a QUOTED enrollment (already terminal for that path) -> ERR_ENROLLMENT_NOT_SCORING (409); no provisional recompute."
        test_recipe:
          setup: ["Enrollment finalized and quoted (status QUOTED)"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: UnderwritingOps
            - call: "POST /rate-plans"
              payload: { name: "CA UBI", state_code: "CA", base_premium_cents: 200000, per_mile_rate_cents: 0.5, included_miles_per_period: 1000, hard_brake_weight: 2.0, speeding_weight: 1.5, phone_use_weight: 1.0 }
              as: UnderwritingOps
              captures: { rp_id: $.data.id }
            - call: "POST /drivers"
              payload: { email: "c1@x.com", full_name: "C One", state_code: "CA" }
              as: DriverUser
              captures: { d_id: $.data.id }
            - call: "POST /enrollments"
              payload: { driver_id: "${d_id}", rate_plan_id: "${rp_id}", scoring_days: 30 }
              as: DriverUser
              as_user_id: "${d_id}"
              captures: { e_id: $.data.id }
            - call: "POST /trips"
              payload: { enrollment_id: "${e_id}", started_at: "2026-02-01T01:00:00Z", ended_at: "2026-02-01T01:10:00Z", distance_miles: 4.0 }
              as: DriverUser
              as_user_id: "${d_id}"
              captures: { et1: $.data.id }
            - call: "POST /trips/${et1}/accept"
              payload: {}
              as: DriverUser
              as_user_id: "${d_id}"
            - call: "POST /trips"
              payload: { enrollment_id: "${e_id}", started_at: "2026-02-01T02:00:00Z", ended_at: "2026-02-01T02:10:00Z", distance_miles: 4.0 }
              as: DriverUser
              as_user_id: "${d_id}"
              captures: { et2: $.data.id }
            - call: "POST /trips/${et2}/accept"
              payload: {}
              as: DriverUser
              as_user_id: "${d_id}"
            - call: "POST /trips"
              payload: { enrollment_id: "${e_id}", started_at: "2026-02-01T03:00:00Z", ended_at: "2026-02-01T03:10:00Z", distance_miles: 4.0 }
              as: DriverUser
              as_user_id: "${d_id}"
              captures: { et3: $.data.id }
            - call: "POST /trips/${et3}/accept"
              payload: {}
              as: DriverUser
              as_user_id: "${d_id}"
            - call: "POST /enrollments/${e_id}/finalize-scoring"
              payload: {}
              as: DriverUser
              as_user_id: "${d_id}"
            - call: "POST /quotes"
              payload: { enrollment_id: "${e_id}" }
              as: UnderwritingOps
          trigger:
            - call: "POST /enrollments/${e_id}/finalize-scoring"
              payload: {}
              as: DriverUser
              as_user_id: "${d_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_ENROLLMENT_NOT_SCORING"
            - "http status == 409"

      - name: enrollment_initial_state_is_scoring
        claim_type: Initial State
        grounds:
          - state_machines.Enrollment
          - entities.Enrollment.fields.status
        distinguishing_aspect: "A newly created enrollment starts in SCORING with captured_trip_count 0 and provisional_risk_score 0."
        test_recipe:
          setup: ["Rate plan and driver created"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: UnderwritingOps
            - call: "POST /rate-plans"
