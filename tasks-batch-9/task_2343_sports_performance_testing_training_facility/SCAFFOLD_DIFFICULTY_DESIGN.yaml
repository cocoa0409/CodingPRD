  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: package_credit_ledger_conserved_across_reserve_deplete_refund_and_consume
        grounds:
          - entities.MembershipPackage.fields.sessions_remaining
          - entities.MembershipPackage.fields.sessions_reserved
          - entities.MembershipPackage.fields.sessions_consumed
          - entities.MembershipPackage.fields.sessions_forfeited
          - state_machines.MembershipPackage.status.ACTIVE_to_DEPLETED
          - state_machines.MembershipPackage.status.DEPLETED_to_ACTIVE
        distinguishing_aspect: |
          Conserved quantity: session credits on a MembershipPackage. The identity
          sessions_purchased == remaining + reserved + consumed + forfeited must hold after
          every hop of reserve -> reserve -> DEPLETED -> refund -> ACTIVE -> attend, so the
          refund of a cancelled reservation and the consumption of an attended one move
          credits between buckets without ever creating or destroying one.
        test_recipe:
          setup:
            - "One StaffMember acting as Coach, credential_status COMPLIANT (insurance to 2027-12-31 plus one VALID CPR_AED certification)."
            - "One CLEARED, ACTIVE athlete born 2010-01-15."
            - "A two-session MembershipPackage, price 24000 cents, expires_on 2026-12-31 (purchased 2, remaining 2, reserved 0, consumed 0, forfeited 0)."
            - "GroupSessions SA (2026-08-10T10:00Z-11:00Z) and SB (2026-08-11T10:00Z-11:00Z), both ONSITE, station_count 3, max_athletes 10, GENERAL_PREP, one compliant coach each."
            - "PACKAGE_ONLY enrollments on SA and then SB take the package to remaining 0 / reserved 2 / DEPLETED; cancelling the SB enrollment while the clock is still 2026-08-01 (well outside the 24-hour window) returns it to remaining 1 / reserved 1 / ACTIVE."
            - "SA's roster is locked, then the clock is moved to 2026-08-10T10:00:00Z and SA is started."
          setup_api_calls:
            - call: "POST /staff-members"
              payload: { full_name: "Cass Mwangi", role_title: "PERFORMANCE_COACH", liability_insurance_expires_on: "2027-12-31" }
              as: PerformanceDirector
