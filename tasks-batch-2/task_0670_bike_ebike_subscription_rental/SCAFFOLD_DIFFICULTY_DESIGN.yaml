              as: Anonymous
              captures: { a1: $.data.id }
            - call: "POST /accounts"
              payload: { account_type: "SUBSCRIBER", display_name: "A2", email: "a2@x.com", rental_cap: 1 }
              as: Anonymous
              captures: { a2: $.data.id }
