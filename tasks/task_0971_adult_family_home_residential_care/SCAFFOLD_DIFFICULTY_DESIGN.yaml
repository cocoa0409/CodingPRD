              captures: { census_end: $.data.current_census }
          assert:
            - "Bed.${bed_id}.status == AVAILABLE (compensation restored pre-action status)"
            - "Home.${home_id}.current_census == 0 (identical before create and after cancel)"
            - "count of beds across statuses still == 1 (no bed created or destroyed)"
            - "Admission.${adm_id}.status == CANCELLED"

      - name: partial_payments_conserve_invoice_total
        grounds:
          - state_machines.Invoice.ISSUED_to_PARTIALLY_PAID
          - state_machines.Invoice.PARTIALLY_PAID_to_PAID
          - validations[priority=18]
        distinguishing_aspect: |
          Conserved quantity: money — sum(Payment.amount_cents) + outstanding_balance ==
          Invoice.total_cents at every step. A partial payment (100000) then the exact remainder
          (57500) lands the invoice PAID with sum == total 157500; an overpay attempt of 57501
          in between is rejected without disturbing the invariant.
        test_recipe:
          setup:
            - "Licensed home, ADMITTED resident, PRIVATE_PAY schedule; invoice for [2026-06-01, 2026-06-11) subtotal 150000, due 2026-06-20, issued when clock is 2026-06-21 (late fee 7500 -> total 157500)"
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-20T00:00:00Z" }
              as: Provider
            - call: "POST /api/homes"
              payload: { license_number: "AFH-9002", name: "Ocean AFH", licensed_bed_capacity: 4 }
              as: Provider
              captures: { home_id: $.data.id }
            - call: "POST /api/homes/${home_id}/beds"
              payload: { label: "1A" }
              as: Provider
              captures: { bed_id: $.data.id, bed_v: $.data.version }
            - call: "POST /api/homes/${home_id}/caregivers"
              payload: { full_name: "Cg Ocean", credential_id: "HCA-1001" }
              as: Provider
            - call: "POST /api/homes/${home_id}/license"
              payload: {}
              as: Provider
            - call: "POST /api/homes/${home_id}/rate-schedules"
              payload: { payer_type: "PRIVATE_PAY", room_and_board_daily_cents: 12000, care_low_daily_cents: 3000, care_medium_daily_cents: 6000, care_high_daily_cents: 9000, effective_from: "2026-06-01" }
              as: Provider
            - call: "POST /api/homes/${home_id}/residents"
              payload: { full_name: "Res Pay", date_of_birth: "1938-08-08", payer_type: "PRIVATE_PAY" }
              as: Nurse
              captures: { res_id: $.data.id }
            - call: "POST /api/residents/${res_id}/assessments"
              payload: { nursing_hours_per_week: 4, adl_dependency_score: 2, care_plan: { diet: "REGULAR" } }
              as: Nurse
              captures: { asm_id: $.data.id }
            - call: "POST /api/assessments/${asm_id}/finalize"
              payload: {}
              as: Nurse
            - call: "POST /api/admissions"
              payload: { resident_id: "${res_id}", bed_id: "${bed_id}", assessment_id: "${asm_id}", expected_admission_date: "2026-06-01", expected_bed_version: "${bed_v}" }
              as: Provider
              as_user_id: "prov-1"
              captures: { adm_id: $.data.id }
            - call: "POST /api/admissions/${adm_id}/approve"
              payload: {}
              as: Provider
              as_user_id: "prov-2"
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T14:00:00Z" }
              as: Provider
            - call: "POST /api/admissions/${adm_id}/complete"
              payload: {}
              as: Provider
              as_user_id: "prov-2"
            - call: "GET /api/residents/${res_id}"
              payload: {}
              as: Provider
              captures: { res_v: $.data.version }
            - call: "POST /api/residents/${res_id}/invoices/generate"
              payload: { period_start: "2026-06-01", period_end: "2026-06-11", due_date: "2026-06-20", expected_resident_version: "${res_v}" }
              as: Provider
              captures: { inv_id: $.data.id }
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-21T00:00:00Z" }
              as: Provider
            - call: "POST /api/invoices/${inv_id}/issue"
              payload: {}
              as: Provider
            - call: "POST /api/payments"
              payload: { resident_id: "${res_id}", invoice_id: "${inv_id}", amount_cents: 100000, method: "CHECK" }
              as: Provider
            - call: "POST /api/payments"
              payload: { resident_id: "${res_id}", invoice_id: "${inv_id}", amount_cents: 57501, method: "CHECK" }
              as: Provider
              captures: { err_over: $.data.error_id }
          trigger:
            - call: "POST /api/payments"
              payload: { resident_id: "${res_id}", invoice_id: "${inv_id}", amount_cents: 57500, method: "ACH" }
              as: Provider
            - call: "GET /api/invoices/${inv_id}"
              payload: {}
              as: Provider
              captures: { inv_final_status: $.data.status }
          assert:
            - "err_over == ERR_OVERPAYMENT (57501 exceeds outstanding 57500)"
            - "Invoice.${inv_id}.late_fee_cents == 7500 and total_cents == 157500"
            - "sum(Payment.amount_cents for invoice ${inv_id}) == 157500 == total_cents (invariant holds)"
            - "inv_final_status == PAID"
