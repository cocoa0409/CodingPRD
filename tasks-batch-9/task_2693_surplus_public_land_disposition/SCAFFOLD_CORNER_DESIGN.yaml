      - name: parcel_disposition_ready_recomputes_after_title_item_resolve
        claim_type: derived_field_reconciliation
        grounds:
          - calculations.parcel_disposition_readiness
          - entities.Parcel.fields.disposition_ready
          - entities.Parcel.fields.open_title_item_count
        distinguishing_aspect: "disposition_ready is re-derived from three independent inputs at every touch, not latched once: it is false at create (valuation UNVALUED, 0 open items), still false after the appraisal is ACCEPTED because one title item is OPEN, and only flips true when that item resolves CURED - open_title_item_count moving 0 to 1 to 0 across the same sequence."
        test_recipe:
          setup:
            - "One Agency and one Parcel; one Appraiser with an ACTIVE licence."
            - "One LIEN TitleCurativeItem created on the parcel and left OPEN until the final step."
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "City of Riverbend", agency_type: "MUNICIPAL", contact_email: "realproperty@riverbend.gov" }
              as: SystemAdministrator
              captures: { cust_agency_id: "$.data.id" }
            - call: "POST /parcels"
              payload: { apn: "APN-2693-185", address: "9 Canal Street", acreage: 3.1, zoning_code: "M-1", book_value_cents: 70000000, custodian_agency_id: "${cust_agency_id}" }
              as: RealPropertyOfficer
              captures: { parcel_id: "$.data.id" }
            - call: "POST /appraisers"
              payload: { name: "Dana Kirkwood MAI", license_number: "AG-44285", license_expires_on: "2028-01-01T00:00:00Z" }
              as: SystemAdministrator
              captures: { appraiser_id: "$.data.id" }
          trigger:
            - call: "POST /parcels/${parcel_id}/title-items"
              payload: { item_type: "LIEN", description: "Recorded mechanics lien from 2019 sidewalk work", cure_cost_estimate_cents: 400000 }
              as: RealPropertyOfficer
              captures: { lien_item_id: "$.data.id" }
            - call: "GET /parcels/${parcel_id}"
              payload: {}
              as: RealPropertyOfficer
              captures: { parcel_v2: "$.data.version" }
            - call: "POST /appraisals"
              payload: { parcel_id: "${parcel_id}", appraiser_id: "${appraiser_id}", method: "SALES_COMPARISON", engagement_start_on: "2026-08-02T00:00:00Z", engagement_end_on: "2026-08-20T00:00:00Z", expected_parcel_version: "${parcel_v2}" }
              as: RealPropertyOfficer
              captures: { appraisal_id: "$.data.id" }
            - call: "POST /appraisals/${appraisal_id}/report"
              payload: { appraised_value_cents: 100000000, effective_date: "2026-08-01T00:00:00Z", narrative: "Sales comparison of four infill sales." }
              as: Appraiser
              as_user_id: "${appraiser_id}"
            - call: "POST /appraisals/${appraisal_id}/accept"
              payload: {}
              as: RealPropertyOfficer
            - call: "POST /title-items/${lien_item_id}/resolve"
              payload: { resolution: "CURED", actual_cure_cost_cents: 250000 }
              as: RealPropertyOfficer
          assert:
            - "at create the parcel had ownership_status AGENCY_OWNED, valuation_status UNVALUED, open_title_item_count 0 and disposition_ready false"
            - "after the title item is created Parcel.${parcel_id}.open_title_item_count == 1 and disposition_ready is still false"
            - "after the appraisal is accepted Parcel.${parcel_id}.valuation_status == CURRENT while disposition_ready is STILL false, because one title item is OPEN"
            - "the resolve response is HTTP 200 with data.status == CURED and data.actual_cure_cost_cents == 250000"
            - "after the resolve Parcel.${parcel_id}.open_title_item_count == 0 and disposition_ready == true"
            - "GET /parcels filtered by disposition_ready true returns total_count == 1 containing ${parcel_id}"

