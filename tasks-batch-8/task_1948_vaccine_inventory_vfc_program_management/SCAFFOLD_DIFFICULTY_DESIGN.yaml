              captures: { ord_line: $.data.id }
            - call: "POST /provider-sites/${site_s}/vaccine-orders/${ord}/submit"
              payload: {}
              as: VaccineManager
            - call: "GET /provider-sites/${site_s}"
              payload: {}
              as: VaccineManager
              captures: { site_v: $.data.version }
            - call: "POST /provider-sites/${site_s}/vaccine-orders/${ord}/approve"
              payload: { approved_vfc_doses: 10, expected_provider_site_version: "${site_v}" }
              as: StateProgramOfficer
            - call: "POST /provider-sites/${site_s}/vaccine-orders/${ord}/allocation-receipts"
              payload: { order_line_id: "${ord_line}", storage_unit_id: "${unit_u}", lot_number: "LOT-PUB", expires_on: "2027-06-30", quantity_doses: 10 }
              as: VaccineManager
