      - "see state_machines.Appeal for all four outcome branches, including the four-hop OVERTURNED cascade"
    errors: [ERR_UNAUTHENTICATED, ERR_ROLE_NOT_PERMITTED, ERR_INVALID_REQUEST, ERR_APPEAL_NOT_FOUND, ERR_APPEAL_STATE_INVALID, ERR_CASE_PATHWAY_NOT_SET, ERR_APPEAL_GROUNDS_MISMATCH, ERR_REDUCED_RANK_INVALID, ERR_REMAND_LIMIT_REACHED]

# ============================================================================
# §1.6 ERROR CATALOG (72 codes)
# Every code below is reachable from at least one endpoint in §1.5.
# ============================================================================
errors:
  - error_id: ERR_UNAUTHENTICATED
    http_status: 401
    category: auth
    trigger: "X-User-Role or X-User-ID is absent, empty, whitespace-only, names an unknown role, or names an actor that does not resolve to a row of the role's backing entity"
  - error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    category: role
    trigger: "the acting role is not in the endpoint's roles set"
  - error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    category: ownership
    trigger: "the acting X-User-ID is not the report's reporter, the case's student, the session's chair or the meeting's instructor as the endpoint requires"
  - error_id: ERR_INVALID_REQUEST
    http_status: 400
    category: request_shape
    trigger: "missing or null required field, wrong JSON type, out-of-set enum, length or regex violation, out-of-range integer, more than 2 decimal places, unknown field, or a conditionally required/forbidden field in the wrong presence state"
  - error_id: ERR_INVALID_PAGINATION
    http_status: 400
    category: pagination
    trigger: "limit outside 1..100, offset < 0, or either value not an integer"
  - error_id: ERR_DEPARTMENT_NOT_FOUND
