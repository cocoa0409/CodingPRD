        distinguishing_aspect: "Abandoning a plan fans out to its consultations conditionally: the round-1 consultation that the controlling class already answered with OBJECTED is left byte-for-byte alone, while only the round-2 consultation still in PENDING becomes WAIVED. The cascade is also blocked in the other direction — the WAIVED side effect's 'subject plan advances to CONSENT_SATISFIED' clause must not resurrect the plan that is itself entering a terminal state."
