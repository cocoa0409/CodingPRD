            - call: "POST /convention-center/holds/${hold_id}/confirm-first-option"
              payload: {}
              as: SalesManager
            - call: "POST /convention-center/bookings/${bk_id}/license"
              payload: {}
              as: SalesManager
              captures: { lic_id: $.data.id }
            - call: "POST /convention-center/licenses/${lic_id}/issue"
              payload: {}
              as: SalesManager
            - call: "POST /convention-center/licenses/${lic_id}/countersign"
              payload: {}
              as: Licensee
