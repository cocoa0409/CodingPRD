  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: topic_submit_review_gated_by_release_train_posture
        grounds:
          - validations[priority=25]
          - calculations.release_train_doc_readiness
          - state_machines.ReleaseTrain.PLANNED_to_DOC_FREEZE
          - entities.ReleaseTrain.fields.doc_readiness_posture
          - entities.DocPlanItem.fields.audience_tier
        distinguishing_aspect: |
          The gate lives TWO entities away from the write: submitting a Topic for review depends
          on the ReleaseTrain's doc_readiness_posture, which is itself derived from the approval
          states of ALL the train's plan items. The same endpoint therefore succeeds and fails
          for the same actor depending on a sibling topic's approval, and the RESTRICTED band
          admits only CRITICAL-audience items — so the gate is three-valued (OPEN / RESTRICTED
          with an audience escape hatch / FROZEN), not a boolean.
        test_recipe:
          setup:
            - "One release train ATLAS 25.0, one SENIOR writer capacity 100, both reviewer disciplines."
            - "Plan item A: STANDARD, 6 pages, complexity 10, NEW_TOPIC, assigned 2026-08-03..2026-08-14 (load 26.00). Its topic is fully approved, so A sits in APPROVED_CONTENT."
            - "Plan item B: CRITICAL, 4 pages, complexity 25, CONCEPT_HUB, assigned 2026-08-16..2026-08-28 (load (8 + 20 + 6) * 1.5 / 1.0 = 51.00; 26.00 + 51.00 = 77.00 fits the 100-point capacity and the window clears the 2-day handoff buffer)."
            - "The train is advanced to DOC_FREEZE, so posture stops being unconditionally OPEN: ratio 1/2 = 0.50 lands exactly on RESTRICTED_FLOOR -> RESTRICTED."
            - "Topic B is drafted and submitted for review SUCCESSFULLY under RESTRICTED because its plan item is CRITICAL."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DocsLead
            - call: "POST /release-trains"
              payload: { product_key: "ATLAS", version_label: "25.0", doc_freeze_date: "2026-08-20", ga_date: "2026-09-01", support_end_date: "2027-09-01", localization_budget_cap_cents: 5000000 }
              as: DocsLead
              captures: { rt_id: $.data.id }
            - call: "POST /writers"
              payload: { person_key: "w-sam", full_name: "Sam Senior", seniority_tier: "SENIOR", capacity_points: 100 }
              as: DocsLead
              captures: { w1_id: $.data.id }
            - call: "POST /reviewers"
              payload: { person_key: "r-eng", full_name: "Erin Engineering", discipline: "ENGINEERING" }
              as: DocsLead
              captures: { rv_eng_id: $.data.id }
            - call: "POST /reviewers"
              payload: { person_key: "r-prod", full_name: "Priya Product", discipline: "PRODUCT" }
              as: DocsLead
              captures: { rv_prod_id: $.data.id }
            - call: "POST /plan-items"
              payload: { release_train_id: "${rt_id}", feature_key: "atlas-a", ia_placement: "NEW_TOPIC", audience_tier: "STANDARD", planned_page_count: 6, complexity_points: 10 }
              as: DocsLead
              captures: { pi_a: $.data.id }
            - call: "POST /plan-items/${pi_a}/assign"
              payload: { writer_id: "${w1_id}", window_start_date: "2026-08-03", window_end_date: "2026-08-14" }
              as: DocsLead
            - call: "POST /plan-items"
              payload: { release_train_id: "${rt_id}", feature_key: "atlas-b", ia_placement: "CONCEPT_HUB", audience_tier: "CRITICAL", planned_page_count: 4, complexity_points: 25 }
              as: DocsLead
              captures: { pi_b: $.data.id }
            - call: "POST /plan-items/${pi_b}/assign"
              payload: { writer_id: "${w1_id}", window_start_date: "2026-08-16", window_end_date: "2026-08-28" }
              as: DocsLead
              captures: { load_b: $.data.load_points }
            - call: "POST /topics"
              payload: { plan_item_id: "${pi_a}", slug: "atlas-a-overview", title: "Atlas A Overview" }
              as: Writer
              as_user_id: "${w1_id}"
              captures: { t_a: $.data.id }
            - call: "POST /topics/${t_a}/revisions"
              payload: { body_word_count: 1200, used_terms: ["index"], summary: "draft 1" }
              as: Writer
              as_user_id: "${w1_id}"
            - call: "POST /topics/${t_a}/submit-review"
              payload: {}
              as: Writer
              as_user_id: "${w1_id}"
            - call: "POST /topics/${t_a}/sign-offs"
              payload: { reviewer_id: "${rv_eng_id}" }
              as: DocsLead
              captures: { so_a_eng: $.data.id }
            - call: "POST /topics/${t_a}/sign-offs"
              payload: { reviewer_id: "${rv_prod_id}" }
              as: DocsLead
              captures: { so_a_prod: $.data.id }
            - call: "POST /sign-offs/${so_a_eng}/decide"
              payload: { decision: "APPROVED" }
              as: Reviewer
              as_user_id: "${rv_eng_id}"
            - call: "POST /sign-offs/${so_a_prod}/decide"
              payload: { decision: "APPROVED" }
              as: Reviewer
              as_user_id: "${rv_prod_id}"
            - call: "POST /release-trains/${rt_id}/advance"
              payload: { target_status: "DOC_FREEZE" }
              as: DocsLead
              captures: { ratio_restricted: $.data.approved_topic_ratio, posture_restricted: $.data.doc_readiness_posture }
            - call: "POST /topics"
              payload: { plan_item_id: "${pi_b}", slug: "atlas-b-hub", title: "Atlas B Concept Hub" }
              as: Writer
              as_user_id: "${w1_id}"
              captures: { t_b: $.data.id }
            - call: "POST /topics/${t_b}/revisions"
              payload: { body_word_count: 900, used_terms: ["index"], summary: "hub draft" }
              as: Writer
              as_user_id: "${w1_id}"
            - call: "POST /topics/${t_b}/submit-review"
              payload: {}
              as: Writer
              as_user_id: "${w1_id}"
              captures: { b_review_state: $.data.review_state }
          trigger:
            - call: "POST /topics/${t_a}/revisions"
