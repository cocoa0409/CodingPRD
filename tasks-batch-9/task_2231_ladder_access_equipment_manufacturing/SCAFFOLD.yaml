    errors: [ERR_PRODUCT_NOT_FOUND, ERR_DESIGN_REVISION_NOT_FOUND, ERR_LISTING_RECORD_NOT_FOUND, ERR_PRODUCTION_LOT_NOT_FOUND, ERR_INVALID_REQUEST, ERR_INVALID_WINDOW, ERR_REVISION_PRODUCT_MISMATCH, ERR_AUDIT_SCOPE_MISMATCH, ERR_AUDIT_FIELDS_MISMATCH, ERR_AUDIT_WINDOW_OVERLAP]

