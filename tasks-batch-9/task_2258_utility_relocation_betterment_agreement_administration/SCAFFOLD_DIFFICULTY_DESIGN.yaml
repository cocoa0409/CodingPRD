            - { call: "POST /uro/agreements/${a1}/execute", payload: {}, as: AgreementOfficer, as_user_id: "officer-1" }
            - { call: "POST /uro/utility-owners/${o1}/release-hold", payload: { release_note: "Owner submitted a corrective schedule; hold released." }, as: ProgramAdmin, captures: { hold_after: $.data.reimbursement_hold } }
            - { call: "POST /uro/agreements/${a1}/execute", payload: {}, as: AgreementOfficer, as_user_id: "officer-1", captures: { exec_after: $.data.execution_status } }
          assert:
            - "Before the trigger: UtilityOwner.${o1}.reimbursement_hold == true and ReimbursementAgreement.${a1}.execution_status == PENDING_OWNER_SIGNATURE"
            - "The first trigger call returns 409 with error_id ERR_OWNER_ON_REIMBURSEMENT_HOLD"
            - "ReimbursementAgreement.${a1}.execution_status is still PENDING_OWNER_SIGNATURE after the rejection and Project.${p1}.total_committed_reimbursement_cents == 0"
            - "UtilityOwner.${o1}.reimbursement_hold == false after the release-hold call, and delinquency_strikes stays 2"
            - "The third trigger call returns 200 and ReimbursementAgreement.${a1}.execution_status == EXECUTED"
            - "ReimbursementAgreement.${a1}.state_share_cents == 29070000"
            - "Project.${p1}.total_committed_reimbursement_cents == 29070000"

      - name: plan_approve_depends_on_every_permit_record_being_granted
        grounds:
          - validations[priority=17]
          - state_machines.PermitRecord.APPLIED_to_GRANTED
          - state_machines.RelocationPlan.UNDER_REVIEW_to_APPROVED
          - state_machines.UtilityConflict.RESPONSIBILITY_SET_to_RELOCATION_PLANNED
        distinguishing_aspect: |
          A different entity pair, RelocationPlan <- PermitRecord, with all-quantified semantics: the
          conflict already has one GRANTED encroachment permit, so a solution that checks "any permit
          granted" or "the latest permit granted" approves the plan, while the rule requires every
          permit of the conflict to be GRANTED. The plan row itself is untouched between the rejected
          and accepted approve calls; only the second permit's state changes.
        test_recipe:
          setup:
            - "Base chain to a plan in status UNDER_REVIEW with the conflict's determination already ISSUED, so the priority-16 rule cannot preempt the permit rule."
            - "Two permits on the conflict: an ENCROACHMENT_PERMIT decided GRANT, and an EASEMENT_ACQUISITION left in status APPLIED."
          setup_api_calls:
            - { call: "POST /uro/projects", payload: { name: "SR-14 Easement Reach", route_designation: "SR-14", letting_date: "2027-01-15T00:00:00Z", construction_start_date: "2027-03-01T00:00:00Z", construction_end_date: "2028-06-30T00:00:00Z", row_acquisition_year: 1975, reimbursement_authority_cents: 100000000, contract_daily_overhead_cents: 250000 }, as: ProgramAdmin, captures: { p1: $.data.id } }
            - { call: "POST /uro/utility-owners", payload: { legal_name: "Cascade Electric Cooperative", utility_type: "ELECTRIC", is_public_agency: false, indirect_cost_rate_pct: 12.5 }, as: ProgramAdmin, captures: { o1: $.data.id } }
            - { call: "POST /uro/facilities", payload: { owner_id: "${o1}", facility_type: "BURIED_ELECTRIC", station_begin: 100.0, station_end: 140.0, offset_ft: 12.5, depth_in: 48, material: "PVC duct bank", installed_year: 1968, occupancy_basis: "PRIVATE_EASEMENT", record_source: "AS_BUILT" }, as: UtilityCoordinator, captures: { f1: $.data.id } }
            - { call: "POST /uro/conflicts", payload: { project_id: "${p1}", facility_id: "${f1}", conflict_station: 120.0, clearance_deficiency_in: 18 }, as: UtilityCoordinator, captures: { c1: $.data.id } }
            - { call: "POST /uro/conflicts/${c1}/set-resolution", payload: { resolution_type: "RELOCATE" }, as: UtilityCoordinator }
            - { call: "POST /uro/prior-rights", payload: { conflict_id: "${c1}", claimed_basis: "PRIVATE_EASEMENT", narrative: "Recorded private easement predating right-of-way acquisition." }, as: RightOfWayAdjudicator, as_user_id: "adjudicator-1", captures: { d1: $.data.id } }
            - { call: "POST /uro/prior-rights/${d1}/submit-for-review", payload: {}, as: RightOfWayAdjudicator, as_user_id: "adjudicator-1" }
            - { call: "POST /uro/prior-rights/${d1}/issue", payload: {}, as: RightOfWayAdjudicator, as_user_id: "adjudicator-1", captures: { d1_status: $.data.status } }
            - { call: "GET /uro/conflicts/${c1}", payload: {}, as: UtilityCoordinator, captures: { c1v: $.data.version } }
            - { call: "POST /uro/relocation-plans", payload: { conflict_id: "${c1}", expected_conflict_version: "${c1v}", estimated_cost_cents: 40000000, replacement_in_kind_cost_cents: 32000000, proposed_capacity_ratio: 1.25, work_days: 11 }, as: UtilityOwnerRep, as_user_id: "${o1}", captures: { pl1: $.data.id } }
            - { call: "POST /uro/permits", payload: { conflict_id: "${c1}", permit_type: "ENCROACHMENT_PERMIT", expires_on: "2028-12-31T00:00:00Z" }, as: UtilityCoordinator, captures: { pm1: $.data.id } }
            - { call: "POST /uro/permits/${pm1}/decide", payload: { decision: "GRANT", decision_note: "Encroachment permit granted." }, as: UtilityCoordinator, captures: { pm1_status: $.data.status } }
            - { call: "POST /uro/permits", payload: { conflict_id: "${c1}", permit_type: "EASEMENT_ACQUISITION", expires_on: "2028-12-31T00:00:00Z" }, as: UtilityCoordinator, captures: { pm2: $.data.id, pm2_status: $.data.status } }
            - { call: "POST /uro/relocation-plans/${pl1}/start-review", payload: {}, as: UtilityCoordinator }
          trigger:
            - { call: "POST /uro/relocation-plans/${pl1}/approve", payload: {}, as: UtilityCoordinator }
            - { call: "POST /uro/permits/${pm2}/decide", payload: { decision: "GRANT", decision_note: "Easement acquired and recorded." }, as: UtilityCoordinator, captures: { pm2_status_after: $.data.status } }
            - { call: "POST /uro/relocation-plans/${pl1}/approve", payload: {}, as: UtilityCoordinator, captures: { pl1_status_after: $.data.status } }
          assert:
            - "Before the trigger: PermitRecord.${pm1}.status == GRANTED, PermitRecord.${pm2}.status == APPLIED, PriorRightsDetermination.${d1}.status == ISSUED, RelocationPlan.${pl1}.status == UNDER_REVIEW"
            - "The first trigger call returns 409 with error_id ERR_PERMIT_NOT_GRANTED (not ERR_PRIOR_RIGHTS_NOT_ISSUED: the determination is already ISSUED)"
            - "RelocationPlan.${pl1}.status is still UNDER_REVIEW after the rejection and UtilityConflict.${c1}.status is still RESPONSIBILITY_SET"
            - "PermitRecord.${pm2}.status == GRANTED and granted_on is stamped from the logical clock"
            - "The third trigger call returns 200 and RelocationPlan.${pl1}.status == APPROVED"
            - "UtilityConflict.${c1}.status == RELOCATION_PLANNED"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: facility_occupancy_windows_excluded_by_a_three_day_mobilization_buffer
        grounds:
          - validations[priority=23]
          - entities.ScheduleCommitment.fields.window_start
          - entities.ScheduleCommitment.fields.window_end
          - calculations.owner_open_commitment_days
        distinguishing_aspect: |
          Resource: a single UtilityFacility, which may host only one crew at a time. Interval
          semantics: half-open windows widened by a symmetric 3-day mobilization buffer, so
          exclusion extends beyond bare overlap - a window starting 2027-04-22, two days after the
          existing window ends on 2027-04-20, is still rejected, while 2027-04-23 (exactly at the
          buffer edge) is admitted.
        test_recipe:
          setup:
            - "One project, one owner, ONE facility hosting two separate conflicts, each carried through its own ISSUED determination, granted permit and APPROVED plan."
            - "A first commitment on plan A occupies the facility for [2027-04-05, 2027-04-20)."
          setup_api_calls:
            - { call: "POST /uro/projects", payload: { name: "SR-14 Single Facility Reach", route_designation: "SR-14", letting_date: "2027-01-15T00:00:00Z", construction_start_date: "2027-03-01T00:00:00Z", construction_end_date: "2028-06-30T00:00:00Z", row_acquisition_year: 1975, reimbursement_authority_cents: 100000000, contract_daily_overhead_cents: 250000 }, as: ProgramAdmin, captures: { p1: $.data.id } }
