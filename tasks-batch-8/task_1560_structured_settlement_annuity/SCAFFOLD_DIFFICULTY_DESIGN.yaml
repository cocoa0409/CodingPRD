          - state_machines.SettlementAgreement.ACTIVE_to_CLOSED
        distinguishing_aspect: |
          Trigger = POST record-court-order, depth 4 chain where each link causes
          the next: order recorded -> petition COURT_APPROVED; effectuate ->
          windowed payments TRANSFERRED (link 2); last non-terminal payment leaves
          the set -> policy EXHAUSTED (link 3); policy exhaustion closes the
          agreement (link 4). Each hop is caused by the previous mutation, not by
          the original request.
