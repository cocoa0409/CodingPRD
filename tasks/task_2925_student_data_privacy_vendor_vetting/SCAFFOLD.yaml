# ============================================================================
# Task 2925 — Student Data Privacy Vendor Vetting
# Scaffold seed tables (§1.0–§1.7). Difficulty design lives in
# SCAFFOLD_DIFFICULTY_DESIGN.yaml; corner design in SCAFFOLD_CORNER_DESIGN.yaml.
# ============================================================================

scenario: |
  2925. Student Data Privacy Vendor Vetting (district educational technology privacy office): application request intake from teachers with instructional justification, vendor data practice review against student privacy laws and state addenda, data element minimization and retention/deletion commitments, subprocessor disclosure and breach notification terms, accessibility conformance and single sign-on integration requirements, approved application catalog publication with expiration dates, unauthorized application detection through network and browser telemetry, annual reauthorization and vendor incident response

domain_name: student-data-privacy-vendor-vetting

# Flat topology: every collection is rooted at the API root; children carry
# foreign keys in the request body instead of being nested in the URL.
api_prefix: ""

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: flat
  state_machine_shape: cyclic

  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate

  role_model: segregation_of_duties
  consistency_model: immediate

  difficulty_level: expert
  notes: |
    Density comes from four couplings that all read the same rows:
    (1) Vendor.privacy_posture is derived from incident + subprocessor children
        and gates teacher intake, commitment authoring and catalog publication;
    (2) DataPracticeReview carries two compliance scores computed from the same
        commitment rows under two different status filters and two different
        penalty terms;
    (3) Application.exposed_sensitivity_points feeds Vendor.risk_score which
        feeds Vendor.privacy_posture, so one commitment decision walks four
        entities;
    (4) two temporal-overlap regimes with deliberately different interval
        geometry (half-open, adjacency-legal catalog windows vs closed,
        buffer-expanded incident windows).

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ============================================================================
# §1.1 Entity-Relationship Table
# ============================================================================
entities:

  - name: Vendor
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: legal_name
        type: string
        source: input
        description: registered legal name of the education-technology company
        constraints: 1..200 chars, non-blank
      - name: hq_country_code
        type: string
        source: input
        description: headquarters country, ISO 3166-1 alpha-2 upper case
        constraints: exactly 2 upper-case letters
      - name: breach_notification_hours
        type: integer
        source: input
        description: contractual maximum hours between breach detection and district notification
        constraints: 1..720
      - name: data_deletion_days
        type: integer
        source: input
        description: contractual maximum days to complete deletion after contract end
        constraints: 1..1825
      - name: signed_state_addendum
        type: boolean
        source: input
        default: false
        description: whether the vendor has countersigned the state student-privacy addendum
      - name: subprocessor_disclosure_complete
        type: boolean
        source: input
        default: false
        description: whether the vendor asserts its subprocessor list is complete
      - name: status
        type: enum
        source: system
        default: REGISTERED
        description: registry lifecycle state
        constraints: "one of REGISTERED, UNDER_REVIEW, APPROVED, CONDITIONAL, REJECTED, SUSPENDED"
      - name: privacy_posture
        type: enum
        source: computed
        description: derived gate computed by calculations.vendor_privacy_posture from this vendor's incident and subprocessor children plus risk_score
        constraints: "one of CLEAR, WATCH, RESTRICTED, FROZEN"
      - name: risk_score
        type: number
        source: computed
        default: 0.0
        description: live variant of calculations.vendor_risk_score, 2 decimal places
      - name: reauthorization_risk_score
        type: number
        source: computed
        description: reauthorization variant of calculations.vendor_risk_score; null until the first catalog reauthorization recomputes it
      - name: open_incident_count
        type: integer
        source: computed
        default: 0
        description: count of this vendor's VendorIncident rows with response_status IN {REPORTED, CONTAINED, ESCALATED}
      - name: flagged_subprocessor_count
        type: integer
        source: computed
        default: 0
        description: count of this vendor's Subprocessor rows with status == FLAGGED
      - name: suspended_at
        type: datetime
        source: system
        description: logical-clock instant of the most recent suspend transition, null when never suspended

  - name: Subprocessor
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: vendor_id
        type: string
        source: input
        description: FK -> Vendor.id; the disclosing vendor that engages this subprocessor
      - name: processor_vendor_id
        type: string
        source: input
        description: FK -> Vendor.id; set when the subprocessor is itself a Vendor registered in this district registry, null otherwise
      - name: name
        type: string
        source: input
        description: subprocessor legal name as disclosed
        constraints: 1..200 chars, non-blank
      - name: country_code
        type: string
        source: input
        description: processing country, ISO 3166-1 alpha-2 upper case
        constraints: exactly 2 upper-case letters
      - name: data_categories
        type: array
        source: input
        description: student data categories the subprocessor touches
        constraints: "non-empty array of DataElementCommitment.element_code enum members"
      - name: purpose
        type: string
        source: input
        description: disclosed processing purpose
        constraints: 1..500 chars, non-blank
      - name: sub_breach_notification_hours
        type: integer
        source: input
        description: hours within which the subprocessor must notify the primary vendor of a breach
        constraints: 1..720
      - name: status
        type: enum
        source: system
        default: DISCLOSED
        description: disclosure review state
        constraints: "one of DISCLOSED, VERIFIED, FLAGGED, REMOVED"
      - name: reviewed_note
        type: string
        source: system
        description: note recorded by the analyst on the most recent disclosure review, null before any review

  - name: Application
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: vendor_id
        type: string
        source: input
        description: FK -> Vendor.id; the vendor that offers this application
      - name: name
        type: string
        source: input
        description: product name as it will appear in the district catalog
        constraints: 1..200 chars, non-blank
      - name: category
        type: enum
        source: input
        description: instructional category, drives max_permitted_tier
        constraints: "one of INSTRUCTIONAL_CONTENT, ASSESSMENT, COMMUNICATION, ANALYTICS, ADMINISTRATIVE"
      - name: grade_band_low
        type: integer
        source: input
        description: lowest grade the product is offered for, 0 means kindergarten
        constraints: 0..12
      - name: grade_band_high
        type: integer
        source: input
        description: highest grade the product is offered for
        constraints: 0..12, must be >= grade_band_low
      - name: sso_protocol
        type: enum
        source: system
        default: NONE
        description: single sign-on protocol asserted by the vendor liaison
        constraints: "one of NONE, SAML2, OIDC, LTI13"
      - name: sso_verified
        type: boolean
        source: system
        default: false
        description: whether the district verified the single sign-on integration end to end
      - name: accessibility_conformance_level
        type: enum
        source: system
        default: NONE
        description: accessibility conformance level asserted by the vendor liaison
        constraints: "one of NONE, WCAG21_A, WCAG21_AA, WCAG21_AAA"
      - name: vpat_on_file
        type: boolean
        source: system
        default: false
        description: whether an accessibility conformance report is on file with the district
      - name: status
        type: enum
        source: system
        default: CANDIDATE
        description: vetting lifecycle state
        constraints: "one of CANDIDATE, IN_REVIEW, APPROVED, APPROVED_WITH_CONDITIONS, BLOCKED"
      - name: catalog_visibility
        type: enum
        source: computed
        default: HIDDEN
        description: VISIBLE while at least one CatalogEntry of this application has status IN {PUBLISHED, EXPIRING_SOON}, HIDDEN otherwise
        constraints: "one of HIDDEN, VISIBLE"
      - name: max_permitted_tier
        type: integer
        source: computed
        description: highest DataElementCommitment.sensitivity_tier acceptable for this application, mapped from category by calculations.application_max_permitted_tier
        constraints: 1..4
      - name: exposed_sensitivity_points
        type: number
        source: computed
        default: 0.0
        description: output of calculations.exposed_sensitivity_points, 2 decimal places

  - name: Teacher
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: full_name
        type: string
        source: input
        description: teacher display name
        constraints: 1..120 chars, non-blank
      - name: employee_number
        type: string
        source: input
        description: district employee number, unique across all Teacher rows
        constraints: 1..32 chars, unique
      - name: school_code
        type: string
        source: input
        description: district site code where the teacher is assigned
        constraints: 1..16 chars, non-blank
      - name: grade_bands_taught
        type: array
        source: input
        description: grade levels the teacher currently teaches
        constraints: "non-empty array of integers 0..12"
      - name: open_request_count
        type: integer
        source: computed
        default: 0
        description: count of this teacher's ApplicationRequest rows with status IN {SUBMITTED, RETURNED, TRIAGED_FOR_REVIEW}
      - name: status
        type: enum
        source: system
        default: ACTIVE
        description: employment state
        constraints: "one of ACTIVE, INACTIVE"

  - name: PrivacyAnalyst
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: full_name
        type: string
        source: input
        description: analyst display name
        constraints: 1..120 chars, non-blank
      - name: credential_level
        type: enum
        source: input
        description: review credential; only LEAD may record a final review decision
        constraints: "one of JUNIOR, SENIOR, LEAD"
      - name: review_capacity_minutes
        type: integer
        source: input
        description: total review minutes this analyst may hold in non-terminal reviews
        constraints: 15..12000
      - name: allocated_review_minutes
        type: integer
        source: computed
        default: 0
        description: output of calculations.analyst_allocated_minutes
      - name: status
        type: enum
        source: system
        default: ACTIVE
        description: staffing state
        constraints: "one of ACTIVE, INACTIVE"

  - name: ApplicationRequest
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: application_id
        type: string
        source: input
        description: FK -> Application.id; the application the teacher wants authorized
      - name: requester_teacher_id
        type: string
        source: input
        description: FK -> Teacher.id; the teacher who filed this request
      - name: instructional_justification
        type: string
        source: input
        description: written instructional purpose; must be at least 120 characters at submit time
        constraints: 1..2000 chars
      - name: requested_data_elements
        type: array
        source: input
        description: student data elements the teacher believes the product needs
        constraints: "array of DataElementCommitment.element_code enum members; must be non-empty at submit time"
      - name: student_count_estimate
        type: integer
        source: input
        description: number of students expected to use the product
        constraints: 1..50000
      - name: grade_band_low
        type: integer
        source: input
        description: lowest grade in the requested rollout
        constraints: 0..12
      - name: grade_band_high
        type: integer
        source: input
        description: highest grade in the requested rollout
        constraints: 0..12, must be >= grade_band_low
      - name: status
        type: enum
        source: system
        default: DRAFT
        description: intake lifecycle state
        constraints: "one of DRAFT, SUBMITTED, RETURNED, TRIAGED_FOR_REVIEW, DENIED, CLOSED_APPROVED, CLOSED_BLOCKED"
      - name: revision_round
        type: integer
        source: system
        default: 0
        description: number of times the privacy office has returned this request for revision
        constraints: 0..3
      - name: priority_score
        type: number
        source: computed
        description: output of calculations.request_priority_score, 2 decimal places, null while DRAFT and never submitted
      - name: priority_band
        type: enum
        source: computed
        description: band pinned from the pre-multiplier raw score inside calculations.request_priority_score
        constraints: "one of LOW, STANDARD, HIGH"
      - name: submitted_at
        type: datetime
        source: system
        description: logical-clock instant of the most recent submit transition, null while never submitted
      - name: triage_note
        type: string
        source: system
        description: note recorded by the privacy office on the most recent triage, null before any triage

  - name: DataPracticeReview
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: source_request_id
        type: string
        source: input
        description: FK -> ApplicationRequest.id; the triaged teacher request that authorized this review
      - name: application_id
        type: string
        source: computed
        description: FK -> Application.id; copied from the source request at creation and never rewritten
      - name: vendor_id
        type: string
        source: computed
        description: FK -> Vendor.id; copied from the source request's application at creation and never rewritten
      - name: assigned_analyst_id
        type: string
        source: input
        description: FK -> PrivacyAnalyst.id; the analyst who authors findings on this review
      - name: decided_by_analyst_id
        type: string
        source: system
        description: FK -> PrivacyAnalyst.id; the LEAD analyst who recorded the final decision, null until decided
      - name: framework_set
        type: array
        source: input
        description: privacy frameworks this review covers
        constraints: "non-empty array of FERPA, COPPA, PPRA, STATE_ADDENDUM with no duplicates"
      - name: estimated_minutes
        type: integer
        source: input
        description: review effort held against the assigned analyst's capacity
        constraints: 15..1200
      - name: status
        type: enum
        source: system
        default: SCREENING
        description: review lifecycle state
        constraints: "one of SCREENING, FINDINGS_ISSUED, REMEDIATION_SUBMITTED, CLEARED, CONDITIONAL, BLOCKED"
      - name: round_number
        type: integer
        source: system
        default: 1
        description: findings round; incremented each time findings are re-issued after a remediation submission
        constraints: 1..3
      - name: open_findings_count
        type: integer
        source: system
        default: 0
        description: findings recorded by the most recent issue-findings call, reduced by an accepted remediation
      - name: unresolved_findings_count
        type: integer
        source: system
        default: 0
        description: findings the vendor did not resolve in its most recent remediation submission; the final-variant penalty input
      - name: provisional_compliance_score
        type: number
        source: computed
        description: provisional variant of calculations.review_compliance_score, recomputed on every issue-findings call, null before the first one
      - name: final_compliance_score
        type: number
        source: computed
        description: final variant of calculations.review_compliance_score, computed once when the review is decided, null until then
      - name: remediation_due_at
        type: datetime
        source: computed
        description: logical-clock instant of the most recent issue-findings call plus REMEDIATION_WINDOW_HOURS, null before the first one
      - name: decision_note
        type: string
        source: system
        description: note recorded by the deciding LEAD analyst, null until decided

  - name: DataElementCommitment
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: review_id
        type: string
        source: input
        description: FK -> DataPracticeReview.id; the review this data-element commitment is authored against
      - name: element_code
        type: enum
        source: input
        description: student data element the vendor commits to handle
        constraints: "one of STUDENT_NAME, GRADE_LEVEL, PARENT_CONTACT, STUDENT_ID, EMAIL, DOB, GEOLOCATION, BEHAVIORAL_TELEMETRY, PHOTO_VIDEO, IEP_STATUS, HEALTH_RECORD, BIOMETRIC, DISCIPLINE_RECORD"
      - name: sensitivity_tier
        type: integer
        source: computed
        description: tier mapped from element_code by calculations.element_sensitivity_tier
        constraints: 1..4
      - name: justified_purpose
        type: string
        source: input
        description: minimization justification; must be at least 40 characters for the row to count as minimized
        constraints: 1..500 chars
      - name: retention_days
        type: integer
        source: input
        description: days the vendor commits to retain this element after last instructional use
        constraints: 1..1825
      - name: deletion_method
        type: enum
        source: input
        description: committed disposal method at end of retention
        constraints: "one of HARD_DELETE, ANONYMIZE, AGGREGATE_ONLY"
      - name: is_minimized
        type: boolean
        source: computed
        description: output of calculations.commitment_is_minimized
      - name: element_points
        type: number
        source: computed
        description: per-element contribution computed inside calculations.exposed_sensitivity_points, rounded to 2 decimals before summation
      - name: status
        type: enum
        source: system
        default: PROPOSED
        description: commitment review state
        constraints: "one of PROPOSED, ACCEPTED, REJECTED, SUPERSEDED"
      - name: superseded_by_commitment_id
        type: string
        source: system
        description: FK -> DataElementCommitment.id; the later commitment for the same element_code on the same review that replaced this row, null otherwise
      - name: decided_by_analyst_id
        type: string
        source: system
        description: FK -> PrivacyAnalyst.id; the analyst who accepted or rejected this commitment, null while PROPOSED or SUPERSEDED

  - name: CatalogEntry
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: application_id
        type: string
        source: input
        description: FK -> Application.id; the application published in the district catalog
      - name: review_id
        type: string
        source: input
        description: FK -> DataPracticeReview.id; the decided review that authorizes this publication
      - name: predecessor_entry_id
        type: string
        source: system
        description: FK -> CatalogEntry.id; the entry this row reauthorizes, null for a first publication
      - name: effective_from
        type: datetime
        source: input
        description: inclusive start of the authorization window, ISO 8601 UTC with three fractional digits
      - name: expires_at
        type: datetime
        source: input
        description: exclusive end of the authorization window, ISO 8601 UTC with three fractional digits, must be strictly after effective_from
      - name: authorized_grade_band_low
        type: integer
        source: input
        description: lowest grade the catalog authorizes for this application
        constraints: 0..12
      - name: authorized_grade_band_high
        type: integer
        source: input
        description: highest grade the catalog authorizes for this application
        constraints: 0..12, must be >= authorized_grade_band_low
      - name: reauthorization_due_at
        type: datetime
        source: computed
        description: expires_at minus REAUTHORIZATION_LEAD_DAYS days; the instant at or after which a sweep moves a PUBLISHED entry to EXPIRING_SOON
      - name: published_review_score
        type: number
        source: computed
        description: snapshot of DataPracticeReview.final_compliance_score taken at publication and never refreshed afterwards
      - name: status
        type: enum
        source: system
        default: PUBLISHED
        description: catalog lifecycle state
        constraints: "one of PUBLISHED, EXPIRING_SOON, EXPIRED, SUSPENDED_HOLD, REVOKED, SUPERSEDED"
      - name: revoked_reason
        type: string
        source: system
        description: reason recorded on revocation, null unless status == REVOKED
      - name: hold_restored_from
        type: enum
        source: system
        description: the status this entry held when a vendor suspension placed it on SUSPENDED_HOLD, null unless it was ever held
        constraints: "one of PUBLISHED, EXPIRING_SOON"

  - name: TelemetryDetection
    parent: null
    common_fields: true
    kind: event
    fields:
      - name: observed_domain
        type: string
        source: input
        description: fully qualified domain observed in network or browser telemetry
        constraints: 1..253 chars, non-blank
      - name: application_id
        type: string
        source: input
        description: FK -> Application.id; the registered application the collector matched the domain to, null when no district-registered application matches
      - name: matched_catalog_entry_id
        type: string
        source: computed
        description: FK -> CatalogEntry.id; the entry selected by the classification selector in calculations.detection_classification, null when the selector's candidate set is empty
      - name: school_code
        type: string
        source: input
        description: district site code where the traffic was observed
        constraints: 1..16 chars, non-blank
      - name: source
        type: enum
        source: input
        description: telemetry collector that produced the observation
        constraints: "one of NETWORK_DNS, BROWSER_EXTENSION, MDM_INVENTORY"
      - name: observed_at
        type: datetime
        source: input
        description: instant the traffic was observed, must be at or before the current logical clock
      - name: distinct_user_count
        type: integer
        source: input
        description: distinct district accounts observed on the domain
        constraints: 0..100000
      - name: session_count
        type: integer
        source: input
        description: sessions observed on the domain
        constraints: 0..1000000
      - name: classification
        type: enum
        source: computed
        description: output of calculations.detection_classification
        constraints: "one of AUTHORIZED, EXPIRED_AUTHORIZATION, UNAUTHORIZED, UNKNOWN_DOMAIN"
      - name: exposure_score
        type: number
        source: computed
        description: output of calculations.detection_exposure_score, 2 decimal places
      - name: status
        type: enum
        source: system
        default: NEW
        description: triage state
        constraints: "one of NEW, CONFIRMED_AUTHORIZED, BLOCKED, WHITELISTED, ESCALATED"
      - name: triaged_by_user_id
        type: string
        source: system
        description: opaque X-User-ID of the privacy office operator who triaged this detection, null while NEW
      - name: linked_incident_id
        type: string
        source: system
        description: FK -> VendorIncident.id; the incident opened by the ESCALATE disposition, null otherwise

  - name: VendorIncident
    parent: null
    common_fields: true
    kind: resource
    fields:
      - name: vendor_id
        type: string
        source: input
        description: FK -> Vendor.id; the vendor the incident belongs to
      - name: incident_type
        type: enum
        source: input
        description: incident classification supplied by the reporter
        constraints: "one of BREACH, SUBPROCESSOR_CHANGE, RETENTION_VIOLATION, UNAUTHORIZED_DISCLOSURE"
      - name: detected_at
        type: datetime
        source: input
        description: instant the vendor detected the incident, must be at or before the current logical clock
      - name: reported_at
        type: datetime
        source: system
        description: logical-clock instant at which the incident row was created
      - name: contained_at
        type: datetime
        source: system
        description: logical-clock instant of the contain transition (or the explicit contained_at supplied on that call), null while REPORTED
      - name: affected_student_count
        type: integer
        source: input
        description: students whose records were exposed
        constraints: 0..500000
      - name: max_data_tier
        type: integer
        source: input
        description: highest DataElementCommitment.sensitivity_tier involved in the incident
        constraints: 1..4
      - name: severity
        type: enum
        source: computed
        description: output of calculations.incident_severity
        constraints: "one of LOW, MODERATE, HIGH, CRITICAL"
      - name: notification_due_at
        type: datetime
        source: computed
        description: output of calculations.incident_notification_due_at
      - name: notification_sent_at
        type: datetime
        source: system
        description: logical-clock instant the district notification was recorded, null while PENDING or OVERDUE
      - name: response_status
        type: enum
        source: system
        default: REPORTED
        description: containment dimension of this row's independent state axes
        constraints: "one of REPORTED, CONTAINED, REMEDIATED, ESCALATED"
      - name: notification_status
        type: enum
        source: system
        default: PENDING
        description: notification dimension of this row's independent state axes, advanced independently of response_status
        constraints: "one of PENDING, SENT, OVERDUE, SENT_LATE"
      - name: notified_party_count
        type: integer
        source: system
        default: 0
        description: parties recorded on the notification call, 0 while no notification has been sent
      - name: remediation_note
        type: string
        source: system
        description: note recorded on the resolve transition, null while not resolved

# ============================================================================
# §1.2 State Machine Table
# ============================================================================
state_machines:

  - entity: Vendor
    shape: branching_with_revert
    initial_state: REGISTERED
    terminal_states: [REJECTED]
    transitions:
      - from: REGISTERED
        to: UNDER_REVIEW
        trigger: "system, on POST /data-practice-reviews when the new review's vendor_id equals this vendor"
        actor: system
        preconditions:
          - "vendor.status == REGISTERED"
        side_effects:
          - "sets Vendor.status = UNDER_REVIEW"
          - "recomputes Vendor.privacy_posture per calculations.vendor_privacy_posture"
          - "increments Vendor.version by 1"
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "system, on POST /data-practice-reviews/{reviewId}/decide with disposition == CLEAR"
        actor: system
        preconditions:
          - "vendor.status == UNDER_REVIEW"
        side_effects:
          - "sets Vendor.status = APPROVED"
          - "recomputes Vendor.risk_score (live variant) then Vendor.privacy_posture"
          - "increments Vendor.version by 1"
      - from: UNDER_REVIEW
        to: CONDITIONAL
        trigger: "system, on POST /data-practice-reviews/{reviewId}/decide with disposition == CONDITIONAL"
        actor: system
        preconditions:
          - "vendor.status == UNDER_REVIEW"
        side_effects:
          - "sets Vendor.status = CONDITIONAL"
          - "recomputes Vendor.risk_score (live variant) then Vendor.privacy_posture"
          - "increments Vendor.version by 1"
      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "system, on POST /data-practice-reviews/{reviewId}/decide with disposition == BLOCK"
        actor: system
        preconditions:
          - "vendor.status == UNDER_REVIEW"
        side_effects:
          - "sets Vendor.status = REJECTED"
          - "recomputes Vendor.privacy_posture"
          - "increments Vendor.version by 1"
        note: "terminal; a rejected vendor can never be reinstated, only re-registered as a new row"
      - from: APPROVED
        to: SUSPENDED
        trigger: "POST /vendors/{vendorId}/suspend"
        actor: PrivacyOfficeAdmin
        preconditions:
          - "vendor.status IN {APPROVED, CONDITIONAL}"
        side_effects:
          - "sets Vendor.status = SUSPENDED and Vendor.suspended_at = current logical clock"
          - "CASCADE HOP 2 — because Vendor.status became SUSPENDED, calculations.vendor_privacy_posture re-evaluates and Vendor.privacy_posture becomes FROZEN"
          - "CASCADE HOP 3 — because Vendor.privacy_posture became FROZEN, every CatalogEntry whose application_id belongs to this vendor and whose status IN {PUBLISHED, EXPIRING_SOON} moves to SUSPENDED_HOLD with hold_restored_from set to the status it left"
          - "CASCADE HOP 4 — because those CatalogEntry rows left {PUBLISHED, EXPIRING_SOON}, each affected Application recomputes catalog_visibility, which becomes HIDDEN once no PUBLISHED or EXPIRING_SOON entry remains"
          - "increments version by 1 on Vendor, on every CatalogEntry moved to SUSPENDED_HOLD, and on every Application whose catalog_visibility changed"
      - from: CONDITIONAL
        to: SUSPENDED
        trigger: "POST /vendors/{vendorId}/suspend"
        actor: PrivacyOfficeAdmin
        preconditions:
          - "vendor.status IN {APPROVED, CONDITIONAL}"
        side_effects:
          - "identical four-hop cascade as APPROVED -> SUSPENDED"
      - from: SUSPENDED
        to: APPROVED
        trigger: "POST /vendors/{vendorId}/reinstate"
        actor: PrivacyOfficeAdmin
        preconditions:
          - "vendor.status == SUSPENDED"
        side_effects:
          - "sets Vendor.status = APPROVED (a CONDITIONAL vendor reinstates to CONDITIONAL)"
          - "COMPENSATION HOP 2 — recomputes Vendor.privacy_posture, which leaves FROZEN unless an OVERDUE notification or a CRITICAL REPORTED incident still holds it"
          - "COMPENSATION HOP 3 — because the posture left FROZEN, every CatalogEntry of this vendor's applications with status == SUSPENDED_HOLD is restored: to PUBLISHED when current clock < reauthorization_due_at, to EXPIRING_SOON when reauthorization_due_at <= current clock < expires_at, to EXPIRED when expires_at <= current clock"
          - "COMPENSATION HOP 4 — because those entries re-entered {PUBLISHED, EXPIRING_SOON}, each affected Application recomputes catalog_visibility back to VISIBLE"
          - "increments version by 1 on Vendor, on every restored CatalogEntry, and on every Application whose catalog_visibility changed"
        note: "cycle: APPROVED -> SUSPENDED -> APPROVED; the restore branch is the compensating action for the suspend cascade"

  - entity: Subprocessor
    shape: branching
    initial_state: DISCLOSED
    terminal_states: [REMOVED]
    transitions:
      - from: DISCLOSED
        to: VERIFIED
        trigger: "POST /subprocessors/{subprocessorId}/review with disposition == VERIFY"
        actor: PrivacyAnalyst
        preconditions:
          - "subprocessor.status == DISCLOSED"
          - "subprocessor.sub_breach_notification_hours <= vendor.breach_notification_hours"
        side_effects:
          - "sets Subprocessor.status = VERIFIED and Subprocessor.reviewed_note"
          - "recomputes Vendor.risk_score (live variant) then Vendor.privacy_posture"
      - from: DISCLOSED
        to: FLAGGED
        trigger: "POST /subprocessors/{subprocessorId}/review with disposition == FLAG"
        actor: PrivacyAnalyst
        preconditions:
          - "subprocessor.status == DISCLOSED"
        side_effects:
          - "sets Subprocessor.status = FLAGGED"
          - "increments Vendor.flagged_subprocessor_count"
          - "because flagged_subprocessor_count became > 0, Vendor.privacy_posture re-evaluates to RESTRICTED unless the FROZEN branch already applies"
      - from: FLAGGED
        to: REMOVED
        trigger: "POST /subprocessors/{subprocessorId}/review with disposition == REMOVE"
        actor: PrivacyAnalyst
        preconditions:
          - "subprocessor.status == FLAGGED"
        side_effects:
          - "sets Subprocessor.status = REMOVED"
          - "decrements Vendor.flagged_subprocessor_count"
          - "recomputes Vendor.risk_score (live variant) then Vendor.privacy_posture"
      - from: VERIFIED
        to: REMOVED
        trigger: "POST /subprocessors/{subprocessorId}/review with disposition == REMOVE"
        actor: PrivacyAnalyst
        preconditions:
          - "subprocessor.status == VERIFIED"
        side_effects:
          - "sets Subprocessor.status = REMOVED"
          - "recomputes Vendor.risk_score (live variant) then Vendor.privacy_posture"

  - entity: ApplicationRequest
    shape: cyclic
    initial_state: DRAFT
    terminal_states: [DENIED, CLOSED_APPROVED, CLOSED_BLOCKED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /application-requests/{requestId}/submit"
        actor: Teacher
        preconditions:
          - "request.status IN {DRAFT, RETURNED}"
          - "len(instructional_justification) >= JUSTIFICATION_MIN_CHARS"
          - "len(requested_data_elements) >= 1"
          - "vendor of request.application_id has privacy_posture != FROZEN"
        side_effects:
          - "sets ApplicationRequest.status = SUBMITTED and submitted_at = current logical clock"
          - "computes ApplicationRequest.priority_score and priority_band per calculations.request_priority_score"
          - "recomputes Teacher.open_request_count for requester_teacher_id"
      - from: SUBMITTED
        to: RETURNED
        trigger: "POST /application-requests/{requestId}/triage with disposition == RETURN"
        actor: PrivacyOfficeAdmin
        preconditions:
          - "request.status == SUBMITTED"
        side_effects:
          - "sets ApplicationRequest.status = RETURNED, triage_note, and revision_round = revision_round + 1"
      - from: RETURNED
        to: SUBMITTED
        trigger: "POST /application-requests/{requestId}/submit"
        actor: Teacher
        preconditions:
          - "request.status IN {DRAFT, RETURNED}"
          - "request.revision_round <= REVISION_ROUND_MAX"
          - "len(instructional_justification) >= JUSTIFICATION_MIN_CHARS"
          - "len(requested_data_elements) >= 1"
          - "vendor of request.application_id has privacy_posture != FROZEN"
        side_effects:
          - "same side effects as DRAFT -> SUBMITTED; priority_score is recomputed from the payload overrides when supplied"
        note: "the SUBMITTED -> RETURNED -> SUBMITTED loop is the revision cycle; a fourth submission is refused by ERR_REVISION_LIMIT_EXCEEDED"
      - from: SUBMITTED
        to: TRIAGED_FOR_REVIEW
        trigger: "POST /application-requests/{requestId}/triage with disposition == ACCEPT_FOR_REVIEW"
        actor: PrivacyOfficeAdmin
        preconditions:
          - "request.status == SUBMITTED"
        side_effects:
          - "sets ApplicationRequest.status = TRIAGED_FOR_REVIEW and triage_note"
          - "sets Application.status = IN_REVIEW when the application is CANDIDATE"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /application-requests/{requestId}/triage with disposition == DENY"
        actor: PrivacyOfficeAdmin
        preconditions:
          - "request.status == SUBMITTED"
        side_effects:
          - "sets ApplicationRequest.status = DENIED and triage_note"
          - "recomputes Teacher.open_request_count for requester_teacher_id"
      - from: TRIAGED_FOR_REVIEW
        to: CLOSED_APPROVED
        trigger: "system, cascade hop 3 of POST /data-practice-reviews/{reviewId}/decide with disposition IN {CLEAR, CONDITIONAL}"
        actor: system
        preconditions:
          - "request.status == TRIAGED_FOR_REVIEW"
          - "the application named by request.application_id has just moved to APPROVED or APPROVED_WITH_CONDITIONS"
        side_effects:
          - "sets ApplicationRequest.status = CLOSED_APPROVED"
          - "CASCADE HOP 4 — because this request left {SUBMITTED, RETURNED, TRIAGED_FOR_REVIEW}, Teacher.open_request_count is recomputed for requester_teacher_id"
      - from: TRIAGED_FOR_REVIEW
        to: CLOSED_BLOCKED
        trigger: "system, cascade hop 3 of POST /data-practice-reviews/{reviewId}/decide with disposition == BLOCK"
        actor: system
        preconditions:
          - "request.status == TRIAGED_FOR_REVIEW"
          - "the application named by request.application_id has just moved to BLOCKED"
        side_effects:
          - "sets ApplicationRequest.status = CLOSED_BLOCKED"
          - "CASCADE HOP 4 — Teacher.open_request_count is recomputed for requester_teacher_id"

  - entity: DataPracticeReview
    shape: cyclic_with_branching_join
    initial_state: SCREENING
    terminal_states: [CLEARED, CONDITIONAL, BLOCKED]
    transitions:
      - from: SCREENING
        to: SCREENING
        trigger: "POST /data-practice-reviews/{reviewId}/reassign"
        actor: PrivacyOfficeAdmin
        preconditions:
          - "review.status NOT IN {CLEARED, CONDITIONAL, BLOCKED}"
          - "new_assigned_analyst_id != review.assigned_analyst_id"
          - "target analyst status == ACTIVE"
          - "target_analyst.allocated_review_minutes + review.estimated_minutes <= target_analyst.review_capacity_minutes"
        side_effects:
          - "sets DataPracticeReview.assigned_analyst_id = new_assigned_analyst_id"
          - "recomputes allocated_review_minutes on BOTH the outgoing and the incoming PrivacyAnalyst per calculations.analyst_allocated_minutes, leaving the district-wide sum of allocated_review_minutes unchanged"
        note: "self transition; also legal from FINDINGS_ISSUED and REMEDIATION_SUBMITTED with identical preconditions and side effects"
      - from: SCREENING
        to: FINDINGS_ISSUED
        trigger: "POST /data-practice-reviews/{reviewId}/issue-findings"
        actor: PrivacyAnalyst
        preconditions:
          - "review.status IN {SCREENING, REMEDIATION_SUBMITTED}"
          - "X-User-ID == review.assigned_analyst_id"
          - "at least one DataElementCommitment with review_id == review.id and status IN {PROPOSED, ACCEPTED} exists"
          - "vendor of review.vendor_id has privacy_posture != FROZEN"
          - "review.round_number <= FINDINGS_ROUND_MAX"
        side_effects:
          - "sets DataPracticeReview.status = FINDINGS_ISSUED and open_findings_count = payload findings_count"
          - "sets remediation_due_at = current logical clock + REMEDIATION_WINDOW_HOURS hours"
          - "computes DataPracticeReview.provisional_compliance_score using the provisional variant of calculations.review_compliance_score"
      - from: FINDINGS_ISSUED
        to: REMEDIATION_SUBMITTED
        trigger: "POST /data-practice-reviews/{reviewId}/submit-remediation"
        actor: VendorLiaison
        preconditions:
          - "review.status == FINDINGS_ISSUED"
          - "X-User-ID == review.vendor_id"
          - "current logical clock <= review.remediation_due_at"
          - "payload resolved_findings_count <= review.open_findings_count"
        side_effects:
          - "sets DataPracticeReview.status = REMEDIATION_SUBMITTED"
          - "sets unresolved_findings_count = open_findings_count - resolved_findings_count, then sets open_findings_count = unresolved_findings_count"
      - from: REMEDIATION_SUBMITTED
        to: FINDINGS_ISSUED
        trigger: "POST /data-practice-reviews/{reviewId}/issue-findings"
        actor: PrivacyAnalyst
        preconditions:
          - "review.status IN {SCREENING, REMEDIATION_SUBMITTED}"
          - "X-User-ID == review.assigned_analyst_id"
          - "review.round_number + 1 <= FINDINGS_ROUND_MAX"
        side_effects:
          - "sets round_number = round_number + 1, status = FINDINGS_ISSUED, open_findings_count = payload findings_count"
          - "resets remediation_due_at = current logical clock + REMEDIATION_WINDOW_HOURS hours"
          - "recomputes provisional_compliance_score (provisional variant)"
        note: "the FINDINGS_ISSUED -> REMEDIATION_SUBMITTED -> FINDINGS_ISSUED loop is the negotiation cycle; a fourth round is refused by ERR_REMEDIATION_ROUND_LIMIT"
      - from: FINDINGS_ISSUED
        to: CLEARED
        trigger: "POST /data-practice-reviews/{reviewId}/decide with disposition == CLEAR"
        actor: PrivacyAnalyst
        preconditions:
          - "review.status == FINDINGS_ISSUED"
          - "acting analyst credential_level == LEAD and X-User-ID != review.assigned_analyst_id"
          - "vendor.subprocessor_disclosure_complete == true"
        side_effects:
          - "CASCADE HOP 1 — sets DataPracticeReview.status = CLEARED, decided_by_analyst_id, decision_note, and computes final_compliance_score using the final variant of calculations.review_compliance_score"
          - "CASCADE HOP 2 — because the review became CLEARED, Application.status moves IN_REVIEW -> APPROVED"
          - "CASCADE HOP 3 — because that Application became APPROVED, its ApplicationRequest rows with status == TRIAGED_FOR_REVIEW move to CLOSED_APPROVED"
          - "CASCADE HOP 4 — because those requests left the open set, Teacher.open_request_count is recomputed for each requester_teacher_id"
          - "recomputes allocated_review_minutes on review.assigned_analyst_id, because the review left the non-terminal set"
          - "moves Vendor.status UNDER_REVIEW -> APPROVED, then recomputes Vendor.risk_score (live variant) and Vendor.privacy_posture"
      - from: FINDINGS_ISSUED
        to: CONDITIONAL
        trigger: "POST /data-practice-reviews/{reviewId}/decide with disposition == CONDITIONAL"
        actor: PrivacyAnalyst
        preconditions:
          - "review.status == FINDINGS_ISSUED"
          - "acting analyst credential_level == LEAD and X-User-ID != review.assigned_analyst_id"
        side_effects:
          - "sets status = CONDITIONAL, decided_by_analyst_id, decision_note, final_compliance_score (final variant)"
          - "Application.status moves IN_REVIEW -> APPROVED_WITH_CONDITIONS"
          - "ApplicationRequest rows with status == TRIAGED_FOR_REVIEW move to CLOSED_APPROVED, then Teacher.open_request_count is recomputed"
          - "recomputes allocated_review_minutes on review.assigned_analyst_id"
          - "moves Vendor.status UNDER_REVIEW -> CONDITIONAL, then recomputes risk_score and privacy_posture"
        note: "branch differs from CLEARED in that vendor.subprocessor_disclosure_complete is NOT required and the Application lands on APPROVED_WITH_CONDITIONS"
      - from: FINDINGS_ISSUED
        to: BLOCKED
        trigger: "POST /data-practice-reviews/{reviewId}/decide with disposition == BLOCK"
        actor: PrivacyAnalyst
        preconditions:
          - "review.status == FINDINGS_ISSUED"
          - "acting analyst credential_level == LEAD and X-User-ID != review.assigned_analyst_id"
        side_effects:
          - "sets status = BLOCKED, decided_by_analyst_id, decision_note, final_compliance_score (final variant)"
          - "Application.status moves IN_REVIEW -> BLOCKED"
          - "because that Application became BLOCKED, its ApplicationRequest rows with status == TRIAGED_FOR_REVIEW move to CLOSED_BLOCKED, then Teacher.open_request_count is recomputed"
          - "because that Application became BLOCKED, every CatalogEntry of that application with status IN {PUBLISHED, EXPIRING_SOON, SUSPENDED_HOLD} moves to REVOKED with revoked_reason = 'REVIEW_BLOCKED', after which Application.catalog_visibility recomputes to HIDDEN"
          - "recomputes allocated_review_minutes on review.assigned_analyst_id"
          - "moves Vendor.status UNDER_REVIEW -> REJECTED, then recomputes privacy_posture"
        note: "divergent branch side-effect set: only this branch revokes catalog entries and only this branch drives the vendor terminal"

  - entity: DataElementCommitment
    shape: branching_with_compensation
    initial_state: PROPOSED
    terminal_states: [REJECTED, SUPERSEDED]
    transitions:
      - from: PROPOSED
        to: SUPERSEDED
        trigger: "system, on POST /data-element-commitments when a PROPOSED row for the same review_id and element_code already exists"
        actor: system
        preconditions:
          - "existing row status == PROPOSED"
        side_effects:
          - "sets the existing row status = SUPERSEDED and superseded_by_commitment_id = the new row's id"
          - "increments the existing row's version by 1"
      - from: PROPOSED
        to: ACCEPTED
        trigger: "POST /data-element-commitments/{commitmentId}/decide with disposition == ACCEPT"
        actor: PrivacyAnalyst
        preconditions:
          - "commitment.status == PROPOSED (an already ACCEPTED row can only be REJECTED, never re-accepted; see validations priority 41)"
          - "X-User-ID != review.assigned_analyst_id (segregation of duties: the assignee proposes, a different analyst dispositions)"
          - "review.status NOT IN {CLEARED, CONDITIONAL, BLOCKED}"
          - "commitment.sensitivity_tier <= application.max_permitted_tier"
        side_effects:
          - "CASCADE HOP 1 — sets DataElementCommitment.status = ACCEPTED and decided_by_analyst_id"
          - "CASCADE HOP 2 — because the ACCEPTED set of this review changed, Application.exposed_sensitivity_points is recomputed per calculations.exposed_sensitivity_points"
          - "CASCADE HOP 3 — because Application.exposed_sensitivity_points changed, Vendor.risk_score is recomputed with the live variant of calculations.vendor_risk_score"
          - "CASCADE HOP 4 — because Vendor.risk_score changed, Vendor.privacy_posture is re-evaluated per calculations.vendor_privacy_posture"
          - "increments version by 1 on the commitment, the Application, and the Vendor"
      - from: PROPOSED
        to: REJECTED
        trigger: "POST /data-element-commitments/{commitmentId}/decide with disposition == REJECT"
        actor: PrivacyAnalyst
        preconditions:
          - "commitment.status == PROPOSED"
          - "X-User-ID != review.assigned_analyst_id (segregation of duties: the assignee proposes, a different analyst dispositions)"
          - "review.status NOT IN {CLEARED, CONDITIONAL, BLOCKED}"
        side_effects:
          - "sets status = REJECTED and decided_by_analyst_id"
          - "recomputes Application.exposed_sensitivity_points, then Vendor.risk_score, then Vendor.privacy_posture (same three-hop chain as ACCEPT)"
      - from: ACCEPTED
        to: REJECTED
        trigger: "POST /data-element-commitments/{commitmentId}/decide with disposition == REJECT"
        actor: PrivacyAnalyst
        preconditions:
          - "commitment.status == ACCEPTED (this is the compensating edge; the PROPOSED -> REJECTED edge above covers the never-accepted case)"
          - "X-User-ID != review.assigned_analyst_id (segregation of duties: the assignee proposes, a different analyst dispositions)"
          - "review.status NOT IN {CLEARED, CONDITIONAL, BLOCKED}"
        side_effects:
          - "sets status = REJECTED and decided_by_analyst_id"
          - "recomputes Application.exposed_sensitivity_points, restoring it to the value it held before this row was accepted, then recomputes Vendor.risk_score and Vendor.privacy_posture"
        note: "compensating action for PROPOSED -> ACCEPTED; the conserved quantity Application.exposed_sensitivity_points must return to its pre-accept value with zero drift"

  - entity: CatalogEntry
    shape: linear_with_hold_and_supersede
    initial_state: PUBLISHED
    terminal_states: [REVOKED, SUPERSEDED]
    transitions:
      - from: PUBLISHED
        to: EXPIRING_SOON
        trigger: "system, on POST /compliance-sweeps"
        actor: system
        preconditions:
          - "entry.status == PUBLISHED"
          - "entry.reauthorization_due_at <= current logical clock < entry.expires_at"
        side_effects:
          - "sets CatalogEntry.status = EXPIRING_SOON"
      - from: EXPIRING_SOON
        to: EXPIRED
        trigger: "system, on POST /compliance-sweeps"
        actor: system
        preconditions:
          - "entry.status IN {PUBLISHED, EXPIRING_SOON}"
          - "entry.expires_at <= current logical clock"
        side_effects:
          - "sets CatalogEntry.status = EXPIRED"
          - "recomputes Application.catalog_visibility, which becomes HIDDEN once no PUBLISHED or EXPIRING_SOON entry remains"
        note: "a PUBLISHED entry whose expires_at is already past skips EXPIRING_SOON and lands on EXPIRED in a single sweep"
      - from: EXPIRING_SOON
        to: SUSPENDED_HOLD
        trigger: "system, cascade hop 3 of POST /vendors/{vendorId}/suspend"
        preconditions:
          - "the owning Application's Vendor transitioned to SUSPENDED in this request"
        side_effects:
          - "hold_restored_from := EXPIRING_SOON"
          - "Application.catalog_visibility := calculations.application_catalog_visibility"
      - from: PUBLISHED
        to: SUSPENDED_HOLD
        trigger: "system, cascade hop 3 of POST /vendors/{vendorId}/suspend"
        actor: system
        preconditions:
          - "entry.status IN {PUBLISHED, EXPIRING_SOON}"
          - "the vendor of entry.application_id has just moved to privacy_posture == FROZEN"
        side_effects:
          - "sets status = SUSPENDED_HOLD and hold_restored_from = the status the entry left"
      - from: SUSPENDED_HOLD
        to: PUBLISHED
        trigger: "system, compensation hop 3 of POST /vendors/{vendorId}/reinstate"
        actor: system
        preconditions:
          - "entry.status == SUSPENDED_HOLD"
          - "the vendor's privacy_posture just left FROZEN"
          - "current logical clock < entry.reauthorization_due_at"
        side_effects:
          - "sets status = PUBLISHED"
          - "recomputes Application.catalog_visibility to VISIBLE"
        note: "the reinstate restore branch picks PUBLISHED, EXPIRING_SOON or EXPIRED purely from the clock position, never from hold_restored_from"
      - from: SUSPENDED_HOLD
        to: EXPIRING_SOON
        trigger: "system, compensation hop 3 of POST /vendors/{vendorId}/reinstate"
        actor: system
        preconditions:
          - "entry.status == SUSPENDED_HOLD"
          - "entry.reauthorization_due_at <= current logical clock < entry.expires_at"
        side_effects:
          - "sets status = EXPIRING_SOON"
          - "recomputes Application.catalog_visibility to VISIBLE"
      - from: SUSPENDED_HOLD
        to: EXPIRED
        trigger: "system, compensation hop 3 of POST /vendors/{vendorId}/reinstate"
        actor: system
        preconditions:
          - "entry.status == SUSPENDED_HOLD"
          - "entry.expires_at <= current logical clock"
        side_effects:
          - "sets status = EXPIRED"
          - "Application.catalog_visibility stays HIDDEN"
      - from: PUBLISHED
        to: REVOKED
        trigger: "POST /catalog-entries/{entryId}/revoke"
        actor: PrivacyOfficeAdmin
        preconditions:
          - "entry.status IN {PUBLISHED, EXPIRING_SOON, SUSPENDED_HOLD}"
        side_effects:
          - "sets status = REVOKED and revoked_reason"
          - "recomputes Application.catalog_visibility"
      - from: EXPIRING_SOON
        to: SUPERSEDED
        trigger: "POST /catalog-entries/{entryId}/reauthorize"
        actor: PrivacyOfficeAdmin
        preconditions:
          - "entry.status IN {EXPIRING_SOON, EXPIRED}"
          - "expected_application_version == application.version"
          - "vendor.privacy_posture IN {CLEAR, WATCH}"
          - "the review named by the payload review_id has status IN {CLEARED, CONDITIONAL} and application_id == entry.application_id"
          - "the requested window does not overlap any CatalogEntry of the same application with status IN {PUBLISHED, EXPIRING_SOON, SUSPENDED_HOLD} other than this entry"
        side_effects:
          - "sets this entry status = SUPERSEDED"
          - "creates a successor CatalogEntry in PUBLISHED with predecessor_entry_id = this entry's id and published_review_score snapshotted from the payload review's final_compliance_score"
          - "recomputes Vendor.risk_score with the live variant AND Vendor.reauthorization_risk_score with the reauthorization variant of calculations.vendor_risk_score"
          - "recomputes Application.catalog_visibility"
          - "increments Application.version by 1"
      - from: EXPIRED
        to: SUPERSEDED
        trigger: "POST /catalog-entries/{entryId}/reauthorize"
        actor: PrivacyOfficeAdmin
        preconditions:
          - "identical to the EXPIRING_SOON -> SUPERSEDED preconditions"
        side_effects:
          - "identical to the EXPIRING_SOON -> SUPERSEDED side effects"

  - entity: TelemetryDetection
    shape: branching
    initial_state: NEW
    terminal_states: [CONFIRMED_AUTHORIZED, BLOCKED, WHITELISTED, ESCALATED]
    transitions:
      - from: NEW
        to: CONFIRMED_AUTHORIZED
        trigger: "POST /telemetry-detections/{detectionId}/triage with disposition == CONFIRM_AUTHORIZED"
        actor: PrivacyOfficeAdmin
        preconditions:
          - "detection.status == NEW"
          - "detection.classification == AUTHORIZED"
        side_effects:
          - "sets status = CONFIRMED_AUTHORIZED and triaged_by_user_id = the acting X-User-ID"
      - from: NEW
        to: BLOCKED
        trigger: "POST /telemetry-detections/{detectionId}/triage with disposition == BLOCK"
        actor: PrivacyOfficeAdmin
        preconditions:
          - "detection.status == NEW"
          - "detection.classification IN {UNAUTHORIZED, EXPIRED_AUTHORIZATION, UNKNOWN_DOMAIN}"
        side_effects:
          - "sets status = BLOCKED and triaged_by_user_id"
      - from: NEW
        to: WHITELISTED
        trigger: "POST /telemetry-detections/{detectionId}/triage with disposition == WHITELIST"
        actor: PrivacyOfficeAdmin
        preconditions:
          - "detection.status == NEW"
          - "detection.classification IN {UNAUTHORIZED, EXPIRED_AUTHORIZATION}"
          - "detection.application_id is not null AND a CatalogEntry of that application has status IN {PUBLISHED, EXPIRING_SOON} with effective_from <= current logical clock < expires_at"
        side_effects:
          - "sets status = WHITELISTED and triaged_by_user_id"
        note: "cross-entity guard: the detection's disposition depends on CatalogEntry state evaluated at the CURRENT clock, not at observed_at"
      - from: NEW
        to: ESCALATED
        trigger: "POST /telemetry-detections/{detectionId}/triage with disposition == ESCALATE"
        actor: PrivacyOfficeAdmin
        preconditions:
          - "detection.status == NEW"
          - "detection.classification IN {UNAUTHORIZED, EXPIRED_AUTHORIZATION}"
          - "detection.application_id is not null"
        side_effects:
          - "CASCADE HOP 1 — sets status = ESCALATED and triaged_by_user_id"
          - "CASCADE HOP 2 — because the detection became ESCALATED, a VendorIncident is created for the application's vendor with incident_type = UNAUTHORIZED_DISCLOSURE, detected_at = detection.observed_at, affected_student_count = detection.distinct_user_count, max_data_tier = the greatest sensitivity_tier among ACCEPTED DataElementCommitment rows of that application's most recently created DataPracticeReview (1 when none), response_status = REPORTED; detection.linked_incident_id is set to the new row"
          - "CASCADE HOP 3 — because a REPORTED incident now exists, Vendor.open_incident_count and Vendor.risk_score (live variant) are recomputed"
          - "CASCADE HOP 4 — because Vendor.risk_score and the open incident set changed, Vendor.privacy_posture is re-evaluated"
        note: "the escalation-created incident bypasses the incident window buffer check, which only guards POST /vendor-incidents"

  - entity: VendorIncident
    shape: independent_state_dimensions
    state_dimensions:
      response_status: "REPORTED -> CONTAINED -> {REMEDIATED, ESCALATED}"
      notification_status: "PENDING -> {SENT, OVERDUE}; OVERDUE -> SENT_LATE"
    initial_state: "response_status=REPORTED, notification_status=PENDING"
    terminal_states: ["response_status IN {REMEDIATED, ESCALATED}", "notification_status IN {SENT, SENT_LATE}"]
    transitions:
      - from: REPORTED
        to: CONTAINED
        trigger: "POST /vendor-incidents/{incidentId}/contain"
        actor: VendorLiaison
        preconditions:
          - "incident.response_status == REPORTED"
          - "X-User-ID == incident.vendor_id"
          - "payload contained_at, when supplied, is >= detected_at and <= current logical clock"
        side_effects:
          - "sets response_status = CONTAINED and contained_at = payload contained_at or the current logical clock"
          - "recomputes Vendor.risk_score (live variant) then Vendor.privacy_posture; posture leaves FROZEN when the CRITICAL-REPORTED branch no longer applies"
        note: "does not touch notification_status; the two dimensions advance independently"
      - from: CONTAINED
        to: REMEDIATED
        trigger: "POST /vendor-incidents/{incidentId}/resolve with disposition == REMEDIATE"
        actor: PrivacyOfficeAdmin
        preconditions:
          - "incident.response_status == CONTAINED"
        side_effects:
          - "sets response_status = REMEDIATED and remediation_note"
          - "recomputes Vendor.open_incident_count, Vendor.risk_score (live variant) then Vendor.privacy_posture"
      - from: CONTAINED
        to: ESCALATED
        trigger: "POST /vendor-incidents/{incidentId}/resolve with disposition == ESCALATE"
        actor: PrivacyOfficeAdmin
        preconditions:
          - "incident.response_status == CONTAINED"
        side_effects:
          - "sets response_status = ESCALATED and remediation_note"
          - "Vendor.open_incident_count keeps counting this row, so Vendor.privacy_posture stays RESTRICTED or FROZEN"
      - from: PENDING
        to: SENT
        trigger: "POST /vendor-incidents/{incidentId}/send-notification"
        actor: VendorLiaison
        preconditions:
          - "incident.notification_status IN {PENDING, OVERDUE}"
          - "X-User-ID == incident.vendor_id"
          - "current logical clock <= incident.notification_due_at"
        side_effects:
          - "sets notification_status = SENT, notification_sent_at = current logical clock, notified_party_count = payload notified_party_count or 0"
      - from: PENDING
        to: OVERDUE
        trigger: "system, on POST /compliance-sweeps"
        actor: system
        preconditions:
          - "incident.notification_status == PENDING"
          - "incident.notification_due_at < current logical clock"
        side_effects:
          - "sets notification_status = OVERDUE"
          - "because an OVERDUE notification now exists, Vendor.privacy_posture is re-evaluated and becomes FROZEN"
      - from: OVERDUE
        to: SENT_LATE
        trigger: "POST /vendor-incidents/{incidentId}/send-notification"
        actor: VendorLiaison
        preconditions:
          - "incident.notification_status IN {PENDING, OVERDUE}"
          - "X-User-ID == incident.vendor_id"
        side_effects:
          - "sets notification_status = SENT_LATE and notification_sent_at = current logical clock"
          - "because no OVERDUE notification remains, Vendor.privacy_posture is re-evaluated"
      - from: PENDING
        to: SENT_LATE
        trigger: "POST /vendor-incidents/{incidentId}/send-notification"
        actor: VendorLiaison
        preconditions:
          - "incident.notification_status IN {PENDING, OVERDUE}"
          - "X-User-ID == incident.vendor_id"
          - "current logical clock > incident.notification_due_at"
        side_effects:
          - "sets notification_status = SENT_LATE and notification_sent_at = current logical clock"
        note: "a vendor that notifies after the deadline without waiting for a sweep lands directly on SENT_LATE"

# ============================================================================
# §1.2.1 Concurrency Rules — OCC on the parent's `version` only
# ============================================================================
concurrency_rules:
  - rule_id: commitment-create-stale-review
    parent_entity: DataPracticeReview
    write_endpoint: "POST /data-element-commitments"
    occ_field: "expected_review_version"
    description: |
      Authoring a DataElementCommitment against a DataPracticeReview whose
      version has advanced since the client last read it is rejected with 412.
      This captures the case where a commitment for the same element_code was
      already re-authored — which legitimately supersedes the prior PROPOSED
      row per the DataElementCommitment PROPOSED -> SUPERSEDED transition — so
      the current writer's view of the review, its round_number and its
      commitment set is stale and its own commitment could silently supersede
      a row it never saw.
    error_id: ERR_STALE_REVIEW_VERSION
    http_status: 412

  - rule_id: reauthorization-stale-application
    parent_entity: Application
    write_endpoint: "POST /catalog-entries/{entryId}/reauthorize"
    occ_field: "expected_application_version"
    description: |
      Reauthorizing a CatalogEntry while the parent Application's version has
      advanced since the client last read it is rejected with 412. Publication
      eligibility is read off the Application row itself (sso_verified,
      accessibility_conformance_level, vpat_on_file, status,
      exposed_sensitivity_points), so a successor entry minted from a stale
      view of the Application would carry an authorization the district never
      re-confirmed.
    error_id: ERR_STALE_APPLICATION_VERSION
    http_status: 412

# ============================================================================
# §1.3 Calculation Rules Table
# ============================================================================
calculations:

  - name: element_sensitivity_tier
    trigger: "on POST /data-element-commitments, at row creation"
    algorithm: lookup
    formula: |
      TIER_BY_ELEMENT = {
        STUDENT_NAME: 1, GRADE_LEVEL: 1, PARENT_CONTACT: 1,
        STUDENT_ID: 2, EMAIL: 2, DOB: 2,
        GEOLOCATION: 3, BEHAVIORAL_TELEMETRY: 3, PHOTO_VIDEO: 3,
        IEP_STATUS: 4, HEALTH_RECORD: 4, BIOMETRIC: 4, DISCIPLINE_RECORD: 4
      }
      sensitivity_tier = TIER_BY_ELEMENT[element_code]
    input_set: "the element_code supplied on the create call; no other rows participate"
    constants:
      TIER_BY_ELEMENT: "see formula"
    precision: "integer 1..4"

  - name: application_max_permitted_tier
    trigger: "on POST /applications, at row creation; never recomputed because category is immutable"
    algorithm: lookup
    formula: |
      MAX_TIER_BY_CATEGORY = {
        INSTRUCTIONAL_CONTENT: 2,
        COMMUNICATION: 3,
        ANALYTICS: 3,
        ASSESSMENT: 4,
        ADMINISTRATIVE: 4
      }
      max_permitted_tier = MAX_TIER_BY_CATEGORY[category]
    input_set: "the category supplied on the create call"
    constants:
      MAX_TIER_BY_CATEGORY: "see formula"
    precision: "integer 1..4"

  - name: commitment_is_minimized
    trigger: "on POST /data-element-commitments and on POST /data-element-commitments/{commitmentId}/decide"
    algorithm: threshold
    formula: |
      is_minimized = (sensitivity_tier <= application.max_permitted_tier)
                     AND (retention_days <= RETENTION_SOFT_CAP_DAYS)
                     AND (deletion_method != 'AGGREGATE_ONLY')
                     AND (len(justified_purpose) >= PURPOSE_MIN_CHARS)
      # application is the Application named by review.application_id
    input_set: "this commitment row only, joined to its review's Application for max_permitted_tier"
    constants:
      RETENTION_SOFT_CAP_DAYS: 365
      PURPOSE_MIN_CHARS: 40
    precision: "boolean; the retention comparison is <=, so retention_days == 365 IS minimized and 366 is not"

  - name: exposed_sensitivity_points
    trigger: "on POST /data-element-commitments/{commitmentId}/decide (both ACCEPT and REJECT), and on the PROPOSED -> SUPERSEDED system transition"
    algorithm: weighted_scoring
    formula: |
      TIER_WEIGHT      = { 1: 1.00, 2: 2.50, 3: 6.00, 4: 13.00 }
      retention_multiplier(d) = 1.00 if d <= 90
                                else 1.25 if d <= 365
                                else 1.60 if d <= 730
                                else 2.10
      DELETION_MULTIPLIER = { HARD_DELETE: 1.00, ANONYMIZE: 1.15, AGGREGATE_ONLY: 1.45 }

      # ROUNDING ORDER IS PINNED: round EACH element's contribution to 2
      # decimals FIRST, then sum the rounded contributions, then round the sum.
      # "sum the raw products then round once" is the WRONG order and produces a
      # different number of cents-equivalents.
      for each c in input_set (ordered by c.created_at ASC):
          c.element_points = round_half_up(
              TIER_WEIGHT[c.sensitivity_tier]
            * retention_multiplier(c.retention_days)
            * DELETION_MULTIPLIER[c.deletion_method], 2)
      exposed_sensitivity_points = round_half_up(sum(c.element_points for c in input_set), 2)
    input_set: |
      All DataElementCommitment rows whose review_id belongs to a
      DataPracticeReview with application_id == this Application's id AND whose
      status == ACCEPTED. Rows with status IN {PROPOSED, REJECTED, SUPERSEDED}
      are excluded. Summation order is created_at ASC; because every addend is
      already rounded to 2 decimals the order does not change the total, but it
      is pinned so element_points assignment is reproducible.
    constants:
      TIER_WEIGHT: "{1: 1.00, 2: 2.50, 3: 6.00, 4: 13.00}"
      DELETION_MULTIPLIER: "{HARD_DELETE: 1.00, ANONYMIZE: 1.15, AGGREGATE_ONLY: 1.45}"
    precision: "2 decimal places, round_half_up, applied twice: once per element and once to the sum"

  - name: request_priority_score
    trigger: "on POST /application-requests/{requestId}/submit (both the initial submit and every resubmit)"
    algorithm: threshold
    formula: |
      # STEP 1 — raw score
      grade_band_span   = grade_band_high - grade_band_low + 1
      justification_bonus = 15 if len(instructional_justification) >= 400
                            else 8 if len(instructional_justification) >= 240
                            else 0
      raw = 20 * grade_band_span + 0.01 * student_count_estimate + justification_bonus

      # STEP 2 — band is derived from `raw`, i.e. from the PRE-multiplier value.
      priority_band = 'HIGH'     if raw >= 60
                      else 'STANDARD' if raw >= 30
                      else 'LOW'

      # STEP 3 — multiplier selected by the band from step 2
      BAND_MULTIPLIER = { HIGH: 1.20, STANDARD: 1.10, LOW: 0.85 }

      # STEP 4 — final score
      priority_score = round_half_up(raw * BAND_MULTIPLIER[priority_band], 2)

      # EVALUATION ORDER IS PINNED. The dependency looks circular because the
      # multiplier depends on the band and the band looks like a property of the
      # score. It is not: the band is a function of `raw` ONLY and is never
      # re-derived from priority_score. Re-deriving the band from priority_score
      # flips STANDARD rows whose raw * 1.10 crosses 60 into HIGH and yields a
      # different stored priority_band and a different score.
    input_set: "this request row's own fields at submit time, after any payload overrides have been applied"
    constants:
      BAND_MULTIPLIER: "{HIGH: 1.20, STANDARD: 1.10, LOW: 0.85}"
      JUSTIFICATION_LONG_CHARS: 400
      JUSTIFICATION_MED_CHARS: 240
    precision: "2 decimal places, round_half_up; priority_band is an enum, not rounded"

  - name: review_compliance_score
    trigger: "provisional variant on POST /data-practice-reviews/{reviewId}/issue-findings; final variant on POST /data-practice-reviews/{reviewId}/decide"
    algorithm: weighted_scoring
    formula: |
      REQUIRED_FRAMEWORKS = {FERPA, COPPA, PPRA, STATE_ADDENDUM}
      framework_coverage_ratio = len(review.framework_set INTERSECT REQUIRED_FRAMEWORKS) / 4

      S = the variant-specific commitment input set (see variants)

      minimization_ratio = (count(c in S where c.is_minimized) / count(S)) if count(S) > 0 else 0.0

      retention_factor = 0.0 if count(S) == 0
        else 1.0 if (every c in S has retention_days <= 365
                     AND every c in S has deletion_method != 'AGGREGATE_ONLY')
        else 0.5 if (every c in S has retention_days <= 730)
        else 0.0

      subprocessor_factor =
          0.0 if vendor.subprocessor_disclosure_complete == false
          else 0.0 if vendor.flagged_subprocessor_count > 0
          else 0.5 if any Subprocessor of the vendor with status IN {DISCLOSED, VERIFIED}
                       has sub_breach_notification_hours > vendor.breach_notification_hours
          else 1.0

      accessibility_factor =
          1.0 if application.accessibility_conformance_level IN {WCAG21_AA, WCAG21_AAA}
                 AND application.vpat_on_file == true
          else 0.5 if application.accessibility_conformance_level == 'WCAG21_A'
                 AND application.vpat_on_file == true
          else 0.0

      sso_factor = 1.0 if application.sso_protocol IN {SAML2, OIDC, LTI13}
                          AND application.sso_verified == true
                   else 0.0

      base = 30 * framework_coverage_ratio
           + 25 * minimization_ratio
           + 15 * retention_factor
           + 15 * subprocessor_factor
           + 10 * accessibility_factor
           +  5 * sso_factor

      penalty = variant-specific (see variants)

      score = round_half_up(max(0.0, min(100.0, base - penalty)), 2)
    input_set: "variant-specific; see variants[].difference"
    constants:
      WEIGHT_FRAMEWORK: 30
      WEIGHT_MINIMIZATION: 25
      WEIGHT_RETENTION: 15
      WEIGHT_SUBPROCESSOR: 15
      WEIGHT_ACCESSIBILITY: 10
      WEIGHT_SSO: 5
      FINDING_PENALTY_POINTS: 8
      FLAGGED_SUBPROCESSOR_PENALTY_POINTS: 12
      MISSING_ADDENDUM_PENALTY_POINTS: 20
    precision: "2 decimal places, round_half_up; clamped to [0, 100] BEFORE rounding"
    variants:
      - name: provisional
        when: "written to DataPracticeReview.provisional_compliance_score on every issue-findings call"
        difference: |
          S = DataElementCommitment rows of this review with status IN {PROPOSED, ACCEPTED}
          (optimistic: rows the vendor has proposed are credited as if they will be accepted).
          penalty = 8 * review.open_findings_count + 12 * vendor.flagged_subprocessor_count
          The missing-addendum penalty is NOT applied in this variant.
      - name: final
        when: "written to DataPracticeReview.final_compliance_score exactly once, on the decide call"
        difference: |
          S = DataElementCommitment rows of this review with status == ACCEPTED only
          (pessimistic: proposed-but-undecided rows are dropped from both the
          minimization ratio and the retention factor).
          penalty = 8 * review.unresolved_findings_count
                  + 12 * vendor.flagged_subprocessor_count
                  + (0 if vendor.signed_state_addendum else 20)
          Identical stored data therefore yields a different number under the two
          variants: the input-set filter differs AND the penalty terms differ.

  - name: vendor_risk_score
    trigger: |
      live variant on POST /subprocessors, POST /subprocessors/{subprocessorId}/review,
      POST /data-element-commitments/{commitmentId}/decide, POST /vendor-incidents,
      POST /vendor-incidents/{incidentId}/contain, .../send-notification, .../resolve,
      POST /data-practice-reviews/{reviewId}/decide, POST /compliance-sweeps, and
      POST /catalog-entries/{entryId}/reauthorize; reauthorization variant only on
      POST /catalog-entries/{entryId}/reauthorize
    algorithm: decay_function
    formula: |
      sensitivity_load = round_half_up(
          sum(app.exposed_sensitivity_points
              for app in Applications with vendor_id == vendor.id
              and app.status IN {IN_REVIEW, APPROVED, APPROVED_WITH_CONDITIONS})
          * 0.5, 2)

      foreign_subprocessor_penalty = 10 * count(Subprocessor rows of this vendor
          with status IN {DISCLOSED, VERIFIED, FLAGGED} and country_code != 'US')

      breach_term_penalty = 0  if vendor.breach_notification_hours <= 72
                            else 10 if vendor.breach_notification_hours <= 168
                            else 25

      SEVERITY_WEIGHT = { LOW: 3, MODERATE: 8, HIGH: 18, CRITICAL: 30 }
      age_days(i) = floor((current_logical_clock - i.detected_at) / 24 hours)
      decay(i)    = 1.0 if age_days(i) <= 90
                    else 0.5 if age_days(i) <= 365
                    else 0.0
      incident_load = sum(SEVERITY_WEIGHT[i.severity] * decay(i)
                          for i in VendorIncident rows of this vendor
                          whose response_status is in the variant-specific scope)

      risk_score = round_half_up(min(100.0,
          sensitivity_load + foreign_subprocessor_penalty
        + breach_term_penalty + incident_load), 2)
    input_set: "this vendor's Application, Subprocessor and VendorIncident children; the incident scope is variant-specific"
    constants:
      SENSITIVITY_LOAD_FACTOR: 0.5
      FOREIGN_SUBPROCESSOR_PENALTY_POINTS: 10
      BREACH_TERM_TIER_1_HOURS: 72
      BREACH_TERM_TIER_2_HOURS: 168
      SEVERITY_WEIGHT: "{LOW: 3, MODERATE: 8, HIGH: 18, CRITICAL: 30}"
      DECAY_FULL_DAYS: 90
      DECAY_HALF_DAYS: 365
    precision: "2 decimal places, round_half_up; clamped to a 100.00 ceiling BEFORE rounding"
    variants:
      - name: live
        when: "written to Vendor.risk_score on every trigger listed above"
        difference: |
          incident scope = response_status IN {REPORTED, CONTAINED, ESCALATED, REMEDIATED}.
          A remediated incident still weighs on the vendor until decay retires it.
      - name: reauthorization
        when: "written to Vendor.reauthorization_risk_score only during POST /catalog-entries/{entryId}/reauthorize"
        difference: |
          incident scope = response_status IN {REPORTED, CONTAINED, ESCALATED}.
          Remediated incidents are forgiven for the purpose of annual
          reauthorization, so identical stored rows yield a strictly lower
          number than the live variant whenever any REMEDIATED incident with
          non-zero decay exists.

  - name: vendor_privacy_posture
    trigger: "recomputed at the end of every transition whose side effects name it, and on POST /compliance-sweeps"
    algorithm: constraint_propagation
    formula: |
      # FIRST MATCH WINS, evaluated strictly top to bottom.
      1. FROZEN     if vendor.status == 'SUSPENDED'
                    OR any VendorIncident of this vendor has notification_status == 'OVERDUE'
                    OR any VendorIncident of this vendor has severity == 'CRITICAL'
                       AND response_status == 'REPORTED'
      2. RESTRICTED if vendor.flagged_subprocessor_count > 0
                    OR any VendorIncident of this vendor has
                       response_status IN {REPORTED, CONTAINED, ESCALATED}
      3. WATCH      if vendor.risk_score >= POSTURE_WATCH_THRESHOLD
      4. CLEAR      otherwise
      # risk_score is ALWAYS recomputed before posture in any side-effect list
      # that names both, so posture never reads a stale score.
    input_set: "vendor.status, vendor.flagged_subprocessor_count, vendor.risk_score, and all VendorIncident rows of this vendor"
    constants:
      POSTURE_WATCH_THRESHOLD: 45
    precision: "enum; the WATCH comparison is >=, so risk_score == 45.00 is WATCH and 44.99 is CLEAR"

  - name: analyst_allocated_minutes
    trigger: "on POST /data-practice-reviews, POST /data-practice-reviews/{reviewId}/reassign, and POST /data-practice-reviews/{reviewId}/decide"
    algorithm: aggregation
    formula: |
      allocated_review_minutes = sum(r.estimated_minutes
          for r in DataPracticeReview rows
          where r.assigned_analyst_id == analyst.id
            and r.status IN {SCREENING, FINDINGS_ISSUED, REMEDIATION_SUBMITTED})
    input_set: |
      DataPracticeReview rows assigned to this analyst whose status is in the
      non-terminal set {SCREENING, FINDINGS_ISSUED, REMEDIATION_SUBMITTED};
      rows in {CLEARED, CONDITIONAL, BLOCKED} are excluded. Full recompute, not
      an incremental delta, so no drift can accumulate.
    constants: {}
    precision: "integer minutes"

  - name: incident_severity
    trigger: "on POST /vendor-incidents and on the ESCALATE cascade that mints an incident"
    algorithm: threshold
    formula: |
      severity = 'CRITICAL' if affected_student_count >= 1000 OR max_data_tier == 4
                 else 'HIGH'     if affected_student_count >= 100
                 else 'MODERATE' if affected_student_count >= 10
                 else 'LOW'
    input_set: "this incident row's affected_student_count and max_data_tier"
    constants:
      CRITICAL_STUDENT_THRESHOLD: 1000
      HIGH_STUDENT_THRESHOLD: 100
      MODERATE_STUDENT_THRESHOLD: 10
    precision: "enum; every comparison is >=, so affected_student_count == 1000 is CRITICAL and 999 with max_data_tier <= 3 is HIGH"

  - name: incident_notification_due_at
    trigger: "on POST /vendor-incidents and on the ESCALATE cascade that mints an incident"
    algorithm: threshold
    formula: |
      STATUTORY_MAX_HOURS = { CRITICAL: 24, HIGH: 48, MODERATE: 72, LOW: 168 }
      effective_hours = min(vendor.breach_notification_hours,
                            STATUTORY_MAX_HOURS[severity])
      notification_due_at = detected_at + effective_hours hours
    input_set: "this incident row's detected_at and severity, plus vendor.breach_notification_hours"
    constants:
      STATUTORY_MAX_HOURS: "{CRITICAL: 24, HIGH: 48, MODERATE: 72, LOW: 168}"
    precision: "ISO 8601 UTC with three fractional digits; the contractual term and the statutory ceiling are combined with min(), never with max()"

  - name: detection_classification
    trigger: "on POST /telemetry-detections, at row creation"
    algorithm: interval_merge
    formula: |
      # SELECTOR — evaluated strictly top to bottom, first match wins.
      1. if application_id is null:
             classification = 'UNKNOWN_DOMAIN'; matched_catalog_entry_id = null
      2. candidate set A = CatalogEntry rows with application_id == detection.application_id
             AND status IN {PUBLISHED, EXPIRING_SOON}
             AND effective_from <= observed_at < expires_at        # HALF-OPEN
         if A is non-empty:
             classification = 'AUTHORIZED'
             matched_catalog_entry_id = the row of A with the greatest expires_at;
                 tie-break: created_at ASC
      3. candidate set B = CatalogEntry rows with application_id == detection.application_id
             AND status IN {PUBLISHED, EXPIRING_SOON, EXPIRED, SUPERSEDED}
             AND expires_at <= observed_at
             # REVOKED rows are deliberately excluded: a revoked authorization is
             # not an expired one.
         if B is non-empty:
             classification = 'EXPIRED_AUTHORIZATION'
             matched_catalog_entry_id = the row of B with the greatest expires_at;
                 tie-break: created_at ASC
      4. classification = 'UNAUTHORIZED'; matched_catalog_entry_id = null
    input_set: "all CatalogEntry rows of detection.application_id, filtered per the selector above; no other application's entries participate"
    constants: {}
    precision: |
      Interval semantics are HALF-OPEN [effective_from, expires_at): an
      observation exactly at effective_from is inside the window, an observation
      exactly at expires_at is outside it and falls through to branch 3.

  - name: detection_exposure_score
    trigger: "on POST /telemetry-detections, immediately after detection_classification"
    algorithm: weighted_scoring
    formula: |
      CLASS_BASE = { AUTHORIZED: 0, EXPIRED_AUTHORIZATION: 25,
                     UNAUTHORIZED: 45, UNKNOWN_DOMAIN: 30 }
      exposure_score = round_half_up(min(100.0,
            distinct_user_count * 0.4
          + session_count * 0.05
          + CLASS_BASE[classification]), 2)
    input_set: "this detection row only"
    constants:
      USER_WEIGHT: 0.4
      SESSION_WEIGHT: 0.05
      CLASS_BASE: "{AUTHORIZED: 0, EXPIRED_AUTHORIZATION: 25, UNAUTHORIZED: 45, UNKNOWN_DOMAIN: 30}"
    precision: "2 decimal places, round_half_up; clamped to a 100.00 ceiling BEFORE rounding"

  - name: catalog_reauthorization_due_at
    trigger: "on POST /catalog-entries and on the successor row minted by POST /catalog-entries/{entryId}/reauthorize"
    algorithm: threshold
    formula: |
      reauthorization_due_at = expires_at - REAUTHORIZATION_LEAD_DAYS days
    input_set: "this entry's expires_at"
    constants:
      REAUTHORIZATION_LEAD_DAYS: 30
    precision: "ISO 8601 UTC with three fractional digits"

  - name: application_catalog_visibility
    trigger: "on POST /catalog-entries, .../revoke, .../reauthorize, POST /compliance-sweeps, and on the suspend and reinstate cascades"
    algorithm: aggregation
    formula: |
      catalog_visibility = 'VISIBLE' if any CatalogEntry with
          application_id == application.id AND status IN {PUBLISHED, EXPIRING_SOON}
          exists, else 'HIDDEN'
    input_set: "all CatalogEntry rows of this application, filtered to status IN {PUBLISHED, EXPIRING_SOON}"
    constants: {}
    precision: "enum"

# ============================================================================
# §1.4 Validation Rules Table (evaluated strictly in ascending priority order;
# the FIRST rule whose condition is violated determines the response, and no
# later rule is evaluated)
# ============================================================================
validations:

  # ---- 1-2: authentication and authorization -------------------------------
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are both present and non-empty on every request"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "X-User-Role is one of the five declared roles AND that role appears in the target endpoint's roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  # ---- 3: request shape ----------------------------------------------------
  - priority: 3
    category: business_constraint
    check: |
      Request shape: every required input field present; no unknown fields; each
      field of the declared JSON type; every enum value drawn from the declared
      set; integers inside their declared ranges (breach_notification_hours
      1..720, data_deletion_days 1..3650, retention_days 1..1825,
      estimated_minutes 15..1200, review_capacity_minutes 60..12000,
      student_count_estimate 1..50000, grade_band_low/high 0..12 with low <= high,
      max_data_tier 1..4, affected_student_count 0..500000,
      distinct_user_count 0..100000, session_count 0..1000000); every timestamp a
      valid ISO 8601 UTC instant; pagination limit 1..100 (default 10) and
      offset >= 0 (default 0); expires_at > effective_from on catalog writes.
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"

  # ---- 4-5: existence ------------------------------------------------------
  - priority: 4
    category: existence
    check: "Every id in the request PATH resolves to a stored row, validated left-to-right"
    error_id: "ERR_VENDOR_NOT_FOUND | ERR_SUBPROCESSOR_NOT_FOUND | ERR_APPLICATION_NOT_FOUND | ERR_TEACHER_NOT_FOUND | ERR_ANALYST_NOT_FOUND | ERR_REQUEST_NOT_FOUND | ERR_REVIEW_NOT_FOUND | ERR_COMMITMENT_NOT_FOUND | ERR_CATALOG_ENTRY_NOT_FOUND | ERR_DETECTION_NOT_FOUND | ERR_INCIDENT_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path parameters"

  - priority: 5
    category: existence
    check: |
      Every foreign-key id in the request BODY resolves to a stored row,
      validated in the field order declared by the endpoint's input list
      (e.g. POST /application-requests validates application_id before
      requester_teacher_id; POST /data-practice-reviews validates
      source_request_id before assigned_analyst_id).
    error_id: "same catalog as priority 4, selected by the referenced entity"
    http_status: 404
    applies_to: "all endpoints whose input contains a foreign-key field"

  # ---- 6-7: identity-bound authorization -----------------------------------
  - priority: 6
    category: auth
    check: |
      Ownership. When X-User-Role == Teacher, X-User-ID MUST equal
      request.requester_teacher_id on POST /application-requests/{requestId}/submit
      and on GET /application-requests/{requestId}. When X-User-Role ==
      VendorLiaison, X-User-ID MUST equal the vendor_id reached from the target
      row (subprocessor.vendor_id, application.vendor_id,
      review.vendor_id, incident.vendor_id).
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /application-requests, POST /application-requests/{requestId}/submit, GET /application-requests/{requestId}, POST /subprocessors, POST /data-practice-reviews/{reviewId}/submit-remediation, POST /vendor-incidents"

  - priority: 7
    category: auth
    check: |
      Segregation of duties on every terminal disposition. On
      POST /data-practice-reviews/{reviewId}/decide the acting PrivacyAnalyst
      MUST have credential_level == 'LEAD' AND X-User-ID MUST NOT equal
      review.assigned_analyst_id. On
      POST /data-element-commitments/{commitmentId}/decide the acting analyst
      MUST NOT be the analyst assigned to the commitment's review. On
      POST /catalog-entries the publishing PrivacyOfficeAdmin is unrestricted,
      but a PrivacyAnalyst acting on that endpoint MUST NOT be
      review.decided_by_analyst_id.
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /data-practice-reviews/{reviewId}/decide, POST /data-element-commitments/{commitmentId}/decide, POST /catalog-entries"

  # ---- 8-20: state preconditions ------------------------------------------
  - priority: 8
    category: state
    check: "ApplicationRequest.status must be DRAFT or RETURNED to submit, and SUBMITTED to triage"
    error_id: ERR_REQUEST_STATE_INVALID
    http_status: 409
    applies_to: "POST /application-requests/{requestId}/submit, POST /application-requests/{requestId}/triage"

  - priority: 9
    category: state
    check: "Vendor.status must be APPROVED or CONDITIONAL to be suspended, and must be SUSPENDED to be reinstated"
    error_id: ERR_VENDOR_STATE_INVALID
    http_status: 409
    applies_to: "POST /vendors/{vendorId}/suspend, POST /vendors/{vendorId}/reinstate"

  - priority: 10
    category: state
    check: "The ApplicationRequest named by source_request_id must be in status TRIAGED_FOR_REVIEW"
    error_id: ERR_REQUEST_NOT_TRIAGED
    http_status: 409
    applies_to: "POST /data-practice-reviews"

  - priority: 11
    category: state
    check: |
      DataPracticeReview.status gate: SCREENING or REMEDIATION_SUBMITTED to
      issue-findings; FINDINGS_ISSUED to submit-remediation; SCREENING or
      REMEDIATION_SUBMITTED is the only non-terminal status refused for decide
      (a review can never be decided straight out of SCREENING — at least one
      findings round is mandatory), while a review that is ALREADY in CLEARED,
      CONDITIONAL or BLOCKED is deliberately left to priority 12 so that
      ERR_REVIEW_ALREADY_DECIDED stays reachable; SCREENING only to reassign
      (once findings are on the record the review stays with its analyst);
      SCREENING, FINDINGS_ISSUED or REMEDIATION_SUBMITTED to attach a new
      DataElementCommitment.
    error_id: ERR_REVIEW_STATE_INVALID
    http_status: 409
    applies_to: "POST /data-practice-reviews/{reviewId}/issue-findings, POST /data-practice-reviews/{reviewId}/submit-remediation, POST /data-practice-reviews/{reviewId}/decide, POST /data-practice-reviews/{reviewId}/reassign, POST /data-element-commitments"

  - priority: 12
    category: state
    check: "DataPracticeReview.status must not already be CLEARED, CONDITIONAL or BLOCKED when decide is called"
    error_id: ERR_REVIEW_ALREADY_DECIDED
    http_status: 409
    applies_to: "POST /data-practice-reviews/{reviewId}/decide"

  - priority: 13
    category: state
    check: "DataElementCommitment.status must be PROPOSED or ACCEPTED to be decided; REJECTED and SUPERSEDED are terminal"
    error_id: ERR_COMMITMENT_ALREADY_DECIDED
    http_status: 409
    applies_to: "POST /data-element-commitments/{commitmentId}/decide"

  - priority: 14
    category: state
    check: "CatalogEntry.status must be PUBLISHED, EXPIRING_SOON or SUSPENDED_HOLD to be revoked"
    error_id: ERR_CATALOG_ENTRY_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /catalog-entries/{entryId}/revoke"

  - priority: 15
    category: state
    check: "CatalogEntry.status must be EXPIRING_SOON or EXPIRED to be reauthorized. A still-fresh PUBLISHED entry is NOT renewable: the nightly POST /compliance-sweeps must first move it into the reauthorization window, so reauthorization has a hard cross-entity dependency on the sweep."
    error_id: ERR_CATALOG_ENTRY_NOT_RENEWABLE
    http_status: 409
    applies_to: "POST /catalog-entries/{entryId}/reauthorize"

  - priority: 16
    category: state
    check: "TelemetryDetection.status must be NEW to be triaged"
    error_id: ERR_DETECTION_ALREADY_TRIAGED
    http_status: 409
    applies_to: "POST /telemetry-detections/{detectionId}/triage"

  - priority: 17
    category: state
    check: "VendorIncident.response_status must be REPORTED to be contained, and CONTAINED to be resolved"
    error_id: ERR_INCIDENT_STATE_INVALID
    http_status: 409
    applies_to: "POST /vendor-incidents/{incidentId}/contain, POST /vendor-incidents/{incidentId}/resolve"

  - priority: 18
    category: state
    check: "VendorIncident.notification_status must be PENDING or OVERDUE to send a notification; SENT and SENT_LATE are terminal for this dimension"
    error_id: ERR_NOTIFICATION_ALREADY_SENT
    http_status: 409
    applies_to: "POST /vendor-incidents/{incidentId}/send-notification"

  - priority: 19
    category: state
    check: "Subprocessor.status must be DISCLOSED, VERIFIED or FLAGGED to be reviewed; REMOVED is terminal"
    error_id: ERR_SUBPROCESSOR_STATE_INVALID
    http_status: 409
    applies_to: "POST /subprocessors/{subprocessorId}/review"

  - priority: 20
    category: state
    check: "Application.status must be CANDIDATE, IN_REVIEW, APPROVED or APPROVED_WITH_CONDITIONS for attest-integration; only BLOCKED applications cannot re-attest (an approved application must still be able to complete its SSO and accessibility attestation, because those two facts are gated at publication time, i.e. after the review has already been decided)"
    error_id: ERR_APPLICATION_STATE_INVALID
    http_status: 409
    applies_to: "POST /applications/{applicationId}/attest-integration"

  # ---- 21-22: optimistic concurrency --------------------------------------
  - priority: 21
    category: state
    check: "expected_review_version must equal the current DataPracticeReview.version"
    error_id: ERR_STALE_REVIEW_VERSION
    http_status: 412
    applies_to: "POST /data-element-commitments"

  - priority: 22
    category: state
    check: "expected_application_version must equal the current Application.version"
    error_id: ERR_STALE_APPLICATION_VERSION
    http_status: 412
    applies_to: "POST /catalog-entries/{entryId}/reauthorize"

  # ---- 23-28: business_safety (student-privacy compliance first) ----------
  - priority: 23
    category: business_safety
    check: |
      The Vendor reached from the target row must not have
      privacy_posture == 'FROZEN'. A frozen vendor cannot receive new
      application requests, cannot have commitments accepted, and cannot have a
      catalog entry published or reauthorized.
    error_id: ERR_VENDOR_POSTURE_FROZEN
    http_status: 409
    applies_to: "POST /application-requests/{requestId}/submit, POST /data-element-commitments/{commitmentId}/decide, POST /catalog-entries, POST /catalog-entries/{entryId}/reauthorize"

  - priority: 24
    category: business_safety
    check: "Publishing a catalog entry requires the Vendor's privacy_posture to be CLEAR or WATCH; RESTRICTED (and FROZEN, already caught at 23) blocks publication"
    error_id: ERR_VENDOR_POSTURE_BLOCKS_PUBLICATION
    http_status: 409
    applies_to: "POST /catalog-entries"

  - priority: 25
    category: business_safety
    check: |
      Tier-conditional retention ceiling:
      TIER_RETENTION_CAP = {1: 1825, 2: 1825, 3: 730, 4: 365}
      retention_days must be <= TIER_RETENTION_CAP[sensitivity_tier] derived
      from the submitted element_code. This is a conditional cap layered on top
      of the unconditional 1..1825 range check at priority 3.
    error_id: ERR_RETENTION_EXCEEDS_STATUTORY_CAP
    http_status: 422
    applies_to: "POST /data-element-commitments"

  - priority: 26
    category: business_safety
    check: "A commitment whose sensitivity_tier exceeds the Application's max_permitted_tier may be PROPOSED but may never be ACCEPTED"
    error_id: ERR_ELEMENT_TIER_NOT_PERMITTED
    http_status: 422
    applies_to: "POST /data-element-commitments/{commitmentId}/decide"

  - priority: 27
    category: business_safety
    check: "A Subprocessor may only be VERIFIED when its sub_breach_notification_hours <= the parent Vendor's breach_notification_hours"
    error_id: ERR_SUBPROCESSOR_NOTIFICATION_TERMS_WEAKER
    http_status: 422
    applies_to: "POST /subprocessors/{subprocessorId}/review"

  - priority: 28
    category: business_safety
    check: "Publication requires vendor.subprocessor_disclosure_complete == true"
    error_id: ERR_SUBPROCESSOR_DISCLOSURE_INCOMPLETE
    http_status: 422
    applies_to: "POST /catalog-entries"

  # ---- 29-30: business_referential ----------------------------------------
  - priority: 29
    category: business_referential
    check: "The DataPracticeReview named by review_id must be in status CLEARED or CONDITIONAL, and its application_id must equal the submitted application_id"
    error_id: ERR_REVIEW_NOT_CLEARED
    http_status: 422
    applies_to: "POST /catalog-entries"

  - priority: 30
    category: business_referential
    check: "Triage disposition WHITELIST requires the detection's matched_catalog_entry_id to be non-null and that CatalogEntry to be in status PUBLISHED or EXPIRING_SOON"
    error_id: ERR_WHITELIST_REQUIRES_ACTIVE_ENTRY
    http_status: 422
    applies_to: "POST /telemetry-detections/{detectionId}/triage"

  # ---- 31-33: business_temporal -------------------------------------------
  - priority: 31
    category: business_temporal
    check: |
      No two non-terminal CatalogEntry rows of the same Application may have
      overlapping authorization windows. Windows are HALF-OPEN
      [effective_from, expires_at) with ZERO buffer, compared against existing
      rows in status {PUBLISHED, EXPIRING_SOON, SUSPENDED_HOLD}. Adjacency is
      LEGAL: new.effective_from == existing.expires_at succeeds.
    error_id: ERR_AUTHORIZATION_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /catalog-entries, POST /catalog-entries/{entryId}/reauthorize"

  - priority: 32
    category: business_temporal
    check: |
      No two VendorIncident rows of the same Vendor may have colliding
      containment windows. Semantics are pinned as follows and are deliberately
      the OPPOSITE convention from priority 31:
        base(i)     = [i.detected_at,
                       coalesce(i.contained_at, i.detected_at + INCIDENT_WINDOW_HOURS)]
                      -- a CLOSED interval, INCIDENT_WINDOW_HOURS = 72
        expanded(e) = [base(e).start - INCIDENT_COOLING_BUFFER_HOURS,
                       base(e).end   + INCIDENT_COOLING_BUFFER_HOURS]
                      -- the buffer (72h) is applied to the EXISTING row only
        proposed    = base(new)      -- the incoming row is NOT buffered
      Conflict iff proposed and expanded(e) intersect as CLOSED intervals
      (proposed.start <= expanded(e).end AND proposed.end >= expanded(e).start)
      for any existing row e of the same vendor with response_status IN
      {REPORTED, CONTAINED, ESCALATED, REMEDIATED}. Touching endpoints COLLIDE.
    error_id: ERR_INCIDENT_WINDOW_BUFFER_CONFLICT
    http_status: 409
    applies_to: "POST /vendor-incidents"

  - priority: 33
    category: business_temporal
    check: "Remediation must be submitted at or before review.remediation_due_at, compared against the logical clock (inclusive: exactly at the due instant succeeds)"
    error_id: ERR_REMEDIATION_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /data-practice-reviews/{reviewId}/submit-remediation"

  # ---- 34-41: business_constraint -----------------------------------------
  - priority: 34
    category: business_constraint
    check: "instructional_justification must be at least JUSTIFICATION_MIN_CHARS = 120 characters at submit time"
    error_id: ERR_JUSTIFICATION_TOO_SHORT
    http_status: 422
    applies_to: "POST /application-requests/{requestId}/submit"

  - priority: 35
    category: business_constraint
    check: "requested_data_elements must contain at least one element_code at submit time"
    error_id: ERR_NO_DATA_ELEMENTS
    http_status: 422
    applies_to: "POST /application-requests/{requestId}/submit"

  - priority: 36
    category: business_constraint
    check: "A returned request may be resubmitted only while revision_round < REVISION_ROUND_MAX = 2; the third resubmit is refused"
    error_id: ERR_REVISION_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "POST /application-requests/{requestId}/submit"

  - priority: 37
    category: business_constraint
    check: "issue-findings may not push round_number beyond FINDINGS_ROUND_MAX = 3"
    error_id: ERR_REMEDIATION_ROUND_LIMIT
    http_status: 409
    applies_to: "POST /data-practice-reviews/{reviewId}/issue-findings"

  - priority: 38
    category: business_constraint
    check: "Publication requires application.accessibility_conformance_level IN {WCAG21_AA, WCAG21_AAA} AND application.vpat_on_file == true"
    error_id: ERR_ACCESSIBILITY_CONFORMANCE_INSUFFICIENT
    http_status: 422
    applies_to: "POST /catalog-entries"

  - priority: 39
    category: business_constraint
    check: "Publication requires application.sso_protocol != NONE AND application.sso_verified == true"
    error_id: ERR_SSO_NOT_VERIFIED
    http_status: 422
    applies_to: "POST /catalog-entries"

  - priority: 40
    category: business_constraint
    check: "The published authorized grade band must be contained in the Application's own band: authorized_grade_band_low >= application.grade_band_low AND authorized_grade_band_high <= application.grade_band_high"
    error_id: ERR_GRADE_BAND_OUT_OF_SCOPE
    http_status: 422
    applies_to: "POST /catalog-entries, POST /catalog-entries/{entryId}/reauthorize"

  - priority: 41
    category: business_constraint
    check: |
      The submitted disposition must be applicable to the target row:
      review decide CLEAR requires unresolved_findings_count == 0;
      review decide CONDITIONAL requires unresolved_findings_count > 0;
      commitment decide ACCEPT requires status == PROPOSED (an ACCEPTED row can
      only be REJECTED, never re-accepted);
      subprocessor review VERIFY requires status == DISCLOSED, and REMOVE
      requires status IN {VERIFIED, FLAGGED} (a DISCLOSED row must be verified
      or flagged before it can be removed);
      detection triage CONFIRM_AUTHORIZED requires classification == AUTHORIZED.
    error_id: ERR_DISPOSITION_NOT_APPLICABLE
    http_status: 422
    applies_to: "POST /data-practice-reviews/{reviewId}/decide, POST /data-element-commitments/{commitmentId}/decide, POST /subprocessors/{subprocessorId}/review, POST /telemetry-detections/{detectionId}/triage"

  # ---- 42: business_fiscal (capacity is checked LAST, by design) ----------
  - priority: 42
    category: business_fiscal
    check: |
      Analyst capacity: analyst.allocated_review_minutes (recomputed over the
      analyst's non-terminal reviews) + estimated_minutes must be <=
      analyst.review_capacity_minutes. Because this sits at the very bottom of
      the ladder, every state, safety, referential, temporal and constraint
      failure on the same request wins over a capacity failure.
    error_id: ERR_ANALYST_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /data-practice-reviews, POST /data-practice-reviews/{reviewId}/reassign"

# ============================================================================
# §1.5 API Endpoint Table
# All paths are absolute because api_prefix is "" (flat topology).
# Every list endpoint accepts limit (1..100, default 10) and offset (>=0,
# default 0) and returns the paginated envelope of §1.0.
# ============================================================================
endpoints:

  # ---------------- Vendor ----------------
  - method: POST
    path: "/vendors"
    description: "Register a vendor in the district privacy registry."
    roles: [PrivacyOfficeAdmin]
    code: 201
    input: [legal_name, hq_country_code, breach_notification_hours, data_deletion_days, "signed_state_addendum?", "subprocessor_disclosure_complete?"]
    output: Vendor
    side_effects:
      - "status := REGISTERED; open_incident_count := 0; flagged_subprocessor_count := 0"
      - "risk_score := calculations.vendor_risk_score (live variant, empty children so the breach_term_penalty is the only non-zero term)"
      - "reauthorization_risk_score := 0.00"
      - "privacy_posture := calculations.vendor_privacy_posture"

  - method: GET
    path: "/vendors"
    description: "List vendors, filterable by registry status and computed privacy posture."
    roles: [PrivacyOfficeAdmin, PrivacyAnalyst]
    code: 200
    input: ["status?", "privacy_posture?", "limit?", "offset?"]
    output: Vendor[]
    side_effects: []

  - method: GET
    path: "/vendors/{vendorId}"
    description: "Read one vendor including its computed risk score and privacy posture."
    roles: [PrivacyOfficeAdmin, PrivacyAnalyst, VendorLiaison, Teacher]
    code: 200
    input: []
    output: Vendor
    side_effects: []

  - method: POST
    path: "/vendors/{vendorId}/suspend"
    description: "Suspend a vendor district-wide and cascade the suspension through its catalog."
    roles: [PrivacyOfficeAdmin]
    code: 200
    input: [reason]
    output: Vendor
    side_effects:
      - "Vendor.status := SUSPENDED; suspended_at := logical clock"
      - "every CatalogEntry in {PUBLISHED, EXPIRING_SOON} of every Application of this vendor := SUSPENDED_HOLD, recording hold_restored_from := its pre-hold status"
      - "each affected Application.catalog_visibility := calculations.application_catalog_visibility"
      - "Vendor.risk_score := calculations.vendor_risk_score (live)"
      - "Vendor.privacy_posture := calculations.vendor_privacy_posture (always FROZEN after this call)"
      - "increments Vendor.version by 1"

  - method: POST
    path: "/vendors/{vendorId}/reinstate"
    description: "Lift a district-wide suspension and restore the catalog entries the suspension held."
    roles: [PrivacyOfficeAdmin]
    code: 200
    input: ["note?"]
    output: Vendor
    side_effects:
      - "Vendor.status := APPROVED; suspended_at := null"
      - "every CatalogEntry in SUSPENDED_HOLD of this vendor's Applications := its hold_restored_from value, then hold_restored_from := null; an entry whose expires_at is now at or before the logical clock lands in EXPIRED instead"
      - "each affected Application.catalog_visibility := calculations.application_catalog_visibility"
      - "Vendor.risk_score := calculations.vendor_risk_score (live)"
      - "Vendor.privacy_posture := calculations.vendor_privacy_posture"
      - "increments Vendor.version by 1"

  # ---------------- Subprocessor ----------------
  - method: POST
    path: "/subprocessors"
    description: "Disclose a subprocessor for a vendor; processor_vendor_id links to another registered vendor when the subprocessor is itself in the registry."
    roles: [VendorLiaison, PrivacyOfficeAdmin]
    code: 201
    input: [vendor_id, "processor_vendor_id?", name, country_code, data_categories, purpose, sub_breach_notification_hours]
    output: Subprocessor
    side_effects:
      - "status := DISCLOSED"
      - "Vendor.risk_score := calculations.vendor_risk_score (live) — a non-US country_code adds the foreign-subprocessor penalty immediately"
      - "Vendor.privacy_posture := calculations.vendor_privacy_posture"

  - method: GET
    path: "/subprocessors"
    description: "List subprocessors. Filter by vendor_id for the disclosing vendor's chain, or by processor_vendor_id for the reverse self-referential edge."
    roles: [PrivacyOfficeAdmin, PrivacyAnalyst, VendorLiaison]
    code: 200
    input: ["vendor_id?", "processor_vendor_id?", "status?", "country_code?", "limit?", "offset?"]
    output: Subprocessor[]
    side_effects: []

  - method: GET
    path: "/subprocessors/{subprocessorId}"
    description: "Read one disclosed subprocessor."
    roles: [PrivacyOfficeAdmin, PrivacyAnalyst, VendorLiaison]
    code: 200
    input: []
    output: Subprocessor
    side_effects: []

  - method: POST
    path: "/subprocessors/{subprocessorId}/review"
    description: "Record an analyst disposition on a disclosed subprocessor. disposition is one of VERIFY, FLAG, REMOVE."
    roles: [PrivacyAnalyst]
    code: 200
    input: [disposition, "reviewed_note?"]
    output: Subprocessor
    side_effects:
      - "status := VERIFIED (VERIFY) | FLAGGED (FLAG) | REMOVED (REMOVE)"
      - "Vendor.flagged_subprocessor_count := count of this vendor's subprocessors in status FLAGGED"
      - "Vendor.risk_score := calculations.vendor_risk_score (live)"
      - "Vendor.privacy_posture := calculations.vendor_privacy_posture"

  # ---------------- Application ----------------
  - method: POST
    path: "/applications"
    description: "Register a vendor application (edtech tool) that teachers may request."
    roles: [PrivacyOfficeAdmin, VendorLiaison]
    code: 201
    input: [vendor_id, name, category, grade_band_low, grade_band_high, sso_protocol, accessibility_conformance_level, "vpat_on_file?"]
    output: Application
    side_effects:
      - "status := CANDIDATE; sso_verified := false; catalog_visibility := HIDDEN; exposed_sensitivity_points := 0.00"
      - "max_permitted_tier := calculations.application_max_permitted_tier"

  - method: GET
    path: "/applications"
    description: "List applications; the published district catalog is this list filtered to catalog_visibility=VISIBLE."
    roles: [PrivacyOfficeAdmin, PrivacyAnalyst, VendorLiaison, Teacher]
    code: 200
    input: ["vendor_id?", "status?", "category?", "catalog_visibility?", "limit?", "offset?"]
    output: Application[]
    side_effects: []

  - method: GET
    path: "/applications/{applicationId}"
    description: "Read one application including its computed sensitivity exposure and catalog visibility."
    roles: [PrivacyOfficeAdmin, PrivacyAnalyst, VendorLiaison, Teacher]
    code: 200
    input: []
    output: Application
    side_effects: []

  - method: POST
    path: "/applications/{applicationId}/attest-integration"
    description: "Record the outcome of the district single-sign-on and accessibility integration review."
    roles: [PrivacyOfficeAdmin]
    code: 200
    input: [sso_verified, "accessibility_conformance_level?", "vpat_on_file?"]
    output: Application
    side_effects:
      - "sso_verified, accessibility_conformance_level and vpat_on_file are overwritten by the supplied values (omitted optional fields are left unchanged)"
      - "increments Application.version by 1 — this is the write that a concurrent reauthorization observes as a stale expected_application_version"

  # ---------------- Teacher ----------------
  - method: POST
    path: "/teachers"
    description: "Enroll a teacher who may file application requests."
    roles: [PrivacyOfficeAdmin]
    code: 201
    input: [full_name, employee_number, school_code, grade_bands_taught]
    output: Teacher
    side_effects:
      - "status := ACTIVE; open_request_count := 0"

  - method: GET
    path: "/teachers/{teacherId}"
    description: "Read one teacher including the computed count of open requests."
    roles: [PrivacyOfficeAdmin, PrivacyAnalyst, Teacher]
    code: 200
    input: []
    output: Teacher
    side_effects: []

  # ---------------- PrivacyAnalyst ----------------
  - method: POST
    path: "/privacy-analysts"
    description: "Enroll a privacy office analyst. credential_level is one of JUNIOR, SENIOR, LEAD; only LEAD may record a final review decision."
    roles: [PrivacyOfficeAdmin]
    code: 201
    input: [full_name, credential_level, review_capacity_minutes]
    output: PrivacyAnalyst
    side_effects:
      - "status := ACTIVE; allocated_review_minutes := 0"

  - method: GET
    path: "/privacy-analysts/{analystId}"
    description: "Read one analyst including the computed allocated review minutes."
    roles: [PrivacyOfficeAdmin, PrivacyAnalyst]
    code: 200
    input: []
    output: PrivacyAnalyst
    side_effects: []

  # ---------------- ApplicationRequest ----------------
  - method: POST
    path: "/application-requests"
    description: "A teacher drafts a request to use an application, with instructional justification and the data elements it needs."
    roles: [Teacher]
    code: 201
    input: [application_id, requester_teacher_id, instructional_justification, requested_data_elements, student_count_estimate, grade_band_low, grade_band_high]
    output: ApplicationRequest
    side_effects:
      - "status := DRAFT; revision_round := 0; priority_score := 0.00; priority_band := LOW; submitted_at := null"

  - method: GET
    path: "/application-requests"
    description: "List requests. Filter by application_id or by requester_teacher_id (reverse reachability for both FKs)."
    roles: [PrivacyOfficeAdmin, PrivacyAnalyst]
    code: 200
    input: ["application_id?", "requester_teacher_id?", "status?", "priority_band?", "limit?", "offset?"]
    output: ApplicationRequest[]
    side_effects: []

  - method: GET
    path: "/application-requests/{requestId}"
    description: "Read one request. A Teacher may only read a request they filed."
    roles: [Teacher, PrivacyAnalyst, PrivacyOfficeAdmin]
    code: 200
    input: []
    output: ApplicationRequest
    side_effects: []

  - method: POST
    path: "/application-requests/{requestId}/submit"
    description: "Submit or resubmit a request. Optional fields overwrite the draft before scoring."
    roles: [Teacher]
    code: 200
    input: ["instructional_justification?", "requested_data_elements?", "student_count_estimate?"]
    output: ApplicationRequest
    side_effects:
      - "supplied optional fields overwrite the stored values first"
      - "status := SUBMITTED; submitted_at := logical clock"
      - "revision_round += 1 when the prior status was RETURNED; unchanged on the first submit"
      - "priority_score and priority_band := calculations.request_priority_score"
      - "Teacher.open_request_count := count of this teacher's requests in status {SUBMITTED, RETURNED, TRIAGED_FOR_REVIEW}"

  - method: POST
    path: "/application-requests/{requestId}/triage"
    description: "Privacy office triage. disposition is one of ACCEPT_FOR_REVIEW, RETURN, DENY."
    roles: [PrivacyAnalyst, PrivacyOfficeAdmin]
    code: 200
    input: [disposition, "triage_note?"]
    output: ApplicationRequest
    side_effects:
      - "status := TRIAGED_FOR_REVIEW (ACCEPT_FOR_REVIEW) | RETURNED (RETURN) | DENIED (DENY)"
      - "triage_note := supplied note"
      - "on ACCEPT_FOR_REVIEW the Application.status := IN_REVIEW when it was CANDIDATE"
      - "Teacher.open_request_count := recomputed over {SUBMITTED, RETURNED, TRIAGED_FOR_REVIEW}"

  # ---------------- DataPracticeReview ----------------
  - method: POST
    path: "/data-practice-reviews"
    description: "Open a data practice review against a triaged request and assign it to an analyst."
    roles: [PrivacyAnalyst, PrivacyOfficeAdmin]
    code: 201
    input: [source_request_id, assigned_analyst_id, framework_set, estimated_minutes]
    output: DataPracticeReview
    side_effects:
      - "application_id and vendor_id := copied from the source request and its application"
      - "status := SCREENING; round_number := 1; open_findings_count := 0; unresolved_findings_count := 0"
      - "PrivacyAnalyst.allocated_review_minutes := calculations.analyst_allocated_minutes for the assignee"

  - method: GET
    path: "/data-practice-reviews"
    description: "List reviews. Filters cover every declared foreign key on the entity."
    roles: [PrivacyOfficeAdmin, PrivacyAnalyst, VendorLiaison]
    code: 200
    input: ["source_request_id?", "application_id?", "vendor_id?", "assigned_analyst_id?", "decided_by_analyst_id?", "status?", "limit?", "offset?"]
    output: DataPracticeReview[]
    side_effects: []

  - method: GET
    path: "/data-practice-reviews/{reviewId}"
    description: "Read one review including both compliance-score variants."
    roles: [PrivacyOfficeAdmin, PrivacyAnalyst, VendorLiaison]
    code: 200
    input: []
    output: DataPracticeReview
    side_effects: []

  - method: POST
    path: "/data-practice-reviews/{reviewId}/issue-findings"
    description: "Issue a round of findings to the vendor and score the review provisionally."
    roles: [PrivacyAnalyst]
    code: 200
    input: [findings_count, "decision_note?"]
    output: DataPracticeReview
    side_effects:
      - "status := FINDINGS_ISSUED"
      - "round_number += 1 when the prior status was REMEDIATION_SUBMITTED; unchanged when it was SCREENING"
      - "open_findings_count := findings_count; unresolved_findings_count := findings_count"
      - "remediation_due_at := logical clock + REMEDIATION_WINDOW_HOURS (336) hours"
      - "provisional_compliance_score := calculations.review_compliance_score (provisional variant)"
      - "increments DataPracticeReview.version by 1"

  - method: POST
    path: "/data-practice-reviews/{reviewId}/submit-remediation"
    description: "Vendor answers the outstanding findings before the remediation window closes. Exclusive to VendorLiaison: the privacy office may not remediate on the vendor's behalf."
    roles: [VendorLiaison]
    code: 200
    input: [resolved_findings_count, "remediation_note?"]
    output: DataPracticeReview
    side_effects:
      - "status := REMEDIATION_SUBMITTED"
      - "unresolved_findings_count := max(0, open_findings_count - resolved_findings_count)"
      - "increments DataPracticeReview.version by 1"

  - method: POST
    path: "/data-practice-reviews/{reviewId}/decide"
    description: "A LEAD analyst who is not the assignee records the terminal decision. disposition is one of CLEAR, CONDITIONAL, BLOCK."
    roles: [PrivacyAnalyst]
    code: 200
    input: [disposition, "decision_note?"]
    output: DataPracticeReview
    side_effects:
      - "status := CLEARED (CLEAR) | CONDITIONAL (CONDITIONAL) | BLOCKED (BLOCK)"
      - "decided_by_analyst_id := X-User-ID; decision_note := supplied note"
      - "final_compliance_score := calculations.review_compliance_score (final variant)"
      - "every DataElementCommitment of this review still in PROPOSED := SUPERSEDED"
      - "Application.status := APPROVED (CLEAR) | APPROVED_WITH_CONDITIONS (CONDITIONAL) | BLOCKED (BLOCK)"
      - "Application.exposed_sensitivity_points := calculations.exposed_sensitivity_points"
      - "source ApplicationRequest.status := CLOSED_APPROVED on CLEAR or CONDITIONAL, CLOSED_BLOCKED on BLOCK"
      - "requesting Teacher.open_request_count := recomputed"
      - "assigned PrivacyAnalyst.allocated_review_minutes := calculations.analyst_allocated_minutes (the review has left the non-terminal set)"
      - "Vendor.status := APPROVED (CLEAR) | CONDITIONAL (CONDITIONAL) | REJECTED (BLOCK) when the vendor was REGISTERED or UNDER_REVIEW"
      - "Vendor.risk_score := calculations.vendor_risk_score (live); then Vendor.privacy_posture := calculations.vendor_privacy_posture"
      - "increments DataPracticeReview.version by 1"

  - method: POST
    path: "/data-practice-reviews/{reviewId}/reassign"
    description: "Move a non-terminal review to a different analyst; workload moves with it."
    roles: [PrivacyOfficeAdmin]
    code: 200
    input: [assigned_analyst_id]
    output: DataPracticeReview
    side_effects:
      - "assigned_analyst_id := the supplied analyst"
      - "the outgoing analyst's allocated_review_minutes := calculations.analyst_allocated_minutes"
      - "the incoming analyst's allocated_review_minutes := calculations.analyst_allocated_minutes"
      - "increments DataPracticeReview.version by 1"

  # ---------------- DataElementCommitment ----------------
  - method: POST
    path: "/data-element-commitments"
    description: "Attach a data-element retention and deletion commitment to an open review. Carries the review's optimistic-concurrency token."
    roles: [VendorLiaison, PrivacyAnalyst]
    code: 201
    input: [review_id, element_code, justified_purpose, retention_days, deletion_method, expected_review_version]
    output: DataElementCommitment
    side_effects:
      - "sensitivity_tier := calculations.element_sensitivity_tier"
      - "is_minimized := calculations.commitment_is_minimized"
      - "element_points := the per-element term of calculations.exposed_sensitivity_points"
      - "status := PROPOSED"
      - "any earlier PROPOSED commitment on the same review with the same element_code := SUPERSEDED with superseded_by_commitment_id := this row's id"
      - "increments DataPracticeReview.version by 1"

  - method: GET
    path: "/data-element-commitments"
    description: "List commitments. Filter by review_id, by superseded_by_commitment_id for the self-referential supersede chain, or by decided_by_analyst_id."
    roles: [PrivacyOfficeAdmin, PrivacyAnalyst, VendorLiaison]
    code: 200
    input: ["review_id?", "superseded_by_commitment_id?", "decided_by_analyst_id?", "status?", "element_code?", "limit?", "offset?"]
    output: DataElementCommitment[]
    side_effects: []

  - method: GET
    path: "/data-element-commitments/{commitmentId}"
    description: "Read one commitment including its computed tier, minimization flag and element points."
    roles: [PrivacyOfficeAdmin, PrivacyAnalyst, VendorLiaison]
    code: 200
    input: []
    output: DataElementCommitment
    side_effects: []

  - method: POST
    path: "/data-element-commitments/{commitmentId}/decide"
    description: "Accept or reject a proposed commitment, or compensate a previously accepted one by rejecting it. disposition is one of ACCEPT, REJECT."
    roles: [PrivacyAnalyst]
    code: 200
    input: [disposition]
    output: DataElementCommitment
    side_effects:
      - "status := ACCEPTED (ACCEPT) | REJECTED (REJECT, from either PROPOSED or ACCEPTED)"
      - "decided_by_analyst_id := X-User-ID"
      - "Application.exposed_sensitivity_points := calculations.exposed_sensitivity_points (recomputed from scratch, so rejecting a previously ACCEPTED row restores the prior total exactly)"
      - "Vendor.risk_score := calculations.vendor_risk_score (live)"
      - "Vendor.privacy_posture := calculations.vendor_privacy_posture"

  # ---------------- CatalogEntry ----------------
  - method: POST
    path: "/catalog-entries"
    description: "Publish an approved application to the district catalog for a bounded authorization window."
    roles: [PrivacyOfficeAdmin, PrivacyAnalyst]
    code: 201
    input: [application_id, review_id, effective_from, expires_at, authorized_grade_band_low, authorized_grade_band_high]
    output: CatalogEntry
    side_effects:
      - "status := PUBLISHED; predecessor_entry_id := null"
      - "reauthorization_due_at := calculations.catalog_reauthorization_due_at"
      - "published_review_score := the review's final_compliance_score, snapshotted at publication and never recomputed"
      - "Application.catalog_visibility := calculations.application_catalog_visibility"

  - method: GET
    path: "/catalog-entries"
    description: "List catalog entries. Filter by application_id, review_id, or predecessor_entry_id for the reauthorization chain."
    roles: [PrivacyOfficeAdmin, PrivacyAnalyst, VendorLiaison, Teacher]
    code: 200
    input: ["application_id?", "review_id?", "predecessor_entry_id?", "status?", "limit?", "offset?"]
    output: CatalogEntry[]
    side_effects: []

  - method: GET
    path: "/catalog-entries/{entryId}"
    description: "Read one catalog entry."
    roles: [PrivacyOfficeAdmin, PrivacyAnalyst, VendorLiaison, Teacher]
    code: 200
    input: []
    output: CatalogEntry
    side_effects: []

  - method: POST
    path: "/catalog-entries/{entryId}/revoke"
    description: "Revoke a published authorization ahead of its expiry."
    roles: [PrivacyOfficeAdmin]
    code: 200
    input: [revoked_reason]
    output: CatalogEntry
    side_effects:
      - "status := REVOKED; revoked_reason := supplied reason; hold_restored_from := null"
      - "Application.catalog_visibility := calculations.application_catalog_visibility"

  - method: POST
    path: "/catalog-entries/{entryId}/reauthorize"
    description: "Annual reauthorization: mints a successor entry chained to this one and computes the reauthorization risk variant. Carries the Application's optimistic-concurrency token."
    roles: [PrivacyOfficeAdmin]
    code: 201
    input: [expires_at, "authorized_grade_band_low?", "authorized_grade_band_high?", expected_application_version]
    output: CatalogEntry
    side_effects:
      - "Vendor.reauthorization_risk_score := calculations.vendor_risk_score (reauthorization variant)"
      - "Vendor.risk_score := calculations.vendor_risk_score (live variant), then Vendor.privacy_posture := calculations.vendor_privacy_posture"
      - "the predecessor entry := SUPERSEDED"
      - "a new CatalogEntry row is created with predecessor_entry_id := the predecessor's id, effective_from := the predecessor's expires_at (adjacency, which is legal under the half-open window rule), expires_at := the supplied value, status := PUBLISHED, and the grade band inherited from the predecessor when the optional fields are omitted"
      - "the new row's reauthorization_due_at := calculations.catalog_reauthorization_due_at and published_review_score := the predecessor's published_review_score"
      - "Application.catalog_visibility := calculations.application_catalog_visibility"
      - "increments Application.version by 1"

  - method: POST
    path: "/compliance-sweeps"
    description: "Run the nightly catalog and notification sweep against the current logical clock. Idempotent for a fixed clock."
    roles: [PrivacyOfficeAdmin]
    code: 200
    input: []
    output: { evaluated_entry_count: integer, expiring_soon_count: integer, expired_count: integer, overdue_notification_count: integer, recomputed_vendor_count: integer }
    side_effects:
      - "every PUBLISHED CatalogEntry whose reauthorization_due_at <= clock < expires_at := EXPIRING_SOON"
      - "every PUBLISHED or EXPIRING_SOON CatalogEntry whose expires_at <= clock := EXPIRED"
      - "every VendorIncident with notification_status PENDING whose notification_due_at < clock := OVERDUE"
      - "every touched Application.catalog_visibility := calculations.application_catalog_visibility"
      - "every touched Vendor.risk_score := calculations.vendor_risk_score (live), then privacy_posture := calculations.vendor_privacy_posture"

  # ---------------- TelemetryDetection ----------------
  - method: POST
    path: "/telemetry-detections"
    description: "Ingest one network, browser-extension or MDM observation of an application domain in use. Exclusive to TelemetryAgent: humans may read and triage detections but never mint them."
    roles: [TelemetryAgent]
    code: 201
    input: [observed_domain, "application_id?", school_code, source, observed_at, distinct_user_count, session_count]
    output: TelemetryDetection
    side_effects:
      - "classification and matched_catalog_entry_id := calculations.detection_classification"
      - "exposure_score := calculations.detection_exposure_score"
      - "status := NEW"

  - method: GET
    path: "/telemetry-detections"
    description: "List detections. Filter by application_id, matched_catalog_entry_id or linked_incident_id."
    roles: [PrivacyOfficeAdmin, PrivacyAnalyst]
    code: 200
    input: ["application_id?", "matched_catalog_entry_id?", "linked_incident_id?", "classification?", "status?", "school_code?", "limit?", "offset?"]
    output: TelemetryDetection[]
    side_effects: []

  - method: GET
    path: "/telemetry-detections/{detectionId}"
    description: "Read one detection including its computed classification and exposure score."
    roles: [PrivacyOfficeAdmin, PrivacyAnalyst]
    code: 200
    input: []
    output: TelemetryDetection
    side_effects: []

  - method: POST
    path: "/telemetry-detections/{detectionId}/triage"
    description: "Triage an unauthorized-application detection. disposition is one of CONFIRM_AUTHORIZED, BLOCK, WHITELIST, ESCALATE. ESCALATE mints a VendorIncident."
    roles: [PrivacyOfficeAdmin, PrivacyAnalyst]
    code: 200
    input: [disposition, "note?", "affected_student_count?", "max_data_tier?"]
    output: TelemetryDetection
    side_effects:
      - "status := CONFIRMED_AUTHORIZED | BLOCKED | WHITELISTED | ESCALATED per the disposition"
      - "triaged_by_user_id := X-User-ID"
      - "on ESCALATE a VendorIncident is created for the matched application's vendor with incident_type := UNAUTHORIZED_DISCLOSURE, detected_at := the detection's observed_at, affected_student_count := the supplied value or the detection's distinct_user_count when omitted, max_data_tier := the supplied value or 3 when omitted; linked_incident_id := that incident's id"
      - "on ESCALATE the new incident's severity and notification_due_at := calculations.incident_severity and calculations.incident_notification_due_at; Vendor.open_incident_count, risk_score and privacy_posture are recomputed"

  # ---------------- VendorIncident ----------------
  - method: POST
    path: "/vendor-incidents"
    description: "Report a vendor privacy incident. The statutory notification deadline is derived from severity and the contractual term."
    roles: [VendorLiaison, PrivacyOfficeAdmin]
    code: 201
    input: [vendor_id, incident_type, detected_at, affected_student_count, max_data_tier]
    output: VendorIncident
    side_effects:
      - "reported_at := logical clock; response_status := REPORTED; notification_status := PENDING; notified_party_count := 0"
      - "severity := calculations.incident_severity"
      - "notification_due_at := calculations.incident_notification_due_at"
      - "Vendor.open_incident_count := count of this vendor's incidents whose response_status is in {REPORTED, CONTAINED, ESCALATED}"
      - "Vendor.risk_score := calculations.vendor_risk_score (live), then Vendor.privacy_posture := calculations.vendor_privacy_posture"

  - method: GET
    path: "/vendor-incidents"
    description: "List incidents for a vendor across both status dimensions."
    roles: [PrivacyOfficeAdmin, PrivacyAnalyst, VendorLiaison]
    code: 200
    input: ["vendor_id?", "response_status?", "notification_status?", "severity?", "limit?", "offset?"]
    output: VendorIncident[]
    side_effects: []

  - method: GET
    path: "/vendor-incidents/{incidentId}"
    description: "Read one incident including both independent status dimensions."
    roles: [PrivacyOfficeAdmin, PrivacyAnalyst, VendorLiaison]
    code: 200
    input: []
    output: VendorIncident
    side_effects: []

  - method: POST
    path: "/vendor-incidents/{incidentId}/contain"
    description: "Record containment of a reported incident. Touches only the response dimension."
    roles: [VendorLiaison, PrivacyOfficeAdmin]
    code: 200
    input: [contained_at, "remediation_note?"]
    output: VendorIncident
    side_effects:
      - "response_status := CONTAINED; contained_at := the supplied instant"
      - "notification_status is deliberately NOT touched"
      - "Vendor.risk_score := calculations.vendor_risk_score (live), then Vendor.privacy_posture := calculations.vendor_privacy_posture"

  - method: POST
    path: "/vendor-incidents/{incidentId}/send-notification"
    description: "Record that the district notified affected parties. Touches only the notification dimension."
    roles: [PrivacyOfficeAdmin]
    code: 200
    input: [notified_party_count]
    output: VendorIncident
    side_effects:
      - "notification_sent_at := logical clock; notified_party_count := the supplied count"
      - "notification_status := SENT when the clock is at or before notification_due_at, SENT_LATE otherwise"
      - "response_status is deliberately NOT touched"
      - "Vendor.privacy_posture := calculations.vendor_privacy_posture (clearing an OVERDUE notification can lift FROZEN)"

  - method: POST
    path: "/vendor-incidents/{incidentId}/resolve"
    description: "Close out the response dimension. disposition is one of REMEDIATE, ESCALATE."
    roles: [PrivacyOfficeAdmin]
    code: 200
    input: [disposition, "remediation_note?"]
    output: VendorIncident
    side_effects:
      - "response_status := REMEDIATED (REMEDIATE) | ESCALATED (ESCALATE)"
      - "remediation_note := supplied note"
      - "Vendor.open_incident_count := recomputed over {REPORTED, CONTAINED, ESCALATED}"
      - "Vendor.risk_score := calculations.vendor_risk_score (live) — REMEDIATED incidents stay in the live scope"
      - "Vendor.privacy_posture := calculations.vendor_privacy_posture"

  # ---------------- test-driving surface ----------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical UTC clock, which every deadline, expiry, decay and window rule reads. Before the first call the clock reads exactly 2026-08-01T00:00:00Z; it never falls back to wall-clock time."
    roles: [PrivacyOfficeAdmin]
    code: 200
    input: [current_utc]
    output: { current_utc: string }
    side_effects:
      - "the logical clock is set; no entity row is modified and no sweep is implied — POST /compliance-sweeps must be called explicitly"

# ============================================================================
# §1.6 Error Code Catalog
# ============================================================================
errors:

  # ---- authentication / authorization ----
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, empty, or whitespace-only"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "X-User-Role is unknown, or the role is not listed in the target endpoint's roles"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "The acting Teacher is not the request's requester_teacher_id, or the acting VendorLiaison is not the vendor reached from the target row"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The acting analyst is not a LEAD, or is the same analyst who authored the work being dispositioned"

  # ---- request shape ----
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing required field, unknown field, wrong type, enum value outside the declared set, integer outside its declared range, malformed ISO 8601 instant, pagination limit outside 1..100 or negative offset, or expires_at <= effective_from"

  # ---- existence ----
  - id: ERR_VENDOR_NOT_FOUND
    http: 404
    condition: "vendorId in the path, or vendor_id / processor_vendor_id in the body, names no stored Vendor"
  - id: ERR_SUBPROCESSOR_NOT_FOUND
    http: 404
    condition: "subprocessorId names no stored Subprocessor"
  - id: ERR_APPLICATION_NOT_FOUND
    http: 404
    condition: "applicationId in the path, or application_id in the body, names no stored Application"
  - id: ERR_TEACHER_NOT_FOUND
    http: 404
    condition: "teacherId in the path, or requester_teacher_id in the body, names no stored Teacher"
  - id: ERR_ANALYST_NOT_FOUND
    http: 404
    condition: "analystId in the path, or assigned_analyst_id in the body, names no stored PrivacyAnalyst"
  - id: ERR_REQUEST_NOT_FOUND
    http: 404
    condition: "requestId in the path, or source_request_id in the body, names no stored ApplicationRequest"
  - id: ERR_REVIEW_NOT_FOUND
    http: 404
    condition: "reviewId in the path, or review_id in the body, names no stored DataPracticeReview"
  - id: ERR_COMMITMENT_NOT_FOUND
    http: 404
    condition: "commitmentId names no stored DataElementCommitment"
  - id: ERR_CATALOG_ENTRY_NOT_FOUND
    http: 404
    condition: "entryId names no stored CatalogEntry"
  - id: ERR_DETECTION_NOT_FOUND
    http: 404
    condition: "detectionId names no stored TelemetryDetection"
  - id: ERR_INCIDENT_NOT_FOUND
    http: 404
    condition: "incidentId names no stored VendorIncident"

  # ---- state preconditions ----
  - id: ERR_REQUEST_STATE_INVALID
    http: 409
    condition: "Submit attempted on a request that is not DRAFT or RETURNED, or triage attempted on a request that is not SUBMITTED"
  - id: ERR_VENDOR_STATE_INVALID
    http: 409
    condition: "Suspend attempted on a vendor that is not APPROVED or CONDITIONAL, or reinstate attempted on a vendor that is not SUSPENDED"
  - id: ERR_REQUEST_NOT_TRIAGED
    http: 409
    condition: "A data practice review is opened against a request whose status is not TRIAGED_FOR_REVIEW"
  - id: ERR_REVIEW_STATE_INVALID
    http: 409
    condition: "issue-findings, submit-remediation, decide, reassign or commitment attachment attempted from a review status that does not permit it (in particular, decide from SCREENING)"
  - id: ERR_REVIEW_ALREADY_DECIDED
    http: 409
    condition: "decide attempted on a review already in CLEARED, CONDITIONAL or BLOCKED"
  - id: ERR_COMMITMENT_ALREADY_DECIDED
    http: 409
    condition: "Any disposition attempted on a commitment already in REJECTED or SUPERSEDED"
  - id: ERR_CATALOG_ENTRY_NOT_ACTIVE
    http: 409
    condition: "Revoke attempted on an entry that is not PUBLISHED, EXPIRING_SOON or SUSPENDED_HOLD"
  - id: ERR_CATALOG_ENTRY_NOT_RENEWABLE
    http: 409
    condition: "Reauthorize attempted on an entry in PUBLISHED, REVOKED, SUSPENDED_HOLD or SUPERSEDED — only EXPIRING_SOON and EXPIRED are renewable"
  - id: ERR_DETECTION_ALREADY_TRIAGED
    http: 409
    condition: "Triage attempted on a detection whose status is not NEW"
  - id: ERR_INCIDENT_STATE_INVALID
    http: 409
    condition: "Contain attempted on an incident whose response_status is not REPORTED, or resolve attempted on one whose response_status is not CONTAINED"
  - id: ERR_NOTIFICATION_ALREADY_SENT
    http: 409
    condition: "send-notification attempted when notification_status is already SENT or SENT_LATE"
  - id: ERR_SUBPROCESSOR_STATE_INVALID
    http: 409
    condition: "Review attempted on a subprocessor already in REMOVED"
  - id: ERR_APPLICATION_STATE_INVALID
    http: 409
    condition: "attest-integration attempted on an application whose status is BLOCKED"

  # ---- optimistic concurrency ----
  - id: ERR_STALE_REVIEW_VERSION
    http: 412
    condition: "expected_review_version does not equal the current DataPracticeReview.version"
  - id: ERR_STALE_APPLICATION_VERSION
    http: 412
    condition: "expected_application_version does not equal the current Application.version"

  # ---- business_safety ----
  - id: ERR_VENDOR_POSTURE_FROZEN
    http: 409
    condition: "The vendor reached from the target row has privacy_posture FROZEN"
  - id: ERR_VENDOR_POSTURE_BLOCKS_PUBLICATION
    http: 409
    condition: "Publication attempted while the vendor's privacy_posture is RESTRICTED"
  - id: ERR_RETENTION_EXCEEDS_STATUTORY_CAP
    http: 422
    condition: "retention_days exceeds the tier-conditional ceiling TIER_RETENTION_CAP[sensitivity_tier] = {1: 1825, 2: 1825, 3: 730, 4: 365}"
  - id: ERR_ELEMENT_TIER_NOT_PERMITTED
    http: 422
    condition: "ACCEPT attempted on a commitment whose sensitivity_tier exceeds the Application's max_permitted_tier"
  - id: ERR_SUBPROCESSOR_NOTIFICATION_TERMS_WEAKER
    http: 422
    condition: "VERIFY attempted on a subprocessor whose sub_breach_notification_hours exceeds the parent vendor's breach_notification_hours"
  - id: ERR_SUBPROCESSOR_DISCLOSURE_INCOMPLETE
    http: 422
    condition: "Publication attempted while vendor.subprocessor_disclosure_complete is false"

  # ---- business_referential ----
  - id: ERR_REVIEW_NOT_CLEARED
    http: 422
    condition: "Publication references a review that is not CLEARED or CONDITIONAL, or whose application_id does not match the submitted application_id"
  - id: ERR_WHITELIST_REQUIRES_ACTIVE_ENTRY
    http: 422
    condition: "WHITELIST triage attempted on a detection with no matched_catalog_entry_id, or whose matched entry is not PUBLISHED or EXPIRING_SOON"

  # ---- business_temporal ----
  - id: ERR_AUTHORIZATION_WINDOW_OVERLAP
    http: 409
    condition: "The proposed half-open authorization window [effective_from, expires_at) overlaps an existing PUBLISHED, EXPIRING_SOON or SUSPENDED_HOLD window of the same application; exact adjacency does NOT trigger this"
  - id: ERR_INCIDENT_WINDOW_BUFFER_CONFLICT
    http: 409
    condition: "The proposed incident's bare closed containment window touches or overlaps an existing incident window of the same vendor after that existing window is expanded by a 72-hour cooling buffer on both ends"
  - id: ERR_REMEDIATION_WINDOW_CLOSED
    http: 409
    condition: "submit-remediation attempted after review.remediation_due_at has passed on the logical clock"

  # ---- business_constraint ----
  - id: ERR_JUSTIFICATION_TOO_SHORT
    http: 422
    condition: "instructional_justification is shorter than 120 characters at submit time"
  - id: ERR_NO_DATA_ELEMENTS
    http: 422
    condition: "requested_data_elements is empty at submit time"
  - id: ERR_REVISION_LIMIT_EXCEEDED
    http: 409
    condition: "Resubmit attempted when revision_round has already reached REVISION_ROUND_MAX = 2"
  - id: ERR_REMEDIATION_ROUND_LIMIT
    http: 409
    condition: "issue-findings would push round_number past FINDINGS_ROUND_MAX = 3"
  - id: ERR_ACCESSIBILITY_CONFORMANCE_INSUFFICIENT
    http: 422
    condition: "Publication attempted while accessibility_conformance_level is below WCAG21_AA or vpat_on_file is false"
  - id: ERR_SSO_NOT_VERIFIED
    http: 422
    condition: "Publication attempted while sso_protocol is NONE or sso_verified is false"
  - id: ERR_GRADE_BAND_OUT_OF_SCOPE
    http: 422
    condition: "The requested authorized grade band is not contained in the Application's own grade band"
  - id: ERR_DISPOSITION_NOT_APPLICABLE
    http: 422
    condition: "The submitted disposition is not applicable to the target row's current data (see validations priority 41)"
  - id: ERR_DUPLICATE_EMPLOYEE_NUMBER
    http: 409
    condition: "A Teacher already exists with the submitted employee_number"

  # ---- business_fiscal ----
  - id: ERR_ANALYST_CAPACITY_EXCEEDED
    http: 409
    condition: "The assignee's recomputed allocated_review_minutes plus the review's estimated_minutes would exceed review_capacity_minutes"

# ============================================================================
# §1.7 RBAC Matrix — role_model: segregation_of_duties
# ============================================================================
roles:

  - name: Teacher
    description: "A classroom teacher who requests instructional applications and reads the published district catalog."
    identity: "entity_backed:Teacher"
    exclusive_operations:
      - "POST /application-requests"
      - "POST /application-requests/{requestId}/submit"
    shared_operations:
      - "GET /application-requests/{requestId} (own requests only, enforced at validations priority 6)"
      - "GET /applications"
      - "GET /applications/{applicationId}"
      - "GET /catalog-entries"
      - "GET /catalog-entries/{entryId}"
      - "GET /vendors/{vendorId}"
      - "GET /teachers/{teacherId}"

  - name: PrivacyAnalyst
    description: "District privacy office analyst who reviews vendor data practices, dispositions subprocessors and commitments, and (at LEAD credential) records the final review decision."
    identity: "entity_backed:PrivacyAnalyst"
    exclusive_operations:
      - "POST /subprocessors/{subprocessorId}/review"
      - "POST /data-practice-reviews/{reviewId}/issue-findings"
      - "POST /data-practice-reviews/{reviewId}/decide"
      - "POST /data-element-commitments/{commitmentId}/decide"
    shared_operations:
      - "POST /application-requests/{requestId}/triage"
      - "POST /data-practice-reviews"
      - "POST /data-element-commitments"
      - "POST /catalog-entries"
      - "POST /telemetry-detections/{detectionId}/triage"
      - "all GET endpoints except GET /teachers/{teacherId} restrictions"

  - name: VendorLiaison
    description: "The vendor's own representative: discloses subprocessors, registers applications, answers findings, proposes data-element commitments and self-reports incidents."
    identity: "entity_backed:Vendor"
    exclusive_operations:
      - "POST /data-practice-reviews/{reviewId}/submit-remediation"
    shared_operations:
      - "POST /subprocessors"
      - "POST /applications"
      - "POST /data-element-commitments"
      - "POST /vendor-incidents"
      - "POST /vendor-incidents/{incidentId}/contain"
      - "GET /vendors/{vendorId}, GET /subprocessors, GET /subprocessors/{subprocessorId}, GET /applications, GET /applications/{applicationId}, GET /data-practice-reviews, GET /data-practice-reviews/{reviewId}, GET /data-element-commitments, GET /data-element-commitments/{commitmentId}, GET /catalog-entries, GET /catalog-entries/{entryId}, GET /vendor-incidents, GET /vendor-incidents/{incidentId}"

  - name: PrivacyOfficeAdmin
    description: "Privacy office operator who owns the registry, the catalog, the sweep, incident notification and the logical clock. Deliberately CANNOT author findings, decide reviews, disposition commitments or remediate on a vendor's behalf."
    identity: "opaque"
    exclusive_operations:
      - "POST /vendors"
      - "POST /vendors/{vendorId}/suspend"
      - "POST /vendors/{vendorId}/reinstate"
      - "POST /applications/{applicationId}/attest-integration"
      - "POST /teachers"
      - "POST /privacy-analysts"
      - "POST /data-practice-reviews/{reviewId}/reassign"
      - "POST /catalog-entries/{entryId}/revoke"
      - "POST /catalog-entries/{entryId}/reauthorize"
      - "POST /compliance-sweeps"
      - "POST /vendor-incidents/{incidentId}/send-notification"
      - "POST /vendor-incidents/{incidentId}/resolve"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET /vendors"
      - "POST /subprocessors"
      - "POST /applications"
      - "POST /application-requests/{requestId}/triage"
      - "POST /data-practice-reviews"
      - "POST /catalog-entries"
      - "POST /telemetry-detections/{detectionId}/triage"
      - "POST /vendor-incidents"
      - "POST /vendor-incidents/{incidentId}/contain"
      - "all GET endpoints"

  - name: TelemetryAgent
    description: "The district network, browser-extension and MDM collectors. Machine identity whose only privilege is minting observations."
    identity: "opaque"
    exclusive_operations:
      - "POST /telemetry-detections"
    shared_operations: []
