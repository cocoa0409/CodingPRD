        distinguishing_aspect: "A batch containing one PAID_CREATOR routing of 5500 and one ESCROW routing of 5500 reports creator_share_cents 11000 yet parks held_cents 5500, leaving adjusted_net_cents 5500 — the ESCROW row is counted in gross but removed by the waterfall."
