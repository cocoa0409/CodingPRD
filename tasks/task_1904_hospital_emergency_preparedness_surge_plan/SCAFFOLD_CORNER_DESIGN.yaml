      - triage_category=IMMEDIATE filter returns exactly 2 rows (P-1, P-2)
      - status=DISCHARGED filter returns exactly 1 row (P-3)
  - name: supply_item_computed_read_includes_burn_fields
    claim_type: computed_read
    grounds:
    - entities.SupplyItem.fields.observed_daily_burn_rate
    - entities.SupplyItem.fields.days_of_supply
    distinguishing_aspect: The single-item read surfaces all five computed fields
      alongside the ledger-derived quantity_on_hand.
    test_recipe:
      setup:
      - Item with RECEIVE 5 in-window
      setup_api_calls:
      - call: POST /emergency/supply-items
        payload:
          item_name: Gloves
          category: PPE
          unit: box
          reorder_min_days: 4
        as: LogisticsChief
        captures:
          item_id: $.data.id
      - call: POST /emergency/stock-transactions
        payload:
          supply_item_id: ${item_id}
          transaction_type: RECEIVE
          quantity: 5
          occurred_at: '2026-07-30T09:00:00Z'
        as: LogisticsChief
      trigger:
      - call: GET /emergency/supply-items/${item_id}
        as: LogisticsChief
        captures:
          qoh: $.data.quantity_on_hand
          obs: $.data.observed_daily_burn_rate
          proj: $.data.projected_daily_burn_rate
          below: $.data.below_reorder_level
      assert:
      - ${qoh} == 5
      - ${obs} == 0.0 and ${proj} == 0.0 (RECEIVE never enters the burn window)
      - days_of_supply == null and ${below} == false
  - name: callback_creation_returns_array_in_both_modes
