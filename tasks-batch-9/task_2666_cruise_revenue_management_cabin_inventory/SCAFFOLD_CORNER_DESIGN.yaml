              as: RevenueManager
              captures: { cat_ib: $.data.id }
            - call: "POST /cabin-categories"
              payload: { code: "OV", tier_rank: 3, max_occupancy: 4, onboard_spend_lower_per_night_cents: 11000, onboard_spend_upper_per_night_cents: 7000 }
              as: RevenueManager
              captures: { cat_ov: $.data.id }
            - call: "POST /cabin-categories"
              payload: { code: "BALCONY", tier_rank: 4, max_occupancy: 4, onboard_spend_lower_per_night_cents: 13000, onboard_spend_upper_per_night_cents: 8000 }
              as: RevenueManager
              captures: { cat_bal: $.data.id }
            - call: "POST /sailings"
              payload: { ship_code: "AURORA", voyage_code: "GTY-2701", embark_date: "2027-01-10T17:00:00Z", nights: 7, total_lower_berths: 200, final_payment_days_before: 75, deposit_due_days_after_booking: 7 }
              as: RevenueManager
              captures: { sail_gt: $.data.id }
            - call: "POST /sailing-inventories"
              payload: { sailing_id: "${sail_gt}", cabin_category_id: "${cat_ia}", physical_cabins: 60, oversell_allowance: 4 }
              as: RevenueManager
              captures: { inv_ia: $.data.id }
            - call: "POST /sailing-inventories"
              payload: { sailing_id: "${sail_gt}", cabin_category_id: "${cat_ib}", physical_cabins: 10, oversell_allowance: 1 }
              as: RevenueManager
            - call: "POST /sailing-inventories"
              payload: { sailing_id: "${sail_gt}", cabin_category_id: "${cat_ov}", physical_cabins: 30, oversell_allowance: 0 }
              as: RevenueManager
              captures: { inv_ov: $.data.id }
            - call: "POST /sailing-inventories"
              payload: { sailing_id: "${sail_gt}", cabin_category_id: "${cat_bal}", physical_cabins: 20, oversell_allowance: 0 }
