      - name: milestone_variance_threshold_gate_at_submit
        claim_type: threshold
        excluded_because:
          difficulty_instance: milestone_variance_at_exact_threshold_and_at_the_half_up_rounding_boundary
          rationale: |
            The threshold algorithm's only interesting edge is the strict > comparison against
            MILESTONE_VARIANCE_THRESHOLD_PCT after the ratio has been rounded to four decimals,
            and the §1.8 instance walks the exact-equal case, the rounds-down case and the
            first case that trips ERR_VARIANCE_JUSTIFICATION_REQUIRED.

      - name: cost_report_line_accumulation
        claim_type: aggregation
        excluded_because:
          difficulty_instance: cost_report_per_line_rounding_before_subtotal_aggregation
          rationale: |
            The aggregation claim is per-line rounding before summation, together with the
            identity reported_cost_total == undisputed_cost_total + disputed_cost_total. The
            §1.8 instance asserts all four totals off a line set built specifically so that
            rounding once at the end differs by a cent.

      - name: cost_report_period_interval_handling
        claim_type: interval_merge
        excluded_because:
          difficulty_instance: cost_report_half_open_periods_abut_but_never_overlap
          rationale: |
            Cost report periods are half-open intervals that may touch but never overlap, and
            the §1.8 instance already drives the abutting case, the one-second overlap case and
            the containment case against ERR_COST_PERIOD_OVERLAP.

      - name: circular_fee_and_insurance_definitions
        claim_type: constraint_propagation
        excluded_because:
          difficulty_instance: gmp_pricing_pinned_circular_fee_and_insurance_evaluation_order
          rationale: |
            The mutually recursive fee/insurance definitions are resolved by a pinned four-step
            evaluation order, and the §1.8 instance asserts each intermediate figure - including
            the provisional fee that is consumed and then discarded - so the propagation order
            is pinned end to end.

      - name: two_published_buyout_savings_figures
        claim_type: variant_divergence
        excluded_because:
          difficulty_instance: buyout_savings_trade_level_vs_project_net_divergence
          rationale: |
            The divergence claim needs one underrunning and one overrunning package so that the
            floored TRADE_LEVEL variant and the signed PROJECT_NET variant disagree; the §1.8
            instance builds exactly that data set and asserts both figures plus their
            inequality.

