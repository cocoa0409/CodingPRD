            - "after the reverse leg every conserved field is exactly restored: salary_pct 15.00, sti_pct 25.00, lti_pct 60.00, performance_based_pct 61.00, benchmark_ratio 0.6250, lti_multiple 4.0, lti_target_usd 12000000.00, target_tdc_usd 15000000.00, benchmark_posture ABOVE_MARKET"
            - "salary_pct + sti_pct + lti_pct == 100.00 at the baseline, at the intermediate state and after the reverse leg"
            - "fixed_leg_usd == 3000000.00 throughout — the mix percentages never move the executive's salary plus target bonus"
            - "PayProgram.${pp_id}.version == pp_v0 + 2: the compensating action does NOT rewind the version counter"
            - "ProxyAdvisorScreen.${iss_id}.status == STALE and is NOT restored to SCREENED, while concern_score 36.70, concern_level MEDIUM and recommendation FOR are left at their last computed values"
            - "replaying the reverse leg with the now-stale expected_pay_program_version pp_v1 returns HTTP 412 ERR_STALE_PAY_PROGRAM_VERSION and changes nothing"

      - name: recovery_and_reversal_conserve_realized_dollars_across_award_event_and_program
        grounds:
