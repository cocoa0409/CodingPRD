              payload: { tier: "BASIC", total_price_cents: 30000, down_payment_pct: 0.00, financing_months: 1, included_mock_credits: 3, pass_guarantee: false, guarantee_refund_pct: 0.0, includes_ce: false }
              as: ContentAdmin
              captures: { plan_id: "$.data.id" }
            - call: "POST /learners"
              payload: { email: "ra@x.com", full_name: "RA" }
              as: Learner
              captures: { la: "$.data.id" }
            - call: "POST /learners"
              payload: { email: "rbx@x.com", full_name: "RBX" }
              as: Learner
              captures: { lb: "$.data.id" }
            - call: "POST /enrollments"
              payload: { learner_id: "${la}", license_program_id: "${prog_id}", subscription_plan_id: "${plan_id}", financed: false }
