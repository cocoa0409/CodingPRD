      - name: audit_case_fork_join_divergent_branch_effects
        grounds:
          - state_machines.AuditCase.FIELDWORK_to_RECONCILED
          - state_machines.AuditCase.FIELDWORK_to_DISCREPANCY
          - state_machines.AuditCase.RECONCILED_to_CLOSED
          - state_machines.AuditCase.DISCREPANCY_to_CLOSED
          - calculations.audit_discrepancy
        distinguishing_aspect: |
          Entity AuditCase forks from FIELDWORK into RECONCILED or DISCREPANCY with
          disjoint side-effect sets — the RECONCILED branch leaves the audited
          submission ACCEPTED and the window ledger untouched, while the DISCREPANCY
          branch reopens the submission and drops its head out of the ledger — and the
          two branches then join at the single terminal CLOSED.
        test_recipe:
          setup:
            - "Alpha (FIVE_YEAR_AVERAGE) and Bravo (PRIOR_YEAR_ACTUAL) both hold ACTIVE MANDATORY 2026 registrations, each with one CATTLE plant."
            - "One OPEN weekly CATTLE LIVE_ANIMAL window holds two ACCEPTED submissions: Alpha 255 head NEGOTIATED @280.00/8.00 cwt (reported_value_dollars 571200.00) and Bravo 400 head NEGOTIATED @284.00/8.50 cwt (reported_value_dollars 965600.00), so total_head_reported is 655 over 2 accepted filings."
            - "auditor-1 opened one case per submission and moved both to FIELDWORK."
