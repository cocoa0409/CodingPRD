          annual_income_cents: 8000000
          credit_band: A
        as: Customer
        as_user_id: ${i2_cust}
        captures:
          i2_pq: $.data.id
      - call: POST /vehicle-hub/vehicles
        payload:
          vin: 1C4RJFBG5LC110103
          make: Jeep
          model: Grand Cherokee
          year: 2020
          mileage: 45000
          base_price_cents: 2000000
          market_code: ATL-A
        as: PlatformAdmin
        captures:
          i2_veh: $.data.id
      - call: POST /vehicle-hub/vehicles/${i2_veh}/start-recon
        as: ReconOperator
      - call: POST /vehicle-hub/vehicles/${i2_veh}/list
        as: ReconOperator
      - call: POST /vehicle-hub/orders
        payload:
          vehicle_id: ${i2_veh}
          fulfillment_choice: HOME_DELIVERY
        as: Customer
        as_user_id: ${i2_cust}
        captures:
          i2_ord: $.data.id
      - call: POST /vehicle-hub/orders/${i2_ord}/reserve
        payload:
          expected_vehicle_version: ${vehicles_v1}
        as: Customer
        as_user_id: ${i2_cust}
        captures:
          vehicles_v1: $.data.version
      - call: POST /vehicle-hub/orders/${i2_ord}/structure
        payload:
          financing_id: ${i2_pq}
          down_payment_cents: 300000
        as: Customer
        as_user_id: ${i2_cust}
      - call: POST /vehicle-hub/orders/${i2_ord}/appointments
        payload:
          expected_order_version: ${orders_v1}
          market_code: ATL-A
          address_region: ATL-CORE
          start_at: '2026-09-02T10:00:00Z'
          end_at: '2026-09-02T11:00:00Z'
        as: Customer
        as_user_id: ${i2_cust}
        captures:
          i2_appt: $.data.id
          orders_v1: $.data.version
      trigger:
      - call: POST /vehicle-hub/orders/${i2_ord}/cancel
        as: PlatformAdmin
      - call: GET /vehicle-hub/orders/${i2_ord}/title-registration
        as: RegistrationClerk
      - call: GET /vehicle-hub/financing/${i2_pq}
        as: Customer
        as_user_id: ${i2_cust}
      assert:
      - PurchaseOrder.${i2_ord}.status == CANCELLED
      - 'Vehicle.${i2_veh}.status == LISTED (re-listable: a fresh order can reserve it again)'
      - FinancingPrequalification.${i2_pq}.status == PREQUALIFIED and locked_order_id == null (lock count back to zero — the same prequalification can be structured into a new order)
      - DeliveryAppointment.${i2_appt}.status == CANCELLED
      - title-registration list for the order is empty (PENDING row deleted, no orphan)
