        distinguishing_aspect: |
          Numeric-threshold boundary on the dose-lateness metric, reached through
          POST /medication-administrations/{id}/record: a delta of exactly
          DOSE_LATE_TOLERANCE_MINUTES (60) is ON_TIME while 61 is LATE.
