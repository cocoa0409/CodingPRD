# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# task_0699_haunted_house_attraction — 9 rules x 2 instances = 18 instances
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: dvc_dynamic_price_low_vs_high_band_on_ticket
        grounds:
          - calculations.dynamic_ticket_price
          - entities.Ticket.fields.price_cents
          - entities.TimeSlot.fields.demand_ratio
        distinguishing_aspect: "Same GA base price 2410 frozen on a Ticket yields 2410 at demand_ratio 0 (LOW) but 3615 at demand_ratio 0.8 (HIGH, 50% surge) — divergence lives on the Ticket pricing domain."
        test_recipe:
          setup:
            - "Venue OPEN, attraction A (scare_level 1, min_age 0, throughput 10), GA pricing rule base 2410, low_max 0.5, high_min 0.8, high_surge 50."
            - "Slot S1 capacity 10 (fresh, demand_ratio 0); slot S2 capacity 5 pre-loaded to reserved_count 4 (demand_ratio 0.8) by a confirmed prior reservation of 4 GA tickets."
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "Fright Park", timezone: "UTC" }
              as: OpsManager
              captures: { ven_id: $.data.id }
            - call: "POST /attractions"
              payload: { venue_id: "${ven_id}", name: "Crypt", min_age: 0, scare_level: 1, throughput_per_slot: 10, requires_waiver: false }
              as: OpsManager
              captures: { att_id: $.data.id }
            - call: "POST /attractions/${att_id}/pricing-rules"
              payload: { tier: "GA", base_price_cents: 2410, low_demand_max_ratio: 0.5, high_demand_min_ratio: 0.8, mid_surge_pct: 20, high_surge_pct: 50 }
              as: OpsManager
            - call: "POST /attractions/${att_id}/time-slots"
              payload: { window_start: "2026-10-31T18:00:00Z", window_end: "2026-10-31T19:00:00Z", capacity: 5 }
              as: OpsManager
              captures: { s2_id: $.data.id, s2_v: $.data.version }
            - call: "POST /attractions/${att_id}/time-slots"
              payload: { window_start: "2026-10-31T20:00:00Z", window_end: "2026-10-31T21:00:00Z", capacity: 10 }
              as: OpsManager
              captures: { s1_id: $.data.id, s1_v: $.data.version }
            - call: "POST /guests"
              payload: { full_name: "Seed Guest", age: 30, email: "seed@x.com" }
              as: BoxOffice
              captures: { gseed_id: $.data.id }
            - call: "POST /reservations"
              payload: { venue_id: "${ven_id}", guest_id: "${gseed_id}" }
              as: BoxOffice
              captures: { rseed_id: $.data.id }
            - call: "POST /reservations/${rseed_id}/tickets"
              payload: { time_slot_id: "${s2_id}", guest_age: 30, max_scare_level: 1, tier: "GA" }
              as: BoxOffice
            - call: "POST /reservations/${rseed_id}/tickets"
              payload: { time_slot_id: "${s2_id}", guest_age: 30, max_scare_level: 1, tier: "GA" }
              as: BoxOffice
            - call: "POST /reservations/${rseed_id}/tickets"
              payload: { time_slot_id: "${s2_id}", guest_age: 30, max_scare_level: 1, tier: "GA" }
              as: BoxOffice
            - call: "POST /reservations/${rseed_id}/tickets"
              payload: { time_slot_id: "${s2_id}", guest_age: 30, max_scare_level: 1, tier: "GA" }
              as: BoxOffice
            - call: "POST /reservations/${rseed_id}/confirm"
              payload: { expected_time_slot_version: "${s2_v}" }
              as: BoxOffice
            - call: "GET /time-slots/${s2_id}"
              payload: {}
              as: BoxOffice
              captures: { s2_v2: $.data.version }
            - call: "POST /guests"
              payload: { full_name: "Buyer One", age: 30, email: "b1@x.com" }
              as: BoxOffice
              captures: { g1_id: $.data.id }
            - call: "POST /reservations"
              payload: { venue_id: "${ven_id}", guest_id: "${g1_id}" }
              as: BoxOffice
              captures: { r1_id: $.data.id }
            - call: "POST /reservations/${r1_id}/tickets"
              payload: { time_slot_id: "${s1_id}", guest_age: 30, max_scare_level: 1, tier: "GA" }
              as: BoxOffice
              captures: { t_low_id: $.data.id }
            - call: "POST /guests"
              payload: { full_name: "Buyer Two", age: 30, email: "b2@x.com" }
              as: BoxOffice
              captures: { g2_id: $.data.id }
            - call: "POST /reservations"
              payload: { venue_id: "${ven_id}", guest_id: "${g2_id}" }
              as: BoxOffice
              captures: { r2_id: $.data.id }
            - call: "POST /reservations/${r2_id}/tickets"
              payload: { time_slot_id: "${s2_id}", guest_age: 30, max_scare_level: 1, tier: "GA" }
              as: BoxOffice
              captures: { t_high_id: $.data.id }
          trigger:
            - call: "POST /reservations/${r1_id}/confirm"
              payload: { expected_time_slot_version: "${s1_v}" }
              as: BoxOffice
            - call: "GET /tickets"
              payload: {}
              as: BoxOffice
              captures: { t_low_price: $.data.0.price_cents }
            - call: "POST /reservations/${r2_id}/confirm"
              payload: { expected_time_slot_version: "${s2_v2}" }
              as: BoxOffice
          assert:
            - "Ticket.${t_low_id}.price_cents == 2410"
            - "Ticket.${t_high_id}.price_cents == 3615"

      - name: dvc_refund_credit_self_cancel_vs_closure_on_guest_wallet
        grounds:
          - calculations.refund_credit
          - entities.Guest.fields.wallet_credit_cents
          - state_machines.Reservation.PAID_to_REFUNDED
        distinguishing_aspect: "The refund_credit calc credits the Guest wallet by the full total_cents both when the guest self-cancels and when a closure cascade auto-refunds — variant divergence is on the Guest-wallet domain, distinct from dvc's Ticket-pricing domain."
        test_recipe:
          setup:
            - "Two paid reservations of identical total 2410: R_self cancelled by guest; R_closure refunded by a WEATHER closure on its attraction."
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "Fright Park", timezone: "UTC" }
              as: OpsManager
              captures: { ven_id: $.data.id }
            - call: "POST /attractions"
              payload: { venue_id: "${ven_id}", name: "Crypt", min_age: 0, scare_level: 1, throughput_per_slot: 10, requires_waiver: false }
              as: OpsManager
              captures: { att_id: $.data.id }
            - call: "POST /attractions/${att_id}/pricing-rules"
              payload: { tier: "GA", base_price_cents: 2410, low_demand_max_ratio: 0.5, high_demand_min_ratio: 0.8, mid_surge_pct: 20, high_surge_pct: 50 }
              as: OpsManager
            - call: "POST /attractions/${att_id}/time-slots"
              payload: { window_start: "2026-10-31T18:00:00Z", window_end: "2026-10-31T19:00:00Z", capacity: 10 }
              as: OpsManager
              captures: { slot_id: $.data.id, slot_v: $.data.version }
            - call: "POST /guests"
              payload: { full_name: "Self Cancel", age: 30, email: "self@x.com" }
              as: BoxOffice
              captures: { gself_id: $.data.id }
            - call: "POST /reservations"
              payload: { venue_id: "${ven_id}", guest_id: "${gself_id}" }
              as: BoxOffice
              captures: { rself_id: $.data.id }
            - call: "POST /reservations/${rself_id}/tickets"
              payload: { time_slot_id: "${slot_id}", guest_age: 30, max_scare_level: 1, tier: "GA" }
              as: BoxOffice
            - call: "POST /reservations/${rself_id}/confirm"
              payload: { expected_time_slot_version: "${slot_v}" }
              as: BoxOffice
            - call: "POST /reservations/${rself_id}/pay"
              payload: {}
              as: BoxOffice
            - call: "GET /time-slots/${slot_id}"
              payload: {}
              as: BoxOffice
              captures: { slot_v2: $.data.version }
            - call: "POST /guests"
              payload: { full_name: "Closure Guest", age: 30, email: "clo@x.com" }
              as: BoxOffice
              captures: { gclo_id: $.data.id }
            - call: "POST /reservations"
              payload: { venue_id: "${ven_id}", guest_id: "${gclo_id}" }
              as: BoxOffice
              captures: { rclo_id: $.data.id }
            - call: "POST /reservations/${rclo_id}/tickets"
              payload: { time_slot_id: "${slot_id}", guest_age: 30, max_scare_level: 1, tier: "GA" }
              as: BoxOffice
            - call: "POST /reservations/${rclo_id}/confirm"
              payload: { expected_time_slot_version: "${slot_v2}" }
              as: BoxOffice
            - call: "POST /reservations/${rclo_id}/pay"
              payload: {}
              as: BoxOffice
            - call: "GET /attractions/${att_id}"
              payload: {}
              as: OpsManager
              captures: { att_v: $.data.version }
          trigger:
            - call: "POST /reservations/${rself_id}/cancel"
              payload: {}
              as: Guest
              as_user_id: "${gself_id}"
            - call: "POST /attractions/${att_id}/closures"
              payload: { reason: "WEATHER", expected_attraction_version: "${att_v}" }
              as: OpsManager
          assert:
            - "Guest.${gself_id}.wallet_credit_cents == 2410"
            - "Guest.${gclo_id}.wallet_credit_cents == 2410"
            - "Reservation.${rclo_id}.payment_status == REFUNDED"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: cf_mode_a_tiered_surge_selection_three_inputs
        grounds:
          - calculations.dynamic_ticket_price
          - entities.PricingRule.fields.mid_surge_pct
          - entities.TimeSlot.fields.demand_ratio
        distinguishing_aspect: "Mode (a): price selects among LOW/MID/HIGH bands via conditional branches over three inputs (demand_ratio, low_demand_max_ratio, high_demand_min_ratio); MID band at ratio 0.6 yields 2892 from base 2410 (20% surge), distinct from the rounding-order mode below."
        test_recipe:
          setup:
            - "Attraction A, GA rule base 2410 mid_surge 20; slot S capacity 5 pre-loaded to reserved_count 3 (demand_ratio 0.6 -> MID band)."
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "Fright Park", timezone: "UTC" }
              as: OpsManager
              captures: { ven_id: $.data.id }
            - call: "POST /attractions"
              payload: { venue_id: "${ven_id}", name: "Maze", min_age: 0, scare_level: 1, throughput_per_slot: 10, requires_waiver: false }
              as: OpsManager
              captures: { att_id: $.data.id }
            - call: "POST /attractions/${att_id}/pricing-rules"
              payload: { tier: "GA", base_price_cents: 2410, low_demand_max_ratio: 0.5, high_demand_min_ratio: 0.8, mid_surge_pct: 20, high_surge_pct: 50 }
              as: OpsManager
            - call: "POST /attractions/${att_id}/time-slots"
              payload: { window_start: "2026-10-31T18:00:00Z", window_end: "2026-10-31T19:00:00Z", capacity: 5 }
              as: OpsManager
              captures: { slot_id: $.data.id, slot_v: $.data.version }
            - call: "POST /guests"
              payload: { full_name: "Seed Guest", age: 30, email: "seed@x.com" }
              as: BoxOffice
              captures: { gseed_id: $.data.id }
            - call: "POST /reservations"
              payload: { venue_id: "${ven_id}", guest_id: "${gseed_id}" }
              as: BoxOffice
              captures: { rseed_id: $.data.id }
            - call: "POST /reservations/${rseed_id}/tickets"
              payload: { time_slot_id: "${slot_id}", guest_age: 30, max_scare_level: 1, tier: "GA" }
              as: BoxOffice
            - call: "POST /reservations/${rseed_id}/tickets"
              payload: { time_slot_id: "${slot_id}", guest_age: 30, max_scare_level: 1, tier: "GA" }
              as: BoxOffice
            - call: "POST /reservations/${rseed_id}/tickets"
              payload: { time_slot_id: "${slot_id}", guest_age: 30, max_scare_level: 1, tier: "GA" }
              as: BoxOffice
            - call: "POST /reservations/${rseed_id}/confirm"
              payload: { expected_time_slot_version: "${slot_v}" }
              as: BoxOffice
            - call: "GET /time-slots/${slot_id}"
              payload: {}
              as: BoxOffice
              captures: { slot_v2: $.data.version }
            - call: "POST /guests"
              payload: { full_name: "Mid Buyer", age: 30, email: "mid@x.com" }
              as: BoxOffice
              captures: { g_id: $.data.id }
            - call: "POST /reservations"
              payload: { venue_id: "${ven_id}", guest_id: "${g_id}" }
              as: BoxOffice
              captures: { r_id: $.data.id }
            - call: "POST /reservations/${r_id}/tickets"
              payload: { time_slot_id: "${slot_id}", guest_age: 30, max_scare_level: 1, tier: "GA" }
              as: BoxOffice
              captures: { t_id: $.data.id }
          trigger:
            - call: "POST /reservations/${r_id}/confirm"
              payload: { expected_time_slot_version: "${slot_v2}" }
              as: BoxOffice
          assert:
            - "Ticket.${t_id}.price_cents == 2892"

      - name: cf_mode_b_pass_discount_round_per_ticket_then_sum
        grounds:
          - calculations.pass_discount
          - entities.Reservation.fields.discount_cents
          - entities.Reservation.fields.total_cents
        distinguishing_aspect: "Mode (b): per-ticket rounding pinned — three GA tickets at 2410 each, GROUP pass 15% gives round(361.5)=362 per ticket summed to 1086 discount (total 6144); sum-then-round would give 1085 (total 6145). Distinct from mode (a)."
        test_recipe:
          setup:
            - "Guest with a GROUP pass (discount 15%, min_party 3, max_redemptions 2). Reservation of 3 GA tickets at LOW band price 2410 each on a fresh slot."
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "Fright Park", timezone: "UTC" }
              as: OpsManager
              captures: { ven_id: $.data.id }
            - call: "POST /attractions"
              payload: { venue_id: "${ven_id}", name: "Crypt", min_age: 0, scare_level: 1, throughput_per_slot: 10, requires_waiver: false }
              as: OpsManager
              captures: { att_id: $.data.id }
            - call: "POST /attractions/${att_id}/pricing-rules"
              payload: { tier: "GA", base_price_cents: 2410, low_demand_max_ratio: 0.5, high_demand_min_ratio: 0.8, mid_surge_pct: 20, high_surge_pct: 50 }
              as: OpsManager
            - call: "POST /attractions/${att_id}/time-slots"
              payload: { window_start: "2026-10-31T18:00:00Z", window_end: "2026-10-31T19:00:00Z", capacity: 10 }
              as: OpsManager
              captures: { slot_id: $.data.id, slot_v: $.data.version }
            - call: "POST /venues/${ven_id}/pass-products"
              payload: { kind: "GROUP", price_cents: 0, discount_pct: 15, max_redemptions: 2, min_party: 3 }
              as: OpsManager
              captures: { pp_id: $.data.id }
            - call: "POST /guests"
              payload: { full_name: "Group Buyer", age: 30, email: "grp@x.com" }
              as: BoxOffice
              captures: { g_id: $.data.id }
            - call: "POST /passes"
              payload: { pass_product_id: "${pp_id}", guest_id: "${g_id}" }
              as: BoxOffice
              captures: { pass_id: $.data.id }
            - call: "POST /reservations"
              payload: { venue_id: "${ven_id}", guest_id: "${g_id}", pass_id: "${pass_id}" }
              as: BoxOffice
              captures: { r_id: $.data.id }
            - call: "POST /reservations/${r_id}/tickets"
              payload: { time_slot_id: "${slot_id}", guest_age: 30, max_scare_level: 1, tier: "GA" }
              as: BoxOffice
            - call: "POST /reservations/${r_id}/tickets"
              payload: { time_slot_id: "${slot_id}", guest_age: 30, max_scare_level: 1, tier: "GA" }
              as: BoxOffice
            - call: "POST /reservations/${r_id}/tickets"
              payload: { time_slot_id: "${slot_id}", guest_age: 30, max_scare_level: 1, tier: "GA" }
              as: BoxOffice
          trigger:
            - call: "POST /reservations/${r_id}/confirm"
              payload: { expected_time_slot_version: "${slot_v}" }
              as: BoxOffice
          assert:
            - "Reservation.${r_id}.subtotal_cents == 7230"
            - "Reservation.${r_id}.discount_cents == 1086"
            - "Reservation.${r_id}.total_cents == 6144"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: nlsm_reservation_parallel_entry_x_payment_dimensions
        grounds:
          - state_machines.Reservation.RESERVED_to_ADMITTED
          - state_machines.Reservation.UNPAID_to_PAID
          - entities.Reservation.fields.entry_status
          - entities.Reservation.fields.payment_status
        distinguishing_aspect: "Reservation carries two independent state axes: paying (UNPAID->PAID) leaves entry_status RESERVED unchanged, and only after PAID can admit (RESERVED->ADMITTED) fire — parallel dimensions on one entity, distinct from the cyclic machine below."
        test_recipe:
          setup:
            - "RESERVED reservation of 1 GA ticket; clock inside the entry window; zone staffed; waiver not required."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-31T18:30:00Z" }
              as: OpsManager
            - call: "POST /venues"
              payload: { name: "Fright Park", timezone: "UTC" }
              as: OpsManager
              captures: { ven_id: $.data.id }
            - call: "POST /attractions"
              payload: { venue_id: "${ven_id}", name: "Crypt", min_age: 0, scare_level: 1, throughput_per_slot: 10, requires_waiver: false }
              as: OpsManager
              captures: { att_id: $.data.id }
            - call: "POST /attractions/${att_id}/pricing-rules"
              payload: { tier: "GA", base_price_cents: 2410 }
              as: OpsManager
            - call: "POST /attractions/${att_id}/scare-zones"
              payload: { name: "Crypt Zone", min_actors: 1 }
              as: OpsManager
              captures: { zone_id: $.data.id }
            - call: "POST /scare-zones/${zone_id}/actor-shifts"
              payload: { actor_user_id: "actor-1", shift_start: "2026-10-31T18:00:00Z", shift_end: "2026-10-31T22:00:00Z" }
              as: OpsManager
              captures: { shift_id: $.data.id }
            - call: "POST /actor-shifts/${shift_id}/check_in"
              payload: {}
              as: Actor
            - call: "POST /attractions/${att_id}/time-slots"
              payload: { window_start: "2026-10-31T18:00:00Z", window_end: "2026-10-31T19:00:00Z", capacity: 10 }
              as: OpsManager
              captures: { slot_id: $.data.id, slot_v: $.data.version }
            - call: "POST /guests"
              payload: { full_name: "Parallel Guest", age: 30, email: "par@x.com" }
              as: BoxOffice
              captures: { g_id: $.data.id }
            - call: "POST /reservations"
              payload: { venue_id: "${ven_id}", guest_id: "${g_id}" }
              as: BoxOffice
              captures: { r_id: $.data.id }
            - call: "POST /reservations/${r_id}/tickets"
              payload: { time_slot_id: "${slot_id}", guest_age: 30, max_scare_level: 1, tier: "GA" }
              as: BoxOffice
            - call: "POST /reservations/${r_id}/confirm"
              payload: { expected_time_slot_version: "${slot_v}" }
              as: BoxOffice
          trigger:
            - call: "POST /reservations/${r_id}/pay"
              payload: {}
              as: BoxOffice
              captures: { entry_after_pay: $.data.entry_status, pay_after_pay: $.data.payment_status }
            - call: "POST /reservations/${r_id}/admit"
              payload: {}
              as: BoxOffice
          assert:
            - "Reservation.${r_id}.entry_status after pay == RESERVED"
            - "Reservation.${r_id}.payment_status after pay == PAID"
            - "Reservation.${r_id}.entry_status after admit == ADMITTED"
            - "Reservation.${r_id}.payment_status after admit == PAID"

      - name: nlsm_attraction_closure_cyclic_open_paused_open
        grounds:
          - state_machines.Attraction.OPEN_to_PAUSED
          - state_machines.Attraction.PAUSED_to_OPEN
          - state_machines.Closure.ACTIVE_to_LIFTED
        distinguishing_aspect: "Attraction status cycles OPEN->PAUSED (closure create) then PAUSED->OPEN (closure lift) and back to OPEN — a cycle on the Attraction entity, distinct from the parallel-dimension Reservation machine."
        test_recipe:
          setup:
            - "Attraction OPEN under a CLEAR-weather venue."
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "Fright Park", timezone: "UTC" }
              as: OpsManager
              captures: { ven_id: $.data.id }
            - call: "POST /attractions"
              payload: { venue_id: "${ven_id}", name: "Crypt", min_age: 0, scare_level: 1, throughput_per_slot: 10, requires_waiver: false }
              as: OpsManager
              captures: { att_id: $.data.id, att_v0: $.data.version }
          trigger:
            - call: "POST /attractions/${att_id}/closures"
              payload: { reason: "SAFETY", expected_attraction_version: "${att_v0}" }
              as: OpsManager
              captures: { clo_id: $.data.id }
            - call: "GET /attractions/${att_id}"
              payload: {}
              as: OpsManager
              captures: { att_paused_status: $.data.status, att_v1: $.data.version }
            - call: "POST /closures/${clo_id}/lift"
              payload: { expected_attraction_version: "${att_v1}" }
              as: OpsManager
            - call: "GET /attractions/${att_id}"
              payload: {}
              as: OpsManager
              captures: { att_reopened_status: $.data.status }
          assert:
            - "Attraction.${att_id}.status after closure create == PAUSED"
            - "Closure.${clo_id}.status after lift == LIFTED"
            - "Attraction.${att_id}.status after lift == OPEN"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: tc_depth3_closure_pauses_slot_cancels_reservation_refunds_wallet
        grounds:
          - state_machines.Attraction.OPEN_to_PAUSED
          - state_machines.TimeSlot.SCHEDULED_to_CLOSED
          - state_machines.Reservation.RESERVED_to_CANCELLED
          - calculations.refund_credit
        distinguishing_aspect: "Depth-3 chain from POST /attractions/{id}/closures: Attraction OPEN->PAUSED causes slot SCHEDULED->CLOSED, which causes the PAID RESERVED reservation->CANCELLED+REFUNDED, which causes Guest.wallet_credit_cents += 2410 — each hop caused by the prior."
        test_recipe:
          setup:
            - "Attraction OPEN with a SCHEDULED slot holding one RESERVED+PAID reservation (total 2410); guest wallet 0."
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "Fright Park", timezone: "UTC" }
              as: OpsManager
              captures: { ven_id: $.data.id }
            - call: "POST /attractions"
              payload: { venue_id: "${ven_id}", name: "Crypt", min_age: 0, scare_level: 1, throughput_per_slot: 10, requires_waiver: false }
              as: OpsManager
              captures: { att_id: $.data.id }
            - call: "POST /attractions/${att_id}/pricing-rules"
              payload: { tier: "GA", base_price_cents: 2410 }
              as: OpsManager
            - call: "POST /attractions/${att_id}/time-slots"
              payload: { window_start: "2026-10-31T18:00:00Z", window_end: "2026-10-31T19:00:00Z", capacity: 10 }
              as: OpsManager
              captures: { slot_id: $.data.id, slot_v: $.data.version }
            - call: "POST /guests"
