# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: TournamentDirector
    description: "Tournament administrator: owns configuration, phase transitions, rooms, logistics, hired-judge procurement and dispute resolution; cannot verify or void ballots (segregation of duties)"
    identity: opaque
    exclusive_operations:
      - "POST /tournaments; POST /tournaments/{id}/open-registration|lock-registration|start-prelims|start-elims|complete|publish-results|certify-qualifications"
      - "POST /schools; POST /divisions; POST /rooms; POST /logistics-orders; POST /logistics-orders/{id}/submit|fulfill"
      - "POST /hired-judge-contracts/{id}/fill|resolve-dispute|cancel"
      - "POST /_clock/set_current_utc"
    shared_operations: ["all GET endpoints"]
  - name: TabStaff
    description: "Tabulation staff: owns rounds, pairing generation, room/judge assignment, ballot verification/void, break determination; cannot drive tournament phases or publish results"
    identity: opaque
    exclusive_operations:
      - "POST /rounds; POST /rounds/{id}/generate-pairings|open-ballots|tabulate"
      - "POST /pairings/{id}/assign-room|assign-judge|unassign-judge"
      - "POST /ballots/{id}/verify|void; POST /divisions/{id}/determine-breaks"
    shared_operations: ["POST /judge-conflicts (with SchoolCoach)", "all GET endpoints"]
  - name: SchoolCoach
    description: "Coach of one school: manages own entries, judges, conflicts and hired-judge contracts"
    identity: entity_backed:School
    exclusive_operations:
      - "POST /entries; POST /entries/{id}/confirm|withdraw (own school)"
      - "POST /judges/{id}/commit|withdraw (own school); POST /schools/{id}/confirm|unconfirm (own school)"
      - "POST /hired-judge-contracts; POST /hired-judge-contracts/{id}/accept|dispute|pay (own school)"
    shared_operations: ["POST /judges (own school; with TournamentDirector)", "POST /judge-conflicts (with TabStaff)", "all GET endpoints"]
  - name: Judge
    description: "A registered judge: creates, submits and recalls ballots only for pairings assigned to them"
    identity: entity_backed:Judge
    exclusive_operations: ["POST /ballots; POST /ballots/{id}/submit|recall (own assigned pairings)"]
    shared_operations: ["all GET endpoints"]
