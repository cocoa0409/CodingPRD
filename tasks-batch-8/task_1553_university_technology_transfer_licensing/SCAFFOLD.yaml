    side_effects: ["status -> ACHIEVED"]
  - method: POST
    path: "/tlo/licenses/{licenseId}/milestones/{milestoneId}/waive"
    description: "Waive a pending milestone"
    roles: [LicensingManager]
    code: 200
    input: [waiver_reason]
    output: LicenseMilestone
    side_effects: ["status -> WAIVED"]

  # --- RoyaltyReport ---
  - method: POST
    path: "/tlo/licenses/{id}/royalty-reports"
    description: "Submit a periodic royalty report"
    roles: [LicensingManager]
    code: 201
    input: [period_start, period_end, reported_sales_cents]
    output: RoyaltyReport
    side_effects: ["status = SUBMITTED; period must not overlap existing SUBMITTED/ACCEPTED/PAID report periods (half-open)"]
  - method: GET
    path: "/tlo/licenses/{id}/royalty-reports"
    description: "List royalty reports of a license"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?"]
    output: "RoyaltyReport[]"
    side_effects: []
  - method: GET
    path: "/tlo/royalty-reports/{reportId}"
    description: "Get a royalty report"
    roles: [Any]
    code: 200
    input: []
    output: RoyaltyReport
    side_effects: []
  - method: POST
    path: "/tlo/royalty-reports/{reportId}/accept"
    description: "Accept a report; computes earned royalty and true-up"
    roles: [FinanceOfficer]
    code: 200
    input: []
    output: RoyaltyReport
    side_effects: ["earned/true_up/accepted computed", "license cumulative rollups recomputed"]

  # --- RoyaltyDistribution ---
  - method: POST
    path: "/tlo/royalty-reports/{id}/distribution"
    description: "Calculate the distribution waterfall for an accepted report"
    roles: [FinanceOfficer]
    code: 201
    input: []
    output: RoyaltyDistribution
    side_effects: ["waterfall + share splits computed", "status = CALCULATED", "prepared_by_user_id = X-User-ID"]
  - method: GET
    path: "/tlo/royalty-reports/{id}/distribution"
    description: "Get the distribution for a report (array of 0 or 1)"
    roles: [Any]
    code: 200
    input: []
    output: "RoyaltyDistribution[]"
    side_effects: []
  - method: GET
    path: "/tlo/distributions/{distributionId}"
    description: "Get a distribution"
    roles: [Any]
    code: 200
    input: []
    output: RoyaltyDistribution
    side_effects: []
  - method: POST
    path: "/tlo/distributions/{distributionId}/recalculate"
    description: "Recalculate pools from current costs/roster; bumps version"
    roles: [FinanceOfficer]
    code: 200
    input: []
    output: RoyaltyDistribution
    side_effects: ["waterfall + share splits recomputed", "increments RoyaltyDistribution.version by 1"]
  - method: POST
    path: "/tlo/distributions/{distributionId}/approve"
    description: "Approve a distribution (OCC + segregation of duties); applies cost offsets"
    roles: [FinanceDirector]
    code: 200
    input: [expected_distribution_version]
    output: RoyaltyDistribution
    side_effects: ["status -> APPROVED", "cost offsets applied chronologically", "cost_applications recorded", "disclosure unreimbursed rollup recomputed", "increments RoyaltyDistribution.version by 1"]
  - method: POST
    path: "/tlo/distributions/{distributionId}/pay"
    description: "Pay an approved distribution; credits department pools; report -> PAID"
    roles: [FinanceDirector]
    code: 200
    input: []
    output: RoyaltyDistribution
    side_effects: ["status -> PAID", "report -> PAID", "department pools credited", "license rollups refreshed"]
  - method: POST
    path: "/tlo/distributions/{distributionId}/cancel"
    description: "Cancel a CALCULATED/APPROVED distribution; reverses applied offsets"
    roles: [FinanceDirector]
    code: 200
    input: ["cancel_reason?"]
    output: RoyaltyDistribution
    side_effects: ["status -> CANCELLED", "cost_applications reversed when APPROVED", "disclosure unreimbursed rollup recomputed"]

  # --- FederalComplianceReport ---
  - method: POST
    path: "/tlo/disclosures/{id}/compliance-reports"
    description: "Open a federal compliance report (Bayh-Dole style)"
    roles: [ComplianceOfficer]
    code: 201
    input: [report_type, "due_date?"]
    output: FederalComplianceReport
    side_effects: ["status = DRAFT", "due_date computed for INITIAL_DISCLOSURE/ELECTION_OF_TITLE; input for others", "prepared_by_user_id = X-User-ID"]
  - method: GET
    path: "/tlo/disclosures/{id}/compliance-reports"
    description: "List compliance reports of a disclosure"
    roles: [Any]
    code: 200
    input: ["limit?", "offset?"]
    output: "FederalComplianceReport[]"
    side_effects: []
  - method: GET
    path: "/tlo/compliance-reports/{reportId}"
    description: "Get a compliance report"
    roles: [Any]
    code: 200
    input: []
    output: FederalComplianceReport
    side_effects: []
  - method: POST
    path: "/tlo/compliance-reports/{reportId}/submit"
    description: "Submit a draft report for certification"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: FederalComplianceReport
    side_effects: ["status -> PENDING_CERTIFICATION"]
  - method: POST
    path: "/tlo/compliance-reports/{reportId}/certify"
    description: "Certify and transmit to the agency (segregation of duties)"
    roles: [ComplianceDirector]
    code: 200
    input: []
    output: FederalComplianceReport
    side_effects: ["status -> SUBMITTED", "submitted_at = clock", "late_flag computed"]
  - method: POST
    path: "/tlo/compliance-reports/{reportId}/reject"
    description: "Reject a report pending certification; returns to DRAFT"
    roles: [ComplianceDirector]
    code: 200
    input: [rejection_reason]
    output: FederalComplianceReport
    side_effects: ["status -> DRAFT"]
  - method: POST
    path: "/tlo/compliance-reports/{reportId}/agency-response"
    description: "Record agency disposition; REJECTED loops back to DRAFT"
    roles: [ComplianceDirector]
    code: 200
    input: [outcome, "agency_notes?"]
    output: FederalComplianceReport
    side_effects: ["status -> AGENCY_ACCEPTED or -> DRAFT"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or malformed" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted, or entity-backed ownership check failed (Inventor confirming another inventor's entry; non-rostered inventor raising a dispute)" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Schema violation: missing required field, bad enum, out-of-range integer, end <= start, missing federal identifiers, missing post_money_valuation_cents for ANTI_DILUTION" }
  - { id: ERR_DEPARTMENT_NOT_FOUND, http: 404, condition: "Department id does not exist" }
  - { id: ERR_INVENTOR_NOT_FOUND, http: 404, condition: "Inventor id does not exist" }
  - { id: ERR_DISCLOSURE_NOT_FOUND, http: 404, condition: "Disclosure id does not exist" }
  - { id: ERR_DISCLOSURE_ENTRY_NOT_FOUND, http: 404, condition: "DisclosureInventor entry id does not exist" }
  - { id: ERR_DISPUTE_NOT_FOUND, http: 404, condition: "InventorshipDispute id does not exist" }
  - { id: ERR_PATENT_APPLICATION_NOT_FOUND, http: 404, condition: "PatentApplication id does not exist" }
  - { id: ERR_LICENSE_NOT_FOUND, http: 404, condition: "LicenseAgreement id does not exist" }
  - { id: ERR_MILESTONE_NOT_FOUND, http: 404, condition: "LicenseMilestone id does not exist within the license" }
  - { id: ERR_ROYALTY_REPORT_NOT_FOUND, http: 404, condition: "RoyaltyReport id does not exist" }
  - { id: ERR_DISTRIBUTION_NOT_FOUND, http: 404, condition: "RoyaltyDistribution id does not exist" }
  - { id: ERR_STARTUP_NOT_FOUND, http: 404, condition: "Startup id does not exist" }
  - { id: ERR_COI_PLAN_NOT_FOUND, http: 404, condition: "ConflictOfInterestPlan id does not exist" }
  - { id: ERR_COMPLIANCE_REPORT_NOT_FOUND, http: 404, condition: "FederalComplianceReport id does not exist" }
  - { id: ERR_DISCLOSURE_INVALID_STATE, http: 409, condition: "Disclosure not in a state allowing this operation (assessment/decision/roster-add/cost-review-clear/entry-confirm gates)" }
  - { id: ERR_INVENTORSHIP_NOT_FINALIZABLE, http: 409, condition: "Finalize requires INVENTORSHIP_REVIEW with >=1 entries, all CONFIRMED" }
  - { id: ERR_ENTRY_NOT_CONFIRMABLE, http: 409, condition: "Confirm requires entry confirmation_status == PENDING" }
  - { id: ERR_ENTRY_NOT_DISPUTABLE, http: 409, condition: "Dispute requires entry confirmation_status in {PENDING, CONFIRMED}" }
  - { id: ERR_DISPUTE_NOT_OPEN, http: 409, condition: "Resolve requires dispute status == OPEN" }
  - { id: ERR_PATENT_INVALID_STATE, http: 409, condition: "Patent application not in a state allowing this prosecution event" }
  - { id: ERR_COST_REVIEW_REQUIRED, http: 422, condition: "Disclosure cost_writeoff_review_required is true; new patent applications blocked" }
  - { id: ERR_COST_REVIEW_NOT_REQUIRED, http: 409, condition: "cost-review/clear called while cost_writeoff_review_required is false" }
  - { id: ERR_STARTUP_INVALID_STATE, http: 409, condition: "Startup not in a state allowing this operation" }
  - { id: ERR_COI_NOT_REVIEWABLE, http: 409, condition: "COI approve/reject requires status == SUBMITTED" }
  - { id: ERR_COI_NOT_REVISABLE, http: 409, condition: "COI PATCH requires status == REJECTED" }
  - { id: ERR_LICENSE_NOT_NEGOTIABLE, http: 409, condition: "Counter requires status in {IN_NEGOTIATION, COUNTERED}" }
  - { id: ERR_LICENSE_NOT_EXECUTABLE, http: 409, condition: "Execute requires status in {IN_NEGOTIATION, COUNTERED}" }
  - { id: ERR_LICENSE_NOT_ACTIVE, http: 409, condition: "Operation requires license status ACTIVE (or EXECUTED where noted)" }
  - { id: ERR_LICENSE_NOT_IN_DEFAULT, http: 409, condition: "Cure requires status == DEFAULT_NOTICE" }
  - { id: ERR_LICENSE_NOT_TERMINABLE, http: 409, condition: "Terminate requires status == DEFAULT_NOTICE" }
  - { id: ERR_MILESTONE_NOT_PENDING, http: 409, condition: "Milestone operation requires status == PENDING" }
  - { id: ERR_MILESTONE_OVERDUE, http: 409, condition: "Achieve requires current clock <= due_date" }
  - { id: ERR_NO_DEFAULT_GROUNDS, http: 409, condition: "Declare-default requires at least one overdue PENDING milestone" }
  - { id: ERR_CURE_PERIOD_EXPIRED, http: 409, condition: "Cure attempted after cure_deadline" }
  - { id: ERR_CURE_PERIOD_ACTIVE, http: 409, condition: "Terminate attempted on/before cure_deadline" }
  - { id: ERR_REPORT_NOT_ACCEPTABLE, http: 409, condition: "Accept requires report status == SUBMITTED; distribution create requires ACCEPTED and no existing distribution" }
  - { id: ERR_REPORT_PERIOD_OVERLAP, http: 409, condition: "Report period half-open overlaps an existing non-VOIDED report period on the license" }
  - { id: ERR_DISTRIBUTION_NOT_APPROVABLE, http: 409, condition: "Approve requires distribution status == CALCULATED" }
  - { id: ERR_DISTRIBUTION_NOT_PAYABLE, http: 409, condition: "Pay requires distribution status == APPROVED" }
  - { id: ERR_DISTRIBUTION_NOT_CANCELLABLE, http: 409, condition: "Cancel requires distribution status in {CALCULATED, APPROVED}" }
  - { id: ERR_COMPLIANCE_REPORT_INVALID_STATE, http: 409, condition: "Compliance report not in a state allowing this operation" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 409, condition: "Certifier/approver X-User-ID equals prepared_by_user_id" }
  - { id: ERR_TITLE_NOT_ELECTED, http: 409, condition: "NON_PROVISIONAL/PCT on FEDERAL/MIXED disclosure lacks an ELECTION_OF_TITLE report in {SUBMITTED, AGENCY_ACCEPTED}" }
  - { id: ERR_COI_COVERAGE_REQUIRED, http: 409, condition: "No APPROVED COI plan for this startup covers the current clock" }
  - { id: ERR_INVENTOR_NOT_ON_DISCLOSURE, http: 422, condition: "COI plan inventor_id is not on the startup's disclosure roster" }
  - { id: ERR_NOT_FEDERALLY_FUNDED, http: 422, condition: "Compliance reports require funding_source in {FEDERAL, MIXED}" }
  - { id: ERR_DUPLICATE_INVENTOR, http: 422, condition: "Inventor already on this disclosure's roster" }
  - { id: ERR_SHARE_SUM_INVALID, http: 409, condition: "Share vector does not sum to exactly 10000 basis points" }
  - { id: ERR_COI_WINDOW_OVERLAP, http: 409, condition: "Half-open [coverage_start, coverage_end) overlaps another SUBMITTED/APPROVED plan for the same startup+inventor" }
  - { id: ERR_EXCLUSIVE_OVERLAP, http: 409, condition: "Closed [effective_date, expiration_date] intersects another EXECUTED/ACTIVE/DEFAULT_NOTICE EXCLUSIVE license on the disclosure" }
  - { id: ERR_ASSESSMENT_GATE_FAILED, http: 409, condition: "PURSUE_PATENT decision requires patentability_rating and market_rating both in {HIGH, MEDIUM}" }
  - { id: ERR_UPFRONT_BELOW_FLOOR, http: 402, condition: "EXCLUSIVE execute requires upfront_fee_cents >= 500000" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not match the parent entity's current version" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Inventor
    description: "Faculty/staff/student disclosing an invention; confirms or disputes own roster entries"
    identity: entity_backed:Inventor
    exclusive_operations:
      - "POST /tlo/disclosures"
      - "POST /tlo/disclosure-entries/{entryId}/confirm"
      - "POST /tlo/disclosure-entries/{entryId}/dispute"
    shared_operations:
      - "All GET endpoints"
  - name: TechTransferOfficer
    description: "TTO case manager: roster, assessment, decisions, patent docket, costs, startups"
    identity: opaque
    exclusive_operations:
      - "POST /tlo/disclosures/{id}/inventors"
      - "POST /tlo/disclosures/{id}/inventorship/finalize"
      - "POST /tlo/disclosures/{id}/assessment"
      - "POST /tlo/disclosures/{id}/decision"
      - "POST /tlo/disclosures/{id}/cost-review/clear"
      - "POST /tlo/inventorship-disputes/{id}/resolve"
      - "POST /tlo/disclosures/{id}/patent-applications + all /tlo/patent-applications/{id}/* actions"
      - "POST /tlo/disclosures/{id}/startups, /tlo/startups/{id}/issue-equity, /tlo/startups/{id}/dissolve"
    shared_operations:
      - "All GET endpoints"
  - name: LicensingManager
    description: "Negotiates and manages license agreements, milestones, and royalty report intake"
    identity: opaque
    exclusive_operations:
      - "POST /tlo/disclosures/{id}/licenses"
      - "POST /tlo/licenses/{id}/counter | execute | declare-default | cure | terminate"
      - "POST /tlo/licenses/{id}/milestones and milestone achieve/waive"
      - "POST /tlo/licenses/{id}/royalty-reports"
    shared_operations:
      - "All GET endpoints"
  - name: ComplianceOfficer
    description: "Prepares federal compliance reports and files COI plans; never certifies own work"
    identity: opaque
    exclusive_operations:
      - "POST /tlo/disclosures/{id}/compliance-reports"
      - "POST /tlo/compliance-reports/{id}/submit"
      - "POST /tlo/startups/{id}/coi-plans"
      - "PATCH /tlo/coi-plans/{id}"
    shared_operations:
      - "All GET endpoints"
  - name: ComplianceDirector
    description: "Certifies compliance reports, records agency responses, adjudicates COI plans"
    identity: opaque
    exclusive_operations:
      - "POST /tlo/compliance-reports/{id}/certify | reject | agency-response"
      - "POST /tlo/coi-plans/{id}/approve | reject"
    shared_operations:
      - "All GET endpoints"
  - name: FinanceOfficer
    description: "Accepts royalty reports and prepares distributions; never approves own distributions"
    identity: opaque
    exclusive_operations:
      - "POST /tlo/royalty-reports/{id}/accept"
      - "POST /tlo/royalty-reports/{id}/distribution"
      - "POST /tlo/distributions/{id}/recalculate"
    shared_operations:
      - "All GET endpoints"
  - name: FinanceDirector
    description: "Approves, pays, and cancels distributions"
    identity: opaque
    exclusive_operations:
      - "POST /tlo/distributions/{id}/approve | pay | cancel"
    shared_operations:
      - "All GET endpoints"
  - name: SystemAdmin
    description: "Platform provisioning: departments, inventor roster, logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /tlo/departments"
      - "POST /tlo/inventors"
      - "POST /tlo/_clock/set_current_utc"
    shared_operations:
      - "All GET endpoints"
  - name: Any
    description: "Any authenticated role may read"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "All GET endpoints"
