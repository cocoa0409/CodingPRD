              as: ProgramCoordinator
              captures: { prog: $.data.id }
            - call: "POST /library/presenters"
              payload: { legal_name: "Sam Oyelaran", presenter_type: "INDIVIDUAL", insurance_certificate_expires_on: "2027-06-30", quoted_fee_cents: 50000 }
              as: ProgramCoordinator
