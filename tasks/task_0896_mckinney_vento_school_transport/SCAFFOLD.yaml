# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Clock (test-driving) ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Server startup default is 2026-05-01T00:00:00Z; before any call the clock reads exactly this default and never falls back to wall-clock time."
    roles: [StateCoordinator]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: datetime }"
    side_effects: ["logical clock advances to to_iso8601"]

  # ---- District ----
  - method: POST
    path: "/mv/districts"
    description: "Create a district"
    roles: [StateCoordinator]
    code: 201
    input: [name, nces_code, transport_budget_cents]
    output: District
    side_effects: ["committed_cost_cents=0, transport_balance_cents=0, categorical_eligible_count=0"]
  - method: GET
    path: "/mv/districts/{districtId}"
    description: "Get a district"
    roles: [StateCoordinator, TransportCoordinator, Liaison, Registrar]
    code: 200
    input: []
    output: District
    side_effects: []

  # ---- Liaison ----
  - method: POST
    path: "/mv/liaisons"
    description: "Create a liaison"
    roles: [StateCoordinator]
    code: 201
    input: [district_id, full_name, email, "max_caseload?"]
    output: Liaison
    side_effects: ["current_caseload=0"]
  - method: GET
    path: "/mv/liaisons/{liaisonId}"
    description: "Get a liaison"
    roles: [StateCoordinator, TransportCoordinator, Liaison, Registrar]
    code: 200
    input: []
    output: Liaison
    side_effects: []
  - method: GET
    path: "/mv/liaisons"
    description: "List liaisons (reverse-reachability for Liaison.district_id)"
    roles: [StateCoordinator, TransportCoordinator, Liaison, Registrar]
    code: 200
    input: ["district_id?", "limit?", "offset?"]
    output: Liaison[]
    side_effects: []

  # ---- Student ----
