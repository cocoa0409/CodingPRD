# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Cross-references §1.1–§1.7 against the nine §0.5 Difficulty Rules.
# 9 rule_ids x >=2 instances = 19 instances total.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: dual_variant_production_cost_estimate_vs_committed
        grounds:
          - calculations.production_cost
          - entities.PrintRun.fields.cost_cents
          - entities.Yearbook.fields.production_cost_cents
        distinguishing_aspect: |
          The estimated_cost variant (GET /cost-estimate) sums quantity over PreSaleOrders in
          {PLACED,PAID}=2+3=5 copies for $20.00 vs $20.00 = (104-page surcharge) 2600*5=13000,
          while the committed_cost variant freezes PrintRun.quantity=10 for 2600*10=26000; same
          Yearbook, same per-copy formula, divergent quantity input → 13000 != 26000.
        test_recipe:
          setup:
            - "Yearbook target_page_count=104, unit_cost_cents=1000 (per-copy cost = 1000 + ceil((104-96)/4)*800 = 2600)."
            - "Two PreSaleOrders: one PLACED qty=2, one PAID qty=3 → projected demand = 5."
            - "A committed PrintRun with quantity=10."
          setup_api_calls:
            - call: "POST /yearbooks"
              payload: { school_name: "Lincoln High", academic_year: "2025-2026", target_page_count: 104, unit_cost_cents: 1000, presale_open_iso: "2026-01-01T00:00:00Z", presale_close_iso: "2026-03-01T00:00:00Z" }
              as: Adviser
              as_user_id: "adv-1"
              captures: { yb: $.data.id, yb_v0: $.data.version }
            - call: "POST /yearbooks/presale-orders"
              payload: { yearbook_id: "${yb}", buyer_name: "A", quantity: 2 }
              as: SalesRep
              as_user_id: "sr-1"
              captures: { o1: $.data.id }
            - call: "POST /yearbooks/presale-orders"
              payload: { yearbook_id: "${yb}", buyer_name: "B", quantity: 3 }
              as: SalesRep
              as_user_id: "sr-1"
              captures: { o2: $.data.id }
            - call: "POST /yearbooks/presale-orders/${o2}/pay"
              payload: {}
              as: SalesRep
              as_user_id: "sr-1"
            - call: "GET /yearbooks/${yb}"
              payload: {}
              as: Adviser
              as_user_id: "adv-1"
              captures: { yb_v_now: $.data.version }
            - call: "POST /yearbooks/print-runs"
              payload: { yearbook_id: "${yb}", quantity: 10, delivery_address: "1 School St", expected_yearbook_version: "${yb_v_now}" }
              as: Adviser
              as_user_id: "adv-1"
              captures: { pr: $.data.id }
          trigger:
            - call: "GET /yearbooks/${yb}/cost-estimate"
              payload: {}
              as: Adviser
              as_user_id: "adv-1"
              captures: { est: $.data.estimated_cost_cents, estq: $.data.estimated_quantity }
            - call: "GET /yearbooks/print-runs/${pr}"
              payload: {}
              as: Adviser
              as_user_id: "adv-1"
              captures: { committed: $.data.cost_cents }
          assert:
            - "estimated_quantity == 5"
            - "estimated_cost_cents == 13000"
            - "PrintRun.${pr}.cost_cents == 26000"
            - "estimated_cost_cents != PrintRun.${pr}.cost_cents"

      - name: dual_variant_ad_revenue_vs_presale_revenue
        grounds:
          - calculations.ad_pricing
          - calculations.presale_price
          - entities.Yearbook.fields.ad_revenue_cents
          - entities.Yearbook.fields.presale_revenue_cents
        distinguishing_aspect: |
          Ad revenue is a tiered size-price discounting on AdContract (HALF list 24000, disc 0.10
          → net 21600) accumulated on Yearbook.ad_revenue_cents, while pre-sale revenue is a
          base+stamp+bulk calc on PreSaleOrder (EARLY 6500 + stamp 500, qty 1 → 7000) accumulated
          on a DIFFERENT field presale_revenue_cents — two distinct calculations on two distinct
          entity domains, 21600 vs 7000.
        test_recipe:
          setup:
            - "Yearbook open for pre-sale (clock inside EARLY window)."
            - "Page #2 in ADS section."
            - "One AdContract HALF disc 0.10 SIGNED (net 21600), one PreSaleOrder qty1 personalized PAID (total 7000)."
          setup_api_calls:
            - call: "POST /yearbooks"
              payload: { school_name: "Lincoln High", academic_year: "2025-2026", target_page_count: 96, unit_cost_cents: 1200, presale_open_iso: "2026-01-01T00:00:00Z", presale_close_iso: "2026-03-01T00:00:00Z" }
              as: Adviser
              as_user_id: "adv-1"
              captures: { yb: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: Adviser
              as_user_id: "adv-1"
            - call: "POST /yearbooks/pages"
              payload: { yearbook_id: "${yb}", page_number: 2, section: "ADS", template_code: "T-AD" }
              as: Adviser
              as_user_id: "adv-1"
              captures: { p_ad: $.data.id }
            - call: "POST /yearbooks/ad-contracts"
              payload: { yearbook_id: "${yb}", ladder_page_id: "${p_ad}", sponsor_name: "Joe Pizza", size: "HALF", discount_pct: 0.10 }
              as: SalesRep
              as_user_id: "sr-1"
              captures: { ad: $.data.id, ad_net: $.data.net_price_cents }
            - call: "POST /yearbooks/ad-contracts/${ad}/sign"
              payload: {}
              as: SalesRep
              as_user_id: "sr-1"
            - call: "POST /yearbooks/presale-orders"
              payload: { yearbook_id: "${yb}", buyer_name: "Pat", quantity: 1, personalize: true, stamp_name: "Pat Q." }
              as: SalesRep
              as_user_id: "sr-1"
              captures: { ord: $.data.id, ord_total: $.data.total_price_cents }
            - call: "POST /yearbooks/presale-orders/${ord}/pay"
              payload: {}
              as: SalesRep
              as_user_id: "sr-1"
          trigger:
            - call: "GET /yearbooks/${yb}"
              payload: {}
              as: Adviser
              as_user_id: "adv-1"
              captures: { adrev: $.data.ad_revenue_cents, presrev: $.data.presale_revenue_cents }
          assert:
            - "AdContract.${ad}.net_price_cents == 21600"
            - "PreSaleOrder.${ord}.total_price_cents == 7000"
            - "Yearbook.${yb}.ad_revenue_cents == 21600"
            - "Yearbook.${yb}.presale_revenue_cents == 7000"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: combinatorial_presale_base_stamp_bulk_branch
        grounds:
          - calculations.presale_price
          - entities.PreSaleOrder.fields.total_price_cents
          - entities.PreSaleOrder.fields.price_tier
        distinguishing_aspect: |
          Mode (a): >=3 inputs (base tier 6500, stamp 500/copy, quantity 5) with a non-linear
          conditional bulk branch — gross = (6500+500)*5 = 35000, then 10% bulk discount fires
          ONLY because quantity 5 >= threshold 5, discount = round_half_up(3500)=3500 →
          total 31500; a qty-4 order would NOT trigger the branch.
        test_recipe:
          setup:
            - "Yearbook with EARLY window; clock at 2026-02-01 (inside EARLY)."
            - "Pre-sale order: EARLY tier, personalized, quantity 5 (>= bulk threshold)."
          setup_api_calls:
            - call: "POST /yearbooks"
              payload: { school_name: "Lincoln High", academic_year: "2025-2026", target_page_count: 96, unit_cost_cents: 1200, presale_open_iso: "2026-01-01T00:00:00Z", presale_close_iso: "2026-03-01T00:00:00Z" }
              as: Adviser
              as_user_id: "adv-1"
              captures: { yb: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: Adviser
              as_user_id: "adv-1"
          trigger:
            - call: "POST /yearbooks/presale-orders"
              payload: { yearbook_id: "${yb}", buyer_name: "Bulk Buyer", quantity: 5, personalize: true, stamp_name: "Team" }
              as: SalesRep
              as_user_id: "sr-1"
              captures: { ord: $.data.id }
          assert:
            - "PreSaleOrder.${ord}.price_tier == EARLY"
            - "PreSaleOrder.${ord}.total_price_cents == 31500"

      - name: combinatorial_ad_pricing_rounding_order_pinned
        grounds:
          - calculations.ad_pricing
          - entities.AdContract.fields.net_price_cents
          - entities.AdContract.fields.list_price_cents
        distinguishing_aspect: |
          Mode (b): rounding order pinned. QUARTER list 14000 with discount 0.00025 gives raw
          14000*0.99975 = 13996.5 exactly; the PINNED single-step round_half_up(13996.5) = 13997,
          whereas the forbidden 'round the discount amount (3.5→4) then subtract' yields 13996.
          The scaffold's pinned order makes 13997 the only correct net.
        test_recipe:
          setup:
            - "Yearbook with one ADS-section page #4."
            - "AdContract QUARTER with discount_pct 0.00025 (raw net lands on a .5 cent boundary)."
          setup_api_calls:
            - call: "POST /yearbooks"
              payload: { school_name: "Lincoln High", academic_year: "2025-2026", target_page_count: 96, unit_cost_cents: 1200, presale_open_iso: "2026-01-01T00:00:00Z", presale_close_iso: "2026-03-01T00:00:00Z" }
              as: Adviser
              as_user_id: "adv-1"
              captures: { yb: $.data.id }
            - call: "POST /yearbooks/pages"
              payload: { yearbook_id: "${yb}", page_number: 4, section: "ADS", template_code: "T-AD" }
              as: Adviser
              as_user_id: "adv-1"
              captures: { p_ad: $.data.id }
          trigger:
            - call: "POST /yearbooks/ad-contracts"
              payload: { yearbook_id: "${yb}", ladder_page_id: "${p_ad}", sponsor_name: "Edge Sponsor", size: "QUARTER", discount_pct: 0.00025 }
              as: SalesRep
              as_user_id: "sr-1"
              captures: { ad: $.data.id }
          assert:
            - "AdContract.${ad}.list_price_cents == 14000"
            - "AdContract.${ad}.net_price_cents == 13997"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: non_linear_ladderpage_revision_cycle
        grounds:
          - state_machines.LadderPage.IN_REVIEW_to_CHANGES_REQUESTED
          - state_machines.LadderPage.CHANGES_REQUESTED_to_IN_REVIEW
          - state_machines.LadderPage.IN_REVIEW_to_APPROVED
        distinguishing_aspect: |
          LadderPage cycles IN_REVIEW -> CHANGES_REQUESTED -> IN_REVIEW (a back-edge to an earlier
          state) before reaching APPROVED — a true revision loop on the LadderPage entity, not a
          forward-only pipeline.
        test_recipe:
          setup:
            - "Yearbook + ACTIVE staff assignment; page #1 required_submission_count=0, assigned."
            - "Page driven DRAFT->IN_REVIEW->CHANGES_REQUESTED->IN_REVIEW."
          setup_api_calls:
            - call: "POST /yearbooks"
              payload: { school_name: "Lincoln High", academic_year: "2025-2026", target_page_count: 96, unit_cost_cents: 1200, presale_open_iso: "2026-01-01T00:00:00Z", presale_close_iso: "2026-03-01T00:00:00Z" }
              as: Adviser
              as_user_id: "adv-1"
              captures: { yb: $.data.id }
            - call: "POST /yearbooks/staff-assignments"
              payload: { yearbook_id: "${yb}", staff_user_id: "staff-9", role_title: "EDITOR", deadline_iso: "2026-06-01T00:00:00Z" }
              as: Adviser
              as_user_id: "adv-1"
              captures: { sa: $.data.id }
            - call: "POST /yearbooks/pages"
              payload: { yearbook_id: "${yb}", page_number: 1, section: "STUDENT_LIFE", template_code: "T-2COL", required_submission_count: 0, assigned_staff_id: "${sa}" }
              as: Adviser
              as_user_id: "adv-1"
              captures: { pg: $.data.id }
            - call: "POST /yearbooks/pages/${pg}/submit-review"
              payload: {}
              as: Staff
              as_user_id: "staff-9"
            - call: "POST /yearbooks/pages/${pg}/request-changes"
              payload: {}
              as: Adviser
              as_user_id: "adv-1"
          trigger:
            - call: "POST /yearbooks/pages/${pg}/submit-review"
              payload: {}
              as: Staff
              as_user_id: "staff-9"
              captures: { st: $.data.status }
          assert:
            - "LadderPage.${pg}.status == IN_REVIEW"

      - name: non_linear_submission_reject_resubmit_cycle
        grounds:
          - state_machines.Submission.PENDING_to_REJECTED
          - state_machines.Submission.REJECTED_to_PENDING
        distinguishing_aspect: |
          Submission cycles PENDING -> REJECTED -> PENDING (back-edge) on the DIFFERENT Submission
          entity — a contributor re-submission loop, distinct from the LadderPage review cycle.
        test_recipe:
          setup:
            - "Yearbook + page #1 (DRAFT). One PENDING submission rejected, then resubmitted."
          setup_api_calls:
            - call: "POST /yearbooks"
              payload: { school_name: "Lincoln High", academic_year: "2025-2026", target_page_count: 96, unit_cost_cents: 1200, presale_open_iso: "2026-01-01T00:00:00Z", presale_close_iso: "2026-03-01T00:00:00Z" }
              as: Adviser
              as_user_id: "adv-1"
              captures: { yb: $.data.id }
            - call: "POST /yearbooks/pages"
              payload: { yearbook_id: "${yb}", page_number: 1, section: "SPORTS", template_code: "T-COLLAGE" }
              as: Adviser
              as_user_id: "adv-1"
              captures: { pg: $.data.id }
            - call: "POST /yearbooks/submissions"
              payload: { ladder_page_id: "${pg}", kind: "PHOTO", contributor_id: "c-1", asset_ref: "img/1.jpg" }
              as: Contributor
              as_user_id: "c-1"
              captures: { sub: $.data.id }
            - call: "POST /yearbooks/submissions/${sub}/reject"
              payload: { review_note: "blurry" }
              as: Staff
              as_user_id: "staff-9"
          trigger:
            - call: "POST /yearbooks/submissions/${sub}/resubmit"
              payload: { asset_ref: "img/1b.jpg" }
              as: Contributor
              as_user_id: "c-1"
              captures: { st: $.data.status }
          assert:
            - "Submission.${sub}.status == PENDING"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: cascade_deliver_to_fulfill_to_distribution_depth3
        grounds:
          - state_machines.PrintRun.SHIPPED_to_DELIVERED
          - state_machines.PreSaleOrder.PAID_to_FULFILLED
          - entities.DistributionRecord.fields.presale_order_id
        distinguishing_aspect: |
          Depth-3 chain originating from PrintRun deliver: deliver mutates PrintRun(A)->DELIVERED,
          which itself mutates each PAID PreSaleOrder(B)->FULFILLED, which itself creates a
          DistributionRecord(C). Each link is caused by the previous link, not by the deliver call
          fanning out.
        test_recipe:
          setup:
            - "Yearbook with a PAID pre-sale order (qty 3, buyer 'Dana') and a SHIPPED print run."
          setup_api_calls:
            - call: "POST /yearbooks"
              payload: { school_name: "Lincoln High", academic_year: "2025-2026", target_page_count: 96, unit_cost_cents: 1200, presale_open_iso: "2026-01-01T00:00:00Z", presale_close_iso: "2026-03-01T00:00:00Z" }
              as: Adviser
              as_user_id: "adv-1"
              captures: { yb: $.data.id, yb_v0: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: Adviser
              as_user_id: "adv-1"
            - call: "POST /yearbooks/presale-orders"
              payload: { yearbook_id: "${yb}", buyer_name: "Dana", quantity: 3 }
              as: SalesRep
              as_user_id: "sr-1"
              captures: { ord: $.data.id }
            - call: "POST /yearbooks/presale-orders/${ord}/pay"
              payload: {}
              as: SalesRep
              as_user_id: "sr-1"
            - call: "GET /yearbooks/${yb}"
              payload: {}
              as: Adviser
              as_user_id: "adv-1"
              captures: { yb_v_now: $.data.version }
            - call: "POST /yearbooks/print-runs"
              payload: { yearbook_id: "${yb}", quantity: 50, delivery_address: "1 School St", expected_yearbook_version: "${yb_v_now}" }
              as: Adviser
              as_user_id: "adv-1"
              captures: { pr: $.data.id }
            - call: "POST /yearbooks/print-runs/${pr}/ship"
              payload: {}
              as: Adviser
              as_user_id: "adv-1"
          trigger:
            - call: "POST /yearbooks/print-runs/${pr}/deliver"
              payload: {}
              as: Adviser
              as_user_id: "adv-1"
            - call: "GET /yearbooks/distribution-records?presale_order_id=${ord}"
              payload: {}
              as: Adviser
              as_user_id: "adv-1"
              captures: { rec0: "$.data[0].id", rec0_copies: "$.data[0].copies_handed" }
          assert:
            - "PreSaleOrder.${ord}.status == FULFILLED"
            - "exactly 1 DistributionRecord has presale_order_id == ${ord}"
            - "DistributionRecord.${rec0}.copies_handed == 3"
            - "DistributionRecord.${rec0}.recipient_name == Dana"

      - name: cascade_plant_submit_locks_pages_and_phase_depth2
        grounds:
          - state_machines.Proof.OPEN_to_PLANT_SUBMITTED
          - state_machines.LadderPage.APPROVED_to_LOCKED
          - entities.Yearbook.fields.production_phase
        distinguishing_aspect: |
          Depth-2 chain from a DIFFERENT trigger (Proof submit-plant): submit-plant mutates
          Proof(A)->PLANT_SUBMITTED, which itself mutates each APPROVED LadderPage(B)->LOCKED;
          the page lock is caused by the proof transition, and the Yearbook phase recompute reads
          the new proof state. Distinct propagation pattern from the deliver cascade.
        test_recipe:
          setup:
            - "Single-page Yearbook (target_page_count=4 -> need 4 pages? use target 4 with 4 pages) — simplest: target_page_count=4, one ladder page per slot all APPROVED."
            - "An OPEN proof exists; all 4 pages APPROVED and ladder_complete."
          setup_api_calls:
            - call: "POST /yearbooks"
              payload: { school_name: "Tiny High", academic_year: "2025-2026", target_page_count: 4, unit_cost_cents: 1200, presale_open_iso: "2026-01-01T00:00:00Z", presale_close_iso: "2026-03-01T00:00:00Z" }
              as: Adviser
              as_user_id: "adv-1"
              captures: { yb: $.data.id }
            - call: "POST /yearbooks/staff-assignments"
              payload: { yearbook_id: "${yb}", staff_user_id: "staff-9", role_title: "EDITOR", deadline_iso: "2026-06-01T00:00:00Z" }
              as: Adviser
              as_user_id: "adv-1"
              captures: { sa: $.data.id }
            - call: "POST /yearbooks/pages"
              payload: { yearbook_id: "${yb}", page_number: 1, section: "STUDENT_LIFE", template_code: "T", required_submission_count: 0, assigned_staff_id: "${sa}" }
              as: Adviser
              as_user_id: "adv-1"
              captures: { p1: $.data.id }
            - call: "POST /yearbooks/pages"
              payload: { yearbook_id: "${yb}", page_number: 2, section: "ACADEMICS", template_code: "T", required_submission_count: 0, assigned_staff_id: "${sa}" }
              as: Adviser
              as_user_id: "adv-1"
              captures: { p2: $.data.id }
            - call: "POST /yearbooks/pages"
              payload: { yearbook_id: "${yb}", page_number: 3, section: "CLUBS", template_code: "T", required_submission_count: 0, assigned_staff_id: "${sa}" }
              as: Adviser
              as_user_id: "adv-1"
              captures: { p3: $.data.id }
            - call: "POST /yearbooks/pages"
              payload: { yearbook_id: "${yb}", page_number: 4, section: "SIGNATURE", template_code: "T", required_submission_count: 0, assigned_staff_id: "${sa}" }
              as: Adviser
              as_user_id: "adv-1"
              captures: { p4: $.data.id }
            - call: "POST /yearbooks/pages/${p1}/submit-review"
              payload: {}
              as: Staff
              as_user_id: "staff-9"
            - call: "POST /yearbooks/pages/${p1}/approve"
              payload: {}
              as: Adviser
              as_user_id: "adv-1"
            - call: "POST /yearbooks/pages/${p2}/submit-review"
              payload: {}
              as: Staff
              as_user_id: "staff-9"
            - call: "POST /yearbooks/pages/${p2}/approve"
              payload: {}
              as: Adviser
              as_user_id: "adv-1"
            - call: "POST /yearbooks/pages/${p3}/submit-review"
              payload: {}
              as: Staff
              as_user_id: "staff-9"
            - call: "POST /yearbooks/pages/${p3}/approve"
              payload: {}
              as: Adviser
              as_user_id: "adv-1"
            - call: "POST /yearbooks/pages/${p4}/submit-review"
              payload: {}
              as: Staff
              as_user_id: "staff-9"
            - call: "POST /yearbooks/pages/${p4}/approve"
              payload: {}
              as: Adviser
              as_user_id: "adv-1"
            - call: "POST /yearbooks/proofs"
              payload: { yearbook_id: "${yb}", reviewer_note: "round 1" }
              as: Adviser
              as_user_id: "adv-1"
              captures: { proof: $.data.id }
          trigger:
            - call: "POST /yearbooks/proofs/${proof}/submit-plant"
              payload: {}
              as: Adviser
              as_user_id: "adv-1"
            - call: "GET /yearbooks/pages/${p1}"
              payload: {}
              as: Adviser
              as_user_id: "adv-1"
              captures: { p1_status: $.data.status }
            - call: "GET /yearbooks/${yb}"
              payload: {}
              as: Adviser
              as_user_id: "adv-1"
              captures: { phase: $.data.production_phase }
          assert:
            - "Proof.${proof}.status == PLANT_SUBMITTED"
            - "LadderPage.${p1}.status == LOCKED"
            - "Yearbook.${yb}.production_phase == PLANT"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: priority_state_beats_fiscal_presale_window
        grounds:
          - validations[priority=6]
          - validations[priority=8]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_PRESALE_NOT_OPEN]
        distinguishing_aspect: |
          Pair (state vs business_temporal): cancelling an already-CANCELLED order while also (if it
          were re-evaluated) outside any window — the request fails priority-6 ERR_INVALID_STATE
          (409) before any temporal check, so ERR_INVALID_STATE wins, not ERR_PRESALE_NOT_OPEN.
        test_recipe:
          setup:
            - "Clock at 2026-02-01 (EARLY). A PreSaleOrder placed then CANCELLED."
          setup_api_calls:
            - call: "POST /yearbooks"
              payload: { school_name: "Lincoln High", academic_year: "2025-2026", target_page_count: 96, unit_cost_cents: 1200, presale_open_iso: "2026-01-01T00:00:00Z", presale_close_iso: "2026-03-01T00:00:00Z" }
              as: Adviser
              as_user_id: "adv-1"
              captures: { yb: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: Adviser
              as_user_id: "adv-1"
            - call: "POST /yearbooks/presale-orders"
              payload: { yearbook_id: "${yb}", buyer_name: "X", quantity: 1 }
              as: SalesRep
              as_user_id: "sr-1"
              captures: { ord: $.data.id }
            - call: "POST /yearbooks/presale-orders/${ord}/cancel"
              payload: {}
              as: SalesRep
              as_user_id: "sr-1"
          trigger:
            - call: "POST /yearbooks/presale-orders/${ord}/cancel"
              payload: {}
              as: SalesRep
              as_user_id: "sr-1"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_INVALID_STATE"

      - name: priority_auth_beats_referential_ad_sign
        grounds:
          - validations[priority=2]
          - validations[priority=9]
          - errors[ERR_FORBIDDEN]
          - errors[ERR_AD_PAGE_NOT_ADS_SECTION]
        distinguishing_aspect: |
          Pair (auth/RBAC vs business_referential): a Contributor signs an ad contract whose page is
          NOT in ADS section — priority-2 ERR_FORBIDDEN (403, role not permitted) fires before the
          priority-9 ERR_AD_PAGE_NOT_ADS_SECTION (409) check, so ERR_FORBIDDEN wins. Different
          error-category pair than the state/temporal conflict above.
        test_recipe:
          setup:
            - "Yearbook with a non-ADS page #3 (SPORTS) and a DRAFT AdContract referencing it."
          setup_api_calls:
            - call: "POST /yearbooks"
              payload: { school_name: "Lincoln High", academic_year: "2025-2026", target_page_count: 96, unit_cost_cents: 1200, presale_open_iso: "2026-01-01T00:00:00Z", presale_close_iso: "2026-03-01T00:00:00Z" }
              as: Adviser
              as_user_id: "adv-1"
              captures: { yb: $.data.id }
            - call: "POST /yearbooks/pages"
              payload: { yearbook_id: "${yb}", page_number: 3, section: "SPORTS", template_code: "T" }
              as: Adviser
              as_user_id: "adv-1"
              captures: { pg: $.data.id }
            - call: "POST /yearbooks/ad-contracts"
              payload: { yearbook_id: "${yb}", ladder_page_id: "${pg}", sponsor_name: "Mis-placed Ad", size: "FULL" }
              as: SalesRep
              as_user_id: "sr-1"
              captures: { ad: $.data.id }
          trigger:
            - call: "POST /yearbooks/ad-contracts/${ad}/sign"
              payload: {}
              as: Contributor
              as_user_id: "c-1"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 403"
            - "data.error_id == ERR_FORBIDDEN"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: boundary_presale_window_open_inclusive
        grounds:
          - validations[priority=8]
          - calculations.presale_price
          - errors[ERR_PRESALE_NOT_OPEN]
        distinguishing_aspect: |
          Numeric/temporal boundary on the presale-orders endpoint: an order at EXACTLY
          presale_open_iso (2026-01-01T00:00:00Z) is accepted as EARLY (inclusive lower bound),
          whereas one nanosecond earlier (2025-12-31T23:59:59Z) is rejected ERR_PRESALE_NOT_OPEN.
        test_recipe:
          setup:
            - "Yearbook presale_open_iso=2026-01-01T00:00:00Z. Clock set to EXACTLY the open instant."
          setup_api_calls:
            - call: "POST /yearbooks"
              payload: { school_name: "Lincoln High", academic_year: "2025-2026", target_page_count: 96, unit_cost_cents: 1200, presale_open_iso: "2026-01-01T00:00:00Z", presale_close_iso: "2026-03-01T00:00:00Z" }
              as: Adviser
              as_user_id: "adv-1"
              captures: { yb: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: Adviser
              as_user_id: "adv-1"
          trigger:
            - call: "POST /yearbooks/presale-orders"
              payload: { yearbook_id: "${yb}", buyer_name: "On The Dot", quantity: 1 }
              as: SalesRep
              as_user_id: "sr-1"
              captures: { ord: $.data.id }
          assert:
            - "response status == 201"
            - "PreSaleOrder.${ord}.price_tier == EARLY"
            - "PreSaleOrder.${ord}.total_price_cents == 6500"

      - name: boundary_bulk_discount_threshold_count
        grounds:
          - calculations.presale_price
          - entities.PreSaleOrder.fields.total_price_cents
        distinguishing_aspect: |
          Count boundary on a DIFFERENT metric (quantity) and the SAME presale-orders endpoint
          exercised at the threshold edge: quantity 4 yields NO bulk discount (gross 26000 at
          EARLY+stamp), quantity 5 (>= threshold) triggers 10% off → from 32500 to 29250.
        test_recipe:
          setup:
            - "Clock at 2026-02-01 (EARLY). Two orders qty 4 (no-stamp) and qty 5 (no-stamp)."
          setup_api_calls:
            - call: "POST /yearbooks"
              payload: { school_name: "Lincoln High", academic_year: "2025-2026", target_page_count: 96, unit_cost_cents: 1200, presale_open_iso: "2026-01-01T00:00:00Z", presale_close_iso: "2026-03-01T00:00:00Z" }
              as: Adviser
              as_user_id: "adv-1"
              captures: { yb: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: Adviser
              as_user_id: "adv-1"
            - call: "POST /yearbooks/presale-orders"
              payload: { yearbook_id: "${yb}", buyer_name: "Four", quantity: 4 }
              as: SalesRep
              as_user_id: "sr-1"
              captures: { o4: $.data.id }
          trigger:
            - call: "POST /yearbooks/presale-orders"
              payload: { yearbook_id: "${yb}", buyer_name: "Five", quantity: 5 }
              as: SalesRep
              as_user_id: "sr-1"
              captures: { o5: $.data.id }
          assert:
            - "PreSaleOrder.${o4}.total_price_cents == 26000"
            - "PreSaleOrder.${o5}.total_price_cents == 29250"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
