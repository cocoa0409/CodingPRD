  # ===========================================================================
  # Rule 5 — priority_pair_validation_conflict (different error-category pairs)
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: invalid_state_beats_credit_hold_on_co_approve
        grounds:
          - validations[priority=6]
          - validations[priority=17]
          - state_machines.ChangeOrder.APPROVED_to_SUPERSEDED
        distinguishing_aspect: |
          Category pair state (priority 6) vs business_constraint/credit_hold
          (priority 17): approving an already-APPROVED ChangeOrder while the customer
          is ALSO on credit_hold returns ERR_INVALID_STATE (409), not
          ERR_CREDIT_HOLD (402) — the state precondition outranks the fiscal gate.
        test_recipe:
          setup:
            - "Job J-9001 with one APPROVED change order; customer then placed on credit_hold"
          setup_api_calls:
            - call: "POST /panel-shop/customers"
              payload: { company_name: "Kappa Dairy", site_state_code: "WI" }
              as: ProjectManager
              captures: { cust10_id: "$.data.id" }
            - call: "POST /panel-shop/jobs"
              payload: { customer_id: "${cust10_id}", job_number: "J-9001", quoted_price_cents: 1000000 }
              as: ProjectManager
              captures: { job10_id: "$.data.id" }
            - call: "POST /panel-shop/jobs/${job10_id}/change-orders"
              payload: { description: "scope add A", price_delta_cents: 120000 }
              as: ProjectManager
              captures: { co_d: "$.data.id" }
            - call: "GET /panel-shop/jobs/${job10_id}"
              payload: {}
              as: Customer
              as_user_id: "${cust10_id}"
              captures: { job10_ver: "$.data.version" }
            - call: "POST /panel-shop/change-orders/${co_d}/approve"
              payload: { expected_job_version: "${job10_ver}" }
              as: Customer
              as_user_id: "${cust10_id}"
            - call: "PATCH /panel-shop/customers/${cust10_id}"
              payload: { credit_hold: true }
              as: ProjectManager
          trigger:
            - call: "POST /panel-shop/change-orders/${co_d}/approve"
              payload: { expected_job_version: "${job10_ver}" }
              as: Customer
              as_user_id: "${cust10_id}"
              captures: { err_id: "$.data.error_id" }
          assert:
            - "response status == 409"
            - "error_id == ERR_INVALID_STATE (NOT ERR_CREDIT_HOLD and NOT ERR_STALE_VERSION)"

      - name: stale_version_beats_duplicate_hash_on_program_release
        grounds:
          - validations[priority=7]
          - validations[priority=16]
          - concurrency_rules[program-release-stale-panel]
        distinguishing_aspect: |
          Category pair state/OCC (priority 7) vs business_referential/uniqueness
          (priority 16): releasing a program with BOTH a stale
          expected_panel_version AND a content_hash identical to the already-released
          version returns ERR_STALE_VERSION (412), not ERR_DUPLICATE (409) — the OCC
          check is evaluated before referential uniqueness.
        test_recipe:
          setup:
            - "Panel with one RELEASED program v1.0.0 (hash H); panel.version advanced by a second successful release v1.1.0 (hash H2)"
            - "Client still holds the pre-v1.1.0 version number and attempts a third release reusing hash H"
          setup_api_calls:
            - call: "POST /panel-shop/customers"
              payload: { company_name: "Lambda Packaging", site_state_code: "MO" }
              as: ProjectManager
              captures: { cust11_id: "$.data.id" }
            - call: "POST /panel-shop/jobs"
              payload: { customer_id: "${cust11_id}", job_number: "J-9002", quoted_price_cents: 300000 }
              as: ProjectManager
              captures: { job11_id: "$.data.id" }
            - call: "POST /panel-shop/jobs/${job11_id}/panels"
              payload: { panel_tag: "P-O1", enclosure_rating: "NEMA_1", design_engineer_id: "de-008" }
              as: DesignEngineer
              captures: { panel_o: "$.data.id", panel_o_v0: "$.data.version" }
            - call: "POST /panel-shop/panels/${panel_o}/program-versions"
              payload: { version_tag: "v1.0.0", content_hash: "aaaa0000eeff0011223344556677889900112233445566778899aabbccddeeff00", expected_panel_version: "${panel_o_v0}" }
              as: ControlsEngineer
            - call: "GET /panel-shop/panels/${panel_o}"
              payload: {}
              as: ControlsEngineer
              captures: { panel_o_v1: "$.data.version" }
            - call: "POST /panel-shop/panels/${panel_o}/program-versions"
              payload: { version_tag: "v1.1.0", content_hash: "bbbb0000eeff0011223344556677889900112233445566778899aabbccddeeff00", expected_panel_version: "${panel_o_v1}" }
              as: ControlsEngineer
          trigger:
            - call: "POST /panel-shop/panels/${panel_o}/program-versions"
              payload: { version_tag: "v1.2.0", content_hash: "aaaa0000eeff0011223344556677889900112233445566778899aabbccddeeff00", expected_panel_version: "${panel_o_v1}" }
              as: ControlsEngineer
              captures: { err_id2: "$.data.error_id" }
          assert:
            - "response status == 412"
            - "error_id == ERR_STALE_VERSION (NOT ERR_DUPLICATE even though content_hash duplicates v1.0.0's)"

  # ===========================================================================
  # Rule 6 — boundary_precision_check (different metrics / endpoints)
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: sccr_exactly_5_passes_4_fails_submit_review
        grounds:
          - validations[priority=9]
          - state_machines.Panel.DESIGN_to_DESIGN_REVIEW
        distinguishing_aspect: |
          Numeric threshold boundary on POST /panels/{id}/submit-review: the rule is
          sccr_rating_ka >= 5, so a panel whose weakest link is exactly 5 kA passes
          (>= is inclusive) while an otherwise identical panel at 4 kA is rejected
          with ERR_SCCR_BELOW_MINIMUM. Metric is integer kA on the submit-review
          endpoint.
        test_recipe:
          setup:
            - "Two panels on one job: P-B5 with BOM {CONTACTOR 5kA} (rating exactly 5), P-B4 with BOM {CONTACTOR 4kA} (rating 4)"
          setup_api_calls:
