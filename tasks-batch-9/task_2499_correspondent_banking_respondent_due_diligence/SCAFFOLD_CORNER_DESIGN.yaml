          setup: ["An APPROVED respondent reached over the licence-lapse-then-lift route, then taken through one full refresh cycle over the HALF-OPEN window [2026-08-01, 2026-09-01) that is COMPLETED with a REFRESH_FINAL reassessment. The clock never moves, so every later window lies in the future."]
