  # ===========================================================================
  # RULE 9 — compensating_invariant
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: payment_void_restores_policy_indemnity_capital_exactly
        grounds:
          - state_machines.IndemnityPayment.APPROVED_to_VOIDED
          - calculations.indemnity_waterfall
          - entities.Policy.fields.indemnity_paid_cents
          - entities.Policy.fields.aggregate_limit_remaining_cents
          - endpoints["POST /epli/indemnity-payments/{payment_id}/void"]
        distinguishing_aspect: |
          Conserved quantity: the policy's INDEMNITY CAPITAL, i.e. the identity
          aggregate_limit_cents == aggregate_limit_remaining_cents + indemnity_paid_cents
          + defense_spend_cents, which must hold both before and after the void and must
          return to exactly its pre-payment reading of 10000000 / 0 / 0 with
          limit_posture back to OPEN. The claim's own retention_satisfied_cents must also
          unwind to 0 while the Claim deliberately STAYS in RESOLVED — the compensation
          reverses the money movements without reversing the claim's lifecycle.
        test_recipe:
          setup:
            - "Chain S: jurisdiction TX (T2), ACTIVE RatePlan, applicant 'Bayline Foods LLC', policy ACTIVE / OPEN for [2026-08-01, 2027-08-01) with aggregate_limit_cents 10000000, per_claim_retention_cents 2500000, wage_hour_sublimit_cents 2500000 and third_party_sublimit_cents 4000000."
            - "A DISCRIMINATION / EMPLOYEE claim (coverage_bucket FIRST_PARTY, applied_retention_cents 2500000) is accepted."
            - "adj-001 drafts a 4000000 SETTLEMENT payment against a freshly read policy version and clm-001 approves it, so retention_portion_cents is 2500000, insurer_portion_cents is 1500000 and the claim is RESOLVED."
          setup_api_calls:
            - call: "POST /epli/jurisdictions"
              payload: { code: "TX", name: "Texas", hazard_tier: "T2", admin_agency_name: "Texas Workforce Commission Civil Rights Division", pre_suit_window_days: 120, wage_hour_multiplier: 1.10, class_action_propensity_pct: 18.00, pre_suit_mediation_required: false }
              as: PlatformAdmin
              as_user_id: "admin-001"
            - call: "POST /epli/rate-plans"
              payload: { name: "EPLI Standard 2026", base_rate_per_employee_cents: 41750, min_premium_cents: 750000, wage_hour_sublimit_pct: 0.25, third_party_sublimit_pct: 0.40 }
              as: PlatformAdmin
              as_user_id: "admin-001"
              captures: { plan_id: $.data.id }
            - call: "POST /epli/rate-plans/${plan_id}/activate"
              payload: {}
              as: PlatformAdmin
              as_user_id: "admin-001"
            - call: "POST /epli/applicants"
              payload: { legal_name: "Bayline Foods LLC", total_headcount: 40, prior_year_separations: 4, jurisdiction_headcounts: [{ code: "TX", headcount: 40 }], primary_jurisdiction_code: "TX" }
              as: Underwriter
              as_user_id: "uw-001"
              captures: { app_id: $.data.id, app_v: $.data.version }
            - call: "POST /epli/exposure-assessments"
              payload: { applicant_id: "${app_id}", rate_plan_id: "${plan_id}", requested_aggregate_limit_cents: 10000000, requested_retention_cents: 2500000, expected_applicant_version: "${app_v}" }
              as: Underwriter
              as_user_id: "uw-001"
              captures: { asmt_id: $.data.id }
            - call: "POST /epli/exposure-assessments/${asmt_id}/price"
              payload: {}
              as: Underwriter
              as_user_id: "uw-001"
            - call: "POST /epli/exposure-assessments/${asmt_id}/approve"
              payload: {}
              as: UnderwritingManager
              as_user_id: "uwm-001"
            - call: "POST /epli/policies"
              payload: { exposure_assessment_id: "${asmt_id}", effective_from: "2026-08-01T00:00:00.000Z", effective_to: "2027-08-01T00:00:00.000Z" }
              as: Underwriter
              as_user_id: "uw-001"
              captures: { pol_id: $.data.id }
            - call: "POST /epli/policies/${pol_id}/claims"
              payload: { claim_type: "DISCRIMINATION", claimant_class: "EMPLOYEE", notice_type: "LAWSUIT", first_notice_at: "2026-08-02T00:00:00.000Z", alleged_damages_cents: 4500000 }
              as: ClaimsAdjuster
              as_user_id: "adj-001"
              captures: { c1_id: $.data.id }
            - call: "POST /epli/claims/${c1_id}/start-review"
              payload: {}
              as: ClaimsAdjuster
              as_user_id: "adj-001"
            - call: "POST /epli/claims/${c1_id}/coverage-decision"
              payload: { decision: "ACCEPT" }
              as: ClaimsAdjuster
              as_user_id: "adj-001"
            - call: "GET /epli/policies/${pol_id}"
              payload: {}
              as: ClaimsAdjuster
              as_user_id: "adj-001"
              captures: { pol_v: $.data.version }
            - call: "POST /epli/claims/${c1_id}/indemnity-payments"
              payload: { amount_cents: 4000000, payment_basis: "SETTLEMENT", expected_policy_version: "${pol_v}" }
              as: ClaimsAdjuster
              as_user_id: "adj-001"
              captures: { pay_id: $.data.id }
            - call: "POST /epli/indemnity-payments/${pay_id}/approve"
              payload: {}
              as: ClaimsManager
              as_user_id: "clm-001"
            - call: "GET /epli/policies/${pol_id}/limit-ledger"
              payload: {}
              as: ClaimsManager
              as_user_id: "clm-001"
          trigger:
            - call: "POST /epli/indemnity-payments/${pay_id}/void"
              payload: { void_reason: "Settlement agreement rescinded before disbursement" }
              as: ClaimsManager
              as_user_id: "clm-001"
          assert:
            - "immediately before the void the ledger read shows Policy.${pol_id}.indemnity_paid_cents == 1500000 AND aggregate_limit_remaining_cents == 8500000 AND defense_spend_cents == 0 AND limit_posture == ERODED, and the invariant holds: 10000000 == 8500000 + 1500000 + 0"
            - "the trigger returns http_status 200 with IndemnityPayment.${pay_id}.status == VOIDED AND void_reason == 'Settlement agreement rescinded before disbursement'"
            - "IndemnityPayment.${pay_id}.retention_portion_cents == 2500000 AND insurer_portion_cents == 1500000 are PRESERVED on the voided row — the audit trail of what was reversed is not erased"
            - "after the void Policy.${pol_id}.indemnity_paid_cents == 0 AND aggregate_limit_remaining_cents == 10000000 AND defense_spend_cents == 0, so the invariant still holds exactly: 10000000 == 10000000 + 0 + 0"
            - "Policy.${pol_id}.limit_posture == OPEN — the posture derived from the restored ledger returns to its pre-payment reading, with no residual ERODED drift"
            - "Policy.${pol_id}.wage_hour_sublimit_remaining_cents == 2500000 AND third_party_sublimit_remaining_cents == 4000000 (a FIRST_PARTY payment never touched them, and the void must not credit them either)"
            - "Claim.${c1_id}.retention_satisfied_cents == 0 AND Claim.${c1_id}.indemnity_paid_cents == 0"
            - "Claim.${c1_id}.status == RESOLVED — the money is unwound but the claim lifecycle is deliberately NOT rolled back to COVERAGE_ACCEPTED"

