# =============================================================================
# Cloth Diaper & Linen Route Service — benchmark seed tables
# =============================================================================

scenario: |
  Cloth Diaper & Linen Route Service (regional cloth diaper service): subscription tier by weekly quantity & bag exchange, route stop sequencing & missed-pickup handling, soiled intake weight vs clean count reconciliation, wash formula & sanitization validation, sizing change & inventory swap as child grows, lost/damaged item accounting & deposit, service pause for travel & billing proration, new-customer starter kit & onboarding

domain_name: cloth-diaper-linen-route
api_prefix: /api

# =============================================================================
# Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - derived_field_reconciliation
  entity_topology: flat
  state_machine_shape: parallel   # Subscription carries service_status x billing_status; plus cyclic (WashBatch, Customer, Invoice) and guarded machines
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: hierarchical_override
  consistency_model: immediate
  entity_count: 15
  state_machine_count: 12
  calculation_count: 11
  validation_layers: 29
  endpoint_count: 61
  error_code_count: 30
  role_count: 5

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (flat topology, FK-linked)
# =============================================================================
entities:
  - name: SubscriptionPlan
    parent: null
    common_fields: true
    fields:
      - { name: tier_code, type: string, source: input, description: "Unique tier code, e.g. ESSENTIAL | STANDARD | STANDARD_W", constraints: "unique across all plans" }
      - { name: weekly_quota, type: integer, source: input, description: "Included clean items per billing week", constraints: "> 0" }
      - { name: weekly_fee_cents, type: integer, source: input, description: "Weekly subscription fee in cents", constraints: ">= 0" }
      - { name: overage_rate_cents, type: integer, source: input, description: "Per-item cents charged beyond weekly_quota", constraints: ">= 0" }
      - { name: overage_cap_items, type: integer, source: input, description: "Max billable overage items per week", default: 20, constraints: ">= 0" }
      - { name: deposit_cents, type: integer, source: input, description: "Refundable deposit auto-charged at subscription creation", constraints: ">= 0" }
      - { name: service_bags_per_week, type: integer, source: input, description: "Clean bags exchanged per week", default: 1, constraints: ">= 1" }
      - { name: weight_policy, type: enum, source: input, description: "COUNT_BASIS | WEIGHT_BASIS — selects verified-count variant used by reconciliation" }
      - { name: kit_reserve_pct, type: integer, source: input, description: "Starter kit reserve percentage over weekly_quota", default: 10, constraints: "0..100" }

  - name: ServiceZone
    parent: null
    common_fields: true
    fields:
      - { name: zone_code, type: string, source: input, description: "Unique zone code", constraints: "unique" }
      - { name: service_weekdays, type: array, source: input, description: "Service weekdays, subset of MON,TUE,WED,THU,FRI,SAT,SUN", constraints: "1..6 distinct entries" }
      - { name: service_days_per_week, type: integer, source: computed, description: "Derived: length of service_weekdays" }
      - { name: stop_cutoff_hours, type: integer, source: input, description: "Hours before route_date 00:00Z after which sequence/lock are rejected", default: 24, constraints: ">= 0" }
      - { name: active, type: boolean, source: input, description: "Whether the zone accepts new subscriptions", default: true }

  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Customer name" }
      - { name: email, type: string, source: input, description: "Customer email", constraints: "unique" }
      - { name: service_zone_id, type: string, source: input, description: "FK -> ServiceZone.id; home zone" }
      - { name: child_birthdate, type: string, source: input, description: "Child birthdate ISO date" }
      - { name: child_size_code, type: enum, source: input, description: "NEWBORN | SMALL | MEDIUM | LARGE | XL" }
      - { name: status, type: enum, source: system, description: "ONBOARDING | ACTIVE | SUSPENDED | CLOSED; initial ONBOARDING" }
      - { name: deposit_charged_cents, type: integer, source: computed, description: "Lifetime deposit charged; invariant anchor", default: 0 }
      - { name: deposit_held_cents, type: integer, source: computed, description: "Deposit currently held; never negative", default: 0 }
      - { name: deposit_applied_cents, type: integer, source: computed, description: "Deposit consumed by lost/damaged charges", default: 0 }
      - { name: deposit_refunded_cents, type: integer, source: computed, description: "Deposit refunded at termination", default: 0 }

  - name: Subscription
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id" }
      - { name: subscription_plan_id, type: string, source: input, description: "FK -> SubscriptionPlan.id" }
      - { name: service_zone_id, type: string, source: input, description: "FK -> ServiceZone.id" }
      - { name: start_date, type: string, source: input, description: "First eligible service date (ISO date)" }
      - { name: current_size_code, type: enum, source: input, description: "NEWBORN | SMALL | MEDIUM | LARGE | XL; updated by completed InventorySwap" }
      - { name: window_start_minutes, type: integer, source: input, description: "Preferred stop window start, minutes after midnight", constraints: "0..1439, < window_end_minutes" }
      - { name: window_end_minutes, type: integer, source: input, description: "Preferred stop window end, minutes after midnight", constraints: "1..1440" }
      - { name: service_status, type: enum, source: system, description: "PENDING_START | ACTIVE | PAUSED | SUSPENDED | TERMINATED; initial PENDING_START" }
      - { name: billing_status, type: enum, source: system, description: "CURRENT | PAST_DUE; independent parallel dimension", default: "CURRENT" }
      - { name: missed_stop_count, type: integer, source: computed, description: "Lifetime count of stops that transitioned to MISSED", default: 0 }

  - name: ServicePause
    parent: null
    common_fields: true
    fields:
      - { name: subscription_id, type: string, source: input, description: "FK -> Subscription.id" }
      - { name: start_date, type: string, source: input, description: "Pause start (inclusive), half-open window" }
      - { name: end_date, type: string, source: input, description: "Pause end (exclusive), half-open window" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | ACTIVE | COMPLETED | CANCELLED; initial SCHEDULED" }
      - { name: estimated_credit_cents, type: integer, source: computed, description: "PROVISIONAL variant: whole billing weeks touched x weekly_fee_cents, fixed at creation" }
      - { name: final_credit_cents, type: integer, source: computed, description: "FINAL variant: per-paused-service-day rounded lines summed; set when pause completes", default: null }

  - name: StarterKit
    parent: null
    common_fields: true
    fields:
      - { name: subscription_id, type: string, source: system, description: "FK -> Subscription.id; created with subscription" }
      - { name: size_code, type: enum, source: system, description: "Size of kitted items; equals subscription.current_size_code at creation, updated by swap completion" }
      - { name: item_count, type: integer, source: computed, description: "weekly_quota + ceil(weekly_quota * kit_reserve_pct / 100)" }
      - { name: items_returned_count, type: integer, source: system, description: "Set by RETURN event", default: 0 }
      - { name: status, type: enum, source: system, description: "RESERVED | ISSUED | RETURNED | SETTLED; initial RESERVED" }

  - name: InventoryPool
    parent: null
    common_fields: true
    fields:
      - { name: size_code, type: enum, source: input, description: "NEWBORN | SMALL | MEDIUM | LARGE | XL", constraints: "unique per pool" }
      - { name: on_hand_units, type: integer, source: system, description: "Units at plant ready to issue", default: 0 }
      - { name: reserved_units, type: integer, source: system, description: "Units reserved by kits/approved swaps", default: 0 }
      - { name: in_transit_units, type: integer, source: system, description: "Units staged outbound on a swap", default: 0 }
      - { name: checked_out_units, type: integer, source: system, description: "Units with customers", default: 0 }
      - { name: in_wash_units, type: integer, source: system, description: "Units loaded in wash batches", default: 0 }
      - { name: quarantined_units, type: integer, source: system, description: "Units locked by failed sanitization", default: 0 }
      - { name: lost_units, type: integer, source: system, description: "Units confirmed lost", default: 0 }
      - { name: retired_units, type: integer, source: system, description: "Units retired from service", default: 0 }
      - { name: total_acquired_units, type: integer, source: system, description: "Lifetime acquired units", default: 0 }
      - { name: available_units, type: integer, source: computed, description: "on_hand_units - reserved_units" }

  - name: InventorySwap
    parent: null
    common_fields: true
    fields:
      - { name: subscription_id, type: string, source: input, description: "FK -> Subscription.id" }
      - { name: from_size_code, type: enum, source: system, description: "subscription.current_size_code at request time" }
      - { name: to_size_code, type: enum, source: input, description: "Target size; must be exactly one step from from_size_code in NEWBORN<SMALL<MEDIUM<LARGE<XL" }
      - { name: quantity, type: integer, source: computed, description: "Kit size for to_size_code: weekly_quota + ceil(weekly_quota * kit_reserve_pct / 100)" }
      - { name: returned_old_count, type: integer, source: system, description: "Old-size units returned, set by COMPLETE event", default: 0 }
      - { name: shortage_count, type: integer, source: computed, description: "max(0, kit.item_count - returned_old_count) at COMPLETE", default: 0 }
      - { name: status, type: enum, source: system, description: "REQUESTED | APPROVED | STAGED | COMPLETED | DENIED | CANCELLED; initial REQUESTED" }

  - name: Route
    parent: null
    common_fields: true
    fields:
      - { name: service_zone_id, type: string, source: input, description: "FK -> ServiceZone.id" }
      - { name: route_date, type: string, source: input, description: "Service date (ISO date); must be a zone service weekday" }
      - { name: status, type: enum, source: system, description: "PLANNED | SEQUENCED | LOCKED | IN_PROGRESS | COMPLETED | CANCELLED; initial PLANNED" }
      - { name: planned_stop_count, type: integer, source: computed, description: "Stops in PLANNED status on this route", default: 0 }
      - { name: completed_stop_count, type: integer, source: computed, description: "Stops in COMPLETED status on this route", default: 0 }
      - { name: total_clean_items_delivered, type: integer, source: computed, description: "Sum of clean_items_delivered over COMPLETED stops", default: 0 }
      - { name: total_soiled_bags_collected, type: integer, source: computed, description: "Sum of soiled_bags_collected over COMPLETED stops", default: 0 }

  - name: RouteStop
    parent: null
    common_fields: true
    fields:
      - { name: route_id, type: string, source: system, description: "FK -> Route.id (input on manual makeup-stop creation)" }
      - { name: subscription_id, type: string, source: system, description: "FK -> Subscription.id (input on manual makeup-stop creation)" }
      - { name: stop_seq, type: integer, source: system, description: "1-based sequence assigned at SEQUENCED; null while route PLANNED", default: null }
      - { name: window_start_minutes, type: integer, source: system, description: "Copied from subscription at auto-creation; client input on manual creation", constraints: "0..1439" }
      - { name: window_end_minutes, type: integer, source: system, description: "Copied from subscription at auto-creation; client input on manual creation", constraints: "1..1440, > window_start_minutes" }
      - { name: status, type: enum, source: system, description: "PLANNED | COMPLETED | MISSED | SKIPPED | FORFEITED | RESCHEDULED; initial PLANNED" }
      - { name: clean_items_delivered, type: integer, source: system, description: "Set by complete", default: 0 }
      - { name: soiled_bags_collected, type: integer, source: system, description: "Set by complete", default: 0 }
      - { name: is_makeup, type: boolean, source: system, description: "True for stops created manually or by RESCHEDULE", default: false }
      - { name: rescheduled_to_stop_id, type: string, source: system, description: "Replacement stop id set by RESCHEDULE", default: null }

  - name: SoiledIntake
    parent: null
    common_fields: true
    fields:
      - { name: route_stop_id, type: string, source: input, description: "FK -> RouteStop.id; at most one intake per stop", constraints: "unique per route_stop_id" }
      - { name: wash_batch_id, type: string, source: system, description: "FK -> WashBatch.id; set when loaded", default: null }
      - { name: scale_weight_g, type: integer, source: input, description: "Scale weight of soiled items in grams", constraints: "> 0" }
      - { name: soil_level, type: enum, source: input, description: "LIGHT | NORMAL | HEAVY" }
      - { name: expected_weight_g, type: integer, source: computed, description: "clean_items_delivered x tare_g(size) x SOIL_FACTOR_MILLI / 1000" }
      - { name: variance_pct, type: number, source: computed, description: "round_half_up(|scale - expected| x 10000 / expected) / 100, two decimals" }
      - { name: verified_count, type: integer, source: computed, description: "COUNT_BASIS: clean_items_delivered; WEIGHT_BASIS: round_half_up(scale_weight_g / (tare_g x 2.5)); overridden by RESOLVE" }
      - { name: status, type: enum, source: system, description: "RECONCILED | DISPUTED | RESOLVED; initial RECONCILED when variance_pct <= 10.00 else DISPUTED" }
      - { name: resolution, type: enum, source: system, description: "ACCEPT_COUNT | ACCEPT_WEIGHT; set by RESOLVE", default: null }

  - name: WashFormula
    parent: null
    common_fields: true
    fields:
      - { name: formula_code, type: string, source: input, description: "Unique formula code", constraints: "unique" }
      - { name: base_detergent_ml_per_kg, type: integer, source: input, description: "Detergent base dose ml per kg of load" }
      - { name: sanitizer_ml_per_kg, type: integer, source: input, description: "Sanitizer dose ml per kg of load" }
      - { name: min_temp_celsius, type: integer, source: input, description: "Sanitization pass requires peak temp >= this" }
      - { name: min_dwell_seconds, type: integer, source: input, description: "Sanitization pass requires dwell >= this" }
      - { name: chlorine_ppm_min, type: integer, source: input, description: "Sanitization pass requires ppm >= this" }
      - { name: chlorine_ppm_max, type: integer, source: input, description: "Sanitization pass requires ppm <= this" }
      - { name: max_rewash_count, type: integer, source: input, description: "Max REWASH transitions per batch", default: 2 }

  - name: WashBatch
    parent: null
    common_fields: true
    fields:
      - { name: wash_formula_id, type: string, source: input, description: "FK -> WashFormula.id" }
      - { name: formula_version, type: integer, source: system, description: "WashFormula.version pinned at batch creation" }
      - { name: soil_level, type: enum, source: input, description: "LIGHT | NORMAL | HEAVY" }
      - { name: water_hardness, type: enum, source: input, description: "SOFT | MEDIUM | HARD" }
      - { name: status, type: enum, source: system, description: "RECEIVING | LOADED | WASHING | VALIDATING | RELEASED | QUARANTINED; initial RECEIVING" }
      - { name: total_load_g, type: integer, source: computed, description: "Sum of scale_weight_g over loaded intakes", default: 0 }
      - { name: dosed_detergent_ml, type: integer, source: computed, description: "Computed at START_WASH via wash_chemistry_dosing", default: null }
      - { name: dosed_sanitizer_ml, type: integer, source: computed, description: "round_half_up(total_load_g/1000 x formula.sanitizer_ml_per_kg)", default: null }
      - { name: rewash_count, type: integer, source: system, description: "Number of REWASH transitions", default: 0 }
      - { name: wash_started_by, type: string, source: system, description: "X-User-ID of START_WASH actor", default: null }
      - { name: validated_by, type: string, source: system, description: "X-User-ID of RECORD_SANITIZATION actor", default: null }
      - { name: validation_passed, type: boolean, source: computed, description: "Result of sanitization_validation; null until recorded", default: null }

  - name: LostItemCase
    parent: null
    common_fields: true
    fields:
      - { name: subscription_id, type: string, source: input, description: "FK -> Subscription.id" }
      - { name: inventory_pool_id, type: string, source: input, description: "FK -> InventoryPool.id; size pool of the lost/damaged items" }
      - { name: case_type, type: enum, source: input, description: "LOST | DAMAGED" }
      - { name: item_count, type: integer, source: input, description: "Number of items", constraints: ">= 1" }
      - { name: first_issued_date, type: string, source: input, description: "ISO date items first issued; drives age band" }
      - { name: assessed_fee_cents, type: integer, source: input, description: "Required when case_type=DAMAGED; ignored for LOST", default: null }
      - { name: charge_cents, type: integer, source: computed, description: "Computed at CHARGE; null before", default: null }
      - { name: status, type: enum, source: system, description: "OPEN | CHARGED | DISPUTED | SETTLED | WAIVED; initial OPEN" }

  - name: Invoice
    parent: null
    common_fields: true
    fields:
      - { name: subscription_id, type: string, source: input, description: "FK -> Subscription.id" }
      - { name: period_start, type: string, source: input, description: "ISO date, inclusive; period must be exactly 7 days" }
      - { name: period_end, type: string, source: input, description: "ISO date, exclusive; period_end - period_start == 7 days" }
      - { name: status, type: enum, source: system, description: "DRAFT | ISSUED | PAID | PAST_DUE | VOID | WRITTEN_OFF; initial DRAFT" }
      - { name: base_fee_cents, type: integer, source: computed, description: "weekly_fee_cents for the week" }
      - { name: overage_cents, type: integer, source: computed, description: "Sum over qualifying intakes of min(max(verified_count - weekly_quota, 0), overage_cap_items) x overage_rate_cents" }
      - { name: pause_credit_cents, type: integer, source: computed, description: "Sum of per-paused-service-day lines, each rounded half-up before summing" }
      - { name: total_cents, type: integer, source: computed, description: "base_fee_cents + overage_cents - pause_credit_cents" }
      - { name: issued_at, type: datetime, source: system, description: "Set by ISSUE event", default: null }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Customer
    field: status
    initial_state: ONBOARDING
    terminal_states: [CLOSED]
    transitions:
      - from: ONBOARDING
        to: ACTIVE
        trigger: "POST /api/customers/{customer_id}/events (ACTIVATE)"
        actor: PlatformAdmin
        preconditions:
          - "Customer owns at least one Subscription in PENDING_START (ERR_INVALID_STATE)"
        side_effects: []
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /api/customers/{customer_id}/events (SUSPEND)"
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "Cascade 1: each Subscription of this customer with service_status ACTIVE -> SUSPENDED"
          - "Cascade 2: each such suspension moves that subscription's RouteStops in PLANNED -> SKIPPED"
          - "Cascade 3: each skip recomputes the parent Route manifest counters and increments Route.version"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /api/customers/{customer_id}/events (REINSTATE)"
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "Each Subscription of this customer with service_status SUSPENDED -> ACTIVE"
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /api/customers/{customer_id}/events (CLOSE)"
        actor: PlatformAdmin
        preconditions:
          - "All Subscriptions of this customer are TERMINATED"
        side_effects: []
      - from: SUSPENDED
        to: CLOSED
        trigger: "POST /api/customers/{customer_id}/events (CLOSE)"
        actor: PlatformAdmin
        preconditions:
          - "All Subscriptions of this customer are TERMINATED"
        side_effects: []

  - entity: Subscription
    field: service_status
    initial_state: PENDING_START
    terminal_states: [TERMINATED]
    transitions:
      - from: PENDING_START
        to: ACTIVE
        trigger: "POST /api/subscriptions/{subscription_id}/events (ACTIVATE)"
        actor: PlatformAdmin
        preconditions:
          - "Customer.status == ACTIVE (ERR_INVALID_STATE)"
          - "StarterKit for this subscription is ISSUED (ERR_INVALID_STATE)"
          - "start_date <= current logical date (ERR_CUTOFF_PASSED)"
        side_effects: []
      - from: ACTIVE
        to: PAUSED
        trigger: "system (logical clock reaches start_date of a SCHEDULED ServicePause)"
        actor: system
        preconditions: []
        side_effects:
          - "Pause transitions SCHEDULED -> ACTIVE"
          - "RouteStops of this subscription in PLANNED whose route.route_date falls in [start_date, end_date) -> SKIPPED"
          - "Each skip recomputes parent Route manifest counters and increments Route.version"
      - from: PAUSED
        to: ACTIVE
        trigger: "system (logical clock reaches end_date of the ACTIVE ServicePause and no other ACTIVE pause exists)"
        actor: system
        preconditions: []
        side_effects:
          - "Pause transitions ACTIVE -> COMPLETED and final_credit_cents is computed (FINAL proration variant)"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system (Customer SUSPEND cascade)"
        actor: system
        preconditions: []
        side_effects:
          - "RouteStops of this subscription in PLANNED -> SKIPPED; parent Route manifests recomputed"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "system (Customer REINSTATE cascade)"
        actor: system
        preconditions: []
        side_effects: []
      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /api/subscriptions/{subscription_id}/events (TERMINATE)"
        actor: "PlatformAdmin, Customer"
        preconditions:
          - "StarterKit status == SETTLED (ERR_KIT_NOT_RETURNED)"
          - "No Invoice with status ISSUED or PAST_DUE (ERR_INVOICE_UNPAID)"
          - "No RouteStop of this subscription in PLANNED (ERR_INVALID_STATE)"
        side_effects:
          - "deposit_refund_settlement runs: refund = customer.deposit_held_cents; deposit_held_cents := 0; deposit_refunded_cents += refund"
      - from: PAUSED
        to: TERMINATED
        trigger: "POST /api/subscriptions/{subscription_id}/events (TERMINATE)"
        actor: "PlatformAdmin, Customer"
        preconditions:
          - "StarterKit status == SETTLED (ERR_KIT_NOT_RETURNED)"
          - "No Invoice with status ISSUED or PAST_DUE (ERR_INVOICE_UNPAID)"
          - "No RouteStop of this subscription in PLANNED (ERR_INVALID_STATE)"
        side_effects:
          - "Any ACTIVE ServicePause for this subscription -> COMPLETED"
          - "deposit_refund_settlement runs as on ACTIVE -> TERMINATED"
      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /api/subscriptions/{subscription_id}/events (TERMINATE)"
        actor: "PlatformAdmin, Customer"
        preconditions:
          - "StarterKit status == SETTLED (ERR_KIT_NOT_RETURNED)"
          - "No Invoice with status ISSUED or PAST_DUE (ERR_INVOICE_UNPAID)"
        side_effects:
          - "deposit_refund_settlement runs as on ACTIVE -> TERMINATED"

  - entity: Subscription
    field: billing_status
    initial_state: CURRENT
    terminal_states: []
    transitions:
      - from: CURRENT
        to: PAST_DUE
        trigger: "system (Invoice MARK_PAST_DUE event on an ISSUED invoice of this subscription)"
        actor: system
        preconditions: []
        side_effects: []
      - from: PAST_DUE
        to: CURRENT
        trigger: "system (PAY event on the PAST_DUE invoice)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: ServicePause
    field: status
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: ACTIVE
        trigger: "system (logical clock date >= start_date and < end_date)"
        actor: system
        preconditions: []
        side_effects:
          - "Subscription ACTIVE -> PAUSED; in-window PLANNED stops -> SKIPPED; Route manifests recomputed"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /api/service-pauses/{pause_id}/cancel"
        actor: "Customer, PlatformAdmin"
        preconditions: []
        side_effects:
          - "increments Subscription.version by 1 (OCC pair to pause creation)"
      - from: ACTIVE
        to: COMPLETED
        trigger: "system (logical clock date >= end_date)"
        actor: system
        preconditions: []
        side_effects:
          - "final_credit_cents computed via invoice_pause_proration FINAL variant"
          - "Subscription PAUSED -> ACTIVE when no other ACTIVE pause exists"

  - entity: StarterKit
    field: status
    initial_state: RESERVED
    terminal_states: [SETTLED]
    transitions:
      - from: RESERVED
        to: ISSUED
        trigger: "POST /api/starter-kits/{kit_id}/events (ISSUE)"
        actor: "PlatformAdmin, PlantOperator"
        preconditions: []
        side_effects:
          - "InventoryPool of size_code: reserved_units -= item_count; checked_out_units += item_count"
      - from: ISSUED
        to: RETURNED
        trigger: "POST /api/starter-kits/{kit_id}/events (RETURN, items_returned_count)"
        actor: "PlatformAdmin, PlantOperator"
        preconditions:
          - "items_returned_count <= item_count (ERR_RETURN_COUNT_MISMATCH)"
        side_effects:
          - "InventoryPool: checked_out_units -= items_returned_count; in_wash_units += items_returned_count"
          - "shortage = item_count - items_returned_count; when shortage > 0: auto-create LostItemCase(case_type=LOST, item_count=shortage, first_issued_date=kit created date) in OPEN and move shortage units checked_out_units -> lost_units"
      - from: RETURNED
        to: SETTLED
        trigger: "POST /api/starter-kits/{kit_id}/events (SETTLE)"
        actor: "PlatformAdmin, PlantOperator"
        preconditions:
          - "Every LostItemCase of the subscription is SETTLED or WAIVED (ERR_INVALID_STATE)"
        side_effects: []

  - entity: InventorySwap
    field: status
    initial_state: REQUESTED
    terminal_states: [COMPLETED, DENIED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /api/inventory-swaps/{swap_id}/approve"
        actor: PlatformAdmin
        preconditions:
          - "OCC: expected_inventory_pool_version == current version of the to_size_code pool (ERR_STALE_VERSION)"
          - "Subscription.service_status == ACTIVE (ERR_SUBSCRIPTION_NOT_ACTIVE)"
          - "to-pool available_units >= quantity (ERR_INVENTORY_SHORTFALL)"
        side_effects:
          - "to-pool on_hand_units -= quantity; reserved_units += quantity; increments InventoryPool.version by 1"
      - from: REQUESTED
        to: DENIED
        trigger: "POST /api/inventory-swaps/{swap_id}/events (DENY)"
        actor: PlatformAdmin
        preconditions: []
        side_effects: []
      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /api/inventory-swaps/{swap_id}/events (CANCEL)"
        actor: "PlatformAdmin, Customer, PlantOperator"
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: STAGED
        trigger: "POST /api/inventory-swaps/{swap_id}/events (STAGE)"
        actor: PlantOperator
        preconditions: []
        side_effects:
          - "to-pool reserved_units -= quantity; in_transit_units += quantity"
      - from: APPROVED
        to: CANCELLED
        trigger: "POST /api/inventory-swaps/{swap_id}/events (CANCEL)"
        actor: "PlatformAdmin, Customer, PlantOperator"
        preconditions: []
        side_effects:
          - "to-pool reserved_units -= quantity; on_hand_units += quantity (compensation of approve)"
      - from: APPROVED
        to: DENIED
        trigger: "system (WashBatch QUARANTINE cascade: to-pool available_units < 0 after quarantine; APPROVED swaps for that size denied newest-first by created_at DESC until available_units >= 0)"
        actor: system
        preconditions: []
        side_effects:
          - "to-pool reserved_units -= quantity; on_hand_units += quantity (compensation of approve)"
      - from: STAGED
        to: COMPLETED
        trigger: "POST /api/inventory-swaps/{swap_id}/events (COMPLETE, returned_old_count)"
        actor: PlantOperator
        preconditions:
          - "returned_old_count <= StarterKit.item_count (ERR_RETURN_COUNT_MISMATCH)"
        side_effects:
          - "to-pool in_transit_units -= quantity; checked_out_units += quantity"
          - "from-pool checked_out_units -= returned_old_count; in_wash_units += returned_old_count"
          - "shortage_count = max(0, StarterKit.item_count - returned_old_count); when > 0: auto-create LostItemCase(LOST, shortage, first_issued_date=kit created date) OPEN and move shortage from-pool checked_out_units -> lost_units"
          - "Subscription.current_size_code := to_size_code; StarterKit.size_code := to_size_code; StarterKit.item_count := quantity"

  - entity: Route
    field: status
    initial_state: PLANNED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: PLANNED
        to: SEQUENCED
        trigger: "POST /api/routes/{route_id}/sequence"
        actor: PlatformAdmin
        preconditions:
          - "current logical time < route_date 00:00Z minus service_zone.stop_cutoff_hours (ERR_CUTOFF_PASSED)"
        side_effects:
          - "route_stop_sequencing assigns stop_seq to every PLANNED stop: order by window_start_minutes ASC, tie-break subscription.created_at ASC"
      - from: SEQUENCED
        to: SEQUENCED
        trigger: "POST /api/routes/{route_id}/sequence"
        actor: PlatformAdmin
        preconditions:
          - "current logical time < route_date 00:00Z minus service_zone.stop_cutoff_hours (ERR_CUTOFF_PASSED)"
        side_effects:
          - "stop_seq recomputed with the same ordering rule"
      - from: SEQUENCED
        to: LOCKED
        trigger: "POST /api/routes/{route_id}/events (LOCK)"
        actor: PlatformAdmin
        preconditions:
          - "current logical time < route_date 00:00Z minus service_zone.stop_cutoff_hours (ERR_CUTOFF_PASSED)"
        side_effects: []
      - from: LOCKED
        to: IN_PROGRESS
        trigger: "POST /api/routes/{route_id}/events (START)"
        actor: PlatformAdmin
        preconditions:
          - "current logical date == route_date (ERR_CUTOFF_PASSED)"
        side_effects: []
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /api/routes/{route_id}/events (COMPLETE)"
        actor: PlatformAdmin
        preconditions:
          - "Every RouteStop of this route is in {COMPLETED, MISSED, SKIPPED, FORFEITED, RESCHEDULED} (ERR_INVALID_STATE)"
        side_effects: []
      - from: PLANNED
        to: CANCELLED
        trigger: "POST /api/routes/{route_id}/events (CANCEL)"
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "All PLANNED stops -> SKIPPED; manifest counters recomputed"
      - from: SEQUENCED
        to: CANCELLED
        trigger: "POST /api/routes/{route_id}/events (CANCEL)"
        actor: PlatformAdmin
        preconditions: []
        side_effects:
          - "All PLANNED stops -> SKIPPED; manifest counters recomputed"

  - entity: RouteStop
    field: status
    initial_state: PLANNED
    terminal_states: [COMPLETED, SKIPPED, FORFEITED, RESCHEDULED]
    transitions:
      - from: PLANNED
        to: COMPLETED
        trigger: "POST /api/route-stops/{stop_id}/complete"
        actor: "RouteDriver, PlatformAdmin"
        preconditions:
          - "Route.status == IN_PROGRESS (ERR_INVALID_STATE)"
          - "Subscription.service_status == ACTIVE (ERR_SUBSCRIPTION_NOT_ACTIVE)"
          - "OCC: expected_route_version == current Route.version (ERR_STALE_VERSION)"
          - "route.total_clean_items_delivered + clean_items_delivered <= ROUTE_CAPACITY_ITEMS (4000) (ERR_ROUTE_CAPACITY_EXCEEDED)"
        side_effects:
          - "stop records clean_items_delivered and soiled_bags_collected"
          - "Route.completed_stop_count += 1; planned_stop_count -= 1; totals updated; increments Route.version by 1"
      - from: PLANNED
        to: MISSED
        trigger: "POST /api/route-stops/{stop_id}/events (MISS)"
        actor: "RouteDriver, PlatformAdmin"
        preconditions:
          - "Route.status == IN_PROGRESS (ERR_INVALID_STATE)"
        side_effects:
          - "Subscription.missed_stop_count += 1"
          - "Route.planned_stop_count -= 1; increments Route.version by 1"
      - from: PLANNED
        to: SKIPPED
        trigger: "POST /api/route-stops/{stop_id}/events (SKIP) or system cascade (pause activation, customer suspend, route cancel)"
        actor: "RouteDriver, PlatformAdmin, system"
        preconditions: []
        side_effects:
          - "Route.planned_stop_count -= 1; increments Route.version by 1"
      - from: MISSED
        to: RESCHEDULED
        trigger: "POST /api/route-stops/{stop_id}/events (RESCHEDULE, makeup_route_id)"
        actor: "RouteDriver, PlatformAdmin"
        preconditions:
          - "makeup Route.status in {PLANNED, SEQUENCED} (ERR_ROUTE_LOCKED)"
          - "makeup route total plus stop window passes stop_window_overlap check against existing non-terminal stops (ERR_STOP_WINDOW_CONFLICT)"
        side_effects:
          - "Creates new RouteStop on makeup route with is_makeup=true, window copied from subscription; rescheduled_to_stop_id set"
      - from: MISSED
        to: FORFEITED
        trigger: "POST /api/route-stops/{stop_id}/events (FORFEIT)"
        actor: "RouteDriver, PlatformAdmin"
        preconditions: []
        side_effects: []

  - entity: SoiledIntake
    field: status
    initial_state: RECONCILED   # or DISPUTED, decided by soiled_weight_reconciliation at creation
    terminal_states: [RESOLVED]
    transitions:
      - from: RECONCILED
        to: DISPUTED
        trigger: "POST /api/soiled-intakes/{intake_id}/events (DISPUTE)"
        actor: "PlantOperator, PlatformAdmin"
        preconditions: []
        side_effects: []
      - from: DISPUTED
        to: RECONCILED
        trigger: "POST /api/soiled-intakes/{intake_id}/events (REWEIGH, scale_weight_g)"
        actor: "PlantOperator, PlatformAdmin"
        preconditions: []
        side_effects:
          - "scale_weight_g overwritten; expected_weight_g, variance_pct, verified_count recomputed; lands RECONCILED when variance_pct <= 10.00"
      - from: DISPUTED
        to: DISPUTED
        trigger: "POST /api/soiled-intakes/{intake_id}/events (REWEIGH, scale_weight_g)"
        actor: "PlantOperator, PlatformAdmin"
        preconditions: []
        side_effects:
          - "Recompute as above; stays DISPUTED when variance_pct > 10.00 (reweigh loop)"
      - from: DISPUTED
        to: RESOLVED
        trigger: "POST /api/soiled-intakes/{intake_id}/events (RESOLVE, resolution)"
        actor: "PlantOperator, PlatformAdmin"
        preconditions:
          - "resolution in {ACCEPT_COUNT, ACCEPT_WEIGHT}"
        side_effects:
          - "ACCEPT_COUNT: verified_count := stop.clean_items_delivered; ACCEPT_WEIGHT: verified_count := round_half_up(scale_weight_g / (tare_g x 2.5))"

  - entity: WashBatch
    field: status
    initial_state: RECEIVING
    terminal_states: [RELEASED, QUARANTINED]
    transitions:
      - from: RECEIVING
        to: LOADED
        trigger: "POST /api/wash-batches/{batch_id}/load"
        actor: "PlantOperator, PlatformAdmin"
        preconditions:
          - "soiled_intake_ids non-empty"
          - "Each intake status in {RECONCILED, RESOLVED} (DISPUTED -> ERR_WEIGHT_VARIANCE_EXCEEDED)"
          - "Each intake not already loaded (wash_batch_id null -> else ERR_INVALID_STATE)"
        side_effects:
          - "For each intake: wash_batch_id set; total_load_g += scale_weight_g"
          - "For each intake's subscription size pool: checked_out_units -= verified_count; in_wash_units += verified_count"
      - from: LOADED
        to: WASHING
        trigger: "POST /api/wash-batches/{batch_id}/events (START_WASH)"
        actor: "PlantOperator, PlatformAdmin"
        preconditions: []
        side_effects:
          - "wash_chemistry_dosing computes dosed_detergent_ml and dosed_sanitizer_ml"
          - "wash_started_by := X-User-ID"
      - from: WASHING
        to: VALIDATING
        trigger: "POST /api/wash-batches/{batch_id}/events (RECORD_SANITIZATION, peak_temp_celsius, dwell_seconds, chlorine_ppm)"
        actor: "PlantOperator, PlatformAdmin"
        preconditions: []
        side_effects:
          - "sanitization_validation computes validation_passed; validated_by := X-User-ID"
      - from: VALIDATING
        to: WASHING
        trigger: "POST /api/wash-batches/{batch_id}/events (REWASH)"
        actor: "PlantOperator, PlatformAdmin"
        preconditions:
          - "validation_passed == false (ERR_INVALID_STATE when true)"
          - "rewash_count < formula.max_rewash_count (ERR_REWASH_LIMIT_EXCEEDED)"
        side_effects:
          - "rewash_count += 1; validation_passed := null; validated_by := null (cycle WASHING -> VALIDATING -> WASHING)"
      - from: VALIDATING
        to: RELEASED
        trigger: "POST /api/wash-batches/{batch_id}/events (RELEASE)"
        actor: "PlantOperator, PlatformAdmin"
        preconditions:
          - "validation_passed == true (ERR_SANITIZATION_NOT_VALIDATED)"
          - "validated_by != wash_started_by (ERR_SEGREGATION_OF_DUTIES)"
          - "Every loaded intake status in {RECONCILED, RESOLVED} (ERR_WEIGHT_VARIANCE_EXCEEDED)"
        side_effects:
          - "For each loaded intake's size pool: in_wash_units -= verified_count; on_hand_units += verified_count"
      - from: VALIDATING
        to: QUARANTINED
        trigger: "POST /api/wash-batches/{batch_id}/events (QUARANTINE)"
        actor: "PlantOperator, PlatformAdmin"
        preconditions: []
        side_effects:
          - "For each loaded intake's size pool: in_wash_units -= verified_count; quarantined_units += verified_count (cascade link 1)"
          - "Cascade link 2: recompute each touched pool's available_units; while available_units < 0, deny the newest APPROVED InventorySwap on that size (created_at DESC), releasing its reservation, until available_units >= 0 or no APPROVED swaps remain"

  - entity: LostItemCase
    field: status
    initial_state: OPEN
    terminal_states: [SETTLED, WAIVED]
    transitions:
      - from: OPEN
        to: CHARGED
        trigger: "POST /api/lost-item-cases/{case_id}/events (CHARGE)"
        actor: "BillingAdmin, PlatformAdmin"
        preconditions:
          - "Subscription.service_status != TERMINATED (ERR_INVALID_STATE)"
          - "customer.deposit_held_cents >= computed charge (ERR_DEPOSIT_INSUFFICIENT)"
        side_effects:
          - "charge_cents computed (lost_item_charge_schedule for LOST, damage_charge_with_surcharge for DAMAGED)"
          - "customer.deposit_held_cents -= charge_cents; deposit_applied_cents += charge_cents"
      - from: OPEN
        to: DISPUTED
        trigger: "POST /api/lost-item-cases/{case_id}/events (DISPUTE)"
        actor: "BillingAdmin, PlatformAdmin"
        preconditions: []
        side_effects: []
      - from: CHARGED
        to: DISPUTED
        trigger: "POST /api/lost-item-cases/{case_id}/events (DISPUTE)"
        actor: "BillingAdmin, PlatformAdmin"
        preconditions: []
        side_effects: []
      - from: CHARGED
        to: SETTLED
        trigger: "POST /api/lost-item-cases/{case_id}/events (SETTLE)"
        actor: "BillingAdmin, PlatformAdmin"
        preconditions: []
        side_effects: []
      - from: DISPUTED
        to: SETTLED
        trigger: "POST /api/lost-item-cases/{case_id}/events (SETTLE)"
        actor: "BillingAdmin, PlatformAdmin"
        preconditions:
          - "charge_cents already applied or charge first applied here when deposit suffices (ERR_DEPOSIT_INSUFFICIENT)"
        side_effects:
          - "When case was DISPUTED from OPEN (never charged): compute charge and apply to deposit as in CHARGE"
      - from: OPEN
        to: WAIVED
        trigger: "POST /api/lost-item-cases/{case_id}/events (WAIVE)"
        actor: BillingAdmin
        preconditions: []
        side_effects: []
      - from: DISPUTED
        to: WAIVED
        trigger: "POST /api/lost-item-cases/{case_id}/events (WAIVE)"
        actor: BillingAdmin
        preconditions: []
        side_effects:
          - "When the case had been CHARGED before DISPUTE: refund the applied charge (deposit_held_cents += charge_cents; deposit_applied_cents -= charge_cents) — compensation keeps deposit ledger conserved"

  - entity: Invoice
    field: status
    initial_state: DRAFT
    terminal_states: [PAID, VOID, WRITTEN_OFF]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /api/invoices/{invoice_id}/events (ISSUE)"
        actor: "BillingAdmin, PlatformAdmin"
        preconditions: []
        side_effects:
          - "issued_at := current logical timestamp"
      - from: ISSUED
        to: DRAFT
        trigger: "POST /api/invoices/{invoice_id}/events (REISSUE)"
        actor: "BillingAdmin, PlatformAdmin"
        preconditions: []
        side_effects:
          - "issued_at := null; line fields recomputed on next ISSUE"
      - from: ISSUED
        to: PAID
        trigger: "POST /api/invoices/{invoice_id}/events (PAY)"
        actor: "BillingAdmin, PlatformAdmin"
        preconditions: []
        side_effects:
          - "When subscription.billing_status == PAST_DUE: billing_status -> CURRENT"
      - from: ISSUED
        to: PAST_DUE
        trigger: "POST /api/invoices/{invoice_id}/events (MARK_PAST_DUE)"
        actor: "BillingAdmin, PlatformAdmin"
        preconditions:
          - "current logical time >= issued_at + 14 days (ERR_INVOICE_NOT_PAST_DUE)"
        side_effects:
          - "subscription.billing_status CURRENT -> PAST_DUE"
      - from: DRAFT
        to: VOID
        trigger: "POST /api/invoices/{invoice_id}/events (VOID)"
        actor: "BillingAdmin, PlatformAdmin"
        preconditions: []
        side_effects: []
      - from: ISSUED
        to: VOID
        trigger: "POST /api/invoices/{invoice_id}/events (VOID)"
        actor: "BillingAdmin, PlatformAdmin"
        preconditions: []
        side_effects: []
      - from: PAST_DUE
        to: PAID
        trigger: "POST /api/invoices/{invoice_id}/events (PAY)"
        actor: "BillingAdmin, PlatformAdmin"
        preconditions: []
        side_effects:
          - "subscription.billing_status PAST_DUE -> CURRENT"
      - from: PAST_DUE
        to: WRITTEN_OFF
        trigger: "POST /api/invoices/{invoice_id}/events (WRITE_OFF)"
        actor: BillingAdmin
        preconditions: []
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules (true races only, OCC on parent version)
# =============================================================================
concurrency_rules:
  - rule_id: pause-create-stale-subscription
    parent_entity: Subscription
    write_endpoint: "POST /api/service-pauses"
    occ_field: expected_subscription_version
    description: |
      Creating a ServicePause against a Subscription whose version has advanced
      since the client last observed it is rejected, because another writer may
      have just created or cancelled a pause (both legitimately mutate the
      subscription) and the current writer's view of the pause set is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: swap-approve-stale-pool
    parent_entity: InventoryPool
    write_endpoint: "POST /api/inventory-swaps/{swap_id}/approve"
    occ_field: expected_inventory_pool_version
    description: |
      Approving an InventorySwap against the to-size InventoryPool whose
      version has advanced since the client last observed it is rejected,
      because a prior approval or adjustment has legitimately changed the
      reserved/on-hand split and the current writer's availability view is
      stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: stop-complete-stale-route
    parent_entity: Route
    write_endpoint: "POST /api/route-stops/{stop_id}/complete"
    occ_field: expected_route_version
    description: |
      Completing a RouteStop against a Route whose version has advanced since
      the client last observed it is rejected, because another stop completion
      or skip has legitimately advanced the route manifest and the current
      writer's capacity/manifest view is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: soiled_weight_reconciliation
    trigger: "POST /api/soiled-intakes create and REWEIGH event"
    algorithm: threshold
    formula: |
      tare_g: NEWBORN 28, SMALL 34, MEDIUM 40, LARGE 46, XL 52
      soiled_per_item_g = tare_g * SOIL_FACTOR_MILLI / 1000   # e.g. MEDIUM: 100
      expected_weight_g = stop.clean_items_delivered * soiled_per_item_g
      variance_pct = round_half_up(abs(scale_weight_g - expected_weight_g) * 10000 / expected_weight_g) / 100
      status = RECONCILED when variance_pct <= VARIANCE_THRESHOLD_PCT else DISPUTED
      verified_count (COUNT_BASIS) = stop.clean_items_delivered
      verified_count (WEIGHT_BASIS) = round_half_up(scale_weight_g / soiled_per_item_g)
    input_set: "The completed RouteStop referenced by route_stop_id; size from its subscription.current_size_code; weight_policy from the subscription's plan"
    constants:
      SOIL_FACTOR_MILLI: 2500
      VARIANCE_THRESHOLD_PCT: 10.00
    precision: "variance_pct 2 decimal places, round_half_up; verified_count integer, round_half_up"
    variants:
      - name: COUNT_BASIS
        when: "subscription plan weight_policy == COUNT_BASIS"
        difference: "verified_count equals the curbside clean_items_delivered count; scale weight only gates RECONCILED vs DISPUTED"
      - name: WEIGHT_BASIS
        when: "subscription plan weight_policy == WEIGHT_BASIS"
        difference: "verified_count derived from scale weight; same intake data yields a different verified_count and therefore a different invoice overage"

  - name: invoice_pause_proration
    trigger: "ServicePause creation (PROVISIONAL) and pause completion / invoice generation (FINAL)"
    algorithm: forward_looking
    formula: |
      service_days_paused = count of zone service_weekdays dates d with pause.start_date <= d < pause.end_date
      whole_weeks_touched = number of distinct billing weeks (Mon-Sun) intersecting [start_date, end_date)
      PROVISIONAL estimated_credit_cents = whole_weeks_touched * plan.weekly_fee_cents
      FINAL: per paused service day, line_d = round_half_up(plan.weekly_fee_cents / zone.service_days_per_week)
             final_credit_cents = sum of line_d over the paused service days (round per line, then sum)
    input_set: "Pauses with status in {SCHEDULED, ACTIVE, COMPLETED} intersecting the invoice period; CANCELLED excluded"
    constants: {}
    precision: "integer cents, round_half_up per line"
    variants:
      - name: PROVISIONAL
        when: "at ServicePause creation; stored as estimated_credit_cents"
        difference: "forward-looking whole-week estimate; for a 2-service-day pause in a 3-day zone on a 3200-cent plan it yields 3200"
      - name: FINAL
        when: "at pause completion and invoice generation; stored as final_credit_cents and invoice.pause_credit_cents"
        difference: "chronological per-day rounded lines; the same pause yields 2134 (1067 + 1067), not 3200 and not the sum-then-round 2133"

  - name: invoice_total_composition
    trigger: "POST /api/invoices/generate and Invoice REISSUE"
    algorithm: tiered_pricing
    formula: |
      period must be exactly 7 days (period_end - period_start == 7)
      base_fee_cents = plan.weekly_fee_cents
      overage input set: SoiledIntake with status in {RECONCILED, RESOLVED} whose stop's route.route_date
        falls in [period_start, period_end) for this subscription
      per intake: overage_items = min(max(verified_count - plan.weekly_quota, 0), plan.overage_cap_items)
      overage_cents = sum(overage_items) * plan.overage_rate_cents
      pause_credit_cents = invoice_pause_proration FINAL sum over paused service days inside the period
      ROUNDING ORDER PINNED: every line is rounded to integer cents (round_half_up) FIRST; total_cents =
        base_fee_cents + overage_cents - pause_credit_cents is a sum of already-rounded lines.
        Sum-then-round is forbidden (e.g. a 3200-cent fee over a 3-day zone credits 1067+1067 = 2134,
        never round(6400/3) = 2133).
      total_cents floored at 0
    input_set: "Subscription, its plan, its zone, qualifying intakes in period, pauses intersecting period"
    constants: {}
    precision: "integer cents; per-line round_half_up then sum"

  - name: wash_chemistry_dosing
    trigger: "WashBatch START_WASH event"
    algorithm: constraint_propagation
    formula: |
      load_kg = total_load_g / 1000
      soil_mult: LIGHT 0.9, NORMAL 1.0, HEAVY 1.25
      hardness_mult: SOFT 0.95, MEDIUM 1.0, HARD 1.15
      raw_ml = formula.base_detergent_ml_per_kg * load_kg * soil_mult * hardness_mult
      dosed_detergent_ml = clamp(round_half_up(raw_ml to 1 ml), MIN_DOSE_ML, MAX_DOSE_ML)
      dosed_sanitizer_ml = round_half_up(formula.sanitizer_ml_per_kg * load_kg to 1 ml)  # never clamped
      # worked pins: 12000 g, HEAVY, HARD, base 45 -> 45*12*1.25*1.15 = 776.25 -> 776 ml; sanitizer 8*12 = 96 ml
      # clamp pin:    25000 g, HEAVY, HARD, base 45 -> 1617.19 -> 1617 -> clamped to 900 ml; sanitizer 200 ml
    input_set: "WashBatch.total_load_g, batch soil_level and water_hardness, pinned WashFormula (formula_version)"
    constants:
      MIN_DOSE_ML: 60
      MAX_DOSE_ML: 900
    precision: "1 ml, round_half_up before clamp"

  - name: damage_charge_with_surcharge
    trigger: "LostItemCase CHARGE event (or deposit-applying SETTLE) when case_type == DAMAGED"
    algorithm: threshold
    formula: |
      EVALUATION ORDER PINNED (circular-looking dependency resolved):
        1. utilization_ratio = customer.deposit_applied_cents / customer.deposit_charged_cents
           computed BEFORE this charge is applied (when deposit_charged_cents == 0, ratio := 0)
        2. surcharge_mult = 1.10 when utilization_ratio > SURCHARGE_THRESHOLD else 1.00
        3. charge_cents = round_half_up(assessed_fee_cents * item_count * surcharge_mult)
        4. only then apply charge to the deposit ledger
      The surcharge therefore never re-triggers itself within one charge.
      # pin: applied 12000 of charged 18000 -> ratio 0.667 > 0.50 -> fee 4000 x 1 item x 1.10 = 4400
      # pin: applied 720 of charged 18000  -> ratio 0.040        -> fee 1000 x 1 item = 1000
    input_set: "The LostItemCase, its customer deposit ledger"
    constants:
      SURCHARGE_THRESHOLD: 0.50
    precision: "integer cents, round_half_up"

  - name: lost_item_charge_schedule
    trigger: "LostItemCase CHARGE event (or deposit-applying SETTLE) when case_type == LOST"
    algorithm: threshold
    formula: |
      replacement_cost_cents by size: NEWBORN 250, SMALL 275, MEDIUM 300, LARGE 325, XL 350
      age_days = current logical date - first_issued_date (in days)
      pct: age_days <= 90 -> 1.00 ; 91 <= age_days <= 180 -> 0.60 ; age_days >= 181 -> 0.30
      charge_cents = round_half_up(item_count * replacement_cost_cents * pct)
      # boundary pins at clock 2026-08-01: first_issued 2026-05-03 -> age 90 -> full; 2026-05-02 -> age 91 -> 60%
    input_set: "The LostItemCase; size from its InventoryPool; logical clock"
    constants: {}
    precision: "integer cents, round_half_up"

  - name: route_stop_sequencing
    trigger: "POST /api/routes/{route_id}/sequence"
    algorithm: topological
    formula: |
      Eligible stops: RouteStop of this route with status PLANNED.
      Order by (window_start_minutes ASC, subscription.created_at ASC).
      Assign stop_seq 1..N in that order. created_at is the only tie-break; id never participates.
    input_set: "PLANNED stops of the route joined to their subscriptions"
    constants: {}
    precision: "integer sequence"

  - name: inventory_available_units
    trigger: "read of InventoryPool and every unit-moving side effect"
    algorithm: aggregation
    formula: |
      available_units = on_hand_units - reserved_units
      CONSERVATION INVARIANT (per pool, at all times):
        on_hand_units + reserved_units + in_transit_units + checked_out_units
        + in_wash_units + quarantined_units + lost_units + retired_units == total_acquired_units
    input_set: "InventoryPool bucket fields"
    constants: {}
    precision: "integer units"

  - name: deposit_refund_settlement
    trigger: "Subscription TERMINATE transition"
    algorithm: waterfall_allocation
    formula: |
      refund_cents = customer.deposit_held_cents
      customer.deposit_held_cents := 0
      customer.deposit_refunded_cents += refund_cents
      CONSERVATION INVARIANT (per customer, at all times):
        deposit_charged_cents == deposit_held_cents + deposit_applied_cents + deposit_refunded_cents
      Forward+compensation pin: a customer with no lost/damaged charges ends termination with
      deposit_refunded_cents == deposit_charged_cents and deposit_held_cents == 0.
    input_set: "Customer deposit ledger"
    constants: {}
    precision: "integer cents"

  - name: sanitization_validation
    trigger: "WashBatch RECORD_SANITIZATION event"
    algorithm: threshold
    formula: |
      validation_passed = (peak_temp_celsius >= formula.min_temp_celsius)
                          AND (dwell_seconds >= formula.min_dwell_seconds)
                          AND (formula.chlorine_ppm_min <= chlorine_ppm <= formula.chlorine_ppm_max)
      # boundary pins with formula 71C/180s/[50,200]: (71,180,50) passes; (71,179,100) fails; (70,180,100) fails; (71,180,201) fails
    input_set: "Event payload measured against the pinned WashFormula"
    constants: {}
    precision: "integer comparisons, >= inclusive at the exact boundary"

  - name: kit_item_count
    trigger: "StarterKit creation (subscription create) and InventorySwap approval quantity"
    algorithm: aggregation
    formula: |
      item_count = plan.weekly_quota + ceil(plan.weekly_quota * plan.kit_reserve_pct / 100)
      # pins: quota 80, 10% -> 88; quota 60, 10% -> 66
    input_set: "SubscriptionPlan of the subscription"
    constants: {}
    precision: "integer units, ceil on the reserve"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: format, check: "Body is valid and every required field is present with correct type; enum fields hold a declared member; window_start_minutes < window_end_minutes; scale_weight_g > 0; item_count >= 1", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all" }
  - { priority: 2, category: auth, check: "X-User-Role and X-User-ID headers present and well-formed", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 3, category: auth, check: "Role is listed for the endpoint; entity-backed Customer may only touch resources whose customer chain resolves to X-User-ID", error_id: ERR_FORBIDDEN, http_status: 403, applies_to: "all" }
  - { priority: 4, category: existence, check: "Every id in the path exists, validated left-to-right", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all" }
  - { priority: 5, category: existence, check: "Every FK id supplied in the body exists (customer_id, subscription_plan_id, service_zone_id, subscription_id, route_id, wash_formula_id, inventory_pool_id, route_stop_id, makeup_route_id, soiled_intake_ids)", error_id: ERR_REFERENCE_NOT_FOUND, http_status: 404, applies_to: "endpoints with body FKs" }
  - { priority: 6, category: state, check: "Target resource is not in a terminal state for any further event", error_id: ERR_ALREADY_TERMINAL, http_status: 409, applies_to: "all event/action endpoints" }
  - { priority: 7, category: state, check: "State machine precondition: transition exists from current state and its non-business preconditions hold (e.g. route IN_PROGRESS for stop complete, kit ISSUED for subscription ACTIVATE, validation_passed false for REWASH)", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all event/action endpoints" }
  - { priority: 8, category: state, check: "Subscription.service_status == ACTIVE where required (stop complete, intake create, swap request/approve)", error_id: ERR_SUBSCRIPTION_NOT_ACTIVE, http_status: 409, applies_to: "POST /api/route-stops/{id}/complete, POST /api/soiled-intakes, POST /api/inventory-swaps, POST /api/inventory-swaps/{id}/approve" }
  - { priority: 9, category: state, check: "Route is PLANNED or SEQUENCED for stop creation and resequencing targets", error_id: ERR_ROUTE_LOCKED, http_status: 409, applies_to: "POST /api/route-stops, RESCHEDULE makeup-route target" }
  - { priority: 10, category: business_safety, check: "RELEASE requires validation_passed == true", error_id: ERR_SANITIZATION_NOT_VALIDATED, http_status: 422, applies_to: "WashBatch RELEASE" }
  - { priority: 11, category: business_safety, check: "RELEASE requires validated_by != wash_started_by (segregation of duties)", error_id: ERR_SEGREGATION_OF_DUTIES, http_status: 422, applies_to: "WashBatch RELEASE" }
  - { priority: 12, category: business_safety, check: "REWASH requires rewash_count < pinned formula.max_rewash_count", error_id: ERR_REWASH_LIMIT_EXCEEDED, http_status: 409, applies_to: "WashBatch REWASH" }
  - { priority: 13, category: business_temporal, check: "ServicePause start_date >= current logical date + MIN_NOTICE_DAYS (3); exactly 3 days ahead is allowed", error_id: ERR_PAUSE_NOTICE_TOO_SHORT, http_status: 422, applies_to: "POST /api/service-pauses" }
  - { priority: 14, category: business_temporal, check: "ServicePause end_date > start_date and end_date - start_date <= MAX_PAUSE_DAYS (28)", error_id: ERR_PAUSE_WINDOW_INVALID, http_status: 422, applies_to: "POST /api/service-pauses" }
  - { priority: 15, category: business_temporal, check: "Route cutoff: sequence/LOCK before route_date 00:00Z - stop_cutoff_hours; START only when current date == route_date; subscription ACTIVATE only when start_date <= current date", error_id: ERR_CUTOFF_PASSED, http_status: 422, applies_to: "route sequence, route events, subscription ACTIVATE" }
  - { priority: 16, category: business_temporal, check: "MARK_PAST_DUE requires current logical time >= issued_at + 14 days", error_id: ERR_INVOICE_NOT_PAST_DUE, http_status: 422, applies_to: "Invoice MARK_PAST_DUE" }
  - { priority: 17, category: business_temporal, check: "Invoice period is exactly 7 days and does not overlap [period_start, period_end) of any non-VOID invoice of the same subscription", error_id: ERR_BILLING_CYCLE_CLOSED, http_status: 409, applies_to: "POST /api/invoices/generate" }
  - { priority: 18, category: business_constraint, check: "ServicePause half-open window [start_date, end_date) must not intersect any other SCHEDULED or ACTIVE pause of the subscription; adjacency (end == start) is allowed", error_id: ERR_PAUSE_OVERLAP, http_status: 409, applies_to: "POST /api/service-pauses" }
  - { priority: 19, category: business_constraint, check: "Stop window plus STOP_BUFFER_MIN (15) must not collide with any non-terminal stop on the route: require new.start >= existing.end + 15 OR new.end + 15 <= existing.start; exactly 15 minutes of gap is allowed", error_id: ERR_STOP_WINDOW_CONFLICT, http_status: 409, applies_to: "POST /api/route-stops, RESCHEDULE" }
  - { priority: 20, category: business_constraint, check: "Stop completion keeps route.total_clean_items_delivered <= ROUTE_CAPACITY_ITEMS (4000)", error_id: ERR_ROUTE_CAPACITY_EXCEEDED, http_status: 422, applies_to: "POST /api/route-stops/{id}/complete" }
  - { priority: 21, category: business_constraint, check: "InventorySwap to_size_code is exactly one step from current size in NEWBORN<SMALL<MEDIUM<LARGE<XL", error_id: ERR_SIZE_TRANSITION_INVALID, http_status: 422, applies_to: "POST /api/inventory-swaps" }
  - { priority: 22, category: business_constraint, check: "Customer has no other Subscription with service_status in {PENDING_START, ACTIVE, PAUSED, SUSPENDED}", error_id: ERR_DUPLICATE_ACTIVE_SUBSCRIPTION, http_status: 409, applies_to: "POST /api/subscriptions" }
  - { priority: 23, category: business_constraint, check: "ServiceZone.active == true at subscription creation; subscription.service_zone_id must equal customer.service_zone_id", error_id: ERR_ZONE_NOT_SERVICEABLE, http_status: 422, applies_to: "POST /api/subscriptions" }
  - { priority: 24, category: business_referential, check: "Returned counts do not exceed issued counts (kit RETURN items_returned_count <= item_count; swap COMPLETE returned_old_count <= kit.item_count)", error_id: ERR_RETURN_COUNT_MISMATCH, http_status: 422, applies_to: "kit RETURN, swap COMPLETE" }
  - { priority: 25, category: business_referential, check: "Wash load and RELEASE require every referenced intake in {RECONCILED, RESOLVED}", error_id: ERR_WEIGHT_VARIANCE_EXCEEDED, http_status: 422, applies_to: "WashBatch load, WashBatch RELEASE" }
  - { priority: 26, category: business_referential, check: "Subscription TERMINATE requires StarterKit SETTLED", error_id: ERR_KIT_NOT_RETURNED, http_status: 409, applies_to: "Subscription TERMINATE" }
  - { priority: 27, category: business_fiscal, check: "Pool availability: kit reservation at subscription creation, swap approval, and RETIRE adjustments require sufficient on_hand/available units", error_id: ERR_INVENTORY_SHORTFALL, http_status: 409, applies_to: "POST /api/subscriptions, POST /api/inventory-swaps/{id}/approve, POST /api/inventory-pools/{id}/adjustments" }
  - { priority: 28, category: business_fiscal, check: "Deposit sufficiency: customer.deposit_held_cents >= computed charge on CHARGE / deposit-applying SETTLE", error_id: ERR_DEPOSIT_INSUFFICIENT, http_status: 402, applies_to: "LostItemCase CHARGE, SETTLE" }
  - { priority: 29, category: business_fiscal, check: "Subscription TERMINATE requires no Invoice in ISSUED or PAST_DUE", error_id: ERR_INVOICE_UNPAID, http_status: 402, applies_to: "Subscription TERMINATE" }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- SubscriptionPlan ---
  - { method: POST, path: "/api/subscription-plans", description: "Create a subscription plan", roles: [PlatformAdmin], code: 201, input: [tier_code, weekly_quota, weekly_fee_cents, overage_rate_cents, "overage_cap_items?", deposit_cents, "service_bags_per_week?", weight_policy, "kit_reserve_pct?"], output: SubscriptionPlan, side_effects: [] }
  - { method: GET, path: "/api/subscription-plans", description: "List subscription plans", roles: [PlatformAdmin, Customer, RouteDriver, PlantOperator, BillingAdmin], code: 200, input: ["tier_code?", "limit?", "offset?"], output: "SubscriptionPlan[]", side_effects: [] }
  - { method: GET, path: "/api/subscription-plans/{plan_id}", description: "Get a subscription plan", roles: [PlatformAdmin, Customer, RouteDriver, PlantOperator, BillingAdmin], code: 200, input: [], output: SubscriptionPlan, side_effects: [] }

  # --- ServiceZone ---
  - { method: POST, path: "/api/service-zones", description: "Create a service zone", roles: [PlatformAdmin], code: 201, input: [zone_code, service_weekdays, "stop_cutoff_hours?", "active?"], output: ServiceZone, side_effects: ["service_days_per_week computed from service_weekdays"] }
  - { method: GET, path: "/api/service-zones", description: "List service zones", roles: [PlatformAdmin, Customer, RouteDriver, PlantOperator, BillingAdmin], code: 200, input: ["zone_code?", "active?", "limit?", "offset?"], output: "ServiceZone[]", side_effects: [] }
  - { method: GET, path: "/api/service-zones/{zone_id}", description: "Get a service zone", roles: [PlatformAdmin, Customer, RouteDriver, PlantOperator, BillingAdmin], code: 200, input: [], output: ServiceZone, side_effects: [] }

  # --- Customer ---
  - { method: POST, path: "/api/customers", description: "Create a customer in ONBOARDING", roles: [PlatformAdmin], code: 201, input: [full_name, email, service_zone_id, child_birthdate, child_size_code], output: Customer, side_effects: ["status ONBOARDING; deposit ledger zeros"] }
  - { method: GET, path: "/api/customers", description: "List customers", roles: [PlatformAdmin, Customer, RouteDriver, PlantOperator, BillingAdmin], code: 200, input: ["service_zone_id?", "status?", "limit?", "offset?"], output: "Customer[]", side_effects: [] }
  - { method: GET, path: "/api/customers/{customer_id}", description: "Get a customer", roles: [PlatformAdmin, Customer, RouteDriver, PlantOperator, BillingAdmin], code: 200, input: [], output: Customer, side_effects: [] }
  - { method: POST, path: "/api/customers/{customer_id}/events", description: "Customer lifecycle event ACTIVATE | SUSPEND | REINSTATE | CLOSE", roles: [PlatformAdmin], code: 200, input: [event_type], output: Customer, side_effects: ["SUSPEND cascades subscription -> SUSPENDED -> stops SKIPPED -> route manifests recomputed; REINSTATE reverses subscription suspension"] }

  # --- Subscription ---
  - { method: POST, path: "/api/subscriptions", description: "Create a subscription (PENDING_START) with starter kit reservation and deposit auto-charge", roles: [PlatformAdmin], code: 201, input: [customer_id, subscription_plan_id, service_zone_id, start_date, current_size_code, window_start_minutes, window_end_minutes], output: Subscription, side_effects: ["creates StarterKit RESERVED with kit_item_count units moved on_hand -> reserved on the size pool (ERR_INVENTORY_SHORTFALL when insufficient)", "customer.deposit_charged_cents += plan.deposit_cents; deposit_held_cents += plan.deposit_cents"] }
  - { method: GET, path: "/api/subscriptions", description: "List subscriptions", roles: [PlatformAdmin, Customer, RouteDriver, PlantOperator, BillingAdmin], code: 200, input: ["customer_id?", "subscription_plan_id?", "service_zone_id?", "service_status?", "limit?", "offset?"], output: "Subscription[]", side_effects: [] }
  - { method: GET, path: "/api/subscriptions/{subscription_id}", description: "Get a subscription", roles: [PlatformAdmin, Customer, RouteDriver, PlantOperator, BillingAdmin], code: 200, input: [], output: Subscription, side_effects: [] }
  - { method: POST, path: "/api/subscriptions/{subscription_id}/events", description: "Subscription lifecycle event ACTIVATE | SUSPEND_SERVICE* | RESUME_SERVICE* | TERMINATE (* PlatformAdmin-only; Customer may TERMINATE own)", roles: [PlatformAdmin, Customer], code: 200, input: [event_type], output: Subscription, side_effects: ["TERMINATE runs deposit_refund_settlement"] }

  # --- ServicePause ---
  - { method: POST, path: "/api/service-pauses", description: "Schedule a travel pause (OCC on subscription); computes PROVISIONAL estimated_credit_cents", roles: [Customer, PlatformAdmin], code: 201, input: [subscription_id, start_date, end_date, expected_subscription_version], output: ServicePause, side_effects: ["increments Subscription.version by 1"] }
  - { method: GET, path: "/api/service-pauses", description: "List service pauses", roles: [PlatformAdmin, Customer, RouteDriver, PlantOperator, BillingAdmin], code: 200, input: ["subscription_id?", "status?", "limit?", "offset?"], output: "ServicePause[]", side_effects: [] }
  - { method: GET, path: "/api/service-pauses/{pause_id}", description: "Get a service pause", roles: [PlatformAdmin, Customer, RouteDriver, PlantOperator, BillingAdmin], code: 200, input: [], output: ServicePause, side_effects: [] }
  - { method: POST, path: "/api/service-pauses/{pause_id}/cancel", description: "Cancel a SCHEDULED pause", roles: [Customer, PlatformAdmin], code: 200, input: [], output: ServicePause, side_effects: ["increments Subscription.version by 1"] }

  # --- StarterKit ---
  - { method: GET, path: "/api/starter-kits", description: "List starter kits", roles: [PlatformAdmin, Customer, RouteDriver, PlantOperator, BillingAdmin], code: 200, input: ["subscription_id?", "status?", "limit?", "offset?"], output: "StarterKit[]", side_effects: [] }
  - { method: GET, path: "/api/starter-kits/{kit_id}", description: "Get a starter kit", roles: [PlatformAdmin, Customer, RouteDriver, PlantOperator, BillingAdmin], code: 200, input: [], output: StarterKit, side_effects: [] }
  - { method: POST, path: "/api/starter-kits/{kit_id}/events", description: "Kit event ISSUE | RETURN(items_returned_count) | SETTLE", roles: [PlatformAdmin, PlantOperator], code: 200, input: [event_type, "items_returned_count?"], output: StarterKit, side_effects: ["ISSUE: reserved -> checked_out", "RETURN: checked_out -> in_wash for returned units; shortage -> lost_units plus auto LostItemCase OPEN"] }

  # --- Route ---
  - { method: POST, path: "/api/routes", description: "Create a route for a zone and date; auto-creates PLANNED stops for eligible subscriptions", roles: [PlatformAdmin], code: 201, input: [service_zone_id, route_date], output: Route, side_effects: ["eligible = service_status ACTIVE, zone match, route_date weekday in zone.service_weekdays, no ACTIVE/SCHEDULED pause covering route_date, no existing stop for subscription+date; stop windows copied from subscriptions"] }
  - { method: GET, path: "/api/routes", description: "List routes", roles: [PlatformAdmin, Customer, RouteDriver, PlantOperator, BillingAdmin], code: 200, input: ["service_zone_id?", "route_date?", "status?", "limit?", "offset?"], output: "Route[]", side_effects: [] }
  - { method: GET, path: "/api/routes/{route_id}", description: "Get a route", roles: [PlatformAdmin, Customer, RouteDriver, PlantOperator, BillingAdmin], code: 200, input: [], output: Route, side_effects: [] }
  - { method: POST, path: "/api/routes/{route_id}/sequence", description: "Compute stop_seq via route_stop_sequencing (PLANNED or SEQUENCED only, before cutoff)", roles: [PlatformAdmin], code: 200, input: [], output: Route, side_effects: ["assigns stop_seq 1..N"] }
  - { method: POST, path: "/api/routes/{route_id}/events", description: "Route event LOCK | START | COMPLETE | CANCEL", roles: [PlatformAdmin], code: 200, input: [event_type], output: Route, side_effects: ["CANCEL: PLANNED stops -> SKIPPED; COMPLETE requires all stops terminal"] }

  # --- RouteStop ---
  - { method: POST, path: "/api/route-stops", description: "Manually add a makeup stop to a PLANNED or SEQUENCED route", roles: [PlatformAdmin], code: 201, input: [route_id, subscription_id, window_start_minutes, window_end_minutes], output: RouteStop, side_effects: ["is_makeup=true; stop_seq assigned at next sequence"] }
  - { method: GET, path: "/api/route-stops", description: "List route stops", roles: [PlatformAdmin, Customer, RouteDriver, PlantOperator, BillingAdmin], code: 200, input: ["route_id?", "subscription_id?", "status?", "limit?", "offset?"], output: "RouteStop[]", side_effects: [] }
  - { method: GET, path: "/api/route-stops/{stop_id}", description: "Get a route stop", roles: [PlatformAdmin, Customer, RouteDriver, PlantOperator, BillingAdmin], code: 200, input: [], output: RouteStop, side_effects: [] }
  - { method: POST, path: "/api/route-stops/{stop_id}/complete", description: "Record bag exchange at the curb (OCC on route)", roles: [RouteDriver, PlatformAdmin], code: 200, input: [soiled_bags_collected, clean_items_delivered, expected_route_version], output: RouteStop, side_effects: ["stop COMPLETED; route manifest counters updated; increments Route.version by 1"] }
  - { method: POST, path: "/api/route-stops/{stop_id}/events", description: "Stop event MISS(miss_reason) | SKIP | RESCHEDULE(makeup_route_id) | FORFEIT", roles: [RouteDriver, PlatformAdmin], code: 200, input: [event_type, "miss_reason?", "makeup_route_id?"], output: RouteStop, side_effects: ["MISS: subscription.missed_stop_count += 1", "RESCHEDULE: creates makeup PLANNED stop"] }

  # --- SoiledIntake ---
  - { method: POST, path: "/api/soiled-intakes", description: "Record plant-side scale weight for a completed stop; auto RECONCILED or DISPUTED", roles: [PlantOperator, PlatformAdmin], code: 201, input: [route_stop_id, scale_weight_g, soil_level], output: SoiledIntake, side_effects: ["soiled_weight_reconciliation computes expected_weight_g, variance_pct, verified_count, status"] }
  - { method: GET, path: "/api/soiled-intakes", description: "List soiled intakes", roles: [PlatformAdmin, Customer, RouteDriver, PlantOperator, BillingAdmin], code: 200, input: ["route_stop_id?", "wash_batch_id?", "status?", "limit?", "offset?"], output: "SoiledIntake[]", side_effects: [] }
  - { method: GET, path: "/api/soiled-intakes/{intake_id}", description: "Get a soiled intake", roles: [PlatformAdmin, Customer, RouteDriver, PlantOperator, BillingAdmin], code: 200, input: [], output: SoiledIntake, side_effects: [] }
  - { method: POST, path: "/api/soiled-intakes/{intake_id}/events", description: "Intake event DISPUTE | REWEIGH(scale_weight_g) | RESOLVE(resolution)", roles: [PlantOperator, PlatformAdmin], code: 200, input: [event_type, "scale_weight_g?", "resolution?"], output: SoiledIntake, side_effects: ["REWEIGH recomputes reconciliation; RESOLVE pins verified_count per resolution"] }

  # --- WashFormula ---
  - { method: POST, path: "/api/wash-formulas", description: "Create a wash formula", roles: [PlatformAdmin], code: 201, input: [formula_code, base_detergent_ml_per_kg, sanitizer_ml_per_kg, min_temp_celsius, min_dwell_seconds, chlorine_ppm_min, chlorine_ppm_max, "max_rewash_count?"], output: WashFormula, side_effects: [] }
  - { method: GET, path: "/api/wash-formulas", description: "List wash formulas", roles: [PlatformAdmin, Customer, RouteDriver, PlantOperator, BillingAdmin], code: 200, input: ["formula_code?", "limit?", "offset?"], output: "WashFormula[]", side_effects: [] }
  - { method: GET, path: "/api/wash-formulas/{formula_id}", description: "Get a wash formula", roles: [PlatformAdmin, Customer, RouteDriver, PlantOperator, BillingAdmin], code: 200, input: [], output: WashFormula, side_effects: [] }

  # --- WashBatch ---
  - { method: POST, path: "/api/wash-batches", description: "Create a wash batch pinning the current formula version", roles: [PlantOperator, PlatformAdmin], code: 201, input: [wash_formula_id, soil_level, water_hardness], output: WashBatch, side_effects: ["formula_version := WashFormula.version at creation"] }
  - { method: GET, path: "/api/wash-batches", description: "List wash batches", roles: [PlatformAdmin, Customer, RouteDriver, PlantOperator, BillingAdmin], code: 200, input: ["wash_formula_id?", "status?", "limit?", "offset?"], output: "WashBatch[]", side_effects: [] }
  - { method: GET, path: "/api/wash-batches/{batch_id}", description: "Get a wash batch", roles: [PlatformAdmin, Customer, RouteDriver, PlantOperator, BillingAdmin], code: 200, input: [], output: WashBatch, side_effects: [] }
  - { method: POST, path: "/api/wash-batches/{batch_id}/load", description: "Load soiled intakes into a RECEIVING batch", roles: [PlantOperator, PlatformAdmin], code: 200, input: [soiled_intake_ids], output: WashBatch, side_effects: ["total_load_g accumulates; pool units checked_out -> in_wash per intake verified_count"] }
  - { method: POST, path: "/api/wash-batches/{batch_id}/events", description: "Batch event START_WASH | RECORD_SANITIZATION(peak_temp_celsius, dwell_seconds, chlorine_ppm) | RELEASE | REWASH | QUARANTINE", roles: [PlantOperator, PlatformAdmin], code: 200, input: [event_type, "peak_temp_celsius?", "dwell_seconds?", "chlorine_ppm?"], output: WashBatch, side_effects: ["START_WASH computes dosing", "RELEASE: in_wash -> on_hand", "QUARANTINE: in_wash -> quarantined plus APPROVED-swap denial cascade"] }

  # --- InventoryPool ---
  - { method: POST, path: "/api/inventory-pools", description: "Create the inventory pool for a size", roles: [PlatformAdmin], code: 201, input: [size_code], output: InventoryPool, side_effects: ["all buckets 0"] }
  - { method: GET, path: "/api/inventory-pools", description: "List inventory pools", roles: [PlatformAdmin, Customer, RouteDriver, PlantOperator, BillingAdmin], code: 200, input: ["size_code?", "limit?", "offset?"], output: "InventoryPool[]", side_effects: [] }
  - { method: GET, path: "/api/inventory-pools/{pool_id}", description: "Get an inventory pool", roles: [PlatformAdmin, Customer, RouteDriver, PlantOperator, BillingAdmin], code: 200, input: [], output: InventoryPool, side_effects: [] }
  - { method: POST, path: "/api/inventory-pools/{pool_id}/adjustments", description: "ACQUIRE (on_hand += units, total_acquired += units) | RETIRE (on_hand -= units, retired += units)", roles: [PlatformAdmin, PlantOperator], code: 200, input: [adjustment_type, units], output: InventoryPool, side_effects: ["increments InventoryPool.version by 1; RETIRE requires on_hand_units >= units (ERR_INVENTORY_SHORTFALL)"] }

  # --- InventorySwap ---
  - { method: POST, path: "/api/inventory-swaps", description: "Request a sizing change / inventory swap (one size step)", roles: [Customer, PlatformAdmin], code: 201, input: [subscription_id, to_size_code], output: InventorySwap, side_effects: ["quantity computed via kit_item_count for to_size_code"] }
  - { method: GET, path: "/api/inventory-swaps", description: "List inventory swaps", roles: [PlatformAdmin, Customer, RouteDriver, PlantOperator, BillingAdmin], code: 200, input: ["subscription_id?", "status?", "limit?", "offset?"], output: "InventorySwap[]", side_effects: [] }
  - { method: GET, path: "/api/inventory-swaps/{swap_id}", description: "Get an inventory swap", roles: [PlatformAdmin, Customer, RouteDriver, PlantOperator, BillingAdmin], code: 200, input: [], output: InventorySwap, side_effects: [] }
  - { method: POST, path: "/api/inventory-swaps/{swap_id}/approve", description: "Approve a swap, reserving to-pool units (OCC on to-pool)", roles: [PlatformAdmin], code: 200, input: [expected_inventory_pool_version], output: InventorySwap, side_effects: ["to-pool on_hand -> reserved; increments InventoryPool.version by 1"] }
  - { method: POST, path: "/api/inventory-swaps/{swap_id}/events", description: "Swap event STAGE | COMPLETE(returned_old_count) | DENY | CANCEL", roles: [PlatformAdmin, PlantOperator], code: 200, input: [event_type, "returned_old_count?"], output: InventorySwap, side_effects: ["COMPLETE moves pool buckets, updates subscription size and kit, auto-creates shortage LostItemCase"] }

  # --- LostItemCase ---
  - { method: POST, path: "/api/lost-item-cases", description: "Open a lost/damaged item case", roles: [BillingAdmin, PlantOperator, PlatformAdmin], code: 201, input: [subscription_id, inventory_pool_id, case_type, item_count, first_issued_date, "assessed_fee_cents?"], output: LostItemCase, side_effects: [] }
  - { method: GET, path: "/api/lost-item-cases", description: "List lost/damaged cases", roles: [PlatformAdmin, Customer, RouteDriver, PlantOperator, BillingAdmin], code: 200, input: ["subscription_id?", "inventory_pool_id?", "status?", "limit?", "offset?"], output: "LostItemCase[]", side_effects: [] }
  - { method: GET, path: "/api/lost-item-cases/{case_id}", description: "Get a case", roles: [PlatformAdmin, Customer, RouteDriver, PlantOperator, BillingAdmin], code: 200, input: [], output: LostItemCase, side_effects: [] }
  - { method: POST, path: "/api/lost-item-cases/{case_id}/events", description: "Case event CHARGE | DISPUTE | SETTLE | WAIVE (WAIVE BillingAdmin-only)", roles: [BillingAdmin, PlatformAdmin], code: 200, input: [event_type], output: LostItemCase, side_effects: ["CHARGE computes charge and debits deposit ledger", "WAIVE of a previously charged case refunds the applied charge"] }

  # --- Invoice ---
  - { method: POST, path: "/api/invoices/generate", description: "Generate a DRAFT weekly invoice via invoice_total_composition", roles: [BillingAdmin, PlatformAdmin], code: 201, input: [subscription_id, period_start, period_end], output: Invoice, side_effects: ["computes base_fee_cents, overage_cents, pause_credit_cents, total_cents"] }
  - { method: GET, path: "/api/invoices", description: "List invoices", roles: [PlatformAdmin, Customer, RouteDriver, PlantOperator, BillingAdmin], code: 200, input: ["subscription_id?", "status?", "limit?", "offset?"], output: "Invoice[]", side_effects: [] }
  - { method: GET, path: "/api/invoices/{invoice_id}", description: "Get an invoice", roles: [PlatformAdmin, Customer, RouteDriver, PlantOperator, BillingAdmin], code: 200, input: [], output: Invoice, side_effects: [] }
  - { method: POST, path: "/api/invoices/{invoice_id}/events", description: "Invoice event ISSUE | PAY | MARK_PAST_DUE | VOID | REISSUE | WRITE_OFF (WRITE_OFF BillingAdmin-only)", roles: [BillingAdmin, PlatformAdmin], code: 200, input: [event_type], output: Invoice, side_effects: ["MARK_PAST_DUE drives subscription.billing_status -> PAST_DUE; PAY restores CURRENT"] }

  # --- System clock (test-driving) ---
  - method: POST
    path: "/api/_clock/set_current_utc"
    description: "Set the logical clock. Startup default is exactly 2026-08-01T00:00:00Z and never falls back to wall-clock. Setting the clock applies due system transitions: SCHEDULED pauses whose window contains the new date activate (cascading subscription PAUSED and in-window stop SKIPs), ACTIVE pauses past end_date complete (cascading subscription resume)."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["pause activation/completion cascades", "final_credit_cents computed on completed pauses"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Malformed body, missing required field, bad enum member, or scalar constraint violated (window order, positive weights/counts)" }
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or malformed X-User-Role / X-User-ID" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not allowed for the endpoint, or entity-backed Customer touching another customer's resource" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id does not exist" }
  - { id: ERR_REFERENCE_NOT_FOUND, http: 404, condition: "Body-supplied FK id does not exist" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Transition not allowed from current state or a non-business state precondition failed" }
  - { id: ERR_ALREADY_TERMINAL, http: 409, condition: "Event attempted on a resource in a terminal state" }
  - { id: ERR_SUBSCRIPTION_NOT_ACTIVE, http: 409, condition: "Operation requires Subscription.service_status == ACTIVE" }
  - { id: ERR_ROUTE_LOCKED, http: 409, condition: "Route is LOCKED/IN_PROGRESS/terminal where PLANNED or SEQUENCED is required" }
  - { id: ERR_SANITIZATION_NOT_VALIDATED, http: 422, condition: "RELEASE attempted with validation_passed != true" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 422, condition: "RELEASE attempted with validated_by == wash_started_by" }
  - { id: ERR_REWASH_LIMIT_EXCEEDED, http: 409, condition: "REWASH attempted when rewash_count >= pinned formula.max_rewash_count" }
  - { id: ERR_PAUSE_NOTICE_TOO_SHORT, http: 422, condition: "Pause start_date < current date + 3 days" }
  - { id: ERR_PAUSE_WINDOW_INVALID, http: 422, condition: "end_date <= start_date or pause longer than 28 days" }
  - { id: ERR_CUTOFF_PASSED, http: 422, condition: "Route sequence/LOCK after cutoff, START on wrong date, or subscription ACTIVATE before start_date" }
  - { id: ERR_INVOICE_NOT_PAST_DUE, http: 422, condition: "MARK_PAST_DUE before issued_at + 14 days" }
  - { id: ERR_BILLING_CYCLE_CLOSED, http: 409, condition: "Invoice period not exactly 7 days or overlaps a non-VOID invoice of the subscription" }
  - { id: ERR_PAUSE_OVERLAP, http: 409, condition: "Half-open pause window intersects another SCHEDULED/ACTIVE pause of the subscription" }
  - { id: ERR_STOP_WINDOW_CONFLICT, http: 409, condition: "Stop window plus 15-minute buffer collides with a non-terminal stop on the route" }
  - { id: ERR_ROUTE_CAPACITY_EXCEEDED, http: 422, condition: "Completion would push route.total_clean_items_delivered above 4000" }
  - { id: ERR_SIZE_TRANSITION_INVALID, http: 422, condition: "Swap target size is not exactly one step from current size" }
  - { id: ERR_DUPLICATE_ACTIVE_SUBSCRIPTION, http: 409, condition: "Customer already has a subscription in PENDING_START/ACTIVE/PAUSED/SUSPENDED" }
  - { id: ERR_ZONE_NOT_SERVICEABLE, http: 422, condition: "Zone inactive or subscription zone differs from customer home zone" }
  - { id: ERR_RETURN_COUNT_MISMATCH, http: 422, condition: "Returned count exceeds issued count (kit RETURN or swap COMPLETE)" }
  - { id: ERR_WEIGHT_VARIANCE_EXCEEDED, http: 422, condition: "Wash load or RELEASE references an intake in DISPUTED status" }
  - { id: ERR_KIT_NOT_RETURNED, http: 409, condition: "TERMINATE attempted while StarterKit is not SETTLED" }
  - { id: ERR_DEPOSIT_INSUFFICIENT, http: 402, condition: "deposit_held_cents below the computed charge on CHARGE / deposit-applying SETTLE" }
  - { id: ERR_INVOICE_UNPAID, http: 402, condition: "TERMINATE attempted with an invoice ISSUED or PAST_DUE" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "OCC: expected_*_version does not match the parent entity's current version" }
  - { id: ERR_INVENTORY_SHORTFALL, http: 409, condition: "Pool availability insufficient for kit reservation, swap approval, or RETIRE adjustment" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Operations administrator; superset of every role (hierarchical override)"
    identity: opaque
    exclusive_operations:
      - "POST /api/subscription-plans, /api/service-zones, /api/customers, /api/subscriptions, /api/routes, /api/inventory-pools, /api/wash-formulas"
      - "POST /api/routes/{id}/sequence, POST /api/routes/{id}/events"
      - "POST /api/customers/{id}/events"
      - "POST /api/inventory-swaps/{id}/approve"
      - "POST /api/_clock/set_current_utc"
    shared_operations:
      - "All GET endpoints; all event/complete/load endpoints shared with the specialist roles"

  - name: Customer
    description: "Subscribing household; acts only on resources chained to its own Customer id"
    identity: "entity_backed:Customer"
    exclusive_operations: []
    shared_operations:
      - "POST /api/service-pauses, POST /api/service-pauses/{id}/cancel (own subscription)"
      - "POST /api/inventory-swaps (own subscription)"
      - "POST /api/subscriptions/{id}/events limited to TERMINATE on own subscription"
      - "GET endpoints restricted to own chain (ERR_FORBIDDEN otherwise)"

  - name: RouteDriver
    description: "Driver running a route manifest; records curb-side bag exchange"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "POST /api/route-stops/{id}/complete"
      - "POST /api/route-stops/{id}/events (MISS, SKIP, RESCHEDULE, FORFEIT)"
      - "GET endpoints"

  - name: PlantOperator
    description: "Wash-plant operator; intake, wash batches, kit issue/return, pool adjustments, swap staging"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "POST /api/soiled-intakes, POST /api/soiled-intakes/{id}/events"
      - "POST /api/wash-batches, POST /api/wash-batches/{id}/load, POST /api/wash-batches/{id}/events"
      - "POST /api/starter-kits/{id}/events"
      - "POST /api/inventory-pools/{id}/adjustments"
      - "POST /api/inventory-swaps/{id}/events (STAGE, COMPLETE, CANCEL)"
      - "POST /api/lost-item-cases (plant-observed loss/damage)"
      - "GET endpoints"

  - name: BillingAdmin
    description: "Billing and ledger administration; invoices and lost/damaged money movements"
    identity: opaque
    exclusive_operations:
      - "POST /api/lost-item-cases/{id}/events WAIVE"
      - "POST /api/invoices/{id}/events WRITE_OFF"
    shared_operations:
      - "POST /api/invoices/generate, POST /api/invoices/{id}/events"
      - "POST /api/lost-item-cases, POST /api/lost-item-cases/{id}/events (CHARGE, DISPUTE, SETTLE)"
      - "GET endpoints"
