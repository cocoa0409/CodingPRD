          assert:
            - "Call 1 returns all three lots of the job in lot_code ASC order: ${a0} == \"L-001\", ${a1} == \"L-002\", ${a2} == \"L-003\", with total_count 3 and has_more false."
            - "Call 2 returns exactly the two ISSUED lots, ${i0} == \"L-001\" and ${i1} == \"L-002\", with ${iq0} == 3000; total_count 2."
            - "Call 3 returns exactly one row, ${t0} == \"L-003\" with ${tq0} == 4498 and quantity_received 0 - the two slices are disjoint and their union is the whole job."
            - "Call 4 returns the same two rows as call 2 (${p0} == \"L-001\", ${p1} == \"L-002\"), because precinct_id is written only by issue; the IN_TRANSIT lot has precinct_id null and is excluded."
