              as_user_id: "vp-1"
              captures: { f_id: $.data.id, f_ver: $.data.version }
            - call: "POST /advancement/prospects"
              payload: { full_name: "Donor A", prospect_type: "INDIVIDUAL", contact_email: "a@x.com" }
              as: ProspectResearcher
              as_user_id: "res-1"
              captures: { p_id: $.data.id }
            - call: "POST /advancement/prospects/${p_id}/assessments"
              payload: { assessed_capacity_cents: 30000000, engagement_score: 80, philanthropy_score: 70, recency_score: 60, evidence_tier: "VERIFIED_DOCUMENT" }
              as: ProspectResearcher
              as_user_id: "res-1"
              captures: { a_id: $.data.id }
            - call: "POST /advancement/assessments/${a_id}/review"
              payload: { decision: "APPROVE" }
              as: AdvancementDirector
              as_user_id: "dir-1"
            - call: "POST /advancement/fundraisers/${f_id}/assignments"
              payload: { prospect_id: "${p_id}", expected_fundraiser_version: "${f_ver}" }
              as: AdvancementDirector
              as_user_id: "dir-1"
            - call: "POST /advancement/prospects/${p_id}/moves"
              payload: { target_stage: "CULTIVATION" }
              as: GiftOfficer
              as_user_id: "${f_id}"
            - call: "GET /advancement/prospects/${p_id}"
              payload: {}
              as: GiftOfficer
              as_user_id: "${f_id}"
              captures: { p_ver: $.data.version }
            - call: "POST /advancement/proposals"
              payload: { prospect_id: "${p_id}", proposal_type: "OUTRIGHT", ask_amount_cents: 1000000, designation_purpose: "Programs", expected_prospect_version: "${p_ver}" }
              as: GiftOfficer
              as_user_id: "${f_id}"
              captures: { prop_id: $.data.id }
            - call: "POST /advancement/proposals/${prop_id}/submit"
              payload: {}
              as: GiftOfficer
              as_user_id: "${f_id}"
            - call: "POST /advancement/proposals/${prop_id}/review"
              payload: { decision: "APPROVE" }
              as: AdvancementDirector
              as_user_id: "dir-1"
            - call: "POST /advancement/proposals/${prop_id}/agreements"
              payload: { restriction_type: "UNRESTRICTED", agreement_amount_cents: 1000000 }
              as: GiftOfficer
              as_user_id: "${f_id}"
              captures: { agr_id: $.data.id }
            - call: "POST /advancement/agreements/${agr_id}/present"
              payload: {}
              as: GiftOfficer
              as_user_id: "${f_id}"
            - call: "POST /advancement/agreements/${agr_id}/execute"
              payload: {}
              as: VPAdvancement
              as_user_id: "vp-1"
          trigger:
            - call: "GET /advancement/agreements?prospect_id=${p_id}"
              payload: {}
              as: VPAdvancement
              as_user_id: "vp-1"
            - call: "GET /advancement/agreements?prospect_id=8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: VPAdvancement
              as_user_id: "vp-1"
          assert:
            - "first trigger returns exactly 1 row with id ${agr_id} and signature_status == \"EXECUTED\""
            - "second trigger returns 0 rows with total_count == 0"

      - name: clock_set_echo_and_monotonic_guard
        claim_type: conditional_action
        grounds: [endpoints.POST /advancement/_clock/set_current_utc, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Setting the clock echoes the new logical time; a backward set (not strictly later) is rejected — time never falls back to wall clock."
        test_recipe:
          setup: ["empty database; logical clock at default 2026-08-01T00:00:00Z"]
          setup_api_calls:
            - call: "POST /advancement/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T00:00:00Z" }
              as: AdvancementDirector
              as_user_id: "dir-1"
              captures: { now1: $.data.current_utc }
          trigger:
            - call: "POST /advancement/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T12:00:00Z" }
              as: AdvancementDirector
              as_user_id: "dir-1"
              captures: { err: $.data.error_id }
          assert:
            - "now1 == \"2026-08-02T00:00:00Z\"  # set echoes the new logical time"
            - "err == \"ERR_INVALID_REQUEST\"  # 2026-08-01T12:00:00Z is not strictly later than the current logical time"

      - name: campaign_totals_computed_read
        claim_type: computed_read
        grounds: ["endpoints.GET /advancement/campaigns/{id}/totals"]
        excluded_because:
          difficulty_instance: campaign_face_value_vs_cash_receipts_divergence
          rationale: "The computed read is exercised there with pinned literals for both variants."

