  - method: POST
    path: "/orders/{id}/pay"
    description: "Customer pays an INVOICED Order"
    roles: [Customer]
    code: 200
    input: []
    output: Order
    side_effects: ["billing_status -> PAID"]

  - method: GET
    path: "/orders/{id}/quote"
    description: "Get the Order's ESTIMATE Quote (computed read; sub-resource satisfies Quote.order_id)"
    roles: [ShopManager, ArtStaff, Customer]
    code: 200
    input: []
    output: "Quote[]"
    side_effects: []

  # ---- ArtProof (sub-resource of Order) ----
