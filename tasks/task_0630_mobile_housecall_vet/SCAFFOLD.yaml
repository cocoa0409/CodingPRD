# =============================================================================
# Mobile & House-Call Veterinary Service — SCAFFOLD (§1.0–§1.7)
# Difficulty tier: Expert
# =============================================================================

scenario: |
  Mobile & House-Call Veterinary Service (The Vets/Bond Vet style): service area &
  appointment, in-home exam/vaccine/euthanasia, vet/tech route & rolling-clinic
  inventory, controlled-med (euthanasia) log & DEA, estimate & on-site payment,
  lab/specimen pickup, recurring wellness & reminder, hospital referral

domain_name: mobile-housecall-vet
api_prefix: /

# =============================================================================
# Complexity profile (§0.1–§0.4)
# =============================================================================
complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: temporal_windowing
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - optimistic_concurrency
    - derived_field_reconciliation
    - rate_threshold_triggers

  entity_topology: flat
  # Peer entities linked by FK references; RouteDay/RouteStop/Appointment are
  # cross-referenced rather than strictly nested, and ControlledMedLog,
  # SpecimenPickup, WellnessPlan, Referral hang off Appointment/RollingClinic
  # by FK, not by URL nesting.

  state_machine_shape: branching
  # Appointment forks (in-home euthanasia vs standard visit) with divergent
  # side-effect sets; RouteDay is posture/compound; Estimate has a revise cycle.

  relationship_patterns:
    - one_to_many        # RollingClinic -> ControlledMedLog; Appointment -> Estimate
    - cross_aggregate    # RouteStop references Appointment AND RouteDay
    - polymorphic        # Clinician.role distinguishes VET vs TECH on one table

  role_model: segregation_of_duties
  # The veterinarian who administers a controlled euthanasia drug cannot also be
  # the witness who co-signs the disposal of the wasted remainder.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: ServiceArea
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, 3 fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "ISO 8601 UTC, refreshed on every mutation" }
      - { name: version, type: integer, source: system, description: "Starts at 1, +1 every mutation", default: 1 }
      - { name: zip_code, type: string, source: input, description: "5-digit ZIP this area covers; unique across active ServiceAreas" }
      - { name: name, type: string, source: input, description: "Human label, e.g. 'Brooklyn North'" }
      - { name: travel_surcharge_cents, type: integer, source: input, description: "Flat trip surcharge added to every estimate for visits in this ZIP", constraints: ">= 0" }
      - { name: euthanasia_allowed, type: boolean, source: input, default: true, description: "Whether in-home euthanasia may be booked in this ZIP (local ordinance gate)" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED. New areas start ACTIVE", default: "ACTIVE", constraints: "ACTIVE,SUSPENDED" }

  - name: Clinician
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, 3 fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "ISO 8601 UTC, refreshed on every mutation" }
      - { name: version, type: integer, source: system, description: "Starts at 1, +1 every mutation", default: 1 }
      - { name: full_name, type: string, source: input, description: "Clinician name" }
      - { name: clinician_role, type: enum, source: input, description: "VET | TECH. Only VET may administer controlled drugs and sign euthanasia", constraints: "VET,TECH" }
      - { name: dea_number, type: string, source: input, description: "DEA registration number; REQUIRED when clinician_role==VET, else must be null" }
      - { name: dea_expires_on, type: datetime, source: input, description: "DEA registration expiry date (UTC midnight). Required when clinician_role==VET" }
      - { name: status, type: enum, source: system, description: "AVAILABLE | ON_ROUTE | OFF_DUTY. Starts AVAILABLE", default: "AVAILABLE", constraints: "AVAILABLE,ON_ROUTE,OFF_DUTY" }

  - name: RollingClinic
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, 3 fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "ISO 8601 UTC, refreshed on every mutation" }
      - { name: version, type: integer, source: system, description: "Starts at 1, +1 every mutation", default: 1 }
      - { name: plate, type: string, source: input, description: "Vehicle plate label" }
      - { name: controlled_stock_ml, type: number, source: input, description: "On-board pentobarbital (controlled) stock in mL. Mutated by ControlledMedLog dispense/waste entries", constraints: ">= 0" }
      - { name: controlled_reconciled_ml, type: number, source: computed, description: "Independent recount: controlled_stock_ml minus sum of all DISPENSE and WASTE ControlledMedLog.amount_ml for this vehicle's RECONCILED route days; see reconcile_controlled_balance" }
      - { name: vaccine_stock_count, type: integer, source: input, description: "On-board doses of vaccine (non-controlled). Decremented per administered vaccine line", constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "IN_DEPOT | DEPLOYED | MAINTENANCE. Starts IN_DEPOT", default: "IN_DEPOT", constraints: "IN_DEPOT,DEPLOYED,MAINTENANCE" }

  - name: Patient
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, 3 fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "ISO 8601 UTC, refreshed on every mutation" }
      - { name: version, type: integer, source: system, description: "Starts at 1, +1 every mutation", default: 1 }
      - { name: owner_name, type: string, source: input, description: "Pet owner name" }
      - { name: species, type: enum, source: input, description: "DOG | CAT | OTHER", constraints: "DOG,CAT,OTHER" }
      - { name: weight_kg, type: number, source: input, description: "Animal weight in kg; drives euthanasia dose calculation", constraints: "> 0" }
      - { name: home_zip, type: string, source: input, description: "5-digit ZIP of the animal's home; matched against ServiceArea.zip_code" }

  - name: Appointment
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, 3 fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "ISO 8601 UTC, refreshed on every mutation" }
      - { name: version, type: integer, source: system, description: "Starts at 1, +1 every mutation", default: 1 }
      - { name: patient_id, type: string, source: input, description: "FK -> Patient.id" }
      - { name: service_area_id, type: string, source: computed, description: "FK -> ServiceArea.id; resolved at request time by matching patient.home_zip to the ACTIVE ServiceArea.zip_code" }
      - { name: visit_type, type: enum, source: input, description: "EXAM | VACCINE | EUTHANASIA. EUTHANASIA forks the lifecycle and requires controlled-med flow", constraints: "EXAM,VACCINE,EUTHANASIA" }
      - { name: requested_start, type: datetime, source: input, description: "Requested visit window start (UTC)" }
      - { name: requested_end, type: datetime, source: input, description: "Requested visit window end (UTC); must be > requested_start" }
      - { name: vaccine_doses, type: integer, source: input, default: 0, description: "Doses to administer; only meaningful when visit_type==VACCINE", constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "REQUESTED | SCHEDULED | IN_VISIT | AWAITING_PAYMENT | COMPLETED | REFERRED | CANCELLED. Starts REQUESTED", default: "REQUESTED", constraints: "REQUESTED,SCHEDULED,IN_VISIT,AWAITING_PAYMENT,COMPLETED,REFERRED,CANCELLED" }

  - name: RouteDay
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, 3 fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "ISO 8601 UTC, refreshed on every mutation" }
      - { name: version, type: integer, source: system, description: "Starts at 1, +1 every mutation; OCC parent for RouteStop creation", default: 1 }
      - { name: clinician_id, type: string, source: input, description: "FK -> Clinician.id; the lead clinician driving this route" }
      - { name: rolling_clinic_id, type: string, source: input, description: "FK -> RollingClinic.id; the vehicle assigned to this route day" }
      - { name: service_date, type: datetime, source: input, description: "Calendar date of the route (UTC midnight)" }
      - { name: stop_count, type: integer, source: computed, description: "Count of RouteStop with status IN {PLANNED, ARRIVED, SERVICED} for this route day; see route_stop_count" }
      - { name: posture, type: enum, source: system, description: "OPEN | LOCKED | RECONCILED. OPEN accepts new stops; LOCKED freezes stop set for the day; RECONCILED after controlled-med count closes. Starts OPEN", default: "OPEN", constraints: "OPEN,LOCKED,RECONCILED" }

  - name: RouteStop
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, 3 fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "ISO 8601 UTC, refreshed on every mutation" }
      - { name: version, type: integer, source: system, description: "Starts at 1, +1 every mutation", default: 1 }
      - { name: route_day_id, type: string, source: input, description: "FK -> RouteDay.id; the route this stop belongs to" }
      - { name: appointment_id, type: string, source: input, description: "FK -> Appointment.id; the appointment serviced at this stop" }
      - { name: window_start, type: datetime, source: input, description: "Planned arrival window start (UTC)" }
      - { name: window_end, type: datetime, source: input, description: "Planned departure window end (UTC); must be > window_start" }
      - { name: sequence, type: integer, source: computed, description: "1-based ordinal of this stop on the route, assigned by window_start ASC then created_at ASC; see assign_stop_sequence" }
      - { name: status, type: enum, source: system, description: "PLANNED | ARRIVED | SERVICED | SKIPPED. Starts PLANNED", default: "PLANNED", constraints: "PLANNED,ARRIVED,SERVICED,SKIPPED" }

  - name: Estimate
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, 3 fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "ISO 8601 UTC, refreshed on every mutation" }
      - { name: version, type: integer, source: system, description: "Starts at 1, +1 every mutation", default: 1 }
      - { name: appointment_id, type: string, source: input, description: "FK -> Appointment.id; the visit this estimate prices" }
      - { name: line_items, type: array, source: input, description: "Array of { code, label, unit_cents, qty }; priced bottom-up per line then summed" }
      - { name: subtotal_cents, type: integer, source: computed, description: "Sum over line items of round_half_up(unit_cents * qty); see estimate_total" }
      - { name: travel_surcharge_cents, type: integer, source: computed, description: "Copied from the resolved ServiceArea.travel_surcharge_cents at estimate creation" }
      - { name: estimate_total_cents, type: integer, source: computed, description: "subtotal_cents + travel_surcharge_cents; see estimate_total" }
      - { name: invoice_total_cents, type: integer, source: computed, description: "Finalized at visit close; sum of ACTUALLY-administered lines + travel surcharge; diverges from estimate_total_cents; see invoice_total" }
      - { name: status, type: enum, source: system, description: "DRAFT | APPROVED | INVOICED | VOID. Starts DRAFT", default: "DRAFT", constraints: "DRAFT,APPROVED,INVOICED,VOID" }

  - name: Payment
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, 3 fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "ISO 8601 UTC, refreshed on every mutation" }
      - { name: version, type: integer, source: system, description: "Starts at 1, +1 every mutation", default: 1 }
      - { name: estimate_id, type: string, source: input, description: "FK -> Estimate.id; the invoice being paid" }
      - { name: amount_cents, type: integer, source: input, description: "Amount tendered on site, in cents", constraints: "> 0" }
      - { name: method, type: enum, source: input, description: "CARD | CASH | CHECK", constraints: "CARD,CASH,CHECK" }
      - { name: status, type: enum, source: system, description: "CAPTURED | REFUNDED. Starts CAPTURED", default: "CAPTURED", constraints: "CAPTURED,REFUNDED" }

  - name: ControlledMedLog
    parent: null
    common_fields: false
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, 3 fractional digits; append-only entry timestamp" }
      - { name: rolling_clinic_id, type: string, source: input, description: "FK -> RollingClinic.id; the vehicle whose controlled stock this entry adjusts" }
      - { name: appointment_id, type: string, source: input, description: "FK -> Appointment.id; the euthanasia visit this entry documents" }
      - { name: administering_vet_id, type: string, source: input, description: "FK -> Clinician.id; the VET who drew and administered the drug" }
      - { name: witness_vet_id, type: string, source: input, description: "FK -> Clinician.id; the second VET who co-signs WASTE entries; must differ from administering_vet_id" }
      - { name: entry_type, type: enum, source: input, description: "DISPENSE | WASTE. DISPENSE = administered dose; WASTE = co-signed disposal of unused remainder", constraints: "DISPENSE,WASTE" }
      - { name: amount_ml, type: number, source: input, description: "mL drawn (DISPENSE) or discarded (WASTE)", constraints: "> 0" }

  - name: SpecimenPickup
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, 3 fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "ISO 8601 UTC, refreshed on every mutation" }
      - { name: version, type: integer, source: system, description: "Starts at 1, +1 every mutation", default: 1 }
      - { name: appointment_id, type: string, source: input, description: "FK -> Appointment.id; the visit the specimen was collected at" }
      - { name: specimen_type, type: enum, source: input, description: "BLOOD | URINE | TISSUE", constraints: "BLOOD,URINE,TISSUE" }
      - { name: status, type: enum, source: system, description: "COLLECTED | IN_TRANSIT | DELIVERED. Starts COLLECTED", default: "COLLECTED", constraints: "COLLECTED,IN_TRANSIT,DELIVERED" }

  - name: WellnessPlan
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, 3 fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "ISO 8601 UTC, refreshed on every mutation" }
      - { name: version, type: integer, source: system, description: "Starts at 1, +1 every mutation", default: 1 }
      - { name: patient_id, type: string, source: input, description: "FK -> Patient.id; the animal enrolled" }
      - { name: interval_days, type: integer, source: input, description: "Reminder cadence in days; next reminder = anchor_date + interval_days", constraints: ">= 1" }
      - { name: anchor_date, type: datetime, source: input, description: "Date the recurring cycle is measured from (UTC)" }
      - { name: next_reminder_date, type: datetime, source: computed, description: "Computed forward from anchor_date by interval_days past the current clock; see next_reminder" }
      - { name: status, type: enum, source: system, description: "ACTIVE | PAUSED | ENDED. Starts ACTIVE", default: "ACTIVE", constraints: "ACTIVE,PAUSED,ENDED" }

  - name: Referral
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, 3 fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "ISO 8601 UTC, refreshed on every mutation" }
      - { name: version, type: integer, source: system, description: "Starts at 1, +1 every mutation", default: 1 }
      - { name: appointment_id, type: string, source: input, description: "FK -> Appointment.id; the visit escalated to a hospital" }
      - { name: hospital_name, type: string, source: input, description: "Receiving emergency/specialty hospital" }
      - { name: reason, type: string, source: input, description: "Clinical reason for referral" }
      - { name: status, type: enum, source: system, description: "OPEN | ACKNOWLEDGED. Starts OPEN", default: "OPEN", constraints: "OPEN,ACKNOWLEDGED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Appointment
    field: status
    initial_state: REQUESTED
    terminal_states: [COMPLETED, REFERRED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: SCHEDULED
        trigger: "POST /route-days/{routeDayId}/stops (creates the RouteStop that books this appointment)"
        actor: Dispatcher
        preconditions:
          - "Appointment.status == REQUESTED"
          - "RouteDay.posture == OPEN (ERR_ROUTE_NOT_OPEN)"
          - "Resolved ServiceArea for patient.home_zip is ACTIVE (ERR_AREA_NOT_COVERED)"
          - "If Appointment.visit_type == EUTHANASIA, the resolved ServiceArea.euthanasia_allowed == true (ERR_EUTHANASIA_NOT_PERMITTED)"
          - "If Appointment.visit_type == EUTHANASIA, the RouteDay.clinician.clinician_role == VET (ERR_VET_REQUIRED)"
          - "RouteStop window must not overlap an existing non-SKIPPED stop on the same RouteDay including TRAVEL_BUFFER_MIN buffer (ERR_STOP_WINDOW_CONFLICT)"
          - "RouteStop window must not overlap any non-SKIPPED stop on any RouteDay sharing this rolling_clinic_id on the same service_date, zero-buffer touching allowed (ERR_VEHICLE_DOUBLE_BOOKED)"
        side_effects:
          - "Create RouteStop in PLANNED; recompute RouteDay.stop_count (route_stop_count)"
          - "Recompute RouteStop.sequence across the route (assign_stop_sequence)"
          - "Increment RouteDay.version by 1"
      - from: SCHEDULED
        to: IN_VISIT
        trigger: "POST /appointments/{id}/arrive"
        actor: Clinician
        preconditions:
          - "Appointment.status == SCHEDULED"
          - "The linked RouteStop.status == PLANNED"
          - "RouteDay.posture IN {OPEN, LOCKED} (ERR_ROUTE_NOT_OPEN)"
        side_effects:
          - "Linked RouteStop.status PLANNED -> ARRIVED"
          - "Clinician.status -> ON_ROUTE"
      - from: IN_VISIT
        to: AWAITING_PAYMENT
        trigger: "POST /appointments/{id}/complete-visit"
        actor: Clinician
        preconditions:
          - "Appointment.status == IN_VISIT"
          - "An Estimate exists for this appointment in APPROVED status (ERR_NO_APPROVED_ESTIMATE)"
          - "If visit_type == EUTHANASIA: a DISPENSE ControlledMedLog entry AND a WASTE ControlledMedLog entry exist for this appointment (ERR_EUTHANASIA_LOG_INCOMPLETE)"
          - "If visit_type == VACCINE and vaccine_doses > 0: rolling clinic had >= vaccine_doses vaccine_stock_count at arrival"
        side_effects:
          - "Finalize Estimate: status APPROVED -> INVOICED, compute invoice_total_cents (invoice_total)"
          - "If visit_type == VACCINE: decrement RollingClinic.vaccine_stock_count by vaccine_doses (cascades vehicle inventory)"
          - "Linked RouteStop.status ARRIVED -> SERVICED; recompute RouteDay.stop_count"
      - from: AWAITING_PAYMENT
        to: COMPLETED
        trigger: "POST /payments (captures payment for the appointment's INVOICED estimate)"
        actor: Clinician
        preconditions:
          - "Appointment.status == AWAITING_PAYMENT"
          - "Estimate.status == INVOICED"
          - "Payment.amount_cents == Estimate.invoice_total_cents (ERR_PAYMENT_AMOUNT_MISMATCH)"
        side_effects:
          - "Create Payment in CAPTURED"
          - "Clinician.status -> AVAILABLE"
      - from: [REQUESTED, SCHEDULED, IN_VISIT]
        to: REFERRED
        trigger: "POST /appointments/{id}/refer"
        actor: Clinician
        preconditions:
          - "Appointment.status IN {REQUESTED, SCHEDULED, IN_VISIT}"
          - "Appointment.visit_type != EUTHANASIA (ERR_EUTHANASIA_NOT_REFERABLE)"
        side_effects:
          - "Create Referral in OPEN"
          - "If a RouteStop is linked and non-terminal: RouteStop.status -> SKIPPED; recompute RouteDay.stop_count and re-sequence (assign_stop_sequence)"
          - "Any DRAFT or APPROVED Estimate for this appointment -> VOID"
          - "Clinician.status -> AVAILABLE (only if it was ON_ROUTE for this appointment)"
      - from: [REQUESTED, SCHEDULED]
        to: CANCELLED
        trigger: "POST /appointments/{id}/cancel"
        actor: Dispatcher
        preconditions:
          - "Appointment.status IN {REQUESTED, SCHEDULED}"
        side_effects:
          - "If a RouteStop is linked and PLANNED: RouteStop.status -> SKIPPED; recompute RouteDay.stop_count and re-sequence (assign_stop_sequence)"
          - "Any DRAFT or APPROVED Estimate for this appointment -> VOID"

  - entity: RouteDay
    field: posture
    initial_state: OPEN
    terminal_states: [RECONCILED]
    transitions:
      - from: OPEN
        to: LOCKED
        trigger: "POST /route-days/{id}/lock"
        actor: Dispatcher
        preconditions:
          - "RouteDay.posture == OPEN"
          - "stop_count >= 1 (ERR_ROUTE_EMPTY)"
          - "RollingClinic.status == DEPLOYED OR transitions it now: vehicle must not be in MAINTENANCE (ERR_VEHICLE_UNAVAILABLE)"
        side_effects:
          - "Freezes the stop set: no further RouteStop creation while LOCKED"
          - "RollingClinic.status IN_DEPOT -> DEPLOYED"
          - "Clinician.status -> ON_ROUTE"
      - from: LOCKED
        to: RECONCILED
        trigger: "POST /route-days/{id}/reconcile"
        actor: ComplianceOfficer
        preconditions:
          - "RouteDay.posture == LOCKED"
          - "Every RouteStop on this route is in a terminal stop state {SERVICED, SKIPPED} (ERR_STOPS_OPEN)"
          - "For each euthanasia appointment serviced on this route, sum(DISPENSE.amount_ml) and sum(WASTE.amount_ml) reconcile against RollingClinic.controlled_stock_ml movement (ERR_CONTROLLED_COUNT_MISMATCH)"
        side_effects:
          - "Recompute RollingClinic.controlled_reconciled_ml (reconcile_controlled_balance)"
          - "RollingClinic.status DEPLOYED -> IN_DEPOT"
          - "Clinician.status ON_ROUTE -> AVAILABLE"

  - entity: Estimate
    field: status
    initial_state: DRAFT
    terminal_states: [INVOICED, VOID]
    transitions:
      - from: DRAFT
        to: DRAFT
        trigger: "PUT /estimates/{id} (revise line items)"
        actor: Clinician
        preconditions:
          - "Estimate.status == DRAFT"
        side_effects:
          - "Replace line_items; recompute subtotal_cents and estimate_total_cents (estimate_total)"
          - "Increment Estimate.version by 1"
      - from: DRAFT
        to: APPROVED
        trigger: "POST /estimates/{id}/approve"
        actor: Clinician
        preconditions:
          - "Estimate.status == DRAFT"
          - "Linked Appointment.status IN {SCHEDULED, IN_VISIT} (ERR_APPT_NOT_IN_VISIT_PHASE)"
        side_effects:
          - "Lock line_items"
      - from: APPROVED
        to: INVOICED
        trigger: "system (Appointment complete-visit)"
        actor: system
        preconditions:
          - "Estimate.status == APPROVED"
        side_effects:
          - "Compute invoice_total_cents (invoice_total)"
      - from: [DRAFT, APPROVED]
        to: VOID
        trigger: "system (Appointment cancel or refer)"
        actor: system
        preconditions:
          - "Estimate.status IN {DRAFT, APPROVED}"
        side_effects: []

  - entity: SpecimenPickup
    field: status
    initial_state: COLLECTED
    terminal_states: [DELIVERED]
    transitions:
      - from: COLLECTED
        to: IN_TRANSIT
        trigger: "POST /specimen-pickups/{id}/transit"
        actor: Clinician
        preconditions:
          - "SpecimenPickup.status == COLLECTED"
        side_effects: []
      - from: IN_TRANSIT
        to: DELIVERED
        trigger: "POST /specimen-pickups/{id}/deliver"
        actor: Clinician
        preconditions:
          - "SpecimenPickup.status == IN_TRANSIT"
        side_effects: []

  - entity: WellnessPlan
    field: status
    initial_state: ACTIVE
    terminal_states: [ENDED]
    transitions:
      - from: ACTIVE
        to: PAUSED
        trigger: "POST /wellness-plans/{id}/pause"
        actor: Dispatcher
        preconditions:
          - "WellnessPlan.status == ACTIVE"
        side_effects: []
      - from: PAUSED
        to: ACTIVE
        trigger: "POST /wellness-plans/{id}/resume"
        actor: Dispatcher
        preconditions:
          - "WellnessPlan.status == PAUSED"
        side_effects:
          - "Recompute next_reminder_date from the current clock (next_reminder)"
      - from: [ACTIVE, PAUSED]
        to: ENDED
        trigger: "POST /wellness-plans/{id}/end"
        actor: Dispatcher
        preconditions:
          - "WellnessPlan.status IN {ACTIVE, PAUSED}"
        side_effects: []

  - entity: Referral
    field: status
    initial_state: OPEN
    terminal_states: [ACKNOWLEDGED]
    transitions:
      - from: OPEN
        to: ACKNOWLEDGED
        trigger: "POST /referrals/{id}/acknowledge"
        actor: ComplianceOfficer
        preconditions:
          - "Referral.status == OPEN"
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: stop-create-stale-route-day
    parent_entity: RouteDay
    write_endpoint: "POST /route-days/{routeDayId}/stops"
    occ_field: "expected_route_day_version"
    description: |
      Creating a RouteStop against a RouteDay whose version has advanced since
      the client last observed it is rejected as stale. A prior stop creation
      legitimately succeeds and advances RouteDay.version (and re-sequences the
      route); a second create still carrying the old version is rejected because
      its view of the route's stop set and capacity is no longer current.
    error_id: ERR_STALE_ROUTE_DAY_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: estimate_total
    trigger: "Estimate create (POST /estimates) and revise (PUT /estimates/{id})"
    algorithm: aggregation
    formula: |
      # ROUND-PER-LINE-THEN-SUM (pinned order). Per line: round_half_up the
      # money, then sum integer cents. Do NOT sum raw products and round once.
      subtotal_cents = 0
      for li in line_items:                      # processed in array order
        line_cents = round_half_up(li.unit_cents * li.qty)
        subtotal_cents = subtotal_cents + line_cents
      travel_surcharge_cents = resolved_service_area.travel_surcharge_cents
      estimate_total_cents = subtotal_cents + travel_surcharge_cents
    input_set: "All line_items in the Estimate.line_items array; travel surcharge from the ServiceArea resolved by the appointment's patient.home_zip"
    constants: {}
    precision: "integer cents; round_half_up applied PER LINE before summation"
    note: "unit_cents may be integer; qty may be fractional (e.g., 1.5 vials), so per-line rounding is observable"

  - name: invoice_total
    trigger: "Appointment complete-visit (Estimate APPROVED -> INVOICED)"
    algorithm: aggregation
    formula: |
      # FINAL variant: only lines actually administered are billed. A vaccine
      # line is billed only if the visit administered it; partial vaccine
      # delivery bills the delivered qty. Travel surcharge always applies.
      invoice_cents = 0
      for li in line_items:                      # array order
        billable_qty = li.qty
        if li.code == "VACCINE_DOSE":
          billable_qty = min(li.qty, appointment.vaccine_doses)
        line_cents = round_half_up(li.unit_cents * billable_qty)
        invoice_cents = invoice_cents + line_cents
      invoice_total_cents = invoice_cents + travel_surcharge_cents
    input_set: "Estimate.line_items, capped per-line by what was administered; travel_surcharge_cents already stored on the estimate"
    constants: {}
    precision: "integer cents; round_half_up per line before summation"
    variants:
      - name: estimate_variant
        when: "At estimate creation/approval, before the visit"
        difference: "Bills the full requested qty on every line (forward-looking projection of the full plan)"
      - name: invoice_variant
        when: "At visit completion, after administration"
        difference: "Caps each VACCINE_DOSE line at appointment.vaccine_doses actually given; can be strictly less than estimate_total_cents"

  - name: euthanasia_dose
    trigger: "POST /appointments/{id}/euthanasia-log with entry_type==DISPENSE"
    algorithm: threshold
    formula: |
      # Pentobarbital dosing: DOSE_PER_KG mL per kg, with a hard floor for very
      # small animals. Boundary precision matters at exactly MIN_DOSE_KG.
      raw_ml = patient.weight_kg * DOSE_PER_KG_ML
      required_ml = max(raw_ml, MIN_FLOOR_ML)
      # The DISPENSE entry's amount_ml MUST be >= required_ml or it is rejected
      # (ERR_DOSE_BELOW_MINIMUM); a vet may draw more (overage becomes WASTE).
    input_set: "patient.weight_kg of the appointment's patient"
    constants:
      DOSE_PER_KG_ML: 0.2
      MIN_FLOOR_ML: 1.0
    precision: "1 decimal place, round_half_up; weight_kg <= 5.0 hits the floor"
    note: "At weight_kg == 5.0 raw_ml == 1.0 == floor; at 4.99 raw_ml < floor so floor applies — boundary at 5.0 kg"

  - name: reconcile_controlled_balance
    trigger: "RouteDay reconcile (POST /route-days/{id}/reconcile)"
    algorithm: chronological
    formula: |
      # Independent recount of vehicle controlled stock, replaying the day's
      # ControlledMedLog entries in created_at ASC order (tie-break created_at,
      # never id). Both DISPENSE and WASTE remove drug from the vehicle.
      starting = rolling_clinic.controlled_stock_ml_at_lock   # snapshot at lock
      consumed = 0.0
      for entry in controlled_logs_for_route ordered by created_at ASC:
        consumed = consumed + entry.amount_ml                 # DISPENSE and WASTE both consume
      expected_remaining = round_half_up_1dp(starting - consumed)
      controlled_reconciled_ml = expected_remaining
      # Reconcile passes only if controlled_reconciled_ml == rolling_clinic.controlled_stock_ml
      # (the running balance the dispense/waste side-effects produced); else ERR_CONTROLLED_COUNT_MISMATCH
    input_set: "All ControlledMedLog entries whose appointment is serviced on this RouteDay's stops, ordered by created_at ASC"
    constants: {}
    precision: "1 decimal place, round_half_up"
    note: "Two algorithms over the same logs: side-effect running balance (controlled_stock_ml) vs independent replay recount (controlled_reconciled_ml); they must agree"

  - name: stop_window_overlap
    trigger: "RouteStop create (POST /route-days/{routeDayId}/stops)"
    algorithm: interval_merge
    formula: |
      # TWO distinct interval semantics over half-open [start, end) windows:
      #
      # (A) CLINICIAN buffer overlap, on the SAME RouteDay (one clinician cannot
      #     teleport): two windows conflict if they overlap OR sit closer than
      #     TRAVEL_BUFFER_MIN. Inflate the existing window by the buffer on BOTH
      #     ends, then test strict interval intersection:
      #       conflict_A = new.start < (other.end + TRAVEL_BUFFER_MIN)
      #                    AND other.start < (new.end + TRAVEL_BUFFER_MIN)
      #     => windows that merely touch (gap == 0) DO conflict (buffer > 0).
      #     Rejected with ERR_STOP_WINDOW_CONFLICT.
      #
      # (B) VEHICLE double-booking, across ANY RouteDay sharing rolling_clinic_id
      #     on the SAME service_date: zero-buffer half-open overlap. Touching at
      #     an endpoint is allowed (the van can be handed off instantly):
      #       conflict_B = new.start < other.end AND other.start < new.end
      #     => gap == 0 (new.start == other.end) does NOT conflict.
      #     Rejected with ERR_VEHICLE_DOUBLE_BOOKED.
      #
      # Only non-SKIPPED stops participate in either check.
    input_set: "Existing non-SKIPPED RouteStops on the same RouteDay (A) and on all RouteDays sharing the vehicle for the same service_date (B)"
    constants:
      TRAVEL_BUFFER_MIN: 30
    precision: "minutes; windows are half-open [start, end)"
    note: "Same geometry primitive, two different adjacency treatments: (A) buffered closed-ish (touching conflicts), (B) zero-buffer half-open (touching allowed)"

  - name: route_stop_count
    trigger: "RouteStop create, Appointment cancel/refer/complete-visit (any stop status change)"
    algorithm: aggregation
    formula: |
      stop_count = count(RouteStop
        where route_day_id == this.id
        and status IN {PLANNED, ARRIVED, SERVICED})
      # SKIPPED stops are excluded.
    input_set: "RouteStop rows for the route day with status in {PLANNED, ARRIVED, SERVICED}"
    constants: {}
    precision: "integer count"

  - name: assign_stop_sequence
    trigger: "RouteStop create; any stop skip (cancel/refer cascade)"
    algorithm: chronological
    formula: |
      # Sequence is recomputed across all non-SKIPPED stops on the route.
      ordered = RouteStop where route_day_id == this and status != SKIPPED
                sorted by (window_start ASC, created_at ASC)   # NEVER by id
      for i, stop in enumerate(ordered, start=1):
        stop.sequence = i
      # SKIPPED stops keep their last sequence frozen (not renumbered).
    input_set: "Non-SKIPPED RouteStop rows for the route day"
    constants: {}
    precision: "1-based integer ordinal"
    note: "Tie-break on equal window_start is created_at ASC, never id"

  - name: next_reminder
    trigger: "WellnessPlan create, resume (POST /wellness-plans/{id}/resume)"
    algorithm: threshold
    formula: |
      # Advance the anchor forward by whole interval_days steps until strictly
      # after the current clock. Boundary: if anchor + k*interval lands EXACTLY
      # on the clock instant, that instant is NOT in the future, so advance once
      # more (strict > comparison).
      next = anchor_date
      while next <= current_clock_utc:
        next = next + interval_days days
      next_reminder_date = next
    input_set: "WellnessPlan.anchor_date, interval_days, and the logical clock"
    constants: {}
    precision: "whole days; comparison is strict greater-than against the clock"
    note: "At create time on a fresh plan with anchor in the future, next_reminder_date == anchor_date"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and well-formed"
    error_id: ERR_MISSING_AUTH
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role permitted for this operation per §1.7 RBAC"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "All path and body FK ids resolve to existing entities, validated left-to-right in the path then body FKs in declaration order"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: state
    check: "Target resource is in a state from which the requested transition is legal (covers appointment/route/estimate/specimen status preconditions)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"

  - priority: 5
    category: state
    check: "RouteDay.posture must permit the operation: stop creation requires OPEN; reconcile requires LOCKED"
    error_id: ERR_ROUTE_NOT_OPEN
    http_status: 409
    applies_to: "POST /route-days/{id}/stops, POST /route-days/{id}/lock, POST /route-days/{id}/reconcile"

  - priority: 6
    category: business_referential
    check: "Appointment's patient.home_zip resolves to an ACTIVE ServiceArea (service area coverage)"
    error_id: ERR_AREA_NOT_COVERED
    http_status: 409
    applies_to: "POST /route-days/{id}/stops, POST /estimates"

  - priority: 7
    category: business_safety
    check: "Euthanasia may only be booked where the resolved ServiceArea.euthanasia_allowed == true"
    error_id: ERR_EUTHANASIA_NOT_PERMITTED
    http_status: 403
    applies_to: "POST /route-days/{id}/stops (visit_type==EUTHANASIA)"

  - priority: 8
    category: business_safety
    check: "Controlled drug may only be administered/witnessed by a VET whose DEA registration is present and not expired against the current clock"
    error_id: ERR_DEA_INVALID
    http_status: 403
    applies_to: "POST /appointments/{id}/euthanasia-log"

  - priority: 9
    category: business_safety
    check: "WASTE ControlledMedLog entry's witness_vet_id must differ from administering_vet_id (segregation of duties)"
    error_id: ERR_WITNESS_CONFLICT
    http_status: 403
    applies_to: "POST /appointments/{id}/euthanasia-log (entry_type==WASTE)"

  - priority: 10
    category: business_safety
    check: "DISPENSE amount_ml must be >= euthanasia_dose required_ml floor for the patient's weight"
    error_id: ERR_DOSE_BELOW_MINIMUM
    http_status: 422
    applies_to: "POST /appointments/{id}/euthanasia-log (entry_type==DISPENSE)"

  - priority: 11
    category: business_temporal
    check: "RouteStop window must not overlap another non-SKIPPED stop on the same RouteDay, including TRAVEL_BUFFER_MIN clinician travel buffer"
    error_id: ERR_STOP_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /route-days/{id}/stops"

  - priority: 12
    category: business_temporal
    check: "RouteStop window must not overlap any non-SKIPPED stop on another RouteDay sharing the same rolling_clinic_id on the same service_date; touching at endpoints (zero buffer) is allowed"
    error_id: ERR_VEHICLE_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /route-days/{id}/stops"

  - priority: 13
    category: business_constraint
    check: "RollingClinic must hold enough controlled/vaccine stock for the operation (controlled_stock_ml >= amount_ml for DISPENSE/WASTE; vaccine_stock_count >= vaccine_doses at completion)"
    error_id: ERR_INSUFFICIENT_STOCK
    http_status: 409
    applies_to: "POST /appointments/{id}/euthanasia-log, POST /appointments/{id}/complete-visit"

  - priority: 14
    category: business_fiscal
    check: "On-site Payment.amount_cents must equal the INVOICED Estimate.invoice_total_cents exactly"
    error_id: ERR_PAYMENT_AMOUNT_MISMATCH
    http_status: 422
    applies_to: "POST /payments"

  - priority: 15
    category: business_constraint
    check: "OCC: expected_route_day_version must equal current RouteDay.version on stop creation"
    error_id: ERR_STALE_ROUTE_DAY_VERSION
    http_status: 412
    applies_to: "POST /route-days/{id}/stops"

  - priority: 16
    category: business_constraint
    check: "Request body well-formed: required fields present, enums valid, numeric ranges (weight_kg>0, amount_ml>0, requested_end>requested_start, window_end>window_start)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- ServiceArea ----
  - method: POST
    path: "/service-areas"
    description: "Create a ServiceArea (ZIP coverage)"
    roles: [Dispatcher]
    code: 201
    input: [zip_code, name, travel_surcharge_cents, "euthanasia_allowed?"]
    output: ServiceArea
    side_effects: ["status=ACTIVE"]
  - method: GET
    path: "/service-areas"
    description: "List ServiceAreas; filter by zip_code"
    roles: [Dispatcher, Clinician, ComplianceOfficer]
    code: 200
    input: ["zip_code?", "limit?", "offset?"]
    output: "ServiceArea[]"
    side_effects: []
  - method: GET
    path: "/service-areas/{id}"
    description: "Get a ServiceArea"
    roles: [Dispatcher, Clinician, ComplianceOfficer]
    code: 200
    input: []
    output: ServiceArea
    side_effects: []
  - method: POST
    path: "/service-areas/{id}/suspend"
    description: "Suspend a ServiceArea (stops new bookings in its ZIP)"
    roles: [Dispatcher]
    code: 200
    input: []
    output: ServiceArea
    side_effects: ["status ACTIVE -> SUSPENDED"]

  # ---- Clinician ----
  - method: POST
    path: "/clinicians"
    description: "Register a Clinician (VET or TECH)"
    roles: [Dispatcher]
    code: 201
    input: [full_name, clinician_role, "dea_number?", "dea_expires_on?"]
    output: Clinician
    side_effects: ["status=AVAILABLE"]
  - method: GET
    path: "/clinicians"
    description: "List Clinicians"
    roles: [Dispatcher, Clinician, ComplianceOfficer]
    code: 200
    input: ["clinician_role?", "limit?", "offset?"]
    output: "Clinician[]"
    side_effects: []
  - method: GET
    path: "/clinicians/{id}"
    description: "Get a Clinician"
    roles: [Dispatcher, Clinician, ComplianceOfficer]
    code: 200
    input: []
    output: Clinician
    side_effects: []
  - method: GET
    path: "/clinicians/{id}/controlled-logs"
    description: "List ControlledMedLog entries where this clinician was the administering or witnessing vet (DEA audit by vet)"
    roles: [ComplianceOfficer, Dispatcher]
    code: 200
    input: ["limit?", "offset?"]
    output: "ControlledMedLog[]"
    side_effects: []

  # ---- RollingClinic ----
  - method: POST
    path: "/rolling-clinics"
    description: "Create a RollingClinic vehicle with starting inventory"
    roles: [Dispatcher]
    code: 201
    input: [plate, controlled_stock_ml, vaccine_stock_count]
    output: RollingClinic
    side_effects: ["status=IN_DEPOT"]
  - method: GET
    path: "/rolling-clinics"
    description: "List RollingClinics"
    roles: [Dispatcher, Clinician, ComplianceOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: "RollingClinic[]"
    side_effects: []
  - method: GET
    path: "/rolling-clinics/{id}"
    description: "Get a RollingClinic (includes controlled_reconciled_ml)"
    roles: [Dispatcher, Clinician, ComplianceOfficer]
    code: 200
    input: []
    output: RollingClinic
    side_effects: []
  - method: PATCH
    path: "/rolling-clinics/{id}"
    description: "Set vehicle MAINTENANCE flag (status MAINTENANCE/IN_DEPOT toggle)"
    roles: [Dispatcher]
    code: 200
    input: [status, expected_rolling_clinic_version]
    output: RollingClinic
    side_effects: ["status -> MAINTENANCE or IN_DEPOT; increments RollingClinic.version by 1"]
  - method: GET
    path: "/rolling-clinics/{id}/controlled-logs"
    description: "List ControlledMedLog entries for a vehicle (DEA audit trail)"
    roles: [ComplianceOfficer, Dispatcher]
    code: 200
    input: ["limit?", "offset?"]
    output: "ControlledMedLog[]"
    side_effects: []

  # ---- Patient ----
  - method: POST
    path: "/patients"
    description: "Create a Patient (animal + owner)"
    roles: [Dispatcher]
    code: 201
    input: [owner_name, species, weight_kg, home_zip]
    output: Patient
    side_effects: []
  - method: GET
    path: "/patients/{id}"
    description: "Get a Patient"
    roles: [Dispatcher, Clinician, ComplianceOfficer]
    code: 200
    input: []
    output: Patient
    side_effects: []

  # ---- Appointment ----
  - method: POST
    path: "/appointments"
    description: "Create an Appointment (visit request)"
    roles: [Dispatcher]
    code: 201
    input: [patient_id, visit_type, requested_start, requested_end, "vaccine_doses?"]
    output: Appointment
    side_effects: ["status=REQUESTED; service_area_id resolved from patient.home_zip"]
  - method: GET
    path: "/appointments"
    description: "List Appointments; filter by patient_id or service_area_id"
    roles: [Dispatcher, Clinician, ComplianceOfficer]
    code: 200
    input: ["patient_id?", "service_area_id?", "limit?", "offset?"]
    output: "Appointment[]"
    side_effects: []
  - method: GET
    path: "/appointments/{id}"
    description: "Get an Appointment"
    roles: [Dispatcher, Clinician, ComplianceOfficer]
    code: 200
    input: []
    output: Appointment
    side_effects: []
  - method: POST
    path: "/appointments/{id}/arrive"
    description: "Clinician arrives on site (SCHEDULED -> IN_VISIT)"
    roles: [Clinician]
    code: 200
    input: []
    output: Appointment
    side_effects: ["RouteStop PLANNED -> ARRIVED; Clinician -> ON_ROUTE"]
  - method: POST
    path: "/appointments/{id}/complete-visit"
    description: "Close the clinical visit (IN_VISIT -> AWAITING_PAYMENT); finalizes invoice"
    roles: [Clinician]
    code: 200
    input: []
    output: Appointment
    side_effects: ["Estimate APPROVED -> INVOICED (invoice_total); vaccine stock decrement; RouteStop ARRIVED -> SERVICED; stop_count recompute"]
  - method: POST
    path: "/appointments/{id}/refer"
    description: "Refer the case to a hospital (-> REFERRED)"
    roles: [Clinician]
    code: 201
    input: [hospital_name, reason]
    output: Referral
    side_effects: ["Create Referral OPEN; RouteStop -> SKIPPED + re-sequence; Estimate -> VOID; Clinician -> AVAILABLE"]
  - method: POST
    path: "/appointments/{id}/cancel"
    description: "Cancel an appointment (-> CANCELLED)"
    roles: [Dispatcher]
    code: 200
    input: []
    output: Appointment
    side_effects: ["RouteStop PLANNED -> SKIPPED + re-sequence; Estimate -> VOID"]
  - method: POST
    path: "/appointments/{id}/euthanasia-log"
    description: "Append a controlled-med DISPENSE or WASTE entry (DEA log)"
    roles: [Clinician]
    code: 201
    input: [rolling_clinic_id, administering_vet_id, entry_type, amount_ml, "witness_vet_id?"]
    output: ControlledMedLog
    side_effects: ["Append ControlledMedLog; decrement RollingClinic.controlled_stock_ml by amount_ml"]
  - method: GET
    path: "/appointments/{id}/euthanasia-log"
    description: "List ControlledMedLog entries for an appointment"
    roles: [Clinician, ComplianceOfficer, Dispatcher]
    code: 200
    input: ["limit?", "offset?"]
    output: "ControlledMedLog[]"
    side_effects: []

  # ---- RouteDay / RouteStop ----
  - method: POST
    path: "/route-days"
    description: "Create a RouteDay (clinician + vehicle + date)"
    roles: [Dispatcher]
    code: 201
    input: [clinician_id, rolling_clinic_id, service_date]
    output: RouteDay
    side_effects: ["posture=OPEN; stop_count=0"]
  - method: GET
    path: "/route-days"
    description: "List RouteDays; filter by clinician_id or rolling_clinic_id"
    roles: [Dispatcher, Clinician, ComplianceOfficer]
    code: 200
    input: ["clinician_id?", "rolling_clinic_id?", "limit?", "offset?"]
    output: "RouteDay[]"
    side_effects: []
  - method: GET
    path: "/route-days/{id}"
    description: "Get a RouteDay (includes stop_count, posture)"
    roles: [Dispatcher, Clinician, ComplianceOfficer]
    code: 200
    input: []
    output: RouteDay
    side_effects: []
  - method: POST
    path: "/route-days/{routeDayId}/stops"
    description: "Book an appointment as a RouteStop (Appointment REQUESTED -> SCHEDULED)"
    roles: [Dispatcher]
    code: 201
    input: [appointment_id, window_start, window_end, expected_route_day_version]
    output: RouteStop
    side_effects: ["Create RouteStop PLANNED; Appointment -> SCHEDULED; stop_count recompute; sequence recompute; increments RouteDay.version by 1"]
  - method: GET
    path: "/route-days/{routeDayId}/stops"
    description: "List RouteStops on a RouteDay"
    roles: [Dispatcher, Clinician, ComplianceOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: "RouteStop[]"
    side_effects: []
  - method: GET
    path: "/route-stops"
    description: "List RouteStops; filter by appointment_id or route_day_id"
