            - "StaffMember.${coach_id}.valid_certification_count == 0"
            - "GroupSession.${gs_id}.assigned_staff == []"
            - "GroupSession.${gs_id}.compliant_coach_count == 0"
            - "GroupSession.${gs_id}.required_coach_count == 1"
            - "GroupSession.${gs_id}.staffing_status == UNDERSTAFFED"
            - "GroupSession.${gs_id}.session_status == SCHEDULED"
            - "Enrollment.${enr_id}.station_number == null"
