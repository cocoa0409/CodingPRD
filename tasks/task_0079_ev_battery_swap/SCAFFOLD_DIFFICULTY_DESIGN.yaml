scaffold_difficulty_design:

  # =========================================================================
  # Rule 1 — Dual-variant calculations across DIFFERENT entity domains
  # =========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: swap_billing_provisional_vs_final_on_swap_event
        grounds:
          - calculations.swap_billing
          - state_machines.Reservation.BOOKED_to_CHECKED_IN
          - state_machines.SwapEvent.INSTALLED_to_COMPLETED
          - entities.SwapEvent.fields.provisional_total_cents
          - entities.SwapEvent.fields.final_total_cents
        distinguishing_aspect: |
          Entity domain: SwapEvent (billing on a swap transaction). Provisional uses the held
          battery's soc_pct at check-in time; final uses the installed battery's soc_pct
          snapshotted at INSTALL phase — when the held battery has continued charging or been
          replaced via dispatch, these produce different cent totals on the same SwapEvent row.
        test_recipe:
          setup:
            - "Station S with 1 slot; BatteryModel BM rated 50 kWh; VehicleModel V; CompatibilityRule(V,BM)"
            - "Battery B at S, IDLE, soc_pct=80, BatteryModel BM"
            - "Vehicle Veh of model V, owner Member M (subscription_tier=NONE), installed_battery_id=B_old (a second IDLE battery at the same station with soc_pct=20)"
            - "ChargingSlot CS at S, tou_zone=SHOULDER"
            - "Reservation R(member=M, vehicle=Veh, station=S, slot=[t0+5m, t0+20m]) — soft-holds B"
          trigger:
            - "POST /reservations/{R}/check-in  -> SwapEvent SE created with phase=CHECKED_IN, provisional_total_cents written"
            - "Between check-in and install, Battery B charges further: PATCH it so soc_pct becomes 75 (simulating drift) [via finish-charging or admin path — for this test, use POST /batteries/{B}/finish-charging from a prior CHARGING setup, or accept the scaffold's pinned snapshot semantics: SwapEvent.incoming_soc_pct is taken at INSTALL]"
            - "POST /swap-events/{SE}/inspect body outgoing_soc_pct=20"
            - "POST /swap-events/{SE}/uninstall"
            - "POST /swap-events/{SE}/install body verify=true"
            - "POST /swap-events/{SE}/complete -> SE.final_total_cents written"
          assert:
            - "SwapEvent.provisional_total_cents == 2150  # base 500 + soc_diff round(30*25*1.20)=900 + tou_pass round(30*25*1.00)=750"
            - "SwapEvent.final_total_cents != SwapEvent.provisional_total_cents"
            - "SwapEvent.final_total_cents == 2013  # base 500 + round(27.5*25*1.20)=825 + round(27.5*25*1.00)=688"
            - "BillingRecord.amount_due_cents == SwapEvent.final_total_cents"

      - name: soh_assessment_grade_b_vs_retired_on_battery
        grounds:
          - calculations.soh_assessment_compute
          - calculations.soh_grade_tagging
          - state_machines.Battery.CHARGING_to_IDLE
          - state_machines.Battery.CHARGING_to_RETIRED
          - entities.Battery.fields.soh_grade
        distinguishing_aspect: |
          Entity domain: Battery (lifecycle grading on a single battery). Same finish-charging
          endpoint produces fundamentally different outputs depending on capacity test result:
          identical battery row, identical model, but capacity_test_kwh=45 yields IDLE+grade=B
          while capacity_test_kwh=30 yields auto-retire CHARGING->RETIRED — this is a
          different entity domain (Battery, not SwapEvent) from the swap_billing dual variant
          and exercises a different algorithm (weighted_scoring->threshold) than the pricing
          tier (tiered_pricing).
        test_recipe:
          setup:
            - "Station S; BatteryModel BM(rated_capacity_kwh=50, ev_soh_floor_pct=80)"
            - "Two batteries B1 and B2 at S, both status=CHARGING in two different slots"
          trigger:
            - "POST /batteries/{B1}/finish-charging body {soc_pct:95, capacity_test_kwh:45, internal_resistance_mohm:50, avg_temperature_c:25}"
            - "POST /batteries/{B2}/finish-charging body {soc_pct:95, capacity_test_kwh:30, internal_resistance_mohm:50, avg_temperature_c:25}"
          assert:
            - "Battery(B1).soh_pct == 90.00  # capacity_factor=90, no penalties"
            - "Battery(B1).soh_grade == 'A'  # 90.00 >= GRADE_A_FLOOR=90"
            - "Battery(B1).status == 'IDLE'"
            - "Battery(B2).soh_pct == 60.00  # capacity_factor=60"
            - "Battery(B2).soh_grade == 'RETIRED_EV'"
            - "Battery(B2).status == 'RETIRED'  # auto-transitioned by soh_grade_tagging"

  # =========================================================================
  # Rule 2 — Combinatorial formulas across DIFFERENT modes from {(a),(b),(c)}
  # =========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: soh_assessment_compute_multi_input_nonlinear
        grounds:
          - calculations.soh_assessment_compute
        distinguishing_aspect: |
          Mode (a): formula with 4 inputs (capacity_test_kwh, internal_resistance_mohm,
          avg_temperature_c, cycle_count_at_assessment) combined non-linearly — internal
          resistance uses max(0, x - baseline), temperature uses a conditional branch on
          which side of the [10, 35]C window x is, cycle penalty kicks in only above 500.
          The four penalties interact and clamp to [0, 100].
        test_recipe:
          setup:
            - "BatteryModel BM(rated_capacity_kwh=50, ev_soh_floor_pct=80)"
            - "Battery B at station S, status=CHARGING, cycle_count before finish=600"
          trigger:
            - "POST /batteries/{B}/finish-charging body {soc_pct:100, capacity_test_kwh:48, internal_resistance_mohm:70, avg_temperature_c:40, _note:cycle_count after increment = 601}"
          assert:
            - "Battery(B).cycle_count == 601"
            - "Battery(B).soh_pct == 93.25  # cap_factor=96; res_penalty=(70-50)*0.10=2.0; temp_penalty=(40-35)*0.05=0.25; cycle_penalty=max(0,601-500)*0.005=0.505; soh=96-2.0-0.25-0.505=93.245 rounded half-up to 93.25 at 2dp"
            - "Battery(B).soh_grade == 'A'  # 93.25 >= 90"

      - name: swap_billing_per_component_rounding_order
        grounds:
          - calculations.swap_billing
        distinguishing_aspect: |
          Mode (b): rounding order matters. The scaffold pins per-component round_half_up
          BEFORE summation, then deduction subtracted last with max(0, ...). Summing the
          raw products first and rounding once produces a different cent total — the scaffold
          explicitly chose per-component rounding.
        test_recipe:
          setup:
            - "Station S, slot with tou_zone=SHOULDER, BatteryModel rated 33.4 kWh, Member subscription_tier=NONE"
            - "Vehicle owning an outgoing battery soc_pct=10, held battery soc_pct=87"
          trigger:
            - "Run a full reservation+check-in+inspect+uninstall+install+complete cycle with outgoing_soc_pct=10, incoming_soc_pct=87"
          assert:
            - "energy_kwh = (87-10)/100 * 33.4 = 25.718"
            - "Per-component path: soc_diff = round(25.718 * 25 * 1.20) = round(771.54) = 772; tou_pass = round(25.718 * 25 * 1.00) = round(642.95) = 643; subtotal = 500 + 772 + 643 = 1915"
            - "SwapEvent.final_total_cents == 1915  # confirms per-component-first rounding order"
            - "(The single-round-of-sum alternative would yield round(500 + 771.54 + 642.95) = round(1914.49) = 1914, which the scaffold rejects)"

      - name: cascade_grading_circular_evaluation_order
        grounds:
          - calculations.cascade_grading
          - state_machines.Battery.RETIRED_to_RETIRED
          - state_machines.Battery.IDLE_to_RETIRED
          - entities.Battery.fields.recall_flag
          - entities.Battery.fields.cycle_count
          - entities.Battery.fields.cascade_stage
        distinguishing_aspect: |
          Mode (c): circular-looking dependency between recall_flag and cycle_count branches.
          A battery with cycle_count=800 (would normally go ENERGY_STORAGE) and recall_flag=true
          (forces END_OF_LIFE) — the formula pins evaluation order: recall_flag check FIRST,
          then cycle_count tiers. Without pinning, cycle_count-first would route to
          ENERGY_STORAGE then attempt to set END_OF_LIFE on recall and the system would have
          two answers. The scaffold pins recall-first.
        test_recipe:
          setup:
            - "Station S; BatteryModel BM; Battery B at S, IDLE, cycle_count=800"
          trigger:
            - "POST /recalls body {battery_model_code: BM, serial_numbers: [B.serial_number]} — this sets recall_flag=true, status=RETIRED, cascade_stage=END_OF_LIFE per recall transition"
          assert:
            - "Battery(B).recall_flag == true"
            - "Battery(B).status == 'RETIRED'"
            - "Battery(B).cascade_stage == 'END_OF_LIFE'  # recall-first wins over cycle_count=800 which alone would yield ENERGY_STORAGE"
            - "POST /batteries/{B}/grade-cascade returns 409 ERR_INVALID_STATE (cascade_stage already set; no re-grading)"

  # =========================================================================
  # Rule 3 — Non-linear state-machine shape on DIFFERENT entities
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: battery_idle_charging_idle_cycle
        grounds:
          - state_machines.Battery.IDLE_to_CHARGING
          - state_machines.Battery.CHARGING_to_IDLE
          - state_machines.Battery.IDLE_to_IN_USE
          - state_machines.Battery.IN_USE_to_IDLE
        distinguishing_aspect: |
          Cycle on entity Battery: IDLE -> CHARGING -> IDLE, and IDLE -> IN_USE -> IDLE.
          A battery may revisit IDLE arbitrarily many times. State machine shape is cyclic,
          not a linear pipeline.
        test_recipe:
          setup:
            - "Station S with slot CS; Battery B at S, IDLE"
          trigger:
            - "POST /batteries/{B}/start-charging body {charging_slot_id: CS}"
            - "POST /batteries/{B}/finish-charging body {soc_pct:100, capacity_test_kwh:50, internal_resistance_mohm:50, avg_temperature_c:25}"
            - "POST /batteries/{B}/start-charging body {charging_slot_id: CS}"
            - "POST /batteries/{B}/finish-charging body {soc_pct:100, capacity_test_kwh:50, internal_resistance_mohm:50, avg_temperature_c:25}"
          assert:
            - "Battery(B).status == 'IDLE' after both cycles"
            - "Battery(B).cycle_count == 2"
            - "Battery(B).soh_pct == 100.00  # capacity_factor=100, all penalties 0"

      - name: swap_event_install_uninstall_abort_compensating
        grounds:
          - state_machines.SwapEvent.CHECKED_IN_to_ABORTED
          - state_machines.SwapEvent.INSPECTED_to_UNINSTALLED
          - state_machines.SwapEvent.UNINSTALLED_to_INSTALLED
        distinguishing_aspect: |
          Branching fork-join on entity SwapEvent: from CHECKED_IN, two divergent branches
          exist — forward (INSPECT -> UNINSTALL -> INSTALL -> COMPLETE) or branch (ABORT,
          which has divergent compensating side-effect set: if already UNINSTALLED, re-install
          outgoing battery, restore Vehicle.installed_battery_id). Different entity (SwapEvent)
          from Rule 3 instance 1 (Battery).
        test_recipe:
          setup:
            - "Station S; CompatibilityRule(V,BM); Battery B_new IDLE at S; Battery B_old IN_USE in Vehicle Veh"
            - "Reservation R booked with held_battery_id=B_new; check-in performed; SwapEvent SE created"
          trigger:
            - "POST /swap-events/{SE}/inspect body {outgoing_soc_pct: 30}"
            - "POST /swap-events/{SE}/uninstall  -> Battery B_old IN_USE -> IDLE; Vehicle.installed_battery_id := null"
            - "POST /swap-events/{SE}/abort  -> compensating: B_old re-installed"
          assert:
            - "SwapEvent.phase == 'ABORTED'"
            - "Reservation.status == 'CANCELLED'"
            - "Battery(B_old).status == 'IN_USE'  # compensating re-install restored"
            - "Vehicle.installed_battery_id == B_old"
            - "Battery(B_new).status == 'IDLE'  # never installed"

  # =========================================================================
  # Rule 4 — Transitive cascade chains from DIFFERENT triggers
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: finish_charging_retires_then_cascade_grading_depth_3
        grounds:
          - state_machines.Battery.CHARGING_to_IDLE
          - state_machines.Battery.CHARGING_to_RETIRED
          - state_machines.Battery.RETIRED_to_RETIRED
          - calculations.soh_assessment_compute
          - calculations.soh_grade_tagging
          - calculations.cascade_grading
        distinguishing_aspect: |
          Depth-3 cascade from a single trigger:
            (1) POST /batteries/{B}/finish-charging mutates Battery (soc_pct, cycle_count)
              ↓ that mutation triggers
            (2) soh_assessment_compute writes Battery.soh_pct
              ↓ that mutation triggers
            (3) soh_grade_tagging reads Battery.soh_pct and writes Battery.soh_grade =
                RETIRED_EV, which itself triggers Battery.status := RETIRED.
          Each link is caused by the previous link, not by the original action. Distinct
          trigger from instance 2 below.
        test_recipe:
          setup:
            - "Station S, slot CS; BatteryModel BM(rated_capacity_kwh=50, ev_soh_floor_pct=80); Battery B at S, status=CHARGING in CS, cycle_count=500"
          trigger:
            - "POST /batteries/{B}/finish-charging body {soc_pct:95, capacity_test_kwh:30, internal_resistance_mohm:50, avg_temperature_c:25}"
          assert:
            - "Battery(B).cycle_count == 501  # link 1: cycle_count incremented"
            - "Battery(B).soh_pct == 60.00  # link 2: cap_factor=60, no penalties"
            - "Battery(B).soh_grade == 'RETIRED_EV'  # link 3 part a"
            - "Battery(B).status == 'RETIRED'  # link 3 part b: status flipped by soh_grade_tagging"
            - "ChargingSlot(CS).status == 'EMPTY'  # link 4 (depth-4 cleanup, still counts as one link from RETIRE)"

      - name: no_show_sweep_blocks_member_depth_2
        grounds:
          - state_machines.Reservation.BOOKED_to_NO_SHOW
          - entities.Member.fields.no_show_count_30d
          - entities.Member.fields.reservation_blocked_until
          - endpoints[POST /_sweep/no-show]
        distinguishing_aspect: |
          Depth-2 cascade from a DIFFERENT trigger (no-show sweep, not finish-charging):
            (1) POST /_sweep/no-show flips Reservation.status BOOKED -> NO_SHOW for expired
                reservations
              ↓ that mutation triggers
            (2) Member.no_show_count_30d recomputed; if >= 3, Member.reservation_blocked_until
                set to now() + 72h.
          Each link is caused by the previous link. Different trigger and different chain
          shape than instance 1.
        test_recipe:
          setup:
            - "Member M with 2 prior NO_SHOW reservations in the last 30 days"
            - "Reservation R3 BOOKED with slot_end_at = t0+15m"
          trigger:
            - "POST /_clock/advance body {to_iso: t0+16m}"
            - "POST /_sweep/no-show"
          assert:
            - "Reservation(R3).status == 'NO_SHOW'  # link 1"
            - "Member(M).no_show_count_30d == 3  # link 2 part a"
            - "Member(M).reservation_blocked_until == t0+16m + 72h  # link 2 part b"
            - "POST /reservations as M now returns 403 ERR_MEMBER_BLOCKED"

  # =========================================================================
  # Rule 5 — Validation priority conflicts across DIFFERENT error-category pairs
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_safety_recall_on_idle_battery
        grounds:
          - validations[priority=4]
          - validations[priority=6]
        distinguishing_aspect: |
          Error-category pair: `state` (priority 4) vs `business_safety` (priority 6).
          A battery that is RETIRED and recall_flag=true triggers both state-error
          (cannot start-charging from RETIRED) AND recall-error (recall blocks). Priority
          ordering says state wins → caller sees ERR_INVALID_STATE, not ERR_BATTERY_RECALLED.
        test_recipe:
          setup:
            - "Battery B in status=RETIRED with recall_flag=true (use POST /recalls to set both)"
            - "ChargingSlot CS at Battery's station, EMPTY"
          trigger:
            - "POST /batteries/{B}/start-charging body {charging_slot_id: CS}"
          assert:
            - "Response code == 409"
            - "error_id == 'ERR_INVALID_STATE'  # state check (priority 4) fires before recall check (priority 6)"

      - name: business_temporal_vs_business_constraint_overlap_vs_no_battery
        grounds:
          - validations[priority=10]
          - validations[priority=12]
        distinguishing_aspect: |
          Error-category pair: `business_temporal` (priority 10) vs `business_constraint`
          (priority 12). A member-overlap reservation request where the station ALSO has no
          compatible IDLE battery triggers both — priority 10 (overlap) wins. Different
          pair than instance 1 (state vs business_safety).
        test_recipe:
          setup:
            - "Member M already has Reservation R1 BOOKED at Station S with slot [t0+10m, t0+25m]"
            - "Station S has 0 IDLE compatible batteries"
          trigger:
            - "POST /reservations body {member_id: M, vehicle_id: Veh, station_id: S, slot_start_at: t0+15m, slot_end_at: t0+30m}"
          assert:
            - "Response code == 409"
            - "error_id == 'ERR_RESERVATION_OVERLAP_MEMBER'  # priority 10 fires before priority 12"

  # =========================================================================
  # Rule 6 — Boundary-precision checks on DIFFERENT metrics/endpoints
  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: soh_grade_boundary_exact_80_pct
        grounds:
          - calculations.soh_grade_tagging
          - entities.Battery.fields.soh_grade
          - endpoints[POST /batteries/{id}/finish-charging]
        distinguishing_aspect: |
          Numeric threshold on the soh_pct metric: at exactly 80.00 pct (== ev_soh_floor_pct),
          grade is B (not RETIRED_EV). The spec uses >= for the floor. Endpoint:
          POST /batteries/{id}/finish-charging.
        test_recipe:
          setup:
            - "BatteryModel BM(rated_capacity_kwh=50, ev_soh_floor_pct=80); Battery B status=CHARGING"
          trigger:
            - "POST /batteries/{B}/finish-charging body {soc_pct:95, capacity_test_kwh:40, internal_resistance_mohm:50, avg_temperature_c:25}"
          assert:
            - "Battery(B).soh_pct == 80.00  # cap_factor=80, no penalties"
            - "Battery(B).soh_grade == 'B'  # exactly at boundary => B"
            - "Battery(B).status == 'IDLE'  # NOT auto-retired"

      - name: station_capacity_empty_set_no_compatible_battery
        grounds:
          - validations[priority=12]
          - endpoints[POST /reservations]
        distinguishing_aspect: |
          Empty-set edge: empty candidate pool yields 409. Different metric (collection
          emptiness vs numeric soh threshold) and different endpoint (POST /reservations)
          than instance 1.
        test_recipe:
          setup:
            - "Station S with total_slots=2; zero IDLE batteries at S (all are CHARGING or IN_USE)"
            - "Member M, Vehicle Veh of compatible model"
          trigger:
            - "POST /reservations body {member_id: M, vehicle_id: Veh, station_id: S, slot_start_at: t0+10m, slot_end_at: t0+25m}"
          assert:
            - "Response code == 409"
            - "error_id == 'ERR_NO_COMPATIBLE_BATTERY'"

  # =========================================================================
  # Rule 7 — Cross-entity state dependencies across DIFFERENT entity pairs
  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: reservation_check_in_depends_on_battery_status
        grounds:
          - state_machines.Reservation.BOOKED_to_CHECKED_IN
          - state_machines.Battery
          - entities.Reservation.fields.held_battery_id
        distinguishing_aspect: |
          Entity pair: Reservation -> Battery. Reservation cannot transition BOOKED ->
          CHECKED_IN if held_battery_id's Battery.status != IDLE (e.g., became FAULT after
          hold). The valid transition on Reservation depends on the current state of a
          DIFFERENT entity (Battery).
        test_recipe:
          setup:
            - "Reservation R BOOKED with held_battery_id=B; B at status=IDLE initially"
            - "POST /batteries/{B}/report-fault → Battery.status := FAULT"
            - "Advance clock to inside [slot_start, slot_end)"
          trigger:
            - "POST /reservations/{R}/check-in"
          assert:
            - "Response code == 409"
            - "error_id == 'ERR_INVALID_STATE'  # held battery not IDLE"
            - "Reservation(R).status == 'BOOKED'  # unchanged"

      - name: dispatch_dispatch_depends_on_battery_station
        grounds:
          - state_machines.DispatchOrder.REQUESTED_to_IN_TRANSIT
          - state_machines.Battery.IDLE_to_IN_TRANSIT
          - validations[priority=17]
        distinguishing_aspect: |
          Entity pair: DispatchOrder -> Battery. Different pair from instance 1
          (Reservation->Battery). DispatchOrder.dispatch transition requires Battery.status
          == IDLE AND Battery.station_id == source_station_id. If the battery was moved
          (e.g., another dispatch put it in transit, or a swap put it IN_USE), the dispatch
          transition is rejected.
        test_recipe:
          setup:
            - "Station S_src; Station S_dst; Battery B at S_src, status=IDLE"
            - "DispatchOrder D1 REQUESTED(source=S_src, dest=S_dst, battery=B)"
            - "POST /batteries/{B}/report-fault → Battery.status := FAULT"
          trigger:
            - "POST /dispatch-orders/{D1}/dispatch"
          assert:
            - "Response code == 409"
            - "error_id == 'ERR_BATTERY_NOT_IDLE'"
            - "DispatchOrder(D1).status == 'REQUESTED'"
            - "Battery(B).status == 'FAULT'"

  # =========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across DIFFERENT interval semantics
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: member_overlap_half_open_touching_ok
        grounds:
          - validations[priority=10]
          - entities.Reservation
          - endpoints[POST /reservations]
        distinguishing_aspect: |
          Interval semantics: half-open [start, end). On the Member resource, touching
          boundaries are explicitly allowed. R1=[t+10m, t+25m) and R2=[t+25m, t+40m) for
          same member DO NOT conflict. R3=[t+24m, t+39m) DOES conflict.
        test_recipe:
          setup:
            - "Member M; Vehicle Veh; Station S with abundant compatible IDLE batteries"
            - "Reservation R1 BOOKED [t0+10m, t0+25m]"
          trigger:
            - "POST /reservations body slot=[t0+25m, t0+40m]  # touching"
            - "POST /reservations body slot=[t0+24m, t0+39m]  # strict overlap"
          assert:
            - "First call: 201 created"
            - "Second call: 409 ERR_RESERVATION_OVERLAP_MEMBER"

      - name: station_capacity_aggregate_with_touching_allowed
        grounds:
          - validations[priority=11]
          - entities.Station.fields.total_slots
          - endpoints[POST /reservations]
        distinguishing_aspect: |
          Interval semantics: aggregate-capacity overlap on a DIFFERENT resource (Station,
          not Member) with a DIFFERENT geometry — Station rejects a new reservation when
          the count of strictly-overlapping existing reservations + the new one exceeds
          total_slots. Touching boundaries explicitly DO NOT count as overlap (different
          geometry than half-open exclusive end). Two reservations touching at t+25m are
          allowed even at total_slots=1.
        test_recipe:
          setup:
            - "Station S with total_slots=1; abundant compatible IDLE batteries"
            - "Member M1 with Reservation R1 BOOKED at S, slot=[t0+10m, t0+25m]"
          trigger:
            - "POST /reservations as Member M2, slot=[t0+25m, t0+40m]  # touching"
            - "POST /reservations as Member M3, slot=[t0+20m, t0+35m]  # strict overlap"
          assert:
            - "First call: 201 created (touching allowed at station even at total_slots=1)"
            - "Second call: 409 ERR_STATION_CAPACITY_FULL"

  # =========================================================================
  # Rule 9 — Compensating-action invariants across DIFFERENT conserved quantities
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: swap_abort_preserves_station_idle_count
        grounds:
          - state_machines.SwapEvent.CHECKED_IN_to_ABORTED
          - state_machines.SwapEvent.INSPECTED_to_UNINSTALLED
          - entities.Station.fields.idle_battery_count
        distinguishing_aspect: |
          Conserved quantity: Station.idle_battery_count + (count of batteries IN_USE at
          this station) + (count of batteries CHARGING at this station) + (count of
          batteries IN_TRANSIT-from-this-station). After uninstall (idle += 1) then abort
          (compensating re-install: idle -= 1), Station.idle_battery_count returns to its
          pre-swap value.
        test_recipe:
          setup:
            - "Station S; Battery B_old IN_USE in Vehicle Veh; Battery B_new IDLE at S"
            - "Record initial Station.idle_battery_count == K (e.g., K=5 with 5 IDLE incl. B_new)"
            - "Reservation R BOOKED with held=B_new; check-in performed; SwapEvent SE"
          trigger:
            - "POST /swap-events/{SE}/inspect body {outgoing_soc_pct: 30}"
            - "POST /swap-events/{SE}/uninstall  # idle += 1, now K+1"
            - "POST /swap-events/{SE}/abort     # compensating: re-install B_old, idle -= 1"
          assert:
            - "After uninstall: Station(S).idle_battery_count == K + 1"
            - "After abort: Station(S).idle_battery_count == K  # invariant restored"
            - "SwapEvent.phase == 'ABORTED'"
            - "Battery(B_old).status == 'IN_USE'"

      - name: refund_full_preserves_member_subscription_credits
        grounds:
          - state_machines.BillingRecord.PAID_to_REFUNDED
          - entities.Member.fields.subscription_swaps_remaining
          - entities.BillingRecord.fields.subscription_deduction_cents
        distinguishing_aspect: |
          Different conserved quantity (Member.subscription_swaps_remaining, an integer
          credit balance, not a Station inventory count). When a swap consumes a credit
          (subscription_swaps_remaining -= 1) and is later fully refunded, the
          compensating action restores the credit (+= 1). Total credits granted to the
          member across the lifetime of all settled+refunded swaps == credits_remaining +
          credits_consumed_for_unrefunded_swaps.
        test_recipe:
          setup:
            - "Member M (subscription_tier=BASIC, subscription_swaps_remaining=3 initially)"
            - "Complete a swap end-to-end (consumes 1 credit; M.subscription_swaps_remaining becomes 2)"
            - "BillingRecord BR PAID with subscription_deduction_cents == 500, amount_due_cents > 0"
          trigger:
            - "POST /billing-records/{BR}/refund body {refund_cents: BR.amount_due_cents}  # full refund"
          assert:
            - "BillingRecord(BR).payment_status == 'REFUNDED'"
            - "BillingRecord(BR).refund_cents == BR.amount_due_cents"
            - "Member(M).subscription_swaps_remaining == 3  # invariant: credit restored to pre-swap value"
