# =============================================================================
# PRD Benchmark Seed Tables — task_3025_one_one_donation_matching_giving_partner_distribution
# Scenario: One-for-One Donation Matching & Giving Partner Distribution (Bombas)
# =============================================================================

scenario: |
  One-for-One Donation Matching & Giving Partner Distribution (Bombas): donation liability accrual per item sold with product-category matching rules, giving partner vetting including shelters and outreach organizations with capacity and need profiles, donation-specific product design differing from retail goods, allocation of donation inventory across partners by geography, season and demand, distribution logistics with partner receipt confirmation and impact reporting, marketing claim substantiation tying stated donation counts to shipped units, returns and exchanges that do not reverse the donation obligation, annual impact audit and partner performance review

domain_name: one-for-one-donation-matching-giving-partner-distribution

# Every business path is rooted at the donation-matching control plane /impact-program;
# entity collections sit directly under it (the GivingPartner collection segment
# is `giving-partners`). Test-driving endpoints stay at the server root under
# the `/_` namespace.
api_prefix: /impact-program

complexity_profile:
  primary_archetype: Quota / allocation
  secondary_archetype: Compliance / audit
  complexity_layers:
    - dual-variant-calculation
    - cascading-side-effects
    - scheduled-deferred-actions
    - optimistic-concurrency
    - conditional-feature-flags
    - selector-policy
    - derived-field-reconciliation
    - pagination-with-filtering
  entity_topology: flat          # peer entities joined by foreign keys; cross-cutting graph edges among 5 of them
  state_machine_shape: compound  # 9 of 13 machines are non-linear (cycles, fork-join, parallel dimensions, self-loops)
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - many_to_many      # MarketingClaim ↔ GivingPartner ↔ DonationAllocation coupling
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# Table 1 (SKILL §1.1): Entity-Relationship Table — 14 entities
# =============================================================================
entities:

  - name: GivingPartner
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Registered legal name of the partner organization" }
      - { name: partner_type, type: enum, source: input, description: "HOMELESS_SHELTER | DOMESTIC_VIOLENCE_SHELTER | YOUTH_OUTREACH | VETERAN_OUTREACH | DISASTER_RELIEF | COMMUNITY_HEALTH_CLINIC" }
      - { name: operating_region, type: enum, source: input, description: "NORTHEAST | SOUTHEAST | MIDWEST | SOUTHWEST | WEST" }
      - { name: operating_state_code, type: string, source: input, description: "Two-letter state code of the partner's primary facility" }
      - { name: service_radius_miles, type: integer, source: input, default: 50, description: "Radius the partner serves; used by the geographic allocation filter" }
      - { name: registry_id, type: string, source: input, description: "State charity registry identifier" }
      - { name: ein, type: string, source: input, description: "Nine-digit federal employer identification number" }
      - { name: founded_year, type: integer, source: input, description: "Year the organization was founded" }
      - { name: unduplicated_recipients_per_facility, type: integer, source: input, description: "Average unduplicated recipients served per facility per year" }
      - { name: need_tier, type: enum, source: input, description: "CRITICAL | HIGH | MODERATE | LOW — declared need band, scored by calculations.need_score" }
      - { name: registry_verified, type: computed, description: "true when registry_id matches ^[A-Z]{2}-CHR-[0-9]{6}$ and ein is nine digits" }
      - { name: status, type: enum, source: system, description: "CANDIDATE | VETTING | APPROVED | SUSPENDED | REJECTED | REJECTED_FINAL | INACTIVE" }
      - { name: vetting_round, type: integer, source: system, default: 0, description: "Number of vetting rounds opened so far" }
      - { name: latest_vetting_round_id, type: string, source: computed, description: "id of the GivingPartnerVetting row with the highest round_number for this partner; null before the first round exists" }
      - { name: total_rejections, type: integer, source: system, default: 0, description: "Lifetime rejection count; two rejections make the rejection final" }
      - { name: need_score, type: integer, source: computed, description: "0-100 composite need score from calculations.need_score; required to be >= 40 for approval" }
      - { name: capacity_utilization_units, type: integer, source: computed, description: "Sum of allocated_units over this partner's non-terminal DonationAllocation rows with allocation_kind == ALLOCATION" }
      - { name: impact_units_total, type: integer, source: computed, description: "Sum of impact_units_confirmed over distributions whose DonationAllocation.giving_partner_id == this partner.id and allocation_kind == ALLOCATION" }
      - { name: impact_units_retail_equivalent, type: integer, source: computed, description: "Sum of retail_equivalent_units_sold over DonationProductLine rows attributed to this partner" }
      - { name: avg_distribution_completion_days, type: number, source: computed, description: "Mean of (received_at - shipped_at) in whole days over this partner's RECEIVED and COMPLETED distributions; 2 decimals round_half_up; null when none" }
      - { name: claim_attributed_units, type: integer, source: computed, description: "Sum of allocated_units over this partner's season allocations in status APPROVED, SHIPPED, PARTIALLY_RECEIVED or RECEIVED, minus the sum over REVERSAL rows; never below 0" }
      - { name: attributed_percentage, type: number, source: computed, description: "claim_attributed_units as a share of the season total, 1 decimal round_half_up; the rounding residual is folded into the last partner by (claim_attributed_units DESC, created_at ASC)" }
      - { name: entrance_returns_units, type: integer, source: computed, description: "Sum of requested_units over ReturnRequest rows whose line's product is attributed to this partner and which reached CREDITED or EXCHANGED" }
      - { name: partner_performance_grade, type: enum, source: computed, description: "EXEMPLARY | SATISFACTORY | MONITORED | PROBATION; null until the first FINALIZED ImpactAudit of kind PARTNER_PERFORMANCE" }
      - { name: last_vetted_at, type: datetime, source: system, description: "UTC instant of the most recent completed vetting round" }

  - name: PartnerCapacityProfile
    parent: GivingPartner
    common_fields: true
    fields:
      - { name: partner_id, type: string, source: system, description: "FK -> GivingPartner.id; owning giving partner" }
      - { name: season_code, type: string, source: input, description: "Season this profile governs, matching ImpactSeason.season_code" }
      - { name: max_allocatable_units, type: integer, source: input, description: "Capacity ceiling in units; committed units may never exceed it" }
      - { name: reserved_units, type: integer, source: computed, description: "Units held by REVERSAL allocations forecasting a future return into the next season" }
      - { name: committed_units, type: integer, source: computed, description: "Sum of allocated_units over ALLOCATION rows in status APPROVED, SHIPPED, PARTIALLY_RECEIVED or RECEIVED for this profile's season" }
      - { name: capacity_utilization_units, type: integer, source: computed, description: "committed_units + reserved_units minus impact_units_confirmed of the profile's season for this partner; never below 0" }
      - { name: effective_from, type: datetime, source: input, description: "UTC instant the profile's capacity becomes readable" }
      - { name: effective_to, type: datetime, source: input, description: "UTC instant the profile stops being selectable" }
      - { name: status, type: enum, source: system, description: "ACTIVE | EXHAUSTED | LOCKED | SUPERSEDED" }

  - name: GivingPartnerVetting
    parent: GivingPartner
    common_fields: false
    fields:
      - { name: partner_id, type: string, source: system, description: "FK -> GivingPartner.id; partner this round audits" }
      - { name: round_number, type: integer, source: system, description: "1-based round sequence; equals partner.vetting_round after the round is opened" }
      - { name: outcome, type: enum, source: input, description: "REQUESTED | DOCUMENTS_SUBMITTED | EVALUATING | APPROVED | REJECTED | EXPIRED" }
      - { name: registry_check_passed, type: boolean, source: input, description: "State charity registry lookup result for this round" }
      - { name: tax_check_passed, type: boolean, source: input, description: "501(c)(3) determination-letter check result for this round" }
      - { name: on_site_check_passed, type: boolean, source: input, description: "Facility inspection result for this round" }
      - { name: capacity_check_passed, type: boolean, source: input, description: "Whether the declared capacity was verified against facility records" }
      - { name: need_verification_points, type: integer, source: input, description: "0-5 verification points; 4 or more lets this round override the declared need_tier by one band" }
      - { name: need_verification_evidence, type: string, source: input, description: "Free-text evidence reference supporting need_verification_points" }
      - { name: valid_until, type: datetime, source: input, description: "UTC instant the round's finding expires" }
      - { name: outcome_message, type: string, source: input, description: "Reviewer note recorded with the round outcome" }

  - name: DonationProduct
    parent: null
    common_fields: true
    fields:
      - { name: product_name, type: string, source: input, description: "Customer-facing product family name" }
      - { name: product_kind, type: enum, source: input, description: "ATHLETIC_SOCK | APPAREL_TOP | UNDERGARMENT | SLEEP_ACCESSORY" }
      - { name: design_channel, type: enum, source: input, description: "DONATION_ONLY (designed for donation, never listed at retail) | DUAL_CHANNEL (sold at retail, donated 1:1)" }
      - { name: design_weight_score, type: integer, source: computed, description: "0-100 donation-suitability score from calculations.product_attribute_weight" }
      - { name: obligation_model, type: enum, source: input, description: "AT_SALE (obligation attaches when a line is activated) | AT_VESTING (obligation attaches when the donation variant is created)" }
      - { name: approved_donation_ratio_units, type: integer, source: input, description: "Units of donation obligation per unit sold; integer >= 1" }
      - { name: retail_price_cents, type: integer, source: input, description: "Retail list price in cents" }
      - { name: unit_cost_cents, type: integer, source: input, description: "Manufacturing cost in cents, used by calculations.donation_unit_cost" }
      - { name: is_reusable, type: boolean, source: input, description: "Whether the item is intended for repeated use in partner programs" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | RETIRED | ARCHIVED" }
      - { name: active_season_code, type: string, source: computed, description: "season_code of the ImpactSeason whose status is FROZEN and which contains the clock; null when none" }
      - { name: obligation_units_total, type: integer, source: computed, description: "Sum of obligation_units over this product's DonationLiability rows" }

  - name: DonationProductLine
    parent: DonationProduct
    common_fields: true
    fields:
      - { name: donation_product_id, type: string, source: system, description: "FK -> DonationProduct.id; owning donation product" }
      - { name: gtin, type: string, source: input, description: "Global trade item number of the sellable variant" }
      - { name: unit_size_label, type: string, source: input, description: "Display size, e.g. S | M | L | 4-pack" }
      - { name: is_essential_good, type: boolean, source: input, description: "Whether the line qualifies as an essential good for weighted allocation" }
      - { name: donation_eligible, type: boolean, source: input, description: "Whether the line accrues a donation obligation" }
      - { name: obligation_units, type: integer, source: computed, description: "Units of obligation this line carries; 0 when donation_eligible is false" }
      - { name: unit_obligation_cost_cents, type: integer, source: computed, description: "Per-unit liability cents from calculations.donation_unit_cost" }
      - { name: design_variant_code, type: string, source: computed, description: "donation_specific | retail_dual | none, chosen by calculations.design_variant_selection" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | COMMITTED | RETIRED | VESTED | SUNSET | ARCHIVED" }

  - name: DonationLiability
    parent: null
    common_fields: true
    fields:
      - { name: donation_product_id, type: string, source: system, description: "FK -> DonationProduct.id; product this liability accrues for" }
      - { name: impact_season_id, type: string, source: system, description: "FK -> ImpactSeason.id; season the accrual is bucketed into" }
      - { name: donation_liability_units, type: integer, source: computed, description: "The reporting obligation for the season; equals final_liability_units once it is frozen" }
      - { name: final_liability_units, type: integer, source: computed, description: "Units of SalesOrderLine rows whose SalesOrder.status is PAID or DONATION_SATISFIED in the season, per calculations.final_liability_accrual" }
      - { name: provisional_liability_units, type: integer, source: computed, description: "Units of the same line set plus non-terminal orders, per calculations.provisional_liability_accrual" }
      - { name: obligation_units, type: integer, source: computed, description: "Units attached by DonationProductLine.obligation_units at vesting" }
      - { name: accrued_obligation_cents, type: integer, source: computed, description: "obligation_units * unit_obligation_cost_cents, held at the value frozen at season freezing" }
      - { name: donation_cost_cents, type: integer, source: computed, description: "Sum of the per-line rounded donation costs from calculations.donation_credit_ledger; recomputed on every line settle and order payment" }
      - { name: donation_credit_units, type: integer, source: computed, description: "Sum of quantity over the same line set as donation_cost_cents; always equals final_liability_units once payment has settled" }
      - { name: frozen_units, type: integer, source: computed, description: "Snapshot of provisional_liability_units at the season's freezes_at instant; re-snapshotted at each ImpactAudit finalization" }
      - { name: required_stated_units, type: integer, source: computed, description: "Sum of stated_donation_units * winback_multiplier over this product's claims for the season" }
      - { name: carried_in_units, type: integer, source: computed, description: "Make-up units inherited from the season identified by carry_from_season_code" }
      - { name: carried_out_units, type: integer, source: computed, description: "Make-up units the liability passes to the next season when its own season closes" }
      - { name: status, type: enum, source: system, description: "ACCUMULATING | FROZEN | CARRIED | AUDIT_LOCKED | CLOSED" }
      - { name: freeze_recorded_at, type: datetime, source: system, description: "UTC instant frozen_units was last written" }

  - name: DonationAllocation
    parent: null
    common_fields: true
    fields:
      - { name: giving_partner_id, type: string, source: system, description: "FK -> GivingPartner.id; partner receiving (or debited by) this allocation" }
      - { name: impact_season_id, type: string, source: system, description: "FK -> ImpactSeason.id; season the allocation belongs to" }
      - { name: donation_product_id, type: string, source: system, description: "FK -> DonationProduct.id; product allocated" }
      - { name: donation_liability_id, type: string, source: system, description: "FK -> DonationLiability.id; liability bucket this allocation commits against" }
      - { name: claim_id, type: string, source: input, description: "FK -> MarketingClaim.id; benefit event that justifies this allocation" }
      - { name: allocation_kind, type: enum, source: system, description: "ALLOCATION (benefit, debits capacity) | REVERSAL (make-up, credits capacity and forecasts the next season)" }
      - { name: allocated_units, type: integer, source: input, description: "Units committed; integer >= 1" }
      - { name: priority_tier, type: enum, source: input, description: "EMERGENCY | CRITICAL | HIGH | MODERATE" }
      - { name: rank_score, type: integer, source: computed, description: "Deterministic allocation ordering score from calculations.partner_rank_score" }
      - { name: status, type: enum, source: system, description: "PENDING_ALLOCATION | APPROVED | SHIPPED | PARTIALLY_RECEIVED | RECEIVED | CANCELLED | REVERSED" }

  - name: DonationDistribution
    parent: DonationAllocation
    common_fields: true
    fields:
      - { name: allocation_id, type: string, source: system, description: "FK -> DonationAllocation.id; allocation being shipped" }
      - { name: shipped_units, type: integer, source: input, description: "Units on the truck" }
      - { name: received_units, type: integer, source: computed, description: "Units confirmed by partner receipt" }
      - { name: impact_units_confirmed, type: integer, source: computed, description: "Units credited to the partner's impact total; equals received_units" }
      - { name: discrepancy_units, type: integer, source: computed, description: "shipped_units - received_units after the reconciliation window" }
      - { name: shipment_reference, type: string, source: input, description: "Carrier tracking reference" }
      - { name: carrier_code, type: string, source: input, description: "Carrier identifier" }
      - { name: shipped_at, type: datetime, source: system, description: "UTC instant the distribution left the warehouse" }
      - { name: received_at, type: datetime, source: system, description: "UTC instant the partner confirmed receipt" }
      - { name: exception_reason, type: string, source: input, description: "Reason recorded when the distribution is written off" }
      - { name: status, type: enum, source: system, description: "SHIPPED | PARTIALLY_RECEIVED | RECEIVED | COMPLETED | DISCREPANCY_CLAIMED | WRITTEN_OFF | VOIDED" }

  - name: ImpactSeason
    parent: null
    common_fields: true
    fields:
      - { name: season_code, type: string, source: input, description: "Season identifier, e.g. 2026-Q3" }
      - { name: starts_at, type: datetime, source: input, description: "UTC instant the season opens" }
      - { name: ends_at, type: datetime, source: input, description: "UTC instant the season calendar ends" }
      - { name: freezes_at, type: datetime, source: input, description: "UTC instant the season's obligation snapshot is taken" }
      - { name: liability_carry_in_units, type: integer, source: computed, description: "Sum of carried_in_units over this season's DonationLiability rows" }
      - { name: claim_frozen_units_total, type: integer, source: computed, description: "Sum of frozen_units over this season's DonationLiability rows" }
      - { name: opening_carry_obligation_cents, type: integer, source: computed, description: "Sum of accrued_obligation_cents over this season's liabilities in status CARRIED" }
      - { name: requested_season_code, type: string, source: input, default: null, description: "Season the operator asked to set the frozen state to; null means the season containing the current clock" }
      - { name: is_final, type: boolean, source: input, default: false, description: "Whether the frozen-state request is the final freeze of the season" }
      - { name: attributed_units_total, type: integer, source: computed, description: "Sum of claim_attributed_units over the partners whose status is APPROVED at the instant of computation" }
      - { name: attributed_percentage_total, type: number, source: computed, description: "Sum of GivingPartner.attributed_percentage over the rolled-up pool; pinned to exactly 100.0 by folding the residual into the last partner" }
      - { name: total_shipped_units, type: integer, source: computed, description: "Sum of shipped_units over this season's distributions" }
      - { name: total_received_units, type: integer, source: computed, description: "Sum of received_units over this season's distributions" }
      - { name: liability_reconciliation_delta, type: integer, source: computed, description: "total_shipped_units - claim_frozen_units_total; negative means claims understated shipped units" }
      - { name: status, type: enum, source: system, description: "PLANNED | OPEN | FROZEN | CLOSED | FINALIZED" }

  - name: MarketingClaim
    parent: null
    common_fields: true
    fields:
      - { name: donation_product_id, type: string, source: system, description: "FK -> DonationProduct.id; product the claim is about" }
      - { name: partner_id, type: string, source: input, description: "FK -> GivingPartner.id; named beneficiary partner" }
      - { name: stated_donation_units, type: integer, source: input, description: "Units the public claim promises" }
      - { name: stated_ratio_text, type: string, source: input, description: "Customer-facing ratio text, e.g. 'one purchased = one donated'" }
      - { name: winback_multiplier, type: integer, source: input, default: 1, description: "1 for a plain one-for-one claim; greater than 1 for 'buy one, we give N' claims" }
      - { name: stated_reference_period, type: enum, source: input, description: "CALENDAR_YEAR | ROLLING_TWELVE_MONTHS | SEASON" }
      - { name: substantiated_donation_units, type: integer, source: computed, description: "Shipped plus capacity-committed units available to the claim, per calculations.claim_substantiation_shortfall" }
      - { name: substantiated_ratio_value, type: number, source: computed, description: "substantiated_donation_units / stated_donation_units, 4 decimals round_half_up" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBSTANTIATED | OVERSTATED | UNSUBSTANTIATED | SEASON_RESTRICTED | REVOKED | EXPIRED" }

  - name: SalesOrder
    parent: null
    common_fields: true
    fields:
      - { name: order_number, type: string, source: input, description: "Human order reference; unique" }
      - { name: channel, type: enum, source: input, description: "RETAIL_POS | RETAIL_ECOM" }
      - { name: status, type: enum, source: system, description: "CREATED | PAID | DONATION_SATISFIED | PARTIALLY_REFUNDED | REFUNDED | CANCELLED" }
      - { name: fulfillment_status, type: enum, source: system, description: "PLACED | PICKED | SHIPPED | DELIVERED | CANCELLED — independent state dimension" }
      - { name: ordered_units, type: integer, source: computed, description: "Sum of quantity over this order's lines" }
      - { name: returned_units, type: integer, source: computed, description: "Sum of requested_units over this order's lines' ReturnRequest rows in status CREDITED" }
      - { name: fulfilled_units, type: integer, source: computed, description: "Sum of quantity over this order's lines whose status is EXEMPTED or whose fulfillment completed" }
      - { name: refunded_cents, type: integer, source: computed, description: "Sum of refund_amount_cents over this order's CREDITED return requests" }
      - { name: placed_at, type: datetime, source: system, description: "UTC instant the order was placed" }
      - { name: paid_at, type: datetime, source: system, description: "UTC instant payment settled; starts the return window" }

  - name: SalesOrderLine
    parent: SalesOrder
    common_fields: true
    fields:
      - { name: sales_order_id, type: string, source: system, description: "FK -> SalesOrder.id; owning sales order" }
      - { name: donation_product_id, type: string, source: system, description: "FK -> DonationProduct.id; product on this line" }
      - { name: donation_product_line_id, type: string, source: input, description: "FK -> DonationProductLine.id; the purchased variant" }
      - { name: quantity, type: integer, source: input, description: "Units purchased; integer >= 1" }
      - { name: unit_price_cents, type: integer, source: input, description: "Unit price charged in cents" }
      - { name: line_discount_cents, type: integer, source: input, default: 0, description: "Discount applied to the line; used by calculations.return_refund_amount for proportional allocation" }
      - { name: return_window_days, type: integer, source: system, default: 30, description: "Days after paid_at during which a return may be requested" }
      - { name: obligated_units, type: integer, source: computed, description: "Donation obligation the line created at sale; never reduced by a return" }
      - { name: status, type: enum, source: system, description: "OPEN | RETURN_REQUESTED | RETURN_APPROVED | RETURNED_CREDITED | EXCHANGED_REPLACED | EXEMPTED" }

  - name: ReturnRequest
    parent: SalesOrderLine
    common_fields: true
    fields:
      - { name: sales_order_line_id, type: string, source: system, description: "FK -> SalesOrderLine.id; line being returned" }
      - { name: donation_liability_id, type: string, source: system, description: "FK -> DonationLiability.id; liability of the original sale, which this return must not reverse" }
      - { name: request_reason, type: enum, source: input, description: "SIZE | DEFECT | CHANGE_OF_MIND | GOODWILL" }
      - { name: requested_units, type: integer, source: input, description: "Units the customer wants returned; integer >= 1" }
      - { name: is_exchange, type: boolean, source: input, default: false, description: "Whether the customer wants a replacement rather than a refund" }
      - { name: replacement_product_id, type: string, source: input, description: "Id of the replacement DonationProduct; null means a plain refund" }
      - { name: replacement_is_donation_good, type: boolean, source: computed, description: "true when the replacement product accrues a donation obligation" }
      - { name: status, type: enum, source: system, description: "REQUESTED | APPROVED | REJECTED | CREDITED | EXCHANGED" }
      - { name: terminal_outcome, type: enum, source: computed, description: "REFUNDED | REPLACED; null while the request is open" }
      - { name: refund_amount_cents, type: integer, source: computed, description: "Per-unit refund from calculations.return_refund_amount times requested_units; 0 for exchanges" }
      - { name: liability_delta_units, type: integer, source: computed, description: "Change this request applies to its DonationLiability; always 0" }
      - { name: window_expires_at, type: datetime, source: computed, description: "paid_at of the owning order plus return_window_days" }

  - name: ImpactAudit
    parent: null
    common_fields: true
    fields:
      - { name: impact_season_id, type: string, source: system, description: "FK -> ImpactSeason.id; season under audit" }
      - { name: claim_id, type: string, source: input, description: "FK -> MarketingClaim.id; claim under audit" }
      - { name: audit_kind, type: enum, source: input, description: "ANNUAL_IMPACT | PARTNER_PERFORMANCE" }
      - { name: claimed_donation_units, type: integer, source: input, description: "Units the organization asserts were donated, as stated in public reporting" }
      - { name: shipped_units_verified, type: integer, source: computed, description: "Sum of shipped_units over the season's distributions, excluding VOIDED rows" }
      - { name: received_units_verified, type: integer, source: computed, description: "Sum of received_units over the season's distributions, excluding VOIDED rows" }
      - { name: unit_clearance_rate, type: number, source: computed, description: "received_units_verified / shipped_units_verified, 4 decimals round_half_up; null when shipped_units_verified is 0" }
      - { name: scorecard_total, type: integer, source: computed, description: "0-100 partner scorecard total from calculations.partner_performance_grade" }
      - { name: transaction_test_sample_size, type: integer, source: input, description: "Number of distributions sampled as a transaction test" }
      - { name: transaction_test_exceptions, type: integer, source: input, description: "Number of sampled distributions with documentation exceptions" }
      - { name: partner_performance_grade, type: enum, source: computed, description: "EXEMPLARY | SATISFACTORY | MONITORED | PROBATION" }
      - { name: liability_reconciliation_delta, type: integer, source: computed, description: "Season shipped units minus season frozen claim units at the instant of finalization" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | IN_PROGRESS | FINALIZED | REOPENED" }
      - { name: finalization_error_message, type: string, source: input, description: "Auditor note recorded when finalization is rejected" }
      - { name: finalized_at, type: datetime, source: system, description: "UTC instant the audit reached FINALIZED" }

# =============================================================================
# Table 2 (SKILL §1.2): State Machine Table — 13 machines
# Non-linear machines: GivingPartner (cyclic), GivingPartnerVetting (cyclic),
# DonationProductLine (branching fork-join → merge), DonationLiability (cyclic),
# DonationAllocation (branching + re-entrant), DonationDistribution (branching),
# ImpactSeason (cyclic), MarketingClaim (self-loop), SalesOrder (parallel
# dimensions), SalesOrderLine (branching fork-join → merge).
# Linear machines: PartnerCapacityProfile, ReturnRequest, ImpactAudit.
# =============================================================================
state_machines:

  # ---------------------------------------------------------------------------
  - entity: GivingPartner
    initial_state: CANDIDATE
    terminal_states: [REJECTED_FINAL, INACTIVE]
    transitions:
      - from: CANDIDATE
        to: VETTING
        trigger: "POST /giving-partners"
        actor: GivingPartnerCoordinator
        preconditions:
          - "operating_region and operating_state_code are supplied"
        side_effects:
          - "Create GivingPartnerVetting round_number = 1 with outcome REQUESTED"
          - "GivingPartner.vetting_round = 1"
          - "GivingPartner.status starts at CANDIDATE and moves to VETTING in the same request"

      - from: VETTING
        to: APPROVED
        trigger: "POST /vetting-rounds/{vetting_id}/approve"
        actor: GivingPartnerCoordinator
        preconditions:
          - "GivingPartner.registry_verified == true"
          - "registry_check_passed == true, tax_check_passed == true, on_site_check_passed == true, capacity_check_passed == true on this round"
          - "Computed need_score >= 40 (need_verification_points >= 4 may raise the declared need_tier by one band before scoring)"
        side_effects:
          - "GivingPartner.last_vetted_at = current logical clock"
          - "GivingPartner.need_score recomputed by calculations.need_score"
          - "Create PartnerCapacityProfile for every ImpactSeason whose status is PLANNED, copying need_tier; seasons that are already OPEN get no automatic profile so the operator declares the ceiling explicitly"

      - from: VETTING
        to: REJECTED
        trigger: "POST /vetting-rounds/{vetting_id}/reject"
        actor: GivingPartnerCoordinator
        preconditions: []
        side_effects:
          - "GivingPartner.total_rejections += 1"
          - "If total_rejections >= 2, GivingPartner.status → REJECTED_FINAL (terminal)"

      - from: VETTING
        to: CANDIDATE
        trigger: "system (vetting round expires at its valid_until instant)"
        actor: system
        preconditions:
          - "ImpactSeason containing the current clock has status FROZEN or CLOSED"
        side_effects:
          - "Create PartnerCapacityProfile for the next ImpactSeason with status PLANNED"

      - from: REJECTED
        to: VETTING
        trigger: "POST /vetting-rounds/{vetting_id}/reopen"
        actor: GivingPartnerCoordinator
        preconditions:
          - "GivingPartner.total_rejections < 2"
          - "The current round outcome is REJECTED"
        side_effects:
          - "Create GivingPartnerVetting round_number = vetting_round + 1 with outcome DOCUMENTS_SUBMITTED"
          - "GivingPartner.vetting_round += 1"

      - from: APPROVED
        to: SUSPENDED
        trigger: "PUT /giving-partners/{partner_id}/status"
        actor: ImpactAuditor
        preconditions:
          - "target value in {SUSPENDED} and no ImpactAudit for this partner is in IN_PROGRESS"
        side_effects:
          - "All PartnerCapacityProfile rows for this partner with status ACTIVE → LOCKED"
          - "All DonationAllocation rows for this partner in status PENDING_ALLOCATION → CANCELLED"
          - "All MarketingClaim rows naming this partner in status SUBSTANTIATED → SEASON_RESTRICTED"

      - from: SUSPENDED
        to: APPROVED
        trigger: "PUT /giving-partners/{partner_id}/status"
        actor: ImpactAuditor
        preconditions:
          - "target value in {APPROVED} and this transition is only reachable before the annual audit freezes"
        side_effects:
          - "PartnerCapacityProfile rows for this partner with status LOCKED → ACTIVE"
          - "MarketingClaim rows for this partner in SEASON_RESTRICTED → SUBSTANTIATED"

      - from: APPROVED
        to: INACTIVE
        trigger: "PUT /giving-partners/{partner_id}/status"
        actor: GivingPartnerCoordinator
        preconditions:
          - "target value in {INACTIVE} and all DonationAllocation rows for this partner are in a terminal status"
        side_effects:
          - "All PartnerCapacityProfile rows for this partner → SUPERSEDED"

      - from: SUSPENDED
        to: INACTIVE
        trigger: "PUT /giving-partners/{partner_id}/status"
        actor: GivingPartnerCoordinator
        preconditions:
          - "target value in {INACTIVE} and all DonationAllocation rows for this partner are in a terminal status"
        side_effects:
          - "All PartnerCapacityProfile rows for this partner → SUPERSEDED"

  # ---------------------------------------------------------------------------
  - entity: GivingPartnerVetting
    initial_state: REQUESTED
    terminal_states: [EXPIRED]
    transitions:
      - from: REQUESTED
        to: DOCUMENTS_SUBMITTED
        trigger: "PUT /vetting-rounds/{vetting_id}"
        actor: GivingPartnerCoordinator
        preconditions:
          - "registry_check_passed and tax_check_passed are present"
        side_effects: []

      - from: DOCUMENTS_SUBMITTED
        to: EVALUATING
        trigger: "PUT /vetting-rounds/{vetting_id}"
        actor: GivingPartnerCoordinator
        preconditions: []
        side_effects: []

      - from: EVALUATING
        to: REQUESTED
        trigger: "PUT /vetting-rounds/{vetting_id}"
        actor: GivingPartnerCoordinator
        preconditions:
          - "outcome_message is non-empty"
        side_effects:
          - "GivingPartner.status → CANDIDATE"
          - "GivingPartner.total_rejections += 1 (an information request in this round counts as a rejection for the two-strike rule)"

      - from: EVALUATING
        to: APPROVED
        trigger: "POST /vetting-rounds/{vetting_id}/approve"
        actor: GivingPartnerCoordinator
        preconditions:
          - "All four verification flags true on this round"
          - "Computed need_score >= 40"
        side_effects:
          - "GivingPartner.status → APPROVED"
          - "GivingPartner.last_vetted_at = current logical clock"

      - from: EVALUATING
        to: REJECTED
        trigger: "POST /vetting-rounds/{vetting_id}/reject"
        actor: GivingPartnerCoordinator
        preconditions: []
        side_effects:
          - "GivingPartner.status → REJECTED"
          - "GivingPartner.total_rejections += 1"

      - from: REJECTED
        to: REQUESTED
        trigger: "POST /vetting-rounds/{vetting_id}/reopen"
        actor: GivingPartnerCoordinator
        preconditions:
          - "GivingPartner.total_rejections < 2"
        side_effects:
          - "GivingPartner.status → VETTING"
          - "GivingPartner.vetting_round += 1 and a new round row is created"

      - from: APPROVED
        to: DOCUMENTS_SUBMITTED
        trigger: "PUT /vetting-rounds/{vetting_id}"
        actor: GivingPartnerCoordinator
        preconditions:
          - "An ImpactAudit of kind PARTNER_PERFORMANCE for this partner in the season containing the current clock has status FINALIZED"
          - "The partner's partner_performance_grade is MONITORED or PROBATION"
        side_effects:
          - "GivingPartner.status → VETTING"
          - "GivingPartner.registry_verified recomputed"

      - from: REQUESTED
        to: EXPIRED
        trigger: "system (logical clock passes valid_until while the round is still REQUESTED)"
        actor: system
        preconditions:
          - "valid_until < current logical clock"
        side_effects:
          - "GivingPartner.status → CANDIDATE"

  # ---------------------------------------------------------------------------
  - entity: PartnerCapacityProfile
    initial_state: ACTIVE
    terminal_states: [SUPERSEDED]
    transitions:
      - from: ACTIVE
        to: EXHAUSTED
        trigger: "system (the allocation currently being committed would leave zero headroom)"
        actor: system
        preconditions:
          - "committed_units + reserved_units - impact_units_confirmed + incoming <= max_allocatable_units"
          - "max_allocatable_units - (committed_units + reserved_units - impact_units_confirmed + incoming) == 0"
        side_effects:
          - "PartnerCapacityProfile.status → EXHAUSTED in the same request that commits the filling allocation"

      - from: EXHAUSTED
        to: ACTIVE
        trigger: "system (a receipt is confirmed or a REVERSAL allocation lands)"
        actor: system
        preconditions:
          - "committed_units + reserved_units - impact_units_confirmed < max_allocatable_units"
        side_effects:
          - "PartnerCapacityProfile.status → ACTIVE"

      - from: ACTIVE
        to: LOCKED
        trigger: "system (the owning GivingPartner leaves APPROVED)"
        actor: system
        preconditions:
          - "GivingPartner.status in {SUSPENDED, INACTIVE}"
        side_effects: []

      - from: LOCKED
        to: ACTIVE
        trigger: "system (the owning GivingPartner returns to APPROVED)"
        actor: system
        preconditions:
          - "GivingPartner.status == APPROVED"
        side_effects: []

      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system (a successor profile becomes selectable for an overlapping interval)"
        actor: system
        preconditions:
          - "A PartnerCapacityProfile for the same partner and same season_code has effective_from later than this profile's effective_from"
        side_effects: []

  # ---------------------------------------------------------------------------
  - entity: DonationProduct
    initial_state: DRAFT
    terminal_states: [ARCHIVED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /donation-products/{product_id}/activate"
        actor: ProductDesigner
        preconditions:
          - "design_weight_score >= 60"
          - "Every DonationProductLine in DRAFT has unit_obligation_cost_cents computed"
        side_effects:
          - "All DRAFT DonationProductLine rows for this product → ACTIVE"

      - from: ACTIVE
        to: RETIRED
        trigger: "PUT /donation-products/{product_id}"
        actor: ProductDesigner
        preconditions:
          - "target status RETIRED"
        side_effects:
          - "All ACTIVE DonationProductLine rows with donation_eligible == false → RETIRED"
          - "ACTIVE DonationProductLine rows with donation_eligible == true stay ACTIVE until their season closes"

      - from: RETIRED
        to: ACTIVE
        trigger: "PUT /donation-products/{product_id}"
        actor: ProductDesigner
        preconditions:
          - "target status ACTIVE"
          - "Every ACTIVE DonationProductLine has design_variant_code != none"
        side_effects:
          - "All DonationProductLine rows in RETIRED → ACTIVE"
        note: "A retired product can be brought back for one more season when the demand forecast recovers"

      - from: ACTIVE
        to: ARCHIVED
        trigger: "system (the last SalesOrderLine referencing this product belongs to an order whose ImpactSeason reaches FINALIZED)"
        actor: system
        preconditions:
          - "No SalesOrderLine in status OPEN or RETURN_REQUESTED references this product"
          - "Every ImpactSeason referencing this product has status FINALIZED"
        side_effects:
          - "All DonationProductLine rows → ARCHIVED"

  # ---------------------------------------------------------------------------
  - entity: DonationProductLine
    initial_state: DRAFT
    terminal_states: [ARCHIVED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "system (the owning DonationProduct is activated)"
        actor: system
        preconditions: []
        side_effects:
          - "obligation_units recomputed from approved_donation_ratio_units when donation_eligible is true"

      - from: ACTIVE
        to: COMMITTED
        trigger: "POST /allocation-plans/{plan_id}/commit"
        actor: AllocationPlanner
        preconditions:
          - "The line's product has design_channel == DONATION_ONLY"
        side_effects:
          - "DonationLiability.obligation_units for the current season += this line's obligation_units"

      - from: ACTIVE
        to: VESTED
        trigger: "system (a SalesOrderLine for this line settles)"
        actor: system
        preconditions:
          - "The line's product has obligation_model == AT_VESTING"
          - "The line's product has design_channel == DUAL_CHANNEL"
        side_effects:
          - "DonationLiability for the current season gains this line's obligation_units"

      - from: ACTIVE
        to: SUNSET
        trigger: "system (the season containing the current clock reaches FROZEN)"
        actor: system
        preconditions:
          - "The line's product has design_channel == DONATION_ONLY"
          - "The line's product has obligation_model == AT_VESTING"
        side_effects:
          - "Line is marked SUNSET and excluded from obligations of every later season"

      - from: VESTED
        to: ACTIVE
        trigger: "POST /allocation-plans/{plan_id}/revert"
        actor: AllocationPlanner
        preconditions:
          - "The season the line vested into is still OPEN"
          - "No SalesOrderLine for this line has a status other than OPEN"
        side_effects:
          - "DonationLiability.obligation_units -= this line's obligation_units"
          - "The plan successor's donor lines are re-selected and canonicalized under the FROZEN season"

      - from: COMMITTED
        to: VESTED
        trigger: "system (the first SalesOrderLine for this line settles)"
        actor: system
        preconditions:
          - "The line's product has design_channel == DONATION_ONLY"
          - "A DonationLiability row for the current season exists"
        side_effects:
          - "DonationLiability.obligation_units += this line's obligation_units"

      - from: ACTIVE
        to: RETIRED
        trigger: "PUT /donation-products/{product_id}"
        actor: ProductDesigner
        preconditions:
          - "donation_eligible == false"
        side_effects: []

      - from: RETIRED
        to: ARCHIVED
        trigger: "system (the owning DonationProduct is archived)"
        actor: system
        preconditions: []
        side_effects: []

  # ---------------------------------------------------------------------------
  - entity: DonationLiability
    initial_state: ACCUMULATING
    terminal_states: [CLOSED]
    transitions:
      - from: ACCUMULATING
        to: ACCUMULATING
        trigger: "POST /sales-orders/{order_id}/lines"
        actor: system
        preconditions:
          - "The line's DonationProductLine.donation_eligible is true"
        side_effects:
          - "provisional_liability_units += quantity * obligation_units"
          - "obligation_units += line obligation for AT_SALE products"
          - "ImpactSeason.claim_frozen_units_total recomputed"

      - from: ACCUMULATING
        to: ACCUMULATING
        trigger: "POST /sales-orders/{order_id}/lines/{line_id}/settle"
        actor: system
        preconditions:
          - "The line's DonationProduct.obligation_model == AT_SALE"
        side_effects:
          - "final_liability_units += quantity * obligation_units"
          - "ImpactSeason.total_shipped_units recomputed"

      - from: ACCUMULATING
        to: FROZEN
        trigger: "system (the logical clock passes ImpactSeason.freezes_at)"
        actor: system
        preconditions:
          - "ImpactSeason.freezes_at <= current logical clock"
          - "ImpactSeason.ends_at > current logical clock"
        side_effects:
          - "frozen_units = provisional_liability_units"
          - "donation_liability_units = final_liability_units"
          - "freeze_recorded_at = current logical clock"
          - "accrued_obligation_cents frozen at obligation_units * unit_obligation_cost_cents"
          - "ImpactSeason.status → FROZEN and ImpactSeason.opening_carry_cents recomputed"

      - from: FROZEN
        to: ACCUMULATING
        trigger: "PUT /liabilities/{liability_id}/unfreeze"
        actor: ImpactAuditor
        preconditions:
          - "ImpactSeason.status == FROZEN"
          - "No ImpactAudit for this season has status FINALIZED"
        side_effects:
          - "frozen_units recomputed from provisional_liability_units"
          - "ImpactSeason.status → OPEN"

      - from: FROZEN
        to: CARRIED
        trigger: "POST /liabilities/{liability_id}/carry-forward"
        actor: AllocationPlanner
        preconditions:
          - "required_stated_units > frozen_units"
          - "The season named by carry_from_season_code has status CLOSED"
        side_effects:
          - "carried_out_units = required_stated_units - frozen_units"
          - "The successor DonationLiability for the next season gains carried_in_units = carried_out_units"
          - "That successor's status becomes ACCUMULATING with carried_in_units included in its frozen_units at its own freeze"
          - "ImpactSeason.liability_carry_in_units recomputed"

      - from: CARRIED
        to: CARRIED
        trigger: "POST /sales-orders/{order_id}/lines/{line_id}/settle"
        actor: system
        preconditions:
          - "The line's DonationProduct.obligation_model == AT_SALE or AT_VESTING"
        side_effects:
          - "final_liability_units += quantity * obligation_units"
          - "carried_out_units unchanged until the next freeze"

      - from: CARRIED
        to: CLOSED
        trigger: "system (the ImpactSeason transitions to CLOSED)"
        actor: system
        preconditions:
          - "carried_out_units has been written to the successor liability"
        side_effects:
          - "ImpactSeason.liability_carry_in_units recomputed for the successor season"

      - from: FROZEN
        to: AUDIT_LOCKED
        trigger: "POST /impact-audits/{audit_id}/finalize"
        actor: ImpactAuditor
        preconditions:
          - "No MarketingClaim for this season has status OVERSTATED"
          - "ImpactSeason.status == FROZEN"
          - "The acting X-User-ID did not perform the preliminary review of the same audit"
        side_effects:
          - "ImpactSeason.status → FINALIZED"
          - "frozen_units re-snapshotted from final_liability_units"
          - "ImpactSeason.liability_reconciliation_delta recomputed"
          - "Every DonationAllocation for this season in status RECEIVED → its GivingPartner.impact_units_total recomputed"

      - from: AUDIT_LOCKED
        to: FROZEN
        trigger: "POST /impact-audits/{audit_id}/reopen"
        actor: ImpactAuditor
        preconditions:
          - "RESET_AUDIT_LOCK flag is true on the acting auditor's ImpactSeason"
        side_effects:
          - "ImpactSeason.status → FROZEN"

  # ---------------------------------------------------------------------------
  - entity: DonationAllocation
    initial_state: PENDING_ALLOCATION
    terminal_states: [CANCELLED, REVERSED]
    transitions:
      - from: PENDING_ALLOCATION
        to: APPROVED
        trigger: "POST /allocations/{allocation_id}/approve"
        actor: AllocationPlanner
        preconditions:
          - "expected_allocation_version matches the stored version"
          - "PartnerCapacityProfile for the season is ACTIVE or EXHAUSTED"
          - "The partner's capacity headroom accommodates allocated_units"
          - "rank_score was computed for the candidate pool of this plan"
        side_effects:
          - "PartnerCapacityProfile.committed_units += allocated_units"
          - "rank_score recomputed by calculations.partner_rank_score"
          - "capacity_utilization_units recomputed on the profile and on GivingPartner"
          - "GivingPartner.version += 1"

      - from: APPROVED
        to: SHIPPED
        trigger: "POST /allocations/{allocation_id}/distributions"
        actor: FulfillmentOperator
        preconditions:
          - "shipped_units <= allocated_units"
          - "shipped_units >= 1"
        side_effects:
          - "Create DonationDistribution with status SHIPPED"
          - "ImpactSeason.total_shipped_units recomputed"

      - from: SHIPPED
        to: PARTIALLY_RECEIVED
        trigger: "POST /distributions/{distribution_id}/receipts"
        actor: GivingPartnerCoordinator
        preconditions:
          - "received_units < shipped_units"
          - "received_units >= 1"
        side_effects:
          - "DonationDistribution.received_units = sum of confirmed receipts"
          - "GivingPartner.impact_units_total recomputed after the season finalizes"
          - "PartnerCapacityProfile.capacity_utilization_units recomputed"

      - from: PARTIALLY_RECEIVED
        to: RECEIVED
        trigger: "POST /distributions/{distribution_id}/receipts"
        actor: GivingPartnerCoordinator
        preconditions:
          - "Cumulative confirmed received_units >= shipped_units"
        side_effects:
          - "DonationDistribution.received_units = shipped_units"
          - "DonationDistribution.impact_units_confirmed = received_units"
          - "DonationAllocation.status → RECEIVED"

      - from: SHIPPED
        to: RECEIVED
        trigger: "POST /distributions/{distribution_id}/receipts"
        actor: GivingPartnerCoordinator
        preconditions:
          - "Cumulative confirmed received_units >= shipped_units"
        side_effects:
          - "DonationDistribution.status → RECEIVED"

      - from: RECEIVED
        to: SHIPPED
        trigger: "POST /distributions/{distribution_id}/receipts"
        actor: GivingPartnerCoordinator
        preconditions:
          - "ImpactSeason.status == PLANNED"
        side_effects:
          - "DonationDistribution.status → SHIPPED and received_units reset to the sum of the surviving receipts"
          - "ImpactSeason.total_received_units recomputed"
        note: "Receipts confirmed inside a PLANNED season are provisional and are demoted back to SHIPPED when the season opens"

      - from: PENDING_ALLOCATION
        to: CANCELLED
        trigger: "PUT /giving-partners/{partner_id}/status"
        actor: ImpactAuditor
        preconditions:
          - "The owning partner has left APPROVED"
          - "allocated_units were never shipped"
        side_effects:
          - "PartnerCapacityProfile.committed_units -= allocated_units"

      - from: APPROVED
        to: CANCELLED
        trigger: "POST /allocations/{allocation_id}/cancel"
        actor: AllocationPlanner
        preconditions:
          - "expected_allocation_version matches the stored version"
          - "No DonationDistribution for this allocation has shipped_units > 0"
        side_effects:
          - "PartnerCapacityProfile.committed_units -= allocated_units"
          - "PartnerCapacityProfile.status → ACTIVE"
          - "GivingPartner.version += 1"

      - from: CANCELLED
        to: APPROVED
        trigger: "POST /allocations/{allocation_id}/reallocations"
        actor: AllocationPlanner
        preconditions:
          - "expected_allocation_version matches the stored version"
          - "allocated_units <= the emptied profile's headroom"
        side_effects:
          - "DonationAllocation.status → APPROVED with a refreshed rank_score and a new created_at"
          - "Effects of calculations.partner_rank_score recomputed across the plan's candidate pool"
          - "GivingPartner.version += 1"

      - from: RECEIVED
        to: REVERSED
        trigger: "POST /allocations/{allocation_id}/reversals"
        actor: AllocationPlanner
        preconditions:
          - "impact_units_confirmed == 0 OR the season's reconciliation delta is negative"
          - "allocated_units <= the partner's remaining headroom"
        side_effects:
          - "Create a child DonationAllocation with allocation_kind REVERSAL, allocated_units = this allocation's allocated_units"
          - "PartnerCapacityProfile.reserved_units += allocated_units"
          - "Create the make-up DonationLiability for the NEXT ImpactSeason with carried_in_units = allocated_units"

  # ---------------------------------------------------------------------------
  - entity: DonationDistribution
    initial_state: SHIPPED
    terminal_states: [COMPLETED, WRITTEN_OFF, VOIDED]
    transitions:
      - from: SHIPPED
        to: PARTIALLY_RECEIVED
        trigger: "POST /distributions/{distribution_id}/receipts"
        actor: GivingPartnerCoordinator
        preconditions:
          - "confirmed_units < shipped_units"
        side_effects:
          - "DonationDistribution.received_units recomputed"
          - "DonationAllocation.status → PARTIALLY_RECEIVED"

      - from: SHIPPED
        to: RECEIVED
        trigger: "POST /distributions/{distribution_id}/receipts"
        actor: GivingPartnerCoordinator
        preconditions:
          - "confirmed_units >= shipped_units"
        side_effects:
          - "DonationDistribution.impact_units_confirmed = received_units"
          - "GivingPartner.impact_units_total recomputed"

      - from: PARTIALLY_RECEIVED
        to: RECEIVED
        trigger: "POST /distributions/{distribution_id}/receipts"
        actor: GivingPartnerCoordinator
        preconditions:
          - "confirmed_units >= shipped_units"
        side_effects:
          - "DonationDistribution.impact_units_confirmed = received_units"

      - from: RECEIVED
        to: COMPLETED
        trigger: "POST /distributions/{distribution_id}/complete"
        actor: FulfillmentOperator
        preconditions:
          - "received_units == shipped_units"
          - "receipt_confirmed_at is set"
        side_effects:
          - "GivingPartner.avg_distribution_completion_days recomputed"
          - "DonationAllocation.status → RECEIVED"

      - from: RECEIVED
        to: DISCREPANCY_CLAIMED
        trigger: "POST /distributions/{distribution_id}/discrepancies"
        actor: FulfillmentOperator
        preconditions:
          - "received_units < shipped_units"
        side_effects:
          - "discrepancy_units = shipped_units - received_units"

      - from: DISCREPANCY_CLAIMED
        to: WRITTEN_OFF
        trigger: "POST /distributions/{distribution_id}/write-off"
        actor: FulfillmentOperator
        preconditions:
          - "exception_reason is non-empty"
        side_effects:
          - "DonationDistribution.status → WRITTEN_OFF and the season's total_shipped_units unchanged"
          - "DonationAllocation.status stays RECEIVED"

      - from: DISCREPANCY_CLAIMED
        to: COMPLETED
        trigger: "POST /distributions/{distribution_id}/receipts"
        actor: GivingPartnerCoordinator
        preconditions:
          - "The remainder is confirmed and received_units == shipped_units"
        side_effects:
          - "DonationDistribution.status → COMPLETED"

      - from: SHIPPED
        to: VOIDED
        trigger: "POST /distributions/{distribution_id}/void"
        actor: FulfillmentOperator
        preconditions:
          - "received_units == 0"
        side_effects:
          - "ImpactSeason.total_shipped_units recomputed, excluding VOIDED rows"
          - "DonationAllocation.status → APPROVED"

  # ---------------------------------------------------------------------------
  - entity: ImpactSeason
    initial_state: PLANNED
    terminal_states: [FINALIZED]
    transitions:
      - from: PLANNED
        to: OPEN
        trigger: "system (the logical clock passes starts_at)"
        actor: system
        preconditions:
          - "starts_at <= current logical clock"
        side_effects:
          - "All DonationDistribution rows in the season with status RECEIVED and impact_season PLANNED are demoted to SHIPPED"
          - "Every DonationLiability for the season with status ACCUMULATING stays ACCUMULATING"

      - from: OPEN
        to: FROZEN
        trigger: "system (the logical clock passes freezes_at)"
        actor: system
        preconditions:
          - "freezes_at <= current logical clock"
          - "All MarketingClaim rows for the season have status in {DRAFT, SUBSTANTIATED, OVERSTATED, UNSUBSTANTIATED, SEASON_RESTRICTED}"
        side_effects:
          - "All DonationLiability rows for this season → FROZEN with frozen_units = provisional_liability_units"
          - "claim_frozen_units_total recomputed"
          - "Every DonationProduct with ACTIVE season_code pointing at this season gets active_season_code re-evaluated"

      - from: FROZEN
        to: OPEN
        trigger: "PUT /liabilities/{liability_id}/unfreeze"
        actor: ImpactAuditor
        preconditions:
          - "No ImpactAudit for this season has status FINALIZED"
        side_effects:
          - "All DonationLiability rows for this season → ACCUMULATING"

      - from: FROZEN
        to: CLOSED
        trigger: "POST /impact-seasons/{season_id}/close"
        actor: ImpactAuditor
        preconditions:
          - "Every DonationLiability for the season has status in {CARRIED, CLOSED}"
        side_effects:
          - "Liability rows → CLOSED and ImpactSeason.status → CLOSED"

      - from: CLOSED
        to: OPEN
        trigger: "POST /impact-seasons/{season_id}/reopen"
        actor: ImpactAuditor
        preconditions:
          - "No ImpactAudit for this season has status FINALIZED"
        side_effects:
          - "Liability rows for the season → ACCUMULATING"

      - from: PLANNED
        to: FINALIZED
        trigger: "POST /impact-audits/{audit_id}/finalize"
        actor: ImpactAuditor
        preconditions:
          - "audit_kind == ANNUAL_IMPACT"
          - "All DonationDistribution rows in the season have status in {COMPLETED, WRITTEN_OFF} or impact_units_confirmed == 0"
          - "No MarketingClaim for this season has status OVERSTATED"
          - "The acting X-User-ID did not perform the preliminary review of this audit"
        side_effects:
          - "ImpactSeason.status → FINALIZED (PLANNED seasons are finalized directly when the audit completes)"
          - "Liability rows → AUDIT_LOCKED then CLOSED where carried_out_units was materialized"
          - "GivingPartner.partner_performance_grade written from the audit's scorecard_total"

      - from: FROZEN
        to: FINALIZED
        trigger: "POST /impact-audits/{audit_id}/finalize"
        actor: ImpactAuditor
        preconditions:
          - "audit_kind == ANNUAL_IMPACT"
          - "shipped_units_verified > 0"
          - "No MarketingClaim for this season has status OVERSTATED"
          - "The acting X-User-ID did not perform the preliminary review of this audit"
        side_effects:
          - "ImpactSeason.status → FINALIZED"
          - "DonationLiability rows → AUDIT_LOCKED with frozen_units re-snapshotted from final_liability_units"
          - "ImpactSeason.liability_reconciliation_delta recomputed"
          - "MarketingClaim rows for the season → EXPIRED"

  # ---------------------------------------------------------------------------
  - entity: MarketingClaim
    initial_state: DRAFT
    terminal_states: [EXPIRED, REVOKED]
    transitions:
      - from: DRAFT
        to: SUBSTANTIATED
        trigger: "POST /marketing-claims/{claim_id}/substantiate"
        actor: MarketingManager
        preconditions:
          - "substantiated_ratio_value >= SUBSTANTIATION_FLOOR (1.0000) when winback_multiplier == 1"
          - "The claim's stated_reference_period window is covered by shipped or capacity-committed units"
        side_effects:
          - "substantiated_donation_units recomputed"
          - "substantiated_ratio_value recomputed"
          - "DonationLiability.required_stated_units recomputed"

      - from: DRAFT
        to: UNSUBSTANTIATED
        trigger: "POST /marketing-claims/{claim_id}/substantiate"
        actor: MarketingManager
        preconditions:
          - "substantiated_ratio_value >= 1.0000 is false AND winback_multiplier == 1"
        side_effects:
          - "The claim cannot be published; substantiated_donation_units remains below stated_donation_units"

      - from: SUBSTANTIATED
        to: OVERSTATED
        trigger: "POST /marketing-claims/{claim_id}/derive-build"
        actor: MarketingManager
        preconditions:
          - "After the derive-build carry-forward, substantiated_ratio_value < 1.0000"
        side_effects:
          - "DonationLiability.required_stated_units recomputed"
          - "DonationLiability.status may move to CARRIED if required_stated_units > frozen_units"

      - from: OVERSTATED
        to: UNSUBSTANTIATED
        trigger: "POST /marketing-claims/{claim_id}/substantiate"
        actor: MarketingManager
        preconditions:
          - "winback_multiplier >= 2 and the win-back arithmetic is fully substantiated"
        side_effects:
          - "The liability set must cover the win-back arithmetic; required_stated_units recomputed"

      - from: SUBSTANTIATED
        to: SUBSTANTIATED
        trigger: "POST /marketing-claims/{claim_id}/derive-build"
        actor: MarketingManager
        preconditions:
          - "The season containing the claim is already FROZEN"
          - "After the carry-forward, substantiated_ratio_value >= 1.0000"
          - "At least one DonationProductLine has status COMMITTED or VESTED for the claim's product"
        side_effects:
          - "substantiated_donation_units += committed units resolved after the freeze (the recompute is idempotent and does not double-count)"
        note: "Self-loop: derive-build may be re-run in the FROZEN season; a second run is a no-op"

      - from: SUBSTANTIATED
        to: SEASON_RESTRICTED
        trigger: "PUT /giving-partners/{partner_id}/status"
        actor: ImpactAuditor
        preconditions:
          - "The claim's partner_id is the partner leaving APPROVED"
        side_effects:
          - "Substantiation is restricted to the review window and cannot draw on either the standing reserve or season carry-over"

      - from: SEASON_RESTRICTED
        to: SUBSTANTIATED
        trigger: "PUT /giving-partners/{partner_id}/status"
        actor: ImpactAuditor
        preconditions:
          - "The claim's partner has returned to APPROVED"
        side_effects:
          - "substantiated_donation_units recomputed"

      - from: SUBSTANTIATED
        to: REVOKED
        trigger: "POST /marketing-claims/{claim_id}/revoke"
        actor: MarketingManager
        preconditions:
          - "The claim has not been finalized inside an ImpactAudit"
        side_effects:
          - "The claim can never return to SUBSTANTIATED"

      - from: OVERSTATED
        to: REVOKED
        trigger: "POST /marketing-claims/{claim_id}/revoke"
        actor: MarketingManager
        preconditions:
          - "The claim has not been finalized inside an ImpactAudit"
        side_effects:
          - "required_stated_units still counts against DonationLiability until the season freezes"

      - from: SUBSTANTIATED
        to: EXPIRED
        trigger: "system (the ImpactSeason the claim belongs to reaches FINALIZED)"
        actor: system
        preconditions:
          - "The season's ImpactAudit of kind ANNUAL_IMPACT is FINALIZED"
        side_effects: []

  # ---------------------------------------------------------------------------
  # Parallel state dimensions on one entity: order status x fulfillment_status.
  # ---------------------------------------------------------------------------
  - entity: SalesOrder
    initial_state: CREATED
    terminal_states: [REFUNDED, CANCELLED]
    transitions:
      - from: CREATED
        to: PAID
        trigger: "POST /sales-orders/{order_id}/pay"
        actor: system
        preconditions:
          - "All lines are in status OPEN"
        side_effects:
          - "paid_at = current logical clock"
          - "fulfillment_status → PLACED"
          - "Each line's obligated_units materializes from the DonationProductLine obligation rules"
          - "DonationLiability.provisional_liability_units recomputed for every line"

      - from: PAID
        to: DONATION_SATISFIED
        trigger: "system (every line reaches a terminal donation state)"
        actor: system
        preconditions:
          - "Every line has status in {EXEMPTED, RETURNED_CREDITED, EXCHANGED_REPLACED}"
        note: "fulfillment_status is an independent dimension and is deliberately NOT a precondition, so a PAID order can be DONATION_SATISFIED while still PLACED, or DELIVERED while still PAID"
        side_effects:
          - "DonationLiability.final_liability_units recomputed"
          - "ImpactSeason.total_shipped_units recomputed"

      - from: DONATION_SATISFIED
        to: PARTIALLY_REFUNDED
        trigger: "POST /return-requests/{return_id}/credit"
        actor: CustomerService
        preconditions:
          - "At least one line remains in a non-credited status"
        side_effects:
          - "refunded_cents recomputed"
          - "DonationLiability.final_liability_units deliberately NOT reduced"

      - from: PAID
        to: PARTIALLY_REFUNDED
        trigger: "POST /return-requests/{return_id}/credit"
        actor: CustomerService
        preconditions:
          - "requested_units < ordered_units"
        side_effects:
          - "refunded_cents recomputed"
          - "returned_units recomputed"

      - from: PARTIALLY_REFUNDED
        to: REFUNDED
        trigger: "POST /return-requests/{return_id}/credit"
        actor: CustomerService
        preconditions:
          - "Every line has status RETURNED_CREDITED and returned_units == ordered_units"
        side_effects:
          - "refunded_cents recomputed"
          - "DonationLiability.final_liability_units unchanged"

      - from: CREATED
        to: CANCELLED
        trigger: "POST /sales-orders/{order_id}/cancel"
        actor: CustomerService
        preconditions:
          - "order status is CREATED (no payment captured)"
        side_effects:
          - "fulfillment_status → CANCELLED"
          - "No DonationLiability row is created for this order"

      - from: PAID
        to: CREATED
        trigger: "POST /sales-orders/{order_id}/cancel"
        actor: CustomerService
        preconditions:
          - "fulfillment_status == PLACED"
        side_effects:
          - "Return to CREATED for correction of the verified settlement time"
          - "DonationLiability.provisional_liability_units reduced by the order's line obligations"

      - from: PAID
        to: PAID
        trigger: "PATCH /sales-orders/{order_id}/fulfillment"
        actor: FulfillmentOperator
        preconditions:
          - "target fulfillment_status in {PICKED, SHIPPED, DELIVERED} and strictly later than the current fulfillment_status"
        side_effects:
          - "fulfilled_units recomputed"

      - from: DONATION_SATISFIED
        to: DONATION_SATISFIED
        trigger: "PATCH /sales-orders/{order_id}/fulfillment"
        actor: FulfillmentOperator
        preconditions:
          - "target fulfillment_status is DELIVERED"
        side_effects: []

  # ---------------------------------------------------------------------------
  - entity: SalesOrderLine
    initial_state: OPEN
    terminal_states: [EXEMPTED]
    transitions:
      - from: OPEN
        to: RETURN_REQUESTED
        trigger: "POST /sales-orders/{order_id}/lines/{line_id}/return-requests"
        actor: CustomerService
        preconditions:
          - "current logical clock <= paid_at + return_window_days"
        side_effects:
          - "Create ReturnRequest with status REQUESTED"

      - from: OPEN
        to: RETURN_REQUESTED
        trigger: "POST /sales-orders/{order_id}/lines/{line_id}/return-requests"
        actor: CustomerService
        preconditions:
          - "current logical clock > paid_at + return_window_days"
          - "RESET_PURCHASE_WINDOW flag is true for the season containing the order"
        side_effects:
          - "Create ReturnRequest with status REQUESTED"

      - from: RETURN_REQUESTED
        to: RETURN_APPROVED
        trigger: "POST /return-requests/{return_id}/approve"
        actor: CustomerService
        preconditions:
          - "An open ReturnRequest exists for this line"
        side_effects: []

      - from: RETURN_REQUESTED
        to: OPEN
        trigger: "POST /return-requests/{return_id}/reject"
        actor: CustomerService
        preconditions:
          - "An open ReturnRequest exists for this line"
        side_effects: []

      - from: RETURN_APPROVED
        to: RETURNED_CREDITED
        trigger: "POST /return-requests/{return_id}/credit"
        actor: CustomerService
        preconditions:
          - "is_exchange == false"
        side_effects:
          - "ReturnRequest.status → CREDITED"
          - "ReturnRequest.terminal_outcome → REFUNDED"
          - "refund_amount_cents computed by calculations.return_refund_amount"
          - "DonationLiability.final_liability_units unchanged and liability_delta_units == 0"

      - from: RETURN_APPROVED
        to: EXCHANGED_REPLACED
        trigger: "POST /return-requests/{return_id}/credit"
        actor: CustomerService
        preconditions:
          - "is_exchange == true"
          - "replacement_product_id names an ACTIVE DonationProduct"
        side_effects:
          - "ReturnRequest.status → EXCHANGED"
          - "ReturnRequest.terminal_outcome → REPLACED"
          - "replacement_is_donation_good = true when the replacement product accrues an obligation"
          - "A replacement obligation accrues for the replacement product while the original line's obligation is retained"

      - from: EXCHANGED_REPLACED
        to: RETURN_REQUESTED
        trigger: "POST /sales-orders/{order_id}/lines/{line_id}/return-requests"
        actor: CustomerService
        preconditions:
          - "The replacement order's paid_at + return_window_days has not yet passed"
        side_effects:
          - "Create a new ReturnRequest for the replacement unit"

      - from: RETURNED_CREDITED
        to: RETURN_REQUESTED
        trigger: "POST /sales-orders/{order_id}/lines/{line_id}/return-requests"
        actor: CustomerService
        preconditions:
          - "The season containing the original order has status PLANNED"
        side_effects:
          - "Create a new ReturnRequest with requested_units <= quantity"

      - from: OPEN
        to: EXEMPTED
        trigger: "POST /sales-orders/{order_id}/lines/{line_id}/exempt"
        actor: CustomerService
        preconditions:
          - "request_reason is GOODWILL or DEFECT"
        side_effects:
          - "Return window is closed for this line; obligated_units retained"

  # ---------------------------------------------------------------------------
  - entity: ReturnRequest
    initial_state: REQUESTED
    terminal_states: [REJECTED, CREDITED, EXCHANGED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /return-requests/{return_id}/approve"
        actor: CustomerService
        preconditions:
          - "current logical clock <= window_expires_at"
        side_effects:
          - "SalesOrderLine.status → RETURN_APPROVED"

      - from: REQUESTED
        to: REJECTED
        trigger: "POST /return-requests/{return_id}/reject"
        actor: CustomerService
        preconditions:
          - "request_reason is CHANGE_OF_MIND and the window is open"
        side_effects:
          - "SalesOrderLine.status → OPEN"

      - from: REQUESTED
        to: APPROVED
        trigger: "POST /return-requests/{return_id}/approve"
        actor: CustomerService
        preconditions:
          - "current logical clock > window_expires_at"
          - "request_reason is DEFECT"
        side_effects:
          - "SalesOrderLine.status → RETURN_APPROVED"
        note: "A defect claim is approvable after the window; the donation liability is unaffected either way"

      - from: APPROVED
        to: CREDITED
        trigger: "POST /return-requests/{return_id}/credit"
        actor: CustomerService
        preconditions:
          - "is_exchange == false"
        side_effects:
          - "refund_amount_cents = round_half_up(unit_price_cents * (1 - line_discount_cents / (unit_price_cents * quantity))) * requested_units"
          - "SalesOrder.refunded_cents recomputed"

      - from: APPROVED
        to: EXCHANGED
        trigger: "POST /return-requests/{return_id}/credit"
        actor: CustomerService
        preconditions:
          - "is_exchange == true"
        side_effects:
          - "A replacement obligation accrues for replacement_product_id"

  # ---------------------------------------------------------------------------
  - entity: ImpactAudit
    initial_state: SCHEDULED
    terminal_states: [FINALIZED]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /impact-audits/{audit_id}/start"
        actor: ImpactAuditor
        preconditions:
          - "The season has at least one shipped distribution"
        side_effects: []

      - from: IN_PROGRESS
        to: FINALIZED
        trigger: "POST /impact-audits/{audit_id}/finalize"
        actor: ImpactAuditor
        preconditions:
          - "shipped_units_verified > 0"
          - "No MarketingClaim for the season has status OVERSTATED"
          - "The acting X-User-ID is not the X-User-ID that ran the preliminary review of this audit"
        side_effects:
          - "unit_clearance_rate = received_units_verified / shipped_units_verified, 4 decimals round_half_up"
          - "scorecard_total from calculations.partner_performance_grade"
          - "GivingPartner.partner_performance_grade written for every partner with an allocation in the season"
          - "DonationLiability rows for the season → AUDIT_LOCKED"
          - "ImpactSeason.status → FINALIZED"
          - "finalized_at = current logical clock"

      - from: FINALIZED
        to: REOPENED
        trigger: "POST /impact-audits/{audit_id}/reopen"
        actor: ImpactAuditor
        preconditions:
          - "RESET_AUDIT_LOCK flag is true on the acting auditor's ImpactSeason"
        side_effects:
          - "ImpactSeason.status → FROZEN"
          - "DonationLiability rows for the season → FROZEN"
          - "The successor season's carried_in_units is re-homed back to this season"
          - "GivingPartner.partner_performance_grade frozen at the value written by this audit"

      - from: REOPENED
        to: FINALIZED
        trigger: "POST /impact-audits/{audit_id}/finalize"
        actor: ImpactAuditor
        preconditions:
          - "The same auditor that reopened is permitted to re-finalize"
          - "No MarketingClaim for the season has status OVERSTATED"
        side_effects:
          - "ImpactSeason.status → FINALIZED"

# =============================================================================
# SKILL §1.2.1: Concurrency Rules (OCC-only; serial-observability filter applied)
# =============================================================================
concurrency_rules:
  - rule_id: benefit-allocation-stale-partner
    parent_entity: GivingPartner
    write_endpoint: "POST /allocation-plans/{plan_id}/commit"
    occ_field: "expected_partner_version"
    description: |
      Committing a benefit allocation against a partner whose stored version has
      advanced past the version the planner observed is rejected, because an
      intervening approval, cancellation or reversal on the same partner
      legitimately changes the capacity picture the commit was computed against.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: claim-substantiation-stale-liability
    parent_entity: DonationLiability
    write_endpoint: "POST /marketing-claims/{claim_id}/derive-build"
    occ_field: "expected_liability_version"
    description: |
      Running the derive-build carry-forward against a liability whose stored
      version has advanced past the observed version is rejected; a later
      settlement or freeze legitimately changes the frozen units the
      substantiation arithmetic reads.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: season-freeze-stale-season
    parent_entity: ImpactSeason
    write_endpoint: "PUT /impact-seasons/{season_id}/frozen-state"
    occ_field: "expected_season_version"
    description: |
      Setting the frozen state of a season whose stored version has advanced past
      the observed version is rejected, because a forecast freeze, a liability
      carry-forward or a product-season binding legitimately rewrites the
      season's aggregate totals between the read and the write.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: audit-finalize-stale-audit
    parent_entity: ImpactAudit
    write_endpoint: "POST /impact-audits/{audit_id}/finalize"
    occ_field: "expected_audit_version"
    description: |
      Finalizing an audit whose stored version has advanced past the observed
      version is rejected; writing an exception count or recording a preliminary
      review legitimately supersedes the auditor's view of the audit.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: return-creation-stale-order-line
    parent_entity: SalesOrderLine
    write_endpoint: "POST /return-requests"
    occ_field: "expected_line_version"
    description: |
      Opening a return request against a line whose stored version has advanced
      past the observed version is rejected; a prior credit or exchange on the
      same line legitimately changes the units still eligible under the window.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: allocation-reallocation-stale-allocation
    parent_entity: DonationAllocation
    write_endpoint: "POST /allocations/{allocation_id}/reallocations"
    occ_field: "expected_allocation_version"
    description: |
      Re-activating a cancelled allocation against a version that has already
      advanced is rejected; an intervening reversal or capacity recompute
      supersedes the headroom the reallocation was planned against.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3 (SKILL §1.3): Calculation Rules Table — 11 rules
# Every numeric assertion downstream is a literal computed from these formulas.
# =============================================================================
calculations:

  - name: need_score
    trigger: "GivingPartner approval (POST /vetting-rounds/{vetting_id}/approve) and GivingPartnerVetting outcome change"
    algorithm: threshold
    formula: |
      base = PRIORITY_BASE[partner_type] + region_adjustment(operating_region)
      if need_verification_points >= REQUIRED_VERIFICATION_POINTS:
          base -= 5
      access_component = min(ACCESS_CAP, unduplicated_recipients_per_facility // RECIPIENT_DIVISOR)
      need_score = clamp(base + access_component, 0, 100)
    input_set: "The GivingPartner under vetting plus the current round's GivingPartnerVetting row. No other partner contributes."
    constants:
      PRIORITY_BASE: { HOMELESS_SHELTER: 70, DOMESTIC_VIOLENCE_SHELTER: 83, YOUTH_OUTREACH: 52, VETERAN_OUTREACH: 61, DISASTER_RELIEF: 95, COMMUNITY_HEALTH_CLINIC: 20 }
      REGION_ADJUSTMENT: { NORTHEAST: 3, SOUTHEAST: 0, MIDWEST: 6, SOUTHWEST: 2, WEST: -2 }
      REQUIRED_VERIFICATION_POINTS: 4
      ACCESS_CAP: 20
      RECIPIENT_DIVISOR: 1000
      APPROVAL_MINIMUM: 40
    precision: "integer, truncating division, clamp applied last"
    variants:
      - name: declared_tier_scoring
        when: "need_verification_points <= 3"
        difference: "Uses the partner's declared need_tier band's base value unchanged."
      - name: verified_tier_scoring
        when: "need_verification_points >= 4"
        difference: "Subtracts 5 from the base before the access component is added; the one-band upgrade is applied to the base, never to the clamped result."
    note: "Worked literals: HOMELESS_SHELTER / NORTHEAST / 15000 recipients / points 2 -> 88. DOMESTIC_VIOLENCE_SHELTER / SOUTHEAST / 20000 / points 5 -> 98. COMMUNITY_HEALTH_CLINIC / SOUTHEAST / 15000 / points 0 -> 35, which is below APPROVAL_MINIMUM 40 and therefore rejects approval even though all four verification flags are true."

  - name: donation_credit_ledger
    trigger: "DonationProductLine activation and every accrual/reversal write on DonationLiability"
    algorithm: aggregation
    formula: |
      unit_obligation_cost_cents = round_half_up(unit_cost_cents * (1 + DONATION_UPLIFT))
      For each SalesOrderLine L whose SalesOrder.status IN {PAID, DONATION_SATISFIED, PARTIALLY_REFUNDED, REFUNDED}:
          line_donation_cost_cents(L) = round_half_up(L.quantity * L.donation_product.unit_cost_cents * (1 + DONATION_UPLIFT))
      donation_cost_cents = sum over L of line_donation_cost_cents(L)     # sum of ROUNDED lines
      obligation_units = sum over L of L.donation_product_line.obligation_units
      obligation_cost_cents = obligation_units * unit_obligation_cost_cents
      funding_shortfall_cents = max(0, obligation_cost_cents - donation_cost_cents)
      recorded_liability_cents = obligation_cost_cents
    input_set: "SalesOrderLine rows whose owning SalesOrder.status IN {PAID, DONATION_SATISFIED, PARTIALLY_REFUNDED, REFUNDED}. CREATED and CANCELLED orders are excluded from this currency ledger even though CREATED orders do contribute to provisional_liability_accrual's unit ledger."
    constants:
      DONATION_UPLIFT: 0.70
    precision: "cents, integer; round_half_up at the per-line step only"
    variants:
      - name: per_line_rounded
        when: "always — this is the pinned order"
        difference: "Rounding happens per line and the rounded values are then summed."
      - name: pooled_then_rounded
        when: "rejected"
        difference: "Rounding the pooled total once produces different cents. Three APPAREL_TOP lines at unit_cost_cents 1445 each: per_line_rounded = 2457 + 2457 + 2457 = 7371, pooled_then_rounded = round_half_up(3 * 1445 * 1.70) = 7370. The scaffold pins per_line_rounded."
    note: "unit_obligation_cost_cents is itself rounded once per unit before it is multiplied by obligation_units; obligation_cost_cents is never re-rounded after multiplication."

  - name: provisional_liability_accrual
    trigger: "POST /sales-orders/{order_id}/lines (line added) and POST /sales-orders/{order_id}/pay"
    algorithm: aggregation
    formula: |
      provisional_liability_units = sum over SalesOrderLine L of L.quantity * L.donation_product_line.obligation_units
        where L.donation_product_line.donation_eligible == true
          AND L.donation_product.obligation_model == AT_SALE
          AND L.sales_order.status IN {CREATED, PAID, DONATION_SATISFIED, PARTIALLY_REFUNDED, REFUNDED}
    input_set: "All SalesOrderLine rows of the DonationProduct for the season whose owning order is in CREATED or any later non-cancelled status. Lines whose donation_eligible is false contribute 0. Lines of RETIRED or ARCHIVED products still contribute while their order is non-cancelled."
    constants:
      INCLUDE_STATUSES: [CREATED, PAID, DONATION_SATISFIED, PARTIALLY_REFUNDED, REFUNDED]
    precision: "integer units"
    variants:
      - name: order_created_basis
        when: "the liability has not yet been frozen (status ACCUMULATING or CARRIED)"
        difference: "Counts unit obligations of non-terminal orders; a refunded order keeps contributing because the donation obligation is not reversed."
      - name: settlement_corrected_basis
        when: "after PUT /liabilities/{liability_id}/unfreeze"
        difference: "Recomputes from the same line set but at the corrected settlement instant; identical order statuses therefore produce identical units, while an order cancelled between the two evaluations drops the delta."
    note: "Worked literals: an order with a 1-unit line and a 4-unit line both donation_eligible, order still CREATED -> provisional_liability_units = 9 * 1 + 4 * 1 = 13. After POST /sales-orders/{order_id}/cancel the order leaves the include set (status CANCELLED) -> provisional_liability_units = 9."

  - name: final_liability_accrual
    trigger: "POST /sales-orders/{order_id}/lines/{line_id}/settle, POST /sales-orders/{order_id}/pay, and ImpactSeason freezing"
    algorithm: aggregation
    formula: |
      final_liability_units = sum over SalesOrderLine L of L.quantity * L.donation_product_line.obligation_units
        where L.sales_order.status IN {PAID, DONATION_SATISFIED}
    input_set: "Only orders whose payment has settled. Orders in CREATED, CANCELLED, PARTIALLY_REFUNDED or REFUNDED are excluded — PARTIALLY_REFUNDED and REFUNDED are excluded because a refunded order's donation obligation survives on the partner side but no longer counts as a completed sale for the accrued-liability ledger."
    constants:
      COUNTED_STATUSES: [PAID, DONATION_SATISFIED]
      EXCLUDED_STATUSES: [CREATED, CANCELLED, PARTIALLY_REFUNDED, REFUNDED]
    precision: "integer units"
    variants:
      - name: settled_then_refunded
        when: "the order was PAID and later partially refunded"
        difference: "Drops the refunded units from the ledger immediately when the order leaves the counted status set."
      - name: settled_unconditionally
        when: "the order is PAID or DONATION_SATISFIED"
        difference: "Retains every unit, including units whose ReturnRequest was credited, because the diagonal case pins that a credited return never reverses a donation obligation."
    note: "Worked literals: same two-line order as provisional_liability_accrual, once PAID -> final_liability_units = 9. Before payment -> 0. The provisional and final variants therefore diverge by 4 units for identical data, and the divergence is what the freeze snapshot in DonationLiability.frozen_units records."

  - name: mixed_supply_unit_liability
    trigger: "DonationProductLine obligation computation and DonationAllocation REVERSAL creation"
    algorithm: constraint_propagation, nested min/max
    formula: |
      # Evaluation order is pinned: every term on the right is evaluated once, before any clamp.
      retail_provenance_cents = unit_value_cents
      donation_build_cost_cents = round_half_up(retail_provenance_cents * (1 + DONATION_BUILD_RATE))
      provenance_discount_cents = round_half_up(donation_build_cost_cents * DONATION_PROVENANCE_DISCOUNT)
      per_unit_liability_cents = min(
          LIABILITY_CEILING_CENTS,
          max(
              LIABILITY_FLOOR_CENTS,
              unit_obligation_cost_cents + max(0, donation_build_cost_cents - provenance_discount_cents)
          )
      )
      if donation_build_cost_cents <= provenance_discount_cents:
          per_unit_liability_cents = unit_obligation_cost_cents
      # Add-on pool: the tier is selected on base_units BEFORE the surcharge is added.
      base_units = sum of allocated_units over DonationAllocation rows with allocation_kind == ALLOCATION
                   and status IN {APPROVED, SHIPPED, PARTIALLY_RECEIVED, RECEIVED}
      lending_pool_units = count of GivingPartner rows with status IN {APPROVED, SUSPENDED}
      tier_divisor = 100 if base_units <= 5000 else (200 if base_units <= 15000 else 400)
      surcharge_units = ceil(base_units / tier_divisor)     # computed on base_units BEFORE the add-on is added
      lending_pool_units += surcharge_units                 # surcharge units increase the requirement; they are never netted back out
    input_set: "DonationProductLine rows in status ACTIVE, COMMITTED or VESTED for the unit computation; DonationAllocation rows in the four counted statuses for the add-on pool."
    constants:
      DONATION_BUILD_RATE: 0.70
      DONATION_PROVENANCE_DISCOUNT: 0.50
      LIABILITY_FLOOR_CENTS: 0
      LIABILITY_CEILING_CENTS: 100000
      TIER_DIVISORS: { T1_MAX: 5000, T2_MAX: 15000 }
    precision: "cents, integer; round_half_up at the discount step; clamps applied after all terms"
    variants:
      - name: donation_specific_line
        when: "DonationProduct.design_channel == DONATION_ONLY"
        difference: "Round the final sum: per_unit_liability_cents follows the clamp expression exactly."
      - name: retail_credit_line
        when: "DonationProduct.design_channel == DUAL_CHANNEL"
        difference: "The retail provenance discount is applied to donation_build_cost_cents and the difference is added on top of unit_obligation_cost_cents, so a dual-channel line is charged twice; the two channels therefore produce different per-unit costs for the same unit_cost_cents."
    note: "Worked literals: unit_value_cents 1155 -> donation_build_cost_cents = round_half_up(1963.5) = 1964, provenance_discount_cents = round_half_up(982.0) = 982, gap = 982. With unit_obligation_cost_cents 1155 the per_unit_liability_cents = 1155 + 982 = 2137. base_units 12000 -> tier_divisor 200 -> surcharge_units = ceil(12000 / 200) = 60."

  - name: partner_rank_score
    trigger: "POST /allocation-plans/{plan_id}/commit and POST /allocations/{allocation_id}/reallocations"
    algorithm: weighted_scoring
    formula: |
      priority_component = PRIORITY_POINTS[priority_tier]
      fit_component = min(30, allocation_fit_pct // 10)
      need_component = min(25, partner.need_score // 10)
      essential_component = min(10, essential_line_units_contributed)
      capacity_recency_component = 5 if 0 < days_since_last_capacity_receipt <= 5 else 0
      rank_score = clamp(
          priority_component + fit_component + need_component + essential_component + capacity_recency_component,
          0, 100)
    input_set: "One candidate GivingPartner plus the plan's requirement vector. essential_line_units_contributed counts only DonationProductLine rows with is_essential_good == true in the plan."
    constants:
      PRIORITY_POINTS: { EMERGENCY: 40, CRITICAL: 30, HIGH: 20, MODERATE: 10 }
      FIT_CAP: 30
      NEED_CAP: 25
      ESSENTIAL_CAP: 10
      RECENCY_POINTS: 5
      RECENCY_WINDOW_DAYS: 5
    precision: "integer, clamp applied last"
    variants:
      - name: priority_led_rank
        when: "the plan's priority_tier is EMERGENCY or CRITICAL"
        difference: "The priority term alone reaches or exceeds the whole MODERATE ladder's ceiling plus its caps, so a CRITICAL partner outranks every MODERATE partner regardless of score."
      - name: capacity_led_rank
        when: "two candidates tie on the clamped total"
        difference: "The clamped total destroys the raw ordering; the explicit tie-break sequence (rank_score DESC, need_score DESC, claim_attributed_units DESC, created_at ASC) then decides."
    note: "Worked literals: CRITICAL / fit 80 / need_score 88 / 6 essential units / receipt 2 days ago -> 30 + 8 + 8 + 6 + 5 = 57. HIGH / fit 60 / need_score 61 / 0 essential / last receipt 99 days ago -> 20 + 6 + 6 + 0 + 0 = 32. MODERATE / fit 100 / need_score 40 / 0 essential / receipt 3 days ago -> 10 + 5 + 2 + 0 + 5 = 22."

  - name: weighted_allocation
    trigger: "POST /allocation-plans/{plan_id}/commit"
    algorithm: waterfall_allocation
    formula: |
      # Stage 1 - weight per season slot.
      For slot r = 1..liquidity_cap:
          if r % 3 == 0:  weight(r) = pool_units * ESSENTIAL_WEIGHT      # essential goods ladder
          elif r % 2 == 0: weight(r) = demand_units * INDEX_WEIGHT
          else:            weight(r) = baseline_units * BASE_WEIGHT
      S = sum over r of weight(r)
      # Stage 2 - aggregate per partner, then apply the largest-remainder rule.
      aggregate(p) = sum of weight(r) over slots r assigned to partner p
      exact(p) = liquidity_cap * aggregate(p) / S
      floor(p) = floor(exact(p))
      remainder(p) = exact(p) - floor(p)
      leftover = liquidity_cap - sum of floor(p)
      winner_order = partners sorted by (remainder(p) DESC, partner.legal_name ASC)
      Give one extra unit to the first `leftover` partners in winner_order.
      allocation_units(p) = floor(p) + (1 if p is in the first `leftover` places else 0)
    input_set: "Every GivingPartner whose status is APPROVED at the instant of computation. SUSPENDED, INACTIVE, REJECTED and REJECTED_FINAL partners are excluded from the pool entirely — they receive no slot and are not part of the remainder sweep. Ties inside a slot are broken by (rank_score DESC, need_score DESC, claim_attributed_units DESC, created_at ASC), never by id."
    constants:
      BASE_WEIGHT: 1.00
      INDEX_WEIGHT: 0.35
      ESSENTIAL_WEIGHT: 0.60
      LIQUIDITY_CAP_DEFAULT: 10
      LIQUIDITY_CAP_MIN: 1
      LIQUIDITY_CAP_MAX: 50
    precision: "weights at 6 decimal places round_half_up; percentages at 1 decimal place round_half_up; unit counts integer"
    variants:
      - name: capped_proportional
        when: "sum of exact(p) exceeds liquidity_cap after flooring"
        difference: "The largest-remainder sweep distributes the leftover units; a plain proportional split would leave the leftover undistributed and the total below the cap."
      - name: partner_distribution_percentage
        when: "the roll-up reports attributed percentages"
        difference: "Percentages are rounded to 1 decimal and the rounding residual is folded into the last partner in (claim_attributed_units DESC, legal_name ASC) order so the reported total is exactly 100.0 rather than 99.9 or 100.1."
    note: "Worked literals: liquidity_cap 10 with baseline_units 2400, demand_units 15000, pool_units 4000 -> S = 42600; aggregate TX 21000, CA 14400, WV 7200; exact TX 4.929577, CA 3.380282, WV 1.690141; floors 4/3/1 leave 2 units; winner order TX then WV; final TX 5, CA 3, WV 2."

  - name: claim_substantiation_shortfall
    trigger: "POST /marketing-claims/{claim_id}/substantiate, POST /marketing-claims/{claim_id}/derive-build and season freezing"
    algorithm: threshold
    formula: |
      required_units = stated_donation_units * winback_multiplier
      substantiated_donation_units = shipped_units + capacity_committed_units + carried_in_units
      substantiated_ratio_value = round_half_up(substantiated_donation_units / required_units, 4)
      substantiated  if substantiated_ratio_value >= SUBSTANTIATION_FLOOR
      overstated     if substantiated_ratio_value <  SUBSTANTIATION_FLOOR
      required_stated_units = sum over the season's claims of (stated_donation_units * winback_multiplier)
    input_set: "shipped_units counts DonationDistribution rows whose allocation is attributed to the claim's partner and whose status is not VOIDED. capacity_committed_units counts DonationAllocation rows attributed to the claim's partner with status in {APPROVED, SHIPPED, PARTIALLY_RECEIVED, RECEIVED}. carried_in_units counts the liability's carried_in_units. Claims in status REVOKED are excluded from required_stated_units."
    constants:
      SUBSTANTIATION_FLOOR: 1.0000
      CAPACITY_SHARE_CAP: 12000
    precision: "units integer; ratio 4 decimal places round_half_up"
    variants:
      - name: shipped_only
        when: "the claim's partner has no capacity-committed row for the season"
        difference: "Substantiation rests entirely on shipped units; the ratio is strictly lower than the capacity-committed variant for the same stated units."
      - name: shipped_plus_capacity
        when: "the partner holds APPROVED or SHIPPED allocations for the season"
        difference: "Capacity-committed units count as available to the claim, so the same stated units substantiate with fewer shipped units. Capping nuance: with 9000 shipped and 3000 capacity-committed against 12000 stated, shipped_only gives ratio 0.7500 and overstated, while shipped_plus_capacity gives 1.0000 and substantiated."
    note: "Worked literals: stated 12500, mult 1, shipped 10000, committed 2500 -> required 12500, substantiated 12500, ratio 1.0000, substantiated. Stated 950, mult 2, shipped 2200 -> ratio 1.1579. Stated 100, mult 2, shipped 120 -> ratio 0.6000, overstated. Stated 12000, mult 1, shipped 10000, committed 1000 -> ratio 0.9167, overstated, and the carry-forward of 1000 units then reaches ratio 1.0000."

  - name: return_refund_amount
    trigger: "POST /return-requests/{return_id}/credit"
    algorithm: aggregation
    formula: |
      effective_unit_ratio = (unit_price_cents * quantity - line_discount_cents) / (unit_price_cents * quantity)
      effective_unit_refund_cents = round_half_up(unit_price_cents * effective_unit_ratio)
      refund_amount_cents = effective_unit_refund_cents * requested_units
      liability_delta_units = 0
    input_set: "The SalesOrderLine behind the ReturnRequest, plus the request's requested_units. line_discount_cents is spread across the line's units, never carved out of the refunded units alone."
    constants:
      EXCHANGE_REFUND_CENTS: 0
    precision: "cents, integer; round_half_up once per unit, then multiplied"
    variants:
      - name: refund_variant
        when: "is_exchange == false"
        difference: "refund_amount_cents follows the discounted effective unit price."
      - name: exchange_variant
        when: "is_exchange == true"
        difference: "refund_amount_cents is 0; a replacement obligation accrues for replacement_product_id while the original obligation is retained, so the liability delta stays 0 on both variants."
    note: "Worked literals: unit_price 1800, quantity 2, line_discount 500 -> effective_unit_refund_cents = round_half_up(1800 * 2600/3600) = round_half_up(1300.0) = 1300, so a 1-unit return refunds 1300 and a 2-unit return refunds 2600; the obligation_units of the original line are untouched in both cases. Unit_price 1800 with no discount refunds 1800 per unit."

  - name: partner_performance_grade
    trigger: "POST /impact-audits/{audit_id}/finalize for audit_kind PARTNER_PERFORMANCE"
    algorithm: weighted_scoring
    formula: |
      # clearance_ratio is the audit's 4-decimal rounded unit_clearance_rate; round it first, weight second.
      clearance_score = round_half_up(clearance_ratio * 50)
      cycle_time_score = (10 - avg_distribution_completion_days) * 2.5    # omitted when the partner has 0 received distributions
      receipt_logging_score = MIN(receipt_logged_ratio, 1) * 15
      exception_penalty = 10 * transaction_test_exceptions
      scorecard_total = floor( clamp(clearance_score + cycle_time_score + receipt_logging_score - exception_penalty, 0, 100) )
      grade = EXEMPLARY  if scorecard_total >= 85
              SATISFACTORY if scorecard_total >= 60
              MONITORED    if scorecard_total >= 40
              PROBATION    otherwise
      # Dampener: the resolved grade may be lowered by exactly one band when this part is void.
      grade = one_band_lower(grade) if dampener_variant and completed_distributions == 0 else grade
    input_set: "Distributions in status RECEIVED or COMPLETED for the audited season and partner. WRITTEN_OFF, VOIDED and DISCREPANCY_CLAIMED distributions are excluded from both received and shipped figures. Partners with no received distributions keep the received units required by a strictly monotone grade, so completing a distribution can never lower the audit's score."
    constants:
      CLEARANCE_WEIGHT: 50
      CYCLE_TIME_CEILING_DAYS: 10
      CYCLE_TIME_WEIGHT: 2.5
      RECEIPT_LOGGING_WEIGHT: 15
      EXCEPTION_PENALTY: 10
      BAND_EXEMPLARY: 85
      BAND_SATISFACTORY: 60
      BAND_MONITORED: 40
    precision: "clearance ratio 4 decimals round_half_up; scorecard total floored to an integer after clamping"
    variants:
      - name: monotone_weighting
        when: "cycle_time_score is omitted because the partner has no received distributions"
        difference: "The partner's total is strictly higher than the same partner's total with a recorded cycle time, so the grade is strictly monotone in received units. Worked literal: clearance 1.0000 with receipt_logged_ratio 1.0000 and 0 exceptions -> 50 + 15 = 65 -> SATISFACTORY."
      - name: dampened_weighting
        when: "completed_distributions == 0 for the audited season"
        difference: "Lowers the resolved grade by exactly one band, never more. Worked literal: clearance 0.5000, cycle time 5.0 days, receipt_logged_ratio 1.0000, 4 exceptions -> 25 + 12.5 + 15 - 40 = 12.5 -> 12 -> PROBATION, and with 0 completed distributions the dampener holds the grade at PROBATION because no lower band exists."
    note: "Worked literals: clearance 0.8333, cycle time 3.00 days, receipt_logged_ratio 1.0000, 0 exceptions -> 41.665 + 17.5 + 15 = 74.165 -> 74 -> SATISFACTORY. The same with 2 exceptions -> 54.165 -> 54 -> MONITORED. Clearance 1.0000 with cycle time omitted, receipt_logged_ratio 0.0000 and 2 exceptions -> 50 + 0 + 0 - 20 = 30 -> PROBATION. Clearance 1.0000, cycle time 5.0000 days, receipt_logged_ratio 1.0000, 0 exceptions -> 50 + 12.5 + 15 = 77.5 -> 77 -> SATISFACTORY. The same with 1 exception -> 67.5 -> 67."

  - name: impact_audit_reconciliation
    trigger: "POST /impact-audits/{audit_id}/finalize"
    algorithm: aggregation, dual window
    formula: |
      unit_clearance_rate = round_half_up(received_units_verified / shipped_units_verified, 4)
      liability_reconciliation_delta = shipped_units_verified - impact_season.claim_frozen_units_total
      # The two windows differ in whether the audit's own season clock has moved.
      window(ANNUAL_IMPACT)       = [season.starts_at, audit.finalized_at]        # closed above
      window(PARTNER_PERFORMANCE) = [season.starts_at, season.ends_at)            # closed above, ignores finalized_at
      # Transaction-test sample size, pinned before the exception count is accepted.
      transaction_test_sample_size = min(
          total_distributions,
          max( ceil(SAMPLE_RATIO * critical_distributions),
               ceil(critical_distributions / SAMPLE_PER_DISTRIBUTION_CAP) )
      )
      transaction_test_exceptions must satisfy 0 <= transaction_test_exceptions <= transaction_test_sample_size
    input_set: "Distributions belonging to the audited season with status not in {VOIDED}; liability rows for the same season. receipt_logged_ratio counts distributions with a non-null received_at over distributions with received_units > 0."
    constants:
      VOIDED_EXCLUDED: true
      SAMPLE_RATIO: 0.25
      SAMPLE_PER_DISTRIBUTION_CAP: 40
    precision: "ratio 4 decimals round_half_up; deltas integer"
    variants:
      - name: annual_impact_window
        when: "audit_kind == ANNUAL_IMPACT"
        difference: "Window closes at audit.finalized_at, so a receipt confirmed after the season ended but before finalization still counts into received_units_verified."
      - name: partner_performance_window
        when: "audit_kind == PARTNER_PERFORMANCE"
        difference: "Window closes at season.ends_at and ignores finalized_at, so the same receipt is excluded. The two windows therefore produce different clearance ratios for identical underlying rows."
    note: "Worked literals: shipped_units_verified 10000, received_units_verified 6250 -> unit_clearance_rate 0.6250 under either window. With shipped_units_verified 250 and received_units_verified 250 the unrounded value is 1.0; with 250 over 300 it is 0.8333, and the clear-ratio term of partner_performance_grade consumes that 4-decimal rounded value (250/300 -> term 41.665), so rounding before weighting is observable."

  - name: design_variant_selection
    trigger: "POST /donation-products/{product_id}/lines and PUT /donation-products/{product_id}"
    algorithm: threshold
    formula: |
      if donation_eligible is false:
          design_variant_code = none
      elif donation_product.design_channel == DONATION_ONLY:
          design_variant_code = donation_specific
      else:
          design_variant_code = retail_dual
      # The code decides which channel's obligation attaches when the product settles,
      # and therefore which unit_obligation_cost_cents the line reports.
      obligation_units = donation_product.approved_donation_ratio_units if donation_eligible else 0
    input_set: "One DonationProductLine plus its owning DonationProduct. donation_eligible false always yields 0 obligation units, whatever the ratio declares."
    constants:
      CODES: [donation_specific, retail_dual, none]
    precision: "integer units"
    variants:
      - name: donation_specific_variant
        when: "design_channel == DONATION_ONLY"
        difference: "The line can only ever be allocated, never sold; it reaches COMMITTED and can never reach VESTED."
      - name: retail_dual_variant
        when: "design_channel == DUAL_CHANNEL"
        difference: "The line reaches VESTED on its first settled sale; a donation_specific line never does, because its obligations are committed by plan rather than driven by sales."
    note: "Worked literals: a donation_eligible line on an UNDERGARMENT product with approved_donation_ratio_units 1 yields obligation_units 1 and design_variant_code donation_specific. The same line with donation_eligible false yields obligation_units 0 and code none."

  - name: product_attribute_weight
    trigger: "POST /donation-products and PUT /donation-products/{product_id}"
    algorithm: weighted_scoring
    formula: |
      design_weight_score = clamp(
          FABRIC_BASE[product_kind]
          + (REUSE_POINTS if is_reusable else 0)
          + CHANNEL_POINTS[design_channel],
          0, 100)
      Activation gate: design_weight_score >= ACTIVATION_MINIMUM
    input_set: "The DonationProduct's own declared attributes only. No line, order or season data participates, so the score is stable across regeneration."
    constants:
      FABRIC_BASE: { ATHLETIC_SOCK: 40, UNDERGARMENT: 45, APPAREL_TOP: 30, SLEEP_ACCESSORY: 20 }
      REUSE_POINTS: 20
      CHANNEL_POINTS: { DONATION_ONLY: 10, DUAL_CHANNEL: 0 }
      ACTIVATION_MINIMUM: 60
    precision: "integer, clamp applied last"
    variants:
      - name: donation_channel_bonus
        when: "design_channel == DONATION_ONLY"
        difference: "Adds the 10-point donation-channel bonus, so a reusable UNDERGARMENT donation-only product scores 45 + 20 + 10 = 75 and clears the gate."
      - name: dual_channel_no_bonus
        when: "design_channel == DUAL_CHANNEL"
        difference: "Omits the bonus, so the same reusable APPAREL_TOP dual-channel product scores 30 + 20 + 0 = 50 and is refused activation with ERR_DESIGN_WEIGHT_BELOW_MINIMUM."
    note: "Worked literals: UNDERGARMENT + is_reusable true + DONATION_ONLY -> 75, activatable. APPAREL_TOP + is_reusable false + DUAL_CHANNEL -> 30, refused. APPAREL_TOP + reusable + DONATION_ONLY -> 60, exactly at the gate and therefore activatable. ATHLETIC_SOCK + reusable + DONATION_ONLY -> 70, activatable."

  - name: donation_unit_cost
    trigger: "DonationProductLine creation and PUT /donation-product-lines/{line_id}"
    algorithm: tiered_pricing, nested min/max
    formula: |
      donation_uplift_cents = round_half_up(unit_cost_cents * DONATION_UPLIFT_RATE)
      retail_offset_cents   = round_half_up(retail_price_cents * DONATION_OFFSET_RATE)
      if design_channel == DUAL_CHANNEL:
          net_upcharge_cents = max(0, donation_uplift_cents - retail_offset_cents)
      else:
          net_upcharge_cents = donation_uplift_cents
      unit_obligation_cost_cents = min(unit_cost_cents, net_upcharge_cents)
      # Each rounding happens once, at its own step; the min is applied last over
      # already-rounded terms, so a dual-channel line is never charged more than
      # its own manufacturing cost.
    input_set: "The DonationProductLine's owning DonationProduct. Lines with donation_eligible false still carry the computed value but contribute 0 units."
    constants:
      DONATION_UPLIFT_RATE: 0.70
      DONATION_OFFSET_RATE: 0.05
    precision: "cents, integer; round_half_up at each named step; min applied last"
    variants:
      - name: donation_specific_line
        when: "design_channel == DONATION_ONLY and unit_cost_cents 1150, retail_price_cents 1600"
        difference: "Yields 805, because no retail offset is taken."
      - name: retail_dual_line
        when: "design_channel == DUAL_CHANNEL and unit_cost_cents 1150, retail_price_cents 1600"
        difference: "Yields 725, because the 80-cent retail offset is subtracted first; the same unit therefore costs the program 80 cents less on a dual-channel product. At unit_cost_cents 2300 and retail_price_cents 3300 the dual-channel line yields 1445."
    note: "Worked literals: unit_cost_cents 1150 / retail_price_cents 1600, DONATION_ONLY -> uplift 805, offset 80, unit_obligation_cost_cents 805. The same pair with DUAL_CHANNEL -> max(0, 805 - 80) = 725. unit_cost_cents 1155 / DONATION_ONLY -> 809."

# =============================================================================
# Table 4 (SKILL §1.4): Validation Rules Table (ordered by priority)
# The "who wins when two checks fire" answer is decided by this order alone.
# =============================================================================
validations:

  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present, and X-User-Role names a role declared in §1.7"
    error_id: ERR_MISSING_AUTH_CONTEXT
    http_status: 401
    applies_to: "all endpoints except POST /_clock/set_current_utc and POST /_seasons/roll"
    note: "Runs before any path or body inspection, so an unauthenticated request naming a non-existent product reports this error rather than a 404. Earlier half of the priority_pair_validation_conflict instance auth_precedes_existence."

  - priority: 2
    category: auth
    check: "The acting role is permitted for this operation"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all endpoints
    note: "Runs after authentication and before input-shape validation, so a forbidden role submitting a body that is missing a required field reports this error rather than a 400."

  - priority: 3
    category: existence
    check: "Path ids resolve, validated left-to-right; the first unresolved id decides the response"
    error_id: "ERR_{RESOURCE}_NOT_FOUND (one id per resource type: partner, product, line, order, season, liability, claim, allocation, distribution, audit, return-request, plan)"
    http_status: 404
    applies_to: "all endpoints with a path id"
    note: "POST /donation-products/{product_id}/lines validates product_id first; POST /allocations/{allocation_id}/distributions validates allocation_id only. Latter half of the auth_precedes_existence conflict."

  - priority: 4
    category: business_constraint
    check: "Input shape — every required body field is present, every enum member is declared, every integer range holds (quantity >= 1, allocated_units >= 1, shipped_units >= 1, winback_multiplier >= 1, approved_donation_ratio_units >= 1, founded_year in 1900..2026, need_verification_points in 0..5)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "every endpoint that declares body inputs minus the optional ones"
    note: "Runs after existence so a syntactically bad body on a non-existent id still reports the 404."

  - priority: 5
    category: state
    check: "The target resource is in a state from which the requested transition is declared"
    error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    applies_to: "every state-transition endpoint"
    note: "Earlier half of the priority_pair_validation_conflict instance state_precedes_fiscal: a commit whose season is not yet FROZEN reports this error even when the partner also exceeds its capacity ceiling."

  - priority: 6
    category: state
    check: "On the parallel fulfillment dimension, the target fulfillment_status must be strictly later than the stored one"
    error_id: ERR_FULFILLMENT_REGRESSION
    http_status: 409
    applies_to: "PATCH /sales-orders/{order_id}/fulfillment"
    note: "Distinct from priority 5 because order status and fulfillment_status are independent state dimensions on the same row; a PAID order with fulfillment_status DELIVERED cannot be moved back to PICKED."

  - priority: 7
    category: business_constraint
    check: "OCC guard — the request's expected_<parent>_version equals the stored parent version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /allocation-plans/{plan_id}/commit, POST /marketing-claims/{claim_id}/derive-build, PUT /impact-seasons/{season_id}/frozen-state, POST /impact-audits/{audit_id}/finalize, POST /return-requests, POST /allocations/{allocation_id}/reallocations"
    note: "Runs after the state precondition so a stale write against a terminal resource reports the state error, and before the fiscal checks so a stale commit never mutates capacity."

  - priority: 8
    category: business_safety
    check: "The naming partner's status is APPROVED or SUSPENDED at the instant of the write; SUSPENDED partners may only receive emergency priority_tier allocations"
    error_id: ERR_PARTNER_SUSPENDED
    http_status: 409
    applies_to: "POST /allocation-plans/{plan_id}/commit, POST /allocations/{allocation_id}/approve, POST /marketing-claims/{claim_id}/substantiate, POST /allocations/{allocation_id}/reversals"
    note: "Runs before the fiscal checks, so a suspended partner's over-capacity commit reports this error and not ERR_CAPACITY_EXCEEDED."

  - priority: 9
    category: business_safety
    check: "The partner is APPROVED (not merely SUSPENDED) for benefit allocations; INACTIVE, REJECTED and REJECTED_FINAL partners are never eligible"
    error_id: ERR_PARTNER_NOT_APPROVED
    http_status: 409
    applies_to: "POST /allocation-plans/{plan_id}/commit, POST /allocations/{allocation_id}/reversals, POST /allocations/{allocation_id}/approve"

  - priority: 10
    category: business_constraint
    check: "Uniqueness — order_number unique across SalesOrder; (partner_id, season_code) unique across PartnerCapacityProfile; (asset identity pair) unique across GivingPartnerVetting round_number per partner; at most one ImpactSeason has status FROZEN"
    error_id: ERR_DUPLICATE_RESOURCE
    http_status: 409
    applies_to: "POST /sales-orders, POST /giving-partners/{partner_id}/capacity-profiles, PUT /impact-seasons/{season_id}/frozen-state"

  - priority: 11
    category: business_constraint
    check: "Exactly one PartnerCapacityProfile must resolve for the (partner, season) pair; two selectable profiles are rejected rather than silently ranked"
    error_id: ERR_CAPACITY_PROFILE_AMBIGUOUS
    http_status: 409
    applies_to: "POST /allocation-plans/{plan_id}/commit, POST /allocations/{allocation_id}/approve"
    note: "The inverse case — one commitment covering several beneficiaries — is legal and is not an ambiguity; only a duplicate key is."

  - priority: 12
    category: business_temporal
    check: "The write instant must fall at or before the resolved season's freezes_at, and no write may mutate a season whose status is FINALIZED"
    error_id: ERR_SEASON_FROZEN
    http_status: 409
    applies_to: "POST /allocation-plans/{plan_id}/commit, POST /marketing-claims/{claim_id}/derive-build, POST /impact-seasons/{season_id}/close, POST /allocations/{allocation_id}/reversals"
    note: "Runs before the fiscal checks, so a post-freeze commit that is also over capacity reports this error rather than ERR_CAPACITY_EXCEEDED."

  - priority: 13
    category: business_temporal
    check: "The return request must fall inside the line's return window, unless the request is a defect claim or a window-reset is enabled for the season"
    error_id: ERR_RETURN_WINDOW_CLOSED
    http_status: 422
    applies_to: "POST /sales-orders/{order_id}/lines/{line_id}/return-requests, POST /return-requests/{return_id}/approve"

  - priority: 14
    category: business_constraint
    check: "Add-on tier selection must be computed on base_units before the surcharge; a request that would settle the tier boundary with the surcharge already included is rejected"
    error_id: ERR_ADDON_TIER_BOUNDARY
    http_status: 409
    applies_to: "POST /allocation-plans/{plan_id}/commit"

  - priority: 15
    category: business_fiscal
    check: "capacity_utilization_units must not exceed max_allocatable_units for the resolved (partner, season) capacity profile; a shortage of exactly zero units passes"
    error_id: ERR_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /allocation-plans/{plan_id}/commit, POST /allocations/{allocation_id}/approve, POST /allocations/{allocation_id}/reallocations"
    note: "Latter half of state_precedes_fiscal and of temporal_precedes_fiscal; earlier half of capacity_precedes_liability."

  - priority: 16
    category: business_fiscal
    check: "The liability's available units must cover the allocation; the shortage must be reported rather than clamped"
    error_id: ERR_LIABILITY_INSUFFICIENT
    http_status: 409
    applies_to: "POST /allocation-plans/{plan_id}/commit, POST /allocations/{allocation_id}/reversals"
    note: "Latter half of capacity_precedes_liability: an over-capacity commit against an under-covered liability reports ERR_CAPACITY_EXCEEDED."

  - priority: 17
    category: business_fiscal
    check: "The claim's stated_reference_period must be a window the season actually covers; a claim whose period is unmatched or null cannot be substantiated"
    error_id: ERR_CLAIM_PERIOD_UNSUPPORTED
    http_status: 409
    applies_to: "POST /marketing-claims/{claim_id}/substantiate, POST /marketing-claims/{claim_id}/derive-build"

  - priority: 18
    category: business_referential
    check: "Referenced resources agree on their external identity — the DonationProductLine's gtin must match the SalesOrderLine's gtin, the replacement_product_id must name an ACTIVE DonationProduct, and the allocation's claim_id must name a MarketingClaim for the same product"
    error_id: ERR_ENTITY_UNRESOLVED
    http_status: 409
    applies_to: "POST /sales-orders/{order_id}/lines, POST /return-requests/{return_id}/credit, POST /allocation-plans/{plan_id}/commit, POST /giving-partners/{partner_id}/capacity-profiles"
    note: "Runs last among business rules, so a referential mismatch on a request that is also over capacity reports ERR_CAPACITY_EXCEEDED."

# =============================================================================
# SKILL §1.0: Response Envelope (FIXED — emitted verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 5 (SKILL §1.5): API Endpoint Table
# Paths are rooted at /giving-partners. The canonical collection segment for
# GivingPartner is `giving-partners`, for PartnerCapacityProfile is
# `capacity-profiles`, for GivingPartnerVetting is `vetting-rounds`.
# =============================================================================
endpoints:

  # --- Giving partner plane -------------------------------------------------
  - method: POST
    path: "/impact-program/giving-partners"
    description: "Onboard a giving partner and open its first vetting round"
    roles: [GivingPartnerCoordinator]
    code: 201
    input: [legal_name, partner_type, operating_region, operating_state_code, "service_radius_miles?", registry_id, ein, founded_year, unduplicated_recipients_per_facility, need_tier]
    output: GivingPartner
    side_effects:
      - "Create GivingPartnerVetting round_number = 1 with outcome REQUESTED"
      - "registry_verified computed from registry_id and ein"
      - "need_score computed by calculations.need_score"
      - "GivingPartner.status → VETTING"

  - method: GET
    path: "/impact-program/giving-partners"
    description: "List giving partners with pagination and filtering"
    roles: [GivingPartnerCoordinator, ProvisioningPartner, AllocationPlanner, MarketingManager, ImpactAuditor]
    code: 200
    input: ["status?", "partner_type?", "operating_region?", "need_tier?", "limit?", "offset?"]
    output: "GivingPartner[]"
    side_effects: []

  - method: GET
    path: "/impact-program/giving-partners/{partner_id}"
    description: "Get one giving partner"
    roles: [GivingPartnerCoordinator, ProvisioningPartner, AllocationPlanner, MarketingManager, ImpactAuditor]
    code: 200
    input: []
    output: GivingPartner
    side_effects: []

  - method: PUT
    path: "/impact-program/giving-partners/{partner_id}"
    description: "Update a giving partner's declared profile; need_score is recomputed"
    roles: [GivingPartnerCoordinator]
    code: 200
    input: [legal_name, need_tier, unduplicated_recipients_per_facility, "service_radius_miles?"]
    output: GivingPartner
    side_effects:
      - "need_score recomputed by calculations.need_score"
      - "version incremented"

  - method: PUT
    path: "/impact-program/giving-partners/{partner_id}/status"
    description: "Move a giving partner between APPROVED, SUSPENDED and INACTIVE, cascading to capacity profiles and claims"
    roles: [GivingPartnerCoordinator, ImpactAuditor]
    code: 200
    input: [status]
    output: GivingPartner
    side_effects:
      - "PartnerCapacityProfile rows may move ACTIVE ↔ LOCKED or → SUPERSEDED"
      - "PENDING_ALLOCATION rows of this partner may → CANCELLED"
      - "MarketingClaim rows naming this partner may move SUBSTANTIATED ↔ SEASON_RESTRICTED"
      - "version incremented"

  - method: POST
    path: "/impact-program/giving-partners/{partner_id}/capacity-profiles"
    description: "Declare a partner's capacity ceiling for a season"
    roles: [GivingPartnerCoordinator]
    code: 201
    input: [season_code, max_allocatable_units, effective_from, effective_to]
    output: PartnerCapacityProfile
    side_effects:
      - "committed_units and reserved_units initialized to 0"
      - "capacity_utilization_units computed"

  - method: GET
    path: "/impact-program/giving-partners/{partner_id}/capacity-profiles"
    description: "Find the capacity profiles declared for a partner"
    roles: [GivingPartnerCoordinator, AllocationPlanner, ImpactAuditor]
    code: 200
    input: ["season_code?", "status?", "limit?", "offset?"]
    output: "PartnerCapacityProfile[]"
    side_effects: []

  - method: GET
    path: "/impact-program/capacity-profiles"
    description: "List capacity profiles across partners with filtering"
    roles: [AllocationPlanner, ImpactAuditor]
    code: 200
    input: ["partner_id?", "season_code?", "status?", "limit?", "offset?"]
    output: "PartnerCapacityProfile[]"
    side_effects: []

  - method: GET
    path: "/impact-program/capacity-profiles/{profile_id}"
    description: "Get one capacity profile"
    roles: [AllocationPlanner, ImpactAuditor]
    code: 200
    input: []
    output: PartnerCapacityProfile
    side_effects: []

  - method: GET
    path: "/impact-program/giving-partners/{partner_id}/vetting-rounds"
    description: "Find the vetting rounds opened for a partner"
    roles: [GivingPartnerCoordinator, ImpactAuditor]
    code: 200
    input: ["outcome?", "limit?", "offset?"]
    output: "GivingPartnerVetting[]"
    side_effects: []

  - method: GET
    path: "/impact-program/vetting-rounds/{vetting_id}"
    description: "Get one vetting round"
    roles: [GivingPartnerCoordinator, ImpactAuditor]
    code: 200
    input: []
    output: GivingPartnerVetting
    side_effects: []

  - method: PUT
    path: "/impact-program/vetting-rounds/{vetting_id}"
    description: "Record documents, evidence and outcome evidence for a vetting round"
    roles: [GivingPartnerCoordinator]
    code: 200
    input: [outcome, "registry_check_passed?", "tax_check_passed?", "on_site_check_passed?", "capacity_check_passed?", "need_verification_points?", "need_verification_evidence?", "valid_until?", "outcome_message?"]
    output: GivingPartnerVetting
    side_effects:
      - "need_score recomputed by calculations.need_score when need_verification_points changes"
      - "GivingPartner.status → CANDIDATE when the outcome is REQUESTED"

  - method: POST
    path: "/impact-program/vetting-rounds/{vetting_id}/approve"
    description: "Approve a vetting round; opens capacity profiles for every planned or open season"
    roles: [GivingPartnerCoordinator]
    code: 200
    input: []
    output: GivingPartnerVetting
    side_effects:
      - "GivingPartner.status → APPROVED"
      - "GivingPartner.last_vetted_at = current logical clock"
      - "Create PartnerCapacityProfile for every ImpactSeason in PLANNED or OPEN"

  - method: POST
    path: "/impact-program/vetting-rounds/{vetting_id}/reject"
    description: "Reject a vetting round; a second rejection finalizes the rejection"
    roles: [GivingPartnerCoordinator]
    code: 200
    input: [outcome_message]
    output: GivingPartnerVetting
    side_effects:
      - "GivingPartner.total_rejections incremented"
      - "GivingPartner.status → REJECTED, or → REJECTED_FINAL when total_rejections >= 2"

  - method: POST
    path: "/impact-program/vetting-rounds/{vetting_id}/reopen"
    description: "Reopen a rejected round as a new round"
    roles: [GivingPartnerCoordinator]
    code: 200
    input: []
    output: GivingPartnerVetting
    side_effects:
      - "Create GivingPartnerVetting with round_number = partner.vetting_round + 1"
      - "GivingPartner.status → VETTING"

  - method: GET
    path: "/impact-program/giving-partners/{partner_id}/allocations"
    description: "Find the allocations attributed to a partner"
    roles: [AllocationPlanner, FulfillmentOperator, ImpactAuditor, GivingPartnerCoordinator]
    code: 200
    input: ["impact_season_id?", "status?", "allocation_kind?", "limit?", "offset?"]
    output: "DonationAllocation[]"
    side_effects: []

  - method: GET
    path: "/impact-program/giving-partners/{partner_id}/attributed-units"
    description: "Roll up the units attributed to a partner and its share of the season total"
    roles: [ImpactAuditor, MarketingManager]
    code: 200
    input: []
    output: { partner_id: string, season_code: string, claim_attributed_units: integer, attributed_percentage: number, season_attributed_units_total: integer, cooperatives: "array" }
    side_effects: []

  - method: GET
    path: "/impact-program/giving-partners/{partner_id}/return-exposure"
    description: "Report the return volume attributed to a partner and the liability it retains"
    roles: [ImpactAuditor, ProvisioningPartner]
    code: 200
    input: []
    output: { partner_id: string, entrance_returns_units: integer, returned_units_total: integer, liability_units_retained: integer, lines: "array" }
    side_effects: []

  # --- Donation product plane ----------------------------------------------
  - method: POST
    path: "/impact-program/donation-products"
    description: "Create a donation product family"
    roles: [ProductDesigner]
    code: 201
    input: [product_name, product_kind, design_channel, obligation_model, approved_donation_ratio_units, retail_price_cents, unit_cost_cents, is_reusable]
    output: DonationProduct
    side_effects:
      - "design_weight_score computed by calculations.product_attribute_weight"
      - "status initialized to DRAFT"

  - method: GET
    path: "/impact-program/donation-products"
    description: "List donation products with filtering"
    roles: [ProductDesigner, AllocationPlanner, MarketingManager, CustomerService]
    code: 200
    input: ["status?", "design_channel?", "product_kind?", "limit?", "offset?"]
    output: "DonationProduct[]"
    side_effects: []

  - method: GET
    path: "/impact-program/donation-products/{product_id}"
    description: "Get one donation product"
    roles: [ProductDesigner, AllocationPlanner, MarketingManager, CustomerService, ImpactAuditor]
    code: 200
    input: []
    output: DonationProduct
    side_effects: []

  - method: PUT
    path: "/impact-program/donation-products/{product_id}"
    description: "Update a donation product or move it between DRAFT, ACTIVE and RETIRED"
    roles: [ProductDesigner]
    code: 200
    input: [status, "retail_price_cents?", "unit_cost_cents?", "approved_donation_ratio_units?"]
    output: DonationProduct
    side_effects:
      - "design_weight_score recomputed by calculations.product_attribute_weight"
      - "DonationProductLine rows can cascade between DRAFT, ACTIVE, RETIRED and ARCHIVED"

  - method: POST
    path: "/impact-program/donation-products/{product_id}/activate"
    description: "Activate a draft product once its design weight clears the threshold"
    roles: [ProductDesigner]
    code: 200
    input: []
    output: DonationProduct
    side_effects:
      - "status → ACTIVE and every DRAFT line → ACTIVE"
      - "obligation_units computed for every eligible line"

  - method: POST
    path: "/impact-program/donation-products/{product_id}/lines"
    description: "Create a sellable variant line under a donation product"
    roles: [ProductDesigner]
    code: 201
    input: [gtin, unit_size_label, is_essential_good, donation_eligible]
    output: DonationProductLine
    side_effects:
      - "unit_obligation_cost_cents computed by calculations.donation_unit_cost"
      - "design_variant_code computed by calculations.design_variant_selection"

  - method: GET
    path: "/impact-program/donation-products/{product_id}/lines"
    description: "Find the variant lines of a donation product"
    roles: [ProductDesigner, AllocationPlanner, CustomerService]
    code: 200
    input: ["status?", "donation_eligible?", "limit?", "offset?"]
    output: "DonationProductLine[]"
    side_effects: []

  - method: GET
    path: "/impact-program/donation-product-lines"
    description: "List variant lines across products with filtering"
    roles: [ProductDesigner, AllocationPlanner, CustomerService, ProvisioningPartner]
    code: 200
    input: ["donation_product_id?", "status?", "donation_eligible?", "limit?", "offset?"]
    output: "DonationProductLine[]"
    side_effects: []

  - method: GET
    path: "/impact-program/donation-product-lines/{line_id}"
    description: "Get one variant line"
    roles: [ProductDesigner, CustomerService, ProvisioningPartner]
    code: 200
    input: []
    output: DonationProductLine
    side_effects: []

  - method: PUT
    path: "/impact-program/donation-product-lines/{line_id}"
    description: "Update a variant line's catalog attributes"
    roles: [ProductDesigner]
    code: 200
    input: ["unit_size_label?", "is_essential_good?", "donation_eligible?"]
    output: DonationProductLine
    side_effects:
      - "obligation_units and unit_obligation_cost_cents recomputed"

  - method: GET
    path: "/impact-program/donation-products/{product_id}/liabilities"
    description: "Find the liability rows of a donation product"
    roles: [ImpactAuditor, MarketingManager, AllocationPlanner]
    code: 200
    input: ["impact_season_id?", "status?", "limit?", "offset?"]
    output: "DonationLiability[]"
    side_effects: []

  - method: GET
    path: "/impact-program/donation-products/{product_id}/claims"
    description: "Find the marketing claims made for a donation product"
    roles: [MarketingManager, ImpactAuditor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "MarketingClaim[]"
    side_effects: []

  # --- Season and allocation plane -----------------------------------------
  - method: POST
    path: "/impact-program/impact-seasons"
    description: "Open an impact season calendar"
    roles: [ImpactAuditor]
    code: 201
    input: [season_code, starts_at, ends_at, freezes_at]
    output: ImpactSeason
    side_effects:
      - "status initialized to PLANNED"

  - method: GET
    path: "/impact-program/impact-seasons"
    description: "List impact seasons"
    roles: [ImpactAuditor, AllocationPlanner, MarketingManager, GivingPartnerCoordinator]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "ImpactSeason[]"
    side_effects: []

  - method: GET
    path: "/impact-program/impact-seasons/{season_id}"
    description: "Get one impact season with its aggregates"
    roles: [ImpactAuditor, AllocationPlanner, MarketingManager, GivingPartnerCoordinator]
    code: 200
    input: []
    output: ImpactSeason
    side_effects: []

  - method: PUT
    path: "/impact-program/impact-seasons/{season_id}/frozen-state"
    description: "Set a season's frozen state; the obligation snapshot is taken or re-taken"
    roles: [ImpactAuditor]
    code: 200
    input: [is_final, expected_season_version, "requested_season_code?"]
    output: ImpactSeason
    side_effects:
      - "ImpactSeason.status → FROZEN when is_final is true, else → OPEN"
      - "Every DonationLiability for the season → FROZEN or ACCUMULATING"
      - "frozen_units snapshot from provisional_liability_units"
      - "claim_frozen_units_total recomputed"
      - "increments ImpactSeason.version by 1"

  - method: POST
    path: "/impact-program/impact-seasons/{season_id}/close"
    description: "Close a season once every liability has been carried"
    roles: [ImpactAuditor]
    code: 200
    input: []
    output: ImpactSeason
    side_effects:
      - "ImpactSeason.status → CLOSED and every liability → CLOSED"
      - "increments ImpactSeason.version by 1"

  - method: POST
    path: "/impact-program/impact-seasons/{season_id}/reopen"
    description: "Reopen a closed season before its audit finalizes"
    roles: [ImpactAuditor]
    code: 200
    input: []
    output: ImpactSeason
    side_effects:
      - "ImpactSeason.status → OPEN and every liability → ACCUMULATING"

  - method: GET
    path: "/impact-program/impact-seasons/{season_id}/allocations"
    description: "Find the allocations of a season"
    roles: [AllocationPlanner, ImpactAuditor, FulfillmentOperator]
    code: 200
    input: ["status?", "allocation_kind?", "giving_partner_id?", "limit?", "offset?"]
    output: "DonationAllocation[]"
    side_effects: []

  - method: GET
    path: "/impact-program/impact-seasons/{season_id}/distributions"
    description: "Find the distributions of a season"
    roles: [FulfillmentOperator, ImpactAuditor, GivingPartnerCoordinator]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "DonationDistribution[]"
    side_effects: []

  - method: GET
    path: "/impact-program/impact-seasons/{season_id}/claims"
    description: "Find the claims of a season"
    roles: [MarketingManager, ImpactAuditor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "MarketingClaim[]"
    side_effects: []

  - method: GET
    path: "/impact-program/impact-seasons/{season_id}/liabilities"
    description: "Find the liabilities of a season"
    roles: [ImpactAuditor, AllocationPlanner, MarketingManager]
    code: 200
    input: ["donation_product_id?", "status?", "limit?", "offset?"]
    output: "DonationLiability[]"
    side_effects: []

  - method: GET
    path: "/impact-program/impact-seasons/{season_id}/summary"
    description: "Roll up a season's claimed, shipped, received and carried units"
    roles: [ImpactAuditor, MarketingManager]
    code: 200
    input: []
    output: { season_id: string, season_code: string, claim_frozen_units_total: integer, total_shipped_units: integer, total_received_units: integer, liability_carry_in_units: integer, liability_reconciliation_delta: integer, attributed_units_total: integer, attributed_percentage_total: number }
    side_effects: []

  - method: POST
    path: "/impact-program/allocation-plans/{plan_id}/commit"
    description: "Commit one benefit allocation from a plan to a single partner, guarded by the partner version"
    roles: [AllocationPlanner]
    code: 200
    input: [giving_partner_id, claim_id, donation_product_id, allocated_units, priority_tier, liquidity_cap, "contract_id?", expected_partner_version]
    output: DonationAllocation
    side_effects:
      - "Create DonationAllocation with status PENDING_ALLOCATION then APPROVED"
      - "rank_score computed by calculations.partner_rank_score"
      - "PartnerCapacityProfile.committed_units incremented"
      - "increments GivingPartner.version by 1"

  - method: POST
    path: "/impact-program/allocation-plans/{plan_id}/allocate"
    description: "Allocate a finite pool across the eligible partner pool by weighted waterfall"
    roles: [AllocationPlanner]
    code: 200
    input: [claim_id, donation_product_id, liquidity_cap, baseline_units, demand_units, pool_units, "contract_id?"]
    output: { plan_id: string, allocations: "array", partner_count: integer, attributed_units_total: integer, liquidity_cap: integer, rounds_applied: integer }
    side_effects:
      - "Create one DonationAllocation per winning partner"
      - "calculations.weighted_allocation determines the unit counts"
      - "capacity_utilization_units recomputed on every participating profile"

  - method: POST
    path: "/impact-program/allocation-plans/{plan_id}/revert"
    description: "Revert a plan's donor lines out of a vesting season and canonicalize the successor season"
    roles: [AllocationPlanner]
    code: 200
    input: [expected_season_version, reason]
    output: { plan_id: string, donor_lines_reverted: integer, season_code: string, carried_out_units: integer }
    side_effects:
      - "DonationProductLine rows move VESTED → ACTIVE"
      - "The successor season's carry is canonicalized under the FROZEN season"

  - method: GET
    path: "/impact-program/allocation-plans/{plan_id}"
    description: "Get a plan's committed allocations and roll-up totals"
    roles: [AllocationPlanner, ImpactAuditor]
    code: 200
    input: []
    output: { plan_id: string, season_code: string, liquidity_cap: integer, partner_count: integer, attributed_units_total: integer, allocations: "array" }
    side_effects: []

  # --- Allocation and distribution lifecycle -------------------------------
  - method: GET
    path: "/impact-program/allocations"
    description: "List allocations with filtering"
    roles: [AllocationPlanner, FulfillmentOperator, ImpactAuditor, GivingPartnerCoordinator]
    code: 200
    input: ["giving_partner_id?", "impact_season_id?", "donation_product_id?", "donation_liability_id?", "claim_id?", "status?", "allocation_kind?", "limit?", "offset?"]
    output: "DonationAllocation[]"
    side_effects: []

  - method: GET
    path: "/impact-program/allocations/{allocation_id}"
    description: "Get one allocation"
    roles: [AllocationPlanner, FulfillmentOperator, ImpactAuditor, GivingPartnerCoordinator]
    code: 200
    input: []
    output: DonationAllocation
    side_effects: []

  - method: POST
    path: "/impact-program/allocations/{allocation_id}/approve"
    description: "Approve a pending allocation, debiting the partner's committed units"
    roles: [AllocationPlanner]
    code: 200
    input: [expected_allocation_version]
    output: DonationAllocation
    side_effects:
      - "status → APPROVED"
      - "PartnerCapacityProfile.committed_units incremented, status recomputed"
      - "capacity_utilization_units recomputed on the profile and on GivingPartner"
      - "increments DonationAllocation.version by 1"

  - method: POST
    path: "/impact-program/allocations/{allocation_id}/cancel"
    description: "Cancel an approved allocation before any unit ships"
    roles: [AllocationPlanner]
    code: 200
    input: [expected_allocation_version]
    output: DonationAllocation
    side_effects:
      - "status → CANCELLED and PartnerCapacityProfile.committed_units decremented"
      - "PartnerCapacityProfile.status recomputed from EXHAUSTED to ACTIVE when headroom returns"
      - "increments GivingPartner.version by 1"

  - method: POST
    path: "/impact-program/allocations/{allocation_id}/reallocations"
    description: "Re-activate a cancelled allocation against another partner"
    roles: [AllocationPlanner]
    code: 200
    input: [expected_allocation_version, giving_partner_id, allocated_units]
    output: DonationAllocation
    side_effects:
      - "status CANCELLED → APPROVED with refreshed rank_score and created_at"
      - "effects of calculations.partner_rank_score recomputed across the plan's candidate pool"
      - "increments GivingPartner.version by 1"

  - method: POST
    path: "/impact-program/allocations/{allocation_id}/reversals"
    description: "Reverse a received allocation and carry the make-up units into the next season"
    roles: [AllocationPlanner]
    code: 200
    input: [allocated_units, claim_id, priority_tier, reason]
    output: DonationAllocation
    side_effects:
      - "Create a child DonationAllocation with allocation_kind REVERSAL"
      - "PartnerCapacityProfile.reserved_units incremented"
      - "Create the make-up DonationLiability for the next ImpactSeason"

  - method: POST
    path: "/impact-program/allocations/{allocation_id}/distributions"
    description: "Ship units against an approved allocation"
    roles: [FulfillmentOperator]
    code: 201
    input: [shipped_units, shipment_reference, carrier_code]
    output: DonationDistribution
    side_effects:
      - "Create DonationDistribution with status SHIPPED and shipped_at stamped"
      - "DonationAllocation.status → SHIPPED"
      - "ImpactSeason.total_shipped_units recomputed"

  - method: GET
    path: "/impact-program/allocations/{allocation_id}/distributions"
    description: "Find the distributions shipped against an allocation"
    roles: [FulfillmentOperator, ImpactAuditor, GivingPartnerCoordinator]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: "DonationDistribution[]"
    side_effects: []

  - method: GET
    path: "/impact-program/distributions"
    description: "List distributions with filtering"
    roles: [FulfillmentOperator, ImpactAuditor, GivingPartnerCoordinator]
    code: 200
    input: ["allocation_id?", "giving_partner_id?", "impact_season_id?", "status?", "limit?", "offset?"]
    output: "DonationDistribution[]"
    side_effects: []

  - method: GET
    path: "/impact-program/distributions/{distribution_id}"
    description: "Get one distribution"
    roles: [FulfillmentOperator, ImpactAuditor, GivingPartnerCoordinator]
    code: 200
    input: []
    output: DonationDistribution
    side_effects: []

  - method: POST
    path: "/impact-program/distributions/{distribution_id}/receipts"
    description: "Confirm partner receipt, in whole or in part"
    roles: [GivingPartnerCoordinator]
    code: 200
    input: [received_units, receipt_reference]
    output: DonationDistribution
    side_effects:
      - "received_units accumulated and impact_units_confirmed set when complete"
      - "DonationAllocation.status moves SHIPPED → PARTIALLY_RECEIVED → RECEIVED"
      - "GivingPartner.impact_units_total recomputed"
      - "PartnerCapacityProfile.capacity_utilization_units recomputed"

  - method: POST
    path: "/impact-program/distributions/{distribution_id}/complete"
    description: "Close a fully received distribution and refresh the partner's cycle time"
    roles: [FulfillmentOperator]
    code: 200
    input: []
    output: DonationDistribution
    side_effects:
      - "status → COMPLETED"
      - "GivingPartner.avg_distribution_completion_days recomputed"

  - method: POST
    path: "/impact-program/distributions/{distribution_id}/discrepancies"
    description: "Raise a discrepancy for a short receipt"
    roles: [FulfillmentOperator]
    code: 200
    input: [exception_reason]
    output: DonationDistribution
    side_effects:
      - "status → DISCREPANCY_CLAIMED and discrepancy_units computed"

  - method: POST
    path: "/impact-program/distributions/{distribution_id}/write-off"
    description: "Write off a short receipt after the reconciliation window"
    roles: [FulfillmentOperator]
    code: 200
    input: [exception_reason]
    output: DonationDistribution
    side_effects:
      - "status → WRITTEN_OFF"

  - method: POST
    path: "/impact-program/distributions/{distribution_id}/void"
    description: "Void an unshipped distribution"
    roles: [FulfillmentOperator]
    code: 200
    input: [exception_reason]
    output: DonationDistribution
    side_effects:
      - "status → VOIDED and ImpactSeason.total_shipped_units recomputed excluding voided rows"
