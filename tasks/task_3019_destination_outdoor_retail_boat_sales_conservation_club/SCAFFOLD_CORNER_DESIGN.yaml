  # =========================================================================
  # Section: validations
  # =========================================================================
  - section: validations
    instances:

      - name: missing_auth_header_returns_unauthenticated
        claim_type: violation_to_error
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "A store write without the role header returns ERR_UNAUTHENTICATED with 401, before the body is even parsed."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /stores"
              payload: { name: "Ozark Flagship", state_code: "MO", dealer_license_no: "MO-DLR-4417", dwell_capacity_minutes: 60000, load_bays_total: 4 }
              captures: { err: $.data.error_id }
          assert:
            - "the response is data.error_id == ERR_UNAUTHENTICATED with http 401"
            - "no Store row was created, so a follow-up authenticated list returns total_count == 0"

      - name: role_not_permitted_returns_forbidden_role
        claim_type: violation_to_error
        grounds:
          - validations[priority=2]
          - errors[ERR_FORBIDDEN_ROLE]
        distinguishing_aspect: "An authenticated member attempting to open a venue returns ERR_FORBIDDEN_ROLE with 403, and the store remains unopened."
        test_recipe:
          setup: ["a store with a planned aquarium and one member"]
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Ozark Flagship", state_code: "MO", dealer_license_no: "MO-DLR-4417", dwell_capacity_minutes: 60000, load_bays_total: 4 }
              as: PlatformAdmin
              captures: { st_id: $.data.id }
            - call: "POST /stores/${st_id}/members"
              payload: { email: "m_rf@x.com", full_name: "Rae Fenn", donation_opt_in: false }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /stores/${st_id}/attractions"
              payload: { attraction_type: "AQUARIUM", capacity_units: 20, dwell_cost_minutes: 30 }
              as: StoreManager
              captures: { at_id: $.data.id }
          trigger:
            - call: "POST /stores/attractions/${at_id}/open"
              payload: {}
              as: Member
              as_user_id: "${m_id}"
              captures: { err: $.data.error_id }
            - call: "GET /stores/attractions/${at_id}"
              as: StoreManager
          assert:
            - "the open is rejected with data.error_id == ERR_FORBIDDEN_ROLE and http 403"
            - "Attraction.${at_id}.status == PLANNED after the rejection"
            - "the rejection is 403 rather than 401, so the header was recognised as an authenticated-but-wrong role"

      - name: expired_waiver_blocks_a_lane_session
        claim_type: violation_to_error
        grounds:
          - validations[priority=10]
          - errors[ERR_WAIVER_EXPIRED]
        distinguishing_aspect: "A waiver whose expires_on equals the clock instant is still accepted, while one day earlier is rejected, so the expiry comparison is inclusive on the signing date."
        test_recipe:
          setup: ["a store with an open archery range and one member holding a one-day waiver"]
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Ozark Flagship", state_code: "MO", dealer_license_no: "MO-DLR-4417", dwell_capacity_minutes: 60000, load_bays_total: 4 }
              as: PlatformAdmin
              captures: { st_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /stores/${st_id}/attractions"
              payload: { attraction_type: "ARCHERY_RANGE", capacity_units: 12, dwell_cost_minutes: 45 }
              as: StoreManager
              captures: { at_id: $.data.id }
            - call: "POST /stores/attractions/${at_id}/open"
              payload: {}
              as: StoreManager
            - call: "POST /stores/${st_id}/members"
              payload: { email: "m_wx@x.com", full_name: "Wren Axe", donation_opt_in: false }
              as: Anonymous
              captures: { m_id: $.data.id }
