# =============================================================================
# Scaffold: waste-diversion-zero-waste (v1)
# Waste Diversion & Zero-Waste Certification Program
# =============================================================================

scenario: |
  Waste Diversion & Zero-Waste Certification Program (facility sustainability team):
  waste stream characterization & audit, hauler/vendor weight ticket collection &
  data validation, diversion rate calculation & certification threshold, contamination
  monitoring & corrective training, vendor contract & rebate on recyclables, site-level
  goals & scorecard, certification application & annual recertification, cost avoidance
  reporting

domain_name: waste-diversion-zero-waste
api_prefix: "/"

# =============================================================================
# §0: Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: posture_driven_gating
  complexity_layers:
    - optimistic_concurrency
    - dual_variant_calculation
    - rate_threshold_triggers
    - ops_run_checkpoint
  entity_topology: flat            # all entities are peers, linked by FK references
  state_machine_shape: cyclic      # ticket resubmission loop, training re-open loop, application revise loop
  relationship_patterns:
    - one_to_many                  # Site -> tickets/audits/events/goals/periods/applications
    - cross_aggregate              # WeightTicket -> Vendor + VendorContract; CertificationApplication -> ScorecardPeriod
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Site
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Facility display name" }
      - { name: landfill_tip_fee_per_ton_cents, type: integer, source: input, description: "Avoided landfill tipping fee per short ton, used by cost_avoidance" }
      - { name: max_rebate_rate_per_ton_cents, type: integer, source: input, description: "Site policy cap on VendorContract.rebate_per_ton_cents (fiscal guard)" }
      - { name: certification_tier, type: enum, source: computed, description: "NONE | BRONZE | SILVER | GOLD | ZERO_WASTE — derived from latest APPROVED, non-LAPSED, non-SUPERSEDED CertificationApplication; NONE when none exists", constraints: "enum: NONE, BRONZE, SILVER, GOLD, ZERO_WASTE" }
      - { name: program_standing, type: enum, source: computed, description: "GOOD_STANDING | WATCH | PROBATION — derived from non-terminal ContaminationEvents (see program_standing calculation)", constraints: "enum: GOOD_STANDING, WATCH, PROBATION" }

  - name: Vendor
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Hauler / recycler legal name" }
      - { name: vendor_type, type: enum, source: input, description: "HAULER | RECYCLER | PROCESSOR", constraints: "enum: HAULER, RECYCLER, PROCESSOR" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED — initial ACTIVE; set via POST /vendors/{id}/set_status", constraints: "enum: ACTIVE, SUSPENDED" }

  - name: VendorContract
    parent: null
    common_fields: true
    fields:
      - { name: site_id, type: string, source: input, description: "FK -> Site.id; contracted facility" }
      - { name: vendor_id, type: string, source: input, description: "FK -> Vendor.id; contracted hauler/recycler" }
      - { name: material_stream, type: enum, source: input, description: "Stream covered by this contract", constraints: "enum: MIXED_RECYCLABLES, CARDBOARD, COMPOST_ORGANICS, MIXED_SOLID_WASTE, E_WASTE" }
      - { name: rebate_per_ton_cents, type: integer, source: input, description: "Rebate paid to the site per diverted short ton on this contract" }
      - { name: contamination_penalty_per_ton_cents, type: integer, source: input, description: "Penalty charged per ton when contamination_pct >= 10 on a ticket" }
      - { name: window_start, type: string, source: input, description: "Contract window start date (ISO date), INCLUSIVE (closed interval)" }
      - { name: window_end, type: string, source: input, description: "Contract window end date (ISO date), INCLUSIVE (closed interval)" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | SUSPENDED | TERMINATED | EXPIRED — initial DRAFT", constraints: "enum: DRAFT, ACTIVE, SUSPENDED, TERMINATED, EXPIRED" }

  - name: WeightTicket
    parent: null
    common_fields: true
    fields:
      - { name: site_id, type: string, source: input, description: "FK -> Site.id; facility that generated the load" }
      - { name: vendor_id, type: string, source: input, description: "FK -> Vendor.id; hauler that hauled the load (must equal X-User-ID when created by VendorUser)" }
      - { name: contract_id, type: string, source: input, description: "FK -> VendorContract.id; contract the load bills against" }
      - { name: material_stream, type: enum, source: input, description: "Stream of the load; must equal the contract's material_stream", constraints: "enum: MIXED_RECYCLABLES, CARDBOARD, COMPOST_ORGANICS, MIXED_SOLID_WASTE, E_WASTE" }
      - { name: disposal_route, type: enum, source: input, description: "RECYCLING | COMPOSTING | REUSE | LANDFILL | ENERGY_RECOVERY — diverted routes are RECYCLING, COMPOSTING, REUSE", constraints: "enum: RECYCLING, COMPOSTING, REUSE, LANDFILL, ENERGY_RECOVERY" }
      - { name: gross_weight_lbs, type: integer, source: input, description: "Scale gross weight in pounds" }
      - { name: tare_weight_lbs, type: integer, source: input, description: "Scale tare weight in pounds" }
      - { name: net_weight_lbs, type: integer, source: computed, description: "gross_weight_lbs - tare_weight_lbs; server-computed, client input ignored" }
      - { name: contamination_pct, type: number, source: input, required: false, description: "Vendor-reported contamination percentage 0..100; null treated as 0 in rebate math" }
      - { name: ticket_date, type: string, source: input, description: "ISO date of the haul" }
      - { name: external_ticket_ref, type: string, source: input, description: "Hauler ticket number; unique per vendor (vendor_id, external_ticket_ref)" }
      - { name: validation_status, type: enum, source: system, description: "PENDING | VALIDATED | REJECTED | VOIDED — initial PENDING", constraints: "enum: PENDING, VALIDATED, REJECTED, VOIDED" }
      - { name: rejection_reason, type: string, source: system, required: false, description: "Reason recorded on reject" }

  - name: WasteAudit
    parent: null
    common_fields: false   # immutable measurement log: id + created_at only; no update endpoint
    fields:
      - { name: site_id, type: string, source: input, description: "FK -> Site.id; audited facility" }
      - { name: audit_date, type: string, source: input, description: "ISO date the characterization audit was performed" }
      - { name: auditor_name, type: string, source: input, description: "Lead auditor name" }
      - { name: stream_findings, type: array, source: input, description: "Array of { material_stream, sampled_weight_lbs, contamination_pct } measured per stream" }

  - name: ContaminationEvent
    parent: null
    common_fields: true
    fields:
      - { name: site_id, type: string, source: input, description: "FK -> Site.id; facility where contamination was observed" }
      - { name: ticket_id, type: string, source: input, required: false, description: "FK -> WeightTicket.id; offending load, when event is tied to a ticket" }
      - { name: audit_id, type: string, source: input, required: false, description: "FK -> WasteAudit.id; source audit, when event was found during an audit" }
      - { name: event_date, type: string, source: input, description: "ISO date the contamination was observed" }
      - { name: material_stream, type: enum, source: input, description: "Affected stream", constraints: "enum: MIXED_RECYCLABLES, CARDBOARD, COMPOST_ORGANICS, MIXED_SOLID_WASTE, E_WASTE" }
      - { name: contamination_pct, type: number, source: input, description: "Measured contamination percentage 0..100" }
      - { name: severity, type: enum, source: computed, description: "MINOR | MAJOR | CRITICAL — contamination_pct < 5 MINOR; 5 <= pct < 10 MAJOR; pct >= 10 CRITICAL", constraints: "enum: MINOR, MAJOR, CRITICAL" }
      - { name: status, type: enum, source: system, description: "OPEN | TRAINING_ASSIGNED | TRAINING_COMPLETED | VERIFIED_CLOSED | DISMISSED — initial OPEN", constraints: "enum: OPEN, TRAINING_ASSIGNED, TRAINING_COMPLETED, VERIFIED_CLOSED, DISMISSED" }
      - { name: trainee_name, type: string, source: system, required: false, description: "Person assigned corrective training (set on assign_training)" }
      - { name: training_due_date, type: string, source: system, required: false, description: "Training due date (set on assign_training)" }
      - { name: dismiss_reason, type: string, source: system, required: false, description: "Reason recorded on dismiss" }

  - name: SiteGoal
    parent: null
    common_fields: true
    fields:
      - { name: site_id, type: string, source: input, description: "FK -> Site.id; goal owner" }
      - { name: metric, type: enum, source: input, description: "DIVERSION_RATE | COST_AVOIDANCE | CONTAMINATION_EVENTS — which certified period metric is evaluated", constraints: "enum: DIVERSION_RATE, COST_AVOIDANCE, CONTAMINATION_EVENTS" }
      - { name: target_value, type: number, source: input, description: "Target: pct for DIVERSION_RATE, cents for COST_AVOIDANCE, max event count for CONTAMINATION_EVENTS" }
      - { name: window_start, type: string, source: input, description: "Goal window start date (ISO date), INCLUSIVE (half-open interval [start, end))" }
      - { name: window_end, type: string, source: input, description: "Goal window end date (ISO date), EXCLUSIVE (half-open interval [start, end))" }
      - { name: status, type: enum, source: system, description: "ACTIVE | ACHIEVED | MISSED | CANCELLED — initial ACTIVE; ACHIEVED/MISSED set at period close", constraints: "enum: ACTIVE, ACHIEVED, MISSED, CANCELLED" }

  - name: ScorecardPeriod
    parent: null
    common_fields: true
    fields:
      - { name: site_id, type: string, source: input, description: "FK -> Site.id; scorecard owner" }
      - { name: period_start, type: string, source: input, description: "Period start date (ISO date), INCLUSIVE (half-open interval [start, end))" }
      - { name: period_end, type: string, source: input, description: "Period end date (ISO date), EXCLUSIVE (half-open interval [start, end))" }
      - { name: status, type: enum, source: system, description: "OPEN | CLOSED — initial OPEN; at most one OPEN period per site", constraints: "enum: OPEN, CLOSED" }
      - { name: total_waste_lbs_validated, type: integer, source: computed, description: "Sum of net_weight_lbs over VALIDATED tickets with ticket_date in [period_start, period_end); live while OPEN, frozen at close" }
      - { name: diverted_lbs_validated, type: integer, source: computed, description: "Same set, restricted to disposal_route IN {RECYCLING, COMPOSTING, REUSE}" }
      - { name: diversion_rate_certified_pct, type: number, source: computed, description: "round_half_up(diverted_lbs_validated * 100 / total_waste_lbs_validated, 2); 0.00 when total is 0" }
      - { name: total_waste_lbs_provisional, type: integer, source: computed, description: "Sum of net_weight_lbs over PENDING + VALIDATED tickets in window (REJECTED/VOIDED excluded)" }
      - { name: diverted_lbs_provisional, type: integer, source: computed, description: "Same provisional set, diverted routes only" }
      - { name: diversion_rate_provisional_pct, type: number, source: computed, description: "round_half_up(diverted_lbs_provisional * 100 / total_waste_lbs_provisional, 2); 0.00 when total is 0" }
      - { name: rebate_estimate_cents, type: integer, source: computed, description: "Sum of per-ticket estimated rebates over VALIDATED diverted tickets in window (ticket-reported contamination); see ticket_rebate_estimate" }
      - { name: rebate_settled_cents, type: integer, source: computed, description: "Audit-adjusted settlement computed at period close; null while OPEN" }
      - { name: cost_avoided_cents, type: integer, source: computed, description: "Landfill-fee avoidance computed at period close with per-ticket rounding; null while OPEN" }
      - { name: contamination_event_count, type: integer, source: computed, description: "Count of non-DISMISSED ContaminationEvents with event_date in [period_start, period_end); frozen at close" }

  - name: CertificationApplication
    parent: null
    common_fields: true
    fields:
      - { name: site_id, type: string, source: input, description: "FK -> Site.id; applicant facility" }
      - { name: reporting_period_id, type: string, source: input, description: "FK -> ScorecardPeriod.id; the CLOSED period whose certified metrics justify the application" }
      - { name: level_requested, type: enum, source: input, description: "BRONZE | SILVER | GOLD | ZERO_WASTE", constraints: "enum: BRONZE, SILVER, GOLD, ZERO_WASTE" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | UNDER_REVIEW | APPROVED | REJECTED | WITHDRAWN | SUPERSEDED | LAPSED — initial DRAFT", constraints: "enum: DRAFT, SUBMITTED, UNDER_REVIEW, APPROVED, REJECTED, WITHDRAWN, SUPERSEDED, LAPSED" }
      - { name: submitted_by, type: string, source: system, required: false, description: "X-User-ID of the SustainabilityManager who submitted (set on submit)" }
      - { name: decided_by, type: string, source: system, required: false, description: "X-User-ID of the CertificationOfficer who decided (set on decide)" }
      - { name: decided_at, type: string, source: system, required: false, description: "Logical-clock timestamp of the decide call (drives the 12-month lapse)" }

# =============================================================================
# §1.2: State Machine Table
# =============================================================================
state_machines:
  - entity: WeightTicket
    field: validation_status
    initial_state: PENDING
    terminal_states: [VOIDED]
    transitions:
      - from: PENDING
        to: VALIDATED
        trigger: "POST /tickets/{ticket_id}/validate"
        actor: DataSteward
        preconditions:
          - "Ticket is PENDING (else ERR_TICKET_NOT_PENDING)"
          - "Contract is ACTIVE (else ERR_CONTRACT_NOT_ACTIVE)"
          - "Vendor is ACTIVE (else ERR_VENDOR_NOT_ACTIVE)"
          - "ticket_date is not later than the logical clock date (else ERR_TICKET_DATE_FUTURE)"
          - "An OPEN ScorecardPeriod of the site contains ticket_date in [period_start, period_end) (else ERR_NO_OPEN_PERIOD)"
        side_effects:
          - "ScorecardPeriod validated totals += net_weight_lbs (diverted pounds too when route is diverted); provisional totals unchanged in membership (ticket already counted while PENDING)"
          - "rebate_estimate_cents accrues per ticket_rebate_estimate"
          - "ScorecardPeriod.version increments"

      - from: PENDING
        to: REJECTED
        trigger: "POST /tickets/{ticket_id}/reject"
        actor: DataSteward
        preconditions:
          - "Ticket is PENDING (else ERR_TICKET_NOT_PENDING)"
        side_effects:
          - "rejection_reason recorded"
          - "Ticket drops out of the provisional set; ScorecardPeriod provisional totals shrink"
          - "ScorecardPeriod.version increments"

      - from: REJECTED
        to: PENDING
        trigger: "POST /tickets/{ticket_id}/resubmit"
        actor: VendorUser
        preconditions:
          - "Ticket is REJECTED (else ERR_TICKET_NOT_REJECTED)"
          - "Acting VendorUser owns the ticket (X-User-ID == vendor_id, else ERR_VENDOR_MISMATCH)"
        side_effects:
          - "Corrected fields applied; net_weight_lbs recomputed"
          - "rejection_reason cleared"
          - "Ticket re-enters the provisional set; ScorecardPeriod provisional totals grow"
          - "ScorecardPeriod.version increments"

      - from: VALIDATED
        to: VOIDED
        trigger: "POST /tickets/{ticket_id}/void or system (CRITICAL ContaminationEvent linked to this ticket)"
        actor: "DataSteward or system"
        preconditions:
          - "Ticket is VALIDATED (else ERR_TICKET_NOT_VALIDATED)"
        side_effects:
          - "ScorecardPeriod validated totals -= net_weight_lbs (compensates the validate accrual exactly)"
          - "rebate_estimate_cents reverses the ticket's accrued estimate exactly"
          - "ScorecardPeriod.version increments"

  - entity: ContaminationEvent
    field: status
    initial_state: OPEN
    terminal_states: [VERIFIED_CLOSED, DISMISSED]
    transitions:
      - from: OPEN
        to: TRAINING_ASSIGNED
        trigger: "POST /contamination_events/{event_id}/assign_training"
        actor: WasteAuditor
        preconditions:
          - "Event is OPEN (else ERR_INVALID_STATE)"
        side_effects:
          - "trainee_name and training_due_date recorded"
          - "Site.program_standing re-derived (non-terminal event still counts)"

      - from: TRAINING_ASSIGNED
        to: TRAINING_COMPLETED
        trigger: "POST /contamination_events/{event_id}/complete_training"
        actor: WasteAuditor
        preconditions:
          - "Event is TRAINING_ASSIGNED (else ERR_INVALID_STATE)"
        side_effects: []

      - from: TRAINING_COMPLETED
        to: VERIFIED_CLOSED
        trigger: "POST /contamination_events/{event_id}/verify (passed=true)"
        actor: WasteAuditor
        preconditions:
          - "Event is TRAINING_COMPLETED (else ERR_INVALID_STATE)"
        side_effects:
          - "Site.program_standing re-derived (event becomes terminal)"

      - from: TRAINING_COMPLETED
        to: OPEN
        trigger: "POST /contamination_events/{event_id}/verify (passed=false)"
        actor: WasteAuditor
        preconditions:
          - "Event is TRAINING_COMPLETED (else ERR_INVALID_STATE)"
        side_effects:
          - "trainee_name and training_due_date cleared (loop restarts)"
          - "Site.program_standing re-derived"

      - from: OPEN
        to: DISMISSED
        trigger: "POST /contamination_events/{event_id}/dismiss"
        actor: WasteAuditor
        preconditions:
          - "Event is OPEN (else ERR_INVALID_STATE)"
        side_effects:
          - "dismiss_reason recorded"
          - "Event excluded from contamination_event_count and program_standing derivation"

  - entity: CertificationApplication
    field: status
    initial_state: DRAFT
    terminal_states: [WITHDRAWN, SUPERSEDED, LAPSED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /certification_applications/{application_id}/submit"
        actor: SustainabilityManager
        preconditions:
          - "Application is DRAFT (else ERR_APPLICATION_NOT_DRAFT)"
          - "Site.program_standing is not PROBATION (else ERR_STANDING_PROBATION)"
          - "reporting_period_id names a ScorecardPeriod of the same site (else ERR_CROSS_SITE_REFERENCE)"
          - "Reporting period is CLOSED (else ERR_PERIOD_NOT_CLOSED)"
        side_effects:
          - "submitted_by := X-User-ID"

      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /certification_applications/{application_id}/start_review"
        actor: CertificationOfficer
        preconditions:
          - "Application is SUBMITTED (else ERR_APPLICATION_NOT_SUBMITTED)"
        side_effects: []

      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /certification_applications/{application_id}/decide (outcome=APPROVED)"
        actor: CertificationOfficer
        preconditions:
          - "Application is UNDER_REVIEW (else ERR_APPLICATION_NOT_IN_REVIEW)"
          - "X-User-ID != submitted_by (else ERR_SEGREGATION_OF_DUTIES)"
          - "Reporting period diversion_rate_certified_pct >= threshold(level_requested) (else ERR_CERTIFICATION_THRESHOLD_NOT_MET)"
        side_effects:
          - "decided_by := X-User-ID; decided_at := logical clock"
          - "Any prior APPROVED application of the same site -> SUPERSEDED"
          - "Site.certification_tier := level_requested"

      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "POST /certification_applications/{application_id}/decide (outcome=REJECTED)"
        actor: CertificationOfficer
        preconditions:
          - "Application is UNDER_REVIEW (else ERR_APPLICATION_NOT_IN_REVIEW)"
          - "X-User-ID != submitted_by (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "decided_by := X-User-ID; decided_at := logical clock"

      - from: REJECTED
        to: DRAFT
        trigger: "POST /certification_applications/{application_id}/revise"
        actor: SustainabilityManager
        preconditions:
          - "Application is REJECTED (else ERR_APPLICATION_NOT_DRAFT)"
        side_effects:
          - "submitted_by, decided_by, decided_at cleared"

      - from: DRAFT
        to: WITHDRAWN
        trigger: "system (a new DRAFT application is created for the same site and level_requested)"
        actor: system
        preconditions: []
        side_effects: []

      - from: APPROVED
        to: SUPERSEDED
        trigger: "system (another application of the same site is APPROVED)"
        actor: system
        preconditions: []
        side_effects:
          - "Site.certification_tier re-derived from the newly approved application"

      - from: APPROVED
        to: LAPSED
        trigger: "system (ScorecardPeriod close sweep: decided_at + 12 months < logical clock date)"
        actor: system
        preconditions: []
        side_effects:
          - "Site.certification_tier re-derived from remaining APPROVED, non-LAPSED, non-SUPERSEDED applications (NONE when empty)"

  - entity: VendorContract
    field: status
    initial_state: DRAFT
    terminal_states: [TERMINATED, EXPIRED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /contracts/{contract_id}/activate"
        actor: SustainabilityManager
        preconditions:
          - "Contract is DRAFT (else ERR_INVALID_STATE)"
          - "No other ACTIVE contract for the same site_id + material_stream has a closed-interval window overlapping [window_start, window_end] — touch at an endpoint IS an overlap (else ERR_CONTRACT_STREAM_OVERLAP)"
          - "Vendor is ACTIVE (else ERR_VENDOR_NOT_ACTIVE)"
          - "rebate_per_ton_cents <= site.max_rebate_rate_per_ton_cents (else ERR_REBATE_RATE_CAP_EXCEEDED)"
        side_effects: []

      - from: ACTIVE
        to: SUSPENDED
        trigger: "system (vendor set to SUSPENDED)"
        actor: system
        preconditions: []
        side_effects:
          - "PENDING tickets on this contract -> REJECTED (rejection_reason 'CONTRACT_SUSPENDED'); ScorecardPeriod provisional totals shrink accordingly"

      - from: SUSPENDED
        to: ACTIVE
        trigger: "system (vendor set back to ACTIVE)"
        actor: system
        preconditions: []
        side_effects:
          - "Tickets REJECTED by the suspension stay REJECTED (no automatic reopen)"

      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /contracts/{contract_id}/terminate"
        actor: SustainabilityManager
        preconditions:
          - "Contract is ACTIVE or SUSPENDED (else ERR_INVALID_STATE)"
        side_effects:
          - "PENDING tickets on this contract -> REJECTED (rejection_reason 'CONTRACT_TERMINATED'); ScorecardPeriod provisional totals shrink accordingly"

      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /contracts/{contract_id}/terminate"
        actor: SustainabilityManager
        preconditions:
          - "Contract is ACTIVE or SUSPENDED (else ERR_INVALID_STATE)"
        side_effects:
          - "PENDING tickets on this contract -> REJECTED (rejection_reason 'CONTRACT_TERMINATED'); ScorecardPeriod provisional totals shrink accordingly"

      - from: ACTIVE
        to: EXPIRED
        trigger: "system (ScorecardPeriod close sweep: window_end < logical clock date)"
        actor: system
        preconditions: []
        side_effects: []

      - from: SUSPENDED
        to: EXPIRED
        trigger: "system (ScorecardPeriod close sweep: window_end < logical clock date)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: Vendor
    field: status
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /vendors/{vendor_id}/set_status (to_status=SUSPENDED)"
        actor: CertificationOfficer
        preconditions:
          - "Vendor is ACTIVE (else ERR_INVALID_STATE)"
        side_effects:
          - "ACTIVE VendorContracts of this vendor -> SUSPENDED (which then REJECTs their PENDING tickets)"

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /vendors/{vendor_id}/set_status (to_status=ACTIVE)"
        actor: CertificationOfficer
        preconditions:
          - "Vendor is SUSPENDED (else ERR_INVALID_STATE)"
        side_effects:
          - "SUSPENDED VendorContracts of this vendor -> ACTIVE (tickets rejected during suspension stay REJECTED)"

  - entity: SiteGoal
    field: status
    initial_state: ACTIVE
    terminal_states: [ACHIEVED, MISSED, CANCELLED]
    transitions:
      - from: ACTIVE
        to: ACHIEVED
        trigger: "system (ScorecardPeriod close: goal window fully contained in the closed period and certified metric meets target)"
        actor: system
        preconditions: []
        side_effects: []

      - from: ACTIVE
        to: MISSED
        trigger: "system (ScorecardPeriod close: goal window fully contained in the closed period and certified metric misses target)"
        actor: system
        preconditions: []
        side_effects: []

      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /goals/{goal_id}/cancel"
        actor: SustainabilityManager
        preconditions:
          - "Goal is ACTIVE (else ERR_INVALID_STATE)"
        side_effects: []

  - entity: ScorecardPeriod
    field: status
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /scorecard_periods/{period_id}/close"
        actor: CertificationOfficer
        preconditions:
          - "Period is OPEN (else ERR_INVALID_STATE)"
          - "No PENDING WeightTickets of the site have ticket_date in [period_start, period_end) (else ERR_PERIOD_HAS_PENDING_TICKETS)"
        side_effects:
          - "rebate_settled_cents computed per rebate_settlement_audit_adjusted and frozen"
          - "cost_avoided_cents computed per cost_avoidance (per-ticket rounding) and frozen"
          - "Certified/provisional totals and contamination_event_count frozen"
          - "Every ACTIVE SiteGoal of the site whose [window_start, window_end) is fully contained in [period_start, period_end) is evaluated -> ACHIEVED or MISSED"
          - "Contracts of the site with window_end earlier than the logical clock date -> EXPIRED"
          - "APPROVED applications of the site with decided_at + 12 months earlier than the logical clock date -> LAPSED; Site.certification_tier re-derived"

# =============================================================================
# §1.2.1: Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: application-create-stale-site
    parent_entity: Site
    write_endpoint: "POST /certification_applications"
    occ_field: expected_site_version
    description: |
      Creating a draft CertificationApplication against a Site whose version has
      advanced since the client last observed it is rejected. A successful create
      legitimately supersedes any existing DRAFT application for the same site and
      level (old draft -> WITHDRAWN), so a writer holding a stale site version
      would supersede a draft it never saw. The stale writer is rejected with a
      412 and must re-read the site before retrying.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3: Calculation Rules Table
# =============================================================================
calculations:
  - name: diversion_rate
    trigger: "ticket validate / reject / resubmit / void; contamination-driven void; period close (freeze); read of ScorecardPeriod while OPEN"
    algorithm: aggregation
    formula: |
      Let W = [period_start, period_end) (half-open) on the period's site.
      diverted routes D = {RECYCLING, COMPOSTING, REUSE}; LANDFILL and ENERGY_RECOVERY never count as diverted.
      certified set  C = { tickets: ticket_date IN W AND validation_status == VALIDATED }
      provisional set P = { tickets: ticket_date IN W AND validation_status IN {PENDING, VALIDATED} }
      total_waste_lbs_validated  = sum(net_weight_lbs over C)
      diverted_lbs_validated     = sum(net_weight_lbs over C where disposal_route IN D)
      diversion_rate_certified_pct  = round_half_up(diverted_lbs_validated * 100 / total_waste_lbs_validated, 2); 0.00 when total == 0
      total_waste_lbs_provisional  = sum(net_weight_lbs over P)
      diverted_lbs_provisional     = sum(net_weight_lbs over P where disposal_route IN D)
      diversion_rate_provisional_pct = round_half_up(diverted_lbs_provisional * 100 / total_waste_lbs_provisional, 2); 0.00 when total == 0
    input_set: "WeightTickets of the period's site; PENDING+VALIDATED for provisional, VALIDATED only for certified; REJECTED and VOIDED excluded from both"
    constants:
      DIVERTED_ROUTES: "RECYCLING, COMPOSTING, REUSE"
    precision: "2 decimal places, round_half_up"
    variants:
      - name: provisional
        when: "live monitoring while the period is OPEN"
        difference: "includes PENDING tickets, so identical ticket data yields a different rate whenever any in-window ticket is still PENDING"
      - name: certified
        when: "certification review, goal evaluation, and closed-period scorecard"
        difference: "VALIDATED tickets only"

  - name: ticket_rebate_estimate
    trigger: "ticket VALIDATED (accrue to ScorecardPeriod.rebate_estimate_cents); ticket VOIDED (reverse exactly)"
    algorithm: tiered_pricing
    formula: |
      Per VALIDATED ticket t on contract c (only when t.disposal_route IN {RECYCLING, COMPOSTING, REUSE}):
        tons = t.net_weight_lbs / 2000 (exact decimal, no intermediate rounding)
        pct = t.contamination_pct (0 when null)
        quality_factor = 1.0 when pct < 5; 0.75 when 5 <= pct < 10; 0.5 when pct >= 10
        rebate_part = round_half_up(tons * c.rebate_per_ton_cents * quality_factor)
        penalty_part = round_half_up(tons * c.contamination_penalty_per_ton_cents) when pct >= 10 else 0
        estimate_cents(t) = rebate_part - penalty_part
      LANDFILL / ENERGY_RECOVERY tickets accrue 0 (no rebate, no penalty).
    input_set: "the single ticket being validated/voided, against its contract"
    constants:
      TON_LBS: 2000
      MAJOR_FLOOR: 5
      CRITICAL_FLOOR: 10
    precision: "integer cents, round_half_up per part"
    variants:
      - name: estimate
        when: "accrual at validation time while the period is OPEN"
        difference: "uses the ticket's own contamination_pct"
      - name: audit_adjusted_settlement
        when: "period close (rebate_settled_cents)"
        difference: "for each material_stream, if a WasteAudit of the same site has audit_date in [period_start, period_end) and reports that stream, the audit's contamination_pct replaces every in-window VALIDATED ticket's pct for that stream (multiple covering audits: greatest audit_date wins, tie-break greatest created_at); tickets of unmeasured streams keep their own pct"

  - name: cost_avoidance
    trigger: "period close (frozen into ScorecardPeriod.cost_avoided_cents)"
    algorithm: aggregation
    formula: |
      Per VALIDATED ticket t in the window with disposal_route IN {RECYCLING, COMPOSTING, REUSE}:
        avoided_cents(t) = round_half_up(t.net_weight_lbs / 2000 * site.landfill_tip_fee_per_ton_cents)
      cost_avoided_cents = sum(avoided_cents(t))
      PINNED ORDER: round each ticket to cents FIRST, then sum. Summing tons first and
      rounding once produces a different total and is NOT the specified behavior.
    input_set: "VALIDATED diverted-route tickets of the site with ticket_date in [period_start, period_end)"
    constants:
      TON_LBS: 2000
    precision: "integer cents, round_half_up per ticket"

  - name: contamination_severity
    trigger: "contamination event create"
    algorithm: threshold
    formula: |
      severity = MINOR when contamination_pct < 5
                 MAJOR when 5 <= contamination_pct < 10
                 CRITICAL when contamination_pct >= 10
    input_set: "the event's contamination_pct"
    constants:
      MAJOR_FLOOR: 5
      CRITICAL_FLOOR: 10
    precision: "boundaries are inclusive at the floor (5.0 is MAJOR, 10.0 is CRITICAL)"

  - name: certification_threshold
    trigger: "application decide with outcome=APPROVED"
    algorithm: threshold
    formula: |
      measured = reporting period's diversion_rate_certified_pct (frozen at close)
      threshold(level): BRONZE 50.0 | SILVER 70.0 | GOLD 85.0 | ZERO_WASTE 90.0
      approve allowed IFF measured >= threshold (boundary inclusive: exactly 90.00 passes ZERO_WASTE)
    input_set: "ScorecardPeriod.diversion_rate_certified_pct of the application's reporting period"
    constants:
      BRONZE: 50.0
      SILVER: 70.0
      GOLD: 85.0
      ZERO_WASTE: 90.0
    precision: "2-decimal pct compared with >= (no further rounding at decision time)"

  - name: goal_evaluation
    trigger: "ScorecardPeriod close"
    algorithm: threshold
    formula: |
      For each ACTIVE SiteGoal g of the site with period_start <= g.window_start AND g.window_end <= period_end:
        DIVERSION_RATE:        achieved IFF diversion_rate_certified_pct >= g.target_value
        COST_AVOIDANCE:        achieved IFF cost_avoided_cents >= g.target_value
        CONTAMINATION_EVENTS:  achieved IFF contamination_event_count <= g.target_value
      achieved -> ACHIEVED else MISSED. Goals whose window is not fully contained stay ACTIVE.
    input_set: "frozen certified metrics of the closing period; ACTIVE goals of the same site"
    precision: ">= / <= boundaries inclusive"

  - name: program_standing
    trigger: "contamination event create / assign_training / complete_training / verify / dismiss"
    algorithm: aggregation
    formula: |
      non_terminal = events of the site with status IN {OPEN, TRAINING_ASSIGNED, TRAINING_COMPLETED}
      PROBATION when any non_terminal event has severity == CRITICAL
      WATCH     when no CRITICAL but count(non_terminal) >= 2
      GOOD_STANDING otherwise
    input_set: "ContaminationEvents of the site; DISMISSED and VERIFIED_CLOSED excluded"
    precision: "exact count, no rounding"

  - name: certification_lapse
    trigger: "ScorecardPeriod close (sweep)"
    algorithm: chronological
    formula: |
      APPROVED application with decided_at + 12 months strictly earlier than the logical clock date -> LAPSED.
      Site.certification_tier re-derived: level of the APPROVED, non-LAPSED, non-SUPERSEDED application
      with the greatest decided_at; NONE when the set is empty.
    input_set: "APPROVED applications of the site; logical clock date"
    precision: "12 calendar months; strictly-earlier comparison"

# =============================================================================
# §1.4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role permitted for the endpoint; for VendorUser, body/path vendor_id must equal X-User-ID (ownership)"
    error_id: "ERR_FORBIDDEN / ERR_VENDOR_MISMATCH"
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Request body well-formed: required fields present, enum values in their declared sets, numeric ranges valid (contamination_pct 0..100, weights positive integers)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all

  - priority: 4
    category: existence
    check: "Path ids and body FK ids (site_id, vendor_id, contract_id, ticket_id, audit_id, reporting_period_id) exist; path ids validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 5
    category: business_constraint
    check: "OCC: expected_site_version on POST /certification_applications must equal Site.version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /certification_applications"

  - priority: 6
    category: state
    check: "Target resource's own state permits the transition (ticket PENDING/REJECTED/VALIDATED, application DRAFT/SUBMITTED/UNDER_REVIEW, contract DRAFT/ACTIVE/SUSPENDED, goal ACTIVE, period OPEN, event OPEN/TRAINING_ASSIGNED/TRAINING_COMPLETED, vendor ACTIVE/SUSPENDED)"
    error_id: "ERR_TICKET_NOT_PENDING | ERR_TICKET_NOT_REJECTED | ERR_TICKET_NOT_VALIDATED | ERR_APPLICATION_NOT_DRAFT | ERR_APPLICATION_NOT_SUBMITTED | ERR_APPLICATION_NOT_IN_REVIEW | ERR_INVALID_STATE"
    http_status: 409
    applies_to: "state transition endpoints"

  - priority: 7
    category: business_safety
    check: "Compliance gates: decide X-User-ID must differ from submitted_by; application submit blocked while site standing is PROBATION"
    error_id: "ERR_SEGREGATION_OF_DUTIES / ERR_STANDING_PROBATION"
    http_status: "403 / 409"
    applies_to: "application decide; application submit"

  - priority: 8
    category: business_constraint
    check: "Uniqueness and overlap: (vendor_id, external_ticket_ref) unique; no overlapping ACTIVE contract per site+stream (closed interval, endpoint touch counts); no overlapping ACTIVE goal per site+metric (half-open, adjacency allowed); periods never overlap and at most one OPEN per site (on period create, ERR_PERIOD_ALREADY_OPEN is checked BEFORE ERR_PERIOD_OVERLAP); period close requires zero in-window PENDING tickets; gross > tare; ticket stream must equal contract stream"
    error_id: "ERR_DUPLICATE_TICKET_REF | ERR_CONTRACT_STREAM_OVERLAP | ERR_GOAL_WINDOW_OVERLAP | ERR_PERIOD_OVERLAP | ERR_PERIOD_ALREADY_OPEN | ERR_PERIOD_HAS_PENDING_TICKETS | ERR_INVALID_WEIGHTS | ERR_STREAM_CONTRACT_MISMATCH"
    http_status: "409 (422 for ERR_INVALID_WEIGHTS / ERR_STREAM_CONTRACT_MISMATCH)"
    applies_to: "ticket create; contract activate; goal create; period create/close"

  - priority: 9
    category: business_referential
    check: "Cross-entity state and scope: contract ACTIVE for ticket create/validate; vendor ACTIVE for contract activate and ticket validate; reporting period CLOSED for application submit; FK scope consistency (contract.site_id/contract.vendor_id match ticket body; event.ticket_id site matches; application.reporting_period_id site matches)"
    error_id: "ERR_CONTRACT_NOT_ACTIVE | ERR_VENDOR_NOT_ACTIVE | ERR_PERIOD_NOT_CLOSED | ERR_CROSS_SITE_REFERENCE"
    http_status: "409 (422 for ERR_CROSS_SITE_REFERENCE)"
    applies_to: "ticket create/validate; contract activate; application submit; contamination event create; application create"

  - priority: 10
    category: business_temporal
    check: "Window validity and clock: window_start <= window_end (contract, closed), window_start < window_end (goal/period, half-open); ticket_date not later than the logical clock date on validate; an OPEN period contains ticket_date on validate"
    error_id: "ERR_WINDOW_INVALID | ERR_TICKET_DATE_FUTURE | ERR_NO_OPEN_PERIOD"
    http_status: "422 (409 for ERR_NO_OPEN_PERIOD)"
    applies_to: "contract/goal/period create; ticket validate"

  - priority: 11
    category: business_fiscal
    check: "Fiscal and performance gates: rebate_per_ton_cents within site policy cap on contract activate; certified diversion rate meets the requested level threshold on approve"
    error_id: "ERR_REBATE_RATE_CAP_EXCEEDED / ERR_CERTIFICATION_THRESHOLD_NOT_MET"
    http_status: 422
    applies_to: "contract activate; application decide"

# =============================================================================
# §1.0: Response Envelope (FIXED — emit verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.5: API Endpoint Table
# =============================================================================
endpoints:
  # --- Site ---
  - method: POST
    path: "/sites"
    description: "Create a site enrolled in the program"
    roles: [SustainabilityManager]
    code: 201
    input: [name, landfill_tip_fee_per_ton_cents, max_rebate_rate_per_ton_cents]
    output: Site
    side_effects: ["certification_tier=NONE, program_standing=GOOD_STANDING"]

  - method: GET
    path: "/sites/{site_id}"
    description: "Get a site"
    roles: [SustainabilityManager, VendorUser, DataSteward, WasteAuditor, CertificationOfficer]
    code: 200
    input: []
    output: Site
    side_effects: []

  # --- Vendor ---
  - method: POST
    path: "/vendors"
    description: "Register a hauler/recycler vendor"
    roles: [CertificationOfficer]
    code: 201
    input: [name, vendor_type]
    output: Vendor
    side_effects: ["status=ACTIVE"]

  - method: GET
    path: "/vendors/{vendor_id}"
    description: "Get a vendor"
    roles: [SustainabilityManager, VendorUser, DataSteward, WasteAuditor, CertificationOfficer]
    code: 200
    input: []
    output: Vendor
    side_effects: []

  - method: POST
    path: "/vendors/{vendor_id}/set_status"
    description: "Suspend or reactivate a vendor; suspension cascades to contracts and their PENDING tickets"
    roles: [CertificationOfficer]
    code: 200
    input: [to_status]
    output: Vendor
    side_effects:
      - "to_status=SUSPENDED: ACTIVE contracts -> SUSPENDED; their PENDING tickets -> REJECTED; provisional totals shrink"
      - "to_status=ACTIVE: SUSPENDED contracts -> ACTIVE"

  # --- VendorContract ---
  - method: POST
    path: "/contracts"
    description: "Create a vendor contract in DRAFT"
    roles: [SustainabilityManager]
    code: 201
    input: [site_id, vendor_id, material_stream, rebate_per_ton_cents, contamination_penalty_per_ton_cents, window_start, window_end]
    output: VendorContract
    side_effects: ["status=DRAFT"]

  - method: GET
    path: "/contracts/{contract_id}"
    description: "Get a contract"
    roles: [SustainabilityManager, VendorUser, DataSteward, WasteAuditor, CertificationOfficer]
    code: 200
    input: []
    output: VendorContract
    side_effects: []

  - method: GET
    path: "/contracts"
    description: "List contracts with filters"
    roles: [SustainabilityManager, VendorUser, DataSteward, WasteAuditor, CertificationOfficer]
    code: 200
    input: ["site_id?", "vendor_id?", "status?", "material_stream?", "limit?", "offset?"]
    output: "VendorContract[]"
    side_effects: []

  - method: POST
    path: "/contracts/{contract_id}/activate"
    description: "Activate a DRAFT contract (overlap, vendor, and fiscal-cap checks)"
    roles: [SustainabilityManager]
    code: 200
    input: []
    output: VendorContract
    side_effects: ["status -> ACTIVE"]

  - method: POST
    path: "/contracts/{contract_id}/terminate"
    description: "Terminate an ACTIVE or SUSPENDED contract; its PENDING tickets are rejected"
    roles: [SustainabilityManager]
    code: 200
    input: []
    output: VendorContract
    side_effects: ["status -> TERMINATED", "PENDING tickets -> REJECTED; provisional totals shrink"]

  # --- WeightTicket ---
  - method: POST
    path: "/tickets"
    description: "Record a hauler weight ticket (VendorUser may only create for own vendor_id)"
    roles: [VendorUser]
    code: 201
    input: [site_id, vendor_id, contract_id, material_stream, disposal_route, gross_weight_lbs, tare_weight_lbs, ticket_date, external_ticket_ref, "contamination_pct?"]
    output: WeightTicket
    side_effects:
      - "validation_status=PENDING; net_weight_lbs computed"
      - "Containing OPEN ScorecardPeriod provisional totals grow; period version increments"

  - method: GET
    path: "/tickets/{ticket_id}"
    description: "Get a ticket"
    roles: [SustainabilityManager, VendorUser, DataSteward, WasteAuditor, CertificationOfficer]
    code: 200
    input: []
    output: WeightTicket
    side_effects: []

  - method: GET
    path: "/tickets"
    description: "List tickets with filters"
    roles: [SustainabilityManager, VendorUser, DataSteward, WasteAuditor, CertificationOfficer]
    code: 200
    input: ["site_id?", "vendor_id?", "contract_id?", "validation_status?", "limit?", "offset?"]
    output: "WeightTicket[]"
    side_effects: []

  - method: POST
    path: "/tickets/{ticket_id}/validate"
    description: "Validate a PENDING ticket (DataSteward)"
    roles: [DataSteward]
    code: 200
    input: []
    output: WeightTicket
    side_effects: ["validation_status -> VALIDATED", "certified totals grow", "rebate_estimate_cents accrues", "period version increments"]

  - method: POST
    path: "/tickets/{ticket_id}/reject"
    description: "Reject a PENDING ticket"
    roles: [DataSteward]
    code: 200
    input: [reason]
    output: WeightTicket
    side_effects: ["validation_status -> REJECTED", "provisional totals shrink", "period version increments"]

  - method: POST
    path: "/tickets/{ticket_id}/resubmit"
    description: "Vendor corrects a REJECTED ticket back to PENDING"
    roles: [VendorUser]
    code: 200
    input: ["gross_weight_lbs?", "tare_weight_lbs?", "ticket_date?", "contamination_pct?", "disposal_route?"]
    output: WeightTicket
    side_effects: ["validation_status -> PENDING", "net_weight_lbs recomputed", "provisional totals grow", "period version increments"]

  - method: POST
    path: "/tickets/{ticket_id}/void"
    description: "Void a VALIDATED ticket (compensates totals and rebate accrual)"
    roles: [DataSteward]
    code: 200
    input: ["reason?"]
    output: WeightTicket
    side_effects: ["validation_status -> VOIDED", "certified totals shrink", "rebate estimate reversed", "period version increments"]

  # --- WasteAudit ---
  - method: POST
    path: "/audits"
    description: "Record a waste characterization audit (immutable once created)"
    roles: [WasteAuditor]
    code: 201
    input: [site_id, audit_date, auditor_name, stream_findings]
    output: WasteAudit
    side_effects: []

  - method: GET
    path: "/audits/{audit_id}"
    description: "Get an audit"
    roles: [SustainabilityManager, VendorUser, DataSteward, WasteAuditor, CertificationOfficer]
    code: 200
    input: []
    output: WasteAudit
    side_effects: []

  - method: GET
    path: "/audits"
    description: "List audits with filters"
    roles: [SustainabilityManager, VendorUser, DataSteward, WasteAuditor, CertificationOfficer]
    code: 200
    input: ["site_id?", "limit?", "offset?"]
    output: "WasteAudit[]"
    side_effects: []

  # --- ContaminationEvent ---
  - method: POST
    path: "/contamination_events"
    description: "Record a contamination observation; a CRITICAL event linked to a VALIDATED ticket voids that ticket (a PENDING one is rejected)"
    roles: [WasteAuditor]
    code: 201
    input: [site_id, event_date, material_stream, contamination_pct, "ticket_id?", "audit_id?"]
    output: ContaminationEvent
    side_effects:
      - "status=OPEN; severity computed from contamination_pct"
      - "severity CRITICAL: linked VALIDATED ticket -> VOIDED (totals and rebate estimate recomputed); linked PENDING ticket -> REJECTED"
      - "Site.program_standing re-derived"

  - method: GET
    path: "/contamination_events/{event_id}"
    description: "Get a contamination event"
    roles: [SustainabilityManager, VendorUser, DataSteward, WasteAuditor, CertificationOfficer]
    code: 200
    input: []
    output: ContaminationEvent
    side_effects: []

  - method: GET
    path: "/contamination_events"
    description: "List contamination events with filters"
    roles: [SustainabilityManager, VendorUser, DataSteward, WasteAuditor, CertificationOfficer]
    code: 200
    input: ["site_id?", "ticket_id?", "audit_id?", "status?", "limit?", "offset?"]
    output: "ContaminationEvent[]"
    side_effects: []

  - method: POST
    path: "/contamination_events/{event_id}/assign_training"
    description: "Assign corrective training for an OPEN event"
    roles: [WasteAuditor]
    code: 200
    input: [trainee_name, training_due_date]
    output: ContaminationEvent
    side_effects: ["status -> TRAINING_ASSIGNED"]

  - method: POST
    path: "/contamination_events/{event_id}/complete_training"
    description: "Mark assigned training completed"
    roles: [WasteAuditor]
    code: 200
    input: []
    output: ContaminationEvent
    side_effects: ["status -> TRAINING_COMPLETED"]

  - method: POST
    path: "/contamination_events/{event_id}/verify"
    description: "Verify corrective action; passed=false loops the event back to OPEN"
    roles: [WasteAuditor]
    code: 200
    input: [passed]
    output: ContaminationEvent
    side_effects: ["passed=true -> VERIFIED_CLOSED; passed=false -> OPEN with training fields cleared", "Site.program_standing re-derived"]

  - method: POST
    path: "/contamination_events/{event_id}/dismiss"
    description: "Dismiss an OPEN event as erroneous"
    roles: [WasteAuditor]
    code: 200
    input: [reason]
    output: ContaminationEvent
    side_effects: ["status -> DISMISSED", "excluded from contamination_event_count and program_standing"]

  # --- SiteGoal ---
  - method: POST
    path: "/goals"
    description: "Create a site goal (half-open window; adjacency with existing goals allowed)"
    roles: [SustainabilityManager]
    code: 201
    input: [site_id, metric, target_value, window_start, window_end]
    output: SiteGoal
    side_effects: ["status=ACTIVE"]

  - method: GET
    path: "/goals/{goal_id}"
    description: "Get a goal"
    roles: [SustainabilityManager, VendorUser, DataSteward, WasteAuditor, CertificationOfficer]
    code: 200
    input: []
    output: SiteGoal
    side_effects: []

  - method: GET
    path: "/goals"
    description: "List goals with filters"
    roles: [SustainabilityManager, VendorUser, DataSteward, WasteAuditor, CertificationOfficer]
    code: 200
    input: ["site_id?", "metric?", "status?", "limit?", "offset?"]
    output: "SiteGoal[]"
    side_effects: []

  - method: POST
    path: "/goals/{goal_id}/cancel"
    description: "Cancel an ACTIVE goal"
    roles: [SustainabilityManager]
    code: 200
    input: []
    output: SiteGoal
    side_effects: ["status -> CANCELLED"]

  # --- ScorecardPeriod ---
  - method: POST
    path: "/scorecard_periods"
    description: "Open a new scorecard period (non-overlapping; at most one OPEN per site)"
    roles: [CertificationOfficer]
    code: 201
    input: [site_id, period_start, period_end]
    output: ScorecardPeriod
    side_effects: ["status=OPEN; computed totals initialized to 0; rebate_settled_cents and cost_avoided_cents null"]

  - method: GET
    path: "/scorecard_periods/{period_id}"
    description: "Get a scorecard period (live computed totals while OPEN)"
    roles: [SustainabilityManager, VendorUser, DataSteward, WasteAuditor, CertificationOfficer]
    code: 200
    input: []
    output: ScorecardPeriod
    side_effects: []

  - method: GET
    path: "/scorecard_periods"
    description: "List scorecard periods with filters"
    roles: [SustainabilityManager, VendorUser, DataSteward, WasteAuditor, CertificationOfficer]
    code: 200
    input: ["site_id?", "status?", "limit?", "offset?"]
    output: "ScorecardPeriod[]"
    side_effects: []

  - method: POST
    path: "/scorecard_periods/{period_id}/close"
    description: "Close the period: freeze totals, settle rebates, compute cost avoidance, evaluate contained goals, sweep contract expiry and certification lapse"
    roles: [CertificationOfficer]
    code: 200
    input: []
    output: ScorecardPeriod
    side_effects:
      - "status -> CLOSED; all computed fields frozen"
      - "rebate_settled_cents and cost_avoided_cents computed and frozen"
      - "contained ACTIVE goals -> ACHIEVED/MISSED"
      - "contracts with window_end before the clock date -> EXPIRED"
      - "APPROVED applications older than 12 months -> LAPSED; site tier re-derived"

  # --- CertificationApplication ---
  - method: POST
    path: "/certification_applications"
    description: "Create a draft application (OCC on Site.version; supersedes an existing DRAFT of the same site+level to WITHDRAWN)"
    roles: [SustainabilityManager]
    code: 201
    input: [site_id, level_requested, reporting_period_id, expected_site_version]
    output: CertificationApplication
    side_effects: ["status=DRAFT", "existing same-site same-level DRAFT -> WITHDRAWN", "increments Site.version by 1"]

  - method: GET
    path: "/certification_applications/{application_id}"
    description: "Get an application"
    roles: [SustainabilityManager, VendorUser, DataSteward, WasteAuditor, CertificationOfficer]
    code: 200
    input: []
    output: CertificationApplication
    side_effects: []

  - method: GET
    path: "/certification_applications"
    description: "List applications with filters"
    roles: [SustainabilityManager, VendorUser, DataSteward, WasteAuditor, CertificationOfficer]
    code: 200
    input: ["site_id?", "reporting_period_id?", "status?", "limit?", "offset?"]
    output: "CertificationApplication[]"
    side_effects: []

  - method: POST
    path: "/certification_applications/{application_id}/submit"
    description: "Submit a DRAFT application (requires CLOSED reporting period and non-PROBATION standing)"
    roles: [SustainabilityManager]
    code: 200
    input: []
    output: CertificationApplication
    side_effects: ["status -> SUBMITTED", "submitted_by := X-User-ID"]

  - method: POST
    path: "/certification_applications/{application_id}/start_review"
    description: "Move a SUBMITTED application to UNDER_REVIEW"
    roles: [CertificationOfficer]
    code: 200
    input: []
    output: CertificationApplication
    side_effects: ["status -> UNDER_REVIEW"]

  - method: POST
    path: "/certification_applications/{application_id}/decide"
    description: "Approve or reject an UNDER_REVIEW application (segregation of duties; threshold check on approve)"
    roles: [CertificationOfficer]
    code: 200
    input: [outcome, "notes?"]
    output: CertificationApplication
    side_effects:
      - "status -> APPROVED or REJECTED; decided_by/decided_at recorded"
      - "on APPROVED: prior APPROVED application -> SUPERSEDED; Site.certification_tier := level_requested"

  - method: POST
    path: "/certification_applications/{application_id}/revise"
    description: "Return a REJECTED application to DRAFT for revision and resubmission"
    roles: [SustainabilityManager]
    code: 200
    input: []
    output: CertificationApplication
    side_effects: ["status -> DRAFT", "submitted_by/decided_by/decided_at cleared"]

  # --- Test-driving clock ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock (test-driving endpoint). The server default before any call is exactly 2026-08-01T00:00:00Z; the logical clock never falls back to wall-clock time."
    roles: [CertificationOfficer]
    code: 200
    input: [to_iso8601]
    output: { current_utc: datetime }
    side_effects: ["logical clock advanced (never backward)"]

# =============================================================================
# §1.6: Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role / X-User-ID header missing or role not declared"

  - id: ERR_FORBIDDEN
    http: 403
    condition: "Role is not permitted to call this endpoint"

  - id: ERR_VENDOR_MISMATCH
    http: 403
    condition: "VendorUser X-User-ID does not equal the vendor_id the ticket belongs to"

  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing required field, unknown field, invalid enum value, or out-of-range number (e.g., contamination_pct outside 0..100)"

  - id: ERR_NOT_FOUND
    http: 404
    condition: "Path or body-referenced resource id does not exist"

  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_site_version does not match the site's current version (OCC)"

  - id: ERR_INVALID_STATE
    http: 409
    condition: "Generic invalid transition (vendor set_status to current state, goal cancel from terminal, event action from wrong status, contract terminate from DRAFT, etc.)"

  - id: ERR_TICKET_NOT_PENDING
    http: 409
    condition: "validate/reject called on a ticket that is not PENDING"

  - id: ERR_TICKET_NOT_REJECTED
    http: 409
    condition: "resubmit called on a ticket that is not REJECTED"

  - id: ERR_TICKET_NOT_VALIDATED
    http: 409
    condition: "void called on a ticket that is not VALIDATED"

  - id: ERR_DUPLICATE_TICKET_REF
    http: 409
    condition: "(vendor_id, external_ticket_ref) already exists on a non-VOIDED ticket"

  - id: ERR_INVALID_WEIGHTS
    http: 422
    condition: "gross_weight_lbs <= tare_weight_lbs, or either is not a positive integer"

  - id: ERR_STREAM_CONTRACT_MISMATCH
    http: 422
    condition: "ticket material_stream differs from the referenced contract's material_stream"

  - id: ERR_CONTRACT_NOT_ACTIVE
    http: 409
    condition: "Referenced contract is not ACTIVE (ticket create/validate)"

  - id: ERR_CONTRACT_STREAM_OVERLAP
    http: 409
    condition: "Another ACTIVE contract for the same site and material_stream overlaps the closed interval [window_start, window_end]; endpoint touch counts as overlap"

  - id: ERR_REBATE_RATE_CAP_EXCEEDED
    http: 422
    condition: "rebate_per_ton_cents exceeds the site's max_rebate_rate_per_ton_cents policy cap on activation"

  - id: ERR_VENDOR_NOT_ACTIVE
    http: 409
    condition: "Referenced vendor is SUSPENDED (contract activate, ticket validate)"

  - id: ERR_GOAL_WINDOW_OVERLAP
    http: 409
    condition: "Another ACTIVE goal for the same site and metric overlaps the half-open window [window_start, window_end); adjacency is allowed"

  - id: ERR_WINDOW_INVALID
    http: 422
    condition: "window_start > window_end (contract, closed interval) or window_start >= window_end (goal/period, half-open)"

  - id: ERR_PERIOD_OVERLAP
    http: 409
    condition: "Another ScorecardPeriod of the site (any status) overlaps the half-open window"

  - id: ERR_PERIOD_ALREADY_OPEN
    http: 409
    condition: "The site already has an OPEN ScorecardPeriod"

  - id: ERR_PERIOD_HAS_PENDING_TICKETS
    http: 409
    condition: "Close blocked: PENDING tickets with ticket_date inside the period window remain"

  - id: ERR_TICKET_DATE_FUTURE
    http: 422
    condition: "ticket_date is later than the logical clock date at validation time"

  - id: ERR_NO_OPEN_PERIOD
    http: 409
    condition: "No OPEN ScorecardPeriod of the site contains the ticket_date at validation time"

  - id: ERR_CROSS_SITE_REFERENCE
    http: 422
    condition: "FK scope mismatch (contract belongs to another site/vendor than the ticket; event ticket_id belongs to another site; application reporting period belongs to another site)"

  - id: ERR_APPLICATION_NOT_DRAFT
    http: 409
    condition: "submit or revise requires the application to be DRAFT / REJECTED respectively"

  - id: ERR_APPLICATION_NOT_SUBMITTED
    http: 409
    condition: "start_review requires SUBMITTED"

  - id: ERR_APPLICATION_NOT_IN_REVIEW
    http: 409
    condition: "decide requires UNDER_REVIEW"

  - id: ERR_PERIOD_NOT_CLOSED
    http: 409
    condition: "Application submit requires the reporting ScorecardPeriod to be CLOSED"

  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "decide X-User-ID equals the application's submitted_by"

  - id: ERR_STANDING_PROBATION
    http: 409
    condition: "Site program_standing is PROBATION; certification application submit is blocked"

  - id: ERR_CERTIFICATION_THRESHOLD_NOT_MET
    http: 422
    condition: "Reporting period diversion_rate_certified_pct is below the requested level threshold on approve"

# =============================================================================
# §1.7: RBAC Matrix
# =============================================================================
roles:
  - name: SustainabilityManager
    description: "Facility sustainability lead; owns sites, contracts, goals, and certification application drafting/submission"
    identity: opaque
    exclusive_operations:
      - "POST /sites"
      - "POST /contracts, POST /contracts/{id}/activate, POST /contracts/{id}/terminate"
      - "POST /goals, POST /goals/{id}/cancel"
      - "POST /certification_applications, POST .../{id}/submit, POST .../{id}/revise"
    shared_operations:
      - "GET on any resource"

  - name: VendorUser
    description: "Hauler portal user; submits and corrects weight tickets for its own vendor"
    identity: "entity_backed:Vendor"
    exclusive_operations:
      - "POST /tickets"
      - "POST /tickets/{id}/resubmit"
    shared_operations:
      - "GET on any resource"

  - name: DataSteward
    description: "Program data-quality steward; validates, rejects, and voids weight tickets (never creates them)"
    identity: opaque
    exclusive_operations:
      - "POST /tickets/{id}/validate"
      - "POST /tickets/{id}/reject"
      - "POST /tickets/{id}/void"
    shared_operations:
      - "GET on any resource"

  - name: WasteAuditor
    description: "Field auditor; records characterization audits and drives the contamination / corrective-training lifecycle"
    identity: opaque
    exclusive_operations:
      - "POST /audits"
      - "POST /contamination_events, POST .../assign_training, POST .../complete_training, POST .../verify, POST .../dismiss"
    shared_operations:
      - "GET on any resource"

  - name: CertificationOfficer
    description: "Program officer; manages vendors, scorecard periods, certification review decisions, and the logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /vendors, POST /vendors/{id}/set_status"
      - "POST /scorecard_periods, POST /scorecard_periods/{id}/close"
      - "POST /certification_applications/{id}/start_review, POST .../{id}/decide"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET on any resource"
