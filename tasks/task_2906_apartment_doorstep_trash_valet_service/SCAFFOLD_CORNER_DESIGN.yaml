            - "re-reading the night and retrying with the fresh version succeeds, proving the range itself was never the obstacle"

      - name: stale_contract_version_on_statement_draft_is_rejected
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[statement-create-stale-contract]
          - errors[ERR_STALE_CONTRACT_VERSION]
          - validations[priority=10]
        distinguishing_aspect: "The analyst captures the contract version while it is still DRAFT, the PlatformAdmin activates it (bumping the version), and the draft attempt replaying the pre-activation version is rejected with HTTP 412 ERR_STALE_CONTRACT_VERSION."
        test_recipe:
          setup:
            - "Property 'Cedar Ridge' unit_count 4 with a contract whose version is captured at creation and then activated"
          setup_api_calls:
            - call: "POST /valet/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
