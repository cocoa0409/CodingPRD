              payload: { category_plan_id: "${plan_id}", store_cluster_id: "${cluster_id}", overlay_type: "CLIMATE", effective_start: "2027-03-11T00:00:00Z", effective_end: "2027-03-20T00:00:00Z", unit_multiplier_bps: 10800 }
