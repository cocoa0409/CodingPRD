            - { call: "POST /api/gap-findings/${fi}/disposition", payload: { disposition: TARGETED }, as: CompAnalyst }
            - { call: "POST /api/adjustments", payload: { plan_id: "${plan_i}", gap_finding_id: "${fi}", employee_snapshot_id: "${i_f1}", proposed_increase_cents: 1500000, effective_date: "2026-09-01" }, as: CompAnalyst, as_user_id: "user-analyst-1", captures: { ia1: "$.data.id" } }
            - { call: "POST /api/adjustments", payload: { plan_id: "${plan_i}", gap_finding_id: "${fi}", employee_snapshot_id: "${i_f2}", proposed_increase_cents: 1200000, effective_date: "2026-09-01" }, as: CompAnalyst, as_user_id: "user-analyst-1", captures: { ia2: "$.data.id" } }
            - { call: "POST /api/remediation-plans/${plan_i}/submit", payload: {}, as: CompAnalyst }
            - { call: "POST /api/remediation-plans/${plan_i}/decision", payload: { decision: APPROVE }, as: RemediationApprover }
          trigger:
            - { call: "GET /api/remediation-plans/${plan_i}", payload: {}, as: RemediationApprover, captures: { pvi1: "$.data.version" } }
            - { call: "POST /api/adjustments/${ia1}/decision", payload: { decision: APPROVE, expected_plan_version: "${pvi1}" }, as: RemediationApprover, as_user_id: "user-approver-1" }
            - { call: "GET /api/remediation-plans/${plan_i}", payload: {}, as: RemediationApprover, captures: { pvi2: "$.data.version", committed_mid: "$.data.committed_cents" } }
            - { call: "POST /api/adjustments/${ia2}/decision", payload: { decision: APPROVE, expected_plan_version: "${pvi2}" }, as: RemediationApprover, as_user_id: "user-approver-1", captures: { a2_status: "$.data.status" } }
            - { call: "GET /api/remediation-plans/${plan_i}", payload: {}, as: RemediationApprover, captures: { committed_end: "$.data.committed_cents", remaining_end: "$.data.remaining_cents", plan_status_end: "$.data.status" } }
          assert:
            - "committed_mid == 1500000 after the first approval"
            - "Second approval of 1200000 succeeds: 1500000 + 1200000 == 2700000 == total_budget_cents — equality is allowed (<=), a2_status == APPROVED"
            - "committed_end == 2700000 and remaining_end == 0"
            - "plan_status_end == FULLY_COMMITTED (auto-transition at exact equality)"

  # ---------------------------------------------------------------------------
  # Rule 7 — cross_entity_state_dependency (different entity pairs)
  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: group_lock_requires_study_modeling
        grounds:
          - state_machines.ComparatorGroup.DRAFT_to_LOCKED
          - errors[ERR_STUDY_NOT_MODELING]
        distinguishing_aspect: |
          Pair ComparatorGroup -> PayEquityStudy: locking a group whose parent
          study is still DRAFT fails with ERR_STUDY_NOT_MODELING even though the
          group itself satisfies its size rule; after the study advances to
          MODELING the identical lock call succeeds.
        test_recipe:
          setup:
            - "Study J (period 2025-01-01..2025-12-31, [GENDER], min_group_size 2) DRAFT; group GJ (ENG, CA, 5) with 2 members assigned (member_count 2 >= min_group_size)"
          setup_api_calls:
            - { call: "POST /api/pay-equity-studies", payload: { name: "StudyJ", analysis_period_start: "2025-01-01", analysis_period_end: "2025-12-31", protected_classes: ["GENDER"], min_group_size: 2 }, as: CompAnalyst, captures: { sj: "$.data.id" } }
            - { call: "POST /api/employee-snapshots", payload: { study_id: "${sj}", employee_ref: "JM1", gender_class: MALE, ethnicity_class: WHITE, age_band: UNDER_40, job_family: ENG, job_level: 5, location_code: CA, fte_factor: 1.0, base_salary_cents: 10000000, bonus_cents: 0, hire_date: "2020-01-01" }, as: PeopleOpsAdmin, captures: { j_m1: "$.data.id" } }
            - { call: "POST /api/employee-snapshots", payload: { study_id: "${sj}", employee_ref: "JF1", gender_class: FEMALE, ethnicity_class: WHITE, age_band: UNDER_40, job_family: ENG, job_level: 5, location_code: CA, fte_factor: 1.0, base_salary_cents: 9500000, bonus_cents: 0, hire_date: "2020-01-01" }, as: PeopleOpsAdmin, captures: { j_f1: "$.data.id" } }
            - { call: "POST /api/comparator-groups", payload: { study_id: "${sj}", name: "GJ", job_family: ENG, min_job_level: 5, max_job_level: 5, location_code: CA }, as: CompAnalyst, captures: { gj: "$.data.id" } }
            - { call: "PATCH /api/employee-snapshots/${j_m1}", payload: { comparator_group_id: "${gj}" }, as: PeopleOpsAdmin }
            - { call: "PATCH /api/employee-snapshots/${j_f1}", payload: { comparator_group_id: "${gj}" }, as: PeopleOpsAdmin }
          trigger:
            - { call: "POST /api/comparator-groups/${gj}/lock", payload: {}, as: CompAnalyst, captures: { err: "$.data.error_id" } }
            - { call: "POST /api/pay-equity-studies/${sj}/advance", payload: {}, as: CompAnalyst }
            - { call: "POST /api/comparator-groups/${gj}/lock", payload: {}, as: CompAnalyst, captures: { g_status: "$.data.status" } }
          assert:
            - "First lock: err == ERR_STUDY_NOT_MODELING (http 409) — the group's own state and size are valid; only the parent study's state blocks it"
            - "After study advance to MODELING, the same lock succeeds: g_status == LOCKED"

      - name: adjustment_decision_requires_plan_approved
        grounds:
          - state_machines.Adjustment.PROPOSED_to_APPROVED
          - errors[ERR_PLAN_NOT_APPROVED]
        distinguishing_aspect: |
          Pair Adjustment -> RemediationPlan (different pair than
          ComparatorGroup -> PayEquityStudy): deciding an adjustment while its
          plan is merely SUBMITTED (not yet APPROVED) fails with
          ERR_PLAN_NOT_APPROVED; after the plan decision approves the plan, the
          same adjustment decision succeeds.
        test_recipe:
          setup:
            - "Study K (period 2024-01-01..2024-12-31, [GENDER], min_group_size 6) REMEDIATION_OPEN; 6-member group MEDIAN-analyzed; finding TARGETED; plan budget 2700000 SUBMITTED with one PROPOSED adjustment 100000 (effective 2026-09-01)"
          setup_api_calls:
            - { call: "POST /api/pay-equity-studies", payload: { name: "StudyK", analysis_period_start: "2024-01-01", analysis_period_end: "2024-12-31", protected_classes: ["GENDER"], min_group_size: 6 }, as: CompAnalyst, captures: { sk: "$.data.id" } }
            - { call: "POST /api/employee-snapshots", payload: { study_id: "${sk}", employee_ref: "KM1", gender_class: MALE, ethnicity_class: WHITE, age_band: UNDER_40, job_family: FIN, job_level: 5, location_code: NY, fte_factor: 1.0, base_salary_cents: 11000000, bonus_cents: 0, hire_date: "2020-01-01" }, as: PeopleOpsAdmin, captures: { k_m1: "$.data.id" } }
            - { call: "POST /api/employee-snapshots", payload: { study_id: "${sk}", employee_ref: "KM2", gender_class: MALE, ethnicity_class: WHITE, age_band: UNDER_40, job_family: FIN, job_level: 5, location_code: NY, fte_factor: 1.0, base_salary_cents: 10000000, bonus_cents: 0, hire_date: "2020-01-01" }, as: PeopleOpsAdmin, captures: { k_m2: "$.data.id" } }
