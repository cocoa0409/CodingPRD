        grounds:
          - state_machines.Shipment.ESTIMATED_to_ACTUAL_RECORDED
          - state_machines.EntitlementAuthorization.AUTHORIZED_to_SUSPENDED
          - state_machines.Shipment.AWARDED_to_ON_HOLD
          - calculations.shipment_billable_weight
          - calculations.entitlement_excess_weight_and_cost
          - calculations.notification_sla_due
        distinguishing_aspect: >-
          Depth-4 cascade from POST /hhg/shipments/{id}/record-actual-weight: (1) the shipment's
          billable weight is rebased to 10000 lb on the FINAL_ACTUAL variant, (2) the entitlement
          ledger recomputes to 3000 excess pounds and 3005.10 due, (3) crossing the 2500.00
          threshold suspends the entitlement, and (4) the SIBLING shipment that shares the
          entitlement is forced from AWARDED to ON_HOLD — a row never named in the request.
