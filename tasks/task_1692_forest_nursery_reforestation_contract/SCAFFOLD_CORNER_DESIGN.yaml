          lift_window_end: '2027-03-31'
          expected_seed_lot_version: ${lot_v}
        as: NurseryManager
        captures:
          b_id: $.data.id
      - call: POST /reforestation/crop-batches/${b_id}/sow
        payload:
          actual_sow_date: '2026-09-01'
          sown_grams: 300
        as: NurseryManager
      - call: POST /reforestation/crop-batches/${b_id}/lift
        payload:
          lifted_on: '2027-03-10'
          lifted_count: 21000
        as: NurseryManager
      trigger:
      - call: POST /reforestation/crop-batches/${b_id}/grade
        payload:
          plantable_count: 20000
        as: NurseryManager
        captures:
          pl: $.data.plantable_count
          cu: $.data.cull_count
          st: $.data.status
      assert:
      - pl == 20000 and cu == 1000 and st == GRADED, all in the transition's own response
- section: errors
  instances:
  - name: error_catalog_triggerability_stubs
    claim_type: violation_to_error
    grounds:
    - errors[ERR_LOT_QUARANTINED]
    excluded_because:
      difficulty_instance: priority_pair_validation_conflict / quarantined_lot_shipment_safety_beats_stale_stock
      rationale: ERR_LOT_QUARANTINED trigger asserted by the named §1.8 instance.
  - name: error_lead_time_covered
    claim_type: violation_to_error
    grounds:
    - errors[ERR_LEAD_TIME_INSUFFICIENT]
    excluded_because:
      difficulty_instance: boundary_precision_check / lead_time_exactly_210_days_accepted
      rationale: ERR_LEAD_TIME_INSUFFICIENT asserted at the 209-day boundary by the named §1.8 instance.
  - name: error_under_allocated_covered
    claim_type: violation_to_error
    grounds:
    - errors[ERR_ORDER_UNDER_ALLOCATED]
    excluded_because:
      difficulty_instance: cross_entity_state_dependency / mark_ready_rejected_when_order_under_allocated
      rationale: ERR_ORDER_UNDER_ALLOCATED asserted by the named §1.8 instance.
  - name: error_storage_capacity_covered
    claim_type: violation_to_error
    grounds:
    - errors[ERR_STORAGE_CAPACITY_EXCEEDED]
    excluded_because:
      difficulty_instance: boundary_precision_check / storage_capacity_exact_fill_passes
      rationale: ERR_STORAGE_CAPACITY_EXCEEDED asserted at 25001 vs 25000 by the named §1.8 instance.
  - name: error_batch_not_graded_covered
    claim_type: violation_to_error
    grounds:
    - errors[ERR_BATCH_NOT_GRADED]
    excluded_because:
      difficulty_instance: cross_entity_state_dependency / shipment_rejected_when_batch_not_graded
      rationale: ERR_BATCH_NOT_GRADED asserted by the named §1.8 instance.
  - name: error_crew_overlap_covered
    claim_type: violation_to_error
    grounds:
    - errors[ERR_CREW_OVERLAP]
    excluded_because:
      difficulty_instance: resource_temporal_overlap / crew_assignment_cross_contract_buffer
      rationale: ERR_CREW_OVERLAP asserted by the named §1.8 instance.
  - name: error_crew_capacity_covered
    claim_type: violation_to_error
    grounds:
    - errors[ERR_CREW_CAPACITY_EXCEEDED]
    excluded_because:
      difficulty_instance: compensating_invariant / crew_capacity_conserved_across_assign_release
      rationale: ERR_CREW_CAPACITY_EXCEEDED asserted by the named §1.8 instance.
