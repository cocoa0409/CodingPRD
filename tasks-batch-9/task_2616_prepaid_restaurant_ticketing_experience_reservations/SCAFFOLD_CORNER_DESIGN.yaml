      - name: rbac_manager_and_kitchen_lead_cannot_act_on_another_restaurants_rows
        claim_type: Cannot perform other roles' exclusive operations
        grounds:
          - errors[ERR_FORBIDDEN_RESOURCE_OWNER]
          - roles.RestaurantManager.identity
          - roles.KitchenLead.identity
          - validations.priority_3_ERR_UNAUTHORIZED
          - complexity_profile.entity_topology
