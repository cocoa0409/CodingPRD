              payload: { venue_contract_id: "${vc_id}", name: "Rogue Edition", edition_year: 2029, move_in_start: "2029-03-01", event_start: "2029-03-05", event_end: "2029-03-07", move_out_end: "2029-03-09", gross_sqft: 100000, aisle_ratio_pct: 40, base_rate_cents_per_sqft: 3400, selection_desk_capacity: 2 }
              as: Registrant
              captures: { e_role_show: $.data.error_id }
            - call: "POST /sponsorship-deals/${d1}/sign"
              payload: {}
              as: SalesRep
              as_user_id: "u_sr_1"
