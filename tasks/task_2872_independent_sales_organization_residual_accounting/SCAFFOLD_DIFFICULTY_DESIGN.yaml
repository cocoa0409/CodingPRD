            - "GET /statement-adjustments?statement_id= that 2027-02 statement returns total_count 1: kind VESTED_BUYOUT, amount_cents +87858, state APPLIED, created_by_user_id 'system', source_merchant_id null"
            - "GET /agent-statements?agent_id=${a4} returns total_count 0 and GET /statement-adjustments?kind=VESTED_BUYOUT returns exactly one row overall   # a 0% buyout creates nothing"
