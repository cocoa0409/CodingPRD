      - name: statement_for_a_tax_year_outside_the_prior_year_window_is_rejected
        claim_type: Error triggerability
        grounds:
          - validations.priority_64
          - errors.ERR_PRIOR_YEAR_WINDOW_CLOSED
        distinguishing_aspect: "The prior-year rule is measured in calendar years against the logical clock, not against the case's own period: a 2022 statement drafted in logical 2026 is four years back and refused even though the case, the discrepancy and the employee are all perfectly valid."
