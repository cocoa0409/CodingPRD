      - name: validation_priority_ordering_on_the_activate_endpoint
        claim_type: Priority Ordering
        grounds:
          - validations[priority=16]
          - validations[priority=25]
        excluded_because:
          difficulty_instance: flight_state_error_outranks_compliance_gate_on_activate
          rationale: |
            The §1.8 priority_pair_validation_conflict instance already fires two rules at once on
            activate and asserts that the priority-16 state error wins over the priority-25
            compliance gate, with a control case showing the loser surfacing on its own.

      - name: validation_priority_conflict_between_consent_and_quota
        claim_type: Priority conflict
        grounds:
          - validations[priority=26]
          - validations[priority=49]
        excluded_because:
          difficulty_instance: dispatch_consent_safety_outranks_send_quota_fiscal
          rationale: |
            The second §1.8 priority_pair_validation_conflict instance simultaneously violates the
            consent-audience rule (26) and the send-quota rule (49) on dispatch and pins the consent
            error as the winner, so the pairing is already covered from a different error category
            pair than the activate case.

      - name: cross_entity_validation_of_persona_approval_before_publishing
        claim_type: Cross-entity validation
        grounds:
          - validations[priority=28].ERR_NO_APPROVED_PERSONA
        excluded_because:
          difficulty_instance: posting_publish_requires_approved_persona_of_its_own_job_family
          rationale: |
            The §1.8 cross_entity_state_dependency instance already publishes against a foreign
            family's approved persona and asserts ERR_NO_APPROVED_PERSONA, which is the only
            cross-entity validation whose subject entity is not the request path entity.

      - name: cascading_validation_through_the_compliance_suspension_chain
        claim_type: Cascading validation
        grounds:
          - state_machines.JobPosting["PUBLISHED -> SUSPENDED"]
        excluded_because:
          difficulty_instance: compliance_flag_cascade_five_hops_from_review_to_idle_channel
          rationale: |
            Validation that cascades into other entities (a flag on a posting invalidating the
            flights that depend on it) is exercised end to end by the §1.8 transitive_cascade
            instance, including the resulting IDLE channel and the mirrored ledger releases.

  # =========================================================================
  # Section 5 - endpoints  (74 endpoints, 1 test-driving clock endpoint)
  # =========================================================================
  - section: endpoints
    instances:
      - name: patch_program_updates_only_the_supplied_fields_and_bumps_the_version
        claim_type: Standard CRUD
        grounds:
          - endpoints["PATCH /programs/{programId}"]
          - entities.Program
        distinguishing_aspect: |
          Every input of the PATCH is optional, so a body carrying two fields must leave the other
          four untouched, bump version from 1 to 2 and move updated_at while created_at stays put.
          A PUT-style implementation that resets the omitted pools to their defaults fails, and a
          PATCH on an unknown id must be ERR_PROGRAM_NOT_FOUND rather than a silent create.
        test_recipe:
          setup:
            - "One Program created with pool_job_board_cents 300000 and send_quota_total 40, everything else defaulted."
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "Talent Brand FY26", fiscal_year: 2026, pool_job_board_cents: 300000, send_quota_total: 40 }
              as: BrandProgramLead
              captures: { program_id: $.data.id }
          trigger:
            - call: "PATCH /programs/${program_id}"
              payload: { attribution_model: "POSITION_BASED", pool_social_cents: 150000 }
              as: BrandProgramLead
            - call: "PATCH /programs/44444444-4444-4444-8444-444444444444"
              payload: { flex_reserve_cents: 1 }
              as: BrandProgramLead
              captures: { error_id: $.data.error_id }
          assert:
            - "Trigger call 1 returns 200 with data.attribution_model == POSITION_BASED and data.pool_social_cents == 150000"
            - "data.pool_job_board_cents is still 300000, data.send_quota_total is still 40, data.pool_programmatic_cents is still 0 and data.flex_reserve_cents is still 0"
            - "data.version == 2, data.updated_at > data.created_at and data.name is unchanged (name is not a PATCH input at all)"
            - "Trigger call 2 returns 404 with data.error_id == ERR_PROGRAM_NOT_FOUND and no Program row is created"

      - name: persona_review_action_endpoint_can_request_a_revision_and_re_approve
        claim_type: Action endpoint
        grounds:
          - endpoints["POST /candidate-personas/{personaId}/review"]
          - state_machines.CandidatePersona["IN_REVIEW -> DRAFT"]
          - state_machines.CandidatePersona["IN_REVIEW -> APPROVED"]
        distinguishing_aspect: |
          One action endpoint carries two transitions selected by the decision enum:
          REQUEST_REVISION returns the persona to DRAFT and increments revision_count, while APPROVE
          moves it to APPROVED. Re-submitting after a revision must be allowed, and every call must
          store reviewed_by_user_id and last_review_note from the acting reviewer.
        test_recipe:
          setup:
            - "One Program, one JobFamily, one channel and one DRAFT persona with a 400-sample signal, giving mix_confidence_pct 40 - exactly the submit floor."
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "Talent Brand FY26", fiscal_year: 2026 }
              as: BrandProgramLead
              captures: { program_id: $.data.id }
            - call: "POST /job-families"
              payload: { program_id: "${program_id}", name: "Software Engineering", code: "SWE", cpqa_target_cents: 15000, priority_rank: 1 }
              as: BrandProgramLead
              captures: { family_id: $.data.id }
            - call: "POST /channels"
              payload: { program_id: "${program_id}", name: "Board A", channel_type: "JOB_BOARD", daily_capacity_cents: 100000 }
              as: BrandProgramLead
              captures: { ch1_id: $.data.id }
            - call: "POST /candidate-personas"
              payload: { job_family_id: "${family_id}", name: "Backend IC", mix_method: "SURVEY_WEIGHTED", research_window_days: 180 }
              as: PersonaResearcher
              as_user_id: "u-res-1"
              captures: { persona_id: $.data.id }
            - call: "POST /channel-preference-signals"
              payload: { persona_id: "${persona_id}", channel_id: "${ch1_id}", preference_score: 70, sample_size: 400, engagement_events: 100, collected_at: "2026-07-20T00:00:00Z" }
              as: PersonaResearcher
              as_user_id: "u-res-1"
            - call: "POST /candidate-personas/${persona_id}/submit"
              as: PersonaResearcher
              as_user_id: "u-res-1"
          trigger:
            - call: "POST /candidate-personas/${persona_id}/review"
              payload: { decision: "REQUEST_REVISION", review_note: "add a second channel" }
              as: BrandProgramLead
              as_user_id: "u-lead-1"
            - call: "POST /candidate-personas/${persona_id}/submit"
              as: PersonaResearcher
              as_user_id: "u-res-1"
            - call: "POST /candidate-personas/${persona_id}/review"
              payload: { decision: "APPROVE", review_note: "good now" }
              as: BrandProgramLead
              as_user_id: "u-lead-1"
            - call: "POST /candidate-personas/${persona_id}/review"
              payload: { decision: "APPROVE", review_note: "again" }
              as: BrandProgramLead
              as_user_id: "u-lead-1"
              captures: { error_id: $.data.error_id }
          assert:
            - "Trigger call 1 returns 200 with data.state == DRAFT, data.revision_count == 1, data.reviewed_by_user_id == u-lead-1 and data.last_review_note == add a second channel"
            - "Trigger call 2 returns 200 with data.state == IN_REVIEW and data.mix_confidence_pct == 40 (floor(400 / 10)), exactly MIN_CONFIDENCE_TO_SUBMIT_PCT"
            - "Trigger call 3 returns 200 with data.state == APPROVED and data.revision_count still 1"
            - "Trigger call 4 returns 409 with data.error_id == ERR_PERSONA_NOT_IN_REVIEW"

      - name: conversion_computed_read_reports_null_before_any_application_exists
        claim_type: Computed read
        grounds:
          - endpoints["GET /job-postings/{postingId}/conversion"]
          - calculations.posting_conversion_metrics
        distinguishing_aspect: |
          The computed read is a projection over Application rows, and with an empty denominator it
          must report conversion_rate_bp null - not 0 and not an error - while the three counters
          report 0. A read on an unknown posting is still ERR_POSTING_NOT_FOUND at priority 6.
        test_recipe:
          setup:
            - "One DRAFT posting with no applications."
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "Talent Brand FY26", fiscal_year: 2026 }
              as: BrandProgramLead
              captures: { program_id: $.data.id }
            - call: "POST /job-families"
              payload: { program_id: "${program_id}", name: "Software Engineering", code: "SWE", cpqa_target_cents: 15000, priority_rank: 1 }
              as: BrandProgramLead
              captures: { family_id: $.data.id }
            - call: "POST /job-postings"
              payload: { job_family_id: "${family_id}", title: "Senior Backend Engineer", responsibility_count: 6, benefit_count: 5, pay_range_min_cents: 12000000, pay_range_max_cents: 18000000, eeo_statement_included: true, superlative_claim_included: false }
              as: BrandProgramLead
              captures: { posting_id: $.data.id }
          trigger:
            - call: "GET /job-postings/${posting_id}/conversion"
              as: MediaBuyer
            - call: "GET /job-postings/55555555-5555-4555-8555-555555555555/conversion"
              as: MediaBuyer
              captures: { error_id: $.data.error_id }
          assert:
            - "Trigger call 1 returns 200 with data.apply_start_count == 0, data.submitted_count == 0, data.qualified_count == 0 and data.conversion_rate_bp == null"
            - "The read is side-effect free - data.version is still 1 and updated_at is unchanged"
            - "Trigger call 2 returns 404 with data.error_id == ERR_POSTING_NOT_FOUND"

      - name: member_join_with_an_unknown_interest_family_returns_not_found
        claim_type: Cross-reference link
        grounds:
          - endpoints["POST /talent-community-members"]
          - validations[priority=7].ERR_JOB_FAMILY_NOT_FOUND
          - endpoints["GET /talent-community-members"]
        distinguishing_aspect: |
          interest_job_family_id is an optional cross-reference that is still validated when
          present, so a bogus value is a 404 while omitting it is legal. Once a real family is
          linked, the member must be retrievable through the interest_job_family_id filter, which is
          how nurture campaigns scoped to a family find their audience.
        test_recipe:
          setup:
            - "One Program and one JobFamily."
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "Talent Brand FY26", fiscal_year: 2026 }
              as: BrandProgramLead
              captures: { program_id: $.data.id }
            - call: "POST /job-families"
              payload: { program_id: "${program_id}", name: "Software Engineering", code: "SWE", cpqa_target_cents: 15000, priority_rank: 1 }
              as: BrandProgramLead
              captures: { family_id: $.data.id }
          trigger:
            - call: "POST /talent-community-members"
              payload: { program_id: "${program_id}", interest_job_family_id: "66666666-6666-4666-8666-666666666666", email: "ghostlink@example.com" }
              as: CommunityManager
              as_user_id: "u-cm-1"
              captures: { error_id: $.data.error_id }
            - call: "POST /talent-community-members"
              payload: { program_id: "${program_id}", interest_job_family_id: "${family_id}", email: "linked@example.com" }
              as: CommunityManager
              as_user_id: "u-cm-1"
              captures: { member_id: $.data.id }
            - call: "GET /talent-community-members?program_id=${program_id}&interest_job_family_id=${family_id}"
              as: CommunityManager
              as_user_id: "u-cm-1"
          assert:
            - "Trigger call 1 returns 404 with data.error_id == ERR_JOB_FAMILY_NOT_FOUND and no member row is created"
            - "Trigger call 2 returns 201 with data.interest_job_family_id == ${family_id}"
            - "Trigger call 3 returns exactly one row whose id is ${member_id}"
            - "A member created without interest_job_family_id is absent from that filtered list but present in GET /talent-community-members?program_id=${program_id}"

      - name: endpoint_conditional_action_of_activating_a_flight
        claim_type: Conditional action
        grounds:
          - endpoints["POST /media-flights/{flightId}/activate"]
        excluded_because:
          difficulty_instance: flight_activation_requires_its_posting_to_be_published
          rationale: |
            Activation is the scaffold's most heavily conditioned action (state, posting content
            status, posting compliance status and brand health all gate it) and the §1.8
            cross_entity_state_dependency instance already drives it from a rejected attempt on an
            OPTIMIZED posting to a successful one after publication.

  # =========================================================================
  # Section 6 - errors  (81 catalogued errors; every one must be triggerable)
  # =========================================================================
  - section: errors
    instances:
      - name: duplicate_family_code_is_scoped_to_one_program
        claim_type: Violation → Error
        grounds:
          - validations[priority=10].ERR_DUPLICATE_FAMILY_CODE
          - errors[ERR_DUPLICATE_FAMILY_CODE]
        distinguishing_aspect: |
          Uniqueness is scoped, not global: SWE twice inside one program is a 409, but the same code
          in a second program is legal. A globally unique index would wrongly reject the second
          program's family.
        test_recipe:
          setup:
            - "Two Programs; program A already owns a family with code SWE."
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "Program A", fiscal_year: 2026 }
              as: BrandProgramLead
              captures: { prog_a: $.data.id }
            - call: "POST /programs"
              payload: { name: "Program B", fiscal_year: 2026 }
              as: BrandProgramLead
              captures: { prog_b: $.data.id }
            - call: "POST /job-families"
              payload: { program_id: "${prog_a}", name: "Software Engineering", code: "SWE", cpqa_target_cents: 15000, priority_rank: 1 }
              as: BrandProgramLead
              captures: { fam_a: $.data.id }
          trigger:
            - call: "POST /job-families"
              payload: { program_id: "${prog_a}", name: "Software Engineering Duplicate", code: "SWE", cpqa_target_cents: 16000, priority_rank: 2 }
              as: BrandProgramLead
              captures: { error_id: $.data.error_id }
            - call: "POST /job-families"
              payload: { program_id: "${prog_b}", name: "Software Engineering", code: "SWE", cpqa_target_cents: 15000, priority_rank: 1 }
              as: BrandProgramLead
              captures: { fam_b: $.data.id }
          assert:
            - "Trigger call 1 returns 409 with data.error_id == ERR_DUPLICATE_FAMILY_CODE"
            - "Trigger call 2 returns 201 - ${fam_b} coexists with ${fam_a} because the scope is program_id"
            - "GET /job-families?code=SWE returns exactly two rows, one per program"

      - name: duplicate_member_email_and_duplicate_review_reference_use_different_scopes
        claim_type: Violation → Error
        grounds:
          - validations[priority=10].ERR_DUPLICATE_MEMBER_EMAIL
          - validations[priority=10].ERR_DUPLICATE_REVIEW_REF
        distinguishing_aspect: |
          The same priority-10 rule carries three different scopes: member email is unique per
          program, while review external_ref is unique per PLATFORM rather than per program - so the
          same external_ref on GLASSDOOR and on INDEED is legal even inside one program.
        test_recipe:
          setup:
            - "One Program with one member and one GLASSDOOR review carrying external_ref ref-1."
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "Talent Brand FY26", fiscal_year: 2026 }
              as: BrandProgramLead
              captures: { program_id: $.data.id }
            - call: "POST /programs"
              payload: { name: "Second Program", fiscal_year: 2026 }
              as: BrandProgramLead
              captures: { other_program_id: $.data.id }
            - call: "POST /talent-community-members"
              payload: { program_id: "${program_id}", email: "dup@example.com" }
              as: CommunityManager
              as_user_id: "u-cm-1"
              captures: { member_id: $.data.id }
            - call: "POST /employer-reviews"
              payload: { program_id: "${program_id}", platform: "GLASSDOOR", external_ref: "ref-1", rating: 4, posted_at: "2026-07-30T00:00:00Z" }
              as: CommunityManager
              as_user_id: "u-cm-1"
              captures: { review_id: $.data.id }
          trigger:
            - call: "POST /talent-community-members"
              payload: { program_id: "${program_id}", email: "dup@example.com" }
              as: CommunityManager
              as_user_id: "u-cm-1"
              captures: { error_id: $.data.error_id }
            - call: "POST /talent-community-members"
              payload: { program_id: "${other_program_id}", email: "dup@example.com" }
              as: CommunityManager
              as_user_id: "u-cm-1"
              captures: { second_member_id: $.data.id }
            - call: "POST /employer-reviews"
              payload: { program_id: "${program_id}", platform: "GLASSDOOR", external_ref: "ref-1", rating: 2, posted_at: "2026-07-31T00:00:00Z" }
              as: CommunityManager
              as_user_id: "u-cm-1"
            - call: "POST /employer-reviews"
              payload: { program_id: "${program_id}", platform: "INDEED", external_ref: "ref-1", rating: 2, posted_at: "2026-07-31T00:00:00Z" }
              as: CommunityManager
              as_user_id: "u-cm-1"
              captures: { indeed_review_id: $.data.id }
          assert:
            - "Trigger call 1 returns 409 with data.error_id == ERR_DUPLICATE_MEMBER_EMAIL"
            - "Trigger call 2 returns 201 - the email scope is program_id, so ${second_member_id} is created"
            - "Trigger call 3 returns 409 with data.error_id == ERR_DUPLICATE_REVIEW_REF (same platform, same external_ref)"
            - "Trigger call 4 returns 201 - the external_ref scope is platform, so ${indeed_review_id} coexists with ${review_id}"

      - name: unknown_touchpoint_id_returns_record_not_found
        claim_type: Violation → Error
        grounds:
          - validations[priority=6].ERR_RECORD_NOT_FOUND
          - errors[ERR_RECORD_NOT_FOUND]
        distinguishing_aspect: |
          The four ledger-like entities (channel preference signals, touchpoints, nurture sends and
          budget ledger entries) deliberately share the generic ERR_RECORD_NOT_FOUND instead of
          minting four more codes, so a bogus touchpoint id and a bogus nurture-send id return the
          same error_id while a bogus posting id still returns ERR_POSTING_NOT_FOUND.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "GET /touchpoints/77777777-7777-4777-8777-777777777777"
              as: RecruitingOps
              captures: { error_id: $.data.error_id }
            - call: "GET /nurture-sends/88888888-8888-4888-8888-888888888888"
              as: CommunityManager
              as_user_id: "u-cm-1"
            - call: "GET /budget-ledger-entries/99999999-9999-4999-8999-999999999999"
              as: BrandProgramLead
          assert:
            - "All three calls return 404 with data.error_id == ERR_RECORD_NOT_FOUND"
            - "data.message differs per resource but the code does not"
            - "GET /job-postings/99999999-9999-4999-8999-999999999999 returns ERR_POSTING_NOT_FOUND instead, proving the generic code is scoped to the ledger-like entities"

      - name: flight_on_a_career_site_channel_returns_channel_not_payable
        claim_type: Violation → Error
        grounds:
          - validations[priority=30].ERR_CHANNEL_NOT_PAYABLE
          - entities.Channel.fields.channel_type
        distinguishing_aspect: |
          Three of the six channel types (CAREER_SITE, EVENT, EMAIL) are organic surfaces that carry
          no media pool, so a paid flight on them is rejected at priority 30 - before the capacity
          rule at 47 and the budget waterfall at 48, which is why the error is
          ERR_CHANNEL_NOT_PAYABLE and not ERR_MEDIA_BUDGET_EXHAUSTED even though no pool could fund
          it. Organic channels remain legal touchpoint sources.
        test_recipe:
          setup:
            - "A program with pool_job_board_cents 1000000, one CAREER_SITE channel and one DRAFT posting."
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "Talent Brand FY26", fiscal_year: 2026, pool_job_board_cents: 1000000 }
              as: BrandProgramLead
              captures: { program_id: $.data.id }
            - call: "POST /job-families"
              payload: { program_id: "${program_id}", name: "Software Engineering", code: "SWE", cpqa_target_cents: 15000, priority_rank: 1 }
              as: BrandProgramLead
              captures: { family_id: $.data.id }
            - call: "POST /channels"
              payload: { program_id: "${program_id}", name: "Careers Site", channel_type: "CAREER_SITE", daily_capacity_cents: 100000 }
              as: BrandProgramLead
              captures: { organic_id: $.data.id }
            - call: "POST /job-postings"
              payload: { job_family_id: "${family_id}", title: "Senior Backend Engineer", responsibility_count: 6, benefit_count: 5, pay_range_min_cents: 12000000, pay_range_max_cents: 18000000, eeo_statement_included: true, superlative_claim_included: false }
              as: BrandProgramLead
              captures: { posting_id: $.data.id }
            - call: "GET /programs/${program_id}"
              as: MediaBuyer
              captures: { prog_v: $.data.version }
          trigger:
            - call: "POST /media-flights"
              payload: { channel_id: "${organic_id}", job_family_id: "${family_id}", job_posting_id: "${posting_id}", start_date: "2026-08-05", end_date: "2026-08-10", daily_cap_cents: 50000, expected_program_version: "${prog_v}" }
              as: MediaBuyer
              captures: { error_id: $.data.error_id }
          assert:
            - "HTTP 409 with data.error_id == ERR_CHANNEL_NOT_PAYABLE"
            - "No MediaFlight row and no BudgetLedgerEntry row exists and Program.version is still ${prog_v}"
            - "The same channel can still receive an ORGANIC_VISIT Touchpoint, so organic channels are not second-class for attribution"

      - name: list_endpoints_reject_limit_zero_and_negative_offset_with_invalid_pagination
        claim_type: Violation → Error
        grounds:
          - validations[priority=5].ERR_INVALID_PAGINATION
          - endpoints["GET /job-families"]
        distinguishing_aspect: |
          Paging bounds are limit in [1, 100] and offset >= 0, checked at priority 5 - before path
          existence at priority 6 - so a bad limit on an unknown program filter is still
          ERR_INVALID_PAGINATION with HTTP 400 (the only 400 in the catalogue). limit 1 and limit 100
          are both legal, so the rejection must be strictly outside the closed interval.
        test_recipe:
          setup:
            - "One Program with one JobFamily so that a valid page has content."
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "Talent Brand FY26", fiscal_year: 2026 }
              as: BrandProgramLead
              captures: { program_id: $.data.id }
            - call: "POST /job-families"
              payload: { program_id: "${program_id}", name: "Software Engineering", code: "SWE", cpqa_target_cents: 15000, priority_rank: 1 }
              as: BrandProgramLead
              captures: { family_id: $.data.id }
          trigger:
            - call: "GET /job-families?program_id=${program_id}&limit=0"
              as: BrandProgramLead
              captures: { error_id: $.data.error_id }
            - call: "GET /job-families?program_id=${program_id}&limit=101"
              as: BrandProgramLead
            - call: "GET /job-families?program_id=${program_id}&offset=-1"
              as: BrandProgramLead
            - call: "GET /job-families?program_id=${program_id}&limit=100&offset=0"
              as: BrandProgramLead
          assert:
            - "Trigger calls 1, 2 and 3 return HTTP 400 with data.error_id == ERR_INVALID_PAGINATION"
            - "Trigger call 4 returns 200 with exactly one row whose id is ${family_id} - limit 100 is inside the closed interval"
            - "limit=1 is likewise accepted, so the interval is [1, 100] and not (1, 100)"
            - "The same rule applies unchanged to every list endpoint, including GET /budget-ledger-entries"

  # =========================================================================
  # Section 7 - rbac  (8 roles, role_model segregation_of_duties)
  # =========================================================================
  - section: rbac
    instances:
      - name: persona_researcher_cannot_publish_a_posting_or_clear_compliance
        claim_type: peer_roles
        grounds:
          - roles.PersonaResearcher
          - roles.BrandProgramLead.exclusive_operations
          - validations[priority=3].ERR_ROLE_NOT_PERMITTED
        distinguishing_aspect: |
          The six staff roles are peers, not a hierarchy: the researcher who owns persona research
          cannot publish a posting and the media buyer cannot clear compliance, and the 403 must fire
          at priority 3 - before the priority-6 path lookup, so an unknown posting id under a wrong
          role still returns ERR_ROLE_NOT_PERMITTED rather than ERR_POSTING_NOT_FOUND.
        test_recipe:
          setup:
            - "One OPTIMIZED posting that would be publishable by its owner role."
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "Talent Brand FY26", fiscal_year: 2026 }
              as: BrandProgramLead
              captures: { program_id: $.data.id }
            - call: "POST /job-families"
              payload: { program_id: "${program_id}", name: "Software Engineering", code: "SWE", cpqa_target_cents: 15000, priority_rank: 1 }
              as: BrandProgramLead
              captures: { family_id: $.data.id }
            - call: "POST /job-postings"
              payload: { job_family_id: "${family_id}", title: "Senior Backend Engineer", responsibility_count: 6, benefit_count: 5, pay_range_min_cents: 12000000, pay_range_max_cents: 18000000, eeo_statement_included: true, superlative_claim_included: false }
              as: BrandProgramLead
              captures: { posting_id: $.data.id, pv1: $.data.version }
            - call: "POST /job-postings/${posting_id}/optimize"
              payload: { expected_posting_version: "${pv1}" }
              as: BrandProgramLead
              as_user_id: "u-lead-1"
          trigger:
            - call: "POST /job-postings/${posting_id}/publish"
              as: PersonaResearcher
              as_user_id: "u-res-1"
              captures: { error_id: $.data.error_id }
            - call: "POST /job-postings/${posting_id}/compliance-review"
              payload: { decision: "CLEAR", note: "not my job" }
              as: MediaBuyer
            - call: "POST /job-postings/aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa/publish"
              as: PersonaResearcher
              as_user_id: "u-res-1"
          assert:
            - "All three calls return HTTP 403 with data.error_id == ERR_ROLE_NOT_PERMITTED"
            - "JobPosting.${posting_id} is still OPTIMIZED with compliance_status UNREVIEWED and version 2"
            - "Trigger call 3 proves the RBAC check at priority 3 precedes the path-existence check at priority 6"
            - "GET /job-postings/${posting_id} succeeds for PersonaResearcher - reads are shared operations"

      - name: candidate_cannot_change_another_members_consent
        claim_type: peer_roles
        grounds:
          - roles.Candidate.identity
          - validations[priority=8].ERR_NOT_RESOURCE_OWNER
          - endpoints["POST /talent-community-members/{memberId}/consent-change"]
        distinguishing_aspect: |
          Candidate is the only entity_backed role: its X-User-ID IS a TalentCommunityMember id, so a
          candidate may pause her own subscription and nothing else. The ownership check is priority
          8, after the role check at 3 but before every state rule, so a candidate acting on a
          foreign UNSUBSCRIBED member gets ERR_NOT_RESOURCE_OWNER and not
          ERR_CONSENT_TRANSITION_INVALID. A CommunityManager is exempt on this endpoint.
        test_recipe:
          setup:
            - "Two SUBSCRIBED members M1 and M2 of the same program."
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "Talent Brand FY26", fiscal_year: 2026 }
              as: BrandProgramLead
              captures: { program_id: $.data.id }
            - call: "POST /talent-community-members"
              payload: { program_id: "${program_id}", email: "m1@example.com" }
              as: Anonymous
              captures: { m1: $.data.id, t1: $.data.consent_token }
            - call: "POST /talent-community-members"
              payload: { program_id: "${program_id}", email: "m2@example.com" }
              as: Anonymous
              captures: { m2: $.data.id, t2: $.data.consent_token }
            - call: "POST /talent-community-members/${m1}/confirm-consent"
              payload: { consent_token: "${t1}" }
              as: Anonymous
            - call: "POST /talent-community-members/${m2}/confirm-consent"
              payload: { consent_token: "${t2}" }
              as: Anonymous
          trigger:
            - call: "POST /talent-community-members/${m2}/consent-change"
              payload: { action: "UNSUBSCRIBE" }
              as: Candidate
              as_user_id: "${m1}"
              captures: { error_id: $.data.error_id }
            - call: "POST /talent-community-members/${m1}/consent-change"
              payload: { action: "PAUSE" }
              as: Candidate
              as_user_id: "${m1}"
            - call: "POST /talent-community-members/${m2}/consent-change"
              payload: { action: "PAUSE" }
              as: CommunityManager
              as_user_id: "u-cm-1"
          assert:
            - "Trigger call 1 returns 403 with data.error_id == ERR_NOT_RESOURCE_OWNER and member ${m2} stays SUBSCRIBED"
            - "Trigger call 2 returns 200 with consent_status PAUSED - the candidate may act on her own row"
            - "Trigger call 3 returns 200 - CommunityManager is not bound by the ownership rule on this endpoint"
            - "GET /talent-community-members/${m2} as Candidate with X-User-ID ${m1} returns ERR_NOT_RESOURCE_OWNER as well"

      - name: request_with_missing_x_user_role_header_returns_unauthenticated
        claim_type: peer_roles
        grounds:
          - validations[priority=1].ERR_UNAUTHENTICATED
          - validations[priority=2].ERR_UNAUTHENTICATED
          - roles.Anonymous
        distinguishing_aspect: |
          Identity is header-borne: a request to a non-Anonymous endpoint with no X-User-Role, an
          empty one, or a role outside the eight declared names is 401 at priority 1-2, while the
          same missing header on GET /job-postings is fine because Anonymous is listed there. This
          separates authentication (401) from authorisation (403).
        test_recipe:
          setup:
            - "One Program exists; one PUBLISHED posting is browsable anonymously."
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "Talent Brand FY26", fiscal_year: 2026 }
              as: BrandProgramLead
              captures: { program_id: $.data.id }
          trigger:
            - call: "GET /programs/${program_id}"
              as: BrandProgramLead
              headers_omitted: ["X-User-Role", "X-User-ID"]
              captures: { error_id: $.data.error_id }
            - call: "GET /programs/${program_id}"
              as: TalentMarketingIntern
            - call: "GET /job-postings"
              as: Anonymous
          assert:
            - "Trigger call 1 (both identity headers omitted) returns 401 with data.error_id == ERR_UNAUTHENTICATED"
            - "Trigger call 2 (X-User-Role naming a role outside the eight declared ones) returns 401 with data.error_id == ERR_UNAUTHENTICATED, not 403"
            - "Trigger call 3 returns 200 with an empty list - Anonymous is a declared role on that endpoint and needs no headers"
            - "No row is mutated by any of the three calls"

      - name: the_same_user_cannot_optimize_a_posting_and_then_clear_its_compliance
        claim_type: Segregation of duties
        grounds:
          - validations[priority=9].ERR_SEGREGATION_OF_DUTIES
          - state_machines.JobPosting["UNREVIEWED -> CLEARED"].preconditions
          - complexity_profile.role_model
        distinguishing_aspect: |
          Advertising-accuracy review must be independent of authorship, so the acting X-User-ID is
          compared against optimized_by_user_id and the 403 fires at priority 9 - before the EEO
          check at 23 - which is why a posting that is BOTH self-reviewed and missing its EEO
          statement reports ERR_SEGREGATION_OF_DUTIES. A different reviewer clears the same posting
          untouched.
        test_recipe:
          setup:
            - "One OPTIMIZED posting whose optimized_by_user_id is u-comp-1, i.e. the same person who will attempt the clearance while holding the ComplianceReviewer role."
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "Talent Brand FY26", fiscal_year: 2026 }
              as: BrandProgramLead
              captures: { program_id: $.data.id }
            - call: "POST /job-families"
              payload: { program_id: "${program_id}", name: "Software Engineering", code: "SWE", cpqa_target_cents: 15000, priority_rank: 1 }
              as: BrandProgramLead
              captures: { family_id: $.data.id }
            - call: "POST /job-postings"
              payload: { job_family_id: "${family_id}", title: "Senior Backend Engineer", responsibility_count: 6, benefit_count: 5, pay_range_min_cents: 12000000, pay_range_max_cents: 18000000, eeo_statement_included: true, superlative_claim_included: false }
              as: BrandProgramLead
              captures: { posting_id: $.data.id, pv1: $.data.version }
            - call: "POST /job-postings/${posting_id}/optimize"
              payload: { expected_posting_version: "${pv1}" }
              as: BrandProgramLead
              as_user_id: "u-comp-1"
          trigger:
            - call: "POST /job-postings/${posting_id}/compliance-review"
              payload: { decision: "CLEAR", note: "reviewing my own copy" }
              as: ComplianceReviewer
              as_user_id: "u-comp-1"
              captures: { error_id: $.data.error_id }
            - call: "POST /job-postings/${posting_id}/compliance-review"
              payload: { decision: "CLEAR", note: "independent review" }
              as: ComplianceReviewer
              as_user_id: "u-comp-2"
          assert:
            - "Trigger call 1 returns 403 with data.error_id == ERR_SEGREGATION_OF_DUTIES and compliance_status stays UNREVIEWED"
            - "Trigger call 2 returns 200 with compliance_status CLEARED and cleared_by_user_id u-comp-2"
            - "The same rule shape guards persona review against drafted_by_user_id and employer-review legal sign-off against drafted_by_user_id"
            - "JobPosting.${posting_id}.optimized_by_user_id is still u-comp-1 - a rejected review changes nothing"

  # =========================================================================
  # Section 8 - cross_cutting_complexity_layers
  #   declared layers: dual_variant_calculation, cascading_side_effects,
  #                    optimistic_concurrency, rate_threshold_triggers
  # =========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: stale_expected_program_version_on_flight_create_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[flight-create-stale-program]
          - validations[priority=11].ERR_STALE_PROGRAM_VERSION
          - endpoints["POST /media-flights"]
        distinguishing_aspect: |
          Every successful flight creation bumps Program.version because it moves committed money,
          so a buyer who reuses the version he read before his own first create is working from a
          budget picture that no longer exists and must get a 412. The rejected call must leave the
          version untouched, so an immediate retry with the freshly read version succeeds.
        test_recipe:
          setup:
            - "A program with pool_job_board_cents 1000000, one family, one JOB_BOARD channel with daily_capacity_cents 100000 and one DRAFT posting."
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "Talent Brand FY26", fiscal_year: 2026, pool_job_board_cents: 1000000 }
              as: BrandProgramLead
              captures: { program_id: $.data.id }
            - call: "POST /job-families"
              payload: { program_id: "${program_id}", name: "Software Engineering", code: "SWE", cpqa_target_cents: 15000, priority_rank: 1 }
              as: BrandProgramLead
              captures: { family_id: $.data.id }
            - call: "POST /channels"
              payload: { program_id: "${program_id}", name: "Board A", channel_type: "JOB_BOARD", daily_capacity_cents: 100000 }
              as: BrandProgramLead
              captures: { ch1_id: $.data.id }
            - call: "POST /job-postings"
              payload: { job_family_id: "${family_id}", title: "Senior Backend Engineer", responsibility_count: 6, benefit_count: 5, pay_range_min_cents: 12000000, pay_range_max_cents: 18000000, eeo_statement_included: true, superlative_claim_included: false }
              as: BrandProgramLead
              captures: { posting_id: $.data.id }
            - call: "GET /programs/${program_id}"
              as: MediaBuyer
              captures: { stale_v: $.data.version }
          trigger:
            - call: "POST /media-flights"
              payload: { channel_id: "${ch1_id}", job_family_id: "${family_id}", job_posting_id: "${posting_id}", start_date: "2026-08-05", end_date: "2026-08-10", daily_cap_cents: 50000, expected_program_version: "${stale_v}" }
              as: MediaBuyer
              captures: { flight_1: $.data.id }
            - call: "POST /media-flights"
              payload: { channel_id: "${ch1_id}", job_family_id: "${family_id}", job_posting_id: "${posting_id}", start_date: "2026-08-12", end_date: "2026-08-17", daily_cap_cents: 50000, expected_program_version: "${stale_v}" }
              as: MediaBuyer
              captures: { error_id: $.data.error_id }
            - call: "GET /programs/${program_id}"
              as: MediaBuyer
              captures: { fresh_v: $.data.version }
            - call: "POST /media-flights"
              payload: { channel_id: "${ch1_id}", job_family_id: "${family_id}", job_posting_id: "${posting_id}", start_date: "2026-08-12", end_date: "2026-08-17", daily_cap_cents: 50000, expected_program_version: "${fresh_v}" }
              as: MediaBuyer
              captures: { flight_2: $.data.id }
          assert:
            - "Trigger call 1 returns 201, total_cost_cents 257500, and Program.committed_budget_cents == 257500 with version ${fresh_v} == ${stale_v} + 1"
            - "Trigger call 2 returns HTTP 412 with data.error_id == ERR_STALE_PROGRAM_VERSION"
            - "After the 412 the program still reports version ${fresh_v} and committed_budget_cents 257500 - a rejected write neither bumps the counter nor reserves money"
            - "Trigger call 4 returns 201 for ${flight_2} and Program.committed_budget_cents == 515000 with version ${fresh_v} + 1"
            - "GET /budget-ledger-entries?program_id=${program_id} returns exactly two RESERVE rows, one per successful flight"

      - name: stale_expected_posting_version_on_optimize_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[posting-optimize-stale-posting]
          - validations[priority=12].ERR_STALE_POSTING_VERSION
          - endpoints["POST /job-postings/{postingId}/optimize"]
        distinguishing_aspect: |
          The second OCC rule guards a different parent entity with a different field: replaying the
          version captured at creation after one successful optimize is a 412, which stops a stale
          revision from silently discarding the newer copy. The 412 must arrive before the
          content-status check at priority 14 is even relevant and must not reset compliance_status.
        test_recipe:
          setup:
            - "One DRAFT posting created at version 1, then cleared by an independent reviewer after its first optimize."
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "Talent Brand FY26", fiscal_year: 2026 }
              as: BrandProgramLead
              captures: { program_id: $.data.id }
            - call: "POST /job-families"
              payload: { program_id: "${program_id}", name: "Software Engineering", code: "SWE", cpqa_target_cents: 15000, priority_rank: 1 }
              as: BrandProgramLead
              captures: { family_id: $.data.id }
            - call: "POST /job-postings"
              payload: { job_family_id: "${family_id}", title: "Senior Backend Engineer", responsibility_count: 6, benefit_count: 5, pay_range_min_cents: 12000000, pay_range_max_cents: 18000000, eeo_statement_included: true, superlative_claim_included: false }
              as: BrandProgramLead
              captures: { posting_id: $.data.id, v1: $.data.version }
            - call: "POST /job-postings/${posting_id}/optimize"
              payload: { expected_posting_version: "${v1}" }
              as: BrandProgramLead
              as_user_id: "u-lead-1"
              captures: { v2: $.data.version }
            - call: "POST /job-postings/${posting_id}/compliance-review"
              payload: { decision: "CLEAR", note: "clean" }
              as: ComplianceReviewer
              as_user_id: "u-comp-1"
              captures: { v3: $.data.version }
          trigger:
            - call: "POST /job-postings/${posting_id}/optimize"
              payload: { expected_posting_version: "${v1}", benefit_count: 2 }
              as: BrandProgramLead
              as_user_id: "u-lead-1"
              captures: { error_id: $.data.error_id }
            - call: "POST /job-postings/${posting_id}/optimize"
              payload: { expected_posting_version: "${v3}", benefit_count: 2 }
              as: BrandProgramLead
              as_user_id: "u-lead-1"
              captures: { v4: $.data.version }
          assert:
            - "Trigger call 1 returns HTTP 412 with data.error_id == ERR_STALE_POSTING_VERSION"
            - "After the 412 the posting still reports version ${v3}, benefit_count 5, optimization_score 100 and compliance_status CLEARED - the rejected optimize retracted nothing"
            - "Trigger call 2 returns 200 with version ${v4} == ${v3} + 1, benefit_count 2 and optimization_score 75 (25 + 20 + 15 + 15 + 10)"
            - "Trigger call 2 also drags compliance_status back from CLEARED to UNREVIEWED, so the two OCC rules guard genuinely different write paths"

      - name: layer_cascading_side_effects_end_to_end
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers
        excluded_because:
          difficulty_instance: qualification_cascade_five_hops_from_decide_to_budget_release
          rationale: |
            The layer's end-to-end claim is exactly the five-hop chain asserted by the §1.8
            transitive_cascade instance, hop by hop, including the ordering sensitivity between the
            THROTTLED verdict and the IDLE verdict inside one request.

      - name: layer_dual_variant_calculation_delta
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers
          - calculations.persona_channel_mix
        excluded_because:
          difficulty_instance: persona_mix_survey_weighted_vs_engagement_weighted_on_identical_signals
          rationale: |
            Both declared variant families are covered by the two §1.8 dual_variant_calc instances,
            which assert the exact per-variant outputs over identical inputs (8571/1429 versus
            6364/3636 for the mix, 3334/3333/3333 versus 4000/2000/4000 for attribution).

      - name: layer_rate_threshold_triggers_cumulative_boundary
        claim_type: rate_threshold_triggers
        grounds:
          - complexity_profile.complexity_layers
          - calculations.nurture_dispatch_selection
        excluded_because:
          difficulty_instance: frequency_cap_suppresses_at_exactly_the_cap_and_window_lower_bound_is_exclusive
          rationale: |
            The cumulative-threshold boundary (a member suppressed at exactly the 30-day frequency
            cap, with the window's lower bound exclusive) is the first §1.8 boundary_precision_check
            instance, and the instantaneous-threshold boundary is the second one on the pacing
            verdict.

  # =========================================================================
  # Section 9 - consistency_model  (immediate)
  # =========================================================================
  - section: consistency_model
    instances:
      - name: derived_program_health_is_visible_in_the_same_request_that_creates_a_review
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - calculations.program_brand_health_score.trigger
          - entities.Program.fields.brand_health_score
        distinguishing_aspect: |
          The consistency model is immediate, so the denormalised Program.brand_health_score must
          already reflect a review in the very response that creates it - no background job, no
          re-read delay. The independent read afterwards must return the identical value, which is
          how the flight-activation gate can be trusted straight after a review lands.
        test_recipe:
          setup:
            - "One Program with no reviews; clock at the default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "Talent Brand FY26", fiscal_year: 2026 }
              as: BrandProgramLead
              captures: { program_id: $.data.id }
            - call: "GET /programs/${program_id}"
              as: BrandProgramLead
              captures: { v_before: $.data.version }
          trigger:
            - call: "POST /employer-reviews"
              payload: { program_id: "${program_id}", platform: "GLASSDOOR", external_ref: "gd-immediate", rating: 1, posted_at: "2026-07-31T00:00:00Z" }
              as: CommunityManager
              as_user_id: "u-cm-1"
              captures: { review_id: $.data.id }
            - call: "GET /programs/${program_id}"
              as: CommunityManager
              as_user_id: "u-cm-1"
          assert:
            - "Before the review the program reports brand_health_score 100.00 at version ${v_before}"
            - "Trigger call 2 reports brand_health_score 95.00 (penalty max(0, 3-1) * 2.5 * 1.00 == 5.000) with the program version bumped to ${v_before} + 1"
            - "EmployerReview.${review_id}.response_due_at == 2026-08-01T00:00:00.000Z (the 24-hour band) and sla_status == PENDING"
            - "No second read is needed for the value to settle - there is no eventual-consistency lag anywhere in this API"
