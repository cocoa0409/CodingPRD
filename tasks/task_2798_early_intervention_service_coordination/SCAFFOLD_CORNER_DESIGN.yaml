      - name: visit_document_state_check_precedes_the_fiscal_unit_check
        claim_type: priority_ordering
        excluded_because:
          difficulty_instance: state_beats_fiscal_on_visit_document
          rationale: >-
            The §1.8 instance documents a visit that simultaneously violates the state precondition
            (priority 24, ERR_VISIT_NOT_SCHEDULED) and the fiscal ceiling (priority 60,
            ERR_ACTUAL_UNITS_EXCEED_SCHEDULED) and asserts the lower-numbered state error, then
            isolates each rule on its own. A §1.9 ordering test on the same endpoint pair would be a
            verbatim duplicate.

      - name: authorization_credential_check_precedes_the_unit_pool_check
        claim_type: priority_ordering
        excluded_because:
          difficulty_instance: safety_beats_constraint_on_authorization_create
          rationale: >-
            Authorization creation with an expired credential AND a units request beyond the service
            pool is already driven by that §1.8 instance, which asserts the safety error
            (priority 31, ERR_PROVIDER_CREDENTIAL_EXPIRED) rather than the capacity error at
            priority 58, and then shows the pool error surfacing once the credential is valid.

  - section: endpoints
    instances:
      - name: caseload_summary_computed_read_tracks_posture_across_a_not_eligible_drop
        claim_type: computed_read
        grounds:
          - endpoints[GET /ei/service-coordinators/{coordinatorId}/caseload-summary]
          - calculations.coordinator_caseload_aggregates
          - calculations.case_weight_points
        distinguishing_aspect: |
          The computed read is checked at a posture boundary that no single-case scenario can reach:
          two pre-plan cases at 1.50 points against a 3.20-point ceiling give utilization 0.9375,
          which is NEAR_CAP (>= 0.9000) but not AT_CAP, because weighted_caseload_points 3.00 is
          strictly below the ceiling. Determining one case NOT_ELIGIBLE then drops it out of BOTH the
          count and the weighted total in the same request, moving the posture back to OPEN.
        test_recipe:
          setup:
            - "One coordinator with max_weighted_caseload_points 3.20 and two assigned pre-plan referrals, neither with an interpreter, neither inside the 180-day transition window."
            - "Both of referral A's required assessments are completed with a NOT_ELIGIBLE recommendation but no determination has been recorded."
            - "Logical clock parked at 2026-03-20T09:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-03-02T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /ei/service-coordinators"
              payload: { full_name: "Priya Raman", county_code: "CNT_B", language_codes: ["EN"], max_weighted_caseload_points: 3.20 }
              as: ProgramAdmin
              captures: { coord_id: $.data.id }
            - call: "POST /ei/children"
              payload: { first_name: "Ada", last_name: "Nolan", date_of_birth: "2024-06-15", county_code: "CNT_B", primary_language: "EN" }
              as: IntakeSpecialist
              captures: { child_a: $.data.id }
            - call: "POST /ei/referrals"
              payload: { child_id: "${child_a}", primary_referral_source: "PHYSICIAN", referral_received_date: "2026-03-02", county_code: "CNT_B", presenting_concern: "Expressive language delay noted at the 20-month well-child visit", interpreter_required: false }
              as: IntakeSpecialist
              captures: { ref_a: $.data.id }
            - call: "POST /ei/referrals/${ref_a}/assign-coordinator"
              payload: { coordinator_id: "${coord_id}" }
              as: ProgramAdmin
            - call: "POST /ei/children"
              payload: { first_name: "Leo", last_name: "Vance", date_of_birth: "2024-08-01", county_code: "CNT_B", primary_language: "EN" }
