              as: Challenger
              as_user_id: "comm-1"
            - call: "POST /broadband/challenges/${ch_id}/triage"
              payload: {}
              as: EligibilityAnalyst
              as_user_id: "analyst-1"
            - call: "POST /_clock/set_current_utc"
