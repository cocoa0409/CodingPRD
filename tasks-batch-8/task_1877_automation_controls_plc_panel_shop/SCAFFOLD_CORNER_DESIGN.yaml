# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Task 1877: Automation Controls & PLC Panel Shop (UL 508A)
# Sections follow references/claim-extraction-guide.md.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  # Section: entities
  # ===========================================================================
  - section: entities
    instances:
      - name: customer_creation_applies_defaults
        claim_type: defaults
        grounds: [entities.Customer.fields.credit_hold, entities.Customer.fields.warranty_labor_tier]
        distinguishing_aspect: "Omitting credit_hold and warranty_labor_tier on POST /customers applies defaults false and TIER_REGIONAL."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /panel-shop/customers"
              payload: { company_name: "Default Co", site_state_code: "UT" }
              as: ProjectManager
              captures: { c_dfl: "$.data.id" }
          trigger:
            - call: "GET /panel-shop/customers/${c_dfl}"
              payload: {}
              as: ProjectManager
          assert:
            - "Customer.${c_dfl}.credit_hold == false"
            - "Customer.${c_dfl}.warranty_labor_tier == TIER_REGIONAL"
            - "Customer.${c_dfl}.version == 1"

      - name: job_creation_rejects_negative_price
        claim_type: type_constraint
        grounds: [entities.Job.fields.quoted_price_cents, "validations[priority=18]"]
        distinguishing_aspect: "quoted_price_cents < 0 violates the >= 0 constraint -> ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["customer exists"]
          setup_api_calls:
            - call: "POST /panel-shop/customers"
              payload: { company_name: "Neg Co", site_state_code: "UT" }
              as: ProjectManager
              captures: { c_neg: "$.data.id" }
          trigger:
            - call: "POST /panel-shop/jobs"
              payload: { customer_id: "${c_neg}", job_number: "J-NEG", quoted_price_cents: -1 }
              as: ProjectManager
              captures: { err_neg: "$.data.error_id" }
          assert:
            - "response status == 400 and error_id == ERR_INVALID_REQUEST"

      - name: panel_component_extended_cost_computed_input_ignored
        claim_type: computed_field
        grounds: [entities.PanelComponent.fields.extended_cost_cents, calculations.bom_cost_rollup]
        distinguishing_aspect: "extended_cost_cents is server-computed as quantity * unit_cost_snapshot_cents; a client-supplied extended_cost_cents value in the create payload is rejected as an unknown field."
        test_recipe:
          setup: ["panel with catalog component costing 8000 cents"]
          setup_api_calls:
            - call: "POST /panel-shop/customers"
              payload: { company_name: "Comp Co", site_state_code: "ID" }
              as: ProjectManager
              captures: { c_cc: "$.data.id" }
            - call: "POST /panel-shop/jobs"
              payload: { customer_id: "${c_cc}", job_number: "J-CC1", quoted_price_cents: 100000 }
              as: ProjectManager
              captures: { j_cc: "$.data.id" }
            - call: "POST /panel-shop/jobs/${j_cc}/panels"
              payload: { panel_tag: "P-CC1", enclosure_rating: "NEMA_1", design_engineer_id: "de-cc" }
              as: DesignEngineer
              captures: { p_cc: "$.data.id" }
            - call: "POST /panel-shop/components"
              payload: { part_number: "CON-CC", component_class: "CONTACTOR", unit_cost_cents: 8000, lead_time_days: 5, sccr_ka: 10, heat_dissipation_w: 20 }
              as: QAManager
              captures: { comp_cc: "$.data.id" }
          trigger:
            - call: "POST /panel-shop/panels/${p_cc}/components"
              payload: { component_id: "${comp_cc}", quantity: 3 }
              as: DesignEngineer
              captures: { line_cc: "$.data.id" }
            - call: "GET /panel-shop/panels/${p_cc}/components"
              payload: {}
              as: DesignEngineer
          assert:
            - "PanelComponent.${line_cc}.extended_cost_cents == 24000 (3 * 8000)"
            - "PanelComponent.${line_cc}.unit_cost_snapshot_cents == 8000"
            - "PanelComponent.${line_cc}.line_status == PENDING"

      - name: catalog_component_get_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]", "validations[priority=4]"]
        distinguishing_aspect: "GET with a well-formed but nonexistent UUID returns ERR_NOT_FOUND 404, not a 500 or empty body."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /panel-shop/components/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: QAManager
              captures: { err_nf: "$.data.error_id" }
          assert:
            - "response status == 404 and error_id == ERR_NOT_FOUND"

      - name: job_number_unique_per_customer_duplicate_rejected
        claim_type: type_constraint
        grounds: [entities.Job.fields.job_number, "errors[ERR_DUPLICATE]"]
        distinguishing_aspect: "job_number uniqueness is scoped per customer: same job_number for a DIFFERENT customer succeeds, same customer is rejected with ERR_DUPLICATE."
        test_recipe:
          setup: ["two customers; first already owns job J-DUP"]
          setup_api_calls:
            - call: "POST /panel-shop/customers"
              payload: { company_name: "Dup A", site_state_code: "UT" }
              as: ProjectManager
              captures: { c_da: "$.data.id" }
            - call: "POST /panel-shop/customers"
              payload: { company_name: "Dup B", site_state_code: "UT" }
              as: ProjectManager
              captures: { c_db: "$.data.id" }
            - call: "POST /panel-shop/jobs"
              payload: { customer_id: "${c_da}", job_number: "J-DUP", quoted_price_cents: 100 }
              as: ProjectManager
          trigger:
            - call: "POST /panel-shop/jobs"
              payload: { customer_id: "${c_db}", job_number: "J-DUP", quoted_price_cents: 100 }
              as: ProjectManager
              captures: { j_dup_ok: "$.data.id" }
            - call: "POST /panel-shop/jobs"
              payload: { customer_id: "${c_da}", job_number: "J-DUP", quoted_price_cents: 100 }
              as: ProjectManager
              captures: { err_dup: "$.data.error_id" }
          assert:
            - "cross-customer reuse succeeds: Job.${j_dup_ok}.job_number == J-DUP"
            - "same-customer reuse rejected with ERR_DUPLICATE http 409"

      - name: panel_creation_cascades_asbuilt_package
        claim_type: creation_side_effect
        grounds: [entities.AsBuiltPackage, state_machines.AsBuiltPackage]
        distinguishing_aspect: "POST /jobs/{id}/panels auto-creates the panel's AsBuiltPackage with all four flags false, completeness_pct 0, status INCOMPLETE — discoverable only via the reverse-reachability GET."
        test_recipe:
          setup: ["job exists"]
          setup_api_calls:
            - call: "POST /panel-shop/customers"
              payload: { company_name: "Cascade Co", site_state_code: "UT" }
              as: ProjectManager
              captures: { c_ca: "$.data.id" }
            - call: "POST /panel-shop/jobs"
              payload: { customer_id: "${c_ca}", job_number: "J-CA1", quoted_price_cents: 100000 }
              as: ProjectManager
              captures: { j_ca: "$.data.id" }
            - call: "POST /panel-shop/jobs/${j_ca}/panels"
              payload: { panel_tag: "P-CA1", enclosure_rating: "NEMA_12", design_engineer_id: "de-c1" }
              as: DesignEngineer
              captures: { p_ca: "$.data.id" }
          trigger:
            - call: "GET /panel-shop/panels/${p_ca}/as-built-packages"
              payload: {}
              as: DesignEngineer
              captures: { abp_ca: "$.data[0].id" }
          assert:
            - "exactly one AsBuiltPackage exists for the panel"
            - "AsBuiltPackage.${abp_ca}.status == INCOMPLETE"
            - "AsBuiltPackage.${abp_ca}.completeness_pct == 0"
            - "Job.${j_ca}.status == DESIGN (first panel creation auto-advances OPEN -> DESIGN)"

      - name: immutable_testpoint_has_no_version_field_update_path
        claim_type: immutability
        grounds: [entities.TestPoint]
        distinguishing_aspect: "TestPoint declares common_fields: false — it carries id and created_at only, no version/updated_at; results mutate only via record-result, and no PATCH /test-points endpoint exists."
        test_recipe:
          setup: ["panel with one test point"]
          setup_api_calls:
            - call: "POST /panel-shop/customers"
              payload: { company_name: "Imm Co", site_state_code: "UT" }
              as: ProjectManager
              captures: { c_im: "$.data.id" }
            - call: "POST /panel-shop/jobs"
              payload: { customer_id: "${c_im}", job_number: "J-IM1", quoted_price_cents: 100000 }
              as: ProjectManager
              captures: { j_im: "$.data.id" }
            - call: "POST /panel-shop/jobs/${j_im}/panels"
              payload: { panel_tag: "P-IM1", enclosure_rating: "NEMA_1", design_engineer_id: "de-im" }
              as: DesignEngineer
              captures: { p_im: "$.data.id" }
          trigger:
            - call: "POST /panel-shop/panels/${p_im}/test-points"
              payload: { point_label: "TP-IM1", expected_signal: "CONTINUITY", sequence_no: 1 }
              as: DesignEngineer
              captures: { tp_im: "$.data.id" }
          assert:
            - "response data has id and created_at keys"
            - "response data has NO version key and NO updated_at key (common_fields: false)"

  # ===========================================================================
  # Section: state_machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: terminal_job_close_rejects_further_transitions
        claim_type: terminal_lockdown
        grounds: [state_machines.Job]
        distinguishing_aspect: "From CLOSED (terminal), every Job action endpoint (advance, hold, resume, ship, close) is rejected with ERR_INVALID_STATE."
        test_recipe:
          setup: ["job fully commissioned and then closed (single panel, all gates passed)"]
          setup_api_calls:
            - call: "POST /panel-shop/customers"
              payload: { company_name: "Term Co", site_state_code: "UT" }
              as: ProjectManager
              captures: { c_tm: "$.data.id" }
            - call: "POST /panel-shop/jobs"
              payload: { customer_id: "${c_tm}", job_number: "J-TM1", quoted_price_cents: 100000, warranty_months: 12 }
              as: ProjectManager
              captures: { j_tm: "$.data.id" }
            - call: "POST /panel-shop/jobs/${j_tm}/panels"
              payload: { panel_tag: "P-TM1", enclosure_rating: "NEMA_1", design_engineer_id: "de-tm" }
              as: DesignEngineer
              captures: { p_tm: "$.data.id" }
            - call: "POST /panel-shop/components"
              payload: { part_number: "BPD-TM", component_class: "BRANCH_PROTECTIVE", unit_cost_cents: 45000, lead_time_days: 7, sccr_ka: 100, heat_dissipation_w: 12 }
              as: QAManager
              captures: { comp_tm: "$.data.id" }
            - call: "POST /panel-shop/panels/${p_tm}/components"
              payload: { component_id: "${comp_tm}", quantity: 1 }
              as: DesignEngineer
            - call: "POST /panel-shop/panels/${p_tm}/submit-review"
              payload: {}
              as: DesignEngineer
            - call: "POST /panel-shop/panels/${p_tm}/approve-design"
              payload: {}
              as: QAManager
              as_user_id: "qa-tm"
            - call: "POST /panel-shop/panels/${p_tm}/release-procurement"
              payload: {}
              as: ProjectManager
            - call: "GET /panel-shop/panels/${p_tm}/components"
              payload: {}
              as: ShopLead
              captures: { line_tm: "$.data[0].id" }
            - call: "POST /panel-shop/panel-components/${line_tm}/receive"
              payload: {}
              as: ShopLead
            - call: "POST /panel-shop/panels/${p_tm}/start-wiring"
              payload: {}
              as: ShopLead
            - call: "POST /panel-shop/panels/${p_tm}/test-points"
              payload: { point_label: "TP-TM1", expected_signal: "CONTINUITY", sequence_no: 1 }
              as: DesignEngineer
              captures: { tp_tm: "$.data.id" }
            - call: "POST /panel-shop/panels/${p_tm}/begin-test"
              payload: {}
              as: ShopLead
            - call: "POST /panel-shop/panels/${p_tm}/test-sessions"
              payload: { technician_id: "tt-tm" }
              as: TestTechnician
              captures: { ts_tm: "$.data.id" }
            - call: "POST /panel-shop/test-sessions/${ts_tm}/record-result"
              payload: { test_point_id: "${tp_tm}", outcome: "PASS" }
              as: TestTechnician
              as_user_id: "tt-tm"
            - call: "POST /panel-shop/test-sessions/${ts_tm}/complete"
              payload: {}
              as: TestTechnician
              as_user_id: "tt-tm"
            - call: "GET /panel-shop/panels/${p_tm}"
              payload: {}
              as: ControlsEngineer
              captures: { pv_tm_ver: "$.data.version" }
            - call: "POST /panel-shop/panels/${p_tm}/program-versions"
              payload: { version_tag: "v1.0.0", content_hash: "77770000eeff0011223344556677889900112233445566778899aabbccddeeff00", expected_panel_version: "${pv_tm_ver}" }
              as: ControlsEngineer
              captures: { pv_tm: "$.data.id" }
            - call: "POST /panel-shop/panels/${p_tm}/request-label"
              payload: {}
              as: QAManager
              as_user_id: "qa-tm"
            - call: "POST /panel-shop/panels/${p_tm}/affix-label"
              payload: {}
              as: QAManager
              as_user_id: "qa-tm"
            - call: "GET /panel-shop/panels/${p_tm}/as-built-packages"
              payload: {}
              as: DesignEngineer
              captures: { abp_tm: "$.data[0].id" }
            - call: "PATCH /panel-shop/as-built-packages/${abp_tm}"
              payload: { has_wiring_diagram: true, has_program_archive: true }
              as: DesignEngineer
            - call: "POST /panel-shop/as-built-packages/${abp_tm}/approve"
              payload: {}
              as: QAManager
              as_user_id: "qa-tm"
            - call: "POST /panel-shop/as-built-packages/${abp_tm}/release"
              payload: {}
              as: ProjectManager
            - call: "POST /panel-shop/jobs/${j_tm}/ship"
              payload: {}
              as: ShippingClerk
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T08:00:00Z" }
              as: ProjectManager
            - call: "POST /panel-shop/panels/${p_tm}/startup-sessions"
              payload: { scheduled_start: "2026-10-01T08:00:00Z", scheduled_end: "2026-10-01T18:00:00Z", engineer_id: "fe-tm", support_mode: "ONSITE" }
              as: ProjectManager
              captures: { ss_tm: "$.data.id" }
            - call: "POST /panel-shop/program-versions/${pv_tm}/mark-site-backup"
              payload: {}
              as: FieldEngineer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T09:00:00Z" }
              as: ProjectManager
            - call: "POST /panel-shop/startup-sessions/${ss_tm}/start"
              payload: {}
              as: FieldEngineer
              as_user_id: "fe-tm"
            - call: "POST /panel-shop/startup-sessions/${ss_tm}/complete"
              payload: { labor_hours: 4 }
              as: FieldEngineer
              as_user_id: "fe-tm"
            - call: "POST /panel-shop/jobs/${j_tm}/close"
              payload: {}
              as: ProjectManager
          trigger:
            - call: "POST /panel-shop/jobs/${j_tm}/hold"
              payload: {}
              as: ProjectManager
              captures: { err_tm: "$.data.error_id" }
          assert:
            - "Job.${j_tm}.status == CLOSED"
            - "POST hold on CLOSED job rejected with ERR_INVALID_STATE http 409"

      - name: substitution_withdraw_by_non_requester_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.SubstitutionRequest.REQUESTED_to_WITHDRAWN]
        distinguishing_aspect: "Only the requesting DesignEngineer (user id == requested_by_id) may withdraw; a different engineer's withdraw attempt is rejected with ERR_UNAUTHORIZED."
        test_recipe:
          setup: ["open substitution requested by de-w1 on a DESIGN panel"]
          setup_api_calls:
            - call: "POST /panel-shop/customers"
              payload: { company_name: "Wdr Co", site_state_code: "UT" }
              as: ProjectManager
              captures: { c_wd: "$.data.id" }
            - call: "POST /panel-shop/jobs"
              payload: { customer_id: "${c_wd}", job_number: "J-WD1", quoted_price_cents: 100000 }
              as: ProjectManager
              captures: { j_wd: "$.data.id" }
            - call: "POST /panel-shop/jobs/${j_wd}/panels"
              payload: { panel_tag: "P-WD1", enclosure_rating: "NEMA_1", design_engineer_id: "de-w1" }
              as: DesignEngineer
              captures: { p_wd: "$.data.id" }
            - call: "POST /panel-shop/components"
              payload: { part_number: "PS-W1", component_class: "POWER_SUPPLY", unit_cost_cents: 30000, lead_time_days: 10, sccr_ka: 10, heat_dissipation_w: 40 }
              as: QAManager
              captures: { comp_w1: "$.data.id" }
            - call: "POST /panel-shop/components"
              payload: { part_number: "PS-W2", component_class: "POWER_SUPPLY", unit_cost_cents: 31000, lead_time_days: 20, sccr_ka: 10, heat_dissipation_w: 40 }
              as: QAManager
              captures: { comp_w2: "$.data.id" }
            - call: "POST /panel-shop/panels/${p_wd}/components"
              payload: { component_id: "${comp_w1}", quantity: 1 }
              as: DesignEngineer
              captures: { line_wd: "$.data.id" }
            - call: "POST /panel-shop/panels/${p_wd}/substitution-requests"
              payload: { original_line_id: "${line_wd}", proposed_component_id: "${comp_w2}", reason: "lead time" }
              as: DesignEngineer
              as_user_id: "de-w1"
              captures: { sub_wd: "$.data.id" }
          trigger:
            - call: "POST /panel-shop/substitution-requests/${sub_wd}/withdraw"
              payload: {}
              as: DesignEngineer
              as_user_id: "de-w2"
              captures: { err_wd: "$.data.error_id" }
          assert:
            - "withdraw by non-requester de-w2 rejected with ERR_UNAUTHORIZED http 403"
            - "SubstitutionRequest.${sub_wd}.status remains REQUESTED"

      - name: program_release_supersedes_prior_released_version
        claim_type: side_effect_execution
        grounds: [state_machines.ProgramVersion.DRAFT_to_RELEASED, state_machines.ProgramVersion.RELEASED_to_SUPERSEDED]
        distinguishing_aspect: "Releasing v2 cascades the prior RELEASED v1 to SUPERSEDED (at most one RELEASED version per panel at any time); v1 remains readable and archivable."
        test_recipe:
          setup: ["panel with one RELEASED program v1.0.0"]
          setup_api_calls:
            - call: "POST /panel-shop/customers"
              payload: { company_name: "Sup Co", site_state_code: "UT" }
              as: ProjectManager
              captures: { c_sp: "$.data.id" }
            - call: "POST /panel-shop/jobs"
              payload: { customer_id: "${c_sp}", job_number: "J-SP1", quoted_price_cents: 100000 }
              as: ProjectManager
              captures: { j_sp: "$.data.id" }
            - call: "POST /panel-shop/jobs/${j_sp}/panels"
              payload: { panel_tag: "P-SP1", enclosure_rating: "NEMA_1", design_engineer_id: "de-sp" }
              as: DesignEngineer
              captures: { p_sp: "$.data.id", p_sp_v0: "$.data.version" }
            - call: "POST /panel-shop/panels/${p_sp}/program-versions"
              payload: { version_tag: "v1.0.0", content_hash: "88880000eeff0011223344556677889900112233445566778899aabbccddeeff00", expected_panel_version: "${p_sp_v0}" }
              as: ControlsEngineer
              captures: { pv_sp1: "$.data.id" }
          trigger:
            - call: "GET /panel-shop/panels/${p_sp}"
              payload: {}
              as: ControlsEngineer
              captures: { p_sp_v1: "$.data.version" }
            - call: "POST /panel-shop/panels/${p_sp}/program-versions"
              payload: { version_tag: "v2.0.0", content_hash: "99990000eeff0011223344556677889900112233445566778899aabbccddeeff00", expected_panel_version: "${p_sp_v1}" }
              as: ControlsEngineer
              captures: { pv_sp2: "$.data.id" }
          assert:
            - "ProgramVersion.${pv_sp2}.status == RELEASED"
            - "ProgramVersion.${pv_sp1}.status == SUPERSEDED (cascade)"
            - "GET /panel-shop/panels/${p_sp}/program-versions?status=RELEASED returns exactly one row"

      - name: test_session_complete_by_other_technician_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.TestSession.OPEN_to_COMPLETED]
        distinguishing_aspect: "Only the technician who opened the session (technician_id) may complete it; a different technician's complete is rejected with ERR_UNAUTHORIZED even when all points are decided."
        test_recipe:
          setup: ["POINT_TO_POINT panel, session opened by tt-x1, its single point recorded PASS"]
          setup_api_calls:
            - call: "POST /panel-shop/customers"
              payload: { company_name: "Tech Co", site_state_code: "UT" }
              as: ProjectManager
              captures: { c_tc: "$.data.id" }
            - call: "POST /panel-shop/jobs"
              payload: { customer_id: "${c_tc}", job_number: "J-TC1", quoted_price_cents: 100000 }
              as: ProjectManager
              captures: { j_tc: "$.data.id" }
            - call: "POST /panel-shop/jobs/${j_tc}/panels"
              payload: { panel_tag: "P-TC1", enclosure_rating: "NEMA_1", design_engineer_id: "de-tc" }
              as: DesignEngineer
              captures: { p_tc: "$.data.id" }
            - call: "POST /panel-shop/components"
              payload: { part_number: "BPD-TC", component_class: "BRANCH_PROTECTIVE", unit_cost_cents: 45000, lead_time_days: 7, sccr_ka: 100, heat_dissipation_w: 12 }
              as: QAManager
              captures: { comp_tc: "$.data.id" }
            - call: "POST /panel-shop/panels/${p_tc}/components"
              payload: { component_id: "${comp_tc}", quantity: 1 }
              as: DesignEngineer
            - call: "POST /panel-shop/panels/${p_tc}/submit-review"
              payload: {}
              as: DesignEngineer
            - call: "POST /panel-shop/panels/${p_tc}/approve-design"
              payload: {}
              as: QAManager
              as_user_id: "qa-tc"
            - call: "POST /panel-shop/panels/${p_tc}/release-procurement"
              payload: {}
              as: ProjectManager
            - call: "GET /panel-shop/panels/${p_tc}/components"
              payload: {}
              as: ShopLead
              captures: { line_tc: "$.data[0].id" }
            - call: "POST /panel-shop/panel-components/${line_tc}/receive"
              payload: {}
              as: ShopLead
            - call: "POST /panel-shop/panels/${p_tc}/start-wiring"
              payload: {}
              as: ShopLead
            - call: "POST /panel-shop/panels/${p_tc}/test-points"
              payload: { point_label: "TP-TC1", expected_signal: "CONTINUITY", sequence_no: 1 }
              as: DesignEngineer
              captures: { tp_tc: "$.data.id" }
            - call: "POST /panel-shop/panels/${p_tc}/begin-test"
              payload: {}
              as: ShopLead
            - call: "POST /panel-shop/panels/${p_tc}/test-sessions"
              payload: { technician_id: "tt-x1" }
              as: TestTechnician
              captures: { ts_tc: "$.data.id" }
            - call: "POST /panel-shop/test-sessions/${ts_tc}/record-result"
              payload: { test_point_id: "${tp_tc}", outcome: "PASS" }
              as: TestTechnician
              as_user_id: "tt-x1"
          trigger:
            - call: "POST /panel-shop/test-sessions/${ts_tc}/complete"
              payload: {}
              as: TestTechnician
              as_user_id: "tt-x2"
              captures: { err_tc: "$.data.error_id" }
          assert:
            - "complete by tt-x2 rejected with ERR_UNAUTHORIZED http 403"
