  - name: exchange_file_expired_blocks_subscription
    claim_type: triggerability
    grounds:
    - validations[priority=21]
    - errors[ERR_EXCHANGE_FILE_INVALID_STATE]
    excluded_because:
      difficulty_instance: priority_pair_validation_conflict / state_exchange_file_expired_beats_fiscal_below_minimum
      rationale: The named §1.8 instance marks the file EXPIRED and asserts ERR_EXCHANGE_FILE_INVALID_STATE as the winning error.
  - name: accreditation_expired_blocks_subscription
    claim_type: triggerability
    grounds:
    - validations[priority=29]
    - errors[ERR_ACCREDITATION_EXPIRED]
    excluded_because:
      difficulty_instance: priority_pair_validation_conflict / safety_accreditation_expired_beats_temporal_exchange_deadline
      rationale: The named §1.8 instance lapses the accreditation and asserts ERR_ACCREDITATION_EXPIRED at 422.
  - name: distribution_declared_without_an_executed_master_lease
    claim_type: triggerability
    grounds:
    - validations[priority=18]
    - errors[ERR_MASTER_LEASE_NOT_EXECUTED]
    excluded_because:
      difficulty_instance: cross_entity_state_dependency / distribution_declare_requires_master_lease_executed
      rationale: The named §1.8 instance declares a distribution against a DRAFT lease and asserts ERR_MASTER_LEASE_NOT_EXECUTED.
  - name: subscription_without_an_identification_for_the_trust_property
    claim_type: triggerability
    grounds:
    - validations[priority=53]
    - errors[ERR_IDENTIFICATION_MISSING_FOR_TRUST]
    excluded_because:
      difficulty_instance: cross_entity_state_dependency / subscription_close_requires_active_identification_for_trust_property
      rationale: The named §1.8 instance revokes the identification before closing and asserts ERR_IDENTIFICATION_MISSING_FOR_TRUST.
  - name: overlapping_distribution_period_rejected
    claim_type: triggerability
    grounds:
    - validations[priority=44]
    - errors[ERR_DISTRIBUTION_PERIOD_OVERLAP]
    excluded_because:
      difficulty_instance: resource_temporal_overlap / distribution_period_half_open_adjacent_ok_overlap_rejected
      rationale: The named §1.8 instance asserts both the adjacent-accepted and the overlapping-rejected halves of priority 44.
  - name: overlapping_master_lease_term_rejected
    claim_type: triggerability
    grounds:
    - validations[priority=45]
    - errors[ERR_LEASE_TERM_OVERLAP]
    excluded_because:
      difficulty_instance: resource_temporal_overlap / master_lease_closed_interval_shared_endpoint_day_rejected
      rationale: The named §1.8 instance asserts the single-shared-day rejection under priority 45.
