              payload: { borrower_id: "${borr_id}", program_id: "${prog_id}", investor_code: "INV-ALPHA", loan_amount_cents: 30000000, purchase_price_cents: 40000000, property_value_cents: 40000000, occupancy: "PRIMARY", purpose: "PURCHASE", lien_position: "FIRST", note_rate_pct: 7.500, apor_pct: 6.100, term_months: 360, amortization_type: "FULLY_AMORTIZING", monthly_taxes_cents: 50000, monthly_insurance_cents: 15000 }
              captures: { lf_id: "$.data.id" }
            - call: "POST /loan-files/${lf_id}/doc-type-selection"
              as: Underwriter
