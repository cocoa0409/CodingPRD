          Two ASSOCIATION leads (multiplier 1.00, so the additive raw score is the score) differ only in
          total_requested_room_nights: 90 gives room_night_points 9 and a score of exactly 30, the
          inclusive QUALIFICATION_FLOOR, so the lead QUALIFIES; 80 gives 8 and a score of 29, one below,
          so the lead is TURNED_DOWN and its HELD FunctionSpaceHold is released by the cascade. A `>`
          comparison instead of `>=` flips only the first lead.
