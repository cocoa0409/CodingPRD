          The (style_id, market_code) pair is a capacity-1 resource over time and the occupied window is HALF-OPEN [effective_from, effective_to): a second label starting inside the first window is ERR_LABEL_WINDOW_OVERLAP 409, while a third label starting at the exact instant the first ends is accepted - so an implementation that treats the window as closed at both ends wrongly rejects the adjacent publication, and one that ignores the interval entirely wrongly accepts the overlapping one.
