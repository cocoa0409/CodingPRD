scaffold_difficulty_design:

  # =====================================================================
  # RULE 1 — dual_variant_calc
  # Two calculations where two defensible approaches diverge numerically,
  # on DIFFERENT entity domains: regulatory slot utilisation (SlotHolding)
  # vs fleet-engineering ground time (Aircraft).
  # =====================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: slot_utilization_as_operated_versus_as_filed_diverge_on_one_holding
        grounds:
          - calculations.slot_utilization_credit
          - entities.SlotHolding.fields.utilization_pct
          - entities.SlotHolding.fields.utilization_pct_as_filed
          - entities.SlotHolding.fields.credited_operations
          - entities.SlotHolding.fields.attached_operations
          - entities.SlotHolding.fields.at_risk_of_loss
        distinguishing_aspect: |
          This instance lives in the SlotHolding / regulatory-utilisation entity domain: one and the
          same holding reports utilization_pct 60.00 from the as_operated variant (credited historical
          operations) and utilization_pct_as_filed 80.00 from the as_filed variant (currently attached
          legs), a pinned delta of 20.00 that straddles the 80.00 threshold in opposite directions.
        test_recipe:
          setup:
            - "Logical clock at its default 2026-08-01T00:00:00Z."
            - "Home carrier HX (DE) and stations FRA (LEVEL_3_COORDINATED, gate_count 2) and MUC (LEVEL_2_FACILITATED, gate_count 3) exist."
            - "Season W26 is OPEN with slot_return_deadline_utc 2026-09-15T23:59:59Z."
            - "One DEPARTURE SlotHolding at FRA, slot_time_utc 2026-11-02T08:00:00Z, days_of_week \"1\", series_weeks 5 -> planned_operations 5."
            - "Four FRA->MUC legs on the four Mondays 2026-11-02/09/16/23, each 08:00Z->09:00Z, each assigned to tail D-AHXA and each attached to that holding -> attached_operations 4."
            - "Four SlotUtilizationRecords posted OUT of chronological order with outcomes OPERATED, OPERATED, CANCELLED_ATC, CANCELLED_CARRIER -> credited_operations 3."
          setup_api_calls:
            - call: "POST /carriers"
              payload: { iata_code: "HX", icao_code: "HXA", country_code: "DE", is_home_carrier: true }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { home_carrier_id: "$.data.id" }
            - call: "POST /stations"
              payload: { iata_code: "FRA", country_code: "DE", coordination_level: "LEVEL_3_COORDINATED", utc_offset_minutes: 120, gate_count: 2, maintenance_capable: true }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { fra_id: "$.data.id" }
            - call: "POST /stations"
              payload: { iata_code: "MUC", country_code: "DE", coordination_level: "LEVEL_2_FACILITATED", utc_offset_minutes: 120, gate_count: 3, maintenance_capable: true }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { muc_id: "$.data.id" }
            - call: "POST /seasons"
              payload: { season_code: "W26", start_date: "2026-10-25T00:00:00Z", end_date: "2027-03-27T00:00:00Z", slot_return_deadline_utc: "2026-09-15T23:59:59Z", filing_change_window_close_utc: "2026-10-11T23:59:59Z" }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { season_id: "$.data.id" }
            - call: "POST /seasons/${season_id}/transition"
              payload: { to_status: "OPEN" }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
            - call: "POST /aircraft"
              payload: { carrier_id: "${home_carrier_id}", base_station_id: "${fra_id}", registration: "D-AHXA", fleet_type_code: "B738", seats: 189, min_turn_minutes: 45, max_daily_block_minutes: 600, required_check_minutes: 240, maintenance_check_required: false }
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
              captures: { ac1_id: "$.data.id" }
            - call: "POST /schedule-versions"
              payload: { carrier_id: "${home_carrier_id}", season_id: "${season_id}", version_label: "W26-R1" }
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
              captures: { sv_id: "$.data.id" }
            - call: "POST /slot-holdings"
              payload: { station_id: "${fra_id}", season_id: "${season_id}", carrier_id: "${home_carrier_id}", movement_type: "DEPARTURE", slot_time_utc: "2026-11-02T08:00:00Z", days_of_week: "1", series_weeks: 5, historic_precedence: false }
              as: SlotCoordinator
              as_user_id: "usr-coord-1"
              captures: { sh_id: "$.data.id" }
            - call: "POST /flight-legs"
              payload: { schedule_version_id: "${sv_id}", flight_number: "HX101", origin_station_id: "${fra_id}", dest_station_id: "${muc_id}", dep_utc: "2026-11-02T08:00:00Z", arr_utc: "2026-11-02T09:00:00Z", fleet_type_code: "B738" }
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
              captures: { leg1_id: "$.data.id" }
            - call: "POST /flight-legs"
              payload: { schedule_version_id: "${sv_id}", flight_number: "HX101", origin_station_id: "${fra_id}", dest_station_id: "${muc_id}", dep_utc: "2026-11-09T08:00:00Z", arr_utc: "2026-11-09T09:00:00Z", fleet_type_code: "B738" }
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
              captures: { leg2_id: "$.data.id" }
            - call: "POST /flight-legs"
              payload: { schedule_version_id: "${sv_id}", flight_number: "HX101", origin_station_id: "${fra_id}", dest_station_id: "${muc_id}", dep_utc: "2026-11-16T08:00:00Z", arr_utc: "2026-11-16T09:00:00Z", fleet_type_code: "B738" }
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
              captures: { leg3_id: "$.data.id" }
            - call: "POST /flight-legs"
              payload: { schedule_version_id: "${sv_id}", flight_number: "HX101", origin_station_id: "${fra_id}", dest_station_id: "${muc_id}", dep_utc: "2026-11-23T08:00:00Z", arr_utc: "2026-11-23T09:00:00Z", fleet_type_code: "B738" }
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
              captures: { leg4_id: "$.data.id" }
            - call: "POST /flight-legs/${leg1_id}/assign-aircraft"
              payload: { aircraft_id: "${ac1_id}" }
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
            - call: "POST /flight-legs/${leg2_id}/assign-aircraft"
              payload: { aircraft_id: "${ac1_id}" }
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
            - call: "POST /flight-legs/${leg3_id}/assign-aircraft"
              payload: { aircraft_id: "${ac1_id}" }
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
            - call: "POST /flight-legs/${leg4_id}/assign-aircraft"
              payload: { aircraft_id: "${ac1_id}" }
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
            - call: "POST /flight-legs/${leg1_id}/attach-slot"
              payload: { slot_holding_id: "${sh_id}", movement_type: "DEPARTURE" }
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
            - call: "POST /flight-legs/${leg2_id}/attach-slot"
              payload: { slot_holding_id: "${sh_id}", movement_type: "DEPARTURE" }
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
            - call: "POST /flight-legs/${leg3_id}/attach-slot"
              payload: { slot_holding_id: "${sh_id}", movement_type: "DEPARTURE" }
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
            - call: "POST /flight-legs/${leg4_id}/attach-slot"
              payload: { slot_holding_id: "${sh_id}", movement_type: "DEPARTURE" }
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
            - call: "POST /slot-utilization-records"
              payload: { slot_holding_id: "${sh_id}", operation_date: "2026-11-16T08:00:00Z", outcome: "CANCELLED_ATC" }
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
            - call: "POST /slot-utilization-records"
              payload: { slot_holding_id: "${sh_id}", operation_date: "2026-11-02T08:00:00Z", outcome: "OPERATED" }
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
            - call: "POST /slot-utilization-records"
              payload: { slot_holding_id: "${sh_id}", operation_date: "2026-11-23T08:00:00Z", outcome: "CANCELLED_CARRIER" }
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
            - call: "POST /slot-utilization-records"
              payload: { slot_holding_id: "${sh_id}", operation_date: "2026-11-09T08:00:00Z", outcome: "OPERATED" }
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
          trigger:
            - call: "GET /slot-holdings/${sh_id}"
              payload: {}
              as: SlotCoordinator
              as_user_id: "usr-coord-1"
          assert:
            - "SlotHolding.${sh_id}.planned_operations == 5"
            - "SlotHolding.${sh_id}.credited_operations == 3"
            - "SlotHolding.${sh_id}.utilization_pct == 60.00"
            - "SlotHolding.${sh_id}.attached_operations == 4"
            - "SlotHolding.${sh_id}.utilization_pct_as_filed == 80.00"
            - "SlotHolding.${sh_id}.utilization_pct_as_filed - SlotHolding.${sh_id}.utilization_pct == 20.00"
            - "SlotHolding.${sh_id}.at_risk_of_loss == false because at_risk_of_loss keys on utilization_pct_as_filed 80.00, which is NOT strictly below 80.00"
            - "SlotHolding.${sh_id}.holding_status == HELD"
            - "ScheduleVersion.${sv_id}.at_risk_slot_count == 0"
            - "ScheduleVersion.${sv_id}.schedule_compliance_score == 100.00"
            - "ScheduleVersion.${sv_id}.compliance_state == CLEAN"
            - "the four SlotUtilizationRecords were POSTed in the order 11-16, 11-02, 11-23, 11-09 and credited_operations is still exactly 3, proving the chronological input_set ordering does not depend on insertion order"

      - name: maintenance_contiguous_window_versus_cumulative_ground_diverge_on_one_tail
        grounds:
          - calculations.maintenance_opportunity_minutes
          - entities.Aircraft.fields.maintenance_opportunity_minutes
          - entities.Aircraft.fields.cumulative_ground_minutes
          - entities.Aircraft.fields.required_check_minutes
          - state_machines.ScheduleVersion.DRAFT_to_VALIDATED
          - validations[priority=46]
        distinguishing_aspect: |
          This instance lives in the Aircraft / fleet-engineering entity domain (not SlotHolding):
          the same tail's ground time reads 150 minutes under the contiguous_window variant and 270
          minutes under the cumulative_ground variant, a delta of 120, and against
          required_check_minutes 240 the two variants return OPPOSITE verdicts — cumulative would pass,
          contiguous fails, and the gate uses contiguous so validate is rejected with
          ERR_MAINTENANCE_OPPORTUNITY_INSUFFICIENT.
        test_recipe:
          setup:
            - "Logical clock at its default 2026-08-01T00:00:00Z."
            - "Home carrier HX (DE); MUC is maintenance_capable true, TXL is maintenance_capable false."
            - "Season W26 is OPEN."
            - "Tail D-AHXB is based at MUC with min_turn_minutes 45, max_daily_block_minutes 600, required_check_minutes 240 and maintenance_check_required true."
            - "Five legs on the single UTC date 2026-11-03 form the rotation MUC->TXL->MUC->TXL->MUC->TXL at 06:00-07:00, 07:45-08:45, 11:15-12:15, 13:00-14:00 and 16:00-17:00, all assigned to that tail."
            - "Ground intervals: 45 min at TXL (discarded, not maintenance_capable), 150 min at MUC, 45 min at TXL (discarded), 120 min at MUC."
          setup_api_calls:
            - call: "POST /carriers"
              payload: { iata_code: "HX", icao_code: "HXA", country_code: "DE", is_home_carrier: true }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { home_carrier_id: "$.data.id" }
            - call: "POST /stations"
              payload: { iata_code: "MUC", country_code: "DE", coordination_level: "LEVEL_2_FACILITATED", utc_offset_minutes: 120, gate_count: 3, maintenance_capable: true }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { muc_id: "$.data.id" }
            - call: "POST /stations"
              payload: { iata_code: "TXL", country_code: "DE", coordination_level: "LEVEL_2_FACILITATED", utc_offset_minutes: 120, gate_count: 2, curfew_start_local_minutes: 1380, curfew_end_local_minutes: 330, maintenance_capable: false }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { txl_id: "$.data.id" }
            - call: "POST /seasons"
              payload: { season_code: "W26", start_date: "2026-10-25T00:00:00Z", end_date: "2027-03-27T00:00:00Z", slot_return_deadline_utc: "2026-09-15T23:59:59Z", filing_change_window_close_utc: "2026-10-11T23:59:59Z" }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { season_id: "$.data.id" }
            - call: "POST /seasons/${season_id}/transition"
              payload: { to_status: "OPEN" }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
            - call: "POST /aircraft"
              payload: { carrier_id: "${home_carrier_id}", base_station_id: "${muc_id}", registration: "D-AHXB", fleet_type_code: "B738", seats: 189, min_turn_minutes: 45, max_daily_block_minutes: 600, required_check_minutes: 240, maintenance_check_required: true }
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
              captures: { ac_mx_id: "$.data.id" }
            - call: "POST /schedule-versions"
              payload: { carrier_id: "${home_carrier_id}", season_id: "${season_id}", version_label: "W26-MX" }
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
              captures: { sv_id: "$.data.id" }
            - call: "POST /flight-legs"
              payload: { schedule_version_id: "${sv_id}", flight_number: "HX201", origin_station_id: "${muc_id}", dest_station_id: "${txl_id}", dep_utc: "2026-11-03T06:00:00Z", arr_utc: "2026-11-03T07:00:00Z", fleet_type_code: "B738" }
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
              captures: { m1_id: "$.data.id" }
            - call: "POST /flight-legs"
              payload: { schedule_version_id: "${sv_id}", flight_number: "HX202", origin_station_id: "${txl_id}", dest_station_id: "${muc_id}", dep_utc: "2026-11-03T07:45:00Z", arr_utc: "2026-11-03T08:45:00Z", fleet_type_code: "B738" }
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
              captures: { m2_id: "$.data.id" }
            - call: "POST /flight-legs"
              payload: { schedule_version_id: "${sv_id}", flight_number: "HX203", origin_station_id: "${muc_id}", dest_station_id: "${txl_id}", dep_utc: "2026-11-03T11:15:00Z", arr_utc: "2026-11-03T12:15:00Z", fleet_type_code: "B738" }
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
              captures: { m3_id: "$.data.id" }
            - call: "POST /flight-legs"
              payload: { schedule_version_id: "${sv_id}", flight_number: "HX204", origin_station_id: "${txl_id}", dest_station_id: "${muc_id}", dep_utc: "2026-11-03T13:00:00Z", arr_utc: "2026-11-03T14:00:00Z", fleet_type_code: "B738" }
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
              captures: { m4_id: "$.data.id" }
            - call: "POST /flight-legs"
              payload: { schedule_version_id: "${sv_id}", flight_number: "HX205", origin_station_id: "${muc_id}", dest_station_id: "${txl_id}", dep_utc: "2026-11-03T16:00:00Z", arr_utc: "2026-11-03T17:00:00Z", fleet_type_code: "B738" }
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
              captures: { m5_id: "$.data.id" }
            - call: "POST /flight-legs/${m1_id}/assign-aircraft"
              payload: { aircraft_id: "${ac_mx_id}" }
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
            - call: "POST /flight-legs/${m2_id}/assign-aircraft"
              payload: { aircraft_id: "${ac_mx_id}" }
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
            - call: "POST /flight-legs/${m3_id}/assign-aircraft"
              payload: { aircraft_id: "${ac_mx_id}" }
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
            - call: "POST /flight-legs/${m4_id}/assign-aircraft"
              payload: { aircraft_id: "${ac_mx_id}" }
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
            - call: "POST /flight-legs/${m5_id}/assign-aircraft"
              payload: { aircraft_id: "${ac_mx_id}" }
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
          trigger:
            - call: "GET /aircraft/${ac_mx_id}/rotation-feasibility"
              payload: {}
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
            - call: "POST /schedule-versions/${sv_id}/validate"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "usr-comp-1"
          assert:
            - "GET /aircraft/${ac_mx_id}/rotation-feasibility returns maintenance_opportunity_minutes == 150"
            - "GET /aircraft/${ac_mx_id}/rotation-feasibility returns cumulative_ground_minutes == 270"
            - "GET /aircraft/${ac_mx_id}/rotation-feasibility returns rotation_feasibility_status == \"FEASIBLE\" and total_block_minutes == 300"
            - "cumulative_ground_minutes - maintenance_opportunity_minutes == 120"
            - "Aircraft.${ac_mx_id}.maintenance_opportunity_minutes == 150 and Aircraft.${ac_mx_id}.cumulative_ground_minutes == 270"
            - "POST /schedule-versions/${sv_id}/validate returns HTTP 422 with error_id ERR_MAINTENANCE_OPPORTUNITY_INSUFFICIENT"
            - "the rejection proves the gate reads the contiguous_window variant: 150 < 240 fails while the cumulative_ground variant 270 >= 240 would have passed"
            - "ScheduleVersion.${sv_id}.filing_status == DRAFT unchanged after the rejected validate"

  # =====================================================================
  # RULE 2 — combinatorial_formula
  # Instance 1 = MODE (b): nested rounding where the ORDER of rounding
  #              changes the answer.
  # Instance 2 = MODE (c): a circular-looking dependency (total = subtotal
  #              + fee, fee keyed on the subtotal, subtotal keyed on a
  #              count-driven tier) resolved by a pinned evaluation order.
  # The two instances therefore fall in DIFFERENT modes.
  # =====================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: notification_compensation_rounds_each_cabin_before_summing
        grounds:
          - calculations.notification_compensation_cents
          - entities.PassengerNotificationObligation.fields.compensation_cents
          - entities.PassengerNotificationObligation.fields.obligation_tier
          - entities.PassengerNotificationObligation.fields.booked_total
          - entities.PassengerNotificationObligation.fields.notify_deadline_utc
        distinguishing_aspect: |
          MODE (b) — nested rounding whose order is outcome-changing: rounding each of the three cabin
          amounts to whole cents FIRST and then summing yields compensation_cents 561132, while summing
          the three unrounded amounts and rounding once at the end yields 561131, a reproducible 1-cent
          divergence created by choosing rates whose 37.50% products all land on exactly .5.
        test_recipe:
          setup:
            - "Logical clock at its default 2026-08-01T00:00:00Z."
            - "Home carrier HX (DE); stations MUC and TXL (both LEVEL_2_FACILITATED, so no slot is required)."
            - "Season W26 is OPEN; one DRAFT ScheduleVersion W26-N1 exists."
            - "One MUC->TXL leg on 2026-11-03 06:00Z->07:00Z carries the booking snapshot booked_first 3, booked_business 7, booked_economy 41 (booked_total 51)."
          setup_api_calls:
            - call: "POST /carriers"
              payload: { iata_code: "HX", icao_code: "HXA", country_code: "DE", is_home_carrier: true }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { home_carrier_id: "$.data.id" }
            - call: "POST /stations"
              payload: { iata_code: "MUC", country_code: "DE", coordination_level: "LEVEL_2_FACILITATED", utc_offset_minutes: 120, gate_count: 3, maintenance_capable: true }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { muc_id: "$.data.id" }
            - call: "POST /stations"
              payload: { iata_code: "TXL", country_code: "DE", coordination_level: "LEVEL_2_FACILITATED", utc_offset_minutes: 120, gate_count: 2, maintenance_capable: false }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { txl_id: "$.data.id" }
            - call: "POST /seasons"
              payload: { season_code: "W26", start_date: "2026-10-25T00:00:00Z", end_date: "2027-03-27T00:00:00Z", slot_return_deadline_utc: "2026-09-15T23:59:59Z", filing_change_window_close_utc: "2026-10-11T23:59:59Z" }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
              captures: { season_id: "$.data.id" }
            - call: "POST /seasons/${season_id}/transition"
              payload: { to_status: "OPEN" }
              as: SystemAdmin
              as_user_id: "usr-admin-1"
            - call: "POST /schedule-versions"
              payload: { carrier_id: "${home_carrier_id}", season_id: "${season_id}", version_label: "W26-N1" }
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
              captures: { sv_id: "$.data.id" }
            - call: "POST /flight-legs"
              payload: { schedule_version_id: "${sv_id}", flight_number: "HX301", origin_station_id: "${muc_id}", dest_station_id: "${txl_id}", dep_utc: "2026-11-03T06:00:00Z", arr_utc: "2026-11-03T07:00:00Z", fleet_type_code: "B738" }
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
              captures: { leg_id: "$.data.id" }
            - call: "POST /flight-legs/${leg_id}/booking-snapshot"
              payload: { booked_first: 3, booked_business: 7, booked_economy: 41 }
              as: NetworkPlanner
              as_user_id: "${home_carrier_id}"
          trigger:
            - call: "POST /notification-obligations"
              payload: { flight_leg_id: "${leg_id}", trigger_kind: "RETIME", change_magnitude_minutes: 45 }
              as: ComplianceOfficer
              as_user_id: "usr-comp-1"
              captures: { obl_id: "$.data.id" }
          assert:
            - "PassengerNotificationObligation.${obl_id}.booked_total == 51"
            - "PassengerNotificationObligation.${obl_id}.obligation_tier == ADVISORY because 45 < TIER_THRESHOLD_MINUTES 120"
            - "PassengerNotificationObligation.${obl_id}.compensation_cents == 561132"
            - "PassengerNotificationObligation.${obl_id}.compensation_cents != 561131, the value a sum-then-round-once implementation produces"
            - "the three per-cabin components are 69188, 105662 and 386282 (each an exact .5 rounded half-up), summing to 561132"
            - "PassengerNotificationObligation.${obl_id}.notify_deadline_utc == \"2026-08-04T00:00:00Z\" (clock 2026-08-01T00:00:00Z plus NOTIFY_WINDOW_HOURS 72)"
            - "PassengerNotificationObligation.${obl_id}.status == PENDING"
            - "FlightLeg.${leg_id}.open_obligation_count == 1"

      - name: filing_charge_expedite_fee_keyed_on_post_surcharge_subtotal_not_raw
        grounds:
          - calculations.filing_change_charge_cents
          - entities.FilingSubmission.fields.changed_leg_count
