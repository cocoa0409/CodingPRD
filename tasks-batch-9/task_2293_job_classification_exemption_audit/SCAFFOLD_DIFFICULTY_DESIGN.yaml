              as: ProgramAdmin
              as_user_id: "pa-1"
            - call: "POST /audit-projects"
              payload: { name: "FY26 Classification Audit", fiscal_year: 2026, lookback_policy: "STANDARD_2Y" }
              as: ProgramAdmin
              as_user_id: "pa-1"
              captures: { proj_id: $.data.id }
            - call: "POST /job-families"
              payload: { audit_project_id: "${proj_id}", name: "Operations Umbrella", code: "OPS-UMB" }
              as: ProgramAdmin
              as_user_id: "pa-1"
              captures: { parent_fam_id: $.data.id }
            - call: "POST /job-families"
              payload: { audit_project_id: "${proj_id}", name: "Shift Leadership", code: "OPS-SHIFT", parent_family_id: "${parent_fam_id}" }
              as: ProgramAdmin
              as_user_id: "pa-1"
              captures: { child_fam_id: $.data.id }
            - call: "POST /audit-projects/${proj_id}/status"
              payload: { target_status: "FIELDWORK" }
              as: ProgramAdmin
              as_user_id: "pa-1"
          trigger:
            - call: "POST /positions"
              payload: { job_family_id: "${child_fam_id}", title: "Shift Supervisor", job_code: "SS-100", current_fls_status: "EXEMPT", claimed_exemption_test: "EXECUTIVE", annual_salary_cents: 5500000, salary_basis: "SALARY", work_state_code: "CA", incumbent_count: 2, avg_weekly_hours: 47, requires_advanced_degree: false, works_primarily_offsite: false }
              as: ProgramAdmin
              as_user_id: "pa-1"
              captures: { pos_id: $.data.id }
          assert:
            - "JobFamily.${parent_fam_id}.family_headcount == 0"
            - "JobFamily.${parent_fam_id}.risk_score == 0"
            - "JobFamily.${parent_fam_id}.risk_tier == LOW"
            - "JobFamily.${parent_fam_id}.risk_variant == EVIDENCE_WEIGHTED"
            - "JobFamily.${parent_fam_id}.open_misclassified_count == 0"
            - "JobFamily.${parent_fam_id}.remediation_priority_rank == null"
            - "JobFamily.${child_fam_id}.family_headcount == 2"
            - "JobFamily.${child_fam_id}.risk_variant == SCREENING"
            - "JobFamily.${child_fam_id}.risk_score == 96 and risk_tier == CRITICAL"
            - "AuditProject.${proj_id}.open_misclassified_headcount == 0"
            - "no 500 and no null risk_score anywhere"

      - name: corroboration_spread_boundary_flips_at_one_tenth_of_a_point
        grounds:
          - calculations.duties_corroboration
          - constants.CORROBORATION_SPREAD_MAX_PCT
          - entities.Position.fields.duties_validation_status
          - entities.Position.fields.primary_duty_pct
        distinguishing_aspect: |
          Value domain: a one-decimal percentage tolerance, distinct from both the cent-level
          money boundary and the empty-set boundary. Position S has a manager/incumbent spread
          of exactly 15.0 and stays CORROBORATED, so the 40/60 weighted mean 51.0 is adopted;
          Position T differs only in the manager figure 60.1, giving spread 15.1, which tips it
          to CONFLICTED so the conservative minimum 45.0 is adopted instead. The tolerance is
          inclusive, and crossing it changes the aggregation function, not just a flag.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; StateRule CA present; AuditProject in FIELDWORK with one JobFamily."
            - "Position S and Position T are identical: CA, EXECUTIVE, annual_salary_cents 5500000, incumbent_count 2, avg_weekly_hours 47."
            - "Interviewer int-4 holds four back-to-back windows; every interview reports 45 hours for the manager and 49 for the incumbent, 3 and 2 supervised, hire-fire influence on both sides."
