            - "${err_journal} == \"ERR_SALES_JOURNAL_NOT_FOUND\", ${err_session} == \"ERR_TILL_SESSION_NOT_FOUND\", ${err_txn} == \"ERR_SAFE_TRANSACTION_NOT_FOUND\""
            - "${err_deposit} == \"ERR_DEPOSIT_NOT_FOUND\", ${err_credit} == \"ERR_BANK_CREDIT_RECORD_NOT_FOUND\", ${err_settlement} == \"ERR_CARD_SETTLEMENT_NOT_FOUND\""
            - "${err_case} == \"ERR_VARIANCE_CASE_NOT_FOUND\", ${err_order} == \"ERR_CHANGE_ORDER_NOT_FOUND\""
            - "every response carries a non-empty data.message and a meta.api_request_id"

      - name: second_open_request_on_an_armed_safe_returns_open_request_active
        claim_type: triggerability
        grounds:
          - validations[priority=40]
          - state_machines.Safe.LOCKED_to_OPEN_REQUESTED
          - errors[ERR_SAFE_OPEN_REQUEST_ACTIVE]
        distinguishing_aspect: >
          Arming is only legal from LOCKED: a second open-request while the safe is already
          OPEN_REQUESTED returns 409 ERR_SAFE_OPEN_REQUEST_ACTIVE and does not restart the time-delay
          clock — open_requested_at stays at 09:00:00Z.
        test_recipe:
          setup:
            - "Store S-1965 with MANUAL safe SAFE-A (500000) armed at 09:00:00Z by U-CLERK-1"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T09:00:00Z" }
              as: TreasuryAnalyst
            - call: "POST /cash-ops/stores"
              payload: { store_code: "S-1965", name: "Store 1965", region_code: "WEST" }
              as: TreasuryAnalyst
              as_user_id: "U-TREAS-1"
              captures: { store_id: $.data.id }
            - call: "POST /cash-ops/safes"
              payload: { store_id: "${store_id}", safe_code: "SAFE-A", safe_type: "MANUAL", opening_balance_cents: 500000 }
              as: TreasuryAnalyst
              as_user_id: "U-TREAS-1"
              captures: { safe_id: $.data.id }
            - call: "POST /cash-ops/safes/${safe_id}/open-requests"
              payload: { reason: "First arming" }
              as: CashOfficeClerk
              as_user_id: "U-CLERK-1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T09:03:00Z" }
              as: TreasuryAnalyst
          trigger:
            - call: "POST /cash-ops/safes/${safe_id}/open-requests"
              payload: { reason: "Impatient second arming" }
              as: StoreManager
              as_user_id: "U-MGR-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 409 and data.error_id == \"ERR_SAFE_OPEN_REQUEST_ACTIVE\""
            - "Safe.${safe_id}.open_state == \"OPEN_REQUESTED\", open_requested_at == \"2026-08-03T09:00:00Z\", open_requested_by_user_id == \"U-CLERK-1\""
            - "Safe.${safe_id}.version == 2 — the rejected arming wrote nothing"

      - name: attribution_on_a_closed_case_returns_variance_case_invalid_state
        claim_type: triggerability
        grounds:
