            - call: "GET /review-tasks"
              payload: {review_route_id: "${r_2}", discipline: "LEGAL"}
              as: PackagingCoordinator
              as_user_id: "u_coord"
              captures: { t_2_legal: "$.data[0].id" }
            - call: "GET /review-tasks"
              payload: {review_route_id: "${r_2}", discipline: "QUALITY"}
              as: PackagingCoordinator
              as_user_id: "u_coord"
              captures: { t_2_qa: "$.data[0].id" }
            - call: "POST /review-tasks/${t_2_brand}/decision"
              payload: {decision: "APPROVED", comment: "Brand identity approved."}
              as: BrandReviewer
