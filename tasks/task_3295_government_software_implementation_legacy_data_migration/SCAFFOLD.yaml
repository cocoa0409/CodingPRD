errors:
- id: ERR_UNAUTHENTICATED
  http: 401
  condition: Missing/invalid X-User-Role or X-User-ID
- id: ERR_FORBIDDEN
  http: 403
  condition: Role not permitted for this endpoint
- id: ERR_NOT_FOUND
  http: 404
  condition: Path-templated resource does not exist
- id: ERR_REFERENCE_NOT_FOUND
  http: 404
  condition: Body-referenced FK id does not exist
- id: ERR_INVALID_REQUEST
  http: 400
  condition: Missing required field or malformed payload
- id: ERR_INVALID_STATE
  http: 409
  condition: Target resource not in a from-state of the requested transition
- id: ERR_STALE_VERSION
  http: 412
  condition: OCC expected_*_version does not match current parent version
- id: ERR_SEGREGATION_OF_DUTIES
  http: 422
  condition: Same user attempts both submit/reconcile and accept of the same artifact
- id: ERR_GO_LIVE_IN_BLACKOUT
  http: 422
  condition: planned_date inside a blackout statutory/election/fiscal window (closed interval)
- id: ERR_GO_LIVE_DATE_MISMATCH
  http: 422
  condition: execute on wrong date or rollback beyond 14-day window
- id: ERR_GO_LIVE_PREREQUISITE
  http: 422
  condition: go-live execute with non-ACCEPTED batch or non-CERTIFIED interface
- id: ERR_READINESS_TOO_LOW
  http: 422
  condition: readiness_score < 80 at approve
- id: ERR_CERTIFICATION_WINDOW_OVERLAP
  http: 409
  condition: certification window shares interior dates with a non-CANCELLED certification of the same interface
- id: ERR_CERTIFICATION_OUTSIDE_WINDOW
  http: 422
  condition: begin certification when logical clock date outside [window_starts_on, window_ends_on]
- id: ERR_TESTER_UNAVAILABLE
  http: 422
  condition: UAT session date inside tester unavailability window (closed) or per-day session cap exceeded
- id: ERR_SESSION_FULL
  http: 422
  condition: training seat_weight capacity would be exceeded
- id: ERR_PROCESS_NOT_MAPPED
  http: 422
  condition: configuration decision attached to a process not in {MAPPED, APPROVED}
- id: ERR_DUPLICATE_KEY
  http: 409
  condition: 'Uniqueness violation: solicitation_number, milestone code per contract, decision_key per contract, legacy_primary_key per batch, enrollment (session, staff)'
- id: ERR_INVALID_DATE_RANGE
  http: 422
  condition: end before start or unparsable ISO date
- id: ERR_ACCEPTANCE_CRITERIA_OPEN
  http: 422
  condition: milestone accept with criterion PENDING/FAILED or WAIVED without waiver_reason
- id: ERR_UNRESOLVED_RECORDS
  http: 422
  condition: migration load with flagged record lacking resolution
- id: ERR_CONTRACT_VALUE_EXCEEDED
  http: 422
  condition: billable milestone sum exceeds contract_value_cents
- id: ERR_MILESTONE_REJECTION_LIMIT
  http: 422
  condition: resubmit after 3 rejections
- id: ERR_COVERAGE_GAP
  http: 422
  condition: maintenance coverage_start_on != warranty_end_on + 1 day
- id: ERR_RECONCILE_OUT_OF_TOLERANCE
  http: 422
  condition: reserved for explicit reconcile-report fetch when a variant is out of tolerance (batch transitions to RECONCILE_FAILED)
- id: ERR_CONTRACT_NOT_SETTLED
  http: 422
  condition: close contract with unpaid milestone or non-steady support state
- id: ERR_PHASE_SEQUENCE_GAP
  http: 422
  condition: phase sequence_no not contiguous from 1
- id: ERR_GO_LIVE_EXISTS
  http: 409
  condition: second non-CANCELLED go-live event for the same contract
roles:
- name: PlatformAdmin
  description: System operator; owns agencies, calendar windows, and the logical clock
  identity: opaque
  exclusive_operations:
  - create agency
  - set logical clock
  shared_operations:
  - read any resource
  - add calendar windows
  - list audit log
- name: ProcurementOfficer
  description: Runs the procurement lifecycle from draft to award; cannot run implementation actions
  identity: opaque
  exclusive_operations:
  - contract lifecycle transitions through award
  - protest and resolve-protest
  - cancel contract
  shared_operations:
  - read contracts
  - list audit log
- name: ImplementationManager
  description: Vendor-side implementation lead; owns phases, training, go-live execution
  identity: opaque
  exclusive_operations:
  - start implementation
  - close contract
  - manage phases
  - schedule/mark training
  - go-live lifecycle (propose, readiness, revise, execute, rollback, replan, cancel)
  shared_operations:
  - read contract tree
  - propose configuration decisions
  - enroll training
- name: AgencyProjectManager
  description: Agency-side acceptor; gates milestones, processes, batches, certifications, UAT, go-live approval
  identity: opaque
  exclusive_operations:
  - accept/reject milestones
  - record criterion results
  - approve/rework workflow processes
  - ratify/reject decisions
  - accept migration batches
  - pass/fail certifications
  - manage UAT cycles and sessions
  - approve go-live
  - manage staff and unavailability windows
  shared_operations:
  - read contract tree
  - raise support tickets
  - enroll training
- name: VendorProjectManager
  description: Vendor delivery counterpart; submits milestones and invoices
  identity: opaque
  exclusive_operations:
  - submit/resubmit milestones
  - invoice milestones
  - create milestones on phases
  shared_operations:
  - read contract tree
- name: FinanceOfficer
  description: Pays invoices; owns maintenance agreements
  identity: opaque
  exclusive_operations:
  - mark milestone paid
  - create/activate/renew/suspend/reinstate maintenance agreements
  shared_operations:
  - read contract tree
  - list audit log
- name: BusinessAnalyst
  description: Maps agency workflows and proposes configuration decisions
  identity: opaque
  exclusive_operations:
  - create/map/submit-review/remap workflow processes
  - propose configuration decisions
  shared_operations:
  - read contract tree
- name: DataMigrationLead
  description: Owns extraction, cleansing, load, reconcile of migration batches
  identity: opaque
  exclusive_operations:
  - create batches
  - ingest records
  - extract/cleanse/load/reconcile/recleanse batches
  shared_operations:
  - read contract tree
- name: InterfaceEngineer
  description: Builds and schedules certification of external interfaces
  identity: opaque
  exclusive_operations:
  - create interfaces
  - start development/testing
  - suspend interfaces
  - schedule/begin/retry/cancel certifications
  shared_operations:
  - read contract tree
- name: SupportManager
  description: Runs post-implementation support transition and tickets
  identity: opaque
  exclusive_operations:
  - advance/sunset support transitions
  - resolve tickets
  shared_operations:
  - read contract tree
  - raise support tickets
