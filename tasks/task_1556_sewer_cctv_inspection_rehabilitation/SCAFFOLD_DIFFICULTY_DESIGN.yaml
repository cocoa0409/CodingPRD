            - call: "POST /sewer/work-orders/${w_id}/begin-work"
              payload: {}
              as: CrewLead
              as_user_id: "${tw_id}"
            - call: "GET /sewer/work-orders/${w_id}/line-items"
              payload: {}
              as: DistrictEngineer
              captures: { l_id: "$.data[0].id" }
            - call: "PATCH /sewer/work-orders/${w_id}/line-items/${l_id}"
              payload: { installed_qty: 1 }
              as: CrewLead
              as_user_id: "${tw_id}"
            - call: "POST /sewer/work-orders/${w_id}/submit-punch"
              payload: {}
              as: CrewLead
