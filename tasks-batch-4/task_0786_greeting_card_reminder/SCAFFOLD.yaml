scenario: "786. Greeting-Card & Occasion-Reminder Service (Postable/Punkpost style): contact & important-date reminder, card catalog & personalization/handwriting, send scheduling & recurring (birthday), gift/enclosure add-on, address-book import & mailing, subscription/credit, proof, tracking"
domain_name: "greeting-card-reminder"
api_prefix: ""

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - scheduled_deferred_actions
    - cascading_side_effects
    - dual_variant_calculation
    - optimistic_concurrency
  entity_topology: hybrid
  state_machine_shape: parallel
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - polymorphic
  role_model: peer_roles
  consistency_model: immediate
  notes: |
    An AccountHolder builds an address book (Contact) with recurring occasion reminders
    (ImportantDate). A card send (Order) walks a personalization -> proof -> schedule ->
    production -> mailing -> tracking pipeline (Order.status) evolving as an independent
    dimension alongside a credit-accounting lifecycle (Order.credit_status: NONE -> HELD -> SETTLED/REFUNDED).
    A studio handwriter (HandwritingArtist) is reserved into non-overlapping production
    windows (ArtistAssignment). Card credits are held on submit and settled on production or
    refunded on cancel; a subscription grants credits per cycle (full grant) or prorated on a
    mid-cycle tier change. A logical clock and a scheduler endpoint fire recurring birthdays,
    each auto-creating and auto-submitting an Order.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =====================================================================
# §1.1 Entity-Relationship Table
# =====================================================================
entities:
  - name: Account
    parent: null
    common_fields: true
    fields:
      - name: email
        type: string
        source: input
        description: "Account login email; unique."
      - name: display_name
        type: string
        source: input
        description: "Human-readable account name."
      - name: status
        type: enum
        source: system
        description: "Account lifecycle."
        default: ACTIVE
        constraints: "One of {ACTIVE, SUSPENDED}."
      - name: card_credit_balance
        type: integer
        source: computed
        description: "Sum of all CreditTransaction.delta for this account; never negative. Recomputed on every credit transaction."
        default: 0

  - name: Subscription
    parent: null
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: input
        description: "FK -> Account.id; the owning account. One ACTIVE subscription per account."
      - name: tier
        type: enum
        source: input
        description: "Subscription tier selected."
        constraints: "One of {FREE, PLUS, PRO}."
      - name: monthly_card_credits
        type: integer
        source: computed
        description: "Credits granted each cycle; derived from tier via SUBSCRIPTION_TIERS constant (FREE=0, PLUS=4, PRO=12)."
      - name: monthly_fee_cents
        type: integer
        source: computed
        description: "Monthly fee derived from tier (FREE=0, PLUS=1200, PRO=3000)."
      - name: discount_pct
        type: number
        source: computed
        description: "Gift-line discount fraction derived from tier (FREE=0.0, PLUS=0.10, PRO=0.20)."
      - name: status
        type: enum
        source: system
        description: "Subscription lifecycle."
        default: ACTIVE
        constraints: "One of {ACTIVE, CANCELLED}."
      - name: current_period_start
        type: datetime
        source: system
        description: "Start of the current billing period (logical-clock time at creation/renew), ISO 8601 UTC with three fractional digits."
      - name: current_period_end
        type: datetime
        source: computed
        description: "current_period_start + PERIOD_DAYS (30) days."
      - name: next_renewal_at
        type: datetime
        source: computed
        description: "Equal to current_period_end; the scheduler renews the subscription when logical clock reaches this instant."

  - name: CreditTransaction
    parent: Account
    common_fields: false
    fields:
      - name: account_id
        type: string
        source: input
        description: "FK -> Account.id; append-only ledger row against this account."
      - name: delta
        type: integer
        source: input
        description: "Signed credit change (+grant / -hold, +refund)."
      - name: reason
        type: enum
        source: input
        description: "Why the ledger moved."
        constraints: "One of {SUBSCRIPTION_GRANT, PRORATION_GRANT, ORDER_HOLD, ORDER_REFUND, MANUAL_ADJUST}."
      - name: balance_after
        type: integer
        source: computed
        description: "Account.card_credit_balance immediately after applying this delta."

  - name: Contact
    parent: Account
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: input
        description: "FK -> Account.id; the address-book owner."
      - name: full_name
        type: string
        source: input
        description: "Recipient name."
      - name: address_line1
        type: string
        source: input
        description: "Street address line 1."
      - name: address_line2
        type: string
        source: input
        description: "Street address line 2 (optional)."
        default: null
      - name: city
        type: string
        source: input
        description: "City."
      - name: region
        type: string
        source: input
        description: "State/region code (e.g., CA); drives sales-tax rate on final order total."
      - name: postal_code
        type: string
        source: input
        description: "Postal code."
      - name: country_code
        type: string
        source: input
        description: "ISO country code."
      - name: address_status
        type: enum
        source: system
        description: "Mailing-address verification state."
        default: UNVERIFIED
        constraints: "One of {UNVERIFIED, VERIFIED, UNDELIVERABLE}."

  - name: ImportantDate
    parent: Contact
    common_fields: true
    fields:
      - name: contact_id
        type: string
        source: input
        description: "FK -> Contact.id; the person this occasion belongs to."
      - name: occasion_type
        type: enum
        source: input
        description: "Occasion kind."
        constraints: "One of {BIRTHDAY, ANNIVERSARY, HOLIDAY, CUSTOM}."
      - name: event_date
        type: datetime
        source: input
        description: "The occasion date (ISO 8601 UTC). For ANNUAL recurrence only month/day are significant on roll-forward."
      - name: lead_days
        type: integer
        source: input
        description: "Days before event_date that a send should fire; next_trigger_at = event_date - lead_days."
        constraints: "Integer >= 0."
      - name: recurrence
        type: enum
        source: input
        description: "Recurrence policy."
        default: NONE
        constraints: "One of {NONE, ANNUAL}."
      - name: auto_send
        type: boolean
        source: input
        description: "When true, the scheduler auto-creates and auto-submits an Order for default_card_id at next_trigger_at."
        default: false
      - name: default_card_id
        type: string
        source: input
        description: "FK -> Card.id; card used when the scheduler auto-creates an Order for this occasion. Required when auto_send is true."
        default: null
      - name: status
        type: enum
        source: system
        description: "Reminder lifecycle."
        default: ACTIVE
        constraints: "One of {ACTIVE, ARCHIVED}."
      - name: next_trigger_at
        type: datetime
        source: computed
        description: "event_date - lead_days for the next occurrence, ISO 8601 UTC with three fractional digits; advanced by one year on each ANNUAL firing."

  - name: Card
    parent: null
    common_fields: true
    fields:
      - name: sku
        type: string
        source: input
        description: "Catalog SKU."
      - name: title
        type: string
        source: input
        description: "Card title."
      - name: category
        type: enum
        source: input
        description: "Catalog category."
        constraints: "One of {BIRTHDAY, THANK_YOU, HOLIDAY, SYMPATHY, CUSTOM}."
      - name: base_price_cents
        type: integer
        source: input
        description: "Card price in cents (covered by one card credit at send time)."
        constraints: "Integer >= 0."
      - name: weight_grams
        type: integer
        source: input
        description: "Card weight in grams; contributes to postage tier selection."
        constraints: "Integer >= 0."
      - name: status
        type: enum
        source: system
        description: "Catalog availability."
        default: ACTIVE
        constraints: "One of {ACTIVE, RETIRED}."

  - name: GiftItem
    parent: null
    common_fields: true
    fields:
      - name: sku
        type: string
        source: input
        description: "Gift SKU."
      - name: title
        type: string
        source: input
        description: "Gift title."
      - name: kind
        type: enum
        source: input
        description: "Gift kind."
        constraints: "One of {GIFT_CARD, FLOWERS, CHOCOLATE, CUSTOM_NOTE}."
      - name: price_cents
        type: integer
        source: input
        description: "Per-unit gift price in cents (taxable, eligible for subscription discount)."
        constraints: "Integer >= 0."
      - name: weight_grams
        type: integer
        source: input
        description: "Per-unit gift weight in grams; contributes to postage tier."
        constraints: "Integer >= 0."
      - name: status
        type: enum
        source: system
        description: "Catalog availability."
        default: ACTIVE
        constraints: "One of {ACTIVE, RETIRED}."

  - name: HandwritingArtist
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Artist name."
      - name: region_code
        type: string
        source: input
        description: "Studio region."
      - name: daily_capacity
        type: integer
        source: input
        description: "Max number of RESERVED ArtistAssignments allowed on any single calendar date (date of window_start)."
        constraints: "Integer >= 1."
      - name: status
        type: enum
        source: system
        description: "Artist availability."
        default: AVAILABLE
        constraints: "One of {AVAILABLE, OFF}."
      - name: reserved_assignment_count
        type: integer
        source: computed
        description: "Count of this artist's ArtistAssignments whose status == RESERVED; recomputed on every assignment create/release/complete."
        default: 0

  - name: Order
    parent: null
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: input
        description: "FK -> Account.id; the sender/payer."
      - name: contact_id
        type: string
        source: input
        description: "FK -> Contact.id; the recipient."
      - name: card_id
        type: string
        source: input
        description: "FK -> Card.id; the card being sent (must be ACTIVE at create)."
      - name: gift_item_id
        type: string
        source: input
        description: "FK -> GiftItem.id; optional enclosure/gift add-on."
        default: null
      - name: gift_quantity
        type: integer
        source: input
        description: "Number of gift units; must be >= 1 when gift_item_id is present."
        default: 0
      - name: important_date_id
        type: string
        source: input
        description: "FK -> ImportantDate.id; set only when the scheduler auto-creates this Order from a recurring occasion."
        default: null
      - name: artist_id
        type: string
        source: system
        description: "FK -> HandwritingArtist.id; set when an artist is reserved via assign-artist."
        default: null
      - name: message_text
        type: string
        source: input
        description: "Handwritten message body."
      - name: font_style
        type: enum
        source: input
        description: "Handwriting style."
        default: SCRIPT
        constraints: "One of {SCRIPT, PRINT, CASUAL}."
      - name: scheduled_send_at
        type: datetime
        source: input
        description: "Requested mail-out instant, ISO 8601 UTC."
      - name: status
        type: enum
        source: system
        description: "Fulfillment pipeline dimension (parallel to credit_status)."
        default: DRAFT
        constraints: "One of {DRAFT, PENDING_PROOF, PROOF_APPROVED, SCHEDULED, IN_PRODUCTION, MAILED, DELIVERED, CANCELLED}."
      - name: credit_status
        type: enum
        source: system
        description: "Credit-accounting dimension (parallel to status)."
        default: NONE
        constraints: "One of {NONE, HELD, SETTLED, REFUNDED}."
      - name: estimated_total_cents
        type: integer
        source: computed
        description: "Provisional monetary total computed at create (postage + gift_price, no discount, no tax). See calculations.order_total (variant estimate)."
      - name: postage_cents
        type: integer
        source: computed
        description: "Postage selected from POSTAGE_TIERS by total weight (card + gift units)."
      - name: gift_discount_cents
        type: integer
        source: computed
        description: "Subscription discount applied to the gift line at production; 0 until produced. See calculations.order_tax."
        default: 0
      - name: tax_cents
        type: integer
        source: computed
        description: "Sales tax on the discounted gift line at production; 0 until produced."
        default: 0
      - name: final_total_cents
        type: integer
        source: computed
        description: "Final monetary total computed at production (postage + (gift_price - gift_discount) + tax). Null until produced. See calculations.order_total (variant final)."
        default: null
      - name: mailed_at
        type: datetime
        source: system
        description: "Logical-clock instant the order was mailed."
        default: null
      - name: delivered_at
        type: datetime
        source: system
        description: "Logical-clock instant the shipment was delivered."
        default: null

  - name: Proof
    parent: Order
    common_fields: true
    fields:
      - name: order_id
        type: string
        source: input
        description: "FK -> Order.id; the order being proofed (one live Proof per order)."
      - name: status
        type: enum
        source: system
        description: "Proof review lifecycle."
        default: PENDING
        constraints: "One of {PENDING, CHANGES_REQUESTED, APPROVED, VOIDED}."
      - name: proof_image_ref
        type: string
        source: system
        description: "Reference to the rendered proof image; refreshed on each revise."
      - name: revision_count
        type: integer
        source: computed
        description: "Number of times request-changes has fired on this proof."
        default: 0
      - name: reviewer_notes
        type: string
        source: input
        description: "Notes supplied by the AccountHolder when requesting changes."
        default: null

  - name: ArtistAssignment
    parent: null
    common_fields: true
    fields:
      - name: artist_id
        type: string
        source: input
        description: "FK -> HandwritingArtist.id; the reserved artist."
      - name: order_id
        type: string
        source: input
        description: "FK -> Order.id; the order whose production window this reserves."
      - name: window_start
        type: datetime
        source: input
        description: "Production window start, ISO 8601 UTC (half-open interval start)."
      - name: window_end
        type: datetime
        source: input
        description: "Production window end, ISO 8601 UTC (half-open interval end; window is [window_start, window_end))."
      - name: status
        type: enum
        source: system
        description: "Reservation lifecycle."
        default: RESERVED
        constraints: "One of {RESERVED, COMPLETED, RELEASED}."

  - name: Shipment
    parent: Order
    common_fields: true
    fields:
      - name: order_id
        type: string
        source: input
        description: "FK -> Order.id; the mailed order (one Shipment per order)."
      - name: carrier
        type: enum
        source: input
        description: "Carrier."
        default: USPS
        constraints: "One of {USPS, UPS}."
      - name: tracking_number
        type: string
        source: system
        description: "Server-minted tracking number."
      - name: status
        type: enum
        source: system
        description: "Tracking lifecycle."
        default: LABEL_CREATED
        constraints: "One of {LABEL_CREATED, IN_TRANSIT, DELIVERED, RETURNED}."
      - name: mailed_at
        type: datetime
        source: system
        description: "Logical-clock instant the label was created / mailed."
      - name: delivered_at
        type: datetime
        source: system
        description: "Logical-clock instant delivered."
        default: null

# =====================================================================
# §1.2 State Machine Table
# =====================================================================
state_machines:
  - entity: Order
    dimension: status
    initial_state: DRAFT
    terminal_states: [DELIVERED, CANCELLED]
    transitions:
      - from: DRAFT
        to: PENDING_PROOF
        trigger: "POST /orders/{id}/submit"
        actor: AccountHolder
        preconditions:
          - "Order.status == DRAFT"
          - "Card.status == ACTIVE (business_safety)"
          - "Contact.address_status == VERIFIED (cross-entity: Order depends on Contact)"
          - "scheduled_send_at > current logical clock (business_temporal)"
          - "Account.card_credit_balance >= 1 (business_fiscal)"
          - "expected_account_version matches Account.version (OCC)"
        side_effects:
          - "sets credit_status NONE -> HELD"
          - "creates CreditTransaction {reason: ORDER_HOLD, delta: -1}; recomputes Account.card_credit_balance"
          - "increments Account.version by 1"
          - "creates a Proof {status: PENDING, revision_count: 0} for this order"
      - from: PENDING_PROOF
        to: PROOF_APPROVED
        trigger: "system: cascade from POST /proofs/{id}/approve"
        actor: system
        preconditions:
          - "Order.status == PENDING_PROOF"
          - "the order's Proof.status == APPROVED (cross-entity: Order depends on Proof)"
        side_effects:
          - "none beyond the status change"
      - from: PROOF_APPROVED
        to: SCHEDULED
        trigger: "POST /orders/{id}/schedule"
        actor: StudioOperator
        preconditions:
          - "Order.status == PROOF_APPROVED"
          - "the order's Proof.status == APPROVED"
          - "Contact.address_status == VERIFIED"
          - "scheduled_send_at > current logical clock"
        side_effects:
          - "none beyond the status change"
      - from: SCHEDULED
        to: IN_PRODUCTION
        trigger: "POST /orders/{id}/produce"
        actor: StudioOperator
        preconditions:
          - "Order.status == SCHEDULED"
          - "an ArtistAssignment for this order exists with status == RESERVED (business_referential)"
          - "the order's Proof.status == APPROVED"
          - "current logical clock >= scheduled_send_at (business_temporal)"
        side_effects:
          - "computes postage_cents, gift_discount_cents, tax_cents, final_total_cents (calculations.order_total variant final; calculations.order_tax)"
          - "sets credit_status HELD -> SETTLED"
          - "sets the order's ArtistAssignment RESERVED -> COMPLETED; recomputes HandwritingArtist.reserved_assignment_count"
      - from: IN_PRODUCTION
        to: MAILED
        trigger: "POST /orders/{id}/mail"
        actor: StudioOperator
        preconditions:
          - "Order.status == IN_PRODUCTION"
          - "the order's Proof.status == APPROVED"
        side_effects:
          - "creates Shipment {status: LABEL_CREATED, carrier: <input>}"
          - "sets Order.mailed_at and Shipment.mailed_at to current logical clock"
      - from: MAILED
        to: DELIVERED
        trigger: "system: cascade from POST /shipments/{id}/advance to DELIVERED"
        actor: system
        preconditions:
          - "Order.status == MAILED"
          - "Shipment.status transitioned to DELIVERED"
        side_effects:
          - "sets Order.delivered_at to current logical clock"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /orders/{id}/cancel"
        actor: AccountHolder
        preconditions: ["Order.status == DRAFT"]
        side_effects:
          - "no credit movement (credit_status was NONE)"
      - from: PENDING_PROOF
        to: CANCELLED
        trigger: "POST /orders/{id}/cancel"
        actor: AccountHolder
        preconditions: ["Order.status == PENDING_PROOF"]
        side_effects:
          - "if credit_status == HELD: sets credit_status HELD -> REFUNDED; creates CreditTransaction {reason: ORDER_REFUND, delta: +1}; recomputes Account.card_credit_balance; increments Account.version by 1"
          - "voids the order's Proof if PENDING/CHANGES_REQUESTED (-> VOIDED)"
      - from: PROOF_APPROVED
        to: CANCELLED
        trigger: "POST /orders/{id}/cancel"
        actor: AccountHolder
        preconditions: ["Order.status == PROOF_APPROVED"]
        side_effects:
          - "refunds the held credit (HELD -> REFUNDED; CreditTransaction ORDER_REFUND +1; Account.version += 1)"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /orders/{id}/cancel"
        actor: AccountHolder
        preconditions: ["Order.status == SCHEDULED"]
        side_effects:
          - "refunds the held credit (HELD -> REFUNDED; CreditTransaction ORDER_REFUND +1; Account.version += 1)"
          - "releases the order's ArtistAssignment (RESERVED -> RELEASED); recomputes HandwritingArtist.reserved_assignment_count"
      - from: IN_PRODUCTION
        to: CANCELLED
        trigger: "POST /orders/{id}/cancel"
        actor: AccountHolder
        preconditions: ["Order.status == IN_PRODUCTION"]
        side_effects:
          - "refunds the settled credit (SETTLED -> REFUNDED; CreditTransaction ORDER_REFUND +1; Account.version += 1)"
          - "releases the order's ArtistAssignment if still RESERVED (RESERVED -> RELEASED); recomputes HandwritingArtist.reserved_assignment_count"

  - entity: Order
    dimension: credit_status
    initial_state: NONE
    terminal_states: [REFUNDED]
    transitions:
      - from: NONE
        to: HELD
        trigger: "POST /orders/{id}/submit"
        actor: AccountHolder
        preconditions: ["Account.card_credit_balance >= 1"]
        side_effects: ["CreditTransaction ORDER_HOLD delta -1"]
      - from: HELD
        to: SETTLED
        trigger: "POST /orders/{id}/produce"
        actor: StudioOperator
        preconditions: ["Order.status == SCHEDULED"]
        side_effects: ["final_total_cents computed and frozen"]
      - from: HELD
        to: REFUNDED
        trigger: "POST /orders/{id}/cancel (from PENDING_PROOF/PROOF_APPROVED/SCHEDULED)"
        actor: AccountHolder
        preconditions: ["credit_status == HELD"]
        side_effects: ["CreditTransaction ORDER_REFUND delta +1; Account.version += 1"]
      - from: SETTLED
        to: REFUNDED
        trigger: "POST /orders/{id}/cancel (from IN_PRODUCTION)"
        actor: AccountHolder
        preconditions: ["credit_status == SETTLED"]
        side_effects: ["CreditTransaction ORDER_REFUND delta +1; Account.version += 1"]

  - entity: Proof
    dimension: status
    initial_state: PENDING
    terminal_states: [APPROVED, VOIDED]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /proofs/{id}/approve"
        actor: AccountHolder
        preconditions: ["Proof.status == PENDING"]
        side_effects: ["cascades: Order PENDING_PROOF -> PROOF_APPROVED"]
      - from: PENDING
        to: CHANGES_REQUESTED
        trigger: "POST /proofs/{id}/request-changes"
        actor: AccountHolder
        preconditions: ["Proof.status == PENDING"]
        side_effects: ["increments revision_count by 1", "stores reviewer_notes"]
      - from: CHANGES_REQUESTED
        to: PENDING
        trigger: "POST /proofs/{id}/revise"
        actor: StudioOperator
        preconditions: ["Proof.status == CHANGES_REQUESTED"]
        side_effects: ["refreshes proof_image_ref"]
        note: "Cyclic: PENDING -> CHANGES_REQUESTED -> PENDING may repeat any number of rounds before APPROVED."
      - from: PENDING
        to: VOIDED
        trigger: "system: cascade from POST /orders/{id}/cancel"
        actor: system
        preconditions: ["owning Order transitions to CANCELLED"]
        side_effects: []
      - from: CHANGES_REQUESTED
        to: VOIDED
        trigger: "system: cascade from POST /orders/{id}/cancel"
        actor: system
        preconditions: ["owning Order transitions to CANCELLED"]
        side_effects: []

  - entity: Contact
    dimension: address_status
    initial_state: UNVERIFIED
    terminal_states: []
    transitions:
      - from: UNVERIFIED
        to: VERIFIED
        trigger: "POST /contacts/{id}/verify-address (result=VERIFIED)"
        actor: StudioOperator
        preconditions: ["Contact.address_status == UNVERIFIED"]
        side_effects: []
      - from: UNVERIFIED
        to: UNDELIVERABLE
        trigger: "POST /contacts/{id}/verify-address (result=UNDELIVERABLE)"
        actor: StudioOperator
        preconditions: ["Contact.address_status == UNVERIFIED"]
        side_effects: []
      - from: VERIFIED
        to: UNDELIVERABLE
        trigger: "POST /contacts/{id}/verify-address (result=UNDELIVERABLE)"
        actor: StudioOperator
        preconditions: ["Contact.address_status == VERIFIED"]
        side_effects: []

  - entity: ImportantDate
    dimension: status
    initial_state: ACTIVE
    terminal_states: [ARCHIVED]
    transitions:
      - from: ACTIVE
        to: ACTIVE
        trigger: "system: cascade from POST /_scheduler/run when next_trigger_at <= clock and recurrence == ANNUAL"
        actor: system
        preconditions:
          - "ImportantDate.status == ACTIVE"
          - "auto_send == true"
          - "next_trigger_at <= current logical clock"
        side_effects:
          - "auto-creates an Order (card_id = default_card_id, scheduled_send_at = event_date) and auto-submits it (holds one credit)"
          - "advances next_trigger_at by one year (event_date + 1y - lead_days)"
        note: "Self-loop firing; the transitive cascade into Order/CreditTransaction/Account is spelled out in calculations and §1.8 transitive_cascade."
      - from: ACTIVE
        to: ARCHIVED
        trigger: "POST /important-dates/{id}/archive"
        actor: AccountHolder
        preconditions: ["ImportantDate.status == ACTIVE"]
        side_effects: ["reminder no longer fires in the scheduler"]

  - entity: Subscription
    dimension: status
    initial_state: ACTIVE
    terminal_states: [CANCELLED]
    transitions:
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /subscriptions/{id}/change-tier"
        actor: AccountHolder
        preconditions: ["Subscription.status == ACTIVE"]
        side_effects:
          - "grants prorated credits (calculations.renewal_credit_grant variant mid_cycle_upgrade): CreditTransaction PRORATION_GRANT; Account.version += 1"
      - from: ACTIVE
        to: ACTIVE
        trigger: "system: cascade from POST /_scheduler/run when next_renewal_at <= clock"
        actor: system
        preconditions: ["Subscription.status == ACTIVE", "next_renewal_at <= clock"]
        side_effects:
          - "grants full monthly_card_credits (calculations.renewal_credit_grant variant new_or_renew): CreditTransaction SUBSCRIPTION_GRANT; Account.version += 1"
          - "advances current_period_start/current_period_end/next_renewal_at by PERIOD_DAYS"
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /subscriptions/{id}/cancel"
        actor: AccountHolder
        preconditions: ["Subscription.status == ACTIVE"]
        side_effects: ["no credit clawback; existing balance retained"]

  - entity: ArtistAssignment
    dimension: status
    initial_state: RESERVED
    terminal_states: [COMPLETED, RELEASED]
    transitions:
      - from: RESERVED
        to: COMPLETED
        trigger: "system: cascade from POST /orders/{id}/produce"
        actor: system
        preconditions: ["ArtistAssignment.status == RESERVED"]
        side_effects: ["recomputes HandwritingArtist.reserved_assignment_count"]
      - from: RESERVED
        to: RELEASED
        trigger: "system: cascade from POST /orders/{id}/cancel"
        actor: system
        preconditions: ["ArtistAssignment.status == RESERVED"]
        side_effects: ["recomputes HandwritingArtist.reserved_assignment_count"]

  - entity: Shipment
    dimension: status
    initial_state: LABEL_CREATED
    terminal_states: [DELIVERED, RETURNED]
    transitions:
      - from: LABEL_CREATED
        to: IN_TRANSIT
        trigger: "POST /shipments/{id}/advance (to_status=IN_TRANSIT)"
        actor: StudioOperator
        preconditions: ["Shipment.status == LABEL_CREATED"]
        side_effects: []
      - from: IN_TRANSIT
        to: DELIVERED
        trigger: "POST /shipments/{id}/advance (to_status=DELIVERED)"
        actor: StudioOperator
        preconditions: ["Shipment.status == IN_TRANSIT"]
        side_effects: ["cascades: Order MAILED -> DELIVERED; sets Order.delivered_at, Shipment.delivered_at"]
      - from: IN_TRANSIT
        to: RETURNED
        trigger: "POST /shipments/{id}/advance (to_status=RETURNED)"
        actor: StudioOperator
        preconditions: ["Shipment.status == IN_TRANSIT"]
        side_effects: []

# =====================================================================
# §1.2.1 Concurrency Rules
# =====================================================================
concurrency_rules:
  - rule_id: order-submit-stale-account
    parent_entity: Account
    write_endpoint: "POST /orders/{id}/submit"
    occ_field: "expected_account_version"
    description: |
      Submitting an Order (which holds one card credit against the Account) requires the
      caller to pass the Account.version they last observed. If the Account.version has
      advanced since then — because another Order submit already held a credit, or a
      credit adjustment / subscription grant posted — the caller's view of the credit
      balance is stale and the submit is rejected. Both submits would each legitimately
      succeed in isolation (the account holds enough credits for either alone), so this is
      a true CREATE-time race resolved by OCC on the parent's version rather than by any
      state precondition.
    error_id: ERR_STALE_ACCOUNT_VERSION
    http_status: 412

# =====================================================================
# §1.3 Calculation Rules Table
# =====================================================================
calculations:
  - name: order_total
    trigger: "estimate at POST /orders; final at POST /orders/{id}/produce"
    algorithm: tiered_pricing
    formula: |
      # weight-based postage tier
      total_weight = Card.weight_grams + (gift_item_id ? GiftItem.weight_grams * gift_quantity : 0)
      postage_cents = POSTAGE_TIERS.first(t : total_weight <= t.max_grams).cents   # last tier max_grams = +inf
      gift_price = gift_item_id ? GiftItem.price_cents * gift_quantity : 0

      # variant estimate (at create): no discount, no tax
      estimated_total_cents = postage_cents + gift_price

      # variant final (at produce): apply subscription discount to gift line, then tax (see order_tax)
      gift_discount_cents = order_tax.gift_discount_cents
      tax_cents           = order_tax.tax_cents
      final_total_cents   = postage_cents + (gift_price - gift_discount_cents) + tax_cents
    input_set: "Single Order plus its Card, optional GiftItem, and the Account's ACTIVE Subscription (for discount)."
    constants:
      POSTAGE_TIERS:
        - { max_grams: 30, cents: 150 }
        - { max_grams: 60, cents: 250 }
        - { max_grams: 120, cents: 450 }
        - { max_grams: 2147483647, cents: 800 }
    precision: "Integer cents; no fractional cents produced by this rule (tax rounding lives in order_tax)."
    variants:
      - name: estimate
        when: "at POST /orders (Order.status becomes DRAFT)"
        difference: "postage + gift_price only; gift_discount_cents = 0, tax_cents = 0, final_total_cents null."
      - name: final
        when: "at POST /orders/{id}/produce (Order.status SCHEDULED -> IN_PRODUCTION)"
        difference: "adds gift-line subscription discount and sales tax; sets final_total_cents. Uses the postage tier recomputed from the same weights (identical to estimate's postage in the common case)."

  - name: order_tax
    trigger: "at POST /orders/{id}/produce"
    algorithm: weighted_scoring
    formula: |
      gift_price = GiftItem.price_cents * gift_quantity           # summed line, NOT per-unit
      pct        = (Subscription.status == ACTIVE) ? Subscription.discount_pct : 0.0
      # ROUNDING ORDER IS PINNED: compute the discount on the SUMMED gift line, round ONCE.
      gift_discount_cents = round_half_up(gift_price * pct)       # sum-then-round (NOT round-per-unit-then-sum)
      taxable             = gift_price - gift_discount_cents      # postage and the credit-covered card are NOT taxed
      rate                = REGION_TAX_RATES.get(Contact.region, REGION_TAX_RATES.DEFAULT)
      # tax computed on the summed discounted line, round ONCE.
      tax_cents           = round_half_up(taxable * rate)
    input_set: "The Order's GiftItem line and the Account's ACTIVE Subscription discount_pct; Contact.region drives the tax rate."
    constants:
      REGION_TAX_RATES: { CA: 0.0725, NY: 0.08875, TX: 0.0625, WA: 0.065, DEFAULT: 0.0 }
    precision: "round_half_up to whole cents; discount rounded once on the summed line, then tax rounded once on the summed discounted line. round-per-unit-then-sum is explicitly forbidden and yields different cents."

  - name: renewal_credit_grant
    trigger: "new subscription at POST /accounts/{id}/subscriptions; renewal via scheduler; tier change at POST /subscriptions/{id}/change-tier"
    algorithm: threshold
    formula: |
      # variant new_or_renew (initial creation & period-boundary renewal)
      grant = SUBSCRIPTION_TIERS[tier].monthly_card_credits            # full grant

      # variant mid_cycle_upgrade (change-tier before period end)
      days_remaining = ceil_days(current_period_end - current_logical_clock)   # whole days, >= 0
      grant = ceil( SUBSCRIPTION_TIERS[new_tier].monthly_card_credits * days_remaining / PERIOD_DAYS )
    input_set: "One Subscription and its tier; for the upgrade variant, current_period_end and the logical clock."
    constants:
      PERIOD_DAYS: 30
      SUBSCRIPTION_TIERS:
        FREE: { monthly_card_credits: 0, monthly_fee_cents: 0, discount_pct: 0.0 }
        PLUS: { monthly_card_credits: 4, monthly_fee_cents: 1200, discount_pct: 0.10 }
        PRO:  { monthly_card_credits: 12, monthly_fee_cents: 3000, discount_pct: 0.20 }
    precision: "Integer credits; days_remaining is whole days (ceil), proration uses ceil()."
    variants:
      - name: new_or_renew
        when: "initial subscription creation and scheduler period-boundary renewal"
        difference: "grants the full monthly_card_credits for the tier."
      - name: mid_cycle_upgrade
        when: "POST /subscriptions/{id}/change-tier before current_period_end"
        difference: "grants ceil(new_tier_credits * days_remaining / PERIOD_DAYS) — strictly fewer than the full grant whenever days_remaining < PERIOD_DAYS."

  - name: account_credit_balance
    trigger: "recomputed on every CreditTransaction insert"
    algorithm: aggregation
    formula: |
      Account.card_credit_balance = sum(CreditTransaction.delta
                                        for ct in CreditTransactions
                                        where ct.account_id == Account.id)
    input_set: "All CreditTransaction rows for the account (no status filter; append-only ledger), ordered by created_at ASC for balance_after stamping."
    constants: {}
    precision: "Integer credits; balance is a conserved quantity — a forward ORDER_HOLD (-1) paired with its ORDER_REFUND (+1) leaves the sum unchanged."

  - name: important_date_next_trigger
    trigger: "at POST /contacts/{id}/important-dates and on each scheduler firing"
    algorithm: decay_function
    formula: |
      next_trigger_at = event_date - (lead_days days)
      # on ANNUAL firing: event_date advances by 1 year; next_trigger_at = (event_date + 1y) - lead_days
    input_set: "One ImportantDate."
    constants: {}
    precision: "Datetime, ISO 8601 UTC with three fractional digits."

# =====================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =====================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and well-formed"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "the acting role is permitted for this operation per §1.7; for entity_backed AccountHolder acting on account-owned resources, X-User-ID must equal the resource's account_id"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all
  - priority: 3
    category: existence
    check: "every path-referenced resource exists, validated left-to-right"
    error_id: "ERR_<RESOURCE>_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path ids or FK body fields"
  - priority: 4
    category: state
    check: "target resource is in a state from which this transition is legal"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints (submit, approve, request-changes, revise, schedule, produce, mail, cancel, shipment advance, subscription cancel/change-tier)"
  - priority: 5
    category: business_safety
    check: "referenced Card.status == ACTIVE (not RETIRED)"
    error_id: ERR_CARD_RETIRED
    http_status: 409
    applies_to: "POST /orders, POST /orders/{id}/submit"
  - priority: 6
    category: business_safety
    check: "referenced GiftItem.status == ACTIVE when gift_item_id present"
    error_id: ERR_GIFT_ITEM_RETIRED
    http_status: 409
    applies_to: "POST /orders"
  - priority: 7
    category: business_referential
    check: "Contact.address_status == VERIFIED"
    error_id: ERR_ADDRESS_NOT_VERIFIED
    http_status: 409
    applies_to: "POST /orders/{id}/submit, POST /orders/{id}/schedule"
  - priority: 8
    category: business_referential
    check: "the order's Proof.status == APPROVED"
    error_id: ERR_PROOF_NOT_APPROVED
    http_status: 409
    applies_to: "POST /orders/{id}/produce, POST /orders/{id}/mail"
  - priority: 9
    category: business_referential
    check: "an ArtistAssignment with status == RESERVED exists for this order"
    error_id: ERR_ARTIST_NOT_ASSIGNED
    http_status: 409
    applies_to: "POST /orders/{id}/produce"
  - priority: 10
    category: business_temporal
    check: "scheduled_send_at > current logical clock"
    error_id: ERR_SEND_DATE_IN_PAST
    http_status: 422
    applies_to: "POST /orders/{id}/submit, POST /orders/{id}/schedule"
  - priority: 11
    category: business_temporal
    check: "current logical clock >= scheduled_send_at"
    error_id: ERR_TOO_EARLY_TO_PRODUCE
    http_status: 409
    applies_to: "POST /orders/{id}/produce"
  - priority: 12
    category: business_temporal
    check: "the requested [window_start, window_end) does not overlap any existing RESERVED assignment for the same artist (half-open: touching endpoints do NOT conflict)"
    error_id: ERR_ARTIST_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /orders/{id}/assign-artist"
  - priority: 13
    category: business_temporal
    check: "the new occasion's reminder window [event_date - lead_days, event_date] is at least REMINDER_BUFFER_DAYS (2) away from every existing ACTIVE ImportantDate of the same occasion_type on the same contact (closed intervals; touching or within-buffer conflict)"
    error_id: ERR_REMINDER_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /contacts/{id}/important-dates"
  - priority: 14
    category: business_constraint
    check: "adding this RESERVED assignment keeps the artist's count of RESERVED assignments on window_start's calendar date <= daily_capacity"
    error_id: ERR_ARTIST_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "POST /orders/{id}/assign-artist"
  - priority: 15
    category: business_constraint
    check: "gift_quantity >= 1 when gift_item_id is present"
    error_id: ERR_GIFT_QUANTITY_INVALID
    http_status: 422
    applies_to: "POST /orders"
  - priority: 16
    category: business_constraint
    check: "import rows array is non-empty"
    error_id: ERR_EMPTY_IMPORT
    http_status: 422
    applies_to: "POST /accounts/{id}/contacts/bulk-import"
  - priority: 17
    category: business_constraint
    check: "auto_send requires a non-null default_card_id"
    error_id: ERR_AUTO_SEND_CARD_REQUIRED
    http_status: 422
    applies_to: "POST /contacts/{id}/important-dates"
  - priority: 18
    category: business_fiscal
    check: "Account.card_credit_balance >= 1"
    error_id: ERR_INSUFFICIENT_CREDITS
    http_status: 402
    applies_to: "POST /orders/{id}/submit"
  - priority: 19
    category: business_fiscal
    check: "expected_account_version == Account.version (OCC)"
    error_id: ERR_STALE_ACCOUNT_VERSION
    http_status: 412
    applies_to: "POST /orders/{id}/submit"

# =====================================================================
# §1.5 API Endpoint Table
# =====================================================================
endpoints:
  - method: POST
    path: "/accounts"
    description: "Create an account (balance starts at 0)."
    roles: [PlatformAdmin]
    code: 201
    input: [email, display_name]
    output: Account
    side_effects: ["Account.status = ACTIVE", "card_credit_balance = 0", "version = 1"]

  - method: GET
    path: "/accounts/{id}"
    description: "Fetch one account (with computed card_credit_balance and version)."
    roles: [PlatformAdmin, AccountHolder]
    code: 200
    input: []
    output: Account

  - method: POST
    path: "/accounts/{id}/subscriptions"
    description: "Create the account's subscription; grants the full monthly credits for the tier (renewal_credit_grant variant new_or_renew)."
    roles: [PlatformAdmin, AccountHolder]
    code: 201
    input: [tier]
    output: Subscription
    side_effects:
      - "creates Subscription {status: ACTIVE}; sets current_period_start=clock, current_period_end=clock+30d, next_renewal_at=current_period_end"
      - "creates CreditTransaction {reason: SUBSCRIPTION_GRANT, delta: +monthly_card_credits}; recomputes Account.card_credit_balance"
      - "increments Account.version by 1"

  - method: GET
    path: "/accounts/{id}/subscription"
    description: "Reverse-reachability: the account's subscription(s) (array length 0 or 1)."
    roles: [PlatformAdmin, AccountHolder]
    code: 200
    input: []
    output: Subscription[]

  - method: POST
    path: "/subscriptions/{id}/change-tier"
    description: "Change subscription tier mid-cycle; grants prorated credits (renewal_credit_grant variant mid_cycle_upgrade)."
    roles: [PlatformAdmin, AccountHolder]
    code: 200
    input: [tier]
    output: Subscription
    side_effects:
      - "creates CreditTransaction {reason: PRORATION_GRANT, delta: +ceil(new_tier_credits * days_remaining / 30)}"
      - "recomputes Account.card_credit_balance; increments Account.version by 1"

  - method: POST
    path: "/subscriptions/{id}/cancel"
    description: "Cancel a subscription (no credit clawback)."
    roles: [PlatformAdmin, AccountHolder]
    code: 200
    input: []
    output: Subscription
    side_effects: ["Subscription.status = CANCELLED"]

  - method: POST
    path: "/accounts/{id}/credit-adjustments"
    description: "Admin credit adjustment (grant or debit)."
    roles: [PlatformAdmin]
    code: 201
    input: [delta, reason]
    output: CreditTransaction
    side_effects:
      - "creates CreditTransaction {reason: MANUAL_ADJUST or given, delta}; recomputes Account.card_credit_balance"
      - "increments Account.version by 1"

  - method: GET
    path: "/accounts/{id}/credit-transactions"
    description: "Reverse-reachability: the account's credit ledger (newest first)."
    roles: [PlatformAdmin, AccountHolder]
    code: 200
    input: ["limit?", "offset?"]
    output: CreditTransaction[]

  - method: POST
    path: "/contacts"
    description: "Create a contact (address UNVERIFIED)."
    roles: [AccountHolder, PlatformAdmin]
    code: 201
    input: [account_id, full_name, address_line1, "address_line2?", city, region, postal_code, country_code]
    output: Contact
    side_effects: ["address_status = UNVERIFIED"]

  - method: GET
    path: "/accounts/{id}/contacts"
    description: "Reverse-reachability: the account's contacts."
    roles: [AccountHolder, PlatformAdmin]
    code: 200
    input: ["address_status?", "limit?", "offset?"]
    output: Contact[]

  - method: GET
    path: "/contacts/{id}"
    description: "Fetch one contact."
    roles: [AccountHolder, StudioOperator, PlatformAdmin]
    code: 200
    input: []
    output: Contact

  - method: POST
    path: "/accounts/{id}/contacts/bulk-import"
    description: "Bulk address-book import; creates one UNVERIFIED Contact per row. Empty rows -> ERR_EMPTY_IMPORT."
    roles: [AccountHolder, PlatformAdmin]
    code: 201
    input: [source, rows]
    output: "{ imported_count: integer, skipped_count: integer, contact_ids: array }"
    side_effects: ["creates Contact rows (UNVERIFIED); rows missing required address fields are skipped and counted in skipped_count"]

  - method: POST
    path: "/contacts/{id}/verify-address"
    description: "Mark a contact address VERIFIED or UNDELIVERABLE."
    roles: [StudioOperator, PlatformAdmin]
    code: 200
    input: [result]
    output: Contact
    side_effects: ["address_status transition per result"]

  - method: POST
    path: "/contacts/{id}/important-dates"
    description: "Create a recurring/occasion reminder for a contact; computes next_trigger_at and enforces reminder-window spacing."
    roles: [AccountHolder, PlatformAdmin]
    code: 201
    input: [occasion_type, event_date, lead_days, "recurrence?", "auto_send?", "default_card_id?"]
    output: ImportantDate
    side_effects: ["computes next_trigger_at = event_date - lead_days", "reminder-window overlap check (priority 13)"]

  - method: GET
    path: "/important-dates/{id}"
    description: "Fetch one important date."
    roles: [AccountHolder, PlatformAdmin]
    code: 200
    input: []
    output: ImportantDate

  - method: GET
    path: "/important-dates"
    description: "Reverse-reachability: filter important dates by contact and/or default card."
    roles: [AccountHolder, PlatformAdmin]
    code: 200
    input: ["contact_id?", "default_card_id?", "status?", "limit?", "offset?"]
    output: ImportantDate[]

  - method: POST
    path: "/important-dates/{id}/archive"
    description: "Archive a reminder so it stops firing."
    roles: [AccountHolder, PlatformAdmin]
    code: 200
    input: []
    output: ImportantDate
    side_effects: ["ImportantDate.status ACTIVE -> ARCHIVED"]

  - method: POST
    path: "/cards"
    description: "Create a catalog card."
    roles: [PlatformAdmin, StudioOperator]
    code: 201
    input: [sku, title, category, base_price_cents, weight_grams]
    output: Card
    side_effects: ["status = ACTIVE"]

  - method: GET
    path: "/cards/{id}"
    description: "Fetch one catalog card."
    roles: [AccountHolder, StudioOperator, PlatformAdmin]
    code: 200
    input: []
    output: Card

  - method: POST
    path: "/cards/{id}/retire"
    description: "Retire a catalog card (RETIRED cards may not be ordered)."
    roles: [PlatformAdmin, StudioOperator]
    code: 200
    input: []
    output: Card
    side_effects: ["Card.status ACTIVE -> RETIRED"]

  - method: POST
    path: "/gift-items"
    description: "Create a catalog gift/enclosure item."
    roles: [PlatformAdmin, StudioOperator]
    code: 201
    input: [sku, title, kind, price_cents, weight_grams]
    output: GiftItem
    side_effects: ["status = ACTIVE"]

  - method: POST
    path: "/gift-items/{id}/retire"
    description: "Retire a gift item (RETIRED gifts may not be added to orders)."
    roles: [PlatformAdmin, StudioOperator]
    code: 200
    input: []
    output: GiftItem
    side_effects: ["GiftItem.status ACTIVE -> RETIRED"]

  - method: POST
    path: "/artists"
    description: "Create a handwriting artist."
    roles: [PlatformAdmin, StudioOperator]
    code: 201
    input: [name, daily_capacity, region_code]
    output: HandwritingArtist
    side_effects: ["status = AVAILABLE", "reserved_assignment_count = 0"]

  - method: GET
    path: "/artists/{id}"
    description: "Fetch one artist (with computed reserved_assignment_count)."
    roles: [StudioOperator, PlatformAdmin]
    code: 200
    input: []
    output: HandwritingArtist

  - method: POST
    path: "/orders"
    description: "Create a DRAFT card send; computes estimated_total_cents (order_total variant estimate)."
    roles: [AccountHolder, PlatformAdmin]
    code: 201
    input: [account_id, contact_id, card_id, message_text, scheduled_send_at, "font_style?", "gift_item_id?", "gift_quantity?", "important_date_id?"]
    output: Order
    side_effects: ["status = DRAFT", "credit_status = NONE", "computes estimated_total_cents, postage_cents", "validates Card ACTIVE, GiftItem ACTIVE, gift_quantity >= 1 when gift present"]

  - method: GET
    path: "/orders/{id}"
    description: "Fetch one order."
    roles: [AccountHolder, StudioOperator, PlatformAdmin]
    code: 200
    input: []
    output: Order

  - method: GET
    path: "/orders"
    description: "Reverse-reachability + listing: filter orders by any FK or status."
    roles: [AccountHolder, StudioOperator, PlatformAdmin]
    code: 200
    input: ["account_id?", "contact_id?", "card_id?", "gift_item_id?", "artist_id?", "important_date_id?", "status?", "limit?", "offset?"]
    output: Order[]

  - method: POST
    path: "/orders/{id}/submit"
    description: "Submit a DRAFT order: holds one credit (OCC on Account.version), creates the Proof."
    roles: [AccountHolder]
    code: 200
    input: [expected_account_version]
    output: Order
    side_effects:
      - "OCC: rejects when expected_account_version != Account.version (ERR_STALE_ACCOUNT_VERSION 412)"
      - "status DRAFT -> PENDING_PROOF; credit_status NONE -> HELD"
      - "creates CreditTransaction {reason: ORDER_HOLD, delta: -1}; recomputes Account.card_credit_balance"
      - "increments Account.version by 1"
      - "creates Proof {status: PENDING}"

  - method: POST
    path: "/orders/{id}/assign-artist"
    description: "Reserve a handwriting artist into a production window (half-open overlap + daily-capacity checks)."
    roles: [StudioOperator]
    code: 201
    input: [artist_id, window_start, window_end]
    output: ArtistAssignment
    side_effects: ["creates ArtistAssignment {status: RESERVED}", "sets Order.artist_id", "recomputes HandwritingArtist.reserved_assignment_count"]

  - method: GET
    path: "/artist-assignments/{id}"
    description: "Fetch one artist assignment."
    roles: [StudioOperator, PlatformAdmin]
    code: 200
    input: []
    output: ArtistAssignment

  - method: GET
    path: "/artist-assignments"
    description: "Reverse-reachability: filter assignments by artist and/or order."
    roles: [StudioOperator, PlatformAdmin]
    code: 200
    input: ["artist_id?", "order_id?", "status?", "limit?", "offset?"]
    output: ArtistAssignment[]

  - method: GET
    path: "/orders/{id}/proofs"
    description: "Reverse-reachability: proofs for an order (array length 0 or 1 live)."
    roles: [AccountHolder, StudioOperator]
    code: 200
    input: []
    output: Proof[]

  - method: POST
    path: "/proofs/{id}/approve"
    description: "Approve a proof; cascades the order to PROOF_APPROVED."
    roles: [AccountHolder]
    code: 200
    input: []
    output: Proof
    side_effects: ["Proof PENDING -> APPROVED", "cascades: Order PENDING_PROOF -> PROOF_APPROVED"]

  - method: POST
    path: "/proofs/{id}/request-changes"
    description: "Request changes on a proof (revision loop)."
    roles: [AccountHolder]
    code: 200
    input: [reviewer_notes]
    output: Proof
    side_effects: ["Proof PENDING -> CHANGES_REQUESTED", "increments revision_count by 1"]

  - method: POST
    path: "/proofs/{id}/revise"
    description: "Studio uploads a revised proof, returning it to PENDING."
    roles: [StudioOperator]
    code: 200
    input: [proof_image_ref]
    output: Proof
    side_effects: ["Proof CHANGES_REQUESTED -> PENDING", "refreshes proof_image_ref"]

  - method: POST
    path: "/orders/{id}/schedule"
    description: "Confirm the send schedule for a proof-approved order."
    roles: [StudioOperator, AccountHolder]
    code: 200
    input: []
    output: Order
    side_effects: ["Order PROOF_APPROVED -> SCHEDULED"]

  - method: POST
    path: "/orders/{id}/produce"
    description: "Start production: computes final_total_cents, settles the credit, completes the artist assignment."
    roles: [StudioOperator]
    code: 200
    input: []
    output: Order
    side_effects:
      - "Order SCHEDULED -> IN_PRODUCTION"
      - "computes postage_cents, gift_discount_cents, tax_cents, final_total_cents (order_total variant final; order_tax)"
      - "credit_status HELD -> SETTLED"
      - "ArtistAssignment RESERVED -> COMPLETED; recomputes HandwritingArtist.reserved_assignment_count"

  - method: POST
    path: "/orders/{id}/mail"
    description: "Mail the produced order; creates the Shipment."
    roles: [StudioOperator]
    code: 200
    input: ["carrier?"]
    output: Order
    side_effects: ["Order IN_PRODUCTION -> MAILED", "creates Shipment {status: LABEL_CREATED}", "sets Order.mailed_at, Shipment.mailed_at = clock"]

  - method: GET
    path: "/orders/{id}/shipment"
    description: "Reverse-reachability: the order's shipment (array length 0 or 1)."
    roles: [AccountHolder, StudioOperator]
    code: 200
    input: []
    output: Shipment[]

  - method: POST
    path: "/shipments/{id}/advance"
    description: "Advance tracking; DELIVERED cascades the order to DELIVERED."
    roles: [StudioOperator]
    code: 200
    input: [to_status]
    output: Shipment
    side_effects: ["Shipment transition", "on DELIVERED: cascades Order MAILED -> DELIVERED; sets delivered_at"]

  - method: POST
    path: "/orders/{id}/cancel"
    description: "Cancel an order; refunds any held/settled credit, releases the artist, voids the pending proof."
    roles: [AccountHolder, StudioOperator]
    code: 200
    input: []
    output: Order
    side_effects:
      - "Order.status -> CANCELLED"
      - "if credit_status in {HELD, SETTLED}: credit_status -> REFUNDED; CreditTransaction {reason: ORDER_REFUND, delta: +1}; recompute Account.card_credit_balance; Account.version += 1"
      - "if ArtistAssignment RESERVED: -> RELEASED; recompute HandwritingArtist.reserved_assignment_count"
      - "if Proof PENDING/CHANGES_REQUESTED: -> VOIDED"

  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving logical clock. Startup default is 2026-03-01T00:00:00Z; before any set call the clock reads exactly this default and never falls back to wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: datetime }"
    side_effects: ["sets the logical clock used by all temporal checks, next_trigger_at, period boundaries, mailed_at/delivered_at"]

  - method: POST
    path: "/_scheduler/run"
    description: "Test-driving scheduler tick. Fires due recurring ImportantDates (auto-creates + auto-submits Orders) and renews due subscriptions."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: "{ fired_important_date_ids: array, created_order_ids: array, renewed_subscription_ids: array }"
    side_effects:
      - "for each ACTIVE ImportantDate with auto_send and next_trigger_at <= clock and a VERIFIED contact and >=1 account credit: auto-creates an Order and auto-submits it (holds one credit); advances next_trigger_at by 1 year"
      - "for each ACTIVE Subscription with next_renewal_at <= clock: grants full monthly_card_credits and advances the period"

# =====================================================================
# §1.6 Error Code Catalog
# =====================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing/invalid X-User-Role or X-User-ID."
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "Role not permitted, or entity_backed AccountHolder acting on a resource it does not own."
  - id: ERR_VALIDATION
    http: 400
    condition: "Malformed body, missing required field, or invalid enum/type."
  - id: ERR_ACCOUNT_NOT_FOUND
    http: 404
    condition: "account_id path/body id does not resolve."
  - id: ERR_SUBSCRIPTION_NOT_FOUND
    http: 404
    condition: "subscription id does not resolve."
  - id: ERR_CONTACT_NOT_FOUND
    http: 404
    condition: "contact_id does not resolve."
  - id: ERR_IMPORTANT_DATE_NOT_FOUND
    http: 404
    condition: "important date id does not resolve."
  - id: ERR_CARD_NOT_FOUND
    http: 404
    condition: "card_id does not resolve."
  - id: ERR_GIFT_ITEM_NOT_FOUND
    http: 404
    condition: "gift_item_id does not resolve."
  - id: ERR_ARTIST_NOT_FOUND
    http: 404
    condition: "artist_id does not resolve."
  - id: ERR_ORDER_NOT_FOUND
    http: 404
    condition: "order id does not resolve."
  - id: ERR_PROOF_NOT_FOUND
    http: 404
    condition: "proof id does not resolve."
  - id: ERR_SHIPMENT_NOT_FOUND
    http: 404
    condition: "shipment id does not resolve."
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Transition attempted from a state that does not permit it (wins over all business checks)."
  - id: ERR_CARD_RETIRED
    http: 409
    condition: "Ordering/submitting with a RETIRED card."
  - id: ERR_GIFT_ITEM_RETIRED
    http: 409
    condition: "Ordering with a RETIRED gift item."
  - id: ERR_ADDRESS_NOT_VERIFIED
    http: 409
    condition: "Submit/schedule while Contact.address_status != VERIFIED."
  - id: ERR_PROOF_NOT_APPROVED
    http: 409
    condition: "Produce/mail before the order's Proof is APPROVED."
  - id: ERR_ARTIST_NOT_ASSIGNED
    http: 409
    condition: "Produce with no RESERVED ArtistAssignment for the order."
  - id: ERR_SEND_DATE_IN_PAST
    http: 422
    condition: "scheduled_send_at <= current logical clock at submit/schedule."
  - id: ERR_TOO_EARLY_TO_PRODUCE
    http: 409
    condition: "Produce before current logical clock reaches scheduled_send_at."
  - id: ERR_ARTIST_WINDOW_CONFLICT
    http: 409
    condition: "Requested production window overlaps an existing RESERVED window for the same artist (half-open)."
  - id: ERR_REMINDER_WINDOW_OVERLAP
    http: 409
    condition: "New occasion's reminder window is within REMINDER_BUFFER_DAYS of an existing same-type ACTIVE reminder on the contact."
  - id: ERR_ARTIST_CAPACITY_EXCEEDED
    http: 409
    condition: "Reserving would exceed the artist's daily_capacity on window_start's date."
  - id: ERR_GIFT_QUANTITY_INVALID
    http: 422
    condition: "gift_item_id present but gift_quantity < 1."
  - id: ERR_EMPTY_IMPORT
    http: 422
    condition: "bulk-import rows array is empty."
  - id: ERR_AUTO_SEND_CARD_REQUIRED
    http: 422
    condition: "auto_send true but default_card_id null."
  - id: ERR_INSUFFICIENT_CREDITS
    http: 402
    condition: "Submit with Account.card_credit_balance < 1."
  - id: ERR_STALE_ACCOUNT_VERSION
    http: 412
    condition: "OCC: expected_account_version != Account.version at submit."

# =====================================================================
# §1.7 RBAC Matrix
# =====================================================================
roles:
  - name: AccountHolder
    description: "The customer; owns their account, contacts, reminders, and orders; reviews/approves proofs."
    identity: "entity_backed:Account"
    exclusive_operations:
      - "POST /orders/{id}/submit"
      - "POST /proofs/{id}/approve"
      - "POST /proofs/{id}/request-changes"
      - "POST /subscriptions/{id}/change-tier (own)"
      - "POST /subscriptions/{id}/cancel (own)"
    shared_operations:
      - "POST /accounts/{id}/subscriptions"
      - "POST /contacts, POST /accounts/{id}/contacts/bulk-import"
      - "POST /contacts/{id}/important-dates"
      - "POST /orders, POST /orders/{id}/schedule, POST /orders/{id}/cancel"
      - "GET account/contacts/important-dates/orders/proofs/shipment (own)"

  - name: StudioOperator
    description: "Studio staff; manages catalog, verifies addresses, assigns artists, revises proofs, produces/mails, advances tracking."
    identity: "opaque"
    exclusive_operations:
      - "POST /contacts/{id}/verify-address"
      - "POST /orders/{id}/assign-artist"
      - "POST /proofs/{id}/revise"
      - "POST /orders/{id}/produce"
      - "POST /orders/{id}/mail"
      - "POST /shipments/{id}/advance"
    shared_operations:
      - "POST /cards, POST /gift-items, POST /artists"
      - "POST /orders/{id}/schedule, POST /orders/{id}/cancel"
      - "GET orders/proofs/artist-assignments/shipment"

  - name: PlatformAdmin
    description: "System operator; provisions accounts, adjusts credits, drives the logical clock and scheduler."
    identity: "opaque"
    exclusive_operations:
      - "POST /accounts"
      - "POST /accounts/{id}/credit-adjustments"
      - "POST /_clock/set_current_utc"
      - "POST /_scheduler/run"
    shared_operations:
      - "POST /accounts/{id}/subscriptions, POST /subscriptions/{id}/change-tier, POST /subscriptions/{id}/cancel"
      - "POST /cards, POST /gift-items, POST /artists"
      - "GET (all read endpoints)"
