            - call: "POST /dealer-board/license-applications"
              payload: { dealer_id: "${dlr_l2_b_id}", application_type: "INITIAL", facility_sqft: 9000, display_spaces: 12, service_bays: 4, bond_amount_cents: 5000000, insurance_liability_cents: 100000000, zoning_certificate_status: "APPROVED", line_make_count: 1 }
              as: Dealer
              as_user_id: "${dlr_l2_b_id}"
              captures: { app_l2_b_id: $.data.id }
            - call: "POST /dealer-board/license-applications/${app_l2_b_id}/submit"
              payload: {}
              as: Dealer
              as_user_id: "${dlr_l2_b_id}"
            - call: "POST /dealer-board/license-applications/${app_l2_b_id}/decision"
              payload: { outcome: "APPROVED" }
              as: BoardAdmin
            - call: "POST /dealer-board/franchise-filings"
              payload: { manufacturer_id: "${mfr_l2_id}", filing_type: "TERMINATION", proposed_effective_on: "2026-12-01", affected_dealer_id: "${dlr_l2_a_id}", termination_cause_code: "FAILURE_TO_MEET_SALES_PERFORMANCE" }
              as: Manufacturer
              as_user_id: "${mfr_l2_id}"
              captures: { fil_l2_a_id: $.data.id }
            - call: "POST /dealer-board/franchise-filings/${fil_l2_a_id}/serve-notice"
              payload: {}
              as: Manufacturer
              as_user_id: "${mfr_l2_id}"
              captures: { fil_l2_a_v: $.data.version }
            - call: "POST /dealer-board/franchise-filings"
              payload: { manufacturer_id: "${mfr_l2_id}", filing_type: "TERMINATION", proposed_effective_on: "2026-12-01", affected_dealer_id: "${dlr_l2_b_id}", termination_cause_code: "FAILURE_TO_MEET_SALES_PERFORMANCE" }
              as: Manufacturer
              as_user_id: "${mfr_l2_id}"
              captures: { fil_l2_b_id: $.data.id }
            - call: "POST /dealer-board/franchise-filings/${fil_l2_b_id}/serve-notice"
              payload: {}
              as: Manufacturer
              as_user_id: "${mfr_l2_id}"
              captures: { fil_l2_b_v: $.data.version }
            - call: "POST /dealer-board/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: BoardAdmin
            - call: "POST /dealer-board/protests"
              payload: { franchise_filing_id: "${fil_l2_a_id}", protestant_dealer_id: "${dlr_l2_a_id}", grounds_code: "NO_GOOD_CAUSE_FOR_TERMINATION", expected_franchise_filing_version: "${fil_l2_a_v}" }
              as: Dealer
              as_user_id: "${dlr_l2_a_id}"
              captures: { pro_l2_a_id: $.data.id }
            - call: "POST /dealer-board/protests"
              payload: { franchise_filing_id: "${fil_l2_b_id}", protestant_dealer_id: "${dlr_l2_b_id}", grounds_code: "NO_GOOD_CAUSE_FOR_TERMINATION", expected_franchise_filing_version: "${fil_l2_b_v}" }
              as: Dealer
              as_user_id: "${dlr_l2_b_id}"
              captures: { pro_l2_b_id: $.data.id }
            - call: "POST /dealer-board/protests/${pro_l2_a_id}/schedule"
              payload: { hearing_room_id: "${room_l2_id}", hearing_start_at: "2026-11-02T10:00:00Z", hearing_end_at: "2026-11-02T13:00:00Z", hearing_session_count: 1, expected_hearing_room_version: "${room_l2_v_stale}" }
              as: HearingClerk
            - call: "GET /dealer-board/hearing-rooms/${room_l2_id}"
              as: HearingClerk
              captures: { room_l2_v_fresh: $.data.version }
          trigger:
            - call: "POST /dealer-board/protests/${pro_l2_b_id}/schedule"
              payload: { hearing_room_id: "${room_l2_id}", hearing_start_at: "2026-11-05T10:00:00Z", hearing_end_at: "2026-11-05T13:00:00Z", hearing_session_count: 1, expected_hearing_room_version: "${room_l2_v_stale}" }
              as: HearingClerk
            - call: "POST /dealer-board/protests/${pro_l2_b_id}/schedule"
              payload: { hearing_room_id: "${room_l2_id}", hearing_start_at: "2026-11-05T10:00:00Z", hearing_end_at: "2026-11-05T13:00:00Z", hearing_session_count: 1, expected_hearing_room_version: "${room_l2_v_fresh}" }
              as: HearingClerk
          assert:
            - "the first booking advanced the room: ${room_l2_v_fresh} == ${room_l2_v_stale} + 1 with booked_hearing_count 1"
            - "trigger 1: HTTP 412 with error_id ERR_STALE_ROOM_VERSION; Protest.${pro_l2_b_id}.status stays FILED and hearing_room_id stays null"
            - "trigger 2: HTTP 200 — Protest.${pro_l2_b_id}.status == SCHEDULED with hearing_start_at 2026-11-05T10:00:00Z"
            - "after trigger 2: HearingRoom.${room_l2_id}.booked_hearing_count == 2 and version == ${room_l2_v_fresh} + 1"
            - "no 409 is ever returned: the two intervals are three days apart, so the refusal is purely a version refusal"

      - name: filing_version_advances_once_per_write_and_never_on_a_read
        claim_type: optimistic_concurrency
        grounds:
          - entities.FranchiseFiling.version
          - concurrency_rules.protest-create-stale-filing
        distinguishing_aspect: "The OCC comparand is a per-write counter, not a timestamp: an ADDITIONAL_POINT filing shows version 0 at creation, 1 after serve-notice and 2 after the amendment, while two intervening reads leave it untouched."
        test_recipe:
          setup:
            - "One franchisor and one ADDITIONAL_POINT filing (no dealer row is touched by this filing type)."
          setup_api_calls:
            - call: "POST /dealer-board/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: BoardAdmin
            - call: "POST /dealer-board/manufacturers"
              payload: { legal_name: "Aurora Motors NA", line_make: "AURORA", home_office_state: "MI", posted_warranty_labor_rate_cents: 6000 }
              as: BoardAdmin
              captures: { mfr_l3_id: $.data.id }
          trigger:
            - call: "POST /dealer-board/franchise-filings"
              payload: { manufacturer_id: "${mfr_l3_id}", filing_type: "ADDITIONAL_POINT", proposed_effective_on: "2026-11-01", site_x_km: 9, site_y_km: 12 }
              as: Manufacturer
              as_user_id: "${mfr_l3_id}"
              captures: { fil_l3_id: $.data.id }
            - call: "GET /dealer-board/franchise-filings/${fil_l3_id}"
              as: BoardAdmin
            - call: "POST /dealer-board/franchise-filings/${fil_l3_id}/serve-notice"
              payload: {}
              as: Manufacturer
              as_user_id: "${mfr_l3_id}"
            - call: "GET /dealer-board/franchise-filings/${fil_l3_id}"
              as: BoardAdmin
            - call: "POST /dealer-board/franchise-filings/${fil_l3_id}/amend"
              payload: { proposed_effective_on: "2026-11-15" }
              as: Manufacturer
              as_user_id: "${mfr_l3_id}"
          assert:
            - "trigger 1: version == 0 with status DRAFT"
            - "trigger 2 (read): version still 0"
            - "trigger 3: version == 1 with status NOTICE_SERVED, notice_served_on 2026-09-01 and protest_window_ends_on 2026-10-01"
            - "trigger 4 (read): version still 1"
            - "trigger 5: version == 2 with amendment_count 1 and proposed_effective_on 2026-11-15"
            - "Manufacturer.${mfr_l3_id}.active_filing_count == 1 throughout"

      - name: clock_sweep_expires_a_salesperson_and_reports_deterministic_counters
        claim_type: scheduled_actions
        grounds:
          - endpoints.POST_dealer-board__clock_set_current_utc
          - state_machines.Salesperson.LICENSED_to_EXPIRED
        distinguishing_aspect: "The ops-run checkpoint is the only actor that expires a term: advancing the clock to 2027-09-02 sweeps the salesperson whose licence ran to 2027-09-01 (swept_salesperson_count 1, swept_dealer_count 0 because the dealer's term runs to 2028-08-30), decrements the sponsor's counter, and a second advance one day later reports every counter back at 0."
        test_recipe:
          setup:
            - "Dealer licensed 2026-09-01 (expires 2028-08-30) sponsoring one salesperson licensed 2026-09-02 (expires 2027-09-01)."
          setup_api_calls:
            - call: "POST /dealer-board/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: BoardAdmin
            - call: "POST /dealer-board/dealers"
              payload: { legal_name: "Lakeside Aurora", dealer_type: "USED_ONLY", county_tier: "TIER_2", site_x_km: 0, site_y_km: 0 }
              as: BoardAdmin
              captures: { dlr_l4_id: $.data.id }
            - call: "POST /dealer-board/license-applications"
              payload: { dealer_id: "${dlr_l4_id}", application_type: "INITIAL", facility_sqft: 2500, display_spaces: 4, service_bays: 0, bond_amount_cents: 2500000, insurance_liability_cents: 50000000, zoning_certificate_status: "APPROVED", line_make_count: 0 }
              as: Dealer
              as_user_id: "${dlr_l4_id}"
              captures: { app_l4_id: $.data.id }
            - call: "POST /dealer-board/license-applications/${app_l4_id}/submit"
              payload: {}
              as: Dealer
              as_user_id: "${dlr_l4_id}"
            - call: "POST /dealer-board/license-applications/${app_l4_id}/decision"
              payload: { outcome: "APPROVED" }
              as: BoardAdmin
            - call: "POST /dealer-board/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T00:00:00Z" }
              as: BoardAdmin
            - call: "POST /dealer-board/salespersons"
              payload: { sponsoring_dealer_id: "${dlr_l4_id}", full_name: "Dana Reyes", disclosed_prior_discipline: false }
              as: Dealer
              as_user_id: "${dlr_l4_id}"
              captures: { sp_l4_id: $.data.id }
            - call: "POST /dealer-board/salespersons/${sp_l4_id}/license-decision"
              payload: { outcome: "APPROVED" }
              as: LicensingAnalyst
          trigger:
            - call: "POST /dealer-board/_clock/set_current_utc"
              payload: { to_iso8601: "2027-09-02T00:00:00Z" }
              as: BoardAdmin
            - call: "POST /dealer-board/_clock/set_current_utc"
              payload: { to_iso8601: "2027-09-03T00:00:00Z" }
              as: BoardAdmin
          assert:
            - "before the triggers: Salesperson.${sp_l4_id}.license_status == LICENSED and Dealer.${dlr_l4_id}.licensed_salesperson_count == 1"
            - "trigger 1: HTTP 200 with current_utc 2027-09-02T00:00:00Z, swept_salesperson_count == 1, swept_dealer_count == 0, swept_protest_count == 0, swept_complaint_count == 0"
            - "after trigger 1: Salesperson.${sp_l4_id}.license_status == EXPIRED, discipline_status == CLEAR and Dealer.${dlr_l4_id}.licensed_salesperson_count == 0"
            - "after trigger 1: Dealer.${dlr_l4_id}.license_status == LICENSED (its own term runs to 2028-08-30)"
            - "trigger 2: all four swept_* counters are 0 — the sweep is not re-applied to an already-expired row"

      - name: layer_cascading_side_effects_end_to_end
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers.cascading_side_effects
        excluded_because:
          difficulty_instance: complaint_sanction_to_dealer_suspension_to_salesperson_to_count
          rationale: "The named §1.8 instance walks the full three-link chain (sanction -> dealer suspension -> salesperson suspension -> licensed_salesperson_count) and asserts every link, including ordering."
      - name: layer_dual_variant_calculation_both_variants_and_delta
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers.dual_variant_calculation
        excluded_because:
          difficulty_instance: warranty_rate_per_order_mean_vs_aggregate_weighted
          rationale: "The named §1.8 instance computes both variants over one repair-order sample and asserts the delta that the board must resolve."

  - section: consistency_model
    instances:
      - name: approval_response_already_carries_every_derived_consequence
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
        distinguishing_aspect: "Consistency is immediate: the decision response itself carries fee_total_cents 141000 and the stamped term, and reads issued straight afterwards — with no intervening write and no delay — already show the dealer LICENSED and FRANCHISED with its counters recomputed."
        test_recipe:
          setup:
            - "A submitted, deficiency-free INITIAL application for a TIER_2 NEW_MOTOR_VEHICLE dealer (9000 sqft, one line make)."
          setup_api_calls:
            - call: "POST /dealer-board/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: BoardAdmin
            - call: "POST /dealer-board/manufacturers"
              payload: { legal_name: "Aurora Motors NA", line_make: "AURORA", home_office_state: "MI", posted_warranty_labor_rate_cents: 6000 }
              as: BoardAdmin
              captures: { mfr_cm1_id: $.data.id }
            - call: "POST /dealer-board/dealers"
              payload: { legal_name: "Lakeside Aurora", dealer_type: "NEW_MOTOR_VEHICLE", county_tier: "TIER_2", site_x_km: 0, site_y_km: 0, line_make: "AURORA" }
              as: BoardAdmin
              captures: { dlr_cm1_id: $.data.id }
            - call: "POST /dealer-board/license-applications"
              payload: { dealer_id: "${dlr_cm1_id}", application_type: "INITIAL", facility_sqft: 9000, display_spaces: 12, service_bays: 4, bond_amount_cents: 5000000, insurance_liability_cents: 100000000, zoning_certificate_status: "APPROVED", line_make_count: 1 }
              as: Dealer
              as_user_id: "${dlr_cm1_id}"
              captures: { app_cm1_id: $.data.id }
            - call: "POST /dealer-board/license-applications/${app_cm1_id}/submit"
              payload: {}
              as: Dealer
              as_user_id: "${dlr_cm1_id}"
          trigger:
            - call: "POST /dealer-board/license-applications/${app_cm1_id}/decision"
              payload: { outcome: "APPROVED" }
              as: BoardAdmin
              captures: { cm1_fee: $.data.fee_total_cents }
            - call: "GET /dealer-board/dealers/${dlr_cm1_id}"
              as: BoardAdmin
            - call: "GET /dealer-board/license-applications"
              payload: { dealer_id: "${dlr_cm1_id}", status: "APPROVED", limit: 10, offset: 0 }
              as: LicensingAnalyst
          assert:
            - "trigger 1's own response already reports status APPROVED, deficiency_count 0, fee_total_cents 141000 (fee_quoted_cents 141000 and fee_delta_cents 0) and decided_on 2026-09-01"
            - "trigger 2, issued immediately afterwards: Dealer.${dlr_cm1_id}.license_status == LICENSED, franchise_status == FRANCHISED, license_effective_on == 2026-09-01, license_expires_on == 2028-08-30, licensed_salesperson_count == 0"
            - "trigger 3: total_count == 1 — the list projection is consistent with the write in the same instant"
            - "no re-read is ever needed for a derived value to appear: nothing in the chain lags"
