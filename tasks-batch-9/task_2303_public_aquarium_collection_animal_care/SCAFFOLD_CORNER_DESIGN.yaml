      - 'the liaison''s APPROVE: HTTP 403 and data.error_id == ERR_UNAUTHORIZED'
      - after both refusals TransferRequest.status == SUBMITTED with negotiation_round == 0
      - 'the liaison''s COUNTER: HTTP 200, status == COUNTERED, negotiation_round == 1 and counter_conditions == ["QUARANTINE_ON_ARRIVAL"]'
      - 'the resubmission carrying all three conditions: HTTP 200 and status == SUBMITTED'
      - 'the director''s APPROVE: HTTP 200, status == APPROVED and decided_by_user_id == "dir-transfer-approver"'
