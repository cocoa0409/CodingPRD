scaffold_corner_design:
  # =====================================================================
  # Entities — creation, retrieval, required fields, computed/system, not-found
  # =====================================================================
  - section: entities
    instances:
      - name: create_park_returns_201_with_open_posture_and_system_fields
        claim_type: Creation
        grounds:
          - entities.Park.fields.operational_posture
          - endpoints.POST_/parks
        distinguishing_aspect: "POST /parks with name returns 201; operational_posture == OPEN, open_lane_count == 0, version == 1, id is a bare UUID, created_at ISO8601."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /parks"
              payload: { name: "First Park", resident_zip_prefixes: [] }
              as: Anonymous
              captures: { park_id: $.data.id }
          assert:
            - "response status == 201"
            - "Park.${park_id}.operational_posture == OPEN"
            - "Park.${park_id}.open_lane_count == 0"
            - "Park.${park_id}.version == 1"

      - name: create_park_applies_defaults_when_thresholds_omitted
        claim_type: Defaults
        grounds:
          - entities.Park.fields.min_snow_depth_cm
          - entities.Park.fields.max_safe_wind_kph
        distinguishing_aspect: "Omitting min_snow_depth_cm and max_safe_wind_kph applies defaults 15 and 50."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /parks"
              payload: { name: "Default Park" }
              as: Anonymous
              captures: { park_id: $.data.id }
          assert:
            - "Park.${park_id}.min_snow_depth_cm == 15"
            - "Park.${park_id}.max_safe_wind_kph == 50"

      - name: get_park_not_found_returns_404
        claim_type: Not Found
        grounds:
          - endpoints.GET_/parks/{id}
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET /parks/{random-uuid} for a non-existent park returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "GET /parks/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ParkOperator
              captures: { err: $.data.error_id }
          assert:
            - "response status == 404"
            - "response error_id == ERR_NOT_FOUND"

      - name: create_ticket_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - endpoints.POST_/tickets
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /tickets omitting rider_age_years (required, no default) returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup:
            - "Park and time block exist; patron exists."
          setup_api_calls:
            - call: "POST /parks"
              payload: { name: "Tk Park", resident_zip_prefixes: [] }
              as: Anonymous
              captures: { park_id: $.data.id }
            - call: "POST /patrons"
              payload: { full_name: "Mia Miss", zip_code: "90001", birthdate: "1990-01-01T00:00:00Z" }
              as: Anonymous
              captures: { patron_id: $.data.id }
            - call: "POST /parks/${park_id}/time-blocks"
              payload: { starts_at: "2026-03-20T10:00:00Z", ends_at: "2026-03-20T12:00:00Z" }
              as: ParkOperator
              captures: { tb_id: $.data.id }
          trigger:
            - call: "POST /tickets"
              payload: { park_id: "${park_id}", time_block_id: "${tb_id}", holder_patron_id: "${patron_id}", rider_height_cm: 175 }
              as: GuestPatron
              as_user_id: "${patron_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 422"
            - "response error_id == ERR_INVALID_REQUEST"

      - name: create_ticket_invalid_enum_addon_category_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.AddOn.fields.category
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /add-ons with category not in {FOOD, RENTAL_UPGRADE, HOT_DRINK} returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup:
            - "Park, time block, patron, and a RESERVED ticket exist."
          setup_api_calls:
            - call: "POST /parks"
              payload: { name: "Enum Park", resident_zip_prefixes: [] }
              as: Anonymous
              captures: { park_id: $.data.id }
            - call: "POST /patrons"
              payload: { full_name: "Ed Enum", zip_code: "90002", birthdate: "1990-01-01T00:00:00Z" }
              as: Anonymous
              captures: { patron_id: $.data.id }
            - call: "POST /parks/${park_id}/time-blocks"
              payload: { starts_at: "2026-03-21T10:00:00Z", ends_at: "2026-03-21T12:00:00Z" }
              as: ParkOperator
              captures: { tb_id: $.data.id }
            - call: "POST /tickets"
              payload: { park_id: "${park_id}", time_block_id: "${tb_id}", holder_patron_id: "${patron_id}", rider_height_cm: 175, rider_age_years: 30 }
              as: GuestPatron
              as_user_id: "${patron_id}"
              captures: { ticket_id: $.data.id }
          trigger:
            - call: "POST /add-ons"
              payload: { park_id: "${park_id}", ticket_id: "${ticket_id}", category: "SOUVENIR", unit_price_cents: 500, quantity: 1 }
              as: GuestPatron
              as_user_id: "${patron_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 422"
            - "response error_id == ERR_INVALID_REQUEST"

      - name: ticket_computed_base_price_ignores_client_supplied_value
        claim_type: Computed Fields
        grounds:
          - entities.SessionTicket.fields.base_price_cents
          - calculations.ticket_pricing
        distinguishing_aspect: "base_price_cents is computed (adult walkup non-resident = 3500); it is source:computed so any client-sent value is ignored — only the formula output appears."
        test_recipe:
          setup:
            - "Park (no resident prefixes), time block, non-resident patron."
          setup_api_calls:
            - call: "POST /parks"
              payload: { name: "Compute Park", resident_zip_prefixes: [] }
              as: Anonymous
              captures: { park_id: $.data.id }
            - call: "POST /patrons"
              payload: { full_name: "Cody Compute", zip_code: "90003", birthdate: "1990-01-01T00:00:00Z" }
              as: Anonymous
              captures: { patron_id: $.data.id }
            - call: "POST /parks/${park_id}/time-blocks"
              payload: { starts_at: "2026-03-22T10:00:00Z", ends_at: "2026-03-22T12:00:00Z" }
              as: ParkOperator
              captures: { tb_id: $.data.id }
          trigger:
            - call: "POST /tickets"
              payload: { park_id: "${park_id}", time_block_id: "${tb_id}", holder_patron_id: "${patron_id}", rider_height_cm: 175, rider_age_years: 40 }
              as: GuestPatron
              as_user_id: "${patron_id}"
              captures: { ticket_id: $.data.id }
          assert:
            - "SessionTicket.${ticket_id}.base_price_cents == 3500"
            - "SessionTicket.${ticket_id}.is_resident == false"
            - "SessionTicket.${ticket_id}.lifecycle_state == RESERVED"
            - "SessionTicket.${ticket_id}.checkin_state == NOT_CHECKED_IN"

      - name: list_parks_pagination_envelope_fields_present
        claim_type: Listing
        grounds:
          - endpoints.GET_/parks
        distinguishing_aspect: "GET /parks returns response_type array with pagination fields total_count and has_more present in meta/envelope."
        test_recipe:
          setup:
            - "Two parks exist."
          setup_api_calls:
            - call: "POST /parks"
              payload: { name: "P1", resident_zip_prefixes: [] }
              as: Anonymous
            - call: "POST /parks"
              payload: { name: "P2", resident_zip_prefixes: [] }
              as: Anonymous
          trigger:
            - call: "GET /parks"
              payload: { limit: 10, offset: 0 }
              as: ParkOperator
          assert:
            - "response_type == array"
            - "total_count == 2"
            - "has_more == false"

  # =====================================================================
  # State machines — initial state, invalid-from, terminal lockdown, idempotency
  # =====================================================================
  - section: state_machines
    instances:
      - name: refund_from_reserved_ticket_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.SessionTicket.CONFIRMED_to_REFUNDED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Refunding a still-RESERVED (never confirmed) ticket is undefined from RESERVED -> ERR_INVALID_STATE (409); no RefundEntry created."
        test_recipe:
          setup:
            - "Park, time block, patron, RESERVED ticket (never confirmed)."
          setup_api_calls:
            - call: "POST /parks"
              payload: { name: "RefBad", resident_zip_prefixes: [] }
              as: Anonymous
              captures: { park_id: $.data.id }
            - call: "POST /patrons"
              payload: { full_name: "Ron Reserved", zip_code: "90004", birthdate: "1990-01-01T00:00:00Z" }
              as: Anonymous
              captures: { patron_id: $.data.id }
            - call: "POST /parks/${park_id}/time-blocks"
              payload: { starts_at: "2026-03-23T10:00:00Z", ends_at: "2026-03-23T12:00:00Z" }
              as: ParkOperator
              captures: { tb_id: $.data.id }
            - call: "POST /tickets"
              payload: { park_id: "${park_id}", time_block_id: "${tb_id}", holder_patron_id: "${patron_id}", rider_height_cm: 175, rider_age_years: 30 }
              as: GuestPatron
              as_user_id: "${patron_id}"
              captures: { ticket_id: $.data.id }
          trigger:
            - call: "POST /tickets/${ticket_id}/refund"
              payload: {}
              as: GuestPatron
              as_user_id: "${patron_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "response error_id == ERR_INVALID_STATE"
            - "SessionTicket.${ticket_id}.lifecycle_state == RESERVED"

      - name: sweep_already_swept_block_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.TimeBlock.ACTIVE_to_SWEPT
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "SWEPT is terminal for TimeBlock; a second sweep on a SWEPT block -> ERR_INVALID_STATE (409)."
        test_recipe:
          setup:
            - "Park, ACTIVE block already swept (now SWEPT); clock inside the block window."
          setup_api_calls:
            - call: "POST /parks"
              payload: { name: "SweepPark", resident_zip_prefixes: [] }
              as: Anonymous
              captures: { park_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-24T10:30:00Z" }
              as: ParkOperator
            - call: "POST /parks/${park_id}/time-blocks"
              payload: { starts_at: "2026-03-24T10:00:00Z", ends_at: "2026-03-24T12:00:00Z" }
              as: ParkOperator
              captures: { tb_id: $.data.id }
            - call: "POST /time-blocks/${tb_id}/activate"
              payload: {}
              as: ParkOperator
            - call: "POST /time-blocks/${tb_id}/sweep"
              payload: {}
              as: ParkOperator
          trigger:
            - call: "POST /time-blocks/${tb_id}/sweep"
              payload: {}
              as: ParkOperator
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "response error_id == ERR_INVALID_STATE"
            - "TimeBlock.${tb_id}.status == SWEPT"

      - name: activate_block_outside_window_returns_block_window_closed
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.TimeBlock.SCHEDULED_to_ACTIVE
          - validations[priority=12]
          - errors[ERR_BLOCK_WINDOW_CLOSED]
        distinguishing_aspect: "Activating a SCHEDULED block while clock-UTC is before starts_at returns ERR_BLOCK_WINDOW_CLOSED (409); block stays SCHEDULED."
        test_recipe:
          setup:
            - "Park, SCHEDULED block starting 2026-03-25T10:00; clock set to 2026-03-25T09:00 (before window)."
          setup_api_calls:
            - call: "POST /parks"
              payload: { name: "WinPark", resident_zip_prefixes: [] }
              as: Anonymous
              captures: { park_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-25T09:00:00Z" }
              as: ParkOperator
            - call: "POST /parks/${park_id}/time-blocks"
              payload: { starts_at: "2026-03-25T10:00:00Z", ends_at: "2026-03-25T12:00:00Z" }
              as: ParkOperator
              captures: { tb_id: $.data.id }
          trigger:
            - call: "POST /time-blocks/${tb_id}/activate"
              payload: {}
              as: ParkOperator
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "response error_id == ERR_BLOCK_WINDOW_CLOSED"
            - "TimeBlock.${tb_id}.status == SCHEDULED"

      - name: clear_conveyor_turn_before_cycle_elapsed_returns_invalid_state
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.ConveyorTurn.BOARDED_to_CLEARED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Clearing a BOARDED turn while clock-UTC < cleared_at (boarded 10:30:00, cycle 30s, clock still 10:30:00) returns ERR_INVALID_STATE (409); turn stays BOARDED."
        test_recipe:
          setup:
            - "OPEN park, OPEN lane cycle 30s, ACTIVE block, a GEARED_UP ticket with TUBE just boarded at 10:30:00 (clears 10:30:30); clock still 10:30:00."
          setup_api_calls:
            - call: "POST /parks"
              payload: { name: "ClearPark", resident_zip_prefixes: [] }
              as: Anonymous
              captures: { park_id: $.data.id }
            - call: "POST /parks/${park_id}/lanes"
              payload: { label: "L1", rider_capacity_per_block: 5, conveyor_cycle_seconds: 30 }
              as: ParkOperator
              captures: { lane_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-26T10:30:00Z" }
              as: ParkOperator
            - call: "POST /patrons"
              payload: { full_name: "Cleo Clear", zip_code: "90005", birthdate: "1990-01-01T00:00:00Z" }
              as: Anonymous
              captures: { patron_id: $.data.id }
            - call: "POST /parks/${park_id}/time-blocks"
              payload: { starts_at: "2026-03-26T10:00:00Z", ends_at: "2026-03-26T12:00:00Z" }
              as: ParkOperator
              captures: { tb_id: $.data.id }
            - call: "POST /time-blocks/${tb_id}/activate"
              payload: {}
              as: ParkOperator
            - call: "POST /waivers"
              payload: { patron_id: "${patron_id}", park_id: "${park_id}", signed_at: "2026-03-26T09:00:00Z" }
              as: GuestPatron
              as_user_id: "${patron_id}"
            - call: "POST /tickets"
              payload: { park_id: "${park_id}", time_block_id: "${tb_id}", holder_patron_id: "${patron_id}", rider_height_cm: 175, rider_age_years: 30 }
              as: GuestPatron
              as_user_id: "${patron_id}"
              captures: { ticket_id: $.data.id }
            - call: "GET /time-blocks/${tb_id}"
              payload: {}
              as: GuestPatron
              as_user_id: "${patron_id}"
              captures: { tb_v: $.data.version }
            - call: "POST /tickets/${ticket_id}/confirm"
              payload: { expected_time_block_version: "${tb_v}" }
              as: GuestPatron
              as_user_id: "${patron_id}"
            - call: "POST /equipment-rentals"
              payload: { ticket_id: "${ticket_id}", equipment_type: "TUBE", tube_size: "MEDIUM" }
              as: SafetyMarshal
            - call: "POST /tickets/${ticket_id}/gear-up"
              payload: {}
              as: SafetyMarshal
            - call: "POST /tickets/${ticket_id}/board"
              payload: { lane_id: "${lane_id}", boarded_at: "2026-03-26T10:30:00Z" }
              as: SafetyMarshal
            - call: "GET /conveyor-turns?lane_id=${lane_id}"
              payload: {}
              as: ParkOperator
              captures: { turn_id: $.data.0.id }
          trigger:
            - call: "POST /conveyor-turns/${turn_id}/clear"
              payload: {}
              as: ParkOperator
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "response error_id == ERR_INVALID_STATE"
            - "ConveyorTurn.${turn_id}.state == BOARDED"

      - name: redeem_requires_on_lane_checkin_state
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.SessionTicket.CONFIRMED_to_REDEEMED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Redeeming a CONFIRMED ticket whose checkin_state is still NOT_CHECKED_IN (not ON_LANE) returns ERR_INVALID_STATE (409); lifecycle stays CONFIRMED."
        test_recipe:
          setup:
            - "OPEN park, OPEN lane, ACTIVE block, waivered patron with a CONFIRMED ticket that was never geared up / boarded."
          setup_api_calls:
            - call: "POST /parks"
              payload: { name: "RedeemPark", resident_zip_prefixes: [] }
              as: Anonymous
              captures: { park_id: $.data.id }
            - call: "POST /parks/${park_id}/lanes"
              payload: { label: "L1", rider_capacity_per_block: 5, conveyor_cycle_seconds: 30 }
              as: ParkOperator
              captures: { lane_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-27T10:30:00Z" }
              as: ParkOperator
            - call: "POST /patrons"
              payload: { full_name: "Rod Redeem", zip_code: "90006", birthdate: "1990-01-01T00:00:00Z" }
              as: Anonymous
              captures: { patron_id: $.data.id }
            - call: "POST /parks/${park_id}/time-blocks"
              payload: { starts_at: "2026-03-27T10:00:00Z", ends_at: "2026-03-27T12:00:00Z" }
              as: ParkOperator
              captures: { tb_id: $.data.id }
            - call: "POST /time-blocks/${tb_id}/activate"
              payload: {}
              as: ParkOperator
            - call: "POST /waivers"
              payload: { patron_id: "${patron_id}", park_id: "${park_id}", signed_at: "2026-03-27T09:00:00Z" }
              as: GuestPatron
              as_user_id: "${patron_id}"
            - call: "POST /tickets"
              payload: { park_id: "${park_id}", time_block_id: "${tb_id}", holder_patron_id: "${patron_id}", rider_height_cm: 175, rider_age_years: 30 }
              as: GuestPatron
              as_user_id: "${patron_id}"
              captures: { ticket_id: $.data.id }
            - call: "GET /time-blocks/${tb_id}"
              payload: {}
              as: GuestPatron
              as_user_id: "${patron_id}"
              captures: { tb_v: $.data.version }
            - call: "POST /tickets/${ticket_id}/confirm"
              payload: { expected_time_block_version: "${tb_v}" }
              as: GuestPatron
              as_user_id: "${patron_id}"
          trigger:
            - call: "POST /tickets/${ticket_id}/redeem"
              payload: {}
              as: SafetyMarshal
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "response error_id == ERR_INVALID_STATE"
            - "SessionTicket.${ticket_id}.lifecycle_state == CONFIRMED"

      - name: park_closed_blocks_confirm_already_covered
        claim_type: Precondition Enforcement
        grounds:
          - validations[priority=7]
          - errors[ERR_PARK_CLOSED]
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / ticket_confirm_blocked_by_park_restricted_posture
          rationale: "The posture-gate failure path on confirm is already asserted as ERR_PARK_CLOSED by the named §1.8 instance."

      - name: weather_closed_cascade_already_covered
        claim_type: Side Effect Execution
        grounds:
          - state_machines.Park.OPEN_to_CLOSED
        excluded_because:
          difficulty_instance: transitive_cascade / weather_closed_cascades_lane_close_ticket_expire_refund_depth3
          rationale: "The full weather->lane->ticket->refund cascade is exercised by the named §1.8 depth-3 instance."

  # =====================================================================
  # Calculations — input filtering, constants, precision boundaries
  # =====================================================================
  - section: calculations
    instances:
      - name: addon_no_discount_when_not_eligible_plain_multiply
        claim_type: Correct Result
        grounds:
          - calculations.addon_line_total
          - entities.AddOn.fields.line_total_cents
        distinguishing_aspect: "A RENTAL_UPGRADE add-on (not FOOD, holder has no pass) gets NO discount: unit 333 x3 = 999; verifies the else-branch (no per-unit discount)."
        test_recipe:
          setup:
            - "Park, time block, non-resident patron with NO pass, a RESERVED ticket."
          setup_api_calls:
            - call: "POST /parks"
              payload: { name: "Plain", resident_zip_prefixes: [] }
              as: Anonymous
              captures: { park_id: $.data.id }
            - call: "POST /patrons"
              payload: { full_name: "Polly Plain", zip_code: "90007", birthdate: "1990-01-01T00:00:00Z" }
              as: Anonymous
              captures: { patron_id: $.data.id }
            - call: "POST /parks/${park_id}/time-blocks"
              payload: { starts_at: "2026-03-28T10:00:00Z", ends_at: "2026-03-28T12:00:00Z" }
              as: ParkOperator
              captures: { tb_id: $.data.id }
            - call: "POST /tickets"
              payload: { park_id: "${park_id}", time_block_id: "${tb_id}", holder_patron_id: "${patron_id}", rider_height_cm: 175, rider_age_years: 30 }
              as: GuestPatron
              as_user_id: "${patron_id}"
              captures: { ticket_id: $.data.id }
          trigger:
            - call: "POST /add-ons"
              payload: { park_id: "${park_id}", ticket_id: "${ticket_id}", category: "RENTAL_UPGRADE", unit_price_cents: 333, quantity: 3 }
              as: GuestPatron
              as_user_id: "${patron_id}"
              captures: { addon_id: $.data.id }
          assert:
            - "AddOn.${addon_id}.line_total_cents == 999"

      - name: group_deposit_tier_boundary_party_size_5_vs_6
        claim_type: Constants Applied
        grounds:
          - calculations.group_deposit
          - entities.GroupReservation.fields.deposit_cents
        distinguishing_aspect: "Tier boundary on group_deposit: party_size 5 SHARED bills at TIER1 3000/head (15000); the per-head is flat within the size's tier, not marginal."
        test_recipe:
          setup:
            - "OPEN park with one OPEN lane cap 20, SCHEDULED block, a GroupHost SHARED_SEATS reservation of party_size 5."
          setup_api_calls:
            - call: "POST /parks"
              payload: { name: "TierPark", resident_zip_prefixes: [] }
              as: Anonymous
              captures: { park_id: $.data.id }
            - call: "POST /parks/${park_id}/lanes"
              payload: { label: "L1", rider_capacity_per_block: 20, conveyor_cycle_seconds: 30 }
              as: ParkOperator
              captures: { lane_id: $.data.id }
            - call: "POST /patrons"
              payload: { full_name: "Five Host", zip_code: "90008", birthdate: "1980-01-01T00:00:00Z" }
              as: Anonymous
              captures: { host_id: $.data.id }
            - call: "POST /parks/${park_id}/time-blocks"
              payload: { starts_at: "2026-03-29T10:00:00Z", ends_at: "2026-03-29T12:00:00Z" }
              as: ParkOperator
              captures: { tb_id: $.data.id }
            - call: "POST /group-reservations"
              payload: { park_id: "${park_id}", host_patron_id: "${host_id}", time_block_id: "${tb_id}", rental_type: "SHARED_SEATS", party_size: 5 }
              as: GroupHost
              as_user_id: "${host_id}"
              captures: { res_id: $.data.id }
            - call: "GET /time-blocks/${tb_id}"
              payload: {}
              as: GroupHost
              as_user_id: "${host_id}"
