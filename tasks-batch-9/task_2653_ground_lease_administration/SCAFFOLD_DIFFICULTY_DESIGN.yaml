# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Ground Lease Administration - task_2653
# Every instance grounds in SCAFFOLD.yaml §1.1-§1.7. Every numeric assert below was
# computed by executing the relevant §1.3 formula against the pinned setup literals.
# The logical clock starts at 2026-08-01T00:00:00Z (see POST /_clock/set_current_utc).
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: revaluation_reset_midpoint_settlement_vs_arbitration_award
        grounds:
          - calculations.revaluation_reset_rent
          - state_machines.RentRevaluation.PROPOSALS_EXCHANGED_to_RESOLVED
          - state_machines.RentRevaluation.PROPOSALS_EXCHANGED_to_ARBITRATION_REFERRED
          - state_machines.ArbitrationProceeding.REFERRED_to_AWARDED
          - entities.RentRevaluation.fields.resolved_annual_base_rent_cents
          - entities.ArbitrationProceeding.fields.award_basis
        distinguishing_aspect: |
          This dual variant lives in the rent-setting domain (RentRevaluation x ArbitrationProceeding):
          from the identical appraisal pair 14000000 / 10000000 the midpoint_settlement variant fixes
          12000000 while the arbitration_award variant fixes 14000000, a 2000000-cent divergence that
          no shared code path can produce.
        test_recipe:
          setup:
            - "Logical clock at its 2026-08-01T00:00:00Z default."
            - "One lessee; two structurally identical leases A and B (base rent 10000000, collar 1000/5000 bps)."
            - "Each lease has one revaluation in status PROPOSALS_EXCHANGED carrying LESSOR 14000000 and LESSEE 10000000 at round 1."
          setup_api_calls:
            - call: "POST /portfolio/lessees"
              payload: { legal_name: "Harborline Retail Holdings LLC", notice_email: "notices@harborline.example", credit_rating_code: "A" }
              as: LessorAdmin
              captures: { lessee_id: $.data.id }
            - call: "POST /portfolio/leases"
              payload: { lessee_id: "${lessee_id}", premises_code: "PIER-40-A", commencement_date: "2020-01-01T00:00:00Z", expiration_date: "2070-01-01T00:00:00Z", initial_annual_base_rent_cents: 10000000, revaluation_interval_years: 5, reval_collar_min_uplift_bps: 1000, reval_collar_max_uplift_bps: 5000, percentage_rent_rate_bps: 600, percentage_rent_breakpoint_cents: 100000000, permitted_use_code: "RETAIL_MIXED", total_permitted_gfa_sqft: 200000, improvements_value_cents: 60000000, reversion_land_value_cents: 40000000, reversion_standard_code: "SHELL_CONDITION", security_deposit_cents: 5000000 }
              as: LessorAdmin
              captures: { lease_a_id: $.data.id }
            - call: "POST /portfolio/leases"
              payload: { lessee_id: "${lessee_id}", premises_code: "PIER-40-B", commencement_date: "2020-01-01T00:00:00Z", expiration_date: "2070-01-01T00:00:00Z", initial_annual_base_rent_cents: 10000000, revaluation_interval_years: 5, reval_collar_min_uplift_bps: 1000, reval_collar_max_uplift_bps: 5000, percentage_rent_rate_bps: 600, percentage_rent_breakpoint_cents: 100000000, permitted_use_code: "RETAIL_MIXED", total_permitted_gfa_sqft: 200000, improvements_value_cents: 60000000, reversion_land_value_cents: 40000000, reversion_standard_code: "SHELL_CONDITION", security_deposit_cents: 5000000 }
              as: LessorAdmin
              captures: { lease_b_id: $.data.id }
            - call: "POST /portfolio/leases/${lease_a_id}/rent-revaluations"
              payload: { valuation_date: "2027-06-01T00:00:00Z" }
              as: LessorAdmin
              captures: { reval_a_id: $.data.id }
            - call: "POST /portfolio/rent-revaluations/${reval_a_id}/appraisals"
              payload: { appointed_by: "LESSOR", appraised_annual_rent_cents: 14000000, valuation_method_code: "COMPARABLE_LAND" }
              as: LessorAdmin
            - call: "POST /portfolio/rent-revaluations/${reval_a_id}/appraisals"
              payload: { appointed_by: "LESSEE", appraised_annual_rent_cents: 10000000, valuation_method_code: "INCOME_CAP" }
              as: GroundTenant
              as_user_id: "${lessee_id}"
            - call: "POST /portfolio/rent-revaluations/${reval_a_id}/exchange"
              payload: {}
              as: LessorAdmin
            - call: "POST /portfolio/leases/${lease_b_id}/rent-revaluations"
              payload: { valuation_date: "2027-06-01T00:00:00Z" }
              as: LessorAdmin
              captures: { reval_b_id: $.data.id }
            - call: "POST /portfolio/rent-revaluations/${reval_b_id}/appraisals"
              payload: { appointed_by: "LESSOR", appraised_annual_rent_cents: 14000000, valuation_method_code: "COMPARABLE_LAND" }
              as: LessorAdmin
            - call: "POST /portfolio/rent-revaluations/${reval_b_id}/appraisals"
              payload: { appointed_by: "LESSEE", appraised_annual_rent_cents: 10000000, valuation_method_code: "INCOME_CAP" }
              as: GroundTenant
              as_user_id: "${lessee_id}"
            - call: "POST /portfolio/rent-revaluations/${reval_b_id}/exchange"
              payload: {}
              as: LessorAdmin
          trigger:
            - call: "POST /portfolio/rent-revaluations/${reval_a_id}/settle"
              payload: {}
              as: LessorAdmin
            - call: "POST /portfolio/rent-revaluations/${reval_b_id}/arbitration-referrals"
              payload: { arbitrator_user_id: "arb-neutral-1", hearing_date: "2027-07-01T00:00:00Z" }
              as: LessorAdmin
              captures: { arb_b_id: $.data.id }
            - call: "POST /portfolio/arbitrations/${arb_b_id}/award"
              payload: { independent_annual_rent_cents: 13000000 }
              as: Arbitrator
              as_user_id: "arb-neutral-1"
          assert:
            - "RentRevaluation.${reval_a_id}.divergence_bps == 4000 and RentRevaluation.${reval_b_id}.divergence_bps == 4000"
            - "RentRevaluation.${reval_a_id}.resolved_annual_base_rent_cents == 12000000"
            - "RentRevaluation.${reval_a_id}.resolution_method == MIDPOINT_SETTLEMENT and status == RESOLVED"
            - "ArbitrationProceeding.${arb_b_id}.award_basis == CLOSEST_LESSOR and awarded_annual_rent_cents == 14000000"
            - "RentRevaluation.${reval_b_id}.resolved_annual_base_rent_cents == 14000000 and resolution_method == ARBITRATION_AWARD"
            - "Lease.${lease_a_id}.current_annual_base_rent_cents == 12000000 and Lease.${lease_b_id}.current_annual_base_rent_cents == 14000000"
            - "Lease.${lease_b_id}.current_annual_base_rent_cents - Lease.${lease_a_id}.current_annual_base_rent_cents == 2000000"
            - "Lease.${lease_a_id}.rent_status == RESET_APPLIED and Lease.${lease_b_id}.rent_status == RESET_APPLIED"

      - name: condemnation_proceeds_bonus_value_vs_pro_rata_share
        grounds:
          - calculations.loss_proceeds_allocation
          - state_machines.LossEvent.ADJUSTED_to_ALLOCATED
          - entities.LossEvent.fields.lessee_share_bps
          - entities.LossEvent.fields.allocated_lessor_cents
        distinguishing_aspect: |
          This dual variant lives in the proceeds domain (LossEvent x LeaseholdMortgage ledger), not the
          rent domain: on identical pools of 20000000 with identical arrears and mortgage stacks the
          bonus_value variant sets lessee_share_bps 6000 and leaves the lessor 2000000, while the
          pro_rata_value variant sets 8684 and leaves the lessor 0 after the bucket-3 cap bites.
        test_recipe:
          setup:
            - "Logical clock at its 2026-08-01T00:00:00Z default (the pro-rata term fraction reads this instant)."
            - "Two identical leases C and D running 2020-01-01 to 2070-01-01 with improvements 60000000 and land 40000000."
            - "Each lease carries arrears 1000000 and two mortgages: priority 1 principal 3000000, priority 2 principal 2000000."
            - "Each lease has one CONDEMNATION LossEvent in status ADJUSTED with distributable_pool_cents 20000000; C uses BONUS_VALUE, D uses PRO_RATA_VALUE."
          setup_api_calls:
            - call: "POST /portfolio/lessees"
              payload: { legal_name: "Harborline Retail Holdings LLC", notice_email: "notices@harborline.example", credit_rating_code: "A" }
              as: LessorAdmin
              captures: { lessee_id: $.data.id }
            - call: "POST /portfolio/leases"
              payload: { lessee_id: "${lessee_id}", premises_code: "PIER-41-C", commencement_date: "2020-01-01T00:00:00Z", expiration_date: "2070-01-01T00:00:00Z", initial_annual_base_rent_cents: 10000000, revaluation_interval_years: 5, reval_collar_min_uplift_bps: 1000, reval_collar_max_uplift_bps: 5000, percentage_rent_rate_bps: 600, percentage_rent_breakpoint_cents: 100000000, permitted_use_code: "RETAIL_MIXED", total_permitted_gfa_sqft: 200000, improvements_value_cents: 60000000, reversion_land_value_cents: 40000000, reversion_standard_code: "SHELL_CONDITION", security_deposit_cents: 5000000 }
              as: LessorAdmin
              captures: { lease_c_id: $.data.id }
            - call: "POST /portfolio/leases"
              payload: { lessee_id: "${lessee_id}", premises_code: "PIER-41-D", commencement_date: "2020-01-01T00:00:00Z", expiration_date: "2070-01-01T00:00:00Z", initial_annual_base_rent_cents: 10000000, revaluation_interval_years: 5, reval_collar_min_uplift_bps: 1000, reval_collar_max_uplift_bps: 5000, percentage_rent_rate_bps: 600, percentage_rent_breakpoint_cents: 100000000, permitted_use_code: "RETAIL_MIXED", total_permitted_gfa_sqft: 200000, improvements_value_cents: 60000000, reversion_land_value_cents: 40000000, reversion_standard_code: "SHELL_CONDITION", security_deposit_cents: 5000000 }
              as: LessorAdmin
              captures: { lease_d_id: $.data.id }
            - call: "POST /portfolio/leases/${lease_c_id}/rent-charges"
              payload: { amount_cents: 1000000, memo: "2026 Q2 ground rent" }
              as: LeaseAccountant
            - call: "POST /portfolio/leases/${lease_d_id}/rent-charges"
              payload: { amount_cents: 1000000, memo: "2026 Q2 ground rent" }
              as: LeaseAccountant
            - call: "POST /portfolio/leases/${lease_c_id}/leasehold-mortgages"
              payload: { mortgagee_legal_name: "Keystone Senior Debt Fund", notice_email: "servicing@keystone.example", original_principal_cents: 3000000, priority_rank: 1, cure_extension_days: 30 }
              as: LessorAdmin
              captures: { m_c1_id: $.data.id }
            - call: "POST /portfolio/leases/${lease_c_id}/leasehold-mortgages"
              payload: { mortgagee_legal_name: "Bayfront Mezzanine Partners", notice_email: "servicing@bayfront.example", original_principal_cents: 2000000, priority_rank: 2, cure_extension_days: 15 }
              as: LessorAdmin
              captures: { m_c2_id: $.data.id }
            - call: "POST /portfolio/leases/${lease_d_id}/leasehold-mortgages"
              payload: { mortgagee_legal_name: "Keystone Senior Debt Fund", notice_email: "servicing@keystone.example", original_principal_cents: 3000000, priority_rank: 1, cure_extension_days: 30 }
              as: LessorAdmin
              captures: { m_d1_id: $.data.id }
            - call: "POST /portfolio/leases/${lease_d_id}/leasehold-mortgages"
              payload: { mortgagee_legal_name: "Bayfront Mezzanine Partners", notice_email: "servicing@bayfront.example", original_principal_cents: 2000000, priority_rank: 2, cure_extension_days: 15 }
              as: LessorAdmin
              captures: { m_d2_id: $.data.id }
            - call: "POST /portfolio/leases/${lease_c_id}/loss-events"
              payload: { event_type: "CONDEMNATION", scope_code: "PARTIAL", occurred_at: "2026-07-01T00:00:00Z", damage_estimate_cents: 20000000, damaged_area_sqft: 5000 }
              as: AssetManager
              captures: { loss_c_id: $.data.id }
            - call: "POST /portfolio/leases/${lease_d_id}/loss-events"
              payload: { event_type: "CONDEMNATION", scope_code: "PARTIAL", occurred_at: "2026-07-01T00:00:00Z", damage_estimate_cents: 20000000, damaged_area_sqft: 5000 }
              as: AssetManager
              captures: { loss_d_id: $.data.id }
            - call: "POST /portfolio/loss-events/${loss_c_id}/adjust"
              payload: { distributable_pool_cents: 20000000, allocation_method: "BONUS_VALUE", rent_abatement_bps: 0 }
              as: AssetManager
            - call: "POST /portfolio/loss-events/${loss_d_id}/adjust"
              payload: { distributable_pool_cents: 20000000, allocation_method: "PRO_RATA_VALUE", rent_abatement_bps: 0 }
              as: AssetManager
          trigger:
            - call: "POST /portfolio/loss-events/${loss_c_id}/allocate"
              payload: {}
              as: LeaseAccountant
            - call: "POST /portfolio/loss-events/${loss_d_id}/allocate"
              payload: {}
              as: LeaseAccountant
          assert:
            - "LossEvent.${loss_c_id}.lessee_share_bps == 6000 and LossEvent.${loss_d_id}.lessee_share_bps == 8684"
            - "LossEvent.${loss_c_id}.allocated_arrears_cents == 1000000 and allocated_mortgagee_cents == 5000000"
            - "LossEvent.${loss_c_id}.allocated_lessee_cents == 12000000 and allocated_lessor_cents == 2000000"
            - "LossEvent.${loss_d_id}.allocated_arrears_cents == 1000000 and allocated_mortgagee_cents == 5000000"
            - "LossEvent.${loss_d_id}.allocated_lessee_cents == 14000000 and allocated_lessor_cents == 0"
            - "LossEvent.${loss_c_id}.allocated_arrears_cents + allocated_mortgagee_cents + allocated_lessee_cents + allocated_lessor_cents == 20000000"
            - "LossEvent.${loss_d_id}.allocated_arrears_cents + allocated_mortgagee_cents + allocated_lessee_cents + allocated_lessor_cents == 20000000"
            - "LossEvent.${loss_c_id}.allocation_detail == [{mortgage_id: ${m_c1_id}, amount_cents: 3000000}, {mortgage_id: ${m_c2_id}, amount_cents: 2000000}]"
            - "Lease.${lease_c_id}.arrears_balance_cents == 0 and Lease.${lease_d_id}.arrears_balance_cents == 0"

      - name: percentage_rent_provisional_then_audited_final_reconciliation
        grounds:
          - calculations.percentage_rent_due
          - calculations.sublease_inclusion_base
          - state_machines.PercentageRentStatement.SUBMITTED_to_PROVISIONAL_ASSESSED
          - state_machines.PercentageRentStatement.PROVISIONAL_ASSESSED_to_FINAL_ASSESSED
          - entities.PercentageRentStatement.fields.assessment_variant
          - entities.PercentageRentStatement.fields.underreport_penalty_cents
        distinguishing_aspect: |
          A third, different entity domain (PercentageRentStatement turnover accounting): the audited_final
          variant widens the sublease inclusion filter from ACTIVE to ACTIVE plus CONSENT_GRANTED, so the same
          rows yield included_sublease_rent_cents 3000002 provisionally and 3500003 on audit, and amount_due
          moves 380000 -> 1310000 with a 900000 underreport penalty.
        test_recipe:
          setup:
            - "Clock rolled back to 2024-12-01T00:00:00Z while the subleases are papered, then forward to 2026-08-01T00:00:00Z."
            - "Lease with base rent 10000000, percentage_rent_rate_bps 600, breakpoint 100000000, GFA 200000."
            - "Subleases UNIT-A (rent 4000001) and UNIT-B (rent 2000001) are ACTIVE; UNIT-C (rent 1000001) is only CONSENT_GRANTED."
            - "One statement for 2025-01-01 to 2026-01-01 reporting gross sales 144999998 in status SUBMITTED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2024-12-01T00:00:00Z" }
              as: LessorAdmin
            - call: "POST /portfolio/lessees"
              payload: { legal_name: "Harborline Retail Holdings LLC", notice_email: "notices@harborline.example", credit_rating_code: "A" }
              as: LessorAdmin
              captures: { lessee_id: $.data.id }
            - call: "POST /portfolio/leases"
              payload: { lessee_id: "${lessee_id}", premises_code: "PIER-42", commencement_date: "2020-01-01T00:00:00Z", expiration_date: "2070-01-01T00:00:00Z", initial_annual_base_rent_cents: 10000000, revaluation_interval_years: 5, reval_collar_min_uplift_bps: 1000, reval_collar_max_uplift_bps: 5000, percentage_rent_rate_bps: 600, percentage_rent_breakpoint_cents: 100000000, permitted_use_code: "RETAIL_MIXED", total_permitted_gfa_sqft: 200000, improvements_value_cents: 60000000, reversion_land_value_cents: 40000000, reversion_standard_code: "SHELL_CONDITION", security_deposit_cents: 5000000 }
              as: LessorAdmin
              captures: { lease_id: $.data.id }
            - call: "POST /portfolio/transfer-requests"
              payload: { lease_id: "${lease_id}", transfer_type: "SUBLEASE", term_start: "2025-01-01T00:00:00Z", term_end: "2030-01-01T00:00:00Z", transferee_legal_name: "Tidewater Grocers Inc", transferee_credit_rating_code: "BBB", premises_unit_code: "UNIT-A", annual_sublease_rent_cents: 4000001, sublet_area_sqft: 1000, consent_deposit_cents: 0 }
              as: GroundTenant
              as_user_id: "${lessee_id}"
              captures: { sub_a_id: $.data.id }
            - call: "POST /portfolio/transfer-requests"
              payload: { lease_id: "${lease_id}", transfer_type: "SUBLEASE", term_start: "2025-01-01T00:00:00Z", term_end: "2030-01-01T00:00:00Z", transferee_legal_name: "Northline Pharmacy LLC", transferee_credit_rating_code: "BBB", premises_unit_code: "UNIT-B", annual_sublease_rent_cents: 2000001, sublet_area_sqft: 1000, consent_deposit_cents: 0 }
              as: GroundTenant
              as_user_id: "${lessee_id}"
              captures: { sub_b_id: $.data.id }
            - call: "POST /portfolio/transfer-requests"
              payload: { lease_id: "${lease_id}", transfer_type: "SUBLEASE", term_start: "2025-01-01T00:00:00Z", term_end: "2030-01-01T00:00:00Z", transferee_legal_name: "Quayside Bakery Co", transferee_credit_rating_code: "BBB", premises_unit_code: "UNIT-C", annual_sublease_rent_cents: 1000001, sublet_area_sqft: 1000, consent_deposit_cents: 0 }
              as: GroundTenant
              as_user_id: "${lessee_id}"
              captures: { sub_c_id: $.data.id }
            - call: "POST /portfolio/transfer-requests/${sub_a_id}/decision"
              payload: { decision: "APPROVE" }
              as: AssetManager
            - call: "POST /portfolio/transfer-requests/${sub_b_id}/decision"
              payload: { decision: "APPROVE" }
              as: AssetManager
            - call: "POST /portfolio/transfer-requests/${sub_c_id}/decision"
              payload: { decision: "APPROVE" }
              as: AssetManager
            - call: "POST /portfolio/transfer-requests/${sub_a_id}/fee-payments"
              payload: { amount_cents: 2024376 }
              as: GroundTenant
              as_user_id: "${lessee_id}"
            - call: "POST /portfolio/transfer-requests/${sub_b_id}/fee-payments"
              payload: { amount_cents: 999376 }
              as: GroundTenant
              as_user_id: "${lessee_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: LessorAdmin
            - call: "GET /portfolio/leases/${lease_id}"
              payload: {}
              as: LessorAdmin
              captures: { lease_v: $.data.version }
            - call: "POST /portfolio/percentage-rent-statements"
              payload: { lease_id: "${lease_id}", period_start: "2025-01-01T00:00:00Z", period_end: "2026-01-01T00:00:00Z", reported_gross_sales_cents: 144999998, expected_lease_version: "${lease_v}" }
              as: GroundTenant
              as_user_id: "${lessee_id}"
              captures: { stmt_id: $.data.id }
          trigger:
            - call: "POST /portfolio/percentage-rent-statements/${stmt_id}/assess"
              payload: {}
              as: LeaseAccountant
            - call: "POST /portfolio/percentage-rent-statements/${stmt_id}/audit"
              payload: { audited_gross_sales_cents: 160000000 }
              as: LeaseAccountant
          assert:
            - "Lease.${lease_id}.percentage_rent_sublease_base_cents == 3000002 after the two fee payments"
            - "after trigger[0]: PercentageRentStatement.${stmt_id}.included_sublease_rent_cents == 3000002"
            - "after trigger[0]: gross_percentage_rent_cents == 2880000, base_rent_offset_credit_cents == 2500000, amount_due_cents == 380000"
            - "after trigger[0]: assessment_variant == PROVISIONAL and status == PROVISIONAL_ASSESSED and Lease.${lease_id}.arrears_balance_cents == 380000"
            - "after trigger[1]: included_sublease_rent_cents == 3500003 (UNIT-C's 500001 enters only on audit)"
            - "after trigger[1]: gross_percentage_rent_cents == 3810000, amount_due_cents == 1310000, underreport_penalty_cents == 900000"
            - "after trigger[1]: assessment_variant == AUDITED_FINAL and status == FINAL_ASSESSED"
            - "after trigger[1]: Lease.${lease_id}.arrears_balance_cents == 2210000 (380000 + (1310000 - 380000) + 900000)"

  - rule_id: combinatorial_formula
    instances:
      - name: sublease_inclusion_base_per_line_rounding_beats_sum_first
        grounds:
          - calculations.sublease_inclusion_base
          - state_machines.TransferRequest.CONSENT_GRANTED_to_ACTIVE
          - entities.Lease.fields.percentage_rent_sublease_base_cents
          - endpoints.POST_/portfolio/transfer-requests/{id}/fee-payments
        distinguishing_aspect: |
          Mode (b) - rounding is applied per sublease line and only then summed. Four odd rents
          (4000001, 2000001, 6000001, 8000001) at SUBLEASE_INCLUSION_RATE_BPS 5000 give 10000004 line by
          line but 10000002 if the rents are summed first and rounded once, so the naive order is off by
          two cents. The aggregate is also re-derived on every activation, so the intermediate totals
          after one, two and three activations are each asserted.
        test_recipe:
          setup:
            - "Clock at its 2026-08-01T00:00:00Z default; one lessee; one lease with base rent 10000000 and total_permitted_gfa_sqft 200000."
            - "Four SUBLEASE transfer requests on distinct premises_unit_codes, each 1000 sqft, term 2026-09-01 to 2031-09-01 (so submitted_late is false), rents 4000001 / 2000001 / 6000001 / 8000001."
            - "All four are approved; none has paid yet, so all sit in CONSENT_GRANTED and the lease base is still 0."
          setup_api_calls:
            - call: "POST /portfolio/lessees"
              payload: { legal_name: "Harborline Retail Holdings LLC", notice_email: "notices@harborline.example", credit_rating_code: "A" }
              as: LessorAdmin
              captures: { lessee_id: $.data.id }
            - call: "POST /portfolio/leases"
              payload: { lessee_id: "${lessee_id}", premises_code: "PIER-43", commencement_date: "2020-01-01T00:00:00Z", expiration_date: "2070-01-01T00:00:00Z", initial_annual_base_rent_cents: 10000000, revaluation_interval_years: 5, reval_collar_min_uplift_bps: 1000, reval_collar_max_uplift_bps: 5000, percentage_rent_rate_bps: 600, percentage_rent_breakpoint_cents: 100000000, permitted_use_code: "RETAIL_MIXED", total_permitted_gfa_sqft: 200000, improvements_value_cents: 60000000, reversion_land_value_cents: 40000000, reversion_standard_code: "SHELL_CONDITION", security_deposit_cents: 5000000 }
              as: LessorAdmin
              captures: { lease_id: $.data.id }
            - call: "POST /portfolio/transfer-requests"
              payload: { lease_id: "${lease_id}", transfer_type: "SUBLEASE", term_start: "2026-09-01T00:00:00Z", term_end: "2031-09-01T00:00:00Z", transferee_legal_name: "Tidewater Grocers Inc", transferee_credit_rating_code: "BBB", premises_unit_code: "UNIT-1", annual_sublease_rent_cents: 4000001, sublet_area_sqft: 1000, consent_deposit_cents: 0 }
              as: GroundTenant
              as_user_id: "${lessee_id}"
              captures: { s1_id: $.data.id }
            - call: "POST /portfolio/transfer-requests"
              payload: { lease_id: "${lease_id}", transfer_type: "SUBLEASE", term_start: "2026-09-01T00:00:00Z", term_end: "2031-09-01T00:00:00Z", transferee_legal_name: "Northline Pharmacy LLC", transferee_credit_rating_code: "BBB", premises_unit_code: "UNIT-2", annual_sublease_rent_cents: 2000001, sublet_area_sqft: 1000, consent_deposit_cents: 0 }
              as: GroundTenant
              as_user_id: "${lessee_id}"
              captures: { s2_id: $.data.id }
            - call: "POST /portfolio/transfer-requests"
