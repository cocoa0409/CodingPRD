      - name: the_reviewer_and_the_completer_must_differ_from_the_originator
        claim_type: Segregation of duties
        grounds:
          - validations[priority 11 ERR_SEGREGATION_OF_DUTIES]
          - state_machines.DispatchPlan.SUBMITTED_to_APPROVED
          - state_machines.WorkOrder.BACKFILLED_to_COMPLETED
        distinguishing_aspect: "Both four-eyes gates key on X-User-ID rather than on the role, so a legitimate SystemController is still refused when it carries the authoring dispatcher's identity, and a legitimate FieldTechnician is refused when it carries the reporting technician's identity; the same calls succeed the moment a second identity presents itself, and only then are reviewed_by_user_id and completed_by_user_id recorded."
        test_recipe:
          setup:
            - "NetworkLoop LOOP-S with W-style assets, an ACTIVE UNIVERSITY agreement and a SUBMITTED plan authored by op-1."
            - "PipeSegment SEG-S1 and a BACKFILLED WorkOrder reported by tech-1 with requires_isolation false."
