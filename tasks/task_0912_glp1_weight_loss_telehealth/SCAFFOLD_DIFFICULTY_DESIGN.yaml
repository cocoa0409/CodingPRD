      - name: escalation_blocked_by_open_escalated_check_in
        grounds:
          - validations[priority=9]
          - errors[ERR_OPEN_ESCALATED_CHECK_IN]
          - state_machines.CheckIn.ESCALATED_to_RESOLVED
          - state_machines.TitrationStep.DUE_to_ADMINISTERED
        distinguishing_aspect: |
          Entity pair three is TitrationStep depending on CheckIn: with a score-7 check-in sitting
          in ESCALATED the prescription is still ACTIVE, so the escalate is refused specifically
          with ERR_OPEN_ESCALATED_CHECK_IN rather than any prescription-state error, and it
          succeeds the moment that check-in is resolved.
        test_recipe:
