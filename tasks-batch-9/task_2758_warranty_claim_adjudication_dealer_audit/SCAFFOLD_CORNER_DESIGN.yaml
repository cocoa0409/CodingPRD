            - "third call: exactly one ClaimEdit with edit_code == NO_COVERAGE, severity == SUSPEND and a non-null resolved_at"
      - name: claim_suspend_resubmit_loop_returns_to_submitted_cyclic_shape
        claim_type: valid_transition
        grounds:
          - state_machines.WarrantyClaim.status.SUSPENDED_to_SUBMITTED
          - complexity_profile.state_machine_shape
        excluded_because:
          difficulty_instance: non_linear_state_machine / claim_suspend_resubmit_cycle_with_independent_payment_dimension
          rationale: "The named §1.8 instance drives the SUSPENDED -> SUBMITTED -> SUSPENDED loop twice and asserts the loop is re-entrant, which subsumes the plain cyclic-shape claim."
      - name: claim_status_and_payment_dimensions_advance_independently
        claim_type: valid_transition
        grounds:
          - state_machines.WarrantyClaim.status
          - state_machines.WarrantyClaim.payment_status
          - complexity_profile.state_machine_shape
        excluded_because:
          difficulty_instance: non_linear_state_machine / claim_suspend_resubmit_cycle_with_independent_payment_dimension
          rationale: "The named §1.8 instance asserts payment_status stays UNPAID across every status hop and then moves alone, which is exactly the parallel-dimension claim."
      - name: audit_findings_issued_reentry_after_denied_appeal_cyclic_shape
        claim_type: valid_transition
        grounds:
          - state_machines.DealerAudit.transitions.APPEALED_to_FINDINGS_ISSUED
          - complexity_profile.state_machine_shape
        excluded_because:
          difficulty_instance: non_linear_state_machine / audit_findings_issued_appealed_findings_issued_loop_reentry
          rationale: "The named §1.8 instance asserts the FINDINGS_ISSUED -> APPEALED -> FINDINGS_ISSUED re-entry and the fresh appeal_deadline on the second pass."
      - name: dealer_posture_cascade_suspends_submitted_claims_of_the_dealer
        claim_type: side_effect_execution
        grounds:
          - state_machines.Dealer.transitions.ACTIVE_to_SUSPENDED
          - state_machines.WarrantyClaim.status.SUBMITTED_to_SUSPENDED
          - entities.ClaimEdit.fields.edit_code
        excluded_because:
          difficulty_instance: transitive_cascade / non_return_sweep_depth_five_return_claim_ledger_posture_sibling
          rationale: "The named §1.8 instance walks the five-hop cascade to the sibling claim and asserts its DEALER_POSTURE_HOLD edit, which subsumes the cascade-down claim."
      - name: appeal_grant_reverses_every_chargeback_side_effect_without_drift
        claim_type: side_effect_execution
        grounds:
          - state_machines.AuditAppeal.transitions.FILED_to_GRANTED
          - state_machines.AuditFinding.transitions.CHARGED_BACK_to_OVERTURNED
          - calculations.dealer_chargeback_balance
        excluded_because:
          difficulty_instance: transitive_cascade / appeal_grant_depth_five_finding_recompute_ledger_posture_release
          rationale: "The named §1.8 instance asserts both reversal ledger rows, the balance returning to 0 and the posture release, which is the compensation pattern in full."
      - name: late_parts_return_compensates_non_return_debit_to_zero
        claim_type: valid_transition
        grounds:
          - state_machines.PartsReturnRequest.transitions.NOT_RETURNED_to_RECEIVED
          - state_machines.WarrantyClaim.payment_status.DEBITED_to_CREDIT_REINSTATED
        excluded_because:
          difficulty_instance: compensating_invariant / late_part_return_reverses_non_return_debit_to_exact_zero
          rationale: "The named §1.8 instance asserts the late-return edge and the exact-zero balance restoration, so a separate valid-transition probe would duplicate it."

