      - name: methodology_revision_loop_preserves_comment_counts_and_regates_adoption
        claim_type: Valid Transition
        grounds:
          - state_machines.MethodologyVersion.COMMENT_CLOSED_to_DRAFT
          - state_machines.MethodologyVersion.DRAFT_to_COMMENT_OPEN
          - state_machines.MethodologyVersion.COMMENT_CLOSED_to_ADOPTED
          - endpoints.POST_/methodology-versions/{methodology_version_id}/return-to-draft
          - errors.ERR_UNRESOLVED_COMMENTS
        distinguishing_aspect: |
          The cyclic shape is deliberately asymmetric about what survives a
          loop: return-to-draft clears all three comment TIMESTAMPS so the next
          consultation is dated afresh, yet preserves comment_count and
          unresolved_comment_count so the public input already received still
          blocks adoption. A naive implementation that resets the comment
          bookkeeping alongside the timestamps would let an admin launder an
          unresolved objection away by looping DRAFT -> COMMENT_OPEN ->
          COMMENT_CLOSED -> DRAFT once. Adoption becomes possible only after the
          comment is actually disposed.
        test_recipe:
          setup:
            - "M1 is drafted at clock 2026-08-01, opened for comment, receives one public comment, and is closed"
          setup_api_calls:
            - call: "POST /methodology-versions"
              payload: { version_label: "M1", weight_financial_health: 0.40, weight_accountability: 0.25, weight_transparency: 0.20, weight_impact: 0.15, dimension_floor_score: 40.0 }
              as: MethodologyAdmin
              as_user_id: "admin-1"
              captures: { m1: $.data.id }
            - call: "POST /methodology-versions/${m1}/open-comment"
              payload: {}
              as: MethodologyAdmin
              as_user_id: "admin-1"
            - call: "POST /public-comments"
              payload: { methodology_version_id: "${m1}", commenter_kind: "DONOR", body: "The impact weight is too low" }
              as: PublicUser
              as_user_id: "public-1"
              captures: { pc1: $.data.id }
            - call: "POST /methodology-versions/${m1}/close-comment"
              payload: {}
              as: MethodologyAdmin
              as_user_id: "admin-1"
          trigger:
            - call: "POST /methodology-versions/${m1}/return-to-draft"
              payload: { revision_note: "Reweighting impact after the first consultation", weight_financial_health: 0.3250, weight_accountability: 0.2500, weight_transparency: 0.2000, weight_impact: 0.2250 }
              as: MethodologyAdmin
              as_user_id: "admin-1"
              captures: { looped_status: $.data.status }
            - call: "POST /methodology-versions/${m1}/open-comment"
              payload: {}
              as: MethodologyAdmin
              as_user_id: "admin-1"
            - call: "POST /methodology-versions/${m1}/close-comment"
              payload: {}
              as: MethodologyAdmin
              as_user_id: "admin-1"
            - call: "POST /methodology-versions/${m1}/adopt"
              payload: { effective_from: "2026-08-31T00:00:00Z" }
              as: MethodologyAdmin
              as_user_id: "admin-1"
              captures: { err_unresolved: $.data.error_id }
            - call: "POST /public-comments/${pc1}/dispose"
              payload: { disposition: "INCORPORATED", disposition_note: "Impact weight raised to 0.2250" }
              as: MethodologyAdmin
              as_user_id: "admin-1"
            - call: "POST /methodology-versions/${m1}/adopt"
              payload: { effective_from: "2026-08-31T00:00:00Z" }
              as: MethodologyAdmin
              as_user_id: "admin-1"
              captures: { adopted_status: $.data.status }
          assert:
            - "${looped_status} == DRAFT with comment_open_at, comment_closed_at and comment_deadline_at all cleared to null"
            - "immediately after the loop comment_count == 1 and unresolved_comment_count == 1 - the counts survived the round trip"
            - "the four weights are now 0.3250 / 0.2500 / 0.2000 / 0.2250 and revision_note was overwritten; the weights still sum to 1.0000"
            - "${err_unresolved} == ERR_UNRESOLVED_COMMENTS with HTTP 409 - the preserved count still gates adoption after the loop"
            - "disposing pc1 leaves comment_count == 1 but unresolved_comment_count == 0"
            - "${adopted_status} == ADOPTED with effective_from 2026-08-31T00:00:00Z, exactly 30 days after the logical clock"
            - "the second open-comment re-armed comment_deadline_at to 2026-08-31T00:00:00Z from the unchanged clock, and version incremented once per transition"
