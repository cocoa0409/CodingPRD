  # ==========================================================================
  - section: rbac
    instances:

      - name: no_role_can_reach_another_roles_exclusive_operation
        claim_type: role_denied_operations
        grounds:
          - rbac.roles.Programmer.exclusive_operations
          - rbac.roles.RightsManager.exclusive_operations
          - rbac.roles.TechnicalManager.exclusive_operations
          - rbac.roles.BoxOfficeManager.exclusive_operations
          - rbac.roles.ExecutiveDirector.exclusive_operations
          - validations[priority=2]
          - errors[ERR_FORBIDDEN_ROLE]
        distinguishing_aspect: |
          The peer-role model has no override path, so each of the five staff roles must be refused another
          role's exclusive operation - and the refusal must come from priority 2, ahead of the request-shape and
          not-found checks, which is why an empty body is enough to prove it. It fails if any role is treated as
          a superuser or if the body is validated before the role is.
        test_recipe:
          setup:
            - "No entities exist; the authorisation check precedes every lookup, so the target ids never need to be real."
            - "Each request carries a valid X-Role header naming a declared role and an X-User-ID, so priority 1 is satisfied."
            - "Each body is deliberately empty, which is legal to send because priority 2 is evaluated before priority 3."
          setup_api_calls: []
          trigger:
            - call: "POST /venues"
              payload: {}
              as: Programmer
              captures: { e_prog: $.data.error_id }
            - call: "POST /showtimes"
              payload: {}
              as: RightsManager
              captures: { e_rights: $.data.error_id }
            - call: "POST /clearances"
              payload: {}
              as: TechnicalManager
              captures: { e_tech: $.data.error_id }
            - call: "POST /dcp-assets"
              payload: {}
              as: BoxOfficeManager
              captures: { e_box: $.data.error_id }
            - call: "POST /settlements"
              payload: {}
              as: ExecutiveDirector
              captures: { e_exec: $.data.error_id }
            - call: "POST /membership-sweeps"
              payload: {}
              as: Member
              captures: { e_member: $.data.error_id }
          assert:
            - "All six calls return 403 and every captured code is ERR_FORBIDDEN_ROLE."
            - "None returns ERR_INVALID_REQUEST, proving the role gate ran before the body was parsed."
            - "None returns 404, proving the role gate ran before any id lookup."
            - "ExecutiveDirector is refused POST /settlements even though it is the most privileged role - the model is peer_roles, not hierarchical_override."
            - "Programmer is refused POST /venues even though it may create distributors and titles."

      - name: shared_operations_succeed_for_both_declared_roles
        claim_type: role_permitted_operations
        grounds:
          - rbac.roles.Programmer.shared_operations
          - rbac.roles.ExecutiveDirector.shared_operations
          - endpoints[POST /titles]
          - endpoints[GET /titles]
        distinguishing_aspect: |
          A shared operation must be genuinely shared: the same body posted by either declared role must
          succeed identically, and the resulting rows must be visible to both. It fails if the second role is
          refused, or if rows are silently scoped to their creator.
        test_recipe:
          setup:
            - "The canonical distributor exists so both titles have a valid rights holder."
            - "Both Programmer and ExecutiveDirector list POST /titles among their shared operations."
          setup_api_calls:
            - call: "POST /distributors"
              payload: { name: "Coyote Films", contact_email: "book@coyote.example", default_terms_variant: "SLIDING_SCALE_90_10", default_min_run_days: 4, default_distributor_share_pct: 0.35, requires_advance_guarantee: false }
              as: Programmer
              captures: { d_id: $.data.id }
          trigger:
            - call: "POST /titles"
              payload: { title_name: "La Jetee Redux", release_year: 1962, runtime_minutes: 104, is_first_run: false, native_format: "DCP_2K", rights_holder_distributor_id: "${d_id}" }
              as: Programmer
              captures: { t1_id: $.data.id }
            - call: "POST /titles"
              payload: { title_name: "Northern Light", release_year: 2026, runtime_minutes: 96, is_first_run: true, native_format: "DCP_4K", rights_holder_distributor_id: "${d_id}" }
              as: ExecutiveDirector
              captures: { t2_id: $.data.id }
            - call: "GET /titles"
              payload: { limit: 10, offset: 0 }
              as: Anonymous
          assert:
            - "Both creates return 201 with distinct ids."
            - "Title.${t1_id}.is_first_run == false and Title.${t2_id}.is_first_run == true."
            - "The listing returns total_count == 2 and both ids appear, so neither row was scoped to its creating role."
            - "GET /titles/${t2_id} as Programmer returns 200 - the row created by ExecutiveDirector is readable by the other sharer."

      - name: the_person_who_lodged_a_clearance_cannot_clear_it
        claim_type: segregation_of_duties
        grounds:
          - validations[priority=13]
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - state_machines.RightsClearance[SUBMITTED -> CLEARED]
          - entities.RightsClearance.submitted_by_user_id
        distinguishing_aspect: |
          Segregation is keyed on X-User-ID, not on X-Role: the same role that lodged the licence may clear
          it, provided a different person does so. The instance therefore fails BOTH ways - the same user is
          refused and a different user of the identical role succeeds - which is the only way to show the check
          reads the user and not the role.
        test_recipe:
          setup:
            - "Canonical venue / distributor / title / CONFIRMED booking."
            - "The clearance was lodged by RightsManager acting as X-User-ID u-rm-1, so submitted_by_user_id is u-rm-1 and status is SUBMITTED."
            - "The clock is at its startup default, so no window rule can interfere."
            - "u-rm-1 and u-rm-2 both carry the RightsManager role, so priority 2 is satisfied on both attempts."
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "Reel Repertory", seat_capacity: 12, house_hold_seats: 4, trailer_reel_minutes: 12, turnaround_minutes: 25, min_useful_gap_minutes: 45, dcp_ingest_lane_count: 2, open_local_time: "11:00", last_start_local_time: "22:00", utc_offset_minutes: 0, max_first_run_share: 0.60, weekly_repertory_target: 3, supported_formats: ["DCP_2K", "DCP_4K"], base_house_nut_weekly_cents: 200000 }
              as: ExecutiveDirector
              captures: { v_id: $.data.id }
            - call: "POST /distributors"
              payload: { name: "Coyote Films", contact_email: "book@coyote.example", default_terms_variant: "SLIDING_SCALE_90_10", default_min_run_days: 4, default_distributor_share_pct: 0.35, requires_advance_guarantee: false }
              as: Programmer
              captures: { d_id: $.data.id }
            - call: "POST /titles"
              payload: { title_name: "La Jetee Redux", release_year: 1962, runtime_minutes: 104, is_first_run: false, native_format: "DCP_2K", rights_holder_distributor_id: "${d_id}" }
              as: Programmer
              captures: { t1_id: $.data.id }
            - call: "POST /bookings"
              payload: { title_id: "${t1_id}", distributor_id: "${d_id}", venue_id: "${v_id}", terms_variant: "SLIDING_SCALE_90_10", house_nut_cents: 12500, distributor_share_pct: 0.35, guarantee_cents: 3000, min_run_days: 4, engagement_start_date: "2026-08-10", engagement_end_date: "2026-08-20" }
              as: Programmer
              captures: { b_id: $.data.id }
            - call: "POST /bookings/${b_id}/confirm"
              payload: {}
              as: ExecutiveDirector
              as_user_id: "u-ed-1"
            - call: "POST /clearances"
              payload: { title_id: "${t1_id}", booking_id: "${b_id}", licensor_name: "Cinematheque Nord", license_fee_cents: 45000, territory: "US-NY-METRO", window_start_date: "2026-08-10", window_end_date: "2026-08-20", max_screenings: 6, source_format: "DCP_2K" }
              as: RightsManager
              as_user_id: "u-rm-1"
              captures: { c_id: $.data.id }
          trigger:
            - call: "POST /clearances/${c_id}/clear"
              payload: {}
              as: RightsManager
              as_user_id: "u-rm-1"
              captures: { e_sod: $.data.error_id }
            - call: "POST /clearances/${c_id}/clear"
              payload: {}
              as: RightsManager
              as_user_id: "u-rm-2"
          assert:
            - "The first attempt returns 403 with $.data.error_id == ERR_SEGREGATION_OF_DUTIES, not ERR_FORBIDDEN_ROLE."
            - "After the refusal RightsClearance.${c_id}.status is still SUBMITTED and cleared_by_user_id is null."
            - "The second attempt returns 200 and RightsClearance.${c_id}.status == CLEARED."
            - "RightsClearance.${c_id}.cleared_by_user_id == u-rm-2 while submitted_by_user_id is still u-rm-1."
            - "RightsClearance.${c_id}.screenings_remaining == 6 - clearing does not consume the allowance."

  # ==========================================================================
  - section: cross_cutting_complexity_layers
    instances:

      - name: stale_expected_booking_version_on_counter_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.booking-counter-stale-version
          - validations[priority=5]
          - errors[ERR_STALE_BOOKING_VERSION]
          - constants.MAX_NEGOTIATION_ROUNDS
        distinguishing_aspect: |
          The counter self-loop is exactly the operation a repeat call would otherwise succeed at, so the
          stale-version guard is the only thing that tells a caller its round was already superseded. The same
          version token is replayed after it has been consumed, and the negotiation log must show one new round,
          not two.
        test_recipe:
          setup:
            - "Canonical venue / distributor / title."
            - "A booking was created, so it is OFFERED with round_count 1, version 1 and one PENDING BookingOffer at round_index 1."
            - "The booking version is read once and held as ${b_v1}."
            - "A first counter using ${b_v1} succeeds, moving the booking to COUNTERED with round_count 2 and version 2, so ${b_v1} is now stale."
            - "MAX_NEGOTIATION_ROUNDS is 4, so a legitimate third round would still be permitted - only the stale token blocks it."
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "Reel Repertory", seat_capacity: 12, house_hold_seats: 4, trailer_reel_minutes: 12, turnaround_minutes: 25, min_useful_gap_minutes: 45, dcp_ingest_lane_count: 2, open_local_time: "11:00", last_start_local_time: "22:00", utc_offset_minutes: 0, max_first_run_share: 0.60, weekly_repertory_target: 3, supported_formats: ["DCP_2K", "DCP_4K"], base_house_nut_weekly_cents: 200000 }
              as: ExecutiveDirector
              captures: { v_id: $.data.id }
            - call: "POST /distributors"
              payload: { name: "Coyote Films", contact_email: "book@coyote.example", default_terms_variant: "SLIDING_SCALE_90_10", default_min_run_days: 4, default_distributor_share_pct: 0.35, requires_advance_guarantee: false }
              as: Programmer
              captures: { d_id: $.data.id }
            - call: "POST /titles"
              payload: { title_name: "La Jetee Redux", release_year: 1962, runtime_minutes: 104, is_first_run: false, native_format: "DCP_2K", rights_holder_distributor_id: "${d_id}" }
              as: Programmer
              captures: { t1_id: $.data.id }
            - call: "POST /bookings"
              payload: { title_id: "${t1_id}", distributor_id: "${d_id}", venue_id: "${v_id}", terms_variant: "SLIDING_SCALE_90_10", house_nut_cents: 12500, distributor_share_pct: 0.35, guarantee_cents: 3000, min_run_days: 4, engagement_start_date: "2026-08-10", engagement_end_date: "2026-08-20" }
              as: Programmer
              captures: { b_id: $.data.id }
            - call: "GET /bookings/${b_id}"
              payload: {}
              as: Programmer
              captures: { b_v1: $.data.version }
            - call: "POST /bookings/${b_id}/counter"
              payload: { expected_booking_version: "${b_v1}", proposed_house_nut_cents: 14000, proposed_distributor_share_pct: 0.40, proposed_min_run_days: 5, proposed_guarantee_cents: 4000 }
              as: Programmer
          trigger:
            - call: "POST /bookings/${b_id}/counter"
              payload: { expected_booking_version: "${b_v1}", proposed_house_nut_cents: 13000, proposed_distributor_share_pct: 0.38, proposed_min_run_days: 4, proposed_guarantee_cents: 3500 }
              as: Programmer
              captures: { err_id: $.data.error_id }
          assert:
            - "The response status is 412 and $.data.error_id == ERR_STALE_BOOKING_VERSION."
            - "Booking.${b_id}.round_count == 2 and version == 2 - the rejected call incremented neither."
            - "Booking.${b_id}.status is still COUNTERED."
            - "GET /bookings/${b_id}/offers returns exactly 2 rows: round_index 1 with outcome COUNTERED and round_index 2 with outcome PENDING and proposed_house_nut_cents 14000."
            - "No offer proposing 13000 exists anywhere in the log."
            - "Re-reading the booking and retrying the identical body with the fresh version succeeds, proving the payload itself was never the problem."

      - name: stale_expected_booking_version_on_settlement_creation_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.settlement-create-stale-booking
          - validations[priority=5]
          - errors[ERR_STALE_BOOKING_VERSION]
          - endpoints[POST /settlements]
        distinguishing_aspect: |
          A second DRAFT settlement on the same booking is legal by product semantics, so only the OCC token
          distinguishes a deliberate re-draft from a caller working off a superseded view of the closed
          engagement. Creating the first settlement itself bumps Booking.version, which is what makes the held
          token stale.
        test_recipe:
          setup:
            - "Canonical venue / distributor / title / CLEARED clearance / non-encrypted DCP asset."
            - "One showtime at 2026-08-14T12:00:00Z exists and the booking was then CLOSED, so actual_playing_days is 0 and min_run_penalty_cents is 6250."
            - "The booking version is read after the close and held as ${b_v1}."
            - "A first PROVISIONAL settlement created with ${b_v1} succeeds and increments Booking.version, so ${b_v1} is now stale."
          setup_api_calls:
            - call: "POST /venues"
              payload: { name: "Reel Repertory", seat_capacity: 12, house_hold_seats: 4, trailer_reel_minutes: 12, turnaround_minutes: 25, min_useful_gap_minutes: 45, dcp_ingest_lane_count: 2, open_local_time: "11:00", last_start_local_time: "22:00", utc_offset_minutes: 0, max_first_run_share: 0.60, weekly_repertory_target: 3, supported_formats: ["DCP_2K", "DCP_4K"], base_house_nut_weekly_cents: 200000 }
              as: ExecutiveDirector
              captures: { v_id: $.data.id }
            - call: "POST /distributors"
              payload: { name: "Coyote Films", contact_email: "book@coyote.example", default_terms_variant: "SLIDING_SCALE_90_10", default_min_run_days: 4, default_distributor_share_pct: 0.35, requires_advance_guarantee: false }
              as: Programmer
              captures: { d_id: $.data.id }
            - call: "POST /titles"
              payload: { title_name: "La Jetee Redux", release_year: 1962, runtime_minutes: 104, is_first_run: false, native_format: "DCP_2K", rights_holder_distributor_id: "${d_id}" }
              as: Programmer
              captures: { t1_id: $.data.id }
            - call: "POST /bookings"
              payload: { title_id: "${t1_id}", distributor_id: "${d_id}", venue_id: "${v_id}", terms_variant: "SLIDING_SCALE_90_10", house_nut_cents: 12500, distributor_share_pct: 0.35, guarantee_cents: 3000, min_run_days: 4, engagement_start_date: "2026-08-10", engagement_end_date: "2026-08-20" }
              as: Programmer
              captures: { b_id: $.data.id }
            - call: "POST /bookings/${b_id}/confirm"
              payload: {}
              as: ExecutiveDirector
              as_user_id: "u-ed-1"
            - call: "POST /clearances"
              payload: { title_id: "${t1_id}", booking_id: "${b_id}", licensor_name: "Cinematheque Nord", license_fee_cents: 45000, territory: "US-NY-METRO", window_start_date: "2026-08-10", window_end_date: "2026-08-20", max_screenings: 6, source_format: "DCP_2K" }
              as: RightsManager
              as_user_id: "u-rm-1"
              captures: { c_id: $.data.id }
            - call: "POST /clearances/${c_id}/clear"
              payload: {}
              as: RightsManager
              as_user_id: "u-rm-2"
            - call: "POST /dcp-assets"
              payload: { title_id: "${t1_id}", source_distributor_id: "${d_id}", venue_id: "${v_id}", format: "DCP_2K", is_encrypted: false, carrier_ref: "WB-77120", ingest_window_start_at: "2026-07-30T08:00:00Z", ingest_window_end_at: "2026-07-31T08:00:00Z" }
              as: TechnicalManager
              captures: { a_id: $.data.id }
            - call: "GET /clearances/${c_id}"
              payload: {}
              as: Programmer
              captures: { c_v1: $.data.version }
            - call: "POST /showtimes"
              payload: { venue_id: "${v_id}", title_id: "${t1_id}", booking_id: "${b_id}", clearance_id: "${c_id}", dcp_asset_id: "${a_id}", strand: "REPERTORY_SERIES", start_at: "2026-08-14T12:00:00Z", base_price_cents: 1450, public_sale_opens_at: "2026-08-01T00:00:00Z", format: "DCP_2K", expected_clearance_version: "${c_v1}" }
              as: Programmer
              captures: { sa_id: $.data.id }
            - call: "POST /bookings/${b_id}/close"
              payload: {}
              as: ExecutiveDirector
            - call: "GET /bookings/${b_id}"
              payload: {}
              as: BoxOfficeManager
              captures: { b_v1: $.data.version }
            - call: "POST /settlements"
              payload: { booking_id: "${b_id}", variant: "PROVISIONAL", expected_booking_version: "${b_v1}" }
              as: BoxOfficeManager
              captures: { st1_id: $.data.id }
          trigger:
            - call: "POST /settlements"
              payload: { booking_id: "${b_id}", variant: "FINAL", expected_booking_version: "${b_v1}" }
              as: BoxOfficeManager
              captures: { err_id: $.data.error_id }
          assert:
            - "The response status is 412 and $.data.error_id == ERR_STALE_BOOKING_VERSION."
            - "GET /settlements?booking_id=${b_id} returns exactly 1 row, ${st1_id}, with variant PROVISIONAL."
            - "Settlement.${st1_id}.status == DRAFT and min_run_penalty_cents == 6250, untouched by the rejected call."
            - "Booking.${b_id}.status is still CLOSED and its version did not advance a second time."
            - "Re-reading the booking version and reposting the identical FINAL body succeeds, creating a second settlement."

      - name: stale_expected_clearance_version_on_showtime_creation_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.showtime-create-stale-clearance
          - validations[priority=5]
          - errors[ERR_STALE_CLEARANCE_VERSION]
          - entities.RightsClearance.screenings_remaining
        distinguishing_aspect: |
          Multiple screenings legitimately draw down one licence, so a repeat POST /showtimes succeeds under
          natural semantics; the guard exists because the caller's screenings_remaining figure may predate
          another draw-down. Scheduling the first showtime bumps the clearance version, so the held token is
          stale on the second - and the allowance must not move.
        test_recipe:
          setup:
