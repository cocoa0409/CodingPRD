          - entities.BenchTest.fields.weighted_accuracy_pct
        distinguishing_aspect: |
          Mode (b) — nested rounding order pinned: per-flow accuracies rounded to
          2 dp BEFORE weighting. measured (1.8885, 20.0, 29.9865) -> flows 94.43 /
          100.00 / 99.96 -> weighted round(18.886 + 30.000 + 49.980) = 98.87.
          Weighting unrounded flows would give round(98.8625) = 98.86 — a different
          published value. Different mode from invoice_settlement_conditional_minmax.
