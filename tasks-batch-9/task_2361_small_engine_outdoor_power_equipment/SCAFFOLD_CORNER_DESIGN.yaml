# =============================================================================
# §1.9 Scaffold Corner Design — task_2361_small_engine_outdoor_power_equipment
#
# Breadth probe over §1.1-§1.7. Sections and claim_type values come verbatim
# from references/claim-extraction-guide.md; nothing is invented here.
#
# Canonical prelude. The first instance below (creation_walk_from_empty_db_
# covers_all_fourteen_entities) walks the whole creation surface from an empty
# database and, in doing so, defines the YAML anchors every later instance
# aliases. Anchors are document-scoped, so this file re-declares the same call
# objects the difficulty design file uses:
#
#   a_clock            logical clock -> 2026-08-03T08:00:00Z
#   a_fam .. a_certify family 2027-EPA-208SS DRAFT -> CERTIFIED (df 1.2800,
#                      certified 5.12 g/kWh, margin 36.00 under an 8.00 limit)
#   a_plat             platform 208SS (torque 22.0 Nm +/-5% over 4 fasteners,
#                      hot-test window [3200, 3600] rpm)
#   a_model .. a_model_release   WM-21-BBC WALK_MOWER DUAL, RELEASED
#   a_line             L1 RUNNING, 500 units/week, changeover_gap_weeks 1
#   a_sup_* / a_lot_* / a_inspect_*   SUP-CARB, SUP-IGN, SUP-CAST with one
#                      800-piece ACCEPTED lot each (NORMAL sample 40, Ac 4 /
#                      Ac 0 for the CRITICAL casting supplier)
#   a_mrun / a_mrun_close        CYLINDER_BORE run, cpk 2.1082, CLOSED
#   a_bo / a_bo_release          PRE_SEASON order, 6 units over 2 weeks from
#                      2026-09-14, carry 24 weeks, RELEASED
#   a_u1_*             unit SN-0001 staged -> torque -> hot test -> RELEASED
#   a_audit_schedule   audit for week 2026-09-14 (required_sample_size 2)
#   a_part1 / a_req1   service part PN-CARB-KIT-1 and one dealer request
# =============================================================================

scaffold_corner_design:

  # ===========================================================================
  # 1. From Table 1 (Entities)
  # ===========================================================================
  - section: entities
    instances:

      - name: creation_walk_from_empty_db_covers_all_fourteen_entities
        claim_type: creation
        grounds:
          - entities.CertificationFamily
          - entities.EnginePlatform
          - entities.DurabilityTestRun
          - entities.ProductModel
          - entities.SafetyCertification
          - entities.Supplier
          - entities.ComponentLot
          - entities.MachiningRun
          - entities.AssemblyLine
          - entities.BuildOrder
          - entities.EngineUnit
          - entities.ProductionLineAudit
          - entities.ServicePart
          - entities.PartsFulfillmentRequest
        distinguishing_aspect: |
          Every one of the 14 declared entities is creatable from an empty database
          through §1.5 alone, each landing in its declared initial_state with its
          declared success code — and the chain proves the dependency order is
          satisfiable (family before platform, certification before build-order release,
          CLOSED machining run and ACCEPTED lots before a unit).
        test_recipe:
          setup:
            - "Empty database; the logical clock is set to 2026-08-03T08:00:00Z as the only precondition."
          setup_api_calls:
            - &a_clock
              call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T08:00:00Z" }
              as: PlantAdmin
          trigger:
            - &a_fam
              call: "POST /certification-families"
              payload: { family_code: "2027-EPA-208SS", model_year: 2027, emission_standard: "EPA_PHASE3", displacement_min_cc: 190, displacement_max_cc: 224, durability_hours: 500, family_emission_limit_g_per_kwh: 8.00, declared_baseline_emission_g_per_kwh: 4.00 }
              as: CertificationEngineer
              as_user_id: "ce-hana"
              captures: { fam_id: $.data.id, fam_v1: $.data.version }
            - &a_plat
              call: "POST /engine-platforms"
              payload: { certification_family_id: "${fam_id}", platform_code: "208SS", displacement_cc: 208, torque_spec_nm: 22.0, torque_tolerance_pct: 0.05, required_fastener_count: 4, hot_test_min_rpm: 3200, hot_test_max_rpm: 3600 }
              as: PlantAdmin
              captures: { plat_id: $.data.id }
            - &a_dur
              call: "POST /durability-tests"
              payload: { certification_family_id: "${fam_id}", engine_platform_id: "${plat_id}", scheduled_start_at: "2026-08-03T09:00:00Z", scheduled_end_at: "2026-08-24T09:00:00Z", target_hours: 500, initial_emission_g_per_kwh: 5.00, expected_certification_family_version: "${fam_v1}" }
              as: CertificationEngineer
              as_user_id: "ce-hana"
              captures: { dur_id: $.data.id }
            - &a_dur_complete
              call: "POST /durability-tests/${dur_id}/complete"
              payload: { accumulated_hours: 500, final_emission_g_per_kwh: 6.40 }
              as: CertificationEngineer
              as_user_id: "ce-hana"
            - &a_submit
              call: "POST /certification-families/${fam_id}/submit"
              payload: {}
              as: CertificationEngineer
              as_user_id: "ce-hana"
            - &a_certify
              call: "POST /certification-families/${fam_id}/certify"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-ravi"
            - &a_model
              call: "POST /product-models"
              payload: { engine_platform_id: "${plat_id}", model_code: "WM-21-BBC", product_line: "WALK_MOWER", channel: "DUAL", blade_brake_type: "BLADE_BRAKE_CLUTCH", operator_presence_type: "BAIL", warranty_months: 36, standard_cost_cents: 21000, msrp_cents: 59900, dealer_share_pct: 0.55, dealer_cap_units: 500, mass_retail_cap_units: 500 }
              as: PlantAdmin
              captures: { model_id: $.data.id }
            - &a_safety
              call: "POST /safety-certifications"
              payload: { product_model_id: "${model_id}", standard_code: "ANSI_B71_1", blade_stop_time_ms: 2600, opc_stop_time_ms: 900, tested_on: "2026-07-15", expires_on: "2027-07-15" }
              as: ComplianceOfficer
              as_user_id: "co-ravi"
              captures: { cert_id: $.data.id }
            - &a_model_release
              call: "POST /product-models/${model_id}/release"
              payload: {}
              as: PlantAdmin
            - &a_line
              call: "POST /assembly-lines"
              payload: { line_code: "L1", supported_product_lines: ["WALK_MOWER", "SNOW_THROWER"], weekly_capacity_units: 500, changeover_gap_weeks: 1, status: "RUNNING" }
              as: PlantAdmin
              captures: { line_id: $.data.id }
            - &a_sup_carb
              call: "POST /suppliers"
              payload: { supplier_code: "SUP-CARB", name: "Carburetion Partners", component_category: "CARBURETOR" }
              as: PlantAdmin
              captures: { sup_carb_id: $.data.id }
            - &a_lot_carb
              call: "POST /component-lots"
              payload: { supplier_id: "${sup_carb_id}", lot_code: "CB-001", lot_quantity: 800 }
              as: QualityEngineer
              as_user_id: "qe-mika"
              captures: { lot_carb_id: $.data.id }
            - &a_inspect_carb_clean
              call: "POST /component-lots/${lot_carb_id}/inspect"
              payload: { defects_found: 0 }
              as: QualityEngineer
              as_user_id: "qe-mika"
            - &a_sup_ign
              call: "POST /suppliers"
              payload: { supplier_code: "SUP-IGN", name: "Ignition Systems Co", component_category: "IGNITION" }
              as: PlantAdmin
              captures: { sup_ign_id: $.data.id }
            - &a_lot_ign
              call: "POST /component-lots"
              payload: { supplier_id: "${sup_ign_id}", lot_code: "IG-001", lot_quantity: 800 }
              as: QualityEngineer
              as_user_id: "qe-mika"
              captures: { lot_ign_id: $.data.id }
            - &a_inspect_ign_clean
              call: "POST /component-lots/${lot_ign_id}/inspect"
              payload: { defects_found: 0 }
              as: QualityEngineer
              as_user_id: "qe-mika"
            - &a_sup_cast
              call: "POST /suppliers"
              payload: { supplier_code: "SUP-CAST", name: "Foundry Alliance", component_category: "CASTING" }
              as: PlantAdmin
              captures: { sup_cast_id: $.data.id }
            - &a_lot_cast
              call: "POST /component-lots"
              payload: { supplier_id: "${sup_cast_id}", lot_code: "CS-001", lot_quantity: 800 }
              as: QualityEngineer
              as_user_id: "qe-mika"
              captures: { lot_cast_id: $.data.id }
            - &a_inspect_cast_clean
              call: "POST /component-lots/${lot_cast_id}/inspect"
              payload: { defects_found: 0 }
              as: QualityEngineer
              as_user_id: "qe-mika"
            - &a_mrun
              call: "POST /machining-runs"
              payload: { engine_platform_id: "${plat_id}", casting_lot_id: "${lot_cast_id}", component_type: "CYLINDER_BORE", lsl_mm: 64.980, usl_mm: 65.020 }
              as: QualityEngineer
              as_user_id: "qe-mika"
              captures: { mrun_id: $.data.id }
            - &a_mrun_close
              call: "POST /machining-runs/${mrun_id}/close"
              payload: { measurements: [65.000, 65.002, 64.998, 65.004, 64.996] }
              as: QualityEngineer
              as_user_id: "qe-mika"
            - &a_bo
              call: "POST /build-orders"
              payload: { product_model_id: "${model_id}", assembly_line_id: "${line_id}", season: "PRE_SEASON", production_week: "2026-09-14", week_span: 2, planned_quantity: 6 }
              as: ProductionPlanner
              captures: { bo_id: $.data.id, bo_v1: $.data.version }
            - &a_bo_release
              call: "POST /build-orders/${bo_id}/release"
              payload: {}
              as: ProductionPlanner
            - &a_u1_stage
              call: "POST /engine-units"
              payload: { build_order_id: "${bo_id}", machining_run_id: "${mrun_id}", carburetor_lot_id: "${lot_carb_id}", ignition_lot_id: "${lot_ign_id}", serial_number: "SN-0001" }
              as: QualityEngineer
              as_user_id: "qe-mika"
              captures: { u1_id: $.data.id }
            - &a_u1_torque
              call: "POST /engine-units/${u1_id}/torque-record"
              payload: { torque_readings: [{ station: 1, torque_nm: 22.0 }, { station: 2, torque_nm: 22.1 }, { station: 3, torque_nm: 21.9 }, { station: 4, torque_nm: 22.2 }] }
              as: QualityEngineer
              as_user_id: "qe-mika"
            - &a_u1_hot
              call: "POST /engine-units/${u1_id}/hot-test"
              payload: { measured_rpm: 3400, measured_emission_g_per_kwh: 5.60 }
              as: QualityEngineer
              as_user_id: "qe-mika"
            - &a_u1_release
              call: "POST /engine-units/${u1_id}/release"
              payload: {}
              as: QualityEngineer
              as_user_id: "qe-mika"
            - &a_audit_schedule
              call: "POST /build-orders/${bo_id}/line-audits"
              payload: { audit_week: "2026-09-14" }
              as: ComplianceOfficer
              as_user_id: "co-ravi"
              captures: { audit_id: $.data.id }
            - &a_part1
              call: "POST /service-parts"
              payload: { engine_platform_id: "${plat_id}", part_number: "PN-CARB-KIT-1", category: "CARBURETOR_KIT", on_hand_qty: 5, committed_availability_years: 10, last_production_year: 2027, dealer_lead_time_days: 2, mass_retail_lead_time_days: 5 }
              as: PlantAdmin
              captures: { part1_id: $.data.id }
            - &a_req1
              call: "POST /parts-requests"
              payload: { service_part_id: "${part1_id}", requested_quantity: 1, channel: "DEALER" }
              as: ChannelPartner
              as_user_id: "cp-dealer-77"
              captures: { req1_id: $.data.id }
          assert:
            - "every POST above answers 201 with the envelope meta.api_request_id / meta.api_request_timestamp and response_type == object"
            - "CertificationFamily.${fam_id}.status == CERTIFIED with deterioration_factor == 1.2800, certified_emission_g_per_kwh == 5.12, compliance_margin_pct == 36.00, cumulative_audit_failures == 0"
            - "EnginePlatform.${plat_id}.certification_posture == OPEN"
            - "DurabilityTestRun.${dur_id}.status == COMPLETED with computed_deterioration_factor == 1.2800 and extrapolated == false"
            - "ProductModel.${model_id}.status == RELEASED and SafetyCertification.${cert_id}.result == PASSED"
            - "AssemblyLine.${line_id}.status == RUNNING; Supplier.${sup_carb_id}.approval_status == APPROVED with incoming_inspection_level == NORMAL"
            - "ComponentLot.${lot_carb_id}.status == ACCEPTED with sample_size == 40, acceptance_number == 4, accepted_qty == 800; ComponentLot.${lot_cast_id}.acceptance_number == 0 (CRITICAL casting supplier)"
            - "MachiningRun.${mrun_id}.status == CLOSED with cpk == 2.1082"
            - "BuildOrder.${bo_id}.status == IN_PRODUCTION with carry_weeks == 24, carry_rate == 0.0040, carry_cost_cents == 12096, total_committed_cents == 138096, built_quantity == 1"
            - "EngineUnit.${u1_id}.build_state == RELEASED with conformance_state == CONFORMING"
            - "ProductionLineAudit.${audit_id}.status == SCHEDULED with required_sample_size == 2"
            - "ServicePart.${part1_id}.status == ACTIVE with commitment_expires_year == 2037 and on_hand_qty == 4 after the request"
            - "PartsFulfillmentRequest.${req1_id}.status == FILLED with promised_ship_date == 2026-08-05 and requester_user_id == cp-dealer-77"

      - name: retrieval_returns_the_stored_platform_and_family_rows
        claim_type: retrieval
        grounds:
          - endpoints[GET /engine-platforms/{id}]
          - endpoints[GET /certification-families/{id}]
          - entities.EnginePlatform.fields.certification_posture
        distinguishing_aspect: |
          A GET by id returns exactly the stored row — every input field echoed as
          written plus the computed/system fields — for two entities whose creation
          payloads differ in shape, and the read is side-effect free (a second read
          returns an identical version).
        test_recipe:
          setup:
            - "Clock 2026-08-03T08:00:00Z; family 2027-EPA-208SS in DRAFT with platform 208SS."
          setup_api_calls:
            - *a_clock
            - *a_fam
            - *a_plat
          trigger:
            - call: "GET /engine-platforms/${plat_id}"
              payload: {}
              as: QualityEngineer
              captures: { plat_v_read: $.data.version }
            - call: "GET /certification-families/${fam_id}"
              payload: {}
              as: QualityEngineer
              captures: { fam_v_read: $.data.version }
            - call: "GET /engine-platforms/${plat_id}"
              payload: {}
              as: ProductionPlanner
          assert:
            - "the platform read returns platform_code == 208SS, displacement_cc == 208, torque_spec_nm == 22.0, torque_tolerance_pct == 0.05, required_fastener_count == 4, hot_test_min_rpm == 3200, hot_test_max_rpm == 3600, certification_family_id == ${fam_id}"
            - "the platform read returns certification_posture == PENDING (projected from the DRAFT family, not stored independently)"
            - "the family read returns family_code == 2027-EPA-208SS, model_year == 2027, emission_standard == EPA_PHASE3, declared_baseline_emission_g_per_kwh == 4.00, deterioration_factor == null, certified_emission_g_per_kwh == null"
            - "both reads carry response_type == object and non-null meta.api_request_id"
            - "the second platform read returns the same version ${plat_v_read} — GET mutates nothing"

      - name: listing_pagination_reports_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints[GET /component-lots]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: |
          A three-row collection paginated at limit 2 returns 2 rows with
          total_count 3 and has_more true, then 1 row with has_more false at offset 2 —
          total_count counts the filtered set, not the page, and the supplier_id filter
          composes with the window.
        test_recipe:
          setup:
            - "Clock 2026-08-03T08:00:00Z; supplier SUP-CARB with three RECEIVED lots CB-001 (800), CB-003 (400) and CB-004 (200); supplier SUP-IGN with one lot IG-001 (800)."
          setup_api_calls:
            - *a_clock
            - *a_sup_carb
            - *a_lot_carb
            - call: "POST /component-lots"
              payload: { supplier_id: "${sup_carb_id}", lot_code: "CB-003", lot_quantity: 400 }
              as: QualityEngineer
              as_user_id: "qe-mika"
              captures: { lot_carb3_id: $.data.id }
            - call: "POST /component-lots"
              payload: { supplier_id: "${sup_carb_id}", lot_code: "CB-004", lot_quantity: 200 }
              as: QualityEngineer
              as_user_id: "qe-mika"
              captures: { lot_carb4_id: $.data.id }
            - *a_sup_ign
            - *a_lot_ign
          trigger:
            - call: "GET /component-lots?supplier_id=${sup_carb_id}&limit=2&offset=0"
              payload: { supplier_id: "${sup_carb_id}", limit: 2, offset: 0 }
              as: QualityEngineer
            - call: "GET /component-lots?supplier_id=${sup_carb_id}&limit=2&offset=2"
              payload: { supplier_id: "${sup_carb_id}", limit: 2, offset: 2 }
              as: QualityEngineer
            - call: "GET /component-lots"
              payload: {}
              as: QualityEngineer
          assert:
            - "the first page carries response_type == array, limit == 2, offset == 0, total_count == 3, has_more == true and exactly 2 rows"
            - "the second page carries limit == 2, offset == 2, total_count == 3, has_more == false and exactly 1 row"
            - "the first page rows are ordered created_at ASC, so data[0].id == ${lot_carb_id} (CB-001) and data[1].id == ${lot_carb3_id} (CB-003)"
            - "the unfiltered, unpaginated read applies the declared defaults limit == 10 and offset == 0, reporting total_count == 4 and has_more == false (the SUP-IGN lot is included)"
            - "ComponentLot.${lot_carb3_id}.sample_size == 20 and ComponentLot.${lot_carb4_id}.sample_size == 10 (NORMAL 5% of 400 and of 200)"

      - name: nonexistent_ids_return_not_found
        claim_type: not_found
        grounds:
          - validations[priority=4]
          - validations[priority=5]
          - validations[priority=6]
          - validations[priority=7]
          - validations[priority=8]
          - validations[priority=9]
          - validations[priority=10]
          - validations[priority=11]
          - validations[priority=12]
          - validations[priority=13]
          - validations[priority=14]
          - validations[priority=15]
        distinguishing_aspect: |
          Each of the twelve existence rules (priorities 4-15) answers 404 with its own
          error_id when the referenced row is absent, whether the id arrives in the path
          or in the body — one call per rule, all against a live database that holds a
          real model and line so nothing else can mask the existence check.
        test_recipe:
          setup:
            - "Clock 2026-08-03T08:00:00Z with a RELEASED model WM-21-BBC on platform 208SS and line L1 RUNNING, so body-FK existence checks are the only failing condition."
          setup_api_calls:
            - *a_clock
            - *a_fam
            - *a_plat
            - *a_model
            - *a_safety
            - *a_model_release
            - *a_line
          trigger:
            - call: "GET /certification-families/11111111-1111-1111-1111-111111111111"
              payload: {}
              as: CertificationEngineer
            - call: "GET /engine-platforms/22222222-2222-2222-2222-222222222222"
              payload: {}
              as: PlantAdmin
            - call: "GET /durability-tests/33333333-3333-3333-3333-333333333333"
              payload: {}
              as: CertificationEngineer
            - call: "GET /product-models/44444444-4444-4444-4444-444444444444"
              payload: {}
              as: PlantAdmin
            - call: "GET /suppliers/55555555-5555-5555-5555-555555555555/scorecard"
              payload: {}
              as: QualityEngineer
            - call: "GET /component-lots/66666666-6666-6666-6666-666666666666"
              payload: {}
              as: QualityEngineer
            - call: "GET /machining-runs/77777777-7777-7777-7777-777777777777"
              payload: {}
              as: QualityEngineer
            - call: "POST /build-orders"
              payload: { product_model_id: "${model_id}", assembly_line_id: "88888888-8888-8888-8888-888888888888", season: "PRE_SEASON", production_week: "2026-09-14", week_span: 1, planned_quantity: 4 }
              as: ProductionPlanner
            - call: "GET /build-orders/99999999-9999-9999-9999-999999999999"
              payload: {}
              as: ProductionPlanner
            - call: "GET /engine-units/aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa"
              payload: {}
              as: QualityEngineer
            - call: "POST /line-audits/bbbbbbbb-bbbb-bbbb-bbbb-bbbbbbbbbbbb/record"
              payload: { units_tested: 2, units_failed: 0, max_measured_emission_g_per_kwh: 5.60 }
              as: ComplianceOfficer
              as_user_id: "co-ravi"
            - call: "GET /service-parts/cccccccc-cccc-cccc-cccc-cccccccccccc"
              payload: {}
              as: ChannelPartner
              as_user_id: "cp-dealer-77"
          assert:
            - "call 1 -> 404 ERR_CERTIFICATION_FAMILY_NOT_FOUND; call 2 -> 404 ERR_ENGINE_PLATFORM_NOT_FOUND; call 3 -> 404 ERR_DURABILITY_TEST_NOT_FOUND"
            - "call 4 -> 404 ERR_PRODUCT_MODEL_NOT_FOUND; call 5 -> 404 ERR_SUPPLIER_NOT_FOUND; call 6 -> 404 ERR_COMPONENT_LOT_NOT_FOUND"
            - "call 7 -> 404 ERR_MACHINING_RUN_NOT_FOUND; call 8 -> 404 ERR_ASSEMBLY_LINE_NOT_FOUND (a body FK, with a valid product_model_id)"
            - "call 9 -> 404 ERR_BUILD_ORDER_NOT_FOUND; call 10 -> 404 ERR_ENGINE_UNIT_NOT_FOUND; call 11 -> 404 ERR_LINE_AUDIT_NOT_FOUND; call 12 -> 404 ERR_SERVICE_PART_NOT_FOUND"
            - "every one of the twelve responses carries response_type == error with a non-empty data.message and no row is created"

      - name: missing_required_body_fields_return_invalid_request
        claim_type: required_fields
        grounds:
          - validations[priority=3]
          - errors[ERR_INVALID_REQUEST]
          - endpoints[POST /certification-families]
          - endpoints[POST /component-lots]
        distinguishing_aspect: |
          Priority 3 rejects a body that omits any field §1.5 declares required, and it
          does so BEFORE any existence or state rule can run: the lot call omits
          lot_quantity while also naming a live supplier, and the durability call omits
          expected_certification_family_version while naming a live family, yet both
          answer 400 ERR_INVALID_REQUEST rather than 404 or 412.
        test_recipe:
          setup:
            - "Clock 2026-08-03T08:00:00Z; family 2027-EPA-208SS in DRAFT with platform 208SS; supplier SUP-CARB APPROVED."
          setup_api_calls:
            - *a_clock
            - *a_fam
            - *a_plat
            - *a_sup_carb
          trigger:
            - call: "POST /certification-families"
              payload: { model_year: 2027, emission_standard: "EPA_PHASE3", displacement_min_cc: 190, displacement_max_cc: 224, durability_hours: 500, family_emission_limit_g_per_kwh: 8.00, declared_baseline_emission_g_per_kwh: 4.00 }
              as: CertificationEngineer
              as_user_id: "ce-hana"
            - call: "POST /component-lots"
              payload: { supplier_id: "${sup_carb_id}", lot_code: "CB-009" }
              as: QualityEngineer
              as_user_id: "qe-mika"
            - call: "POST /durability-tests"
              payload: { certification_family_id: "${fam_id}", engine_platform_id: "${plat_id}", scheduled_start_at: "2026-08-03T09:00:00Z", scheduled_end_at: "2026-08-24T09:00:00Z", target_hours: 500, initial_emission_g_per_kwh: 5.00 }
              as: CertificationEngineer
              as_user_id: "ce-hana"
            - call: "POST /engine-units"
              payload: { build_order_id: "11111111-1111-1111-1111-111111111111", machining_run_id: "22222222-2222-2222-2222-222222222222", carburetor_lot_id: "33333333-3333-3333-3333-333333333333", ignition_lot_id: "44444444-4444-4444-4444-444444444444" }
              as: QualityEngineer
              as_user_id: "qe-mika"
          assert:
            - "the family call (no family_code) -> 400 ERR_INVALID_REQUEST"
            - "the lot call (no lot_quantity) -> 400 ERR_INVALID_REQUEST even though supplier_id resolves"
            - "the durability call (no expected_certification_family_version) -> 400 ERR_INVALID_REQUEST, not 412 ERR_STALE_FAMILY_VERSION"
            - "the engine-unit call (no serial_number) -> 400 ERR_INVALID_REQUEST, not 404 — priority 3 outranks the existence block even with four dead FKs"
            - "GET /certification-families?limit=10 still reports total_count == 1 and GET /component-lots reports total_count == 0"

      - name: omitted_optional_fields_take_declared_defaults
        claim_type: defaults
        grounds:
          - entities.AssemblyLine.fields.changeover_gap_weeks
          - entities.AssemblyLine.fields.status
          - entities.ServicePart.fields.dealer_lead_time_days
          - entities.ServicePart.fields.mass_retail_lead_time_days
        distinguishing_aspect: |
          Omitting the four optional inputs yields exactly the declared defaults —
          changeover_gap_weeks 1, status RUNNING, dealer lead 2 days, mass-retail lead
          5 days — and those defaults are observable downstream: a MASS_RETAIL request
          against the defaulted part is promised at clock + 5 days.
        test_recipe:
          setup:
            - "Clock 2026-08-03T08:00:00Z; family 2027-EPA-208SS with platform 208SS."
          setup_api_calls:
            - *a_clock
            - *a_fam
            - *a_plat
          trigger:
            - call: "POST /assembly-lines"
              payload: { line_code: "L-DEFAULTS", supported_product_lines: ["GENERATOR"], weekly_capacity_units: 250 }
              as: PlantAdmin
              captures: { line_def_id: $.data.id }
            - call: "POST /service-parts"
              payload: { engine_platform_id: "${plat_id}", part_number: "PN-FILTER-DEF", category: "FILTER_KIT", on_hand_qty: 4, committed_availability_years: 7, last_production_year: 2027 }
              as: PlantAdmin
              captures: { part_def_id: $.data.id }
            - call: "POST /parts-requests"
              payload: { service_part_id: "${part_def_id}", requested_quantity: 1, channel: "MASS_RETAIL" }
              as: ChannelPartner
              as_user_id: "cp-mass-12"
              captures: { req_def_id: $.data.id }
          assert:
            - "AssemblyLine.${line_def_id}.changeover_gap_weeks == 1 and status == RUNNING"
            - "ServicePart.${part_def_id}.dealer_lead_time_days == 2 and mass_retail_lead_time_days == 5"
            - "ServicePart.${part_def_id}.commitment_expires_year == 2034 (2027 + 7) and status == ACTIVE"
            - "PartsFulfillmentRequest.${req_def_id}.status == FILLED with promised_ship_date == 2026-08-08 — the defaulted 5-day mass-retail lead, not the 2-day dealer lead"
            - "ServicePart.${part_def_id}.on_hand_qty == 3 and fill_rate_pct == 100.00"

      - name: computed_and_system_fields_client_input_ignored
        claim_type: computed_fields
        grounds:
          - entities.CertificationFamily.fields.deterioration_factor
          - entities.ComponentLot.fields.sample_size
          - entities.ComponentLot.fields.status
          - entities.ServicePart.fields.commitment_expires_year
        distinguishing_aspect: |
          Computed and system fields are never client-writable: supplying
          deterioration_factor / status / sample_size / commitment_expires_year in the
          creation bodies leaves each field at its computed or default value, and none of
          the smuggled numbers appears anywhere in the response.
        test_recipe:
          setup:
            - "Clock 2026-08-03T08:00:00Z; supplier SUP-CARB APPROVED at NORMAL."
          setup_api_calls:
            - *a_clock
            - *a_sup_carb
          trigger:
            - call: "POST /certification-families"
              payload: { family_code: "2027-EPA-INPUT", model_year: 2027, emission_standard: "EPA_PHASE3", displacement_min_cc: 190, displacement_max_cc: 224, durability_hours: 500, family_emission_limit_g_per_kwh: 8.00, declared_baseline_emission_g_per_kwh: 4.00, deterioration_factor: 1.0000, status: "CERTIFIED", version: 99 }
              as: CertificationEngineer
              as_user_id: "ce-hana"
              captures: { fam_input_id: $.data.id }
            - call: "POST /component-lots"
              payload: { supplier_id: "${sup_carb_id}", lot_code: "CB-INPUT", lot_quantity: 800, sample_size: 1, acceptance_number: 99, status: "ACCEPTED", accepted_qty: 800 }
              as: QualityEngineer
              as_user_id: "qe-mika"
              captures: { lot_input_id: $.data.id }
          assert:
            - "CertificationFamily.${fam_input_id}.status == DRAFT (the smuggled CERTIFIED is ignored) with deterioration_factor == null and version == 1"
            - "CertificationFamily.${fam_input_id}.certified_emission_g_per_kwh == null and compliance_margin_pct == null and submitted_by_user_id == null"
            - "ComponentLot.${lot_input_id}.status == RECEIVED with sample_size == 40 and acceptance_number == 4 (recomputed from lot_sample_plan, not from the body)"
            - "ComponentLot.${lot_input_id}.accepted_qty == 0, consumed_qty == 0, remaining_qty == 0 and deviation_flag == false"
            - "ComponentLot.${lot_input_id}.id is a server-minted value different from any value in the request body, and created_at / updated_at are server timestamps"

      - name: safety_certification_is_immutable_and_versionless
        claim_type: immutability
        grounds:
          - entities.SafetyCertification
          - endpoints[POST /safety-certifications]
          - endpoints[GET /product-models/{id}/safety-certifications]
          - calculations.safety_certification_result
        distinguishing_aspect: |
          SafetyCertification declares common_fields false: §1.5 offers no update or
          delete route for it, its rows carry no version field, and a correction is
          expressed by APPENDING a newer certification — the model's release decision then
          reads the latest row by tested_on DESC, leaving the older row untouched.
        test_recipe:
          setup:
            - "Clock 2026-08-03T08:00:00Z; model WM-21-BBC in DRAFT on platform 208SS."
            - "A first FAILED certification tested 2026-06-01 (blade stop 3200 ms exceeds the 3000 ms bound) followed by a PASSED certification tested 2026-07-15."
          setup_api_calls:
            - *a_clock
            - *a_fam
            - *a_plat
            - *a_model
            - call: "POST /safety-certifications"
              payload: { product_model_id: "${model_id}", standard_code: "ANSI_B71_1", blade_stop_time_ms: 3200, opc_stop_time_ms: 900, tested_on: "2026-06-01", expires_on: "2027-06-01" }
              as: ComplianceOfficer
              as_user_id: "co-ravi"
              captures: { cert_failed_id: $.data.id }
            - *a_safety
          trigger:
            - call: "GET /product-models/${model_id}/safety-certifications"
              payload: { limit: 10, offset: 0 }
              as: ComplianceOfficer
              as_user_id: "co-ravi"
            - *a_model_release
          assert:
            - "the listing returns total_count == 2 and neither row carries a version field (common_fields false)"
            - "SafetyCertification.${cert_failed_id}.result == FAILED (blade_stop_time_ms 3200 > MAX_BLADE_STOP_MS 3000) and is still readable, unchanged, after the second row is appended"
            - "SafetyCertification.${cert_id}.result == PASSED with blade_stop_time_ms == 2600 and opc_stop_time_ms == 900"
            - "§1.5 declares no PATCH, PUT or DELETE route for /safety-certifications — the only mutation is an append"
            - "ProductModel.${model_id}.status == RELEASED: release selected the 2026-07-15 PASSED row, so the earlier FAILED row does not block it"
            - "both rows expose tested_by_user_id == co-ravi"

      - name: unknown_enum_members_and_out_of_range_numbers_are_rejected
        claim_type: type_constraints
        grounds:
          - validations[priority=3]
          - entities.ProductModel.fields.product_line
          - entities.CertificationFamily.fields.model_year
          - entities.AssemblyLine.fields.changeover_gap_weeks
        distinguishing_aspect: |
          Priority 3 closes every declared enum and numeric range: an unknown
          product_line member, a model_year outside 2026..2035, a changeover_gap_weeks
          above 4, a pagination limit above 100 and a reversed date pair each answer
          400 ERR_INVALID_REQUEST, so no unknown token can reach the state machines.
        test_recipe:
          setup:
            - "Clock 2026-08-03T08:00:00Z; family 2027-EPA-208SS with platform 208SS."
          setup_api_calls:
            - *a_clock
            - *a_fam
            - *a_plat
          trigger:
            - call: "POST /product-models"
              payload: { engine_platform_id: "${plat_id}", model_code: "XX-BAD-LINE", product_line: "TRACTOR", channel: "DUAL", blade_brake_type: "BLADE_BRAKE_CLUTCH", operator_presence_type: "BAIL", warranty_months: 36, standard_cost_cents: 21000, msrp_cents: 59900, dealer_share_pct: 0.55, dealer_cap_units: 500, mass_retail_cap_units: 500 }
              as: PlantAdmin
            - call: "POST /certification-families"
              payload: { family_code: "2040-EPA-BAD", model_year: 2040, emission_standard: "EPA_PHASE3", displacement_min_cc: 190, displacement_max_cc: 224, durability_hours: 500, family_emission_limit_g_per_kwh: 8.00, declared_baseline_emission_g_per_kwh: 4.00 }
              as: CertificationEngineer
              as_user_id: "ce-hana"
            - call: "POST /assembly-lines"
              payload: { line_code: "L-BAD-GAP", supported_product_lines: ["WALK_MOWER"], weekly_capacity_units: 500, changeover_gap_weeks: 7 }
              as: PlantAdmin
            - call: "GET /component-lots"
              payload: { limit: 101, offset: 0 }
              as: QualityEngineer
            - call: "POST /engine-platforms"
              payload: { certification_family_id: "${fam_id}", platform_code: "208-REV", displacement_cc: 208, torque_spec_nm: 22.0, torque_tolerance_pct: 0.05, required_fastener_count: 4, hot_test_min_rpm: 3600, hot_test_max_rpm: 3200 }
              as: PlantAdmin
          assert:
            - "the unknown product_line TRACTOR -> 400 ERR_INVALID_REQUEST and no ProductModel row is created"
            - "model_year 2040 -> 400 ERR_INVALID_REQUEST (declared range 2026..2035)"
            - "changeover_gap_weeks 7 -> 400 ERR_INVALID_REQUEST (declared range 0..4)"
            - "limit 101 -> 400 ERR_INVALID_REQUEST (pagination max 100)"
            - "hot_test_min_rpm 3600 with hot_test_max_rpm 3200 -> 400 ERR_INVALID_REQUEST (the window must be increasing)"
            - "GET /engine-platforms?certification_family_id=${fam_id} still reports total_count == 1"

      - name: platform_displacement_outside_the_family_window_rejected
        claim_type: parent_relationships
        grounds:
          - validations[priority=46]
          - errors[ERR_DISPLACEMENT_OUT_OF_FAMILY]
          - entities.EnginePlatform.fields.displacement_cc
        distinguishing_aspect: |
          A child EnginePlatform must sit inside its parent family's declared
          displacement window: 250 cc against a 190..224 cc family answers 422
          ERR_DISPLACEMENT_OUT_OF_FAMILY, while both inclusive edges (190 and 224) are
          accepted — the parent link is a value constraint, not merely an FK.
        test_recipe:
          setup:
            - "Clock 2026-08-03T08:00:00Z; family 2027-EPA-208SS declares displacement_min_cc 190 and displacement_max_cc 224."
          setup_api_calls:
            - *a_clock
            - *a_fam
          trigger:
            - call: "POST /engine-platforms"
              payload: { certification_family_id: "${fam_id}", platform_code: "250XX", displacement_cc: 250, torque_spec_nm: 22.0, torque_tolerance_pct: 0.05, required_fastener_count: 4, hot_test_min_rpm: 3200, hot_test_max_rpm: 3600 }
              as: PlantAdmin
            - call: "POST /engine-platforms"
              payload: { certification_family_id: "${fam_id}", platform_code: "190LO", displacement_cc: 190, torque_spec_nm: 20.0, torque_tolerance_pct: 0.05, required_fastener_count: 4, hot_test_min_rpm: 3200, hot_test_max_rpm: 3600 }
              as: PlantAdmin
              captures: { plat_low_id: $.data.id }
            - call: "POST /engine-platforms"
              payload: { certification_family_id: "${fam_id}", platform_code: "224HI", displacement_cc: 224, torque_spec_nm: 24.0, torque_tolerance_pct: 0.05, required_fastener_count: 4, hot_test_min_rpm: 3200, hot_test_max_rpm: 3600 }
              as: PlantAdmin
              captures: { plat_high_id: $.data.id }
          assert:
            - "the 250 cc platform -> 422 ERR_DISPLACEMENT_OUT_OF_FAMILY"
            - "EnginePlatform.${plat_low_id}.displacement_cc == 190 and EnginePlatform.${plat_high_id}.displacement_cc == 224 — both window edges are inclusive"
            - "both accepted platforms read certification_posture == PENDING (the family is DRAFT)"
            - "GET /certification-families/${fam_id}/engine-platforms reports total_count == 2"

      - name: graph_topology_cross_reference_scoping_across_two_families
        claim_type: entity_topology_graph
        grounds:
          - complexity_profile.entity_topology
          - endpoints[GET /certification-families/{id}/engine-platforms]
          - endpoints[GET /engine-platforms/{id}/product-models]
          - validations[priority=44]
        distinguishing_aspect: |
          With two families each owning a platform, every scoped listing returns only its
          own subtree and the cross-aggregate coherence rule bites: a durability run that
          pairs family A with family B's platform answers 409 ERR_PLATFORM_MISMATCH even
          though both ids exist — graph topology is enforced by value, not just by FK
          presence.
        test_recipe:
          setup:
            - "Clock 2026-08-03T08:00:00Z; family A 2027-EPA-208SS with platform 208SS, plus family B 2027-CARB-190 (CARB_2024, 180..200 cc) with platform 190CB."
            - "Model WM-21-BBC hangs off platform 208SS only."
          setup_api_calls:
            - *a_clock
            - *a_fam
            - *a_plat
            - *a_model
            - call: "POST /certification-families"
              payload: { family_code: "2027-CARB-190", model_year: 2027, emission_standard: "CARB_2024", displacement_min_cc: 180, displacement_max_cc: 200, durability_hours: 500, family_emission_limit_g_per_kwh: 8.00, declared_baseline_emission_g_per_kwh: 4.00 }
              as: CertificationEngineer
              as_user_id: "ce-hana"
              captures: { fam_b_id: $.data.id, fam_b_v1: $.data.version }
            - call: "POST /engine-platforms"
              payload: { certification_family_id: "${fam_b_id}", platform_code: "190CB", displacement_cc: 190, torque_spec_nm: 20.0, torque_tolerance_pct: 0.05, required_fastener_count: 4, hot_test_min_rpm: 3100, hot_test_max_rpm: 3500 }
              as: PlantAdmin
              captures: { plat_b_id: $.data.id }
          trigger:
            - call: "GET /certification-families/${fam_id}/engine-platforms"
              payload: { limit: 10, offset: 0 }
              as: CertificationEngineer
            - call: "GET /engine-platforms/${plat_b_id}/product-models"
              payload: { limit: 10, offset: 0 }
              as: PlantAdmin
            - call: "POST /durability-tests"
              payload: { certification_family_id: "${fam_id}", engine_platform_id: "${plat_b_id}", scheduled_start_at: "2026-08-03T09:00:00Z", scheduled_end_at: "2026-08-24T09:00:00Z", target_hours: 500, initial_emission_g_per_kwh: 5.00, expected_certification_family_version: "${fam_v1}" }
              as: CertificationEngineer
              as_user_id: "ce-hana"
          assert:
            - "GET /certification-families/${fam_id}/engine-platforms returns total_count == 1 and only ${plat_id} — family B's platform is not listed"
            - "GET /engine-platforms/${plat_b_id}/product-models returns total_count == 0 and has_more == false — the model belongs to platform 208SS"
            - "the cross-family durability create -> 409 ERR_PLATFORM_MISMATCH (priority 44), even though both ids resolve"
            - "CertificationFamily.${fam_id}.status == DRAFT and version == ${fam_v1} — the rejected call neither started a run nor bumped the version"
            - "GET /durability-tests?engine_platform_id=${plat_b_id} reports total_count == 0"

  # ===========================================================================
  # 2. From Table 2 (State Machines)
  # ===========================================================================
  - section: state_machines
    instances:

      - name: initial_state_of_all_twelve_state_machines_on_creation
        claim_type: initial_state
        grounds:
          - state_machines[CertificationFamily].initial_state
          - state_machines[EnginePlatform].initial_state
          - state_machines[DurabilityTestRun].initial_state
          - state_machines[ProductModel].initial_state
          - state_machines[Supplier].initial_state
          - state_machines[ComponentLot].initial_state
          - state_machines[MachiningRun].initial_state
          - state_machines[BuildOrder].initial_state
          - state_machines[EngineUnit].initial_state
          - state_machines[ProductionLineAudit].initial_state
          - state_machines[ServicePart].initial_state
          - state_machines[PartsFulfillmentRequest].initial_state
        distinguishing_aspect: |
          Twelve declared state machines, twelve declared initial states, all observed on
          the creating response — including the two that are easy to get wrong:
          EnginePlatform is born PENDING because its posture is projected from a DRAFT
          family, and PartsFulfillmentRequest is born BACKORDERED whenever stock cannot
          cover the line (only a covered request short-circuits to FILLED).
        test_recipe:
          setup:
            - "Clock 2026-08-03T08:00:00Z; the certified 208SS prelude through the released model WM-21-BBC, line L1 and the three accepted supplier lots with a CLOSED machining run."
          setup_api_calls:
            - *a_clock
            - *a_fam
            - *a_plat
            - *a_dur
            - *a_dur_complete
            - *a_submit
            - *a_certify
            - *a_model
            - *a_safety
            - *a_model_release
            - *a_line
            - *a_sup_carb
            - *a_lot_carb
            - *a_inspect_carb_clean
            - *a_sup_ign
            - *a_lot_ign
            - *a_inspect_ign_clean
            - *a_sup_cast
            - *a_lot_cast
            - *a_inspect_cast_clean
            - *a_mrun
            - *a_mrun_close
          trigger:
            - call: "POST /certification-families"
              payload: { family_code: "2027-EPA-INIT", model_year: 2027, emission_standard: "EPA_PHASE3", displacement_min_cc: 190, displacement_max_cc: 224, durability_hours: 500, family_emission_limit_g_per_kwh: 8.00, declared_baseline_emission_g_per_kwh: 4.00 }
              as: CertificationEngineer
              as_user_id: "ce-hana"
              captures: { fam_init_id: $.data.id, fam_init_v1: $.data.version }
            - call: "POST /engine-platforms"
              payload: { certification_family_id: "${fam_init_id}", platform_code: "200INIT", displacement_cc: 200, torque_spec_nm: 21.0, torque_tolerance_pct: 0.05, required_fastener_count: 4, hot_test_min_rpm: 3200, hot_test_max_rpm: 3600 }
              as: PlantAdmin
              captures: { plat_init_id: $.data.id }
            - call: "POST /durability-tests"
              payload: { certification_family_id: "${fam_init_id}", engine_platform_id: "${plat_init_id}", scheduled_start_at: "2026-08-03T09:00:00Z", scheduled_end_at: "2026-08-24T09:00:00Z", target_hours: 500, initial_emission_g_per_kwh: 5.00, expected_certification_family_version: "${fam_init_v1}" }
              as: CertificationEngineer
              as_user_id: "ce-hana"
              captures: { dur_init_id: $.data.id }
            - call: "POST /product-models"
              payload: { engine_platform_id: "${plat_init_id}", model_code: "WM-21-INIT", product_line: "WALK_MOWER", channel: "DEALER", blade_brake_type: "BLADE_BRAKE_CLUTCH", operator_presence_type: "BAIL", warranty_months: 36, standard_cost_cents: 21000, msrp_cents: 59900, dealer_share_pct: 1.00, dealer_cap_units: 500, mass_retail_cap_units: 0 }
              as: PlantAdmin
              captures: { model_init_id: $.data.id }
            - call: "POST /suppliers"
              payload: { supplier_code: "SUP-INIT", name: "Init Components", component_category: "CARBURETOR" }
              as: PlantAdmin
              captures: { sup_init_id: $.data.id }
            - call: "POST /component-lots"
              payload: { supplier_id: "${sup_init_id}", lot_code: "CB-INIT", lot_quantity: 800 }
              as: QualityEngineer
              as_user_id: "qe-mika"
              captures: { lot_init_id: $.data.id }
            - call: "POST /machining-runs"
              payload: { engine_platform_id: "${plat_id}", casting_lot_id: "${lot_cast_id}", component_type: "CRANK_JOURNAL", lsl_mm: 34.980, usl_mm: 35.020 }
              as: QualityEngineer
              as_user_id: "qe-mika"
              captures: { mrun_init_id: $.data.id }
            - *a_bo
            - *a_bo_release
            - *a_u1_stage
            - *a_audit_schedule
            - *a_part1
            - call: "POST /service-parts"
              payload: { engine_platform_id: "${plat_id}", part_number: "PN-COIL-EMPTY", category: "IGNITION_COIL", on_hand_qty: 0, committed_availability_years: 10, last_production_year: 2027 }
              as: PlantAdmin
              captures: { part_empty_id: $.data.id }
            - &a_req_backordered
              call: "POST /parts-requests"
              payload: { service_part_id: "${part_empty_id}", requested_quantity: 2, channel: "DEALER" }
              as: ChannelPartner
              as_user_id: "cp-dealer-77"
              captures: { req_back_id: $.data.id }
          assert:
            - "CertificationFamily.${fam_init_id}.status == DRAFT and version == 1"
            - "EnginePlatform.${plat_init_id}.certification_posture == PENDING — projected from the DRAFT family, never stored as OPEN at birth"
            - "DurabilityTestRun.${dur_init_id}.status == SCHEDULED with computed_deterioration_factor == null"
            - "ProductModel.${model_init_id}.status == DRAFT; Supplier.${sup_init_id}.approval_status == APPROVED with incoming_inspection_level == NORMAL and consecutive_accepted_lots == 0"
            - "ComponentLot.${lot_init_id}.status == RECEIVED; MachiningRun.${mrun_init_id}.status == OPEN with cpk == null"
            - "BuildOrder.${bo_id}.status == PLANNED on creation (the alias's release call then moves it to RELEASED)"
            - "EngineUnit.${u1_id}.build_state == STAGED with conformance_state == PENDING and rework_count == 0"
            - "ProductionLineAudit.${audit_id}.status == SCHEDULED; ServicePart.${part1_id}.status == ACTIVE"
            - "PartsFulfillmentRequest.${req_back_id}.status == BACKORDERED with promised_ship_date == 2026-08-24 (BACKORDER_PROMISE_DAYS 21 from the clock) and shipped_from_part_id == null"
            - "ServicePart.${part_empty_id}.on_hand_qty == 0 and backordered_request_count == 1"

      - name: audit_pass_and_unit_release_are_valid_transitions
        claim_type: valid_transition
        grounds:
          - state_machines[ProductionLineAudit].transitions[SCHEDULED->PASSED]
          - state_machines[EngineUnit].transitions[HOT_TESTED->RELEASED]
          - calculations.audit_outcome
        distinguishing_aspect: |
          The two declared happy-path transitions fire and stop there: a unit passes
          HOT_TESTED -> RELEASED and an audit passes SCHEDULED -> PASSED with
          failure_rate 0.0000, leaving the family's status and cumulative_audit_failures
          untouched — a PASSED audit must not run any part of the failure cascade.
        test_recipe:
          setup:
            - "Clock 2026-08-03T08:00:00Z; the certified 208SS prelude with order ${bo_id} (planned 6) RELEASED and unit SN-0001 already RELEASED."
            - "A scheduled audit for week 2026-09-14 exists on the order."
          setup_api_calls:
            - *a_clock
            - *a_fam
            - *a_plat
            - *a_dur
            - *a_dur_complete
            - *a_submit
            - *a_certify
            - *a_model
            - *a_safety
            - *a_model_release
            - *a_line
            - *a_sup_carb
            - *a_lot_carb
            - *a_inspect_carb_clean
            - *a_sup_ign
            - *a_lot_ign
            - *a_inspect_ign_clean
            - *a_sup_cast
            - *a_lot_cast
            - *a_inspect_cast_clean
            - *a_mrun
            - *a_mrun_close
            - *a_bo
            - *a_bo_release
            - *a_u1_stage
            - *a_u1_torque
            - *a_u1_hot
            - *a_u1_release
            - *a_audit_schedule
          trigger:
            - &a_u2_stage
