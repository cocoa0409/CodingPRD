            - "${err_fk} == ERR_PATRON_NOT_FOUND with HTTP 404 — priority 5 runs before priority 6"
            - "The clean creation returns HTTP 201 with Ticket.${t_ok_id}.access_zone_id == ${z1_id} and event_id == ${ev1_id}"
            - "AccessZone.${z2_id}.issued_entitlement_count == 0 and Event.${ev2_id}.entitlements_outstanding == 0 — the foreign event was untouched"
