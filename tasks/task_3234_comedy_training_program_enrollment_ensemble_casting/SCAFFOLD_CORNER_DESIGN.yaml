# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3234_comedy_training_program_enrollment_ensemble_casting
#
# Breadth probe. Every claim §1.1–§1.7 surfaces that §1.8 does not already
# exercise. §1.8-covered corners appear as `excluded_because:` stubs.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  # Entities — creation / retrieval / listing / not-found / defaults / computed
  # ===========================================================================
  - section: entities
    instances:

      - name: curriculum_level_create_returns_defaults_and_system_fields
        claim_type: Creation
        grounds:
          - entities.CurriculumLevel
          - endpoints.POST_/curriculum-levels
        distinguishing_aspect: "POST with only required fields returns 201 with status=ACTIVE, allows_placement_bypass=false, showcase_required=false, version=1, and system id/created_at/updated_at populated."
        test_recipe:
          setup: ["Empty database; clock at default 2026-09-01T00:00:00Z."]
          setup_api_calls: []
          trigger:
            - &cl_create
              call: "POST /curriculum-levels"
              payload: { code: "L1", title: "Level 1", track: "IMPROV", sequence_index: 0 }
              as: ProgramDirector
              captures: { cl_id: $.data.id }
          assert:
            - "the response status is 201"
            - "CurriculumLevel.${cl_id}.status == ACTIVE"
            - "CurriculumLevel.${cl_id}.allows_placement_bypass == false"
            - "CurriculumLevel.${cl_id}.showcase_required == false"
            - "CurriculumLevel.${cl_id}.version == 1"
            - "response data has non-null id, created_at, updated_at"
            - "meta.api_request_id is present"

      - name: student_get_returns_stored_fields
        claim_type: Retrieval
        grounds:
          - entities.Student
          - endpoints.GET_/students/{studentId}
        distinguishing_aspect: "Student round-trips full_name and email; is_alumni starts false; completed_level_codes starts empty."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - &c_stu
              call: "POST /students"
              payload: { full_name: "Round Trip", email: "rt@x.com" }
              as: Registrar
              captures: { c_sid: $.data.id }
          trigger:
            - call: "GET /students/${c_sid}"
              payload: {}
              as: Registrar
          assert:
            - "Student.${c_sid}.full_name == \"Round Trip\""
            - "Student.${c_sid}.is_alumni == false"
            - "Student.${c_sid}.completed_level_codes == []"
            - "Student.${c_sid}.placement_credit_codes == []"

      - name: enrollments_list_paginates_with_filter
        claim_type: Listing
        grounds:
          - endpoints.GET_/enrollments
          - response_envelope.pagination_fields
        distinguishing_aspect: "list with student_id filter and limit=1 returns total_count of the filtered set, has_more=true; offset=1 returns remainder."
        test_recipe:
          setup:
            - "Two sections open, one student with two REGISTERED enrollments (one per section)."
          setup_api_calls:
            - &c_clock
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: ProgramDirector
            - &c_lvl
              call: "POST /curriculum-levels"
              payload: { code: "L1", title: "Level 1", track: "IMPROV", sequence_index: 0 }
              as: ProgramDirector
              captures: { c_lvl_id: $.data.id }
            - &c_term
              call: "POST /terms"
              payload: { name: "T1", start_utc: "2027-01-05T00:00:00Z", end_utc: "2027-03-15T00:00:00Z", drop_deadline_utc: "2027-01-12T00:00:00Z" }
              as: ProgramDirector
              captures: { c_term_id: $.data.id }
            - &c_instr
              call: "POST /instructors"
              payload: { display_name: "T", home_track: "IMPROV", certified_tracks: ["IMPROV"], max_weekly_hours: 20 }
              as: ProgramDirector
              captures: { c_instr_id: $.data.id }
            - call: "POST /terms/${c_term_id}/open-scheduling"
              payload: {}
              as: ProgramDirector
            - &c_sec_a
              call: "POST /sections"
              payload: { term_id: "${c_term_id}", level_id: "${c_lvl_id}", instructor_id: "${c_instr_id}", capacity: 4, tuition_cents: 10000, weekly_hours: 3 }
              as: ProgramDirector
              captures: { c_sec_a_id: $.data.id, c_sec_a_v: $.data.version }
            - &c_sec_b
              call: "POST /sections"
              payload: { term_id: "${c_term_id}", level_id: "${c_lvl_id}", instructor_id: "${c_instr_id}", capacity: 4, tuition_cents: 10000, weekly_hours: 3 }
              as: ProgramDirector
              captures: { c_sec_b_id: $.data.id, c_sec_b_v: $.data.version }
            - call: "POST /terms/${c_term_id}/open-enrollment"
              payload: {}
              as: ProgramDirector
            - *c_stu
            - call: "POST /enrollments"
              payload: { student_id: "${c_sid}", section_id: "${c_sec_a_id}", expected_section_version: "${c_sec_a_v}" }
              as: Registrar
            - &c_sec_b_v_now
              call: "GET /sections/${c_sec_b_id}"
              payload: {}
              as: Registrar
              captures: { c_sec_b_v_now: $.data.version }
            - call: "POST /enrollments"
              payload: { student_id: "${c_sid}", section_id: "${c_sec_b_id}", expected_section_version: "${c_sec_b_v_now}" }
              as: Registrar
          trigger:
            - call: "GET /enrollments"
              payload: { student_id: "${c_sid}", limit: 1, offset: 0 }
              as: Registrar
          assert:
            - "the response returns exactly 1 row"
            - "total_count == 2 and has_more == true"
            - "subsequent GET with offset=1 returns exactly 1 row and has_more == false"

      - name: ensemble_cast_get_with_unknown_id_returns_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/ensemble-casts/{castId}
          - errors.ERR_NOT_FOUND
        distinguishing_aspect: "A syntactically valid but unallocated UUID returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "GET /ensemble-casts/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: CastingDirector
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 404"
            - "error_id == ERR_NOT_FOUND"

      - name: section_create_missing_capacity_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.CourseSection.fields.capacity
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "capacity is a required input with no default; omission → 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup:
            - "Level L1 and a term in SCHEDULING."
          setup_api_calls:
            - *c_clock
            - *c_lvl
            - *c_term
            - call: "POST /terms/${c_term_id}/open-scheduling"
              payload: {}
              as: ProgramDirector
            - *c_instr
          trigger:
            - call: "POST /sections"
              payload: { term_id: "${c_term_id}", level_id: "${c_lvl_id}", instructor_id: "${c_instr_id}", tuition_cents: 10000, weekly_hours: 3 }
              as: ProgramDirector
              captures: { err_inv: $.data.error_id }
          assert:
            - "the response status is 400"
            - "error_id == ERR_INVALID_REQUEST"

      - name: placement_evaluation_default_portfolio_score_zero
        claim_type: Defaults
        grounds:
          - entities.PlacementEvaluation.fields.portfolio_score
        distinguishing_aspect: "portfolio_score defaults to 0 when omitted."
        test_recipe:
          setup:
            - "Student and L2 with allows_placement_bypass=true."
          setup_api_calls:
            - *c_clock
            - *c_lvl
            - &c_lvl2
              call: "POST /curriculum-levels"
              payload: { code: "L2", title: "Level 2", track: "IMPROV", sequence_index: 1, requires_level_code: "L1", allows_placement_bypass: true }
              as: ProgramDirector
              captures: { c_lvl2_id: $.data.id }
            - *c_stu
          trigger:
            - &c_pe
              call: "POST /placement-evaluations"
              payload: { student_id: "${c_sid}", target_level_id: "${c_lvl2_id}", track: "IMPROV", prior_institution: "Unknown School" }
              as: PlacementOfficer
              captures: { c_pe_id: $.data.id }
          assert:
            - "PlacementEvaluation.${c_pe_id}.portfolio_score == 0"
            - "PlacementEvaluation.${c_pe_id}.variant == PORTFOLIO_REVIEW"

      - name: section_enrolled_count_computed_and_input_ignored
        claim_type: Computed Fields
        grounds:
          - entities.CourseSection.fields.enrolled_count
        distinguishing_aspect: "enrolled_count is system-computed; posting it in the create body is ignored."
        test_recipe:
          setup: ["Term SCHEDULING, level L1."]
          setup_api_calls:
            - *c_clock
            - *c_lvl
            - *c_term
            - call: "POST /terms/${c_term_id}/open-scheduling"
              payload: {}
              as: ProgramDirector
            - *c_instr
          trigger:
            - call: "POST /sections"
              payload: { term_id: "${c_term_id}", level_id: "${c_lvl_id}", instructor_id: "${c_instr_id}", capacity: 4, tuition_cents: 10000, weekly_hours: 3 }
              as: ProgramDirector
              captures: { c_sec_x: $.data.id }
          assert:
            - "CourseSection.${c_sec_x}.enrolled_count == 0"
            - "CourseSection.${c_sec_x}.waitlist_count == 0"

      - name: level_create_invalid_track_enum_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.CurriculumLevel.fields.track
        distinguishing_aspect: "track must be one of IMPROV | SKETCH | STANDUP | CONSERVATORY."
        test_recipe:
          setup: ["Empty."]
          setup_api_calls: []
          trigger:
            - call: "POST /curriculum-levels"
              payload: { code: "LX", title: "Bad", track: "MUSICAL", sequence_index: 0 }
              as: ProgramDirector
              captures: { err_enum: $.data.error_id }
          assert:
            - "the response status is 400"
            - "error_id == ERR_INVALID_REQUEST"

  # ===========================================================================
  # State machines — invalid-from, terminal lockdown, idempotency, side effects
  # ===========================================================================
  - section: state_machines
    instances:

      - name: term_close_from_draft_returns_invalid_state
        claim_type: invalid_transition
        grounds:
          - state_machines.Term.transitions
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "POST /terms/{id}/close on a DRAFT term is rejected with ERR_INVALID_STATE."
        test_recipe:
          setup: ["A term in DRAFT."]
          setup_api_calls:
            - *c_clock
            - *c_term
          trigger:
            - call: "POST /terms/${c_term_id}/close"
              payload: {}
              as: ProgramDirector
              captures: { err_ts: $.data.error_id }
          assert:
            - "the response status is 409"
            - "error_id == ERR_INVALID_STATE"
            - "Term.${c_term_id}.status == DRAFT"

      - name: enrollment_drop_terminal_dropped_early_lockdown
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.Enrollment.transitions
        distinguishing_aspect: "Once an enrollment is DROPPED_EARLY, no further transitions are allowed."
        test_recipe:
          setup: ["Confirmed enrollment dropped early."]
          setup_api_calls:
            - *c_clock
            - *c_lvl
            - *c_term
            - *c_instr
            - call: "POST /terms/${c_term_id}/open-scheduling"
              payload: {}
              as: ProgramDirector
            - *c_sec_a
            - call: "POST /terms/${c_term_id}/open-enrollment"
              payload: {}
              as: ProgramDirector
            - *c_stu
            - &c_enr_a
              call: "POST /enrollments"
              payload: { student_id: "${c_sid}", section_id: "${c_sec_a_id}", expected_section_version: "${c_sec_a_v}" }
              as: Registrar
              captures: { c_enr_a_id: $.data.id }
            - call: "POST /enrollments/${c_enr_a_id}/confirm"
              payload: {}
              as: Registrar
            - call: "POST /enrollments/${c_enr_a_id}/drop"
              payload: {}
              as: Registrar
          trigger:
            - call: "POST /enrollments/${c_enr_a_id}/drop"
              payload: {}
              as: Registrar
              captures: { err_tl: $.data.error_id }
          assert:
            - "the response status is 409"
            - "error_id == ERR_INVALID_STATE"

      - name: placement_evaluation_grant_idempotent_second_attempt_fails
        claim_type: Idempotency
        grounds:
          - state_machines.PlacementEvaluation.transitions
        distinguishing_aspect: "Calling grant twice on the same evaluation returns ERR_INVALID_STATE the second time."
        test_recipe:
          setup: ["AUDITION_BYPASS evaluation already GRANTED."]
          setup_api_calls:
            - *c_clock
            - *c_lvl
            - *c_lvl2
            - *c_stu
            - &c_pe_g
              call: "POST /placement-evaluations"
              payload: { student_id: "${c_sid}", target_level_id: "${c_lvl2_id}", track: "IMPROV", prior_institution: "UCB", portfolio_score: 0 }
              as: PlacementOfficer
              captures: { c_pe_g_id: $.data.id }
            - call: "POST /placement-evaluations/${c_pe_g_id}/begin-review"
              payload: {}
              as: PlacementOfficer
            - call: "POST /placement-evaluations/${c_pe_g_id}/grant"
              payload: {}
              as: PlacementOfficer
          trigger:
            - call: "POST /placement-evaluations/${c_pe_g_id}/grant"
              payload: {}
              as: PlacementOfficer
              captures: { err_idem: $.data.error_id }
          assert:
            - "the response status is 409"
            - "error_id == ERR_INVALID_STATE"

      - name: ensemble_cast_open_casting_side_effect
        claim_type: side_effect_execution
        grounds:
          - state_machines.EnsembleCast.OPEN_ROLES_to_CASTING
        distinguishing_aspect: "open-casting moves status to CASTING and increments version."
        test_recipe:
          setup: ["Cast created with a slot."]
          setup_api_calls:
            - *c_clock
            - &c_vs
              call: "POST /venue-slots"
              payload: { venue_name: "M", start_utc: "2027-04-01T19:00:00Z", end_utc: "2027-04-01T21:00:00Z", capacity: 200 }
              as: ProgramDirector
              captures: { c_vs_id: $.data.id }
            - &c_cast
              call: "POST /ensemble-casts"
              payload: { revue_title: "R", venue_slot_id: "${c_vs_id}", cast_size: 2, understudy_slots: 1 }
              as: CastingDirector
              captures: { c_cast_id: $.data.id }
          trigger:
            - call: "POST /ensemble-casts/${c_cast_id}/open-casting"
              payload: {}
              as: CastingDirector
          assert:
            - "EnsembleCast.${c_cast_id}.status == CASTING"
            - "EnsembleCast.${c_cast_id}.version == 2"

  # ===========================================================================
  # Calculations — precision / constants / input-set filtering
  # ===========================================================================
  - section: calculations
    instances:

      - name: ensemble_composite_score_precision_round_half_up
        claim_type: Precision
        grounds:
          - calculations.ensemble_composite_score
        distinguishing_aspect: "Rounding mode is round_half_up at 2 decimals: scores {scene_work:5, characters:5, musicality:5, game:5} = 0.4*5+0.25*5+0.2*5+0.15*5 = 5.00 exactly."
        test_recipe:
          setup: ["Student and audition with all-5 rubric."]
          setup_api_calls:
            - *c_clock
            - *c_stu
            - &c_aud_p
              call: "POST /auditions"
              payload: { student_id: "${c_sid}", target_kind: "ENSEMBLE", rubric_scores: { scene_work: 5, characters: 5, musicality: 5, game: 5 } }
              as: CastingDirector
              captures: { c_aud_p_id: $.data.id }
          trigger:
            - call: "POST /auditions/${c_aud_p_id}/evaluate"
              payload: {}
              as: CastingDirector
          assert:
            - "Audition.${c_aud_p_id}.composite_score == 5.00"

      - name: seat_allocation_selector_priority_tier_beats_created_at
        claim_type: Input Set Filtering
        grounds:
          - calculations.seat_allocation
        distinguishing_aspect: "Waitlist ranking orders by priority_tier DESC (RETURNING > NEW) BEFORE created_at ASC — a later-created RETURNING enrollment is promoted over an earlier-created NEW one."
        test_recipe:
          setup:
            - "Section capacity=1 with s1 CONFIRMED. s2 (NEW, created first) and s3 (RETURNING, created later) both WAITLISTED."
          setup_api_calls:
            - *c_clock
            - *c_lvl
            - *c_term
            - *c_instr
            - call: "POST /terms/${c_term_id}/open-scheduling"
              payload: {}
              as: ProgramDirector
            - &c_sec_c1
              call: "POST /sections"
              payload: { term_id: "${c_term_id}", level_id: "${c_lvl_id}", instructor_id: "${c_instr_id}", capacity: 1, tuition_cents: 10000, weekly_hours: 3 }
              as: ProgramDirector
              captures: { c_sec_c1_id: $.data.id, c_sec_c1_v: $.data.version }
            - call: "POST /terms/${c_term_id}/open-enrollment"
              payload: {}
              as: ProgramDirector
            - *c_stu
            - &c_stu2
              call: "POST /students"
              payload: { full_name: "Second", email: "s2@x.com" }
              as: Registrar
              captures: { c_s2_id: $.data.id }
            - &c_stu3
              call: "POST /students"
              payload: { full_name: "Third", email: "s3@x.com" }
              as: Registrar
              captures: { c_s3_id: $.data.id }
            - &c_enr_s1
              call: "POST /enrollments"
              payload: { student_id: "${c_sid}", section_id: "${c_sec_c1_id}", expected_section_version: "${c_sec_c1_v}" }
              as: Registrar
              captures: { c_enr_s1_id: $.data.id }
            - call: "POST /enrollments/${c_enr_s1_id}/confirm"
              payload: {}
              as: Registrar
            - &c_sec_v2
              call: "GET /sections/${c_sec_c1_id}"
              payload: {}
              as: Registrar
              captures: { c_sec_v2_now: $.data.version }
            - &c_enr_s2
              call: "POST /enrollments"
              payload: { student_id: "${c_s2_id}", section_id: "${c_sec_c1_id}", priority_tier: "NEW", expected_section_version: "${c_sec_v2_now}" }
              as: Registrar
              captures: { c_enr_s2_id: $.data.id }
            - &c_sec_v3
              call: "GET /sections/${c_sec_c1_id}"
              payload: {}
              as: Registrar
              captures: { c_sec_v3_now: $.data.version }
            - &c_enr_s3
              call: "POST /enrollments"
              payload: { student_id: "${c_s3_id}", section_id: "${c_sec_c1_id}", priority_tier: "RETURNING", expected_section_version: "${c_sec_v3_now}" }
              as: Registrar
              captures: { c_enr_s3_id: $.data.id }
          trigger:
            - call: "POST /enrollments/${c_enr_s1_id}/drop"
              payload: {}
              as: Registrar
          assert:
            - "before drop: Enrollment.${c_enr_s2_id}.status == WAITLISTED and Enrollment.${c_enr_s3_id}.status == WAITLISTED"
            - "after drop: Enrollment.${c_enr_s3_id}.status == REGISTERED (RETURNING promoted first)"
            - "after drop: Enrollment.${c_enr_s2_id}.status == WAITLISTED (still waiting)"

      - name: placement_portfolio_threshold_boundary_69_vs_70
        claim_type: Constants Applied
        grounds:
          - calculations.placement_credit_variant
          - errors.ERR_PORTFOLIO_SCORE_TOO_LOW
        distinguishing_aspect: "PORTFOLIO_PASS_THRESHOLD is 70; score=69 must deny, score=70 must grant."
        test_recipe:
          setup: ["L2 bypass allowed. Two students, one with score 69 and one with score 70."]
          setup_api_calls:
            - *c_clock
            - *c_lvl
            - *c_lvl2
            - *c_stu
            - *c_stu2
            - &c_pe_69
              call: "POST /placement-evaluations"
              payload: { student_id: "${c_sid}", target_level_id: "${c_lvl2_id}", track: "IMPROV", prior_institution: "Unknown School", portfolio_score: 69 }
              as: PlacementOfficer
              captures: { c_pe_69_id: $.data.id }
            - &c_pe_70
              call: "POST /placement-evaluations"
              payload: { student_id: "${c_s2_id}", target_level_id: "${c_lvl2_id}", track: "IMPROV", prior_institution: "Unknown School", portfolio_score: 70 }
              as: PlacementOfficer
              captures: { c_pe_70_id: $.data.id }
            - call: "POST /placement-evaluations/${c_pe_69_id}/begin-review"
              payload: {}
              as: PlacementOfficer
            - call: "POST /placement-evaluations/${c_pe_70_id}/begin-review"
              payload: {}
              as: PlacementOfficer
          trigger:
            - call: "POST /placement-evaluations/${c_pe_69_id}/grant"
              payload: {}
              as: PlacementOfficer
              captures: { err_69: $.data.error_id }
            - call: "POST /placement-evaluations/${c_pe_70_id}/grant"
              payload: {}
              as: PlacementOfficer
          assert:
            - "score 69: the response status is 422 and error_id == ERR_PORTFOLIO_SCORE_TOO_LOW"
            - "score 70: PlacementEvaluation.${c_pe_70_id}.decision == GRANTED"

  # ===========================================================================
  # Validations — violation→error / satisfaction→pass
  # ===========================================================================
  - section: validations
    instances:

      - name: curriculum_level_prerequisite_cycle_rejected
        claim_type: violation_to_error
        grounds:
          - validations.priority_7_business_safety
          - errors.ERR_PREREQUISITE_CYCLE
        distinguishing_aspect: "Creating a level L3 with requires_level_code=L1, then attempting to set L1.requires_level_code=L3 introduces a cycle and must be rejected."
        test_recipe:
          setup: ["Levels L1 (no prereq), L3 (requires L1)."]
          setup_api_calls:
            - *c_clock
            - *c_lvl
            - &c_lvl3
              call: "POST /curriculum-levels"
              payload: { code: "L3", title: "Level 3", track: "IMPROV", sequence_index: 2, requires_level_code: "L1" }
              as: ProgramDirector
          trigger:
            # NOTE: PATCH /curriculum-levels not declared — cycle detection also fires at creation.
            # Try to create L4 with requires_level_code=L3, then attempt to introduce a cycle by
            # creating a new L_CYC with requires_level_code that already requires L_CYC transitively.
            # Since CurriculumLevel codes are unique, the cleanest cycle is creating L_X requires L_Y
            # where L_Y is later set to require L_X — which is impossible without an update endpoint.
            # Instead, we test the degenerate case: create a level that requires itself.
            - call: "POST /curriculum-levels"
              payload: { code: "LSELF", title: "Self Ref", track: "IMPROV", sequence_index: 9, requires_level_code: "LSELF" }
              as: ProgramDirector
              captures: { err_cyc: $.data.error_id }
          assert:
            - "the response status is 422"
            - "error_id == ERR_PREREQUISITE_CYCLE"

      - name: instructor_overloaded_weekly_hours_rejected
        claim_type: violation_to_error
        grounds:
          - validations.priority_8_business_constraint
          - errors.ERR_INSTRUCTOR_UNAVAILABLE
        distinguishing_aspect: "Instructor max_weekly_hours=5; creating a section with weekly_hours=3 (ok), then a second section with weekly_hours=3 (cumulative 6 > 5) → ERR_INSTRUCTOR_UNAVAILABLE."
        test_recipe:
          setup: ["Instructor with cap 5, term SCHEDULING, level L1."]
          setup_api_calls:
            - *c_clock
            - *c_lvl
            - *c_term
            - &c_instr_low
              call: "POST /instructors"
              payload: { display_name: "Low Cap", home_track: "IMPROV", certified_tracks: ["IMPROV"], max_weekly_hours: 5 }
              as: ProgramDirector
              captures: { c_instr_low_id: $.data.id }
