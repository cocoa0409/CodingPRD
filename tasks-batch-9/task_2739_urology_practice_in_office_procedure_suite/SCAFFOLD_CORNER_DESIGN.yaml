      - name: err_reprocessing_log_open_guards_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority 53]
          - validations[priority 56]
          - validations[priority 57]
          - errors[ERR_HLD_CERTIFICATION_REQUIRED]
          - errors[ERR_REPROCESSING_STAGE_OUT_OF_ORDER]
          - errors[ERR_REPROCESSING_LOG_ALREADY_OPEN]
        distinguishing_aspect: "Three guards fire on the same endpoint in their declared priority order on a scope with no reprocessing history: an uncertified performer is refused at priority 53 before the stage-order check would even look at HIGH_LEVEL_DISINFECT, MANUAL_CLEAN is refused at 56 because the only legal first stage is PRECLEAN, and once a PRECLEAN log is open a second PRECLEAN log is refused at 57."
        test_recipe:
          setup:
            - "two techs: Omar Diaz with hld_certified true and Rue Bell with hld_certified false (the default)"
            - "one scope SN-9002, AVAILABLE, no logs at all"
          setup_api_calls:
            - call: "POST /urology/providers"
              payload: { full_name: "Omar Diaz", npi: "1000000004", role_type: "TECH", hld_certified: true }
              as: PracticeAdmin
              captures: { tech_hld_id: $.data.id }
            - call: "POST /urology/providers"
              payload: { full_name: "Rue Bell", npi: "1000000007", role_type: "TECH" }
              as: PracticeAdmin
              captures: { tech_plain_id: $.data.id }
            - call: "POST /urology/scope-assets"
              payload: { serial_number: "SN-9002", scope_model: "FlexCysto 200", channel_count: 2 }
              as: SterileProcessingTech
              as_user_id: "${tech_hld_id}"
              captures: { scope_id: $.data.id }
          trigger:
            - call: "POST /urology/reprocessing-logs"
              payload: { scope_asset_id: "${scope_id}", stage: "HIGH_LEVEL_DISINFECT", performed_by_provider_id: "${tech_plain_id}" }
              as: SterileProcessingTech
              as_user_id: "${tech_plain_id}"
              captures: { e_hld: $.data.error_id }
            - call: "POST /urology/reprocessing-logs"
              payload: { scope_asset_id: "${scope_id}", stage: "MANUAL_CLEAN", performed_by_provider_id: "${tech_plain_id}" }
              as: SterileProcessingTech
              as_user_id: "${tech_plain_id}"
              captures: { e_order: $.data.error_id }
            - call: "POST /urology/reprocessing-logs"
              payload: { scope_asset_id: "${scope_id}", stage: "PRECLEAN", performed_by_provider_id: "${tech_plain_id}" }
              as: SterileProcessingTech
              as_user_id: "${tech_plain_id}"
              captures: { log_id: $.data.id }
            - call: "POST /urology/reprocessing-logs"
              payload: { scope_asset_id: "${scope_id}", stage: "PRECLEAN", performed_by_provider_id: "${tech_hld_id}" }
              as: SterileProcessingTech
              as_user_id: "${tech_hld_id}"
              captures: { e_already_open: $.data.error_id }
          assert:
            - "${e_hld} == \"ERR_HLD_CERTIFICATION_REQUIRED\" at HTTP 422"
            - "${e_order} == \"ERR_REPROCESSING_STAGE_OUT_OF_ORDER\" at HTTP 422 — with no CLOSED PASS log the only admissible stage is PRECLEAN"
            - "trigger call 3: HTTP 201 with log_status == \"OPEN\", stage == \"PRECLEAN\", outcome null, completed_at null, attested_by_provider_id null"
            - "${e_already_open} == \"ERR_REPROCESSING_LOG_ALREADY_OPEN\" at HTTP 409 — the stage is admissible, so the later-priority guard is the one that speaks"
            - "GET /urology/reprocessing-logs?scope_asset_id=${scope_id} has total_count == 1"

      - name: err_antibiotic_eligibility_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority 45]
          - validations[priority 46]
          - errors[ERR_ANTIBIOTIC_CONTRAINDICATED]
          - errors[ERR_NO_ELIGIBLE_ANTIBIOTIC]
          - calculations.antibiotic_agent_selection
        distinguishing_aspect: "The two antibiotic errors separate an explicit request from AUTO. Requesting TMP_SMX for a SULFA-allergic patient is ERR_ANTIBIOTIC_CONTRAINDICATED, while AUTO for a CEPHALOSPORIN-allergic patient at egfr 20 empties the pool (CIPROFLOXACIN and TMP_SMX need egfr 30, GENTAMICIN needs 60, CEFAZOLIN is the allergy) and is ERR_NO_ELIGIBLE_ANTIBIOTIC. AUTO on a type whose requires_antibiotic is false is the same error for a structural reason: that code has no PROTOCOL_RANK entry."
