            - *n_pl3
            - *n_seat1
            - *n_seat2
            - *n_seat3
            - *n_charter
            - *n_round
            - *n_rev1
          trigger:
            - { call: "POST /grants/reviews", payload: { application_id: "${app}", panelist_id: "${pl1}", artistic_excellence: 5, work_sample_quality: 5, career_impact: 5, public_value: 5, comments: "A second sheet from the same reader." }, as: Panelist, as_user_id: "${pl1}" }
            - { call: "POST /grants/reviews", payload: { application_id: "${app}", panelist_id: "${pl2}", artistic_excellence: 7, work_sample_quality: 7, career_impact: 6, public_value: 5, comments: "Conventional but competent." }, as: Panelist, as_user_id: "${pl2}" }
            - { call: "GET /grants/reviews", payload: { application_id: "${app}" }, as: ProgramOfficer, as_user_id: "officer-1" }
          assert:
            - "The duplicate returns 409 ERR_DUPLICATE_REVIEW"
            - "The second panelist's review returns 201 with round_number == 1 and status \"DRAFT\""
            - "The list read shows total_count == 2 — the refused request created no row"

      - name: malformed_acceptance_body_outranks_the_tax_certification_gate
        claim_type: priority_ordering
        grounds:
          - validations[error_id=ERR_TAX_CERTIFICATION_REQUIRED]
          - validations[priority=30]
          - state_machines.Award[OFFERED->ACCEPTED]
        distinguishing_aspect: |
          Both defects are present in the first call — a wrong agreement version
          (P30 ERR_INVALID_REQUEST) and tax_certification_signed false (P85
          ERR_TAX_CERTIFICATION_REQUIRED) — and the P30 code must win. Fixing
          only the version then surfaces the P85 code, and no installment row is
          created by either refusal. An implementation that validates the
          business gate first reports the tax error twice.
        test_recipe:
          setup:
