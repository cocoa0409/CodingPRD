          trigger:
            - call: "GET /brewers/${b1_id}/loss-rate"
              payload: { basis: "TRAILING_90D" }
              as: AssetRecoveryAnalyst
              as_user_id: "analyst-1"
            - call: "GET /brewers/${b1_id}/loss-rate"
              payload: { basis: "LIFETIME" }
              as: AssetRecoveryAnalyst
              as_user_id: "analyst-1"
          assert:
            - "the TRAILING_90D read returns 200 with basis == TRAILING_90D, upheld_loss_count == 1, fill_count == 0, basis_insufficient == true and loss_rate_bp == 0"
            - "the TRAILING_90D read returns window_start == 2026-05-03T23:00:00Z and window_end == 2026-08-01T23:00:00Z"
            - "the LIFETIME read returns 200 with basis == LIFETIME, upheld_loss_count == 1, fill_count == 0, basis_insufficient == true and loss_rate_bp == 0"
