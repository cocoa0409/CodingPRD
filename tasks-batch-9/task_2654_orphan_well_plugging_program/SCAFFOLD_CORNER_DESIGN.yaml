            - "the first award attempt returns HTTP 403 with error_id ERR_SEGREGATION_OF_DUTIES and Solicitation.${sol_id}.status == CLOSED"
            - "after the first attempt GET /unit-cost-contracts returns total_count == 0 and Bid.${bid_id}.status == RESPONSIVE, not AWARDED"
            - "the second award attempt returns HTTP 201 with data.status == ACTIVE and Bid.${bid_id}.status == AWARDED"
            - "PluggingJob.${job_id}.plugging_cost_estimate_cents == 6070196 and FundingAllocation.${alloc_id}.committed_by_user_id == 'u_fund1'"
            - "the first disbursement attempt returns HTTP 403 with error_id ERR_SEGREGATION_OF_DUTIES, not ERR_DISBURSEMENT_EXCEEDS_ALLOCATION"
            - "after that refusal FundingAllocation.${alloc_id}.status == COMMITTED and FundingSource.${fs_id}.disbursed_cents == 0"
            - "the final call returns HTTP 200 with data.status == DISBURSED and disbursed_by_user_id == 'u_fund2'"
            - "FundingSource.${fs_id}.disbursed_cents == 6070196 and committed_cents == 6070196"

  - section: cross_cutting_complexity_layers
    instances:
      - name: stale_well_version_blocks_the_determination_create_and_a_reread_unblocks_it
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[determination-create-stale-well]
          - errors.ERR_STALE_WELL_VERSION
          - state_machines.Well.access_status.NO_ACCESS_REQUESTED_to_ACCESS_PENDING
        distinguishing_aspect: |
          The version the client observed at well creation is invalidated by a write to a completely
          different dimension of the same row: opening a site-access request moves access_status and
          bumps Well.version to 2, so the determination create that carries version 1 is rejected 412
          even though no state precondition forbids it, and the identical call carrying the re-read
          version 2 is accepted.
        test_recipe:
          setup:
            - "one operator with one PRODUCING well at version 1, then one AGREEMENT-mode access request that bumps the well to version 2"
          setup_api_calls:
            - call: "POST /operators"
              payload: { name: "Cottonwood Energy LLC", region_code: "WY", financial_assurance_tier: "INDIVIDUAL", bond_amount_cents: 5000000 }
              as: ProgramAdmin
              as_user_id: "u_admin"
              captures: { op_id: $.data.id }
            - call: "POST /wells"
              payload: { api_well_number: "49-001-26001", operator_id: "${op_id}", spud_year: 1974, total_depth_ft: 2500, casing_strings: 2, methane_scfd: 250, groundwater_depth_ft: 40, population_within_1000ft: 8, surface_disturbance_acres: 2.0 }
              as: FieldInspector
              as_user_id: "u_insp"
              captures: { w_id: $.data.id, w_v1: $.data.version }
            - call: "POST /wells/${w_id}/site-accesses"
              payload: { surface_owner_name: "Halvorsen Ranch", mode: "AGREEMENT" }
              as: ProgramAdmin
              as_user_id: "u_admin"
              captures: { sa_id: $.data.id }
          trigger:
            - call: "POST /wells/${w_id}/orphan-determinations"
              payload: { inspector_notes: "orphan candidate", expected_well_version: "${w_v1}" }
              as: FieldInspector
              as_user_id: "u_insp"
              captures: { e_stale: $.data.error_id }
            - call: "GET /wells/${w_id}"
              payload: {}
              as: FieldInspector
              as_user_id: "u_insp"
              captures: { w_v2: $.data.version }
            - call: "POST /wells/${w_id}/orphan-determinations"
              payload: { inspector_notes: "orphan candidate", expected_well_version: "${w_v2}" }
              as: FieldInspector
              as_user_id: "u_insp"
              captures: { det_id: $.data.id }
          assert:
            - "the captured w_v1 == 1 and after the site-access call Well.${w_id}.version == 2 and access_status == ACCESS_PENDING"
            - "the first trigger returns HTTP 412 with error_id ERR_STALE_WELL_VERSION"
            - "after the 412 GET /wells/${w_id}/orphan-determinations returns total_count == 0 and Well.${w_id}.version is still 2"
            - "the captured w_v2 == 2"
            - "the third call returns HTTP 201 with data.status == DRAFT and data.well_id == ${w_id}"
            - "GET /wells/${w_id}/orphan-determinations now returns total_count == 1 and exactly the id ${det_id}"
            - "Well.${w_id}.status == PRODUCING throughout: the OCC gate is about the observed version, not the lifecycle state"

      - name: successive_enforcement_actions_each_require_a_freshly_read_operator_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[enforcement-stale-operator]
          - errors.ERR_STALE_OPERATOR_VERSION
          - state_machines.Operator.transitions.INSOLVENT_to_REVOKED
        distinguishing_aspect: |
          Two enforcement actions that are individually legal cannot be driven from one observation:
          DECLARE_INSOLVENT at version 1 succeeds and leaves version 2, the FORFEIT_BOND replay at
          version 1 is refused 412 with nothing created, and the same FORFEIT_BOND at the re-read
          version 2 succeeds and leaves version 3 plus one FORFEITED_BOND source.
        test_recipe:
          setup:
            - "one ACTIVE operator with a 400000 bond and no wells, at version 1"
          setup_api_calls:
            - call: "POST /operators"
              payload: { name: "Cottonwood Energy LLC", region_code: "WY", financial_assurance_tier: "INDIVIDUAL", bond_amount_cents: 400000 }
              as: ProgramAdmin
              as_user_id: "u_admin"
              captures: { op_id: $.data.id, op_v1: $.data.version }
          trigger:
            - call: "POST /operators/${op_id}/enforcement"
              payload: { action: "DECLARE_INSOLVENT", expected_operator_version: "${op_v1}", memo: "receiver appointed" }
              as: ProgramAdmin
              as_user_id: "u_admin"
            - call: "POST /operators/${op_id}/enforcement"
              payload: { action: "FORFEIT_BOND", expected_operator_version: "${op_v1}" }
              as: ProgramAdmin
              as_user_id: "u_admin"
              captures: { e_stale: $.data.error_id }
            - call: "GET /operators/${op_id}"
              payload: {}
              as: ProgramAdmin
              as_user_id: "u_admin"
              captures: { op_v2: $.data.version }
            - call: "POST /operators/${op_id}/enforcement"
              payload: { action: "FORFEIT_BOND", expected_operator_version: "${op_v2}" }
              as: ProgramAdmin
              as_user_id: "u_admin"
          assert:
            - "the captured op_v1 == 1"
            - "the first call returns HTTP 200 with data.status == INSOLVENT and data.version == 2"
            - "the second call returns HTTP 412 with error_id ERR_STALE_OPERATOR_VERSION"
            - "after the 412 Operator.${op_id}.status == INSOLVENT, bond_amount_cents == 400000, bond_forfeited_at == null and version == 2"
            - "after the 412 GET /funding-sources?kind=FORFEITED_BOND returns total_count == 0"
            - "the captured op_v2 == 2"
            - "the fourth call returns HTTP 200 with data.status == REVOKED, data.bond_amount_cents == 0, data.bond_forfeited_at == 2026-08-01T00:00:00Z and data.version == 3"
            - "GET /funding-sources?kind=FORFEITED_BOND returns total_count == 1 with authorized_cents == 400000, bond_operator_id == ${op_id} and expires_at == 2036-07-29T00:00:00Z"

      - name: same_kind_funding_sources_are_ordered_by_expiry_then_by_creation
        claim_type: selector_policy
        grounds:
          - calculations.job_funding_waterfall.formula
          - entities.FundingSource.fields.expires_at
        distinguishing_aspect: |
          Within one kind the pool order is soonest-expiry-first and creation-order second, never
          largest-balance-first and never id order: the 2000000 fund expiring 2027-01-31 takes rank 1
          ahead of the 10000000 fund with the same expiry created one day later, and the 1000000 fund
          expiring 2027-06-30 is left with nothing even though it was created first and is the
          smallest, because the gap closes before the pool reaches it.
        test_recipe:
          setup:
            - "one SCHEDULED job with plugging_cost_estimate_cents 6070196"
            - "three STATE_FUND sources: 1000000 expiring 2027-06-30 created 2026-08-01, 2000000 expiring 2027-01-31 created 2026-08-02, 10000000 expiring 2027-01-31 created 2026-08-03"
          setup_api_calls:
            - call: "POST /operators"
              payload: { name: "Cottonwood Energy LLC", region_code: "WY", financial_assurance_tier: "INDIVIDUAL", bond_amount_cents: 5000000 }
              as: ProgramAdmin
              as_user_id: "u_admin"
              captures: { op_id: $.data.id }
            - call: "POST /wells"
              payload: { api_well_number: "49-001-27001", operator_id: "${op_id}", spud_year: 1974, total_depth_ft: 2500, casing_strings: 2, methane_scfd: 250, groundwater_depth_ft: 40, population_within_1000ft: 8, surface_disturbance_acres: 2.0 }
              as: FieldInspector
              as_user_id: "u_insp"
              captures: { w_id: $.data.id, w_v: $.data.version }
            - call: "POST /wells/${w_id}/orphan-determinations"
              payload: { inspector_notes: "orphan candidate", expected_well_version: "${w_v}" }
              as: FieldInspector
              as_user_id: "u_insp"
              captures: { det_id: $.data.id }
            - call: "POST /orphan-determinations/${det_id}/submit"
              payload: {}
              as: FieldInspector
              as_user_id: "u_insp"
            - call: "POST /orphan-determinations/${det_id}/decision"
              payload: { action: "CONFIRM", rationale: "criteria satisfied" }
              as: DeterminationReviewer
              as_user_id: "u_rev"
            - call: "POST /contractors"
              payload: { name: "Bighorn Plugging", license_number: "P-J0001", bond_amount_cents: 2500000, performance_score: 89 }
              as: ProcurementOfficer
              as_user_id: "u_proc"
              captures: { c_id: $.data.id }
            - call: "POST /solicitations"
              payload: { region_code: "WY", scope_description: "single orphan well plugging", bid_due_at: "2026-08-20T00:00:00Z", ceiling_cents: 20000000, min_technical_score: 70 }
              as: ProcurementOfficer
              as_user_id: "u_proc"
              captures: { sol_id: $.data.id }
            - call: "POST /solicitations/${sol_id}/lifecycle"
              payload: { action: "OPEN" }
              as: ProcurementOfficer
              as_user_id: "u_proc"
            - call: "POST /solicitations/${sol_id}/bids"
              payload: { contractor_id: "${c_id}", cement_per_sack_cents: 4137, rig_day_rate_cents: 849999, casing_per_ft_cents: 1213, mobilization_fee_cents: 2499999, technical_score: 92 }
              as: ProcurementOfficer
              as_user_id: "u_proc"
              captures: { bid_id: $.data.id }
            - call: "POST /solicitations/${sol_id}/lifecycle"
              payload: { action: "CLOSE" }
              as: ProcurementOfficer
              as_user_id: "u_proc"
            - call: "POST /bids/${bid_id}/evaluation"
              payload: { outcome: "RESPONSIVE" }
              as: ProcurementOfficer
              as_user_id: "u_proc"
            - call: "POST /solicitations/${sol_id}/award"
              payload: {}
              as: AwardAuthority
              as_user_id: "u_award"
              captures: { contract_id: $.data.id }
            - call: "POST /plugging-jobs"
              payload: { well_id: "${w_id}", contract_id: "${contract_id}", scheduled_start: "2026-08-05T00:00:00Z", planned_cement_sacks: 100, planned_rig_days: 3, planned_casing_ft: 500 }
              as: ProgramAdmin
              as_user_id: "u_admin"
              captures: { job_id: $.data.id }
            - call: "POST /funding-sources"
              payload: { kind: "STATE_FUND", name: "Late expiry small fund", authorized_cents: 1000000, expires_at: "2027-06-30T00:00:00Z", allowable_cost_categories: ["PLUGGING"] }
              as: FundingOfficer
              as_user_id: "u_fund1"
              captures: { fs_late_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-02T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "u_admin"
            - call: "POST /funding-sources"
              payload: { kind: "STATE_FUND", name: "Soon expiry medium fund", authorized_cents: 2000000, expires_at: "2027-01-31T00:00:00Z", allowable_cost_categories: ["PLUGGING"] }
              as: FundingOfficer
              as_user_id: "u_fund1"
              captures: { fs_soon_first_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T00:00:00Z" }
              as: ProgramAdmin
              as_user_id: "u_admin"
            - call: "POST /funding-sources"
              payload: { kind: "STATE_FUND", name: "Soon expiry large fund", authorized_cents: 10000000, expires_at: "2027-01-31T00:00:00Z", allowable_cost_categories: ["PLUGGING"] }
              as: FundingOfficer
              as_user_id: "u_fund1"
              captures: { fs_soon_second_id: $.data.id }
          trigger:
            - call: "POST /plugging-jobs/${job_id}/funding-commitments"
              payload: {}
              as: FundingOfficer
              as_user_id: "u_fund1"
              captures: { alloc0_id: "$.data[0].id", alloc1_id: "$.data[1].id" }
          assert:
            - "PluggingJob.${job_id}.plugging_cost_estimate_cents == 6070196"
            - "FundingSource.${fs_late_id}.created_at == 2026-08-01T00:00:00Z, FundingSource.${fs_soon_first_id}.created_at == 2026-08-02T00:00:00Z and FundingSource.${fs_soon_second_id}.created_at == 2026-08-03T00:00:00Z"
            - "the call returns HTTP 201 with exactly 2 allocations"
            - "FundingAllocation.${alloc0_id}.source_id == ${fs_soon_first_id}, allocated_cents == 2000000 and waterfall_rank == 1"
            - "FundingAllocation.${alloc1_id}.source_id == ${fs_soon_second_id}, allocated_cents == 4070196 and waterfall_rank == 2"
            - "rank 1 is the 2000000 fund, NOT the 10000000 fund: equal expiry falls back to created_at ascending, not to the largest balance"
            - "FundingSource.${fs_soon_first_id}.committed_cents == 2000000 and status == EXHAUSTED"
            - "FundingSource.${fs_soon_second_id}.committed_cents == 4070196 and status == ACTIVE"
            - "FundingSource.${fs_late_id}.committed_cents == 0 and status == ACTIVE: the earliest-created and smallest fund is never reached because the gap closed at rank 2"
            - "PluggingJob.${job_id}.funded_cents == 6070196 and 2000000 + 4070196 == 6070196"

      - name: bond_forfeiture_chain_is_verified_end_to_end
        claim_type: cascading_side_effects
        grounds:
          - state_machines.Operator.transitions.INSOLVENT_to_REVOKED
          - state_machines.Well.transitions.PRODUCING_to_ORPHAN_CANDIDATE
        excluded_because:
          difficulty_instance: transitive_cascade / bond_forfeiture_cascades_operator_to_funding_source_to_wells_to_scores
          rationale: "That 1.8 instance asserts every hop of the three-level chain in order, from the operator through the minted FundingSource to the wells and their recomputed scores."

      - name: both_priority_score_variants_are_produced_from_one_well_row
        claim_type: dual_variant_calculation
        grounds:
          - calculations.orphan_priority_score.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / well_screening_variant_vs_remediation_variant_diverge_on_one_row
          rationale: "That 1.8 instance pins both variant outputs for one well and the delta the population override creates between them."

  - section: consistency_model
    instances:
      - name: every_write_is_visible_to_the_very_next_read_with_no_lag
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - entities.Well.fields.cumulative_boe_60mo
          - entities.Well.fields.access_status
        distinguishing_aspect: |
          Denormalized well fields are correct in the writing call's own response and in the next
          read, with no second call needed to settle them: the production report answers with the
          unrounded row boe 10.5 while the well already reads 10.50 aggregate, 1 idle month and
          2026-07 as its last month, and the refused duplicate month leaves all three untouched.
        test_recipe:
          setup:
            - "one operator with one PRODUCING well and no production history"
          setup_api_calls:
            - call: "POST /operators"
              payload: { name: "Cottonwood Energy LLC", region_code: "WY", financial_assurance_tier: "INDIVIDUAL", bond_amount_cents: 5000000 }
              as: ProgramAdmin
              as_user_id: "u_admin"
              captures: { op_id: $.data.id }
            - call: "POST /wells"
              payload: { api_well_number: "49-001-28001", operator_id: "${op_id}", spud_year: 1974, total_depth_ft: 2500, casing_strings: 2, methane_scfd: 250, groundwater_depth_ft: 40, population_within_1000ft: 8, surface_disturbance_acres: 2.0 }
              as: FieldInspector
              as_user_id: "u_insp"
              captures: { w_id: $.data.id }
          trigger:
            - call: "POST /wells/${w_id}/production-records"
              payload: { month: "2026-07", oil_bbl: 10.0, gas_mcf: 3.0 }
              as: FieldInspector
              as_user_id: "u_insp"
              captures: { pr_id: $.data.id }
            - call: "GET /wells/${w_id}"
              payload: {}
              as: FieldInspector
              as_user_id: "u_insp"
            - call: "POST /wells/${w_id}/production-records"
              payload: { month: "2026-07", oil_bbl: 99.0, gas_mcf: 0 }
              as: FieldInspector
              as_user_id: "u_insp"
              captures: { e_dup: $.data.error_id }
            - call: "POST /wells/${w_id}/site-accesses"
              payload: { surface_owner_name: "Halvorsen Ranch", mode: "AGREEMENT" }
              as: ProgramAdmin
              as_user_id: "u_admin"
              captures: { sa_id: $.data.id }
          assert:
            - "before the triggers Well.${w_id}.cumulative_boe_60mo == 0, idle_months == 999 and last_production_month == null"
            - "the first call returns HTTP 201 with data.boe == 10.5, the unrounded row value"
            - "the second call returns cumulative_boe_60mo == 10.50, idle_months == 1 and last_production_month == 2026-07, all settled in one read"
            - "the third call returns HTTP 422 with error_id ERR_DUPLICATE_PRODUCTION_MONTH"
            - "immediately after the refusal Well.${w_id}.cumulative_boe_60mo is still 10.50 and GET /wells/${w_id}/production-records returns total_count == 1"
            - "the fourth call returns HTTP 201 with data.status == REQUESTED and the same call's Well read shows access_status == ACCESS_PENDING"
            - "Well.${w_id}.screening_score == 59.90 and remediation_score == 81.00 both before and after the production report: production does not enter the priority score"
