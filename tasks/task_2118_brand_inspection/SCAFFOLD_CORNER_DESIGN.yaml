              as: BoardAdmin
            - call: "POST /brand-inspection/brand-applications"
              payload: { owner_id: "${own_a}", application_type: "NEW", brand_symbol: "CF", position_code: "RIGHT_RIB", species_class: "CATTLE", state_code: "MT", documented_prior_use_years: 12, prior_use_affidavit_on_file: false }
              as: LivestockOwner
