          Revoking a COMMITTED allocation must return the interval and the partner to their exact
          pre-commit numbers: partner_committed_volume 50 -> 0, unserved_volume 32 -> 82,
          committed_volume_outstanding 50 -> 0 -- while leaving every settlement column null and
          invoice_total_cents at 0, because a revoked allocation is never billed. An
          implementation that treats revoke as a settlement of zero writes settlement columns and
          fails the invariant.
