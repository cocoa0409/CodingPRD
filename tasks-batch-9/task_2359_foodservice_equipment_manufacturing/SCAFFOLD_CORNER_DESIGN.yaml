        grounds:
          - endpoints["PATCH /equipment-models/{id}"]
          - endpoints["GET /equipment-models/{id}"]
          - entities.EquipmentModel
        distinguishing_aspect: "PATCH is partial and version-bumping: sending only base_price_cents leaves supported_controls_packages and rated_throughput_units_per_hour at their created values, moves version 1 -> 2, leaves created_at untouched, and the new base is what a configuration created afterwards prices against (2000060 at volume 250 -> 1840055)."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; ELECTRIC model FRY-900 created with base 1850020, supported_controls_packages ['STANDARD_DIAL', 'TOUCH_PRO'] and rated throughput 120; ChainAccount CHN-1 at volume 250."
