            - "${err} == ERR_BELOW_MIN_ORDER_QTY"
            - "HTTP status == 422 for the quantity 24 attempt"
            - "no ToolOrder row exists with order_code SO-BELOW-MIN"
            - "ToolProduct.${product_id}.open_order_units == 25"

      - name: sinter_density_and_yield_exactly_at_minimum
        grounds:
          - calculations.sinter_qc_evaluation
          - entities.PowderBlendBatch.fields.yield_pct
          - entities.PowderBlendBatch.fields.qc_status
          - state_machines.PowderBlendBatch.PENDING_to_PASSED
          - state_machines.PowderBlendBatch.PENDING_to_FAILED
        distinguishing_aspect: |
          Different metrics on a different endpoint (POST /tooling/powder-blend-batches/{batchId}/sinter):
          sintered density in g/cc against MIN_SINTER_DENSITY_GCC 14.35 and 2-decimal sinter yield
          against MIN_YIELD_PCT 85.00. 14.35 exactly passes while 14.34 fails; 85.00 exactly passes
          while 84.50 fails — and each failing case has the other metric sitting exactly on its bound,
          so only one criterion can explain each verdict.
        test_recipe:
          setup:
            - "One CarbideGrade WC-P25 with hardness_hv 1600 (HARDNESS_TOLERANCE_HV 75, so 1580 is always inside tolerance)"
            - "Three separate batches, each pressed to exactly 200 units so the yield denominator is fixed"
          setup_api_calls:
            - call: "POST /tooling/carbide-grades"
              payload: { grade_code: "WC-P25", target_workpiece_group: "P", co_binder_pct: 6.0, wc_grain_um: 1.2, hardness_hv: 1600, trs_mpa: 2100 }
              as: MetallurgyEngineer
              captures: { grade_id: $.data.id }
            - call: "POST /tooling/powder-blend-batches"
              payload: { grade_id: "${grade_id}", batch_code: "BLD-A", planned_mass_kg: 120.0 }
              as: MetallurgyEngineer
              captures: { batch_a: $.data.id }
            - call: "POST /tooling/powder-blend-batches/${batch_a}/press"
              payload: { pressed_units: 200 }
              as: MetallurgyEngineer
            - call: "POST /tooling/powder-blend-batches"
              payload: { grade_id: "${grade_id}", batch_code: "BLD-B", planned_mass_kg: 120.0 }
              as: MetallurgyEngineer
              captures: { batch_b: $.data.id }
            - call: "POST /tooling/powder-blend-batches/${batch_b}/press"
              payload: { pressed_units: 200 }
              as: MetallurgyEngineer
            - call: "POST /tooling/powder-blend-batches"
              payload: { grade_id: "${grade_id}", batch_code: "BLD-C", planned_mass_kg: 120.0 }
              as: MetallurgyEngineer
              captures: { batch_c: $.data.id }
            - call: "POST /tooling/powder-blend-batches/${batch_c}/press"
              payload: { pressed_units: 200 }
              as: MetallurgyEngineer
          trigger:
            - call: "POST /tooling/powder-blend-batches/${batch_a}/sinter"
              payload: { sintered_units: 180, scrap_units: 20, measured_density_gcc: 14.35, measured_hardness_hv: 1580 }
              as: MetallurgyEngineer
            - call: "POST /tooling/powder-blend-batches/${batch_b}/sinter"
              payload: { sintered_units: 170, scrap_units: 30, measured_density_gcc: 14.34, measured_hardness_hv: 1580 }
              as: MetallurgyEngineer
            - call: "POST /tooling/powder-blend-batches/${batch_c}/sinter"
              payload: { sintered_units: 169, scrap_units: 31, measured_density_gcc: 14.35, measured_hardness_hv: 1580 }
              as: MetallurgyEngineer
          assert:
            - "PowderBlendBatch.${batch_a}.yield_pct == 90.00 and qc_status == PASSED"
            - "PowderBlendBatch.${batch_b}.yield_pct == 85.00 and qc_status == FAILED"
            - "PowderBlendBatch.${batch_c}.yield_pct == 84.50 and qc_status == FAILED"
            - "PowderBlendBatch.${batch_a}.stage == SINTERED and remaining_units == 180"
            - "PowderBlendBatch.${batch_b}.stage == SINTERED (a QC failure does not roll back the stage dimension)"
            - "CarbideGrade.${grade_id}.status == DRAFT (sintering alone never promotes the grade)"

