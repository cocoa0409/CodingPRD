  # ================================================================= rbac ====
  - section: rbac
    instances:
      - name: missing_auth_headers_returns_401
        claim_type: violation_to_error
        grounds:
          - validations[priority=1]
          - errors[ERR_UNAUTHENTICATED]
        distinguishing_aspect: "A request without X-User-Role/X-User-ID is rejected 401 before any role or existence check."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /port-ops/terminals", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_UNAUTHENTICATED (401); no data returned"
      - name: wrong_role_actions_forbidden
        claim_type: violation_to_error
        grounds:
          - validations[priority=2]
          - errors[ERR_FORBIDDEN]
        distinguishing_aspect: "VesselAgent may not confirm berth assignments; BillingClerk may not arrive a call; CustomsOfficer may not board passengers — all ERR_FORBIDDEN (403)."
        test_recipe:
          setup: ["Call SCHEDULED with TENTATIVE assignment"]
          setup_api_calls:
            - { call: "POST /port-ops/terminals", payload: { name: "T1", max_apron_slots: 4, taxi_dispatch_capacity_per_window: 2 }, as: PortAuthorityAdmin, captures: { term: $.data.id } }
            - { call: "POST /port-ops/berths", payload: { terminal_id: "${term}", berth_code: "B1", length_ft: 1200, max_draft_ft: 40.0 }, as: PortAuthorityAdmin, captures: { b1: $.data.id } }
            - { call: "POST /port-ops/vessels", payload: { terminal_id: "${term}", name: "MV A", loa_ft: 950, draft_ft: 30.0, pax_capacity: 4000, crew_count: 900 }, as: PortAuthorityAdmin, captures: { ves: $.data.id } }
            - { call: "POST /port-ops/port-calls", payload: { terminal_id: "${term}", vessel_id: "${ves}", voyage_ref: "V1", scheduled_eta: "2026-08-10T08:00:00Z", scheduled_etd: "2026-08-10T20:00:00Z", booked_embark_pax: 10, booked_debark_pax: 10 }, as: VesselAgent, as_user_id: "${ves}", captures: { pc: $.data.id, pc_v: $.data.version } }
            - { call: "POST /port-ops/port-calls/${pc}/berth-assignments", payload: { berth_id: "${b1}", window_start: "2026-08-10T06:00:00Z", window_end: "2026-08-10T22:00:00Z", expected_port_call_version: "${pc_v}" }, as: Harbormaster, captures: { ba: $.data.id } }
          trigger:
            - { call: "POST /port-ops/berth-assignments/${ba}/confirm", as: VesselAgent, as_user_id: "${ves}", captures: { err1: $.data.error_id } }
            - { call: "POST /port-ops/port-calls/${pc}/arrive", payload: { actual_eta: "2026-08-10T08:00:00Z" }, as: BillingClerk, captures: { err2: $.data.error_id } }
            - { call: "POST /port-ops/manifest-entries/00000000-0000-0000-0000-000000000000/board", as: CustomsOfficer, captures: { err3: $.data.error_id } }
          assert:
            - "err1 == ERR_FORBIDDEN and err2 == ERR_FORBIDDEN"
            - "err3 == ERR_FORBIDDEN (role check precedes existence — CustomsOfficer may never board)"
      - name: vessel_agent_scope_enforced
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=4]
          - errors[ERR_VESSEL_SCOPE]
          - roles[VesselAgent]
        distinguishing_aspect: "entity_backed identity: VesselAgent of vessel B cannot delay or even GET vessel A's call (ERR_VESSEL_SCOPE), and its list view is filtered to own-vessel calls."
        test_recipe:
          setup: ["Vessels A and B; call VA belongs to vessel A"]
          setup_api_calls:
            - { call: "POST /port-ops/terminals", payload: { name: "T1", max_apron_slots: 4, taxi_dispatch_capacity_per_window: 2 }, as: PortAuthorityAdmin, captures: { term: $.data.id } }
            - { call: "POST /port-ops/vessels", payload: { terminal_id: "${term}", name: "MV A", loa_ft: 950, draft_ft: 30.0, pax_capacity: 4000, crew_count: 900 }, as: PortAuthorityAdmin, captures: { vesA: $.data.id } }
            - { call: "POST /port-ops/vessels", payload: { terminal_id: "${term}", name: "MV B", loa_ft: 900, draft_ft: 28.0, pax_capacity: 3000, crew_count: 800 }, as: PortAuthorityAdmin, captures: { vesB: $.data.id } }
            - { call: "POST /port-ops/port-calls", payload: { terminal_id: "${term}", vessel_id: "${vesA}", voyage_ref: "VA", scheduled_eta: "2026-08-10T08:00:00Z", scheduled_etd: "2026-08-10T20:00:00Z", booked_embark_pax: 10, booked_debark_pax: 10 }, as: VesselAgent, as_user_id: "${vesA}", captures: { pca: $.data.id } }
          trigger:
            - { call: "POST /port-ops/port-calls/${pca}/delay", payload: { revised_eta: "2026-08-11T08:00:00Z", revised_etd: "2026-08-11T20:00:00Z", reason: "slow steaming" }, as: VesselAgent, as_user_id: "${vesB}", captures: { err1: $.data.error_id } }
            - { call: "GET /port-ops/port-calls/${pca}", as: VesselAgent, as_user_id: "${vesB}", captures: { err2: $.data.error_id } }
            - { call: "GET /port-ops/port-calls", payload: { terminal_id: "${term}" }, as: VesselAgent, as_user_id: "${vesB}" }
          assert:
            - "err1 == ERR_VESSEL_SCOPE and err2 == ERR_VESSEL_SCOPE (403)"
            - "List as vessel B's agent: total_count == 0 (call of vessel A filtered out)"

  # ================================================== cross-cutting layers ====
  - section: cross_cutting_layers
    instances:
      - name: occ_berth_assignment_supersede_stale_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[berth-assignment-supersede-stale-call]
        distinguishing_aspect: "Create-with-supersede: a second create carrying the pre-first-create version is rejected ERR_STALE_VERSION (412); carrying the current version succeeds and SUPERSEDES the first assignment."
        test_recipe:
          setup: ["Call V1 SCHEDULED, version 1 captured at create"]
          setup_api_calls:
            - { call: "POST /port-ops/terminals", payload: { name: "T1", max_apron_slots: 4, taxi_dispatch_capacity_per_window: 2 }, as: PortAuthorityAdmin, captures: { term: $.data.id } }
            - { call: "POST /port-ops/berths", payload: { terminal_id: "${term}", berth_code: "B1", length_ft: 1200, max_draft_ft: 40.0 }, as: PortAuthorityAdmin, captures: { b1: $.data.id } }
            - { call: "POST /port-ops/vessels", payload: { terminal_id: "${term}", name: "MV A", loa_ft: 950, draft_ft: 30.0, pax_capacity: 4000, crew_count: 900 }, as: PortAuthorityAdmin, captures: { ves: $.data.id } }
            - { call: "POST /port-ops/port-calls", payload: { terminal_id: "${term}", vessel_id: "${ves}", voyage_ref: "V1", scheduled_eta: "2026-08-10T08:00:00Z", scheduled_etd: "2026-08-10T20:00:00Z", booked_embark_pax: 10, booked_debark_pax: 10 }, as: VesselAgent, as_user_id: "${ves}", captures: { pc: $.data.id, pc_v1: $.data.version } }
          trigger:
            - { call: "POST /port-ops/port-calls/${pc}/berth-assignments", payload: { berth_id: "${b1}", window_start: "2026-08-10T06:00:00Z", window_end: "2026-08-10T22:00:00Z", expected_port_call_version: "${pc_v1}" }, as: Harbormaster, captures: { ba1: $.data.id } }
            - { call: "GET /port-ops/port-calls/${pc}", as: Harbormaster, captures: { pc_v2: $.data.version } }
            - { call: "POST /port-ops/port-calls/${pc}/berth-assignments", payload: { berth_id: "${b1}", window_start: "2026-08-10T05:00:00Z", window_end: "2026-08-10T23:00:00Z", expected_port_call_version: "${pc_v1}" }, as: Harbormaster, captures: { err: $.data.error_id } }
            - { call: "POST /port-ops/port-calls/${pc}/berth-assignments", payload: { berth_id: "${b1}", window_start: "2026-08-10T05:00:00Z", window_end: "2026-08-10T23:00:00Z", expected_port_call_version: "${pc_v2}" }, as: Harbormaster, captures: { ba2: $.data.id } }
            - { call: "GET /port-ops/berth-assignments/${ba1}", as: Harbormaster, captures: { ba1_st: $.data.status } }
            - { call: "GET /port-ops/port-calls/${pc}", as: Harbormaster, captures: { pc_v3: $.data.version } }
          assert:
            - "First create with version 1 succeeds (call version advances to 2)"
            - "Second create still carrying version 1: err == ERR_STALE_VERSION (412)"
            - "Retry with current version 2: succeeds; ba1_st == SUPERSEDED (supersede semantics) and new assignment TENTATIVE"
            - "pc_v3 == 3 (each successful supersede bumps the parent version by exactly 1)"
      - name: occ_invoice_adjustment_stale_version
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[invoice-adjustment-stale-invoice]
        distinguishing_aspect: "A second adjustment carrying the pre-first-adjustment version is rejected ERR_STALE_INVOICE_VERSION (412); the first posted credit is not disturbed."
        test_recipe:
          setup: ["PROVISIONAL invoice ISSUED, version captured after issue"]
          setup_api_calls:
            - { call: "POST /port-ops/terminals", payload: { name: "T1", max_apron_slots: 4, taxi_dispatch_capacity_per_window: 2 }, as: PortAuthorityAdmin, captures: { term: $.data.id } }
            - { call: "POST /port-ops/berths", payload: { terminal_id: "${term}", berth_code: "B1", length_ft: 1200, max_draft_ft: 40.0 }, as: PortAuthorityAdmin, captures: { b1: $.data.id } }
            - { call: "POST /port-ops/vessels", payload: { terminal_id: "${term}", name: "MV A", loa_ft: 950, draft_ft: 30.0, pax_capacity: 4000, crew_count: 900 }, as: PortAuthorityAdmin, captures: { ves: $.data.id } }
            - { call: "POST /port-ops/port-calls", payload: { terminal_id: "${term}", vessel_id: "${ves}", voyage_ref: "V1", scheduled_eta: "2026-08-10T08:00:00Z", scheduled_etd: "2026-08-10T20:00:00Z", booked_embark_pax: 100, booked_debark_pax: 100 }, as: VesselAgent, as_user_id: "${ves}", captures: { pc: $.data.id, pc_v: $.data.version } }
            - { call: "POST /port-ops/port-calls/${pc}/berth-assignments", payload: { berth_id: "${b1}", window_start: "2026-08-10T06:00:00Z", window_end: "2026-08-10T22:00:00Z", expected_port_call_version: "${pc_v}" }, as: Harbormaster, captures: { ba: $.data.id } }
            - { call: "POST /port-ops/berth-assignments/${ba}/confirm", as: Harbormaster }
            - { call: "POST /port-ops/port-calls/${pc}/provisional-invoice", as: BillingClerk, captures: { inv: $.data.id } }
            - { call: "POST /port-ops/invoices/${inv}/issue", as: BillingClerk }
            - { call: "GET /port-ops/invoices/${inv}", as: BillingClerk, captures: { iv2: $.data.version } }
          trigger:
            - { call: "POST /port-ops/invoices/${inv}/adjustments", payload: { amount_cents: 5000, reason: "goodwill", expected_invoice_version: "${iv2}" }, as: BillingClerk, captures: { tot1: $.data.total_cents } }
            - { call: "POST /port-ops/invoices/${inv}/adjustments", payload: { amount_cents: 5000, reason: "stale retry", expected_invoice_version: "${iv2}" }, as: BillingClerk, captures: { err: $.data.error_id } }
          assert:
            - "First adjustment posts: tot1 == 1690000 (1695000 - 5000)"
            - "Second adjustment with the same observed version: err == ERR_STALE_INVOICE_VERSION (412)"
            - "adjustments_total_cents == 5000 (the stale retry did not double-post)"
      - name: ops_run_checkpoint_sweep
        claim_type: ops_run_checkpoint
        grounds:
          - calculations.terminal_posture
          - state_machines.WeatherAdvisory.ACTIVE_to_EXPIRED
          - state_machines.BerthAssignment.TENTATIVE_to_EXPIRED
        distinguishing_aspect: "run-ops advances the epoch: stale WARNING advisory -> EXPIRED (posture drops back to OPERATIONAL), TENTATIVE assignment whose window started in the past -> EXPIRED, ops_run_index 0 -> 1."
        test_recipe:
          setup:
            - "Terminal; berth; call V1 (eta 2026-08-01T06:30 etd 2026-08-01T12:30); TENTATIVE assignment window [2026-08-01T06:00, 2026-08-01T18:00]; WARNING advisory [2026-08-01T00:00, 2026-08-02T00:00] ACTIVE (posture CONSTRAINED at default now)"
          setup_api_calls:
            - { call: "POST /port-ops/terminals", payload: { name: "T1", max_apron_slots: 4, taxi_dispatch_capacity_per_window: 2 }, as: PortAuthorityAdmin, captures: { term: $.data.id } }
            - { call: "POST /port-ops/berths", payload: { terminal_id: "${term}", berth_code: "B1", length_ft: 1200, max_draft_ft: 40.0 }, as: PortAuthorityAdmin, captures: { b1: $.data.id } }
            - { call: "POST /port-ops/vessels", payload: { terminal_id: "${term}", name: "MV A", loa_ft: 950, draft_ft: 30.0, pax_capacity: 4000, crew_count: 900 }, as: PortAuthorityAdmin, captures: { ves: $.data.id } }
            - { call: "POST /port-ops/port-calls", payload: { terminal_id: "${term}", vessel_id: "${ves}", voyage_ref: "V1", scheduled_eta: "2026-08-01T06:30:00Z", scheduled_etd: "2026-08-01T12:30:00Z", booked_embark_pax: 10, booked_debark_pax: 10 }, as: VesselAgent, as_user_id: "${ves}", captures: { pc: $.data.id, pc_v: $.data.version } }
            - { call: "POST /port-ops/port-calls/${pc}/berth-assignments", payload: { berth_id: "${b1}", window_start: "2026-08-01T06:00:00Z", window_end: "2026-08-01T18:00:00Z", expected_port_call_version: "${pc_v}" }, as: Harbormaster, captures: { ba: $.data.id } }
            - { call: "POST /port-ops/weather-advisories", payload: { terminal_id: "${term}", severity: "WARNING", window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-02T00:00:00Z" }, as: PortAuthorityAdmin, captures: { adv: $.data.id } }
            - { call: "GET /port-ops/terminals/${term}", as: PortAuthorityAdmin, captures: { p0: $.data.posture, ops0: $.data.ops_run_index } }
            - { call: "POST /port-ops/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: PortAuthorityAdmin }
          trigger:
            - { call: "POST /port-ops/terminals/${term}/run-ops", as: PortAuthorityAdmin, captures: { ops1: $.data.ops_run_index } }
            - { call: "GET /port-ops/weather-advisories/${adv}", as: PortAuthorityAdmin, captures: { advst: $.data.status } }
            - { call: "GET /port-ops/berth-assignments/${ba}", as: Harbormaster, captures: { bast: $.data.status } }
            - { call: "GET /port-ops/terminals/${term}", as: PortAuthorityAdmin, captures: { p1: $.data.posture } }
          assert:
            - "p0 == CONSTRAINED and ops0 == 0 (WARNING active before the sweep)"
            - "ops1 == 1; advst == EXPIRED (window ended 2026-08-02 <= now); bast == EXPIRED (window_start 2026-08-01T06:00 <= now)"
            - "p1 == OPERATIONAL (advisory gone, berth free)"

  # ======================================================= consistency model ====
  - section: consistency_model
    instances:
      - name: immediate_read_after_write_consistency
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
        distinguishing_aspect: "Immediate consistency: a created berth is visible in the very next GET, and the terminal's computed active_berth_count/free_berth_count already reflect it."
        test_recipe:
          setup: ["Terminal exists"]
          setup_api_calls:
            - { call: "POST /port-ops/terminals", payload: { name: "T1", max_apron_slots: 4, taxi_dispatch_capacity_per_window: 2 }, as: PortAuthorityAdmin, captures: { term: $.data.id } }
            - { call: "POST /port-ops/berths", payload: { terminal_id: "${term}", berth_code: "B1", length_ft: 1200, max_draft_ft: 40.0 }, as: PortAuthorityAdmin, captures: { b1: $.data.id } }
          trigger:
            - { call: "GET /port-ops/berths/${b1}", as: Harbormaster, captures: { st: $.data.status } }
            - { call: "GET /port-ops/terminals/${term}", as: Harbormaster, captures: { abc: $.data.active_berth_count, fbc: $.data.free_berth_count } }
          assert:
            - "st == ACTIVE (creation response fields match the immediate read)"
            - "abc == 1 and fbc == 1 in the same request sequence (no eventual lag)"
