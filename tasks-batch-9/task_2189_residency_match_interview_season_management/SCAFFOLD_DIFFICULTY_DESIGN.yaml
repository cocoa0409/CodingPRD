      - name: pipeline_report_zero_cohort_skips_division_and_one_decimal_half_up
        grounds:
          - calculations.pipeline_diversity_report
          - endpoints.GET_/programs/{id}/pipeline-report
          - state_machines.Application.RECEIVED_to_WITHDRAWN
        boundary_values:
          - "cohort_size 0 → no division is performed; every rate is exactly 0.0 and group_buckets is []"
          - "cohort_size 3, one IMG → 1 / 3 * 100 = 33.3333... → round_half_up to 1 decimal = 33.3"
          - "cohort_size 2 after one WITHDRAWN application drops out → 1 / 2 * 100 = 50.0"
        distinguishing_aspect: |
          The zero-cohort case is the hard boundary: dividing by cohort_size at all raises
          ZeroDivisionError, and returning null or 404 instead of 200 with 0.0 is equally wrong.
          The populated case pins the precision at 1 decimal place round-half-up (33.3, not 33 and
          not 33.33), and withdrawing one application moves the denominator from 3 to 2 because
          WITHDRAWN rows are excluded from every figure in the report.
        test_recipe:
          setup:
            - "one Program with no applications at all, for the empty-cohort read"
            - "then three applications, all left in RECEIVED: cand1 US_MD alum GROUP_A, cand2 IMG non-alum GROUP_B, cand3 US_DO non-alum with no self_identified_group"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: NrmpAdmin
            - call: "POST /programs"
