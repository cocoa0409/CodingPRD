        grounds:
          - validations[priority=80, error_id=ERR_DUPLICATE_ANIMAL_LOCAL_ID]
          - entities.Animal.fields.local_id
        distinguishing_aspect: "The uniqueness scope is (holding institution, local_id), not local_id alone: the very same CR-101 string is accepted at Harbor Bay Zoo while it is already in use at Cedar Ridge Zoo."
        test_recipe:
