    instances:
      - name: starter_kit_tax_basis_switches_with_the_facilitator_agreement
        claim_type: Correct Result
        grounds: ["calculations.starter_kit_charge", "entities.TaxJurisdiction"]
        distinguishing_aspect: "The facilitator agreement moves the tax basis from wholesale to SRP, so the same kit costs 551 cents more in a facilitator state."
        test_recipe:
          setup:
            - "PLAN-A at defaults, KIT-STD (wholesale 9900, SRP 14900), and two jurisdictions: TX at 825 bp with facilitator_agreement_active true, NV at 685 bp with it false."
            - "Two applications are created, differing only in applicant_state_code."
          setup_api_calls:
          - call: "POST /direct-selling/compensation-plans"
            payload: { plan_code: "PLAN-A", name: "Consultant Plan A" }
            as: PlatformAdmin
            captures: { plan_id: "$.data.id", plan_ver: "$.data.version" }
          - call: "POST /direct-selling/tax-jurisdictions"
            payload: { state_code: "TX", tax_rate_bp: 825, facilitator_agreement_active: true }
            as: PlatformAdmin
          - call: "POST /direct-selling/tax-jurisdictions"
            payload: { state_code: "NV", tax_rate_bp: 685, facilitator_agreement_active: false }
            as: PlatformAdmin
          - call: "POST /direct-selling/products"
            payload: { sku: "KIT-STD", name: "Starter Kit", wholesale_price_cents: 9900, srp_cents: 14900, volume_points_per_unit: 0, is_starter_kit: true }
            as: PlatformAdmin
            captures: { kit_id: "$.data.id" }
          trigger:
          - call: "POST /direct-selling/enrollment-applications"
            payload: { applicant_email: "tex@ex.test", applicant_full_name: "Tex Facilitator", applicant_state_code: "TX", compensation_plan_id: "${plan_id}", starter_kit_product_id: "${kit_id}" }
            as: PlatformAdmin
            captures: { tx_charge: "$.data.kit_charge_cents", tx_tax: "$.data.kit_tax_cents", tx_total: "$.data.kit_total_cents" }
          - call: "POST /direct-selling/enrollment-applications"
            payload: { applicant_email: "nev@ex.test", applicant_full_name: "Nev Netprice", applicant_state_code: "NV", compensation_plan_id: "${plan_id}", starter_kit_product_id: "${kit_id}" }
            as: PlatformAdmin
            captures: { nv_charge: "$.data.kit_charge_cents", nv_tax: "$.data.kit_tax_cents", nv_total: "$.data.kit_total_cents" }
          assert:
            - "tx_charge == 9900 and nv_charge == 9900: the kit charge itself never depends on tax"
            - "tx_tax == 1229 == rhu(14900 * 825 / 10000) — the SRP basis, because the facilitator remits on suggested retail price"
            - "nv_tax == 678 == rhu(9900 * 685 / 10000) — the NET_PRICE basis, because without a facilitator agreement the consultant is the remitter and tax rides on the wholesale price"
            - "tx_total == 11129 and nv_total == 10578"
            - "raising the SRP basis makes TX dearer despite a higher NV-style rate would not: 825 bp on 14900 (1229) exceeds 685 bp on 9900 (678) by 551 cents"

