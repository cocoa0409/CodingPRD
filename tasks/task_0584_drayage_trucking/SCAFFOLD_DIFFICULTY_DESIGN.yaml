# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Drayage & Container Trucking — 9 rules x 2 instances = 18 instances
# All grounds resolve into SCAFFOLD.yaml §1.1-§1.7. All setup_api_calls use
# only §1.5 endpoints. Clock default 2026-05-01T00:00:00Z.
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: demurrage_estimate_vs_actual_on_booking
        grounds:
          - calculations.demurrage_accrued
          - entities.Booking.fields.demurrage_estimate_cents
          - entities.Booking.fields.demurrage_actual_cents
          - state_machines.Booking.CHASSIS_ASSIGNED_to_APPOINTED
          - state_machines.Booking.APPOINTED_to_DISPATCHED
        distinguishing_aspect: "Demurrage estimate (basis scheduled_pickup_at 2026-05-13 -> 3 days) and actual (basis actual_pickup_at 2026-05-15 -> 5 days) diverge on the Booking cost-accounting domain, distinct from the Chassis per-diem domain."
        test_recipe:
          setup:
            - "Terminal demurrage_daily_rate_cents=12500; Booking LFD=2026-05-10; PICKUP appointment window 2026-05-13T08:00Z..2026-05-15T23:59:59Z locks estimate=40314; chassis assigned; pickup leg dispatched at clock 2026-05-15T10:00Z -> actual=67190."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-06T00:00:00Z" }, as: Dispatcher }
            - { call: "POST /terminals", payload: { name: "Pier A", code: "PIERA", demurrage_daily_rate_cents: 12500 }, as: Dispatcher, captures: { term_id: "$.data.id" } }
            - { call: "POST /chassis", payload: { chassis_number: "CHX1", pool_scac: "POOL", per_diem_rate_cents: 8500, free_days: 4 }, as: Dispatcher, captures: { chx_id: "$.data.id" } }
            - { call: "POST /drivers", payload: { name: "Del One", license_number: "L1" }, as: Dispatcher, captures: { drv_id: "$.data.id" } }
            - { call: "POST /bookings", payload: { container_number: "MSCU1", direction: "IMPORT", origin_terminal_id: "${term_id}", last_free_day: "2026-05-10T00:00:00Z", linehaul_base_cents: 45000 }, as: Dispatcher, captures: { bkg_id: "$.data.id" } }
            - { call: "POST /bookings/${bkg_id}/confirm", payload: {}, as: Dispatcher, captures: { bkg_v: "$.data.version" } }
            - { call: "POST /bookings/${bkg_id}/assign-chassis", payload: { chassis_id: "${chx_id}", expected_booking_version: "${bkg_v}" }, as: Dispatcher }
            - { call: "POST /appointments", payload: { booking_id: "${bkg_id}", terminal_id: "${term_id}", purpose: "PICKUP", window_start: "2026-05-13T08:00:00Z", window_end: "2026-05-15T23:59:59Z" }, as: Dispatcher, captures: { appt_id: "$.data.id" } }
            - { call: "POST /legs", payload: { booking_id: "${bkg_id}", driver_id: "${drv_id}", leg_type: "PICKUP", appointment_id: "${appt_id}", window_start: "2026-05-15T09:00:00Z", window_end: "2026-05-15T12:00:00Z" }, as: Dispatcher, captures: { leg_id: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-15T10:00:00Z" }, as: Dispatcher }
          trigger:
            - { call: "POST /legs/${leg_id}/dispatch", payload: {}, as: Dispatcher }
          assert:
            - "Booking.${bkg_id}.demurrage_estimate_cents == 40314"
            - "Booking.${bkg_id}.demurrage_actual_cents == 67190"
            - "Booking.${bkg_id}.demurrage_estimate_cents != Booking.${bkg_id}.demurrage_actual_cents"

      - name: per_diem_provisional_vs_final_on_chassis
        grounds:
          - calculations.per_diem_accrued
          - entities.Chassis.fields.per_diem_provisional_cents
          - entities.Chassis.fields.per_diem_final_cents
          - state_machines.Chassis.OUT_to_AVAILABLE
        distinguishing_aspect: "Per-diem provisional (basis current clock 2026-05-21 -> 17000) and final (basis returned_at 2026-05-24 -> 42500) diverge on the Chassis equipment domain, a different entity domain from Booking demurrage."
        test_recipe:
          setup:
            - "Chassis per_diem_rate_cents=8500 free_days=4; goes OUT at pickup dispatch 2026-05-15; provisional read at clock 2026-05-21 (6 days out -> 2 chargeable -> 17000); RETURN leg completes at clock 2026-05-24 (9 days out -> 5 chargeable -> 42500)."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-15T00:00:00Z" }, as: Dispatcher }
            - { call: "POST /terminals", payload: { name: "Pier B", code: "PIERB", demurrage_daily_rate_cents: 12500 }, as: Dispatcher, captures: { term_id: "$.data.id" } }
            - { call: "POST /chassis", payload: { chassis_number: "CHX2", pool_scac: "POOL", per_diem_rate_cents: 8500, free_days: 4 }, as: Dispatcher, captures: { chx_id: "$.data.id" } }
            - { call: "POST /drivers", payload: { name: "Del Two", license_number: "L2" }, as: Dispatcher, captures: { drv_id: "$.data.id" } }
            - { call: "POST /bookings", payload: { container_number: "MSCU2", direction: "IMPORT", origin_terminal_id: "${term_id}", last_free_day: "2026-06-30T00:00:00Z", linehaul_base_cents: 45000 }, as: Dispatcher, captures: { bkg_id: "$.data.id" } }
            - { call: "POST /bookings/${bkg_id}/confirm", payload: {}, as: Dispatcher, captures: { bkg_v: "$.data.version" } }
            - { call: "POST /bookings/${bkg_id}/assign-chassis", payload: { chassis_id: "${chx_id}", expected_booking_version: "${bkg_v}" }, as: Dispatcher }
            - { call: "POST /appointments", payload: { booking_id: "${bkg_id}", terminal_id: "${term_id}", purpose: "PICKUP", window_start: "2026-05-15T06:00:00Z", window_end: "2026-05-30T23:59:59Z" }, as: Dispatcher, captures: { appt_id: "$.data.id" } }
            - { call: "POST /legs", payload: { booking_id: "${bkg_id}", driver_id: "${drv_id}", leg_type: "PICKUP", appointment_id: "${appt_id}", window_start: "2026-05-15T08:00:00Z", window_end: "2026-05-15T12:00:00Z" }, as: Dispatcher, captures: { leg_pick_id: "$.data.id" } }
            - { call: "POST /legs/${leg_pick_id}/dispatch", payload: {}, as: Dispatcher }
            - { call: "POST /legs/${leg_pick_id}/complete", payload: {}, as: Dispatcher }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-21T00:00:00Z" }, as: Dispatcher }
            - { call: "GET /chassis/${chx_id}", payload: {}, as: Dispatcher, captures: { pp: "$.data.per_diem_provisional_cents" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-24T00:00:00Z" }, as: Dispatcher }
            - { call: "POST /legs", payload: { booking_id: "${bkg_id}", driver_id: "${drv_id}", leg_type: "RETURN", window_start: "2026-05-24T08:00:00Z", window_end: "2026-05-24T12:00:00Z" }, as: Dispatcher, captures: { leg_ret_id: "$.data.id" } }
            - { call: "POST /legs/${leg_ret_id}/dispatch", payload: {}, as: Dispatcher }
          trigger:
            - { call: "POST /legs/${leg_ret_id}/complete", payload: {}, as: Dispatcher }
          assert:
            - "captured pp == 17000"
            - "Chassis.${chx_id}.per_diem_final_cents == 42500"
            - "Booking.${bkg_id}.per_diem_final_cents == 42500"
            - "pp (17000) != Chassis.${chx_id}.per_diem_final_cents (42500)"

  - rule_id: combinatorial_formula
    instances:
      - name: invoice_total_discount_fuel_floor_mode_a
        grounds:
          - calculations.invoice_total
          - entities.Invoice.fields.effective_linehaul_cents
          - entities.Invoice.fields.fuel_surcharge_cents
          - entities.Invoice.fields.total_charge_cents
          - entities.AccessorialCharge.fields.amount_cents
        distinguishing_aspect: "Mode (a): >=3 inputs (linehaul 120000, FUEL_PCT, two accessorials) with a conditional volume-discount branch and nested max() floor; pinned order discount->fuel->sum->floor yields total 151760."
        test_recipe:
          setup:
            - "Booking linehaul_base_cents=120000 (>= VOLUME_THRESHOLD 100000) -> effective 108000; fuel round(108000*0.22)=23760; accessorials 12000+8000=20000; demurrage 0 (LFD future); per_diem 0 (not returned). subtotal=151760, floor 50000 -> total 151760. Booking reaches DELIVERED."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-06T00:00:00Z" }, as: Dispatcher }
            - { call: "POST /terminals", payload: { name: "Pier C", code: "PIERC", demurrage_daily_rate_cents: 12500 }, as: Dispatcher, captures: { term_id: "$.data.id" } }
            - { call: "POST /chassis", payload: { chassis_number: "CHX3", pool_scac: "POOL", per_diem_rate_cents: 8500, free_days: 4 }, as: Dispatcher, captures: { chx_id: "$.data.id" } }
            - { call: "POST /drivers", payload: { name: "Del Three", license_number: "L3" }, as: Dispatcher, captures: { drv_id: "$.data.id" } }
            - { call: "POST /bookings", payload: { container_number: "MSCU3", direction: "IMPORT", origin_terminal_id: "${term_id}", last_free_day: "2026-06-30T00:00:00Z", linehaul_base_cents: 120000 }, as: Dispatcher, captures: { bkg_id: "$.data.id" } }
            - { call: "POST /bookings/${bkg_id}/confirm", payload: {}, as: Dispatcher, captures: { bkg_v: "$.data.version" } }
            - { call: "POST /bookings/${bkg_id}/assign-chassis", payload: { chassis_id: "${chx_id}", expected_booking_version: "${bkg_v}" }, as: Dispatcher }
            - { call: "POST /appointments", payload: { booking_id: "${bkg_id}", terminal_id: "${term_id}", purpose: "PICKUP", window_start: "2026-05-06T08:00:00Z", window_end: "2026-05-20T23:59:59Z" }, as: Dispatcher, captures: { appt_id: "$.data.id" } }
            - { call: "POST /legs", payload: { booking_id: "${bkg_id}", driver_id: "${drv_id}", leg_type: "PICKUP", appointment_id: "${appt_id}", window_start: "2026-05-06T09:00:00Z", window_end: "2026-05-06T12:00:00Z" }, as: Dispatcher, captures: { leg_id: "$.data.id" } }
            - { call: "POST /legs/${leg_id}/dispatch", payload: {}, as: Dispatcher }
            - { call: "POST /legs/${leg_id}/complete", payload: {}, as: Dispatcher }
            - { call: "POST /invoices", payload: { booking_id: "${bkg_id}" }, as: Biller, captures: { inv_id: "$.data.id" } }
            - { call: "POST /invoices/${inv_id}/accessorials", payload: { kind: "CHASSIS_RENTAL", amount_cents: 12000 }, as: Biller }
            - { call: "POST /invoices/${inv_id}/accessorials", payload: { kind: "PRE_PULL", amount_cents: 8000 }, as: Biller }
          trigger:
            - { call: "GET /invoices/${inv_id}", payload: {}, as: Biller, captures: { total: "$.data.total_charge_cents" } }
          assert:
            - "Invoice.${inv_id}.effective_linehaul_cents == 108000"
            - "Invoice.${inv_id}.fuel_surcharge_cents == 23760"
            - "Invoice.${inv_id}.accessorials_total_cents == 20000"
            - "Invoice.${inv_id}.total_charge_cents == 151760"

      - name: demurrage_round_per_day_then_sum_mode_b
        grounds:
          - calculations.demurrage_accrued
          - entities.Booking.fields.demurrage_actual_cents
          - entities.Terminal.fields.demurrage_daily_rate_cents
          - state_machines.Booking.APPOINTED_to_DISPATCHED
        distinguishing_aspect: "Mode (b): per_day_charge=round_half_up(12500*1.075)=13438; pinned round-per-day-then-sum over 3 days = 40314, whereas sum-then-round round(13437.5*3)=40313; rounding order alone decides the cent."
        test_recipe:
          setup:
            - "Terminal demurrage_daily_rate_cents=12500; Booking LFD=2026-05-10; pickup dispatched at clock 2026-05-13 -> 3 demurrage days."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-06T00:00:00Z" }, as: Dispatcher }
            - { call: "POST /terminals", payload: { name: "Pier D", code: "PIERD", demurrage_daily_rate_cents: 12500 }, as: Dispatcher, captures: { term_id: "$.data.id" } }
            - { call: "POST /chassis", payload: { chassis_number: "CHX4", pool_scac: "POOL", per_diem_rate_cents: 8500, free_days: 4 }, as: Dispatcher, captures: { chx_id: "$.data.id" } }
            - { call: "POST /drivers", payload: { name: "Del Four", license_number: "L4" }, as: Dispatcher, captures: { drv_id: "$.data.id" } }
            - { call: "POST /bookings", payload: { container_number: "MSCU4", direction: "IMPORT", origin_terminal_id: "${term_id}", last_free_day: "2026-05-10T00:00:00Z", linehaul_base_cents: 45000 }, as: Dispatcher, captures: { bkg_id: "$.data.id" } }
            - { call: "POST /bookings/${bkg_id}/confirm", payload: {}, as: Dispatcher, captures: { bkg_v: "$.data.version" } }
            - { call: "POST /bookings/${bkg_id}/assign-chassis", payload: { chassis_id: "${chx_id}", expected_booking_version: "${bkg_v}" }, as: Dispatcher }
            - { call: "POST /appointments", payload: { booking_id: "${bkg_id}", terminal_id: "${term_id}", purpose: "PICKUP", window_start: "2026-05-06T08:00:00Z", window_end: "2026-05-14T23:59:59Z" }, as: Dispatcher, captures: { appt_id: "$.data.id" } }
            - { call: "POST /legs", payload: { booking_id: "${bkg_id}", driver_id: "${drv_id}", leg_type: "PICKUP", appointment_id: "${appt_id}", window_start: "2026-05-13T09:00:00Z", window_end: "2026-05-13T12:00:00Z" }, as: Dispatcher, captures: { leg_id: "$.data.id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-13T10:00:00Z" }, as: Dispatcher }
          trigger:
            - { call: "POST /legs/${leg_id}/dispatch", payload: {}, as: Dispatcher }
          assert:
            - "Booking.${bkg_id}.demurrage_actual_cents == 40314"
            - "Booking.${bkg_id}.demurrage_actual_cents != 40313"

  - rule_id: non_linear_state_machine
    instances:
      - name: booking_reappointment_cycle
        grounds:
          - state_machines.Booking.CHASSIS_ASSIGNED_to_APPOINTED
          - state_machines.Booking.APPOINTED_to_CHASSIS_ASSIGNED
          - state_machines.Appointment.BOOKED_to_CANCELED
        distinguishing_aspect: "Booking revisits APPOINTED after reverting to CHASSIS_ASSIGNED (A->B->A revision loop) on the Booking entity, distinct from the Leg branching machine."
        test_recipe:
          setup:
            - "Booking CHASSIS_ASSIGNED; first PICKUP appointment -> APPOINTED; cancel it -> CHASSIS_ASSIGNED; second PICKUP appointment -> APPOINTED again."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-06T00:00:00Z" }, as: Dispatcher }
            - { call: "POST /terminals", payload: { name: "Pier E", code: "PIERE", demurrage_daily_rate_cents: 12500 }, as: Dispatcher, captures: { term_id: "$.data.id" } }
            - { call: "POST /chassis", payload: { chassis_number: "CHX5", pool_scac: "POOL", per_diem_rate_cents: 8500 }, as: Dispatcher, captures: { chx_id: "$.data.id" } }
            - { call: "POST /bookings", payload: { container_number: "MSCU5", direction: "IMPORT", origin_terminal_id: "${term_id}", last_free_day: "2026-05-20T00:00:00Z", linehaul_base_cents: 45000 }, as: Dispatcher, captures: { bkg_id: "$.data.id" } }
            - { call: "POST /bookings/${bkg_id}/confirm", payload: {}, as: Dispatcher, captures: { bkg_v: "$.data.version" } }
            - { call: "POST /bookings/${bkg_id}/assign-chassis", payload: { chassis_id: "${chx_id}", expected_booking_version: "${bkg_v}" }, as: Dispatcher }
            - { call: "POST /appointments", payload: { booking_id: "${bkg_id}", terminal_id: "${term_id}", purpose: "PICKUP", window_start: "2026-05-13T08:00:00Z", window_end: "2026-05-13T12:00:00Z" }, as: Dispatcher, captures: { appt1_id: "$.data.id" } }
            - { call: "POST /appointments/${appt1_id}/cancel", payload: {}, as: Dispatcher }
          trigger:
            - { call: "POST /appointments", payload: { booking_id: "${bkg_id}", terminal_id: "${term_id}", purpose: "PICKUP", window_start: "2026-05-14T08:00:00Z", window_end: "2026-05-14T12:00:00Z" }, as: Dispatcher, captures: { appt2_id: "$.data.id" } }
          assert:
            - "Appointment.${appt1_id}.status == CANCELED"
            - "Booking.${bkg_id}.status == APPOINTED"
            - "Appointment.${appt2_id}.status == BOOKED"

      - name: leg_completion_branch_divergent
        grounds:
          - state_machines.Leg.DISPATCHED_to_COMPLETED
          - entities.Leg.fields.leg_type
          - state_machines.Chassis.OUT_to_AVAILABLE
        distinguishing_aspect: "Leg completion forks on leg_type: PICKUP completion leaves chassis OUT and booking DELIVERED; RETURN completion releases chassis to AVAILABLE and drives booking to EMPTY_RETURNED — divergent side-effect sets on the same Leg entity (different entity from the Booking cycle)."
        test_recipe:
          setup:
            - "Booking dispatched then PICKUP leg completed (branch A: chassis stays OUT, booking DELIVERED); RETURN leg then completed (branch B: chassis AVAILABLE, booking EMPTY_RETURNED)."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-15T00:00:00Z" }, as: Dispatcher }
            - { call: "POST /terminals", payload: { name: "Pier F", code: "PIERF", demurrage_daily_rate_cents: 12500 }, as: Dispatcher, captures: { term_id: "$.data.id" } }
            - { call: "POST /chassis", payload: { chassis_number: "CHX6", pool_scac: "POOL", per_diem_rate_cents: 8500, free_days: 4 }, as: Dispatcher, captures: { chx_id: "$.data.id" } }
            - { call: "POST /drivers", payload: { name: "Del Six", license_number: "L6" }, as: Dispatcher, captures: { drv_id: "$.data.id" } }
            - { call: "POST /bookings", payload: { container_number: "MSCU6", direction: "IMPORT", origin_terminal_id: "${term_id}", last_free_day: "2026-06-30T00:00:00Z", linehaul_base_cents: 45000 }, as: Dispatcher, captures: { bkg_id: "$.data.id" } }
            - { call: "POST /bookings/${bkg_id}/confirm", payload: {}, as: Dispatcher, captures: { bkg_v: "$.data.version" } }
            - { call: "POST /bookings/${bkg_id}/assign-chassis", payload: { chassis_id: "${chx_id}", expected_booking_version: "${bkg_v}" }, as: Dispatcher }
            - { call: "POST /appointments", payload: { booking_id: "${bkg_id}", terminal_id: "${term_id}", purpose: "PICKUP", window_start: "2026-05-15T06:00:00Z", window_end: "2026-05-30T23:59:59Z" }, as: Dispatcher, captures: { appt_id: "$.data.id" } }
            - { call: "POST /legs", payload: { booking_id: "${bkg_id}", driver_id: "${drv_id}", leg_type: "PICKUP", appointment_id: "${appt_id}", window_start: "2026-05-15T08:00:00Z", window_end: "2026-05-15T12:00:00Z" }, as: Dispatcher, captures: { leg_pick_id: "$.data.id" } }
            - { call: "POST /legs/${leg_pick_id}/dispatch", payload: {}, as: Dispatcher }
            - { call: "POST /legs/${leg_pick_id}/complete", payload: {}, as: Dispatcher }
            - { call: "GET /chassis/${chx_id}", payload: {}, as: Dispatcher, captures: { chx_status_after_pickup: "$.data.status" } }
            - { call: "POST /legs", payload: { booking_id: "${bkg_id}", driver_id: "${drv_id}", leg_type: "RETURN", window_start: "2026-05-16T08:00:00Z", window_end: "2026-05-16T12:00:00Z" }, as: Dispatcher, captures: { leg_ret_id: "$.data.id" } }
            - { call: "POST /legs/${leg_ret_id}/dispatch", payload: {}, as: Dispatcher }
          trigger:
            - { call: "POST /legs/${leg_ret_id}/complete", payload: {}, as: Dispatcher }
          assert:
            - "captured chx_status_after_pickup == OUT"
            - "Chassis.${chx_id}.status == AVAILABLE"
            - "Booking.${bkg_id}.status == EMPTY_RETURNED"

  - rule_id: transitive_cascade
    instances:
      - name: empty_return_chassis_booking_cascade
        grounds:
          - state_machines.Leg.DISPATCHED_to_COMPLETED
          - state_machines.Chassis.OUT_to_AVAILABLE
          - state_machines.Booking.DELIVERED_to_EMPTY_RETURNED
          - calculations.per_diem_accrued
        distinguishing_aspect: "Depth-3 chain: RETURN leg completion -> Chassis OUT->AVAILABLE (finalize per-diem 42500) -> Booking DELIVERED->EMPTY_RETURNED (stamp per_diem_final); each hop caused by the prior. Trigger = empty return."
        test_recipe:
          setup:
            - "Booking DELIVERED with chassis OUT since 2026-05-15; RETURN leg dispatched; clock 2026-05-24 at completion -> per_diem_final 42500."
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-15T00:00:00Z" }, as: Dispatcher }
            - { call: "POST /terminals", payload: { name: "Pier G", code: "PIERG", demurrage_daily_rate_cents: 12500 }, as: Dispatcher, captures: { term_id: "$.data.id" } }
            - { call: "POST /chassis", payload: { chassis_number: "CHX7", pool_scac: "POOL", per_diem_rate_cents: 8500, free_days: 4 }, as: Dispatcher, captures: { chx_id: "$.data.id" } }
            - { call: "POST /drivers", payload: { name: "Del Seven", license_number: "L7" }, as: Dispatcher, captures: { drv_id: "$.data.id" } }
            - { call: "POST /bookings", payload: { container_number: "MSCU7", direction: "IMPORT", origin_terminal_id: "${term_id}", last_free_day: "2026-06-30T00:00:00Z", linehaul_base_cents: 45000 }, as: Dispatcher, captures: { bkg_id: "$.data.id" } }
            - { call: "POST /bookings/${bkg_id}/confirm", payload: {}, as: Dispatcher, captures: { bkg_v: "$.data.version" } }
            - { call: "POST /bookings/${bkg_id}/assign-chassis", payload: { chassis_id: "${chx_id}", expected_booking_version: "${bkg_v}" }, as: Dispatcher }
            - { call: "POST /appointments", payload: { booking_id: "${bkg_id}", terminal_id: "${term_id}", purpose: "PICKUP", window_start: "2026-05-15T06:00:00Z", window_end: "2026-05-30T23:59:59Z" }, as: Dispatcher, captures: { appt_id: "$.data.id" } }
            - { call: "POST /legs", payload: { booking_id: "${bkg_id}", driver_id: "${drv_id}", leg_type: "PICKUP", appointment_id: "${appt_id}", window_start: "2026-05-15T08:00:00Z", window_end: "2026-05-15T12:00:00Z" }, as: Dispatcher, captures: { leg_pick_id: "$.data.id" } }
            - { call: "POST /legs/${leg_pick_id}/dispatch", payload: {}, as: Dispatcher }
            - { call: "POST /legs/${leg_pick_id}/complete", payload: {}, as: Dispatcher }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-24T00:00:00Z" }, as: Dispatcher }
