# ============================================================================
# PRD Benchmark Scaffold — Endangered Species Consultation &
#                          Habitat Conservation Planning
# ============================================================================
# ============================================================================

scenario: |
  2974. Endangered Species Consultation & Habitat Conservation Planning
  (project proponent and wildlife agency): species and critical habitat
  presence determination through databases and field surveys, effect
  determination with may-affect and adverse-effect analyses driving
  consultation type, formal consultation with biological assessment
  preparation and agency biological opinion including incidental take
  statements, habitat conservation plan development for non-federal actions
  with mitigation, funding assurance and adaptive management, minimization
  and mitigation measure design with conservation banking or in-lieu fee
  options, permit issuance with implementing agreement, monitoring and
  reporting obligations, changed and unforeseen circumstances provisions with
  assurances, compliance monitoring, take reporting and reinitiation triggers

domain_name: esa-consultation-hcp
api_prefix: "/"
# Flat topology: every business collection is a top-level path segment
# (/species, /project-actions, /consultations, ...). Children are discovered
# through sub-resource GETs or filtered lists rather than deep URL nesting.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

complexity_profile:
  difficulty_level: expert
  primary_archetype: compliance_audit
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: flat
  # Peer entities linked by explicit foreign keys; no deep URL nesting.
  state_machine_shape: branching
  # ProjectAction forks three ways on the effect determination and re-joins;
  # Consultation is cyclic (information-request / reinitiation loops);
  # HabitatConservationPlan carries two independent state axes.
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - polymorphic
  role_model: segregation_of_duties
  consistency_model: eventual
  # Every derived field is reconciled immediately inside the mutating request
  # EXCEPT Proponent.compliance_standing_score and
  # Proponent.compliance_variant_applied, which are clock-dependent and are
  # re-derived (and persisted) on every read of the Proponent resource.

# ============================================================================
# §1.1 Entity-Relationship Table
# ============================================================================
entities:

  - name: Species
    parent: null
    common_fields: true
    fields:
      - name: scientific_name
        type: string
        source: input
        description: binomial name; unique across all Species rows
        constraints: "1..120 chars; unique (case-sensitive exact match)"
      - name: common_name
        type: string
        source: input
        description: vernacular name shown on determinations
        constraints: "1..120 chars"
      - name: listing_status
        type: enum
        source: input
        description: current regulatory listing status under the Act
        constraints: "one of ENDANGERED | THREATENED | PROPOSED | CANDIDATE; mutated only by POST /species/{id}/listing-change"
      - name: critical_habitat_designated
        type: boolean
        source: computed
        description: "true when at least one CriticalHabitatUnit row with species_id == this.id has designation_status == FINAL; recomputed on every CriticalHabitatUnit create"
        default: false
      - name: take_authorization_unit
        type: enum
        source: input
        description: unit in which incidental take is authorized and reported
        constraints: "one of INDIVIDUALS | ACRES | NESTS"
      - name: take_density_per_acre
        type: number
        source: input
        description: expected individuals (or nests) per acre of occupied habitat; ignored by the take formula when take_authorization_unit == ACRES
        constraints: ">= 0, exactly 2 decimal places"
      - name: recovery_unit_population
        type: integer
        source: input
        description: rangewide recovery-unit population used as the jeopardy denominator
        constraints: ">= 1"
      - name: survey_season_start_month
        type: integer
        source: input
        description: first calendar month (1-12) of the detectability season; may be greater than survey_season_end_month to express a season that wraps the year boundary
        constraints: "1..12"
      - name: survey_season_end_month
        type: integer
        source: input
        description: last calendar month (1-12) of the detectability season, inclusive
        constraints: "1..12"
      - name: listing_change_count
        type: integer
        source: system
        description: number of accepted POST /species/{id}/listing-change calls
        default: 0
      - name: last_listing_change_at
        type: datetime
        source: system
        description: logical-clock instant of the most recent listing change; null before the first change
        default: null

  - name: Proponent
    parent: null
    common_fields: true
    fields:
      - name: org_name
        type: string
        source: input
        description: legal name of the project proponent organisation
        constraints: "1..160 chars"
      - name: contact_email
        type: string
        source: input
        description: notification address for consultation correspondence
        constraints: "must contain exactly one '@'; 5..160 chars"
      - name: is_federal_agency
        type: boolean
        source: input
        description: true when the proponent is itself a federal action agency
        default: false
      - name: compliance_standing_score
        type: number
        source: computed
        description: "weighted compliance score produced by calculations.compliance_standing_score; RE-DERIVED AND PERSISTED ON EVERY READ of this resource against the current logical clock, and additionally on monitoring-report adjudication, on a Consultation entering REINITIATION_REQUIRED, and on a ChangedCircumstanceEvent response"
        default: 100.00
        constraints: "0.00 .. 100.00, exactly 2 decimal places"
      - name: compliance_variant_applied
        type: enum
        source: computed
        description: which variant of calculations.compliance_standing_score produced the persisted score
        default: LIFETIME
        constraints: "one of ROLLING_12_MONTH | LIFETIME"
      - name: open_reinitiation_count
        type: integer
        source: computed
        description: "count of Consultation rows in status REINITIATION_REQUIRED whose ProjectAction.proponent_id == this.id"
        default: 0

  - name: CriticalHabitatUnit
    parent: Species
    common_fields: true
    fields:
      - name: species_id
        type: string
        source: input
        description: "FK -> Species.id; the species for which this unit is designated"
      - name: unit_code
        type: string
        source: input
        description: agency unit designator
        constraints: "3..24 chars; unique within a species_id"
      - name: acres
        type: number
        source: input
        description: mapped area of the unit
        constraints: "> 0, exactly 2 decimal places"
      - name: county_code
        type: string
        source: input
        description: 5-digit FIPS county code the unit sits in
        constraints: "exactly 5 characters, digits only"
      - name: designation_status
        type: enum
        source: input
        description: designation stage of the unit
        constraints: "one of PROPOSED | FINAL"
      - name: primary_constituent_elements
        type: array
        source: input
        description: array of PCE label strings describing the physical/biological features
        constraints: "1..8 strings, each 1..80 chars"

  - name: ProjectAction
    parent: null
    common_fields: true
    fields:
      - name: proponent_id
        type: string
        source: input
        description: "FK -> Proponent.id; owner of the action; must equal X-User-ID when the caller's role is Proponent"
      - name: action_name
        type: string
        source: input
        description: project title used on determinations
        constraints: "1..160 chars"
      - name: action_type
        type: enum
        source: input
        description: federal-nexus classification driving which authorisation path applies
        constraints: "one of FEDERAL_FUNDED | FEDERAL_PERMITTED | NON_FEDERAL"
      - name: footprint_acres
        type: number
        source: input
        description: total disturbance footprint; denominator of the overlap percentage
        constraints: "> 0, exactly 2 decimal places"
      - name: county_code
        type: string
        source: input
        description: 5-digit FIPS county code of the action area; matched against ConservationBank.service_area_county_codes
        constraints: "exactly 5 characters, digits only"
      - name: construction_start_date
        type: string
        source: input
        description: calendar date (YYYY-MM-DD) construction is scheduled to begin
        constraints: "ISO calendar date; must be <= construction_end_date"
      - name: construction_end_date
        type: string
        source: input
        description: calendar date (YYYY-MM-DD) construction is scheduled to end
        constraints: "ISO calendar date"
      - name: status
        type: enum
        source: system
        description: lifecycle state; see state_machines[entity=ProjectAction]
        default: SCREENING
        constraints: "one of SCREENING | CLEARED_NO_EFFECT | INFORMAL_CONSULTATION | FORMAL_CONSULTATION | CONSULTATION_CONCLUDED | HCP_DEVELOPMENT | PERMITTED | REINITIATION_PENDING"
      - name: effect_determination
        type: enum
        source: computed
        description: result of calculations.effect_determination_matrix
        default: PENDING
        constraints: "one of PENDING | NO_EFFECT | NLAA | LAA"
      - name: total_overlap_acres
        type: number
        source: computed
        description: "sum of habitat_overlap_acres over the candidate PresenceDetermination set defined in calculations.effect_determination_matrix.input_set"
        default: 0.00
        constraints: "exactly 2 decimal places"
      - name: overlap_pct
        type: number
        source: computed
        description: "round_half_up(100 * total_overlap_acres / footprint_acres, 2)"
        default: 0.00
        constraints: "exactly 2 decimal places"
      - name: active_consultation_id
        type: string
        source: system
        description: "FK -> Consultation.id; the Consultation created by the effect determination; null while status == SCREENING and for actions determined NO_EFFECT"
        default: null
      - name: reinitiation_reason
        type: enum
        source: system
        description: why the action was pushed back into REINITIATION_PENDING
        default: NONE
        constraints: "one of NONE | TAKE_EXCEEDANCE | SPECIES_UPLISTED"

  - name: PresenceDetermination
    parent: null
    common_fields: true
    fields:
      - name: project_action_id
        type: string
        source: input
        description: "FK -> ProjectAction.id; the action this determination was made for"
      - name: species_id
        type: string
        source: input
        description: "FK -> Species.id; the species the determination is about"
      - name: critical_habitat_unit_id
        type: string
        source: input
        description: "FK -> CriticalHabitatUnit.id; null when the impact area lies outside designated critical habitat; when non-null the unit MUST belong to species_id"
        default: null
      - name: method
        type: enum
        source: input
        description: how presence was established
        constraints: "one of DATABASE_QUERY | FIELD_SURVEY"
      - name: detection_result
        type: enum
        source: input
        description: raw observation outcome
        constraints: "one of DETECTED | NOT_DETECTED | INCONCLUSIVE"
      - name: survey_window_start
        type: string
        source: input
        description: first calendar date (YYYY-MM-DD) of the field survey; REQUIRED when method == FIELD_SURVEY, MUST be omitted or null when method == DATABASE_QUERY
        default: null
      - name: survey_window_end
        type: string
        source: input
        description: last calendar date (YYYY-MM-DD) of the field survey, inclusive; REQUIRED when method == FIELD_SURVEY, MUST be omitted or null when method == DATABASE_QUERY
        default: null
      - name: habitat_overlap_acres
        type: number
        source: input
        description: acres of the action footprint that overlap suitable or designated habitat for species_id
        constraints: ">= 0, exactly 2 decimal places"
      - name: presence_status
        type: enum
        source: computed
        description: result of calculations.presence_status_derivation
        constraints: "one of PRESENT | PRESUMED_PRESENT | PRESUMED_ABSENT | ABSENT"
      - name: survey_in_season
        type: boolean
        source: computed
        description: "true when method == FIELD_SURVEY and BOTH survey_window_start and survey_window_end fall inside the species' detectability season; always false when method == DATABASE_QUERY"
        default: false
      - name: requires_reevaluation
        type: boolean
        source: system
        description: set true by the species-uplisting cascade when this row's species was uplisted after the determination was made
        default: false

  - name: Consultation
    parent: null
    common_fields: true
    fields:
      - name: project_action_id
        type: string
        source: system
        description: "FK -> ProjectAction.id; set when the effect determination creates this consultation"
      - name: consultation_type
        type: enum
        source: system
        description: INFORMAL for an NLAA determination, FORMAL for an LAA determination
        constraints: "one of INFORMAL | FORMAL"
      - name: status
        type: enum
        source: system
        description: lifecycle state; see state_machines[entity=Consultation]
        default: DRAFT_BA
        constraints: "one of DRAFT_BA | UNDER_REVIEW | INFO_REQUESTED | CONCLUDED_CONCURRENCE | OPINION_ISSUED | REINITIATION_REQUIRED"
      - name: clock_started_at
        type: datetime
        source: system
        description: logical-clock instant the consultation was created; base of the statutory deadline
      - name: statutory_days
        type: integer
        source: system
        description: "60 when consultation_type == INFORMAL, 135 when consultation_type == FORMAL"
      - name: tolled_days
        type: integer
        source: system
        description: whole days accumulated across information-request episodes, added to the deadline
        default: 0
      - name: deadline_at
        type: datetime
        source: computed
        description: "result of calculations.consultation_deadline"
      - name: ba_revision_number
        type: integer
        source: system
        description: number of biological assessments submitted on this consultation
        default: 0
      - name: ba_submitted_at
        type: datetime
        source: system
        description: logical-clock instant of the most recent biological assessment submission
        default: null
      - name: ba_narrative
        type: string
        source: input
        description: effects-analysis narrative carried by the most recent biological assessment
        default: null
      - name: ba_effects_analysis_complete
        type: boolean
        source: input
        description: proponent's attestation that the effects analysis is complete on the most recent biological assessment
        default: false
      - name: info_request_count
        type: integer
        source: system
        description: number of information requests filed on this consultation
        default: 0
      - name: info_requested_at
        type: datetime
        source: system
        description: logical-clock instant of the open information request; null while status != INFO_REQUESTED
        default: null
      - name: reinitiation_triggered_at
        type: datetime
        source: system
        description: logical-clock instant this consultation most recently entered REINITIATION_REQUIRED
        default: null
      - name: reinitiation_count
        type: integer
        source: system
        description: number of times this consultation has been reinitiated
        default: 0

  - name: BiologicalOpinion
    parent: null
    common_fields: false
    fields:
      - name: consultation_id
        type: string
        source: system
        description: "FK -> Consultation.id; the formal consultation this opinion concludes"
      - name: primary_species_scientific_name
        type: string
        source: system
        description: scientific_name of the primary species selected by calculations.incidental_take_authorization, snapshotted at issuance
      - name: primary_species_listing_status
        type: enum
        source: system
        description: the primary species' listing_status snapshotted at issuance; deliberately NOT refreshed when the species is later uplisted
        constraints: "one of ENDANGERED | THREATENED"
      - name: conclusion
        type: enum
        source: system
        description: jeopardy conclusion of the opinion
        constraints: "one of NO_JEOPARDY | JEOPARDY | JEOPARDY_WITH_RPA"
      - name: rpa_required
        type: boolean
        source: system
        description: true when the jeopardy fraction met the threshold, regardless of whether an RPA was supplied
      - name: rpa_description
        type: string
        source: system
        description: reasonable and prudent alternative text supplied at issuance; null when none was supplied
        default: null
      - name: exposed_acres
        type: number
        source: system
        description: acres of the primary species' habitat exposed to the action
        constraints: "exactly 2 decimal places"
      - name: take_unit
        type: enum
        source: system
        description: the primary species' take_authorization_unit snapshotted at issuance
        constraints: "one of INDIVIDUALS | ACRES | NESTS"
      - name: authorized_take_units
        type: number
        source: system
        description: incidental take statement ceiling produced by calculations.incidental_take_authorization
        constraints: ">= 0, exactly 2 decimal places"
      - name: jeopardy_fraction
        type: number
        source: system
        description: "round_half_up(authorized_take_units / primary species recovery_unit_population, 4)"
        constraints: "exactly 4 decimal places"
      - name: reinitiation_trigger_units
        type: number
        source: system
        description: "round_half_up(authorized_take_units * REINITIATION_TRIGGER_PCT, 2)"
        constraints: "exactly 2 decimal places"
      - name: issued_by_user_id
        type: string
        source: system
        description: X-User-ID of the WildlifeAgency operator that issued the opinion
      - name: issued_at
        type: datetime
        source: system
        description: logical-clock instant of issuance
      - name: issued_late
        type: boolean
        source: system
        description: "true when issued_at > the consultation's deadline_at at the moment of issuance"

  - name: ConservationBank
    parent: null
    common_fields: true
    fields:
      - name: bank_name
        type: string
        source: input
        description: approved bank name
        constraints: "1..160 chars"
      - name: covered_species_id
        type: string
        source: input
        description: "FK -> Species.id; the single species this bank sells credits for"
      - name: service_area_county_codes
        type: array
        source: input
        description: array of 5-digit FIPS county codes inside the bank's approved service area
        constraints: "1..12 strings, each exactly 5 characters, digits only"
      - name: credit_price_cents
        type: integer
        source: input
        description: sale price of one credit in whole cents
        constraints: "> 0"
      - name: credits_total_minted
        type: number
        source: input
        description: total credits ever released by the agency into this bank; never changes after creation
        constraints: "> 0, exactly 2 decimal places"
      - name: credits_available
        type: number
        source: computed
        description: credits not yet reserved or transferred; initialised to credits_total_minted
        constraints: ">= 0, exactly 2 decimal places"
      - name: credits_reserved
        type: number
        source: computed
        description: credits held by MitigationCommitment rows in status RESERVED
        default: 0.00
        constraints: ">= 0, exactly 2 decimal places"
      - name: credits_transferred
        type: number
        source: computed
        description: credits permanently sold to MitigationCommitment rows that reached status SECURED
        default: 0.00
        constraints: ">= 0, exactly 2 decimal places"

  - name: HabitatConservationPlan
    parent: null
    common_fields: true
    fields:
      - name: project_action_id
        type: string
        source: input
        description: "FK -> ProjectAction.id; the non-federal action the plan covers"
      - name: plan_name
        type: string
        source: input
        description: plan title
        constraints: "1..160 chars"
      - name: covered_acres
        type: number
        source: input
        description: acreage the proponent declares the plan will cover; the PRELIMINARY mitigation basis
        constraints: "> 0, exactly 2 decimal places"
      - name: permit_term_years
        type: integer
        source: input
        description: requested permit term in whole years
        constraints: "1..50"
      - name: plan_status
        type: enum
        source: system
        description: "plan-approval axis; evolves independently of funding_status (see state_machines[entity=HabitatConservationPlan])"
        default: DRAFT
        constraints: "one of DRAFT | SUBMITTED | APPROVED | IMPLEMENTING | SUSPENDED_IMPLEMENTATION | CLOSED"
      - name: funding_status
        type: enum
        source: computed
        description: "funding-assurance axis produced by calculations.funding_assurance_status; evolves independently of plan_status"
        default: UNFUNDED
        constraints: "one of UNFUNDED | PARTIALLY_ASSURED | FULLY_ASSURED"
      - name: preliminary_mitigation_units
        type: number
        source: computed
        description: PRELIMINARY variant of calculations.required_mitigation_units
        constraints: "exactly 2 decimal places"
      - name: final_mitigation_units
        type: number
        source: computed
        description: FINAL variant of calculations.required_mitigation_units; null until a permit issuance is attempted
        default: null
        constraints: "exactly 2 decimal places"
      - name: mitigation_delta_units
        type: number
        source: computed
        description: "round_half_up(final_mitigation_units - preliminary_mitigation_units, 2); null while final_mitigation_units is null"
        default: null
      - name: secured_mitigation_units
        type: number
        source: computed
        description: "round_half_up(sum of MitigationCommitment.units where hcp_id == this.id and status IN {RESERVED, SECURED}, 2)"
        default: 0.00
      - name: endowment_base_cents
        type: integer
        source: computed
        description: endowment_base_cents from calculations.endowment_requirement
        default: 0
      - name: changed_circumstance_reserve_cents
        type: integer
        source: computed
        description: changed_circumstance_reserve_cents from calculations.endowment_requirement
        default: 0
      - name: endowment_required_cents
        type: integer
        source: computed
        description: endowment_required_cents from calculations.endowment_requirement
        default: 0
      - name: endowment_secured_cents
        type: integer
        source: computed
        description: "sum of contribution_cents accepted by POST /habitat-conservation-plans/{id}/funding-assurances plus contributed_cents accepted by POST /changed-circumstance-events/{id}/response for events on this plan"
        default: 0
      - name: funded_ratio
        type: number
        source: computed
        description: "round_half_up(endowment_secured_cents / endowment_required_cents, 4); pinned to 0.0000 when endowment_required_cents == 0; REPORTING ONLY — funding_status is decided on integer cents, never on this rounded value"
        default: 0.0000
        constraints: "exactly 4 decimal places"
      - name: reserve_drawn_cents
        type: integer
        source: computed
        description: cumulative reserve draws made by CHANGED circumstance events on this plan
        default: 0
      - name: reserve_remaining_cents
        type: integer
        source: computed
        description: "max(0, changed_circumstance_reserve_cents - reserve_drawn_cents)"
        default: 0
      - name: approved_by_user_id
        type: string
        source: system
        description: X-User-ID of the WildlifeAgency operator that approved the plan; null until approval
        default: null
      - name: assurance_review_required
        type: boolean
        source: system
        description: "true while the plan owes the agency an assurance review: set true when the plan enters SUSPENDED_IMPLEMENTATION on cascade hop 3 of the take-exceedance cascade, and set back to false when the plan returns to IMPLEMENTING because the causing report was rejected"
        default: false

  - name: MitigationCommitment
    parent: HabitatConservationPlan
    common_fields: true
    fields:
      - name: hcp_id
        type: string
        source: input
        description: "FK -> HabitatConservationPlan.id; supplied in the path"
      - name: conservation_bank_id
        type: string
        source: input
        description: "FK -> ConservationBank.id; REQUIRED when mechanism == CONSERVATION_BANK_CREDIT and MUST be null for every other mechanism"
        default: null
      - name: mechanism
        type: enum
        source: input
        description: how the mitigation obligation is discharged
        constraints: "one of CONSERVATION_BANK_CREDIT | IN_LIEU_FEE | PERMITTEE_RESPONSIBLE"
      - name: units
        type: number
        source: input
        description: mitigation units this commitment supplies
        constraints: "> 0, exactly 2 decimal places"
      - name: status
        type: enum
        source: system
        description: lifecycle state; see state_machines[entity=MitigationCommitment]
        default: RESERVED
        constraints: "one of RESERVED | SECURED | RELEASED"
      - name: base_fee_cents
        type: integer
        source: computed
        description: "step-1 output of calculations.mitigation_commitment_cost; always populated, for every mechanism (bank credits use the bank's credit_price_cents, IN_LIEU_FEE uses IN_LIEU_BASE_RATE_CENTS_PER_UNIT, PERMITTEE_RESPONSIBLE uses PERMITTEE_RESPONSIBLE_COST_CENTS_PER_UNIT)"
        default: 0
      - name: admin_fee_pct_applied
        type: number
        source: computed
        description: "step-2 tier of calculations.mitigation_commitment_cost; the tier table is mechanism-gated, so this is 0.000 for every mechanism other than IN_LIEU_FEE"
        default: 0.000
        constraints: "exactly 3 decimal places"
      - name: admin_fee_cents
        type: integer
        source: computed
        description: "step-3 output of calculations.mitigation_commitment_cost; 0 for every mechanism other than IN_LIEU_FEE, because admin_fee_pct_applied is 0.000 there"
        default: 0
      - name: total_cost_cents
        type: integer
        source: computed
        description: "step-4 output of calculations.mitigation_commitment_cost — always base_fee_cents + admin_fee_cents; CONSERVATION_BANK_CREDIT: round_half_up(units * bank.credit_price_cents) + 0; IN_LIEU_FEE: round_half_up(units * IN_LIEU_BASE_RATE_CENTS_PER_UNIT) + admin_fee_cents; PERMITTEE_RESPONSIBLE: round_half_up(units * PERMITTEE_RESPONSIBLE_COST_CENTS_PER_UNIT) + 0"
      - name: endowment_contribution_cents
        type: integer
        source: computed
        description: this commitment's per-row rounded contribution to calculations.endowment_requirement

  - name: IncidentalTakePermit
    parent: HabitatConservationPlan
    common_fields: true
    fields:
      - name: hcp_id
        type: string
        source: input
        description: "FK -> HabitatConservationPlan.id; supplied in the path"
      - name: permit_number
        type: string
        source: system
        description: "'ITP-' followed by a six-digit zero-padded ordinal equal to (count of IncidentalTakePermit rows created before this one, ordered by created_at ASC) + 1; the first permit in a fresh database is ITP-000001"
      - name: status
        type: enum
        source: system
        description: lifecycle state; see state_machines[entity=IncidentalTakePermit]
        default: ACTIVE
        constraints: "one of ACTIVE | SUSPENDED | EXPIRED"
      - name: term_start
        type: string
        source: input
        description: first calendar date (YYYY-MM-DD) of the permit term
      - name: term_end
        type: string
        source: computed
        description: "term_start with its year advanced by hcp.permit_term_years, keeping month and day; when the resulting month/day does not exist (Feb 29) it is clamped to Feb 28"
      - name: implementing_agreement_reference
        type: string
        source: input
        description: document reference of the signed implementing agreement
        constraints: "6..64 chars"
      - name: issued_by_user_id
        type: string
        source: system
        description: X-User-ID of the WildlifeAgency operator that issued the permit
      - name: authorized_take_units
        type: number
        source: computed
        description: "copied from the BiologicalOpinion of the action's active_consultation_id when one exists; otherwise computed at issuance by calculations.incidental_take_authorization against the action's candidate PresenceDetermination set"
        constraints: ">= 0, exactly 2 decimal places"
      - name: take_unit
        type: enum
        source: computed
        description: take unit snapshotted from the same source as authorized_take_units
        constraints: "one of INDIVIDUALS | ACRES | NESTS"
      - name: reinitiation_trigger_units
        type: number
        source: computed
        description: "round_half_up(authorized_take_units * REINITIATION_TRIGGER_PCT, 2)"
        constraints: "exactly 2 decimal places"
      - name: take_consumed_units
        type: number
        source: computed
        description: "sum of take_units_reported over MonitoringReport rows on this permit with status IN {SUBMITTED, ACCEPTED}"
        default: 0.00
      - name: take_remaining_units
        type: number
        source: computed
        description: "round_half_up(authorized_take_units - take_consumed_units, 2)"
      - name: suspension_count
        type: integer
        source: computed
        description: number of times this permit has entered SUSPENDED
        default: 0

  - name: MonitoringReport
    parent: IncidentalTakePermit
    common_fields: true
    fields:
      - name: permit_id
        type: string
        source: input
        description: "FK -> IncidentalTakePermit.id; supplied in the path"
      - name: period_start
        type: string
        source: input
        description: first calendar date (YYYY-MM-DD) of the reporting period, inclusive
      - name: period_end
        type: string
        source: input
        description: exclusive upper bound date (YYYY-MM-DD) of the reporting period; periods are half-open [period_start, period_end)
        constraints: "must be strictly greater than period_start"
      - name: take_units_reported
        type: number
        source: input
        description: incidental take that occurred during the period
        constraints: ">= 0, exactly 2 decimal places"
      - name: mitigation_units_verified
        type: number
        source: input
        description: mitigation units the proponent certifies were implemented during the period
        constraints: ">= 0, exactly 2 decimal places"
      - name: submitted_at
        type: datetime
        source: system
        description: logical-clock instant of submission
      - name: due_at
        type: string
        source: computed
        description: "period_end advanced by REPORT_DUE_DAYS calendar days (YYYY-MM-DD)"
      - name: is_late
        type: boolean
        source: computed
        description: "true when the calendar date of submitted_at is strictly greater than due_at"
      - name: status
        type: enum
        source: system
        description: lifecycle state; see state_machines[entity=MonitoringReport]
        default: SUBMITTED
        constraints: "one of SUBMITTED | ACCEPTED | REJECTED"
      - name: adjudicated_at
        type: datetime
        source: system
        description: logical-clock instant of adjudication; null while status == SUBMITTED
        default: null
      - name: adjudicated_by_user_id
        type: string
        source: system
        description: X-User-ID of the WildlifeAgency operator that adjudicated the report
        default: null
      - name: adjudication_note
        type: string
        source: input
        description: free-text note recorded with the adjudication
        default: null

  - name: ChangedCircumstanceEvent
    parent: HabitatConservationPlan
    common_fields: true
    fields:
      - name: hcp_id
        type: string
        source: input
        description: "FK -> HabitatConservationPlan.id; supplied in the path"
      - name: circumstance_type
        type: enum
        source: input
        description: CHANGED circumstances were anticipated in the plan and are the permittee's obligation; UNFORESEEN circumstances trigger the plan's assurances
        constraints: "one of CHANGED | UNFORESEEN"
      - name: description
        type: string
        source: input
        description: narrative describing the circumstance
        constraints: "1..400 chars"
      - name: response_cost_cents
        type: integer
        source: input
        description: agency-estimated cost of the required response
        constraints: "> 0"
      - name: reported_at
        type: datetime
        source: system
        description: logical-clock instant the agency reported the circumstance
      - name: status
        type: enum
        source: system
        description: lifecycle state; see state_machines[entity=ChangedCircumstanceEvent]
        default: REPORTED
        constraints: "one of REPORTED | RESPONSE_REQUIRED | RESPONDED | ASSURANCES_INVOKED"
      - name: reserve_draw_cents
        type: integer
        source: computed
        description: cents drawn from the plan's changed-circumstance reserve by this event
        default: 0
      - name: required_additional_cents
        type: integer
        source: computed
        description: cents the permittee must still contribute before the event can be closed
        default: 0
      - name: contributed_cents
        type: integer
        source: input
        description: cents the permittee actually contributed through POST /changed-circumstance-events/{id}/response
        default: 0
      - name: permittee_borne_cents
        type: integer
        source: computed
        description: portion of response_cost_cents borne by the permittee
        default: 0
      - name: agency_borne_cents
        type: integer
        source: computed
        description: portion of response_cost_cents borne by the wildlife agency under the plan's assurances
        default: 0
      - name: assurances_invoked
        type: boolean
        source: computed
        description: true only for UNFORESEEN circumstances
        default: false
      - name: response_note
        type: string
        source: input
        description: free-text note recorded with the permittee's response
        default: null

# ============================================================================
# §1.2 State Machine Table
# ============================================================================
state_machines:

  # ---- ProjectAction: BRANCHING fork-join on the effect determination ------
  - entity: ProjectAction
    initial_state: SCREENING
    terminal_states: [CLEARED_NO_EFFECT]
    transitions:
      - from: SCREENING
        to: CLEARED_NO_EFFECT
        trigger: "POST /project-actions/{id}/effect-determination when calculations.effect_determination_matrix returns NO_EFFECT"
        actor: Proponent
        preconditions:
          - "status == SCREENING"
          - "at least one PresenceDetermination row exists with project_action_id == this.id (otherwise ERR_NO_PRESENCE_DETERMINATIONS)"
        side_effects:
          - "sets effect_determination = NO_EFFECT"
          - "sets total_overlap_acres and overlap_pct from calculations.effect_determination_matrix"
          - "active_consultation_id stays null — NO Consultation row is created on this branch"
        note: "Fork branch 1 of 3. Divergent side-effect set: no Consultation, no deadline clock."
      - from: SCREENING
        to: INFORMAL_CONSULTATION
        trigger: "POST /project-actions/{id}/effect-determination when calculations.effect_determination_matrix returns NLAA"
        actor: Proponent
        preconditions:
          - "status == SCREENING"
          - "at least one PresenceDetermination row exists with project_action_id == this.id"
        side_effects:
          - "sets effect_determination = NLAA"
          - "sets total_overlap_acres and overlap_pct"
          - "creates one Consultation with consultation_type = INFORMAL, status = DRAFT_BA, clock_started_at = current logical clock, statutory_days = INFORMAL_CONSULTATION_DAYS (60), tolled_days = 0"
          - "sets active_consultation_id to the new Consultation.id"
        note: "Fork branch 2 of 3. Divergent side-effect set: a 60-day informal consultation."
      - from: SCREENING
        to: FORMAL_CONSULTATION
        trigger: "POST /project-actions/{id}/effect-determination when calculations.effect_determination_matrix returns LAA"
        actor: Proponent
        preconditions:
          - "status == SCREENING"
          - "at least one PresenceDetermination row exists with project_action_id == this.id"
        side_effects:
          - "sets effect_determination = LAA"
          - "sets total_overlap_acres and overlap_pct"
          - "creates one Consultation with consultation_type = FORMAL, status = DRAFT_BA, clock_started_at = current logical clock, statutory_days = FORMAL_CONSULTATION_DAYS (135), tolled_days = 0"
          - "sets active_consultation_id to the new Consultation.id"
        note: "Fork branch 3 of 3. Divergent side-effect set: a 135-day formal consultation that must end in a BiologicalOpinion."
      - from: INFORMAL_CONSULTATION
        to: CONSULTATION_CONCLUDED
        trigger: "system — the action's active Consultation reaches CONCLUDED_CONCURRENCE"
        actor: system
        preconditions:
          - "Consultation(active_consultation_id).status == CONCLUDED_CONCURRENCE"
        side_effects:
          - "no field changes other than status and updated_at/version"
        note: "Join point — both consultation branches converge here."
      - from: FORMAL_CONSULTATION
        to: CONSULTATION_CONCLUDED
        trigger: "system — the action's active Consultation reaches OPINION_ISSUED"
        actor: system
        preconditions:
          - "Consultation(active_consultation_id).status == OPINION_ISSUED"
        side_effects:
          - "no field changes other than status and updated_at/version"
        note: "Join point — both consultation branches converge here."
      - from: CONSULTATION_CONCLUDED
        to: HCP_DEVELOPMENT
        trigger: "POST /project-actions/{id}/habitat-conservation-plans"
        actor: Proponent
        preconditions:
          - "status == CONSULTATION_CONCLUDED"
          - "action_type == NON_FEDERAL (otherwise ERR_HCP_NOT_ALLOWED_FOR_FEDERAL_ACTION)"
          - "no HabitatConservationPlan row already exists with project_action_id == this.id"
        side_effects:
          - "creates one HabitatConservationPlan with plan_status = DRAFT and funding_status = UNFUNDED"
          - "computes the new plan's preliminary_mitigation_units (PRELIMINARY variant)"
      - from: HCP_DEVELOPMENT
        to: PERMITTED
        trigger: "system — POST /habitat-conservation-plans/{id}/incidental-take-permits succeeds for this action's plan"
        actor: system
        preconditions:
          - "an IncidentalTakePermit row was created with status ACTIVE for the action's HabitatConservationPlan"
        side_effects:
          - "no field changes other than status and updated_at/version"
      - from: PERMITTED
        to: REINITIATION_PENDING
        trigger: "system — cascade hop 4 of the take-exceedance cascade, or cascade hop 3 of the species-uplisting cascade"
        actor: system
        preconditions:
          - "status == PERMITTED"
        side_effects:
          - "sets reinitiation_reason = TAKE_EXCEEDANCE (take cascade) or SPECIES_UPLISTED (uplisting cascade)"
          - "cascade continues: the Consultation named by active_consultation_id, if its status == OPINION_ISSUED, transitions to REINITIATION_REQUIRED"
      - from: CONSULTATION_CONCLUDED
        to: REINITIATION_PENDING
        trigger: "system — cascade hop 3 of the species-uplisting cascade"
        actor: system
        preconditions:
          - "status == CONSULTATION_CONCLUDED"
        side_effects:
          - "sets reinitiation_reason = SPECIES_UPLISTED"
          - "cascade continues: the Consultation named by active_consultation_id, if its status == OPINION_ISSUED, transitions to REINITIATION_REQUIRED"
      - from: HCP_DEVELOPMENT
        to: REINITIATION_PENDING
        trigger: "system — cascade hop 3 of the species-uplisting cascade"
        actor: system
        preconditions:
          - "status == HCP_DEVELOPMENT"
        side_effects:
          - "sets reinitiation_reason = SPECIES_UPLISTED"
          - "cascade continues: the Consultation named by active_consultation_id, if its status == OPINION_ISSUED, transitions to REINITIATION_REQUIRED"
      - from: REINITIATION_PENDING
        to: FORMAL_CONSULTATION
        trigger: "system — the action's active Consultation leaves REINITIATION_REQUIRED for UNDER_REVIEW on a fresh biological assessment"
        actor: system
        preconditions:
          - "status == REINITIATION_PENDING"
          - "Consultation(active_consultation_id).status transitioned REINITIATION_REQUIRED -> UNDER_REVIEW"
        side_effects:
          - "sets reinitiation_reason = NONE"
        note: "Closes the reinitiation loop back into the formal-consultation branch."

  # ---- Consultation: CYCLIC (information-request and reinitiation loops) ---
  - entity: Consultation
    initial_state: DRAFT_BA
    terminal_states: [CONCLUDED_CONCURRENCE]
    transitions:
      - from: DRAFT_BA
        to: UNDER_REVIEW
        trigger: "POST /consultations/{id}/biological-assessment"
        actor: Proponent
        preconditions:
          - "status == DRAFT_BA"
          - "ba_effects_analysis_complete supplied as true (false is rejected as ERR_INVALID_REQUEST)"
        side_effects:
          - "ba_revision_number += 1"
          - "ba_submitted_at = current logical clock; ba_narrative and ba_effects_analysis_complete stored"
      - from: INFO_REQUESTED
        to: UNDER_REVIEW
        trigger: "POST /consultations/{id}/biological-assessment"
        actor: Proponent
        preconditions:
          - "status == INFO_REQUESTED"
          - "ba_effects_analysis_complete supplied as true"
        side_effects:
          - "ba_revision_number += 1; ba_submitted_at = current logical clock"
          - "tolled_days += floor((current logical clock - info_requested_at) / 86400 seconds)"
          - "info_requested_at = null"
          - "deadline_at recomputed by calculations.consultation_deadline"
        note: "CYCLE: UNDER_REVIEW -> INFO_REQUESTED -> UNDER_REVIEW, repeatable up to MAX_INFO_REQUESTS times."
      - from: REINITIATION_REQUIRED
        to: UNDER_REVIEW
        trigger: "POST /consultations/{id}/biological-assessment"
        actor: Proponent
        preconditions:
          - "status == REINITIATION_REQUIRED"
          - "ba_effects_analysis_complete supplied as true"
        side_effects:
          - "ba_revision_number += 1; ba_submitted_at = current logical clock"
          - "clock_started_at = current logical clock, tolled_days = 0, info_request_count = 0; deadline_at recomputed"
          - "the ProjectAction named by project_action_id leaves REINITIATION_PENDING for FORMAL_CONSULTATION and its reinitiation_reason resets to NONE"
          - "Proponent.open_reinitiation_count and Proponent.compliance_standing_score recomputed"
        note: "CYCLE: OPINION_ISSUED -> REINITIATION_REQUIRED -> UNDER_REVIEW -> OPINION_ISSUED."
      - from: UNDER_REVIEW
        to: INFO_REQUESTED
        trigger: "POST /consultations/{id}/information-request"
        actor: WildlifeAgency
        preconditions:
          - "status == UNDER_REVIEW"
          - "current logical clock <= deadline_at (otherwise ERR_CONSULTATION_DEADLINE_PASSED)"
          - "info_request_count < MAX_INFO_REQUESTS (2)"
        side_effects:
          - "info_requested_at = current logical clock"
          - "info_request_count += 1"
      - from: UNDER_REVIEW
        to: CONCLUDED_CONCURRENCE
        trigger: "POST /consultations/{id}/concurrence"
        actor: WildlifeAgency
        preconditions:
          - "status == UNDER_REVIEW"
          - "consultation_type == INFORMAL (otherwise ERR_CONSULTATION_TYPE_MISMATCH)"
        side_effects:
          - "the ProjectAction named by project_action_id transitions INFORMAL_CONSULTATION -> CONSULTATION_CONCLUDED"
      - from: UNDER_REVIEW
        to: OPINION_ISSUED
        trigger: "POST /consultations/{id}/biological-opinion"
        actor: WildlifeAgency
        preconditions:
          - "status == UNDER_REVIEW"
          - "consultation_type == FORMAL (otherwise ERR_CONSULTATION_TYPE_MISMATCH)"
          - "the candidate PresenceDetermination set of project_action_id (presence_status IN {PRESENT, PRESUMED_PRESENT}) is non-empty (otherwise ERR_NO_PRESENCE_DETERMINATIONS)"
        side_effects:
          - "creates one BiologicalOpinion from calculations.incidental_take_authorization, with issued_by_user_id = X-User-ID, issued_at = current logical clock, issued_late = (issued_at > deadline_at)"
          - "the ProjectAction named by project_action_id transitions FORMAL_CONSULTATION -> CONSULTATION_CONCLUDED"
      - from: OPINION_ISSUED
        to: REINITIATION_REQUIRED
        trigger: "system — cascade hop 5 of the take-exceedance cascade, or cascade hop 4 of the species-uplisting cascade"
        actor: system
        preconditions:
          - "status == OPINION_ISSUED"
          - "the ProjectAction named by project_action_id has just entered REINITIATION_PENDING"
        side_effects:
          - "reinitiation_triggered_at = current logical clock; reinitiation_count += 1"
          - "cascade continues: Proponent.open_reinitiation_count += 1 and Proponent.compliance_standing_score recomputed"

  # ---- HabitatConservationPlan, dimension 1 of 2: plan_status --------------
  # PARALLEL state dimensions: plan_status and funding_status advance
  # independently. funding_status can regress while plan_status stands still,
  # and plan_status can advance without funding_status changing.
  - entity: HabitatConservationPlan
    state_field: plan_status
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /habitat-conservation-plans/{id}/submit"
        actor: Proponent
        preconditions:
          - "plan_status == DRAFT"
          - "at least one MitigationCommitment with hcp_id == this.id and status == RESERVED exists (otherwise ERR_NO_MITIGATION_COMMITMENTS)"
        side_effects:
          - "final_mitigation_units recomputed with the FINAL variant of calculations.required_mitigation_units"
          - "mitigation_delta_units = final_mitigation_units - preliminary_mitigation_units"
          - "secured_mitigation_units = sum of units over RESERVED and SECURED commitments"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /habitat-conservation-plans/{id}/decision with decision = APPROVE"
        actor: WildlifeAgency
        preconditions:
          - "plan_status == SUBMITTED"
          - "no BiologicalOpinion of the action's active Consultation has conclusion == JEOPARDY (otherwise ERR_JEOPARDY_UNRESOLVED — a JEOPARDY_WITH_RPA opinion passes this gate)"
          - "secured_mitigation_units >= final_mitigation_units (otherwise ERR_MITIGATION_SHORTFALL)"
          - "funding_status == FULLY_ASSURED (otherwise ERR_FUNDING_NOT_ASSURED)"
        side_effects:
          - "approved_by_user_id = X-User-ID"
          - "every MitigationCommitment with hcp_id == this.id and status == RESERVED transitions to SECURED, in created_at ASC order"
          - "for each such commitment with mechanism == CONSERVATION_BANK_CREDIT: ConservationBank.credits_reserved -= units and ConservationBank.credits_transferred += units"
          - "reserve_remaining_cents = changed_circumstance_reserve_cents - reserve_drawn_cents"
      - from: SUBMITTED
        to: DRAFT
        trigger: "POST /habitat-conservation-plans/{id}/decision with decision = RETURN_FOR_REVISION"
        actor: WildlifeAgency
        preconditions:
          - "plan_status == SUBMITTED"
        side_effects:
          - "every MitigationCommitment with hcp_id == this.id and status == RESERVED transitions to RELEASED, in created_at ASC order"
          - "for each released commitment with mechanism == CONSERVATION_BANK_CREDIT: ConservationBank.credits_reserved -= units and ConservationBank.credits_available += units"
          - "endowment_base_cents, changed_circumstance_reserve_cents and endowment_required_cents recomputed over the now-empty commitment set, i.e. all become 0"
          - "funded_ratio = 0.0000 and funding_status = UNFUNDED, per calculations.funding_assurance_status when endowment_required_cents == 0"
        note: "COMPENSATION: reverses every side effect of commitment creation and restores the bank ledger identity."
      - from: APPROVED
        to: IMPLEMENTING
        trigger: "system — POST /habitat-conservation-plans/{id}/incidental-take-permits succeeds"
        actor: system
        preconditions:
          - "plan_status == APPROVED"
        side_effects:
          - "no field changes other than plan_status and updated_at/version"
      - from: IMPLEMENTING
        to: SUSPENDED_IMPLEMENTATION
        trigger: "system — cascade hop 3 of the take-exceedance cascade"
        actor: system
        preconditions:
          - "plan_status == IMPLEMENTING"
          - "the plan's IncidentalTakePermit has just entered SUSPENDED"
        side_effects:
          - "assurance_review_required = true"
          - "cascade continues: the ProjectAction named by project_action_id leaves PERMITTED for REINITIATION_PENDING"
      - from: SUSPENDED_IMPLEMENTATION
        to: IMPLEMENTING
        trigger: "system — POST /monitoring-reports/{id}/adjudication with decision = REJECT reverses the take that caused the suspension"
        actor: system
        preconditions:
          - "plan_status == SUSPENDED_IMPLEMENTATION"
          - "after reversal the permit's take_consumed_units < permit.reinitiation_trigger_units, so the permit returns to ACTIVE"
        side_effects:
          - "assurance_review_required = false"
        note: "CYCLE on the plan_status dimension: IMPLEMENTING -> SUSPENDED_IMPLEMENTATION -> IMPLEMENTING."
      - from: IMPLEMENTING
        to: CLOSED
        trigger: "system — cascade hop 3 of the clock-advance cascade, when the plan's IncidentalTakePermit expires"
        actor: system
        preconditions:
          - "plan_status IN {IMPLEMENTING, SUSPENDED_IMPLEMENTATION}"
          - "the plan's IncidentalTakePermit has just entered EXPIRED"
        side_effects:
          - "cascade continues: every MitigationCommitment with hcp_id == this.id and status == SECURED transitions to RELEASED, in created_at ASC order, with NO ConservationBank ledger change (transferred credits stay transferred)"
      - from: SUSPENDED_IMPLEMENTATION
        to: CLOSED
        trigger: "system — cascade hop 3 of the clock-advance cascade, when the plan's IncidentalTakePermit expires"
        actor: system
        preconditions:
          - "plan_status == SUSPENDED_IMPLEMENTATION"
          - "the plan's IncidentalTakePermit has just entered EXPIRED"
        side_effects:
          - "cascade continues: every SECURED MitigationCommitment transitions to RELEASED with no ConservationBank ledger change"

  # ---- HabitatConservationPlan, dimension 2 of 2: funding_status -----------
  - entity: HabitatConservationPlan
    state_field: funding_status
    initial_state: UNFUNDED
    terminal_states: []
    transitions:
      - from: UNFUNDED
        to: PARTIALLY_ASSURED
        trigger: "POST /habitat-conservation-plans/{id}/funding-assurances"
        actor: Proponent
        preconditions:
          - "plan_status IN {DRAFT, SUBMITTED}"
          - "calculations.funding_assurance_status on the new endowment_secured_cents yields PARTIALLY_ASSURED"
        side_effects:
          - "endowment_secured_cents += contribution_cents"
          - "funded_ratio recomputed to 4 decimal places (reporting only — never used for the status decision)"
      - from: PARTIALLY_ASSURED
        to: FULLY_ASSURED
        trigger: "POST /habitat-conservation-plans/{id}/funding-assurances"
        actor: Proponent
        preconditions:
          - "plan_status IN {DRAFT, SUBMITTED}"
          - "endowment_secured_cents (after the contribution) >= endowment_required_cents"
        side_effects:
          - "endowment_secured_cents += contribution_cents; funded_ratio recomputed"
      - from: UNFUNDED
        to: FULLY_ASSURED
        trigger: "POST /habitat-conservation-plans/{id}/funding-assurances with a single contribution that meets the whole requirement"
        actor: Proponent
        preconditions:
          - "plan_status IN {DRAFT, SUBMITTED}"
          - "endowment_secured_cents (after the contribution) >= endowment_required_cents"
        side_effects:
          - "endowment_secured_cents += contribution_cents; funded_ratio recomputed"
      - from: FULLY_ASSURED
        to: PARTIALLY_ASSURED
        trigger: "POST /habitat-conservation-plans/{id}/mitigation-commitments — a new commitment raises endowment_required_cents above what is already secured"
        actor: Proponent
        preconditions:
          - "plan_status == DRAFT"
        side_effects:
          - "endowment_base_cents, changed_circumstance_reserve_cents and endowment_required_cents recomputed; funded_ratio recomputed"
        note: "REGRESSION on the funding dimension with no movement on the plan_status dimension — this is what makes the two dimensions genuinely independent."
      - from: FULLY_ASSURED
        to: UNFUNDED
        trigger: "POST /habitat-conservation-plans/{id}/decision with decision = RETURN_FOR_REVISION"
        actor: system
        preconditions:
          - "plan_status == SUBMITTED"
        side_effects:
          - "all commitments released, so endowment_required_cents becomes 0, funded_ratio = 0.0000 and funding_status = UNFUNDED"
      - from: PARTIALLY_ASSURED
        to: UNFUNDED
        trigger: "POST /habitat-conservation-plans/{id}/decision with decision = RETURN_FOR_REVISION"
        actor: system
        preconditions:
          - "plan_status == SUBMITTED"
        side_effects:
          - "endowment_required_cents becomes 0, funded_ratio = 0.0000, funding_status = UNFUNDED"

  # ---- MitigationCommitment ------------------------------------------------
  - entity: MitigationCommitment
    initial_state: RESERVED
    terminal_states: [RELEASED]
    transitions:
      - from: RESERVED
        to: SECURED
        trigger: "system — POST /habitat-conservation-plans/{id}/decision with decision = APPROVE"
        actor: system
        preconditions:
          - "status == RESERVED"
          - "the parent HabitatConservationPlan transitions SUBMITTED -> APPROVED"
        side_effects:
          - "for mechanism == CONSERVATION_BANK_CREDIT: ConservationBank.credits_reserved -= units and ConservationBank.credits_transferred += units (ledger identity preserved)"
      - from: RESERVED
        to: RELEASED
        trigger: "system — POST /habitat-conservation-plans/{id}/decision with decision = RETURN_FOR_REVISION"
        actor: system
        preconditions:
          - "status == RESERVED"
          - "the parent HabitatConservationPlan transitions SUBMITTED -> DRAFT"
        side_effects:
          - "for mechanism == CONSERVATION_BANK_CREDIT: ConservationBank.credits_reserved -= units and ConservationBank.credits_available += units"
          - "the parent plan's endowment aggregates are recomputed without this commitment"
        note: "COMPENSATION path — the bank ledger returns to its pre-commitment split, not merely to a consistent total."
      - from: SECURED
        to: RELEASED
        trigger: "system — cascade hop 4 of the clock-advance cascade, when the parent plan reaches CLOSED"
        actor: system
        preconditions:
          - "status == SECURED"
          - "the parent HabitatConservationPlan has just entered CLOSED"
        side_effects:
          - "NO ConservationBank ledger change — credits already counted in credits_transferred stay there permanently"
        note: "Conditional cascade: the same target state (RELEASED) carries a different side-effect set depending on the source state."

  # ---- IncidentalTakePermit ------------------------------------------------
  - entity: IncidentalTakePermit
    initial_state: ACTIVE
    terminal_states: [EXPIRED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system — cascade hop 2 of the take-exceedance cascade, on POST /incidental-take-permits/{id}/monitoring-reports"
        actor: system
        preconditions:
          - "status == ACTIVE"
          - "after the new report is applied, take_consumed_units >= reinitiation_trigger_units"
        side_effects:
          - "suspension_count += 1"
          - "cascade continues: the parent HabitatConservationPlan leaves IMPLEMENTING for SUSPENDED_IMPLEMENTATION"
        note: "rate_threshold_triggers layer — cumulative, boundary is inclusive (>=)."
      - from: SUSPENDED
        to: ACTIVE
        trigger: "system — POST /monitoring-reports/{id}/adjudication with decision = REJECT"
        actor: system
        preconditions:
          - "status == SUSPENDED"
          - "after the rejected report's take is reversed, take_consumed_units < reinitiation_trigger_units"
        side_effects:
          - "take_consumed_units -= report.take_units_reported and take_remaining_units += report.take_units_reported"
          - "cascade continues: the parent HabitatConservationPlan returns to IMPLEMENTING and assurance_review_required = false"
        note: "CYCLE: ACTIVE -> SUSPENDED -> ACTIVE. Rejecting a report while the permit stays over the trigger leaves it SUSPENDED."
      - from: ACTIVE
        to: EXPIRED
        trigger: "system — POST /_clock/set_current_utc advances the clock past term_end"
        actor: system
        preconditions:
          - "status == ACTIVE"
          - "term_end < the new logical clock value"
        side_effects:
          - "cascade continues: the parent HabitatConservationPlan transitions to CLOSED, then its SECURED MitigationCommitment rows transition to RELEASED"
      - from: SUSPENDED
        to: EXPIRED
        trigger: "system — POST /_clock/set_current_utc advances the clock past term_end"
        actor: system
        preconditions:
          - "status == SUSPENDED"
          - "term_end < the new logical clock value"
        side_effects:
          - "cascade continues: the parent HabitatConservationPlan transitions to CLOSED, then its SECURED MitigationCommitment rows transition to RELEASED"

  # ---- MonitoringReport ----------------------------------------------------
  - entity: MonitoringReport
    initial_state: SUBMITTED
    terminal_states: [ACCEPTED, REJECTED]
    transitions:
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /monitoring-reports/{id}/adjudication with decision = ACCEPT"
        actor: WildlifeAgency
        preconditions:
          - "status == SUBMITTED"
          - "X-User-ID != IncidentalTakePermit.issued_by_user_id of the report's permit (otherwise ERR_ADJUDICATOR_CONFLICT)"
        side_effects:
          - "adjudicated_at = current logical clock; adjudicated_by_user_id = X-User-ID"
          - "the reported take stays applied to the permit ledger"
          - "if is_late is true, the owning Proponent's compliance_standing_score is re-derived on next read with a LATE_REPORT penalty event"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /monitoring-reports/{id}/adjudication with decision = REJECT"
        actor: WildlifeAgency
        preconditions:
          - "status == SUBMITTED"
          - "X-User-ID != IncidentalTakePermit.issued_by_user_id of the report's permit"
        side_effects:
          - "adjudicated_at = current logical clock; adjudicated_by_user_id = X-User-ID"
          - "permit.take_consumed_units -= take_units_reported and permit.take_remaining_units += take_units_reported"
          - "the report's [period_start, period_end) interval stops blocking new reports"
          - "if the reversal brings take_consumed_units below reinitiation_trigger_units, the permit returns to ACTIVE and the cascade unwinds"
        note: "COMPENSATION: reverses the take ledger AND frees the reporting-period interval."

  # ---- ChangedCircumstanceEvent -------------------------------------------
  - entity: ChangedCircumstanceEvent
    initial_state: REPORTED
    terminal_states: [RESPONDED, ASSURANCES_INVOKED]
    transitions:
      - from: REPORTED
        to: RESPONSE_REQUIRED
        trigger: "POST /habitat-conservation-plans/{id}/changed-circumstance-events with circumstance_type = CHANGED and a response_cost_cents that exceeds the plan's reserve_remaining_cents"
        actor: Proponent
        preconditions:
          - "the parent HabitatConservationPlan has plan_status IN {IMPLEMENTING, SUSPENDED_IMPLEMENTATION}"
        side_effects:
          - "reserve_draw_cents = min(response_cost_cents, hcp.reserve_remaining_cents); hcp.reserve_drawn_cents += reserve_draw_cents; hcp.reserve_remaining_cents -= reserve_draw_cents"
          - "required_additional_cents = response_cost_cents - reserve_draw_cents (> 0 on this branch)"
          - "permittee_borne_cents = response_cost_cents; agency_borne_cents = 0; assurances_invoked = false"
      - from: REPORTED
        to: RESPONDED
        trigger: "POST /habitat-conservation-plans/{id}/changed-circumstance-events with circumstance_type = CHANGED and a response_cost_cents fully covered by the reserve"
        actor: Proponent
        preconditions:
          - "the parent HabitatConservationPlan has plan_status IN {IMPLEMENTING, SUSPENDED_IMPLEMENTATION}"
        side_effects:
          - "reserve_draw_cents = response_cost_cents; required_additional_cents = 0"
          - "permittee_borne_cents = response_cost_cents; agency_borne_cents = 0; assurances_invoked = false"
        note: "Branching on the same trigger: the reserve balance decides whether the event lands in RESPONSE_REQUIRED or straight in the terminal RESPONDED."
      - from: REPORTED
        to: ASSURANCES_INVOKED
        trigger: "POST /habitat-conservation-plans/{id}/changed-circumstance-events with circumstance_type = UNFORESEEN"
        actor: Proponent
        preconditions:
          - "the parent HabitatConservationPlan has plan_status IN {IMPLEMENTING, SUSPENDED_IMPLEMENTATION}"
        side_effects:
          - "reserve_draw_cents = 0 — the changed-circumstance reserve is NOT touched for unforeseen circumstances"
          - "permittee_borne_cents = min(response_cost_cents, round_half_up(hcp.endowment_secured_cents * UNFORESEEN_PERMITTEE_SHARE_PCT)); agency_borne_cents = response_cost_cents - permittee_borne_cents"
          - "assurances_invoked = true; required_additional_cents = 0"
      - from: RESPONSE_REQUIRED
        to: RESPONDED
        trigger: "POST /changed-circumstance-events/{id}/response"
        actor: Proponent
        preconditions:
          - "status == RESPONSE_REQUIRED"
          - "contributed_cents >= required_additional_cents (otherwise ERR_RESERVE_CONTRIBUTION_INSUFFICIENT)"
        side_effects:
          - "contributed_cents recorded; response_note stored"
          - "hcp.endowment_secured_cents += contributed_cents and hcp.funding_status re-derived by calculations.funding_assurance_status"
          - "the owning Proponent's UNRESPONDED_CIRCUMSTANCE penalty event disappears from the next compliance_standing_score read"

# ============================================================================
# §1.2.1 Concurrency Rules — optimistic concurrency control (the ONLY
# sanctioned write-write conflict mechanism in this domain)
# ============================================================================
concurrency_rules:
  - name: mitigation-commitment-create-stale-hcp
    parent_entity: HabitatConservationPlan
    child_entity: MitigationCommitment
    write_endpoint: "POST /habitat-conservation-plans/{id}/mitigation-commitments"
    occ_field: expected_hcp_version
    parent_version_field: version
    error_id: ERR_STALE_HCP_VERSION
    http_status: 412
    rationale: >-
      Creating a mitigation commitment rewrites the plan's endowment aggregates
      (endowment_base_cents, changed_circumstance_reserve_cents,
      endowment_required_cents) and can regress funding_status. A caller holding
      a plan snapshot from before an earlier commitment landed would otherwise
      compute its funding contribution against a stale requirement, so the write
      must carry the plan version the caller last read.
    enforcement:
      - "expected_hcp_version is a required input field on the write endpoint"
      - "if expected_hcp_version != HabitatConservationPlan.version the request fails with ERR_STALE_HCP_VERSION (412) and nothing is written — no commitment row, no bank credit movement"
      - "on success HabitatConservationPlan.version is incremented by 1, so a second write reusing the same expected_hcp_version fails"

  - name: monitoring-report-create-stale-permit
    parent_entity: IncidentalTakePermit
    child_entity: MonitoringReport
    write_endpoint: "POST /incidental-take-permits/{id}/monitoring-reports"
    occ_field: expected_permit_version
    parent_version_field: version
    error_id: ERR_STALE_PERMIT_VERSION
    http_status: 412
    rationale: >-
      Submitting a monitoring report debits the permit's take ledger
      (take_consumed_units / take_remaining_units) and can trip the
      reinitiation threshold. A caller working from a permit snapshot taken
      before another report was accepted would under-count consumed take, so
      the write must carry the permit version the caller last read.
    enforcement:
      - "expected_permit_version is a required input field on the write endpoint"
      - "if expected_permit_version != IncidentalTakePermit.version the request fails with ERR_STALE_PERMIT_VERSION (412) and no report row is created and no take is applied"
      - "on success IncidentalTakePermit.version is incremented by 1"

# ============================================================================
# §1.3 Calculation Rules Table
#
# Shared conventions used by every rule below:
#   round_half_up(x)     -> integer, ties away from zero (Decimal ROUND_HALF_UP)
#   round_half_up(x, n)  -> decimal with exactly n fractional digits, ties away
#                           from zero. NEVER banker's rounding.
#   LISTING_RANK = {CANDIDATE: 0, PROPOSED: 1, THREATENED: 2, ENDANGERED: 3}
#   "current logical clock" = the value last set by
#   POST /_clock/set_current_utc (default 2026-08-01T00:00:00Z).
#   All money is integer cents. All acre/unit quantities carry exactly 2
#   fractional digits. Every ordering below is pinned; no rule ever orders by
#   id.
# ============================================================================
calculations:

  - name: presence_status_derivation
    trigger: "on POST /project-actions/{id}/presence-determinations, at row creation (PresenceDetermination.presence_status and .survey_in_season are set by this rule)"
    algorithm: projection
    formula: |
      # Step 1 — seasonality of the survey window, wrap-around aware.
      season_contains(month, s, e):
        if s <= e: return s <= month <= e
        else:      return month >= s or month <= e     # wraps the year boundary
      if method == FIELD_SURVEY:
        survey_in_season = season_contains(month_of(survey_window_start),
                                          species.survey_season_start_month,
                                          species.survey_season_end_month)
                           AND
                           season_contains(month_of(survey_window_end),
                                          species.survey_season_start_month,
                                          species.survey_season_end_month)
      else:
        survey_in_season = false      # DATABASE_QUERY carries no field window

      # Step 2 — presence_status, branching on method then detection_result.
      if method == DATABASE_QUERY:
        DETECTED      -> PRESUMED_PRESENT
        NOT_DETECTED  -> PRESUMED_ABSENT
        INCONCLUSIVE  -> PRESUMED_PRESENT
      if method == FIELD_SURVEY:
        DETECTED      -> PRESENT
        NOT_DETECTED  -> ABSENT              if survey_in_season is true
                      -> PRESUMED_PRESENT    if survey_in_season is false
        INCONCLUSIVE  -> PRESUMED_PRESENT

      # Step 3 — reevaluation flag starts false and is only ever raised by the
      # species-uplisting cascade.
      requires_reevaluation = false
    input_set: >-
      Exactly one row — the PresenceDetermination being created — plus the
      Species row named by species_id. No other PresenceDetermination rows
      participate.
    constants: {}
    precision: "presence_status and survey_in_season are exact; habitat_overlap_acres is stored as supplied with 2 decimal places"
    notes:
      - "A negative FIELD_SURVEY outside the species' survey season is NOT evidence of absence — it lands in PRESUMED_PRESENT. This is the single most consequential branch in the rule."
      - "DATABASE_QUERY can never yield PRESENT or ABSENT; only a field survey can produce a confirmed status."

  - name: effect_determination_matrix
    trigger: "on POST /project-actions/{id}/effect-determination — writes ProjectAction.effect_determination, .total_overlap_acres, .overlap_pct and drives the SCREENING fork"
    algorithm: threshold
    formula: |
      # Candidate set — see input_set. Empty DB of determinations is an error,
      # an all-absent set is a legitimate NO_EFFECT.
      all_rows = PresenceDetermination where project_action_id == action.id
      if count(all_rows) == 0: raise ERR_NO_PRESENCE_DETERMINATIONS
      candidates = [r in all_rows
                    if r.presence_status IN {PRESENT, PRESUMED_PRESENT}]
      if count(candidates) == 0:
        total_overlap_acres = 0.00
        overlap_pct         = 0.00
        return NO_EFFECT

      total_overlap_acres = sum(r.habitat_overlap_acres for r in candidates)
      overlap_pct = round_half_up(
          100 * total_overlap_acres / action.footprint_acres, 2)

      max_rank = max(LISTING_RANK[species_of(r).listing_status]
                     for r in candidates)
      confirmed_present = any(r.presence_status == PRESENT for r in candidates)

      # Ordered decision ladder — first matching clause wins.
      if max_rank <= 1 and overlap_pct <= NO_EFFECT_OVERLAP_PCT_MAX: NO_EFFECT
      elif max_rank <= 1:                                            NLAA
      elif overlap_pct <= NLAA_OVERLAP_PCT_MAX and not confirmed_present: NLAA
      elif overlap_pct <= NLAA_OVERLAP_PCT_MAX and confirmed_present
           and max_rank == 2:                                        NLAA
      else:                                                          LAA
    input_set: >-
      All PresenceDetermination rows with project_action_id == the action's id,
      filtered to presence_status IN {PRESENT, PRESUMED_PRESENT}
      (PRESUMED_ABSENT and ABSENT rows are excluded from both the acreage sum
      and the rank maximum). The sum is order-insensitive; no tie-break needed.
      Empty candidate set after filtering -> NO_EFFECT. Zero rows before
      filtering -> ERR_NO_PRESENCE_DETERMINATIONS.
    constants:
      NO_EFFECT_OVERLAP_PCT_MAX: 0.00
      NLAA_OVERLAP_PCT_MAX: 5.00
    precision: "overlap_pct: 2 decimal places, round_half_up. Threshold comparisons use <= against the ROUNDED overlap_pct, never the raw quotient."
    notes:
      - "Non-linear interaction of three inputs: rounded overlap percentage, the maximum listing rank in the candidate set, and whether any row is a confirmed PRESENT. An ENDANGERED confirmed presence goes to LAA at any positive overlap; a THREATENED confirmed presence stays NLAA up to and including 5.00%."
      - "Boundary is inclusive on the NLAA side: overlap_pct == 5.00 is NLAA, overlap_pct == 5.01 is LAA."

  - name: required_mitigation_units
    trigger: "PRELIMINARY variant on POST /project-actions/{id}/habitat-conservation-plans (writes preliminary_mitigation_units); FINAL variant on POST /habitat-conservation-plans/{id}/submit (writes final_mitigation_units and mitigation_delta_units)"
    algorithm: aggregation
    formula: |
      candidates = PresenceDetermination rows where
                     project_action_id == hcp.project_action_id
                     and presence_status IN {PRESENT, PRESUMED_PRESENT}
      ordered by created_at ASC        # pinned; matters for per-row rounding

      ratio(r)  = MITIGATION_RATIO[species_of(r).listing_status]
      uplift(r) = CRITICAL_HABITAT_UPLIFT
                    if r.critical_habitat_unit_id is not null
                       and CriticalHabitatUnit(r.critical_habitat_unit_id)
                             .designation_status == FINAL
                  else 1.0

      # ---- PRELIMINARY (plan creation) -----------------------------------
      # Coarse, whole-footprint estimate at the worst applicable ratio.
      ratio_max = max(ratio(r) for r in candidates)     # 0 candidates -> ERR
      preliminary_mitigation_units =
          round_half_up(hcp.covered_acres * ratio_max, 2)

      # ---- FINAL (plan submission) ---------------------------------------
      # Per-row, uses the row's OWN overlap acreage, the row's OWN listing
      # ratio and the critical-habitat uplift; ROUND PER ROW, THEN SUM.
      final_mitigation_units =
          sum(round_half_up(r.habitat_overlap_acres * ratio(r) * uplift(r), 2)
              for r in candidates)

      mitigation_delta_units =
          round_half_up(final_mitigation_units - preliminary_mitigation_units, 2)
    input_set: >-
      PresenceDetermination rows of the plan's ProjectAction with
      presence_status IN {PRESENT, PRESUMED_PRESENT}, ordered created_at ASC.
      PRESUMED_ABSENT and ABSENT rows never contribute. An empty candidate set
      raises ERR_NO_PRESENCE_DETERMINATIONS on both variants.
    constants:
      MITIGATION_RATIO:
        ENDANGERED: 3.0
        THREATENED: 2.0
        PROPOSED: 1.5
        CANDIDATE: 1.0
      CRITICAL_HABITAT_UPLIFT: 1.5
    precision: "2 decimal places, round_half_up, applied per row in the FINAL variant and once at the end in the PRELIMINARY variant"
    variants:
      - name: PRELIMINARY
        when: "at HabitatConservationPlan creation, before any commitment exists — stored in preliminary_mitigation_units"
        difference: >-
          Multiplies the plan's whole covered_acres by the single worst
          MITIGATION_RATIO in the candidate set and ignores the critical-habitat
          uplift entirely. Deliberately coarse and always computable from the
          plan alone.
      - name: FINAL
        when: "at HabitatConservationPlan submission — stored in final_mitigation_units"
        difference: >-
          Uses each candidate row's own habitat_overlap_acres, its own species
          ratio, and the CRITICAL_HABITAT_UPLIFT when the row cites a
          CriticalHabitatUnit with designation_status == FINAL; rounds per row
          before summing. Diverges from PRELIMINARY in both direction and
          magnitude — mitigation_delta_units may be negative.
    notes:
      - "mitigation_delta_units is the reconciliation quantity: it is what the agency reviews when the estimate and the row-level total disagree."

  - name: mitigation_commitment_cost
    trigger: "on POST /habitat-conservation-plans/{id}/mitigation-commitments — writes MitigationCommitment.base_fee_cents, .admin_fee_pct_applied, .admin_fee_cents, .total_cost_cents"
    algorithm: tiered_pricing
    formula: |
      # ---- Step 1: base fee, by mechanism. Rounded FIRST and stored. -------
      if mechanism == CONSERVATION_BANK_CREDIT:
        base_fee_cents = round_half_up(units * bank.credit_price_cents)
      elif mechanism == IN_LIEU_FEE:
        base_fee_cents = round_half_up(units * IN_LIEU_BASE_RATE_CENTS_PER_UNIT)
      elif mechanism == PERMITTEE_RESPONSIBLE:
        base_fee_cents = round_half_up(units *
                             PERMITTEE_RESPONSIBLE_COST_CENTS_PER_UNIT)

      # ---- Step 2: administrative tier. IN_LIEU_FEE only. -----------------
      # The tier is selected from base_fee_cents and is NEVER re-selected from
      # the total. This is the pinned evaluation order for a formula that reads
      # as if it were circular ("the fee depends on the total, the total
      # depends on the fee").
      if mechanism == IN_LIEU_FEE:
        if   base_fee_cents <  5000000: admin_fee_pct_applied = 0.150
        elif base_fee_cents < 20000000: admin_fee_pct_applied = 0.115
        else:                           admin_fee_pct_applied = 0.080
      else:
        admin_fee_pct_applied = 0.000

      # ---- Step 3: administrative fee, from the ROUNDED base. --------------
      admin_fee_cents = round_half_up(base_fee_cents * admin_fee_pct_applied)

      # ---- Step 4: total. Tier is NOT revisited. --------------------------
      total_cost_cents = base_fee_cents + admin_fee_cents
    input_set: >-
      Exactly one row — the MitigationCommitment being created — plus, for
      mechanism == CONSERVATION_BANK_CREDIT, the ConservationBank row named by
      conservation_bank_id (its credit_price_cents). No other commitment on the
      plan affects this commitment's cost.
    constants:
      IN_LIEU_BASE_RATE_CENTS_PER_UNIT: 182500
      PERMITTEE_RESPONSIBLE_COST_CENTS_PER_UNIT: 210000
      ILF_ADMIN_TIER_1_MAX_EXCLUSIVE_CENTS: 5000000
      ILF_ADMIN_TIER_1_PCT: 0.150
      ILF_ADMIN_TIER_2_MAX_EXCLUSIVE_CENTS: 20000000
      ILF_ADMIN_TIER_2_PCT: 0.115
      ILF_ADMIN_TIER_3_PCT: 0.080
    precision: >-
      base_fee_cents, admin_fee_cents and total_cost_cents are integer cents
      (round_half_up). admin_fee_pct_applied is stored with exactly 3 decimal
      places. The tier comparison uses strict `<` on the upper bound, so
      base_fee_cents == 5000000 lands in tier 2 and base_fee_cents == 20000000
      lands in tier 3.
    notes:
      - "A conservation-bank commitment whose base_fee_cents falls inside an in-lieu-fee tier range still carries admin_fee_pct_applied == 0.000 — the tier table is mechanism-gated, not amount-gated."
      - "Re-selecting the tier from total_cost_cents instead of base_fee_cents produces a different admin fee for any base near a tier edge; the order above is normative."

  - name: endowment_requirement
    trigger: "recomputed on every POST /habitat-conservation-plans/{id}/mitigation-commitments and on the RETURN_FOR_REVISION branch of POST /habitat-conservation-plans/{id}/decision — writes endowment_base_cents, changed_circumstance_reserve_cents, endowment_required_cents, reserve_remaining_cents"
    algorithm: aggregation
    formula: |
      contributing = MitigationCommitment rows where hcp_id == hcp.id
                       and status IN {RESERVED, SECURED}
      ordered by created_at ASC      # pinned; RELEASED rows never contribute

      # ---- ROUND PER COMMITMENT, THEN SUM. Normative order. --------------
      for c in contributing:
        c.endowment_contribution_cents = round_half_up(
            c.units
            * ANNUAL_MGMT_COST_PER_UNIT_CENTS
            * CAPITALIZATION_YEARS
            * MECHANISM_FACTOR[c.mechanism])

      endowment_base_cents = sum(c.endowment_contribution_cents
                                 for c in contributing)

      # ---- The reserve is a percentage of the ALREADY-ROUNDED base. ------
      changed_circumstance_reserve_cents =
          round_half_up(endowment_base_cents * CHANGED_CIRCUMSTANCE_RESERVE_PCT)

      endowment_required_cents = endowment_base_cents
                                 + changed_circumstance_reserve_cents

      reserve_remaining_cents = changed_circumstance_reserve_cents
                                - reserve_drawn_cents
    input_set: >-
      MitigationCommitment rows of this plan with status IN {RESERVED, SECURED},
      ordered created_at ASC. RELEASED rows are excluded, which is why the
      RETURN_FOR_REVISION branch drives endowment_required_cents to 0. The sum
      is over the per-row ROUNDED contributions.
    constants:
      ANNUAL_MGMT_COST_PER_UNIT_CENTS: 4175
      CAPITALIZATION_YEARS: 30
      MECHANISM_FACTOR:
        CONSERVATION_BANK_CREDIT: 0.60
        IN_LIEU_FEE: 0.85
        PERMITTEE_RESPONSIBLE: 1.00
      CHANGED_CIRCUMSTANCE_RESERVE_PCT: 0.12
    precision: >-
      Integer cents throughout, round_half_up. Two rounding steps whose ORDER is
      normative: (1) round each commitment's contribution, then sum;
      (2) apply CHANGED_CIRCUMSTANCE_RESERVE_PCT to the rounded sum. Summing raw
      products and rounding once at the end gives a different
      endowment_base_cents whenever two or more raw products end in .5.
    notes:
      - "MECHANISM_FACTOR is the inverse of stewardship burden: bank credits are cheapest to endow (0.60) because the bank holds the land; permittee-responsible mitigation carries the full factor (1.00)."
      - "endowment_required_cents == 0 is a reachable and legitimate state (all commitments RELEASED); calculations.funding_assurance_status pins what that means for funding_status."

  - name: incidental_take_authorization
    trigger: "on POST /consultations/{id}/biological-opinion — writes BiologicalOpinion.primary_species_scientific_name, .primary_species_listing_status, .exposed_acres, .take_unit, .authorized_take_units, .jeopardy_fraction, .conclusion, .rpa_required, .reinitiation_trigger_units"
    algorithm: threshold
    formula: |
      # ---- Primary-species selector (fully pinned) ------------------------
      # (a) eligibility filter:
      candidates = PresenceDetermination rows where
                     project_action_id == consultation.project_action_id
                     and presence_status IN {PRESENT, PRESUMED_PRESENT}
      # (d) empty-set fallback:
      if count(candidates) == 0: raise ERR_NO_PRESENCE_DETERMINATIONS
      species_pool = distinct species_of(r) for r in candidates
      # (b) ranking expression:
      #     highest LISTING_RANK[listing_status]
      # (c) tie-breaks, in order:
      #     1. smallest Species.recovery_unit_population
      #     2. earliest Species.created_at
      primary = sort(species_pool,
                     key = (-LISTING_RANK[listing_status],
                            recovery_unit_population,
                            created_at))[0]

      # ---- Exposure, restricted to the primary species --------------------
      exposed_acres = sum(r.habitat_overlap_acres for r in candidates
                          if r.species_id == primary.id)

      # ---- Take, in the species' own authorization unit --------------------
      take_unit = primary.take_authorization_unit
      if take_unit IN {INDIVIDUALS, NESTS}:
        raw_take = exposed_acres * primary.take_density_per_acre
      else:                       # ACRES — the acreage IS the take
        raw_take = exposed_acres
      authorized_take_units = round_half_up(raw_take, 2)

      # ---- Jeopardy screen -------------------------------------------------
      jeopardy_fraction = round_half_up(
          authorized_take_units / primary.recovery_unit_population, 4)
      if jeopardy_fraction >= JEOPARDY_FRACTION_THRESHOLD:
        rpa_required = true
        conclusion = JEOPARDY_WITH_RPA if rpa_description was supplied
                     else JEOPARDY
      else:
        rpa_required = false
        conclusion = NO_JEOPARDY

      # ---- Reinitiation trigger -------------------------------------------
      reinitiation_trigger_units = round_half_up(
          authorized_take_units * REINITIATION_TRIGGER_PCT, 2)
    input_set: >-
      PresenceDetermination rows of the consultation's ProjectAction with
      presence_status IN {PRESENT, PRESUMED_PRESENT}. The species pool is the
      distinct set of Species those rows reference; exposed_acres sums only the
      rows referencing the selected primary species. Ordering for selection is
      (LISTING_RANK DESC, recovery_unit_population ASC, Species.created_at ASC).
    constants:
      JEOPARDY_FRACTION_THRESHOLD: 0.0500
      REINITIATION_TRIGGER_PCT: 0.90
    precision: >-
      authorized_take_units and reinitiation_trigger_units: 2 decimal places,
      round_half_up. jeopardy_fraction: 4 decimal places, round_half_up. The
      jeopardy comparison uses `>=` against the ROUNDED 4-decimal fraction, so a
      fraction that rounds to exactly 0.0500 IS a jeopardy conclusion.
    notes:
      - "All three conclusions are persistable at issuance: NO_JEOPARDY, JEOPARDY (rpa_required true, rpa_description null) and JEOPARDY_WITH_RPA (rpa_required true, rpa_description supplied). Issuing an opinion never fails on the jeopardy screen."
      - "An unresolved JEOPARDY conclusion blocks the plan LATER, at POST /habitat-conservation-plans/{id}/decision with decision = APPROVE, via ERR_JEOPARDY_UNRESOLVED — supplying rpa_description at opinion time is what clears that gate."
      - "reinitiation_trigger_units is what the permit ledger is later compared against, so REINITIATION_TRIGGER_PCT ties this calculation to the take-exceedance cascade."

  - name: funding_assurance_status
    trigger: "recomputed on POST /habitat-conservation-plans/{id}/funding-assurances, on POST /habitat-conservation-plans/{id}/mitigation-commitments, on the RETURN_FOR_REVISION branch of POST /habitat-conservation-plans/{id}/decision, and on POST /changed-circumstance-events/{id}/response — writes funded_ratio and funding_status"
    algorithm: threshold
    formula: |
      # funded_ratio is REPORTING ONLY. The status decision is made on integer
      # cents so that a ratio which rounds to 0.5000 from below cannot be
      # mistaken for the half-funded boundary.
      if endowment_required_cents == 0:
        funded_ratio   = 0.0000
        funding_status = UNFUNDED
      else:
        funded_ratio = round_half_up(
            endowment_secured_cents / endowment_required_cents, 4)
        if   endowment_secured_cents >= endowment_required_cents:
          funding_status = FULLY_ASSURED
        elif endowment_secured_cents * 2 >= endowment_required_cents:
          funding_status = PARTIALLY_ASSURED
        else:
          funding_status = UNFUNDED
    input_set: >-
      The single HabitatConservationPlan row: its endowment_secured_cents (the
      running sum of every accepted funding-assurance contribution plus every
      changed-circumstance response contribution) against its
      endowment_required_cents (from calculations.endowment_requirement).
    constants:
      PARTIAL_ASSURANCE_NUMERATOR: 1
      PARTIAL_ASSURANCE_DENOMINATOR: 2
    precision: >-
      funded_ratio: exactly 4 decimal places, round_half_up, reporting only.
      Status comparisons are exact integer-cent comparisons using `>=`, never a
      comparison against funded_ratio.
    notes:
      - "endowment_secured_cents * 2 >= endowment_required_cents is the exact half-funded boundary: one cent less than half is UNFUNDED even though funded_ratio still displays 0.5000."
      - "endowment_required_cents == 0 is pinned to UNFUNDED (not FULLY_ASSURED) so that a returned-for-revision plan cannot be approved on an empty commitment set."

  - name: consultation_deadline
    trigger: "on Consultation creation (from POST /project-actions/{id}/effect-determination) and recomputed on every POST /consultations/{id}/biological-assessment that resumes from INFO_REQUESTED or REINITIATION_REQUIRED — writes statutory_days, tolled_days, deadline_at"
    algorithm: chronological
    formula: |
      # At creation:
      statutory_days = FORMAL_CONSULTATION_DAYS   if consultation_type == FORMAL
                       else INFORMAL_CONSULTATION_DAYS
      tolled_days    = 0
      clock_started_at = current logical clock
      deadline_at    = clock_started_at + (statutory_days + tolled_days) days

      # On each resubmission that closes an information-request episode
      # (INFO_REQUESTED -> UNDER_REVIEW), the elapsed WHOLE days are tolled:
      episode_days = floor((current logical clock - info_requested_at)
                           / 86400 seconds)
      tolled_days += episode_days
      deadline_at  = clock_started_at + (statutory_days + tolled_days) days

      # On reinitiation (REINITIATION_REQUIRED -> UNDER_REVIEW) the clock
      # RESTARTS: clock_started_at = current logical clock, tolled_days = 0,
      # info_request_count = 0, and deadline_at is recomputed from scratch.
    input_set: >-
      The single Consultation row plus the current logical clock. Each
      information-request episode contributes floor(elapsed_seconds / 86400)
      days exactly once, at the moment the episode closes; an episode still open
      contributes nothing.
    constants:
      FORMAL_CONSULTATION_DAYS: 135
      INFORMAL_CONSULTATION_DAYS: 60
      MAX_INFO_REQUESTS: 2
    precision: "whole days; partial days are truncated toward zero by floor, so a 6-day-23-hour episode tolls 6 days"
    notes:
      - "The deadline gates only POST /consultations/{id}/information-request (ERR_CONSULTATION_DEADLINE_PASSED). Issuing an opinion after the deadline is allowed but stamps BiologicalOpinion.issued_late = true — lateness is recorded, not blocked."
      - "info_request_count is capped at MAX_INFO_REQUESTS; the third request is ERR_INVALID_STATE_TRANSITION, not a deadline error."

  - name: monitoring_report_lateness_and_take_ledger
    trigger: "on POST /incidental-take-permits/{id}/monitoring-reports (writes due_at, is_late and moves the permit ledger) and reversed on the REJECT branch of POST /monitoring-reports/{id}/adjudication"
    algorithm: aggregation
    formula: |
      # ---- Lateness -------------------------------------------------------
      submitted_at = current logical clock
      due_at       = period_end + REPORT_DUE_DAYS days
      # Date-part comparison: the UTC calendar date of submitted_at against the
      # due_at date. Strict `>`, so submitting ON the due date is on time.
      is_late      = date_of_utc(submitted_at) > due_at

      # ---- Permit take ledger (the conserved quantity) --------------------
      # Applied at SUBMISSION, before adjudication.
      permit.take_consumed_units  = round_half_up(
          permit.take_consumed_units + take_units_reported, 2)
      permit.take_remaining_units = round_half_up(
          permit.authorized_take_units - permit.take_consumed_units, 2)
      # INVARIANT, checked after every write and every reversal:
      #   permit.authorized_take_units
      #     == permit.take_consumed_units + permit.take_remaining_units

      # Guard, evaluated BEFORE the ledger is touched:
      if take_units_reported > permit.take_remaining_units:
        raise ERR_TAKE_LIMIT_EXCEEDED

      # ---- Threshold check, AFTER the ledger is updated -------------------
      if permit.take_consumed_units >= permit.reinitiation_trigger_units
         and permit.status == ACTIVE:
        permit -> SUSPENDED         # starts the take-exceedance cascade

      # ---- Compensation on REJECT -----------------------------------------
      permit.take_consumed_units  = round_half_up(
          permit.take_consumed_units - report.take_units_reported, 2)
      permit.take_remaining_units = round_half_up(
          permit.authorized_take_units - permit.take_consumed_units, 2)
      if permit.status == SUSPENDED
         and permit.take_consumed_units < permit.reinitiation_trigger_units:
        permit -> ACTIVE            # unwinds the cascade
    input_set: >-
      MonitoringReport rows of the permit with status IN {SUBMITTED, ACCEPTED}
      constitute the applied take; REJECTED rows contribute nothing and their
      reporting period is freed. Reports are applied in submission order
      (created_at ASC) and the ledger is maintained incrementally, never
      recomputed from scratch.
    constants:
      REPORT_DUE_DAYS: 45
    precision: "take units: 2 decimal places, round_half_up. The trigger comparison is `>=` on take_consumed_units, so exact equality with reinitiation_trigger_units suspends the permit; the un-suspend comparison is strict `<`."
    notes:
      - "ERR_TAKE_LIMIT_EXCEEDED is checked against take_remaining_units BEFORE the ledger moves, so a rejected request leaves the ledger and the permit status untouched."
      - "Conserved quantity: authorized_take_units == take_consumed_units + take_remaining_units holds after submission, after acceptance and after rejection. Any drift is a defect."

  - name: compliance_standing_score
    trigger: "re-derived at read time on GET /proponents/{id} — writes the response's compliance_standing_score and compliance_variant_applied (never persisted as authoritative)"
    algorithm: weighted_scoring
    formula: |
      now = current logical clock
      window_start = now - ROLLING_WINDOW_DAYS days

      # ---- Variant selection ----------------------------------------------
      # ROLLING_12_MONTH applies when the proponent has at least one
      # MonitoringReport (any status) whose period_end falls in the closed
      # interval [window_start, now]; otherwise LIFETIME.
      reports = MonitoringReport rows reachable as
                  proponent -> ProjectAction -> HabitatConservationPlan
                            -> IncidentalTakePermit -> MonitoringReport
      if any(window_start <= r.period_end <= now for r in reports):
        compliance_variant_applied = ROLLING_12_MONTH
      else:
        compliance_variant_applied = LIFETIME

      # ---- Penalty events, each with a weight and an event_date -----------
      events = []
      for r in reports:
        if r.status == ACCEPTED and r.is_late:
          events += (W_LATE_REPORT,     r.submitted_at)
        if r.status == REJECTED:
          events += (W_REJECTED_REPORT, r.adjudicated_at)
      for c in Consultation rows of the proponent's ProjectActions
               with status == REINITIATION_REQUIRED:
          events += (W_OPEN_REINITIATION, c.reinitiation_triggered_at)
      for e in ChangedCircumstanceEvent rows of the proponent's plans
               with status == RESPONSE_REQUIRED:
          events += (W_UNRESPONDED_CIRCUMSTANCE, e.reported_at)

      # ---- Window filter, variant-dependent -------------------------------
      if compliance_variant_applied == ROLLING_12_MONTH:
        events = [(w, d) for (w, d) in events if window_start <= d <= now]
      # LIFETIME keeps every event regardless of age.

      # ---- Age decay -------------------------------------------------------
      # A single halving step, not a continuous curve.
      raw_penalty = 0
      for (w, d) in events:
        age_days = floor((now - d) / 86400 seconds)
        raw_penalty += w * 0.5 if age_days > DECAY_HALVING_DAYS else w

      score = round_half_up(BASE_SCORE - raw_penalty, 2)
      compliance_standing_score = max(SCORE_FLOOR, score)
    input_set: >-
      Penalty events over the proponent's whole FK subtree
      (Proponent -> ProjectAction -> HabitatConservationPlan ->
      IncidentalTakePermit -> MonitoringReport, plus Consultation via
      ProjectAction and ChangedCircumstanceEvent via HabitatConservationPlan).
      Only ACCEPTED-and-late reports, REJECTED reports, Consultations currently
      in REINITIATION_REQUIRED, and ChangedCircumstanceEvents currently in
      RESPONSE_REQUIRED contribute. Summation is order-insensitive.
    constants:
      BASE_SCORE: 100
      W_LATE_REPORT: 6
      W_REJECTED_REPORT: 11
      W_OPEN_REINITIATION: 18
      W_UNRESPONDED_CIRCUMSTANCE: 9
      DECAY_HALVING_DAYS: 180
      DECAY_FACTOR: 0.5
      ROLLING_WINDOW_DAYS: 365
      SCORE_FLOOR: 0
    precision: >-
      score: 2 decimal places, round_half_up, then clamped at SCORE_FLOOR.
      Decay is applied per event before summation (a halved weight of 11 is
      5.5 and stays fractional in the sum), so the sum is rounded exactly once
      at the end. Age uses strict `>` against DECAY_HALVING_DAYS, so an event
      exactly 180 whole days old still carries its full weight.
    variants:
      - name: ROLLING_12_MONTH
        when: "the proponent has at least one MonitoringReport whose period_end lies in [now - 365 days, now]"
        difference: >-
          Only penalty events whose event_date lies in the same closed
          365-day window are counted; older events vanish entirely.
      - name: LIFETIME
        when: "the proponent has no MonitoringReport with period_end in [now - 365 days, now]"
        difference: >-
          Every penalty event counts regardless of age, but events older than
          DECAY_HALVING_DAYS carry half weight. A proponent whose reporting has
          gone quiet is therefore scored on its entire history.
    notes:
      - "consistency_model is eventual for exactly these two response fields: they are re-derived on each read and can change with no write to Proponent, purely because the logical clock moved."
      - "The two variants can be made to disagree on identical data by moving only the clock, which is the intended divergence probe."

  - name: changed_circumstance_cost_allocation
    trigger: "on POST /habitat-conservation-plans/{id}/changed-circumstance-events — writes reserve_draw_cents, required_additional_cents, permittee_borne_cents, agency_borne_cents, assurances_invoked, status, and the plan's reserve_drawn_cents / reserve_remaining_cents"
    algorithm: waterfall_allocation
    formula: |
      if circumstance_type == CHANGED:
        # First bucket: the plan's changed-circumstance reserve.
        reserve_draw_cents = min(response_cost_cents,
                                 hcp.reserve_remaining_cents)
        hcp.reserve_drawn_cents    += reserve_draw_cents
        hcp.reserve_remaining_cents = hcp.changed_circumstance_reserve_cents
                                      - hcp.reserve_drawn_cents
        # Second bucket: the permittee, for whatever the reserve did not cover.
        required_additional_cents = response_cost_cents - reserve_draw_cents
        permittee_borne_cents     = response_cost_cents
        agency_borne_cents        = 0
        assurances_invoked        = false
        status = RESPONSE_REQUIRED if required_additional_cents > 0
                 else RESPONDED

      if circumstance_type == UNFORESEEN:
        # "No surprises" assurances: the reserve is NOT touched, and the
        # permittee's exposure is capped at a share of what it has already
        # endowed. The agency absorbs the remainder.
        reserve_draw_cents    = 0
        permittee_cap_cents   = round_half_up(
            hcp.endowment_secured_cents * UNFORESEEN_PERMITTEE_SHARE_PCT)
        permittee_borne_cents = min(response_cost_cents, permittee_cap_cents)
        agency_borne_cents    = response_cost_cents - permittee_borne_cents
        required_additional_cents = 0
        assurances_invoked    = true
        status = ASSURANCES_INVOKED

      # INVARIANT for both branches:
      #   permittee_borne_cents + agency_borne_cents == response_cost_cents
    input_set: >-
      The single ChangedCircumstanceEvent being created plus the parent
      HabitatConservationPlan's changed_circumstance_reserve_cents,
      reserve_drawn_cents and endowment_secured_cents as they stand at that
      moment. Prior events affect this one only through reserve_drawn_cents.
    constants:
      UNFORESEEN_PERMITTEE_SHARE_PCT: 0.05
    precision: "integer cents, round_half_up on the permittee cap only; min() and subtraction are exact"
    notes:
      - "The two circumstance types produce opposite allocations from identical cost inputs: CHANGED puts the whole cost on the permittee and drains the reserve, UNFORESEEN caps the permittee at 5% of what it has endowed and puts the rest on the agency without touching the reserve."
      - "reserve_remaining_cents is derived, never independently assigned, so the reserve can be drained to exactly 0 but never below."

  - name: permit_issuance_derivation
    trigger: "on POST /habitat-conservation-plans/{id}/incidental-take-permits — writes permit_number, term_end, authorized_take_units, take_unit, reinitiation_trigger_units, take_consumed_units, take_remaining_units"
    algorithm: chronological
    formula: |
      # ---- Ordinal permit number, assigned in creation order --------------
      ordinal = 1 + count(IncidentalTakePermit rows created before this one)
                # equivalently: rank of this row in the global permit table
                # ordered by created_at ASC
      permit_number = "ITP-" + zero_pad(ordinal, 6)     # first permit: ITP-000001

      # ---- Term ------------------------------------------------------------
      term_end = term_start + hcp.permit_term_years years
      # Calendar-year addition. If term_start is 02-29 and the target year is
      # not a leap year, term_end clamps to 02-28 of that year.

      # ---- Take ledger seeded from the action's biological opinion ---------
      # Selector: the BiologicalOpinion whose consultation_id ==
      # ProjectAction(hcp.project_action_id).active_consultation_id; if more
      # than one exists for that consultation, the one with the greatest
      # issued_at, tie-broken by created_at ASC.
      bo = that BiologicalOpinion
      authorized_take_units      = bo.authorized_take_units
      take_unit                  = bo.take_unit
      reinitiation_trigger_units = bo.reinitiation_trigger_units
      take_consumed_units        = 0.00
      take_remaining_units       = bo.authorized_take_units
      suspension_count           = 0
    input_set: >-
      The parent HabitatConservationPlan (permit_term_years, project_action_id),
      the ProjectAction's active Consultation, and that Consultation's
      BiologicalOpinion selected by (issued_at DESC, created_at ASC). The
      permit-number ordinal counts every IncidentalTakePermit row ever created,
      ordered created_at ASC — never by id.
    constants:
      PERMIT_NUMBER_PREFIX: "ITP-"
      PERMIT_NUMBER_ORDINAL_WIDTH: 6
    precision: "take units: 2 decimal places. term_end is a date-only value; the leap-day clamp is normative."
    notes:
      - "The permit inherits its whole take budget from the biological opinion — the permit never recomputes take from presence determinations."

  - name: interval_conflict_detection
    trigger: "on POST /project-actions/{id}/presence-determinations (survey windows) and on POST /incidental-take-permits/{id}/monitoring-reports (reporting periods)"
    algorithm: interval_merge
    formula: |
      # ---- A. FIELD_SURVEY windows on the same CriticalHabitatUnit --------
      # CLOSED intervals, widened by a disturbance buffer on BOTH sides.
      # Participants: PresenceDetermination rows with method == FIELD_SURVEY
      # and a non-null critical_habitat_unit_id equal to the new row's, across
      # ALL project actions (the buffer protects the habitat, not the project).
      conflict_A = new.survey_window_start
                     <= existing.survey_window_end
                        + SURVEY_DISTURBANCE_BUFFER_DAYS days
                   AND
                   new.survey_window_end
                     + SURVEY_DISTURBANCE_BUFFER_DAYS days
                     >= existing.survey_window_start
      # -> ERR_SURVEY_WINDOW_CONFLICT (409)
      # DATABASE_QUERY rows and rows with a null critical_habitat_unit_id never
      # participate on either side.

      # ---- B. MonitoringReport periods on the same permit ------------------
      # BARE HALF-OPEN intervals [period_start, period_end). No buffer.
      # Adjacency is explicitly ALLOWED: a period starting exactly on another
      # period's period_end does not conflict.
      # Participants: reports of the SAME permit with
      # status IN {SUBMITTED, ACCEPTED}. REJECTED reports free their interval.
      conflict_B = new.period_start < existing.period_end
                   AND new.period_end > existing.period_start
      # -> ERR_REPORTING_PERIOD_OVERLAP (409)
    input_set: >-
      (A) All PresenceDetermination rows with method == FIELD_SURVEY and
      critical_habitat_unit_id == the new row's critical_habitat_unit_id,
      regardless of project_action_id.
      (B) All MonitoringReport rows with permit_id == the target permit and
      status IN {SUBMITTED, ACCEPTED}.
    constants:
      SURVEY_DISTURBANCE_BUFFER_DAYS: 3
    precision: >-
      Date-only comparisons. (A) is closed-and-buffered: two windows 3 days
      apart conflict, 4 days apart do not. (B) is half-open and unbuffered:
      [2027-01-01, 2027-04-01) and [2027-04-01, 2027-07-01) coexist.
    notes:
      - "Two deliberately different interval semantics on two different resources — importing (A)'s buffered closed comparison into (B) would reject every legitimate back-to-back reporting period."

# ============================================================================
# §1.4 Validation Rules Table — evaluated in ascending priority order.
# The FIRST violated rule decides the response; later violations are never
# reported. Four priority-conflict pairs are called out in the trailing
# validation_priority_conflicts block.
# ============================================================================
validations:

  - priority: 1
    category: auth
    check: "X-Role header present and non-empty on every endpoint except POST /proponents (which accepts the Anonymous role); X-User-ID header present and non-empty whenever X-Role is Proponent or WildlifeAgency (the Auditor and Anonymous roles do not require it)"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "X-Role names one of the four declared roles (Proponent, WildlifeAgency, Auditor, Anonymous); an unknown role string is treated as unauthenticated, not as forbidden"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 3
    category: auth
    check: "the authenticated role appears in the target endpoint's §1.5 roles list"
    error_id: ERR_ROLE_NOT_PERMITTED
    http_status: 403
    applies_to: all

  - priority: 4
    category: existence
    check: "every id in the request path resolves to a persisted row, checked LEFT TO RIGHT so the leftmost missing segment decides the error_id"
    error_id: "ERR_SPECIES_NOT_FOUND | ERR_PROPONENT_NOT_FOUND | ERR_PROJECT_ACTION_NOT_FOUND | ERR_CRITICAL_HABITAT_UNIT_NOT_FOUND | ERR_PRESENCE_DETERMINATION_NOT_FOUND | ERR_CONSULTATION_NOT_FOUND | ERR_HCP_NOT_FOUND | ERR_CONSERVATION_BANK_NOT_FOUND | ERR_PERMIT_NOT_FOUND | ERR_MONITORING_REPORT_NOT_FOUND | ERR_CIRCUMSTANCE_EVENT_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with a path parameter"

  - priority: 5
    category: auth
    check: "when the role is Proponent, the target resource's owning Proponent (resolved by ProjectAction.proponent_id, or by HabitatConservationPlan -> ProjectAction, or by IncidentalTakePermit -> HabitatConservationPlan -> ProjectAction, or by Consultation -> ProjectAction, or by MonitoringReport -> IncidentalTakePermit -> ... , or by ChangedCircumstanceEvent -> HabitatConservationPlan -> ...) must equal the Proponent identified by X-User-ID"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "all Proponent-role endpoints that carry a path id; additionally POST /project-actions: when the body proponent_id resolves to a persisted Proponent it must be the one named by X-User-ID (a proponent may not open an action in another proponent's name), while a body proponent_id that resolves to nothing falls through to priority 6 and is reported as ERR_PROPONENT_NOT_FOUND; an X-User-ID that names no Proponent row is ERR_NOT_RESOURCE_OWNER on every Proponent-role endpoint, never a 401"

  - priority: 6
    category: business_referential
    check: "every foreign key supplied in the request BODY resolves to a persisted row (proponent_id, species_id, critical_habitat_unit_id, conservation_bank_id), checked in that declared order; additionally, when critical_habitat_unit_id is supplied on POST /project-actions/{id}/presence-determinations the unit's species_id MUST equal the request's species_id — a unit designated for a different species is reported as ERR_CRITICAL_HABITAT_UNIT_NOT_FOUND, since it does not exist for that species"
    error_id: "ERR_PROPONENT_NOT_FOUND | ERR_SPECIES_NOT_FOUND | ERR_CRITICAL_HABITAT_UNIT_NOT_FOUND | ERR_CONSERVATION_BANK_NOT_FOUND"
    http_status: 404
    applies_to: "POST /project-actions, POST /project-actions/{id}/presence-determinations, POST /conservation-banks, POST /habitat-conservation-plans/{id}/mitigation-commitments"

  - priority: 7
    category: business_constraint
    check: "request body conforms to the endpoint's §1.5 input schema — every required field present, no unknown fields, correct JSON types, enum members drawn from the declared constraint set, monetary fields non-negative integers, quantity fields non-negative with at most 2 decimal places, month fields integers in 1..12, permit_term_years an integer in 1..50, dates valid ISO-8601 calendar dates (YYYY-MM-DD, no time part), instants ISO-8601 UTC with a trailing Z and either whole seconds or exactly three fractional digits (both 2026-10-01T00:00:00Z and 2026-10-01T00:00:00.000Z are accepted and denote the same instant); also construction_start_date <= construction_end_date on POST /project-actions and ba_effects_analysis_complete == true on POST /consultations/{id}/biological-assessment"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all write endpoints; additionally the limit and offset query parameters of the two paginated list endpoints, which must be integers within the §1.0 pagination_defaults bounds (limit 1..100, offset >= 0) — an out-of-range limit is rejected, never silently clamped"

  - priority: 8
    category: state
    check: "the supplied expected_hcp_version / expected_permit_version equals the current version of the parent row named in the path, per §1.2.1"
    error_id: "ERR_STALE_HCP_VERSION | ERR_STALE_PERMIT_VERSION"
    http_status: 412
    applies_to: "POST /habitat-conservation-plans/{id}/mitigation-commitments, POST /incidental-take-permits/{id}/monitoring-reports"

  - priority: 9
    category: state
    check: "the target row's current state appears as a `from:` state for the requested trigger in §1.2 — includes plan_status, funding-dimension gating, consultation status, report status, event status, and the info_request_count < MAX_INFO_REQUESTS cap"
    error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    applies_to: "all action and nested-creation endpoints"

  - priority: 10
    category: state
    check: "the IncidentalTakePermit named in the path has status == ACTIVE"
    error_id: ERR_PERMIT_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /incidental-take-permits/{id}/monitoring-reports"

  - priority: 11
    category: business_safety
    check: "on permit issuance, X-User-ID must differ from HabitatConservationPlan.approved_by_user_id — the official who approved the plan may not also issue its take permit"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /habitat-conservation-plans/{id}/incidental-take-permits"

  - priority: 12
    category: business_safety
    check: "on monitoring-report adjudication, X-User-ID must differ from IncidentalTakePermit.issued_by_user_id of the report's permit — the official who issued the permit may not adjudicate compliance against it"
    error_id: ERR_ADJUDICATOR_CONFLICT
    http_status: 403
    applies_to: "POST /monitoring-reports/{id}/adjudication"

  - priority: 13
    category: business_safety
    check: "a conservation bank may only be established for a species whose listing_status IN {ENDANGERED, THREATENED}; PROPOSED and CANDIDATE species carry no take liability and therefore no sellable credits"
    error_id: ERR_SPECIES_NOT_LISTED
    http_status: 422
    applies_to: "POST /conservation-banks"

  - priority: 14
    category: business_safety
    check: "the consultation's consultation_type must match the concluding action: only INFORMAL consultations may be concluded by concurrence, and only FORMAL consultations may be concluded by a biological opinion"
    error_id: ERR_CONSULTATION_TYPE_MISMATCH
    http_status: 422
    applies_to: "POST /consultations/{id}/concurrence, POST /consultations/{id}/biological-opinion"

  - priority: 15
    category: business_safety
    check: "a habitat conservation plan may only be created for a ProjectAction whose action_type == NON_FEDERAL; FEDERAL_FUNDED and FEDERAL_PERMITTED actions are covered by the federal consultation's incidental take statement instead"
    error_id: ERR_HCP_NOT_ALLOWED_FOR_FEDERAL_ACTION
    http_status: 422
    applies_to: "POST /project-actions/{id}/habitat-conservation-plans"

  - priority: 16
    category: business_safety
    check: "a plan may not be approved while the action's active Consultation has a BiologicalOpinion with conclusion == JEOPARDY (no reasonable and prudent alternative on record); conclusion == JEOPARDY_WITH_RPA and conclusion == NO_JEOPARDY both pass"
    error_id: ERR_JEOPARDY_UNRESOLVED
    http_status: 422
    applies_to: "POST /habitat-conservation-plans/{id}/decision"

  - priority: 17
    category: business_temporal
    check: "when method == FIELD_SURVEY both survey_window_start and survey_window_end are required and survey_window_start <= survey_window_end; when method == DATABASE_QUERY both must be omitted or null"
    error_id: ERR_SURVEY_WINDOW_INVALID
    http_status: 422
    applies_to: "POST /project-actions/{id}/presence-determinations"

  - priority: 18
    category: business_temporal
    check: "the current logical clock must not exceed Consultation.deadline_at when the agency requests additional information"
    error_id: ERR_CONSULTATION_DEADLINE_PASSED
    http_status: 422
    applies_to: "POST /consultations/{id}/information-request"

  - priority: 19
    category: business_temporal
    check: "the reporting period must satisfy period_start < period_end, period_start >= IncidentalTakePermit.term_start, period_end <= IncidentalTakePermit.term_end, and period_end <= the current logical clock (no reporting on a period that has not closed)"
    error_id: ERR_PERIOD_OUTSIDE_PERMIT_TERM
    http_status: 422
    applies_to: "POST /incidental-take-permits/{id}/monitoring-reports"

  - priority: 20
    category: business_constraint
    check: "per calculations.interval_conflict_detection branch A — the new FIELD_SURVEY window must not fall within SURVEY_DISTURBANCE_BUFFER_DAYS of any existing FIELD_SURVEY window on the same CriticalHabitatUnit, across all project actions"
    error_id: ERR_SURVEY_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /project-actions/{id}/presence-determinations"

  - priority: 21
    category: business_constraint
    check: "per calculations.interval_conflict_detection branch B — the new half-open [period_start, period_end) must not overlap any MonitoringReport of the same permit with status IN {SUBMITTED, ACCEPTED}; exact adjacency is allowed"
    error_id: ERR_REPORTING_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /incidental-take-permits/{id}/monitoring-reports"

  - priority: 22
    category: business_constraint
    check: "the ProjectAction must have at least one PresenceDetermination row before an effect determination can be made, and at least one candidate row (presence_status IN {PRESENT, PRESUMED_PRESENT}) before a biological opinion or a mitigation requirement can be computed"
    error_id: ERR_NO_PRESENCE_DETERMINATIONS
    http_status: 422
    applies_to: "POST /project-actions/{id}/effect-determination, POST /consultations/{id}/biological-opinion, POST /project-actions/{id}/habitat-conservation-plans"

  - priority: 23
    category: business_constraint
    check: "the plan must have at least one MitigationCommitment with status == RESERVED before it can be submitted"
    error_id: ERR_NO_MITIGATION_COMMITMENTS
    http_status: 422
    applies_to: "POST /habitat-conservation-plans/{id}/submit"

  - priority: 24
    category: business_referential
    check: "when mechanism == CONSERVATION_BANK_CREDIT, conservation_bank_id is required and the bank must be eligible: ConservationBank.covered_species_id must equal the id of the species selected as primary by calculations.incidental_take_authorization for the plan's ProjectAction, AND the ProjectAction.county_code must appear in ConservationBank.service_area_county_codes. When mechanism != CONSERVATION_BANK_CREDIT, conservation_bank_id must be omitted or null"
    error_id: ERR_BANK_NOT_ELIGIBLE
    http_status: 422
    applies_to: "POST /habitat-conservation-plans/{id}/mitigation-commitments"

  - priority: 25
    category: business_fiscal
    check: "ConservationBank.credits_available >= the requested units"
    error_id: ERR_INSUFFICIENT_BANK_CREDITS
    http_status: 409
    applies_to: "POST /habitat-conservation-plans/{id}/mitigation-commitments"

  - priority: 26
    category: business_fiscal
    check: "on decision == APPROVE, HabitatConservationPlan.funding_status must be FULLY_ASSURED per calculations.funding_assurance_status"
    error_id: ERR_FUNDING_NOT_ASSURED
    http_status: 422
    applies_to: "POST /habitat-conservation-plans/{id}/decision"

  - priority: 27
    category: business_fiscal
    check: "on decision == APPROVE, HabitatConservationPlan.secured_mitigation_units must be >= HabitatConservationPlan.final_mitigation_units"
    error_id: ERR_MITIGATION_SHORTFALL
    http_status: 422
    applies_to: "POST /habitat-conservation-plans/{id}/decision"

  - priority: 28
    category: business_fiscal
    check: "take_units_reported must not exceed IncidentalTakePermit.take_remaining_units as it stands before this report is applied"
    error_id: ERR_TAKE_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /incidental-take-permits/{id}/monitoring-reports"

  - priority: 29
    category: business_fiscal
    check: "contributed_cents must be >= ChangedCircumstanceEvent.required_additional_cents"
    error_id: ERR_RESERVE_CONTRIBUTION_INSUFFICIENT
    http_status: 422
    applies_to: "POST /changed-circumstance-events/{id}/response"

# Four deliberate priority-conflict pairs. Each pair is jointly violable by a
# single request, and the pair members sit in DIFFERENT validation categories,
# so each pair probes a different edge of the ladder.
validation_priority_conflicts:
  - name: permit-not-active-beats-take-limit
    endpoint: "POST /incidental-take-permits/{id}/monitoring-reports"
    lower_priority_rule: {priority: 10, category: state, error_id: ERR_PERMIT_NOT_ACTIVE}
    higher_priority_rule: {priority: 28, category: business_fiscal, error_id: ERR_TAKE_LIMIT_EXCEEDED}
    jointly_violating_request: "a permit already SUSPENDED by an earlier exceedance receives a report whose take_units_reported also exceeds take_remaining_units"
    expected_error_id: ERR_PERMIT_NOT_ACTIVE
    category_pair: "state vs business_fiscal"

  - name: jeopardy-beats-mitigation-shortfall
    endpoint: "POST /habitat-conservation-plans/{id}/decision"
    lower_priority_rule: {priority: 16, category: business_safety, error_id: ERR_JEOPARDY_UNRESOLVED}
    higher_priority_rule: {priority: 27, category: business_fiscal, error_id: ERR_MITIGATION_SHORTFALL}
    jointly_violating_request: "APPROVE on a plan whose action carries a JEOPARDY opinion AND whose secured_mitigation_units are below final_mitigation_units"
    expected_error_id: ERR_JEOPARDY_UNRESOLVED
    category_pair: "business_safety vs business_fiscal"

  - name: period-outside-term-beats-period-overlap
    endpoint: "POST /incidental-take-permits/{id}/monitoring-reports"
    lower_priority_rule: {priority: 19, category: business_temporal, error_id: ERR_PERIOD_OUTSIDE_PERMIT_TERM}
    higher_priority_rule: {priority: 21, category: business_constraint, error_id: ERR_REPORTING_PERIOD_OVERLAP}
    jointly_violating_request: "a reporting period whose period_end lies beyond the current logical clock AND which overlaps an already-SUBMITTED report on the same permit"
    expected_error_id: ERR_PERIOD_OUTSIDE_PERMIT_TERM
    category_pair: "business_temporal vs business_constraint"

  - name: bank-not-eligible-beats-insufficient-credits
    endpoint: "POST /habitat-conservation-plans/{id}/mitigation-commitments"
    lower_priority_rule: {priority: 24, category: business_referential, error_id: ERR_BANK_NOT_ELIGIBLE}
    higher_priority_rule: {priority: 25, category: business_fiscal, error_id: ERR_INSUFFICIENT_BANK_CREDITS}
    jointly_violating_request: "a commitment citing a bank whose service_area_county_codes excludes the action's county_code AND requesting more units than the bank's credits_available"
    expected_error_id: ERR_BANK_NOT_ELIGIBLE
    category_pair: "business_referential vs business_fiscal"

# ============================================================================
# §1.5 API Endpoint Table
#
# Path/collection conventions (api_prefix is "/", so every path below is
# absolute and complete):
#   Species                  -> /species
#   Proponent                -> /proponents
#   ProjectAction            -> /project-actions
#   PresenceDetermination    -> /presence-determinations
#   Consultation             -> /consultations
#   ConservationBank         -> /conservation-banks
#   HabitatConservationPlan  -> /habitat-conservation-plans
#   IncidentalTakePermit     -> /incidental-take-permits
#
# The two top-level list endpoints (/project-actions, /presence-determinations)
# are PAGINATED: they accept limit? and offset? and their envelope carries
# total_count and has_more. Every sub-resource list below is UNPAGINATED and
# returns the complete collection in creation order (created_at ASC) with a
# null pagination block.
# ============================================================================
endpoints:

  # ---------------------------- reads --------------------------------------
  - method: GET
    path: "/species/{id}"
    description: "Retrieve one species, including its computed critical_habitat_designated flag and its listing-change audit counters."
    roles: [Proponent, WildlifeAgency, Auditor]
    code: 200
    input: []
    output: Species
    side_effects: []

  - method: GET
    path: "/species/{id}/critical-habitat-units"
    description: "List every designated or proposed critical habitat unit for a species, in created_at ASC order. Unpaginated. Reverse-reachability for CriticalHabitatUnit.species_id."
    roles: [Proponent, WildlifeAgency, Auditor]
    code: 200
    input: []
    output: "CriticalHabitatUnit[]"
    side_effects: []

  - method: GET
    path: "/species/{id}/conservation-banks"
    description: "List every conservation bank whose covered_species_id is this species, in created_at ASC order. Unpaginated. Reverse-reachability for ConservationBank.covered_species_id."
    roles: [Proponent, WildlifeAgency, Auditor]
    code: 200
    input: []
    output: "ConservationBank[]"
    side_effects: []

  - method: GET
    path: "/proponents/{id}"
    description: "Retrieve one proponent. compliance_standing_score and compliance_variant_applied are re-derived on every read by calculations.compliance_standing_score against the current logical clock, so the same row can return different values at different clock positions with no intervening write."
    roles: [Proponent, WildlifeAgency, Auditor]
    code: 200
    input: []
    output: Proponent
    side_effects:
      - "recomputes compliance_standing_score, compliance_variant_applied and open_reinitiation_count for the response (read-time derivation, not a persisted write)"

  - method: GET
    path: "/project-actions"
    description: "Paginated list of project actions with optional filters. Reverse-reachability for ProjectAction.proponent_id and for ProjectAction.active_consultation_id."
    roles: [Proponent, WildlifeAgency, Auditor]
    code: 200
    input: ["proponent_id?", "active_consultation_id?", "status?", "effect_determination?", "limit?", "offset?"]
    output: "ProjectAction[]"
    side_effects: []

  - method: GET
    path: "/project-actions/{id}"
    description: "Retrieve one project action, including total_overlap_acres, overlap_pct, effect_determination, active_consultation_id and reinitiation_reason."
    roles: [Proponent, WildlifeAgency, Auditor]
    code: 200
    input: []
    output: ProjectAction
    side_effects: []

  - method: GET
    path: "/project-actions/{id}/consultations"
    description: "List every consultation opened for a project action, in created_at ASC order. Unpaginated. Reverse-reachability for Consultation.project_action_id."
    roles: [Proponent, WildlifeAgency, Auditor]
    code: 200
    input: []
    output: "Consultation[]"
    side_effects: []

  - method: GET
    path: "/project-actions/{id}/habitat-conservation-plans"
    description: "List the habitat conservation plans of a project action (0 or 1 rows), in created_at ASC order. Unpaginated. Reverse-reachability for HabitatConservationPlan.project_action_id."
    roles: [Proponent, WildlifeAgency, Auditor]
    code: 200
    input: []
    output: "HabitatConservationPlan[]"
    side_effects: []

  - method: GET
    path: "/presence-determinations"
    description: "Paginated list of presence determinations with optional filters. Reverse-reachability for PresenceDetermination.project_action_id, .species_id and .critical_habitat_unit_id."
    roles: [Proponent, WildlifeAgency, Auditor]
    code: 200
    input: ["project_action_id?", "species_id?", "critical_habitat_unit_id?", "presence_status?", "requires_reevaluation?", "limit?", "offset?"]
    output: "PresenceDetermination[]"
    side_effects: []

  - method: GET
    path: "/presence-determinations/{id}"
    description: "Retrieve one presence determination, including its derived presence_status, survey_in_season and requires_reevaluation flags."
    roles: [Proponent, WildlifeAgency, Auditor]
    code: 200
    input: []
    output: PresenceDetermination
    side_effects: []

  - method: GET
    path: "/consultations/{id}"
    description: "Retrieve one consultation, including statutory_days, tolled_days, deadline_at, ba_revision_number, info_request_count and reinitiation_count."
    roles: [Proponent, WildlifeAgency, Auditor]
    code: 200
    input: []
    output: Consultation
    side_effects: []

  - method: GET
    path: "/consultations/{id}/biological-opinions"
    description: "List the biological opinions issued under a consultation, in created_at ASC order. Unpaginated. This is the only discovery channel for a BiologicalOpinion beyond its creation response. Reverse-reachability for BiologicalOpinion.consultation_id."
    roles: [Proponent, WildlifeAgency, Auditor]
    code: 200
    input: []
    output: "BiologicalOpinion[]"
    side_effects: []

  - method: GET
    path: "/conservation-banks/{id}"
    description: "Retrieve one conservation bank, including the full credit ledger (credits_total_minted, credits_available, credits_reserved, credits_transferred)."
    roles: [Proponent, WildlifeAgency, Auditor]
    code: 200
    input: []
    output: ConservationBank
    side_effects: []

  - method: GET
    path: "/conservation-banks/{id}/mitigation-commitments"
    description: "List every mitigation commitment drawn against a bank, across all plans, in created_at ASC order. Unpaginated. Restricted to the agency and auditors because it exposes other proponents' commitments. Reverse-reachability for MitigationCommitment.conservation_bank_id."
    roles: [WildlifeAgency, Auditor]
    code: 200
    input: []
    output: "MitigationCommitment[]"
    side_effects: []

  - method: GET
    path: "/habitat-conservation-plans/{id}"
    description: "Retrieve one habitat conservation plan, including both state dimensions (plan_status, funding_status), the mitigation figures and the full endowment/reserve ledger."
    roles: [Proponent, WildlifeAgency, Auditor]
    code: 200
    input: []
    output: HabitatConservationPlan
    side_effects: []

  - method: GET
    path: "/habitat-conservation-plans/{id}/mitigation-commitments"
    description: "List a plan's mitigation commitments in created_at ASC order — the same order calculations.endowment_requirement uses. Unpaginated. Reverse-reachability for MitigationCommitment.hcp_id."
    roles: [Proponent, WildlifeAgency, Auditor]
    code: 200
    input: []
    output: "MitigationCommitment[]"
    side_effects: []

  - method: GET
    path: "/habitat-conservation-plans/{id}/incidental-take-permits"
    description: "List a plan's incidental take permits (0 or 1 rows), in created_at ASC order. Unpaginated. Reverse-reachability for IncidentalTakePermit.hcp_id."
    roles: [Proponent, WildlifeAgency, Auditor]
    code: 200
    input: []
    output: "IncidentalTakePermit[]"
    side_effects: []

  - method: GET
    path: "/habitat-conservation-plans/{id}/changed-circumstance-events"
    description: "List a plan's changed and unforeseen circumstance events in created_at ASC order, with their cost allocations. Unpaginated. Reverse-reachability for ChangedCircumstanceEvent.hcp_id."
    roles: [Proponent, WildlifeAgency, Auditor]
    code: 200
    input: []
    output: "ChangedCircumstanceEvent[]"
    side_effects: []

  - method: GET
    path: "/incidental-take-permits/{id}"
    description: "Retrieve one incidental take permit, including permit_number, term_end and the take ledger (authorized_take_units, take_consumed_units, take_remaining_units, reinitiation_trigger_units, suspension_count)."
    roles: [Proponent, WildlifeAgency, Auditor]
    code: 200
    input: []
    output: IncidentalTakePermit
    side_effects: []

  - method: GET
    path: "/incidental-take-permits/{id}/monitoring-reports"
    description: "List a permit's monitoring reports in created_at ASC order, including due_at, is_late and adjudication fields. Unpaginated. Reverse-reachability for MonitoringReport.permit_id."
    roles: [Proponent, WildlifeAgency, Auditor]
    code: 200
    input: []
    output: "MonitoringReport[]"
    side_effects: []

  # ---------------------------- writes -------------------------------------
  - method: POST
    path: "/proponents"
    description: "Register a project proponent. Open to Anonymous because this is the entry point that mints the identity every later Proponent-role call presents in X-User-ID."
    roles: [Anonymous]
    code: 201
    input: [org_name, contact_email, "is_federal_agency?"]
    output: Proponent
    side_effects:
      - "sets compliance_standing_score to 100.00 and compliance_variant_applied to LIFETIME (no reports exist yet)"
      - "sets open_reinitiation_count to 0"

  - method: POST
    path: "/species"
    description: "Register a listed, proposed or candidate species with its take-authorization unit, take density, recovery-unit population and survey season."
    roles: [WildlifeAgency]
    code: 201
    input: [scientific_name, common_name, listing_status, take_authorization_unit, take_density_per_acre, recovery_unit_population, survey_season_start_month, survey_season_end_month]
    output: Species
    side_effects:
      - "sets critical_habitat_designated to false, listing_change_count to 0 and last_listing_change_at to null"

  - method: POST
    path: "/species/{id}/critical-habitat-units"
    description: "Designate a critical habitat unit for a species."
    roles: [WildlifeAgency]
    code: 201
    input: [unit_code, acres, county_code, designation_status, primary_constituent_elements]
    output: CriticalHabitatUnit
    side_effects:
      - "sets Species.critical_habitat_designated to true when designation_status == FINAL (recomputed as: true if any unit of the species has designation_status == FINAL)"

  - method: POST
    path: "/species/{id}/listing-change"
    description: "Record a change to a species' listing status. Raising the LISTING_RANK starts the species-uplisting cascade; lowering or holding it starts nothing."
    roles: [WildlifeAgency]
    code: 200
    input: [new_listing_status, rationale]
    output: Species
    side_effects:
      - "sets listing_status = new_listing_status, listing_change_count += 1, last_listing_change_at = current logical clock"
      - "when LISTING_RANK[new_listing_status] > LISTING_RANK[old_listing_status]: every PresenceDetermination of this species with presence_status IN {PRESENT, PRESUMED_PRESENT} gets requires_reevaluation = true, in created_at ASC order"
      - "each affected ProjectAction with status IN {CONSULTATION_CONCLUDED, HCP_DEVELOPMENT, PERMITTED} moves to REINITIATION_PENDING with reinitiation_reason = SPECIES_UPLISTED, in created_at ASC order"
      - "each such action's Consultation named by active_consultation_id, if status == OPINION_ISSUED, moves to REINITIATION_REQUIRED and stamps reinitiation_triggered_at / reinitiation_count += 1"
      - "each such action's HabitatConservationPlan, if any, gets assurance_review_required = true"
      - "affected Proponent rows have open_reinitiation_count re-derived and compliance_standing_score re-derived on next read"

  - method: POST
    path: "/conservation-banks"
    description: "Establish a conservation bank that sells mitigation credits for one listed species inside a named service area."
    roles: [WildlifeAgency]
    code: 201
    input: [bank_name, covered_species_id, service_area_county_codes, credit_price_cents, credits_total_minted]
    output: ConservationBank
    side_effects:
      - "sets credits_available = credits_total_minted, credits_reserved = 0.00, credits_transferred = 0.00, establishing the invariant credits_available + credits_reserved + credits_transferred == credits_total_minted"

  - method: POST
    path: "/project-actions"
    description: "Register a proposed action that may affect listed species. Created in status SCREENING with effect_determination PENDING."
    roles: [Proponent]
    code: 201
    input: [proponent_id, action_name, action_type, footprint_acres, county_code, construction_start_date, construction_end_date]
    output: ProjectAction
    side_effects:
      - "sets status = SCREENING, effect_determination = PENDING, total_overlap_acres = 0.00, overlap_pct = 0.00, active_consultation_id = null, reinitiation_reason = NONE"

  - method: POST
    path: "/project-actions/{id}/presence-determinations"
    description: "Record a database query or field survey result for one species on this action. presence_status and survey_in_season are derived by calculations.presence_status_derivation and cannot be supplied."
    roles: [Proponent]
    code: 201
    input: [species_id, method, detection_result, habitat_overlap_acres, "critical_habitat_unit_id?", "survey_window_start?", "survey_window_end?"]
    output: PresenceDetermination
    side_effects:
      - "derives presence_status and survey_in_season per calculations.presence_status_derivation"
      - "sets requires_reevaluation = false"
      - "enforces the buffered FIELD_SURVEY window conflict check of calculations.interval_conflict_detection branch A"

  - method: POST
    path: "/project-actions/{id}/effect-determination"
    description: "Run the may-affect / adverse-effect analysis over the action's presence determinations and fork the action into one of three branches. Takes no body fields — every input is already persisted."
    roles: [Proponent]
    code: 200
    input: []
    output: ProjectAction
    side_effects:
      - "writes effect_determination, total_overlap_acres and overlap_pct per calculations.effect_determination_matrix"
      - "NO_EFFECT: status -> CLEARED_NO_EFFECT, no Consultation created, active_consultation_id stays null"
      - "NLAA: status -> INFORMAL_CONSULTATION and one Consultation is created (INFORMAL, DRAFT_BA, statutory_days 60) with active_consultation_id set to it"
      - "LAA: status -> FORMAL_CONSULTATION and one Consultation is created (FORMAL, DRAFT_BA, statutory_days 135) with active_consultation_id set to it"
      - "sets the new Consultation's clock_started_at and deadline_at per calculations.consultation_deadline"

  - method: POST
    path: "/consultations/{id}/biological-assessment"
    description: "Submit or resubmit the biological assessment, moving the consultation into agency review. Resubmission after an information request tolls the elapsed whole days; resubmission after a reinitiation restarts the statutory clock."
    roles: [Proponent]
    code: 200
    input: [ba_narrative, ba_effects_analysis_complete]
    output: Consultation
    side_effects:
      - "status -> UNDER_REVIEW; ba_revision_number += 1; ba_submitted_at = current logical clock"
      - "from INFO_REQUESTED: tolled_days += floor((now - info_requested_at)/86400), info_requested_at = null, deadline_at recomputed"
      - "from REINITIATION_REQUIRED: clock_started_at = now, tolled_days = 0, info_request_count = 0, deadline_at recomputed, and the ProjectAction leaves REINITIATION_PENDING for FORMAL_CONSULTATION with reinitiation_reason = NONE"

  - method: POST
    path: "/consultations/{id}/information-request"
    description: "Agency request for additional information, capped at MAX_INFO_REQUESTS per consultation and refused once the deadline has passed."
    roles: [WildlifeAgency]
    code: 200
    input: [request_note]
    output: Consultation
    side_effects:
      - "status -> INFO_REQUESTED; info_requested_at = current logical clock; info_request_count += 1"

  - method: POST
    path: "/consultations/{id}/concurrence"
    description: "Agency written concurrence concluding an INFORMAL consultation. Refused on a FORMAL consultation."
    roles: [WildlifeAgency]
    code: 200
    input: [concurrence_note]
    output: Consultation
    side_effects:
      - "status -> CONCLUDED_CONCURRENCE"
      - "the ProjectAction moves INFORMAL_CONSULTATION -> CONSULTATION_CONCLUDED"

  - method: POST
    path: "/consultations/{id}/biological-opinion"
    description: "Issue the agency biological opinion with its incidental take statement. Refused on an INFORMAL consultation. rpa_description converts a jeopardy conclusion into JEOPARDY_WITH_RPA."
    roles: [WildlifeAgency]
    code: 201
    input: ["rpa_description?"]
    output: BiologicalOpinion
    side_effects:
      - "creates an immutable BiologicalOpinion (no version, no updated_at) from calculations.incidental_take_authorization"
      - "stamps issued_by_user_id = X-User-ID, issued_at = current logical clock, issued_late = (issued_at > consultation.deadline_at)"
      - "Consultation.status -> OPINION_ISSUED and the ProjectAction moves FORMAL_CONSULTATION -> CONSULTATION_CONCLUDED"

  - method: POST
    path: "/project-actions/{id}/habitat-conservation-plans"
    description: "Open a habitat conservation plan for a non-federal action whose consultation has concluded. Creates the plan in plan_status DRAFT and funding_status UNFUNDED with its PRELIMINARY mitigation estimate."
    roles: [Proponent]
    code: 201
    input: [plan_name, covered_acres, permit_term_years]
    output: HabitatConservationPlan
    side_effects:
      - "sets preliminary_mitigation_units per the PRELIMINARY variant of calculations.required_mitigation_units"
      - "sets final_mitigation_units = 0.00, mitigation_delta_units = 0.00, secured_mitigation_units = 0.00"
      - "sets endowment_base_cents, changed_circumstance_reserve_cents, endowment_required_cents, endowment_secured_cents, reserve_drawn_cents and reserve_remaining_cents to 0, funded_ratio to 0.0000"
      - "ProjectAction.status -> HCP_DEVELOPMENT"

  - method: POST
    path: "/habitat-conservation-plans/{id}/mitigation-commitments"
    description: "Add a mitigation commitment to a DRAFT plan via conservation banking, in-lieu fee, or permittee-responsible mitigation. Carries the OCC guard expected_hcp_version."
    roles: [Proponent]
    code: 201
    input: [mechanism, units, expected_hcp_version, "conservation_bank_id?"]
    output: MitigationCommitment
    side_effects:
      - "creates the commitment in status RESERVED with costs from calculations.mitigation_commitment_cost"
      - "for mechanism == CONSERVATION_BANK_CREDIT: ConservationBank.credits_available -= units and credits_reserved += units"
      - "recomputes the plan's endowment_base_cents, changed_circumstance_reserve_cents, endowment_required_cents, reserve_remaining_cents and secured_mitigation_units per calculations.endowment_requirement"
      - "re-derives the plan's funded_ratio and funding_status per calculations.funding_assurance_status — this can REGRESS funding_status"
      - "increments HabitatConservationPlan.version by 1"

  - method: POST
    path: "/habitat-conservation-plans/{id}/funding-assurances"
    description: "Record a funding assurance instrument contribution toward the plan's endowment requirement. instrument_type is an enum constrained to IRREVOCABLE_LETTER_OF_CREDIT | ESCROW_ACCOUNT | ENDOWMENT_TRANSFER | PERFORMANCE_BOND (validated at priority 7); it identifies the instrument for the record but no calculation reads it, so no plan field stores it."
    roles: [Proponent]
    code: 200
    input: [contribution_cents, instrument_type]
    output: HabitatConservationPlan
    side_effects:
      - "endowment_secured_cents += contribution_cents"
      - "re-derives funded_ratio and funding_status per calculations.funding_assurance_status"

  - method: POST
    path: "/habitat-conservation-plans/{id}/submit"
    description: "Submit the plan for agency decision. Locks in the FINAL mitigation requirement and the reconciliation delta against the PRELIMINARY estimate."
    roles: [Proponent]
    code: 200
    input: []
    output: HabitatConservationPlan
    side_effects:
      - "plan_status -> SUBMITTED"
      - "writes final_mitigation_units and mitigation_delta_units per the FINAL variant of calculations.required_mitigation_units"
      - "recomputes secured_mitigation_units as the sum of units over RESERVED and SECURED commitments"

  - method: POST
    path: "/habitat-conservation-plans/{id}/decision"
    description: "Agency decision on a submitted plan: APPROVE secures every reserved commitment, RETURN_FOR_REVISION releases them and restores the bank ledger."
    roles: [WildlifeAgency]
    code: 200
    input: [decision, "decision_note?"]
    output: HabitatConservationPlan
    side_effects:
      - "APPROVE: plan_status -> APPROVED, approved_by_user_id = X-User-ID, every RESERVED commitment -> SECURED (created_at ASC) with bank credits_reserved -> credits_transferred"
      - "RETURN_FOR_REVISION: plan_status -> DRAFT, every RESERVED commitment -> RELEASED (created_at ASC) with bank credits_reserved -> credits_available, endowment aggregates recomputed to 0, funded_ratio -> 0.0000, funding_status -> UNFUNDED"

  - method: POST
    path: "/habitat-conservation-plans/{id}/incidental-take-permits"
    description: "Issue the incidental take permit and its implementing agreement for an approved plan. The issuing official must differ from the approving official."
    roles: [WildlifeAgency]
    code: 201
    input: [term_start, implementing_agreement_reference]
    output: IncidentalTakePermit
    side_effects:
      - "creates the permit in status ACTIVE with permit_number, term_end and the take ledger from calculations.permit_issuance_derivation"
      - "stamps issued_by_user_id = X-User-ID"
      - "plan_status -> IMPLEMENTING and ProjectAction.status -> PERMITTED"

  - method: POST
    path: "/incidental-take-permits/{id}/monitoring-reports"
    description: "Submit a periodic monitoring and take report against an ACTIVE permit. Applies the reported take to the permit ledger immediately and may trip the reinitiation threshold. Carries the OCC guard expected_permit_version."
    roles: [Proponent]
    code: 201
    input: [period_start, period_end, take_units_reported, mitigation_units_verified, expected_permit_version]
    output: MonitoringReport
    side_effects:
      - "creates the report in status SUBMITTED with submitted_at, due_at and is_late per calculations.monitoring_report_lateness_and_take_ledger"
      - "permit.take_consumed_units += take_units_reported and permit.take_remaining_units decreases by the same amount"
      - "increments IncidentalTakePermit.version by 1"
      - "when take_consumed_units >= reinitiation_trigger_units the take-exceedance cascade runs: permit -> SUSPENDED (suspension_count += 1), plan -> SUSPENDED_IMPLEMENTATION (assurance_review_required = true), action -> REINITIATION_PENDING (reinitiation_reason = TAKE_EXCEEDANCE), consultation -> REINITIATION_REQUIRED, proponent open_reinitiation_count += 1"

  - method: POST
    path: "/monitoring-reports/{id}/adjudication"
    description: "Agency adjudication of a submitted monitoring report. REJECT reverses the reported take and frees the reporting period; the adjudicator may not be the official who issued the permit."
    roles: [WildlifeAgency]
    code: 200
    input: [decision, "adjudication_note?"]
    output: MonitoringReport
    side_effects:
      - "ACCEPT: status -> ACCEPTED, adjudicated_at = current logical clock, adjudicated_by_user_id = X-User-ID, take stays applied"
      - "REJECT: status -> REJECTED, permit.take_consumed_units -= take_units_reported, permit.take_remaining_units restored, the report's period stops blocking new reports, and when consumed falls below reinitiation_trigger_units the permit returns to ACTIVE, the plan returns to IMPLEMENTING with assurance_review_required = false"

  - method: POST
    path: "/habitat-conservation-plans/{id}/changed-circumstance-events"
    description: "Report a changed or unforeseen circumstance during plan implementation. The allocation between reserve, permittee and agency is computed by calculations.changed_circumstance_cost_allocation."
    roles: [Proponent]
    code: 201
    input: [circumstance_type, description, response_cost_cents]
    output: ChangedCircumstanceEvent
    side_effects:
      - "sets reported_at = current logical clock and the full cost allocation (reserve_draw_cents, required_additional_cents, permittee_borne_cents, agency_borne_cents, assurances_invoked)"
      - "CHANGED: draws on the plan's reserve — hcp.reserve_drawn_cents += reserve_draw_cents and hcp.reserve_remaining_cents decreases; status becomes RESPONSE_REQUIRED when a shortfall remains, otherwise RESPONDED"
      - "UNFORESEEN: leaves the reserve untouched, caps the permittee at UNFORESEEN_PERMITTEE_SHARE_PCT of endowment_secured_cents, and lands in ASSURANCES_INVOKED"

  - method: POST
    path: "/changed-circumstance-events/{id}/response"
    description: "Fund the shortfall left by a changed circumstance, closing the event and restoring the proponent's compliance standing."
    roles: [Proponent]
    code: 200
    input: [contributed_cents, "response_note?"]
    output: ChangedCircumstanceEvent
    side_effects:
      - "status -> RESPONDED; contributed_cents and response_note recorded"
      - "hcp.endowment_secured_cents += contributed_cents and the plan's funded_ratio / funding_status are re-derived"
      - "the UNRESPONDED_CIRCUMSTANCE penalty leaves the proponent's next compliance_standing_score read"

  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint: set the server's logical UTC clock, which every deadline, due date, decay window and expiry rule reads. Before any call the logical clock reads exactly 2026-08-01T00:00:00Z and NEVER falls back to real wall-clock time. Advancing the clock past a permit's term_end expires it and cascades: permit -> EXPIRED, plan -> CLOSED, SECURED commitments -> RELEASED (created_at ASC), with no conservation-bank ledger change."
    roles: [Proponent, WildlifeAgency, Auditor]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects:
      - "sets the logical clock to to_iso8601"
      - "expires every IncidentalTakePermit with status IN {ACTIVE, SUSPENDED} whose term_end < the new clock value, in created_at ASC order, running the expiry cascade for each"

# ============================================================================
# §1.6 Error Code Catalog — every entry is triggerable by at least one
# endpoint declared in §1.5.
# ============================================================================
errors:

  # ---- authentication / authorization -------------------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-Role missing, empty, whitespace-only, or naming a role outside {Proponent, WildlifeAgency, Auditor, Anonymous}; or X-User-ID missing/empty while X-Role is Proponent or WildlifeAgency"
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "the authenticated role is not listed in the target endpoint's §1.5 roles — e.g. Auditor attempting any POST, or Proponent attempting POST /consultations/{id}/biological-opinion"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "a Proponent acts on a ProjectAction, Consultation, HabitatConservationPlan, IncidentalTakePermit, MonitoringReport or ChangedCircumstanceEvent that resolves to a different Proponent than the one named by X-User-ID"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "X-User-ID on POST /habitat-conservation-plans/{id}/incidental-take-permits equals HabitatConservationPlan.approved_by_user_id"
  - id: ERR_ADJUDICATOR_CONFLICT
    http: 403
    condition: "X-User-ID on POST /monitoring-reports/{id}/adjudication equals IncidentalTakePermit.issued_by_user_id of the report's permit"

  # ---- existence -----------------------------------------------------------
  - id: ERR_SPECIES_NOT_FOUND
    http: 404
    condition: "no Species row for the id in the path or in species_id / covered_species_id in the body"
  - id: ERR_PROPONENT_NOT_FOUND
    http: 404
    condition: "no Proponent row for the id in the path or in proponent_id in the body"
  - id: ERR_PROJECT_ACTION_NOT_FOUND
    http: 404
    condition: "no ProjectAction row for the id in the path"
  - id: ERR_CRITICAL_HABITAT_UNIT_NOT_FOUND
    http: 404
    condition: "no CriticalHabitatUnit row for critical_habitat_unit_id supplied on POST /project-actions/{id}/presence-determinations"
  - id: ERR_PRESENCE_DETERMINATION_NOT_FOUND
    http: 404
    condition: "no PresenceDetermination row for the id on GET /presence-determinations/{id}"
  - id: ERR_CONSULTATION_NOT_FOUND
    http: 404
    condition: "no Consultation row for the id in the path"
  - id: ERR_HCP_NOT_FOUND
    http: 404
    condition: "no HabitatConservationPlan row for the id in the path"
  - id: ERR_CONSERVATION_BANK_NOT_FOUND
    http: 404
    condition: "no ConservationBank row for the id in the path or for conservation_bank_id in the body"
  - id: ERR_PERMIT_NOT_FOUND
    http: 404
    condition: "no IncidentalTakePermit row for the id in the path"
  - id: ERR_MONITORING_REPORT_NOT_FOUND
    http: 404
    condition: "no MonitoringReport row for the id on POST /monitoring-reports/{id}/adjudication"
  - id: ERR_CIRCUMSTANCE_EVENT_NOT_FOUND
    http: 404
    condition: "no ChangedCircumstanceEvent row for the id on POST /changed-circumstance-events/{id}/response"

  # ---- request shape -------------------------------------------------------
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "missing required field, unknown field, wrong JSON type, enum value outside the declared set, negative money or quantity, month outside 1..12, permit_term_years outside 1..50, malformed ISO-8601 value, construction_start_date > construction_end_date, or ba_effects_analysis_complete supplied as false"

  # ---- state / concurrency -------------------------------------------------
  - id: ERR_INVALID_STATE_TRANSITION
    http: 409
    condition: "the target row's current state is not a declared `from:` state for the requested trigger in §1.2 — including a second effect determination on the same action, a concurrence on an already-concluded consultation, a third information request past MAX_INFO_REQUESTS, a decision on a plan that is not SUBMITTED, a second permit for the same plan, an adjudication of an already-adjudicated report, a response to an event that is not RESPONSE_REQUIRED, a commitment added to a plan that is not DRAFT, or a changed-circumstance event on a plan that is not IMPLEMENTING or SUSPENDED_IMPLEMENTATION"
  - id: ERR_STALE_HCP_VERSION
    http: 412
    condition: "expected_hcp_version on POST /habitat-conservation-plans/{id}/mitigation-commitments does not equal the plan's current version"
  - id: ERR_STALE_PERMIT_VERSION
    http: 412
    condition: "expected_permit_version on POST /incidental-take-permits/{id}/monitoring-reports does not equal the permit's current version"
  - id: ERR_PERMIT_NOT_ACTIVE
    http: 409
    condition: "a monitoring report is submitted against a permit whose status is SUSPENDED or EXPIRED"

  # ---- business: safety and regulatory ------------------------------------
  - id: ERR_SPECIES_NOT_LISTED
    http: 422
    condition: "POST /conservation-banks names a covered_species_id whose listing_status is PROPOSED or CANDIDATE"
  - id: ERR_CONSULTATION_TYPE_MISMATCH
    http: 422
    condition: "concurrence attempted on a FORMAL consultation, or a biological opinion attempted on an INFORMAL consultation"
  - id: ERR_HCP_NOT_ALLOWED_FOR_FEDERAL_ACTION
    http: 422
    condition: "POST /project-actions/{id}/habitat-conservation-plans on an action whose action_type is FEDERAL_FUNDED or FEDERAL_PERMITTED"
  - id: ERR_JEOPARDY_UNRESOLVED
    http: 422
    condition: "APPROVE decision on a plan whose action's active Consultation carries a BiologicalOpinion with conclusion == JEOPARDY"

  # ---- business: temporal --------------------------------------------------
  - id: ERR_SURVEY_WINDOW_INVALID
    http: 422
    condition: "method == FIELD_SURVEY with a missing survey_window_start or survey_window_end or with start > end; or method == DATABASE_QUERY with either window field supplied non-null"
  - id: ERR_CONSULTATION_DEADLINE_PASSED
    http: 422
    condition: "POST /consultations/{id}/information-request when the current logical clock is later than Consultation.deadline_at"
  - id: ERR_PERIOD_OUTSIDE_PERMIT_TERM
    http: 422
    condition: "period_start >= period_end, or period_start < permit.term_start, or period_end > permit.term_end, or period_end later than the current logical clock"

  # ---- business: constraint ------------------------------------------------
  - id: ERR_SURVEY_WINDOW_CONFLICT
    http: 409
    condition: "a new FIELD_SURVEY window falls within SURVEY_DISTURBANCE_BUFFER_DAYS of an existing FIELD_SURVEY window on the same CriticalHabitatUnit, in any project action"
  - id: ERR_REPORTING_PERIOD_OVERLAP
    http: 409
    condition: "the new half-open [period_start, period_end) overlaps a MonitoringReport of the same permit with status IN {SUBMITTED, ACCEPTED}"
  - id: ERR_NO_PRESENCE_DETERMINATIONS
    http: 422
    condition: "an effect determination is requested for an action with zero PresenceDetermination rows, or a biological opinion / mitigation requirement is computed for an action with zero candidate rows (presence_status IN {PRESENT, PRESUMED_PRESENT})"
  - id: ERR_NO_MITIGATION_COMMITMENTS
    http: 422
    condition: "POST /habitat-conservation-plans/{id}/submit on a plan with no MitigationCommitment in status RESERVED"

  # ---- business: referential and fiscal -----------------------------------
  - id: ERR_BANK_NOT_ELIGIBLE
    http: 422
    condition: "mechanism == CONSERVATION_BANK_CREDIT with conservation_bank_id omitted, or with a bank whose covered_species_id is not the action's primary species, or with a bank whose service_area_county_codes excludes the action's county_code; or mechanism != CONSERVATION_BANK_CREDIT with conservation_bank_id supplied non-null"
  - id: ERR_INSUFFICIENT_BANK_CREDITS
    http: 409
    condition: "the requested units exceed ConservationBank.credits_available"
  - id: ERR_FUNDING_NOT_ASSURED
    http: 422
    condition: "APPROVE decision while HabitatConservationPlan.funding_status is UNFUNDED or PARTIALLY_ASSURED"
  - id: ERR_MITIGATION_SHORTFALL
    http: 422
    condition: "APPROVE decision while HabitatConservationPlan.secured_mitigation_units < HabitatConservationPlan.final_mitigation_units"
  - id: ERR_TAKE_LIMIT_EXCEEDED
    http: 422
    condition: "take_units_reported exceeds IncidentalTakePermit.take_remaining_units as it stands before the report is applied"
  - id: ERR_RESERVE_CONTRIBUTION_INSUFFICIENT
    http: 422
    condition: "contributed_cents on POST /changed-circumstance-events/{id}/response is less than ChangedCircumstanceEvent.required_additional_cents"

# ============================================================================
# §1.7 RBAC Matrix — role_model: segregation_of_duties
# ============================================================================
roles:
  - name: Proponent
    description: >-
      The project proponent (or its consultant) that proposes an action,
      surveys for listed species, prepares the biological assessment, develops
      the habitat conservation plan, funds it, and reports take under the
      permit. Owns everything reachable from its own Proponent row and may
      never read or write another proponent's action tree.
    identity: "entity_backed:Proponent"
    exclusive_operations:
      - "POST /project-actions"
      - "POST /project-actions/{id}/presence-determinations"
      - "POST /project-actions/{id}/effect-determination"
      - "POST /consultations/{id}/biological-assessment"
      - "POST /project-actions/{id}/habitat-conservation-plans"
      - "POST /habitat-conservation-plans/{id}/mitigation-commitments"
      - "POST /habitat-conservation-plans/{id}/funding-assurances"
      - "POST /habitat-conservation-plans/{id}/submit"
      - "POST /incidental-take-permits/{id}/monitoring-reports"
      - "POST /habitat-conservation-plans/{id}/changed-circumstance-events"
      - "POST /changed-circumstance-events/{id}/response"
    shared_operations:
      - "every GET except GET /conservation-banks/{id}/mitigation-commitments, scoped to its own resources"
      - "POST /_clock/set_current_utc"

  - name: WildlifeAgency
    description: >-
      The wildlife agency. Maintains the species and critical-habitat
      registries and the conservation-bank registry, runs consultation review,
      issues biological opinions, decides habitat conservation plans, issues
      incidental take permits, and adjudicates monitoring reports. X-User-ID
      identifies the individual official, and two segregation-of-duties rules
      compare it across steps: the plan approver may not issue the permit, and
      the permit issuer may not adjudicate reports against that permit.
    identity: opaque
    exclusive_operations:
      - "POST /species"
      - "POST /species/{id}/critical-habitat-units"
      - "POST /species/{id}/listing-change"
      - "POST /conservation-banks"
      - "POST /consultations/{id}/information-request"
      - "POST /consultations/{id}/concurrence"
      - "POST /consultations/{id}/biological-opinion"
      - "POST /habitat-conservation-plans/{id}/decision"
      - "POST /habitat-conservation-plans/{id}/incidental-take-permits"
      - "POST /monitoring-reports/{id}/adjudication"
    shared_operations:
      - "every GET, across all proponents"
      - "POST /_clock/set_current_utc"

  - name: Auditor
    description: >-
      Read-only oversight. Sees every proponent's action tree and every bank's
      commitment ledger but can perform no write of any kind; every POST
      returns ERR_ROLE_NOT_PERMITTED.
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "every GET, across all proponents"
      - "POST /_clock/set_current_utc"

  - name: Anonymous
    description: >-
      Unregistered caller. Permitted exactly one operation — proponent
      self-registration, which mints the identity used by the Proponent role.
      Every other endpoint returns ERR_ROLE_NOT_PERMITTED.
    identity: opaque
    exclusive_operations:
      - "POST /proponents"
    shared_operations: []
