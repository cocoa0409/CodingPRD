            - { call: "POST /curb/permits", payload: { permittee_id: "${pm_id}", requested_designation: "LOADING", purpose: "deliveries", zone_ids: ["${z1}"] }, as: Permittee, as_user_id: "${pm_id}", captures: { permit_id: $.data.id } }
            - { call: "POST /curb/permits/${permit_id}/submit", payload: {}, as: Permittee, as_user_id: "${pm_id}" }
            - { call: "POST /curb/reservations", payload: { permit_id: "${permit_id}", zone_id: "${z1}", start_utc: "2026-06-01T08:00:00Z", end_utc: "2026-06-01T08:45:00Z" }, as: Permittee, as_user_id: "${pm_id}", captures: { res_id: $.data.id } }
          trigger:
            - { call: "POST /curb/reservations/${res_id}/confirm", payload: {}, as: Permittee, as_user_id: "${pm_id}", captures: { err: $.data.error_id } }
          assert:
            - "confirm returns HTTP 409 ERR_PERMIT_NOT_ACTIVE"
            - "Reservation.${res_id}.booking_status == PENDING (unchanged)"

      - name: approve_requires_zones_active
        grounds:
          - state_machines.CurbPermit.UNDER_REVIEW_to_ACTIVE
          - state_machines.CurbZone.ACTIVE_to_SUSPENDED
          - errors[ERR_ZONE_NOT_ACTIVE]
        distinguishing_aspect: "CurbPermit.UNDER_REVIEW->ACTIVE depends on CurbZone state (pair CurbPermit->CurbZone): a SUSPENDED zone in permit.zone_ids blocks approval with ERR_ZONE_NOT_ACTIVE even when SoD passes."
        test_recipe:
          setup:
            - "Permit UNDER_REVIEW (reviewer 'planner1'); its zone Z1 SUSPENDED; approve by PermitApprover 'approver1' (distinct user, SoD ok)"
