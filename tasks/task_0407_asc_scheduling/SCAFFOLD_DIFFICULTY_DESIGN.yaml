  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: referential_beats_fiscal_on_booking_excluded_over_capacity
        grounds:
          - validations[priority=9]
          - validations[priority=18]
          - errors[ERR_PROCEDURE_EXCLUDED]
          - errors[ERR_BLOCK_CAPACITY_EXCEEDED]
        distinguishing_aspect: |
          Error-category pair (business_referential vs business_fiscal): booking an EXCLUDED 60-min
          procedure into an empty block whose allocated pool is only 30 minutes violates BOTH
          priority-9 (referential: procedure EXCLUDED) and priority-18 (fiscal: 0+60 > 30 capacity).
          Priority 9 wins -> ERR_PROCEDURE_EXCLUDED, not ERR_BLOCK_CAPACITY_EXCEEDED.
        test_recipe:
          setup:
            - "Facility(turnover 0)/OR/surgeon/EXCLUDED-proc(60)/patient/day; HELD block [480,510) alloc 30 (empty)."
          setup_api_calls:
            - call: "POST /asc/facilities"
              payload: { name: "ASC I", turnover_minutes: 0, hp_validity_days: 30 }
              as: Scheduler
              captures: { fac_id: $.data.id }
            - call: "POST /asc/operating-rooms"
              payload: { facility_id: "${fac_id}", room_label: "OR-1" }
              as: ORManager
              captures: { or_id: $.data.id }
            - call: "POST /asc/surgeons"
              payload: { facility_id: "${fac_id}", full_name: "Dr Cut", npi: "1234567890" }
              as: Scheduler
              captures: { surg_id: $.data.id }
            - call: "POST /asc/procedures"
              payload: { facility_id: "${fac_id}", cpt_code: "99999", description: "Excluded", scheduled_minutes: 60, cms_payment_indicator: "EXCLUDED", cms_base_rate_cents: 0, anesthesia_class: "MAC" }
              as: BillingAnalyst
              captures: { proc_id: $.data.id }
            - call: "POST /asc/patients"
              payload: { facility_id: "${fac_id}", mrn: "MRN1", full_name: "Pat One", date_of_birth: "1980-01-01" }
              as: Scheduler
              captures: { pat_id: $.data.id }
            - call: "POST /asc/surgical-days"
              payload: { facility_id: "${fac_id}", service_date: "2026-07-15" }
              as: Scheduler
              captures: { day_id: $.data.id }
            - call: "POST /asc/surgeon-blocks"
              payload: { surgical_day_id: "${day_id}", surgeon_id: "${surg_id}", operating_room_id: "${or_id}", start_min: 480, end_min: 510 }
              as: Scheduler
              captures: { blk_id: $.data.id, blk_v: $.data.version }
          trigger:
            - call: "POST /asc/surgeon-blocks/${blk_id}/cases"
              payload: { expected_block_version: "${blk_v}", patient_id: "${pat_id}", procedure_id: "${proc_id}", start_min: 480 }
              as: Scheduler
              captures: { err: $.data.error_id }
          assert:
            - "trigger response error_id == ERR_PROCEDURE_EXCLUDED"
            - "trigger response error_id != ERR_BLOCK_CAPACITY_EXCEEDED"

      - name: temporal_beats_safety_on_booking_or_conflict_and_phase2
        grounds:
          - validations[priority=12]
          - validations[priority=15]
          - errors[ERR_OR_TIME_CONFLICT]
          - errors[ERR_RECOVERY_PHASE2_REQUIRED]
        distinguishing_aspect: |
          Error-category pair (business_temporal vs business_safety): a second case in the SAME OR that
          overlaps an existing case (after turnover) AND requests a non-phase2 bay for a requires_phase2
          procedure violates priority-12 (temporal OR conflict) and priority-15 (safety phase2). Priority
          12 wins -> ERR_OR_TIME_CONFLICT.
        test_recipe:
          setup:
            - "Facility(turnover 25)/OR/surgeon/2 patients; phase2-requiring proc(60); non-phase2 bay; day; block [480,720); first case booked 480 (occupies [480,540)+25 turnover); second booking at 500 collides AND requests non-phase2 bay."
