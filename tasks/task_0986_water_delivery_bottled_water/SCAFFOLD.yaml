scenario: "986. Water-Delivery & Bottled-Water Service: cooler rental & bottle exchange, route & 5-gal par delivery, will-call vs auto, coffee/filtration add-on, office/home account, deposit & shortage, billing, skip"
domain_name: "water-delivery-bottled-water"
api_prefix: "/api/v1"

complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - scheduled_actions
    - derived_field_reconciliation
  entity_topology: hybrid
  state_machine_shape: compound
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
  role_model: peer_roles
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: Customer
    parent: null
    common_fields: true
    fields:
      - name: account_type
        type: enum
        source: input
        description: "OFFICE or HOME account classification"
        constraints: "one of {OFFICE, HOME}"
      - name: business_name
        type: string
        source: input
        description: "Display name (company name for OFFICE, household name for HOME)"
      - name: billing_email
        type: string
        source: input
        description: "Invoice recipient"
      - name: service_address
        type: string
        source: input
        description: "Primary delivery address"
      - name: delivery_zone_id
        type: string
        source: input
        description: "FK -> DeliveryZone.id; customer belongs to exactly one zone"
      - name: service_mode
        type: enum
        source: input
        description: "AUTO (recurring scheduled) vs WILL_CALL (on-demand)"
        constraints: "one of {AUTO, WILL_CALL}"
        default: "AUTO"
      - name: par_level_bottles
        type: integer
        source: input
        description: "Target 5-gal bottle inventory kept on site for AUTO customers"
        default: 2
        constraints: ">= 0"
      - name: pricing_tier
        type: enum
        source: input
        description: "Volume pricing band"
        constraints: "one of {STANDARD, SILVER, GOLD}"
        default: "STANDARD"
      - name: account_status
        type: enum
        source: system
        description: "Lifecycle: ACTIVE / SUSPENDED / CLOSED"
        constraints: "one of {ACTIVE, SUSPENDED, CLOSED}"
        default: "ACTIVE"
      - name: outstanding_balance_cents
        type: integer
        source: computed
        description: "Sum of Invoice.balance_due_cents for Invoices with status IN {OPEN, OVERDUE, DISPUTED} for this customer; recomputed on every invoice state change and payment post"
        default: 0
      - name: bottles_on_site
        type: integer
        source: computed
        description: "Count of BottleCustodyLedger entries for this customer with custody_state == AT_CUSTOMER; updated on every delivery, exchange pickup, or shortage marking"
        default: 0
      - name: deposit_liability_cents
        type: integer
        source: computed
        description: "bottles_on_site * bottle_deposit_cents (from PricingConfig); derived, not stored-persistent"
        default: 0
      - name: overdue_since
        type: datetime
        source: system
        description: "Timestamp when customer first entered OVERDUE posture; null when no overdue invoices"
        default: null

  - name: DeliveryZone
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        description: "Short zone code, e.g. 'NW-1'"
        constraints: "unique"
      - name: name
        type: string
        source: input
        description: "Display name"
      - name: active
        type: boolean
        source: input
        description: "Inactive zones reject new route assignment"
        default: true

  - name: Route
    parent: null
    common_fields: true
    fields:
      - name: zone_id
        type: string
        source: input
        description: "FK -> DeliveryZone.id"
      - name: service_date
        type: string
        source: input
        description: "ISO8601 date (YYYY-MM-DD) the route runs"
      - name: driver_name
        type: string
        source: input
        description: "Driver display name"
      - name: truck_capacity_bottles
        type: integer
        source: input
        description: "Maximum full 5-gal bottles the truck can carry on this route"
        constraints: "> 0"
      - name: committed_bottles
        type: integer
        source: computed
        description: "Sum of planned_bottles across Stops on this route whose status IN {PLANNED, EN_ROUTE, ARRIVED}; decremented on skip/cancel; incremented on stop creation"
        default: 0
      - name: route_status
        type: enum
        source: system
        description: "Route lifecycle"
        constraints: "one of {DRAFT, PUBLISHED, IN_PROGRESS, COMPLETED, CANCELLED}"
        default: "DRAFT"

  - name: Stop
    parent: Route
    common_fields: true
    fields:
      - name: route_id
        type: string
        source: input
        description: "FK -> Route.id"
      - name: customer_id
        type: string
        source: input
        description: "FK -> Customer.id"
      - name: sequence_index
        type: integer
        source: input
        description: "Order in route; must be unique per route"
        constraints: ">= 1"
      - name: planned_bottles
        type: integer
        source: computed
        description: "For AUTO customers: max(0, par_level_bottles - current bottles_on_site) at plan time. For WILL_CALL: quantity from the WorkOrder that generated this stop."
      - name: planned_empties_pickup
        type: integer
        source: computed
        description: "Number of empty 5-gal bottles to collect; defaults to planned_bottles for exchange-parity"
      - name: stop_status
        type: enum
        source: system
        description: "Stop lifecycle"
        constraints: "one of {PLANNED, EN_ROUTE, ARRIVED, DELIVERED, SKIPPED, PARTIAL, FAILED, CANCELLED}"
        default: "PLANNED"
      - name: actual_bottles_delivered
        type: integer
        source: system
        description: "Bottles actually dropped at DELIVERED/PARTIAL; 0 otherwise"
        default: 0
      - name: actual_empties_collected
        type: integer
        source: system
        description: "Empties actually picked up at DELIVERED/PARTIAL; 0 otherwise"
        default: 0
      - name: shortage_count
        type: integer
        source: system
        description: "empties owed but not returned = planned_empties_pickup - actual_empties_collected, when positive; triggers shortage charge"
        default: 0
      - name: skip_reason
        type: string
        source: input
        description: "Required when transitioning to SKIPPED"
        default: null

  - name: BottleCustodyLedger
    parent: null
    common_fields: false
    fields:
      - name: customer_ref
        type: string
        source: input
        description: "FK -> Customer.id"
      - name: stop_id
        type: string
        source: input
        description: "FK -> Stop.id; nullable for adjustments that do not correspond to a stop"
        default: null
      - name: entry_kind
        type: enum
        source: input
        description: "Type of custody movement"
        constraints: "one of {DELIVER_FULL, PICKUP_EMPTY, MARK_SHORTAGE, ADJUSTMENT, RETURN_FULL, EXCHANGE}"
      - name: quantity
        type: integer
        source: input
        description: "Signed count of bottles; positive adds custody to customer, negative removes"
      - name: occurred_at
        type: datetime
        source: system
        description: "Timestamp recorded by server at entry creation; used as chronological tie-break"

  - name: CoolerRental
    parent: Customer
    common_fields: true
    fields:
      - name: customer_id
        type: string
        source: input
        description: "FK -> Customer.id"
      - name: cooler_model
        type: enum
        source: input
        description: "Equipment model class"
        constraints: "one of {COUNTERTOP, FREESTANDING, BOTTOM_LOAD, FILTRATION_POE}"
      - name: monthly_rent_cents
        type: integer
        source: input
        description: "Contract monthly rent in cents"
        constraints: ">= 0"
      - name: deposit_cents
        type: integer
        source: input
        description: "One-time equipment deposit in cents; held as liability"
        constraints: ">= 0"
      - name: rental_status
        type: enum
        source: system
        description: "CoolerRental lifecycle"
        constraints: "one of {PENDING_INSTALL, INSTALLED, SUSPENDED, RETURN_REQUESTED, RETURNED, CLOSED}"
        default: "PENDING_INSTALL"
      - name: installed_at
        type: datetime
        source: system
        description: "Timestamp when transition to INSTALLED fired; null until then"
        default: null
      - name: returned_at
        type: datetime
        source: system
        description: "Timestamp when transition to RETURNED fired; null until then"
        default: null
      - name: accrued_rent_cents
        type: integer
        source: computed
        description: "Prorated rent accrual between installed_at and current clock; computed by calc_prorated_rent; cached on each billing run"
        default: 0

  - name: AddOn
    parent: Customer
    common_fields: true
    fields:
      - name: customer_id
        type: string
        source: input
        description: "FK -> Customer.id"
      - name: addon_kind
        type: enum
        source: input
        description: "Type of add-on service"
        constraints: "one of {COFFEE, FILTRATION, CUPS, SANITIZATION}"
      - name: quantity
        type: integer
        source: input
        description: "Units purchased (bags of coffee, filter kits, etc.)"
        constraints: ">= 1"
      - name: unit_price_cents
        type: integer
        source: input
        description: "Price per unit in cents"
        constraints: ">= 0"
      - name: cadence
        type: enum
        source: input
        description: "Whether the addon ships on every scheduled delivery or one-time"
        constraints: "one of {RECURRING, ONE_TIME}"
        default: "RECURRING"
      - name: addon_status
        type: enum
        source: system
        description: "AddOn lifecycle"
        constraints: "one of {ACTIVE, PAUSED, CANCELLED}"
        default: "ACTIVE"

  - name: Invoice
    parent: Customer
    common_fields: true
    fields:
      - name: customer_id
        type: string
        source: input
        description: "FK -> Customer.id"
      - name: billing_period_start
        type: string
        source: input
        description: "ISO8601 date inclusive"
      - name: billing_period_end
        type: string
        source: input
        description: "ISO8601 date exclusive (half-open interval)"
      - name: subtotal_water_cents
        type: integer
        source: computed
        description: "Sum of per-stop water charges for stops in [period_start, period_end) with status IN {DELIVERED, PARTIAL}"
      - name: subtotal_addon_cents
        type: integer
        source: computed
        description: "Sum of addon line charges; recurring addons charged once per period; one-time charged in period of purchase"
      - name: subtotal_rent_cents
        type: integer
        source: computed
        description: "Prorated cooler rent over the billing period using calc_prorated_rent"
      - name: shortage_charge_cents
        type: integer
        source: computed
        description: "Sum over shortage events in period of shortage_count * bottle_shortage_fee_cents; computed by calc_shortage_charge"
      - name: deposit_credit_cents
        type: integer
        source: computed
        description: "Bottle deposit refund for net returned bottles in period; 0 or positive; computed by calc_deposit_refund"
      - name: total_due_cents
        type: integer
        source: computed
        description: "subtotal_water + subtotal_addon + subtotal_rent + shortage_charge - deposit_credit; rounded via round_half_up to whole cent"
      - name: balance_due_cents
        type: integer
        source: computed
        description: "total_due - sum of Payments with status APPLIED against this invoice"
      - name: invoice_status
        type: enum
        source: system
        description: "Invoice lifecycle"
        constraints: "one of {DRAFT, OPEN, PARTIALLY_PAID, PAID, OVERDUE, DISPUTED, VOID}"
        default: "DRAFT"
      - name: due_date
        type: string
        source: input
        description: "ISO8601 date by which payment must arrive to avoid OVERDUE"
      - name: issued_at
        type: datetime
        source: system
        description: "Server timestamp of DRAFT->OPEN transition"
        default: null

  - name: Payment
    parent: Invoice
    common_fields: true
    fields:
      - name: invoice_id
        type: string
        source: input
        description: "FK -> Invoice.id"
      - name: amount_cents
        type: integer
        source: input
        description: "Payment amount in cents"
        constraints: "> 0"
      - name: method
        type: enum
        source: input
        description: "Payment method"
        constraints: "one of {CARD, ACH, CHECK, CREDIT_MEMO}"
      - name: payment_status
        type: enum
        source: system
        description: "Payment lifecycle"
        constraints: "one of {PENDING, APPLIED, FAILED, REFUNDED}"
        default: "PENDING"
      - name: applied_at
        type: datetime
        source: system
        description: "Timestamp of PENDING->APPLIED transition"
        default: null

  - name: WorkOrder
    parent: Customer
    common_fields: true
    fields:
      - name: customer_id
        type: string
        source: input
        description: "FK -> Customer.id"
      - name: order_kind
        type: enum
        source: input
        description: "Nature of the work order"
        constraints: "one of {DELIVERY, COOLER_INSTALL, COOLER_RETURN, PICKUP_ONLY, EXCHANGE_ONLY}"
      - name: requested_date
        type: string
        source: input
        description: "ISO8601 date the customer wants service"
      - name: quantity_bottles
        type: integer
        source: input
        description: "For DELIVERY/EXCHANGE_ONLY, the number of full 5-gal bottles; for PICKUP_ONLY the number of empties"
        constraints: ">= 0"
      - name: order_status
        type: enum
        source: system
        description: "WorkOrder lifecycle"
        constraints: "one of {PENDING, SCHEDULED, IN_PROGRESS, COMPLETED, CANCELLED, REJECTED}"
        default: "PENDING"
      - name: linked_stop_id
        type: string
        source: system
        description: "FK -> Stop.id; set when a Stop is generated from this WorkOrder; nullable"
        default: null
      - name: linked_rental_id
        type: string
        source: system
        description: "FK -> CoolerRental.id; set for COOLER_INSTALL and COOLER_RETURN orders; nullable"
        default: null

  - name: PricingConfig
    parent: null
    common_fields: true
    fields:
      - name: effective_from
        type: string
        source: input
        description: "ISO8601 date from which this config applies; half-open [effective_from, next.effective_from)"
      - name: bottle_deposit_cents
        type: integer
        source: input
        description: "Per-bottle refundable deposit"
        constraints: "> 0"
      - name: bottle_shortage_fee_cents
        type: integer
        source: input
        description: "Per-bottle non-return fee (>= deposit)"
        constraints: "> 0"
      - name: standard_per_bottle_cents
        type: integer
        source: input
        description: "STANDARD tier per-bottle price"
        constraints: "> 0"
      - name: silver_per_bottle_cents
        type: integer
        source: input
        description: "SILVER tier per-bottle price"
        constraints: "> 0"
      - name: gold_per_bottle_cents
        type: integer
        source: input
        description: "GOLD tier per-bottle price"
        constraints: "> 0"
      - name: silver_volume_threshold
        type: integer
        source: input
        description: "Monthly delivered-bottle count at which SILVER becomes default"
        constraints: "> 0"
      - name: gold_volume_threshold
        type: integer
        source: input
        description: "Monthly delivered-bottle count at which GOLD becomes default"
        constraints: "> silver_volume_threshold"
      - name: late_fee_flat_cents
        type: integer
        source: input
        description: "Flat late fee charged once when invoice first becomes OVERDUE"
        constraints: ">= 0"

  - name: SkipCredit
    parent: Customer
    common_fields: true
    fields:
      - name: customer_id
        type: string
        source: input
        description: "FK -> Customer.id"
      - name: stop_id
        type: string
        source: input
        description: "FK -> Stop.id; the skipped stop that generated this credit"
      - name: credit_cents
        type: integer
        source: computed
        description: "Credit granted for skip; formula depends on whether customer notified before cutoff"
      - name: credit_status
        type: enum
        source: system
        description: "SkipCredit lifecycle"
        constraints: "one of {PENDING, APPLIED, EXPIRED, REVOKED}"
        default: "PENDING"
      - name: expires_at
        type: datetime
        source: system
        description: "90 days after creation"
      - name: notified_before_cutoff
        type: boolean
        source: input
        description: "True if customer notified skip at least CUTOFF_HOURS before route service_date start"

state_machines:
  - entity: Customer
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /api/v1/customers/{id}/suspend"
        actor: OpsAdmin
        preconditions:
          - "Customer.account_status == ACTIVE"
          - "Customer.outstanding_balance_cents > 0 (only suspend for non-payment)"
        side_effects:
          - "all open WorkOrders (status PENDING) for this customer transition to CANCELLED"
          - "all PLANNED Stops for this customer on future routes transition to CANCELLED (release Route.committed_bottles)"
          - "Customer.updated_at refreshed; version incremented"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /api/v1/customers/{id}/reinstate"
        actor: OpsAdmin
        preconditions:
          - "Customer.account_status == SUSPENDED"
          - "Customer.outstanding_balance_cents == 0"
        side_effects:
          - "Customer.updated_at refreshed; version incremented"
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /api/v1/customers/{id}/close"
        actor: OpsAdmin
        preconditions:
          - "Customer.account_status == ACTIVE"
          - "Customer.outstanding_balance_cents == 0"
          - "Customer.bottles_on_site == 0"
          - "no CoolerRental with rental_status IN {INSTALLED, SUSPENDED, RETURN_REQUESTED} for this customer"
        side_effects:
          - "all AddOns for customer transition to CANCELLED"
          - "all OPEN/DRAFT invoices for customer transition to VOID"
          - "Customer.updated_at refreshed; version incremented"
      - from: SUSPENDED
        to: CLOSED
        trigger: "POST /api/v1/customers/{id}/close"
        actor: OpsAdmin
        preconditions:
          - "Customer.account_status == SUSPENDED"
          - "Customer.outstanding_balance_cents == 0"
          - "Customer.bottles_on_site == 0"
        side_effects:
          - "all AddOns transition to CANCELLED"
          - "Customer.updated_at refreshed; version incremented"

  - entity: Route
    initial_state: DRAFT
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /api/v1/routes/{id}/publish"
        actor: Dispatcher
        preconditions:
          - "Route.route_status == DRAFT"
          - "at least one Stop with stop_status == PLANNED exists on this route"
          - "DeliveryZone referenced by zone_id has active == true"
        side_effects:
          - "Route.version incremented"
      - from: PUBLISHED
        to: IN_PROGRESS
        trigger: "POST /api/v1/routes/{id}/start"
        actor: Driver
        preconditions:
          - "Route.route_status == PUBLISHED"
          - "logical clock current date >= route.service_date"
        side_effects:
          - "every Stop on this route with stop_status == PLANNED transitions to EN_ROUTE"
          - "Route.version incremented"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /api/v1/routes/{id}/complete"
        actor: Driver
        preconditions:
          - "Route.route_status == IN_PROGRESS"
          - "every Stop on this route has stop_status IN {DELIVERED, PARTIAL, SKIPPED, FAILED, CANCELLED}"
        side_effects:
          - "for each DELIVERED/PARTIAL stop, generate InvoiceLine entries against the next DRAFT invoice"
          - "Route.version incremented"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /api/v1/routes/{id}/cancel"
        actor: Dispatcher
        preconditions:
          - "Route.route_status IN {DRAFT, PUBLISHED}"
        side_effects:
          - "every Stop on this route transitions to CANCELLED"
          - "Route.committed_bottles reset to 0"
      - from: PUBLISHED
        to: CANCELLED
        trigger: "POST /api/v1/routes/{id}/cancel"
        actor: Dispatcher
        preconditions:
          - "Route.route_status IN {DRAFT, PUBLISHED}"
        side_effects:
          - "every Stop on this route transitions to CANCELLED"
          - "Route.committed_bottles reset to 0"

  - entity: Stop
    initial_state: PLANNED
    terminal_states: [DELIVERED, PARTIAL, SKIPPED, FAILED, CANCELLED]
    transitions:
      - from: PLANNED
        to: EN_ROUTE
        trigger: "cascade from Route.start"
        actor: system
        preconditions:
          - "Stop.stop_status == PLANNED"
        side_effects: []
      - from: EN_ROUTE
        to: ARRIVED
        trigger: "POST /api/v1/stops/{id}/arrive"
        actor: Driver
        preconditions:
          - "Stop.stop_status == EN_ROUTE"
        side_effects: []
      - from: ARRIVED
        to: DELIVERED
        trigger: "POST /api/v1/stops/{id}/deliver"
        actor: Driver
        preconditions:
          - "Stop.stop_status == ARRIVED"
          - "request.actual_bottles_delivered == Stop.planned_bottles"
          - "request.actual_empties_collected == Stop.planned_empties_pickup"
        side_effects:
          - "Stop.actual_bottles_delivered = request value"
          - "Stop.actual_empties_collected = request value"
          - "create BottleCustodyLedger entries: DELIVER_FULL(+actual_bottles_delivered), PICKUP_EMPTY(-actual_empties_collected)"
          - "recompute Customer.bottles_on_site"
          - "recompute Customer.deposit_liability_cents"
          - "Route.committed_bottles -= Stop.planned_bottles"
      - from: ARRIVED
        to: PARTIAL
        trigger: "POST /api/v1/stops/{id}/deliver with actuals differing from planned"
        actor: Driver
        preconditions:
          - "Stop.stop_status == ARRIVED"
          - "request.actual_bottles_delivered < Stop.planned_bottles OR request.actual_empties_collected < Stop.planned_empties_pickup"
        side_effects:
          - "Stop.actual_bottles_delivered = request value"
          - "Stop.actual_empties_collected = request value"
          - "Stop.shortage_count = max(0, planned_empties_pickup - actual_empties_collected)"
          - "create BottleCustodyLedger entries: DELIVER_FULL(+actual_bottles_delivered), PICKUP_EMPTY(-actual_empties_collected), MARK_SHORTAGE(+shortage_count) [shortage keeps custody AT_CUSTOMER but flags it]"
          - "recompute Customer.bottles_on_site"
          - "Route.committed_bottles -= Stop.planned_bottles"
      - from: PLANNED
        to: SKIPPED
        trigger: "POST /api/v1/stops/{id}/skip"
        actor: Driver
        preconditions:
          - "Stop.stop_status IN {PLANNED, EN_ROUTE, ARRIVED}"
          - "request.skip_reason non-empty"
        side_effects:
          - "create SkipCredit row for Stop.customer_id with notified_before_cutoff evaluated from request"
          - "Route.committed_bottles -= Stop.planned_bottles"
      - from: EN_ROUTE
        to: SKIPPED
        trigger: "POST /api/v1/stops/{id}/skip"
        actor: Driver
        preconditions:
          - "Stop.stop_status IN {PLANNED, EN_ROUTE, ARRIVED}"
          - "request.skip_reason non-empty"
        side_effects:
          - "create SkipCredit row for Stop.customer_id"
          - "Route.committed_bottles -= Stop.planned_bottles"
      - from: ARRIVED
        to: SKIPPED
        trigger: "POST /api/v1/stops/{id}/skip"
        actor: Driver
        preconditions:
          - "Stop.stop_status IN {PLANNED, EN_ROUTE, ARRIVED}"
          - "request.skip_reason non-empty"
        side_effects:
          - "create SkipCredit row"
          - "Route.committed_bottles -= Stop.planned_bottles"
      - from: PLANNED
        to: FAILED
        trigger: "POST /api/v1/stops/{id}/fail"
        actor: Driver
        preconditions:
          - "Stop.stop_status IN {EN_ROUTE, ARRIVED}"
        side_effects:
          - "Route.committed_bottles -= Stop.planned_bottles"
      - from: EN_ROUTE
        to: FAILED
        trigger: "POST /api/v1/stops/{id}/fail"
        actor: Driver
        preconditions:
          - "Stop.stop_status IN {EN_ROUTE, ARRIVED}"
        side_effects:
          - "Route.committed_bottles -= Stop.planned_bottles"
      - from: ARRIVED
        to: FAILED
        trigger: "POST /api/v1/stops/{id}/fail"
        actor: Driver
        preconditions:
          - "Stop.stop_status IN {EN_ROUTE, ARRIVED}"
        side_effects:
          - "Route.committed_bottles -= Stop.planned_bottles"
      - from: PLANNED
        to: CANCELLED
        trigger: "cascade from Route.cancel or Customer.suspend"
        actor: system
        preconditions:
          - "Stop.stop_status == PLANNED"
        side_effects:
          - "Route.committed_bottles -= Stop.planned_bottles"

  - entity: CoolerRental
    initial_state: PENDING_INSTALL
    terminal_states: [RETURNED, CLOSED]
    transitions:
      - from: PENDING_INSTALL
        to: INSTALLED
        trigger: "POST /api/v1/cooler-rentals/{id}/install (via WorkOrder completion)"
        actor: Driver
        preconditions:
          - "CoolerRental.rental_status == PENDING_INSTALL"
          - "Customer.account_status == ACTIVE"
          - "WorkOrder with linked_rental_id == this.id has order_status == IN_PROGRESS"
        side_effects:
          - "CoolerRental.installed_at = current logical clock"
          - "WorkOrder transitions to COMPLETED"
      - from: INSTALLED
        to: SUSPENDED
        trigger: "POST /api/v1/cooler-rentals/{id}/suspend"
        actor: OpsAdmin
        preconditions:
          - "CoolerRental.rental_status == INSTALLED"
        side_effects:
          - "pause accrual (subsequent calc_prorated_rent treats suspension period as zero-accrual)"
      - from: SUSPENDED
        to: INSTALLED
        trigger: "POST /api/v1/cooler-rentals/{id}/resume"
        actor: OpsAdmin
        preconditions:
          - "CoolerRental.rental_status == SUSPENDED"
        side_effects:
          - "resume accrual from current logical clock"
      - from: INSTALLED
        to: RETURN_REQUESTED
        trigger: "POST /api/v1/cooler-rentals/{id}/request-return"
        actor: CustomerSelf
        preconditions:
          - "CoolerRental.rental_status == INSTALLED"
          - "X-User-ID matches CoolerRental.customer_id"
        side_effects:
          - "create WorkOrder of kind COOLER_RETURN with linked_rental_id == this.id"
      - from: RETURN_REQUESTED
        to: RETURNED
        trigger: "POST /api/v1/cooler-rentals/{id}/confirm-return"
        actor: Driver
        preconditions:
          - "CoolerRental.rental_status == RETURN_REQUESTED"
        side_effects:
          - "CoolerRental.returned_at = current logical clock"
          - "compute final calc_prorated_rent up to returned_at"
          - "deposit_cents becomes refundable: applied as deposit_credit on next invoice"
          - "WorkOrder with linked_rental_id == this.id transitions to COMPLETED"
      - from: RETURNED
        to: CLOSED
        trigger: "POST /api/v1/cooler-rentals/{id}/close"
        actor: OpsAdmin
        preconditions:
          - "CoolerRental.rental_status == RETURNED"
          - "accrued_rent_cents fully billed (no DRAFT invoice line pending for this rental)"
        side_effects: []

  - entity: AddOn
    initial_state: ACTIVE
    terminal_states: [CANCELLED]
    transitions:
      - from: ACTIVE
        to: PAUSED
        trigger: "POST /api/v1/addons/{id}/pause"
        actor: CustomerSelf
        preconditions:
          - "AddOn.addon_status == ACTIVE"
          - "X-User-ID matches AddOn.customer_id"
        side_effects: []
      - from: PAUSED
        to: ACTIVE
        trigger: "POST /api/v1/addons/{id}/resume"
        actor: CustomerSelf
        preconditions:
          - "AddOn.addon_status == PAUSED"
          - "X-User-ID matches AddOn.customer_id"
        side_effects: []
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /api/v1/addons/{id}/cancel"
        actor: CustomerSelf
        preconditions:
          - "AddOn.addon_status IN {ACTIVE, PAUSED}"
          - "X-User-ID matches AddOn.customer_id"
        side_effects: []
      - from: PAUSED
        to: CANCELLED
        trigger: "POST /api/v1/addons/{id}/cancel"
        actor: CustomerSelf
        preconditions:
          - "AddOn.addon_status IN {ACTIVE, PAUSED}"
          - "X-User-ID matches AddOn.customer_id"
        side_effects: []

  - entity: Invoice
    initial_state: DRAFT
    terminal_states: [PAID, VOID]
    transitions:
      - from: DRAFT
        to: OPEN
        trigger: "POST /api/v1/invoices/{id}/issue"
        actor: BillingAdmin
        preconditions:
          - "Invoice.invoice_status == DRAFT"
          - "Invoice.total_due_cents > 0"
        side_effects:
          - "Invoice.issued_at = current logical clock"
          - "recompute Customer.outstanding_balance_cents"
      - from: OPEN
        to: PARTIALLY_PAID
        trigger: "Payment applied with amount < balance_due"
        actor: system
        preconditions:
          - "Invoice.invoice_status IN {OPEN, OVERDUE}"
        side_effects:
          - "Invoice.balance_due_cents reduced by Payment.amount_cents"
          - "recompute Customer.outstanding_balance_cents"
      - from: OPEN
        to: PAID
        trigger: "Payment applied with amount >= balance_due"
        actor: system
        preconditions:
          - "Invoice.invoice_status IN {OPEN, OVERDUE, PARTIALLY_PAID, DISPUTED}"
        side_effects:
          - "Invoice.balance_due_cents = 0"
          - "recompute Customer.outstanding_balance_cents"
          - "if Customer had no other OPEN/OVERDUE invoices, clear Customer.overdue_since"
      - from: PARTIALLY_PAID
        to: PAID
        trigger: "Payment applied that covers remaining balance"
        actor: system
        preconditions:
          - "Invoice.invoice_status == PARTIALLY_PAID"
        side_effects:
          - "Invoice.balance_due_cents = 0"
          - "recompute Customer.outstanding_balance_cents"
      - from: OPEN
        to: OVERDUE
        trigger: "system auto-transition: logical clock passes due_date with balance_due > 0"
        actor: system
        preconditions:
          - "Invoice.invoice_status == OPEN"
          - "current logical clock date > Invoice.due_date"
          - "Invoice.balance_due_cents > 0"
        side_effects:
          - "charge late_fee_flat_cents onto Invoice.total_due_cents (and therefore balance_due_cents)"
          - "set Customer.overdue_since if not already set"
      - from: OVERDUE
        to: PAID
        trigger: "Payment applied covering balance_due"
        actor: system
        preconditions:
          - "Invoice.invoice_status == OVERDUE"
        side_effects:
          - "Invoice.balance_due_cents = 0"
          - "recompute Customer.outstanding_balance_cents"
      - from: OPEN
        to: DISPUTED
        trigger: "POST /api/v1/invoices/{id}/dispute"
        actor: CustomerSelf
        preconditions:
          - "Invoice.invoice_status IN {OPEN, PARTIALLY_PAID}"
          - "X-User-ID matches Invoice.customer_id"
        side_effects:
          - "auto-transition to OVERDUE is suppressed while DISPUTED"
      - from: PARTIALLY_PAID
        to: DISPUTED
        trigger: "POST /api/v1/invoices/{id}/dispute"
        actor: CustomerSelf
        preconditions:
          - "Invoice.invoice_status IN {OPEN, PARTIALLY_PAID}"
          - "X-User-ID matches Invoice.customer_id"
        side_effects: []
      - from: DISPUTED
        to: OPEN
        trigger: "POST /api/v1/invoices/{id}/resolve-dispute with outcome=RESTORE"
        actor: BillingAdmin
        preconditions:
          - "Invoice.invoice_status == DISPUTED"
        side_effects: []
      - from: DISPUTED
        to: VOID
        trigger: "POST /api/v1/invoices/{id}/resolve-dispute with outcome=VOID"
        actor: BillingAdmin
        preconditions:
          - "Invoice.invoice_status == DISPUTED"
        side_effects:
          - "Invoice.balance_due_cents = 0"
          - "recompute Customer.outstanding_balance_cents"
      - from: DRAFT
        to: VOID
        trigger: "POST /api/v1/invoices/{id}/void"
        actor: BillingAdmin
        preconditions:
          - "Invoice.invoice_status == DRAFT"
        side_effects: []

  - entity: Payment
    initial_state: PENDING
    terminal_states: [APPLIED, FAILED, REFUNDED]
    transitions:
      - from: PENDING
        to: APPLIED
        trigger: "POST /api/v1/payments/{id}/apply"
        actor: BillingAdmin
        preconditions:
          - "Payment.payment_status == PENDING"
          - "Invoice referenced by invoice_id has invoice_status IN {OPEN, OVERDUE, PARTIALLY_PAID, DISPUTED}"
          - "Payment.amount_cents <= Invoice.balance_due_cents"
        side_effects:
          - "Payment.applied_at = current logical clock"
          - "Invoice.balance_due_cents -= Payment.amount_cents"
          - "Invoice transitions OPEN->PAID or OPEN->PARTIALLY_PAID (or OVERDUE->PAID etc.) per rules"
          - "recompute Customer.outstanding_balance_cents"
      - from: PENDING
        to: FAILED
        trigger: "POST /api/v1/payments/{id}/mark-failed"
        actor: BillingAdmin
        preconditions:
          - "Payment.payment_status == PENDING"
        side_effects: []
      - from: APPLIED
        to: REFUNDED
        trigger: "POST /api/v1/payments/{id}/refund"
        actor: BillingAdmin
        preconditions:
          - "Payment.payment_status == APPLIED"
          - "Invoice.invoice_status == PAID"
        side_effects:
          - "Invoice.balance_due_cents += Payment.amount_cents"
          - "Invoice.invoice_status transitions PAID -> OPEN (re-opened)"
          - "recompute Customer.outstanding_balance_cents"

  - entity: WorkOrder
    initial_state: PENDING
    terminal_states: [COMPLETED, CANCELLED, REJECTED]
    transitions:
      - from: PENDING
        to: SCHEDULED
        trigger: "POST /api/v1/work-orders/{id}/schedule"
        actor: Dispatcher
        preconditions:
          - "WorkOrder.order_status == PENDING"
          - "Customer.account_status == ACTIVE"
          - "for DELIVERY/EXCHANGE_ONLY orders: a Route exists on requested_date with zone matching Customer.delivery_zone_id AND route.route_status IN {DRAFT, PUBLISHED}"
          - "for COOLER_INSTALL: a CoolerRental with id == WorkOrder.linked_rental_id has rental_status == PENDING_INSTALL"
        side_effects:
          - "for DELIVERY/EXCHANGE_ONLY orders: create Stop on matching Route with planned_bottles == WorkOrder.quantity_bottles; WorkOrder.linked_stop_id set; Route.committed_bottles incremented"
          - "for COOLER_INSTALL/COOLER_RETURN orders: no Stop created; tied to CoolerRental state machine"
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "system: linked Route transitions to IN_PROGRESS (for delivery orders) OR driver starts install (for cooler orders)"
        actor: system
        preconditions:
          - "WorkOrder.order_status == SCHEDULED"
        side_effects: []
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "cascade: linked Stop reaches DELIVERED/PARTIAL, or CoolerRental reaches INSTALLED/RETURNED"
        actor: system
        preconditions:
          - "WorkOrder.order_status == IN_PROGRESS"
        side_effects: []
      - from: PENDING
        to: CANCELLED
        trigger: "POST /api/v1/work-orders/{id}/cancel"
        actor: CustomerSelf
        preconditions:
          - "WorkOrder.order_status IN {PENDING, SCHEDULED}"
          - "X-User-ID matches WorkOrder.customer_id"
        side_effects:
          - "if linked_stop_id set and Stop.stop_status == PLANNED: Stop transitions to CANCELLED, Route.committed_bottles decremented"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /api/v1/work-orders/{id}/cancel"
        actor: CustomerSelf
        preconditions:
          - "WorkOrder.order_status IN {PENDING, SCHEDULED}"
          - "X-User-ID matches WorkOrder.customer_id"
        side_effects:
          - "if linked_stop_id set and Stop.stop_status == PLANNED: Stop transitions to CANCELLED"
      - from: PENDING
        to: REJECTED
        trigger: "POST /api/v1/work-orders/{id}/reject"
        actor: Dispatcher
        preconditions:
          - "WorkOrder.order_status == PENDING"
        side_effects: []

  - entity: SkipCredit
    initial_state: PENDING
    terminal_states: [APPLIED, EXPIRED, REVOKED]
    transitions:
      - from: PENDING
        to: APPLIED
        trigger: "POST /api/v1/skip-credits/{id}/apply"
        actor: BillingAdmin
        preconditions:
          - "SkipCredit.credit_status == PENDING"
          - "current logical clock < SkipCredit.expires_at"
          - "a DRAFT invoice exists for the customer to absorb the credit, or one will be created"
        side_effects:
          - "SkipCredit.credit_cents applied as negative line on next invoice for customer"
      - from: PENDING
        to: EXPIRED
        trigger: "system auto-transition: logical clock >= expires_at"
        actor: system
        preconditions:
          - "SkipCredit.credit_status == PENDING"
          - "current logical clock >= SkipCredit.expires_at"
        side_effects: []
      - from: PENDING
        to: REVOKED
        trigger: "POST /api/v1/skip-credits/{id}/revoke"
        actor: OpsAdmin
        preconditions:
          - "SkipCredit.credit_status == PENDING"
        side_effects: []

concurrency_rules:
  - rule_id: customer-update-stale-version
    parent_entity: Customer
    write_endpoint: "PATCH /api/v1/customers/{id}"
    occ_field: "expected_customer_version"
    description: |
      Updating a Customer whose version has advanced since the client last observed
      it is rejected with ERR_STALE_VERSION. Captures the case where another writer
      has just modified the Customer (e.g., a delivery cascaded a bottles_on_site
      update) and the current writer's view of the account is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: stop-deliver-stale-route
    parent_entity: Route
    write_endpoint: "POST /api/v1/stops/{id}/deliver"
    occ_field: "expected_route_version"
    description: |
      Recording a delivery against a Stop whose parent Route's version has advanced
      since the driver last observed it (e.g., another stop on the same route was
      just delivered, bumping Route.version via the committed_bottles side effect)
      is rejected with ERR_STALE_VERSION.
    error_id: ERR_STALE_VERSION
    http_status: 412

calculations:
  - name: calc_water_charge
    trigger: "when a Stop transitions ARRIVED -> DELIVERED or ARRIVED -> PARTIAL"
    algorithm: tiered_pricing
    formula: |
      cfg = PricingConfig in effect at Stop's service_date
      rate_cents = pick by Customer.pricing_tier:
        STANDARD -> cfg.standard_per_bottle_cents
        SILVER   -> cfg.silver_per_bottle_cents
        GOLD     -> cfg.gold_per_bottle_cents
      charge_cents = rate_cents * actual_bottles_delivered
      (no rounding needed: per-unit rate already in whole cents)
    input_set: "Stops with stop_status IN {DELIVERED, PARTIAL} for customer in current billing period"
    precision: "whole cents, no fractional"
    variants:
      - name: provisional_at_plan
        when: "at Stop creation (planning), the projected charge uses planned_bottles"
        difference: "uses planned_bottles instead of actual_bottles_delivered; written to a projected_charges_cache only, not persisted to invoice"
      - name: final_at_delivery
        when: "at ARRIVED -> DELIVERED/PARTIAL"
        difference: "uses actual_bottles_delivered; persisted onto the invoice; the provisional value is discarded"

  - name: calc_prorated_rent
    trigger: "at invoice close (DRAFT -> OPEN) and at CoolerRental RETURNED final bill"
    algorithm: forward_looking
    formula: |
      For each CoolerRental where rental_status IN {INSTALLED, SUSPENDED, RETURN_REQUESTED} at period_end
      OR returned_at within [period_start, period_end):
        days_in_period = (period_end - period_start).days
        days_installed_in_period = count of days d in [period_start, period_end) where rental was INSTALLED on day d
        # SUSPENDED days accrue zero
        daily_rate_cents = round_half_up(monthly_rent_cents * 12 / 365)
        accrued_for_period_cents = daily_rate_cents * days_installed_in_period
      subtotal_rent_cents = sum over rentals of accrued_for_period_cents
    input_set: "CoolerRentals belonging to the Customer whose rental period overlaps the billing period"
    constants:
      DAYS_IN_YEAR: 365
      MONTHS_IN_YEAR: 12
    precision: "round_half_up at daily-rate step, then integer multiply; no further rounding"
    variants:
      - name: inclusive_return_day
        when: "returned_at falls on the period boundary day"
        difference: "return day counts as a full accrual day (rental was installed at some point that day); alternative interpretation (exclusive) produces one-day-lower charge and is explicitly rejected"

  - name: calc_shortage_charge
    trigger: "at Stop transition to PARTIAL (shortage_count > 0) — flagged at stop; rolled into Invoice at issue"
    algorithm: aggregation
    formula: |
      cfg = PricingConfig in effect at service_date
      For each Stop in period with shortage_count > 0:
        shortage_charge_cents += Stop.shortage_count * cfg.bottle_shortage_fee_cents
      # note: bottle_shortage_fee_cents >= bottle_deposit_cents, so shortage charge always >= deposit refund foregone
    input_set: "Stops for this Customer with stop_status == PARTIAL AND shortage_count > 0 AND service_date in [period_start, period_end)"
    precision: "whole cents"

  - name: calc_deposit_refund
    trigger: "at Invoice issue (DRAFT -> OPEN)"
    algorithm: chronological
    formula: |
      cfg = PricingConfig in effect at period_end
      # chronological variant (canonical): walk BottleCustodyLedger in (occurred_at ASC, created_at ASC) order
      # sum RETURN_FULL and PICKUP_EMPTY entries with negative contribution to custody,
      # against DELIVER_FULL entries that established custody in this-or-prior periods.
      # Refund is only granted for bottles that NET REDUCE bottles_on_site within this period.
      opening_bottles_on_site = bottles_on_site at period_start (computed by replay)
      closing_bottles_on_site = bottles_on_site at period_end
      net_returned = max(0, opening_bottles_on_site - closing_bottles_on_site)
      deposit_credit_cents = net_returned * cfg.bottle_deposit_cents
    input_set: "BottleCustodyLedger entries for Customer with occurred_at in [period_start, period_end), replayed in (occurred_at ASC, created_at ASC) order"
    precision: "whole cents"
    variants:
      - name: forward_looking_net
        when: "canonical variant used at issue time"
        difference: "net = max(0, opening - closing); a forward-looking estimate at period_start would return 0 (no returns have happened yet) and is NOT used for billing"
      - name: per_event_immediate
        when: "rejected alternative — refunding deposit at each PICKUP_EMPTY event"
        difference: "would refund even when bottles_on_site stays constant or grows (exchange parity), causing double-refund when paired with DELIVER_FULL in the same period; explicitly NOT used"

  - name: calc_skip_credit
    trigger: "at Stop transition to SKIPPED"
    algorithm: threshold
    formula: |
      cfg = PricingConfig in effect
      projected_charge_cents = planned_bottles * rate_for_tier(Customer.pricing_tier, cfg)
      if notified_before_cutoff:
        credit_cents = projected_charge_cents   # full credit
      else:
        credit_cents = round_half_up(projected_charge_cents * 0.5)  # 50% credit
      # boundary: cutoff_hours is inclusive — a notification exactly at cutoff counts as before-cutoff
    input_set: "the SKIPPED Stop"
    constants:
      CUTOFF_HOURS: 24
      LATE_SKIP_CREDIT_RATIO: 0.5
    precision: "round_half_up to whole cents"

  - name: calc_route_commit
    trigger: "at Stop creation and at Stop terminal transitions"
    algorithm: aggregation
    formula: |
      Route.committed_bottles = sum over Stops s on this Route where s.stop_status IN {PLANNED, EN_ROUTE, ARRIVED} of s.planned_bottles
      # capacity check: committed_bottles must satisfy committed_bottles <= Route.truck_capacity_bottles
      # at all times; insertions that would violate are rejected with ERR_ROUTE_CAPACITY_EXCEEDED
    input_set: "Stops on this Route with stop_status IN {PLANNED, EN_ROUTE, ARRIVED}"
    precision: "integer"

  - name: calc_auto_tier_upgrade
    trigger: "at Invoice issue: based on total bottles delivered in the period just closed"
    algorithm: threshold
    formula: |
      cfg = PricingConfig in effect at period_end
      bottles_delivered_in_period = sum of Stop.actual_bottles_delivered for Customer in period with status IN {DELIVERED, PARTIAL}
      # inclusive threshold: count == threshold upgrades
      if bottles_delivered_in_period >= cfg.gold_volume_threshold:
        new_tier = GOLD
      elif bottles_delivered_in_period >= cfg.silver_volume_threshold:
        new_tier = SILVER
      else:
        new_tier = STANDARD
      # applied to Customer.pricing_tier for NEXT period; current period already billed at prior tier
    input_set: "Customer's stops in closed period"
    precision: "integer counts, inclusive >="

  - name: calc_outstanding_balance
    trigger: "on every Invoice state change, every Payment apply/refund, every Customer read"
    algorithm: aggregation
    formula: |
      Customer.outstanding_balance_cents = sum of Invoice.balance_due_cents
        for Invoice.customer_id == Customer.id
        AND Invoice.invoice_status IN {OPEN, OVERDUE, PARTIALLY_PAID, DISPUTED}
    input_set: "Invoices for Customer in {OPEN, OVERDUE, PARTIALLY_PAID, DISPUTED}"
    precision: "whole cents"

validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and well-formed"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all endpoints except /api/v1/_clock/set_current_utc"

  - priority: 2
    category: auth
    check: "Role permitted for this endpoint per RBAC matrix"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all endpoints"

  - priority: 3
    category: existence
    check: "Path parameters reference existing resources (Customer, Route, Stop, Invoice, etc.)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path parameters"

  - priority: 4
    category: state
    check: "Target resource is in a state that permits this transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"

  - priority: 5
    category: business_constraint
    check: "Required fields present with valid types and enum membership"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all POST/PATCH endpoints"

  - priority: 6
    category: business_referential
    check: "Foreign-key references resolve to existing, compatible entities (e.g., Customer.delivery_zone_id exists)"
    error_id: ERR_INVALID_REFERENCE
    http_status: 422
    applies_to: "endpoints that accept foreign-key ids in body"

  - priority: 7
    category: business_temporal
    check: "Date fields well-formed; service_date >= current date for new Routes; billing_period_end > billing_period_start"
    error_id: ERR_INVALID_DATE_RANGE
    http_status: 422
    applies_to: "endpoints accepting dates"

  - priority: 8
    category: business_constraint
    check: "Stop.sequence_index unique within parent Route"
    error_id: ERR_DUPLICATE_SEQUENCE
    http_status: 409
    applies_to: "POST /api/v1/routes/{id}/stops"

  - priority: 9
    category: business_safety
    check: "Route.committed_bottles + new stop planned_bottles <= Route.truck_capacity_bottles"
    error_id: ERR_ROUTE_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /api/v1/routes/{id}/stops, POST /api/v1/work-orders/{id}/schedule"

  - priority: 10
    category: business_fiscal
    check: "Payment.amount_cents <= Invoice.balance_due_cents at apply time"
    error_id: ERR_OVERPAYMENT
    http_status: 422
    applies_to: "POST /api/v1/payments/{id}/apply"

  - priority: 11
    category: business_fiscal
    check: "Customer.outstanding_balance_cents == 0 before allowing Customer close"
    error_id: ERR_OUTSTANDING_BALANCE
    http_status: 422
    applies_to: "POST /api/v1/customers/{id}/close"

  - priority: 12
    category: business_referential
    check: "Customer.bottles_on_site == 0 before allowing Customer close (no outstanding bottle custody)"
    error_id: ERR_BOTTLES_OUTSTANDING
    http_status: 422
    applies_to: "POST /api/v1/customers/{id}/close"

  - priority: 13
    category: business_constraint
    check: "Stop skip requires non-empty skip_reason"
    error_id: ERR_SKIP_REASON_REQUIRED
    http_status: 400
    applies_to: "POST /api/v1/stops/{id}/skip"

  - priority: 14
    category: business_temporal
    check: "SkipCredit apply must occur before expires_at"
    error_id: ERR_CREDIT_EXPIRED
    http_status: 422
    applies_to: "POST /api/v1/skip-credits/{id}/apply"

  - priority: 15
    category: business_referential
    check: "Customer can only act on own resources (X-User-ID matches resource.customer_id)"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "CustomerSelf endpoints"

  - priority: 16
    category: business_constraint
    check: "PricingConfig gold_volume_threshold > silver_volume_threshold"
    error_id: ERR_INVALID_PRICING_CONFIG
    http_status: 422
    applies_to: "POST /api/v1/pricing-configs"

  - priority: 17
    category: business_constraint
    check: "OCC: expected_<parent>_version matches current parent version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "PATCH /api/v1/customers/{id}, POST /api/v1/stops/{id}/deliver"

  - priority: 18
    category: state
    check: "Invoice dispute only valid from OPEN or PARTIALLY_PAID"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "POST /api/v1/invoices/{id}/dispute"

endpoints:
  # ---- Clock (test-driving) ----
  - method: POST
    path: "/api/v1/_clock/set_current_utc"
    description: "Set logical clock. Server starts at default 2026-05-01T00:00:00Z and never uses wall-clock."
    roles: [OpsAdmin]
    code: 200
    input: [to_iso8601]
    output: { now_iso8601: string }
    side_effects: ["triggers time-based auto-transitions: Invoice OPEN->OVERDUE, SkipCredit PENDING->EXPIRED"]

  # ---- PricingConfig ----
  - method: POST
    path: "/api/v1/pricing-configs"
    description: "Create a pricing configuration"
    roles: [OpsAdmin]
    code: 201
    input: [effective_from, bottle_deposit_cents, bottle_shortage_fee_cents, standard_per_bottle_cents, silver_per_bottle_cents, gold_per_bottle_cents, silver_volume_threshold, gold_volume_threshold, late_fee_flat_cents]
    output: PricingConfig
    side_effects: []

  - method: GET
    path: "/api/v1/pricing-configs"
    description: "List pricing configs"
    roles: [OpsAdmin, BillingAdmin, Dispatcher]
    code: 200
    input: ['limit?', 'offset?']
    output: PricingConfig[]
    side_effects: []

  - method: GET
    path: "/api/v1/pricing-configs/{id}"
    description: "Get one pricing config"
    roles: [OpsAdmin, BillingAdmin, Dispatcher]
    code: 200
    input: []
    output: PricingConfig
    side_effects: []

  # ---- DeliveryZone ----
  - method: POST
    path: "/api/v1/delivery-zones"
    description: "Create a delivery zone"
    roles: [OpsAdmin]
    code: 201
    input: [code, name, 'active?']
    output: DeliveryZone
    side_effects: []

  - method: GET
    path: "/api/v1/delivery-zones"
    description: "List zones"
    roles: [OpsAdmin, Dispatcher, Driver, BillingAdmin]
    code: 200
    input: ['limit?', 'offset?']
    output: DeliveryZone[]
    side_effects: []

  - method: GET
    path: "/api/v1/delivery-zones/{id}"
    description: "Get one zone"
    roles: [OpsAdmin, Dispatcher, Driver, BillingAdmin]
    code: 200
    input: []
    output: DeliveryZone
    side_effects: []

  - method: GET
    path: "/api/v1/delivery-zones/{id}/customers"
    description: "List customers in a zone"
    roles: [OpsAdmin, Dispatcher, BillingAdmin]
    code: 200
    input: ['limit?', 'offset?']
    output: Customer[]
    side_effects: []

  - method: GET
    path: "/api/v1/delivery-zones/{id}/routes"
    description: "List routes in a zone"
    roles: [OpsAdmin, Dispatcher, Driver]
    code: 200
    input: ['limit?', 'offset?']
    output: Route[]
    side_effects: []

  # ---- Customer ----
  - method: POST
    path: "/api/v1/customers"
    description: "Register a new customer account"
    roles: [OpsAdmin]
    code: 201
    input: [account_type, business_name, billing_email, service_address, delivery_zone_id, 'service_mode?', 'par_level_bottles?', 'pricing_tier?']
    output: Customer
    side_effects: ["account_status initialized to ACTIVE; bottles_on_site = 0"]

  - method: GET
    path: "/api/v1/customers"
    description: "List customers"
    roles: [OpsAdmin, Dispatcher, BillingAdmin]
    code: 200
    input: ['limit?', 'offset?', 'account_status?', 'delivery_zone_id?']
    output: Customer[]
    side_effects: []

  - method: GET
    path: "/api/v1/customers/{id}"
    description: "Get one customer (with computed outstanding_balance, bottles_on_site, deposit_liability)"
    roles: [OpsAdmin, Dispatcher, BillingAdmin, CustomerSelf]
    code: 200
    input: []
    output: Customer
    side_effects: []

  - method: PATCH
    path: "/api/v1/customers/{id}"
    description: "Update customer fields (OCC via expected_customer_version)"
    roles: [OpsAdmin]
    code: 200
    input: [expected_customer_version, 'business_name?', 'service_address?', 'par_level_bottles?', 'pricing_tier?', 'service_mode?']
    output: Customer
    side_effects: ["increments Customer.version by 1"]

  - method: POST
    path: "/api/v1/customers/{id}/suspend"
    description: "Suspend account for non-payment"
    roles: [OpsAdmin]
    code: 200
    input: []
    output: Customer
    side_effects: ["cancel future WorkOrders and PLANNED Stops", "increments Customer.version"]

  - method: POST
    path: "/api/v1/customers/{id}/reinstate"
    description: "Reinstate suspended customer"
    roles: [OpsAdmin]
    code: 200
    input: []
    output: Customer
    side_effects: ["increments Customer.version"]

  - method: POST
    path: "/api/v1/customers/{id}/close"
    description: "Close account; requires zero balance and zero bottles_on_site"
    roles: [OpsAdmin]
    code: 200
    input: []
    output: Customer
    side_effects: ["void DRAFT invoices; cancel addons; increments Customer.version"]

  - method: GET
    path: "/api/v1/customers/{id}/cooler-rentals"
    description: "List customer's cooler rentals"
    roles: [OpsAdmin, Dispatcher, BillingAdmin, Driver, CustomerSelf]
    code: 200
    input: ['limit?', 'offset?']
    output: CoolerRental[]
    side_effects: []

  - method: GET
    path: "/api/v1/customers/{id}/addons"
    description: "List customer's addons"
    roles: [OpsAdmin, BillingAdmin, CustomerSelf]
    code: 200
    input: ['limit?', 'offset?']
    output: AddOn[]
    side_effects: []

  - method: GET
    path: "/api/v1/customers/{id}/invoices"
    description: "List customer's invoices"
    roles: [OpsAdmin, BillingAdmin, CustomerSelf]
    code: 200
    input: ['limit?', 'offset?', 'invoice_status?']
    output: Invoice[]
    side_effects: []

  - method: GET
    path: "/api/v1/customers/{id}/work-orders"
    description: "List customer's work orders"
    roles: [OpsAdmin, Dispatcher, CustomerSelf, Driver]
    code: 200
    input: ['limit?', 'offset?', 'order_status?']
    output: WorkOrder[]
    side_effects: []

  - method: GET
    path: "/api/v1/customers/{id}/bottle-custody-ledger"
    description: "List custody ledger entries for customer"
    roles: [OpsAdmin, BillingAdmin, CustomerSelf]
    code: 200
    input: ['limit?', 'offset?']
    output: BottleCustodyLedger[]
    side_effects: []

  - method: GET
    path: "/api/v1/customers/{id}/skip-credits"
    description: "List customer's skip credits"
    roles: [OpsAdmin, BillingAdmin, CustomerSelf]
    code: 200
    input: ['limit?', 'offset?']
    output: SkipCredit[]
    side_effects: []

  # ---- Route ----
  - method: POST
    path: "/api/v1/routes"
    description: "Create a route"
    roles: [Dispatcher]
    code: 201
    input: [zone_id, service_date, driver_name, truck_capacity_bottles]
    output: Route
    side_effects: []

  - method: GET
    path: "/api/v1/routes"
    description: "List routes"
    roles: [OpsAdmin, Dispatcher, Driver]
    code: 200
    input: ['limit?', 'offset?', 'service_date?', 'route_status?', 'zone_id?']
    output: Route[]
    side_effects: []

  - method: GET
    path: "/api/v1/routes/{id}"
    description: "Get one route"
    roles: [OpsAdmin, Dispatcher, Driver]
    code: 200
    input: []
    output: Route
    side_effects: []

  - method: POST
    path: "/api/v1/routes/{id}/publish"
    description: "Publish a DRAFT route"
    roles: [Dispatcher]
    code: 200
    input: []
    output: Route
    side_effects: ["increments Route.version"]

  - method: POST
    path: "/api/v1/routes/{id}/start"
    description: "Start route (PUBLISHED -> IN_PROGRESS)"
    roles: [Driver]
    code: 200
    input: []
    output: Route
    side_effects: ["all PLANNED stops -> EN_ROUTE", "increments Route.version"]

  - method: POST
    path: "/api/v1/routes/{id}/complete"
    description: "Complete route (all stops terminal)"
    roles: [Driver]
    code: 200
    input: []
    output: Route
    side_effects: ["increments Route.version"]

  - method: POST
    path: "/api/v1/routes/{id}/cancel"
    description: "Cancel route"
    roles: [Dispatcher]
    code: 200
    input: []
    output: Route
    side_effects: ["all non-terminal stops -> CANCELLED; committed_bottles = 0", "increments Route.version"]

  - method: GET
    path: "/api/v1/routes/{id}/stops"
    description: "List stops on route"
    roles: [OpsAdmin, Dispatcher, Driver]
    code: 200
    input: ['limit?', 'offset?']
    output: Stop[]
    side_effects: []

  # ---- Stop ----
  - method: POST
    path: "/api/v1/routes/{id}/stops"
    description: "Manually plan a stop on a route"
    roles: [Dispatcher]
    code: 201
    input: [customer_id, sequence_index]
    output: Stop
    side_effects: ["computes planned_bottles from Customer.par_level_bottles - Customer.bottles_on_site for AUTO; rejected for WILL_CALL without a WorkOrder", "Route.committed_bottles += planned_bottles", "increments Route.version"]

  - method: GET
    path: "/api/v1/stops"
    description: "List stops across routes"
    roles: [OpsAdmin, Dispatcher, Driver]
    code: 200
    input: ['limit?', 'offset?', 'route_id?', 'customer_id?', 'stop_status?']
    output: Stop[]
    side_effects: []

  - method: GET
    path: "/api/v1/stops/{id}"
    description: "Get one stop"
    roles: [OpsAdmin, Dispatcher, Driver]
    code: 200
    input: []
    output: Stop
    side_effects: []

  - method: GET
    path: "/api/v1/stops/{id}/bottle-custody-ledger"
    description: "List custody ledger entries tied to a stop"
    roles: [OpsAdmin, Dispatcher, BillingAdmin]
    code: 200
    input: ['limit?', 'offset?']
    output: BottleCustodyLedger[]
    side_effects: []

  - method: GET
    path: "/api/v1/stops/{id}/skip-credits"
    description: "List skip credits generated by this stop (0 or 1 entries)"
    roles: [OpsAdmin, Dispatcher, BillingAdmin]
    code: 200
    input: ['limit?', 'offset?']
    output: SkipCredit[]
    side_effects: []

  - method: POST
    path: "/api/v1/stops/{id}/arrive"
    description: "Driver arrives at stop (EN_ROUTE -> ARRIVED)"
    roles: [Driver]
    code: 200
    input: []
    output: Stop
    side_effects: []

  - method: POST
    path: "/api/v1/stops/{id}/deliver"
    description: "Record delivery (ARRIVED -> DELIVERED or PARTIAL). OCC via expected_route_version."
    roles: [Driver]
    code: 200
    input: [expected_route_version, actual_bottles_delivered, actual_empties_collected]
    output: Stop
    side_effects: ["write BottleCustodyLedger entries", "recompute Customer.bottles_on_site", "Route.committed_bottles -= planned_bottles", "increments Route.version"]

  - method: POST
    path: "/api/v1/stops/{id}/skip"
    description: "Skip stop"
    roles: [Driver]
    code: 200
    input: [skip_reason, notified_before_cutoff]
    output: Stop
    side_effects: ["create SkipCredit row", "Route.committed_bottles -= planned_bottles", "increments Route.version"]

  - method: POST
    path: "/api/v1/stops/{id}/fail"
    description: "Mark stop failed"
    roles: [Driver]
    code: 200
    input: []
    output: Stop
    side_effects: ["Route.committed_bottles -= planned_bottles", "increments Route.version"]

  # ---- WorkOrder ----
  - method: POST
    path: "/api/v1/work-orders"
    description: "Customer creates a work order (WILL_CALL delivery, cooler install/return, etc.)"
    roles: [CustomerSelf, Dispatcher]
    code: 201
    input: [customer_id, order_kind, requested_date, quantity_bottles]
    output: WorkOrder
    side_effects: []

  - method: GET
    path: "/api/v1/work-orders"
    description: "List work orders"
    roles: [OpsAdmin, Dispatcher, Driver]
    code: 200
    input: ['limit?', 'offset?', 'customer_id?', 'order_status?', 'order_kind?', 'linked_stop_id?', 'linked_rental_id?']
    output: WorkOrder[]
    side_effects: []

  - method: GET
    path: "/api/v1/work-orders/{id}"
    description: "Get one work order"
    roles: [OpsAdmin, Dispatcher, Driver, CustomerSelf]
    code: 200
    input: []
    output: WorkOrder
    side_effects: []

  - method: POST
    path: "/api/v1/work-orders/{id}/schedule"
    description: "Dispatcher schedules a PENDING work order onto a Route (creates Stop for delivery kinds)"
    roles: [Dispatcher]
    code: 200
    input: []
    output: WorkOrder
    side_effects: ["for DELIVERY/EXCHANGE_ONLY: create Stop with planned_bottles = quantity_bottles; set linked_stop_id; increment Route.committed_bottles", "increments Route.version"]

  - method: POST
    path: "/api/v1/work-orders/{id}/cancel"
    description: "Cancel a work order"
    roles: [CustomerSelf, Dispatcher]
    code: 200
    input: []
    output: WorkOrder
    side_effects: ["if linked_stop still PLANNED: cancel it and decrement Route.committed_bottles"]

  - method: POST
    path: "/api/v1/work-orders/{id}/reject"
    description: "Reject a work order"
    roles: [Dispatcher]
    code: 200
    input: []
    output: WorkOrder
    side_effects: []

  # ---- CoolerRental ----
  - method: POST
    path: "/api/v1/cooler-rentals"
    description: "Customer requests a new cooler rental"
    roles: [OpsAdmin, CustomerSelf]
    code: 201
    input: [customer_id, cooler_model, monthly_rent_cents, deposit_cents]
    output: CoolerRental
    side_effects: ["creates linked WorkOrder of kind COOLER_INSTALL"]

  - method: GET
    path: "/api/v1/cooler-rentals/{id}"
    description: "Get one cooler rental"
    roles: [OpsAdmin, Dispatcher, Driver, CustomerSelf, BillingAdmin]
    code: 200
    input: []
    output: CoolerRental
    side_effects: []

  - method: POST
    path: "/api/v1/cooler-rentals/{id}/install"
    description: "Mark cooler installed (linked WorkOrder must be IN_PROGRESS)"
    roles: [Driver]
    code: 200
    input: []
    output: CoolerRental
    side_effects: ["sets installed_at = now", "linked WorkOrder -> COMPLETED"]

  - method: POST
    path: "/api/v1/cooler-rentals/{id}/suspend"
    description: "Pause rent accrual"
    roles: [OpsAdmin]
    code: 200
    input: []
    output: CoolerRental
    side_effects: []

  - method: POST
    path: "/api/v1/cooler-rentals/{id}/resume"
    description: "Resume rent accrual"
    roles: [OpsAdmin]
    code: 200
    input: []
    output: CoolerRental
    side_effects: []

  - method: POST
    path: "/api/v1/cooler-rentals/{id}/request-return"
    description: "Customer requests return (creates COOLER_RETURN WorkOrder)"
    roles: [CustomerSelf]
    code: 200
    input: []
    output: CoolerRental
    side_effects: ["create WorkOrder kind=COOLER_RETURN with linked_rental_id"]

  - method: POST
    path: "/api/v1/cooler-rentals/{id}/confirm-return"
    description: "Confirm cooler returned"
    roles: [Driver]
    code: 200
    input: []
    output: CoolerRental
    side_effects: ["sets returned_at", "final rent accrual computed", "deposit_cents becomes refundable"]

  - method: POST
    path: "/api/v1/cooler-rentals/{id}/close"
    description: "Close out a returned rental"
    roles: [OpsAdmin]
    code: 200
    input: []
    output: CoolerRental
    side_effects: []

  # ---- AddOn ----
  - method: POST
    path: "/api/v1/addons"
    description: "Add a recurring/one-time addon to a customer"
    roles: [OpsAdmin, CustomerSelf]
    code: 201
    input: [customer_id, addon_kind, quantity, unit_price_cents, 'cadence?']
    output: AddOn
    side_effects: []

  - method: GET
    path: "/api/v1/addons/{id}"
    description: "Get one addon"
    roles: [OpsAdmin, BillingAdmin, CustomerSelf]
    code: 200
    input: []
    output: AddOn
    side_effects: []

  - method: POST
    path: "/api/v1/addons/{id}/pause"
    description: "Pause an addon"
    roles: [CustomerSelf]
    code: 200
    input: []
    output: AddOn
    side_effects: []

  - method: POST
    path: "/api/v1/addons/{id}/resume"
    description: "Resume an addon"
    roles: [CustomerSelf]
    code: 200
    input: []
    output: AddOn
    side_effects: []

  - method: POST
    path: "/api/v1/addons/{id}/cancel"
    description: "Cancel an addon"
    roles: [CustomerSelf]
    code: 200
    input: []
    output: AddOn
    side_effects: []

  # ---- Invoice ----
  - method: POST
    path: "/api/v1/invoices"
    description: "Create a DRAFT invoice for a customer for a billing period"
    roles: [BillingAdmin]
    code: 201
    input: [customer_id, billing_period_start, billing_period_end, due_date]
    output: Invoice
    side_effects: ["compute all subtotal_* fields via calculation rules"]

  - method: GET
    path: "/api/v1/invoices/{id}"
    description: "Get one invoice"
    roles: [OpsAdmin, BillingAdmin, CustomerSelf]
    code: 200
    input: []
    output: Invoice
    side_effects: []

  - method: GET
    path: "/api/v1/invoices"
    description: "List invoices"
    roles: [OpsAdmin, BillingAdmin]
    code: 200
    input: ['limit?', 'offset?', 'customer_id?', 'invoice_status?']
    output: Invoice[]
    side_effects: []

  - method: POST
    path: "/api/v1/invoices/{id}/issue"
    description: "Issue DRAFT invoice (DRAFT -> OPEN); fires calc_auto_tier_upgrade"
    roles: [BillingAdmin]
    code: 200
    input: []
    output: Invoice
    side_effects: ["set issued_at", "recompute Customer.outstanding_balance_cents", "calc_auto_tier_upgrade updates Customer.pricing_tier for next period"]

  - method: POST
    path: "/api/v1/invoices/{id}/dispute"
    description: "Customer disputes an OPEN or PARTIALLY_PAID invoice"
    roles: [CustomerSelf]
    code: 200
    input: []
    output: Invoice
    side_effects: []

  - method: POST
    path: "/api/v1/invoices/{id}/resolve-dispute"
    description: "BillingAdmin resolves a dispute"
    roles: [BillingAdmin]
    code: 200
    input: [outcome]
    output: Invoice
    side_effects: ["outcome=VOID zeroes balance_due"]

  - method: POST
    path: "/api/v1/invoices/{id}/void"
    description: "Void a DRAFT invoice"
    roles: [BillingAdmin]
    code: 200
    input: []
    output: Invoice
    side_effects: []

  - method: GET
    path: "/api/v1/invoices/{id}/payments"
    description: "List payments against an invoice"
    roles: [OpsAdmin, BillingAdmin, CustomerSelf]
    code: 200
    input: ['limit?', 'offset?']
    output: Payment[]
    side_effects: []

  # ---- Payment ----
  - method: POST
    path: "/api/v1/payments"
    description: "Record a payment against an invoice"
    roles: [BillingAdmin, CustomerSelf]
    code: 201
    input: [invoice_id, amount_cents, method]
    output: Payment
    side_effects: []

  - method: GET
    path: "/api/v1/payments/{id}"
    description: "Get one payment"
    roles: [OpsAdmin, BillingAdmin, CustomerSelf]
    code: 200
    input: []
    output: Payment
    side_effects: []

  - method: POST
    path: "/api/v1/payments/{id}/apply"
    description: "Apply a PENDING payment"
    roles: [BillingAdmin]
    code: 200
    input: []
    output: Payment
    side_effects: ["Invoice.balance_due_cents reduced", "Invoice status may auto-transition", "Customer.outstanding_balance_cents recomputed"]

  - method: POST
    path: "/api/v1/payments/{id}/mark-failed"
    description: "Mark PENDING payment failed"
    roles: [BillingAdmin]
    code: 200
    input: []
    output: Payment
    side_effects: []

  - method: POST
    path: "/api/v1/payments/{id}/refund"
    description: "Refund an APPLIED payment"
    roles: [BillingAdmin]
    code: 200
    input: []
    output: Payment
    side_effects: ["Invoice reopens", "Customer.outstanding_balance_cents recomputed"]

  # ---- SkipCredit ----
  - method: GET
    path: "/api/v1/skip-credits/{id}"
    description: "Get one skip credit"
    roles: [OpsAdmin, BillingAdmin, CustomerSelf]
    code: 200
    input: []
    output: SkipCredit
    side_effects: []

  - method: POST
    path: "/api/v1/skip-credits/{id}/apply"
    description: "Apply a PENDING skip credit to next invoice"
    roles: [BillingAdmin]
    code: 200
    input: []
    output: SkipCredit
    side_effects: ["creates negative line on next DRAFT invoice for customer"]

  - method: POST
    path: "/api/v1/skip-credits/{id}/revoke"
    description: "Revoke a PENDING skip credit"
    roles: [OpsAdmin]
    code: 200
    input: []
    output: SkipCredit
    side_effects: []

errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "missing or malformed X-User-Role / X-User-ID headers"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "role not permitted to invoke this endpoint"
  - id: ERR_FORBIDDEN
    http: 403
    condition: "CustomerSelf attempted to act on a resource whose customer_id does not equal X-User-ID"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "path-parameter id does not resolve to an existing resource"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "required field missing, type mismatch, or enum value outside declared set"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "target resource is not in a state that permits the requested transition"
  - id: ERR_INVALID_REFERENCE
    http: 422
    condition: "foreign-key reference does not resolve or is incompatible (e.g., zone mismatch)"
  - id: ERR_INVALID_DATE_RANGE
    http: 422
    condition: "date fields malformed or period_start >= period_end"
  - id: ERR_DUPLICATE_SEQUENCE
    http: 409
    condition: "Stop.sequence_index already used on this Route"
  - id: ERR_ROUTE_CAPACITY_EXCEEDED
    http: 422
    condition: "adding this Stop would push Route.committed_bottles above truck_capacity_bottles"
  - id: ERR_OVERPAYMENT
    http: 422
    condition: "Payment.amount_cents exceeds Invoice.balance_due_cents"
  - id: ERR_OUTSTANDING_BALANCE
    http: 422
    condition: "Customer close/suspend operation blocked because outstanding_balance_cents > 0"
  - id: ERR_BOTTLES_OUTSTANDING
    http: 422
    condition: "Customer close blocked because bottles_on_site > 0"
  - id: ERR_SKIP_REASON_REQUIRED
    http: 400
    condition: "skip endpoint called with empty skip_reason"
  - id: ERR_CREDIT_EXPIRED
    http: 422
    condition: "SkipCredit apply attempted after expires_at"
  - id: ERR_INVALID_PRICING_CONFIG
    http: 422
    condition: "PricingConfig thresholds violate gold > silver or non-positive amounts"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_<parent>_version does not match parent's current version (OCC)"
  - id: ERR_ALREADY_TERMINAL
    http: 409
    condition: "operation attempted on a resource already in a terminal state"

roles:
  - name: OpsAdmin
    description: "Back-office operator with full administrative privileges"
    identity: "opaque"
    exclusive_operations:
