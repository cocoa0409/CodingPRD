            - {call: "POST /legal-research/subscriptions", payload: {account_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", plan_id: "${p_id}", period_start: "2026-09-01", period_end: "2026-10-01", seats_total: 1}, as: LicensingManager, captures: {err2: $.data.error_id}}
