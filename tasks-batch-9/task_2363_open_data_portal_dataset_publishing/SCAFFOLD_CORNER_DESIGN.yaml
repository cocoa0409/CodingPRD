            - "One DatasetRequest with two votes (weighted_vote_total 4), taken UNDER_REVIEW and then ACCEPTED"
            - "No dataset has ever been created in the system"
          setup_api_calls:
            - call: "POST /open-data/_clock/set_current_utc"
