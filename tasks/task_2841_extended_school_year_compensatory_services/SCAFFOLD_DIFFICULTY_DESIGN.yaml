            - "After trigger call 4: ServiceCommitment.${c_c_id}.status == ASSIGNED and version == ${c_c_v} + 1"
            - "Provider.${pr1_id}.assigned_weekly_minutes == 687 after the successful calls (229 x 3) and never exceeds max_weekly_minutes 1200"
            - "FundAllocation.${f1_id}.encumbered_amount_cents == 667764 and available_cents == 24332236 (222588 x 3, only successful assignments encumber)"
            - "covered_total_minutes is 1374 on every created row: 229 weekly minutes x instructional_week_count 6, unaffected by the shorter effective date ranges"

      - name: route_daily_windows_use_closed_intervals_plus_turnaround_buffer
        grounds:
          - calculations.transport_run_occupancy
          - calculations.transport_run_occupancy.constants.ROUTE_TURNAROUND_MINUTES
          - validations.priority_17_ERR_RUN_WINDOW_OVERLAP
          - validations.priority_18_ERR_ROUTE_TURNAROUND_VIOLATION
          - endpoints.POST_/esy/transportation-runs
        distinguishing_aspect: |
          A DIFFERENT resource entity (TransportationRun, scoped by route_code plus a
          single calendar service_date, not a provider's repeating weekday) under
          DIFFERENT interval semantics: windows are CLOSED
          [window_start_time, window_end_time], so 07:00-07:45 and 07:45-08:30 DO
          collide - the exact case that is legal for provider slots - and a
          non-overlapping run must additionally clear a ROUTE_TURNAROUND_MINUTES (15)
          buffer, a rule the provider resource has no analogue for. A 5-minute gap
          fails, a 15-minute gap passes.
        test_recipe:
          setup:
            - "Program P1 is PLANNING with instructional_weekdays MON-THU, so 2027-06-14 (MON) and 2027-06-15 (TUE) are both instructional dates."
            - "No transportation runs exist yet and no commitment references any run, so every seats_committed stays 0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-06-01T00:00:00Z" }
              as: CaseManager
            - call: "POST /esy/programs"
              payload: { name: "Summer ESY 2027", school_year: "2026-2027", session_start_date: "2027-06-14", session_end_date: "2027-07-23", instructional_weekdays: ["MON", "TUE", "WED", "THU"], daily_minutes_cap: 90, blackout_dates: ["2027-06-30", "2027-07-05"] }
              as: ProgramCoordinator
              as_user_id: "pc-001"
              captures: { p1_id: $.data.id }
          trigger:
            - call: "POST /esy/transportation-runs"
              payload: { program_id: "${p1_id}", route_code: "R7", service_date: "2027-06-14", window_start_time: "07:00", window_end_time: "07:45", vehicle_capacity_seats: 2 }
              as: ProgramCoordinator
              as_user_id: "pc-001"
            - call: "POST /esy/transportation-runs"
              payload: { program_id: "${p1_id}", route_code: "R7", service_date: "2027-06-14", window_start_time: "07:45", window_end_time: "08:30", vehicle_capacity_seats: 2 }
              as: ProgramCoordinator
              as_user_id: "pc-001"
            - call: "POST /esy/transportation-runs"
              payload: { program_id: "${p1_id}", route_code: "R7", service_date: "2027-06-14", window_start_time: "07:50", window_end_time: "08:20", vehicle_capacity_seats: 2 }
              as: ProgramCoordinator
              as_user_id: "pc-001"
            - call: "POST /esy/transportation-runs"
              payload: { program_id: "${p1_id}", route_code: "R7", service_date: "2027-06-14", window_start_time: "08:00", window_end_time: "08:30", vehicle_capacity_seats: 2 }
              as: ProgramCoordinator
              as_user_id: "pc-001"
            - call: "POST /esy/transportation-runs"
              payload: { program_id: "${p1_id}", route_code: "R9", service_date: "2027-06-14", window_start_time: "07:45", window_end_time: "08:30", vehicle_capacity_seats: 2 }
              as: ProgramCoordinator
              as_user_id: "pc-001"
            - call: "POST /esy/transportation-runs"
              payload: { program_id: "${p1_id}", route_code: "R7", service_date: "2027-06-15", window_start_time: "07:45", window_end_time: "08:30", vehicle_capacity_seats: 2 }
              as: ProgramCoordinator
              as_user_id: "pc-001"
          assert:
            - "BASE RUN (trigger call 1): 201 with status == SCHEDULED and seats_committed == 0"
            - "TOUCHING ENDPOINT IS A COLLISION (trigger call 2, 07:45-08:30 against 07:00-07:45 on the same route and date): 409 with error_id == ERR_RUN_WINDOW_OVERLAP, the opposite outcome from the provider half-open case"
            - "GAP BELOW THE BUFFER (trigger call 3, 07:50-08:20 leaves a 5-minute gap after 07:45): 409 with error_id == ERR_ROUTE_TURNAROUND_VIOLATION, not ERR_RUN_WINDOW_OVERLAP, because the windows do not touch"
            - "GAP EXACTLY AT THE BUFFER (trigger call 4, 08:00-08:30 leaves exactly 15 minutes): 201 with status == SCHEDULED, proving the rejection band is 0 < gap < 15 and not gap <= 15"
            - "DIFFERENT ROUTE IS UNCONSTRAINED (trigger call 5, route R9 with the very window that failed as R7): 201, proving the conflict scope is (route_code, service_date)"
            - "DIFFERENT DATE IS UNCONSTRAINED (trigger call 6, route R7 on 2027-06-15 with the same window): 201"
            - "GET /esy/programs/${p1_id}/transportation-runs returns total_count == 4 (the two rejected calls created nothing)"
            - "Every created run has seats_committed == 0 and status == SCHEDULED, and EsyProgram.${p1_id}.status is still PLANNING"

  # =====================================================================
  # Rule 9 - compensating invariants over two different conserved quantities
  # =====================================================================
  - rule_id: compensating_invariant
    instances:
      - name: owed_minutes_conservation_survives_a_voided_delivery
        grounds:
          - state_machines.MakeupSession.DELIVERED_to_VOIDED
          - calculations.award_delivery_ledger
          - calculations.student_minutes_ledger
          - entities.Student.fields.outstanding_owed_minutes
          - entities.CompensatoryAward.fields.remaining_owed_minutes
        distinguishing_aspect: |
          CONSERVED QUANTITY: owed instructional minutes. The invariant is
          Student.outstanding_owed_minutes == sum over awards with
          negotiation_status IN {AGREED, CLOSED} of
          max(0, agreed_minutes - delivered_minutes - forfeited_minutes).
          Logging a 45-minute delivery moves the ledger from 85 to 40, and voiding
          that same session must return it to exactly 85 with no drift, no
          double-count and no residue in scheduled_minutes or
          delivered_makeup_minutes_total.
        test_recipe:
          setup:
            - "Program P1 is OPEN, commitment C1 is ACTIVE, and the three canonical logs give 85 district-caused compensable minutes."
            - "A MINUTE_FOR_MINUTE award is AGREED at 85 minutes with the clock at 2027-08-02T00:00:00Z, so delivery_deadline_date is 2028-01-29."
            - "One 45-minute MakeupSession is SCHEDULED for 2027-09-13 with provider PR1, so scheduled_minutes is 45 and remaining_owed_minutes is still 85."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-06-01T00:00:00Z" }
              as: CaseManager
            - call: "POST /esy/students"
              payload: { student_number: "S-2841-001", first_name: "Ada", last_name: "Reyes", grade_band: "MS_6_8", primary_disability: "AUTISM", iep_weekly_minutes_total: 250, transportation_required: true, home_school_code: "MS-014" }
              as: CaseManager
              as_user_id: "cm-001"
              captures: { s1_id: $.data.id }
            - call: "POST /esy/eligibility-determinations"
              payload: { student_id: "${s1_id}", school_year: "2026-2027", analysis_variant: "PROBE_BASED", skill_probes: [ { skill_domain: "READING_FLUENCY", pre_break_mastery_pct: 80, post_break_mastery_pct: 60, recoupment_days_observed: 20, trials_count: 4 }, { skill_domain: "MATH_COMPUTATION", pre_break_mastery_pct: 100, post_break_mastery_pct: 74, recoupment_days_observed: 22, trials_count: 4 } ] }
              as: CaseManager
              as_user_id: "cm-001"
              captures: { d1_id: $.data.id }
            - call: "POST /esy/eligibility-determinations/${d1_id}/analyze"
              payload: {}
              as: CaseManager
              as_user_id: "cm-001"
            - call: "POST /esy/eligibility-determinations/${d1_id}/parent-response"
              payload: { response: "AGREE" }
              as: ParentGuardian
              as_user_id: "${s1_id}"
            - call: "POST /esy/eligibility-determinations/${d1_id}/finalize"
              payload: {}
              as: SpedDirector
              as_user_id: "dir-001"
            - call: "POST /esy/programs"
              payload: { name: "Summer ESY 2027", school_year: "2026-2027", session_start_date: "2027-06-14", session_end_date: "2027-07-23", instructional_weekdays: ["MON", "TUE", "WED", "THU"], daily_minutes_cap: 90, blackout_dates: ["2027-06-30", "2027-07-05"] }
              as: ProgramCoordinator
              as_user_id: "pc-001"
              captures: { p1_id: $.data.id }
            - call: "POST /esy/fund-allocations"
              payload: { program_id: "${p1_id}", fund_source: "IDEA_611_FEDERAL", budget_code: "611-ESY-01", authorized_amount_cents: 25000000 }
              as: SpedDirector
              as_user_id: "dir-001"
              captures: { f1_id: $.data.id }
            - call: "POST /esy/providers"
              payload: { full_name: "Nina Torres", role_type: "SPED_TEACHER", credential_expires_on: "2028-06-30", rate_cents_per_minute: 150, max_weekly_minutes: 1200 }
              as: ProgramCoordinator
