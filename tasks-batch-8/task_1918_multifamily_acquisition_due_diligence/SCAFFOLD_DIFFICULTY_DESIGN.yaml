      - name: employee_approve_sod_beats_temporal
        grounds:
          - validations[priority=7]
          - validations[priority=10]
          - state_machines.EmployeeDecision.PROPOSED_to_APPROVED
        distinguishing_aspect: |
          Pair business_referential-vs-business_temporal: the approver is the
          same user as the proposer (SoD, priority 7) AND the notice window is
          9 days < 14 (temporal, priority 10); the response must be
          ERR_SOD_VIOLATION, never ERR_NOTICE_PERIOD_INSUFFICIENT.
        test_recipe:
          setup:
            - "Acquisition IN_DILIGENCE; HR user hr-1 proposed a TERMINATE decision with notice 2026-09-01, effective 2026-09-10 (9 days < required 14)"
          setup_api_calls:
            - { call: "POST /acquisitions", payload: { property_name: "Priority Two", address: "23 Plum St", agreed_purchase_price_cents: 200000000, earnest_money_cents: 5000000, closing_date: "2026-09-12T00:00:00Z", diligence_deadline: "2026-09-01T00:00:00Z", assessment_ratio: 0.40, millage_rate: 25.0, prior_year_tax_cents: 1800000 }, as: AcquisitionsAnalyst, captures: { acq: $.data.id } }
            - { call: "POST /acquisitions/${acq}/kickoff", payload: {}, as: UnderwritingManager, as_user_id: "um-1" }
            - { call: "POST /acquisitions/employee-decisions", payload: { acquisition_id: "${acq}", employee_ref: "emp-7", position: "LEASING_MANAGER", hire_date: "2020-01-01T00:00:00Z", annual_salary_cents: 5200000, accrued_pto_hours: 40, decision: "TERMINATE", notice_date: "2026-09-01T00:00:00Z", effective_date: "2026-09-10T00:00:00Z", required_notice_days: 14 }, as: HRPartner, as_user_id: "hr-1", captures: { dec: $.data.id, proposer: $.data.proposed_by_user_id } }
          trigger:
            - { call: "POST /acquisitions/employee-decisions/${dec}/approve", payload: {}, as: UnderwritingManager, as_user_id: "hr-1", captures: { err: $.data.error_id } }
          assert:
            - "proposed_by_user_id == hr-1 (stamped from the proposal's X-User-ID)"
            - "error_id == ERR_SOD_VIOLATION (referential, priority 7)"
            - "error_id != ERR_NOTICE_PERIOD_INSUFFICIENT (temporal, priority 10) even though 9 < 14 also holds"
            - "Decision remains PROPOSED"

      - name: tax_create_on_missing_acquisition_existence_beats_state_and_occ
        grounds:
          - validations[priority=3]
          - validations[priority=6]
          - concurrency_rules[tax-projection-create-stale-acquisition]
        distinguishing_aspect: |
          Pair existence-vs-state/concurrency: creating a tax projection under
          a nonexistent acquisition id, carrying an expected_acquisition_version
          that could never match, must return ERR_ACQUISITION_NOT_FOUND (404,
          priority 3), never ERR_STALE_VERSION (412) or a state error.
        test_recipe:
          setup:
            - "One real acquisition exists (to source a plausible version value); the target path id is a random UUID that does not exist"
          setup_api_calls:
            - { call: "POST /acquisitions", payload: { property_name: "Priority Three", address: "25 Peach St", agreed_purchase_price_cents: 200000000, earnest_money_cents: 5000000, closing_date: "2026-09-12T00:00:00Z", diligence_deadline: "2026-09-01T00:00:00Z", assessment_ratio: 0.40, millage_rate: 25.0, prior_year_tax_cents: 1800000 }, as: AcquisitionsAnalyst, captures: { acq: $.data.id, acq_v: $.data.version } }
          trigger:
            - { call: "POST /acquisitions/00000000-0000-0000-0000-000000000000/tax-projections", payload: { method: "PURCHASE_PRICE_ANCHORED", expected_acquisition_version: "${acq_v}" }, as: AcquisitionsAnalyst, captures: { err: $.data.error_id } }
          assert:
            - "HTTP 404 with error_id == ERR_ACQUISITION_NOT_FOUND"
            - "Not ERR_STALE_VERSION (existence, priority 3, precedes the OCC check at priority 6)"
  # ===================================================================
  # Rule 6 — boundary_precision_check (3 instances, different metrics/endpoints)
  # ===================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: closing_day_attribution_boundary
        grounds:
          - calculations.closing_proration
          - entities.Acquisition.fields.closing_date
        distinguishing_aspect: |
          Metric: buyer/seller day counts at the closing day itself. Closing on
          the period's first day (2026-09-01) gives the buyer ALL 30 September
          days (seller 0): RENT line 147960 cents. Endpoint: statement
          generation. Off-by-one implementations that give the seller the
          closing day produce 143028 instead.
        test_recipe:
          setup:
            - "Acquisition closing 2026-09-01 (price 200000000); unit VERIFIED (lease 150000 from 2025-09-01, deposit 150000 stated 153000 = 150000 + 3000 DAILY interest over 365 days, reconciled); diligence complete; tax projection approved (2000000)"
          setup_api_calls:
            - { call: "POST /acquisitions", payload: { property_name: "Boundary One", address: "27 Olive St", agreed_purchase_price_cents: 200000000, earnest_money_cents: 5000000, closing_date: "2026-09-01T00:00:00Z", diligence_deadline: "2026-08-20T00:00:00Z", assessment_ratio: 0.40, millage_rate: 25.0, prior_year_tax_cents: 1800000 }, as: AcquisitionsAnalyst, captures: { acq: $.data.id } }
            - { call: "POST /acquisitions/${acq}/kickoff", payload: {}, as: UnderwritingManager, as_user_id: "um-1" }
            - { call: "POST /acquisitions/units", payload: { acquisition_id: "${acq}", unit_number: "1A", floor_plan: "1BR", sqft: 700, market_rent_cents: 160000 }, as: AcquisitionsAnalyst, captures: { unit: $.data.id } }
            - { call: "POST /acquisitions/lease-files", payload: { unit_id: "${unit}", resident_name: "R One", lease_start_date: "2025-09-01T00:00:00Z", lease_end_date: "2027-08-31T00:00:00Z", contract_rent_cents: 150000, term_months: 12, deposit_amount_cents: 150000 }, as: AcquisitionsAnalyst, captures: { lease: $.data.id } }
            - { call: "POST /acquisitions/rent-roll-entries", payload: { unit_id: "${unit}", reported_resident_name: "R One", reported_rent_cents: 150000, reported_concession_cents: 0, reported_deposit_cents: 153000, move_in_date: "2025-09-01T00:00:00Z" }, as: AcquisitionsAnalyst }
            - { call: "POST /acquisitions/lease-files/${lease}/audit", payload: {}, as: AcquisitionsAnalyst }
            - { call: "POST /acquisitions/inspections", payload: { unit_id: "${unit}", inspector_ref: "insp-1", walk_start: "2026-08-10T09:00:00Z", walk_end: "2026-08-10T10:00:00Z" }, as: PropertyOperationsLead, captures: { insp: $.data.id } }
            - { call: "POST /acquisitions/inspections/${insp}/complete", payload: { condition_rating: 4, no_findings_declared: true }, as: PropertyOperationsLead, as_user_id: "pol-1" }
            - { call: "POST /acquisitions/inspections/${insp}/qa-accept", payload: {}, as: PropertyOperationsLead, as_user_id: "pol-2" }
            - { call: "POST /acquisitions/deposits", payload: { lease_file_id: "${lease}", seller_stated_amount_cents: 153000, interest_required: true, annual_interest_rate: 0.02 }, as: AcquisitionsAnalyst, captures: { dep: $.data.id } }
            - { call: "POST /acquisitions/deposits/${dep}/reconcile", payload: {}, as: AcquisitionsAnalyst }
            - { call: "POST /acquisitions/${acq}/complete-diligence", payload: {}, as: UnderwritingManager, as_user_id: "um-1" }
            - { call: "GET /acquisitions/${acq}", payload: {}, as: UnderwritingManager, as_user_id: "um-1", captures: { acq_v1: $.data.version } }
            - { call: "POST /acquisitions/${acq}/tax-projections", payload: { method: "PURCHASE_PRICE_ANCHORED", expected_acquisition_version: "${acq_v1}" }, as: AcquisitionsAnalyst, captures: { proj: $.data.id } }
            - { call: "POST /acquisitions/tax-projections/${proj}/compute", payload: {}, as: AcquisitionsAnalyst }
            - { call: "POST /acquisitions/tax-projections/${proj}/approve", payload: {}, as: UnderwritingManager, as_user_id: "um-1" }
            - { call: "GET /acquisitions/${acq}", payload: {}, as: UnderwritingManager, as_user_id: "um-1", captures: { acq_v2: $.data.version } }
          trigger:
            - { call: "POST /acquisitions/${acq}/proration-statements", payload: { statement_type: "DRAFT_CLOSING", day_count_method: "ACTUAL_365", expected_acquisition_version: "${acq_v2}" }, as: UnderwritingManager, as_user_id: "um-1", captures: { stmt: $.data.id } }
            - { call: "GET /acquisitions/proration-statements/${stmt}/lines", payload: {}, as: UnderwritingManager, as_user_id: "um-1", captures: { rent_line: $.data.0.amount_cents, tax_line: $.data.1.amount_cents } }
          assert:
            - "RENT line == 147960 (daily 4932 x 30 buyer days: Sep 1..30, closing day owned by the buyer)"
            - "RENT line MUST NOT be 143028 (4932 x 29, the off-by-one that hands the closing day to the seller)"
            - "TAX line == 1331507 (round_half_up(2000000 x 243 / 365); seller days Jan 1 .. Aug 31 = 243, closing day excluded from the seller)"

      - name: service_contract_notice_deadline_boundary
        grounds:
          - calculations.closing_proration
          - state_machines.ServiceContract.UNDER_REVIEW_to_NOTICE_SENT
          - entities.ServiceContract.fields.decision_deadline
        distinguishing_aspect: |
          Metric: calendar days between notice and term end. term_end
          2026-12-31 with 60 notice days gives decision_deadline 2026-11-01;
          notice ON the deadline day succeeds (<=), one day later fails with
          ERR_NOTICE_WINDOW_MISSED. Endpoint: send-notice. Different metric and
          endpoint than the proration instance.
        test_recipe:
          setup:
            - "Acquisition IN_DILIGENCE; two service contracts A and B, both auto_renew=false, term_end 2026-12-31, cancellation_notice_days 60 (decision_deadline 2026-11-01)"
          setup_api_calls:
            - { call: "POST /acquisitions", payload: { property_name: "Boundary Two", address: "29 Willow St", agreed_purchase_price_cents: 200000000, earnest_money_cents: 5000000, closing_date: "2026-09-12T00:00:00Z", diligence_deadline: "2026-09-01T00:00:00Z", assessment_ratio: 0.40, millage_rate: 25.0, prior_year_tax_cents: 1800000 }, as: AcquisitionsAnalyst, captures: { acq: $.data.id } }
            - { call: "POST /acquisitions/${acq}/kickoff", payload: {}, as: UnderwritingManager, as_user_id: "um-1" }
            - { call: "POST /acquisitions/service-contracts", payload: { acquisition_id: "${acq}", vendor_name: "LiftCo", service_type: "ELEVATOR", monthly_cost_cents: 300000, term_end_date: "2026-12-31T00:00:00Z", auto_renew: false, cancellation_notice_days: 60, cancellation_penalty_cents: 0 }, as: VendorManager, as_user_id: "vm-1", captures: { sc_a: $.data.id, dl_a: $.data.decision_deadline } }
            - { call: "POST /acquisitions/service-contracts/${sc_a}/begin-review", payload: {}, as: VendorManager, as_user_id: "vm-1" }
            - { call: "POST /acquisitions/service-contracts", payload: { acquisition_id: "${acq}", vendor_name: "CleanCo", service_type: "LANDSCAPING", monthly_cost_cents: 120000, term_end_date: "2026-12-31T00:00:00Z", auto_renew: false, cancellation_notice_days: 60, cancellation_penalty_cents: 50000 }, as: VendorManager, as_user_id: "vm-1", captures: { sc_b: $.data.id } }
            - { call: "POST /acquisitions/service-contracts/${sc_b}/begin-review", payload: {}, as: VendorManager, as_user_id: "vm-1" }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-11-01T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /acquisitions/service-contracts/${sc_a}/send-notice", payload: { cancellation_effective_date: "2026-12-31T00:00:00Z" }, as: VendorManager, as_user_id: "vm-1", captures: { st_a: $.data.status } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-11-02T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /acquisitions/service-contracts/${sc_b}/send-notice", payload: { cancellation_effective_date: "2026-12-31T00:00:00Z" }, as: VendorManager, as_user_id: "vm-1", captures: { err_b: $.data.error_id } }
          assert:
            - "decision_deadline == 2026-11-01T00:00:00Z (term_end 2026-12-31 minus 60 calendar days)"
            - "Notice on the deadline day (clock 2026-11-01) SUCCEEDS: contract A NOTICE_SENT (boundary is inclusive, clock <= deadline)"
            - "Notice one day later (clock 2026-11-02) fails: error_id == ERR_NOTICE_WINDOW_MISSED; contract B stays UNDER_REVIEW"

      - name: deposit_interest_exact_anniversary_boundary
        grounds:
          - calculations.deposit_interest_accrual
          - entities.SecurityDepositLedgerEntry.fields.accrued_interest_cents
        distinguishing_aspect: |
          Metric: elapsed lease days at the first anniversary under
          SIMPLE_ANNUAL. 365 days accrues one full year (3000 cents); 364 days
          accrues 0. Endpoint: deposit reconcile. Third distinct metric and
          endpoint.
        test_recipe:
          setup:
            - "Acquisition with interest_accrual_method SIMPLE_ANNUAL, closing 2026-09-12"
            - "Unit 1A lease starting 2025-09-12 (exactly 365 days at closing), deposit 150000, seller stated 153000"
            - "Unit 2B lease starting 2025-09-13 (364 days at closing), deposit 150000, seller stated 150000"
          setup_api_calls:
            - { call: "POST /acquisitions", payload: { property_name: "Boundary Three", address: "31 Spruce St", agreed_purchase_price_cents: 200000000, earnest_money_cents: 5000000, closing_date: "2026-09-12T00:00:00Z", diligence_deadline: "2026-09-01T00:00:00Z", assessment_ratio: 0.40, millage_rate: 25.0, prior_year_tax_cents: 1800000, interest_accrual_method: "SIMPLE_ANNUAL" }, as: AcquisitionsAnalyst, captures: { acq: $.data.id } }
            - { call: "POST /acquisitions/units", payload: { acquisition_id: "${acq}", unit_number: "1A", floor_plan: "1BR", sqft: 700, market_rent_cents: 160000 }, as: AcquisitionsAnalyst, captures: { unit1: $.data.id } }
            - { call: "POST /acquisitions/lease-files", payload: { unit_id: "${unit1}", resident_name: "R One", lease_start_date: "2025-09-12T00:00:00Z", lease_end_date: "2027-09-11T00:00:00Z", contract_rent_cents: 150000, term_months: 12, deposit_amount_cents: 150000 }, as: AcquisitionsAnalyst, captures: { lease1: $.data.id } }
            - { call: "POST /acquisitions/rent-roll-entries", payload: { unit_id: "${unit1}", reported_resident_name: "R One", reported_rent_cents: 150000, reported_concession_cents: 0, reported_deposit_cents: 153000, move_in_date: "2025-09-12T00:00:00Z" }, as: AcquisitionsAnalyst }
            - { call: "POST /acquisitions/lease-files/${lease1}/audit", payload: {}, as: AcquisitionsAnalyst }
            - { call: "POST /acquisitions/deposits", payload: { lease_file_id: "${lease1}", seller_stated_amount_cents: 153000, interest_required: true, annual_interest_rate: 0.02 }, as: AcquisitionsAnalyst, captures: { dep1: $.data.id } }
            - { call: "POST /acquisitions/units", payload: { acquisition_id: "${acq}", unit_number: "2B", floor_plan: "2BR", sqft: 900, market_rent_cents: 180000 }, as: AcquisitionsAnalyst, captures: { unit2: $.data.id } }
            - { call: "POST /acquisitions/lease-files", payload: { unit_id: "${unit2}", resident_name: "R Two", lease_start_date: "2025-09-13T00:00:00Z", lease_end_date: "2027-09-12T00:00:00Z", contract_rent_cents: 150000, term_months: 12, deposit_amount_cents: 150000 }, as: AcquisitionsAnalyst, captures: { lease2: $.data.id } }
            - { call: "POST /acquisitions/rent-roll-entries", payload: { unit_id: "${unit2}", reported_resident_name: "R Two", reported_rent_cents: 150000, reported_concession_cents: 0, reported_deposit_cents: 150000, move_in_date: "2025-09-13T00:00:00Z" }, as: AcquisitionsAnalyst }
            - { call: "POST /acquisitions/lease-files/${lease2}/audit", payload: {}, as: AcquisitionsAnalyst }
            - { call: "POST /acquisitions/deposits", payload: { lease_file_id: "${lease2}", seller_stated_amount_cents: 150000, interest_required: true, annual_interest_rate: 0.02 }, as: AcquisitionsAnalyst, captures: { dep2: $.data.id } }
          trigger:
            - { call: "POST /acquisitions/deposits/${dep1}/reconcile", payload: {}, as: AcquisitionsAnalyst, captures: { int1: $.data.accrued_interest_cents, st1: $.data.status } }
            - { call: "POST /acquisitions/deposits/${dep2}/reconcile", payload: {}, as: AcquisitionsAnalyst, captures: { int2: $.data.accrued_interest_cents, st2: $.data.status } }
          assert:
            - "365-day lease: accrued_interest_cents == 3000 (floor(365/365)=1 whole year; the anniversary day itself counts)"
            - "364-day lease: accrued_interest_cents == 0 (floor(364/365)=0)"
            - "Both reconcile to RECONCILED (variance 0 in both cases: 153000 and 150000 stated respectively)"

