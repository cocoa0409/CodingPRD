              payload: { desk_id: "${desk_id}", commodity_code: "CORN", futures_month: "2026-12", side: "SHORT", lots_open: 10, avg_entry_price_cents: 448 }
              as: FuturesTrader
              as_user_id: "u-trader-1"
              captures: { hp1_id: $.data.id }
            - call: "POST /grain/bids"
              payload: { location_id: "${loc1_id}", commodity_code: "CORN", futures_month: "2026-12", delivery_period_start: "2026-10-01", delivery_period_end: "2026-12-31", basis_cents: -32, max_bushels: 1000000, expires_at: "2027-01-15T00:00:00Z" }
              as: Merchandiser
              as_user_id: "u-merch-1"
              captures: { bid1_id: $.data.id }
            - call: "POST /grain/bids/${bid1_id}/activate"
              payload: {}
              as: Merchandiser
              as_user_id: "u-merch-1"
            - call: "POST /grain/purchase-contracts"
              payload: { bid_id: "${bid1_id}", hedge_position_id: "${hp1_id}", contract_type: "BASIS", bushels: 20000, seller_name: "Bell Farms", delivery_start: "2026-11-01", delivery_end: "2026-11-30" }
              as: Merchandiser
              as_user_id: "u-merch-1"
              captures: { c1_id: $.data.id }
            - call: "POST /grain/hedge-positions/${hp1_id}/mark-to-market"
              payload: { settlement_price_cents: 470 }
              as: FuturesTrader
              as_user_id: "u-trader-1"
          trigger:
            - call: "POST /grain/pricing-orders"
              payload: { contract_id: "${c1_id}", component: "FUTURES", bushels: 20000, price_cents: 452 }
              as: FuturesTrader
              as_user_id: "u-trader-1"
              captures: { err: $.data.error_id }
          assert:
            - "HedgePosition.${hp1_id}.status == MARGIN_CALL"
            - "HedgePosition.${hp1_id}.unrealized_pnl_usd == -11000.00"
            - "TradingDesk.${desk_id}.posture == NORMAL"
            - "PurchaseContract.${c1_id}.pricing_locked == false"
            - "${err} == ERR_HEDGE_POSITION_NOT_OPEN"
            - "the response status is 409"
            - "PurchaseContract.${c1_id}.priced_futures_bushels == 0"
            - "PurchaseContract.${c1_id}.pricing_status == PARTIALLY_PRICED"

  - rule_id: resource_temporal_overlap
    instances:
      - name: rail_fleet_half_open_occupancy_with_turnaround_buffer
        grounds:
          - validations[priority=27]
          - entities.FreightBooking.fields.occupancy_end_at
          - errors[ERR_FLEET_UNAVAILABLE]
        distinguishing_aspect: |
          Interval semantics 1, on the RailFleet resource: EXCLUSIVE occupancy over the
          HALF-OPEN interval [placement_at, release_at + 48h), so a second booking starting one
          hour inside the turnaround buffer is rejected while a booking starting at exactly
          2026-11-09T00:00:00Z — the buffer's open upper endpoint — is admitted.
