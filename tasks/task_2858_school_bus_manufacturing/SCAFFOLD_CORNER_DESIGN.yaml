              payload: {}
              as: PlantScheduler
              as_user_id: "plant-01"
              captures: { slot_1_committed: $.data.status }
            - call: "GET /production-lines/${line_id}"
              payload: {}
              as: PlantScheduler
              as_user_id: "plant-01"
              captures: { line_v4: $.data.version, days_v4: $.data.committed_slot_days }
            - call: "POST /build-slots"
              payload: { expected_production_line_version: "${line_v2}", production_line_id: "${line_id}", bus_unit_id: "${unit_2_id}", start_date: "2026-10-05", end_date: "2026-10-08" }
              as: PlantScheduler
              as_user_id: "plant-01"
