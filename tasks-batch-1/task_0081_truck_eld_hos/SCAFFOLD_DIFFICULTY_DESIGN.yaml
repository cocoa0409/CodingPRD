  # =========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: duty_event_strict_ordering_rejects_non_increasing_time
        grounds:
          - validations[priority=8]
          - entities.DutyStatusEvent.fields.event_time
          - state_machines.DutyStatusEvent.ACTIVE_to_ACTIVE
        distinguishing_aspect: |
          On the DutyStatusEvent resource, interval semantics are STRICTLY half-open and contiguous:
          a new event_time equal to the latest ACTIVE event_time (zero-length collision / adjacency
          touching the boundary) is rejected, because two events cannot share the same instant on one
          driver's timeline. Adjacency at the boundary is a conflict.
        test_recipe:
          setup:
            - "Driver D has a latest ACTIVE event at 2026-06-01T10:00. A new append uses event_time exactly 2026-06-01T10:00 (touching boundary)."
          setup_api_calls:
            - call: "POST /eld/vehicles"
              payload: { unit_number: "U15", vin: "VINOOO15" }
              as: CarrierAdmin
              captures: { veh_id: $.data.id }
            - call: "POST /eld/devices"
              payload: { serial_number: "S15", vehicle_id: "${veh_id}" }
              as: CarrierAdmin
              captures: { dev_id: $.data.id }
            - call: "POST /eld/drivers"
              payload: { license_number: "CDL-O15", full_name: "Driver O", home_terminal_tz_offset_minutes: 0 }
              as: CarrierAdmin
              captures: { d_id: $.data.id, d_v0: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T12:00:00Z" }
              as: CarrierAdmin
            - call: "POST /eld/devices/${dev_id}/login"
              payload: {}
              as: Driver
              as_user_id: "${d_id}"
            - call: "POST /eld/duty-events"
              payload: { driver_id: "${d_id}", device_id: "${dev_id}", duty_status: "ON_DUTY_NOT_DRIVING", event_time: "2026-06-01T10:00:00Z", expected_driver_version: "${d_v0}" }
              as: Driver
              as_user_id: "${d_id}"
            - call: "GET /eld/drivers/${d_id}"
              payload: {}
              as: Driver
              as_user_id: "${d_id}"
              captures: { d_v1: $.data.version }
          trigger:
            - call: "POST /eld/duty-events"
              payload: { driver_id: "${d_id}", device_id: "${dev_id}", duty_status: "DRIVING", event_time: "2026-06-01T10:00:00Z", expected_driver_version: "${d_v1}" }
              as: Driver
              as_user_id: "${d_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Response status 409 with data.error_id == ERR_EVENT_OUT_OF_ORDER (boundary-touching event_time rejected; strict-greater required)."
      - name: device_binding_single_occupancy_rejects_second_login
        grounds:
          - state_machines.ELDDevice.UNBOUND_to_BOUND
          - validations[priority=7]
          - entities.ELDDevice.fields.bound_driver_id
        distinguishing_aspect: |
          On the ELDDevice resource the interval semantics are exclusive single-occupancy over an
          open-ended login interval (no end time): while a device is BOUND its occupation interval is
          open, so a second driver's login overlaps it and is rejected — aggregate-capacity-of-one
          semantics, distinct from the DutyStatusEvent point-boundary rule.
        test_recipe:
          setup:
            - "Device is BOUND to Driver D1 (open-ended login). Driver D2 attempts to login to the same device."
          setup_api_calls:
            - call: "POST /eld/vehicles"
              payload: { unit_number: "U16", vin: "VINPPP16" }
              as: CarrierAdmin
              captures: { veh_id: $.data.id }
            - call: "POST /eld/devices"
              payload: { serial_number: "S16", vehicle_id: "${veh_id}" }
              as: CarrierAdmin
              captures: { dev_id: $.data.id }
            - call: "POST /eld/drivers"
              payload: { license_number: "CDL-P16a", full_name: "Driver P1", home_terminal_tz_offset_minutes: 0 }
              as: CarrierAdmin
              captures: { d1_id: $.data.id }
            - call: "POST /eld/drivers"
              payload: { license_number: "CDL-P16b", full_name: "Driver P2", home_terminal_tz_offset_minutes: 0 }
              as: CarrierAdmin
              captures: { d2_id: $.data.id }
            - call: "POST /eld/devices/${dev_id}/login"
              payload: {}
              as: Driver
              as_user_id: "${d1_id}"
          trigger:
            - call: "POST /eld/devices/${dev_id}/login"
              payload: {}
              as: Driver
              as_user_id: "${d2_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Response status 409 with data.error_id == ERR_DEVICE_ALREADY_BOUND."
            - "ELDDevice.${dev_id}.bound_driver_id == ${d1_id} (unchanged)."

  # =========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: markerror_restores_cycle_on_duty_minutes_invariant
        grounds:
          - state_machines.DutyStatusEvent.ACTIVE_to_INACTIVE_ERROR
          - calculations.hos_clocks
          - entities.Driver.fields.cycle_on_duty_minutes
        distinguishing_aspect: |
          Conserved quantity: Driver.cycle_on_duty_minutes. Appending an ON_DUTY interval then
          compensating by marking it INACTIVE_ERROR MUST return cycle_on_duty_minutes to its
          pre-append value exactly (formula: cycle = sum of ACTIVE on-duty interval minutes); no drift.
        test_recipe:
          setup:
            - "Driver D has cycle_on_duty_minutes == 0 (no events). Append ON_DUTY 06:00 then DRIVING 06:30 (closes 30 on-duty min), making cycle 30."
            - "Then mark the ON_DUTY event INACTIVE_ERROR; the DRIVING event becomes the open event again (its prior interval source removed)."
          setup_api_calls:
            - call: "POST /eld/vehicles"
              payload: { unit_number: "U17", vin: "VINQQQ17" }
              as: CarrierAdmin
              captures: { veh_id: $.data.id }
            - call: "POST /eld/devices"
              payload: { serial_number: "S17", vehicle_id: "${veh_id}" }
              as: CarrierAdmin
              captures: { dev_id: $.data.id }
            - call: "POST /eld/drivers"
              payload: { license_number: "CDL-Q17", full_name: "Driver Q", home_terminal_tz_offset_minutes: 0 }
              as: CarrierAdmin
              captures: { d_id: $.data.id, d_v0: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T12:00:00Z" }
              as: CarrierAdmin
            - call: "POST /eld/devices/${dev_id}/login"
              payload: {}
              as: Driver
              as_user_id: "${d_id}"
            - call: "POST /eld/duty-events"
              payload: { driver_id: "${d_id}", device_id: "${dev_id}", duty_status: "ON_DUTY_NOT_DRIVING", event_time: "2026-06-01T06:00:00Z", expected_driver_version: "${d_v0}" }
              as: Driver
              as_user_id: "${d_id}"
              captures: { onduty_evt_id: $.data.id }
            - call: "GET /eld/drivers/${d_id}"
              payload: {}
              as: CarrierAdmin
              captures: { d_v1: $.data.version }
            - call: "POST /eld/duty-events"
              payload: { driver_id: "${d_id}", device_id: "${dev_id}", duty_status: "DRIVING", event_time: "2026-06-01T06:30:00Z", expected_driver_version: "${d_v1}" }
              as: Driver
              as_user_id: "${d_id}"
            - call: "GET /eld/duty-events/${onduty_evt_id}"
              payload: {}
              as: CarrierAdmin
              captures: { onduty_v: $.data.version }
            - call: "GET /eld/drivers/${d_id}"
              payload: {}
              as: CarrierAdmin
              captures: { cycle_mid: $.data.cycle_on_duty_minutes }
          trigger:
            - call: "POST /eld/duty-events/${onduty_evt_id}/mark-error"
              payload: { expected_dutystatusevent_version: "${onduty_v}" }
              as: CarrierAdmin
            - call: "GET /eld/drivers/${d_id}"
              payload: {}
              as: CarrierAdmin
          assert:
            - "Before mark-error: Driver.${d_id}.cycle_on_duty_minutes == 30."
            - "After mark-error: Driver.${d_id}.cycle_on_duty_minutes == 0 (restored to pre-append value; no drift)."
      - name: correction_conserves_total_logged_minutes_invariant
        grounds:
          - state_machines.DutyStatusEvent.ACTIVE_to_INACTIVE_CHANGED
          - calculations.hos_clocks
          - entities.DailyLog.fields.total_on_duty_minutes
        distinguishing_aspect: |
          A DIFFERENT conserved quantity: the DailyLog accounting identity
          total_on_duty_minutes + total_off_duty_minutes == elapsed-closed-interval minutes for the day.
          A correction that supersedes the day's closing event MUST leave this identity intact (sum of
          ACTIVE closed-interval minutes equals total elapsed of the corrected stream); no minutes leak.
        test_recipe:
          setup:
            - "Driver D one day: ON_DUTY 06:00 -> DRIVING 07:00 (60 on-duty) -> OFF_DUTY 09:00 (120 driving). Closing OFF_DUTY at 09:00 is the open event. total_on_duty=180, total_off_duty=0."
            - "Correct the DRIVING start from 07:00 to 06:30 (so on-duty 30, driving 150); the accounting identity total_on_duty+total_off_duty over closed intervals stays 180."
          setup_api_calls:
            - call: "POST /eld/vehicles"
              payload: { unit_number: "U18", vin: "VINRRR18" }
              as: CarrierAdmin
              captures: { veh_id: $.data.id }
            - call: "POST /eld/devices"
              payload: { serial_number: "S18", vehicle_id: "${veh_id}" }
              as: CarrierAdmin
              captures: { dev_id: $.data.id }
            - call: "POST /eld/drivers"
              payload: { license_number: "CDL-R18", full_name: "Driver R", home_terminal_tz_offset_minutes: 0 }
              as: CarrierAdmin
              captures: { d_id: $.data.id, d_v0: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T12:00:00Z" }
              as: CarrierAdmin
            - call: "POST /eld/devices/${dev_id}/login"
              payload: {}
              as: Driver
              as_user_id: "${d_id}"
            - call: "POST /eld/duty-events"
              payload: { driver_id: "${d_id}", device_id: "${dev_id}", duty_status: "ON_DUTY_NOT_DRIVING", event_time: "2026-06-01T06:00:00Z", expected_driver_version: "${d_v0}" }
              as: Driver
              as_user_id: "${d_id}"
            - call: "GET /eld/drivers/${d_id}"
              payload: {}
              as: CarrierAdmin
              captures: { d_v1: $.data.version }
            - call: "POST /eld/duty-events"
              payload: { driver_id: "${d_id}", device_id: "${dev_id}", duty_status: "DRIVING", event_time: "2026-06-01T07:00:00Z", expected_driver_version: "${d_v1}" }
              as: Driver
              as_user_id: "${d_id}"
              captures: { drive_evt_id: $.data.id }
            - call: "GET /eld/drivers/${d_id}"
              payload: {}
              as: CarrierAdmin
              captures: { d_v2: $.data.version }
            - call: "POST /eld/duty-events"
              payload: { driver_id: "${d_id}", device_id: "${dev_id}", duty_status: "OFF_DUTY", event_time: "2026-06-01T09:00:00Z", expected_driver_version: "${d_v2}" }
              as: Driver
              as_user_id: "${d_id}"
            - call: "POST /eld/daily-logs"
              payload: { driver_id: "${d_id}", log_date: "2026-06-01" }
              as: Driver
              as_user_id: "${d_id}"
              captures: { log_id: $.data.id }
            - call: "GET /eld/drivers/${d_id}"
              payload: {}
              as: CarrierAdmin
              captures: { d_v3: $.data.version }
          trigger:
            - call: "POST /eld/duty-events"
              payload: { driver_id: "${d_id}", device_id: "${dev_id}", duty_status: "DRIVING", event_time: "2026-06-01T06:30:00Z", edited_from_event_id: "${drive_evt_id}", annotation: "Corrected drive start.", expected_driver_version: "${d_v3}" }
              as: Driver
              as_user_id: "${d_id}"
            - call: "GET /eld/daily-logs/${log_id}"
              payload: {}
              as: CarrierAdmin
          assert:
            - "Before correction: DailyLog.${log_id}.total_on_duty_minutes == 180, total_off_duty_minutes == 0."
            - "After correction: DailyLog.${log_id}.total_on_duty_minutes == 180 (30 on-duty + 150 driving), total_off_duty_minutes == 0 — accounting identity conserved, no drift."
