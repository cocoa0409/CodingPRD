# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN — task_0131_credit_report_disputes
# Test targeting index (per SKILL.md §1.8). Every instance grounds in
# elements declared in SCAFFOLD.yaml §1.1–§1.6.
# =============================================================================

scaffold_difficulty_design:

  # ===========================================================================
  # Rule 1 — dual_variant_calc (≥2 instances on DIFFERENT entity domains)
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: fico_provisional_vs_final_on_credit_report
        grounds:
          - calculations.fico_calculation
          - calculations.fico_calculation.variants.provisional
          - calculations.fico_calculation.variants.final
          - endpoints[GET /consumers/{consumerId}/credit_reports/{creditReportId}/projected_fico]
          - state_machines.Dispute.RESULTS_PENDING_to_CLOSED_VERIFIED
        distinguishing_aspect: |
          Operates on entity domain CreditReport / TradelineItem. The
          provisional variant returned by /projected_fico assumes the in-flight
          dispute resolves favorably (treats targeted TradelineItem as DELETED
          if requested_action=DELETE_ITEM), while the final variant stored on
          CLOSED_VERIFIED uses the actual furnisher VERIFIED response (no
          change). For identical inputs, provisional fico_score = 850 and
          final fico_score = 586 — same data, two algorithms, different
          numbers.
        test_recipe:
          setup:
            - "POST /consumers -> consumer C"
            - "POST /furnishers -> furnisher F"
            - "POST /consumers/{C}/credit_reports {bureau: EQUIFAX} -> report R"
            - "POST /credit_reports/{R}/tradeline_items {furnisher_id: F, account_ref: 'A1', original_dofd_day: 0, balance_cents: 500000, payment_status: LATE_90} -> tradeline T"
            - "POST /_clock/advance {days: 10}"
            - "POST /consumers/{C}/disputes {credit_report_id: R, tradeline_item_id: T, channel: ONLINE, supporting_documents: [{kind: RECEIPT, sha256: 'aa'}], requested_action: DELETE_ITEM, requested_payload: {}} -> dispute D"
            - "POST /consumers/{C}/disputes/{D}/start_investigation"
          trigger:
            - "GET /consumers/{C}/credit_reports/{R}/projected_fico  -> provisional_score"
            - "POST /consumers/{C}/disputes/{D}/furnisher_response {response: VERIFIED, response_payload: {}}"
            - "POST /consumers/{C}/disputes/{D}/issue_result_notice  -> CLOSED_VERIFIED"
            - "GET /consumers/{C}/credit_reports/{R}  -> final_score"
          assert:
            - "provisional_score.fico_score == 850"
            - "final_score.fico_score == 586"
            - "provisional_score.fico_score != final_score.fico_score"

      - name: dispute_risk_provisional_vs_final_on_consumer
        grounds:
          - calculations.dispute_risk_score
          - calculations.dispute_risk_score.variants.provisional
          - calculations.dispute_risk_score.variants.final
          - endpoints[POST /consumers/{consumerId}/disputes]
          - endpoints[GET /consumers/{consumerId}/risk]
        distinguishing_aspect: |
          Operates on entity domain Consumer (Consumer.disputes history),
          distinct from fico_calculation's CreditReport/TradelineItem domain.
          With 3 prior CLOSED_VERIFIED disputes and no supporting_documents on
          the 4th, the provisional variant (excludes the dispute being
          submitted) yields 60 while the final variant (includes the
          committed dispute) yields 80 for the exact same caller state.
        test_recipe:
          setup:
            - "Create C, F, R, T as above; create 3 prior disputes on different tradelines that close VERIFIED (sequence: submit, start_investigation, furnisher_response VERIFIED, issue_result_notice)"
            - "POST /credit_reports/{R}/tradeline_items -> new tradeline T4 (different from prior three)"
          trigger:
            - "POST /consumers/{C}/disputes {tradeline_item_id: T4, supporting_documents: [{kind: NOTE, sha256: 'bb'}], requested_action: CORRECT_BALANCE, requested_payload: {new_balance_cents: 100}}  -> response includes provisional dispute_risk_score"
            - "GET /consumers/{C}/risk  -> final dispute_risk_score"
          assert:
            - "provisional dispute_risk_score == 50  # raw = 2*3 + 5*0 + (-1)*1 + 3*0 = 5; score = max(0, min(100, 10*5)) = 50"
            - "final dispute_risk_score == 70       # raw = 2*4 + 5*0 + (-1)*1 + 3*0 = 7; score = 70"
            - "provisional value != final value"

  # ===========================================================================
  # Rule 2 — combinatorial_formula (≥2 instances across DIFFERENT modes)
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: free_report_grant_tiered_by_freeze_status
        grounds:
          - calculations.free_report_grant_calculation
          - state_machines.Dispute.RESULTS_PENDING_to_CLOSED_UPDATED
          - state_machines.CreditFreeze.ACTIVE_to_LIFTED
        distinguishing_aspect: |
          Mode (a) — three inputs (outcome, actual_field_changed,
          has_pending_freeze) interact non-linearly via tiered-rate
          selection: an UPDATED outcome that actually changed a field
          grants tier_grant = 2 when a CreditFreeze is ACTIVE on ANY
          bureau and tier_grant = 1 otherwise. Two consumers with
          IDENTICAL disputes diverge: the one with an EXPERIAN freeze
          gets +2 (and may collide with MAX_BALANCE=12), the other +1.
        test_recipe:
          setup:
            - "Create consumer C1 (no freeze); create C2 with POST /consumers/{C2}/credit_freezes {bureau: EXPERIAN} (freeze on EXPERIAN, dispute will be on EQUIFAX so start_investigation is NOT blocked by ERR_REPORT_FROZEN)"
            - "Create F, R1 (EQUIFAX) for C1 with tradeline T1; R2 (EQUIFAX) for C2 with tradeline T2 — both LATE_90, balance 500000"
            - "Both: submit dispute (requested_action=CORRECT_BALANCE, new_balance_cents=100), start_investigation, furnisher_response UPDATED, issue_result_notice"
          trigger:
            - "GET /consumers/{C1}  -> c1_after"
            - "GET /consumers/{C2}  -> c2_after"
          assert:
            - "c1_after.free_reports_remaining == 2   # initial 1 + tier_grant(no_freeze)=1 = 2"
            - "c2_after.free_reports_remaining == 3   # initial 1 + tier_grant(has_freeze)=2 = 3"

      - name: deadline_day_pinned_evaluation_order
        grounds:
          - calculations.deadline_day_calculation
          - state_machines.Dispute.UNDER_INVESTIGATION_to_UNDER_INVESTIGATION
          - state_machines.Dispute.ESCALATED_to_UNDER_INVESTIGATION
          - entities.Dispute.fields.deadline_day
          - entities.Dispute.fields.additional_info_accepted
          - entities.FurnisherInquiry.fields.reverification_deadline_day
        distinguishing_aspect: |
          Mode (c) — circular-looking dependency between deadline_day,
          additional_info_accepted, and reverification_deadline_day with
          PINNED evaluation order. base_deadline computed first
          (submitted_day+30=130 for submitted_day=100), then extension flips
          to submitted_day+45=145 ONLY if additional_info accepted while
          clock.day <= base_deadline, then reverification_deadline_day
          is independently forwarded_day+25 (e.g., 105+25=130), and CFPB
          re-open resets deadline_day = clock.day + 30 (fresh clock).
          Without the pinned order the values are not well-defined.
        test_recipe:
          setup:
            - "Create C, F, R, T; POST /_clock/advance {days: 100}"
            - "POST /consumers/{C}/disputes {...}  -> D (submitted_day=100, deadline_day=130)"
            - "POST /consumers/{C}/disputes/{D}/start_investigation  (forwarded_day=100, reverification_deadline_day=125)"
            - "POST /_clock/advance {days: 5}  (clock.day=105)"
          trigger:
            - "POST /consumers/{C}/disputes/{D}/additional_info {supporting_documents: [{kind:'BANK', sha256:'ee'}]}  -> dispute_after_ext"
          assert:
            - "dispute_after_ext.deadline_day == 145  # submitted_day(100)+45"
            - "dispute_after_ext.additional_info_accepted == true"
            - "FurnisherInquiry.reverification_deadline_day == 125  # forwarded_day(100)+25, NOT affected by extension"

  # ===========================================================================
  # Rule 3 — non_linear_state_machine (≥2 instances on DIFFERENT entities)
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: dispute_branching_with_cycle_via_escalation
        grounds:
          - state_machines.Dispute
          - state_machines.Dispute.CLOSED_VERIFIED_to_ESCALATED
          - state_machines.Dispute.ESCALATED_to_UNDER_INVESTIGATION
          - state_machines.RegulatoryComplaint.FILED_to_UNDER_REVIEW
        distinguishing_aspect: |
          Dispute is branching+cyclic (not linear): UNDER_INVESTIGATION forks
          to {CLOSED_VERIFIED, CLOSED_UPDATED, CLOSED_DELETED, CLOSED_DISMISSED},
          and CLOSED_VERIFIED can transition back to UNDER_INVESTIGATION via
          ESCALATED on RegulatoryComplaint acceptance — a true A->B->A cycle.
        test_recipe:
          setup:
            - "Create C, F, R, T; submit dispute D; start_investigation; furnisher_response VERIFIED; issue_result_notice (D -> CLOSED_VERIFIED)"
          trigger:
            - "POST /consumers/{C}/regulatory_complaints {dispute_id: D, narrative: '...'} -> complaint K (D -> ESCALATED)"
            - "POST /regulatory_complaints/{K}/accept  (D -> UNDER_INVESTIGATION again)"
            - "GET /consumers/{C}/disputes/{D}  -> dispute_after"
          assert:
            - "dispute_after.status == 'UNDER_INVESTIGATION'"
            - "dispute_after.deadline_day == clock.day + 30  # fresh clock reset"
            - "A new FurnisherInquiry was created (count of FurnisherInquiry where dispute_id=D is 2)"

      - name: regulatory_complaint_branching_with_revert_refile
        grounds:
          - state_machines.RegulatoryComplaint
          - state_machines.RegulatoryComplaint.FILED_to_UNDER_REVIEW
          - state_machines.RegulatoryComplaint.FILED_to_REJECTED
          - entities.RegulatoryComplaint.fields.parent_complaint_id
        distinguishing_aspect: |
          RegulatoryComplaint is on a different entity than Dispute and is
          itself branching: FILED forks to {UNDER_REVIEW, REJECTED}; REJECTED
          is terminal, but a REJECTED complaint may be refiled by creating a
          new RegulatoryComplaint with parent_complaint_id pointing to the
          rejected one (self-referential cycle at the entity level).
        test_recipe:
          setup:
            - "Create C, F, R, T; submit dispute D; close it CLOSED_VERIFIED"
            - "POST /consumers/{C}/regulatory_complaints {dispute_id: D, narrative: 'v1'} -> complaint K1"
          trigger:
            - "POST /regulatory_complaints/{K1}/reject  (K1 -> REJECTED)"
            - "POST /consumers/{C}/regulatory_complaints {dispute_id: D, parent_complaint_id: K1, narrative: 'v2 refile'} -> complaint K2"
          assert:
            - "K1.status == 'REJECTED'"
            - "K2.parent_complaint_id == K1.id"
            - "K2.status == 'FILED'"

  # ===========================================================================
  # Rule 4 — transitive_cascade (≥2 instances from DIFFERENT triggers; one ≥3)
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: dispute_reopen_cascade_depth_3
        grounds:
          - state_machines.RegulatoryComplaint.FILED_to_UNDER_REVIEW
          - state_machines.Dispute.ESCALATED_to_UNDER_INVESTIGATION
          - entities.FurnisherInquiry
          - calculations.posture_calculation
        distinguishing_aspect: |
          Depth-3 cascade originating from CFPB accept: (1) accept mutates
          RegulatoryComplaint -> UNDER_REVIEW; that mutation itself triggers
          (2) Dispute -> UNDER_INVESTIGATION with fresh deadline; that
          mutation itself triggers (3) a new FurnisherInquiry row plus a
          CreditReport.posture recompute to RESTRICTED. Each link is caused
          by the PREVIOUS link, not the original CFPB action directly.
        test_recipe:
          setup:
            - "Create C, F, R, T; submit dispute D; close CLOSED_VERIFIED (so posture is OPEN); file complaint K (D -> ESCALATED, posture -> RESTRICTED)"
          trigger:
            - "POST /regulatory_complaints/{K}/accept"
          assert:
            - "complaint.status == 'UNDER_REVIEW'                  # link 1"
            - "dispute.status == 'UNDER_INVESTIGATION'              # link 2 caused by link 1"
            - "count of FurnisherInquiry where dispute_id=D == 2    # link 3 caused by link 2"
            - "credit_report.posture == 'RESTRICTED'                # caused by link 2"

      - name: result_notice_cascade_depth_3_on_close
        grounds:
          - state_machines.Dispute.RESULTS_PENDING_to_CLOSED_DELETED
          - calculations.fico_calculation
          - calculations.free_report_grant_calculation
          - calculations.posture_calculation
          - entities.TradelineItem.fields.payment_status
        distinguishing_aspect: |
          Depth-3 cascade originating from issue_result_notice on a DELETED
          outcome (different triggering transition than the CFPB cascade):
          (1) Dispute -> CLOSED_DELETED mutates TradelineItem.payment_status
          to DELETED; (2) that TradelineItem mutation itself triggers
          fico_calculation recompute on CreditReport (CreditReport.fico_score
          changes); (3) the CreditReport change itself triggers posture
          recompute (no remaining active disputes -> OPEN), plus
          free_report_grant_calculation bumps Consumer.free_reports_remaining.
        test_recipe:
          setup:
            - "Create C, F, R; create one tradeline T with LATE_90, balance 500000; submit dispute D (DELETE_ITEM); start_investigation; furnisher_response DELETED"
          trigger:
            - "POST /consumers/{C}/disputes/{D}/issue_result_notice"
          assert:
            - "dispute.status == 'CLOSED_DELETED'                   # link 1"
            - "tradeline_item.payment_status == 'DELETED'           # link 1 effect"
            - "credit_report.fico_score == 850                      # link 2: empty T after exclusion"
            - "credit_report.posture == 'OPEN'                      # link 3 caused by link 2 (no disputes left)"
            - "consumer.free_reports_remaining == 2                 # link 3: 1 + 1 grant"

  # ===========================================================================
  # Rule 5 — priority_pair_validation_conflict (≥2 instances on DIFFERENT pairs)
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: state_vs_business_safety_reage_at_issue
        grounds:
          - validations[priority=5]   # ERR_INVALID_STATE_TRANSITION
          - validations[priority=7]   # ERR_REAGE_PROHIBITED
          - state_machines.Dispute.RESULTS_PENDING_to_CLOSED_UPDATED
        distinguishing_aspect: |
          Error-category pair: state (priority 5) vs business_safety
          (priority 7). When a Dispute is already CLOSED_VERIFIED AND the
          bureau attempts issue_result_notice with a reage-violating
          requested_action=CORRECT_DOFD payload, both checks would fire; the
          state check wins because priority 5 < 7. Returned error_id MUST be
          ERR_INVALID_STATE_TRANSITION, not ERR_REAGE_PROHIBITED.
        test_recipe:
          setup:
            - "Create C, F, R, T (original_dofd_day=100); submit D with requested_action=CORRECT_DOFD, requested_payload={new_dofd_day: 200}; start_investigation; furnisher_response VERIFIED; issue_result_notice (D -> CLOSED_VERIFIED)"
          trigger:
            - "POST /consumers/{C}/disputes/{D}/issue_result_notice  (second call)"
          assert:
            - "response.status == 409"
            - "response.body.data.error_id == 'ERR_INVALID_STATE_TRANSITION'"

      - name: business_temporal_vs_business_constraint_on_additional_info
        grounds:
          - validations[priority=9]   # ERR_DISPUTE_DEADLINE_PASSED (business_temporal)
          - validations[priority=12]  # ERR_FRIVOLOUS_DISPUTE (business_constraint)
          - state_machines.Dispute.UNDER_INVESTIGATION_to_UNDER_INVESTIGATION
        distinguishing_aspect: |
          Different error-category pair than the first instance:
          business_temporal (priority 9) vs business_constraint (priority 12).
          A consumer attempts a 4th additional_info AFTER deadline_day on a
          dispute whose tradeline_item already has 3 prior disputes in 365
          days. Both deadline-passed and frivolous would apply; temporal
          wins because priority 9 < 12.
        test_recipe:
          setup:
            - "Create C, F, R, T; submit 3 prior disputes on T that close (dismissed or verified); submit a 4th dispute D with no extension; start_investigation; POST /_clock/advance {days: 35} (now past deadline=30)"
          trigger:
            - "POST /consumers/{C}/disputes/{D}/additional_info {supporting_documents: [{kind:'A', sha256:'cc'}]}"
          assert:
            - "response.status == 409"
            - "response.body.data.error_id == 'ERR_DISPUTE_DEADLINE_PASSED'"

  # ===========================================================================
  # Rule 6 — boundary_precision_check (≥2 instances; DIFFERENT metrics/endpoints)
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: furnisher_deadline_boundary_inclusive_day_25
        grounds:
          - calculations.deadline_day_calculation
          - validations[priority=10]   # ERR_FURNISHER_LATE
          - entities.FurnisherInquiry.fields.reverification_deadline_day
          - endpoints[POST /consumers/{consumerId}/disputes/{disputeId}/furnisher_response]
        distinguishing_aspect: |
          Numeric threshold boundary on the furnisher reverification window,
          reached via POST .../furnisher_response. forwarded_day=0 →
          reverification_deadline_day=25. Operator response at clock.day=25
          MUST succeed (<= boundary, inclusive); at clock.day=26 MUST fail
          with ERR_FURNISHER_LATE. Tests the >= vs > distinction precisely.
        test_recipe:
          setup:
            - "Create C, F, R, T; submit D; start_investigation at clock.day=0 (forwarded_day=0, reverification_deadline_day=25)"
            - "POST /_clock/advance {days: 25} (clock.day=25)"
          trigger:
            - "POST /consumers/{C}/disputes/{D}/furnisher_response {response: VERIFIED, response_payload: {}}  -> resp_at_boundary"
            - "Create D2 (a second dispute on T2 with same pattern); start_investigation at clock.day=25 (forwarded_day=25, deadline=50)"
            - "POST /_clock/advance {days: 26}  (clock.day=51)"
            - "POST /consumers/{C}/disputes/{D2}/furnisher_response {response: VERIFIED, response_payload: {}}  -> resp_after_boundary"
          assert:
            - "resp_at_boundary.status == 200"
            - "resp_after_boundary.status == 409"
            - "resp_after_boundary.body.data.error_id == 'ERR_FURNISHER_LATE'"

      - name: empty_supporting_documents_boundary
        grounds:
          - validations[priority=11]   # ERR_NO_SUPPORTING_DOCUMENTS
          - entities.Dispute.fields.supporting_documents
          - endpoints[POST /consumers/{consumerId}/disputes]
        distinguishing_aspect: |
          Empty-collection boundary on a different metric (array length)
          reachable through a different endpoint (POST .../disputes, not
          POST .../furnisher_response). supporting_documents.length == 0
          MUST trigger ERR_NO_SUPPORTING_DOCUMENTS at submission;
          supporting_documents.length == 1 MUST pass — boundary at len>0.
        test_recipe:
          setup:
            - "Create C, F, R, T"
          trigger:
            - "POST /consumers/{C}/disputes {credit_report_id: R, tradeline_item_id: T, channel: ONLINE, supporting_documents: [], requested_action: CORRECT_BALANCE, requested_payload: {new_balance_cents: 100}}  -> resp_empty"
            - "POST /consumers/{C}/disputes {credit_report_id: R, tradeline_item_id: T, channel: ONLINE, supporting_documents: [{kind: 'A', sha256: 'dd'}], requested_action: CORRECT_BALANCE, requested_payload: {new_balance_cents: 100}}  -> resp_one"
          assert:
            - "resp_empty.status == 422"
            - "resp_empty.body.data.error_id == 'ERR_NO_SUPPORTING_DOCUMENTS'"
            - "resp_one.status == 201"

  # ===========================================================================
  # Rule 7 — cross_entity_state_dependency (≥2 across DIFFERENT entity pairs)
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: dispute_start_requires_credit_report_not_frozen
        grounds:
          - validations[priority=6]   # ERR_REPORT_FROZEN
          - state_machines.Dispute.RECEIVED_to_UNDER_INVESTIGATION
          - state_machines.CreditFreeze.ACTIVE_to_LIFTED
          - calculations.posture_calculation
        distinguishing_aspect: |
          Cross-entity pair Dispute -> CreditReport (posture). Dispute's
          RECEIVED -> UNDER_INVESTIGATION transition is gated by
          CreditReport.posture != FROZEN, which is itself driven by sibling
          CreditFreeze.status. The pair is (Dispute, CreditReport via
          CreditFreeze).
        test_recipe:
          setup:
            - "Create C, F, R, T; POST /consumers/{C}/credit_freezes {bureau: EQUIFAX} -> freeze G (posture=FROZEN)"
            - "POST /consumers/{C}/disputes {...} -> D (RECEIVED)"
          trigger:
            - "POST /consumers/{C}/disputes/{D}/start_investigation  -> resp_blocked"
            - "POST /consumers/{C}/credit_freezes/{G}/lift {pin: <consumer.freeze_pin>}"
            - "POST /consumers/{C}/disputes/{D}/start_investigation  -> resp_after_lift"
          assert:
            - "resp_blocked.status == 409"
            - "resp_blocked.body.data.error_id == 'ERR_REPORT_FROZEN'"
            - "resp_after_lift.status == 200"

      - name: complaint_resolve_requires_dispute_reclosed
        grounds:
          - validations[priority=5]
          - state_machines.RegulatoryComplaint.UNDER_REVIEW_to_RESOLVED
          - state_machines.Dispute
        distinguishing_aspect: |
          Different entity pair: RegulatoryComplaint -> Dispute. Complaint's
          UNDER_REVIEW -> RESOLVED requires Dispute.status to be back in
          {CLOSED_VERIFIED, CLOSED_UPDATED, CLOSED_DELETED, CLOSED_DISMISSED}.
          If the dispute is still UNDER_INVESTIGATION after CFPB accept,
          resolve MUST fail with ERR_DISPUTE_NOT_RECLOSED.
        test_recipe:
          setup:
            - "Create C, F, R, T; D -> CLOSED_VERIFIED; file complaint K; accept K (D -> UNDER_INVESTIGATION)"
          trigger:
            - "POST /regulatory_complaints/{K}/resolve  -> resp_blocked"
            - "POST /consumers/{C}/disputes/{D}/furnisher_response {response: VERIFIED, response_payload: {}}"
            - "POST /consumers/{C}/disputes/{D}/issue_result_notice  (D -> CLOSED_VERIFIED)"
            - "POST /regulatory_complaints/{K}/resolve  -> resp_after"
          assert:
            - "resp_blocked.status == 409"
            - "resp_blocked.body.data.error_id == 'ERR_DISPUTE_NOT_RECLOSED'"
            - "resp_after.status == 200"

  # ===========================================================================
  # Rule 8 — resource_temporal_overlap (≥2 instances; DIFFERENT interval semantics)
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: active_dispute_window_per_tradeline_open_ended_until_terminal
        grounds:
          - validations[priority=13]   # ERR_DUPLICATE_ACTIVE_DISPUTE
          - concurrency_rules[duplicate_active_dispute]
          - entities.Dispute.fields.status
        distinguishing_aspect: |
          Interval semantics: open-ended occupation of TradelineItem by a
          non-terminal Dispute (interval is [submitted_day, +infinity) until
          status enters CLOSED_*). Adjacency is forbidden during the open
          interval. A second dispute on the SAME (consumer, tradeline_item)
          while a non-terminal one exists MUST fail. After the first dispute
          closes, a new one is allowed immediately (no buffer).
        test_recipe:
          setup:
            - "Create C, F, R, T; submit D1 (RECEIVED)"
          trigger:
            - "POST /consumers/{C}/disputes {credit_report_id: R, tradeline_item_id: T, channel: ONLINE, supporting_documents: [{kind: 'X', sha256: 'ee'}], requested_action: CORRECT_BALANCE, requested_payload: {new_balance_cents: 1}}  -> resp_dup"
            - "Close D1 to CLOSED_VERIFIED via the normal pipeline"
            - "POST /consumers/{C}/disputes {... same tradeline T ...}  -> resp_after_close"
          assert:
            - "resp_dup.status == 409"
            - "resp_dup.body.data.error_id == 'ERR_DUPLICATE_ACTIVE_DISPUTE'"
            - "resp_after_close.status == 201  # no buffer required after CLOSED_*"

      - name: freeze_uniqueness_aggregate_capacity_per_bureau
        grounds:
          - validations[priority=18]   # ERR_FREEZE_ALREADY_ACTIVE
          - concurrency_rules[freeze_already_active]
          - entities.CreditFreeze.fields.status
        distinguishing_aspect: |
          DIFFERENT interval semantics on a DIFFERENT resource entity
          (CreditFreeze, not Dispute): aggregate capacity of exactly 1 ACTIVE
          row per (consumer_id, bureau). Unlike Dispute's open-ended-until-
          terminal interval, CreditFreeze is a hard capacity constraint:
          even after LIFTED, only the most-recent unfettered slot counts.
          Placing a second freeze on EXPERIAN while EQUIFAX is frozen MUST
          succeed (different bureau partition), but two on the same bureau
          MUST fail.
        test_recipe:
          setup:
            - "Create C; POST /consumers/{C}/credit_freezes {bureau: EQUIFAX} -> G1"
          trigger:
            - "POST /consumers/{C}/credit_freezes {bureau: EQUIFAX}  -> resp_dup_same_bureau"
            - "POST /consumers/{C}/credit_freezes {bureau: EXPERIAN}  -> resp_other_bureau"
          assert:
            - "resp_dup_same_bureau.status == 409"
            - "resp_dup_same_bureau.body.data.error_id == 'ERR_FREEZE_ALREADY_ACTIVE'"
            - "resp_other_bureau.status == 201  # partition by bureau, no overlap"

  # ===========================================================================
  # Rule 9 — compensating_invariant (≥2 instances; DIFFERENT conserved quantities)
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: posture_invariant_after_freeze_lift_round_trip
        grounds:
          - state_machines.CreditFreeze.ACTIVE_to_LIFTED
          - calculations.posture_calculation
          - entities.CreditReport.fields.posture
        distinguishing_aspect: |
          Conserved quantity: CreditReport.posture under the global formula
          posture = FROZEN if active_freezes>0 else (RESTRICTED if
          active_disputes>=1 else OPEN). The forward action POST
          /credit_freezes drives posture to FROZEN; the compensating action
          POST /credit_freezes/{id}/lift drives it back. With no active
          disputes, posture before and after the round trip MUST be the
          same value (OPEN).
        test_recipe:
          setup:
            - "Create C, R (posture=OPEN); place freeze G; assert posture=FROZEN"
          trigger:
            - "POST /consumers/{C}/credit_freezes/{G}/lift {pin: <consumer.freeze_pin>}"
            - "GET /consumers/{C}/credit_reports/{R}  -> report_after"
          assert:
            - "report_after.posture == 'OPEN'  # equal to pre-forward posture"

      - name: free_reports_invariant_on_pull_then_grant
        grounds:
          - calculations.free_report_grant_calculation
          - endpoints[POST /consumers/{consumerId}/credit_reports/{creditReportId}/pull_free]
          - state_machines.Dispute.RESULTS_PENDING_to_CLOSED_UPDATED
          - entities.Consumer.fields.free_reports_remaining
        distinguishing_aspect: |
          DIFFERENT conserved quantity (Consumer.free_reports_remaining,
          not CreditReport.posture). The forward action pull_free decrements
          the counter by 1; the compensating action is a CLOSED_UPDATED
          dispute outcome which grants +1. With initial=1, pull then grant
          MUST leave the counter equal to its initial value (1), assuming
          no cap collision (1+1=2, cap 12; then -1 by pull = 1).
        test_recipe:
          setup:
            - "Create C (free_reports_remaining=1), F, R, T"
            - "POST /consumers/{C}/credit_reports/{R}/pull_free  (consumer.free_reports_remaining -> 0)"
          trigger:
            - "Submit D with requested_action=CORRECT_BALANCE; start_investigation; furnisher_response UPDATED with new_balance_cents=200; issue_result_notice  (D -> CLOSED_UPDATED)"
            - "GET /consumers/{C}  -> consumer_after"
          assert:
            - "consumer_after.free_reports_remaining == 1  # 0 + 1 grant = 1, equals initial value"
