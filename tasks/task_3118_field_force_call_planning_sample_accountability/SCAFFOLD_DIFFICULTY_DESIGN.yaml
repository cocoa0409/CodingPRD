  # ===========================================================================
  # Rule 4 — transitive_cascade (different triggers)
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: signature_capture_annual_cap_cascade_cancels_future_visits
        grounds:
          - state_machines.SampleDisbursement.PENDING_SIGNATURE_to_SIGNED
          - entities.Prescriber.fields.eligibility_status
          - state_machines.CallVisit.SCHEDULED_to_CANCELLED
        distinguishing_aspect: |
          Trigger = capture-signature. Depth 3: SIGNED -> Prescriber YTD hits
          annual_max -> prescriber.eligibility_status := INELIGIBLE -> all
          SCHEDULED future visits for that prescriber auto-CANCELLED. Each hop
          is caused by the previous hop, not by the original request.
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z. Rep S, ELIGIBLE prescriber H, product P with annual_max 20, per_visit_max 10."
            - "Lot with 100 units; 30 issued to S. Tier-A entry (planned 60 units), plan published."
            - "Visit V1 completed with a PENDING_SIGNATURE disbursement of 20 units; visit V2 (future, SCHEDULED) exists for the same prescriber."
          setup_api_calls:
            - call: "POST /field-force/regions"
              payload: { region_code: "FL-01", name: "Florida" }
              as: PlatformAdmin
              captures: { r_id: $.data.id }
            - call: "POST /field-force/regions/${r_id}/territories"
