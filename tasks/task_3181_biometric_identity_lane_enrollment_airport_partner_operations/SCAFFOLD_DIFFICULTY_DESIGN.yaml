          Different resource and different interval semantics than the
          padded-window rule: a Lane's DAILY window [open_time, close_time)
          has NO buffer arithmetic — membership is pure half-open containment
          on the logical clock's time-of-day. A check-in at exactly close_time
          (22:00) is rejected ERR_LANE_NOT_OPEN while one at 21:59 succeeds.
