  # ===========================================================================
  # Rule 3 — non_linear_state_machine (2 instances, different entities)
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: move_assignment_reestimate_cycle
        grounds:
          - state_machines.MoveAssignment.ESTIMATE_SUBMITTED_to_REQUESTED
          - state_machines.MoveAssignment.REQUESTED_to_SURVEY_SCHEDULED
        distinguishing_aspect: |
          MoveAssignment cycles REQUESTED -> SURVEY_SCHEDULED ->
          ESTIMATE_SUBMITTED -> REQUESTED on estimate rejection and can loop
          again to approval — a cycle on the household-goods entity, distinct
          from the ExpenseClaim resubmission cycle of the sibling instance.
        test_recipe:
          setup:
            - "Case IN_PROGRESS (MANAGER/DOMESTIC/RENTER FLAT policy); vendor ACTIVE; one MoveAssignment pushed through survey + estimate, then rejected"
          setup_api_calls:
            - call: "POST /policies"
              payload: { job_level: MANAGER, move_scope: DOMESTIC, home_ownership: RENTER, hhg_cap_cents: 500000, temp_housing_cap_cents: 300000, temp_housing_max_nights: 30, travel_cap_cents: 100000, loss_on_sale_cap_cents: 0, misc_cap_cents: 200000, home_sale_eligible: false, repayment_window_months: 24, gross_up_method: FLAT_SUPPLEMENTAL, flat_gross_up_rate: 0.22, marginal_bracket_threshold_cents: 100000, marginal_rate_low: 0.25, marginal_rate_high: 0.4, loss_basis: APPRAISED }
