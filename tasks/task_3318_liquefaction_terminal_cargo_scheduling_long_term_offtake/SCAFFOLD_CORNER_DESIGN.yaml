          assert:
            - "error_id == ERR_NOMINATION_INVALID_STATE"

      - name: error_covered_by_difficulty_design_stale_and_state
        claim_type: violation_to_error
        grounds: [errors(ERR_STALE_VERSION), errors(ERR_ADP_INVALID_STATE), errors(ERR_VESSEL_BERTH_INCOMPATIBLE)]
        excluded_because:
          difficulty_instance: state_beats_fiscal_on_adp_confirm
          rationale: "ERR_ADP_INVALID_STATE and ERR_VESSEL_BERTH_INCOMPATIBLE are asserted by Rule 5 instances; ERR_STALE_VERSION is asserted by the two OCC instances in the rbac section below."

