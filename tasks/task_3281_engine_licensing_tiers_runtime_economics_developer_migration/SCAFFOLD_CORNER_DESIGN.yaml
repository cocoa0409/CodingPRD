scaffold_corner_design:
  # ===========================================================================
  # Section: entities
  # ===========================================================================
  - section: entities
    instances:
      - name: org_creation_applies_system_defaults
        claim_type: defaults_and_computed
        grounds: [entities.DeveloperOrg]
        distinguishing_aspect: "POST /orgs initializes effective_tier_code = declared tier, trust_score = 80, org_standing = GOOD, balance_due_cents = 0, migration_status = NONE; client-supplied computed fields are ignored."
        test_recipe:
          setup: ["PERSONAL tier config exists"]
          setup_api_calls:
            - call: "POST /tiers"
              payload: { tier_code: "PERSONAL", revenue_ceiling_cents: 20000000, funding_ceiling_cents: 20000000, seat_minimum: 0, seat_overage_cents: 0, runtime_fee_exempt: true, export_module_allowed: false, marketplace_sell_allowed: false }
              as: PlatformAdmin
          trigger:
            - call: "POST /orgs"
              payload: { legal_name: "Defaults Co", contact_email: "d@x.com", declared_tier_code: "PERSONAL" }
              as: PlatformAdmin
              captures: { org_id: $.data.id }
          assert:
            - "DeveloperOrg.${org_id}.trust_score == 80"
            - "DeveloperOrg.${org_id}.org_standing == GOOD"
            - "DeveloperOrg.${org_id}.effective_tier_code == PERSONAL"
            - "DeveloperOrg.${org_id}.migration_status == NONE"
            - "DeveloperOrg.${org_id}.balance_due_cents == 0"

      - name: revenue_declaration_immutable_no_version_field
        claim_type: immutability
        grounds: [entities.RevenueDeclaration]
        distinguishing_aspect: "RevenueDeclaration has common_fields: false — responses carry id and created_at only; no update endpoint exists in §1.5 and no version field is exposed."
        test_recipe:
          setup: ["Org exists"]
          setup_api_calls:
            - call: "POST /tiers"
              payload: { tier_code: "PERSONAL", revenue_ceiling_cents: 20000000, funding_ceiling_cents: 20000000, seat_minimum: 0, seat_overage_cents: 0, runtime_fee_exempt: true, export_module_allowed: false, marketplace_sell_allowed: false }
              as: PlatformAdmin
            - call: "POST /orgs"
              payload: { legal_name: "Imm Co", contact_email: "i@x.com", declared_tier_code: "PERSONAL" }
              as: PlatformAdmin
              captures: { org_id: $.data.id }
          trigger:
            - call: "POST /orgs/${org_id}/revenue-declarations"
              payload: { period_month: "2026-01", gross_revenue_cents: 1000000, funding_received_cents: 0 }
              as: OrgOwner
              as_user_id: "${org_id}"
              captures: { decl_id: $.data.id }
          assert:
            - "response contains id and created_at but no version and no updated_at"
            - "no PUT/PATCH endpoint exists for revenue-declarations (404 on update attempts is out of surface scope; absence from §1.5 is the claim)"

      - name: duplicate_declaration_period_rejected
        claim_type: type_constraints
        grounds:
          - "validations[priority=13]"
          - "errors[ERR_DUPLICATE_PERIOD]"
        distinguishing_aspect: "A second RevenueDeclaration for the same org+period_month is rejected with ERR_DUPLICATE_PERIOD; a different month succeeds."
        test_recipe:
          setup: ["Org exists with a declaration for 2026-01"]
          setup_api_calls:
            - call: "POST /tiers"
              payload: { tier_code: "PERSONAL", revenue_ceiling_cents: 20000000, funding_ceiling_cents: 20000000, seat_minimum: 0, seat_overage_cents: 0, runtime_fee_exempt: true, export_module_allowed: false, marketplace_sell_allowed: false }
              as: PlatformAdmin
            - call: "POST /orgs"
              payload: { legal_name: "Dup Co", contact_email: "du@x.com", declared_tier_code: "PERSONAL" }
              as: PlatformAdmin
              captures: { org_id: $.data.id }
            - call: "POST /orgs/${org_id}/revenue-declarations"
              payload: { period_month: "2026-01", gross_revenue_cents: 1000000, funding_received_cents: 0 }
              as: OrgOwner
              as_user_id: "${org_id}"
          trigger:
            - call: "POST /orgs/${org_id}/revenue-declarations"
              payload: { period_month: "2026-01", gross_revenue_cents: 2000000, funding_received_cents: 0 }
              as: OrgOwner
              as_user_id: "${org_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_DUPLICATE_PERIOD"

      - name: listing_pagination_envelope
        claim_type: listing
        grounds: [response_envelope]
        distinguishing_aspect: "GET /orgs/{id}/revenue-declarations returns the fixed pagination envelope fields limit/offset/total_count/has_more with defaults limit=10 offset=0."
        test_recipe:
          setup: ["Org with 1 declaration"]
          setup_api_calls:
            - call: "POST /tiers"
              payload: { tier_code: "PERSONAL", revenue_ceiling_cents: 20000000, funding_ceiling_cents: 20000000, seat_minimum: 0, seat_overage_cents: 0, runtime_fee_exempt: true, export_module_allowed: false, marketplace_sell_allowed: false }
              as: PlatformAdmin
            - call: "POST /orgs"
              payload: { legal_name: "Page Co", contact_email: "pg@x.com", declared_tier_code: "PERSONAL" }
              as: PlatformAdmin
              captures: { org_id: $.data.id }
            - call: "POST /orgs/${org_id}/revenue-declarations"
              payload: { period_month: "2026-01", gross_revenue_cents: 1000000, funding_received_cents: 0 }
              as: OrgOwner
              as_user_id: "${org_id}"
          trigger:
            - call: "GET /orgs/${org_id}/revenue-declarations"
              payload: {}
              as: OrgOwner
              as_user_id: "${org_id}"
          assert:
            - "response envelope carries limit == 10, offset == 0, total_count == 1, has_more == false"
            - "meta.api_request_id and meta.api_request_timestamp present"

      - name: get_missing_project_returns_not_found
        claim_type: not_found
        grounds:
          - "validations[priority=4]"
          - "errors[ERR_NOT_FOUND]"
        distinguishing_aspect: "GET /projects/{random-uuid} returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["none"]
          setup_api_calls: []
          trigger:
            - call: "GET /projects/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_NOT_FOUND with http 404"

  # ===========================================================================
  # Section: state_machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: review_accept_from_draft_returns_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.InstallReport]
        distinguishing_aspect: "POST /install-reports/{id}/review on a DRAFT report (never submitted) is an invalid from-state: ERR_INVALID_STATE, no invoice touched."
        test_recipe:
          setup: ["PRO org, SHIPPED project, one DRAFT report"]
          setup_api_calls:
            - call: "POST /tiers"
              payload: { tier_code: "PERSONAL", revenue_ceiling_cents: 20000000, funding_ceiling_cents: 20000000, seat_minimum: 0, seat_overage_cents: 0, runtime_fee_exempt: true, export_module_allowed: false, marketplace_sell_allowed: false }
              as: PlatformAdmin
            - call: "POST /tiers"
              payload: { tier_code: "PRO", revenue_ceiling_cents: 100000000, funding_ceiling_cents: 100000000, seat_minimum: 2, seat_overage_cents: 25000, runtime_fee_exempt: false, export_module_allowed: true, marketplace_sell_allowed: true }
              as: PlatformAdmin
            - call: "POST /orgs"
              payload: { legal_name: "Draft Co", contact_email: "dr@x.com", declared_tier_code: "PRO" }
              as: PlatformAdmin
              captures: { org_id: $.data.id }
            - call: "POST /editor-versions"
              payload: { version_string: "2022.3.20f1", major_line: "2022.3", released_on: "2025-09-01" }
              as: PlatformAdmin
              captures: { ev_id: $.data.id }
            - call: "POST /orgs/${org_id}/projects"
              payload: { title: "Game D", editor_version_id: "${ev_id}" }
              as: OrgOwner
              as_user_id: "${org_id}"
              captures: { proj_id: $.data.id, proj_v: $.data.version }
            - call: "POST /projects/${proj_id}/ship"
              payload: {}
              as: OrgOwner
              as_user_id: "${org_id}"
            - call: "POST /projects/${proj_id}/install-reports"
              payload: { period_month: "2026-01", new_device_installs: 10, reinstalls: 0, bundle_installs: 0, expected_project_version: "${proj_v}" }
              as: OrgOwner
              as_user_id: "${org_id}"
              captures: { rep_id: $.data.id }
          trigger:
            - call: "POST /install-reports/${rep_id}/review"
              payload: { action: "ACCEPT" }
              as: ReviewBoard
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE"
            - "InstallReport.${rep_id}.report_status == DRAFT (unchanged)"

      - name: terminal_sunset_lockdown_no_further_transitions
        claim_type: terminal_lockdown
        grounds: [state_machines.EditorVersion]
        distinguishing_aspect: "An EditorVersion in SUNSET rejects any further transition with ERR_INVALID_STATE; terminal states are absorbing."
        test_recipe:
          setup: ["Editor version released 2023-01-01, walked SUPPORTED->DEPRECATED (release >24 months old) ->SUNSET (needs LTS path: use SUPPORTED->LTS->DEPRECATED->SUNSET with window in past)"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /editor-versions"
              payload: { version_string: "2021.3.1f1", major_line: "2021.3", released_on: "2023-01-01" }
              as: PlatformAdmin
              captures: { ev_id: $.data.id }
            - call: "POST /editor-versions/${ev_id}/transition"
              payload: { target_status: "LTS", lts_window_start: "2023-06-01", lts_window_end: "2024-06-01" }
              as: PlatformAdmin
            - call: "POST /editor-versions/${ev_id}/transition"
              payload: { target_status: "DEPRECATED" }
              as: PlatformAdmin
            - call: "POST /editor-versions/${ev_id}/transition"
              payload: { target_status: "SUNSET" }
              as: PlatformAdmin
          trigger:
            - call: "POST /editor-versions/${ev_id}/transition"
              payload: { target_status: "LTS", lts_window_start: "2026-01-01", lts_window_end: "2027-01-01" }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_INVALID_STATE"
            - "EditorVersion.${ev_id}.support_status == SUNSET"

      - name: sunset_cascade_freezes_shipped_projects
        claim_type: side_effect_execution
        grounds: [state_machines.EditorVersion.DEPRECATED_to_SUNSET, state_machines.GameProject]
        distinguishing_aspect: "Transitioning the pinned editor version to SUNSET auto-transitions SHIPPED projects to FROZEN; subsequent install-report creation fails with ERR_PROJECT_FROZEN."
        test_recipe:
          setup: ["PRO org with SHIPPED project pinned to an editor version about to be SUNSET"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /tiers"
              payload: { tier_code: "PERSONAL", revenue_ceiling_cents: 20000000, funding_ceiling_cents: 20000000, seat_minimum: 0, seat_overage_cents: 0, runtime_fee_exempt: true, export_module_allowed: false, marketplace_sell_allowed: false }
              as: PlatformAdmin
            - call: "POST /tiers"
              payload: { tier_code: "PRO", revenue_ceiling_cents: 100000000, funding_ceiling_cents: 100000000, seat_minimum: 2, seat_overage_cents: 25000, runtime_fee_exempt: false, export_module_allowed: true, marketplace_sell_allowed: true }
              as: PlatformAdmin
            - call: "POST /orgs"
              payload: { legal_name: "Sunset Co", contact_email: "su@x.com", declared_tier_code: "PRO" }
              as: PlatformAdmin
              captures: { org_id: $.data.id }
            - call: "POST /editor-versions"
              payload: { version_string: "2020.3.1f1", major_line: "2020.3", released_on: "2022-01-01" }
              as: PlatformAdmin
              captures: { ev_id: $.data.id }
            - call: "POST /orgs/${org_id}/projects"
              payload: { title: "Game S", editor_version_id: "${ev_id}" }
              as: OrgOwner
              as_user_id: "${org_id}"
              captures: { proj_id: $.data.id, proj_v: $.data.version }
            - call: "POST /projects/${proj_id}/ship"
              payload: {}
              as: OrgOwner
              as_user_id: "${org_id}"
            - call: "POST /editor-versions/${ev_id}/transition"
              payload: { target_status: "LTS", lts_window_start: "2022-06-01", lts_window_end: "2023-06-01" }
              as: PlatformAdmin
            - call: "POST /editor-versions/${ev_id}/transition"
              payload: { target_status: "DEPRECATED" }
              as: PlatformAdmin
          trigger:
            - call: "POST /editor-versions/${ev_id}/transition"
              payload: { target_status: "SUNSET" }
              as: PlatformAdmin
            - call: "GET /projects/${proj_id}"
              payload: {}
              as: OrgOwner
              as_user_id: "${org_id}"
              captures: { proj_v2: $.data.version, proj_status: $.data.project_status }
            - call: "POST /projects/${proj_id}/install-reports"
              payload: { period_month: "2026-09", new_device_installs: 5, reinstalls: 0, bundle_installs: 0, expected_project_version: "${proj_v2}" }
              as: OrgOwner
              as_user_id: "${org_id}"
              captures: { err: $.data.error_id }
          assert:
            - "proj_status == FROZEN (cascade from SUNSET)"
            - "err == ERR_PROJECT_FROZEN"

      - name: listing_delist_resubmit_cycle_increments_rounds
        claim_type: valid_transition
        grounds: [state_machines.AssetListing]
        distinguishing_aspect: "APPROVED->DELISTED->DRAFT->PENDING_REVIEW loop works and review_rounds increments on each PENDING_REVIEW entry (2 after the cycle)."
        test_recipe:
          setup: ["PRO org with an APPROVED listing (review_rounds == 1)"]
          setup_api_calls:
            - call: "POST /tiers"
              payload: { tier_code: "PERSONAL", revenue_ceiling_cents: 20000000, funding_ceiling_cents: 20000000, seat_minimum: 0, seat_overage_cents: 0, runtime_fee_exempt: true, export_module_allowed: false, marketplace_sell_allowed: false }
              as: PlatformAdmin
            - call: "POST /tiers"
              payload: { tier_code: "PRO", revenue_ceiling_cents: 100000000, funding_ceiling_cents: 100000000, seat_minimum: 2, seat_overage_cents: 25000, runtime_fee_exempt: false, export_module_allowed: true, marketplace_sell_allowed: true }
              as: PlatformAdmin
            - call: "POST /orgs"
              payload: { legal_name: "Asset Co", contact_email: "as@x.com", declared_tier_code: "PRO" }
              as: PlatformAdmin
              captures: { org_id: $.data.id }
            - call: "POST /orgs/${org_id}/asset-listings"
              payload: { title: "Shader Pack", price_cents: 100000 }
              as: OrgOwner
              as_user_id: "${org_id}"
              captures: { list_id: $.data.id }
            - call: "POST /asset-listings/${list_id}/submit-review"
              payload: {}
              as: OrgOwner
              as_user_id: "${org_id}"
            - call: "POST /asset-listings/${list_id}/review"
              payload: { action: "APPROVE" }
              as: ReviewBoard
            - call: "POST /asset-listings/${list_id}/delist"
              payload: {}
              as: OrgOwner
              as_user_id: "${org_id}"
            - call: "POST /asset-listings/${list_id}/revise"
              payload: { title: "Shader Pack v2" }
              as: OrgOwner
              as_user_id: "${org_id}"
          trigger:
            - call: "POST /asset-listings/${list_id}/submit-review"
              payload: {}
              as: OrgOwner
              as_user_id: "${org_id}"
          assert:
            - "AssetListing.${list_id}.listing_status == PENDING_REVIEW"
            - "AssetListing.${list_id}.review_rounds == 2"
            - "AssetListing.${list_id}.title == Shader Pack v2"

  # ===========================================================================
  # Section: calculations
  # ===========================================================================
  - section: calculations
    instances:
      - name: runtime_fee_crossing_split_charges_only_excess
        claim_type: correct_result
        grounds: [calculations.runtime_fee_assessment]
        distinguishing_aspect: "A report straddling the 1,000,000 threshold (lifetime 900,000 + 200,000 new = 1,100,000) charges only the 100,000 installs above the threshold: 100,000 x 20c = 2,000,000 cents."
        test_recipe:
          setup: ["PRO org, revenue gate met, SHIPPED project at lifetime 900,000 via one ACCEPTED report"]
          setup_api_calls:
            - call: "POST /tiers"
              payload: { tier_code: "PERSONAL", revenue_ceiling_cents: 20000000, funding_ceiling_cents: 20000000, seat_minimum: 0, seat_overage_cents: 0, runtime_fee_exempt: true, export_module_allowed: false, marketplace_sell_allowed: false }
              as: PlatformAdmin
            - call: "POST /tiers"
              payload: { tier_code: "PRO", revenue_ceiling_cents: 100000000, funding_ceiling_cents: 100000000, seat_minimum: 2, seat_overage_cents: 25000, runtime_fee_exempt: false, export_module_allowed: true, marketplace_sell_allowed: true }
              as: PlatformAdmin
            - call: "POST /orgs"
              payload: { legal_name: "Cross Co", contact_email: "cr@x.com", declared_tier_code: "PRO" }
              as: PlatformAdmin
              captures: { org_id: $.data.id }
            - call: "POST /orgs/${org_id}/revenue-declarations"
              payload: { period_month: "2026-01", gross_revenue_cents: 160000000, funding_received_cents: 0 }
              as: OrgOwner
              as_user_id: "${org_id}"
            - call: "POST /editor-versions"
              payload: { version_string: "2022.3.21f1", major_line: "2022.3", released_on: "2025-09-01" }
              as: PlatformAdmin
              captures: { ev_id: $.data.id }
            - call: "POST /orgs/${org_id}/projects"
              payload: { title: "Game X", editor_version_id: "${ev_id}" }
              as: OrgOwner
              as_user_id: "${org_id}"
              captures: { proj_id: $.data.id, proj_v: $.data.version }
            - call: "POST /projects/${proj_id}/ship"
              payload: {}
              as: OrgOwner
              as_user_id: "${org_id}"
            - call: "POST /projects/${proj_id}/install-reports"
              payload: { period_month: "2026-01", new_device_installs: 900000, reinstalls: 0, bundle_installs: 0, expected_project_version: "${proj_v}" }
              as: OrgOwner
              as_user_id: "${org_id}"
              captures: { rep1_id: $.data.id }
            - call: "POST /install-reports/${rep1_id}/submit"
              payload: {}
              as: OrgOwner
              as_user_id: "${org_id}"
            - call: "POST /install-reports/${rep1_id}/review"
              payload: { action: "ACCEPT" }
              as: ReviewBoard
            - call: "GET /projects/${proj_id}"
              payload: {}
              as: OrgOwner
              as_user_id: "${org_id}"
              captures: { proj_v2: $.data.version }
          trigger:
            - call: "POST /projects/${proj_id}/install-reports"
              payload: { period_month: "2026-02", new_device_installs: 200000, reinstalls: 0, bundle_installs: 0, expected_project_version: "${proj_v2}" }
              as: OrgOwner
              as_user_id: "${org_id}"
              captures: { rep2_id: $.data.id }
            - call: "POST /install-reports/${rep2_id}/submit"
              payload: {}
              as: OrgOwner
              as_user_id: "${org_id}"
          assert:
            - "the PROVISIONAL invoice for ${rep2_id} has provisional_amount_cents == 2000000 (only the 100,000 installs above the threshold are chargeable, all in the 20c low band)"

      - name: reinstalls_and_bundle_installs_excluded_from_billable
        claim_type: input_set_filtering
        grounds: [calculations.runtime_fee_assessment, entities.InstallReport.fields.billable_installs]
        distinguishing_aspect: "billable_installs counts only new_device_installs; reinstalls and bundle_installs are excluded from both the fee base and lifetime_installs."
        test_recipe:
          setup: ["PRO org, revenue gate met, SHIPPED project"]
          setup_api_calls:
            - call: "POST /tiers"
              payload: { tier_code: "PERSONAL", revenue_ceiling_cents: 20000000, funding_ceiling_cents: 20000000, seat_minimum: 0, seat_overage_cents: 0, runtime_fee_exempt: true, export_module_allowed: false, marketplace_sell_allowed: false }
              as: PlatformAdmin
            - call: "POST /tiers"
              payload: { tier_code: "PRO", revenue_ceiling_cents: 100000000, funding_ceiling_cents: 100000000, seat_minimum: 2, seat_overage_cents: 25000, runtime_fee_exempt: false, export_module_allowed: true, marketplace_sell_allowed: true }
              as: PlatformAdmin
            - call: "POST /orgs"
              payload: { legal_name: "Filter Co", contact_email: "f@x.com", declared_tier_code: "PRO" }
              as: PlatformAdmin
              captures: { org_id: $.data.id }
            - call: "POST /orgs/${org_id}/revenue-declarations"
              payload: { period_month: "2026-01", gross_revenue_cents: 160000000, funding_received_cents: 0 }
              as: OrgOwner
              as_user_id: "${org_id}"
            - call: "POST /editor-versions"
              payload: { version_string: "2022.3.22f1", major_line: "2022.3", released_on: "2025-09-01" }
              as: PlatformAdmin
              captures: { ev_id: $.data.id }
            - call: "POST /orgs/${org_id}/projects"
              payload: { title: "Game F", editor_version_id: "${ev_id}" }
              as: OrgOwner
              as_user_id: "${org_id}"
              captures: { proj_id: $.data.id, proj_v: $.data.version }
            - call: "POST /projects/${proj_id}/ship"
              payload: {}
              as: OrgOwner
              as_user_id: "${org_id}"
          trigger:
            - call: "POST /projects/${proj_id}/install-reports"
              payload: { period_month: "2026-01", new_device_installs: 100, reinstalls: 5000000, bundle_installs: 3000000, expected_project_version: "${proj_v}" }
              as: OrgOwner
              as_user_id: "${org_id}"
              captures: { rep_id: $.data.id }
            - call: "POST /install-reports/${rep_id}/submit"
              payload: {}
              as: OrgOwner
              as_user_id: "${org_id}"
            - call: "POST /install-reports/${rep_id}/review"
              payload: { action: "ACCEPT" }
              as: ReviewBoard
          assert:
            - "InstallReport.${rep_id}.billable_installs == 100"
            - "GameProject.${proj_id}.lifetime_installs == 100 (8,000,000 exempt installs do not count toward the threshold)"

      - name: creator_share_tier_boundary_average_rate
        claim_type: constants_applied
        grounds: [calculations.creator_revenue_share]
        distinguishing_aspect: "A creator below the 100,000,000-cent lifetime gross boundary pays 30% platform share on a purchase (140,000 creator share on 200,000 gross); the percentage is an average rate on the purchase, keyed on lifetime gross BEFORE this purchase."
        test_recipe:
          setup: ["Two PRO orgs: creator with APPROVED listing priced 200,000; buyer org distinct"]
          setup_api_calls:
            - call: "POST /tiers"
              payload: { tier_code: "PERSONAL", revenue_ceiling_cents: 20000000, funding_ceiling_cents: 20000000, seat_minimum: 0, seat_overage_cents: 0, runtime_fee_exempt: true, export_module_allowed: false, marketplace_sell_allowed: false }
              as: PlatformAdmin
            - call: "POST /tiers"
              payload: { tier_code: "PRO", revenue_ceiling_cents: 100000000, funding_ceiling_cents: 100000000, seat_minimum: 2, seat_overage_cents: 25000, runtime_fee_exempt: false, export_module_allowed: true, marketplace_sell_allowed: true }
              as: PlatformAdmin
            - call: "POST /orgs"
              payload: { legal_name: "Creator Co", contact_email: "c@x.com", declared_tier_code: "PRO" }
              as: PlatformAdmin
              captures: { creator_id: $.data.id }
            - call: "POST /orgs"
              payload: { legal_name: "Buyer Co", contact_email: "b@x.com", declared_tier_code: "PRO" }
              as: PlatformAdmin
              captures: { buyer_id: $.data.id }
            - call: "POST /orgs/${creator_id}/asset-listings"
              payload: { title: "Toolkit", price_cents: 200000 }
              as: OrgOwner
              as_user_id: "${creator_id}"
              captures: { list_id: $.data.id }
            - call: "POST /asset-listings/${list_id}/submit-review"
