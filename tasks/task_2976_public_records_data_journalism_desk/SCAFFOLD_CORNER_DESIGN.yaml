            - call: "POST /records-desk/analysis-runs"
              payload: { investigation_id: "${inv_id}", code_repo_ref: "git@desk/transit", code_commit_sha: "5555555555555555555555555555555555555555", container_digest: "sha256:5555555555555555555555555555555555555555555555555555555555555555", compute_cost_cents: 5000, labor_hours: 1.0, expected_investigation_version: "${inv_v1}" }
