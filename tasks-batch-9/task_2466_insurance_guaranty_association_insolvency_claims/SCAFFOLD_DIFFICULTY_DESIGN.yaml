          MemberAssessment's non-linearity is two independent state axes on one row: a partial payment
          advances billing_status to PARTIALLY_PAID while leaving recoupment_status at NOT_STARTED, and
          the subsequent surcharge filing advances recoupment_status to SURCHARGE_FILED while leaving
          billing_status at PARTIALLY_PAID and paid_amount_cents at 50000.
