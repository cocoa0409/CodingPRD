  - section: calculations
    instances:
      - name: overhead_per_line_rounding_order
        claim_type: precision
        grounds: [calculations.overhead_loading, entities.CostCharge.fields.overhead_amount_cents]
        distinguishing_aspect: "Pinned per-row rounding: three 100c LABOR charges at 2.5% each carry round_half_up(2.5)=3c overhead (total 103c each, work-order direct 309c); the forbidden sum-then-round order would give 308c."
        test_recipe:
          setup: ["CAPITAL work order authorized/started (estimate 9,000,000c); LABOR/CAPITAL overhead 2.5% from 2026-01-01; period 2026-08 open"]
