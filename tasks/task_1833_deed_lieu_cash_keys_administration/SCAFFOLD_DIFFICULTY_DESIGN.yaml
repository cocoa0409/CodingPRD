            - { call: "POST /property-solutions/cases/${case_id}/submit", as: PropertySolutionsSpecialist, as_user_id: spec_1 }
            - { call: "POST /property-solutions/cases/${case_id}/evaluate-eligibility", payload: { decision: PASS }, as: PropertySolutionsSpecialist, as_user_id: spec_1 }
            - { call: "POST /property-solutions/listings", payload: { case_id: "${case_id}", list_date: "2026-05-01", list_price_cents: 19000000 }, as: PropertySolutionsSpecialist, as_user_id: spec_1 }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ServicingAdmin }
            - { call: "POST /property-solutions/cases/${case_id}/certify-marketing", as: PropertySolutionsSpecialist, as_user_id: spec_1 }
