  - rule_id: cross_entity_state_dependency
    instances:
      - name: booking_cannot_be_confirmed_definite_while_license_is_only_issued
        grounds:
          - endpoints[POST /convention-center/bookings/{id}/confirm-definite]
          - state_machines.EventBooking.TENTATIVE_to_DEFINITE
          - state_machines.LicenseAgreement.ISSUED_to_EXECUTED
          - errors.ERR_LICENSE_STATE_INVALID
        distinguishing_aspect: |
          Entity pair EventBooking -> LicenseAgreement. The booking itself is in a perfectly
          legal source state (TENTATIVE) with a CONFIRMED first-option hold, so a
          single-entity guard would let the transition through; the blocking condition lives
          entirely on the sibling LicenseAgreement, which is ISSUED and not yet countersigned.
        test_recipe:
