          trigger:
            - { call: "POST /sales-planning/credit-events", payload: { plan_year_id: "${plan}", account_id: "${acc}", amount_cents: 5000, booking_date: "2027-06-05" }, as: SalesOpsAdmin, captures: { err: $.data.error_id } }
