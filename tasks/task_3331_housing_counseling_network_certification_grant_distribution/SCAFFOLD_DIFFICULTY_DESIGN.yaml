  - rule_id: cross_entity_state_dependency
    instances:
      - name: client_file_gated_by_counselor_certification
        grounds:
          - state_machines.ClientFile.OPEN_to_COUNSELING
          - entities.Certification.fields.certification_status
        distinguishing_aspect: |
          Pair ClientFile->Certification: begin-counseling is legal only when
          the assigned counselor holds a CERTIFIED credential in the file's
          program_area; a LAPSED certification on the same counselor flips
          the same call from success to ERR_INVALID_STATE.
        test_recipe:
          setup:
            - "CHARTERED member m1; counselor c1 CERTIFIED in RENTAL; file f1 (RENTAL) OPEN"
            - "second file f2 (RENTAL) OPEN; then c1's certification lapses via CE evaluation past deadline"
          setup_api_calls:
            - call: "POST /housing-network/members"
              payload: { legal_name: "Gate Housing", ein: "123450001", state_code: "OR", service_regions: ["41001"] }
