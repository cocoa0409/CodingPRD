  # ===========================================================================
  - section: endpoints
    instances:
      - name: hive_split_requires_strong_posture
        claim_type: conditional_action
        grounds: ["endpoints.\"POST /api/hives/{id}/split\"", entities.Hive.fields.parent_hive_id, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Split is conditional on the parent's derived posture: a WATCH hive rejects (ERR_INVALID_STATE); a THRIVING hive splits and the child carries parent_hive_id, discoverable via the filtered list."
        test_recipe:
          setup:
            - "host ACTIVE with waiver; site capacity 3; agreement ACTIVE; hive1 WATCH (verified 8/300 = 2.67), hive2 THRIVING (verified 0/300)"
          setup_api_calls:
            - { call: "POST /api/hosts", payload: { full_name: "Split Host", email: "split@x.com" }, as: Anonymous, captures: { h: $.data.id } }
            - { call: "POST /api/hosts/${h}/sign-waiver", payload: { waiver_version: "W-2026" }, as: Host, as_user_id: "${h}" }
            - { call: "POST /api/sites", payload: { host_id: "${h}", address: "19 Split St", base_capacity_hives: 3, water_source: true, setback_feet: 5 }, as: Host, as_user_id: "${h}", captures: { site: $.data.id } }
            - { call: "POST /api/agreements", payload: { host_id: "${h}", site_id: "${site}", term_start_date: "2026-01-01T00:00:00Z", term_end_date: "2026-12-31T00:00:00Z", host_share_base_bps: 2500 }, as: PlatformOps, captures: { ag: $.data.id } }
