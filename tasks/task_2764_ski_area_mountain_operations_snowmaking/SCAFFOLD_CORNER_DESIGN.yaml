  - section: state_machines
    instances:
      - name: every_entity_is_created_in_its_declared_initial_state
        claim_type: initial_state
        grounds:
          - state_machines.SnowmakingSession.SCHEDULED_to_RUNNING
          - state_machines.GroomingTask.PLANNED_to_DISPATCHED
          - state_machines.AvalancheMitigationMission.PLANNED_to_EXECUTED
          - state_machines.PatrolIncident.REPORTED_to_DISPATCHED
          - state_machines.DayPlan.DRAFT_to_PUBLISHED_PARTIAL
          - state_machines.Patroller.OFF_DUTY_to_AVAILABLE
        distinguishing_aspect: |
          Six of the ten state dimensions are created directly rather than transitioned into, and each
          one has a different initial state. The corner is that Patroller is the single entity whose
          initial state depends on an input flag: on_duty false leaves it OFF_DUTY, while on_duty true
          creates it directly in AVAILABLE (the OFF_DUTY -> AVAILABLE transition is declared as
          happening at creation). All six are asserted in one recipe so a wrong default anywhere is
          caught before any transition test runs.
        test_recipe:
          setup:
            - "A season with one inspected lift, one terrain area and one pump house exists, still in PRESEASON."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
