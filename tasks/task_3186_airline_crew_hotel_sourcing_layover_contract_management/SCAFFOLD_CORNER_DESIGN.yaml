scaffold_corner_design:
  - section: entities
    instances:
      - name: station_creation_applies_fields_and_defaults
        claim_type: creation
        grounds: [entities.Station]
        distinguishing_aspect: "POST /stations returns 201 with all input fields echoed and system fields (id, created_at, updated_at, version==1) populated."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /stations"
              payload: { code: "BUR", name: "Burbank", timezone: "America/Los_Angeles", min_rest_hours: 10, transport_time_minutes: 25, room_availability_commitment: 12 }
              as: PlatformAdmin
              captures: { st_bur: $.data.id, st_bur_v: $.data.version }
          assert:
            - "response code == 201 and Station.${st_bur}.code == 'BUR'"
            - "Station.${st_bur}.version == 1 and created_at == updated_at"
      - name: station_missing_required_field_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.Station, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Omitting required min_rest_hours from POST /stations yields ERR_INVALID_REQUEST 400."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /stations"
              payload: { code: "BUR", name: "Burbank", timezone: "America/Los_Angeles", transport_time_minutes: 25, room_availability_commitment: 12 }
              as: PlatformAdmin
              captures: { err_id: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST and http status == 400"
      - name: station_duplicate_code_rejected
        claim_type: type_constraints
        grounds: [entities.Station.fields.code, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Station.code is unique; a second POST with the same code is rejected."
        test_recipe:
          setup: ["station BUR exists"]
          setup_api_calls:
            - call: "POST /stations"
              payload: { code: "BUR", name: "Burbank", timezone: "America/Los_Angeles", min_rest_hours: 10, transport_time_minutes: 25, room_availability_commitment: 12 }
              as: PlatformAdmin
          trigger:
            - call: "POST /stations"
              payload: { code: "BUR", name: "Burbank Duplicate", timezone: "America/Los_Angeles", min_rest_hours: 11, transport_time_minutes: 30, room_availability_commitment: 5 }
              as: PlatformAdmin
              captures: { err_id: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST and http status == 400"
      - name: nonexistent_station_get_returns_not_found
        claim_type: not_found
        grounds: [entities.Station, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /stations/{id} with a well-formed but unknown UUID yields ERR_NOT_FOUND 404."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /stations/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: PlatformAdmin
              captures: { err_id: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND and http status == 404"
      - name: vendor_default_status_active
        claim_type: defaults
        grounds: [entities.HotelVendor.fields.status]
        distinguishing_aspect: "HotelVendor.status defaults to ACTIVE when not supplied (it is system-sourced)."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /hotel-vendors"
              payload: { name: "Sunport Inn", contact_email: "ops@sunport.example", security_certified: true, quiet_rooms_count: 12 }
              as: PlatformAdmin
              captures: { vend_su: $.data.id, vend_su_status: $.data.status }
          assert:
            - "HotelVendor.${vend_su}.status == ACTIVE"
      - name: layover_rest_compliant_computed_input_ignored
        claim_type: computed_fields
        grounds: [entities.CrewLayoverRequirement.fields.rest_compliant]
        distinguishing_aspect: "rest_compliant is computed; any client-supplied value is ignored and the response reflects the rest_compliance calculation."
        test_recipe:
          setup: ["station DRO (min_rest 10, transport 30) and union PILOT min_rest 10 exist"]
          setup_api_calls:
            - call: "POST /stations"
              payload: { code: "DRO", name: "Durango", timezone: "America/Denver", min_rest_hours: 10, transport_time_minutes: 30, room_availability_commitment: 10 }
              as: PlatformAdmin
              captures: { st_dro: $.data.id }
            - call: "POST /union-agreements"
              payload: { name: "APA-2026", crew_type: "PILOT", min_rest_hours: 10, quiet_room_required: false, min_room_standard: "STANDARD", blackout_protection_required: false, max_invoice_variance_pct: 10.0 }
              as: PlatformAdmin
          trigger:
            - call: "POST /layover-requirements"
              payload: { station_id: "${st_dro}", crew_type: "PILOT", crew_count: 2, arrival_time: "2026-06-02T18:00:00Z", departure_time: "2026-06-03T09:00:00Z", required_rest_hours: 12 }
              as: CrewOps
              captures: { lay_dro: $.data.id, lay_dro_ok: $.data.rest_compliant }
          assert:
            - "CrewLayoverRequirement.${lay_dro}.rest_compliant == true (computed: layover 15h - 1.0h transport = 14.0 >= 10)"
      - name: layover_invalid_crew_type_enum_rejected
        claim_type: type_constraints
        grounds: [entities.CrewLayoverRequirement.fields.crew_type, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "crew_type outside {PILOT, FLIGHT_ATTENDANT} is rejected with ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["station DRO exists"]
          setup_api_calls:
            - call: "POST /stations"
              payload: { code: "DRO", name: "Durango", timezone: "America/Denver", min_rest_hours: 10, transport_time_minutes: 30, room_availability_commitment: 10 }
              as: PlatformAdmin
              captures: { st_dro: $.data.id }
          trigger:
            - call: "POST /layover-requirements"
              payload: { station_id: "${st_dro}", crew_type: "MECHANIC", crew_count: 2, arrival_time: "2026-06-02T18:00:00Z", departure_time: "2026-06-03T09:00:00Z", required_rest_hours: 12 }
              as: CrewOps
              captures: { err_id: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST and http status == 400"
      - name: layover_list_filter_by_station_and_pagination
        claim_type: listing
        grounds: [entities.CrewLayoverRequirement, response_envelope]
        distinguishing_aspect: "GET /layover-requirements?station_id= filters to the station and returns pagination fields (total_count, has_more)."
        test_recipe:
          setup: ["stations HLN and GTF exist; one layover at HLN"]
          setup_api_calls:
            - call: "POST /stations"
              payload: { code: "HLN", name: "Helena", timezone: "America/Denver", min_rest_hours: 10, transport_time_minutes: 20, room_availability_commitment: 10 }
              as: PlatformAdmin
              captures: { st_hln: $.data.id }
            - call: "POST /stations"
              payload: { code: "GTF", name: "Great Falls", timezone: "America/Denver", min_rest_hours: 10, transport_time_minutes: 20, room_availability_commitment: 10 }
              as: PlatformAdmin
              captures: { st_gtf: $.data.id }
            - call: "POST /union-agreements"
              payload: { name: "APA-2026", crew_type: "PILOT", min_rest_hours: 10, quiet_room_required: false, min_room_standard: "STANDARD", blackout_protection_required: false, max_invoice_variance_pct: 10.0 }
              as: PlatformAdmin
            - call: "POST /layover-requirements"
              payload: { station_id: "${st_hln}", crew_type: "PILOT", crew_count: 2, arrival_time: "2026-06-02T18:00:00Z", departure_time: "2026-06-03T09:00:00Z", required_rest_hours: 12 }
              as: CrewOps
              captures: { lay_hln: $.data.id }
          trigger:
            - call: "GET /layover-requirements"
              payload: { station_id: "${st_hln}", limit: 10, offset: 0 }
              as: CrewOps
          assert:
            - "response data contains exactly 1 row and it is ${lay_hln}"
            - "response includes total_count == 1 and has_more == false"
      - name: crew_feedback_immutable_no_version_field
        claim_type: immutability
        grounds: [entities.CrewFeedback]
        distinguishing_aspect: "CrewFeedback is common_fields:false — its response carries id and created_at but no version field, and no update endpoint exists for it."
        test_recipe:
          setup: ["station BIL, union PILOT, awarded ACTIVE contract K14 at BIL, and a layover exist"]
          setup_api_calls:
            - call: "POST /stations"
              payload: { code: "BIL", name: "Billings", timezone: "America/Denver", min_rest_hours: 10, transport_time_minutes: 20, room_availability_commitment: 10 }
              as: PlatformAdmin
              captures: { st_bil: $.data.id }
            - call: "POST /union-agreements"
              payload: { name: "APA-2026", crew_type: "PILOT", min_rest_hours: 10, quiet_room_required: false, min_room_standard: "STANDARD", blackout_protection_required: false, max_invoice_variance_pct: 10.0 }
              as: PlatformAdmin
            - call: "POST /hotel-vendors"
              payload: { name: "Rimrock Hotel", contact_email: "ops@rimrock.example", security_certified: true, quiet_rooms_count: 15 }
              as: PlatformAdmin
              captures: { vend_r: $.data.id }
            - call: "POST /rfp-cycles"
              payload: { station_id: "${st_bil}", title: "BIL 2026 crew hotel", response_deadline: "2026-09-10T00:00:00Z", target_room_count: 5, budget_cap_cents: 1000000 }
              as: SourcingManager
              captures: { cyc_b: $.data.id }
            - call: "POST /rfp-cycles/${cyc_b}/open"
              payload: {}
              as: SourcingManager
            - call: "POST /rfp-cycles/${cyc_b}/proposals"
              payload: { vendor_id: "${vend_r}", offered_room_count: 5, offered_rate_cents: 9000, quiet_room_commitment: 5 }
              as: HotelVendorRep
              as_user_id: "${vend_r}"
              captures: { prop_b: $.data.id }
            - call: "POST /rfp-cycles/${cyc_b}/close"
              payload: {}
              as: SourcingManager
            - call: "POST /rfp-proposals/${prop_b}/shortlist"
              payload: {}
              as: SourcingManager
            - call: "POST /rfp-cycles/${cyc_b}/open-negotiation"
              payload: {}
              as: SourcingManager
            - call: "GET /rfp-cycles/${cyc_b}"
              payload: {}
              as: SourcingManager
              captures: { cyc_b_v: $.data.version }
            - call: "POST /rfp-cycles/${cyc_b}/award"
              payload: { proposal_id: "${prop_b}", room_block_size: 5, start_date: "2026-06-01T00:00:00Z", end_date: "2026-06-11T00:00:00Z", late_cancel_hours: 24, quiet_room_standard: "ENHANCED", security_requirements: ["KEYCARD_FLOOR"], blackout_dates: [], blackout_protection: false, expected_cycle_version: "${cyc_b_v}" }
              as: SourcingManager
              captures: { ctr_k14: $.data.id }
            - call: "POST /layover-requirements"
              payload: { station_id: "${st_bil}", crew_type: "PILOT", crew_count: 2, arrival_time: "2026-06-02T18:00:00Z", departure_time: "2026-06-03T09:00:00Z", required_rest_hours: 12 }
              as: CrewOps
              captures: { lay_bil: $.data.id }
          trigger:
            - call: "POST /crew-feedback"
              payload: { contract_id: "${ctr_k14}", layover_requirement_id: "${lay_bil}", crew_type: "PILOT", rating: 4, category: "CLEANLINESS", comment: "fine" }
              as: CrewOps
              captures: { fb_1: $.data.id }
          assert:
            - "CrewFeedback.${fb_1} response has id and created_at but no version or updated_at field"
            - "rating == 4 stored as given"
  - section: state_machines
    instances:
      - name: rfp_cycle_initial_state_draft
        claim_type: initial_state
        grounds: [state_machines.RfpCycle]
        distinguishing_aspect: "A newly created RfpCycle starts in DRAFT with negotiation_round 0."
        test_recipe:
          setup: ["station GJT exists"]
          setup_api_calls:
            - call: "POST /stations"
              payload: { code: "GJT", name: "Grand Junction", timezone: "America/Denver", min_rest_hours: 10, transport_time_minutes: 20, room_availability_commitment: 10 }
              as: PlatformAdmin
              captures: { st_gjt: $.data.id }
          trigger:
            - call: "POST /rfp-cycles"
              payload: { station_id: "${st_gjt}", title: "GJT 2026 crew hotel", response_deadline: "2026-09-10T00:00:00Z", target_room_count: 5, budget_cap_cents: 1000000 }
              as: SourcingManager
              captures: { cyc_gj: $.data.id, cyc_gj_status: $.data.status, cyc_gj_round: $.data.negotiation_round }
          assert:
            - "RfpCycle.${cyc_gj}.status == DRAFT and negotiation_round == 0"
      - name: open_negotiation_from_draft_rejected
        claim_type: invalid_transition
        grounds: [state_machines.RfpCycle, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "POST /rfp-cycles/{id}/open-negotiation from DRAFT is an invalid transition -> ERR_INVALID_STATE."
        test_recipe:
          setup: ["station GJT and DRAFT cycle exist"]
          setup_api_calls:
            - call: "POST /stations"
              payload: { code: "GJT", name: "Grand Junction", timezone: "America/Denver", min_rest_hours: 10, transport_time_minutes: 20, room_availability_commitment: 10 }
              as: PlatformAdmin
              captures: { st_gjt: $.data.id }
            - call: "POST /rfp-cycles"
              payload: { station_id: "${st_gjt}", title: "GJT 2026 crew hotel", response_deadline: "2026-09-10T00:00:00Z", target_room_count: 5, budget_cap_cents: 1000000 }
              as: SourcingManager
              captures: { cyc_gj: $.data.id }
          trigger:
            - call: "POST /rfp-cycles/${cyc_gj}/open-negotiation"
              payload: {}
              as: SourcingManager
              captures: { err_id: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE and RfpCycle.${cyc_gj}.status remains DRAFT"
      - name: terminal_cycle_rejects_further_transitions
        claim_type: terminal_state_lockdown
        grounds: [state_machines.RfpCycle, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A CANCELLED cycle rejects open/close/award/cancel with ERR_INVALID_STATE."
        test_recipe:
          setup: ["station GJT and a cycle that has been cancelled from DRAFT"]
          setup_api_calls:
            - call: "POST /stations"
              payload: { code: "GJT", name: "Grand Junction", timezone: "America/Denver", min_rest_hours: 10, transport_time_minutes: 20, room_availability_commitment: 10 }
              as: PlatformAdmin
              captures: { st_gjt: $.data.id }
            - call: "POST /rfp-cycles"
              payload: { station_id: "${st_gjt}", title: "GJT 2026 crew hotel", response_deadline: "2026-09-10T00:00:00Z", target_room_count: 5, budget_cap_cents: 1000000 }
              as: SourcingManager
              captures: { cyc_gj: $.data.id }
            - call: "POST /rfp-cycles/${cyc_gj}/cancel"
              payload: {}
              as: SourcingManager
          trigger:
            - call: "POST /rfp-cycles/${cyc_gj}/open"
              payload: {}
              as: SourcingManager
              captures: { err_id: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE and RfpCycle.${cyc_gj}.status remains CANCELLED"
      - name: cycle_cancel_cascades_proposals_to_rejected
        claim_type: side_effect_execution
        grounds: [state_machines.RfpCycle.OPEN_to_CANCELLED, state_machines.RfpProposal]
        distinguishing_aspect: "Cancelling an OPEN cycle cascades its non-terminal proposals to REJECTED."
        test_recipe:
          setup: ["station FCA, vendor, OPEN cycle with one SUBMITTED proposal"]
          setup_api_calls:
            - call: "POST /stations"
              payload: { code: "FCA", name: "Glacier Park", timezone: "America/Denver", min_rest_hours: 10, transport_time_minutes: 25, room_availability_commitment: 10 }
              as: PlatformAdmin
              captures: { st_fca: $.data.id }
            - call: "POST /hotel-vendors"
              payload: { name: "Glacier Lodge", contact_email: "ops@glacierlodge.example", security_certified: true, quiet_rooms_count: 10 }
              as: PlatformAdmin
              captures: { vend_gl: $.data.id }
            - call: "POST /rfp-cycles"
              payload: { station_id: "${st_fca}", title: "FCA 2026 crew hotel", response_deadline: "2026-09-10T00:00:00Z", target_room_count: 5, budget_cap_cents: 1000000 }
              as: SourcingManager
              captures: { cyc_f: $.data.id }
            - call: "POST /rfp-cycles/${cyc_f}/open"
              payload: {}
              as: SourcingManager
            - call: "POST /rfp-cycles/${cyc_f}/proposals"
              payload: { vendor_id: "${vend_gl}", offered_room_count: 5, offered_rate_cents: 9000, quiet_room_commitment: 5 }
              as: HotelVendorRep
              as_user_id: "${vend_gl}"
              captures: { prop_f: $.data.id }
          trigger:
            - call: "POST /rfp-cycles/${cyc_f}/cancel"
              payload: {}
              as: SourcingManager
          assert:
            - "RfpCycle.${cyc_f}.status == CANCELLED"
            - "RfpProposal.${prop_f}.status == REJECTED (cascade)"
      - name: contract_expire_lazy_settle_past_end_date
        claim_type: valid_transition
        grounds: [state_machines.Contract.ACTIVE_to_EXPIRED]
        distinguishing_aspect: "An ACTIVE contract lazy-settles to EXPIRED when read after its end_date on the logical clock."
        test_recipe:
          setup:
            - "station GRI, union PILOT, awarded ACTIVE contract with end_date 2026-06-11"
            - "logical clock advanced to 2026-06-12T00:00:00Z"
          setup_api_calls:
            - call: "POST /stations"
              payload: { code: "GRI", name: "Grand Island", timezone: "America/Chicago", min_rest_hours: 10, transport_time_minutes: 20, room_availability_commitment: 10 }
              as: PlatformAdmin
              captures: { st_gri: $.data.id }
            - call: "POST /union-agreements"
              payload: { name: "APA-2026", crew_type: "PILOT", min_rest_hours: 10, quiet_room_required: false, min_room_standard: "STANDARD", blackout_protection_required: false, max_invoice_variance_pct: 10.0 }
              as: PlatformAdmin
            - call: "POST /hotel-vendors"
              payload: { name: "Platte Hotel", contact_email: "ops@plattehotel.example", security_certified: true, quiet_rooms_count: 12 }
              as: PlatformAdmin
              captures: { vend_pl: $.data.id }
            - call: "POST /rfp-cycles"
              payload: { station_id: "${st_gri}", title: "GRI 2026 crew hotel", response_deadline: "2026-09-10T00:00:00Z", target_room_count: 5, budget_cap_cents: 1000000 }
              as: SourcingManager
              captures: { cyc_gr: $.data.id }
            - call: "POST /rfp-cycles/${cyc_gr}/open"
              payload: {}
              as: SourcingManager
            - call: "POST /rfp-cycles/${cyc_gr}/proposals"
              payload: { vendor_id: "${vend_pl}", offered_room_count: 5, offered_rate_cents: 9000, quiet_room_commitment: 5 }
              as: HotelVendorRep
              as_user_id: "${vend_pl}"
              captures: { prop_gr: $.data.id }
            - call: "POST /rfp-cycles/${cyc_gr}/close"
              payload: {}
              as: SourcingManager
            - call: "POST /rfp-proposals/${prop_gr}/shortlist"
              payload: {}
              as: SourcingManager
            - call: "POST /rfp-cycles/${cyc_gr}/open-negotiation"
              payload: {}
              as: SourcingManager
            - call: "GET /rfp-cycles/${cyc_gr}"
              payload: {}
              as: SourcingManager
              captures: { cyc_gr_v: $.data.version }
            - call: "POST /rfp-cycles/${cyc_gr}/award"
              payload: { proposal_id: "${prop_gr}", room_block_size: 5, start_date: "2026-06-01T00:00:00Z", end_date: "2026-06-11T00:00:00Z", late_cancel_hours: 24, quiet_room_standard: "ENHANCED", security_requirements: ["KEYCARD_FLOOR"], blackout_dates: [], blackout_protection: false, expected_cycle_version: "${cyc_gr_v}" }
              as: SourcingManager
              captures: { ctr_gr: $.data.id }
            - call: "POST /contracts/${ctr_gr}/activate"
              payload: {}
              as: SourcingManager
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-12T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /contracts/${ctr_gr}"
              payload: {}
              as: SourcingManager
              captures: { ctr_gr_status: $.data.status }
          assert:
            - "Contract.${ctr_gr}.status == EXPIRED after the clock passed end_date"
      - name: audit_close_fail_terminates_contract
        claim_type: side_effect_execution
        grounds: [state_machines.Audit.IN_PROGRESS_to_CLOSED_FAIL, state_machines.Contract]
        distinguishing_aspect: "Closing an audit with outcome FAIL cascades the contract to TERMINATED (from ACTIVE or SUSPENDED) and suspends the vendor."
        test_recipe:
          setup:
            - "station HOB, union PILOT, ACTIVE contract K15, MINOR audit opened and started"
          setup_api_calls:
            - call: "POST /stations"
              payload: { code: "HOB", name: "Hobbs", timezone: "America/Denver", min_rest_hours: 10, transport_time_minutes: 20, room_availability_commitment: 10 }
              as: PlatformAdmin
              captures: { st_hob: $.data.id }
            - call: "POST /union-agreements"
              payload: { name: "APA-2026", crew_type: "PILOT", min_rest_hours: 10, quiet_room_required: false, min_room_standard: "STANDARD", blackout_protection_required: false, max_invoice_variance_pct: 10.0 }
              as: PlatformAdmin
            - call: "POST /hotel-vendors"
              payload: { name: "Zia Hotel", contact_email: "ops@ziahotel.example", security_certified: true, quiet_rooms_count: 12 }
              as: PlatformAdmin
              captures: { vend_z: $.data.id }
            - call: "POST /rfp-cycles"
              payload: { station_id: "${st_hob}", title: "HOB 2026 crew hotel", response_deadline: "2026-09-10T00:00:00Z", target_room_count: 5, budget_cap_cents: 1000000 }
              as: SourcingManager
              captures: { cyc_h: $.data.id }
            - call: "POST /rfp-cycles/${cyc_h}/open"
              payload: {}
              as: SourcingManager
            - call: "POST /rfp-cycles/${cyc_h}/proposals"
              payload: { vendor_id: "${vend_z}", offered_room_count: 5, offered_rate_cents: 9000, quiet_room_commitment: 5 }
              as: HotelVendorRep
              as_user_id: "${vend_z}"
              captures: { prop_h: $.data.id }
            - call: "POST /rfp-cycles/${cyc_h}/close"
              payload: {}
              as: SourcingManager
            - call: "POST /rfp-proposals/${prop_h}/shortlist"
              payload: {}
              as: SourcingManager
            - call: "POST /rfp-cycles/${cyc_h}/open-negotiation"
              payload: {}
              as: SourcingManager
            - call: "GET /rfp-cycles/${cyc_h}"
              payload: {}
              as: SourcingManager
              captures: { cyc_h_v: $.data.version }
            - call: "POST /rfp-cycles/${cyc_h}/award"
              payload: { proposal_id: "${prop_h}", room_block_size: 5, start_date: "2026-06-01T00:00:00Z", end_date: "2026-06-11T00:00:00Z", late_cancel_hours: 24, quiet_room_standard: "ENHANCED", security_requirements: ["KEYCARD_FLOOR"], blackout_dates: [], blackout_protection: false, expected_cycle_version: "${cyc_h_v}" }
              as: SourcingManager
              captures: { ctr_k15: $.data.id }
            - call: "POST /contracts/${ctr_k15}/activate"
              payload: {}
              as: SourcingManager
            - call: "POST /audits"
              payload: { contract_id: "${ctr_k15}", auditor_id: "aud-9", severity: "MINOR", findings: "worn hallway carpet" }
              as: CrewAuditor
