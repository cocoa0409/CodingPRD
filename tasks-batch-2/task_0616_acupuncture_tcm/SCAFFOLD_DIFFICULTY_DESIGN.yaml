# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Acupuncture & TCM Clinic. 9 rule_id blocks × 2 instances = 18 instances.
# Every grounds ref resolves into SCAFFOLD.yaml §1.1–§1.6; every setup_api_calls
# call resolves to a §1.5 endpoint; every ${var} is captured earlier.
# =============================================================================

scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: visit_charge_cash_vs_insurance_diverge
        grounds:
          - calculations.visit_charge
          - calculations.superbill_reconciliation
          - entities.Charge.fields.total_due_cents
          - entities.Superbill.fields.patient_responsibility_cents
        distinguishing_aspect: |
          Same appointment subtotal on two DIFFERENT entity domains: a CASH patient yields a Charge
          (cash discount path) while an INSURANCE patient yields a Superbill (coinsurance path), so the
          patient-owed cents differ (Charge.total_due_cents vs Superbill.patient_responsibility_cents).
        test_recipe:
          setup:
            - "Practitioner P, room R."
            - "CASH patient PC (payer_mode=CASH) with finalized intake and ACTIVE plan PLC."
            - "INSURANCE patient PI (payer_mode=INSURANCE, coinsurance_rate=0.65) with finalized intake and ACTIVE plan PLI."
            - "Each books a PER_VISIT appointment base_fee 12010, with two add-ons 3510 (cupping) + 2510 (moxa); both checked-in then completed."
            - "Clock at 2026-06-01T10:00:00Z so check-in is ON_TIME."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:55:00Z" }
              as: ClinicAdmin
            - call: "POST /practitioners"
              payload: { full_name: "Dr Acu", license_number: "LIC-1" }
              as: ClinicAdmin
              captures: { prac_id: $.data.id }
            - call: "POST /rooms"
              payload: { room_name: "Room A" }
              as: ClinicAdmin
              captures: { room_id: $.data.id }
            # ---- CASH patient ----
            - call: "POST /patients"
              payload: { full_name: "Cash Pat", date_of_birth: "1980-01-01", payer_mode: "CASH" }
              as: ClinicAdmin
              captures: { pc_id: $.data.id }
            - call: "POST /intakes"
              payload: { patient_id: "${pc_id}", chief_complaint: "back pain", tongue_finding: "RED", tongue_coating: "THIN_WHITE", pulse_finding: "WIRY", tcm_pattern: "QI_STAGNATION" }
              as: Practitioner
              as_user_id: "${prac_id}"
              captures: { ic_id: $.data.id }
            - call: "POST /intakes/${ic_id}/finalize"
              payload: {}
              as: Practitioner
              as_user_id: "${prac_id}"
            - call: "POST /treatment-plans"
              payload: { patient_id: "${pc_id}", practitioner_id: "${prac_id}", intake_id: "${ic_id}", acupoints: ["LI4","ST36"], planned_sessions: 4 }
              as: Practitioner
              as_user_id: "${prac_id}"
              captures: { plc_id: $.data.id, plc_v: $.data.version }
            - call: "POST /appointments"
              payload: { patient_id: "${pc_id}", treatment_plan_id: "${plc_id}", practitioner_id: "${prac_id}", room_id: "${room_id}", charge_source: "PER_VISIT", scheduled_start: "2026-06-01T10:00:00Z", scheduled_end: "2026-06-01T10:45:00Z", base_fee_cents: 12010, expected_treatment_plan_version: "${plc_v}" }
              as: ClinicAdmin
              captures: { ac_id: $.data.id }
            - call: "POST /appointments/${ac_id}/addons"
              payload: { modality: "CUPPING", fee_cents: 3510 }
              as: ClinicAdmin
            - call: "POST /appointments/${ac_id}/addons"
              payload: { modality: "MOXA", fee_cents: 2510 }
              as: ClinicAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T10:00:00Z" }
              as: ClinicAdmin
            - call: "POST /appointments/${ac_id}/check-in"
              payload: {}
              as: ClinicAdmin
            - call: "POST /appointments/${ac_id}/complete"
              payload: {}
              as: Practitioner
              as_user_id: "${prac_id}"
            # ---- INSURANCE patient ----
            - call: "POST /patients"
              payload: { full_name: "Ins Pat", date_of_birth: "1980-01-01", payer_mode: "INSURANCE", insurance_member_id: "M-1", coinsurance_rate: 0.65 }
              as: ClinicAdmin
              captures: { pi_id: $.data.id }
            - call: "POST /intakes"
              payload: { patient_id: "${pi_id}", chief_complaint: "back pain", tongue_finding: "RED", tongue_coating: "THIN_WHITE", pulse_finding: "WIRY", tcm_pattern: "QI_STAGNATION" }
              as: Practitioner
              as_user_id: "${prac_id}"
              captures: { ii_id: $.data.id }
            - call: "POST /intakes/${ii_id}/finalize"
              payload: {}
              as: Practitioner
              as_user_id: "${prac_id}"
            - call: "POST /treatment-plans"
              payload: { patient_id: "${pi_id}", practitioner_id: "${prac_id}", intake_id: "${ii_id}", acupoints: ["LI4"], planned_sessions: 4 }
              as: Practitioner
              as_user_id: "${prac_id}"
              captures: { pli_id: $.data.id, pli_v: $.data.version }
            - call: "POST /appointments"
              payload: { patient_id: "${pi_id}", treatment_plan_id: "${pli_id}", practitioner_id: "${prac_id}", room_id: "${room_id}", charge_source: "PER_VISIT", scheduled_start: "2026-06-01T12:00:00Z", scheduled_end: "2026-06-01T12:45:00Z", base_fee_cents: 12010, expected_treatment_plan_version: "${pli_v}" }
              as: ClinicAdmin
              captures: { ai_id: $.data.id }
            - call: "POST /appointments/${ai_id}/addons"
              payload: { modality: "CUPPING", fee_cents: 3510 }
              as: ClinicAdmin
            - call: "POST /appointments/${ai_id}/addons"
              payload: { modality: "MOXA", fee_cents: 2510 }
              as: ClinicAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T12:00:00Z" }
              as: ClinicAdmin
            - call: "POST /appointments/${ai_id}/check-in"
              payload: {}
              as: ClinicAdmin
            - call: "POST /appointments/${ai_id}/complete"
              payload: {}
              as: Practitioner
              as_user_id: "${prac_id}"
          trigger:
            - call: "GET /charges"
              payload: {}
              as: ClinicAdmin
              captures: { cash_total: "$.data[0].total_due_cents" }
            - call: "GET /superbills"
              payload: {}
              as: ClinicAdmin
              captures: { ins_resp: "$.data[0].patient_responsibility_cents" }
          assert:
            - "Charge for ${ac_id}: subtotal_cents == 18030, cash_discount_cents == 1803, total_due_cents == 16227"
            - "Superbill for ${ai_id}: insurance_allowed_cents == 11721, patient_responsibility_cents == 6309"
            - "Charge.total_due_cents (16227) != Superbill.patient_responsibility_cents (6309)"

      - name: package_credit_provisional_vs_finalized_diverge
        grounds:
          - calculations.package_credit_balance
          - entities.PackageSeries.fields.provisional_remaining_credits
          - entities.PackageSeries.fields.finalized_remaining_credits
        distinguishing_aspect: |
          On the PackageSeries entity domain (distinct from the Charge/Superbill billing domain of the
          sibling instance), a single SCHEDULED appointment lowers provisional_remaining_credits but NOT
          finalized_remaining_credits, so the two variants diverge for identical data.
        test_recipe:
          setup:
            - "Patient PK with finalized intake, ACTIVE plan, and a 10-credit ACTIVE package."
            - "Three appointments booked from the package (charge_source=PACKAGE); one completed, two left SCHEDULED."
          setup_api_calls:
            - call: "POST /practitioners"
              payload: { full_name: "Dr Acu", license_number: "LIC-2" }
              as: ClinicAdmin
              captures: { prac_id: $.data.id }
            - call: "POST /rooms"
              payload: { room_name: "Room B", cleanup_buffer_minutes: 0 }
              as: ClinicAdmin
              captures: { room_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Pkg Pat", date_of_birth: "1980-01-01", payer_mode: "CASH" }
              as: ClinicAdmin
              captures: { pk_id: $.data.id }
            - call: "POST /intakes"
              payload: { patient_id: "${pk_id}", chief_complaint: "fatigue", tongue_finding: "PALE", tongue_coating: "THIN_WHITE", pulse_finding: "THREADY", tcm_pattern: "BLOOD_DEFICIENCY" }
              as: Practitioner
              as_user_id: "${prac_id}"
              captures: { ik_id: $.data.id }
            - call: "POST /intakes/${ik_id}/finalize"
              payload: {}
              as: Practitioner
              as_user_id: "${prac_id}"
            - call: "POST /treatment-plans"
              payload: { patient_id: "${pk_id}", practitioner_id: "${prac_id}", intake_id: "${ik_id}", acupoints: ["SP6"], planned_sessions: 10 }
              as: Practitioner
              as_user_id: "${prac_id}"
              captures: { pl_id: $.data.id, pl_v0: $.data.version }
            - call: "POST /package-series"
              payload: { patient_id: "${pk_id}", total_credits: 10, price_paid_cents: 90000 }
              as: ClinicAdmin
              captures: { pkg_id: $.data.id }
            - call: "POST /appointments"
              payload: { patient_id: "${pk_id}", treatment_plan_id: "${pl_id}", practitioner_id: "${prac_id}", room_id: "${room_id}", package_series_id: "${pkg_id}", charge_source: "PACKAGE", scheduled_start: "2026-06-02T09:00:00Z", scheduled_end: "2026-06-02T09:45:00Z", base_fee_cents: 0, expected_treatment_plan_version: "${pl_v0}" }
              as: ClinicAdmin
              captures: { a1: $.data.id }
            - call: "GET /treatment-plans/${pl_id}"
              payload: {}
              as: ClinicAdmin
              captures: { pl_vA: $.data.version }
            - call: "POST /appointments"
              payload: { patient_id: "${pk_id}", treatment_plan_id: "${pl_id}", practitioner_id: "${prac_id}", room_id: "${room_id}", package_series_id: "${pkg_id}", charge_source: "PACKAGE", scheduled_start: "2026-06-02T10:00:00Z", scheduled_end: "2026-06-02T10:45:00Z", base_fee_cents: 0, expected_treatment_plan_version: "${pl_vA}" }
              as: ClinicAdmin
              captures: { a2: $.data.id }
            - call: "GET /treatment-plans/${pl_id}"
              payload: {}
              as: ClinicAdmin
              captures: { pl_vB: $.data.version }
            - call: "POST /appointments"
              payload: { patient_id: "${pk_id}", treatment_plan_id: "${pl_id}", practitioner_id: "${prac_id}", room_id: "${room_id}", package_series_id: "${pkg_id}", charge_source: "PACKAGE", scheduled_start: "2026-06-02T11:00:00Z", scheduled_end: "2026-06-02T11:45:00Z", base_fee_cents: 0, expected_treatment_plan_version: "${pl_vB}" }
              as: ClinicAdmin
              captures: { a3: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-02T09:00:00Z" }
              as: ClinicAdmin
            - call: "POST /appointments/${a1}/check-in"
              payload: {}
              as: ClinicAdmin
            - call: "POST /appointments/${a1}/complete"
              payload: {}
              as: Practitioner
              as_user_id: "${prac_id}"
          trigger:
            - call: "GET /package-series/${pkg_id}"
              payload: {}
              as: ClinicAdmin
              captures: { prov: $.data.provisional_remaining_credits, fin: $.data.finalized_remaining_credits }
          assert:
            - "PackageSeries.${pkg_id}.reserved_credits == 2"
            - "PackageSeries.${pkg_id}.consumed_credits == 1"
            - "PackageSeries.${pkg_id}.provisional_remaining_credits == 7"
            - "PackageSeries.${pkg_id}.finalized_remaining_credits == 9"
            - "provisional_remaining_credits (7) != finalized_remaining_credits (9)"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: no_show_penalty_three_input_nonlinear
        grounds:
          - calculations.no_show_penalty
          - state_machines.Appointment.SCHEDULED_to_NO_SHOW
          - entities.Patient.fields.strike_count
          - entities.Patient.fields.membership_status
        distinguishing_aspect: |
          Mode (a): penalty_cents is a 3-input nonlinear function of {transition type, prior_strikes,
          membership_status} with a capped multiplier and a membership-first-strike branch — prior_strikes=2
          non-member no-show yields 10000 (5000 * (1+2*0.5)), distinct from the rounding-order mode (b) sibling.
        test_recipe:
          setup:
            - "Non-member patient with strike_count already 2 (two prior no-shows on disposable appointments)."
            - "A third SCHEDULED PER_VISIT appointment is then marked NO_SHOW."
          setup_api_calls:
            - call: "POST /practitioners"
              payload: { full_name: "Dr Acu", license_number: "LIC-3" }
              as: ClinicAdmin
              captures: { prac_id: $.data.id }
            - call: "POST /rooms"
              payload: { room_name: "Room C" }
              as: ClinicAdmin
              captures: { room_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Strike Pat", date_of_birth: "1980-01-01", payer_mode: "CASH" }
              as: ClinicAdmin
              captures: { pt_id: $.data.id }
            - call: "POST /intakes"
              payload: { patient_id: "${pt_id}", chief_complaint: "neck", tongue_finding: "RED", tongue_coating: "THICK_YELLOW", pulse_finding: "RAPID", tcm_pattern: "DAMP_HEAT" }
              as: Practitioner
              as_user_id: "${prac_id}"
              captures: { ik_id: $.data.id }
            - call: "POST /intakes/${ik_id}/finalize"
              payload: {}
              as: Practitioner
              as_user_id: "${prac_id}"
            - call: "POST /treatment-plans"
              payload: { patient_id: "${pt_id}", practitioner_id: "${prac_id}", intake_id: "${ik_id}", acupoints: ["GV20"], planned_sessions: 5 }
              as: Practitioner
              as_user_id: "${prac_id}"
              captures: { pl_id: $.data.id, plv0: $.data.version }
            - call: "POST /appointments"
              payload: { patient_id: "${pt_id}", treatment_plan_id: "${pl_id}", practitioner_id: "${prac_id}", room_id: "${room_id}", charge_source: "PER_VISIT", scheduled_start: "2026-06-03T09:00:00Z", scheduled_end: "2026-06-03T09:45:00Z", base_fee_cents: 12000, expected_treatment_plan_version: "${plv0}" }
              as: ClinicAdmin
              captures: { s1: $.data.id }
            - call: "POST /appointments/${s1}/no-show"
              payload: {}
              as: ClinicAdmin
            - call: "GET /treatment-plans/${pl_id}"
              payload: {}
              as: ClinicAdmin
              captures: { plvA: $.data.version }
            - call: "POST /appointments"
              payload: { patient_id: "${pt_id}", treatment_plan_id: "${pl_id}", practitioner_id: "${prac_id}", room_id: "${room_id}", charge_source: "PER_VISIT", scheduled_start: "2026-06-03T10:00:00Z", scheduled_end: "2026-06-03T10:45:00Z", base_fee_cents: 12000, expected_treatment_plan_version: "${plvA}" }
              as: ClinicAdmin
              captures: { s2: $.data.id }
            - call: "POST /appointments/${s2}/no-show"
              payload: {}
              as: ClinicAdmin
            - call: "GET /treatment-plans/${pl_id}"
              payload: {}
              as: ClinicAdmin
              captures: { plvB: $.data.version }
            - call: "POST /appointments"
              payload: { patient_id: "${pt_id}", treatment_plan_id: "${pl_id}", practitioner_id: "${prac_id}", room_id: "${room_id}", charge_source: "PER_VISIT", scheduled_start: "2026-06-03T11:00:00Z", scheduled_end: "2026-06-03T11:45:00Z", base_fee_cents: 12000, expected_treatment_plan_version: "${plvB}" }
              as: ClinicAdmin
              captures: { s3: $.data.id }
          trigger:
            - call: "POST /appointments/${s3}/no-show"
              payload: {}
              as: ClinicAdmin
              captures: { a3v: $.data.version }
            - call: "GET /charges"
              payload: {}
              as: ClinicAdmin
              captures: { pen_amt: "$.data[0].total_due_cents" }
          assert:
            - "Before the third no-show Patient.strike_count == 2"
            - "PENALTY Charge for ${s3}: charge_type == PENALTY, total_due_cents == 10000"
            - "Appointment.${s3}.billing_status == PENALTY_DUE"
            - "After: Patient.strike_count == 3"

      - name: superbill_round_per_line_then_sum_order_pinned
        grounds:
          - calculations.superbill_reconciliation
          - entities.Superbill.fields.insurance_allowed_cents
          - entities.AddOn.fields.fee_cents
        distinguishing_aspect: |
          Mode (b): with coinsurance_rate 0.65 and lines [12010, 3510, 2510], round-per-line-then-sum gives
          insurance_allowed 11721, whereas sum-then-round gives 11720 — the scaffold pins round-per-line, so
          the asserted literal (11721) falsifies the wrong order. Distinct mode from the (a) sibling.
        test_recipe:
          setup:
            - "INSURANCE patient (coinsurance_rate 0.65), finalized intake, ACTIVE plan."
            - "PER_VISIT appointment base_fee 12010 + add-ons 3510 then 2510, completed."
          setup_api_calls:
            - call: "POST /practitioners"
              payload: { full_name: "Dr Acu", license_number: "LIC-4" }
              as: ClinicAdmin
              captures: { prac_id: $.data.id }
            - call: "POST /rooms"
              payload: { room_name: "Room D" }
              as: ClinicAdmin
              captures: { room_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Ins Pat2", date_of_birth: "1980-01-01", payer_mode: "INSURANCE", insurance_member_id: "M-2", coinsurance_rate: 0.65 }
              as: ClinicAdmin
              captures: { pt_id: $.data.id }
            - call: "POST /intakes"
              payload: { patient_id: "${pt_id}", chief_complaint: "knee", tongue_finding: "PURPLE", tongue_coating: "GREASY", pulse_finding: "SLIPPERY", tcm_pattern: "DAMP_HEAT" }
              as: Practitioner
              as_user_id: "${prac_id}"
              captures: { ik_id: $.data.id }
            - call: "POST /intakes/${ik_id}/finalize"
              payload: {}
              as: Practitioner
              as_user_id: "${prac_id}"
            - call: "POST /treatment-plans"
              payload: { patient_id: "${pt_id}", practitioner_id: "${prac_id}", intake_id: "${ik_id}", acupoints: ["GB34"], planned_sessions: 3 }
              as: Practitioner
              as_user_id: "${prac_id}"
              captures: { pl_id: $.data.id, plv0: $.data.version }
            - call: "POST /appointments"
              payload: { patient_id: "${pt_id}", treatment_plan_id: "${pl_id}", practitioner_id: "${prac_id}", room_id: "${room_id}", charge_source: "PER_VISIT", scheduled_start: "2026-06-04T09:00:00Z", scheduled_end: "2026-06-04T09:45:00Z", base_fee_cents: 12010, expected_treatment_plan_version: "${plv0}" }
              as: ClinicAdmin
              captures: { ap_id: $.data.id }
            - call: "POST /appointments/${ap_id}/addons"
              payload: { modality: "CUPPING", fee_cents: 3510 }
              as: ClinicAdmin
            - call: "POST /appointments/${ap_id}/addons"
              payload: { modality: "MOXA", fee_cents: 2510 }
              as: ClinicAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-04T09:00:00Z" }
              as: ClinicAdmin
            - call: "POST /appointments/${ap_id}/check-in"
              payload: {}
              as: ClinicAdmin
            - call: "POST /appointments/${ap_id}/complete"
              payload: {}
              as: Practitioner
              as_user_id: "${prac_id}"
          trigger:
            - call: "GET /superbills"
              payload: {}
              as: ClinicAdmin
              captures: { allowed: "$.data[0].insurance_allowed_cents" }
          assert:
            - "Superbill.${ap_id}.insurance_allowed_cents == 11721  (round-per-line: 7807+2282+1632)"
            - "insurance_allowed_cents != 11720 (the sum-then-round result is rejected)"
            - "Superbill.${ap_id}.patient_responsibility_cents == 6309"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: appointment_parallel_clinical_x_billing
        grounds:
          - state_machines.Appointment.SCHEDULED_to_NO_SHOW
          - entities.Appointment.fields.clinical_status
          - entities.Appointment.fields.billing_status
        distinguishing_aspect: |
          Two independent state axes on ONE Appointment row: clinical_status reaches NO_SHOW while
          billing_status evolves on its own axis to PENALTY_DUE — proving parallel dimensions, not a
          single linear pipeline. (Entity: Appointment.)
        test_recipe:
          setup:
            - "Non-member patient, finalized intake, ACTIVE plan, one SCHEDULED PER_VISIT appointment (strike_count 0)."
          setup_api_calls:
            - call: "POST /practitioners"
              payload: { full_name: "Dr Acu", license_number: "LIC-5" }
              as: ClinicAdmin
              captures: { prac_id: $.data.id }
            - call: "POST /rooms"
              payload: { room_name: "Room E" }
              as: ClinicAdmin
              captures: { room_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Par Pat", date_of_birth: "1980-01-01", payer_mode: "CASH" }
              as: ClinicAdmin
              captures: { pt_id: $.data.id }
            - call: "POST /intakes"
              payload: { patient_id: "${pt_id}", chief_complaint: "stress", tongue_finding: "RED", tongue_coating: "THIN_WHITE", pulse_finding: "WIRY", tcm_pattern: "QI_STAGNATION" }
              as: Practitioner
              as_user_id: "${prac_id}"
              captures: { ik_id: $.data.id }
            - call: "POST /intakes/${ik_id}/finalize"
              payload: {}
              as: Practitioner
              as_user_id: "${prac_id}"
            - call: "POST /treatment-plans"
              payload: { patient_id: "${pt_id}", practitioner_id: "${prac_id}", intake_id: "${ik_id}", acupoints: ["HT7"], planned_sessions: 3 }
              as: Practitioner
              as_user_id: "${prac_id}"
              captures: { pl_id: $.data.id, plv0: $.data.version }
            - call: "POST /appointments"
              payload: { patient_id: "${pt_id}", treatment_plan_id: "${pl_id}", practitioner_id: "${prac_id}", room_id: "${room_id}", charge_source: "PER_VISIT", scheduled_start: "2026-06-05T09:00:00Z", scheduled_end: "2026-06-05T09:45:00Z", base_fee_cents: 12000, expected_treatment_plan_version: "${plv0}" }
              as: ClinicAdmin
              captures: { ap_id: $.data.id }
          trigger:
            - call: "POST /appointments/${ap_id}/no-show"
              payload: {}
              as: ClinicAdmin
              captures: { cs: $.data.clinical_status, bs: $.data.billing_status }
          assert:
            - "Appointment.${ap_id}.clinical_status == NO_SHOW"
            - "Appointment.${ap_id}.billing_status == PENALTY_DUE"
            - "clinical and billing axes hold independent values on the same row"

      - name: treatment_plan_cyclic_hold_resume
        grounds:
          - state_machines.TreatmentPlan.ACTIVE_to_ON_HOLD
          - state_machines.TreatmentPlan.ON_HOLD_to_ACTIVE
          - entities.TreatmentPlan.fields.status
        distinguishing_aspect: |
          On a DIFFERENT entity (TreatmentPlan), status traverses ACTIVE->ON_HOLD->ACTIVE — a cycle (revision
          loop) that returns to a prior state, which a linear A->B->C machine cannot do.
        test_recipe:
          setup:
            - "Patient with finalized intake and an ACTIVE plan."
          setup_api_calls:
            - call: "POST /practitioners"
              payload: { full_name: "Dr Acu", license_number: "LIC-6" }
              as: ClinicAdmin
              captures: { prac_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Cyc Pat", date_of_birth: "1980-01-01", payer_mode: "CASH" }
              as: ClinicAdmin
              captures: { pt_id: $.data.id }
            - call: "POST /intakes"
