  # ===========================================================================
  # Rule 8 — resource_temporal_overlap: overlap rules with DIFFERENT interval
  # semantics on DIFFERENT resource entities.
  # Instance 1: Observer resource — CLOSED-interval intersection where TOUCHING
  # dates count as overlap (ERR_OBSERVER_OVERLAP).
  # Instance 2: Vessel resource — ADJACENCY-BUFFER semantics: a full in-port
  # calendar day is required between an existing return and the next departure
  # (gap = (new_departure - existing_return).days - 1 >= 1), so touching dates
  # are forbidden but a single gap day still violates
  # (ERR_VESSEL_TURNAROUND_VIOLATION). Different resource and different
  # geometric treatment from instance 1.
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: observer_closed_interval_touching_dates_overlap
        grounds:
          - errors[ERR_OBSERVER_OVERLAP]
          - validations[priority=8]
          - calculations.sea_day_accounting
        distinguishing_aspect: |
          Resource: Observer. Interval semantics: CLOSED-interval intersection —
          two deployments of the same observer whose [departure, return] closed
          intervals merely TOUCH (existing return date == new departure date)
          count as overlapping and are rejected with ERR_OBSERVER_OVERLAP (409).
          The boundary date itself is occupied on both sides.
        test_recipe:
          setup:
