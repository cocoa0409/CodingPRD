# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3247_affiliate_bookselling_marketplace_independent_store_profit_pool
#
# Depth probe: 2 instances per §0.5 rule x 9 rules = 18 instances.
# All customer identities are literal opaque handles (Customer role identity:
# opaque; X-User-ID == order.customer_id). Priced lines are referenced by
# line_index (0-based into the order's priced_lines), never by a line id.
# Pool share lines ride on the calculate action response ($.data.share_lines).
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: order_commission_provisional_vs_final_diverge_after_return
        grounds:
          - calculations.order_commission_accrual
          - state_machines.BookOrder.DRAFT_to_PLACED
          - state_machines.BookOrder.SHIPPED_to_DELIVERED
          - state_machines.ReturnRequest.RECEIVED_to_CREDITED
        distinguishing_aspect: |
          Dual-variant on the ORDER domain: the provisional ORDER_ACCRUAL
          entry written at PLACED (13800) is marked reversed=true at DELIVERED
          and superseded by an identical final entry; after a full quantity-1
          return credit a RETURN_CLAWBACK of -13800 lands and the affiliate
          balance nets to 0 — proving the ledger carries both variants, not a
          single mutable number.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Publisher (46% discount, returns allowed, 30-day window, 80% credit). One PRINT book at 100000 cents. One ACTIVE store, commission 0.30, threshold 20000 (no payout interference)."
          setup_api_calls:
            - call: "POST /bookshop/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /bookshop/publishers"
              payload: { name: "Riverbend Press", discount_pct: 0.46, returns_allowed: true, return_window_days: 30, return_credit_pct: 0.80 }
              as: PlatformAdmin
              captures: { pub_id: $.data.id }
            - call: "POST /bookshop/books"
              payload: { publisher_id: "${pub_id}", isbn: "9780000000001", title: "Hardcover One", format: "PRINT", list_price_cents: 100000 }
              as: PlatformAdmin
              captures: { book_id: $.data.id }
            - call: "POST /bookshop/stores"
              payload: { shop_name: "Maple Books", slug: "maple-books", commission_pct: 0.30, payout_threshold_cents: 20000 }
              as: PlatformAdmin
              captures: { store_id: $.data.id }
            - call: "POST /bookshop/stores/${store_id}/actions"
              payload: { action: "activate" }
              as: PlatformAdmin
            - call: "POST /bookshop/orders"
              payload:
                customer_id: "cust-1"
                attributed_store_id: "${store_id}"
                lines:
                  - book_id: "${book_id}"
                    quantity: 1
              as: Customer
              as_user_id: "cust-1"
              captures: { order_id: $.data.id }
            - call: "POST /bookshop/orders/${order_id}/actions"
              payload: { action: "place" }
              as: Customer
              as_user_id: "cust-1"
            - call: "POST /bookshop/orders/${order_id}/actions"
              payload: { action: "dispatch" }
              as: WholesalerOps
            - call: "POST /bookshop/orders/${order_id}/actions"
              payload: { action: "ship" }
              as: WholesalerOps
            - call: "POST /bookshop/orders/${order_id}/actions"
              payload: { action: "deliver" }
              as: WholesalerOps
            - call: "POST /bookshop/orders/${order_id}/returns"
              payload: { line_index: 0, quantity: 1, reason_code: "UNWANTED" }
              as: Customer
              as_user_id: "cust-1"
              captures: { return_id: $.data.id }
            - call: "POST /bookshop/returns/${return_id}/actions"
              payload: { action: "approve" }
              as: CustomerService
            - call: "POST /bookshop/returns/${return_id}/actions"
              payload: { action: "receive" }
              as: WholesalerOps
          trigger:
            - call: "POST /bookshop/returns/${return_id}/actions"
              payload: { action: "credit" }
              as: FinanceOps
            - call: "GET /bookshop/ledger-entries"
              payload: { affiliate_store_id: "${store_id}" }
              as: FinanceOps
            - call: "GET /bookshop/stores/${store_id}"
              payload: {}
              as: FinanceOps
          assert:
            - "ledger contains an ORDER_ACCRUAL entry of 13800 with reversed == true (provisional variant superseded at DELIVERED)"
            - "ledger contains a second ORDER_ACCRUAL entry of 13800 with reversed == false (final variant)"
            - "ledger contains a RETURN_CLAWBACK entry of -13800 with reversed == false"
            - "AffiliateStore.${store_id}.accrued_balance_cents == 0 (13800 final - 13800 clawback)"
            - "the credited ReturnRequest wholesale_credit_cents == 43200 (floor(54000 * 1 * 0.80))"

      - name: pool_share_equal_split_vs_sales_weighted_diverge
        grounds:
          - calculations.pool_share
          - state_machines.ProfitPoolDistribution.DRAFT_to_CALCULATED
        distinguishing_aspect: |
          Dual-variant on the POOL domain (distinct from the order-commission
          domain): the same pool_cents (90001) and the same three eligible
          stores produce per-store shares of [60001, 30000, 0] under
          SALES_WEIGHTED versus [30001, 30000, 30000] under EQUAL_SPLIT — the
          variant switch, not the data, moves 30000 cents between stores A
          and C.
        test_recipe:
          setup:
            - "Clock 2026-08-01. Publisher (46% discount). PRINT books at 100000 and 50000 cents. Three ACTIVE stores activated 2026-08-01 (A created first, then B, then C). A has one DELIVERED order gross 100000 in August; B one DELIVERED order gross 50000; C none. Clock advanced to 2026-09-02 (period elapsed). Store thresholds 20000 so place-time payouts do not fire (A accrues 13800, B accrues 6900)."
          setup_api_calls:
            - call: "POST /bookshop/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /bookshop/publishers"
              payload: { name: "Riverbend Press", discount_pct: 0.46, returns_allowed: true, return_window_days: 30, return_credit_pct: 0.80 }
              as: PlatformAdmin
              captures: { pub_id: $.data.id }
            - call: "POST /bookshop/books"
              payload: { publisher_id: "${pub_id}", isbn: "9780000000002", title: "Hardcover A", format: "PRINT", list_price_cents: 100000 }
              as: PlatformAdmin
              captures: { book_a: $.data.id }
            - call: "POST /bookshop/books"
              payload: { publisher_id: "${pub_id}", isbn: "9780000000003", title: "Hardcover B", format: "PRINT", list_price_cents: 50000 }
              as: PlatformAdmin
              captures: { book_b: $.data.id }
            - call: "POST /bookshop/stores"
              payload: { shop_name: "Alpha Books", slug: "alpha-books", commission_pct: 0.30, payout_threshold_cents: 20000 }
              as: PlatformAdmin
              captures: { store_a: $.data.id }
            - call: "POST /bookshop/stores"
              payload: { shop_name: "Beta Books", slug: "beta-books", commission_pct: 0.30, payout_threshold_cents: 20000 }
              as: PlatformAdmin
              captures: { store_b: $.data.id }
            - call: "POST /bookshop/stores"
              payload: { shop_name: "Gamma Books", slug: "gamma-books", commission_pct: 0.30, payout_threshold_cents: 20000 }
              as: PlatformAdmin
              captures: { store_c: $.data.id }
            - call: "POST /bookshop/stores/${store_a}/actions"
              payload: { action: "activate" }
              as: PlatformAdmin
            - call: "POST /bookshop/stores/${store_b}/actions"
              payload: { action: "activate" }
              as: PlatformAdmin
            - call: "POST /bookshop/stores/${store_c}/actions"
              payload: { action: "activate" }
              as: PlatformAdmin
            - call: "POST /bookshop/orders"
              payload:
                customer_id: "cust-2"
                attributed_store_id: "${store_a}"
                lines:
                  - book_id: "${book_a}"
                    quantity: 1
              as: Customer
              as_user_id: "cust-2"
              captures: { order_a: $.data.id }
            - call: "POST /bookshop/orders/${order_a}/actions"
              payload: { action: "place" }
              as: Customer
              as_user_id: "cust-2"
            - call: "POST /bookshop/orders/${order_a}/actions"
              payload: { action: "dispatch" }
              as: WholesalerOps
            - call: "POST /bookshop/orders/${order_a}/actions"
              payload: { action: "ship" }
              as: WholesalerOps
            - call: "POST /bookshop/orders/${order_a}/actions"
              payload: { action: "deliver" }
              as: WholesalerOps
            - call: "POST /bookshop/orders"
              payload:
                customer_id: "cust-2"
                attributed_store_id: "${store_b}"
                lines:
                  - book_id: "${book_b}"
                    quantity: 1
              as: Customer
              as_user_id: "cust-2"
              captures: { order_b: $.data.id }
            - call: "POST /bookshop/orders/${order_b}/actions"
              payload: { action: "place" }
              as: Customer
              as_user_id: "cust-2"
            - call: "POST /bookshop/orders/${order_b}/actions"
              payload: { action: "dispatch" }
              as: WholesalerOps
            - call: "POST /bookshop/orders/${order_b}/actions"
              payload: { action: "ship" }
              as: WholesalerOps
            - call: "POST /bookshop/orders/${order_b}/actions"
              payload: { action: "deliver" }
              as: WholesalerOps
            - call: "POST /bookshop/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /bookshop/pool-distributions"
              payload: { period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z", pool_cents: 90001, share_mode: "SALES_WEIGHTED" }
              as: FinanceOps
              captures: { dist_weighted: $.data.id }
          trigger:
            - call: "POST /bookshop/pool-distributions/${dist_weighted}/actions"
              payload: { action: "calculate" }
              as: FinanceOps
              captures: { weighted_lines: $.data.share_lines }
            - call: "POST /bookshop/pool-distributions/${dist_weighted}/actions"
              payload: { action: "recalculate" }
              as: FinanceOps
            - call: "POST /bookshop/pool-distributions/${dist_weighted}/actions"
              payload: { action: "void" }
              as: FinanceOps
            - call: "POST /bookshop/pool-distributions"
              payload: { period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z", pool_cents: 90001, share_mode: "EQUAL_SPLIT" }
              as: FinanceOps
              captures: { dist_equal: $.data.id }
            - call: "POST /bookshop/pool-distributions/${dist_equal}/actions"
              payload: { action: "calculate" }
              as: FinanceOps
              captures: { equal_lines: $.data.share_lines }
          assert:
            - "SALES_WEIGHTED: store A base share 60000 (floor(90001 * 100000/150000)) plus remainder 1 (largest weight) => share_cents == 60001"
            - "SALES_WEIGHTED: store B share_cents == 30000 (floor(90001 * 50000/150000))"
            - "SALES_WEIGHTED: store C share_cents == 0 (zero delivered GMV)"
            - "EQUAL_SPLIT: floor(90001/3) == 30000 with remainder 1 credited to store A (earliest created_at) => A share_cents == 30001"
            - "EQUAL_SPLIT: store B share_cents == 30000 and store C share_cents == 30000 despite zero sales"
            - "variant divergence on identical data: store A 60001 vs 30001; store C 0 vs 30000"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: line_pricing_per_line_floor_then_sum_with_promotion
        grounds:
          - calculations.line_pricing
          - state_machines.BookOrder.DRAFT_to_PLACED
        distinguishing_aspect: |
          Mode (b) nested rounding: the scaffold pins round-per-line-then-sum.
          A 15% promotion on a 9999-cent book yields floor(9999*0.15)=1499,
          unit 8500; two lines of quantity 1 sum to 17000. Sum-then-round on
          the combined discount would give floor(19998*0.15)=2999 and gross
          16999 — the pinned order is observable as a 2-cent gap.
        test_recipe:
          setup:
            - "Clock 2026-09-01 inside an ACTIVE promotion window (Sep 1..Sep 10, 15% off) on a 9999-cent PRINT book. Publisher 40% discount. ACTIVE store, commission 0.30, threshold 20000."
          setup_api_calls:
            - call: "POST /bookshop/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /bookshop/publishers"
              payload: { name: "Penny Press", discount_pct: 0.40, returns_allowed: false, return_window_days: 0, return_credit_pct: 0.0 }
              as: PlatformAdmin
              captures: { pub_id: $.data.id }
            - call: "POST /bookshop/books"
              payload: { publisher_id: "${pub_id}", isbn: "9780000000010", title: "Odd Price", format: "PRINT", list_price_cents: 9999 }
              as: PlatformAdmin
              captures: { book_id: $.data.id }
            - call: "POST /bookshop/promotions"
              payload: { book_isbn: "9780000000010", discount_pct: 0.15, window_start: "2026-09-01T00:00:00Z", window_end: "2026-09-10T00:00:00Z" }
              as: PlatformAdmin
              captures: { promo_id: $.data.id }
            - call: "POST /bookshop/stores"
              payload: { shop_name: "Round Books", slug: "round-books", commission_pct: 0.30, payout_threshold_cents: 20000 }
              as: PlatformAdmin
              captures: { store_id: $.data.id }
            - call: "POST /bookshop/stores/${store_id}/actions"
              payload: { action: "activate" }
              as: PlatformAdmin
            - call: "POST /bookshop/orders"
              payload:
                customer_id: "cust-3"
                attributed_store_id: "${store_id}"
                lines:
                  - book_id: "${book_id}"
                    quantity: 1
                  - book_id: "${book_id}"
                    quantity: 1
              as: Customer
              as_user_id: "cust-3"
              captures: { order_id: $.data.id }
          trigger:
            - call: "POST /bookshop/orders/${order_id}/actions"
              payload: { action: "place" }
              as: Customer
              as_user_id: "cust-3"
          assert:
            - "Promotion.${promo_id}.status == ACTIVE on the create response (clock 2026-09-01 is inside the closed window at creation)"
            - "priced_lines[0].unit_price_cents == 8500 and priced_lines[1].unit_price_cents == 8500 (9999 - floor(9999*0.15)=1499)"
            - "BookOrder.${order_id}.gross_cents == 17000 (sum after per-line rounding, not 16999)"
            - "priced_lines[0].wholesale_unit_cents == 5999 (floor(9999*0.60))"
            - "per-line net = 8500-5999 = 2501; commission_cents == 1500 (2 * floor(2501*0.30) = 2*750)"

      - name: pool_share_circular_weight_then_floor_then_remainder
        grounds:
          - calculations.pool_share
          - calculations.pool_eligibility
        distinguishing_aspect: |
          Mode (c) circular-looking dependency: share_cents depend on
          total_weight, total_weight depends on the eligible set, and the
          remainder feeds back into exactly one store's share. Evaluation
          order is pinned (eligibility -> weights -> floor per store ->
          remainder to largest weight with created_at tie-break). Pool 100001
          over weights 100000/50000/0 yields base [66667, 33333, 0],
          remainder 1 to store A -> [66668, 33333, 0]; a different evaluation
          order (remainder before floor) would misallocate the cent.
        test_recipe:
          setup:
            - "Three stores activated 2026-08-01 (A earliest created, B, C), thresholds 20000. A has DELIVERED GMV 100000 in August, B has 50000, C has none. Clock advanced to 2026-09-02."
          setup_api_calls:
            - call: "POST /bookshop/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /bookshop/publishers"
              payload: { name: "Riverbend Press", discount_pct: 0.46, returns_allowed: true, return_window_days: 30, return_credit_pct: 0.80 }
              as: PlatformAdmin
              captures: { pub_id: $.data.id }
            - call: "POST /bookshop/books"
              payload: { publisher_id: "${pub_id}", isbn: "9780000000011", title: "Big Book", format: "PRINT", list_price_cents: 100000 }
              as: PlatformAdmin
              captures: { book_a: $.data.id }
            - call: "POST /bookshop/books"
              payload: { publisher_id: "${pub_id}", isbn: "9780000000012", title: "Mid Book", format: "PRINT", list_price_cents: 50000 }
              as: PlatformAdmin
              captures: { book_b: $.data.id }
            - call: "POST /bookshop/stores"
              payload: { shop_name: "AAA Books", slug: "aaa-books", commission_pct: 0.30, payout_threshold_cents: 20000 }
              as: PlatformAdmin
              captures: { store_a: $.data.id }
            - call: "POST /bookshop/stores"
              payload: { shop_name: "BBB Books", slug: "bbb-books", commission_pct: 0.30, payout_threshold_cents: 20000 }
              as: PlatformAdmin
              captures: { store_b: $.data.id }
            - call: "POST /bookshop/stores"
              payload: { shop_name: "CCC Books", slug: "ccc-books", commission_pct: 0.30, payout_threshold_cents: 20000 }
              as: PlatformAdmin
              captures: { store_c: $.data.id }
            - call: "POST /bookshop/stores/${store_a}/actions"
              payload: { action: "activate" }
              as: PlatformAdmin
            - call: "POST /bookshop/stores/${store_b}/actions"
              payload: { action: "activate" }
              as: PlatformAdmin
            - call: "POST /bookshop/stores/${store_c}/actions"
              payload: { action: "activate" }
              as: PlatformAdmin
            - call: "POST /bookshop/orders"
              payload:
                customer_id: "cust-4"
                attributed_store_id: "${store_a}"
                lines:
                  - book_id: "${book_a}"
                    quantity: 1
              as: Customer
              as_user_id: "cust-4"
              captures: { order_a: $.data.id }
            - call: "POST /bookshop/orders/${order_a}/actions"
              payload: { action: "place" }
              as: Customer
              as_user_id: "cust-4"
            - call: "POST /bookshop/orders/${order_a}/actions"
              payload: { action: "dispatch" }
              as: WholesalerOps
            - call: "POST /bookshop/orders/${order_a}/actions"
              payload: { action: "ship" }
              as: WholesalerOps
            - call: "POST /bookshop/orders/${order_a}/actions"
              payload: { action: "deliver" }
              as: WholesalerOps
            - call: "POST /bookshop/orders"
              payload:
                customer_id: "cust-4"
                attributed_store_id: "${store_b}"
                lines:
                  - book_id: "${book_b}"
                    quantity: 1
              as: Customer
              as_user_id: "cust-4"
              captures: { order_b: $.data.id }
            - call: "POST /bookshop/orders/${order_b}/actions"
              payload: { action: "place" }
              as: Customer
              as_user_id: "cust-4"
            - call: "POST /bookshop/orders/${order_b}/actions"
              payload: { action: "dispatch" }
              as: WholesalerOps
            - call: "POST /bookshop/orders/${order_b}/actions"
              payload: { action: "ship" }
              as: WholesalerOps
            - call: "POST /bookshop/orders/${order_b}/actions"
              payload: { action: "deliver" }
              as: WholesalerOps
            - call: "POST /bookshop/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /bookshop/pool-distributions"
              payload: { period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z", pool_cents: 100001, share_mode: "SALES_WEIGHTED" }
              as: FinanceOps
              captures: { dist_id: $.data.id }
          trigger:
            - call: "POST /bookshop/pool-distributions/${dist_id}/actions"
              payload: { action: "calculate" }
              as: FinanceOps
              captures: { share_lines: $.data.share_lines, remainder: $.data.remainder_cents, eligible_count: $.data.eligible_store_count }
          assert:
            - "weights: A=100000, B=50000, C=0; total_weight == 150000"
            - "base floors: A floor(100001*100000/150000)=66667; B floor(100001*50000/150000)=33333; C=0"
            - "remainder 1 credited to A (largest weight): A share_cents == 66668, B == 33333, C == 0"
            - "response remainder_cents == 1 and eligible_store_count == 3"
            - "sum of share_lines.share_cents == 100001 (approve invariant pre-satisfied)"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: booklist_publish_unpublish_republish_cycle_increments_publish_count
        grounds:
          - state_machines.BookList.PUBLISHED_to_DRAFT
          - state_machines.BookList.DRAFT_to_PUBLISHED
          - entities.BookList.fields.publish_count
        distinguishing_aspect: |
          Cycle on BookList: DRAFT -> PUBLISHED -> DRAFT -> PUBLISHED is legal
          and publish_count reaches 2; a linear pipeline would forbid the
          second publish outright.
        test_recipe:
          setup:
            - "ACTIVE store with one LISTED book; store manager owns a DRAFT list containing that book."
          setup_api_calls:
            - call: "POST /bookshop/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /bookshop/publishers"
              payload: { name: "List Press", discount_pct: 0.40, returns_allowed: false, return_window_days: 0, return_credit_pct: 0.0 }
              as: PlatformAdmin
              captures: { pub_id: $.data.id }
            - call: "POST /bookshop/books"
              payload: { publisher_id: "${pub_id}", isbn: "9780000000020", title: "Listable", format: "PRINT", list_price_cents: 5000 }
              as: PlatformAdmin
              captures: { book_id: $.data.id }
            - call: "POST /bookshop/stores"
              payload: { shop_name: "Cycle Books", slug: "cycle-books", commission_pct: 0.30 }
              as: PlatformAdmin
              captures: { store_id: $.data.id }
            - call: "POST /bookshop/stores/${store_id}/actions"
              payload: { action: "activate" }
              as: PlatformAdmin
            - call: "POST /bookshop/lists"
              payload:
                owner_store_id: "${store_id}"
                title: "Staff Picks"
                items:
                  - book_id: "${book_id}"
                    position: 1
              as: StoreManager
              as_user_id: "${store_id}"
              captures: { list_id: $.data.id }
            - call: "POST /bookshop/lists/${list_id}/actions"
              payload: { action: "publish" }
              as: StoreManager
              as_user_id: "${store_id}"
            - call: "POST /bookshop/lists/${list_id}/actions"
              payload: { action: "unpublish" }
              as: StoreManager
              as_user_id: "${store_id}"
          trigger:
            - call: "POST /bookshop/lists/${list_id}/actions"
              payload: { action: "publish" }
              as: StoreManager
              as_user_id: "${store_id}"
              captures: { final_list: $.data }
          assert:
            - "response status == PUBLISHED after the second publish"
            - "response publish_count == 2"
            - "response version == 4 (create 1, publish 2, unpublish 3, publish 4)"

      - name: payout_failed_to_pending_retry_cycle
        grounds:
          - state_machines.Payout.FAILED_to_PENDING
          - state_machines.Payout.PROCESSING_to_FAILED
        distinguishing_aspect: |
          Cycle on Payout (different entity from BookList): PROCESSING ->
          FAILED -> PENDING -> PROCESSING -> PAID; failure_reason is set on
          fail and cleared on retry, and the amount stays frozen across the
          loop.
        test_recipe:
          setup:
            - "ACTIVE store with accrued_balance 13800 from one placed 100000-cent print order (commission 0.30 on net 46000). The payout_release sweep opened a Payout of 13800 (>= 2500 threshold) at place time."
          setup_api_calls:
            - call: "POST /bookshop/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /bookshop/publishers"
              payload: { name: "Riverbend Press", discount_pct: 0.46, returns_allowed: true, return_window_days: 30, return_credit_pct: 0.80 }
              as: PlatformAdmin
              captures: { pub_id: $.data.id }
            - call: "POST /bookshop/books"
              payload: { publisher_id: "${pub_id}", isbn: "9780000000021", title: "Payout Book", format: "PRINT", list_price_cents: 100000 }
              as: PlatformAdmin
              captures: { book_id: $.data.id }
            - call: "POST /bookshop/stores"
              payload: { shop_name: "Retry Books", slug: "retry-books", commission_pct: 0.30 }
              as: PlatformAdmin
              captures: { store_id: $.data.id }
            - call: "POST /bookshop/stores/${store_id}/actions"
              payload: { action: "activate" }
              as: PlatformAdmin
            - call: "POST /bookshop/orders"
              payload:
                customer_id: "cust-5"
                attributed_store_id: "${store_id}"
                lines:
                  - book_id: "${book_id}"
                    quantity: 1
              as: Customer
              as_user_id: "cust-5"
              captures: { order_id: $.data.id }
            - call: "POST /bookshop/orders/${order_id}/actions"
              payload: { action: "place" }
              as: Customer
              as_user_id: "cust-5"
            - call: "GET /bookshop/payouts"
              payload: { affiliate_store_id: "${store_id}" }
              as: FinanceOps
              captures: { payout_id: "$.data[0].id" }
            - call: "POST /bookshop/payouts/${payout_id}/actions"
              payload: { action: "process" }
              as: FinanceOps
            - call: "POST /bookshop/payouts/${payout_id}/actions"
              payload: { action: "fail", failure_reason: "bank_reject" }
              as: FinanceOps
          trigger:
            - call: "POST /bookshop/payouts/${payout_id}/actions"
              payload: { action: "retry" }
              as: FinanceOps
              captures: { retried: $.data }
            - call: "POST /bookshop/payouts/${payout_id}/actions"
              payload: { action: "process" }
              as: FinanceOps
            - call: "POST /bookshop/payouts/${payout_id}/actions"
              payload: { action: "mark-paid" }
              as: FinanceOps
            - call: "GET /bookshop/stores/${store_id}"
              payload: {}
              as: FinanceOps
          assert:
            - "Payout.${payout_id}.amount_cents == 13800 (frozen across the FAILED->PENDING cycle)"
            - "after fail the payout had status FAILED and failure_reason \"bank_reject\"; retry response shows status PENDING and failure_reason null"
            - "after mark-paid: payout status == PAID"
            - "AffiliateStore.${store_id}.accrued_balance_cents == 0 after mark-paid"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: return_credit_cascades_line_order_ledger_balance
        grounds:
          - state_machines.ReturnRequest.RECEIVED_to_CREDITED
          - calculations.return_credit
          - entities.BookOrder.fields.retained_cents
        distinguishing_aspect: |
          Depth-4 cascade triggered by the credit transition: ReturnRequest
          credit -> priced_lines[0].returned_quantity += 1 -> BookOrder
          refunded/retained recompute and payment_status -> REFUNDED_PARTIAL
          -> CommissionLedgerEntry RETURN_CLAWBACK written -> AffiliateStore
          accrued_balance_cents reconciled. Each link is caused by the
          previous one.
        test_recipe:
          setup:
            - "Delivered order: quantity 2 of a 100000-cent print book attributed to an ACTIVE store (commission 0.30, threshold 30000 so no payout fires on the 27600 accrual). A return of 1 unit is APPROVED and RECEIVED."
          setup_api_calls:
            - call: "POST /bookshop/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /bookshop/publishers"
              payload: { name: "Riverbend Press", discount_pct: 0.46, returns_allowed: true, return_window_days: 30, return_credit_pct: 0.80 }
              as: PlatformAdmin
              captures: { pub_id: $.data.id }
            - call: "POST /bookshop/books"
              payload: { publisher_id: "${pub_id}", isbn: "9780000000030", title: "Cascade Book", format: "PRINT", list_price_cents: 100000 }
              as: PlatformAdmin
              captures: { book_id: $.data.id }
            - call: "POST /bookshop/stores"
              payload: { shop_name: "Cascade Books", slug: "cascade-books", commission_pct: 0.30, payout_threshold_cents: 30000 }
              as: PlatformAdmin
              captures: { store_id: $.data.id }
            - call: "POST /bookshop/stores/${store_id}/actions"
              payload: { action: "activate" }
              as: PlatformAdmin
            - call: "POST /bookshop/orders"
              payload:
                customer_id: "cust-6"
                attributed_store_id: "${store_id}"
                lines:
                  - book_id: "${book_id}"
                    quantity: 2
              as: Customer
              as_user_id: "cust-6"
              captures: { order_id: $.data.id }
            - call: "POST /bookshop/orders/${order_id}/actions"
              payload: { action: "place" }
              as: Customer
              as_user_id: "cust-6"
            - call: "POST /bookshop/orders/${order_id}/actions"
              payload: { action: "dispatch" }
              as: WholesalerOps
            - call: "POST /bookshop/orders/${order_id}/actions"
              payload: { action: "ship" }
              as: WholesalerOps
            - call: "POST /bookshop/orders/${order_id}/actions"
              payload: { action: "deliver" }
              as: WholesalerOps
            - call: "POST /bookshop/orders/${order_id}/returns"
              payload: { line_index: 0, quantity: 1, reason_code: "DAMAGED" }
              as: Customer
              as_user_id: "cust-6"
              captures: { return_id: $.data.id }
            - call: "POST /bookshop/returns/${return_id}/actions"
              payload: { action: "approve" }
              as: CustomerService
            - call: "POST /bookshop/returns/${return_id}/actions"
              payload: { action: "receive" }
              as: WholesalerOps
          trigger:
            - call: "POST /bookshop/returns/${return_id}/actions"
              payload: { action: "credit" }
              as: FinanceOps
            - call: "GET /bookshop/orders/${order_id}"
              payload: {}
              as: FinanceOps
            - call: "GET /bookshop/ledger-entries"
              payload: { affiliate_store_id: "${store_id}", kind: "RETURN_CLAWBACK" }
              as: FinanceOps
            - call: "GET /bookshop/stores/${store_id}"
              payload: {}
              as: FinanceOps
          assert:
            - "order priced_lines[0].returned_quantity == 1"
            - "BookOrder.${order_id}.refunded_cents == 100000 and retained_cents == 100000 (gross 200000)"
            - "BookOrder.${order_id}.payment_status == REFUNDED_PARTIAL (refunded 100000 of 200000)"
            - "a RETURN_CLAWBACK entry of -13800 exists (floor(27600 * 1/2) from the final line commission)"
            - "AffiliateStore.${store_id}.accrued_balance_cents == 13800 (27600 - 13800); no payout opened because 13800 < 30000 threshold"
            - "the credited ReturnRequest wholesale_credit_cents == 43200 (floor(54000*1*0.80))"

      - name: pool_distribute_cascades_share_lines_ledger_payout
        grounds:
          - state_machines.ProfitPoolDistribution.APPROVED_to_DISTRIBUTED
          - calculations.payout_release
        distinguishing_aspect: |
          Depth-3 cascade from a different trigger (distribute, not credit):
          DISTRIBUTED -> POOL_DISTRIBUTION ledger entries per eligible store
          -> each store balance reconciled -> payout_release sweep opens a
          Payout only for the store whose balance crossed its threshold.
        test_recipe:
          setup:
            - "Two eligible stores (activated 2026-08-01): store A threshold 2500, store B threshold 60000. EQUAL_SPLIT pool of 60000 over August yields 30000 each. A's balance 30000 >= 2500 triggers a payout; B's 30000 < 60000 does not."
          setup_api_calls:
            - call: "POST /bookshop/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /bookshop/stores"
              payload: { shop_name: "Pool A", slug: "pool-a", commission_pct: 0.30, payout_threshold_cents: 2500 }
              as: PlatformAdmin
              captures: { store_a: $.data.id }
            - call: "POST /bookshop/stores"
              payload: { shop_name: "Pool B", slug: "pool-b", commission_pct: 0.30, payout_threshold_cents: 60000 }
              as: PlatformAdmin
              captures: { store_b: $.data.id }
            - call: "POST /bookshop/stores/${store_a}/actions"
              payload: { action: "activate" }
              as: PlatformAdmin
            - call: "POST /bookshop/stores/${store_b}/actions"
              payload: { action: "activate" }
              as: PlatformAdmin
            - call: "POST /bookshop/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /bookshop/pool-distributions"
              payload: { period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z", pool_cents: 60000, share_mode: "EQUAL_SPLIT" }
              as: FinanceOps
              captures: { dist_id: $.data.id }
            - call: "POST /bookshop/pool-distributions/${dist_id}/actions"
              payload: { action: "calculate" }
              as: FinanceOps
              captures: { dist_v: $.data.version }
            - call: "POST /bookshop/pool-distributions/${dist_id}/actions"
              payload: { action: "approve", expected_distribution_version: "${dist_v}" }
              as: FinanceOps
          trigger:
            - call: "POST /bookshop/pool-distributions/${dist_id}/actions"
              payload: { action: "distribute" }
              as: FinanceOps
            - call: "GET /bookshop/ledger-entries"
              payload: { pool_distribution_id: "${dist_id}", kind: "POOL_DISTRIBUTION" }
              as: FinanceOps
            - call: "GET /bookshop/payouts"
              payload: { affiliate_store_id: "${store_a}" }
              as: FinanceOps
            - call: "GET /bookshop/payouts"
              payload: { affiliate_store_id: "${store_b}" }
              as: FinanceOps
          assert:
            - "distribute response status == DISTRIBUTED"
            - "POOL_DISTRIBUTION ledger entries: store A +30000, store B +30000"
            - "store A accrued_balance_cents == 30000 and store B == 30000"
            - "exactly one Payout exists for store A with amount_cents == 30000 and status PENDING (30000 >= 2500)"
            - "no Payout exists for store B (30000 < 60000 threshold)"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: state_vs_business_safety_on_order_place
        grounds:
          - validations[priority=7]
          - validations[priority=9]
          - errors.ERR_INVALID_STATE
          - errors.ERR_AFFILIATE_NOT_ACTIVE
        distinguishing_aspect: |
          Error-category pair state vs business_safety: a place call on an
          order whose attributed store is SUSPENDED (business_safety,
          priority 9) AND whose fulfillment_status is already CANCELLED
          (state, priority 7) must return ERR_INVALID_STATE — the earlier
          state check masks the affiliate gate.
        test_recipe:
          setup:
            - "ACTIVE store, one LISTED print book. Order created and placed while the store is ACTIVE, then cancelled (fulfillment CANCELLED). Store then suspended. The same cancelled order is the target of a second place."
          setup_api_calls:
            - call: "POST /bookshop/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /bookshop/publishers"
              payload: { name: "Riverbend Press", discount_pct: 0.46, returns_allowed: true, return_window_days: 30, return_credit_pct: 0.80 }
              as: PlatformAdmin
              captures: { pub_id: $.data.id }
            - call: "POST /bookshop/books"
              payload: { publisher_id: "${pub_id}", isbn: "9780000000040", title: "Conflict Book", format: "PRINT", list_price_cents: 100000 }
              as: PlatformAdmin
              captures: { book_id: $.data.id }
            - call: "POST /bookshop/stores"
              payload: { shop_name: "Conflict Books", slug: "conflict-books", commission_pct: 0.30, payout_threshold_cents: 20000 }
              as: PlatformAdmin
              captures: { store_id: $.data.id }
            - call: "POST /bookshop/stores/${store_id}/actions"
              payload: { action: "activate" }
              as: PlatformAdmin
            - call: "POST /bookshop/orders"
              payload:
                customer_id: "cust-7"
                attributed_store_id: "${store_id}"
                lines:
                  - book_id: "${book_id}"
                    quantity: 1
              as: Customer
              as_user_id: "cust-7"
              captures: { order_id: $.data.id }
            - call: "POST /bookshop/orders/${order_id}/actions"
              payload: { action: "place" }
              as: Customer
              as_user_id: "cust-7"
            - call: "POST /bookshop/orders/${order_id}/actions"
              payload: { action: "cancel" }
              as: Customer
              as_user_id: "cust-7"
            - call: "POST /bookshop/stores/${store_id}/actions"
              payload: { action: "suspend" }
              as: PlatformAdmin
          trigger:
            - call: "POST /bookshop/orders/${order_id}/actions"
              payload: { action: "place" }
              as: Customer
              as_user_id: "cust-7"
          assert:
            - "response status 409 with error_id ERR_INVALID_STATE (order CANCELLED is a from-state violation, priority 7)"
            - "the business_safety violation (store SUSPENDED, priority 9) is masked by the earlier state check"
            - "no additional ledger entries were written for the store beyond the original accrual+reversal pair"

      - name: business_temporal_vs_business_referential_on_return_creation
        grounds:
          - validations[priority=15]
          - validations[priority=21]
          - errors.ERR_RETURN_WINDOW_CLOSED
          - errors.ERR_RETURN_QUANTITY_EXCEEDED
        distinguishing_aspect: |
          Error-category pair business_temporal vs business_referential: a
          return requested after the publisher window AND for a quantity
          exceeding the unreturned balance must return
          ERR_RETURN_WINDOW_CLOSED (priority 15) before
          ERR_RETURN_QUANTITY_EXCEEDED (priority 21).
        test_recipe:
          setup:
            - "Delivered order of quantity 1 print book; publisher return_window_days 10, delivery on 2026-09-01. Clock advanced to 2026-09-12T00:00:01Z (11 days later, window closed). The return asks for quantity 5 (exceeds the line) AND is outside the window."
          setup_api_calls:
            - call: "POST /bookshop/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /bookshop/publishers"
              payload: { name: "Narrow Window Press", discount_pct: 0.46, returns_allowed: true, return_window_days: 10, return_credit_pct: 0.80 }
              as: PlatformAdmin
              captures: { pub_id: $.data.id }
            - call: "POST /bookshop/books"
              payload: { publisher_id: "${pub_id}", isbn: "9780000000041", title: "Late Return", format: "PRINT", list_price_cents: 20000 }
              as: PlatformAdmin
              captures: { book_id: $.data.id }
            - call: "POST /bookshop/stores"
              payload: { shop_name: "Temporal Books", slug: "temporal-books", commission_pct: 0.30, payout_threshold_cents: 20000 }
              as: PlatformAdmin
              captures: { store_id: $.data.id }
            - call: "POST /bookshop/stores/${store_id}/actions"
              payload: { action: "activate" }
              as: PlatformAdmin
            - call: "POST /bookshop/orders"
              payload:
                customer_id: "cust-8"
                attributed_store_id: "${store_id}"
                lines:
                  - book_id: "${book_id}"
                    quantity: 1
              as: Customer
              as_user_id: "cust-8"
              captures: { order_id: $.data.id }
            - call: "POST /bookshop/orders/${order_id}/actions"
              payload: { action: "place" }
              as: Customer
              as_user_id: "cust-8"
            - call: "POST /bookshop/orders/${order_id}/actions"
              payload: { action: "dispatch" }
              as: WholesalerOps
            - call: "POST /bookshop/orders/${order_id}/actions"
              payload: { action: "ship" }
              as: WholesalerOps
            - call: "POST /bookshop/orders/${order_id}/actions"
              payload: { action: "deliver" }
              as: WholesalerOps
            - call: "POST /bookshop/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-12T00:00:01Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /bookshop/orders/${order_id}/returns"
              payload: { line_index: 0, quantity: 5, reason_code: "UNWANTED" }
              as: Customer
              as_user_id: "cust-8"
          assert:
            - "response status 422 with error_id ERR_RETURN_WINDOW_CLOSED (priority 15 temporal check fires first)"
            - "ERR_RETURN_QUANTITY_EXCEEDED (priority 21) is masked even though quantity 5 > unreturned 1"
            - "no ReturnRequest row is created (GET /bookshop/orders/${order_id}/returns returns an empty array)"

  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: payout_threshold_exact_equality_releases
        grounds:
          - calculations.payout_release
        distinguishing_aspect: |
          Metric: accrued balance vs payout threshold (>= releases). A partner
          whose balance lands exactly on the 1000-cent floor threshold gets a
          payout; one at 750 does not. Reachable via the order-place sweep.
        test_recipe:
          setup:
            - "Two ACTIVE partners (commission 0.10, threshold 1000). Ebooks: 10000 cents (partner LOW earns floor((10000-2500)*0.10)=750) and 13333 cents (partner EQ earns floor((13333-3333)*0.10)=1000 exactly)."
          setup_api_calls:
            - call: "POST /bookshop/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /bookshop/publishers"
              payload: { name: "Digital Press", discount_pct: 0.0, returns_allowed: false, return_window_days: 0, return_credit_pct: 0.0 }
              as: PlatformAdmin
              captures: { pub_id: $.data.id }
            - call: "POST /bookshop/books"
              payload: { publisher_id: "${pub_id}", isbn: "9780000000050", title: "Cheap Ebook", format: "EBOOK", list_price_cents: 10000, ebook_partner_rev_share_pct: 0.25 }
              as: PlatformAdmin
              captures: { book_cheap: $.data.id }
            - call: "POST /bookshop/books"
              payload: { publisher_id: "${pub_id}", isbn: "9780000000051", title: "Exact Ebook", format: "EBOOK", list_price_cents: 13333, ebook_partner_rev_share_pct: 0.25 }
              as: PlatformAdmin
              captures: { book_exact: $.data.id }
            - call: "POST /bookshop/partners"
              payload: { display_name: "Below Threshold", partner_kind: "AUTHOR", commission_pct: 0.10, payout_threshold_cents: 1000 }
              as: PlatformAdmin
              captures: { partner_low: $.data.id }
            - call: "POST /bookshop/partners/${partner_low}/actions"
              payload: { action: "approve" }
              as: PlatformAdmin
            - call: "POST /bookshop/partners/${partner_low}/actions"
              payload: { action: "activate" }
              as: PlatformAdmin
            - call: "POST /bookshop/partners"
              payload: { display_name: "Exact Threshold", partner_kind: "INFLUENCER", commission_pct: 0.10, payout_threshold_cents: 1000 }
              as: PlatformAdmin
              captures: { partner_eq: $.data.id }
            - call: "POST /bookshop/partners/${partner_eq}/actions"
              payload: { action: "approve" }
              as: PlatformAdmin
            - call: "POST /bookshop/partners/${partner_eq}/actions"
              payload: { action: "activate" }
              as: PlatformAdmin
            - call: "POST /bookshop/orders"
              payload:
                customer_id: "cust-9"
                attributed_partner_id: "${partner_low}"
                lines:
                  - book_id: "${book_cheap}"
                    quantity: 1
              as: Customer
              as_user_id: "cust-9"
              captures: { order_low: $.data.id }
            - call: "POST /bookshop/orders/${order_low}/actions"
              payload: { action: "place" }
              as: Customer
              as_user_id: "cust-9"
            - call: "POST /bookshop/orders"
              payload:
                customer_id: "cust-9"
                attributed_partner_id: "${partner_eq}"
                lines:
                  - book_id: "${book_exact}"
                    quantity: 1
              as: Customer
              as_user_id: "cust-9"
              captures: { order_eq: $.data.id }
          trigger:
            - call: "POST /bookshop/orders/${order_eq}/actions"
              payload: { action: "place" }
              as: Customer
              as_user_id: "cust-9"
            - call: "GET /bookshop/payouts"
              payload: { affiliate_partner_id: "${partner_low}" }
              as: FinanceOps
            - call: "GET /bookshop/payouts"
              payload: { affiliate_partner_id: "${partner_eq}" }
              as: FinanceOps
            - call: "GET /bookshop/partners/${partner_low}"
              payload: {}
              as: FinanceOps
            - call: "GET /bookshop/partners/${partner_eq}"
              payload: {}
              as: FinanceOps
          assert:
            - "partner LOW accrued_balance_cents == 750 (floor((10000-2500)*0.10)) and NO payout exists for LOW (750 < 1000)"
            - "partner EQ accrued_balance_cents == 1000 (floor((13333-3333)*0.10) = 1000 exactly)"
            - "exactly one Payout for EQ with amount_cents == 1000 (>= boundary releases)"

      - name: pool_eligibility_exactly_fourteen_active_days
        grounds:
          - calculations.pool_eligibility
          - state_machines.ProfitPoolDistribution.DRAFT_to_CALCULATED
        distinguishing_aspect: |
          Metric: ACTIVE-day count vs MIN_ACTIVE_DAYS (>= 14 eligible), a
          different metric from the payout balance and reached via pool
          calculate. A store activated 2026-08-18T00:00:00Z (exactly 14 whole
          days inside Aug 1..Sep 1) is eligible; one activated 2026-08-19
          (13 days) is not.
        test_recipe:
          setup:
            - "Store EARLY activated 2026-08-01 (31 days). Store EDGE created 2026-08-01 but activated 2026-08-18T00:00:00Z (exactly 14 whole days: Aug 18..31). Store LATE activated 2026-08-19T00:00:00Z (13 days). All pool_opt_in true. Period Aug 1..Sep 1, EQUAL_SPLIT, pool 30000."
