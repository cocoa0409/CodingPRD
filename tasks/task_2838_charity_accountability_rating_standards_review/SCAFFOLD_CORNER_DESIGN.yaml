      - name: methodology_projection_grants_transition_relief_at_exactly_minus_five
        claim_type: Correct Result
        grounds:
          - calculations.methodology_impact_projection
          - endpoints.POST_/methodology-versions/{methodology_version_id}/adopt
          - entities.TransitionGrant.fields.projected_score_delta
          - entities.Organization.fields.transition_grace_until
          - calculations.workflow_deadline_windows
        distinguishing_aspect: |
          The projection is a replay, not a re-rating: it re-runs the final
          variant over the STORED DimensionScore rows of the organization's
          highest-sequence publication using the NEW weights, and never re-reads
          a filing or a governance profile. The successor's weights are chosen so
          the replay lands on the threshold exactly - 47.13 + 8.75 + 10.00 +
          13.75 = 79.63, band B, less 1.50 for the one failed standard = 78.13,
          which is 5.00 below the published 83.13 - and the grant threshold is
          inclusive at -5.00, so relief is granted. The retirement cascade is
          three hops deep and its order matters: hop 1 retires M1 and OVERWRITES
          its effective_until with the successor's effective_from, hop 2 projects
          and creates the grant, hop 3 copies the grace date onto the
          organization.
