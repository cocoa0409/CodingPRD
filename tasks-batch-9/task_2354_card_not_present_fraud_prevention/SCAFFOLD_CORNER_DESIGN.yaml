              captures: { asmt_id: $.data.id }
            - call: "POST /fraud/checkout-assessments/${asmt_id}/score"
              payload: {}
              as: CheckoutService
            - call: "GET /fraud/review-cases"
              payload: { assessment_id: "${asmt_id}" }
              as: ReviewLead
              as_user_id: "${an1_id}"
              captures: { case_id: "$.data[0].id" }
            - call: "GET /fraud/customers/${cust_id}"
              payload: {}
              as: RiskAnalyst
              as_user_id: "${an1_id}"
              captures: { cust_v: $.data.version }
            - call: "POST /fraud/policy-exceptions"
              payload: { customer_id: "${cust_id}", scope: "ADDRESS_WHITELIST", max_amount_cents: 50000, effective_from: "2026-08-01T00:00:00Z", expires_at: "2026-09-01T00:00:00Z", justification: "buyer confirmed the drop address", whitelisted_address_id: "${addr_id}" }
              as: RiskAnalyst
              as_user_id: "${an1_id}"
              captures: { exc_id: $.data.id }
          trigger:
            - call: "POST /fraud/review-cases/${case_id}/assign"
              payload: { analyst_id: "${an1_id}", expected_analyst_version: "${an1_v}" }
              as: RiskAnalyst
              as_user_id: "${an1_id}"
            - call: "POST /fraud/review-cases/${case_id}/auto-assign"
