scaffold_corner_design:
  - section: entities
    instances:
      - name: landlord_create_returns_201_and_stored_fields
        claim_type: creation
        grounds: [entities.Landlord, "endpoints['POST /hcv/landlords']"]
        distinguishing_aspect: "POST /hcv/landlords with all required fields returns 201 and the stored legal_name, tax_id, and default status ACTIVE."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /hcv/landlords"
              payload: { legal_name: "Corner L1", tax_id: "CT1" }
              as: HousingAuthorityAdmin
              captures: { cl1_id: $.data.id, cl1_status: $.data.status }
          assert:
            - "response has id, created_at, updated_at, version == 1"
            - "Landlord.${cl1_id}.status == ACTIVE"
            - "Landlord.${cl1_id}.legal_name == 'Corner L1'"
      - name: landlord_get_not_found
        claim_type: not_found
        grounds: [entities.Landlord, "endpoints['GET /hcv/landlords/{id}']", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET with a non-existent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /hcv/landlords/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: HousingAuthorityAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND"
      - name: payment_standard_effective_to_default_null
        claim_type: defaults
        grounds: [entities.PaymentStandard.fields.effective_to]
        distinguishing_aspect: "Omitting effective_to on POST /hcv/payment-standards stores null (open-ended)."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /hcv/payment-standards"
              payload: { zip_code: "90210", bedroom_count: 3, amount_cents: 250000, effective_from: "2026-01-01" }
              as: HousingAuthorityAdmin
              captures: { ps_id: $.data.id, ps_to: $.data.effective_to }
          assert:
            - "PaymentStandard.${ps_id}.effective_to is null"
      - name: hap_payment_immutable_common_fields_false
        claim_type: immutability
        grounds: [entities.HAPPayment]
        distinguishing_aspect: "HAPPayment declares common_fields: false — it has id and created_at but no version field; no update endpoint exists."
        test_recipe:
          setup:
            - "An active contract with one scheduled HAPPayment"
          setup_api_calls:
            - call: "POST /hcv/landlords"
              payload: { legal_name: "CL2", tax_id: "CT2" }
              as: HousingAuthorityAdmin
              captures: { cl2_id: $.data.id }
            - call: "POST /hcv/payment-standards"
              payload: { zip_code: "90300", bedroom_count: 1, amount_cents: 150000, effective_from: "2026-01-01" }
              as: HousingAuthorityAdmin
            - call: "POST /hcv/properties"
              payload: { landlord_id: "${cl2_id}", address: "2 S St", zip_code: "90300" }
              as: HousingAuthorityAdmin
              captures: { cp2_id: $.data.id }
            - call: "POST /hcv/properties/${cp2_id}/units"
              payload: { unit_label: "CU2", bedroom_count: 1 }
              as: HousingAuthorityAdmin
              captures: { cu2_id: $.data.id, cu2_v: $.data.version }
            - call: "POST /hcv/voucher-families"
              payload: { family_code: "CF2", voucher_bedroom_size: 1, annual_income_cents: 2400000 }
              as: HousingAuthorityAdmin
              captures: { cf2_id: $.data.id }
            - call: "POST /hcv/contracts"
              payload: { unit_id: "${cu2_id}", family_id: "${cf2_id}", contract_rent_cents: 150000, lease_start_date: "2026-08-01", expected_unit_version: "${cu2_v}" }
              as: Landlord
              as_user_id: "${cl2_id}"
              captures: { cc2_id: $.data.id }
            - call: "POST /hcv/contracts/${cc2_id}/submit"
              payload: {}
              as: Landlord
              as_user_id: "${cl2_id}"
            - call: "POST /hcv/contracts/${cc2_id}/activate"
              payload: {}
              as: HousingAuthorityAdmin
          trigger:
            - call: "GET /hcv/contracts/${cc2_id}/hap-payments"
              payload: {}
              as: HousingAuthorityAdmin
          assert:
            - "Each returned HAPPayment has id and created_at and no version key"

  - section: state_machines
    instances:
      - name: unit_delist_from_under_contract_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Unit, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Delist is defined only from LISTED; from UNDER_CONTRACT it returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["Unit UNDER_CONTRACT (DRAFT contract exists)"]
          setup_api_calls:
            - call: "POST /hcv/landlords"
              payload: { legal_name: "CL3", tax_id: "CT3" }
              as: HousingAuthorityAdmin
              captures: { cl3_id: $.data.id }
            - call: "POST /hcv/properties"
              payload: { landlord_id: "${cl3_id}", address: "3 S St", zip_code: "90301" }
              as: HousingAuthorityAdmin
              captures: { cp3_id: $.data.id }
            - call: "POST /hcv/properties/${cp3_id}/units"
              payload: { unit_label: "CU3", bedroom_count: 1 }
              as: HousingAuthorityAdmin
              captures: { cu3_id: $.data.id, cu3_v: $.data.version }
            - call: "POST /hcv/voucher-families"
              payload: { family_code: "CF3", voucher_bedroom_size: 1, annual_income_cents: 2400000 }
              as: HousingAuthorityAdmin
              captures: { cf3_id: $.data.id }
            - call: "POST /hcv/contracts"
              payload: { unit_id: "${cu3_id}", family_id: "${cf3_id}", contract_rent_cents: 150000, lease_start_date: "2026-08-01", expected_unit_version: "${cu3_v}" }
              as: Landlord
              as_user_id: "${cl3_id}"
          trigger:
            - call: "POST /hcv/units/${cu3_id}/delist"
              payload: {}
              as: Landlord
              as_user_id: "${cl3_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE"
      - name: recertification_terminal_lockdown
        claim_type: terminal_lockdown
        grounds: [state_machines.Recertification]
        distinguishing_aspect: "A COMPLETED recertification accepts no further transitions; completing it again returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["Recertification already COMPLETED"]
          setup_api_calls:
            - call: "POST /hcv/landlords"
              payload: { legal_name: "CL4", tax_id: "CT4" }
              as: HousingAuthorityAdmin
              captures: { cl4_id: $.data.id }
            - call: "POST /hcv/payment-standards"
              payload: { zip_code: "90302", bedroom_count: 1, amount_cents: 150000, effective_from: "2026-01-01" }
              as: HousingAuthorityAdmin
            - call: "POST /hcv/properties"
              payload: { landlord_id: "${cl4_id}", address: "4 S St", zip_code: "90302" }
              as: HousingAuthorityAdmin
              captures: { cp4_id: $.data.id }
            - call: "POST /hcv/properties/${cp4_id}/units"
              payload: { unit_label: "CU4", bedroom_count: 1 }
              as: HousingAuthorityAdmin
              captures: { cu4_id: $.data.id, cu4_v: $.data.version }
            - call: "POST /hcv/voucher-families"
              payload: { family_code: "CF4", voucher_bedroom_size: 1, annual_income_cents: 2400000 }
              as: HousingAuthorityAdmin
              captures: { cf4_id: $.data.id }
            - call: "POST /hcv/contracts"
              payload: { unit_id: "${cu4_id}", family_id: "${cf4_id}", contract_rent_cents: 150000, lease_start_date: "2026-08-01", expected_unit_version: "${cu4_v}" }
              as: Landlord
              as_user_id: "${cl4_id}"
              captures: { cc4_id: $.data.id }
            - call: "POST /hcv/contracts/${cc4_id}/submit"
              payload: {}
              as: Landlord
              as_user_id: "${cl4_id}"
            - call: "POST /hcv/contracts/${cc4_id}/activate"
              payload: {}
              as: HousingAuthorityAdmin
              captures: { cc4_v: $.data.version }
            - call: "POST /hcv/recertifications"
              payload: { contract_id: "${cc4_id}", due_date: "2027-08-01", new_family_income_cents: 3000000 }
              as: HousingAuthorityAdmin
              captures: { rec4_id: $.data.id }
            - call: "POST /hcv/recertifications/${rec4_id}/complete"
              payload: { expected_contract_version: "${cc4_v}" }
              as: HousingAuthorityAdmin
          trigger:
            - call: "POST /hcv/recertifications/${rec4_id}/complete"
              payload: { expected_contract_version: "${cc4_v}" }
              as: HousingAuthorityAdmin
              captures: { err: $.data.error_id }
          assert:
            - "Second complete on COMPLETED recertification returns ERR_INVALID_STATE or ERR_STALE_VERSION"
      - name: voucher_family_initial_state_searching
        claim_type: initial_state
        grounds: [state_machines.VoucherFamily]
        distinguishing_aspect: "A newly created VoucherFamily starts in SEARCHING."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /hcv/voucher-families"
              payload: { family_code: "CF5", voucher_bedroom_size: 2, annual_income_cents: 1000000 }
              as: HousingAuthorityAdmin
              captures: { cf5_id: $.data.id, cf5_status: $.data.status }
          assert:
            - "VoucherFamily.${cf5_id}.status == SEARCHING"

  - section: calculations
    instances:
      - name: rent_reasonableness_comparable_recency_filter
        claim_type: input_set_filtering
        grounds: [calculations.rent_reasonableness]
        distinguishing_aspect: "Comparables older than 12 months are excluded; a stale comparable at survey_date 2025-01-01 does not pull the cap below payment_standard."
        test_recipe:
          setup: ["PS(90303,1BR)=150000; one comparable 100000 surveyed 2025-01-01 (>12 months before 2026-08-01)"]
          setup_api_calls:
            - call: "POST /hcv/landlords"
              payload: { legal_name: "CL6", tax_id: "CT6" }
              as: HousingAuthorityAdmin
              captures: { cl6_id: $.data.id }
            - call: "POST /hcv/payment-standards"
              payload: { zip_code: "90303", bedroom_count: 1, amount_cents: 150000, effective_from: "2026-01-01" }
              as: HousingAuthorityAdmin
            - call: "POST /hcv/rent-comparables"
              payload: { zip_code: "90303", bedroom_count: 1, rent_cents: 100000, survey_date: "2025-01-01" }
              as: HousingAuthorityAdmin
            - call: "POST /hcv/properties"
              payload: { landlord_id: "${cl6_id}", address: "6 S St", zip_code: "90303" }
              as: HousingAuthorityAdmin
              captures: { cp6_id: $.data.id }
            - call: "POST /hcv/properties/${cp6_id}/units"
              payload: { unit_label: "CU6", bedroom_count: 1 }
              as: HousingAuthorityAdmin
              captures: { cu6_id: $.data.id, cu6_v: $.data.version }
            - call: "POST /hcv/voucher-families"
              payload: { family_code: "CF6", voucher_bedroom_size: 1, annual_income_cents: 2400000 }
              as: HousingAuthorityAdmin
              captures: { cf6_id: $.data.id }
            - call: "POST /hcv/contracts"
              payload: { unit_id: "${cu6_id}", family_id: "${cf6_id}", contract_rent_cents: 200000, lease_start_date: "2026-08-01", expected_unit_version: "${cu6_v}" }
              as: Landlord
              as_user_id: "${cl6_id}"
              captures: { cc6_id: $.data.id }
          trigger:
            - call: "POST /hcv/contracts/${cc6_id}/submit"
              payload: {}
              as: Landlord
              as_user_id: "${cl6_id}"
          assert:
            - "Stale comparable excluded: approved_rent_cents == 150000 (payment_standard cap), not min(150000, 110000)"
      - name: hap_split_income_ratio_constant
        claim_type: constants_applied
        grounds: [calculations.hap_split]
        distinguishing_aspect: "INCOME_RATIO 0.30 applied: income 3600000/yr -> tenant_minimum = round(3600000*0.30/12) = 90000."
        test_recipe:
          setup: ["Family income 3600000; PS 150000; contract rent 150000"]
          setup_api_calls:
            - call: "POST /hcv/landlords"
              payload: { legal_name: "CL7", tax_id: "CT7" }
              as: HousingAuthorityAdmin
              captures: { cl7_id: $.data.id }
            - call: "POST /hcv/payment-standards"
              payload: { zip_code: "90304", bedroom_count: 1, amount_cents: 150000, effective_from: "2026-01-01" }
              as: HousingAuthorityAdmin
            - call: "POST /hcv/properties"
              payload: { landlord_id: "${cl7_id}", address: "7 S St", zip_code: "90304" }
              as: HousingAuthorityAdmin
              captures: { cp7_id: $.data.id }
            - call: "POST /hcv/properties/${cp7_id}/units"
              payload: { unit_label: "CU7", bedroom_count: 1 }
              as: HousingAuthorityAdmin
              captures: { cu7_id: $.data.id, cu7_v: $.data.version }
            - call: "POST /hcv/voucher-families"
              payload: { family_code: "CF7", voucher_bedroom_size: 1, annual_income_cents: 3600000 }
              as: HousingAuthorityAdmin
              captures: { cf7_id: $.data.id }
            - call: "POST /hcv/contracts"
              payload: { unit_id: "${cu7_id}", family_id: "${cf7_id}", contract_rent_cents: 150000, lease_start_date: "2026-08-01", expected_unit_version: "${cu7_v}" }
              as: Landlord
              as_user_id: "${cl7_id}"
              captures: { cc7_id: $.data.id }
          trigger:
            - call: "POST /hcv/contracts/${cc7_id}/submit"
              payload: {}
              as: Landlord
              as_user_id: "${cl7_id}"
          assert:
            - "tenant_portion_cents == 90000 (0.30 ratio applied)"
            - "hap_portion_cents == 60000 (150000 - 90000)"

  - section: validations
    instances:
      - name: voucher_size_mismatch_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=10]", "errors[ERR_VOUCHER_SIZE_MISMATCH]"]
        distinguishing_aspect: "Family voucher 1BR against a 2BR unit returns ERR_VOUCHER_SIZE_MISMATCH."
        test_recipe:
          setup: ["Unit 2BR LISTED; family voucher 1BR"]
          setup_api_calls:
            - call: "POST /hcv/landlords"
              payload: { legal_name: "CL8", tax_id: "CT8" }
              as: HousingAuthorityAdmin
              captures: { cl8_id: $.data.id }
            - call: "POST /hcv/properties"
              payload: { landlord_id: "${cl8_id}", address: "8 S St", zip_code: "90305" }
              as: HousingAuthorityAdmin
              captures: { cp8_id: $.data.id }
            - call: "POST /hcv/properties/${cp8_id}/units"
              payload: { unit_label: "CU8", bedroom_count: 2 }
              as: HousingAuthorityAdmin
              captures: { cu8_id: $.data.id, cu8_v: $.data.version }
            - call: "POST /hcv/voucher-families"
              payload: { family_code: "CF8", voucher_bedroom_size: 1, annual_income_cents: 2400000 }
              as: HousingAuthorityAdmin
              captures: { cf8_id: $.data.id }
          trigger:
            - call: "POST /hcv/contracts"
              payload: { unit_id: "${cu8_id}", family_id: "${cf8_id}", contract_rent_cents: 150000, lease_start_date: "2026-08-01", expected_unit_version: "${cu8_v}" }
              as: Landlord
              as_user_id: "${cl8_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_VOUCHER_SIZE_MISMATCH"
      - name: rent_increase_too_early_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=8]", "errors[ERR_INCREASE_TOO_EARLY]"]
        distinguishing_aspect: "effective_date before next_recert_due_date returns ERR_INCREASE_TOO_EARLY."
        test_recipe:
          setup: ["Active contract with next_recert_due_date 2027-08-01"]
          setup_api_calls:
            - call: "POST /hcv/landlords"
              payload: { legal_name: "CL9", tax_id: "CT9" }
              as: HousingAuthorityAdmin
              captures: { cl9_id: $.data.id }
            - call: "POST /hcv/payment-standards"
              payload: { zip_code: "90306", bedroom_count: 1, amount_cents: 150000, effective_from: "2026-01-01" }
              as: HousingAuthorityAdmin
            - call: "POST /hcv/properties"
              payload: { landlord_id: "${cl9_id}", address: "9 S St", zip_code: "90306" }
              as: HousingAuthorityAdmin
              captures: { cp9_id: $.data.id }
            - call: "POST /hcv/properties/${cp9_id}/units"
              payload: { unit_label: "CU9", bedroom_count: 1 }
              as: HousingAuthorityAdmin
              captures: { cu9_id: $.data.id, cu9_v: $.data.version }
            - call: "POST /hcv/voucher-families"
              payload: { family_code: "CF9", voucher_bedroom_size: 1, annual_income_cents: 2400000 }
              as: HousingAuthorityAdmin
              captures: { cf9_id: $.data.id }
            - call: "POST /hcv/contracts"
              payload: { unit_id: "${cu9_id}", family_id: "${cf9_id}", contract_rent_cents: 150000, lease_start_date: "2026-08-01", expected_unit_version: "${cu9_v}" }
              as: Landlord
              as_user_id: "${cl9_id}"
              captures: { cc9_id: $.data.id }
            - call: "POST /hcv/contracts/${cc9_id}/submit"
              payload: {}
              as: Landlord
              as_user_id: "${cl9_id}"
            - call: "POST /hcv/contracts/${cc9_id}/activate"
              payload: {}
              as: HousingAuthorityAdmin
          trigger:
            - call: "POST /hcv/rent-increase-requests"
              payload: { contract_id: "${cc9_id}", requested_rent_cents: 160000, effective_date: "2027-01-01" }
              as: Landlord
              as_user_id: "${cl9_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INCREASE_TOO_EARLY (2027-01-01 < 2027-08-01)"
      - name: schedule_inspection_in_past_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_SCHEDULE_IN_PAST]"]
        distinguishing_aspect: "scheduled_date 2026-07-01 with clock at 2026-08-01 returns ERR_SCHEDULE_IN_PAST."
        test_recipe:
          setup: ["Active contract; clock at default 2026-08-01"]
          setup_api_calls:
            - call: "POST /hcv/landlords"
              payload: { legal_name: "CL10", tax_id: "CT10" }
              as: HousingAuthorityAdmin
              captures: { cl10_id: $.data.id }
            - call: "POST /hcv/payment-standards"
              payload: { zip_code: "90307", bedroom_count: 1, amount_cents: 150000, effective_from: "2026-01-01" }
              as: HousingAuthorityAdmin
            - call: "POST /hcv/properties"
              payload: { landlord_id: "${cl10_id}", address: "10 S St", zip_code: "90307" }
              as: HousingAuthorityAdmin
              captures: { cp10_id: $.data.id }
            - call: "POST /hcv/properties/${cp10_id}/units"
              payload: { unit_label: "CU10", bedroom_count: 1 }
              as: HousingAuthorityAdmin
              captures: { cu10_id: $.data.id, cu10_v: $.data.version }
            - call: "POST /hcv/voucher-families"
              payload: { family_code: "CF10", voucher_bedroom_size: 1, annual_income_cents: 2400000 }
              as: HousingAuthorityAdmin
              captures: { cf10_id: $.data.id }
            - call: "POST /hcv/contracts"
              payload: { unit_id: "${cu10_id}", family_id: "${cf10_id}", contract_rent_cents: 150000, lease_start_date: "2026-08-01", expected_unit_version: "${cu10_v}" }
              as: Landlord
              as_user_id: "${cl10_id}"
              captures: { cc10_id: $.data.id }
            - call: "POST /hcv/contracts/${cc10_id}/submit"
              payload: {}
              as: Landlord
              as_user_id: "${cl10_id}"
            - call: "POST /hcv/contracts/${cc10_id}/activate"
              payload: {}
              as: HousingAuthorityAdmin
          trigger:
            - call: "POST /hcv/contracts/${cc10_id}/inspections"
              payload: { inspection_type: "ANNUAL", scheduled_date: "2026-07-01" }
              as: HousingAuthorityAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_SCHEDULE_IN_PAST"
      - name: reinspection_with_open_items_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=15]", "errors[ERR_OPEN_REPAIR_ITEMS]"]
        distinguishing_aspect: "request-reinspection while a RepairItem is still OPEN returns ERR_OPEN_REPAIR_ITEMS."
        test_recipe:
          setup: ["FAILED inspection with one OPEN repair item"]
          setup_api_calls:
            - call: "POST /hcv/landlords"
              payload: { legal_name: "CL11", tax_id: "CT11" }
              as: HousingAuthorityAdmin
              captures: { cl11_id: $.data.id }
            - call: "POST /hcv/payment-standards"
              payload: { zip_code: "90308", bedroom_count: 1, amount_cents: 150000, effective_from: "2026-01-01" }
              as: HousingAuthorityAdmin
            - call: "POST /hcv/properties"
              payload: { landlord_id: "${cl11_id}", address: "11 S St", zip_code: "90308" }
              as: HousingAuthorityAdmin
              captures: { cp11_id: $.data.id }
            - call: "POST /hcv/properties/${cp11_id}/units"
              payload: { unit_label: "CU11", bedroom_count: 1 }
              as: HousingAuthorityAdmin
              captures: { cu11_id: $.data.id, cu11_v: $.data.version }
            - call: "POST /hcv/voucher-families"
              payload: { family_code: "CF11", voucher_bedroom_size: 1, annual_income_cents: 2400000 }
              as: HousingAuthorityAdmin
              captures: { cf11_id: $.data.id }
            - call: "POST /hcv/contracts"
              payload: { unit_id: "${cu11_id}", family_id: "${cf11_id}", contract_rent_cents: 150000, lease_start_date: "2026-08-01", expected_unit_version: "${cu11_v}" }
              as: Landlord
              as_user_id: "${cl11_id}"
              captures: { cc11_id: $.data.id }
            - call: "POST /hcv/contracts/${cc11_id}/submit"
              payload: {}
              as: Landlord
              as_user_id: "${cl11_id}"
            - call: "POST /hcv/contracts/${cc11_id}/activate"
              payload: {}
              as: HousingAuthorityAdmin
            - call: "POST /hcv/contracts/${cc11_id}/inspections"
              payload: { inspection_type: "ANNUAL", scheduled_date: "2026-08-05" }
              as: HousingAuthorityAdmin
              captures: { ci11_id: $.data.id }
            - call: "POST /hcv/inspections/${ci11_id}/repair-items"
              payload: { description: "leak", is_life_threatening: false }
              as: Inspector
            - call: "POST /hcv/inspections/${ci11_id}/record-result"
              payload: { outcome: "FAIL" }
              as: Inspector
          trigger:
            - call: "POST /hcv/inspections/${ci11_id}/request-reinspection"
              payload: {}
              as: Landlord
              as_user_id: "${cl11_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_OPEN_REPAIR_ITEMS"

  - section: endpoints
    instances:
      - name: list_landlords_pagination_envelope
        claim_type: computed_read
        grounds: ["endpoints['GET /hcv/landlords']", response_envelope]
        distinguishing_aspect: "GET /hcv/landlords returns response_type array with pagination fields limit, offset, total_count, has_more."
        test_recipe:
          setup: ["Two landlords exist"]
          setup_api_calls:
            - call: "POST /hcv/landlords"
              payload: { legal_name: "PL1", tax_id: "PT1" }
              as: HousingAuthorityAdmin
            - call: "POST /hcv/landlords"
              payload: { legal_name: "PL2", tax_id: "PT2" }
              as: HousingAuthorityAdmin
          trigger:
            - call: "GET /hcv/landlords"
              payload: { limit: 1, offset: 0 }
