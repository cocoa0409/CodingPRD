  - rule_id: non_linear_state_machine
    instances:
      - name: recipe_reject_reopen_resubmit_cycle_reenters_draft
        grounds:
          - state_machines.BlendRecipe.SUBMITTED_to_REJECTED
          - state_machines.BlendRecipe.REJECTED_to_DRAFT
          - state_machines.BlendRecipe.DRAFT_to_SUBMITTED
          - segregation_of_duties_rules[recipe_approver_distinct_from_submitter]
        distinguishing_aspect: |
          BlendRecipe.status is not a one-way ladder: REJECTED loops back to DRAFT via reopen and
          the entity re-enters SUBMITTED a second time, and the loop is observable because reopen
          clears BOTH submitted_by_user_id and rejection_reason so the second pass is stamped with
          a different engineer (u-be-2) than the first (u-be-1).
        test_recipe:
          setup:
            - "non-food product P-NF-1 and resin LL-1001 registered"
            - "recipe R-NF-0 = 100 % LL-1001 SUBMITTED by u-be-1"
          setup_api_calls:
            - *a_clock_d1_0600
            - *a_p_nf
            - *a_g_ll
            - *a_line_nf
            - *a_pool_nf
            - &a_r0_new { call: "POST /blend-recipes", payload: { recipe_code: "R-NF-0", product_id: "${p_nf}", process_type: "BLOWN", layer_count: 1 }, as: BlendEngineer, captures: { r0: "$.data.id" } }
            - &a_r0_c1 { call: "POST /blend-recipes/${r0}/components", payload: { layer_index: 1, component_kind: "VIRGIN", weight_pct: 100.0, resin_grade_id: "${g_ll}" }, as: BlendEngineer }
            - &a_r0_sub { call: "POST /blend-recipes/${r0}/submit", payload: {}, as: BlendEngineer, as_user_id: "u-be-1" }
          trigger:
            - { call: "POST /blend-recipes/${r0}/reject", payload: { rejection_reason: "slip additive package not qualified for this customer" }, as: QualityManager, as_user_id: "u-qm-1" }
            - { call: "POST /blend-recipes/${r0}/reopen", payload: {}, as: BlendEngineer, as_user_id: "u-be-1" }
            - { call: "POST /blend-recipes/${r0}/submit", payload: {}, as: BlendEngineer, as_user_id: "u-be-2" }
            - { call: "POST /blend-recipes/${r0}/approve", payload: {}, as: QualityManager, as_user_id: "u-qm-1" }
          assert:
            - "after reject: BlendRecipe.${r0}.status == REJECTED and rejection_reason == 'slip additive package not qualified for this customer'"
            - "after reopen: BlendRecipe.${r0}.status == DRAFT"
            - "after reopen: BlendRecipe.${r0}.rejection_reason == null and submitted_by_user_id == null"
            - "after reopen: BlendRecipe.${r0}.total_weight_pct == 100.000 (components survive the loop)"
            - "after the second submit: BlendRecipe.${r0}.status == SUBMITTED and submitted_by_user_id == 'u-be-2'"
            - "after the second submit: BlendRecipe.${r0}.strength_index == 42.00 and blend_cost_per_kg == 1.45"
            - "after approve: BlendRecipe.${r0}.status == APPROVED and approved_by_user_id == 'u-qm-1'"
            - "after approve: BlendRecipe.${r0}.food_contact_eligible == true"
      - name: run_hold_resume_cycle_bounded_by_max_run_holds
        grounds:
          - state_machines.ExtrusionRun.RUNNING_to_HELD
          - state_machines.ExtrusionRun.HELD_to_RUNNING
          - errors[ERR_RUN_HOLD_LIMIT_EXCEEDED]
          - entities.ExtrusionRun.fields.hold_count
          - entities.ExtrusionLine.fields.active_hold_count
        distinguishing_aspect: |
          ExtrusionRun.status loops RUNNING -> HELD -> RUNNING an unbounded number of times as far
          as the transition table is concerned, but a monotone hold_count terminates the loop: the
          fourth hold leaves hold_count at 4 and resume is then rejected with
          ERR_RUN_HOLD_LIMIT_EXCEEDED, so the cycle has a bound the graph alone does not express.
        test_recipe:
          setup:
            - "non-food product P-NF-1 on line L-NF with APPROVED recipe R-NF-0"
            - "RUN-NF-1 RUNNING at logical clock 2026-08-05T06:00:00Z"
            - "MAX_RUN_HOLDS is 3"
          setup_api_calls:
            - *a_clock_d1_0600
            - *a_p_nf
            - *a_g_ll
            - *a_line_nf
            - *a_pool_nf
            - *a_r0_new
            - *a_r0_c1
            - *a_r0_sub
            - &a_r0_app { call: "POST /blend-recipes/${r0}/approve", payload: {}, as: QualityManager, as_user_id: "u-qm-1" }
            - &a_run1_new { call: "POST /extrusion-runs", payload: { run_code: "RUN-NF-1", line_id: "${line_nf}", blend_recipe_id: "${r0}", scheduled_start: "2026-08-05T06:00:00Z", scheduled_end: "2026-08-05T14:00:00Z", target_output_kg: 500.0 }, as: ExtrusionOperator, captures: { run1: "$.data.id" } }
            - &a_run1_start { call: "POST /extrusion-runs/${run1}/start", payload: {}, as: ExtrusionOperator }
          trigger:
            - { call: "POST /extrusion-runs/${run1}/hold", payload: { hold_reason: "die lip cleaning" }, as: ExtrusionOperator }
            - { call: "POST /extrusion-runs/${run1}/resume", payload: {}, as: ExtrusionOperator }
            - { call: "POST /extrusion-runs/${run1}/hold", payload: { hold_reason: "bubble instability" }, as: ExtrusionOperator }
            - { call: "POST /extrusion-runs/${run1}/resume", payload: {}, as: ExtrusionOperator }
            - { call: "POST /extrusion-runs/${run1}/hold", payload: { hold_reason: "gauge band drift" }, as: ExtrusionOperator }
            - { call: "POST /extrusion-runs/${run1}/resume", payload: {}, as: ExtrusionOperator }
            - { call: "POST /extrusion-runs/${run1}/hold", payload: { hold_reason: "air ring fault" }, as: ExtrusionOperator }
            - { call: "POST /extrusion-runs/${run1}/resume", payload: {}, as: ExtrusionOperator }
          assert:
            - "after the first hold: ExtrusionRun.${run1}.hold_count == 1 and status == HELD and ExtrusionLine.${line_nf}.active_hold_count == 1"
            - "after the first resume: ExtrusionRun.${run1}.status == RUNNING, hold_reason == null and ExtrusionLine.${line_nf}.active_hold_count == 0"
            - "after the third resume: ExtrusionRun.${run1}.hold_count == 3 and status == RUNNING"
            - "after the fourth hold: ExtrusionRun.${run1}.hold_count == 4 and status == HELD"
            - "the fourth POST /extrusion-runs/${run1}/resume -> 409 ERR_RUN_HOLD_LIMIT_EXCEEDED"
            - "ExtrusionRun.${run1}.status == HELD and hold_reason == 'air ring fault' after the rejected resume"
            - "ExtrusionRun.${run1}.hold_count == 4 (the rejected resume does not decrement it)"
            - "ExtrusionLine.${line_nf}.posture == OPEN (a single HELD run is below POSTURE_RESTRICTED_MIN_HOLDS of 2)"
      - name: print_job_registration_and_color_dimensions_advance_independently
        grounds:
          - state_machines.PrintJob.registration_state.REG_PENDING_to_REG_PASS
          - state_machines.PrintJob.color_state.COLOR_PENDING_to_COLOR_FAIL
          - state_machines.PrintJob.color_state.COLOR_FAIL_to_COLOR_PASS
          - state_machines.PrintJob.SETUP_to_PRINTING
          - errors[ERR_PRINT_JOB_STATE_INVALID]
        distinguishing_aspect: |
          PrintJob carries three independent state fields: registration_state reaches REG_PASS while
          color_state is still COLOR_PENDING and status is still SETUP, start-print is refused until
          BOTH measurement dimensions read PASS, and a failing colour proof moves color_state to
          COLOR_FAIL without disturbing registration_state -- so the reachable combined state is a
          product of three axes, not a single chain.
        test_recipe:
          setup:
            - "print job PJ-1 in SETUP on press PR-1 (registration_tolerance_micron 80.0, max_delta_e 2.0) at logical clock 2026-08-05T06:00:00Z"
            - "PJ-1 window_start is 2026-08-05T06:00:00Z, plate PL-1 MOUNTED on PR-1, roll 1 CONSUMED"
