  - section: complexity_layers
    instances:
      - name: occ_shipment_patch_stale_version
        claim_type: stale_version_conflict
        grounds: ["concurrency_rules[shipment-patch-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "PATCH with the version observed at create succeeds (v1->v2); replaying the same stale expected version is rejected with 412 ERR_STALE_VERSION."
        test_recipe:
          setup: ["DRAFT shipment; its version captured at create"]
          setup_api_calls:
            - { call: "POST /bulk-liquid/customers", payload: { name: "Acme Chem", credit_limit_cents: 1000000000 }, as: FleetAdmin, captures: { cust: $.data.id } }
            - { call: "POST /bulk-liquid/products", payload: { name: "Diesel ULSD", compatibility_group: PETROLEUM, hazmat_class: CLASS_3_FLAMMABLE, packing_group: II, density_lb_per_gal: 7.0, temp_coeff_per_degF: 0.0007, placard_code: "UN1993" }, as: FleetAdmin, captures: { prod: $.data.id } }
            - { call: "POST /bulk-liquid/shipments", payload: { customer_id: "${cust}", product_id: "${prod}", ordered_gallons: 1000, route_miles: 100, rate_per_gal_cents: 100 }, as: Dispatcher, captures: { ship: $.data.id, ship_v: $.data.version } }
          trigger:
            - { call: "PATCH /bulk-liquid/shipments/${ship}", payload: { ordered_gallons: 1200, expected_shipment_version: "${ship_v}" }, as: Dispatcher, captures: { v2: $.data.version } }
            - { call: "PATCH /bulk-liquid/shipments/${ship}", payload: { ordered_gallons: 1300, expected_shipment_version: "${ship_v}" }, as: Dispatcher, captures: { err: $.data.error_id } }
          assert:
            - "first PATCH -> 200, version advances by 1 (to ${ship_v} + 1)"
            - "second PATCH with the same stale expected_shipment_version -> error_id == ERR_STALE_VERSION (http 412)"
      - name: occ_agreement_patch_stale_version
        claim_type: stale_version_conflict
        grounds: ["concurrency_rules[agreement-patch-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Same OCC pattern on a different parent entity (DedicatedTrailerAgreement): stale expected_agreement_version -> 412 ERR_STALE_VERSION."
        test_recipe:
          setup: ["PENDING agreement; version captured at create"]
          setup_api_calls:
            - { call: "POST /bulk-liquid/customers", payload: { name: "Dedicated Co", credit_limit_cents: 1000000000, dedicated_program_enrolled: true }, as: FleetAdmin, captures: { cust: $.data.id } }
            - { call: "POST /bulk-liquid/trailers", payload: { unit_number: "T-101", capacity_gallons: 8000, tare_weight_lb: 25000, tare_steer_lb: 6000, tare_drive_lb: 9000, tare_trailer_lb: 10000, steer_axle_rating_lb: 12000, drive_axle_rating_lb: 34000, trailer_axle_rating_lb: 34000, gvwr_lb: 80000 }, as: FleetAdmin, captures: { trl: $.data.id } }
