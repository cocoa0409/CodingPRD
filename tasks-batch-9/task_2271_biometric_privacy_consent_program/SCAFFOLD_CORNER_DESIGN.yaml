          rationale: "Three difficulty instances already provoke two rules simultaneously and pin the winner across different error-category pairs (9 vs 10, 11 vs 13, 7 vs 14); a generic priority-conflict corner test would duplicate the weakest of them."

      - name: cross_entity_state_validation_is_covered_by_the_cross_entity_difficulty_instances
        claim_type: cross_entity_validation
        grounds:
          - validations[priority=10]
          - state_machines.NoticePacket
        excluded_because:
          difficulty_instance: asset_activation_requires_notice_packet_in_published_state
          rationale: "Validity-depends-on-another-entity's-state is tested there in both polarities by toggling only NoticePacket.status, which is exactly the cross-entity-validation claim."

      - name: temporal_window_validation_is_covered_by_the_resource_overlap_difficulty_instances
        claim_type: temporal_validation
        grounds:
          - validations[priority=11]
          - errors[ERR_ACCOMMODATION_WINDOW_CONFLICT]
        excluded_because:
          difficulty_instance: accommodation_windows_are_closed_plus_24h_buffer_so_touching_windows_collide
          rationale: "That instance probes the buffered closed-interval boundary on both sides (conflict at the touching instant, success one day later), which subsumes any looser temporal-validation corner test."

  - section: endpoints
    instances:
      - name: jurisdiction_patch_updates_only_supplied_fields_and_bumps_the_version
        claim_type: standard_crud
        grounds:
          - endpoints["PATCH /jurisdictions/{jurisdiction_id}"]
          - concurrency_rules[exposure-assessment-create-stale-jurisdiction]
        distinguishing_aspect: "A partial update touches exactly the two supplied statutory parameters, leaves the others at their stored values, and increments version to 2 — the same counter the exposure-assessment OCC rule reads."
        test_recipe:
          setup:
            - "One ComplianceProgram with Jurisdiction IL created with cure_period_days 0 and statutory_cap_cents omitted (null)."
          setup_api_calls:
            - call: "POST /programs"
              payload: { org_name: "Northline Retail Group", org_type: "HYBRID", exposure_ceiling_cents: 1093750 }
              as: SystemOperator
              captures: { prog_id: $.data.id }
            - call: "POST /jurisdictions"
              payload: { program_id: "${prog_id}", state_code: "IL", statute_name: "BIPA", private_right_of_action: "FULL", damages_model: "STATUTORY_PER_VIOLATION", requires_written_release: true, translation_required: true, required_locales: ["en", "es"], retention_max_days: 1095, notice_lead_days: 14, per_violation_negligent_cents: 100000, per_violation_reckless_cents: 500000, cure_period_days: 0 }
              as: SystemOperator
              captures: { il_id: $.data.id }
          trigger:
            - call: "PATCH /jurisdictions/${il_id}"
              payload: { cure_period_days: 45, statutory_cap_cents: 250000 }
              as: SystemOperator
              captures: { new_version: $.data.version }
          assert:
            - "HTTP 200 with data.cure_period_days == 45 and data.statutory_cap_cents == 250000"
            - "data.private_right_of_action == FULL, data.retention_max_days == 1095, data.notice_lead_days == 14 and data.required_locales == [en, es] are all unchanged"
            - "${new_version} == 2 and updated_at is refreshed while created_at is not"
            - "A subsequent POST /exposure-assessments must now carry expected_jurisdiction_version 2"

      - name: attestation_endpoint_only_walks_the_declared_order
        claim_type: action_endpoint
        grounds:
          - endpoints["POST /vendors/{vendor_id}/attestations"]
          - validations[priority=8]
          - calculations.vendor_risk_score
        distinguishing_aspect: "The attestation action is a state machine in its own right: NOT_REQUESTED -> RECEIVED is refused as a skipped step, RECEIVED is terminal so a re-request is refused, and each refused call leaves risk_score exactly where it was."
        test_recipe:
          setup:
            - "One ComplianceProgram and one Vendor at attestation_status NOT_REQUESTED with risk_score 40 (base 20 + NOT_REQUESTED 20)."
          setup_api_calls:
            - call: "POST /programs"
              payload: { org_name: "Northline Retail Group", org_type: "HYBRID", exposure_ceiling_cents: 1093750 }
              as: SystemOperator
              captures: { prog_id: $.data.id }
            - call: "POST /vendors"
              payload: { program_id: "${prog_id}", name: "ClockPoint Systems", sells_biometric_data: false, subprocessor_count: 0, deletion_sla_days: 15, subprocessor_disclosure_complete: true }
              as: VendorManager
              as_user_id: "vm-1"
              captures: { v1_id: $.data.id, risk0: $.data.risk_score }
          trigger:
            - call: "POST /vendors/${v1_id}/attestations"
              payload: { attestation_status: "RECEIVED" }
              as: VendorManager
              as_user_id: "vm-1"
              captures: { skip_err: $.data.error_id }
            - call: "POST /vendors/${v1_id}/attestations"
              payload: { attestation_status: "REQUESTED" }
              as: VendorManager
              as_user_id: "vm-1"
              captures: { risk1: $.data.risk_score }
            - call: "POST /vendors/${v1_id}/attestations"
              payload: { attestation_status: "RECEIVED" }
              as: VendorManager
              as_user_id: "vm-1"
              captures: { risk2: $.data.risk_score }
            - call: "POST /vendors/${v1_id}/attestations"
              payload: { attestation_status: "REQUESTED" }
              as: VendorManager
              as_user_id: "vm-1"
              captures: { terminal_err: $.data.error_id }
          assert:
            - "${risk0} == 40 before any attestation call"
            - "First trigger: HTTP 409 with ${skip_err} == ERR_INVALID_TRANSITION; Vendor.attestation_status is still NOT_REQUESTED and risk_score is still 40"
            - "${risk1} == 30 (REQUESTED scores 10) and ${risk2} == 20 (RECEIVED scores 0)"
            - "Last trigger: HTTP 409 with ${terminal_err} == ERR_INVALID_TRANSITION — RECEIVED is terminal — and risk_score stays 20"

      - name: notification_exemption_is_available_only_to_tier_2_incidents
        claim_type: conditional_action
        grounds:
          - state_machines.IncidentCase.ASSESSED_to_EXEMPT
          - errors[ERR_EXEMPTION_NOT_AVAILABLE]
          - calculations.incident_notification_deadline_and_cost
        distinguishing_aspect: "The exemption action is gated on a computed field rather than on the request: an exposure involving face geometry is TIER_1 and cannot be exempted at all, while an otherwise identical fingerprint exposure of the same size is TIER_2 and can."
        test_recipe:
          setup:
            - "One ComplianceProgram with Jurisdiction IL, one FACE_GEOMETRY camera asset and one FINGERPRINT timekeeping asset."
            - "Two incidents, each with exposed_subject_count 10 and translation_locale_count 0, one per asset, both already advanced to ASSESSED."
          setup_api_calls:
            - call: "POST /programs"
              payload: { org_name: "Northline Retail Group", org_type: "HYBRID", exposure_ceiling_cents: 1093750 }
              as: SystemOperator
              captures: { prog_id: $.data.id }
            - call: "POST /jurisdictions"
              payload: { program_id: "${prog_id}", state_code: "IL", statute_name: "BIPA", private_right_of_action: "FULL", damages_model: "STATUTORY_PER_VIOLATION", requires_written_release: true, translation_required: true, required_locales: ["en", "es"], retention_max_days: 1095, notice_lead_days: 14, per_violation_negligent_cents: 100000, per_violation_reckless_cents: 500000, cure_period_days: 0 }
              as: SystemOperator
              captures: { il_id: $.data.id }
            - call: "POST /biometric-assets"
              payload: { program_id: "${prog_id}", jurisdiction_id: "${il_id}", system_category: "SECURITY_CAMERA", modality: "FACE_GEOMETRY", subject_class: "EMPLOYEE", template_storage_location: "cam-vault-01", declared_retention_days: 30, retention_basis: "SCHEDULE_ONLY" }
              as: PrivacyOfficer
              as_user_id: "po-1"
              captures: { face_asset_id: $.data.id }
            - call: "POST /biometric-assets"
              payload: { program_id: "${prog_id}", jurisdiction_id: "${il_id}", system_category: "TIMEKEEPING", modality: "FINGERPRINT", subject_class: "EMPLOYEE", template_storage_location: "tk-vault-01", declared_retention_days: 30, retention_basis: "SCHEDULE_ONLY" }
              as: PrivacyOfficer
              as_user_id: "po-1"
              captures: { fp_asset_id: $.data.id }
            - call: "POST /incidents"
              payload: { program_id: "${prog_id}", affected_asset_ids: ["${face_asset_id}"], exposure_vector: "INSIDER_MISUSE", description: "ten face templates viewed by an unauthorised operator", exposed_subject_count: 10, translation_locale_count: 0 }
              as: PrivacyOfficer
              as_user_id: "po-1"
              captures: { i_face_id: $.data.id }
            - call: "POST /incidents/${i_face_id}/notification-transitions"
              payload: { to_status: "ASSESSED" }
              as: PrivacyOfficer
              as_user_id: "po-1"
              captures: { face_tier: $.data.heightened_tier }
            - call: "POST /incidents"
              payload: { program_id: "${prog_id}", affected_asset_ids: ["${fp_asset_id}"], exposure_vector: "INSIDER_MISUSE", description: "ten fingerprint templates viewed by an unauthorised operator", exposed_subject_count: 10, translation_locale_count: 0 }
              as: PrivacyOfficer
              as_user_id: "po-1"
              captures: { i_fp_id: $.data.id }
            - call: "POST /incidents/${i_fp_id}/notification-transitions"
              payload: { to_status: "ASSESSED" }
              as: PrivacyOfficer
              as_user_id: "po-1"
              captures: { fp_tier: $.data.heightened_tier }
          trigger:
            - call: "POST /incidents/${i_face_id}/notification-transitions"
              payload: { to_status: "EXEMPT", exemption_basis: "templates were encrypted at rest" }
              as: ComplianceApprover
              as_user_id: "ca-1"
              captures: { err: $.data.error_id }
            - call: "POST /incidents/${i_fp_id}/notification-transitions"
              payload: { to_status: "EXEMPT", exemption_basis: "templates were encrypted at rest" }
              as: ComplianceApprover
              as_user_id: "ca-1"
              captures: { fp_notification_status: $.data.notification_status }
          assert:
            - "${face_tier} == TIER_1 and ${fp_tier} == TIER_2 for identical exposure counts"
            - "First trigger: HTTP 409 with data.error_id == ERR_EXEMPTION_NOT_AVAILABLE; the incident stays ASSESSED with exemption_basis null"
            - "Second trigger: HTTP 200 with ${fp_notification_status} == EXEMPT and exemption_basis stored"
            - "Both incidents still report containment_status == DETECTED"

      - name: exposure_assessment_links_to_its_source_incident_and_is_filterable_by_it
        claim_type: cross_reference_link
        grounds:
          - endpoints["POST /exposure-assessments"]
          - endpoints["GET /exposure-assessments"]
          - entities.ExposureAssessment.fields.incident_id
        distinguishing_aspect: "The optional incident link is a real association, not a free-text note: an unknown incident_id is refused at the existence layer, a valid one is echoed on the row, and the list endpoint's incident_id filter isolates exactly the linked assessment from the routine one."
        test_recipe:
          setup:
            - "One ComplianceProgram with Jurisdiction IL, one inventoried asset and one IncidentCase."
            - "The clock stays at its default 2026-08-01T00:00:00Z; no consent rows exist, so every assessment prices at zero and the ceiling is never approached."
          setup_api_calls:
            - call: "POST /programs"
              payload: { org_name: "Northline Retail Group", org_type: "HYBRID", exposure_ceiling_cents: 1093750 }
              as: SystemOperator
              captures: { prog_id: $.data.id }
            - call: "POST /jurisdictions"
              payload: { program_id: "${prog_id}", state_code: "IL", statute_name: "BIPA", private_right_of_action: "FULL", damages_model: "STATUTORY_PER_VIOLATION", requires_written_release: true, translation_required: true, required_locales: ["en", "es"], retention_max_days: 1095, notice_lead_days: 14, per_violation_negligent_cents: 100000, per_violation_reckless_cents: 500000, cure_period_days: 0 }
              as: SystemOperator
              captures: { il_id: $.data.id }
            - call: "POST /biometric-assets"
              payload: { program_id: "${prog_id}", jurisdiction_id: "${il_id}", system_category: "TIMEKEEPING", modality: "FINGERPRINT", subject_class: "EMPLOYEE", template_storage_location: "tk-vault-01", declared_retention_days: 30, retention_basis: "SCHEDULE_ONLY" }
              as: PrivacyOfficer
              as_user_id: "po-1"
              captures: { asset_id: $.data.id }
            - call: "POST /incidents"
              payload: { program_id: "${prog_id}", affected_asset_ids: ["${asset_id}"], exposure_vector: "LOST_DEVICE", description: "handheld reader lost in transit", exposed_subject_count: 4, translation_locale_count: 0 }
              as: PrivacyOfficer
              as_user_id: "po-1"
              captures: { inc_id: $.data.id }
            - call: "GET /jurisdictions/${il_id}"
              as: PrivacyOfficer
              as_user_id: "po-1"
              captures: { il_v1: $.data.version }
          trigger:
            - call: "POST /exposure-assessments"
              payload: { program_id: "${prog_id}", jurisdiction_id: "${il_id}", variant: "PER_VIOLATION_STACKED", expected_jurisdiction_version: "${il_v1}", incident_id: "00000000-0000-4000-8000-00000000000c" }
              as: PrivacyOfficer
              as_user_id: "po-1"
              captures: { link_err: $.data.error_id }
            - call: "POST /exposure-assessments"
              payload: { program_id: "${prog_id}", jurisdiction_id: "${il_id}", variant: "PER_VIOLATION_STACKED", expected_jurisdiction_version: "${il_v1}", incident_id: "${inc_id}" }
              as: PrivacyOfficer
              as_user_id: "po-1"
              captures: { linked_id: $.data.id, linked_incident: $.data.incident_id }
            - call: "GET /jurisdictions/${il_id}"
              as: PrivacyOfficer
              as_user_id: "po-1"
              captures: { il_v2: $.data.version }
            - call: "POST /exposure-assessments"
              payload: { program_id: "${prog_id}", jurisdiction_id: "${il_id}", variant: "PER_SUBJECT_CAPPED", expected_jurisdiction_version: "${il_v2}" }
              as: PrivacyOfficer
              as_user_id: "po-1"
              captures: { routine_id: $.data.id, routine_incident: $.data.incident_id }
            - call: "GET /exposure-assessments"
              payload: { program_id: "${prog_id}", incident_id: "${inc_id}" }
              as: ComplianceApprover
              as_user_id: "ca-1"
          assert:
            - "First trigger: HTTP 404 with ${link_err} == ERR_INCIDENT_NOT_FOUND, and Jurisdiction.version is NOT incremented by the refused create (so ${il_v1} is still current for the next call)"
            - "Second trigger: HTTP 201 with ${linked_incident} == ${inc_id}"
            - "${routine_incident} == null for the routine assessment"
            - "The filtered list returns total_count == 1 and its single row id == ${linked_id}, excluding ${routine_id}"

      - name: computed_read_projections_are_covered_by_the_boundary_difficulty_instance
        claim_type: computed_read
        grounds:
          - endpoints["GET /programs/{program_id}"]
          - calculations.inventory_completeness_pct
        excluded_because:
          difficulty_instance: inventory_completeness_empty_scope_100_and_two_decimal_rounding_at_33_33_and_66_67
          rationale: "Reading derived program data and reconciling it against the formula is precisely what that instance does at three separate inventory states, so a standalone computed-read corner test adds no distinct claim."

  - section: errors
    instances:
      - name: unknown_ids_on_each_single_resource_read_surface_their_own_error_codes
        claim_type: error_triggerable
        grounds:
          - errors[ERR_VENDOR_NOT_FOUND]
          - errors[ERR_CONTRACT_NOT_FOUND]
          - errors[ERR_POLICY_NOT_FOUND]
          - errors[ERR_NOTICE_NOT_FOUND]
          - errors[ERR_CONSENT_NOT_FOUND]
          - errors[ERR_ACCOMMODATION_NOT_FOUND]
          - errors[ERR_ASSESSMENT_NOT_FOUND]
        distinguishing_aspect: "Each entity family emits its own 404 code rather than a shared generic one, so the seven remaining not-found codes are each reachable through their own single-resource read."
        test_recipe:
          setup:
            - "One ComplianceProgram exists so the store is non-empty; none of the seven target tables contains the requested ids."
          setup_api_calls:
            - call: "POST /programs"
              payload: { org_name: "Northline Retail Group", org_type: "HYBRID", exposure_ceiling_cents: 1093750 }
              as: SystemOperator
              captures: { prog_id: $.data.id }
          trigger:
            - call: "GET /vendors/00000000-0000-4000-8000-000000000001"
              as: PrivacyOfficer
              as_user_id: "po-1"
              captures: { e1: $.data.error_id }
            - call: "GET /vendor-contracts/00000000-0000-4000-8000-000000000002"
              as: PrivacyOfficer
              as_user_id: "po-1"
              captures: { e2: $.data.error_id }
            - call: "GET /policies/00000000-0000-4000-8000-000000000003"
              as: PrivacyOfficer
              as_user_id: "po-1"
              captures: { e3: $.data.error_id }
            - call: "GET /notice-packets/00000000-0000-4000-8000-000000000004"
              as: PrivacyOfficer
              as_user_id: "po-1"
              captures: { e4: $.data.error_id }
            - call: "GET /consent-records/00000000-0000-4000-8000-000000000005"
              as: PrivacyOfficer
              as_user_id: "po-1"
              captures: { e5: $.data.error_id }
            - call: "GET /accommodations/00000000-0000-4000-8000-000000000006"
              as: PrivacyOfficer
              as_user_id: "po-1"
              captures: { e6: $.data.error_id }
            - call: "GET /exposure-assessments/00000000-0000-4000-8000-000000000007"
              as: PrivacyOfficer
              as_user_id: "po-1"
              captures: { e7: $.data.error_id }
          assert:
            - "All seven calls return HTTP 404 with response_type == error"
            - "${e1} == ERR_VENDOR_NOT_FOUND, ${e2} == ERR_CONTRACT_NOT_FOUND, ${e3} == ERR_POLICY_NOT_FOUND, ${e4} == ERR_NOTICE_NOT_FOUND"
            - "${e5} == ERR_CONSENT_NOT_FOUND, ${e6} == ERR_ACCOMMODATION_NOT_FOUND, ${e7} == ERR_ASSESSMENT_NOT_FOUND"

      - name: request_missing_auth_headers_returns_unauthenticated
        claim_type: error_triggerable
        grounds:
          - errors[ERR_UNAUTHENTICATED]
          - validations[priority=1]
        distinguishing_aspect: "Authentication is checked before anything else: a create with no identity headers fails with 401 even though its body is also invalid, and a create carrying a role outside the declared six fails with 401 rather than 403."
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /programs"
              payload: { org_name: "Northline Retail Group", org_type: "NOT_A_TYPE", exposure_ceiling_cents: 1093750 }
              as: none
              captures: { e1: $.data.error_id }
            - call: "POST /programs"
              payload: { org_name: "Northline Retail Group", org_type: "HYBRID", exposure_ceiling_cents: 1093750 }
              as: Auditor
              as_user_id: "aud-1"
              captures: { e2: $.data.error_id }
          assert:
            - "First trigger: HTTP 401 with ${e1} == ERR_UNAUTHENTICATED — the invalid org_type enum never reaches the priority-3 body check"
            - "Second trigger: HTTP 401 with ${e2} == ERR_UNAUTHENTICATED because Auditor is not one of the six declared roles (401, not 403)"
            - "No ComplianceProgram row exists after either call"

      - name: second_consent_for_the_same_subject_and_asset_pair_rejected
        claim_type: error_triggerable
        grounds:
          - errors[ERR_CONSENT_ALREADY_EXISTS]
          - validations[priority=13]
        distinguishing_aspect: "Uniqueness is scoped to non-terminal consents on the (data_subject_id, asset_id) pair: while a SOLICITED row is open a second solicitation is refused, and it becomes permissible again only once the first row reaches the terminal DECLINED state."
        test_recipe:
          setup:
            - "The standard Illinois pipeline: PUBLISHED policy, PUBLISHED (IL, EMPLOYEE) notice, one in-house asset activated at 2026-08-01, clock advanced to 2026-08-15."
            - "Subject s1 already holds one SOLICITED consent on the asset."
          setup_api_calls:
            - call: "POST /programs"
              payload: { org_name: "Northline Retail Group", org_type: "HYBRID", exposure_ceiling_cents: 1093750 }
              as: SystemOperator
              captures: { prog_id: $.data.id }
            - call: "POST /jurisdictions"
              payload: { program_id: "${prog_id}", state_code: "IL", statute_name: "BIPA", private_right_of_action: "FULL", damages_model: "STATUTORY_PER_VIOLATION", requires_written_release: true, translation_required: true, required_locales: ["en", "es"], retention_max_days: 1095, notice_lead_days: 14, per_violation_negligent_cents: 100000, per_violation_reckless_cents: 500000, cure_period_days: 0 }
              as: SystemOperator
              captures: { il_id: $.data.id }
            - call: "POST /policies"
              payload: { program_id: "${prog_id}", version_label: "v1.0", retention_days: 30, destruction_trigger: "FIXED_SCHEDULE", release_language_included: true, jurisdiction_scope: ["${il_id}"] }
              as: PrivacyOfficer
              as_user_id: "po-1"
              captures: { pol1_id: $.data.id }
            - call: "POST /policies/${pol1_id}/transitions"
              payload: { to_status: "IN_REVIEW" }
              as: PrivacyOfficer
              as_user_id: "po-1"
            - call: "GET /programs/${prog_id}"
              as: ComplianceApprover
              as_user_id: "ca-1"
              captures: { prog_v1: $.data.version }
            - call: "POST /policies/${pol1_id}/publish"
              payload: { expected_program_version: "${prog_v1}" }
              as: ComplianceApprover
              as_user_id: "ca-1"
            - call: "POST /notice-packets"
              payload: { program_id: "${prog_id}", jurisdiction_id: "${il_id}", policy_id: "${pol1_id}", audience: "EMPLOYEE", locales: ["en", "es"], accommodation_channel: "privacy@northline.example", effective_from: "2026-08-01T00:00:00Z" }
              as: PrivacyOfficer
              as_user_id: "po-1"
              captures: { np1_id: $.data.id }
            - call: "POST /notice-packets/${np1_id}/transitions"
              payload: { to_status: "PUBLISHED" }
              as: PrivacyOfficer
              as_user_id: "po-1"
            - call: "POST /biometric-assets"
              payload: { program_id: "${prog_id}", jurisdiction_id: "${il_id}", system_category: "TIMEKEEPING", modality: "FINGERPRINT", subject_class: "EMPLOYEE", template_storage_location: "tk-vault-01", declared_retention_days: 30, retention_basis: "SCHEDULE_ONLY" }
              as: PrivacyOfficer
              as_user_id: "po-1"
              captures: { asset_id: $.data.id }
            - call: "POST /biometric-assets/${asset_id}/transitions"
              payload: { to_status: "CLASSIFIED" }
              as: PrivacyOfficer
              as_user_id: "po-1"
            - call: "POST /biometric-assets/${asset_id}/transitions"
              payload: { to_status: "ACTIVE" }
              as: PrivacyOfficer
              as_user_id: "po-1"
            - call: "POST /data-subjects"
              payload: { program_id: "${prog_id}", jurisdiction_id: "${il_id}", subject_type: "EMPLOYEE", external_ref: "EMP-0001", preferred_locale: "en" }
              as: HRAdministrator
              as_user_id: "hr-1"
              captures: { s1_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:00Z" }
              as: SystemOperator
            - call: "POST /consent-records"
              payload: { data_subject_id: "${s1_id}", asset_id: "${asset_id}", locale: "en" }
              as: HRAdministrator
              as_user_id: "hr-1"
              captures: { c1_id: $.data.id }
          trigger:
            - call: "POST /consent-records"
              payload: { data_subject_id: "${s1_id}", asset_id: "${asset_id}", locale: "es" }
              as: HRAdministrator
              as_user_id: "hr-1"
              captures: { err: $.data.error_id }
            - call: "POST /consent-records/${c1_id}/transitions"
              payload: { to_status: "DECLINED", decline_reason: "prefers manual timesheet" }
              as: HRAdministrator
              as_user_id: "hr-1"
            - call: "POST /consent-records"
              payload: { data_subject_id: "${s1_id}", asset_id: "${asset_id}", locale: "es" }
              as: HRAdministrator
              as_user_id: "hr-1"
              captures: { c2_id: $.data.id, c2_status: $.data.status }
          assert:
            - "First trigger: HTTP 409 with data.error_id == ERR_CONSENT_ALREADY_EXISTS and GET /consent-records with asset_id ${asset_id} still returns total_count 1"
            - "Third trigger: HTTP 201 with ${c2_status} == SOLICITED once ${c1_id} is terminal"
