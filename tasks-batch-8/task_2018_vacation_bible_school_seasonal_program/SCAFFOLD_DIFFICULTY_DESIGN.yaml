            - { call: "POST /vbs/_clock/set_current_utc", payload: { to_iso8601: "2026-08-17T08:30:00Z" }, as: ProgramDirector }
          trigger:
            - { call: "POST /vbs/attendance/check-in", payload: { child_id: "${kid1}", program_day_id: "${day1}" }, as: CheckInStaff, as_user_id: "desk-1", captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_ACCOMMODATION_NOT_APPROVED  (safety P5 beats day-state P6; a reversed order would yield ERR_INVALID_STATE)"
            - "AttendanceRecord for (${kid1}, ${day1}) does not exist or remains NOT_ARRIVED"
      - name: order_approve_state_beats_fiscal
        grounds:
          - validations[priority=6]
          - validations[priority=10]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_BUDGET_EXCEEDED]
        distinguishing_aspect: |
          Category pair state (P6) vs business_fiscal (P10) — a different pair from
          the safety-vs-state instance. The order is DRAFT (cannot be approved)
          AND its total 30*4000=120000 exceeds the 100000 budget. State outranks
          fiscal, so the error MUST be ERR_INVALID_STATE, not ERR_BUDGET_EXCEEDED.
        test_recipe:
          setup:
            - "Program Alpha (supply_budget_cents 100000) in DRAFT"
            - "SupplyOrder ord in DRAFT with quantity 30, unit_cost_cents 4000 (total 120000 > budget)"
          setup_api_calls:
            - { call: "POST /vbs/programs", payload: { name: "VBS Alpha", program_year: 2026, start_date: "2026-08-17", end_date: "2026-08-21", registration_opens_at: "2026-07-15T00:00:00Z", registration_closes_at: "2026-08-15T23:59:59Z", supply_budget_cents: 100000, child_staff_ratio: 4, waitlist_offer_ttl_hours: 48, pickup_cutoff_time: "12:00" }, as: ProgramDirector, captures: { prog_id: $.data.id } }
            - { call: "POST /vbs/supply-orders", payload: { program_id: "${prog_id}", kit_name: "Starter Kit", vendor: "Cokesbury", quantity: 30, unit_cost_cents: 4000 }, as: ProgramDirector, captures: { ord: $.data.id } }
          trigger:
            - { call: "POST /vbs/supply-orders/${ord}/approve", payload: {}, as: ProgramDirector, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_INVALID_STATE  (state P6 beats fiscal P10; a reversed order would yield ERR_BUDGET_EXCEEDED)"
            - "SupplyOrder.${ord}.status == DRAFT and SupplyOrder.${ord}.total_cost_cents == 120000"
      - name: registration_constraint_beats_referential
        grounds:
          - validations[priority=8]
          - validations[priority=9]
          - errors[ERR_AGE_OUT_OF_RANGE]
          - errors[ERR_FAMILY_ARCHIVED]
        distinguishing_aspect: |
          Category pair business_constraint (P8) vs business_referential (P9) — a
          third, distinct pair. The child is 10 years old for a 4-6 classroom AND
          his family is ARCHIVED. Constraint outranks referential, so the error
          MUST be ERR_AGE_OUT_OF_RANGE, not ERR_FAMILY_ARCHIVED.
        test_recipe:
          setup:
            - "Program Alpha in REGISTRATION_OPEN; Koalas (ages 4-6, cap 10)"
            - "Family F ARCHIVED; its child k1 was born 2016-01-01 (age 10 on 2026-08-17)"
          setup_api_calls:
            - { call: "POST /vbs/programs", payload: { name: "VBS Alpha", program_year: 2026, start_date: "2026-08-17", end_date: "2026-08-21", registration_opens_at: "2026-07-15T00:00:00Z", registration_closes_at: "2026-08-15T23:59:59Z", supply_budget_cents: 100000, child_staff_ratio: 4, waitlist_offer_ttl_hours: 48, pickup_cutoff_time: "12:00" }, as: ProgramDirector, captures: { prog_id: $.data.id } }
            - { call: "POST /vbs/classrooms", payload: { program_id: "${prog_id}", name: "Koalas", age_min: 4, age_max: 6, capacity: 10 }, as: RegistrationCoordinator, captures: { cls_k: $.data.id } }
            - { call: "POST /vbs/programs/${prog_id}/open-registration", payload: {}, as: ProgramDirector }
            - { call: "POST /vbs/families", payload: { household_name: "Alvarez", primary_contact_name: "Maria Alvarez", email: "alvarez@example.com", phone: "555-0101" }, as: Anonymous, captures: { fam_id: $.data.id } }
            - { call: "POST /vbs/children", payload: { family_id: "${fam_id}", first_name: "Kid", last_name: "Old", birth_date: "2016-01-01", grade_completed: "GRADE_4" }, as: Parent, as_user_id: "${fam_id}", captures: { kid1: $.data.id } }
            - { call: "POST /vbs/families/${fam_id}/archive", payload: {}, as: RegistrationCoordinator }
          trigger:
            - { call: "POST /vbs/registrations", payload: { child_id: "${kid1}", classroom_id: "${cls_k}" }, as: RegistrationCoordinator, captures: { err: $.data.error_id } }
          assert:
            - "${err} == ERR_AGE_OUT_OF_RANGE  (constraint P8 beats referential P9; a reversed order would yield ERR_FAMILY_ARCHIVED)"
            - "no Registration exists for ${kid1} (both checks failed atomically)"

  # ---------------------------------------------------------------------------
  # Rule 6 — boundary_precision_check on DIFFERENT metrics/endpoints
  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: capacity_boundary_exact_fill
        grounds:
          - calculations.open_seats
          - state_machines.Classroom.ACCEPTING_to_FULL
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          Metric = seat count, endpoint = POST /vbs/registrations. With capacity 2
          the second registration at enrolled_count == capacity-1 still ENROLLEDs
          (admission predicate is open_seats >= 1, i.e. enrolled < capacity), the
          exact-fill flips the classroom to FULL, and the third registration at
          open_seats == 0 WAITLISTs instead of erroring.
        test_recipe:
          setup:
            - "Program Alpha in REGISTRATION_OPEN; Koalas (4-6, cap 2) ACCEPTING; family with 3 children"
          setup_api_calls:
            - { call: "POST /vbs/programs", payload: { name: "VBS Alpha", program_year: 2026, start_date: "2026-08-17", end_date: "2026-08-21", registration_opens_at: "2026-07-15T00:00:00Z", registration_closes_at: "2026-08-15T23:59:59Z", supply_budget_cents: 100000, child_staff_ratio: 4, waitlist_offer_ttl_hours: 48, pickup_cutoff_time: "12:00" }, as: ProgramDirector, captures: { prog_id: $.data.id } }
            - { call: "POST /vbs/classrooms", payload: { program_id: "${prog_id}", name: "Koalas", age_min: 4, age_max: 6, capacity: 2 }, as: RegistrationCoordinator, captures: { cls_k: $.data.id } }
            - { call: "POST /vbs/programs/${prog_id}/open-registration", payload: {}, as: ProgramDirector }
            - { call: "POST /vbs/families", payload: { household_name: "Alvarez", primary_contact_name: "Maria Alvarez", email: "alvarez@example.com", phone: "555-0101" }, as: Anonymous, captures: { fam_id: $.data.id } }
            - { call: "POST /vbs/children", payload: { family_id: "${fam_id}", first_name: "Kid", last_name: "A", birth_date: "2020-03-15", grade_completed: "KINDERGARTEN" }, as: Parent, as_user_id: "${fam_id}", captures: { ka: $.data.id } }
            - { call: "POST /vbs/children", payload: { family_id: "${fam_id}", first_name: "Kid", last_name: "B", birth_date: "2020-03-15", grade_completed: "KINDERGARTEN" }, as: Parent, as_user_id: "${fam_id}", captures: { kb: $.data.id } }
            - { call: "POST /vbs/children", payload: { family_id: "${fam_id}", first_name: "Kid", last_name: "C", birth_date: "2020-03-15", grade_completed: "KINDERGARTEN" }, as: Parent, as_user_id: "${fam_id}", captures: { kc: $.data.id } }
          trigger:
            - { call: "POST /vbs/registrations", payload: { child_id: "${ka}", classroom_id: "${cls_k}" }, as: Parent, as_user_id: "${fam_id}", captures: { s1: $.data.status } }
            - { call: "POST /vbs/registrations", payload: { child_id: "${kb}", classroom_id: "${cls_k}" }, as: Parent, as_user_id: "${fam_id}", captures: { s2: $.data.status } }
            - { call: "POST /vbs/registrations", payload: { child_id: "${kc}", classroom_id: "${cls_k}" }, as: Parent, as_user_id: "${fam_id}", captures: { s3: $.data.status, p3: $.data.waitlist_position } }
            - { call: "GET /vbs/classrooms/${cls_k}", payload: {}, as: RegistrationCoordinator, captures: { k_status: $.data.status, k_enr: $.data.enrolled_count, k_seats: $.data.open_seats } }
          assert:
            - "${s1} == ENROLLED  (open_seats was 2 >= 1)"
            - "${s2} == ENROLLED  (boundary: open_seats was exactly 1 — admission is >= 1, not > 1)"
            - "${s3} == WAITLISTED and ${p3} == 1  (open_seats 0: waitlist, not error)"
            - "${k_status} == FULL and ${k_enr} == 2 and ${k_seats} == 0"
      - name: offer_expiry_strict_less_than
        grounds:
          - state_machines.Registration.OFFERED_to_ENROLLED
          - state_machines.Registration.OFFERED_to_EXPIRED
          - errors[ERR_OFFER_EXPIRED]
        distinguishing_aspect: |
          Metric = time, endpoint = POST /vbs/registrations/{id}/accept — different
          metric and endpoint from the seat-count instance. The accept predicate is
          now < offer_expires_at (strict): at exactly the expiry instant the offer
          is dead — the accept fails, the registration flips EXPIRED, and the next
