              payload: { action: "APPROVE_SPONSOR" }
              as: CreditCommittee
              as_user_id: "cc-01"
            - call: "POST /lending/properties"
              payload: { address_line: "18 Larkspur Ct", county_code: "MARICOPA", purchase_price_cents: 20000000, as_is_value_cents: 21000000, arv_cents: 32000000, appraisal_date: "2026-07-20" }
              as: LoanOfficer
              captures: { p1: $.data.id }
            - call: "POST /lending/contractors"
              payload: { business_name: "Vega Roofing", license_number: "LIC-4471", license_expires_on: "2027-12-31", w9_on_file: true, joint_check_required: false }
              as: LoanOfficer
              captures: { c1: $.data.id }
            - call: "POST /lending/contractors"
              payload: { business_name: "Ortiz Electric", license_number: "LIC-8820", license_expires_on: "2027-12-31", w9_on_file: true, joint_check_required: false }
              as: LoanOfficer
              captures: { c2: $.data.id }
            - call: "POST /lending/applications"
              payload: { borrower_id: "${b1}", property_id: "${p1}", term_months: 9, quoted_rate_bps: 1150, interest_reserve_months: 6, day_count_convention: "PER_DIEM_360" }
              as: LoanOfficer
              captures: { a1: $.data.id }
            - call: "POST /lending/applications/${a1}/rehab-line-items"
              payload: { scope_code: "ROOF", description: "Tear-off and re-deck", cost_cents: 4000000, contractor_id: "${c1}" }
