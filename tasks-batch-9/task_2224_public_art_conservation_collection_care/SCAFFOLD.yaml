scenario: "2224. Public Art Conservation & Collection Care (municipal public art collection): collection inventory with location, materials, artist and acquisition documentation, condition assessment cycles with photographic documentation and treatment priority ranking, routine maintenance protocols by material including cleaning, waxing and graffiti removal methods, conservator engagement for treatment with proposals, artist consultation rights and documentation, artist moral rights considerations for alteration, relocation or removal with notification requirements, deaccession policy with review criteria, public process and disposition options, funding through maintenance endowments and percent-for-art set-asides, vandalism and damage response with insurance claims"
domain_name: "public-art-conservation"
api_prefix: "/public-art"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - scheduled_actions
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - many_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate
  notes: |
    Flat peer entities linked by foreign keys carried in request bodies; no nested ownership paths.
    Revision loops (ConditionAssessment SUBMITTED <-> REVISION_REQUESTED, TreatmentProposal
    SUBMITTED <-> REVISION_REQUESTED) supply the cyclic shape; Artwork and DamageIncident each
    carry two independent state dimensions on one row. Segregation of duties: the user who submits a
    ConditionAssessment may not finalize it, and the user who initiates a DeaccessionCase may not
    cast an APPROVE or DENY vote on it.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: Artist
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: artist name of record for attribution and notices
      - name: is_living
        type: boolean
        source: input
        description: whether the artist is living; drives moral_rights_status on linked artworks
      - name: deceased_on
        type: string
        source: input
        description: ISO date of death when is_living is false
        default: null
        constraints: "required when is_living == false; must be null when is_living == true"
      - name: moral_rights_waiver_on_file
        type: boolean
        source: input
        description: whether a signed moral-rights waiver is filed for this artist
        default: false
      - name: notice_wait_days
        type: integer
        source: input
        description: mandatory waiting days between sending a MoralRightsNotice and acting on it
        default: 90
        constraints: "1..365"
      - name: consultation_response_days
        type: integer
        source: input
        description: days the artist has to respond to an ArtistConsultation before it lapses
        default: 30
        constraints: "1..180"
      - name: contact_email
        type: string
        source: input
        description: notification address of record
      - name: represented_by
        type: string
        source: input
        description: name of the estate or gallery representing the artist
        default: null
      - name: artwork_count
        type: integer
        source: computed
        description: count of Artwork rows whose artist_id == this.id, any custody_status
        default: 0

  - name: Site
    parent: null
    common_fields: true
    fields:
      - name: site_code
        type: string
        source: input
        description: unique short code for the installation site
        constraints: "unique across Site"
      - name: name
        type: string
        source: input
        description: human-readable site name
      - name: address_ref
        type: string
        source: input
        description: municipal address or parcel reference
      - name: exposure_class
        type: enum
        source: input
        description: environmental exposure of the site; feeds the condition-index penalty
        constraints: "COASTAL | URBAN | PARK | INTERIOR"
      - name: capacity_units
        type: integer
        source: input
        description: maximum installed footprint units the site can hold
        constraints: ">= 0"
      - name: installed_units_used
        type: integer
        source: computed
        description: "sum of Artwork.footprint_units for Artwork WHERE site_id == this.id AND custody_status IN {ON_VIEW, IN_TREATMENT}"
        default: 0
      - name: concurrent_work_capacity
        type: integer
        source: input
        description: maximum number of MaintenanceVisit windows that may overlap at this site
        default: 1
        constraints: ">= 1"

  - name: Artwork
    parent: null
    common_fields: true
    fields:
      - name: accession_number
        type: string
        source: input
        description: unique collection accession number
        constraints: "unique across Artwork"
      - name: title
        type: string
        source: input
        description: title of the work
      - name: artist_id
        type: string
        source: input
        description: "FK -> Artist.id; artist of record for consultation and moral-rights notices"
      - name: site_id
        type: string
        source: input
        description: "FK -> Site.id; current installation site"
      - name: material_class
        type: enum
        source: input
        description: primary material; selects condition weights, maintenance protocols and graffiti SLA
        constraints: "BRONZE | PAINTED_STEEL | STONE | MURAL_COATING"
      - name: significance_tier
        type: enum
        source: input
        description: curatorial significance; multiplier in treatment_priority_score
        constraints: "LANDMARK | SIGNIFICANT | STANDARD"
      - name: footprint_units
        type: integer
        source: input
        description: installed footprint units consumed at the site
        constraints: ">= 1"
      - name: insured_value_cents
        type: integer
        source: input
        description: scheduled insured value in cents; base of the ACV claim variant
        constraints: ">= 0"
      - name: acquisition_date
        type: string
        source: input
        description: ISO date of acquisition; age basis for ACV depreciation
      - name: acquisition_document_ref
        type: string
        source: input
        description: reference to the acquisition agreement on file
      - name: recognized_stature
        type: boolean
        source: input
        description: whether the work is of recognized stature; blocks DESTRUCTION disposition
        default: false
      - name: custody_status
        type: enum
        source: system
        description: physical custody dimension; evolves independently of conservation_status
        default: ON_VIEW
        constraints: "ON_VIEW | IN_STORAGE | IN_TREATMENT | DEACCESSIONED | DESTROYED"
      - name: conservation_status
        type: enum
        source: system
        description: conservation dimension; evolves independently of custody_status
        default: MONITORED
        constraints: "MONITORED | TREATMENT_REQUIRED | TREATMENT_IN_PROGRESS | STABILIZED"
      - name: condition_index
        type: number
        source: computed
        description: latest condition index copied from the most recently FINALIZED ConditionAssessment
        default: null
      - name: treatment_priority_score
        type: number
        source: computed
        description: dual-variant treatment priority score; see calculations.treatment_priority_score
        default: null
      - name: treatment_priority_rank
        type: integer
        source: computed
        description: 1-based rank among Artwork WHERE conservation_status IN {TREATMENT_REQUIRED, TREATMENT_IN_PROGRESS}, ordered by treatment_priority_score DESC then created_at ASC
        default: null
      - name: priority_basis
        type: enum
        source: computed
        description: which variant produced treatment_priority_score
        default: NONE
        constraints: "NONE | SINGLE_ASSESSMENT | CYCLE_COHORT"
      - name: moral_rights_status
        type: enum
        source: computed
        description: "WAIVED when Artist.moral_rights_waiver_on_file == true; else EXPIRED when Artist.is_living == false; else ACTIVE"
        default: ACTIVE
        constraints: "ACTIVE | WAIVED | EXPIRED"
      - name: open_notice_count
        type: integer
        source: computed
        description: "count of MoralRightsNotice WHERE artwork_id == this.id AND status IN {SENT, ACKNOWLEDGED, WAIT_ELAPSED}"
        default: 0
      - name: last_maintenance_completed_on
        type: string
        source: computed
        description: ISO date of the most recent COMPLETED MaintenanceVisit
        default: null
      - name: next_maintenance_due_on
        type: string
        source: computed
        description: last_maintenance_completed_on plus the completed protocol's cycle_days
        default: null
      - name: maintenance_applications_ytd
        type: integer
        source: computed
        description: "count of MaintenanceVisit WHERE artwork_id == this.id AND status == COMPLETED AND completed_at year == logical-clock year"
        default: 0

  - name: MaintenanceProtocol
    parent: null
    common_fields: true
    fields:
      - name: protocol_code
        type: string
        source: input
        description: unique protocol code
        constraints: "unique across MaintenanceProtocol"
      - name: material_class
        type: enum
        source: input
        description: material this protocol applies to; must match the artwork's material_class
        constraints: "BRONZE | PAINTED_STEEL | STONE | MURAL_COATING"
      - name: method
        type: enum
        source: input
        description: routine care method
        constraints: "WASH | WAX | GRAFFITI_REMOVAL | COATING_RENEWAL | INSPECTION"
      - name: cycle_days
        type: integer
        source: input
        description: days between applications; sets Artwork.next_maintenance_due_on on completion
        constraints: "1..3650"
      - name: max_annual_applications
        type: integer
        source: input
        description: maximum COMPLETED applications of this protocol per artwork per clock year
        default: 4
        constraints: ">= 1"
      - name: requires_conservator
        type: boolean
        source: input
        description: whether the method may only be performed under a conservator engagement
        default: false
      - name: solvent_class
        type: enum
        source: input
        description: aggressiveness of the cleaning agent
        default: NONE
        constraints: "NONE | MILD | AGGRESSIVE"

  - name: MaintenanceVisit
    parent: null
    common_fields: true
    fields:
      - name: artwork_id
        type: string
        source: input
        description: "FK -> Artwork.id; the work being serviced"
      - name: protocol_id
        type: string
        source: input
        description: "FK -> MaintenanceProtocol.id; the routine protocol applied"
      - name: window_start
        type: datetime
        source: input
        description: start of the site work window, ISO 8601 UTC
      - name: window_end
        type: datetime
        source: input
        description: end of the site work window, ISO 8601 UTC
        constraints: "must be strictly after window_start"
      - name: graffiti_reported_at
        type: datetime
        source: input
        description: when the graffiti was reported; starts the removal SLA clock
        default: null
      - name: crew_note
        type: string
        source: input
        description: free-text crew instruction
        default: null
      - name: status
        type: enum
        source: system
        description: visit lifecycle
        default: SCHEDULED
        constraints: "SCHEDULED | IN_PROGRESS | COMPLETED | ABORTED"
      - name: abort_reason
        type: enum
        source: computed
        description: why the visit was aborted by a cascade
        default: NONE
        constraints: "NONE | SUPERSEDED_BY_TREATMENT | ARTWORK_DEACCESSIONED"
      - name: started_at
        type: datetime
        source: computed
        description: logical clock at start
        default: null
      - name: completed_at
        type: datetime
        source: computed
        description: logical clock at completion
        default: null
      - name: sla_deadline_at
        type: datetime
        source: computed
        description: graffiti_reported_at plus the material's GRAFFITI_SLA_HOURS; null when graffiti_reported_at is null
        default: null
      - name: sla_breached
        type: boolean
        source: computed
        description: true when completed_at is strictly after sla_deadline_at
        default: false

  - name: ConditionAssessment
    parent: null
    common_fields: true
    fields:
      - name: artwork_id
        type: string
        source: input
        description: "FK -> Artwork.id; the assessed work"
      - name: cycle_year
        type: integer
        source: input
        description: assessment cycle year this survey belongs to
        constraints: "2000..2100"
      - name: assessed_on
        type: string
        source: input
        description: ISO date the survey was performed; deferral basis for the cohort variant
      - name: surface_score
        type: integer
        source: input
        description: surface defect subscore, 0 = pristine, 4 = failed
        constraints: "0..4"
      - name: structural_score
        type: integer
        source: input
        description: structural defect subscore, 0..4
        constraints: "0..4"
      - name: coating_score
        type: integer
        source: input
        description: coating defect subscore, 0..4
        constraints: "0..4"
      - name: mount_score
        type: integer
        source: input
        description: mount and base defect subscore, 0..4
        constraints: "0..4"
      - name: graffiti_score
        type: integer
        source: input
        description: graffiti and soiling defect subscore, 0..4
        constraints: "0..4"
      - name: photo_count
        type: integer
        source: computed
        description: number of photographic records attached via POST /condition-assessments/{id}/photos
        default: 0
      - name: photo_view_codes
        type: array
        source: computed
        description: distinct view codes attached, in attachment order
        default: []
      - name: condition_index
        type: number
        source: computed
        description: weighted condition index; see calculations.condition_index_score
        default: null
      - name: recommendation
        type: enum
        source: computed
        description: band derived from condition_index at finalization
        default: NONE
        constraints: "NONE | ROUTINE | PRIORITY | URGENT"
      - name: status
        type: enum
        source: system
        description: survey review lifecycle with a revision loop
        default: DRAFT
        constraints: "DRAFT | SUBMITTED | REVISION_REQUESTED | FINALIZED | SUPERSEDED"
      - name: submitted_by_user_id
        type: string
        source: computed
        description: X-User-ID of the surveyor who submitted; may not finalize
        default: null
      - name: finalized_by_user_id
        type: string
        source: computed
        description: X-User-ID of the conservator who finalized
        default: null
      - name: revision_rounds
        type: integer
        source: computed
        description: number of times this survey re-entered REVISION_REQUESTED
        default: 0

  - name: Conservator
    parent: null
    common_fields: true
    fields:
      - name: firm_name
        type: string
        source: input
        description: conservation firm or sole practitioner name
      - name: accreditation
        type: enum
        source: input
        description: professional accreditation level
        constraints: "AIC_PA | AIC_ASSOCIATE | NONE"
      - name: material_specialties
        type: array
        source: input
        description: material classes the conservator is qualified to treat
        constraints: "non-empty subset of {BRONZE, PAINTED_STEEL, STONE, MURAL_COATING}"
      - name: hourly_rate_cents
        type: integer
        source: input
        description: contracted labor rate in cents per hour
        constraints: ">= 1"
      - name: insurance_expires_on
        type: string
        source: input
        description: ISO date the liability insurance lapses
      - name: status
        type: enum
        source: system
        description: vendor availability
        default: ACTIVE
        constraints: "ACTIVE | SUSPENDED"
      - name: active_engagement_count
        type: integer
        source: computed
        description: "count of TreatmentProposal WHERE conservator_id == this.id AND status IN {APPROVED, IN_EXECUTION}"
        default: 0

  - name: TreatmentProposal
    parent: null
    common_fields: true
    fields:
      - name: artwork_id
        type: string
        source: input
        description: "FK -> Artwork.id; the work to be treated"
      - name: conservator_id
        type: string
        source: input
        description: "FK -> Conservator.id; the engaged conservator"
      - name: assessment_id
        type: string
        source: input
        description: "FK -> ConditionAssessment.id; the FINALIZED survey justifying treatment"
      - name: treatment_scope
        type: enum
        source: input
        description: scope class; selects the labor complexity multiplier
        constraints: "STABILIZATION | SURFACE | COATING | STRUCTURAL | GRAFFITI"
      - name: alters_appearance
        type: boolean
        source: input
        description: whether the treatment alters the work's appearance; triggers artist consultation and notice rules
        default: false
      - name: engagement_start
        type: datetime
        source: input
        description: start of the conservator engagement window, ISO 8601 UTC
      - name: engagement_end
        type: datetime
        source: input
        description: end of the conservator engagement window, ISO 8601 UTC
        constraints: "must be strictly after engagement_start"
      - name: line_items
        type: array
        source: computed
        description: "cost lines added via POST /treatment-proposals/{id}/line-items; each object holds labor_hours, complexity_class, materials_cents, labor_cents, line_total_cents"
        default: []
      - name: subtotal_cents
        type: integer
        source: computed
        description: sum of per-line rounded line_total_cents
        default: 0
      - name: overhead_cents
        type: integer
        source: computed
        description: OVERHEAD_PCT applied to subtotal_cents
        default: 0
      - name: contingency_cents
        type: integer
        source: computed
        description: CONTINGENCY_PCT applied to subtotal_cents
        default: 0
      - name: mobilization_cents
        type: integer
        source: computed
        description: flat mobilization charge, MOBILIZATION_FLAT_CENTS when at least one line exists else 0
        default: 0
      - name: estimate_total_cents
        type: integer
        source: computed
        description: current estimate; see calculations.proposal_estimate_total_cents
        default: 0
      - name: pinned_estimate_total_cents
        type: integer
        source: computed
        description: estimate_total_cents frozen at approval; basis of the RESTORATION claim variant
        default: null
      - name: status
        type: enum
        source: system
        description: proposal lifecycle with a revision loop
        default: DRAFT
        constraints: "DRAFT | SUBMITTED | REVISION_REQUESTED | APPROVED | IN_EXECUTION | COMPLETED | REJECTED | WITHDRAWN"
      - name: revision_rounds
        type: integer
        source: computed
        description: number of times this proposal re-entered REVISION_REQUESTED
        default: 0
      - name: submitted_by_user_id
        type: string
        source: computed
        description: X-User-ID of the submitter
        default: null
      - name: approved_by_user_id
        type: string
        source: computed
        description: X-User-ID of the approver
        default: null
      - name: withdraw_reason
        type: enum
        source: computed
        description: why the proposal was withdrawn by a cascade
        default: NONE
        constraints: "NONE | PROPOSAL_SUPERSEDED | ARTWORK_DEACCESSIONED"

  - name: ArtistConsultation
    parent: null
    common_fields: true
    fields:
      - name: artwork_id
        type: string
        source: input
        description: "FK -> Artwork.id; the work under consultation"
      - name: artist_id
        type: string
        source: input
        description: "FK -> Artist.id; the consulted artist"
      - name: proposal_id
        type: string
        source: input
        description: "FK -> TreatmentProposal.id; nullable, set when the consultation concerns a specific treatment"
        default: null
      - name: subject
        type: enum
        source: input
        description: what the artist is being consulted about
        constraints: "TREATMENT | RELOCATION | REMOVAL | DEACCESSION"
      - name: sent_on
        type: string
        source: computed
        description: ISO date stamped from the logical clock at creation
      - name: due_at
        type: datetime
        source: computed
        description: creation clock plus Artist.consultation_response_days
      - name: status
        type: enum
        source: system
        description: consultation outcome; WAIVED is stamped at creation when moral_rights_status is WAIVED
        default: PENDING
        constraints: "PENDING | CONCURRED | OBJECTED | LAPSED | WAIVED"
      - name: response_note
        type: string
        source: input
        description: the artist's written response
        default: null
      - name: responded_at
        type: datetime
        source: computed
        description: logical clock when the artist responded
        default: null

  - name: MoralRightsNotice
    parent: null
    common_fields: true
    fields:
      - name: artwork_id
        type: string
        source: input
        description: "FK -> Artwork.id; the work to be altered, relocated or removed"
      - name: artist_id
        type: string
        source: input
        description: "FK -> Artist.id; the notified artist"
      - name: action_type
        type: enum
        source: input
        description: the action the notice authorizes once the wait elapses
        constraints: "ALTERATION | RELOCATION | REMOVAL | DESTRUCTION"
      - name: sent_at
        type: datetime
        source: computed
        description: logical clock at creation
      - name: earliest_action_at
        type: datetime
        source: computed
        description: sent_at plus Artist.notice_wait_days; the action is permitted at or after this instant
      - name: status
        type: enum
        source: system
        description: notice lifecycle
        default: SENT
        constraints: "SENT | ACKNOWLEDGED | WAIT_ELAPSED | CONSUMED | VOID"
      - name: acknowledged_at
        type: datetime
        source: computed
        description: logical clock when the artist acknowledged
        default: null
      - name: consumed_by_ref
        type: string
        source: computed
        description: id of the relocation or deaccession action that consumed this notice
        default: null

  - name: DeaccessionCase
    parent: null
    common_fields: true
    fields:
      - name: artwork_id
        type: string
        source: input
        description: "FK -> Artwork.id; the work proposed for deaccession"
      - name: criteria
        type: array
        source: input
        description: "review criteria cited; non-empty subset of {DETERIORATION_BEYOND_REPAIR, PUBLIC_SAFETY_HAZARD, SITE_REDEVELOPMENT, DUPLICATE_HOLDING, LACK_OF_RELEVANCE}"
        constraints: "at least one member"
      - name: disposition
        type: enum
        source: input
        description: intended disposition of the work
        constraints: "SALE | TRANSFER | DESTRUCTION | RETURN_TO_ARTIST"
      - name: disposition_target_ref
        type: string
        source: input
        description: receiving institution or buyer reference; required at execution for SALE and TRANSFER
        default: null
      - name: comment_days
        type: integer
        source: input
        description: length of the public comment period in days
        default: 45
        constraints: "7..180"
      - name: initiated_by_user_id
        type: string
        source: computed
        description: X-User-ID of the initiator; may not cast APPROVE or DENY votes
      - name: public_comment_opens_on
        type: string
        source: computed
        description: ISO date the comment period opened
        default: null
      - name: public_comment_closes_at
        type: datetime
        source: computed
        description: comment open instant plus comment_days
        default: null
      - name: status
        type: enum
        source: system
        description: review lifecycle
        default: INITIATED
        constraints: "INITIATED | PUBLIC_COMMENT | BOARD_REVIEW | APPROVED | DENIED | EXECUTED"
      - name: vote_records
        type: array
        source: computed
        description: "commission ballots in cast order; each object holds member_user_id, ballot, created_at"
        default: []
      - name: approve_count
        type: integer
        source: computed
        description: number of APPROVE ballots
        default: 0
      - name: deny_count
        type: integer
        source: computed
        description: number of DENY ballots
        default: 0
      - name: abstain_count
        type: integer
        source: computed
        description: number of ABSTAIN ballots
        default: 0
      - name: recuse_count
        type: integer
        source: computed
        description: number of RECUSE ballots, excluded from quorum
        default: 0
      - name: decision_ratio
        type: number
        source: computed
        description: "approve_count / (approve_count + deny_count) evaluated at quorum; defined as exactly 0 when that denominator is zero because every quorum ballot was ABSTAIN"
        default: null
      - name: executed_at
        type: datetime
        source: computed
        description: logical clock when the deaccession was executed
        default: null

  - name: FundingPool
    parent: null
    common_fields: true
    fields:
      - name: pool_code
        type: string
        source: input
        description: unique pool code
        constraints: "unique across FundingPool"
      - name: pool_type
        type: enum
        source: input
        description: funding source; selects the draw formula branch
        constraints: "ENDOWMENT | PERCENT_FOR_ART"
      - name: fiscal_year
        type: integer
        source: input
        description: fiscal year the pool funds
        constraints: "2000..2100"
      - name: principal_cents
        type: integer
        source: input
        description: endowment principal in cents; 0 for PERCENT_FOR_ART
        default: 0
        constraints: ">= 0"
      - name: draw_rate_bps
        type: integer
        source: input
        description: annual draw rate in basis points; 0 for PERCENT_FOR_ART
        default: 0
        constraints: "0..2000"
      - name: set_aside_cents
        type: integer
        source: input
        description: percent-for-art set-aside in cents; 0 for ENDOWMENT
        default: 0
        constraints: ">= 0"
      - name: recovery_credits_cents
        type: integer
        source: computed
        description: cumulative insurance settlements credited back to this pool
        default: 0
      - name: draw_authorized_cents
        type: integer
        source: computed
        description: authorized draw net of admin fee; see calculations.pool_draw_available_cents
        default: 0
      - name: admin_fee_cents
        type: integer
        source: computed
        description: administrative fee withheld from the authorized draw
        default: 0
      - name: available_cents
        type: integer
        source: computed
        description: "draw_authorized_cents + recovery_credits_cents - sum of FundingAllocation.amount_cents WHERE pool_id == this.id AND status IN {RESERVED, COMMITTED, DISBURSED}"
        default: 0

  - name: FundingAllocation
    parent: null
    common_fields: true
    fields:
      - name: pool_id
        type: string
        source: input
        description: "FK -> FundingPool.id; the pool charged"
      - name: proposal_id
        type: string
        source: input
        description: "FK -> TreatmentProposal.id; nullable, set when purpose == TREATMENT"
        default: null
      - name: visit_id
        type: string
        source: input
        description: "FK -> MaintenanceVisit.id; nullable, set when purpose == MAINTENANCE"
        default: null
      - name: purpose
        type: enum
        source: input
        description: what the reservation funds
        constraints: "TREATMENT | MAINTENANCE"
      - name: amount_cents
        type: integer
        source: input
        description: reserved amount in cents
        constraints: ">= 1"
      - name: status
        type: enum
        source: system
        description: reservation lifecycle
        default: RESERVED
        constraints: "RESERVED | COMMITTED | DISBURSED | RELEASED"
      - name: release_reason
        type: enum
        source: computed
        description: why the reservation was released
        default: NONE
        constraints: "NONE | VISIT_ABORTED | PROPOSAL_WITHDRAWN | PROPOSAL_REJECTED | MANUAL_RELEASE"
      - name: released_at
        type: datetime
        source: computed
        description: logical clock when released
        default: null

  - name: DamageIncident
    parent: null
    common_fields: true
    fields:
      - name: artwork_id
        type: string
        source: input
        description: "FK -> Artwork.id; the damaged work"
      - name: incident_type
        type: enum
        source: input
        description: nature of the damage event
        constraints: "GRAFFITI | VANDALISM | VEHICLE_IMPACT | WEATHER | THEFT"
      - name: damage_extent_pct
        type: number
        source: input
        description: fraction of the work's value impaired, 0..1, two decimals
        constraints: "0.00..1.00"
      - name: narrative
        type: string
        source: input
        description: incident narrative of record
      - name: linked_proposal_id
        type: string
        source: input
        description: "FK -> TreatmentProposal.id; nullable, the APPROVED repair proposal used by the RESTORATION claim variant"
        default: null
      - name: reported_at
        type: datetime
        source: computed
        description: logical clock at report time
      - name: damage_status
        type: enum
        source: system
        description: response dimension; evolves independently of claim_status
        default: REPORTED
        constraints: "REPORTED | TRIAGED | RESOLVED"
      - name: triage_class
        type: enum
        source: computed
        description: response route chosen at triage
        default: NONE
        constraints: "NONE | ROUTINE_MAINTENANCE | CONSERVATOR_TREATMENT | TOTAL_LOSS"
      - name: claim_status
        type: enum
        source: system
        description: insurance dimension; evolves independently of damage_status
        default: NONE
        constraints: "NONE | FILED | SETTLED | DENIED"
      - name: claim_basis
        type: enum
        source: computed
        description: which settlement variant the filed claim uses
        default: NONE
        constraints: "NONE | ACV | RESTORATION"
      - name: claimed_gross_cents
        type: integer
        source: computed
        description: gross claim before policy limit and deductible
        default: 0
      - name: settlement_cents
        type: integer
        source: computed
        description: settled amount; see calculations.claim_settlement_cents
        default: 0
      - name: credited_pool_id
        type: string
        source: input
        description: "FK -> FundingPool.id; nullable, pool credited with the settlement on resolution"
        default: null

state_machines:
  - entity: ConditionAssessment
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /public-art/condition-assessments/{id}/submit"
        actor: ConditionSurveyor
        preconditions:
          - "status == DRAFT"
          - "photo_count >= MIN_ASSESSMENT_PHOTOS (3)"
          - "Artwork.custody_status NOT IN {DEACCESSIONED, DESTROYED}"
        side_effects:
          - "submitted_by_user_id = X-User-ID"
          - "increments ConditionAssessment.version by 1"
      - from: SUBMITTED
        to: REVISION_REQUESTED
        trigger: "POST /public-art/condition-assessments/{id}/request-revision"
        actor: ChiefConservator
        preconditions:
          - "status == SUBMITTED"
          - "revision_rounds < MAX_REVISION_ROUNDS (2)"
        side_effects:
          - "revision_rounds increases by 1"
          - "increments ConditionAssessment.version by 1"
        note: "cycle edge; the third request-revision on the same survey is rejected with ERR_REVISION_LIMIT_REACHED"
      - from: REVISION_REQUESTED
        to: SUBMITTED
        trigger: "POST /public-art/condition-assessments/{id}/submit"
        actor: ConditionSurveyor
        preconditions:
          - "status == REVISION_REQUESTED"
          - "photo_count >= MIN_ASSESSMENT_PHOTOS (3)"
        side_effects:
          - "submitted_by_user_id = X-User-ID (restamped each round)"
          - "increments ConditionAssessment.version by 1"
        note: "closes the revision loop SUBMITTED -> REVISION_REQUESTED -> SUBMITTED"
      - from: SUBMITTED
        to: FINALIZED
        trigger: "POST /public-art/condition-assessments/{id}/finalize"
        actor: ChiefConservator
        preconditions:
          - "status == SUBMITTED"
          - "X-User-ID != submitted_by_user_id (segregation of duties)"
          - "Artwork.custody_status NOT IN {DEACCESSIONED, DESTROYED}"
        side_effects:
          - "recompute condition_index via calculations.condition_index_score and set recommendation band"
          - "CASCADE A hop 1: every other ConditionAssessment WHERE artwork_id == this.artwork_id AND status == FINALIZED transitions FINALIZED -> SUPERSEDED"
          - "CASCADE A hop 2: because this survey is now FINALIZED, Artwork.condition_index = this.condition_index, Artwork.treatment_priority_score recomputed via calculations.treatment_priority_score variant single_assessment, Artwork.priority_basis = SINGLE_ASSESSMENT, and Artwork.conservation_status moves MONITORED|STABILIZED -> TREATMENT_REQUIRED when condition_index < TREATMENT_TRIGGER_INDEX (55.0)"
          - "CASCADE A hop 3: because Artwork.conservation_status became TREATMENT_REQUIRED, every MaintenanceVisit WHERE artwork_id == this.artwork_id AND status == SCHEDULED AND its MaintenanceProtocol.requires_conservator == false transitions SCHEDULED -> ABORTED with abort_reason = SUPERSEDED_BY_TREATMENT"
          - "CASCADE A hop 4: because those visits became ABORTED, every FundingAllocation WHERE visit_id IN (aborted visits) AND status IN {RESERVED, COMMITTED} transitions to RELEASED with release_reason = VISIT_ABORTED"
          - "CASCADE A hop 5: because those allocations became RELEASED, FundingPool.available_cents is recomputed and rises by the released amount_cents"
          - "treatment_priority_rank recomputed over Artwork WHERE conservation_status IN {TREATMENT_REQUIRED, TREATMENT_IN_PROGRESS}, ordered by treatment_priority_score DESC then created_at ASC"
          - "finalized_by_user_id = X-User-ID"
          - "increments ConditionAssessment.version by 1"
      - from: FINALIZED
        to: SUPERSEDED
        trigger: "system: a later ConditionAssessment on the same artwork is FINALIZED"
        actor: system
        preconditions:
          - "status == FINALIZED"
          - "another ConditionAssessment WHERE artwork_id == this.artwork_id reaches FINALIZED"
        side_effects:
          - "increments ConditionAssessment.version by 1"

  - entity: TreatmentProposal
    initial_state: DRAFT
    terminal_states: [COMPLETED, REJECTED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /public-art/treatment-proposals/{id}/submit"
        actor: ChiefConservator
        preconditions:
          - "status == DRAFT"
          - "line_items is non-empty"
          - "Artwork.custody_status NOT IN {DEACCESSIONED, DESTROYED}"
        side_effects:
          - "submitted_by_user_id = X-User-ID"
          - "increments TreatmentProposal.version by 1"
      - from: SUBMITTED
        to: REVISION_REQUESTED
        trigger: "POST /public-art/treatment-proposals/{id}/request-revision"
        actor: PublicArtManager
        preconditions:
          - "status == SUBMITTED"
          - "revision_rounds < MAX_REVISION_ROUNDS (2)"
        side_effects:
          - "revision_rounds increases by 1"
          - "increments TreatmentProposal.version by 1"
      - from: REVISION_REQUESTED
        to: SUBMITTED
        trigger: "POST /public-art/treatment-proposals/{id}/submit"
        actor: ChiefConservator
        preconditions:
          - "status == REVISION_REQUESTED"
          - "line_items is non-empty"
        side_effects:
          - "submitted_by_user_id = X-User-ID"
          - "increments TreatmentProposal.version by 1"
        note: "closes the negotiation loop SUBMITTED -> REVISION_REQUESTED -> SUBMITTED"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /public-art/treatment-proposals/{id}/approve"
        actor: PublicArtManager
        preconditions:
          - "status == SUBMITTED"
          - "Conservator.status == ACTIVE AND Conservator.insurance_expires_on >= date(engagement_end) AND Artwork.material_class IN Conservator.material_specialties"
          - "no other TreatmentProposal WHERE conservator_id == this.conservator_id AND status IN {APPROVED, IN_EXECUTION} whose engagement window collides with this one under the CONSERVATOR_BUFFER_HOURS (48) rule"
          - "when alters_appearance == true AND Artwork.moral_rights_status == ACTIVE: an ArtistConsultation WHERE proposal_id == this.id exists with status IN {CONCURRED, LAPSED}"
          - "a FundingAllocation WHERE proposal_id == this.id AND status == RESERVED exists with amount_cents >= estimate_total_cents"
        side_effects:
          - "pinned_estimate_total_cents = estimate_total_cents"
          - "Conservator.active_engagement_count increases by 1"
          - "CASCADE C hop 1: because this proposal is now APPROVED, every other TreatmentProposal WHERE artwork_id == this.artwork_id AND status IN {DRAFT, SUBMITTED, REVISION_REQUESTED} transitions to WITHDRAWN with withdraw_reason = PROPOSAL_SUPERSEDED"
          - "CASCADE C hop 2: because those proposals became WITHDRAWN, every FundingAllocation WHERE proposal_id IN (superseded proposals) AND status IN {RESERVED, COMMITTED} transitions to RELEASED with release_reason = PROPOSAL_WITHDRAWN"
          - "CASCADE C hop 3: because those allocations became RELEASED, FundingPool.available_cents is recomputed upward"
          - "approved_by_user_id = X-User-ID"
          - "increments TreatmentProposal.version by 1"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /public-art/treatment-proposals/{id}/reject"
        actor: PublicArtManager
        preconditions:
          - "status == SUBMITTED"
        side_effects:
          - "every FundingAllocation WHERE proposal_id == this.id AND status IN {RESERVED, COMMITTED} transitions to RELEASED with release_reason = PROPOSAL_REJECTED"
          - "FundingPool.available_cents recomputed upward"
          - "increments TreatmentProposal.version by 1"
      - from: APPROVED
        to: IN_EXECUTION
        trigger: "POST /public-art/treatment-proposals/{id}/start-execution"
        actor: ConservatorVendor
        preconditions:
          - "status == APPROVED"
          - "X-User-ID == conservator_id"
          - "Artwork.custody_status IN {ON_VIEW, IN_STORAGE}"
          - "no MaintenanceVisit WHERE artwork_id == this.artwork_id AND status == IN_PROGRESS"
        side_effects:
          - "Artwork.custody_status -> IN_TREATMENT and Artwork.conservation_status -> TREATMENT_IN_PROGRESS"
          - "Site.installed_units_used unchanged because IN_TREATMENT still occupies the site"
          - "FundingAllocation WHERE proposal_id == this.id AND status == RESERVED transitions RESERVED -> COMMITTED"
          - "increments TreatmentProposal.version by 1"
      - from: IN_EXECUTION
        to: COMPLETED
        trigger: "POST /public-art/treatment-proposals/{id}/complete"
        actor: ConservatorVendor
        preconditions:
          - "status == IN_EXECUTION"
          - "X-User-ID == conservator_id"
        side_effects:
          - "Artwork.custody_status -> ON_VIEW and Artwork.conservation_status -> STABILIZED"
          - "Artwork.treatment_priority_score -> null, Artwork.treatment_priority_rank -> null, Artwork.priority_basis -> NONE, and ranks recomputed for the remaining cohort"
          - "FundingAllocation WHERE proposal_id == this.id AND status == COMMITTED transitions COMMITTED -> DISBURSED"
          - "Conservator.active_engagement_count decreases by 1"
          - "every DamageIncident WHERE linked_proposal_id == this.id AND damage_status == TRIAGED transitions TRIAGED -> RESOLVED"
          - "increments TreatmentProposal.version by 1"
      - from: DRAFT
        to: WITHDRAWN
        trigger: "system: CASCADE B hop 2 from POST /public-art/deaccession-cases/{id}/execute"
        actor: system
        preconditions:
          - "status == DRAFT"
          - "Artwork.custody_status became DEACCESSIONED or DESTROYED"
        side_effects:
          - "withdraw_reason = ARTWORK_DEACCESSIONED"
          - "increments TreatmentProposal.version by 1"
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "system: CASCADE B hop 2 from POST /public-art/deaccession-cases/{id}/execute"
        actor: system
        preconditions:
          - "status == SUBMITTED"
          - "Artwork.custody_status became DEACCESSIONED or DESTROYED"
        side_effects:
          - "withdraw_reason = ARTWORK_DEACCESSIONED"
          - "CASCADE B hop 3: FundingAllocation WHERE proposal_id == this.id AND status IN {RESERVED, COMMITTED} transitions to RELEASED with release_reason = PROPOSAL_WITHDRAWN"
          - "increments TreatmentProposal.version by 1"
      - from: REVISION_REQUESTED
        to: WITHDRAWN
        trigger: "system: CASCADE B hop 2 from POST /public-art/deaccession-cases/{id}/execute"
        actor: system
        preconditions:
          - "status == REVISION_REQUESTED"
          - "Artwork.custody_status became DEACCESSIONED or DESTROYED"
        side_effects:
          - "withdraw_reason = ARTWORK_DEACCESSIONED"
          - "increments TreatmentProposal.version by 1"
      - from: APPROVED
        to: WITHDRAWN
        trigger: "system: CASCADE B hop 2 from POST /public-art/deaccession-cases/{id}/execute"
        actor: system
        preconditions:
          - "status == APPROVED"
          - "Artwork.custody_status became DEACCESSIONED or DESTROYED"
        side_effects:
          - "withdraw_reason = ARTWORK_DEACCESSIONED"
          - "Conservator.active_engagement_count decreases by 1"
          - "CASCADE B hop 3: FundingAllocation WHERE proposal_id == this.id AND status IN {RESERVED, COMMITTED} transitions to RELEASED with release_reason = PROPOSAL_WITHDRAWN"
          - "increments TreatmentProposal.version by 1"

  - entity: Artwork
    initial_state: "custody_status = ON_VIEW; conservation_status = MONITORED (two independent dimensions on one row)"
    terminal_states: [DEACCESSIONED, DESTROYED]
    transitions:
      - from: ON_VIEW
        to: IN_STORAGE
        trigger: "POST /public-art/artworks/{id}/relocate with to_storage == true"
        actor: CollectionsRegistrar
        preconditions:
          - "custody_status == ON_VIEW"
          - "when moral_rights_status == ACTIVE: a MoralRightsNotice WHERE artwork_id == this.id AND action_type == RELOCATION AND status IN {ACKNOWLEDGED, WAIT_ELAPSED} exists whose earliest_action_at <= logical clock"
        side_effects:
          - "the consumed MoralRightsNotice transitions to CONSUMED with consumed_by_ref = this artwork id"
          - "Site.installed_units_used on the current site decreases by footprint_units"
          - "increments Artwork.version by 1"
      - from: IN_STORAGE
        to: ON_VIEW
        trigger: "POST /public-art/artworks/{id}/relocate with to_site_id set"
        actor: CollectionsRegistrar
        preconditions:
          - "custody_status == IN_STORAGE"
          - "target Site.installed_units_used + footprint_units <= target Site.capacity_units"
        side_effects:
          - "site_id = to_site_id"
          - "target Site.installed_units_used increases by footprint_units"
          - "increments Artwork.version by 1"
        note: "compensating action for the ON_VIEW -> IN_STORAGE move; the site-units invariant must hold again afterwards"
      - from: ON_VIEW
        to: IN_TREATMENT
        trigger: "POST /public-art/treatment-proposals/{id}/start-execution"
        actor: ConservatorVendor
        preconditions:
          - "custody_status == ON_VIEW"
          - "the proposal is APPROVED"
        side_effects:
          - "conservation_status -> TREATMENT_IN_PROGRESS"
          - "increments Artwork.version by 1"
      - from: IN_STORAGE
        to: IN_TREATMENT
        trigger: "POST /public-art/treatment-proposals/{id}/start-execution"
        actor: ConservatorVendor
        preconditions:
          - "custody_status == IN_STORAGE"
          - "the proposal is APPROVED"
        side_effects:
          - "conservation_status -> TREATMENT_IN_PROGRESS"
          - "increments Artwork.version by 1"
      - from: IN_TREATMENT
        to: ON_VIEW
        trigger: "POST /public-art/treatment-proposals/{id}/complete"
        actor: ConservatorVendor
        preconditions:
          - "custody_status == IN_TREATMENT"
        side_effects:
          - "conservation_status -> STABILIZED"
          - "increments Artwork.version by 1"
      - from: ON_VIEW
        to: DEACCESSIONED
        trigger: "POST /public-art/deaccession-cases/{id}/execute with disposition IN {SALE, TRANSFER, RETURN_TO_ARTIST}"
        actor: PublicArtManager
        preconditions:
          - "custody_status == ON_VIEW"
          - "the DeaccessionCase is APPROVED"
        side_effects:
          - "CASCADE B hop 1 target; Site.installed_units_used decreases by footprint_units"
          - "increments Artwork.version by 1"
      - from: IN_STORAGE
        to: DEACCESSIONED
        trigger: "POST /public-art/deaccession-cases/{id}/execute with disposition IN {SALE, TRANSFER, RETURN_TO_ARTIST}"
        actor: PublicArtManager
        preconditions:
          - "custody_status == IN_STORAGE"
          - "the DeaccessionCase is APPROVED"
        side_effects:
          - "increments Artwork.version by 1"
      - from: ON_VIEW
        to: DESTROYED
        trigger: "POST /public-art/deaccession-cases/{id}/execute with disposition == DESTRUCTION"
        actor: PublicArtManager
        preconditions:
          - "custody_status == ON_VIEW"
          - "recognized_stature == false"
          - "the DeaccessionCase is APPROVED"
        side_effects:
          - "Site.installed_units_used decreases by footprint_units"
          - "increments Artwork.version by 1"
      - from: IN_STORAGE
        to: DESTROYED
        trigger: "POST /public-art/deaccession-cases/{id}/execute with disposition == DESTRUCTION"
        actor: PublicArtManager
        preconditions:
          - "custody_status == IN_STORAGE"
          - "recognized_stature == false"
          - "the DeaccessionCase is APPROVED"
        side_effects:
          - "increments Artwork.version by 1"
      - from: MONITORED
        to: TREATMENT_REQUIRED
        trigger: "POST /public-art/condition-assessments/{id}/finalize (CASCADE A hop 2)"
        actor: system
        preconditions:
          - "conservation_status == MONITORED"
          - "the finalized survey's condition_index < TREATMENT_TRIGGER_INDEX (55.0)"
        side_effects:
          - "treatment_priority_score and treatment_priority_rank set; priority_basis = SINGLE_ASSESSMENT"
          - "increments Artwork.version by 1"
      - from: STABILIZED
        to: TREATMENT_REQUIRED
        trigger: "POST /public-art/condition-assessments/{id}/finalize (CASCADE A hop 2)"
        actor: system
        preconditions:
          - "conservation_status == STABILIZED"
          - "the finalized survey's condition_index < TREATMENT_TRIGGER_INDEX (55.0)"
        side_effects:
          - "treatment_priority_score and treatment_priority_rank set; priority_basis = SINGLE_ASSESSMENT"
          - "increments Artwork.version by 1"
        note: "conservation dimension is cyclic: a stabilized work can be flagged for treatment again by a later survey"
      - from: TREATMENT_REQUIRED
        to: TREATMENT_IN_PROGRESS
        trigger: "POST /public-art/treatment-proposals/{id}/start-execution"
        actor: ConservatorVendor
        preconditions:
          - "conservation_status == TREATMENT_REQUIRED"
        side_effects:
          - "increments Artwork.version by 1"
      - from: TREATMENT_IN_PROGRESS
        to: STABILIZED
        trigger: "POST /public-art/treatment-proposals/{id}/complete"
        actor: ConservatorVendor
        preconditions:
          - "conservation_status == TREATMENT_IN_PROGRESS"
        side_effects:
          - "increments Artwork.version by 1"
      - from: STABILIZED
        to: MONITORED
        trigger: "POST /public-art/ops/run-cycle"
        actor: PublicArtManager
        preconditions:
          - "conservation_status == STABILIZED"
          - "a ConditionAssessment WHERE artwork_id == this.id AND status == FINALIZED AND cycle_year == the run-cycle cycle_year exists with condition_index >= TREATMENT_TRIGGER_INDEX (55.0)"
        side_effects:
          - "increments Artwork.version by 1"
        note: "closes the conservation cycle MONITORED -> TREATMENT_REQUIRED -> TREATMENT_IN_PROGRESS -> STABILIZED -> MONITORED"

  - entity: MaintenanceVisit
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, ABORTED]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /public-art/maintenance-visits/{id}/start"
        actor: MaintenanceCrew
        preconditions:
          - "status == SCHEDULED"
          - "logical clock >= window_start"
          - "Artwork.custody_status IN {ON_VIEW, IN_STORAGE}"
        side_effects:
          - "started_at = logical clock"
          - "FundingAllocation WHERE visit_id == this.id AND status == RESERVED transitions RESERVED -> COMMITTED"
          - "increments MaintenanceVisit.version by 1"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /public-art/maintenance-visits/{id}/complete"
        actor: MaintenanceCrew
        preconditions:
          - "status == IN_PROGRESS"
          - "count of COMPLETED MaintenanceVisit for this artwork and protocol in the clock year < MaintenanceProtocol.max_annual_applications"
        side_effects:
          - "completed_at = logical clock; sla_breached evaluated via calculations.maintenance_sla_and_due"
          - "Artwork.last_maintenance_completed_on and Artwork.next_maintenance_due_on recomputed; Artwork.maintenance_applications_ytd increases by 1"
          - "FundingAllocation WHERE visit_id == this.id AND status == COMMITTED transitions COMMITTED -> DISBURSED"
          - "increments MaintenanceVisit.version by 1"
      - from: SCHEDULED
        to: ABORTED
        trigger: "system: CASCADE A hop 3 from POST /public-art/condition-assessments/{id}/finalize"
        actor: system
        preconditions:
          - "status == SCHEDULED"
          - "Artwork.conservation_status became TREATMENT_REQUIRED"
          - "MaintenanceProtocol.requires_conservator == false"
        side_effects:
          - "abort_reason = SUPERSEDED_BY_TREATMENT"
          - "CASCADE A hop 4: FundingAllocation WHERE visit_id == this.id AND status IN {RESERVED, COMMITTED} transitions to RELEASED with release_reason = VISIT_ABORTED"
          - "increments MaintenanceVisit.version by 1"
      - from: SCHEDULED
        to: ABORTED
        trigger: "system: CASCADE B hop 2 from POST /public-art/deaccession-cases/{id}/execute"
        actor: system
        preconditions:
          - "status == SCHEDULED"
          - "Artwork.custody_status became DEACCESSIONED or DESTROYED"
        side_effects:
          - "abort_reason = ARTWORK_DEACCESSIONED"
          - "CASCADE B hop 3: FundingAllocation WHERE visit_id == this.id AND status IN {RESERVED, COMMITTED} transitions to RELEASED with release_reason = VISIT_ABORTED"
          - "increments MaintenanceVisit.version by 1"

  - entity: FundingAllocation
    initial_state: RESERVED
    terminal_states: [DISBURSED, RELEASED]
    transitions:
      - from: RESERVED
        to: COMMITTED
        trigger: "POST /public-art/treatment-proposals/{id}/start-execution or POST /public-art/maintenance-visits/{id}/start"
        actor: system
        preconditions:
          - "status == RESERVED"
          - "the linked proposal reached IN_EXECUTION or the linked visit reached IN_PROGRESS"
        side_effects:
          - "FundingPool.available_cents unchanged (RESERVED and COMMITTED are both encumbered)"
          - "increments FundingAllocation.version by 1"
      - from: COMMITTED
        to: DISBURSED
        trigger: "POST /public-art/treatment-proposals/{id}/complete or POST /public-art/maintenance-visits/{id}/complete"
        actor: system
        preconditions:
          - "status == COMMITTED"
        side_effects:
          - "FundingPool.available_cents unchanged (DISBURSED remains encumbered)"
          - "increments FundingAllocation.version by 1"
      - from: RESERVED
        to: RELEASED
        trigger: "POST /public-art/funding-allocations/{id}/release"
        actor: FinanceOfficer
        preconditions:
          - "status == RESERVED"
        side_effects:
          - "release_reason = MANUAL_RELEASE; released_at = logical clock"
          - "FundingPool.available_cents increases by amount_cents"
          - "increments FundingAllocation.version by 1"
        note: "compensating action for the reserve; the money invariant must hold again afterwards"
      - from: RESERVED
        to: RELEASED
        trigger: "system: CASCADE A hop 4 / CASCADE B hop 3 / CASCADE C hop 2 / proposal rejection"
        actor: system
        preconditions:
          - "status == RESERVED"
          - "the linked visit became ABORTED or the linked proposal became WITHDRAWN or REJECTED"
        side_effects:
          - "release_reason = VISIT_ABORTED | PROPOSAL_WITHDRAWN | PROPOSAL_REJECTED"
          - "FundingPool.available_cents increases by amount_cents"
          - "increments FundingAllocation.version by 1"
      - from: COMMITTED
        to: RELEASED
        trigger: "system: CASCADE A hop 4 / CASCADE B hop 3"
        actor: system
        preconditions:
          - "status == COMMITTED"
          - "the linked visit became ABORTED or the linked proposal became WITHDRAWN"
        side_effects:
          - "release_reason = VISIT_ABORTED | PROPOSAL_WITHDRAWN"
          - "FundingPool.available_cents increases by amount_cents"
          - "increments FundingAllocation.version by 1"

  - entity: DeaccessionCase
    initial_state: INITIATED
    terminal_states: [DENIED, EXECUTED]
    transitions:
      - from: INITIATED
        to: PUBLIC_COMMENT
        trigger: "POST /public-art/deaccession-cases/{id}/advance"
        actor: PublicArtManager
        preconditions:
          - "status == INITIATED"
          - "Artwork.custody_status NOT IN {DEACCESSIONED, DESTROYED}"
        side_effects:
          - "public_comment_opens_on = date(logical clock); public_comment_closes_at = logical clock + comment_days days"
          - "increments DeaccessionCase.version by 1"
      - from: PUBLIC_COMMENT
        to: BOARD_REVIEW
        trigger: "POST /public-art/deaccession-cases/{id}/advance"
        actor: PublicArtManager
        preconditions:
          - "status == PUBLIC_COMMENT"
          - "logical clock >= public_comment_closes_at"
        side_effects:
          - "increments DeaccessionCase.version by 1"
      - from: BOARD_REVIEW
        to: APPROVED
        trigger: "system: auto-tally on POST /public-art/deaccession-cases/{id}/votes"
        actor: system
        preconditions:
          - "status == BOARD_REVIEW"
          - "approve_count + deny_count + abstain_count >= QUORUM_MIN_VOTES (5)"
          - "decision_ratio = approve_count / (approve_count + deny_count) >= APPROVE_RATIO_MIN (0.60)"
        side_effects:
          - "decision_ratio pinned; increments DeaccessionCase.version by 1"
      - from: BOARD_REVIEW
        to: DENIED
        trigger: "system: auto-tally on POST /public-art/deaccession-cases/{id}/votes"
        actor: system
        preconditions:
          - "status == BOARD_REVIEW"
          - "non-RECUSE ballot count >= QUORUM_MIN_VOTES (5)"
          - "decision_ratio = approve_count / (approve_count + deny_count) < APPROVE_RATIO_MIN (0.60), including the zero-denominator case where every quorum ballot is ABSTAIN and decision_ratio is defined as exactly 0"
        side_effects:
          - "decision_ratio pinned; increments DeaccessionCase.version by 1"
      - from: APPROVED
        to: EXECUTED
        trigger: "POST /public-art/deaccession-cases/{id}/execute"
        actor: PublicArtManager
        preconditions:
          - "status == APPROVED"
          - "when disposition == DESTRUCTION: Artwork.recognized_stature == false"
          - "when Artwork.moral_rights_status == ACTIVE: a MoralRightsNotice WHERE artwork_id == case.artwork_id AND action_type IN {REMOVAL, DESTRUCTION} AND status IN {ACKNOWLEDGED, WAIT_ELAPSED} exists whose earliest_action_at <= logical clock"
          - "when disposition IN {SALE, TRANSFER}: disposition_target_ref is not null"
        side_effects:
          - "executed_at = logical clock"
          - "CASCADE B hop 1: Artwork.custody_status -> DESTROYED when disposition == DESTRUCTION else DEACCESSIONED; Site.installed_units_used decreases by Artwork.footprint_units when the work was ON_VIEW"
          - "CASCADE B hop 2: because the artwork custody became terminal, TreatmentProposal rows in {DRAFT, SUBMITTED, REVISION_REQUESTED, APPROVED} -> WITHDRAWN (ARTWORK_DEACCESSIONED), SCHEDULED MaintenanceVisit rows -> ABORTED (ARTWORK_DEACCESSIONED), PENDING ArtistConsultation rows -> LAPSED, and MoralRightsNotice rows other than the consumed one in {SENT, ACKNOWLEDGED, WAIT_ELAPSED} -> VOID"
          - "CASCADE B hop 3: because those proposals and visits became terminal, their FundingAllocation rows in {RESERVED, COMMITTED} -> RELEASED"
          - "CASCADE B hop 4: because those allocations became RELEASED, FundingPool.available_cents rises by the released amount_cents"
          - "the consumed MoralRightsNotice -> CONSUMED with consumed_by_ref = this case id"
          - "increments DeaccessionCase.version by 1"

  - entity: MoralRightsNotice
    initial_state: SENT
    terminal_states: [CONSUMED, VOID]
    transitions:
      - from: SENT
        to: ACKNOWLEDGED
        trigger: "POST /public-art/moral-rights-notices/{id}/acknowledge"
        actor: ArtistRepresentative
        preconditions:
          - "status == SENT"
          - "X-User-ID == artist_id"
        side_effects:
          - "acknowledged_at = logical clock"
          - "increments MoralRightsNotice.version by 1"
      - from: SENT
        to: WAIT_ELAPSED
        trigger: "POST /public-art/ops/run-cycle"
        actor: system
        preconditions:
          - "status == SENT"
          - "logical clock >= earliest_action_at"
        side_effects:
          - "increments MoralRightsNotice.version by 1"
      - from: ACKNOWLEDGED
        to: CONSUMED
        trigger: "POST /public-art/artworks/{id}/relocate or POST /public-art/deaccession-cases/{id}/execute"
        actor: system
        preconditions:
          - "status == ACKNOWLEDGED"
          - "logical clock >= earliest_action_at"
          - "action_type matches the action being authorized"
        side_effects:
          - "consumed_by_ref set; Artwork.open_notice_count decreases by 1"
          - "increments MoralRightsNotice.version by 1"
      - from: WAIT_ELAPSED
        to: CONSUMED
        trigger: "POST /public-art/artworks/{id}/relocate or POST /public-art/deaccession-cases/{id}/execute"
        actor: system
        preconditions:
          - "status == WAIT_ELAPSED"
          - "action_type matches the action being authorized"
        side_effects:
          - "consumed_by_ref set; Artwork.open_notice_count decreases by 1"
          - "increments MoralRightsNotice.version by 1"
      - from: SENT
        to: VOID
        trigger: "system: CASCADE B hop 2 from POST /public-art/deaccession-cases/{id}/execute"
        actor: system
        preconditions:
          - "status == SENT"
          - "Artwork.custody_status became DEACCESSIONED or DESTROYED"
        side_effects:
          - "Artwork.open_notice_count decreases by 1"
          - "increments MoralRightsNotice.version by 1"
      - from: ACKNOWLEDGED
        to: VOID
        trigger: "system: CASCADE B hop 2 from POST /public-art/deaccession-cases/{id}/execute"
        actor: system
        preconditions:
          - "status == ACKNOWLEDGED"
          - "this notice was not the one consumed by the executing action"
        side_effects:
          - "Artwork.open_notice_count decreases by 1"
          - "increments MoralRightsNotice.version by 1"
      - from: WAIT_ELAPSED
        to: VOID
        trigger: "system: CASCADE B hop 2 from POST /public-art/deaccession-cases/{id}/execute"
        actor: system
        preconditions:
          - "status == WAIT_ELAPSED"
          - "this notice was not the one consumed by the executing action"
        side_effects:
          - "Artwork.open_notice_count decreases by 1"
          - "increments MoralRightsNotice.version by 1"

  - entity: ArtistConsultation
    initial_state: PENDING
    terminal_states: [CONCURRED, OBJECTED, LAPSED, WAIVED]
    transitions:
      - from: PENDING
        to: CONCURRED
        trigger: "POST /public-art/artist-consultations/{id}/respond with response == CONCUR"
        actor: ArtistRepresentative
        preconditions:
          - "status == PENDING"
          - "X-User-ID == artist_id"
          - "logical clock < due_at"
        side_effects:
          - "responded_at = logical clock"
          - "increments ArtistConsultation.version by 1"
      - from: PENDING
        to: OBJECTED
        trigger: "POST /public-art/artist-consultations/{id}/respond with response == OBJECT"
        actor: ArtistRepresentative
        preconditions:
          - "status == PENDING"
          - "X-User-ID == artist_id"
          - "logical clock < due_at"
        side_effects:
          - "responded_at = logical clock; the linked proposal can no longer be approved while this row is OBJECTED"
          - "increments ArtistConsultation.version by 1"
      - from: PENDING
        to: LAPSED
        trigger: "POST /public-art/ops/run-cycle"
        actor: system
        preconditions:
          - "status == PENDING"
          - "logical clock >= due_at"
        side_effects:
          - "increments ArtistConsultation.version by 1"
      - from: PENDING
        to: LAPSED
        trigger: "system: CASCADE B hop 2 from POST /public-art/deaccession-cases/{id}/execute"
        actor: system
        preconditions:
          - "status == PENDING"
          - "Artwork.custody_status became DEACCESSIONED or DESTROYED"
        side_effects:
          - "increments ArtistConsultation.version by 1"
      - from: PENDING
        to: WAIVED
        trigger: "POST /public-art/artist-consultations"
        actor: system
        preconditions:
          - "Artwork.moral_rights_status == WAIVED at creation time"
        side_effects:
          - "status is stamped WAIVED instead of PENDING at creation; responded_at stays null"
        note: "creation-time stamp: the row is never observable in PENDING for a waived artist"

  - entity: DamageIncident
    initial_state: "damage_status = REPORTED; claim_status = NONE (two independent dimensions on one row)"
    terminal_states: [RESOLVED, SETTLED, DENIED]
    transitions:
      - from: REPORTED
        to: TRIAGED
        trigger: "POST /public-art/damage-incidents/{id}/triage"
        actor: ChiefConservator
        preconditions:
          - "damage_status == REPORTED"
        side_effects:
          - "triage_class set from the request; increments DamageIncident.version by 1"
      - from: TRIAGED
        to: RESOLVED
        trigger: "POST /public-art/treatment-proposals/{id}/complete"
        actor: system
        preconditions:
          - "damage_status == TRIAGED"
          - "linked_proposal_id == the completing proposal id"
        side_effects:
          - "increments DamageIncident.version by 1"
        note: "damage dimension resolves through the treatment track and is independent of claim_status"
      - from: NONE
        to: FILED
        trigger: "POST /public-art/damage-incidents/{id}/file-claim"
        actor: FinanceOfficer
        preconditions:
          - "claim_status == NONE"
          - "damage_status == TRIAGED"
          - "when claim_basis == RESTORATION: linked_proposal_id is not null and that proposal.status IN {APPROVED, IN_EXECUTION, COMPLETED} with pinned_estimate_total_cents not null"
        side_effects:
          - "claim_basis set; claimed_gross_cents and settlement_cents computed via calculations.claim_settlement_cents"
          - "increments DamageIncident.version by 1"
      - from: FILED
        to: SETTLED
        trigger: "POST /public-art/damage-incidents/{id}/resolve-claim with outcome == SETTLE"
        actor: FinanceOfficer
        preconditions:
          - "claim_status == FILED"
          - "settlement_cents > 0"
          - "credited_pool_id is not null"
        side_effects:
          - "FundingPool.recovery_credits_cents increases by settlement_cents and FundingPool.available_cents rises by the same amount"
          - "increments DamageIncident.version by 1"
      - from: FILED
        to: DENIED
        trigger: "POST /public-art/damage-incidents/{id}/resolve-claim with outcome == DENY"
        actor: FinanceOfficer
        preconditions:
          - "claim_status == FILED"
        side_effects:
          - "settlement_cents = 0; no pool credit"
          - "increments DamageIncident.version by 1"

concurrency_rules:
  - rule_id: proposal-create-stale-artwork
    parent_entity: Artwork
    write_endpoint: "POST /public-art/treatment-proposals"
    occ_field: "expected_artwork_version"
    description: |
      Creating a TreatmentProposal against an Artwork whose version has advanced since the client
      last observed it is rejected with a stale-version error. A newly approved proposal legitimately
      supersedes earlier non-terminal proposals on the same artwork (see the SUBMITTED -> APPROVED
      side effects), so a writer holding an outdated view of the artwork must re-read before drafting.
    error_id: ERR_STALE_ARTWORK_VERSION
    http_status: 412
  - rule_id: allocation-reserve-stale-pool
    parent_entity: FundingPool
    write_endpoint: "POST /public-art/funding-allocations"
    occ_field: "expected_pool_version"
    description: |
      Reserving funds against a FundingPool whose version has advanced since the client last observed
      it is rejected with a stale-version error. Cascaded releases and insurance credits change
      available_cents without any request touching the allocation, so a reservation carrying an
      outdated pool version is refused rather than charged against a balance the client never saw.
    error_id: ERR_STALE_POOL_VERSION
    http_status: 412

calculations:
  - name: condition_index_score
    trigger: "POST /public-art/condition-assessments/{id}/finalize (the SUBMITTED -> FINALIZED transition sets ConditionAssessment.condition_index and recommendation)"
    algorithm: weighted_scoring
    formula: |
      # five defect subscores, each 0 (pristine) .. 4 (failed)
      w = MATERIAL_WEIGHTS[Artwork.material_class]   # keys: surface, structural, coating, mount, graffiti
      raw_defect = w.surface    * surface_score
                 + w.structural * structural_score
                 + w.coating    * coating_score
                 + w.mount      * mount_score
                 + w.graffiti   * graffiti_score          # range 0.0 .. 4.0
      severity_factor = 1.0 if max(all five subscores) == 4 else 0.5
      penalty = EXPOSURE_PENALTY[Site.exposure_class of Artwork.site_id] * severity_factor
      condition_index = max(0.0, round_half_up(100 - 25 * raw_defect - penalty, 1))
      recommendation = NONE     if condition_index >= 75.0
                       ROUTINE  if 55.0 <= condition_index < 75.0
                       PRIORITY if 30.0 <= condition_index < 55.0
                       URGENT   if condition_index < 30.0
    input_set: "the single ConditionAssessment being finalized (status SUBMITTED at call time); material weights come from its Artwork.material_class and the exposure penalty from the Site referenced by Artwork.site_id at finalization time"
    constants:
      MATERIAL_WEIGHTS_BRONZE: { surface: 0.30, structural: 0.25, coating: 0.20, mount: 0.15, graffiti: 0.10 }
      MATERIAL_WEIGHTS_PAINTED_STEEL: { surface: 0.20, structural: 0.20, coating: 0.35, mount: 0.15, graffiti: 0.10 }
      MATERIAL_WEIGHTS_STONE: { surface: 0.25, structural: 0.35, coating: 0.05, mount: 0.20, graffiti: 0.15 }
      MATERIAL_WEIGHTS_MURAL_COATING: { surface: 0.35, structural: 0.10, coating: 0.30, mount: 0.05, graffiti: 0.20 }
      EXPOSURE_PENALTY: { COASTAL: 6.0, URBAN: 3.0, PARK: 1.5, INTERIOR: 0.0 }
      TREATMENT_TRIGGER_INDEX: 55.0
    precision: "1 decimal place, round_half_up; the exposure penalty is subtracted AFTER the weighted defect term, never folded into it"
    note: "non-linear: the exposure penalty doubles the moment any single subscore reaches 4, and the whole result is floored at 0.0"

  - name: treatment_priority_score
    trigger: "POST /public-art/condition-assessments/{id}/finalize (variant single_assessment, CASCADE A hop 2) and POST /public-art/ops/run-cycle (variant cycle_cohort)"
    algorithm: weighted_scoring
    formula: |
      deficit = 100 - source_assessment.condition_index
      sig     = SIGNIFICANCE_FACTOR[Artwork.significance_tier]
      expo    = EXPOSURE_FACTOR[Site.exposure_class of Artwork.site_id]
      days_deferred = (date(logical clock) - date(source_assessment.assessed_on)).days   # >= 0
      deferral = min(1 + DEFERRAL_PER_DAY * days_deferred, DEFERRAL_CAP)
      treatment_priority_score = round_half_up(deficit * sig * expo * deferral, 2)
      # ranking of the cohort
      cohort = Artwork WHERE conservation_status IN {TREATMENT_REQUIRED, TREATMENT_IN_PROGRESS}
      treatment_priority_rank = 1-based position in cohort ordered by
                                treatment_priority_score DESC, then created_at ASC
    input_set: "variant single_assessment: exactly the ConditionAssessment just finalized. variant cycle_cohort: for each Artwork with at least one FINALIZED ConditionAssessment whose cycle_year == the run-cycle cycle_year, the EARLIEST such assessment by assessed_on ASC then created_at ASC"
    constants:
      SIGNIFICANCE_FACTOR: { LANDMARK: 1.5, SIGNIFICANT: 1.2, STANDARD: 1.0 }
      EXPOSURE_FACTOR: { COASTAL: 1.3, URBAN: 1.25, PARK: 1.1, INTERIOR: 1.0 }
      DEFERRAL_PER_DAY: 0.004
      DEFERRAL_CAP: 1.60
    precision: "2 decimal places, round_half_up; rounding happens once, on the final product"
    variants:
      - name: single_assessment
        when: "a ConditionAssessment is finalized; Artwork.priority_basis is set to SINGLE_ASSESSMENT"
        difference: "source_assessment is the survey just finalized and days_deferred is pinned to 0, so deferral == 1.0 and the score is the undeferred product"
      - name: cycle_cohort
        when: "POST /public-art/ops/run-cycle re-ranks the collection for a cycle_year; Artwork.priority_basis is set to CYCLE_COHORT"
        difference: "source_assessment is the EARLIEST FINALIZED survey of that cycle_year (not the latest) and days_deferred is measured from its assessed_on to the logical clock, so the same artwork scores strictly higher than under single_assessment whenever the survey is older than the clock"

  - name: proposal_estimate_total_cents
    trigger: "POST /public-art/treatment-proposals/{id}/line-items (recomputes subtotal_cents, overhead_cents, contingency_cents, mobilization_cents and estimate_total_cents on every line added); the value is frozen into pinned_estimate_total_cents by the SUBMITTED -> APPROVED transition"
    algorithm: tiered_pricing
    formula: |
      # PINNED ORDER: round each line to whole cents FIRST, then sum; never sum raw products and round once.
      for each line in line_items (in the order the lines were added):
          labor_cents      = round_half_up(line.labor_hours
                                           * Conservator.hourly_rate_cents
                                           * COMPLEXITY_FACTOR[line.complexity_class], 0)
          line_total_cents = labor_cents + line.materials_cents
      subtotal_cents      = sum of the per-line rounded line_total_cents
      # PINNED EVALUATION ORDER: overhead is a percentage of subtotal; contingency is a percentage of
      # (subtotal + overhead), i.e. contingency is computed AFTER and INCLUDES overhead.
      overhead_cents      = round_half_up(subtotal_cents * OVERHEAD_PCT, 0)
      contingency_cents   = round_half_up((subtotal_cents + overhead_cents) * CONTINGENCY_PCT, 0)
      mobilization_cents  = MOBILIZATION_FLAT_CENTS if line_items is non-empty else 0
      estimate_total_cents = subtotal_cents + overhead_cents + contingency_cents + mobilization_cents
    input_set: "every line in TreatmentProposal.line_items (lines are append-only; no line is excluded), priced at the hourly_rate_cents of the Conservator referenced by conservator_id at the moment the line is added"
    constants:
      COMPLEXITY_FACTOR: { STABILIZATION: 1.00, SURFACE: 1.15, COATING: 1.25, STRUCTURAL: 1.40, GRAFFITI: 1.10 }
      OVERHEAD_PCT: 0.115
      CONTINGENCY_PCT: 0.075
      MOBILIZATION_FLAT_CENTS: 45000
    precision: "whole cents, round_half_up, applied per line and then again to each of overhead and contingency; round-per-line-then-sum is normative and diverges from sum-then-round by one cent on lines whose labor lands on a half cent"

  - name: pool_draw_available_cents
    trigger: "POST /public-art/funding-pools (initial computation) and every FundingAllocation status change or insurance credit that touches this pool (recompute of available_cents)"
    algorithm: threshold
    formula: |
      if pool_type == PERCENT_FOR_ART:
          authorized_before_fee = set_aside_cents
          admin_fee_cents       = 0
      else:   # ENDOWMENT
          # PINNED EVALUATION ORDER: the supplemental tier is selected from GROSS draw,
          # BEFORE the admin fee is withheld. Selecting it from the post-fee figure is wrong.
          gross_draw_cents      = round_half_up(principal_cents * draw_rate_bps / 10000, 0)
          tier_bps              = 0   if gross_draw_cents < TIER1_FLOOR_CENTS
                                  75  if TIER1_FLOOR_CENTS <= gross_draw_cents < TIER2_FLOOR_CENTS
                                  125 if gross_draw_cents >= TIER2_FLOOR_CENTS
          supplemental_cents    = round_half_up(principal_cents * tier_bps / 10000, 0)
          authorized_before_fee = gross_draw_cents + supplemental_cents
          admin_fee_cents       = round_half_up(authorized_before_fee * ADMIN_FEE_PCT, 0)
      draw_authorized_cents = authorized_before_fee - admin_fee_cents
      encumbered_cents = sum of FundingAllocation.amount_cents
                         WHERE pool_id == this.id AND status IN {RESERVED, COMMITTED, DISBURSED}
      available_cents  = draw_authorized_cents + recovery_credits_cents - encumbered_cents
    input_set: "FundingAllocation rows for this pool with status IN {RESERVED, COMMITTED, DISBURSED}; rows with status RELEASED are excluded, which is what makes a release raise available_cents"
    constants:
      TIER1_FLOOR_CENTS: 5000000
      TIER2_FLOOR_CENTS: 20000000
      TIER1_SUPPLEMENTAL_BPS: 75
      TIER2_SUPPLEMENTAL_BPS: 125
      ADMIN_FEE_PCT: 0.0225
    precision: "whole cents, round_half_up; tier boundaries are inclusive at the floor (gross_draw_cents == 20000000 selects 125 bps)"
    note: "circular-looking: the fee depends on the authorized amount and the authorized amount depends on a tier keyed on the draw, so the scaffold pins tier selection to the pre-fee gross figure to make the value well-defined"

  - name: maintenance_sla_and_due
    trigger: "POST /public-art/maintenance-visits/{id}/complete (the IN_PROGRESS -> COMPLETED transition sets sla_breached, Artwork.last_maintenance_completed_on and Artwork.next_maintenance_due_on)"
    algorithm: threshold
    formula: |
      if graffiti_reported_at is null:
          sla_deadline_at = null
          sla_breached    = false
      else:
          sla_deadline_at = graffiti_reported_at + GRAFFITI_SLA_HOURS[Artwork.material_class] hours
          sla_breached    = (completed_at > sla_deadline_at)      # STRICT: equality is compliant
      Artwork.last_maintenance_completed_on = date(completed_at)
      Artwork.next_maintenance_due_on       = date(completed_at) + MaintenanceProtocol.cycle_days days
      Artwork.maintenance_applications_ytd  = count of MaintenanceVisit
                                              WHERE artwork_id == this.artwork_id
                                                AND status == COMPLETED
                                                AND year(completed_at) == year(logical clock)
    input_set: "the single MaintenanceVisit being completed; the SLA hours come from the Artwork.material_class and the cycle length from the MaintenanceProtocol referenced by protocol_id"
    constants:
      GRAFFITI_SLA_HOURS: { MURAL_COATING: 48, PAINTED_STEEL: 72, BRONZE: 120, STONE: 120 }
    precision: "whole hours on the deadline; the breach comparison is strictly greater-than, so completion exactly at sla_deadline_at is compliant"

  - name: claim_settlement_cents
    trigger: "POST /public-art/damage-incidents/{id}/file-claim (the claim dimension NONE -> FILED transition sets claim_basis, claimed_gross_cents and settlement_cents)"
    algorithm: decay_function
    formula: |
      if claim_basis == ACV:
          elapsed_days = (date(logical clock) - date(Artwork.acquisition_date)).days
          age_years    = min(floor(elapsed_days / 365), MAX_DEPRECIATION_YEARS)
          depreciated_value_cents = round_half_up(Artwork.insured_value_cents
                                                  * (ANNUAL_RETENTION ** age_years), 0)
          claimed_gross_cents = round_half_up(depreciated_value_cents * damage_extent_pct, 0)
      else:   # RESTORATION
          claimed_gross_cents = TreatmentProposal(linked_proposal_id).pinned_estimate_total_cents
      settlement_cents = max(0, min(claimed_gross_cents, POLICY_LIMIT_CENTS) - DEDUCTIBLE_CENTS)
    input_set: "the single DamageIncident having a claim filed; the ACV variant reads Artwork.insured_value_cents and Artwork.acquisition_date, the RESTORATION variant reads the pinned_estimate_total_cents of the TreatmentProposal named by linked_proposal_id (status IN {APPROVED, IN_EXECUTION, COMPLETED})"
    constants:
      ANNUAL_RETENTION: 0.98
      MAX_DEPRECIATION_YEARS: 25
      POLICY_LIMIT_CENTS: 25000000
      DEDUCTIBLE_CENTS: 250000
    precision: "whole cents, round_half_up; depreciation is rounded once before the extent multiplier, and the extent multiplier result is rounded again before limit and deductible are applied"
    variants:
      - name: acv
        when: "the filer requests claim_basis == ACV; the work is written down for age"
        difference: "gross is the age-depreciated insured value scaled by damage_extent_pct, so the age of the acquisition and the extent both move the number"
      - name: restoration
        when: "the filer requests claim_basis == RESTORATION and a linked treatment proposal has a pinned estimate"
        difference: "gross is the pinned repair estimate, entirely independent of insured value, acquisition age and damage_extent_pct, so identical incident data settles at a different amount than the ACV variant"

validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers are present and X-User-Role is one of the roles declared in the RBAC matrix"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "the acting role appears in the called endpoint's roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "every path-parameter id resolves to a stored row, validated left-to-right; the entity-specific code is returned"
    error_id: ERR_ARTWORK_NOT_FOUND
    http_status: 404
    applies_to: "all templated paths"
    note: "sibling codes by entity: ERR_ARTIST_NOT_FOUND, ERR_SITE_NOT_FOUND, ERR_PROTOCOL_NOT_FOUND, ERR_VISIT_NOT_FOUND, ERR_ASSESSMENT_NOT_FOUND, ERR_CONSERVATOR_NOT_FOUND, ERR_PROPOSAL_NOT_FOUND, ERR_CONSULTATION_NOT_FOUND, ERR_NOTICE_NOT_FOUND, ERR_CASE_NOT_FOUND, ERR_POOL_NOT_FOUND, ERR_ALLOCATION_NOT_FOUND, ERR_INCIDENT_NOT_FOUND"
  - priority: 4
    category: business_constraint
    check: "request body conforms to the endpoint's input schema: all required fields present, no unknown fields, enum members valid, numeric ranges respected, window_end strictly after window_start, engagement_end strictly after engagement_start, damage_extent_pct within 0.00..1.00, criteria non-empty"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all write endpoints"
  - priority: 5
    category: existence
    check: "every foreign key carried in the request body resolves to a stored row; the referenced entity's own NOT_FOUND code is returned"
    error_id: ERR_ARTIST_NOT_FOUND
    http_status: 404
    applies_to: "all write endpoints carrying FK fields"
  - priority: 6
    category: state
    check: "expected_artwork_version equals the current Artwork.version"
    error_id: ERR_STALE_ARTWORK_VERSION
    http_status: 412
    applies_to: "POST /public-art/treatment-proposals"
  - priority: 7
    category: state
    check: "expected_pool_version equals the current FundingPool.version"
    error_id: ERR_STALE_POOL_VERSION
    http_status: 412
    applies_to: "POST /public-art/funding-allocations"
  - priority: 8
    category: auth
    check: "for entity_backed roles, X-User-ID equals the resource's own foreign key: ArtistRepresentative must equal ArtistConsultation.artist_id or MoralRightsNotice.artist_id; ConservatorVendor must equal TreatmentProposal.conservator_id"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /public-art/artist-consultations/{id}/respond, POST /public-art/moral-rights-notices/{id}/acknowledge, POST /public-art/treatment-proposals/{id}/start-execution, POST /public-art/treatment-proposals/{id}/complete"
  - priority: 9
    category: state
    check: "the target resource is in a state from which this transition is declared in the state machine"
    error_id: ERR_PROPOSAL_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"
    note: "sibling codes by entity: ERR_ASSESSMENT_INVALID_STATE, ERR_VISIT_INVALID_STATE, ERR_CASE_INVALID_STATE, ERR_NOTICE_INVALID_STATE, ERR_CONSULTATION_INVALID_STATE, ERR_ALLOCATION_INVALID_STATE, ERR_INCIDENT_INVALID_STATE, ERR_CLAIM_INVALID_STATE"
  - priority: 10
    category: business_safety
    check: "the finalizing X-User-ID differs from ConditionAssessment.submitted_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 409
    applies_to: "POST /public-art/condition-assessments/{id}/finalize"
  - priority: 11
    category: business_safety
    check: "the balloting X-User-ID differs from DeaccessionCase.initiated_by_user_id when ballot IN {APPROVE, DENY}; the initiator may only cast ABSTAIN or RECUSE"
    error_id: ERR_INITIATOR_CANNOT_VOTE
    http_status: 409
    applies_to: "POST /public-art/deaccession-cases/{id}/votes"
  - priority: 12
    category: business_safety
    check: "the referenced Artwork.custody_status is NOT IN {DEACCESSIONED, DESTROYED}"
    error_id: ERR_ARTWORK_DEACCESSIONED
    http_status: 409
    applies_to: "all write endpoints that reference an artwork"
  - priority: 13
    category: business_safety
    check: "the referenced Artwork.custody_status permits the operation: starting a maintenance visit or a treatment execution requires custody_status IN {ON_VIEW, IN_STORAGE}"
    error_id: ERR_ARTWORK_CUSTODY_INVALID
    http_status: 409
    applies_to: "POST /public-art/maintenance-visits/{id}/start, POST /public-art/treatment-proposals/{id}/start-execution, POST /public-art/artworks/{id}/relocate"
  - priority: 14
    category: business_safety
    check: "a DeaccessionCase with disposition == DESTRUCTION may only execute when Artwork.recognized_stature == false"
    error_id: ERR_RECOGNIZED_STATURE_PROTECTED
    http_status: 422
    applies_to: "POST /public-art/deaccession-cases/{id}/execute"
  - priority: 15
    category: business_safety
    check: "approving a proposal with alters_appearance == true on an artwork whose moral_rights_status == ACTIVE requires an ArtistConsultation WHERE proposal_id == the proposal to exist"
    error_id: ERR_ARTIST_CONSULTATION_REQUIRED
    http_status: 422
    applies_to: "POST /public-art/treatment-proposals/{id}/approve"
  - priority: 16
    category: business_safety
    check: "that ArtistConsultation is not still PENDING"
    error_id: ERR_ARTIST_CONSULTATION_PENDING
    http_status: 409
    applies_to: "POST /public-art/treatment-proposals/{id}/approve"
  - priority: 17
    category: business_safety
    check: "that ArtistConsultation is not OBJECTED; only status IN {CONCURRED, LAPSED} clears approval"
    error_id: ERR_ARTIST_OBJECTION_UNRESOLVED
    http_status: 409
    applies_to: "POST /public-art/treatment-proposals/{id}/approve"
  - priority: 18
    category: business_safety
    check: "relocating or deaccessioning an artwork whose moral_rights_status == ACTIVE requires a MoralRightsNotice WHERE artwork_id matches AND action_type matches the action AND status IN {ACKNOWLEDGED, WAIT_ELAPSED} to exist"
    error_id: ERR_MORAL_RIGHTS_NOTICE_REQUIRED
    http_status: 422
    applies_to: "POST /public-art/artworks/{id}/relocate, POST /public-art/deaccession-cases/{id}/execute"
  - priority: 19
    category: business_safety
    check: "the matching MoralRightsNotice.earliest_action_at is at or before the logical clock; the action is permitted exactly at earliest_action_at"
    error_id: ERR_MORAL_RIGHTS_WAIT_ACTIVE
    http_status: 409
    applies_to: "POST /public-art/artworks/{id}/relocate, POST /public-art/deaccession-cases/{id}/execute"
  - priority: 20
    category: business_safety
    check: "Conservator.status == ACTIVE AND Conservator.insurance_expires_on >= date(engagement_end) AND Artwork.material_class IN Conservator.material_specialties"
    error_id: ERR_CONSERVATOR_NOT_ELIGIBLE
    http_status: 422
    applies_to: "POST /public-art/treatment-proposals/{id}/approve"
  - priority: 21
    category: business_safety
    check: "MaintenanceProtocol.material_class equals Artwork.material_class"
    error_id: ERR_PROTOCOL_MATERIAL_MISMATCH
    http_status: 422
    applies_to: "POST /public-art/maintenance-visits"
  - priority: 22
    category: business_safety
    check: "ConditionAssessment.photo_count >= MIN_ASSESSMENT_PHOTOS (3) before submission"
    error_id: ERR_PHOTO_DOCUMENTATION_INSUFFICIENT
    http_status: 422
    applies_to: "POST /public-art/condition-assessments/{id}/submit"
  - priority: 23
    category: business_temporal
    check: "window_start is at or after the logical clock; a visit may not be scheduled into the past"
    error_id: ERR_WINDOW_IN_PAST
    http_status: 422
    applies_to: "POST /public-art/maintenance-visits"
  - priority: 24
    category: business_temporal
    check: "the logical clock is at or after MaintenanceVisit.window_start"
    error_id: ERR_VISIT_WINDOW_NOT_OPEN
    http_status: 409
    applies_to: "POST /public-art/maintenance-visits/{id}/start"
  - priority: 25
    category: business_temporal
    check: "the logical clock is at or after DeaccessionCase.public_comment_closes_at before advancing to BOARD_REVIEW"
    error_id: ERR_PUBLIC_COMMENT_OPEN
    http_status: 409
    applies_to: "POST /public-art/deaccession-cases/{id}/advance"
  - priority: 26
    category: business_temporal
    check: "the logical clock is strictly before ArtistConsultation.due_at"
    error_id: ERR_CONSULTATION_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /public-art/artist-consultations/{id}/respond"
  - priority: 27
    category: business_constraint
    check: "accession_number, site_code, protocol_code and pool_code are each unique across their own entity"
    error_id: ERR_DUPLICATE_CODE
    http_status: 409
    applies_to: "POST /public-art/artworks, POST /public-art/sites, POST /public-art/maintenance-protocols, POST /public-art/funding-pools"
  - priority: 28
    category: business_constraint
    check: "no other TreatmentProposal WHERE conservator_id matches AND status IN {APPROVED, IN_EXECUTION} occupies a colliding engagement window; windows are HALF-OPEN [engagement_start, engagement_end) and each is padded by CONSERVATOR_BUFFER_HOURS (48) on both sides, so a collision exists iff new.engagement_start < other.engagement_end + 48h AND other.engagement_start < new.engagement_end + 48h"
    error_id: ERR_CONSERVATOR_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /public-art/treatment-proposals/{id}/approve"
  - priority: 29
    category: business_constraint
    check: "the count of MaintenanceVisit rows at the same Site WHERE status IN {SCHEDULED, IN_PROGRESS} whose window collides with the requested one is strictly less than Site.concurrent_work_capacity; site windows are CLOSED intervals [window_start, window_end], so touching endpoints collide (a window starting exactly when another ends is a collision)"
    error_id: ERR_SITE_WORK_CAPACITY_CONFLICT
    http_status: 409
    applies_to: "POST /public-art/maintenance-visits"
  - priority: 30
    category: business_constraint
    check: "Site.installed_units_used + Artwork.footprint_units <= Site.capacity_units at the target site"
    error_id: ERR_SITE_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /public-art/artworks, POST /public-art/artworks/{id}/relocate"
  - priority: 31
    category: business_constraint
    check: "no other TreatmentProposal WHERE assessment_id matches AND status IN {DRAFT, SUBMITTED, REVISION_REQUESTED, APPROVED, IN_EXECUTION} already exists"
    error_id: ERR_DUPLICATE_ACTIVE_PROPOSAL
    http_status: 409
    applies_to: "POST /public-art/treatment-proposals"
  - priority: 32
    category: business_constraint
    check: "the referenced ConditionAssessment.status == FINALIZED and its artwork_id equals the proposal's artwork_id"
    error_id: ERR_ASSESSMENT_NOT_FINALIZED
    http_status: 422
    applies_to: "POST /public-art/treatment-proposals"
  - priority: 33
    category: business_constraint
    check: "the count of COMPLETED MaintenanceVisit rows for this artwork and protocol in the logical clock's year is strictly less than MaintenanceProtocol.max_annual_applications"
    error_id: ERR_MAX_ANNUAL_APPLICATIONS
    http_status: 409
    applies_to: "POST /public-art/maintenance-visits/{id}/complete"
  - priority: 34
    category: business_constraint
    check: "no vote_records entry already carries this member_user_id"
    error_id: ERR_DUPLICATE_BALLOT
    http_status: 409
    applies_to: "POST /public-art/deaccession-cases/{id}/votes"
  - priority: 35
    category: business_constraint
    check: "revision_rounds < MAX_REVISION_ROUNDS (2) before another revision round is requested"
    error_id: ERR_REVISION_LIMIT_REACHED
    http_status: 409
    applies_to: "POST /public-art/condition-assessments/{id}/request-revision, POST /public-art/treatment-proposals/{id}/request-revision"
  - priority: 36
    category: business_referential
    check: "DeaccessionCase.disposition_target_ref is not null when disposition IN {SALE, TRANSFER}"
    error_id: ERR_DISPOSITION_TARGET_REQUIRED
    http_status: 422
    applies_to: "POST /public-art/deaccession-cases/{id}/execute"
  - priority: 37
    category: business_referential
    check: "purpose == TREATMENT requires proposal_id set and visit_id null; purpose == MAINTENANCE requires visit_id set and proposal_id null"
    error_id: ERR_ALLOCATION_LINK_MISMATCH
    http_status: 422
    applies_to: "POST /public-art/funding-allocations"
  - priority: 38
    category: business_referential
    check: "claim_basis == RESTORATION requires linked_proposal_id set on the incident, that proposal.status IN {APPROVED, IN_EXECUTION, COMPLETED}, and pinned_estimate_total_cents not null"
    error_id: ERR_CLAIM_BASIS_UNSUPPORTED
    http_status: 422
    applies_to: "POST /public-art/damage-incidents/{id}/file-claim"
  - priority: 39
    category: business_referential
    check: "credited_pool_id is not null when the claim is settled"
    error_id: ERR_CREDIT_POOL_REQUIRED
    http_status: 422
    applies_to: "POST /public-art/damage-incidents/{id}/resolve-claim"
  - priority: 40
    category: business_fiscal
    check: "amount_cents <= FundingPool.available_cents at reservation time"
    error_id: ERR_POOL_FUNDS_INSUFFICIENT
    http_status: 422
    applies_to: "POST /public-art/funding-allocations"
  - priority: 41
    category: business_fiscal
    check: "a FundingAllocation WHERE proposal_id == this proposal AND status == RESERVED exists whose amount_cents >= estimate_total_cents"
    error_id: ERR_FUNDING_NOT_RESERVED
    http_status: 422
    applies_to: "POST /public-art/treatment-proposals/{id}/approve"
  - priority: 42
    category: business_fiscal
    check: "settlement_cents > 0 when the claim outcome is SETTLE; a claim whose computed settlement is zero after limit and deductible cannot be settled"
    error_id: ERR_NO_SETTLEMENT_PAYABLE
    http_status: 422
    applies_to: "POST /public-art/damage-incidents/{id}/resolve-claim"

endpoints:
  # ---------- Artist ----------
  - method: POST
    path: "/public-art/artists"
    description: "register an artist of record"
    roles: [CollectionsRegistrar, PublicArtManager]
    code: 201
    input: [full_name, is_living, contact_email, "deceased_on?", "moral_rights_waiver_on_file?", "notice_wait_days?", "consultation_response_days?", "represented_by?"]
    output: Artist
    side_effects: ["artwork_count initialised to 0"]
  - method: GET
    path: "/public-art/artists/{id}"
    description: "read one artist"
    roles: &all_roles [CollectionsRegistrar, ConditionSurveyor, ChiefConservator, ConservatorVendor, MaintenanceCrew, PublicArtManager, FinanceOfficer, ArtCommissionMember, ArtistRepresentative]
    code: 200
    input: []
    output: Artist
    side_effects: []
  - method: GET
    path: "/public-art/artists"
    description: "list artists"
    roles: *all_roles
    code: 200
    input: ["is_living?", "limit?", "offset?"]
    output: Artist[]
    side_effects: []

  # ---------- Site ----------
  - method: POST
    path: "/public-art/sites"
    description: "register an installation site"
    roles: [CollectionsRegistrar, PublicArtManager]
    code: 201
    input: [site_code, name, address_ref, exposure_class, capacity_units, "concurrent_work_capacity?"]
    output: Site
    side_effects: ["installed_units_used initialised to 0"]
  - method: GET
    path: "/public-art/sites/{id}"
    description: "read one site including installed_units_used"
    roles: *all_roles
    code: 200
    input: []
    output: Site
    side_effects: []
  - method: GET
    path: "/public-art/sites"
    description: "list sites"
    roles: *all_roles
    code: 200
    input: ["exposure_class?", "limit?", "offset?"]
    output: Site[]
    side_effects: []

  # ---------- Artwork ----------
  - method: POST
    path: "/public-art/artworks"
    description: "accession an artwork into the collection at a site"
    roles: [CollectionsRegistrar]
    code: 201
    input: [accession_number, title, artist_id, site_id, material_class, significance_tier, footprint_units, insured_value_cents, acquisition_date, acquisition_document_ref, "recognized_stature?"]
    output: Artwork
    side_effects:
      - "custody_status = ON_VIEW, conservation_status = MONITORED"
      - "moral_rights_status derived from the Artist's is_living and moral_rights_waiver_on_file"
      - "Site.installed_units_used increases by footprint_units"
      - "Artist.artwork_count increases by 1"
  - method: GET
    path: "/public-art/artworks/{id}"
    description: "read one artwork with both status dimensions, condition_index and priority ranking"
    roles: *all_roles
    code: 200
    input: []
    output: Artwork
    side_effects: []
  - method: GET
    path: "/public-art/artworks"
    description: "list artworks; reverse-reachability for Artwork.artist_id and Artwork.site_id"
    roles: *all_roles
    code: 200
    input: ["artist_id?", "site_id?", "material_class?", "custody_status?", "conservation_status?", "priority_basis?", "limit?", "offset?"]
    output: Artwork[]
    side_effects: []
  - method: POST
    path: "/public-art/artworks/{id}/relocate"
    description: "move a work into storage (to_storage true) or reinstall it at a site (to_site_id set)"
    roles: [CollectionsRegistrar]
    code: 200
    input: ["to_storage?", "to_site_id?", "relocation_note?"]
    output: Artwork
    side_effects:
      - "custody_status ON_VIEW -> IN_STORAGE or IN_STORAGE -> ON_VIEW"
      - "the authorizing MoralRightsNotice transitions to CONSUMED"
      - "Site.installed_units_used adjusted on the vacated and the receiving site"
      - "increments Artwork.version by 1"

  # ---------- MaintenanceProtocol ----------
  - method: POST
    path: "/public-art/maintenance-protocols"
    description: "declare a routine care protocol for a material"
    roles: [ChiefConservator, PublicArtManager]
    code: 201
    input: [protocol_code, material_class, method, cycle_days, "max_annual_applications?", "requires_conservator?", "solvent_class?"]
    output: MaintenanceProtocol
    side_effects: []
  - method: GET
    path: "/public-art/maintenance-protocols/{id}"
    description: "read one protocol"
    roles: *all_roles
    code: 200
    input: []
    output: MaintenanceProtocol
    side_effects: []
  - method: GET
    path: "/public-art/maintenance-protocols"
    description: "list protocols"
    roles: *all_roles
    code: 200
    input: ["material_class?", "method?", "limit?", "offset?"]
    output: MaintenanceProtocol[]
    side_effects: []

  # ---------- Conservator ----------
  - method: POST
    path: "/public-art/conservators"
    description: "register a conservation vendor"
    roles: [PublicArtManager]
    code: 201
    input: [firm_name, accreditation, material_specialties, hourly_rate_cents, insurance_expires_on]
    output: Conservator
    side_effects: ["status = ACTIVE, active_engagement_count = 0"]
  - method: GET
    path: "/public-art/conservators/{id}"
    description: "read one conservator"
    roles: *all_roles
    code: 200
    input: []
    output: Conservator
    side_effects: []
  - method: GET
    path: "/public-art/conservators"
    description: "list conservators"
    roles: *all_roles
    code: 200
    input: ["status?", "material_specialty?", "limit?", "offset?"]
    output: Conservator[]
    side_effects: []
  - method: POST
    path: "/public-art/conservators/{id}/suspend"
    description: "suspend a vendor so no new proposal may be approved for them"
    roles: [PublicArtManager]
    code: 200
    input: [reason]
    output: Conservator
    side_effects: ["status ACTIVE -> SUSPENDED", "increments Conservator.version by 1"]

  # ---------- ConditionAssessment ----------
  - method: POST
    path: "/public-art/condition-assessments"
    description: "open a condition survey in DRAFT for one artwork in a cycle year"
    roles: [ConditionSurveyor]
    code: 201
    input: [artwork_id, cycle_year, assessed_on, surface_score, structural_score, coating_score, mount_score, graffiti_score]
    output: ConditionAssessment
    side_effects: ["status = DRAFT, photo_count = 0, condition_index = null, recommendation = NONE"]
  - method: GET
    path: "/public-art/condition-assessments/{id}"
    description: "read one condition survey"
    roles: *all_roles
    code: 200
    input: []
    output: ConditionAssessment
    side_effects: []
  - method: GET
    path: "/public-art/condition-assessments"
    description: "list condition surveys; reverse-reachability for ConditionAssessment.artwork_id"
    roles: *all_roles
    code: 200
    input: ["artwork_id?", "cycle_year?", "status?", "recommendation?", "limit?", "offset?"]
    output: ConditionAssessment[]
    side_effects: []
  - method: POST
    path: "/public-art/condition-assessments/{id}/photos"
    description: "attach one photographic record to a DRAFT or REVISION_REQUESTED survey"
    roles: [ConditionSurveyor]
    code: 200
    input: [view_code, media_ref, "caption?"]
    output: ConditionAssessment
    side_effects: ["photo_count increases by 1", "view_code appended to photo_view_codes", "increments ConditionAssessment.version by 1"]
  - method: POST
    path: "/public-art/condition-assessments/{id}/submit"
    description: "submit a survey for conservator review; usable again after a revision request"
    roles: [ConditionSurveyor]
    code: 200
    input: ["surveyor_note?"]
    output: ConditionAssessment
    side_effects: ["status DRAFT|REVISION_REQUESTED -> SUBMITTED", "submitted_by_user_id = X-User-ID", "increments ConditionAssessment.version by 1"]
  - method: POST
    path: "/public-art/condition-assessments/{id}/request-revision"
    description: "send a submitted survey back to the surveyor"
    roles: [ChiefConservator]
    code: 200
    input: [reviewer_note]
    output: ConditionAssessment
    side_effects: ["status SUBMITTED -> REVISION_REQUESTED", "revision_rounds increases by 1", "increments ConditionAssessment.version by 1"]
  - method: POST
    path: "/public-art/condition-assessments/{id}/finalize"
    description: "finalize a survey; runs the condition index, the single_assessment priority variant and CASCADE A"
    roles: [ChiefConservator]
    code: 200
    input: ["finalization_note?"]
    output: ConditionAssessment
    side_effects:
      - "condition_index and recommendation computed"
      - "prior FINALIZED surveys on the same artwork -> SUPERSEDED"
      - "Artwork.condition_index, treatment_priority_score, priority_basis, treatment_priority_rank and conservation_status updated (CASCADE A hops 2-3)"
      - "SCHEDULED non-conservator MaintenanceVisit rows on the artwork -> ABORTED and their allocations -> RELEASED (CASCADE A hops 3-5)"
      - "increments ConditionAssessment.version by 1"

  # ---------- MaintenanceVisit ----------
  - method: POST
    path: "/public-art/maintenance-visits"
    description: "schedule a routine care visit in a closed site work window"
    roles: [MaintenanceCrew, ChiefConservator]
    code: 201
    input: [artwork_id, protocol_id, window_start, window_end, "graffiti_reported_at?", "crew_note?"]
    output: MaintenanceVisit
    side_effects: ["status = SCHEDULED", "sla_deadline_at computed when graffiti_reported_at is supplied"]
  - method: GET
    path: "/public-art/maintenance-visits/{id}"
    description: "read one visit"
    roles: *all_roles
    code: 200
    input: []
    output: MaintenanceVisit
    side_effects: []
  - method: GET
    path: "/public-art/maintenance-visits"
    description: "list visits; reverse-reachability for MaintenanceVisit.artwork_id and MaintenanceVisit.protocol_id"
    roles: *all_roles
    code: 200
    input: ["artwork_id?", "protocol_id?", "status?", "abort_reason?", "limit?", "offset?"]
    output: MaintenanceVisit[]
    side_effects: []
  - method: POST
    path: "/public-art/maintenance-visits/{id}/start"
    description: "start a scheduled visit once its window has opened"
    roles: [MaintenanceCrew]
    code: 200
    input: ["crew_note?"]
    output: MaintenanceVisit
    side_effects: ["status SCHEDULED -> IN_PROGRESS", "started_at stamped", "linked RESERVED allocation -> COMMITTED", "increments MaintenanceVisit.version by 1"]
  - method: POST
    path: "/public-art/maintenance-visits/{id}/complete"
    description: "complete a visit; evaluates the graffiti SLA and the next due date"
    roles: [MaintenanceCrew]
    code: 200
    input: ["completion_note?"]
    output: MaintenanceVisit
    side_effects:
      - "status IN_PROGRESS -> COMPLETED, completed_at stamped, sla_breached evaluated"
      - "Artwork.last_maintenance_completed_on, next_maintenance_due_on and maintenance_applications_ytd updated"
      - "linked COMMITTED allocation -> DISBURSED"
      - "increments MaintenanceVisit.version by 1"

  # ---------- TreatmentProposal ----------
  - method: POST
    path: "/public-art/treatment-proposals"
    description: "draft a treatment proposal against a FINALIZED survey; guarded by OCC on the artwork"
    roles: [ChiefConservator]
    code: 201
    input: [artwork_id, conservator_id, assessment_id, treatment_scope, engagement_start, engagement_end, expected_artwork_version, "alters_appearance?"]
    output: TreatmentProposal
    side_effects:
      - "status = DRAFT, line_items = [], estimate_total_cents = 0"
      - "increments Artwork.version by 1"
      - "increments TreatmentProposal.version by 1"
  - method: GET
    path: "/public-art/treatment-proposals/{id}"
    description: "read one proposal with its cost breakdown"
    roles: *all_roles
    code: 200
    input: []
    output: TreatmentProposal
    side_effects: []
  - method: GET
    path: "/public-art/treatment-proposals"
    description: "list proposals; reverse-reachability for artwork_id, conservator_id and assessment_id"
    roles: *all_roles
    code: 200
    input: ["artwork_id?", "conservator_id?", "assessment_id?", "status?", "withdraw_reason?", "limit?", "offset?"]
    output: TreatmentProposal[]
    side_effects: []
  - method: POST
    path: "/public-art/treatment-proposals/{id}/line-items"
    description: "append a cost line and recompute the estimate with per-line rounding"
    roles: [ChiefConservator]
    code: 200
    input: [labor_hours, complexity_class, materials_cents, "description?"]
    output: TreatmentProposal
    side_effects: ["line appended with labor_cents and line_total_cents", "subtotal_cents, overhead_cents, contingency_cents, mobilization_cents and estimate_total_cents recomputed", "increments TreatmentProposal.version by 1"]
  - method: POST
    path: "/public-art/treatment-proposals/{id}/submit"
    description: "submit a proposal for manager review; usable again after a revision request"
    roles: [ChiefConservator]
    code: 200
    input: ["submitter_note?"]
    output: TreatmentProposal
    side_effects: ["status DRAFT|REVISION_REQUESTED -> SUBMITTED", "submitted_by_user_id = X-User-ID", "increments TreatmentProposal.version by 1"]
  - method: POST
    path: "/public-art/treatment-proposals/{id}/request-revision"
    description: "send a submitted proposal back for revision"
    roles: [PublicArtManager]
    code: 200
    input: [reviewer_note]
    output: TreatmentProposal
    side_effects: ["status SUBMITTED -> REVISION_REQUESTED", "revision_rounds increases by 1", "increments TreatmentProposal.version by 1"]
  - method: POST
    path: "/public-art/treatment-proposals/{id}/approve"
    description: "approve a proposal; pins the estimate, checks conservator eligibility, engagement overlap, artist consultation and funding"
    roles: [PublicArtManager]
    code: 200
    input: ["approval_note?"]
    output: TreatmentProposal
    side_effects:
      - "status SUBMITTED -> APPROVED, pinned_estimate_total_cents frozen"
      - "Conservator.active_engagement_count increases by 1"
      - "other non-terminal proposals on the same artwork -> WITHDRAWN (PROPOSAL_SUPERSEDED) and their allocations -> RELEASED (CASCADE C)"
      - "increments TreatmentProposal.version by 1"
  - method: POST
    path: "/public-art/treatment-proposals/{id}/reject"
    description: "reject a submitted proposal and release its funding"
    roles: [PublicArtManager]
    code: 200
    input: [rejection_reason]
    output: TreatmentProposal
    side_effects: ["status SUBMITTED -> REJECTED", "linked allocations -> RELEASED (PROPOSAL_REJECTED)", "FundingPool.available_cents rises", "increments TreatmentProposal.version by 1"]
  - method: POST
    path: "/public-art/treatment-proposals/{id}/start-execution"
    description: "conservator starts the approved treatment"
    roles: [ConservatorVendor]
    code: 200
    input: ["mobilization_note?"]
    output: TreatmentProposal
    side_effects:
      - "status APPROVED -> IN_EXECUTION"
      - "Artwork.custody_status -> IN_TREATMENT and conservation_status -> TREATMENT_IN_PROGRESS"
      - "linked RESERVED allocation -> COMMITTED"
      - "increments TreatmentProposal.version by 1"
  - method: POST
    path: "/public-art/treatment-proposals/{id}/complete"
    description: "conservator closes out the treatment"
    roles: [ConservatorVendor]
    code: 200
    input: [completion_report_ref]
    output: TreatmentProposal
    side_effects:
      - "status IN_EXECUTION -> COMPLETED"
      - "Artwork.custody_status -> ON_VIEW, conservation_status -> STABILIZED, priority fields cleared and cohort ranks recomputed"
      - "linked COMMITTED allocation -> DISBURSED"
      - "Conservator.active_engagement_count decreases by 1"
      - "linked TRIAGED DamageIncident rows -> RESOLVED"
      - "increments TreatmentProposal.version by 1"

  # ---------- ArtistConsultation ----------
  - method: POST
    path: "/public-art/artist-consultations"
    description: "open an artist consultation; stamped WAIVED at creation when the artwork's moral rights are waived"
    roles: [ChiefConservator, PublicArtManager]
    code: 201
    input: [artwork_id, artist_id, subject, "proposal_id?"]
    output: ArtistConsultation
    side_effects: ["sent_on and due_at stamped from the logical clock and Artist.consultation_response_days", "status = PENDING, or WAIVED when Artwork.moral_rights_status == WAIVED"]
  - method: GET
    path: "/public-art/artist-consultations/{id}"
    description: "read one consultation"
    roles: *all_roles
    code: 200
    input: []
    output: ArtistConsultation
    side_effects: []
  - method: GET
    path: "/public-art/artist-consultations"
    description: "list consultations; reverse-reachability for artwork_id, artist_id and proposal_id"
    roles: *all_roles
    code: 200
    input: ["artwork_id?", "artist_id?", "proposal_id?", "subject?", "status?", "limit?", "offset?"]
    output: ArtistConsultation[]
    side_effects: []
  - method: POST
    path: "/public-art/artist-consultations/{id}/respond"
    description: "artist concurs with or objects to the consulted action"
    roles: [ArtistRepresentative]
    code: 200
    input: [response, "response_note?"]
    output: ArtistConsultation
    side_effects: ["status PENDING -> CONCURRED or OBJECTED", "responded_at stamped", "increments ArtistConsultation.version by 1"]

  # ---------- MoralRightsNotice ----------
  - method: POST
    path: "/public-art/moral-rights-notices"
    description: "send a moral-rights notice starting the statutory waiting period"
    roles: [PublicArtManager, CollectionsRegistrar]
    code: 201
    input: [artwork_id, artist_id, action_type]
    output: MoralRightsNotice
    side_effects: ["sent_at and earliest_action_at stamped from the logical clock and Artist.notice_wait_days", "status = SENT", "Artwork.open_notice_count increases by 1"]
  - method: GET
    path: "/public-art/moral-rights-notices/{id}"
    description: "read one notice"
    roles: *all_roles
    code: 200
    input: []
    output: MoralRightsNotice
    side_effects: []
  - method: GET
    path: "/public-art/moral-rights-notices"
    description: "list notices; reverse-reachability for artwork_id and artist_id"
    roles: *all_roles
    code: 200
    input: ["artwork_id?", "artist_id?", "action_type?", "status?", "limit?", "offset?"]
    output: MoralRightsNotice[]
    side_effects: []
  - method: POST
    path: "/public-art/moral-rights-notices/{id}/acknowledge"
    description: "artist acknowledges receipt of the notice"
    roles: [ArtistRepresentative]
    code: 200
    input: ["acknowledgement_note?"]
    output: MoralRightsNotice
    side_effects: ["status SENT -> ACKNOWLEDGED", "acknowledged_at stamped", "increments MoralRightsNotice.version by 1"]

  # ---------- DeaccessionCase ----------
  - method: POST
    path: "/public-art/deaccession-cases"
    description: "open a deaccession case citing review criteria and an intended disposition"
    roles: [PublicArtManager]
    code: 201
    input: [artwork_id, criteria, disposition, "disposition_target_ref?", "comment_days?"]
    output: DeaccessionCase
    side_effects: ["status = INITIATED", "initiated_by_user_id = X-User-ID"]
  - method: GET
    path: "/public-art/deaccession-cases/{id}"
    description: "read one case with its ballots and tally"
    roles: *all_roles
    code: 200
    input: []
    output: DeaccessionCase
    side_effects: []
  - method: GET
    path: "/public-art/deaccession-cases"
    description: "list cases; reverse-reachability for DeaccessionCase.artwork_id"
    roles: *all_roles
    code: 200
    input: ["artwork_id?", "status?", "disposition?", "limit?", "offset?"]
    output: DeaccessionCase[]
    side_effects: []
  - method: POST
    path: "/public-art/deaccession-cases/{id}/advance"
    description: "advance INITIATED -> PUBLIC_COMMENT, or PUBLIC_COMMENT -> BOARD_REVIEW once the comment period has closed"
    roles: [PublicArtManager]
    code: 200
    input: ["advance_note?"]
    output: DeaccessionCase
    side_effects: ["public_comment_opens_on and public_comment_closes_at stamped on the first advance", "increments DeaccessionCase.version by 1"]
  - method: POST
    path: "/public-art/deaccession-cases/{id}/votes"
    description: "cast one commission ballot; auto-tallies to APPROVED or DENIED at quorum"
    roles: [ArtCommissionMember, PublicArtManager]
    code: 200
    input: [ballot, "ballot_note?"]
    output: DeaccessionCase
    side_effects:
      - "ballot appended to vote_records with member_user_id = X-User-ID; the matching counter increases by 1"
      - "at quorum the case auto-transitions BOARD_REVIEW -> APPROVED or DENIED and decision_ratio is pinned"
      - "increments DeaccessionCase.version by 1"
  - method: POST
    path: "/public-art/deaccession-cases/{id}/execute"
    description: "execute an approved deaccession; runs CASCADE B"
    roles: [PublicArtManager]
    code: 200
    input: ["execution_note?"]
    output: DeaccessionCase
    side_effects:
      - "status APPROVED -> EXECUTED, executed_at stamped"
      - "Artwork.custody_status -> DEACCESSIONED or DESTROYED and Site.installed_units_used released (CASCADE B hop 1)"
      - "non-terminal proposals -> WITHDRAWN, SCHEDULED visits -> ABORTED, PENDING consultations -> LAPSED, other open notices -> VOID (CASCADE B hop 2)"
      - "their allocations -> RELEASED and FundingPool.available_cents rises (CASCADE B hops 3-4)"
      - "the authorizing notice -> CONSUMED"
      - "increments DeaccessionCase.version by 1"

  # ---------- FundingPool ----------
  - method: POST
    path: "/public-art/funding-pools"
    description: "open a maintenance endowment or percent-for-art set-aside pool"
    roles: [FinanceOfficer]
    code: 201
    input: [pool_code, pool_type, fiscal_year, "principal_cents?", "draw_rate_bps?", "set_aside_cents?"]
    output: FundingPool
    side_effects: ["draw_authorized_cents, admin_fee_cents and available_cents computed via calculations.pool_draw_available_cents"]
  - method: GET
    path: "/public-art/funding-pools/{id}"
    description: "read one pool with its authorized draw and current availability"
    roles: &finance_roles [FinanceOfficer, PublicArtManager, ChiefConservator]
    code: 200
    input: []
    output: FundingPool
    side_effects: []
  - method: GET
    path: "/public-art/funding-pools"
    description: "list pools"
    roles: *finance_roles
    code: 200
    input: ["pool_type?", "fiscal_year?", "limit?", "offset?"]
    output: FundingPool[]
    side_effects: []

  # ---------- FundingAllocation ----------
  - method: POST
    path: "/public-art/funding-allocations"
    description: "reserve money from a pool for a treatment or a maintenance visit; guarded by OCC on the pool"
    roles: [FinanceOfficer]
    code: 201
    input: [pool_id, purpose, amount_cents, expected_pool_version, "proposal_id?", "visit_id?"]
    output: FundingAllocation
    side_effects:
      - "status = RESERVED"
      - "FundingPool.available_cents decreases by amount_cents"
      - "increments FundingPool.version by 1"
      - "increments FundingAllocation.version by 1"
  - method: GET
    path: "/public-art/funding-allocations/{id}"
    description: "read one allocation"
    roles: *finance_roles
    code: 200
    input: []
    output: FundingAllocation
    side_effects: []
  - method: GET
    path: "/public-art/funding-allocations"
    description: "list allocations; reverse-reachability for pool_id, proposal_id and visit_id"
    roles: *finance_roles
    code: 200
    input: ["pool_id?", "proposal_id?", "visit_id?", "purpose?", "status?", "release_reason?", "limit?", "offset?"]
    output: FundingAllocation[]
    side_effects: []
  - method: POST
    path: "/public-art/funding-allocations/{id}/release"
    description: "compensating action: release a reserved allocation back to its pool"
    roles: [FinanceOfficer]
    code: 200
    input: ["release_note?"]
    output: FundingAllocation
    side_effects: ["status RESERVED -> RELEASED with release_reason = MANUAL_RELEASE", "FundingPool.available_cents increases by amount_cents", "increments FundingAllocation.version by 1"]

  # ---------- DamageIncident ----------
  - method: POST
    path: "/public-art/damage-incidents"
    description: "report vandalism or damage to a work"
    roles: [CollectionsRegistrar, PublicArtManager, MaintenanceCrew]
    code: 201
    input: [artwork_id, incident_type, damage_extent_pct, narrative, "linked_proposal_id?", "credited_pool_id?"]
    output: DamageIncident
    side_effects: ["damage_status = REPORTED, claim_status = NONE, reported_at stamped"]
  - method: GET
    path: "/public-art/damage-incidents/{id}"
    description: "read one incident with both dimensions and the claim figures"
    roles: *all_roles
    code: 200
    input: []
    output: DamageIncident
    side_effects: []
  - method: GET
    path: "/public-art/damage-incidents"
    description: "list incidents; reverse-reachability for artwork_id, linked_proposal_id and credited_pool_id"
    roles: *all_roles
    code: 200
    input: ["artwork_id?", "linked_proposal_id?", "credited_pool_id?", "incident_type?", "damage_status?", "claim_status?", "limit?", "offset?"]
    output: DamageIncident[]
    side_effects: []
  - method: POST
    path: "/public-art/damage-incidents/{id}/triage"
    description: "triage an incident onto a response route"
    roles: [ChiefConservator]
    code: 200
    input: [triage_class, "triage_note?"]
    output: DamageIncident
    side_effects: ["damage_status REPORTED -> TRIAGED, triage_class set", "increments DamageIncident.version by 1"]
  - method: POST
    path: "/public-art/damage-incidents/{id}/file-claim"
    description: "file the insurance claim on an ACV or RESTORATION basis"
    roles: [FinanceOfficer]
    code: 200
    input: [claim_basis, "credited_pool_id?", "policy_note?"]
    output: DamageIncident
    side_effects: ["claim_status NONE -> FILED", "claim_basis, claimed_gross_cents and settlement_cents computed via calculations.claim_settlement_cents", "increments DamageIncident.version by 1"]
  - method: POST
    path: "/public-art/damage-incidents/{id}/resolve-claim"
    description: "settle or deny a filed claim; a settlement credits the named pool"
    roles: [FinanceOfficer]
    code: 200
    input: [outcome, "resolution_note?"]
    output: DamageIncident
    side_effects:
      - "claim_status FILED -> SETTLED or DENIED"
      - "on SETTLE: FundingPool.recovery_credits_cents and available_cents rise by settlement_cents and the pool version increments"
      - "increments DamageIncident.version by 1"

  # ---------- operations and test-driving ----------
  - method: POST
    path: "/public-art/ops/run-cycle"
    description: "cycle checkpoint: re-ranks the collection using the cycle_cohort priority variant, lapses overdue consultations, elapses matured notices and returns stabilized works to MONITORED"
    roles: [PublicArtManager]
    code: 200
    input: [cycle_year]
    output: { cycle_year: integer, artworks_rescored: integer, consultations_lapsed: integer, notices_elapsed: integer, artworks_returned_to_monitored: integer }
    side_effects:
      - "for every artwork with a FINALIZED survey in cycle_year, treatment_priority_score recomputed via the cycle_cohort variant, priority_basis = CYCLE_COHORT, ranks recomputed"
      - "PENDING ArtistConsultation rows whose due_at <= logical clock -> LAPSED"
      - "SENT MoralRightsNotice rows whose earliest_action_at <= logical clock -> WAIT_ELAPSED"
      - "STABILIZED artworks with a passing survey in cycle_year -> MONITORED"
  - method: POST
    path: "/_clock/set_current_utc"
    description: "test-driving endpoint: set the logical clock. Before any call the logical clock reads exactly 2026-08-01T00:00:00Z and never falls back to wall-clock time."
    roles: [PublicArtManager]
    code: 200
    input: [to_iso8601]
    output: { current_utc: datetime }
    side_effects: ["the logical clock used by every stamped and deadline field moves to to_iso8601"]

errors:
  # --- authentication / authorization ---
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-ID or X-User-Role header missing, or X-User-Role is not a declared role"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the acting role is not listed in the called endpoint's roles"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "an entity_backed actor's X-User-ID does not match the resource's own artist_id or conservator_id"
  # --- request shape ---
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "missing required field, unknown field, invalid enum member, out-of-range number, non-positive interval, or empty criteria array"
  # --- existence ---
  - id: ERR_ARTIST_NOT_FOUND
    http: 404
    condition: "artist id in path or body does not resolve"
  - id: ERR_SITE_NOT_FOUND
    http: 404
    condition: "site id in path or body does not resolve"
  - id: ERR_ARTWORK_NOT_FOUND
    http: 404
    condition: "artwork id in path or body does not resolve"
  - id: ERR_PROTOCOL_NOT_FOUND
    http: 404
    condition: "maintenance protocol id in path or body does not resolve"
  - id: ERR_VISIT_NOT_FOUND
    http: 404
    condition: "maintenance visit id in path or body does not resolve"
  - id: ERR_ASSESSMENT_NOT_FOUND
    http: 404
    condition: "condition assessment id in path or body does not resolve"
  - id: ERR_CONSERVATOR_NOT_FOUND
    http: 404
    condition: "conservator id in path or body does not resolve"
  - id: ERR_PROPOSAL_NOT_FOUND
    http: 404
    condition: "treatment proposal id in path or body does not resolve"
  - id: ERR_CONSULTATION_NOT_FOUND
    http: 404
    condition: "artist consultation id in path does not resolve"
  - id: ERR_NOTICE_NOT_FOUND
    http: 404
    condition: "moral rights notice id in path does not resolve"
  - id: ERR_CASE_NOT_FOUND
    http: 404
    condition: "deaccession case id in path does not resolve"
  - id: ERR_POOL_NOT_FOUND
    http: 404
    condition: "funding pool id in path or body does not resolve"
  - id: ERR_ALLOCATION_NOT_FOUND
    http: 404
    condition: "funding allocation id in path does not resolve"
  - id: ERR_INCIDENT_NOT_FOUND
    http: 404
    condition: "damage incident id in path does not resolve"
  # --- optimistic concurrency ---
  - id: ERR_STALE_ARTWORK_VERSION
    http: 412
    condition: "expected_artwork_version does not equal the current Artwork.version on POST /public-art/treatment-proposals"
  - id: ERR_STALE_POOL_VERSION
    http: 412
    condition: "expected_pool_version does not equal the current FundingPool.version on POST /public-art/funding-allocations"
  # --- state preconditions ---
  - id: ERR_ASSESSMENT_INVALID_STATE
    http: 409
    condition: "the condition assessment is not in a state from which the requested transition is declared"
  - id: ERR_PROPOSAL_INVALID_STATE
    http: 409
    condition: "the treatment proposal is not in a state from which the requested transition is declared"
  - id: ERR_VISIT_INVALID_STATE
    http: 409
    condition: "the maintenance visit is not in a state from which the requested transition is declared"
  - id: ERR_CASE_INVALID_STATE
    http: 409
    condition: "the deaccession case is not in a state from which the requested transition is declared"
  - id: ERR_NOTICE_INVALID_STATE
    http: 409
    condition: "the moral rights notice is not in SENT when acknowledgement is attempted"
  - id: ERR_CONSULTATION_INVALID_STATE
    http: 409
    condition: "the artist consultation is not in PENDING when a response is attempted"
  - id: ERR_ALLOCATION_INVALID_STATE
    http: 409
    condition: "the funding allocation is not in RESERVED when a manual release is attempted"
  - id: ERR_INCIDENT_INVALID_STATE
    http: 409
    condition: "the damage incident's damage_status does not permit the requested transition"
  - id: ERR_CLAIM_INVALID_STATE
    http: 409
    condition: "the damage incident's claim_status does not permit filing or resolution"
  # --- compliance, safety and segregation of duties ---
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 409
    condition: "the user finalizing a condition assessment is the same user who submitted it"
  - id: ERR_INITIATOR_CANNOT_VOTE
    http: 409
    condition: "the deaccession case initiator casts an APPROVE or DENY ballot"
  - id: ERR_ARTWORK_DEACCESSIONED
    http: 409
    condition: "the referenced artwork's custody_status is DEACCESSIONED or DESTROYED"
  - id: ERR_ARTWORK_CUSTODY_INVALID
    http: 409
    condition: "the artwork's custody_status does not permit the operation, e.g. starting work on a work already IN_TREATMENT"
  - id: ERR_RECOGNIZED_STATURE_PROTECTED
    http: 422
    condition: "executing a DESTRUCTION disposition on an artwork whose recognized_stature is true"
  - id: ERR_ARTIST_CONSULTATION_REQUIRED
    http: 422
    condition: "approving an appearance-altering proposal with no ArtistConsultation linked to it while moral rights are ACTIVE"
  - id: ERR_ARTIST_CONSULTATION_PENDING
    http: 409
    condition: "the linked artist consultation is still PENDING at approval time"
  - id: ERR_ARTIST_OBJECTION_UNRESOLVED
    http: 409
    condition: "the linked artist consultation is OBJECTED at approval time"
  - id: ERR_MORAL_RIGHTS_NOTICE_REQUIRED
    http: 422
    condition: "relocating or deaccessioning an artwork with ACTIVE moral rights without a matching ACKNOWLEDGED or WAIT_ELAPSED notice"
  - id: ERR_MORAL_RIGHTS_WAIT_ACTIVE
    http: 409
    condition: "the matching notice's earliest_action_at is still in the future relative to the logical clock"
  - id: ERR_CONSERVATOR_NOT_ELIGIBLE
    http: 422
    condition: "the conservator is SUSPENDED, their insurance lapses before engagement_end, or the artwork's material is outside their specialties"
  - id: ERR_PROTOCOL_MATERIAL_MISMATCH
    http: 422
    condition: "the protocol's material_class differs from the artwork's material_class"
  - id: ERR_PHOTO_DOCUMENTATION_INSUFFICIENT
    http: 422
    condition: "fewer than three photographic records are attached when the survey is submitted"
  # --- temporal ---
  - id: ERR_WINDOW_IN_PAST
    http: 422
    condition: "window_start is before the logical clock when scheduling a maintenance visit"
  - id: ERR_VISIT_WINDOW_NOT_OPEN
    http: 409
    condition: "the visit is started before its window_start"
  - id: ERR_PUBLIC_COMMENT_OPEN
    http: 409
    condition: "advancing to BOARD_REVIEW before public_comment_closes_at"
  - id: ERR_CONSULTATION_WINDOW_CLOSED
    http: 409
    condition: "the artist responds at or after due_at"
  # --- constraints ---
  - id: ERR_DUPLICATE_CODE
    http: 409
    condition: "accession_number, site_code, protocol_code or pool_code already exists"
  - id: ERR_CONSERVATOR_WINDOW_CONFLICT
    http: 409
    condition: "the engagement window collides with another APPROVED or IN_EXECUTION engagement for the same conservator once the 48-hour buffer is applied on both sides"
  - id: ERR_SITE_WORK_CAPACITY_CONFLICT
    http: 409
    condition: "the requested closed site work window collides with as many SCHEDULED or IN_PROGRESS visits at that site as its concurrent_work_capacity allows"
  - id: ERR_SITE_CAPACITY_EXCEEDED
    http: 422
    condition: "installed_units_used plus the artwork's footprint_units would exceed the target site's capacity_units"
  - id: ERR_DUPLICATE_ACTIVE_PROPOSAL
    http: 409
    condition: "a non-terminal treatment proposal already exists for the same condition assessment"
  - id: ERR_ASSESSMENT_NOT_FINALIZED
    http: 422
    condition: "the referenced condition assessment is not FINALIZED or belongs to a different artwork"
  - id: ERR_MAX_ANNUAL_APPLICATIONS
    http: 409
    condition: "completing the visit would exceed the protocol's max_annual_applications for this artwork in the clock year"
  - id: ERR_DUPLICATE_BALLOT
    http: 409
    condition: "the same member_user_id casts a second ballot on the same case"
  - id: ERR_REVISION_LIMIT_REACHED
    http: 409
    condition: "a third revision round is requested on the same survey or proposal"
  # --- referential ---
  - id: ERR_DISPOSITION_TARGET_REQUIRED
    http: 422
    condition: "executing a SALE or TRANSFER disposition with disposition_target_ref null"
  - id: ERR_ALLOCATION_LINK_MISMATCH
    http: 422
    condition: "purpose TREATMENT without proposal_id, purpose MAINTENANCE without visit_id, or both links supplied"
  - id: ERR_CLAIM_BASIS_UNSUPPORTED
    http: 422
    condition: "claim_basis RESTORATION with no linked proposal carrying a pinned estimate"
  - id: ERR_CREDIT_POOL_REQUIRED
    http: 422
    condition: "settling a claim while credited_pool_id is null"
  # --- fiscal ---
  - id: ERR_POOL_FUNDS_INSUFFICIENT
    http: 422
    condition: "amount_cents exceeds the pool's available_cents at reservation time"
  - id: ERR_FUNDING_NOT_RESERVED
    http: 422
    condition: "no RESERVED allocation covering estimate_total_cents exists for the proposal at approval time"
  - id: ERR_NO_SETTLEMENT_PAYABLE
    http: 422
    condition: "settling a claim whose computed settlement_cents is 0 after policy limit and deductible"

