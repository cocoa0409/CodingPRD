        grounds:
          - state_machines.Pet.ACTIVE_to_PASSED
          - state_machines.Shipment.DISPATCHED_to_AWAITING_PET_PASSING_DECISION
          - state_machines.Order.SHIPPED_to_AWAITING_PET_PASSING_DECISION
