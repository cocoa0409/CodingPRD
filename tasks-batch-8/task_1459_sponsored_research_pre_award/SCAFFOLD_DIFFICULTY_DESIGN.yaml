            - { call: "POST /pre-award/proposals/${prop_id}/approve-institutional", payload: {}, as: OSPDirector, as_user_id: "director-1" }
            - { call: "POST /pre-award/proposals/${prop_id}/submit", payload: { idempotency_key: "sub-aw-1" }, as: OSPDirector }
            - { call: "GET /pre-award/proposals/${prop_id}", payload: {}, as: OSPDirector, captures: { pv2: $.data.version } }
            - call: "POST /pre-award/proposals/${prop_id}/negotiation-offers"
              payload: { expected_proposal_version: "${pv2}", origin: "SPONSOR", offered_total_cents: 14000000 }
              as: OSPDirector
              captures: { offer_id: $.data.id }
            - { call: "GET /pre-award/proposals/${prop_id}/award-handoffs", payload: {}, as: OSPDirector }
          trigger:
            - { call: "POST /pre-award/negotiation-offers/${offer_id}/accept", payload: {}, as: OSPDirector, captures: { o_status: $.data.status } }
            - { call: "GET /pre-award/proposals/${prop_id}", payload: {}, as: OSPDirector, captures: { p_status: $.data.status, p_awarded: $.data.awarded_total_cents } }
            - { call: "GET /pre-award/proposals/${prop_id}/award-handoffs", payload: {}, as: OSPDirector, captures: { h_status: "$.data[0].status", h_budget: "$.data[0].budget_verified", h_comp: "$.data[0].compliance_verified", h_sub: "$.data[0].subrecipient_verified" } }
          assert:
            - "award-handoffs list is empty before accept (total_count == 0)"
            - "o_status == ACCEPTED"
            - "p_status == AWARDED and p_awarded == 14000000 (link 1)"
            - "after accept the list holds exactly 1 entry: h_status == DRAFT and h_budget == false and h_comp == false and h_sub == false (link 2, caused by the award)"

      - name: deadline_sweep_cascade
        grounds:
          - state_machines.FundingOpportunity.PUBLISHED_to_INTAKE_CLOSED
          - state_machines.Proposal.ANY_NON_TERMINAL_to_WITHDRAWN
          - state_machines.ComplianceReview.PENDING_to_DISAPPROVED
          - calculations.internal_deadline
        distinguishing_aspect: |
          Depth-3 chain from the clock-set trigger (different from both the
          disapprove and accept triggers): clock crossing sponsor_deadline_at
          closes the opportunity (link 1); closure withdraws its pre-submission
          proposal (link 2); the withdrawal cancels the PENDING review, withdraws
          the PLEDGED cost-share, and voids the DRAFT sub commitment (link 3).
        test_recipe:
          setup:
            - "Opportunity: sponsor_deadline 2026-09-05T17:00:00Z, internal lead 5; eligible PI; 54% rate; LOW-risk org"
            - "Proposal BUDGET_LOCKED with a PENDING IRB review, a PLEDGED cost-share, a DRAFT sub commitment"
          setup_api_calls:
            - { call: "POST /pre-award/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: OSPSystemAdmin }
            - call: "POST /pre-award/funding-opportunities"
              payload: { sponsor_code: "NSF", title: "O1", activity_codes_allowed: ["RESEARCH_ON_CAMPUS"], sponsor_deadline_at: "2026-09-05T17:00:00Z", internal_lead_days: 5, requires_cost_share: false, min_cost_share_pct_of_request: 0 }
              as: OSPSystemAdmin
