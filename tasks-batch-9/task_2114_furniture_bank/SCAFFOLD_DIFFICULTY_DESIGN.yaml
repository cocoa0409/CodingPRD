            - "DeliveryRun on BOX-5 with service_date 2026-08-04 and window 18:00-22:00Z carries that voucher as its only stop and is CREWED by one confirmed DRIVER, whose assigned_hours_month is therefore 4.0."
            - "A second donation offer of one DRESSER (B, non-soft, 20.0 cf) is TRIAGED and scheduled for pickup on the same truck in the non-overlapping window 13:00-15:00Z."
