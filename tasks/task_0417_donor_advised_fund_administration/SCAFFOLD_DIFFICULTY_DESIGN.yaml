# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Donor-Advised Fund Administration — Expert band
# Cross-references SCAFFOLD.yaml §1.1–§1.7 against the nine §0.5 Difficulty Rules.
# Every grounds[] ref resolves to a declared element in SCAFFOLD.yaml.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  # Rule 1 — Dual-variant calculations across DIFFERENT entity domains
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: contribution_fmv_mean_high_low_vs_closing_price
        grounds:
          - calculations.contribution_fair_market_value
          - entities.Contribution.fields.thinly_traded
          - entities.Contribution.fields.fair_market_value_cents
          - state_machines.Contribution.PENDING_to_SETTLED
        distinguishing_aspect: |
          On the Contribution domain, the MEAN_HIGH_LOW variant (thinly_traded=false) values
          identical 100 shares at round_half_up(100*(1100+900)/2)=100000 cents while the
          CLOSING_PRICE variant (thinly_traded=true) values the same shares at
          round_half_up(100*1050)=105000 cents — a 5000-cent divergence from one boolean flag.
        test_recipe:
          setup:
            - "Sponsor exists; one ACTIVE DonorAccount."
            - "Two PENDING SECURITIES contributions with quantity_milli=100000 (100 shares), high=1100, low=900, closing=1050; one thinly_traded=false, one thinly_traded=true."
          setup_api_calls:
            - call: "POST /daf/sponsors"
              payload: { name: "Fidelity Charitable", ein: "11-1111111" }
              as: SponsorAdmin
              captures: { sponsor_id: $.data.id }
            - call: "POST /daf/accounts"
              payload: { sponsor_id: "${sponsor_id}", account_name: "Weber Family Fund", primary_advisor_user_id: "adv-1" }
              as: SponsorAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /daf/contributions"
              payload: { donor_account_id: "${acct_id}", asset_type: "SECURITIES", ticker: "ACME", quantity_milli: 100000, high_price_cents: 1100, low_price_cents: 900, closing_price_cents: 1050, thinly_traded: false }
              as: DonorAdvisor
              as_user_id: "adv-1"
              captures: { contrib_mhl_id: $.data.id }
            - call: "POST /daf/contributions"
              payload: { donor_account_id: "${acct_id}", asset_type: "SECURITIES", ticker: "THIN", quantity_milli: 100000, high_price_cents: 1100, low_price_cents: 900, closing_price_cents: 1050, thinly_traded: true }
              as: DonorAdvisor
              as_user_id: "adv-1"
              captures: { contrib_close_id: $.data.id }
          trigger:
            - call: "POST /daf/contributions/${contrib_mhl_id}/settle"
              payload: {}
              as: ContributionAdmin
            - call: "POST /daf/contributions/${contrib_close_id}/settle"
              payload: {}
              as: ContributionAdmin
          assert:
            - "Contribution.${contrib_mhl_id}.fair_market_value_cents == 100000"
            - "Contribution.${contrib_close_id}.fair_market_value_cents == 105000"
            - "Contribution.${contrib_close_id}.fair_market_value_cents - Contribution.${contrib_mhl_id}.fair_market_value_cents == 5000"

      - name: grantable_balance_settled_vs_projected
        grounds:
          - calculations.grantable_balance
          - entities.DonorAccount.fields.grantable_balance_cents
          - entities.Contribution.fields.status
          - endpoints.GET /daf/accounts/{accountId}/summary
        distinguishing_aspect: |
          On the DonorAccount domain (different entity from contribution_fair_market_value),
          the SETTLED variant excludes PENDING contributions yielding grantable=500000, while
          the PROJECTED variant adds the pending CRYPTO contribution at provisional value
          floor(2.5*3000000)=7500000, yielding grantable=8000000 — divergence equals the sum
          of pending provisional FMVs.
        test_recipe:
          setup:
            - "Sponsor; ACTIVE DonorAccount with one SETTLED cash contribution of 500000 cents (cash_balance_cents=500000)."
            - "One additional PENDING CRYPTO contribution: quantity_milli=2500 (2.5 units), spot_price_cents=3000000."
          setup_api_calls:
            - call: "POST /daf/sponsors"
              payload: { name: "Vanguard Charitable", ein: "22-2222222" }
              as: SponsorAdmin
              captures: { sponsor_id: $.data.id }
            - call: "POST /daf/accounts"
              payload: { sponsor_id: "${sponsor_id}", account_name: "Proj Fund", primary_advisor_user_id: "adv-2" }
              as: SponsorAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /daf/contributions"
              payload: { donor_account_id: "${acct_id}", asset_type: "CASH", cash_amount_cents: 500000 }
              as: DonorAdvisor
              as_user_id: "adv-2"
              captures: { cash_contrib_id: $.data.id }
            - call: "POST /daf/contributions/${cash_contrib_id}/settle"
              payload: {}
              as: ContributionAdmin
            - call: "POST /daf/contributions"
              payload: { donor_account_id: "${acct_id}", asset_type: "CRYPTO", ticker: "BTC", quantity_milli: 2500, spot_price_cents: 3000000 }
              as: DonorAdvisor
              as_user_id: "adv-2"
              captures: { crypto_contrib_id: $.data.id }
          trigger:
            - call: "GET /daf/accounts/${acct_id}/summary"
              payload: {}
              as: DonorAdvisor
              as_user_id: "adv-2"
              captures: { settled_grantable: $.data.grantable_balance_cents }
            - call: "GET /daf/accounts/${acct_id}/summary?projection=PROJECTED"
              payload: {}
              as: DonorAdvisor
              as_user_id: "adv-2"
              captures: { projected_grantable: $.data.grantable_balance_cents }
          assert:
            - "settled grantable_balance_cents == 500000"
            - "projected grantable_balance_cents == 8000000"
            - "projected - settled == 7500000 (the pending CRYPTO provisional FMV)"

  # ===========================================================================
  # Rule 2 — Combinatorial formulas across DIFFERENT modes
  #   instance 1 = mode (a) non-linear floor/ceil branch (pool_unit_delta)
  #   instance 2 = mode (b) nested rounding, order pinned (quarterly_admin_fee)
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: pool_unit_delta_buy_floor_redeem_ceil_asymmetry
        grounds:
          - calculations.pool_unit_delta
          - state_machines.RebalanceOrder.DRAFT_to_EXECUTED
          - entities.PoolAllocation.fields.units_micro
          - entities.DonorAccount.fields.cash_balance_cents
        distinguishing_aspect: |
          Mode (a): the 3-input formula (amount_cents, nav_per_unit_cents, direction) branches
          non-linearly — BUY floors units, REDEEM ceils them. With nav=3 cents, a BUY of 10 cents
          adds floor(10*1e6/3)=3333333 micro-units but a REDEEM of 10 cents surrenders
          ceil(10*1e6/3)=3333334 micro-units, so buy-then-redeem of the same cash leaves a 1
          micro-unit residual — the operation is not symmetric.
        test_recipe:
          setup:
            - "Sponsor; OPEN InvestmentPool with nav_per_unit_cents=3, fee_bps=50."
            - "ACTIVE DonorAccount with cash_balance_cents=10 (one SETTLED CASH contribution of 10 cents)."
          setup_api_calls:
            - call: "POST /daf/sponsors"
              payload: { name: "Schwab Charitable", ein: "33-3333333" }
              as: SponsorAdmin
              captures: { sponsor_id: $.data.id }
            - call: "POST /daf/pools"
              payload: { sponsor_id: "${sponsor_id}", name: "Micro Pool", risk_tier: "BALANCED", nav_per_unit_cents: 3, fee_bps: 50 }
              as: SponsorAdmin
              captures: { pool_id: $.data.id }
            - call: "POST /daf/accounts"
              payload: { sponsor_id: "${sponsor_id}", account_name: "Asym Fund", primary_advisor_user_id: "adv-3" }
              as: SponsorAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /daf/contributions"
              payload: { donor_account_id: "${acct_id}", asset_type: "CASH", cash_amount_cents: 10 }
              as: DonorAdvisor
              as_user_id: "adv-3"
              captures: { contrib_id: $.data.id }
            - call: "POST /daf/contributions/${contrib_id}/settle"
              payload: {}
              as: ContributionAdmin
            - call: "POST /daf/rebalance-orders"
              payload: { donor_account_id: "${acct_id}", target_pool_id: "${pool_id}", amount_cents: 10, target_pct_bps: 5000 }
              as: DonorAdvisor
              as_user_id: "adv-3"
              captures: { buy_order_id: $.data.id }
            - call: "POST /daf/rebalance-orders/${buy_order_id}/execute"
              payload: {}
              as: DonorAdvisor
              as_user_id: "adv-3"
            - call: "POST /daf/rebalance-orders"
              payload: { donor_account_id: "${acct_id}", source_pool_id: "${pool_id}", amount_cents: 10 }
              as: DonorAdvisor
              as_user_id: "adv-3"
              captures: { redeem_order_id: $.data.id }
          trigger:
            - call: "POST /daf/rebalance-orders/${redeem_order_id}/execute"
              payload: {}
              as: DonorAdvisor
              as_user_id: "adv-3"
          assert:
            - "After BUY of 10 cents, the PoolAllocation.units_micro == 3333333 (floor) and DonorAccount.cash_balance_cents == 0"
            - "The REDEEM of 10 cents is permitted because the allocation invested value round_half_up(3333333/1e6 * 3) == 10 >= 10"
            - "After REDEEM of 10 cents, PoolAllocation.units_micro == -1 (3333333 - 3333334 ceil) and DonorAccount.cash_balance_cents == 10 — proving BUY floor / REDEEM ceil asymmetry leaves a non-zero residual"

      - name: quarterly_admin_fee_round_per_allocation_then_sum
        grounds:
          - calculations.quarterly_admin_fee
          - state_machines.DonorAccount.ACTIVE_to_INACTIVE
          - endpoints.POST /daf/sponsors/{sponsorId}/close_quarter
          - entities.DonorAccount.fields.admin_fee_accrued_cents
        distinguishing_aspect: |
          Mode (b): the order is PINNED as round-per-allocation-then-sum. Two ACTIVE allocations
          each with invested_value=82800 cents and fee_bps=50 give per_alloc_fee=
          round_half_up(50*82800/40000)=round_half_up(103.5)=104 each, summing to 208 — whereas
          the forbidden sum-then-round order yields round_half_up(50*165600/40000)=
          round_half_up(207.0)=207. The 1-cent gap proves the pinned order.
        test_recipe:
          setup:
            - "Sponsor admin_fee_bps_default irrelevant; pool fee_bps=50, nav_per_unit_cents=2500."
            - "ACTIVE DonorAccount with two ACTIVE PoolAllocations each holding units_micro=33120000 (invested_value 82800 cents) in the same pool, reached via two rebalance buys from 165600 cents of settled cash."
          setup_api_calls:
            - call: "POST /daf/sponsors"
              payload: { name: "NPT", ein: "44-4444444" }
              as: SponsorAdmin
              captures: { sponsor_id: $.data.id }
            - call: "POST /daf/pools"
              payload: { sponsor_id: "${sponsor_id}", name: "Fee Pool", risk_tier: "BALANCED", nav_per_unit_cents: 2500, fee_bps: 50 }
              as: SponsorAdmin
              captures: { pool_id: $.data.id }
            - call: "POST /daf/accounts"
              payload: { sponsor_id: "${sponsor_id}", account_name: "Fee Fund", primary_advisor_user_id: "adv-4" }
              as: SponsorAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /daf/contributions"
              payload: { donor_account_id: "${acct_id}", asset_type: "CASH", cash_amount_cents: 165600 }
              as: DonorAdvisor
              as_user_id: "adv-4"
              captures: { contrib_id: $.data.id }
            - call: "POST /daf/contributions/${contrib_id}/settle"
              payload: {}
              as: ContributionAdmin
            - call: "POST /daf/rebalance-orders"
              payload: { donor_account_id: "${acct_id}", target_pool_id: "${pool_id}", amount_cents: 82800, target_pct_bps: 5000 }
              as: DonorAdvisor
              as_user_id: "adv-4"
              captures: { buy1_id: $.data.id }
            - call: "POST /daf/rebalance-orders/${buy1_id}/execute"
              payload: {}
              as: DonorAdvisor
              as_user_id: "adv-4"
            - call: "POST /daf/rebalance-orders"
              payload: { donor_account_id: "${acct_id}", target_pool_id: "${pool_id}", amount_cents: 82800, target_pct_bps: 5000 }
              as: DonorAdvisor
              as_user_id: "adv-4"
              captures: { buy2_id: $.data.id }
            - call: "POST /daf/rebalance-orders/${buy2_id}/execute"
              payload: {}
              as: DonorAdvisor
              as_user_id: "adv-4"
          trigger:
            - call: "POST /daf/sponsors/${sponsor_id}/close_quarter"
              payload: {}
              as: SponsorAdmin
          assert:
            - "DonorAccount.${acct_id}.admin_fee_accrued_cents == 208"
            - "admin_fee_accrued_cents != 207 (proving round-per-allocation-then-sum, not sum-then-round)"
            - "Exactly one ADMIN_FEE LedgerEntry exists for the account with signed_amount_cents == -208"

  # ===========================================================================
  # Rule 3 — Non-linear state-machine shape on DIFFERENT entities
  #   instance 1 = Charity cyclic revision loop VETTED<->WATCHLISTED
  #   instance 2 = GrantRecommendation branching fork with divergent terminal sets
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: charity_vetted_watchlisted_revision_cycle
        grounds:
          - state_machines.Charity.VETTED_to_WATCHLISTED
          - state_machines.Charity.WATCHLISTED_to_VETTED
          - state_machines.Charity.PENDING_VETTING_to_VETTED
          - entities.Charity.fields.status
        distinguishing_aspect: |
          The Charity machine is cyclic: PENDING_VETTING->VETTED->WATCHLISTED->VETTED is a true
          revision loop (A->B->A) on one entity, distinct from any linear pipeline; the same
          charity returns to VETTED after a WATCHLIST detour without passing through a terminal.
        test_recipe:
          setup:
            - "Sponsor; one Charity (is_private_foundation=false) currently VETTED."
          setup_api_calls:
            - call: "POST /daf/sponsors"
              payload: { name: "Cyc Sponsor", ein: "55-5555555" }
              as: SponsorAdmin
              captures: { sponsor_id: $.data.id }
            - call: "POST /daf/charities"
              payload: { sponsor_id: "${sponsor_id}", legal_name: "Red Cross", ein: "55-9000001", ntee_code: "P20", is_private_foundation: false }
              as: ComplianceOfficer
              captures: { charity_id: $.data.id }
            - call: "POST /daf/charities/${charity_id}/vet"
              payload: { decision: "APPROVE", vetting_note: "initial approve" }
              as: ComplianceOfficer
          trigger:
            - call: "POST /daf/charities/${charity_id}/vet"
              payload: { decision: "WATCHLIST", vetting_note: "flagged" }
              as: ComplianceOfficer
            - call: "POST /daf/charities/${charity_id}/vet"
              payload: { decision: "APPROVE", vetting_note: "cleared" }
              as: ComplianceOfficer
              captures: { final_status: $.data.status }
          assert:
            - "After WATCHLIST then APPROVE, Charity.${charity_id}.status == VETTED"
            - "Charity.${charity_id}.vetting_note == 'cleared'"

      - name: grant_branching_fork_divergent_terminals
        grounds:
          - state_machines.GrantRecommendation.SUBMITTED_to_REJECTED
          - state_machines.GrantRecommendation.SUBMITTED_to_CANCELLED
          - state_machines.GrantRecommendation.SUBMITTED_to_APPROVED
          - entities.GrantRecommendation.fields.status
        distinguishing_aspect: |
          The GrantRecommendation machine (different entity from Charity) branches fork-style at
          SUBMITTED into divergent terminal sets {REJECTED, CANCELLED} versus the forward path to
          PAID, each branch carrying a different side-effect set (REJECT/CANCEL release committed
          balance; APPROVE does not). Two SUBMITTED grants diverge to REJECTED and CANCELLED.
        test_recipe:
          setup:
            - "Sponsor minimum_grant_cents default 5000; VETTED Charity; ACTIVE DonorAccount funded with 1000000 cents cash."
            - "Two SUBMITTED grants of 100000 cents each to the VETTED charity (recommended by adv-5)."
          setup_api_calls:
            - call: "POST /daf/sponsors"
              payload: { name: "Fork Sponsor", ein: "66-6666666" }
              as: SponsorAdmin
              captures: { sponsor_id: $.data.id }
            - call: "POST /daf/charities"
              payload: { sponsor_id: "${sponsor_id}", legal_name: "Food Bank", ein: "66-9000001", ntee_code: "K30", is_private_foundation: false }
              as: ComplianceOfficer
              captures: { charity_id: $.data.id }
            - call: "POST /daf/charities/${charity_id}/vet"
              payload: { decision: "APPROVE" }
              as: ComplianceOfficer
            - call: "POST /daf/accounts"
              payload: { sponsor_id: "${sponsor_id}", account_name: "Fork Fund", primary_advisor_user_id: "adv-5" }
              as: SponsorAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /daf/contributions"
              payload: { donor_account_id: "${acct_id}", asset_type: "CASH", cash_amount_cents: 1000000 }
              as: DonorAdvisor
              as_user_id: "adv-5"
              captures: { contrib_id: $.data.id }
            - call: "POST /daf/contributions/${contrib_id}/settle"
              payload: {}
              as: ContributionAdmin
            - call: "GET /daf/accounts/${acct_id}"
              payload: {}
              as: DonorAdvisor
              as_user_id: "adv-5"
              captures: { ver1: $.data.version }
            - call: "POST /daf/grants"
              payload: { donor_account_id: "${acct_id}", charity_id: "${charity_id}", amount_cents: 100000, expected_account_version: "${ver1}" }
              as: DonorAdvisor
              as_user_id: "adv-5"
              captures: { grant_a_id: $.data.id }
            - call: "GET /daf/accounts/${acct_id}"
              payload: {}
              as: DonorAdvisor
              as_user_id: "adv-5"
              captures: { ver2: $.data.version }
            - call: "POST /daf/grants"
              payload: { donor_account_id: "${acct_id}", charity_id: "${charity_id}", amount_cents: 100000, expected_account_version: "${ver2}" }
              as: DonorAdvisor
              as_user_id: "adv-5"
              captures: { grant_b_id: $.data.id }
          trigger:
            - call: "POST /daf/grants/${grant_a_id}/reject"
              payload: {}
              as: GrantOfficer
              as_user_id: "officer-1"
            - call: "POST /daf/grants/${grant_b_id}/cancel"
              payload: {}
              as: DonorAdvisor
              as_user_id: "adv-5"
          assert:
            - "GrantRecommendation.${grant_a_id}.status == REJECTED"
            - "GrantRecommendation.${grant_b_id}.status == CANCELLED"
            - "DonorAccount.${acct_id}.committed_grants_cents == 0 (both releases recomputed)"

  # ===========================================================================
  # Rule 4 — Transitive cascade chains from DIFFERENT triggers
  #   instance 1 depth>=3: grant pay -> redeem pool -> ledger + balance recompute + inactivity clear
  #   instance 2 depth>=2: charity REVOKE -> grant CANCELLED -> committed/grantable recompute
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: grant_pay_redeem_ledger_inactivity_cascade
        grounds:
          - state_machines.GrantRecommendation.SCHEDULED_to_PAID
          - calculations.grant_payout_redemption
          - state_machines.DonorAccount.INACTIVE_to_ACTIVE
          - entities.PoolAllocation.fields.status
          - entities.LedgerEntry.fields.entry_type
        distinguishing_aspect: |
          Depth>=3 cascade originating at grant pay (SCHEDULED->PAID): (1) pay triggers
          grant_payout_redemption which mutates PoolAllocation.units_micro; (2) the redemption
          mutation itself appends POOL_REDEEM + GRANT_PAID LedgerEntries and recomputes
          invested_value_cents/grantable_balance_cents; (3) that PAID event itself transitions
          the DonorAccount INACTIVE->ACTIVE — each link caused by the previous, not the trigger.
        test_recipe:
          setup:
            - "Sponsor inactivity_quarters=8; VETTED Charity; DonorAccount currently INACTIVE."
            - "Account has cash_balance_cents=30000 and one ACTIVE PoolAllocation units_micro=40000000 in a nav=2500 pool (invested value 100000); a SCHEDULED grant of 100000 cents."
          setup_api_calls:
            - call: "POST /daf/sponsors"
              payload: { name: "Casc Sponsor", ein: "77-7777777", inactivity_quarters: 8 }
              as: SponsorAdmin
              captures: { sponsor_id: $.data.id }
            - call: "POST /daf/pools"
              payload: { sponsor_id: "${sponsor_id}", name: "Casc Pool", risk_tier: "GROWTH", nav_per_unit_cents: 2500, fee_bps: 50 }
              as: SponsorAdmin
              captures: { pool_id: $.data.id }
            - call: "POST /daf/charities"
              payload: { sponsor_id: "${sponsor_id}", legal_name: "Shelter", ein: "77-9000001", ntee_code: "L41", is_private_foundation: false }
              as: ComplianceOfficer
              captures: { charity_id: $.data.id }
            - call: "POST /daf/charities/${charity_id}/vet"
              payload: { decision: "APPROVE" }
              as: ComplianceOfficer
            - call: "POST /daf/accounts"
              payload: { sponsor_id: "${sponsor_id}", account_name: "Casc Fund", primary_advisor_user_id: "adv-6" }
              as: SponsorAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /daf/contributions"
              payload: { donor_account_id: "${acct_id}", asset_type: "CASH", cash_amount_cents: 130000 }
              as: DonorAdvisor
              as_user_id: "adv-6"
              captures: { contrib_id: $.data.id }
            - call: "POST /daf/contributions/${contrib_id}/settle"
              payload: {}
              as: ContributionAdmin
            - call: "POST /daf/rebalance-orders"
              payload: { donor_account_id: "${acct_id}", target_pool_id: "${pool_id}", amount_cents: 100000, target_pct_bps: 6000 }
              as: DonorAdvisor
              as_user_id: "adv-6"
              captures: { buy_id: $.data.id }
            - call: "POST /daf/rebalance-orders/${buy_id}/execute"
              payload: {}
              as: DonorAdvisor
              as_user_id: "adv-6"
            - call: "GET /daf/accounts/${acct_id}"
              payload: {}
              as: DonorAdvisor
              as_user_id: "adv-6"
              captures: { ver1: $.data.version }
            - call: "POST /daf/grants"
              payload: { donor_account_id: "${acct_id}", charity_id: "${charity_id}", amount_cents: 100000, expected_account_version: "${ver1}" }
              as: DonorAdvisor
              as_user_id: "adv-6"
              captures: { grant_id: $.data.id }
            - call: "POST /daf/grants/${grant_id}/approve"
              payload: {}
              as: GrantOfficer
              as_user_id: "officer-2"
            - call: "POST /daf/grants/${grant_id}/schedule"
              payload: {}
              as: GrantOfficer
              as_user_id: "officer-2"
            - call: "POST /daf/sponsors/${sponsor_id}/close_quarter"
              payload: {}
              as: SponsorAdmin
          trigger:
            - call: "POST /daf/grants/${grant_id}/pay"
              payload: {}
              as: GrantOfficer
              as_user_id: "officer-2"
          assert:
            - "GrantRecommendation.${grant_id}.status == PAID"
            - "PoolAllocation for the account has units_micro == 12000000 (redeemed 28000000 of 40000000)"
            - "A LedgerEntry with entry_type == POOL_REDEEM and one with entry_type == GRANT_PAID (signed_amount_cents == -100000) exist for the account"
            - "DonorAccount.${acct_id}.cash_balance_cents == 0 and invested_value_cents == 30000"
            - "DonorAccount.${acct_id}.status == ACTIVE (INACTIVE cleared by the PAID grant)"

      - name: charity_revoke_grant_cancel_balance_recompute_cascade
        grounds:
          - state_machines.Charity.VETTED_to_REVOKED
          - state_machines.GrantRecommendation.SCHEDULED_to_CANCELLED
          - calculations.grantable_balance
          - entities.DonorAccount.fields.committed_grants_cents
        distinguishing_aspect: |
          Depth>=2 cascade from a DIFFERENT trigger (charity vet REVOKE, not grant pay):
          (1) REVOKE mutates Charity.status->REVOKED; (2) that revocation itself cascades every
          SCHEDULED grant referencing the charity to CANCELLED; (3) each cancel itself recomputes
          committed_grants_cents and grantable_balance_cents — the balance change is caused by the
          cascaded cancel, not directly by the vet call.
