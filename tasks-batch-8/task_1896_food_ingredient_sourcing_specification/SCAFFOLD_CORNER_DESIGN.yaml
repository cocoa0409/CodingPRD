  # ===========================================================================
  # Section: errors
  # ===========================================================================
  - section: errors
    instances:
      - name: error_missing_auth_header
        claim_type: violation_to_error
        grounds:
          - errors[ERR_MISSING_AUTH_HEADER]
          - validations[priority=1]
        distinguishing_aspect: "A request with no X-User-ID/X-User-Role headers fails with ERR_MISSING_AUTH_HEADER 400 regardless of endpoint."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /sourcing/ingredients"
              payload: { ingredient_code: "NOAUTH", name: "NoAuth", allergen_profile: ["NONE"], requires_dual_source: false }
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_MISSING_AUTH_HEADER"

      - name: error_catalog_cross_check
        claim_type: violation_to_error
        grounds:
          - errors[ERR_INVALID_STATE]
          - errors[ERR_DUPLICATE]
          - errors[ERR_SEGREGATION_OF_DUTIES]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "Cross-check stub: every error in §1.6 is triggered by at least one §1.8 or §1.9 instance; this stub documents the audit rather than adding a recipe."
        excluded_because:
          difficulty_instance: boundary_precision_check / qualification_score_exactly_70_passes
          rationale: "Error triggerability is enforced by the aggregate of §1.8/§1.9 instances (each error appears in at least one trigger); no separate recipe needed."

