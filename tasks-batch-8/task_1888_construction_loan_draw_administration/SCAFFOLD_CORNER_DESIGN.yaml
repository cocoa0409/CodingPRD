      - name: inspection_draw_loan_mismatch_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=10]", "errors[ERR_DRAW_LOAN_MISMATCH]"]
        distinguishing_aspect: "An inspection ordered with loan_id L1 but draw_id of a draw belonging to L2 fails with 422 ERR_DRAW_LOAN_MISMATCH (the target draw is in UNDER_REVIEW, so the state gate passes and the referential mismatch is what fires)."
        test_recipe:
          setup: ["loans L1, L2; L2 has BL-X and draw D2 in UNDER_REVIEW"]
          setup_api_calls:
            - { call: "POST /borrowers", payload: { legal_name: "Acme Builders LLC", contact_email: "ops@acme.example", entity_type: "LLC" }, as: LenderAdmin, captures: { b_id: $.data.id } }
