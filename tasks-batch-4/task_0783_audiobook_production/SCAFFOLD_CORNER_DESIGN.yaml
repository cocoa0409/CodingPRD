              as_user_id: "${au}"
              captures: { ti: $.data.id }
            - call: "POST /titles/${ti}/open"
              payload: {}
              as: Author
              as_user_id: "${au}"
              captures: { tv: $.data.version }
            - call: "POST /auditions"
              payload: { title_id: "${ti}", sample_url: "http://s/v2" }
              as: Narrator
              as_user_id: "${na}"
