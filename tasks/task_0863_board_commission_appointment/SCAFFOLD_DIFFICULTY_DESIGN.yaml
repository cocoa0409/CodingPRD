              captures: { st: "$.data.status" }
          assert:
            - "Appointment.${appt1}.status == CONFIRMED"
            - "GET /civic/terms?seat_id=${s1}&status=ACTIVE returns exactly 1 Term"
            - "Seat.${s1}.occupancy_status == FILLED"

