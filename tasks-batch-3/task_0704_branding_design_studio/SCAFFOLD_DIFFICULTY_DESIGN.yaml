          assert:
            - "Trigger response error_id == ERR_INTERVAL_OVERLAP (http 409)"
            - "Closed-interval semantics: sharing the single endpoint 2026-03-10 counts as overlap"

      - name: care_cycle_half_open_interval_endpoint_touch_is_allowed
        grounds:
          - validations[priority=8]
          - entities.CareCycle.fields.period_start
          - entities.CareCycle.fields.period_end
          - errors[ERR_INTERVAL_OVERLAP]
