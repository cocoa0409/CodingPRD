            - "ContentItem.${ci}.suitability_rating == 'RED'"
            - "ContentItem.${ci}.last_rated_by_user_id == 'pr_rate_1'"
            - "Appeal.${ap}.state == 'SUBMITTED'"
            - "Appeal.${ap}.reviewer_user_id == null"

      - name: creator_cannot_finalize_close_or_settle
        claim_type: role_cannot_perform_other_exclusive_operations
        grounds:
          - "roles[Creator].description"
