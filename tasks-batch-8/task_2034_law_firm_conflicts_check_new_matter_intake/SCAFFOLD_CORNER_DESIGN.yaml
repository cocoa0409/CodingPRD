            - { call: "POST /intake/attorneys", payload: { full_name: "Rachel Attorney", bar_number: "BAR001", practice_group: "LITIGATION", hire_type: "INTERNAL" }, as: FirmAdmin, captures: { a: $.data.id } }
            - { call: "POST /intake/matters", payload: { client_party_id: "${p}", responsible_attorney_id: "${a}", practice_group: "LITIGATION", matter_title: "M" }, as: IntakeSpecialist, captures: { m: $.data.id } }
          trigger:
            - { call: "POST /intake/matters/${m}/conflict-checks", payload: { search_variant: "STRICT", match_threshold: 101 }, as: IntakeSpecialist, captures: { err: $.data.error_id } }
          assert: ["err == ERR_INVALID_REQUEST"]

      - name: c_lateral_missing_fields_400
        claim_type: conditional_validation
        grounds: [entities.Attorney.fields.hire_type, "validations[priority=12]", "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "hire_type=LATERAL without lateral_employed_from/lateral_employed_to/prior_client_names is rejected with ERR_INVALID_REQUEST — the required-field set is conditional on the enum value."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /intake/attorneys", payload: { full_name: "Larry Lateral", bar_number: "BAR009", practice_group: "LITIGATION", hire_type: "LATERAL" }, as: FirmAdmin, captures: { err: $.data.error_id } }
          assert: ["err == ERR_INVALID_REQUEST"]

  # ===============================================================
  - section: endpoints
    instances:
      - name: c_wall_gate_allows_non_excluded_and_opaque
        claim_type: satisfaction_pass
        grounds: ["validations[priority=4]", entities.EthicalWall.fields.excluded_attorney_ids]
        distinguishing_aspect: "On a walled matter, the NON-excluded responsible attorney and an opaque role (IntakeSpecialist) both read the matter successfully — the wall denies only listed entity-backed attorneys (the denied case is asserted in §1.8 lateral_review_activation_wall_cascade)."
        test_recipe:
          setup: ["Matter M with ACTIVE wall excluding attorney A1 (A1 is NOT the responsible attorney)"]
          setup_api_calls:
            - { call: "POST /intake/parties", payload: { legal_name: "Gate Client Inc", party_type: "CORPORATION" }, as: FirmAdmin, captures: { p: $.data.id } }
            - { call: "POST /intake/attorneys", payload: { full_name: "Rachel Attorney", bar_number: "BAR001", practice_group: "LITIGATION", hire_type: "INTERNAL" }, as: FirmAdmin, captures: { a: $.data.id } }
            - { call: "POST /intake/attorneys", payload: { full_name: "Aaron Alpha", bar_number: "BAR003", practice_group: "LITIGATION", hire_type: "INTERNAL" }, as: FirmAdmin, captures: { a1: $.data.id } }
            - { call: "POST /intake/attorneys", payload: { full_name: "Pat Partner", bar_number: "BAR002", practice_group: "LITIGATION", hire_type: "INTERNAL" }, as: FirmAdmin, captures: { cp: $.data.id } }
            - { call: "POST /intake/matters", payload: { client_party_id: "${p}", responsible_attorney_id: "${a}", practice_group: "LITIGATION", matter_title: "M" }, as: IntakeSpecialist, captures: { m: $.data.id } }
            - { call: "POST /intake/matters/${m}/ethical-walls", payload: { reason: "CONFLICT_CONFIRMED", excluded_attorney_ids: ["${a1}"] }, as: ConflictsPartner, as_user_id: "${cp}", captures: { w: $.data.id } }
          trigger:
            - { call: "GET /intake/matters/${m}", as: ResponsibleAttorney, as_user_id: "${a}", captures: { got_ra: $.data.id } }
            - { call: "GET /intake/matters/${m}", as: IntakeSpecialist, captures: { got_op: $.data.id } }
          assert:
            - "got_ra == ${m} (responsible attorney not excluded -> 200)"
            - "got_op == ${m} (opaque role is never wall-blocked)"

      - name: c_letter_issue_twice_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.EngagementLetter.DRAFT_to_ISSUED, "errors[ERR_LETTER_INVALID_STATE]"]
        distinguishing_aspect: "ISSUE moves DRAFT -> ISSUED exactly once; a second ISSUE on the same letter fails ERR_LETTER_INVALID_STATE."
        test_recipe:
          setup: ["Matter M (INTAKE) with a DRAFT letter L"]
          setup_api_calls:
            - { call: "POST /intake/parties", payload: { legal_name: "Issue Client Inc", party_type: "CORPORATION" }, as: FirmAdmin, captures: { p: $.data.id } }
            - { call: "POST /intake/attorneys", payload: { full_name: "Rachel Attorney", bar_number: "BAR001", practice_group: "LITIGATION", hire_type: "INTERNAL" }, as: FirmAdmin, captures: { a: $.data.id } }
            - { call: "POST /intake/matters", payload: { client_party_id: "${p}", responsible_attorney_id: "${a}", practice_group: "LITIGATION", matter_title: "M" }, as: IntakeSpecialist, captures: { m: $.data.id, m_v: $.data.version } }
            - { call: "POST /intake/matters/${m}/engagement-letters", payload: { scope_text: "S", fee_lines: [{ description: "f", hours: 2.0, rate_cents: 50000 }], expected_matter_version: "${m_v}" }, as: ResponsibleAttorney, as_user_id: "${a}", captures: { l: $.data.id } }
          trigger:
            - { call: "POST /intake/engagement-letters/${l}/transition", payload: { action: "ISSUE" }, as: ResponsibleAttorney, as_user_id: "${a}", captures: { st1: $.data.status } }
            - { call: "POST /intake/engagement-letters/${l}/transition", payload: { action: "ISSUE" }, as: ResponsibleAttorney, as_user_id: "${a}", captures: { err: $.data.error_id } }
          assert: ["st1 == ISSUED", "err == ERR_LETTER_INVALID_STATE"]

      - name: c_filtered_hits_by_matter
        claim_type: listing
        grounds: ["endpoints: GET /intake/conflict-hits", entities.ConflictHit.fields.matched_matter_id]
        distinguishing_aspect: "GET /intake/conflict-hits?matched_matter_id=X returns exactly the hits whose matched matter is X, even when one check produced hits against several existing matters."
        test_recipe:
          setup:
            - "Existing matters MA (client A 'Shared Name One Inc') and MB (client B 'Shared Name Two Inc' — token overlap 2/3 = 66 < 80, so no cross-match)"
            - "New matter MC (client C) adds BOTH A and B as ADVERSE; one STRICT check yields 2 hits (one per matched matter)"
          setup_api_calls:
            - { call: "POST /intake/parties", payload: { legal_name: "Shared Name One Inc", party_type: "CORPORATION" }, as: FirmAdmin, captures: { pa: $.data.id } }
            - { call: "POST /intake/parties", payload: { legal_name: "Shared Name Two Inc", party_type: "CORPORATION" }, as: FirmAdmin, captures: { pb: $.data.id } }
            - { call: "POST /intake/parties", payload: { legal_name: "Third Client Corp", party_type: "CORPORATION" }, as: FirmAdmin, captures: { pc: $.data.id } }
            - { call: "POST /intake/attorneys", payload: { full_name: "Rachel Attorney", bar_number: "BAR001", practice_group: "LITIGATION", hire_type: "INTERNAL" }, as: FirmAdmin, captures: { a: $.data.id } }
            - { call: "POST /intake/matters", payload: { client_party_id: "${pa}", responsible_attorney_id: "${a}", practice_group: "LITIGATION", matter_title: "MA" }, as: IntakeSpecialist, captures: { ma: $.data.id } }
            - { call: "POST /intake/matters", payload: { client_party_id: "${pb}", responsible_attorney_id: "${a}", practice_group: "CORPORATE", matter_title: "MB" }, as: IntakeSpecialist, captures: { mb: $.data.id } }
            - { call: "POST /intake/matters", payload: { client_party_id: "${pc}", responsible_attorney_id: "${a}", practice_group: "IP", matter_title: "MC" }, as: IntakeSpecialist, captures: { mc: $.data.id } }
            - { call: "POST /intake/matters/${mc}/parties", payload: { party_id: "${pa}", role_in_matter: "ADVERSE" }, as: IntakeSpecialist }
            - { call: "POST /intake/matters/${mc}/parties", payload: { party_id: "${pb}", role_in_matter: "ADVERSE" }, as: IntakeSpecialist }
            - { call: "POST /intake/matters/${mc}/conflict-checks", payload: { search_variant: "STRICT" }, as: IntakeSpecialist, captures: { chk: $.data.id, hits: $.data.hit_count } }
          trigger:
            - { call: "GET /intake/conflict-hits?matched_matter_id=${ma}", as: IntakeSpecialist, captures: { hm: "$.data[0].matched_matter_id", hp: "$.data[0].matched_party_id" } }
          assert:
            - "hits == 2 (one hit against MA's client, one against MB's)"
            - "filtered list for MA has total_count == 1 and hm == ${ma} and hp == ${pa}"

      - name: c_retainer_deposit_empty_before_issue
        claim_type: retrieval
        grounds: ["endpoints: GET /intake/matters/{id}/retainer-deposits", entities.RetainerDeposit.fields.matter_id]
        distinguishing_aspect: "Before any letter ISSUE, the deposit reverse-lookup returns an empty array (0..1 cardinality as a list), not 404."
        test_recipe:
          setup: ["Matter M (INTAKE) with no letters"]
          setup_api_calls:
            - { call: "POST /intake/parties", payload: { legal_name: "Empty Dep Client Inc", party_type: "CORPORATION" }, as: FirmAdmin, captures: { p: $.data.id } }
            - { call: "POST /intake/attorneys", payload: { full_name: "Rachel Attorney", bar_number: "BAR001", practice_group: "LITIGATION", hire_type: "INTERNAL" }, as: FirmAdmin, captures: { a: $.data.id } }
            - { call: "POST /intake/matters", payload: { client_party_id: "${p}", responsible_attorney_id: "${a}", practice_group: "LITIGATION", matter_title: "M" }, as: IntakeSpecialist, captures: { m: $.data.id } }
          trigger:
            - { call: "GET /intake/matters/${m}/retainer-deposits", as: BillingClerk }
          assert: ["response is 200 with data == [] and total_count == 0"]

      - name: c_client_read_other_matter_forbidden
        claim_type: ownership_check
        grounds: ["validations[priority=5]", "errors[ERR_FORBIDDEN]", "roles[Client]"]
        distinguishing_aspect: "A Client whose X-User-ID is a different party than the matter's client_party_id is denied with ERR_FORBIDDEN (403) — Client reads are ownership-scoped."
        test_recipe:
