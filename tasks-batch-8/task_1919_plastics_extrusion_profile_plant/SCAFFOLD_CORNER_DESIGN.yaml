              as: LineOperator
              captures: { lot_v: $.data.id }
            - { call: "POST /resin-lots/${lot_v}/qc", payload: { outcome: "PASS" }, as: QualityInspector }
            - call: "POST /resin-lots"
              payload: { lot_kind: "COLORANT", resin_type: "PVC", color_family: "RED", received_kg: 100, supplier_lot_ref: "SUP-C1" }
              as: LineOperator
              captures: { lot_c: $.data.id }
            - { call: "POST /resin-lots/${lot_c}/qc", payload: { outcome: "PASS" }, as: QualityInspector }
            - call: "POST /formulations"
              payload: { profile_id: "${prof}", formula_code: "F-RED25", base_resin_type: "PVC", color_family: "RED", let_down_ratio: 25.0, max_regrind_pct: 20 }
              as: ProcessEngineer
              captures: { form: $.data.id }
            - call: "POST /blend-batches"
              payload: { formulation_id: "${form}", virgin_lot_id: "${lot_v}", colorant_lot_id: "${lot_c}", target_batch_kg: 1000 }
              as: LineOperator
              captures: { batch: $.data.id }
            - { call: "POST /blend-batches/${batch}/qc", payload: { action: "RELEASE" }, as: QualityInspector }
            - call: "POST /work-orders"
              payload: { customer_id: "${cust}", profile_id: "${prof}", formulation_id: "${form}", die_id: "${die}", ordered_length_m: 5000, cut_length_mm: 2000, pieces_per_bundle: 25, base_unit_price_cents_per_m: 1000 }
              as: SalesEngineer
              captures: { wo: $.data.id }
            - { call: "POST /work-orders/${wo}/confirm", payload: {}, as: SalesEngineer }
            - call: "POST /line-assignments"
              payload: { work_order_id: "${wo}", die_id: "${die}", line_id: "${line}", planned_start: "2026-08-10T10:00:00Z", planned_end: "2026-08-10T12:00:00Z" }
              as: ProcessEngineer
              captures: { asg: $.data.id }
            - { call: "POST /line-assignments/${asg}/activate", payload: {}, as: ProcessEngineer }
          trigger:
            - call: "POST /runs"
              payload: { assignment_id: "${asg}", batch_id: "${batch}", line_speed_mpm: 25 }
              as: LineOperator
              captures: { run: $.data.id }
            - { call: "GET /blend-batches/${batch}", payload: {}, as: LineOperator }
            - { call: "GET /lines/${line}", payload: {}, as: LineOperator }
            - { call: "GET /work-orders/${wo}", payload: {}, as: LineOperator }
          assert:
            - "ProductionRun.${run}.status == RUNNING and samples_posted == 0"
            - "BlendBatch.${batch}.status == CONSUMED"
            - "ExtrusionLine.${line}.status == RUNNING"
            - "WorkOrder.${wo}.status == IN_PRODUCTION"

      - name: response_envelope_shape
        claim_type: envelope_contract
        grounds:
          - response_envelope
        distinguishing_aspect: "Success responses carry meta.api_request_id + meta.api_request_timestamp and response_type 'object'; error responses carry response_type 'error' with data.error_id."
        test_recipe:
          setup: ["One customer exists"]
          setup_api_calls:
            - call: "POST /customers"
              payload: { name: "Acme", resin_index_basis: "MONTHLY_AVG", credit_limit_cents: 10000000 }
              as: PlantManager
              captures: { cust: $.data.id }
          trigger:
            - { call: "GET /customers/${cust}", payload: {}, as: PlantManager }
            - call: "GET /customers/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: PlantManager
              captures: { err: $.data.error_id }
          assert:
            - "Success: meta.api_request_id present, meta.api_request_timestamp present, response_type == 'object', data.id == ${cust}"
            - "Error: response_type == 'error' and err == ERR_NOT_FOUND"

