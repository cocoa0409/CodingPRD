            - call: "POST /deployments/${d1_id}/ramp"
              payload: {}
              as: ReliabilityEngineer
              as_user_id: "u_rel_1"
              captures: { t2: $.data.traffic_pct, i2: $.data.ramp_step_index }
            - call: "POST /deployments/${d1_id}/ramp"
              payload: {}
              as: ReliabilityEngineer
              as_user_id: "u_rel_1"
              captures: { t3: $.data.traffic_pct, i3: $.data.ramp_step_index }
            - call: "POST /deployments/${d1_id}/ramp"
              payload: {}
              as: ReliabilityEngineer
              as_user_id: "u_rel_1"
              captures: { cap_err: $.data.error_id }
            - call: "GET /serving-endpoints/${se1_id}"
              payload: {}
              as: ReliabilityEngineer
              as_user_id: "u_rel_1"
              captures: { se1_v2: $.data.version, alloc_after_d1: $.data.allocated_traffic_pct }
            - call: "POST /deployments"
              payload: { model_version_id: "${v1_id}", serving_endpoint_id: "${se1_id}", pattern: "SHADOW", serve_from: "2026-08-01T00:00:00Z", serve_until: "2026-08-31T00:00:00Z", expected_serving_endpoint_version: "${se1_v2}", fallback_strategy: "NONE" }
              as: ReliabilityEngineer
              as_user_id: "u_rel_1"
              captures: { d2_id: $.data.id }
            - call: "POST /deployments/${d2_id}/ramp"
              payload: {}
              as: ReliabilityEngineer
              as_user_id: "u_rel_1"
              captures: { s1: $.data.traffic_pct, si1: $.data.ramp_step_index }
            - call: "GET /traffic-ramp-steps"
              payload: { deployment_id: "${d1_id}" }
              as: ReliabilityEngineer
              as_user_id: "u_rel_1"
              captures: { d1_step_total: "$.data[0].delta_pct" }
          assert:
            - "ramp 1 (idx 0, nominal 5, raw 5, step 5, reserve 5, headroom 40-5-0=35): Deployment.${d1_id}.traffic_pct == 5.00 and ramp_step_index == 1 and rollout_state == 'RAMPING'"
            - "ramp 2 (idx 1, nominal 15, raw 10, headroom 40-5-5=30): traffic_pct == 15.00 and ramp_step_index == 2"
            - "ramp 3 (idx 2, nominal 35, raw 20 < MAX_STEP_DELTA_PCT 30, headroom 40-5-15=20): traffic_pct == 35.00 and ramp_step_index == 3"
            - "after ramp 3: ServingEndpoint.${se1_id}.allocated_traffic_pct == 35.00 and Deployment.${d1_id}.cumulative_ramp_delta_pct == 35.00"
            - "the three TrafficRampStep rows for ${d1_id} carry delta_pct 5.00, 10.00, 20.00 with step_index 0, 1, 2 and reason 'RAMP_STEP', ordered created_at ASC"
            - "ramp 4 (idx 3, nominal 65, raw 30, step 30, reserve 5, headroom 40-5-35=0): HTTP 409 with error_id 'ERR_ENDPOINT_CAPACITY_EXHAUSTED'"
            - "after the rejected ramp 4: traffic_pct is still 35.00, ramp_step_index is still 3, and GET /traffic-ramp-steps?deployment_id=${d1_id} still returns total_count 3 (no partial write)"
            - "the SHADOW arm on the SAME endpoint at the SAME allocated 35.00 succeeds: reserve is 0 because pattern != REALTIME, so headroom is 40-0-35 = 5 and granted_delta_pct is min(10, 5) = 5.00"
            - "Deployment.${d2_id}.traffic_pct == 5.00 and ramp_step_index == 0 — no advance, because 5.00 != the SHADOW nominal target 10"
            - "ServingEndpoint.${se1_id}.allocated_traffic_pct == 40.00 == max_traffic_pct exactly, and a further ramp of either deployment would now return ERR_ENDPOINT_CAPACITY_EXHAUSTED"
            - "flipping any ONE of the five inputs changes the answer: pattern REALTIME->SHADOW turns the 409 into +5.00, and health_state HEALTHY->DEGRADED at idx 2 would have granted floor_2(20*0.5)=10.00 landing on 25.00 with no index advance"

