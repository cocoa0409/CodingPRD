scaffold_difficulty_design:
- rule_id: dual_variant_calc
  instances:
  - name: healing_trajectory_actual_vs_projected_diverge
    grounds:
    - calculations.healing_trajectory
    - entities.OutcomeReport.fields.actual_healing_pct
    - entities.OutcomeReport.fields.projected_healing_pct
    distinguishing_aspect: On the WOUND-healing domain, the same three assessments yield actual_healing_pct == 40.0 (baseline-vs-latest) but projected_healing_pct == 60.0 (4-week extrapolation of the last-two-point trend) — different values on the same OutcomeReport.
    test_recipe:
      setup:
      - Center with one WoundClinician-backed clinician; patient IN_CARE.
      - Three wound assessments recorded at clock 2026-05-01 (5x4=20cm2 baseline), 2026-05-08 (5x3=15cm2), 2026-05-15 (4x3=12cm2).
      - Plan ACTIVE anchored on the 20cm2 baseline; closed via outcome-report.
      setup_api_calls:
      - call: POST /wound-care/centers
        payload:
          name: WC Center
        as: IntakeCoordinator
        captures:
          center_id: $.data.id
      - call: POST /wound-care/clinicians
        payload:
          name: Dr Wound
          role_kind: WOUND
          center_id: ${center_id}
        as: IntakeCoordinator
        captures:
          wc_id: $.data.id
      - call: POST /wound-care/payer-policies
        payload:
          payer_name: Acme
          requires_prior_auth: true
          max_covered_hbo_sessions: 4
          per_session_cents: 45000
          center_id: ${center_id}
        as: PayerLiaison
        captures:
          policy_id: $.data.id
      - call: POST /wound-care/patients
        payload:
          mrn: M1
          full_name: Pat One
          payer_policy_id: ${policy_id}
          center_id: ${center_id}
        as: IntakeCoordinator
        captures:
          patient_id: $.data.id
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-05-01T00:00:00Z'
          center_id: ${center_id}
        as: WoundClinician
        as_user_id: ${wc_id}
      - call: POST /wound-care/wound-assessments
        payload:
          stage: STAGE_3
          length_cm: 5
          width_cm: 4
          tissue_type: GRANULATION
          patient_id: ${patient_id}
        as: WoundClinician
        as_user_id: ${wc_id}
        captures:
          base_asm_id: $.data.id
      - call: POST /wound-care/referrals
        payload:
          source_provider: GP
          reason: chronic ulcer
          patient_id: ${patient_id}
        as: IntakeCoordinator
        captures:
          ref_id: $.data.id
      - call: POST /wound-care/referrals/${ref_id}/accept
        payload: {}
        as: IntakeCoordinator
      - call: POST /wound-care/treatment-plans
        payload:
          baseline_assessment_id: ${base_asm_id}
          debridement_supply_budget_cents: 500000
          patient_id: ${patient_id}
        as: WoundClinician
        as_user_id: ${wc_id}
        captures:
          plan_id: $.data.id
      - call: POST /wound-care/treatment-plans/${plan_id}/activate
        payload: {}
        as: WoundClinician
        as_user_id: ${wc_id}
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-05-08T00:00:00Z'
          center_id: ${center_id}
        as: WoundClinician
        as_user_id: ${wc_id}
      - call: POST /wound-care/wound-assessments
        payload:
          stage: STAGE_3
          length_cm: 5
          width_cm: 3
          tissue_type: GRANULATION
          patient_id: ${patient_id}
        as: WoundClinician
        as_user_id: ${wc_id}
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-05-15T00:00:00Z'
          center_id: ${center_id}
        as: WoundClinician
        as_user_id: ${wc_id}
      - call: POST /wound-care/wound-assessments
        payload:
          stage: STAGE_3
          length_cm: 4
          width_cm: 3
          tissue_type: GRANULATION
          patient_id: ${patient_id}
        as: WoundClinician
        as_user_id: ${wc_id}
      trigger:
      - call: POST /wound-care/treatment-plans/${plan_id}/outcome-report
        payload: {}
        as: WoundClinician
        as_user_id: ${wc_id}
        captures:
          report_id: $.data.id
      assert:
      - OutcomeReport.${report_id}.actual_healing_pct == 40.0
      - OutcomeReport.${report_id}.projected_healing_pct == 60.0
      - OutcomeReport.${report_id}.actual_healing_pct != OutcomeReport.${report_id}.projected_healing_pct
  - name: hbo_coverage_provisional_vs_finalized_diverge
    grounds:
    - calculations.hbo_coverage_cost
    - entities.TreatmentPlan.fields.provisional_hbo_covered_cents
    - entities.TreatmentPlan.fields.finalized_hbo_covered_cents
    distinguishing_aspect: On the PLAN-cost domain (distinct from healing_trajectory's wound domain), a plan with 2 SCHEDULED + 0 COMPLETED sessions shows provisional_hbo_covered_cents == 90000 while finalized_hbo_covered_cents at outcome (only COMPLETED count) == 45000 after exactly one is completed.
    test_recipe:
      setup:
      - Plan ACTIVE and COVERED (auth approved). Two HBO sessions scheduled in one chamber; one completed, one still scheduled must be cancelled before close.
      - PayerPolicy per_session_cents=45000, max_covered_hbo_sessions=4.
      setup_api_calls:
      - call: POST /wound-care/centers
        payload:
          name: WC2
        as: IntakeCoordinator
        captures:
          center_id: $.data.id
      - call: POST /wound-care/clinicians
        payload:
          name: Dr W
          role_kind: WOUND
          center_id: ${center_id}
        as: IntakeCoordinator
        captures:
          wc_id: $.data.id
      - call: POST /wound-care/clinicians
        payload:
          name: Tech H
          role_kind: HYPERBARIC
          center_id: ${center_id}
        as: IntakeCoordinator
        captures:
          ht_id: $.data.id
      - call: POST /wound-care/chambers
        payload:
          label: CH1
          turnover_buffer_minutes: 30
          center_id: ${center_id}
        as: IntakeCoordinator
        captures:
          chamber_id: $.data.id
      - call: POST /wound-care/payer-policies
        payload:
          payer_name: Acme
          max_covered_hbo_sessions: 4
          per_session_cents: 45000
          center_id: ${center_id}
        as: PayerLiaison
        captures:
          policy_id: $.data.id
      - call: POST /wound-care/patients
        payload:
          mrn: M2
          full_name: Pat Two
          payer_policy_id: ${policy_id}
          center_id: ${center_id}
        as: IntakeCoordinator
        captures:
          patient_id: $.data.id
      - call: POST /wound-care/wound-assessments
        payload:
          stage: STAGE_2
          length_cm: 3
          width_cm: 3
          tissue_type: GRANULATION
          patient_id: ${patient_id}
        as: WoundClinician
        as_user_id: ${wc_id}
        captures:
          base_asm_id: $.data.id
      - call: POST /wound-care/referrals
        payload:
          source_provider: GP
          reason: ulcer
          patient_id: ${patient_id}
        as: IntakeCoordinator
        captures:
          ref_id: $.data.id
      - call: POST /wound-care/referrals/${ref_id}/accept
        payload: {}
        as: IntakeCoordinator
      - call: POST /wound-care/treatment-plans
        payload:
          baseline_assessment_id: ${base_asm_id}
          debridement_supply_budget_cents: 500000
          patient_id: ${patient_id}
        as: WoundClinician
        as_user_id: ${wc_id}
        captures:
          plan_id: $.data.id
      - call: POST /wound-care/prior-authorizations
        payload:
          requested_hbo_sessions: 4
          clinical_justification: hypoxic wound
          treatment_plan_id: ${plan_id}
        as: PayerLiaison
        captures:
          auth_id: $.data.id
      - call: POST /wound-care/prior-authorizations/${auth_id}/approve
        payload: {}
        as: PayerLiaison
      - call: POST /wound-care/treatment-plans/${plan_id}/activate
        payload: {}
        as: WoundClinician
        as_user_id: ${wc_id}
      - call: GET /wound-care/treatment-plans/${plan_id}
        payload: {}
        as: WoundClinician
        as_user_id: ${wc_id}
        captures:
          plan_v: $.data.version
      - call: POST /wound-care/hbo-sessions
        payload:
          chamber_id: ${chamber_id}
          window_start: '2026-05-02T09:00:00Z'
          window_end: '2026-05-02T10:00:00Z'
          treatment_pressure_ata: 2.4
          expected_plan_version: ${plan_v}
          treatment_plan_id: ${plan_id}
        as: HyperbaricTech
        as_user_id: ${ht_id}
        captures:
          sess1_id: $.data.id
      - call: GET /wound-care/treatment-plans/${plan_id}
        payload: {}
        as: HyperbaricTech
        as_user_id: ${ht_id}
        captures:
          plan_v2: $.data.version
      - call: POST /wound-care/hbo-sessions
        payload:
          chamber_id: ${chamber_id}
          window_start: '2026-05-02T11:00:00Z'
          window_end: '2026-05-02T12:00:00Z'
          treatment_pressure_ata: 2.4
          expected_plan_version: ${plan_v2}
          treatment_plan_id: ${plan_id}
        as: HyperbaricTech
        as_user_id: ${ht_id}
        captures:
          sess2_id: $.data.id
      - call: POST /wound-care/hbo-sessions/${sess1_id}/complete
        payload:
          dive_log_entries:
          - minute: 0
            spo2: 98
            hr: 72
        as: HyperbaricTech
        as_user_id: ${ht_id}
      trigger:
      - call: POST /wound-care/hbo-sessions/${sess2_id}/cancel
        payload: {}
        as: HyperbaricTech
        as_user_id: ${ht_id}
      - call: POST /wound-care/treatment-plans/${plan_id}/outcome-report
        payload: {}
        as: WoundClinician
        as_user_id: ${wc_id}
        captures:
          report_id: $.data.id
      assert:
      - TreatmentPlan.${plan_id}.provisional_hbo_covered_cents == 45000
      - OutcomeReport.${report_id}.finalized_hbo_covered_cents == 45000
      - TreatmentPlan.${plan_id}.finalized_hbo_covered_cents == 45000
- rule_id: combinatorial_formula
  instances:
  - name: severity_score_tiered_nonlinear
    grounds:
    - calculations.wound_severity_score
    - entities.WoundAssessment.fields.severity_score
    distinguishing_aspect: 'Mode (a): severity_score = min(100, max(1, round(stage_points * area_tier_mult + infection_bonus + tissue_bonus))) with 4 interacting inputs; STAGE_3 5x4 (area 20 -> 2.0x) infected NECROTIC yields 4*2.0 + 5 + 4 == 17.'
    test_recipe:
      setup:
      - Patient in a center; assessment recorded with STAGE_3, 5x4 cm, infected, NECROTIC tissue.
      setup_api_calls:
      - call: POST /wound-care/centers
        payload:
          name: WC3
        as: IntakeCoordinator
        captures:
          center_id: $.data.id
      - call: POST /wound-care/clinicians
        payload:
          name: Dr W
          role_kind: WOUND
          center_id: ${center_id}
        as: IntakeCoordinator
        captures:
          wc_id: $.data.id
      - call: POST /wound-care/payer-policies
        payload:
          payer_name: Acme
          max_covered_hbo_sessions: 4
          per_session_cents: 45000
          center_id: ${center_id}
        as: PayerLiaison
        captures:
          policy_id: $.data.id
      - call: POST /wound-care/patients
        payload:
          mrn: M3
          full_name: Pat 3
          payer_policy_id: ${policy_id}
          center_id: ${center_id}
        as: IntakeCoordinator
        captures:
          patient_id: $.data.id
      trigger:
      - call: POST /wound-care/wound-assessments
        payload:
          stage: STAGE_3
          length_cm: 5
          width_cm: 4
          tissue_type: NECROTIC
          infected: true
          patient_id: ${patient_id}
        as: WoundClinician
        as_user_id: ${wc_id}
        captures:
          asm_id: $.data.id
      assert:
      - WoundAssessment.${asm_id}.area_cm2 == 20.0
      - WoundAssessment.${asm_id}.severity_score == 17
  - name: supply_reimbursement_round_per_line_then_sum
    grounds:
    - calculations.supply_reimbursement
    - entities.SupplyOrder.fields.covered_cents
    distinguishing_aspect: 'Mode (b): three line items each 101c * 1 * 0.5 == 50.5c round to 51c per line -> sum 153; the sum-then-round order (151.5 -> 152) is explicitly rejected, so covered_cents == 153.'
    test_recipe:
      setup:
      - Plan ACTIVE (coverage irrelevant to submit); supply order with three lines each (101,1,0.5).
      setup_api_calls:
      - call: POST /wound-care/centers
        payload:
          name: WC4
        as: IntakeCoordinator
        captures:
          center_id: $.data.id
      - call: POST /wound-care/clinicians
        payload:
          name: Dr W
          role_kind: WOUND
          center_id: ${center_id}
        as: IntakeCoordinator
        captures:
          wc_id: $.data.id
      - call: POST /wound-care/payer-policies
        payload:
          payer_name: Acme
          max_covered_hbo_sessions: 4
          per_session_cents: 45000
          center_id: ${center_id}
        as: PayerLiaison
        captures:
          policy_id: $.data.id
      - call: POST /wound-care/patients
        payload:
          mrn: M4
          full_name: Pat 4
          payer_policy_id: ${policy_id}
          center_id: ${center_id}
        as: IntakeCoordinator
        captures:
          patient_id: $.data.id
      - call: POST /wound-care/wound-assessments
        payload:
          stage: STAGE_2
          length_cm: 2
          width_cm: 2
          tissue_type: GRANULATION
          patient_id: ${patient_id}
        as: WoundClinician
        as_user_id: ${wc_id}
        captures:
          base_asm_id: $.data.id
      - call: POST /wound-care/referrals
        payload:
          source_provider: GP
          reason: ulcer
          patient_id: ${patient_id}
        as: IntakeCoordinator
        captures:
          ref_id: $.data.id
      - call: POST /wound-care/referrals/${ref_id}/accept
        payload: {}
        as: IntakeCoordinator
      - call: POST /wound-care/treatment-plans
        payload:
          baseline_assessment_id: ${base_asm_id}
          debridement_supply_budget_cents: 500000
          patient_id: ${patient_id}
        as: WoundClinician
        as_user_id: ${wc_id}
        captures:
          plan_id: $.data.id
      - call: POST /wound-care/treatment-plans/${plan_id}/activate
        payload: {}
        as: WoundClinician
        as_user_id: ${wc_id}
      - call: GET /wound-care/treatment-plans/${plan_id}
        payload: {}
        as: WoundClinician
        as_user_id: ${wc_id}
        captures:
          plan_v: $.data.version
      trigger:
      - call: POST /wound-care/supply-orders
        payload:
          supply_kind: ADVANCED_DRESSING
          line_items:
          - unit_price_cents: 101
            qty: 1
            coverage_rate: 0.5
          - unit_price_cents: 101
            qty: 1
            coverage_rate: 0.5
          - unit_price_cents: 101
            qty: 1
            coverage_rate: 0.5
          expected_plan_version: ${plan_v}
          treatment_plan_id: ${plan_id}
        as: WoundClinician
        as_user_id: ${wc_id}
        captures:
          order_id: $.data.id
      assert:
      - SupplyOrder.${order_id}.covered_cents == 153
      - TreatmentPlan.${plan_id}.provisional_covered_cents == 153
- rule_id: non_linear_state_machine
  instances:
  - name: prior_auth_resubmission_cycle
    grounds:
    - state_machines.PriorAuthorization.SUBMITTED_to_ADDITIONAL_INFO_REQUESTED
    - state_machines.PriorAuthorization.ADDITIONAL_INFO_REQUESTED_to_SUBMITTED
    distinguishing_aspect: PriorAuthorization cycles SUBMITTED -> ADDITIONAL_INFO_REQUESTED -> SUBMITTED and can then be APPROVED; the same auth id revisits SUBMITTED (cyclic shape) — distinct entity from TreatmentPlan's suspend/resume cycle.
    test_recipe:
      setup:
      - Plan DRAFT with one SUBMITTED prior authorization.
      setup_api_calls:
      - call: POST /wound-care/centers
        payload:
          name: WC5
        as: IntakeCoordinator
        captures:
          center_id: $.data.id
      - call: POST /wound-care/clinicians
