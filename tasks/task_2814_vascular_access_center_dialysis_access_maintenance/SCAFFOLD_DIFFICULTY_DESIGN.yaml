      - name: maturation_day_forty_two_and_flow_six_hundred_are_inclusive_boundaries
        grounds:
          - calculations.maturation_readiness
          - state_machines.AccessConversionPlan.ACTIVE_to_MATURATION_HOLD
          - state_machines.AccessConversionPlan.MATURATION_HOLD_to_ACTIVE
          - entities.AccessConversionPlan.fields.readiness_failure_reasons
          - entities.AccessConversionPlan.fields.days_since_placement
        distinguishing_aspect: |
          Three checks on ONE plan isolate two different inclusive thresholds with everything else
          held constant. At a clock of 2026-07-31 an AVF placed 2026-06-20 is 41 days old and fails
          with readiness_failure_reasons ['MATURATION_DAYS'] even though diameter 6.0, flow 600 and
          depth 6.0 are all exactly at their limits and therefore pass. Advancing the clock one day
          to 2026-08-01 makes it 42 days and the identical payload passes. A third check at flow
          599 then fails with ['FLOW'] alone. Both boundaries are day-and-unit exact, and
          maturation_check_count reaches 3 because each check counts regardless of outcome.
        test_recipe:
          setup:
            - "one patient with a TUNNELED_CATHETER in IN_USE and an AVF placed on 2026-06-20 in MATURING"
            - "two surveillance readings on the AVF so the SURVEILLANCE_COUNT criterion never fails"
            - "one ACTIVE conversion plan CATH -> AVF"
            - "the logical clock moved back to 2026-07-31T12:00:00Z before the first check"
          setup_api_calls:
            - call: "POST /dialysis-facilities"
              payload: { name: "Southbay Dialysis", facility_code: "SBY-01" }
              as: CenterAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /patients"
              payload: { mrn: "MRN-0013", full_name: "Moe Anand", dialysis_facility_id: "${fac_id}", dialysis_modality: "IN_CENTER_HD", payer_program: "FEE_FOR_SERVICE" }
