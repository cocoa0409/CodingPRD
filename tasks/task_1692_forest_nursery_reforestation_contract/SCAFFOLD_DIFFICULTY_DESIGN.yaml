            - { call: "GET /reforestation/storage-units/${unit_id}", payload: {}, as: NurseryManager, captures: { load_1: $.data.current_load } }
            - { call: "POST /reforestation/storage-placements", payload: { crop_batch_id: "${b_id}", storage_unit_id: "${unit_id}", quantity: 5000, placed_on: "2027-03-12" }, as: NurseryManager, captures: { p2: $.data.id } }
