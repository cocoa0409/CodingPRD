# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Fresh Dough Facility Routing & Bakery-Cafe Replenishment
# =============================================================================
# Canonical seeded fixture used by many instances (all times UTC; logical clock
# default 2026-09-01T00:00:00Z):
#   Facility F1 eff-cap 2000; CXL conv cutoff 13:00 flat $4.00 no-sub;
#   BMT artisan cutoff 18:00 flat $5.00 no-sub.
#   Cafes: C1 FRANCHISE limit 90000; C2 COMPANY 200000; C3 COMPANY 90000;
#          C4 FRANCHISE 200000; C5 FRANCHISE 100000.
# =============================================================================

scaffold_difficulty_design:
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: transfer_pricing_provisional_vs_final_on_short_shipment
        grounds:
          - calculations.transfer_pricing
          - entities.CafeOrder.fields.billing_status
          - state_machines.CafeOrder.ROUTED_to_SHIPPED_SHORT
        distinguishing_aspect: |
          transfer_pricing runs on the CafeOrder domain: the provisional_at_submit
          variant projects the credit-check from requested quantity while the
          final_at_close variant bills actual_quantity after a no-substitution
          shortage — identical inputs, two valid algorithms, different cents.
        test_recipe:
          setup:
            - "F1 (eff cap 2000), CXL (conv, cutoff 13:00, $4.00, no-sub), BMT exist"
            - "C1 FRANCHISE limit 90000 has one LOCKED CXL order qty 100 for 2026-09-10"
            - "Plan P for 2026-09-10 has locked, released; route R1 (PUBLISHED) carries stop S1 for C1 with planned_units 100"
            - "clock at 2026-09-10T03:10:00Z (inside S1's 03:00-04:00 window)"
          setup_api_calls:
            - call: "POST /dough-ops/facilities"
              payload: { name: "F1", effective_capacity_units: 2000 }
              as: FacilityPlanner
              captures: { f1_id: $.data.id }
            - call: "POST /dough-ops/dough-types"
              payload: { code: "CXL", category: "CONVENTIONAL", shelf_life_hours: 36, order_cutoff_local: "13:00", substitution_allowed: false, flat_transfer_price: 4.00 }
              as: FacilityPlanner
              captures: { cxl_id: $.data.id }
            - call: "POST /dough-ops/cafes"
              payload: { name: "C1", facility_id: "${f1_id}", ownership_type: "FRANCHISE", credit_limit_cents: 90000 }
              as: FacilityPlanner
              captures: { c1_id: $.data.id, c1_v0: $.data.version }
            - call: "POST /dough-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-09T10:00:00Z" }
              as: FacilityPlanner
            - call: "POST /dough-ops/cafe-orders"
              payload: { cafe_id: "${c1_id}", dough_type_id: "${cxl_id}", production_date: "2026-09-10", quantity: 100, expected_cafe_version: "${c1_v0}" }
              as: CafeManager
              as_user_id: "${c1_id}"
              captures: { o1_id: $.data.id }
            - call: "POST /dough-ops/cafe-orders/${o1_id}/submit"
              payload: {}
              as: CafeManager
              as_user_id: "${c1_id}"
            - call: "POST /dough-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-09T13:00:00Z" }
              as: FacilityPlanner
            - call: "POST /dough-ops/facilities/${f1_id}/production-plans"
              payload: { production_date: "2026-09-10" }
              as: FacilityPlanner
              captures: { p1_id: $.data.id, f1_v1: $.data.version }
            - call: "POST /dough-ops/facilities/${f1_id}/production-plans/${p1_id}/lock"
              payload: {}
              as: FacilityPlanner
            - call: "GET /dough-ops/facilities/${f1_id}"
              payload: {}
              as: FacilityPlanner
              captures: { f1_v_pre_rel: $.data.version }
            - call: "POST /dough-ops/facilities/${f1_id}/production-plans/${p1_id}/release"
              payload: { expected_facility_version: "${f1_v_pre_rel}" }
              as: FacilityPlanner
            - call: "POST /dough-ops/facilities/${f1_id}/routes"
              payload: { production_date: "2026-09-10", vehicle_capacity_units: 600 }
              as: RouteDispatcher
              captures: { r1_id: $.data.id }
            - call: "POST /dough-ops/facilities/${f1_id}/routes/${r1_id}/stops"
              payload: { seq: 1, cafe_id: "${c1_id}", planned_arrival: "2026-09-10T03:10:00Z", window_start_local: "03:00", window_end_local: "04:00", planned_units: 100 }
              as: RouteDispatcher
              captures: { s1_id: $.data.id }
            - call: "POST /dough-ops/facilities/${f1_id}/routes/${r1_id}/publish"
              payload: {}
              as: RouteDispatcher
            - call: "POST /dough-ops/facilities/${f1_id}/routes/${r1_id}/depart"
              payload: {}
              as: RouteDispatcher
            - call: "POST /dough-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T03:10:00Z" }
              as: FacilityPlanner
            - call: "POST /dough-ops/facilities/${f1_id}/routes/${r1_id}/stops/${s1_id}/arrive"
              payload: { loaded_units: 70 }
              as: RouteDispatcher
            - call: "POST /dough-ops/facilities/${f1_id}/production-plans/${p1_id}/close"
              payload: {}
              as: FacilityPlanner
            - call: "GET /dough-ops/cafe-orders/${o1_id}"
              payload: {}
              as: FacilityPlanner
              captures: { o1_billing: $.data.billing_status }
            - call: "GET /dough-ops/cafes/${c1_id}"
              payload: {}
              as: FacilityPlanner
              captures: { c1_balance: $.data.credit_balance_cents }
          trigger:
            - call: "GET /dough-ops/cafes/${c1_id}"
              payload: {}
              as: FacilityPlanner
          assert:
            - "CafeOrder.${o1_id}.status == SHIPPED_SHORT"
            - "CafeOrder.${o1_id}.actual_quantity == 70"
            - "CafeOrder.${o1_id}.billing_status == INVOICED"
            - "Cafe.${c1_id}.credit_balance_cents == 31360   # final variant: 70 x 4.48"
            - "Cafe.${c1_id}.credit_balance_cents == ${c1_balance}"
            - "provisional variant projected 100 x 4.48 = 44800 cents at submit; final bills 31360 — the two variants diverge on identical order data"

      - name: overhead_allocation_franchise_vs_company_unit_denominator
        grounds:
          - calculations.overhead_allocation
          - calculations.transfer_pricing
          - entities.SettlementLine.fields.cafe_total_units
        distinguishing_aspect: |
          overhead_allocation runs on the SettlementLine domain: same ledger data
          yields a different unit_allocated_cost because FRANCHISE divides by ALL
          delivered units while COMPANY divides by ARTISAN units only — a
          dual-variant on a different entity domain from transfer_pricing.
        test_recipe:
          setup:
            - "Plan2 (production_date 2026-09-11) delivered C1 180 CXL, C2 240 CXL, C4 100 CXL, C5 150 CXL + 60 BMT, C3 50 BMT; plan closed so all orders INVOICED"
