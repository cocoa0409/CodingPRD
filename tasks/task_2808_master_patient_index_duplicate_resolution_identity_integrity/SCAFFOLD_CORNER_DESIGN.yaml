        distinguishing_aspect: "The remediation is opened on a strict greater-than: an overlay touching exactly CONTAMINATION_REVIEW_ELEMENT_THRESHOLD (25) elements opens none while one touching 26 opens exactly one with element_count_subject 26, and only the second record can be blocked from the exchange."
