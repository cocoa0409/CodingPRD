  # ===========================================================================
  - section: cross_cutting_layers
    instances:
      - name: stale_corporation_version_on_adopt_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[bylaws-adopt-stale-corporation]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC on Corporation.version: adopting B1 moves the corporation to version 2; a second adoption still carrying expected version 1 is rejected 412, and B1 remains the adopted bylaws."
        test_recipe:
          setup: ["Corporation (version 1) with two DRAFT bylaws B1 B2"]
          setup_api_calls:
            - call: "POST /corporations"
              payload: { name: "Corp OCC1", incorporation_state: "DE" }
              as: CorporateSecretary
              captures: { corp: $.data.id, corpv1: $.data.version }
            - call: "POST /bylaws"
              payload: { corporation_id: "${corp}", notice_days_regular: 10, notice_days_special: 3, package_lead_days: 5, quorum_percent: 60, quorum_fixed_count: 1, consent_window_days: 10, consent_unanimity_required: true, minute_retention_years: 5, rotation_max_years: 6, board_seat_count: 15 }
              as: CorporateSecretary
              captures: { b1: $.data.id }
            - call: "POST /bylaws"
              payload: { corporation_id: "${corp}", notice_days_regular: 12, notice_days_special: 4, package_lead_days: 6, quorum_percent: 50, quorum_fixed_count: 2, consent_window_days: 14, consent_unanimity_required: false, minute_retention_years: 7, rotation_max_years: 4, board_seat_count: 9 }
              as: CorporateSecretary
              captures: { b2: $.data.id }
          trigger:
            - call: "POST /bylaws/${b1}/adopt"
              payload: { expected_corporation_version: "${corpv1}" }
              as: CorporateSecretary
            - call: "POST /bylaws/${b2}/adopt"
              payload: { expected_corporation_version: "${corpv1}" }
              as: CorporateSecretary
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_STALE_VERSION and http status 412   # ${corpv1} went stale when B1's adoption bumped the corporation"
            - "Bylaws.${b1}.status == ADOPTED and Bylaws.${b2}.status == DRAFT"
            - "Corporation.${corp}.version == 2 and current_bylaws_id == ${b1}"

      - name: stale_meeting_version_on_reschedule_rejected
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[meeting-reschedule-stale-version]", "errors[ERR_STALE_MEETING_VERSION]"]
        distinguishing_aspect: "OCC on Meeting.version: send_notices bumps the meeting's version, so a reschedule carrying the pre-notice version fails 412; re-reading and rescheduling with the fresh version succeeds and deletes the issued notices."
        test_recipe:
          setup: ["Corporation, ADOPTED bylaws, 1 ACTIVE director (chair); meeting SCHEDULED then NOTICED (version advanced)"]
          setup_api_calls:
            - call: "POST /corporations"
              payload: { name: "Corp OCC2", incorporation_state: "DE" }
              as: CorporateSecretary
              captures: { corp: $.data.id, corpv: $.data.version }
            - call: "POST /bylaws"
              payload: { corporation_id: "${corp}", notice_days_regular: 10, notice_days_special: 3, package_lead_days: 5, quorum_percent: 60, quorum_fixed_count: 1, consent_window_days: 10, consent_unanimity_required: true, minute_retention_years: 5, rotation_max_years: 6, board_seat_count: 15 }
              as: CorporateSecretary
              captures: { by: $.data.id }
            - call: "POST /bylaws/${by}/adopt"
              payload: { expected_corporation_version: "${corpv}" }
              as: CorporateSecretary
            - call: "POST /directors"
              payload: { corporation_id: "${corp}", full_name: "D1", email: "d1@x.com", term_start: "2026-01-01T00:00:00Z", term_end: "2029-01-01T00:00:00Z" }
              as: CorporateSecretary
              captures: { d1: $.data.id }
            - call: "POST /meetings"
              payload: { corporation_id: "${corp}", meeting_type: "REGULAR", scheduled_start: "2026-06-20T10:00:00Z", duration_minutes: 60, location_or_medium: "Boardroom", chair_director_id: "${d1}" }
              as: CorporateSecretary
              captures: { m: $.data.id, mv1: $.data.version }
            - call: "POST /meetings/${m}/send_notices"
              as: CorporateSecretary
            - call: "GET /meetings/${m}"
              as: CorporateSecretary
              captures: { mv2: $.data.version }
          trigger:
            - call: "POST /meetings/${m}/reschedule"
              payload: { scheduled_start: "2026-07-01T10:00:00Z", duration_minutes: 90, expected_meeting_version: "${mv1}" }
              as: CorporateSecretary
              captures: { err: $.data.error_id }
            - call: "POST /meetings/${m}/reschedule"
              payload: { scheduled_start: "2026-07-01T10:00:00Z", duration_minutes: 90, expected_meeting_version: "${mv2}" }
              as: CorporateSecretary
          assert:
            - "err == ERR_STALE_MEETING_VERSION and http status 412"
            - "Meeting.${m}.status == SCHEDULED   # reverted from NOTICED by the successful reschedule"
            - "Meeting.${m}.scheduled_start == 2026-07-01T10:00:00Z and duration_minutes == 90"
            - "GET /meeting_notices?meeting_id=${m} total_count == 0   # issued notices deleted"

      - name: checkpoint_expires_director_terms_cascade
        claim_type: ops_run_checkpoint
        grounds: [state_machines.Director.ACTIVE_to_TERM_EXPIRED, "endpoints[POST /corporations/{id}/run_checkpoint]"]
        distinguishing_aspect: "Ops-run epoch advance: only directors whose term_end is strictly past get TERM_EXPIRED (cascade to memberships with DIRECTOR_TERM_EXPIRED); long-termed directors are untouched."
        test_recipe:
          setup: ["Corporation, ADOPTED bylaws; D1 term ends 2026-06-01T00:00:00Z and holds a committee membership; D2 term runs to 2029; clock advanced to 2026-06-02T00:00:00Z"]
          setup_api_calls:
            - call: "POST /corporations"
              payload: { name: "Corp OPS1", incorporation_state: "DE" }
              as: CorporateSecretary
              captures: { corp: $.data.id, corpv: $.data.version }
            - call: "POST /bylaws"
              payload: { corporation_id: "${corp}", notice_days_regular: 10, notice_days_special: 3, package_lead_days: 5, quorum_percent: 60, quorum_fixed_count: 1, consent_window_days: 10, consent_unanimity_required: true, minute_retention_years: 5, rotation_max_years: 6, board_seat_count: 15 }
              as: CorporateSecretary
              captures: { by: $.data.id }
            - call: "POST /bylaws/${by}/adopt"
              payload: { expected_corporation_version: "${corpv}" }
              as: CorporateSecretary
            - call: "POST /directors"
              payload: { corporation_id: "${corp}", full_name: "D1", email: "d1@x.com", term_start: "2025-01-01T00:00:00Z", term_end: "2026-06-01T00:00:00Z" }
              as: CorporateSecretary
              captures: { d1: $.data.id }
            - call: "POST /directors"
              payload: { corporation_id: "${corp}", full_name: "D2", email: "d2@x.com", term_start: "2026-01-01T00:00:00Z", term_end: "2029-01-01T00:00:00Z" }
              as: CorporateSecretary
              captures: { d2: $.data.id }
            - call: "POST /committees"
              payload: { corporation_id: "${corp}", name: "C", committee_type: "SPECIAL", charter_text: "c", quorum_fixed_count: 1 }
              as: CorporateSecretary
              captures: { cm: $.data.id }
            - call: "POST /committees/${cm}/activate"
              as: CorporateSecretary
            - call: "POST /committee_memberships"
              payload: { committee_id: "${cm}", director_id: "${d1}", committee_role: "MEMBER", term_start: "2025-02-01T00:00:00Z", term_end: "2026-06-01T00:00:00Z" }
              as: CorporateSecretary
              captures: { mb1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-02T00:00:00Z" }
              as: CorporateSecretary
          trigger:
            - call: "POST /corporations/${corp}/run_checkpoint"
              as: CorporateSecretary
              captures: { sweep: $.data.expired_director_ids }
          assert:
            - "sweep contains ${d1} and does not contain ${d2}"
            - "Director.${d1}.status == TERM_EXPIRED and Director.${d2}.status == ACTIVE"
            - "CommitteeMembership.${mb1}.status == ENDED and ended_reason == DIRECTOR_TERM_EXPIRED"
            - "Corporation.${corp}.active_director_count == 1"

      - name: checkpoint_lapses_under_signed_consent
        claim_type: ops_run_checkpoint
        grounds: [state_machines.Resolution.CIRCULATING_to_CONSENT_LAPSED, calculations.consent_required_count]
        distinguishing_aspect: "Deadline sweep: a CIRCULATING consent 1 signature short of required lapses at checkpoint once the clock passes consent_deadline_at."
        test_recipe:
          setup: ["Corporation, ADOPTED bylaws (unanimous consent, window 10d), 3 ACTIVE directors; resolution CIRCULATING since 2026-05-01 (deadline 2026-05-11T00:00:00Z, required 3) with only D1 signed"]
          setup_api_calls:
