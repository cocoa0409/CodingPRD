          assert:
            - "ReturnLabel.${lbl1}.valid_until == \"2026-09-15T00:00:00Z\" and Shipment.${shp_a}.tendered_at == \"2026-09-15T00:00:00Z\" (activation exactly at valid_until is allowed)"
            - "${e_expired} == \"ERR_LABEL_EXPIRED\" with HTTP status == 422"
            - "ReturnLabel.${lbl2}.status == \"PRINTED\" and GET /sharps/shipments?return_label_id=${lbl2} returns total_count == 0"
            - "NonConformanceEvent.${ev_a}.notification_deadline_at == \"2026-09-18T00:00:01Z\" (created_at 2026-09-15T00:00:01Z plus 72 hours)"
            - "the ${ev_a} notification returns HTTP 200 with status == \"CUSTOMER_NOTIFIED\", notified_at == \"2026-09-18T00:00:01Z\" and notification_channel == \"EMAIL\""
            - "${e_deadline} == \"ERR_NOTIFICATION_DEADLINE_PASSED\" with HTTP status == 422"
            - "NonConformanceEvent.${ev_b}.status == \"OPEN\", notified_at == null and notification_channel == null"
            - "Patient.${pat_d}.screening_risk_score == 30 (two fresh MISSING_ABSORBENT events at weight 15) and Patient.${pat_d}.status == \"ENROLLED\""
            - "TreatmentFacility.${fac}.pending_intake_units == 120"
            - "Kit.${kit2}.status == \"SEALED\" (the expired label left the kit untouched)"

      # ---- corners the §1.8 difficulty design already owns -----------------
      - name: state_prohibition_outranks_packaging_and_routing_checks
        claim_type: priority_ordering
        grounds:
          - validations[priority 14].business_safety
          - validations[priority 22].business_constraint
          - errors[ERR_STATE_MAILBACK_PROHIBITED]
        distinguishing_aspect: "An activation that is simultaneously state-prohibited and packaging-illegal reports the safety error, never the constraint error."
        excluded_because:
          difficulty_instance: safety_beats_constraint_on_label_activation_for_prohibited_state
          rationale: "That §1.8 priority-pair instance violates both rules in one request and asserts the safety-band error_id together with the untouched label."

      - name: paused_enrollment_state_check_outranks_the_funding_check_on_kit_issuance
        claim_type: priority_ordering
        grounds:
          - validations[priority 6].state
          - validations[priority 35].business_fiscal
          - errors[ERR_INVALID_ENROLLMENT_STATE]
        distinguishing_aspect: "A kit issuance against a PAUSED enrollment on an exhausted program returns the state error, not the funding error."
        excluded_because:
          difficulty_instance: state_beats_fiscal_on_kit_issuance_for_paused_enrollment
          rationale: "The §1.8 priority-pair instance sets up both violations at once and asserts the state-band error plus an unchanged ledger."

      - name: aggregate_intake_capacity_validation
        claim_type: aggregate_validation
        grounds:
          - validations[priority 25].business_constraint
          - errors[ERR_FACILITY_INTAKE_CAPACITY_EXCEEDED]
        distinguishing_aspect: "Each parcel is individually within capacity; only their sum on one intake date breaches it."
        excluded_because:
          difficulty_instance: facility_daily_intake_capacity_exceeded_by_aggregate_units_on_same_intake_date
          rationale: "The §1.8 resource-temporal-overlap instance already asserts the aggregate rejection and the untouched pending_intake_units."

      - name: cross_entity_facility_suspension_validation
        claim_type: cross_entity_validation
        grounds:
          - validations[priority 23].business_constraint
          - errors[ERR_INVALID_FACILITY_STATE]
        distinguishing_aspect: "Validity of a destruction certificate depends on another entity's status; both the suspended-blocked and reinstated-allowed sides are needed."
        excluded_because:
          difficulty_instance: certificate_issuance_blocked_when_treatment_facility_suspended
          rationale: "The §1.8 cross-entity-state-dependency instance covers both sides of the gate in one chain."

  # ===========================================================================
  # §1.5 ENDPOINTS
  # ===========================================================================
  - section: endpoints
    instances:
      - name: program_read_reconciles_every_derived_counter_against_the_ledger
        claim_type: computed_read
        grounds:
          - endpoints.GET /sharps/programs/{id}
          - endpoints.GET /sharps/ledger-entries
          - entities.SponsorshipProgram.fields.kits_issued_count
          - entities.SponsorshipProgram.fields.kits_settled_count
          - entities.SponsorshipProgram.fields.provisional_total_cents
          - entities.SponsorshipProgram.fields.final_total_cents
        distinguishing_aspect: "After one settled kit and one voided kit the read must show SIX independently derived numbers at once — reserved 0, committed 1676, available 498324, kits_issued_count 1 (the VOIDED kit is excluded), kits_settled_count 1, provisional_total 1465 and final_total 1676 — and every one of them must reconcile with the five ledger rows."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; CA rule; spec MB-USPS; facility \"CA-TF-0001\" capacity 200."
            - "MANUFACTURER sponsor, program 500000 / 5000; patient Dana ENROLLED; enrollment ACTIVE, cadence 30, 3 kits authorized."
            - "Kit 1 (ONE_QUART, provisional 1465) runs the whole route: acknowledged, sealed at 60 units / 1200 g, labelled, tendered for intake 2026-08-05, delivered, screened CONFORMING by tech-77, and certified destroyed by officer-12 for a final settlement of 1676 cents."
            - "Kit 2 is then issued (another 1465 reserved) and administratively voided."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /sharps/state-rules"
              payload: { state_code: "CA", household_sharps_classification: "HOUSEHOLD_EXEMPT", mail_back_permitted: true, max_container_volume_liters: 30.3, certificate_retention_years: 3 }
              as: ProgramAdmin
              captures: { sr_ca: $.data.id }
            - call: "POST /sharps/packaging-specs"
              payload: { spec_code: "MB-USPS", un_specification_code: "UN 4G/X7.5/S/26", postal_service: "USPS_PARCEL_SELECT_MAILBACK", hazard_class: "UN3291_SHARPS_ONLY", max_gross_weight_grams: 8000, allowed_container_sizes: [ONE_QUART, TWO_GALLON] }
              as: ProgramAdmin
              captures: { spec: $.data.id }
            - call: "POST /sharps/treatment-facilities"
              payload: { name: "Bay Area Sharps Treatment", state_rule_id: "${sr_ca}", permit_number: "CA-TF-0001", accepted_hazard_classes: [UN3291_SHARPS_ONLY], daily_intake_capacity_units: 200 }
              as: ProgramAdmin
              captures: { fac: $.data.id }
            - call: "POST /sharps/sponsors"
              payload: { legal_name: "Northwind Devices Inc", sponsor_type: "MANUFACTURER", contact_email: "programs@northwind.example" }
              as: ProgramAdmin
              captures: { sp_nw: $.data.id }
            - call: "POST /sharps/sponsors/${sp_nw}/programs"
              payload: { program_code: "NW-2026", funding_ceiling_cents: 500000, per_kit_allowance_cents: 5000 }
              as: ProgramAdmin
              captures: { prog: $.data.id }
            - call: "POST /sharps/patients"
              payload: { full_name: "Dana Reyes", state_rule_id: "${sr_ca}", therapy_type: "INSULIN_PEN_NEEDLES", weekly_sharps_count: 20, contact_email: "dana@example.com" }
              as: ProgramAdmin
              captures: { pat_d: $.data.id }
            - call: "POST /sharps/patients/${pat_d}/eligibility-review"
              payload: { decision: "APPROVE" }
              as: ProgramAdmin
            - call: "POST /sharps/enrollments"
              payload: { patient_id: "${pat_d}", sponsorship_program_id: "${prog}", cadence_days: 30, kits_authorized: 3 }
              as: ProgramAdmin
              captures: { enr: $.data.id }
            - call: "POST /sharps/enrollments/${enr}/submit"
              payload: {}
              as: ProgramAdmin
            - call: "POST /sharps/enrollments/${enr}/sponsor-decision"
              payload: { decision: "APPROVE" }
              as: SponsorRepresentative
              as_user_id: "${sp_nw}"
              captures: { enr_v1: $.data.version }
            - call: "POST /sharps/enrollments/${enr}/kits"
              payload: { expected_enrollment_version: "${enr_v1}" }
              as: ProgramAdmin
              captures: { kit1: $.data.id }
            - call: "POST /sharps/kits/${kit1}/acknowledge-receipt"
              payload: {}
              as: ProgramAdmin
            - call: "POST /sharps/kits/${kit1}/seal"
              payload: { fill_units: 60, sealed_gross_weight_grams: 1200 }
              as: ProgramAdmin
            - call: "POST /sharps/kits/${kit1}/return-labels"
              payload: { packaging_spec_id: "${spec}" }
              as: LogisticsCoordinator
              captures: { lbl1: $.data.id }
            - call: "POST /sharps/return-labels/${lbl1}/activate"
              payload: { treatment_facility_id: "${fac}", scheduled_intake_date: "2026-08-05", declared_gross_weight_grams: 1200 }
              as: LogisticsCoordinator
              captures: { shp1: $.data.id }
            - call: "POST /sharps/shipments/${shp1}/transport-events"
              payload: { event_type: "IN_TRANSIT" }
              as: LogisticsCoordinator
            - call: "POST /sharps/shipments/${shp1}/transport-events"
              payload: { event_type: "DELIVERED" }
              as: LogisticsCoordinator
            - call: "POST /sharps/shipments/${shp1}/conformance-screening"
              payload: { outcome: "CONFORMING", observed_gross_weight_grams: 1200 }
              as: IntakeTechnician
              as_user_id: "tech-77"
            - call: "POST /sharps/shipments/${shp1}/destruction-certificates"
              payload: { destroyed_units: 60 }
              as: DestructionOfficer
              as_user_id: "officer-12"
              captures: { cert1: $.data.id }
            - call: "GET /sharps/enrollments/${enr}"
              payload: {}
              as: ProgramAdmin
              captures: { enr_v2: $.data.version }
            - call: "POST /sharps/enrollments/${enr}/kits"
              payload: { expected_enrollment_version: "${enr_v2}" }
              as: ProgramAdmin
              captures: { kit2: $.data.id }
            - call: "POST /sharps/kits/${kit2}/void"
              payload: { void_reason: "wrong shipping address on the outer box" }
              as: LogisticsCoordinator
          trigger:
            - call: "GET /sharps/programs/${prog}"
              payload: {}
              as: SponsorRepresentative
              as_user_id: "${sp_nw}"
              captures: { prog_v: $.data.version }
          assert:
            - "HTTP status == 200"
            - "SponsorshipProgram.${prog}.reserved_cents == 0"
            - "SponsorshipProgram.${prog}.committed_cents == 1676"
            - "SponsorshipProgram.${prog}.available_cents == 498324"
            - "SponsorshipProgram.${prog}.kits_issued_count == 1 (kit 2 is VOIDED and drops out; kit 1 is DESTROYED and counts)"
            - "SponsorshipProgram.${prog}.kits_settled_count == 1"
            - "SponsorshipProgram.${prog}.provisional_total_cents == 1465"
            - "SponsorshipProgram.${prog}.final_total_cents == 1676"
            - "SponsorshipProgram.${prog}.status == \"ACTIVE\" and funding_ceiling_cents == 500000"
            - "GET /sharps/ledger-entries?sponsorship_program_id=${prog} returns exactly 5 entries in sequence_no ASC: (RESERVATION, +1465, kit ${kit1}), (RESERVATION_RELEASE, -1465, kit ${kit1}), (COMMITMENT, +1676, kit ${kit1}), (RESERVATION, +1465, kit ${kit2}), (RESERVATION_RELEASE, -1465, kit ${kit2})"
            - "the sequence_no 5 entry carries reserved_after_cents == 0, committed_after_cents == 1676 and available_after_cents == 498324, matching the read exactly"
            - "DestructionCertificate.${cert1}.final_kit_cost_cents == 1676 and Kit.${kit1}.provisional_cost_cents == 1465"
            - "Enrollment.${enr}.kits_issued == 1 and Enrollment.${enr}.version == ${enr_v2} + 1"
            - "${prog_v} is unchanged by kit issuance and kit void (only funding adjustments bump the program version)"

      - name: auto_ship_run_aborts_all_or_nothing_when_a_later_enrollment_is_out_of_authorizations
        claim_type: bulk_action
        grounds:
          - endpoints.POST /sharps/auto-ship-runs
          - calculations.autoship_due_evaluation
          - validations.priority 28 (ERR_KIT_AUTHORIZATION_EXHAUSTED)
          - entities.AutoShipRun
        distinguishing_aspect: "The bulk endpoint is transactional, not per-item: the run successfully mints Bianca's kit and only THEN hits ERR_KIT_AUTHORIZATION_EXHAUSTED on the second enrollment — the whole run must roll back so that no AutoShipRun row, no kit, and no ledger entry survives. Exhausted authorizations are deliberately NOT one of the four skip counters, which is what makes this an abort rather than a kits_skipped_* increment."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; CA rule; one MANUFACTURER program funded 500000 / 5000."
            - "Bianca's enrollment is created FIRST (00:00:00Z) with 2 kits authorized and NO kit ever issued, so she is due 2026-08-01 and processed first."
            - "The clock is then advanced to 01:00:00Z (so the created_at ordering is unambiguous without touching ids) and Aaron's enrollment is created with kits_authorized 1; his one kit is issued, acknowledged and SEALED — sealed is not an \"unfilled\" status, so the run will not skip him, it will fault on him."
            - "Clock moved to 2026-08-31T00:00:00Z: Bianca is due (2026-08-01) and Aaron is due (2026-08-01 + 30 = 2026-08-31, and due_date > as_of_date is false at equality)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /sharps/state-rules"
