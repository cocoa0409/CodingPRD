    claim_type: exclusive_operations
    grounds:
    - validations[priority=2]
    - errors[ERR_UNAUTHORIZED]
    - roles.LeaseAdministrator.exclusive_operations
    distinguishing_aspect: POST /leases/{id}/execute is exclusive to LeaseAdministrator, so a TenantRep acting on its own lease is refused with ERR_UNAUTHORIZED (403) - a role failure at priority 2, not
      the tenant-scope failure at priority 6.
    test_recipe:
      setup:
      - A center, one tenant and one DRAFT lease of 210000 sqft
      - Logical clock at 2026-08-01T00:00:00Z
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          to_iso8601: '2026-08-01T00:00:00Z'
        as: ComplianceOfficer
        as_user_id: co-analyst-1
      - call: POST /centers
        payload:
          name: Northgate Crossing
          total_gla_sqft: 300000
          occupancy_grace_days: 30
        as: AssetManager
        as_user_id: am-portfolio-1
        captures:
          ctr: $.data.id
      - call: POST /tenants
        payload:
          legal_name: Boxmart Retail Inc
          notice_email: legal@boxmart.example
          primary_use_code: DISCOUNT_DEPT
          is_national_chain: true
        as: LeaseAdministrator
        as_user_id: la-admin-1
        captures:
          t_box: $.data.id
      - call: POST /centers/${ctr}/leases
        payload:
          tenant_id: ${t_box}
          suite_code: A1
          gla_sqft: 210000
          parcel_kind: ANCHOR_BOX
          primary_use_code: DISCOUNT_DEPT
          base_rent_monthly_cents: 8000000
          commencement_date: '2026-01-01'
          expiration_date: '2036-12-31'
        as: LeaseAdministrator
        as_user_id: la-admin-1
        captures:
