          trigger:
            - call: "POST /gin-ops/modules/${m}/complete-ginning"
              payload: { bales: [ {bale_tag: "B-RB1", net_weight_lbs: 500} ] }
              as: ClassingClerk
              captures: { err: $.data.error_id }
          assert:
            - "http 403, error_id == ERR_FORBIDDEN; module stays GINNING; no bale created"

      - name: rbac_grower_cannot_read_other_grower
        claim_type: rbac_ownership_scope
        grounds: ["roles[Grower]", "validations[priority=2]", "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "Grower is entity-backed: X-User-ID must equal the grower id in the path — self-read succeeds, cross-read is ERR_FORBIDDEN."
        test_recipe:
          setup: ["growers G1 and G2 exist"]
          setup_api_calls:
            - call: "POST /gin-ops/growers"
              payload: { membership_number: "MB-C72A", legal_name: "Self Farm" }
              as: CoopAdmin
              captures: { g1: $.data.id }
            - call: "POST /gin-ops/growers"
              payload: { membership_number: "MB-C72B", legal_name: "Other Farm" }
              as: CoopAdmin
              captures: { g2: $.data.id }
          trigger:
            - call: "GET /gin-ops/growers/${g1}"
              as: Grower
              as_user_id: "${g1}"
            - call: "GET /gin-ops/growers/${g2}"
              as: Grower
              as_user_id: "${g1}"
              captures: { err: $.data.error_id }
          assert:
            - "self-read: 200 with Grower.${g1} data"
            - "cross-read: http 403, error_id == ERR_FORBIDDEN"

      - name: rbac_grower_cannot_create_settlement
        claim_type: rbac_denial
        grounds: ["roles[CoopAccountant]", "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "settlement creation is CoopAccountant-exclusive — even the grower whose account it settles is denied."
        test_recipe:
          setup: ["grower G1 exists"]
          setup_api_calls:
