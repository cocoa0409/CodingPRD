              as: LiftOpsManager
              captures: { lift_id: $.data.id }
          trigger:
            - call: "POST /mountain-ops/lifts/${lift_id}/inspections"
              payload: { result: "PASS", notes: "daily pre-op" }
              as: LiftOpsManager
            - call: "POST /mountain-ops/lift-staff-assignments"
              payload: { lift_id: "${lift_id}", operator_code: "OP-1", role_on_lift: "TOP_OP", shift_start: "2026-08-01T00:00:00Z", shift_end: "2026-08-01T16:00:00Z" }
              as: LiftOpsManager
            - call: "POST /mountain-ops/lift-staff-assignments"
              payload: { lift_id: "${lift_id}", operator_code: "OP-2", role_on_lift: "BOTTOM_OP", shift_start: "2026-08-01T00:00:00Z", shift_end: "2026-08-01T16:00:00Z" }
              as: LiftOpsManager
            - call: "POST /mountain-ops/lifts/${lift_id}/service-status"
              payload: { target_status: "STANDBY" }
              as: LiftOpsManager
          assert:
            - "Trigger 1: HTTP 200, data.mechanical_status == 'INSPECTION_PASSED', data.last_inspection_result == 'PASS'."
            - "Trigger 1: data.last_inspection_at == '2026-08-01T00:00:00Z' and data.inspection_valid_until == '2026-08-02T00:00:00Z' (clock + 24h)."
            - "Trigger 1: data.service_status is still 'CLOSED' - the service dimension did not move."
            - "Trigger 2 and 3: data.staffed_operator_count reaches 2 on the lift."
            - "Trigger 4: data.service_status == 'STANDBY' and data.mechanical_status is still 'INSPECTION_PASSED'."

      - name: opening_decision_open_on_a_prep_area_returns_terrain_state_invalid
