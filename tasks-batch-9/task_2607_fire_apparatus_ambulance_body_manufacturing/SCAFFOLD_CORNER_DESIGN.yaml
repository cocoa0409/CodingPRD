            - call: "POST /unit-orders/${unit_b_id}/cancel"
              as: ProgramAdmin
              as_user_id: "admin-1"
          assert:
            - "after unit A: ApparatusProgram.${prog_id}.committed_cents == 68276000"
            - "after unit B: committed_cents == 136552000 and status is still \"ACTIVE\" (below the 360000000 soft ceiling)"
            - "the cancel returns 200 with UnitOrder.${unit_b_id}.build_status == \"CANCELLED\" and ApparatusProgram.${prog_id}.committed_cents == 68276000"
            - "UnitOrder.${unit_b_id}.price_cents is still 68276000 — the price is frozen on the row even though the unit left the aggregation"
            - "UnitOrder.${unit_a_id}.price_cents == 68276000 and build_status == \"SPEC_LOCKED\", untouched by its sibling's cancellation"

      - name: slot_line_exhausted_when_available_count_reaches_zero
        claim_type: Constants Applied
        grounds:
          - calculations.slot_line_utilization
          - validations[priority=39]
          - errors.ERR_SLOT_LINE_EXHAUSTED
          - state_machines.ChassisReservation.RESERVED_to_RELEASED
        distinguishing_aspect: |
          Slot exhaustion is a count check independent of the window check: on a
          one-slot line a second booking in a far-future non-overlapping window
          (2027-01-01..2027-01-15) is rejected 409 ERR_SLOT_LINE_EXHAUSTED rather
          than ERR_SLOT_WINDOW_CONFLICT, and releasing the first hold restores
          available_slot_count to 1 so the identical booking then succeeds.
        test_recipe:
          setup:
            - "one ApparatusProgram ACTIVE and one SupplierSlotLine with total_slot_count 1 holding one RESERVED reservation for 2026-09-01..2026-09-15"
          setup_api_calls:
            - call: "POST /programs"
              payload: { name: "Slot program", agency_name: "Metro Fire District", base_year: 2024, base_unit_price_cents: 62500000, escalation_index_pct_per_year: 4.0, max_option_units: 1, contract_ceiling_cents: 400000000 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { prog_id: $.data.id }
            - call: "POST /programs/${prog_id}/activate"
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "POST /slot-lines"
              payload: { supplier_name: "Ladder Works Aerial Devices", component_type: "AERIAL_DEVICE", total_slot_count: 1 }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { line_id: $.data.id, line_v1: $.data.version }
            - call: "POST /chassis-reservations"
              payload: { program_id: "${prog_id}", slot_line_id: "${line_id}", slot_start_date: "2026-09-01T00:00:00Z", slot_end_date: "2026-09-15T00:00:00Z", reserved_price_cents: 45000000, expiry_at: "2026-12-01T00:00:00Z", expected_slot_line_version: "${line_v1}" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { res1_id: $.data.id }
            - call: "GET /slot-lines/${line_id}"
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { line_v2: $.data.version }
          trigger:
            - call: "POST /chassis-reservations"
              payload: { program_id: "${prog_id}", slot_line_id: "${line_id}", slot_start_date: "2027-01-01T00:00:00Z", slot_end_date: "2027-01-15T00:00:00Z", reserved_price_cents: 45000000, expiry_at: "2026-12-01T00:00:00Z", expected_slot_line_version: "${line_v2}" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { e_exhausted: $.data.error_id }
            - call: "POST /chassis-reservations/${res1_id}/release"
              as: ProgramAdmin
              as_user_id: "admin-1"
            - call: "GET /slot-lines/${line_id}"
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { line_v3: $.data.version }
            - call: "POST /chassis-reservations"
              payload: { program_id: "${prog_id}", slot_line_id: "${line_id}", slot_start_date: "2027-01-01T00:00:00Z", slot_end_date: "2027-01-15T00:00:00Z", reserved_price_cents: 45000000, expiry_at: "2026-12-01T00:00:00Z", expected_slot_line_version: "${line_v3}" }
              as: ProgramAdmin
              as_user_id: "admin-1"
              captures: { res2_id: $.data.id }
          assert:
            - "before the second booking: SupplierSlotLine.${line_id}.reserved_slot_count == 1 and available_slot_count == 0"
            - "${e_exhausted} == ERR_SLOT_LINE_EXHAUSTED with HTTP 409 — the 2027 window overlaps nothing, so this is the count check, not the window check"
            - "the release returns 200 with ChassisReservation.${res1_id}.status == \"RELEASED\" and SupplierSlotLine.${line_id}.reserved_slot_count == 0, available_slot_count == 1"
            - "the retried booking is admitted 201 with ChassisReservation.${res2_id}.status == \"RESERVED\" and the line back to reserved_slot_count == 1, available_slot_count == 0"
            - "GET /chassis-reservations?slot_line_id=${line_id} returns total_count == 2 — the RELEASED row is still readable, it simply stopped occupying a slot"

