              captures: { rp_edge_id: $.data.id }
            - call: "POST /cafo/annual-reports"
              payload: { operation_id: "${op_id}", plan_id: "${pl_id}", report_year: 2025, beginning_storage_gallons: 0, ending_storage_gallons: 2865000 }
              as: Operator
              as_user_id: "${op_id}"
              captures: { rp_out_id: $.data.id }
            - call: "POST /cafo/annual-reports"
              payload: { operation_id: "${op_id}", plan_id: "${pl_id}", report_year: 2024, beginning_storage_gallons: 0, ending_storage_gallons: 2865000, variance_explanation: "Herd depopulated in March after a barn fire; production ran below design all year." }
              as: Operator
              as_user_id: "${op_id}"
              captures: { rp_expl_id: $.data.id }
            - call: "POST /cafo/annual-reports/${rp_edge_id}/submit"
              payload: {}
