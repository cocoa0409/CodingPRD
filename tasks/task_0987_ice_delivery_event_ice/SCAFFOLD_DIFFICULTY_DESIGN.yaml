            - "w_status == CONFIRMED (W's interval [14:00,20:00) is disjoint: half-open touch at 13:00/14:00 does not overlap; posture FROZEN does not gate confirm)"

  - rule_id: compensating_invariant
    instances:
      - name: pallet_hold_reserve_cancel_conservation
        grounds:
          - calculations.freezer_capacity_and_posture
          - state_machines.Order.transitions.CONFIRMED_to_CANCELLED
          - state_machines.ColdStorageHold.transitions.RESERVED_to_RELEASED
        distinguishing_aspect: |
          Conserved quantity: FREEZER PALLET SPACES. Invariant pinned:
          depot.freezer_reserved_pallets == SUM(hold.pallets_required) over
          holds with status IN {RESERVED, OCCUPIED}. Confirm (reserve) followed
          by cancel (release) must return the depot to exactly the pre-confirm
          free count — 10 before, 8 while reserved, 10 after cancel, with the
          hold row RELEASED proving the formula's input set.
        test_recipe:
          setup:
            - "Depot cap 10; fixture PriceBook ACTIVE; customer limit 200000"
            - "Order WILL_CALL 2026-05-10 10:00-12:00, 2x(BLOCK,PALLET), QUOTED"
          setup_api_calls:
            - call: "POST /depots"
              payload: { name: "Depot CI1", freezer_capacity_pallets: 10 }
              as: PlatformAdmin
              captures: { depot_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /price-books"
              payload:
                scope_label: "standard-2026"
                effective_from: "2026-04-01T00:00:00Z"
                lines:
                  - { product_form: CUBE, packaging: BAG, tier_min_units: 1, tier_max_units: 19, unit_price_cents: 350 }
                  - { product_form: CUBE, packaging: BAG, tier_min_units: 20, tier_max_units: 99, unit_price_cents: 300 }
                  - { product_form: CUBE, packaging: BAG, tier_min_units: 100, tier_max_units: null, unit_price_cents: 275 }
                  - { product_form: CUBE, packaging: PALLET, tier_min_units: 1, tier_max_units: 4, unit_price_cents: 28000 }
                  - { product_form: CUBE, packaging: PALLET, tier_min_units: 5, tier_max_units: null, unit_price_cents: 26000 }
                  - { product_form: BLOCK, packaging: BAG, tier_min_units: 1, tier_max_units: 9, unit_price_cents: 900 }
                  - { product_form: BLOCK, packaging: BAG, tier_min_units: 10, tier_max_units: null, unit_price_cents: 800 }
                  - { product_form: BLOCK, packaging: PALLET, tier_min_units: 1, tier_max_units: null, unit_price_cents: 21000 }
                  - { product_form: DRY_ICE, packaging: BAG, tier_min_units: 1, tier_max_units: 9, unit_price_cents: 1500 }
                  - { product_form: DRY_ICE, packaging: BAG, tier_min_units: 10, tier_max_units: 49, unit_price_cents: 1350 }
                  - { product_form: DRY_ICE, packaging: BAG, tier_min_units: 50, tier_max_units: null, unit_price_cents: 1200 }
                  - { product_form: DRY_ICE, packaging: PALLET, tier_min_units: 1, tier_max_units: null, unit_price_cents: 60000 }
                pallet_deposit_cents: 1500
                delivery_fee_cents: 4900
                free_delivery_threshold_cents: 20000
                volume_discount_tiers:
                  - { threshold_cents: 50000, discount_bps: 500 }
                  - { threshold_cents: 100000, discount_bps: 1000 }
                surge_surcharge_bps: 1500
              as: PlatformAdmin
            - call: "POST /customers"
              payload: { account_name: "CI1 Events", kind: EVENT_ORGANIZER, tier: STANDARD, credit_terms: NET_30, credit_limit_cents: 200000 }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "GET /depots/${depot_id}"
              as: PlatformAdmin
              captures: { free_before: $.data.freezer_free_pallets, reserved_before: $.data.freezer_reserved_pallets }
            - call: "POST /orders"
              payload:
                customer_id: "${cust_id}"
                depot_id: "${depot_id}"
                channel: WILL_CALL
                event_date: "2026-05-10"
                window_start: "10:00"
                window_end: "12:00"
                lines:
                  - { product_form: BLOCK, packaging: PALLET, quantity_units: 2 }
              as: CustomerAgent
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
            - call: "POST /orders/${order_id}/quote"
              as: CustomerAgent
              as_user_id: "${cust_id}"
            - call: "POST /orders/${order_id}/confirm"
              as: CustomerAgent
              as_user_id: "${cust_id}"
            - call: "GET /depots/${depot_id}"
              as: PlatformAdmin
              captures: { free_reserved: $.data.freezer_free_pallets, reserved_mid: $.data.freezer_reserved_pallets }
          trigger:
            - call: "POST /orders/${order_id}/cancel"
              as: CustomerAgent
              as_user_id: "${cust_id}"
            - call: "GET /depots/${depot_id}"
              as: PlatformAdmin
              captures: { free_after: $.data.freezer_free_pallets, reserved_after: $.data.freezer_reserved_pallets }
            - call: "GET /orders/${order_id}/holds"
              as: PlatformAdmin
              captures: { hold_status: "$.data[0].status" }
          assert:
            - "reserved_before == 0 and free_before == 10"
            - "reserved_mid == 2 and free_reserved == 8 (confirm reserved 2 pallet spaces)"
            - "reserved_after == reserved_before and free_after == free_before (reserve + cancel conserve pallet spaces)"
            - "hold_status == RELEASED (formula input set {RESERVED, OCCUPIED} is empty, matching reserved_after == 0)"

      - name: payment_void_cent_conservation
        grounds:
          - calculations.payment_waterfall
          - state_machines.Invoice.transitions.PARTIALLY_PAID_to_VOID
        distinguishing_aspect: |
          Conserved quantity: CENTS (different conserved type than pallets).
          Invariant pinned: SUM(Invoice.amount_paid_cents over non-VOID
          invoices) + Customer.credit_balance_cents == SUM(Payment.amount_cents).
          A 20000-cent partial payment makes it 20000 + 0; voiding the invoice
          unapplies the payment to the wallet, making it 0 + 20000 — the sum
          stays 20000 across the compensating void.
        test_recipe:
          setup:
            - "Depot cap 10; fixture PriceBook ACTIVE; customer NET_30 limit 200000"
            - "Order WILL_CALL 2x(BLOCK,PALLET) picked up 2026-05-01; invoice total 45000 generated and issued by clerk_1 (due 2026-05-31, still ISSUED at clock 2026-05-01)"
