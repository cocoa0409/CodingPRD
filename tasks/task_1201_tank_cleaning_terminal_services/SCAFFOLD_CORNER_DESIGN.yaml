              payload: { job_id: "${oc3_job}", waste_code: "K051", hazard_class: "NON_HAZARDOUS", lab_flash_point_c: 70, lab_tph_mg_l: 120 }
              as: ContractorSupervisor
              as_user_id: "${oc3_ctr}"
              captures: { oc3_prof: $.data.id }
            - { call: "POST /ops/waste-profiles/${oc3_prof}/submit", payload: {}, as: ContractorSupervisor, as_user_id: "${oc3_ctr}" }
            - { call: "POST /ops/waste-profiles/${oc3_prof}/approve", payload: {}, as: EHSOfficer, as_user_id: "ehs-1" }
            - call: "POST /ops/waste-shipments"
              payload: { job_id: "${oc3_job}", profile_id: "${oc3_prof}", lines: [{ material: "SLUDGE", kg: 2542, rate_cents_per_kg: 2.0 }] }
              as: ContractorSupervisor
              as_user_id: "${oc3_ctr}"
              captures: { oc3_ship: $.data.id }
            - { call: "POST /ops/waste-shipments/${oc3_ship}/dispatch", payload: {}, as: ContractorSupervisor, as_user_id: "${oc3_ctr}" }
            - { call: "POST /ops/waste-shipments/${oc3_ship}/deliver", payload: {}, as: ContractorSupervisor, as_user_id: "${oc3_ctr}" }
            - { call: "POST /ops/cleaning-jobs/${oc3_job}/record-sludge-removal", payload: { residual_sludge_kg: 0 }, as: ContractorSupervisor, as_user_id: "${oc3_ctr}" }
            - { call: "POST /ops/cleaning-jobs/${oc3_job}/request-gas-free", payload: {}, as: ContractorSupervisor, as_user_id: "${oc3_ctr}" }
            - call: "POST /ops/gas-free-certificates"
              payload: { job_id: "${oc3_job}", lel_pct: 5.0, o2_pct: 20.9, h2s_ppm: 2.0, benzene_ppm: 0.2 }
              as: MarineChemist
              as_user_id: "chemist-1"
              captures: { oc3_cert: $.data.id }
            - call: "POST /ops/entry-permits"
              payload: { job_id: "${oc3_job}", cert_id: "${oc3_cert}", max_entrants: 4 }
              as: ContractorSupervisor
              as_user_id: "${oc3_ctr}"
              captures: { oc3_perm: $.data.id }
            - { call: "POST /ops/entry-permits/${oc3_perm}/issue", payload: {}, as: EHSOfficer, as_user_id: "ehs-1" }
            - { call: "POST /ops/entry-permits/${oc3_perm}/activate", payload: {}, as: ContractorSupervisor, as_user_id: "${oc3_ctr}" }
            - { call: "POST /ops/cleaning-jobs/${oc3_job}/begin-entry", payload: {}, as: ContractorSupervisor, as_user_id: "${oc3_ctr}" }
            - call: "POST /ops/inspectors"
              payload: { name: "InspA", certification_level: "API653" }
              as: TerminalAdmin
              captures: { oc3_insp: $.data.id, oc3_insp_v1: $.data.version }
            - call: "POST /ops/inspections"
              payload: { job_id: "${oc3_job}", inspector_id: "${oc3_insp}", scheduled_start: "2026-05-03T00:00:00Z", scheduled_end: "2026-05-03T08:00:00Z", expected_inspector_version: "${oc3_insp_v1}" }
              as: TerminalOperator
              captures: { oc3_ins1: $.data.id }
          trigger:
            - name: stale_inspection_create_rejected
              call: "POST /ops/inspections"
              payload: { job_id: "${oc3_job}", inspector_id: "${oc3_insp}", scheduled_start: "2026-05-05T00:00:00Z", scheduled_end: "2026-05-05T08:00:00Z", expected_inspector_version: "${oc3_insp_v1}" }
              as: TerminalOperator
              captures: { oc3_err: $.data.error_id }
          assert:
            - "oc3_err == ERR_STALE_VERSION (412): inspector version is now 2"
            - "the May-5 slot is free — only the stale version rejects the write"
  # ===========================================================================
  - section: consistency_model
    instances:
      - name: immediate_read_after_write_consistency
        claim_type: immediate
        grounds:
          - "complexity_profile.consistency_model"
        distinguishing_aspect: "All mutations are atomic in the request: a GET issued right after schedule returns SCHEDULED with window_id linked and updated_at > created_at."
        test_recipe:
          setup: ["job DRAFT, window PLANNED, contractor QUALIFIED"]
          setup_api_calls:
            - { call: "POST /ops/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: TerminalAdmin }
            - call: "POST /ops/terminals"
              payload: { name: "T1", wastewater_daily_capacity_liters: 100000 }
              as: TerminalAdmin
              captures: { im_term: $.data.id }
            - call: "POST /ops/products"
              payload: { code: "GAS89", family: "GASOLINE", viscosity_class: "LOW", compatibility_group: "GAS", flash_point_c: -40 }
              as: TerminalAdmin
              captures: { im_gas: $.data.id }
            - call: "POST /ops/products"
              payload: { code: "DSL10", family: "DISTILLATE", viscosity_class: "MEDIUM", compatibility_group: "DIST", flash_point_c: 55 }
              as: TerminalAdmin
              captures: { im_dist: $.data.id }
            - call: "POST /ops/tanks"
              payload: { terminal_id: "${im_term}", tank_number: "T-1", capacity_m3: 5000, current_product_id: "${im_gas}" }
              as: TerminalAdmin
              captures: { im_tank: $.data.id, im_tank_v: $.data.version }
            - call: "POST /ops/contractors"
              payload: { company_name: "CleanCo" }
              as: TerminalAdmin
              captures: { im_ctr: $.data.id }
            - { call: "POST /ops/contractors/${im_ctr}/qualify", payload: { terminal_id: "${im_term}" }, as: TerminalAdmin }
            - call: "POST /ops/cleaning-jobs"
              payload: { terminal_id: "${im_term}", tank_id: "${im_tank}", contractor_id: "${im_ctr}", from_product_id: "${im_gas}", to_product_id: "${im_dist}", heel_volume_liters_sounding: 100, base_service_fee_cents: 1000 }
              as: TerminalOperator
              captures: { im_job: $.data.id, im_created: $.data.created_at }
            - call: "POST /ops/service-windows"
              payload: { tank_id: "${im_tank}", planned_start: "2026-05-02T00:00:00Z", planned_end: "2026-05-10T00:00:00Z", expected_tank_version: "${im_tank_v}" }
              as: TerminalOperator
              captures: { im_win: $.data.id }
          trigger:
            - { call: "POST /ops/cleaning-jobs/${im_job}/schedule", payload: { window_id: "${im_win}" }, as: TerminalOperator }
            - call: "GET /ops/cleaning-jobs/${im_job}"
              payload: {}
              as: TerminalOperator
              captures: { im_status: $.data.status, im_win_link: $.data.window_id, im_updated: $.data.updated_at }
          assert:
            - "im_status == SCHEDULED and im_win_link == ${im_win} (visible in the immediately following read)"
            - "im_updated >= im_created"
