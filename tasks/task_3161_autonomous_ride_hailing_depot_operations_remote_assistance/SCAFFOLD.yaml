  # ---- AssistanceSession ----
  - method: POST
    path: "/fleet/territories/{territoryId}/ride-requests/{rideId}/assistance-sessions"
    description: "Escalate a ride to remote assistance and record a dispatch attempt against the ride"
    roles: [RemoteAssistanceOperator, FleetOperations]
    code: 201
    input: ["reason"]
    output: AssistanceSession
    side_effects:
      - "status=ESCALATED, escalation_tier=1, attempt_count=0, op_user_id=null"
      - "vehicle_id copied from RideRequest.vehicle_id at creation time"
      - "ride.dispatch_attempts increments by 1; on the 3rd attempt against a MATCHED ride the ride is un-matched and the vehicle credit decremented per §1.3 territory_total_credit"
  - method: GET
    path: "/fleet/assistance-sessions"
    description: "List AssistanceSessions, optionally filtered by status, ride or vehicle"
    roles: [RemoteAssistanceOperator, FleetOperations, SafetyReviewer]
    code: 200
    input: ["status?", "ride_request_id?", "vehicle_id?", "limit?", "offset?"]
    output: AssistanceSession[]
    side_effects: []
  - method: GET
    path: "/fleet/assistance-sessions/{sessionId}"
    description: "Get an AssistanceSession"
    roles: [RemoteAssistanceOperator, FleetOperations, SafetyReviewer]
    code: 200
    input: []
    output: AssistanceSession
    side_effects: []
  - method: GET
    path: "/fleet/ride-requests/{rideId}/assistance-sessions"
    description: "List the AssistanceSessions for a ride"
    roles: [RemoteAssistanceOperator, FleetOperations, SafetyReviewer]
    code: 200
    input: ["limit?", "offset?"]
    output: AssistanceSession[]
    side_effects: []
  - method: POST
    path: "/fleet/assistance-sessions/{sessionId}/acknowledge"
    description: "Acknowledge an escalated session (ESCALATED to ACKNOWLEDGED)"
    roles: [RemoteAssistanceOperator]
    code: 200
    input: []
    output: AssistanceSession
    side_effects: ["status=ACKNOWLEDGED, op_user_id=X-User-ID", "increments AssistanceSession.version by 1"]
  - method: POST
    path: "/fleet/assistance-sessions/{sessionId}/resolve"
    description: "Resolve an acknowledged session (ACKNOWLEDGED to RESOLVED)"
    roles: [RemoteAssistanceOperator]
    code: 200
    input: []
    output: AssistanceSession
    side_effects: ["status=RESOLVED", "increments AssistanceSession.version by 1"]
  - method: POST
    path: "/fleet/assistance-sessions/{sessionId}/escalate-unresolved"
    description: "Mark a session unresolvable (ACKNOWLEDGED to UNRESOLVED) after 3 attempts"
    roles: [RemoteAssistanceOperator]
    code: 200
    input: []
    output: AssistanceSession
    side_effects:
      - "status=UNRESOLVED"
      - "the referencing RideRequest moves to FAILED (cascade; updates Vehicle.version via service_status)"
      - "increments AssistanceSession.version by 1"

  # ---- IncidentReport ----
  - method: POST
