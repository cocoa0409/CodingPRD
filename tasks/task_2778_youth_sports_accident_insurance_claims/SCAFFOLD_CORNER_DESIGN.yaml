          setup:
            - "One league, one BASEBALL_U12 classification (travel_buffer_minutes 60) and one ACTIVE policy with one ENROLLED athlete."
            - "One SANCTIONED game whose closed window is [2026-07-11T18:00:00Z, 2026-07-11T20:00:00Z]."
