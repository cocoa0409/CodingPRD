  # ===========================================================================
  # excluded_because stubs — corners already exercised by §1.8 instances
  # ===========================================================================
  - section: state_machines
    instances:
      - name: deal_cancel_releases_unit_hold_stub
        claim_type: Side Effect Execution
        grounds:
          - 'state_machines.Unit.HELD_to_AVAILABLE'
        excluded_because:
          difficulty_instance: transitive_cascade / deal_cancel_releases_unit_hold_depth2
          rationale: "The cancel->unit-release cascade and active_hold_deal_id clearing are asserted by the named §1.8 cascade instance."

      - name: warranty_plan_exhausts_on_cap_stub
        claim_type: Bubble up
        grounds:
          - 'entities.WarrantyPlan.fields.status'
        excluded_because:
          difficulty_instance: transitive_cascade / so_complete_warranty_exhaust_chain_depth3
          rationale: "Auto EXHAUSTED transition when consumed reaches cap is asserted by the named §1.8 depth-3 cascade instance."

  - section: calculations
    instances:
      - name: net_trade_equity_two_variants_stub
        claim_type: Variant Divergence
        grounds:
          - 'calculations.net_trade_equity'
        excluded_because:
          difficulty_instance: dual_variant_calc / trade_equity_applied_vs_dealer_book
          rationale: "Applied vs dealer-book equity divergence (delta == recon) is asserted by the named §1.8 dual-variant instance."

      - name: service_order_total_warranty_split_stub
        claim_type: Variant Selection
        grounds:
          - 'calculations.service_order_total'
        excluded_because:
          difficulty_instance: dual_variant_calc / service_total_warranty_covered_vs_owed
          rationale: "Warranty-covered vs customer-owed split of the service total is asserted by the named §1.8 dual-variant instance."

  - section: cross_cutting_complexity_layers
    instances:
      - name: parts_conservation_stub
        claim_type: derived_field_reconciliation
        grounds:
          - 'entities.PartItem.fields.qty_on_hand'
        excluded_because:
          difficulty_instance: compensating_invariant / parts_conservation_reserve_then_cancel
          rationale: "Parts qty_on_hand conservation across reserve+cancel is asserted by the named §1.8 compensating-invariant instance."
