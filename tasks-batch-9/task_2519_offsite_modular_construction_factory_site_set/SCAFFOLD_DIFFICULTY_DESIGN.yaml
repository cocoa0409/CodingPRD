            - call: "POST /modular/permits/${permit}/decide"
              payload: { decision: "APPROVE" }
              as: StateProgramOfficer
              captures: { pinned: "$.data.pinned_package_id", pstatus: "$.data.status" }
            - call: "POST /modular/modules"
              payload: { project_id: "${proj}", design_package_id: "${pkg1}", module_code: "M-01", set_sequence_index: 1, width_in: 180, length_in: 600, height_in: 156, gross_weight_lb: 76600 }
              as: FactoryProductionManager
