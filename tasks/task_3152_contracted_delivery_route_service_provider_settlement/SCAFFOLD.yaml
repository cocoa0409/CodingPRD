    side_effects: []

  - method: GET
    path: "/route-settlement/vehicles/{id}/chargeback-claims"
    description: "Reverse lookup: the charge-back claims naming this vehicle as equipment involved."
    roles: [AccountManager, SettlementAnalyst, ComplianceOfficer]
    code: 200
