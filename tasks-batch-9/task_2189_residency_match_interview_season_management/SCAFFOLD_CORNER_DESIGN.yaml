            - "the first trigger call returns HTTP 412 with data.error_id == 'ERR_STALE_RANK_LIST_VERSION'"
            - "after the first call RankList.${rl_id}.entry_count is still 1"
            - "the re-read reports a version strictly greater than the one the first entry consumed"
            - "the third trigger call returns HTTP 201 with rank_position == 2"
            - "RankList.${rl_id}.entry_count == 2"

      - name: a_stale_expected_wave_version_is_refused_under_its_own_error_id
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.invitation-issue-stale-wave
          - errors.ERR_STALE_WAVE_VERSION
          - validations.priority 6
        distinguishing_aspect: >
          The same priority-6 check on a different parent must report a different id: issuing a second
          invitation with the version the release call returned draws ERR_STALE_WAVE_VERSION, not
          ERR_STALE_RANK_LIST_VERSION. The wave's version advances on the invitation write as well as on the
          release, so the token the client is holding is one behind, and the rejected attempt leaves
          issued_count at 1.
        test_recipe:
          setup:
            - "a RELEASED two-seat wave that has already issued one invitation, plus a second advanced application"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
