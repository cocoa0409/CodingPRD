# =============================================================================
# §1.9 Scaffold Corner Design (breadth probe)
# Pet Licensing & Animal Control — Expert tier.
# Enumerative coverage of testable claims in §1.1–§1.7 NOT already covered by
# §1.8. excluded_because: stubs point at the §1.8 instance that owns the corner.
# Every active instance's setup_api_calls drives empty-DB → precondition using
# only §1.5 endpoints; literals pre-computed.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_owner_returns_201_with_defaults
        claim_type: Creation
        grounds: [entities.Owner.fields.status, entities.Owner.fields.active_license_count]
        distinguishing_aspect: "POST /owners with full_name+email+address_zip → 201; status=ACTIVE, active_license_count=0, outstanding_penalty_cents=0."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: LicensingClerk
          trigger:
            - call: "POST /owners"
              payload: { full_name: "New Owner", email: "new@x.com", address_zip: "10000" }
              as: LicensingClerk
              captures: { o_id: $.data.id, o_status: $.data.status }
          assert:
            - "response.status == 201"
            - "Owner.${o_id}.status == ACTIVE"
            - "Owner.${o_id}.active_license_count == 0"
            - "Owner.${o_id}.outstanding_penalty_cents == 0"

      - name: get_owner_not_found_returns_404
        claim_type: Not Found
        grounds:
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET /owners/{random-uuid} for a non-existent owner → 404 ERR_NOT_FOUND."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: LicensingClerk
          trigger:
            - call: "GET /owners/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: LicensingClerk
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_NOT_FOUND"

      - name: create_pet_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - validations[priority=4]
          - errors[ERR_INVALID_REQUEST]
          - entities.Pet.fields.species
        distinguishing_aspect: "POST /pets omitting required species → 400 ERR_INVALID_REQUEST (species has source:input, no default)."
        test_recipe:
          setup: ["one owner registered"]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: LicensingClerk
            - call: "POST /owners"
              payload: { full_name: "P Owner", email: "po@x.com", address_zip: "10010" }
              as: LicensingClerk
              captures: { po_id: $.data.id }
          trigger:
            - call: "POST /pets"
              payload: { owner_id: "${po_id}", name: "Nameless", breed: "B", is_altered: false, birth_date: "2024-01-01T00:00:00Z" }
              as: Owner
              as_user_id: "${po_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: create_pet_invalid_enum_species_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - validations[priority=4]
          - errors[ERR_INVALID_REQUEST]
          - entities.Pet.fields.species
        distinguishing_aspect: "POST /pets with species=BIRD (not in {DOG,CAT}) → 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["one owner registered"]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: LicensingClerk
            - call: "POST /owners"
              payload: { full_name: "Q Owner", email: "qo@x.com", address_zip: "10011" }
              as: LicensingClerk
              captures: { qo_id: $.data.id }
          trigger:
            - call: "POST /pets"
              payload: { owner_id: "${qo_id}", name: "Tweety", species: "BIRD", breed: "B", is_altered: false, birth_date: "2024-01-01T00:00:00Z" }
              as: Owner
              as_user_id: "${qo_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: create_license_term_years_out_of_set_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - validations[priority=4]
          - errors[ERR_INVALID_REQUEST]
          - entities.License.fields.term_years
        distinguishing_aspect: "POST /licenses with term_years=2 (not in {1,3}) → 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["owner + pet"]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: LicensingClerk
            - call: "POST /owners"
              payload: { full_name: "R Owner", email: "ro@x.com", address_zip: "10012" }
              as: LicensingClerk
              captures: { ro_id: $.data.id }
            - call: "POST /pets"
              payload: { owner_id: "${ro_id}", name: "Bud", species: "DOG", breed: "B", is_altered: true, birth_date: "2024-01-01T00:00:00Z" }
              as: Owner
              as_user_id: "${ro_id}"
              captures: { rp_id: $.data.id }
          trigger:
            - call: "POST /licenses"
              payload: { owner_id: "${ro_id}", pet_id: "${rp_id}", license_kind: "INDIVIDUAL", term_years: 2 }
              as: Owner
              as_user_id: "${ro_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_INVALID_REQUEST"

      - name: vaccination_record_immutable_no_version_field
        claim_type: Immutability
        grounds: [entities.VaccinationRecord]
        distinguishing_aspect: "VaccinationRecord has common_fields:false — only id+created_at, no version; created via POST, no update endpoint exists in §1.5."
        test_recipe:
          setup: ["owner + pet"]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: LicensingClerk
            - call: "POST /owners"
              payload: { full_name: "S Owner", email: "so@x.com", address_zip: "10013" }
              as: LicensingClerk
              captures: { so_id: $.data.id }
            - call: "POST /pets"
              payload: { owner_id: "${so_id}", name: "Vax", species: "CAT", breed: "B", is_altered: true, birth_date: "2024-01-01T00:00:00Z" }
              as: Owner
              as_user_id: "${so_id}"
              captures: { sp_id: $.data.id }
          trigger:
            - call: "POST /vaccination-records"
              payload: { pet_id: "${sp_id}", vaccine_type: "RABIES", administered_on: "2025-06-01T00:00:00Z", expires_on: "2030-06-01T00:00:00Z", vet_license_no: "VS" }
              as: Owner
              as_user_id: "${so_id}"
              captures: { vr_id: $.data.id }
          assert:
            - "response.status == 201"
            - "VaccinationRecord.${vr_id}.vaccine_type == RABIES"

      - name: pet_computed_is_dangerous_input_ignored
        claim_type: Computed Fields
        grounds: [entities.Pet.fields.is_dangerous]
        distinguishing_aspect: "Pet.is_dangerous is source:computed — defaults false on creation; a client cannot set it (field is not in POST /pets input)."
        test_recipe:
          setup: ["owner registered"]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: LicensingClerk
            - call: "POST /owners"
              payload: { full_name: "T Owner", email: "to@x.com", address_zip: "10014" }
              as: LicensingClerk
              captures: { to_id: $.data.id }
          trigger:
            - call: "POST /pets"
              payload: { owner_id: "${to_id}", name: "Calm", species: "DOG", breed: "B", is_altered: true, birth_date: "2024-01-01T00:00:00Z" }
              as: Owner
              as_user_id: "${to_id}"
              captures: { tp_id: $.data.id, tp_dang: $.data.is_dangerous }
          assert:
            - "response.status == 201"
            - "Pet.${tp_id}.is_dangerous == false"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: start_review_from_draft_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.License.SUBMITTED_to_UNDER_REVIEW
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "start-review on a DRAFT license (not SUBMITTED) → 409 ERR_INVALID_STATE; no side effects fire."
        test_recipe:
          setup: ["a DRAFT license exists (created, never submitted)"]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: LicensingClerk
            - call: "POST /owners"
              payload: { full_name: "U Owner", email: "uo@x.com", address_zip: "10015" }
              as: LicensingClerk
              captures: { uo_id: $.data.id }
            - call: "POST /pets"
              payload: { owner_id: "${uo_id}", name: "Dft", species: "DOG", breed: "B", is_altered: true, birth_date: "2024-01-01T00:00:00Z" }
              as: Owner
              as_user_id: "${uo_id}"
              captures: { up_id: $.data.id }
            - call: "POST /licenses"
              payload: { owner_id: "${uo_id}", pet_id: "${up_id}", license_kind: "INDIVIDUAL", term_years: 1 }
              as: Owner
              as_user_id: "${uo_id}"
              captures: { ul_id: $.data.id }
          trigger:
            - call: "POST /licenses/${ul_id}/start-review"
              payload: {}
              as: LicensingClerk
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"
            - "License.${ul_id}.status == DRAFT"

      - name: license_initial_state_is_draft
        claim_type: Initial State
        grounds: [state_machines.License, entities.License.fields.status]
        distinguishing_aspect: "A freshly created license has status DRAFT, fees 0, version 1."
        test_recipe:
          setup: ["owner + pet"]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: LicensingClerk
            - call: "POST /owners"
              payload: { full_name: "V Owner", email: "vo@x.com", address_zip: "10016" }
              as: LicensingClerk
              captures: { vo_id: $.data.id }
            - call: "POST /pets"
              payload: { owner_id: "${vo_id}", name: "Init", species: "DOG", breed: "B", is_altered: true, birth_date: "2024-01-01T00:00:00Z" }
              as: Owner
              as_user_id: "${vo_id}"
              captures: { vp_id: $.data.id }
          trigger:
            - call: "POST /licenses"
              payload: { owner_id: "${vo_id}", pet_id: "${vp_id}", license_kind: "INDIVIDUAL", term_years: 1 }
              as: Owner
              as_user_id: "${vo_id}"
              captures: { vl_id: $.data.id, vl_status: $.data.status }
          assert:
            - "response.status == 201"
            - "License.${vl_id}.status == DRAFT"
            - "License.${vl_id}.provisional_fee_cents == 0"

      - name: revoke_from_rejected_terminal_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.License.terminal_states
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "A REJECTED license is terminal; revoke from REJECTED → 409 ERR_INVALID_STATE (revoke only from ACTIVE/GRACE)."
        test_recipe:
          setup: ["a license driven to REJECTED via UNDER_REVIEW→REJECTED"]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: LicensingClerk
            - call: "POST /owners"
              payload: { full_name: "W Owner", email: "wo@x.com", address_zip: "10017" }
              as: LicensingClerk
              captures: { wo_id: $.data.id }
            - call: "POST /pets"
              payload: { owner_id: "${wo_id}", name: "Rej", species: "DOG", breed: "B", is_altered: true, birth_date: "2024-01-01T00:00:00Z" }
              as: Owner
              as_user_id: "${wo_id}"
              captures: { wp_id: $.data.id }
            - call: "POST /licenses"
              payload: { owner_id: "${wo_id}", pet_id: "${wp_id}", license_kind: "INDIVIDUAL", term_years: 1 }
              as: Owner
              as_user_id: "${wo_id}"
              captures: { wl_id: $.data.id }
            - call: "POST /licenses/${wl_id}/submit"
              payload: {}
              as: Owner
              as_user_id: "${wo_id}"
            - call: "POST /licenses/${wl_id}/start-review"
              payload: {}
              as: LicensingClerk
            - call: "POST /licenses/${wl_id}/reject"
              payload: {}
              as: LicensingClerk
          trigger:
            - call: "POST /licenses/${wl_id}/revoke"
              payload: {}
              as: AnimalControlOfficer
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"
            - "License.${wl_id}.status == REJECTED"

      - name: designate_twice_for_same_pet_returns_already_designated
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.DangerousDogCase.INVESTIGATING_to_DESIGNATED
          - errors[ERR_ALREADY_DESIGNATED]
        distinguishing_aspect: "A second DangerousDogCase reaching INVESTIGATING for a pet already under a DESIGNATED case → 409 ERR_ALREADY_DESIGNATED on designate."
        test_recipe:
          setup: ["pet PX with case C1 already DESIGNATED; a second case C2 for PX in INVESTIGATING"]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: AnimalControlOfficer
            - call: "POST /owners"
              payload: { full_name: "X Owner", email: "xo@x.com", address_zip: "10018" }
              as: LicensingClerk
              captures: { xo_id: $.data.id }
            - call: "POST /pets"
              payload: { owner_id: "${xo_id}", name: "Dup", species: "DOG", breed: "B", is_altered: false, birth_date: "2022-01-01T00:00:00Z" }
              as: Owner
              as_user_id: "${xo_id}"
              captures: { xp_id: $.data.id }
            - call: "POST /dangerous-dog-cases"
              payload: { pet_id: "${xp_id}", incident_summary: "first", severity: "BITE" }
              as: AnimalControlOfficer
              captures: { c1_id: $.data.id }
            - call: "POST /dangerous-dog-cases/${c1_id}/investigate"
              payload: {}
              as: AnimalControlOfficer
            - call: "POST /dangerous-dog-cases/${c1_id}/designate"
              payload: {}
              as: AnimalControlOfficer
            - call: "POST /dangerous-dog-cases"
              payload: { pet_id: "${xp_id}", incident_summary: "second", severity: "ATTACK" }
              as: AnimalControlOfficer
              captures: { c2_id: $.data.id }
            - call: "POST /dangerous-dog-cases/${c2_id}/investigate"
              payload: {}
              as: AnimalControlOfficer
          trigger:
            - call: "POST /dangerous-dog-cases/${c2_id}/designate"
              payload: {}
              as: AnimalControlOfficer
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_ALREADY_DESIGNATED"
            - "DangerousDogCase.${c2_id}.status == INVESTIGATING"

      - name: resolve_matched_pair_cascades_counterpart
        claim_type: Side Effect Execution
        grounds: [state_machines.LostFoundReport.MATCHED_to_RESOLVED]
        distinguishing_aspect: "Resolving one MATCHED report sets the matched counterpart to RESOLVED as well (cascade across the pair)."
        test_recipe:
          setup: ["a matched LOST/FOUND pair (RR, FF both MATCHED)"]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: AnimalControlOfficer
            - call: "POST /lost-found-reports"
              payload: { report_type: "FOUND", species: "DOG", zip_seen: "66666", reported_at: "2026-03-01T08:00:00Z" }
              as: AnimalControlOfficer
              captures: { ff_id: $.data.id }
            - call: "POST /lost-found-reports"
              payload: { report_type: "LOST", species: "DOG", zip_seen: "66666", reported_at: "2026-03-01T07:00:00Z" }
              as: AnimalControlOfficer
              captures: { rr_id: $.data.id }
            - call: "POST /lost-found-reports/${rr_id}/match"
              payload: {}
              as: AnimalControlOfficer
          trigger:
            - call: "POST /lost-found-reports/${rr_id}/resolve"
              payload: {}
              as: AnimalControlOfficer
              captures: { rr_status: $.data.status }
          assert:
            - "LostFoundReport.${rr_id}.status == RESOLVED"
            - "LostFoundReport.${ff_id}.status == RESOLVED"

      - name: match_with_no_candidate_returns_no_match_candidate
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.LostFoundReport.OPEN_to_MATCHED
          - errors[ERR_NO_MATCH_CANDIDATE]
        distinguishing_aspect: "Matching a LOST report when the only counterpart scores below MATCH_MIN_SCORE (species-only=10) → 409 ERR_NO_MATCH_CANDIDATE."
        test_recipe:
          setup: ["LOST RZ (DOG, zip A) and FOUND FZ (DOG, zip B) — species match only, score 10 < 20"]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: AnimalControlOfficer
            - call: "POST /lost-found-reports"
              payload: { report_type: "FOUND", species: "DOG", zip_seen: "70000", reported_at: "2026-03-01T08:00:00Z" }
              as: AnimalControlOfficer
              captures: { fz_id: $.data.id }
            - call: "POST /lost-found-reports"
              payload: { report_type: "LOST", species: "DOG", zip_seen: "71111", reported_at: "2026-03-01T07:00:00Z" }
              as: AnimalControlOfficer
              captures: { rz_id: $.data.id }
          trigger:
            - call: "POST /lost-found-reports/${rz_id}/match"
              payload: {}
              as: AnimalControlOfficer
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_NO_MATCH_CANDIDATE"
            - "LostFoundReport.${rz_id}.status == OPEN"

      - name: appeal_cycle_uphold_branch
        claim_type: cyclic
        grounds: [state_machines.DangerousDogCase.DESIGNATED_to_APPEALED, state_machines.DangerousDogCase.APPEALED_to_DESIGNATED]
        excluded_because:
          difficulty_instance: non_linear_state_machine / dangerous_dog_designation_appeal_cycle
          rationale: "The DESIGNATED→APPEALED→DESIGNATED cycle is exercised by the named §1.8 non-linear-state-machine instance."

  # ===========================================================================
  - section: calculations
    instances:
      - name: dangerous_surcharge_nuisance_hits_floor
        claim_type: Constants Applied
        grounds: [calculations.dangerous_surcharge, entities.DangerousDogCase.fields.surcharge_cents]
        distinguishing_aspect: "A NUISANCE designation computes raw 5000*0.5=2500 then floors to SURCHARGE_MIN_CENTS=3000; surcharge_cents==3000."
        test_recipe:
          setup: ["pet with a NUISANCE case driven to DESIGNATED"]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: AnimalControlOfficer
            - call: "POST /owners"
              payload: { full_name: "Y Owner", email: "yo@x.com", address_zip: "10019" }
              as: LicensingClerk
              captures: { yo_id: $.data.id }
            - call: "POST /pets"
              payload: { owner_id: "${yo_id}", name: "Noisy", species: "DOG", breed: "B", is_altered: false, birth_date: "2022-01-01T00:00:00Z" }
              as: Owner
              as_user_id: "${yo_id}"
              captures: { yp_id: $.data.id }
            - call: "POST /dangerous-dog-cases"
              payload: { pet_id: "${yp_id}", incident_summary: "barking", severity: "NUISANCE" }
              as: AnimalControlOfficer
              captures: { yc_id: $.data.id }
            - call: "POST /dangerous-dog-cases/${yc_id}/investigate"
              payload: {}
              as: AnimalControlOfficer
          trigger:
            - call: "POST /dangerous-dog-cases/${yc_id}/designate"
              payload: {}
              as: AnimalControlOfficer
              captures: { sur: $.data.surcharge_cents }
          assert:
            - "DangerousDogCase.${yc_id}.surcharge_cents == 3000"

      - name: altered_pet_individual_fee_half_rate
        claim_type: Correct Result
        grounds: [calculations.license_fee, entities.License.fields.provisional_fee_cents]
        distinguishing_aspect: "An INDIVIDUAL license for an altered pet stamps provisional_fee_cents=2000 (4000 base * 0.5 altered factor)."
        test_recipe:
          setup: ["owner + altered pet + INDIVIDUAL license in DRAFT"]
          setup_api_calls:
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: LicensingClerk
            - call: "POST /owners"
              payload: { full_name: "Z Owner", email: "zo@x.com", address_zip: "10020" }
              as: LicensingClerk
              captures: { zo_id: $.data.id }
            - call: "POST /pets"
              payload: { owner_id: "${zo_id}", name: "Fix", species: "CAT", breed: "B", is_altered: true, birth_date: "2024-01-01T00:00:00Z" }
              as: Owner
              as_user_id: "${zo_id}"
              captures: { zp_id: $.data.id }
            - call: "POST /licenses"
              payload: { owner_id: "${zo_id}", pet_id: "${zp_id}", license_kind: "INDIVIDUAL", term_years: 1 }
              as: Owner
              as_user_id: "${zo_id}"
              captures: { zl_id: $.data.id }
          trigger:
            - call: "POST /licenses/${zl_id}/submit"
              payload: {}
              as: Owner
              as_user_id: "${zo_id}"
              captures: { prov: $.data.provisional_fee_cents }
          assert:
            - "License.${zl_id}.provisional_fee_cents == 2000"

      - name: tag_exact_match_dominates_selection
        claim_type: Correct Result
        grounds: [calculations.lost_found_match]
        excluded_because:
          difficulty_instance: combinatorial_formula / lost_found_match_multi_input_nonlinear_selection
          rationale: "Tag-exact (130) beating species+zip (30) is the core assertion of the named §1.8 combinatorial instance."

      - name: kennel_discount_nested_rounding
        claim_type: Precision
        grounds: [calculations.license_fee]
        excluded_because:
          difficulty_instance: combinatorial_formula / kennel_fee_nested_rounding_order_pinned
          rationale: "The two-step round-after-base then round-after-discount order is the named §1.8 combinatorial instance."

      - name: late_penalty_tier_boundary
        claim_type: Precision
        grounds: [calculations.late_penalty]
        excluded_because:
          difficulty_instance: boundary_precision_check / late_penalty_tier_boundary_at_30_days
          rationale: "The days_late<=30 TIER_1 boundary is the named §1.8 boundary-precision instance."

  # ===========================================================================
  - section: validations
    instances:
      - name: attach_vaccination_pet_mismatch_returns_vaccination_mismatch
