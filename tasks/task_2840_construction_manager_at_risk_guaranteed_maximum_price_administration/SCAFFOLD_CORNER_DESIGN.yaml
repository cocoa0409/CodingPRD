        grounds:
          - segregation_of_duties_rules.classifier-is-not-submitter
          - validations.priority_80
          - endpoints.POST_/change-events/{id}/classify
        distinguishing_aspect: |
          classify is shared between the CM and the owner precisely so either side may decide who
          bears the cost - which makes the identity check the only thing standing between a CM
          operator and self-classifying its own change event as CONTINGENCY_USE_OWNER. Because
          submitted_by_user_id is overwritten on every resubmission, the forbidden identity MOVES:
          the operator who submitted the first time is free to classify once someone else has
          resubmitted after a revision request.
        test_recipe:
          setup:
            - "empty database"
            - "logical clock at 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "Harborview Clinic", owner_org: "Harborview Health", cm_fee_pct: 0.04, insurance_rate: 0.01 }
              as: ProgramAdmin
              captures: { proj: $.data.id, pv1: $.data.version }
            - call: "POST /estimates"
              payload: { project_id: "${proj}", milestone_code: "SD", submitted_cost_of_work: 1000000.00, expected_project_version: "${pv1}" }
              as: ConstructionManager
              captures: { est: $.data.id }
            - call: "POST /estimates/${est}/submit"
              payload: {}
              as: ConstructionManager
            - call: "POST /estimates/${est}/reconcile"
              payload: { decision: "ACCEPT" }
              as: OwnerRepresentative
            - call: "GET /projects/${proj}"
              payload: {}
              as: ConstructionManager
              captures: { pv2: $.data.version }
            - call: "POST /gmp-proposals"
              payload: { project_id: "${proj}", based_on_estimate_id: "${est}", cost_of_work_total: 1000000.00, general_conditions_total: 100000.00, owner_contingency_amount: 50000.00, construction_contingency_amount: 40000.00, expected_project_version: "${pv2}" }
              as: ConstructionManager
              captures: { prop: $.data.id }
            - call: "POST /gmp-proposals/${prop}/submit"
              payload: {}
              as: ConstructionManager
            - call: "POST /gmp-proposals/${prop}/decide"
              payload: { decision: "EXECUTE" }
              as: OwnerRepresentative
            - call: "POST /change-events"
              payload: { project_id: "${proj}", description: "differing site condition at the west footings", estimated_amount: 18000.00, origin: "FIELD_CONDITION" }
              as: ConstructionManager
              captures: { ce: $.data.id }
            - call: "POST /change-events/${ce}/submit"
              payload: { submit_note: "priced from the geotech report" }
              as: ConstructionManager
              as_user_id: "cm-pm-1"
            - call: "POST /change-events/${ce}/review"
              payload: { action: "BEGIN_REVIEW" }
              as: OwnerRepresentative
              as_user_id: "owner-1"
          trigger:
            - call: "POST /change-events/${ce}/classify"
              payload: { classification: "CONTINGENCY_USE_OWNER" }
              as: ConstructionManager
              as_user_id: "cm-pm-1"
              captures: { e1: $.data.error_id }
            - call: "POST /change-events/${ce}/review"
              payload: { action: "REQUEST_REVISION", review_note: "resubmit with the geotech backup attached" }
              as: OwnerRepresentative
              as_user_id: "owner-1"
            - call: "POST /change-events/${ce}/submit"
              payload: { submit_note: "geotech backup attached" }
              as: ConstructionManager
              as_user_id: "cm-pm-2"
            - call: "POST /change-events/${ce}/review"
              payload: { action: "BEGIN_REVIEW" }
              as: OwnerRepresentative
              as_user_id: "owner-1"
            - call: "POST /change-events/${ce}/classify"
              payload: { classification: "CONTINGENCY_USE_OWNER" }
              as: ConstructionManager
              as_user_id: "cm-pm-1"
          assert:
            - "trigger call 1 returns 403 with data.error_id == ERR_SEGREGATION_OF_DUTIES: cm-pm-1 submitted this event, and ConstructionManager is otherwise a permitted classifier"
            - "after trigger call 1 ChangeEvent.${ce}.status is still UNDER_REVIEW, classification is still null and no ContingencyDraw exists"
            - "trigger call 3 returns 200 with submitted_by_user_id == cm-pm-2, overwriting cm-pm-1, and revision_count == 1"
            - "trigger call 5 returns 200 with status == CLASSIFIED, classification == CONTINGENCY_USE_OWNER and classified_by_user_id == cm-pm-1: the same operator that was forbidden a moment ago is now permitted, because the identity the rule compares against has moved"
            - "one ContingencyDraw now exists with contingency_type == OWNER, status == REQUESTED, amount == 18000.00, origin == CHANGE_EVENT_CLASSIFICATION and requires_owner_approval == true (unconditional for the OWNER pot, even though 18000.00 is below DRAW_OWNER_APPROVAL_THRESHOLD 50000.00)"
            - "CmarProject.${proj}.owner_contingency_remaining is still 50000.00: a REQUESTED draw has not moved the ledger"

  # ===================================================================
  # complexity_profile.complexity_layers = [dual_variant_calculation,
  # cascading_side_effects, derived_field_reconciliation, optimistic_concurrency].
  # The three §1.2.1 concurrency_rules each get their own optimistic_concurrency instance,
  # keyed on that rule's declared write_endpoint and occ_field.
  - section: complexity_layers
    instances:
      - name: estimate_creation_rejects_a_project_version_the_client_last_observed_before_a_sibling_write
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.estimate-create-stale-project
          - endpoints.POST_/estimates
        distinguishing_aspect: |
          A new estimate for a milestone legitimately supersedes the prior non-reconciled estimate
          for that same milestone, so no state precondition blocks the second write - the stale
          version token is the ONLY thing that does. The refused write must also leave the project
          version untouched, so the token the client already holds becomes valid again the moment it
          re-reads, and a failed attempt cannot poison the sequence.
        test_recipe:
          setup:
            - "empty database"
            - "logical clock at 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "Harborview Clinic", owner_org: "Harborview Health", cm_fee_pct: 0.04, insurance_rate: 0.01 }
              as: ProgramAdmin
              captures: { proj: $.data.id, pv1: $.data.version }
            - call: "POST /estimates"
              payload: { project_id: "${proj}", milestone_code: "SD", submitted_cost_of_work: 1000000.00, expected_project_version: "${pv1}" }
              as: ConstructionManager
              captures: { sd: $.data.id }
          trigger:
            - call: "POST /estimates"
              payload: { project_id: "${proj}", milestone_code: "SD", submitted_cost_of_work: 1010000.00, expected_project_version: "${pv1}" }
              as: ConstructionManager
              captures: { e1: $.data.error_id }
            - call: "GET /projects/${proj}"
              payload: {}
              as: ConstructionManager
              captures: { pv2: $.data.version }
            - call: "POST /estimates"
              payload: { project_id: "${proj}", milestone_code: "SD", submitted_cost_of_work: 1010000.00, expected_project_version: "${pv2}" }
              as: ConstructionManager
              captures: { sd2: $.data.id }
          assert:
            - "trigger call 1 returns 412 with data.error_id == ERR_STALE_PROJECT_VERSION: ${pv1} was already consumed by the first estimate write"
            - "after trigger call 1 GET /estimates?project_id=${proj} returns total_count == 1 and ProgressiveEstimate.${sd}.superseded_by_estimate_id is null"
            - "trigger call 2 shows ${pv2} == ${pv1} + 1: the refused write did not increment the project version, only the successful first estimate did"
            - "trigger call 3 returns 201 and ProgressiveEstimate.${sd}.superseded_by_estimate_id == ${sd2}: the supersede the stale writer would have performed blind is now performed with the correct token"
            - "CmarProject.${proj}.version == ${pv2} + 1 after trigger call 3"

      - name: gmp_proposal_creation_rejects_a_project_version_that_predates_the_pricing_it_would_discard
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.gmp-proposal-create-stale-project
          - endpoints.POST_/gmp-proposals
        distinguishing_aspect: |
          A second BASE proposal supersedes the first, which means a stale writer would silently
          discard pricing outputs it never saw. The refusal must therefore land at priority 55 with
          412 before the priority-61 execution gate is even consulted, and the first proposal's four
          computed money fields must survive the attempt byte for byte.
        test_recipe:
          setup:
            - "empty database"
            - "logical clock at 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "Harborview Clinic", owner_org: "Harborview Health", cm_fee_pct: 0.04, insurance_rate: 0.01 }
              as: ProgramAdmin
              captures: { proj: $.data.id, pv1: $.data.version }
            - call: "POST /estimates"
              payload: { project_id: "${proj}", milestone_code: "SD", submitted_cost_of_work: 1000000.00, expected_project_version: "${pv1}" }
              as: ConstructionManager
              captures: { est: $.data.id }
            - call: "POST /estimates/${est}/submit"
              payload: {}
              as: ConstructionManager
            - call: "POST /estimates/${est}/reconcile"
              payload: { decision: "ACCEPT" }
              as: OwnerRepresentative
            - call: "GET /projects/${proj}"
              payload: {}
              as: ConstructionManager
              captures: { pv2: $.data.version }
            - call: "POST /gmp-proposals"
              payload: { project_id: "${proj}", based_on_estimate_id: "${est}", cost_of_work_total: 1000000.00, general_conditions_total: 100000.00, owner_contingency_amount: 50000.00, construction_contingency_amount: 40000.00, expected_project_version: "${pv2}" }
              as: ConstructionManager
              captures: { prop1: $.data.id }
          trigger:
            - call: "POST /gmp-proposals"
              payload: { project_id: "${proj}", based_on_estimate_id: "${est}", cost_of_work_total: 1020000.00, general_conditions_total: 100000.00, owner_contingency_amount: 50000.00, construction_contingency_amount: 40000.00, expected_project_version: "${pv2}" }
              as: ConstructionManager
              captures: { e1: $.data.error_id }
            - call: "GET /projects/${proj}"
              payload: {}
              as: ConstructionManager
              captures: { pv3: $.data.version }
            - call: "POST /gmp-proposals"
              payload: { project_id: "${proj}", based_on_estimate_id: "${est}", cost_of_work_total: 1020000.00, general_conditions_total: 100000.00, owner_contingency_amount: 50000.00, construction_contingency_amount: 40000.00, expected_project_version: "${pv3}" }
              as: ConstructionManager
              captures: { prop2: $.data.id }
          assert:
            - "trigger call 1 returns 412 with data.error_id == ERR_STALE_PROJECT_VERSION"
            - "GmpProposal.${prop1}.status is still DRAFT with gmp_amount 1245897.60, insurance_amount 11440.00, cm_fee_amount 44457.60 and provisional_fee_amount 44000.00 - the refused write superseded nothing"
            - "trigger call 2 shows ${pv3} == ${pv2} + 1"
            - "trigger call 3 returns 201; GmpProposal.${prop1}.status == SUPERSEDED with superseded_by_proposal_id == ${prop2}, and ${prop2}.gmp_amount == 1266913.92 (base 1120000.00, provisional_fee_amount 44800.00, insurance_amount 11648.00, cm_fee_amount 45265.92, plus the two 50000.00 / 40000.00 contingency pots, repriced through calculations.gmp_establishment_pricing)"
            - "CmarProject.${proj}.gmp_status is still PRECONSTRUCTION throughout: neither proposal has been submitted"

      - name: subcontract_creation_rejects_a_work_package_version_that_predates_the_award
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.subcontract-create-stale-work-package
          - endpoints.POST_/subcontracts
        distinguishing_aspect: |
          This rule's parent is the WorkPackage, not the project, and the award cascade rewrites
          awarded_amount and awarded_bid_id behind the client's back - so the version a client held
          while the package was still SOLICITING is exactly the evidence that it priced the
          subcontract against a package it no longer understands. The refusal is
          ERR_STALE_WORK_PACKAGE_VERSION at 412, a different code from the project-level rule.
        test_recipe:
          setup:
            - "empty database"
            - "logical clock at 2026-08-01T00:00:00Z, advanced to 2026-08-15T00:00:00Z"
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "Harborview Clinic", owner_org: "Harborview Health", cm_fee_pct: 0.04, insurance_rate: 0.01 }
              as: ProgramAdmin
              captures: { proj: $.data.id, pv1: $.data.version }
            - call: "POST /estimates"
              payload: { project_id: "${proj}", milestone_code: "SD", submitted_cost_of_work: 1000000.00, expected_project_version: "${pv1}" }
              as: ConstructionManager
              captures: { est: $.data.id }
            - call: "POST /estimates/${est}/submit"
              payload: {}
              as: ConstructionManager
            - call: "POST /estimates/${est}/reconcile"
              payload: { decision: "ACCEPT" }
              as: OwnerRepresentative
            - call: "GET /projects/${proj}"
              payload: {}
              as: ConstructionManager
              captures: { pv2: $.data.version }
            - call: "POST /gmp-proposals"
              payload: { project_id: "${proj}", based_on_estimate_id: "${est}", cost_of_work_total: 1000000.00, general_conditions_total: 100000.00, owner_contingency_amount: 50000.00, construction_contingency_amount: 40000.00, expected_project_version: "${pv2}" }
              as: ConstructionManager
              captures: { prop: $.data.id }
            - call: "POST /gmp-proposals/${prop}/submit"
              payload: {}
              as: ConstructionManager
            - call: "POST /gmp-proposals/${prop}/decide"
              payload: { decision: "EXECUTE" }
              as: OwnerRepresentative
            - call: "POST /work-packages"
              payload: { project_id: "${proj}", trade_division: "03-CONCRETE", budget_amount: 500000.00, self_perform_intent: false }
              as: ConstructionManager
              captures: { wp: $.data.id }
            - call: "POST /work-packages/${wp}/solicit"
              payload: { solicitation_opens_at: "2026-08-01T00:00:00Z", solicitation_closes_at: "2026-08-15T00:00:00Z" }
              as: ConstructionManager
              captures: { wpv1: $.data.version }
            - call: "POST /self-perform-bids"
              payload: { work_package_id: "${wp}", bidder_type: "THIRD_PARTY", bidder_name: "Cascade Concrete", base_bid_amount: 460000.00, open_book_cost_breakdown: { labor: 200000.00, material: 180000.00, equipment: 40000.00, overhead: 25000.00, profit: 15000.00 } }
              as: ConstructionManager
              as_user_id: "cm-estimator-1"
              captures: { bid: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-15T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /self-perform-bids/${bid}/open"
              payload: {}
              as: ProcurementOfficer
              as_user_id: "po-1"
            - call: "POST /work-packages/${wp}/award"
              payload: { bid_id: "${bid}" }
              as: ProcurementOfficer
              as_user_id: "po-1"
          trigger:
            - call: "POST /subcontracts"
              payload: { work_package_id: "${wp}", awarded_bid_id: "${bid}", subcontractor_name: "Cascade Concrete", contract_amount: 460000.00, performance_start: "2026-09-01T00:00:00Z", performance_end: "2026-12-01T00:00:00Z", bond_required: false, expected_work_package_version: "${wpv1}" }
              as: ConstructionManager
              captures: { e1: $.data.error_id }
            - call: "GET /work-packages/${wp}"
              payload: {}
              as: ConstructionManager
              captures: { wpv2: $.data.version }
            - call: "POST /subcontracts"
              payload: { work_package_id: "${wp}", awarded_bid_id: "${bid}", subcontractor_name: "Cascade Concrete", contract_amount: 460000.00, performance_start: "2026-09-01T00:00:00Z", performance_end: "2026-12-01T00:00:00Z", bond_required: false, expected_work_package_version: "${wpv2}" }
              as: ConstructionManager
              captures: { sub: $.data.id }
          assert:
            - "trigger call 1 returns 412 with data.error_id == ERR_STALE_WORK_PACKAGE_VERSION, not ERR_STALE_PROJECT_VERSION: the OCC parent of this write is the WorkPackage"
            - "after trigger call 1 GET /subcontracts?work_package_id=${wp} returns total_count == 0 and WorkPackage.${wp}.committed_amount is still 0.00"
            - "trigger call 2 shows ${wpv2} == ${wpv1} + 1, the increment contributed by the award"
            - "trigger call 3 returns 201 with contract_status == ACTIVE, bond_claim_status == NOT_APPLICABLE, unpaid_committed_amount == 460000.00 and paid_to_date == 0.00"
            - "WorkPackage.${wp}.committed_amount == 460000.00 and version == ${wpv2} + 1 after trigger call 3"

      - name: cost_report_totals_are_recomputed_from_the_stored_lines_on_every_append
        claim_type: derived_field_reconciliation
        grounds:
          - endpoints.POST_/cost-reports/{id}/lines
          - entities.CostReport
          - calculations.cost_report_line_reconciliation
        distinguishing_aspect: |
          Four derived fields hang off one append-only lines array, and the disputed split must
          partition the reported total exactly: undisputed_cost_total + disputed_cost_total ==
          reported_cost_total after EVERY append, not just the last. Because lines are append-only
          there is no delete arm to test - the reconciliation instead has to survive a line whose
          extended amount only rounds correctly if the per-line round happens before the subtotal.
        test_recipe:
          setup:
            - "empty database"
            - "logical clock at 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "Harborview Clinic", owner_org: "Harborview Health", cm_fee_pct: 0.04, insurance_rate: 0.01 }
              as: ProgramAdmin
              captures: { proj: $.data.id, pv1: $.data.version }
            - call: "POST /estimates"
              payload: { project_id: "${proj}", milestone_code: "SD", submitted_cost_of_work: 1000000.00, expected_project_version: "${pv1}" }
              as: ConstructionManager
              captures: { est: $.data.id }
            - call: "POST /estimates/${est}/submit"
              payload: {}
              as: ConstructionManager
            - call: "POST /estimates/${est}/reconcile"
              payload: { decision: "ACCEPT" }
              as: OwnerRepresentative
            - call: "GET /projects/${proj}"
              payload: {}
              as: ConstructionManager
              captures: { pv2: $.data.version }
            - call: "POST /gmp-proposals"
              payload: { project_id: "${proj}", based_on_estimate_id: "${est}", cost_of_work_total: 1000000.00, general_conditions_total: 100000.00, owner_contingency_amount: 50000.00, construction_contingency_amount: 40000.00, expected_project_version: "${pv2}" }
              as: ConstructionManager
              captures: { prop: $.data.id }
            - call: "POST /gmp-proposals/${prop}/submit"
              payload: {}
              as: ConstructionManager
            - call: "POST /gmp-proposals/${prop}/decide"
              payload: { decision: "EXECUTE" }
              as: OwnerRepresentative
            - call: "POST /cost-reports"
              payload: { project_id: "${proj}", period_start: "2026-08-01T00:00:00Z", period_end: "2026-09-01T00:00:00Z" }
              as: ConstructionManager
              captures: { cr: $.data.id }
          trigger:
            - call: "POST /cost-reports/${cr}/lines"
              payload: { cost_code: "03-100", quantity: 100, unit_rate: 200.0000, markup_pct: 0.0000, disputed: false }
              as: ConstructionManager
            - call: "POST /cost-reports/${cr}/lines"
              payload: { cost_code: "03-200", quantity: 3, unit_rate: 1234.5678, markup_pct: 0.1000, disputed: true }
              as: ConstructionManager
            - call: "POST /cost-reports/${cr}/lines"
              payload: { cost_code: "03-300", quantity: 7, unit_rate: 99.9950, markup_pct: 0.0000, disputed: false }
              as: ConstructionManager
            - call: "GET /cost-reports/${cr}"
              payload: {}
              as: IndependentAuditor
          assert:
            - "after trigger call 1: line_count == 1, line_seq == 1, line_amount == 20000.00, reported_cost_total == 20000.00, undisputed_cost_total == 20000.00, disputed_cost_total == 0.00"
            - "after trigger call 2: line_count == 2, line_seq == 2, line_amount == 4074.07 (round(3 * 1234.5678 * 1.1000, 2) on the exact product 4074.07374), reported_cost_total == 24074.07, undisputed_cost_total == 20000.00, disputed_cost_total == 4074.07"
            - "after trigger call 3: line_count == 3, line_amount == 699.97 (round(699.965, 2) ROUND_HALF_UP, not 699.96), reported_cost_total == 24774.04, undisputed_cost_total == 20699.97, disputed_cost_total == 4074.07"
            - "undisputed_cost_total + disputed_cost_total == reported_cost_total holds after every one of the three appends"
            - "trigger call 4 returns the same four figures from a fresh read and a lines array of length 3 with line_seq values 1, 2, 3 in append order"
            - "CostReport.${cr}.version == 3 after three appends and status is still OPEN"

      - name: the_five_level_default_cascade_end_to_end
        claim_type: cascading_side_effects
        excluded_because:
          difficulty_instance: subcontractor_default_five_level_cascade_to_held_cost_reports
          rationale: |
            The §1.8 instance already drives the deepest chain the scaffold declares - a single
            TERMINATE_FOR_DEFAULT moving the Subcontract, the WorkPackage, a newly minted
            ContingencyDraw, the project's contingency ledger and posture, and finally every OPEN
            CostReport into RECONCILIATION_HELD - and asserts each level's figures, so a second
            end-to-end cascade instance here would only restate it.

      - name: both_shared_savings_variants_over_the_same_ledger
        claim_type: dual_variant_calculation
        excluded_because:
          difficulty_instance: shared_savings_pre_audit_provisional_vs_post_audit_final_divergence
          rationale: |
            The §1.8 instance runs PRE_AUDIT_PROVISIONAL and POST_AUDIT_FINAL over one identical
            ledger and pins the delta the audit adjustment introduces, including which three fields
            each basis writes and which it leaves at 0.00 - that is exactly the dual-variant claim,
            and the buyout-savings variant pair is covered by its sibling §1.8 instance
            buyout_savings_trade_level_vs_project_net_divergence.

  # ===================================================================
  # complexity_profile.consistency_model == immediate.
  - section: consistency_model
    instances:
      - name: every_derived_field_a_write_moves_is_visible_in_that_write_s_own_response
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints.POST_/change-events/{id}/classify
          - endpoints.POST_/contingency-draws/{id}/post
        distinguishing_aspect: |
          Under immediate consistency there is no settling period and no re-read requirement: the
          classify response already carries the moved change event, the minted draw is already
          discoverable through its list endpoint in the very next call, and the post response's
          ledger figures match a subsequent independent read exactly. Nothing in this domain is
          allowed to be eventually consistent, because the contingency ledger is the thing being
          audited.
        test_recipe:
          setup:
            - "empty database"
            - "logical clock at 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /projects"
              payload: { name: "Harborview Clinic", owner_org: "Harborview Health", cm_fee_pct: 0.04, insurance_rate: 0.01 }
