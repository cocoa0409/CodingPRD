  # ==================================================================
  # Section: cross_cutting_complexity_layers
  # ==================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_order_version_on_drawing_create
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[drawing-create-stale-order]", "errors[ERR_STALE_ORDER_VERSION]"]
        distinguishing_aspect: "OCC on MillworkOrder.version: after the first drawing create bumps the order version (2 -> 3), a second create carrying the stale captured version 2 is rejected 412 ERR_STALE_ORDER_VERSION; a fresh read yields version 3 and the retry succeeds (the first drawing was voided, so the active-drawing gate passes)."
        test_recipe:
          setup: ["Order CONFIGURED (version 2 after configure); drawing D1 created with expected 2, then voided."]
          setup_api_calls:
            - { call: "POST /millwork/projects", payload: { name: "P", site_address: "1 Main St", contract_code: "CX-1" }, as: PlantManager, captures: { proj_id: $.data.id } }
            - { call: "POST /millwork/orders", payload: { project_id: "${proj_id}", order_code: "O-X1", species: "OAK", profile_code: "PR-1", finish_system: "STAIN", sheen_target: "SATIN", hardware_prep_mode: "INSTALLER_PREP", fire_rating_required: "NONE" }, as: Estimator, captures: { ord_id: $.data.id } }
            - { call: "POST /millwork/openings", payload: { order_id: "${ord_id}", opening_no: "1", width_in: 36, height_in: 84, fire_rating: "NONE", required_on_site_date: "2026-10-01" }, as: Estimator }
            - { call: "PUT /millwork/orders/${ord_id}/status", payload: { target_status: "CONFIGURED" }, as: Estimator, captures: { ord_v2: $.data.version } }
            - { call: "POST /millwork/shop-drawings", payload: { order_id: "${ord_id}", expected_order_version: "${ord_v2}" }, as: Estimator, captures: { drw1: $.data.id } }
            - { call: "PUT /millwork/shop-drawings/${drw1}/status", payload: { target_status: "VOID" }, as: Estimator }
          trigger:
            - { call: "POST /millwork/shop-drawings", payload: { order_id: "${ord_id}", expected_order_version: "${ord_v2}" }, as: Estimator, captures: { err: $.data.error_id } }
            - { call: "GET /millwork/orders/${ord_id}", as: Any, captures: { ord_v3: $.data.version } }
            - { call: "POST /millwork/shop-drawings", payload: { order_id: "${ord_id}", expected_order_version: "${ord_v3}" }, as: Estimator, captures: { drw2: $.data.id } }
          assert:
            - "captured ${err} == ERR_STALE_ORDER_VERSION (version advanced 2 -> 3 via the first create)"
            - "captured ${ord_v3} == 3 and ShopDrawing.${drw2}.status == DRAFT"
      - name: occ_stale_roll_version_on_label_issue
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[label-issue-stale-roll]", "errors[ERR_STALE_ROLL_VERSION]"]
        distinguishing_aspect: "OCC on FireLabelRoll.version: a first issue bumps the roll version; a second issue against another FINISHED opening carrying the stale captured version fails 412 ERR_STALE_ROLL_VERSION; re-reading the roll and retrying with the fresh version succeeds."
        test_recipe:
          setup: ["Rated MIN_20 order with two 1-leaf openings both FINISHED; UL_20MIN roll capacity 4."]
          setup_api_calls:
            - { call: "POST /millwork/projects", payload: { name: "P", site_address: "1 Main St", contract_code: "CX-2" }, as: PlantManager, captures: { proj_id: $.data.id } }
            - { call: "POST /millwork/hardware-templates", payload: { template_code: "T-X2", manufacturer: "ACME", fire_rated_compatible: true }, as: PlantManager, captures: { tmpl_id: $.data.id } }
            - { call: "POST /millwork/orders", payload: { project_id: "${proj_id}", order_code: "O-X2", species: "MAPLE", profile_code: "PR-7", finish_system: "STAIN", sheen_target: "SATIN", hardware_prep_mode: "TEMPLATE_PREP", hardware_template_id: "${tmpl_id}", fire_rating_required: "MIN_20" }, as: Estimator, captures: { ord_id: $.data.id } }
            - { call: "POST /millwork/openings", payload: { order_id: "${ord_id}", opening_no: "X1", width_in: 36, height_in: 84, leaf_count: 1, fire_rating: "MIN_20", required_on_site_date: "2026-10-01" }, as: Estimator, captures: { op1: $.data.id } }
            - { call: "POST /millwork/openings", payload: { order_id: "${ord_id}", opening_no: "X2", width_in: 32, height_in: 84, leaf_count: 1, fire_rating: "MIN_20", required_on_site_date: "2026-10-01" }, as: Estimator, captures: { op2: $.data.id } }
            - { call: "PUT /millwork/orders/${ord_id}/status", payload: { target_status: "CONFIGURED" }, as: Estimator }
            - { call: "GET /millwork/orders/${ord_id}", as: Any, captures: { ord_v: $.data.version } }
            - { call: "POST /millwork/shop-drawings", payload: { order_id: "${ord_id}", expected_order_version: "${ord_v}" }, as: Estimator, captures: { drw_id: $.data.id } }
            - { call: "PUT /millwork/shop-drawings/${drw_id}/status", payload: { target_status: "SUBMITTED" }, as: Estimator, as_user_id: "est-1" }
            - { call: "PUT /millwork/shop-drawings/${drw_id}/status", payload: { target_status: "APPROVED" }, as: Architect, as_user_id: "arch-1" }
            - { call: "POST /millwork/machining-programs", payload: { drawing_id: "${drw_id}", order_id: "${ord_id}", estimated_minutes: 60 }, as: ProductionLead, captures: { prog_id: $.data.id } }
            - { call: "POST /millwork/moulder-machines", payload: { machine_code: "M-X2", supported_species: ["MAPLE"] }, as: PlantManager, captures: { mach_id: $.data.id } }
            - { call: "POST /millwork/moulder-setup-slots", payload: { program_id: "${prog_id}", machine_id: "${mach_id}", start_hour: 8, end_hour: 9 }, as: ProductionLead, captures: { slot_id: $.data.id } }
            - { call: "PUT /millwork/moulder-setup-slots/${slot_id}/status", payload: { target_status: "COMPLETED" }, as: ProductionLead }
            - { call: "PUT /millwork/machining-programs/${prog_id}/status", payload: { target_status: "RELEASED" }, as: ProductionLead }
            - { call: "PUT /millwork/orders/${ord_id}/status", payload: { target_status: "IN_PRODUCTION" }, as: ProductionLead }
            - { call: "PUT /millwork/openings/${op1}/status", payload: { target_fab_status: "MACHINED" }, as: ProductionLead }
            - { call: "PUT /millwork/openings/${op2}/status", payload: { target_fab_status: "MACHINED" }, as: ProductionLead }
            - { call: "PUT /millwork/orders/${ord_id}/status", payload: { target_status: "FINISHING" }, as: ProductionLead }
            - { call: "POST /millwork/spray-booths", payload: { booth_code: "B-X2" }, as: PlantManager, captures: { booth_id: $.data.id } }
            - { call: "POST /millwork/finishing-batches", payload: { order_id: "${ord_id}", booth_id: "${booth_id}", cure_start_hour: 10, cure_end_hour: 14 }, as: ProductionLead, captures: { batch_id: $.data.id } }
            - { call: "PUT /millwork/finishing-batches/${batch_id}/status", payload: { target_status: "SPRAYED" }, as: ProductionLead }
            - { call: "PUT /millwork/finishing-batches/${batch_id}/status", payload: { target_status: "CURED" }, as: ProductionLead }
            - { call: "POST /millwork/finishing-batches/${batch_id}/measure", payload: { sheen_measured_gu: 35 }, as: QAInspector }
            - { call: "POST /millwork/fire-label-rolls", payload: { label_series: "UL_20MIN", serial_capacity: 4 }, as: PlantManager, captures: { roll_id: $.data.id, roll_v1: $.data.version } }
          trigger:
            - { call: "POST /millwork/label-allocations", payload: { opening_id: "${op1}", roll_id: "${roll_id}", expected_roll_version: "${roll_v1}" }, as: LabelAuthority, as_user_id: "la-1", captures: { alloc1: $.data.id } }
            - { call: "POST /millwork/label-allocations", payload: { opening_id: "${op2}", roll_id: "${roll_id}", expected_roll_version: "${roll_v1}" }, as: LabelAuthority, as_user_id: "la-1", captures: { err: $.data.error_id } }
            - { call: "GET /millwork/fire-label-rolls/${roll_id}", as: Any, captures: { roll_v2: $.data.version } }
            - { call: "POST /millwork/label-allocations", payload: { opening_id: "${op2}", roll_id: "${roll_id}", expected_roll_version: "${roll_v2}" }, as: LabelAuthority, as_user_id: "la-1", captures: { alloc2: $.data.id } }
          assert:
            - "captured ${err} == ERR_STALE_ROLL_VERSION"
            - "captured ${roll_v2} == 2 (first issue bumped the roll version)"
            - "LabelAllocation.${alloc2}.status == ISSUED (fresh version succeeds)"
      - name: version_pinning_snapshot_and_config_lock
        claim_type: version_pinning
        grounds: ["entities.ShopDrawing.fields.pinned_species", "errors[ERR_ORDER_CONFIG_LOCKED]", "errors[ERR_ORDER_NOT_CONFIGURED]"]
        distinguishing_aspect: "Version-pinning on approval: the drawing's pinned_* snapshot is fixed at creation (stays MAPLE after the order is edited to WALNUT while CONFIGURED); once the drawing is APPROVED the order's config is locked (PUT -> ERR_ORDER_CONFIG_LOCKED) and no new drawing may be created (ERR_ORDER_NOT_CONFIGURED)."
        test_recipe:
          setup: ["MAPLE order CONFIGURED; drawing D1 created (pins MAPLE); order then edited to WALNUT."]
          setup_api_calls:
            - { call: "POST /millwork/projects", payload: { name: "P", site_address: "1 Main St", contract_code: "CX-3" }, as: PlantManager, captures: { proj_id: $.data.id } }
            - { call: "POST /millwork/orders", payload: { project_id: "${proj_id}", order_code: "O-X3", species: "MAPLE", profile_code: "PR-7", finish_system: "STAIN", sheen_target: "SATIN", hardware_prep_mode: "INSTALLER_PREP", fire_rating_required: "NONE" }, as: Estimator, captures: { ord_id: $.data.id } }
            - { call: "POST /millwork/openings", payload: { order_id: "${ord_id}", opening_no: "1", width_in: 36, height_in: 84, fire_rating: "NONE", required_on_site_date: "2026-10-01" }, as: Estimator }
            - { call: "PUT /millwork/orders/${ord_id}/status", payload: { target_status: "CONFIGURED" }, as: Estimator }
            - { call: "GET /millwork/orders/${ord_id}", as: Any, captures: { ord_v1: $.data.version } }
            - { call: "POST /millwork/shop-drawings", payload: { order_id: "${ord_id}", expected_order_version: "${ord_v1}" }, as: Estimator, captures: { drw_id: $.data.id } }
            - { call: "PUT /millwork/orders/${ord_id}", payload: { species: "WALNUT" }, as: Estimator }
          trigger:
            - { call: "GET /millwork/shop-drawings/${drw_id}", as: Any, captures: { pinned: $.data.pinned_species } }
            - { call: "PUT /millwork/shop-drawings/${drw_id}/status", payload: { target_status: "SUBMITTED" }, as: Estimator, as_user_id: "est-1" }
            - { call: "PUT /millwork/shop-drawings/${drw_id}/status", payload: { target_status: "APPROVED" }, as: Architect, as_user_id: "arch-1" }
            - { call: "PUT /millwork/orders/${ord_id}", payload: { species: "OAK" }, as: Estimator, captures: { err_lock: $.data.error_id } }
            - { call: "GET /millwork/orders/${ord_id}", as: Any, captures: { ord_v2: $.data.version, ord_species: $.data.species } }
            - { call: "POST /millwork/shop-drawings", payload: { order_id: "${ord_id}", expected_order_version: "${ord_v2}" }, as: Estimator, captures: { err_nc: $.data.error_id } }
          assert:
            - "captured ${pinned} == MAPLE (snapshot frozen at creation despite the WALNUT edit)"
            - "captured ${err_lock} == ERR_ORDER_CONFIG_LOCKED (APPROVED orders reject config edits)"
            - "captured ${ord_species} == WALNUT (pre-approval edit persisted)"
            - "captured ${err_nc} == ERR_ORDER_NOT_CONFIGURED (no new drawing while APPROVED)"
      - name: order_cancel_full_cascade
        claim_type: cascading_side_effects
        grounds: ["state_machines.MillworkOrder"]
        distinguishing_aspect: "Cancelling an APPROVED order cascades through all children at once: opening CANCELLED on both axes, drawing SUPERSEDED, RELEASED program VOIDED, COMPLETED slot untouched (terminal), and a later read shows the cascade settled."
        test_recipe:
          setup: ["OAK order APPROVED; program RELEASED (slot COMPLETED); opening QUEUED."]
          setup_api_calls:
            - { call: "POST /millwork/projects", payload: { name: "P", site_address: "1 Main St", contract_code: "CX-4" }, as: PlantManager, captures: { proj_id: $.data.id } }
            - { call: "POST /millwork/orders", payload: { project_id: "${proj_id}", order_code: "O-X4", species: "OAK", profile_code: "PR-2", finish_system: "STAIN", sheen_target: "SATIN", hardware_prep_mode: "INSTALLER_PREP", fire_rating_required: "NONE" }, as: Estimator, captures: { ord_id: $.data.id } }
            - { call: "POST /millwork/openings", payload: { order_id: "${ord_id}", opening_no: "1", width_in: 36, height_in: 84, fire_rating: "NONE", required_on_site_date: "2026-10-01" }, as: Estimator, captures: { op1: $.data.id } }
            - { call: "PUT /millwork/orders/${ord_id}/status", payload: { target_status: "CONFIGURED" }, as: Estimator }
            - { call: "GET /millwork/orders/${ord_id}", as: Any, captures: { ord_v: $.data.version } }
            - { call: "POST /millwork/shop-drawings", payload: { order_id: "${ord_id}", expected_order_version: "${ord_v}" }, as: Estimator, captures: { drw_id: $.data.id } }
            - { call: "PUT /millwork/shop-drawings/${drw_id}/status", payload: { target_status: "SUBMITTED" }, as: Estimator, as_user_id: "est-1" }
            - { call: "PUT /millwork/shop-drawings/${drw_id}/status", payload: { target_status: "APPROVED" }, as: Architect, as_user_id: "arch-1" }
            - { call: "POST /millwork/machining-programs", payload: { drawing_id: "${drw_id}", order_id: "${ord_id}", estimated_minutes: 30 }, as: ProductionLead, captures: { prog_id: $.data.id } }
            - { call: "POST /millwork/moulder-machines", payload: { machine_code: "M-X4", supported_species: ["OAK"] }, as: PlantManager, captures: { mach_id: $.data.id } }
            - { call: "POST /millwork/moulder-setup-slots", payload: { program_id: "${prog_id}", machine_id: "${mach_id}", start_hour: 8, end_hour: 9 }, as: ProductionLead, captures: { slot_id: $.data.id } }
            - { call: "PUT /millwork/moulder-setup-slots/${slot_id}/status", payload: { target_status: "COMPLETED" }, as: ProductionLead }
            - { call: "PUT /millwork/machining-programs/${prog_id}/status", payload: { target_status: "RELEASED" }, as: ProductionLead }
          trigger:
            - { call: "PUT /millwork/orders/${ord_id}/status", payload: { target_status: "CANCELLED" }, as: Estimator, captures: { ord_st: $.data.status } }
            - { call: "GET /millwork/openings/${op1}", as: Any, captures: { op_fab: $.data.fab_status, op_ship: $.data.ship_status } }
            - { call: "GET /millwork/shop-drawings/${drw_id}", as: Any, captures: { drw_st: $.data.status } }
            - { call: "GET /millwork/machining-programs/${prog_id}", as: Any, captures: { prog_st: $.data.status } }
            - { call: "GET /millwork/moulder-setup-slots/${slot_id}", as: Any, captures: { slot_st: $.data.status } }
          assert:
            - "captured ${ord_st} == CANCELLED"
            - "captured ${op_fab} == CANCELLED and captured ${op_ship} == CANCELLED"
            - "captured ${drw_st} == SUPERSEDED"
            - "captured ${prog_st} == VOIDED (RELEASED program voided via cancel cascade)"
            - "captured ${slot_st} == COMPLETED (terminal slot untouched)"
      - name: booth_purge_covered
        claim_type: purge_rule
        grounds: ["calculations.booth_load_window", "errors[ERR_BOOTH_PURGE_VIOLATION]"]
        excluded_because:
          difficulty_instance: booth_create_safety_beats_fiscal
          rationale: "Cross-family overlap purge asserted as the winning error in the named §1.8 priority instance."
      - name: machine_overlap_and_buffer_covered
        claim_type: overlap_rule
        grounds: ["calculations.slot_changeover_window"]
        excluded_because:
          difficulty_instance: moulder_slot_exclusive_overlap_and_changeover_buffer
          rationale: "Overlap rejection, same-family adjacency, buffer violation, and exact-buffer acceptance asserted in the named §1.8 instance."
      - name: booth_capacity_covered
        claim_type: overlap_rule
        grounds: ["calculations.booth_load_window"]
        excluded_because:
          difficulty_instance: spray_booth_aggregate_capacity_and_purge
          rationale: "Aggregate capacity boundary (2 allowed, 3rd rejected, adjacency allowed) asserted in the named §1.8 instance."
      - name: label_boundary_covered
        claim_type: threshold_boundary
        grounds: ["errors[ERR_INSUFFICIENT_LABEL_SERIALS]"]
        excluded_because:
          difficulty_instance: label_serial_exact_availability_boundary
          rationale: "Exact-availability boundary asserted in the named §1.8 instance."
      - name: truck_boundary_covered
        claim_type: threshold_boundary
        grounds: ["errors[ERR_TRUCK_CAPACITY_EXCEEDED]"]
        excluded_because:
          difficulty_instance: truck_leaf_capacity_exact_boundary
          rationale: "Exact-capacity boundary asserted in the named §1.8 instance."
      - name: species_unsupported_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_MACHINE_SPECIES_UNSUPPORTED]"]
        excluded_because:
          difficulty_instance: slot_booking_safety_beats_constraint
          rationale: "Species capability error asserted as priority winner in the named §1.8 instance."
      - name: finish_gate_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_OPENING_NOT_FINISH_PASSED]"]
        excluded_because:
          difficulty_instance: label_issue_state_beats_fiscal
          rationale: "FINISHED gate asserted as priority winner in the named §1.8 instance."
      - name: drawing_gate_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_DRAWING_NOT_APPROVED]"]
        excluded_because:
          difficulty_instance: program_create_requires_approved_drawing
          rationale: "Drawing-approval gate asserted fail-then-succeed in the named §1.8 instance."
      - name: staged_gate_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_OPENING_NOT_STAGED]"]
        excluded_because:
          difficulty_instance: trip_assign_requires_staged_opening
          rationale: "STAGED gate asserted fail-then-succeed in the named §1.8 instance."

  # ==================================================================
  # Section: consistency_model
  # ==================================================================
  - section: consistency_model
    instances:
      - name: immediate_consistency_read_after_write
        claim_type: immediate_visibility
        grounds: ["complexity_profile.consistency_model"]
        distinguishing_aspect: "Immediate consistency: the mutation response itself carries the post-transition state (CONFIGURED with budget_quote_cents already computed), and an immediate GET returns identical values — no lag, no reconciliation delay."
        test_recipe:
          setup: ["Order with one 2-leaf OAK opening."]
          setup_api_calls:
            - { call: "POST /millwork/projects", payload: { name: "P", site_address: "1 Main St", contract_code: "CCY-1" }, as: PlantManager, captures: { proj_id: $.data.id } }
            - { call: "POST /millwork/orders", payload: { project_id: "${proj_id}", order_code: "O-CY1", species: "OAK", profile_code: "PR-1", finish_system: "STAIN", sheen_target: "SATIN", hardware_prep_mode: "INSTALLER_PREP", fire_rating_required: "NONE" }, as: Estimator, captures: { ord_id: $.data.id } }
            - { call: "POST /millwork/openings", payload: { order_id: "${ord_id}", opening_no: "1", width_in: 36, height_in: 84, leaf_count: 2, fire_rating: "NONE", required_on_site_date: "2026-10-01" }, as: Estimator }
          trigger:
            - { call: "PUT /millwork/orders/${ord_id}/status", payload: { target_status: "CONFIGURED" }, as: Estimator, captures: { resp_st: $.data.status, resp_budget: $.data.budget_quote_cents } }
            - { call: "GET /millwork/orders/${ord_id}", as: Any, captures: { get_st: $.data.status, get_budget: $.data.budget_quote_cents } }
          assert:
            - "captured ${resp_st} == CONFIGURED and captured ${get_st} == CONFIGURED"
            - "captured ${resp_budget} == 132106 and captured ${get_budget} == 132106 (round_half_up(2*42000*1.12*1.08)=101606, +5500 hardware, +25000 flat freight)"
            - "captured ${resp_budget} == captured ${get_budget}"
