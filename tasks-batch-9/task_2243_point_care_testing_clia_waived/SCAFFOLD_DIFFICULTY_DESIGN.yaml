            - "TestSite.${site_id}.oversight_posture == RESTRICTED"
            - "TestSite.${site_id}.manual_entry_blocked == true"
            - "Device.${dev2_id}.status == ACTIVE and Device.${dev2_id}.manual_entry_suspended == true"
            - "Device.${dev1_id}.manual_entry_suspended == false (the flag is set only on MANUAL_ENTRY devices)"
            - "ReagentLot.${lot1_id}.verification_status == VERIFIED (a failed QC on a verified lot does not re-quarantine it)"

