# =============================================================================
# SCAFFOLD.yaml — Task 1115: Low-Speed Vehicle & Golf Cart Community Program
# §1.0–§1.7 seed tables. Difficulty design lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml;
# corner design lives in SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  1115. Low-Speed Vehicle & Golf Cart Community Program (golf cart community ordinance): community eligibility & street designation rules, vehicle registration, inspection & safety equipment requirements, driver age & license verification, path/route designation & parking rules, violation enforcement & permit revocation, insurance requirement documentation, charging infrastructure & shared fleet option, annual renewal

domain_name: low-speed-vehicle-golf-cart-community
api_prefix: /api

# =============================================================================
# §0 Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: compliance_audit        # ordinance enforcement: age/license gates, points, revocation, audit trail
  secondary_archetype: temporal_windowing    # half-open route passes, closed+buffer charging, closed dispatch windows
  complexity_layers:
    - cascading_side_effects                 # violation -> points -> standing -> registration -> route pass
    - dual_variant_calculation               # provisional vs finalized fee; provisional vs audited compliance score
    - optimistic_concurrency                 # OCC on Community.version and PermitHolder.version
    - rate_threshold_triggers                # points standing thresholds, inspection pass threshold, fee tiers
  entity_topology: flat                      # peer entities linked by FK; no nested URL ownership chains
  state_machine_shape: cyclic                # VehicleRegistration cycles ACTIVE->RENEWAL_PENDING->ACTIVE and ACTIVE->SUSPENDED->ACTIVE; PermitHolder carries two independent state dimensions
  relationship_patterns:
    - one_to_many                            # PermitHolder -> Vehicle -> VehicleRegistration -> Inspection
    - cross_aggregate                        # RoutePass -> Registration+Route; FleetDispatch -> FleetVehicle+PermitHolder
  role_model: peer_roles                     # PermitHolder / CommunityAdmin / Inspector / EnforcementOfficer / PlatformAdmin own disjoint operations
  consistency_model: immediate               # every mutation (incl. cascades) is atomic in the request and visible in the response
  entity_count: 13
  endpoint_count: 65
  error_code_count: 24
  role_count: 6

# =============================================================================
# §1.1 Entity-Relationship Table
# common_fields: true expands to id (server-minted UUID, no prefix), created_at,
# updated_at (ISO 8601 UTC, 3 fractional digits), version (integer from 1).
# =============================================================================
entities:
  - name: Community
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Community display name" }
      - { name: min_driver_age, type: integer, source: input, description: "Minimum driver age in whole years; eligibility requires age >= min_driver_age", default: 16, constraints: "12..25" }
      - { name: insurance_required, type: boolean, source: input, description: "Whether an ACTIVE insurance policy is required to activate/reinstate a registration", default: true }
      - { name: fleet_program_enabled, type: boolean, source: input, description: "Whether the shared fleet option is offered; also gates the provisional-fee fleet discount assumption", default: false }
      - { name: min_liability_coverage_cents, type: integer, source: input, description: "Minimum liability coverage an insurance policy must document", default: 10000000 }
      - { name: renewal_window_days, type: integer, source: input, description: "Renewal opens this many days before expiry_date (inclusive boundary)", default: 60 }
      - { name: late_grace_days, type: integer, source: input, description: "After expiry, late renewal allowed for this many days (inclusive)", default: 90 }
      - { name: checked_out_count, type: integer, source: computed, description: "Number of FleetVehicle rows in this community with status CHECKED_OUT; incremented on dispatch checkout, decremented on return", default: 0 }

  - name: PermitHolder
    parent: null
    common_fields: true
    fields:
      - { name: community_id, type: string, source: input, description: "FK -> Community.id; community this holder belongs to" }
      - { name: full_name, type: string, source: input, description: "Legal full name" }
      - { name: birth_date, type: string, source: input, description: "ISO 8601 date YYYY-MM-DD; age computed against the logical clock" }
      - { name: driver_license_class, type: enum, source: input, description: "NONE | STANDARD | MOTORCYCLE", constraints: "eligibility requires class != NONE" }
      - { name: eligibility_status, type: enum, source: system, description: "PENDING_VERIFICATION | ELIGIBLE | SUSPENDED | REVOKED — independent state dimension 1" }
      - { name: compliance_status, type: enum, source: computed, description: "GOOD_STANDING | PROBATION | BARRED — independent state dimension 2, derived from points_balance thresholds" }
      - { name: points_balance, type: integer, source: computed, description: "Sum of points_assessed over UPHELD violations with occurred_at within trailing 730 days of now", default: 0 }
      - { name: wallet_balance_cents, type: integer, source: computed, description: "Prepaid balance; debited by fees/fines, credited by deposits and refunds; never negative", default: 0 }

  - name: Vehicle
    parent: null
    common_fields: true
    fields:
      - { name: holder_id, type: string, source: input, description: "FK -> PermitHolder.id; owning holder" }
      - { name: vehicle_type, type: enum, source: input, description: "GOLF_CART | LSV" }
      - { name: seat_count, type: integer, source: input, description: "Passenger seats", constraints: "1..8" }
      - { name: has_headlights, type: boolean, source: input, description: "Headlights installed" }
      - { name: has_brake_lights, type: boolean, source: input, description: "Brake lights installed" }
      - { name: has_turn_signals, type: boolean, source: input, description: "Turn signals installed" }
      - { name: has_horn, type: boolean, source: input, description: "Horn installed" }
      - { name: has_windshield, type: boolean, source: input, description: "Windshield installed" }
      - { name: has_seatbelts, type: boolean, source: input, description: "Seatbelts installed" }
      - { name: has_reflectors, type: boolean, source: input, description: "Reflectors installed" }
      - { name: mirror_count, type: integer, source: input, description: "Number of mirrors installed; 0 means the mirrors equipment item is absent", constraints: "0..4" }
      - { name: equipment_count, type: integer, source: computed, description: "Count of the 8 equipment items present: 7 booleans true plus (mirror_count >= 1 ? 1 : 0)" }
      - { name: vehicle_status, type: enum, source: system, description: "ACTIVE | RETIRED" }

  - name: VehicleRegistration
    parent: null
    common_fields: true
    fields:
      - { name: vehicle_id, type: string, source: input, description: "FK -> Vehicle.id; registered vehicle" }
      - { name: holder_id, type: string, source: input, description: "FK -> PermitHolder.id; must equal Vehicle.holder_id at creation" }
      - { name: registration_year, type: integer, source: input, description: "Calendar year of registration", constraints: "2020..2100" }
      - { name: status, type: enum, source: system, description: "DRAFT | ACTIVE | RENEWAL_PENDING | SUSPENDED | EXPIRED | REVOKED" }
      - { name: provisional_fee_cents, type: integer, source: computed, description: "annual_registration_fee PROVISIONAL variant (declared equipment, fleet discount assumed when program enabled)" }
      - { name: finalized_fee_cents, type: integer, source: computed, description: "annual_registration_fee FINALIZED variant; null until an inspection PASSED (or an EXPIRED renew)", default: null }
      - { name: late_fee_cents, type: integer, source: computed, description: "late_renewal_fee output; 0 unless renewed from EXPIRED", default: 0 }
      - { name: total_due_cents, type: integer, source: computed, description: "Amount debited at activate / finalize-renewal: finalized_fee_cents + late_fee_cents subject to the 2x cap", default: 0 }
      - { name: paid_cents, type: integer, source: computed, description: "Cumulative wallet debits applied to this registration", default: 0 }
      - { name: renewal_score_provisional, type: number, source: computed, description: "renewal_compliance_score PROVISIONAL variant; null until renew", default: null }
      - { name: renewal_score_audited, type: number, source: computed, description: "renewal_compliance_score AUDITED variant; null until finalize-renewal", default: null }
      - { name: valid_from, type: datetime, source: system, description: "Activation timestamp; null until first activation", default: null }
      - { name: expiry_date, type: datetime, source: system, description: "valid_from + 365 days; extended by 365 days on each successful renewal", default: null }

  - name: Inspection
    parent: null
    common_fields: true
    fields:
      - { name: registration_id, type: string, source: input, description: "FK -> VehicleRegistration.id; inspected registration" }
      - { name: scheduled_at, type: datetime, source: input, description: "Scheduled inspection instant (ISO 8601 UTC)" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | PASSED | FAILED" }
      - { name: headlights_score, type: integer, source: input, description: "Component score 0..100, supplied at finalize", constraints: "0..100" }
      - { name: brake_lights_score, type: integer, source: input, description: "Component score 0..100", constraints: "0..100" }
      - { name: turn_signals_score, type: integer, source: input, description: "Component score 0..100", constraints: "0..100" }
      - { name: horn_score, type: integer, source: input, description: "Component score 0..100", constraints: "0..100" }
      - { name: mirrors_score, type: integer, source: input, description: "Component score 0..100", constraints: "0..100" }
      - { name: windshield_score, type: integer, source: input, description: "Component score 0..100", constraints: "0..100" }
      - { name: seatbelts_score, type: integer, source: input, description: "Component score 0..100", constraints: "0..100" }
      - { name: reflectors_score, type: integer, source: input, description: "Component score 0..100", constraints: "0..100" }
      - { name: total_score, type: number, source: computed, description: "inspection_total_score: per-component weighted contributions rounded half-up to 2 decimals, then summed; null until finalize", default: null }
      - { name: passed, type: boolean, source: computed, description: "total_score >= 70.00 (inclusive)", default: null }

  - name: InsurancePolicy
    parent: null
    common_fields: true
    fields:
      - { name: holder_id, type: string, source: input, description: "FK -> PermitHolder.id; policy holder" }
      - { name: vehicle_id, type: string, source: input, description: "FK -> Vehicle.id; covered vehicle" }
      - { name: provider_name, type: string, source: input, description: "Insurance provider" }
      - { name: policy_number, type: string, source: input, description: "Policy document number" }
      - { name: liability_coverage_cents, type: integer, source: input, description: "Documented liability coverage; must be >= Community.min_liability_coverage_cents" }
      - { name: effective_date, type: string, source: input, description: "ISO 8601 date coverage starts" }
      - { name: expiry_date, type: string, source: input, description: "ISO 8601 date coverage ends (inclusive); clock past this date flips status to EXPIRED" }
      - { name: status, type: enum, source: system, description: "ACTIVE | CANCELLED | EXPIRED" }

  - name: Route
    parent: null
    common_fields: true
    fields:
      - { name: community_id, type: string, source: input, description: "FK -> Community.id; designating community" }
      - { name: name, type: string, source: input, description: "Street or path name" }
      - { name: route_type, type: enum, source: input, description: "STREET | PATH" }
      - { name: allowed_vehicle_class, type: enum, source: input, description: "GOLF_CART_ONLY (carts only) | LSV_ALLOWED (both carts and LSVs)" }
      - { name: designation_status, type: enum, source: system, description: "DESIGNATED | DECOMMISSIONED" }

  - name: RoutePass
    parent: null
    common_fields: true
    fields:
      - { name: route_id, type: string, source: input, description: "FK -> Route.id" }
      - { name: registration_id, type: string, source: input, description: "FK -> VehicleRegistration.id; must be status ACTIVE" }
      - { name: holder_id, type: string, source: input, description: "FK -> PermitHolder.id; must equal VehicleRegistration.holder_id" }
      - { name: start_at, type: datetime, source: input, description: "Window start (ISO 8601 UTC); half-open semantics: the pass occupies [start_at, end_at)" }
      - { name: end_at, type: datetime, source: input, description: "Window end (exclusive); must be strictly after start_at" }
      - { name: status, type: enum, source: system, description: "ACTIVE | CANCELLED | REVOKED | COMPLETED" }

  - name: ChargingStation
    parent: null
    common_fields: true
    fields:
      - { name: community_id, type: string, source: input, description: "FK -> Community.id" }
      - { name: name, type: string, source: input, description: "Station display name" }
      - { name: slot_count, type: integer, source: input, description: "Number of charging bays; valid slot_index values are 0..slot_count-1", constraints: "1..20" }
      - { name: rate_cents_per_min, type: integer, source: input, description: "Charging rate in cents per minute", constraints: ">= 1" }
      - { name: status, type: enum, source: system, description: "ONLINE | OFFLINE" }

  - name: ChargingReservation
    parent: null
    common_fields: true
    fields:
      - { name: station_id, type: string, source: input, description: "FK -> ChargingStation.id; must be ONLINE" }
      - { name: holder_id, type: string, source: input, description: "FK -> PermitHolder.id; wallet is debited fee_cents at booking" }
      - { name: slot_index, type: integer, source: input, description: "Bay index within the station", constraints: "0..slot_count-1" }
      - { name: start_at, type: datetime, source: input, description: "Reservation start (ISO 8601 UTC); CLOSED interval with 15-minute buffer on both sides" }
      - { name: end_at, type: datetime, source: input, description: "Reservation end (inclusive instant); must be strictly after start_at" }
      - { name: fee_cents, type: integer, source: computed, description: "charging_fee: max(200, ceil(duration_minutes) * rate_cents_per_min)" }
      - { name: status, type: enum, source: system, description: "BOOKED | CANCELLED | COMPLETED" }

  - name: FleetVehicle
    parent: null
    common_fields: true
    fields:
      - { name: community_id, type: string, source: input, description: "FK -> Community.id" }
      - { name: station_id, type: string, source: input, description: "FK -> ChargingStation.id; home station" }
      - { name: label, type: string, source: input, description: "Fleet vehicle label" }
      - { name: status, type: enum, source: system, description: "AVAILABLE | CHECKED_OUT | MAINTENANCE" }

  - name: FleetDispatch
    parent: null
    common_fields: true
    fields:
      - { name: vehicle_id, type: string, source: input, description: "FK -> FleetVehicle.id" }
      - { name: holder_id, type: string, source: input, description: "FK -> PermitHolder.id; must be ELIGIBLE" }
      - { name: shift_start, type: datetime, source: input, description: "Shift window start (ISO 8601 UTC); CLOSED interval, no buffer" }
      - { name: shift_end, type: datetime, source: input, description: "Shift window end (inclusive); must be strictly after shift_start" }
      - { name: status, type: enum, source: system, description: "BOOKED | CHECKED_OUT | OVERDUE | RETURNED | CANCELLED" }
      - { name: returned_at, type: datetime, source: system, description: "Actual return instant; null until returned", default: null }
      - { name: late_fine_cents, type: integer, source: computed, description: "If returned after shift_end: ceil(days late) * 500, debited from holder wallet at return", default: 0 }

  - name: Violation
    parent: null
    common_fields: true
    fields:
      - { name: holder_id, type: string, source: input, description: "FK -> PermitHolder.id; cited holder" }
      - { name: registration_id, type: string, source: input, description: "FK -> VehicleRegistration.id; optional — null for holder-level citations", default: null }
      - { name: violation_code, type: enum, source: input, description: "UNDERAGE_DRIVER | UNREGISTERED_VEHICLE | EQUIPMENT_MISSING | OFF_ROUTE | PARKING_VIOLATION | UNINSURED_OPERATION" }
      - { name: points_assessed, type: integer, source: input, description: "Points added to holder standing when UPHELD", constraints: "1..12" }
      - { name: fine_cents, type: integer, source: input, description: "Fine amount in cents (informational ledger, not auto-debited)", constraints: ">= 0" }
      - { name: occurred_at, type: datetime, source: input, description: "When the violation occurred (ISO 8601 UTC); drives rolling windows and recency weights" }
      - { name: status, type: enum, source: system, description: "FILED | UPHELD | DISMISSED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: VehicleRegistration
    field: status
    initial_state: DRAFT
    terminal_states: [REVOKED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /api/registrations/{id}/activate"
        actor: PermitHolder
        preconditions:
          - "registration.status == DRAFT"
          - "latest finalized Inspection for this registration has status PASSED"
          - "if Community.insurance_required: an InsurancePolicy with vehicle_id == registration.vehicle_id, status == ACTIVE exists"
          - "PermitHolder.eligibility_status == ELIGIBLE"
          - "PermitHolder.compliance_status != BARRED"
          - "PermitHolder.wallet_balance_cents >= registration.total_due_cents (== finalized_fee_cents; boundary: equal balance is sufficient)"
        side_effects:
          - "debit PermitHolder.wallet_balance_cents by total_due_cents; paid_cents += total_due_cents"
          - "set valid_from = now; expiry_date = valid_from + 365 days"
          - "increments VehicleRegistration.version and PermitHolder.version by 1"
      - from: ACTIVE
        to: RENEWAL_PENDING
        trigger: "POST /api/registrations/{id}/renew"
        actor: PermitHolder
        preconditions:
          - "registration.status == ACTIVE"
          - "now in [expiry_date - Community.renewal_window_days, expiry_date] (both bounds inclusive)"
          - "PermitHolder.compliance_status != BARRED"
        side_effects:
          - "recompute provisional_fee_cents via annual_registration_fee PROVISIONAL"
          - "set renewal_score_provisional via renewal_compliance_score PROVISIONAL (as_of = now)"
          - "late_fee_cents = 0; total_due_cents unchanged until finalize"
      - from: EXPIRED
        to: RENEWAL_PENDING
        trigger: "POST /api/registrations/{id}/renew"
        actor: PermitHolder
        preconditions:
          - "registration.status == EXPIRED"
          - "now in (expiry_date, expiry_date + Community.late_grace_days] (upper bound inclusive)"
          - "PermitHolder.compliance_status != BARRED"
        side_effects:
          - "recompute finalized_fee_cents via annual_registration_fee FINALIZED on current Vehicle data"
          - "compute late_fee_cents via late_renewal_fee (pinned evaluation order: fee -> tier -> late -> cap)"
          - "set total_due_cents = min(finalized_fee_cents + late_fee_cents, 2 * finalized_fee_cents)"
          - "set renewal_score_provisional via renewal_compliance_score PROVISIONAL (as_of = now)"
      - from: RENEWAL_PENDING
        to: ACTIVE
        trigger: "POST /api/registrations/{id}/finalize-renewal (audited score >= 70.00)"
        actor: CommunityAdmin
        preconditions:
          - "registration.status == RENEWAL_PENDING"
          - "renewal_score_audited (computed in this request) >= 70.00"
          - "PermitHolder.wallet_balance_cents >= total_due_cents where total_due_cents is finalized_fee_cents + late_fee_cents recomputed now (finalized variant)"
        side_effects:
          - "set renewal_score_audited via renewal_compliance_score AUDITED (as_of = now)"
          - "recompute finalized_fee_cents via annual_registration_fee FINALIZED; set total_due_cents = min(finalized_fee_cents + late_fee_cents, 2 * finalized_fee_cents)"
          - "debit PermitHolder.wallet_balance_cents by total_due_cents; paid_cents += total_due_cents"
          - "expiry_date = previous expiry_date + 365 days"
      - from: RENEWAL_PENDING
        to: SUSPENDED
        trigger: "POST /api/registrations/{id}/finalize-renewal (audited score < 70.00)"
        actor: CommunityAdmin
        preconditions:
          - "registration.status == RENEWAL_PENDING"
          - "renewal_score_audited (computed in this request) < 70.00"
        side_effects:
          - "set renewal_score_audited; no wallet debit; expiry_date unchanged"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /api/registrations/{id}/suspend, or system cascade (holder BARRED), or system cascade (re-inspection finalize FAILED)"
        actor: CommunityAdmin | system
        preconditions:
          - "registration.status == ACTIVE"
        side_effects:
          - "every RoutePass with registration_id == this registration and status == ACTIVE flips to REVOKED"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /api/registrations/{id}/reinstate"
        actor: CommunityAdmin
        preconditions:
          - "registration.status == SUSPENDED"
          - "PermitHolder.compliance_status != BARRED"
          - "latest finalized Inspection for this registration has status PASSED"
          - "if Community.insurance_required: an ACTIVE InsurancePolicy covers registration.vehicle_id"
        side_effects:
          - "registration returns to ACTIVE; previously REVOKED RoutePasses stay REVOKED (no resurrection)"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (logical clock advances past expiry_date)"
        actor: system
        preconditions:
          - "registration.status == ACTIVE and now > expiry_date"
        side_effects: []
      - from: RENEWAL_PENDING
        to: EXPIRED
        trigger: "system (logical clock advances past expiry_date + late_grace_days)"
        actor: system
        preconditions:
          - "registration.status == RENEWAL_PENDING and now > expiry_date + Community.late_grace_days"
        side_effects: []
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /api/registrations/{id}/revoke, or system cascade (holder eligibility REVOKED)"
        actor: EnforcementOfficer | system
        preconditions:
          - "registration.status == ACTIVE"
        side_effects:
          - "every RoutePass with registration_id == this registration and status == ACTIVE flips to REVOKED"
      - from: RENEWAL_PENDING
        to: REVOKED
        trigger: "POST /api/registrations/{id}/revoke, or system cascade (holder eligibility REVOKED)"
        actor: EnforcementOfficer | system
        preconditions:
          - "registration.status == RENEWAL_PENDING"
        side_effects:
          - "every RoutePass with registration_id == this registration and status == ACTIVE flips to REVOKED"
      - from: SUSPENDED
        to: REVOKED
        trigger: "POST /api/registrations/{id}/revoke, or system cascade (holder eligibility REVOKED)"
        actor: EnforcementOfficer | system
        preconditions:
          - "registration.status == SUSPENDED"
        side_effects:
          - "every RoutePass with registration_id == this registration and status == ACTIVE flips to REVOKED"
        note: "REVOKED is terminal; no further transitions."
      - from: EXPIRED
        to: REVOKED
        trigger: "POST /api/registrations/{id}/revoke"
        actor: EnforcementOfficer
        preconditions:
          - "registration.status == EXPIRED"
        side_effects: []

  - entity: PermitHolder
    field: eligibility_status
    initial_state: PENDING_VERIFICATION
    terminal_states: [REVOKED]
    transitions:
      - from: PENDING_VERIFICATION
        to: ELIGIBLE
        trigger: "POST /api/permit-holders/{id}/verify-eligibility"
        actor: CommunityAdmin
        preconditions:
          - "eligibility_status == PENDING_VERIFICATION"
          - "age (floor of years between birth_date and today on the logical clock) >= Community.min_driver_age (inclusive: exact birthday passes)"
          - "driver_license_class != NONE"
        side_effects: []
      - from: ELIGIBLE
        to: SUSPENDED
        trigger: "POST /api/permit-holders/{id}/suspend"
        actor: CommunityAdmin
        preconditions:
          - "eligibility_status == ELIGIBLE"
        side_effects: []
      - from: SUSPENDED
        to: ELIGIBLE
        trigger: "POST /api/permit-holders/{id}/reinstate"
        actor: CommunityAdmin
        preconditions:
          - "eligibility_status == SUSPENDED"
        side_effects: []
      - from: ELIGIBLE
        to: REVOKED
        trigger: "POST /api/permit-holders/{id}/revoke"
        actor: CommunityAdmin
        preconditions:
          - "eligibility_status in {ELIGIBLE, SUSPENDED}"
        side_effects:
          - "every VehicleRegistration with holder_id == this holder and status in {ACTIVE, RENEWAL_PENDING, SUSPENDED} flips to REVOKED"
          - "each such registration revocation revokes its ACTIVE RoutePasses (see VehicleRegistration SUSPENDED->REVOKED side effects)"
      - from: SUSPENDED
        to: REVOKED
        trigger: "POST /api/permit-holders/{id}/revoke"
        actor: CommunityAdmin
        preconditions:
          - "eligibility_status in {ELIGIBLE, SUSPENDED}"
        side_effects:
          - "every VehicleRegistration with holder_id == this holder and status in {ACTIVE, RENEWAL_PENDING, SUSPENDED} flips to REVOKED"
          - "each such registration revocation revokes its ACTIVE RoutePasses"
    note: "compliance_status is an INDEPENDENT second state dimension on the same row; it is never written directly, only recomputed from points_balance by holder_points_standing on Violation uphold/dismiss. GOOD_STANDING (points_balance <= 3) / PROBATION (4..11) / BARRED (>= 12, inclusive). Flips into BARRED cascade: every ACTIVE registration of the holder -> SUSPENDED, and each suspension revokes its ACTIVE RoutePasses. Flips out of BARRED (dismissal lowers points) do NOT auto-reinstate registrations."

  - entity: Inspection
    field: status
    initial_state: SCHEDULED
    terminal_states: [PASSED, FAILED]
    transitions:
      - from: SCHEDULED
        to: PASSED
        trigger: "POST /api/inspections/{id}/finalize with total_score >= 70.00"
        actor: Inspector
        preconditions:
          - "inspection.status == SCHEDULED"
          - "registration referenced by registration_id has status in {DRAFT, ACTIVE, RENEWAL_PENDING, SUSPENDED}"
        side_effects:
          - "compute total_score via inspection_total_score (per-component round then sum); passed = true"
          - "recompute VehicleRegistration.finalized_fee_cents via annual_registration_fee FINALIZED; set total_due_cents = min(finalized_fee_cents + late_fee_cents, 2 * finalized_fee_cents)"
      - from: SCHEDULED
        to: FAILED
        trigger: "POST /api/inspections/{id}/finalize with total_score < 70.00"
        actor: Inspector
        preconditions:
          - "inspection.status == SCHEDULED"
          - "registration referenced by registration_id has status in {DRAFT, ACTIVE, RENEWAL_PENDING, SUSPENDED}"
        side_effects:
          - "compute total_score; passed = false"
          - "if the referenced registration has status ACTIVE: registration -> SUSPENDED and its ACTIVE RoutePasses -> REVOKED"

  - entity: InsurancePolicy
    field: status
    initial_state: ACTIVE
    terminal_states: [CANCELLED, EXPIRED]
    transitions:
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /api/insurance-policies/{id}/cancel"
        actor: PermitHolder
        preconditions:
          - "policy.status == ACTIVE"
        side_effects: []
      - from: ACTIVE
        to: EXPIRED
        trigger: "system (logical clock advances past expiry_date)"
        actor: system
        preconditions:
          - "policy.status == ACTIVE and current date > expiry_date"
        side_effects: []

  - entity: Route
    field: designation_status
    initial_state: DESIGNATED
    terminal_states: [DECOMMISSIONED]
    transitions:
      - from: DESIGNATED
        to: DECOMMISSIONED
        trigger: "POST /api/routes/{id}/decommission"
        actor: CommunityAdmin
        preconditions:
          - "route.designation_status == DESIGNATED"
        side_effects:
          - "every RoutePass with route_id == this route and status == ACTIVE flips to REVOKED"

  - entity: RoutePass
    field: status
    initial_state: ACTIVE
    terminal_states: [CANCELLED, REVOKED, COMPLETED]
    transitions:
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /api/route-passes/{id}/cancel"
        actor: PermitHolder
        preconditions:
          - "pass.status == ACTIVE"
          - "now < pass.start_at (a pass whose window has begun cannot be cancelled)"
        side_effects: []
      - from: ACTIVE
        to: REVOKED
        trigger: "system cascade (registration suspended/revoked, holder revoked, or route decommissioned)"
        actor: system
        preconditions:
          - "pass.status == ACTIVE"
        side_effects: []
      - from: ACTIVE
        to: COMPLETED
        trigger: "system (logical clock reaches pass.end_at)"
        actor: system
        preconditions:
          - "pass.status == ACTIVE and now >= pass.end_at"
        side_effects: []

  - entity: ChargingStation
    field: status
    initial_state: ONLINE
    terminal_states: []
    transitions:
      - from: ONLINE
        to: OFFLINE
        trigger: "POST /api/charging-stations/{id}/set-offline"
        actor: CommunityAdmin
        preconditions:
          - "station.status == ONLINE"
        side_effects:
          - "every ChargingReservation with station_id == this station, status == BOOKED, and start_at > now flips to CANCELLED"
          - "each cancelled reservation credits fee_cents back to its holder's wallet_balance_cents (wallet invariant hop)"
      - from: OFFLINE
        to: ONLINE
        trigger: "POST /api/charging-stations/{id}/set-online"
        actor: CommunityAdmin
        preconditions:
          - "station.status == OFFLINE"
        side_effects: []

  - entity: ChargingReservation
    field: status
    initial_state: BOOKED
    terminal_states: [CANCELLED, COMPLETED]
    transitions:
      - from: BOOKED
        to: CANCELLED
        trigger: "POST /api/charging-reservations/{id}/cancel, or system cascade (station set-offline)"
        actor: PermitHolder | system
        preconditions:
          - "reservation.status == BOOKED"
          - "manual cancel: now < reservation.start_at (once the window begins it cannot be cancelled)"
        side_effects:
          - "credit fee_cents back to PermitHolder.wallet_balance_cents (full refund; wallet conserved across book+cancel)"
      - from: BOOKED
        to: COMPLETED
        trigger: "system (logical clock advances past reservation.end_at)"
        actor: system
        preconditions:
          - "reservation.status == BOOKED and now > reservation.end_at"
        side_effects: []

  - entity: FleetVehicle
    field: status
    initial_state: AVAILABLE
    terminal_states: []
    transitions:
      - from: AVAILABLE
        to: CHECKED_OUT
        trigger: "POST /api/fleet-dispatches/{id}/checkout on a dispatch naming this vehicle"
        actor: PermitHolder
        preconditions:
          - "vehicle.status == AVAILABLE"
          - "dispatch.status == BOOKED and now >= dispatch.shift_start"
        side_effects:
          - "dispatch -> CHECKED_OUT"
          - "Community.checked_out_count += 1"
      - from: CHECKED_OUT
        to: AVAILABLE
        trigger: "POST /api/fleet-dispatches/{id}/return on the open dispatch naming this vehicle"
        actor: PermitHolder
        preconditions:
          - "vehicle.status == CHECKED_OUT"
          - "dispatch.status in {CHECKED_OUT, OVERDUE}"
        side_effects:
          - "dispatch -> RETURNED; returned_at = now; late_fine_cents computed and debited from holder wallet if late"
          - "Community.checked_out_count -= 1"
      - from: AVAILABLE
        to: MAINTENANCE
        trigger: "POST /api/fleet-vehicles/{id}/set-maintenance"
        actor: CommunityAdmin
        preconditions:
          - "vehicle.status == AVAILABLE"
        side_effects:
          - "every FleetDispatch with vehicle_id == this vehicle, status == BOOKED, and shift_start > now flips to CANCELLED"
      - from: MAINTENANCE
        to: AVAILABLE
        trigger: "POST /api/fleet-vehicles/{id}/set-available"
        actor: CommunityAdmin
        preconditions:
          - "vehicle.status == MAINTENANCE"
        side_effects: []

  - entity: FleetDispatch
    field: status
    initial_state: BOOKED
    terminal_states: [RETURNED, CANCELLED]
    transitions:
      - from: BOOKED
        to: CHECKED_OUT
        trigger: "POST /api/fleet-dispatches/{id}/checkout"
        actor: PermitHolder
        preconditions:
          - "dispatch.status == BOOKED"
          - "now >= dispatch.shift_start"
          - "FleetVehicle.status == AVAILABLE (else ERR_FLEET_UNAVAILABLE)"
        side_effects:
          - "FleetVehicle -> CHECKED_OUT; Community.checked_out_count += 1"
      - from: CHECKED_OUT
        to: OVERDUE
        trigger: "system (logical clock advances past shift_end while checked out)"
        actor: system
        preconditions:
          - "dispatch.status == CHECKED_OUT and now > dispatch.shift_end"
        side_effects: []
      - from: CHECKED_OUT
        to: RETURNED
        trigger: "POST /api/fleet-dispatches/{id}/return"
        actor: PermitHolder
        preconditions:
          - "dispatch.status in {CHECKED_OUT, OVERDUE}"
        side_effects:
          - "returned_at = now; if now > shift_end: late_fine_cents = ceil((now - shift_end)/86400s) * 500 debited from holder wallet"
          - "FleetVehicle -> AVAILABLE; Community.checked_out_count -= 1"
      - from: OVERDUE
        to: RETURNED
        trigger: "POST /api/fleet-dispatches/{id}/return"
        actor: PermitHolder
        preconditions:
          - "dispatch.status in {CHECKED_OUT, OVERDUE}"
        side_effects:
          - "returned_at = now; late_fine_cents = ceil((now - shift_end)/86400s) * 500 debited from holder wallet"
          - "FleetVehicle -> AVAILABLE; Community.checked_out_count -= 1"
      - from: BOOKED
        to: CANCELLED
        trigger: "POST /api/fleet-dispatches/{id}/cancel, or system cascade (vehicle set-maintenance)"
        actor: PermitHolder | system
        preconditions:
          - "dispatch.status == BOOKED"
          - "manual cancel: now < dispatch.shift_start"
        side_effects: []

  - entity: Vehicle
    field: vehicle_status
    initial_state: ACTIVE
    terminal_states: [RETIRED]
    transitions:
      - from: ACTIVE
        to: RETIRED
        trigger: "POST /api/vehicles/{id}/retire"
        actor: PermitHolder
        preconditions:
          - "vehicle.vehicle_status == ACTIVE"
          - "no VehicleRegistration with vehicle_id == this vehicle and status in {DRAFT, ACTIVE, RENEWAL_PENDING, SUSPENDED}"
        side_effects: []

  - entity: Violation
    field: status
    initial_state: FILED
    terminal_states: [UPHELD, DISMISSED]
    transitions:
      - from: FILED
        to: UPHELD
        trigger: "POST /api/violations/{id}/uphold"
        actor: EnforcementOfficer
        preconditions:
          - "violation.status == FILED"
        side_effects:
          - "recompute holder points_balance via holder_points_standing (cascade hop 1: Violation -> PermitHolder)"
          - "recompute holder compliance_status from points thresholds; on flip into BARRED (hop 2): every ACTIVE VehicleRegistration of the holder -> SUSPENDED"
          - "each registration suspension (hop 3): its ACTIVE RoutePasses -> REVOKED"
      - from: FILED
        to: DISMISSED
        trigger: "POST /api/violations/{id}/dismiss"
        actor: EnforcementOfficer
        preconditions:
          - "violation.status in {FILED, UPHELD}"
        side_effects:
          - "if previously UPHELD: recompute holder points_balance and compliance_status (downward); no automatic registration reinstatement"
      - from: UPHELD
        to: DISMISSED
        trigger: "POST /api/violations/{id}/dismiss (appeal)"
        actor: EnforcementOfficer
        preconditions:
          - "violation.status in {FILED, UPHELD}"
        side_effects:
          - "recompute holder points_balance and compliance_status (downward); no automatic registration reinstatement"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only; all other conflicts are state preconditions)
# =============================================================================
concurrency_rules:
  - rule_id: community-config-update-stale-version
    parent_entity: Community
    write_endpoint: "PATCH /api/communities/{id}"
    occ_field: "expected_community_version"
    description: |
      Updating a Community's configuration with an expected_community_version
      that no longer matches the stored version is rejected. A prior accepted
      update advanced Community.version, so the client's observed configuration
      (fee-relevant thresholds, renewal windows) is stale and the update must be
      re-based on a fresh read.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: wallet-deposit-stale-version
    parent_entity: PermitHolder
    write_endpoint: "POST /api/permit-holders/{id}/wallet/deposits"
    occ_field: "expected_permit_holder_version"
    description: |
      Depositing into a holder wallet with an expected_permit_holder_version
      that no longer matches the stored version is rejected. Deposits are always
      semantically valid, so the stale-version check is the only guard against a
      lost update when another mutation (a fee debit, a cascade refund, a prior
      deposit) has advanced PermitHolder.version since the client's last read.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: annual_registration_fee
    trigger: "POST /api/registrations (PROVISIONAL on declared equipment); POST /api/inspections/{id}/finalize when PASSED (FINALIZED); POST /api/registrations/{id}/renew (PROVISIONAL from ACTIVE, FINALIZED from EXPIRED); POST /api/registrations/{id}/finalize-renewal (FINALIZED)"
    algorithm: tiered_pricing
    formula: |
      base = BASE_FEE[vehicle_type]                       # GOLF_CART 7500, LSV 15000
      equip_count = Vehicle.equipment_count               # 0..8, mirrors count iff mirror_count >= 1
      mult = min(1 + EQUIP_RATE[variant] * equip_count, MULT_CAP)          # nested min: cap at 1.20
      seat_surcharge = max(0, seat_count - SEAT_FREE) * SEAT_SURCHARGE     # nested max: first 4 seats free
      subtotal = round_half_up(base * mult, 0) + seat_surcharge
      if fleet_discount_applies[variant]:
          subtotal = round_half_up(subtotal * (1 - FLEET_DISCOUNT_PCT), 0)
      fee = max(subtotal, base)                           # floor: fee never below base
    input_set: "the Vehicle row (equipment + seats), Community.fleet_program_enabled, and (FINALIZED only) the holder's FleetDispatch history: rows with status RETURNED and returned_at within trailing 365 days of the calculation instant"
    constants:
      BASE_FEE_GOLF_CART: 7500
      BASE_FEE_LSV: 15000
      EQUIP_RATE_PROVISIONAL: 0.02
      EQUIP_RATE_FINALIZED: 0.025
      MULT_CAP: 1.20
      SEAT_FREE: 4
      SEAT_SURCHARGE: 500
      FLEET_DISCOUNT_PCT: 0.10
    precision: "integer cents; each multiplication rounded round_half_up to 0 decimals before the next step"
    variants:
      - name: provisional
        when: "registration creation, and renew from ACTIVE"
        difference: "EQUIP_RATE 0.02 per equipment item; fleet discount ASSUMED whenever Community.fleet_program_enabled is true (no dispatch history check)"
      - name: finalized
        when: "inspection finalize PASSED, renew from EXPIRED, finalize-renewal"
        difference: "EQUIP_RATE 0.025 per equipment item; fleet discount granted only if the holder has at least one FleetDispatch with status RETURNED and returned_at within trailing 365 days"

  - name: late_renewal_fee
    trigger: "POST /api/registrations/{id}/renew from EXPIRED; recomputed inside POST /api/registrations/{id}/finalize-renewal"
    algorithm: threshold
    formula: |
      # PINNED EVALUATION ORDER (the dependency fee->tier->late->cap->total is
      # circular-looking; this order makes it well-defined):
      #   (1) base = finalized_fee_cents (annual_registration_fee FINALIZED)
      #   (2) tier = A if base < 10000 else B
      #   (3) days_overdue = floor((now - expiry_date) / 86400 seconds)
      #   (4) raw_late = TIER_TABLE[tier][band(days_overdue)] with bands
      #       (<=30, 31..60, 61..late_grace_days]; day 30 exactly is band 1
      #   (5) total_due = min(base + raw_late, 2 * base)
      late_fee_cents = raw_late
      total_due_cents = min(base + raw_late, 2 * base)
    input_set: "the VehicleRegistration row (expiry_date, vehicle data), the logical clock, Community.late_grace_days"
    constants:
      TIER_BOUNDARY_CENTS: 10000
      TIER_A_LATE: [1500, 3000, 6000]
      TIER_B_LATE: [2500, 5000, 10000]
      BAND_1_MAX_DAYS: 30
      BAND_2_MAX_DAYS: 60
      TOTAL_CAP_MULTIPLE: 2
    precision: "integer cents; days_overdue is integer floor of whole days"

  - name: inspection_total_score
    trigger: "POST /api/inspections/{id}/finalize"
    algorithm: weighted_scoring
    formula: |
      # PINNED ROUNDING ORDER: round EACH component contribution to 2 decimals
      # (round_half_up) FIRST, then sum. Summing raw products and rounding once
      # at the end yields different hundredths (e.g. all-84 scores: per-component
      # sum 83.99 vs sum-then-round 84.00) — the per-component order is normative.
      total_score = sum over components c of round_half_up(score_c * WEIGHT_PCT[c] / 100, 2)
      passed = total_score >= PASS_THRESHOLD          # inclusive: exactly 70.00 passes
    input_set: "the eight component score fields on the Inspection (integers 0..100)"
    constants:
      WEIGHT_PCT: { headlights: 16.67, brake_lights: 16.67, turn_signals: 13.33, horn: 6.67, mirrors: 10.00, windshield: 10.00, seatbelts: 16.66, reflectors: 10.00 }
      PASS_THRESHOLD: 70.00
    precision: "2 decimal places per component contribution, round_half_up; total is the exact sum of rounded contributions (2 decimals)"

  - name: renewal_compliance_score
    trigger: "POST /api/registrations/{id}/renew (PROVISIONAL, as_of = renew instant); POST /api/registrations/{id}/finalize-renewal (AUDITED, as_of = finalize instant)"
    algorithm: weighted_scoring
    formula: |
      score = 100 - sum over included violations v of points_assessed_v * recency_weight_v * status_weight_v
      recency_weight = 1.0 if occurred_at within trailing 180 days of as_of; 0.5 if within trailing 365 days; excluded beyond 365
      score floored at 0
      renewal passes iff score >= RENEWAL_PASS_THRESHOLD (inclusive)
    input_set: "Violation rows with holder_id == registration.holder_id; inclusion set and status_weight differ per variant"
    constants:
      RENEWAL_PASS_THRESHOLD: 70
      RECENCY_FULL_DAYS: 180
      WINDOW_DAYS: 365
      AGED_FILED_DAYS: 30
    precision: "2 decimal places, round_half_up on the final score"
    variants:
      - name: provisional
        when: "renew request"
        difference: "includes only violations with status UPHELD (status_weight 1.0); FILED violations excluded entirely"
      - name: audited
        when: "finalize-renewal"
        difference: "includes UPHELD violations (status_weight 1.0) AND FILED violations whose occurred_at is more than AGED_FILED_DAYS before as_of (status_weight 0.5)"

  - name: holder_points_standing
    trigger: "POST /api/violations/{id}/uphold; POST /api/violations/{id}/dismiss on a previously UPHELD violation"
    algorithm: aggregation
    formula: |
      points_balance = sum of points_assessed over Violation rows where
        holder_id == holder.id AND status == UPHELD
        AND occurred_at within trailing POINTS_WINDOW_DAYS of now (inclusive)
      compliance_status = BARRED if points_balance >= BAR_THRESHOLD      # inclusive: exactly 12 is BARRED
                        = PROBATION if points_balance >= PROBATION_THRESHOLD  # 4..11
                        = GOOD_STANDING otherwise                        # 0..3
    input_set: "Violation rows for the holder filtered by status == UPHELD and occurred_at >= now - 730 days"
    constants:
      POINTS_WINDOW_DAYS: 730
      PROBATION_THRESHOLD: 4
      BAR_THRESHOLD: 12
    precision: "integer points; no rounding"

  - name: charging_fee
    trigger: "POST /api/charging-reservations (debited from wallet at booking; refunded in full on cancel-while-BOOKED before start_at)"
    algorithm: aggregation
    formula: |
      duration_minutes = (end_at - start_at) / 60 seconds
      fee_cents = max(MIN_CHARGE_CENTS, ceil(duration_minutes) * rate_cents_per_min)
    input_set: "the reservation's start_at/end_at and the station's rate_cents_per_min"
    constants:
      MIN_CHARGE_CENTS: 200
    precision: "integer cents; ceil on fractional minutes"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority — first failure wins)
# =============================================================================
validations:
  - { priority: 1, category: business_constraint, check: "Request body schema: all required fields present, enums in range, integers in declared ranges, end strictly after start on every windowed payload", error_id: ERR_VALIDATION, http_status: 400, applies_to: "all" }
  - { priority: 2, category: auth, check: "X-User-Role and X-User-ID headers present and X-User-Role is a declared role", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all except POST /api/permit-holders (Anonymous allowed)" }
  - { priority: 3, category: auth, check: "Role permitted for the endpoint per §1.5 roles; for PermitHolder-role calls, X-User-ID must equal the owning holder_id of the target/payload resource", error_id: ERR_FORBIDDEN, http_status: 403, applies_to: "all" }
  - { priority: 4, category: existence, check: "Every id referenced in path and body exists (validated left-to-right: path params first, then body FKs in declared field order)", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all" }
  - { priority: 5, category: state, check: "Target resource's own state machine permits the transition (from-state match); OCC expected_*_version matches stored version", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all action endpoints; OCC mismatch returns ERR_STALE_VERSION 412 instead" }
  - { priority: 6, category: business_safety, check: "Safety gates: driver age >= Community.min_driver_age and license != NONE (verify-eligibility); vehicle equipment minimums (GOLF_CART: headlights+brake_lights; LSV: headlights+brake_lights+seatbelts+mirror_count>=1) at registration creation; vehicle class allowed on route (GOLF_CART_ONLY route rejects LSV registrations)", error_id: ERR_UNDERAGE_DRIVER, http_status: 422, applies_to: "verify-eligibility -> ERR_UNDERAGE_DRIVER | ERR_LICENSE_CLASS_INSUFFICIENT; POST /api/registrations -> ERR_EQUIPMENT_MINIMUM; POST /api/route-passes -> ERR_ROUTE_VEHICLE_CLASS" }
  - { priority: 7, category: business_temporal, check: "Window/overlap gates: renewal inside window or grace (ERR_RENEWAL_WINDOW_CLOSED); route-pass half-open overlap per registration (ERR_ROUTE_PASS_OVERLAP); charging closed-interval+15min buffer per (station, slot) (ERR_CHARGING_OVERLAP); dispatch closed-interval overlap per vehicle (ERR_DISPATCH_WINDOW_OVERLAP)", error_id: ERR_RENEWAL_WINDOW_CLOSED, http_status: 422, applies_to: "renew, route-passes, charging-reservations, fleet-dispatches" }
  - { priority: 8, category: business_referential, check: "Cross-entity state gates: holder ELIGIBLE (ERR_HOLDER_NOT_ELIGIBLE); holder not BARRED (ERR_HOLDER_BARRED); registration ACTIVE for route pass (ERR_REGISTRATION_NOT_ACTIVE); latest inspection PASSED for activate/reinstate (ERR_INSPECTION_NOT_PASSED); ACTIVE insurance covering vehicle (ERR_INSURANCE_MISSING); route DESIGNATED (ERR_ROUTE_NOT_DESIGNATED); station ONLINE (ERR_STATION_OFFLINE); vehicle AVAILABLE at checkout (ERR_FLEET_UNAVAILABLE)", error_id: ERR_HOLDER_NOT_ELIGIBLE, http_status: 422, applies_to: "activate, renew, reinstate, route-passes, charging-reservations, fleet-dispatches" }
  - { priority: 9, category: business_constraint, check: "Uniqueness/domain constraints: no second non-terminal VehicleRegistration for same (vehicle_id, registration_year) (ERR_DUPLICATE_REGISTRATION); insurance liability_coverage_cents >= Community.min_liability_coverage_cents at policy creation (ERR_INSURANCE_COVERAGE_LOW)", error_id: ERR_DUPLICATE_REGISTRATION, http_status: 409, applies_to: "POST /api/registrations, POST /api/insurance-policies" }
  - { priority: 10, category: business_fiscal, check: "Wallet sufficiency: PermitHolder.wallet_balance_cents >= amount to be debited (activation total_due, renewal total_due, charging fee, late fine)", error_id: ERR_INSUFFICIENT_FUNDS, http_status: 402, applies_to: "activate, finalize-renewal, charging-reservations, fleet-dispatches/{id}/return" }

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- platform / community config ---
  - { method: POST, path: "/api/communities", description: "Create a community program", roles: [PlatformAdmin], code: 201, input: [name, "min_driver_age?", "insurance_required?", "fleet_program_enabled?", "min_liability_coverage_cents?", "renewal_window_days?", "late_grace_days?"], output: Community, side_effects: ["Community created with checked_out_count 0"] }
  - { method: GET, path: "/api/communities/{id}", description: "Read a community", roles: [PlatformAdmin, CommunityAdmin, Inspector, EnforcementOfficer, PermitHolder], code: 200, input: [], output: Community, side_effects: [] }
  - { method: PATCH, path: "/api/communities/{id}", description: "Update community configuration (OCC-guarded)", roles: [PlatformAdmin], code: 200, input: [expected_community_version, "name?", "min_driver_age?", "insurance_required?", "fleet_program_enabled?", "min_liability_coverage_cents?", "renewal_window_days?", "late_grace_days?"], output: Community, side_effects: ["increments Community.version by 1"] }
  - { method: GET, path: "/api/communities", description: "List communities", roles: [PlatformAdmin, CommunityAdmin], code: 200, input: ["limit?", "offset?"], output: "Community[]", side_effects: [] }

  # --- permit holders ---
  - { method: POST, path: "/api/permit-holders", description: "Self-register a permit holder (starts PENDING_VERIFICATION, GOOD_STANDING, 0 points, 0 wallet)", roles: [Anonymous, CommunityAdmin], code: 201, input: [community_id, full_name, birth_date, driver_license_class], output: PermitHolder, side_effects: [] }
  - { method: GET, path: "/api/permit-holders/{id}", description: "Read a permit holder", roles: [PlatformAdmin, CommunityAdmin, Inspector, EnforcementOfficer, PermitHolder], code: 200, input: [], output: PermitHolder, side_effects: [] }
  - { method: GET, path: "/api/permit-holders", description: "List permit holders (FK reverse lookup by community)", roles: [PlatformAdmin, CommunityAdmin, EnforcementOfficer], code: 200, input: ["community_id?", "limit?", "offset?"], output: "PermitHolder[]", side_effects: [] }
  - { method: POST, path: "/api/permit-holders/{id}/verify-eligibility", description: "Verify driver age (>= min_driver_age, exact birthday passes) and license class; PENDING_VERIFICATION -> ELIGIBLE", roles: [CommunityAdmin], code: 200, input: [], output: PermitHolder, side_effects: ["increments PermitHolder.version by 1"] }
  - { method: POST, path: "/api/permit-holders/{id}/suspend", description: "Suspend eligibility dimension (ELIGIBLE -> SUSPENDED); compliance dimension untouched", roles: [CommunityAdmin], code: 200, input: [], output: PermitHolder, side_effects: ["increments PermitHolder.version by 1"] }
  - { method: POST, path: "/api/permit-holders/{id}/reinstate", description: "Reinstate eligibility dimension (SUSPENDED -> ELIGIBLE)", roles: [CommunityAdmin], code: 200, input: [], output: PermitHolder, side_effects: ["increments PermitHolder.version by 1"] }
  - { method: POST, path: "/api/permit-holders/{id}/revoke", description: "Revoke eligibility (ELIGIBLE|SUSPENDED -> REVOKED); cascades registrations to REVOKED and their ACTIVE route passes to REVOKED", roles: [CommunityAdmin], code: 200, input: [], output: PermitHolder, side_effects: ["registrations REVOKED cascade", "route passes REVOKED cascade", "increments PermitHolder.version by 1"] }
  - { method: POST, path: "/api/permit-holders/{id}/wallet/deposits", description: "Deposit funds into holder wallet (OCC-guarded)", roles: [PermitHolder], code: 200, input: [amount_cents, expected_permit_holder_version], output: PermitHolder, side_effects: ["wallet_balance_cents += amount_cents", "increments PermitHolder.version by 1"] }

  # --- vehicles ---
  - { method: POST, path: "/api/vehicles", description: "Register a vehicle with declared equipment; equipment_count computed", roles: [PermitHolder], code: 201, input: [holder_id, vehicle_type, seat_count, has_headlights, has_brake_lights, has_turn_signals, has_horn, has_windshield, has_seatbelts, has_reflectors, mirror_count], output: Vehicle, side_effects: ["equipment_count computed (mirrors counted iff mirror_count >= 1)"] }
  - { method: GET, path: "/api/vehicles/{id}", description: "Read a vehicle", roles: [PlatformAdmin, CommunityAdmin, Inspector, EnforcementOfficer, PermitHolder], code: 200, input: [], output: Vehicle, side_effects: [] }
  - { method: GET, path: "/api/vehicles", description: "List vehicles (FK reverse lookup by holder)", roles: [PlatformAdmin, CommunityAdmin, Inspector, EnforcementOfficer, PermitHolder], code: 200, input: ["holder_id?", "limit?", "offset?"], output: "Vehicle[]", side_effects: [] }
  - { method: POST, path: "/api/vehicles/{id}/retire", description: "Retire a vehicle with no non-terminal registrations", roles: [PermitHolder], code: 200, input: [], output: Vehicle, side_effects: [] }

  # --- registrations ---
  - { method: POST, path: "/api/registrations", description: "Create a DRAFT annual registration; computes provisional_fee_cents (PROVISIONAL variant)", roles: [PermitHolder], code: 201, input: [vehicle_id, holder_id, registration_year], output: VehicleRegistration, side_effects: ["annual_registration_fee PROVISIONAL -> provisional_fee_cents, total_due_cents unset until inspection"] }
  - { method: GET, path: "/api/registrations/{id}", description: "Read a registration", roles: [PlatformAdmin, CommunityAdmin, Inspector, EnforcementOfficer, PermitHolder], code: 200, input: [], output: VehicleRegistration, side_effects: [] }
  - { method: GET, path: "/api/registrations", description: "List registrations (FK reverse lookup)", roles: [PlatformAdmin, CommunityAdmin, Inspector, EnforcementOfficer, PermitHolder], code: 200, input: ["vehicle_id?", "holder_id?", "limit?", "offset?"], output: "VehicleRegistration[]", side_effects: [] }
  - { method: POST, path: "/api/registrations/{id}/activate", description: "Activate a DRAFT registration: requires PASSED inspection, ACTIVE insurance, ELIGIBLE + non-BARRED holder; debits total_due_cents", roles: [PermitHolder], code: 200, input: [], output: VehicleRegistration, side_effects: ["wallet debit", "valid_from/expiry_date set", "increments VehicleRegistration.version and PermitHolder.version by 1"] }
  - { method: POST, path: "/api/registrations/{id}/renew", description: "Open renewal: ACTIVE->RENEWAL_PENDING inside window (provisional fee + provisional score), or EXPIRED->RENEWAL_PENDING inside grace (finalized fee + late fee)", roles: [PermitHolder], code: 200, input: [], output: VehicleRegistration, side_effects: ["annual_registration_fee", "late_renewal_fee (from EXPIRED)", "renewal_compliance_score PROVISIONAL"] }
  - { method: POST, path: "/api/registrations/{id}/finalize-renewal", description: "Audit renewal: computes AUDITED score; >= 70 -> ACTIVE + wallet debit + expiry extended; < 70 -> SUSPENDED", roles: [CommunityAdmin], code: 200, input: [], output: VehicleRegistration, side_effects: ["renewal_compliance_score AUDITED", "annual_registration_fee FINALIZED", "wallet debit on pass", "increments VehicleRegistration.version and PermitHolder.version by 1"] }
  - { method: POST, path: "/api/registrations/{id}/suspend", description: "Manually suspend an ACTIVE registration; revokes its ACTIVE route passes", roles: [CommunityAdmin], code: 200, input: [], output: VehicleRegistration, side_effects: ["route passes REVOKED cascade"] }
  - { method: POST, path: "/api/registrations/{id}/reinstate", description: "Reinstate a SUSPENDED registration (requires non-BARRED holder, PASSED inspection, ACTIVE insurance)", roles: [CommunityAdmin], code: 200, input: [], output: VehicleRegistration, side_effects: [] }
  - { method: POST, path: "/api/registrations/{id}/revoke", description: "Revoke a non-DRAFT registration (terminal); revokes its ACTIVE route passes", roles: [EnforcementOfficer], code: 200, input: [], output: VehicleRegistration, side_effects: ["route passes REVOKED cascade"] }

  # --- inspections ---
  - { method: POST, path: "/api/inspections", description: "Schedule an inspection for a registration", roles: [Inspector], code: 201, input: [registration_id, scheduled_at], output: Inspection, side_effects: [] }
  - { method: GET, path: "/api/inspections/{id}", description: "Read an inspection", roles: [PlatformAdmin, CommunityAdmin, Inspector, EnforcementOfficer, PermitHolder], code: 200, input: [], output: Inspection, side_effects: [] }
  - { method: GET, path: "/api/inspections", description: "List inspections (FK reverse lookup by registration)", roles: [PlatformAdmin, CommunityAdmin, Inspector, EnforcementOfficer, PermitHolder], code: 200, input: ["registration_id?", "limit?", "offset?"], output: "Inspection[]", side_effects: [] }
  - { method: POST, path: "/api/inspections/{id}/finalize", description: "Record component scores; computes total_score (per-component round then sum); PASSED recomputes registration finalized fee; FAILED suspends an ACTIVE registration and revokes its passes", roles: [Inspector], code: 200, input: [headlights_score, brake_lights_score, turn_signals_score, horn_score, mirrors_score, windshield_score, seatbelts_score, reflectors_score], output: Inspection, side_effects: ["inspection_total_score", "annual_registration_fee FINALIZED on pass", "registration SUSPENDED + passes REVOKED on fail when registration ACTIVE"] }

  # --- insurance ---
  - { method: POST, path: "/api/insurance-policies", description: "Document an insurance policy (coverage must meet community minimum)", roles: [PermitHolder], code: 201, input: [holder_id, vehicle_id, provider_name, policy_number, liability_coverage_cents, effective_date, expiry_date], output: InsurancePolicy, side_effects: [] }
  - { method: GET, path: "/api/insurance-policies/{id}", description: "Read a policy", roles: [PlatformAdmin, CommunityAdmin, Inspector, EnforcementOfficer, PermitHolder], code: 200, input: [], output: InsurancePolicy, side_effects: [] }
  - { method: GET, path: "/api/insurance-policies", description: "List policies (FK reverse lookup)", roles: [PlatformAdmin, CommunityAdmin, Inspector, EnforcementOfficer, PermitHolder], code: 200, input: ["holder_id?", "vehicle_id?", "limit?", "offset?"], output: "InsurancePolicy[]", side_effects: [] }
  - { method: POST, path: "/api/insurance-policies/{id}/cancel", description: "Cancel an ACTIVE policy", roles: [PermitHolder], code: 200, input: [], output: InsurancePolicy, side_effects: [] }

  # --- routes & route passes ---
  - { method: POST, path: "/api/routes", description: "Designate a street or path route", roles: [CommunityAdmin], code: 201, input: [community_id, name, route_type, allowed_vehicle_class], output: Route, side_effects: [] }
  - { method: GET, path: "/api/routes/{id}", description: "Read a route", roles: [PlatformAdmin, CommunityAdmin, Inspector, EnforcementOfficer, PermitHolder], code: 200, input: [], output: Route, side_effects: [] }
  - { method: GET, path: "/api/routes", description: "List routes (FK reverse lookup by community)", roles: [PlatformAdmin, CommunityAdmin, Inspector, EnforcementOfficer, PermitHolder], code: 200, input: ["community_id?", "limit?", "offset?"], output: "Route[]", side_effects: [] }
  - { method: POST, path: "/api/routes/{id}/decommission", description: "Decommission a route; revokes its ACTIVE route passes", roles: [CommunityAdmin], code: 200, input: [], output: Route, side_effects: ["route passes REVOKED cascade"] }
  - { method: POST, path: "/api/route-passes", description: "Book a half-open [start_at, end_at) pass for an ACTIVE registration on a DESIGNATED route; adjacent windows allowed, true overlap rejected", roles: [PermitHolder], code: 201, input: [route_id, registration_id, holder_id, start_at, end_at], output: RoutePass, side_effects: [] }
  - { method: GET, path: "/api/route-passes/{id}", description: "Read a route pass", roles: [PlatformAdmin, CommunityAdmin, Inspector, EnforcementOfficer, PermitHolder], code: 200, input: [], output: RoutePass, side_effects: [] }
  - { method: GET, path: "/api/route-passes", description: "List route passes (FK reverse lookup)", roles: [PlatformAdmin, CommunityAdmin, Inspector, EnforcementOfficer, PermitHolder], code: 200, input: ["route_id?", "registration_id?", "holder_id?", "limit?", "offset?"], output: "RoutePass[]", side_effects: [] }
  - { method: POST, path: "/api/route-passes/{id}/cancel", description: "Cancel an ACTIVE pass before its window begins", roles: [PermitHolder], code: 200, input: [], output: RoutePass, side_effects: [] }

  # --- charging infrastructure ---
  - { method: POST, path: "/api/charging-stations", description: "Create a charging station", roles: [CommunityAdmin], code: 201, input: [community_id, name, slot_count, rate_cents_per_min], output: ChargingStation, side_effects: [] }
  - { method: GET, path: "/api/charging-stations/{id}", description: "Read a station", roles: [PlatformAdmin, CommunityAdmin, Inspector, EnforcementOfficer, PermitHolder], code: 200, input: [], output: ChargingStation, side_effects: [] }
  - { method: GET, path: "/api/charging-stations", description: "List stations (FK reverse lookup by community)", roles: [PlatformAdmin, CommunityAdmin, Inspector, EnforcementOfficer, PermitHolder], code: 200, input: ["community_id?", "limit?", "offset?"], output: "ChargingStation[]", side_effects: [] }
  - { method: POST, path: "/api/charging-stations/{id}/set-offline", description: "Take station offline; future BOOKED reservations cancelled and fees refunded to wallets", roles: [CommunityAdmin], code: 200, input: [], output: ChargingStation, side_effects: ["reservations CANCELLED cascade", "wallet refunds"] }
  - { method: POST, path: "/api/charging-stations/{id}/set-online", description: "Return station to service", roles: [CommunityAdmin], code: 200, input: [], output: ChargingStation, side_effects: [] }
  - { method: POST, path: "/api/charging-reservations", description: "Book a charging slot (closed interval + 15-minute buffer per side); debits fee_cents from holder wallet", roles: [PermitHolder], code: 201, input: [station_id, holder_id, slot_index, start_at, end_at], output: ChargingReservation, side_effects: ["charging_fee", "wallet debit", "increments PermitHolder.version by 1"] }
  - { method: GET, path: "/api/charging-reservations/{id}", description: "Read a reservation", roles: [PlatformAdmin, CommunityAdmin, Inspector, EnforcementOfficer, PermitHolder], code: 200, input: [], output: ChargingReservation, side_effects: [] }
  - { method: GET, path: "/api/charging-reservations", description: "List reservations (FK reverse lookup)", roles: [PlatformAdmin, CommunityAdmin, Inspector, EnforcementOfficer, PermitHolder], code: 200, input: ["station_id?", "holder_id?", "limit?", "offset?"], output: "ChargingReservation[]", side_effects: [] }
  - { method: POST, path: "/api/charging-reservations/{id}/cancel", description: "Cancel a BOOKED reservation before start; full fee refund to wallet", roles: [PermitHolder], code: 200, input: [], output: ChargingReservation, side_effects: ["wallet refund", "increments PermitHolder.version by 1"] }

  # --- shared fleet ---
  - { method: POST, path: "/api/fleet-vehicles", description: "Add a shared fleet vehicle", roles: [CommunityAdmin], code: 201, input: [community_id, station_id, label], output: FleetVehicle, side_effects: [] }
  - { method: GET, path: "/api/fleet-vehicles/{id}", description: "Read a fleet vehicle", roles: [PlatformAdmin, CommunityAdmin, Inspector, EnforcementOfficer, PermitHolder], code: 200, input: [], output: FleetVehicle, side_effects: [] }
  - { method: GET, path: "/api/fleet-vehicles", description: "List fleet vehicles (FK reverse lookup)", roles: [PlatformAdmin, CommunityAdmin, Inspector, EnforcementOfficer, PermitHolder], code: 200, input: ["community_id?", "station_id?", "limit?", "offset?"], output: "FleetVehicle[]", side_effects: [] }
  - { method: POST, path: "/api/fleet-vehicles/{id}/set-maintenance", description: "Move AVAILABLE vehicle to MAINTENANCE; future BOOKED dispatches cancelled", roles: [CommunityAdmin], code: 200, input: [], output: FleetVehicle, side_effects: ["dispatches CANCELLED cascade"] }
  - { method: POST, path: "/api/fleet-vehicles/{id}/set-available", description: "Return MAINTENANCE vehicle to AVAILABLE", roles: [CommunityAdmin], code: 200, input: [], output: FleetVehicle, side_effects: [] }
  - { method: POST, path: "/api/fleet-dispatches", description: "Book a dispatch shift window (closed interval, no buffer) for a fleet vehicle; holder must be ELIGIBLE", roles: [PermitHolder], code: 201, input: [vehicle_id, holder_id, shift_start, shift_end], output: FleetDispatch, side_effects: [] }
  - { method: GET, path: "/api/fleet-dispatches/{id}", description: "Read a dispatch", roles: [PlatformAdmin, CommunityAdmin, Inspector, EnforcementOfficer, PermitHolder], code: 200, input: [], output: FleetDispatch, side_effects: [] }
  - { method: GET, path: "/api/fleet-dispatches", description: "List dispatches (FK reverse lookup)", roles: [PlatformAdmin, CommunityAdmin, Inspector, EnforcementOfficer, PermitHolder], code: 200, input: ["vehicle_id?", "holder_id?", "limit?", "offset?"], output: "FleetDispatch[]", side_effects: [] }
  - { method: POST, path: "/api/fleet-dispatches/{id}/checkout", description: "Check out the vehicle at/after shift_start; vehicle AVAILABLE required; bumps community checked_out_count", roles: [PermitHolder], code: 200, input: [], output: FleetDispatch, side_effects: ["FleetVehicle CHECKED_OUT", "Community.checked_out_count += 1"] }
  - { method: POST, path: "/api/fleet-dispatches/{id}/return", description: "Return the vehicle; computes late fine (ceil(days)*500 debited from wallet) when past shift_end; restores checked_out_count", roles: [PermitHolder], code: 200, input: [], output: FleetDispatch, side_effects: ["FleetVehicle AVAILABLE", "Community.checked_out_count -= 1", "late fine wallet debit if late"] }
  - { method: POST, path: "/api/fleet-dispatches/{id}/cancel", description: "Cancel a BOOKED dispatch before shift_start", roles: [PermitHolder], code: 200, input: [], output: FleetDispatch, side_effects: [] }

  # --- violations / enforcement ---
  - { method: POST, path: "/api/violations", description: "File a violation citation", roles: [EnforcementOfficer], code: 201, input: [holder_id, "registration_id?", violation_code, points_assessed, fine_cents, occurred_at], output: Violation, side_effects: [] }
  - { method: GET, path: "/api/violations/{id}", description: "Read a violation", roles: [PlatformAdmin, CommunityAdmin, EnforcementOfficer, PermitHolder], code: 200, input: [], output: Violation, side_effects: [] }
  - { method: GET, path: "/api/violations", description: "List violations (FK reverse lookup)", roles: [PlatformAdmin, CommunityAdmin, EnforcementOfficer], code: 200, input: ["holder_id?", "registration_id?", "limit?", "offset?"], output: "Violation[]", side_effects: [] }
  - { method: POST, path: "/api/violations/{id}/uphold", description: "Uphold a FILED violation; recomputes points/standing; flip into BARRED cascades registrations to SUSPENDED and their ACTIVE route passes to REVOKED", roles: [EnforcementOfficer], code: 200, input: [], output: Violation, side_effects: ["holder_points_standing", "compliance recompute", "registrations SUSPENDED cascade on BARRED", "route passes REVOKED cascade"] }
  - { method: POST, path: "/api/violations/{id}/dismiss", description: "Dismiss a FILED or UPHELD violation; recomputes points/standing downward (no automatic registration reinstatement)", roles: [EnforcementOfficer], code: 200, input: [], output: Violation, side_effects: ["holder_points_standing", "compliance recompute"] }

  # --- test-driving clock ---
  - { method: POST, path: "/_clock/set_current_utc", description: "Set the logical clock. Startup default is exactly 2026-05-01T00:00:00Z (never wall-clock); setting the clock evaluates all time-driven transitions: registration expiry/grace, route-pass completion, reservation completion, dispatch OVERDUE, insurance expiry", roles: [PlatformAdmin], code: 200, input: [to_iso8601], output: "{ current_utc: string }", side_effects: ["time-driven state transitions"] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_VALIDATION, http: 400, condition: "Malformed request: missing required field, out-of-range enum/integer, or window end not strictly after start" }
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID headers" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for the endpoint, or PermitHolder acting on a resource owned by another holder" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced path or body id does not exist" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource's own state machine rejects the transition from its current state" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "OCC expected_*_version does not match the stored parent version" }
  - { id: ERR_UNDERAGE_DRIVER, http: 422, condition: "Driver age < Community.min_driver_age at eligibility verification (exact min-age birthday passes)" }
  - { id: ERR_LICENSE_CLASS_INSUFFICIENT, http: 422, condition: "driver_license_class == NONE at eligibility verification" }
  - { id: ERR_EQUIPMENT_MINIMUM, http: 422, condition: "Vehicle lacks required safety equipment for its class at registration creation (LSV needs headlights, brake lights, seatbelts, mirror_count >= 1)" }
  - { id: ERR_DUPLICATE_REGISTRATION, http: 409, condition: "A non-terminal VehicleRegistration already exists for the same (vehicle_id, registration_year)" }
  - { id: ERR_INSPECTION_NOT_PASSED, http: 422, condition: "Activate/reinstate without a latest finalized inspection in PASSED status" }
  - { id: ERR_INSURANCE_MISSING, http: 422, condition: "No ACTIVE InsurancePolicy covers the vehicle while Community.insurance_required is true" }
  - { id: ERR_INSURANCE_COVERAGE_LOW, http: 422, condition: "liability_coverage_cents below Community.min_liability_coverage_cents at policy creation" }
  - { id: ERR_HOLDER_NOT_ELIGIBLE, http: 422, condition: "PermitHolder.eligibility_status != ELIGIBLE where required (activate, route pass, dispatch)" }
  - { id: ERR_HOLDER_BARRED, http: 422, condition: "PermitHolder.compliance_status == BARRED blocks activation, renewal, reinstatement" }
  - { id: ERR_ROUTE_NOT_DESIGNATED, http: 422, condition: "Route is DECOMMISSIONED at pass booking" }
  - { id: ERR_ROUTE_VEHICLE_CLASS, http: 422, condition: "GOLF_CART_ONLY route booked by an LSV registration" }
  - { id: ERR_ROUTE_PASS_OVERLAP, http: 409, condition: "Half-open [start_at, end_at) window collides with another ACTIVE pass on the same registration (adjacency allowed)" }
  - { id: ERR_CHARGING_OVERLAP, http: 409, condition: "Closed interval plus 15-minute buffer collides with another BOOKED reservation on the same (station, slot_index)" }
  - { id: ERR_DISPATCH_WINDOW_OVERLAP, http: 409, condition: "Closed [shift_start, shift_end] window collides with another non-terminal dispatch on the same vehicle (adjacency counts as overlap)" }
  - { id: ERR_STATION_OFFLINE, http: 409, condition: "Reservation attempted on an OFFLINE charging station" }
  - { id: ERR_INSUFFICIENT_FUNDS, http: 402, condition: "wallet_balance_cents below the amount to be debited (equality is sufficient)" }
  - { id: ERR_RENEWAL_WINDOW_CLOSED, http: 422, condition: "Renew attempted before the renewal window opens or after the late grace period closes" }
  - { id: ERR_FLEET_UNAVAILABLE, http: 409, condition: "Checkout attempted while the fleet vehicle is not AVAILABLE" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Anonymous
    description: "Unauthenticated caller; may only self-register as a permit holder"
    identity: opaque
    exclusive_operations: ["POST /api/permit-holders (self-registration)"]
    shared_operations: []

  - name: PlatformAdmin
    description: "Platform operator; manages communities and the logical clock"
    identity: opaque
    exclusive_operations: ["POST /api/communities", "PATCH /api/communities/{id}", "POST /_clock/set_current_utc"]
    shared_operations: ["GET reads across all resources"]

  - name: CommunityAdmin
    description: "Community program administrator; verifies eligibility, manages routes/stations/fleet, audits renewals, suspends/reinstates/revokes holders and registrations"
    identity: opaque
    exclusive_operations: ["verify-eligibility / suspend / reinstate / revoke on permit-holders", "routes create/decommission", "charging-stations create/set-offline/set-online", "fleet-vehicles create/set-maintenance/set-available", "registrations finalize-renewal / suspend / reinstate"]
    shared_operations: ["GET reads across all resources", "POST /api/permit-holders (admin-side registration)"]

  - name: Inspector
    description: "Certified safety inspector; schedules and finalizes inspections"
    identity: opaque
    exclusive_operations: ["POST /api/inspections", "POST /api/inspections/{id}/finalize"]
    shared_operations: ["GET reads across all resources"]

  - name: EnforcementOfficer
    description: "Ordinance enforcement; files/upholds/dismisses violations and revokes registrations"
    identity: opaque
    exclusive_operations: ["POST /api/violations", "POST /api/violations/{id}/uphold", "POST /api/violations/{id}/dismiss", "POST /api/registrations/{id}/revoke"]
    shared_operations: ["GET reads across all resources"]

  - name: PermitHolder
    description: "Resident permit holder acting on their own resources; X-User-ID must equal the PermitHolder id"
    identity: "entity_backed:PermitHolder"
    exclusive_operations: ["wallet deposits", "vehicles create/retire", "registrations create/activate/renew", "insurance policies create/cancel", "route-passes create/cancel", "charging-reservations create/cancel", "fleet-dispatches create/checkout/return/cancel"]
    shared_operations: ["GET reads of own resources"]
