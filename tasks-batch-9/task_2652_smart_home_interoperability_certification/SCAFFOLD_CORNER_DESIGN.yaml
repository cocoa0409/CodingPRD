              as: Member
              as_user_id: "${m1_id}"
            - call: "POST /members/${m1_id}/tool-access"
              payload: { decision: "GRANT" }
              as: ProgramAdmin
            - call: "POST /members/${m1_id}/credits"
              payload: { amount_cents: 1000000 }
              as: ProgramAdmin
            - call: "POST /members"
              payload: { legal_name: "Borea Labs", contact_email: "ops@borea.test", tier: "ADOPTER" }
              as: ProgramAdmin
              captures: { m2_id: $.data.id }
            - call: "POST /members/${m2_id}/ip-commitment"
              payload: { ip_commitment_type: "RAND_ROYALTY_FREE", essential_patent_count: 1, scope_specification_id: "${s2_id}" }
              as: Member
              as_user_id: "${m2_id}"
            - call: "POST /members/${m2_id}/tool-access"
              payload: { decision: "GRANT" }
              as: ProgramAdmin
            - call: "POST /members/${m2_id}/credits"
