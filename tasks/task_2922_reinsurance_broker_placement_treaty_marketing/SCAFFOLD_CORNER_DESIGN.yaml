              as: PlatformAdmin
              captures: { ced2: $.data.id }
            - call: "POST /reinsurers"
              payload: { name: "Alpha Re", security_rating: "AA", capacity_limit_minor: 5000000000, max_line_pct: 100.0000, lead_authorised: true }
