              payload: { cook_id: "${cook_id}", production_window_id: "${w_id}", basis: "CASH_HANDOFF", expected_production_window_version: "${w_version}" }
              as: FinanceOperator
              as_user_id: fin-1
              captures: { e_dup: "$.data.error_id" }
            - call: POST /cooks/${cook_id}/standing-actions
              payload: { action: "SUSPEND", reason: "unrelated investigation opened" }
              as: SafetyOfficer
              as_user_id: so-1
              captures: { standing_susp: "$.data.compliance_standing" }
            - call: POST /payout-statements/${ps_id}/advance
              payload: { to_status: "PAID" }
              as: FinanceOperator
              as_user_id: fin-1
              captures: { e_hold: "$.data.error_id" }
            - call: POST /cooks/${cook_id}/standing-actions
              payload: { action: "REINSTATE", reason: "investigation closed with no finding" }
              as: SafetyOfficer
              as_user_id: so-1
              captures: { standing_clear: "$.data.compliance_standing" }
            - call: POST /payout-statements/${ps_id}/advance
              payload: { to_status: "PAID" }
              as: FinanceOperator
              as_user_id: fin-1
              captures: { ps_status: "$.data.status", ps_paid_at: "$.data.paid_at" }
            - call: GET /cooks/${cook_id}
              payload: {}
              as: FinanceOperator
              as_user_id: fin-1
              captures: { lifetime: "$.data.lifetime_paid_cents", pending: "$.data.pending_payout_cents" }
          assert:
            - "${w_status} == CLOSED"
            - "${e_dup} == ERR_DUPLICATE_FINALIZED_STATEMENT with HTTP 409: the existing statement for this (cook, window) pair is FINALIZED, so a second one may not be created even under the other basis"
            - "${standing_susp} == SUSPENDED while PayoutStatement.${ps_id}.status is still FINALIZED (the two entities' dimensions are independent)"
            - "${e_hold} == ERR_PAYOUT_HOLD_ACTIVE with HTTP 409, not ERR_INVALID_STATEMENT_TRANSITION: priority 48 owns this precondition"
            - "PayoutStatement.${ps_id}.paid_at is still null after the rejection, and net_payout_cents is still 520 (money fields were frozen at creation and are not re-derived by the failed advance)"
