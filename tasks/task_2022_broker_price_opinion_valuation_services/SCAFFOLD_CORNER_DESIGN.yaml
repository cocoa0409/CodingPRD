              as: ComplianceOfficer
            - call: "POST /bpo/client-accounts"
              payload: { client_code: "CT1", display_name: "T Co", sla_hours_standard: 72, sla_hours_rush: 24 }
              as: PlatformAdmin
              captures: { cl_t: $.data.id }
            - call: "POST /bpo/brokers"
