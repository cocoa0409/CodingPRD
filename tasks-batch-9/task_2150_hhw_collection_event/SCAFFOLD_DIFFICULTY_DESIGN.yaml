  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: containment_failure_cascades_to_program_posture_depth4
        grounds:
          - state_machines.CollectionEvent.containment_status.COMPLIANT_to_DEFICIENT
          - state_machines.Appointment.CONFIRMED_to_WAITLISTED
          - entities.CollectionEvent.fields.projected_cost_per_participant_cents
          - calculations.program_posture
          - entities.Program.fields.budget_alert_count
        distinguishing_aspect: |
          Trigger is a FAILED event containment inspection, and each hop is caused by the previous one:
          (1) containment_status becomes DEFICIENT; (2) BECAUSE the event is DEFICIENT the two CONFIRMED
          appointments fall to WAITLISTED and release their reservations; (3) BECAUSE reserved_slot_count
          dropped from 2 to 0 the event recomputes projected_cost_per_participant_cents from 29400 to
          58800; (4) BECAUSE 58800 now exceeds the program's 30000 ceiling, Program.posture flips
          OPEN -> RESTRICTED and budget_alert_count increments to 1.
        test_recipe:
          setup:
            - "Program with cost_per_participant_ceiling_cents 30000, budget 40000000, staff rate 4200"
            - "APPROVED site (2000 L, 4 lanes); event 2026-09-12T08:00Z..20:00Z OPEN_FOR_REGISTRATION with containment COMPLIANT"
            - "Lane assignment L1 on lane 1 for 08:00-10:00 (2.00 h) giving slot_capacity 8; two residents CONFIRMED (declared 10.0 kg and 12.0 kg)"
            - "Lane assignment L2 on lane 2 for 08:00-20:00 (12.00 h) added afterwards, lifting certified_staff_hours to 14.00 and staffing_cost_cents to 58800 while projected cost is still 29400 (<= 30000) and Program.posture is OPEN"
          setup_api_calls:
            - call: "POST /hhw/programs"
              payload: { name: "Jeffco HHW Program", fiscal_year: 2027, budget_cents: 40000000, cost_per_participant_ceiling_cents: 30000, staff_hourly_rate_cents: 4200, eligible_jurisdiction_codes: ["CO-DEN", "CO-ARV"] }
              as: ProgramAdmin
              captures: { prog_id: $.data.id }
            - call: "POST /hhw/sites"
              payload: { program_id: "${prog_id}", name: "Arvada Public Works Yard", address: "5100 Ralston Road", impervious_surface: true, secondary_containment_liters: 2000, storm_drain_distance_m: 15.0, lane_count: 4 }
              as: EventCoordinator
              captures: { site_id: $.data.id }
            - call: "POST /hhw/sites/${site_id}/transitions"
              payload: { action: "APPROVE", finding_code: "PAD-OK" }
              as: ContainmentInspector
              as_user_id: "insp-site-approver"
            - call: "POST /hhw/material-categories"
              payload: { program_id: "${prog_id}", code: "LATEX_PAINT", display_name: "Latex Paint", acceptance_policy: "ACCEPTED_WITH_LIMIT", compatibility_class: "TOXIC", dot_hazard_class: "NA", max_kg_per_resident_per_event: 25.0, max_kg_per_resident_per_year: 60.0, disposal_rate_cents_per_kg: 155 }
              as: ProgramAdmin
              captures: { cat_latex: $.data.id }
            - call: "POST /hhw/events"
              payload: { program_id: "${prog_id}", site_id: "${site_id}", window_start_utc: "2026-09-12T08:00:00.000Z", window_end_utc: "2026-09-12T20:00:00.000Z", min_viable_registrations: 20 }
              as: EventCoordinator
              captures: { ev_id: $.data.id }
            - call: "POST /hhw/events/${ev_id}/transitions"
              payload: { action: "CONFIRM_SITE" }
              as: EventCoordinator
            - call: "POST /hhw/staffers"
              payload: { program_id: "${prog_id}", full_name: "Dana Reyes", role_code: "UNLOAD", hazwoper_expires_on: "2027-06-30" }
              as: EventCoordinator
              captures: { staffer_1: $.data.id }
            - call: "POST /hhw/lane-assignments"
              payload: { event_id: "${ev_id}", staffer_id: "${staffer_1}", lane_number: 1, start_utc: "2026-09-12T08:00:00.000Z", end_utc: "2026-09-12T10:00:00.000Z" }
              as: EventCoordinator
            - call: "POST /hhw/events/${ev_id}/containment-inspections"
              payload: { result: "PASS", finding_code: "PAD-OK" }
              as: ContainmentInspector
              as_user_id: "insp-event-daily"
              captures: { cap_initial: $.data.slot_capacity }
            - call: "POST /hhw/events/${ev_id}/transitions"
              payload: { action: "OPEN_REGISTRATION" }
              as: EventCoordinator
            - call: "POST /hhw/residents"
              payload: { program_id: "${prog_id}", full_name: "Ana Ruiz", street_address: "12 Elm Street", claimed_jurisdiction_code: "CO-ARV" }
              as: Anonymous
              captures: { res1_id: $.data.id }
            - call: "POST /hhw/residents/${res1_id}/eligibility-actions"
              payload: { action: "VERIFY", verified_jurisdiction_code: "CO-ARV" }
              as: EligibilityClerk
              captures: { res1_v: $.data.version }
            - call: "POST /hhw/appointments"
              payload: { event_id: "${ev_id}", resident_id: "${res1_id}", slot_start_utc: "2026-09-12T09:00:00.000Z", waste_origin: "HOUSEHOLD", declared_total_kg: 10.0, declared_category_ids: ["${cat_latex}"], expected_resident_version: "${res1_v}", vehicle_count: 1 }
              as: EligibilityClerk
              captures: { appt1: $.data.id }
            - call: "POST /hhw/appointments/${appt1}/transitions"
              payload: { action: "CONFIRM" }
              as: EligibilityClerk
            - call: "POST /hhw/residents"
              payload: { program_id: "${prog_id}", full_name: "Ben Ortiz", street_address: "44 Oak Street", claimed_jurisdiction_code: "CO-DEN" }
              as: Anonymous
              captures: { res2_id: $.data.id }
            - call: "POST /hhw/residents/${res2_id}/eligibility-actions"
              payload: { action: "VERIFY", verified_jurisdiction_code: "CO-DEN" }
              as: EligibilityClerk
              captures: { res2_v: $.data.version }
            - call: "POST /hhw/appointments"
              payload: { event_id: "${ev_id}", resident_id: "${res2_id}", slot_start_utc: "2026-09-12T09:15:00.000Z", waste_origin: "HOUSEHOLD", declared_total_kg: 12.0, declared_category_ids: ["${cat_latex}"], expected_resident_version: "${res2_v}", vehicle_count: 1 }
              as: EligibilityClerk
              captures: { appt2: $.data.id }
            - call: "POST /hhw/appointments/${appt2}/transitions"
              payload: { action: "CONFIRM" }
              as: EligibilityClerk
            - call: "POST /hhw/staffers"
              payload: { program_id: "${prog_id}", full_name: "Mo Chen", role_code: "TRAFFIC", hazwoper_expires_on: "2027-06-30" }
              as: EventCoordinator
              captures: { staffer_2: $.data.id }
            - call: "POST /hhw/lane-assignments"
              payload: { event_id: "${ev_id}", staffer_id: "${staffer_2}", lane_number: 2, start_utc: "2026-09-12T08:00:00.000Z", end_utc: "2026-09-12T20:00:00.000Z" }
              as: EventCoordinator
            - call: "GET /hhw/events/${ev_id}"
              as: EventCoordinator
              captures: { hours_pre: $.data.certified_staff_hours, staffcost_pre: $.data.staffing_cost_cents, projected_pre: $.data.projected_cost_per_participant_cents, reserved_pre: $.data.reserved_slot_count }
            - call: "GET /hhw/programs/${prog_id}"
              as: ProgramAdmin
              captures: { posture_pre: $.data.posture, alerts_pre: $.data.budget_alert_count }
          trigger:
            - call: "POST /hhw/events/${ev_id}/containment-inspections"
              payload: { result: "FAIL", finding_code: "SUMP-OVERFLOW" }
              as: ContainmentInspector
              as_user_id: "insp-event-daily"
              captures: { cont_post: $.data.containment_status, reserved_post: $.data.reserved_slot_count, projected_post: $.data.projected_cost_per_participant_cents, cap_post: $.data.slot_capacity }
          assert:
            - "${cap_initial} == 8"
            - "${hours_pre} == 14.0 and ${staffcost_pre} == 58800"
            - "${reserved_pre} == 2 and ${projected_pre} == 29400"
            - "${posture_pre} == OPEN and ${alerts_pre} == 0"
            - "HOP 1: ${cont_post} == DEFICIENT"
            - "HOP 2: Appointment.${appt1}.status == WAITLISTED and Appointment.${appt1}.waitlist_reason == CONTAINMENT_DEFICIENCY"
            - "HOP 2: Appointment.${appt2}.status == WAITLISTED and Appointment.${appt2}.waitlist_reason == CONTAINMENT_DEFICIENCY"
            - "HOP 2: Resident.${res1_id}.annual_quantity_reserved_kg == 0.0"
            - "HOP 2: Resident.${res2_id}.annual_quantity_reserved_kg == 0.0"
            - "HOP 3: ${reserved_post} == 0 and ${projected_post} == 58800"
            - "HOP 4: Program.${prog_id}.posture == RESTRICTED"
            - "HOP 4: Program.${prog_id}.budget_alert_count == 1"
            - "Program.${prog_id}.open_containment_deficiency_count == 1"
            - "${cap_post} == 0"

      - name: event_cancellation_cascades_back_to_open_posture_depth4
        grounds:
          - state_machines.CollectionEvent.lifecycle_status.OPEN_FOR_REGISTRATION_to_CANCELLED
          - state_machines.Appointment.REQUESTED_to_CANCELLED
          - calculations.staff_hours_ledger
          - calculations.program_posture
          - entities.LaneAssignment.fields.status
        distinguishing_aspect: |
          Trigger is an event CANCEL — a different triggering transition from the containment inspection
          cascade — and the hops chain: (1) lifecycle_status becomes CANCELLED; (2) BECAUSE the event was
          cancelled its open appointment is CANCELLED with cancel_reason EVENT_CANCELLED and its ACTIVE
          lane assignment is RELEASED; (3) BECAUSE the assignment was released, Staffer.assigned_hours
          falls 12.0 -> 0.0 and the event's staffing_cost_cents falls 50400 -> 0; (4) BECAUSE the event
          left OPEN_FOR_REGISTRATION its projected cost no longer feeds the posture rule, so
          Program.posture recovers RESTRICTED -> OPEN while budget_alert_count stays at 1.
        test_recipe:
          setup:
            - "Program with cost_per_participant_ceiling_cents 30000, budget 40000000, staff rate 4200"
            - "APPROVED site; event 2026-09-12T08:00Z..20:00Z with containment COMPLIANT, one ACTIVE 12.00 h lane assignment (staffing_cost_cents 50400)"
            - "The event opened for registration while posture was still OPEN; the post-transition recompute drove projected_cost_per_participant_cents to 50400 (> 30000), so Program.posture is RESTRICTED and budget_alert_count is 1"
            - "One resident holds a REQUESTED appointment on that event (booking is not posture-gated)"
          setup_api_calls:
