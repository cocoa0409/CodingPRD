              payload: { vehicle_id: "${veh_id}", pack_id: "${pack_id}", severity: "S3", detected_at: "2026-07-30T00:00:00Z", source: "TELEMATICS", affected_module_positions: [3, 7] }
              as: TelematicsGateway
            - call: "POST /battery-warranty/pack-shipments"
              payload: { pack_id: "${pack_id}", origin_service_center_id: "${center_id}", certifying_technician_id: "${tech_a_id}", shipment_contents: "FULL_PACK", packaging_spec: "SP376_STRONG_OUTER", state_of_charge_pct: 30.00, destination: "REMAN_CENTER" }
              as: ServiceTechnician
              as_user_id: "${tech_a_id}"
              captures: { ship_id: $.data.id }
            - call: "POST /battery-warranty/pack-shipments/${ship_id}/tender"
