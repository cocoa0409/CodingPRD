  - rule_id: transitive_cascade
    instances:

      - name: custody_evidence_deficiency_four_hop_cascade
        grounds:
          - state_machines.CustodyRulesEvidence.SUBMITTED_to_DEFICIENT
          - state_machines.AdvisorFirm.OPEN_to_LIMITED
          - state_machines.DataFeedProvision.ACTIVE_to_THROTTLED
