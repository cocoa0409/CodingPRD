              payload: { collective_id: "${col_id}", athlete_id: "${ath_id}", total_value_cents: 3000000, effective_start_at: "2026-08-01T00:00:00Z", effective_end_at: "2026-12-31T00:00:00Z", funding_designation: "UNRESTRICTED" }
              as: CollectiveDirector
