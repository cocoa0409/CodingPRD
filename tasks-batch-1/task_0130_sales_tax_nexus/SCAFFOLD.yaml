scenario: |
  Sales Tax Compliance (Nexus): product taxability/category, economic-nexus threshold by state,
  origin/destination rate, exemption certificate, marketplace facilitator, return filing/remittance,
  audit trail, use tax accrual

domain_name: sales-tax-nexus
api_prefix: ""

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: pricing_engine
  complexity_layers:
    - rate_threshold_triggers          # economic-nexus thresholds flip nexus posture at a breakpoint
    - derived_field_reconciliation     # NexusProfile.nexus_status derived from cumulative sales/txn-count
    - cascading_side_effects           # transaction settle -> nexus accrue -> posture flip
    - dual_variant_calculation         # origin vs destination sourcing; seller-collected vs marketplace-facilitated

  entity_topology: flat
  # Peer entities linked by foreign keys, addressed at top-level collections so children are discoverable
  # via filtered-list GETs (e.g., GET /transactions?seller_id=...). TransactionLineItem and RemittancePayment
  # are conceptual children but addressed flatly with a parent FK.

  state_machine_shape: parallel
  # Transaction carries two independent state dimensions (settlement_status x audit_status); TaxReturn is a
  # branching fork-join with revert (DRAFT -> {ACCEPTED, REJECTED}, REJECTED -> DRAFT); ExemptionCertificate
  # is a revision/revoke cycle (ACTIVE <-> REVOKED).

  relationship_patterns:
    - one_to_many        # Seller -> Transaction, Seller -> NexusProfile, TaxReturn -> RemittancePayment
    - cross_aggregate    # Transaction references NexusProfile, ExemptionCertificate, MarketplaceFacilitator across aggregates

  role_model: segregation_of_duties
  # The user who PREPARES a TaxReturn (TaxPreparer) cannot APPROVE/FILE it (TaxApprover); plus an opaque Auditor.

  consistency_model: immediate

# ---------------------------------------------------------------------------
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# ---------------------------------------------------------------------------
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# §1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:

  - name: TaxJurisdiction
    parent: null
    common_fields: true
    fields:
      - name: state_code
        type: string
        source: input
        description: "Two-letter USPS state code; unique across jurisdictions."
        constraints: "Uppercase A-Z, length 2; unique."
      - name: sourcing_rule
        type: enum
        source: input
        description: "Whether tax rate is taken at the seller's origin state or the buyer's destination state."
        constraints: "ORIGIN | DESTINATION"
      - name: state_rate
        type: number
        source: input
        description: "State-level tax rate as a decimal fraction (e.g., 0.0725 for 7.25%)."
        constraints: ">= 0 and <= 0.25"
      - name: local_rate
        type: number
        source: input
        description: "Aggregate local (county/city) rate added to state_rate; decimal fraction."
        constraints: ">= 0 and <= 0.10"
        default: 0
      - name: reduced_rate
        type: number
        source: input
        description: "Reduced rate applied to product categories whose taxability is REDUCED in this jurisdiction; decimal fraction."
        constraints: ">= 0 and <= 0.25"
        default: 0
      - name: economic_nexus_sales_threshold
        type: number
        source: input
        description: "Gross-sales dollar threshold (inclusive) at or above which economic nexus is established in this state."
        constraints: "> 0"
      - name: economic_nexus_txn_threshold
        type: integer
        source: input
        description: "Transaction-count threshold (inclusive) at or above which economic nexus is established; 0 disables the count test."
        constraints: ">= 0"
        default: 0
      - name: combined_rate
        type: number
        source: computed
        description: "Convenience: state_rate + local_rate. Recomputed on every mutation of either rate."

  - name: ProductCategory
    parent: null
    common_fields: true
    fields:
      - name: jurisdiction_id
        type: string
        source: input
        description: "FK -> TaxJurisdiction.id; the state whose taxability rule this row encodes."
      - name: category_code
        type: string
        source: input
        description: "Product category label (e.g., TANGIBLE, GROCERY, DIGITAL); unique within a jurisdiction."
        constraints: "Unique per (jurisdiction_id, category_code)."
      - name: taxability
        type: enum
        source: input
        description: "How this category is taxed in this jurisdiction."
        constraints: "FULL | REDUCED | EXEMPT"

  - name: Seller
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: "Registered legal name of the taxpayer."
      - name: origin_state_code
        type: string
        source: input
        description: "The seller's physical/origin state code; used when a destination jurisdiction's sourcing_rule is ORIGIN."
        constraints: "Uppercase A-Z, length 2."
      - name: status
        type: enum
        source: system
        description: "Lifecycle status of the seller account."
        default: ACTIVE
        constraints: "ACTIVE | SUSPENDED"

  - name: NexusProfile
    parent: null
    common_fields: true
    fields:
      - name: seller_id
        type: string
        source: input
        description: "FK -> Seller.id; the seller this state-level nexus accumulator belongs to."
      - name: jurisdiction_id
        type: string
        source: input
        description: "FK -> TaxJurisdiction.id; the state being tracked. Unique per (seller_id, jurisdiction_id)."
        constraints: "Unique per (seller_id, jurisdiction_id)."
      - name: cumulative_taxable_sales
        type: number
        source: computed
        description: "Running sum of taxable_subtotal over this seller's SETTLED, non-VOIDED, SELLER-responsible transactions sourced to this state; reduced when such a transaction is voided."
        default: 0
      - name: cumulative_txn_count
        type: integer
        source: computed
        description: "Running count of this seller's SETTLED, non-VOIDED, SELLER-responsible transactions sourced to this state; reduced when such a transaction is voided."
        default: 0
      - name: nexus_status
        type: enum
        source: computed
        description: "Derived posture. NO_NEXUS until a threshold is crossed, then THRESHOLD_MET, then REGISTERED once the seller registers."
        default: NO_NEXUS
        constraints: "NO_NEXUS | THRESHOLD_MET | REGISTERED"
      - name: registered_at
        type: datetime
        source: system
        description: "Timestamp the seller registered for collection in this state; null until REGISTERED."
        default: null

  - name: ExemptionCertificate
    parent: null
    common_fields: true
    fields:
      - name: seller_id
        type: string
        source: input
        description: "FK -> Seller.id; the seller who holds this customer's certificate on file."
      - name: jurisdiction_id
        type: string
        source: input
        description: "FK -> TaxJurisdiction.id; the state in which this certificate exempts purchases."
      - name: customer_ref
        type: string
        source: input
        description: "Opaque buyer reference the certificate is issued to; matched against Transaction.customer_ref."
      - name: exempt_category_code
        type: string
        source: input
        description: "Product category this certificate exempts; a transaction line is exempted only when its category_code matches this value."
      - name: valid_from
        type: datetime
        source: input
        description: "Inclusive start of the certificate's validity window (ISO 8601 UTC)."
      - name: valid_to
        type: datetime
        source: input
        description: "Exclusive end of the certificate's validity window (ISO 8601 UTC); must be strictly after valid_from."
      - name: status
        type: enum
        source: system
        description: "Lifecycle status; only ACTIVE certificates within their window exempt a transaction at settlement time."
        default: ACTIVE
        constraints: "ACTIVE | REVOKED | EXPIRED"

  - name: MarketplaceFacilitator
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Marketplace facilitator legal name (a platform that collects/remits on the seller's behalf)."
      - name: collecting_state_codes
        type: array
        source: input
        description: "State codes in which this facilitator assumes collection-and-remittance responsibility for facilitated sales."
        constraints: "Each element uppercase A-Z length 2; non-empty array."

  - name: Transaction
    parent: null
    common_fields: true
    fields:
      - name: seller_id
        type: string
        source: input
        description: "FK -> Seller.id; the seller making the sale."
      - name: jurisdiction_id
        type: string
        source: input
        description: "FK -> TaxJurisdiction.id; the destination (buyer) state of the sale."
      - name: facilitator_id
        type: string
        source: input
        description: "FK -> MarketplaceFacilitator.id; set when the sale is facilitated by a marketplace, else null."
        default: null
      - name: customer_ref
        type: string
        source: input
        description: "Opaque buyer reference; matched against ExemptionCertificate.customer_ref for exemption lookup."
      - name: customer_exempt_requested
        type: boolean
        source: input
        description: "Client flag asserting the buyer claims exemption; only honored if an ACTIVE matching certificate exists at settlement."
        default: false
      - name: sourcing_used
        type: enum
        source: computed
        description: "Sourcing applied at settlement: ORIGIN uses the seller's origin state's combined_rate, DESTINATION uses this jurisdiction's combined_rate."
        constraints: "ORIGIN | DESTINATION"
      - name: applied_rate
        type: number
        source: computed
        description: "The combined_rate actually applied to FULL lines; decimal fraction recorded at settlement."
      - name: taxable_subtotal
        type: number
        source: computed
        description: "Sum over line items of (quantity * unit_price) for lines whose resolved line_taxability is not EXEMPT; 2 dp."
        default: 0
      - name: tax_collected
        type: number
        source: computed
        description: "Total sales tax computed by per-line-item round-then-sum (see calculations.line_item_tax); 2 dp."
        default: 0
      - name: remittance_responsibility
        type: enum
        source: computed
        description: "SELLER when the seller must remit; MARKETPLACE when a facilitator collecting in the destination state assumes it."
        constraints: "SELLER | MARKETPLACE"
      - name: settlement_status
        type: enum
        source: system
        description: "Settlement dimension of the parallel state machine."
        default: PENDING
        constraints: "PENDING | SETTLED | VOIDED"
      - name: audit_status
        type: enum
        source: system
        description: "Independent audit dimension of the parallel state machine; an auditor may FLAG/CLEAR irrespective of settlement_status."
        default: UNREVIEWED
        constraints: "UNREVIEWED | FLAGGED | CLEARED"
      - name: tax_return_id
        type: string
        source: system
        description: "FK -> TaxReturn.id; set when this transaction is swept into an accepted return; null until then."
        default: null

  - name: TransactionLineItem
    parent: Transaction
    common_fields: false
    fields:
      - name: transaction_id
        type: string
        source: input
        description: "FK -> Transaction.id; the parent sale."
      - name: category_code
        type: string
        source: input
        description: "Product category for this line; resolved against ProductCategory for the sourced jurisdiction to determine taxability."
      - name: quantity
        type: integer
        source: input
        description: "Units sold on this line."
        constraints: ">= 1"
      - name: unit_price
        type: number
        source: input
        description: "Per-unit price in dollars; 2 dp."
        constraints: "> 0"
      - name: line_taxability
        type: enum
        source: computed
        description: "Resolved taxability for this line at settlement: FULL, REDUCED, or EXEMPT (category-exempt or certificate-exempted)."
        constraints: "FULL | REDUCED | EXEMPT"
      - name: line_tax
        type: number
        source: computed
        description: "Tax for this line, rounded to 2 dp BEFORE being summed into the transaction total (round-then-sum order)."
        default: 0

  - name: UseTaxAccrual
    parent: null
    common_fields: true
    fields:
      - name: seller_id
        type: string
        source: input
        description: "FK -> Seller.id; the seller self-assessing use tax on an untaxed purchase."
      - name: jurisdiction_id
        type: string
        source: input
        description: "FK -> TaxJurisdiction.id; the state whose use-tax rate applies."
      - name: purchase_amount
        type: number
        source: input
        description: "Untaxed purchase amount in dollars on which use tax is self-assessed; 2 dp."
        constraints: "> 0"
      - name: accrued_use_tax
        type: number
        source: computed
        description: "purchase_amount * destination combined_rate, 2 dp; self-assessed amount owed."
      - name: status
        type: enum
        source: system
        description: "Lifecycle status."
        default: ACCRUED
        constraints: "ACCRUED | INCLUDED_IN_RETURN"
      - name: tax_return_id
        type: string
        source: system
        description: "FK -> TaxReturn.id; set when this accrual is swept into an accepted return; null until then."
        default: null

  - name: TaxReturn
    parent: null
    common_fields: true
    fields:
      - name: seller_id
        type: string
        source: input
        description: "FK -> Seller.id; the filer."
      - name: jurisdiction_id
        type: string
        source: input
        description: "FK -> TaxJurisdiction.id; the state being filed for."
      - name: period_start
        type: datetime
        source: input
        description: "Inclusive start of the filing period (ISO 8601 UTC)."
      - name: period_end
        type: datetime
        source: input
        description: "Exclusive end of the filing period (ISO 8601 UTC); must be strictly after period_start."
      - name: prepared_by
        type: string
        source: system
        description: "X-User-ID of the TaxPreparer who created (DRAFT) the return; recorded for segregation-of-duties enforcement."
      - name: approved_by
        type: string
        source: system
        description: "X-User-ID of the TaxApprover who accepted the return; null until ACCEPTED; MUST differ from prepared_by."
        default: null
      - name: tax_due
        type: number
        source: computed
        description: "Computed at acceptance: seller-responsible sales tax over swept transactions + accrued use tax in the period; 2 dp."
        default: 0
      - name: status
        type: enum
        source: system
        description: "Return lifecycle."
        default: DRAFT
        constraints: "DRAFT | ACCEPTED | REJECTED | FILED | REMITTED"

  - name: RemittancePayment
    parent: TaxReturn
    common_fields: true
    fields:
      - name: tax_return_id
        type: string
        source: input
        description: "FK -> TaxReturn.id; the FILED return this payment remits."
      - name: amount
        type: number
        source: input
        description: "Payment amount in dollars; must equal the return's tax_due to fully remit; 2 dp."
        constraints: "> 0"
      - name: status
        type: enum
        source: system
        description: "Payment status."
        default: APPLIED
        constraints: "APPLIED"

  - name: AuditLogEntry
    parent: null
    common_fields: false
    fields:
      - name: seller_id
        type: string
        source: input
        description: "FK -> Seller.id; the seller whose activity this append-only entry records."
      - name: subject_entity
        type: string
        source: input
        description: "Entity type the entry concerns (e.g., Transaction, TaxReturn, ExemptionCertificate)."
      - name: subject_id
        type: string
        source: input
        description: "Id of the subject record."
      - name: action
        type: string
        source: input
        description: "Action recorded (e.g., SETTLE, VOID, FILE_RETURN, FLAG, REVOKE_CERTIFICATE)."
      - name: actor_role
        type: string
        source: system
        description: "X-User-Role that performed the action, stamped by the server."
      - name: actor_id
        type: string
        source: system
        description: "X-User-ID that performed the action, stamped by the server."

# ---------------------------------------------------------------------------
# §1.2 State Machine Table
# ---------------------------------------------------------------------------
state_machines:

  # ---- Transaction: PARALLEL dimensions (settlement_status x audit_status) ----
  - entity: Transaction
    initial_state: PENDING               # settlement dimension initial; audit dimension initial = UNREVIEWED
    terminal_states: [VOIDED]
    transitions:
      # settlement dimension
      - from: PENDING
        to: SETTLED
        trigger: "POST /transactions/{id}/settle"
        actor: Seller
        preconditions:
          - "Transaction.settlement_status == PENDING"
          - "Transaction has >= 1 TransactionLineItem (else ERR_INVALID_STATE)"
          - "Seller.status == ACTIVE (else ERR_SELLER_SUSPENDED)"
        side_effects:
          - "Resolve per-line line_taxability against ProductCategory for the sourced jurisdiction and any ACTIVE matching ExemptionCertificate; set each TransactionLineItem.line_taxability"
          - "Compute sourcing_used, applied_rate, taxable_subtotal, line_tax per line, and tax_collected (calculations.line_item_tax + sourcing_resolution)"
          - "Set remittance_responsibility (calculations.remittance_responsibility)"
          - "When remittance_responsibility == SELLER: increment NexusProfile(seller_id, sourced-state).cumulative_taxable_sales by taxable_subtotal and cumulative_txn_count by 1, then recompute NexusProfile.nexus_status (calculations.nexus_status) — if it flips NO_NEXUS -> THRESHOLD_MET in this same call, that flip is the cascade hop"
          - "Append an AuditLogEntry(action=SETTLE)"
          - "increments Transaction.version by 1"
        note: "The sourced state for nexus accrual is the destination jurisdiction when sourcing_used==DESTINATION, else the jurisdiction whose state_code == Seller.origin_state_code."
      - from: SETTLED
        to: VOIDED
        trigger: "POST /transactions/{id}/void"
        actor: Seller
        preconditions:
          - "Transaction.settlement_status == SETTLED"
          - "Transaction.tax_return_id == null (not yet swept into a return; else ERR_TRANSACTION_LOCKED)"
        side_effects:
          - "When remittance_responsibility == SELLER: decrement NexusProfile(seller_id, sourced-state).cumulative_taxable_sales by taxable_subtotal and cumulative_txn_count by 1, then recompute NexusProfile.nexus_status — posture may step THRESHOLD_MET -> NO_NEXUS but never below REGISTERED (registration is sticky)"
          - "Append an AuditLogEntry(action=VOID)"
          - "increments Transaction.version by 1"
        note: "Compensating action for SETTLE; the conserved quantity is NexusProfile.cumulative_taxable_sales (Rule 9)."
      # audit dimension (independent of settlement_status)
      - from: UNREVIEWED
        to: FLAGGED
        trigger: "POST /transactions/{id}/flag"
        actor: Auditor
        preconditions:
          - "Transaction.audit_status == UNREVIEWED"
        side_effects:
          - "Append an AuditLogEntry(action=FLAG)"
          - "increments Transaction.version by 1"
        note: "Audit dimension evolves independently; flagging a PENDING or a SETTLED transaction are both allowed."
      - from: FLAGGED
        to: CLEARED
        trigger: "POST /transactions/{id}/clear"
        actor: Auditor
        preconditions:
          - "Transaction.audit_status == FLAGGED"
        side_effects:
          - "Append an AuditLogEntry(action=CLEAR)"
          - "increments Transaction.version by 1"

  # ---- ExemptionCertificate: revision/revoke cycle ----
  - entity: ExemptionCertificate
    initial_state: ACTIVE
    terminal_states: [EXPIRED]
    transitions:
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /exemption-certificates/{id}/revoke"
        actor: Seller
        preconditions:
          - "ExemptionCertificate.status == ACTIVE"
        side_effects:
          - "Append an AuditLogEntry(action=REVOKE_CERTIFICATE)"
          - "increments ExemptionCertificate.version by 1"
        note: "A REVOKED certificate no longer exempts future settlements; already-settled transactions are unaffected."
      - from: REVOKED
        to: ACTIVE
        trigger: "POST /exemption-certificates/{id}/reinstate"
        actor: Seller
        preconditions:
          - "ExemptionCertificate.status == REVOKED"
          - "current clock < ExemptionCertificate.valid_to (else ERR_VALIDATION_FAILED)"
        side_effects:
          - "Append an AuditLogEntry(action=REINSTATE_CERTIFICATE)"
          - "increments ExemptionCertificate.version by 1"
        note: "Revision cycle ACTIVE<->REVOKED; cannot reinstate once clock >= valid_to."
      - from: ACTIVE
        to: EXPIRED
        trigger: "system: settlement observes current clock >= valid_to"
        actor: system
        preconditions:
          - "ExemptionCertificate.status == ACTIVE"
          - "current clock >= ExemptionCertificate.valid_to"
        side_effects:
          - "Certificate ceases to exempt; transaction settlement treats the matching line as non-exempt"
        note: "Lazy expiry evaluated at settlement; no separate write endpoint."

  # ---- NexusProfile: derived posture; registration is sticky ----
  - entity: NexusProfile
    initial_state: NO_NEXUS
    terminal_states: []
    transitions:
      - from: NO_NEXUS
        to: THRESHOLD_MET
        trigger: "system: transaction settle accrual crosses a threshold"
        actor: system
        preconditions:
          - "cumulative_taxable_sales >= jurisdiction.economic_nexus_sales_threshold OR (jurisdiction.economic_nexus_txn_threshold > 0 AND cumulative_txn_count >= jurisdiction.economic_nexus_txn_threshold)"
        side_effects:
          - "nexus_status set to THRESHOLD_MET (recompute, calculations.nexus_status)"
      - from: THRESHOLD_MET
        to: NO_NEXUS
        trigger: "system: transaction void de-accrual drops back below both thresholds"
        actor: system
        preconditions:
          - "cumulative_taxable_sales < jurisdiction.economic_nexus_sales_threshold AND (jurisdiction.economic_nexus_txn_threshold == 0 OR cumulative_txn_count < jurisdiction.economic_nexus_txn_threshold)"
        side_effects:
          - "nexus_status set back to NO_NEXUS"
        note: "Only possible while still THRESHOLD_MET; once REGISTERED the posture is sticky and a void cannot step it down."
      - from: THRESHOLD_MET
        to: REGISTERED
        trigger: "POST /nexus-profiles/{id}/register"
        actor: Seller
        preconditions:
          - "NexusProfile.nexus_status == THRESHOLD_MET (else ERR_INVALID_STATE)"
        side_effects:
          - "Set registered_at to current clock; nexus_status set to REGISTERED"
          - "Append an AuditLogEntry(action=REGISTER_NEXUS)"
          - "increments NexusProfile.version by 1"
        note: "Cross-entity precondition: registration requires THRESHOLD_MET, itself a function of Transaction settlement state."

  # ---- TaxReturn: branching fork-join with revert ----
  - entity: TaxReturn
    initial_state: DRAFT
    terminal_states: [REMITTED]
    transitions:
      - from: DRAFT
        to: ACCEPTED
        trigger: "POST /tax-returns/{id}/accept"
        actor: TaxApprover
        preconditions:
          - "TaxReturn.status == DRAFT"
          - "X-User-ID != TaxReturn.prepared_by (else ERR_SEGREGATION_OF_DUTIES)"
          - "NexusProfile(seller_id, jurisdiction_id).nexus_status == REGISTERED (else ERR_NEXUS_NOT_REGISTERED)"
        side_effects:
          - "Sweep all SETTLED, non-VOIDED, SELLER-responsibility transactions for (seller_id, jurisdiction_id) whose created_at is in [period_start, period_end): set their tax_return_id"
          - "Sweep ACCRUED UseTaxAccrual rows for (seller_id, jurisdiction_id) created in the same window: set tax_return_id and status=INCLUDED_IN_RETURN"
          - "Compute tax_due (calculations.return_tax_due)"
          - "Set approved_by to X-User-ID; status to ACCEPTED"
          - "Append an AuditLogEntry(action=ACCEPT_RETURN)"
          - "increments TaxReturn.version by 1"
      - from: DRAFT
        to: REJECTED
        trigger: "POST /tax-returns/{id}/reject"
        actor: TaxApprover
        preconditions:
          - "TaxReturn.status == DRAFT"
          - "X-User-ID != TaxReturn.prepared_by (else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "Append an AuditLogEntry(action=REJECT_RETURN)"
          - "increments TaxReturn.version by 1"
      - from: REJECTED
        to: DRAFT
        trigger: "POST /tax-returns/{id}/reopen"
        actor: TaxPreparer
        preconditions:
          - "TaxReturn.status == REJECTED"
        side_effects:
          - "Append an AuditLogEntry(action=REOPEN_RETURN)"
          - "increments TaxReturn.version by 1"
        note: "Revert edge rejoins the DRAFT branch point, making this a fork-join with a revision loop."
      - from: ACCEPTED
        to: FILED
        trigger: "POST /tax-returns/{id}/file"
        actor: TaxApprover
        preconditions:
          - "TaxReturn.status == ACCEPTED"
        side_effects:
          - "Append an AuditLogEntry(action=FILE_RETURN)"
          - "increments TaxReturn.version by 1"
        note: "Filing keeps the swept transactions locked (they were already locked at acceptance via tax_return_id)."
      - from: FILED
        to: REMITTED
        trigger: "POST /remittance-payments"
        actor: TaxApprover
        preconditions:
          - "TaxReturn.status == FILED"
          - "expected_tax_return_version matches TaxReturn.version (OCC; else ERR_STALE_VERSION)"
          - "payment amount == TaxReturn.tax_due (else ERR_AMOUNT_MISMATCH)"
        side_effects:
          - "Create a RemittancePayment(status=APPLIED) child"
          - "Set TaxReturn.status to REMITTED"
          - "Append an AuditLogEntry(action=REMIT_RETURN)"
          - "increments TaxReturn.version by 1"

# ---------------------------------------------------------------------------
# §1.2.1 Concurrency Rules
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: remit-stale-return
    parent_entity: TaxReturn
    write_endpoint: "POST /remittance-payments"
    occ_field: "expected_tax_return_version"
    description: |
      Creating a RemittancePayment against a TaxReturn whose version has advanced
      since the client last observed it is rejected. A RemittancePayment legitimately
      supersedes the return's FILED state by moving it to REMITTED; a second create
      carrying a stale expected_tax_return_version reflects a view of the return taken
      before the prior payment advanced its version, and is rejected on the stale-version check.
    error_id: ERR_STALE_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# §1.3 Calculation Rules Table
# ---------------------------------------------------------------------------
calculations:

  - name: line_item_tax
    trigger: "Transaction PENDING -> SETTLED (POST /transactions/{id}/settle)"
    algorithm: tiered_pricing
    formula: |
      # Per-line resolution + round-then-sum. PINNED order: round each line's tax, THEN sum.
      for each line in transaction.line_items (insertion order):
        cat = ProductCategory(jurisdiction = sourced_state, category_code = line.category_code)
        cert_exempt = transaction.customer_exempt_requested
                      AND exists ExemptionCertificate e with
                          e.status == ACTIVE
                          AND e.seller_id == transaction.seller_id
                          AND e.jurisdiction_id == sourced_state.id
                          AND e.customer_ref == transaction.customer_ref
                          AND e.exempt_category_code == line.category_code
                          AND e.valid_from <= clock < e.valid_to
        if cert_exempt OR cat.taxability == EXEMPT:
          line.line_taxability = EXEMPT
          line.line_tax = 0.00          # excluded from taxable_subtotal
        elif cat.taxability == REDUCED:
          line.line_taxability = REDUCED
          line.line_tax = round_half_up(line.quantity * line.unit_price * sourced_state.reduced_rate, 2)
        else:
          line.line_taxability = FULL
          line.line_tax = round_half_up(line.quantity * line.unit_price * applied_rate, 2)
      taxable_subtotal = round_half_up(sum(line.quantity*line.unit_price for non-EXEMPT lines), 2)
      tax_collected   = sum(line.line_tax for all lines)   # round-then-sum, NOT sum-then-round
    input_set: "All TransactionLineItem rows of the transaction; EXEMPT lines contribute 0 to both taxable_subtotal and tax_collected."
    constants: {}
    precision: "2 decimal places, round_half_up; rounding applied PER LINE before summing (round-then-sum), NOT sum-then-round."
    variants:
      - name: full_rate_line
        when: "line_taxability == FULL"
        difference: "Uses applied_rate (the sourced state's combined_rate)."
      - name: reduced_rate_line
        when: "line_taxability == REDUCED"
        difference: "Uses sourced state's reduced_rate instead of combined_rate."

  - name: sourcing_resolution
    trigger: "Transaction PENDING -> SETTLED (POST /transactions/{id}/settle)"
    algorithm: threshold
    formula: |
      dest = TaxJurisdiction(transaction.jurisdiction_id)
      if dest.sourcing_rule == ORIGIN:
        sourcing_used = ORIGIN
        origin = TaxJurisdiction where state_code == Seller(transaction.seller_id).origin_state_code
        applied_rate = origin.combined_rate
        sourced_state = origin                # nexus accrues to the origin state
      else:
        sourcing_used = DESTINATION
        applied_rate = dest.combined_rate
        sourced_state = dest                  # nexus accrues to the destination state
    input_set: "The destination jurisdiction's sourcing_rule and the two candidate jurisdictions (origin vs destination)."
    constants: {}
    precision: "applied_rate is a stored decimal fraction; tax rounding handled by line_item_tax."
    variants:
      - name: destination_sourced
        when: "dest.sourcing_rule == DESTINATION"
        difference: "applied_rate = destination.combined_rate; nexus accrues to the destination state's NexusProfile."
      - name: origin_sourced
        when: "dest.sourcing_rule == ORIGIN"
        difference: "applied_rate = origin.combined_rate; nexus accrues to the seller's origin state — identical line items yield a different tax_collected and touch a different NexusProfile."

  - name: nexus_status
    trigger: "Transaction settle accrual (NO_NEXUS->THRESHOLD_MET) and void de-accrual (THRESHOLD_MET->NO_NEXUS)"
    algorithm: threshold
    formula: |
      j = TaxJurisdiction of the NexusProfile
      sales_met = profile.cumulative_taxable_sales >= j.economic_nexus_sales_threshold      # inclusive >=
      count_met = j.economic_nexus_txn_threshold > 0 AND profile.cumulative_txn_count >= j.economic_nexus_txn_threshold
      threshold_crossed = sales_met OR count_met
      if profile.nexus_status == REGISTERED:
        nexus_status = REGISTERED            # sticky once registered
      elif threshold_crossed:
        nexus_status = THRESHOLD_MET
      else:
        nexus_status = NO_NEXUS
    input_set: "Single NexusProfile row plus its TaxJurisdiction thresholds."
    constants: {}
    precision: "Comparisons exact; cumulative_taxable_sales held at 2 dp."
    variants:
      - name: sales_threshold_path
        when: "cumulative_taxable_sales >= economic_nexus_sales_threshold"
        difference: "Crossed via the gross-sales dollar test (inclusive >=)."
      - name: count_threshold_path
        when: "economic_nexus_txn_threshold > 0 AND cumulative_txn_count >= economic_nexus_txn_threshold"
        difference: "Crossed via the transaction-count test, independent of sales dollars."

  - name: remittance_responsibility
    trigger: "Transaction PENDING -> SETTLED (POST /transactions/{id}/settle)"
    algorithm: threshold
    formula: |
      if transaction.facilitator_id != null
         AND destination.state_code IN MarketplaceFacilitator(facilitator_id).collecting_state_codes:
        remittance_responsibility = MARKETPLACE   # facilitator collects+remits; seller nexus NOT accrued
      else:
        remittance_responsibility = SELLER         # seller accrues nexus and owes remittance
    input_set: "Transaction.facilitator_id, the facilitator's collecting_state_codes, and the destination state_code."
    constants: {}
    precision: "n/a"
    variants:
      - name: marketplace_facilitated
        when: "facilitator set AND collects in the destination state"
        difference: "remittance_responsibility=MARKETPLACE; NexusProfile NOT accrued and the sale is excluded from return tax_due, though tax_collected is still computed and recorded."
      - name: seller_collected
        when: "no facilitator, or facilitator does not collect in the destination state"
        difference: "remittance_responsibility=SELLER; nexus accrues and the sale enters return tax_due."

  - name: use_tax_accrual
    trigger: "POST /use-tax-accruals (create)"
    algorithm: aggregation
    formula: |
      j = TaxJurisdiction(jurisdiction_id)
      accrued_use_tax = round_half_up(purchase_amount * j.combined_rate, 2)
    input_set: "Single UseTaxAccrual row and its destination jurisdiction's combined_rate."
    constants: {}
    precision: "2 decimal places, round_half_up."
    variants: []

  - name: return_tax_due
    trigger: "TaxReturn DRAFT -> ACCEPTED (POST /tax-returns/{id}/accept)"
    algorithm: aggregation
    formula: |
      swept_txns = Transaction rows where
        seller_id == return.seller_id
        AND the state nexus was accrued to == return.jurisdiction_id
        AND settlement_status == SETTLED
        AND remittance_responsibility == SELLER
        AND created_at in [return.period_start, return.period_end)   # inclusive start, exclusive end
      sales_tax = sum(t.tax_collected for t in swept_txns)             # values already round-then-sum at line level
      swept_use = UseTaxAccrual rows where
        seller_id == return.seller_id AND jurisdiction_id == return.jurisdiction_id
        AND status == ACCRUED AND created_at in [period_start, period_end)
      use_tax = sum(u.accrued_use_tax for u in swept_use)
      tax_due = round_half_up(sales_tax + use_tax, 2)
    input_set: "SETTLED non-VOIDED SELLER transactions and ACCRUED use-tax accruals in [period_start, period_end); VOIDED and MARKETPLACE transactions excluded."
    constants: {}
    precision: "2 decimal places, round_half_up on the final sum (component values already at 2 dp)."
    variants:
      - name: sales_only
        when: "no use-tax accruals in the period"
        difference: "tax_due = sum of swept transactions' tax_collected only."
      - name: sales_plus_use
        when: "ACCRUED use-tax accruals exist in the period"
        difference: "tax_due adds the period's accrued_use_tax sum on top of sales tax."

# ---------------------------------------------------------------------------
# §1.4 Validation Rules Table (ordered by priority)
# ---------------------------------------------------------------------------
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Acting role is permitted to perform this operation per §1.7 RBAC."
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Path-referenced resource ({id}) exists."
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all path-parameterized endpoints"

  - priority: 4
    category: existence
    check: "Body-referenced foreign keys (jurisdiction_id, facilitator_id, transaction_id, tax_return_id, seller_id) resolve to existing rows."
    error_id: ERR_REFERENCE_NOT_FOUND
    http_status: 404
    applies_to: "all create endpoints with FK body fields"

  - priority: 5
    category: business_constraint
    check: "Required body fields present and well-typed; enums in declared set; quantity >= 1; unit_price > 0; purchase_amount > 0; rates within bounds; state_code matches /^[A-Z]{2}$/."
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all create/mutate endpoints"

  - priority: 6
    category: business_constraint
    check: "Uniqueness: TaxJurisdiction.state_code unique; ProductCategory unique per (jurisdiction_id, category_code); NexusProfile unique per (seller_id, jurisdiction_id)."
    error_id: ERR_DUPLICATE_RESOURCE
    http_status: 409
    applies_to: "POST /tax-jurisdictions, POST /product-categories, POST /nexus-profiles"

  - priority: 7
    category: business_temporal
    check: "Interval well-formedness: ExemptionCertificate.valid_to strictly after valid_from; TaxReturn.period_end strictly after period_start."
    error_id: ERR_INVALID_INTERVAL
    http_status: 422
    applies_to: "POST /exemption-certificates, POST /tax-returns"

  - priority: 8
    category: business_temporal
    check: "Exemption-certificate overlap (HALF-OPEN interval, adjacency ALLOWED): a new ExemptionCertificate whose [valid_from, valid_to) window intersects the [valid_from, valid_to) window of an existing ACTIVE certificate for the same (seller_id, jurisdiction_id, customer_ref, exempt_category_code) is rejected. Touching endpoints do NOT collide (existing.valid_to == new.valid_from is allowed)."
    error_id: ERR_CERTIFICATE_OVERLAP
    http_status: 409
    applies_to: "POST /exemption-certificates"

  - priority: 9
    category: business_temporal
    check: "Tax-return period overlap (CLOSED interval, adjacency FORBIDDEN): a new TaxReturn whose [period_start, period_end] window intersects OR touches the [period_start, period_end] window of an existing non-REJECTED TaxReturn (status IN {DRAFT, ACCEPTED, FILED, REMITTED}) for the same (seller_id, jurisdiction_id) is rejected. Shared endpoints DO collide (existing.period_end == new.period_start is rejected)."
    error_id: ERR_RETURN_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /tax-returns"

  - priority: 10
    category: state
    check: "Target resource is in the correct state for the requested transition (settlement_status / audit_status / certificate status / return status / nexus_status), including the no-line-items-at-settle check."
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action/transition endpoints"

  - priority: 11
    category: business_safety
    check: "Segregation of duties: a TaxApprover accepting/rejecting a return MUST have X-User-ID != TaxReturn.prepared_by."
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /tax-returns/{id}/accept, POST /tax-returns/{id}/reject"

  - priority: 12
    category: business_referential
    check: "Nexus precondition: accepting a TaxReturn requires the seller's NexusProfile for that state to be REGISTERED."
    error_id: ERR_NEXUS_NOT_REGISTERED
    http_status: 409
    applies_to: "POST /tax-returns/{id}/accept"

  - priority: 13
    category: business_temporal
    check: "Filing lock: a SETTLED transaction whose tax_return_id is set (swept into a return) cannot be voided."
    error_id: ERR_TRANSACTION_LOCKED
    http_status: 409
    applies_to: "POST /transactions/{id}/void"

  - priority: 14
    category: state
    check: "Seller-status gate: settling a transaction for a SUSPENDED seller is rejected."
    error_id: ERR_SELLER_SUSPENDED
    http_status: 409
    applies_to: "POST /transactions/{id}/settle"

  - priority: 15
    category: business_fiscal
    check: "Remittance amount must equal the return's tax_due exactly."
    error_id: ERR_AMOUNT_MISMATCH
    http_status: 422
    applies_to: "POST /remittance-payments"

  - priority: 16
    category: state
    check: "OCC: expected_tax_return_version must equal the return's current version on remittance create."
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /remittance-payments"

# ---------------------------------------------------------------------------
# §1.5 API Endpoint Table  (flat topology; api_prefix is empty)
# ---------------------------------------------------------------------------
endpoints:

  # ---- TaxJurisdiction (config) ----
  - method: POST
    path: "/tax-jurisdictions"
    description: "Create a state tax jurisdiction with sourcing rule, rates, and nexus thresholds."
    roles: [PlatformAdmin]
    code: 201
    input: [state_code, sourcing_rule, state_rate, "local_rate?", "reduced_rate?", economic_nexus_sales_threshold, "economic_nexus_txn_threshold?"]
    output: TaxJurisdiction
    side_effects: ["Compute combined_rate = state_rate + local_rate"]
  - method: GET
    path: "/tax-jurisdictions/{id}"
    description: "Fetch a jurisdiction."
    roles: [PlatformAdmin, Seller, TaxPreparer, TaxApprover, Auditor]
    code: 200
    input: []
    output: TaxJurisdiction
    side_effects: []
  - method: GET
    path: "/tax-jurisdictions"
    description: "List jurisdictions."
    roles: [PlatformAdmin, Seller, TaxPreparer, TaxApprover, Auditor]
    code: 200
    input: ["state_code?", "limit?", "offset?"]
    output: TaxJurisdiction[]
    side_effects: []

  # ---- ProductCategory (config) ----
  - method: POST
    path: "/product-categories"
    description: "Declare a product category's taxability in a jurisdiction."
    roles: [PlatformAdmin]
    code: 201
    input: [jurisdiction_id, category_code, taxability]
    output: ProductCategory
    side_effects: []
  - method: GET
    path: "/product-categories/{id}"
    description: "Fetch a product-category taxability row."
    roles: [PlatformAdmin, Seller, TaxPreparer, TaxApprover, Auditor]
    code: 200
    input: []
    output: ProductCategory
    side_effects: []
  - method: GET
    path: "/product-categories"
    description: "List product-category rows; filter by jurisdiction (reverse-reachability for ProductCategory.jurisdiction_id)."
    roles: [PlatformAdmin, Seller, TaxPreparer, TaxApprover, Auditor]
    code: 200
    input: ["jurisdiction_id?", "category_code?", "limit?", "offset?"]
    output: ProductCategory[]
    side_effects: []

  # ---- Seller ----
  - method: POST
    path: "/sellers"
    description: "Register a seller (taxpayer)."
    roles: [PlatformAdmin]
    code: 201
    input: [legal_name, origin_state_code]
    output: Seller
    side_effects: []
  - method: GET
    path: "/sellers/{id}"
    description: "Fetch a seller."
    roles: [PlatformAdmin, Seller, TaxPreparer, TaxApprover, Auditor]
    code: 200
    input: []
    output: Seller
    side_effects: []
  - method: GET
    path: "/sellers"
    description: "List sellers."
    roles: [PlatformAdmin, TaxPreparer, TaxApprover, Auditor]
    code: 200
    input: ["limit?", "offset?"]
    output: Seller[]
    side_effects: []
  - method: POST
    path: "/sellers/{id}/suspend"
    description: "Suspend a seller account (blocks settlement)."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Seller
    side_effects: ["status=SUSPENDED"]

  # ---- MarketplaceFacilitator (config) ----
  - method: POST
    path: "/marketplace-facilitators"
    description: "Register a marketplace facilitator and the states in which it collects/remits."
    roles: [PlatformAdmin]
    code: 201
    input: [name, collecting_state_codes]
    output: MarketplaceFacilitator
    side_effects: []
  - method: GET
    path: "/marketplace-facilitators/{id}"
    description: "Fetch a facilitator."
    roles: [PlatformAdmin, Seller, TaxPreparer, TaxApprover, Auditor]
    code: 200
    input: []
    output: MarketplaceFacilitator
    side_effects: []
  - method: GET
    path: "/marketplace-facilitators"
    description: "List facilitators."
    roles: [PlatformAdmin, Seller, TaxPreparer, TaxApprover, Auditor]
    code: 200
    input: ["limit?", "offset?"]
    output: MarketplaceFacilitator[]
    side_effects: []

  # ---- NexusProfile ----
  - method: POST
    path: "/nexus-profiles"
    description: "Open a state-level nexus accumulator for a seller."
    roles: [Seller, PlatformAdmin]
    code: 201
    input: [seller_id, jurisdiction_id]
    output: NexusProfile
    side_effects: ["Initialize cumulative_taxable_sales=0, cumulative_txn_count=0, nexus_status=NO_NEXUS"]
  - method: GET
    path: "/nexus-profiles/{id}"
    description: "Fetch a nexus profile (includes derived nexus_status)."
    roles: [Seller, PlatformAdmin, TaxPreparer, TaxApprover, Auditor]
    code: 200
    input: []
    output: NexusProfile
    side_effects: []
  - method: GET
    path: "/nexus-profiles"
    description: "List nexus profiles; filter by seller (reverse-reachability for NexusProfile.seller_id) and/or jurisdiction (reverse-reachability for NexusProfile.jurisdiction_id)."
    roles: [Seller, PlatformAdmin, TaxPreparer, TaxApprover, Auditor]
    code: 200
    input: ["seller_id?", "jurisdiction_id?", "limit?", "offset?"]
    output: NexusProfile[]
    side_effects: []
  - method: POST
    path: "/nexus-profiles/{id}/register"
    description: "Register the seller for collection in this state (THRESHOLD_MET -> REGISTERED)."
    roles: [Seller]
    code: 200
    input: []
    output: NexusProfile
    side_effects: ["Set registered_at, nexus_status=REGISTERED", "Append AuditLogEntry(REGISTER_NEXUS)", "increments NexusProfile.version by 1"]

  # ---- ExemptionCertificate ----
  - method: POST
    path: "/exemption-certificates"
    description: "File a customer exemption certificate for a seller."
    roles: [Seller]
    code: 201
    input: [seller_id, jurisdiction_id, customer_ref, exempt_category_code, valid_from, valid_to]
    output: ExemptionCertificate
    side_effects: []
  - method: GET
    path: "/exemption-certificates/{id}"
    description: "Fetch an exemption certificate."
    roles: [Seller, PlatformAdmin, TaxPreparer, TaxApprover, Auditor]
    code: 200
    input: []
    output: ExemptionCertificate
    side_effects: []
  - method: GET
    path: "/exemption-certificates"
    description: "List exemption certificates; filter by seller (reverse-reachability for ExemptionCertificate.seller_id) and/or jurisdiction (reverse-reachability for ExemptionCertificate.jurisdiction_id)."
    roles: [Seller, PlatformAdmin, TaxPreparer, TaxApprover, Auditor]
    code: 200
    input: ["seller_id?", "jurisdiction_id?", "customer_ref?", "limit?", "offset?"]
    output: ExemptionCertificate[]
    side_effects: []
  - method: POST
    path: "/exemption-certificates/{id}/revoke"
    description: "Revoke an active exemption certificate."
    roles: [Seller]
    code: 200
    input: []
    output: ExemptionCertificate
    side_effects: ["status=REVOKED", "Append AuditLogEntry(REVOKE_CERTIFICATE)", "increments ExemptionCertificate.version by 1"]
  - method: POST
    path: "/exemption-certificates/{id}/reinstate"
    description: "Reinstate a revoked certificate still within its validity window."
    roles: [Seller]
    code: 200
    input: []
    output: ExemptionCertificate
    side_effects: ["status=ACTIVE", "Append AuditLogEntry(REINSTATE_CERTIFICATE)", "increments ExemptionCertificate.version by 1"]

  # ---- Transaction + line items ----
  - method: POST
    path: "/transactions"
    description: "Create a PENDING transaction (no tax computed yet)."
    roles: [Seller]
    code: 201
    input: [seller_id, jurisdiction_id, "facilitator_id?", customer_ref, "customer_exempt_requested?"]
    output: Transaction
    side_effects: ["settlement_status=PENDING, audit_status=UNREVIEWED"]
  - method: GET
    path: "/transactions/{id}"
    description: "Fetch a transaction (computed tax fields populated once SETTLED)."
    roles: [Seller, PlatformAdmin, TaxPreparer, TaxApprover, Auditor]
    code: 200
    input: []
    output: Transaction
    side_effects: []
  - method: GET
    path: "/transactions"
    description: "List transactions; filter by seller (reverse-reachability for Transaction.seller_id), jurisdiction (Transaction.jurisdiction_id), facilitator (Transaction.facilitator_id), tax_return_id (Transaction.tax_return_id), or settlement_status."
    roles: [Seller, PlatformAdmin, TaxPreparer, TaxApprover, Auditor]
    code: 200
    input: ["seller_id?", "jurisdiction_id?", "facilitator_id?", "tax_return_id?", "settlement_status?", "limit?", "offset?"]
    output: Transaction[]
    side_effects: []
  - method: POST
    path: "/line-items"
    description: "Add a line item to a PENDING transaction."
    roles: [Seller]
    code: 201
    input: [transaction_id, category_code, quantity, unit_price]
    output: TransactionLineItem
    side_effects: []
  - method: GET
    path: "/line-items/{id}"
    description: "Fetch a single line item."
    roles: [Seller, PlatformAdmin, TaxPreparer, TaxApprover, Auditor]
    code: 200
    input: []
    output: TransactionLineItem
    side_effects: []
  - method: GET
    path: "/line-items"
    description: "List line items; filter by transaction (reverse-reachability for TransactionLineItem.transaction_id)."
    roles: [Seller, PlatformAdmin, TaxPreparer, TaxApprover, Auditor]
    code: 200
    input: ["transaction_id?", "limit?", "offset?"]
    output: TransactionLineItem[]
    side_effects: []
  - method: POST
    path: "/transactions/{id}/settle"
    description: "Settle a transaction: resolve taxability, compute tax, set responsibility, accrue nexus."
    roles: [Seller]
    code: 200
    input: []
    output: Transaction
    side_effects:
      - "Compute line_item_tax, sourcing_resolution, remittance_responsibility"
      - "If SELLER-responsible: accrue NexusProfile and recompute nexus_status (may cascade NO_NEXUS->THRESHOLD_MET)"
      - "Append AuditLogEntry(SETTLE)"
      - "increments Transaction.version by 1"
  - method: POST
    path: "/transactions/{id}/void"
    description: "Void a SETTLED transaction not yet swept into a return; reverses nexus accrual."
    roles: [Seller]
    code: 200
    input: []
    output: Transaction
    side_effects:
      - "If SELLER-responsible: de-accrue NexusProfile and recompute nexus_status (may step THRESHOLD_MET->NO_NEXUS unless REGISTERED)"
      - "Append AuditLogEntry(VOID)"
      - "increments Transaction.version by 1"
  - method: POST
    path: "/transactions/{id}/flag"
    description: "Auditor flags a transaction (audit dimension)."
    roles: [Auditor]
    code: 200
    input: []
    output: Transaction
    side_effects: ["audit_status=FLAGGED", "Append AuditLogEntry(FLAG)", "increments Transaction.version by 1"]
  - method: POST
    path: "/transactions/{id}/clear"
    description: "Auditor clears a flagged transaction (audit dimension)."
    roles: [Auditor]
    code: 200
    input: []
    output: Transaction
    side_effects: ["audit_status=CLEARED", "Append AuditLogEntry(CLEAR)", "increments Transaction.version by 1"]

  # ---- UseTaxAccrual ----
  - method: POST
    path: "/use-tax-accruals"
    description: "Self-assess use tax on an untaxed purchase in a state."
    roles: [Seller, TaxPreparer]
    code: 201
    input: [seller_id, jurisdiction_id, purchase_amount]
    output: UseTaxAccrual
    side_effects: ["Compute accrued_use_tax = purchase_amount * combined_rate", "status=ACCRUED"]
  - method: GET
    path: "/use-tax-accruals/{id}"
    description: "Fetch a use-tax accrual."
    roles: [Seller, PlatformAdmin, TaxPreparer, TaxApprover, Auditor]
    code: 200
    input: []
    output: UseTaxAccrual
    side_effects: []
  - method: GET
    path: "/use-tax-accruals"
    description: "List use-tax accruals; filter by seller (reverse-reachability for UseTaxAccrual.seller_id), jurisdiction (UseTaxAccrual.jurisdiction_id), or tax_return_id (UseTaxAccrual.tax_return_id)."
    roles: [Seller, PlatformAdmin, TaxPreparer, TaxApprover, Auditor]
    code: 200
    input: ["seller_id?", "jurisdiction_id?", "tax_return_id?", "limit?", "offset?"]
    output: UseTaxAccrual[]
    side_effects: []

  # ---- TaxReturn + remittance ----
  - method: POST
    path: "/tax-returns"
    description: "Create a DRAFT tax return for a (state, period); records prepared_by = X-User-ID."
    roles: [TaxPreparer]
    code: 201
    input: [seller_id, jurisdiction_id, period_start, period_end]
    output: TaxReturn
    side_effects: ["status=DRAFT, prepared_by set"]
  - method: GET
    path: "/tax-returns/{id}"
    description: "Fetch a tax return (tax_due populated once ACCEPTED)."
    roles: [Seller, PlatformAdmin, TaxPreparer, TaxApprover, Auditor]
    code: 200
    input: []
    output: TaxReturn
    side_effects: []
  - method: GET
    path: "/tax-returns"
    description: "List tax returns; filter by seller (reverse-reachability for TaxReturn.seller_id), jurisdiction (TaxReturn.jurisdiction_id), or status."
    roles: [Seller, PlatformAdmin, TaxPreparer, TaxApprover, Auditor]
    code: 200
    input: ["seller_id?", "jurisdiction_id?", "status?", "limit?", "offset?"]
    output: TaxReturn[]
    side_effects: []
  - method: POST
    path: "/tax-returns/{id}/accept"
    description: "TaxApprover accepts a DRAFT return: sweeps transactions/use-tax, computes tax_due."
    roles: [TaxApprover]
    code: 200
    input: []
    output: TaxReturn
    side_effects:
      - "Sweep SETTLED SELLER transactions and ACCRUED use-tax in period; set their tax_return_id"
      - "Compute tax_due (return_tax_due); set approved_by, status=ACCEPTED"
      - "Append AuditLogEntry(ACCEPT_RETURN)"
      - "increments TaxReturn.version by 1"
  - method: POST
    path: "/tax-returns/{id}/reject"
    description: "TaxApprover rejects a DRAFT return."
    roles: [TaxApprover]
    code: 200
    input: []
    output: TaxReturn
    side_effects: ["status=REJECTED", "Append AuditLogEntry(REJECT_RETURN)", "increments TaxReturn.version by 1"]
  - method: POST
    path: "/tax-returns/{id}/reopen"
    description: "TaxPreparer reopens a REJECTED return back to DRAFT."
    roles: [TaxPreparer]
    code: 200
    input: []
    output: TaxReturn
    side_effects: ["status=DRAFT", "Append AuditLogEntry(REOPEN_RETURN)", "increments TaxReturn.version by 1"]
  - method: POST
    path: "/tax-returns/{id}/file"
    description: "TaxApprover files an ACCEPTED return."
    roles: [TaxApprover]
    code: 200
    input: []
    output: TaxReturn
    side_effects: ["status=FILED", "Append AuditLogEntry(FILE_RETURN)", "increments TaxReturn.version by 1"]
  - method: POST
    path: "/remittance-payments"
    description: "Remit a FILED return by full payment of tax_due (OCC-guarded); moves return to REMITTED."
    roles: [TaxApprover]
    code: 201
    input: [tax_return_id, amount, expected_tax_return_version]
    output: RemittancePayment
    side_effects: ["Create RemittancePayment(APPLIED)", "Set TaxReturn.status=REMITTED", "Append AuditLogEntry(REMIT_RETURN)", "increments TaxReturn.version by 1"]
  - method: GET
    path: "/remittance-payments/{id}"
    description: "Fetch a remittance payment."
    roles: [Seller, PlatformAdmin, TaxPreparer, TaxApprover, Auditor]
    code: 200
    input: []
    output: RemittancePayment
    side_effects: []
  - method: GET
    path: "/remittance-payments"
    description: "List remittance payments; filter by tax_return_id (reverse-reachability for RemittancePayment.tax_return_id)."
    roles: [Seller, PlatformAdmin, TaxPreparer, TaxApprover, Auditor]
    code: 200
    input: ["tax_return_id?", "limit?", "offset?"]
    output: RemittancePayment[]
    side_effects: []

  # ---- AuditLogEntry (append-only event log) ----
  - method: GET
    path: "/audit-log-entries/{id}"
    description: "Fetch a single audit-log entry."
    roles: [Auditor, PlatformAdmin]
    code: 200
    input: []
    output: AuditLogEntry
    side_effects: []
  - method: GET
    path: "/audit-log-entries"
    description: "List audit-trail entries; filter by seller (reverse-reachability for AuditLogEntry.seller_id) and/or subject."
    roles: [Auditor, PlatformAdmin]
    code: 200
    input: ["seller_id?", "subject_entity?", "subject_id?", "limit?", "offset?"]
    output: AuditLogEntry[]
    side_effects: []

  # ---- Test-driving clock ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's current UTC clock (test-driving) for certificate validity-window and period evaluation."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["Server clock advanced to the given timestamp"]

# ---------------------------------------------------------------------------
# §1.6 Error Code Catalog
# ---------------------------------------------------------------------------
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing/invalid X-User-Role or X-User-ID headers, or unknown role."
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "Authenticated role not permitted for this operation."
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Path-referenced resource ({id}) does not exist."
  - id: ERR_REFERENCE_NOT_FOUND
    http: 404
    condition: "Body foreign key (jurisdiction_id, facilitator_id, transaction_id, tax_return_id, seller_id) does not resolve."
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing/mistyped required field, enum out of set, quantity<1, unit_price<=0, purchase_amount<=0, rate out of bounds, or malformed state_code."
  - id: ERR_DUPLICATE_RESOURCE
    http: 409
    condition: "Uniqueness violation: duplicate state_code, duplicate (jurisdiction_id,category_code), or duplicate (seller_id,jurisdiction_id) nexus profile."
  - id: ERR_INVALID_INTERVAL
    http: 422
    condition: "valid_to not strictly after valid_from, or period_end not strictly after period_start."
  - id: ERR_CERTIFICATE_OVERLAP
    http: 409
    condition: "New ExemptionCertificate's half-open [valid_from, valid_to) window overlaps an existing ACTIVE certificate for the same (seller_id, jurisdiction_id, customer_ref, exempt_category_code); adjacency allowed."
  - id: ERR_RETURN_PERIOD_OVERLAP
    http: 409
    condition: "New TaxReturn's closed [period_start, period_end] window overlaps or touches an existing non-REJECTED return for the same (seller_id, jurisdiction_id); adjacency forbidden."
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Resource not in the required state for the requested transition (wrong settlement/audit/certificate/return/nexus state, or no line items at settle)."
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "TaxApprover accepting/rejecting a return is the same user (X-User-ID) who prepared it."
  - id: ERR_NEXUS_NOT_REGISTERED
    http: 409
    condition: "Accepting a return for a state where the seller's NexusProfile is not REGISTERED."
  - id: ERR_TRANSACTION_LOCKED
    http: 409
    condition: "Voiding a SETTLED transaction already swept into a return (tax_return_id set)."
  - id: ERR_AMOUNT_MISMATCH
    http: 422
    condition: "Remittance amount does not equal the return's tax_due exactly."
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_tax_return_version does not match the return's current version on remittance create."
  - id: ERR_SELLER_SUSPENDED
    http: 409
    condition: "Settling a transaction for a seller whose status is SUSPENDED."
  - id: ERR_VALIDATION_FAILED
    http: 422
    condition: "Reinstating an exemption certificate whose validity window has already ended (clock >= valid_to)."

# ---------------------------------------------------------------------------
# §1.7 RBAC Matrix
# ---------------------------------------------------------------------------
roles:
  - name: PlatformAdmin
    description: "System operator who configures jurisdictions, product taxability, facilitators, sellers, and the test clock."
    identity: "opaque"
    exclusive_operations:
      - "POST /tax-jurisdictions"
      - "POST /product-categories"
      - "POST /marketplace-facilitators"
      - "POST /sellers"
      - "POST /sellers/{id}/suspend"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "All GET reads"
      - "POST /nexus-profiles"

  - name: Seller
    description: "The taxpayer; records sales, files certificates, registers for nexus, accrues use tax. X-User-ID equals the acting Seller.id."
    identity: "entity_backed:Seller"
    exclusive_operations:
      - "POST /transactions"
      - "POST /line-items"
      - "POST /transactions/{id}/settle"
      - "POST /transactions/{id}/void"
      - "POST /exemption-certificates"
      - "POST /exemption-certificates/{id}/revoke"
      - "POST /exemption-certificates/{id}/reinstate"
      - "POST /nexus-profiles/{id}/register"
    shared_operations:
      - "POST /nexus-profiles"
      - "POST /use-tax-accruals"
      - "All GET reads scoped to own seller_id (X-User-ID == seller_id)"

  - name: TaxPreparer
    description: "Prepares (drafts) and reopens tax returns and accrues use tax; CANNOT approve/file (segregation of duties)."
    identity: "opaque"
    exclusive_operations:
      - "POST /tax-returns"
      - "POST /tax-returns/{id}/reopen"
    shared_operations:
      - "POST /use-tax-accruals"
      - "All GET reads"

  - name: TaxApprover
    description: "Accepts/rejects, files, and remits tax returns; CANNOT prepare (segregation of duties) and must differ from the return's preparer."
    identity: "opaque"
    exclusive_operations:
      - "POST /tax-returns/{id}/accept"
      - "POST /tax-returns/{id}/reject"
      - "POST /tax-returns/{id}/file"
      - "POST /remittance-payments"
    shared_operations:
      - "All GET reads"

  - name: Auditor
    description: "Read-only oversight plus the independent audit dimension (flag/clear) and audit-log access."
    identity: "opaque"
    exclusive_operations:
      - "POST /transactions/{id}/flag"
      - "POST /transactions/{id}/clear"
      - "GET /audit-log-entries"
      - "GET /audit-log-entries/{id}"
    shared_operations:
      - "All GET reads"
