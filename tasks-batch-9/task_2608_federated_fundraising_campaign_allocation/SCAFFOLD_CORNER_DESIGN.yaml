            - call: "POST /fundraising/campaigns"
              payload: { employer_id: "${emp_b}", campaign_year: 2026, solicitation_start_date: "2026-07-01", solicitation_end_date: "2026-09-30" }
              as: UnitedFundAdmin
              captures: { camp_b: $.data.id }
            - call: "POST /fundraising/campaigns/${camp_b}/open"
              payload: {}
              as: UnitedFundAdmin
          trigger:
            - call: "POST /fundraising/campaigns/${camp_a}/pledges"
              payload: { donor_reference: "P-001", giving_method: "PAYROLL_DEDUCTION", gross_amount: 240.00 }
              as: UnitedFundAdmin
              captures: { err: $.data.error_id }
            - call: "POST /fundraising/campaigns/${camp_a}/pledges"
              payload: { donor_reference: "P-001", giving_method: "ONE_TIME_CHECK", gross_amount: 240.00 }
              as: UnitedFundAdmin
              captures: { pl_a: $.data.id }
            - call: "POST /fundraising/campaigns/${camp_b}/pledges"
