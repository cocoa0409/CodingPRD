      - name: calc_freight_min_charge_floor
        claim_type: constants_applied
        grounds:
          - "calculations.freight_charge"
        distinguishing_aspect: "MIN_CHARGE_CENTS 4000 floors the total: TRUCK 1.00 kg gives subtotal 2640 + fuel 317 = 2957, raised to exactly 4000."
        test_recipe:
