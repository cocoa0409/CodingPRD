  # =========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: decide_preventable_cascade_depth4_terminal_risk_tier
        grounds:
          - state_machines.ReviewCase.DELIBERATION_to_DECIDED
          - state_machines.Crash.UNDER_REVIEW_to_PREVENTABLE
          - calculations.terminal_crash_rate
          - calculations.driver_preventable_points
          - entities.Terminal.fields.preventable_crash_count
          - entities.Terminal.fields.crash_rate_per_million_miles
          - entities.Terminal.fields.risk_tier
          - entities.Driver.fields.required_action_tier
        distinguishing_aspect: |
          Triggering transition: ReviewCase DELIBERATION -> DECIDED. Four serial
          links, each caused by the one before it and none of them a sibling of
          another: (1) ReviewCase.status becomes DECIDED with a determination,
          (2) because the case is DECIDED, Crash.preventability_status becomes
          PREVENTABLE, (3) because that crash is now PREVENTABLE,
          Terminal.preventable_crash_count rises 0 -> 1, (4) because the count
          rose, Terminal.crash_rate_per_million_miles becomes 4.000 and drags
          Terminal.risk_tier STANDARD -> CRITICAL. The Driver leg
          (preventable_points 0.0 -> 8.0) branches off link 2 and is asserted
          but deliberately NOT counted toward the depth.
        test_recipe:
          setup:
            - "One low-mileage Terminal with annual_miles_millions 0.25, so a single preventable crash produces a rate of 4.000 per million miles."
            - "Exactly one Driver at that terminal, hired 2013-05-06 (OVER_36_MONTHS), with preventable_points 0.0 and required_action_tier NONE."
            - "One SEVERE crash on 2026-07-30T14:00:00Z with mechanical_factor true, 2 days old at the clock position, so its decay factor is 1.0."
            - "All three SEVERE-required evidence kinds PRESERVED, so Crash.evidence_posture is COMPLETE."
            - "One ReviewCase in DELIBERATION with three non-superseded PREVENTABLE ballots all scoring 4.00, and Terminal.risk_tier still STANDARD with preventable_crash_count 0."
            - "Clock left at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /terminals"
              payload: { name: "Gallipolis Terminal", terminal_code: "GAL01", region_code: "OH", annual_miles_millions: 0.25 }
              as: SafetyAdmin
              as_user_id: "sa-001"
              captures: { t_id: $.data.id }
            - call: "POST /drivers"
              payload: { terminal_id: "${t_id}", employee_code: "D-7001", full_name: "Vince Okoro", cdl_number: "OH-CDL-7001", hire_date: "2013-05-06" }
              as: SafetyAdmin
