      - name: lowering_max_voting_seats_by_re_adoption_is_the_only_way_to_reach_the_appointment_cap
        claim_type: Conditional validation
        grounds:
          - state_machines.CommitteeSeat.VACANT_to_FILLED
          - state_machines.Plan.charter_status.ADOPTED_to_SUPERSEDED
          - errors.ERR_VOTING_SEATS_EXCEEDED
        distinguishing_aspect: "ERR_VOTING_SEATS_EXCEEDED is declared twice — once on seat create (§1.5) counting seats, once on appointment (§1.2) counting FILLED voting seats plus one. Because the create arm refuses the seat that would breach the cap, the appointment arm is dead on any plan whose charter was never amended. Re-adoption is the loophole: the ADOPTED -> SUPERSEDED -> ADOPTED path carries no seat-count precondition, so max_voting_seats can be lowered BELOW the number of seats already filled, leaving the plan in a state its own create-time rule forbids. Only then does the appointment guard become observable, and only for voting seats — the identical appointment on a non-voting seat succeeds."
        test_recipe:
          setup:
            - "A dedicated plan with max_voting_seats 3 and quorum_min_voting_members 2 holds three voting seats and one non-voting seat; the charter is adopted with max_voting_seats 3 and all three voting seats are filled."
            - "No meeting is ever convened on this plan, so the re-adoption precondition (no IN_SESSION meeting) is trivially satisfied and no OPEN motion exists to be TABLED."
          setup_api_calls:
            - *b_clock
            - call: "POST /governance/plans"
              payload: { plan_name: "Northbank Credit Union 401(k) Plan", plan_sponsor_name: "Northbank Credit Union", erisa_covered: true, participant_account_count: 250, menu_slot_capacity: 3, quorum_min_voting_members: 2, voting_threshold_pct: 0.6000, max_voting_seats: 3 }
              as: PlanSponsorAdmin
              as_user_id: "psa-ops"
              captures: { plane_id: $.data.id }
            - call: "POST /governance/committee-seats"
              payload: { plan_id: "${plane_id}", seat_code: "N-CHAIR", seat_class: "SPONSOR_FIDUCIARY", voting: true, seat_index: 1 }
              as: PlanSponsorAdmin
              as_user_id: "psa-ops"
              captures: { seate_1_id: $.data.id }
            - call: "POST /governance/committee-seats"
              payload: { plan_id: "${plane_id}", seat_code: "N-FIN", seat_class: "FINANCE", voting: true, seat_index: 2 }
              as: PlanSponsorAdmin
              as_user_id: "psa-ops"
              captures: { seate_2_id: $.data.id }
            - call: "POST /governance/committee-seats"
              payload: { plan_id: "${plane_id}", seat_code: "N-HR", seat_class: "HR", voting: true, seat_index: 3 }
              as: PlanSponsorAdmin
              as_user_id: "psa-ops"
              captures: { seate_3_id: $.data.id }
            - call: "POST /governance/committee-seats"
              payload: { plan_id: "${plane_id}", seat_code: "N-OBS", seat_class: "PARTICIPANT_REP", voting: false, seat_index: 4 }
              as: PlanSponsorAdmin
              as_user_id: "psa-ops"
              captures: { seate_obs_id: $.data.id }
            - call: "POST /governance/plans/${plane_id}/charter/adopt"
              payload: { quorum_min_voting_members: 2, voting_threshold_pct: 0.6000, max_voting_seats: 3, charter_doc_ref: "CHTR-NBCU-2026-A" }
              as: PlanSponsorAdmin
              as_user_id: "psa-ops"
            - call: "POST /governance/committee-members"
              payload: { seat_id: "${seate_1_id}", member_name: "Marcus Adeyemi", term_start_date: "2026-01-01", term_end_date: "2027-12-31", affiliated_provider_role: "NONE" }
              as: PlanSponsorAdmin
              as_user_id: "psa-ops"
              captures: { meme_1_id: $.data.id }
            - call: "POST /governance/committee-members"
              payload: { seat_id: "${seate_2_id}", member_name: "Iris Lindqvist", term_start_date: "2026-01-01", term_end_date: "2027-12-31", affiliated_provider_role: "NONE" }
              as: PlanSponsorAdmin
              as_user_id: "psa-ops"
              captures: { meme_2_id: $.data.id }
            - call: "POST /governance/committee-members"
              payload: { seat_id: "${seate_3_id}", member_name: "Tobias Ferreira", term_start_date: "2026-01-01", term_end_date: "2027-12-31", affiliated_provider_role: "NONE" }
              as: PlanSponsorAdmin
              as_user_id: "psa-ops"
              captures: { meme_3_id: $.data.id }
          trigger:
            - call: "POST /governance/committee-seats"
              payload: { plan_id: "${plane_id}", seat_code: "N-IND", seat_class: "INDEPENDENT", voting: true, seat_index: 5 }
              as: PlanSponsorAdmin
              as_user_id: "psa-ops"
            - call: "POST /governance/plans/${plane_id}/charter/adopt"
              payload: { quorum_min_voting_members: 2, voting_threshold_pct: 0.6000, max_voting_seats: 2, charter_doc_ref: "CHTR-NBCU-2026-B" }
              as: PlanSponsorAdmin
              as_user_id: "psa-ops"
            - call: "POST /governance/committee-members/${meme_3_id}/end-term"
              payload: { end_term_reason: "RESIGNED", effective_date: "2026-08-20" }
              as: PlanSponsorAdmin
              as_user_id: "psa-ops"
            - call: "POST /governance/committee-members"
              payload: { seat_id: "${seate_3_id}", member_name: "Helena Brandt", term_start_date: "2026-09-01", term_end_date: "2027-12-31", affiliated_provider_role: "NONE" }
              as: PlanSponsorAdmin
              as_user_id: "psa-ops"
            - call: "POST /governance/committee-members"
              payload: { seat_id: "${seate_obs_id}", member_name: "Helena Brandt", term_start_date: "2026-09-01", term_end_date: "2027-12-31", affiliated_provider_role: "NONE" }
              as: PlanSponsorAdmin
              as_user_id: "psa-ops"
              captures: { meme_obs_id: $.data.id }
          assert:
            - "setup: all three appointments returned 201 — the FILLED counts at those moments were 0 + 1, 1 + 1 and 2 + 1, all <= max_voting_seats 3"
            - "trigger call 1 returned 409 with data.error_id == ERR_VOTING_SEATS_EXCEEDED: the plan already holds 3 voting seats and a 4th would pass max_voting_seats 3, so the create arm of the rule fires and nothing is inserted"
            - "trigger call 2 returned 200 with charter_status == ADOPTED and max_voting_seats == 2 — the re-adoption path has no seat-count precondition, so a cap of 2 is accepted while three voting seats are FILLED; the response never shows the pass-through SUPERSEDED value"
            - "after call 2 the plan is in a state its own create rule forbids: 3 filled voting seats against max_voting_seats 2, with menu_posture back to FROZEN (recomputed with no ADOPTED IPS) and Plan.version incremented"
            - "trigger call 3 returned 200: CommitteeMember.${meme_3_id}.status == RESIGNED and CommitteeSeat.${seate_3_id}.status == VACANT, leaving 2 FILLED voting seats"
            - "trigger call 4 returned 409 with data.error_id == ERR_VOTING_SEATS_EXCEEDED: 2 FILLED + 1 == 3 > max_voting_seats 2 — this is the §1.2 appointment arm of the rule, reachable only because the cap was lowered under it"
            - "trigger call 5, the same appointment onto the NON-voting seat ${seate_obs_id}, returned 201: the guard is conditional on seat.voting == true, so a non-voting appointment ignores the cap entirely"
            - "CommitteeSeat.${seate_3_id} is still VACANT with consecutive_vacant_quarters 0 after the rejected appointment, and CommitteeMember.${meme_obs_id}.status == APPOINTED on a seat that will never count toward quorum"
            - "SPEC CONFLICT recorded, not asserted: §1.6 gives ERR_VOTING_SEATS_EXCEEDED the condition 'creating a voting seat would exceed Plan.max_voting_seats' while §1.2 raises it on appointment counting FILLED seats — the two arms disagree about which write and which population is being capped."

  # =====================================================================
  # 5. ENDPOINTS — one instance per endpoint pattern in the extraction
  #    guide (standard CRUD, action, conditional action, cross-reference
  #    link, computed read, listing with filters), each proving that every
  #    declared side effect of the endpoint actually lands.
  # =====================================================================
  - section: endpoints
    instances:

      - name: patch_fund_updates_only_the_supplied_monitoring_fields_and_reprices_the_plan
        claim_type: Standard CRUD
        grounds:
          - endpoints.PATCH_/governance/funds/{fundId}
          - endpoints.GET_/governance/funds/{fundId}
          - entities.Fund.plan_assets_cents
        distinguishing_aspect: "The only true update endpoint in the scaffold is deliberately partial: eleven optional fields, and the ones omitted must not be touched. It also carries a cross-entity side effect — changing plan_assets_cents reprices Plan.total_plan_assets_cents, which is the denominator of the provider-cost calculation — while being explicitly forbidden from moving menu_status or watch_status. The read-back through the single-fund GET proves the omitted fields survived untouched."
        test_recipe:
          setup:
            - "chain_l3: LCGRA is seated in the large-cap slot with plan_assets_cents 800000000, BNDIX with 400000000, and Plan.total_plan_assets_cents == 1200000000."
            - "LCGRA's stored monitoring data is gross 55 / net 45 bps, peer median 40, style drift 0.9200, tenure 20 quarters, manager_change_flag false."
          setup_api_calls: *chain_l3
          trigger:
            - call: "PATCH /governance/funds/${fund_lc_a_id}"
              payload: { net_expense_ratio_bps: 38, peer_median_expense_bps: 42, plan_assets_cents: 900000000 }
              as: Recordkeeper
              as_user_id: "rk-1"
            - call: "GET /governance/funds/${fund_lc_a_id}"
              payload: {}
              as: PlanAuditor
              as_user_id: "aud-1"
            - call: "GET /governance/plans/${plan_id}"
              payload: {}
              as: PlanAuditor
              as_user_id: "aud-1"
            - call: "PATCH /governance/funds/${fund_lc_a_id}"
              payload: { manager_change_flag: true, manager_tenure_quarters: 2 }
              as: InvestmentConsultant
              as_user_id: "ic-1"
          assert:
            - "trigger call 1 returned 200 with Fund.${fund_lc_a_id}.net_expense_ratio_bps == 38, peer_median_expense_bps == 42 and plan_assets_cents == 900000000"
            - "the omitted fields are untouched: gross_expense_ratio_bps == 55, style_drift_r2 == 0.9200, manager_tenure_quarters == 20, revenue_share_bps unchanged, track_record_quarters unchanged"
            - "menu_status is still ACTIVE and watch_status still CLEAR — the endpoint is declared never to move either, so a PATCH cannot smuggle a fund onto the watch list"
            - "glidepath_fit_score is still null: the recompute is conditional on is_target_date_suite == true and LCGRA is not a suite"
            - "trigger call 3 shows Plan.${plan_id}.total_plan_assets_cents == 1300000000 (900000000 + 400000000) — the recompute is driven by the changed plan_assets_cents, and Plan.version incremented"
            - "trigger call 4 returned 200 and set manager_change_flag true with manager_tenure_quarters 2, which makes LCGRA fail ips_eligibility criterion (4) from now on even though it is already seated — the criteria gate is only consulted on entry, never re-run on an occupant"
            - "Fund.${fund_lc_a_id}.version incremented once per PATCH, and latest_composite_score / last_scored_quarter_index are untouched by both PATCHes"
            - "trigger call 2 (the single-fund GET) returns the same row the PATCH response showed, so the mutation is durable and not just echoed."

      - name: share_class_change_refuses_every_direction_that_is_not_strictly_cheaper
        claim_type: Action endpoint
        grounds:
          - endpoints.POST_/governance/funds/{fundId}/share-class-change
          - errors.ERR_SHARE_CLASS_INELIGIBLE
          - entities.Fund.accrued_revenue_credit_cents
        distinguishing_aspect: "A three-armed guard on one action: the new net expense ratio must be STRICTLY lower, revenue sharing must not rise, and the fund must not be sitting inside an APPROVED or NOTICE_ISSUED replacement proposal. Equality on the expense arm is a failure, which makes it the sharpest boundary in the scaffold — 45 to 45 is rejected while 45 to 44 is accepted. The accepted move keeps the accrued credit ledger intact, proving the change is a repricing and not a re-registration."
        test_recipe:
          setup:
            - "chain_l3: BNDIX is seated in the CORE_BOND slot with share_class_code INSTITUTIONAL, gross 25 / net 25 bps and revenue_share_bps 0; LCGRA is seated in the large-cap slot with gross 55 / net 45 and revenue_share_bps 10."
            - "chain_l5 later has LCGRA inside an EXECUTED proposal, so the third arm is exercised on the NOTICE_ISSUED window of a separate proposal here."
          setup_api_calls: *chain_l3
          trigger:
            - call: "POST /governance/funds/${fund_lc_a_id}/share-class-change"
              payload: { share_class_code: "R6", net_expense_ratio_bps: 45, gross_expense_ratio_bps: 50, revenue_share_bps: 5 }
              as: InvestmentConsultant
              as_user_id: "ic-1"
            - call: "POST /governance/funds/${fund_lc_a_id}/share-class-change"
              payload: { share_class_code: "R6", net_expense_ratio_bps: 44, gross_expense_ratio_bps: 50, revenue_share_bps: 15 }
              as: InvestmentConsultant
              as_user_id: "ic-1"
            - call: "POST /governance/funds/${fund_lc_a_id}/share-class-change"
              payload: { share_class_code: "R6", net_expense_ratio_bps: 44, gross_expense_ratio_bps: 50, revenue_share_bps: 10 }
              as: Recordkeeper
              as_user_id: "rk-1"
            - call: "POST /governance/funds/${fund_lc_a_id}/share-class-change"
              payload: { share_class_code: "R6", net_expense_ratio_bps: 44, gross_expense_ratio_bps: 50, revenue_share_bps: 10 }
              as: Recordkeeper
              as_user_id: "rk-1"
          assert:
            - "trigger call 1 returned 409 with data.error_id == ERR_SHARE_CLASS_INELIGIBLE: 45 is not STRICTLY lower than the stored 45, so equality fails the first arm even though the revenue share drops"
            - "trigger call 2 returned 409 with data.error_id == ERR_SHARE_CLASS_INELIGIBLE: net 44 clears the expense arm, but revenue_share_bps rising 10 -> 15 trips the second arm"
            - "trigger call 3 returned 200: share_class_code == R6, net_expense_ratio_bps == 44, gross_expense_ratio_bps == 50 and revenue_share_bps == 10 (equal, not higher, so the second arm passes on its own boundary)"
            - "Fund.${fund_lc_a_id}.accrued_revenue_credit_cents and levelized_credit_cents are unchanged by call 3 — the ledger is explicitly retained across a share-class move"
            - "menu_status is still ACTIVE and the fund is still seated in ${slot_lc_id}: the slot's current_fund_id never changes, so this is a repricing of the same row"
            - "trigger call 4, repeating the now-current values, returned 409 ERR_SHARE_CLASS_INELIGIBLE — the action is not idempotent, because 44 is not strictly lower than 44"
            - "both rejected calls left every field of Fund.${fund_lc_a_id} at its pre-call value and did not increment version"

      - name: motions_are_a_typed_cross_reference_and_the_subject_kind_is_checked
        claim_type: Cross-reference link
        grounds:
          - endpoints.POST_/governance/motions
          - errors.ERR_MOTION_SUBJECT_MISMATCH
          - errors.ERR_MOTION_NOT_CARRIED
        distinguishing_aspect: "A motion links a meeting to an arbitrary subject through a (subject_type, subject_id) pair, and the consumers of that link — IPS adopt, proposal approve, target-date selection, rfp-award — each demand a specific subject_type. The recipe carries a WATCH_LIST_ACTION motion naming a fund and then offers it as the authorising motion for an IPS adoption, which must be refused on the type even though the motion is genuinely CARRIED, and offers an IPS_ADOPTION motion naming the wrong IPS row, which must be refused on the id."
        test_recipe:
          setup:
            - "chain_l3, plus a second DRAFT IPS (IPS-2026-C) so a valid-typed motion can name the wrong subject_id."
            - "One meeting carries two unanimous motions in sequence: a WATCH_LIST_ACTION on fund SMLVX and an IPS_ADOPTION on IPS-2026-C, then the minutes are approved."
          setup_api_calls:
            - *chain_l3
            - call: "POST /governance/investment-policy-statements"
              payload: { plan_id: "${plan_id}", version_label: "IPS-2026-C", scoring_variant: "TRAILING_PERIOD", watch_trigger_score_max: 40.00, remediation_trigger_score_max: 25.00, cure_margin_points: 10.00, expense_peer_multiple: 1.25, min_track_record_quarters: 12, style_drift_r2_floor: 0.8000, watch_grace_quarters: 2, weights: { performance: 0.40, peer: 0.20, expense: 0.20, style: 0.10, manager: 0.10 }, benchmark_map: { US_LARGE_CAP: "RUSSELL_1000_GROWTH", CORE_BOND: "BLOOMBERG_AGGREGATE", US_SMALL_CAP: "RUSSELL_2000", INTL_DEVELOPED: "MSCI_EAFE", TIPS: "BLOOMBERG_US_TIPS", TARGET_DATE: "SP_TARGET_DATE_INDEX" } }
              as: InvestmentConsultant
              as_user_id: "ic-1"
              captures: { ips_c_id: $.data.id }
            - call: "POST /governance/investment-policy-statements"
              payload: { plan_id: "${plan_id}", version_label: "IPS-2026-D", scoring_variant: "ROLLING_SINCE_WATCH", watch_trigger_score_max: 40.00, remediation_trigger_score_max: 25.00, cure_margin_points: 10.00, expense_peer_multiple: 1.25, min_track_record_quarters: 12, style_drift_r2_floor: 0.8000, watch_grace_quarters: 2, weights: { performance: 0.40, peer: 0.20, expense: 0.20, style: 0.10, manager: 0.10 }, benchmark_map: { US_LARGE_CAP: "RUSSELL_1000_GROWTH", CORE_BOND: "BLOOMBERG_AGGREGATE", US_SMALL_CAP: "RUSSELL_2000", INTL_DEVELOPED: "MSCI_EAFE", TIPS: "BLOOMBERG_US_TIPS", TARGET_DATE: "SP_TARGET_DATE_INDEX" } }
              as: InvestmentConsultant
              as_user_id: "ic-1"
              captures: { ips_d_id: $.data.id }
            - call: "POST /governance/committee-meetings"
              payload: { plan_id: "${plan_id}", meeting_date: "2026-08-19", quarter_index: 0 }
              as: PlanSponsorAdmin
              as_user_id: "psa-ops"
              captures: { meet7_id: $.data.id }
            - call: "POST /governance/committee-meetings/${meet7_id}/convene"
              payload: { attendee_member_ids: ["${mem_chair_id}", "${mem_fin_id}", "${mem_hr_id}"] }
              as: CommitteeChair
              as_user_id: "${mem_chair_id}"
          trigger:
            - call: "POST /governance/motions"
              payload: { meeting_id: "${meet7_id}", subject_type: "IPS_ADOPTION", subject_id: "${fund_small_id}", tally_basis: "VOTES_CAST" }
              as: CommitteeChair
              as_user_id: "${mem_chair_id}"
            - call: "POST /governance/motions"
              payload: { meeting_id: "${meet7_id}", subject_type: "WATCH_LIST_ACTION", subject_id: "${fund_small_id}", tally_basis: "VOTES_CAST" }
              as: CommitteeChair
              as_user_id: "${mem_chair_id}"
              captures: { motion_watch_id: $.data.id }
            - call: "POST /governance/motions/${motion_watch_id}/votes"
