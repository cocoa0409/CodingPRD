              captures: { stmt_id: "$.data[0].id" }
          trigger:
            - call: "POST /patient-statements/${stmt_id}/payments"
              payload: { amount_cents: 50000, method: "CARD" }
              as: BillingSpecialist
            - call: "GET /encounters/${encounter_id}"
              payload: {}
              as: BillingSpecialist
              captures: { bal: $.data.account_balance_cents }
          assert:
            - "Encounter.${encounter_id}.account_balance_cents == 70000"
            - "PatientStatement.${stmt_id}.status == PARTIALLY_PAID"
