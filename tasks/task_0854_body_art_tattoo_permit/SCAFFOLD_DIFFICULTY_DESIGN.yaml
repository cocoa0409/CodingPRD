  - rule_id: resource_temporal_overlap
    instances:
      - name: inspection_buffered_closed_windows_conflict_when_they_touch
        grounds:
          - validations[priority=21]
          - errors[ERR_INSPECTION_WINDOW_CONFLICT]
          - entities.Inspection.fields.scheduled_start_at
          - entities.Inspection.fields.scheduled_end_at
        distinguishing_aspect: |
          Interval semantics here are CLOSED intervals expanded by INSPECTION_BUFFER_MINUTES
          on both sides, on the Establishment resource: a visit starting exactly two hours
          after the previous one ends still conflicts because the two 60-minute buffers
          touch at 12:00, while a visit starting three hours later is accepted.
        test_recipe:
          setup:
