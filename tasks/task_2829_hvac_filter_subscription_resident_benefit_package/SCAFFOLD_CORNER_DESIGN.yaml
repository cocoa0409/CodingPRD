      - name: transfer_proration_rounds_each_leg_before_subtracting
        claim_type: chronological
        grounds: [calculations.transfer_proration, state_machines.SubscriptionTransfer.SKU_REMAPPED_to_COMPLETED]
        distinguishing_aspect: "Steps 1 and 2 each round independently and only step 3 subtracts, so the answer is -85; rounding the fee difference once instead yields -84, and the two orders are distinguishable only for a remainder pair like this one."
        test_recipe:
          setup:
