              payload: { preventable_flag: false }
              as: DenialsSpecialist
              captures: { d_v2: $.data.version }
          trigger:
            - call: "POST /rcm/denial-cases/${d1}/assign"
              payload: { specialist_id: "spec-1", expected_denial_case_version: "${d_v2}" }
              as: DenialsManager
              captures: { d_status: $.data.status, d_v3: $.data.version }
          assert:
            - "assign succeeds: status == QUEUED and version == 3 (2 after triage, +1 on assign)"

      - name: occ_correction_stale_version_rejected
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[denial-correction-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Intake correction via PATCH is OCC-guarded on the same DenialCase.version: a correction carrying the pre-triage version is rejected with ERR_STALE_VERSION."
        test_recipe:
          setup: ["payer A; code CO-16; denial CLM-2603 created (version 1) then triaged (version 2)"]
          setup_api_calls:
            - call: "POST /rcm/payers"
              payload: { name: "Payer A", plan_type: "COMMERCIAL", default_timely_filing_days: 60 }
              as: RevenueCycleDirector
