              as: MoldingOperator
              as_user_id: "${t_op}"
            - call: "POST /molding-cycles"
              payload: { production_order_id: "${po}", oven_station_id: "${station}", arm_index: 1, cooling_bay_id: "${bay}", oven_start_at: "2026-07-31T23:00:00Z", scheduled_oven_minutes: 60, scheduled_cooling_minutes: 30, oven_temp_c: 288.0, arm_rpm_major: 8.00, arm_rpm_minor: 2.00, cooling_mode: "FORCED_AIR", expected_production_order_version: "${po_v}" }
              as: MoldingOperator
              as_user_id: "${t_op}"
            - call: "POST /molding-cycles"
              payload: { production_order_id: "${po}", oven_station_id: "${station2}", arm_index: 1, cooling_bay_id: "${bay}", oven_start_at: "2026-08-01T09:00:00Z", scheduled_oven_minutes: 60, scheduled_cooling_minutes: 30, oven_temp_c: 288.0, arm_rpm_major: 8.00, arm_rpm_minor: 2.00, cooling_mode: "FORCED_AIR", expected_production_order_version: "${po_v}" }
              as: MoldingOperator
              as_user_id: "${t_op}"
            - call: "POST /oven-stations/${station}/mark-down"
              payload: { down_reason: "burner service" }
              as: PlantAdmin
              as_user_id: "admin-1"
            - call: "POST /molding-cycles"
              payload: { production_order_id: "${po}", oven_station_id: "${station}", arm_index: 1, cooling_bay_id: "${bay}", oven_start_at: "2026-08-01T09:00:00Z", scheduled_oven_minutes: 60, scheduled_cooling_minutes: 30, oven_temp_c: 288.0, arm_rpm_major: 8.00, arm_rpm_minor: 2.00, cooling_mode: "AMBIENT", expected_production_order_version: "${po_v}" }
              as: MoldingOperator
              as_user_id: "${t_op}"
            - call: "POST /oven-stations/${station}/restore"
              payload: {}
              as: PlantAdmin
              as_user_id: "admin-1"
            - call: "POST /cooling-bays/${bay}/mark-down"
              payload: { down_reason: "blower belt" }
              as: PlantAdmin
              as_user_id: "admin-1"
            - call: "POST /molding-cycles"
              payload: { production_order_id: "${po}", oven_station_id: "${station}", arm_index: 1, cooling_bay_id: "${bay}", oven_start_at: "2026-08-01T09:00:00Z", scheduled_oven_minutes: 60, scheduled_cooling_minutes: 30, oven_temp_c: 288.0, arm_rpm_major: 8.00, arm_rpm_minor: 2.00, cooling_mode: "FORCED_AIR", expected_production_order_version: "${po_v}" }
              as: MoldingOperator
              as_user_id: "${t_op}"
            - call: "POST /cooling-bays/${bay}/restore"
              payload: {}
              as: PlantAdmin
              as_user_id: "admin-1"
            - call: "POST /molding-cycles"
              payload: { production_order_id: "${po}", oven_station_id: "${station}", arm_index: 1, cooling_bay_id: "${bay}", oven_start_at: "2026-08-01T09:00:00Z", scheduled_oven_minutes: 60, scheduled_cooling_minutes: 30, oven_temp_c: 288.0, arm_rpm_major: 8.00, arm_rpm_minor: 2.00, cooling_mode: "FORCED_AIR", expected_production_order_version: "${po_v}" }
              as: MoldingOperator
              as_user_id: "${t_op}"
          assert:
            - "the arm_index 3 create returns status 422 with data.error_id 'ERR_INVALID_QUANTITY' because OVN-CD-1 has arm_count 2"
            - "the AMBIENT plus back-dated create returns status 422 with data.error_id 'ERR_COOLING_MODE_MISMATCH', not 'ERR_OVEN_START_IN_PAST'"
            - "the FORCED_AIR plus back-dated create returns status 422 with data.error_id 'ERR_OVEN_START_IN_PAST' — 2026-07-31T23:00:00Z is before the logical clock"
            - "the OVN-CD-2 create returns status 422 with data.error_id 'ERR_SIZE_CLASS_NOT_SUPPORTED' because SIZE_CLASS_ORDER[MID] exceeds SIZE_CLASS_ORDER[COMPACT]"
            - "the create against the DOWN station returns status 409 with data.error_id 'ERR_OVEN_STATION_DOWN', not the 422 ERR_COOLING_MODE_MISMATCH its AMBIENT body also earns"
            - "the create against the DOWN bay returns status 409 with data.error_id 'ERR_COOLING_BAY_DOWN'"
            - "ProductionOrder.${po}.version == ${po_v} and status == 'READY_TO_SCHEDULE' after all six refusals — a rejected create consumes no OCC token"
            - "GET /molding-cycles?production_order_id=${po} returns total_count 0 before the final call"
            - "the final create returns status 201, ProductionOrder.${po}.status == 'IN_PRODUCTION' and ProductionOrder.${po}.version == ${po_v} + 1"

      - name: err_cycle_lifecycle_invalid_state_and_the_cooling_time_floor
        claim_type: violation_to_error
        grounds:
          - errors.ERR_CYCLE_INVALID_STATE
          - errors.ERR_COOLING_TIME_INSUFFICIENT
          - validations.priority_35
          - validations.priority_54
        distinguishing_aspect: |
          The cycle's four-step lifecycle refuses every out-of-order call with
          ERR_CYCLE_INVALID_STATE (enter-cooling and demold on a SCHEDULED
          cycle, a second start-oven on an OVEN_RUNNING one), and the demold
          time floor is asserted on the minute: 29 floored cooling minutes is
          422 ERR_COOLING_TIME_INSUFFICIENT against min_cooling_minutes 30 while
          exactly 30 is accepted.
        test_recipe:
          setup:
            - "Base plant of the discovery instance with one SCHEDULED cycle holding a 24.000 kg RESERVED charge; PM-CD-KM.min_cooling_minutes is 30."
          setup_api_calls:
            - *cd2_clock0
            - *cd2_pm
            - *cd2_mold
            - *cd2_ov
            - *cd2_cb
            - *cd2_tres
            - *cd2_top
            - *cd2_tasm
            - *cd2_tqc
            - *cd2_wh
            - *cd2_lot
            - *cd2_po
            - *cd2_porel
            - *cd2_cyc
            - *cd2_chg
          trigger:
            - call: "POST /molding-cycles/${cyc}/enter-cooling"
              payload: { actual_oven_end_at: "2026-08-01T00:00:00Z" }
              as: MoldingOperator
              as_user_id: "${t_op}"
            - call: "POST /molding-cycles/${cyc}/demold"
              payload: { actual_cooling_end_at: "2026-08-01T00:00:00Z" }
              as: MoldingOperator
              as_user_id: "${t_op}"
            - *cd2_clk0900
            - *cd2_start
            - call: "POST /molding-cycles/${cyc}/start-oven"
              payload: { actual_oven_start_at: "2026-08-01T09:00:00Z" }
              as: MoldingOperator
              as_user_id: "${t_op}"
            - *cd2_clk1000
            - *cd2_cool
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T10:29:00Z" }
              as: PlantAdmin
              as_user_id: "admin-1"
            - call: "POST /molding-cycles/${cyc}/demold"
              payload: { actual_cooling_end_at: "2026-08-01T10:29:00Z" }
              as: MoldingOperator
              as_user_id: "${t_op}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T10:30:00Z" }
              as: PlantAdmin
              as_user_id: "admin-1"
            - call: "POST /molding-cycles/${cyc}/demold"
              payload: { actual_cooling_end_at: "2026-08-01T10:30:00Z" }
              as: MoldingOperator
              as_user_id: "${t_op}"
          assert:
            - "the enter-cooling on a SCHEDULED cycle returns status 409 with data.error_id 'ERR_CYCLE_INVALID_STATE' and the cycle is still SCHEDULED"
            - "the demold on a SCHEDULED cycle returns status 409 with data.error_id 'ERR_CYCLE_INVALID_STATE' and no FinishedUnit row exists"
            - "the first start-oven returns status 200 with status 'OVEN_RUNNING' and ResinCharge.${chg}.status 'CONSUMED'"
            - "the second start-oven returns status 409 with data.error_id 'ERR_CYCLE_INVALID_STATE' and ResinLot.${lot}.consumed_kg is still 24.000, not 48.000"
            - "the enter-cooling returns status 200 with status 'COOLING'"
            - "the demold at 10:29 returns status 422 with data.error_id 'ERR_COOLING_TIME_INSUFFICIENT' and the cycle is still 'COOLING'"
            - "the demold at 10:30 returns status 200 with status 'DEMOLDED' and actual_cooling_minutes 30"
            - "GET /finished-units?molding_cycle_id=${cyc} returns total_count 2, both in build_status 'DEMOLDED'"

      - name: err_mold_lifecycle_family_not_available_active_cycles_and_bad_replacement
        claim_type: violation_to_error
        grounds:
          - errors.ERR_MOLD_NOT_AVAILABLE
          - errors.ERR_MOLD_HAS_ACTIVE_CYCLES
          - errors.ERR_INVALID_MOLD_REPLACEMENT
          - validations.priority_44
          - validations.priority_45
          - validations.priority_67
        distinguishing_aspect: |
          The mould's three refusals are separated by what exactly is wrong:
          complete-service on an AVAILABLE mould is ERR_MOLD_NOT_AVAILABLE
          because that action demands MAINTENANCE, retire on a mould carrying a
          SCHEDULED cycle is ERR_MOLD_HAS_ACTIVE_CYCLES rather than a status
          complaint, and a replaces_mold_id that points at a RETIRED mould of a
          DIFFERENT hull model is 422 ERR_INVALID_MOLD_REPLACEMENT.
        test_recipe:
          setup:
            - "Base plant of the discovery instance plus PM-CD-T3; MLD-CD-1 is AVAILABLE and carries one SCHEDULED cycle for PO-CD-1."
          setup_api_calls:
            - *cd2_clock0
            - *cd2_pm
            - *cd2_pm3
            - *cd2_mold
            - *cd2_ov
            - *cd2_cb
            - *cd2_tres
            - *cd2_top
            - *cd2_tasm
            - *cd2_tqc
            - *cd2_wh
            - *cd2_lot
            - *cd2_po
            - *cd2_porel
            - *cd2_cyc
          trigger:
            - call: "POST /molds/${mold}/complete-service"
              payload: { service_note: "nothing was serviced" }
              as: PlantAdmin
              as_user_id: "admin-1"
            - call: "POST /molds/${mold}/retire"
              payload: { retire_reason: "cavity crack" }
              as: PlantAdmin
              as_user_id: "admin-1"
            - call: "POST /molding-cycles/${cyc}/abort"
              payload: { abort_reason: "MOLD_SERVICE_DUE" }
              as: MoldingOperator
              as_user_id: "${t_op}"
            - call: "POST /molds/${mold}/retire"
              payload: { retire_reason: "cavity crack" }
              as: PlantAdmin
              as_user_id: "admin-1"
            - call: "POST /molds/${mold}/service-hold"
              payload: { hold_note: "too late" }
              as: PlantAdmin
              as_user_id: "admin-1"
            - call: "POST /molds"
              payload: { mold_code: "MLD-CD-T3R", product_model_id: "${pm3}", size_class: "TANDEM", cavity_count: 1, nominal_charge_kg: 30.000, service_interval_cycles: 10, replaces_mold_id: "${mold}" }
              as: PlantAdmin
              as_user_id: "admin-1"
            - call: "POST /molds"
              payload: { mold_code: "MLD-CD-1R", product_model_id: "${pm}", size_class: "MID", cavity_count: 2, nominal_charge_kg: 24.000, service_interval_cycles: 10, replaces_mold_id: "${mold}" }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { moldr: $.data.id }
          assert:
            - "the complete-service returns status 409 with data.error_id 'ERR_MOLD_NOT_AVAILABLE' and Mold.${mold}.status is still 'AVAILABLE' with version 1"
            - "the first retire returns status 409 with data.error_id 'ERR_MOLD_HAS_ACTIVE_CYCLES', not 'ERR_MOLD_NOT_AVAILABLE', because the status itself was retireable"
            - "the abort returns status 200 with MoldingCycle.${cyc}.status 'ABORTED' and Mold.${mold}.status 'AVAILABLE'"
            - "the second retire returns status 200 with Mold.${mold}.status 'RETIRED'"
            - "the service-hold on the RETIRED mould returns status 409 with data.error_id 'ERR_MOLD_NOT_AVAILABLE'"
            - "the MLD-CD-T3R create returns status 422 with data.error_id 'ERR_INVALID_MOLD_REPLACEMENT' because ${mold} belongs to PM-CD-KM, not PM-CD-T3"
            - "the MLD-CD-1R create returns status 201 with replaces_mold_id == ${mold}, status 'AVAILABLE' and cycles_since_service 0"
            - "GET /molds?replaces_mold_id=${mold} returns total_count 1 with the single id ${moldr}"

      - name: err_warranty_intake_and_storage_axis_family_with_the_3_00_mm_boundary
        claim_type: violation_to_error
        grounds:
          - errors.ERR_UNIT_NOT_DELIVERED
          - errors.ERR_DEFORMATION_BELOW_THRESHOLD
          - errors.ERR_STORAGE_GUIDANCE_NOT_ACKNOWLEDGED
          - errors.ERR_STORAGE_REVIEW_ALREADY_DONE
          - errors.ERR_STORAGE_FINDING_NOT_WAIVABLE
          - errors.ERR_CUSTOMER_NOT_ACTIVE
          - validations.priority_27
          - validations.priority_46
          - validations.priority_47
          - validations.priority_56
          - validations.priority_60
          - validations.priority_61
        distinguishing_aspect: |
          Six warranty codes are separated on one dealer: a hull that never
          shipped is 409, 2.99 mm of deformation is 422 while exactly 3.00 mm is
          accepted, a VERIFIED storage review is 422 when the dealer never
          acknowledged the guidance although a VIOLATED review needs no
          acknowledgement, a repeat review is 409 ALREADY_DONE, a repeat waiver
          is 409 NOT_WAIVABLE, and once the dealer is SUSPENDED intake answers
          ERR_CUSTOMER_NOT_ACTIVE ahead of the undelivered-hull check.
        test_recipe:
          setup:
            - "Base plant of the discovery instance with both hulls SELLABLE and STORED."
            - "Customer CUS-CD-1 which has NEVER acknowledged the storage guidance, so storage_guidance_acknowledged_at is null."
            - "Shipment SHP-CD-2 with trailer_cube_capacity_m3 3.0000 carrying hull 1 only: 2.0000 of 3.0000 is 66.67 pct, above the 60.00 seal floor, so hull 1 becomes DELIVERED at 2026-08-02T00:00:00Z while hull 2 stays STORED."
          setup_api_calls:
            - *cd2_clock0
            - *cd2_pm
            - *cd2_mold
            - *cd2_ov
            - *cd2_cb
            - *cd2_tres
            - *cd2_top
            - *cd2_tasm
            - *cd2_tqc
            - *cd2_wh
            - *cd2_lot
            - *cd2_po
            - *cd2_porel
            - *cd2_cyc
            - *cd2_chg
            - *cd2_clk0900
            - *cd2_start
            - *cd2_clk1000
            - *cd2_cool
            - *cd2_clk1035
            - *cd2_demold
            - *cd2_disc
            - *cd2_trim1
            - *cd2_out1
            - *cd2_insp1
            - *cd2_trim2
            - *cd2_out2
            - *cd2_insp2
            - *cd2_whv1
            - *cd2_store1
            - *cd2_whv2
            - *cd2_store2
            - *cd2_cust
            - call: "POST /shipments"
              payload: { shipment_code: "SHP-CD-2", origin_warehouse_id: "${wh}", destination_zone: "Z2", carrier_code: "CARR-CD", trailer_cube_capacity_m3: 3.0000, trailer_max_payload_kg: 100.000 }
              as: LogisticsPlanner
              as_user_id: "planner-1"
