              captures: { emp_id: $.data.id }
            - call: "POST /members/register"
              payload: { practice_id: "${pr_id}", email: "l1@x.com", full_name: "M L1", plan_type: "MONTHLY" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /employers/${emp_id}/seats"
              payload: {}
              as: Employer
              as_user_id: "${emp_id}"
              captures: { seat_id: $.data.id }
            - call: "GET /employers/${emp_id}"
              payload: {}
              as: Employer
              as_user_id: "${emp_id}"
              captures: { emp_v: $.data.version }
          trigger:
            - call: "POST /employers/${emp_id}/seats/${seat_id}/occupy"
              payload: { member_id: "${m_id}", expected_employer_version: "${emp_v}" }
              as: Employer
              as_user_id: "${emp_id}"
              captures: { seat_status: $.data.seat_status }
          assert:
            - "EmployerSeat.${seat_id}.seat_status == OCCUPIED"
            - "Employer.${emp_id}.occupied_seat_count == 1"

      - name: derived_panel_load_bucket_recomputes_on_activation
        claim_type: derived_field_reconciliation
        grounds: [entities.Provider.fields.panel_load_bucket, entities.Provider.fields.active_panel_count]
        distinguishing_aspect: "After one member activates on a provider whose panel_target=1, active_panel_count becomes 1 and panel_load_bucket reconciles from UNDER_TARGET to AT_TARGET (1 >= panel_target=1, still < effective cap 5)."
        test_recipe:
          setup: ["Provider with panel_target=1, panel_hard_cap=5, panel_capacity=5; one member activating on it."]
          setup_api_calls:
            - call: "POST /practices"
              payload: { name: "L2", panel_target: 1, panel_hard_cap: 5, monthly_fee_cents: 15000, dpc_covered_service_codes: ["OFFICE_VISIT"] }
              as: PlatformAdmin
              captures: { pr_id: $.data.id }
            - call: "POST /providers"
              payload: { practice_id: "${pr_id}", full_name: "Dr L2", npi: "9000000001", panel_capacity: 5 }
              as: PlatformAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /members/register"
              payload: { practice_id: "${pr_id}", email: "l2@x.com", full_name: "M L2", plan_type: "MONTHLY" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /members/${m_id}/assign-pcp"
              payload: { mode: "MANUAL", provider_id: "${prov_id}" }
              as: PlatformAdmin
            - call: "GET /members/${m_id}/memberships"
              payload: {}
              as: PlatformAdmin
              captures: { mem_id: "$.data[0].id" }
          trigger:
            - call: "POST /memberships/${mem_id}/charge"
              payload: { charge_kind: "MEMBERSHIP_FEE", amount_cents: 15000, outcome: "SUCCEEDED" }
              as: Member
              as_user_id: "${m_id}"
            - call: "GET /providers/${prov_id}"
              payload: {}
              as: PlatformAdmin
              captures: { bucket: $.data.panel_load_bucket }
          assert:
            - "Provider.${prov_id}.active_panel_count == 1"
            - "Provider.${prov_id}.panel_load_bucket == AT_TARGET"

      - name: scheduled_suspension_only_fires_after_grace
        claim_type: scheduled_actions
        grounds: [state_machines.Member.PAST_DUE_to_SUSPENDED, entities.Membership.fields.past_due_since]
        distinguishing_aspect: "A PAST_DUE member is NOT suspended by a sweep run before past_due_since + grace_period_days; clock at 2026-07-10 (9 days < 14) leaves membership_status==PAST_DUE."
        test_recipe:
          setup: ["Member m PAST_DUE since 2026-07-01 (grace 14d); sweep run at 2026-07-10 (only 9 days elapsed)."]
          setup_api_calls:
            - call: "POST /practices"
              payload: { name: "L3", panel_target: 50, panel_hard_cap: 100, monthly_fee_cents: 15000, grace_period_days: 14, dpc_covered_service_codes: ["OFFICE_VISIT"] }
              as: PlatformAdmin
              captures: { pr_id: $.data.id }
            - call: "POST /providers"
              payload: { practice_id: "${pr_id}", full_name: "Dr L3", npi: "9000000002" }
              as: PlatformAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /members/register"
              payload: { practice_id: "${pr_id}", email: "l3@x.com", full_name: "M L3", plan_type: "MONTHLY" }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /members/${m_id}/assign-pcp"
              payload: { mode: "MANUAL", provider_id: "${prov_id}" }
              as: PlatformAdmin
            - call: "GET /members/${m_id}/memberships"
              payload: {}
              as: PlatformAdmin
              captures: { mem_id: "$.data[0].id" }
            - call: "POST /memberships/${mem_id}/charge"
              payload: { charge_kind: "MEMBERSHIP_FEE", amount_cents: 15000, outcome: "SUCCEEDED" }
              as: Member
              as_user_id: "${m_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /memberships/${mem_id}/charge"
              payload: { charge_kind: "MEMBERSHIP_FEE", amount_cents: 15000, outcome: "FAILED" }
              as: PlatformAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-10T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /_billing/run_suspension_sweep"
              payload: {}
              as: PlatformAdmin
          assert:
            - "Member.${m_id}.membership_status == PAST_DUE"

      - name: cascade_suspension_three_hop
        claim_type: cascading_side_effects
        grounds: [state_machines.Member.PAST_DUE_to_SUSPENDED]
        excluded_because:
          difficulty_instance: transitive_cascade / suspension_sweep_three_hop_cascade
          rationale: "The 3-hop sweep cascade end-state is fully asserted by the §1.8 transitive_cascade instance."

