            - { call: "POST /school/security-plans/${sp_id}/submit", payload: {}, as: SchoolAdmin }
            - { call: "POST /school/security-plans/${sp_id}/approve", payload: {}, as: SchoolAdmin }
            - { call: "POST /school/school-years/${y_id}/open", payload: {}, as: SchoolAdmin, captures: { y_status: $.data.status } }
          assert:
            - "First open: err == ERR_SECURITY_PLAN_NOT_ACTIVE (HTTP 409) while plan is DRAFT"
            - "After submit+approve (plan ACTIVE): y_status == OPEN"

  # =====================================================================
  # Rule 8 — resource_temporal_overlap (2 instances, different interval semantics)
  # =====================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: closure_closed_interval_inclusive_overlap
        grounds:
          - errors[ERR_CLOSURE_OVERLAP]
          - entities.CalendarClosure.fields.end_date
        distinguishing_aspect: |
          Resource: the SchoolYear calendar, under CLOSED-interval semantics — both
          endpoints inclusive. [09-08..09-09] collides with existing [09-07..09-08]
          at the shared day 09-08, while [09-09..09-10] is merely adjacent (start ==
          prior end + 1 day) and is accepted.
        test_recipe:
          setup:
            - "Year created (SETUP sufficient); closure C1 [2026-09-07 .. 2026-09-08] exists"
          setup_api_calls:
            - { call: "POST /school/school-years", payload: { name: "2026-27", start_date: "2026-09-01", end_date: "2027-06-01", member_tuition_cents: 72500, non_member_tuition_cents: 120000, early_bird_pct: 0.075, early_bird_deadline: "2026-08-15T00:00:00Z", sibling_discount_pcts: [0, 0.10, 0.20], activity_fee_cents: 5000, volunteer_hours_required: 8, volunteer_buyout_fee_cents: 25000, late_fee_pct: 0.015, late_fee_min_balance_cents: 500, tuition_due_date: "2026-10-01", withdrawal_deadline: "2026-09-30", refund_pct_after_deadline: 0.5, attendance_threshold_pct: 80 }, as: SchoolAdmin, captures: { y_id: $.data.id } }
            - { call: "POST /school/school-years/${y_id}/closures", payload: { start_date: "2026-09-07", end_date: "2026-09-08", reason: "Rosh Hashanah" }, as: SchoolAdmin, captures: { c1: $.data.id } }
          trigger:
            - { call: "POST /school/school-years/${y_id}/closures", payload: { start_date: "2026-09-08", end_date: "2026-09-09", reason: "Overlap attempt" }, as: SchoolAdmin, captures: { err: $.data.error_id } }
            - { call: "POST /school/school-years/${y_id}/closures", payload: { start_date: "2026-09-09", end_date: "2026-09-10", reason: "Adjacent break" }, as: SchoolAdmin, captures: { c3: $.data.id } }
          assert:
            - "err == ERR_CLOSURE_OVERLAP (HTTP 409): shared inclusive endpoint day 2026-09-08 collides"
            - "Adjacent closure created: CalendarClosure.${c3} exists with start_date 2026-09-09 — adjacency (gap of 0 days between inclusive ranges) is NOT an overlap"

      - name: section_room_halfopen_time_overlap
        grounds:
          - errors[ERR_ROOM_TIME_CONFLICT]
          - entities.Section.fields.start_time
        distinguishing_aspect: |
          Resource: a room slot, under HALF-OPEN [start_time, end_time) semantics —
          different interval geometry than the closure rule and a different resource.
          Back-to-back 11:30 start against an existing 10:00-11:30 is accepted;
          11:00-12:00 overlaps and is rejected; a different room during the same window is
          accepted.
        test_recipe:
          setup:
            - "Year created (SETUP); section S1 in room R1 SUN 10:00-11:30 exists (unstaffed sections are creatable)"
          setup_api_calls:
            - { call: "POST /school/school-years", payload: { name: "2026-27", start_date: "2026-09-01", end_date: "2027-06-01", member_tuition_cents: 72500, non_member_tuition_cents: 120000, early_bird_pct: 0.075, early_bird_deadline: "2026-08-15T00:00:00Z", sibling_discount_pcts: [0, 0.10, 0.20], activity_fee_cents: 5000, volunteer_hours_required: 8, volunteer_buyout_fee_cents: 25000, late_fee_pct: 0.015, late_fee_min_balance_cents: 500, tuition_due_date: "2026-10-01", withdrawal_deadline: "2026-09-30", refund_pct_after_deadline: 0.5, attendance_threshold_pct: 80 }, as: SchoolAdmin, captures: { y_id: $.data.id } }
            - { call: "POST /school/school-years/${y_id}/sections", payload: { grade: "G3", hebrew_level: "BEGINNER", capacity: 5, room: "R1", day_of_week: "SUN", start_time: "10:00", end_time: "11:30" }, as: SchoolAdmin, captures: { s1: $.data.id } }
          trigger:
            - { call: "POST /school/school-years/${y_id}/sections", payload: { grade: "G4", hebrew_level: "BEGINNER", capacity: 5, room: "R1", day_of_week: "SUN", start_time: "11:30", end_time: "12:30" }, as: SchoolAdmin, captures: { s2: $.data.id } }
            - { call: "POST /school/school-years/${y_id}/sections", payload: { grade: "G5", hebrew_level: "BEGINNER", capacity: 5, room: "R1", day_of_week: "SUN", start_time: "11:00", end_time: "12:00" }, as: SchoolAdmin, captures: { err: $.data.error_id } }
            - { call: "POST /school/school-years/${y_id}/sections", payload: { grade: "G5", hebrew_level: "BEGINNER", capacity: 5, room: "R2", day_of_week: "SUN", start_time: "10:30", end_time: "11:00" }, as: SchoolAdmin, captures: { s4: $.data.id } }
          assert:
            - "Section.${s2} created (201): back-to-back at 11:30 is free under half-open [start, end)"
            - "err == ERR_ROOM_TIME_CONFLICT (HTTP 409): [11:00,12:00) intersects [10:00,11:30)"
            - "Section.${s4} created (201): same time window in a different room does not conflict"

  # =====================================================================
  # Rule 9 — compensating_invariant (2 instances, different conserved quantities)
  # =====================================================================
  - rule_id: compensating_invariant
    instances:
      - name: payment_post_then_void_restores_money
        grounds:
          - calculations.payment_waterfall
          - state_machines.Payment.POSTED_to_VOIDED
          - entities.Family.fields.outstanding_balance_cents
          - entities.TuitionInvoice.fields.balance_cents
        distinguishing_aspect: |
          Conserved quantity: MONEY. Posting an 80000 payment against a 72063 invoice
          then voiding it must leave invoice paid_cents/balance_cents, family
          outstanding_balance_cents and credit_balance_cents bit-identical to the
          pre-payment state — zero drift after the compensating pair.
        test_recipe:
          setup:
            - "Year OPEN; MEMBER family with 1 student enrolled early; invoice issued: total_due 72063, balance 72063; family outstanding 72063, credit 0"
          setup_api_calls:
            - { call: "POST /school/school-years", payload: { name: "2026-27", start_date: "2026-09-01", end_date: "2027-06-01", member_tuition_cents: 72500, non_member_tuition_cents: 120000, early_bird_pct: 0.075, early_bird_deadline: "2026-08-15T00:00:00Z", sibling_discount_pcts: [0, 0.10, 0.20], activity_fee_cents: 5000, volunteer_hours_required: 8, volunteer_buyout_fee_cents: 25000, late_fee_pct: 0.015, late_fee_min_balance_cents: 500, tuition_due_date: "2026-10-01", withdrawal_deadline: "2026-09-30", refund_pct_after_deadline: 0.5, attendance_threshold_pct: 80 }, as: SchoolAdmin, captures: { y_id: $.data.id } }
            - { call: "POST /school/school-years/${y_id}/security-plan", payload: { plan_document: "Plan" }, as: SchoolAdmin, captures: { sp_id: $.data.id } }
            - { call: "POST /school/security-plans/${sp_id}/submit", payload: {}, as: SchoolAdmin }
            - { call: "POST /school/security-plans/${sp_id}/approve", payload: {}, as: SchoolAdmin }
            - { call: "POST /school/school-years/${y_id}/open", payload: {}, as: SchoolAdmin }
            - { call: "POST /school/teachers", payload: { full_name: "T", email: "t@x.org", background_check_cleared: true }, as: SchoolAdmin, captures: { t_id: $.data.id } }
            - { call: "POST /school/teachers/${t_id}/vet", payload: {}, as: SchoolAdmin }
            - { call: "POST /school/teachers/${t_id}/hire", payload: {}, as: SchoolAdmin }
            - { call: "POST /school/school-years/${y_id}/sections", payload: { grade: "G3", hebrew_level: "BEGINNER", capacity: 5, room: "R1", day_of_week: "SUN", start_time: "10:00", end_time: "11:30", teacher_id: "${t_id}" }, as: SchoolAdmin, captures: { sec_id: $.data.id, sv: $.data.version } }
            - { call: "POST /school/families", payload: { family_name: "Fam M", primary_email: "m@x.org", membership_status: "MEMBER" }, as: SchoolAdmin, captures: { fam_id: $.data.id, fam_v: $.data.version } }
            - { call: "POST /school/families/${fam_id}/students", payload: { full_name: "Em", grade: "G3", hebrew_level: "BEGINNER" }, as: SchoolAdmin, captures: { stu: $.data.id } }
            - { call: "POST /school/sections/${sec_id}/enrollments", payload: { student_id: "${stu}", expected_section_version: "${sv}" }, as: SchoolAdmin }
            - { call: "POST /school/families/${fam_id}/invoices", payload: { school_year_id: "${y_id}", expected_family_version: "${fam_v}" }, as: SchoolAdmin, captures: { inv: $.data.id } }
            - { call: "GET /school/families/${fam_id}", payload: {}, as: SchoolAdmin, captures: { pre_out: $.data.outstanding_balance_cents, pre_credit: $.data.credit_balance_cents } }
          trigger:
            - { call: "POST /school/families/${fam_id}/payments", payload: { amount_cents: 80000, method: "CARD" }, as: SchoolAdmin, captures: { pay: $.data.id, pay_rem: $.data.remainder_cents } }
            - { call: "POST /school/payments/${pay}/void", payload: {}, as: SchoolAdmin }
            - { call: "GET /school/invoices/${inv}", payload: {}, as: SchoolAdmin, captures: { post_paid: $.data.paid_cents, post_bal: $.data.balance_cents, post_status: $.data.status } }
            - { call: "GET /school/families/${fam_id}", payload: {}, as: SchoolAdmin, captures: { post_out: $.data.outstanding_balance_cents, post_credit: $.data.credit_balance_cents } }
          assert:
            - "pre_out == 72063 and pre_credit == 0"
            - "pay_rem == 7937 (80000 - 72063 waterfall remainder to credit)"
            - "After void: post_paid == 0, post_bal == 72063, post_status == ISSUED — PAID regressed through PARTIALLY_PAID back to ISSUED"
            - "post_out == 72063 == pre_out and post_credit == 0 == pre_credit — the forward+compensating pair conserved the family's money exactly"

      - name: enroll_then_withdraw_restores_seat_count
        grounds:
          - entities.Section.fields.enrolled_count
          - state_machines.Section.FULL_to_OPEN
          - state_machines.Enrollment.REGISTERED_to_WITHDRAWN
        distinguishing_aspect: |
          Conserved quantity: SEAT COUNT (not money). Enrolling to capacity flips the
          section FULL; withdrawing must restore enrolled_count and status to the
          pre-enrollment values (0 / OPEN), and the freed seat must be reusable by a
          different family's student.
        test_recipe:
          setup:
            - "Year OPEN; G2/BEGINNER section capacity 1; family A's student enrolled (count 1, FULL)"
          setup_api_calls:
            - { call: "POST /school/school-years", payload: { name: "2026-27", start_date: "2026-09-01", end_date: "2027-06-01", member_tuition_cents: 72500, non_member_tuition_cents: 120000, early_bird_pct: 0.075, early_bird_deadline: "2026-08-15T00:00:00Z", sibling_discount_pcts: [0, 0.10, 0.20], activity_fee_cents: 5000, volunteer_hours_required: 8, volunteer_buyout_fee_cents: 25000, late_fee_pct: 0.015, late_fee_min_balance_cents: 500, tuition_due_date: "2026-10-01", withdrawal_deadline: "2026-09-30", refund_pct_after_deadline: 0.5, attendance_threshold_pct: 80 }, as: SchoolAdmin, captures: { y_id: $.data.id } }
            - { call: "POST /school/school-years/${y_id}/security-plan", payload: { plan_document: "Plan" }, as: SchoolAdmin, captures: { sp_id: $.data.id } }
            - { call: "POST /school/security-plans/${sp_id}/submit", payload: {}, as: SchoolAdmin }
            - { call: "POST /school/security-plans/${sp_id}/approve", payload: {}, as: SchoolAdmin }
            - { call: "POST /school/school-years/${y_id}/open", payload: {}, as: SchoolAdmin }
            - { call: "POST /school/teachers", payload: { full_name: "T", email: "t@x.org", background_check_cleared: true }, as: SchoolAdmin, captures: { t_id: $.data.id } }
            - { call: "POST /school/teachers/${t_id}/vet", payload: {}, as: SchoolAdmin }
            - { call: "POST /school/teachers/${t_id}/hire", payload: {}, as: SchoolAdmin }
            - { call: "POST /school/school-years/${y_id}/sections", payload: { grade: "G2", hebrew_level: "BEGINNER", capacity: 1, room: "R1", day_of_week: "SUN", start_time: "10:00", end_time: "11:30", teacher_id: "${t_id}" }, as: SchoolAdmin, captures: { sec_id: $.data.id, sv: $.data.version } }
            - { call: "POST /school/families", payload: { family_name: "Fam A1", primary_email: "a1@x.org", membership_status: "MEMBER" }, as: SchoolAdmin, captures: { fam_a: $.data.id } }
            - { call: "POST /school/families/${fam_a}/students", payload: { full_name: "Aye", grade: "G2", hebrew_level: "BEGINNER" }, as: SchoolAdmin, captures: { stu_a: $.data.id } }
            - { call: "POST /school/sections/${sec_id}/enrollments", payload: { student_id: "${stu_a}", expected_section_version: "${sv}" }, as: SchoolAdmin, captures: { enr_a: $.data.id } }
            - { call: "POST /school/families", payload: { family_name: "Fam B1", primary_email: "b1@x.org", membership_status: "MEMBER" }, as: SchoolAdmin, captures: { fam_b: $.data.id } }
            - { call: "POST /school/families/${fam_b}/students", payload: { full_name: "Bee", grade: "G2", hebrew_level: "BEGINNER" }, as: SchoolAdmin, captures: { stu_b: $.data.id } }
          trigger:
            - { call: "POST /school/enrollments/${enr_a}/withdraw", payload: {}, as: SchoolAdmin }
            - { call: "GET /school/sections/${sec_id}", payload: {}, as: SchoolAdmin, captures: { mid_count: $.data.enrolled_count, mid_status: $.data.status, sv2: $.data.version } }
            - { call: "POST /school/sections/${sec_id}/enrollments", payload: { student_id: "${stu_b}", expected_section_version: "${sv2}" }, as: SchoolAdmin, captures: { enr_b: $.data.id } }
            - { call: "GET /school/sections/${sec_id}", payload: {}, as: SchoolAdmin, captures: { end_count: $.data.enrolled_count, end_status: $.data.status } }
          assert:
            - "After withdraw: mid_count == 0 and mid_status == OPEN — the seat is conserved (count back to its pre-enrollment value)"
            - "Enrollment.${enr_a}.status == WITHDRAWN and no longer counts toward enrolled_count"
            - "Family B enrolls into the freed seat: Enrollment.${enr_b} created; end_count == 1 and end_status == FULL"
