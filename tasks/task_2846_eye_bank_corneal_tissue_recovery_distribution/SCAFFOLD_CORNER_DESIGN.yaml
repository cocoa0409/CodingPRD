  - section: consistency_model
    instances:
      - name: every_write_response_already_shows_what_the_next_independent_read_returns
        claim_type: immediate_visibility
        grounds:
          - complexity_profile.consistency_model
          - response_envelope
          - calculations.surgeon_fee_ledger
          - calculations.tissue_shelf_life
        distinguishing_aspect: |
          Three writes with computed side effects — consent (which re-derives the donor's screening
          risk and status), classify (which derives classification, quality score and expires_at) and
          allocation confirmation (which moves money into the surgeon's ledger) — are each followed
          immediately by an independent GET on the affected row. Under an `immediate` consistency
          model every derived value must already be identical in the write response and the
          follow-up read, including the cross-aggregate surgeon ledger that no write response for
          confirm even contains.
        test_recipe:
          setup:
            - "logical clock at 2026-08-03T06:00:00.000Z"
            - "one donor walked to a classified ELIGIBLE tissue, one ACTIVE surgeon with one OPEN request"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T06:00:00.000Z" }
              as: EyeBankCoordinator
            - call: "POST /eye-bank/technicians"
              payload: { full_name: "Rosa Field", certification_level: "RECOVERY_ONLY", certification_expires_at: "2027-01-01T00:00:00.000Z" }
              as: EyeBankCoordinator
              captures: { rt_id: $.data.id }
            - call: "POST /eye-bank/technicians"
              payload: { full_name: "Nils Abadi", certification_level: "RECOVERY_AND_EVAL", certification_expires_at: "2027-01-01T00:00:00.000Z" }
              as: EyeBankCoordinator
              captures: { et_id: $.data.id }
            - call: "POST /eye-bank/donors"
              payload: { donor_code: "D-2846-CM1", referral_source: "HOSPITAL", death_at: "2026-08-03T02:00:00.000Z", death_time_basis: "ASYSTOLE", body_cooled_at: "2026-08-03T03:00:00.000Z", age_years: 52, cause_of_death_category: "CARDIAC" }
              as: EyeBankCoordinator
              captures: { donor_id: $.data.id }
            - call: "POST /eye-bank/donors/${donor_id}/screening-records"
              payload: { question_code: "TATTOO_12M", response: "YES", historian_relationship: "SPOUSE" }
              as: EyeBankCoordinator
              captures: { weight: $.data.weight_applied }
          trigger:
            - call: "POST /eye-bank/donors/${donor_id}/consent"
              payload: { consent_type: "FIRST_PERSON", consent_scope: "TRANSPLANT_ONLY", authorizing_party_name: "Registry Self-Consent" }
              as: EyeBankCoordinator
              captures: { w_status: $.data.status, w_risk: $.data.screening_risk_score, w_ver: $.data.version, w_upd: $.data.updated_at }
            - call: "GET /eye-bank/donors/${donor_id}"
              payload: {}
              as: EyeBankCoordinator
              captures: { r_status: $.data.status, r_risk: $.data.screening_risk_score, r_ver: $.data.version, r_upd: $.data.updated_at }
            - call: "POST /eye-bank/donors/${donor_id}/serology-panels"
              payload: { specimen_type: "POST_MORTEM", drawn_at: "2026-08-03T04:00:00.000Z", hemodilution_pct: 0.00, expected_donor_version: "${w_ver}" }
              as: LabTechnician
              captures: { panel_id: $.data.id }
            - call: "POST /eye-bank/serology-panels/${panel_id}/results"
              payload: { hiv_result: "NON_REACTIVE", hbv_result: "NON_REACTIVE", hcv_result: "NON_REACTIVE", syphilis_result: "NON_REACTIVE" }
              as: LabTechnician
            - call: "POST /eye-bank/donors/${donor_id}/approve-recovery"
              payload: {}
              as: MedicalDirector
            - call: "POST /eye-bank/recoveries"
              payload: { donor_id: "${donor_id}", technician_id: "${rt_id}", dispatched_at: "2026-08-03T06:30:00.000Z", planned_release_at: "2026-08-03T10:00:00.000Z" }
              as: EyeBankCoordinator
              captures: { rec_id: $.data.id }
            - call: "POST /eye-bank/recoveries/${rec_id}/arrive"
              payload: { arrival_at: "2026-08-03T07:00:00.000Z" }
              as: RecoveryTechnician
              as_user_id: "${rt_id}"
            - call: "POST /eye-bank/recoveries/${rec_id}/complete"
              payload: { preservation_at: "2026-08-03T09:00:00.000Z", preservation_medium: "OPTISOL_GS", recovered_lateralities: ["OD"] }
              as: RecoveryTechnician
              as_user_id: "${rt_id}"
            - call: "GET /eye-bank/tissues"
              payload: { recovery_id: "${rec_id}" }
              as: EyeBankCoordinator
              captures: { t_id: "$.data[0].id", t_v: "$.data[0].version" }
            - call: "POST /eye-bank/tissues/${t_id}/evaluations"
              payload: { evaluator_technician_id: "${et_id}", method: "SLIT_LAMP", performed_at: "2026-08-03T09:30:00.000Z", epithelium_defect_grade: 0, stromal_clarity_grade: 0, dm_folds_grade: 0, expected_tissue_version: "${t_v}" }
              as: EvaluationTechnician
              as_user_id: "${et_id}"
              captures: { t_v2: $.data.tissue_version_after }
            - call: "POST /eye-bank/tissues/${t_id}/evaluations"
              payload: { evaluator_technician_id: "${et_id}", method: "SPECULAR", performed_at: "2026-08-03T09:45:00.000Z", guttata_grade: 0, endothelial_cell_count: 3100, expected_tissue_version: "${t_v2}" }
              as: EvaluationTechnician
              as_user_id: "${et_id}"
              captures: { t_v3: $.data.tissue_version_after }
            - call: "POST /eye-bank/tissues/${t_id}/classify"
              payload: {}
              as: MedicalDirector
              captures: { w_cls: $.data.classification, w_q: $.data.tissue_quality_score, w_exp: $.data.expires_at, w_disp: $.data.disposition_status }
            - call: "GET /eye-bank/tissues/${t_id}"
              payload: {}
              as: MedicalDirector
              captures: { r_cls: $.data.classification, r_q: $.data.tissue_quality_score, r_exp: $.data.expires_at, r_disp: $.data.disposition_status }
            - call: "POST /eye-bank/surgeons"
              payload: { full_name: "Dr Imani Rho", center_code: "CTR-01", specialty: "CORNEA" }
              as: EyeBankCoordinator
              captures: { sg_id: $.data.id, sg_gross0: $.data.gross_billed_cents, sg_out0: $.data.outstanding_fee_cents }
            - call: "POST /eye-bank/surgeon-requests"
              payload: { surgeon_id: "${sg_id}", procedure_type: "PK", surgery_date: "2026-08-08T00:00:00.000Z", min_ecd: 2000, max_donor_age_years: 70, laterality_preference: "ANY", urgency: "ROUTINE" }
              as: EyeBankCoordinator
              captures: { req_id: $.data.id }
            - call: "POST /eye-bank/allocations"
              payload: { tissue_id: "${t_id}", request_id: "${req_id}" }
              as: EyeBankCoordinator
              captures: { alloc_id: $.data.id, fee: $.data.processing_fee_cents }
            - call: "GET /eye-bank/surgeons/${sg_id}"
              payload: {}
              as: EyeBankCoordinator
              captures: { sg_gross1: $.data.gross_billed_cents, sg_cred1: $.data.credited_fee_cents, sg_out1: $.data.outstanding_fee_cents }
            - call: "POST /eye-bank/allocations/${alloc_id}/confirm"
              payload: {}
              as: EyeBankCoordinator
              captures: { alloc_st: $.data.status }
            - call: "GET /eye-bank/surgeons/${sg_id}"
              payload: {}
              as: EyeBankCoordinator
              captures: { sg_gross2: $.data.gross_billed_cents, sg_cred2: $.data.credited_fee_cents, sg_out2: $.data.outstanding_fee_cents }
          assert:
            - "${weight} == 10 and ${w_risk} == 10 (the TATTOO_12M YES answer is scored at its full weight of 10 under the INTERVIEW_ONLY variant and is already visible when consent is recorded)"
            - "${w_status} == ${r_status} and ${w_risk} == ${r_risk} and ${w_ver} == ${r_ver} and ${w_upd} == ${r_upd} (write response == immediate read, field for field)"
            - "${w_cls} == ${r_cls} and ${w_q} == ${r_q} and ${w_exp} == ${r_exp} and ${w_disp} == ${r_disp}"
            - "${w_cls} == \"TRANSPLANT_OPTICAL\" and ${w_exp} == \"2026-08-17T09:00:00.000Z\""
            - "${sg_gross0} == 0 and ${sg_out0} == 0"
            - "${sg_gross1} == 0 and ${sg_cred1} == 0 and ${sg_out1} == 0 (a RESERVED allocation enters no ledger sum)"
            - "${alloc_st} == \"CONFIRMED\""
            - "${sg_gross2} == ${fee} and ${sg_cred2} == 0 and ${sg_out2} == ${fee} (the ledger is already reconciled on the very next read)"

      - name: derived_ledger_fields_are_immediately_consistent_after_a_compensating_write
        claim_type: immediate_visibility
        grounds:
          - complexity_profile.consistency_model
          - calculations.surgeon_fee_ledger
        distinguishing_aspect: |
          The strongest form of the immediate claim is that a *reversal* leaves no lag either: after a
          compensating write the derived money and inventory fields must already be back in balance on
          the next read, with no reconciliation pass in between.
        excluded_because:
          difficulty_instance: compensating_invariant / confirm_then_unused_return_conserves_the_surgeon_money_ledger
          rationale: |
            That compensating_invariant instance reads gross_billed_cents, credited_fee_cents and
            outstanding_fee_cents immediately after the confirm and immediately after the unused
            return, asserting gross unchanged, credited raised by the fee and outstanding back to
            zero; its companion reservation_then_cancellation_restores_the_tissue_unit_ledger does the
            same for the availability ledger. Both already assert same-request visibility of derived
            fields, so a separate immediacy test would only re-read the same values.
