            - call: "POST /optics/optical-designs"
              payload: { design_code: "OD-2540-T", aperture_mm: 120.0, wavelength_min_nm: 450, wavelength_max_nm: 700, required_rms_wavefront_waves: 0.0400, tolerance_budget_waves: 0.0100, transmitted_wavefront_budget_waves: 0.1050 }
