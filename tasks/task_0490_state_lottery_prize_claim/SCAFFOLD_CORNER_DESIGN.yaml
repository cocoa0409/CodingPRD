scaffold_corner_design:

  # ===========================================================================
  # Section: entities
  # ===========================================================================
  - section: entities
    instances:
      - name: create_game_returns_201_with_defaults
        claim_type: Creation
        grounds: [entities.DrawingGame, endpoints]
        distinguishing_aspect: "POST /games with name, game_type, claim_window_days returns 201; status defaults ACTIVE; withholding/factor/annuity defaults applied."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /games"
              payload: { name: "BaseGame", game_type: "JACKPOT", claim_window_days: 30 }
              as: LotteryOfficer
              captures: { gid: $.data.id }
          assert:
            - "HTTP status == 201"
            - "DrawingGame.${gid}.status == ACTIVE"
            - "DrawingGame.${gid}.federal_withholding_threshold_cents == 60000000"
            - "DrawingGame.${gid}.federal_withholding_rate == 0.24"
            - "DrawingGame.${gid}.state_withholding_rate == 0.05"
            - "DrawingGame.${gid}.cash_option_factor == 0.60"
            - "DrawingGame.${gid}.annuity_years == 30"
            - "DrawingGame.${gid}.version == 1"

      - name: get_retailer_not_found_returns_404
        claim_type: Not Found
        grounds: [entities.Retailer, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /retailers/{bogus} returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /retailers/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: LotteryOfficer
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 404 and data.error_id == ERR_NOT_FOUND"

      - name: create_retailer_missing_tax_id_returns_invalid_request
        claim_type: Required Fields
        grounds: [entities.Retailer.fields.tax_id, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /retailers without tax_id (source input, no default) returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /retailers"
              payload: { business_name: "No Tax" }
              as: LicensingAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 422 and data.error_id == ERR_INVALID_REQUEST"

      - name: create_retailer_default_commission_rate_applied
        claim_type: Defaults
        grounds: [entities.Retailer.fields.commission_rate]
        distinguishing_aspect: "Omitting commission_rate applies default 0.06; cashing_bonus_rate default 0.01."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /retailers"
              payload: { business_name: "Default Co", tax_id: "TAX-D1" }
              as: LicensingAdmin
              captures: { rid: $.data.id }
          assert:
            - "Retailer.${rid}.commission_rate == 0.06"
            - "Retailer.${rid}.cashing_bonus_rate == 0.01"
            - "Retailer.${rid}.license_status == PENDING"
            - "Retailer.${rid}.commission_balance_cents == 0"

      - name: ticket_claim_deadline_computed_input_ignored
        claim_type: Computed Fields
        grounds: [entities.Ticket.fields.claim_deadline, calculations.ticket_claim_deadline]
        distinguishing_aspect: "claim_deadline is computed = draw_date + claim_window_days (30) = 2026-02-09; a client cannot set it (no input field)."
        test_recipe:
          setup: ["ACTIVE retailer+terminal; game claim_window_days 30; clock 2026-01-05"]
          setup_api_calls:
            - call: "POST /games"
              payload: { name: "CompGame", game_type: "INSTANT", claim_window_days: 30, federal_withholding_threshold_cents: 600000 }
              as: LotteryOfficer
              captures: { gid: $.data.id }
            - call: "POST /retailers"
              payload: { business_name: "Comp Mart", tax_id: "TAX-D2" }
              as: LicensingAdmin
              captures: { rid: $.data.id }
            - call: "POST /retailers/${rid}/license/activate"
              payload: {}
              as: LicensingAdmin
            - call: "POST /terminals"
              payload: { retailer_id: "${rid}", serial_number: "SN-D2" }
              as: LicensingAdmin
              captures: { tid: $.data.id }
            - call: "POST /terminals/${tid}/activate"
              payload: {}
              as: LicensingAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-05T00:00:00Z" }
              as: LotteryOfficer
          trigger:
            - call: "POST /tickets"
              payload: { game_id: "${gid}", terminal_id: "${tid}", serial: "CMP-1", price_cents: 200, draw_date: "2026-01-10T00:00:00Z", declared_tier: 0, gross_prize_cents: 0 }
              as: TerminalOperator
              captures: { tk: $.data.id }
          assert:
            - "Ticket.${tk}.claim_deadline == 2026-02-09T00:00:00.000Z"
            - "Ticket.${tk}.validation_status == UNVALIDATED"
            - "Ticket.${tk}.second_chance_status == INELIGIBLE"

      - name: create_game_system_id_and_timestamps_generated
        claim_type: System Fields
        grounds: [entities.DrawingGame]
        distinguishing_aspect: "id, created_at, updated_at, version are system-minted; client cannot supply them."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /games"
              payload: { name: "SysGame", game_type: "DAILY", claim_window_days: 7 }
              as: LotteryOfficer
              captures: { gid: $.data.id, ver: $.data.version }
          assert:
            - "DrawingGame.${gid}.version == 1"
            - "DrawingGame.${gid}.id is a server-minted UUID with no type prefix"

      - name: create_game_invalid_game_type_enum_rejected
        claim_type: Type Constraints
        grounds: [entities.DrawingGame.fields.game_type, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "game_type not in {JACKPOT, INSTANT, DAILY} returns ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /games"
              payload: { name: "BadType", game_type: "LOTTO", claim_window_days: 30 }
              as: LotteryOfficer
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 422 and data.error_id == ERR_INVALID_REQUEST"

      - name: create_terminal_bad_retailer_fk_returns_404
        claim_type: Parent Relationships
        grounds: [entities.Terminal.fields.retailer_id, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "POST /terminals with non-existent retailer_id FK returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /terminals"
              payload: { retailer_id: "00000000-0000-4000-8000-000000000002", serial_number: "SN-X" }
              as: LicensingAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 404 and data.error_id == ERR_NOT_FOUND"

      - name: list_games_pagination_envelope
        claim_type: Listing
        grounds: [entities.DrawingGame, endpoints]
        distinguishing_aspect: "GET /games returns paginated list with total_count and has_more in meta/pagination."
        test_recipe:
          setup: ["two games created"]
          setup_api_calls:
            - call: "POST /games"
              payload: { name: "L1", game_type: "DAILY", claim_window_days: 7 }
              as: LotteryOfficer
            - call: "POST /games"
              payload: { name: "L2", game_type: "DAILY", claim_window_days: 7 }
              as: LotteryOfficer
          trigger:
            - call: "GET /games"
              payload: {}
              as: LotteryOfficer
          assert:
            - "response_type == array"
            - "total_count == 2 and has_more == false"

  # ===========================================================================
  # Section: state_machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: suspend_pending_retailer_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Retailer.ACTIVE_to_SUSPENDED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Suspending a PENDING (not ACTIVE) retailer returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["a PENDING retailer"]
          setup_api_calls:
            - call: "POST /retailers"
              payload: { business_name: "Susp Bad", tax_id: "TAX-S1" }
              as: LicensingAdmin
              captures: { rid: $.data.id }
          trigger:
            - call: "POST /retailers/${rid}/license/suspend"
              payload: {}
              as: LicensingAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409 and data.error_id == ERR_INVALID_STATE"
            - "Retailer.${rid}.license_status == PENDING"

      - name: revoke_active_retailer_directly_returns_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Retailer.SUSPENDED_to_REVOKED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Revoke is only defined from SUSPENDED; revoking an ACTIVE retailer returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["an ACTIVE retailer"]
          setup_api_calls:
            - call: "POST /retailers"
              payload: { business_name: "Rev Bad", tax_id: "TAX-S2" }
              as: LicensingAdmin
              captures: { rid: $.data.id }
            - call: "POST /retailers/${rid}/license/activate"
              payload: {}
              as: LicensingAdmin
          trigger:
            - call: "POST /retailers/${rid}/license/revoke"
              payload: {}
              as: LicensingAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409 and data.error_id == ERR_INVALID_STATE"

      - name: revoked_retailer_is_terminal_no_reactivation
        claim_type: Terminal State Lockdown
        grounds: [state_machines.Retailer, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "REVOKED is terminal; activating a REVOKED retailer returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["a retailer driven ACTIVE -> SUSPENDED -> REVOKED"]
          setup_api_calls:
            - call: "POST /retailers"
              payload: { business_name: "Term Mart", tax_id: "TAX-S3" }
              as: LicensingAdmin
              captures: { rid: $.data.id }
            - call: "POST /retailers/${rid}/license/activate"
              payload: {}
              as: LicensingAdmin
            - call: "POST /retailers/${rid}/license/suspend"
              payload: {}
              as: LicensingAdmin
            - call: "POST /retailers/${rid}/license/revoke"
              payload: {}
              as: LicensingAdmin
          trigger:
            - call: "POST /retailers/${rid}/license/activate"
              payload: {}
              as: LicensingAdmin
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409 and data.error_id == ERR_INVALID_STATE"
            - "Retailer.${rid}.license_status == REVOKED"

      - name: new_retailer_initial_state_pending
        claim_type: Initial State
        grounds: [state_machines.Retailer, entities.Retailer.fields.license_status]
        distinguishing_aspect: "A newly created retailer starts in initial_state PENDING."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /retailers"
              payload: { business_name: "Init Co", tax_id: "TAX-S4" }
              as: LicensingAdmin
              captures: { rid: $.data.id }
          assert:
            - "Retailer.${rid}.license_status == PENDING"

      - name: double_validate_ticket_returns_invalid_state
        claim_type: Idempotency
        grounds: [state_machines.Ticket.UNVALIDATED_to_VALIDATED_NONWINNER, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Validating an already-VALIDATED_NONWINNER ticket a second time returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["a VALIDATED_NONWINNER ticket"]
          setup_api_calls:
            - call: "POST /games"
              payload: { name: "DblGame", game_type: "DAILY", claim_window_days: 30, federal_withholding_threshold_cents: 600000 }
              as: LotteryOfficer
              captures: { gid: $.data.id }
            - call: "POST /retailers"
              payload: { business_name: "Dbl Mart", tax_id: "TAX-S5" }
              as: LicensingAdmin
              captures: { rid: $.data.id }
            - call: "POST /retailers/${rid}/license/activate"
              payload: {}
              as: LicensingAdmin
            - call: "POST /terminals"
              payload: { retailer_id: "${rid}", serial_number: "SN-S5" }
              as: LicensingAdmin
              captures: { tid: $.data.id }
            - call: "POST /terminals/${tid}/activate"
              payload: {}
              as: LicensingAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-10T00:00:00Z" }
              as: LotteryOfficer
            - call: "POST /tickets"
              payload: { game_id: "${gid}", terminal_id: "${tid}", serial: "DB-1", price_cents: 200, draw_date: "2026-01-10T00:00:00Z", declared_tier: 0, gross_prize_cents: 0 }
              as: TerminalOperator
              captures: { tk: $.data.id }
            - call: "POST /tickets/${tk}/validate"
              payload: {}
              as: TerminalOperator
          trigger:
            - call: "POST /tickets/${tk}/validate"
              payload: {}
              as: TerminalOperator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409 and data.error_id == ERR_INVALID_STATE"
            - "Ticket.${tk}.validation_status == VALIDATED_NONWINNER"

      - name: suspend_cascade_only_deactivates_active_terminals
        claim_type: Conditional cascade
        grounds: [state_machines.Retailer.ACTIVE_to_SUSPENDED, state_machines.Terminal.ACTIVE_to_DEACTIVATED]
        distinguishing_aspect: "On suspend, only ACTIVE terminals cascade to DEACTIVATED; a PROVISIONED (never-activated) terminal stays PROVISIONED."
        test_recipe:
          setup: ["ACTIVE retailer with one ACTIVE terminal and one still-PROVISIONED terminal"]
          setup_api_calls:
            - call: "POST /retailers"
              payload: { business_name: "Casc Mart", tax_id: "TAX-S6" }
              as: LicensingAdmin
              captures: { rid: $.data.id }
            - call: "POST /retailers/${rid}/license/activate"
              payload: {}
              as: LicensingAdmin
            - call: "POST /terminals"
              payload: { retailer_id: "${rid}", serial_number: "SN-S6A" }
              as: LicensingAdmin
              captures: { t_act: $.data.id }
            - call: "POST /terminals/${t_act}/activate"
              payload: {}
              as: LicensingAdmin
            - call: "POST /terminals"
              payload: { retailer_id: "${rid}", serial_number: "SN-S6B" }
              as: LicensingAdmin
              captures: { t_prov: $.data.id }
          trigger:
            - call: "POST /retailers/${rid}/license/suspend"
              payload: {}
              as: LicensingAdmin
          assert:
            - "Terminal.${t_act}.status == DEACTIVATED"
            - "Terminal.${t_prov}.status == PROVISIONED"
            - "Retailer.${rid}.license_status == SUSPENDED"

      - name: ticket_parallel_axes_independent_winner_stays_ineligible
        claim_type: Side Effect Execution
        grounds: [state_machines.Ticket.UNVALIDATED_to_VALIDATED_WINNER, entities.Ticket.fields.second_chance_status]
        distinguishing_aspect: "Parallel axes: validating a WINNER sets validation_status=VALIDATED_WINNER while second_chance_status stays INELIGIBLE (winners never enter second chance)."
        test_recipe:
          setup: ["ACTIVE retailer+terminal; over-threshold winner; clock before deadline"]
          setup_api_calls:
            - call: "POST /games"
              payload: { name: "ParGame", game_type: "INSTANT", claim_window_days: 30, federal_withholding_threshold_cents: 600000 }
              as: LotteryOfficer
              captures: { gid: $.data.id }
            - call: "POST /retailers"
              payload: { business_name: "Par Mart", tax_id: "TAX-S7" }
              as: LicensingAdmin
              captures: { rid: $.data.id }
            - call: "POST /retailers/${rid}/license/activate"
              payload: {}
              as: LicensingAdmin
            - call: "POST /terminals"
              payload: { retailer_id: "${rid}", serial_number: "SN-S7" }
              as: LicensingAdmin
              captures: { tid: $.data.id }
            - call: "POST /terminals/${tid}/activate"
              payload: {}
              as: LicensingAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-05T00:00:00Z" }
              as: LotteryOfficer
            - call: "POST /tickets"
              payload: { game_id: "${gid}", terminal_id: "${tid}", serial: "PA-1", price_cents: 200, draw_date: "2026-01-10T00:00:00Z", declared_tier: 1, gross_prize_cents: 1000000 }
              as: TerminalOperator
              captures: { tk: $.data.id }
          trigger:
            - call: "POST /tickets/${tk}/validate"
              payload: {}
              as: TerminalOperator
          assert:
            - "Ticket.${tk}.validation_status == VALIDATED_WINNER"
            - "Ticket.${tk}.second_chance_status == INELIGIBLE"

      - name: under_threshold_counter_pay_accrues_cashing_bonus
        claim_type: Ledger sync
        grounds: [state_machines.Ticket.UNVALIDATED_to_PAID_AT_COUNTER, entities.Retailer.fields.commission_balance_cents]
        distinguishing_aspect: "Validating an under-threshold winner (gross 50,000 < 600,000) pays at counter and accrues +500 (50000*0.01) to retailer.commission_balance_cents."
        test_recipe:
          setup: ["ACTIVE retailer+terminal cashing_bonus_rate 0.01; under-threshold winner gross 50,000; clock before deadline"]
          setup_api_calls:
            - call: "POST /games"
              payload: { name: "CtrGame", game_type: "INSTANT", claim_window_days: 30, federal_withholding_threshold_cents: 600000 }
              as: LotteryOfficer
              captures: { gid: $.data.id }
            - call: "POST /retailers"
              payload: { business_name: "Ctr Mart", tax_id: "TAX-S8", cashing_bonus_rate: 0.01 }
              as: LicensingAdmin
              captures: { rid: $.data.id }
            - call: "POST /retailers/${rid}/license/activate"
              payload: {}
              as: LicensingAdmin
            - call: "POST /terminals"
              payload: { retailer_id: "${rid}", serial_number: "SN-S8" }
              as: LicensingAdmin
              captures: { tid: $.data.id }
            - call: "POST /terminals/${tid}/activate"
              payload: {}
              as: LicensingAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-05T00:00:00Z" }
              as: LotteryOfficer
            - call: "POST /tickets"
              payload: { game_id: "${gid}", terminal_id: "${tid}", serial: "CT-1", price_cents: 100, draw_date: "2026-01-10T00:00:00Z", declared_tier: 2, gross_prize_cents: 50000 }
              as: TerminalOperator
              captures: { tk: $.data.id }
          trigger:
            - call: "POST /tickets/${tk}/validate"
              payload: {}
              as: TerminalOperator
          assert:
            - "Ticket.${tk}.validation_status == PAID_AT_COUNTER"
            - "Retailer.${rid}.commission_balance_cents == 500"

      - name: void_submitted_claim_compensation_returns_ticket
        claim_type: Compensation
        grounds: [state_machines.PrizeClaim.SUBMITTED_to_VOIDED, state_machines.Ticket.CLAIM_PENDING_to_VALIDATED_WINNER]
        distinguishing_aspect: "Voiding a SUBMITTED claim cascades the ticket CLAIM_PENDING -> VALIDATED_WINNER (compensation; no drift)."
        test_recipe:
          setup: ["a SUBMITTED claim on a winner ticket (ticket CLAIM_PENDING)"]
          setup_api_calls:
            - call: "POST /games"
              payload: { name: "VoidGame", game_type: "INSTANT", claim_window_days: 30, federal_withholding_threshold_cents: 600000 }
              as: LotteryOfficer
              captures: { gid: $.data.id }
            - call: "POST /retailers"
              payload: { business_name: "Void Mart", tax_id: "TAX-S9" }
              as: LicensingAdmin
              captures: { rid: $.data.id }
            - call: "POST /retailers/${rid}/license/activate"
              payload: {}
              as: LicensingAdmin
            - call: "POST /terminals"
              payload: { retailer_id: "${rid}", serial_number: "SN-S9" }
              as: LicensingAdmin
              captures: { tid: $.data.id }
            - call: "POST /terminals/${tid}/activate"
              payload: {}
              as: LicensingAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-05T00:00:00Z" }
              as: LotteryOfficer
            - call: "POST /tickets"
              payload: { game_id: "${gid}", terminal_id: "${tid}", serial: "VD-1", price_cents: 200, draw_date: "2026-01-10T00:00:00Z", declared_tier: 1, gross_prize_cents: 1000000 }
              as: TerminalOperator
              captures: { tk: $.data.id }
            - call: "POST /tickets/${tk}/validate"
              payload: {}
              as: TerminalOperator
            - call: "POST /players"
              payload: { full_name: "Void Player", government_id_number: "GID-S9" }
              as: ClaimsClerk
              captures: { pid: $.data.id }
            - call: "POST /prize-claims"
              payload: { ticket_id: "${tk}", player_id: "${pid}", payout_option: "CASH" }
              as: ClaimsClerk
              captures: { cl: $.data.id }
          trigger:
            - call: "POST /prize-claims/${cl}/void"
              payload: {}
              as: LotteryOfficer
              as_user_id: "u-off"
          assert:
            - "PrizeClaim.${cl}.status == VOIDED"
            - "Ticket.${tk}.validation_status == VALIDATED_WINNER"

      - name: escheat_sweep_bubbles_winner_to_escheated_with_record
        claim_type: Valid Transition
        grounds: [state_machines.Ticket.VALIDATED_WINNER_to_ESCHEATED, entities.EscheatRecord, endpoints]
        distinguishing_aspect: "After clock > claim_deadline, run_escheat_sweep moves a VALIDATED_WINNER to ESCHEATED and creates an EscheatRecord with escheated_amount_cents == gross_prize_cents (1,000,000)."
        test_recipe:
          setup: ["a VALIDATED_WINNER ticket gross 1,000,000; clock advanced past its claim_deadline"]
          setup_api_calls:
            - call: "POST /games"
              payload: { name: "EscGame", game_type: "INSTANT", claim_window_days: 30, federal_withholding_threshold_cents: 600000 }
              as: LotteryOfficer
              captures: { gid: $.data.id }
            - call: "POST /retailers"
              payload: { business_name: "Esc Mart", tax_id: "TAX-S10" }
              as: LicensingAdmin
              captures: { rid: $.data.id }
            - call: "POST /retailers/${rid}/license/activate"
              payload: {}
              as: LicensingAdmin
            - call: "POST /terminals"
              payload: { retailer_id: "${rid}", serial_number: "SN-S10" }
              as: LicensingAdmin
              captures: { tid: $.data.id }
            - call: "POST /terminals/${tid}/activate"
              payload: {}
              as: LicensingAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-05T00:00:00Z" }
              as: LotteryOfficer
            - call: "POST /tickets"
              payload: { game_id: "${gid}", terminal_id: "${tid}", serial: "ES-1", price_cents: 200, draw_date: "2026-01-10T00:00:00Z", declared_tier: 1, gross_prize_cents: 1000000 }
              as: TerminalOperator
              captures: { tk: $.data.id }
            - call: "POST /tickets/${tk}/validate"
              payload: {}
              as: TerminalOperator
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-10T00:00:00Z" }
              as: LotteryOfficer
          trigger:
            - call: "POST /_clock/run_escheat_sweep"
              payload: {}
              as: LotteryOfficer
              captures: { cnt: $.data.escheated_count }
          assert:
            - "Ticket.${tk}.validation_status == ESCHEATED"
            - "an EscheatRecord exists with ticket_id == ${tk} and escheated_amount_cents == 1000000"

  # ===========================================================================
  # Section: calculations
  # ===========================================================================
  - section: calculations
    instances:
      - name: cash_nonjackpot_payout_full_gross_no_factor
        claim_type: Correct Result
        grounds: [calculations.prize_payout_calc, entities.PrizeClaim.fields.gross_payout_cents]
