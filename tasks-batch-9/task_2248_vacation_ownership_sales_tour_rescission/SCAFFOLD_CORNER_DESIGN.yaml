          rationale: "That 1.8 instance already pins priority 21 ahead of priority 29 on a request that violates both the lead time and the gallery capacity."

      - name: down_payment_insufficient_one_cent_below_tier
        excluded_because:
          difficulty_instance: down_payment_required_inclusive_boundary_one_cent
          rationale: "That 1.8 instance already probes ERR_DOWN_PAYMENT_INSUFFICIENT one cent below the required amount and one cent above it."

      - name: channel_suspended_blocks_new_bookings
        excluded_because:
          difficulty_instance: channel_no_show_suspension_cascades_to_bulk_cancellation_and_slot_ledger
