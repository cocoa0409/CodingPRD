              payload: { community_id: "${cid}", name: "Fr Plan", contract_type: "TYPE_C", entrance_fee_cents: 100000, refund_plan: "DECLINING", monthly_service_fee_cents: 1000, second_person_fee_cents: 0, declining_nonrefundable_bps: 400 }
              as: FinanceOfficer
              captures: { pid: $.data.id }
