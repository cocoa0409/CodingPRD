            - call: "POST /thermal-tests"
              payload: { production_run_id: "${run_a}", product_line_id: "${pl_a}", certification_program_id: "${prog_ps}", window_start: "2026-08-03T08:00:00Z", window_end: "2026-08-03T12:00:00Z" }
              as: QualityEngineer
