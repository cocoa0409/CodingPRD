            - call: "POST /home-oxygen/delivery-routes"
              payload: { branch_id: "${br_id}", service_date: "2026-08-02", driver_user_id: "u-drv-1", shift_start_utc: "2026-08-01T12:00:00Z", shift_end_utc: "2026-08-01T22:00:00Z" }
