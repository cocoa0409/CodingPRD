      - name: unusable_layout_blocks_job_creation_before_the_blank_search_can_fail
        claim_type: cascading_validation
        grounds:
          - validations[priority=310]
          - validations[priority=320]
          - errors.ERR_LAYOUT_NOT_USABLE
          - calculations.frame_layout_geometry
        distinguishing_aspect: >-
          The first rule's outcome creates the second rule's condition and must still win: the layout
          computes to 90.0 mm (BLANK_TOO_SMALL above the 85.0 ceiling) and the shelf holds no lot at
          all, yet POST /lab-jobs answers ERR_LAYOUT_NOT_USABLE at 310 rather than
          ERR_NO_ELIGIBLE_BLANK_LOT at 320.
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; PROG-167 design with NO blank lots received at all; self-pay patient; verified multifocal prescription."
