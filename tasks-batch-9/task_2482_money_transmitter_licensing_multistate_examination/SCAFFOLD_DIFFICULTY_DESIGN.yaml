          Category pair (state, business_fiscal): priority 61 ERR_LICENSE_NOT_ACTIVE and priority 110
          ERR_NET_WORTH_INSUFFICIENT are both violated by the same renewal call, and the response
          must be the 409 state error, never the 422 fiscal one.
