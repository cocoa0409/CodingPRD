  - rule_id: resource_temporal_overlap
    instances:
      - name: system_coverage_window_overlap_closed_interval_same_site
        grounds:
          - validations[priority=16]
          - entities.SystemRegistration.fields.coverage_window
          - endpoints.[POST /warranty/system-registrations]
        distinguishing_aspect: |
