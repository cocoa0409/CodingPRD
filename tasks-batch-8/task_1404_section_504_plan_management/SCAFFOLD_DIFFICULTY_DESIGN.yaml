  # ===========================================================================
  # Rule 3 — non_linear_state_machine (two different entities)
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: plan_modify_plan_review_cycle_loop
        grounds:
          - state_machines.Section504Plan.UNDER_ANNUAL_REVIEW_to_DRAFT
          - state_machines.Section504Plan.DRAFT_to_PENDING_PARENT_CONSENT
          - state_machines.Section504Plan
        distinguishing_aspect: |
          Section504Plan exhibits a CYCLE: DRAFT → PENDING_PARENT_CONSENT →
          PENDING_TEACHER_ACK → ACTIVE → UNDER_ANNUAL_REVIEW → DRAFT (via
          MODIFY_PLAN outcome). The plan re-traverses consent + ack after a
          review, exercising revision-loop semantics on a single entity.
        test_recipe:
          setup:
            - "School S1 with coordinator CO and teacher T1 (TRAINED_CURRENT)"
            - "Student STU with ACTIVE plan P (effective 2026-01-01)"
            - "Schedule an ANNUAL review on P, start it, complete with outcome=MODIFY_PLAN → P reverts to DRAFT"
