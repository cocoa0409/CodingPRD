  # ---- IncClearance ---------------------------------------------------------
  - method: POST
    path: /concussion-program/inc-clearances/{id}/decide
    roles: [IndependentConsultant]
    input: [decision, decision_notes]
    output: IncClearance
    status: 200
    side_effects:
      - "APPROVED -> status = APPROVED, decided_at = now, expires_at = now + 168h; the case stays PENDING_INC_CLEARANCE"
      - "DENIED_MORE_REST -> revokes the case's highest PASSED ReturnStep, decrements case.rtp_stage, clears earliest_return_at and returns the case to RTP_IN_PROGRESS"
      - "DENIED_INSUFFICIENT_DOCUMENTATION -> returns the case to RTP_IN_PROGRESS with no revocation and no stage regression"
      - "increments IncClearance.version, and ConcussionCase.version / ReturnStep.version where touched, by 1"
    errors: [ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED, ERR_INVALID_REQUEST, ERR_RESOURCE_NOT_FOUND, ERR_ROLE_IDENTITY_MISMATCH, ERR_CLINICIAN_SUSPENDED, ERR_CLINICIAN_CREDENTIAL_EXPIRED, ERR_CLEARANCE_STATE_INVALID, ERR_INC_ASSIGNMENT_MISMATCH, ERR_CASE_STATE_INVALID, ERR_RTP_STAGES_INCOMPLETE]

  - method: GET
