      - name: room_out_of_service_blocks_new_session_and_second_retirement
        claim_type: precondition_enforcement
        grounds:
          - state_machines.TestingRoom.transitions.ACTIVE_to_OUT_OF_SERVICE
          - endpoints[POST /testing-rooms/{roomId}/out-of-service]
          - validations[priority=44]
          - errors[ERR_ROOM_OUT_OF_SERVICE]
        distinguishing_aspect: |
          Maintenance retirement is the ONLY way to reach OUT_OF_SERVICE while the owning center stays
          FULL_AUTHORIZED, which is what makes priority 44 observable at all (a suspension cascade
          would be pre-empted by priority 40). The already-scheduled session in the room is deliberately
          left alone, and the second retirement call is refused.
        test_recipe:
          setup:
            - "A FULL_AUTHORIZED center with one ACTIVE room holding one DRAFT session 2026-08-20T09:00:00Z..12:00:00Z."
          setup_api_calls:
            - call: "POST /testing-centers"
              payload: { name: "Maintenance Center", state_code: "ID" }
              as: StateAuthority
              captures: { c: $.data.id }
            - call: "POST /testing-centers/${c}/authorization-decision"
              payload: { decision: "GRANT_FULL" }
              as: StateAuthority
            - call: "POST /testing-centers/${c}/rooms"
              payload: { room_code: "R-501", seat_capacity: 12 }
              as: CenterAdministrator
              as_user_id: "${c}"
              captures: { r: $.data.id }
            - call: "POST /exam-sessions"
              payload: { testing_room_id: "${r}", subtest: "MATH", starts_at: "2026-08-20T09:00:00Z", ends_at: "2026-08-20T12:00:00Z", requested_seats: 5 }
              as: CenterAdministrator
              as_user_id: "${c}"
              captures: { sess: $.data.id }
          trigger:
            - call: "POST /testing-rooms/${r}/out-of-service"
              payload: { service_note: "HVAC replacement" }
              as: CenterAdministrator
              as_user_id: "${c}"
            - call: "POST /exam-sessions"
              payload: { testing_room_id: "${r}", subtest: "RLA", starts_at: "2026-08-21T09:00:00Z", ends_at: "2026-08-21T12:00:00Z", requested_seats: 5 }
              as: CenterAdministrator
              as_user_id: "${c}"
              captures: { e1: $.data.error_id }
            - call: "POST /testing-rooms/${r}/out-of-service"
              payload: { service_note: "HVAC replacement" }
              as: CenterAdministrator
              as_user_id: "${c}"
              captures: { e2: $.data.error_id }
          assert:
            - "the first out-of-service call returns 200 with data.status == 'OUT_OF_SERVICE' and data.service_note == 'HVAC replacement'"
            - "the new POST /exam-sessions in that room returns 409 with data.error_id == 'ERR_ROOM_OUT_OF_SERVICE' (priority 44, not ERR_CENTER_SUSPENDED)"
            - "the second out-of-service call returns 409 with data.error_id == 'ERR_ROOM_OUT_OF_SERVICE'"
            - "GET /testing-centers/${c} still reports data.authorization_status == 'FULL_AUTHORIZED'"
            - "GET /exam-sessions/${sess} still reports data.status == 'DRAFT' (the pre-existing sitting is untouched)"

      - name: exam_session_proctor_assignment_repeated_rejected
        claim_type: idempotency
        grounds:
          - state_machines.ExamSession.transitions.DRAFT_to_SCHEDULED
          - validations[priority=30]
          - errors[ERR_SESSION_NOT_ASSIGNABLE]
        distinguishing_aspect: |
          Assignment is only defined from DRAFT: re-assigning an already SCHEDULED session is 409 and
          must not double-count Proctor.assigned_session_count (it stays 1).
        test_recipe:
          setup:
            - "A FULL_AUTHORIZED center, one ACTIVE room, two CERTIFIED proctors, one DRAFT session 2026-08-20T09:00:00Z..12:00:00Z."
          setup_api_calls:
            - call: "POST /testing-centers"
              payload: { name: "Assign Once Center", state_code: "MT" }
              as: StateAuthority
              captures: { c: $.data.id }
            - call: "POST /testing-centers/${c}/authorization-decision"
              payload: { decision: "GRANT_FULL" }
