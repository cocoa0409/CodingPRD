      - name: duplicate_referral_normalized_match_and_re_referral
        claim_type: correct_result
        grounds: ["calculations.duplicate_referral_detection", "validations[priority=23]"]
        distinguishing_aspect: "Normalization lowercases and collapses whitespace: ' LILA  monroe ' with the same dob duplicates the PENDING_CERTIFICATION referral; after that referral is DENIED a new referral for the same child is allowed and reuses the same Child record."
