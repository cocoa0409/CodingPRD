            - "${lf_at_boundary} == 30.00"
            - "Invoice.${inv_at_boundary_id}.energy_charge == 38016.00"
            - "${total_at_boundary} == 62816.00"
            - "Invoice.${inv_at_boundary_id}.invoice_state == VOID after the void call"
            - "Invoice.${inv_above_boundary_id}.billed_energy_mwh == 432.100"
            - "${lf_above_boundary} == 30.01"
            - "Invoice.${inv_above_boundary_id}.energy_charge == 31975.40"
            - "${total_above_boundary} == 56775.40"
            - "${total_at_boundary} - ${total_above_boundary} == 6040.60"

      - name: leak_risk_weighted_score_lands_exactly_on_the_suspect_floor
        claim_type: weighted_scoring
        grounds:
          - calculations.segment_leak_risk_score
          - state_machines.PipeSegment.SOUND_to_SUSPECT
          - state_machines.PipeSegment.SOUND_to_MONITORED
          - endpoints[POST /district-energy/pipe-segments/{segment_id}/condition-assessment]
        distinguishing_aspect: "Each of the four components is rounded to two decimals before the 0.35/0.30/0.20/0.15 weighting, so a 1966 class B segment with makeup_water_ratio 0.02486 scores exactly 70.00 and bands SUSPECT, while 0.02480 scores 69.96 and bands MONITORED — a 0.00006 change in one input flips the band."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z so age_years is measured against 2026."
            - "NetworkLoop LOOP-R with two identical PipeSegments SEG-R1 and SEG-R2 (install_year 1966, insulation_class B), both SOUND."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemController
            - call: "POST /district-energy/network-loops"
              payload: { code: "LOOP-R", name: "Riverbank Loop R", service_mode: "HEATING", design_supply_temp_c: 100.0, max_pressure_kpa: 1700.0, rated_capacity_kw: 7000.0 }
              as: SystemController
              captures: { loop_r_id: $.data.id }
            - call: "POST /district-energy/pipe-segments"
              payload: { loop_id: "${loop_r_id}", code: "SEG-R1", length_m: 700.0, diameter_mm: 250, install_year: 1966, insulation_class: "B", buried_depth_m: 1.2 }
              as: NetworkEngineer
              captures: { seg_r1_id: $.data.id }
            - call: "POST /district-energy/pipe-segments"
              payload: { loop_id: "${loop_r_id}", code: "SEG-R2", length_m: 700.0, diameter_mm: 250, install_year: 1966, insulation_class: "B", buried_depth_m: 1.2 }
              as: NetworkEngineer
              captures: { seg_r2_id: $.data.id }
          trigger:
            - call: "POST /district-energy/pipe-segments/${seg_r1_id}/condition-assessment"
              payload: { makeup_water_ratio: 0.02486, historical_leak_count: 2, insulation_class: "B", survey_note: "at the floor" }
              as: NetworkEngineer
              captures: { seg_r1_score: $.data.leak_risk_score, seg_r1_condition: $.data.condition }
            - call: "POST /district-energy/pipe-segments/${seg_r2_id}/condition-assessment"
              payload: { makeup_water_ratio: 0.02480, historical_leak_count: 2, insulation_class: "B", survey_note: "just below the floor" }
              as: NetworkEngineer
              captures: { seg_r2_score: $.data.leak_risk_score, seg_r2_condition: $.data.condition }
            - call: "GET /district-energy/network-loops/${loop_r_id}"
              payload: {}
              as: NetworkEngineer
              captures: { loop_r_suspect_count: $.data.suspect_segment_count }
          assert:
            - "${seg_r1_score} == 70.00"
            - "${seg_r1_condition} == SUSPECT"
            - "${seg_r2_score} == 69.96"
            - "${seg_r2_condition} == MONITORED"
            - "${loop_r_suspect_count} == 1"
            - "PipeSegment.${seg_r1_id}.makeup_water_ratio == 0.02486"
            - "PipeSegment.${seg_r2_id}.historical_leak_count == 2"

      - name: loop_emissions_summary_reports_efficiency_and_intensity_against_the_city_target
        claim_type: Correct Result
        grounds:
          - calculations.loop_emissions_efficiency_summary
          - endpoints[GET /district-energy/network-loops/{loop_id}/emissions-summary]
          - state_machines.DispatchPlan.APPROVED_to_COMMITTED
        distinguishing_aspect: "The summary divides committed emissions by delivered energy, not by produced energy: the 8 percent distribution loss shrinks 40.653 MWh to 37.401 MWh, which lifts the intensity to 163.74 kg per MWh and puts the loop 13.74 above the 150.0 city target, so the status reads EXCEEDING even though the mix is 92.00 percent efficient."
        test_recipe:
          setup:
            - "NetworkLoop LOOP-C as in merit_order_input_set_skips_an_asset_left_in_outage but with every asset AVAILABLE, so the plan dispatches C_STO, C_CHP and C_BIO for 40.653 MWh and 6123.88 kg."
            - "The plan is carried all the way to COMMITTED; a second DRAFT plan on the same loop is left uncommitted so it must be excluded from the summary."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
