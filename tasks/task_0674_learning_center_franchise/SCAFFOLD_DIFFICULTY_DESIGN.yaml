              as: CenterDirector
              captures: { s1: $.data.id }
            - call: "POST /sessions/${s1}/open"
              payload: {}
              as: CenterDirector
            - call: "POST /sessions"
              payload: { center_id: "${c_id}", instructor_user_id: "instr-2", start_at: "2026-05-01T09:30:00Z", end_at: "2026-05-01T10:30:00Z", seat_cap: 6 }
              as: CenterDirector
              captures: { s2: $.data.id }
            - call: "POST /sessions/${s2}/open"
              payload: {}
              as: CenterDirector
            - call: "POST /sessions"
              payload: { center_id: "${c_id}", instructor_user_id: "instr-3", start_at: "2026-05-01T10:00:00Z", end_at: "2026-05-01T11:00:00Z", seat_cap: 6 }
              as: CenterDirector
              captures: { s3: $.data.id }
            - call: "POST /sessions/${s3}/open"
              payload: {}
              as: CenterDirector
            - call: "GET /sessions/${s1}"
              payload: {}
              as: CenterDirector
              captures: { s1_v: $.data.version }
