      - name: cold_chain_stage_buffer_exactly_48_hours_apart_is_legal
        grounds:
          - validations.priority_30
          - errors.ERR_COLD_CHAIN_GAP_VIOLATION
          - entities.Shipment.fields.staged_at
          - calculations.shipment_cost_cents
          - endpoints.POST_/pharmacy/fill-cycles/{id}/shipments
        distinguishing_aspect: |
          Resource entity: Shipment — specifically the patient's cold-chain lane, a resource
          shared across DIFFERENT fill cycles. Interval semantics: BUFFERED on timestamps,
          not dates — two stagings must be at least COLD_CHAIN_MIN_GAP_HOURS (48) apart,
          measured in hours against the logical clock, and exactly 48 hours apart is legal
          while 47 hours is fatal. Unlike priority 28 (half-open dates on one entity) and
          priority 29 (closed-inclusive dates on one entity), here there is no interval to
          intersect at all: a minimum separation is imposed between two point events.
