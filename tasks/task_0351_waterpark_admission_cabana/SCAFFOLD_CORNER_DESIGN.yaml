              payload: { entry_window_id: "00000000-0000-0000-0000-000000000000", expected_entry_window_version: "${real_window_v}" }
              as: Guest
              as_user_id: "${guest_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_NOT_FOUND (existence priority 4 beats state priority 6)"
        # The existence check on entry_window_id (bogus uuid) rejects before OCC;
        # expected_entry_window_version is bound to a real window's version so there
        # is no unbound placeholder, but it is never consulted because the window id
        # does not resolve.

      - name: freeze_day_ticket_returns_freeze_not_allowed
        claim_type: Conditional validation
        grounds: ["validations[priority=11]", "errors[ERR_FREEZE_NOT_ALLOWED]"]
        distinguishing_aspect: "POST /admissions/{id}/freeze on a DAY_TICKET admission returns ERR_FREEZE_NOT_ALLOWED (freeze is SEASON_PASS-only)."
