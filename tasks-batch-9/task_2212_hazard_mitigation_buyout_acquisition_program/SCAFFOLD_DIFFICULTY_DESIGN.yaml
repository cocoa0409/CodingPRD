            - "Appraisal.${ap_b}.status == SUBMITTED"
            - "Appraisal.${ap_a}.status == ACCEPTED"
            - "GET /appraisals?parcel_id=${p1}&appraisal_type=INITIAL returns 2 rows"

      - name: appraisal_windows_overlapping_by_one_day_conflict_only_once_the_peer_is_submitted
        grounds:
          - calculations.appraisal_validity_window
          - calculations.appraisal_validity_window.input_set_filter
          - validations.priority_40
          - state_machines.Appraisal.DRAFT_to_SUBMITTED
        distinguishing_aspect: |
          Overlap here is only ONE day wide (2027-06-30 falls inside [2026-07-01, 2027-07-01)) and the
          peer set is filtered by status, so the same pair of intervals is legal or illegal depending
          on the peer's lifecycle state: appraisal E submits successfully while D is DRAFT even though
          their windows intersect, and F - whose window intersects only E - is then refused because E
          has since become SUBMITTED. Unlike
          appraisal_half_open_validity_windows_touching_at_the_boundary_are_permitted, no interval
          endpoint coincides with another.
