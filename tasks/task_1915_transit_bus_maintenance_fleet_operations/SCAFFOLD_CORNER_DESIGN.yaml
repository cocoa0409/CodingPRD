            - { call: "POST /fleet/mechanics/${m1}/certifications", payload: { cert_type: "ENGINE", issued_date: "2026-01-01", expiry_date: "2027-01-01" }, as: MaintenanceSupervisor }
            - { call: "POST /fleet/defect-reports", payload: { bus_id: "${b}", severity: "MAJOR", defect_code: "ENGINE", description: "stalled at 5th & Main", odometer_at_report: 10000 }, as: Operator, captures: { d: $.data.id } }
            - { call: "POST /fleet/defect-reports/${d}/events", payload: { event_type: "TRIAGE", disposition: "ROAD_CALL" }, as: MaintenanceSupervisor }
          trigger:
            - { call: "POST /fleet/defect-reports/${d}/events", payload: { event_type: "DISPATCH_ROAD_CALL", mechanic_id: "${m1}" }, as: MaintenanceSupervisor, captures: { err: $.data.error_id } }
            - { call: "POST /fleet/shifts", payload: { shift_date: "2026-08-01", shift_type: "AM", required_headcount: {} }, as: MaintenanceSupervisor, captures: { s: $.data.id } }
            - { call: "POST /fleet/shifts/${s}/publish", payload: {}, as: MaintenanceSupervisor }
            - { call: "POST /fleet/shifts/${s}/assignments", payload: { mechanic_id: "${m1}", role_in_shift: "TECH" }, as: MaintenanceSupervisor, captures: { a: $.data.id } }
            - { call: "POST /fleet/shift-assignments/${a}/events", payload: { event_type: "CONFIRM" }, as: Mechanic, as_user_id: "${m1}" }
            - { call: "POST /fleet/defect-reports/${d}/events", payload: { event_type: "DISPATCH_ROAD_CALL", mechanic_id: "${m1}" }, as: MaintenanceSupervisor, captures: { st: $.data.status, mech: $.data.road_call_mechanic_id } }
          assert:
