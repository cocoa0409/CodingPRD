              as: QualityInspector
              as_user_id: "insp-1"
          assert:
            - "the ADHESION response returns result == PASS (adhesion_class 2 is the worst passing class) and holidays_per_tank == null"
            - "after the ADHESION record only, TankLot.${tl_id}.status is still LINED"
            - "the HOLIDAY response returns holidays_per_tank == 0.5000 and result == PASS"
            - "in the same HOLIDAY response the lot has become LINING_VERIFIED"
            - "both LiningInspection rows have record_status == CURRENT (one per inspection_type, so neither supersedes the other)"
            - "TankLot.${tl_id}.wip_quantity == 120, scrapped_quantity == 0 and rework_count == 0"
      - name: model_withdraw_cascades_to_released_private_label_variants_only
        claim_type: cascade_down
        grounds:
          - state_machines.ProductModel.RELEASED_to_WITHDRAWN
          - entities.ProductModel.fields.base_model_id
          - entities.ProductModel.fields.is_private_label
          - endpoints[POST /mfg/product-models/{id}/withdraw]
        distinguishing_aspect: >
          A self-referential cascade with a state filter: withdrawing the base model must withdraw the variant
          that is RELEASED while leaving the DRAFT variant alone, because the fan-out is declared over
          release_status IN {RELEASED, RESTRICTED} only. An implementation that withdraws every variant
          unconditionally moves the DRAFT variant to a terminal state it never legitimately entered, and one that
          ignores base_model_id withdraws nothing.
        test_recipe:
          setup:
            - "Base model GX50-T is RELEASED and is not private label."
            - "Variant HD50-PL is private label on base GX50-T and has been RELEASED."
            - "Variant BC50-PL is private label on the same base but is still DRAFT."
            - "No model is certified, which does not block release in either direction."
          setup_api_calls:
            - call: "POST /mfg/product-models"
              payload: { model_code: "GX50-T", fuel_type: "GAS", nominal_capacity_gallons: 50, channel: "TRADE", insulation_r_value: 20, is_private_label: false }
              as: ComplianceEngineer
              captures: { m1_id: $.data.id }

            - call: "POST /mfg/product-models"
              payload: { model_code: "HD50-PL", fuel_type: "GAS", nominal_capacity_gallons: 50, channel: "RETAIL", insulation_r_value: 20, is_private_label: true, base_model_id: "${m1_id}", brand_label: "HomeValue" }
              as: ComplianceEngineer
              captures: { pl1_id: $.data.id }
            - call: "POST /mfg/product-models"
              payload: { model_code: "BC50-PL", fuel_type: "GAS", nominal_capacity_gallons: 50, channel: "BUILDER", insulation_r_value: 20, is_private_label: true, base_model_id: "${m1_id}", brand_label: "BuilderChoice" }
              as: ComplianceEngineer
              captures: { pl2_id: $.data.id }
            - call: "POST /mfg/product-models/${m1_id}/release-to-channel"
              payload: {}
              as: ComplianceEngineer
            - call: "POST /mfg/product-models/${pl1_id}/release-to-channel"
              payload: {}
              as: ComplianceEngineer
          trigger:
            - call: "POST /mfg/product-models/${m1_id}/withdraw"
              payload: { reason_code: "LINE_DISCONTINUED" }
              as: ComplianceEngineer
          assert:
            - "ProductModel.${m1_id}.release_status == WITHDRAWN"
            - "ProductModel.${pl1_id}.release_status == WITHDRAWN (it was RELEASED and is a variant of the withdrawn base)"
            - "ProductModel.${pl2_id}.release_status is still DRAFT (the fan-out only covers RELEASED and RESTRICTED variants)"
            - "ProductModel.${pl2_id}.version is unchanged by the withdrawal"
            - "all three models still have certification_status == UNCERTIFIED, so the release dimension moved alone"
      - name: supplier_qualify_blocked_until_containment_dispositioned
        claim_type: guarded_transition
        grounds:
          - state_machines.Supplier.DISQUALIFIED_to_PENDING
          - state_machines.Supplier.PENDING_to_QUALIFIED
          - state_machines.ComponentLot.BLOCKED_to_RELEASED
          - state_machines.ComponentLot.BLOCKED_to_REJECTED
          - validations[priority 33]
          - validations[priority 11]
          - errors[ERR_BLOCKED_LOTS_REMAIN]
          - errors[ERR_COMPONENT_SUPPLIER_NOT_QUALIFIED]
          - entities.Supplier.fields.blocked_lot_count
        distinguishing_aspect: >
          The containment guard is a DERIVED counter of child rows and it sits one step later than it looks: a
          DISQUALIFIED supplier may always requalify to PENDING, but it cannot be scored QUALIFIED again while
          blocked_lot_count is above zero. That ordering is what keeps the recovery path from deadlocking -
          unblocking is refused only while the supplier is still DISQUALIFIED, so the sequence must be
          requalify, then disposition each blocked lot by unblock or reject, then qualify. An implementation
          that puts the counter gate on requalify instead makes ComponentLot BLOCKED -> RELEASED unreachable.
        test_recipe:
          setup:
            - "Supplier Meridian Controls was QUALIFIED and its two lots GV-880 and GV-881 were both RELEASED."
            - "The supplier has since been disqualified, so it is DISQUALIFIED with blocked_lot_count 2."
            - "Both lots are BLOCKED with reject_reason_code SUPPLIER_DISQUALIFIED."
            - "The logical clock is at its default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /mfg/suppliers"
              payload: { name: "Meridian Controls", component_category: "GAS_VALVE", audit_score: 96, defect_ppm: 1000, open_capa_count: 0 }
              as: SupplierQualityManager
              captures: { s1_id: $.data.id }
            - call: "POST /mfg/suppliers/${s1_id}/qualify"
              payload: { audit_score: 96, defect_ppm: 1000, open_capa_count: 0, qualified_until: "2027-06-30T00:00:00Z" }
              as: SupplierQualityManager
            - call: "POST /mfg/component-lots"
              payload: { supplier_id: "${s1_id}", part_number: "GV-880", category: "GAS_VALVE", quantity: 50, certificate_of_conformance: true }
              as: SupplierQualityManager
              captures: { cl_gas_id: $.data.id }
            - call: "POST /mfg/component-lots/${cl_gas_id}/release"
              payload: {}
              as: QualityInspector
            - call: "POST /mfg/component-lots"
              payload: { supplier_id: "${s1_id}", part_number: "GV-881", category: "GAS_VALVE", quantity: 40, certificate_of_conformance: true }
              as: SupplierQualityManager
              captures: { cl_gas2_id: $.data.id }
            - call: "POST /mfg/component-lots/${cl_gas2_id}/release"
              payload: {}
              as: QualityInspector
            - call: "POST /mfg/suppliers/${s1_id}/disqualify"
              payload: { reason_code: "AUDIT_FAILURE" }
              as: SupplierQualityManager
          trigger:
            - call: "POST /mfg/component-lots/${cl_gas_id}/unblock"
              payload: {}
              as: SupplierQualityManager
            - call: "POST /mfg/suppliers/${s1_id}/requalify"
              payload: { reason_code: "CAPA_CLOSED" }
              as: SupplierQualityManager
            - call: "POST /mfg/suppliers/${s1_id}/qualify"
              payload: { audit_score: 96, defect_ppm: 1000, open_capa_count: 0, qualified_until: "2027-06-30T00:00:00Z" }
              as: SupplierQualityManager
            - call: "POST /mfg/component-lots/${cl_gas_id}/unblock"
              payload: {}
              as: SupplierQualityManager
            - call: "POST /mfg/suppliers/${s1_id}/qualify"
              payload: { audit_score: 96, defect_ppm: 1000, open_capa_count: 0, qualified_until: "2027-06-30T00:00:00Z" }
              as: SupplierQualityManager
            - call: "POST /mfg/component-lots/${cl_gas2_id}/reject"
              payload: { reason_code: "CONTAINMENT_SCRAP" }
              as: QualityInspector
            - call: "POST /mfg/suppliers/${s1_id}/qualify"
              payload: { audit_score: 96, defect_ppm: 1000, open_capa_count: 0, qualified_until: "2027-06-30T00:00:00Z" }
              as: SupplierQualityManager
          assert:
            - "the first unblock returns 409 with error_id == 'ERR_COMPONENT_SUPPLIER_NOT_QUALIFIED' and ComponentLot.${cl_gas_id}.status stays BLOCKED"
            - "the requalify returns 200: Supplier.${s1_id}.qualification_status == PENDING, qualification_score == null, disqualification_reason_code == null and blocked_lot_count is still 2"
            - "the first qualify returns 409 with error_id == 'ERR_BLOCKED_LOTS_REMAIN' and the supplier stays PENDING"
            - "the second unblock returns 200: ComponentLot.${cl_gas_id}.status == RELEASED with reject_reason_code == null, and Supplier.${s1_id}.blocked_lot_count == 1"
            - "the second qualify still returns 409 with error_id == 'ERR_BLOCKED_LOTS_REMAIN' (one contained lot is enough)"
            - "the reject returns 200: ComponentLot.${cl_gas2_id}.status == REJECTED with reject_reason_code == 'CONTAINMENT_SCRAP' overwriting SUPPLIER_DISQUALIFIED, and blocked_lot_count == 0"
            - "the final qualify returns 200 with qualification_score == 91.40 and qualification_status == QUALIFIED"
      - name: tank_lot_rework_cycle_returns_to_lined_state
        claim_type: cyclic_shape
        grounds:
          - state_machines.TankLot.LINING_REJECTED_to_RELINE_QUEUED
          - state_machines.TankLot.RELINE_QUEUED_to_LINED
        excluded_because:
          difficulty_instance: non_linear_state_machine / tank_lot_reline_cycle_returns_to_lined
          rationale: "The cyclic-shape claim is the whole subject of the named §1.8 instance, including the field vector that survives the loop."
      - name: product_model_two_state_dimensions_move_independently
        claim_type: parallel_shape
        grounds:
          - state_machines.ProductModel.note (parallel state dimensions)
        excluded_because:
          difficulty_instance: non_linear_state_machine / product_model_parallel_dimensions_independent
          rationale: "Independent movement of certification_status and release_status is asserted end to end by the named §1.8 instance."
      - name: supplier_disqualification_cascade_down_to_units_and_model
        claim_type: cascade_down
        grounds:
          - state_machines.Supplier.QUALIFIED_to_DISQUALIFIED
        excluded_because:
          difficulty_instance: transitive_cascade / supplier_disqualification_three_hop_to_model_restriction
          rationale: "Every hop and both negative controls of the disqualification cascade are asserted by the named §1.8 instance."
      - name: batch_quarantine_bubbles_up_from_repeat_lining_failures
        claim_type: bubble_up
        grounds:
          - state_machines.GlassLiningBatch.FIRED_to_QUARANTINED
        excluded_because:
          difficulty_instance: transitive_cascade / lining_fail_quarantine_cascades_sibling_lots
          rationale: "The threshold-crossing promotion of the batch and its lateral fan-out are asserted by the named §1.8 instance."
      - name: rework_reversal_compensates_every_rejection_side_effect
        claim_type: compensation
        grounds:
          - state_machines.TankLot.LINING_REJECTED_to_LINED
        excluded_because:
          difficulty_instance: compensating_invariant / rework_reversal_restores_tank_count_ledger
          rationale: "The named §1.8 instance asserts the full inverse of hops 1-2 including the batch counter."
      - name: payment_reversal_compensates_the_reserve_ledger
        claim_type: compensation
        grounds:
          - state_machines.WarrantyClaim.PAID_to_VALIDATED
        excluded_because:
          difficulty_instance: compensating_invariant / payment_reversal_restores_warranty_reserve_ledger
          rationale: "The named §1.8 instance asserts the credit-back and the frozen accrual."

  - section: calculations
    instances:
      - name: supplier_score_at_qualified_floor_and_one_cent_below
        claim_type: constants_applied
        grounds:
          - calculations.supplier_qualification_score
          - state_machines.Supplier.PENDING_to_QUALIFIED
          - state_machines.Supplier.PENDING_to_CONDITIONAL
          - endpoints[POST /mfg/suppliers/{id}/qualify]
        distinguishing_aspect: >
          The band is selected from the ROUNDED score, so 85.00 (exactly the floor) must land QUALIFIED while an
          input one ppm worse rounds to 84.99 and must land CONDITIONAL. An implementation that compares the
          unrounded weighted sum puts the second supplier at 84.993 - still below the floor, so it agrees here -
          but one that uses `>` instead of `>=` demotes the first supplier, and one that rounds the components
          instead of the total drifts on both.
        test_recipe:
          setup:
            - "Two suppliers exist in PENDING, neither qualified yet."
            - "Both are qualified with audit_score 90 and open_capa_count 1; they differ only by one part per million."
            - "The logical clock is 2026-08-01T00:00:00Z, well before the qualified_until of 2027-06-30T00:00:00Z."
          setup_api_calls:
            - call: "POST /mfg/suppliers"
              payload: { name: "Borderline Brass", component_category: "GAS_VALVE", audit_score: 90, defect_ppm: 1125, open_capa_count: 1 }
              as: SupplierQualityManager
              captures: { sa_id: $.data.id }
            - call: "POST /mfg/suppliers"
              payload: { name: "Borderline Bronze", component_category: "GAS_VALVE", audit_score: 90, defect_ppm: 1126, open_capa_count: 1 }
              as: SupplierQualityManager
              captures: { sb_id: $.data.id }
          trigger:
            - call: "POST /mfg/suppliers/${sa_id}/qualify"
              payload: { audit_score: 90, defect_ppm: 1125, open_capa_count: 1, qualified_until: "2027-06-30T00:00:00Z" }
              as: SupplierQualityManager
            - call: "POST /mfg/suppliers/${sb_id}/qualify"
              payload: { audit_score: 90, defect_ppm: 1126, open_capa_count: 1, qualified_until: "2027-06-30T00:00:00Z" }
              as: SupplierQualityManager
          assert:
            - "Supplier.${sa_id}.qualification_score == 85.00 and qualification_status == QUALIFIED (0.4*90 + 0.35*77.5 + 0.25*87.5 == 85.000)"
            - "Supplier.${sb_id}.qualification_score == 84.99 and qualification_status == CONDITIONAL (0.35*77.48 == 27.118, total 84.993 rounds to 84.99)"
            - "both scores carry exactly 2 decimal places"
            - "Supplier.${sa_id}.blocked_lot_count == 0 and rejected_lot_count == 0"
      - name: supplier_score_below_conditional_floor_is_rejected_with_clamped_components
        claim_type: correct_result
        grounds:
          - calculations.supplier_qualification_score
          - validations[priority 28]
          - errors[ERR_SUPPLIER_SCORE_BELOW_FLOOR]
          - state_machines.Supplier.initial_state
        distinguishing_aspect: >
          Both component clamps must fire: 4000 ppm leaves 20.0 and 3 CAPAs leave 62.5, giving 46.63 - but a
          perfect audit with 10000 ppm must NOT go negative, it must clamp the ppm component at 0 and score
          exactly 65.00, which is still under the 70.00 floor. An implementation without the max(0, ...) guards
          produces 39.63 and -30.00 respectively, and one that stores the score before checking the floor leaves
          a rejected supplier with a non-null qualification_score.
        test_recipe:
          setup:
            - "Two suppliers exist in PENDING with no qualification history."
            - "Neither qualify attempt can succeed: both scores are below the 70.00 CONDITIONAL floor."
            - "The logical clock is at its default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /mfg/suppliers"
              payload: { name: "Weak Works", component_category: "TP_RELIEF_VALVE", audit_score: 60, defect_ppm: 4000, open_capa_count: 3 }
              as: SupplierQualityManager
              captures: { sc_id: $.data.id }
            - call: "POST /mfg/suppliers"
              payload: { name: "Clamp Castings", component_category: "TP_RELIEF_VALVE", audit_score: 100, defect_ppm: 10000, open_capa_count: 0 }
              as: SupplierQualityManager
              captures: { sd_id: $.data.id }
          trigger:
            - call: "POST /mfg/suppliers/${sc_id}/qualify"
              payload: { audit_score: 60, defect_ppm: 4000, open_capa_count: 3, qualified_until: "2027-06-30T00:00:00Z" }
              as: SupplierQualityManager
            - call: "POST /mfg/suppliers/${sd_id}/qualify"
              payload: { audit_score: 100, defect_ppm: 10000, open_capa_count: 0, qualified_until: "2027-06-30T00:00:00Z" }
              as: SupplierQualityManager
          assert:
            - "both qualify calls return 422 with error_id == 'ERR_SUPPLIER_SCORE_BELOW_FLOOR'"
            - "the first response's error message reports the computed 46.63 (24.00 + 7.00 + 15.625 -> 46.625 -> 46.63)"
            - "the second response reports 65.00, proving the ppm component clamped at 0 rather than going to -100"
            - "Supplier.${sc_id}.qualification_status is still PENDING with qualification_score == null and qualified_until == null"
            - "Supplier.${sd_id}.qualification_status is still PENDING with qualification_score == null"
            - "neither supplier's version changed (the refused qualify wrote nothing)"
      - name: warranty_payout_rounds_each_line_before_summing
        claim_type: precision
        grounds:
          - calculations.warranty_payout_proration
          - calculations.unit_months_in_service
          - validations[priority 29]
          - errors[ERR_WARRANTY_COVERAGE_EXPIRED]
        distinguishing_aspect: >
          The half-cent trap: at coverage 0.50 the labour and freight allowances each end in .5 cents, so
          rounding per line and then summing gives 28676 while summing first and prorating once gives 28675.
          The tier boundaries are walked at m == 72 (full), m == 73 (half) and m == 97 (expired), and
          months_in_service_at_report is frozen per claim - the claim filed at m == 72 must keep coverage 1.00
          even though the clock has since advanced past 97 months.
        test_recipe:
          setup:
            - "Unit u1 is a GAS 50-gallon unit shipped at 2026-08-05T06:00:00Z with hardness 12.0 gpg."
            - "Three TANK_LEAK claims are filed against it at three different logical-clock instants."
            - "TANK_FULL_COVERAGE_MONTHS is 72 and TANK_HALF_COVERAGE_MONTHS is 96."
            - "The model's warranty reserve is not consulted at validation, only at payment."
