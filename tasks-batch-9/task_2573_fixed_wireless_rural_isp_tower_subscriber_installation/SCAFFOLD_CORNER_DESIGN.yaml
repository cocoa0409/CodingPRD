      - name: resurvey_request_at_the_loop_bound_returns_resurvey_limit_reached
        claim_type: precondition_enforcement
        grounds:
          - state_machines.InstallWorkOrder.EXCEPTION_PENDING_to_RESURVEY_REQUIRED
          - state_machines.InstallWorkOrder.RESURVEY_REQUIRED_to_SCHEDULED
          - errors[ERR_RESURVEY_LIMIT_REACHED]
        distinguishing_aspect: |
          The SCHEDULED -> EXCEPTION_PENDING -> RESURVEY_REQUIRED -> SCHEDULED loop is bounded by
          MAX_RESURVEYS = 2 with a STRICT less-than guard: once resurvey_count has reached 2 a third
          REQUEST_RESURVEY returns 409 ERR_RESURVEY_LIMIT_REACHED, the work order stays in
          EXCEPTION_PENDING (it is not pushed to SURVEY_FAILED), and resurvey_count stays 2.
