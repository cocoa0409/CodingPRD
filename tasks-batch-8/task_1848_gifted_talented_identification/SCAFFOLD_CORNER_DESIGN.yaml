            - { call: "POST /gifted/screening-cycles/${cyc}/advance", payload: { target_state: "OPEN" }, as: GiftedCoordinator }
            - { call: "POST /gifted/students", payload: { student_number: "ST-1", legal_name: "Stu One", grade_level: 3, school_site_id: "${site_id}", demographic_group: "WHITE", primary_guardian_user_id: "guard-1" }, as: GiftedCoordinator, captures: { stu: $.data.id, gs0: $.data.gifted_status } }
          trigger:
            - { call: "POST /gifted/cases", payload: { student_id: "${stu}", cycle_id: "${cyc}", pathway: "TRANSFER_HONOR", external_district_name: "ExtDist", external_identified_on: "2026-03-01" }, as: GiftedCoordinator, captures: { case_id: $.data.id } }
            - { call: "POST /gifted/cases/${case_id}/placements", payload: { site_id: "${site_id}", service_model: "PULL_OUT", start_on: "2026-09-01" }, as: GiftedCoordinator, captures: { plc: $.data.id } }
