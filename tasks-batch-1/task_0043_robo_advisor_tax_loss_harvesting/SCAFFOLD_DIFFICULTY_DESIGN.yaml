  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: wash_sale_window_inclusive_30day_boundary
        grounds:
          - calculations.wash_sale_disallowance
          - entities.TaxLot.fields.acquired_at
          - entities.TaxLot.fields.wash_sale_disallowed_cents
        distinguishing_aspect: |
          On TaxLot, the wash-sale interval [disposed_at - 30d, disposed_at + 30d] is INCLUSIVE: a
          replacement purchase of the same security exactly 30 days before disposal falls INSIDE
          and disallows the loss, whereas 31 days before is OUTSIDE and the loss is fully allowed.
        test_recipe:
          setup:
            - "Source loss lot in security A (5sh/60000) disposed on 2026-04-30."
            - "A 5sh in-window purchase of A made exactly 30 days earlier (2026-03-31) — inside the inclusive window."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-31T00:00:00.000Z" }
              as: Advisor
