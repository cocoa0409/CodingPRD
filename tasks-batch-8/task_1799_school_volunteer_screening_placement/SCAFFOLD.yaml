scenario: |
  School Volunteer Screening & Placement (district volunteer office): application &
  background check level by contact type, clearance expiration & re-screening cycle,
  training/orientation completion, opportunity matching & hour logging,
  restricted-role determination from screening results, campus check-in & badge
  issuance, recognition & retention program, incident reporting & volunteer removal

domain_name: school-volunteer-screening
api_prefix: /

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: access_control_matrix
  complexity_layers:
    - cascading_side_effects
    - rate_threshold_triggers
    - derived_field_reconciliation
    - selector_policy
    - optimistic_concurrency
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: hierarchical_override
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table (flat topology; all linkage via FK fields)
# =============================================================================
entities:
  - name: Campus
    parent: null
    common_fields: false   # configuration entity: id + created_at only
    fields:
      - { name: name, type: string, source: input, description: "Display name of the school campus" }
      - { name: campus_code, type: string, source: input, description: "Unique district campus code", constraints: "unique across all Campuses; immutable after creation" }
      - { name: badge_prefix, type: string, source: input, description: "Prefix used when minting daily badge codes (e.g. LNC -> LNC-0001)", constraints: "1-8 uppercase alphanumeric characters" }

  - name: Volunteer
    parent: null
    common_fields: true    # id, created_at, updated_at, version (OCC parent)
    fields:
      - { name: full_name, type: string, source: input, description: "Volunteer's legal full name" }
      - { name: email, type: string, source: input, description: "Contact email", constraints: "unique across all Volunteers (any status)" }
      - { name: contact_type, type: enum, source: input, description: "Intended student contact intensity: SUPERVISED | UNSUPERVISED; immutable after creation", constraints: "enum {SUPERVISED, UNSUPERVISED}" }
      - { name: status, type: enum, source: system, description: "APPLIED | UNDER_SCREENING | CLEARANCE_GRANTED | ACTIVE | RESCREEN_REQUIRED | SUSPENDED | DENIED | REMOVED (see §1.2)" }
      - { name: required_check_level, type: enum, source: computed, description: "Minimum background check level implied by contact_type: SUPERVISED->BASIC, UNSUPERVISED->ENHANCED (calculations.required_clearance_level)" }
      - { name: restriction_flags, type: array, source: system, description: "Sorted array of restriction enums derived from the latest adjudicated BackgroundCheck via calculations.screening_decision_matrix; subset of {NO_TRANSPORT, NO_ONE_ON_ONE}; empty array when findings NONE", default: "[]" }
      - { name: clearance_expires_at, type: datetime, source: computed, description: "expires_at of the latest-decided BackgroundCheck with status in {CLEARED, CLEARED_WITH_FLAGS}; null when no cleared check exists. Selection: max decided_at, tie-break created_at DESC", default: null }
      - { name: total_verified_hours, type: number, source: computed, description: "Sum of hours over this volunteer's HourEntries with status == VERIFIED (calculations.volunteer_service_hours, verified variant)", default: 0 }
      - { name: total_provisional_hours, type: number, source: computed, description: "Sum of hours over this volunteer's HourEntries with status in {PENDING, VERIFIED} (calculations.volunteer_service_hours, provisional variant)", default: 0 }
      - { name: recognition_points, type: number, source: computed, description: "Sum of per-entry points over VERIFIED HourEntries, per-entry rounding before summation (calculations.recognition_points)", default: 0 }
      - { name: recognition_tier, type: enum, source: computed, description: "NONE | BRONZE | SILVER | GOLD from total_verified_hours via calculations.recognition_tier", default: "NONE" }
      - { name: prior_status, type: enum, source: system, description: "Volunteer.status recorded at the moment of suspension; null unless status == SUSPENDED; used for reinstatement", default: null }
      - { name: suspension_incident_id, type: string, source: system, description: "id of the IncidentReport whose filing caused the current suspension; null unless status == SUSPENDED", default: null }

  - name: BackgroundCheck
    parent: null
    common_fields: true
    fields:
      - { name: volunteer_id, type: string, source: input, description: "FK -> Volunteer.id; the volunteer being screened" }
      - { name: level, type: enum, source: input, description: "Screening depth purchased: BASIC | ENHANCED", constraints: "enum {BASIC, ENHANCED}" }
      - { name: status, type: enum, source: system, description: "PENDING | CLEARED | CLEARED_WITH_FLAGS | DENIED | EXPIRED (see §1.2)" }
      - { name: findings, type: enum, source: system, description: "Adjudication finding recorded by POST /background-checks/{id}/adjudicate: NONE | MINOR | DISQUALIFYING; null while PENDING", default: null }
      - { name: decided_at, type: datetime, source: system, description: "Logical-clock timestamp of adjudication; null while PENDING", default: null }
      - { name: expires_at, type: datetime, source: computed, description: "decided_at + VALIDITY_DAYS[level] (calculations.clearance_validity_window); null while PENDING or DENIED", default: null }

  - name: TrainingModule
    parent: null
    common_fields: false   # configuration entity: id + created_at only
    fields:
      - { name: module_code, type: string, source: input, description: "Unique module code (e.g. ORIENT)", constraints: "unique across all TrainingModules" }
      - { name: title, type: string, source: input, description: "Human-readable module title" }
      - { name: required_contact_types, type: array, source: input, description: "Array of contact_type enums that must complete this module; subset of {SUPERVISED, UNSUPERVISED}; must be non-empty" }
      - { name: validity_days, type: integer, source: input, description: "Days a completion remains valid; null means the completion never expires", default: null, constraints: "null or integer >= 1" }

  - name: TrainingRecord
    parent: null
    common_fields: false   # append-only event: id + created_at only
    fields:
      - { name: volunteer_id, type: string, source: input, description: "FK -> Volunteer.id; the volunteer who completed the module" }
      - { name: module_id, type: string, source: input, description: "FK -> TrainingModule.id; the completed module" }
      - { name: completed_at, type: datetime, source: input, description: "When the volunteer completed the module (ISO8601)" }
      - { name: expires_at, type: datetime, source: computed, description: "completed_at + module.validity_days; null when module.validity_days is null" }

  - name: Opportunity
    parent: null
    common_fields: true
    fields:
      - { name: campus_id, type: string, source: input, description: "FK -> Campus.id; hosting campus" }
      - { name: title, type: string, source: input, description: "Opportunity title" }
      - { name: description, type: string, source: input, description: "Free-text description", default: "" }
      - { name: required_contact_type, type: enum, source: input, description: "Contact intensity of the role: SUPERVISED | UNSUPERVISED; drives the minimum clearance level required to confirm", constraints: "enum {SUPERVISED, UNSUPERVISED}" }
      - { name: restricted_category, type: enum, source: input, description: "Role category gated by screening restrictions: NONE | TRANSPORT | ONE_ON_ONE. TRANSPORT blocked by flag NO_TRANSPORT; ONE_ON_ONE blocked by flag NO_ONE_ON_ONE", constraints: "enum {NONE, TRANSPORT, ONE_ON_ONE}" }
      - { name: capacity, type: integer, source: input, description: "Maximum number of CONFIRMED placements", constraints: "integer >= 1" }
      - { name: starts_at, type: datetime, source: input, description: "Window start (ISO8601); must be strictly before ends_at" }
      - { name: ends_at, type: datetime, source: input, description: "Window end (ISO8601)" }
      - { name: status, type: enum, source: system, description: "DRAFT | OPEN | COMPLETED | CANCELLED (see §1.2)" }
      - { name: committed_count, type: integer, source: computed, description: "Count of this opportunity's Placements with status == CONFIRMED (calculations.opportunity_fill, committed variant)", default: 0 }
      - { name: projected_count, type: integer, source: computed, description: "Count of this opportunity's Placements with status in {REQUESTED, CONFIRMED} (calculations.opportunity_fill, projected variant)", default: 0 }

  - name: Placement
    parent: null
    common_fields: true
    fields:
      - { name: opportunity_id, type: string, source: input, description: "FK -> Opportunity.id; the opportunity being filled" }
      - { name: volunteer_id, type: string, source: input, description: "FK -> Volunteer.id; the placed volunteer. When caller role is Volunteer the value is forced to the caller's X-User-ID" }
      - { name: status, type: enum, source: system, description: "REQUESTED | CONFIRMED | CANCELLED | COMPLETED (see §1.2)" }
      - { name: confirmed_at, type: datetime, source: system, description: "Logical-clock timestamp of confirmation; null until CONFIRMED", default: null }
      - { name: cancel_reason, type: enum, source: system, description: "VOLUNTEER_WITHDRAW | ADMIN_CANCEL | SYSTEM_SUSPENSION | SYSTEM_RESTRICTION | SYSTEM_REMOVAL | OPPORTUNITY_CANCELLED; null unless status == CANCELLED", default: null }

  - name: HourEntry
    parent: null
    common_fields: true
    fields:
      - { name: placement_id, type: string, source: input, description: "FK -> Placement.id; the placement the hours were worked under" }
      - { name: volunteer_id, type: string, source: system, description: "FK -> Volunteer.id; copied from the placement's volunteer_id at creation" }
      - { name: worked_date, type: string, source: input, description: "Calendar date the hours were worked, YYYY-MM-DD" }
      - { name: hours, type: number, source: input, description: "Hours worked", constraints: "0 < hours <= 12, at most 2 decimal places" }
      - { name: activity_category, type: enum, source: input, description: "STANDARD | TUTORING | MENTORING; drives the recognition-points multiplier", constraints: "enum {STANDARD, TUTORING, MENTORING}" }
      - { name: status, type: enum, source: system, description: "PENDING | VERIFIED | REJECTED | REVOKED (see §1.2)" }
      - { name: points, type: number, source: computed, description: "round_half_up(hours * multiplier[activity_category], 1 decimal) computed at creation; counted toward Volunteer.recognition_points only while status == VERIFIED (calculations.recognition_points)" }

  - name: VisitCheckIn
    parent: null
    common_fields: true
    fields:
      - { name: campus_id, type: string, source: input, description: "FK -> Campus.id; the campus being entered" }
      - { name: volunteer_id, type: string, source: system, description: "FK -> Volunteer.id; when caller role is Volunteer forced to caller's X-User-ID; required in payload when caller is CampusAdmin or DistrictCoordinator" }
      - { name: placement_id, type: string, source: input, description: "FK -> Placement.id; optional link to the placement being served; null for walk-in visits", default: null }
      - { name: checked_in_at, type: datetime, source: system, description: "Logical-clock timestamp of check-in" }
      - { name: checked_out_at, type: datetime, source: system, description: "Logical-clock timestamp of check-out; null while OPEN", default: null }
      - { name: status, type: enum, source: system, description: "OPEN | CLOSED (see §1.2)" }
      - { name: badge_code, type: string, source: computed, description: "campus.badge_prefix + '-' + zero-padded per-campus-per-UTC-day sequence (calculations.badge_code_assignment)" }
      - { name: close_reason, type: enum, source: system, description: "SELF | ADMIN | SYSTEM_SUSPENSION | SYSTEM_REMOVAL; null while OPEN", default: null }

  - name: IncidentReport
    parent: null
    common_fields: true
    fields:
      - { name: volunteer_id, type: string, source: input, description: "FK -> Volunteer.id; the volunteer the report concerns" }
      - { name: placement_id, type: string, source: input, description: "FK -> Placement.id; optional placement context", default: null }
      - { name: severity, type: enum, source: input, description: "LOW | MEDIUM | HIGH. Filing a HIGH report auto-suspends the volunteer", constraints: "enum {LOW, MEDIUM, HIGH}" }
      - { name: description, type: string, source: input, description: "Free-text incident narrative" }
      - { name: status, type: enum, source: system, description: "OPEN | SUBSTANTIATED | UNFOUNDED (see §1.2)" }

  - name: RecognitionAward
    parent: null
    common_fields: false   # append-only event: id + created_at only
    fields:
      - { name: volunteer_id, type: string, source: system, description: "FK -> Volunteer.id; award recipient (payload input on manual creation)" }
      - { name: tier, type: enum, source: input, description: "BRONZE | SILVER | GOLD", constraints: "enum {BRONZE, SILVER, GOLD}; at most one award per tier per volunteer" }
      - { name: source, type: enum, source: system, description: "AUTO (tier threshold crossed) | MANUAL (coordinator grant)" }
      - { name: note, type: string, source: input, description: "Optional citation text for manual awards", default: "" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Volunteer
    initial_state: APPLIED
    terminal_states: [DENIED, REMOVED]
    transitions:
      - from: APPLIED
        to: UNDER_SCREENING
        trigger: "POST /background-checks (first check for the volunteer)"
        actor: DistrictCoordinator
        preconditions:
          - "volunteer.status == APPLIED"
          - "no BackgroundCheck with status == PENDING exists for the volunteer (ERR_CHECK_ALREADY_PENDING)"
        side_effects:
          - "creates BackgroundCheck in PENDING"
          - "increments Volunteer.version by 1"
      - from: UNDER_SCREENING
        to: ACTIVE
        trigger: "POST /background-checks/{id}/adjudicate"
        actor: DistrictCoordinator
        preconditions:
          - "check.status == PENDING"
          - "screening_decision_matrix yields CLEARED or CLEARED_WITH_FLAGS with check.level adequate for volunteer.required_check_level"
          - "all required TrainingModules have a valid TrainingRecord (calculations.training_compliance_check)"
        side_effects:
          - "Volunteer.clearance_expires_at recomputed"
          - "Volunteer.restriction_flags overwritten from decision matrix"
          - "increments Volunteer.version by 1"
      - from: UNDER_SCREENING
        to: CLEARANCE_GRANTED
        trigger: "POST /background-checks/{id}/adjudicate"
        actor: DistrictCoordinator
        preconditions:
          - "check.status == PENDING"
          - "screening_decision_matrix yields CLEARED or CLEARED_WITH_FLAGS with adequate level"
          - "training compliance NOT yet complete"
        side_effects:
          - "Volunteer.clearance_expires_at recomputed"
          - "Volunteer.restriction_flags overwritten from decision matrix"
          - "increments Volunteer.version by 1"
      - from: UNDER_SCREENING
        to: DENIED
        trigger: "POST /background-checks/{id}/adjudicate"
        actor: DistrictCoordinator
        preconditions:
          - "check.status == PENDING"
          - "screening_decision_matrix yields DENIED (findings == DISQUALIFYING)"
        side_effects:
          - "cascade: volunteer's Placements in {REQUESTED, CONFIRMED} -> CANCELLED with cancel_reason SYSTEM_REMOVAL"
          - "each cancelled CONFIRMED placement recomputes its Opportunity.committed_count / projected_count (calculations.opportunity_fill)"
          - "volunteer's OPEN VisitCheckIns -> CLOSED with close_reason SYSTEM_REMOVAL"
          - "increments Volunteer.version by 1"
      - from: CLEARANCE_GRANTED
        to: ACTIVE
        trigger: "POST /training-records (auto-transition when the new record completes training compliance)"
        actor: system
        preconditions:
          - "volunteer.status == CLEARANCE_GRANTED"
          - "after inserting the record, calculations.training_compliance_check == true"
        side_effects:
          - "increments Volunteer.version by 1"
      - from: CLEARANCE_GRANTED
        to: SUSPENDED
        trigger: "POST /incident-reports with severity == HIGH"
        actor: CampusAdmin | DistrictCoordinator
        preconditions: ["volunteer.status == CLEARANCE_GRANTED"]
        side_effects:
          - "Volunteer.prior_status <- CLEARANCE_GRANTED; suspension_incident_id <- new incident id"
          - "cascade: volunteer's Placements in {CONFIRMED} -> CANCELLED with cancel_reason SYSTEM_SUSPENSION"
          - "each cancelled placement recomputes its Opportunity.committed_count / projected_count"
          - "volunteer's OPEN VisitCheckIns -> CLOSED with close_reason SYSTEM_SUSPENSION"
          - "increments Volunteer.version by 1"
      - from: ACTIVE
        to: RESCREEN_REQUIRED
        trigger: "POST /_clock/set_current_utc sweep: volunteer.clearance_expires_at recomputed as null or <= new now"
        actor: system
        preconditions:
          - "volunteer.status == ACTIVE"
          - "after the sweep expires BackgroundChecks, volunteer.clearance_expires_at is null or <= now"
        side_effects:
          - "increments Volunteer.version by 1"
      - from: RESCREEN_REQUIRED
        to: ACTIVE
        trigger: "POST /background-checks/{id}/adjudicate"
        actor: DistrictCoordinator
        preconditions:
          - "check.status == PENDING and check.level adequate"
          - "training compliance complete at adjudication time"
        side_effects:
          - "Volunteer.clearance_expires_at recomputed; restriction_flags overwritten"
          - "increments Volunteer.version by 1"
      - from: RESCREEN_REQUIRED
        to: CLEARANCE_GRANTED
        trigger: "POST /background-checks/{id}/adjudicate"
        actor: DistrictCoordinator
        preconditions:
          - "check.status == PENDING and check.level adequate"
          - "training compliance NOT complete"
        side_effects:
          - "Volunteer.clearance_expires_at recomputed; restriction_flags overwritten"
          - "increments Volunteer.version by 1"
      - from: RESCREEN_REQUIRED
        to: DENIED
        trigger: "POST /background-checks/{id}/adjudicate"
        actor: DistrictCoordinator
        preconditions:
          - "check.status == PENDING"
          - "findings == DISQUALIFYING"
        side_effects:
          - "cascade: Placements in {REQUESTED, CONFIRMED} -> CANCELLED (SYSTEM_REMOVAL); Opportunity counts recomputed; OPEN VisitCheckIns -> CLOSED (SYSTEM_REMOVAL)"
          - "increments Volunteer.version by 1"
      - from: RESCREEN_REQUIRED
        to: SUSPENDED
        trigger: "POST /incident-reports with severity == HIGH"
        actor: CampusAdmin | DistrictCoordinator
        preconditions: ["volunteer.status == RESCREEN_REQUIRED"]
        side_effects:
          - "prior_status <- RESCREEN_REQUIRED; suspension_incident_id <- incident id"
          - "cascade: CONFIRMED Placements -> CANCELLED (SYSTEM_SUSPENSION); Opportunity counts recomputed; OPEN VisitCheckIns -> CLOSED (SYSTEM_SUSPENSION)"
          - "increments Volunteer.version by 1"
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /incident-reports with severity == HIGH"
        actor: CampusAdmin | DistrictCoordinator
        preconditions: ["volunteer.status == ACTIVE"]
        side_effects:
          - "prior_status <- ACTIVE; suspension_incident_id <- incident id"
          - "cascade: CONFIRMED Placements -> CANCELLED (SYSTEM_SUSPENSION); each cancellation recomputes its Opportunity.committed_count / projected_count"
          - "volunteer's OPEN VisitCheckIns -> CLOSED with close_reason SYSTEM_SUSPENSION"
          - "increments Volunteer.version by 1"
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /background-checks/{id}/adjudicate (early re-screen while still ACTIVE)"
        actor: DistrictCoordinator
        preconditions:
          - "check.status == PENDING"
          - "decision not DENIED"
        side_effects:
          - "Volunteer.clearance_expires_at recomputed; restriction_flags overwritten from latest decision"
          - "if new restriction_flags block the restricted_category of any CONFIRMED placement's opportunity, those placements -> CANCELLED with cancel_reason SYSTEM_RESTRICTION and their Opportunity counts recomputed"
          - "increments Volunteer.version by 1"
        note: "Self-loop: state unchanged but version/flags/expiry mutate"
      - from: ACTIVE
        to: DENIED
        trigger: "POST /background-checks/{id}/adjudicate with findings == DISQUALIFYING"
        actor: DistrictCoordinator
        preconditions: ["check.status == PENDING"]
        side_effects:
          - "cascade: Placements in {REQUESTED, CONFIRMED} -> CANCELLED (SYSTEM_REMOVAL); Opportunity counts recomputed; OPEN VisitCheckIns -> CLOSED (SYSTEM_REMOVAL)"
          - "increments Volunteer.version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /incident-reports/{id}/adjudicate with outcome == UNFOUNDED"
        actor: DistrictCoordinator
        preconditions:
          - "incident.status == OPEN"
          - "volunteer.suspension_incident_id == this incident id"
          - "prior_status was ACTIVE and clearance_expires_at > now"
        side_effects:
          - "prior_status <- null; suspension_incident_id <- null"
          - "increments Volunteer.version by 1"
      - from: SUSPENDED
        to: RESCREEN_REQUIRED
        trigger: "POST /incident-reports/{id}/adjudicate with outcome == UNFOUNDED"
        actor: DistrictCoordinator
        preconditions:
          - "incident.status == OPEN"
          - "volunteer.suspension_incident_id == this incident id"
          - "prior_status was ACTIVE and (clearance_expires_at is null or <= now)"
        side_effects:
          - "prior_status <- null; suspension_incident_id <- null"
          - "increments Volunteer.version by 1"
      - from: SUSPENDED
        to: CLEARANCE_GRANTED
        trigger: "POST /incident-reports/{id}/adjudicate with outcome == UNFOUNDED"
        actor: DistrictCoordinator
        preconditions:
          - "incident.status == OPEN"
          - "volunteer.suspension_incident_id == this incident id"
          - "prior_status was CLEARANCE_GRANTED"
        side_effects:
          - "prior_status <- null; suspension_incident_id <- null"
          - "increments Volunteer.version by 1"
      - from: SUSPENDED
        to: REMOVED
        trigger: "POST /incident-reports/{id}/adjudicate with outcome == SUBSTANTIATED"
        actor: DistrictCoordinator
        preconditions: ["incident.status == OPEN"]
        side_effects:
          - "cascade: Placements in {REQUESTED, CONFIRMED} -> CANCELLED (SYSTEM_REMOVAL); Opportunity counts recomputed; OPEN VisitCheckIns -> CLOSED (SYSTEM_REMOVAL)"
          - "prior_status <- null; suspension_incident_id <- null"
          - "increments Volunteer.version by 1"
      - from: ACTIVE
        to: REMOVED
        trigger: "POST /incident-reports/{id}/adjudicate with outcome == SUBSTANTIATED (incident filed with LOW/MEDIUM severity never auto-suspended)"
        actor: DistrictCoordinator
        preconditions: ["incident.status == OPEN"]
        side_effects:
          - "cascade: Placements in {REQUESTED, CONFIRMED} -> CANCELLED (SYSTEM_REMOVAL); Opportunity counts recomputed; OPEN VisitCheckIns -> CLOSED (SYSTEM_REMOVAL)"
          - "increments Volunteer.version by 1"
      - from: RESCREEN_REQUIRED
        to: REMOVED
        trigger: "POST /incident-reports/{id}/adjudicate with outcome == SUBSTANTIATED"
        actor: DistrictCoordinator
        preconditions: ["incident.status == OPEN"]
        side_effects:
          - "cascade: Placements in {REQUESTED, CONFIRMED} -> CANCELLED (SYSTEM_REMOVAL); Opportunity counts recomputed; OPEN VisitCheckIns -> CLOSED (SYSTEM_REMOVAL)"
          - "increments Volunteer.version by 1"
      - from: CLEARANCE_GRANTED
        to: REMOVED
        trigger: "POST /incident-reports/{id}/adjudicate with outcome == SUBSTANTIATED"
        actor: DistrictCoordinator
        preconditions: ["incident.status == OPEN"]
        side_effects:
          - "cascade: Placements in {REQUESTED, CONFIRMED} -> CANCELLED (SYSTEM_REMOVAL); Opportunity counts recomputed; OPEN VisitCheckIns -> CLOSED (SYSTEM_REMOVAL)"
          - "increments Volunteer.version by 1"

  - entity: BackgroundCheck
    initial_state: PENDING
    terminal_states: [DENIED, EXPIRED]
    transitions:
      - from: PENDING
        to: CLEARED
        trigger: "POST /background-checks/{id}/adjudicate"
        actor: DistrictCoordinator
        preconditions: ["check.status == PENDING", "findings == NONE"]
        side_effects:
          - "decided_at <- now; expires_at <- decided_at + VALIDITY_DAYS[level]"
          - "volunteer transition per Volunteer machine (UNDER_SCREENING/RESCREEN_REQUIRED/ACTIVE branches)"
          - "increments BackgroundCheck.version by 1"
      - from: PENDING
        to: CLEARED_WITH_FLAGS
        trigger: "POST /background-checks/{id}/adjudicate"
        actor: DistrictCoordinator
        preconditions: ["check.status == PENDING", "findings == MINOR"]
        side_effects:
          - "decided_at <- now; expires_at <- decided_at + VALIDITY_DAYS[level]"
          - "volunteer transition per Volunteer machine; restriction_flags written from decision matrix"
          - "increments BackgroundCheck.version by 1"
      - from: PENDING
        to: DENIED
        trigger: "POST /background-checks/{id}/adjudicate"
        actor: DistrictCoordinator
        preconditions: ["check.status == PENDING", "findings == DISQUALIFYING"]
        side_effects:
          - "decided_at <- now; expires_at stays null"
          - "volunteer -> DENIED cascade per Volunteer machine"
          - "increments BackgroundCheck.version by 1"
      - from: CLEARED
        to: EXPIRED
        trigger: "POST /_clock/set_current_utc sweep when expires_at <= new now"
        actor: system
        preconditions: ["check.status == CLEARED", "expires_at <= now"]
        side_effects:
          - "each affected volunteer's clearance_expires_at recomputed; volunteers left without valid clearance move ACTIVE -> RESCREEN_REQUIRED"
      - from: CLEARED_WITH_FLAGS
        to: EXPIRED
        trigger: "POST /_clock/set_current_utc sweep when expires_at <= new now"
        actor: system
        preconditions: ["check.status == CLEARED_WITH_FLAGS", "expires_at <= now"]
        side_effects:
          - "each affected volunteer's clearance_expires_at recomputed; volunteers left without valid clearance move ACTIVE -> RESCREEN_REQUIRED"

  - entity: Opportunity
    initial_state: DRAFT
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: DRAFT
        to: OPEN
        trigger: "POST /opportunities/{id}/publish"
        actor: CampusAdmin | DistrictCoordinator
        preconditions:
          - "opportunity.status == DRAFT (ERR_OPPORTUNITY_INVALID_STATE)"
          - "opportunity.starts_at > now (ERR_OPPORTUNITY_WINDOW_PASSED)"
        side_effects: ["increments Opportunity.version by 1"]
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /opportunities/{id}/cancel"
        actor: CampusAdmin | DistrictCoordinator
        preconditions: ["opportunity.status in {DRAFT, OPEN}"]
        side_effects:
          - "cascade: Placements in {REQUESTED, CONFIRMED} -> CANCELLED with cancel_reason OPPORTUNITY_CANCELLED"
          - "increments Opportunity.version by 1"
      - from: OPEN
        to: CANCELLED
        trigger: "POST /opportunities/{id}/cancel"
        actor: CampusAdmin | DistrictCoordinator
        preconditions: ["opportunity.status in {DRAFT, OPEN}"]
        side_effects:
          - "cascade: Placements in {REQUESTED, CONFIRMED} -> CANCELLED with cancel_reason OPPORTUNITY_CANCELLED; counts recomputed"
          - "increments Opportunity.version by 1"
      - from: OPEN
        to: COMPLETED
        trigger: "POST /_clock/set_current_utc sweep when ends_at <= new now"
        actor: system
        preconditions: ["opportunity.status == OPEN", "ends_at <= now"]
        side_effects: []

  - entity: Placement
    initial_state: REQUESTED
    terminal_states: [CANCELLED, COMPLETED]
    transitions:
      - from: REQUESTED
        to: CONFIRMED
        trigger: "POST /placements/{id}/confirm"
        actor: CampusAdmin | DistrictCoordinator
        preconditions:
          - "placement.status == REQUESTED (ERR_PLACEMENT_INVALID_STATE)"
          - "opportunity.status == OPEN (ERR_OPPORTUNITY_INVALID_STATE)"
          - "volunteer.status == ACTIVE (ERR_VOLUNTEER_INVALID_STATE)"
          - "volunteer clearance level adequate for opportunity.required_contact_type (ERR_CLEARANCE_LEVEL_INSUFFICIENT)"
          - "no restriction_flags block opportunity.restricted_category (ERR_RESTRICTED_ROLE)"
          - "training compliance complete at confirm time (ERR_TRAINING_INCOMPLETE)"
          - "no half-open-window overlap with the volunteer's other CONFIRMED placements (ERR_PLACEMENT_TIME_CONFLICT)"
          - "opportunity.committed_count < capacity (ERR_OPPORTUNITY_FULL)"
        side_effects:
          - "confirmed_at <- now"
          - "Opportunity.committed_count and projected_count recomputed (calculations.opportunity_fill)"
          - "increments Placement.version by 1"
      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /placements/{id}/cancel"
        actor: Volunteer (own) | CampusAdmin | DistrictCoordinator
        preconditions: ["placement.status in {REQUESTED, CONFIRMED}"]
        side_effects:
          - "cancel_reason <- VOLUNTEER_WITHDRAW when caller is the owning Volunteer, else ADMIN_CANCEL"
          - "Opportunity counts recomputed"
          - "increments Placement.version by 1"
      - from: CONFIRMED
        to: CANCELLED
        trigger: "POST /placements/{id}/cancel"
        actor: Volunteer (own) | CampusAdmin | DistrictCoordinator
        preconditions: ["placement.status in {REQUESTED, CONFIRMED}"]
        side_effects:
          - "cancel_reason <- VOLUNTEER_WITHDRAW | ADMIN_CANCEL as above"
          - "Opportunity.committed_count and projected_count recomputed (seat released; calculations.opportunity_fill)"
          - "increments Placement.version by 1"
      - from: CONFIRMED
        to: COMPLETED
        trigger: "POST /placements/{id}/complete"
        actor: CampusAdmin | DistrictCoordinator
        preconditions:
          - "placement.status == CONFIRMED (ERR_PLACEMENT_INVALID_STATE)"
          - "now >= opportunity.ends_at (ERR_PLACEMENT_WINDOW_OPEN)"
          - "at least one VisitCheckIn with placement_id == this placement and status == CLOSED exists (ERR_NO_CHECKIN_FOR_PLACEMENT)"
        side_effects:
          - "Opportunity counts recomputed (placement leaves CONFIRMED set)"
          - "increments Placement.version by 1"

  - entity: HourEntry
    initial_state: PENDING
    terminal_states: [REJECTED, REVOKED]
    transitions:
      - from: PENDING
        to: VERIFIED
        trigger: "POST /hour-entries/{id}/verify"
        actor: CampusAdmin | DistrictCoordinator
        preconditions: ["entry.status == PENDING (ERR_HOUR_ENTRY_INVALID_STATE)"]
        side_effects:
          - "Volunteer.total_verified_hours / total_provisional_hours recomputed (calculations.volunteer_service_hours)"
          - "Volunteer.recognition_points recomputed (calculations.recognition_points)"
          - "Volunteer.recognition_tier recomputed (calculations.recognition_tier); on tier increase, auto-create RecognitionAward with source AUTO for the new tier when none exists"
          - "increments HourEntry.version by 1 and Volunteer.version by 1"
      - from: PENDING
        to: REJECTED
        trigger: "POST /hour-entries/{id}/reject"
        actor: CampusAdmin | DistrictCoordinator
        preconditions: ["entry.status == PENDING (ERR_HOUR_ENTRY_INVALID_STATE)"]
        side_effects:
          - "Volunteer.total_provisional_hours recomputed (entry leaves the provisional set)"
          - "increments HourEntry.version by 1 and Volunteer.version by 1"
      - from: VERIFIED
        to: REVOKED
        trigger: "POST /hour-entries/{id}/revoke"
        actor: DistrictCoordinator
        preconditions: ["entry.status == VERIFIED (ERR_HOUR_ENTRY_INVALID_STATE)"]
        side_effects:
          - "Volunteer.total_verified_hours / total_provisional_hours / recognition_points recomputed (compensation of verify)"
          - "Volunteer.recognition_tier recomputed (may downgrade); existing RecognitionAwards are never retracted"
          - "increments HourEntry.version by 1 and Volunteer.version by 1"

  - entity: VisitCheckIn
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /check-ins/{id}/check-out"
        actor: Volunteer (own) | CampusAdmin | DistrictCoordinator
        preconditions: ["checkin.status == OPEN (ERR_CHECKIN_INVALID_STATE)"]
        side_effects:
          - "checked_out_at <- now; close_reason <- SELF when caller is the owning Volunteer, else ADMIN"
          - "increments VisitCheckIn.version by 1"
      - from: OPEN
        to: CLOSED
        trigger: "cascade from Volunteer suspension or removal (see Volunteer machine)"
        actor: system
        preconditions: ["checkin.status == OPEN", "checkin.volunteer_id == affected volunteer"]
        side_effects:
          - "checked_out_at <- now; close_reason <- SYSTEM_SUSPENSION or SYSTEM_REMOVAL"
          - "increments VisitCheckIn.version by 1"

  - entity: IncidentReport
    initial_state: OPEN
    terminal_states: [SUBSTANTIATED, UNFOUNDED]
    transitions:
      - from: OPEN
        to: SUBSTANTIATED
        trigger: "POST /incident-reports/{id}/adjudicate"
        actor: DistrictCoordinator
        preconditions: ["incident.status == OPEN (ERR_INCIDENT_INVALID_STATE)"]
        side_effects:
          - "volunteer -> REMOVED with full removal cascade (see Volunteer machine)"
          - "increments IncidentReport.version by 1"
      - from: OPEN
        to: UNFOUNDED
        trigger: "POST /incident-reports/{id}/adjudicate"
        actor: DistrictCoordinator
        preconditions: ["incident.status == OPEN (ERR_INCIDENT_INVALID_STATE)"]
        side_effects:
          - "if volunteer.suspension_incident_id == this incident, reinstate per Volunteer SUSPENDED branch rules (prior_status, clearance validity)"
          - "increments IncidentReport.version by 1"

# =============================================================================
# §1.2.1 Concurrency Rules (true races only; OCC on parent version)
# =============================================================================
concurrency_rules:
  - rule_id: background-check-create-stale-volunteer
    parent_entity: Volunteer
    write_endpoint: "POST /background-checks"
    occ_field: "expected_volunteer_version"
    description: |
      Creating a BackgroundCheck against a Volunteer whose version has advanced
      since the client last observed it is rejected. This captures the case where
      another writer has just mutated the volunteer (e.g., created a check that
      legitimately supersedes the client's view of the screening posture) and the
      current writer's view of the volunteer is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: manual-award-stale-volunteer
    parent_entity: Volunteer
    write_endpoint: "POST /recognition-awards"
    occ_field: "expected_volunteer_version"
    description: |
      Granting a manual RecognitionAward against a Volunteer whose version has
      advanced since the client last observed it is rejected. This captures the
      case where an automated tier award or hour verification has just changed
      the volunteer's recognition posture and the coordinator's view is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: required_clearance_level
    trigger: "on Volunteer creation (contact_type immutable thereafter)"
    algorithm: threshold
    formula: |
      rank = { BASIC: 1, ENHANCED: 2 }
      required_check_level = BASIC if contact_type == SUPERVISED else ENHANCED
      A check level L is 'adequate' for a required level R iff rank[L] >= rank[R].
      The same rank mapping decides opportunity gating: the volunteer's latest
      cleared check level must be adequate for map(opportunity.required_contact_type).
    input_set: "the Volunteer row being created or gated"
    constants:
      LEVEL_BASIC_RANK: 1
      LEVEL_ENHANCED_RANK: 2
    precision: "not applicable (enum mapping)"

  - name: screening_decision_matrix
    trigger: "POST /background-checks/{id}/adjudicate"
    algorithm: weighted_scoring
    formula: |
      inputs: findings (NONE|MINOR|DISQUALIFYING), check.level,
              volunteer.required_check_level, volunteer.contact_type
      if findings == DISQUALIFYING:
          check_decision = DENIED; flags = []
      else:
          adequate = rank[check.level] >= rank[volunteer.required_check_level]
          if findings == NONE:
              check_decision = CLEARED; flags = []
          else:  # MINOR
              check_decision = CLEARED_WITH_FLAGS
              flags = [NO_TRANSPORT] + ([NO_ONE_ON_ONE] if volunteer.contact_type == UNSUPERVISED else [])
          # volunteer branch decided by adequacy x training compliance:
          #   adequate AND training_complete  -> volunteer ACTIVE branch
          #   adequate AND NOT complete       -> volunteer CLEARANCE_GRANTED branch
          #   NOT adequate                    -> volunteer stays in its current
          #     screening state (UNDER_SCREENING or RESCREEN_REQUIRED); the check
          #     still records CLEARED / CLEARED_WITH_FLAGS but does not advance
          #     clearance; clearance_expires_at is recomputed only from adequate
          #     cleared checks (see clearance_validity_window input set).
      flags stored on Volunteer.restriction_flags sorted ascending.
    input_set: "the BackgroundCheck being adjudicated and its Volunteer"
    constants:
      FLAG_ON_MINOR: NO_TRANSPORT
      FLAG_ON_MINOR_UNSUPERVISED: NO_ONE_ON_ONE
    precision: "not applicable (decision matrix)"

  - name: clearance_validity_window
    trigger: "on adjudication (sets expires_at); on clock sweep (evaluates expiry); on clearance_expires_at recompute"
    algorithm: chronological
    formula: |
      check.expires_at = check.decided_at + VALIDITY_DAYS[check.level]   (days as 24h durations)
      volunteer.clearance_expires_at: among the volunteer's BackgroundChecks with
        status in {CLEARED, CLEARED_WITH_FLAGS} AND check.level adequate for
        volunteer.required_check_level, select max decided_at (tie-break:
        created_at DESC, i.e., the later-created check wins); the selected
        check's expires_at is the value. If the selected check is EXPIRED or the
        set is empty, clearance_expires_at is null.
    input_set: "the volunteer's BackgroundChecks in {CLEARED, CLEARED_WITH_FLAGS} with adequate level"
    constants:
      VALIDITY_DAYS_BASIC: 730
      VALIDITY_DAYS_ENHANCED: 365
    precision: "day-granularity duration arithmetic on ISO8601 UTC timestamps"

  - name: volunteer_service_hours
    trigger: "on HourEntry create, verify, reject, revoke"
    algorithm: aggregation
    formula: |
      verified_variant:    total_verified_hours    = sum(hours) over entries with status == VERIFIED
      provisional_variant: total_provisional_hours = sum(hours) over entries with status in {PENDING, VERIFIED}
    input_set: "all HourEntry rows with volunteer_id == the volunteer; REJECTED and REVOKED excluded from both variants; PENDING only in provisional"
    constants: {}
    precision: "2 decimal places, round_half_up on the stored sum"
    variants:
      - name: verified
        when: "official program totals (recognition tier, reporting)"
        difference: "counts only VERIFIED entries"
      - name: provisional
        when: "optimistic pipeline view of volunteer engagement"
        difference: "counts PENDING + VERIFIED; strictly >= verified total whenever PENDING entries exist"

  - name: recognition_points
    trigger: "on HourEntry create (per-entry points field) and on verify / revoke (volunteer aggregate)"
    algorithm: aggregation
    formula: |
      MULTIPLIER = { STANDARD: 1.0, TUTORING: 1.5, MENTORING: 2.0 }
      per-entry: entry.points = round_half_up(entry.hours * MULTIPLIER[entry.activity_category], 1 decimal)
      volunteer.recognition_points = sum(entry.points) over entries with status == VERIFIED
      PINNED ORDER: each entry is rounded FIRST, then the rounded values are summed.
      (Sum-then-round is the rejected alternative and yields different results:
      e.g., 2.5h TUTORING + 1.25h STANDARD -> per-entry 3.8 + 1.3 = 5.1
      vs sum-then-round round_half_up(5.00, 1) = 5.0.)
    input_set: "the volunteer's HourEntries with status == VERIFIED"
    constants:
      MULTIPLIER_STANDARD: 1.0
      MULTIPLIER_TUTORING: 1.5
      MULTIPLIER_MENTORING: 2.0
    precision: "1 decimal place per entry, round_half_up; aggregate is the exact sum of rounded entries"

  - name: recognition_tier
    trigger: "after every recompute of total_verified_hours (verify, revoke)"
    algorithm: threshold
    formula: |
      if total_verified_hours >= GOLD_MIN:   tier = GOLD
      elif total_verified_hours >= SILVER_MIN: tier = SILVER
      elif total_verified_hours >= BRONZE_MIN: tier = BRONZE
      else: tier = NONE
      Boundaries are INCLUSIVE (>=): exactly 50.0 is SILVER.
      On tier increase: if no RecognitionAward exists for (volunteer, new tier),
      auto-create one with source AUTO. Tier decreases create nothing and never
      retract existing awards.
    input_set: "the Volunteer's total_verified_hours"
    constants:
      BRONZE_MIN: 20.0
      SILVER_MIN: 50.0
      GOLD_MIN: 100.0
    precision: "comparison at 2-decimal hour precision"

  - name: opportunity_fill
    trigger: "on Placement create, confirm, cancel, complete, and cascaded cancellations"
    algorithm: aggregation
    formula: |
      committed_variant: committed_count = count(placements of opportunity with status == CONFIRMED)
      projected_variant: projected_count = count(placements of opportunity with status in {REQUESTED, CONFIRMED})
    input_set: "all Placement rows with opportunity_id == the opportunity; CANCELLED and COMPLETED excluded from both variants"
    constants: {}
    precision: "integer counts"
    variants:
      - name: committed
        when: "capacity enforcement at confirm/match time"
        difference: "counts only CONFIRMED placements"
      - name: projected
        when: "planning view of demand"
        difference: "counts REQUESTED + CONFIRMED; strictly > committed whenever open requests exist"

  - name: training_compliance_check
    trigger: "on adjudication (branch selection), on TrainingRecord create (auto-activation), on placement confirm (gate)"
    algorithm: constraint_propagation
    formula: |
      required_modules = all TrainingModules where volunteer.contact_type in module.required_contact_types
      compliant = for every m in required_modules there exists a TrainingRecord
        (volunteer, m) with (m.validity_days is null OR record.expires_at > now)
      evaluated against the logical clock 'now'
    input_set: "all TrainingModules; the volunteer's TrainingRecords (any age; expiry decided by expires_at vs now)"
    constants: {}
    precision: "strictly-greater comparison on expires_at vs now"

  - name: badge_code_assignment
    trigger: "on VisitCheckIn creation"
    algorithm: chronological
    formula: |
      day = UTC calendar date of checked_in_at
      seq = 1 + count of existing VisitCheckIns with same campus_id and same day
      badge_code = campus.badge_prefix + '-' + zero_pad(seq, 4)
      Ordering for equal timestamps: created_at ASC. Sequence is per campus per
      UTC day and resets each day.
    input_set: "VisitCheckIns of the campus with checked_in_at on the same UTC calendar day (any status)"
    constants:
      BADGE_PAD_WIDTH: 4
    precision: "integer sequence"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority; first failure wins)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; X-User-Role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "caller role is in the endpoint's role list; Volunteer-role ownership: caller's X-User-ID must equal the target volunteer id (GET /volunteers/{id}, POST /placements volunteer_id, GET /placements/{id}, POST /hour-entries placement owner, GET /hour-entries/{id} entry owner, POST /check-ins/{id}/check-out owner, POST /placements/{id}/cancel owner)"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "every id in the path and every FK id in the body resolves to an existing entity; path ids validated left-to-right, then body FKs in payload field order"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 4
    category: state
    check: "target resource state precondition of the endpoint's transition (Volunteer: ERR_VOLUNTEER_INVALID_STATE; BackgroundCheck: ERR_CHECK_INVALID_STATE; Opportunity: ERR_OPPORTUNITY_INVALID_STATE; Placement: ERR_PLACEMENT_INVALID_STATE; HourEntry: ERR_HOUR_ENTRY_INVALID_STATE; VisitCheckIn: ERR_CHECKIN_INVALID_STATE; IncidentReport: ERR_INCIDENT_INVALID_STATE)"
    error_id: ERR_*_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 5
    category: business_safety
    check: "screening gates on POST /placements/{id}/confirm and POST /opportunities/{id}/match, in this order: (a) clearance level adequate for opportunity.required_contact_type (ERR_CLEARANCE_LEVEL_INSUFFICIENT); (b) restriction_flags do not block opportunity.restricted_category (ERR_RESTRICTED_ROLE); (c) training compliance complete (ERR_TRAINING_INCOMPLETE). Clearance expiry is enforced by the clock sweep demotion (ACTIVE -> RESCREEN_REQUIRED), which is a state precondition (p4), not a p5 gate."
    error_id: ERR_CLEARANCE_LEVEL_INSUFFICIENT | ERR_RESTRICTED_ROLE | ERR_TRAINING_INCOMPLETE
    http_status: 422
    applies_to: "POST /placements/{id}/confirm, POST /opportunities/{id}/match"
  - priority: 6
    category: business_referential
    check: "body FK relationships coherent: POST /hour-entries placement.volunteer_id == caller's volunteer (when role Volunteer) (ERR_PLACEMENT_VOLUNTEER_MISMATCH); POST /check-ins placement.volunteer_id == check-in volunteer (ERR_PLACEMENT_VOLUNTEER_MISMATCH) and placement.opportunity.campus_id == body campus_id (ERR_PLACEMENT_CAMPUS_MISMATCH)"
    error_id: ERR_PLACEMENT_VOLUNTEER_MISMATCH | ERR_PLACEMENT_CAMPUS_MISMATCH
    http_status: 422
    applies_to: "POST /hour-entries, POST /check-ins"
  - priority: 7
    category: business_temporal
    check: "window rules, in endpoint order: POST /hour-entries worked_date within placement opportunity's [starts_at date, ends_at date] (ERR_HOURS_OUTSIDE_PLACEMENT_WINDOW); POST /check-ins with placement_id: now within [starts_at - 30 minutes, ends_at] closed interval (ERR_OUTSIDE_CHECKIN_WINDOW); POST /placements/{id}/confirm: half-open [starts_at, ends_at) overlap with volunteer's other CONFIRMED placements (ERR_PLACEMENT_TIME_CONFLICT); POST /opportunities/{id}/publish: starts_at > now (ERR_OPPORTUNITY_WINDOW_PASSED); POST /placements/{id}/complete: now >= ends_at (ERR_PLACEMENT_WINDOW_OPEN)"
    error_id: ERR_HOURS_OUTSIDE_PLACEMENT_WINDOW | ERR_OUTSIDE_CHECKIN_WINDOW | ERR_PLACEMENT_TIME_CONFLICT | ERR_OPPORTUNITY_WINDOW_PASSED | ERR_PLACEMENT_WINDOW_OPEN
    http_status: 422
    applies_to: "POST /hour-entries, POST /check-ins, POST /placements/{id}/confirm, POST /opportunities/{id}/publish, POST /placements/{id}/complete"
  - priority: 8
    category: business_constraint
    check: "capacity / uniqueness / shape rules: POST /placements/{id}/confirm and match: committed_count < capacity (ERR_OPPORTUNITY_FULL); POST /placements: no placement in {REQUESTED, CONFIRMED} for (volunteer, opportunity) (ERR_DUPLICATE_PLACEMENT); POST /background-checks: no PENDING check for volunteer (ERR_CHECK_ALREADY_PENDING); POST /check-ins: no OPEN check-in for volunteer (ERR_OPEN_CHECKIN_EXISTS); POST /hour-entries hours <= 12 (ERR_HOURS_EXCEED_LIMIT); POST /placements/{id}/complete: >= 1 CLOSED check-in for placement (ERR_NO_CHECKIN_FOR_PLACEMENT); POST /recognition-awards: no existing award of same tier for volunteer (ERR_DUPLICATE_AWARD); create-time uniqueness: volunteer email (ERR_EMAIL_TAKEN), campus_code (ERR_CAMPUS_CODE_TAKEN), module_code (ERR_MODULE_CODE_TAKEN)"
    error_id: ERR_OPPORTUNITY_FULL | ERR_DUPLICATE_PLACEMENT | ERR_CHECK_ALREADY_PENDING | ERR_OPEN_CHECKIN_EXISTS | ERR_HOURS_EXCEED_LIMIT | ERR_NO_CHECKIN_FOR_PLACEMENT | ERR_DUPLICATE_AWARD | ERR_EMAIL_TAKEN | ERR_CAMPUS_CODE_TAKEN | ERR_MODULE_CODE_TAKEN
    http_status: 409
    applies_to: "create and confirm endpoints as listed"
  - priority: 9
    category: business_constraint
    check: "optimistic concurrency: expected_volunteer_version equals Volunteer.version (see §1.2.1)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /background-checks, POST /recognition-awards"
  - priority: 10
    category: business_constraint
    check: "request shape: required fields present; enums within declared sets; numbers within declared ranges (hours > 0, capacity >= 1, valid ISO8601 datetimes, starts_at < ends_at)"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"
    note: "Schema-level malformedness is reported after all stateful checks so that stateful error ids stay deterministic in dual-failure tests."

# =============================================================================
# §1.5 API Endpoint Table (flat: all resources top-level; FK reverse via filtered lists)
# =============================================================================
endpoints:
  - method: POST
    path: "/campuses"
    description: "Create a campus"
    roles: [DistrictCoordinator]
    code: 201
    input: [name, campus_code, badge_prefix]
    output: Campus
    side_effects: []
  - method: GET
    path: "/campuses/{id}"
    description: "Read one campus"
    roles: [DistrictCoordinator, CampusAdmin, Volunteer]
    code: 200
    input: []
    output: Campus
    side_effects: []

  - method: POST
    path: "/volunteers"
    description: "Intake: create a volunteer application in APPLIED"
    roles: [DistrictCoordinator]
    code: 201
    input: [full_name, email, contact_type]
    output: Volunteer
    side_effects: ["required_check_level computed from contact_type"]
  - method: GET
    path: "/volunteers"
    description: "List volunteers with pagination"
    roles: [DistrictCoordinator, CampusAdmin]
    code: 200
    input: ["status?", "contact_type?", "recognition_tier?", "limit?", "offset?"]
    output: Volunteer[]
    side_effects: []
  - method: GET
    path: "/volunteers/{id}"
    description: "Read one volunteer including computed clearance/hours/recognition fields. Volunteer role may only read own record."
    roles: [DistrictCoordinator, CampusAdmin, Volunteer]
    code: 200
    input: []
    output: Volunteer
    side_effects: []

  - method: POST
    path: "/background-checks"
    description: "Initiate a background check for a volunteer (first check moves APPLIED -> UNDER_SCREENING). OCC-guarded on Volunteer.version."
    roles: [DistrictCoordinator]
    code: 201
    input: [volunteer_id, level, expected_volunteer_version]
    output: BackgroundCheck
    side_effects:
      - "creates BackgroundCheck in PENDING"
      - "Volunteer APPLIED -> UNDER_SCREENING when applicable"
      - "increments Volunteer.version by 1"
  - method: GET
    path: "/background-checks"
    description: "List background checks (FK reverse lookup for BackgroundCheck.volunteer_id)"
    roles: [DistrictCoordinator]
    code: 200
    input: ["volunteer_id?", "status?", "limit?", "offset?"]
    output: BackgroundCheck[]
    side_effects: []
  - method: GET
    path: "/background-checks/{id}"
    description: "Read one background check"
    roles: [DistrictCoordinator]
    code: 200
    input: []
    output: BackgroundCheck
    side_effects: []
  - method: POST
    path: "/background-checks/{id}/adjudicate"
    description: "Record findings and resolve the check via calculations.screening_decision_matrix; cascades to the volunteer per §1.2"
    roles: [DistrictCoordinator]
    code: 200
    input: [findings]
    output: BackgroundCheck
    side_effects:
      - "sets findings, decided_at, expires_at per calculations.clearance_validity_window"
      - "volunteer status branch + restriction_flags + clearance_expires_at per §1.2"
      - "on DISQUALIFYING: full DENIED cascade (placements cancelled, check-ins force-closed)"
      - "on new restriction flags: SYSTEM_RESTRICTION cancellations of blocked CONFIRMED placements"
      - "increments Volunteer.version by 1"

  - method: POST
    path: "/training-modules"
    description: "Create a training module"
    roles: [DistrictCoordinator]
    code: 201
    input: [module_code, title, required_contact_types, "validity_days?"]
    output: TrainingModule
    side_effects: []
  - method: GET
    path: "/training-modules"
    description: "List training modules"
    roles: [DistrictCoordinator, CampusAdmin, Volunteer]
    code: 200
    input: ["limit?", "offset?"]
    output: TrainingModule[]
    side_effects: []

  - method: POST
    path: "/training-records"
    description: "Record a module completion for a volunteer; may auto-activate a CLEARANCE_GRANTED volunteer"
    roles: [DistrictCoordinator, CampusAdmin]
    code: 201
    input: [volunteer_id, module_id, completed_at]
    output: TrainingRecord
    side_effects:
      - "expires_at computed from module.validity_days"
      - "Volunteer CLEARANCE_GRANTED -> ACTIVE when training compliance becomes complete (increments Volunteer.version by 1)"
  - method: GET
    path: "/training-records"
    description: "List training records (FK reverse for volunteer_id and module_id)"
    roles: [DistrictCoordinator, CampusAdmin]
    code: 200
    input: ["volunteer_id?", "module_id?", "limit?", "offset?"]
    output: TrainingRecord[]
    side_effects: []
  - method: GET
    path: "/training-records/{id}"
    description: "Read one training record"
    roles: [DistrictCoordinator, CampusAdmin]
    code: 200
    input: []
    output: TrainingRecord
    side_effects: []

  - method: POST
    path: "/opportunities"
    description: "Create an opportunity in DRAFT"
    roles: [CampusAdmin, DistrictCoordinator]
    code: 201
    input: [campus_id, title, "description?", required_contact_type, restricted_category, capacity, starts_at, ends_at]
    output: Opportunity
    side_effects: []
  - method: GET
    path: "/opportunities"
    description: "List opportunities (FK reverse for campus_id)"
    roles: [DistrictCoordinator, CampusAdmin, Volunteer]
    code: 200
    input: ["campus_id?", "status?", "required_contact_type?", "limit?", "offset?"]
    output: Opportunity[]
    side_effects: []
  - method: GET
    path: "/opportunities/{id}"
    description: "Read one opportunity including committed_count / projected_count"
    roles: [DistrictCoordinator, CampusAdmin, Volunteer]
    code: 200
    input: []
    output: Opportunity
    side_effects: []
  - method: POST
    path: "/opportunities/{id}/publish"
    description: "DRAFT -> OPEN"
    roles: [CampusAdmin, DistrictCoordinator]
    code: 200
    input: []
    output: Opportunity
    side_effects: ["increments Opportunity.version by 1"]
  - method: POST
    path: "/opportunities/{id}/cancel"
    description: "DRAFT|OPEN -> CANCELLED; cancels REQUESTED/CONFIRMED placements"
    roles: [CampusAdmin, DistrictCoordinator]
    code: 200
    input: []
    output: Opportunity
    side_effects:
      - "cascade: Placements in {REQUESTED, CONFIRMED} -> CANCELLED (OPPORTUNITY_CANCELLED); counts recomputed"
      - "increments Opportunity.version by 1"
  - method: POST
    path: "/opportunities/{id}/match"
    description: "Selector: auto-place eligible volunteers. Eligibility: status ACTIVE, clearance level adequate, trainings valid, not restricted for restricted_category, no overlap with existing CONFIRMED placements, no existing placement on this opportunity. Ranking: total_verified_hours ASC, tie-break Volunteer.created_at ASC. Creates CONFIRMED placements up to remaining capacity (and max_placements when given). Empty pool yields matched_count 0."
    roles: [DistrictCoordinator]
    code: 200
    input: ["max_placements?"]
    output: "{ matched_count: integer, created_placement_ids: string[], committed_count: integer, remaining_capacity: integer }"
    side_effects:
      - "creates Placements in CONFIRMED (confirmed_at <- now)"
      - "Opportunity.committed_count / projected_count recomputed"

  - method: POST
    path: "/placements"
    description: "Request a placement (REQUESTED). Volunteer role: volunteer_id forced to caller. Eligibility gates are enforced at confirm time; request checks only state + duplicates."
    roles: [Volunteer, DistrictCoordinator]
    code: 201
    input: [opportunity_id, "volunteer_id?"]
    output: Placement
    side_effects: ["Opportunity.projected_count recomputed"]
  - method: GET
    path: "/placements"
    description: "List placements (FK reverse for volunteer_id and opportunity_id)"
    roles: [DistrictCoordinator, CampusAdmin]
    code: 200
    input: ["volunteer_id?", "opportunity_id?", "status?", "limit?", "offset?"]
    output: Placement[]
    side_effects: []
  - method: GET
    path: "/placements/{id}"
    description: "Read one placement. Volunteer role may only read own placements."
    roles: [DistrictCoordinator, CampusAdmin, Volunteer]
    code: 200
    input: []
    output: Placement
    side_effects: []
  - method: POST
    path: "/placements/{id}/confirm"
    description: "REQUESTED -> CONFIRMED with full safety/temporal/capacity gate stack (§1.4 p4-p8)"
    roles: [CampusAdmin, DistrictCoordinator]
    code: 200
    input: []
    output: Placement
    side_effects:
      - "confirmed_at <- now"
      - "Opportunity.committed_count / projected_count recomputed"
      - "increments Placement.version by 1"
  - method: POST
    path: "/placements/{id}/cancel"
    description: "REQUESTED|CONFIRMED -> CANCELLED; releases the seat. Volunteer role may only cancel own placements."
    roles: [Volunteer, CampusAdmin, DistrictCoordinator]
    code: 200
    input: []
    output: Placement
    side_effects:
      - "cancel_reason set per actor"
      - "Opportunity.committed_count / projected_count recomputed"
      - "increments Placement.version by 1"
  - method: POST
    path: "/placements/{id}/complete"
    description: "CONFIRMED -> COMPLETED after the window ends; requires >= 1 CLOSED check-in for the placement"
    roles: [CampusAdmin, DistrictCoordinator]
    code: 200
    input: []
    output: Placement
    side_effects:
      - "Opportunity counts recomputed"
      - "increments Placement.version by 1"

  - method: POST
    path: "/hour-entries"
    description: "Log volunteer hours against a placement (PENDING)"
    roles: [Volunteer, DistrictCoordinator]
    code: 201
    input: [placement_id, worked_date, hours, activity_category]
    output: HourEntry
    side_effects:
      - "points computed per calculations.recognition_points"
      - "Volunteer.total_provisional_hours recomputed (increments Volunteer.version by 1)"
  - method: GET
    path: "/hour-entries"
    description: "List hour entries (FK reverse for placement_id and volunteer_id)"
    roles: [DistrictCoordinator, CampusAdmin]
    code: 200
    input: ["placement_id?", "volunteer_id?", "status?", "limit?", "offset?"]
    output: HourEntry[]
    side_effects: []
  - method: GET
    path: "/hour-entries/{id}"
    description: "Read one hour entry. Volunteer role may only read own entries."
    roles: [DistrictCoordinator, CampusAdmin, Volunteer]
    code: 200
    input: []
    output: HourEntry
    side_effects: []
  - method: POST
    path: "/hour-entries/{id}/verify"
    description: "PENDING -> VERIFIED; drives totals, points, tier, auto-award cascade"
    roles: [CampusAdmin, DistrictCoordinator]
    code: 200
    input: []
    output: HourEntry
    side_effects:
      - "Volunteer totals + recognition_points + recognition_tier recomputed; AUTO RecognitionAward on tier increase"
      - "increments HourEntry.version by 1 and Volunteer.version by 1"
  - method: POST
    path: "/hour-entries/{id}/reject"
    description: "PENDING -> REJECTED; entry leaves the provisional set"
    roles: [CampusAdmin, DistrictCoordinator]
    code: 200
    input: []
    output: HourEntry
    side_effects:
      - "Volunteer.total_provisional_hours recomputed"
      - "increments HourEntry.version by 1 and Volunteer.version by 1"
  - method: POST
    path: "/hour-entries/{id}/revoke"
    description: "VERIFIED -> REVOKED; compensates totals and points (district-office exclusive)"
    roles: [DistrictCoordinator]
    code: 200
    input: []
    output: HourEntry
    side_effects:
      - "Volunteer.total_verified_hours / total_provisional_hours / recognition_points recomputed; tier may downgrade; awards never retracted"
      - "increments HourEntry.version by 1 and Volunteer.version by 1"

  - method: POST
    path: "/check-ins"
    description: "Campus check-in with badge issuance. Volunteer role checks in self; CampusAdmin/DistrictCoordinator must pass volunteer_id. With placement_id, enforces window [starts_at - 30min, ends_at] and campus match. Without placement_id, walk-in check-in for ACTIVE volunteers."
    roles: [Volunteer, CampusAdmin, DistrictCoordinator]
    code: 201
    input: [campus_id, "volunteer_id?", "placement_id?"]
    output: VisitCheckIn
    side_effects:
      - "badge_code assigned per calculations.badge_code_assignment"
      - "checked_in_at <- now"
  - method: GET
    path: "/check-ins"
    description: "List check-ins (FK reverse for volunteer_id, campus_id, placement_id)"
    roles: [DistrictCoordinator, CampusAdmin]
    code: 200
    input: ["volunteer_id?", "campus_id?", "placement_id?", "status?", "limit?", "offset?"]
    output: VisitCheckIn[]
    side_effects: []
  - method: GET
    path: "/check-ins/{id}"
    description: "Read one check-in"
    roles: [DistrictCoordinator, CampusAdmin, Volunteer]
    code: 200
    input: []
    output: VisitCheckIn
    side_effects: []
  - method: POST
    path: "/check-ins/{id}/check-out"
    description: "OPEN -> CLOSED; Volunteer role may only check out own check-ins"
    roles: [Volunteer, CampusAdmin, DistrictCoordinator]
    code: 200
    input: []
    output: VisitCheckIn
    side_effects:
      - "checked_out_at <- now; close_reason SELF or ADMIN"
      - "increments VisitCheckIn.version by 1"

  - method: POST
    path: "/incident-reports"
    description: "File an incident against a volunteer. severity HIGH auto-suspends with cascade (placements cancelled, check-ins force-closed)."
    roles: [CampusAdmin, DistrictCoordinator]
    code: 201
    input: [volunteer_id, "placement_id?", severity, description]
    output: IncidentReport
    side_effects:
      - "severity HIGH: Volunteer -> SUSPENDED with prior_status/suspension_incident_id; CONFIRMED placements -> CANCELLED (SYSTEM_SUSPENSION); Opportunity counts recomputed; OPEN check-ins -> CLOSED (SYSTEM_SUSPENSION)"
      - "increments Volunteer.version by 1 when suspension fires"
  - method: GET
    path: "/incident-reports"
    description: "List incident reports (FK reverse for volunteer_id and placement_id)"
    roles: [DistrictCoordinator, CampusAdmin]
    code: 200
    input: ["volunteer_id?", "placement_id?", "status?", "limit?", "offset?"]
    output: IncidentReport[]
    side_effects: []
  - method: GET
    path: "/incident-reports/{id}"
    description: "Read one incident report"
    roles: [DistrictCoordinator, CampusAdmin]
    code: 200
    input: []
    output: IncidentReport
    side_effects: []
  - method: POST
    path: "/incident-reports/{id}/adjudicate"
    description: "OPEN -> SUBSTANTIATED (volunteer REMOVED cascade) | UNFOUNDED (reinstate when this incident caused the suspension)"
    roles: [DistrictCoordinator]
    code: 200
    input: [outcome]
    output: IncidentReport
    side_effects:
      - "SUBSTANTIATED: Volunteer -> REMOVED; Placements {REQUESTED, CONFIRMED} -> CANCELLED (SYSTEM_REMOVAL); Opportunity counts recomputed; OPEN check-ins -> CLOSED (SYSTEM_REMOVAL)"
      - "UNFOUNDED: reinstate per §1.2 SUSPENDED branches when suspension_incident_id matches"
      - "increments Volunteer.version by 1 on any volunteer mutation"

  - method: POST
    path: "/recognition-awards"
    description: "Manually grant a recognition award. OCC-guarded on Volunteer.version. One award per tier per volunteer."
    roles: [DistrictCoordinator]
    code: 201
    input: [volunteer_id, tier, "note?", expected_volunteer_version]
    output: RecognitionAward
    side_effects:
      - "increments Volunteer.version by 1 (award attaches to the volunteer aggregate)"
  - method: GET
    path: "/recognition-awards"
    description: "List recognition awards (FK reverse for volunteer_id)"
    roles: [DistrictCoordinator, CampusAdmin]
    code: 200
    input: ["volunteer_id?", "tier?", "limit?", "offset?"]
    output: RecognitionAward[]
    side_effects: []
  - method: GET
    path: "/recognition-awards/{id}"
    description: "Read one recognition award"
    roles: [DistrictCoordinator, CampusAdmin]
    code: 200
    input: []
    output: RecognitionAward
    side_effects: []

  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving logical clock. Server startup default is exactly 2026-08-01T00:00:00Z; before any set call the logical clock reads this default and never falls back to wall-clock time. Setting the clock runs the sweep: BackgroundChecks {CLEARED, CLEARED_WITH_FLAGS} with expires_at <= now -> EXPIRED; affected ACTIVE volunteers -> RESCREEN_REQUIRED; Opportunities OPEN with ends_at <= now -> COMPLETED."
    roles: [DistrictCoordinator]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string, expired_check_count: integer, volunteers_rescreened_count: integer, opportunities_completed_count: integer }"
    side_effects:
      - "BackgroundCheck expiry sweep"
      - "Volunteer ACTIVE -> RESCREEN_REQUIRED sweep (increments each affected Volunteer.version by 1)"
      - "Opportunity OPEN -> COMPLETED sweep"

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or malformed X-User-Role / X-User-ID headers, or undeclared role" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted on this endpoint, or Volunteer-role ownership check failed (acting on another volunteer's resource)" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or body FK id does not resolve to an existing entity" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Required field missing, enum outside declared set, or numeric/date shape violated (hours <= 0, capacity < 1, starts_at >= ends_at, malformed datetime)" }
  - { id: ERR_VOLUNTEER_INVALID_STATE, http: 409, condition: "Volunteer not in a status that permits the operation: check creation requires {APPLIED, ACTIVE, RESCREEN_REQUIRED}; placement request/confirm and check-in require ACTIVE; incident filing requires {ACTIVE, RESCREEN_REQUIRED, CLEARANCE_GRANTED, SUSPENDED}; award grant requires not in {DENIED, REMOVED}" }
  - { id: ERR_CHECK_INVALID_STATE, http: 409, condition: "Adjudication attempted on a BackgroundCheck not in PENDING" }
  - { id: ERR_CHECK_ALREADY_PENDING, http: 409, condition: "A BackgroundCheck in PENDING already exists for the volunteer" }
  - { id: ERR_OPPORTUNITY_INVALID_STATE, http: 409, condition: "Publish requires DRAFT; cancel requires {DRAFT, OPEN}; placement request/match/confirm require OPEN" }
  - { id: ERR_OPPORTUNITY_WINDOW_PASSED, http: 422, condition: "Publish attempted when starts_at <= now" }
  - { id: ERR_OPPORTUNITY_FULL, http: 409, condition: "Confirm/match attempted when opportunity.committed_count >= capacity" }
  - { id: ERR_PLACEMENT_INVALID_STATE, http: 409, condition: "Confirm requires REQUESTED; cancel requires {REQUESTED, CONFIRMED}; complete requires CONFIRMED; hour logging requires placement in {CONFIRMED, COMPLETED}; check-in with placement_id requires placement CONFIRMED" }
  - { id: ERR_PLACEMENT_TIME_CONFLICT, http: 422, condition: "Confirm would create overlapping CONFIRMED placements for one volunteer under half-open [starts_at, ends_at) semantics (adjacency allowed)" }
  - { id: ERR_PLACEMENT_WINDOW_OPEN, http: 422, condition: "Complete attempted before opportunity.ends_at" }
  - { id: ERR_PLACEMENT_VOLUNTEER_MISMATCH, http: 422, condition: "Referenced placement belongs to a different volunteer than the actor (hour logging) or than the check-in subject" }
  - { id: ERR_PLACEMENT_CAMPUS_MISMATCH, http: 422, condition: "Check-in campus_id differs from the placement opportunity's campus_id" }
  - { id: ERR_CLEARANCE_LEVEL_INSUFFICIENT, http: 422, condition: "Volunteer's latest cleared check level is below the level the opportunity's required_contact_type demands" }
  - { id: ERR_RESTRICTED_ROLE, http: 422, condition: "Volunteer.restriction_flags block the opportunity's restricted_category (NO_TRANSPORT blocks TRANSPORT; NO_ONE_ON_ONE blocks ONE_ON_ONE)" }
  - { id: ERR_TRAINING_INCOMPLETE, http: 422, condition: "A required TrainingModule lacks a valid (unexpired) TrainingRecord at confirm/match time" }
  - { id: ERR_HOURS_OUTSIDE_PLACEMENT_WINDOW, http: 422, condition: "worked_date outside the placement opportunity's [starts_at date, ends_at date]" }
  - { id: ERR_HOURS_EXCEED_LIMIT, http: 422, condition: "Single hour entry declares hours > 12" }
  - { id: ERR_HOUR_ENTRY_INVALID_STATE, http: 409, condition: "Verify/reject require PENDING; revoke requires VERIFIED" }
  - { id: ERR_OUTSIDE_CHECKIN_WINDOW, http: 422, condition: "Check-in with placement_id outside [starts_at - 30 minutes, ends_at] (closed interval)" }
  - { id: ERR_OPEN_CHECKIN_EXISTS, http: 409, condition: "Volunteer already has an OPEN VisitCheckIn (any campus)" }
  - { id: ERR_CHECKIN_INVALID_STATE, http: 409, condition: "Check-out attempted on a check-in not in OPEN" }
  - { id: ERR_INCIDENT_INVALID_STATE, http: 409, condition: "Adjudication attempted on an incident not in OPEN" }
  - { id: ERR_DUPLICATE_PLACEMENT, http: 409, condition: "A placement in {REQUESTED, CONFIRMED} already exists for (volunteer, opportunity)" }
  - { id: ERR_DUPLICATE_AWARD, http: 409, condition: "A RecognitionAward of the same tier already exists for the volunteer" }
  - { id: ERR_NO_CHECKIN_FOR_PLACEMENT, http: 422, condition: "Complete attempted with zero CLOSED VisitCheckIns linked to the placement" }
  - { id: ERR_EMAIL_TAKEN, http: 409, condition: "Volunteer email already registered (any status)" }
  - { id: ERR_CAMPUS_CODE_TAKEN, http: 409, condition: "campus_code already in use" }
  - { id: ERR_MODULE_CODE_TAKEN, http: 409, condition: "module_code already in use" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_volunteer_version does not match Volunteer.version (OCC, §1.2.1)" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: DistrictCoordinator
    description: "District volunteer office staff; superset of CampusAdmin powers plus exclusive control over screening, incidents, awards, modules, campuses, matching, and the clock"
    identity: opaque
    exclusive_operations:
      - "POST /campuses"
      - "POST /volunteers"
      - "POST /background-checks, POST /background-checks/{id}/adjudicate, GET /background-checks*"
      - "POST /training-modules"
      - "POST /opportunities/{id}/match"
      - "POST /hour-entries/{id}/revoke"
      - "POST /incident-reports/{id}/adjudicate"
      - "POST /recognition-awards"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "all CampusAdmin operations (opportunities, placements confirm/cancel/complete, hour verify/reject, incident filing, check-in admin, all list/read endpoints)"
  - name: CampusAdmin
    description: "School-level administrator; manages opportunities and day-to-day placement/hour verification, files incidents"
    identity: opaque
    exclusive_operations:
      - "POST /opportunities, POST /opportunities/{id}/publish, POST /opportunities/{id}/cancel (shared upward with DistrictCoordinator but denied to Volunteer)"
      - "POST /hour-entries/{id}/verify, POST /hour-entries/{id}/reject (shared upward)"
    shared_operations:
      - "POST /placements/{id}/confirm, /cancel, /complete"
      - "POST /training-records"
      - "POST /check-ins, POST /check-ins/{id}/check-out"
      - "POST /incident-reports"
      - "GET endpoints per §1.5"
  - name: Volunteer
    description: "A screened community member; self-service placement requests, hour logging, and campus check-in; X-User-ID must equal the Volunteer entity id"
    identity: "entity_backed:Volunteer"
    exclusive_operations:
      - "POST /placements (own; volunteer_id forced to caller)"
      - "POST /hour-entries (own placements only)"
    shared_operations:
      - "POST /placements/{id}/cancel (own only)"
      - "POST /check-ins (self), POST /check-ins/{id}/check-out (own only)"
      - "GET /volunteers/{id} (own only), GET /placements/{id} (own only), GET /hour-entries/{id} (own only), GET /check-ins/{id} (own only)"
      - "GET /opportunities, GET /opportunities/{id}, GET /campuses/{id}, GET /training-modules"
