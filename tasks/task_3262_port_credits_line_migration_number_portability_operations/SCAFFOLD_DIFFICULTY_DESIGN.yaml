  - rule_id: priority_pair_validation_conflict
    instances:
      - name: protection_beats_resubmission_cooldown
        grounds:
          - validations[priority=8]
          - validations[priority=11]
          - state_machines.PortRequest.REJECTED_to_RESUBMITTED
        distinguishing_aspect: |
          A resubmission that is simultaneously blocked by the active port-out protection on the line
          (priority 8) and by the 48-hour resubmission cooling-off period (priority 11) must report
          ERR_PORT_PROTECTION_ACTIVE with status 403, because the state/safety pair outranks the
          temporal pair rather than the other way round.
        test_recipe:
          setup:
            - "One FAMILY account with one ACTIVE PREPAID line in number_status UNASSIGNED and port_protection_status PROTECTED"
            - "A port request on that line in request_state REJECTED with last_rejection_code PORT_BLOCK (retry_after_hours 48)"
            - "Logical clock 2026-09-02T12:00:00Z, which is 12 hours after the recorded rejection"
          setup_api_calls:
            - call: "POST /portability/accounts"
              payload: { account_type: "FAMILY", tax_id_last4: "9999", payment_history_score: 720, existing_deposit_cents: 50000 }
              as: PlatformAdmin
              captures: { acct: $.data.id }
            - call: "POST /portability/subscriber-lines"
              payload: { account_id: "${acct}", mdn: "4155550901", billing_mode: "PREPAID" }
              as: PlatformAdmin
              captures: { line: $.data.id }
            - call: "POST /portability/subscriber-lines/${line}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /portability/rejection-code-catalog"
              payload: { rejection_code: "PORT_BLOCK", description: "Port-out block in place", guidance_text: "Remove the port-out block before ordering", resubmission_allowed: true, retry_after_hours: 48, requires_action_by: "CUSTOMER" }
              as: PlatformAdmin
            - call: "POST /portability/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /portability/subscriber-lines/${line}"
              as: PlatformAdmin
              captures: { line_v1: $.data.version }
            - call: "POST /portability/port-requests"
              payload: { subscriber_line_id: "${line}", losing_carrier_code: "ATTC", account_number_at_losing_carrier: "ACC9", transfer_pin: "9999", requested_cutover_at: "2026-09-20T00:00:00Z", expected_subscriber_line_version: "${line_v1}" }
              as: CustomerService
              captures: { pr: $.data.id }
            - call: "POST /portability/port-requests/${pr}/submit"
              payload: { transfer_pin: "9999", account_number_at_losing_carrier: "ACC9" }
              as: CustomerService
            - call: "POST /portability/port-requests/${pr}/rejections"
              payload: { rejection_code: "PORT_BLOCK" }
              as: PlatformAdmin
            - call: "POST /portability/port-protection-cases"
              payload: { subscriber_line_id: "${line}", protection_type: "PORT_FREEZE", verified_identity: true, reason_code: "CUSTOMER_REQUEST" }
              as: CustomerService
              captures: { ppc: $.data.id }
            - call: "POST /portability/port-protection-cases/${ppc}/resolve"
              payload: { resolution: "ACTIVATE" }
              as: PlatformAdmin
            - call: "POST /portability/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T12:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /portability/port-requests/${pr}/resubmit"
              payload: { transfer_pin: "9999", account_number_at_losing_carrier: "ACC9" }
              as: CustomerService
              captures: { err: $.data.error_id }
          assert:
            - "PortRequest.${pr}.request_state == REJECTED"
            - "PortRequest.${pr}.rejection_count == 1"
      - name: transfer_pin_beats_resubmission_cooldown
        grounds:
          - validations[priority=9]
          - validations[priority=11]
        distinguishing_aspect: |
          With the line unprotected, a resubmission carrying a transfer PIN that does not match the
          losing-carrier account number (priority 9) inside the 48-hour cooling-off period
          (priority 11) must report ERR_TRANSFER_PIN_MISMATCH with status 422, so the safety pair
          outranks the temporal pair on a different error-category pairing from the protection case.
        test_recipe:
          setup:
            - "One FAMILY account with one ACTIVE PREPAID line, unprotected"
            - "A port request on that line in request_state REJECTED with last_rejection_code PORT_BLOCK"
            - "Logical clock 2026-09-02T12:00:00Z, 12 hours after the rejection"
          setup_api_calls:
            - call: "POST /portability/accounts"
              payload: { account_type: "FAMILY", tax_id_last4: "1010", payment_history_score: 720, existing_deposit_cents: 50000 }
              as: PlatformAdmin
              captures: { acct: $.data.id }
            - call: "POST /portability/subscriber-lines"
              payload: { account_id: "${acct}", mdn: "4155551001", billing_mode: "PREPAID" }
              as: PlatformAdmin
              captures: { line: $.data.id }
            - call: "POST /portability/subscriber-lines/${line}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /portability/rejection-code-catalog"
              payload: { rejection_code: "PORT_BLOCK", description: "Port-out block in place", guidance_text: "Remove the port-out block before ordering", resubmission_allowed: true, retry_after_hours: 48, requires_action_by: "CUSTOMER" }
              as: PlatformAdmin
            - call: "POST /portability/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /portability/subscriber-lines/${line}"
              as: PlatformAdmin
              captures: { line_v1: $.data.version }
            - call: "POST /portability/port-requests"
              payload: { subscriber_line_id: "${line}", losing_carrier_code: "ATTC", account_number_at_losing_carrier: "ACCA", transfer_pin: "1010", requested_cutover_at: "2026-09-20T00:00:00Z", expected_subscriber_line_version: "${line_v1}" }
              as: CustomerService
              captures: { pr: $.data.id }
            - call: "POST /portability/port-requests/${pr}/submit"
              payload: { transfer_pin: "1010", account_number_at_losing_carrier: "ACCA" }
              as: CustomerService
            - call: "POST /portability/port-requests/${pr}/rejections"
              payload: { rejection_code: "PORT_BLOCK" }
              as: PlatformAdmin
            - call: "POST /portability/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T12:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /portability/port-requests/${pr}/resubmit"
              payload: { transfer_pin: "1010", account_number_at_losing_carrier: "OTHER" }
              as: CustomerService
              captures: { err: $.data.error_id }
          assert:
            - "response.data.error_id == ERR_TRANSFER_PIN_MISMATCH"
            - "PortRequest.${pr}.request_state == REJECTED"

  - rule_id: boundary_precision_check
    instances:
      - name: promo_window_buffer_boundary_day
        grounds:
          - validations[priority=15]
          - entities.SystemConfig.fields.promo_window_buffer_days
          - entities.PromoCreditSchedule.fields.window_end
        distinguishing_aspect: |
          With an existing schedule whose window_end is 2026-10-02 and a configured
          promo_window_buffer_days of 30, a replacement window starting 2026-10-31 is rejected with
          ERR_PROMO_WINDOW_OVERLAP while one starting exactly 2026-11-01 succeeds, so the boundary is
          inclusive at window_end plus the buffer and exclusive one day earlier.
        test_recipe:
          setup:
            - "One FAMILY account with two ACTIVE PREPAID lines, each carrying an existing PROVISIONAL schedule whose window_start is 2026-09-02 and window_end is 2026-10-02"
            - "Logical clock 2026-09-02T00:00:00Z"
