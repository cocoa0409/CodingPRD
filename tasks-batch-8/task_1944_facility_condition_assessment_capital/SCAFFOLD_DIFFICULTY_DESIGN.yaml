              as: Consultant
              captures: { d1_id: "$.data.id" }
            - call: "POST /fca/deficiencies"
              payload: { asset_system_id: "${sys_id}", description: "D2", cost_estimate_cents: 50000000, severity: 3, urgency: 3, recommended_year: 2027 }
              as: Consultant
              captures: { d2_id: "$.data.id" }
            - call: "POST /fca/capital-plans"
              payload: { facility_id: "${fac_id}", title: "P", start_year: 2027, horizon_years: 1, expected_facility_version: "${fac_v}" }
              as: CapitalPlanner
              captures: { plan_id: "$.data.id", plan_v: "$.data.version" }
            - call: "POST /fca/funding-scenarios"
              payload: { capital_plan_id: "${plan_id}", name: "Exact", annual_budget_cents: 80000000, escalation_rate: 0.0 }
