          assert:
            - "the first send returns HTTP 200 and Offer.${of_at_cap}.status == SENT (a total exactly equal to the cap is admitted)"
            - "FairEdition.${ed}.committed_guarantee_total_cents == 12500000 == FairEdition.${ed}.talent_budget_cap_cents"
            - "the second send returns HTTP 422 with ${err_over} == ERR_TALENT_BUDGET_EXCEEDED"
            - "Offer.${of_one_over}.status == DRAFT"
            - "FairEdition.${ed}.committed_guarantee_total_cents == 12500000 after the refusal (the one-cent offer never entered the ledger)"

