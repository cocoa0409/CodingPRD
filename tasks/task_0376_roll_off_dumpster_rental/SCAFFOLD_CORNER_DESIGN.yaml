# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Breadth probe: every testable §1.1-§1.7 claim §1.8 does not already cover.
# Walks references/claim-extraction-guide.md section-by-section against this
# scaffold. excluded_because stubs point at the §1.8 instance that covers them.
# Shared fixture literals match SCAFFOLD_DIFFICULTY_DESIGN.yaml.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_container_type_returns_201_with_fields
        claim_type: Creation
        grounds:
          - entities.ContainerType
          - endpoints
        distinguishing_aspect: "POST /container-types with all required fields returns 201, echoes size_code/base_rate_cents, sets active=true, and mints id/version=1."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /container-types"
              payload: { size_code: "YD40", base_rate_cents: 60000, included_days: 7, overage_day_cents: 1800, included_tonnage_lbs: 5000, overage_rate_cents_per_lb: 10 }
              as: YardAdmin
              captures: { ct: $.data.id, v: $.data.version, act: $.data.active }
          assert:
            - "trigger response status == 201"
            - "ContainerType.${ct}.size_code == YD40"
            - "ContainerType.${ct}.active == true"
            - "ContainerType.${ct}.version == 1"

      - name: get_order_not_found_returns_404
        claim_type: Not Found
        grounds:
          - entities.RentalOrder
          - errors[ERR_ORDER_NOT_FOUND]
        distinguishing_aspect: "GET /rental-orders/{nonexistent-uuid} returns 404 ERR_ORDER_NOT_FOUND."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /rental-orders/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "trigger response status == 404"
            - "trigger response data.error_id == ERR_ORDER_NOT_FOUND"

      - name: create_order_missing_required_field_returns_422
        claim_type: Required Fields
        grounds:
          - entities.RentalOrder.fields.site_address
          - validations[priority=14]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /rental-orders omitting site_address returns 422 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["one ContainerType and one ACTIVE account exist"]
          setup_api_calls:
            - call: "POST /container-types"
              payload: { size_code: "YD30", base_rate_cents: 50000, included_days: 7, overage_day_cents: 1500, included_tonnage_lbs: 4000, overage_rate_cents_per_lb: 9 }
              as: YardAdmin
              captures: { ct: $.data.id }
            - call: "POST /contractor-accounts"
              payload: { business_name: "Acme", credit_limit_cents: 500000 }
              as: YardAdmin
              captures: { acct: $.data.id }
          trigger:
            - call: "POST /rental-orders"
              payload: { account_id: "${acct}", container_type_id: "${ct}", requested_delivery_date: "2026-06-01" }
              as: Contractor
              as_user_id: "${acct}"
              captures: { err: $.data.error_id }
          assert:
            - "trigger response status == 422"
            - "trigger response data.error_id == ERR_INVALID_REQUEST"

      - name: create_order_default_requires_street_permit_false
        claim_type: Defaults
        grounds:
          - entities.RentalOrder.fields.requires_street_permit
        distinguishing_aspect: "Omitting requires_street_permit defaults it to false on the created order."
        test_recipe:
          setup: ["one ContainerType and one ACTIVE account exist"]
          setup_api_calls:
            - call: "POST /container-types"
              payload: { size_code: "YD30", base_rate_cents: 50000, included_days: 7, overage_day_cents: 1500, included_tonnage_lbs: 4000, overage_rate_cents_per_lb: 9 }
              as: YardAdmin
              captures: { ct: $.data.id }
            - call: "POST /contractor-accounts"
              payload: { business_name: "Acme", credit_limit_cents: 500000 }
              as: YardAdmin
              captures: { acct: $.data.id }
          trigger:
            - call: "POST /rental-orders"
              payload: { account_id: "${acct}", container_type_id: "${ct}", site_address: "1 Main", requested_delivery_date: "2026-06-01" }
              as: Contractor
              as_user_id: "${acct}"
              captures: { ord: $.data.id, rsp: $.data.requires_street_permit, ls: $.data.logistics_status, bs: $.data.billing_status }
          assert:
            - "RentalOrder.${ord}.requires_street_permit == false"
            - "RentalOrder.${ord}.logistics_status == BOOKED"
            - "RentalOrder.${ord}.billing_status == UNBILLED"

      - name: weigh_ticket_net_weight_computed_clamped_to_zero
        claim_type: Computed Fields
        grounds:
          - entities.WeighTicket.fields.net_weight_lbs
          - calculations.net_weight
        distinguishing_aspect: "net_weight_lbs = max(0, gross-tare); gross 9000 < tare 10000 yields net 0, not negative."
        test_recipe:
          setup: ["A completed-delivery order with an UNASSIGNED PICKUP stop on a DISPATCHED route (ticket can reference it)"]
          setup_api_calls:
            - call: "POST /_clock/set-current-date"
              payload: { current_date: "2026-06-01" }
              as: YardAdmin
            - call: "POST /container-types"
              payload: { size_code: "YD30", base_rate_cents: 50000, included_days: 7, overage_day_cents: 1500, included_tonnage_lbs: 4000, overage_rate_cents_per_lb: 9 }
              as: YardAdmin
              captures: { ct: $.data.id }
            - call: "POST /contractor-accounts"
              payload: { business_name: "Net", credit_limit_cents: 500000 }
              as: YardAdmin
              captures: { acct: $.data.id }
            - call: "POST /containers"
              payload: { container_type_id: "${ct}", asset_tag: "T-NW", yard_code: "Y1" }
              as: YardAdmin
              captures: { cont: $.data.id, cont_v: $.data.version }
            - call: "POST /rental-orders"
              payload: { account_id: "${acct}", container_type_id: "${ct}", site_address: "2 Main", requested_delivery_date: "2026-06-01" }
              as: Contractor
              as_user_id: "${acct}"
              captures: { ord: $.data.id }
            - call: "GET /service-stops?order_id=${ord}&stop_type=DELIVERY"
              payload: {}
              as: Dispatcher
              captures: { del_stop: "$.data[0].id" }
            - call: "POST /routes"
              payload: { service_date: "2026-06-01", truck_code: "TRKa", capacity_stops: 5 }
              as: Dispatcher
              captures: { r1: $.data.id, r1_v: $.data.version }
            - call: "POST /rental-orders/${ord}/dispatch-delivery"
              payload: { container_id: "${cont}", expected_container_version: "${cont_v}" }
              as: Dispatcher
            - call: "POST /routes/${r1}/stops"
              payload: { service_stop_id: "${del_stop}", expected_route_version: "${r1_v}" }
              as: Dispatcher
            - call: "POST /routes/${r1}/dispatch"
              payload: {}
              as: Dispatcher
            - call: "POST /service-stops/${del_stop}/complete"
              payload: {}
              as: Dispatcher
            - call: "POST /rental-orders/${ord}/pickup-stop"
              payload: { estimated_weight_lbs: 0 }
              as: Dispatcher
              captures: { pu_stop: $.data.id }
          trigger:
            - call: "POST /weigh-tickets"
              payload: { order_id: "${ord}", service_stop_id: "${pu_stop}", gross_weight_lbs: 9000, tare_weight_lbs: 10000 }
              as: ScaleOperator
              captures: { tk: $.data.id, net: $.data.net_weight_lbs }
          assert:
            - "WeighTicket net_weight_lbs == 0"

      - name: container_system_fields_ignore_client_status
        claim_type: System Fields
        grounds:
          - entities.Container.fields.status
          - entities.Container.fields.current_order_id
        distinguishing_aspect: "POST /containers ignores any client-sent status/current_order_id; created can is IN_YARD with current_order_id=null."
        test_recipe:
          setup: ["one ContainerType exists"]
          setup_api_calls:
            - call: "POST /container-types"
              payload: { size_code: "YD30", base_rate_cents: 50000, included_days: 7, overage_day_cents: 1500, included_tonnage_lbs: 4000, overage_rate_cents_per_lb: 9 }
              as: YardAdmin
              captures: { ct: $.data.id }
          trigger:
            - call: "POST /containers"
              payload: { container_type_id: "${ct}", asset_tag: "T-SYS", yard_code: "Y1" }
              as: YardAdmin
              captures: { cont: $.data.id, st: $.data.status, coid: $.data.current_order_id }
          assert:
            - "Container.${cont}.status == IN_YARD"
            - "Container.${cont}.current_order_id == null"

      - name: create_container_type_invalid_size_enum_returns_422
        claim_type: Type Constraints
        grounds:
          - entities.ContainerType.fields.size_code
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "size_code not in {YD10,YD20,YD30,YD40} returns 422 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /container-types"
              payload: { size_code: "YD99", base_rate_cents: 50000, included_days: 7, overage_day_cents: 1500, included_tonnage_lbs: 4000, overage_rate_cents_per_lb: 9 }
              as: YardAdmin
              captures: { err: $.data.error_id }
          assert:
            - "trigger response status == 422"
            - "trigger response data.error_id == ERR_INVALID_REQUEST"

      - name: weigh_ticket_immutable_no_version_field
        claim_type: Immutability
        grounds:
          - entities.WeighTicket
        distinguishing_aspect: "WeighTicket has common_fields:false — it is append-only with id+created_at only and no update endpoint; GET returns it unchanged."
        test_recipe:
          setup: ["A weigh ticket recorded for a PICKUP stop (reuse the net_weight fixture skeleton)"]
          setup_api_calls:
            - call: "POST /_clock/set-current-date"
              payload: { current_date: "2026-06-01" }
              as: YardAdmin
            - call: "POST /container-types"
              payload: { size_code: "YD30", base_rate_cents: 50000, included_days: 7, overage_day_cents: 1500, included_tonnage_lbs: 4000, overage_rate_cents_per_lb: 9 }
              as: YardAdmin
              captures: { ct: $.data.id }
            - call: "POST /contractor-accounts"
              payload: { business_name: "Imm", credit_limit_cents: 500000 }
              as: YardAdmin
              captures: { acct: $.data.id }
            - call: "POST /containers"
              payload: { container_type_id: "${ct}", asset_tag: "T-IM", yard_code: "Y1" }
              as: YardAdmin
              captures: { cont: $.data.id, cont_v: $.data.version }
            - call: "POST /rental-orders"
              payload: { account_id: "${acct}", container_type_id: "${ct}", site_address: "3 Main", requested_delivery_date: "2026-06-01" }
              as: Contractor
              as_user_id: "${acct}"
              captures: { ord: $.data.id }
            - call: "GET /service-stops?order_id=${ord}&stop_type=DELIVERY"
              payload: {}
              as: Dispatcher
              captures: { del_stop: "$.data[0].id" }
            - call: "POST /routes"
              payload: { service_date: "2026-06-01", truck_code: "TRKb", capacity_stops: 5 }
              as: Dispatcher
              captures: { r1: $.data.id, r1_v: $.data.version }
            - call: "POST /rental-orders/${ord}/dispatch-delivery"
              payload: { container_id: "${cont}", expected_container_version: "${cont_v}" }
              as: Dispatcher
            - call: "POST /routes/${r1}/stops"
              payload: { service_stop_id: "${del_stop}", expected_route_version: "${r1_v}" }
              as: Dispatcher
            - call: "POST /routes/${r1}/dispatch"
              payload: {}
              as: Dispatcher
            - call: "POST /service-stops/${del_stop}/complete"
              payload: {}
              as: Dispatcher
            - call: "POST /rental-orders/${ord}/pickup-stop"
              payload: { estimated_weight_lbs: 100 }
              as: Dispatcher
              captures: { pu_stop: $.data.id }
            - call: "POST /weigh-tickets"
              payload: { order_id: "${ord}", service_stop_id: "${pu_stop}", gross_weight_lbs: 11000, tare_weight_lbs: 10000 }
              as: ScaleOperator
              captures: { tk: $.data.id }
          trigger:
            - call: "GET /weigh-tickets/${tk}"
              payload: {}
              as: ScaleOperator
              captures: { net: $.data.net_weight_lbs }
          assert:
            - "WeighTicket ${tk} net_weight_lbs == 1000"

      - name: create_container_bad_type_id_returns_404
        claim_type: Parent Relationships
        grounds:
          - entities.Container.fields.container_type_id
          - errors[ERR_CONTAINER_TYPE_NOT_FOUND]
        distinguishing_aspect: "POST /containers with a nonexistent container_type_id returns 404 ERR_CONTAINER_TYPE_NOT_FOUND."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /containers"
              payload: { container_type_id: "00000000-0000-0000-0000-000000000000", asset_tag: "T-X", yard_code: "Y1" }
              as: YardAdmin
              captures: { err: $.data.error_id }
          assert:
            - "trigger response status == 404"
            - "trigger response data.error_id == ERR_CONTAINER_TYPE_NOT_FOUND"

      - name: list_container_types_paginated_envelope
        claim_type: Listing
        grounds:
          - entities.ContainerType
          - endpoints
        distinguishing_aspect: "GET /container-types returns a paginated array envelope with total_count and has_more."
        test_recipe:
          setup: ["two container types exist"]
          setup_api_calls:
            - call: "POST /container-types"
              payload: { size_code: "YD10", base_rate_cents: 30000, included_days: 7, overage_day_cents: 1000, included_tonnage_lbs: 2000, overage_rate_cents_per_lb: 7 }
              as: YardAdmin
            - call: "POST /container-types"
              payload: { size_code: "YD20", base_rate_cents: 40000, included_days: 7, overage_day_cents: 1200, included_tonnage_lbs: 3000, overage_rate_cents_per_lb: 8 }
              as: YardAdmin
          trigger:
            - call: "GET /container-types?limit=1&offset=0"
              payload: {}
              as: Dispatcher
          assert:
            - "response_type == array"
            - "meta.total_count == 2"
            - "meta.has_more == true"
            - "data length == 1"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: dispatch_delivery_from_scheduled_invalid
        claim_type: Invalid Transitions
        grounds:
          - state_machines.RentalOrder.BOOKED_to_SCHEDULED
          - errors[ERR_ORDER_NOT_BOOKED]
        distinguishing_aspect: "Calling dispatch-delivery on an already-SCHEDULED order returns 409 ERR_ORDER_NOT_BOOKED (idempotent re-dispatch rejected)."
        test_recipe:
          setup: ["Order dispatched once (now SCHEDULED) with its container committed"]
          setup_api_calls:
            - call: "POST /container-types"
              payload: { size_code: "YD30", base_rate_cents: 50000, included_days: 7, overage_day_cents: 1500, included_tonnage_lbs: 4000, overage_rate_cents_per_lb: 9 }
              as: YardAdmin
              captures: { ct: $.data.id }
            - call: "POST /contractor-accounts"
              payload: { business_name: "Inv", credit_limit_cents: 500000 }
              as: YardAdmin
              captures: { acct: $.data.id }
            - call: "POST /containers"
              payload: { container_type_id: "${ct}", asset_tag: "T-IV", yard_code: "Y1" }
              as: YardAdmin
              captures: { cont: $.data.id, cont_v: $.data.version }
            - call: "POST /rental-orders"
              payload: { account_id: "${acct}", container_type_id: "${ct}", site_address: "4 Main", requested_delivery_date: "2026-06-01" }
              as: Contractor
              as_user_id: "${acct}"
              captures: { ord: $.data.id }
            - call: "POST /rental-orders/${ord}/dispatch-delivery"
              payload: { container_id: "${cont}", expected_container_version: "${cont_v}" }
              as: Dispatcher
              captures: { cont_v2: $.data.container_id }
          trigger:
            - call: "POST /rental-orders/${ord}/dispatch-delivery"
              payload: { container_id: "${cont}", expected_container_version: "${cont_v}" }
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "trigger response status == 409"
            - "trigger response data.error_id == ERR_ORDER_NOT_BOOKED"

      - name: pay_already_paid_invoice_idempotency_rejected
        claim_type: Idempotency
        grounds:
          - state_machines.Invoice.ISSUED_to_PAID
          - errors[ERR_INVOICE_NOT_ISSUED]
        distinguishing_aspect: "Paying an invoice twice: the second pay sees status PAID (not ISSUED) and returns 409 ERR_INVOICE_NOT_ISSUED."
        test_recipe:
          setup: ["A finalized order whose ISSUED invoice has been paid once (reuse the full-completion fixture)"]
          setup_api_calls:
            - call: "POST /_clock/set-current-date"
              payload: { current_date: "2026-06-01" }
              as: YardAdmin
            - call: "POST /container-types"
              payload: { size_code: "YD30", base_rate_cents: 50000, included_days: 7, overage_day_cents: 1500, included_tonnage_lbs: 4000, overage_rate_cents_per_lb: 9 }
              as: YardAdmin
              captures: { ct: $.data.id }
            - call: "POST /contractor-accounts"
              payload: { business_name: "Pay", credit_limit_cents: 500000 }
              as: YardAdmin
              captures: { acct: $.data.id }
            - call: "POST /containers"
              payload: { container_type_id: "${ct}", asset_tag: "T-PY", yard_code: "Y1" }
              as: YardAdmin
              captures: { cont: $.data.id, cont_v: $.data.version }
            - call: "POST /rental-orders"
              payload: { account_id: "${acct}", container_type_id: "${ct}", site_address: "5 Main", requested_delivery_date: "2026-06-01" }
              as: Contractor
              as_user_id: "${acct}"
              captures: { ord: $.data.id }
            - call: "GET /service-stops?order_id=${ord}&stop_type=DELIVERY"
              payload: {}
              as: Dispatcher
              captures: { del_stop: "$.data[0].id" }
            - call: "POST /routes"
              payload: { service_date: "2026-06-01", truck_code: "TRKc", capacity_stops: 5 }
              as: Dispatcher
              captures: { r1: $.data.id, r1_v: $.data.version }
            - call: "POST /rental-orders/${ord}/dispatch-delivery"
              payload: { container_id: "${cont}", expected_container_version: "${cont_v}" }
              as: Dispatcher
            - call: "POST /routes/${r1}/stops"
              payload: { service_stop_id: "${del_stop}", expected_route_version: "${r1_v}" }
              as: Dispatcher
            - call: "POST /routes/${r1}/dispatch"
              payload: {}
              as: Dispatcher
            - call: "POST /service-stops/${del_stop}/complete"
              payload: {}
              as: Dispatcher
            - call: "POST /routes/${r1}/close"
              payload: {}
              as: Dispatcher
            - call: "POST /_clock/set-current-date"
              payload: { current_date: "2026-06-08" }
              as: YardAdmin
            - call: "POST /rental-orders/${ord}/pickup-stop"
              payload: { estimated_weight_lbs: 3000 }
              as: Dispatcher
              captures: { pu_stop: $.data.id }
            - call: "POST /routes"
              payload: { service_date: "2026-06-08", truck_code: "TRKd", capacity_stops: 5 }
              as: Dispatcher
              captures: { r2: $.data.id, r2_v: $.data.version }
            - call: "POST /routes/${r2}/stops"
              payload: { service_stop_id: "${pu_stop}", expected_route_version: "${r2_v}" }
              as: Dispatcher
            - call: "POST /routes/${r2}/dispatch"
              payload: {}
              as: Dispatcher
            - call: "POST /weigh-tickets"
              payload: { order_id: "${ord}", service_stop_id: "${pu_stop}", gross_weight_lbs: 13000, tare_weight_lbs: 10000 }
              as: ScaleOperator
            - call: "POST /service-stops/${pu_stop}/complete"
              payload: {}
              as: Dispatcher
            - call: "GET /invoices?order_id=${ord}"
              payload: {}
              as: BillingClerk
              captures: { inv: "$.data[0].id" }
            - call: "POST /invoices/${inv}/pay"
              payload: {}
              as: BillingClerk
          trigger:
            - call: "POST /invoices/${inv}/pay"
              payload: {}
              as: BillingClerk
              captures: { err: $.data.error_id }
          assert:
            - "trigger response status == 409"
            - "trigger response data.error_id == ERR_INVOICE_NOT_ISSUED"

      - name: cancel_completed_order_terminal_lockdown
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.RentalOrder.SCHEDULED_to_CANCELLED
          - errors[ERR_ORDER_NOT_CANCELLABLE]
