  # ---------------------------------------------------------------------------
  # Rule 4 — transitive_cascade: cascade A originates at payment disburse
  # (depth 4: payment -> CAP rollup -> CAP COMPLETED -> finding CLOSED ->
  # run.open_finding_count); cascade B originates at exception approve
  # (depth 3: approve -> officer aggregates -> tier RED -> sibling exceptions
  # ESCALATED). Different triggering transitions.
  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: disburse_to_cap_complete_to_finding_close_to_run_rollup
        grounds:
          - state_machines.RemediationPayment.PENDING_to_DISBURSED
          - state_machines.CorrectiveActionPlan.EXECUTING_to_COMPLETED
          - state_machines.DisparityFinding.SUBSTANTIATED_to_CLOSED
          - calculations.cap_funds_rollup
        distinguishing_aspect: |
          Originating trigger is POST /remediation-payments/{id}/disburse; the
          chain runs depth 4 where each link is caused by the previous link's
          mutation: second disburse -> CAP funds rollup recomputes -> CAP
          auto-COMPLETED (all children terminal, >= 1 DISBURSED) -> finding
          auto-CLOSED -> AnalysisRun.open_finding_count decremented 1 -> 0.
        test_recipe:
          setup:
            - "Run R COMPUTED over 3 VALIDATED ORIGINATED apps (1 CONTROL + 2 PROTECTED_1), no auto-findings"
            - "Manual finding F kind=PRICING_DISPARITY SUBSTANTIATED with harmed [p1, p2]"
            - "CAP C pool_cents=2000 approved by officer-1 -> EXECUTING with payments [1000 (p1), 1000 (p2)] PENDING; first payment already DISBURSED by specialist-1"
          setup_api_calls:
            - { call: "POST /fair-lending/markets", payload: { name: "Metro One", msa_code: "M001", protected_group_population_share: 0.40, peer_group_code: "PG7" }, as: BankAdmin, captures: { m1: $.data.id } }
