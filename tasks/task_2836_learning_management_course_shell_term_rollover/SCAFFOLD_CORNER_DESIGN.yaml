              as: LmsAdmin
              as_user_id: "adm-1"
              captures: { t8_v5: $.data.version }
            - call: "POST /continuity-windows"
              payload: { term_id: "${t8}", shell_id: "${sh8}", kind: "MAINTENANCE", window_start: "2027-07-06T00:00:00Z", window_end: "2027-07-07T00:00:00Z", expected_term_version: "${t8_v4}" }
              as: LmsAdmin
              as_user_id: "adm-1"
              captures: { win_err_3: $.data.error_id }
            - call: "POST /continuity-windows"
              payload: { term_id: "${t8}", shell_id: "${sh8}", kind: "MAINTENANCE", window_start: "2027-07-06T00:00:00Z", window_end: "2027-07-07T00:00:00Z", expected_term_version: "${t8_v5}" }
              as: LmsAdmin
              as_user_id: "adm-1"
              captures: { win_c: $.data.id, win_c_kind: $.data.kind, win_c_heads: $.data.affected_enrollment_count }
            - call: "GET /continuity-windows"
              payload: { term_id: "${t8}", window_state: "OPEN" }
              as: Registrar
              as_user_id: "reg-1"
              captures: { first_win: "$.data[0].kind" }
          assert:
            - "setup literals: ${t8_v1} == 1, ${t8_v2} == 2, ${t8_v3} == 3 with ${t8_state} == IN_SESSION, ${sh8_state} == PROVISIONED, ${e8_state} == ACTIVE and ${t8_heads} == 1"
            - "${win_err_1} == ERR_STALE_VERSION at HTTP 412 for expected_term_version 2 — the interval, the kind and the posture are all legal, so only the version explains the 412"
            - "${win_a_state} == OPEN with ${win_a_heads} == 1 (a term-wide window snapshots total_active_enrollments) and ${win_a_ext} == 0 (extension_days_granted is 0 for every kind except EXTENSION)"
            - "${t8_v4} == 4 while ${t8_state_mid} == IN_SESSION and ${t8_posture_mid} == NORMAL — the create incremented the TERM's version without touching either state dimension"
            - "${win_err_2} == ERR_STALE_VERSION at HTTP 412: version 3 was consumed by the client's OWN previous success, so this rule self-invalidates in a way the shell-parented rules never do"
            - "${win_b_state} == OPEN with ${win_b_heads} == 1 once version 4 is used, and ${t8_v5} == 5 — every accepted window advances the term by exactly one"
            - "${win_err_3} == ERR_STALE_VERSION at HTTP 412 for the shell-scoped MAINTENANCE window on version 4 — the guard reads the TERM's version even when the window names a shell"
            - "${win_c_kind} == MAINTENANCE with ${win_c_heads} == 1 (shell.active_enrollment_count) on version 5, and it may overlap the OUTAGE window because overlap is scoped per (shell_id, kind)"
            - "GET /continuity-windows for the term with window_state=OPEN returns total_count 3 with ${first_win} == OUTAGE (created_at ASC)"

      - name: purged_shells_stay_readable_by_id_but_drop_out_of_the_default_listing
        claim_type: soft_delete
        grounds:
          - state_machines.CourseShell.provisioning_state.ARCHIVED_to_PURGED
          - endpoints[GET /course-shells]
          - endpoints[GET /course-shells/{id}]
          - endpoints[GET /content-items]
          - calculations[sandbox_storage_chargeback]
          - entities[CourseShell].provisioning_state
        distinguishing_aspect: "PURGED is a soft delete with three separable consequences that an implementation can get individually wrong: the row and its ContentItem children survive and are still readable by id, the shell disappears from GET /course-shells unless provisioning_state=PURGED is passed EXPLICITLY (so the filter is not merely 'match the state'), and the shell leaves the chargeback input set so its owner's bill drops from 4.20 to 1.20. A hard delete fails the id reads; a plain state filter fails the listing; a purge that only zeroes storage_mb without removing the shell from billable_shells still reports 1.20 here but 3.00 - 3.00 + 1.20 ... only because both roads happen to meet, so the instance also pins the surviving item rows (copy_state SKIPPED, storage_mb 0.00) that distinguish them."
        test_recipe:
          setup:
            - "Term SD-2026-FA (term_end_at 2026-12-11T00:00:00Z, access_grace_days 0, STANDARD) so student_access_end_at is 2026-12-11T23:59:59Z and retention_purge_at is 2027-12-11T23:59:59Z."
            - "One professor owns two SANDBOX shells: SD-SBX-001 holds a 300.00 MB file, SD-SBX-002 holds a 180.00 MB file. Chargeback = round_half_up((300.00 - 100.00) * 0.015 * 1.00, 2) + round_half_up((180.00 - 100.00) * 0.015 * 1.00, 2) = 3.00 + 1.20 = 4.20."
