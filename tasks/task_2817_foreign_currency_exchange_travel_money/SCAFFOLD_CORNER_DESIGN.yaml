          - endpoints."POST /exchange-transactions/{id}/settle"
        distinguishing_aspect: "The post-credit vault ceiling is a settlement-time check on the projected balance, so both BUY deals authorize while the branch sits at 8696 bps: settling the 2-note deal is refused with ERR_VAULT_LIMIT_WOULD_EXCEED because it would reach 108696 cents against a 100000-cent limit, settling the 1-note deal succeeds at exactly 97826 cents, and the refused deal still fails afterwards because the projection now starts higher."
