  # complexity_layers selector_policy and ops_run_checkpoint have no row in the
  # claim-extraction guide's cross-cutting table; their corners are enumerated in the
  # calculations section (navigator_selector, ei_program_selector) and in the
  # state_machines / endpoints sections (the reporting-period close run) instead.
  - section: cross_cutting_complexity_layers
    instances:
      - name: stale_expected_infant_version_on_episode_create_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.episode-create-stale-infant
          - "errors[ERR_STALE_INFANT_VERSION]"
          - validations.priority_8_occ_infant
        distinguishing_aspect: "A contact-preferences patch between the read and the write bumps Infant.version from 2 to 3, so the episode create carrying 2 is 412 ERR_STALE_INFANT_VERSION and supersedes nothing; re-reading the version and retrying succeeds and takes the infant to version 4."
        test_recipe:
          setup:
            - "BH1 (BIRTH_HOSPITAL, R1) with screener S1; AC1 (AUDIOLOGY_CLINIC, R1) with navigator N1; INPATIENT infant screened BIRTH_ADMISSION REFER/REFER (infant at version 2 with an open RESCREEN episode); clock 2026-08-01T06:00:00Z. A phone-number patch is then applied to move the version on."
          setup_api_calls:
            - call: "POST /facilities"
              payload: { name: "BH1", facility_type: "BIRTH_HOSPITAL", region_code: "R1" }
              as: ProgramAdmin
              captures: { bh_id: "$.data.id" }
            - call: "POST /providers"
              payload: { facility_id: "${bh_id}", provider_type: "SCREENER", full_name: "S1", region_code: "R1" }
              as: ProgramAdmin
              captures: { s1_id: "$.data.id" }
            - call: "POST /facilities"
              payload: { name: "AC1", facility_type: "AUDIOLOGY_CLINIC", region_code: "R1" }
              as: ProgramAdmin
              captures: { ac_id: "$.data.id" }
            - call: "POST /providers"
              payload: { facility_id: "${ac_id}", provider_type: "NAVIGATOR", full_name: "N1", region_code: "R1" }
              as: ProgramAdmin
              captures: { n1_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T06:00:00Z" }
              as: ProgramAdmin
            - call: "POST /infants"
              payload: { birth_facility_id: "${bh_id}", birth_datetime: "2026-08-01T00:00:00Z", birth_setting: "INPATIENT", gestational_age_weeks: 39, guardian_name: "G-OC", guardian_contact_phone: "5556601" }
              as: FacilityScreener
              as_user_id: "${s1_id}"
              captures: { ioc_id: "$.data.id" }
            - call: "POST /screening-encounters"
              payload: { infant_id: "${ioc_id}", facility_id: "${bh_id}", performed_by_provider_id: "${s1_id}", encounter_type: "BIRTH_ADMISSION", method: "AABR", performed_at: "2026-08-01T04:00:00Z", left_ear_result: "REFER", right_ear_result: "REFER" }
              as: FacilityScreener
              as_user_id: "${s1_id}"
            - call: "GET /follow-up-episodes"
              payload: { infant_id: "${ioc_id}" }
              as: ProgramAdmin
              captures: { ep_rescreen_id: "$.data[0].id" }
            - call: "GET /infants/${ioc_id}"
              payload: {}
              as: Navigator
              as_user_id: "${n1_id}"
              captures: { v_stale: "$.data.version" }
            - call: "PATCH /infants/${ioc_id}/contact-preferences"
              payload: { guardian_contact_phone: "5556699" }
