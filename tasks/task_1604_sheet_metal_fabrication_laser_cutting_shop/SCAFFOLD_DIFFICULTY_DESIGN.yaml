# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN — §1.8 Test Targeting Index
# Sheet-Metal Fabrication & Laser Cutting Shop
# =============================================================================
scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: quote_line_material_quoted_vs_committed_diverge
        grounds:
          - calculations.quote_line_pricing
          - calculations.nest_and_yield
          - calculations.order_commit_totals
        distinguishing_aspect: |
          Same line data priced twice by two valid algorithms on the QUOTE/ORDER
          domain: QUOTED (per-part minimum-billing area 2200 cm2 -> 128 cents)
          vs COMMITTED (order-level nested plate 11000 cm2 apportioned -> 638
          cents per part) produce different material_cost_cents and different
          order totals (28540 vs 34650).
        test_recipe:
          setup:
            - "Grade AL5052: base_cut_rate 2.0, hardness 1.15 -> effective 2.0*1.15... pinned instead as hardness_factor 1.0 via fixture grade AL-T (see payload); material cost 0.058/cm2; tiers [{max 1.0, idx 0},{max 2.0, idx 1},{max 3.2, idx 2}]"
            - "Customer with credit_limit 100000000; stock: 1 full sheet 1200x2400 of the grade at 1.0mm"
            - "Quote EXPEDITE with one line: 300x200, 5 holes d20, 2 fillets, 4 bends, qty 10"
          setup_api_calls:
            - call: "POST /fab/material-grades"
              payload: { code: "AL-T", alloy_family: "ALUMINUM", density_g_per_cm3: 2.70, hardness_factor: 1.0, base_cut_rate_cents_per_sec: 2.0, material_cost_cents_per_cm2: 0.058, scrap_rate_cents_per_cm2: 0.020, thickness_tiers: [{max_thickness_mm: 1.0, tier_index: 0}, {max_thickness_mm: 2.0, tier_index: 1}, {max_thickness_mm: 3.2, tier_index: 2}], weld_compatible: true, powder_compatible: true }
              as: ShopManager
              captures: { grade_id: $.data.id }
            - call: "POST /fab/customers"
              payload: { company_name: "Acme", email: "acme@x.com", credit_limit_cents: 100000000 }
              as: ShopManager
              captures: { cust_id: $.data.id }
            - call: "POST /fab/sheet-stock"
              payload: { grade_id: "${grade_id}", thickness_mm: 1.0, width_mm: 1200, height_mm: 2400 }
              as: InventoryClerk
            - call: "POST /fab/machines"
              payload: { name: "Laser-1", station: "LASER", shift_minutes_per_day: 480 }
              as: ShopManager
            - call: "POST /fab/machines"
              payload: { name: "Brake-1", station: "BRAKE", shift_minutes_per_day: 480 }
              as: ShopManager
            - call: "POST /fab/quotes"
              payload: { customer_id: "${cust_id}", expedite_tier: "EXPEDITE", lines: [{ grade_id: "${grade_id}", thickness_mm: 1.0, bbox_width_mm: 300, bbox_height_mm: 200, hole_count: 5, hole_diameter_mm: 20, corner_fillet_count: 2, bend_count: 4, weld_inches: 0, finish: "NONE", qty: 10 }] }
              as: Estimator
              captures: { quote_id: $.data.id, quote_v0: $.data.version }
            - call: "POST /fab/quotes/${quote_id}/price"
              payload: { expected_quote_version: "${quote_v0}" }
              as: Estimator
              captures: { quoted_total: $.data.quoted_total_cents, quote_v1: $.data.version }
            - call: "POST /fab/quotes/${quote_id}/submit"
              payload: {}
              as: Estimator
          trigger:
            - call: "POST /fab/quotes/${quote_id}/accept"
              payload: {}
              as: CustomerRep
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id, committed_total: $.data.committed_total_cents, plate_area: $.data.total_plate_area_cm2 }
          assert:
            - "Quote.${quote_id}.quoted_total_cents == 28540"
            - "FabricationOrder.${order_id}.total_plate_area_cm2 == 11000"
            - "FabricationOrder.${order_id}.committed_total_cents == 34650"
            - "committed_total_cents != quoted_total_cents (delta 6110 = nesting-loss metric absorbed by shop)"

      - name: remnant_yield_scrap_path_vs_inventory_path_diverge
        grounds:
          - calculations.nest_and_yield
          - calculations.scrap_credit_posting
        distinguishing_aspect: |
          Same nest offcut valued two valid ways in the INVENTORY domain: kept
          as REMNANT stock (carrying value 0, reusable, no credit) versus
          surrendered for scrap credit (16200 cm2 * 0.020 = 324 cents credited) —
          the offcut's value depends on which disposition path is chosen, and
          both paths mutate Customer.scrap_credit_balance_cents differently.
        test_recipe:
          setup:
            - "Same nest as the dual-variant pricing instance: 10x 300x200 on 1200x2400 produces a top-strip remnant 1800x900 = 16200 cm2 (>= 2000 so it enters inventory)"
            - "Order accepted and completed through routing+inspection so the remnant exists as AVAILABLE stock"
          setup_api_calls:
            - call: "POST /fab/material-grades"
              payload: { code: "AL-T2", alloy_family: "ALUMINUM", density_g_per_cm3: 2.70, hardness_factor: 1.0, base_cut_rate_cents_per_sec: 2.0, material_cost_cents_per_cm2: 0.058, scrap_rate_cents_per_cm2: 0.020, thickness_tiers: [{max_thickness_mm: 1.0, tier_index: 0}], weld_compatible: true, powder_compatible: true }
              as: ShopManager
              captures: { grade_id: $.data.id }
            - call: "POST /fab/customers"
              payload: { company_name: "Beta", email: "beta@x.com", credit_limit_cents: 100000000 }
              as: ShopManager
              captures: { cust_id: $.data.id }
            - call: "POST /fab/sheet-stock"
              payload: { grade_id: "${grade_id}", thickness_mm: 1.0, width_mm: 1200, height_mm: 2400 }
              as: InventoryClerk
              captures: { sheet_id: $.data.id }
            - call: "POST /fab/machines"
              payload: { name: "L1", station: "LASER", shift_minutes_per_day: 480 }
              as: ShopManager
            - call: "POST /fab/machines"
              payload: { name: "B1", station: "BRAKE", shift_minutes_per_day: 480 }
              as: ShopManager
            - call: "POST /fab/quotes"
              payload: { customer_id: "${cust_id}", expedite_tier: "STANDARD", lines: [{ grade_id: "${grade_id}", thickness_mm: 1.0, bbox_width_mm: 300, bbox_height_mm: 200, hole_count: 5, hole_diameter_mm: 20, corner_fillet_count: 2, bend_count: 4, weld_inches: 0, finish: "NONE", qty: 10 }] }
              as: Estimator
              captures: { quote_id: $.data.id, quote_v0: $.data.version }
            - call: "POST /fab/quotes/${quote_id}/price"
              payload: { expected_quote_version: "${quote_v0}" }
              as: Estimator
            - call: "POST /fab/quotes/${quote_id}/submit"
              payload: {}
              as: Estimator
            - call: "POST /fab/quotes/${quote_id}/accept"
              payload: {}
              as: CustomerRep
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
            - call: "GET /fab/sheet-stock"
              payload: { source_order_id: "${order_id}", kind: "REMNANT" }
              as: InventoryClerk
              captures: { remnant_id: "$.data[0].id" }
          trigger:
            - call: "POST /fab/scrap-credits"
              payload: { customer_id: "${cust_id}", sheet_stock_id: "${remnant_id}" }
              as: InventoryClerk
              captures: { credit_cents: $.data.credit_cents, credited_area: $.data.credited_area_cm2 }
            - call: "GET /fab/customers/${cust_id}"
              payload: {}
              as: ShopManager
              captures: { balance: $.data.scrap_credit_balance_cents }
          assert:
            - "ScrapCredit.credited_area_cm2 == 2880 (min(16200, 0.10*28800 = 2880, 90000))"
            - "ScrapCredit.credit_cents == 58 (round_half_up(2880 * 0.020) = 57.6 -> 58)"
            - "Customer.${cust_id}.scrap_credit_balance_cents == 58"
            - "SheetStock.${remnant_id}.status != AVAILABLE — surrendered out of the reusable pool (kept-path alternative would leave it AVAILABLE with balance 0)"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: full_quote_formula_five_inputs_nonlinear
        grounds:
          - calculations.quote_line_pricing
          - calculations.expedite_surcharge
        distinguishing_aspect: |
          Mode (a): >= 3 inputs with non-linear interaction — cut-time (pierce +
          length), tier-indexed cut rate, bend units (thickness class +
          complexity class branch), tiered qty discount (boundary inclusive),
          and expedite multiplier applied post-discount; reordering any two
          steps changes the cents.
        test_recipe:
          setup:
            - "Grade as pinned; quote EXPEDITE; single line 300x200 / 5 holes / 2 fillets / 4 bends / qty 10"
          setup_api_calls:
            - call: "POST /fab/material-grades"
              payload: { code: "AL-T3", alloy_family: "ALUMINUM", density_g_per_cm3: 2.70, hardness_factor: 1.0, base_cut_rate_cents_per_sec: 2.0, material_cost_cents_per_cm2: 0.058, scrap_rate_cents_per_cm2: 0.020, thickness_tiers: [{max_thickness_mm: 1.0, tier_index: 0}, {max_thickness_mm: 2.0, tier_index: 1}], weld_compatible: true, powder_compatible: true }
              as: ShopManager
              captures: { grade_id: $.data.id }
            - call: "POST /fab/customers"
              payload: { company_name: "Gamma", email: "g@x.com", credit_limit_cents: 100000000 }
              as: ShopManager
              captures: { cust_id: $.data.id }
            - call: "POST /fab/quotes"
              payload: { customer_id: "${cust_id}", expedite_tier: "EXPEDITE", lines: [{ grade_id: "${grade_id}", thickness_mm: 1.0, bbox_width_mm: 300, bbox_height_mm: 200, hole_count: 5, hole_diameter_mm: 20, corner_fillet_count: 2, bend_count: 4, weld_inches: 0, finish: "NONE", qty: 10 }] }
              as: Estimator
              captures: { quote_id: $.data.id, quote_v0: $.data.version }
          trigger:
            - call: "POST /fab/quotes/${quote_id}/price"
              payload: { expected_quote_version: "${quote_v0}" }
              as: Estimator
              captures: { subtotal: $.data.quoted_subtotal_cents, exp_charge: $.data.quoted_expedite_cents, total: $.data.quoted_total_cents }
            - call: "GET /fab/quotes/${quote_id}/lines"
              payload: {}
              as: Estimator
              captures: { line_cut_s: "$.data[0].billed_cut_seconds", line_bend_units: "$.data[0].bend_units", line_base: "$.data[0].line_base_cents", line_total: "$.data[0].line_total_cents", line_disc: "$.data[0].qty_discount_pct" }
          assert:
            - "billed_cut_seconds == 75 (ceil(74.337))"
            - "bend_units == 8 (4 bends * (1 + thickness_class 1 + complexity 0); tier_index 0 -> class 1, 2 fillets < 4 -> complexity 0)"
            - "line_base_cents == 2378 (150 cut + 1200 bend + 0 finish + 128 material + 900 setup)"
            - "qty_discount_pct == 0.04"
            - "line_total_cents == 2854 (round_half_up(round_half_up(2378*0.96)=2283 * 1.25))"
            - "Quote.quoted_subtotal_cents == 22830; quoted_expedite_cents == 5710; quoted_total_cents == 28540"

      - name: scrap_credit_waterfall_split_remainder_rounding
        grounds:
          - calculations.scrap_credit_application
          - calculations.scrap_credit_posting
        distinguishing_aspect: |
          Mode (b): nested rounding where order matters — per-event credit uses
          round_half_up(area * rate) per POSTED row, then the payment waterfall
          drains rows FIFO whole and splits the final row; summing-then-rounding
          (58+58=116 applied as one) vs round-per-row-then-split (apply 100 from
          two 58-rows: first row 58 fully + second row split 42/16) leaves a
          different remainder row and balance.
        test_recipe:
          setup:
            - "Customer with two POSTED scrap credits of 58 cents each (two drop-offs of 2880 cm2 at 0.020)"
            - "A COMPLETED, UNPAID order with committed_total 949 (RUSH small part) belonging to the customer"
          setup_api_calls:
            - call: "POST /fab/material-grades"
              payload: { code: "AL-T4", alloy_family: "ALUMINUM", density_g_per_cm3: 2.70, hardness_factor: 1.0, base_cut_rate_cents_per_sec: 2.0, material_cost_cents_per_cm2: 0.058, scrap_rate_cents_per_cm2: 0.020, thickness_tiers: [{max_thickness_mm: 1.0, tier_index: 0}], weld_compatible: true, powder_compatible: true }
              as: ShopManager
              captures: { grade_id: $.data.id }
            - call: "POST /fab/customers"
              payload: { company_name: "Delta", email: "d@x.com", credit_limit_cents: 100000000 }
              as: ShopManager
              captures: { cust_id: $.data.id }
            - call: "POST /fab/sheet-stock"
              payload: { grade_id: "${grade_id}", thickness_mm: 1.0, width_mm: 1200, height_mm: 2400 }
              as: InventoryClerk
              captures: { sheet1: $.data.id }
            - call: "POST /fab/sheet-stock"
              payload: { grade_id: "${grade_id}", thickness_mm: 1.0, width_mm: 1200, height_mm: 2400 }
              as: InventoryClerk
              captures: { sheet2: $.data.id }
            - call: "POST /fab/scrap-credits"
              payload: { customer_id: "${cust_id}", sheet_stock_id: "${sheet1}" }
              as: InventoryClerk
              captures: { credit1: $.data.id }
            - call: "POST /fab/scrap-credits"
              payload: { customer_id: "${cust_id}", sheet_stock_id: "${sheet2}" }
              as: InventoryClerk
              captures: { credit2: $.data.id }
            - call: "POST /fab/sheet-stock"
              payload: { grade_id: "${grade_id}", thickness_mm: 1.0, width_mm: 1200, height_mm: 2400 }
              as: InventoryClerk
            - call: "POST /fab/machines"
              payload: { name: "L2", station: "LASER", shift_minutes_per_day: 480 }
              as: ShopManager
            - call: "POST /fab/quotes"
              payload: { customer_id: "${cust_id}", expedite_tier: "RUSH", lines: [{ grade_id: "${grade_id}", thickness_mm: 1.0, bbox_width_mm: 20, bbox_height_mm: 20, hole_count: 0, corner_fillet_count: 1, bend_count: 0, weld_inches: 0, finish: "NONE", qty: 1 }] }
              as: Estimator
              captures: { quote_id: $.data.id, quote_v0: $.data.version }
            - call: "POST /fab/quotes/${quote_id}/price"
              payload: { expected_quote_version: "${quote_v0}" }
              as: Estimator
            - call: "POST /fab/quotes/${quote_id}/submit"
              payload: {}
              as: Estimator
            - call: "POST /fab/quotes/${quote_id}/accept"
              payload: {}
              as: CustomerRep
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
            - call: "POST /fab/orders/${order_id}/release"
              payload: {}
              as: ProductionPlanner
            - call: "GET /fab/orders/${order_id}/routing-steps"
              payload: {}
              as: ProductionPlanner
              captures: { step1: "$.data[0].id" }
            - call: "POST /fab/routing-steps/${step1}/complete"
              payload: {}
              as: MachineOperator
            - call: "POST /fab/orders/${order_id}/inspection-reports"
              payload: { flatness_deviation_mm: 0.5, measured_diagonal_mm: 400, dimensional_pass: true }
              as: QCInspector
          trigger:
            - call: "POST /fab/orders/${order_id}/payment"
              payload: { scrap_credit_to_apply_cents: 100 }
              as: CustomerRep
              as_user_id: "${cust_id}"
              captures: { applied: $.data.scrap_credit_applied_cents }
            - call: "GET /fab/customers/${cust_id}"
              payload: {}
              as: ShopManager
              captures: { balance: $.data.scrap_credit_balance_cents }
            - call: "GET /fab/scrap-credits"
              payload: { customer_id: "${cust_id}" }
              as: ShopManager
              captures: { credit1_status: "$.data[0].status", credit2_status: "$.data[1].status" }
          assert:
            - "FabricationOrder.${order_id}.scrap_credit_applied_cents == 100"
            - "Customer.${cust_id}.scrap_credit_balance_cents == 16 (116 - 100)"
            - "ScrapCredit.${credit1}.status == APPLIED (FIFO first, whole 58)"
            - "ScrapCredit.${credit2}.status == APPLIED with split: original becomes APPLIED for 42 and a VOID remainder row of 16 exists (sum APPLIED + VOID remainder == 116, conservation)"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: quote_submit_revise_resubmit_cycle
        grounds:
          - state_machines.Quote.SUBMITTED_to_DRAFT
          - state_machines.Quote.PRICED_to_SUBMITTED
        distinguishing_aspect: |
          Quote has a cyclic revision loop SUBMITTED -> DRAFT -> PRICED ->
          SUBMITTED with revision_count increment and line reset to ESTIMATED on
          each loop; expiry timestamps from the first submission are cleared and
          re-stamped.
        test_recipe:
          setup:
            - "Priced, submitted quote (STANDARD, simple line)"
          setup_api_calls:
            - call: "POST /fab/material-grades"
              payload: { code: "AL-T5", alloy_family: "ALUMINUM", density_g_per_cm3: 2.70, hardness_factor: 1.0, base_cut_rate_cents_per_sec: 2.0, material_cost_cents_per_cm2: 0.058, scrap_rate_cents_per_cm2: 0.020, thickness_tiers: [{max_thickness_mm: 1.0, tier_index: 0}], weld_compatible: true, powder_compatible: true }
              as: ShopManager
              captures: { grade_id: $.data.id }
            - call: "POST /fab/customers"
              payload: { company_name: "Eps", email: "e@x.com", credit_limit_cents: 100000000 }
              as: ShopManager
              captures: { cust_id: $.data.id }
            - call: "POST /fab/quotes"
              payload: { customer_id: "${cust_id}", expedite_tier: "STANDARD", lines: [{ grade_id: "${grade_id}", thickness_mm: 1.0, bbox_width_mm: 100, bbox_height_mm: 100, hole_count: 0, corner_fillet_count: 0, bend_count: 0, weld_inches: 0, finish: "NONE", qty: 1 }] }
              as: Estimator
              captures: { quote_id: $.data.id, quote_v0: $.data.version }
            - call: "POST /fab/quotes/${quote_id}/price"
              payload: { expected_quote_version: "${quote_v0}" }
              as: Estimator
              captures: { quote_v1: $.data.version }
            - call: "POST /fab/quotes/${quote_id}/submit"
              payload: {}
              as: Estimator
              captures: { first_submitted_at: $.data.submitted_at }
          trigger:
            - call: "POST /fab/quotes/${quote_id}/revise"
              payload: {}
              as: Estimator
              captures: { rev_count: $.data.revision_count, status_after_revise: $.data.status }
            - call: "GET /fab/quotes/${quote_id}"
              payload: {}
              as: Estimator
              captures: { quote_v2: $.data.version }
            - call: "POST /fab/quotes/${quote_id}/price"
              payload: { expected_quote_version: "${quote_v2}" }
              as: Estimator
            - call: "POST /fab/quotes/${quote_id}/submit"
              payload: {}
              as: Estimator
              captures: { second_submitted_at: $.data.submitted_at, status_final: $.data.status }
          assert:
            - "status after revise == DRAFT and revision_count == 1"
            - "all QuoteLine rows back to ESTIMATED after revise"
            - "second submit succeeds and stamps a new submitted_at == logical clock (cycle is repeatable, not one-shot)"

      - name: order_inspection_fail_rework_loop
        grounds:
          - state_machines.FabricationOrder.INSPECTION_to_IN_PRODUCTION
          - state_machines.RoutingStep.COMPLETED_to_PENDING
        distinguishing_aspect: |
          FabricationOrder loops INSPECTION -> IN_PRODUCTION on FAIL (rework),
          resetting implicated RoutingSteps COMPLETED -> PENDING — a cycle on
          the ORDER entity (distinct from Quote's cycle) whose loop count is
          unbounded and whose re-entry re-books capacity.
        test_recipe:
          setup:
            - "Accepted+released order with a LASER-only routing (simple part), order reaches INSPECTION"
          setup_api_calls:
            - call: "POST /fab/material-grades"
              payload: { code: "AL-T6", alloy_family: "ALUMINUM", density_g_per_cm3: 2.70, hardness_factor: 1.0, base_cut_rate_cents_per_sec: 2.0, material_cost_cents_per_cm2: 0.058, scrap_rate_cents_per_cm2: 0.020, thickness_tiers: [{max_thickness_mm: 1.0, tier_index: 0}], weld_compatible: true, powder_compatible: true }
              as: ShopManager
              captures: { grade_id: $.data.id }
            - call: "POST /fab/customers"
              payload: { company_name: "Zeta", email: "z@x.com", credit_limit_cents: 100000000 }
              as: ShopManager
              captures: { cust_id: $.data.id }
            - call: "POST /fab/sheet-stock"
              payload: { grade_id: "${grade_id}", thickness_mm: 1.0, width_mm: 1200, height_mm: 2400 }
              as: InventoryClerk
            - call: "POST /fab/machines"
              payload: { name: "L3", station: "LASER", shift_minutes_per_day: 480 }
              as: ShopManager
            - call: "POST /fab/quotes"
              payload: { customer_id: "${cust_id}", expedite_tier: "STANDARD", lines: [{ grade_id: "${grade_id}", thickness_mm: 1.0, bbox_width_mm: 100, bbox_height_mm: 100, hole_count: 0, corner_fillet_count: 0, bend_count: 0, weld_inches: 0, finish: "NONE", qty: 1 }] }
              as: Estimator
              captures: { quote_id: $.data.id, quote_v0: $.data.version }
            - call: "POST /fab/quotes/${quote_id}/price"
              payload: { expected_quote_version: "${quote_v0}" }
              as: Estimator
            - call: "POST /fab/quotes/${quote_id}/submit"
              payload: {}
              as: Estimator
            - call: "POST /fab/quotes/${quote_id}/accept"
              payload: {}
              as: CustomerRep
              as_user_id: "${cust_id}"
              captures: { order_id: $.data.id }
            - call: "POST /fab/orders/${order_id}/release"
              payload: {}
              as: ProductionPlanner
            - call: "GET /fab/orders/${order_id}/routing-steps"
              payload: {}
              as: ProductionPlanner
              captures: { laser_step: "$.data[0].id" }
            - call: "POST /fab/routing-steps/${laser_step}/complete"
              payload: {}
              as: MachineOperator
          trigger:
            - call: "POST /fab/orders/${order_id}/inspection-reports"
              payload: { flatness_deviation_mm: 0.8, measured_diagonal_mm: 400, dimensional_pass: true }
              as: QCInspector
              captures: { result1: $.data.result }
            - call: "GET /fab/orders/${order_id}"
              payload: {}
              as: ProductionPlanner
              captures: { status_mid: $.data.status }
            - call: "GET /fab/orders/${order_id}/routing-steps"
              payload: {}
              as: ProductionPlanner
              captures: { laser_step_status: "$.data[0].status" }
          assert:
            - "InspectionReport.result == FAIL (0.8/400 = 0.002 > 0.0015)"
            - "FabricationOrder.${order_id}.status == IN_PRODUCTION (rework loop, not terminal)"
            - "RoutingStep.${laser_step}.status == PENDING (reset from COMPLETED; minutes re-reserved)"
            - "a second FAIL then a PASS completes the order — loop terminates only via PASS"

      - name: order_payment_parallel_dimension_independent
        grounds:
          - state_machines.FabricationOrder.COMPLETED_to_COMPLETED
        distinguishing_aspect: |
          Parallel state dimensions on one entity: payment_status (UNPAID->PAID)
          evolves independently of lifecycle status (COMPLETED); paying does not
          mutate lifecycle and a COMPLETED+UNPAID order is a stable observable
          state — third non-linear shape (parallel dimensions).
        test_recipe:
          setup:
            - "Order driven to COMPLETED via PASS inspection; payment untouched"
          setup_api_calls:
            - call: "POST /fab/material-grades"
              payload: { code: "AL-T7", alloy_family: "ALUMINUM", density_g_per_cm3: 2.70, hardness_factor: 1.0, base_cut_rate_cents_per_sec: 2.0, material_cost_cents_per_cm2: 0.058, scrap_rate_cents_per_cm2: 0.020, thickness_tiers: [{max_thickness_mm: 1.0, tier_index: 0}], weld_compatible: true, powder_compatible: true }
              as: ShopManager
              captures: { grade_id: $.data.id }
            - call: "POST /fab/customers"
              payload: { company_name: "Eta", email: "eta@x.com", credit_limit_cents: 100000000 }
