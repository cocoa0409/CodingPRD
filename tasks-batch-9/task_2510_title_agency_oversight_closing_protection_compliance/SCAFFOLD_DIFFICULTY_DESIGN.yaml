            - "${unremitted_before} == 60000000 and ${posture_before} == \"RESTRICTED\" and ${underwriter_share} == 12000000 and ${late_fee} == 0"
            - "hop 1: RemittanceStatement.${st_id}.status == \"SETTLED\" and settled_amount_cents == 12000000"
            - "hop 2: GET /policy-files?agency_id=${ag_id}&remittance_status=REMITTED returns total_count == 3"
            - "hop 3: ${unremitted_after} == 0"
            - "hop 4: ${posture_after} == \"OPEN\" (0 is no longer above the 50000000 unremitted tolerance)"
            - "${ea_status_after} == \"OPEN\" — the account was never RESTRICTED, so the conditional reopen hop is a no-op"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: cpl_request_frozen_posture_outranks_coverage_cap_returns_409
        grounds:
          - validations.priority_80.ERR_AGENCY_POSTURE_FROZEN
          - validations.priority_130.ERR_CPL_COVERAGE_CAP_EXCEEDED
          - errors.ERR_AGENCY_POSTURE_FROZEN
          - errors.ERR_CPL_COVERAGE_CAP_EXCEEDED
        distinguishing_aspect: |
          Conflict between category state (priority 80) and category
          business_fiscal (priority 130) on POST /closing-protection-letters:
          one request violates both, and the state error must win, so the
          response is 409 ERR_AGENCY_POSTURE_FROZEN and never 422
          ERR_CPL_COVERAGE_CAP_EXCEEDED.
        test_recipe:
          setup:
            - "APPOINTED agency in CA, then SUSPENDED, so oversight_posture is FROZEN."
            - "StateProgram.cpl_coverage_cap_cents is 100000000, and the request asks for 150000000, so the fiscal cap is also violated."
            - "Agency.version is read immediately before the trigger so the priority-70 OCC check passes and cannot mask either candidate."
          setup_api_calls:
            - call: "POST /state-programs"
              payload: { state_code: "CA", cpl_permitted: true, cpl_coverage_cap_cents: 100000000, cpl_scope_allowed: ["FULL_SETTLEMENT", "LENDER_ONLY", "SELLER_PROCEEDS"], premium_split_agency_pct: 0.80, policy_issuance_deadline_days: 30, three_way_tolerance_cents: 100000, counsel_referral_threshold_cents: 60000000 }
              as: ComplianceOfficer
              captures: { sp_ca_id: "$.data.id" }
            - call: "POST /agencies"
              payload: { legal_name: "Harbor Title Agency", tax_id: "TAX-1001", underwriting_authority_limit_cents: 50000000 }
              as: LicensingAnalyst
              captures: { ag_id: "$.data.id" }
            - call: "POST /agencies/${ag_id}/financial-review"
              payload: { submitted_eo_policy_limit_cents: 200000000, submitted_eo_expires_on: "2027-06-30", submitted_net_worth_cents: 20000000, submitted_fidelity_bond_cents: 10000000 }
              as: AgencyPrincipal
              as_user_id: "${ag_id}"
            - call: "POST /agencies/${ag_id}/financial-review-decision"
              payload: { decision: "ACCEPT" }
              as: LicensingAnalyst
            - call: "POST /agency-appointments"
              payload: { agency_id: "${ag_id}", state_program_id: "${sp_ca_id}", license_number: "CA-4477", license_expires_on: "2027-12-31" }
              as: LicensingAnalyst
              captures: { ap_ca_id: "$.data.id" }
            - call: "POST /agency-appointments/${ap_ca_id}/license-verification"
              payload: { decision: "VERIFY", verified_license_number: "CA-4477", verified_expires_on: "2027-12-31" }
              as: LicensingAnalyst
            - call: "POST /agencies/${ag_id}/appointment-decision"
              payload: { decision: "APPOINT" }
              as: LicensingAnalyst
            - call: "POST /agencies/${ag_id}/appointment-decision"
              payload: { decision: "SUSPEND", reason: "Market conduct examination open" }
              as: LicensingAnalyst
              as_user_id: "analyst-1"
              captures: { posture_frozen: "$.data.oversight_posture" }
            - call: "GET /agencies/${ag_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { ag_v_now: "$.data.version" }
          trigger:
            - call: "POST /closing-protection-letters"
              payload: { agency_id: "${ag_id}", state_program_id: "${sp_ca_id}", transaction_ref: "TXN-5", coverage_scope: "FULL_SETTLEMENT", requested_coverage_cents: 150000000, closing_date: "2026-08-20", lender_name: "Bay Federal", complex_title_flag: false, expected_agency_version: "${ag_v_now}" }
              as: AgencyPrincipal
              as_user_id: "${ag_id}"
          assert:
            - "${posture_frozen} == \"FROZEN\""
            - "trigger[0] returns HTTP 409 with data.error_id == \"ERR_AGENCY_POSTURE_FROZEN\""
            - "trigger[0] does not return \"ERR_CPL_COVERAGE_CAP_EXCEEDED\" even though requested_coverage_cents 150000000 exceeds the 100000000 state cap"
            - "GET /closing-protection-letters?agency_id=${ag_id} returns total_count == 0 (no letter row was created)"

      - name: policy_issue_eo_lapse_outranks_missing_appointment_returns_422
        grounds:
          - validations.priority_100.ERR_EO_COVERAGE_LAPSED
          - validations.priority_110.ERR_NO_ACTIVE_APPOINTMENT_IN_STATE
          - errors.ERR_EO_COVERAGE_LAPSED
          - errors.ERR_NO_ACTIVE_APPOINTMENT_IN_STATE
        distinguishing_aspect: |
          A different category pair — business_safety (priority 100) against
          business_referential (priority 110) — on a different endpoint (POST
          /policy-files/{id}/issuance-state). Both are violated, both map to
          HTTP 422, so only the error_id distinguishes them, and the safety
          error must win. E&O expiry deliberately does not feed the posture, so
          the priority-80 frozen check cannot mask this pair.
        test_recipe:
          setup:
            - "APPOINTED agency in CA whose accepted E&O expires 2026-06-30, already lapsed against the default clock 2026-08-01 (the financial review decision checks only limit and net worth, not expiry)."
            - "One PENDING policy file created while the appointment was still ACTIVE."
            - "The CA appointment then LAPSED, so no ACTIVE appointment exists for (agency, state)."
            - "Posture is OPEN: appointment_status APPOINTED, financial review ACCEPTED, standing COMPLIANT, no findings, unremitted 0."
          setup_api_calls:
            - call: "POST /state-programs"
              payload: { state_code: "CA", cpl_permitted: true, cpl_coverage_cap_cents: 100000000, cpl_scope_allowed: ["FULL_SETTLEMENT", "LENDER_ONLY", "SELLER_PROCEEDS"], premium_split_agency_pct: 0.80, policy_issuance_deadline_days: 30, three_way_tolerance_cents: 100000, counsel_referral_threshold_cents: 60000000 }
              as: ComplianceOfficer
              captures: { sp_ca_id: "$.data.id" }
            - call: "POST /agencies"
              payload: { legal_name: "Harbor Title Agency", tax_id: "TAX-1001", underwriting_authority_limit_cents: 50000000 }
              as: LicensingAnalyst
              captures: { ag_id: "$.data.id" }
            - call: "POST /agencies/${ag_id}/financial-review"
              payload: { submitted_eo_policy_limit_cents: 200000000, submitted_eo_expires_on: "2026-06-30", submitted_net_worth_cents: 20000000, submitted_fidelity_bond_cents: 10000000 }
              as: AgencyPrincipal
              as_user_id: "${ag_id}"
            - call: "POST /agencies/${ag_id}/financial-review-decision"
              payload: { decision: "ACCEPT" }
              as: LicensingAnalyst
            - call: "POST /agency-appointments"
              payload: { agency_id: "${ag_id}", state_program_id: "${sp_ca_id}", license_number: "CA-4477", license_expires_on: "2027-12-31" }
              as: LicensingAnalyst
              captures: { ap_ca_id: "$.data.id" }
            - call: "POST /agency-appointments/${ap_ca_id}/license-verification"
              payload: { decision: "VERIFY", verified_license_number: "CA-4477", verified_expires_on: "2027-12-31" }
              as: LicensingAnalyst
            - call: "POST /agencies/${ag_id}/appointment-decision"
              payload: { decision: "APPOINT" }
              as: LicensingAnalyst
            - call: "GET /agencies/${ag_id}"
              payload: {}
              as: ComplianceOfficer
              captures: { ag_v1: "$.data.version", posture_open: "$.data.oversight_posture" }
            - call: "POST /policy-files"
              payload: { agency_id: "${ag_id}", state_program_id: "${sp_ca_id}", order_number: "ORD-51", closing_date: "2026-07-20", liability_amount_cents: 40000000, gross_premium_cents: 500000, complex_title_flag: false, expected_agency_version: "${ag_v1}" }
              as: AgencyPrincipal
              as_user_id: "${ag_id}"
              captures: { pf_id: "$.data.id" }
            - call: "POST /agency-appointments/${ap_ca_id}/license-verification"
              payload: { decision: "LAPSE" }
              as: LicensingAnalyst
              captures: { ap_status: "$.data.status" }
          trigger:
            - call: "POST /policy-files/${pf_id}/issuance-state"
              payload: { to_state: "ISSUED", policy_number: "POL-51" }
              as: AgencyPrincipal
              as_user_id: "${ag_id}"
          assert:
            - "${posture_open} == \"OPEN\" and ${ap_status} == \"LAPSED\""
            - "trigger[0] returns HTTP 422 with data.error_id == \"ERR_EO_COVERAGE_LAPSED\""
            - "trigger[0] does not return \"ERR_NO_ACTIVE_APPOINTMENT_IN_STATE\" even though that check is also violated"
            - "PolicyFile.${pf_id}.issuance_status == \"PENDING\" and policy_number is null"

