          - errors[ERR_CLOSING_DATE_IN_PAST]
          - state_machines.TransferCase.INITIATED_to_TITLE_CLEARED
        distinguishing_aspect: "The same rule is evaluated twice against a moving clock: a closing_date that was in the future at creation becomes stale by the time title is cleared, and clearance then fails with the very same 422 that creation would have produced."
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z."
            - "One ACTIVE PPA agreement (A1 terms) with no UccFiling rows, so the title-clearance filing precondition is vacuously satisfied."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
