# =============================================================================
# PRD Benchmark Seed Tables — task_2129_short_sale_negotiation
# Sections §1.0 – §1.7. (§1.8 lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml,
#                        §1.9 lives in SCAFFOLD_CORNER_DESIGN.yaml)
# =============================================================================

scenario: |
  desgin task harder than expert level.!!!! 2129. Short Sale Negotiation & Lender Approval (short sale negotiator): hardship package assembly & seller documentation, listing/marketing requirement & offer submission to servicer, valuation (BPO) dispute & net proceeds negotiation, junior lien & mortgage insurance approval coordination, approval letter conditions & closing deadline, commission/fee reductions & seller relocation incentive, deficiency waiver negotiation, extension requests & re-approval

domain_name: short-sale-negotiation
api_prefix: /short-sale

# =============================================================================
# Step 0: Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: multi_party_negotiation
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers

  entity_topology: flat
  # Every entity is a peer addressed at /short-sale/<collection>/{id}. Parent
  # linkage is by FK field, never by nesting the child's own id under the
  # parent's path. Creation and reverse-lookup use sub-resource paths, but the
  # resource identity of every child is flat.

  state_machine_shape: cyclic
  # ShortSaleCase.negotiation_status loops OFFER_UNDER_REVIEW -> MARKETED and
  # APPROVAL_ACTIVE -> RENEGOTIATION -> OFFER_UNDER_REVIEW; Offer loops
  # SUBMITTED -> COUNTERED -> REVISED -> SUBMITTED; HardshipPackage loops
  # ACCEPTED -> REVALIDATION_REQUIRED -> SUBMITTED; SellerDocument loops
  # PENDING -> VERIFIED -> PENDING. ShortSaleCase additionally carries two
  # independent state dimensions (negotiation_status x documentation_status);
  # ValuationDispute is a branching fork with divergent side-effect sets.

  relationship_patterns:
    - one_to_many          # ShortSaleCase -> Listing / Offer / Valuation / JuniorLien / ApprovalLetter
    - self_referential     # ApprovalLetter.supersedes_approval_id -> ApprovalLetter.id
    - cross_aggregate      # Valuation.vendor_id crosses into the BpoVendor aggregate
    - polymorphic          # `X-User-ID` is an opaque operator id for six roles and an entity id for BpoVendor

  role_model: segregation_of_duties
  # The ServicerAnalyst who ordered a Valuation may not adjudicate a dispute on
  # it; the ServicerAnalyst who issued an ApprovalLetter may not decide an
  # ExtensionRequest filed against it.

  consistency_model: immediate

  difficulty_level: expert

# =============================================================================
# §1.0 Response Envelope (FIXED — VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: ShortSaleCase
    parent: null
    common_fields: true
    fields:
      - { name: property_address, type: string, source: input, description: "Street address of the distressed property" }
      - { name: investor_type, type: enum, source: input, description: "Investor that owns the first-lien note; drives the minimum-net ratio and deficiency-waiver eligibility", constraints: "one of GSE | PORTFOLIO | FHA" }
      - { name: unpaid_principal_balance_cents, type: integer, source: input, description: "First-lien unpaid principal balance in cents", constraints: ">= 1" }
      - { name: servicer_name, type: string, source: input, description: "Name of the servicing shop reviewing the file" }
      - { name: assigned_negotiator_user_id, type: string, source: system, description: "X-User-ID of the Negotiator that created the case" }
      - { name: negotiation_status, type: enum, source: system, default: INTAKE, description: "Negotiation dimension of the case's parallel state model", constraints: "one of INTAKE | PACKAGE_REVIEW | MARKETED | OFFER_UNDER_REVIEW | APPROVAL_ACTIVE | RENEGOTIATION | CLOSED | DECLINED" }
      - { name: documentation_status, type: enum, source: system, default: DOC_PENDING, description: "Documentation dimension of the case's parallel state model; evolves independently of negotiation_status", constraints: "one of DOC_PENDING | DOC_COMPLETE | DOC_STALE" }
      - { name: final_value_cents, type: integer, source: computed, default: null, description: "value_cents of the case's controlling Valuation; null when no controlling Valuation exists" }
      - { name: minimum_acceptable_net_cents, type: integer, source: computed, default: null, description: "Servicer floor for net proceeds; recomputed by calculations.minimum_acceptable_net whenever final_value_cents or the MI credit changes" }
      - { name: junior_contribution_total_cents, type: integer, source: computed, default: 0, description: "Conserved ledger quantity: sum of JuniorLien.approved_contribution_cents over liens on this case whose status == APPROVED" }
      - { name: junior_lien_count, type: integer, source: computed, default: 0, description: "Count of JuniorLien rows whose case_id == this case" }
      - { name: failed_offer_count, type: integer, source: computed, default: 0, description: "Count of Offer rows on this case whose status == REJECTED" }
      - { name: price_reduction_required, type: boolean, source: computed, default: false, description: "Set true once failed_offer_count >= PRICE_REDUCTION_TRIGGER_COUNT; cleared by a Listing price reduction" }
      - { name: deficiency_waiver_permitted, type: boolean, source: computed, description: "= (investor_type IN {GSE, FHA}); PORTFOLIO investors may not waive the deficiency" }

  - name: BpoVendor
    parent: null
    common_fields: false
    fields:
      - { name: vendor_name, type: string, source: input, description: "Broker-price-opinion vendor firm name" }
      - { name: license_state, type: string, source: input, description: "Two-letter state code the vendor is licensed in" }
      - { name: daily_inspection_capacity, type: integer, source: input, description: "Maximum number of inspections this vendor may hold on one UTC calendar date", constraints: ">= 1" }

  - name: HardshipPackage
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> ShortSaleCase.id; taken from the creation path. At most one HardshipPackage per case." }
      - { name: hardship_reason, type: enum, source: input, description: "Seller's declared hardship category; supplies REASON_WEIGHT in the hardship score", constraints: "one of JOB_LOSS | MEDICAL | DIVORCE | INCOME_REDUCTION | RELOCATION | OTHER" }
      - { name: monthly_income_cents, type: integer, source: input, description: "Seller's documented monthly household income in cents", constraints: ">= 1" }
      - { name: monthly_expenses_cents, type: integer, source: input, description: "Seller's documented monthly household expenses in cents", constraints: ">= 1" }
      - { name: liquid_assets_cents, type: integer, source: input, description: "Seller's liquid reserves in cents", constraints: ">= 0" }
      - { name: assembled_by_user_id, type: string, source: system, description: "X-User-ID of the Negotiator that assembled the package" }
      - { name: document_count, type: integer, source: computed, default: 0, description: "Count of SellerDocument rows whose package_id == this package" }
      - { name: pending_document_count, type: integer, source: computed, default: 0, description: "Count of SellerDocument rows on this package whose status == PENDING" }
      - { name: verified_document_count, type: integer, source: computed, default: 0, description: "Count of SellerDocument rows on this package whose status == VERIFIED" }
      - { name: rejected_document_count, type: integer, source: computed, default: 0, description: "Count of SellerDocument rows on this package whose status == REJECTED" }
      - { name: hardship_score_intake, type: number, source: computed, default: null, description: "calculations.hardship_severity_score under the INTAKE variant; stamped on submit" }
      - { name: hardship_score_audit, type: number, source: computed, default: null, description: "calculations.hardship_severity_score under the SERVICER_AUDIT variant; stamped on decision" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "Package lifecycle", constraints: "one of DRAFT | SUBMITTED | ACCEPTED | REJECTED | REVALIDATION_REQUIRED" }

  - name: SellerDocument
    parent: null
    common_fields: true
    fields:
      - { name: package_id, type: string, source: system, description: "FK -> HardshipPackage.id; taken from the creation path" }
      - { name: doc_type, type: enum, source: input, description: "Kind of seller documentation", constraints: "one of HARDSHIP_LETTER | FINANCIAL_WORKSHEET | BANK_STATEMENT | AUTHORIZATION_FORM | PAY_STUB | TAX_RETURN" }
      - { name: issued_on, type: datetime, source: input, description: "Instant the document was issued by its originator; drives the freshness window" }
      - { name: reference_label, type: string, source: input, description: "Human label the negotiator files the document under" }
      - { name: age_days_at_review, type: integer, source: computed, default: null, description: "floor((review_instant - issued_on) / 86400 s), stamped by the most recent review" }
      - { name: reviewed_by_user_id, type: string, source: system, default: null, description: "X-User-ID of the ServicerAnalyst that last reviewed this document" }
      - { name: status, type: enum, source: system, default: PENDING, description: "Document review lifecycle", constraints: "one of PENDING | VERIFIED | REJECTED" }

  - name: Listing
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> ShortSaleCase.id; taken from the creation path" }
      - { name: list_price_cents, type: integer, source: input, description: "Current asking price in cents", constraints: ">= 1" }
      - { name: commission_pct, type: number, source: input, description: "Total brokerage commission agreed in the listing agreement, as a decimal fraction", constraints: "0 < commission_pct <= 0.10" }
      - { name: listed_at, type: datetime, source: input, description: "Inclusive start of this listing's marketing window" }
      - { name: ended_at, type: datetime, source: system, default: null, description: "Exclusive end of this listing's marketing window; null means the window is open-ended" }
      - { name: listing_agent_user_id, type: string, source: system, description: "X-User-ID of the ListingAgent that created the listing" }
      - { name: days_on_market, type: integer, source: computed, description: "calculations.days_on_market evaluated against the logical clock" }
      - { name: price_reduction_count, type: integer, source: computed, default: 0, description: "Number of accepted price reductions on this listing" }
      - { name: marketing_status, type: enum, source: system, default: ACTIVE, description: "Marketing lifecycle", constraints: "one of ACTIVE | UNDER_CONTRACT | WITHDRAWN" }

  - name: Offer
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> ShortSaleCase.id; taken from the creation path" }
      - { name: buyer_name, type: string, source: input, description: "Buyer of record on the purchase contract" }
      - { name: buyer_financing, type: enum, source: input, description: "Funding source declared on the contract", constraints: "one of CASH | CONVENTIONAL | FHA_LOAN" }
      - { name: offer_price_cents, type: integer, source: input, description: "Contract purchase price in cents", constraints: ">= 1" }
      - { name: earnest_money_cents, type: integer, source: input, description: "Earnest money deposit in cents", constraints: ">= 0" }
      - { name: requested_closing_days, type: integer, source: input, description: "Days to close the buyer asks for", constraints: ">= 1" }
      - { name: round_index, type: integer, source: system, default: 1, description: "Negotiation round this offer is currently in; incremented on each REVISED -> SUBMITTED loop" }
      - { name: servicer_counter_price_cents, type: integer, source: system, default: null, description: "Price the servicer countered at on the most recent COUNTER decision" }
      - { name: submitted_at, type: datetime, source: system, default: null, description: "Logical-clock instant of the most recent submission to the servicer" }
      - { name: status, type: enum, source: system, default: DRAFT, description: "Offer negotiation lifecycle", constraints: "one of DRAFT | SUBMITTED | COUNTERED | REVISED | ACCEPTED | REJECTED" }

  - name: NetSheet
    parent: null
    common_fields: true
    fields:
      - { name: offer_id, type: string, source: system, description: "FK -> Offer.id; taken from the creation path" }
      - { name: variant, type: enum, source: input, description: "Which net-proceeds algorithm produced this sheet", constraints: "one of PRELIMINARY | FINAL" }
      - { name: title_escrow_cents, type: integer, source: input, description: "Flat title and escrow charge in cents", constraints: ">= 0" }
      - { name: property_tax_arrears_cents, type: integer, source: input, description: "Delinquent property tax to be paid at closing, in cents", constraints: ">= 0" }
      - { name: hoa_arrears_cents, type: integer, source: input, description: "Delinquent HOA dues to be paid at closing, in cents", constraints: ">= 0" }
      - { name: commission_pct_applied, type: number, source: computed, description: "Commission rate this sheet actually charged; the FINAL variant clamps it to SERVICER_COMMISSION_CAP_PCT" }
      - { name: line_items, type: array, source: computed, description: "Ordered settlement lines, each { line_type, basis, rate_or_amount, amount_cents }, each amount_cents already rounded per-line" }
      - { name: gross_deductions_cents, type: integer, source: computed, description: "Sum of the six deduction lines' already-rounded amount_cents" }
      - { name: mi_contribution_credit_cents, type: integer, source: computed, default: 0, description: "Mortgage-insurance cash contribution credited back to the first lien; always 0 on the PRELIMINARY variant" }
      - { name: base_net_cents, type: integer, source: computed, description: "offer_price_cents - gross_deductions_cents + mi_contribution_credit_cents, evaluated BEFORE the relocation incentive" }
      - { name: relocation_incentive_cents, type: integer, source: computed, description: "Seller relocation incentive selected from the RELOCATION_TIER table keyed on base_net_cents" }
      - { name: net_proceeds_cents, type: integer, source: computed, description: "base_net_cents - relocation_incentive_cents" }
      - { name: prepared_by_user_id, type: string, source: system, description: "X-User-ID of the Negotiator that prepared the sheet" }
      - { name: status, type: enum, source: system, default: CURRENT, description: "Sheet freshness", constraints: "one of CURRENT | SUPERSEDED | STALE" }

  - name: Valuation
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> ShortSaleCase.id; taken from the creation path" }
      - { name: vendor_id, type: string, source: input, description: "FK -> BpoVendor.id; the firm that holds the inspection slot" }
      - { name: valuation_type, type: enum, source: input, description: "Kind of opinion of value ordered", constraints: "one of BPO_EXTERIOR | BPO_INTERIOR | APPRAISAL" }
      - { name: effective_date, type: datetime, source: input, description: "Date the opinion of value speaks as of; ranking key for the controlling valuation" }
      - { name: inspection_start, type: datetime, source: input, description: "Start of the vendor's inspection slot" }
      - { name: inspection_end, type: datetime, source: input, description: "End of the vendor's inspection slot", constraints: "must be strictly after inspection_start" }
      - { name: ordered_by_user_id, type: string, source: system, description: "X-User-ID of the ServicerAnalyst that ordered the valuation; barred from adjudicating its disputes" }
      - { name: value_cents, type: integer, source: system, default: null, description: "Opinion of value in cents; null until the vendor records it" }
      - { name: recorded_at, type: datetime, source: system, default: null, description: "Logical-clock instant the vendor recorded value_cents" }
      - { name: status, type: enum, source: system, default: ORDERED, description: "Valuation lifecycle", constraints: "one of ORDERED | RECEIVED | DISPUTED | REVISED | FINAL" }

  - name: ValuationDispute
    parent: null
    common_fields: true
    fields:
      - { name: valuation_id, type: string, source: system, description: "FK -> Valuation.id; taken from the creation path" }
      - { name: claimed_value_cents, type: integer, source: input, description: "Value the filer asserts is correct, in cents", constraints: ">= 1" }
      - { name: comparable_count, type: integer, source: input, description: "Number of comparable sales attached as evidence", constraints: ">= 0" }
      - { name: rationale, type: string, source: input, description: "Narrative supporting the claimed value" }
      - { name: filed_by_user_id, type: string, source: system, description: "X-User-ID of the filer" }
      - { name: variance_pct, type: number, source: computed, description: "abs(claimed_value_cents - valuation.value_cents) / valuation.value_cents at filing time, 4 decimal places" }
      - { name: resolved_value_cents, type: integer, source: computed, default: null, description: "Value the adjudication settled on; written by calculations.dispute_reconciliation" }
      - { name: adjudicated_by_user_id, type: string, source: system, default: null, description: "X-User-ID of the ServicerAnalyst that adjudicated" }
      - { name: status, type: enum, source: system, default: OPEN, description: "Dispute branch outcome", constraints: "one of OPEN | SUSTAINED | PARTIAL | DENIED" }

  - name: JuniorLien
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> ShortSaleCase.id; taken from the creation path" }
      - { name: lien_position, type: integer, source: input, description: "Recording position behind the first lien; unique per case", constraints: ">= 2" }
      - { name: holder_name, type: string, source: input, description: "Name of the junior lien holder" }
      - { name: holder_user_id, type: string, source: input, description: "Opaque X-User-ID the JuniorLienHolder role must present to act on this lien" }
      - { name: balance_cents, type: integer, source: input, description: "Outstanding junior lien balance in cents; caps any approved contribution", constraints: ">= 1" }
      - { name: demand_cents, type: integer, source: system, default: null, description: "Payoff the negotiator demanded the holder accept; used by the PRELIMINARY net sheet" }
      - { name: approved_contribution_cents, type: integer, source: system, default: 0, description: "Payoff the holder actually approved; used by the FINAL net sheet" }
      - { name: status, type: enum, source: system, default: IDENTIFIED, description: "Junior lien negotiation lifecycle", constraints: "one of IDENTIFIED | DEMAND_SENT | NEGOTIATING | APPROVED | REFUSED" }

  - name: MiClaim
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> ShortSaleCase.id; taken from the creation path. At most one MiClaim per case." }
      - { name: mi_provider, type: string, source: input, description: "Mortgage insurance carrier name" }
      - { name: coverage_pct, type: number, source: input, description: "Coverage percentage on the first lien as a decimal fraction", constraints: "0 <= coverage_pct <= 1" }
      - { name: claim_reference, type: string, source: input, description: "Carrier claim reference number" }
      - { name: required_contribution_cents, type: integer, source: system, default: 0, description: "Cash contribution the carrier demands as a condition of approval; credited on the FINAL net sheet and subtracted from the minimum acceptable net" }
      - { name: contribution_form, type: enum, source: system, default: NONE, description: "How the contribution is delivered", constraints: "one of NONE | CASH | PROMISSORY_NOTE" }
      - { name: decided_by_user_id, type: string, source: system, default: null, description: "X-User-ID of the MiUnderwriter that decided the claim" }
      - { name: status, type: enum, source: system, default: PENDING, description: "MI claim lifecycle", constraints: "one of PENDING | APPROVED | DECLINED | NOT_REQUIRED" }

  - name: ApprovalLetter
    parent: null
    common_fields: true
    fields:
      - { name: case_id, type: string, source: system, description: "FK -> ShortSaleCase.id; taken from the creation path" }
      - { name: offer_id, type: string, source: input, description: "FK -> Offer.id; the offer this letter approves" }
      - { name: supersedes_approval_id, type: string, source: system, default: null, description: "FK -> ApprovalLetter.id; set only on letters minted by an extension grant" }
      - { name: approved_net_proceeds_cents, type: integer, source: input, description: "Net proceeds the servicer commits to accept, in cents", constraints: ">= 0" }
      - { name: commission_cap_pct, type: number, source: input, description: "Maximum total commission the letter allows, as a decimal fraction", constraints: "0 < commission_cap_pct <= SERVICER_COMMISSION_CAP_PCT" }
      - { name: seller_relocation_incentive_cents, type: integer, source: input, description: "Relocation incentive the letter grants the seller at closing, in cents", constraints: ">= 0" }
      - { name: deficiency_waiver, type: enum, source: input, description: "How the first lien treats the deficiency balance", constraints: "one of WAIVED | RESERVED | PROMISSORY_NOTE" }
      - { name: conditions, type: array, source: input, description: "Free-text conditions the letter attaches to closing" }
      - { name: issued_by_user_id, type: string, source: system, description: "X-User-ID of the ServicerAnalyst that issued the letter; barred from deciding its extension requests" }
      - { name: issued_at, type: datetime, source: system, description: "Logical-clock instant the letter was issued" }
      - { name: closing_deadline, type: datetime, source: computed, description: "calculations.closing_deadline output; the instant after which the letter expires" }
      - { name: cumulative_extension_days_used, type: integer, source: computed, default: 0, description: "Conserved budget quantity: total granted_days over every GRANTED ExtensionRequest across this letter's supersede chain" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "Letter lifecycle", constraints: "one of ACTIVE | CLOSED | EXPIRED | VOIDED | SUPERSEDED" }

  - name: ExtensionRequest
    parent: null
    common_fields: true
    fields:
      - { name: approval_letter_id, type: string, source: system, description: "FK -> ApprovalLetter.id; taken from the creation path" }
      - { name: requested_days, type: integer, source: input, description: "Additional calendar days requested", constraints: ">= 1" }
      - { name: reason, type: string, source: input, description: "Why the closing needs more time" }
      - { name: requested_by_user_id, type: string, source: system, description: "X-User-ID of the Negotiator that filed the request" }
      - { name: granted_days, type: integer, source: system, default: null, description: "Days actually granted; equals requested_days on a GRANT" }
      - { name: decided_by_user_id, type: string, source: system, default: null, description: "X-User-ID of the ServicerAnalyst that decided the request" }
      - { name: new_closing_deadline, type: datetime, source: computed, default: null, description: "closing_deadline carried by the successor ApprovalLetter minted on a GRANT" }
      - { name: status, type: enum, source: system, default: REQUESTED, description: "Request lifecycle", constraints: "one of REQUESTED | GRANTED | DENIED | CANCELLED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  # ---- ShortSaleCase, dimension 1 of 2 -------------------------------------
  - entity: ShortSaleCase
    state_field: negotiation_status
    initial_state: INTAKE
    terminal_states: [CLOSED, DECLINED]
    note: "Dimension 1 of the case's parallel state model. Evolves independently of documentation_status: a case may sit in APPROVAL_ACTIVE while documentation_status is DOC_STALE, and may reach MARKETED only after documentation_status has reached DOC_COMPLETE at least once."
    transitions:
      - from: INTAKE
        to: PACKAGE_REVIEW
        trigger: "POST /short-sale/hardship-packages/{id}/submit"
        actor: Negotiator
        preconditions: ["the package's case has negotiation_status == INTAKE"]
        side_effects: ["stamps HardshipPackage.hardship_score_intake"]
      - from: PACKAGE_REVIEW
        to: DECLINED
        trigger: "POST /short-sale/hardship-packages/{id}/decision with outcome == REJECT"
        actor: ServicerAnalyst
        preconditions: ["HardshipPackage.status == SUBMITTED"]
        side_effects: ["HardshipPackage.status -> REJECTED"]
      - from: PACKAGE_REVIEW
        to: MARKETED
        trigger: "POST /short-sale/hardship-packages/{id}/decision with outcome == ACCEPT"
        actor: ServicerAnalyst
        note: "Listing creation carries no case-dimension effect of its own; a Listing may be created while the case is still in INTAKE or PACKAGE_REVIEW. It is the accepted package that moves the negotiation dimension to MARKETED."
        preconditions: ["HardshipPackage.status == SUBMITTED", "hardship_score_audit >= HARDSHIP_MIN_SCORE"]
        side_effects: ["HardshipPackage.status -> ACCEPTED"]
      - from: MARKETED
        to: OFFER_UNDER_REVIEW
        trigger: "POST /short-sale/offers/{id}/submit"
        actor: Negotiator
        preconditions: ["Offer.status IN {DRAFT, REVISED}", "the case's controlling Listing has days_on_market >= MIN_MARKETING_DAYS", "case.price_reduction_required == false"]
        side_effects: ["Offer.status -> SUBMITTED", "Offer.submitted_at := current_utc", "controlling Listing.marketing_status -> UNDER_CONTRACT"]
      - from: OFFER_UNDER_REVIEW
        to: MARKETED
        trigger: "POST /short-sale/offers/{id}/servicer-decision with outcome == REJECT"
        actor: ServicerAnalyst
        preconditions: ["Offer.status == SUBMITTED"]
        side_effects: ["CASCADE-B hop 1: Offer.status -> REJECTED", "CASCADE-B hop 2, caused by hop 1: the controlling Listing.marketing_status -> ACTIVE and case.failed_offer_count += 1", "CASCADE-B hop 3, caused by hop 2: when case.failed_offer_count >= PRICE_REDUCTION_TRIGGER_COUNT, case.price_reduction_required := true", "CASCADE-B hop 4, caused by hop 3: the case's HardshipPackage moves ACCEPTED -> REVALIDATION_REQUIRED and case.documentation_status moves DOC_COMPLETE -> DOC_STALE"]
      - from: OFFER_UNDER_REVIEW
        to: APPROVAL_ACTIVE
        trigger: "POST /short-sale/cases/{id}/approval-letters"
        actor: ServicerAnalyst
        preconditions: ["Offer.status == SUBMITTED", "case has a controlling Valuation", "the case's HardshipPackage.status == ACCEPTED", "the offer has a NetSheet with variant FINAL and status CURRENT", "every JuniorLien on the case has status == APPROVED", "the case's MiClaim, if any, has status IN {APPROVED, NOT_REQUIRED}", "approved_net_proceeds_cents >= case.minimum_acceptable_net_cents"]
        side_effects: ["ApprovalLetter created with status ACTIVE", "Offer.status -> ACCEPTED", "case.version += 1"]
      - from: APPROVAL_ACTIVE
        to: RENEGOTIATION
        trigger: "system: an ApprovalLetter on the case transitions ACTIVE -> VOIDED"
        actor: system
        preconditions: ["the voided letter was the case's only ACTIVE letter"]
        side_effects: ["every ExtensionRequest on the voided letter whose status == REQUESTED moves to CANCELLED"]
      - from: RENEGOTIATION
        to: OFFER_UNDER_REVIEW
        trigger: "POST /short-sale/offers/{id}/submit"
        actor: Negotiator
        preconditions: ["Offer.status IN {DRAFT, REVISED}", "the case's controlling Listing has days_on_market >= MIN_MARKETING_DAYS"]
        side_effects: ["Offer.status -> SUBMITTED", "controlling Listing.marketing_status -> UNDER_CONTRACT"]
      - from: APPROVAL_ACTIVE
        to: CLOSED
        trigger: "POST /short-sale/approval-letters/{id}/close"
        actor: Negotiator
        preconditions: ["ApprovalLetter.status == ACTIVE", "current_utc <= ApprovalLetter.closing_deadline"]
        side_effects: ["ApprovalLetter.status -> CLOSED", "the case's controlling Listing.marketing_status -> WITHDRAWN with ended_at := current_utc"]

  # ---- ShortSaleCase, dimension 2 of 2 -------------------------------------
  - entity: ShortSaleCase
    state_field: documentation_status
    initial_state: DOC_PENDING
    terminal_states: []
    note: "Dimension 2 of the case's parallel state model. Driven only by SellerDocument reviews and package revalidation; never by offers, valuations, liens, or approval letters."
    transitions:
      - from: DOC_PENDING
        to: DOC_COMPLETE
        trigger: "POST /short-sale/documents/{id}/review with outcome == VERIFY"
        actor: ServicerAnalyst
        preconditions: ["after the review, every doc_type in REQUIRED_DOCUMENT_TYPES has at least one SellerDocument on the case's package with status == VERIFIED"]
        side_effects: ["HardshipPackage.verified_document_count += 1 and pending_document_count -= 1"]
      - from: DOC_COMPLETE
        to: DOC_PENDING
        trigger: "POST /short-sale/documents/{id}/review with outcome == REVOKE"
        actor: ServicerAnalyst
        preconditions: ["SellerDocument.status == VERIFIED", "after the revoke, at least one doc_type in REQUIRED_DOCUMENT_TYPES has no VERIFIED SellerDocument"]
        side_effects: ["SellerDocument.status -> PENDING", "HardshipPackage.verified_document_count -= 1 and pending_document_count += 1 (the four package counters and document_count are restored to their pre-VERIFY values)"]
      - from: DOC_COMPLETE
        to: DOC_STALE
        trigger: "system: the case's HardshipPackage transitions ACCEPTED -> REVALIDATION_REQUIRED"
        actor: system
        preconditions: ["case.failed_offer_count >= PRICE_REDUCTION_TRIGGER_COUNT"]
        side_effects: ["HardshipPackage.hardship_score_audit := null"]
      - from: DOC_STALE
        to: DOC_PENDING
        trigger: "POST /short-sale/hardship-packages/{id}/submit"
        actor: Negotiator
        preconditions: ["HardshipPackage.status == REVALIDATION_REQUIRED"]
        side_effects: ["HardshipPackage.status -> SUBMITTED", "HardshipPackage.hardship_score_intake recomputed"]

  # ---- HardshipPackage ------------------------------------------------------
  - entity: HardshipPackage
    state_field: status
    initial_state: DRAFT
    terminal_states: [REJECTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /short-sale/hardship-packages/{id}/submit"
        actor: Negotiator
        preconditions: ["every doc_type in REQUIRED_DOCUMENT_TYPES has at least one SellerDocument on this package whose status IN {PENDING, VERIFIED}"]
        side_effects: ["hardship_score_intake := calculations.hardship_severity_score under the INTAKE variant", "case.negotiation_status INTAKE -> PACKAGE_REVIEW"]
      - from: REVALIDATION_REQUIRED
        to: SUBMITTED
        trigger: "POST /short-sale/hardship-packages/{id}/submit"
        actor: Negotiator
        preconditions: ["every doc_type in REQUIRED_DOCUMENT_TYPES has at least one SellerDocument on this package whose status IN {PENDING, VERIFIED}"]
        side_effects: ["hardship_score_intake recomputed under the INTAKE variant", "case.documentation_status DOC_STALE -> DOC_PENDING"]
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /short-sale/hardship-packages/{id}/decision with outcome == ACCEPT"
        actor: ServicerAnalyst
        preconditions: ["hardship_score_audit >= HARDSHIP_MIN_SCORE"]
        side_effects: ["hardship_score_audit := calculations.hardship_severity_score under the SERVICER_AUDIT variant", "case.negotiation_status PACKAGE_REVIEW -> MARKETED"]
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /short-sale/hardship-packages/{id}/decision with outcome == REJECT"
        actor: ServicerAnalyst
        preconditions: []
        side_effects: ["hardship_score_audit := calculations.hardship_severity_score under the SERVICER_AUDIT variant", "case.negotiation_status PACKAGE_REVIEW -> DECLINED"]
      - from: ACCEPTED
        to: REVALIDATION_REQUIRED
        trigger: "system: case.price_reduction_required flips false -> true (CASCADE-B hop 4)"
        actor: system
        preconditions: ["case.failed_offer_count >= PRICE_REDUCTION_TRIGGER_COUNT"]
        side_effects: ["case.documentation_status DOC_COMPLETE -> DOC_STALE", "hardship_score_audit := null"]

  # ---- SellerDocument -------------------------------------------------------
  - entity: SellerDocument
    state_field: status
    initial_state: PENDING
    terminal_states: [REJECTED]
    transitions:
      - from: PENDING
        to: VERIFIED
        trigger: "POST /short-sale/documents/{id}/review with outcome == VERIFY"
        actor: ServicerAnalyst
        preconditions: ["floor((current_utc - issued_on) / 86400 s) <= DOCUMENT_MAX_AGE_DAYS", "the package's status != REJECTED"]
        side_effects: ["age_days_at_review stamped", "reviewed_by_user_id := X-User-ID", "package.verified_document_count += 1, package.pending_document_count -= 1", "case.documentation_status may move DOC_PENDING -> DOC_COMPLETE"]
      - from: PENDING
        to: REJECTED
        trigger: "POST /short-sale/documents/{id}/review with outcome == REJECT"
        actor: ServicerAnalyst
        preconditions: ["the package's status != REJECTED"]
        side_effects: ["package.rejected_document_count += 1, package.pending_document_count -= 1"]
      - from: VERIFIED
        to: PENDING
        trigger: "POST /short-sale/documents/{id}/review with outcome == REVOKE"
        actor: ServicerAnalyst
        preconditions: ["the package's status != REJECTED"]
        note: "Compensating action for VERIFY. Restores every package counter to its pre-VERIFY value; document_count is untouched throughout."
        side_effects: ["package.verified_document_count -= 1, package.pending_document_count += 1", "case.documentation_status may move DOC_COMPLETE -> DOC_PENDING"]

  # ---- Listing --------------------------------------------------------------
  - entity: Listing
    state_field: marketing_status
    initial_state: ACTIVE
    terminal_states: [WITHDRAWN]
    transitions:
      - from: ACTIVE
        to: UNDER_CONTRACT
        trigger: "POST /short-sale/offers/{id}/submit"
        actor: Negotiator
        preconditions: ["this Listing is the case's controlling Listing"]
        side_effects: ["Offer.status -> SUBMITTED"]
      - from: UNDER_CONTRACT
        to: ACTIVE
        trigger: "POST /short-sale/offers/{id}/servicer-decision with outcome == REJECT"
        actor: ServicerAnalyst
        note: "Cycle: the property returns to marketing when the servicer rejects."
        preconditions: ["Offer.status == SUBMITTED"]
        side_effects: ["case.failed_offer_count += 1 (CASCADE-B hop 2)"]
      - from: ACTIVE
        to: WITHDRAWN
        trigger: "POST /short-sale/listings/{id}/withdraw"
        actor: ListingAgent
        preconditions: ["ended_at > listed_at"]
        side_effects: ["ended_at := the supplied instant, closing this listing's half-open marketing window"]
      - from: UNDER_CONTRACT
        to: WITHDRAWN
        trigger: "POST /short-sale/listings/{id}/withdraw"
        actor: ListingAgent
        preconditions: ["ended_at > listed_at"]
        side_effects: ["ended_at := the supplied instant"]
      - from: ACTIVE
        to: WITHDRAWN
        trigger: "system: the case's ApprovalLetter transitions ACTIVE -> CLOSED"
        actor: system
        preconditions: []
        side_effects: ["ended_at := current_utc"]
      - from: UNDER_CONTRACT
        to: WITHDRAWN
        trigger: "system: the case's ApprovalLetter transitions ACTIVE -> CLOSED"
        actor: system
        note: "The controlling Listing is normally in UNDER_CONTRACT at closing, because the accepted offer put it there."
        preconditions: []
        side_effects: ["ended_at := current_utc"]

  # ---- Offer (cyclic) -------------------------------------------------------
  - entity: Offer
    state_field: status
    initial_state: DRAFT
    terminal_states: [ACCEPTED, REJECTED]
    note: "Cyclic machine: SUBMITTED -> COUNTERED -> REVISED -> SUBMITTED is a negotiation round, bounded by MAX_NEGOTIATION_ROUNDS."
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /short-sale/offers/{id}/submit"
        actor: Negotiator
        preconditions: ["the case's HardshipPackage.status == ACCEPTED (this is the gate; case.negotiation_status is a consequence, not a separate check)", "the case's controlling Listing has days_on_market >= MIN_MARKETING_DAYS", "case.price_reduction_required == false"]
        side_effects: ["submitted_at := current_utc", "controlling Listing.marketing_status -> UNDER_CONTRACT", "case.negotiation_status MARKETED|RENEGOTIATION -> OFFER_UNDER_REVIEW"]
      - from: SUBMITTED
        to: COUNTERED
        trigger: "POST /short-sale/offers/{id}/servicer-decision with outcome == COUNTER"
        actor: ServicerAnalyst
        preconditions: ["counter_price_cents is present and >= 1"]
        side_effects: ["servicer_counter_price_cents := counter_price_cents"]
      - from: COUNTERED
        to: REVISED
        trigger: "POST /short-sale/offers/{id}/revise"
        actor: ListingAgent
        preconditions: []
        side_effects: ["offer_price_cents := the revised price", "every NetSheet on this offer with status CURRENT moves to STALE"]
      - from: REVISED
        to: SUBMITTED
        trigger: "POST /short-sale/offers/{id}/submit"
        actor: Negotiator
        note: "Closes the negotiation loop."
        preconditions: ["round_index + 1 <= MAX_NEGOTIATION_ROUNDS", "the case's controlling Listing has days_on_market >= MIN_MARKETING_DAYS"]
        side_effects: ["round_index += 1", "submitted_at := current_utc", "controlling Listing.marketing_status -> UNDER_CONTRACT"]
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /short-sale/offers/{id}/servicer-decision with outcome == REJECT"
        actor: ServicerAnalyst
        preconditions: []
        side_effects: ["CASCADE-B hop 1; see ShortSaleCase.OFFER_UNDER_REVIEW_to_MARKETED for the full four-hop chain"]
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /short-sale/cases/{id}/approval-letters"
        actor: ServicerAnalyst
        preconditions: ["the letter's offer_id == this Offer.id"]
        side_effects: ["case.negotiation_status -> APPROVAL_ACTIVE"]

  # ---- Valuation ------------------------------------------------------------
  - entity: Valuation
    state_field: status
    initial_state: ORDERED
    terminal_states: [FINAL]
    transitions:
      - from: ORDERED
        to: RECEIVED
        trigger: "POST /short-sale/valuations/{id}/record-value"
        actor: BpoVendor
        preconditions: ["X-User-ID == Valuation.vendor_id"]
        side_effects: ["value_cents := the recorded value", "recorded_at := current_utc", "case.final_value_cents and case.minimum_acceptable_net_cents recomputed"]
      - from: RECEIVED
        to: DISPUTED
        trigger: "POST /short-sale/valuations/{id}/disputes"
        actor: Negotiator | ServicerAnalyst
        preconditions: ["variance_pct >= DISPUTE_MIN_VARIANCE_PCT", "comparable_count >= DISPUTE_MIN_COMPARABLES"]
        side_effects: ["ValuationDispute created with status OPEN"]
      - from: REVISED
        to: DISPUTED
        trigger: "POST /short-sale/valuations/{id}/disputes"
        actor: Negotiator | ServicerAnalyst
        preconditions: ["variance_pct >= DISPUTE_MIN_VARIANCE_PCT", "comparable_count >= DISPUTE_MIN_COMPARABLES"]
        side_effects: ["ValuationDispute created with status OPEN"]
      - from: DISPUTED
        to: REVISED
        trigger: "POST /short-sale/disputes/{id}/adjudicate with resolution IN {SUSTAINED, PARTIAL}"
        actor: ServicerAnalyst
        preconditions: ["X-User-ID != Valuation.ordered_by_user_id"]
        side_effects: ["CASCADE-A hop 2: value_cents := dispute.resolved_value_cents", "CASCADE-A hop 3, caused by hop 2: case.final_value_cents and case.minimum_acceptable_net_cents recomputed", "CASCADE-A hop 4, caused by hop 3: any ApprovalLetter on the case with status ACTIVE whose approved_net_proceeds_cents < the new case.minimum_acceptable_net_cents moves ACTIVE -> VOIDED", "CASCADE-A hop 5, caused by hop 4: every ExtensionRequest on that letter with status REQUESTED moves to CANCELLED and case.negotiation_status moves APPROVAL_ACTIVE -> RENEGOTIATION"]
      - from: DISPUTED
        to: FINAL
        trigger: "POST /short-sale/disputes/{id}/adjudicate with resolution == DENIED"
        actor: ServicerAnalyst
        note: "Divergent branch: DENIED locks the valuation, so no further ValuationDispute may be filed against it, and value_cents is left untouched."
        preconditions: ["X-User-ID != Valuation.ordered_by_user_id"]
        side_effects: ["value_cents unchanged", "case.final_value_cents and case.minimum_acceptable_net_cents unchanged"]

  # ---- ValuationDispute (branching fork) ------------------------------------
  - entity: ValuationDispute
    state_field: status
    initial_state: OPEN
    terminal_states: [SUSTAINED, PARTIAL, DENIED]
    note: "Fork with three branches whose side-effect sets differ: SUSTAINED adopts the claimed value, PARTIAL adopts the rounded midpoint, DENIED keeps the original value AND locks the valuation to FINAL."
    transitions:
      - from: OPEN
        to: SUSTAINED
        trigger: "POST /short-sale/disputes/{id}/adjudicate with resolution == SUSTAINED"
        actor: ServicerAnalyst
        preconditions: ["X-User-ID != the disputed Valuation.ordered_by_user_id"]
        side_effects: ["CASCADE-A hop 1: resolved_value_cents := claimed_value_cents", "Valuation.status -> REVISED (hop 2)"]
      - from: OPEN
        to: PARTIAL
        trigger: "POST /short-sale/disputes/{id}/adjudicate with resolution == PARTIAL"
        actor: ServicerAnalyst
        preconditions: ["X-User-ID != the disputed Valuation.ordered_by_user_id"]
        side_effects: ["resolved_value_cents := round_half_up((claimed_value_cents + Valuation.value_cents) / 2)", "Valuation.status -> REVISED"]
      - from: OPEN
        to: DENIED
        trigger: "POST /short-sale/disputes/{id}/adjudicate with resolution == DENIED"
        actor: ServicerAnalyst
        preconditions: ["X-User-ID != the disputed Valuation.ordered_by_user_id"]
        side_effects: ["resolved_value_cents := Valuation.value_cents", "Valuation.status -> FINAL (terminal; blocks any further dispute)"]

  # ---- JuniorLien -----------------------------------------------------------
  - entity: JuniorLien
    state_field: status
    initial_state: IDENTIFIED
    terminal_states: [REFUSED]
    transitions:
      - from: IDENTIFIED
        to: DEMAND_SENT
        trigger: "POST /short-sale/junior-liens/{id}/demand"
        actor: Negotiator
        preconditions: ["demand_cents <= balance_cents"]
        side_effects: ["demand_cents := the demanded payoff", "every NetSheet with variant PRELIMINARY and status CURRENT on any Offer of this case moves to STALE"]
      - from: DEMAND_SENT
        to: NEGOTIATING
        trigger: "POST /short-sale/junior-liens/{id}/response with outcome == NEGOTIATE"
        actor: JuniorLienHolder
        preconditions: ["X-User-ID == JuniorLien.holder_user_id"]
        side_effects: []
      - from: DEMAND_SENT
        to: APPROVED
        trigger: "POST /short-sale/junior-liens/{id}/response with outcome == APPROVE"
        actor: JuniorLienHolder
        preconditions: ["X-User-ID == JuniorLien.holder_user_id", "contribution_cents <= balance_cents"]
        side_effects: ["approved_contribution_cents := contribution_cents", "case.junior_contribution_total_cents recomputed", "every NetSheet with variant FINAL and status CURRENT on any Offer of this case moves to STALE"]
      - from: NEGOTIATING
        to: APPROVED
        trigger: "POST /short-sale/junior-liens/{id}/response with outcome == APPROVE"
        actor: JuniorLienHolder
        preconditions: ["X-User-ID == JuniorLien.holder_user_id", "contribution_cents <= balance_cents"]
        side_effects: ["approved_contribution_cents := contribution_cents", "case.junior_contribution_total_cents recomputed", "every NetSheet with variant FINAL and status CURRENT on any Offer of this case moves to STALE"]
      - from: DEMAND_SENT
        to: REFUSED
        trigger: "POST /short-sale/junior-liens/{id}/response with outcome == REFUSE"
        actor: JuniorLienHolder
        preconditions: ["X-User-ID == JuniorLien.holder_user_id"]
        side_effects: ["approved_contribution_cents := 0", "case.junior_contribution_total_cents recomputed"]
      - from: NEGOTIATING
        to: REFUSED
        trigger: "POST /short-sale/junior-liens/{id}/response with outcome == REFUSE"
        actor: JuniorLienHolder
        preconditions: ["X-User-ID == JuniorLien.holder_user_id"]
        side_effects: ["approved_contribution_cents := 0", "case.junior_contribution_total_cents recomputed"]
      - from: APPROVED
        to: NEGOTIATING
        trigger: "POST /short-sale/junior-liens/{id}/response with outcome == WITHDRAW_APPROVAL"
        actor: JuniorLienHolder
        note: "Compensating action for APPROVE. case.junior_contribution_total_cents must return to exactly its pre-APPROVE value."
        preconditions: ["X-User-ID == JuniorLien.holder_user_id"]
        side_effects: ["approved_contribution_cents := 0", "case.junior_contribution_total_cents recomputed", "every NetSheet with variant FINAL and status CURRENT on any Offer of this case moves to STALE"]

  # ---- MiClaim --------------------------------------------------------------
  - entity: MiClaim
    state_field: status
    initial_state: PENDING
    terminal_states: [APPROVED, DECLINED, NOT_REQUIRED]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /short-sale/mi-claims/{id}/decision with outcome == APPROVE"
        actor: MiUnderwriter
        preconditions: ["required_contribution_cents is present and >= 0", "contribution_form IN {CASH, PROMISSORY_NOTE}"]
        side_effects: ["required_contribution_cents and contribution_form stamped", "case.minimum_acceptable_net_cents recomputed with the MI credit applied", "every NetSheet with variant FINAL and status CURRENT on any Offer of this case moves to STALE"]
      - from: PENDING
        to: DECLINED
        trigger: "POST /short-sale/mi-claims/{id}/decision with outcome == DECLINE"
        actor: MiUnderwriter
        preconditions: []
        side_effects: ["required_contribution_cents := 0", "case.minimum_acceptable_net_cents recomputed without an MI credit"]
      - from: PENDING
        to: NOT_REQUIRED
        trigger: "POST /short-sale/mi-claims/{id}/decision with outcome == NOT_REQUIRED"
        actor: MiUnderwriter
        preconditions: []
        side_effects: ["required_contribution_cents := 0", "contribution_form := NONE"]

  # ---- ApprovalLetter -------------------------------------------------------
  - entity: ApprovalLetter
    state_field: status
    initial_state: ACTIVE
    terminal_states: [CLOSED, EXPIRED, VOIDED, SUPERSEDED]
    transitions:
      - from: ACTIVE
        to: CLOSED
        trigger: "POST /short-sale/approval-letters/{id}/close"
        actor: Negotiator
        preconditions: ["current_utc <= closing_deadline"]
        side_effects: ["case.negotiation_status APPROVAL_ACTIVE -> CLOSED", "the case's controlling Listing moves ACTIVE|UNDER_CONTRACT -> WITHDRAWN with ended_at := current_utc"]
      - from: ACTIVE
        to: EXPIRED
        trigger: "system: any write addressed at this letter is received while current_utc > closing_deadline"
        actor: system
        preconditions: ["current_utc > closing_deadline"]
        note: "Lazy expiry. The observing write is itself rejected with ERR_APPROVAL_EXPIRED after the letter is moved to EXPIRED."
        side_effects: ["every ExtensionRequest on the letter with status REQUESTED moves to CANCELLED"]
      - from: ACTIVE
        to: VOIDED
        trigger: "system: case.minimum_acceptable_net_cents is recomputed above this letter's approved_net_proceeds_cents (CASCADE-A hop 4)"
        actor: system
        preconditions: ["approved_net_proceeds_cents < the newly computed case.minimum_acceptable_net_cents"]
        side_effects: ["CASCADE-A hop 5: every ExtensionRequest on this letter with status REQUESTED moves to CANCELLED, and case.negotiation_status moves APPROVAL_ACTIVE -> RENEGOTIATION"]
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system: an ExtensionRequest against this letter is GRANTED (CASCADE-C hop 2)"
        actor: system
        preconditions: ["the successor ApprovalLetter has been minted"]
        side_effects: ["CASCADE-C hop 3: every other ExtensionRequest on this letter with status REQUESTED moves to CANCELLED"]

  # ---- ExtensionRequest -----------------------------------------------------
  - entity: ExtensionRequest
    state_field: status
    initial_state: REQUESTED
    terminal_states: [GRANTED, DENIED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: GRANTED
        trigger: "POST /short-sale/extension-requests/{id}/decision with outcome == GRANT"
        actor: ServicerAnalyst
        preconditions: ["ApprovalLetter.status == ACTIVE", "current_utc <= ApprovalLetter.closing_deadline", "X-User-ID != ApprovalLetter.issued_by_user_id", "letter.cumulative_extension_days_used + requested_days <= MAX_CUMULATIVE_EXTENSION_DAYS"]
        side_effects: ["CASCADE-C hop 1: granted_days := requested_days and a successor ApprovalLetter is minted with supersedes_approval_id := this letter, closing_deadline := predecessor.closing_deadline + granted_days days, cumulative_extension_days_used := predecessor value + granted_days, and every other field copied from the predecessor", "CASCADE-C hop 2, caused by hop 1: the predecessor ApprovalLetter moves ACTIVE -> SUPERSEDED", "CASCADE-C hop 3, caused by hop 2: every other ExtensionRequest on the predecessor with status REQUESTED moves to CANCELLED", "new_closing_deadline := the successor's closing_deadline"]
      - from: REQUESTED
        to: DENIED
        trigger: "POST /short-sale/extension-requests/{id}/decision with outcome == DENY"
        actor: ServicerAnalyst
        preconditions: ["ApprovalLetter.status == ACTIVE", "X-User-ID != ApprovalLetter.issued_by_user_id"]
        note: "Conserved-budget check: a DENY leaves letter.cumulative_extension_days_used and closing_deadline untouched."
        side_effects: ["granted_days := 0"]
      - from: REQUESTED
        to: CANCELLED
        trigger: "system: the parent ApprovalLetter leaves ACTIVE for VOIDED, SUPERSEDED, or EXPIRED"
        actor: system
        preconditions: []
        side_effects: []

# =============================================================================
# §1.2.1 Concurrency Rules  (OCC on the parent's `version` — the only mechanism)
# =============================================================================
concurrency_rules:
  - rule_id: approval-letter-create-stale-case
    parent_entity: ShortSaleCase
    write_endpoint: "POST /short-sale/cases/{id}/approval-letters"
    occ_field: "expected_case_version"
    description: |
      Issuing an ApprovalLetter against a ShortSaleCase whose version has
      advanced since the client last read it is rejected. A newly issued letter
      legitimately supersedes the servicer's earlier view of the file (the offer
      it accepts, the junior-lien ledger it prices, and the minimum acceptable
      net it clears are all case-level state), so the second issuance would
      otherwise succeed on its own terms and silently overwrite the first
      approval. The stale-version check reduces that to a deterministic
      precondition on ShortSaleCase.version.
    error_id: ERR_STALE_CASE_VERSION
    http_status: 412

  - rule_id: net-sheet-create-stale-offer
    parent_entity: Offer
    write_endpoint: "POST /short-sale/offers/{id}/net-sheets"
    occ_field: "expected_offer_version"
    description: |
      Preparing a NetSheet against an Offer whose version has advanced since the
      client last read it is rejected. A new sheet of the same variant
      legitimately supersedes the prior CURRENT sheet, so the writer working
      from a stale view of the offer price, round index, or sheet set would
      otherwise mint a superseding sheet from inputs that no longer hold.
    error_id: ERR_STALE_OFFER_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: net_proceeds_to_first_lien
    trigger: "POST /short-sale/offers/{id}/net-sheets — writes NetSheet.line_items, gross_deductions_cents, mi_contribution_credit_cents, base_net_cents, relocation_incentive_cents and net_proceeds_cents"
    algorithm: waterfall_allocation
    formula: |
      # ---- step 1: pick the commission rate (variant-dependent) -------------
      listing := the case's controlling Listing
      if variant == PRELIMINARY:
          commission_pct_applied = listing.commission_pct
      else:  # FINAL
          commission_pct_applied = min(listing.commission_pct, SERVICER_COMMISSION_CAP_PCT)

      # ---- step 2: build the six deduction lines, IN THIS ORDER -------------
      # ROUNDING ORDER IS PINNED: each line is rounded to whole cents on its own
      # (round_half_up) and only then summed. Summing the raw products first and
      # rounding once at the end is WRONG and yields a different total.
      L1 COMMISSION            basis PCT_OF_PRICE, rate commission_pct_applied
                               amount_cents = round_half_up(offer_price_cents * commission_pct_applied)
      L2 TITLE_AND_ESCROW      basis FLAT,  amount_cents = title_escrow_cents
      L3 TRANSFER_TAX          basis PCT_OF_PRICE, rate TRANSFER_TAX_PCT
                               amount_cents = round_half_up(offer_price_cents * TRANSFER_TAX_PCT)
      L4 PROPERTY_TAX_ARREARS  basis FLAT,  amount_cents = property_tax_arrears_cents
      L5 HOA_ARREARS           basis FLAT,  amount_cents = hoa_arrears_cents
      L6 JUNIOR_LIEN_PAYOFF    basis FLAT,  amount_cents = variant-dependent (see input_set)

      gross_deductions_cents = L1 + L2 + L3 + L4 + L5 + L6   # sum of ALREADY-ROUNDED lines

      # ---- step 3: MI credit (variant-dependent) ----------------------------
      if variant == PRELIMINARY:
          mi_contribution_credit_cents = 0
      else:
          mi = the case's MiClaim
          mi_contribution_credit_cents = mi.required_contribution_cents if (mi exists and mi.status == APPROVED) else 0

      # ---- step 4: break the circular dependency ----------------------------
      # relocation_incentive_cents is tiered on the net, and the net is reduced
      # by relocation_incentive_cents. EVALUATION ORDER IS PINNED: the tier is
      # selected from base_net_cents, which is computed BEFORE the incentive is
      # deducted. Selecting the tier from the post-deduction figure is WRONG.
      base_net_cents = offer_price_cents - gross_deductions_cents + mi_contribution_credit_cents

      if   base_net_cents >= RELOCATION_TIER_HIGH_MIN_CENTS: relocation_incentive_cents = RELOCATION_HIGH_CENTS
      elif base_net_cents >= RELOCATION_TIER_MID_MIN_CENTS:  relocation_incentive_cents = RELOCATION_MID_CENTS
      else:                                                  relocation_incentive_cents = RELOCATION_LOW_CENTS

      net_proceeds_cents = base_net_cents - relocation_incentive_cents
    input_set: |
      L6 JUNIOR_LIEN_PAYOFF is the whole divergence between the two variants:
        PRELIMINARY — sum of JuniorLien.demand_cents over liens on the case whose
          status IN {DEMAND_SENT, NEGOTIATING, APPROVED}; liens still in
          IDENTIFIED (no demand yet) and liens in REFUSED are excluded; a lien
          whose demand_cents is null contributes 0.
        FINAL — sum of JuniorLien.approved_contribution_cents over liens on the
          case whose status == APPROVED only; every other status contributes 0.
      Both variants sum over the same case, in ascending JuniorLien.lien_position
      order, tie-broken by created_at ASC (positions are unique per case, so the
      tie-break is never reached; it is pinned so the order is total).
    constants:
      TRANSFER_TAX_PCT: 0.0075
      SERVICER_COMMISSION_CAP_PCT: 0.055
      RELOCATION_TIER_HIGH_MIN_CENTS: 20000000
      RELOCATION_TIER_MID_MIN_CENTS: 10000000
      RELOCATION_HIGH_CENTS: 300000
      RELOCATION_MID_CENTS: 200000
      RELOCATION_LOW_CENTS: 100000
    precision: "whole cents; round_half_up applied per line item, never to the aggregate"
    variants:
      - name: PRELIMINARY
        when: "the negotiator's forward-looking estimate, prepared before the junior lien holders and the MI carrier have committed"
        difference: "charges the full listing commission_pct, prices junior liens at their demanded payoff over the three in-flight statuses, and credits no MI contribution"
      - name: FINAL
        when: "the servicer-auditable sheet that an ApprovalLetter must be issued against"
        difference: "clamps the commission to SERVICER_COMMISSION_CAP_PCT, prices junior liens at their APPROVED contributions only, and credits the APPROVED MI contribution"

  - name: hardship_severity_score
    trigger: "POST /short-sale/hardship-packages/{id}/submit writes hardship_score_intake; POST /short-sale/hardship-packages/{id}/decision writes hardship_score_audit"
    algorithm: weighted_scoring
    formula: |
      deficit_ratio  = min( (monthly_expenses_cents - monthly_income_cents) / monthly_income_cents , 1 )
      deficit_ratio  = max(deficit_ratio, 0)
      reserve_months = liquid_assets_cents / monthly_expenses_cents
      reserve_relief = max( 0 , 1 - min(reserve_months, RESERVE_CAP_MONTHS) / RESERVE_CAP_MONTHS )
      doc_support    = qualifying_document_count / 4       # 4 == len(REQUIRED_DOCUMENT_TYPES)

      raw = REASON_WEIGHT[hardship_reason]
          + DEFICIT_WEIGHT * deficit_ratio
          + RESERVE_WEIGHT * reserve_relief
          + DOC_WEIGHT     * doc_support

      score = round_half_up(raw, 2)      # single rounding, at the very end
    input_set: |
      qualifying_document_count counts DISTINCT doc_type values drawn from
      REQUIRED_DOCUMENT_TYPES = [HARDSHIP_LETTER, FINANCIAL_WORKSHEET,
      BANK_STATEMENT, AUTHORIZATION_FORM], over SellerDocument rows whose
      package_id == this package. Which rows qualify is the variant divergence.
      Documents whose doc_type is outside REQUIRED_DOCUMENT_TYPES never count.
    constants:
      DEFICIT_WEIGHT: 30
      RESERVE_WEIGHT: 20
      DOC_WEIGHT: 10
      RESERVE_CAP_MONTHS: 6
      HARDSHIP_MIN_SCORE: 55.00
      REASON_WEIGHT: { JOB_LOSS: 40, MEDICAL: 35, DIVORCE: 30, INCOME_REDUCTION: 25, RELOCATION: 20, OTHER: 10 }
    precision: "2 decimal places, round_half_up, applied once to `raw`"
    variants:
      - name: INTAKE
        when: "evaluated by POST /short-sale/hardship-packages/{id}/submit"
        difference: "a doc_type qualifies when it has at least one SellerDocument with status IN {PENDING, VERIFIED}; document age is ignored entirely"
      - name: SERVICER_AUDIT
        when: "evaluated by POST /short-sale/hardship-packages/{id}/decision"
        difference: "a doc_type qualifies only when it has at least one SellerDocument with status == VERIFIED AND floor((current_utc - issued_on)/86400 s) <= DOCUMENT_MAX_AGE_DAYS; a stale-dated or still-PENDING document drops the doc_support term"

  - name: minimum_acceptable_net
    trigger: "recomputed whenever ShortSaleCase.final_value_cents changes (valuation recorded, dispute SUSTAINED or PARTIAL) or whenever the case's MiClaim leaves PENDING; writes ShortSaleCase.minimum_acceptable_net_cents"
    algorithm: threshold
    formula: |
      controlling = the case's controlling Valuation (see input_set)
      if controlling is absent:
          final_value_cents            = null
          minimum_acceptable_net_cents = null
          return

      final_value_cents = controlling.value_cents
      value_floor_cents = round_half_up(final_value_cents * MIN_NET_RATIO[case.investor_type])
      upb_floor_cents   = round_half_up(case.unpaid_principal_balance_cents * UPB_FLOOR_RATIO)

      mi = the case's MiClaim
      mi_credit_cents = mi.required_contribution_cents if (mi exists and mi.status == APPROVED) else 0

      minimum_acceptable_net_cents = max(value_floor_cents, upb_floor_cents) - mi_credit_cents
    input_set: |
      Controlling Valuation selector — eligibility: Valuation.case_id == case.id
      AND Valuation.status IN {RECEIVED, DISPUTED, REVISED, FINAL} AND
      value_cents IS NOT NULL. Ranking: effective_date DESC. Tie-break:
      created_at DESC. Empty candidate set: final_value_cents and
      minimum_acceptable_net_cents are both null and any approval-letter
      issuance fails with ERR_CONTROLLING_VALUATION_MISSING.
    constants:
      MIN_NET_RATIO: { GSE: 0.88, PORTFOLIO: 0.84, FHA: 0.86 }
      UPB_FLOOR_RATIO: 0.60
    precision: "whole cents; round_half_up applied to each floor separately, before max() and before the MI subtraction"
    variants: []

  - name: days_on_market
    trigger: "read on every GET that returns a Listing, and evaluated as a precondition by POST /short-sale/offers/{id}/submit"
    algorithm: threshold
    formula: |
      window_end = listing.ended_at if listing.ended_at is not null else current_utc
      days_on_market = floor( (min(current_utc, window_end) - listing.listed_at).total_seconds() / 86400 )
      days_on_market = max(days_on_market, 0)
      submittable    = (days_on_market >= MIN_MARKETING_DAYS)   # >= , not >
    input_set: |
      Controlling Listing selector — eligibility: Listing.case_id == case.id AND
      marketing_status IN {ACTIVE, UNDER_CONTRACT}. Ranking: listed_at DESC.
      Tie-break: created_at DESC. Empty candidate set: the submission fails with
      ERR_MARKETING_PERIOD_NOT_MET. The listing-window overlap rule guarantees
      the candidate set never holds more than one row.
    constants:
      MIN_MARKETING_DAYS: 15
    precision: "whole days, floor; the comparison against MIN_MARKETING_DAYS is inclusive (>=)"
    variants: []

  - name: dispute_reconciliation
    trigger: "POST /short-sale/valuations/{id}/disputes writes variance_pct; POST /short-sale/disputes/{id}/adjudicate writes resolved_value_cents"
    algorithm: constraint_propagation
    formula: |
      # at filing time
      variance_pct = round_half_up( abs(claimed_value_cents - valuation.value_cents) / valuation.value_cents , 4 )
      admissible   = (variance_pct >= DISPUTE_MIN_VARIANCE_PCT) and (comparable_count >= DISPUTE_MIN_COMPARABLES)

      # at adjudication time — one branch, three different outputs
      if   resolution == SUSTAINED: resolved_value_cents = claimed_value_cents
      elif resolution == PARTIAL:   resolved_value_cents = round_half_up( (claimed_value_cents + valuation.value_cents) / 2 )
      else:                         resolved_value_cents = valuation.value_cents      # DENIED

      # propagation, only on SUSTAINED and PARTIAL
      if resolution IN {SUSTAINED, PARTIAL}:
          valuation.value_cents = resolved_value_cents
          re-run calculations.minimum_acceptable_net for the case
    input_set: "exactly one Valuation (the dispute's valuation_id) and the dispute row itself; no aggregation"
    constants:
      DISPUTE_MIN_VARIANCE_PCT: 0.05
      DISPUTE_MIN_COMPARABLES: 3
    precision: "variance_pct to 4 decimal places round_half_up; resolved_value_cents to whole cents round_half_up"
    variants: []

  - name: closing_deadline
    trigger: "POST /short-sale/cases/{id}/approval-letters (original letter) and the successor letter minted by an ExtensionRequest GRANT; writes ApprovalLetter.closing_deadline and cumulative_extension_days_used"
    algorithm: aggregation
    formula: |
      # original letter
      issued_at        = current_utc
      closing_deadline = issued_at + APPROVAL_TERM_DAYS days
      cumulative_extension_days_used = 0

      # successor letter minted by a GRANT on predecessor P
      granted_days     = request.requested_days
      closing_deadline = P.closing_deadline + granted_days days
      cumulative_extension_days_used = P.cumulative_extension_days_used + granted_days

      # admission check performed BEFORE minting the successor
      admissible = (P.cumulative_extension_days_used + request.requested_days
                    <= MAX_CUMULATIVE_EXTENSION_DAYS)          # <= , not <
    input_set: |
      cumulative_extension_days_used is the running sum over the letter's
      supersede chain: the sum of granted_days over every ExtensionRequest whose
      approval_letter_id is any letter in the chain rooted at the original
      (supersedes_approval_id == null) letter and whose status == GRANTED,
      processed in created_at ASC order. DENIED and CANCELLED requests
      contribute 0 and must leave the running sum and the deadline untouched.
    constants:
      APPROVAL_TERM_DAYS: 45
      MAX_CUMULATIVE_EXTENSION_DAYS: 60
    precision: "whole calendar days added to the ISO-8601 UTC instant; time-of-day is preserved exactly"
    variants: []

  - name: vendor_slot_admission
    trigger: "POST /short-sale/cases/{id}/valuations, before the Valuation row is created"
    algorithm: interval_merge
    formula: |
      # (1) buffered-open conflict against the vendor's existing slots
      conflict = EXISTS other Valuation V where
                     V.vendor_id == new.vendor_id
                 AND V.status IN {ORDERED, RECEIVED, DISPUTED, REVISED, FINAL}
                 AND new.inspection_start <  V.inspection_end   + VENDOR_INSPECTION_BUFFER_MINUTES minutes
                 AND new.inspection_end   >  V.inspection_start - VENDOR_INSPECTION_BUFFER_MINUTES minutes
      # STRICT inequalities on both sides: a gap of exactly
      # VENDOR_INSPECTION_BUFFER_MINUTES is admissible.

      # (2) aggregate daily capacity, evaluated only after (1) passes
      same_day = COUNT of Valuation V where V.vendor_id == new.vendor_id
                 AND date(V.inspection_start) == date(new.inspection_start)   # UTC calendar date
      over_capacity = (same_day >= vendor.daily_inspection_capacity)          # >= , not >
    input_set: "every Valuation row already persisted for the same vendor_id, across all cases; no status is excluded"
    constants:
      VENDOR_INSPECTION_BUFFER_MINUTES: 60
    precision: "instants compared at whole-second resolution; the calendar date is the UTC date of inspection_start"
    variants: []

  - name: listing_window_admission
    trigger: "POST /short-sale/cases/{id}/listings, before the Listing row is created"
    algorithm: interval_merge
    formula: |
      # HALF-OPEN [listed_at, ended_at) semantics. A null ended_at means +infinity.
      new_end = +infinity            # a newly created listing always has ended_at == null
      conflict = EXISTS other Listing L where
                     L.case_id == new.case_id
                 AND new.listed_at < (L.ended_at if L.ended_at is not null else +infinity)
                 AND new_end       > L.listed_at
      # Adjacency is admissible: new.listed_at == L.ended_at does NOT conflict,
      # because the comparison on the left is strict.
    input_set: "every Listing row on the same case, in every marketing_status including WITHDRAWN"
    constants: {}
    precision: "instants compared at whole-second resolution"
    variants: []

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority; lowest number wins)
# =============================================================================
validations:
  - priority: 10
    category: auth
    check: "X-User-Role and X-User-ID headers are present, non-empty, and X-User-Role names a role declared in §1.7"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 20
    category: auth
    check: "the presented role appears in the endpoint's roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  - priority: 25
    category: auth
    check: "ownership — for the BpoVendor role X-User-ID == Valuation.vendor_id; for the JuniorLienHolder role X-User-ID == JuniorLien.holder_user_id"
    error_id: ERR_ACTOR_NOT_OWNER
    http_status: 403
    applies_to: "POST /short-sale/valuations/{id}/record-value, POST /short-sale/junior-liens/{id}/response"

  - priority: 28
    category: auth
    check: "segregation of duties — the adjudicating X-User-ID differs from Valuation.ordered_by_user_id; the deciding X-User-ID differs from ApprovalLetter.issued_by_user_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /short-sale/disputes/{id}/adjudicate, POST /short-sale/extension-requests/{id}/decision"

  - priority: 30
    category: existence
    check: "every id in the path resolves, validated left to right"
    error_id: ERR_CASE_NOT_FOUND
    http_status: 404
    applies_to: "all path-addressed endpoints; the entity-specific code is ERR_CASE_NOT_FOUND, ERR_PACKAGE_NOT_FOUND, ERR_DOCUMENT_NOT_FOUND, ERR_LISTING_NOT_FOUND, ERR_OFFER_NOT_FOUND, ERR_VALUATION_NOT_FOUND, ERR_DISPUTE_NOT_FOUND, ERR_LIEN_NOT_FOUND, ERR_MI_CLAIM_NOT_FOUND, ERR_APPROVAL_NOT_FOUND or ERR_EXTENSION_NOT_FOUND"

  - priority: 32
    category: existence
    check: "every id supplied in the request body resolves — Valuation.vendor_id names a BpoVendor, ApprovalLetter.offer_id names an Offer on the same case"
    error_id: ERR_VENDOR_NOT_FOUND
    http_status: 404
    applies_to: "POST /short-sale/cases/{id}/valuations, POST /short-sale/cases/{id}/approval-letters"

  - priority: 34
    category: business_constraint
    check: "request body shape — required fields present, types correct, enum members recognised, numeric bounds honoured"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"

  - priority: 36
    category: state
    check: "the supplied expected_case_version / expected_offer_version equals the parent's current version"
    error_id: ERR_STALE_CASE_VERSION
    http_status: 412
    applies_to: "POST /short-sale/cases/{id}/approval-letters (ERR_STALE_CASE_VERSION), POST /short-sale/offers/{id}/net-sheets (ERR_STALE_OFFER_VERSION)"

  - priority: 40
    category: state
    check: "the target resource is in a state from which the requested transition is declared in §1.2"
    error_id: ERR_OFFER_NOT_ACTIONABLE
    http_status: 409
    applies_to: "all action endpoints; the entity-specific code is ERR_CASE_NOT_ACTIONABLE, ERR_PACKAGE_NOT_ACTIONABLE, ERR_DOCUMENT_NOT_REVIEWABLE, ERR_LISTING_NOT_ACTIONABLE, ERR_OFFER_NOT_ACTIONABLE, ERR_VALUATION_NOT_ACTIONABLE, ERR_DISPUTE_NOT_OPEN, ERR_LIEN_NOT_ACTIONABLE, ERR_MI_CLAIM_NOT_DECIDABLE, ERR_APPROVAL_NOT_ACTIVE or ERR_EXTENSION_NOT_PENDING"

  - priority: 42
    category: state
    check: "the addressed ApprovalLetter has not passed its closing_deadline; when it has, the letter is moved to EXPIRED and the write is rejected"
    error_id: ERR_APPROVAL_EXPIRED
    http_status: 409
    applies_to: "POST /short-sale/approval-letters/{id}/close, POST /short-sale/approval-letters/{id}/extension-requests, POST /short-sale/extension-requests/{id}/decision"

  - priority: 44
    category: business_referential
    check: "uniqueness — at most one HardshipPackage per case, at most one MiClaim per case, at most one JuniorLien per (case_id, lien_position)"
    error_id: ERR_DUPLICATE_RESOURCE
    http_status: 409
    applies_to: "POST /short-sale/cases/{id}/hardship-packages, POST /short-sale/cases/{id}/mi-claims, POST /short-sale/cases/{id}/junior-liens"

  - priority: 48
    category: business_temporal
    check: "interval admission — calculations.listing_window_admission for listings (half-open, adjacency allowed) and the buffered-open half of calculations.vendor_slot_admission for valuations"
    error_id: ERR_LISTING_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /short-sale/cases/{id}/listings (ERR_LISTING_WINDOW_OVERLAP), POST /short-sale/cases/{id}/valuations (ERR_VENDOR_SCHEDULE_CONFLICT)"

  - priority: 52
    category: business_safety
    check: "compliance — every doc_type in REQUIRED_DOCUMENT_TYPES has a SellerDocument on the package with status IN {PENDING, VERIFIED} before submission"
    error_id: ERR_REQUIRED_DOCUMENT_MISSING
    http_status: 422
    applies_to: "POST /short-sale/hardship-packages/{id}/submit"

  - priority: 53
    category: business_safety
    check: "compliance — a document older than DOCUMENT_MAX_AGE_DAYS at review time may not be VERIFIED"
    error_id: ERR_DOCUMENT_EXPIRED
    http_status: 422
    applies_to: "POST /short-sale/documents/{id}/review"

  - priority: 54
    category: business_safety
    check: "compliance — deficiency_waiver == WAIVED requires case.deficiency_waiver_permitted == true"
    error_id: ERR_DEFICIENCY_WAIVER_NOT_PERMITTED
    http_status: 422
    applies_to: "POST /short-sale/cases/{id}/approval-letters"

  - priority: 56
    category: business_temporal
    check: "the vendor already holds daily_inspection_capacity inspections on the requested UTC calendar date"
    error_id: ERR_VENDOR_DAILY_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /short-sale/cases/{id}/valuations"

  - priority: 60
    category: business_referential
    check: "the case has a controlling Valuation, so final_value_cents and minimum_acceptable_net_cents are non-null"
    error_id: ERR_CONTROLLING_VALUATION_MISSING
    http_status: 422
    applies_to: "POST /short-sale/cases/{id}/approval-letters"

  - priority: 61
    category: business_referential
    check: "the case's HardshipPackage exists and has status == ACCEPTED"
    error_id: ERR_HARDSHIP_NOT_ACCEPTED
    http_status: 422
    applies_to: "POST /short-sale/offers/{id}/submit, POST /short-sale/cases/{id}/approval-letters"

  - priority: 62
    category: business_referential
    check: "the offer named by the letter has a NetSheet with variant == FINAL and status == CURRENT"
    error_id: ERR_STALE_NET_SHEET
    http_status: 409
    applies_to: "POST /short-sale/cases/{id}/approval-letters"

  - priority: 63
    category: business_referential
    check: "every JuniorLien on the case has status == APPROVED (a case with zero junior liens satisfies this vacuously)"
    error_id: ERR_JUNIOR_LIEN_UNRESOLVED
    http_status: 422
    applies_to: "POST /short-sale/cases/{id}/approval-letters"

  - priority: 64
    category: business_referential
    check: "the case's MiClaim, if one exists, has status IN {APPROVED, NOT_REQUIRED}"
    error_id: ERR_MI_APPROVAL_PENDING
    http_status: 422
    applies_to: "POST /short-sale/cases/{id}/approval-letters"

  - priority: 66
    category: business_constraint
    check: "the case has a controlling Listing, and on offer submission that listing has days_on_market >= MIN_MARKETING_DAYS. Net-sheet preparation needs the controlling Listing only for its commission_pct, so it checks existence but not the day count."
    error_id: ERR_MARKETING_PERIOD_NOT_MET
    http_status: 422
    applies_to: "POST /short-sale/offers/{id}/submit, POST /short-sale/offers/{id}/net-sheets"

  - priority: 67
    category: business_constraint
    check: "case.price_reduction_required == false"
    error_id: ERR_PRICE_REDUCTION_REQUIRED
    http_status: 422
    applies_to: "POST /short-sale/offers/{id}/submit"

  - priority: 68
    category: business_constraint
    check: "round_index + 1 <= MAX_NEGOTIATION_ROUNDS when re-submitting a REVISED offer"
    error_id: ERR_NEGOTIATION_ROUNDS_EXHAUSTED
    http_status: 422
    applies_to: "POST /short-sale/offers/{id}/submit"

  - priority: 69
    category: business_constraint
    check: "variance_pct >= DISPUTE_MIN_VARIANCE_PCT"
    error_id: ERR_DISPUTE_VARIANCE_TOO_SMALL
    http_status: 422
    applies_to: "POST /short-sale/valuations/{id}/disputes"

  - priority: 70
    category: business_constraint
    check: "comparable_count >= DISPUTE_MIN_COMPARABLES"
    error_id: ERR_DISPUTE_EVIDENCE_INSUFFICIENT
    http_status: 422
    applies_to: "POST /short-sale/valuations/{id}/disputes"

  - priority: 72
    category: business_fiscal
    check: "hardship_score_audit >= HARDSHIP_MIN_SCORE when the outcome is ACCEPT"
    error_id: ERR_HARDSHIP_SCORE_BELOW_MINIMUM
    http_status: 422
    applies_to: "POST /short-sale/hardship-packages/{id}/decision"

  - priority: 74
    category: business_fiscal
    check: "demand_cents (on demand) and contribution_cents (on an APPROVE response) are each <= JuniorLien.balance_cents"
    error_id: ERR_LIEN_CONTRIBUTION_EXCEEDS_CAP
    http_status: 422
    applies_to: "POST /short-sale/junior-liens/{id}/demand, POST /short-sale/junior-liens/{id}/response"

  - priority: 76
    category: business_fiscal
    check: "commission_cap_pct <= SERVICER_COMMISSION_CAP_PCT"
    error_id: ERR_COMMISSION_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /short-sale/cases/{id}/approval-letters"

  - priority: 78
    category: business_fiscal
    check: "approved_net_proceeds_cents >= case.minimum_acceptable_net_cents"
    error_id: ERR_NET_BELOW_MINIMUM
    http_status: 422
    applies_to: "POST /short-sale/cases/{id}/approval-letters"

  - priority: 80
    category: business_fiscal
    check: "letter.cumulative_extension_days_used + requested_days <= MAX_CUMULATIVE_EXTENSION_DAYS"
    error_id: ERR_EXTENSION_BUDGET_EXCEEDED
    http_status: 422
    applies_to: "POST /short-sale/extension-requests/{id}/decision"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:

  # ---- logical clock (test-driving namespace) -------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Sets the server's logical clock. The clock's startup default is exactly 2026-08-01T00:00:00Z; before any call to this endpoint the logical clock reads that instant and never falls back to real wall-clock time. Every deadline, freshness window, days-on-market figure and expiry in this API is evaluated against this clock."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["no persisted entity changes; lazy ApprovalLetter expiry is evaluated on the next write addressed at a letter, not here"]

  # ---- BPO vendors ----------------------------------------------------------
  - method: POST
    path: "/short-sale/bpo-vendors"
    description: "Registers a broker-price-opinion vendor firm. Immutable configuration: there is no update or delete endpoint and the row carries only id and created_at."
    roles: [PlatformAdmin]
    code: 201
    input: [vendor_name, license_state, daily_inspection_capacity]
    output: BpoVendor
    side_effects: []

  # ---- cases ----------------------------------------------------------------
  - method: POST
    path: "/short-sale/cases"
    description: "Opens a short sale file. negotiation_status starts at INTAKE and documentation_status at DOC_PENDING; deficiency_waiver_permitted is derived from investor_type."
    roles: [Negotiator]
    code: 201
    input: [property_address, investor_type, unpaid_principal_balance_cents, servicer_name]
    output: ShortSaleCase
    side_effects: ["assigned_negotiator_user_id := X-User-ID", "deficiency_waiver_permitted computed from investor_type"]

  - method: GET
    path: "/short-sale/cases/{id}"
    description: "Reads one case, including both state dimensions, the derived ledger totals and version (the value an OCC writer must echo back)."
    roles: [Negotiator, ListingAgent, ServicerAnalyst, MiUnderwriter, JuniorLienHolder, BpoVendor, PlatformAdmin]
    code: 200
    input: []
    output: ShortSaleCase
    side_effects: []

  - method: GET
    path: "/short-sale/cases"
    description: "Lists cases with pagination and optional filtering on either state dimension."
    roles: [Negotiator, ListingAgent, ServicerAnalyst, MiUnderwriter, PlatformAdmin]
    code: 200
    input: ["negotiation_status?", "documentation_status?", "limit?", "offset?"]
    output: ShortSaleCase[]
    side_effects: []

  # ---- hardship package -----------------------------------------------------
  - method: POST
    path: "/short-sale/cases/{id}/hardship-packages"
    description: "Assembles the seller's hardship package. At most one per case."
    roles: [Negotiator]
    code: 201
    input: [hardship_reason, monthly_income_cents, monthly_expenses_cents, liquid_assets_cents]
    output: HardshipPackage
    side_effects: ["assembled_by_user_id := X-User-ID", "all four document counters start at 0"]

  - method: GET
    path: "/short-sale/hardship-packages/{id}"
    description: "Reads one hardship package with both score variants and the four document counters."
    roles: [Negotiator, ServicerAnalyst, PlatformAdmin]
    code: 200
    input: []
    output: HardshipPackage
    side_effects: []

  - method: GET
    path: "/short-sale/cases/{id}/hardship-packages"
    description: "Reverse lookup from a case to its hardship package. Returns an array of length 0 or 1."
    roles: [Negotiator, ServicerAnalyst, PlatformAdmin]
    code: 200
    input: []
    output: HardshipPackage[]
    side_effects: []

  - method: POST
    path: "/short-sale/hardship-packages/{id}/submit"
    description: "Submits (or re-submits after revalidation) the package to the servicer and stamps hardship_score_intake."
    roles: [Negotiator]
    code: 200
    input: []
    output: HardshipPackage
    side_effects: ["hardship_score_intake := hardship_severity_score under the INTAKE variant", "case.negotiation_status INTAKE -> PACKAGE_REVIEW, or case.documentation_status DOC_STALE -> DOC_PENDING when re-submitting"]

  - method: POST
    path: "/short-sale/hardship-packages/{id}/decision"
    description: "Servicer accepts or rejects the package. Always stamps hardship_score_audit under the SERVICER_AUDIT variant before deciding."
    roles: [ServicerAnalyst]
    code: 200
    input: [outcome]
    output: HardshipPackage
    side_effects: ["hardship_score_audit := hardship_severity_score under the SERVICER_AUDIT variant", "on ACCEPT: case.negotiation_status PACKAGE_REVIEW -> MARKETED", "on REJECT: case.negotiation_status PACKAGE_REVIEW -> DECLINED"]

  # ---- seller documents -----------------------------------------------------
  - method: POST
    path: "/short-sale/hardship-packages/{id}/documents"
    description: "Files one piece of seller documentation against the package."
    roles: [Negotiator]
    code: 201
    input: [doc_type, issued_on, reference_label]
    output: SellerDocument
    side_effects: ["package.document_count += 1", "package.pending_document_count += 1"]

  - method: GET
    path: "/short-sale/hardship-packages/{id}/documents"
    description: "Reverse lookup from a package to its documents."
    roles: [Negotiator, ServicerAnalyst, PlatformAdmin]
    code: 200
    input: ["doc_type?", "status?"]
    output: SellerDocument[]
    side_effects: []

  - method: POST
    path: "/short-sale/documents/{id}/review"
    description: "Servicer verifies, rejects, or revokes a previously verified document. REVOKE is the compensating action for VERIFY and restores every package counter to its pre-VERIFY value."
    roles: [ServicerAnalyst]
    code: 200
    input: ["outcome", "note?"]
    output: SellerDocument
    side_effects: ["age_days_at_review stamped", "the package's pending/verified/rejected counters are adjusted", "case.documentation_status may move DOC_PENDING -> DOC_COMPLETE or DOC_COMPLETE -> DOC_PENDING"]

  # ---- listings -------------------------------------------------------------
  - method: POST
    path: "/short-sale/cases/{id}/listings"
    description: "Puts the property on the market. The new marketing window [listed_at, +infinity) must not overlap any existing window on the case under half-open semantics; a window that starts exactly at a prior window's ended_at is admissible."
    roles: [ListingAgent]
    code: 201
    input: [list_price_cents, commission_pct, listed_at]
    output: Listing
    side_effects: ["listing_agent_user_id := X-User-ID", "no case-dimension change: negotiation_status is moved to MARKETED by the package ACCEPT decision, not by listing creation"]

  - method: GET
    path: "/short-sale/cases/{id}/listings"
    description: "Reverse lookup from a case to its listings, each carrying its live days_on_market."
    roles: [Negotiator, ListingAgent, ServicerAnalyst, PlatformAdmin]
    code: 200
    input: ["marketing_status?"]
    output: Listing[]
    side_effects: []

  - method: POST
    path: "/short-sale/listings/{id}/price-reduction"
    description: "Records a price reduction, which clears the case's price_reduction_required gate."
    roles: [ListingAgent]
    code: 200
    input: [new_list_price_cents]
    output: Listing
    side_effects: ["list_price_cents := new_list_price_cents", "price_reduction_count += 1", "case.price_reduction_required := false"]

  - method: POST
    path: "/short-sale/listings/{id}/withdraw"
    description: "Closes this listing's marketing window at the supplied instant, freeing the case for a fresh, adjacent window."
    roles: [ListingAgent]
    code: 200
    input: [ended_at]
    output: Listing
    side_effects: ["marketing_status -> WITHDRAWN", "ended_at := the supplied instant"]

  # ---- offers ---------------------------------------------------------------
  - method: POST
    path: "/short-sale/cases/{id}/offers"
    description: "Records a buyer's purchase offer in DRAFT."
    roles: [ListingAgent]
    code: 201
    input: [buyer_name, buyer_financing, offer_price_cents, earnest_money_cents, requested_closing_days]
    output: Offer
    side_effects: ["round_index := 1"]

  - method: GET
    path: "/short-sale/offers/{id}"
    description: "Reads one offer, including round_index and version (the value an OCC net-sheet writer must echo back)."
    roles: [Negotiator, ListingAgent, ServicerAnalyst, PlatformAdmin]
    code: 200
    input: []
    output: Offer
    side_effects: []

  - method: GET
    path: "/short-sale/cases/{id}/offers"
    description: "Reverse lookup from a case to its offers."
    roles: [Negotiator, ListingAgent, ServicerAnalyst, PlatformAdmin]
    code: 200
    input: ["status?"]
    output: Offer[]
    side_effects: []

  - method: POST
    path: "/short-sale/offers/{id}/submit"
    description: "Submits a DRAFT or REVISED offer to the servicer. Gated on the accepted hardship package, the marketing period, the price-reduction flag and the negotiation-round budget."
    roles: [Negotiator]
    code: 200
    input: []
    output: Offer
    side_effects: ["status -> SUBMITTED", "submitted_at := current_utc", "round_index += 1 when re-submitting from REVISED", "controlling Listing.marketing_status -> UNDER_CONTRACT", "case.negotiation_status -> OFFER_UNDER_REVIEW"]

  - method: POST
    path: "/short-sale/offers/{id}/servicer-decision"
    description: "Servicer counters or rejects a submitted offer. Acceptance is not an outcome here: an offer becomes ACCEPTED only as a side effect of issuing an ApprovalLetter against it."
    roles: [ServicerAnalyst]
    code: 200
    input: ["outcome", "counter_price_cents?", "note?"]
    output: Offer
    side_effects: ["on COUNTER: status -> COUNTERED and servicer_counter_price_cents stamped", "on REJECT: the four-hop CASCADE-B chain (offer REJECTED -> listing back to ACTIVE and failed_offer_count += 1 -> price_reduction_required := true -> package REVALIDATION_REQUIRED and documentation_status DOC_STALE)"]

  - method: POST
    path: "/short-sale/offers/{id}/revise"
    description: "Listing side revises a countered offer, closing one negotiation round."
    roles: [ListingAgent]
    code: 200
    input: ["offer_price_cents", "earnest_money_cents?"]
    output: Offer
    side_effects: ["status -> REVISED", "offer_price_cents replaced", "every NetSheet on this offer with status CURRENT moves to STALE"]

  # ---- net sheets -----------------------------------------------------------
  - method: POST
    path: "/short-sale/offers/{id}/net-sheets"
    description: "Prepares a PRELIMINARY or FINAL net sheet for the offer. Optimistically concurrent on the parent Offer: expected_offer_version must equal the offer's current version."
    roles: [Negotiator]
    code: 201
    input: [variant, title_escrow_cents, property_tax_arrears_cents, hoa_arrears_cents, expected_offer_version]
    output: NetSheet
    side_effects: ["runs calculations.net_proceeds_to_first_lien under the requested variant", "any prior NetSheet on this offer with the same variant and status CURRENT moves to SUPERSEDED", "increments Offer.version by 1"]

  - method: GET
    path: "/short-sale/offers/{id}/net-sheets"
    description: "Reverse lookup from an offer to its net sheets, newest first by created_at DESC."
    roles: [Negotiator, ServicerAnalyst, PlatformAdmin]
    code: 200
    input: ["variant?", "status?"]
    output: NetSheet[]
    side_effects: []

  # ---- valuations -----------------------------------------------------------
  - method: POST
    path: "/short-sale/cases/{id}/valuations"
    description: "Orders a BPO or appraisal from a vendor. The inspection slot must clear the vendor's buffered-open conflict test and the vendor's aggregate daily capacity."
    roles: [ServicerAnalyst]
    code: 201
    input: [vendor_id, valuation_type, effective_date, inspection_start, inspection_end]
    output: Valuation
    side_effects: ["ordered_by_user_id := X-User-ID, which permanently bars that analyst from adjudicating disputes on this valuation"]

  - method: GET
    path: "/short-sale/valuations/{id}"
    description: "Reads one valuation."
    roles: [Negotiator, ServicerAnalyst, BpoVendor, PlatformAdmin]
    code: 200
    input: []
    output: Valuation
    side_effects: []

  - method: GET
    path: "/short-sale/valuations"
    description: "Lists valuations, filterable by owning case, by vendor, and by status."
    roles: [Negotiator, ServicerAnalyst, BpoVendor, PlatformAdmin]
    code: 200
    input: ["case_id?", "vendor_id?", "status?", "limit?", "offset?"]
    output: Valuation[]
    side_effects: []

  - method: POST
    path: "/short-sale/valuations/{id}/record-value"
    description: "Vendor records the opinion of value. Only the vendor named on the valuation may call this."
    roles: [BpoVendor]
    code: 200
    input: [value_cents]
    output: Valuation
    side_effects: ["status -> RECEIVED", "recorded_at := current_utc", "case.final_value_cents and case.minimum_acceptable_net_cents recomputed"]

  - method: POST
    path: "/short-sale/valuations/{id}/disputes"
    description: "Files a value dispute. Admissible only when the variance clears DISPUTE_MIN_VARIANCE_PCT and the evidence clears DISPUTE_MIN_COMPARABLES."
    roles: [Negotiator, ServicerAnalyst]
    code: 201
    input: [claimed_value_cents, comparable_count, rationale]
    output: ValuationDispute
    side_effects: ["variance_pct computed", "Valuation.status -> DISPUTED"]

  - method: GET
    path: "/short-sale/valuations/{id}/disputes"
    description: "Reverse lookup from a valuation to its disputes."
    roles: [Negotiator, ServicerAnalyst, PlatformAdmin]
    code: 200
    input: ["status?"]
    output: ValuationDispute[]
    side_effects: []

  - method: POST
    path: "/short-sale/disputes/{id}/adjudicate"
    description: "Adjudicates a dispute along one of three branches. The analyst who ordered the valuation is barred from calling this."
    roles: [ServicerAnalyst]
    code: 200
    input: ["resolution", "note?"]
    output: ValuationDispute
    side_effects: ["resolved_value_cents computed per branch", "on SUSTAINED or PARTIAL: the five-hop CASCADE-A chain (dispute resolved -> valuation REVISED with the new value -> case minimum_acceptable_net recomputed -> under-water ACTIVE ApprovalLetter VOIDED -> its REQUESTED ExtensionRequests CANCELLED and case moves to RENEGOTIATION)", "on DENIED: Valuation.status -> FINAL and nothing else changes"]

  # ---- junior liens ---------------------------------------------------------
  - method: POST
    path: "/short-sale/cases/{id}/junior-liens"
    description: "Records a junior lien encumbering the property. lien_position is unique per case."
    roles: [Negotiator]
    code: 201
    input: [lien_position, holder_name, holder_user_id, balance_cents]
    output: JuniorLien
    side_effects: ["case.junior_lien_count += 1"]

  - method: GET
    path: "/short-sale/cases/{id}/junior-liens"
    description: "Reverse lookup from a case to its junior liens."
    roles: [Negotiator, ServicerAnalyst, JuniorLienHolder, PlatformAdmin]
    code: 200
    input: ["status?"]
    output: JuniorLien[]
    side_effects: []

  - method: POST
    path: "/short-sale/junior-liens/{id}/demand"
    description: "Negotiator sends the holder a payoff demand, which the PRELIMINARY net sheet prices at."
    roles: [Negotiator]
    code: 200
    input: [demand_cents]
    output: JuniorLien
    side_effects: ["status -> DEMAND_SENT", "demand_cents stamped", "every PRELIMINARY NetSheet with status CURRENT on any offer of this case moves to STALE"]

  - method: POST
    path: "/short-sale/junior-liens/{id}/response"
    description: "Holder approves, refuses, keeps negotiating, or withdraws a prior approval. WITHDRAW_APPROVAL is the compensating action for APPROVE and must return case.junior_contribution_total_cents to its pre-approval value."
    roles: [JuniorLienHolder]
    code: 200
    input: ["outcome", "contribution_cents?"]
    output: JuniorLien
    side_effects: ["approved_contribution_cents set or zeroed", "case.junior_contribution_total_cents recomputed", "every FINAL NetSheet with status CURRENT on any offer of this case moves to STALE"]

  # ---- mortgage insurance ---------------------------------------------------
  - method: POST
    path: "/short-sale/cases/{id}/mi-claims"
    description: "Opens the mortgage insurance claim for the case. At most one per case."
    roles: [Negotiator]
    code: 201
    input: [mi_provider, coverage_pct, claim_reference]
    output: MiClaim
    side_effects: ["status := PENDING, which blocks approval-letter issuance until decided"]

  - method: GET
    path: "/short-sale/cases/{id}/mi-claims"
    description: "Reverse lookup from a case to its MI claim. Returns an array of length 0 or 1."
    roles: [Negotiator, ServicerAnalyst, MiUnderwriter, PlatformAdmin]
    code: 200
    input: []
    output: MiClaim[]
    side_effects: []

  - method: POST
    path: "/short-sale/mi-claims/{id}/decision"
    description: "MI carrier approves with a required contribution, declines, or declares the coverage not required."
    roles: [MiUnderwriter]
    code: 200
    input: ["outcome", "required_contribution_cents?", "contribution_form?"]
    output: MiClaim
    side_effects: ["required_contribution_cents and contribution_form stamped", "case.minimum_acceptable_net_cents recomputed", "every FINAL NetSheet with status CURRENT on any offer of this case moves to STALE"]

  # ---- approval letters -----------------------------------------------------
  - method: POST
    path: "/short-sale/cases/{id}/approval-letters"
    description: "Issues the short sale approval letter against a submitted offer. Optimistically concurrent on the parent ShortSaleCase: expected_case_version must equal the case's current version."
    roles: [ServicerAnalyst]
    code: 201
    input: ["offer_id", "approved_net_proceeds_cents", "commission_cap_pct", "seller_relocation_incentive_cents", "deficiency_waiver", "conditions?", "expected_case_version"]
    output: ApprovalLetter
    side_effects: ["issued_at := current_utc and closing_deadline := issued_at + APPROVAL_TERM_DAYS days", "Offer.status -> ACCEPTED", "case.negotiation_status OFFER_UNDER_REVIEW -> APPROVAL_ACTIVE", "increments ShortSaleCase.version by 1"]

  - method: GET
    path: "/short-sale/approval-letters/{id}"
    description: "Reads one approval letter, including closing_deadline and the chain's cumulative_extension_days_used."
    roles: [Negotiator, ListingAgent, ServicerAnalyst, PlatformAdmin]
    code: 200
    input: []
    output: ApprovalLetter
    side_effects: []

  - method: GET
    path: "/short-sale/approval-letters"
    description: "Lists approval letters, filterable by owning case, by approved offer, and by the letter each one supersedes."
    roles: [Negotiator, ListingAgent, ServicerAnalyst, PlatformAdmin]
    code: 200
    input: ["case_id?", "offer_id?", "supersedes_approval_id?", "status?", "limit?", "offset?"]
    output: ApprovalLetter[]
    side_effects: []

  - method: POST
    path: "/short-sale/approval-letters/{id}/close"
    description: "Closes the transaction under an active letter, on or before its closing deadline."
    roles: [Negotiator]
    code: 200
    input: []
    output: ApprovalLetter
    side_effects: ["status -> CLOSED", "case.negotiation_status APPROVAL_ACTIVE -> CLOSED", "controlling Listing.marketing_status -> WITHDRAWN with ended_at := current_utc"]

  - method: POST
    path: "/short-sale/approval-letters/{id}/extension-requests"
    description: "Files a closing extension request against an active letter."
    roles: [Negotiator]
    code: 201
    input: [requested_days, reason]
    output: ExtensionRequest
    side_effects: ["requested_by_user_id := X-User-ID"]

  - method: GET
    path: "/short-sale/approval-letters/{id}/extension-requests"
    description: "Reverse lookup from an approval letter to its extension requests."
    roles: [Negotiator, ServicerAnalyst, PlatformAdmin]
    code: 200
    input: ["status?"]
    output: ExtensionRequest[]
    side_effects: []

  - method: POST
    path: "/short-sale/extension-requests/{id}/decision"
    description: "Servicer grants or denies the extension. A grant mints a successor approval letter; the analyst who issued the predecessor is barred from deciding."
    roles: [ServicerAnalyst]
    code: 200
    input: [outcome]
    output: ExtensionRequest
    side_effects: ["on GRANT: the three-hop CASCADE-C chain (successor ApprovalLetter minted with the extended deadline -> predecessor moves to SUPERSEDED -> the predecessor's other REQUESTED ExtensionRequests move to CANCELLED)", "on DENY: granted_days := 0 and the letter's deadline and cumulative_extension_days_used are left untouched"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # -- authentication / authorization ----------------------------------------
  - { id: ERR_UNAUTHENTICATED,               http: 401, condition: "X-User-Role or X-User-ID header missing, empty, or naming a role not declared in §1.7" }
  - { id: ERR_UNAUTHORIZED,                  http: 403, condition: "the presented role is not listed in the endpoint's roles" }
  - { id: ERR_ACTOR_NOT_OWNER,               http: 403, condition: "a BpoVendor whose X-User-ID != Valuation.vendor_id records a value, or a JuniorLienHolder whose X-User-ID != JuniorLien.holder_user_id responds to a demand" }
  - { id: ERR_SEGREGATION_OF_DUTIES,         http: 403, condition: "the adjudicating analyst is the valuation's ordered_by_user_id, or the deciding analyst is the approval letter's issued_by_user_id" }
  # -- request shape ----------------------------------------------------------
  - { id: ERR_INVALID_REQUEST,               http: 400, condition: "a required body field is missing, a type is wrong, an enum member is unrecognised, or a numeric bound in §1.1 constraints is violated" }
  # -- existence --------------------------------------------------------------
  - { id: ERR_CASE_NOT_FOUND,                http: 404, condition: "no ShortSaleCase with the given id" }
  - { id: ERR_PACKAGE_NOT_FOUND,             http: 404, condition: "no HardshipPackage with the given id" }
  - { id: ERR_DOCUMENT_NOT_FOUND,            http: 404, condition: "no SellerDocument with the given id" }
  - { id: ERR_LISTING_NOT_FOUND,             http: 404, condition: "no Listing with the given id" }
  - { id: ERR_OFFER_NOT_FOUND,               http: 404, condition: "no Offer with the given id, or the offer_id in an approval-letter body does not belong to the path case" }
  - { id: ERR_VALUATION_NOT_FOUND,           http: 404, condition: "no Valuation with the given id" }
  - { id: ERR_DISPUTE_NOT_FOUND,             http: 404, condition: "no ValuationDispute with the given id" }
  - { id: ERR_LIEN_NOT_FOUND,                http: 404, condition: "no JuniorLien with the given id" }
  - { id: ERR_MI_CLAIM_NOT_FOUND,            http: 404, condition: "no MiClaim with the given id" }
  - { id: ERR_APPROVAL_NOT_FOUND,            http: 404, condition: "no ApprovalLetter with the given id" }
  - { id: ERR_EXTENSION_NOT_FOUND,           http: 404, condition: "no ExtensionRequest with the given id" }
  - { id: ERR_VENDOR_NOT_FOUND,              http: 404, condition: "the vendor_id in a valuation body names no BpoVendor" }
  # -- optimistic concurrency -------------------------------------------------
  - { id: ERR_STALE_CASE_VERSION,            http: 412, condition: "expected_case_version does not equal ShortSaleCase.version at approval-letter issuance" }
  - { id: ERR_STALE_OFFER_VERSION,           http: 412, condition: "expected_offer_version does not equal Offer.version at net-sheet preparation" }
  # -- uniqueness -------------------------------------------------------------
  - { id: ERR_DUPLICATE_RESOURCE,            http: 409, condition: "a second HardshipPackage or MiClaim on a case, or a second JuniorLien at the same lien_position on a case" }
  # -- state preconditions ----------------------------------------------------
  - { id: ERR_CASE_NOT_ACTIONABLE,           http: 409, condition: "the case's negotiation_status forbids the requested operation (for example ordering a valuation on a CLOSED or DECLINED case)" }
  - { id: ERR_PACKAGE_NOT_ACTIONABLE,        http: 409, condition: "submit called on a package outside {DRAFT, REVALIDATION_REQUIRED}, or decision called on a package whose status != SUBMITTED" }
  - { id: ERR_DOCUMENT_NOT_REVIEWABLE,       http: 409, condition: "VERIFY or REJECT on a document whose status != PENDING, REVOKE on a document whose status != VERIFIED, or any review while the package is REJECTED" }
  - { id: ERR_LISTING_NOT_ACTIONABLE,        http: 409, condition: "price-reduction or withdraw on a listing whose marketing_status == WITHDRAWN, or a withdraw whose ended_at is not strictly after listed_at" }
  - { id: ERR_OFFER_NOT_ACTIONABLE,          http: 409, condition: "submit on an offer outside {DRAFT, REVISED}, servicer-decision on an offer whose status != SUBMITTED, or revise on an offer whose status != COUNTERED" }
  - { id: ERR_VALUATION_NOT_ACTIONABLE,      http: 409, condition: "record-value on a valuation whose status != ORDERED, or a dispute filed against a valuation whose status is not in {RECEIVED, REVISED}" }
  - { id: ERR_DISPUTE_NOT_OPEN,              http: 409, condition: "adjudicate called on a dispute whose status != OPEN" }
  - { id: ERR_LIEN_NOT_ACTIONABLE,           http: 409, condition: "demand on a lien whose status != IDENTIFIED, or a response whose outcome is not declared from the lien's current status" }
  - { id: ERR_MI_CLAIM_NOT_DECIDABLE,        http: 409, condition: "decision called on an MiClaim whose status != PENDING" }
  - { id: ERR_APPROVAL_NOT_ACTIVE,           http: 409, condition: "close, extension filing, or extension decision addressed at a letter whose status != ACTIVE" }
  - { id: ERR_APPROVAL_EXPIRED,              http: 409, condition: "the addressed ApprovalLetter's closing_deadline is already behind current_utc; the letter is moved to EXPIRED and the write is refused" }
  - { id: ERR_EXTENSION_NOT_PENDING,         http: 409, condition: "decision called on an ExtensionRequest whose status != REQUESTED" }
  - { id: ERR_STALE_NET_SHEET,               http: 409, condition: "the offer named by an approval letter has no NetSheet with variant FINAL and status CURRENT" }
  # -- temporal / interval ----------------------------------------------------
  - { id: ERR_LISTING_WINDOW_OVERLAP,        http: 409, condition: "the new listing's half-open marketing window overlaps an existing window on the same case" }
  - { id: ERR_VENDOR_SCHEDULE_CONFLICT,      http: 409, condition: "the requested inspection slot sits within VENDOR_INSPECTION_BUFFER_MINUTES of another slot already held by the same vendor" }
  - { id: ERR_VENDOR_DAILY_CAPACITY_EXCEEDED,http: 422, condition: "the vendor already holds daily_inspection_capacity inspections on the requested UTC calendar date" }
  # -- compliance / safety ----------------------------------------------------
  - { id: ERR_REQUIRED_DOCUMENT_MISSING,     http: 422, condition: "a doc_type in REQUIRED_DOCUMENT_TYPES has no SellerDocument on the package with status in {PENDING, VERIFIED} at submission" }
  - { id: ERR_DOCUMENT_EXPIRED,              http: 422, condition: "a VERIFY review of a document whose age at review exceeds DOCUMENT_MAX_AGE_DAYS" }
  - { id: ERR_DEFICIENCY_WAIVER_NOT_PERMITTED,http: 422, condition: "deficiency_waiver == WAIVED on a case whose deficiency_waiver_permitted is false (investor_type == PORTFOLIO)" }
  # -- cross-entity readiness -------------------------------------------------
  - { id: ERR_CONTROLLING_VALUATION_MISSING, http: 422, condition: "the case has no Valuation with a recorded value, so minimum_acceptable_net_cents is null" }
  - { id: ERR_HARDSHIP_NOT_ACCEPTED,         http: 422, condition: "the case has no HardshipPackage, or its status != ACCEPTED, at offer submission or approval-letter issuance" }
  - { id: ERR_JUNIOR_LIEN_UNRESOLVED,        http: 422, condition: "at least one JuniorLien on the case has a status other than APPROVED at approval-letter issuance" }
  - { id: ERR_MI_APPROVAL_PENDING,           http: 422, condition: "the case's MiClaim has status PENDING or DECLINED at approval-letter issuance" }
  # -- marketing / negotiation constraints ------------------------------------
  - { id: ERR_MARKETING_PERIOD_NOT_MET,      http: 422, condition: "the case has no controlling Listing (on offer submission or net-sheet preparation), or the controlling listing's days_on_market is below MIN_MARKETING_DAYS at offer submission" }
  - { id: ERR_PRICE_REDUCTION_REQUIRED,      http: 422, condition: "case.price_reduction_required is true and no price reduction has been recorded since" }
  - { id: ERR_NEGOTIATION_ROUNDS_EXHAUSTED,  http: 422, condition: "re-submitting a REVISED offer would push round_index above MAX_NEGOTIATION_ROUNDS" }
  - { id: ERR_DISPUTE_VARIANCE_TOO_SMALL,    http: 422, condition: "the filed variance_pct is below DISPUTE_MIN_VARIANCE_PCT" }
  - { id: ERR_DISPUTE_EVIDENCE_INSUFFICIENT, http: 422, condition: "comparable_count is below DISPUTE_MIN_COMPARABLES" }
  # -- fiscal -----------------------------------------------------------------
  - { id: ERR_HARDSHIP_SCORE_BELOW_MINIMUM,  http: 422, condition: "an ACCEPT decision on a package whose SERVICER_AUDIT score is below HARDSHIP_MIN_SCORE" }
  - { id: ERR_LIEN_CONTRIBUTION_EXCEEDS_CAP, http: 422, condition: "demand_cents or contribution_cents exceeds the lien's balance_cents" }
  - { id: ERR_COMMISSION_CAP_EXCEEDED,       http: 422, condition: "commission_cap_pct on an approval letter exceeds SERVICER_COMMISSION_CAP_PCT" }
  - { id: ERR_NET_BELOW_MINIMUM,             http: 422, condition: "approved_net_proceeds_cents is below case.minimum_acceptable_net_cents" }
  - { id: ERR_EXTENSION_BUDGET_EXCEEDED,     http: 422, condition: "granting the request would push cumulative_extension_days_used above MAX_CUMULATIVE_EXTENSION_DAYS" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Negotiator
    description: "The short sale negotiator who owns the file end to end: assembles the hardship package and seller documentation, sends junior lien demands, opens the MI claim, prepares net sheets, submits offers to the servicer, files valuation disputes and extension requests, and closes under the approval letter."
    identity: opaque
    exclusive_operations:
      - "POST /short-sale/cases"
      - "POST /short-sale/cases/{id}/hardship-packages"
      - "POST /short-sale/hardship-packages/{id}/documents"
      - "POST /short-sale/hardship-packages/{id}/submit"
      - "POST /short-sale/offers/{id}/submit"
      - "POST /short-sale/offers/{id}/net-sheets"
      - "POST /short-sale/cases/{id}/junior-liens"
      - "POST /short-sale/junior-liens/{id}/demand"
      - "POST /short-sale/cases/{id}/mi-claims"
      - "POST /short-sale/approval-letters/{id}/close"
      - "POST /short-sale/approval-letters/{id}/extension-requests"
    shared_operations:
      - "POST /short-sale/valuations/{id}/disputes (shared with ServicerAnalyst)"
      - "every GET under /short-sale"

  - name: ListingAgent
    description: "The listing brokerage. Owns the marketing window and the buyer-facing contract: creates and withdraws listings, records price reductions, files buyer offers, and revises countered offers."
    identity: opaque
    exclusive_operations:
      - "POST /short-sale/cases/{id}/listings"
      - "POST /short-sale/listings/{id}/price-reduction"
      - "POST /short-sale/listings/{id}/withdraw"
      - "POST /short-sale/cases/{id}/offers"
      - "POST /short-sale/offers/{id}/revise"
    shared_operations:
      - "GET /short-sale/cases, GET /short-sale/cases/{id}, and the case's listing, offer and approval-letter reverse lookups"

  - name: ServicerAnalyst
    description: "The loss-mitigation analyst at the servicing shop. Reviews seller documentation, decides the hardship package, orders valuations, counters or rejects offers, adjudicates valuation disputes, issues approval letters, and decides extension requests. Subject to two segregation-of-duties bars."
    identity: opaque
    exclusive_operations:
      - "POST /short-sale/documents/{id}/review"
      - "POST /short-sale/hardship-packages/{id}/decision"
      - "POST /short-sale/offers/{id}/servicer-decision"
      - "POST /short-sale/cases/{id}/valuations"
      - "POST /short-sale/disputes/{id}/adjudicate"
      - "POST /short-sale/cases/{id}/approval-letters"
      - "POST /short-sale/extension-requests/{id}/decision"
    shared_operations:
      - "POST /short-sale/valuations/{id}/disputes (shared with Negotiator)"
      - "every GET under /short-sale"

  - name: JuniorLienHolder
    description: "A subordinate lien holder deciding whether to release its lien for a partial payoff. May act only on liens whose holder_user_id equals its X-User-ID."
    identity: opaque
    exclusive_operations:
      - "POST /short-sale/junior-liens/{id}/response"
    shared_operations:
      - "GET /short-sale/cases/{id}, GET /short-sale/cases/{id}/junior-liens"

  - name: MiUnderwriter
    description: "The mortgage insurance carrier's underwriter. Sole decider of the MI claim and of the cash contribution the carrier demands as a condition of approval."
    identity: opaque
    exclusive_operations:
      - "POST /short-sale/mi-claims/{id}/decision"
    shared_operations:
      - "GET /short-sale/cases/{id}, GET /short-sale/cases/{id}/mi-claims"

  - name: BpoVendor
    description: "The valuation vendor firm. X-User-ID is the BpoVendor row's own id, and a vendor may record a value only on valuations whose vendor_id equals that id."
    identity: "entity_backed:BpoVendor"
    exclusive_operations:
      - "POST /short-sale/valuations/{id}/record-value"
    shared_operations:
      - "GET /short-sale/valuations, GET /short-sale/valuations/{id}, GET /short-sale/cases/{id}"

  - name: PlatformAdmin
    description: "Operations role. Registers BPO vendor firms and drives the logical clock. Holds no business decision rights on any case."
    identity: opaque
    exclusive_operations:
      - "POST /_clock/set_current_utc"
      - "POST /short-sale/bpo-vendors"
    shared_operations:
      - "every GET under /short-sale"
