  # --- Test-driving endpoints ---
  - method: POST
    path: "/vaccine-distribution/_clock/set_current_utc"
    description: "Set the logical clock. The server starts with the logical clock fixed at 2026-09-01T00:00:00Z and never falls back to wall-clock time; every deadline, expiry, window and excursion rule reads this value."
    roles: [PlatformAdmin]
    code: 200
    input: [current_utc]
    output: { current_utc: string }
    side_effects: ["every Carton whose current_expires_at is at or before the new clock advances to EXPIRED; carton administrative_expired recomputed"]
  - method: POST
    path: "/vaccine-distribution/_ops/run-cycle"
    description: "Advance the deferred-action epoch: lapse HELD reservations and acceptance windows whose interval has elapsed, and apply any standing-status changes queued under AFTER_CYCLE propagation."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: { lapsed_reservation_count: integer, lapsed_window_count: integer, deferred_standing_count: integer }
    side_effects:
      - "every HELD reservation whose end_at is at or before the logical clock → LAPSED"
      - "every AllocationWindow whose closes_at is at or before the logical clock and status OPEN → CLOSED"
      - "every jurisdiction program with a pending AFTER_CYCLE standing change has its standing_status applied"

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  # --- Authentication and authorization ---
  - id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http: 400
    condition: "X-User-ID or X-User-Role header missing, malformed, or naming a role that does not exist"
  - id: ERR_INSUFFICIENT_PERMISSIONS
    http: 403
    condition: "The acting role does not hold the operation in its exclusive or shared operation list"
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_<parent>_version does not match the parent entity's current version"

  # --- Resource not found ---
  - id: ERR_RESOURCE_NOT_FOUND
    http: 404
    condition: "A path-segment or body foreign key does not resolve to a declared, non-deleted resource"

  # --- Request shape ---
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Malformed body, missing required field, wrong type, or a value outside the field's declared enum or numeric range"
  - id: ERR_REJECTION_REASON_INVALID
    http: 400
    condition: "The rejection reason_code is not a member of the enum valid for the order's current state"
  - id: ERR_APPEAL_WINDOW_CLOSED
    http: 400
    condition: "The appeal was filed later than APPEAL_WINDOW_HOURS after adjudicated_at"

  # --- State ---
  - id: ERR_INVALID_STATE
    http: 409
    condition: "The target entity is not in a state that admits the requested operation"
  - id: ERR_ALREADY_TERMINAL
    http: 409
    condition: "The target entity is already in a terminal state for its machine"
  - id: ERR_BATCH_NOT_RELEASED
    http: 409
    condition: "The allocation batch is not in RELEASED state, so no window may open against it"
  - id: ERR_BATCH_NOT_RECALLABLE
    http: 409
    condition: "The allocation batch is DEPLETED or RECALLED and cannot be recalled again"
  - id: ERR_BATCH_ALREADY_EXPIRED
    http: 409
    condition: "The batch expiry_date is at or before the logical clock at release time"
  - id: ERR_WINDOW_NOT_OPEN
    http: 409
    condition: "The logical clock is outside [opens_at, closes_at) for the acceptance window being opened"
  - id: ERR_WINDOW_STILL_OPEN
    http: 409
    condition: "closes_at has not yet been reached, so the acceptance window cannot be closed"
  - id: ERR_WINDOW_CLOSED
    http: 409
    condition: "The parent acceptance window is CLOSED or the logical clock is outside its half-open interval"
  - id: ERR_ENTITLEMENT_NOT_ACCEPTING
    http: 409
    condition: "The entitlement is FULFILLED or LAPSED and can no longer receive orders"
  - id: ERR_ORDER_NOT_ACCEPTED
    http: 409
    condition: "The site order is not in ACCEPTED or PARTIALLY_ACCEPTED state, so a dispatch cannot be packed"
  - id: ERR_SHIPPER_NOT_SEALED
    http: 409
    condition: "The cold chain shipper has not been sealed, so nothing may be dispatched on it"
  - id: ERR_SHIPPER_NOT_RELEASED
    http: 409
    condition: "The cold chain shipper has not been released by a cold chain reviewer"
  - id: ERR_HOLD_NOT_CLEARED
    http: 409
    condition: "The shipper hold reason has not been cleared by a reviewer decision"
  - id: ERR_CARTON_IN_TRANSIT
    http: 409
    condition: "The carton is IN_TRANSIT and cannot be thawed, punctured or destroyed in place"
  - id: ERR_ALREADY_PUNCTURED
    http: 409
    condition: "The carton is already PUNCTURED and its beyond-use date is already the puncture limit"
  - id: ERR_RESERVATION_EXPIRED
    http: 409
    condition: "The storage reservation interval has already elapsed at the receiving instant"
  - id: ERR_RESERVATION_ALREADY_CONFIRMED
    http: 409
    condition: "The reservation is CONFIRMED and cannot be released by a cancellation"
  - id: ERR_APPEAL_NOT_FILED
    http: 409
    condition: "No AdjudicationAppeal in FILED state exists for the excursion"
  - id: ERR_APPEAL_ALREADY_OPEN
    http: 409
    condition: "An appeal is already open against the excursion's current adjudication"

  # --- Business safety ---
  - id: ERR_REFREEZE_PROHIBITED
    http: 422
    condition: "The product forbids refreezing and the carton has already left ultra-cold"
  - id: ERR_REFREEZE_FORBIDDEN
    http: 422
    condition: "The route would return a thawed carton to ultra-cold storage, which the product's cold-chain safety rule refuses"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 422
    condition: "The acting user is prohibited from performing this step because it already performed the paired step"
  - id: ERR_SITE_EQUIPMENT_NOT_CERTIFIED
    http: 422
    condition: "The site holds no RECORDED, unexpired equipment verification with outcome PASSED"
  - id: ERR_HUB_NOT_CERTIFIED
    http: 422
    condition: "The releasing hub's ultra-cold equipment is not certified at the acting instant"
  - id: ERR_DEST_EQUIPMENT_NOT_CERTIFIED
    http: 422
    condition: "The destination's equipment verification is expired or absent at the transfer approval instant"
  - id: ERR_DEST_CERT_EXPIRED_AT_DOCK
    http: 422
    condition: "The destination's equipment certificate expired between dispatch and arrival"
  - id: ERR_DEST_CAPABILITY_MISMATCH
    http: 422
    condition: "The destination's storage capability cannot hold the carton's required entry type"
  - id: ERR_DEST_RESTRICTED
    http: 422
    condition: "The destination's reported entry type differs from the required entry type, so the carton must park instead"
  - id: ERR_SITE_CANNOT_ACCEPT_ULTRA_COLD
    http: 422
    condition: "The site is AMBIENT_ONLY and cannot receive ultra-cold or refrigerated product"
  - id: ERR_SLICE_NOT_CLOSED
    http: 422
    condition: "A dose-affected slice at or below the adjudicated temperature boundary is still open"
  - id: ERR_SITE_FROZEN
    http: 422
    condition: "The site's inventory_status is FROZEN, so no excursion review may proceed there"
  - id: ERR_EXCURSION_PENDING_REVIEW
    http: 422
    condition: "A temperature excursion on the carton or shipper has not been adjudicated"
  - id: ERR_PENDING_EXCURSION
    http: 422
    condition: "A temperature excursion in REPORTED or UNDER_REVIEW blocks this custody, pack or destroy operation"
  - id: ERR_EXCURSION_NOT_ADJUDICATED
    http: 422
    condition: "The referenced excursion has no adjudication, so no wastage may be reconciled against it"
  - id: ERR_EXCURSION_EXCEEDS_CAP
    http: 422
    condition: "Accumulated excursion minutes exceed the product's cumulative allowance and the shipper cannot be released"
  - id: ERR_DRY_ICE_INSUFFICIENT
    http: 422
    condition: "Loaded dry ice is below the required dry ice for the shipper's carton payload"
  - id: ERR_LOGGER_MISSING
    http: 422
    condition: "No temperature logger serial is recorded on the shipper at seal time"
  - id: ERR_PACKING_EXCEEDED
    http: 422
    condition: "Packing lasted longer than the 48-hour limit and the payload must be re-iced"
  - id: ERR_LOGGER_READING_MISSING
    http: 422
    condition: "No logger reading exists at or after packing_completed_at"
  - id: ERR_LOGGER_READING_LATE
    http: 422
    condition: "The most recent logger reading is later than the grace window after arrival"
  - id: ERR_DOCK_REJECTION_REQUIRED
    http: 422
    condition: "The dock inspection found a certificate expiry or a pack hold that requires the shipment to be refused"

  # --- Business constraint ---
  - id: ERR_STORAGE_RESERVATION_CONFLICT
    http: 409
    condition: "The incoming reservation overlaps an incumbent reservation on the same site and entry type and the pooled quantity exceeds capacity"
  - id: ERR_SITE_CAPACITY_INSUFFICIENT
    http: 422
    condition: "The accepted or delivered carton quantity exceeds the destination's capacity for the required entry type"
  - id: ERR_BELOW_MIN_ORDER
    http: 422
    condition: "The accepted or released carton quantity is below the governing minimum order quantity"
  - id: ERR_ENTITLEMENT_EXHAUSTED
    http: 422
    condition: "The requested or accepted quantity exceeds the entitlement's available cartons or the program's weekly cap"
  - id: ERR_ORDER_EXCEEDS_ENTITLEMENT
    http: 422
    condition: "The submitted order requests more cartons than the entitlement currently has available"
  - id: ERR_CARTON_EXPIRED
    http: 422
    condition: "The carton's current_expires_at is at or before the logical clock"
  - id: ERR_THAW_WINDOW_EXPIRED
    http: 422
    condition: "The carton's thaw window expired before the transfer could be dispatched"
  - id: ERR_CARTON_POST_THAW
    http: 422
    condition: "The carton has already left ultra-cold and cannot be delivered into an ultra-cold-only requirement"
  - id: ERR_CARTON_NOT_IN_USE
    http: 422
    condition: "No administration has been recorded against the carton, so it cannot be punctured"
  - id: ERR_CARTON_DESTROYED
    http: 422
    condition: "The carton is DESTROYED and can no longer be appealed, reopened or transferred"
  - id: ERR_CARTONS_DESTROYED
    http: 422
    condition: "At least one carton released under the order has been destroyed, so the fulfillment cannot be reversed"
  - id: ERR_DOSES_ALREADY_ADMINISTERED
    http: 422
    condition: "A dose has already been administered from a carton under this order, so fulfillment cannot be reversed"
  - id: ERR_DOSE_ACCOUNTABILITY_MISMATCH
    http: 422
    condition: "The physical and administrative dose counts disagree over the entry set being reconciled"
  - id: ERR_REVERSAL_DRIFT_DETECTED
    http: 409
    condition: "A reversal would leave a residual charge on the released dose ledger with no matching terminal entry"
  - id: ERR_WASTAGE_THRESHOLD_EXCEEDED
    http: 422
    condition: "The reconciliation variance exceeds the product's wastage threshold proportion of the carton"
  - id: ERR_TRANSFER_NOT_ADJUDICATED
    http: 422
