            - "${from_a_mode} == CAPPED_TOTAL and ${from_b_mode} == CAPPED_TOTAL with ${from_b_a_id} == ${g1} — each list returns exactly 1 row, the SAME row, seen from either end"
            - "${dup_err} == ERR_INVALID_STACK_EDGE (HTTP 409): the unordered pair already has a row, so the reverse insertion is refused rather than creating a second, contradictory FORBIDDEN edge"
            - "${self_err} == ERR_INVALID_STACK_EDGE: program_b_id must differ from the path program, so the graph carries no self-loops"
            - "after both refusals G1's edge list still holds exactly 1 row with mode CAPPED_TOTAL"

  - section: state_machines
