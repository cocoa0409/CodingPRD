              payload: {}
              as: GrantOfficer
              captures: { aw_new: $.data.id, match_new: $.data.required_match_cents }
          assert:
            - "GrantAward.${aw_old}.formula_component_cents == GrantAward.${aw_new}.formula_component_cents (identical totals)"
            - "GrantAward.${aw_old}.required_match_cents == 25000 (chartered 2024-03-10, ~36 months before award -> standard 25%)"
            - "GrantAward.${aw_new}.required_match_cents == 10000 (chartered 2026-03-10, ~12 months before award -> reduced 10%)"
            - "GrantAward.${aw_old}.required_match_cents != GrantAward.${aw_new}.required_match_cents"

  # ===========================================================================
  # Rule 2 — combinatorial_formula (different modes)
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: competitive_allocation_tiered_rates
        grounds:
          - calculations.competitive_allocation
          - entities.GrantApplication.fields.review_score
        distinguishing_aspect: |
          Mode (a): a 3-input tiered-rate formula (review_score, request,
          pool headroom) with non-linear tier selection — request 50000 at
          score 80 funds exactly floor(0.80 * 50000) = 40000 via the 80%
          marginal tier, not an average-rate smoothing of the request.
        test_recipe:
          setup:
            - "CHARTERED member mC, cycle with formula_pool 0 and competitive_pool 1000000, three applications from mC... no: one application per member; three CHARTERED members each with one UNDER_REVIEW application requesting 50000 competitive, scored 80, 59, 95 respectively; cycle finalized to AWARDED"
          setup_api_calls:
            - call: "POST /housing-network/members"
              payload: { legal_name: "Tier Alpha", ein: "444444441", state_code: "OH", service_regions: ["39001"] }
              as: NetworkDirector
              captures: { mA: $.data.id }
            - call: "POST /housing-network/members/${mA}/begin-assessment"
              payload: {}
              as: Assessor
              captures: { aA: $.data.id }
            - call: "POST /housing-network/assessments/${aA}/submit"
              payload: { governance_score: 95, finance_score: 95, program_capacity_score: 95 }
              as: Assessor
            - call: "POST /housing-network/assessments/${aA}/score"
              payload: {}
              as: NetworkDirector
            - call: "POST /housing-network/assessments/${aA}/adjudicate"
              payload: { site_visit_adjustment: 0 }
              as: NetworkDirector
            - call: "POST /housing-network/counselors"
              payload: { member_id: "${mA}", full_name: "Ca", email: "ca@x.com" }
              as: NetworkDirector
              captures: { cA: $.data.id }
            - call: "POST /housing-network/courses"
              payload: { course_code: "RE-101", title: "Rental Services", program_area: "RENTAL", capacity: 10, ce_eligible: false, ce_credits: 0, delivery_start: "2026-09-02T00:00:00Z", delivery_end: "2026-09-20T00:00:00Z" }
              as: TrainingRegistrar
              captures: { crsA: $.data.id }
            - call: "POST /housing-network/courses/${crsA}/enrollments"
              payload: { counselor_id: "${cA}" }
              as: TrainingRegistrar
              captures: { eA: $.data.id }
            - call: "POST /housing-network/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T00:00:00Z" }
              as: NetworkDirector
            - call: "POST /housing-network/enrollments/${eA}/grade"
              payload: { score: 90 }
              as: TrainingRegistrar
            - call: "POST /housing-network/certifications"
              payload: { counselor_id: "${cA}", program_area: "RENTAL" }
              as: TrainingRegistrar
              captures: { certA: $.data.id }
            - call: "POST /housing-network/certifications/${certA}/certify"
              payload: {}
              as: TrainingRegistrar
            - call: "POST /housing-network/members/${mA}/charter"
              payload: {}
              as: NetworkDirector
            - call: "POST /housing-network/grant-cycles"
              payload: { fiscal_year: 2028, formula_pool_cents: 0, competitive_pool_cents: 1000000 }
              as: GrantOfficer
              captures: { cyc2: $.data.id, cyc2_v: $.data.version }
            - call: "POST /housing-network/grant-applications"
              payload: { cycle_id: "${cyc2}", member_id: "${mA}", program_area: "RENTAL", requested_formula_cents: 0, requested_competitive_cents: 50000, pledged_match_cents: 20000, expected_cycle_version: "${cyc2_v}" }
              as: MemberAdmin
              as_user_id: "${mA}"
              captures: { appA: $.data.id }
            - call: "POST /housing-network/grant-applications/${appA}/submit"
              payload: {}
              as: MemberAdmin
              as_user_id: "${mA}"
            - call: "POST /housing-network/grant-cycles/${cyc2}/lock-formula"
              payload: {}
              as: GrantOfficer
            - call: "POST /housing-network/grant-cycles/${cyc2}/open-competitive-review"
              payload: {}
              as: GrantOfficer
            - call: "POST /housing-network/grant-applications/${appA}/score"
              payload: { review_score: 80 }
              as: GrantOfficer
              as_user_id: "go-rev-A"
            - call: "POST /housing-network/grant-cycles/${cyc2}/finalize"
              payload: {}
              as: GrantOfficer
          trigger:
            - call: "POST /housing-network/grant-applications/${appA}/award"
              payload: {}
              as: GrantOfficer
              as_user_id: "go-appr-A"
              captures: { awA: $.data.id }
          assert:
            - "GrantAward.${awA}.competitive_component_cents == 40000 (80% tier: floor(0.80 * 50000))"
            - "GrantAward.${awA}.formula_component_cents == 0 (pool 0)"

      - name: formula_allocation_rounding_waterfall
        grounds:
          - calculations.formula_allocation
        distinguishing_aspect: |
          Mode (b) nested rounding with pinned order — per-member floor then
          waterfall remainder distribution: pool 100000 split across two
          equal-weight members yields raw 50000.00 each; when member A caps at
          request 30000, the 20000 excess redistributes to uncapped member B,
          giving B 70000 — different from a naive sum-then-round of 50000.
        test_recipe:
          setup:
            - "Two CHARTERED members mX and mY with equal households-served weights (0 households each, equal REGIONAL_NEED_FACTOR 1.0), each with an UNDER_REVIEW formula application in one cycle with formula_pool 100000: mX requests 30000, mY requests 90000"
