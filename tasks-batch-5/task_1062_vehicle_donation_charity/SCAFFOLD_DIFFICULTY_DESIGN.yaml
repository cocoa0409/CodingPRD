              payload: { name: "Wheels For Hope", ein: "92-8888888", state_code: "CA", remittance_fee_pct: 0.10 }
              as: ProgramAdmin
              captures: { ci: $.data.id }
            - call: "POST /api/donors"
              payload: { email: "inv1@example.com", full_name: "Inv Ari", state_code: "CA" }
              as: IntakeAgent
              captures: { dn1: $.data.id }
            - call: "POST /api/venues"
              payload: { name: "Bay Auto Auction", venue_type: "AUCTION", state_code: "CA" }
              as: ProgramAdmin
              captures: { ve1: $.data.id }
            - call: "POST /api/donations"
              payload: { donor_id: "${dn1}", charity_id: "${ci}", intake_channel: "WEB", declared_condition: "GOOD", pickup_required: false }
              as: IntakeAgent
              captures: { di: $.data.id }
            - call: "POST /api/donations/${di}/accept"
              payload: {}
              as: IntakeAgent
            - call: "POST /api/donations/${di}/receive-dropoff"
              payload: {}
              as: IntakeAgent
            - call: "POST /api/title-records"
              payload: { donation_id: "${di}", title_number: "CA-TTL-I", owner_name: "Inv Ari" }
              as: TitleClerk
              captures: { ti: $.data.id }
            - call: "POST /api/title-records/${ti}/submit-dmv"
              payload: {}
              as: TitleClerk
            - call: "POST /api/title-records/${ti}/dmv-decision"
              payload: { outcome: "CLEARED" }
              as: TitleClerk
            - call: "POST /api/auction-lots"
              payload: { donation_id: "${di}", venue_id: "${ve1}", lot_number: "L-I", reserve_price_cents: 10000 }
              as: AuctionManager
              captures: { li: $.data.id }
            - call: "GET /api/donations/${di}"
              as: AuctionManager
              captures: { di_v: $.data.version }
          trigger:
            - call: "POST /api/auction-lots/${li}/record-sale"
              payload: { sale_price_cents: 120000, expected_donation_version: "${di_v}" }
              as: AuctionManager
            - call: "GET /api/reports/charity-summary"
              payload: { charity_id: "${ci}" }
              as: FinanceOfficer
              captures: { mid_pledged: $.data.pledged_balance_cents }
            - call: "POST /api/auction-lots/${li}/void-sale"
              payload: { void_reason: "buyer defaulted" }
              as: AuctionManager
            - call: "GET /api/reports/charity-summary"
              payload: { charity_id: "${ci}" }
              as: FinanceOfficer
              captures: { end_pledged: $.data.pledged_balance_cents, end_ledger: $.data.ledger_signed_total }
          assert:
            - "after record-sale, the summary reports pledged_balance_cents == 103100 and remitted_balance_cents == 0"
            - "after void-sale, the summary reports pledged_balance_cents == 0 and remitted_balance_cents == 0"
            - "pledged_balance_cents + remitted_balance_cents == 0, exactly the pre-sale value"
            - "after void-sale, the summary reports ledger_signed_total == 0"
            - "GET /api/donations/${di}/ledger-entries returns exactly 4 entries: PROCEEDS_CREDIT 120000 CREDIT, PROGRAM_FEE_DEBIT 14400 DEBIT, ADMIN_FEE_DEBIT 2500 DEBIT, REVERSAL 103100 DEBIT"
            - "Donation.${di}.gross_proceeds_cents == 0, program_fee_cents == 0, tow_allowance_cents == 0, net_to_charity_cents == 0"
            - "Donation.${di}.status == UNSOLD, payout_status == PENDING, and AuctionLot.${li}.status == VOIDED"

      - name: pickup_create_then_cancel_restores_vendor_slot_count
        grounds:
          - calculations.vendor_slot_reconciliation
          - entities.TowVendor.fields.booked_slots_count
          - state_machines.PickupOrder.SCHEDULED_to_CANCELLED
          - entities.Donation.fields.pickup_attempts
        distinguishing_aspect: |
          Conserved quantity is a CAPACITY COUNT, not money: after every create/cancel pair
          TowVendor.booked_slots_count must equal the count of PickupOrder rows for that vendor
          whose status is SCHEDULED, and Donation.pickup_attempts must stay 0 because a
          cancellation is not a failed attempt.
        test_recipe:
          setup:
            - "logical clock is 2026-07-05T00:00:00Z"
            - "vendor tvc has capacity 5 and booked_slots_count 0"
            - "donations dc1 and dc2 are both ACCEPTED with pickup_required true"
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-05T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /api/charities"
              payload: { name: "Wheels For Hope", ein: "92-9999999", state_code: "CA" }
              as: ProgramAdmin
              captures: { c1: $.data.id }
            - call: "POST /api/donors"
              payload: { email: "inv2@example.com", full_name: "Slo Tc", state_code: "CA" }
              as: IntakeAgent
              captures: { dn1: $.data.id }
            - call: "POST /api/tow-vendors"
              payload: { name: "Counting Towing", service_state_code: "CA", hourly_rate_cents: 12000, daily_capacity_slots: 5 }
              as: ProgramAdmin
              captures: { tvc: $.data.id }
            - call: "POST /api/donations"
              payload: { donor_id: "${dn1}", charity_id: "${c1}", intake_channel: "WEB", declared_condition: "GOOD", pickup_required: true }
              as: IntakeAgent
              captures: { dc1: $.data.id }
            - call: "POST /api/donations/${dc1}/accept"
              payload: {}
              as: IntakeAgent
              captures: { dc1_v: $.data.version }
            - call: "POST /api/donations"
              payload: { donor_id: "${dn1}", charity_id: "${c1}", intake_channel: "WEB", declared_condition: "GOOD", pickup_required: true }
              as: IntakeAgent
              captures: { dc2: $.data.id }
            - call: "POST /api/donations/${dc2}/accept"
              payload: {}
              as: IntakeAgent
              captures: { dc2_v: $.data.version }
          trigger:
            - call: "POST /api/pickup-orders"
              payload: { donation_id: "${dc1}", tow_vendor_id: "${tvc}", scheduled_start_utc: "2026-07-06T09:00:00Z", scheduled_end_utc: "2026-07-06T11:00:00Z", expected_donation_version: "${dc1_v}" }
              as: IntakeAgent
              captures: { pc1: $.data.id }
            - call: "POST /api/pickup-orders"
              payload: { donation_id: "${dc2}", tow_vendor_id: "${tvc}", scheduled_start_utc: "2026-07-08T09:00:00Z", scheduled_end_utc: "2026-07-08T11:00:00Z", expected_donation_version: "${dc2_v}" }
              as: IntakeAgent
              captures: { pc2: $.data.id }
            - call: "POST /api/pickup-orders/${pc1}/cancel"
              payload: { reason: "donor rescheduled" }
              as: IntakeAgent
            - call: "POST /api/pickup-orders/${pc2}/cancel"
              payload: { reason: "vendor truck breakdown" }
              as: IntakeAgent
          assert:
            - "after the first create, TowVendor.${tvc}.booked_slots_count == 1"
            - "after the second create, TowVendor.${tvc}.booked_slots_count == 2"
            - "after the first cancel, TowVendor.${tvc}.booked_slots_count == 1"
            - "after the second cancel, TowVendor.${tvc}.booked_slots_count == 0, exactly the pre-create value"
            - "GET /api/pickup-orders with tow_vendor_id == ${tvc} and status == SCHEDULED returns an empty array with total_count == 0"
            - "PickupOrder.${pc1}.status == CANCELLED and PickupOrder.${pc2}.status == CANCELLED"
            - "Donation.${dc1}.pickup_attempts == 0 and Donation.${dc2}.pickup_attempts == 0"
            - "Donation.${dc1}.status == ACCEPTED and Donation.${dc2}.status == ACCEPTED"
