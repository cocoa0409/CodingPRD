  - rule_id: compensating_invariant
    instances:

      - name: unit_acreage_total_preserved_across_pugh_release_and_termination
        grounds:
          - calculations.unit_acreage_conservation_invariant
          - entities.Unit.fields.unallocated_acres
          - entities.Unit.fields.active_allocation_count
          - entities.UnitTractAllocation.fields.released_acres
          - state_machines.UnitTractAllocation.ACTIVE_to_PUGH_RELEASED
          - state_machines.UnitTractAllocation.ACTIVE_to_TERMINATED
        invariant:
          conserved_quantity: ACREAGE
          formula: "round(sum(a.allocated_acres for a in allocations of U where a.allocation_status IN {ACTIVE, PUGH_RELEASED}) + U.unallocated_acres, 4) == U.unit_gross_acres"
          forward_action: "POST /unit-tract-allocations draws allocated_acres out of unit.unallocated_acres"
          compensating_action: "POST /unit-tract-allocations/{id}/terminate returns the full allocated_acres to unit.unallocated_acres; POST /unit-tract-allocations/{id}/pugh-release returns exactly released_acres"
        distinguishing_aspect: |
          Conserved quantity ACREAGE, measured in net acres on a single Unit. The pugh release
          is a partial compensation - 320.0000 acres split into a retained 213.3333 and a
          released 106.6667 that lands in unallocated_acres - and the termination is the full
          compensation, dropping the row out of the summed status set while returning its
          remaining 213.3333 acres. The 1/3 split does not divide evenly into four decimals,
          so the invariant is the only thing that pins the rounding: the total must read
          exactly 1280.0000 at every one of the three checkpoints, with no drift.
        test_recipe:
          setup:
            - "logical clock at its default 2026-08-01T00:00:00Z"
            - "a CERTIFIED tract and a Unit with unit_gross_acres 1280.0000, pugh_clause_active true, pugh_deadline 2026-12-31, producing_depth_count 2, total_depth_count 3, unallocated_acres 1280.0000 and active_allocation_count 0"
          setup_api_calls:
            - call: "POST /tracts"
              payload: { county: "Reeves", state_code: "TX", gross_acres: 640.0000, operator_activity_tier: "HIGH" }
              as: TitleAnalyst
              captures: { t17: $.data.id }
            - call: "POST /tracts/${t17}/title-chain-entries"
              payload: { instrument_type: "PATENT", instrument_date: "1902-05-01", conveyed_fraction: 1.0, county_book_page: "100/1", grantor_name: "United States", grantee_name: "A Patentee" }
              as: TitleAnalyst
            - call: "POST /tracts/${t17}/title-chain-entries"
              payload: { instrument_type: "DEED", instrument_date: "1955-03-12", conveyed_acres: 480.0000, county_book_page: "220/45", grantor_name: "A Patentee", grantee_name: "B Grantee" }
              as: TitleAnalyst
            - call: "POST /tracts/${t17}/title-chain-entries"
              payload: { instrument_type: "PROBATE", instrument_date: "1988-07-20", conveyed_fraction: 0.5, county_book_page: "500/12", grantor_name: "A Patentee Estate", grantee_name: "C Heir" }
              as: TitleAnalyst
            - call: "POST /tracts/${t17}/title-chain-entries"
              payload: { instrument_type: "ASSIGNMENT", instrument_date: "2011-01-05", conveyed_fraction: 0.0625, county_book_page: "780/301", grantor_name: "C Heir", grantee_name: "ORRI Holder" }
              as: TitleAnalyst
            - call: "POST /tracts/${t17}/certify-title"
              payload: {}
              as: TitleAnalyst
            - call: "POST /units"
              payload: { unit_name: "Reeves Unit 8H", formation: "Wolfcamp", state_code: "TX", unit_gross_acres: 1280.0000, royalty_rate_cap: 0.2500, producing_depth_count: 2, total_depth_count: 3, pugh_clause_active: true, pugh_deadline: "2026-12-31" }
              as: Operator
              as_user_id: "op-user-001"
              captures: { u17: $.data.id }
          trigger:
            - call: "POST /unit-tract-allocations"
              payload: { unit_id: "${u17}", tract_id: "${t17}", allocated_acres: 320.0000, effective_from: "2026-01-01", effective_to: "2028-01-01", pooling_election: "POOLED" }
              as: Operator
              as_user_id: "op-user-001"
              captures: { al17: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2027-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /unit-tract-allocations/${al17}/pugh-release"
              payload: {}
              as: Operator
              as_user_id: "op-user-001"
            - call: "POST /unit-tract-allocations/${al17}/terminate"
              payload: { termination_reason: "Remaining producing depths released after unit contraction" }
              as: Operator
              as_user_id: "op-user-001"
            - call: "GET /units/${u17}"
              payload: {}
              as: Operator
              as_user_id: "op-user-001"
          assert:
            - "checkpoint 1 after the forward action: Unit.${u17}.unallocated_acres == 960.0000, active_allocation_count == 1, and 320.0000 + 960.0000 == 1280.0000"
            - "checkpoint 2 after the pugh release: UnitTractAllocation.${al17}.allocated_acres == 213.3333, released_acres == 106.6667, allocation_status == PUGH_RELEASED"
            - "checkpoint 2: Unit.${u17}.unallocated_acres == 1066.6667, active_allocation_count is still 1, and 213.3333 + 1066.6667 == 1280.0000 exactly"
            - "checkpoint 3 after the termination: UnitTractAllocation.${al17}.allocation_status == TERMINATED with allocated_acres still 213.3333 and released_acres still 106.6667"
            - "checkpoint 3: Unit.${u17}.unallocated_acres == 1280.0000 and active_allocation_count == 0, so the sum over ACTIVE/PUGH_RELEASED rows is 0.0000 and the total is 1280.0000"
            - "the final GET confirms unallocated_acres == 1280.0000 - the conserved total never drifted by a ten-thousandth of an acre"

      - name: division_order_net_revenue_total_preserved_across_variance_hold_and_release
        grounds:
          - calculations.division_order_net_revenue_invariant
          - calculations.suspense_accrual
          - entities.DivisionOrder.fields.paid_net_total
          - entities.SuspenseAccount.fields.accrued_amount
          - entities.SuspenseAccount.fields.interest_accrued
          - state_machines.SuspenseAccount.ACCRUING_to_RELEASED
        invariant:
          conserved_quantity: MONEY
          formula: "round(sum(d.net_amount for d in details of DO), 2) == round(DO.paid_net_total + sum(s.accrued_amount for s in suspense of DO), 2)"
          forward_action: "a decimal variance on POST /division-orders/{id}/revenue-check-details routes the whole line's net_amount into suspense.accrued_amount instead of DO.paid_net_total"
          compensating_action: "POST /suspense-accounts/{id}/release moves exactly accrued_amount into DO.paid_net_total and zeroes accrued_amount"
        distinguishing_aspect: |
          A different conserved quantity - MONEY in dollars across a DivisionOrder and its
          SuspenseAccount rows - with a different forward action and a different compensating
          action from the acreage instance. The subtlety is what is excluded: the 1.06 of
          suspense interest_accrued paid out on release is newly created money owed by the
          firm, not reallocated operator revenue, so release_amount 107.53 must NOT appear in
          either side of the conserved equation while paid_net_total picks up exactly 106.47.
        test_recipe:
          setup:
            - "logical clock at its default 2026-08-01T00:00:00Z"
            - "an EXECUTED DivisionOrder created by do-user-001 with pinned_decimal 0.00195313, paid_net_total 0.00 and cumulative_variance_amount 0.00"
            - "the RoyaltyOwner is LOCATED with tax_id_on_file true"
            - "no RevenueCheckDetail and no SuspenseAccount yet"
          setup_api_calls:
            - call: "POST /tracts"
              payload: { county: "Reeves", state_code: "TX", gross_acres: 640.0000, operator_activity_tier: "HIGH" }
              as: TitleAnalyst
              captures: { t18: $.data.id }
            - call: "POST /tracts/${t18}/title-chain-entries"
              payload: { instrument_type: "PATENT", instrument_date: "1902-05-01", conveyed_fraction: 1.0, county_book_page: "100/1", grantor_name: "United States", grantee_name: "A Patentee" }
              as: TitleAnalyst
            - call: "POST /tracts/${t18}/title-chain-entries"
              payload: { instrument_type: "DEED", instrument_date: "1955-03-12", conveyed_acres: 480.0000, county_book_page: "220/45", grantor_name: "A Patentee", grantee_name: "B Grantee" }
              as: TitleAnalyst
            - call: "POST /tracts/${t18}/title-chain-entries"
              payload: { instrument_type: "PROBATE", instrument_date: "1988-07-20", conveyed_fraction: 0.5, county_book_page: "500/12", grantor_name: "A Patentee Estate", grantee_name: "C Heir" }
              as: TitleAnalyst
            - call: "POST /tracts/${t18}/title-chain-entries"
              payload: { instrument_type: "ASSIGNMENT", instrument_date: "2011-01-05", conveyed_fraction: 0.0625, county_book_page: "780/301", grantor_name: "C Heir", grantee_name: "ORRI Holder" }
              as: TitleAnalyst
            - call: "POST /tracts/${t18}/certify-title"
              payload: {}
              as: TitleAnalyst
            - call: "POST /royalty-owners"
              payload: { legal_name: "C Heir", state_code: "TX", mailing_address: "1 Pecos Rd, Pecos TX", tax_id_on_file: true }
              as: DivisionOrderAdmin
              captures: { own18: $.data.id }
            - call: "POST /mineral-interests"
              payload: { tract_id: "${t18}", seller_owner_id: "${own18}", seller_share_fraction: 0.5, lease_royalty_rate: 0.1875, undeveloped_net_acres: 20.0000 }
              as: AcquisitionManager
              captures: { mi18: $.data.id }
            - call: "POST /units"
              payload: { unit_name: "Reeves Unit 9H", formation: "Wolfcamp", state_code: "TX", unit_gross_acres: 1280.0000, royalty_rate_cap: 0.2500, producing_depth_count: 2, total_depth_count: 3 }
              as: Operator
              as_user_id: "op-user-001"
              captures: { u18: $.data.id }
            - call: "POST /unit-tract-allocations"
              payload: { unit_id: "${u18}", tract_id: "${t18}", allocated_acres: 320.0000, effective_from: "2026-01-01", effective_to: "2028-01-01", pooling_election: "POOLED" }
              as: Operator
              as_user_id: "op-user-001"
            - call: "GET /units/${u18}"
              payload: {}
              as: DivisionOrderAdmin
              captures: { uv18: $.data.version }
            - call: "POST /division-orders"
              payload: { mineral_interest_id: "${mi18}", unit_id: "${u18}", expected_unit_version: "${uv18}" }
              as: DivisionOrderAdmin
              as_user_id: "do-user-001"
              captures: { do18: $.data.id }
            - call: "POST /division-orders/${do18}/operator-response"
              payload: { operator_decimal: 0.00195313, effective_production_month: "2026-06" }
              as: Operator
              as_user_id: "op-user-001"
          trigger:
            - call: "POST /division-orders/${do18}/revenue-check-details"
              payload: { production_month: "2026-06", product_code: "OIL", gross_volume: 1000.0000, gross_value: 62000.00, operator_decimal_used: 0.00180000 }
              as: Operator
              as_user_id: "op-user-001"
              captures: { rd18: $.data.id }
            - call: "GET /suspense-accounts"
              payload: { division_order_id: "${do18}" }
              as: DivisionOrderAdmin
              captures: { susp18: "$.data[0].id" }
            - call: "GET /suspense-accounts/${susp18}"
              payload: {}
              as: DivisionOrderAdmin
            - call: "POST /suspense-accounts/${susp18}/release"
              payload: {}
              as: DivisionOrderAdmin
              as_user_id: "do-user-002"
            - call: "GET /division-orders/${do18}"
              payload: {}
              as: DivisionOrderAdmin
          assert:
            - "after the forward action RevenueCheckDetail.${rd18}.net_amount == 106.47, variance_amount == 9.05 and check_status == VARIANCE_HELD"
            - "after the forward action DivisionOrder.${do18}.do_status == SUSPENDED, paid_net_total == 0.00 and cumulative_variance_amount == 9.05"
            - "checkpoint 1: SuspenseAccount.${susp18}.accrued_amount == 106.47, held_detail_count == 1, first_suspended_month == 2026-06, and 106.47 == 0.00 + 106.47 satisfies the invariant"
            - "the third trigger call shows months_held == 2, interest_accrued == 1.06 and release_amount == 107.53 before the release"
            - "the release response carries accrued_amount == 0.00 and held_detail_count == 0, with interest_accrued == 1.06 and release_amount == 107.53 pinned by the recompute that precedes the zeroing"
            - "SuspenseAccount.${susp18}.suspense_status == RELEASED and released_by_user_id == do-user-002"
            - "RevenueCheckDetail.${rd18}.check_status == PAID and its net_amount is still 106.47"
            - "checkpoint 2: DivisionOrder.${do18}.paid_net_total == 106.47, cumulative_variance_amount == 0.00, do_status == EXECUTED, and 106.47 == 106.47 + 0.00 satisfies the invariant"
            - "the 1.06 of interest_accrued appears in neither side of the conserved equation"
