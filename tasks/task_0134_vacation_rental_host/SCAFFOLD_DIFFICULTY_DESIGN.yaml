          - entities.Listing.fields.gap_nights
          - entities.CalendarBlock.fields.start_date
          - errors[ERR_DATES_UNAVAILABLE]
          - endpoints["POST /listings/{id}/calendar-blocks"]
        distinguishing_aspect: |
          CalendarBlock resource on a Listing uses half-open [start,end) intervals PLUS a gap_nights=2 turnaround
          buffer: a new block [2026-08-05,2026-08-09) leaving only 1 gap night before an existing [2026-08-10,2026-08-13)
          is rejected ERR_DATES_UNAVAILABLE; [2026-08-05,2026-08-08) leaving 2 gap nights passes.
        test_recipe:
          setup:
            - "Listing gap_nights=2 with an existing ACTIVE MANUAL block [2026-08-10,2026-08-13)."
          setup_api_calls:
            - call: "POST /hosts"
              payload: { email: "h15@x.com", display_name: "Host Fifteen" }
              as: Anonymous
              captures: { h15: $.data.id }
            - call: "POST /listings"
              payload: { host_id: "${h15}", title: "Gap House", base_nightly_rate_cents: 20000, cleaning_fee_cents: 5000, gap_nights: 2 }
              as: Host
              as_user_id: "${h15}"
              captures: { l15: $.data.id }
            - call: "GET /listings/${l15}"
              payload: {}
              as: Host
              as_user_id: "${h15}"
              captures: { l15_cv_994: $.data.calendar_version }
            - call: "POST /listings/${l15}/calendar-blocks"
              payload: { source: "MANUAL", start_date: "2026-08-10", end_date: "2026-08-13", expected_listing_calendar_version: "${l15_cv_994}" }
              as: Host
              as_user_id: "${h15}"
              captures: { existing_blk: $.data.id }
          trigger:
            - call: "GET /listings/${l15}"
              payload: {}
              as: Host
              as_user_id: "${h15}"
              captures: { l15_cv_1000: $.data.calendar_version }
            - call: "POST /listings/${l15}/calendar-blocks"
              payload: { source: "MANUAL", start_date: "2026-08-05", end_date: "2026-08-09", expected_listing_calendar_version: "${l15_cv_1000}" }
              as: Host
              as_user_id: "${h15}"
              captures: { err: $.data.error_id }
            - call: "GET /listings/${l15}"
              payload: {}
              as: Host
              as_user_id: "${h15}"
              captures: { l15_cv_1005: $.data.calendar_version }
            - call: "POST /listings/${l15}/calendar-blocks"
              payload: { source: "MANUAL", start_date: "2026-08-05", end_date: "2026-08-08", expected_listing_calendar_version: "${l15_cv_1005}" }
              as: Host
              as_user_id: "${h15}"
              captures: { ok_blk: $.data.id }
          assert:
            - "Block ending 2026-08-09 (1 gap night) returns 409 error_id == ERR_DATES_UNAVAILABLE"
            - "Block ending 2026-08-08 (2 gap nights) succeeds with status ACTIVE"

      - name: rate_plan_closed_interval_no_buffer
        grounds:
          - validations[priority=12]
          - entities.RatePlan.fields.window_start
          - entities.RatePlan.fields.window_end
          - errors[ERR_RATE_PLAN_OVERLAP]
          - endpoints["POST /rate-plans"]
        distinguishing_aspect: |
          RatePlan windows on a Listing use CLOSED [start,end] intervals with NO buffer (different interval semantics
          and different resource than CalendarBlock): a plan [2026-07-31,2026-08-10] overlapping an existing
          [2026-07-01,2026-07-31] at the shared endpoint 2026-07-31 is rejected ERR_RATE_PLAN_OVERLAP, but adjacency
          at [2026-08-01,2026-08-31] passes (no buffer required).
        test_recipe:
          setup:
            - "Listing with an existing RatePlan window [2026-07-01,2026-07-31]."
          setup_api_calls:
            - call: "POST /hosts"
              payload: { email: "h16@x.com", display_name: "Host Sixteen" }
              as: Anonymous
              captures: { h16: $.data.id }
            - call: "POST /listings"
              payload: { host_id: "${h16}", title: "Rate House", base_nightly_rate_cents: 20000, cleaning_fee_cents: 5000 }
              as: Host
              as_user_id: "${h16}"
              captures: { l16: $.data.id }
            - call: "POST /rate-plans"
              payload: { listing_id: "${l16}", label: "JUL", window_start: "2026-07-01", window_end: "2026-07-31", seasonal_multiplier_bps: 15000 }
              as: Host
              as_user_id: "${h16}"
              captures: { rp1: $.data.id }
          trigger:
            - call: "POST /rate-plans"
              payload: { listing_id: "${l16}", label: "OVERLAP", window_start: "2026-07-31", window_end: "2026-08-10", seasonal_multiplier_bps: 13000 }
              as: Host
              as_user_id: "${h16}"
              captures: { err: $.data.error_id }
            - call: "POST /rate-plans"
              payload: { listing_id: "${l16}", label: "AUG", window_start: "2026-08-01", window_end: "2026-08-31", seasonal_multiplier_bps: 13000 }
              as: Host
              as_user_id: "${h16}"
              captures: { rp2: $.data.id }
          assert:
            - "Plan [2026-07-31,2026-08-10] shares endpoint with [..,2026-07-31] -> 409 error_id == ERR_RATE_PLAN_OVERLAP"
            - "Adjacent plan [2026-08-01,2026-08-31] succeeds (closed-interval adjacency, no buffer)"

  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: cancel_conserves_listing_occupied_nights
        grounds:
          - state_machines.Booking.CONFIRMED_to_CANCELLED
          - state_machines.CalendarBlock.ACTIVE_to_RELEASED
          - entities.CalendarBlock.fields.status
        distinguishing_aspect: |
          Conserved quantity = count of ACTIVE CalendarBlocks on the listing (occupied-nights resource). Forward
          action (booking creates one ACTIVE block) + compensating action (cancel releases it) leaves the ACTIVE
          block count back at its pre-booking value of 0.
        test_recipe:
          setup:
            - "Empty listing (0 ACTIVE blocks); one CONFIRMED booking created (1 ACTIVE block)."
          setup_api_calls:
            - call: "POST /hosts"
              payload: { email: "h17@x.com", display_name: "Host Seventeen" }
              as: Anonymous
              captures: { h17: $.data.id }
            - call: "POST /guests"
              payload: { email: "g17@x.com", full_name: "Guest Seventeen", govt_id_verified: true, prior_cancellations: 0, chargeback_flag: false }
              as: Anonymous
              captures: { g17: $.data.id }
            - call: "POST /listings"
              payload: { host_id: "${h17}", title: "Conserve", base_nightly_rate_cents: 20000, cleaning_fee_cents: 5000, cancellation_tier: "FLEXIBLE", security_deposit_cents: 0 }
              as: Host
              as_user_id: "${h17}"
              captures: { l17: $.data.id }
            - call: "POST /rate-plans"
              payload: { listing_id: "${l17}", label: "STD", window_start: "2026-07-01", window_end: "2026-07-31", seasonal_multiplier_bps: 10000 }
              as: Host
              as_user_id: "${h17}"
            - call: "POST /listings/${l17}/publish"
              payload: {}
              as: Host
              as_user_id: "${h17}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /listings/${l17}"
              payload: {}
              as: Guest
              as_user_id: "${g17}"
              captures: { l17_cv_1099: $.data.calendar_version }
            - call: "POST /bookings"
              payload: { listing_id: "${l17}", guest_id: "${g17}", check_in: "2026-07-10", check_out: "2026-07-13", expected_listing_calendar_version: "${l17_cv_1099}" }
              as: Guest
              as_user_id: "${g17}"
              captures: { b17: $.data.id }
            - call: "POST /bookings/${b17}/screen"
              payload: {}
              as: Host
              as_user_id: "${h17}"
            - call: "POST /bookings/${b17}/approve"
              payload: {}
              as: Host
              as_user_id: "${h17}"
            - call: "POST /bookings/${b17}/confirm"
              payload: {}
              as: Guest
              as_user_id: "${g17}"
          trigger:
            - call: "POST /bookings/${b17}/cancel"
              payload: {}
              as: Guest
              as_user_id: "${g17}"
          assert:
            - "GET /listings/${l17}/calendar-blocks?status=ACTIVE returns total_count == 0 after cancel (matches pre-booking count)"
            - "GET /listings/${l17}/calendar-blocks?status=RELEASED returns total_count == 1"

      - name: claim_approve_then_deny_conserves_deposit_balance
        grounds:
          - state_machines.DamageClaim.UNDER_REVIEW_to_APPROVED
          - state_machines.DamageClaim.APPROVED_to_DISPUTED
          - state_machines.DamageClaim.UNDER_REVIEW_to_DENIED
          - entities.SecurityDeposit.fields.held_cents
          - calculations.damage_claim_settlement
        distinguishing_aspect: |
          Conserved quantity = SecurityDeposit money balance (distinct from occupied-nights count). Forward action
          (approve a 6000 claim debits held_cents 10000->4000) + compensating action (guest disputes, admin re-reviews
          and DENIES, restoring the debit) returns held_cents to 10000 (== authorized_cents) with approved_cents reset
          to 0 (no money drift).
        test_recipe:
          setup:
            - "IN_STAY booking, deposit authorized 10000, one APPROVED claim of 6000 (held_cents 4000), then disputed."
          setup_api_calls:
            - call: "POST /hosts"
              payload: { email: "h18@x.com", display_name: "Host Eighteen" }
              as: Anonymous
              captures: { h18: $.data.id }
            - call: "POST /guests"
              payload: { email: "g18@x.com", full_name: "Guest Eighteen", govt_id_verified: true, prior_cancellations: 0, chargeback_flag: false }
              as: Anonymous
              captures: { g18: $.data.id }
            - call: "POST /listings"
              payload: { host_id: "${h18}", title: "Deposit House", base_nightly_rate_cents: 20000, cleaning_fee_cents: 5000, cancellation_tier: "FLEXIBLE", security_deposit_cents: 10000, payout_delay_days: 1 }
              as: Host
              as_user_id: "${h18}"
              captures: { l18: $.data.id }
            - call: "POST /rate-plans"
              payload: { listing_id: "${l18}", label: "STD", window_start: "2026-07-01", window_end: "2026-07-31", seasonal_multiplier_bps: 10000 }
              as: Host
              as_user_id: "${h18}"
            - call: "POST /listings/${l18}/publish"
              payload: {}
              as: Host
              as_user_id: "${h18}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /listings/${l18}"
              payload: {}
              as: Guest
              as_user_id: "${g18}"
              captures: { l18_cv_1163: $.data.calendar_version }
            - call: "POST /bookings"
              payload: { listing_id: "${l18}", guest_id: "${g18}", check_in: "2026-07-10", check_out: "2026-07-13", expected_listing_calendar_version: "${l18_cv_1163}" }
              as: Guest
              as_user_id: "${g18}"
              captures: { b18: $.data.id }
            - call: "POST /bookings/${b18}/screen"
              payload: {}
              as: Host
              as_user_id: "${h18}"
            - call: "POST /bookings/${b18}/approve"
              payload: {}
              as: Host
              as_user_id: "${h18}"
            - call: "POST /bookings/${b18}/confirm"
              payload: {}
              as: Guest
              as_user_id: "${g18}"
            - call: "GET /bookings/${b18}/security-deposits"
              payload: {}
              as: Host
              as_user_id: "${h18}"
              captures: { sd18: $.data.0.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-10T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /security-deposits/${sd18}/claims"
              payload: { security_deposit_id: "${sd18}", amount_cents: 6000, reason: "Sofa" }
              as: Host
              as_user_id: "${h18}"
              captures: { dc18: $.data.id }
            - call: "POST /damage-claims/${dc18}/review"
              payload: {}
              as: PlatformAdmin
            - call: "POST /damage-claims/${dc18}/approve"
              payload: {}
              as: PlatformAdmin
            - call: "POST /damage-claims/${dc18}/dispute"
              payload: {}
              as: Guest
              as_user_id: "${g18}"
            - call: "POST /damage-claims/${dc18}/review"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /damage-claims/${dc18}/deny"
              payload: {}
              as: PlatformAdmin
          assert:
            - "After approve (before dispute) SecurityDeposit.${sd18}.held_cents == 4000"
            - "After deny SecurityDeposit.${sd18}.held_cents == 10000 (== authorized_cents; debit restored)"
            - "After deny DamageClaim.${dc18}.status == DENIED and approved_cents == 0 (deposit balance conserved, no drift)"
