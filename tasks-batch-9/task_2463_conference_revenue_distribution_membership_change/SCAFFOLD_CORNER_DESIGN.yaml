              as: ScheduleCoordinator
              as_user_id: "u_sch_1"
              captures: { g_ne_id: $.data.id }
          trigger:
            - call: "GET /members/${m_e_id}/schedule-compliance"
              payload: {}
              as: ScheduleCoordinator
              as_user_id: "u_sch_1"
            - call: "POST /schedule-games"
              payload: { conference_id: "${conf_id}", home_member_id: "${m_s_id}", away_member_id: "${m_w_id}", venue_id: "${v1_id}", game_date: "2026-09-07T19:00:00Z", fiscal_year: 2027, media_designated: false }
              as: ScheduleCoordinator
              as_user_id: "u_sch_1"
              captures: { g_sw_id: $.data.id }
            - call: "GET /members/${m_e_id}/schedule-compliance"
              payload: {}
              as: ScheduleCoordinator
              as_user_id: "u_sch_1"
            - call: "GET /members/${m_w_id}/schedule-compliance"
              payload: {}
              as: ScheduleCoordinator
              as_user_id: "u_sch_1"
          assert:
            - "the PATCH returns Member.${m_e_id}.version == 2 with travel_partner_member_id == ${m_w_id}"
            - "the first East read returns unmet_rivalry_count == 0, travel_partner_gap_count == 1, home_game_count == 0, away_game_count == 1 and schedule_compliance_score == 92 (100 - 8*1)"
            - "the second East read returns travel_partner_gap_count == 0 and schedule_compliance_score == 100, because West's away game shares venue ${v1_id} and falls 2 days later, inside TRAVEL_PAIR_WINDOW_DAYS"
            - "the West read returns travel_partner_gap_count == 0 and schedule_compliance_score == 100 with home_game_count == 0 and away_game_count == 1, since a null travel_partner_member_id short-circuits the gap count"
            - "max(0, home_game_count - away_game_count - 1) is 0 for both members, so no HOME_IMBALANCE_PENALTY is deducted anywhere in this fixture"

  # ===================================================================
  # SECTION 4 - VALIDATIONS
  # ===================================================================
  - section: validations
    instances:

      - name: corner_priority_ordering_shape_then_body_fk_then_uniqueness
        claim_type: Priority Ordering
        grounds:
          - validations[priority 10]
          - validations[priority 12]
          - validations[priority 14]
          - errors.ERR_DUPLICATE_INSTITUTION_CODE
        distinguishing_aspect: |
          One request carrying three defects at once must surface the
          lowest-priority-number code every time. An undeclared admission_path
          plus an unresolvable home_venue_id yields 400 ERR_INVALID_REQUEST
          (priority 10), not 404. Fix the enum and the same unresolvable venue
          yields 404 ERR_VENUE_NOT_FOUND (priority 12). Add a duplicate
          institution_code on top and it is *still* 404, because body-FK
          existence at 12 outranks uniqueness at 14 - only once the venue
          resolves does 409 ERR_DUPLICATE_INSTITUTION_CODE appear.
        test_recipe:
          setup:
            - "The conference is FORMING with North State University already seated under institution_code NOR at the Northfield Dome."
          setup_api_calls:
            - *c_clock
            - *c_conf
            - *c_v1
            - *c_mn
          trigger:
            - call: "POST /members"
              payload: { conference_id: "${conf_id}", name: "Defect Pileup College", institution_code: "DPC", admission_path: "INVITED", home_venue_id: "00000000-0000-4000-8000-0000000000ff", grant_of_rights_through_fiscal_year: 2032 }
              as: Commissioner
              as_user_id: "u_com_1"
            - call: "POST /members"
              payload: { conference_id: "${conf_id}", name: "Defect Pileup College", institution_code: "DPC", admission_path: "CHARTER", home_venue_id: "00000000-0000-4000-8000-0000000000ff", grant_of_rights_through_fiscal_year: 2032 }
              as: Commissioner
              as_user_id: "u_com_1"
            - call: "POST /members"
              payload: { conference_id: "${conf_id}", name: "Defect Pileup College", institution_code: "NOR", admission_path: "CHARTER", home_venue_id: "00000000-0000-4000-8000-0000000000ff", grant_of_rights_through_fiscal_year: 2032 }
              as: Commissioner
              as_user_id: "u_com_1"
            - call: "POST /members"
              payload: { conference_id: "${conf_id}", name: "Defect Pileup College", institution_code: "NOR", admission_path: "CHARTER", home_venue_id: "${v1_id}", grant_of_rights_through_fiscal_year: 2032 }
              as: Commissioner
              as_user_id: "u_com_1"
          assert:
            - "call 1 returns HTTP 400 with error.error_id == ERR_INVALID_REQUEST because admission_path \"INVITED\" is not one of {CHARTER, PETITIONED}"
            - "call 2 returns HTTP 404 with error.error_id == ERR_VENUE_NOT_FOUND"
            - "call 3 also returns HTTP 404 with error.error_id == ERR_VENUE_NOT_FOUND, not ERR_DUPLICATE_INSTITUTION_CODE, because priority 12 precedes priority 14"
            - "call 4 returns HTTP 409 with error.error_id == ERR_DUPLICATE_INSTITUTION_CODE"
            - "GET /members returns total_count 1 - none of the four attempts created a Member"

      - name: corner_paired_member_references_and_duplicate_rivalry_rejected
        claim_type: Violation → Error
        grounds:
          - validations[priority 15]
          - validations[priority 16]
          - errors.ERR_MEMBER_PAIR_INVALID
          - errors.ERR_DUPLICATE_RIVALRY
        distinguishing_aspect: |
          Priority 15 is one rule policing three different self-reference
          shapes - game home == away, rivalry a == b, and a member naming itself
          as its own travel partner - each 422. Priority 16 then treats the
          rivalry pair as *unordered*, so South-North is a duplicate of the
          existing North-South and returns 409, which a naive
          (member_a_id, member_b_id) unique index would let through.
        test_recipe:
          setup:
            - "The conference is FORMING with four charter members and no rivalries."
          setup_api_calls:
            - *c_clock
            - *c_conf
            - *c_v1
            - *c_v2
            - *c_mn
            - *c_ms
            - *c_me
            - *c_mw
            - call: "GET /members/${m_e_id}"
              payload: {}
              as: Commissioner
              as_user_id: "u_com_1"
