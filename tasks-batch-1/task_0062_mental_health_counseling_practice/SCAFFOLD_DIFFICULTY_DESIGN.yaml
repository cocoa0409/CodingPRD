  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: therapist_half_open_overlap_adjacency_allowed
        grounds:
          - validations[priority=15]
          - entities.Appointment.fields.start_at
          - entities.Appointment.fields.duration_minutes
        distinguishing_aspect: >-
          Therapist resource, HALF-OPEN [start, start+dur) semantics: a back-to-back appointment
          starting exactly when the prior ends (adjacency) is ACCEPTED, while one starting one minute
          earlier overlaps and is rejected ERR_THERAPIST_DOUBLE_BOOKED.
        test_recipe:
          setup:
            - "Therapist T has a SCHEDULED 90834 (45min) at 08:00; second patient available."
          setup_api_calls:
            - call: "POST /therapists"
              payload: { full_name: "Dr Ov" }
              as: ClinicalDirector
              captures: { t_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Pt O1", location_state_code: "CA", annual_household_income: 90000, household_size: 1 }
              as: FrontDesk
              captures: { p1_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Pt O2", location_state_code: "CA", annual_household_income: 90000, household_size: 1 }
              as: FrontDesk
              captures: { p2_id: $.data.id }
            - call: "POST /appointments"
              payload: { therapist_id: "${t_id}", patient_id: "${p1_id}", cpt_code: "90834", modality: "IN_PERSON", start_at: "2026-06-12T08:00:00Z", duration_minutes: 45, payment_path: "SELF_PAY" }
              as: FrontDesk
            - call: "POST /appointments"
              payload: { therapist_id: "${t_id}", patient_id: "${p2_id}", cpt_code: "90834", modality: "IN_PERSON", start_at: "2026-06-12T08:45:00Z", duration_minutes: 45, payment_path: "SELF_PAY" }
              as: FrontDesk
              captures: { adj_id: $.data.id }
          trigger:
            - call: "POST /appointments"
              payload: { therapist_id: "${t_id}", patient_id: "${p2_id}", cpt_code: "90834", modality: "IN_PERSON", start_at: "2026-06-12T08:44:00Z", duration_minutes: 45, payment_path: "SELF_PAY" }
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "Appointment.${adj_id}.status == SCHEDULED"
            - "response.status == 409"
            - "response.data.error_id == ERR_THERAPIST_DOUBLE_BOOKED"

      - name: patient_closed_interval_adjacency_rejected
        grounds:
          - validations[priority=16]
          - entities.Appointment.fields.start_at
          - entities.Appointment.fields.patient_id
        distinguishing_aspect: >-
          Patient resource, CLOSED [start, start+dur] semantics (different interval arithmetic from the
          therapist half-open rule): a second appointment for the SAME patient starting exactly when the
          first ends is rejected ERR_PATIENT_DOUBLE_BOOKED because the closed endpoints touch.
        test_recipe:
          setup:
            - "Patient P has a SCHEDULED 90834 (45min) at 08:00 with therapist T1; a second therapist T2 exists."
          setup_api_calls:
            - call: "POST /therapists"
              payload: { full_name: "Dr T1" }
              as: ClinicalDirector
              captures: { t1_id: $.data.id }
            - call: "POST /therapists"
              payload: { full_name: "Dr T2" }
              as: ClinicalDirector
              captures: { t2_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Pt PC", location_state_code: "CA", annual_household_income: 90000, household_size: 1 }
              as: FrontDesk
              captures: { p_id: $.data.id }
            - call: "POST /appointments"
              payload: { therapist_id: "${t1_id}", patient_id: "${p_id}", cpt_code: "90834", modality: "IN_PERSON", start_at: "2026-06-13T08:00:00Z", duration_minutes: 45, payment_path: "SELF_PAY" }
              as: FrontDesk
          trigger:
            - call: "POST /appointments"
              payload: { therapist_id: "${t2_id}", patient_id: "${p_id}", cpt_code: "90834", modality: "IN_PERSON", start_at: "2026-06-13T08:45:00Z", duration_minutes: 45, payment_path: "SELF_PAY" }
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_PATIENT_DOUBLE_BOOKED"

  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: void_claim_restores_deductible_met
        grounds:
          - state_machines.Claim.ADJUDICATED_to_VOID
          - state_machines.Claim.SUBMITTED_to_ADJUDICATED
          - entities.InsurancePolicy.fields.deductible_met_cents
        distinguishing_aspect: >-
          Conserved quantity = InsurancePolicy.deductible_met_cents. Adjudicate (forward) then void
          (compensating) MUST leave deductible_met_cents at its pre-adjudication value (18000c): the
          void subtracts exactly the deductible_applied_cents the adjudication added.
        test_recipe:
          setup:
            - "A SUBMITTED in-network claim against a policy already at deductible_met 18000c of 20000c, coinsurance 0.20."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-14T12:00:00Z" }
              as: ClinicalDirector
            - call: "POST /therapists"
              payload: { full_name: "Dr V" }
              as: ClinicalDirector
              captures: { t_id: $.data.id, t_v: $.data.version }
            - call: "POST /_inject/therapist_hours"
              payload: { therapist_id: "${t_id}", verified_direct_hours: 3000, verified_supervision_hours: 200 }
              as: ClinicalDirector
            - call: "POST /state-licenses"
              payload: { therapist_id: "${t_id}", state_code: "CA", license_number: "LV", expires_on: "2030-01-01T00:00:00Z" }
              as: ClinicalDirector
            - call: "POST /therapists/${t_id}/promote"
              payload: { expected_therapist_version: "${t_v}" }
              as: ClinicalDirector
              captures: { t_v2: $.data.version }
            - call: "POST /therapists/${t_id}/promote"
              payload: { expected_therapist_version: "${t_v2}" }
              as: ClinicalDirector
            - call: "POST /payer-contracts"
              payload: { payer_name: "VNet", in_network: true, contracted_rate_90791_cents: 18000, contracted_rate_90834_cents: 13000 }
              as: Biller
              captures: { c_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Pt V", location_state_code: "CA", annual_household_income: 90000, household_size: 1 }
              as: FrontDesk
              captures: { p_id: $.data.id }
            - call: "POST /insurance-policies"
              payload: { patient_id: "${p_id}", contract_id: "${c_id}", cost_share_model: "COINSURANCE", coinsurance_rate: 0.20, deductible_total_cents: 20000 }
              as: FrontDesk
              captures: { pol_id: $.data.id }
            - call: "POST /appointments"
              payload: { therapist_id: "${t_id}", patient_id: "${p_id}", cpt_code: "90834", modality: "IN_PERSON", start_at: "2026-06-14T03:00:00Z", duration_minutes: 45, payment_path: "INSURANCE", insurance_policy_id: "${pol_id}" }
              as: FrontDesk
              captures: { a0_id: $.data.id }
            - call: "POST /appointments/${a0_id}/render"
              payload: {}
              as: Therapist
              as_user_id: "${t_id}"
            - call: "POST /clinical-notes"
              payload: { appointment_id: "${a0_id}", narrative: "n" }
              as: Therapist
              as_user_id: "${t_id}"
              captures: { n0_id: $.data.id }
            - call: "POST /clinical-notes/${n0_id}/sign"
              payload: {}
              as: Therapist
              as_user_id: "${t_id}"
            - call: "POST /appointments/${a0_id}/complete"
              payload: {}
              as: Therapist
              as_user_id: "${t_id}"
              captures: { a0_v: $.data.version }
            - call: "POST /claims"
              payload: { appointment_id: "${a0_id}", expected_appointment_version: "${a0_v}" }
              as: Biller
              captures: { c0_id: $.data.id, c0_v: $.data.version }
            - call: "POST /claims/${c0_id}/adjudicate"
              payload: { expected_claim_version: "${c0_v}" }
              as: Biller
            - call: "POST /appointments"
              payload: { therapist_id: "${t_id}", patient_id: "${p_id}", cpt_code: "90834", modality: "IN_PERSON", start_at: "2026-06-14T08:00:00Z", duration_minutes: 45, payment_path: "INSURANCE", insurance_policy_id: "${pol_id}" }
              as: FrontDesk
              captures: { a_id: $.data.id }
            - call: "POST /appointments/${a_id}/render"
              payload: {}
              as: Therapist
              as_user_id: "${t_id}"
            - call: "POST /clinical-notes"
              payload: { appointment_id: "${a_id}", narrative: "n" }
              as: Therapist
              as_user_id: "${t_id}"
              captures: { n_id: $.data.id }
            - call: "POST /clinical-notes/${n_id}/sign"
              payload: {}
              as: Therapist
              as_user_id: "${t_id}"
            - call: "POST /appointments/${a_id}/complete"
              payload: {}
              as: Therapist
              as_user_id: "${t_id}"
              captures: { a_v: $.data.version }
            - call: "POST /claims"
              payload: { appointment_id: "${a_id}", expected_appointment_version: "${a_v}" }
              as: Biller
              captures: { cl_id: $.data.id, cl_v: $.data.version }
            - call: "POST /claims/${cl_id}/adjudicate"
              payload: { expected_claim_version: "${cl_v}" }
              as: Biller
              captures: { cl_v_adj: $.data.version }
          trigger:
            - call: "POST /claims/${cl_id}/void"
              payload: { expected_claim_version: "${cl_v_adj}" }
              as: Biller
          assert:
            - "Claim.${cl_id}.status == VOID"
            - "InsurancePolicy.${pol_id}.deductible_met_cents == 18000"
            - "Appointment.${a_id}.patient_charge_cents == 0"
            - "Appointment.${a_id}.status == COMPLETED"

      - name: resolve_high_risk_restores_patient_active_status
        grounds:
          - state_machines.CrisisAssessment.OPEN_to_OPEN
          - state_machines.CrisisAssessment.OPEN_to_RESOLVED
          - entities.Patient.fields.status
        distinguishing_aspect: >-
          Conserved quantity = Patient.status enum (a categorical state, different in kind from the
          numeric deductible_met_cents): a HIGH-risk assessment places the patient ON_CLINICAL_HOLD
          (forward) and resolving it (compensating) MUST restore Patient.status to ACTIVE with no other OPEN assessment.
        test_recipe:
          setup:
            - "A HIGH-risk OPEN crisis assessment (patient on hold) with a SafetyPlan attached and no other open assessment."
          setup_api_calls:
            - call: "POST /therapists"
              payload: { full_name: "Dr R" }
              as: ClinicalDirector
              captures: { t_id: $.data.id }
            - call: "POST /patients"
              payload: { full_name: "Pt R2", location_state_code: "CA", annual_household_income: 90000, household_size: 1 }
              as: FrontDesk
              captures: { p_id: $.data.id }
            - call: "POST /crisis-assessments"
              payload: { patient_id: "${p_id}", therapist_id: "${t_id}", ideation_score: 3, plan_score: 3, means_access_score: 3, prior_attempts_score: 3 }
              as: Therapist
              as_user_id: "${t_id}"
              captures: { ca_id: $.data.id }
            - call: "POST /safety-plans"
              payload: { crisis_assessment_id: "${ca_id}", warning_signs: "w", coping_strategies: "c", emergency_contacts: ["988"] }
              as: Therapist
              as_user_id: "${t_id}"
          trigger:
            - call: "POST /crisis-assessments/${ca_id}/resolve"
              payload: {}
              as: Therapist
              as_user_id: "${t_id}"
          assert:
            - "CrisisAssessment.${ca_id}.status == RESOLVED"
            - "Patient.${p_id}.status == ACTIVE"
