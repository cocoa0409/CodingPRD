            - call: "POST /work-orders/${wb}/advance"
              payload: { target: "DYNO_TEST" }
              as: ShopTechnician
          trigger:
            - call: "POST /reman-engines/${e2}/dyno-tests"
              payload: { dyno_cell_code: "CELL-BUF", started_at: "2026-08-03T11:00:00Z", ended_at: "2026-08-03T12:00:00Z", horsepower: 320, oil_pressure_psi: 25.0, coolant_temp_f: 195 }
              as: ShopTechnician
              as_user_id: "tech-1"
              captures: { err_buf: $.data.error_id }
            - call: "GET /reman-engines/${e2}"
              as: PlantAdmin
              captures: { e2_mid: $.data.latest_dyno_result }
            - call: "POST /reman-engines/${e2}/dyno-tests"
              payload: { dyno_cell_code: "CELL-BUF", started_at: "2026-08-03T11:30:00Z", ended_at: "2026-08-03T12:30:00Z", horsepower: 320, oil_pressure_psi: 25.0, coolant_temp_f: 195 }
              as: ShopTechnician
              as_user_id: "tech-1"
              captures: { t2_result: $.data.result }
            - call: "GET /reman-engines/${e2}/dyno-tests"
              as: PlantAdmin
          assert:
            - "captured err_buf == ERR_DYNO_CELL_SCHEDULE_OVERLAP (start at exactly the prior end still conflicts: prior occupies [10:00, 11:30) with buffer)"
            - "captured e2_mid == null (rejected test left no record)"
            - "captured t2_result == PASS (start at exactly end+buffer 11:30 is allowed)"
            - "GET /reman-engines/${e2}/dyno-tests returns exactly 1 record"

  # =================================================================
  # Rule 9 — compensating_invariant
  # =================================================================
  - rule_id: compensating_invariant
    instances:
      - name: deposit_held_conserved_through_sale_and_refund
        grounds:
          - calculations.distributor_ledger_reconciliation
          - state_machines.RemanEngine.SEALED_to_SOLD
          - state_machines.CoreDeposit.HELD_to_CLOSED_REFUNDED
        distinguishing_aspect: |
          Conserved quantity: Distributor.deposits_held_cents (monetary exposure).
          The sale forward action (+amount_cents) paired with the compensating
          deposit close via grading (-amount_cents) returns the ledger to its
          pre-sale value, and refunded_cents + forfeited_cents == amount_cents.
        test_recipe:
          setup:
            - "Distributor D-S starts with deposits_held_cents == 0"
            - "Engine E sold to D-S at 2026-08-01 (deposit 200000 HELD); linked return R received; graded at day 30 (100% bracket)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlantAdmin
            - call: "POST /distributors"
              payload: { distributor_code: "D-SRC5", name: "Core Source 5", emissions_requirement: "FEDERAL", credit_limit_cents: 1000000, volume_discount_pct: 0.0 }
              as: PlantAdmin
              captures: { dcore: $.data.id }
            - call: "POST /distributors"
              payload: { distributor_code: "D-S", name: "Invariant Buyer", emissions_requirement: "FEDERAL", credit_limit_cents: 2000000, volume_discount_pct: 0.0 }
              as: PlantAdmin
              captures: { ds: $.data.id, ds_held0: $.data.deposits_held_cents }
            - call: "POST /build-specs"
              payload: { engine_family: "SBC-350", application_code: "YUKON-1998", emissions_tier: "FEDERAL", list_price_cents: 250000, core_deposit_cents: 200000, core_base_credit_cents: 100000, allowed_reuse_grades: ["REUSE_OK"], allowed_interchange_groups: ["CRANK-SBC-3.48"], dyno_min_horsepower: 300, dyno_min_oil_pressure_psi: 20.0, dyno_max_coolant_temp_f: 210, required_op_sequence: ["CRANK_GRIND"] }
              as: PlantAdmin
              captures: { s1: $.data.id }
            - call: "POST /build-specs/${s1}/activate"
              as: PlantAdmin
            - call: "POST /core-returns"
              payload: { distributor_id: "${dcore}", build_spec_id: "${s1}" }
              as: Distributor
              as_user_id: "${dcore}"
              captures: { r0: $.data.id }
            - call: "POST /core-returns/${r0}/grade"
              payload: { grade: "GRADE_A", missing_components: [] }
              as: CoreInspector
            - call: "POST /work-orders"
              payload: { core_return_id: "${r0}" }
              as: PlantAdmin
              captures: { w1: $.data.id }
            - call: "POST /work-orders/${w1}/advance"
              payload: { target: "TEARDOWN" }
              as: ShopTechnician
              captures: { w1v: $.data.version }
            - call: "POST /work-orders/${w1}/operations"
              payload: { op_type: "CRANK_GRIND", sequence: 1, expected_work_order_version: "${w1v}" }
              as: ShopTechnician
              captures: { o1: $.data.id }
            - call: "POST /work-orders/${w1}/advance"
              payload: { target: "MACHINING" }
              as: ShopTechnician
            - call: "POST /operations/${o1}/perform"
              payload: { station_code: "STN-INV", scheduled_start: "2026-08-02T08:00:00Z", scheduled_end: "2026-08-02T09:00:00Z", result: "PASS" }
              as: ShopTechnician
            - call: "POST /work-orders/${w1}/advance"
              payload: { target: "ASSEMBLY" }
              as: ShopTechnician
            - call: "GET /work-orders/${w1}"
              as: PlantAdmin
              captures: { e1: $.data.reman_engine_id }
            - call: "POST /work-orders/${w1}/advance"
              payload: { target: "DYNO_TEST" }
              as: ShopTechnician
            - call: "POST /reman-engines/${e1}/dyno-tests"
              payload: { dyno_cell_code: "CELL-INV", started_at: "2026-08-03T08:00:00Z", ended_at: "2026-08-03T09:00:00Z", horsepower: 320, oil_pressure_psi: 25.0, coolant_temp_f: 195 }
              as: ShopTechnician
              as_user_id: "tech-1"
            - call: "POST /reman-engines/${e1}/seal"
              as: QualityInspector
              as_user_id: "qi-1"
            - call: "GET /distributors/${ds}"
              as: PlantAdmin
              captures: { dsv: $.data.version }
            - call: "POST /reman-engines/sell"
              payload: { build_spec_id: "${s1}", expected_distributor_version: "${dsv}" }
              as: Distributor
              as_user_id: "${ds}"
            - call: "GET /distributors/${ds}"
              as: PlantAdmin
              captures: { ds_held_mid: $.data.deposits_held_cents }
            - call: "GET /core-deposits"
              payload: { reman_engine_id: "${e1}" }
              as: PlantAdmin
              captures: { dep: $.data.0.id }
            - call: "POST /core-returns"
              payload: { distributor_id: "${ds}", build_spec_id: "${s1}", core_deposit_id: "${dep}" }
              as: Distributor
              as_user_id: "${ds}"
              captures: { r1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-31T00:00:00Z" }
              as: PlantAdmin
          trigger:
            - call: "POST /core-returns/${r1}/grade"
              payload: { grade: "GRADE_A", missing_components: [] }
              as: CoreInspector
            - call: "GET /core-deposits/${dep}"
              as: PlantAdmin
              captures: { dep_ref: $.data.refunded_cents, dep_forf: $.data.forfeited_cents, dep_amount: $.data.amount_cents }
            - call: "GET /distributors/${ds}"
              as: PlantAdmin
              captures: { ds_held_final: $.data.deposits_held_cents }
          assert:
            - "captured ds_held0 == 0 (baseline)"
            - "captured ds_held_mid == 200000 (forward action: sale created the HELD deposit)"
            - "captured ds_held_final == 0 == captured ds_held0 (compensating close restores the baseline)"
            - "captured dep_ref + captured dep_forf == captured dep_amount (200000 + 0 == 200000)"

      - name: component_pool_conserved_through_consume_and_cancel
        grounds:
          - state_machines.Component.AVAILABLE_to_CONSUMED
          - state_machines.Component.CONSUMED_to_AVAILABLE
          - state_machines.RemanWorkOrder.ASSEMBLY_to_CANCELLED
        distinguishing_aspect: |
          Conserved quantity: the reusable-component pool count for a part_type
          (physical units, different from the monetary invariant of the sibling
          instance). Consume (AVAILABLE -> CONSUMED) paired with the compensating
          work-order cancel (CONSUMED -> AVAILABLE) leaves the AVAILABLE count
          unchanged.
        test_recipe:
          setup:
            - "Work order W reached ASSEMBLY; component CMP (CRANKSHAFT, group CRANK-SBC-3.48, grade REUSE_OK) AVAILABLE"
            - "available_count(CRANKSHAFT) == 1 before consume"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlantAdmin
            - call: "POST /distributors"
              payload: { distributor_code: "D-POOL", name: "Pool Cores", emissions_requirement: "FEDERAL", credit_limit_cents: 1000000, volume_discount_pct: 0.0 }
              as: PlantAdmin
              captures: { d1: $.data.id }
            - call: "POST /build-specs"
              payload: { engine_family: "SBC-350", application_code: "BLAZER-1998", emissions_tier: "FEDERAL", list_price_cents: 250000, core_deposit_cents: 200000, core_base_credit_cents: 100000, allowed_reuse_grades: ["REUSE_OK"], allowed_interchange_groups: ["CRANK-SBC-3.48"], dyno_min_horsepower: 300, dyno_min_oil_pressure_psi: 20.0, dyno_max_coolant_temp_f: 210, required_op_sequence: ["CRANK_GRIND"] }
              as: PlantAdmin
              captures: { s1: $.data.id }
            - call: "POST /build-specs/${s1}/activate"
              as: PlantAdmin
            - call: "POST /core-returns"
              payload: { distributor_id: "${d1}", build_spec_id: "${s1}" }
              as: Distributor
              as_user_id: "${d1}"
              captures: { r1: $.data.id }
            - call: "POST /core-returns/${r1}/grade"
              payload: { grade: "GRADE_A", missing_components: [] }
              as: CoreInspector
            - call: "POST /work-orders"
              payload: { core_return_id: "${r1}" }
              as: PlantAdmin
              captures: { w1: $.data.id }
            - call: "POST /work-orders/${w1}/advance"
              payload: { target: "TEARDOWN" }
              as: ShopTechnician
              captures: { w1v: $.data.version }
            - call: "POST /work-orders/${w1}/components"
              payload: { part_type: "CRANKSHAFT", interchange_group: "CRANK-SBC-3.48" }
              as: ShopTechnician
              captures: { cmp: $.data.id }
            - call: "POST /components/${cmp}/inspect"
              payload: { reuse_grade: "REUSE_OK", quarantine: false }
              as: QualityInspector
              captures: { cmp_status0: $.data.status }
            - call: "POST /work-orders/${w1}/operations"
              payload: { op_type: "CRANK_GRIND", sequence: 1, expected_work_order_version: "${w1v}" }
              as: ShopTechnician
              captures: { o1: $.data.id }
            - call: "POST /work-orders/${w1}/advance"
              payload: { target: "MACHINING" }
              as: ShopTechnician
            - call: "POST /operations/${o1}/perform"
              payload: { station_code: "STN-POOL", scheduled_start: "2026-08-02T08:00:00Z", scheduled_end: "2026-08-02T09:00:00Z", result: "PASS" }
              as: ShopTechnician
            - call: "POST /work-orders/${w1}/advance"
              payload: { target: "ASSEMBLY" }
              as: ShopTechnician
            - call: "GET /work-orders/${w1}"
              as: PlantAdmin
              captures: { e1: $.data.reman_engine_id }
          trigger:
            - call: "POST /work-orders/${w1}/consume"
              payload: { component_id: "${cmp}" }
              as: ShopTechnician
              captures: { cmp_consumed: $.data.status }
            - call: "POST /work-orders/${w1}/cancel"
              as: PlantAdmin
              captures: { w1_status: $.data.status }
            - call: "GET /components/${cmp}"
              as: PlantAdmin
              captures: { cmp_final: $.data.status, cmp_consumer: $.data.consumed_by_work_order_id }
            - call: "GET /reman-engines/${e1}"
              as: PlantAdmin
              captures: { e1_status: $.data.status }
          assert:
            - "captured cmp_status0 == AVAILABLE (pool baseline for CRANKSHAFT: 1)"
            - "captured cmp_consumed == CONSUMED (forward action: pool 1 -> 0)"
            - "captured w1_status == CANCELLED"
            - "captured cmp_final == AVAILABLE and captured cmp_consumer == null (compensating release: pool back to 1)"
            - "captured e1_status == SCRAPPED (cancel in ASSEMBLY scraps the unsealed engine)"
