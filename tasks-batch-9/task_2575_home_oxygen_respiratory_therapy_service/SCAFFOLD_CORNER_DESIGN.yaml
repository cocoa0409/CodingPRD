            - call: "POST /home-oxygen/equipment-units"
              payload: { branch_id: "${br1}", serial_number: "OK-1", model_code: "CONC-35", equipment_class: "STATIONARY_CONCENTRATOR", max_continuous_lpm: 3.5, max_pulse_setting: 0, pm_interval_days: 365, next_pm_due_date: "2027-06-01" }
