        excluded_because:
          difficulty_instance: recording_confirm_depth3_cascade
          rationale: "The full hop-by-hop cascade is asserted in the named Rule-4 instance."
      - name: cascade_report_submit_to_disbursement
        claim_type: side_effect_execution
        grounds: ["state_machines.InspectionReport.DRAFT_to_SUBMITTED"]
        excluded_because:
          difficulty_instance: report_submit_cascade_to_disbursement_state
          rationale: "The report-submit cascade is asserted in the named Rule-4 instance."
      - name: failed_report_cure_loop
        claim_type: invalid_transition
        grounds: ["state_machines.WorkoutCase.HANDOVER_INSPECTION_to_VACATE_PENDING"]
        excluded_because:
          difficulty_instance: inspection_failure_reinspection_loop
          rationale: "The FAILED-report revert loop is asserted in the named Rule-3 instance."
      - name: program_branch_dil_vs_cfk
        claim_type: side_effect_execution
        grounds: ["state_machines.WorkoutCase.DISBURSEMENT_PENDING_to_COMPLETED"]
        excluded_because:
          difficulty_instance: case_program_branch_divergence
