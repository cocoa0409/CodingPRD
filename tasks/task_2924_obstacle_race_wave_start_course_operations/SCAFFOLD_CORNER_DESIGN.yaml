      - name: a_frozen_parcel_refuses_new_design_and_festival_work
        claim_type: Error Triggerability
        grounds:
          - state_machines[Venue]
          - errors[ERR_VENUE_FROZEN]
        distinguishing_aspect: "One denied application freezes the parcel for every downstream operation class named in the error's condition — a new course and a new festival installation are both refused — while the already-created course is suspended rather than deleted."
        test_recipe:
          setup:
            - "A venue with one course already created in DRAFT, and an application submitted by designer-1."
          setup_api_calls:
            - call: "POST /ocr/venues"
              payload: { name: "Ridgeline Quarry", terrain_type: "QUARRY", water_access: "NONE", land_use_zone: "AG-2", protected_acreage_sqm: 2000, restoration_bond_cents: 1000000 }
              as: PermitOfficer
              captures: { venue_id: $.data.id }
            - call: "POST /ocr/venues/${venue_id}/courses"
              payload: { name: "Quarry Gauntlet", total_distance_m: 10000, corral_release_rate_per_min: 12.00, corral_throughput_capacity: 200 }
              as: CourseDesigner
              captures: { course_id: $.data.id }
            - call: "POST /ocr/venues/${venue_id}/permits"
              payload: { permit_number: "C-2924-46", water_use_allowed: false, max_disturbed_area_sqm: 5000, quiet_hours_start_hour_utc: 22, quiet_hours_end_hour_utc: 6, valid_until_utc: "2026-12-31T00:00:00Z", restoration_deadline_utc: "2026-10-01T00:00:00Z" }
              as: CourseDesigner
              captures: { permit_id: $.data.id }
            - call: "POST /ocr/permits/${permit_id}/submit"
              payload: {}
              as: CourseDesigner
              as_user_id: "designer-1"
          trigger:
            - call: "POST /ocr/permits/${permit_id}/decision"
              payload: { decision: "DENIED", decision_note: "Wetland buffer breached" }
              as: PermitOfficer
              as_user_id: "officer-1"
            - call: "POST /ocr/venues/${venue_id}/courses"
              payload: { name: "Replacement Loop", total_distance_m: 8000, corral_release_rate_per_min: 10.00, corral_throughput_capacity: 150 }
              as: CourseDesigner
            - call: "POST /ocr/venues/${venue_id}/festival-services"
              payload: { service_type: "BAG_CHECK", footprint_sqm: 150, capacity: 500, water_draw_lpm: 0 }
              as: SiteOpsLead
            - call: "GET /ocr/venues/${venue_id}"
              payload: {}
              as: PermitOfficer
          assert:
            - "The decision returns 200 with LandUsePermit.${permit_id}.status == DENIED"
            - "The second trigger call returns 409 with data.error_id == ERR_VENUE_FROZEN"
            - "The third trigger call returns 409 with data.error_id == ERR_VENUE_FROZEN, covering the festival-install operation class"
            - "The venue read shows site_posture == FROZEN with disturbed_area_sqm still 0"
            - "Course.${course_id}.status == SUSPENDED and readiness_posture == FROZEN — the existing course is suspended, not removed"
            - "GET /ocr/venues/${venue_id}/courses returns total_count 1 and GET /ocr/venues/${venue_id}/festival-services returns total_count 0"

