      - name: unauthorized_is_answered_before_the_target_row_is_resolved
        claim_type: denials
        grounds:
          - errors[ERR_UNAUTHORIZED]
          - validations[priority=4]
          - validations[priority=15]
        excluded_because:
          difficulty_instance: unauthorized_role_beats_certificate_not_found
          rationale: "The §1.8 priority_pair_validation_conflict instance already proves that the priority 4 role check outranks the priority 15 certificate-existence check, returning 403 ERR_UNAUTHORIZED for a wrong-role call against a non-existent certificate id."

      - name: witnessing_is_the_only_write_shared_between_two_roles
        claim_type: shared_ops
        grounds:
          - roles[ISSUANCE_OPERATOR].shared_operations
          - roles[COMPLIANCE_AUDITOR].shared_operations
          - endpoints[POST /ca/key-ceremonies/{id}/witness]
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: "The witness endpoint is the single write two roles may both call, and the two witnesses may come from different roles: one ISSUANCE_OPERATOR plus one COMPLIANCE_AUDITOR satisfies the two-witness requirement and moves the ceremony to WITNESSED, while a VALIDATION_OFFICER attempting the same call is refused with 403."
        test_recipe:
          setup:
            - "One SCHEDULED ceremony on a fresh partition at the default clock."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: POLICY_ADMIN
              as_user_id: "u_pol_1"
            - call: "POST /ca/hsm-partitions"
              payload: { label: "Shared Witness Signer", serial: "HSM-2051" }
              as: POLICY_ADMIN
              as_user_id: "u_pol_1"
              captures: { part_id: $.data.id }
            - call: "POST /ca/hsm-partitions/${part_id}/key-ceremonies"
              payload: { window_start: "2026-08-01T00:00:00Z", window_end: "2026-08-01T00:30:00Z", attestation_valid_days: 60 }
              as: ISSUANCE_OPERATOR
              as_user_id: "u_iss_1"
              captures: { cer_id: $.data.id }
          trigger:
            - call: "POST /ca/key-ceremonies/${cer_id}/witness"
              payload: {}
              as: VALIDATION_OFFICER
              as_user_id: "u_val_1"
              captures: { err_witness_denied: $.data.error_id }
            - call: "POST /ca/key-ceremonies/${cer_id}/witness"
              payload: {}
              as: ISSUANCE_OPERATOR
              as_user_id: "u_iss_1"
              captures: { state_after_first: $.data.state, count_after_first: $.data.witness_count }
            - call: "POST /ca/key-ceremonies/${cer_id}/witness"
              payload: {}
              as: COMPLIANCE_AUDITOR
              as_user_id: "u_aud_2"
              captures: { state_after_second: $.data.state, count_after_second: $.data.witness_count }
          assert:
            - "the first trigger returns HTTP 403 and ${err_witness_denied} == ERR_UNAUTHORIZED with witness_count still 0"
            - "the second trigger returns HTTP 200 with ${state_after_first} == SCHEDULED and ${count_after_first} == 1"
            - "the third trigger returns HTTP 200 with ${state_after_second} == WITNESSED and ${count_after_second} == 2"
            - "KeyCeremony.${cer_id}.witness_user_ids == [\"u_iss_1\", \"u_aud_2\"] in witnessing order"

      - name: the_clock_and_every_read_are_shared_by_all_six_roles
        claim_type: shared_ops
        grounds:
          - roles[POLICY_ADMIN].shared_operations
          - roles[VALIDATION_OFFICER].shared_operations
          - roles[VETTING_APPROVER].shared_operations
          - roles[ISSUANCE_OPERATOR].shared_operations
          - roles[REVOCATION_OFFICER].shared_operations
          - roles[COMPLIANCE_AUDITOR].shared_operations
          - endpoints[POST /_clock/set_current_utc]
        distinguishing_aspect: "The clock endpoint and every GET are the only operations with all six roles in their roles list, so an implementation that scopes reads by role (for example hiding subscribers from ISSUANCE_OPERATOR) or that restricts the clock to POLICY_ADMIN fails. Each successive clock call must also be accepted only because it moves forward."
        test_recipe:
          setup:
            - "One profile and one subscriber so the shared reads have something to return."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: POLICY_ADMIN
