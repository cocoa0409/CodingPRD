# =============================================================================
# Child Support Disbursement (State Disbursement Unit / SDU) — seed tables
# Difficulty band: EXPERT (§0.4)
# =============================================================================

scenario: |
  247. Child Support Disbursement (State SDU): support order/income withholding,
  employer remittance, distribution to custodial parent, arrears & interest,
  multi-order allocation, modification, enforcement intercept (tax/license),
  disbursement method

domain_name: child-support-disbursement
api_prefix: /sdu

complexity_profile:
  primary_archetype: "Ledger reconciliation"
  secondary_archetype: "Quota / allocation"
  complexity_layers:
    - "Optimistic concurrency"
    - "Cascading side effects"
    - "Dual-variant calculation"
    - "Rate / threshold triggers"

  entity_topology: flat
  # Peer entities linked by foreign keys (support_order_id, employer_id, etc.);
  # no resource nesting in URL paths. Each entity is a top-level collection.

  state_machine_shape: parallel
  # SupportOrder carries two independent state dimensions that evolve separately:
  #   obligation_status (ESTABLISHED -> ACTIVE -> SUSPENDED/MODIFIED/TERMINATED) and
  #   enforcement_status (NONE -> INTERCEPT_PENDING -> INTERCEPT_ACTIVE -> LIFTED).
  # Modification adds a cyclic shape (DRAFT -> SUBMITTED -> APPROVED/REJECTED, REJECTED -> DRAFT).

  relationship_patterns:
    - one_to_many        # SupportOrder has many LedgerEntry / Disbursement / Modification
    - cross_aggregate    # Remittance (under Employer) allocates across SupportOrders (different aggregate)
    - polymorphic        # LedgerEntry.entry_type tags charge/payment/interest/disbursement/adjustment rows

  role_model: peer_roles
  # CaseWorker owns orders/modifications/enforcement; Employer owns IWOs/remittances;
  # CustodialParty reads own orders/disbursements; FinanceOfficer executes disbursements.

  consistency_model: immediate
  # All ledger postings, allocations, and derived balances settle atomically in the
  # triggering request; computed balances are recomputed inline from ledger entries.

# =============================================================================
# 1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: CustodialParty
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: full_name, type: string, source: input, description: "Custodial parent legal name" }
      - { name: state_code, type: string, source: input, description: "Two-letter US state code of residence" }
      - { name: assistance_status, type: enum, source: input, default: "NEVER_ASSISTED", description: "NEVER_ASSISTED | FORMERLY_ASSISTED | CURRENTLY_ASSISTED — drives distribution variant selection" }
      - { name: payee_status, type: enum, source: system, description: "ACTIVE | HOLD — HOLD blocks disbursements", default: "ACTIVE" }

  - name: NoncustodialParty
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Noncustodial parent (obligor) legal name" }
      - { name: ssn_last4, type: string, source: input, description: "Last four digits of SSN, used for employer match" }
      - { name: supports_second_family, type: boolean, source: input, default: false, description: "Whether obligor supports a second family — selects CCPA cap tier" }
      - { name: total_current_support_cents, type: integer, source: computed, description: "Sum of current_support_cents over this obligor's SupportOrders whose obligation_status IN {ACTIVE, MODIFIED}" }

  - name: Employer
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Employer legal name" }
      - { name: fein, type: string, source: input, description: "Federal Employer Identification Number; unique across Employers" }
      - { name: remittance_method, type: enum, source: input, default: "EFT", description: "EFT | CHECK — how the employer transmits remittances" }

  - name: SupportOrder
    parent: null
    common_fields: true
    fields:
      - { name: custodial_party_id, type: string, source: input, description: "FK -> CustodialParty.id; the payee of disbursements" }
      - { name: noncustodial_party_id, type: string, source: input, description: "FK -> NoncustodialParty.id; the obligor" }
      - { name: current_support_cents, type: integer, source: input, description: "Monthly current-support obligation in cents" }
      - { name: frequency, type: enum, source: input, default: "MONTHLY", description: "MONTHLY — accrual cadence of current support (single supported value in v1)" }
      - { name: interest_rate_bps, type: integer, source: input, default: 1000, description: "Statutory simple-interest annual rate in basis points (1000 = 10.00%/yr)" }
      - { name: arrears_distribution_rule, type: enum, source: computed, description: "FAMILY_FIRST | STATE_FIRST — derived from CustodialParty.assistance_status; selects arrears disbursement variant" }
      - { name: assigned_arrears_cents, type: integer, source: input, default: 0, description: "Arrears balance assigned to the state (TANF reimbursement); state-retained ceiling under STATE_FIRST" }
      - { name: obligation_status, type: enum, source: system, description: "ESTABLISHED | ACTIVE | SUSPENDED | MODIFIED | TERMINATED — lifecycle dimension" }
      - { name: enforcement_status, type: enum, source: system, default: "NONE", description: "NONE | INTERCEPT_PENDING | INTERCEPT_ACTIVE | LIFTED — independent enforcement dimension" }
      - { name: current_support_due_cents, type: integer, source: computed, description: "Unpaid balance in the CURRENT_SUPPORT bucket = sum(CHARGE & ADJUSTMENT with bucket=CURRENT_SUPPORT) - sum(PAYMENT with bucket=CURRENT_SUPPORT), floored at 0. A roll-over CHARGE moves the prior period out of this bucket (see arrears_rollover)." }
      - { name: arrears_principal_cents, type: integer, source: computed, description: "Unpaid balance in the PRINCIPAL bucket = sum(CHARGE & ADJUSTMENT with bucket=PRINCIPAL) - sum(PAYMENT with bucket=PRINCIPAL), floored at 0. Past-due current support is moved here by arrears_rollover." }
      - { name: interest_balance_cents, type: integer, source: computed, description: "Unpaid balance in the INTEREST bucket = sum(INTEREST & ADJUSTMENT with bucket=INTEREST) - sum(PAYMENT with bucket=INTEREST), floored at 0." }
      - { name: net_disbursed_to_family_cents, type: integer, source: computed, description: "Conserved cash-out quantity = sum(family_amount_cents over SENT Disbursements) - sum(family_amount_cents over RETURNED Disbursements) for this order; a SENT+RETURNED pair leaves this unchanged." }
      - { name: last_interest_accrual_at, type: datetime, source: system, description: "Timestamp interest was last accrued through; basis for next daily accrual" }

  - name: IncomeWithholdingOrder
    parent: null
    common_fields: true
    fields:
      - { name: support_order_id, type: string, source: input, description: "FK -> SupportOrder.id; the order this withholding serves" }
      - { name: employer_id, type: string, source: input, description: "FK -> Employer.id; the employer ordered to withhold" }
      - { name: ordered_amount_cents, type: integer, source: input, description: "Per-period amount the IWO directs the employer to withhold" }
      - { name: effective_start_at, type: datetime, source: input, description: "Inclusive start of the withholding coverage interval (half-open semantics)" }
      - { name: effective_end_at, type: datetime, source: input, description: "Exclusive end of the withholding coverage interval; half-open [start, end) — an IWO starting exactly at another's end does NOT overlap" }
      - { name: status, type: enum, source: system, description: "ISSUED | ACKNOWLEDGED | TERMINATED" }

  - name: Remittance
    parent: null
    common_fields: true
    fields:
      - { name: employer_id, type: string, source: input, description: "FK -> Employer.id; the remitting employer" }
      - { name: noncustodial_party_id, type: string, source: input, description: "FK -> NoncustodialParty.id; the employee the withholding was taken from" }
      - { name: disposable_earnings_cents, type: integer, source: input, description: "Employee disposable earnings for the pay period; CCPA cap basis" }
      - { name: gross_remitted_cents, type: integer, source: input, description: "Amount the employer actually transmitted for this employee" }
      - { name: ccpa_cap_cents, type: integer, source: computed, description: "Maximum lawfully withholdable = round(disposable_earnings_cents * ccpa_cap_pct)" }
      - { name: distributable_cents, type: integer, source: computed, description: "min(gross_remitted_cents, ccpa_cap_cents) — amount entering allocation" }
      - { name: status, type: enum, source: system, description: "RECEIVED | ALLOCATED | RETURNED" }

  - name: Allocation
    parent: null
    common_fields: true
    fields:
      - { name: remittance_id, type: string, source: input, description: "FK -> Remittance.id; the remittance this allocation splits" }
      - { name: support_order_id, type: string, source: input, description: "FK -> SupportOrder.id; the order this slice was applied to" }
      - { name: current_support_applied_cents, type: integer, source: computed, description: "Slice applied to current support due on this order" }
      - { name: interest_applied_cents, type: integer, source: computed, description: "Slice applied to accrued interest on this order" }
      - { name: principal_applied_cents, type: integer, source: computed, description: "Slice applied to arrears principal on this order" }
      - { name: total_applied_cents, type: integer, source: computed, description: "current_support_applied + interest_applied + principal_applied" }

  - name: LedgerEntry
    parent: null
    common_fields: false  # append-only event: id + created_at only
    fields:
      - { name: support_order_id, type: string, source: input, description: "FK -> SupportOrder.id; the order this row posts against" }
      - { name: entry_type, type: enum, source: system, description: "CHARGE | PAYMENT | INTEREST | DISBURSEMENT | ADJUSTMENT — polymorphic ledger row" }
      - { name: bucket, type: enum, source: system, description: "CURRENT_SUPPORT | INTEREST | PRINCIPAL — which balance this row moves" }
      - { name: amount_cents, type: integer, source: system, description: "Signed cents: positive increases the bucket's owed balance, negative reduces it" }
      - { name: source_ref, type: string, source: system, description: "Originating entity id (remittance/allocation/modification/enforcement) for audit" }
      - { name: effective_at, type: datetime, source: system, description: "Posting timestamp; chronological replay key for balance derivation" }

  - name: Disbursement
    parent: null
    common_fields: true
    fields:
      - { name: support_order_id, type: string, source: input, description: "FK -> SupportOrder.id; the order whose collection is being paid out" }
      - { name: custodial_party_id, type: string, source: input, description: "FK -> CustodialParty.id; the payee" }
      - { name: allocation_id, type: string, source: input, description: "FK -> Allocation.id; the allocation slice this disbursement pays out" }
      - { name: method, type: enum, source: input, default: "EFT", description: "EFT | CHECK | DEBIT_CARD — disbursement channel" }
      - { name: family_amount_cents, type: integer, source: computed, description: "Cents paid to the custodial party" }
      - { name: state_retained_cents, type: integer, source: computed, description: "Cents retained by the state under STATE_FIRST (assigned-arrears recovery)" }
      - { name: status, type: enum, source: system, description: "PENDING | SENT | RETURNED" }

  - name: Modification
    parent: null
    common_fields: true
    fields:
      - { name: support_order_id, type: string, source: input, description: "FK -> SupportOrder.id; the order under review" }
      - { name: proposed_current_support_cents, type: integer, source: input, description: "Requested new monthly current-support amount" }
      - { name: coverage_start_at, type: datetime, source: input, description: "Inclusive start of the period the new amount governs (closed-interval semantics)" }
      - { name: coverage_end_at, type: datetime, source: input, description: "Inclusive end of the period the new amount governs; closed [start, end] — a modification whose coverage touches another's boundary instant DOES overlap" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | APPROVED | REJECTED | APPLIED — cyclic via REJECTED -> DRAFT" }

  - name: EnforcementAction
    parent: null
    common_fields: true
    fields:
      - { name: support_order_id, type: string, source: input, description: "FK -> SupportOrder.id; the delinquent order" }
      - { name: action_type, type: enum, source: input, description: "TAX_INTERCEPT | LICENSE_SUSPENSION" }
      - { name: certified_arrears_cents, type: integer, source: computed, description: "Arrears principal + interest snapshot certified at certification time" }
      - { name: status, type: enum, source: system, description: "PROPOSED | CERTIFIED | SATISFIED | WITHDRAWN" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  # ---- SupportOrder: obligation dimension (lifecycle) ----
  - entity: SupportOrder
    field: obligation_status
    initial_state: ESTABLISHED
    terminal_states: [TERMINATED]
    transitions:
      - from: ESTABLISHED
        to: ACTIVE
        trigger: "POST /support-orders/{id}/activate"
        actor: CaseWorker
        preconditions:
          - "obligation_status == ESTABLISHED (ERR_INVALID_STATE)"
          - "current_support_cents > 0 (ERR_INVALID_AMOUNT)"
        side_effects:
          - "obligation_status -> ACTIVE"
          - "last_interest_accrual_at set to current clock time"
          - "increments SupportOrder.version by 1"

      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /support-orders/{id}/suspend"
        actor: CaseWorker
        preconditions:
          - "obligation_status == ACTIVE (ERR_INVALID_STATE)"
        side_effects:
          - "obligation_status -> SUSPENDED (no new current-support charges accrue while suspended)"
          - "increments SupportOrder.version by 1"

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /support-orders/{id}/activate"
        actor: CaseWorker
        preconditions:
          - "obligation_status == SUSPENDED (ERR_INVALID_STATE)"
        side_effects:
          - "obligation_status -> ACTIVE"
          - "increments SupportOrder.version by 1"

      - from: ACTIVE
        to: MODIFIED
        trigger: "system: Modification APPROVED -> APPLIED"
        actor: system
        preconditions:
          - "obligation_status == ACTIVE (ERR_INVALID_STATE)"
        side_effects:
          - "current_support_cents set to Modification.proposed_current_support_cents"
          - "obligation_status -> MODIFIED"
          - "NoncustodialParty.total_current_support_cents recomputed (cascade)"
          - "increments SupportOrder.version by 1"

      - from: MODIFIED
        to: ACTIVE
        trigger: "POST /support-orders/{id}/activate"
        actor: CaseWorker
        preconditions:
          - "obligation_status == MODIFIED (ERR_INVALID_STATE)"
        side_effects:
          - "obligation_status -> ACTIVE"
          - "increments SupportOrder.version by 1"

      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /support-orders/{id}/terminate"
        actor: CaseWorker
        preconditions:
          - "obligation_status IN {ACTIVE, SUSPENDED, MODIFIED} (ERR_INVALID_STATE)"
          - "arrears_principal_cents == 0 AND interest_balance_cents == 0 (ERR_ARREARS_OUTSTANDING)"
          - "enforcement_status NOT IN {INTERCEPT_PENDING, INTERCEPT_ACTIVE} (ERR_ENFORCEMENT_ACTIVE)"
        side_effects:
          - "obligation_status -> TERMINATED"
          - "all ISSUED/ACKNOWLEDGED IncomeWithholdingOrders for this order -> TERMINATED (cascade down)"
          - "increments SupportOrder.version by 1"

  # ---- SupportOrder: enforcement dimension (parallel) ----
  - entity: SupportOrder
    field: enforcement_status
    initial_state: NONE
    terminal_states: []
    transitions:
      - from: NONE
        to: INTERCEPT_PENDING
        trigger: "system: EnforcementAction PROPOSED created for this order"
        actor: system
        preconditions:
          - "arrears_principal_cents + interest_balance_cents >= ENFORCEMENT_CERT_THRESHOLD_CENTS (ERR_BELOW_ENFORCEMENT_THRESHOLD)"
        side_effects:
          - "enforcement_status -> INTERCEPT_PENDING"
          - "increments SupportOrder.version by 1"

      - from: INTERCEPT_PENDING
        to: INTERCEPT_ACTIVE
        trigger: "system: EnforcementAction PROPOSED -> CERTIFIED"
        actor: system
        preconditions:
          - "enforcement_status == INTERCEPT_PENDING (ERR_INVALID_STATE)"
        side_effects:
          - "enforcement_status -> INTERCEPT_ACTIVE"
          - "increments SupportOrder.version by 1"

      - from: INTERCEPT_ACTIVE
        to: LIFTED
        trigger: "system: EnforcementAction CERTIFIED -> SATISFIED (arrears cleared)"
        actor: system
        preconditions:
          - "arrears_principal_cents == 0 AND interest_balance_cents == 0"
        side_effects:
          - "enforcement_status -> LIFTED"
          - "increments SupportOrder.version by 1"

      - from: INTERCEPT_PENDING
        to: NONE
        trigger: "system: EnforcementAction PROPOSED -> WITHDRAWN"
        actor: system
        preconditions:
          - "enforcement_status == INTERCEPT_PENDING (ERR_INVALID_STATE)"
        side_effects:
          - "enforcement_status -> NONE"
          - "increments SupportOrder.version by 1"

  # ---- IncomeWithholdingOrder ----
  - entity: IncomeWithholdingOrder
    field: status
    initial_state: ISSUED
    terminal_states: [TERMINATED]
    transitions:
      - from: ISSUED
        to: ACKNOWLEDGED
        trigger: "POST /income-withholding-orders/{id}/acknowledge"
        actor: Employer
        preconditions:
          - "status == ISSUED (ERR_INVALID_STATE)"
        side_effects:
          - "status -> ACKNOWLEDGED"

      - from: ACKNOWLEDGED
        to: TERMINATED
        trigger: "POST /income-withholding-orders/{id}/terminate"
        actor: CaseWorker
        preconditions:
          - "status IN {ISSUED, ACKNOWLEDGED} (ERR_INVALID_STATE)"
        side_effects:
          - "status -> TERMINATED"

      - from: ISSUED
        to: TERMINATED
        trigger: "POST /income-withholding-orders/{id}/terminate OR cascade from SupportOrder TERMINATED"
        actor: CaseWorker
        preconditions:
          - "status IN {ISSUED, ACKNOWLEDGED} (ERR_INVALID_STATE)"
        side_effects:
          - "status -> TERMINATED"

  # ---- Remittance ----
  - entity: Remittance
    field: status
    initial_state: RECEIVED
    terminal_states: [ALLOCATED, RETURNED]
    transitions:
      - from: RECEIVED
        to: ALLOCATED
        trigger: "POST /remittances/{id}/allocate"
        actor: FinanceOfficer
        preconditions:
          - "status == RECEIVED (ERR_INVALID_STATE)"
          - "noncustodial_party has >= 1 SupportOrder whose obligation_status IN {ACTIVE, MODIFIED} (ERR_NO_ALLOCABLE_ORDER)"
          - "distributable_cents > 0 (ERR_NOTHING_TO_ALLOCATE)"
        side_effects:
          - "run multi_order_allocation: create one Allocation per eligible SupportOrder (cascade)"
          - "for each Allocation, post PAYMENT LedgerEntry rows per bucket on the target SupportOrder (cascade)"
          - "each target SupportOrder's computed balances (current_support_due, interest_balance, arrears_principal) recomputed (cascade)"
          - "status -> ALLOCATED"

      - from: RECEIVED
        to: RETURNED
        trigger: "POST /remittances/{id}/return"
        actor: FinanceOfficer
        preconditions:
          - "status == RECEIVED (ERR_INVALID_STATE)"
        side_effects:
          - "status -> RETURNED (funds returned to employer; no allocation posted)"

  # ---- Disbursement ----
  - entity: Disbursement
    field: status
    initial_state: PENDING
    terminal_states: [SENT, RETURNED]
    transitions:
      - from: PENDING
        to: SENT
        trigger: "POST /disbursements/{id}/send"
        actor: FinanceOfficer
        preconditions:
          - "status == PENDING (ERR_INVALID_STATE)"
          - "the disbursement's CustodialParty.payee_status == ACTIVE (ERR_PAYEE_ON_HOLD)"
        side_effects:
          - "status -> SENT"
          - "post a DISBURSEMENT LedgerEntry (entry_type=DISBURSEMENT, bucket=CURRENT_SUPPORT, amount = -family_amount_cents): cash leaves to the family, reducing net_disbursed_to_family_cents's underlying running total"
          - "net_disbursed_to_family_cents increases by family_amount_cents (forward action of the conservation pair)"
          - "increments Disbursement.version by 1"

      - from: SENT
        to: RETURNED
        trigger: "POST /disbursements/{id}/return"
        actor: FinanceOfficer
        preconditions:
          - "status == SENT (ERR_INVALID_STATE)"
        side_effects:
          - "status -> RETURNED"
          - "post a compensating ADJUSTMENT LedgerEntry (entry_type=ADJUSTMENT, bucket=CURRENT_SUPPORT, amount = +family_amount_cents) that exactly negates the SEND's DISBURSEMENT row"
          - "net_disbursed_to_family_cents decreases by family_amount_cents back to its pre-send value (compensating action; conserved quantity restored, zero drift)"
          - "the order's owed buckets (current_support_due_cents, interest_balance_cents, arrears_principal_cents) are UNAFFECTED by both send and return — disbursement is downstream of collection"
          - "increments Disbursement.version by 1"

  # ---- Modification (cyclic) ----
  - entity: Modification
    field: status
    initial_state: DRAFT
    terminal_states: [APPLIED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /modifications/{id}/submit"
        actor: CaseWorker
        preconditions:
          - "status == DRAFT (ERR_INVALID_STATE)"
          - "proposed_current_support_cents >= 0 (ERR_INVALID_AMOUNT)"
        side_effects:
          - "status -> SUBMITTED"

      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /modifications/{id}/decide (decision=APPROVE)"
        actor: Supervisor
        preconditions:
          - "status == SUBMITTED (ERR_INVALID_STATE)"
          - "the linked SupportOrder.obligation_status == ACTIVE (ERR_ORDER_NOT_ACTIVE)"
        side_effects:
          - "status -> APPROVED"

      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /modifications/{id}/decide (decision=REJECT)"
        actor: Supervisor
        preconditions:
          - "status == SUBMITTED (ERR_INVALID_STATE)"
        side_effects:
          - "status -> REJECTED"

      - from: REJECTED
        to: DRAFT
        trigger: "POST /modifications/{id}/revise"
        actor: CaseWorker
        preconditions:
          - "status == REJECTED (ERR_INVALID_STATE)"
        side_effects:
          - "status -> DRAFT (cycle back for re-submission)"

      - from: APPROVED
        to: APPLIED
        trigger: "POST /modifications/{id}/apply"
        actor: CaseWorker
        preconditions:
          - "status == APPROVED (ERR_INVALID_STATE)"
          - "the linked SupportOrder.obligation_status == ACTIVE (ERR_ORDER_NOT_ACTIVE)"
        side_effects:
          - "linked SupportOrder.current_support_cents -> proposed_current_support_cents"
          - "linked SupportOrder.obligation_status ACTIVE -> MODIFIED (cross-entity transition)"
          - "linked SupportOrder NoncustodialParty.total_current_support_cents recomputed (transitive cascade)"
          - "status -> APPLIED"

  # ---- EnforcementAction ----
  - entity: EnforcementAction
    field: status
    initial_state: PROPOSED
    terminal_states: [SATISFIED, WITHDRAWN]
    transitions:
      - from: PROPOSED
        to: CERTIFIED
        trigger: "POST /enforcement-actions/{id}/certify"
        actor: CaseWorker
        preconditions:
          - "status == PROPOSED (ERR_INVALID_STATE)"
          - "the linked SupportOrder.enforcement_status == INTERCEPT_PENDING (ERR_INVALID_STATE)"
        side_effects:
          - "certified_arrears_cents snapshot = order.arrears_principal_cents + order.interest_balance_cents"
          - "status -> CERTIFIED"
          - "linked SupportOrder.enforcement_status INTERCEPT_PENDING -> INTERCEPT_ACTIVE (cross-entity transition)"

      - from: CERTIFIED
        to: SATISFIED
        trigger: "system: arrears fully collected (cascade from Remittance allocation)"
        actor: system
        preconditions:
          - "linked SupportOrder.arrears_principal_cents == 0 AND interest_balance_cents == 0"
        side_effects:
          - "status -> SATISFIED"
          - "linked SupportOrder.enforcement_status INTERCEPT_ACTIVE -> LIFTED (transitive cascade)"

      - from: PROPOSED
        to: WITHDRAWN
        trigger: "POST /enforcement-actions/{id}/withdraw"
        actor: CaseWorker
        preconditions:
          - "status == PROPOSED (ERR_INVALID_STATE)"
        side_effects:
          - "status -> WITHDRAWN"
          - "linked SupportOrder.enforcement_status INTERCEPT_PENDING -> NONE (cross-entity transition)"

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: enforcement-propose-stale-order
    parent_entity: SupportOrder
    write_endpoint: "POST /enforcement-actions"
    occ_field: "expected_support_order_version"
    description: |
      Creating an EnforcementAction against a SupportOrder whose version has
      advanced since the client last observed it is rejected on a stale-version
      check. This captures the case where another writer has already proposed an
      enforcement action (which legitimately moved the order's enforcement_status
      to INTERCEPT_PENDING and bumped its version), so the current writer's view
      of the order is stale and a second PROPOSED action would double-certify.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: modification-apply-stale-order
    parent_entity: SupportOrder
    write_endpoint: "POST /modifications/{id}/apply"
    occ_field: "expected_support_order_version"
    description: |
      Applying an APPROVED Modification against a SupportOrder whose version has
      advanced since the client last observed it is rejected on a stale-version
      check. This captures the case where another modification has already been
      applied (legitimately superseding current_support_cents and bumping the
      order's version), so applying this stale view would clobber the newer
      amount.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: ccpa_withholding_cap
    trigger: "Remittance creation (POST /remittances) computes ccpa_cap_cents and distributable_cents"
    algorithm: threshold
    formula: |
      # Select the cap percentage tier, then cap the remitted amount.
      arrears_weeks_overdue = order_set_arrears_weeks(noncustodial_party)   # see input_set
      second_family = NoncustodialParty.supports_second_family
      if second_family and arrears_weeks_overdue < 12:   cap_pct = 0.50
      elif second_family and arrears_weeks_overdue >= 12: cap_pct = 0.55
      elif (not second_family) and arrears_weeks_overdue < 12: cap_pct = 0.60
      else:                                               cap_pct = 0.65
      ccpa_cap_cents      = round_half_up(disposable_earnings_cents * cap_pct)
      distributable_cents = min(gross_remitted_cents, ccpa_cap_cents)
    input_set: "arrears_weeks_overdue = floor( (sum of arrears_principal_cents over the obligor's ACTIVE/MODIFIED orders) / (weekly equivalent of total_current_support_cents) ); >= 12 weeks raises the tier."
    constants:
      CAP_SECOND_FAMILY_UNDER_12: 0.50
      CAP_SECOND_FAMILY_12_PLUS: 0.55
      CAP_NO_SECOND_FAMILY_UNDER_12: 0.60
      CAP_NO_SECOND_FAMILY_12_PLUS: 0.65
      WEEKS_THRESHOLD: 12
    precision: "ccpa_cap_cents rounded to whole cents, round_half_up"
    variants:
      - name: cap_binds
        when: "gross_remitted_cents > ccpa_cap_cents"
        difference: "distributable_cents is the cap, not the gross; the shortfall (gross - cap) is recorded as not-distributable and the employer is notified"
      - name: cap_slack
        when: "gross_remitted_cents <= ccpa_cap_cents"
        difference: "distributable_cents == gross_remitted_cents; cap is non-binding"

  - name: multi_order_allocation
    trigger: "Remittance allocate transition (POST /remittances/{id}/allocate)"
    algorithm: waterfall_allocation
    formula: |
      # STAGE 1 — across orders: prorate distributable_cents by each eligible
      # order's current_support_cents share, paying CURRENT SUPPORT first.
      eligible = SupportOrders of the remittance's noncustodial_party with
                 obligation_status IN {ACTIVE, MODIFIED}, sorted by created_at ASC.
      total_cs = sum(o.current_support_cents for o in eligible)
      if distributable_cents <= total_cs:
          # pure current-support proration; nothing reaches arrears
          for o in eligible:
              raw = distributable_cents * o.current_support_cents / total_cs
              o.cs_alloc = round_half_up(raw)
          remainder = distributable_cents - sum(o.cs_alloc)
          # remainder (can be +/- 1..n cents) assigned to the order with the
          # GREATEST current_support_cents; tie-break created_at ASC.
          target = max(eligible, key=lambda o: (o.current_support_cents, -epoch(o.created_at)))
          target.cs_alloc += remainder
          each order: interest_alloc = 0, principal_alloc = 0
      else:
          # current support fully covered; surplus cascades to arrears
          for o in eligible: o.cs_alloc = o.current_support_due_cents (capped at current_support_cents)
          surplus = distributable_cents - sum(o.cs_alloc)
          # STAGE 2 — within each order (created_at ASC), apply the surplus per
          # the within-order waterfall below until surplus is exhausted.
          for o in eligible (created_at ASC):
              o.interest_alloc, o.principal_alloc, surplus = within_order_waterfall(o, surplus)
    input_set: "Only SupportOrders whose obligation_status IN {ACTIVE, MODIFIED}; SUSPENDED/ESTABLISHED/TERMINATED orders excluded from the candidate set."
    constants: {}
    precision: "per-order amounts round_half_up to whole cents; rounding remainder assigned to greatest current_support_cents order, tie-break created_at ASC (round-per-order-then-assign-remainder order is pinned)."
    variants:
      - name: shortfall_proration
        when: "distributable_cents <= total current support across eligible orders"
        difference: "every cent goes to current support, prorated; arrears untouched; rounding remainder lands on the largest-current-support order"
      - name: surplus_to_arrears
        when: "distributable_cents > total current support across eligible orders"
        difference: "current support satisfied first on all orders, then surplus flows into each order's arrears via the within-order waterfall"

  - name: within_order_waterfall
    trigger: "applied during multi_order_allocation (surplus branch) and during Disbursement return reversal"
    algorithm: waterfall_allocation
    formula: |
      # Pinned bucket order within a single order: CURRENT SUPPORT -> INTEREST -> PRINCIPAL.
      applied_current  = min(amount, current_support_due_cents)
      rem = amount - applied_current
      applied_interest = min(rem, interest_balance_cents)
      rem = rem - applied_interest
      applied_principal = min(rem, arrears_principal_cents)
      rem = rem - applied_principal          # rem > 0 => overpayment, held as unapplied credit
      return applied_interest, applied_principal, rem
    input_set: "Single SupportOrder's three computed balances at posting time."
    constants: {}
    precision: "whole cents; no rounding (integer subtraction)."
    variants:
      - name: clears_within_current
        when: "amount <= current_support_due_cents"
        difference: "interest and principal untouched"
      - name: reaches_arrears
        when: "amount > current_support_due_cents"
        difference: "interest consumed before principal; principal only after interest is zero"

  - name: arrears_interest_accrual
    trigger: "POST /support-orders/{id}/accrue-interest (and recomputed on terminate eligibility check)"
    algorithm: chronological
    formula: |
      days = floor( (as_of_clock - last_interest_accrual_at) / 1 day )   # whole days only
      accrued_cents = round_half_up( arrears_principal_cents * (interest_rate_bps / 10000) * days / 365 )
      # post an INTEREST LedgerEntry (bucket=INTEREST, +accrued_cents); advance last_interest_accrual_at by `days` days.
    input_set: "Simple interest on arrears_principal_cents only (not on accrued interest); whole-day count between last_interest_accrual_at and the clock."
    constants:
      DAYS_PER_YEAR: 365
      BPS_DENOMINATOR: 10000
    precision: "accrued_cents round_half_up to whole cents; day count floored (partial days do not accrue)."
    variants:
      - name: zero_days
        when: "as_of_clock is on the same calendar second-or-less than last_interest_accrual_at (days == 0)"
        difference: "accrued_cents == 0; no LedgerEntry posted; last_interest_accrual_at unchanged"
      - name: full_period
        when: "days >= 1"
        difference: "interest posts and last_interest_accrual_at advances by exactly `days` days (not to the clock, to preserve the fractional-day remainder)"

  - name: distribution_split
    trigger: "Disbursement creation (POST /disbursements) from an allocation slice"
    algorithm: waterfall_allocation
    formula: |
      # DUAL-VARIANT: how an order's collected arrears are split between the
      # custodial family and the state, keyed on arrears_distribution_rule.
      arrears_collected = allocation.interest_applied_cents + allocation.principal_applied_cents
      current_collected = allocation.current_support_applied_cents
      if order.arrears_distribution_rule == FAMILY_FIRST:
          state_retained_cents = 0
          family_amount_cents  = current_collected + arrears_collected
      else:  # STATE_FIRST
          state_retained_cents = min(arrears_collected, order.assigned_arrears_cents)
          family_amount_cents  = current_collected + (arrears_collected - state_retained_cents)
    input_set: "A single Allocation row's three applied buckets plus the order's distribution rule and assigned_arrears_cents."
    constants: {}
    precision: "whole cents; current support always passes through to the family regardless of variant."
    variants:
      - name: family_first
        when: "arrears_distribution_rule == FAMILY_FIRST (CustodialParty.assistance_status == NEVER_ASSISTED)"
        difference: "100% of arrears collection disbursed to family; state_retained_cents == 0"
      - name: state_first
        when: "arrears_distribution_rule == STATE_FIRST (CustodialParty.assistance_status IN {FORMERLY_ASSISTED, CURRENTLY_ASSISTED})"
        difference: "arrears collection retained by state up to assigned_arrears_cents; only the excess reaches the family — same inputs, different family_amount_cents"

  - name: arrears_distribution_rule_derivation
    trigger: "SupportOrder creation; recomputed when CustodialParty.assistance_status changes"
    algorithm: threshold
    formula: |
      if CustodialParty.assistance_status == NEVER_ASSISTED: arrears_distribution_rule = FAMILY_FIRST
      else: arrears_distribution_rule = STATE_FIRST
    input_set: "The linked CustodialParty.assistance_status."
    constants: {}
    precision: "n/a (enum derivation)."

  - name: arrears_rollover
    trigger: "POST /support-orders/{id}/post-charge, before the new period CHARGE is posted"
    algorithm: aggregation
    formula: |
      carry = current_support_due_cents   # unpaid balance currently in CURRENT_SUPPORT
      if carry > 0:
          post PAYMENT (bucket=CURRENT_SUPPORT, amount=-carry)   # clears the current bucket
          post CHARGE  (bucket=PRINCIPAL,       amount=+carry)   # moves it to arrears principal
      # then the new CURRENT_SUPPORT CHARGE of current_support_cents is posted
    input_set: "current_support_due_cents at the moment of the post-charge call."
    constants: {}
    precision: "whole cents; no rounding (integer carry)."

  - name: enforcement_certification_threshold
    trigger: "POST /enforcement-actions creation precondition; POST /enforcement-actions/{id}/certify snapshot"
    algorithm: threshold
    formula: |
      certifiable = arrears_principal_cents + interest_balance_cents
      eligible = certifiable >= ENFORCEMENT_CERT_THRESHOLD_CENTS   # boundary: == threshold IS eligible
    input_set: "The order's arrears_principal_cents + interest_balance_cents at propose time."
    constants:
      ENFORCEMENT_CERT_THRESHOLD_CENTS: 50000
    precision: "integer comparison; >= is inclusive at the boundary."

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and a recognized role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role is permitted to perform this operation per §1.7"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "All path/body referenced resources exist, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: business_referential
    check: "Body foreign keys reference compatible resources (e.g., Allocation.support_order_id belongs to the Remittance's noncustodial_party; Disbursement.allocation_id belongs to the named support_order_id)"
    error_id: ERR_FK_MISMATCH
    http_status: 422
    applies_to: "POST /support-orders, POST /income-withholding-orders, POST /remittances, POST /disbursements, POST /modifications, POST /enforcement-actions"

  - priority: 5
    category: business_constraint
    check: "Required body fields present and well-typed; cents fields are non-negative integers; enum members valid"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: all POST

  - priority: 6
    category: business_constraint
    check: "Employer.fein is unique across Employers"
    error_id: ERR_DUPLICATE_FEIN
    http_status: 409
    applies_to: "POST /employers"

  - priority: 7
    category: state
    check: "Target resource is in a valid state for the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: all transition endpoints

  - priority: 8
    category: business_constraint
    check: "OCC: expected_support_order_version matches current SupportOrder.version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /enforcement-actions, POST /modifications/{id}/apply"

  - priority: 9
    category: business_safety
    check: "Enforcement certification requires certified arrears (principal+interest) at/above the statutory threshold"
    error_id: ERR_BELOW_ENFORCEMENT_THRESHOLD
    http_status: 422
    applies_to: "POST /enforcement-actions"

  - priority: 10
    category: business_safety
    check: "A Disbursement may be SENT only when its CustodialParty.payee_status == ACTIVE"
    error_id: ERR_PAYEE_ON_HOLD
    http_status: 409
    applies_to: "POST /disbursements/{id}/send"

  - priority: 11
    category: business_temporal
    check: "Allocation requires at least one eligible (ACTIVE/MODIFIED) SupportOrder for the obligor at allocate time"
    error_id: ERR_NO_ALLOCABLE_ORDER
    http_status: 409
    applies_to: "POST /remittances/{id}/allocate"

  - priority: 12
    category: business_fiscal
    check: "Allocation requires distributable_cents > 0; remittance whose distributable amount is zero cannot be allocated"
    error_id: ERR_NOTHING_TO_ALLOCATE
    http_status: 409
    applies_to: "POST /remittances/{id}/allocate"

  - priority: 13
    category: business_fiscal
    check: "current_support_cents / proposed amounts / ordered_amount_cents must be > 0 where the operation requires a positive obligation"
    error_id: ERR_INVALID_AMOUNT
    http_status: 422
    applies_to: "POST /support-orders/{id}/activate, POST /modifications/{id}/submit, POST /income-withholding-orders"

  - priority: 14
    category: business_fiscal
    check: "An order may be TERMINATED only when arrears_principal_cents == 0 and interest_balance_cents == 0"
    error_id: ERR_ARREARS_OUTSTANDING
    http_status: 409
    applies_to: "POST /support-orders/{id}/terminate"

  - priority: 15
    category: business_constraint
    check: "An order may be TERMINATED only when enforcement_status is not INTERCEPT_PENDING/INTERCEPT_ACTIVE"
    error_id: ERR_ENFORCEMENT_ACTIVE
    http_status: 409
    applies_to: "POST /support-orders/{id}/terminate"

  - priority: 16
    category: state
    check: "A Modification may be APPROVED/APPLIED only when its linked SupportOrder.obligation_status == ACTIVE"
    error_id: ERR_ORDER_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /modifications/{id}/decide, POST /modifications/{id}/apply"

  - priority: 17
    category: business_constraint
    check: "Disbursement amount may not exceed the allocation slice's distributable family+state total (no over-disbursement of an allocation)"
    error_id: ERR_OVER_DISBURSEMENT
    http_status: 409
    applies_to: "POST /disbursements"

  - priority: 18
    category: business_temporal
    check: "A new IWO's half-open interval [effective_start_at, effective_end_at) must not overlap any non-TERMINATED IWO on the same support_order_id; adjacency (end == next start) is permitted"
    error_id: ERR_IWO_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /income-withholding-orders"

  - priority: 19
    category: business_temporal
    check: "A new Modification's closed interval [coverage_start_at, coverage_end_at] must not overlap any non-REJECTED Modification on the same support_order_id; touching at a boundary instant counts as overlap"
    error_id: ERR_MODIFICATION_PERIOD_OVERLAP
    http_status: 409
    applies_to: "POST /modifications"

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- CustodialParty ----
  - method: POST
    path: "/sdu/custodial-parties"
    description: "Register a custodial party (payee)"
    roles: [CaseWorker]
    code: 201
    input: [full_name, state_code, "assistance_status?"]
    output: CustodialParty
    side_effects: ["payee_status=ACTIVE"]

  - method: GET
    path: "/sdu/custodial-parties/{id}"
    description: "Get a custodial party"
    roles: [CaseWorker, FinanceOfficer, CustodialParty]
    code: 200
    input: []
    output: CustodialParty
    side_effects: []

  - method: POST
    path: "/sdu/custodial-parties/{id}/hold"
    description: "Place or release a payee hold"
    roles: [FinanceOfficer]
    code: 200
    input: [hold]
    output: CustodialParty
    side_effects: ["payee_status -> HOLD when hold=true, ACTIVE when hold=false"]

  # ---- NoncustodialParty ----
  - method: POST
    path: "/sdu/noncustodial-parties"
    description: "Register a noncustodial party (obligor)"
    roles: [CaseWorker]
    code: 201
    input: [full_name, ssn_last4, "supports_second_family?"]
    output: NoncustodialParty
    side_effects: ["total_current_support_cents initialized to 0"]

  - method: GET
    path: "/sdu/noncustodial-parties/{id}"
    description: "Get a noncustodial party with computed total_current_support_cents"
    roles: [CaseWorker, FinanceOfficer]
    code: 200
    input: []
    output: NoncustodialParty
    side_effects: []

  # ---- Employer ----
  - method: POST
    path: "/sdu/employers"
    description: "Register an employer"
    roles: [CaseWorker]
    code: 201
    input: [legal_name, fein, "remittance_method?"]
    output: Employer
    side_effects: []

  - method: GET
    path: "/sdu/employers/{id}"
    description: "Get an employer"
    roles: [CaseWorker, FinanceOfficer, Employer]
    code: 200
    input: []
    output: Employer
    side_effects: []

  # ---- SupportOrder ----
  - method: POST
    path: "/sdu/support-orders"
    description: "Create a support order"
    roles: [CaseWorker]
    code: 201
    input: [custodial_party_id, noncustodial_party_id, current_support_cents, "frequency?", "interest_rate_bps?", "assigned_arrears_cents?"]
    output: SupportOrder
    side_effects:
      - "obligation_status=ESTABLISHED, enforcement_status=NONE"
      - "arrears_distribution_rule derived from CustodialParty.assistance_status (arrears_distribution_rule_derivation)"

  - method: GET
    path: "/sdu/support-orders/{id}"
    description: "Get a support order with computed balances"
    roles: [CaseWorker, FinanceOfficer, CustodialParty]
    code: 200
    input: []
    output: SupportOrder
    side_effects: ["recompute current_support_due_cents, arrears_principal_cents, interest_balance_cents from ledger"]

  - method: GET
    path: "/sdu/support-orders"
    description: "List support orders, filterable by obligor or payee"
    roles: [CaseWorker, FinanceOfficer]
    code: 200
    input: ["noncustodial_party_id?", "custodial_party_id?", "limit?", "offset?"]
    output: SupportOrder[]
    side_effects: []

  - method: POST
    path: "/sdu/support-orders/{id}/activate"
    description: "Activate (or reactivate) a support order"
    roles: [CaseWorker]
    code: 200
    input: []
    output: SupportOrder
    side_effects:
      - "obligation_status -> ACTIVE"
      - "post first CURRENT_SUPPORT CHARGE LedgerEntry on first activation; set last_interest_accrual_at"
      - "increments SupportOrder.version by 1"

  - method: POST
    path: "/sdu/support-orders/{id}/suspend"
    description: "Suspend an active support order"
    roles: [CaseWorker]
    code: 200
    input: []
    output: SupportOrder
    side_effects: ["obligation_status -> SUSPENDED", "increments SupportOrder.version by 1"]

  - method: POST
    path: "/sdu/support-orders/{id}/terminate"
    description: "Terminate a support order"
    roles: [CaseWorker]
    code: 200
    input: []
    output: SupportOrder
    side_effects:
      - "obligation_status -> TERMINATED"
      - "cascade: ISSUED/ACKNOWLEDGED IWOs -> TERMINATED"
      - "increments SupportOrder.version by 1"

  - method: POST
    path: "/sdu/support-orders/{id}/accrue-interest"
    description: "Accrue simple interest on arrears principal up to the current clock"
    roles: [CaseWorker, FinanceOfficer]
    code: 200
    input: []
    output: SupportOrder
    side_effects:
      - "post INTEREST LedgerEntry (arrears_interest_accrual)"
      - "advance last_interest_accrual_at by whole days accrued"
      - "interest_balance_cents recomputed"

  - method: POST
    path: "/sdu/support-orders/{id}/post-charge"
    description: "Post a monthly current-support CHARGE to the ledger (period accrual)"
    roles: [CaseWorker]
    code: 200
    input: []
    output: SupportOrder
    side_effects:
      - "arrears_rollover: any unpaid balance currently in CURRENT_SUPPORT is moved to PRINCIPAL (PAYMENT bucket=CURRENT_SUPPORT of that amount + CHARGE bucket=PRINCIPAL of that amount) before the new period charges"
      - "post a fresh CURRENT_SUPPORT CHARGE LedgerEntry of current_support_cents (only when obligation_status IN {ACTIVE, MODIFIED})"
      - "current_support_due_cents and arrears_principal_cents recomputed"

  # ---- LedgerEntry (reverse-reachability for support_order_id) ----
  - method: GET
    path: "/sdu/ledger-entries"
    description: "List ledger entries for an order (audit trail), chronological"
    roles: [CaseWorker, FinanceOfficer]
    code: 200
    input: ["support_order_id?", "entry_type?", "limit?", "offset?"]
    output: LedgerEntry[]
    side_effects: []

  - method: GET
    path: "/sdu/ledger-entries/{id}"
    description: "Get a single ledger entry"
    roles: [CaseWorker, FinanceOfficer]
    code: 200
    input: []
    output: LedgerEntry
    side_effects: []

  # ---- IncomeWithholdingOrder ----
  - method: POST
    path: "/sdu/income-withholding-orders"
    description: "Issue an income withholding order to an employer for an order"
    roles: [CaseWorker]
    code: 201
    input: [support_order_id, employer_id, ordered_amount_cents, effective_start_at, effective_end_at]
    output: IncomeWithholdingOrder
    side_effects:
      - "status=ISSUED"
      - "reject if [effective_start_at, effective_end_at) overlaps any non-TERMINATED IWO on the same support_order_id (half-open; adjacency allowed)"

  - method: GET
    path: "/sdu/income-withholding-orders/{id}"
    description: "Get an income withholding order"
    roles: [CaseWorker, FinanceOfficer, Employer]
    code: 200
    input: []
    output: IncomeWithholdingOrder
    side_effects: []

  - method: GET
    path: "/sdu/income-withholding-orders"
    description: "List IWOs, filterable by order or employer"
    roles: [CaseWorker, FinanceOfficer, Employer]
    code: 200
    input: ["support_order_id?", "employer_id?", "limit?", "offset?"]
    output: IncomeWithholdingOrder[]
    side_effects: []

  - method: POST
    path: "/sdu/income-withholding-orders/{id}/acknowledge"
    description: "Employer acknowledges receipt of the IWO"
    roles: [Employer]
    code: 200
    input: []
    output: IncomeWithholdingOrder
    side_effects: ["status -> ACKNOWLEDGED"]

  - method: POST
    path: "/sdu/income-withholding-orders/{id}/terminate"
    description: "Terminate an IWO"
    roles: [CaseWorker]
    code: 200
    input: []
    output: IncomeWithholdingOrder
    side_effects: ["status -> TERMINATED"]

  # ---- Remittance ----
  - method: POST
    path: "/sdu/remittances"
    description: "Record an employer remittance for an employee; computes CCPA cap"
    roles: [Employer, FinanceOfficer]
    code: 201
    input: [employer_id, noncustodial_party_id, disposable_earnings_cents, gross_remitted_cents]
    output: Remittance
    side_effects:
      - "status=RECEIVED"
      - "compute ccpa_cap_cents and distributable_cents (ccpa_withholding_cap)"

  - method: GET
    path: "/sdu/remittances/{id}"
    description: "Get a remittance"
    roles: [CaseWorker, FinanceOfficer, Employer]
    code: 200
    input: []
    output: Remittance
    side_effects: []

  - method: GET
    path: "/sdu/remittances"
    description: "List remittances, filterable by employer or obligor"
    roles: [CaseWorker, FinanceOfficer, Employer]
    code: 200
    input: ["employer_id?", "noncustodial_party_id?", "limit?", "offset?"]
    output: Remittance[]
    side_effects: []

  - method: POST
    path: "/sdu/remittances/{id}/allocate"
    description: "Allocate a received remittance across the obligor's eligible orders"
    roles: [FinanceOfficer]
    code: 200
    input: []
    output: Remittance
    side_effects:
      - "multi_order_allocation: create one Allocation per eligible order (cascade)"
      - "post PAYMENT LedgerEntry rows per bucket (cascade)"
      - "recompute each target order's balances; may auto-SATISFY enforcement (transitive cascade)"
      - "status -> ALLOCATED"

  - method: POST
    path: "/sdu/remittances/{id}/return"
    description: "Return a received remittance to the employer without allocating"
    roles: [FinanceOfficer]
    code: 200
    input: []
    output: Remittance
    side_effects: ["status -> RETURNED"]

  # ---- Allocation (reverse-reachability for remittance_id, support_order_id) ----
  - method: GET
    path: "/sdu/allocations"
    description: "List allocations, filterable by remittance or order"
    roles: [CaseWorker, FinanceOfficer]
    code: 200
    input: ["remittance_id?", "support_order_id?", "limit?", "offset?"]
    output: Allocation[]
    side_effects: []

  - method: GET
    path: "/sdu/allocations/{id}"
    description: "Get a single allocation slice"
    roles: [CaseWorker, FinanceOfficer]
    code: 200
    input: []
    output: Allocation
    side_effects: []

  # ---- Disbursement ----
  - method: POST
    path: "/sdu/disbursements"
    description: "Create a pending disbursement from an allocation slice"
    roles: [FinanceOfficer]
    code: 201
    input: [support_order_id, custodial_party_id, allocation_id, "method?"]
    output: Disbursement
    side_effects:
      - "status=PENDING"
      - "compute family_amount_cents and state_retained_cents (distribution_split)"

  - method: GET
    path: "/sdu/disbursements/{id}"
    description: "Get a disbursement"
    roles: [CaseWorker, FinanceOfficer, CustodialParty]
    code: 200
    input: []
    output: Disbursement
    side_effects: []

  - method: GET
    path: "/sdu/disbursements"
    description: "List disbursements, filterable by order, payee, or allocation"
    roles: [CaseWorker, FinanceOfficer, CustodialParty]
    code: 200
    input: ["support_order_id?", "custodial_party_id?", "allocation_id?", "limit?", "offset?"]
    output: Disbursement[]
    side_effects: []

  - method: POST
    path: "/sdu/disbursements/{id}/send"
    description: "Send a pending disbursement to the payee"
    roles: [FinanceOfficer]
    code: 200
    input: []
    output: Disbursement
    side_effects:
      - "status -> SENT"
      - "post DISBURSEMENT LedgerEntry (amount = -family_amount_cents); net_disbursed_to_family_cents += family_amount_cents"
      - "increments Disbursement.version by 1"

  - method: POST
    path: "/sdu/disbursements/{id}/return"
    description: "Mark a sent disbursement as returned and post the compensating ledger entry"
    roles: [FinanceOfficer]
    code: 200
    input: []
    output: Disbursement
    side_effects:
      - "status -> RETURNED"
      - "post compensating ADJUSTMENT LedgerEntry (amount = +family_amount_cents); net_disbursed_to_family_cents -= family_amount_cents (back to pre-send value)"
      - "increments Disbursement.version by 1"

  # ---- Modification ----
  - method: POST
    path: "/sdu/modifications"
    description: "Open a modification draft for a support order"
    roles: [CaseWorker]
    code: 201
    input: [support_order_id, proposed_current_support_cents, coverage_start_at, coverage_end_at]
    output: Modification
    side_effects:
      - "status=DRAFT"
      - "reject if [coverage_start_at, coverage_end_at] overlaps any non-REJECTED Modification on the same support_order_id (closed interval; boundary instants DO collide)"

  - method: GET
    path: "/sdu/modifications/{id}"
    description: "Get a modification"
    roles: [CaseWorker, FinanceOfficer, Supervisor]
    code: 200
    input: []
    output: Modification
    side_effects: []

  - method: GET
    path: "/sdu/modifications"
    description: "List modifications, filterable by order"
    roles: [CaseWorker, FinanceOfficer, Supervisor]
    code: 200
    input: ["support_order_id?", "limit?", "offset?"]
    output: Modification[]
    side_effects: []

  - method: POST
    path: "/sdu/modifications/{id}/submit"
    description: "Submit a draft modification for review"
    roles: [CaseWorker]
    code: 200
    input: []
    output: Modification
    side_effects: ["status -> SUBMITTED"]

  - method: POST
    path: "/sdu/modifications/{id}/decide"
    description: "Supervisor approves or rejects a submitted modification"
    roles: [Supervisor]
    code: 200
    input: [decision]
    output: Modification
    side_effects: ["status -> APPROVED or REJECTED"]

  - method: POST
    path: "/sdu/modifications/{id}/revise"
    description: "Send a rejected modification back to draft"
    roles: [CaseWorker]
    code: 200
    input: []
    output: Modification
    side_effects: ["status -> DRAFT"]

  - method: POST
    path: "/sdu/modifications/{id}/apply"
    description: "Apply an approved modification to its support order (OCC-guarded)"
    roles: [CaseWorker]
    code: 200
    input: [expected_support_order_version]
    output: Modification
    side_effects:
      - "status -> APPLIED"
      - "SupportOrder.current_support_cents -> proposed_current_support_cents"
      - "SupportOrder.obligation_status ACTIVE -> MODIFIED (cross-entity)"
      - "NoncustodialParty.total_current_support_cents recomputed (transitive cascade)"
      - "increments SupportOrder.version by 1"

  # ---- EnforcementAction ----
  - method: POST
    path: "/sdu/enforcement-actions"
    description: "Propose an enforcement intercept on a delinquent order (OCC-guarded)"
    roles: [CaseWorker]
    code: 201
    input: [support_order_id, action_type, expected_support_order_version]
    output: EnforcementAction
    side_effects:
      - "status=PROPOSED"
      - "SupportOrder.enforcement_status NONE -> INTERCEPT_PENDING (cross-entity)"
      - "increments SupportOrder.version by 1"

  - method: GET
    path: "/sdu/enforcement-actions/{id}"
    description: "Get an enforcement action"
    roles: [CaseWorker, FinanceOfficer]
    code: 200
    input: []
    output: EnforcementAction
    side_effects: []

  - method: GET
    path: "/sdu/enforcement-actions"
    description: "List enforcement actions, filterable by order"
    roles: [CaseWorker, FinanceOfficer]
    code: 200
    input: ["support_order_id?", "limit?", "offset?"]
    output: EnforcementAction[]
    side_effects: []

  - method: POST
    path: "/sdu/enforcement-actions/{id}/certify"
    description: "Certify a proposed enforcement action (tax/license intercept)"
    roles: [CaseWorker]
    code: 200
    input: []
    output: EnforcementAction
    side_effects:
      - "certified_arrears_cents snapshot taken"
      - "status -> CERTIFIED"
      - "SupportOrder.enforcement_status INTERCEPT_PENDING -> INTERCEPT_ACTIVE (cross-entity)"

  - method: POST
    path: "/sdu/enforcement-actions/{id}/withdraw"
    description: "Withdraw a proposed enforcement action"
    roles: [CaseWorker]
    code: 200
    input: []
    output: EnforcementAction
    side_effects:
      - "status -> WITHDRAWN"
      - "SupportOrder.enforcement_status INTERCEPT_PENDING -> NONE (cross-entity)"

  # ---- Test-driving clock endpoint ----
  - method: POST
    path: "/sdu/_clock/set"
    description: "Set the server's current UTC clock (test-driving)"
    roles: [CaseWorker, FinanceOfficer]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["server clock advanced for interest accrual and date-stamped postings"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role header missing or unrecognized" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted for this operation" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing/malformed body field, bad enum, or negative cents" }
  - { id: ERR_FK_MISMATCH, http: 422, condition: "Body foreign key references an incompatible resource (e.g., allocation not on the named order, order not under the remittance's obligor)" }
  - { id: ERR_DUPLICATE_FEIN, http: 409, condition: "Employer.fein already exists" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource not in a valid state for the requested transition" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_support_order_version does not match current SupportOrder.version" }
  - { id: ERR_INVALID_AMOUNT, http: 422, condition: "current_support / proposed / ordered amount must be > 0 for this operation" }
  - { id: ERR_BELOW_ENFORCEMENT_THRESHOLD, http: 422, condition: "Certified arrears below the statutory enforcement threshold" }
  - { id: ERR_PAYEE_ON_HOLD, http: 409, condition: "CustodialParty.payee_status is HOLD; disbursement cannot be sent" }
  - { id: ERR_NO_ALLOCABLE_ORDER, http: 409, condition: "Obligor has no ACTIVE/MODIFIED support order to allocate against" }
  - { id: ERR_NOTHING_TO_ALLOCATE, http: 409, condition: "Remittance distributable_cents is 0" }
  - { id: ERR_ARREARS_OUTSTANDING, http: 409, condition: "Order cannot terminate while arrears principal or interest remain" }
  - { id: ERR_ENFORCEMENT_ACTIVE, http: 409, condition: "Order cannot terminate while an enforcement intercept is pending/active" }
  - { id: ERR_ORDER_NOT_ACTIVE, http: 409, condition: "Modification decide/apply requires the linked order to be ACTIVE" }
  - { id: ERR_OVER_DISBURSEMENT, http: 409, condition: "Disbursement would exceed the allocation slice's distributable total" }
  - { id: ERR_IWO_PERIOD_OVERLAP, http: 409, condition: "New IWO half-open interval overlaps an existing non-TERMINATED IWO on the same order" }
  - { id: ERR_MODIFICATION_PERIOD_OVERLAP, http: 409, condition: "New Modification closed interval overlaps an existing non-REJECTED Modification on the same order" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: CaseWorker
    description: "State child-support agency caseworker: establishes/activates/terminates orders, issues IWOs, opens & applies modifications, proposes/certifies enforcement, posts charges and interest."
    identity: opaque
    exclusive_operations:
      - "POST /custodial-parties — register payee"
      - "POST /noncustodial-parties — register obligor"
      - "POST /employers — register employer"
      - "POST /support-orders — create order"
      - "POST /support-orders/{id}/activate — activate/reactivate"
      - "POST /support-orders/{id}/suspend — suspend"
      - "POST /support-orders/{id}/terminate — terminate"
      - "POST /support-orders/{id}/post-charge — post monthly charge"
      - "POST /income-withholding-orders — issue IWO"
      - "POST /income-withholding-orders/{id}/terminate — terminate IWO"
      - "POST /modifications — open modification"
      - "POST /modifications/{id}/submit — submit"
      - "POST /modifications/{id}/revise — revise rejected"
      - "POST /modifications/{id}/apply — apply approved (OCC)"
      - "POST /enforcement-actions — propose intercept (OCC)"
      - "POST /enforcement-actions/{id}/certify — certify intercept"
      - "POST /enforcement-actions/{id}/withdraw — withdraw intercept"
    shared_operations:
      - "POST /support-orders/{id}/accrue-interest (with FinanceOfficer)"
      - "GET reads on orders, ledger, IWOs, remittances, allocations, disbursements, modifications, enforcement-actions"
      - "POST /_clock/set (with FinanceOfficer)"

  - name: FinanceOfficer
    description: "State Disbursement Unit finance officer: records/allocates/returns remittances, creates/sends/returns disbursements, manages payee holds, accrues interest."
    identity: opaque
    exclusive_operations:
      - "POST /custodial-parties/{id}/hold — place/release payee hold"
      - "POST /remittances/{id}/allocate — allocate remittance"
      - "POST /remittances/{id}/return — return remittance"
      - "POST /disbursements — create disbursement"
      - "POST /disbursements/{id}/send — send disbursement"
      - "POST /disbursements/{id}/return — return disbursement"
    shared_operations:
      - "POST /remittances — record remittance (with Employer)"
      - "POST /support-orders/{id}/accrue-interest (with CaseWorker)"
      - "GET reads on orders, ledger, IWOs, remittances, allocations, disbursements, modifications, enforcement-actions"
      - "POST /_clock/set (with CaseWorker)"

  - name: Supervisor
    description: "Agency supervisor who approves or rejects submitted modifications (segregated from the caseworker who submits)."
    identity: opaque
    exclusive_operations:
      - "POST /modifications/{id}/decide — approve/reject modification"
    shared_operations:
      - "GET reads on modifications"

  - name: Employer
    description: "Employer subject to income withholding; acknowledges IWOs and records remittances of withheld pay."
    identity: "entity_backed:Employer"
    exclusive_operations:
      - "POST /income-withholding-orders/{id}/acknowledge — acknowledge IWO"
    shared_operations:
      - "POST /remittances — record remittance (with FinanceOfficer)"
      - "GET own employer, own IWOs, own remittances"

  - name: CustodialParty
    description: "Custodial parent reading their own orders and disbursements."
    identity: "entity_backed:CustodialParty"
    exclusive_operations: []
    shared_operations:
      - "GET own custodial-party, own support-orders, own disbursements"
