            - { call: "POST /api/nominees", payload: { city_program_id: "${cp}", full_name: "Nom W", nominator_id: "${np}" }, as: ProgramAdmin, captures: { w: $.data.id } }
            - { call: "POST /api/nominees/${w}/decision", payload: { decision: "ADVANCE" }, as: SelectionOfficer }
            - { call: "POST /api/evaluations", payload: { nominee_id: "${w}", round_number: 1, leadership: 90, teamwork: 90, group_presence: 90 }, as: Assessor, as_user_id: "assessor-a" }
            - { call: "POST /api/evaluations", payload: { nominee_id: "${w}", round_number: 1, leadership: 90, teamwork: 90, group_presence: 90 }, as: Assessor, as_user_id: "assessor-b" }
