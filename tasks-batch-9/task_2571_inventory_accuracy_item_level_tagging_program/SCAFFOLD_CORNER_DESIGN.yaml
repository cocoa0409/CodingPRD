      - name: clock_endpoint_defaults_to_august_first_and_stamps_new_rows
        claim_type: standard_crud
        grounds:
          - endpoints.POST_clock_set_current_utc
        distinguishing_aspect: "The logical clock reads exactly 2026-08-01T00:00:00Z before any call, never wall-clock time, and setting it changes the instant that subsequent system timestamps are stamped from without mutating any existing row."
        test_recipe:
          setup:
            - "A pristine server with no clock call yet and one Category created before the clock is moved."
          setup_api_calls:
            - call: "POST /inventory-integrity/categories"
              payload: { code: "APPAREL", name: "Apparel", count_cadence_days: 30, variance_tolerance_units: 2, variance_tolerance_value_cents: 20000, min_accuracy_pct: 97.00 }
              as: SystemAdmin
              as_user_id: "u_admin_1"
              captures: { cat_apparel: "$.data.id" }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T12:00:00Z" }
              as: SystemAdmin
              as_user_id: "u_admin_1"
          assert:
            - "the setup category's created_at was 2026-08-01T00:00:00Z, the documented default of the logical clock"
            - "response status 200 and data.current_utc == \"2026-09-15T12:00:00Z\""
            - "GET /inventory-integrity/categories/${cat_apparel} still reads created_at 2026-08-01T00:00:00Z and updated_at unchanged — the clock call mutates no entity"
            - "a Store created after the trigger is stamped created_at 2026-09-15T12:00:00Z"
            - "POST /_clock/set_current_utc with to_iso8601 \"not-a-timestamp\" returns 422 ERR_INVALID_REQUEST"

