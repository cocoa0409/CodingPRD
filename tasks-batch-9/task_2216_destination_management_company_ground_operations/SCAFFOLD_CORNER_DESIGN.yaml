      - name: reconcile_program_with_no_reconcilable_elements_rejected
        claim_type: triggerable
        grounds: ["validations[priority=40]", "errors[ERR_NO_RECONCILABLE_ELEMENTS]"]
        distinguishing_aspect: "A CANCELLED program is execution-final, so priority 11 passes, but it holds no element in DELIVERED or CANCELLED; reconcile therefore hits the empty-set edge with HTTP 422 ERR_NO_RECONCILABLE_ELEMENTS and settlement_status stays NOT_STARTED."
        test_recipe:
          setup: ["Logical clock 2026-08-01T00:00:00Z; one DRAFT Program with zero elements, then CANCELLED."]
          setup_api_calls:
            - call: "POST /dmc/programs"
              payload: { client_name: "Empty Reconcile Client", group_name: "Empty Reconcile Group", arrival_date: "2026-09-10", departure_date: "2026-09-14", guaranteed_count: 20, markup_pct: 0.18 }
              as: ProgramDirector
              captures: { prog_id: $.data.id }
            - call: "POST /dmc/programs/${prog_id}/cancel"
              payload: { cancel_reason: "Client never signed." }
              as: ProgramDirector
          trigger:
            - call: "POST /dmc/programs/${prog_id}/reconcile"
              payload: {}
              as: ProgramDirector
              captures: { err: $.data.error_id }
          assert:
            - "trigger returns HTTP 422"
            - "${err} == ERR_NO_RECONCILABLE_ELEMENTS"
            - "${err} != ERR_PROGRAM_NOT_EXECUTION_FINAL"
            - "Program.${prog_id}.settlement_status == NOT_STARTED"
            - "Program.${prog_id}.element_count == 0"
            - "GET /dmc/reconciliation-lines?program_id=${prog_id}&limit=10&offset=0 returns total_count == 0"

