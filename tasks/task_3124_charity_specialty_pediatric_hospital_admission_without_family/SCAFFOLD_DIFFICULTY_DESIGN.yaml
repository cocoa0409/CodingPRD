          (hop 2) -> recomputed funding_status FULLY_FUNDED unblocks discharge
          eligibility (hop 3, gated by ERR_PLAN_FUNDING_UNRESOLVED). Each hop is caused
          by the previous mutation, not by the original decide call. Distinct trigger
          from the sibling cascade (hospital suspend).
