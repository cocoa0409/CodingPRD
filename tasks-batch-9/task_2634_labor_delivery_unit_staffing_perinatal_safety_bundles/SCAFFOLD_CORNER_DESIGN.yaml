      - name: a_second_check_out_on_an_already_checked_out_pass_is_rejected_rather_than_absorbed
        claim_type: Idempotency
        grounds:
          - state_machines.SupportPersonPass.CHECKED_IN_to_CHECKED_OUT
          - endpoints[POST /support-person-passes/{passId}/check-out]
          - validations[priority=8]
          - errors[ERR_INVALID_STATE_TRANSITION]
          - entities.SupportPersonPass.fields.checked_out_at
          - entities.SupportPersonPass.fields.reentry_count
        distinguishing_aspect: |
          /check-out is declared only on CHECKED_IN -> CHECKED_OUT and §1.5 records it as having NO
          preconditions, which makes it the most tempting endpoint in the scaffold to implement
          idempotently. It is not: replaying it from CHECKED_OUT must return
          ERR_INVALID_STATE_TRANSITION (409) rather than a second 200. The pass must keep its
          original checked_out_at instant (06:00, not overwritten with 06:30) and its reentry_count
          must still be 0, since reentry_count only increments on a check-in that ENTERS from
          CHECKED_OUT.
        test_recipe:
          setup: |
            Clock at 2026-08-01T06:00:00Z. One unit with one AVAILABLE LDR bed (so posture is not
            DIVERT and the admission passes 8.02) and one ANTEPARTUM encounter with no
            CareAssignments, hence zero staff in the room. A PARTNER pass is issued (valid_until
            06:00 + PASS_VALID_HOURS 24 = 2026-08-02T06:00:00Z), checked in — occupancy allowance is
            at least 1 with zero passes currently checked in, so the inclusive priority-15 room test
            passes — and then checked out at 06:00. The clock is moved to 06:30 before the replay so
            an overwritten checked_out_at is visible.
          setup_api_calls:
            - call: POST /_clock/set_current_utc
              payload: { current_utc: "2026-08-01T06:00:00Z" }
              as: PerinatalSafetyOfficer
              as_user_id: "safety-officer-bootstrap"
