  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: ci_batch_reserve_terminate_release
        grounds:
          - calculations.batch_derived_status (case-accounting invariant)
          - state_machines.GrowthProgram.ANY_NONTERMINAL_to_TERMINATED
        distinguishing_aspect: "Conserved quantity = batch case accounting: quantity_cases == available_cases + reserved_cases + written_off_cases holds across reserve (forward) and program-terminate release (compensating) — 10 == 6+4+0 after reserve, 10 == 10+0+0 after the release cascade."
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z. Non-dedicated FOODSERVICE batch of 10 cases for product PROD-CI-1. LTO program PROG-CI-1 (partner CHAIN-CI, product PROD-CI-1) in ACTIVE status."
          setup_api_calls:
            - *c_clock
            - call: "POST /protein-ops/suppliers"
              payload: { supplier_code: "SUP-CI-1", isolate_type: "PEA", committed_volume_kg: 10000, base_price_per_kg_cents: 500, price_floor_cents: 400, price_cap_cents: 540, agreement_start_date: "2026-08-01T00:00:00Z", agreement_end_date: "2027-08-01T00:00:00Z" }
              as: ProcurementManager
              captures: { sup_id: $.data.id }
            - *c_sup_qualify
            - *c_sup_activate
            - call: "POST /protein-ops/ingredient-lots"
              payload: { supplier_id: "${sup_id}", lot_code: "LOT-CI-1", quantity_kg: 500, received_at: "2026-09-01T00:00:00Z", market_index_pct: 0.0, moisture_pct: 6.5, protein_content_pct: 82.0 }
              as: ProcurementManager
              captures: { lot_id: $.data.id }
            - call: "POST /protein-ops/ingredient-lots/${lot_id}/qc-decision"
              payload: { decision: "RELEASED", invoiced_unit_cost_cents: 500, actual_freight_cents_per_kg: 35 }
              as: QualityManager
            - call: "POST /protein-ops/production-lines"
              payload: { line_code: "LINE-CI-1", site_type: "OWNED", hourly_capacity_kg: 250, supported_isolate_types: ["PEA"] }
              as: PlantManager
              captures: { line_id: $.data.id, line_v: $.data.version }
            - call: "POST /protein-ops/products"
              payload: { product_code: "PROD-CI-1", generation_number: 1, isolate_type: "PEA" }
              as: ProductManager
              captures: { prod_id: $.data.id, prod_v: $.data.version }
            - call: "POST /protein-ops/products/${prod_id}/label-versions"
              payload: { version_number: 1, protein_g: 22, fat_g: 5, sodium_mg: 320, claims: ["HIGH_PROTEIN"], ingredient_statement: "Water, pea protein isolate" }
              as: ProductManager
              captures: { lbl_id: $.data.id }
            - call: "POST /protein-ops/label-versions/${lbl_id}/transitions"
              payload: { target_status: "SUBMITTED" }
              as: ProductManager
            - call: "POST /protein-ops/label-versions/${lbl_id}/transitions"
              payload: { target_status: "APPROVED", expected_product_version: "${prod_v}" }
              as: ProductManager
            - call: "POST /protein-ops/products/${prod_id}/lifecycle-transitions"
              payload: { target_state: "PILOT" }
              as: ProductManager
            - call: "POST /protein-ops/products/${prod_id}/lifecycle-transitions"
              payload: { target_state: "ACTIVE" }
              as: ProductManager
            - call: "POST /protein-ops/production-runs"
              payload: { production_line_id: "${line_id}", product_id: "${prod_id}", label_version_id: "${lbl_id}", channel: "FOODSERVICE", planned_quantity_kg: 100, scheduled_start: "2026-09-05T08:00:00Z", scheduled_end: "2026-09-05T12:00:00Z", expected_line_version: "${line_v}" }
              as: PlantManager
              captures: { run_id: $.data.id }
            - call: "POST /protein-ops/production-runs/${run_id}/transitions"
              payload: { target_status: "IN_PROGRESS" }
              as: PlantManager
            - call: "POST /protein-ops/production-runs/${run_id}/transitions"
              payload: { target_status: "COMPLETED", actual_quantity_kg: 100 }
              as: PlantManager
            - call: "GET /protein-ops/finished-goods-batches"
              payload: { production_run_id: "${run_id}" }
              as: ChannelManager
              captures: { batch_id: "$.data[0].id" }
            - call: "POST /protein-ops/programs"
              payload: { program_code: "PROG-CI-1", program_type: "FOODSERVICE_LTO", partner_code: "CHAIN-CI", product_id: "${prod_id}", window_start: "2026-09-01T00:00:00Z", window_end: "2026-10-31T23:59:59Z", committed_cases: 5, dedicated_run_required: true }
              as: ChannelManager
              captures: { prog_id: $.data.id }
            - call: "POST /protein-ops/programs/${prog_id}/lifecycle"
              payload: { target_status: "ACTIVE" }
              as: ChannelManager
          trigger:
            - call: "POST /protein-ops/finished-goods-batches/${batch_id}/reserve"
              payload: { program_id: "${prog_id}", quantity_cases: 4 }
              as: ChannelManager
            - call: "POST /protein-ops/finished-goods-batches/${batch_id}/reserve"
              payload: { program_id: "${prog_id}", quantity_cases: 6 }
              as: ChannelManager
            - call: "POST /protein-ops/programs/${prog_id}/lifecycle"
              payload: { target_status: "TERMINATED" }
              as: ChannelManager
          assert:
            - "after reserve 4: available_cases == 6, reserved_cases == 4, written_off_cases == 0 (6+4+0 == quantity_cases 10)"
            - "after reserve 6 more: available_cases == 0, reserved_cases == 10 (0+10+0 == 10; boundary: quantity == available is allowed)"
            - "after TERMINATED: available_cases == 10, reserved_cases == 0, reserved_for_program_id is null (10+0+0 == 10 — forward plus compensating action conserve the total)"
            - "FinishedGoodsBatch.${batch_id}.derived_status == AVAILABLE again"

      - name: ci_line_capacity_create_abort
        grounds:
          - entities.ProductionLine.fields.reserved_capacity_kg
          - state_machines.ProductionRun.SCHEDULED_to_ABORTED
          - concurrency_rules[run-create-stale-line]
        distinguishing_aspect: "Conserved quantity = line reserved capacity (different quantity from batch cases): creating a run reserves 500 kg and aborting it releases exactly 500 kg, so reserved_capacity_kg returns to 0 — forward and compensating actions leave the line ledger unchanged."
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z. OWNED line LINE-CI-2 CERTIFIED, reserved_capacity_kg 0; product PROD-CI-2 ACTIVE with APPROVED label."
          setup_api_calls:
            - *c_clock
            - call: "POST /protein-ops/production-lines"
              payload: { line_code: "LINE-CI-2", site_type: "OWNED", hourly_capacity_kg: 250, supported_isolate_types: ["PEA"] }
              as: PlantManager
              captures: { line_id: $.data.id, line_v0: $.data.version }
            - call: "POST /protein-ops/products"
              payload: { product_code: "PROD-CI-2", generation_number: 1, isolate_type: "PEA" }
              as: ProductManager
              captures: { prod_id: $.data.id, prod_v: $.data.version }
            - call: "POST /protein-ops/products/${prod_id}/label-versions"
              payload: { version_number: 1, protein_g: 22, fat_g: 5, sodium_mg: 320, claims: ["HIGH_PROTEIN"], ingredient_statement: "Water, pea protein isolate" }
              as: ProductManager
              captures: { lbl_id: $.data.id }
            - call: "POST /protein-ops/label-versions/${lbl_id}/transitions"
              payload: { target_status: "SUBMITTED" }
              as: ProductManager
            - call: "POST /protein-ops/label-versions/${lbl_id}/transitions"
              payload: { target_status: "APPROVED", expected_product_version: "${prod_v}" }
              as: ProductManager
            - call: "POST /protein-ops/products/${prod_id}/lifecycle-transitions"
              payload: { target_state: "PILOT" }
              as: ProductManager
            - call: "POST /protein-ops/products/${prod_id}/lifecycle-transitions"
              payload: { target_state: "ACTIVE" }
              as: ProductManager
          trigger:
            - call: "POST /protein-ops/production-runs"
              payload: { production_line_id: "${line_id}", product_id: "${prod_id}", label_version_id: "${lbl_id}", channel: "RETAIL_FROZEN", planned_quantity_kg: 500, scheduled_start: "2026-09-12T08:00:00Z", scheduled_end: "2026-09-12T12:00:00Z", expected_line_version: "${line_v0}" }
              as: PlantManager
              captures: { run_id: $.data.id }
            - call: "GET /protein-ops/production-lines"
              payload: {}
              as: PlantManager
              captures: { reserved_after_create: "$.data[0].reserved_capacity_kg" }
            - call: "POST /protein-ops/production-runs/${run_id}/transitions"
              payload: { target_status: "ABORTED" }
              as: PlantManager
            - call: "GET /protein-ops/production-lines"
              payload: {}
              as: PlantManager
              captures: { reserved_after_abort: "$.data[0].reserved_capacity_kg" }
          assert:
            - "after create: ProductionLine.${line_id}.reserved_capacity_kg == 500 (forward action)"
            - "after abort: ProductionLine.${line_id}.reserved_capacity_kg == 0 (compensating release; invariant reserved == sum of planned kg over SCHEDULED/IN_PROGRESS runs)"
            - "ProductionRun.${run_id}.status == ABORTED and ProductionLine.${line_id}.operational_status == IDLE (abort from SCHEDULED does not disturb operations)"
