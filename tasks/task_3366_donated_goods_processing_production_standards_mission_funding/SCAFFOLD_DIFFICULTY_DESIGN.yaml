              as: MemberAdmin
              as_user_id: "${org_id}"
          trigger:
            - call: "POST /donated-goods/disposal-tickets"
              payload: { member_org_id: "${org_id}", material: "MIXED_UNSALABLE", weight_lbs: 1 }
              as: MemberAdmin
