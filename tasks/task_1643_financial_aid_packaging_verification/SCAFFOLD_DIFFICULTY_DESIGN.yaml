  # =====================================================================
  # Rule 8 — resource_temporal_overlap: the domain's "interval" analogs are
  # (a) same-student same-aid-year uniqueness windows (AwardPackage per
  # (student_id, aid_year_id) — point-in-window occupation, half-open
  # uniqueness) and (b) priority-deadline cohort assignment (closed-interval
  # boundary received_at <= priority_deadline). These differ in interval
  # semantics (uniqueness occupation vs closed-boundary classification) and
  # resource entities (AwardPackage vs ISIRRecord).
  # =====================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: duplicate_package_same_aid_year_window_conflict
        grounds:
          - validations[priority=11]
          - errors[ERR_DUPLICATE]
          - entities.AwardPackage.fields.aid_year_id
        distinguishing_aspect: |
          Interval-semantics 1 (uniqueness occupation on the (student, aid-year)
          window): a second AwardPackage for the same (student_id, aid_year_id)
          is rejected with ERR_DUPLICATE even though a package for the same
          student in a DIFFERENT aid year succeeds — the occupation is scoped
          to the year window, not the student.
        test_recipe:
          setup:
            - "Two aid years 2026-2027 and 2027-2028 both created (2027-2028 left in DRAFT); Student S with current ISIR in 2026-2027; package P1 exists for (S, 2026-2027)"
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: AidDirector
            - call: "POST /api/aid-years"
              payload:
                year_code: "2026-2027"
                coa_in_state_cents: 2400000
                coa_out_of_state_cents: 3600000
                priority_deadline: "2026-03-01T00:00:00Z"
                pell_schedule:
                  - { efc_min: 0, efc_max: 150000, award_cents: 739500 }
                  - { efc_min: 150001, efc_max: 300000, award_cents: 500000 }
                  - { efc_min: 300001, efc_max: 500000, award_cents: 250000 }
                  - { efc_min: 500001, efc_max: 99999900, award_cents: 0 }
                verification_tracking_flag_rate: 0.50
              as: AidDirector
              captures: { ay1: "$.data.id" }
            - call: "POST /api/aid-years"
              payload:
                year_code: "2027-2028"
                coa_in_state_cents: 2500000
                coa_out_of_state_cents: 3700000
                priority_deadline: "2027-03-01T00:00:00Z"
                pell_schedule:
                  - { efc_min: 0, efc_max: 150000, award_cents: 739500 }
                  - { efc_min: 150001, efc_max: 300000, award_cents: 500000 }
                  - { efc_min: 300001, efc_max: 500000, award_cents: 250000 }
                  - { efc_min: 500001, efc_max: 99999900, award_cents: 0 }
                verification_tracking_flag_rate: 0.50
              as: AidDirector
