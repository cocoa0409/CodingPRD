            - call: "POST /vehicles"
              payload: { fleet_id: "${fleet_id}", plan_id: "${plan_id}", vin: "CI2-2", model_label: "XC40", odometer_miles: 0 }
              as: FleetOperator
              captures: { v2: $.data.id }
            - call: "POST /applicants"
              payload: { full_name: "A", email: "ci2@x.com", credit_score: 720, monthly_income_cents: 480000, history_flag: "CLEAN" }
              as: Member
              captures: { appl_id: $.data.id }
            - call: "POST /applicants/${appl_id}/decide-eligibility"
              payload: { plan_id: "${plan_id}" }
              as: BillingAdmin
            - call: "POST /subscriptions"
              payload: { applicant_id: "${appl_id}", plan_id: "${plan_id}" }
              as: Member
              as_user_id: "${appl_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /subscriptions/${sub_id}/assign-vehicle"
              payload: { vehicle_id: "${v1}", expected_vehicle_version: "${v1_v0}" }
              as: FleetOperator
            - call: "POST /couriers"
              payload: { name: "C", fleet_id: "${fleet_id}" }
              as: FleetOperator
              captures: { cr: $.data.id }
            - call: "POST /delivery-slots"
              payload: { courier_id: "${cr}", subscription_id: "${sub_id}", kind: "DELIVERY", window_start_iso: "2026-04-01T09:00:00Z", window_end_iso: "2026-04-01T10:00:00Z" }
              as: FleetOperator
            - call: "POST /subscriptions/${sub_id}/activate"
              payload: {}
              as: FleetOperator
            - call: "GET /fleets/${fleet_id}"
              payload: {}
              as: FleetOperator
              captures: { in_use_before: $.data.in_use_count }
            - call: "POST /subscriptions/${sub_id}/swap-requests"
              payload: { to_vehicle_id: "${v2}" }
              as: Member
              as_user_id: "${appl_id}"
              captures: { sw: $.data.id }
            - call: "GET /vehicles/${v2}"
              payload: {}
              as: FleetOperator
              captures: { v2_v: $.data.version }
            - call: "POST /swap-requests/${sw}/approve"
              payload: { expected_vehicle_version: "${v2_v}" }
              as: FleetOperator
            - call: "GET /fleets/${fleet_id}"
              payload: {}
              as: FleetOperator
              captures: { in_use_after_approve: $.data.in_use_count }
          trigger:
            - call: "POST /swap-requests/${sw}/reject"
              payload: {}
              as: FleetOperator
            - call: "GET /fleets/${fleet_id}"
              payload: {}
              as: FleetOperator
              captures: { in_use_after_reject: $.data.in_use_count }
          assert:
            - "in_use_count before approve == 1; after approve == 2; after reject == 1 (compensation restores exactly, no drift)"
            - "Vehicle.${v2}.status == AVAILABLE again after reject; active_subscription_id == null"
            - "SwapRequest.${sw}.status == REJECTED"
