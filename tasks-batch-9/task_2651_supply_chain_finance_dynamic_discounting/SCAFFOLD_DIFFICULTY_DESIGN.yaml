  - rule_id: cross_entity_state_dependency
    instances:
      - name: paused_funder_makes_the_waterfall_report_no_eligible_funder
        grounds:
          - state_machines.Funder.ACTIVE_to_PAUSED
          - state_machines.Funder.PAUSED_to_ACTIVE
          - calculations.funder_selection
          - calculations.funding_source_resolution
          - validations[priority=27]
          - errors.ERR_NO_ELIGIBLE_FUNDER
        distinguishing_aspect: |
          Entity pair (EarlyPayment, Funder): whether POST /early-payments can create a row at all
          depends on the state of a Funder the request never names. The programme is
          SELF_THEN_FUNDER and the buyer's headroom is deliberately too small, so pausing the only
          funder empties the eligibility pool and the waterfall must report the error belonging to
          the LAST candidate - ERR_NO_ELIGIBLE_FUNDER (422) - rather than the credit error of the
          first candidate. Resuming the funder makes the identical request succeed on FUNDER.
        test_recipe:
          setup:
            - "Buyer with credit_limit_cents 1000 and self_funding_enabled true"
            - "SELF_THEN_FUNDER programme OPEN; LIVE session; onboarded supplier"
            - "One ACTIVE funder: min_apr_bps 500, fee_spread_bps 0, max_single_invoice_cents 5000000, capital_limit 60000000, tranche 60000000 over 2026-08-01..2026-12-31"
            - "Invoice of face 1000000, net_due_date 2026-09-04; offer at 900 bps ACCEPTED at clock 2026-08-02"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformOps
            - call: "POST /buyers"
              payload: { legal_name: "Waterfall Fallback Buyer", tax_id: "145556667", credit_limit_cents: 1000, self_funding_enabled: true }
              as: PlatformOps
