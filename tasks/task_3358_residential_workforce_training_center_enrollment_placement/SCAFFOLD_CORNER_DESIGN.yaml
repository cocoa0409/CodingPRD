            - { call: "POST /jc/trade-programs", payload: { center_id: "${cb}", trade_code: "CARPENTRY", capacity: 3 }, as: OperatorAdmin, captures: { pb: $.data.id } }
            - { call: "POST /jc/applicants", payload: { full_name: "Mis Stu", date_of_birth: "2002-03-10", home_region_code: "R-NORTH", desired_trade_code: "WELDING" }, as: AdmissionsCounselor, captures: { a1: $.data.id, a1_v: $.data.version } }
