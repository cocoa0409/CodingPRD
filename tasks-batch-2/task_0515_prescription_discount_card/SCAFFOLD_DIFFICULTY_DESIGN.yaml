              as: PlatformAdmin
            - call: "POST /price-quotes"
              payload: { drug_id: "${drug_id}", pharmacy_id: "${ph2_id}", cash_price_cents: 9000, discount_price_cents: 8000, gold_price_cents: 7000, effective_at: "2026-05-01T00:00:00Z", expires_at: "2027-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /members"
