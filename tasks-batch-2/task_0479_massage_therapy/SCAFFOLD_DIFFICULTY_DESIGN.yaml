              as: FrontDesk
              captures: { cli: $.data.id }
            - call: "POST /practice/intakes"
              payload: { client_id: "${cli}", expires_at: "2026-12-31T00:00:00Z" }
              as: FrontDesk
              captures: { itk: $.data.id }
            - call: "POST /practice/intakes/${itk}/sign"
              payload: {}
              as: FrontDesk
            - call: "POST /practice/consent-records"
              payload: { client_id: "${cli}", draping_policy: "FULL_DRAPE" }
              as: FrontDesk
              captures: { con: $.data.id }
            - call: "POST /practice/plans"
              payload: { name: "Plan1C", monthly_fee_cents: 9000, included_sessions: 1, member_discount_pct: 0.20, rollover_cap_sessions: 1 }
              as: PracticeAdmin
              captures: { plan: $.data.id }
            - call: "POST /practice/packages"
              payload: { client_id: "${cli}", plan_id: "${plan}", cycle_anchor_day: 1 }
              as: FrontDesk
              captures: { pkg: $.data.id }
            - call: "POST /practice/appointments"
              payload: { client_id: "${cli}", therapist_id: "${t1}", table_id: "${tbl}", modality_id: "${mod_sw}", consent_id: "${con}", package_id: "${pkg}", start_at: "2026-03-02T09:00:00Z", duration_minutes: 60, payer: "MEMBERSHIP", expected_table_version: "${tbl_v}" }
              as: FrontDesk
              captures: { ap: $.data.id }
            - call: "POST /practice/soap-notes"
              payload: { appointment_id: "${ap}", subjective: "s", objective: "o", assessment: "a", plan: "p" }
              as: Therapist
              as_user_id: "${t1}"
              captures: { sn: $.data.id }
            - call: "POST /practice/appointments/${ap}/check-in"
              payload: {}
              as: FrontDesk
            - call: "POST /practice/soap-notes/${sn}/finalize"
              payload: {}
              as: Therapist
              as_user_id: "${t1}"
            - call: "POST /practice/appointments/${ap}/complete"
              payload: {}
              as: Therapist
              as_user_id: "${t1}"
            - call: "POST /practice/appointments/${ap}/price"
              payload: {}
              as: FrontDesk
          trigger:
            - call: "POST /practice/appointments/${ap}/void"
              payload: {}
              as: PracticeAdmin
          assert:
            - "Package.${pkg}.credit_balance_sessions == 1"
            - "Appointment.${ap}.settlement_status == VOID"
            - "latest CreditLedgerEntry for Package.${pkg} has balance_after == 1"
