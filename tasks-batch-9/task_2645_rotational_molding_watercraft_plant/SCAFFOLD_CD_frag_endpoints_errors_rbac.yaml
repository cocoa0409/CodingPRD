            - *cd2_start
            - *cd2_clk1000
            - *cd2_cool
            - *cd2_clk1035
            - *cd2_demold
            - *cd2_disc
            - *cd2_trim1
            - *cd2_out1
            - *cd2_insp1
            - *cd2_trim2
            - *cd2_out2
            - *cd2_insp2
            - *cd2_whv1
            - *cd2_store1
            - *cd2_whv2
            - *cd2_store2
            - &cd2_cust
              call: "POST /customers"
              payload: { customer_code: "CUS-CD-1", email: "dealer.cd1@example.com", region_code: "Z2" }
              as: LogisticsPlanner
