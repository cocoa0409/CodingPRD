      - name: assessment_review_and_collection_dimensions_advance_independently
        grounds:
          - state_machines.LiabilityAssessment.NONE_to_REQUESTED
          - state_machines.LiabilityAssessment.REQUESTED_to_DECIDED
          - state_machines.LiabilityAssessment.NOT_YET_DUE_to_CURRENT
          - entities.LiabilityAssessment.fields.review_status
          - entities.LiabilityAssessment.fields.collection_status
          - calculations.collection_status_projection
        distinguishing_aspect: |
          On the LiabilityAssessment entity, review_status and collection_status are parallel
          dimensions on one row: filing and deciding a request for review drives review_status
          NONE -> REQUESTED -> DECIDED while collection_status stays CURRENT and
          outstanding_liability_cents stays 241071429, proving the statute's pay-during-dispute rule.
