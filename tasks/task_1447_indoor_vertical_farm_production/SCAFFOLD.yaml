  - LaborPlanner
  - Worker
  code: 200
  input:
  - limit?
  - offset?
  output: GrowBatch[]
  side_effects: []
errors:
- id: ERR_MISSING_CONTEXT_HEADER
  http: 400
  condition: X-User-ID or X-User-Role header missing or role not declared
- id: ERR_FORBIDDEN_ROLE
  http: 403
  condition: Role not permitted for this endpoint
- id: ERR_SEGREGATION_OF_DUTIES
  http: 403
  condition: Same user performed a prior controlled step (harvested the batch, recorded the parent sanitation result) or Worker confirming another worker's assignment
- id: ERR_NOT_FOUND
  http: 404
  condition: Path id or body FK reference does not exist
- id: ERR_INVALID_REQUEST
  http: 400
  condition: Malformed body, missing required field, invalid enum value, negative quantity, or unknown field
- id: ERR_INVALID_STATE_TRANSITION
  http: 409
  condition: Target resource lifecycle does not permit the requested transition
- id: ERR_STALE_VERSION
  http: 412
  condition: expected_<parent>_version does not match the parent's current version (OCC)
- id: ERR_RACK_NOT_OPERATING
  http: 409
  condition: A referenced rack is SANITATION_HOLD or OUT_OF_SERVICE where OPERATING is required
- id: ERR_WATER_LOOP_SANITATION_HOLD
  http: 409
  condition: The water loop is SANITATION_IN_PROGRESS or SANITATION_HOLD where service is required (e.g., rack return-to-service)
- id: ERR_CONTRACT_NOT_ACTIVE
  http: 409
  condition: Contract is SUSPENDED, TERMINATED, or COMPLETED where ACTIVE is required
- id: ERR_SHIFT_NOT_PUBLISHED
  http: 409
  condition: Labor shift is not PUBLISHED (assignment creation requires PUBLISHED)
- id: ERR_BATCH_SAFETY_PENDING
  http: 422
  condition: Batch safety_status is PENDING where RELEASED is required
- id: ERR_BATCH_QUARANTINED
  http: 422
  condition: Batch safety_status is QUARANTINED under a sanitation hold
- id: ERR_BATCH_CONDEMNED
  http: 422
  condition: Batch safety_status is CONDEMNED; pounds may never ship
- id: ERR_SAME_DAY_PACK_VIOLATION
  http: 422
  condition: Pack attempted on a different UTC date than harvested_at
- id: ERR_SANITATION_RECENCY_MISSING
  http: 422
  condition: No PASSED sanitation cycle on the batch's loop within FOOD_SAFETY_RECENCY_HOURS (72h) of pack time
- id: ERR_HARVEST_NOT_DUE
  http: 422
  condition: mark-harvest-ready attempted before projected_harvest_at - 48h
- id: ERR_CYCLE_NOT_DUE
  http: 422
  condition: Sanitation start attempted more than 30 minutes before scheduled_start_at
- id: ERR_TOWER_INTERVAL_OVERLAP
  http: 422
  condition: Requested tower has an ACTIVE allocation whose half-open interval overlaps the requested interval (adjacency allowed)
- id: ERR_SANITATION_OVERLAP
  http: 422
  condition: Cycle window overlaps (closed interval) another SCHEDULED/IN_PROGRESS cycle on the same loop or violates the 4h buffer
- id: ERR_CYCLE_DURATION_INVALID
  http: 422
  condition: Cycle window shorter than 2h or longer than 12h
- id: ERR_SHIFT_OVERLAP
  http: 422
  condition: Worker already has an assignment whose [start_at, end_at) overlaps the shift
- id: ERR_CERTIFICATION_MISSING
  http: 422
  condition: Worker lacks the shift's role_type in certifications
- id: ERR_HEADCOUNT_EXCEEDED
  http: 422
  condition: Assignment would exceed shift headcount_required
- id: ERR_WEEKLY_HOURS_EXCEEDED
  http: 422
  condition: Assignment would push the worker's ISO-week scheduled hours strictly above 48.00
- id: ERR_STRESS_CAP_REACHED
  http: 422
  condition: report-stress attempted with stress_extension_days already at 5
- id: ERR_CONTRACT_COMMITMENT_EXCEEDED
  http: 422
  condition: Shipment reservation would push the week's reserved pounds above weekly_commitment_lb
- id: ERR_DOCK_CAPACITY_EXCEEDED
  http: 422
  condition: ship_date already has 3 shipments in {RESERVED, PACKED, SHIPPED}
- id: ERR_SHIPMENT_CROP_MISMATCH
  http: 422
  condition: A shipment line's batch crop differs from the contract crop
- id: ERR_SHIPMENT_WINDOW_CLOSED
  http: 422
  condition: Ship attempted before window_start_at, after window_end_at (end is inclusive), or on a UTC date other than ship_date
- id: ERR_LINE_NOT_PACKED
  http: 409
  condition: Ship attempted while a line is still RESERVED (confirm-pack must run first)
- id: ERR_SHIP_DATE_MISMATCH
  http: 422
  condition: Shipment ship_date differs from a line batch's harvested_at UTC date (same-day distribution rule), or window_start_at/window_end_at fall outside ship_date
- id: ERR_PRICE_BELOW_FLOOR
  http: 422
  condition: price_per_pound_cents below the crop's floor_price_cents_per_lb
- id: ERR_CONTRACT_WINDOW_INVALID
  http: 422
  condition: end_date <= start_date
- id: ERR_WEEK_NOT_SETTLABLE
  http: 422
  condition: settle-week target is not the earliest unsettled week, or the week has not fully ended (clock < week end)
- id: ERR_ENERGY_PERIOD_OVERLAP
  http: 422
  condition: Reading period overlaps an existing reading with the same (scope_type, zone) key (half-open; adjacency allowed)
- id: ERR_CROP_RETIRED
  http: 422
  condition: Crop is RETIRED where ACTIVE is required
- id: ERR_NO_ACTIVE_RECIPE
  http: 422
  condition: Crop has no ACTIVE recipe (batch create or replant approve)
- id: ERR_RECIPE_IN_USE
  http: 422
  condition: Manual recipe retire while non-terminal batches reference it
- id: ERR_DUPLICATE_CODE
  http: 422
  condition: crop_code / rack_code / loop_code already exists
- id: ERR_REPLANT_NO_TOWERS
  http: 422
  condition: Tower selector found no rack with enough eligible IDLE towers (empty-pool fallback)
- id: ERR_REPLANT_ALREADY_QUEUED
  http: 422
  condition: A QUEUED ReplantRequest already exists for this failure
- id: ERR_REPLANT_STILL_QUEUED
  http: 422
  condition: Failure close attempted while its ReplantRequest is still QUEUED
- id: ERR_BATCH_NOT_PACKED
  http: 409
  condition: A shipment line's batch is not in production_status == PACKED at shipment create
- id: ERR_BATCH_POUNDS_INSUFFICIENT
  http: 422
  condition: Σ line reserved_lb for a batch exceeds that batch's packed_available_lb
- id: ERR_CROP_IN_USE
  http: 422
  condition: 'Crop retire blocked: non-terminal batches or live contracts reference the crop'
- id: ERR_HARVEST_IN_FLIGHT
  http: 409
  condition: 'Sanitation start blocked: a batch on the loop''s racks is HARVEST_READY or HARVESTED'
- id: ERR_RACK_HAS_ACTIVE_BATCHES
  http: 409
  condition: 'set-out-of-service blocked: rack has ACTIVE tower allocations'
- id: ERR_SHIPMENT_IN_FLIGHT
  http: 409
  condition: 'Contract suspend blocked: a shipment is PACKED'
- id: ERR_UNCONFIRMED_ASSIGNMENTS
  http: 409
  condition: 'Shift complete blocked: assignments remain in ASSIGNED (not CONFIRMED)'
roles:
- name: FarmManager
  description: 'Facility operations authority: crops, racks, water loops, energy readings, replant approvals, clock'
  identity: opaque
  exclusive_operations:
  - POST /farm/crops; POST /farm/crops/{id}/retire
  - POST /farm/water-loops
  - POST /farm/racks; POST /farm/racks/{id}/set-out-of-service; POST /farm/racks/{id}/return-to-service
  - POST /farm/energy-readings
  - POST /farm/replant-requests/{id}/approve; POST /farm/replant-requests/{id}/drop
  - POST /farm/_clock/set_current_utc
  shared_operations:
  - All GET endpoints
  - GET /farm/batches/{id}/cost-summary; GET /farm/contracts/{id}/week-summary
- name: Grower
  description: 'Cultivation operator: recipes and the batch lifecycle from create through harvest/pack/fail'
  identity: opaque
  exclusive_operations:
  - POST /farm/recipes; POST /farm/recipes/{id}/activate; POST /farm/recipes/{id}/retire
  - POST /farm/batches and all /farm/batches/{id}/{seed, germination-check, report-stress, recover, mark-harvest-ready, harvest, fail, cull, pack}
  - POST /farm/failure-reports/{id}/triage; POST /farm/failure-reports/{id}/request-replant; POST /farm/failure-reports/{id}/close
  shared_operations:
  - All GET endpoints
  - GET /farm/batches/{id}/cost-summary
- name: SanitationLead
  description: Water-system sanitation operator
  identity: opaque
  exclusive_operations:
  - POST /farm/sanitation-cycles
  - POST /farm/sanitation-cycles/{id}/start; POST /farm/sanitation-cycles/{id}/record-result; POST /farm/sanitation-cycles/{id}/cancel
  shared_operations:
  - All GET endpoints
- name: QualityAssurance
  description: Food-safety release authority; segregated from the harvesting Grower user
  identity: opaque
  exclusive_operations:
  - POST /farm/batches/{id}/safety-release
  shared_operations:
  - All GET endpoints
- name: ContractsManager
  description: Retail contract and distribution-window operator
  identity: opaque
  exclusive_operations:
  - POST /farm/contracts; POST /farm/contracts/{id}/{suspend, reinstate, terminate, settle-week}
  - POST /farm/shipments; POST /farm/shipments/{id}/{confirm-pack, ship, cancel}
  shared_operations:
  - All GET endpoints
  - GET /farm/batches/{id}/cost-summary; GET /farm/contracts/{id}/week-summary
- name: LaborPlanner
  description: 'Labor scheduling operator: workers, shifts, assignments'
  identity: opaque
  exclusive_operations:
  - POST /farm/workers
  - POST /farm/labor-shifts; POST /farm/labor-shifts/{id}/{publish, complete, cancel}
  - POST /farm/labor-shifts/{id}/assignments; POST /farm/labor-shifts/{id}/assignments/{aid}/release
  shared_operations:
  - All GET endpoints
- name: Worker
  description: Crew member; confirms own shift assignments only
  identity: entity_backed:Worker
  exclusive_operations:
  - POST /farm/labor-shifts/{id}/assignments/{aid}/confirm (X-User-ID must equal the assignment's worker_id)
  shared_operations:
  - All GET endpoints
