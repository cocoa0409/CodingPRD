  # ---------------------------------------------------------------------------
  # Rule 3 — non_linear_state_machine (Proposal cyclic; GiftAgreement parallel
  # dimensions; Prospect parallel+cyclic — three different entities)
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: proposal_negotiation_revision_cycle
        grounds:
          - state_machines.Proposal.UNDER_REVIEW_to_NEGOTIATING
          - state_machines.Proposal.NEGOTIATING_to_DRAFT
          - state_machines.Proposal.UNDER_REVIEW_to_REJECTED
        distinguishing_aspect: |
          Cyclic shape on Proposal: the entity traverses UNDER_REVIEW ->
          NEGOTIATING -> DRAFT -> UNDER_REVIEW -> RETURNED -> DRAFT ->
          UNDER_REVIEW -> REJECTED -> DRAFT -> UNDER_REVIEW -> APPROVED in one
          lifetime, with PATCH clearing tier/quorum fields on every return to
          DRAFT. Distinct entity from the GiftAgreement and Prospect instances.
        test_recipe:
          setup:
            - "Prospect rated band C, assigned, moved to CULTIVATION"
            - "Proposal OUTRIGHT ask 20000000 (STANDARD tier) created"
          setup_api_calls:
            - call: "POST /advancement/fundraisers"
              payload: { display_name: "Officer One", email: "o1@x.edu", max_prospect_count: 10, max_open_ask_cents: 100000000 }
              as: VPAdvancement
              as_user_id: "vp-1"
              captures: { f_id: $.data.id, f_ver: $.data.version }
            - call: "POST /advancement/prospects"
              payload: { full_name: "Donor A", prospect_type: "INDIVIDUAL", contact_email: "a@x.com" }
              as: ProspectResearcher
              as_user_id: "res-1"
              captures: { p_id: $.data.id }
            - call: "POST /advancement/prospects/${p_id}/assessments"
              payload: { assessed_capacity_cents: 30000000, engagement_score: 80, philanthropy_score: 70, recency_score: 60, evidence_tier: "VERIFIED_DOCUMENT" }
              as: ProspectResearcher
              as_user_id: "res-1"
              captures: { a_id: $.data.id }
            - call: "POST /advancement/assessments/${a_id}/review"
              payload: { decision: "APPROVE" }
              as: AdvancementDirector
              as_user_id: "dir-1"
            - call: "POST /advancement/fundraisers/${f_id}/assignments"
              payload: { prospect_id: "${p_id}", expected_fundraiser_version: "${f_ver}" }
              as: AdvancementDirector
              as_user_id: "dir-1"
            - call: "POST /advancement/prospects/${p_id}/moves"
              payload: { target_stage: "CULTIVATION" }
              as: GiftOfficer
              as_user_id: "${f_id}"
            - call: "GET /advancement/prospects/${p_id}"
              payload: {}
              as: GiftOfficer
              as_user_id: "${f_id}"
              captures: { p_ver: $.data.version }
            - call: "POST /advancement/proposals"
              payload: { prospect_id: "${p_id}", proposal_type: "OUTRIGHT", ask_amount_cents: 20000000, designation_purpose: "Programs", expected_prospect_version: "${p_ver}" }
              as: GiftOfficer
              as_user_id: "${f_id}"
              captures: { prop_id: $.data.id }
          trigger:
            - call: "POST /advancement/proposals/${prop_id}/submit"
              payload: {}
              as: GiftOfficer
              as_user_id: "${f_id}"
              captures: { st1: $.data.status, tier1: $.data.approval_tier }
            - call: "POST /advancement/proposals/${prop_id}/review"
              payload: { decision: "NEGOTIATE", decision_rationale: "counter lower" }
              as: AdvancementDirector
              as_user_id: "dir-1"
              captures: { st2: $.data.status }
            - call: "PATCH /advancement/proposals/${prop_id}"
              payload: { ask_amount_cents: 18000000 }
              as: GiftOfficer
              as_user_id: "${f_id}"
              captures: { st3: $.data.status, tier3: $.data.approval_tier }
            - call: "POST /advancement/proposals/${prop_id}/submit"
              payload: {}
              as: GiftOfficer
              as_user_id: "${f_id}"
              captures: { st4: $.data.status, tier4: $.data.approval_tier }
            - call: "POST /advancement/proposals/${prop_id}/review"
              payload: { decision: "RETURN", decision_rationale: "needs detail" }
              as: AdvancementDirector
              as_user_id: "dir-1"
              captures: { st5: $.data.status }
            - call: "PATCH /advancement/proposals/${prop_id}"
              payload: { designation_purpose: "Programs v2" }
              as: GiftOfficer
              as_user_id: "${f_id}"
              captures: { st6: $.data.status }
            - call: "POST /advancement/proposals/${prop_id}/submit"
              payload: {}
              as: GiftOfficer
              as_user_id: "${f_id}"
            - call: "POST /advancement/proposals/${prop_id}/review"
              payload: { decision: "REJECT", decision_rationale: "not now" }
              as: AdvancementDirector
              as_user_id: "dir-1"
              captures: { st7: $.data.status }
            - call: "PATCH /advancement/proposals/${prop_id}"
              payload: { ask_amount_cents: 15000000 }
              as: GiftOfficer
              as_user_id: "${f_id}"
              captures: { st8: $.data.status }
            - call: "POST /advancement/proposals/${prop_id}/submit"
              payload: {}
              as: GiftOfficer
              as_user_id: "${f_id}"
            - call: "POST /advancement/proposals/${prop_id}/review"
              payload: { decision: "APPROVE" }
              as: AdvancementDirector
              as_user_id: "dir-1"
              captures: { st9: $.data.status }
          assert:
            - "st1 == \"UNDER_REVIEW\" and tier1 == \"STANDARD\"  # 20000000 < 25000000"
            - "st2 == \"NEGOTIATING\""
            - "st3 == \"DRAFT\" and tier3 is null  # PATCH clears computed tier and quorum fields"
            - "st4 == \"UNDER_REVIEW\" and tier4 == \"STANDARD\"  # recomputed on resubmit with ask 18000000"
            - "st5 == \"RETURNED\""
            - "st6 == \"DRAFT\""
            - "st7 == \"REJECTED\""
            - "st8 == \"DRAFT\"  # REJECTED -> DRAFT revision loop"
            - "st9 == \"APPROVED\" and Proposal.${prop_id}.approvals_received == 1"

