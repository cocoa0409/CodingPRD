      - name: the_investigator_may_neither_adjudicate_nor_revoke
        claim_type: Segregation of duties
        grounds:
          - errors.ERR_SEGREGATION_OF_DUTIES
          - validations.priority_28_investigator_is_not_adjudicator
          - entities.ViolationCase.fields.investigator_user_id
        distinguishing_aspect: >-
          The enforcement chain has two separations rather than one: the identity that
          investigated a case cannot adjudicate it, and it also cannot be the identity that
          later revokes the developer's access — even from a case it did not investigate
          itself, because the rule ranges over ALL of that developer's cases. Two different
          trust-and-safety identities make the difference observable.
        test_recipe:
          setup:
            - "developer D1 has two cases: C1 investigated by tso-1 and C2 investigated by tso-2"
            - "C1 is adjudicated UPHELD by adm-1 (20 points), leaving the developer RESTRICTED at 50 points only after C2 is also upheld"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "adm-1"
            - call: "POST /developers"
              payload: { org_name: "Northwind Labs", contact_email: "dev1@northwind.example", region_code: "EU" }
              as: DevRelManager
              as_user_id: "drm-1"
              captures: { d1_id: $.data.id }
            - call: "POST /developers/${d1_id}/onboarding-acknowledgement"
              payload: { docs_version: 2, tos_version: 1 }
              as: Developer
              as_user_id: "${d1_id}"
            - call: "POST /violation-cases"
              payload: { developer_id: "${d1_id}", category: "RATE_ABUSE", severity: "MEDIUM", summary: "Sustained rate abuse across three consecutive windows." }
              as: TrustAndSafetyOfficer
              as_user_id: "tso-1"
              captures: { c1_id: $.data.id }
            - call: "POST /violation-cases/${c1_id}/investigate"
              payload: {}
              as: TrustAndSafetyOfficer
              as_user_id: "tso-1"
            - call: "POST /violation-cases"
              payload: { developer_id: "${d1_id}", category: "SCOPE_OVERREACH", severity: "MEDIUM", summary: "Calls observed against scopes that were never granted." }
              as: TrustAndSafetyOfficer
              as_user_id: "tso-2"
              captures: { c2_id: $.data.id }
            - call: "POST /violation-cases/${c2_id}/investigate"
              payload: {}
              as: TrustAndSafetyOfficer
              as_user_id: "tso-2"
          trigger:
            - call: "POST /violation-cases/${c1_id}/adjudicate"
              payload: { outcome: "UPHELD", decision_note: "Self-adjudication attempt by the investigating identity." }
              as: PlatformAdmin
              as_user_id: "tso-1"
            - call: "POST /violation-cases/${c1_id}/adjudicate"
              payload: { outcome: "UPHELD", decision_note: "Rate abuse confirmed on independent review." }
              as: PlatformAdmin
              as_user_id: "adm-1"
            - call: "POST /developers/${d1_id}/revoke-access"
              payload: { revocation_reason: "Revocation attempted by an identity that investigated one of the cases." }
              as: PlatformAdmin
              as_user_id: "tso-2"
            - call: "POST /developers/${d1_id}/revoke-access"
              payload: { revocation_reason: "Repeat terms-of-service violations across two upheld cases." }
              as: PlatformAdmin
              as_user_id: "adm-1"
          assert:
            - "the adjudication by tso-1 -> 422 ERR_SEGREGATION_OF_DUTIES with C1 still INVESTIGATING"
            - "the adjudication by adm-1 -> 200 with C1 UPHELD, penalty_points == 20 and the developer's violation_points == 20"
            - "the revocation by tso-2 -> 422 ERR_SEGREGATION_OF_DUTIES: tso-2 investigated C2, which belongs to the same developer, so it is disqualified from revoking"
            - "the revocation by adm-1 -> 200 with standing == REVOKED"
            - "C2 is still INVESTIGATING throughout: neither revocation attempt touched it"

  - section: cross_cutting_complexity_layers
    instances:
      - name: provisioning_requires_the_product_version_it_read
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.assignment-provision-stale-product
          - errors.ERR_STALE_PRODUCT_VERSION
          - endpoints.POST /quota-assignments
        distinguishing_aspect: >-
          The guarded field is the PARENT's version, not the assignment's: an operator who read
          the product, then had the pools adjusted underneath it, must be refused with 412 even
          though the application it is provisioning never changed. Every successful write to the
          product moves the counter — including the provisioning itself, whose pool deduction is
          a write — so the accepted request's version is stale for the next caller.
        test_recipe:
          setup:
            - "product P1 is created (version 1) with a GA version; application A1 is APPROVED for PARTNER"
            - "the operator captures version 1, then a program adjustment moves the product to version 2"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "adm-1"
            - call: "POST /api-products"
              payload: { name: "Catalog API", data_sensitivity: "PUBLIC", scope_catalog: [{ scope: "catalog.read", sensitivity: "PUBLIC" }], sample_app_slugs: ["quickstart-node"], sustained_rpm_pool: 20000, monthly_call_pool: 50000000, required_tos_version: 1 }
              as: PlatformAdmin
              as_user_id: "adm-1"
              captures: { p1_id: $.data.id }
            - call: "POST /api-products/${p1_id}/versions"
              payload: { semver: "1.0.0", breaking_change: false }
              as: PlatformAdmin
              as_user_id: "adm-1"
              captures: { v1_id: $.data.id }
            - call: "POST /api-versions/${v1_id}/promote"
              payload: {}
              as: PlatformAdmin
              as_user_id: "adm-1"
            - call: "POST /developers"
              payload: { org_name: "Northwind Labs", contact_email: "dev1@northwind.example", region_code: "EU" }
              as: DevRelManager
              as_user_id: "drm-1"
              captures: { d1_id: $.data.id }
            - call: "POST /developers/${d1_id}/onboarding-acknowledgement"
              payload: { docs_version: 2, tos_version: 1 }
              as: Developer
              as_user_id: "${d1_id}"
            - call: "POST /access-applications"
              payload: { developer_id: "${d1_id}", target_api_version_id: "${v1_id}", requested_tier: "PARTNER", requested_scopes: ["catalog.read"], requested_monthly_calls: 500000, justification_text: "We operate a regulated settlement reconciliation product and require partner-tier sustained throughput for nightly batch windows across twelve markets, with burst headroom for month-end close." }
              as: Developer
              as_user_id: "${d1_id}"
              captures: { app1_id: $.data.id }
            - call: "POST /access-applications/${app1_id}/submit"
              payload: {}
              as: Developer
              as_user_id: "${d1_id}"
            - call: "POST /access-applications/${app1_id}/claim-review"
              payload: {}
              as: DevRelManager
              as_user_id: "drm-1"
            - call: "POST /access-applications/${app1_id}/decide"
              payload: { decision: "APPROVE", approved_tier: "PARTNER", granted_scopes: ["catalog.read"] }
              as: PlatformAdmin
              as_user_id: "adm-1"
            - call: "GET /api-products/${p1_id}"
              payload: {}
              as: PlatformAdmin
              as_user_id: "adm-1"
              captures: { p1_ver_stale: $.data.version }
            - call: "POST /api-products/${p1_id}/program-adjustments"
              payload: { sustained_rpm_pool: 24000, adjustment_reason: "Capacity uplift ahead of the settlement season." }
              as: PlatformAdmin
              as_user_id: "adm-1"
          trigger:
            - call: "POST /quota-assignments"
              payload: { access_application_id: "${app1_id}", expected_api_product_version: "${p1_ver_stale}" }
              as: PlatformAdmin
              as_user_id: "adm-1"
            - call: "GET /api-products/${p1_id}"
              payload: {}
              as: PlatformAdmin
              as_user_id: "adm-1"
              captures: { p1_ver_fresh: $.data.version }
            - call: "POST /quota-assignments"
              payload: { access_application_id: "${app1_id}", expected_api_product_version: "${p1_ver_fresh}" }
              as: PlatformAdmin
              as_user_id: "adm-1"
              captures: { qa1_id: $.data.id }
          assert:
            - "the captured stale version is 1 and the product reads back at version 2 after the adjustment"
            - "the stale provisioning -> 412 ERR_STALE_PRODUCT_VERSION; no QuotaAssignment row exists and allocated_sustained_rpm is still 0"
            - "the retry with version 2 -> 201 with sustained_rpm == 2250, burst_rpm == 6750, monthly_call_allowance == 500000"
            - "the product now reads version 3: the accepted provisioning is itself a write to the pools"
            - "a further provisioning attempt quoting version 2 would be refused for staleness before the uniqueness rule is reached"

      - name: upgrade_requests_must_quote_the_assignment_they_supersede
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.upgrade-request-stale-assignment
          - errors.ERR_STALE_ASSIGNMENT_VERSION
          - endpoints.POST /quota-assignments/{id}/upgrade-requests
        distinguishing_aspect: >-
          Here the stale write would otherwise SUCCEED — a second create legitimately supersedes
          the first PENDING request — so 412 is the only thing standing between the developer
          and a silent overwrite of a request it never saw. The counter moves on the create
          itself, which is what makes a replay of the same body fail the second time.
        test_recipe:
          setup:
            - "developer D1 holds an ACTIVE STANDARD assignment at 450 sustained rpm (ceiling 1200)"
            - "the developer captures the assignment version before its first upgrade request"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "adm-1"
            - call: "POST /api-products"
              payload: { name: "Catalog API", data_sensitivity: "PUBLIC", scope_catalog: [{ scope: "catalog.read", sensitivity: "PUBLIC" }], sample_app_slugs: ["quickstart-node"], sustained_rpm_pool: 20000, monthly_call_pool: 50000000, required_tos_version: 1 }
              as: PlatformAdmin
              as_user_id: "adm-1"
              captures: { p1_id: $.data.id }
            - call: "POST /api-products/${p1_id}/versions"
              payload: { semver: "1.0.0", breaking_change: false }
              as: PlatformAdmin
              as_user_id: "adm-1"
              captures: { v1_id: $.data.id }
            - call: "POST /api-versions/${v1_id}/promote"
              payload: {}
              as: PlatformAdmin
              as_user_id: "adm-1"
            - call: "POST /developers"
              payload: { org_name: "Northwind Labs", contact_email: "dev1@northwind.example", region_code: "EU" }
              as: DevRelManager
              as_user_id: "drm-1"
              captures: { d1_id: $.data.id }
            - call: "POST /developers/${d1_id}/onboarding-acknowledgement"
              payload: { docs_version: 2, tos_version: 1 }
              as: Developer
              as_user_id: "${d1_id}"
            - call: "POST /access-applications"
              payload: { developer_id: "${d1_id}", target_api_version_id: "${v1_id}", requested_tier: "STANDARD", requested_scopes: ["catalog.read"], requested_monthly_calls: 200000, justification_text: "Our storefront widget reads the public catalogue hourly." }
              as: Developer
              as_user_id: "${d1_id}"
              captures: { app1_id: $.data.id }
            - call: "POST /access-applications/${app1_id}/submit"
              payload: {}
              as: Developer
              as_user_id: "${d1_id}"
            - call: "POST /access-applications/${app1_id}/claim-review"
              payload: {}
              as: DevRelManager
              as_user_id: "drm-1"
            - call: "POST /access-applications/${app1_id}/decide"
              payload: { decision: "APPROVE", approved_tier: "STANDARD", granted_scopes: ["catalog.read"] }
              as: PlatformAdmin
              as_user_id: "adm-1"
            - call: "GET /api-products/${p1_id}"
              payload: {}
              as: PlatformAdmin
              as_user_id: "adm-1"
              captures: { p1_ver: $.data.version }
            - call: "POST /quota-assignments"
              payload: { access_application_id: "${app1_id}", expected_api_product_version: "${p1_ver}" }
              as: PlatformAdmin
              as_user_id: "adm-1"
              captures: { qa1_id: $.data.id }
            - call: "POST /quota-assignments/${qa1_id}/activate"
              payload: {}
              as: PlatformAdmin
              as_user_id: "adm-1"
            - call: "GET /quota-assignments/${qa1_id}"
              payload: {}
              as: Developer
              as_user_id: "${d1_id}"
              captures: { qa_ver_stale: $.data.version }
          trigger:
            - call: "POST /quota-assignments/${qa1_id}/upgrade-requests"
              payload: { requested_sustained_rpm: 900, justification_text: "Seasonal storefront traffic needs half again our sustained rate.", expected_quota_assignment_version: "${qa_ver_stale}" }
              as: Developer
              as_user_id: "${d1_id}"
              captures: { ur1_id: $.data.id }
            - call: "POST /quota-assignments/${qa1_id}/upgrade-requests"
              payload: { requested_sustained_rpm: 1100, justification_text: "Revised upward after the marketing forecast landed this morning.", expected_quota_assignment_version: "${qa_ver_stale}" }
              as: Developer
              as_user_id: "${d1_id}"
            - call: "GET /quota-assignments/${qa1_id}"
              payload: {}
              as: Developer
              as_user_id: "${d1_id}"
              captures: { qa_ver_fresh: $.data.version }
            - call: "POST /quota-assignments/${qa1_id}/upgrade-requests"
              payload: { requested_sustained_rpm: 1100, justification_text: "Revised upward after the marketing forecast landed this morning.", expected_quota_assignment_version: "${qa_ver_fresh}" }
              as: Developer
              as_user_id: "${d1_id}"
              captures: { ur2_id: $.data.id }
          assert:
            - "the first request -> 201 with requested_delta_rpm == 450 and state == PENDING; the assignment's version is now qa_ver_stale + 1"
            - "the second request quoting the old version -> 412 ERR_STALE_ASSIGNMENT_VERSION"
            - "after the refusal ${ur1_id} is still PENDING and GET /quota-assignments/${qa1_id}/upgrade-requests reports total_count == 1"
            - "the retry with the fresh version -> 201 with requested_delta_rpm == 650, and ${ur1_id} becomes SUPERSEDED"
            - "the assignment's sustained_rpm is still 450: an upgrade request never mutates capacity by itself, only the allocation run does"

