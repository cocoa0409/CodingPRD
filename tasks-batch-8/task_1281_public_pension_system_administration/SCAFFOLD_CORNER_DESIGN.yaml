              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_FORBIDDEN, HTTP 403; line stays PENDING"

      - name: clerk_cannot_touch_other_employer_reports
        claim_type: violation_to_error
        grounds:
          - validations[priority=2]
          - roles[EmployerClerk]
        distinguishing_aspect: "Entity-backed ownership: clerk E1 posting a report under employer E2's path (or a line on E2's report) is ERR_FORBIDDEN, not ERR_NOT_FOUND."
        test_recipe:
          setup: ["Fund; employers E1 and E2; E2 has a DRAFT report"]
          setup_api_calls:
