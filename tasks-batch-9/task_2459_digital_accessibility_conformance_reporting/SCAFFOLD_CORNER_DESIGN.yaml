          - entities.Standard.fields.code
        distinguishing_aspect: "A create sent with no X-User-Role / X-User-ID headers at all returns ERR_UNAUTHENTICATED 401 at priority 1, ahead of the 403 authorisation check and every body validation, and writes nothing."
        test_recipe:
          setup: ["Empty database with the logical clock pinned to 2026-08-01T00:00:00Z"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
