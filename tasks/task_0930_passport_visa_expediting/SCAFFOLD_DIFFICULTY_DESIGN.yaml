  # =======================================================================
  # Rule 6 — boundary precision on DIFFERENT metrics and endpoints
  # =======================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: feasibility_projection_equal_to_deadline_is_feasible
        grounds:
          - calculations.feasibility_evaluation
          - calculations.projected_completion_date
          - state_machines.Order.UNKNOWN_to_FEASIBLE
          - state_machines.Order.UNKNOWN_to_INFEASIBLE
          - endpoints[GET /expediting/orders/{id}/feasibility]
        distinguishing_aspect: |
          Numeric/date threshold boundary reached through
          GET /expediting/orders/{id}/feasibility: with the clock at
          2026-06-01T09:00:00Z a STANDARD order projects completion on
          2026-06-26; travel_date 2026-07-01 puts the deadline exactly on
          2026-06-26 and the verdict is FEASIBLE (comparison is <=), while
          travel_date 2026-06-30 moves the deadline one day earlier to
          2026-06-25 and the verdict flips to INFEASIBLE.
        test_recipe:
          setup:
            - "Logical clock at 2026-06-01T09:00:00Z, a Monday business day."
            - "Two STANDARD single-applicant orders on the same catalog item, one with travel_date 2026-07-01 and one with travel_date 2026-06-30, both quoted."
          setup_api_calls:
            - call: "POST /expediting/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:00:00Z" }
              as: PlatformAdmin
            - call: "POST /expediting/catalog-items"
              payload: { nationality_code: "US", destination_country: "IN", visa_type: "TOURIST", government_fee_cents: 16000, government_fee_basis: "PER_APPLICANT", base_service_fee_cents: 7500, form_code: "DS-160", requires_appointment: false }
              as: PlatformAdmin
              captures: { cat_id: $.data.id }
            - call: "POST /expediting/orders"
              payload: { catalog_item_id: "${cat_id}", travel_date: "2026-07-01", return_date: "2026-07-20", delivery_region_code: "CA", service_level: "STANDARD" }
              as: CaseManager
              as_user_id: "cm-quote"
              captures: { ord_edge_id: $.data.id }
            - call: "POST /expediting/orders"
              payload: { catalog_item_id: "${cat_id}", travel_date: "2026-06-30", return_date: "2026-07-19", delivery_region_code: "CA", service_level: "STANDARD" }
              as: CaseManager
              as_user_id: "cm-quote"
              captures: { ord_over_id: $.data.id }
            - call: "POST /expediting/orders/${ord_edge_id}/applicants"
              payload: { full_name: "Edge One", date_of_birth: "1990-03-04", nationality_code: "US", residence_region_code: "CA" }
              as: CaseManager
              as_user_id: "cm-quote"
            - call: "POST /expediting/orders/${ord_over_id}/applicants"
              payload: { full_name: "Over One", date_of_birth: "1990-03-04", nationality_code: "US", residence_region_code: "CA" }
              as: CaseManager
              as_user_id: "cm-quote"
            - call: "POST /expediting/orders/${ord_edge_id}/quote"
              payload: {}
              as: CaseManager
              as_user_id: "cm-quote"
            - call: "POST /expediting/orders/${ord_over_id}/quote"
              payload: {}
              as: CaseManager
              as_user_id: "cm-quote"
          trigger:
            - call: "GET /expediting/orders/${ord_edge_id}/feasibility"
              payload: {}
              as: CaseManager
              as_user_id: "cm-quote"
              captures: { edge_pcd: $.data.projected_completion_date, edge_status: $.data.feasibility_status }
            - call: "GET /expediting/orders/${ord_over_id}/feasibility"
              payload: {}
              as: CaseManager
              as_user_id: "cm-quote"
              captures: { over_status: $.data.feasibility_status }
          assert:
            - "${edge_pcd} == 2026-06-26"
            - "${edge_status} == FEASIBLE"
            - "${over_status} == INFEASIBLE"
            - "Order.${ord_edge_id}.feasibility_status == FEASIBLE"
            - "Order.${ord_over_id}.feasibility_status == INFEASIBLE"
            - "Order.${ord_edge_id}.effective_submission_date == 2026-06-01"

      - name: empty_required_document_set_leaves_applicant_complete_with_zero_documents
        grounds:
          - calculations.required_document_set
          - entities.Applicant.fields.required_doc_count
          - entities.Applicant.fields.accepted_doc_count
          - state_machines.Applicant.PENDING_to_COMPLETE
          - endpoints[GET /expediting/applicants/{id}/required-documents]
        distinguishing_aspect: |
          Empty-collection boundary on a different metric and a different
          endpoint from the feasibility threshold: a catalog item with zero
          DocumentRequirement rows yields required_doc_count 0 and
          accepted_doc_count 0, and GET /expediting/applicants/{id}/required-documents
          reports satisfied == true, so the applicant reaches COMPLETE on the
          photo and the prepared form alone with no ApplicantDocument rows at all.
        test_recipe:
          setup:
            - "DS-160 revision 1 published and ACTIVE."
            - "A catalog item carrying no document requirement lines."
            - "An order with one applicant whose photo has PASSED and whose form has been PREPARED against revision 1."
          setup_api_calls:
            - call: "POST /expediting/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T09:00:00Z" }
