          - state_machines.ShowClass.JUDGED_to_RESULTS_POSTED
        distinguishing_aspect: |
          Three roundings are nested (pool -> division allotment -> class purse -> per-place
          prize) and the order of the last one is pinned: each place is rounded to whole
          cents independently and only then summed. With purse 41721 and four filled
          ribbons the pinned order awards 38382 cents while the plausible
          "sum the exact shares, then round once" order awards 38383 — a one-cent
          separation that no other reading of the formula produces.
