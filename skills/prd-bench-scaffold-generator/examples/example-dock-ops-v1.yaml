# =============================================================================
# Example: dock-ops benchmark seed tables (v1)
# =============================================================================

scenario: |
  DockOps Hub API for cross-dock hub management. Tracks consignments (shipments),
  dock requests (inbound/outbound moves), and holds (blockers). Manages staging
  capacity with posture-based controls (OPEN/CONGESTED/LOCKDOWN), variance-
  triggered auto-holds, void corrections that unwind effects, and periodic
  operations checkpoints (run_ops) for stale request expiry and administrative
  closeout.

domain_name: dock-ops
api_prefix: /hubs

# =============================================================================
# Table 1: Entity Relationship Table
# =============================================================================
entities:
  - name: Hub
    parent: null
    common_fields: true  # id, created_at, updated_at
    fields:
      - { name: name, type: string, source: input, description: "Hub name" }
      - { name: staging_capacity_units, type: integer, source: input, description: "Total staging capacity" }
      - { name: staging_in_use_units, type: integer, source: computed, description: "Units physically on the floor (sum of consignment units_on_hand)" }
      - { name: staging_reserved_units, type: integer, source: computed, description: "Units promised for scheduled inbound requests" }
      - { name: staging_free_units, type: integer, source: computed, description: "= staging_capacity_units - staging_in_use_units - staging_reserved_units" }
      - { name: posture, type: enum, source: computed, description: "OPEN | CONGESTED | LOCKDOWN — derived from staging_free_units" }
      - { name: ops_run_index, type: integer, source: system, default: 0, description: "Monotone counter incremented by run_ops" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version" }

  - name: Consignment
    parent: Hub
    common_fields: true
    fields:
      - { name: hub_id, type: string, source: system, description: "Parent hub ID" }
      - { name: reference, type: string, source: input, description: "External identifier" }
      - { name: declared_units, type: integer, source: input, description: "Expected shipment size" }
      - { name: commodity, type: enum, source: input, description: "GENERAL | COLD_CHAIN | HAZMAT" }
      - { name: units_on_hand, type: integer, source: computed, default: 0, description: "Current units physically at hub" }
      - { name: status, type: enum, source: system, description: "PLANNED → AT_HUB → RELEASED → CLOSED / VOIDED" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version" }

  - name: DockRequest
    parent: Hub
    common_fields: true
    fields:
      - { name: hub_id, type: string, source: system, description: "Parent hub ID" }
      - { name: consignment_id, type: string, source: input, description: "Associated consignment ID" }
      - { name: direction, type: enum, source: input, description: "INBOUND | OUTBOUND" }
      - { name: units, type: integer, source: input, description: "Planned units for this move" }
      - { name: priority, type: enum, source: input, description: "EXPEDITE | STANDARD | DEFERRED" }
      - { name: sequence, type: integer, source: system, description: "Monotone counter within hub (stable tie-breaker)" }
      - { name: actual_units, type: integer, source: input, description: "Actual units moved (set on completion)" }
      - { name: variance_units, type: integer, source: computed, description: "= actual_units - units (recorded on completion)" }
      - { name: status, type: enum, source: system, description: "DRAFT → SUBMITTED → SCHEDULED → DONE / CANCELLED / EXPIRED / VOIDED / ON_HOLD" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version" }

  - name: Hold
    parent: Hub
    common_fields: true
    fields:
      - { name: hub_id, type: string, source: system, description: "Parent hub ID" }
      - { name: consignment_id, type: string, source: input, description: "Associated consignment ID" }
      - { name: kind, type: enum, source: input, description: "DOCS | DAMAGE | TEMPERATURE | CUSTOMS" }
      - { name: note, type: string, source: input, description: "Hold description" }
      - { name: source, type: enum, source: system, default: "MANUAL", description: "MANUAL | AUTO_VARIANCE" }
      - { name: source_dock_request_id, type: string, source: system, required: false, description: "Dock request that triggered auto-hold (only for AUTO_VARIANCE)" }
      - { name: status, type: enum, source: system, description: "OPEN → CLEARED / VOIDED" }
      - { name: version, type: integer, source: system, description: "Optimistic concurrency version" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: Consignment
    initial_state: PLANNED
    terminal_states: [CLOSED, VOIDED]
    transitions:
      - from: PLANNED
        to: AT_HUB
        trigger: "system (automatic when units_on_hand > 0 after inbound completion)"
        actor: system
        preconditions: []
        side_effects: []

      - from: AT_HUB
        to: RELEASED
        trigger: "system (automatic when units_on_hand reaches 0 after a receipt has happened)"
        actor: system
        preconditions: []
        side_effects: []

      - from: RELEASED
        to: CLOSED
        trigger: "system (automatic during run_ops when no open holds and no open moves)"
        actor: system
        preconditions: []
        side_effects: []

      - from: PLANNED
        to: VOIDED
        trigger: POST .../consignments/{consignmentId}/void
        actor: Any
        preconditions:
          - "units_on_hand must be 0"
          - "No dock requests beyond draft behavior"
          - "No active holds (OPEN)"
        side_effects: ["Consignment no longer schedulable or actionable"]

      - from: CLOSED
        to: AT_HUB
        trigger: "system (automatic if correction or new hold creates new activity)"
        actor: system
        preconditions: []
        side_effects: []
        note: "Closed isn't sacred — corrections can reopen"

  - entity: DockRequest
    initial_state: DRAFT
    terminal_states: [DONE, CANCELLED, EXPIRED, VOIDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: POST .../dock_requests/{dockRequestId}/submit
        actor: Any
        preconditions:
          - "No other open move (SUBMITTED/SCHEDULED/ON_HOLD) for same consignment (ERR_CONSIGNMENT_BUSY)"
          - "Inbound + LOCKDOWN: blocked (ERR_POSTURE_LOCKDOWN)"
          - "Inbound + CONGESTED: capped to floor(staging_free_units/4), min 1 (ERR_CONGESTED_INBOUND_LIMIT)"
          - "Outbound: no OPEN holds on consignment (ERR_CONSIGNMENT_HAS_OPEN_HOLD)"
          - "Outbound: units <= consignment.units_on_hand (ERR_CONSIGNMENT_EMPTY)"
        side_effects: []

      - from: SUBMITTED
        to: SCHEDULED
        trigger: POST .../dock_requests/batch_schedule
        actor: Any
        preconditions:
          - "Inbound: planned units must fit in staging_free_units (ERR_CAPACITY_EXCEEDED)"
          - "Outbound: consignment must still have enough units_on_hand"
        side_effects:
          - "Inbound: staging_reserved_units += units"

      - from: SCHEDULED
        to: DONE
        trigger: POST .../dock_requests/{dockRequestId}/complete
        actor: Any
        preconditions:
          - "Inbound: actual_units must fit in free staging (ERR_CAPACITY_EXCEEDED)"
        side_effects:
          - "Inbound: units_on_hand += actual_units, release reservation"
          - "Outbound: units_on_hand -= actual_units"
          - "variance_units recorded"
          - "If |variance_units| >= 3: auto-create DAMAGE hold (AUTO_VARIANCE)"

      - from: SUBMITTED
        to: ON_HOLD
        trigger: "system (automatic when an OPEN hold is created on the consignment)"
        actor: system
        preconditions: []
        side_effects: []
        note: "Outbound requests only — holds block outbound work"

      - from: SCHEDULED
        to: ON_HOLD
        trigger: "system (automatic when an OPEN hold is created on the consignment)"
        actor: system
        preconditions: []
        side_effects: []
        note: "Outbound requests only"

      - from: ON_HOLD
        to: SUBMITTED
        trigger: "system (automatic when last OPEN hold on consignment is cleared/voided)"
        actor: system
        preconditions: []
        side_effects: []

      - from: DRAFT
        to: CANCELLED
        trigger: POST .../dock_requests/{dockRequestId}/cancel
        actor: Any
        preconditions: []
        side_effects: []

      - from: SUBMITTED
        to: CANCELLED
        trigger: POST .../dock_requests/{dockRequestId}/cancel
        actor: Any
        preconditions: []
        side_effects: []

      - from: SCHEDULED
        to: CANCELLED
        trigger: POST .../dock_requests/{dockRequestId}/cancel
        actor: Any
        preconditions: []
        side_effects:
          - "If inbound: release reservation (staging_reserved_units -= units)"

      - from: ON_HOLD
        to: CANCELLED
        trigger: POST .../dock_requests/{dockRequestId}/cancel
        actor: Any
        preconditions: []
        side_effects: []

      - from: SUBMITTED
        to: EXPIRED
        trigger: "system (automatic during run_ops after 2 ops runs without scheduling)"
        actor: system
        preconditions: []
        side_effects: []

      - from: ON_HOLD
        to: EXPIRED
        trigger: "system (automatic during run_ops after 2 ops runs without scheduling)"
        actor: system
        preconditions: []
        side_effects: []

      - from: DONE
        to: VOIDED
        trigger: POST .../dock_requests/{dockRequestId}/void
        actor: Any
        preconditions:
          - "Void must not cause units_on_hand to go negative (ERR_CONSTRAINT_VIOLATION)"
          - "Outbound void must not cause capacity overflow (ERR_CAPACITY_EXCEEDED)"
        side_effects:
          - "Reverse effects: inbound void decreases units_on_hand; outbound void increases units_on_hand"
          - "If variance-created hold (AUTO_VARIANCE) is still OPEN: auto-void the hold"
          - "May change consignment status and hub posture"

  - entity: Hold
    initial_state: OPEN
    terminal_states: [CLEARED, VOIDED]
    transitions:
      - from: OPEN
        to: CLEARED
        trigger: POST .../holds/{holdId}/clear
        actor: Any
        preconditions: []
        side_effects:
          - "If last OPEN hold on consignment: ON_HOLD dock requests → SUBMITTED"

      - from: OPEN
        to: VOIDED
        trigger: POST .../holds/{holdId}/void
        actor: Any
        preconditions: []
        side_effects:
          - "If last OPEN hold on consignment: ON_HOLD dock requests → SUBMITTED"

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: staging_free_units
    trigger: "any change to staging_in_use_units or staging_reserved_units"
    algorithm: aggregation
    formula: |
      staging_free_units = staging_capacity_units - staging_in_use_units - staging_reserved_units
      staging_in_use_units = sum(units_on_hand for all non-VOIDED consignments)
      staging_reserved_units = sum(units for all SCHEDULED inbound dock requests)

  - name: posture
    trigger: "any change to staging_free_units"
    algorithm: derived
    formula: |
      if staging_free_units == 0:
        posture = LOCKDOWN
      else if staging_free_units <= floor(staging_capacity_units * 0.20):
        posture = CONGESTED
      else:
        posture = OPEN

  - name: congested_inbound_limit
    trigger: "inbound dock request submission in CONGESTED posture"
    algorithm: threshold
    formula: |
      max_units = floor(staging_free_units / 4)
      if max_units < 1: max_units = 1
      if dock_request.units > max_units:
        reject with ERR_CONGESTED_INBOUND_LIMIT

  - name: variance_hold_trigger
    trigger: "dock request completion"
    algorithm: threshold
    formula: |
      variance_units = actual_units - planned_units
      if abs(variance_units) >= 3:
        auto-create DAMAGE hold with source=AUTO_VARIANCE
    constants:
      VARIANCE_THRESHOLD: 3  # units

  - name: stale_request_expiry
    trigger: "run_ops"
    algorithm: counter
    formula: |
      For each SUBMITTED or ON_HOLD dock request:
        if request has been in that state through 2 ops runs without becoming scheduled:
          request → EXPIRED

  - name: administrative_closeout
    trigger: "run_ops"
    algorithm: status_check
    formula: |
      For each consignment in RELEASED status:
        if no OPEN holds and no open moves (SUBMITTED/SCHEDULED/ON_HOLD):
          consignment → CLOSED

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: concurrency
    check: "If-Match header required on PUT and state-changing actions"
    error_id: ERR_MISSING_IF_MATCH
    http_status: 400
    applies_to: "PUT, state-changing endpoints"

  - priority: 2
    category: existence
    check: "Resource IDs must exist within the correct hub scope"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all resource endpoints

  - priority: 3
    category: concurrency
    check: "version in request must match current version"
    error_id: ERR_VERSION_CONFLICT
    http_status: 409
    applies_to: "PUT and state-changing endpoints"

  - priority: 4
    category: posture
    check: "Hub posture gates for inbound submissions"
    error_id: "ERR_POSTURE_LOCKDOWN / ERR_CONGESTED_INBOUND_LIMIT"
    http_status: 409
    applies_to: "Inbound dock request submissions"

  - priority: 5
    category: business
    check: "Shipment-level blockers (open holds before empty stock)"
    error_id: "ERR_CONSIGNMENT_HAS_OPEN_HOLD / ERR_CONSIGNMENT_EMPTY / ERR_CONSIGNMENT_BUSY"
    http_status: 409
    applies_to: "Dock request operations"

  - priority: 6
    category: state
    check: "Resource must be in correct state for operation"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "All state transition endpoints"

  - priority: 7
    category: capacity
    check: "Capacity constraints for scheduling and completion"
    error_id: ERR_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "Scheduling and completion of inbound requests"

  - priority: 8
    category: correction
    check: "Void constraints (no negative on-hand, no capacity overflow)"
    error_id: "ERR_CONSTRAINT_VIOLATION / ERR_CAPACITY_EXCEEDED"
    http_status: 409
    applies_to: "Dock request voids"

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  # --- Hub ---
  - method: POST
    path: "/hubs"
    description: "Create a new Hub"
    roles: [Any]
    code: 201
    input: [name, staging_capacity_units]
    output: Hub
    side_effects:
      - "staging_in_use_units=0, staging_reserved_units=0"
      - "staging_free_units=staging_capacity_units"
      - "posture=OPEN, ops_run_index=0"

  - method: GET
    path: "/hubs/{hubId}"
    description: "Get a specific Hub"
    roles: [Any]
    code: 200
    input: []
    output: Hub
    side_effects: []

  # --- Consignment ---
  - method: POST
    path: "/hubs/{hubId}/consignments"
    description: "Create a Consignment"
    roles: [Any]
    code: 201
    input: [reference, declared_units, commodity]
    output: Consignment
    side_effects: ["units_on_hand=0, status=PLANNED"]

  - method: GET
    path: "/hubs/{hubId}/consignments/{consignmentId}"
    description: "Get a specific Consignment"
    roles: [Any]
    code: 200
    input: []
    output: Consignment
    side_effects: []

  - method: POST
    path: "/hubs/{hubId}/consignments/{consignmentId}/void"
    description: "Void a Consignment"
    roles: [Any]
    code: 200
    input: []
    output: Consignment
    side_effects: ["status → VOIDED"]

  # --- DockRequest ---
  - method: POST
    path: "/hubs/{hubId}/dock_requests"
    description: "Create a Dock Request"
    roles: [Any]
    code: 201
    input: [consignment_id, direction, units, priority]
    output: DockRequest
    side_effects: ["status=DRAFT, sequence assigned"]

  - method: GET
    path: "/hubs/{hubId}/dock_requests/{dockRequestId}"
    description: "Get a specific Dock Request"
    roles: [Any]
    code: 200
    input: []
    output: DockRequest
    side_effects: []

  - method: PUT
    path: "/hubs/{hubId}/dock_requests/{dockRequestId}"
    description: "Update a Dock Request (in DRAFT)"
    roles: [Any]
    code: 200
    input: ["units?, priority?"]
    output: DockRequest
    side_effects: []

  - method: POST
    path: "/hubs/{hubId}/dock_requests/{dockRequestId}/submit"
    description: "Submit a Dock Request"
    roles: [Any]
    code: 200
    input: []
    output: DockRequest
    side_effects: ["status → SUBMITTED"]

  - method: POST
    path: "/hubs/{hubId}/dock_requests/batch_schedule"
    description: "Batch schedule dock requests"
    roles: [Any]
    code: 200
    input: [dock_request_ids]
    output: "{ scheduled_ids: [], rejected: [{ dock_request_id, error_code }] }"
    side_effects:
      - "Process in order: EXPEDITE first, then STANDARD, then DEFERRED (sequence tie-break)"
      - "Inbound: staging_reserved_units += units per scheduled request"

  - method: POST
    path: "/hubs/{hubId}/dock_requests/{dockRequestId}/cancel"
    description: "Cancel a Dock Request"
    roles: [Any]
    code: 200
    input: []
    output: DockRequest
    side_effects:
      - "status → CANCELLED"
      - "If inbound SCHEDULED: release reservation"

  - method: POST
    path: "/hubs/{hubId}/dock_requests/{dockRequestId}/complete"
    description: "Complete a Dock Request"
    roles: [Any]
    code: 200
    input: [actual_units]
    output: DockRequest
    side_effects:
      - "status → DONE"
      - "Inbound: units_on_hand += actual_units, release reservation"
      - "Outbound: units_on_hand -= actual_units"
      - "variance_units recorded"
      - "If |variance| >= 3: auto-create DAMAGE hold, return auto_hold_id"

  - method: POST
    path: "/hubs/{hubId}/dock_requests/{dockRequestId}/void"
    description: "Void a completed Dock Request"
    roles: [Any]
    code: 200
    input: []
    output: DockRequest
    side_effects:
      - "status → VOIDED"
      - "Reverse effects on units_on_hand"
      - "If AUTO_VARIANCE hold still OPEN: auto-void hold"
      - "May change consignment status and hub posture"

  # --- Hold ---
  - method: POST
    path: "/hubs/{hubId}/holds"
    description: "Create a Hold"
    roles: [Any]
    code: 201
    input: [consignment_id, kind, note]
    output: Hold
    side_effects:
      - "status=OPEN, source=MANUAL"
      - "Outbound dock requests (SUBMITTED/SCHEDULED) for consignment → ON_HOLD"

  - method: GET
    path: "/hubs/{hubId}/holds/{holdId}"
    description: "Get a specific Hold"
    roles: [Any]
    code: 200
    input: []
    output: Hold
    side_effects: []

  - method: POST
    path: "/hubs/{hubId}/holds/{holdId}/clear"
    description: "Clear a Hold"
    roles: [Any]
    code: 200
    input: []
    output: Hold
    side_effects:
      - "status → CLEARED"
      - "If last OPEN hold: ON_HOLD requests → SUBMITTED"

  - method: POST
    path: "/hubs/{hubId}/holds/{holdId}/void"
    description: "Void a Hold"
    roles: [Any]
    code: 200
    input: []
    output: Hold
    side_effects:
      - "status → VOIDED"
      - "If last OPEN hold: ON_HOLD requests → SUBMITTED"

  # --- Operations ---
  - method: POST
    path: "/hubs/{hubId}/run_ops"
    description: "Run operations checkpoint"
    roles: [Any]
    code: 200
    input: []
    output: Hub
    side_effects:
      - "ops_run_index += 1"
      - "Stale requests (SUBMITTED/ON_HOLD through 2 ops runs) → EXPIRED"
      - "RELEASED consignments with no open holds/moves → CLOSED"

# =============================================================================
# Table 6: Error Code Catalogue
# =============================================================================
errors:
  - id: ERR_BAD_REQUEST
    http: 400
    condition: "General malformed request"

  - id: ERR_NOT_FOUND
    http: 404
    condition: "Resource not found or wrong hub scope"

  - id: ERR_MISSING_IF_MATCH
    http: 400
    condition: "If-Match header missing on PUT or state-changing action"

  - id: ERR_VERSION_CONFLICT
    http: 409
    condition: "version in request does not match current version"

  - id: ERR_INVALID_STATE
    http: 409
    condition: "Resource is in wrong state for requested operation"

  - id: ERR_POSTURE_LOCKDOWN
    http: 409
    condition: "Hub is in LOCKDOWN; inbound submissions blocked"

  - id: ERR_CONGESTED_INBOUND_LIMIT
    http: 409
    condition: "Inbound units exceed congested limit (floor(staging_free_units/4), min 1)"

  - id: ERR_CAPACITY_EXCEEDED
    http: 409
    condition: "Operation would exceed staging capacity"

  - id: ERR_CONSIGNMENT_HAS_OPEN_HOLD
    http: 409
    condition: "Outbound blocked: consignment has OPEN holds"

  - id: ERR_CONSIGNMENT_EMPTY
    http: 409
    condition: "Outbound units exceed units_on_hand"

  - id: ERR_CONSIGNMENT_BUSY
    http: 409
    condition: "Consignment already has an open move (SUBMITTED/SCHEDULED/ON_HOLD)"

  - id: ERR_CONSTRAINT_VIOLATION
    http: 409
    condition: "Void would cause units_on_hand to go negative"

# =============================================================================
# RBAC Role Permission Matrix
# =============================================================================
roles:
  - name: Any
    description: "DockOps does not define explicit role-based restrictions. All endpoints are accessible to any authenticated user. Concurrency is managed through version field requirements."
    shared_operations:
      - "POST /hubs — Create hub"
      - "GET /hubs/{id} — Get hub"
      - "POST .../consignments — Create consignment"
      - "GET .../consignments/{id} — Get consignment"
      - "POST .../consignments/{id}/void — Void consignment"
      - "POST .../dock_requests — Create dock request"
      - "GET .../dock_requests/{id} — Get dock request"
      - "PUT .../dock_requests/{id} — Update dock request"
      - "POST .../dock_requests/{id}/submit — Submit dock request"
      - "POST .../dock_requests/batch_schedule — Batch schedule"
      - "POST .../dock_requests/{id}/cancel — Cancel dock request"
      - "POST .../dock_requests/{id}/complete — Complete dock request"
      - "POST .../dock_requests/{id}/void — Void dock request"
      - "POST .../holds — Create hold"
      - "GET .../holds/{id} — Get hold"
      - "POST .../holds/{id}/clear — Clear hold"
      - "POST .../holds/{id}/void — Void hold"
      - "POST .../run_ops — Run operations checkpoint"
