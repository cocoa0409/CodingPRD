      - name: protest_weight_tally_is_conserved_across_filing_and_withdrawal
        grounds:
          - entities.FeeStudy.fields.protest_weight_bp
          - entities.FeeStudy.fields.protest_count
          - entities.ProtestFiling.fields.status
          - validations[priority=24]
          - errors.ERR_PROTEST_INVALID_STATE
        distinguishing_aspect: |
          protest_weight_bp and protest_count are running tallies that must always
          equal the sum and the count of the RECORDED filings: 5500bp over 2 filings would
          sustain the protest, withdrawing the 2500bp filing brings the tally back to
          exactly 3000bp over 1 filing, and a second withdraw of the same filing is
          refused with ERR_PROTEST_INVALID_STATE so the weight cannot be subtracted twice
          down to 500. The compensation is what changes the close-window branch from remand
          to PROTEST_CLEARED.
        test_recipe:
          setup:
            - "HARBOR program with protest_threshold_bp 5000 and the PARKS standard only."
            - "One study certified on 2026-01-05 and noticed on 2026-01-15 for 30 days, so protest_window_ends_at is 2026-02-14T00:00:00Z."
            - "Two RECORDED filings: 3000bp and 2500bp, so protest_weight_bp is 5500 and protest_count is 2 - enough to sustain a protest if left alone."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-05T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /fee-programs"
