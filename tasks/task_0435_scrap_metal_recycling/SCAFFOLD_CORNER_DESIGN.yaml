      - name: duplicate_payout_for_ticket_rejected
        claim_type: Violation → Error
        grounds: ["validations[priority=14]", entities.Payout.fields.ticket_id, "errors[ERR_DUPLICATE_PAYOUT]"]
        distinguishing_aspect: "Creating a second Payout for a ticket that already has one returns ERR_DUPLICATE_PAYOUT (409)."
