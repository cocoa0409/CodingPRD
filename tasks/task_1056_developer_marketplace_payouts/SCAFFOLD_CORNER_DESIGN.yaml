scaffold_corner_design:
  - section: entities
    instances:
      - name: corner_developer_create_returns_201_pending_verification
        claim_type: Creation
        grounds: [entities.Developer.fields.status, entities.Developer.fields.payout_hold]
        distinguishing_aspect: "POST /api/developers with all required fields returns 201 and a Developer whose status is PENDING_VERIFICATION, version 1, payout_hold false."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/developers"
              payload: { legal_name: "Fresh Start LLC", email: "fresh@start.test", country_code: "US", tax_id_provided: true }
              as: PlatformAdmin
              captures: { dev_id: $.data.id, dev_status: $.data.status, dev_version: $.data.version }
          assert:
            - "HTTP status is 201"
            - "${dev_status} == PENDING_VERIFICATION"
            - "${dev_version} == 1"
            - "Developer.${dev_id}.payout_hold == false"
            - "Developer.${dev_id}.lifetime_revenue_base_cents == 0"

      - name: corner_developer_get_by_id_returns_stored_row
        claim_type: Retrieval
        grounds: [entities.Developer.fields.legal_name]
        distinguishing_aspect: "GET /api/developers/{id} returns the same legal_name and country_code that were persisted at creation."
        test_recipe:
          setup: ["One developer created with legal_name 'Readback Inc' and country_code 'US'."]
          setup_api_calls:
            - call: "POST /api/developers"
              payload: { legal_name: "Readback Inc", email: "rb@x.test", country_code: "US", tax_id_provided: true }
              as: PlatformAdmin
              captures: { dev_id: $.data.id }
          trigger:
            - call: "GET /api/developers/${dev_id}"
              payload: {}
              as: PlatformAdmin
              captures: { name_back: $.data.legal_name, cc_back: $.data.country_code }
          assert:
            - "${name_back} == Readback Inc"
            - "${cc_back} == US"
            - "HTTP status is 200"

      - name: corner_developers_list_returns_pagination_envelope
        claim_type: Listing
        grounds: [entities.Developer.fields.status]
        distinguishing_aspect: "GET /api/developers with limit 2 and offset 0 returns response_type array, total_count 3 and has_more true."
        test_recipe:
          setup: ["Three developer accounts exist."]
          setup_api_calls:
            - call: "POST /api/developers"
              payload: { legal_name: "Dev One", email: "1@x.test", country_code: "US", tax_id_provided: true }
              as: PlatformAdmin
            - call: "POST /api/developers"
              payload: { legal_name: "Dev Two", email: "2@x.test", country_code: "US", tax_id_provided: true }
              as: PlatformAdmin
            - call: "POST /api/developers"
              payload: { legal_name: "Dev Three", email: "3@x.test", country_code: "DE", tax_id_provided: false }
              as: PlatformAdmin
          trigger:
            - call: "GET /api/developers"
              payload: { limit: 2, offset: 0 }
              as: PlatformAdmin
          assert:
            - "meta.total_count == 3"
            - "meta.has_more == true"
            - "response_type == array and exactly 2 elements are returned"

      - name: corner_developer_get_unknown_id_returns_not_found
        claim_type: Not Found
        grounds: ["errors[ERR_DEVELOPER_NOT_FOUND]"]
        distinguishing_aspect: "GET /api/developers/{id} with a well-formed but unknown UUID returns ERR_DEVELOPER_NOT_FOUND with HTTP 404."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /api/developers/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_DEVELOPER_NOT_FOUND"
            - "HTTP status is 404"

      - name: corner_app_create_missing_required_category_returns_invalid_request
        claim_type: Required Fields
        grounds: ["errors[ERR_INVALID_REQUEST]", entities.App.fields.category]
        distinguishing_aspect: "POST /api/apps omitting the required category field returns ERR_INVALID_REQUEST with HTTP 400 and creates no App."
        test_recipe:
          setup: ["One verified ACTIVE developer."]
          setup_api_calls:
            - call: "POST /api/developers"
              payload: { legal_name: "Missing Fields Co", email: "mf@x.test", country_code: "US", tax_id_provided: true }
              as: PlatformAdmin
              captures: { dev_id: $.data.id }
            - call: "POST /api/developers/${dev_id}/verify"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /api/apps"
              payload: { developer_id: "${dev_id}", name: "No Category", listed_countries: ["US"] }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_REQUEST"
            - "HTTP status is 400"
            - "GET /api/apps with developer_id ${dev_id} returns 0 apps"

      - name: corner_developer_create_omitting_tax_id_provided_defaults_false
        claim_type: Defaults
        grounds: [entities.Developer.fields.tax_id_provided]
        distinguishing_aspect: "POST /api/developers without tax_id_provided stores false, and verification of that account is then rejected with ERR_TAX_ID_REQUIRED."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/developers"
              payload: { legal_name: "No TIN Co", email: "notin@x.test", country_code: "US" }
              as: PlatformAdmin
              captures: { dev_id: $.data.id, tin: $.data.tax_id_provided }
          assert:
            - "${tin} == false"
            - "Developer.${dev_id}.status == PENDING_VERIFICATION"

      - name: corner_purchase_computed_split_fields_are_server_derived
        claim_type: Computed Fields
        grounds: [entities.Purchase.fields.gross_cents, entities.Purchase.fields.tax_cents, entities.Purchase.fields.revenue_base_cents, calculations.purchase_tax_split]
        distinguishing_aspect: "POST /api/purchases returns gross_cents 4000, tax_cents 0 and revenue_base_cents 4000 derived from line_items alone; the client never supplies them."
        test_recipe:
          setup:
            - "US jurisdiction at 0 bps facilitator; verified ACTIVE developer with a LIVE app and ACTIVE USD plan."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/tax-jurisdictions"
              payload: { country_code: "US", vat_rate_bps: 0, marketplace_facilitator: true }
              as: PlatformAdmin
            - call: "POST /api/revenue-share-tiers"
              payload: { label: "BASE", min_cumulative_base_cents: 0, developer_share_bps: 7000 }
              as: PlatformAdmin
            - call: "POST /api/developers"
              payload: { legal_name: "Computed Co", email: "cc@x.test", country_code: "US", tax_id_provided: true }
              as: PlatformAdmin
              captures: { dev_id: $.data.id }
            - call: "POST /api/developers/${dev_id}/verify"
              payload: {}
              as: PlatformAdmin
            - call: "POST /api/apps"
              payload: { developer_id: "${dev_id}", name: "Computed", category: "GAMES", listed_countries: ["US"] }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { app_id: $.data.id, app_v0: $.data.version }
            - call: "POST /api/apps/${app_id}/pricing-plans"
              payload: { kind: "ONE_TIME", price_cents: 2000, currency: "USD", country_code: "US", effective_from: "2026-07-01T00:00:00Z", effective_to: "2027-07-01T00:00:00Z", expected_app_version: "${app_v0}" }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { plan_id: $.data.id }
            - call: "POST /api/apps/${app_id}/submit-for-review"
              payload: { submitted_notes: "v1" }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /api/review-submissions/${sub_id}/triage"
              payload: {}
              as: ReviewAgent
              as_user_id: "agent-1"
            - call: "POST /api/review-submissions/${sub_id}/decision"
              payload: { outcome: "PASSED", decision_reason: "ok" }
              as: ReviewAgent
              as_user_id: "agent-1"
            - call: "POST /api/apps/${app_id}/publish"
              payload: {}
              as: Developer
              as_user_id: "${dev_id}"
          trigger:
            - call: "POST /api/purchases"
              payload: { app_id: "${app_id}", pricing_plan_id: "${plan_id}", buyer_country_code: "US", external_order_ref: "ORD-COMP", line_items: [{ sku: "std", unit_price_cents: 2000, quantity: 2 }] }
              as: StorefrontService
              captures: { p_id: $.data.id, g: $.data.gross_cents, t: $.data.tax_cents, b: $.data.revenue_base_cents }
          assert:
            - "${g} == 4000"
            - "${t} == 0"
            - "${b} == 4000"
            - "Purchase.${p_id}.tax_remitter == MARKETPLACE"
            - "Purchase.${p_id}.settlement_status == UNSETTLED"

      - name: corner_app_system_fields_are_server_minted
        claim_type: System Fields
        grounds: [entities.App.fields.status, entities.App.fields.review_round]
        distinguishing_aspect: "POST /api/apps returns a server-minted UUID id with no type prefix, created_at, updated_at, version 1, status DRAFT and review_round 0 even though none were supplied."
        test_recipe:
          setup: ["One verified ACTIVE developer."]
          setup_api_calls:
            - call: "POST /api/developers"
              payload: { legal_name: "System Fields Co", email: "sf@x.test", country_code: "US", tax_id_provided: true }
              as: PlatformAdmin
              captures: { dev_id: $.data.id }
            - call: "POST /api/developers/${dev_id}/verify"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /api/apps"
              payload: { developer_id: "${dev_id}", name: "SysFields", category: "HEALTH", listed_countries: ["US"] }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { app_id: $.data.id, v: $.data.version, st: $.data.status, rr: $.data.review_round }
          assert:
            - "${v} == 1"
            - "${st} == DRAFT"
            - "${rr} == 0"
            - "${app_id} matches the bare UUID form with no type prefix"
            - "App.${app_id}.policy_strike_count == 0"

      - name: corner_pricing_plan_invalid_kind_enum_returns_invalid_request
        claim_type: Type Constraints
        grounds: [entities.PricingPlan.fields.kind, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "POST /api/apps/{id}/pricing-plans with kind 'RENTAL', which is not a declared enum member, returns ERR_INVALID_REQUEST with HTTP 400."
        test_recipe:
          setup: ["US jurisdiction configured; verified ACTIVE developer owning a DRAFT app."]
          setup_api_calls:
            - call: "POST /api/tax-jurisdictions"
              payload: { country_code: "US", vat_rate_bps: 0, marketplace_facilitator: true }
              as: PlatformAdmin
            - call: "POST /api/developers"
              payload: { legal_name: "Enum Co", email: "en@x.test", country_code: "US", tax_id_provided: true }
              as: PlatformAdmin
              captures: { dev_id: $.data.id }
            - call: "POST /api/developers/${dev_id}/verify"
              payload: {}
              as: PlatformAdmin
            - call: "POST /api/apps"
              payload: { developer_id: "${dev_id}", name: "Enum App", category: "FINANCE", listed_countries: ["US"] }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { app_id: $.data.id, app_v0: $.data.version }
          trigger:
            - call: "POST /api/apps/${app_id}/pricing-plans"
              payload: { kind: "RENTAL", price_cents: 100, currency: "USD", country_code: "US", effective_from: "2026-07-01T00:00:00Z", effective_to: "2027-07-01T00:00:00Z", expected_app_version: "${app_v0}" }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_REQUEST"
            - "HTTP status is 400"
            - "GET /api/apps/${app_id}/pricing-plans returns 0 plans"

      - name: corner_tax_jurisdiction_duplicate_country_code_rejected
        claim_type: Type Constraints
        grounds: ["errors[ERR_JURISDICTION_EXISTS]", "validations[priority=74]"]
        distinguishing_aspect: "A second POST /api/tax-jurisdictions for country_code US returns ERR_JURISDICTION_EXISTS with HTTP 409 and leaves exactly one US row."
        test_recipe:
          setup: ["A US jurisdiction already configured at 0 bps."]
          setup_api_calls:
            - call: "POST /api/tax-jurisdictions"
              payload: { country_code: "US", vat_rate_bps: 0, marketplace_facilitator: true }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/tax-jurisdictions"
              payload: { country_code: "US", vat_rate_bps: 700, marketplace_facilitator: false }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_JURISDICTION_EXISTS"
            - "HTTP status is 409"
            - "GET /api/tax-jurisdictions with country_code US returns exactly 1 row whose vat_rate_bps == 0"

      - name: corner_ledger_entry_has_no_version_and_no_write_endpoint
        claim_type: Immutability
        grounds: [entities.LedgerEntry.fields.entry_type, entities.LedgerEntry.fields.amount_cents]
        distinguishing_aspect: "LedgerEntry is declared common_fields false: the API exposes only GET endpoints for it, and a read of an accrual entry exposes id and created_at but no version or updated_at."
        test_recipe:
          setup:
            - "US jurisdiction at 0 bps facilitator; BASE tier 7000 bps; verified ACTIVE developer with a LIVE app and a captured 10000-cent purchase."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/tax-jurisdictions"
              payload: { country_code: "US", vat_rate_bps: 0, marketplace_facilitator: true }
              as: PlatformAdmin
            - call: "POST /api/revenue-share-tiers"
              payload: { label: "BASE", min_cumulative_base_cents: 0, developer_share_bps: 7000 }
              as: PlatformAdmin
            - call: "POST /api/developers"
              payload: { legal_name: "Immutable Books", email: "ib@x.test", country_code: "US", tax_id_provided: true }
              as: PlatformAdmin
              captures: { dev_id: $.data.id }
            - call: "POST /api/developers/${dev_id}/verify"
              payload: {}
              as: PlatformAdmin
            - call: "POST /api/apps"
              payload: { developer_id: "${dev_id}", name: "Books", category: "FINANCE", listed_countries: ["US"] }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { app_id: $.data.id, app_v0: $.data.version }
            - call: "POST /api/apps/${app_id}/pricing-plans"
              payload: { kind: "ONE_TIME", price_cents: 10000, currency: "USD", country_code: "US", effective_from: "2026-07-01T00:00:00Z", effective_to: "2027-07-01T00:00:00Z", expected_app_version: "${app_v0}" }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { plan_id: $.data.id }
            - call: "POST /api/apps/${app_id}/submit-for-review"
              payload: { submitted_notes: "v1" }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /api/review-submissions/${sub_id}/triage"
              payload: {}
              as: ReviewAgent
              as_user_id: "agent-1"
            - call: "POST /api/review-submissions/${sub_id}/decision"
              payload: { outcome: "PASSED", decision_reason: "ok" }
              as: ReviewAgent
              as_user_id: "agent-1"
            - call: "POST /api/apps/${app_id}/publish"
              payload: {}
              as: Developer
              as_user_id: "${dev_id}"
            - call: "POST /api/purchases"
              payload: { app_id: "${app_id}", pricing_plan_id: "${plan_id}", buyer_country_code: "US", external_order_ref: "ORD-IMM", line_items: [{ sku: "base", unit_price_cents: 10000, quantity: 1 }] }
              as: StorefrontService
              captures: { p_id: $.data.id }
            - call: "POST /api/purchases/${p_id}/capture"
              payload: {}
              as: StorefrontService
          trigger:
            - call: "GET /api/ledger-entries"
              payload: { purchase_id: "${p_id}", entry_type: "ACCRUAL" }
              as: FinanceOps
              as_user_id: "fin-1"
          assert:
            - "Exactly 1 LedgerEntry is returned with entry_type ACCRUAL and amount_cents == 7000"
            - "That entry exposes id and created_at and does not expose a version field"
            - "No POST, PATCH, PUT or DELETE endpoint for /api/ledger-entries exists in the API surface"

      - name: corner_pricing_plan_create_under_unknown_app_returns_app_not_found
        claim_type: Parent Relationships
        grounds: ["errors[ERR_APP_NOT_FOUND]", entities.PricingPlan.fields.app_id]
        distinguishing_aspect: "POST /api/apps/{app_id}/pricing-plans against an unknown app id returns ERR_APP_NOT_FOUND (404) before any OCC or window check runs."
        test_recipe:
          setup: ["US jurisdiction configured; one verified ACTIVE developer with no apps."]
          setup_api_calls:
            - call: "POST /api/tax-jurisdictions"
              payload: { country_code: "US", vat_rate_bps: 0, marketplace_facilitator: true }
              as: PlatformAdmin
            - call: "POST /api/developers"
              payload: { legal_name: "Orphan Plans Co", email: "op@x.test", country_code: "US", tax_id_provided: true }
              as: PlatformAdmin
              captures: { dev_id: $.data.id, dev_v: $.data.version }
            - call: "POST /api/developers/${dev_id}/verify"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /api/apps/00000000-0000-4000-8000-0000000000aa/pricing-plans"
              payload: { kind: "ONE_TIME", price_cents: 100, currency: "USD", country_code: "US", effective_from: "2026-07-01T00:00:00Z", effective_to: "2027-07-01T00:00:00Z", expected_app_version: "${dev_v}" }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_APP_NOT_FOUND"
            - "HTTP status is 404"

  - section: state_machines
    instances:
      - name: corner_payout_batch_created_in_open_state
        claim_type: Initial State
        grounds:
          - state_machines.PayoutBatch.OPEN_to_CALCULATED
          - entities.PayoutBatch.fields.status
        distinguishing_aspect: "POST /api/payout-batches returns status OPEN with line_count 0 and all three totals 0 before any calculation runs."
        test_recipe:
          setup: ["Logical clock at 2026-07-01T00:00:00Z."]
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/payout-batches"
              payload: { payout_currency: "USD", period_start: "2026-07-01T00:00:00Z", period_end: "2026-08-01T00:00:00Z" }
              as: FinanceOps
              as_user_id: "fin-1"
              captures: { b_id: $.data.id, b_status: $.data.status, b_lines: $.data.line_count }
          assert:
            - "${b_status} == OPEN"
            - "${b_lines} == 0"
            - "PayoutBatch.${b_id}.total_payable_cents == 0"
            - "PayoutBatch.${b_id}.total_reserve_cents == 0"

      - name: corner_capture_twice_second_call_rejected
        claim_type: Idempotency
        grounds:
          - state_machines.Purchase.AUTHORIZED_to_CAPTURED
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "A second POST /api/purchases/{id}/capture on an already CAPTURED purchase returns ERR_INVALID_STATE (409) and does not create a second ACCRUAL ledger entry."
        test_recipe:
          setup:
            - "US jurisdiction at 0 bps facilitator; BASE tier 7000 bps; LIVE app owned by a verified ACTIVE developer."
            - "A 10000-cent purchase already captured, producing exactly one ACCRUAL entry of 7000."
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /api/tax-jurisdictions"
              payload: { country_code: "US", vat_rate_bps: 0, marketplace_facilitator: true }
              as: PlatformAdmin
            - call: "POST /api/revenue-share-tiers"
              payload: { label: "BASE", min_cumulative_base_cents: 0, developer_share_bps: 7000 }
              as: PlatformAdmin
            - call: "POST /api/developers"
              payload: { legal_name: "Twice Co", email: "tw@x.test", country_code: "US", tax_id_provided: true }
              as: PlatformAdmin
              captures: { dev_id: $.data.id }
            - call: "POST /api/developers/${dev_id}/verify"
              payload: {}
              as: PlatformAdmin
            - call: "POST /api/apps"
              payload: { developer_id: "${dev_id}", name: "Twice", category: "GAMES", listed_countries: ["US"] }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { app_id: $.data.id, app_v0: $.data.version }
            - call: "POST /api/apps/${app_id}/pricing-plans"
              payload: { kind: "ONE_TIME", price_cents: 10000, currency: "USD", country_code: "US", effective_from: "2026-07-01T00:00:00Z", effective_to: "2027-07-01T00:00:00Z", expected_app_version: "${app_v0}" }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { plan_id: $.data.id }
            - call: "POST /api/apps/${app_id}/submit-for-review"
              payload: { submitted_notes: "v1" }
              as: Developer
              as_user_id: "${dev_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /api/review-submissions/${sub_id}/triage"
              payload: {}
              as: ReviewAgent
              as_user_id: "agent-1"
            - call: "POST /api/review-submissions/${sub_id}/decision"
              payload: { outcome: "PASSED", decision_reason: "ok" }
              as: ReviewAgent
              as_user_id: "agent-1"
            - call: "POST /api/apps/${app_id}/publish"
              payload: {}
              as: Developer
              as_user_id: "${dev_id}"
            - call: "POST /api/purchases"
              payload: { app_id: "${app_id}", pricing_plan_id: "${plan_id}", buyer_country_code: "US", external_order_ref: "ORD-TWICE", line_items: [{ sku: "base", unit_price_cents: 10000, quantity: 1 }] }
              as: StorefrontService
              captures: { p_id: $.data.id }
            - call: "POST /api/purchases/${p_id}/capture"
              payload: {}
              as: StorefrontService
          trigger:
            - call: "POST /api/purchases/${p_id}/capture"
              payload: {}
              as: StorefrontService
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_STATE"
            - "HTTP status is 409"
            - "GET /api/ledger-entries with purchase_id ${p_id} and entry_type ACCRUAL returns exactly 1 entry"
            - "Developer.${dev_id}.lifetime_revenue_base_cents == 10000"

      - name: corner_publish_a_delisted_app_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.App.DRAFT_to_DELISTED
          - "errors[ERR_INVALID_STATE]"
        distinguishing_aspect: "DELISTED is a terminal App state: POST /api/apps/{id}/publish on a DELISTED listing returns ERR_INVALID_STATE (409) and the status stays DELISTED."
        test_recipe:
          setup: ["Verified ACTIVE developer with a DRAFT app that has been delisted by a policy officer."]
          setup_api_calls:
            - call: "POST /api/developers"
