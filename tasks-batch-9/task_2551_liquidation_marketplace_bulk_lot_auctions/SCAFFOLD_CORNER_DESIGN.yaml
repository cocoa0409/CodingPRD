      - name: credit_ceiling_admits_each_bid_alone_but_blocks_the_pair
        claim_type: Aggregate validation
        grounds:
          - validations[priority 16 -> ERR_CREDIT_LIMIT_EXCEEDED]
          - calculations.buyer_exposure
          - entities.BuyerAccount.fields.outstanding_exposure_cents
          - endpoints[POST /liquidation/buyer-accounts/{id}/credit-limits]
