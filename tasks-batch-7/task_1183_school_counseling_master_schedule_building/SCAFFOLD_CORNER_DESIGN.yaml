            - "offset=10 page returns 2 items with has_more == false"
      - name: computed_read_tally_preview_shape
        claim_type: computed_read
        grounds:
          - calculations.section_count_tally
        distinguishing_aspect: "tally-preview returns one row per course with demand > 0; a course with zero requests is absent."
        test_recipe:
          setup:
            - "term COLLECTING; course Z-0 has zero requests; course NZ-1 has 1 SUBMITTED primary"
          setup_api_calls:
            - call: "POST /scheduling/counselors"
              payload: { full_name: "C Z", max_caseload: 50 }
              as: Administrator
              captures: { c_z: "$.data.id" }
            - call: "POST /scheduling/terms"
              payload: { code: "2060-FALL", periods_per_day: 8, max_students_per_section: 32, class_size_target: 25 }
              as: Administrator
              captures: { t_z: "$.data.id" }
            - call: "POST /scheduling/courses"
              payload: { course_code: "Z-0", title: "Zero", credits: 1.0, subject_area: "ELECTIVE", grade_band_min: 9, grade_band_max: 12 }
              as: Administrator
              captures: { k_z: "$.data.id" }
            - call: "POST /scheduling/courses"
              payload: { course_code: "NZ-1", title: "NonZero", credits: 1.0, subject_area: "ELECTIVE", grade_band_min: 9, grade_band_max: 12 }
              as: Administrator
              captures: { k_nz: "$.data.id" }
            - call: "POST /scheduling/students"
              payload: { external_ref: "NZ", full_name: "Nz Stu", grade_level: 9, counselor_id: "${c_z}" }
              as: Administrator
              captures: { s_nz: "$.data.id" }
            - call: "POST /scheduling/course-requests"
              payload: { student_id: "${s_nz}", course_id: "${k_nz}", term_id: "${t_z}", priority_rank: 1 }
              as: Student
              as_user_id: "${s_nz}"
              captures: { rq_nz: "$.data.id" }
            - call: "POST /scheduling/course-requests/${rq_nz}/submit"
              payload: {}
              as: Student
              as_user_id: "${s_nz}"
          trigger:
            - call: "GET /scheduling/terms/${t_z}/tally-preview"
              as: Administrator
              captures: { prev_rows: "$.data" }
          assert:
            - "response contains a row for NZ-1 and NO row for Z-0"
      - name: delete_draft_request_returns_204
        claim_type: standard_crud
        grounds:
          - state_machines.CourseRequest.DRAFT_to_WITHDRAWN
        distinguishing_aspect: "DELETE on a DRAFT request succeeds with 204; DELETE on a SUBMITTED request fails ERR_INVALID_STATE (must unsubmit first)."
        test_recipe:
          setup:
            - "requests rq_del (DRAFT) and rq_sub (SUBMITTED) for student s_del in a COLLECTING term"
          setup_api_calls:
            - call: "POST /scheduling/counselors"
              payload: { full_name: "C Del", max_caseload: 50 }
              as: Administrator
              captures: { c_del: "$.data.id" }
            - call: "POST /scheduling/terms"
              payload: { code: "2061-FALL", periods_per_day: 8, max_students_per_section: 32, class_size_target: 25 }
              as: Administrator
              captures: { t_del: "$.data.id" }
            - call: "POST /scheduling/courses"
              payload: { course_code: "DEL-1", title: "Del1", credits: 1.0, subject_area: "ELECTIVE", grade_band_min: 9, grade_band_max: 12 }
              as: Administrator
              captures: { k_del1: "$.data.id" }
            - call: "POST /scheduling/courses"
              payload: { course_code: "DEL-2", title: "Del2", credits: 1.0, subject_area: "ELECTIVE", grade_band_min: 9, grade_band_max: 12 }
              as: Administrator
              captures: { k_del2: "$.data.id" }
            - call: "POST /scheduling/students"
              payload: { external_ref: "DEL", full_name: "Del Stu", grade_level: 9, counselor_id: "${c_del}" }
              as: Administrator
              captures: { s_del: "$.data.id" }
            - call: "POST /scheduling/course-requests"
              payload: { student_id: "${s_del}", course_id: "${k_del1}", term_id: "${t_del}", priority_rank: 1 }
              as: Student
              as_user_id: "${s_del}"
              captures: { rq_del: "$.data.id" }
            - call: "POST /scheduling/course-requests"
              payload: { student_id: "${s_del}", course_id: "${k_del2}", term_id: "${t_del}", priority_rank: 2 }
              as: Student
              as_user_id: "${s_del}"
              captures: { rq_sub: "$.data.id" }
            - call: "POST /scheduling/course-requests/${rq_sub}/submit"
              payload: {}
              as: Student
              as_user_id: "${s_del}"
          trigger:
            - call: "DELETE /scheduling/course-requests/${rq_del}"
              as: Student
              as_user_id: "${s_del}"
            - call: "DELETE /scheduling/course-requests/${rq_sub}"
              as: Student
              as_user_id: "${s_del}"
              captures: { del_err: "$.data.error_id" }
          assert:
            - "DELETE of DRAFT returns 204"
            - "DELETE of SUBMITTED returns ERR_INVALID_STATE (409)"
      - name: occ_stale_version_on_decide
        claim_type: occ_stale_version
        grounds:
          - "concurrency_rules[change-request-decide-stale-term]"
          - "errors[ERR_STALE_TERM_VERSION]"
        distinguishing_aspect: "decide with expected_term_version one behind the term's current version fails ERR_STALE_TERM_VERSION (412)."
        test_recipe:
          setup:
            - "term CHANGE_WINDOW at version v; change request cr_occ in COUNSELOR_REVIEW"
          setup_api_calls:
            - call: "POST /scheduling/counselors"
              payload: { full_name: "C Occ", max_caseload: 50 }
              as: Administrator
              captures: { c_occ: "$.data.id" }
            - call: "POST /scheduling/terms"
              payload: { code: "2062-FALL", periods_per_day: 8, max_students_per_section: 32, class_size_target: 25 }
              as: Administrator
              captures: { t_occ: "$.data.id" }
            # NOTE for the test-generator: standard chain to COUNSELOR_REVIEW.
            - call: "GET /scheduling/terms/${t_occ}"
              as: Administrator
              captures: { occ_v: "$.data.version" }
          trigger:
            - call: "POST /scheduling/change-requests/${cr_occ}/decide"
              payload: { decision: "APPROVE", expected_term_version: "${occ_v} - 1" }
              as: Administrator
              captures: { occ_err: "$.data.error_id" }
          assert:
            - "error_id == ERR_STALE_TERM_VERSION and HTTP status == 412"
      - name: occ_stale_version_on_rebalance
        claim_type: occ_stale_version
        grounds:
          - "concurrency_rules[rebalance-run-stale-term]"
          - "errors[ERR_STALE_TERM_VERSION]"
        distinguishing_aspect: "rebalance-runs with a stale expected_term_version fails 412; a correct version succeeds and bumps term.rebalance_epoch."
        test_recipe:
          setup:
            - "term LOCKED at version v_lock"
          setup_api_calls:
            - call: "POST /scheduling/counselors"
              payload: { full_name: "C Rb2", max_caseload: 50 }
              as: Administrator
              captures: { c_rb2: "$.data.id" }
            - call: "POST /scheduling/terms"
              payload: { code: "2063-FALL", periods_per_day: 8, max_students_per_section: 32, class_size_target: 25 }
              as: Administrator
              captures: { t_rb2: "$.data.id" }
            # NOTE for the test-generator: standard chain to LOCKED.
            - call: "GET /scheduling/terms/${t_rb2}"
              as: Administrator
              captures: { rb2_v: "$.data.version" }
          trigger:
            - call: "POST /scheduling/terms/${t_rb2}/rebalance-runs"
              payload: { expected_term_version: "${rb2_v} - 1" }
              as: Administrator
              captures: { rb_err: "$.data.error_id" }
            - call: "POST /scheduling/terms/${t_rb2}/rebalance-runs"
              payload: { expected_term_version: "${rb2_v}" }
              as: Administrator
              captures: { rb_ok: "$.data.epoch" }
          assert:
            - "stale call returns ERR_STALE_TERM_VERSION (412) and creates no RebalanceRun"
            - "fresh call succeeds with epoch == 1"
      - name: response_envelope_shape
        claim_type: response_envelope
        grounds:
          - response_envelope
        distinguishing_aspect: "Every success response carries meta.api_request_id, meta.api_request_timestamp, response_type, data; every error carries response_type='error' and data.error_id."
        test_recipe:
          setup:
            - "empty DB"
          setup_api_calls: []
          trigger:
            - call: "POST /scheduling/terms"
              payload: { code: "2064-FALL", periods_per_day: 8, max_students_per_section: 32, class_size_target: 25 }
              as: Administrator
              captures: { env_id: "$.data.id" }
            - call: "GET /scheduling/courses/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              as: Administrator
              captures: { env_err: "$.data.error_id" }
          assert:
            - "success envelope: meta.api_request_id present, response_type == 'object'"
            - "error envelope: response_type == 'error', data.error_id == ERR_NOT_FOUND"

