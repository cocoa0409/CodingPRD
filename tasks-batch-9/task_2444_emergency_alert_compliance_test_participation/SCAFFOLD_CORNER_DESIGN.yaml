              captures: { station_id: "$.data.id" }
            - call: "POST /inspection-requests"
              as: FieldInspector
              as_user_id: insp-1
              payload: { station_id: "${station_id}", requested_document_kinds: ["STATION_LOG", "TEST_LOGS"] }
              captures: { insp1: "$.data.id" }
            - call: "POST /inspection-requests/${insp1}/draft-response"
              as: StationEngineer
              as_user_id: eng-1
              payload: { provided_document_kinds: ["STATION_LOG", "PLAN_COPY"] }
            - call: "POST /_clock/set_current_utc"
              as: ComplianceAdmin
              as_user_id: adm-1
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
          trigger:
            - call: "POST /inspection-requests/${insp1}/submit-response"
