        grounds:
          - validations[priority=11]
          - entities.Hearing.fields.scheduled_date
          - errors[ERR_HEARING_CALENDAR_CONFLICT]
        distinguishing_aspect: "Buffer/gap interval semantics on the Hearing (body-calendar) resource: a second PLANNING_COMMISSION hearing 9 days after an existing one violates the 14-day BODY_MIN_GAP_DAYS buffer -> ERR_HEARING_CALENDAR_CONFLICT."
        test_recipe:
          setup:
            - "One PLANNING_COMMISSION hearing already scheduled 2026-06-11."
          setup_api_calls:
            - call: "POST /hearings"
              payload: { body: "PLANNING_COMMISSION", scheduled_date: "2026-06-11T00:00:00Z", agenda_capacity: 5 }
