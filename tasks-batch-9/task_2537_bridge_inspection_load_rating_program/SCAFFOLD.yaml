      - "ProgramCycle.committed_cents, remaining_cents, programmed_count, identified_count and unprogrammed_cost_cents updated; increments ProgramCycle.version by 1"

  - method: POST
    path: "/project-candidates/{id}/withdraw"
    description: "Withdraw a programmed candidate and release its commitment back to the cycle"
    roles: [DistrictEngineer]
    code: 200
    input: []
    output: ProjectCandidate
    side_effects:
      - "status PROGRAMMED -> WITHDRAWN; withdrawn_at set"
      - "ProgramCycle.committed_cents and remaining_cents restored; programmed_count decremented; increments ProgramCycle.version by 1"

  - method: POST
    path: "/project-candidates/{id}/defer"
    description: "Defer an identified candidate to a later cycle without committing funds"
    roles: [DistrictEngineer]
    code: 200
    input: ["justification?"]
    output: ProjectCandidate
    side_effects:
      - "status IDENTIFIED -> DEFERRED; deferred_at set; cycle counters updated; increments ProgramCycle.version by 1"

  - method: POST
    path: "/program-cycles/{id}/lock"
    description: "Lock the cycle's program so it can be reported to FHWA"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: ProgramCycle
    side_effects:
      - "status PLANNING -> LOCKED; candidate creation, programming, withdrawal and deferral are blocked"

  - method: POST
    path: "/program-cycles/{id}/reopen"
    description: "Reopen a locked cycle for further programming"
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: ProgramCycle
    side_effects:
      - "status LOCKED -> PLANNING"

  - method: POST
    path: "/program-cycles/{id}/federal-submissions"
    description: "Start building a federal reporting submission for the cycle"
    roles: [ProgramAdmin]
    code: 201
    input: [submission_type]
    output: FederalSubmission
    side_effects:
      - "FederalSubmission created in BUILDING with all compliance counters 0"

  - method: GET
    path: "/federal-submissions/{id}"
    description: "Read one federal submission with its compliance snapshot"
    roles: [ProgramAdmin, BridgeInspector, QaReviewer, RatingEngineer, DistrictEngineer, PermitOfficer, FhwaReviewer]
    code: 200
    input: []
    output: FederalSubmission
    side_effects: []

  - method: GET
    path: "/federal-submissions"
    description: "List federal submissions; reverse-reachability channel for FederalSubmission.program_cycle_id"
    roles: [ProgramAdmin, BridgeInspector, QaReviewer, RatingEngineer, DistrictEngineer, PermitOfficer, FhwaReviewer]
    code: 200
    input: ["program_cycle_id?", "status?", "submission_type?", "limit?", "offset?"]
    output: FederalSubmission[]
    side_effects: []

  - method: POST
    path: "/federal-submissions/{id}/submit"
    description: "Send the submission to FHWA. Recomputes the statewide compliance snapshot at the current logical clock and refuses to send while any scour-critical structure lacks an approved plan of action."
    roles: [ProgramAdmin]
    code: 200
    input: []
    output: FederalSubmission
    side_effects:
      - "total_bridge_count, overdue_inspection_count, inspection_compliance_pct, poa_noncompliant_count, open_immediate_finding_count and error_count recomputed"
      - "status -> SUBMITTED; submitted_by_user_id = X-User-ID; the owning ProgramCycle moves LOCKED -> SUBMITTED"

  - method: POST
    path: "/federal-submissions/{id}/review"
    description: "FHWA compliance review. The reviewer may not be the submitter; acceptance requires an inspection compliance percentage of at least 90.00."
    roles: [FhwaReviewer]
    code: 200
    input: [decision]
    output: FederalSubmission
    side_effects:
      - "ACCEPT: status -> ACCEPTED; the owning ProgramCycle moves SUBMITTED -> CLOSED"
      - "REJECT: status -> REJECTED with a rejection_reason_code; the owning ProgramCycle moves SUBMITTED -> LOCKED"

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-ID or X-User-Role header absent, empty, or naming an undeclared role"
  - id: ERR_ROLE_NOT_PERMITTED
    http: 403
    condition: "Authenticated role is not listed in the endpoint's roles"
  - id: ERR_IDENTITY_MISMATCH
    http: 403
    condition: "An entity_backed role names a Personnel id in the payload that differs from X-User-ID"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing required field, unknown enum value, out-of-range number, inverted or zero-length window, or pagination parameter outside limit 1..100 / offset >= 0"

  - id: ERR_BRIDGE_NOT_FOUND
    http: 404
    condition: "No Bridge with the given id, in the path or in a body foreign key including route_bridge_ids"
  - id: ERR_PERSONNEL_NOT_FOUND
    http: 404
    condition: "No Personnel with the given id for team_leader_id, qa_reviewer_id, evaluated_by_id, authorized_by_id or approved_by_id"
  - id: ERR_INSPECTION_RECORD_NOT_FOUND
    http: 404
    condition: "No Inspection, ElementCondition, CriticalFinding or NotificationLog with the given id"
  - id: ERR_RATING_RECORD_NOT_FOUND
    http: 404
    condition: "No LoadRating, ScourEvaluation or PlanOfAction with the given id"
  - id: ERR_PERMIT_NOT_FOUND
    http: 404
    condition: "No PermitApplication or PermitBridgeAnalysis with the given id"
  - id: ERR_PROGRAM_RECORD_NOT_FOUND
    http: 404
    condition: "No ProgramCycle, ProjectCandidate or FederalSubmission with the given id"

  - id: ERR_STALE_BRIDGE_VERSION
    http: 412
    condition: "expected_bridge_version does not equal the Bridge's current version on load-rating creation"
  - id: ERR_STALE_CYCLE_VERSION
    http: 412
    condition: "expected_program_cycle_version does not equal the ProgramCycle's current version on candidate creation"

  - id: ERR_INSPECTION_STATE_INVALID
    http: 409
    condition: "Inspection is not in a state from which the requested transition is declared (e.g. submitting a SUBMITTED inspection, QA-claiming a DRAFT one, adding or editing element conditions after submit, voiding an ACCEPTED inspection)"
  - id: ERR_RATING_STATE_INVALID
    http: 409
    condition: "LoadRating, ScourEvaluation or PlanOfAction is not in a state from which the requested transition is declared (e.g. approving a DRAFT rating, sealing a SEALED rating, finalising a FINAL evaluation, submitting a REQUIRED plan, editing an APPROVED plan)"
  - id: ERR_FINDING_STATE_INVALID
    http: 409
    condition: "CriticalFinding is not in a state from which the requested transition is declared (e.g. resolving a finding whose bridge owner has not yet been notified, mitigating a RESOLVED finding, imposing RESTRICT after CLOSE, or re-imposing the same action)"
  - id: ERR_PERMIT_STATE_INVALID
    http: 409
    condition: "PermitApplication is not in a state from which the requested transition is declared (e.g. deciding a RECEIVED application, re-analysing an ANALYZED one, deciding a REVOKED one)"
  - id: ERR_PROGRAM_STATE_INVALID
    http: 409
    condition: "ProgramCycle, ProjectCandidate or FederalSubmission is not in a state from which the requested transition is declared (e.g. creating candidates in a LOCKED cycle, programming a DEFERRED candidate, submitting while the cycle is PLANNING, reviewing a BUILDING submission, reopening a SUBMITTED cycle)"

  - id: ERR_DUPLICATE_STRUCTURE_NUMBER
    http: 409
    condition: "A Bridge with the same nbi_structure_number already exists"
  - id: ERR_DUPLICATE_PERMIT_NUMBER
    http: 409
    condition: "A PermitApplication with the same permit_number already exists"
  - id: ERR_DUPLICATE_ELEMENT_KEY
    http: 409
    condition: "The inspection already has an ElementCondition with this element_key"

  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "The acting user would perform two duties the domain requires to be separated: QA of their own inspection, approval of their own sealed rating, FHWA review of their own submission, or authorisation of a restriction arising from their own inspection"
  - id: ERR_TEAM_LEADER_NOT_QUALIFIED
    http: 422
    condition: "The named team leader lacks team_leader_certified, has an expired NBIS refresher, or lacks the specialty certificate the inspection type requires"
  - id: ERR_QA_REVIEWER_NOT_QUALIFIED
    http: 422
    condition: "The QA reviewer lacks team_leader_certified or has an expired NBIS refresher"
  - id: ERR_RATING_ENGINEER_NOT_LICENSED
    http: 422
    condition: "The engineer sealing a rating or finalising a scour evaluation lacks load_rating_engineer_licensed, has no pe_license_number, or has an expired refresher"
  - id: ERR_INSPECTION_TYPE_NOT_APPLICABLE
    http: 422
    condition: "UNDERWATER requested on a structure without underwater elements, FRACTURE_CRITICAL on a structure without fracture-critical members, or a scour evaluation on a structure that does not span water"

  - id: ERR_NO_ELEMENT_CONDITIONS
    http: 422
    condition: "Submit attempted on an inspection with zero ElementCondition rows"
  - id: ERR_ELEMENT_GROUP_MISSING
    http: 422
    condition: "A ROUTINE inspection omits one of the three element groups, or a load rating's source inspection reports no SUPERSTRUCTURE element"
  - id: ERR_ELEMENT_QUANTITY_MISMATCH
    http: 422
    condition: "Some element's condition-state quantities do not sum to its total_quantity"
  - id: ERR_PHOTO_DOCUMENTATION_MISSING
    http: 422
    condition: "An element reporting CS3 or CS4 quantity has photo_count 0 or empty defect_notes"
  - id: ERR_ELEMENT_INSPECTION_MISMATCH
    http: 422
    condition: "The finding's element_condition_id does not belong to its source_inspection_id, or that inspection does not belong to its bridge_id"
  - id: ERR_NO_CS4_DEFICIENCY
    http: 422
    condition: "An IMMEDIATE-severity finding is not anchored to an element condition with cs4_qty > 0"
  - id: ERR_SEVERITY_INSUFFICIENT_FOR_CLOSURE
    http: 422
    condition: "restriction_action CLOSE requested on a finding whose severity is URGENT"
  - id: ERR_NOTIFICATION_SEQUENCE
    http: 409
    condition: "FHWA tier notified before the bridge owner, or either tier notified a second time"

  - id: ERR_BRIDGE_ACCESS_BUFFER_CONFLICT
    http: 409
    condition: "Another non-VOIDED inspection on the same bridge has a field window within 72 hours of the requested window"
  - id: ERR_TEAM_LEADER_WINDOW_CONFLICT
    http: 409
    condition: "The named team leader already leads a non-VOIDED inspection whose half-open window overlaps the requested one"
  - id: ERR_INSPECTION_DATE_OUT_OF_WINDOW
    http: 422
    condition: "inspection_date lies outside the inspection's field window or after the logical clock"

  - id: ERR_RATING_SOURCE_NOT_ACCEPTED
    http: 422
    condition: "The load rating's source inspection is not an ACCEPTED inspection of the same bridge"
  - id: ERR_SCOUR_CRITICAL_POA_MISSING
    http: 422
    condition: "A federal submission is sent while some bridge has poa_compliant == false"
  - id: ERR_PERMIT_DECISION_MISMATCH
    http: 422
    condition: "The submitted permit decision differs from the analysis-derived recommended_decision"
  - id: ERR_HIGHER_PRIORITY_CANDIDATE_PENDING
    http: 409
    condition: "A higher-ranked IDENTIFIED candidate in the same cycle still fits inside remaining_cents"
  - id: ERR_BUDGET_EXCEEDED
    http: 422
    condition: "The candidate's estimated_cost_cents exceeds the cycle's remaining_cents"
  - id: ERR_COMPLIANCE_BELOW_THRESHOLD
    http: 422
    condition: "Acceptance attempted while inspection_compliance_pct is below 90.00"
  - id: ERR_BRIDGE_NOT_INSPECTED
    http: 422
    condition: "Candidate creation attempted for a bridge with no ACCEPTED inspection"

# =============================================================================
# §1.7 RBAC Matrix (role_model: segregation_of_duties)
# =============================================================================
roles:
  - name: ProgramAdmin
    description: "State bridge unit program administrator: maintains the inventory and personnel roster, owns program cycles and federal submissions, and drives the logical clock in test environments"
    identity: opaque
    exclusive_operations:
      - "POST /personnel"
      - "POST /bridges"
      - "PATCH /bridges/{id}"
      - "POST /program-cycles"
      - "POST /program-cycles/{id}/lock"
      - "POST /program-cycles/{id}/reopen"
      - "POST /program-cycles/{id}/federal-submissions"
      - "POST /federal-submissions/{id}/submit"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "every GET endpoint"

  - name: BridgeInspector
    description: "Certified field inspector who leads inspections, records element-level condition with photographic documentation, raises critical findings and drafts plans of action"
    identity: "entity_backed:Personnel"
    exclusive_operations:
      - "POST /bridges/{id}/inspections"
      - "POST /inspections/{id}/element-conditions"
      - "PUT /element-conditions/{id}"
      - "DELETE /element-conditions/{id}"
      - "POST /inspections/{id}/submit"
      - "POST /inspections/{id}/void"
    shared_operations:
      - "POST /critical-findings"
      - "POST /bridges/{id}/scour-evaluations"
      - "PUT /plans-of-action/{id}"
      - "POST /plans-of-action/{id}/submit"
      - "every GET endpoint"

  - name: QaReviewer
    description: "Quality-assurance reviewer of inspection reports; claims a submitted report and either returns it for revision or accepts it, and may never review a report they led"
    identity: "entity_backed:Personnel"
    exclusive_operations:
      - "POST /inspections/{id}/qa-claim"
      - "POST /inspections/{id}/qa-decision"
    shared_operations:
      - "POST /critical-findings"
      - "every GET endpoint"

  - name: RatingEngineer
    description: "Licensed professional engineer who computes and seals load ratings and finalises scour evaluations; may never approve a rating they sealed"
    identity: "entity_backed:Personnel"
    exclusive_operations:
      - "POST /bridges/{id}/load-ratings"
      - "POST /load-ratings/{id}/seal"
      - "POST /scour-evaluations/{id}/finalize"
    shared_operations:
      - "POST /bridges/{id}/scour-evaluations"
      - "every GET endpoint"

  - name: DistrictEngineer
    description: "District bridge engineer holding restriction and closure authority; approves sealed load ratings and plans of action, and programs repair, rehabilitation and replacement candidates against the cycle budget"
    identity: "entity_backed:Personnel"
    exclusive_operations:
      - "POST /critical-findings/{id}/impose-restriction"
      - "POST /critical-findings/{id}/notify"
      - "POST /critical-findings/{id}/mitigate"
      - "POST /critical-findings/{id}/resolve"
      - "POST /load-ratings/{id}/approve"
      - "POST /load-ratings/{id}/reject"
      - "POST /plans-of-action/{id}/decision"
      - "POST /program-cycles/{id}/candidates"
      - "POST /project-candidates/{id}/program"
      - "POST /project-candidates/{id}/withdraw"
      - "POST /project-candidates/{id}/defer"
    shared_operations:
      - "PUT /plans-of-action/{id}"
      - "POST /plans-of-action/{id}/submit"
      - "every GET endpoint"

  - name: PermitOfficer
    description: "Oversize/overweight permit officer: receives permit applications, runs bridge-by-bridge permit vehicle analysis and issues the permit decision the analysis supports"
    identity: opaque
    exclusive_operations:
      - "POST /permit-applications"
      - "POST /permit-applications/{id}/analyze"
      - "POST /permit-applications/{id}/decide"
    shared_operations:
      - "every GET endpoint"

  - name: FhwaReviewer
    description: "Federal Highway Administration compliance reviewer who accepts or rejects the state's federal submissions, and may never review a submission they sent"
    identity: opaque
    exclusive_operations:
      - "POST /federal-submissions/{id}/review"
    shared_operations:
      - "every GET endpoint"
