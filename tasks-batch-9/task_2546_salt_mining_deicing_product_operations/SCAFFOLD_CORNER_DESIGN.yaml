      - name: activation_one_second_after_the_preseason_lock_is_refused
        claim_type: temporal_validation
        grounds:
          - "validations[priority=30]"
          - errors[ERR_PRESEASON_WINDOW_CLOSED]
          - "endpoints[POST /_clock/set_current_utc]"
        distinguishing_aspect: |
          The window edge is driven by the injectable logical clock, not by wall time: at the lock
          instant itself activation succeeds, and one second later the identical call on a sibling
          contract is refused. Priority 30 also outranks the pre-season coverage floor (38), so the
          refusal is the window error even though there is no stockpile at all.
        test_recipe:
          setup:
            - "One forecast locked at 2026-10-15T00:00:00Z with two AWARDED contracts on it and no stockpile anywhere."
          setup_api_calls:
            - call: "POST /salt/season-forecasts"
              payload: { season_code: "2026-27", region_code: "NY-CENTRAL", normal_season_tons: 20000, severity_index: 60, prior_season_1_actual_tons: 21000, prior_season_2_actual_tons: 19000, prior_season_3_actual_tons: 18000, method: "SEVERITY_WEIGHTED", preseason_lock_date: "2026-10-15T00:00:00Z" }
              as: ContractAdministrator
              captures: { fc_id: "$.data.id" }
            - call: "POST /salt/bid-contracts"
              payload: { season_forecast_id: "${fc_id}", customer_name: "City of Syracuse", jurisdiction_level: "MUNICIPAL", state_code: "NY", product_line: "HIGHWAY_DEICING", committed_tons: 1000, guaranteed_price_per_ton: 80.00, min_take_pct: 0, max_take_pct: 110, failure_to_supply_penalty_per_ton: 30.00, price_guarantee_cap_pct: 10 }
              as: ContractAdministrator
              as_user_id: "ca-submitter"
              captures: { c_early: "$.data.id" }
            - call: "POST /salt/bid-contracts/${c_early}/submit"
              payload: {}
              as: ContractAdministrator
              as_user_id: "ca-submitter"
            - call: "POST /salt/bid-contracts/${c_early}/decision"
              payload: { outcome: "AWARD" }
              as: ContractAdministrator
              as_user_id: "ca-decider"
            - call: "POST /salt/bid-contracts"
              payload: { season_forecast_id: "${fc_id}", customer_name: "Town of Camillus", jurisdiction_level: "MUNICIPAL", state_code: "NY", product_line: "HIGHWAY_DEICING", committed_tons: 1000, guaranteed_price_per_ton: 80.00, min_take_pct: 0, max_take_pct: 110, failure_to_supply_penalty_per_ton: 30.00, price_guarantee_cap_pct: 10 }
              as: ContractAdministrator
              as_user_id: "ca-submitter"
              captures: { c_late: "$.data.id" }
            - call: "POST /salt/bid-contracts/${c_late}/submit"
              payload: {}
              as: ContractAdministrator
              as_user_id: "ca-submitter"
            - call: "POST /salt/bid-contracts/${c_late}/decision"
              payload: { outcome: "AWARD" }
              as: ContractAdministrator
              as_user_id: "ca-decider"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-15T00:00:00Z" }
              as: ContractAdministrator
          trigger:
            - call: "POST /salt/bid-contracts/${c_early}/activate"
              payload: {}
              as: ContractAdministrator
              as_user_id: "ca-decider"
              captures: { st_early: "$.data.status" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-15T00:00:01Z" }
              as: ContractAdministrator
            - call: "POST /salt/bid-contracts/${c_late}/activate"
              payload: {}
              as: ContractAdministrator
              as_user_id: "ca-decider"
          assert:
            - "the first activate -> HTTP 200 with ${st_early} == ACTIVE (at the lock instant is inside the window)"
            - "the second activate -> HTTP 409 with error code ERR_PRESEASON_WINDOW_CLOSED, not ERR_PRESEASON_COVERAGE_SHORT"
            - "BidContract.${c_late}.status is still AWARDED and its version is unchanged"
            - "min_take_pct 0 makes the coverage floor 0.00, so priority 38 could never have fired on either call"

      - name: rework_shrinks_the_batch_until_it_finally_fits_the_covered_pad
        claim_type: cascading_validation
        grounds:
          - "validations[priority=34]"
          - state_machines.TreatmentBatch.PENDING_to_PENDING
          - calculations.treatment_yield_and_purity
          - state_machines.Depot.OPEN_to_SURGE
        distinguishing_aspect: |
          One rejection cascades into a remediation that changes the very quantity being validated:
          940.00 t will not fit a 900.00 t covered pad, the first REWORK shrinks it to 911.80 t which
          still will not fit, and only the second REWORK's 884.45 t passes — landing at 98.27 %
          utilization, which then trips the auto-SURGE threshold in the same request.
        test_recipe:
          setup:
            - "Mine, PRODUCING panel P-1 (grade 96.00), one run hoisted with 1000 t, and Syracuse Depot deliberately built with only 900 t of covered capacity."
          setup_api_calls:
            - call: "POST /salt/mines"
              payload: { name: "Retsof Salt Mine", state_code: "NY", rated_hoist_tons_per_day: 24000 }
              as: MinePlanner
              captures: { mine_id: "$.data.id" }
            - call: "POST /salt/panels"
              payload: { mine_id: "${mine_id}", panel_code: "P-1", gross_tons_in_place: 100000, extraction_ratio_pct: 50, grade_pct_nacl: 96.00, insolubles_pct: 2.00 }
              as: MinePlanner
              captures: { panel_id: "$.data.id" }
            - call: "POST /salt/panels/${panel_id}/develop"
              payload: {}
              as: MinePlanner
            - call: "POST /salt/panels/${panel_id}/start-production"
              payload: {}
              as: MinePlanner
            - call: "GET /salt/mines/${mine_id}"
              payload: {}
              as: MinePlanner
              captures: { mine_v: "$.data.version" }
            - call: "POST /salt/production-runs"
              payload: { mine_id: "${mine_id}", panel_id: "${panel_id}", planned_tons: 1000, hoist_window_start: "2026-08-02T00:00:00Z", hoist_window_end: "2026-08-03T00:00:00Z", expected_mine_version: "${mine_v}" }
              as: MinePlanner
              captures: { run_id: "$.data.id" }
            - call: "POST /salt/production-runs/${run_id}/hoist"
              payload: { hoisted_tons: 1000 }
              as: MinePlanner
            - call: "POST /salt/depots"
              payload: { name: "Syracuse Depot", state_code: "NY", covered_capacity_tons: 900, open_pad_capacity_tons: 5000, loadout_rate_tons_per_hour: 500, outbound_freight_rate_per_ton: 12.500 }
              as: LogisticsPlanner
              captures: { depot_a: "$.data.id" }
            - call: "POST /salt/treatment-batches"
              payload: { production_run_id: "${run_id}", depot_id: "${depot_a}", product_line: "HIGHWAY_DEICING", screen_spec: "COARSE", anticaking_ppm: 20.00, corrosion_inhibitor_pct: 0.50, input_tons: 1000, moisture_pct: 0.00, storage_kind: "COVERED" }
              as: QualityLab
              as_user_id: "ql-maker-1"
              captures: { batch_id: "$.data.id" }
          trigger:
            - call: "POST /salt/treatment-batches/${batch_id}/qc-decision"
              payload: { decision: "PASS" }
              as: QualityLab
              as_user_id: "ql-checker-1"
            - call: "POST /salt/treatment-batches/${batch_id}/qc-decision"
              payload: { decision: "REWORK" }
              as: QualityLab
              as_user_id: "ql-checker-1"
              captures: { y1: "$.data.yield_tons" }
            - call: "POST /salt/treatment-batches/${batch_id}/qc-decision"
              payload: { decision: "PASS" }
              as: QualityLab
              as_user_id: "ql-checker-1"
            - call: "POST /salt/treatment-batches/${batch_id}/qc-decision"
              payload: { decision: "REWORK" }
              as: QualityLab
              as_user_id: "ql-checker-1"
              captures: { y2: "$.data.yield_tons" }
            - call: "POST /salt/treatment-batches/${batch_id}/qc-decision"
              payload: { decision: "PASS" }
              as: QualityLab
              as_user_id: "ql-checker-1"
              captures: { qc: "$.data.qc_state" }
            - call: "GET /salt/depots/${depot_a}/storage-posture"
              payload: {}
              as: LogisticsPlanner
              captures: { util: "$.data.covered_utilization_pct", stored: "$.data.covered_stored_tons", thresh: "$.data.auto_surge_threshold_pct", dstate: "$.data.depot_state" }
          assert:
            - "PASS #1 -> HTTP 409 ERR_COVERED_CAPACITY_EXCEEDED (0 + 940.00 > 900)"
            - "REWORK #1 -> HTTP 200 with ${y1} == 911.80 and rework_count == 1"
            - "PASS #2 -> HTTP 409 ERR_COVERED_CAPACITY_EXCEEDED again (0 + 911.80 > 900) — the cascade has not converged yet"
            - "REWORK #2 -> HTTP 200 with ${y2} == 884.45 and rework_count == 2"
            - "PASS #3 -> HTTP 200 with ${qc} == PASSED"
            - "${stored} == 884.45, ${util} == 98.27 and ${thresh} == 90"
            - "${dstate} == SURGE — the QC PASS side effect tripped the threshold, and storm_state_set_by_user_id is null because no manual posture call ever happened"
            - "the minted lot has tons_on_hand == 884.45 and purity_pct_nacl == 96.500 (purity was never recomputed by the reworks)"
            - "ProductionRun.${run_id}.open_batch_count == 0 and status == CLOSED"

      - name: safety_check_outranks_the_capacity_check_on_run_create
        claim_type: priority_ordering
        excluded_because:
          difficulty_instance: withdrawal_order_safety_outranks_hoist_capacity_constraint_on_run_create
          rationale: |
            One request that violates validations[priority=22] and validations[priority=31]
            simultaneously is asserted there to return ERR_MINE_WITHDRAWAL_ORDER_ACTIVE, and the
            reverse-order single-violation controls are asserted alongside it.

      - name: contract_state_versus_take_band_on_the_same_request
        claim_type: priority_conflict
        excluded_because:
          difficulty_instance: contract_state_outranks_take_band_fiscal_check_on_order_create
          rationale: |
            The state-versus-fiscal conflict (validations[priority=11] beating validations[priority=37]
            on a single POST /salt/delivery-orders that violates both) is the entire subject of that
            instance.

