              as: DevelopmentOfficer
              as_user_id: "officer-1"
              captures: { cc_v2: "$.data.version" }
          trigger:
            - call: "POST /athletics/donors/${cc_id}/status-change"
              payload: { new_status: "LAPSED", effective_date: "2026-04-02T00:00:00.000Z", reason: "Cycle lapse", expected_donor_version: "${cc_v2}" }
              as: DevelopmentOfficer
              as_user_id: "officer-1"
              captures: { cc_v3: "$.data.version" }
            - call: "POST /athletics/donors/${cc_id}/status-change"
