              as: SustainabilityManager
              as_user_id: "sm-carol"
              captures: { clU: $.data.id }
          trigger:
            - call: "POST /carpetloop/carbon-claims/${clN}/submit"
              payload: {}
              as: SustainabilityManager
              as_user_id: "sm-carol"
              captures: { err: $.data.error_id }
            - call: "POST /carpetloop/carbon-claims/${clU}/submit"
              payload: {}
              as: SustainabilityManager
