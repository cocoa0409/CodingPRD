      - name: boundary_zero_min_evidence_count_admits_an_empty_evidence_set
        grounds:
          - entities.RoutingRequirement.fields.min_evidence_count
          - state_machines.ComplianceViolation.initial_state
          - validations[priority=10]
          - endpoints[POST /compliance/shipments/{id}/violations]
        distinguishing_aspect: |
          METRIC: evidence-set CARDINALITY at the degenerate lower bound, on the violation-creation
          endpoint. min_evidence_count == 0 means the empty set already satisfies the requirement,
          so the violation must be born EVIDENCE_COMPLETE with evidence_count 0 rather than
          DETECTED, and the later assessment must NOT raise ERR_EVIDENCE_INSUFFICIENT. An
          implementation that requires at least one item, or that treats 0 as "unset" and falls
          back to 1, leaves the row in DETECTED and fails the assessment.
        test_recipe:
          setup:
            - "Vendor V-1203 with a PUBLISHED guide carrying TIER_3 DOC-03 whose min_evidence_count is 0 (fixed_fee 15000, per_unit 10, handling 1.00, min_fee 15000, cap 100000)."
            - "One 1000-unit / 500-cent shipment received on 2026-08-10, invoice_value_cents 500000, no violations yet."
