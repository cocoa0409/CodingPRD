          trigger:
            - call: "POST /innovation-projects/${os_p_id}/concept-tests"
              payload: { test_type: "MONADIC", sample_size: 300, purchase_intent_top2_pct: 80.00, uniqueness_pct: 40.00, fielded_at: "2026-07-01T00:00:00Z" }
              as: InnovationLead
              captures: { os_ct_id: $.data.id }
            - call: "POST /innovation-projects/${os_p_id}/deliverables"
              payload: { gate_id: "${os_g2_id}", deliverable_type: "CONSUMER_CONCEPT_TEST", owner_function: "MARKETING" }
              as: GateChair
              as_user_id: "chair-os"
              captures: { os_d_id: $.data.id }
            - call: "POST /innovation-projects/${os_p_id}/business-cases"
              payload: { expected_project_version: "${os_p_v1}", variant_mode: "TOP_DOWN", category_size_units_year: 4000000, target_share_pct: 4.00, cogs_per_unit_usd: 2.5000, slotting_fees_usd: 0.00, capex_usd: 100000.00, discount_rate_pct: 10.00 }
              as: InnovationLead
            - call: "POST /innovation-projects/${os_p_id}/business-cases"
              payload: { expected_project_version: "${os_p_v2}", variant_mode: "TOP_DOWN", category_size_units_year: 4000000, target_share_pct: 4.00, cogs_per_unit_usd: 2.5000, slotting_fees_usd: 0.00, capex_usd: 100000.00, discount_rate_pct: 10.00 }
              as: InnovationLead
              captures: { os_bc_id: $.data.id }
          assert:
            - "the concept test and the checklist item are both created 201 with no version token in either body"
            - "the stale business case call returns 412 with error_id ERR_PROJECT_VERSION_CONFLICT"
            - "InnovationProject.${os_p_id}.version is still ${os_p_v2} immediately after the 412, so a refused write does not consume a version"
            - "the retry quoting ${os_p_v2} returns 201 and BusinessCase.${os_bc_id}.case_type == PRELIMINARY"
            - "GET /innovation-projects/${os_p_id}/business-cases returns total_count 1, so the refused attempt stored nothing"
            - "ConceptTest.${os_ct_id} and Deliverable.${os_d_id} are both still readable, unaffected by the intervening 412"

      - name: val_state_check_precedes_version_check
        claim_type: priority_ordering
        grounds:
          - validations[priority 6]
          - validations[priority 7]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / state_check_precedes_occ_on_superseded_formulation
          rationale: "That instance sends a stale version at a SUPERSEDED formulation and pins ERR_FORMULATION_INVALID_STATE over the 412."

      - name: val_version_check_precedes_fiscal_check
        claim_type: priority_ordering
        grounds:
          - validations[priority 7]
          - validations[priority 13].ERR_DEV_BUDGET_EXCEEDED
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / occ_check_precedes_dev_budget_on_stale_formulation
          rationale: "That instance sends one request that is both stale and over budget and pins the 412 ahead of the 422."

      - name: val_quorum_check_precedes_checklist_check
        claim_type: priority_ordering
        grounds:
          - validations[priority 9].ERR_QUORUM_NOT_MET
          - validations[priority 12].ERR_DELIVERABLE_CHECKLIST_INCOMPLETE
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / quorum_check_precedes_checklist_completeness_on_close
          rationale: "That instance closes a review that is short a vote and short a deliverable and pins the 409 ahead of the 422."

