              captures: { roll_fin: $.data.rolling_fill_rate_pct, stat_fin: $.data.status }
            - call: "GET /supply/inventory-programs/${prog_id}"
              payload: {}
              as: SupplyChainAdmin
              captures: { muted_fin: $.data.auto_replenish_enabled }
          assert:
            - "After O1 received (observed via GET between the receipts): rolling_fill_rate_pct == 60.00 and status == SUSPENDED"
            - "After O2 received (observed via GET): rolling_fill_rate_pct == 73.33 ((60+50)/150), status still SUSPENDED, program muted (auto_replenish_enabled == false)"
            - "Clock advanced 96 days: O1 (received 2026-09-01) falls outside the trailing 90-day window"
            - "After O3 received at 2026-12-06: rolling_fill_rate_pct == 100.00 ((50+50)/(50+50)), NOT 80.00 (which would wrongly include O1)"
            - "Agreement auto-recovers SUSPENDED -> ACTIVE and InventoryProgram.${prog_id}.auto_replenish_enabled == true"
