              payload: { staff_member_id: "${coach_id}", cert_code: "CSCS", issued_on: "2023-08-15", expires_on: "2026-08-15", ceu_credits_required: 6 }
              as: PerformanceDirector
              captures: { cert_id: $.data.id }
