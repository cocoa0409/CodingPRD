            - "the post create returns 201 with ${p_state} == PUBLISHED"
            - "the data control returns 201 with ${dc_type} == OPT_OUT_SHARING and ${dc_affected} == 1"
            - "${dc_id} is a fresh DataControlAction row and Resident.${r_id}.data_sharing_opt_out == true"
            - "Device.${d_id}.auto_decline_requests == true and Device.${d_id}.auto_decline_source == OPT_OUT"

