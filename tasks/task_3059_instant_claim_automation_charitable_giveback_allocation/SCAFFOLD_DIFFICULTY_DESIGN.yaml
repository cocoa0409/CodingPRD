        distinguishing_aspect: |
          THIRD distinct interval semantics — cross-resource interval
          intersection: an appeal is valid only inside the claim's 30-day window
          AND the claim's lifecycle window; once the denied claim's 30-day
          window has elapsed (clock moved past deadline) the appeal fails with
          ERR_APPEAL_WINDOW_CLOSED even though the claim is still DENIED —
