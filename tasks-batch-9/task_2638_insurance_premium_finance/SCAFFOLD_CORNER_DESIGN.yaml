              as: ComplianceOfficer
            - call: "POST /agreements/${dv_t}/cancellation-executions"
              payload: {}
              as: FinanceAnalyst
              as_user_id: "analyst-execute"
              captures: { dv_t_reqs: "$.data.requests_created", dv_t_unearned: "$.data.estimated_unearned_premium_cents", dv_t_rebate: "$.data.rebate_applied_cents", dv_t_gross: "$.data.gross_balance_cents" }
            - call: "POST /agreements/${dv_k}/cancellation-executions"
              payload: {}
              as: FinanceAnalyst
              as_user_id: "analyst-execute"
              captures: { dv_k_reqs: "$.data.requests_created", dv_k_unearned: "$.data.estimated_unearned_premium_cents", dv_k_rebate: "$.data.rebate_applied_cents", dv_k_gross: "$.data.gross_balance_cents" }
            - call: "GET /policies/${dv_t600}"
              payload: {}
              as: FinanceAnalyst
              as_user_id: "analyst-execute"
              captures: { dv_t600_est: "$.data.unearned_premium_estimate_cents", dv_t600_earned: "$.data.earned_days", dv_t600_status: "$.data.status" }
            - call: "GET /policies/${dv_k600}"
              payload: {}
              as: FinanceAnalyst
