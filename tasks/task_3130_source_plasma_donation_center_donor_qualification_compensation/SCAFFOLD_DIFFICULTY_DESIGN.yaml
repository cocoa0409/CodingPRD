              as: PlatformAdmin
            - call: "POST /donors"
              payload: { external_donor_ref: "DL-TX-000001", legal_first_name: "Jane", legal_last_name: "Doe", date_of_birth: "1990-04-12", weight_kg: 72.5, home_center_id: "${c}" }
