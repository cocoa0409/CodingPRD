      - name: surrogate_fields_required_exactly_when_capacity_is_absent
        claim_type: violation_to_error
        grounds:
          - validations[priority=37]
          - errors[ERR_SURROGATE_REQUIRED]
          - entities.CapacityDetermination.fields.surrogate_authority_scope
        distinguishing_aspect: "Priority 37 is a biconditional, not a presence check: all three surrogate fields must be supplied when capacity_present is false and all three must be absent when it is true, so the omission case, the partial-triple case and the forbidden-presence case all return 422 ERR_SURROGATE_REQUIRED."
        test_recipe:
          setup:
            - "Roster: intake clinician Nolan and psychiatrist Reyes; one unit; clock set to 2026-09-03T08:00:00Z."
            - "One adult patient with a SIGNED evaluation scoring 8 and a VOLUNTARY admission in PENDING_PLACEMENT, whose version is read before the determinations."
          setup_api_calls:
            - call: "POST /behavioral-health/clinicians"
              payload: { full_name: "Iris Nolan", staff_role: "INTAKE_CLINICIAN", license_number: "LIC-INT-2367-1" }
              as: ComplianceOfficer
              captures: { c_int: $.data.id }
            - call: "POST /behavioral-health/clinicians"
              payload: { full_name: "Dr Alma Reyes", staff_role: "PSYCHIATRIST", license_number: "LIC-PSY-2367-1" }
