            - "GET /growers/${grower_id} -> acres_included_ytd == 100 (link 1 side-effect)"
            - "GET /deliverables/${d_id} -> status == READY, anomaly_count == 200  (link 2)"
            - "GET /fields/${field_id}/alerts -> one alert with severity == HIGH  (link 2 side-effect; anomaly_count 200 >= 50)"
            - "GET /fields/${field_id} -> health_score == max(0, min(100, 50 - 12)) == 38  (link 3: ndvi base 50, HIGH penalty 12)"

  # ===========================================================================
  # Rule 5 — priority_pair_validation_conflict (≥2 instances, different category pairs)
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_safety_on_authorize
        grounds:
          - validations[priority=4]
          - validations[priority=5]
        distinguishing_aspect: |
          Category pair: state (priority 4) vs business_safety (priority 5).
          A mission in CAPTURED (wrong state for authorize) AND with an
          expired pilot cert must fail with the state error
          (ERR_INVALID_STATE / ERR_MISSION_NOT_PLANNED), NOT the safety error
          (ERR_PILOT_CERT_EXPIRED). State wins over safety.
        test_recipe:
          setup:
            - "Plan P; Grower G; Field F; Pilot H with part107_expires_on=2026-01-01 (already expired by setup clock)"
            - "Mission M created with scheduled_start=2026-06-02, scheduled_end=2026-06-02+2h, pilot H"
            - "M is run all the way to CAPTURED state (authorize uses a fresh valid pilot; then pilot is swapped is not allowed — instead make M's own pilot valid during authorize, and switch by a different mechanism)"
          setup_api_calls:
            - call: "POST /ag-drone/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /ag-drone/subscription-plans"
              payload: { plan_code: "P", included_acres_per_year: 500, base_fee_cents: 0, overage_rate_cents_per_acre: 300, spray_allowed: false, ndvi_turnaround_hours: 24, storage_retention_days: 90 }
              as: OpsAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /ag-drone/growers"
              payload: { legal_name: "PV Farms", contact_email: "pv@x.com", subscription_plan_id: "${plan_id}", subscription_started_on: "2026-01-01", liability_coverage_cents: 50000000 }
              as: OpsAdmin
              captures: { grower_id: $.data.id }
            - call: "POST /ag-drone/growers/${grower_id}/fields"
              payload: { field_name: "F", legal_acres: 100, airspace_class: "G", insurance_policy_no: "POL-PV" }
              as: OpsAdmin
              captures: { field_id: $.data.id }
            # Valid pilot used to drive mission into CAPTURED
            - call: "POST /ag-drone/pilots"
              payload: { pilot_name: "Valid Pilot", part107_certificate_no: "P107-V", part107_expires_on: "2027-01-01" }
              as: OpsAdmin
              captures: { pilot_valid_id: $.data.id }
            # Expired pilot for the negative assertion payload
            - call: "POST /ag-drone/pilots"
              payload: { pilot_name: "Expired Pilot", part107_certificate_no: "P107-X", part107_expires_on: "2026-01-01" }
              as: OpsAdmin
              captures: { pilot_expired_id: $.data.id }
            - call: "POST /ag-drone/fields/${field_id}/missions"
              payload: { mission_type: "SCOUT", pilot_id: "${pilot_valid_id}", scheduled_start: "2026-06-02T08:00:00Z", scheduled_end: "2026-06-02T10:00:00Z", acres_planned: 50 }
              as: FlightCoordinator
              captures: { m_id: $.data.id }
            - call: "POST /ag-drone/missions/${m_id}/authorize"
              payload: {}
              as: FlightCoordinator
            - call: "POST /ag-drone/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-02T08:30:00Z" }
              as: OpsAdmin
            - call: "POST /ag-drone/missions/${m_id}/launch"
              payload: {}
              as: RemotePilot
              as_user_id: "${pilot_valid_id}"
            - call: "POST /ag-drone/missions/${m_id}/capture"
              payload: { acres_flown: 50, wind_kt_max_observed: 5 }
              as: RemotePilot
              as_user_id: "${pilot_valid_id}"
            # Note: pilot_valid_id is still ACTIVE here; cert expiry is a property of the pilot.
            # To force a safety-vs-state conflict on /authorize, we invoke /authorize on a
            # CAPTURED mission (wrong state) — the state error must win over any
            # safety checks the implementation might also flag.
          trigger:
            - call: "POST /ag-drone/missions/${m_id}/authorize"
              payload: {}
              as: FlightCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_MISSION_NOT_PLANNED or err == ERR_INVALID_STATE  # state category (priority 4) wins over any safety / constraint check"

      - name: business_safety_vs_business_temporal_on_launch
        grounds:
          - validations[priority=6]
          - validations[priority=13]
        distinguishing_aspect: |
          Category pair: business_safety (priority 6, authorization still
          ACTIVE) vs business_temporal (priority 13, launch within scheduled
          window). A launch attempted OUTSIDE [scheduled_start, scheduled_end)
          AND after the authorization has been revoked must fail with the
          safety error (ERR_AUTH_NOT_ACTIVE at priority 6 wins over
          ERR_OUTSIDE_WINDOW at priority 13).
        test_recipe:
          setup:
            - "Plan P; Grower G; Field F with airspace_class=B (laanc_required=true)"
            - "Authorization Auth on F covering 2026-06-02T08:00:00Z to 2026-06-02T11:00:00Z, status ACTIVE"
            - "Pilot H; Mission M on F authorized with scheduled 08:00-10:00 within auth window"
            - "Auth is then revoked -> mission M cascades to CANCELLED per state machine, but we use a different pattern: construct so that Auth is revoked AFTER M is authorized and M survives (we test the conflict between safety and temporal — reframe: launch occurs at a time when auth is no longer ACTIVE AND outside scheduled window)"
          setup_api_calls:
            - call: "POST /ag-drone/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /ag-drone/subscription-plans"
              payload: { plan_code: "P", included_acres_per_year: 500, base_fee_cents: 0, overage_rate_cents_per_acre: 300, spray_allowed: false, ndvi_turnaround_hours: 24, storage_retention_days: 90 }
              as: OpsAdmin
              captures: { plan_id: $.data.id }
            - call: "POST /ag-drone/growers"
              payload: { legal_name: "PV2 Farms", contact_email: "pv2@x.com", subscription_plan_id: "${plan_id}", subscription_started_on: "2026-01-01", liability_coverage_cents: 50000000 }
              as: OpsAdmin
              captures: { grower_id: $.data.id }
            - call: "POST /ag-drone/growers/${grower_id}/fields"
              payload: { field_name: "F", legal_acres: 100, airspace_class: "B", insurance_policy_no: "POL-PV2" }
              as: OpsAdmin
              captures: { field_id: $.data.id }
            - call: "POST /ag-drone/pilots"
              payload: { pilot_name: "Pilot K", part107_certificate_no: "P107-K", part107_expires_on: "2027-01-01" }
              as: OpsAdmin
              captures: { pilot_id: $.data.id }
            - call: "POST /ag-drone/airspace-authorizations"
              payload: { field_id: "${field_id}", authorization_ref: "LAANC-1", max_altitude_ft: 400, effective_from: "2026-06-02T08:00:00Z", effective_until: "2026-06-02T11:00:00Z" }
              as: OpsAdmin
              captures: { auth_id: $.data.id }
            - call: "POST /ag-drone/fields/${field_id}/missions"
              payload: { mission_type: "SCOUT", pilot_id: "${pilot_id}", authorization_id: "${auth_id}", scheduled_start: "2026-06-02T08:30:00Z", scheduled_end: "2026-06-02T10:30:00Z", acres_planned: 50 }
              as: FlightCoordinator
              captures: { m_id: $.data.id }
            - call: "POST /ag-drone/missions/${m_id}/authorize"
              payload: {}
              as: FlightCoordinator
            # Revoke the authorization AFTER authorize — this cascades mission to CANCELLED.
            # For this conflict probe we instead want the mission still AUTHORIZED but Auth
            # non-ACTIVE at launch. Revocation cascade cancels the mission, so the conflict
            # test is reframed: we test that on a CANCELLED mission, launch fails with
            # ERR_MISSION_NOT_AUTHORIZED (state priority 4) which still wins over temporal.
            # To keep this a safety-vs-temporal probe per the rule, we instead do NOT revoke;
            # we move the clock PAST the auth window so the authorization is EXPIRED (safety
            # violation: ERR_AUTH_NOT_ACTIVE) AND outside the mission's scheduled window
            # (temporal violation: ERR_OUTSIDE_WINDOW). Expiry does not cascade to AUTHORIZED
            # missions per state machine (only AUTHORIZED whose scheduled_start >= now are
            # cancelled — here scheduled_start < now at launch attempt, so it survives).
            - call: "POST /ag-drone/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-02T12:00:00Z" }
              as: OpsAdmin
          trigger:
            - call: "POST /ag-drone/missions/${m_id}/launch"
              payload: {}
              as: RemotePilot
              as_user_id: "${pilot_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_AUTH_NOT_ACTIVE  # safety priority 6 wins over temporal priority 13 (both violated: auth EXPIRED, and current time 12:00 > scheduled_end 10:30)"

  # ===========================================================================
  # Rule 6 — boundary_precision_check (≥2 instances, different metrics / endpoints)
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: wind_threshold_exactly_20_vs_21_on_capture
        grounds:
          - calculations.anomaly_scoring
          - state_machines.FlightMission.IN_FLIGHT_to_CAPTURED
          - validations[priority=8]
        distinguishing_aspect: |
          Metric: wind_kt_max_observed (knots, integer). Boundary: <= 20 admits
          capture; > 20 forces abort. Tests wind=20 (boundary, inclusive pass)
          and wind=21 (boundary+1, must fail with ERR_WEATHER_LIMIT_EXCEEDED).
          Endpoint: POST /ag-drone/missions/{missionId}/capture.
        test_recipe:
          setup:
            - "Plan P; Grower G; Field F; Pilot H; two missions M20 (will capture at wind=20) and M21 (will attempt capture at wind=21)"
          setup_api_calls:
            - call: "POST /ag-drone/_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: OpsAdmin
            - call: "POST /ag-drone/subscription-plans"
              payload: { plan_code: "P", included_acres_per_year: 500, base_fee_cents: 0, overage_rate_cents_per_acre: 300, spray_allowed: false, ndvi_turnaround_hours: 24, storage_retention_days: 90 }
              as: OpsAdmin
