            - call: "POST /campus-recruiting/candidates"
              payload: { email: "b@x.com", full_name: "Candidate B", expected_graduation_date: "2027-05-15T00:00:00Z" }
              as: Anonymous
              captures: { c2: $.data.id }
            - call: "POST /campus-recruiting/seasons/${sid}/applications"
              payload: { candidate_id: "${c1}", school_target_id: "${st_id}", relocation_distance_miles: 100 }
              as: Candidate
              as_user_id: "${c1}"
              captures: { app1: $.data.id }
            - call: "POST /campus-recruiting/seasons/${sid}/applications"
              payload: { candidate_id: "${c2}", school_target_id: "${st_id}", relocation_distance_miles: 100 }
              as: Candidate
              as_user_id: "${c2}"
              captures: { app2: $.data.id }
            - call: "POST /campus-recruiting/_clock/set_current_utc"
