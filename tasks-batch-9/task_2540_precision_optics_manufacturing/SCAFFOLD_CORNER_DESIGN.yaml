  - section: errors
    instances:

      - name: every_path_identifier_has_its_own_not_found_code
        claim_type: error_triggerable
        grounds:
          - errors.ERR_DESIGN_NOT_FOUND
          - errors.ERR_TOLERANCE_ALLOCATION_NOT_FOUND
          - errors.ERR_GLASS_LOT_NOT_FOUND
          - errors.ERR_WORK_ORDER_NOT_FOUND
          - errors.ERR_INSTRUMENT_NOT_FOUND
          - errors.ERR_PROCESS_RUN_NOT_FOUND
          - errors.ERR_METROLOGY_REPORT_NOT_FOUND
          - errors.ERR_CHAMBER_NOT_FOUND
          - errors.ERR_COATING_RUN_NOT_FOUND
          - errors.ERR_ASSEMBLY_NOT_FOUND
          - errors.ERR_ASSEMBLY_COMPONENT_NOT_FOUND
          - errors.ERR_INSPECTION_RECORD_NOT_FOUND
          - errors.ERR_EXPORT_CLASSIFICATION_NOT_FOUND
          - errors.ERR_DOCUMENTATION_PACKAGE_NOT_FOUND
          - validations.priority_3
        distinguishing_aspect: |
          Fourteen entities, fourteen distinct 404 codes: the same all-zeros uuid is addressed on each
          single-item read and every response must name the collection actually addressed rather than a
          shared generic not-found. This is the one place the whole catalog of priority-3 codes is
          exercised in a single sweep, and the database is deliberately empty so nothing can be found by
          accident.
        test_recipe:
          setup:
            - "Completely empty database: no row of any entity exists."
            - "The logical clock stays at its start value 2026-08-01T00:00:00Z."
            - "Every call addresses the reserved all-zeros uuid 00000000-0000-0000-0000-000000000000, which is never minted by the server."
            - "Every call uses a role that §1.5 permits on the endpoint, so priorities 1 and 2 cannot pre-empt priority 3."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlantAdmin
          trigger:
            - call: "GET /optics/optical-designs/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: OpticsEngineer
            - call: "GET /optics/tolerance-allocations/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: OpticsEngineer
            - call: "GET /optics/glass-lots/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ProcurementOfficer
            - call: "GET /optics/work-orders/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ProcessTechnician
