            - "${gb_at_cap} == 600.0, ${prio_at_cap} == \"STANDARD\" and ${mbps_at_cap} == 50.0 - exactly at the cap is not a breach"
            - "${gb_over} == 600.1, ${prio_over} == \"DEPRIORITIZED\", ${mbps_over} == 12.5 and ${dep_at} == \"2026-08-20T00:00:00Z\" - the clock at the crossing ingest"
            - "First close: ${breaches_1} == 1, ${sticky_1} == false, ${cycle_2} == \"2026-09-01\" and ${prio_c1} == \"STANDARD\" - one breach is not sticky, so the new empty window resets the rate"
            - "Second close: ${breaches_2} == 2, ${sticky_2} == true, ${cycle_3} == \"2026-10-01\", ${gb_c2} == 0.0 yet ${prio_c2} == \"DEPRIORITIZED\" with ${mbps_c2} == 12.5 - the third cycle opens throttled on zero usage"
            - "Third close over a clean cycle: ${breaches_3} == 0, ${sticky_3} == false, ${cycle_4} == \"2026-10-31\", ${prio_c3} == \"STANDARD\" and ${mbps_c3} == 50.0 - the reset clears the counter, the sticky flag and the throttle together"

  - section: consistency_model
    instances:
      - name: every_write_returns_its_own_recomputed_derived_fields_with_no_second_read
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - calculations.sector_capacity_posture
          - calculations.los_qualification_mast_height
          - entities.Tower.fields.active_sector_count
        distinguishing_aspect: |
          Nothing in this API lags: the tower-activation response already carries the backhaul rate it
          just derived, the sector-activation response already carries a posture computed from zero
          reservations, the qualification response already carries the LiDAR geometry and the chosen
          sector, and the account-creation response already reflects the hold it consumed. Parent
          roll-ups are equally prompt - active_sector_count on the tower and held/sold on the sector move
          in the same request that caused them, so no test ever needs a re-read to "let it settle", and a
          re-read must return byte-identical values.
        test_recipe:
          setup:
            - "Tower RB-TWR-001 still PLANNED with an ACCEPTED 500 Mbps circuit, plus licence CBRS-PAL-4412, one PLANNED sector (capacity 25, ratio 8.0) and plan STD50. Logical clock at its 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /towers"
              payload: { site_code: "RB-TWR-001", latitude: 41.2500, longitude: -104.8000, ground_elevation_m: 1200.0, antenna_agl_m: 45.0, lease_landowner_name: "Hartley Ranch LLC", lease_monthly_base_rent_cents: 45000, lease_escalator_pct: 0.0275, lease_start_date: "2023-04-01", lease_term_months: 60 }
              as: NetworkEngineer
              captures: { tower_id: $.data.id }
            - call: "POST /backhaul-circuits"
              payload: { tower_id: "${tower_id}", carrier_name: "Prairie Fiber", circuit_ref: "PF-CIR-8801", committed_mbps: 500, monthly_cost_cents: 120000 }
              as: NetworkEngineer
              captures: { circuit_id: $.data.id }
            - call: "POST /backhaul-circuits/${circuit_id}/state-changes"
              payload: { to_state: "INSTALLED" }
              as: NetworkEngineer
            - call: "POST /backhaul-circuits/${circuit_id}/state-changes"
              payload: { to_state: "ACCEPTED", measured_mbps: 505.0 }
              as: NetworkEngineer
            - call: "POST /spectrum-licenses"
              payload: { license_ref: "CBRS-PAL-4412", band: "CBRS_3_5GHZ", channel_center_mhz: 3600.0, channel_width_mhz: 100.0, max_eirp_dbm: 47.0, license_area_code: "WY-021", effective_from: "2025-01-01T00:00:00Z", effective_to: "2030-01-01T00:00:00Z" }
              as: NetworkEngineer
              captures: { license_id: $.data.id }
            - call: "POST /sectors"
              payload: { tower_id: "${tower_id}", spectrum_license_id: "${license_id}", azimuth_deg: 90.0, beamwidth_deg: 65.0, channel_center_mhz: 3555.0, channel_width_mhz: 10.0, tx_power_dbm: 25.0, antenna_gain_dbi: 17.0, capacity_mbps: 25, max_oversubscription_ratio: 8.0 }
              as: NetworkEngineer
              captures: { sector_id: $.data.id }
            - call: "POST /service-plans"
              payload: { tier_code: "STD50", downstream_mbps: 50, upstream_mbps: 10, monthly_price_cents: 6999, soft_cap_gb: 600.0, deprioritization_factor: 0.25, sla_uptime_pct: 99.5, sla_credit_method: "SLA_SHORTFALL", equipment_policy: "RENTAL_OR_PURCHASE" }
              as: CapacityPlanner
              captures: { plan_id: $.data.id }
          trigger:
            - call: "POST /towers/${tower_id}/status-changes"
              payload: { to_status: "ACTIVE" }
              as: NetworkEngineer
              captures: { tower_status: $.data.status, tower_backhaul: $.data.backhaul_accepted_mbps, tower_sectors_before: $.data.active_sector_count }
            - call: "POST /sectors/${sector_id}/activation"
              payload: {}
              as: NetworkEngineer
              captures: { sector_status: $.data.status, posture_new: $.data.capacity_posture, committed_new: $.data.committed_mbps, allowance_new: $.data.remaining_allowance_mbps, sector_v1: $.data.version }
            - call: "GET /towers/${tower_id}"
              as: CapacityPlanner
              captures: { tower_sectors_after: $.data.active_sector_count, tower_backhaul_reread: $.data.backhaul_accepted_mbps }
            - call: "POST /serviceability-requests"
              payload: { candidate_tower_id: "${tower_id}", requested_plan_id: "${plan_id}", contact_name: "Dana Reyes", premise_latitude: 41.2600, premise_longitude: -104.7600, premise_ground_elevation_m: 1210.0, roof_height_m: 4.0, declared_tree_line_height_m: 3.0, obstruction_class: "CLEAR", path_distance_km: 5.0 }
              as: SalesAgent
              captures: { sr_id: $.data.id, sr_status: $.data.status, sr_sector: $.data.qualified_sector_id, sr_margin: $.data.desktop_los_margin_m, sr_mast: $.data.desktop_required_mast_height_m, sr_mount: $.data.desktop_mounting_type, sr_expiry: $.data.qualification_expires_at, sr_seq: $.data.intake_sequence }
            - call: "POST /capacity-holds"
              payload: { serviceability_request_id: "${sr_id}", expected_sector_version: "${sector_v1}" }
              as: SalesAgent
              captures: { hold_id: $.data.id, hold_status: $.data.status, hold_mbps: $.data.held_mbps, hold_expiry: $.data.expires_at, hold_sector: $.data.sector_id, hold_origin: $.data.origin }
            - call: "GET /sectors/${sector_id}"
              as: SalesAgent
              captures: { held_mid: $.data.held_mbps, sold_mid: $.data.sold_mbps, committed_mid: $.data.committed_mbps, ratio_mid: $.data.oversubscription_ratio, posture_mid: $.data.capacity_posture }
            - call: "POST /subscribers"
              payload: { serviceability_request_id: "${sr_id}", service_plan_id: "${plan_id}", billing_email: "dana.reyes@example.com", equipment_mode: "RENTAL" }
              as: SalesAgent
              captures: { sub_id: $.data.id, sub_status: $.data.service_status, sub_account: $.data.account_number, sub_sector: $.data.sector_id, sub_charge: $.data.equipment_monthly_charge_cents, sub_priority: $.data.usage_priority }
            - call: "GET /sectors/${sector_id}"
              as: SalesAgent
              captures: { held_end: $.data.held_mbps, sold_end: $.data.sold_mbps, committed_end: $.data.committed_mbps, ratio_end: $.data.oversubscription_ratio }
          assert:
            - "${tower_status} == \"ACTIVE\", ${tower_backhaul} == 505 and ${tower_sectors_before} == 0 - all three come back in the activation response itself"
            - "${sector_status} == \"ACTIVE\", ${posture_new} == \"OPEN\", ${committed_new} == 0 and ${allowance_new} == 200 in the activation response - floor(25 * 8.0) with nothing committed"
            - "${tower_sectors_after} == 1 and ${tower_backhaul_reread} == 505 - the parent roll-up moved in the child's request and the re-read is identical, not merely eventually correct"
            - "${sr_status} == \"QUALIFIED\", ${sr_sector} == ${sector_id}, ${sr_margin} == 28.5, ${sr_mast} == 2.5, ${sr_mount} == \"NON_PEN_ROOF_TRIPOD\", ${sr_seq} == 1 and ${sr_expiry} == \"2026-08-31T00:00:00Z\" - the geometry is in the creating response, not filled in later"
            - "${hold_status} == \"HELD\", ${hold_mbps} == 50, ${hold_sector} == ${sector_id}, ${hold_origin} == \"DIRECT\" and ${hold_expiry} == \"2026-08-15T00:00:00Z\" - clock_now plus the default 14 hold days"
            - "${held_mid} == 50, ${sold_mid} == 0, ${committed_mid} == 50, ${ratio_mid} == 2.000 and ${posture_mid} == \"OPEN\" - visible on the very next read with no settling step"
            - "${sub_status} == \"PENDING_INSTALL\", ${sub_account} == \"RB-000001\", ${sub_sector} == ${sector_id}, ${sub_priority} == \"STANDARD\" and ${sub_charge} == 0 - the rental radio is only ASSIGNED, so the monthly charge in this same response is still zero"
            - "${held_end} == 0, ${sold_end} == 50, ${committed_end} == 50 and ${ratio_end} == 2.000 - the hold-to-sold transfer is already reflected, and GET /capacity-holds?status=HELD returns total_count 0"
