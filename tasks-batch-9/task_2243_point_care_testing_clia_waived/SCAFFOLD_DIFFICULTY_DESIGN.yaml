              as: ProgramAdmin
            - call: "POST /poct/operators"
              payload: { site_id: "${site_id}", full_name: "Alma Ruiz", role_title: "MEDICAL_TECHNOLOGIST", hire_date: "2026-02-01" }
              as: ProgramAdmin
              captures: { op_trained_id: $.data.id }
            - call: "POST /poct/operators/${op_trained_id}/training"
              payload: { training_module_code: "POCT-101", completed_on: "2026-08-01" }
              as: ProgramAdmin
            - call: "POST /poct/operators"
              payload: { site_id: "${site_id}", full_name: "Ben Osei", role_title: "MEDICAL_ASSISTANT", hire_date: "2026-03-01" }
              as: ProgramAdmin
              captures: { op_locked_id: $.data.id }
            - call: "POST /poct/devices"
              payload: { site_id: "${site_id}", device_model: "GlucoMeter-X", serial_number: "SN-0701", analyte: "GLUCOSE", complexity_class: "WAIVED", connectivity_mode: "INTERFACED", qc_frequency_days: 30 }
              as: ProgramAdmin
              captures: { dev1_id: $.data.id }
            - call: "POST /poct/storage-units"
              payload: { site_id: "${site_id}", name: "Fridge A", min_temp_c: 2.0, max_temp_c: 8.0 }
              as: ProgramAdmin
              captures: { su1_id: $.data.id }
            - call: "POST /poct/reagent-lots"
              payload: { site_id: "${site_id}", storage_unit_id: "${su1_id}", device_model: "GlucoMeter-X", lot_number: "LOT-F1", expiration_date: "2027-06-30", received_at: "2026-08-01T00:00:00Z", control_min_level_1: 80.0, control_max_level_1: 120.0, control_min_level_2: 250.0, control_max_level_2: 350.0 }
              as: QualityCoordinator
              captures: { lot1_id: $.data.id, lot_status: $.data.verification_status }
            - call: "GET /poct/operators/${op_locked_id}"
              as: ProgramAdmin
              captures: { locked_access: $.data.access_status, locked_reason: $.data.lockout_reason }
          trigger:
            - call: "POST /poct/test-results"
              payload: { device_id: "${dev1_id}", operator_id: "${op_locked_id}", reagent_lot_id: "${lot1_id}", patient_mrn: "MRN-6001", analyte: "GLUCOSE", measured_value: 97.0, entry_mode: "INTERFACED" }
