            - "Vehicle.${veh_a}.hold_status == TRANSFER_HOLD after the successful re-create"

      - name: scheduled_clock_drives_days_in_inventory
        claim_type: scheduled_actions
        grounds:
          - entities.Vehicle.fields.days_in_inventory
          - endpoints.POST_/_clock/set_current_utc
        distinguishing_aspect: "days_in_inventory is derived purely from the logical clock: 0 on 2026-09-01, 29 on 2026-09-30 (no markdown tier), 30 on 2026-10-01 (tier 1) — the derivation resets when inventory_acquired_at is restamped by the return re-inspection cascade."
        test_recipe:
          setup: ["Clock 2026-09-01; V_A intaken at that instant."]
          setup_api_calls:
            - *clock0
            - *mk_store_phx
            - *mk_mgr1
            - *mk_veh_a
