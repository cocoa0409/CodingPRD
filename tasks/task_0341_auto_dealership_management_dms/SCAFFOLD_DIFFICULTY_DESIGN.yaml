        grounds:
          - validations[priority=7]
          - validations[priority=16]
          - state_machines.Deal.CONTRACTED_to_FUNDED
        distinguishing_aspect: |
          Error-category pair (state vs business_fiscal): a fund request on a deal that is still APPROVED
          (not CONTRACTED) AND whose amount_financed exceeds the LTV cap fails the higher-priority state
          check (priority 7) -> ERR_INVALID_STATE, NOT the fiscal ERR_LTV_EXCEEDED (priority 16).
        test_recipe:
          setup:
