# =============================================================================
# Task 1963: Scaffold Corner Design (§1.9 Coverage Index for Non-Difficulty Tests)
# =============================================================================

scaffold_corner_design:
  # ===========================================================================
  # Section: entities
  # ===========================================================================
  - section: entities
    instances:
      - name: property_defaults_applied
        claim_type: defaults
        grounds: [entities.Property.fields.purchase_auto_approve_threshold_cents, entities.Property.fields.recall_window_days, entities.Property.fields.vendor_travel_buffer_minutes, entities.Property.fields.entry_notice_min_hours]
        distinguishing_aspect: "Creating a property with only `name` applies every §1.1 default (threshold 50000, recall 30, buffer 60, notice 24, SLA hours 4/24/24/72/72/168)."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /properties"
              payload: { name: "Default Property" }
              as: PropertyManager
              captures: { p_thr: $.data.purchase_auto_approve_threshold_cents, p_recall: $.data.recall_window_days, p_buf: $.data.vendor_travel_buffer_minutes, p_notice: $.data.entry_notice_min_hours, p_er: $.data.emergency_response_hours, p_rc: $.data.routine_completion_hours }
          assert:
            - "purchase_auto_approve_threshold_cents == 50000"
            - "recall_window_days == 30"
            - "vendor_travel_buffer_minutes == 60"
            - "entry_notice_min_hours == 24"
            - "emergency_response_hours == 4 and routine_completion_hours == 168"
            - "version == 1"

      - name: resident_creation_missing_required_field_returns_400
        claim_type: required_fields
        grounds: [entities.Resident.fields.email, "validations[priority=21]", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "POST /residents without the required `email` field is rejected with ERR_VALIDATION (400) and creates nothing."
        test_recipe:
          setup: ["property exists"]
          setup_api_calls:
            - call: "POST /properties"
              payload: { name: "Req Property" }
              as: PropertyManager
              captures: { prop_id: $.data.id }
          trigger:
            - call: "POST /residents"
              payload: { property_id: "${prop_id}", unit_number: "201", full_name: "No Email" }
              as: PropertyManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_VALIDATION, HTTP 400"
            - "GET /residents?property_id=${prop_id} returns total_count == 0"

      - name: work_order_system_fields_input_ignored
        claim_type: system_fields
        grounds: [entities.WorkOrder]
        distinguishing_aspect: "Client-supplied id/version in the create payload are ignored: the server mints a UUID id and starts version at 1."
        test_recipe:
          setup: ["property and resident exist"]
          setup_api_calls:
            - call: "POST /properties"
              payload: { name: "Sys Property" }
              as: PropertyManager
              captures: { prop_id: $.data.id }
            - call: "POST /residents"
              payload: { property_id: "${prop_id}", unit_number: "202", full_name: "R Sys", email: "rsys@x.com" }
              as: PropertyManager
              captures: { res_id: $.data.id }
          trigger:
            - call: "POST /work-orders"
              payload: { id: "client-supplied-id", version: 99, property_id: "${prop_id}", resident_id: "${res_id}", category: "HVAC", priority: "URGENT", description: "AC broken" }
              as: Resident
              as_user_id: "${res_id}"
              captures: { wo_id: $.data.id, wo_v: $.data.version }
          assert:
            - "response data.id != \"client-supplied-id\" (server-minted UUID)"
            - "response data.version == 1 (client version 99 ignored)"

      - name: part_computed_fields_at_creation
        claim_type: computed_fields
        grounds: [entities.Part.fields.quantity_on_hand, entities.Part.fields.reserved_quantity, entities.Part.fields.restock_status, calculations.part_stock_ledger]
        distinguishing_aspect: "A part created with initial_stock 3 and reorder_level 3 starts with quantity_on_hand 3, reserved_quantity 0, and computed restock_status LOW_STOCK (3 <= 3)."
        test_recipe:
          setup: ["property exists"]
          setup_api_calls:
            - call: "POST /properties"
              payload: { name: "Part Property" }
              as: PropertyManager
              captures: { prop_id: $.data.id }
          trigger:
            - call: "POST /parts"
              payload: { property_id: "${prop_id}", sku: "FLT-1", name: "Filter", unit_cost_cents: 700, reorder_level: 3, initial_stock: 3 }
              as: PropertyManager
              captures: { p_onhand: $.data.quantity_on_hand, p_resv: $.data.reserved_quantity, p_restock: $.data.restock_status }
          assert:
            - "quantity_on_hand == 3 (seeded from initial_stock)"
            - "reserved_quantity == 0"
            - "restock_status == LOW_STOCK (quantity_on_hand 3 <= reorder_level 3)"

      - name: work_order_get_missing_returns_not_found
        claim_type: not_found
        grounds: ["validations[priority=4]", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET on a well-formed but nonexistent work order UUID yields ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /work-orders/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND, HTTP 404"

      - name: work_order_list_pagination_and_status_filter
        claim_type: listing
        grounds: [response_envelope, "endpoints[GET /work-orders]"]
        distinguishing_aspect: "Filtered list paginates: 3 TRIAGED work orders with limit=2 returns total_count 3, has_more true; offset=2 returns the final item with has_more false."
        test_recipe:
          setup: ["one resident with three TRIAGED work orders"]
          setup_api_calls:
            - call: "POST /properties"
              payload: { name: "Page Property" }
              as: PropertyManager
              captures: { prop_id: $.data.id }
            - call: "POST /residents"
              payload: { property_id: "${prop_id}", unit_number: "203", full_name: "R Page", email: "rpage@x.com" }
              as: PropertyManager
              captures: { res_id: $.data.id }
            - call: "POST /work-orders"
              payload: { property_id: "${prop_id}", resident_id: "${res_id}", category: "PLUMBING", priority: "ROUTINE", description: "Job 1" }
              as: Resident
              as_user_id: "${res_id}"
            - call: "POST /work-orders"
              payload: { property_id: "${prop_id}", resident_id: "${res_id}", category: "HVAC", priority: "URGENT", description: "Job 2" }
              as: Resident
              as_user_id: "${res_id}"
            - call: "POST /work-orders"
              payload: { property_id: "${prop_id}", resident_id: "${res_id}", category: "GENERAL", priority: "EMERGENCY", description: "Job 3" }
              as: Resident
              as_user_id: "${res_id}"
          trigger:
            - call: "GET /work-orders"
              payload: { resident_id: "${res_id}", status: "TRIAGED", limit: 2, offset: 0 }
              as: Dispatcher
            - call: "GET /work-orders"
              payload: { resident_id: "${res_id}", status: "TRIAGED", limit: 2, offset: 2 }
              as: Dispatcher
          assert:
            - "Page 1: 2 items, total_count == 3, has_more == true"
            - "Page 2: 1 item, total_count == 3, has_more == false"
            - "All returned items have status == TRIAGED and resident_id == ${res_id}"

  # ===========================================================================
  # Section: state_machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: work_order_initial_state_triaged
        claim_type: initial_state
        grounds: [state_machines.WorkOrder]
        distinguishing_aspect: "A newly filed work order starts in TRIAGED with recall_count 0, resident_signoff false, and null assignment fields."
        test_recipe:
          setup: ["property and resident exist"]
          setup_api_calls:
            - call: "POST /properties"
              payload: { name: "Init Property" }
              as: PropertyManager
              captures: { prop_id: $.data.id }
            - call: "POST /residents"
              payload: { property_id: "${prop_id}", unit_number: "204", full_name: "R Init", email: "rinit@x.com" }
              as: PropertyManager
              captures: { res_id: $.data.id }
          trigger:
            - call: "POST /work-orders"
              payload: { property_id: "${prop_id}", resident_id: "${res_id}", category: "ELECTRICAL", priority: "URGENT", description: "Outlet sparks" }
              as: Resident
              as_user_id: "${res_id}"
              captures: { st: $.data.status, rc: $.data.recall_count, so: $.data.resident_signoff, at: $.data.assignment_type }
          assert:
            - "status == TRIAGED"
            - "recall_count == 0 and resident_signoff == false"
            - "assignment_type == null and first_responded_at == null"

      - name: dispatch_from_in_progress_rejected
        claim_type: invalid_transition
        grounds: [state_machines.WorkOrder.TRIAGED_to_ASSIGNED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Dispatch is declared only from TRIAGED/REOPENED; dispatching an IN_PROGRESS order fails with ERR_INVALID_STATE."
        test_recipe:
          setup: ["work order IN_PROGRESS (dispatched to technician, started)"]
          setup_api_calls:
            - call: "POST /properties"
              payload: { name: "InvDisp Property" }
              as: PropertyManager
              captures: { prop_id: $.data.id }
            - call: "POST /residents"
              payload: { property_id: "${prop_id}", unit_number: "205", full_name: "R Inv", email: "rinv@x.com" }
              as: PropertyManager
              captures: { res_id: $.data.id }
            - call: "POST /technicians"
              payload: { property_id: "${prop_id}", full_name: "T One", trade: "PLUMBING" }
              as: PropertyManager
              captures: { tech_id: $.data.id }
            - call: "POST /work-orders"
              payload: { property_id: "${prop_id}", resident_id: "${res_id}", category: "PLUMBING", priority: "ROUTINE", description: "Leak" }
              as: Resident
              as_user_id: "${res_id}"
              captures: { wo_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/dispatch"
              payload: { assignment_type: "IN_HOUSE", technician_id: "${tech_id}", scheduled_start_at: "2026-08-01T10:00:00Z", scheduled_end_at: "2026-08-01T12:00:00Z", entry_authorization: "RESIDENT_CONSENT" }
              as: Dispatcher
            - call: "POST /work-orders/${wo_id}/start"
              payload: { resident_consent_confirmed: true }
              as: Technician
              as_user_id: "${tech_id}"
          trigger:
            - call: "POST /work-orders/${wo_id}/dispatch"
              payload: { assignment_type: "IN_HOUSE", technician_id: "${tech_id}", scheduled_start_at: "2026-08-01T14:00:00Z", scheduled_end_at: "2026-08-01T16:00:00Z", entry_authorization: "RESIDENT_CONSENT" }
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE, HTTP 409"
            - "WorkOrder remains IN_PROGRESS with the original 10:00-12:00 window"

      - name: closed_work_order_reopen_rejected
        claim_type: terminal_lockdown
        grounds: [state_machines.WorkOrder.COMPLETED_to_CLOSED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "CLOSED is terminal: reopening a closed work order fails with ERR_INVALID_STATE even inside the recall window."
        test_recipe:
          setup: ["work order COMPLETED then CLOSED at default clock"]
          setup_api_calls:
            - call: "POST /properties"
              payload: { name: "Closed Property" }
              as: PropertyManager
              captures: { prop_id: $.data.id }
            - call: "POST /residents"
              payload: { property_id: "${prop_id}", unit_number: "206", full_name: "R Closed", email: "rclosed@x.com" }
              as: PropertyManager
              captures: { res_id: $.data.id }
            - call: "POST /technicians"
              payload: { property_id: "${prop_id}", full_name: "T One", trade: "PLUMBING" }
              as: PropertyManager
              captures: { tech_id: $.data.id }
            - call: "POST /work-orders"
              payload: { property_id: "${prop_id}", resident_id: "${res_id}", category: "PLUMBING", priority: "ROUTINE", description: "Leak" }
              as: Resident
              as_user_id: "${res_id}"
              captures: { wo_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/dispatch"
              payload: { assignment_type: "IN_HOUSE", technician_id: "${tech_id}", scheduled_start_at: "2026-08-01T10:00:00Z", scheduled_end_at: "2026-08-01T12:00:00Z", entry_authorization: "RESIDENT_CONSENT" }
              as: Dispatcher
            - call: "POST /work-orders/${wo_id}/start"
              payload: { resident_consent_confirmed: true }
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /work-orders/${wo_id}/sign-off"
              payload: {}
              as: Resident
              as_user_id: "${res_id}"
            - call: "POST /work-orders/${wo_id}/complete"
              payload: { photo_urls: ["https://x/z1.jpg"], damage_reported: false }
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /work-orders/${wo_id}/close"
              payload: {}
              as: PropertyManager
          trigger:
            - call: "POST /work-orders/${wo_id}/reopen"
              payload: {}
              as: Resident
              as_user_id: "${res_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE, HTTP 409"
            - "WorkOrder.${wo_id}.status remains CLOSED"

      - name: cancel_from_in_progress_rejected
        claim_type: invalid_transition
        grounds: [state_machines.WorkOrder, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Cancel is declared only from TRIAGED/ASSIGNED/REOPENED; cancelling IN_PROGRESS fails."
        test_recipe:
          setup: ["work order IN_PROGRESS"]
          setup_api_calls:
            - call: "POST /properties"
              payload: { name: "CancelInv Property" }
              as: PropertyManager
              captures: { prop_id: $.data.id }
            - call: "POST /residents"
              payload: { property_id: "${prop_id}", unit_number: "207", full_name: "R Canc", email: "rcanc@x.com" }
              as: PropertyManager
              captures: { res_id: $.data.id }
            - call: "POST /technicians"
              payload: { property_id: "${prop_id}", full_name: "T One", trade: "PLUMBING" }
              as: PropertyManager
              captures: { tech_id: $.data.id }
            - call: "POST /work-orders"
              payload: { property_id: "${prop_id}", resident_id: "${res_id}", category: "PLUMBING", priority: "ROUTINE", description: "Leak" }
              as: Resident
              as_user_id: "${res_id}"
              captures: { wo_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/dispatch"
              payload: { assignment_type: "IN_HOUSE", technician_id: "${tech_id}", scheduled_start_at: "2026-08-01T10:00:00Z", scheduled_end_at: "2026-08-01T12:00:00Z", entry_authorization: "RESIDENT_CONSENT" }
              as: Dispatcher
            - call: "POST /work-orders/${wo_id}/start"
              payload: { resident_consent_confirmed: true }
              as: Technician
              as_user_id: "${tech_id}"
          trigger:
            - call: "POST /work-orders/${wo_id}/cancel"
              payload: {}
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE, HTTP 409"
            - "WorkOrder.${wo_id}.status remains IN_PROGRESS"

      - name: signoff_before_start_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.WorkOrder.IN_PROGRESS_to_IN_PROGRESS, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Sign-off requires IN_PROGRESS; signing off an ASSIGNED order fails with ERR_INVALID_STATE."
        test_recipe:
          setup: ["work order ASSIGNED but not started"]
          setup_api_calls:
            - call: "POST /properties"
              payload: { name: "So Property" }
              as: PropertyManager
              captures: { prop_id: $.data.id }
            - call: "POST /residents"
              payload: { property_id: "${prop_id}", unit_number: "208", full_name: "R So", email: "rso@x.com" }
              as: PropertyManager
              captures: { res_id: $.data.id }
            - call: "POST /technicians"
              payload: { property_id: "${prop_id}", full_name: "T One", trade: "PLUMBING" }
              as: PropertyManager
              captures: { tech_id: $.data.id }
            - call: "POST /work-orders"
              payload: { property_id: "${prop_id}", resident_id: "${res_id}", category: "PLUMBING", priority: "ROUTINE", description: "Leak" }
              as: Resident
              as_user_id: "${res_id}"
              captures: { wo_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/dispatch"
              payload: { assignment_type: "IN_HOUSE", technician_id: "${tech_id}", scheduled_start_at: "2026-08-01T10:00:00Z", scheduled_end_at: "2026-08-01T12:00:00Z", entry_authorization: "RESIDENT_CONSENT" }
              as: Dispatcher
          trigger:
            - call: "POST /work-orders/${wo_id}/sign-off"
              payload: {}
              as: Resident
              as_user_id: "${res_id}"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE, HTTP 409"
            - "WorkOrder.${wo_id}.resident_signoff remains false"

      - name: start_sets_started_at_from_clock
        claim_type: side_effect_execution
        grounds: [state_machines.WorkOrder.ASSIGNED_to_IN_PROGRESS, entities.WorkOrder.fields.started_at]
        distinguishing_aspect: "Starting stamps started_at from the logical clock (default 2026-08-01T00:00:00Z), moves to IN_PROGRESS, and bumps version from 2 to 3."
        test_recipe:
          setup: ["work order ASSIGNED (version 2 after dispatch); logical clock untouched at the default"]
          setup_api_calls:
            - call: "POST /properties"
              payload: { name: "Start Property" }
              as: PropertyManager
              captures: { prop_id: $.data.id }
            - call: "POST /residents"
              payload: { property_id: "${prop_id}", unit_number: "209", full_name: "R Start", email: "rstart@x.com" }
              as: PropertyManager
              captures: { res_id: $.data.id }
            - call: "POST /technicians"
              payload: { property_id: "${prop_id}", full_name: "T One", trade: "PLUMBING" }
              as: PropertyManager
              captures: { tech_id: $.data.id }
            - call: "POST /work-orders"
              payload: { property_id: "${prop_id}", resident_id: "${res_id}", category: "PLUMBING", priority: "ROUTINE", description: "Leak" }
              as: Resident
              as_user_id: "${res_id}"
              captures: { wo_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/dispatch"
              payload: { assignment_type: "IN_HOUSE", technician_id: "${tech_id}", scheduled_start_at: "2026-08-01T10:00:00Z", scheduled_end_at: "2026-08-01T12:00:00Z", entry_authorization: "RESIDENT_CONSENT" }
              as: Dispatcher
          trigger:
            - call: "POST /work-orders/${wo_id}/start"
              payload: { resident_consent_confirmed: true }
              as: Technician
              as_user_id: "${tech_id}"
              captures: { st: $.data.status, sa: $.data.started_at, v: $.data.version }
          assert:
            - "status == IN_PROGRESS"
            - "started_at == 2026-08-01T00:00:00Z (logical clock default, not wall clock)"
            - "version == 3 (create=1, dispatch=2, start=3)"

      - name: purchase_request_supersede_marks_old_pending
        claim_type: side_effect_execution
        grounds: [state_machines.PurchaseRequest.PENDING_to_SUPERSEDED, "endpoints[POST /work-orders/{id}/purchase-requests]"]
        distinguishing_aspect: "Creating a second purchase request for the same (work_order_id, part_id) while the first is PENDING supersedes the first; both remain queryable."
        test_recipe:
          setup: ["work order ASSIGNED to technician (version 2); part exists; first over-threshold purchase request PENDING"]
          setup_api_calls:
            - call: "POST /properties"
              payload: { name: "Supersede Property" }
              as: PropertyManager
              captures: { prop_id: $.data.id }
            - call: "POST /residents"
              payload: { property_id: "${prop_id}", unit_number: "210", full_name: "R Sup", email: "rsup@x.com" }
              as: PropertyManager
              captures: { res_id: $.data.id }
            - call: "POST /technicians"
              payload: { property_id: "${prop_id}", full_name: "T One", trade: "PLUMBING" }
              as: PropertyManager
              captures: { tech_id: $.data.id }
            - call: "POST /parts"
              payload: { property_id: "${prop_id}", sku: "PMP-2", name: "Pump", unit_cost_cents: 30000, reorder_level: 0, initial_stock: 0 }
              as: PropertyManager
              captures: { part_id: $.data.id }
            - call: "POST /work-orders"
              payload: { property_id: "${prop_id}", resident_id: "${res_id}", category: "PLUMBING", priority: "ROUTINE", description: "Pump job" }
              as: Resident
              as_user_id: "${res_id}"
              captures: { wo_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/dispatch"
              payload: { assignment_type: "IN_HOUSE", technician_id: "${tech_id}", scheduled_start_at: "2026-08-01T10:00:00Z", scheduled_end_at: "2026-08-01T12:00:00Z", entry_authorization: "RESIDENT_CONSENT" }
              as: Dispatcher
              captures: { wo_v2: $.data.version }
            - call: "POST /work-orders/${wo_id}/purchase-requests"
              payload: { part_id: "${part_id}", quantity: 2, quoted_unit_cost_cents: 30000, shipping_fee_cents: 0, expected_work_order_version: "${wo_v2}" }
              as: Technician
              as_user_id: "${tech_id}"
              captures: { pr1: $.data.id }
            - call: "GET /work-orders/${wo_id}"
              payload: {}
              as: Dispatcher
              captures: { wo_v3: $.data.version }
          trigger:
            - call: "POST /work-orders/${wo_id}/purchase-requests"
              payload: { part_id: "${part_id}", quantity: 1, quoted_unit_cost_cents: 31000, shipping_fee_cents: 0, expected_work_order_version: "${wo_v3}" }
              as: Technician
              as_user_id: "${tech_id}"
              captures: { pr2: $.data.id, pr2_status: $.data.status }
            - call: "GET /purchase-requests/${pr1}"
              payload: {}
              as: PropertyManager
              captures: { pr1_status: $.data.status }
          assert:
            - "PurchaseRequest.${pr2}: status == PENDING, estimated_total_cents == 33480 (31000 + handling 2480)"
            - "PurchaseRequest.${pr1}: status == SUPERSEDED (superseded by the newer PENDING request for the same part)"

      - name: vendor_reinstate_does_not_restore_assignments
        claim_type: side_effect_execution
        grounds: [state_machines.Vendor.SUSPENDED_to_ACTIVE, state_machines.Vendor.ACTIVE_to_SUSPENDED]
        distinguishing_aspect: "REINSTATE returns the vendor to ACTIVE but work orders reverted by the suspension stay TRIAGED with cleared assignment — no auto-restore."
        test_recipe:
          setup: ["vendor was suspended while holding an ASSIGNED work order (cascade already fired)"]
          setup_api_calls:
            - call: "POST /properties"
              payload: { name: "Reinstate Property" }
              as: PropertyManager
              captures: { prop_id: $.data.id }
            - call: "POST /residents"
              payload: { property_id: "${prop_id}", unit_number: "211", full_name: "R Rei", email: "rrei@x.com" }
              as: PropertyManager
              captures: { res_id: $.data.id }
            - call: "POST /vendors"
              payload: { property_id: "${prop_id}", company_name: "V Co", trade: "PLUMBING", insurance_valid_until: "2027-01-01T00:00:00Z" }
              as: PropertyManager
              captures: { ven_id: $.data.id }
            - call: "POST /work-orders"
              payload: { property_id: "${prop_id}", resident_id: "${res_id}", category: "PLUMBING", priority: "ROUTINE", description: "Vendor job" }
              as: Resident
              as_user_id: "${res_id}"
              captures: { wo_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/dispatch"
              payload: { assignment_type: "VENDOR", vendor_id: "${ven_id}", scheduled_start_at: "2026-08-01T10:00:00Z", scheduled_end_at: "2026-08-01T12:00:00Z", entry_authorization: "RESIDENT_CONSENT" }
              as: Dispatcher
            - call: "POST /vendors/${ven_id}/events"
              payload: { event_type: "SUSPEND" }
              as: PropertyManager
          trigger:
            - call: "POST /vendors/${ven_id}/events"
              payload: { event_type: "REINSTATE" }
              as: PropertyManager
              captures: { ven_status: $.data.status }
            - call: "GET /work-orders/${wo_id}"
              payload: {}
              as: Dispatcher
              captures: { wo_status: $.data.status, wo_vendor: $.data.assigned_vendor_id }
          assert:
            - "Vendor.${ven_id}.status == ACTIVE"
            - "WorkOrder.${wo_id}: status == TRIAGED and assigned_vendor_id == null (NOT auto-restored to ASSIGNED)"

      - name: reopen_cycle_covered_by_difficulty
        claim_type: valid_transition
        grounds: [state_machines.WorkOrder.COMPLETED_to_REOPENED]
        excluded_because:
          difficulty_instance: non_linear_state_machine / work_order_reopen_cycle
          rationale: "The cyclic reopen path and its side effects are asserted end-to-end by the named §1.8 instance."

  # ===========================================================================
  # Section: calculations
  # ===========================================================================
  - section: calculations
    instances:
      - name: sla_due_timestamps_computed_at_creation
        claim_type: correct_result
        grounds: [calculations.sla_due_timestamps, entities.WorkOrder.fields.response_due_at, entities.WorkOrder.fields.completion_due_at]
        distinguishing_aspect: "A ROUTINE work order created at the default clock 2026-08-01T00:00:00Z on a default-config property gets response_due_at 2026-08-04T00:00:00Z (+72h) and completion_due_at 2026-08-08T00:00:00Z (+168h)."
        test_recipe:
          setup: ["default-config property and resident; logical clock untouched at default"]
          setup_api_calls:
            - call: "POST /properties"
              payload: { name: "Due Property" }
              as: PropertyManager
              captures: { prop_id: $.data.id }
            - call: "POST /residents"
              payload: { property_id: "${prop_id}", unit_number: "301", full_name: "R Due", email: "rdue@x.com" }
              as: PropertyManager
              captures: { res_id: $.data.id }
          trigger:
            - call: "POST /work-orders"
              payload: { property_id: "${prop_id}", resident_id: "${res_id}", category: "PLUMBING", priority: "ROUTINE", description: "Slow drip" }
              as: Resident
              as_user_id: "${res_id}"
              captures: { rd: $.data.response_due_at, cd: $.data.completion_due_at }
          assert:
            - "response_due_at == 2026-08-04T00:00:00Z"
            - "completion_due_at == 2026-08-08T00:00:00Z"

      - name: response_sla_breach_strict_greater_boundary
        claim_type: boundary_edge
        grounds: [calculations.sla_due_timestamps, entities.WorkOrder.fields.response_sla_breached]
        distinguishing_aspect: "Breach comparison is strict >: first response exactly at response_due_at is NOT breached; one second later IS breached."
        test_recipe:
          setup:
            - "two ROUTINE work orders A and B created at 2026-08-01T00:00:00Z (response_due_at 2026-08-04T00:00:00Z for both)"
            - "technician available with non-overlapping windows"
          setup_api_calls:
            - call: "POST /properties"
              payload: { name: "Breach Property" }
              as: PropertyManager
              captures: { prop_id: $.data.id }
            - call: "POST /residents"
              payload: { property_id: "${prop_id}", unit_number: "302", full_name: "R Breach", email: "rbreach@x.com" }
              as: PropertyManager
              captures: { res_id: $.data.id }
            - call: "POST /technicians"
              payload: { property_id: "${prop_id}", full_name: "T One", trade: "PLUMBING" }
              as: PropertyManager
              captures: { tech_id: $.data.id }
            - call: "POST /work-orders"
              payload: { property_id: "${prop_id}", resident_id: "${res_id}", category: "PLUMBING", priority: "ROUTINE", description: "Job A" }
              as: Resident
              as_user_id: "${res_id}"
              captures: { wo_a: $.data.id }
            - call: "POST /work-orders"
              payload: { property_id: "${prop_id}", resident_id: "${res_id}", category: "PLUMBING", priority: "ROUTINE", description: "Job B" }
              as: Resident
              as_user_id: "${res_id}"
              captures: { wo_b: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-04T00:00:00Z" }
              as: PropertyManager
          trigger:
            - call: "POST /work-orders/${wo_a}/dispatch"
              payload: { assignment_type: "IN_HOUSE", technician_id: "${tech_id}", scheduled_start_at: "2026-08-04T10:00:00Z", scheduled_end_at: "2026-08-04T11:00:00Z", entry_authorization: "RESIDENT_CONSENT" }
              as: Dispatcher
              captures: { a_breached: $.data.response_sla_breached }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-04T00:00:01Z" }
              as: PropertyManager
            - call: "POST /work-orders/${wo_b}/dispatch"
              payload: { assignment_type: "IN_HOUSE", technician_id: "${tech_id}", scheduled_start_at: "2026-08-04T12:00:00Z", scheduled_end_at: "2026-08-04T13:00:00Z", entry_authorization: "RESIDENT_CONSENT" }
              as: Dispatcher
              captures: { b_breached: $.data.response_sla_breached }
          assert:
            - "WorkOrder A dispatched exactly at response_due_at: response_sla_breached == false (equality is not a breach)"
            - "WorkOrder B dispatched 1 second past due: response_sla_breached == true"

      - name: parts_total_counts_consumed_only
        claim_type: input_set_filtering
        grounds: [entities.WorkOrder.fields.parts_total_cents, calculations.part_stock_ledger]
        distinguishing_aspect: "parts_total_cents sums only CONSUMED lines: a RELEASED line (qty 1 @ 50) contributes 0 while the CONSUMED line (qty 2 @ 100) contributes 200."
        test_recipe:
          setup: ["work order IN_PROGRESS with sign-off; line A reserved (qty 2, unit 100); line B reserved (qty 1, unit 50) then released"]
          setup_api_calls:
            - call: "POST /properties"
              payload: { name: "Sum Property" }
              as: PropertyManager
              captures: { prop_id: $.data.id }
            - call: "POST /residents"
              payload: { property_id: "${prop_id}", unit_number: "303", full_name: "R Sum", email: "rsum@x.com" }
              as: PropertyManager
              captures: { res_id: $.data.id }
            - call: "POST /technicians"
              payload: { property_id: "${prop_id}", full_name: "T One", trade: "PLUMBING" }
              as: PropertyManager
              captures: { tech_id: $.data.id }
            - call: "POST /parts"
              payload: { property_id: "${prop_id}", sku: "A-2", name: "Part A", unit_cost_cents: 100, reorder_level: 0, initial_stock: 10 }
              as: PropertyManager
              captures: { part_a: $.data.id }
            - call: "POST /parts"
              payload: { property_id: "${prop_id}", sku: "B-2", name: "Part B", unit_cost_cents: 50, reorder_level: 0, initial_stock: 10 }
              as: PropertyManager
              captures: { part_b: $.data.id }
            - call: "POST /work-orders"
              payload: { property_id: "${prop_id}", resident_id: "${res_id}", category: "PLUMBING", priority: "ROUTINE", description: "Selective parts" }
              as: Resident
              as_user_id: "${res_id}"
              captures: { wo_id: $.data.id }
            - call: "POST /work-orders/${wo_id}/dispatch"
              payload: { assignment_type: "IN_HOUSE", technician_id: "${tech_id}", scheduled_start_at: "2026-08-01T10:00:00Z", scheduled_end_at: "2026-08-01T12:00:00Z", entry_authorization: "RESIDENT_CONSENT" }
              as: Dispatcher
            - call: "POST /work-orders/${wo_id}/start"
              payload: { resident_consent_confirmed: true }
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /work-orders/${wo_id}/parts"
              payload: { part_id: "${part_a}", quantity: 2 }
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /work-orders/${wo_id}/parts"
              payload: { part_id: "${part_b}", quantity: 1 }
              as: Technician
              as_user_id: "${tech_id}"
              captures: { wop_b: $.data.id }
            - call: "POST /work-orders/${wo_id}/parts/${wop_b}/release"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /work-orders/${wo_id}/sign-off"
              payload: {}
              as: Resident
              as_user_id: "${res_id}"
          trigger:
            - call: "POST /work-orders/${wo_id}/complete"
              payload: { photo_urls: ["https://x/s1.jpg"], damage_reported: false }
              as: Technician
              as_user_id: "${tech_id}"
              captures: { total: $.data.parts_total_cents }
          assert:
            - "parts_total_cents == 200 (only the CONSUMED line A: 2 * 100)"
            - "RELEASED line B contributes 0 to the sum"

      - name: chargeback_balance_counts_billed_and_disputed_only
        claim_type: input_set_filtering
        grounds: [calculations.resident_chargeback_balance, entities.Resident.fields.chargeback_balance_cents]
        distinguishing_aspect: "The balance sums final_amount_cents over {BILLED, DISPUTED} only: a PENDING chargeback (estimate 7000, never billed) contributes 0 while a BILLED one contributes 5000."
        test_recipe:
          setup: ["resident with two completed damage work orders: chargeback 1 BILLED at 5000; chargeback 2 left PENDING (provisional 7000)"]
          setup_api_calls:
            - call: "POST /properties"
              payload: { name: "Bal Property" }
