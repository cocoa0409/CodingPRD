            - { call: "POST /work-orders", payload: { work_order_type: "EXCHANGE", service_account_id: "${acct_id}", meter_id: "${m1}", scheduled_date: "2026-08-10", work_shift: "AM" }, as: Dispatcher, captures: { xwo: $.data.id } }
