            - "the exact 250 af record succeeds: DeliveryOrder.${o_sr_id}.fulfillment_status == DELIVERED and delivered_af == 400"

  # ===========================================================================
  - section: endpoints
    instances:
      - name: publish_materializes_one_line_per_active_contract
        claim_type: Side Effect Execution
        grounds:
          - endpoints.POST_/water/allocation-announcements/{id}/publish
          - entities.AllocationLine
        excluded_because:
          difficulty_instance: suspended_contract_skipped_by_next_publish
          rationale: "Line materialization and the ACTIVE-only input set are asserted there, including the suspended-contract exclusion."

  # ===========================================================================
  - section: errors
    instances:
      - name: error_contract_suspended_trigger
        claim_type: violation_to_error
        grounds: [errors.ERR_CONTRACT_SUSPENDED]
        excluded_because:
          difficulty_instance: suspended_contract_beats_allocation_shortfall
          rationale: "Asserted as the winning error of the state-vs-fiscal priority pair."
      - name: error_year_not_announced_trigger
        claim_type: violation_to_error
        grounds: [errors.ERR_YEAR_NOT_ANNOUNCED]
        excluded_because:
          difficulty_instance: transfer_gated_by_water_year_status
          rationale: "Asserted as the OPEN-year rejection of transfer creation."
      - name: error_revision_limit_trigger
        claim_type: violation_to_error
        grounds: [errors.ERR_REVISION_LIMIT_EXCEEDED]
        excluded_because:
          difficulty_instance: transfer_revision_cycle_bounded
          rationale: "Asserted on the fourth REQUEST_REVISION."
      - name: error_compliance_hold_trigger
        claim_type: violation_to_error
        grounds: [errors.ERR_COMPLIANCE_HOLD]
        excluded_because:
          difficulty_instance: violation_propagates_compliance_hold
          rationale: "Asserted as the gate on release creation after the violation cascade."
      - name: error_pulse_window_overlap_trigger
        claim_type: violation_to_error
        grounds: [errors.ERR_PULSE_WINDOW_OVERLAP]
        excluded_because:
          difficulty_instance: pulse_window_adjacency_vs_overlap
          rationale: "Asserted on the overlapping third window."
      - name: error_outlet_capacity_trigger
        claim_type: violation_to_error
        grounds: [errors.ERR_OUTLET_CAPACITY_EXCEEDED]
        excluded_because:
          difficulty_instance: outlet_capacity_aggregate_day
          rationale: "Asserted on the +1 cfs overflow after exact-capacity success."
      - name: error_allocation_exceeded_zero_quantity_distinction
        claim_type: violation_to_error
        grounds: [errors.ERR_INVALID_QUANTITY]
        excluded_because:
          difficulty_instance: zero_quantity_delivery_rejected
          rationale: "Asserted on ordered_af == 0; the outstanding-bound variant is covered by record_delivery_over_outstanding_returns_invalid_quantity."
      - name: error_min_flow_priority_trigger
        claim_type: violation_to_error
        grounds: [errors.ERR_ENV_MIN_FLOW_VIOLATION]
        excluded_because:
          difficulty_instance: env_min_flow_beats_past_schedule
          rationale: "Asserted as the winning safety error; the within-category ordering is covered by min_and_max_both_violated_returns_min_flow_first."

  # ===========================================================================
  - section: rbac
    instances:
      - name: district_manager_cannot_publish_announcement_returns_forbidden
        claim_type: Exclusive Operation Denied
        grounds:
          - roles.ReclamationOperator
          - errors.ERR_FORBIDDEN
        distinguishing_aspect: "Publish is exclusive to ReclamationOperator: the same call with X-User-Role DistrictManager fails 403 ERR_FORBIDDEN at priority 2, before the announcement id is even resolved."
        test_recipe:
          setup:
            - "Base fixture up to a DRAFT announcement."
          setup_api_calls:
            - *b_clock
            - *b_res_small
            - *b_d_sr
            - *b_d_jr
            - *b_c_sr
            - *b_c_jr
            - *b_wy
            - *b_clock_jan
            - *b_snow80
            - *b_run5000
            - *b_ann1c
          trigger:
            - call: "POST /water/allocation-announcements/${ann1_id}/publish"
              payload: {}
              as: DistrictManager
              as_user_id: "${d_sr}"
              captures: { forbid_err: $.data.error_id }
          assert:
            - "the response status is 403 and error_id == ERR_FORBIDDEN"
            - "AllocationAnnouncement.${ann1_id}.status is still DRAFT"

      - name: finance_officer_cannot_create_environmental_constraint_returns_forbidden
        claim_type: Exclusive Operation Denied
        grounds:
          - roles.EnvironmentalOfficer
          - errors.ERR_FORBIDDEN
        distinguishing_aspect: "Constraint registration is exclusive to EnvironmentalOfficer — segregation of operations from finance: FinanceOfficer gets 403 ERR_FORBIDDEN."
        test_recipe:
          setup:
            - "Big reservoir exists."
          setup_api_calls:
            - *b_clock
            - *b_res_big
          trigger:
            - call: "POST /water/reservoirs/${res_id}/environmental-constraints"
              payload: { species: "SMELT", requirement_type: "MIN_FLOW", required_min_cfs: 500, enforce_start: "2027-01-01T00:00:00Z", enforce_end: "2027-03-01T00:00:00Z" }
              as: FinanceOfficer
              captures: { forbid2_err: $.data.error_id }
          assert:
            - "the response status is 403 and error_id == ERR_FORBIDDEN"
            - "GET /water/reservoirs/${res_id}/environmental-constraints returns 0 rows"

      - name: hydrology_officer_cannot_execute_release_returns_forbidden
        claim_type: Exclusive Operation Denied
        grounds:
          - roles.ReclamationOperator
          - errors.ERR_FORBIDDEN
        distinguishing_aspect: "Release execution is exclusive to ReclamationOperator: HydrologyOfficer — who may post the observations feeding the same year — gets 403 ERR_FORBIDDEN on execute."
        test_recipe:
          setup:
            - "Big reservoir; a scheduled release inside its window."
          setup_api_calls:
            - *b_clock
            - *b_res_big
            - *b_rel1
            - *b_clock_feb03
          trigger:
            - call: "POST /water/release-orders/${rel1_id}/execute"
              payload: {}
              as: HydrologyOfficer
              captures: { forbid3_err: $.data.error_id }
          assert:
            - "the response status is 403 and error_id == ERR_FORBIDDEN"
            - "ReleaseOrder.${rel1_id}.status is still SCHEDULED"

      - name: district_manager_cannot_order_against_other_districts_contract
        claim_type: Ownership Check
        grounds:
          - roles.DistrictManager
          - errors.ERR_OWNERSHIP_MISMATCH
          - validations[priority=5]
        distinguishing_aspect: "DistrictManager identity is entity-backed: X-User-ID ${d_jr} ordering against ${c_sr} (owned by d_sr) fails 403 ERR_OWNERSHIP_MISMATCH at priority 5 — after existence, before state."
        test_recipe:
          setup:
            - "Base announced fixture."
          setup_api_calls:
            - *b_clock
            - *b_res_small
            - *b_d_sr
            - *b_d_jr
            - *b_c_sr
            - *b_c_jr
            - *b_wy
            - *b_clock_jan
            - *b_snow80
            - *b_run5000
            - *b_ann1c
            - *b_ann1p
          trigger:
            - call: "POST /water/delivery-orders"
              payload: { contract_id: "${c_sr}", water_year_id: "${wy_id}", ordered_af: 10 }
              as: DistrictManager
              as_user_id: "${d_jr}"
              captures: { own_err: $.data.error_id }
          assert:
            - "the response status is 403 and error_id == ERR_OWNERSHIP_MISMATCH"
            - "GET /water/delivery-orders?contract_id=${c_sr} returns 0 rows"

      - name: transfer_party_cannot_file_impact_review
        claim_type: Segregation Of Duties
        grounds:
          - roles.DistrictManager
          - errors.ERR_REVIEWER_CONFLICT
          - validations[priority=5]
        distinguishing_aspect: "Third-party review is structurally segregated: the seller district (a transfer party) filing a review fails 403 ERR_REVIEWER_CONFLICT; only a non-party district may file."
        test_recipe:
          setup:
            - "Base announced fixture; transfer SR->JR UNDER_REVIEW."
          setup_api_calls:
            - *b_clock
            - *b_res_small
            - *b_d_sr
            - *b_d_jr
            - *b_d_tp
            - *b_c_sr
            - *b_c_jr
            - *b_wy
            - *b_clock_jan
            - *b_snow80
            - *b_run5000
            - *b_ann1c
            - *b_ann1p
            - *b_tr1
          trigger:
            - call: "POST /water/transfer-requests/${tr1_id}/impact-reviews"
              payload: { claimed_impact_af: 100, basis: "RETURN_FLOW" }
              as: DistrictManager
              as_user_id: "${d_sr}"
              captures: { sod_err: $.data.error_id }
          assert:
            - "the response status is 403 and error_id == ERR_REVIEWER_CONFLICT"
            - "GET /water/impact-reviews?transfer_request_id=${tr1_id} returns 0 rows"

      - name: regional_director_decide_and_operator_execute_are_split
        claim_type: Exclusive Operation Allowed
        grounds:
          - roles.RegionalDirector
          - roles.ReclamationOperator
        excluded_because:
          difficulty_instance: transfer_conserves_year_allocation
          rationale: "The approve (RegionalDirector) then execute (ReclamationOperator) split is exercised end-to-end there."

  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_water_year_version_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[announcement-create-stale-water-year]
          - errors.ERR_STALE_VERSION
        distinguishing_aspect: "OCC on WaterYear.version: after the first announcement create advanced the year to version 2, a second create still carrying the pre-create observation (version 1) is rejected 412 ERR_STALE_VERSION — two strictly sequential requests, deterministic."
        test_recipe:
          setup:
            - "Base fixture up to the OPEN year with observations; one announcement already created (year version now 2)."
          setup_api_calls:
            - *b_clock
            - *b_res_small
            - *b_d_sr
            - *b_d_jr
            - *b_c_sr
            - *b_c_jr
            - *b_wy
            - *b_clock_jan
            - *b_snow80
            - *b_run5000
            - *b_ann1c
          trigger:
            - call: "POST /water/water-years/${wy_id}/allocation-announcements"
              payload: { expected_water_year_version: "${wy_v}" }
              as: ReclamationOperator
              captures: { stale_err: $.data.error_id }
          assert:
            - "the response status is 412 and error_id == ERR_STALE_VERSION"
            - "GET /water/water-years/${wy_id}/allocation-announcements still returns exactly 1 row"

      - name: occ_current_version_succeeds_and_version_increments
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[announcement-create-stale-water-year]
          - entities.WaterYear.fields.version
        distinguishing_aspect: "The happy path of the same rule: reading the year (version 2) and creating with that exact version succeeds, and each mutating call — announcement create — increments WaterYear.version by exactly 1."
        test_recipe:
          setup:
            - "Base fixture up to the OPEN year with observations; one announcement created."
          setup_api_calls:
            - *b_clock
            - *b_res_small
            - *b_d_sr
            - *b_d_jr
            - *b_c_sr
            - *b_c_jr
            - *b_wy
            - *b_clock_jan
            - *b_snow80
            - *b_run5000
            - *b_ann1c
            - *b_get_wy_v
          trigger:
            - call: "POST /water/water-years/${wy_id}/allocation-announcements"
              payload: { expected_water_year_version: "${wy_v_cur}" }
              as: ReclamationOperator
              captures: { ann2_ok: $.data.id }
          assert:
            - "the response status is 201 with a DRAFT announcement of sequence_number 2"
            - "WaterYear.${wy_id}.version advanced from 2 to 3 across the create (each mutation increments by exactly 1)"

      - name: contract_version_increments_on_suspend_mutation
        claim_type: optimistic_concurrency
        grounds:
          - entities.WaterContract.fields.version
          - endpoints.POST_/water/contracts/{id}/suspend
        distinguishing_aspect: "version increments on every mutation, not just OCC-guarded ones: a contract is created at version 1 and suspend advances it to exactly 2 with updated_at refreshed."
        test_recipe:
          setup:
            - "Logical clock 2026-10-01. One district and its ACTIVE contract."
          setup_api_calls:
            - *b_clock
            - *b_d_sr
            - *b_c_sr
          trigger:
            - call: "POST /water/contracts/${c_sr}/suspend"
              payload: {}
              as: FinanceOfficer
          assert:
            - "WaterContract.${c_sr}.status == SUSPENDED and version == 2"
            - "WaterContract.${c_sr}.updated_at is later than its created_at"

      - name: dual_variant_and_threshold_layers_are_difficulty_covered
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers
        excluded_because:
          difficulty_instance: alloc_waterfall_vs_sharing_dual_basis
          rationale: "Dual-variant and threshold-trigger layer claims are asserted by the named instance plus revenue_projected_vs_settled_divergence and tier_boundary_ratio_exact_075."

  # ===========================================================================
  - section: consistency_model
    instances:
      - name: publish_effects_visible_in_same_response_and_followup_get
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints.POST_/water/allocation-announcements/{id}/publish
        distinguishing_aspect: "Consistency is immediate: the publish response itself carries the computed declared_supply_af and shortage_tier, and a follow-up GET of the year shows current_announcement_id already repointed — no eventual lag."
        test_recipe:
          setup:
            - "Base fixture up to a DRAFT announcement."
          setup_api_calls:
            - *b_clock
            - *b_res_small
            - *b_d_sr
            - *b_d_jr
            - *b_c_sr
            - *b_c_jr
            - *b_wy
            - *b_clock_jan
            - *b_snow80
            - *b_run5000
            - *b_ann1c
          trigger:
            - call: "POST /water/allocation-announcements/${ann1_id}/publish"
              payload: {}
              as: ReclamationOperator
              captures: { pub_declared: $.data.declared_supply_af, pub_tier: $.data.shortage_tier }
            - call: "GET /water/water-years/${wy_id}"
              payload: {}
              as: ReclamationOperator
              captures: { wy_cur_ann: $.data.current_announcement_id }
          assert:
            - "the publish response itself reports declared_supply_af == 7500 and shortage_tier == NONE"
            - "the immediate GET shows WaterYear.${wy_id}.current_announcement_id == ${ann1_id} and status == ANNOUNCED"
