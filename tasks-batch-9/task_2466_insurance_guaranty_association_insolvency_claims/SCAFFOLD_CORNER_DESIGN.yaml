          - entities.Insolvency.fields.administrative_expense_cents
        distinguishing_aspect: "vendor_fee_accrual is an aggregation: two invoices of 4 and 6 hours at 18000 per hour accumulate to hours_logged 10 and fees_accrued_cents 180000, and the insolvency's class 1 administrative expense reconciles to the same 180000 without touching the claim's net_payable_cents."
        test_recipe:
          setup:
            - "Insolvency in TRIGGERED with a PERSONAL_AUTO profile and policy PA-1001 in CANCELLED_BY_ORDER."
            - "Claim C-1 for a 900000 gross loss screened COVERED, net_payable_cents 890000."
            - "One ASSIGNED ADJUSTER engagement with hourly_rate_cents 18000."
          setup_api_calls:
            - call: "POST /coverage-profiles"
              payload: { line_of_business: "PERSONAL_AUTO", per_claim_cap_cents: 3000000, per_policy_aggregate_cap_cents: 5000000, unearned_premium_cap_cents: 1000000, refund_priority_class: 2 }
              as: AssociationAdmin
            - call: "POST /insolvencies"
              payload: { insurer_name: "Great Lakes Mutual Casualty", naic_code: "10001", domiciliary_state_code: "MI", liquidation_order_date: "2026-03-01" }
              as: AssociationAdmin
              captures: { ins_id: $.data.id }
            - call: "POST /policies"
              payload: { insolvency_id: "${ins_id}", policy_number: "PA-1001", line_of_business: "PERSONAL_AUTO", policyholder_name: "Ada Renner", policyholder_state_code: "MI", effective_date: "2025-10-01", expiration_date: "2026-10-01", annual_premium_cents: 1200000 }
              as: ReceiverLiaison
              captures: { pol_id: $.data.id }
            - call: "POST /insolvencies/${ins_id}/trigger"
              payload: {}
              as: AssociationAdmin
            - call: "POST /claims"
              payload: { insolvency_id: "${ins_id}", policy_id: "${pol_id}", claim_number: "C-1", claimant_name: "Ben Ortiz", claimant_state_code: "MI", loss_date: "2026-01-15", gross_loss_cents: 900000 }
              as: CoverageAnalyst
              captures: { clm_id: $.data.id }
            - call: "POST /claims/${clm_id}/screen"
              payload: { decision: "COVERED" }
              as: CoverageAnalyst
              as_user_id: "analyst-1"
            - call: "POST /claims/${clm_id}/vendor-assignments"
              payload: { vendor_type: "ADJUSTER", vendor_name: "Kestrel Claims Services", settlement_authority_cents: 900000, hourly_rate_cents: 18000, engagement_start: "2026-08-01", engagement_end: "2026-08-31" }
              as: AssociationAdmin
              captures: { asg_id: $.data.id }
          trigger:
            - call: "POST /claims/${clm_id}/vendor-assignments/${asg_id}/invoices"
              payload: { hours: 4, invoice_ref: "INV-1" }
              as: ClaimsAdjuster
              as_user_id: "${asg_id}"
              captures: { fees_after_first: $.data.fees_accrued_cents }
            - call: "POST /claims/${clm_id}/vendor-assignments/${asg_id}/invoices"
              payload: { hours: 6, invoice_ref: "INV-2" }
              as: ClaimsAdjuster
              as_user_id: "${asg_id}"
              captures: { fees_after_second: $.data.fees_accrued_cents, hrs: $.data.hours_logged }
          assert:
            - "${fees_after_first} == 72000"
            - "${fees_after_second} == 180000"
            - "${hrs} == 10"
            - "Insolvency.${ins_id}.administrative_expense_cents == 180000"
            - "Insolvency.${ins_id}.administrative_paid_cents == 0"
            - "CoveredClaim.${clm_id}.net_payable_cents == 890000"

      - name: offset_then_cap_versus_cap_then_offset_divergence_on_one_loss
        claim_type: variant_divergence
        grounds:
          - calculations.claim_net_payable.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / claim_payable_offset_then_cap_versus_cap_then_offset_on_same_loss
          rationale: "The variant-divergence claim for claim_net_payable, including the signed delta, is the named §1.8 instance's whole payload."
      - name: pro_rata_versus_short_rate_divergence_and_single_rounding
        claim_type: variant_divergence
        grounds:
          - calculations.unearned_premium_refund.variants
          - calculations.unearned_premium_refund.precision
        excluded_because:
          difficulty_instance: dual_variant_calc / unearned_premium_pro_rata_versus_short_rate_on_same_policy
          rationale: "The named §1.8 instance already asserts both variants on one policy and pins the single round_half_up step, which is exactly the precision claim for this rule."
      - name: waterfall_pro_rata_remainder_cent_assignment
        claim_type: correct_result
        grounds:
          - calculations.distribution_waterfall.variants.pro_rata_insufficient
        excluded_because:
          difficulty_instance: combinatorial_formula / waterfall_pro_rata_remainder_cent_goes_to_earliest_refund
          rationale: "The insufficient-funds branch and its deterministic residual-cent walk are asserted by the named §1.8 instance."
      - name: assessment_constraint_propagation_reaches_a_fixed_point
        claim_type: correct_result
        grounds:
          - calculations.member_assessment_allocation
        excluded_because:
          difficulty_instance: combinatorial_formula / assessment_cap_forces_second_round_redistribution
          rationale: "The constraint_propagation claims (change propagates through the pool, terminates within MAX_REDISTRIBUTION_ROUNDS) are the named §1.8 instance's subject."

  - section: validations
