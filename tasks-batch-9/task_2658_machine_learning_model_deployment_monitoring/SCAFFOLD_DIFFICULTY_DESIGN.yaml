          assert:
            - "AT the threshold: SkewCheck.${sk_at_id}.max_skew_ratio == 1.2500 (1.0000/0.8000) == SKEW_BLOCK_THRESHOLD exactly, status == 'FAIL_SKEW' (the comparison is >=, not >), max_skew_feature == 'amount', missing_features == []"
            - "0.0001 BELOW: SkewCheck.${sk_below_id}.max_skew_ratio == 1.2499 — 0.9999/0.8000 = 1.249875 rounded to 4 decimals — and status == 'WARN', NOT 'FAIL_SKEW'"
            - "AT the warn threshold: SkewCheck.${sk_warn_id}.max_skew_ratio == 1.1000 == SKEW_WARN_THRESHOLD exactly, status == 'WARN'"
            - "just BELOW the warn threshold: SkewCheck.${sk_pass_id}.max_skew_ratio == 1.0999 (0.8799/0.8000 = 1.099875 rounded) and status == 'PASS', with max_skew_feature still 'amount' (1.0999 > tenure_days' 1.0500)"
            - "only the FAIL_SKEW check raised a trigger: GET /retraining-triggers?skew_check_id=${sk_at_id} returns total_count 1, while GET /retraining-triggers?skew_check_id=${sk_below_id} returns total_count 0"
            - "the raised trigger sits exactly ON a tier floor: base_urgency == 20.00 (80 * (1.2500 - 1.0) = 20.0, zero drift, zero staleness), so escalation_tier_bonus_pct == 10 by the floor-20 pair"
            - "total_urgency == 22.00, priority_band == 'LOW' and retrain_required == false (22.00 < RETRAIN_REQUIRED_THRESHOLD 45)"
            - "the trigger carries drift_report_id null and skew_check_id ${sk_at_id}"
            - "the later PASS check supersedes the failing one: Deployment.${d1_id} can ramp again because priority 34 reads only the most recent check by checked_at DESC then created_at DESC"

      - name: conclude_at_zero_one_and_exactly_min_labeled_predictions
        grounds:
          - validations.priority_72
          - calculations.challenger_promotion_score
          - entities.ChallengerEvaluation.fields.criteria_failures
          - errors.ERR_NO_LABELED_PREDICTIONS
          - state_machines.ChallengerEvaluation.COLLECTING_to_PROMOTED
        distinguishing_aspect: |
          A DIFFERENT metric (labeled_prediction_count) on a DIFFERENT endpoint
          (POST /challenger-evaluations/{evaluation_id}/conclude). Three adjacent values give three
          different outcomes: 0 is a hard 422 rejection with no state change at all, 1 is a valid
          request that yields INCONCLUSIVE, and exactly MIN_LABELED_PREDICTIONS (1000) satisfies
          the criterion because the test is `< 1000`, so the evaluation reaches PROMOTED. Zero is
          deliberately NOT folded into INSUFFICIENT_LABELS.
