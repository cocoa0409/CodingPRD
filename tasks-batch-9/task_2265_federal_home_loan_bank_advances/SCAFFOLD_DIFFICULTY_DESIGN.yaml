scaffold_difficulty_design:

  # ===========================================================================
  # RULE 1 — dual_variant_calc
  # ===========================================================================
  - rule_id: dual_variant_calc
    applied: true
    summary: |
      Two independent quantities are each computed by two named variants of the same
      formula, selected by the phase of the workflow: borrowing capacity is PROVISIONAL
      at advance request and CERTIFIED at funding, and the prepayment fee is a QUOTE
      before settlement and a SETTLEMENT figure at settlement.
    instances:
      - name: borrowing_capacity_provisional_versus_certified_diverge
        grounds:
          - "calculations.borrowing_capacity.variants[PROVISIONAL|CERTIFIED]"
          - "calculations.lendable_collateral_value.variants[PROVISIONAL|CERTIFIED]"
          - "entities.MemberBank.borrowing_capacity_cents"
          - "endpoints.GET /fhlb/member-banks/{member_bank_id}/borrowing-capacity"
        distinguishing_aspect: |
          This instance varies the COLLATERAL INPUT SET and the COMMITMENT INPUT SET of a
          capacity aggregate on MemberBank: PROVISIONAL admits UNDER_REVIEW assets at 50%
          of their hypothetical lendable value and drops REQUESTED advances from
          commitments, while CERTIFIED admits only ELIGIBLE assets and counts REQUESTED
          advances. Identical stored data therefore yields 16,500,000 versus 7,600,000, a
          delta of 8,900,000 driven purely by set membership. It shares no calculation,
          no entity and no endpoint with instance 2.
        test_recipe:
          setup: |
            Member bank Harbor Savings, tier 1, total assets 8,000,000,000 (statutory cap
            2,400,000,000, so the tier cap binds). One ELIGIBLE SF_MORTGAGE asset worth
            15,600,000 of lendable value and one UNDER_REVIEW SF_MORTGAGE asset whose
            hypothetical lendable value is 7,800,000. One REQUESTED advance of gross
            5,000,000 and one CREDIT_APPROVED advance of gross 3,000,000.
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /fhlb/member-banks"
              payload: { name: "Harbor Savings", charter_type: "THRIFT", total_assets_cents: 8000000000, credit_rating_tier: 1 }
              as: SystemAdmin
              captures: { member_id: "$.data.id" }
            - call: "POST /fhlb/stock-subscriptions"
              payload: { member_bank_id: "${member_id}", subscription_type: "MEMBERSHIP", amount_cents: 9600000 }
              as: CreditOfficer
              captures: { sub_membership: "$.data.id" }
            - call: "POST /fhlb/stock-subscriptions/${sub_membership}/issue"
              payload: {}
              as: CreditOfficer
            - call: "POST /fhlb/member-banks/${member_id}/activate"
              payload: {}
              as: CreditOfficer
            - call: "POST /fhlb/member-banks/${member_id}/pledge-agreement"
              payload: { pledge_mode: "BLANKET_LIEN", effective_date: "2026-08-01T00:00:00Z" }
              as: CreditOfficer
            - call: "POST /fhlb/collateral-assets"
              payload: { member_bank_id: "${member_id}", asset_class: "SF_MORTGAGE", unpaid_principal_balance_cents: 20000000, market_value_cents: 21000000, ltv_bps: 7500, appraisal_date: "2026-06-01T00:00:00Z" }
              as: TreasuryOfficer
              as_user_id: "${member_id}"
              captures: { asset_eligible: "$.data.id" }
            - call: "POST /fhlb/collateral-assets/${asset_eligible}/review-eligibility"
              payload: {}
              as: CreditOfficer
            - call: "POST /fhlb/collateral-assets"
              payload: { member_bank_id: "${member_id}", asset_class: "SF_MORTGAGE", unpaid_principal_balance_cents: 10000000, market_value_cents: 12000000, ltv_bps: 7000, appraisal_date: "2026-06-01T00:00:00Z" }
              as: TreasuryOfficer
              as_user_id: "${member_id}"
              captures: { asset_pending: "$.data.id" }
            - call: "POST /fhlb/advance-products"
              payload: { product_code: "FT-450", structure: "FIXED_TERM", min_term_days: 30, max_term_days: 1095, rate_bps: 425, prepayment_fee_method: "SYMMETRIC_MARKET_VALUE", activity_stock_pct_bps: 450, min_principal_cents: 1000000 }
              as: SystemAdmin
              captures: { product_id: "$.data.id" }
            - call: "GET /fhlb/member-banks/${member_id}"
              payload: {}
              as: CreditOfficer
              captures: { ver_a: "$.data.version" }
            - call: "POST /fhlb/advances"
              payload: { member_bank_id: "${member_id}", advance_product_id: "${product_id}", term_days: 360, requested_net_proceeds_cents: 5000000, expected_member_bank_version: "${ver_a}", fund_stock_from_advance: false }
              as: TreasuryOfficer
              as_user_id: "${member_id}"
              captures: { advance_requested: "$.data.id" }
            - call: "GET /fhlb/member-banks/${member_id}"
              payload: {}
              as: CreditOfficer
              captures: { ver_b: "$.data.version" }
            - call: "POST /fhlb/advances"
              payload: { member_bank_id: "${member_id}", advance_product_id: "${product_id}", term_days: 360, requested_net_proceeds_cents: 3000000, expected_member_bank_version: "${ver_b}", fund_stock_from_advance: false }
              as: TreasuryOfficer
              as_user_id: "${member_id}"
              captures: { advance_approved: "$.data.id" }
            - call: "POST /fhlb/advances/${advance_approved}/approve"
              payload: {}
              as: CreditOfficer
              as_user_id: "credit-officer-1"
          trigger:
            call: "GET /fhlb/member-banks/${member_id}/borrowing-capacity"
            payload: { variant: "PROVISIONAL" }
            as: CreditOfficer
          assert:
            - "the PROVISIONAL response reports lendable_collateral_value_cents == 19500000 (15600000 ELIGIBLE + 3900000, which is 50% of the UNDER_REVIEW asset's hypothetical 7800000)"
            - "the PROVISIONAL response reports commitments_cents == 3000000 (only the CREDIT_APPROVED advance; the REQUESTED 5000000 advance is excluded)"
            - "the PROVISIONAL response reports capacity_base_cents == 19500000 and borrowing_capacity_cents == 16500000"
            - "GET /fhlb/member-banks/{member_id} reports lendable_collateral_value_cents == 15600000 and borrowing_capacity_cents == 7600000 (CERTIFIED: only ELIGIBLE assets, commitments 8000000)"
            - "the two variants differ by exactly 8900000 for identical stored data"
            - "Advance.capacity_at_request_cents on the first advance == 15600000 (PROVISIONAL at that moment: 15600000 lendable, no UNDER_REVIEW asset yet, no commitments)"

      - name: prepayment_fee_quote_versus_settlement_diverge
        grounds:
          - "calculations.prepayment_fee.variants[QUOTE|SETTLEMENT]"
          - "entities.PrepaymentEvent.quoted_fee_cents / settled_fee_cents / fee_delta_cents / admin_fee_cents"
          - "endpoints.POST /fhlb/advances/{advance_id}/prepayment-quotes"
          - "endpoints.POST /fhlb/prepayment-events/{prepayment_event_id}/settle"
        distinguishing_aspect: |
          This instance varies the VALUATION INSTANT and the FEE COMPOSITION of a
          forward-looking cost on PrepaymentEvent: QUOTE prices the remaining term at the
          quote-date market rate with no administrative fee, SETTLEMENT reprices at the
          settlement-date market rate over a shorter remaining term and adds a 5 bps
          administrative fee. Instance 1 varies which rows enter an aggregate; this
          instance varies when a single row is priced and what components are included.
          Different calculation, different entity, different endpoints.
        test_recipe:
          setup: |
            Harbor Savings tier 1 with two ELIGIBLE assets (SF_MORTGAGE lendable 15,600,000
            and CRE lendable 22,560,000, total 38,160,000). Membership stock 9,600,000 plus
            activity stock 1,350,000 already ISSUED. Advance D of gross 30,000,000 at 425
            bps, term 360 days, funded on 2026-08-01 so maturity_date is 2027-07-27. Market
            rate 300 bps at quote time on 2026-11-01 (268 days remaining), 250 bps at
            settlement on 2026-11-03 (266 days remaining). Product method is
            SYMMETRIC_MARKET_VALUE with symmetric_credit_enabled false.
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /_ops/set-market-rate"
              payload: { market_rate_bps: 300 }
              as: SystemAdmin
            - call: "POST /fhlb/member-banks"
              payload: { name: "Harbor Savings", charter_type: "THRIFT", total_assets_cents: 8000000000, credit_rating_tier: 1 }
              as: SystemAdmin
              captures: { member_id: "$.data.id" }
            - call: "POST /fhlb/stock-subscriptions"
              payload: { member_bank_id: "${member_id}", subscription_type: "MEMBERSHIP", amount_cents: 9600000 }
              as: CreditOfficer
              captures: { sub_membership: "$.data.id" }
            - call: "POST /fhlb/stock-subscriptions/${sub_membership}/issue"
              payload: {}
              as: CreditOfficer
            - call: "POST /fhlb/member-banks/${member_id}/activate"
              payload: {}
              as: CreditOfficer
            - call: "POST /fhlb/member-banks/${member_id}/pledge-agreement"
              payload: { pledge_mode: "BLANKET_LIEN", effective_date: "2026-08-01T00:00:00Z" }
              as: CreditOfficer
            - call: "POST /fhlb/collateral-assets"
              payload: { member_bank_id: "${member_id}", asset_class: "SF_MORTGAGE", unpaid_principal_balance_cents: 20000000, market_value_cents: 21000000, ltv_bps: 7500, appraisal_date: "2026-06-01T00:00:00Z" }
              as: TreasuryOfficer
              as_user_id: "${member_id}"
              captures: { asset_sf: "$.data.id" }
            - call: "POST /fhlb/collateral-assets/${asset_sf}/review-eligibility"
              payload: {}
              as: CreditOfficer
            - call: "POST /fhlb/collateral-assets"
              payload: { member_bank_id: "${member_id}", asset_class: "CRE", unpaid_principal_balance_cents: 50000000, market_value_cents: 48000000, ltv_bps: 8200, appraisal_date: "2024-01-15T00:00:00Z" }
              as: TreasuryOfficer
              as_user_id: "${member_id}"
              captures: { asset_cre: "$.data.id" }
            - call: "POST /fhlb/collateral-assets/${asset_cre}/review-eligibility"
              payload: {}
              as: CreditOfficer
            - call: "POST /fhlb/stock-subscriptions"
              payload: { member_bank_id: "${member_id}", subscription_type: "ACTIVITY", amount_cents: 1350000 }
              as: CreditOfficer
              captures: { sub_activity: "$.data.id" }
            - call: "POST /fhlb/stock-subscriptions/${sub_activity}/issue"
              payload: {}
              as: CreditOfficer
            - call: "POST /fhlb/advance-products"
              payload: { product_code: "FT-450", structure: "FIXED_TERM", min_term_days: 30, max_term_days: 1095, rate_bps: 425, prepayment_fee_method: "SYMMETRIC_MARKET_VALUE", activity_stock_pct_bps: 450, min_principal_cents: 1000000, symmetric_credit_enabled: false }
              as: SystemAdmin
              captures: { product_id: "$.data.id" }
            - call: "GET /fhlb/member-banks/${member_id}"
              payload: {}
              as: CreditOfficer
              captures: { ver_a: "$.data.version" }
            - call: "POST /fhlb/advances"
              payload: { member_bank_id: "${member_id}", advance_product_id: "${product_id}", term_days: 360, requested_net_proceeds_cents: 30000000, expected_member_bank_version: "${ver_a}", fund_stock_from_advance: false }
              as: TreasuryOfficer
              as_user_id: "${member_id}"
              captures: { advance_id: "$.data.id" }
            - call: "POST /fhlb/advances/${advance_id}/approve"
              payload: {}
              as: CreditOfficer
              as_user_id: "credit-officer-1"
            - call: "POST /fhlb/advances/${advance_id}/fund"
              payload: {}
              as: CreditOfficer
              as_user_id: "credit-officer-2"
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-11-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /fhlb/advances/${advance_id}/prepayment-quotes"
              payload: { prepay_kind: "FULL", prepay_amount_cents: 30000000 }
              as: TreasuryOfficer
              as_user_id: "${member_id}"
              captures: { event_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-11-03T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /_ops/set-market-rate"
              payload: { market_rate_bps: 250 }
              as: SystemAdmin
          trigger:
            call: "POST /fhlb/prepayment-events/${event_id}/settle"
            payload: {}
            as: CreditOfficer
            as_user_id: "credit-officer-2"
          assert:
            - "PrepaymentEvent.quoted_remaining_days == 268 and quoted_fee_cents == 279167 (QUOTE variant: 30000000 * 125 bps * 268 / (10000 * 360), one rounding)"
            - "PrepaymentEvent.settled_remaining_days == 266 and admin_fee_cents == 15000"
            - "PrepaymentEvent.settled_fee_cents == 402917 (SETTLEMENT variant: 387917 base at 175 bps over 266 days, plus the 15000 administrative fee)"
            - "PrepaymentEvent.fee_delta_cents == 123750"
            - "PrepaymentEvent.symmetric_credit_cents == 0 (the spread stayed positive)"
            - "PrepaymentEvent.status == \"SETTLED\" and Advance.credit_status == \"PREPAID\""
            - "the QUOTE variant must NOT include the administrative fee; a settled figure of 387917 or a quote of 294167 both indicate the wrong variant was applied"

  # ===========================================================================
  # RULE 2 — combinatorial_formula
  # ===========================================================================
  - rule_id: combinatorial_formula
    applied: true
    summary: |
      Two formulas whose result depends on how the terms are combined rather than only
      on the terms themselves: the lendable-value aggregate pins per-asset rounding
      before summation (mode b, order of operations), and the advance gross-up resolves
      a stock obligation that is itself a percentage of the principal it inflates
      (mode c, self-referential fixed point).
    instances:
      - name: lendable_value_rounds_per_asset_before_summing
        mode: "b — order of operations / rounding-and-aggregation order is decisive"
        grounds:
          - "calculations.lendable_collateral_value.precision (round per asset, then sum)"
          - "entities.CollateralAsset.lendable_value_cents"
          - "entities.MemberBank.lendable_collateral_value_cents"
        distinguishing_aspect: |
          Mode (b). The inputs, the discount factor and the final aggregate are all fixed;
          only the ORDER of rounding versus summation varies. Rounding each asset to whole
          cents first gives 19,259,259; summing the unrounded products and rounding once
          gives 19,259,258. The scaffold pins the former, so the one-cent difference is a
          hard pass/fail. This is an aggregation-order question over a SET of records and
          involves no self-reference.
        test_recipe:
          setup: |
            Harbor Savings tier 1 under a BLANKET_LIEN pledge, no verification haircut.
            Two SF_MORTGAGE assets under a blanket lien (base factor 7800 bps, no
            penalties) with collateral bases chosen so that both per-asset products have
            fractional cents that round in opposite directions:
              asset R1 basis 12,345,679 -> 12,345,679 * 7800 / 10000 = 9,629,629.62 -> 9,629,630
              asset R2 basis 12,345,678 -> 12,345,678 * 7800 / 10000 = 9,629,628.84 -> 9,629,629
            Per-asset-then-sum = 19,259,259. Sum-then-round = 24,691,357 * 0.78 =
            19,259,258.46 -> 19,259,258.
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /fhlb/member-banks"
              payload: { name: "Harbor Savings", charter_type: "THRIFT", total_assets_cents: 8000000000, credit_rating_tier: 1 }
              as: SystemAdmin
              captures: { member_id: "$.data.id" }
            - call: "POST /fhlb/stock-subscriptions"
              payload: { member_bank_id: "${member_id}", subscription_type: "MEMBERSHIP", amount_cents: 9600000 }
              as: CreditOfficer
              captures: { sub_membership: "$.data.id" }
            - call: "POST /fhlb/stock-subscriptions/${sub_membership}/issue"
              payload: {}
              as: CreditOfficer
            - call: "POST /fhlb/member-banks/${member_id}/activate"
              payload: {}
              as: CreditOfficer
            - call: "POST /fhlb/member-banks/${member_id}/pledge-agreement"
              payload: { pledge_mode: "BLANKET_LIEN", effective_date: "2026-08-01T00:00:00Z" }
              as: CreditOfficer
            - call: "POST /fhlb/collateral-assets"
              payload: { member_bank_id: "${member_id}", asset_class: "SF_MORTGAGE", unpaid_principal_balance_cents: 12345679, market_value_cents: 20000000, ltv_bps: 7500, appraisal_date: "2026-06-01T00:00:00Z" }
              as: TreasuryOfficer
              as_user_id: "${member_id}"
              captures: { asset_r1: "$.data.id" }
            - call: "POST /fhlb/collateral-assets/${asset_r1}/review-eligibility"
              payload: {}
              as: CreditOfficer
            - call: "POST /fhlb/collateral-assets"
              payload: { member_bank_id: "${member_id}", asset_class: "SF_MORTGAGE", unpaid_principal_balance_cents: 12345678, market_value_cents: 20000000, ltv_bps: 7500, appraisal_date: "2026-06-01T00:00:00Z" }
              as: TreasuryOfficer
              as_user_id: "${member_id}"
              captures: { asset_r2: "$.data.id" }
          trigger:
            call: "POST /fhlb/collateral-assets/${asset_r2}/review-eligibility"
            payload: {}
            as: CreditOfficer
          assert:
            - "CollateralAsset R1: collateral_basis_cents == 12345679, discount_factor_bps == 7800, lendable_value_cents == 9629630"
            - "CollateralAsset R2: collateral_basis_cents == 12345678, discount_factor_bps == 7800, lendable_value_cents == 9629629"
            - "MemberBank.lendable_collateral_value_cents == 19259259"
            - "MemberBank.borrowing_capacity_cents == 19259259 (tier 1 cap 100%, statutory cap 2400000000 does not bind, no advances)"
            - "a value of 19259258 indicates the implementation summed the unrounded products and rounded once, which the scaffold forbids"

      - name: advance_gross_up_resolves_stock_inside_principal
        mode: "c — self-referential / circular definition resolved by a pinned evaluation order"
        grounds:
          - "calculations.advance_principal_gross_up (three pinned steps)"
          - "entities.Advance.gross_principal_cents / activity_stock_cents / net_proceeds_cents"
          - "entities.AdvanceProduct.activity_stock_pct_bps"
        distinguishing_aspect: |
          Mode (c). The activity stock obligation is a percentage of gross principal, and
          gross principal must also fund that stock purchase, so the definition refers to
          itself. The scaffold breaks the circle with a pinned three-step order
          (provisional gross by division, stock from the provisional gross with a par-value
          ceiling, final gross by addition). With N = 5,000,000 and P = 450 bps the correct
          answer is gross 5,240,000 / stock 240,000, whereas the naive single-pass reading
          (stock as a percentage of the requested net proceeds) gives stock 230,000 and
          gross 5,230,000. This is a single-record fixed point, not an aggregation-order
          question, so it is in a different mode from instance 1.
        test_recipe:
          setup: |
            Harbor Savings tier 1 with one ELIGIBLE SF_MORTGAGE asset (lendable 15,600,000,
            so capacity is ample). Product FT-450 with activity_stock_pct_bps 450 and
            min_principal_cents 1,000,000. The member requests 5,000,000 of net proceeds
            with fund_stock_from_advance = true.
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /fhlb/member-banks"
              payload: { name: "Harbor Savings", charter_type: "THRIFT", total_assets_cents: 8000000000, credit_rating_tier: 1 }
              as: SystemAdmin
              captures: { member_id: "$.data.id" }
            - call: "POST /fhlb/stock-subscriptions"
              payload: { member_bank_id: "${member_id}", subscription_type: "MEMBERSHIP", amount_cents: 9600000 }
              as: CreditOfficer
              captures: { sub_membership: "$.data.id" }
            - call: "POST /fhlb/stock-subscriptions/${sub_membership}/issue"
              payload: {}
              as: CreditOfficer
            - call: "POST /fhlb/member-banks/${member_id}/activate"
              payload: {}
              as: CreditOfficer
            - call: "POST /fhlb/member-banks/${member_id}/pledge-agreement"
              payload: { pledge_mode: "BLANKET_LIEN", effective_date: "2026-08-01T00:00:00Z" }
              as: CreditOfficer
            - call: "POST /fhlb/collateral-assets"
              payload: { member_bank_id: "${member_id}", asset_class: "SF_MORTGAGE", unpaid_principal_balance_cents: 20000000, market_value_cents: 21000000, ltv_bps: 7500, appraisal_date: "2026-06-01T00:00:00Z" }
              as: TreasuryOfficer
              as_user_id: "${member_id}"
              captures: { asset_sf: "$.data.id" }
            - call: "POST /fhlb/collateral-assets/${asset_sf}/review-eligibility"
              payload: {}
              as: CreditOfficer
            - call: "POST /fhlb/advance-products"
              payload: { product_code: "FT-450", structure: "FIXED_TERM", min_term_days: 30, max_term_days: 1095, rate_bps: 425, prepayment_fee_method: "YIELD_MAINTENANCE", activity_stock_pct_bps: 450, min_principal_cents: 1000000 }
              as: SystemAdmin
              captures: { product_id: "$.data.id" }
            - call: "GET /fhlb/member-banks/${member_id}"
              payload: {}
              as: CreditOfficer
              captures: { ver_a: "$.data.version" }
          trigger:
            call: "POST /fhlb/advances"
            payload: { member_bank_id: "${member_id}", advance_product_id: "${product_id}", term_days: 360, requested_net_proceeds_cents: 5000000, expected_member_bank_version: "${ver_a}", fund_stock_from_advance: true }
            as: TreasuryOfficer
            as_user_id: "${member_id}"
          assert:
            - "Advance.activity_stock_cents == 240000 (step 1 provisional gross 5235603, step 2 round_half_up(5235603 * 450 / 10000) = 235602, ceiled to the 10000-cent par multiple 240000)"
            - "Advance.gross_principal_cents == 5240000 (step 3: 5000000 + 240000)"
            - "Advance.net_proceeds_cents == 5000000"
            - "Advance.rate_bps == 425 and Advance.credit_status == \"REQUESTED\""
            - "Advance.capacity_at_request_cents == 15600000"
            - "an activity_stock_cents of 230000 or a gross_principal_cents of 5230000 indicates the circular definition was collapsed to a single pass over the requested net proceeds"

  # ===========================================================================
  # RULE 3 — non_linear_state_machine
  # ===========================================================================
  - rule_id: non_linear_state_machine
    applied: true
    summary: |
      Three separate non-linear shapes: Advance carries two independent state dimensions
      that move on different triggers, CollateralVerificationReview cycles back into
      FIELD_WORK under a hard retest bound, and CollateralAsset cycles
      ELIGIBLE -> SUSPENDED -> UNDER_REVIEW -> ELIGIBLE.
    instances:
      - name: advance_credit_dimension_holds_while_collateral_dimension_moves_to_shortfall
        shape: "parallel — two independent dimensions on one entity"
        grounds:
          - "state_machines.Advance.credit_status"
          - "state_machines.Advance.collateral_status (SECURED -> SHORTFALL -> SECURED)"
          - "calculations.collateral_posture_recompute"
        distinguishing_aspect: |
          PARALLEL shape: one entity, two orthogonal dimensions. A custodian's
          documentation update never touches the credit dimension, yet it moves the
          collateral dimension SECURED -> SHORTFALL; re-approving the asset moves it back
          while credit_status has stayed FUNDED throughout. Instance 2 is a CYCLE on a
          single dimension of a different entity with a counter bound; instance 3 is a
          CYCLE through a rejected-then-restored state on a third entity.
        test_recipe:
          setup: |
            Harbor Savings tier 1 with one ELIGIBLE SF_MORTGAGE asset (lendable
            15,600,000). Activity stock 680,000 plus membership stock 9,600,000 issued, so
            stock_deficiency_cents is 0. Advance D of gross 15,000,000 funded on
            2026-08-01 with term 360 days: outstanding 15,000,000, capacity 600,000, buffer
            750,000, so posture is RESTRICTED and collateral_status is SECURED.
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { now: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /fhlb/member-banks"
              payload: { name: "Harbor Savings", charter_type: "THRIFT", total_assets_cents: 8000000000, credit_rating_tier: 1 }
              as: SystemAdmin
              captures: { member_id: "$.data.id" }
            - call: "POST /fhlb/stock-subscriptions"
              payload: { member_bank_id: "${member_id}", subscription_type: "MEMBERSHIP", amount_cents: 9600000 }
              as: CreditOfficer
              captures: { sub_membership: "$.data.id" }
            - call: "POST /fhlb/stock-subscriptions/${sub_membership}/issue"
              payload: {}
