      - name: delinquency_grace_window_boundary
        grounds:
          - state_machines.Loan.REPAYING_to_DELINQUENT
          - state_machines.Loan.DELINQUENT_to_DEFAULTED
        distinguishing_aspect: |
          Different interval semantics on a different resource: the Loan's
          delinquency window is a GRACE interval keyed off installment
          due_date (< current-14d flips DELINQUENT, < current-74d flips
          DEFAULTED) — an installment 13 days past due keeps the loan
          REPAYING, 15 days past due flips it, and at exactly 74 days the
          strict < comparison means it is still DELINQUENT, not DEFAULTED.
        test_recipe:
          setup:
            - "Clock at 2026-09-01T00:00:00Z. Disbursed loan: trustee-vouched 100000 over 1 month (single installment due 2026-10-01), funded by trustee endorsement 50000 + endorsements 50000 (2 x 25000)."
