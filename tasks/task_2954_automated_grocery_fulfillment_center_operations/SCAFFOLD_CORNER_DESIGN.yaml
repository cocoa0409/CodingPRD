            - call: "GET /pick-tasks"
              payload: { order_line_id: "${line_cw}", limit: 10, offset: 0 }
              as: PickOperator
              as_user_id: "picker-1"
              captures: { task_cw: "$.data[0].id" }
            - call: "POST /totes"
              payload: { wave_id: "${wave_id}", pick_station_id: "${station_id}", tote_code: "T1", temperature_zone: "AMBIENT" }
