              as_user_id: "${pat_id}"
              captures: { b1: $.data.id }
            - call: "POST /marketplace/slots/${s2}/bookings"
              payload: { patient_id: "${pat_id}", appointment_type_id: "${type_id}" }
              as: Patient
              as_user_id: "${pat_id}"
              captures: { b2: $.data.id }
            - call: "POST /marketplace/_clock/set_current_utc"
