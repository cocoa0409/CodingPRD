  # =========================================================================
  # Rule 3 - non-linear state-machine shape on different entities
  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: package_negotiation_cycle_with_independent_spend_axis
        grounds:
          - state_machines.StartupPackage.transitions.DEAN_REVIEW_to_COUNTERED
          - state_machines.StartupPackage.transitions.COUNTERED_to_DRAFT
          - state_machines.StartupPackage.transitions.DRAFT_to_SUBMITTED
          - state_machines.StartupPackage.transitions.APPROVED_to_ACTIVE
          - state_machines.StartupPackage.transitions.NOT_YET_AVAILABLE_to_SPENDING
          - state_machines.StartupPackage.transitions.SPENDING_to_FROZEN
          - entities.StartupPackage.fields.negotiation_round
          - entities.StartupPackage.fields.counter_total_cents
          - calculations.package_tranche_consistency
        distinguishing_aspect: |
          StartupPackage carries BOTH a cycle and two parallel axes: negotiation_status runs
          DRAFT -> SUBMITTED -> DEAN_REVIEW -> COUNTERED -> DRAFT and reaches negotiation_round 2,
          and the spend_status axis moves independently on the same row - it is still
          NOT_YET_AVAILABLE at the moment negotiation_status reaches APPROVED, and it is FROZEN
          while negotiation_status is still ACTIVE.
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; three funding units; one CANDIDATE faculty; one DRAFT package of proposed_total_cents 72_000_000 with the six BASE tranches."
            - "The package is submitted and endorsed, then countered by the dean at 69_600_000 - exactly 2_400_000 less, i.e. the DISCRETIONARY tranche."
            - "The dean's office revises the package down to 69_600_000 and withdraws the still-SCHEDULED DISCRETIONARY tranche so the tranche sum matches the revised total again."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DeanOffice
            - call: "POST /funding-units"
              payload: { name: "College of Natural Sciences", unit_type: "COLLEGE", cost_share_pool_cents: 900000000 }
