      - name: conference_phase_and_revision_bounds_are_rejected
        claim_type: error_triggerable
        grounds:
          - errors.ERR_REVISION_LIMIT_REACHED
          - errors.ERR_UNDECIDED_ABSTRACTS_REMAIN
          - errors.ERR_FORMAT_NOT_ALLOWED
          - errors.ERR_REVIEW_REOPEN_LIMIT
        distinguishing_aspect: |
          Four bounded counters, each with its own code: a third revision round
          is ERR_REVISION_LIMIT_REACHED (revision_round would exceed 2), releasing
          decisions while an abstract is still SCORED is
          ERR_UNDECIDED_ABSTRACTS_REMAIN, deciding WORKSHOP for a category that
          allows only ORAL and POSTER is ERR_FORMAT_NOT_ALLOWED (p14, ahead of any
          capacity concern), and a second review reopen is
          ERR_REVIEW_REOPEN_LIMIT. Each counter is exercised at its last legal
          value first, so an off-by-one implementation fails on the legal call.
        test_recipe:
          setup:
