      - name: panel_activation_supersedes_only_the_incumbent_of_the_same_panel_number
        claim_type: conditional_cascade
        grounds:
          - state_machines.FirmPanel.PENDING_REVISION_to_SUPERSEDED
          - endpoints."POST /floodplain/firm-panels/{panelId}/activate"
          - entities.FirmPanel.fields.supersedes_panel_id
        distinguishing_aspect: |
          Activating revision J of panel 48001C0100 supersedes only the incumbent H of that
          same panel_number and repoints only its parcel; the unrelated EFFECTIVE panel
          48001C0200 stays EFFECTIVE and its parcel keeps pointing at it, proving the
          cascade is keyed on (community_id, panel_number) rather than on the community.
