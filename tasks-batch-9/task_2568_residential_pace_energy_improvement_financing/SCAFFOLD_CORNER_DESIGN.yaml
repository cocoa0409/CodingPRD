            - "First progress draw: 201 with d1_status == 'REQUESTED' (the contractor is ENROLLED, not on probation)"
            - "Second draw clears 45 (live draws 3000000 < certified 4200000) and clears 51 (1500000 <= 4200000) but is refused by 52: 422 err_payable == 'ERR_DISBURSEMENT_EXCEEDS_PAYABLE' because 3000000 + 1500000 == 4500000 > 4200000"
