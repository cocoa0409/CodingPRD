        test_recipe:
          setup:
            - "T_A, T_B with PLANNED shifts 2026-08-04T08:00-12:00; T_C's identical shift cancelled"
            - "No DemandCurve rows at all; 2026-08-04 is a Tuesday (WEEKDAY); adequacy queried for block 9, window 1, FORECAST"
          setup_api_calls:
            - { call: "POST /transport/locations", payload: { code: "HUB", name: "Hub", location_type: "OTHER", zone_code: "Z1" }, as: TransportSupervisor, captures: { loc_h: $.data.id } }
            - { call: "POST /transport/transporters", payload: { name: "T A", home_location_id: "${loc_h}" }, as: TransportSupervisor, captures: { ta: $.data.id } }
            - { call: "POST /transport/transporters", payload: { name: "T B", home_location_id: "${loc_h}" }, as: TransportSupervisor, captures: { tb: $.data.id } }
            - { call: "POST /transport/transporters", payload: { name: "T C", home_location_id: "${loc_h}" }, as: TransportSupervisor, captures: { tc: $.data.id } }
            - { call: "POST /transport/staffing-shifts", payload: { transporter_id: "${ta}", shift_start: "2026-08-04T08:00:00Z", shift_end: "2026-08-04T12:00:00Z" }, as: TransportSupervisor }
            - { call: "POST /transport/staffing-shifts", payload: { transporter_id: "${tb}", shift_start: "2026-08-04T08:00:00Z", shift_end: "2026-08-04T12:00:00Z" }, as: TransportSupervisor }
            - { call: "POST /transport/staffing-shifts", payload: { transporter_id: "${tc}", shift_start: "2026-08-04T08:00:00Z", shift_end: "2026-08-04T12:00:00Z" }, as: TransportSupervisor, captures: { sc: $.data.id } }
            - { call: "POST /transport/staffing-shifts/${sc}/set-status", payload: { status: "CANCELLED" }, as: TransportSupervisor }
          trigger:
            - { call: "GET /transport/staffing/adequacy", payload: { date: "2026-08-04", hour_block: 9, window_hours: 1, variant: "FORECAST" }, as: TransportSupervisor, captures: { req: $.data.required_transporters, sch: $.data.scheduled_transporters, gap: $.data.gap } }
          assert:
            - "required_transporters == 0 (no demand rows)"
            - "scheduled_transporters == 2 (cancelled shift excluded) and gap == 2"

      - name: standard_cleaning_finishes_without_dwell
        claim_type: constants_applied
        grounds: [state_machines.CleaningTask.IN_PROGRESS_to_AWAITING_VERIFICATION]
        distinguishing_aspect: "STANDARD tasks carry zero dwell: finish immediately after start succeeds, unlike the DEEP 15-minute rule."
        test_recipe:
