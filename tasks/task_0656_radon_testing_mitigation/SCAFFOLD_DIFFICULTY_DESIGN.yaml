  - rule_id: boundary_precision_check
    instances:
      - name: bpc_action_level_inclusive_4_0_on_record_result
        grounds:
          - calculations.action_level_classification
          - state_machines.RadonTest.RETRIEVED_to_RESULT_READY
          - entities.RadonTest.fields.action_outcome
        distinguishing_aspect: |
          On POST .../record-result a SHORT_TERM lab value of exactly 4.0 yields
          ACTION_RECOMMENDED (>= inclusive), whereas 3.9 yields NO_ACTION — the
          numeric-threshold boundary on result_pci_l.
        test_recipe:
          setup:
            - "Two SHORT_TERM tests on one property: one retrieved with lab 4.0, one with 3.9; window met at 2026-04-03."
          setup_api_calls:
            - call: "POST /inspectors"
              payload: { full_name: "Ivy Insp", nrpp_license_id: "NRPP-080" }
              as: PlatformAdmin
              captures: { insp_id: $.data.id }
            - call: "POST /properties"
              payload: { address_line: "11 Radon Way", foundation_type: "SLAB", floor_area_sqft: 1400 }
              as: ClientContact
              captures: { prop_id: $.data.id }
            - call: "POST /radon-tests"
              payload: { property_id: "${prop_id}", inspector_id: "${insp_id}", test_kind: "SHORT_TERM_48HR", purpose: "INITIAL", placement_window_hours: 48 }
              as: Inspector
              as_user_id: "${insp_id}"
              captures: { t_at: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-03T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /radon-tests/${t_at}/retrieve"
              payload: { lab_integrated_pci_l: 4.0 }
              as: Inspector
              as_user_id: "${insp_id}"
          trigger:
            - call: "POST /radon-tests/${t_at}/record-result"
              payload: {}
              as: Inspector
              as_user_id: "${insp_id}"
              captures: { outcome: $.data.action_outcome, res: $.data.result_pci_l }
          assert:
            - "RadonTest.${t_at}.result_pci_l == 4.0"
            - "RadonTest.${t_at}.action_outcome == ACTION_RECOMMENDED"

      - name: bpc_continuous_readings_empty_after_warmup_on_retrieve
        grounds:
          - validations[priority=20]
          - errors[ERR_INSUFFICIENT_READINGS]
          - entities.RadonTest.fields.warmup_hours_dropped
          - state_machines.RadonTest.PLACED_to_RETRIEVED
        distinguishing_aspect: |
          On POST .../retrieve a CONTINUOUS_MONITOR test whose hourly_readings
          length (4) is not strictly greater than warmup_hours_dropped (4) leaves
          an empty valid-set and is rejected with ERR_INSUFFICIENT_READINGS — an
          empty-collection edge on a different endpoint than the 4.0 threshold.
        test_recipe:
          setup:
            - "A CONTINUOUS_MONITOR test placed with warmup_hours_dropped=4; window met at 2026-04-03; retrieve supplies exactly 4 readings."
          setup_api_calls:
