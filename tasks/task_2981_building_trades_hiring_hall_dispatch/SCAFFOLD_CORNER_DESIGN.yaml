        distinguishing_aspect: "Three windows are derived from one clock reading of 2026-09-01T00:00:00.000Z with exact 24h day arithmetic: renewal_due_at == last_renewed_at + 30d == 2026-10-01T00:00:00.000Z, the REGISTRATION_CREATED ledger row's retention_until == recorded_at + 1825d == 2031-08-31T00:00:00.000Z, and a referral's acceptance_deadline == issued_at + 24h == 2026-09-02T00:00:00.000Z."
