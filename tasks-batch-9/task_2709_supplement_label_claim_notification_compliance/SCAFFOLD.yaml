  # ---------- StructureFunctionClaim ----------
  - method: POST
    path: "/supplement-compliance/claims"
    description: "Draft a structure-function, general-wellbeing or nutrient-deficiency claim for a product and one of its ingredients."
    roles: [RegulatoryAffairsSpecialist]
    code: 201
    input: [product_id, ingredient_id, claim_text, claim_type]
    output: StructureFunctionClaim
    side_effects: ["sets substantiation_status = DRAFT and notification_status = NOT_DUE", "sets authored_by_user_id = X-User-ID", "sets revision_round = 0", "sets version = 1"]
  - method: GET
    path: "/supplement-compliance/claims/{id}"
    description: "Fetch one claim with both status dimensions, its notification due date and its current version (the read a client uses to obtain expected_claim_version)."
    roles: [RegulatoryAffairsSpecialist, SubstantiationReviewer, ClaimApprovalOfficer, QualityAssuranceManager, ComplianceAuditor]
    code: 200
    input: []
    output: StructureFunctionClaim
    side_effects: []
  - method: GET
    path: "/supplement-compliance/claims"
    description: "List claims, filterable by product_id (FK reverse-reachability for StructureFunctionClaim.product_id), ingredient_id, substantiation_status and notification_status."
    roles: [RegulatoryAffairsSpecialist, SubstantiationReviewer, ClaimApprovalOfficer, QualityAssuranceManager, ComplianceAuditor]
    code: 200
    input: ["product_id?", "ingredient_id?", "substantiation_status?", "notification_status?", "page?", "page_size?"]
    output: StructureFunctionClaim[]
    side_effects: []
  - method: PATCH
    path: "/supplement-compliance/claims/{id}"
    description: "Reword a DRAFT or REVISION_REQUESTED claim."
    roles: [RegulatoryAffairsSpecialist]
    code: 200
    input: ["claim_text?", "claim_type?"]
    output: StructureFunctionClaim
    side_effects: ["increments StructureFunctionClaim.version by 1"]
  - method: POST
    path: "/supplement-compliance/claims/{id}/submit-for-review"
    description: "Send the claim and its DRAFT dossier into substantiation review. Freezes the dossier's competent-and-reliable final score."
    roles: [RegulatoryAffairsSpecialist]
    code: 200
    input: []
    output: StructureFunctionClaim
    side_effects: ["sets substantiation_status = UNDER_SUBSTANTIATION_REVIEW", "cascades the claim's DRAFT dossier to UNDER_REVIEW", "computes and freezes that dossier's final_score via calculations.substantiation_strength_score variant competent_reliable_final", "increments StructureFunctionClaim.version by 1"]
  - method: POST
    path: "/supplement-compliance/claims/{id}/approve"
    description: "Approve a claim whose dossier has been ACCEPTED by a different reviewer. If the product is already MARKETED, the 30-day notification window opens immediately on the claim-activation basis."
    roles: [ClaimApprovalOfficer]
    code: 200
    input: []
    output: StructureFunctionClaim
    side_effects: ["sets substantiation_status = APPROVED", "sets approved_by_user_id = X-User-ID and approved_at to the logical clock", "increments Product.active_claim_count by 1", "when product.lifecycle_status == MARKETED: sets notification_status = DUE and computes notification_due_date / notification_due_basis via calculations.claim_notification_due_date variant claim_activation_basis", "increments StructureFunctionClaim.version by 1"]
  - method: POST
    path: "/supplement-compliance/claims/{id}/withdraw"
    description: "Withdraw an approved claim from labeling and advertising; compensates the product's active-claim ledger."
    roles: [RegulatoryAffairsSpecialist, ClaimApprovalOfficer]
    code: 200
    input: [withdrawal_reason]
    output: StructureFunctionClaim
    side_effects: ["sets substantiation_status = WITHDRAWN", "decrements Product.active_claim_count by 1 and increments Product.withdrawn_claim_count by 1 (calculations.claim_ledger_invariant)", "recomputes Product.compliance_risk_index and label_posture", "increments StructureFunctionClaim.version by 1"]
  - method: POST
    path: "/supplement-compliance/claims/{id}/notify-fda"
    description: "File the 30-day post-market claim notification. Timeliness is decided by comparing the logical clock against notification_due_date."
    roles: [ClaimApprovalOfficer]
    code: 200
    input: [submission_reference]
    output: StructureFunctionClaim
    side_effects: ["sets notification_status = SUBMITTED_TIMELY or SUBMITTED_LATE", "sets notified_at to the logical clock", "on SUBMITTED_LATE: increments Product.late_notification_count by 1, recomputes compliance_risk_index (calculations.product_compliance_risk_index) and label_posture", "increments StructureFunctionClaim.version by 1"]
  # ---------- SubstantiationDossier ----------
  - method: POST
    path: "/supplement-compliance/substantiation-dossiers"
    description: "Open a substantiation dossier for a claim. Requires expected_claim_version, the version the client last read from the claim; any earlier DRAFT dossier of the same claim is superseded."
    roles: [RegulatoryAffairsSpecialist]
    code: 201
    input: [claim_id, expected_claim_version, dossier_summary]
    output: SubstantiationDossier
    side_effects: ["sets dossier_status = DRAFT, evidence_studies = [], study_count = 0, screening_score = 0.00", "sets authored_by_user_id = X-User-ID", "cascades any other DRAFT dossier of the same claim to SUPERSEDED", "increments StructureFunctionClaim.version by 1", "sets version = 1"]
  - method: GET
    path: "/supplement-compliance/substantiation-dossiers/{id}"
    description: "Fetch one dossier with its evidence array, screening_score and frozen final_score."
    roles: [RegulatoryAffairsSpecialist, SubstantiationReviewer, ClaimApprovalOfficer, ComplianceAuditor]
    code: 200
    input: []
    output: SubstantiationDossier
    side_effects: []
  - method: GET
    path: "/supplement-compliance/substantiation-dossiers"
    description: "List dossiers, filterable by claim_id (FK reverse-reachability for SubstantiationDossier.claim_id) and dossier_status."
    roles: [RegulatoryAffairsSpecialist, SubstantiationReviewer, ClaimApprovalOfficer, ComplianceAuditor]
    code: 200
    input: ["claim_id?", "dossier_status?", "page?", "page_size?"]
    output: SubstantiationDossier[]
    side_effects: []
  - method: POST
    path: "/supplement-compliance/substantiation-dossiers/{id}/evidence"
    description: "Append one study to a DRAFT dossier's evidence_studies array (element shape: study_type, subject_count, dose_match, peer_reviewed, citation) and recompute the provisional screening score."
    roles: [RegulatoryAffairsSpecialist]
    code: 200
    input: [study_type, subject_count, dose_match, peer_reviewed, citation]
    output: SubstantiationDossier
    side_effects: ["appends the study to evidence_studies", "increments study_count by 1", "recomputes screening_score via calculations.substantiation_strength_score variant screening_provisional", "increments SubstantiationDossier.version by 1"]
  - method: POST
    path: "/supplement-compliance/substantiation-dossiers/{id}/review"
    description: "Reviewer decision on a dossier under review. ACCEPT requires a frozen final_score of at least 65.00 and a reviewer other than the author; REJECT sends the claim back for revision."
    roles: [SubstantiationReviewer]
    code: 200
    input: [decision, "rejection_reason?"]
    output: SubstantiationDossier
    side_effects: ["sets dossier_status = ACCEPTED or REJECTED", "sets reviewed_by_user_id = X-User-ID and reviewed_at to the logical clock", "on REJECT: cascades the dossier's claim UNDER_SUBSTANTIATION_REVIEW -> REVISION_REQUESTED and increments that claim's revision_round by 1", "increments SubstantiationDossier.version by 1"]
  # ---------- LabelPanel ----------
  - method: POST
    path: "/supplement-compliance/label-panels"
    description: "Draft a supplement facts panel for a product over a dated effective window. Requires expected_product_version, the version the client last read from the product. Supplying supersedes_panel_id retires the named panel, vacates its window and returns a LABEL_LOCKED product to DRAFT."
    roles: [RegulatoryAffairsSpecialist]
    code: 201
    input: [product_id, expected_product_version, panel_format, serving_size_text, serving_weight_g, servings_per_container_declared, effective_from, effective_until, declared_warning_codes, "disclaimer_text?", "supersedes_panel_id?"]
    output: LabelPanel
    side_effects: ["sets panel_status = DRAFT", "when supersedes_panel_id is supplied: cascades that panel VALIDATED|LOCKED -> SUPERSEDED and, if the product was LABEL_LOCKED, cascades the product LABEL_LOCKED -> DRAFT", "increments Product.version by 1", "sets version = 1"]
  - method: GET
    path: "/supplement-compliance/label-panels/{id}"
    description: "Fetch one panel with its computed required_warning_codes, line budget and %DV coverage."
    roles: [RegulatoryAffairsSpecialist, ClaimApprovalOfficer, QualityAssuranceManager, ComplianceAuditor]
    code: 200
    input: []
    output: LabelPanel
    side_effects: []
  - method: GET
    path: "/supplement-compliance/label-panels"
    description: "List panels, filterable by product_id (FK reverse-reachability for LabelPanel.product_id), panel_status and supersedes_panel_id (FK reverse-reachability for LabelPanel.supersedes_panel_id)."
    roles: [RegulatoryAffairsSpecialist, ClaimApprovalOfficer, QualityAssuranceManager, ComplianceAuditor]
    code: 200
    input: ["product_id?", "panel_status?", "supersedes_panel_id?", "page?", "page_size?"]
    output: LabelPanel[]
    side_effects: []
  - method: PATCH
    path: "/supplement-compliance/label-panels/{id}"
    description: "Amend a DRAFT panel's printed content before validation."
    roles: [RegulatoryAffairsSpecialist]
    code: 200
    input: ["serving_size_text?", "serving_weight_g?", "servings_per_container_declared?", "effective_from?", "effective_until?", "declared_warning_codes?", "disclaimer_text?"]
    output: LabelPanel
    side_effects: ["increments LabelPanel.version by 1"]
  - method: POST
    path: "/supplement-compliance/label-panels/{id}/validate"
    description: "Run the full panel construction check: serving-size format, servings-per-container consistency, mandatory warning coverage, disclaimer presence, and the printed line budget."
    roles: [RegulatoryAffairsSpecialist]
    code: 200
    input: []
    output: LabelPanel
    side_effects: ["computes required_warning_codes (calculations.required_warning_codes)", "computes panel_total_dv_coverage_pct (calculations.panel_total_dv_coverage_pct)", "computes panel_lines_required and panel_lines_allowed (calculations.panel_line_budget)", "sets panel_status = VALIDATED", "sets validated_at to the logical clock", "increments LabelPanel.version by 1"]
  - method: POST
    path: "/supplement-compliance/label-panels/{id}/lock"
    description: "Lock a validated panel for print. Every ingredient on an ACTIVE line must be GRANDFATHERED or NDI_ACKNOWLEDGED; locking drives the product DRAFT -> LABEL_LOCKED."
    roles: [ClaimApprovalOfficer]
    code: 200
    input: []
    output: LabelPanel
    side_effects: ["sets panel_status = LOCKED", "sets locked_at to the logical clock", "cascades the product DRAFT -> LABEL_LOCKED", "increments Product.version by 1", "increments LabelPanel.version by 1"]
  # ---------- AdverseEventReport ----------
  - method: POST
    path: "/supplement-compliance/adverse-event-reports"
    description: "Intake an adverse event report against a product. Starts in RECEIVED; seriousness is decided at triage, not at intake."
    roles: [QualityAssuranceManager, RegulatoryAffairsSpecialist]
    code: 201
    input: [product_id, reporter_type, received_date, narrative, outcome_codes]
    output: AdverseEventReport
    side_effects: ["sets aer_status = RECEIVED", "sets is_serious = false", "sets version = 1"]
  - method: GET
    path: "/supplement-compliance/adverse-event-reports/{id}"
    description: "Fetch one adverse event report with its seriousness, due date, timeliness and retention date."
    roles: [QualityAssuranceManager, RegulatoryAffairsSpecialist, ClaimApprovalOfficer, ComplianceAuditor]
    code: 200
    input: []
    output: AdverseEventReport
    side_effects: []
  - method: GET
    path: "/supplement-compliance/adverse-event-reports"
    description: "List adverse event reports, filterable by product_id (FK reverse-reachability for AdverseEventReport.product_id), aer_status and is_serious."
    roles: [QualityAssuranceManager, RegulatoryAffairsSpecialist, ClaimApprovalOfficer, ComplianceAuditor]
    code: 200
    input: ["product_id?", "aer_status?", "is_serious?", "page?", "page_size?"]
    output: AdverseEventReport[]
    side_effects: []
  - method: POST
    path: "/supplement-compliance/adverse-event-reports/{id}/triage"
    description: "Triage a received report into the serious or non-serious branch. serious_override forces the serious branch even when no serious outcome code is present."
    roles: [QualityAssuranceManager]
    code: 200
    input: ["serious_override?"]
    output: AdverseEventReport
    side_effects: ["sets aer_status = TRIAGED_SERIOUS or TRIAGED_NONSERIOUS and is_serious accordingly", "sets triaged_at to the logical clock", "on the serious branch: computes submission_due_date = received_date + 15 business days (calculations.serious_ae_submission_due_date) and increments Product.serious_ae_count by 1", "on the non-serious branch: leaves submission_due_date null and increments Product.nonserious_ae_count by 1", "computes retention_until = received_date + 6 years on both branches", "recomputes Product.compliance_risk_index (calculations.product_compliance_risk_index) and Product.label_posture (calculations.product_label_posture)", "increments AdverseEventReport.version by 1"]
  - method: POST
    path: "/supplement-compliance/adverse-event-reports/{id}/submit-to-fda"
    description: "File a serious adverse event report with the agency; timeliness is decided against submission_due_date."
    roles: [RegulatoryAffairsSpecialist]
    code: 200
    input: [submission_reference]
    output: AdverseEventReport
    side_effects: ["sets aer_status = SUBMITTED_TO_FDA", "sets submitted_at to the logical clock", "sets submission_timeliness = TIMELY or LATE", "on LATE: increments Product.late_notification_count by 1 and recomputes compliance_risk_index and label_posture", "increments AdverseEventReport.version by 1"]
