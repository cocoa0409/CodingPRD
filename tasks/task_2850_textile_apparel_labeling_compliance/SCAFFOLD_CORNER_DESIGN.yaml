  - section: cross_cutting_layers
    instances:
      - name: a_stale_style_version_blocks_the_declaration_replace_and_the_correct_one_succeeds
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.fiber-declaration-replace-stale-style
          - errors.ERR_STALE_STYLE_VERSION
          - validations[priority=40]
        distinguishing_aspect: "The guarded write is a legitimate supersede, so replaying it against the version it was authored on is the only thing that fails: the first replace at version 1 succeeds and lifts the style to version 2, the identical replay at version 1 is 412, and the same body at version 2 succeeds again. The refused replay leaves declared_fibers and effective_fiber_content_text on the winner's values."
        test_recipe:
          setup:
            - "Market US is registered. Brand B1 owns style NL-OCC-1 at version 1, declared 100.0 COTTON, with no material inputs and no labels."
          setup_api_calls:
            - call: "POST /labeling/market-requirements"
              payload: { market_code: "US", required_languages: ["en"], fiber_tolerance_pp: 3.0, absolute_claim_tolerance_pp: 0.0, min_durability_cycles: 20, marking_duty_rate: 0.100, requires_identity_disclosure: true, requires_origin_statement: true }
              as: ComplianceAdmin
            - call: "POST /labeling/brands"
              payload: { legal_name: "Northline Apparel Co", party_type: "BRAND_OWNER", rn_number: "RN12345", responsibility_mode: "SELF_OF_RECORD" }
              as: ComplianceAdmin
              captures: { brand_id: $.data.id }
            - call: "POST /labeling/styles"
              payload: { brand_id: "${brand_id}", style_code: "NL-OCC-1", product_class: "WOVEN_OUTERWEAR", target_market_codes: ["US"], net_weight_grams: 320.0, declared_fibers: [{ fiber_generic_name: "COTTON", declared_pct: 100.0, ornamentation_exempt: false }] }
              as: BrandAdmin
              as_user_id: "${brand_id}"
              captures: { style_id: $.data.id, v1: $.data.version }
          trigger:
            - call: "PUT /labeling/styles/${style_id}/fiber-declaration"
              payload: { declared_fibers: [{ fiber_generic_name: "COTTON", declared_pct: 60.0, ornamentation_exempt: false }, { fiber_generic_name: "POLYESTER", declared_pct: 40.0, ornamentation_exempt: false }], expected_style_version: "${v1}" }
              as: BrandAdmin
              as_user_id: "${brand_id}"
              captures: { v2: $.data.version, text2: $.data.effective_fiber_content_text }
            - call: "PUT /labeling/styles/${style_id}/fiber-declaration"
              payload: { declared_fibers: [{ fiber_generic_name: "COTTON", declared_pct: 60.0, ornamentation_exempt: false }, { fiber_generic_name: "POLYESTER", declared_pct: 40.0, ornamentation_exempt: false }], expected_style_version: "${v1}" }
              as: BrandAdmin
              as_user_id: "${brand_id}"
              captures: { e_stale: $.data.error_id }
            - call: "GET /labeling/styles/${style_id}"
              payload: {}
              as: ComplianceAdmin
              captures: { v_mid: $.data.version, text_mid: $.data.effective_fiber_content_text }
            - call: "PUT /labeling/styles/${style_id}/fiber-declaration"
              payload: { declared_fibers: [{ fiber_generic_name: "LINEN", declared_pct: 100.0, ornamentation_exempt: false }], expected_style_version: "${v_mid}" }
              as: BrandAdmin
              as_user_id: "${brand_id}"
              captures: { v3: $.data.version, text3: $.data.effective_fiber_content_text }
          assert:
            - "First replace: HTTP 200 with ${v2} == 2 and ${text2} == \"60.0% COTTON, 40.0% POLYESTER\""
            - "Replay at the old version: HTTP 412 and ${e_stale} == \"ERR_STALE_STYLE_VERSION\" at priority 40"
            - "${v_mid} == 2 and ${text_mid} == ${text2} - the refused replay wrote nothing at all"
            - "Third replace at the current version: HTTP 200 with ${v3} == 3 and ${text3} == \"100.0% LINEN\""
            - "Every accepted write incremented version by exactly 1 and the refused one did not"

      - name: a_stale_style_version_blocks_a_determination_create
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.origin-determination-create-stale-style
          - errors.ERR_STALE_STYLE_VERSION
        distinguishing_aspect: "This guard protects a computation rather than a field: the determination freezes st_country and yf_country from the supply graph, so a create carrying a version from before the graph moved is refused even though the create itself is otherwise legal - and the sibling gate at priority 87 is never reached, which is why the error is 412 and not ERR_ORIGIN_GRAPH_INSUFFICIENT."
        test_recipe:
          setup:
            - "Market US is registered. Brand B1 owns style NL-OCC-2 declared 100.0 COTTON with a single FIBER node in IN, so its version is 2 and only the yarn-forward pool is populated."
          setup_api_calls:
