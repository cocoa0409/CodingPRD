            - "GET /retiree-benefits/election-events returns total_count == 0"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: plan_year_draft_to_open_valid_transition
        claim_type: Valid Transition
        grounds:
          - state_machines.PlanYear.DRAFT_to_OPEN
          - endpoints["POST /retiree-benefits/plan-years/{plan_year_id}/status"]
        distinguishing_aspect: |
          The only declared successor of DRAFT is OPEN. The transition must move
          status, bump version by exactly 1, and cascade nothing - there are no
          PlanOption or ElectionEvent rows to touch, and the four valuation
          aggregates must stay at 0.
        test_recipe:
          setup:
            - "One PlanYear 2027 in status DRAFT with version 1."
            - "Logical clock at 2026-10-20T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-20T00:00:00Z" }
              as: BenefitsAdmin
              as_user_id: "admin-01"
            - call: "POST /retiree-benefits/plan-years"
              payload: { year: 2027, open_enrollment_start: "2026-10-15T00:00:00Z", open_enrollment_end: "2026-11-15T00:00:00Z", coverage_start: "2027-01-01T00:00:00Z", hra_credit_pre_medicare_cents: 185000, hra_credit_medicare_cents: 209500, carryover_cap_pct: 0.5, discount_rate_bps: 500, assumed_annual_subsidy_cents: 240000, assumed_payment_years: 20 }
              as: BenefitsAdmin
              as_user_id: "admin-01"
              captures: { py_id: $.data.id }
          trigger:
            - call: "POST /retiree-benefits/plan-years/${py_id}/status"
              payload: { to_status: "OPEN" }
              as: BenefitsAdmin
              as_user_id: "admin-01"
          assert:
            - "HTTP status is 200"
            - "data.status == OPEN"
            - "data.version == 2, exactly one increment"
            - "data.epbo_total_cents == 0 and data.liability_valued_at is null, so the transition ran no valuation"
            - "data.updated_at == 2026-10-20T00:00:00.000Z, the logical clock"

      - name: plan_year_draft_to_archived_is_an_invalid_transition
        claim_type: Invalid Transitions
        grounds:
          - state_machines.PlanYear
          - errors.ERR_INVALID_PLAN_YEAR_TRANSITION
          - validations[priority=16]
        distinguishing_aspect: |
          Only DRAFT->OPEN, OPEN->CLOSED and CLOSED->ARCHIVED are declared, so
          from DRAFT every other to_status value must raise
          ERR_INVALID_PLAN_YEAR_TRANSITION (409) - including the two-hop skip to
          CLOSED and the three-hop skip to ARCHIVED. to_status DRAFT, a self
          transition, must fail too.
        test_recipe:
          setup:
            - "One PlanYear 2027 in status DRAFT with version 1."
          setup_api_calls:
            - call: "POST /retiree-benefits/plan-years"
              payload: { year: 2027, open_enrollment_start: "2026-10-15T00:00:00Z", open_enrollment_end: "2026-11-15T00:00:00Z", coverage_start: "2027-01-01T00:00:00Z", hra_credit_pre_medicare_cents: 185000, hra_credit_medicare_cents: 209500, carryover_cap_pct: 0.5, discount_rate_bps: 500, assumed_annual_subsidy_cents: 240000, assumed_payment_years: 20 }
              as: BenefitsAdmin
              as_user_id: "admin-01"
              captures: { py_id: $.data.id }
          trigger:
            - call: "POST /retiree-benefits/plan-years/${py_id}/status"
              payload: { to_status: "CLOSED" }
              as: BenefitsAdmin
              as_user_id: "admin-01"
              captures: { err_closed: $.data.error_id }
            - call: "POST /retiree-benefits/plan-years/${py_id}/status"
              payload: { to_status: "ARCHIVED" }
              as: BenefitsAdmin
              as_user_id: "admin-01"
              captures: { err_archived: $.data.error_id }
            - call: "POST /retiree-benefits/plan-years/${py_id}/status"
              payload: { to_status: "DRAFT" }
              as: BenefitsAdmin
              as_user_id: "admin-01"
              captures: { err_self: $.data.error_id }
          assert:
            - "SKIP TO CLOSED: HTTP 409 with data.error_id == ERR_INVALID_PLAN_YEAR_TRANSITION"
            - "SKIP TO ARCHIVED: HTTP 409 with data.error_id == ERR_INVALID_PLAN_YEAR_TRANSITION"
            - "SELF TRANSITION: HTTP 409 with data.error_id == ERR_INVALID_PLAN_YEAR_TRANSITION"
            - "PlanYear.${py_id}.status is still DRAFT and version is still 1 after all three rejections"

      - name: plan_option_initial_state_is_draft_and_not_started
        claim_type: Initial State
        grounds:
          - state_machines.PlanOption.initial_state
          - entities.PlanOption.fields.status
          - entities.PlanOption.fields.subsidy_certification_status
        distinguishing_aspect: |
          PlanOption's declared initial state is the pair "DRAFT x NOT_STARTED",
          so both independent dimensions must be seeded on creation, together
          with enrolled_count 0 and both actuarial test flags false. A handler
          that seeds only the availability dimension leaves
          subsidy_certification_status null and fails.
        test_recipe:
          setup:
            - "One PlanYear 2027 in status DRAFT."
          setup_api_calls:
            - call: "POST /retiree-benefits/plan-years"
              payload: { year: 2027, open_enrollment_start: "2026-10-15T00:00:00Z", open_enrollment_end: "2026-11-15T00:00:00Z", coverage_start: "2027-01-01T00:00:00Z", hra_credit_pre_medicare_cents: 185000, hra_credit_medicare_cents: 209500, carryover_cap_pct: 0.5, discount_rate_bps: 500, assumed_annual_subsidy_cents: 240000, assumed_payment_years: 20 }
              as: BenefitsAdmin
              as_user_id: "admin-01"
              captures: { py_id: $.data.id }
          trigger:
            - call: "POST /retiree-benefits/plan-options"
              payload: { plan_year_id: "${py_id}", plan_code: "MED-WRAP", coverage_class: "MEDICARE_GROUP_WRAP", monthly_premium_cents: 32900, requires_medicare_part_b: true, allowed_grandfather_groups: ["GRANDFATHERED_A", "TRANSITION_B"], subsidy_vehicle: "EGWP", rx_gross_value_bps: 10500, rx_net_value_bps: 7800 }
              as: BenefitsAdmin
              as_user_id: "admin-01"
              captures: { po_med_id: $.data.id }
          assert:
            - "HTTP status is 201"
            - "data.status == DRAFT"
            - "data.subsidy_certification_status == NOT_STARTED"
            - "data.enrolled_count == 0"
            - "data.gross_test_passed == false and data.net_test_passed == false"
            - "data.equivalence_margin_bps is null, attested_by_user_id is null and certified_by_user_id is null"
            - "data.pending_change_type is null and data.change_notice_issued_at is null"

      - name: plan_year_archived_terminal_state_rejects_every_trigger
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.PlanYear.terminal_states
          - errors.ERR_INVALID_PLAN_YEAR_TRANSITION
        distinguishing_aspect: |
          ARCHIVED is the only terminal state of PlanYear and it is reached only
          from CLOSED. Once there, every to_status value must be refused,
          including the otherwise legal OPEN and CLOSED. The chain also proves
          CLOSED->ARCHIVED is admitted when no HraAccount of the year is OPEN.
        test_recipe:
          setup:
            - "PlanYear 2027 walked DRAFT -> OPEN -> CLOSED -> ARCHIVED with no HraAccount in existence, so version is 4."
          setup_api_calls:
            - call: "POST /retiree-benefits/plan-years"
              payload: { year: 2027, open_enrollment_start: "2026-10-15T00:00:00Z", open_enrollment_end: "2026-11-15T00:00:00Z", coverage_start: "2027-01-01T00:00:00Z", hra_credit_pre_medicare_cents: 185000, hra_credit_medicare_cents: 209500, carryover_cap_pct: 0.5, discount_rate_bps: 500, assumed_annual_subsidy_cents: 240000, assumed_payment_years: 20 }
              as: BenefitsAdmin
              as_user_id: "admin-01"
              captures: { py_id: $.data.id }
            - call: "POST /retiree-benefits/plan-years/${py_id}/status"
              payload: { to_status: "OPEN" }
              as: BenefitsAdmin
              as_user_id: "admin-01"
            - call: "POST /retiree-benefits/plan-years/${py_id}/status"
              payload: { to_status: "CLOSED" }
              as: BenefitsAdmin
              as_user_id: "admin-01"
            - call: "POST /retiree-benefits/plan-years/${py_id}/status"
              payload: { to_status: "ARCHIVED" }
              as: BenefitsAdmin
              as_user_id: "admin-01"
          trigger:
            - call: "POST /retiree-benefits/plan-years/${py_id}/status"
              payload: { to_status: "OPEN" }
              as: BenefitsAdmin
              as_user_id: "admin-01"
              captures: { err_open: $.data.error_id }
            - call: "POST /retiree-benefits/plan-years/${py_id}/status"
              payload: { to_status: "ARCHIVED" }
              as: BenefitsAdmin
              as_user_id: "admin-01"
              captures: { err_again: $.data.error_id }
          assert:
            - "PlanYear.${py_id}.status == ARCHIVED and version == 4 before the trigger"
            - "REOPEN: HTTP 409 with data.error_id == ERR_INVALID_PLAN_YEAR_TRANSITION"
            - "RE-ARCHIVE: HTTP 409 with data.error_id == ERR_INVALID_PLAN_YEAR_TRANSITION"
            - "PlanYear.${py_id}.version is still 4, so neither rejected call wrote anything"

      - name: determination_certify_twice_rejected_on_second_call
        claim_type: Idempotency
        grounds:
          - state_machines.EligibilityDetermination.DRAFT_to_CERTIFIED
          - errors.ERR_INVALID_DETERMINATION_STATE
          - validations[priority=19]
        distinguishing_aspect: |
          Certification is not idempotent: the second identical certify must
          raise ERR_INVALID_DETERMINATION_STATE (409) because the from-state is
          DRAFT and the row is already CERTIFIED. Crucially the retry uses a
          third user id, so the rejection must come from the state check at
          priority 19 rather than from segregation of duties at priority 25, and
          certified_by_user_id must still name the first certifier.
        test_recipe:
          setup:
            - "PlanYear 2027 in status OPEN."
            - "Retiree R1 with one EligibilityDetermination in status CERTIFIED, certified by analyst-02."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-20T00:00:00Z" }
              as: BenefitsAdmin
              as_user_id: "admin-01"
            - call: "POST /retiree-benefits/plan-years"
              payload: { year: 2027, open_enrollment_start: "2026-10-15T00:00:00Z", open_enrollment_end: "2026-11-15T00:00:00Z", coverage_start: "2027-01-01T00:00:00Z", hra_credit_pre_medicare_cents: 185000, hra_credit_medicare_cents: 209500, carryover_cap_pct: 0.5, discount_rate_bps: 500, assumed_annual_subsidy_cents: 240000, assumed_payment_years: 20 }
