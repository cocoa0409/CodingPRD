            - "Observation 3 (compensating action, settle WITHDRAW): finding_status WITHDRAWN, settled_amount_cents 0, interest_cents 0, receivable_balance_cents STILL 690000."
            - "Observation 4 (second compensating action, retroactive promulgation supersedes the statement): statement status SUPERSEDED and receivable_balance_cents back to exactly 0 — the pre-issue value, with no residue from the withdrawn audit."
