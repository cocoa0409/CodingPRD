          nameplate_wattage: 250
        as: ProgramManager
        captures:
          p1: $.data.id
      - call: POST /streetlights/poles/${p1}/attest-nameplate
        payload: {}
        as: BillingAnalyst
      - call: POST /streetlights/poles
        payload:
          district_id: ${dist}
          pole_number: V-02
