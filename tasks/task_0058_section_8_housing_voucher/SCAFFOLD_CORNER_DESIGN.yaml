scaffold_corner_design:
  # =========================================================================
  - section: entities
    instances:
      - name: create_region_returns_201_with_fields
        claim_type: Creation
        grounds:
          - entities.Region.fields.code
          - entities.Region.fields.name
        distinguishing_aspect: "POST /regions with code/name/fmr_year returns 201 and echoes code, name, version==1."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /regions"
              payload: { code: "R1", name: "Region One", fmr_year: 2026 }
              as: ProgramAdmin
              captures: { rid: $.data.id }
          assert:
            - "response.status == 201"
            - "Region.${rid}.code == R1"
            - "Region.${rid}.version == 1"
            - "Region.${rid}.is_special_mobility_area == false"

      - name: get_household_not_found_returns_404
        claim_type: Not Found
        grounds:
          - entities.Household
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET /households/{nonexistent-uuid} returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "GET /households/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Caseworker
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 404"
            - "response.data.error_id == ERR_NOT_FOUND"

      - name: create_household_missing_required_field_returns_400
        claim_type: Required Fields
        grounds:
          - entities.Household.fields.family_size
          - errors[ERR_VALIDATION]
        distinguishing_aspect: "POST /households omitting family_size returns ERR_VALIDATION (400)."
        test_recipe:
          setup: ["A region exists."]
          setup_api_calls:
            - call: "POST /regions"
              payload: { code: "RQ1", name: "Rq1", fmr_year: 2026 }
              as: ProgramAdmin
              captures: { rid: $.data.id }
          trigger:
            - call: "POST /households"
              payload: { head_name: "No Size", annual_income_cents: 1000000, region_id: "${rid}" }
              as: Caseworker
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_VALIDATION"

      - name: household_default_dependents_zero
        claim_type: Defaults
        grounds:
          - entities.Household.fields.dependents_count
        distinguishing_aspect: "Omitting dependents_count defaults it to 0 on the created Household."
        test_recipe:
          setup: ["A region exists."]
          setup_api_calls:
            - call: "POST /regions"
              payload: { code: "RD1", name: "Rd1", fmr_year: 2026 }
              as: ProgramAdmin
              captures: { rid: $.data.id }
          trigger:
            - call: "POST /households"
              payload: { head_name: "Def Fam", family_size: 2, annual_income_cents: 1000000, region_id: "${rid}" }
              as: Caseworker
              captures: { hh: $.data.id }
          assert:
            - "Household.${hh}.dependents_count == 0"
            - "Household.${hh}.elderly_or_disabled == false"

      - name: voucher_bedroom_size_computed_input_ignored
        claim_type: Computed Fields
        grounds:
          - entities.Voucher.fields.bedroom_size
          - calculations.occupancy_bedroom_size
        distinguishing_aspect: "Voucher.bedroom_size is computed via occupancy_bedroom_size (family_size 4 -> 2), not taken from input."
        test_recipe:
          setup: ["An ELIGIBLE household with family_size 4."]
          setup_api_calls:
            - call: "POST /regions"
              payload: { code: "RC1", name: "Rc1", fmr_year: 2026 }
              as: ProgramAdmin
              captures: { rid: $.data.id }
            - call: "POST /households"
              payload: { head_name: "Comp Fam", family_size: 4, annual_income_cents: 1800000, region_id: "${rid}" }
              as: Caseworker
              captures: { hh: $.data.id }
            - call: "POST /households/${hh}/determine-eligibility"
              payload: {}
              as: Caseworker
          trigger:
            - call: "POST /vouchers"
              payload: { household_id: "${hh}" }
              as: Caseworker
              captures: { vid: $.data.id }
          assert:
            - "Voucher.${vid}.bedroom_size == 2"

      - name: payment_standard_bad_bedroom_size_enum_range
        claim_type: Type Constraints
        grounds:
          - entities.PaymentStandard.fields.bedroom_size
          - errors[ERR_VALIDATION]
        distinguishing_aspect: "POST /payment-standards with bedroom_size 7 (>6) returns ERR_VALIDATION (400)."
        test_recipe:
          setup: ["A region exists."]
          setup_api_calls:
            - call: "POST /regions"
              payload: { code: "RT1", name: "Rt1", fmr_year: 2026 }
              as: ProgramAdmin
              captures: { rid: $.data.id }
          trigger:
            - call: "POST /payment-standards"
              payload: { region_id: "${rid}", bedroom_size: 7, amount_cents: 90000, fmr_cents: 100000 }
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 400"
            - "response.data.error_id == ERR_VALIDATION"

      - name: rent_reasonableness_immutable_no_version
        claim_type: Immutability
        grounds:
          - entities.RentReasonablenessDetermination
        distinguishing_aspect: "RentReasonablenessDetermination has common_fields:false — its create response carries id and created_at but no version field."
        test_recipe:
          setup: ["A unit exists."]
          setup_api_calls:
            - call: "POST /regions"
              payload: { code: "RI1", name: "Ri1", fmr_year: 2026 }
              as: ProgramAdmin
              captures: { rid: $.data.id }
            - call: "POST /landlords"
              payload: { name: "LLi", payee_account: "acct-i" }
              as: ProgramAdmin
              captures: { ll: $.data.id }
            - call: "POST /units"
              payload: { landlord_id: "${ll}", region_id: "${rid}", bedroom_size: 1, asking_rent_cents: 80000, comparable_rent_cents: 80000 }
              as: Landlord
              as_user_id: "${ll}"
              captures: { unit: $.data.id }
          trigger:
            - call: "POST /rent-reasonableness"
              payload: { unit_id: "${unit}", requested_rent_cents: 70000 }
              as: Caseworker
              captures: { det: $.data.id }
          assert:
            - "response.status == 201"
            - "RentReasonablenessDetermination.${det}.outcome == REASONABLE"

      - name: list_payment_standards_pagination_envelope
        claim_type: Listing
        grounds:
          - entities.PaymentStandard
          - endpoints
        distinguishing_aspect: "GET /payment-standards?region_id=R returns a paginated array with total_count and has_more in meta."
        test_recipe:
          setup: ["A region with one payment standard."]
          setup_api_calls:
            - call: "POST /regions"
              payload: { code: "RL1", name: "Rl1", fmr_year: 2026 }
              as: ProgramAdmin
              captures: { rid: $.data.id }
            - call: "POST /payment-standards"
              payload: { region_id: "${rid}", bedroom_size: 1, amount_cents: 90000, fmr_cents: 100000 }
              as: ProgramAdmin
          trigger:
            - call: "GET /payment-standards?region_id=${rid}"
              payload: {}
              as: ProgramAdmin
          assert:
            - "response.status == 200"
            - "response.meta_total_count == 1"
            - "response.data.length == 1"

  # =========================================================================
  - section: state_machines
    instances:
      - name: pass_inspection_from_passed_invalid_transition
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Inspection.SCHEDULED_to_PASSED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Passing an inspection already PASSED returns ERR_INVALID_STATE (409); no side effects."
        test_recipe:
          setup: ["A unit with an INITIAL inspection already PASSED."]
          setup_api_calls:
            - call: "POST /regions"
              payload: { code: "SM1", name: "Sm1", fmr_year: 2026 }
              as: ProgramAdmin
              captures: { rid: $.data.id }
            - call: "POST /landlords"
              payload: { name: "LLs", payee_account: "acct-s" }
              as: ProgramAdmin
              captures: { ll: $.data.id }
            - call: "POST /units"
              payload: { landlord_id: "${ll}", region_id: "${rid}", bedroom_size: 1, asking_rent_cents: 80000, comparable_rent_cents: 80000 }
              as: Landlord
              as_user_id: "${ll}"
              captures: { unit: $.data.id }
            - call: "POST /inspections"
              payload: { unit_id: "${unit}", inspection_type: "INITIAL", scheduled_date: "2026-06-01T00:00:00Z" }
              as: Inspector
              captures: { insp: $.data.id }
            - call: "POST /inspections/${insp}/pass"
              payload: {}
              as: Inspector
          trigger:
            - call: "POST /inspections/${insp}/pass"
              payload: {}
              as: Inspector
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: terminal_terminated_contract_no_further_transition
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.HapContract.ACTIVE_to_TERMINATED
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Terminating a HapContract already TERMINATED returns ERR_INVALID_STATE (409)."
        test_recipe:
          setup: ["A HapContract that has been terminated."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /regions"
              payload: { code: "SM2", name: "Sm2", fmr_year: 2026 }
              as: ProgramAdmin
              captures: { rid: $.data.id }
            - call: "POST /payment-standards"
              payload: { region_id: "${rid}", bedroom_size: 2, amount_cents: 95000, fmr_cents: 100000 }
              as: ProgramAdmin
            - call: "POST /households"
              payload: { head_name: "Sm2 Fam", family_size: 3, annual_income_cents: 1800000, region_id: "${rid}", dependents_count: 2 }
              as: Caseworker
              captures: { hh: $.data.id }
            - call: "POST /households/${hh}/determine-eligibility"
              payload: {}
              as: Caseworker
            - call: "POST /vouchers"
              payload: { household_id: "${hh}" }
              as: Caseworker
              captures: { vid: $.data.id, vver: $.data.version }
            - call: "POST /landlords"
              payload: { name: "LLs2", payee_account: "acct-s2" }
              as: ProgramAdmin
              captures: { ll: $.data.id }
            - call: "POST /units"
              payload: { landlord_id: "${ll}", region_id: "${rid}", bedroom_size: 2, asking_rent_cents: 90000, comparable_rent_cents: 90000 }
              as: Landlord
              as_user_id: "${ll}"
              captures: { unit: $.data.id }
            - call: "POST /inspections"
              payload: { unit_id: "${unit}", inspection_type: "INITIAL", scheduled_date: "2026-06-01T00:00:00Z" }
              as: Inspector
              captures: { insp: $.data.id }
            - call: "POST /inspections/${insp}/pass"
              payload: {}
              as: Inspector
            - call: "POST /hap-contracts"
              payload: { voucher_id: "${vid}", unit_id: "${unit}", contract_rent_cents: 90000, expected_voucher_version: "${vver}" }
              as: Caseworker
              captures: { hc: $.data.id }
            - call: "POST /hap-contracts/${hc}/terminate"
              payload: {}
              as: Caseworker
          trigger:
            - call: "POST /hap-contracts/${hc}/terminate"
              payload: {}
              as: Caseworker
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_INVALID_STATE"

      - name: voucher_initial_state_issued
        claim_type: Initial State
        grounds:
          - state_machines.Voucher
          - entities.Voucher.fields.status
        distinguishing_aspect: "A freshly issued voucher starts in status ISSUED."
        test_recipe:
          setup: ["An ELIGIBLE household."]
          setup_api_calls:
            - call: "POST /regions"
              payload: { code: "SM3", name: "Sm3", fmr_year: 2026 }
              as: ProgramAdmin
              captures: { rid: $.data.id }
            - call: "POST /households"
              payload: { head_name: "Sm3 Fam", family_size: 2, annual_income_cents: 1500000, region_id: "${rid}" }
              as: Caseworker
              captures: { hh: $.data.id }
            - call: "POST /households/${hh}/determine-eligibility"
              payload: {}
              as: Caseworker
          trigger:
            - call: "POST /vouchers"
              payload: { household_id: "${hh}" }
              as: Caseworker
              captures: { vid: $.data.id }
          assert:
            - "Voucher.${vid}.status == ISSUED"

      - name: portability_deny_branch_marks_denied
        claim_type: Valid Transition
        grounds:
          - state_machines.PortabilityMove.REQUESTED_to_DENIED
        distinguishing_aspect: "Denying a REQUESTED portability move sets status DENIED and leaves the voucher ISSUED."
        test_recipe:
          setup: ["A REQUESTED portability move to a different region."]
          setup_api_calls:
            - call: "POST /regions"
              payload: { code: "SM4_HOME", name: "Sm4 Home", fmr_year: 2026 }
              as: ProgramAdmin
              captures: { home: $.data.id }
            - call: "POST /regions"
              payload: { code: "SM4_DEST", name: "Sm4 Dest", fmr_year: 2026 }
              as: ProgramAdmin
              captures: { dest: $.data.id }
            - call: "POST /households"
              payload: { head_name: "Sm4 Fam", family_size: 2, annual_income_cents: 1500000, region_id: "${home}" }
              as: Caseworker
              captures: { hh: $.data.id }
            - call: "POST /households/${hh}/determine-eligibility"
              payload: {}
              as: Caseworker
            - call: "POST /vouchers"
              payload: { household_id: "${hh}" }
              as: Caseworker
              captures: { vid: $.data.id }
            - call: "POST /portability-moves"
              payload: { voucher_id: "${vid}", receiving_region_id: "${dest}" }
              as: PortabilityCoordinator
              captures: { pm: $.data.id }
          trigger:
            - call: "POST /portability-moves/${pm}/deny"
              payload: {}
              as: PortabilityCoordinator
          assert:
            - "PortabilityMove.${pm}.status == DENIED"
            - "Voucher.${vid}.status == ISSUED"

      - name: portability_billing_branch_marks_porting_out
        claim_type: Valid Transition
        grounds:
          - state_machines.PortabilityMove.REQUESTED_to_APPROVED
          - calculations.portability_billing_mode
        distinguishing_aspect: "Approving a move to a non-mobility region resolves BILLING, sets move APPROVED, voucher PORTING_OUT, issuing_region_id unchanged."
        test_recipe:
          setup: ["A REQUESTED move to a NON special-mobility region."]
          setup_api_calls:
            - call: "POST /regions"
              payload: { code: "BIL_HOME", name: "Bil Home", fmr_year: 2026 }
              as: ProgramAdmin
              captures: { home: $.data.id }
            - call: "POST /regions"
              payload: { code: "BIL_DEST", name: "Bil Dest", fmr_year: 2026, is_special_mobility_area: false }
              as: ProgramAdmin
              captures: { dest: $.data.id }
            - call: "POST /households"
              payload: { head_name: "Bil Fam", family_size: 2, annual_income_cents: 1500000, region_id: "${home}" }
              as: Caseworker
              captures: { hh: $.data.id }
            - call: "POST /households/${hh}/determine-eligibility"
              payload: {}
              as: Caseworker
            - call: "POST /vouchers"
              payload: { household_id: "${hh}" }
              as: Caseworker
              captures: { vid: $.data.id }
            - call: "POST /portability-moves"
              payload: { voucher_id: "${vid}", receiving_region_id: "${dest}" }
              as: PortabilityCoordinator
              captures: { pm: $.data.id }
          trigger:
            - call: "POST /portability-moves/${pm}/approve"
              payload: {}
              as: PortabilityCoordinator
          assert:
            - "PortabilityMove.${pm}.billing_mode == BILLING"
            - "PortabilityMove.${pm}.status == APPROVED"
            - "Voucher.${vid}.status == PORTING_OUT"
            - "Voucher.${vid}.issuing_region_id == ${home}"

      - name: initial_inspection_pass_marks_unit_under_contract
        claim_type: Side Effect Execution
        grounds:
          - state_machines.Inspection.SCHEDULED_to_PASSED
          - entities.Unit.fields.status
        distinguishing_aspect: "Passing an INITIAL inspection flips the linked Unit to UNDER_CONTRACT."
        test_recipe:
          setup: ["A LISTED unit with a SCHEDULED INITIAL inspection."]
          setup_api_calls:
            - call: "POST /regions"
              payload: { code: "SE1", name: "Se1", fmr_year: 2026 }
              as: ProgramAdmin
              captures: { rid: $.data.id }
            - call: "POST /landlords"
              payload: { name: "LLse", payee_account: "acct-se" }
              as: ProgramAdmin
              captures: { ll: $.data.id }
            - call: "POST /units"
              payload: { landlord_id: "${ll}", region_id: "${rid}", bedroom_size: 1, asking_rent_cents: 80000, comparable_rent_cents: 80000 }
              as: Landlord
              as_user_id: "${ll}"
              captures: { unit: $.data.id }
            - call: "POST /inspections"
              payload: { unit_id: "${unit}", inspection_type: "INITIAL", scheduled_date: "2026-06-01T00:00:00Z" }
              as: Inspector
              captures: { insp: $.data.id }
          trigger:
            - call: "POST /inspections/${insp}/pass"
              payload: {}
              as: Inspector
          assert:
            - "Inspection.${insp}.status == PASSED"
            - "Unit.${unit}.status == UNDER_CONTRACT"

      - name: cure_after_deadline_invalid_returns_error
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Inspection.FAILED_to_CURED
          - validations[priority=13]
          - errors[ERR_CURE_DEADLINE_PASSED]
        distinguishing_aspect: "Curing strictly after cure_deadline (current_utc > deadline) returns ERR_CURE_DEADLINE_PASSED (422)."
        test_recipe:
          setup: ["An ANNUAL inspection FAILED 2026-06-15 (deadline 2026-06-29); clock advanced to 2026-06-30 (past deadline)."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /regions"
              payload: { code: "CDL", name: "Cdl", fmr_year: 2026 }
              as: ProgramAdmin
              captures: { rid: $.data.id }
            - call: "POST /payment-standards"
              payload: { region_id: "${rid}", bedroom_size: 2, amount_cents: 95000, fmr_cents: 100000 }
              as: ProgramAdmin
            - call: "POST /households"
              payload: { head_name: "Cdl Fam", family_size: 3, annual_income_cents: 1800000, region_id: "${rid}", dependents_count: 2 }
              as: Caseworker
              captures: { hh: $.data.id }
            - call: "POST /households/${hh}/determine-eligibility"
              payload: {}
              as: Caseworker
            - call: "POST /vouchers"
              payload: { household_id: "${hh}" }
              as: Caseworker
              captures: { vid: $.data.id, vver: $.data.version }
            - call: "POST /landlords"
              payload: { name: "LLcdl", payee_account: "acct-cdl" }
              as: ProgramAdmin
              captures: { ll: $.data.id }
            - call: "POST /units"
              payload: { landlord_id: "${ll}", region_id: "${rid}", bedroom_size: 2, asking_rent_cents: 90000, comparable_rent_cents: 90000 }
              as: Landlord
              as_user_id: "${ll}"
              captures: { unit: $.data.id }
            - call: "POST /inspections"
              payload: { unit_id: "${unit}", inspection_type: "INITIAL", scheduled_date: "2026-06-01T00:00:00Z" }
              as: Inspector
              captures: { insp0: $.data.id }
            - call: "POST /inspections/${insp0}/pass"
              payload: {}
              as: Inspector
            - call: "POST /hap-contracts"
              payload: { voucher_id: "${vid}", unit_id: "${unit}", contract_rent_cents: 90000, expected_voucher_version: "${vver}" }
              as: Caseworker
              captures: { hc: $.data.id }
            - call: "POST /inspections"
              payload: { unit_id: "${unit}", inspection_type: "ANNUAL", scheduled_date: "2026-06-15T00:00:00Z", hap_contract_id: "${hc}" }
              as: Inspector
              captures: { insp1: $.data.id }
            - call: "POST /inspections/${insp1}/fail"
              payload: {}
              as: Inspector
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-30T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /inspections/${insp1}/cure"
              payload: {}
              as: Inspector
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_CURE_DEADLINE_PASSED"

  # =========================================================================
  - section: calculations
    instances:
      - name: income_eligibility_inclusive_boundary_equal_passes
        claim_type: Correct Result
        grounds:
          - calculations.income_eligibility
          - calculations.adjusted_income
          - state_machines.Household.APPLIED_to_ELIGIBLE
        distinguishing_aspect: "Household with adjusted income exactly at the family-size-3 limit (3,600,000) is ELIGIBLE (INCLUSIVE <=)."
        test_recipe:
          setup: ["Household family_size 3, gross 3,600,000, no deductions -> adjusted 3,600,000 == limit(3)=3,600,000."]
          setup_api_calls:
            - call: "POST /regions"
              payload: { code: "ELIG_B", name: "EligB", fmr_year: 2026 }
              as: ProgramAdmin
              captures: { rid: $.data.id }
            - call: "POST /households"
              payload: { head_name: "Edge Fam", family_size: 3, annual_income_cents: 3600000, region_id: "${rid}" }
              as: Caseworker
              captures: { hh: $.data.id }
          trigger:
            - call: "POST /households/${hh}/determine-eligibility"
              payload: {}
              as: Caseworker
          assert:
            - "Household.${hh}.adjusted_annual_income_cents == 3600000"
            - "Household.${hh}.status == ELIGIBLE"

      - name: income_eligibility_just_over_limit_ineligible
        claim_type: Correct Result
        grounds:
          - calculations.income_eligibility
          - state_machines.Household.APPLIED_to_INELIGIBLE
        distinguishing_aspect: "Household with adjusted income 3,600,001 (one cent over the family-size-3 limit) is INELIGIBLE."
        test_recipe:
          setup: ["Household family_size 3, gross 3,600,001, no deductions -> adjusted 3,600,001 > limit 3,600,000."]
          setup_api_calls:
            - call: "POST /regions"
              payload: { code: "INELIG_B", name: "InEligB", fmr_year: 2026 }
              as: ProgramAdmin
              captures: { rid: $.data.id }
            - call: "POST /households"
              payload: { head_name: "Over Fam", family_size: 3, annual_income_cents: 3600001, region_id: "${rid}" }
              as: Caseworker
              captures: { hh: $.data.id }
          trigger:
            - call: "POST /households/${hh}/determine-eligibility"
              payload: {}
              as: Caseworker
          assert:
            - "Household.${hh}.status == INELIGIBLE"

      - name: adjusted_income_floored_at_zero
        claim_type: Constants Applied
        grounds:
          - calculations.adjusted_income
          - entities.Household.fields.adjusted_annual_income_cents
        distinguishing_aspect: "Deductions exceeding gross income floor adjusted_annual_income_cents at 0, not negative."
        test_recipe:
          setup: ["Household gross 50,000, 2 dependents (deduction 96,000) -> floored to 0."]
          setup_api_calls:
            - call: "POST /regions"
              payload: { code: "FLOOR_R", name: "FloorR", fmr_year: 2026 }
              as: ProgramAdmin
              captures: { rid: $.data.id }
            - call: "POST /households"
              payload: { head_name: "Floor Fam", family_size: 3, annual_income_cents: 50000, region_id: "${rid}", dependents_count: 2 }
              as: Caseworker
              captures: { hh: $.data.id }
          trigger:
            - call: "POST /households/${hh}/determine-eligibility"
              payload: {}
              as: Caseworker
          assert:
            - "Household.${hh}.adjusted_annual_income_cents == 0"
            - "Household.${hh}.status == ELIGIBLE"

