      - name: depth_tolerance_boundary_flips_evidence_variant_at_seven_inches
        grounds:
          - calculations.prior_rights_state_share
          - entities.SubsurfaceInvestigation.fields.contradicts_record
          - entities.PriorRightsDetermination.fields.final_state_share_pct
          - endpoints.POST_/uro/prior-rights/{id}/issue
        distinguishing_aspect: |
          A different metric (final_state_share_pct) at a different endpoint
          (POST /uro/prior-rights/{id}/issue). DEPTH_TOLERANCE_IN is 6 and the test is strictly
          greater-than, so a QL_A hole measuring 54 inches against a recorded 48 (difference exactly
          6) does NOT contradict the record and the share stays 100, while 55 inches (difference 7)
          flips the variant to FIELD_BASIS and the share to 55.
        test_recipe:
          setup:
            - "One project with row_acquisition_year 1975 and two identical facilities recorded at depth_in 48, PRIVATE_EASEMENT, installed_year 1968."
            - "Facility A carries a QL_A investigation with measured_depth_in 54 (difference exactly at tolerance); facility B carries a QL_A investigation with measured_depth_in 55 (one inch past tolerance)."
