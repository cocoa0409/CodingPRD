      - name: pool_concurrent_fielding_windows_use_closed_intervals
        grounds:
          - validations[priority=36]
          - errors.ERR_POOL_FIELDING_CAPACITY
          - entities.Study.fields.fielding_start
          - entities.Study.fields.fielding_end
        distinguishing_aspect: |
          A different contended resource - the ParticipantPool itself - under different interval semantics:
          fielding windows are compared as CLOSED day intervals, so two studies that merely share their
          endpoint day still count as overlapping, and the capacity test admits a study only while fewer
          than POOL_MAX_CONCURRENT_FIELDING (2) other FIELDING studies overlap it. A fourth study whose
