  # ===========================================================================
  # RULE 3 — non_linear_state_machine
  # Three DIFFERENT entities, three different non-linear shapes:
  #   3a: Match      — two independent status dimensions on one row
  #   3b: Scorecard  — a revisit cycle with a hard visit cap
  #   3c: League     — a backward (revert) edge that makes the machine cyclic
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: match_result_dimension_cycles_while_schedule_dimension_stays_played
        grounds:
          - state_machines.Match.REPORTED_to_DISPUTED
          - state_machines.Match.DISPUTED_to_REPORTED
          - entities.Match.fields.schedule_status
          - entities.Match.fields.result_status
          - entities.Scorecard.fields.amendment_count
        distinguishing_aspect: |
          One Match row carries two orthogonal machines: after DISPUTE then AMEND the result
          dimension has travelled PENDING -> REPORTED -> DISPUTED -> REPORTED while
          schedule_status never leaves PLAYED, and no official standings credit exists at any
          point (Team.standings_points == 0 for both teams), which a single-status model that
          collapses schedule and result into one enum cannot reproduce.
        test_recipe:
          setup:
            - "Section, facility, SECTION league and two six-player rosters exactly as rule 1; scorecard_dispute_window_hours is the default 24."
            - "Match M1 scheduled 2026-08-15T18:00:00Z, confirmed, marked PLAYED at 2026-08-15T21:00:00Z."
            - "The home captain has submitted a scorecard, so schedule_status == PLAYED, result_status == REPORTED, Scorecard.status == SUBMITTED, amendment_count == 0."
            - "Clock stays at 2026-08-15T21:00:00Z for the whole trigger, so both the 48h submission window and the 24h dispute window are open."
