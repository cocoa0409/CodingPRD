      - name: donor_may_read_another_donors_row_but_not_the_donor_list
        claim_type: can_perform_own_operations
        grounds:
          - roles.Donor.shared_operations
          - endpoints[GET /athletics/donors]
          - validations[priority 3]
        distinguishing_aspect: |
          Two independent facts collide here. First, §1.5 excludes Donor from the
          donors LIST while including it on the donors SINGLETON, so the list must
          return 403 and the singleton 200. Second, priority 3
          (ERR_NOT_RESOURCE_OWNER) is declared to apply only to five WRITE
          endpoints, so a donor reading a DIFFERENT donor's row is permitted —
          the counter-intuitive outcome that an implementation policing reads by
          ownership would get wrong. The recalculation singleton is likewise
