  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: seat_capacity_exact_fill_then_overflow
        grounds:
          - validations[priority=13]
          - entities.Table.fields.occupied_seats
          - entities.Table.fields.capacity
        distinguishing_aspect: "Seat-count metric on POST /seat-assignments: filling to occupied==capacity (8) succeeds (<=), the next single seat (9>8) is rejected — boundary at exactly capacity."
        test_recipe:
          setup:
            - "Event; table capacity 8; guest A party 6 ACCEPTED seated (occupied 6); guests B (party 2) and C (party 1) ACCEPTED but unseated."
          setup_api_calls:
            - call: "POST /planning/events"
              payload: { couple_names: "U & V", event_date: "2026-09-15T00:00:00Z", venue_name: "Ball", package_type: "PARTIAL", total_budget_cents: 4000000, guest_count_estimate: 30 }
              as: Planner
              captures: { ev_id: $.data.id }
            - call: "POST /planning/tables"
              payload: { event_id: "${ev_id}", table_label: "T1", capacity: 8 }
              as: Planner
              captures: { tb: $.data.id }
            - call: "POST /planning/guests"
              payload: { event_id: "${ev_id}", guest_name: "GA", party_size: 6 }
              as: Planner
              captures: { ga: $.data.id }
            - call: "POST /planning/guests/${ga}/rsvp"
              payload: { rsvp_status: "ACCEPTED" }
              as: Planner
            - call: "POST /planning/seat-assignments"
              payload: { event_id: "${ev_id}", guest_id: "${ga}", table_id: "${tb}" }
              as: Planner
            - call: "POST /planning/guests"
              payload: { event_id: "${ev_id}", guest_name: "GB", party_size: 2 }
              as: Planner
              captures: { gb: $.data.id }
            - call: "POST /planning/guests/${gb}/rsvp"
              payload: { rsvp_status: "ACCEPTED" }
              as: Planner
            - call: "POST /planning/guests"
              payload: { event_id: "${ev_id}", guest_name: "GC", party_size: 1 }
              as: Planner
              captures: { gc: $.data.id }
            - call: "POST /planning/guests/${gc}/rsvp"
              payload: { rsvp_status: "ACCEPTED" }
              as: Planner
          trigger:
            - call: "POST /planning/seat-assignments"
              payload: { event_id: "${ev_id}", guest_id: "${gb}", table_id: "${tb}" }
              as: Planner
              captures: { sb: $.data.id }
            - call: "POST /planning/seat-assignments"
              payload: { event_id: "${ev_id}", guest_id: "${gc}", table_id: "${tb}" }
              as: Planner
              captures: { err: $.data.error_id }
          assert:
            - "Seating GB succeeds: Table.${tb}.occupied_seats == 8 (exactly capacity, accepted under <=)"
            - "Seating GC returns error_id == ERR_TABLE_CAPACITY_EXCEEDED (9 > 8)"

