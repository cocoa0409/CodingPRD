          - validations[priority=11]
          - errors[ERR_OWNERSHIP_VIOLATION]
          - roles.Student.identity
        distinguishing_aspect: "A Student acting with X-User-ID equal to student A but posting to student B's consent collection returns HTTP 403 ERR_OWNERSHIP_VIOLATION, which is checked before the self-consent age and category gate."
        test_recipe:
          setup:
            - "Two students on the roster, both 16 years old at the 2026-05-04 clock."
          setup_api_calls:
            - call: "POST /sbhc/_clock/set_current_utc"
