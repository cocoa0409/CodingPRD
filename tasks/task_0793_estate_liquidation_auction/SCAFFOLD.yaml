# =============================================================================
# PRD Benchmark Seed Tables — Estate-Liquidation Online Auction
# =============================================================================

scenario: |
  Estate-Liquidation Online Auction (MaxSold/EstateSales.net style): estate
  intake & cataloging/lotting, photo & condition/description, online-auction
  scheduling & bidding/increment, buyer registration & pickup window, payment &
  buyer-premium, payout & commission, cleanout/donation, dispute

domain_name: estate-liquidation-auction
# Flat topology: entities are peer top-level collections addressed directly at
# the root ("/estates", "/lots", "/bids", ...); there is no single nesting
# prefix, so api_prefix is empty. Reverse-reachability GETs use sub-resource
# form under the owning parent ("/estates/{id}/lots") and filtered-list form
# ("/bids?lot_id=...").
api_prefix: ""

complexity_profile:
  primary_archetype: workflow_orchestration      # estate intake -> auction -> settlement -> cleanout, with branching/compensation
  secondary_archetype: temporal_windowing        # auction window + soft-close, pickup windows with overlap rules
  complexity_layers:
    - optimistic_concurrency                     # bid creation resolved by OCC on Lot.version
    - cascading_side_effects                     # close/settle/dispute drive multi-hop cascades
    - dual_variant_calculation                   # provisional vs final gross; gross-owed vs net-owed
    - derived_field_reconciliation               # current_bid, booked_count, gross_sales kept consistent

  entity_topology: flat                          # peer entities linked by foreign keys, no URL nesting for identity
  state_machine_shape: parallel                  # Order carries independent payment_status x pickup_status; Dispute is cyclic; Lot branches
  relationship_patterns:
    - one_to_many                                # Estate->Lot, Lot->Bid, Order->Payment, Estate->PickupWindow
    - cross_aggregate                            # Order references Estate, Buyer, PickupWindow; Dispute references Order and Lot
  role_model: peer_roles                         # Operator owns house/lifecycle operations; Buyer owns bids/orders/disputes
  consistency_model: immediate                   # all cascades applied atomically within the triggering request

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Estate
    parent: null
    common_fields: true          # id, created_at, updated_at, version
    fields:
      - { name: seller_name, type: string, source: input, description: "Consignor / estate seller name" }
      - { name: seller_email, type: string, source: input, description: "Seller contact email" }
      - { name: commission_bps, type: integer, source: input, default: 3500, description: "House commission rate in basis points (of final gross)", constraints: "0..10000" }
      - { name: buyer_premium_bps, type: integer, source: input, default: 1750, description: "Buyer's premium rate in basis points, added to each buyer invoice subtotal", constraints: "0..10000" }
      - { name: auction_starts_at, type: datetime, source: input, description: "Scheduled bidding open time (ISO 8601 UTC)" }
      - { name: auction_ends_at, type: datetime, source: input, description: "Scheduled bidding close time (ISO 8601 UTC); must be strictly after auction_starts_at" }
      - { name: soft_close_seconds, type: integer, source: input, default: 300, description: "Anti-snipe extension window in seconds; a bid inside this window before auction_ends_at pushes auction_ends_at forward by this many seconds" }
      - { name: extended_count, type: integer, source: computed, default: 0, description: "Number of times auction_ends_at was pushed by soft-close" }
      - { name: status, type: enum, source: system, description: "CATALOGING -> LIVE -> CLOSED -> SETTLED -> CLEANED_OUT", constraints: "one of {CATALOGING, LIVE, CLOSED, SETTLED, CLEANED_OUT}" }
      - { name: lot_count, type: integer, source: computed, default: 0, description: "Count of Lots whose estate_id == this Estate.id" }
      - { name: provisional_gross_cents, type: integer, source: computed, default: 0, description: "Estimate stamped at close: sum of current_bid_cents over lots that carried at least one ACCEPTED bid at close (see calculations.estate_settlement, PROVISIONAL variant)" }
      - { name: gross_sales_cents, type: integer, source: computed, default: 0, description: "Final gross stamped at settle: sum of hammer_price_cents over SOLD lots whose winning Order.payment_status == PAID (see calculations.estate_settlement, FINAL variant)" }
      - { name: commission_cents, type: integer, source: computed, default: 0, description: "round_half_up(gross_sales_cents * commission_bps / 10000), stamped at settle" }
      - { name: seller_payout_cents, type: integer, source: computed, default: 0, description: "gross_sales_cents - commission_cents, stamped at settle" }

  - name: Lot
    parent: Estate
    common_fields: true
    fields:
      - { name: estate_id, type: string, source: input, description: "FK -> Estate.id; owning estate, must be CATALOGING when the lot is created" }
      - { name: title, type: string, source: input, description: "Lot title" }
      - { name: description, type: string, source: input, description: "Item description / condition narrative" }
      - { name: category, type: string, source: input, description: "Free-text category (furniture, jewelry, tools, ...)" }
      - { name: condition_grade, type: enum, source: input, description: "Condition grade", constraints: "one of {A, B, C, D}" }
      - { name: starting_bid_cents, type: integer, source: input, description: "Opening bid floor in cents", constraints: ">= 1" }
      - { name: reserve_cents, type: integer, source: input, required: false, default: null, description: "Optional reserve; lot sells only if the final high bid >= reserve_cents. null means no reserve (any bid wins)" }
      - { name: current_bid_cents, type: integer, source: computed, default: 0, description: "Current high ACCEPTED bid amount; 0 while no bids exist" }
      - { name: high_bidder_id, type: string, source: computed, default: null, description: "Buyer.id holding the current high ACCEPTED bid (derived from bids; tie impossible because a strictly higher amount is required to lead); null when no bids" }
      - { name: bid_count, type: integer, source: computed, default: 0, description: "Count of Bids on this lot" }
      - { name: photo_count, type: integer, source: computed, default: 0, description: "Count of Photos whose lot_id == this Lot.id" }
      - { name: hammer_price_cents, type: integer, source: computed, default: null, description: "Winning amount stamped when the lot goes SOLD; cleared to null if the sale is reversed by a buyer-favor dispute" }
      - { name: winning_order_id, type: string, source: computed, default: null, description: "Id of the Order that captured this lot when SOLD (order discoverable via GET /orders?buyer_id or GET /estates/{id}/lots); null until SOLD" }
      - { name: status, type: enum, source: system, description: "DRAFT -> CATALOGED -> LISTED -> SELLING -> {SOLD, PASSED}; PASSED -> {DONATED, WITHDRAWN}; SOLD -> PASSED on buyer-favor dispute", constraints: "one of {DRAFT, CATALOGED, LISTED, SELLING, SOLD, PASSED, DONATED, WITHDRAWN}" }

  - name: Photo
    parent: Lot
    common_fields: false         # id, created_at only (append-only condition record)
    fields:
      - { name: lot_id, type: string, source: input, description: "FK -> Lot.id; the lot this photo documents. Lot must be DRAFT or CATALOGED" }
      - { name: image_url, type: string, source: input, description: "Stored image URL" }
      - { name: caption, type: string, source: input, required: false, description: "Optional caption" }
      - { name: condition_note, type: string, source: input, required: false, description: "Optional condition annotation for this photo" }
      - { name: is_primary, type: boolean, source: input, default: false, description: "Whether this is the lot's primary catalog image" }

  - name: Buyer
    parent: null
    common_fields: true
    fields:
      - { name: display_name, type: string, source: input, description: "Bidder display name" }
      - { name: email, type: string, source: input, description: "Bidder email" }
      - { name: status, type: enum, source: system, description: "REGISTERED -> VERIFIED -> SUSPENDED", constraints: "one of {REGISTERED, VERIFIED, SUSPENDED}" }
      - { name: no_show_strikes, type: integer, source: computed, default: 0, description: "Count of pickup no-shows; buyer is SUSPENDED when this reaches SUSPEND_STRIKE_THRESHOLD" }
      - { name: gross_owed_cents, type: integer, source: computed, default: 0, description: "GROSS variant: sum of total_cents over ALL of this buyer's Orders (see calculations.buyer_owed)" }
      - { name: net_owed_cents, type: integer, source: computed, default: 0, description: "NET variant: sum of total_cents over this buyer's Orders whose payment_status == UNPAID (see calculations.buyer_owed)" }

  - name: Bid
    parent: Lot
    common_fields: false         # id, created_at only (append-only)
    fields:
      - { name: lot_id, type: string, source: input, description: "FK -> Lot.id; the lot being bid on, must be SELLING" }
      - { name: buyer_id, type: string, source: input, description: "FK -> Buyer.id; the bidding buyer, must be VERIFIED and equal to X-User-ID" }
      - { name: amount_cents, type: integer, source: input, description: "Bid amount in cents; must be >= the lot's min-next-bid (see calculations.bid_min_increment)", constraints: ">= 1" }
      - { name: expected_lot_version, type: integer, source: input, description: "OCC guard: the Lot.version the client last observed; rejected with ERR_STALE_VERSION if it no longer matches Lot.version" }
      - { name: status, type: enum, source: system, description: "ACCEPTED -> OUTBID (when a strictly higher bid is accepted on the same lot)", constraints: "one of {ACCEPTED, OUTBID}" }
      - { name: is_winning, type: boolean, source: computed, default: false, description: "True while this bid holds the lot's current_bid; becomes false when outbid or when the sale is reversed" }

  - name: Order
    parent: Estate
    common_fields: true          # created by the estate-close cascade, not by a POST
    fields:
      - { name: estate_id, type: string, source: system, description: "FK -> Estate.id; the estate whose close created this invoice" }
      - { name: buyer_id, type: string, source: system, description: "FK -> Buyer.id; the winning buyer this invoice bills" }
      - { name: lot_ids, type: array, source: computed, description: "Ids of the SOLD lots captured by this buyer in this estate; a lot leaves this list if its sale is reversed" }
      - { name: subtotal_cents, type: integer, source: computed, default: 0, description: "Sum of hammer_price_cents over the lots in lot_ids" }
      - { name: buyer_premium_cents, type: integer, source: computed, default: 0, description: "round_half_up(subtotal_cents * estate.buyer_premium_bps / 10000), computed ONCE on the aggregate subtotal (see calculations.order_charges)" }
      - { name: sales_tax_cents, type: integer, source: computed, default: 0, description: "round_half_up((subtotal_cents + buyer_premium_cents) * SALES_TAX_BPS / 10000)" }
      - { name: total_cents, type: integer, source: computed, default: 0, description: "subtotal_cents + buyer_premium_cents + sales_tax_cents" }
      - { name: amount_paid_cents, type: integer, source: computed, default: 0, description: "Sum of CHARGE Payment.amount_cents minus sum of REFUND Payment.amount_cents for this order" }
      - { name: payment_status, type: enum, source: system, description: "UNPAID -> PAID -> REFUNDED (independent of pickup_status)", constraints: "one of {UNPAID, PAID, REFUNDED}" }
      - { name: pickup_status, type: enum, source: system, description: "PENDING -> SCHEDULED -> {PICKED_UP, NO_SHOW}; SCHEDULED -> PENDING on cancel (independent of payment_status)", constraints: "one of {PENDING, SCHEDULED, PICKED_UP, NO_SHOW}" }
      - { name: pickup_window_id, type: string, source: system, default: null, description: "FK -> PickupWindow.id; set when a pickup slot is booked, cleared on cancel; null while PENDING" }

  - name: Payment
    parent: Order
    common_fields: false         # id, created_at only (append-only ledger)
    fields:
      - { name: order_id, type: string, source: input, description: "FK -> Order.id; the invoice this ledger line belongs to" }
      - { name: kind, type: enum, source: system, description: "CHARGE (buyer payment) or REFUND (dispute reversal)", constraints: "one of {CHARGE, REFUND}" }
      - { name: amount_cents, type: integer, source: input, description: "Positive magnitude of the ledger line in cents" }
      - { name: note, type: string, source: input, required: false, description: "Optional memo" }

  - name: PickupWindow
    parent: Estate
    common_fields: true
    fields:
      - { name: estate_id, type: string, source: input, description: "FK -> Estate.id; the estate this pickup slot serves" }
      - { name: starts_at, type: datetime, source: input, description: "Slot start (ISO 8601 UTC)" }
      - { name: ends_at, type: datetime, source: input, description: "Slot end (ISO 8601 UTC); must be strictly after starts_at" }
      - { name: capacity, type: integer, source: input, description: "Maximum number of orders that may be booked into this slot", constraints: ">= 1" }
      - { name: booked_count, type: integer, source: computed, default: 0, description: "Count of Orders whose pickup_window_id == this id and pickup_status in {SCHEDULED, PICKED_UP}" }
      - { name: label, type: string, source: input, required: false, description: "Optional human label" }

  - name: Dispute
    parent: Order
    common_fields: true
    fields:
      - { name: order_id, type: string, source: input, description: "FK -> Order.id; the paid invoice being disputed" }
      - { name: lot_id, type: string, source: input, description: "FK -> Lot.id; the specific SOLD lot being disputed; must be present in order.lot_ids" }
      - { name: reason, type: string, source: input, description: "Buyer's stated reason" }
      - { name: status, type: enum, source: system, description: "OPEN -> UNDER_REVIEW -> NEEDS_INFO -> UNDER_REVIEW (cycle) -> {RESOLVED, REJECTED}", constraints: "one of {OPEN, UNDER_REVIEW, NEEDS_INFO, RESOLVED, REJECTED}" }
      - { name: outcome, type: enum, source: computed, default: null, description: "BUYER_FAVOR (set with RESOLVED, triggers refund/reversal) or SELLER_FAVOR (set with REJECTED)", constraints: "one of {BUYER_FAVOR, SELLER_FAVOR} or null" }
      - { name: resolution_note, type: string, source: input, required: false, description: "Optional reviewer note supplied on the resolving PATCH" }

  - name: Donation
    parent: Lot
    common_fields: false         # id, created_at only (append-only disposal record)
    fields:
      - { name: lot_id, type: string, source: system, description: "FK -> Lot.id; the unsold lot disposed at cleanout" }
      - { name: estate_id, type: string, source: system, description: "FK -> Estate.id; the estate being cleaned out" }
      - { name: recipient, type: string, source: system, default: "LOCAL_CHARITY", description: "Disposal recipient label" }
      - { name: disposition, type: enum, source: system, description: "RECYCLED when the lot's condition_grade == D, otherwise DONATED", constraints: "one of {DONATED, RECYCLED}" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  # ---- Estate lifecycle (linear pipeline with cascade-heavy transitions) ----
  - entity: Estate
    field: status
    initial_state: CATALOGING
    terminal_states: [CLEANED_OUT]
    transitions:
      - from: CATALOGING
        to: LIVE
        trigger: "POST /estates/{id}/open"
        actor: Operator
        preconditions:
          - "Estate.status == CATALOGING"
          - "At least one Lot with estate_id == Estate.id is in status LISTED"
        side_effects:
          - "Every Lot in LISTED for this estate transitions LISTED -> SELLING and its current_bid_cents is set to 0"

      - from: LIVE
        to: CLOSED
        trigger: "POST /estates/{id}/close"
        actor: Operator
        preconditions:
          - "Estate.status == LIVE"
        side_effects:
          - "SETTLEMENT SWEEP over lots in SELLING (see calculations.lot_sale_determination): each lot goes SELLING -> SOLD if it has >=1 ACCEPTED bid and current_bid_cents >= reserve_cents, else SELLING -> PASSED"
          - "CASCADE hop 1->2: each SELLING -> SOLD lot stamps hammer_price_cents = current_bid_cents and marks its high Bid is_winning=true"
          - "CASCADE hop 2->3: each newly SOLD lot is appended to the winning buyer's Order for this estate (an Order is created UNPAID/PENDING the first time that buyer wins a lot here); Order subtotal_cents/buyer_premium_cents/sales_tax_cents/total_cents recomputed (calculations.order_charges)"
          - "CASCADE hop 3->4: each affected Order recomputes its Buyer.gross_owed_cents and net_owed_cents (calculations.buyer_owed)"
          - "Estate.provisional_gross_cents stamped (calculations.estate_settlement, PROVISIONAL variant)"

      - from: CLOSED
        to: SETTLED
        trigger: "POST /estates/{id}/settle"
        actor: Operator
        preconditions:
          - "Estate.status == CLOSED"
        side_effects:
          - "Estate.gross_sales_cents stamped (calculations.estate_settlement, FINAL variant: SOLD lots whose Order.payment_status == PAID)"
          - "Estate.commission_cents = round_half_up(gross_sales_cents * commission_bps / 10000)"
          - "Estate.seller_payout_cents = gross_sales_cents - commission_cents (INVARIANT: seller_payout_cents + commission_cents == gross_sales_cents, calculations.payout_split_invariant)"

      - from: SETTLED
        to: CLEANED_OUT
        trigger: "POST /estates/{id}/cleanout"
        actor: Operator
        preconditions:
          - "Estate.status == SETTLED"
        side_effects:
          - "For every Lot in PASSED for this estate: create a Donation (disposition = RECYCLED if condition_grade == D else DONATED) and transition the lot PASSED -> DONATED"

  # ---- Lot lifecycle (branching + sale-reversal compensation) ----
  - entity: Lot
    field: status
    initial_state: DRAFT
    terminal_states: [DONATED, WITHDRAWN]
    transitions:
      - from: DRAFT
        to: CATALOGED
        trigger: "PATCH /lots/{id} (status=CATALOGED)"
        actor: Operator
        preconditions:
          - "Estate.status == CATALOGING"
          - "Lot.photo_count >= 1"
        side_effects: []

      - from: CATALOGED
        to: LISTED
        trigger: "PATCH /lots/{id} (status=LISTED)"
        actor: Operator
        preconditions:
          - "Estate.status == CATALOGING"
        side_effects: []

      - from: LISTED
        to: SELLING
        trigger: "POST /estates/{id}/open (system)"
        actor: system
        preconditions:
          - "Owning Estate transitions CATALOGING -> LIVE"
        side_effects:
          - "current_bid_cents set to 0"

      - from: SELLING
        to: SOLD
        trigger: "POST /estates/{id}/close (system)"
        actor: system
        preconditions:
          - "Lot has >= 1 ACCEPTED bid"
          - "current_bid_cents >= reserve_cents (reserve met; reserve_cents null counts as met)"
        side_effects:
          - "hammer_price_cents = current_bid_cents"
          - "winning_order_id set to the winning buyer's Order (created if absent)"
          - "winning buyer's Order and Buyer ledgers recomputed"

      - from: SELLING
        to: PASSED
        trigger: "POST /estates/{id}/close (system)"
        actor: system
        preconditions:
          - "Lot has 0 ACCEPTED bids OR current_bid_cents < reserve_cents"
        side_effects: []

      - from: SOLD
        to: PASSED
        trigger: "PATCH /disputes/{id} (status=RESOLVED, outcome=BUYER_FAVOR) (system)"
        actor: system
        preconditions:
          - "A Dispute referencing this lot is resolved BUYER_FAVOR"
        side_effects:
          - "hammer_price_cents cleared to null; winning_order_id cleared; winning Bid is_winning=false"
          - "lot removed from Order.lot_ids; Order totals recomputed; Buyer ledgers recomputed"

      - from: PASSED
        to: WITHDRAWN
        trigger: "PATCH /lots/{id} (status=WITHDRAWN)"
        actor: Operator
        preconditions:
          - "Lot.status == PASSED"
        side_effects: []

      - from: PASSED
        to: DONATED
        trigger: "POST /estates/{id}/cleanout (system)"
        actor: system
        preconditions:
          - "Owning Estate transitions SETTLED -> CLEANED_OUT"
        side_effects:
          - "A Donation record is created for this lot"

  # ---- Bid lifecycle ----
  - entity: Bid
    field: status
    initial_state: ACCEPTED
    terminal_states: [OUTBID]
    transitions:
      - from: ACCEPTED
        to: OUTBID
        trigger: "POST /bids (system)"
        actor: system
        preconditions:
          - "A strictly higher bid is accepted on the same lot"
        side_effects:
          - "is_winning set to false"

  # ---- Buyer lifecycle ----
  - entity: Buyer
    field: status
    initial_state: REGISTERED
    terminal_states: []
    transitions:
      - from: REGISTERED
        to: VERIFIED
        trigger: "POST /buyers/{id}/verify"
        actor: Operator
        preconditions:
          - "Buyer.status == REGISTERED"
        side_effects: []

      - from: VERIFIED
        to: SUSPENDED
        trigger: "POST /orders/{id}/complete-pickup (result=NO_SHOW) (system)"
        actor: system
        preconditions:
          - "no_show_strikes reaches SUSPEND_STRIKE_THRESHOLD (>= 3) after this no-show increments it"
        side_effects: []

  # ---- Order payment dimension (parallel with pickup dimension) ----
  - entity: Order
    field: payment_status
    initial_state: UNPAID
    terminal_states: []
    transitions:
      - from: UNPAID
        to: PAID
        trigger: "POST /orders/{id}/pay"
        actor: Buyer
        preconditions:
          - "Buyer.status != SUSPENDED"
          - "Estate.status in {CLOSED, SETTLED}"
          - "payload amount_cents >= Order.total_cents"
        side_effects:
          - "Create a CHARGE Payment for amount_cents"
          - "amount_paid_cents recomputed; if >= total_cents payment_status -> PAID"

      - from: PAID
        to: REFUNDED
        trigger: "PATCH /disputes/{id} (status=RESOLVED, outcome=BUYER_FAVOR) (system)"
        actor: system
        preconditions:
          - "A Dispute on this order is resolved BUYER_FAVOR"
        side_effects:
          - "Create a REFUND Payment equal to the disputed lot's share (hammer_price_cents plus its premium/tax delta); amount_paid_cents recomputed"

  # ---- Order pickup dimension (parallel with payment dimension) ----
  - entity: Order
    field: pickup_status
    initial_state: PENDING
    terminal_states: [PICKED_UP]
    transitions:
      - from: PENDING
        to: SCHEDULED
        trigger: "POST /orders/{id}/schedule-pickup"
        actor: Buyer
        preconditions:
          - "Order.payment_status == PAID"
          - "PickupWindow.estate_id == Order.estate_id"
          - "The window does not temporally collide with any other window this buyer already holds (calculations.buyer_pickup_nonoverlap)"
          - "PickupWindow.booked_count < PickupWindow.capacity"
        side_effects:
          - "Order.pickup_window_id set; PickupWindow.booked_count incremented by 1"

      - from: SCHEDULED
        to: PENDING
        trigger: "POST /orders/{id}/cancel-pickup"
        actor: Buyer
        preconditions:
          - "Order.pickup_status == SCHEDULED"
        side_effects:
          - "PickupWindow.booked_count decremented by 1; Order.pickup_window_id cleared to null"

      - from: SCHEDULED
        to: PICKED_UP
        trigger: "POST /orders/{id}/complete-pickup (result=PICKED_UP)"
        actor: Operator
        preconditions:
          - "Order.pickup_status == SCHEDULED"
        side_effects: []

      - from: SCHEDULED
        to: NO_SHOW
        trigger: "POST /orders/{id}/complete-pickup (result=NO_SHOW)"
        actor: Operator
        preconditions:
          - "Order.pickup_status == SCHEDULED"
        side_effects:
          - "PickupWindow.booked_count decremented by 1"
          - "Buyer.no_show_strikes incremented by 1; if it reaches SUSPEND_STRIKE_THRESHOLD the buyer transitions VERIFIED -> SUSPENDED"

  # ---- Dispute lifecycle (cyclic revision loop) ----
  - entity: Dispute
    field: status
    initial_state: OPEN
    terminal_states: [RESOLVED, REJECTED]
    transitions:
      - from: OPEN
        to: UNDER_REVIEW
        trigger: "PATCH /disputes/{id} (status=UNDER_REVIEW)"
        actor: Operator
        preconditions:
          - "Dispute.status == OPEN"
        side_effects: []

      - from: UNDER_REVIEW
        to: NEEDS_INFO
        trigger: "PATCH /disputes/{id} (status=NEEDS_INFO)"
        actor: Operator
        preconditions:
          - "Dispute.status == UNDER_REVIEW"
        side_effects: []

      - from: NEEDS_INFO
        to: UNDER_REVIEW
        trigger: "PATCH /disputes/{id} (status=UNDER_REVIEW)"
        actor: Buyer
        preconditions:
          - "Dispute.status == NEEDS_INFO"
          - "Acting Buyer owns the disputed order (Order.buyer_id == X-User-ID)"
        side_effects: []

      - from: UNDER_REVIEW
        to: RESOLVED
        trigger: "PATCH /disputes/{id} (status=RESOLVED, outcome=BUYER_FAVOR)"
        actor: Operator
        preconditions:
          - "Dispute.status == UNDER_REVIEW"
        side_effects:
          - "outcome = BUYER_FAVOR"
          - "CASCADE hop 1->2: Order.payment_status PAID -> REFUNDED and a REFUND Payment is created"
          - "CASCADE hop 2->3: the disputed Lot SOLD -> PASSED (hammer/winning cleared, removed from Order.lot_ids, Order totals + Buyer ledgers recomputed)"
          - "CASCADE hop 3->4: if the Estate is already SETTLED, Estate.gross_sales_cents/commission_cents/seller_payout_cents are recomputed so the payout-split invariant still holds"

      - from: UNDER_REVIEW
        to: REJECTED
        trigger: "PATCH /disputes/{id} (status=REJECTED, outcome=SELLER_FAVOR)"
        actor: Operator
        preconditions:
          - "Dispute.status == UNDER_REVIEW"
        side_effects:
          - "outcome = SELLER_FAVOR; no ledger changes"

# =============================================================================
# Concurrency Rules (§1.2.1)
# =============================================================================
concurrency_rules:
  - rule_id: bid-create-stale-lot
    parent_entity: Lot
    write_endpoint: "POST /bids"
    occ_field: "expected_lot_version"
    description: |
      Placing a Bid against a Lot whose version has advanced since the client
      last observed it is rejected. A prior accepted bid legitimately supersedes
      the lot's current_bid and increments Lot.version; a later create that
      still carries the earlier expected_lot_version is therefore working from a
      stale view of the price and is rejected on the version check.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: bid_min_increment
    trigger: "POST /bids — validating a bid amount"
    algorithm: tiered_pricing
    formula: |
      if lot.current_bid_cents == 0 (no accepted bids yet):
          min_next = lot.starting_bid_cents
      else:
          c = lot.current_bid_cents
          if   c < 2500:    step = 100      # < $25    -> $1.00
          elif c < 10000:   step = 250      # $25-$100 -> $2.50
          elif c < 50000:   step = 1000     # $100-$500-> $10.00
          else:             step = 2500     # >= $500  -> $25.00
          min_next = c + step
      accept the bid iff amount_cents >= min_next   # boundary is >= (equal is valid)
    input_set: "Single lot in SELLING; its current_bid_cents and starting_bid_cents"
    constants:
      TIER_1_CEIL: 2500
      TIER_2_CEIL: 10000
      TIER_3_CEIL: 50000
      STEP_1: 100
      STEP_2: 250
      STEP_3: 1000
      STEP_4: 2500
    precision: "integer cents; no rounding (all amounts are whole cents)"

  - name: high_bid_selection
    trigger: "POST /bids acceptance, and the estate-close settlement sweep"
    algorithm: aggregation
    formula: |
      A newly accepted bid becomes the lot's high bid iff amount_cents >= min_next
      (see bid_min_increment). On acceptance: set lot.current_bid_cents =
      amount_cents, lot.high_bidder_id = buyer_id, this bid is_winning=true,
      and set the previous high bid (if any) status=OUTBID, is_winning=false.
      There is never a tie because leading requires a strictly higher amount than
      the standing current_bid_cents; if two equal amounts arrive sequentially,
      the second fails bid_min_increment. No random/id field participates.
    input_set: "All ACCEPTED bids on the lot"
    precision: "integer cents"

  - name: lot_sale_determination
    trigger: "POST /estates/{id}/close — the settlement sweep over each SELLING lot"
    algorithm: threshold
    formula: |
      For each lot in SELLING at close:
        high = lot.current_bid_cents (0 if no ACCEPTED bids)
        reserve_met = (lot.reserve_cents is null) OR (high >= lot.reserve_cents)   # boundary is >=
        if lot.bid_count >= 1 AND reserve_met:
            lot -> SOLD, hammer_price_cents = high
        else:
            lot -> PASSED, hammer_price_cents stays null
    input_set: "Every SELLING lot of the closing estate; its current_bid_cents, bid_count, reserve_cents"
    constants: {}
    precision: "integer cents; reserve comparison is >= (a bid exactly equal to reserve sells)"

  - name: order_charges
    trigger: "Recomputed whenever a lot is added to or removed from an Order (estate-close cascade or dispute reversal)"
    algorithm: aggregation
    formula: |
      subtotal_cents      = sum(hammer_price_cents for lot in order.lot_ids)
      # Buyer premium is computed ONCE on the aggregate subtotal and rounded once
      # (round_half_up). It is NOT computed per-lot-then-summed; the two orders of
      # operation differ in cents (see variants).
      buyer_premium_cents = round_half_up(subtotal_cents * estate.buyer_premium_bps / 10000)
      sales_tax_cents     = round_half_up((subtotal_cents + buyer_premium_cents) * SALES_TAX_BPS / 10000)
      total_cents         = subtotal_cents + buyer_premium_cents + sales_tax_cents
    input_set: "Lots currently in order.lot_ids (SOLD lots not reversed)"
    constants:
      SALES_TAX_BPS: 800          # 8.00%
    precision: "2 decimal places (cents), round_half_up; premium rounded once on aggregate, then tax rounded once"
    variants:
      - name: aggregate_then_round
        when: "The pinned production rule"
        difference: "round_half_up(subtotal * rate) once; e.g. subtotal=1650 @1750bps -> round(288.75)=289"
      - name: per_lot_then_sum
        when: "A tempting but WRONG interpretation, pinned here only to mark the divergence"
        difference: "sum of round_half_up(hammer_i * rate); e.g. three lots of 550 -> round(96.25)*3 = 96*3 = 288, which differs from 289"

  - name: estate_settlement
    trigger: "PROVISIONAL stamped on POST /estates/{id}/close; FINAL stamped on POST /estates/{id}/settle"
    algorithm: aggregation
    formula: |
      PROVISIONAL (at close): provisional_gross_cents =
          sum(lot.current_bid_cents for lot where lot had >= 1 ACCEPTED bid at close)
          # includes lots that PASSED for reserve-not-met (they still carried a bid)
      FINAL (at settle): gross_sales_cents =
          sum(lot.hammer_price_cents for lot where lot.status == SOLD
              AND lot.winning_order.payment_status == PAID)
      commission_cents   = round_half_up(gross_sales_cents * estate.commission_bps / 10000)
      seller_payout_cents = gross_sales_cents - commission_cents
    input_set: "PROVISIONAL: all lots that carried a bid; FINAL: SOLD lots with a PAID order"
    constants: {}
    precision: "integer cents, round_half_up on commission"
    variants:
      - name: provisional_gross
        when: "Estimate stamped at close, before buyers have paid"
        difference: "Includes every lot that attracted a bid (even reserve-not-met PASSED lots); uses current_bid_cents"
      - name: final_gross
        when: "Actual gross stamped at settle"
        difference: "Only SOLD lots whose winning Order is PAID; uses hammer_price_cents. Unpaid/forfeited/reversed lots are excluded, so it is <= provisional_gross"

  - name: buyer_owed
    trigger: "Recomputed on any change to a buyer's Orders (close cascade, pay, dispute reversal)"
    algorithm: aggregation
    formula: |
      gross_owed_cents = sum(order.total_cents for order where order.buyer_id == buyer.id)      # all orders
      net_owed_cents   = sum(order.total_cents for order where order.buyer_id == buyer.id
                             AND order.payment_status == UNPAID)                                 # unpaid only
    input_set: "All Orders of the buyer (gross) vs only UNPAID Orders (net)"
    precision: "integer cents"
    variants:
      - name: gross_owed
        when: "Lifetime billed total"
        difference: "Counts every order regardless of payment_status"
      - name: net_owed
        when: "Currently outstanding balance"
        difference: "Counts only UNPAID orders; a paid or refunded order drops out"

  - name: payout_split_invariant
    trigger: "POST /estates/{id}/settle and any post-settle dispute reversal"
    algorithm: aggregation
    formula: |
      INVARIANT (conserved quantity = settled gross money):
        seller_payout_cents + commission_cents == gross_sales_cents
      Holds after settle and after any buyer-favor dispute reversal that
      decrements gross_sales_cents: commission and payout are both re-derived
      from the new gross so the identity never drifts.
    input_set: "Estate settlement fields"
    precision: "integer cents; commission is the rounded term, payout is the residual so the sum is exact"

  - name: pickup_window_nonoverlap
    trigger: "POST /pickup-windows — validating a new slot against existing slots of the same estate"
    algorithm: interval_merge
    formula: |
      Treat each window as the HALF-OPEN interval [starts_at, ends_at).
      Reject the new window if there exists an existing window W on the same
      estate with:  new.starts_at < W.ends_at AND W.starts_at < new.ends_at.
      Half-open semantics: abutting slots where new.starts_at == W.ends_at (or
      new.ends_at == W.starts_at) do NOT overlap and are allowed.
    input_set: "All PickupWindows with estate_id == new.estate_id"
    precision: "timestamp comparison, microsecond exact"

  - name: buyer_pickup_nonoverlap
    trigger: "POST /orders/{id}/schedule-pickup — validating the chosen window against the buyer's other booked windows"
    algorithm: interval_merge
    formula: |
      Treat each window as the CLOSED interval [starts_at, ends_at].
      Reject the booking if the chosen window collides with any window the buyer
      already holds via another order in pickup_status SCHEDULED or PICKED_UP,
      using closed-interval semantics: collision iff
        chosen.starts_at <= other.ends_at AND other.starts_at <= chosen.ends_at.
      Unlike pickup_window_nonoverlap, abutting windows (chosen.starts_at ==
      other.ends_at) DO collide and are rejected — a buyer cannot be in two
      places back-to-back.
    input_set: "Windows referenced by the buyer's other Orders with pickup_status in {SCHEDULED, PICKED_UP}"
    precision: "timestamp comparison, microsecond exact"

  - name: soft_close_extension
    trigger: "POST /bids that is accepted while within the soft-close window"
    algorithm: threshold
    formula: |
      Let now = logical clock. If the accepted bid arrives with
        (auction_ends_at - soft_close_seconds) <= now < auction_ends_at
      then auction_ends_at := auction_ends_at + soft_close_seconds and
      extended_count += 1. Bids at or after auction_ends_at are still handled by
      the state machine (estate must be LIVE) — the estate is closed explicitly
      by the operator, not by the clock.
    input_set: "The estate of the lot being bid on; the logical clock"
    constants: {}
    precision: "seconds"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and (for entity-backed roles) X-User-ID headers present and well-formed"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all except POST /buyers and GET reads that permit Anonymous"

  - priority: 2
    category: auth
    check: "Acting role is permitted for this operation per the RBAC matrix"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: business_constraint
    check: "Request body required fields present, correct types, enum members valid; pagination limit in [1,100] and offset >= 0"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all writes and list reads"

  - priority: 4
    category: existence
    check: "Every id referenced in the path or body resolves to an existing resource (validated left-to-right)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path or FK params"

  - priority: 5
    category: business_referential
    check: "Acting Buyer (entity_backed) owns the target resource: Bid.buyer_id / Order.buyer_id / disputed Order.buyer_id == X-User-ID"
    error_id: ERR_CROSS_OWNER
    http_status: 403
    applies_to: "POST /orders/{id}/pay, /schedule-pickup, /cancel-pickup, POST /disputes, PATCH /disputes/{id} (Buyer respond)"

  - priority: 6
    category: state
    check: "Estate is in the required status for this lifecycle action (open<-CATALOGING, close<-LIVE, settle<-CLOSED, cleanout<-SETTLED)"
    error_id: "ERR_ESTATE_NOT_CATALOGING | ERR_ESTATE_NOT_LIVE | ERR_ESTATE_NOT_CLOSED | ERR_ESTATE_NOT_SETTLED"
    http_status: 409
    applies_to: "POST /estates/{id}/open|close|settle|cleanout; POST /lots; PATCH /lots (catalog/list); POST /photos"

  - priority: 7
    category: state
    check: "Target resource is in a valid state for the requested transition (lot SELLING to bid; order UNPAID to pay; order PAID to schedule pickup; pickup SCHEDULED to complete/cancel; dispute status gate)"
    error_id: "ERR_INVALID_STATE | ERR_LOT_NOT_SELLING | ERR_ORDER_ALREADY_PAID | ERR_ORDER_NOT_PAID | ERR_PICKUP_NOT_SCHEDULED"
    http_status: 409
    applies_to: "POST /bids, /orders/*, PATCH /lots, PATCH /disputes, /estates lifecycle"

  - priority: 8
    category: business_referential
    check: "schedule-pickup: chosen PickupWindow.estate_id == Order.estate_id"
    error_id: ERR_WINDOW_ESTATE_MISMATCH
    http_status: 409
    applies_to: "POST /orders/{id}/schedule-pickup"

  - priority: 9
    category: business_referential
    check: "Dispute lot_id is present in the disputed Order.lot_ids"
    error_id: ERR_LOT_NOT_IN_ORDER
    http_status: 409
    applies_to: "POST /disputes"

  - priority: 10
    category: business_temporal
    check: "pickup window overlap (half-open) on create; buyer pickup overlap (closed) on schedule"
    error_id: "ERR_WINDOW_OVERLAP | ERR_PICKUP_OVERLAP"
    http_status: 409
    applies_to: "POST /pickup-windows; POST /orders/{id}/schedule-pickup"

  - priority: 11
    category: business_constraint
    check: "Bidding buyer is VERIFIED (not REGISTERED)"
    error_id: ERR_BUYER_NOT_VERIFIED
    http_status: 409
    applies_to: "POST /bids"

  - priority: 12
    category: business_constraint
    check: "Acting buyer is not SUSPENDED (blocks bidding and paying)"
    error_id: ERR_BUYER_SUSPENDED
    http_status: 409
    applies_to: "POST /bids, POST /orders/{id}/pay"

  - priority: 13
    category: business_constraint
    check: "Bid amount_cents >= min-next-bid (calculations.bid_min_increment); pickup window has capacity (booked_count < capacity)"
    error_id: "ERR_BID_TOO_LOW | ERR_WINDOW_FULL"
    http_status: 409
    applies_to: "POST /bids; POST /orders/{id}/schedule-pickup"

  - priority: 14
    category: business_constraint
    check: "OCC: expected_lot_version matches current Lot.version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /bids"

  - priority: 15
    category: business_fiscal
    check: "pay: payload amount_cents >= Order.total_cents"
    error_id: ERR_INSUFFICIENT_PAYMENT
    http_status: 402
    applies_to: "POST /orders/{id}/pay"

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

endpoints:
  # ---- Logical clock (test-driving) ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. Startup default is 2026-03-01T00:00:00Z; before any call the clock reads exactly this default and never falls back to wall-clock time. Governs soft-close and pickup-window time comparisons."
    roles: [Operator]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["Logical clock set to to_iso8601"]

  # ---- Estate ----
  - method: POST
    path: "/estates"
    description: "Create an estate consignment in CATALOGING with its scheduled auction window."
    roles: [Operator]
    code: 201
    input: [seller_name, seller_email, auction_starts_at, auction_ends_at, "commission_bps?", "buyer_premium_bps?", "soft_close_seconds?"]
    output: Estate
    side_effects: ["status=CATALOGING; extended_count=0; money fields default 0"]

  - method: GET
    path: "/estates/{id}"
    description: "Fetch one estate."
    roles: [Operator, Buyer, Anonymous]
    code: 200
    input: []
    output: Estate
    side_effects: []

  - method: GET
    path: "/estates/{id}/lots"
    description: "List lots of an estate (reverse-reachability for Lot.estate_id). Supports status filter and pagination."
    roles: [Operator, Buyer, Anonymous]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Lot[]
    side_effects: []

  - method: GET
    path: "/estates/{id}/pickup-windows"
    description: "List pickup windows of an estate (reverse-reachability for PickupWindow.estate_id)."
    roles: [Operator, Buyer, Anonymous]
    code: 200
    input: ["limit?", "offset?"]
    output: PickupWindow[]
    side_effects: []

  - method: POST
    path: "/estates/{id}/open"
    description: "Open bidding: CATALOGING -> LIVE. Requires at least one LISTED lot; flips LISTED lots to SELLING."
    roles: [Operator]
    code: 200
    input: []
    output: Estate
    side_effects: ["LISTED lots -> SELLING with current_bid_cents=0"]

  - method: POST
    path: "/estates/{id}/close"
    description: "Close bidding: LIVE -> CLOSED. Runs the settlement sweep, creates buyer Orders, stamps provisional_gross_cents."
    roles: [Operator]
    code: 200
    input: []
    output: Estate
    side_effects: ["SELLING lots -> SOLD/PASSED; Orders created & priced; buyer ledgers recomputed; provisional_gross_cents stamped"]

  - method: POST
    path: "/estates/{id}/settle"
    description: "Settle: CLOSED -> SETTLED. Stamps final gross_sales_cents, commission_cents, seller_payout_cents."
    roles: [Operator]
    code: 200
    input: []
    output: Estate
    side_effects: ["gross_sales_cents/commission_cents/seller_payout_cents stamped (payout-split invariant)"]

  - method: POST
    path: "/estates/{id}/cleanout"
    description: "Cleanout: SETTLED -> CLEANED_OUT. Donates every PASSED lot (creates Donation records)."
    roles: [Operator]
    code: 200
    input: []
    output: Estate
    side_effects: ["PASSED lots -> DONATED; Donation records created"]

  # ---- Lot ----
  - method: POST
    path: "/lots"
    description: "Create a lot in DRAFT under a CATALOGING estate."
    roles: [Operator]
    code: 201
    input: [estate_id, title, description, category, condition_grade, starting_bid_cents, "reserve_cents?"]
    output: Lot
    side_effects: ["status=DRAFT; current_bid_cents=0; photo_count=0"]

  - method: GET
    path: "/lots/{id}"
    description: "Fetch one lot (exposes version for OCC bidding)."
    roles: [Operator, Buyer, Anonymous]
    code: 200
    input: []
    output: Lot
    side_effects: []

  - method: GET
    path: "/lots/{id}/photos"
    description: "List a lot's photos (reverse-reachability for Photo.lot_id)."
    roles: [Operator, Buyer, Anonymous]
    code: 200
    input: ["limit?", "offset?"]
    output: Photo[]
    side_effects: []

  - method: PATCH
    path: "/lots/{id}"
    description: "Edit lot fields while DRAFT, and drive lot status transitions DRAFT->CATALOGED, CATALOGED->LISTED, PASSED->WITHDRAWN."
    roles: [Operator]
    code: 200
    input: ["title?", "description?", "category?", "condition_grade?", "starting_bid_cents?", "reserve_cents?", "status?"]
    output: Lot
    side_effects: ["CATALOGED requires photo_count>=1; status transitions gated by estate.status and lot.status"]

  # ---- Photo ----
  - method: POST
    path: "/photos"
    description: "Attach a condition photo to a DRAFT/CATALOGED lot."
    roles: [Operator]
    code: 201
    input: [lot_id, image_url, "caption?", "condition_note?", "is_primary?"]
    output: Photo
    side_effects: ["Lot.photo_count incremented"]

  # ---- Buyer ----
  - method: POST
    path: "/buyers"
    description: "Self-register a buyer in REGISTERED."
    roles: [Anonymous]
    code: 201
    input: [display_name, email]
    output: Buyer
    side_effects: ["status=REGISTERED; no_show_strikes=0"]

  - method: GET
    path: "/buyers/{id}"
    description: "Fetch a buyer (own record or operator)."
    roles: [Operator, Buyer]
    code: 200
    input: []
    output: Buyer
    side_effects: []

  - method: POST
    path: "/buyers/{id}/verify"
    description: "Operator verifies a buyer: REGISTERED -> VERIFIED."
    roles: [Operator]
    code: 200
    input: []
    output: Buyer
    side_effects: ["status=VERIFIED"]

  # ---- Bid ----
  - method: POST
    path: "/bids"
    description: "Place a bid on a SELLING lot. Requires OCC expected_lot_version; enforces min-increment; may extend soft-close."
    roles: [Buyer]
    code: 201
    input: [lot_id, buyer_id, amount_cents, expected_lot_version]
    output: Bid
    side_effects: ["lot.current_bid_cents/high_bidder_id updated; prior high bid -> OUTBID; lot.bid_count++; Lot.version incremented by 1; soft_close may extend auction_ends_at"]

  - method: GET
    path: "/bids/{id}"
    description: "Fetch one bid."
    roles: [Operator, Buyer]
    code: 200
    input: []
    output: Bid
    side_effects: []

  - method: GET
    path: "/bids"
    description: "List bids (reverse-reachability for Bid.lot_id and Bid.buyer_id)."
    roles: [Operator, Buyer]
    code: 200
    input: ["lot_id?", "buyer_id?", "limit?", "offset?"]
    output: Bid[]
    side_effects: []

  # ---- Order ----
  - method: GET
    path: "/orders/{id}"
    description: "Fetch one order/invoice (exposes version)."
    roles: [Operator, Buyer]
    code: 200
    input: []
    output: Order
    side_effects: []

  - method: GET
    path: "/orders"
    description: "List orders (reverse-reachability for Order.estate_id, Order.buyer_id, Order.pickup_window_id)."
    roles: [Operator, Buyer]
    code: 200
    input: ["estate_id?", "buyer_id?", "pickup_window_id?", "limit?", "offset?"]
    output: Order[]
    side_effects: []

  - method: GET
    path: "/orders/{id}/payments"
    description: "List an order's payment ledger (reverse-reachability for Payment.order_id)."
    roles: [Operator, Buyer]
    code: 200
    input: ["limit?", "offset?"]
    output: Payment[]
    side_effects: []

  - method: POST
    path: "/orders/{id}/pay"
    description: "Pay an invoice in full: payment_status UNPAID -> PAID. Creates a CHARGE Payment."
    roles: [Buyer]
    code: 200
    input: [amount_cents]
    output: Order
    side_effects: ["CHARGE Payment created; amount_paid_cents recomputed; payment_status=PAID; buyer ledgers recomputed"]

  - method: POST
    path: "/orders/{id}/schedule-pickup"
    description: "Book a paid order into a pickup window: pickup_status PENDING -> SCHEDULED."
    roles: [Buyer]
    code: 200
    input: [pickup_window_id]
    output: Order
    side_effects: ["pickup_window_id set; PickupWindow.booked_count incremented"]

  - method: POST
    path: "/orders/{id}/cancel-pickup"
    description: "Release a booked slot: pickup_status SCHEDULED -> PENDING."
    roles: [Buyer]
    code: 200
    input: []
    output: Order
    side_effects: ["PickupWindow.booked_count decremented; pickup_window_id cleared"]

  - method: POST
    path: "/orders/{id}/complete-pickup"
    description: "Operator records the outcome of a scheduled pickup: SCHEDULED -> PICKED_UP or -> NO_SHOW."
    roles: [Operator]
    code: 200
    input: [result]
    output: Order
    side_effects: ["PICKED_UP: no counters; NO_SHOW: booked_count--, buyer.no_show_strikes++ (may SUSPEND)"]

  # ---- PickupWindow ----
  - method: POST
    path: "/pickup-windows"
    description: "Create a pickup window for an estate; rejected if it overlaps an existing window (half-open) of the same estate."
    roles: [Operator]
    code: 201
    input: [estate_id, starts_at, ends_at, capacity, "label?"]
    output: PickupWindow
    side_effects: ["booked_count=0"]

  # ---- Dispute ----
  - method: POST
    path: "/disputes"
    description: "Buyer files a dispute against a SOLD lot on their PAID order."
    roles: [Buyer]
    code: 201
    input: [order_id, lot_id, reason]
    output: Dispute
    side_effects: ["status=OPEN"]

  - method: GET
    path: "/disputes/{id}"
    description: "Fetch one dispute."
    roles: [Operator, Buyer]
    code: 200
    input: []
    output: Dispute
    side_effects: []

  - method: GET
    path: "/disputes"
    description: "List disputes (reverse-reachability for Dispute.order_id and Dispute.lot_id)."
    roles: [Operator, Buyer]
    code: 200
    input: ["order_id?", "lot_id?", "limit?", "offset?"]
    output: Dispute[]
    side_effects: []

  - method: PATCH
    path: "/disputes/{id}"
    description: "Advance a dispute. Operator: OPEN->UNDER_REVIEW, UNDER_REVIEW->NEEDS_INFO, UNDER_REVIEW->RESOLVED(outcome=BUYER_FAVOR), UNDER_REVIEW->REJECTED(outcome=SELLER_FAVOR). Buyer(owner): NEEDS_INFO->UNDER_REVIEW."
    roles: [Operator, Buyer]
    code: 200
    input: [status, "outcome?", "resolution_note?"]
    output: Dispute
    side_effects: ["RESOLVED+BUYER_FAVOR triggers refund + lot reversal + estate re-settle cascade"]

  # ---- Donation ----
  - method: GET
    path: "/donations/{id}"
    description: "Fetch one donation record."
    roles: [Operator, Buyer, Anonymous]
    code: 200
    input: []
    output: Donation
    side_effects: []

  - method: GET
    path: "/donations"
    description: "List donation records (reverse-reachability for Donation.lot_id and Donation.estate_id)."
    roles: [Operator, Buyer, Anonymous]
    code: 200
    input: ["lot_id?", "estate_id?", "limit?", "offset?"]
    output: Donation[]
    side_effects: []

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Required auth headers missing or malformed" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Acting role not permitted for this operation" }
  - { id: ERR_VALIDATION, http: 400, condition: "Missing/invalid body field, bad enum member, or bad pagination params" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced resource (path or FK) does not exist" }
  - { id: ERR_CROSS_OWNER, http: 403, condition: "Entity-backed Buyer acting on a resource they do not own (X-User-ID mismatch)" }
  - { id: ERR_ESTATE_NOT_CATALOGING, http: 409, condition: "Operation requires the estate in CATALOGING (lot/photo create, catalog/list, open)" }
  - { id: ERR_ESTATE_NOT_LIVE, http: 409, condition: "Bidding attempted while the estate is not LIVE / close attempted while not LIVE" }
  - { id: ERR_ESTATE_NOT_CLOSED, http: 409, condition: "Settle attempted while the estate is not CLOSED" }
  - { id: ERR_ESTATE_NOT_SETTLED, http: 409, condition: "Cleanout attempted while the estate is not SETTLED" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Requested state transition is not legal from the resource's current state (lot/dispute/estate)" }
  - { id: ERR_LOT_NOT_SELLING, http: 409, condition: "Bid placed on a lot that is not SELLING" }
  - { id: ERR_ORDER_ALREADY_PAID, http: 409, condition: "Pay attempted on an order not in UNPAID" }
  - { id: ERR_ORDER_NOT_PAID, http: 409, condition: "Schedule-pickup attempted on an order that is not PAID" }
  - { id: ERR_PICKUP_NOT_SCHEDULED, http: 409, condition: "Cancel/complete pickup attempted on an order not in SCHEDULED" }
  - { id: ERR_WINDOW_ESTATE_MISMATCH, http: 409, condition: "Chosen pickup window belongs to a different estate than the order" }
  - { id: ERR_LOT_NOT_IN_ORDER, http: 409, condition: "Dispute lot_id is not part of the disputed order's lot_ids" }
  - { id: ERR_WINDOW_OVERLAP, http: 409, condition: "New pickup window overlaps (half-open) an existing window of the same estate" }
  - { id: ERR_PICKUP_OVERLAP, http: 409, condition: "Chosen window collides (closed interval) with another window the buyer already holds" }
  - { id: ERR_BUYER_NOT_VERIFIED, http: 409, condition: "Bidding buyer is not VERIFIED" }
  - { id: ERR_BUYER_SUSPENDED, http: 409, condition: "Acting buyer is SUSPENDED (cannot bid or pay)" }
  - { id: ERR_BID_TOO_LOW, http: 409, condition: "Bid amount below the min-next-bid / below starting bid" }
  - { id: ERR_WINDOW_FULL, http: 409, condition: "Pickup window booked_count has reached capacity" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_lot_version does not match current Lot.version (OCC)" }
  - { id: ERR_INSUFFICIENT_PAYMENT, http: 402, condition: "Payment amount_cents is less than the order total_cents" }

# =============================================================================
# Table 7: RBAC Permission Matrix
# =============================================================================
roles:
  - name: Operator
    description: "Estate-house staff: manages estates, lots, photos, pickup windows, drives the auction lifecycle, records pickups, and adjudicates disputes."
    identity: "opaque"
    exclusive_operations:
      - "POST /estates and all /estates/{id}/{open,close,settle,cleanout}"
      - "POST /lots, PATCH /lots/{id}, POST /photos"
      - "POST /pickup-windows"
      - "POST /buyers/{id}/verify"
      - "POST /orders/{id}/complete-pickup"
      - "PATCH /disputes/{id} for Operator-driven transitions (review, request-info, resolve, reject)"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "All GET reads"

  - name: Buyer
    description: "Registered bidder/purchaser. Acts only on their own bids, orders, and disputes; X-User-ID equals their Buyer.id."
    identity: "entity_backed:Buyer"
    exclusive_operations:
      - "POST /bids (buyer_id == X-User-ID)"
      - "POST /orders/{id}/pay, /schedule-pickup, /cancel-pickup (own order)"
      - "POST /disputes (own order); PATCH /disputes/{id} NEEDS_INFO->UNDER_REVIEW (own order)"
    shared_operations:
      - "GET reads of estates, lots, photos, own bids/orders/payments/disputes, donations"

  - name: Anonymous
    description: "Unauthenticated public visitor. May self-register as a buyer and browse public catalog reads."
    identity: "opaque"
    exclusive_operations:
      - "POST /buyers"
    shared_operations:
      - "GET /estates/{id}, /estates/{id}/lots, /estates/{id}/pickup-windows, /lots/{id}, /lots/{id}/photos, /donations, /donations/{id}"
