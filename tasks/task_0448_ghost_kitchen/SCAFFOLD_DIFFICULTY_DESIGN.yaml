  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: buffered_unit_gap_required
        grounds:
          - validations[priority=9]
          - entities.Equipment.fields.turnaround_buffer_minutes
          - entities.EquipmentBooking.fields.start_minute
        distinguishing_aspect: |
          On a unit with turnaround_buffer_minutes 10 holding [100,150), a new booking [150,170)
          touching the prior end is REJECTED because the buffer demands a >=10-minute gap (start must
          be >=160) — interval semantics: buffered adjacency forbidden.
        test_recipe:
          setup:
            - "Stall S15 OPEN with FRYER buffer 10; existing HELD booking [100,150)."
          setup_api_calls:
            - call: "POST /stalls"
              payload: { name: "S15", timezone: "UTC", open_minute_of_day: 0, close_minute_of_day: 1440 }
              as: PlatformOps
              captures: { s15_id: $.data.id }
            - call: "POST /equipment"
              payload: { stall_id: "${s15_id}", equipment_type: "FRYER", turnaround_buffer_minutes: 10 }
              as: StallOperator
              as_user_id: "${s15_id}"
              captures: { eq15_id: $.data.id }
            - call: "POST /equipment-bookings"
              payload: { equipment_id: "${eq15_id}", start_minute: 100, end_minute: 150 }
              as: StallOperator
              as_user_id: "${s15_id}"
          trigger:
            - call: "POST /equipment-bookings"
              payload: { equipment_id: "${eq15_id}", start_minute: 150, end_minute: 170 }
              as: StallOperator
              as_user_id: "${s15_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_BOOKING_OVERLAP"

      - name: zero_buffer_unit_adjacency_allowed
        grounds:
          - validations[priority=9]
          - entities.Equipment.fields.turnaround_buffer_minutes
          - entities.EquipmentBooking.fields.end_minute
        distinguishing_aspect: |
          On a different unit with turnaround_buffer_minutes 0 holding [100,150), a new booking
          [150,160) that touches at the half-open boundary is ACCEPTED — interval semantics:
          zero-buffer half-open adjacency permitted, the geometric opposite of instance 1.
        test_recipe:
          setup:
            - "Stall S16 OPEN with FRYER buffer 0; existing HELD booking [100,150)."
          setup_api_calls:
            - call: "POST /stalls"
              payload: { name: "S16", timezone: "UTC", open_minute_of_day: 0, close_minute_of_day: 1440 }
              as: PlatformOps
              captures: { s16_id: $.data.id }
            - call: "POST /equipment"
              payload: { stall_id: "${s16_id}", equipment_type: "FRYER", turnaround_buffer_minutes: 0 }
              as: StallOperator
              as_user_id: "${s16_id}"
              captures: { eq16_id: $.data.id }
            - call: "POST /equipment-bookings"
              payload: { equipment_id: "${eq16_id}", start_minute: 100, end_minute: 150 }
              as: StallOperator
              as_user_id: "${s16_id}"
          trigger:
            - call: "POST /equipment-bookings"
              payload: { equipment_id: "${eq16_id}", start_minute: 150, end_minute: 160 }
              as: StallOperator
              as_user_id: "${s16_id}"
              captures: { bk16_id: $.data.id }
          assert:
            - "response.status == 201"
            - "EquipmentBooking.${bk16_id}.start_minute == 150"
            - "EquipmentBooking.${bk16_id}.status == HELD"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: cancel_restores_inventory_grams_conserved
        grounds:
          - state_machines.AggregatorOrder.ROUTED_to_CANCELLED
          - calculations.fifo_inventory_consumption
          - entities.IngredientLot.fields.grams_remaining
        distinguishing_aspect: |
          Conserved quantity = total chicken grams_remaining across lots at the stall. Route then
          cancel: before route sum is 600, after cancel sum returns to exactly 600 — grams are
          restored to the same lots, leaving zero drift.
        test_recipe:
          setup:
            - "Brand B17 ACTIVE+LISTED with Wings (chicken 200g)."
            - "Stall S17 OPEN FRYER; two chicken lots: lot1 300g@8 (2026-01-01), lot2 300g@5 (2026-01-02). Sum 600."
            - "Clock 2026-01-05T00:00:00Z; order O17 = 2x Wings (need 400g), ROUTED (lot1->0, lot2->200)."
          setup_api_calls:
            - call: "POST /stalls"
              payload: { name: "S17", timezone: "UTC", open_minute_of_day: 0, close_minute_of_day: 1440 }
              as: PlatformOps
              captures: { s17_id: $.data.id }
            - call: "POST /brands"
              payload: { name: "B17", owner_email: "b17@x.com", commission_rate_bps: 1000 }
              as: PlatformOps
              captures: { b17_id: $.data.id }
            - call: "POST /leases"
              payload: { stall_id: "${s17_id}", brand_id: "${b17_id}", monthly_fee_cents: 100000, priority_rank: 1 }
              as: PlatformOps
              captures: { l17_id: $.data.id }
            - call: "POST /leases/${l17_id}/activate"
              payload: {}
              as: StallOperator
              as_user_id: "${s17_id}"
            - call: "POST /brands/${b17_id}/list"
              payload: {}
              as: BrandOwner
              as_user_id: "${b17_id}"
            - call: "POST /menu-items"
              payload: { brand_id: "${b17_id}", name: "Wings", price_cents: 1000, prep_minutes: 8, required_equipment_type: "FRYER" }
              as: BrandOwner
              as_user_id: "${b17_id}"
              captures: { w17_id: $.data.id }
            - call: "POST /menu-items/${w17_id}/recipe-components"
              payload: { ingredient_name: "chicken", quantity_grams: 200 }
              as: BrandOwner
              as_user_id: "${b17_id}"
            - call: "POST /equipment"
              payload: { stall_id: "${s17_id}", equipment_type: "FRYER" }
              as: StallOperator
              as_user_id: "${s17_id}"
            - call: "POST /ingredient-lots"
              payload: { stall_id: "${s17_id}", ingredient_name: "chicken", received_at: "2026-01-01T00:00:00Z", unit_cost_cents_per_gram: 8, grams_received: 300 }
              as: StallOperator
              as_user_id: "${s17_id}"
              captures: { lot17a_id: $.data.id }
            - call: "POST /ingredient-lots"
              payload: { stall_id: "${s17_id}", ingredient_name: "chicken", received_at: "2026-01-02T00:00:00Z", unit_cost_cents_per_gram: 5, grams_received: 300 }
              as: StallOperator
              as_user_id: "${s17_id}"
              captures: { lot17b_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-05T00:00:00Z" }
              as: PlatformOps
            - call: "POST /orders"
              payload: { brand_id: "${b17_id}", aggregator: "DOORDASH", external_ref: "DD-17", line_items: [ { menu_item_id: "${w17_id}", qty: 2 } ] }
              as: AggregatorGateway
              captures: { o17_id: $.data.id }
            - call: "POST /orders/${o17_id}/route"
              payload: {}
              as: PlatformOps
              captures: { o17_ver: $.data.version }
          trigger:
            - call: "POST /orders/${o17_id}/cancel"
              payload: { expected_order_version: "${o17_ver}" }
              as: PlatformOps
          assert:
            - "IngredientLot.${lot17a_id}.grams_remaining == 300"
            - "IngredientLot.${lot17b_id}.grams_remaining == 300"
            - "AggregatorOrder.${o17_id}.status == CANCELLED"

      - name: cancel_leaves_brand_ledger_unchanged
        grounds:
          - state_machines.AggregatorOrder.PREPARING_to_CANCELLED
          - calculations.brand_ledger_balance
          - entities.VirtualBrand.fields.ledger_balance_cents
        distinguishing_aspect: |
          Conserved quantity = VirtualBrand.ledger_balance_cents (a monetary balance, a different
          conserved quantity than grams). Routing then cancelling from PREPARING never credits the
          ledger, so it stays at its pre-order value 0 — no drift.
        test_recipe:
