              payload: { patient_id: "${p1_id}", unit_id: "${u1_id}", support_surface_id: "${s2_id}", rental_start: "2026-08-01T00:00:00Z", rental_end: "2026-08-04T00:00:00Z", authorized_days: 3 }
              as: MaterialsCoordinator
              captures: { o2_id: "$.data.id" }
