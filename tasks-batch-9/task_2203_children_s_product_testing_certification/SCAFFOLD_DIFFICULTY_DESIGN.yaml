          - entities.NoncomplianceCase.fields.retest_round_count
        distinguishing_aspect: "A genuine CYCLE: RETEST_ORDERED -> RETEST_FAILED -> RETEST_ORDERED is traversed three times on one case, so the case occupies RETEST_ORDERED at three distinct retest_round_count values (0, 1, 2). The cycle is not unbounded — the fourth order-retest request finds retest_round_count == 3 and diverts to ESCALATED_RECALL instead of looping again. A linear implementation cannot re-enter RETEST_ORDERED at all, and an unguarded cyclic implementation would loop forever. The load-bearing observation is that the SAME endpoint on the SAME state yields different target states depending on an accumulated counter."
