  - section: consistency_model
    note: >-
      consistency_model: immediate. There is no eventual-consistency allowance anywhere in this scaffold, so every derived field, every counter and every cascaded status must be correct in the mutation's own response body and in the very next read - no retry, no settle delay.
    instances:
      - name: every_write_is_visible_in_the_same_response_and_the_next_read
        claim_type: immediate
        grounds:
          - "complexity_profile consistency_model immediate"
          - "state_machines SalesObservation create side_effects - avg_price_cents := round(revenue_cents / units_sold, 0), DataWindow.sales_period_count += 1, DataWindow.lag_completeness_pct recomputed, DataWindow.version += 1"
          - "state_machines GeoCell UNASSIGNED -> TREATMENT/CONTROL side_effects - Market.held_out_population += population"
        distinguishing_aspect: |
          Immediacy is asserted in two places at once: the mutation's OWN response already carries every
          field it derived (avg_price_cents on the observation, the realised arm populations on the
          experiment), and the aggregate on a DIFFERENT entity is correct on the first following read with
          no second attempt - so an implementation that recomputes counters lazily on a later request is
          caught by the immediately following GET.
          
        test_recipe:
