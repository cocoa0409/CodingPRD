          assert:
            - "The trigger call returns 200 and FieldAction.${fa_bp_id}.approval_state == APPROVED"
            - "FieldAction.${fa_bp_id}.approved_period_id == \"${p_q4_id}\" — NOT the lexically greater 2027-Q1 (${p_q1_id}), which is in ACTUARIAL_REVIEW, and not 2026-Q2 (${p_q2_id})"
            - "FieldAction.${fa_bp_id}.specific_accrual_cents == 5350000"
            - "AccrualPeriod.${p_q4_id}.significant_exposure_count == 0 (5350000 is below the 50000000 threshold) and requires_significant_exposure_disclosure == false"

      - name: corner_remedy_selector_ranks_by_per_unit_cost_then_take_rate
        claim_type: Correct Result
        grounds:
          - calculations.remedy_option_selection
          - calculations.field_action_specific_accrual
        distinguishing_aspect: "Four options: one not engineering-approved (cheapest at 50 cents per unit) and one with a 0 bps take rate are both filtered out, and the two survivors tie at 3000 cents per unit, so the expected_take_rate_bps ASC tie-break selects the 5000 bps option over the 10000 bps one."
        test_recipe:
          setup:
            - "One ProductFamily FAM-RS (reserve_cap_cents 40000000) and FieldAction FA-RS over 2000 units, action_type SERVICE_CAMPAIGN so is_safety_recall is false."
            - "OPT-RS-A: is_engineering_approved false, parts 100, take 5000 -> per unit 50, EXCLUDED."
            - "OPT-RS-B: approved, parts 500, take 0 -> EXCLUDED by the >= 1 bps filter."
            - "OPT-RS-C: approved, parts 6000, take 5000 -> per unit 3000."
            - "OPT-RS-D: approved, parts 3000, take 10000 -> per unit 3000 (tie)."
          setup_api_calls:
            - call: "POST /warranty/product-families"
              payload: { family_code: "FAM-RS", name: "Remedy Selector Platform", launch_date: "2024-01-01", base_warranty_months: 24, standard_cost_per_claim_cents: 15000, reserve_cap_cents: 40000000 }
              as: WarrantyAnalyst
              captures: { fam_rs_id: $.data.id }
            - call: "POST /warranty/field-actions"
              payload: { family_id: "${fam_rs_id}", action_code: "FA-RS-01", action_type: "SERVICE_CAMPAIGN", affected_build_start_date: "2025-01-01", affected_build_end_date: "2025-03-31", affected_unit_count: 2000 }
              as: QualityEngineer
              captures: { fa_rs_id: $.data.id, fa_rs_ver: $.data.version }
            - call: "POST /warranty/field-actions/${fa_rs_id}/remedy-options"
              payload: { option_code: "OPT-RS-A", remedy_class: "SOFTWARE_UPDATE", parts_cost_cents: 100, labor_hours_centi: 0, admin_cost_cents: 0, expected_take_rate_bps: 5000, is_engineering_approved: false }
              as: QualityEngineer
              captures: { opt_rs_a: $.data.id }
            - call: "POST /warranty/field-actions/${fa_rs_id}/remedy-options"
              payload: { option_code: "OPT-RS-B", remedy_class: "INSPECTION_ONLY", parts_cost_cents: 500, labor_hours_centi: 0, admin_cost_cents: 0, expected_take_rate_bps: 0, is_engineering_approved: true }
              as: QualityEngineer
              captures: { opt_rs_b: $.data.id }
            - call: "POST /warranty/field-actions/${fa_rs_id}/remedy-options"
              payload: { option_code: "OPT-RS-C", remedy_class: "PERMANENT_REPAIR", parts_cost_cents: 6000, labor_hours_centi: 0, admin_cost_cents: 0, expected_take_rate_bps: 5000, is_engineering_approved: true }
              as: QualityEngineer
              captures: { opt_rs_c: $.data.id }
            - call: "POST /warranty/field-actions/${fa_rs_id}/remedy-options"
              payload: { option_code: "OPT-RS-D", remedy_class: "PERMANENT_REPAIR", parts_cost_cents: 3000, labor_hours_centi: 0, admin_cost_cents: 0, expected_take_rate_bps: 10000, is_engineering_approved: true }
              as: QualityEngineer
              captures: { opt_rs_d: $.data.id }
          trigger:
            - call: "POST /warranty/field-actions/${fa_rs_id}/select-remedy"
              payload: { expected_field_action_version: "${fa_rs_ver}" }
              as: QualityEngineer
          assert:
            - "The trigger call returns 200"
            - "FieldAction.${fa_rs_id}.selected_remedy_option_id == \"${opt_rs_c}\" — not the excluded ${opt_rs_a} / ${opt_rs_b} and not the tie-losing ${opt_rs_d}"
            - "RemedyOption.${opt_rs_c}.per_unit_expected_cents == 3000"
            - "FieldAction.${fa_rs_id}.specific_accrual_cents == 6000000 (3000 * 2000 units) and version == 2"
            - "GET /warranty/field-actions/${fa_rs_id}/remedy-options reports total_count == 4"

      - name: corner_only_completed_execution_reduces_the_family_balance
        claim_type: aggregation
        grounds:
          - calculations.family_reserve_balance
          - state_machines.FieldAction.execution_dimension
          - endpoints[POST /warranty/field-actions/{fieldActionId}/execution-progress]
        distinguishing_aspect: "The IN_PROGRESS step records incurred_cost_cents 1000000 on the field action yet leaves warranty_reserve_balance_cents at 12000000, because completed_execution_total only counts field actions whose execution_state is COMPLETED; the COMPLETED step then drops the balance to 10500000."
        test_recipe:
          setup:
            - "One OPEN AccrualPeriod 2026-Q3."
            - "ProductFamily FAM-EX (reserve_cap_cents 30000000) with an APPROVED field action over 1000 units at per_unit 12000 -> specific_accrual 12000000."
          setup_api_calls:
            - call: "POST /warranty/periods"
              payload: { period_code: "2026-Q3", period_start_date: "2026-07-01", period_end_date: "2026-09-30" }
              as: ReserveController
            - call: "POST /warranty/product-families"
              payload: { family_code: "FAM-EX", name: "Execution Platform", launch_date: "2024-01-01", base_warranty_months: 24, standard_cost_per_claim_cents: 12000, reserve_cap_cents: 30000000 }
              as: WarrantyAnalyst
              captures: { fam_ex_id: $.data.id }
            - call: "POST /warranty/field-actions"
              payload: { family_id: "${fam_ex_id}", action_code: "FA-EX-01", action_type: "SERVICE_CAMPAIGN", affected_build_start_date: "2025-01-01", affected_build_end_date: "2025-03-31", affected_unit_count: 1000 }
              as: QualityEngineer
              captures: { fa_ex_id: $.data.id, fa_ex_ver: $.data.version }
            - call: "POST /warranty/field-actions/${fa_ex_id}/remedy-options"
              payload: { option_code: "OPT-EX-1", remedy_class: "PERMANENT_REPAIR", parts_cost_cents: 2000, labor_hours_centi: 100, admin_cost_cents: 500, expected_take_rate_bps: 10000, is_engineering_approved: true }
              as: QualityEngineer
              captures: { opt_ex_id: $.data.id }
            - call: "POST /warranty/field-actions/${fa_ex_id}/select-remedy"
              payload: { expected_field_action_version: "${fa_ex_ver}", remedy_option_id: "${opt_ex_id}" }
              as: QualityEngineer
            - call: "POST /warranty/field-actions/${fa_ex_id}/submit"
              payload: {}
              as: QualityEngineer
              as_user_id: "uq-1"
            - call: "POST /warranty/field-actions/${fa_ex_id}/decision"
              payload: { decision: "APPROVED" }
              as: ReserveController
              as_user_id: "urc-1"
          trigger:
            - call: "POST /warranty/field-actions/${fa_ex_id}/execution-progress"
              payload: { to_execution_state: "IN_PROGRESS", incurred_cost_cents: 1000000 }
              as: QualityEngineer
            - call: "POST /warranty/field-actions/${fa_ex_id}/execution-progress"
              payload: { to_execution_state: "COMPLETED", incurred_cost_cents: 500000 }
