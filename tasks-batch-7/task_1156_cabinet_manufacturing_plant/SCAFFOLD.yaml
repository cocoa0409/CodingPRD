# =============================================================================
# Task 1156 — Cabinet Manufacturing Plant (KCMA) — Scaffold seed tables
# =============================================================================

scenario: |
  1156. Cabinet Manufacturing Plant (KCMA): door style/finish catalog & nested
  part generation, modification (mod) pricing & engineering review, finish batch
  color match & sheen lot, box assembly line balance & sub-lot, order hold on
  out-of-stock component, damage/replacement door program, dealer network price
  levels, delivery route & consolidation

domain_name: cabinet-manufacturing-plant
api_prefix: /kcma

# Difficulty directive: "harder than expert level" — Expert band ceiling pushed:
# 16 entities, 56 endpoints, dense coupling (compound order posture, cyclic
# review/QC loops, 4 cascades, OCC on route assignment, dual-variant pricing
# and claim credit, two different interval-overlap semantics).

complexity_profile:
  primary_archetype: quota_allocation        # finite pools: component sheets, batch door capacity, line minutes, route cube
  secondary_archetype: pricing_engine        # dealer price levels, mod surcharges, volume tiers, freight consolidation
  complexity_layers:
    - cascading_side_effects                 # nesting release -> parts -> component overdraft -> holds -> order posture
    - dual_variant_calculation               # provisional-vs-final order pricing; provisional-vs-final claim credit
    - optimistic_concurrency                 # OCC on Order.version for route assignment (supersede = re-home)
    - derived_field_reconciliation           # order totals, route reserved cube, batch assigned count, line coverage
  entity_topology: flat                      # peer entities joined by FKs; no nested URL ownership
  state_machine_shape: compound              # Order posture auto-derived from lines/holds/batches/sub-lots; plus cyclic machines on ModificationRequest and FinishBatch
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: peer_roles                     # Dealer / Engineer / FinishSupervisor / ProductionPlanner / ShippingCoordinator / PlantAdmin own disjoint verbs
  consistency_model: immediate               # all side effects atomic within the triggering request

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Dealer
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Dealer company name" }
      - { name: dealer_code, type: string, source: input, description: "Unique dealer code", constraints: "unique across all dealers" }
      - { name: price_level, type: enum, source: input, description: "Dealer network price level", constraints: "L1 | L2 | L3 | L4 | L5" }
      - { name: credit_limit_cents, type: integer, source: input, description: "Maximum open order exposure in cents", constraints: ">= 0" }

  - name: DoorStyle
    parent: null
    common_fields: true
    fields:
      - { name: style_code, type: string, source: input, description: "Unique door style code", constraints: "unique" }
      - { name: name, type: string, source: input, description: "Style display name" }
      - { name: construction, type: enum, source: input, description: "Door construction family", constraints: "SLAB | SHAKER | RAISED_PANEL | GLASS" }
      - { name: base_list_price_cents, type: integer, source: input, description: "Catalog list price per door (used as replacement valuation basis)", constraints: "> 0" }
      - { name: active, type: boolean, source: input, default: true, description: "Inactive styles cannot be referenced by new order lines" }

  - name: FinishSpec
    parent: null
    common_fields: true
    fields:
      - { name: finish_code, type: string, source: input, description: "Unique finish code", constraints: "unique" }
      - { name: color_name, type: string, source: input, description: "Color name" }
      - { name: sheen, type: enum, source: input, description: "Sheen family of the finish", constraints: "MATTE | SATIN | SEMI_GLOSS | HIGH_GLOSS" }
      - { name: upcharge_pct, type: number, source: input, description: "Finish upcharge fraction applied to line list (e.g. 0.10 = 10%)", constraints: ">= 0" }
      - { name: delta_e_tolerance, type: number, source: input, default: 1.5, description: "Max acceptable color deviation; |measured_delta_e| <= tolerance releases the batch", constraints: "> 0" }
      - { name: active, type: boolean, source: input, default: true, description: "Inactive finishes cannot be referenced by new order lines or batches" }

  - name: Component
    parent: null
    common_fields: true
    fields:
      - { name: sku, type: string, source: input, description: "Unique stock-keeping unit", constraints: "unique" }
      - { name: description, type: string, source: input, description: "Component description" }
      - { name: kind, type: enum, source: input, description: "Component kind", constraints: "SHEET_GOODS | DOOR_BLANK | HARDWARE" }
      - { name: sheet_width_in, type: integer, source: input, description: "Sheet width in inches; required iff kind == SHEET_GOODS", constraints: "> 0 when kind == SHEET_GOODS" }
      - { name: sheet_height_in, type: integer, source: input, description: "Sheet height in inches; required iff kind == SHEET_GOODS", constraints: "> 0 when kind == SHEET_GOODS" }
      - { name: on_hand_qty, type: integer, source: input, description: "Physical quantity on hand; mutated only by receipts", constraints: ">= 0 at creation" }
      - { name: reserved_qty, type: integer, source: computed, default: 0, description: "Sheets reserved by RELEASED nesting runs; never negative-adjusted except by run cancellation rules (runs are terminal once released, so reservations are sunk)" }
      - { name: available_qty, type: integer, source: computed, description: "Read-only = on_hand_qty - reserved_qty; may go negative (overdraft drives shortage holds)" }
      - { name: reorder_level, type: integer, source: input, default: 0, description: "Informational reorder threshold" }

  - name: Order
    parent: null
    common_fields: true
    fields:
      - { name: dealer_id, type: string, source: system, description: "FK -> Dealer.id; set from X-User-ID of the creating Dealer role" }
      - { name: price_level_snapshot, type: enum, source: system, description: "Dealer price_level copied at order creation; immune to later dealer edits", constraints: "L1 | L2 | L3 | L4 | L5" }
      - { name: status, type: enum, source: system, description: "DRAFT -> SUBMITTED -> IN_PRODUCTION -> READY_TO_SHIP -> SHIPPED; CANCELLED from DRAFT/SUBMITTED" }
      - { name: hold_status, type: enum, source: computed, description: "Parallel dimension: ON_HOLD iff >= 1 OrderHold with status PLACED references this order, else NONE", constraints: "NONE | ON_HOLD" }
      - { name: cube_ft, type: number, source: computed, default: 0, description: "Total shipping cube (cubic feet, 2dp) across all non-cancelled lines" }
      - { name: provisional_merchandise_cents, type: integer, source: computed, description: "Sum of provisional line nets at submit (variant 1: multiplier applied to list+upcharge+mods)" }
      - { name: provisional_discount_cents, type: integer, source: computed, description: "Volume discount on provisional merchandise at submit" }
      - { name: provisional_total_cents, type: integer, source: computed, description: "provisional_merchandise_cents - provisional_discount_cents; basis of the submit credit check" }
      - { name: final_merchandise_cents, type: integer, source: computed, description: "Sum of final line nets at dispatch (variant 2: multiplier on list portion only)" }
      - { name: final_discount_cents, type: integer, source: computed, description: "Volume discount recomputed on final merchandise at dispatch" }
      - { name: freight_cents, type: integer, source: computed, description: "Freight charge fixed at dispatch (consolidation tier by route order count at dispatch instant)" }
      - { name: grand_total_cents, type: integer, source: computed, description: "final_merchandise_cents - final_discount_cents + freight_cents; set at dispatch" }
      - { name: delivery_route_id, type: string, source: system, default: null, description: "FK -> DeliveryRoute.id; nullable; assignment supersedes any prior route" }
      - { name: route_stop_seq, type: integer, source: system, description: "1-based stop sequence on the assigned route, assigned by order of assign-order calls (earliest accepted assignment first)" }
      - { name: submitted_at, type: datetime, source: system, description: "Logical-clock timestamp of submit" }
      - { name: shipped_at, type: datetime, source: system, description: "Logical-clock timestamp of dispatch (ship)" }

  - name: OrderLine
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: system, description: "FK -> Order.id; owning order" }
      - { name: line_type, type: enum, source: input, description: "BOX = cabinet box; DOOR = door line", constraints: "BOX | DOOR" }
      - { name: door_style_id, type: string, source: input, default: null, description: "FK -> DoorStyle.id; required iff line_type == DOOR, forbidden for BOX" }
      - { name: finish_id, type: string, source: input, description: "FK -> FinishSpec.id; required for both line types" }
      - { name: width_in, type: integer, source: input, description: "Width in whole inches", constraints: "> 0" }
      - { name: height_in, type: integer, source: input, description: "Height in whole inches", constraints: "> 0" }
      - { name: depth_in, type: integer, source: input, description: "Depth in whole inches (BOX); for DOOR must be 1", constraints: "> 0" }
      - { name: qty, type: integer, source: input, description: "Quantity", constraints: "> 0" }
      - { name: unit_list_price_cents, type: integer, source: input, description: "Catalog unit list price in cents (client-looked-up; server validates > 0)", constraints: "> 0" }
      - { name: finish_upcharge_pct_snapshot, type: number, source: system, description: "FinishSpec.upcharge_pct copied at line creation" }
      - { name: line_list_cents, type: integer, source: computed, description: "unit_list_price_cents * qty" }
      - { name: finish_upcharge_cents, type: integer, source: computed, description: "round_half_up(line_list_cents * finish_upcharge_pct_snapshot)" }
      - { name: mod_surcharge_cents, type: integer, source: computed, default: 0, description: "Sum of surcharges of APPROVED modifications on this line; refreshed at submit and at dispatch" }
      - { name: provisional_net_cents, type: integer, source: computed, description: "round_half_up((line_list + upcharge + mods) * multiplier) at submit" }
      - { name: final_net_cents, type: integer, source: computed, description: "round_half_up(line_list * multiplier) + upcharge + mods at dispatch" }
      - { name: finish_batch_id, type: string, source: system, default: null, description: "FK -> FinishBatch.id; DOOR lines only; set by batch assign, cleared by QC-fail cascade" }
      - { name: required_sheen_lot_no, type: string, source: input, default: null, description: "DOOR lines only: when set, batch assign requires the batch's sheen_lot_no to equal this value (sheen lot rule)" }
      - { name: status, type: enum, source: system, description: "PENDING -> QUOTED -> IN_PROGRESS -> COMPLETED -> SHIPPED (SHIPPED via route dispatch); CANCELLED with order" }
      - { name: slotted_qty, type: integer, source: computed, default: 0, description: "BOX lines: sum of qty over non-cancelled SubLots covering this line" }

  - name: ModificationRequest
    parent: null
    common_fields: true
    fields:
      - { name: order_line_id, type: string, source: system, description: "FK -> OrderLine.id; modified line" }
      - { name: mod_code, type: enum, source: input, description: "Modification type", constraints: "REDUCED_DEPTH | INCREASED_DEPTH | REDUCED_WIDTH | INCREASED_WIDTH | TOE_KICK_NOTCH | CUSTOM_BORE" }
      - { name: new_dimension_in, type: integer, source: input, description: "Requested dimension after modification (depth or width per mod_code; ignored for TOE_KICK_NOTCH)", constraints: "> 0" }
      - { name: surcharge_cents, type: integer, source: computed, description: "Mod surcharge per mod_surcharge calculation; computed at creation, recomputed on resubmit" }
      - { name: revision, type: integer, source: system, default: 1, description: "Increments on every resubmit" }
      - { name: status, type: enum, source: system, description: "UNDER_REVIEW -> APPROVED | REJECTED (terminal); UNDER_REVIEW -> CHANGES_REQUESTED -> UNDER_REVIEW (resubmit cycle)" }
      - { name: reviewer_note, type: string, source: system, description: "Last engineer note from review" }

  - name: FinishBatch
    parent: null
    common_fields: true
    fields:
      - { name: finish_id, type: string, source: input, description: "FK -> FinishSpec.id; finish being batched" }
      - { name: sheen_lot_no, type: string, source: input, description: "Sheen lot identifier of this batch; a DOOR line with required_sheen_lot_no set can only be assigned to a batch with the same lot no" }
      - { name: capacity_doors, type: integer, source: input, description: "Maximum door count the batch can finish", constraints: "> 0" }
      - { name: measured_delta_e, type: number, source: system, description: "Color deviation recorded at QC; null while MIXING" }
      - { name: assigned_door_count, type: integer, source: computed, default: 0, description: "Sum of qty over DOOR OrderLines currently assigned (finish_batch_id == this batch, line not CANCELLED)" }
      - { name: remix_count, type: integer, source: system, default: 0, description: "Increments on each remix (FAILED -> MIXING)" }
      - { name: status, type: enum, source: system, description: "MIXING -> RELEASED | FAILED (via qc-record); FAILED -> MIXING (remix cycle)" }

  - name: NestingStation
    parent: null
    common_fields: true
    fields:
      - { name: station_code, type: string, source: input, description: "Unique station code", constraints: "unique" }
      - { name: changeover_minutes, type: integer, source: input, description: "Mandatory buffer between consecutive runs on this station", constraints: ">= 0" }
      - { name: active, type: boolean, source: input, default: true, description: "Inactive stations reject new runs" }

  - name: NestingRun
    parent: null
    common_fields: true
    fields:
      - { name: station_id, type: string, source: input, description: "FK -> NestingStation.id" }
      - { name: sheet_component_id, type: string, source: input, description: "FK -> Component.id; must reference kind == SHEET_GOODS" }
      - { name: door_line_ids, type: array, source: input, description: "OrderLine ids (line_type == DOOR) to nest; order-independent, generation order pinned by calculation" }
      - { name: scheduled_date, type: string, source: input, description: "ISO date (YYYY-MM-DD) of the run window; must not be before the logical clock's current date" }
      - { name: start_minute, type: integer, source: input, description: "Window start minute-of-day", constraints: "0..1439" }
      - { name: end_minute, type: integer, source: input, description: "Window end minute-of-day", constraints: "start_minute < end_minute <= 1440" }
      - { name: status, type: enum, source: system, description: "DRAFT -> RELEASED (terminal) | CANCELLED (from DRAFT)" }
      - { name: total_blank_area_in2, type: integer, source: computed, description: "Sum over nested lines of width_in * height_in * qty; set at release" }
      - { name: sheets_required, type: integer, source: computed, description: "ceil(total_blank_area_in2 * 1.12 / sheet_area) computed at release" }
      - { name: utilization_pct, type: number, source: computed, description: "round_half_up(100 * total_blank_area_in2 / (sheets_required * sheet_area), 2) at release" }

  - name: Part
    parent: null
    common_fields: false
    fields:
      - { name: nesting_run_id, type: string, source: system, description: "FK -> NestingRun.id; generating run" }
      - { name: order_line_id, type: string, source: system, description: "FK -> OrderLine.id; door line this part cuts for" }
      - { name: component_id, type: string, source: system, description: "FK -> Component.id; sheet component consumed (copied from run)" }
      - { name: part_kind, type: enum, source: system, description: "DOOR_BLANK", constraints: "DOOR_BLANK" }
      - { name: width_in, type: integer, source: system, description: "Part width (from line)" }
      - { name: height_in, type: integer, source: system, description: "Part height (from line)" }
      - { name: qty, type: integer, source: system, description: "Part quantity (line qty)" }
      - { name: part_seq, type: integer, source: system, description: "Deterministic sequence within run: height_in DESC, width_in DESC, order_line created_at ASC" }

  - name: AssemblyLine
    parent: null
    common_fields: true
    fields:
      - { name: line_code, type: string, source: input, description: "Unique assembly line code", constraints: "unique" }
      - { name: capacity_minutes_per_day, type: integer, source: input, description: "Daily load capacity in minutes", constraints: "> 0" }
      - { name: standard_minutes_per_box, type: integer, source: input, description: "Labor minutes per box", constraints: "> 0" }
      - { name: setup_minutes_per_sub_lot, type: integer, source: input, description: "Setup minutes charged once per sub-lot", constraints: ">= 0" }
      - { name: active, type: boolean, source: input, default: true, description: "Inactive lines reject new sub-lots" }

  - name: SubLot
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: system, description: "FK -> Order.id; denormalized from the covered line's order" }
      - { name: order_line_id, type: string, source: input, description: "FK -> OrderLine.id; must be a BOX line" }
      - { name: assembly_line_id, type: string, source: input, description: "FK -> AssemblyLine.id" }
      - { name: scheduled_date, type: string, source: input, description: "ISO date; must not be before the logical clock's current date" }
      - { name: start_minute, type: integer, source: input, description: "Window start minute-of-day on the line", constraints: "0..1439" }
      - { name: qty, type: integer, source: input, description: "Boxes in this sub-lot; must be <= line qty - slotted_qty", constraints: "> 0" }
      - { name: work_minutes, type: integer, source: computed, description: "qty * line.standard_minutes_per_box + line.setup_minutes_per_sub_lot" }
      - { name: end_minute, type: integer, source: computed, description: "start_minute + work_minutes; must be <= 1440" }
      - { name: status, type: enum, source: system, description: "SCHEDULED -> COMPLETE (complete action) | CANCELLED (order-cancel cascade)" }

  - name: ReplacementClaim
    parent: null
    common_fields: true
    fields:
      - { name: dealer_id, type: string, source: system, description: "FK -> Dealer.id; claiming dealer from X-User-ID" }
      - { name: original_order_line_id, type: string, source: input, description: "FK -> OrderLine.id; must be a DOOR line on a SHIPPED order owned by the claiming dealer" }
      - { name: claim_type, type: enum, source: input, description: "FREIGHT_DAMAGE | MANUFACTURING_DEFECT | DEALER_ERROR" }
      - { name: qty, type: integer, source: input, description: "Damaged door count", constraints: "> 0" }
      - { name: credit_basis_cents, type: integer, source: computed, description: "round_half_up(original line unit_list_price_cents * dealer_multiplier(dealer price_level at claim creation) * qty)" }
      - { name: provisional_credit_cents, type: integer, source: computed, description: "Variant 1 (estimate at creation): round_half_up(credit_basis_cents * 0.50) regardless of claim_type" }
      - { name: final_credit_cents, type: integer, source: computed, description: "Variant 2 (at adjudication): 100% of basis for in-window FREIGHT_DAMAGE / MANUFACTURING_DEFECT; 0 for DEALER_ERROR" }
      - { name: replacement_charge_cents, type: integer, source: computed, description: "At adjudication: 0 for in-window freight/defect; round_half_up(basis * 0.60) for DEALER_ERROR" }
      - { name: status, type: enum, source: system, description: "SUBMITTED -> APPROVED_NO_CHARGE | APPROVED_CHARGED | DENIED (all terminal)" }
      - { name: adjudicator_note, type: string, source: system, description: "Note captured at adjudication" }

  - name: DeliveryRoute
    parent: null
    common_fields: true
    fields:
      - { name: route_code, type: string, source: input, description: "Unique route code", constraints: "unique" }
      - { name: route_date, type: string, source: input, description: "ISO date of the route; must not be before the logical clock's current date" }
      - { name: capacity_cu_ft, type: number, source: input, description: "Truck cube capacity", constraints: "> 0" }
      - { name: reserved_cu_ft, type: number, source: computed, default: 0, description: "Sum of cube_ft over assigned orders whose delivery_route_id == this route" }
      - { name: assigned_order_count, type: integer, source: computed, default: 0, description: "Count of orders currently assigned to this route" }
      - { name: status, type: enum, source: system, description: "PLANNED -> LOCKED -> DISPATCHED (terminal)" }

  - name: OrderHold
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: system, description: "FK -> Order.id; held order" }
      - { name: component_id, type: string, source: system, default: null, description: "FK -> Component.id; set for COMPONENT_SHORTAGE holds, null for FINISH_QC holds" }
      - { name: reason, type: enum, source: system, description: "COMPONENT_SHORTAGE | FINISH_QC" }
      - { name: shortfall_qty, type: integer, source: system, description: "Sheet shortfall recorded at placement (COMPONENT_SHORTAGE only); else null" }
      - { name: status, type: enum, source: system, description: "PLACED -> RELEASED (auto on covering receipt / line reassignment, or manual release)" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Order
    initial_state: DRAFT
    terminal_states: [SHIPPED, CANCELLED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: POST /kcma/orders/{orderId}/submit
        actor: Dealer
        preconditions:
          - "Order in DRAFT (ERR_ORDER_NOT_SUBMITTABLE)"
          - "Acting dealer owns the order: X-User-ID == order.dealer_id (ERR_RESOURCE_OWNERSHIP_MISMATCH)"
          - "Order has >= 1 line (ERR_ORDER_HAS_NO_LINES)"
          - "No ModificationRequest on any of the order's lines is in UNDER_REVIEW or CHANGES_REQUESTED (ERR_MODS_PENDING_REVIEW)"
          - "provisional_total_cents <= dealer.credit_limit_cents (ERR_DEALER_CREDIT_EXCEEDED)"
        side_effects:
          - "Compute per-line pricing (order_line_pricing variant provisional) and order provisional totals (order_provisional_totals)"
          - "Every line: status PENDING -> QUOTED"
          - "submitted_at := logical clock now"
          - "Increments Order.version by 1"

      - from: SUBMITTED
        to: IN_PRODUCTION
        trigger: "system (auto-evaluated after batch assign, sub-lot creation, or hold release)"
        actor: system
        preconditions:
          - "hold_status == NONE (no OrderHold in PLACED)"
          - "Every DOOR line has finish_batch_id != null"
          - "Every BOX line has slotted_qty == qty"
        side_effects:
          - "Increments Order.version by 1"

      - from: IN_PRODUCTION
        to: READY_TO_SHIP
        trigger: "system (auto-evaluated after batch QC release, sub-lot completion, or hold release)"
        actor: system
        preconditions:
          - "hold_status == NONE"
          - "Every line status == COMPLETED (DOOR: its batch RELEASED; BOX: all its sub-lots COMPLETE)"
        side_effects:
          - "Increments Order.version by 1"

      - from: READY_TO_SHIP
        to: SHIPPED
        trigger: "system (during POST /kcma/delivery-routes/{routeId}/dispatch of the order's route)"
        actor: system
        preconditions:
          - "order.delivery_route_id == the dispatched route"
        side_effects:
          - "Final pricing variant: final_merchandise_cents / final_discount_cents / freight_cents / grand_total_cents computed and frozen"
          - "Each line: final_net_cents computed; line status -> SHIPPED"
          - "shipped_at := logical clock now"
          - "Increments Order.version by 1"

      - from: DRAFT
        to: CANCELLED
        trigger: POST /kcma/orders/{orderId}/cancel
        actor: Dealer
        preconditions:
          - "Order in DRAFT or SUBMITTED (ERR_ORDER_NOT_CANCELLABLE)"
          - "Acting dealer owns the order (ERR_RESOURCE_OWNERSHIP_MISMATCH)"
        side_effects:
          - "All lines -> CANCELLED"
          - "All non-terminal ModificationRequests on the order's lines -> REJECTED (reviewer_note := 'ORDER_CANCELLED')"
          - "Increments Order.version by 1"

      - from: SUBMITTED
        to: CANCELLED
        trigger: POST /kcma/orders/{orderId}/cancel
        actor: Dealer
        preconditions:
          - "Order in DRAFT or SUBMITTED (ERR_ORDER_NOT_CANCELLABLE)"
          - "Acting dealer owns the order (ERR_RESOURCE_OWNERSHIP_MISMATCH)"
        side_effects:
          - "All lines -> CANCELLED"
          - "DOOR lines: finish_batch_id cleared; each affected batch recomputes assigned_door_count"
          - "BOX lines: all SCHEDULED SubLots covering them -> CANCELLED (assembly line load/window freed)"
          - "All non-terminal ModificationRequests -> REJECTED (reviewer_note := 'ORDER_CANCELLED')"
          - "All PLACED OrderHolds on this order -> RELEASED"
          - "If delivery_route_id set: order removed from route; route.reserved_cu_ft -= order.cube_ft; route.assigned_order_count -= 1; delivery_route_id := null"
          - "Increments Order.version by 1"

  - entity: OrderLine
    initial_state: PENDING
    terminal_states: [SHIPPED, CANCELLED]
    transitions:
      - from: PENDING
        to: QUOTED
        trigger: "system (order submit)"
        actor: system
        preconditions: []
        side_effects:
          - "provisional_net_cents computed (variant 1)"

      - from: QUOTED
        to: IN_PROGRESS
        trigger: "system — DOOR: batch assign sets finish_batch_id; BOX: first sub-lot created for the line"
        actor: system
        preconditions: []
        side_effects: []

      - from: IN_PROGRESS
        to: QUOTED
        trigger: "system — DOOR only: batch QC-fail cascade clears finish_batch_id"
        actor: system
        preconditions: []
        side_effects:
          - "OrderHold(FINISH_QC) PLACED on the line's order (see FinishBatch MIXING -> FAILED)"

      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "system — DOOR: its FinishBatch QC-releases (MIXING -> RELEASED); BOX: its last SCHEDULED sub-lot completes with slotted_qty == qty"
        actor: system
        preconditions: []
        side_effects:
          - "Re-evaluate order IN_PRODUCTION -> READY_TO_SHIP"

      - from: COMPLETED
        to: SHIPPED
        trigger: "system (route dispatch)"
        actor: system
        preconditions: []
        side_effects:
          - "final_net_cents computed (variant 2)"

      - from: PENDING
        to: CANCELLED
        trigger: "system (order cancel cascade)"
        actor: system
        preconditions: []
        side_effects: []

      - from: QUOTED
        to: CANCELLED
        trigger: "system (order cancel cascade)"
        actor: system
        preconditions: []
        side_effects:
          - "DOOR: finish_batch_id cleared; batch assigned_door_count recomputed"

      - from: IN_PROGRESS
        to: CANCELLED
        trigger: "system (order cancel cascade from SUBMITTED only; IN_PRODUCTION orders cannot cancel)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: ModificationRequest
    initial_state: UNDER_REVIEW
    terminal_states: [APPROVED, REJECTED]
    transitions:
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: POST /kcma/modifications/{modId}/review  (decision=APPROVE)
        actor: Engineer
        preconditions:
          - "Mod in UNDER_REVIEW (ERR_MOD_NOT_REVIEWABLE)"
        side_effects:
          - "reviewer_note := payload note"
          - "Line.mod_surcharge_cents recomputed (sum over APPROVED mods) — takes effect at next order pricing event"

      - from: UNDER_REVIEW
        to: REJECTED
        trigger: POST /kcma/modifications/{modId}/review  (decision=REJECT)
        actor: Engineer
        preconditions:
          - "Mod in UNDER_REVIEW (ERR_MOD_NOT_REVIEWABLE)"
        side_effects:
          - "reviewer_note := payload note"

      - from: UNDER_REVIEW
        to: CHANGES_REQUESTED
        trigger: POST /kcma/modifications/{modId}/review  (decision=REQUEST_CHANGES)
        actor: Engineer
        preconditions:
          - "Mod in UNDER_REVIEW (ERR_MOD_NOT_REVIEWABLE)"
        side_effects:
          - "reviewer_note := payload note"

      - from: CHANGES_REQUESTED
        to: UNDER_REVIEW
        trigger: POST /kcma/modifications/{modId}/resubmit
        actor: Dealer
        preconditions:
          - "Mod in CHANGES_REQUESTED (ERR_MOD_NOT_RESUBMITTABLE)"
          - "Acting dealer owns the parent order (ERR_RESOURCE_OWNERSHIP_MISMATCH)"
        side_effects:
          - "new_dimension_in := payload value; surcharge_cents recomputed via mod_surcharge"
          - "revision += 1"

  - entity: FinishBatch
    initial_state: MIXING
    terminal_states: [RELEASED]
    transitions:
      - from: MIXING
        to: RELEASED
        trigger: POST /kcma/finish-batches/{batchId}/qc-record
        actor: FinishSupervisor
        preconditions:
          - "Batch in MIXING (ERR_BATCH_NOT_MIXING)"
          - "|measured_delta_e| <= finish.delta_e_tolerance (batch_color_match) — else transitions to FAILED instead"
        side_effects:
          - "measured_delta_e := payload value"
          - "Every assigned DOOR line -> COMPLETED; each affected order re-evaluates READY_TO_SHIP"

      - from: MIXING
        to: FAILED
        trigger: POST /kcma/finish-batches/{batchId}/qc-record
        actor: FinishSupervisor
        preconditions:
          - "Batch in MIXING (ERR_BATCH_NOT_MIXING)"
          - "|measured_delta_e| > finish.delta_e_tolerance"
        side_effects:
          - "measured_delta_e := payload value"
          - "Cascade hop 1: every assigned DOOR line finish_batch_id := null; line IN_PROGRESS -> QUOTED; assigned_door_count recomputed (per line: -= line.qty)"
          - "Cascade hop 2: for each distinct affected order, OrderHold(FINISH_QC) PLACED -> order.hold_status := ON_HOLD"
          - "Cascade hop 3: ON_HOLD gates order auto-transitions (IN_PRODUCTION / READY_TO_SHIP) and route lock"

      - from: FAILED
        to: MIXING
        trigger: POST /kcma/finish-batches/{batchId}/remix
        actor: FinishSupervisor
        preconditions:
          - "Batch in FAILED (ERR_BATCH_NOT_REMIXABLE)"
        side_effects:
          - "measured_delta_e := null"
          - "remix_count += 1"

  - entity: NestingRun
    initial_state: DRAFT
    terminal_states: [RELEASED, CANCELLED]
    transitions:
      - from: DRAFT
        to: RELEASED
        trigger: POST /kcma/nesting-runs/{runId}/release
        actor: ProductionPlanner
        preconditions:
          - "Run in DRAFT (ERR_RUN_NOT_RELEASABLE)"
          - "Every door line's order is in SUBMITTED or IN_PRODUCTION (ERR_LINE_ORDER_NOT_RELEASED_TO_PRODUCTION)"
        side_effects:
          - "Hop 1: nesting_yield runs — Parts generated (one per door line, part_seq by height_in DESC, width_in DESC, line created_at ASC); sheets_required / utilization_pct / total_blank_area_in2 set"
          - "Hop 2: sheet Component.reserved_qty += sheets_required; available_qty recomputed"
          - "Hop 3: if available_qty < 0, for each distinct order owning the run's lines, OrderHold(COMPONENT_SHORTAGE, shortfall_qty = -available_qty) PLACED"
          - "Hop 4: each held order.hold_status := ON_HOLD, gating its IN_PRODUCTION / READY_TO_SHIP auto-transitions"
          - "Increments NestingRun.version by 1"

      - from: DRAFT
        to: CANCELLED
        trigger: POST /kcma/nesting-runs/{runId}/cancel
        actor: ProductionPlanner
        preconditions:
          - "Run in DRAFT (ERR_RUN_NOT_CANCELLABLE)"
        side_effects: []

  - entity: SubLot
    initial_state: SCHEDULED
    terminal_states: [COMPLETE, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: COMPLETE
        trigger: POST /kcma/sub-lots/{subLotId}/complete
        actor: ProductionPlanner
        preconditions:
          - "SubLot in SCHEDULED (ERR_SUB_LOT_NOT_COMPLETABLE)"
        side_effects:
          - "If covered BOX line now has all sub-lots COMPLETE and slotted_qty == qty: line -> COMPLETED; order re-evaluates READY_TO_SHIP"

      - from: SCHEDULED
        to: CANCELLED
        trigger: "system (order cancel cascade)"
        actor: system
        preconditions: []
        side_effects:
          - "Covered line slotted_qty recomputed (excludes CANCELLED sub-lots)"

  - entity: DeliveryRoute
    initial_state: PLANNED
    terminal_states: [DISPATCHED]
    transitions:
      - from: PLANNED
        to: LOCKED
        trigger: POST /kcma/delivery-routes/{routeId}/lock
        actor: ShippingCoordinator
        preconditions:
          - "Route in PLANNED (ERR_ROUTE_NOT_PLANNED)"
          - "assigned_order_count >= 1 (ERR_ROUTE_EMPTY)"
          - "No assigned order has hold_status == ON_HOLD (ERR_ORDER_ON_HOLD)"
        side_effects: []

      - from: LOCKED
        to: DISPATCHED
        trigger: POST /kcma/delivery-routes/{routeId}/dispatch
        actor: ShippingCoordinator
        preconditions:
          - "Route in LOCKED (ERR_ROUTE_NOT_LOCKED)"
          - "Every assigned order status == READY_TO_SHIP (ERR_ORDERS_NOT_READY_TO_SHIP)"
        side_effects:
          - "Every assigned order: READY_TO_SHIP -> SHIPPED with final pricing (order_final_totals variant + freight_consolidation)"
          - "route.reserved_cu_ft / assigned_order_count frozen at dispatch values"

  - entity: ReplacementClaim
    initial_state: SUBMITTED
    terminal_states: [APPROVED_NO_CHARGE, APPROVED_CHARGED, DENIED]
    transitions:
      - from: SUBMITTED
        to: APPROVED_NO_CHARGE
        trigger: POST /kcma/replacement-claims/{claimId}/adjudicate (decision=APPROVE)
        actor: PlantAdmin
        preconditions:
          - "Claim in SUBMITTED (ERR_CLAIM_NOT_ADJUDICATABLE)"
          - "claim_type in {FREIGHT_DAMAGE, MANUFACTURING_DEFECT} AND claim created within the type's window of the original order's shipped_at (FREIGHT 90 days, DEFECT 365 days) — else ERR_CLAIM_WARRANTY_EXPIRED"
        side_effects:
          - "final_credit_cents := credit_basis_cents; replacement_charge_cents := 0"

      - from: SUBMITTED
        to: APPROVED_CHARGED
        trigger: POST /kcma/replacement-claims/{claimId}/adjudicate (decision=APPROVE)
        actor: PlantAdmin
        preconditions:
          - "Claim in SUBMITTED (ERR_CLAIM_NOT_ADJUDICATABLE)"
          - "claim_type == DEALER_ERROR (no warranty window applies)"
        side_effects:
          - "final_credit_cents := 0; replacement_charge_cents := round_half_up(credit_basis_cents * 0.60)"

      - from: SUBMITTED
        to: DENIED
        trigger: POST /kcma/replacement-claims/{claimId}/adjudicate (decision=DENY)
        actor: PlantAdmin
        preconditions:
          - "Claim in SUBMITTED (ERR_CLAIM_NOT_ADJUDICATABLE)"
        side_effects:
          - "final_credit_cents := 0; replacement_charge_cents := 0"

  - entity: OrderHold
    initial_state: PLACED
    terminal_states: [RELEASED]
    transitions:
      - from: PLACED
        to: RELEASED
        trigger: "system — COMPONENT_SHORTAGE: on POST /kcma/components/{componentId}/receipts when the component's new available_qty >= 0, every PLACED shortage hold on that component releases; FINISH_QC: on batch assign when the held order's last unassigned DOOR line is assigned to a MIXING or RELEASED batch"
        actor: system
        preconditions: []
        side_effects:
          - "Order.hold_status recomputed; if NONE, pending auto-transitions (IN_PRODUCTION / READY_TO_SHIP) re-evaluated"

      - from: PLACED
        to: RELEASED
        trigger: POST /kcma/order-holds/{holdId}/release
        actor: PlantAdmin
        preconditions:
          - "Hold in PLACED (ERR_HOLD_NOT_RELEASABLE)"
        side_effects:
          - "Order.hold_status recomputed; if NONE, pending auto-transitions re-evaluated"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only; all other conflicts are state preconditions)
# =============================================================================
concurrency_rules:
  - rule_id: order-assign-stale-order
    parent_entity: Order
    write_endpoint: "POST /kcma/delivery-routes/{routeId}/assign-order"
    occ_field: expected_order_version
    description: |
      Assigning an order to a route carries expected_order_version equal to the
      Order.version the client last observed; if the order's version has since
      advanced (e.g. another assignment legitimately re-homed the order to a
      different route under the supersede rule, or a submit/cancel cascade
      bumped the version), the request is rejected as stale. Assignment to a
      route supersedes any prior route, so a second sequential assign with a
      current version would legitimately succeed — the version check is the
      only guard against acting on a stale view.
    error_id: ERR_STALE_ORDER_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# All money is integer cents; every rounding is round_half_up to whole cents.
# =============================================================================
calculations:
  - name: dealer_price_multiplier
    trigger: "order line pricing (submit/dispatch), replacement claim credit basis"
    algorithm: threshold
    formula: |
      multiplier = MULTIPLIERS[price_level]
      where price_level is Order.price_level_snapshot for order pricing and
      Dealer.price_level (current value at claim creation) for claim basis.
    input_set: "the single price_level value in scope"
    constants:
      L1: 0.60
      L2: 0.65
      L3: 0.70
      L4: 0.75
      L5: 0.80
    precision: "multiplier exact to 2dp; products rounded round_half_up to integer cents"

  - name: order_line_pricing
    trigger: "line creation (list/upcharge), order submit (provisional_net_cents), route dispatch (final_net_cents)"
    algorithm: aggregation
    formula: |
      line_list_cents       = unit_list_price_cents * qty
      finish_upcharge_cents = round_half_up(line_list_cents * finish_upcharge_pct_snapshot)
      mod_surcharge_cents   = sum(surcharge_cents of APPROVED ModificationRequests on this line)
      # VARIANT 1 (provisional, at submit): dealer multiplier discounts EVERYTHING
      provisional_net_cents = round_half_up((line_list_cents + finish_upcharge_cents + mod_surcharge_cents) * multiplier)
      # VARIANT 2 (final, at dispatch): surcharges are NOT discountable — multiplier on list only
      final_net_cents       = round_half_up(line_list_cents * multiplier) + finish_upcharge_cents + mod_surcharge_cents
    input_set: "all non-CANCELLED OrderLines of the order"
    constants: {}
    precision: "integer cents, round_half_up per line BEFORE summing (per-line rounding pinned; summing unrounded line values then rounding is forbidden)"
    variants:
      - name: provisional
        when: "POST /orders/{id}/submit"
        difference: "multiplier applied to (list + upcharge + mods)"
      - name: final
        when: "route dispatch"
        difference: "multiplier applied to list only; upcharge and mods charged at full value — for identical line data final > provisional whenever upcharge+mods > 0 and multiplier < 1"

  - name: order_provisional_totals
    trigger: "POST /orders/{id}/submit"
    algorithm: tiered_pricing
    formula: |
      provisional_merchandise_cents = sum(line.provisional_net_cents)      # per-line values already rounded
      tier = 0.08 if provisional_merchandise_cents >= TIER2_MIN_CENTS      # boundary: >=, exact hit qualifies
             else 0.05 if provisional_merchandise_cents >= TIER1_MIN_CENTS
             else 0
      provisional_discount_cents = round_half_up(provisional_merchandise_cents * tier)
      provisional_total_cents = provisional_merchandise_cents - provisional_discount_cents
    input_set: "the order's non-CANCELLED lines"
    constants:
      TIER1_MIN_CENTS: 5000000     # $50,000.00
      TIER2_MIN_CENTS: 10000000    # $100,000.00
    precision: "integer cents, round_half_up"

  - name: order_final_totals
    trigger: "route dispatch (per assigned order)"
    algorithm: tiered_pricing
    formula: |
      final_merchandise_cents = sum(line.final_net_cents)
      tier = 0.08 if final_merchandise_cents >= TIER2_MIN_CENTS
             else 0.05 if final_merchandise_cents >= TIER1_MIN_CENTS
             else 0
      final_discount_cents = round_half_up(final_merchandise_cents * tier)
    input_set: "the order's non-CANCELLED lines"
    constants:
      TIER1_MIN_CENTS: 5000000
      TIER2_MIN_CENTS: 10000000
    precision: "integer cents, round_half_up"

  - name: mod_surcharge
    trigger: "ModificationRequest creation and resubmit"
    algorithm: tiered_pricing
    formula: |
      delta_in = |new_dimension_in - current_dim|   # current_dim = line.depth_in for *_DEPTH, line.width_in for *_WIDTH;
                                                    # TOE_KICK_NOTCH and CUSTOM_BORE: delta_in = new_dimension_in
      tier_pct = 0.15 if delta_in >= 6 else 0.10 if delta_in >= 3 else 0.05
      raw = BASE_FEE_CENTS[mod_code] + round_half_up(line.line_list_cents * tier_pct)
      cap = round_half_up(line.line_list_cents * MAX_MOD_PCT)
      surcharge_cents = min(raw, cap)
    input_set: "the single OrderLine under modification (must be on a DRAFT order)"
    constants:
      BASE_FEE_CENTS: { REDUCED_DEPTH: 2500, INCREASED_DEPTH: 4000, REDUCED_WIDTH: 2500, INCREASED_WIDTH: 4000, TOE_KICK_NOTCH: 5500, CUSTOM_BORE: 3000 }
      MAX_MOD_PCT: 0.40
    precision: "integer cents, round_half_up; nested min() cap applied AFTER tiered raw fee — order pinned: base fee -> tiered pct -> min(cap)"

  - name: freight_consolidation
    trigger: "route dispatch (per assigned order, after final merchandise totals)"
    algorithm: tiered_pricing
    formula: |
      # Circular-looking dependency pinned to this exact evaluation order:
      # (1) order cube -> (2) base freight from cube -> (3) consolidation tier from
      # route.assigned_order_count AT THE DISPATCH INSTANT -> (4) freight -> (5) grand total.
      # The tier depends on the route's order count, which includes this order —
      # count is read once at dispatch and is identical for all orders on the route.
      base_freight_cents = max(FLAT_MIN_CENTS, round_half_up(order.cube_ft * RATE_PER_CU_FT_CENTS))
      cons_pct = 0.15 if route.assigned_order_count >= CONS_TIER2_COUNT else 0.10 if route.assigned_order_count >= CONS_TIER1_COUNT else 0
      freight_cents = round_half_up(base_freight_cents * (1 - cons_pct))
      grand_total_cents = final_merchandise_cents - final_discount_cents + freight_cents
    input_set: "the dispatched route and each assigned order"
    constants:
      FLAT_MIN_CENTS: 8500
      RATE_PER_CU_FT_CENTS: 450
      CONS_TIER1_COUNT: 3
      CONS_TIER2_COUNT: 5
    precision: "integer cents, round_half_up; cube_ft itself is 2dp round_half_up per order_cube"

  - name: order_cube
    trigger: "line creation / cancel; used by route assign capacity check and freight"
    algorithm: aggregation
    formula: |
      per line: line_cube_ft = round_half_up(width_in * height_in * depth_in * qty / 1728, 2)
      order.cube_ft = round_half_up(sum(line_cube_ft over non-CANCELLED lines), 2)
    input_set: "the order's non-CANCELLED lines"
    constants:
      CUBIC_IN_PER_CU_FT: 1728
    precision: "2 decimal places, round_half_up, per line then summed"

  - name: nesting_yield
    trigger: "POST /nesting-runs/{id}/release"
    algorithm: aggregation
    formula: |
      total_blank_area_in2 = sum(line.width_in * line.height_in * line.qty) over run.door_line_ids
      sheet_area = component.sheet_width_in * component.sheet_height_in
      sheets_required = ceil(total_blank_area_in2 * (1 + WASTE_PCT) / sheet_area)   # ceil boundary: exact multiple -> no extra sheet
      utilization_pct = round_half_up(100 * total_blank_area_in2 / (sheets_required * sheet_area), 2)
      parts: one Part per door line; part_seq assigned by height_in DESC, width_in DESC, order_line.created_at ASC (never id)
    input_set: "run.door_line_ids (each must be line_type == DOOR on a SUBMITTED or IN_PRODUCTION order)"
    constants:
      WASTE_PCT: 0.12
    precision: "area integer in2; sheets integer via ceil; utilization 2dp round_half_up"

  - name: sublot_work_minutes
    trigger: "POST /sub-lots"
    algorithm: aggregation
    formula: |
      work_minutes = qty * line.standard_minutes_per_box + line.setup_minutes_per_sub_lot
      end_minute = start_minute + work_minutes     # must be <= 1440 else ERR_INVALID_TIME_WINDOW
      line_day_load = sum(work_minutes over non-CANCELLED SubLots on same assembly_line_id + scheduled_date) + this work_minutes
      require line_day_load <= line.capacity_minutes_per_day   # boundary: exact equality ALLOWED
    input_set: "non-CANCELLED SubLots of the same (assembly_line_id, scheduled_date)"
    constants: {}
    precision: "integer minutes"

  - name: batch_color_match
    trigger: "POST /finish-batches/{id}/qc-record"
    algorithm: threshold
    formula: |
      pass iff abs(measured_delta_e) <= batch.finish.delta_e_tolerance
      # boundary pinned: deviation EXACTLY equal to tolerance PASSES (<=)
    input_set: "the FinishBatch and its FinishSpec"
    constants: {}
    precision: "delta_e compared as given (2dp inputs); no rounding applied to the comparison"

  - name: claim_credit
    trigger: "claim creation (provisional), adjudication (final)"
    algorithm: threshold
    formula: |
      credit_basis_cents = round_half_up(original_line.unit_list_price_cents * dealer_multiplier(dealer.price_level at creation) * qty)
      provisional_credit_cents = round_half_up(credit_basis_cents * PROVISIONAL_PCT)   # flat estimate, ignores claim_type
      # Final at adjudication (APPROVE):
      #   FREIGHT_DAMAGE within FREIGHT_WINDOW_DAYS of order.shipped_at  -> credit = basis, charge = 0
      #   MANUFACTURING_DEFECT within DEFECT_WINDOW_DAYS of shipped_at   -> credit = basis, charge = 0
      #   DEALER_ERROR (no window)                                       -> credit = 0, charge = round_half_up(basis * DEALER_ERROR_CHARGE_PCT)
      #   out-of-window freight/defect APPROVE                           -> rejected ERR_CLAIM_WARRANTY_EXPIRED
    input_set: "the claim, its original DOOR OrderLine, the original order's shipped_at, and the logical clock"
    constants:
      PROVISIONAL_PCT: 0.50
      DEALER_ERROR_CHARGE_PCT: 0.60
      FREIGHT_WINDOW_DAYS: 90
      DEFECT_WINDOW_DAYS: 365
    precision: "integer cents, round_half_up; windows compared in whole days against the logical clock"
    variants:
      - name: provisional
        when: "claim creation"
        difference: "flat 50% of basis regardless of claim_type or window"
      - name: final
        when: "adjudication"
        difference: "0%, 100%, or -60%-charge depending on claim_type and warranty window — for identical claim data provisional != final whenever final is 0% or 100%"

  - name: component_availability
    trigger: "component creation, receipt, nesting run release"
    algorithm: aggregation
    formula: |
      available_qty = on_hand_qty - reserved_qty     # may go negative
      On release: reserved_qty += run.sheets_required; if resulting available_qty < 0,
        place OrderHold(COMPONENT_SHORTAGE, shortfall_qty = -available_qty) on each
        distinct order owning the run's door lines (skipping orders already holding a
        PLACED COMPONENT_SHORTAGE hold on this component).
      On receipt: on_hand_qty += qty; recompute; if available_qty >= 0, release every
        PLACED COMPONENT_SHORTAGE hold referencing this component.
    input_set: "single Component; affected orders derived via Part/OrderLine links of the triggering run"
    constants: {}
    precision: "integer quantities"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority — lower number wins when a
# request violates several rules)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present; X-User-Role is a declared role name"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: all

  - priority: 2
    category: auth
    check: "Role is permitted for this endpoint per §1.5 roles"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: auth
    check: "Entity-backed ownership: acting Dealer's X-User-ID equals the target resource's dealer_id (order submit/cancel, line creation, mod creation/resubmit, claim creation against own orders only)"
    error_id: ERR_RESOURCE_OWNERSHIP_MISMATCH
    http_status: 403
    applies_to: "POST /orders/{id}/lines, /submit, /cancel; POST /order-lines/{id}/modifications; POST /modifications/{id}/resubmit; POST /replacement-claims"

  - priority: 4
    category: existence
    check: "Path-templated resource ids exist (validated left-to-right)"
    error_id: "ERR_{RESOURCE}_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path ids"

  - priority: 5
    category: existence
    check: "Body foreign keys exist (door_style_id, finish_id, order_line_id, assembly_line_id, station_id, sheet_component_id, order_id, original_order_line_id)"
    error_id: "ERR_{RESOURCE}_NOT_FOUND"
    http_status: 404
    applies_to: "creation/action endpoints with body FKs"

  - priority: 6
    category: state
    check: "Target resource in required state for the operation (order DRAFT for line add/mod create/submit, mod UNDER_REVIEW for review, batch MIXING for assign/qc-record, run DRAFT for release/cancel, route PLANNED for assign/lock, route LOCKED for dispatch, sub-lot SCHEDULED for complete, hold PLACED for release, claim SUBMITTED for adjudicate, order DRAFT|SUBMITTED for cancel, batch-assign target line must be a QUOTED unassigned DOOR line (ERR_LINE_NOT_ASSIGNABLE), assign-order target order must be SUBMITTED|IN_PRODUCTION|READY_TO_SHIP (ERR_ORDER_NOT_ROUTE_ASSIGNABLE), sub-lot creation requires the line's order SUBMITTED or IN_PRODUCTION and nesting-run creation/release requires door lines' orders SUBMITTED or IN_PRODUCTION (ERR_LINE_ORDER_NOT_RELEASED_TO_PRODUCTION))"
    error_id: "state-specific errors (ERR_ORDER_NOT_SUBMITTABLE, ERR_MOD_NOT_REVIEWABLE, ERR_BATCH_NOT_MIXING, ERR_RUN_NOT_RELEASABLE, ERR_ROUTE_NOT_PLANNED, ERR_ROUTE_NOT_LOCKED, ERR_SUB_LOT_NOT_COMPLETABLE, ERR_HOLD_NOT_RELEASABLE, ERR_CLAIM_NOT_ADJUDICATABLE, ERR_ORDER_NOT_CANCELLABLE, ERR_MOD_NOT_RESUBMITTABLE, ERR_BATCH_NOT_REMIXABLE, ERR_RUN_NOT_CANCELLABLE, ERR_LINE_ORDER_NOT_RELEASED_TO_PRODUCTION, ERR_LINE_NOT_ASSIGNABLE, ERR_ORDER_NOT_ROUTE_ASSIGNABLE)"
    http_status: 409
    applies_to: "all action endpoints"

  - priority: 7
    category: state
    check: "Cross-entity state gates: order submit blocked while any mod on its lines is UNDER_REVIEW or CHANGES_REQUESTED (ERR_MODS_PENDING_REVIEW); route lock blocked while any assigned order is ON_HOLD (ERR_ORDER_ON_HOLD); route dispatch blocked unless every assigned order is READY_TO_SHIP (ERR_ORDERS_NOT_READY_TO_SHIP)"
    error_id: "ERR_MODS_PENDING_REVIEW | ERR_ORDER_ON_HOLD | ERR_ORDERS_NOT_READY_TO_SHIP"
    http_status: 409
    applies_to: "POST /orders/{id}/submit, POST /delivery-routes/{id}/lock, POST /delivery-routes/{id}/dispatch"

  - priority: 8
    category: business_referential
    check: "Referenced catalog/config resources must be active: door style active for new DOOR lines (ERR_DOOR_STYLE_INACTIVE), finish active for new lines and new batches (ERR_FINISH_INACTIVE), assembly line active for new sub-lots (ERR_ASSEMBLY_LINE_INACTIVE), nesting station active for new runs (ERR_STATION_INACTIVE)"
    error_id: "ERR_DOOR_STYLE_INACTIVE | ERR_FINISH_INACTIVE | ERR_ASSEMBLY_LINE_INACTIVE | ERR_STATION_INACTIVE"
    http_status: 422
    applies_to: "POST /orders/{id}/lines, POST /finish-batches, POST /sub-lots, POST /nesting-runs"

  - priority: 9
    category: business_constraint
    check: "Shape/type constraints: DOOR line requires door_style_id and depth_in == 1; BOX line forbids door_style_id and required_sheen_lot_no (ERR_WRONG_LINE_TYPE); nesting run door_line_ids must all reference DOOR lines and sheet_component_id must reference kind == SHEET_GOODS (ERR_COMPONENT_KIND_MISMATCH); claim original_order_line_id must be a DOOR line on a SHIPPED order owned by the claimant and claim qty <= original line qty (ERR_CLAIM_LINE_NOT_ELIGIBLE); sub-lot order_line_id must be a BOX line (ERR_WRONG_LINE_TYPE)"
    error_id: "ERR_WRONG_LINE_TYPE | ERR_COMPONENT_KIND_MISMATCH | ERR_CLAIM_LINE_NOT_ELIGIBLE"
    http_status: 422
    applies_to: "POST /orders/{id}/lines, POST /nesting-runs, POST /replacement-claims, POST /sub-lots"

  - priority: 10
    category: business_constraint
    check: "Batch assignment compatibility, evaluated in this written order: (1) line.finish_id == batch.finish_id (ERR_FINISH_MISMATCH); (2) sheen lot rule — if the line's required_sheen_lot_no is set it must equal batch.sheen_lot_no (ERR_SHEEN_LOT_MISMATCH); (3) batch.assigned_door_count + line.qty <= batch.capacity_doors (ERR_BATCH_CAPACITY_EXCEEDED)"
    error_id: "ERR_FINISH_MISMATCH | ERR_SHEEN_LOT_MISMATCH | ERR_BATCH_CAPACITY_EXCEEDED"
    http_status: 422
    applies_to: "POST /finish-batches/{id}/assign"

  - priority: 11
    category: business_temporal
    check: "Interval occupation: sub-lot [start_minute, end_minute) must not half-open-overlap any non-CANCELLED sub-lot on same line+date — adjacency (start == other.end or end == other.start) is ALLOWED (ERR_LINE_WINDOW_OVERLAP); nesting run window must clear every other DRAFT/RELEASED run on same station+date by the station's changeover buffer — new.start >= other.end + changeover OR new.end + changeover <= other.start (ERR_STATION_WINDOW_OVERLAP); aggregate line-day load <= capacity (ERR_LINE_CAPACITY_EXCEEDED); scheduled/route dates must not be before the logical clock's current date (ERR_SCHEDULE_DATE_IN_PAST)"
    error_id: "ERR_LINE_WINDOW_OVERLAP | ERR_STATION_WINDOW_OVERLAP | ERR_LINE_CAPACITY_EXCEEDED | ERR_SCHEDULE_DATE_IN_PAST"
    http_status: 409
    applies_to: "POST /sub-lots, POST /nesting-runs, POST /delivery-routes"

  - priority: 12
    category: business_temporal
    check: "Claim warranty window at adjudication: APPROVE of FREIGHT_DAMAGE allowed only within 90 days of original order shipped_at; APPROVE of MANUFACTURING_DEFECT only within 365 days (boundary: exactly N days after shipped_at is WITHIN the window)"
    error_id: ERR_CLAIM_WARRANTY_EXPIRED
    http_status: 422
    applies_to: "POST /replacement-claims/{id}/adjudicate"

  - priority: 13
    category: business_fiscal
    check: "Capacity/fiscal ceilings: route reserved_cu_ft + order.cube_ft <= capacity_cu_ft (ERR_ROUTE_CUBE_EXCEEDED); order provisional_total_cents <= dealer.credit_limit_cents at submit (ERR_DEALER_CREDIT_EXCEEDED); sub-lot qty <= order_line.qty - slotted_qty (ERR_SUB_LOT_QTY_EXCEEDS_LINE)"
    error_id: "ERR_ROUTE_CUBE_EXCEEDED | ERR_DEALER_CREDIT_EXCEEDED | ERR_SUB_LOT_QTY_EXCEEDS_LINE"
    http_status: 402
    applies_to: "POST /delivery-routes/{id}/assign-order, POST /orders/{id}/submit, POST /sub-lots"

  - priority: 14
    category: business_constraint
    check: "Field-level sanity: required fields present; enum values valid (ERR_INVALID_ENUM); integers in range; qty > 0 (ERR_INVALID_QUANTITY); end_minute within day / end > start (ERR_INVALID_TIME_WINDOW); unique codes (dealer_code, style_code, finish_code, sku, station_code, line_code, route_code) (ERR_DUPLICATE_CODE)"
    error_id: "ERR_VALIDATION | ERR_INVALID_ENUM | ERR_INVALID_QUANTITY | ERR_INVALID_TIME_WINDOW | ERR_DUPLICATE_CODE"
    http_status: 400
    applies_to: all

# =============================================================================
# §1.5 API Endpoint Table
# All paths are relative to api_prefix /kcma.
# GET roles list all six roles; read access is shared, mutations are peer-scoped.
# =============================================================================
endpoints:
  # --- Dealers ---
  - method: POST
    path: "/kcma/dealers"
    description: "Register a dealer with network price level and credit limit"
    roles: [PlantAdmin]
    code: 201
    input: [name, dealer_code, price_level, credit_limit_cents]
    output: Dealer
    side_effects: ["status n/a; dealer_code uniqueness enforced (ERR_DUPLICATE_CODE)"]

  - method: PUT
    path: "/kcma/dealers/{dealerId}"
    description: "Update dealer credit limit and/or price level (existing orders keep their price_level_snapshot)"
    roles: [PlantAdmin]
    code: 200
    input: ["credit_limit_cents?", "price_level?"]
    output: Dealer
    side_effects: ["increments Dealer.version by 1"]

  - method: GET
    path: "/kcma/dealers"
    description: "List dealers"
    roles: [PlantAdmin, Dealer, Engineer, FinishSupervisor, ProductionPlanner, ShippingCoordinator]
    code: 200
    input: ["limit?", "offset?", "price_level?"]
    output: "Dealer[]"
    side_effects: []

  # --- Catalog: door styles & finishes ---
  - method: POST
    path: "/kcma/door-styles"
    description: "Create a door style catalog entry"
    roles: [PlantAdmin]
    code: 201
    input: [style_code, name, construction, base_list_price_cents, "active?"]
    output: DoorStyle
    side_effects: []

  - method: GET
    path: "/kcma/door-styles"
    description: "List door styles"
    roles: [PlantAdmin, Dealer, Engineer, FinishSupervisor, ProductionPlanner, ShippingCoordinator]
    code: 200
    input: ["limit?", "offset?", "active?"]
    output: "DoorStyle[]"
    side_effects: []

  - method: POST
    path: "/kcma/finish-specs"
    description: "Create a finish catalog entry (color + sheen + upcharge + delta-E tolerance)"
    roles: [PlantAdmin]
    code: 201
    input: [finish_code, color_name, sheen, upcharge_pct, "delta_e_tolerance?", "active?"]
    output: FinishSpec
    side_effects: ["delta_e_tolerance defaults to 1.5 when omitted"]

  - method: GET
    path: "/kcma/finish-specs"
    description: "List finish specs"
    roles: [PlantAdmin, Dealer, Engineer, FinishSupervisor, ProductionPlanner, ShippingCoordinator]
    code: 200
    input: ["limit?", "offset?", "active?", "sheen?"]
    output: "FinishSpec[]"
    side_effects: []

  # --- Components / inventory ---
  - method: POST
    path: "/kcma/components"
    description: "Create an inventory component"
    roles: [PlantAdmin]
    code: 201
    input: [sku, description, kind, "sheet_width_in?", "sheet_height_in?", on_hand_qty, "reorder_level?"]
    output: Component
    side_effects: ["reserved_qty := 0; available_qty := on_hand_qty"]

  - method: GET
    path: "/kcma/components"
    description: "List components"
    roles: [PlantAdmin, Dealer, Engineer, FinishSupervisor, ProductionPlanner, ShippingCoordinator]
    code: 200
    input: ["limit?", "offset?", "kind?"]
    output: "Component[]"
    side_effects: []

  - method: GET
    path: "/kcma/components/{componentId}"
    description: "Get one component (includes computed available_qty)"
    roles: [PlantAdmin, Dealer, Engineer, FinishSupervisor, ProductionPlanner, ShippingCoordinator]
    code: 200
    input: []
    output: Component
    side_effects: []

  - method: POST
    path: "/kcma/components/{componentId}/receipts"
    description: "Receive stock; auto-releases PLACED COMPONENT_SHORTAGE holds on this component when available_qty recovers to >= 0"
    roles: [ProductionPlanner]
    code: 200
    input: [qty]
    output: Component
    side_effects:
      - "on_hand_qty += qty; available_qty recomputed (component_availability)"
      - "if available_qty >= 0: every PLACED COMPONENT_SHORTAGE OrderHold on this component -> RELEASED"
      - "each affected order's hold_status recomputed; pending auto-transitions (IN_PRODUCTION / READY_TO_SHIP) re-evaluated"
      - "increments Component.version by 1"

  - method: GET
    path: "/kcma/components/{id}/holds"
    description: "List shortage holds referencing this component"
    roles: [PlantAdmin, Dealer, Engineer, FinishSupervisor, ProductionPlanner, ShippingCoordinator]
    code: 200
    input: ["limit?", "offset?"]
    output: "OrderHold[]"
    side_effects: []

  # --- Orders ---
  - method: POST
    path: "/kcma/orders"
    description: "Create a DRAFT order for the acting dealer (dealer_id := X-User-ID; price_level_snapshot copied from dealer)"
    roles: [Dealer]
    code: 201
    input: []
    output: Order
    side_effects: ["status = DRAFT; hold_status = NONE; cube_ft = 0; version = 1"]

  - method: GET
    path: "/kcma/orders"
    description: "List orders with filters"
    roles: [PlantAdmin, Dealer, Engineer, FinishSupervisor, ProductionPlanner, ShippingCoordinator]
    code: 200
    input: ["limit?", "offset?", "dealer_id?", "delivery_route_id?", "status?"]
    output: "Order[]"
    side_effects: []

  - method: GET
    path: "/kcma/orders/{orderId}"
    description: "Get one order (pricing fields, hold_status, route linkage)"
    roles: [PlantAdmin, Dealer, Engineer, FinishSupervisor, ProductionPlanner, ShippingCoordinator]
    code: 200
    input: []
    output: Order
    side_effects: []

  - method: POST
    path: "/kcma/orders/{orderId}/lines"
    description: "Add a BOX or DOOR line to a DRAFT order; snapshots finish upcharge; computes line list/upcharge/cube"
    roles: [Dealer]
    code: 201
    input: [line_type, "door_style_id?", finish_id, width_in, height_in, depth_in, qty, unit_list_price_cents, "required_sheen_lot_no?"]
    output: OrderLine
    side_effects:
      - "finish_upcharge_pct_snapshot := FinishSpec.upcharge_pct"
      - "line_list_cents, finish_upcharge_cents computed (order_line_pricing)"
      - "order.cube_ft recomputed (order_cube)"
      - "line status = PENDING"

  - method: GET
    path: "/kcma/orders/{id}/holds"
    description: "List holds on an order"
    roles: [PlantAdmin, Dealer, Engineer, FinishSupervisor, ProductionPlanner, ShippingCoordinator]
    code: 200
    input: ["limit?", "offset?"]
    output: "OrderHold[]"
    side_effects: []

  - method: POST
    path: "/kcma/orders/{orderId}/submit"
    description: "Submit a DRAFT order: runs provisional pricing variant, volume discount, credit check, mod-review gate"
    roles: [Dealer]
    code: 200
    input: []
    output: Order
    side_effects:
      - "order_provisional_totals computed and stored"
      - "every line PENDING -> QUOTED; provisional_net_cents set"
      - "submitted_at := logical clock now"
      - "increments Order.version by 1"

  - method: POST
    path: "/kcma/orders/{orderId}/cancel"
    description: "Cancel a DRAFT or SUBMITTED order with full compensation cascade"
    roles: [Dealer]
    code: 200
    input: []
    output: Order
    side_effects:
      - "lines -> CANCELLED; door lines unassigned from batches (assigned_door_count recomputed)"
      - "SCHEDULED sub-lots -> CANCELLED; PLACED holds -> RELEASED; open mods -> REJECTED"
      - "route unassignment if assigned (reserved_cu_ft and assigned_order_count decremented)"
      - "increments Order.version by 1"

  # --- Order lines (flat access + reverse reachability) ---
  - method: GET
    path: "/kcma/order-lines"
    description: "List order lines with FK filters"
    roles: [PlantAdmin, Dealer, Engineer, FinishSupervisor, ProductionPlanner, ShippingCoordinator]
    code: 200
    input: ["limit?", "offset?", "order_id?", "door_style_id?", "finish_id?", "finish_batch_id?"]
    output: "OrderLine[]"
    side_effects: []

  - method: GET
    path: "/kcma/order-lines/{lineId}"
    description: "Get one order line"
    roles: [PlantAdmin, Dealer, Engineer, FinishSupervisor, ProductionPlanner, ShippingCoordinator]
    code: 200
    input: []
    output: OrderLine
    side_effects: []

  # --- Modifications (mod pricing & engineering review) ---
  - method: POST
    path: "/kcma/order-lines/{id}/modifications"
    description: "Request a modification on a line of a DRAFT order; surcharge computed immediately (mod_surcharge)"
    roles: [Dealer]
    code: 201
    input: [mod_code, new_dimension_in]
    output: ModificationRequest
    side_effects: ["surcharge_cents computed; status = UNDER_REVIEW; revision = 1"]

  - method: GET
    path: "/kcma/order-lines/{id}/modifications"
    description: "List modification requests for a line"
    roles: [PlantAdmin, Dealer, Engineer, FinishSupervisor, ProductionPlanner, ShippingCoordinator]
    code: 200
    input: ["limit?", "offset?"]
    output: "ModificationRequest[]"
    side_effects: []

  - method: POST
    path: "/kcma/modifications/{modId}/review"
    description: "Engineering review decision: APPROVE | REQUEST_CHANGES | REJECT"
    roles: [Engineer]
    code: 200
    input: [decision, "note?"]
    output: ModificationRequest
    side_effects: ["status transition per decision; on APPROVE the line's mod_surcharge_cents becomes effective at next pricing event"]

  - method: POST
    path: "/kcma/modifications/{modId}/resubmit"
    description: "Dealer resubmits a CHANGES_REQUESTED mod with a revised dimension (cycle back to UNDER_REVIEW)"
    roles: [Dealer]
    code: 200
    input: [new_dimension_in]
    output: ModificationRequest
    side_effects: ["surcharge_cents recomputed; revision += 1; status -> UNDER_REVIEW"]

  # --- Finish batches (color match & sheen lot) ---
  - method: POST
    path: "/kcma/finish-batches"
    description: "Mix a finish batch for a finish spec with a sheen lot number and door capacity"
    roles: [FinishSupervisor]
    code: 201
    input: [finish_id, sheen_lot_no, capacity_doors]
    output: FinishBatch
    side_effects: ["status = MIXING; assigned_door_count = 0; remix_count = 0"]

  - method: GET
    path: "/kcma/finish-batches"
    description: "List finish batches"
    roles: [PlantAdmin, Dealer, Engineer, FinishSupervisor, ProductionPlanner, ShippingCoordinator]
    code: 200
    input: ["limit?", "offset?", "finish_id?", "status?"]
    output: "FinishBatch[]"
    side_effects: []

  - method: GET
    path: "/kcma/finish-batches/{batchId}"
    description: "Get one finish batch"
    roles: [PlantAdmin, Dealer, Engineer, FinishSupervisor, ProductionPlanner, ShippingCoordinator]
    code: 200
    input: []
    output: FinishBatch
    side_effects: []

  - method: POST
    path: "/kcma/finish-batches/{batchId}/qc-record"
    description: "Record measured Delta-E; |delta_e| <= tolerance -> RELEASED (assigned lines COMPLETED), else -> FAILED (unassign cascade + FINISH_QC holds)"
    roles: [FinishSupervisor]
    code: 200
    input: [measured_delta_e]
    output: FinishBatch
    side_effects:
      - "batch_color_match threshold decides RELEASED vs FAILED"
      - "RELEASED: assigned DOOR lines -> COMPLETED; orders re-evaluate READY_TO_SHIP"
      - "FAILED: assigned lines unassigned (finish_batch_id := null, -> QUOTED); FINISH_QC holds PLACED on affected orders"

  - method: POST
    path: "/kcma/finish-batches/{batchId}/assign"
    description: "Assign a QUOTED unassigned DOOR order line to a MIXING batch (finish match, sheen lot match, capacity — checked in that order)"
    roles: [FinishSupervisor]
    code: 200
    input: [order_line_id]
    output: FinishBatch
    side_effects:
      - "line.finish_batch_id := batch; line QUOTED -> IN_PROGRESS; assigned_door_count += line.qty"
      - "if assigning the held order's last unassigned DOOR line: its PLACED FINISH_QC holds -> RELEASED; order auto-transitions re-evaluated"

  - method: POST
    path: "/kcma/finish-batches/{batchId}/remix"
    description: "Remix a FAILED batch back to MIXING (measured_delta_e cleared, remix_count += 1)"
    roles: [FinishSupervisor]
    code: 200
    input: []
    output: FinishBatch
    side_effects: ["status FAILED -> MIXING"]

  # --- Nesting stations & runs (nested part generation) ---
  - method: POST
    path: "/kcma/nesting-stations"
    description: "Create a CNC nesting station with changeover buffer"
    roles: [PlantAdmin]
    code: 201
    input: [station_code, changeover_minutes, "active?"]
    output: NestingStation
    side_effects: []

  - method: GET
    path: "/kcma/nesting-stations"
    description: "List nesting stations"
    roles: [PlantAdmin, Dealer, Engineer, FinishSupervisor, ProductionPlanner, ShippingCoordinator]
    code: 200
    input: ["limit?", "offset?"]
    output: "NestingStation[]"
    side_effects: []

  - method: POST
    path: "/kcma/nesting-runs"
    description: "Create a DRAFT nesting run over door lines on a station (changeover-buffer window check)"
    roles: [ProductionPlanner]
    code: 201
    input: [station_id, sheet_component_id, door_line_ids, scheduled_date, start_minute, end_minute]
    output: NestingRun
    side_effects: ["status = DRAFT; window validated against station changeover buffer (ERR_STATION_WINDOW_OVERLAP)"]

  - method: GET
    path: "/kcma/nesting-runs"
    description: "List nesting runs"
    roles: [PlantAdmin, Dealer, Engineer, FinishSupervisor, ProductionPlanner, ShippingCoordinator]
    code: 200
    input: ["limit?", "offset?", "station_id?", "sheet_component_id?"]
    output: "NestingRun[]"
    side_effects: []

  - method: GET
    path: "/kcma/nesting-runs/{runId}"
    description: "Get one nesting run"
    roles: [PlantAdmin, Dealer, Engineer, FinishSupervisor, ProductionPlanner, ShippingCoordinator]
    code: 200
    input: []
    output: NestingRun
    side_effects: []

  - method: POST
    path: "/kcma/nesting-runs/{runId}/release"
    description: "Release a DRAFT run: generate parts, reserve sheets, place shortage holds on overdraft"
    roles: [ProductionPlanner]
    code: 200
    input: []
    output: NestingRun
    side_effects:
      - "nesting_yield: parts generated with deterministic part_seq; sheets_required / utilization_pct set"
      - "sheet component reserved_qty += sheets_required; available_qty recomputed"
      - "available_qty < 0 -> COMPONENT_SHORTAGE holds on each distinct owning order (component_availability)"
      - "increments NestingRun.version by 1"

  - method: POST
    path: "/kcma/nesting-runs/{runId}/cancel"
    description: "Cancel a DRAFT run (frees the station window)"
    roles: [ProductionPlanner]
    code: 200
    input: []
    output: NestingRun
    side_effects: ["status -> CANCELLED"]

  - method: GET
    path: "/kcma/parts"
    description: "List generated parts with FK filters"
    roles: [PlantAdmin, Dealer, Engineer, FinishSupervisor, ProductionPlanner, ShippingCoordinator]
    code: 200
    input: ["limit?", "offset?", "nesting_run_id?", "component_id?", "order_line_id?"]
    output: "Part[]"
    side_effects: []

  - method: GET
    path: "/kcma/parts/{partId}"
    description: "Get one part"
    roles: [PlantAdmin, Dealer, Engineer, FinishSupervisor, ProductionPlanner, ShippingCoordinator]
    code: 200
    input: []
    output: Part
    side_effects: []

  # --- Assembly lines & sub-lots (box line balance) ---
  - method: POST
    path: "/kcma/assembly-lines"
    description: "Create an assembly line with daily capacity, per-box minutes, and per-sub-lot setup"
    roles: [PlantAdmin]
    code: 201
    input: [line_code, capacity_minutes_per_day, standard_minutes_per_box, setup_minutes_per_sub_lot, "active?"]
    output: AssemblyLine
    side_effects: []

  - method: GET
    path: "/kcma/assembly-lines"
    description: "List assembly lines"
    roles: [PlantAdmin, Dealer, Engineer, FinishSupervisor, ProductionPlanner, ShippingCoordinator]
    code: 200
    input: ["limit?", "offset?"]
    output: "AssemblyLine[]"
    side_effects: []

  - method: POST
    path: "/kcma/sub-lots"
    description: "Schedule a sub-lot covering qty boxes of a BOX line on a line+date window (half-open overlap + aggregate capacity checks)"
    roles: [ProductionPlanner]
    code: 201
    input: [order_line_id, assembly_line_id, scheduled_date, start_minute, qty]
    output: SubLot
    side_effects:
      - "work_minutes and end_minute computed (sublot_work_minutes)"
      - "line slotted_qty += qty; BOX line QUOTED -> IN_PROGRESS on first sub-lot"
      - "if line now fully slotted and all door lines assigned: order re-evaluates SUBMITTED -> IN_PRODUCTION"

  - method: GET
    path: "/kcma/sub-lots"
    description: "List sub-lots with FK filters"
    roles: [PlantAdmin, Dealer, Engineer, FinishSupervisor, ProductionPlanner, ShippingCoordinator]
    code: 200
    input: ["limit?", "offset?", "order_id?", "order_line_id?", "assembly_line_id?"]
    output: "SubLot[]"
    side_effects: []

  - method: GET
    path: "/kcma/sub-lots/{subLotId}"
    description: "Get one sub-lot"
    roles: [PlantAdmin, Dealer, Engineer, FinishSupervisor, ProductionPlanner, ShippingCoordinator]
    code: 200
    input: []
    output: SubLot
    side_effects: []

  - method: POST
    path: "/kcma/sub-lots/{subLotId}/complete"
    description: "Mark a sub-lot complete; may complete its BOX line and advance the order to READY_TO_SHIP"
    roles: [ProductionPlanner]
    code: 200
    input: []
    output: SubLot
    side_effects: ["status -> COMPLETE; covered line and order re-evaluated"]

  # --- Replacement claims (damage/replacement door program) ---
  - method: POST
    path: "/kcma/replacement-claims"
    description: "Dealer files a damage/replacement claim against a DOOR line of own SHIPPED order; provisional credit estimated"
    roles: [Dealer]
    code: 201
    input: [original_order_line_id, claim_type, qty]
    output: ReplacementClaim
    side_effects: ["credit_basis_cents and provisional_credit_cents computed (claim_credit provisional variant); status = SUBMITTED"]

  - method: GET
    path: "/kcma/replacement-claims"
    description: "List replacement claims"
    roles: [PlantAdmin, Dealer, Engineer, FinishSupervisor, ProductionPlanner, ShippingCoordinator]
    code: 200
    input: ["limit?", "offset?", "dealer_id?", "original_order_line_id?"]
    output: "ReplacementClaim[]"
    side_effects: []

  - method: GET
    path: "/kcma/replacement-claims/{claimId}"
    description: "Get one replacement claim"
    roles: [PlantAdmin, Dealer, Engineer, FinishSupervisor, ProductionPlanner, ShippingCoordinator]
    code: 200
    input: []
    output: ReplacementClaim
    side_effects: []

  - method: POST
    path: "/kcma/replacement-claims/{claimId}/adjudicate"
    description: "Adjudicate a claim: APPROVE (window- and type-dependent final credit/charge) or DENY"
    roles: [PlantAdmin]
    code: 200
    input: [decision, "note?"]
    output: ReplacementClaim
    side_effects: ["claim_credit final variant applied; status -> APPROVED_NO_CHARGE | APPROVED_CHARGED | DENIED"]

  # --- Delivery routes (route & consolidation) ---
  - method: POST
    path: "/kcma/delivery-routes"
    description: "Create a delivery route with date and cube capacity"
    roles: [ShippingCoordinator]
    code: 201
    input: [route_code, route_date, capacity_cu_ft]
    output: DeliveryRoute
    side_effects: ["status = PLANNED; reserved_cu_ft = 0; assigned_order_count = 0"]

  - method: GET
    path: "/kcma/delivery-routes"
    description: "List delivery routes"
    roles: [PlantAdmin, Dealer, Engineer, FinishSupervisor, ProductionPlanner, ShippingCoordinator]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "DeliveryRoute[]"
    side_effects: []

  - method: POST
    path: "/kcma/delivery-routes/{routeId}/assign-order"
    description: "Assign an order to a PLANNED route (OCC on expected_order_version; supersedes prior route; cube capacity check)"
    roles: [ShippingCoordinator]
    code: 200
    input: [order_id, expected_order_version]
    output: DeliveryRoute
    side_effects:
      - "OCC: expected_order_version must equal order.version (ERR_STALE_ORDER_VERSION)"
      - "order.delivery_route_id := this route (any prior route's reserved_cu_ft/count decremented); route_stop_seq assigned in accepted-assignment order"
      - "route.reserved_cu_ft += order.cube_ft; assigned_order_count += 1"
      - "increments Order.version by 1"

  - method: POST
    path: "/kcma/delivery-routes/{routeId}/lock"
    description: "Lock a PLANNED route (requires >= 1 assigned order and no ON_HOLD orders)"
    roles: [ShippingCoordinator]
    code: 200
    input: []
    output: DeliveryRoute
    side_effects: ["status -> LOCKED"]

  - method: POST
    path: "/kcma/delivery-routes/{routeId}/dispatch"
    description: "Dispatch a LOCKED route: every assigned order must be READY_TO_SHIP; orders ship with final pricing + consolidated freight"
    roles: [ShippingCoordinator]
    code: 200
    input: []
    output: DeliveryRoute
    side_effects:
      - "orders READY_TO_SHIP -> SHIPPED; order_final_totals + freight_consolidation computed per order; shipped_at stamped"
      - "status -> DISPATCHED"

  # --- Holds ---
  - method: POST
    path: "/kcma/order-holds/{holdId}/release"
    description: "Manual release of a PLACED hold (PlantAdmin override)"
    roles: [PlantAdmin]
    code: 200
    input: []
    output: OrderHold
    side_effects: ["status -> RELEASED; order.hold_status recomputed; pending auto-transitions re-evaluated"]

  # --- Test-driving logical clock ---
  - method: POST
    path: "/kcma/_clock/set_current_utc"
    description: "Set the server's logical clock (ISO8601 UTC). Startup default is exactly 2026-05-01T00:00:00Z; the clock never falls back to wall-clock time. All schedule-date and warranty-window rules read this clock."
    roles: [PlantAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["logical clock advanced (monotonic not enforced; tests set explicit instants)"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- auth ---
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing, or role name not declared" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Authenticated role is not in the endpoint's roles list" }
  - { id: ERR_RESOURCE_OWNERSHIP_MISMATCH, http: 403, condition: "Entity-backed role (Dealer) acts on a resource whose dealer_id != X-User-ID" }

  # --- field-level ---
  - { id: ERR_VALIDATION, http: 400, condition: "Required field missing or malformed (lowest-priority check; fires only when no earlier rule fails)" }
  - { id: ERR_INVALID_ENUM, http: 400, condition: "Enum field value not in declared set (line_type, mod_code, sheen, price_level, claim_type, decision, kind, construction)" }
  - { id: ERR_INVALID_QUANTITY, http: 400, condition: "qty or capacity or on_hand_qty violates its > 0 / >= 0 constraint" }
  - { id: ERR_INVALID_TIME_WINDOW, http: 400, condition: "start_minute/end_minute out of range, end <= start, or computed end_minute > 1440" }
  - { id: ERR_DUPLICATE_CODE, http: 400, condition: "Unique code collision (dealer_code, style_code, finish_code, sku, station_code, line_code, route_code)" }

  # --- existence (path ids left-to-right, then body FKs) ---
  - { id: ERR_DEALER_NOT_FOUND, http: 404, condition: "Dealer id not found" }
  - { id: ERR_DOOR_STYLE_NOT_FOUND, http: 404, condition: "DoorStyle id not found" }
  - { id: ERR_FINISH_NOT_FOUND, http: 404, condition: "FinishSpec id not found" }
  - { id: ERR_COMPONENT_NOT_FOUND, http: 404, condition: "Component id not found" }
  - { id: ERR_ORDER_NOT_FOUND, http: 404, condition: "Order id not found" }
  - { id: ERR_ORDER_LINE_NOT_FOUND, http: 404, condition: "OrderLine id not found" }
  - { id: ERR_MODIFICATION_NOT_FOUND, http: 404, condition: "ModificationRequest id not found" }
  - { id: ERR_BATCH_NOT_FOUND, http: 404, condition: "FinishBatch id not found" }
  - { id: ERR_STATION_NOT_FOUND, http: 404, condition: "NestingStation id not found" }
  - { id: ERR_RUN_NOT_FOUND, http: 404, condition: "NestingRun id not found" }
  - { id: ERR_PART_NOT_FOUND, http: 404, condition: "Part id not found" }
  - { id: ERR_ASSEMBLY_LINE_NOT_FOUND, http: 404, condition: "AssemblyLine id not found" }
  - { id: ERR_SUB_LOT_NOT_FOUND, http: 404, condition: "SubLot id not found" }
  - { id: ERR_CLAIM_NOT_FOUND, http: 404, condition: "ReplacementClaim id not found" }
  - { id: ERR_ROUTE_NOT_FOUND, http: 404, condition: "DeliveryRoute id not found" }
  - { id: ERR_HOLD_NOT_FOUND, http: 404, condition: "OrderHold id not found" }

  # --- state (single-resource) ---
  - { id: ERR_ORDER_NOT_SUBMITTABLE, http: 409, condition: "submit requires order in DRAFT" }
  - { id: ERR_ORDER_NOT_CANCELLABLE, http: 409, condition: "cancel requires order in DRAFT or SUBMITTED" }
  - { id: ERR_ORDER_HAS_NO_LINES, http: 409, condition: "submit requires at least one line" }
  - { id: ERR_MOD_NOT_REVIEWABLE, http: 409, condition: "review requires mod in UNDER_REVIEW" }
  - { id: ERR_MOD_NOT_RESUBMITTABLE, http: 409, condition: "resubmit requires mod in CHANGES_REQUESTED" }
  - { id: ERR_BATCH_NOT_MIXING, http: 409, condition: "assign and qc-record require batch in MIXING" }
  - { id: ERR_BATCH_NOT_REMIXABLE, http: 409, condition: "remix requires batch in FAILED" }
  - { id: ERR_RUN_NOT_RELEASABLE, http: 409, condition: "release requires run in DRAFT" }
  - { id: ERR_RUN_NOT_CANCELLABLE, http: 409, condition: "cancel requires run in DRAFT" }
  - { id: ERR_SUB_LOT_NOT_COMPLETABLE, http: 409, condition: "complete requires sub-lot in SCHEDULED" }
  - { id: ERR_ROUTE_NOT_PLANNED, http: 409, condition: "assign-order and lock require route in PLANNED" }
  - { id: ERR_ROUTE_NOT_LOCKED, http: 409, condition: "dispatch requires route in LOCKED" }
  - { id: ERR_ROUTE_EMPTY, http: 409, condition: "lock requires at least one assigned order" }
  - { id: ERR_CLAIM_NOT_ADJUDICATABLE, http: 409, condition: "adjudicate requires claim in SUBMITTED" }
  - { id: ERR_HOLD_NOT_RELEASABLE, http: 409, condition: "manual release requires hold in PLACED" }

  # --- cross-entity state gates ---
  - { id: ERR_MODS_PENDING_REVIEW, http: 409, condition: "order submit blocked: a mod on one of its lines is UNDER_REVIEW or CHANGES_REQUESTED" }
  - { id: ERR_LINE_ORDER_NOT_RELEASED_TO_PRODUCTION, http: 409, condition: "nesting release requires every door line's order in SUBMITTED or IN_PRODUCTION" }
  - { id: ERR_ORDER_ON_HOLD, http: 409, condition: "route lock blocked: an assigned order has hold_status == ON_HOLD" }
  - { id: ERR_ORDERS_NOT_READY_TO_SHIP, http: 409, condition: "dispatch blocked: an assigned order is not READY_TO_SHIP" }

  # --- business: referential / constraint / temporal / fiscal ---
  - { id: ERR_DOOR_STYLE_INACTIVE, http: 422, condition: "New DOOR line references a DoorStyle with active == false" }
  - { id: ERR_FINISH_INACTIVE, http: 422, condition: "New line or new batch references a FinishSpec with active == false" }
  - { id: ERR_ASSEMBLY_LINE_INACTIVE, http: 422, condition: "New sub-lot references an AssemblyLine with active == false" }
  - { id: ERR_STATION_INACTIVE, http: 422, condition: "New nesting run references a NestingStation with active == false" }
  - { id: ERR_WRONG_LINE_TYPE, http: 422, condition: "line_type/shape rule violated: DOOR line missing door_style_id or depth_in != 1; BOX line carries door_style_id; sub-lot references a DOOR line" }
  - { id: ERR_COMPONENT_KIND_MISMATCH, http: 422, condition: "nesting run's sheet_component_id references a component whose kind != SHEET_GOODS" }
  - { id: ERR_CLAIM_LINE_NOT_ELIGIBLE, http: 422, condition: "claim's original_order_line_id is not a DOOR line on a SHIPPED order owned by the claiming dealer" }
  - { id: ERR_FINISH_MISMATCH, http: 422, condition: "batch assign: line.finish_id != batch.finish_id" }
  - { id: ERR_SHEEN_LOT_MISMATCH, http: 422, condition: "batch assign: line.required_sheen_lot_no is set and differs from batch.sheen_lot_no (checked after finish match, before capacity)" }
  - { id: ERR_LINE_NOT_ASSIGNABLE, http: 409, condition: "batch assign target line is not a QUOTED, unassigned DOOR line" }
  - { id: ERR_ORDER_NOT_ROUTE_ASSIGNABLE, http: 409, condition: "assign-order target order not in SUBMITTED, IN_PRODUCTION, or READY_TO_SHIP" }
  - { id: ERR_BATCH_CAPACITY_EXCEEDED, http: 422, condition: "batch assign: assigned_door_count + line.qty > capacity_doors" }
  - { id: ERR_LINE_WINDOW_OVERLAP, http: 409, condition: "sub-lot half-open window [start,end) collides with a non-CANCELLED sub-lot on same line+date; adjacency allowed" }
  - { id: ERR_STATION_WINDOW_OVERLAP, http: 409, condition: "nesting run window fails to clear another DRAFT/RELEASED run on same station+date by the changeover buffer" }
  - { id: ERR_LINE_CAPACITY_EXCEEDED, http: 409, condition: "aggregate line-day work_minutes would exceed capacity_minutes_per_day (exact equality allowed)" }
  - { id: ERR_SCHEDULE_DATE_IN_PAST, http: 422, condition: "scheduled_date / route_date is before the logical clock's current date" }
  - { id: ERR_CLAIM_WARRANTY_EXPIRED, http: 422, condition: "APPROVE of FREIGHT_DAMAGE older than 90 days or MANUFACTURING_DEFECT older than 365 days from original order shipped_at" }
  - { id: ERR_ROUTE_CUBE_EXCEEDED, http: 402, condition: "assign-order: route.reserved_cu_ft + order.cube_ft > capacity_cu_ft" }
  - { id: ERR_DEALER_CREDIT_EXCEEDED, http: 402, condition: "submit: provisional_total_cents > dealer.credit_limit_cents" }
  - { id: ERR_SUB_LOT_QTY_EXCEEDS_LINE, http: 402, condition: "sub-lot qty > order_line.qty - slotted_qty" }

  # --- optimistic concurrency ---
  - { id: ERR_STALE_ORDER_VERSION, http: 412, condition: "assign-order: expected_order_version != order.version (stale client view)" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlantAdmin
    description: "Plant administration: dealers, catalogs, components, stations, assembly lines, claim adjudication, hold override, logical clock"
    identity: opaque
    exclusive_operations:
      - "POST /kcma/dealers, PUT /kcma/dealers/{id}"
      - "POST /kcma/door-styles, POST /kcma/finish-specs, POST /kcma/components"
      - "POST /kcma/nesting-stations, POST /kcma/assembly-lines"
      - "POST /kcma/replacement-claims/{id}/adjudicate"
      - "POST /kcma/order-holds/{id}/release"
      - "POST /kcma/_clock/set_current_utc"
    shared_operations: ["all GET endpoints"]

  - name: Dealer
    description: "Network dealer placing and managing own orders, modifications, and replacement claims"
    identity: "entity_backed:Dealer"
    exclusive_operations:
      - "POST /kcma/orders, POST /kcma/orders/{id}/lines, POST /kcma/orders/{id}/submit, POST /kcma/orders/{id}/cancel"
      - "POST /kcma/order-lines/{id}/modifications, POST /kcma/modifications/{id}/resubmit"
      - "POST /kcma/replacement-claims"
    shared_operations: ["all GET endpoints"]

  - name: Engineer
    description: "Engineering review of modification requests"
    identity: opaque
    exclusive_operations:
      - "POST /kcma/modifications/{id}/review"
    shared_operations: ["all GET endpoints"]

  - name: FinishSupervisor
    description: "Finish room: batches, QC color match, door line assignment, remix"
    identity: opaque
    exclusive_operations:
      - "POST /kcma/finish-batches, POST /kcma/finish-batches/{id}/qc-record, POST /kcma/finish-batches/{id}/assign, POST /kcma/finish-batches/{id}/remix"
    shared_operations: ["all GET endpoints"]

  - name: ProductionPlanner
    description: "Production planning: component receipts, nesting runs, sub-lots"
    identity: opaque
    exclusive_operations:
      - "POST /kcma/components/{id}/receipts"
      - "POST /kcma/nesting-runs, POST /kcma/nesting-runs/{id}/release, POST /kcma/nesting-runs/{id}/cancel"
      - "POST /kcma/sub-lots, POST /kcma/sub-lots/{id}/complete"
    shared_operations: ["all GET endpoints"]

  - name: ShippingCoordinator
    description: "Shipping: delivery routes, order consolidation, lock, dispatch"
    identity: opaque
    exclusive_operations:
      - "POST /kcma/delivery-routes, POST /kcma/delivery-routes/{id}/assign-order, POST /kcma/delivery-routes/{id}/lock, POST /kcma/delivery-routes/{id}/dispatch"
    shared_operations: ["all GET endpoints"]
