      - name: replate_supersedes_the_earlier_run_and_the_bake_soak_is_enforced
        claim_type: Action endpoint
        grounds:
          - endpoints[POST /plating-runs]
          - state_machines[PlatingRun.status].SCHEDULED_to_SUPERSEDED
          - validations[priority=10, error_id=ERR_INVALID_PROCESS_RUN_STATE]
          - validations[priority=13, error_id=ERR_BAKE_DURATION_NOT_ELAPSED]
          - calculations.he_bake_compliance
        distinguishing_aspect: >
          Creating a second plating run for the same lot supersedes the first even though the first is
          merely SCHEDULED, and every later call on the superseded run answers ERR_INVALID_PROCESS_RUN_STATE;
          on the surviving run the 240-minute soak is enforced against the logical clock, so a
          complete-bake 30 minutes in is refused with 409 while the same call at 04:00 elapsed succeeds
          with bake_delay_hours 0.000.
        test_recipe:
          setup:
            - "Part spec NP-M8-ZN: CLASS_10_9 with plating_spec ZINC_CLEAR, so he_bake_required is true and he_bake_min_minutes is 240."
            - "Lot L-2627 heat-treated PASS at 22:00 on 2026-09-01 with available_count 4850 and tool_utilization_pct 4.13."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T06:00:00Z" }
