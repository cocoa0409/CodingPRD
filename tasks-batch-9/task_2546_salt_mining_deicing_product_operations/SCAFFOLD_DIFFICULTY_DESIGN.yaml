# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# task_2546_salt_mining_deicing_product_operations
#
# 9 rule_ids x 2 instances = 18 instances. Every `grounds:` ref resolves into
# SCAFFOLD.yaml §1.1-§1.7; every numeric assert below was computed with Python
# Decimal + ROUND_HALF_UP against the §1.3 formulas and their constants.
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: preseason_target_severity_weighted_versus_trailing_baseline_switch
        grounds:
          - calculations.preseason_stockpile_target
          - entities.SeasonForecast.fields.target_tons_severity_weighted
          - entities.SeasonForecast.fields.target_tons_trailing_baseline
          - entities.SeasonForecast.fields.binding_target_tons
          - entities.SeasonForecast.fields.variant_spread_tons
        distinguishing_aspect: |
          This instance exercises the TONNAGE-planning dual variant: the same severity_index of 60
          feeds a continuous three-scenario blend (SEVERITY_WEIGHTED) and a recency-weighted history
          with a three-step uplift (TRAILING_BASELINE), producing 252000.00 vs 236775.00 from one
          stored row, and switching `method` moves binding_target_tons without changing either
          variant field.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-10T00:00:00Z."
            - "One SeasonForecast for season 2026-27 / region NORTHEAST with normal_season_tons 200000, severity_index 60, prior actuals 240000 / 180000 / 150000, method SEVERITY_WEIGHTED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: ContractAdministrator
            - call: "POST /salt/season-forecasts"
              payload: { season_code: "2026-27", region_code: "NORTHEAST", normal_season_tons: 200000, severity_index: 60, prior_season_1_actual_tons: 240000, prior_season_2_actual_tons: 180000, prior_season_3_actual_tons: 150000, method: "SEVERITY_WEIGHTED", preseason_lock_date: "2026-10-15T00:00:00Z" }
              as: ContractAdministrator
              captures: { fc_id: $.data.id, fc_binding_before: $.data.binding_target_tons }
          trigger:
            - call: "PATCH /salt/season-forecasts/${fc_id}"
              payload: { method: "TRAILING_BASELINE" }
              as: ContractAdministrator
              captures: { fc_binding_after: $.data.binding_target_tons }
          assert:
            - "SeasonForecast.${fc_id}.target_tons_severity_weighted == 252000.00"
            - "SeasonForecast.${fc_id}.target_tons_trailing_baseline == 236775.00"
            - "SeasonForecast.${fc_id}.variant_spread_tons == 15225.00"
            - "${fc_binding_before} == 252000.00 (binding while method == SEVERITY_WEIGHTED)"
            - "${fc_binding_after} == 236775.00 (binding after the switch to TRAILING_BASELINE)"
            - "SeasonForecast.${fc_id}.target_tons_severity_weighted is still 252000.00 after the switch — switching the binding variant does not recompute either variant to a different number"
            - "SeasonForecast.${fc_id}.version == 2"

      - name: shortfall_penalty_per_event_versus_season_aggregate_reconciliation
        grounds:
          - calculations.shortfall_penalty
          - calculations.contract_fulfillment_ledger
          - calculations.supply_reliability_score
          - state_machines.DeliveryOrder.REQUESTED_to_SHORTED
          - state_machines.BidContract.ACTIVE_to_FORFEITED
          - entities.BidContract.fields.season_penalty_usd
          - entities.BidContract.fields.penalty_reconciliation_delta_usd
        distinguishing_aspect: |
          This instance exercises the MONEY dual variant on failure-to-supply: identical delivery
          history yields PER_EVENT 8800.00 on the order (storm multiplier and 15% order cap, no
          tolerance band) and SEASON_AGGREGATE 68200.00 on the contract (min-take tolerance band, no
          multiplier, no cap), so penalty_reconciliation_delta_usd is exactly 59400.00.
        test_recipe:
          setup:
            - "Clock at 2026-08-10T00:00:00Z."
            - "Mine Retsof (NY, rated 24000 t/day), panel P-1 PRODUCING, one run hoisted with 7000 t."
            - "Depot A (NY, OPEN, covered 40000, freight 4.00/t) holds a 900.00 t HIGHWAY_DEICING lot."
            - "Depot B (NY, covered 40000, freight 4.00/t) holds a 5527.20 t HIGHWAY_DEICING lot and is then posted to SURGE, so it counts toward pre-season coverage but is invisible to a ROUTINE waterfall."
            - "Contract with City of Buffalo: committed 5000 t at 68.55/t, min_take 80, max_take 110, penalty 22.00/t, guarantee cap 10 pct, ACTIVE."
            - "One ROUTINE delivery order at depot A for 1300 t was allocated (only 900 t eligible -> SHORTED, PER_EVENT penalty accrued) and then delivered."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: MinePlanner
            - call: "POST /salt/mines"
              payload: { name: "Retsof", state_code: "NY", rated_hoist_tons_per_day: 24000 }
              as: MinePlanner
              captures: { mine_id: $.data.id }
            - call: "POST /salt/panels"
              payload: { mine_id: "${mine_id}", panel_code: "P-1", gross_tons_in_place: 1000000, extraction_ratio_pct: 60, grade_pct_nacl: 95.0, insolubles_pct: 5.0, pillar_recovery_allowed: true }
              as: MinePlanner
              captures: { panel_id: $.data.id }
            - call: "POST /salt/panels/${panel_id}/develop"
              payload: {}
              as: MinePlanner
            - call: "POST /salt/panels/${panel_id}/start-production"
              payload: {}
              as: MinePlanner
            - call: "GET /salt/mines/${mine_id}"
              payload: {}
              as: MinePlanner
              captures: { mine_v: $.data.version }
            - call: "POST /salt/production-runs"
              payload: { mine_id: "${mine_id}", panel_id: "${panel_id}", planned_tons: 7000, hoist_window_start: "2026-08-11T00:00:00Z", hoist_window_end: "2026-08-11T08:00:00Z", expected_mine_version: "${mine_v}" }
              as: MinePlanner
              captures: { run_id: $.data.id }
            - call: "POST /salt/production-runs/${run_id}/hoist"
              payload: { hoisted_tons: 7000 }
              as: MinePlanner
            - call: "POST /salt/depots"
              payload: { name: "Depot A", state_code: "NY", covered_capacity_tons: 40000, open_pad_capacity_tons: 20000, loadout_rate_tons_per_hour: 500, outbound_freight_rate_per_ton: 4.00 }
              as: LogisticsPlanner
              captures: { depot_a: $.data.id }
            - call: "POST /salt/depots"
              payload: { name: "Depot B", state_code: "NY", covered_capacity_tons: 40000, open_pad_capacity_tons: 20000, loadout_rate_tons_per_hour: 500, outbound_freight_rate_per_ton: 4.00 }
              as: LogisticsPlanner
              captures: { depot_b: $.data.id }
            - call: "POST /salt/treatment-batches"
              payload: { production_run_id: "${run_id}", depot_id: "${depot_a}", product_line: "HIGHWAY_DEICING", screen_spec: "MEDIUM", anticaking_ppm: 30, corrosion_inhibitor_pct: 0.5, input_tons: 1000, moisture_pct: 0.0, storage_kind: "COVERED" }
              as: QualityLab
              as_user_id: "lab-tech-1"
              captures: { batch_a: $.data.id }
            - call: "POST /salt/treatment-batches/${batch_a}/qc-decision"
              payload: { decision: "PASS" }
              as: QualityLab
              as_user_id: "lab-lead-2"
            - call: "POST /salt/treatment-batches"
              payload: { production_run_id: "${run_id}", depot_id: "${depot_b}", product_line: "HIGHWAY_DEICING", screen_spec: "COARSE", anticaking_ppm: 30, corrosion_inhibitor_pct: 0.5, input_tons: 6000, moisture_pct: 2.0, storage_kind: "COVERED" }
              as: QualityLab
              as_user_id: "lab-tech-1"
              captures: { batch_b: $.data.id }
            - call: "POST /salt/treatment-batches/${batch_b}/qc-decision"
              payload: { decision: "PASS" }
              as: QualityLab
              as_user_id: "lab-lead-2"
            - call: "POST /salt/depots/${depot_b}/posture"
              payload: { depot_state: "SURGE", reason: "storm staging" }
              as: LogisticsPlanner
            - call: "POST /salt/season-forecasts"
              payload: { season_code: "2026-27", region_code: "NORTHEAST", normal_season_tons: 200000, severity_index: 60, prior_season_1_actual_tons: 240000, prior_season_2_actual_tons: 180000, prior_season_3_actual_tons: 150000, method: "SEVERITY_WEIGHTED", preseason_lock_date: "2026-10-15T00:00:00Z" }
              as: ContractAdministrator
              captures: { fc2_id: $.data.id }
            - call: "POST /salt/bid-contracts"
              payload: { season_forecast_id: "${fc2_id}", customer_name: "City of Buffalo", jurisdiction_level: "MUNICIPAL", state_code: "NY", product_line: "HIGHWAY_DEICING", committed_tons: 5000, guaranteed_price_per_ton: 68.55, min_take_pct: 80, max_take_pct: 110, failure_to_supply_penalty_per_ton: 22.00, price_guarantee_cap_pct: 10 }
              as: ContractAdministrator
              captures: { contract_id: $.data.id }
            - call: "POST /salt/bid-contracts/${contract_id}/submit"
              payload: {}
              as: ContractAdministrator
            - call: "POST /salt/bid-contracts/${contract_id}/decision"
              payload: { outcome: "AWARD" }
              as: ContractAdministrator
            - call: "POST /salt/bid-contracts/${contract_id}/activate"
              payload: {}
              as: ContractAdministrator
            - call: "GET /salt/bid-contracts/${contract_id}"
              payload: {}
              as: ContractAdministrator
              captures: { contract_v: $.data.version }
            - call: "POST /salt/delivery-orders"
              payload: { bid_contract_id: "${contract_id}", depot_id: "${depot_a}", requested_tons: 1300, required_by: "2026-12-01T00:00:00Z", market_index_price_per_ton: 70.00, storm_priority: "ROUTINE", expected_bid_contract_version: "${contract_v}" }
              as: ContractAdministrator
              captures: { order_id: $.data.id }
            - call: "POST /salt/delivery-orders/${order_id}/allocate"
              payload: {}
              as: LogisticsPlanner
              captures: { order_penalty: $.data.shortfall_penalty_usd }
            - call: "POST /salt/delivery-orders/${order_id}/deliver"
              payload: {}
              as: LogisticsPlanner
          trigger:
            - call: "POST /salt/bid-contracts/${contract_id}/close-season"
              payload: { note: "season closeout" }
              as: ContractAdministrator
          assert:
            - "${order_penalty} == 8800.00 — PER_EVENT: shorted 400.00 t x 22.00 = 8800.00, under the 15 pct order cap of 13367.25"
            - "DeliveryOrder.${order_id}.allocated_tons == 900.00 and DeliveryOrder.${order_id}.shorted_tons == 400.00"
            - "BidContract.${contract_id}.fulfilled_tons == 900.00"
            - "BidContract.${contract_id}.penalty_accrued_usd == 8800.00"
            - "BidContract.${contract_id}.season_penalty_usd == 68200.00 — SEASON_AGGREGATE: (5000 - 900) - 1000 tolerance = 3100.00 billable t x 22.00"
            - "BidContract.${contract_id}.penalty_reconciliation_delta_usd == 59400.00"
            - "BidContract.${contract_id}.status == FORFEITED"
            - "BidContract.${contract_id}.supply_reliability_score == 67.00 — 100 - 8.00 shortfall haircut - 25 forfeit haircut"

  - rule_id: combinatorial_formula
    instances:
      - name: panel_recoverable_tons_tier_times_penalty_plus_conditional_bonus_under_cap
        grounds:
          - calculations.panel_recoverable_tons
          - entities.Panel.fields.recoverable_tons
          - entities.Panel.fields.pillar_recovery_allowed
          - entities.Mine.fields.compliance_state
        distinguishing_aspect: |
          Mode (a) of combinatorial_formula: four interacting terms in one formula — a stepped grade
          tier (x1.00), a capped insolubles penalty multiplier (x0.976), an additive pillar bonus
          that exists only while the parent Mine is COMPLIANT (+32000.00) and a hard cap on gross
          tons — so 617600.00 with the bonus and 585600.00 without it, from otherwise identical inputs.
        test_recipe:
          setup:
            - "Clock at 2026-08-10T00:00:00Z."
            - "Mine Retsof (NY, rated 24000 t/day) in hoist_state HOIST_AVAILABLE and compliance_state COMPLIANT."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: MinePlanner
            - call: "POST /salt/mines"
              payload: { name: "Retsof", state_code: "NY", rated_hoist_tons_per_day: 24000 }
              as: MinePlanner
              captures: { mine2_id: $.data.id }
          trigger:
            - call: "POST /salt/panels"
              payload: { mine_id: "${mine2_id}", panel_code: "P-BONUS", gross_tons_in_place: 1000000, extraction_ratio_pct: 60, grade_pct_nacl: 95.0, insolubles_pct: 5.0, pillar_recovery_allowed: true }
              as: MinePlanner
              captures: { panel_bonus: $.data.id, tons_bonus: $.data.recoverable_tons }
            - call: "POST /salt/panels"
              payload: { mine_id: "${mine2_id}", panel_code: "P-NOBONUS", gross_tons_in_place: 1000000, extraction_ratio_pct: 60, grade_pct_nacl: 95.0, insolubles_pct: 5.0, pillar_recovery_allowed: false }
              as: MinePlanner
              captures: { panel_nobonus: $.data.id, tons_nobonus: $.data.recoverable_tons }
          assert:
            - "${tons_bonus} == 617600.00 — base 600000.00 x grade_factor 1.00 x (1 - 0.024) = 585600.00 plus pillar bonus 32000.00, all under the hard cap 720000.00"
            - "${tons_nobonus} == 585600.00 — identical inputs with pillar_recovery_allowed false drop exactly the 32000.00 additive term"
            - "Panel.${panel_bonus}.recoverable_tons - Panel.${panel_nobonus}.recoverable_tons == 32000.00"
            - "Panel.${panel_bonus}.status == PLANNED and Panel.${panel_bonus}.mined_tons == 0"

      - name: delivery_invoice_per_line_rounding_before_summation_two_lots
        grounds:
          - calculations.delivery_invoice_amount
          - calculations.storm_allocation_waterfall
          - state_machines.DeliveryOrder.ALLOCATED_to_DELIVERED
          - entities.DeliveryOrder.fields.product_subtotal_usd
          - entities.DeliveryOrder.fields.invoice_total_usd
        distinguishing_aspect: |
          Mode (b) of combinatorial_formula: the same inputs give 13723.72 when each of the two
          100.1 t lines is rounded to cents before summation and 13723.71 when the raw products are
          summed and rounded once, so the pinned per-line rounding order is worth exactly one cent
          on the invoice total (14524.52 vs 14524.51).
        test_recipe:
          setup:
            - "Clock at 2026-08-10T00:00:00Z."
            - "Depot A and Depot B, both NY, OPEN, covered capacity 40000, outbound freight 4.00/t."
            - "A 5527.20 t HIGHWAY_DEICING COVERED lot minted at Depot A, of which 5427.10 t were trucked to Depot B and received there as a second lot, leaving Depot A's lot with exactly 100.10 t available."
            - "ACTIVE contract: committed 5000 t at 68.55/t, cap 10 pct, penalty 22.00/t, min_take 80, max_take 110."
            - "One ROUTINE delivery order at Depot A for 200.2 t, allocated by the waterfall into two 100.1 t lines (Depot A lot first on same_depot_flag, Depot B lot second)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: MinePlanner
            - call: "POST /salt/mines"
              payload: { name: "Retsof", state_code: "NY", rated_hoist_tons_per_day: 24000 }
              as: MinePlanner
              captures: { m3_id: $.data.id }
            - call: "POST /salt/panels"
              payload: { mine_id: "${m3_id}", panel_code: "P-1", gross_tons_in_place: 1000000, extraction_ratio_pct: 60, grade_pct_nacl: 95.0, insolubles_pct: 5.0, pillar_recovery_allowed: true }
              as: MinePlanner
              captures: { p3_id: $.data.id }
            - call: "POST /salt/panels/${p3_id}/develop"
              payload: {}
              as: MinePlanner
            - call: "POST /salt/panels/${p3_id}/start-production"
              payload: {}
              as: MinePlanner
            - call: "GET /salt/mines/${m3_id}"
              payload: {}
              as: MinePlanner
              captures: { m3_v: $.data.version }
            - call: "POST /salt/production-runs"
              payload: { mine_id: "${m3_id}", panel_id: "${p3_id}", planned_tons: 6000, hoist_window_start: "2026-08-11T00:00:00Z", hoist_window_end: "2026-08-11T06:00:00Z", expected_mine_version: "${m3_v}" }
              as: MinePlanner
              captures: { r3_id: $.data.id }
            - call: "POST /salt/production-runs/${r3_id}/hoist"
              payload: { hoisted_tons: 6000 }
              as: MinePlanner
            - call: "POST /salt/depots"
              payload: { name: "Depot A", state_code: "NY", covered_capacity_tons: 40000, open_pad_capacity_tons: 20000, loadout_rate_tons_per_hour: 500, outbound_freight_rate_per_ton: 4.00 }
              as: LogisticsPlanner
              captures: { d3a: $.data.id }
            - call: "POST /salt/depots"
              payload: { name: "Depot B", state_code: "NY", covered_capacity_tons: 40000, open_pad_capacity_tons: 20000, loadout_rate_tons_per_hour: 500, outbound_freight_rate_per_ton: 4.00 }
              as: LogisticsPlanner
              captures: { d3b: $.data.id }
            - call: "POST /salt/treatment-batches"
              payload: { production_run_id: "${r3_id}", depot_id: "${d3a}", product_line: "HIGHWAY_DEICING", screen_spec: "COARSE", anticaking_ppm: 30, corrosion_inhibitor_pct: 0.5, input_tons: 6000, moisture_pct: 2.0, storage_kind: "COVERED" }
              as: QualityLab
              as_user_id: "lab-tech-1"
              captures: { b3_id: $.data.id }
            - call: "POST /salt/treatment-batches/${b3_id}/qc-decision"
              payload: { decision: "PASS" }
              as: QualityLab
              as_user_id: "lab-lead-2"
            - call: "GET /salt/stockpile-lots?treatment_batch_id=${b3_id}"
              payload: {}
              as: LogisticsPlanner
              captures: { lot_a: "$.data[0].id" }
            - call: "POST /salt/shipments"
              payload: { stockpile_lot_id: "${lot_a}", origin_depot_id: "${d3a}", destination_depot_id: "${d3b}", mode: "TRUCK", tons: 5427.10, load_window_start: "2026-08-12T08:00:00Z", load_window_end: "2026-08-12T10:00:00Z", destination_storage_kind: "COVERED" }
              as: LogisticsPlanner
              captures: { ship_id: $.data.id }
            - call: "POST /salt/shipments/${ship_id}/load"
              payload: {}
              as: LogisticsPlanner
            - call: "POST /salt/shipments/${ship_id}/receive"
              payload: {}
              as: LogisticsPlanner
            - call: "POST /salt/season-forecasts"
              payload: { season_code: "2026-27", region_code: "NORTHEAST", normal_season_tons: 200000, severity_index: 60, prior_season_1_actual_tons: 240000, prior_season_2_actual_tons: 180000, prior_season_3_actual_tons: 150000, method: "SEVERITY_WEIGHTED", preseason_lock_date: "2026-10-15T00:00:00Z" }
              as: ContractAdministrator
              captures: { fc3_id: $.data.id }
            - call: "POST /salt/bid-contracts"
              payload: { season_forecast_id: "${fc3_id}", customer_name: "City of Buffalo", jurisdiction_level: "MUNICIPAL", state_code: "NY", product_line: "HIGHWAY_DEICING", committed_tons: 5000, guaranteed_price_per_ton: 68.55, min_take_pct: 80, max_take_pct: 110, failure_to_supply_penalty_per_ton: 22.00, price_guarantee_cap_pct: 10 }
              as: ContractAdministrator
              captures: { c3_id: $.data.id }
            - call: "POST /salt/bid-contracts/${c3_id}/submit"
              payload: {}
              as: ContractAdministrator
            - call: "POST /salt/bid-contracts/${c3_id}/decision"
              payload: { outcome: "AWARD" }
              as: ContractAdministrator
            - call: "POST /salt/bid-contracts/${c3_id}/activate"
              payload: {}
              as: ContractAdministrator
            - call: "GET /salt/bid-contracts/${c3_id}"
              payload: {}
              as: ContractAdministrator
              captures: { c3_v: $.data.version }
            - call: "POST /salt/delivery-orders"
              payload: { bid_contract_id: "${c3_id}", depot_id: "${d3a}", requested_tons: 200.2, required_by: "2026-12-01T00:00:00Z", market_index_price_per_ton: 70.00, storm_priority: "ROUTINE", expected_bid_contract_version: "${c3_v}" }
              as: LogisticsPlanner
              captures: { o3_id: $.data.id }
            - call: "POST /salt/delivery-orders/${o3_id}/allocate"
              payload: {}
              as: LogisticsPlanner
              captures: { o3_allocated: $.data.allocated_tons }
          trigger:
            - call: "POST /salt/delivery-orders/${o3_id}/deliver"
              payload: {}
              as: LogisticsPlanner
              captures: { o3_product: $.data.product_subtotal_usd, o3_total: $.data.invoice_total_usd }
          assert:
            - "${o3_allocated} == 200.20 and GET /salt/allocations?delivery_order_id=${o3_id} returns exactly 2 rows, both with tons == 100.10, rank_position 1 (lot at Depot A) then 2 (lot at Depot B)"
            - "${o3_product} == 13723.72 — each line rounds 100.1 x 68.55 = 6861.855 up to 6861.86 BEFORE summation; the forbidden sum-then-round order would give 13723.71"
            - "DeliveryOrder.${o3_id}.freight_subtotal_usd == 800.80 — 400.40 per line at each source lot's own depot rate of 4.00/t"
            - "DeliveryOrder.${o3_id}.storm_surcharge_usd == 0.00 (ROUTINE) and DeliveryOrder.${o3_id}.guarantee_credit_usd == 0.00 (market 70.00 is below the 75.405 guarantee ceiling)"
            - "${o3_total} == 14524.52 — NOT 14524.51"
            - "DeliveryOrder.${o3_id}.status == DELIVERED and BidContract.${c3_id}.fulfilled_tons == 200.20"

  - rule_id: non_linear_state_machine
    instances:
      - name: panel_producing_suspended_producing_cycle_guarded_by_open_defect
        grounds:
          - state_machines.Panel.PRODUCING_to_SUSPENDED
          - state_machines.Panel.SUSPENDED_to_PRODUCING
          - state_machines.ProductionRun.SCHEDULED_to_HELD
          - state_machines.ProductionRun.HELD_to_SCHEDULED
          - validations[priority=24]
          - entities.Panel.fields.open_defect
          - entities.Panel.fields.ground_control_defect_count
        distinguishing_aspect: |
          A CROSS-STATE cycle: the panel leaves PRODUCING, returns to it, and re-entry is blocked by a
          computed flag (open_defect) that only a separate remediation call can clear — so the same
          trigger (start-production) fails then succeeds on the identical from-state SUSPENDED, and the
          held run's HELD -> SCHEDULED loop-back re-runs the full guard set.
        test_recipe:
          setup:
            - "Clock at 2026-08-10T00:00:00Z."
            - "Mine Retsof (NY, rated 24000 t/day) with TWO PRODUCING panels P-1 and P-2, and one SCHEDULED run of 3000 t on P-1 over a 6 h window (500.0000 t/h)."
            - "A DEFECT ground-control inspection has been recorded on P-1, so P-1 is SUSPENDED with open_defect true, the run is HELD with held_reason GROUND_CONTROL, and the mine is HOIST_DERATED — not HOIST_DOWN — because P-2 keeps producing_panel_count above zero (effective 13200.00 t/day, 550.00 t/h)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: MinePlanner
            - call: "POST /salt/mines"
              payload: { name: "Retsof", state_code: "NY", rated_hoist_tons_per_day: 24000 }
              as: MinePlanner
              captures: { m4_id: $.data.id }
            - call: "POST /salt/panels"
