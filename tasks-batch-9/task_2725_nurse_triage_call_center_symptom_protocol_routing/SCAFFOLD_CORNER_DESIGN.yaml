        excluded_because:
          difficulty_instance: nurse_shift_half_open_overlap_rejects_a_one_minute_straddle_but_allows_exact_adjacency
          rationale: "§1.8 exercises the half-open overlap rule on both sides of the boundary — a one-minute straddle rejected and exact adjacency accepted — which subsumes any plainer overlap test."

      - name: after_hours_intake_cross_entity_coverage_validation
        claim_type: Cross-entity validation
        grounds:
          - validations[priority=36]        # ERR_NO_ACTIVE_COVERAGE
          - endpoints[POST /triage-calls]
        excluded_because:
          difficulty_instance: after_hours_intake_is_gated_on_a_third_partys_coverage_window_being_active
          rationale: "§1.8 already gates an after-hours intake on a CoverageWindow owned by a different aggregate, testing both the DRAFT refusal and the ACTIVE acceptance."

  # ==========================================================================
  - section: endpoints
    instances:

      - name: zero_activity_practice_reads_return_zeroed_projections_not_errors
        claim_type: Computed read
        grounds:
          - endpoints[GET /practices/{id}/compliance-summary]
          - endpoints[GET /practices/{id}/after-hours-invoice]
          - endpoints[GET /staffing-adequacy]
          - calculations.practice_concordance_rate
          - calculations.practice_after_hours_invoice
          - calculations.staffing_adequacy
        distinguishing_aspect: "All three read-only projections have a zero denominator on a brand-new practice, and each has a declared answer rather than a division error: both concordance rates read 0.0, the invoice totals 0 cents with a 0% credit tier, and staffing adequacy reads 100.0 / ADEQUATE because zero demand is by definition covered."
        test_recipe:
          setup:
            - "Clock 2026-08-03T14:30:00Z; one ACTIVE practice with audit_period_start_utc 2026-08-01T00:00:00Z and no calls, no dispositions, no audit records, no shifts and no licences anywhere."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T14:30:00Z" }
              as: PlatformAdmin
            - call: "POST /practices"
              payload: { name: "Northside Family Health", office_open_utc_hhmm: "13:00", office_close_utc_hhmm: "22:00", per_minute_rate_millicents: 4225, audit_period_start_utc: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { practice_id: $.data.id }
          trigger:
            - call: "GET /practices/${practice_id}/compliance-summary"
              as: ComplianceAuditor
              captures: { audited: $.data.audited_count, strict: $.data.concordance_rate_strict_pct, band: $.data.concordance_rate_band_tolerant_pct, points: $.data.variance_severity_points_total, posture: $.data.compliance_posture }
            - call: "GET /practices/${practice_id}/after-hours-invoice"
              as: PracticeLiaison
              as_user_id: "${practice_id}"
              captures: { subtotal: $.data.advice_subtotal_cents, minutes: $.data.billed_advice_minutes_total, esc_count: $.data.escalated_callback_count, gross: $.data.escalation_gross_cents, credit_pct: $.data.coverage_credit_pct, credit: $.data.coverage_credit_cents, total: $.data.invoice_total_cents }
            - call: "GET /staffing-adequacy?state_code=CA&window_start_utc=2026-08-03T12:00:00Z&window_end_utc=2026-08-03T20:00:00Z"
              as: ChargeNurse
              captures: { offered: $.data.offered_call_count, required: $.data.required_nurse_minutes, scheduled: $.data.scheduled_nurse_minutes, ratio: $.data.adequacy_ratio_pct, staffing_posture: $.data.staffing_posture, licensed: $.data.licensed_nurse_count }
          assert:
            - "${audited} == 0"
            - "${strict} == 0.0"
            - "${band} == 0.0"
            - "${points} == 0"
            - "${posture} == NORMAL"
            - "${subtotal} == 0"
            - "${minutes} == 0"
            - "${esc_count} == 0"
            - "${gross} == 0"
            - "${credit_pct} == 0"
            - "${credit} == 0"
            - "${total} == 0"
            - "${offered} == 0"
            - "${required} == 0"
            - "${scheduled} == 0"
            - "${ratio} == 100.0"
            - "${staffing_posture} == ADEQUATE"
            - "${licensed} == 0"
            - "all three responses are HTTP 200 with response_type object and no error_id"

      - name: triage_call_listing_filters_by_practice_and_pages_deterministically
        claim_type: Listing
        grounds:
          - endpoints[GET /triage-calls]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "Filtering and paging compose without leaking across practices: three calls belong to practice_1 and one to practice_2, so a practice-filtered page of 2 reports total_count 3 with has_more true, the second page returns the single remainder with has_more false, and the same filter on practice_2 reports total_count 1 — the total always describes the filtered set, never the table."
        test_recipe:
          setup:
            - "Clock 2026-08-03T14:30:00Z; practice_1 has three INTAKE calls created in order, practice_2 has one."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T14:30:00Z" }
              as: PlatformAdmin
            - call: "POST /practices"
              payload: { name: "Northside Family Health", office_open_utc_hhmm: "13:00", office_close_utc_hhmm: "22:00", per_minute_rate_millicents: 4225 }
              as: PlatformAdmin
              captures: { practice_1: $.data.id }
            - call: "POST /practices"
              payload: { name: "Lakeside Pediatrics", office_open_utc_hhmm: "13:00", office_close_utc_hhmm: "22:00", per_minute_rate_millicents: 3900 }
              as: PlatformAdmin
              captures: { practice_2: $.data.id }
            - call: "POST /triage-calls"
