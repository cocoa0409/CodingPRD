    grounds:
    - §1.6 ERR_TRANSFER_CONDITIONS_INCOMPLETE (422)
    - §1.4 priority 30
    - §1.3 transfer_condition_requirement (a specimen with any TREATMENT VeterinaryCase additionally requires DIET_TRANSITION_PLAN)
