            - { call: "POST /tea-ops/leaf-lots/${lot}/residue-tests", payload: { lab_name: "LabA", measured_residue_ppm: 0.30, test_method: "GCMS" }, as: QALabAnalyst, as_user_id: "an-1" }
            - { call: "POST /tea-ops/suppliers/${sup}/suspend", payload: {}, as: ProcurementLead, as_user_id: "pl-1" }
            - { call: "POST /tea-ops/leaf-lots/${lot}/residue-tests", payload: { lab_name: "LabB", measured_residue_ppm: 0.20, test_method: "HPLC" }, as: QALabAnalyst, as_user_id: "an-1", captures: { v: $.data.verdict } }
          trigger:
            - { call: "POST /tea-ops/leaf-lots/${lot}/release", payload: {}, as: QAManager, as_user_id: "qa-1", captures: { err: $.data.error_id } }
          assert:
            - "retest from ON_HOLD succeeded: ${v} == PASS (lot LAB_SUBMITTED again)"
            - "release still blocked: ${err} == ERR_SUPPLIER_SUSPENDED"

