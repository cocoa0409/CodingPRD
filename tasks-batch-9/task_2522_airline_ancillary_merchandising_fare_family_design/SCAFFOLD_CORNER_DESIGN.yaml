  - section: endpoints
    instances:
      - name: patch_family_attribute_updates_the_override_and_recomputes_the_family
        claim_type: standard_crud
        grounds:
          - endpoints[PATCH /family-attributes/{id}]
          - calculations.fare_family_bundle_valuation
          - entities.FamilyAttribute.fields.override_price_cents
        distinguishing_aspect: "Setting override_price_cents 3000 on the BAG_CHECKED_1 attribute of ECO_LITE rewrites the attribute's own effective_unit_cents and attr_value_cents AND the family's 3000 / 15000 / 667 triple and fingerprint in the same request."
        test_recipe:
          setup:
            - "DRAFT family ECO_LITE (base 12000, bundle 14000) carries one ACTIVE INCLUDED BAG_CHECKED_1 attribute at list 3500, so the family reads 3500 / 15500 / 968"
          setup_api_calls:
            - call: "POST /ancillary-products"
              payload: { sku: "BAG_CHECKED_1", name: "First checked bag", category: "BAGGAGE", list_price_cents: 3500, tax_treatment: "TAXABLE_SERVICE", revenue_class: "NON_AIR", revenue_account_code: "4100" }
              as: MerchandisingAnalyst
              as_user_id: "ma-001"
              captures: { p_bag_id: $.data.id }
            - call: "POST /fare-families"
              payload: { code: "ECO_LITE", name: "Economy Lite", cabin_class: "ECONOMY", base_fare_cents: 12000, bundle_price_cents: 14000, refundability: "NON_REFUNDABLE", change_fee_cents: 7500, boarding_priority_tier: 4 }
              as: MerchandisingAnalyst
              as_user_id: "ma-001"
              captures: { f_lite_id: $.data.id }
            - call: "POST /fare-families/${f_lite_id}/attributes"
              payload: { ancillary_product_id: "${p_bag_id}", inclusion: "INCLUDED", included_quantity: 1 }
              as: MerchandisingAnalyst
              as_user_id: "ma-001"
              captures: { a_bag_id: $.data.id }
          trigger:
            - call: "PATCH /family-attributes/${a_bag_id}"
              payload: { override_price_cents: 3000 }
              as: MerchandisingAnalyst
              as_user_id: "ma-001"
          assert:
            - "HTTP status is 200; the returned attribute has override_price_cents 3000, effective_unit_cents 3000 and attr_value_cents 3000"
            - "GET /fare-families/${f_lite_id} reports unbundled_value_cents 3000, a_la_carte_total_cents 15000 and bundle_discount_bp 667"
            - "FareFamily.fee_fingerprint == \"ECO_LITE|1|BAG_CHECKED_1:INCLUDED:1:3000\" - the fingerprint quotes the override, not the 3500 list price"
            - "the underlying AncillaryProduct still reports list_price_cents 3500"
            - "FamilyAttribute.version == 2 and FareFamily.version == 3"

      - name: demand_snapshot_reprices_every_segment_of_the_flight
        claim_type: action_endpoint
        grounds:
          - endpoints[POST /flights/{id}/demand-snapshot]
          - calculations.seat_segment_effective_price
          - entities.Flight.fields.demand_tier
        distinguishing_aspect: "One snapshot at booked_load_factor_pct 60 flips the flight to demand_tier MID and reprices BOTH segments in the same request - MID rows-16 2000 -> 2200 and EXIT_ROW rows-12 4000 -> 4400 - each through its own zone and row-band factors."
        test_recipe:
          setup:
            - "flight AC540 is at booked_load_factor_pct 0 (demand_tier LOW) with two OPEN segments for SEAT_STANDARD at base_price_cents 2000: MID rows 16..16 [A, B] priced 2000 and EXIT_ROW rows 12..12 [A, B] priced 4000"
          setup_api_calls:
            - call: "POST /ancillary-products"
              payload: { sku: "SEAT_STANDARD", name: "Standard seat", category: "SEAT", list_price_cents: 1900, tax_treatment: "TAXABLE_SERVICE", revenue_class: "NON_AIR", revenue_account_code: "4200", refundable: true }
              as: MerchandisingAnalyst
              as_user_id: "ma-001"
              captures: { p_seat_std_id: $.data.id }
            - call: "POST /flights"
              payload: { flight_no: "AC540", origin: "SFO", destination: "JFK", scheduled_departure_utc: "2026-09-01T15:00:00Z", cabin_seat_total: 120 }
              as: OperationsController
              as_user_id: "oc-001"
              captures: { fl_id: $.data.id }
            - call: "POST /seat-segments"
              payload: { flight_id: "${fl_id}", ancillary_product_id: "${p_seat_std_id}", zone: "MID", row_start: 16, row_end: 16, seat_letters: ["A", "B"], base_price_cents: 2000 }
              as: OperationsController
              as_user_id: "oc-001"
              captures: { seg_mid_id: $.data.id }
            - call: "POST /seat-segments"
              payload: { flight_id: "${fl_id}", ancillary_product_id: "${p_seat_std_id}", zone: "EXIT_ROW", row_start: 12, row_end: 12, seat_letters: ["A", "B"], base_price_cents: 2000 }
              as: OperationsController
              as_user_id: "oc-001"
              captures: { seg_exit_id: $.data.id }
          trigger:
            - call: "POST /flights/${fl_id}/demand-snapshot"
              payload: { booked_load_factor_pct: 60, demand_index_bp: 1200 }
              as: OperationsController
              as_user_id: "oc-001"
          assert:
            - "Flight.booked_load_factor_pct == 60, demand_index_bp == 1200 and demand_tier == \"MID\" (60 >= MID_AT_OR_ABOVE, below HIGH)"
            - "GET /seat-segments/${seg_mid_id}: zone_base_cents 2000, zone_multiplier_bp 10000, effective_price_cents 2200"
            - "GET /seat-segments/${seg_exit_id}: zone_base_cents 2500 (row band rows_6_to_15), zone_multiplier_bp 16000, effective_price_cents 4400"
            - "both segments still report total_seats 2 and available_seats 2; demand_index_bp changes nothing about seat pricing, only about offer WTP"
            - "Flight.version increments by exactly 1 for the whole two-segment reprice"

      - name: clock_set_sweeps_presented_offers_to_expired_and_spares_accepted_ones
