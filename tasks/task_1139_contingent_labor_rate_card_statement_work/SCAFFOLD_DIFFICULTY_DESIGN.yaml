              as: ProgramAdmin
              captures: { rc_id: "$.data.id" }
            - { call: "POST /v1/rate-cards/${rc_id}/activate", payload: {}, as: ProgramAdmin }
            - call: "POST /v1/suppliers"
              payload: { name: "Mu Staffing", supplier_code: "SUP-M1", tier: "PREFERRED" }
              as: ProgramAdmin
              captures: { s1_id: "$.data.id" }
            - call: "POST /v1/engagements"
              payload: { title: "E1", engagement_type: "REQUISITION", role_code: "SWE", skill_code: "JAVA", geo_code: "US-CA", payment_basis: "HOURLY", supervision_level: "DAILY", duration_months: 3, budget_cents: 2000000 }
              as: HiringManager
              captures: { e1_id: "$.data.id" }
            - { call: "POST /v1/engagements/${e1_id}/submit-review", payload: {}, as: HiringManager }
            - { call: "POST /v1/engagements/${e1_id}/classification-decision", payload: { decision: "APPROVE" }, as: ProgramAdmin }
            - call: "POST /v1/engagements/${e1_id}/distribute"
              payload: {}
              as: ProgramAdmin
              captures: { o1_id: "$.data[0].id" }
            - { call: "POST /v1/distribution-offers/${o1_id}/respond", payload: { action: "ACCEPT" }, as: SupplierCoordinator, as_user_id: "${s1_id}" }
            - call: "POST /v1/workers"
              payload: { supplier_id: "${s1_id}", full_name: "Worker One", email: "w1@example.com" }
              as: SupplierCoordinator
              as_user_id: "${s1_id}"
              captures: { w1_id: "$.data.id" }
            - call: "POST /v1/assignments"
              payload: { worker_id: "${w1_id}", engagement_id: "${e1_id}", offer_id: "${o1_id}", rate_card_id: "${rc_id}", bill_rate_cents: 9500, pay_rate_cents: 8000, start_date: "2026-05-01", end_date: "2026-06-30" }
              as: ProgramAdmin
              captures: { a1_id: "$.data.id" }
            - { call: "POST /v1/assignments/${a1_id}/activate", payload: {}, as: ProgramAdmin }
            - call: "POST /v1/engagements"
              payload: { title: "E2", engagement_type: "REQUISITION", role_code: "SWE", skill_code: "JAVA", geo_code: "US-CA", payment_basis: "HOURLY", supervision_level: "DAILY", duration_months: 4, budget_cents: 2000000 }
              as: HiringManager
              captures: { e2_id: "$.data.id" }
            - { call: "POST /v1/engagements/${e2_id}/submit-review", payload: {}, as: HiringManager }
            - { call: "POST /v1/engagements/${e2_id}/classification-decision", payload: { decision: "APPROVE" }, as: ProgramAdmin }
            - call: "POST /v1/engagements/${e2_id}/distribute"
              payload: {}
              as: ProgramAdmin
              captures: { o2_id: "$.data[0].id" }
            - { call: "POST /v1/distribution-offers/${o2_id}/respond", payload: { action: "ACCEPT" }, as: SupplierCoordinator, as_user_id: "${s1_id}" }
          trigger:
            - call: "POST /v1/assignments"
              payload: { worker_id: "${w1_id}", engagement_id: "${e2_id}", offer_id: "${o2_id}", rate_card_id: "${rc_id}", bill_rate_cents: 9500, pay_rate_cents: 8000, start_date: "2026-06-30", end_date: "2026-08-31" }
              as: ProgramAdmin
              captures: { err_touch: "$.data.error_id" }
            - call: "POST /v1/assignments"
              payload: { worker_id: "${w1_id}", engagement_id: "${e2_id}", offer_id: "${o2_id}", rate_card_id: "${rc_id}", bill_rate_cents: 9500, pay_rate_cents: 8000, start_date: "2026-07-01", end_date: "2026-08-31" }
              as: ProgramAdmin
              captures: { a3_id: "$.data.id" }
          assert:
            - "touching assignment [2026-06-30, 2026-08-31] rejected with ERR_WORKER_DOUBLE_BOOKED — closed inclusive semantics share the single day 2026-06-30"
            - "next-day assignment [2026-07-01, 2026-08-31] succeeds (201) with the SAME offer O2 — failed attempts do not consume the offer"
            - "Assignment.${a1_id} unchanged (still ACTIVE, [2026-05-01, 2026-06-30])"

  - rule_id: compensating_invariant
    instances:
      - name: timesheet_void_restores_spend_invariant
        grounds:
          - state_machines.Timesheet.APPROVED_to_VOIDED
          - calculations.committed_spend
          - entities.Supplier.fields.spend_ytd_cents
          - entities.SpendLedgerEntry
        distinguishing_aspect: |
          Conserved quantity: approved-spend dollars. Invariant: supplier
          spend_ytd_cents == SUM(ledger delta_cents) and the approve-then-void
          pair leaves spend_ytd_cents, invoice subtotal and engagement
          committed_spend exactly at their pre-approve values (no drift).
          Distinct quantity from offer_withdraw_expire_restores_slot_invariant
          (offer counts).
        test_recipe:
          setup:
            - "Staffed REQUISITION engagement; timesheet T1 (35h x 9500) SUBMITTED; supplier spend_ytd_cents == 0 and no invoice exists yet"
          setup_api_calls:
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: ProgramAdmin }
            - call: "POST /v1/rate-cards"
              payload: { role_code: "SWE", skill_code: "JAVA", geo_code: "US-CA", currency: "USD", pay_rate_floor_cents: 5000, bill_rate_ceiling_cents: 12000, max_markup_pct: 0.25, effective_from: "2026-01-01", effective_to: "2027-01-01" }
              as: ProgramAdmin
              captures: { rc_id: "$.data.id" }
            - { call: "POST /v1/rate-cards/${rc_id}/activate", payload: {}, as: ProgramAdmin }
            - call: "POST /v1/suppliers"
              payload: { name: "Nu Staffing", supplier_code: "SUP-N1", tier: "PREFERRED" }
              as: ProgramAdmin
              captures: { s1_id: "$.data.id" }
            - call: "POST /v1/engagements"
              payload: { title: "Invariant", engagement_type: "REQUISITION", role_code: "SWE", skill_code: "JAVA", geo_code: "US-CA", payment_basis: "HOURLY", supervision_level: "DAILY", duration_months: 6, budget_cents: 1000000 }
              as: HiringManager
              captures: { e1_id: "$.data.id" }
            - { call: "POST /v1/engagements/${e1_id}/submit-review", payload: {}, as: HiringManager }
            - { call: "POST /v1/engagements/${e1_id}/classification-decision", payload: { decision: "APPROVE" }, as: ProgramAdmin }
            - call: "POST /v1/engagements/${e1_id}/distribute"
              payload: {}
              as: ProgramAdmin
              captures: { o1_id: "$.data[0].id" }
            - { call: "POST /v1/distribution-offers/${o1_id}/respond", payload: { action: "ACCEPT" }, as: SupplierCoordinator, as_user_id: "${s1_id}" }
            - call: "POST /v1/workers"
              payload: { supplier_id: "${s1_id}", full_name: "Worker One", email: "w1@example.com" }
              as: SupplierCoordinator
              as_user_id: "${s1_id}"
              captures: { w1_id: "$.data.id" }
            - call: "POST /v1/assignments"
              payload: { worker_id: "${w1_id}", engagement_id: "${e1_id}", offer_id: "${o1_id}", rate_card_id: "${rc_id}", bill_rate_cents: 9500, pay_rate_cents: 8000, start_date: "2026-05-01", end_date: "2026-08-31" }
              as: ProgramAdmin
              captures: { a1_id: "$.data.id" }
            - { call: "POST /v1/assignments/${a1_id}/activate", payload: {}, as: ProgramAdmin }
            - call: "POST /v1/timesheets"
              payload: { assignment_id: "${a1_id}", period_start: "2026-05-04", period_end: "2026-05-10", submitted_hours: 35.0 }
              as: Worker
              as_user_id: "${w1_id}"
              captures: { t1_id: "$.data.id" }
            - { call: "POST /v1/timesheets/${t1_id}/submit", payload: {}, as: Worker, as_user_id: "${w1_id}" }
            - { call: "POST /v1/timesheets/${t1_id}/approve", payload: {}, as: HiringManager }
            - call: "GET /v1/suppliers/${s1_id}"
              payload: {}
              as: ProgramAdmin
              captures: { spend_after_approve: "$.data.spend_ytd_cents" }
          trigger:
            - { call: "POST /v1/timesheets/${t1_id}/void", payload: { reason: "duplicate entry" }, as: FinanceAnalyst }
            - call: "GET /v1/suppliers/${s1_id}"
              payload: {}
              as: ProgramAdmin
              captures: { spend_after_void: "$.data.spend_ytd_cents" }
            - call: "GET /v1/invoices"
              payload: { supplier_id: "${s1_id}" }
              as: FinanceAnalyst
              captures: { inv_sub: "$.data[0].subtotal_cents", inv_lc: "$.data[0].line_count" }
            - call: "GET /v1/engagements/${e1_id}"
              payload: {}
              as: HiringManager
              captures: { e_committed: "$.data.committed_spend_cents" }
            - call: "GET /v1/spend-ledger-entries"
              payload: { timesheet_id: "${t1_id}" }
              as: FinanceAnalyst
          assert:
            - "Supplier spend_ytd_cents after approve == 332500; after void == 0 — exactly the pre-approve baseline"
            - "two ledger entries exist (+332500 TIMESHEET_APPROVED, -332500 TIMESHEET_VOIDED); their sum == 0 == spend_ytd_cents and the latest running_balance_cents == 0"
            - "Invoice subtotal_cents == 0 and line_count == 0 after the void (line detached)"
            - "Engagement.${e1_id}.committed_spend_cents == 0"
            - "Timesheet.${t1_id}.status == VOIDED"

      - name: offer_withdraw_expire_restores_slot_invariant
        grounds:
          - state_machines.DistributionOffer
          - calculations.distribution_selector
          - entities.Supplier.fields.open_offers_count
        distinguishing_aspect: |
          Conserved quantity: outstanding distribution-slot COUNT (not money).
          Invariant: for every supplier, open_offers_count == number of its
          OFFERED offers; the distribute (+1 per offer) then withdraw/expire
          (-1 per offer) pair returns every counter to its baseline.
          Distinct quantity from timesheet_void_restores_spend_invariant.
        test_recipe:
          setup:
            - "Suppliers S1 PREFERRED, S2 APPROVED (code SUP-A), S3 APPROVED (code SUP-B); engagement OPEN"
            - "distribute creates 3 offers (fanout 3); each supplier open_offers_count == 1"
          setup_api_calls:
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T00:00:00Z" }, as: ProgramAdmin }
            - call: "POST /v1/suppliers"
              payload: { name: "Sup Pref", supplier_code: "SUP-P", tier: "PREFERRED" }
              as: ProgramAdmin
              captures: { s1_id: "$.data.id" }
            - call: "POST /v1/suppliers"
              payload: { name: "Sup A", supplier_code: "SUP-A", tier: "APPROVED" }
              as: ProgramAdmin
              captures: { s2_id: "$.data.id" }
            - call: "POST /v1/suppliers"
              payload: { name: "Sup B", supplier_code: "SUP-B", tier: "APPROVED" }
              as: ProgramAdmin
              captures: { s3_id: "$.data.id" }
            - call: "POST /v1/engagements"
              payload: { title: "Slots", engagement_type: "REQUISITION", role_code: "SWE", skill_code: "JAVA", geo_code: "US-CA", payment_basis: "HOURLY", supervision_level: "DAILY", duration_months: 3, budget_cents: 1000000 }
              as: HiringManager
              captures: { e1_id: "$.data.id" }
            - { call: "POST /v1/engagements/${e1_id}/submit-review", payload: {}, as: HiringManager }
            - { call: "POST /v1/engagements/${e1_id}/classification-decision", payload: { decision: "APPROVE" }, as: ProgramAdmin }
            - call: "POST /v1/engagements/${e1_id}/distribute"
              payload: {}
              as: ProgramAdmin
              captures: { o1_id: "$.data[0].id", o1_sup: "$.data[0].supplier_id", o2_id: "$.data[1].id", o3_id: "$.data[2].id" }
          trigger:
            - { call: "POST /v1/distribution-offers/${o1_id}/withdraw", payload: {}, as: ProgramAdmin }
            - { call: "POST /v1/_clock/set_current_utc", payload: { to_iso8601: "2026-05-09T00:00:00Z" }, as: ProgramAdmin }
            - call: "POST /v1/distribution-offers/expire-sweep"
              payload: {}
              as: ProgramAdmin
              captures: { expired: "$.data.expired_count" }
            - call: "GET /v1/suppliers/${s1_id}"
              payload: {}
              as: ProgramAdmin
              captures: { c1: "$.data.open_offers_count" }
            - call: "GET /v1/suppliers/${s2_id}"
              payload: {}
              as: ProgramAdmin
              captures: { c2: "$.data.open_offers_count" }
            - call: "GET /v1/suppliers/${s3_id}"
              payload: {}
              as: ProgramAdmin
              captures: { c3: "$.data.open_offers_count" }
          assert:
            - "distribute created exactly 3 offers, ranked PREFERRED-first then supplier_code ASC on the created_at tie: data[0].supplier_id == ${s1_id}"
            - "withdraw moved ${o1_id} to WITHDRAWN and expire-sweep reported expired_count == 2 (the other two offers past response_due_at 2026-05-08T00:00:00Z)"
            - "Supplier.${s1_id}.open_offers_count == 0, Supplier.${s2_id}.open_offers_count == 0, Supplier.${s3_id}.open_offers_count == 0 — every counter back to its pre-distribute baseline"
            - "global invariant: SUM(open_offers_count) == count of OFFERED offers == 0"
