            - { call: "POST /daily-reports", payload: { project_id: "${proj}", report_date: "2026-08-01" }, as: Superintendent, captures: { rep: $.data.id } }
          trigger:
            - { call: "POST /incidents", payload: { report_id: "${rep}", work_area_id: "${area}", occurred_at: "2026-08-01T00:00:00Z", severity: "FIRST_AID", narrative: "ok" }, as: SafetyOfficer, as_user_id: "so-1", captures: { inc: $.data.id } }
            - { call: "POST /incidents", payload: { report_id: "${rep}", work_area_id: "${area}", occurred_at: "2026-08-01T00:00:01Z", severity: "FIRST_AID", narrative: "future by 1s" }, as: SafetyOfficer, as_user_id: "so-1", captures: { err: $.data.error_id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:01Z" }, as: SystemAdmin, captures: { now: $.data.current_utc } }
            - { call: "POST /incidents", payload: { report_id: "${rep}", work_area_id: "${area}", occurred_at: "2026-08-01T00:00:01Z", severity: "FIRST_AID", narrative: "now allowed" }, as: SafetyOfficer, as_user_id: "so-1", captures: { inc2: $.data.id } }
          assert:
            - "default clock is 2026-08-01T00:00:00Z: occurred_at == now passes, +1s fails with ERR_INCIDENT_OCCURRED_IN_FUTURE"
            - "set_current_utc returns current_utc == 2026-08-01T00:00:01Z and the previously-failing create now succeeds"

      - name: quantity_entry_supersede_voids_prior
        claim_type: conditional_action
        grounds: [state_machines.QuantityEntry.ACTIVE_to_VOIDED, "concurrency_rules[quantity-entry-supersede-stale-report]"]
        distinguishing_aspect: "Posting a second entry for the same (report, work_item, work_area) triple voids the first (status VOIDED, supersedes_id -> replacement); the replacement is ACTIVE."
        test_recipe:
          setup: ["Report DRAFT; one ACTIVE quantity entry for (wi, area)"]
