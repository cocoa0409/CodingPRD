      - name: van_window_conflict_outranks_insufficient_van_parts
        grounds:
          - validations[priority=24]
          - validations[priority=26]
          - calculations.van_window_overlap
          - calculations.van_parts_ledger
          - errors[ERR_VAN_WINDOW_CONFLICT]
          - errors[ERR_INSUFFICIENT_VAN_PARTS]
        distinguishing_aspect: |
          A different error-category pair from the allocation conflict: business_temporal (priority
          24, ERR_VAN_WINDOW_CONFLICT) versus business_constraint (priority 26,
          ERR_INSUFFICIENT_VAN_PARTS) on POST /service-calls/{id}/dispatch, where the van holds 0
          free units AND the requested window sits inside the 30-minute travel buffer of an existing
          dispatch; the temporal error is returned.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Outlet R10 with one ACTIVE agreement and one IN_SERVICE unit."
            - "VanPartStock (V-88, VALVE_KIT_7) created with on_van_units 1."
            - "Service call A DISPATCHED on van V-88 for 09:00-11:00 holding the single VALVE_KIT_7 unit, so on_van_units == 0 and reserved_units == 1."
            - "Service call B still OPEN on the same unit."
          setup_api_calls:
            - call: "POST /fountain-network/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /fountain-network/outlets"
              payload: { name: "Bowling Center Grill", account_code: "ACCT-PP-B", region_code: "R10", throughput_tier: "MEDIUM", water_hardness_gpg: 10 }
              as: NetworkAdmin
              captures: { o10: $.data.id, o10v: $.data.version }
            - call: "POST /fountain-network/placement-agreements"
              payload: { outlet_id: "${o10}", term_start_date: "2026-01-01T00:00:00Z", term_end_date: "2027-01-01T00:00:00Z", annual_commitment_gallons: 4000, equipment_value_cents: 300000, free_on_loan: true, shortfall_fee_cents_per_gallon: 40, expected_outlet_version: "${o10v}" }
              as: NetworkAdmin
              captures: { ag10: $.data.id }
            - call: "POST /fountain-network/dispenser-units"
              payload: { outlet_id: "${o10}", agreement_id: "${ag10}", serial_number: "SN-PP-B-01", model_code: "FREESTYLE_9100", installed_at: "2026-02-01T00:00:00Z" }
              as: NetworkAdmin
              captures: { du10: $.data.id }
            - call: "POST /fountain-network/placement-agreements/${ag10}/activate"
              payload: {}
              as: NetworkAdmin
            - call: "POST /fountain-network/van-part-stocks"
              payload: { van_code: "V-88", part_sku: "VALVE_KIT_7", on_van_units: 1 }
              as: NetworkAdmin
              captures: { vp10: $.data.id }
            - call: "POST /fountain-network/service-calls"
              payload: { dispenser_unit_id: "${du10}", reported_at: "2026-08-01T00:00:00Z", symptom_code: "LEAK" }
              as: NetworkAdmin
              captures: { sc10a: $.data.id }
            - call: "POST /fountain-network/service-calls"
              payload: { dispenser_unit_id: "${du10}", reported_at: "2026-08-01T00:00:00Z", symptom_code: "OFF_RATIO" }
              as: NetworkAdmin
              captures: { sc10b: $.data.id }
            - call: "POST /fountain-network/service-calls/${sc10a}/dispatch"
              payload: { van_code: "V-88", scheduled_window_start: "2026-08-01T09:00:00Z", scheduled_window_end: "2026-08-01T11:00:00Z", part_sku: "VALVE_KIT_7", part_units: 1 }
              as: ServiceTechnician
              as_user_id: "tech-010"
          trigger:
            - call: "POST /fountain-network/service-calls/${sc10b}/dispatch"
              payload: { van_code: "V-88", scheduled_window_start: "2026-08-01T11:20:00Z", scheduled_window_end: "2026-08-01T12:20:00Z", part_sku: "VALVE_KIT_7", part_units: 1 }
              as: ServiceTechnician
              as_user_id: "tech-011"
              captures: { err10: $.data.error_id }
          assert:
            - "${err10} == ERR_VAN_WINDOW_CONFLICT with HTTP 409 (11:20 start is inside 11:00 + 30 minutes)"
            - "${err10} != ERR_INSUFFICIENT_VAN_PARTS even though VanPartStock.${vp10}.on_van_units == 0 < part_units 1 (priority 24 beats priority 26)"
            - "ServiceCall.${sc10b}.status == OPEN, van_code == null, reserved_part_units == 0, version == 1"
            - "ServiceCall.${sc10a}.status == DISPATCHED with assigned_tech_user_id == tech-010"
            - "VanPartStock.${vp10}.on_van_units == 0, reserved_units == 1, consumed_units == 0, initial_units == 1"
            - "VanPartStock.${vp10}: on_van_units + reserved_units + consumed_units == initial_units + restocked_units == 1"

  - rule_id: boundary_precision_check
    instances:

      - name: filter_change_gallon_interval_exact_threshold_hit
        grounds:
          - calculations.maintenance_due_evaluation
          - entities.MaintenanceTask.fields.effective_gallon_interval
          - entities.MaintenanceTask.fields.breach_kind
          - entities.DispenserUnit.fields.lifetime_dispensed_gallons
          - state_machines.MaintenanceTask.SCHEDULED_to_OVERDUE
        distinguishing_aspect: |
          Boundary metric = gallons since the last filter change against effective_gallon_interval on
          POST /fountain-network/telemetry-readings: 2799.99 gallons leaves the task SCHEDULED and
          exactly 2800.00 trips it to OVERDUE, proving the comparison is >= on a 2-decimal derated
          interval rather than >.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Outlet R11 with water_hardness_gpg 25, one ACTIVE agreement, one IN_SERVICE unit with lifetime_dispensed_gallons 0.00 and gallons_at_last_filter_change 0.00."
            - "One SCHEDULED FILTER_CHANGE task, gallon_interval 4000, due_at 2027-06-01 (calendar limit far away so only the gallon limit can fire)."
            - "One BAG_IN_BOX SKU to carry the readings."
          setup_api_calls:
            - call: "POST /fountain-network/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /fountain-network/outlets"
              payload: { name: "Harbor Fish Shack", account_code: "ACCT-BP-A", region_code: "R11", throughput_tier: "MEDIUM", water_hardness_gpg: 25 }
              as: NetworkAdmin
              captures: { o11: $.data.id, o11v: $.data.version }
            - call: "POST /fountain-network/placement-agreements"
              payload: { outlet_id: "${o11}", term_start_date: "2026-01-01T00:00:00Z", term_end_date: "2027-01-01T00:00:00Z", annual_commitment_gallons: 4000, equipment_value_cents: 300000, free_on_loan: true, shortfall_fee_cents_per_gallon: 40, expected_outlet_version: "${o11v}" }
              as: NetworkAdmin
              captures: { ag11: $.data.id }
            - call: "POST /fountain-network/dispenser-units"
              payload: { outlet_id: "${o11}", agreement_id: "${ag11}", serial_number: "SN-BP-A-01", model_code: "FREESTYLE_9100", installed_at: "2026-02-01T00:00:00Z" }
              as: NetworkAdmin
              captures: { du11: $.data.id }
            - call: "POST /fountain-network/placement-agreements/${ag11}/activate"
              payload: {}
              as: NetworkAdmin
            - call: "POST /fountain-network/supply-items"
              payload: { sku_code: "COKE_BIB_BP", brand_name: "Coca-Cola", supply_form: "BAG_IN_BOX", case_pack_units: 2, ounces_per_unit: 640, promotional: false, national_allocation_units: 500 }
              as: NetworkAdmin
              captures: { si11: $.data.id }
            - call: "POST /fountain-network/maintenance-tasks"
              payload: { dispenser_unit_id: "${du11}", task_type: "FILTER_CHANGE", due_at: "2027-06-01T00:00:00Z", gallon_interval: 4000 }
              as: ComplianceOfficer
              as_user_id: "officer-050"
              captures: { mt11: $.data.id, eff11: $.data.effective_gallon_interval }
          trigger:
            - call: "POST /fountain-network/telemetry-readings"
              payload: { dispenser_unit_id: "${du11}", supply_item_id: "${si11}", dispensed_ounces: 358398.72, reading_at: "2026-08-01T00:00:00Z", window_days: 30, source: "TELEMETRY" }
              as: SupplyPlanner
            - call: "POST /fountain-network/telemetry-readings"
              payload: { dispenser_unit_id: "${du11}", supply_item_id: "${si11}", dispensed_ounces: 1.28, reading_at: "2026-08-01T00:00:00Z", window_days: 30, source: "TELEMETRY" }
              as: SupplyPlanner
          assert:
            - "${eff11} == 2800.00 (4000 * (1 - 0.02 * (25 - 10)))"
            - "After trigger[0]: DispenserUnit.${du11}.lifetime_dispensed_gallons == 2799.99 (358398.72 / 128)"
            - "After trigger[0]: MaintenanceTask.${mt11}.status == SCHEDULED and breach_kind == null (2799.99 < 2800.00)"
            - "After trigger[0]: Outlet.${o11}.overdue_task_count == 0 and service_posture == OPEN"
            - "After trigger[1]: DispenserUnit.${du11}.lifetime_dispensed_gallons == 2800.00 (+1.28 / 128 == +0.01)"
            - "After trigger[1]: MaintenanceTask.${mt11}.status == OVERDUE and breach_kind == GALLON"
            - "After trigger[1]: Outlet.${o11}.overdue_task_count == 1 and service_posture == RESTRICTED"
            - "DispenserUnit.${du11}.gallons_at_last_filter_change == 0.00 (unchanged until the task is completed)"
            - "DispenserUnit.${du11}.version == 3 (1 at creation, +1 per reading) and MaintenanceTask.${mt11}.version == 2"

