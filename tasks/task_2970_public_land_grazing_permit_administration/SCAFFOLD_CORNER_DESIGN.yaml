              payload: { name: "EA Rationale Allotment", admin_unit_code: "NV-121", acres: 15000, total_permitted_aums: 520, season_start: "01-01", season_end: "12-31", required_pasture_rotation_count: 1 }
              as: AuthorizedOfficer
