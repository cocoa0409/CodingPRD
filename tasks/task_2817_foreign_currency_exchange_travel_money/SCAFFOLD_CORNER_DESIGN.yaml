        distinguishing_aspect: "The publish trigger is not idempotent: the second call on the same card returns ERR_RATE_CARD_NOT_DRAFT with HTTP 409 and leaves published_at at the first call's value even though the clock has since advanced to 2026-08-02T00:00:00Z."
