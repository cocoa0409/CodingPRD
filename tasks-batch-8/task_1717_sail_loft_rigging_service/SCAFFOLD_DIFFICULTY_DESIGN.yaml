  # ===========================================================================
  # Rule 9 — compensating_invariant (different conserved quantities)
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: cloth_available_sqm_restored_after_qc_pass_release
        grounds:
          - entities.ClothLedgerEntry.fields.available_sqm
          - state_machines.ProductionJob.FINISHING_to_QC_PASSED
        distinguishing_aspect: |
          Conserved quantity ClothLedgerEntry.available_sqm: scheduling a job
          debits available_sqm by reserved_cloth_sqm, and qc-pass releases it —
          forward action + compensating action MUST return available_sqm to
          exactly its pre-scheduling value.
        test_recipe:
          setup:
            - "CRUISE bolt17 total 500.0 → available 500.0; WO17 locked; PJ17 scheduled reserving 61.50 (available 438.50), then driven to FINISHING"
