  - rule_id: priority_pair_validation_conflict
    instances:

      - name: referential_scope_outranks_call_state_on_settle
        grounds:
          - validations[priority=5]
          - validations[priority=6]
          - errors[ERR_FORBIDDEN_SCOPE]
          - errors[ERR_CALL_NOT_ISSUED]
          - endpoints.POST_/capital-calls/{call_id}/transitions
        distinguishing_aspect: "The business_referential rule at priority 5 outranks the state rule at priority 6, so a settle that both acts on another fund's call and hits a call that was never issued returns ERR_FORBIDDEN_SCOPE, not ERR_CALL_NOT_ISSUED."
        test_recipe:
          setup:
            - "Two funds exist: ECP Housing Fund IV and ECP Housing Fund V."
            - "Investor Meridian Capital Group holds the only subscription, and it is in Fund IV."
            - "Capital call C is SCHEDULED on a project funded by Fund V."
            - "The logical clock is 2026-09-02T00:00:00Z."
          setup_api_calls:
            - *clock_0902
            - *dev_cedar
            - *inv_meridian
            - *fund_iv
            - call: "POST /funds"
              payload: { fund_name: "ECP Housing Fund V", target_equity_cents: 400000000, price_per_credit_dollar: 0.9050, target_yield_pct: 0.065, close_threshold_pct: 0.85, subscription_open_date: "2026-09-01T00:00:00Z", subscription_close_date: "2027-06-30T00:00:00Z" }
              as: Underwriter
              captures: { fund5_id: $.data.id }
            - call: "POST /funds/${fund_id}/subscriptions"
              payload: { investor_id: "${inv_id}", committed_cents: 460000000, payin_schedule: [{ milestone: "CONSTRUCTION_START", share_pct: 0.2 }, { milestone: "CONSTRUCTION_50PCT", share_pct: 0.2 }, { milestone: "LEASE_UP_50PCT", share_pct: 0.2 }, { milestone: "LEASE_UP_STABILIZED", share_pct: 0.2 }, { milestone: "PLACED_IN_SERVICE", share_pct: 0.2 }], expected_fund_version: "${fund_after_create}" }
              as: Investor
              as_user_id: "${inv_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /projects"
              payload: { developer_id: "${dev_id}", fund_id: "${fund5_id}", project_name: "Harbor Light", state_code: "WA", total_credit_dollars_cents: 500000000, construction_budget_cents: 900000000, construction_loan_cents: 400000000, operating_pro_forma_noi_cents: 60000000, debt_service_cents: 50000000, market_study_absorption_score: 0.77, sponsor_experience_months: 96, placed_in_service_deadline: "2029-12-31T00:00:00Z", compliance_period_months: 180 }
              as: Underwriter
              captures: { proj5_id: $.data.id, proj5_version: $.data.version }
            - call: "POST /projects/${proj5_id}/capital-calls"
              payload: { milestone: "CONSTRUCTION_START", scheduled_date: "2026-10-01T00:00:00Z", due_date: "2026-10-31T00:00:00Z", milestone_share: 0.2, expected_project_version: "${proj5_version}" }
              as: AssetManager
              captures: { call5_id: $.data.id }
          trigger:
            - call: "POST /capital-calls/${call5_id}/transitions"
              payload: { action: "SETTLE", funded_amount_cents: 1000000 }
              as: Investor
              as_user_id: "${inv_id}"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 403 and error_id == ERR_FORBIDDEN_SCOPE"
            - "the response error_id is NOT ERR_CALL_NOT_ISSUED and NOT ERR_INVALID_REQUEST"
            - "CapitalCall.${call5_id}.status == SCHEDULED"
            - "CapitalCall.${call5_id}.settled_amount_cents == 0"

      - name: fiscal_capacity_outranks_subscription_window_on_late_subscription
        grounds:
          - validations[priority=9]
          - validations[priority=10]
          - errors[ERR_SUBSCRIPTION_EXCEEDS_CAPACITY]
          - errors[ERR_SUBSCRIPTION_WINDOW_CLOSED]
          - endpoints.POST_/funds/{fund_id}/subscriptions
        distinguishing_aspect: "The business_fiscal rule at priority 9 outranks the business_temporal rule at priority 10, so a subscription that both overshoots the investor's remaining capacity and lands after the fund's close date returns ERR_SUBSCRIPTION_EXCEEDS_CAPACITY, not ERR_SUBSCRIPTION_WINDOW_CLOSED."
        test_recipe:
          setup:
            - "Fund ECP Housing Fund IV has a 460000000-cent subscription from Meridian Capital Group, which leaves 40000000 cents of that investor's 500000000-cent capacity uncommitted."
            - "The subscription window closed on 2026-12-31, so the fund moved to CLOSED."
            - "The logical clock is 2027-01-15T00:00:00Z, past the window."
          setup_api_calls:
            - *clock_0902
            - *dev_cedar
            - *inv_meridian
            - *fund_iv
            - call: "POST /funds/${fund_id}/subscriptions"
