# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3411_proprietary_variety_licensing_independent_growers_quality_grading
# 9 rules x >=2 instances = 19 instances. All money literals precomputed by code.
# Canonical pool scenario (instances that alias the &k_ chain):
#   H1 net 1150 PREMIUM (wkg 1322.5, compliant); H2 net 800 STANDARD (breach 9h);
#   H3 net 2000 STANDARD (grower G2). Pool STRAWBERRY 2026-10-05..2026-10-12.
#   Provisional @500c: gross 1975000, fee 118500, net 1856500, rate 450.3335.
#   Final @520c: gross 2054000, fee 123240, net 1930760, rate 468.3469,
#   distributable 1930760, remainder -1 absorbed by H3.
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: pool_rate_provisional_vs_final
        grounds:
          - calculations.pool_rate
          - state_machines.PoolPeriod.OPEN_to_CLOSED
          - state_machines.PoolPeriod.CLOSED_to_SETTLED
          - entities.PoolPeriod.fields.provisional_pool_rate
          - entities.PoolPeriod.fields.final_pool_rate
          - entities.HarvestLot.fields.lot_gross_provisional_cents
          - entities.HarvestLot.fields.lot_gross_final_cents
        distinguishing_aspect: |
          Pool economics on PoolPeriod/HarvestLot (settlement domain): the SAME three certified
          lots price at 450.3335 cents per weighted kg under the estimated price at close and at
          468.3469 under the actual price at settle — two valid algorithm passes over identical
          lot data produce different money, and both results persist side by side
          (lot_gross_provisional_cents vs lot_gross_final_cents).
        test_recipe:
          setup:
            - "Variety V1 (STRAWBERRY) RELEASED; growers G1 and G2 ACTIVE with ACTIVE agreements A1/A2 (region CA-SALINAS, max 100000 units each)."
            - "Harvest window W1 [2026-09-28, 2026-10-05) target 10000 covers the 2026-09-30 expected first harvest of both plantings."
            - "G1 planting P1 confirmed 1500 plants (yield 3750 kg booked); G2 planting P2 confirmed 2500 plants (yield 6250 kg; window booked 10000 of 12000 cap)."
            - "H1 (G1): net 1150 kg, received 6h00m after harvest, pulp 3.5C, certified PREMIUM. H2 (G1): net 800 kg, received 9h00m after harvest (9.0 > 8.0) -> cold-chain breach, certified STANDARD. H3 (G2): net 2000 kg, compliant, certified STANDARD."
            - "Pool STRAWBERRY [2026-10-05, 2026-10-12) not shoulder; closed with estimated price 500c/kg -> provisional pipeline stored."
          setup_api_calls:
            - &k_clock0
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - &k_v1
              call: "POST /licensing/varieties"
              payload: { variety_code: "BRB-STR-01", berry_type: "STRAWBERRY", name: "Cielo Rojo" }
              as: BreedingManager
              captures: { v1_id: $.data.id }
            - &k_v1_rel
              call: "POST /licensing/varieties/${v1_id}/release"
              payload: {}
              as: BreedingManager
            - &k_g1
              call: "POST /licensing/growers"
              payload: { legal_name: "Mesa Verde Farms", region_code: "CA-SALINAS" }
              as: PlatformAdmin
              captures: { g1_id: $.data.id }
            - &k_a1
              call: "POST /licensing/agreements"
              payload: { grower_id: "${g1_id}", variety_id: "${v1_id}", region_code: "CA-SALINAS", max_planting_units: 100000, cultural_practice_codes: ["ORGANIC", "DRIP_IRRIGATION"], effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-12-31T00:00:00Z", exclusive_marketing: true }
              as: GrowerPrincipal
              as_user_id: "${g1_id}"
              captures: { a1_id: $.data.id }
            - &k_a1_dec
              call: "POST /licensing/agreements/${a1_id}/decide"
              payload: { decision: "APPROVE" }
              as: ComplianceOfficer
              captures: { a1_v: $.data.version }
            - &k_l1
              call: "POST /licensing/plant-lots"
              payload: { nursery_code: "NUR-CA-01", agreement_id: "${a1_id}", variety_id: "${v1_id}", quantity_plants: 2000 }
              as: NurseryManager
              captures: { l1_id: $.data.id }
            - &k_w1
              call: "POST /licensing/harvest-windows"
              payload: { region_code: "CA-SALINAS", variety_id: "${v1_id}", week_start: "2026-09-28T00:00:00Z", week_end: "2026-10-05T00:00:00Z", target_volume_kg: 10000 }
              as: PlatformAdmin
              captures: { w1_id: $.data.id }
            - &k_p1
              call: "POST /licensing/plantings"
              payload: { agreement_id: "${a1_id}", plant_lot_id: "${l1_id}", planned_plants: 1500, expected_agreement_version: "${a1_v}" }
              as: GrowerPrincipal
              as_user_id: "${g1_id}"
              captures: { p1_id: $.data.id }
            - &k_clock_aug
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-02T00:00:00Z" }
              as: PlatformAdmin
            - &k_p1_conf
