            - "${err_both} == ERR_HELD_LOCALLY with HTTP 422 — priority 55 wins over priority 80"
            - "${err_fiscal} == ERR_PATRON_BALANCE_EXCEEDED with HTTP 402 — the fiscal rule was genuinely violated on both calls"
            - "Patron.${patron_id}.open_request_count == 0 and Patron.${patron_id}.pending_charge_cents == 0"
            - "GET /ill/requests?patron_id=${patron_id} returns total_count == 0 — neither refused call created an IllRequest row"
            - "No PatronNotification row exists for this patron at all, so there is nothing for a notifications read to return — the refused intake wrote no request and therefore no notification"

