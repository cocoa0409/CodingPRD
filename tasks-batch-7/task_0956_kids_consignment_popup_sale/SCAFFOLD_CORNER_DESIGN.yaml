        claim_type: violation_to_error
        grounds: ["errors[ERR_SETTLEMENTS_LOCKED]", "validations[priority=5]"]
        distinguishing_aspect: "Once any settlement of the event is FINALIZED, regeneration is forbidden: ERR_SETTLEMENTS_LOCKED (state, priority 5) even with the correct current version."
        test_recipe:
          setup: ["Event in SETTLEMENT; one consignor with a REJECTED item; settlement generated and FINALIZED."]
          setup_api_calls:
