      - name: empty_partner_pool_generate_returns_empty
        grounds:
          - calculations.partner_allocation_waterfall
          - endpoints.POST_partner-allocations_generate
          - entities.OutsourcePartner.fields.skill_codes
          - entities.IntervalPlan.fields.unserved_volume
        distinguishing_aspect: |
          The waterfall runs against an interval whose skill is CHAT_EN while the only partner in
          the system is scoped to VOICE_EN, so the candidate set is empty. The endpoint must still
          answer 201 with an empty data array rather than erroring or 404ing, and the interval's
          unserved_volume must stay at the full 82 with partner_committed_volume 0.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z."
            - "OPEN cycle W37-EMPTY plus CHAT/CHAT_EN group FG-P (base 164, aht 120, curve [0.5,0.5], operating 480..540): two intervals of 82 contacts, no published agents, so allocatable_volume 82 and unserved_volume 82."
            - "One ACTIVE partner whose skill_codes is [VOICE_EN] only."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: SourcingManager
              as_user_id: "u-src-1"
            - call: "POST /planning-cycles"
              payload: { name: "W37-EMPTY", horizon_start_date: "2026-09-07", horizon_end_date: "2026-09-13", interval_minutes: 30, requirement_basis: "MAX_OF_BOTH", ot_budget_cents: 1000000, intraday_alert_short_threshold: 99 }
              as: CapacityPlanner
