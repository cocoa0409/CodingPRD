# =============================================================================
# §1.8 Scaffold Difficulty Design — task_1826_potato_storage_packing_shed
# Test Targeting Index: 2+ instances per Difficulty Rule (19 instances total;
# combinatorial_formula carries 3, one per mode (a)/(b)/(c)).
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: settlement_provisional_vs_final_packout_basis
        grounds:
          - calculations.grower_settlement
          - calculations.pool_price
          - calculations.storage_fee
          - entities.GrowerSettlement.fields.packed_cwt_basis
          - state_machines.GrowerSettlement.PROVISIONAL_to_FINALIZED
        distinguishing_aspect: |
          Same grower, same lots, same sales history: the PROVISIONAL variant prices an
          assessment-estimated packout basis (882.00 cwt) at the CONTRACT_BLEND fallback pool,
          while the FINAL variant prices actual packed_to_date (200.00 cwt) at the realized pool —
          net_payable_cents 1706000 vs 317000. Entity domain: grower settlement economics.
        test_recipe:
          setup:
            - "Grower G with one RUSSET_BURBANK lot of 1000.00 cwt, binned 2026-08-02, assessed 70/20/10 with 20.00 cwt cumulative shrink (packable fraction 0.9), one inhibitor application"
            - "ACTIVE contract: committed 500.00 @ 2000 cents/cwt, window 2026-08-01..2026-12-01"
            - "Settlement S created PROVISIONAL at clock 2026-08-30 (4 storage weeks accrued)"
            - "Then a CONTRACT order for 200.00 packed cwt ships exactly 200.00 (draw raw 222.22, cull 22.22), and the lot remnant (757.78) is condemned WASTE at clock 2026-09-13 (6 total storage weeks), closing the lot"
          setup_api_calls:
            - { call: "POST /potato-shed/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T00:00:00Z" }, as: ShedAdmin }
            - { call: "POST /potato-shed/growers", payload: { name: "Grower One", grower_code: "G-ONE" }, as: ShedAdmin, captures: { g_id: "$.data.id", g_v: "$.data.version" } }
            - { call: "POST /potato-shed/sheds", payload: { name: "Shed A" }, as: ShedAdmin, captures: { s_id: "$.data.id" } }
            - { call: "POST /potato-shed/sheds/${s_id}/bins", payload: { bin_code: "B-1", capacity_cwt: 2000.00 }, as: ShedAdmin, captures: { b_id: "$.data.id" } }
            - { call: "POST /potato-shed/growers/${g_id}/field-lots", payload: { variety: "RUSSET_BURBANK", harvest_date: "2026-07-28", original_weight_cwt: 1000.00 }, as: IntakeClerk, captures: { l_id: "$.data.id" } }
            - { call: "POST /potato-shed/field-lots/${l_id}/bin-assignment", payload: { bin_id: "${b_id}" }, as: IntakeClerk, captures: { l_v: "$.data.version" } }
            - { call: "POST /potato-shed/field-lots/${l_id}/assessments", payload: { assessment_date: "2026-08-02", us1_pct: 70.0, us2_pct: 20.0, cull_pct: 10.0, cumulative_shrink_cwt: 20.00, expected_field_lot_version: "${l_v}" }, as: StorageManager }
            - { call: "POST /potato-shed/field-lots/${l_id}/sprout-inhibitor-applications", payload: { applied_at: "2026-08-02T00:00:00Z" }, as: StorageManager }
            - { call: "POST /potato-shed/contracts", payload: { buyer_name: "Buyer A", variety: "RUSSET_BURBANK", committed_volume_cwt: 500.00, price_cents_per_cwt: 2000, grade_min_us1_pct: 80.0, delivery_window_start: "2026-08-01T00:00:00Z", delivery_window_end: "2026-12-01T00:00:00Z", priority_rank: 1 }, as: SalesManager, captures: { c_id: "$.data.id" } }
            - { call: "POST /potato-shed/_clock/set_current_utc", payload: { to_iso8601: "2026-08-30T00:00:00Z" }, as: ShedAdmin }
            - { call: "POST /potato-shed/growers/${g_id}/settlements", payload: { season_label: "2026-storage", expected_grower_version: "${g_v}" }, as: SettlementClerk, captures: { st_id: "$.data.id", prov_basis: "$.data.packed_cwt_basis", prov_pool: "$.data.pool_price_cents", prov_gross: "$.data.gross_cents", prov_fee: "$.data.storage_fees_cents", prov_inh: "$.data.inhibitor_fees_cents", prov_net: "$.data.net_payable_cents" } }
            - { call: "POST /potato-shed/pack-orders", payload: { order_type: "CONTRACT", contract_id: "${c_id}", shed_id: "${s_id}", variety: "RUSSET_BURBANK", pack_unit_weight_lbs: 50, grade_min_us1_pct: 80.0, requested_packed_cwt: 200.00, allocation_policy: "LOT_ASSESSMENT" }, as: SalesManager, captures: { o_id: "$.data.id" } }
            - { call: "POST /potato-shed/pack-orders/${o_id}/allocate", payload: {}, as: SalesManager }
            - { call: "POST /potato-shed/sheds/${s_id}/wash-water-checks", payload: { measured_at: "2026-08-30T00:00:00Z", turbidity_ntu: 2.0, chlorine_ppm: 100, water_temp_f: 50 }, as: QualityAssuranceManager }
            - { call: "POST /potato-shed/pack-orders/${o_id}/pack-runs", payload: { scheduled_start: "2026-08-30T08:00:00Z", scheduled_end: "2026-08-30T10:00:00Z" }, as: PackLineSupervisor, captures: { r_id: "$.data.id" } }
            - { call: "POST /potato-shed/pack-runs/${r_id}/close", payload: { outcome: "COMPLETED", draws: [ { field_lot_id: "${l_id}", raw_drawn_cwt: 222.22, packed_cwt: 200.00, us1_cwt: 170.00, us2_cwt: 30.00, cull_cwt: 22.22, cull_channel: "WASTE" } ] }, as: PackLineSupervisor }
            - { call: "POST /potato-shed/field-lots/${l_id}/quality-transition", payload: { to_status: "ON_HOLD" }, as: QualityAssuranceManager }
            - { call: "POST /potato-shed/_clock/set_current_utc", payload: { to_iso8601: "2026-09-13T00:00:00Z" }, as: ShedAdmin }
            - { call: "POST /potato-shed/field-lots/${l_id}/quality-transition", payload: { to_status: "CONDEMNED", diversion_channel: "WASTE" }, as: QualityAssuranceManager }
          trigger:
            - { call: "POST /potato-shed/settlements/${st_id}/finalize", payload: {}, as: SettlementClerk, as_user_id: "clerk_one", captures: { fin_basis: "$.data.packed_cwt_basis", fin_pool: "$.data.pool_price_cents", fin_gross: "$.data.gross_cents", fin_fee: "$.data.storage_fees_cents", fin_net: "$.data.net_payable_cents", fin_status: "$.data.status" } }
          assert:
            - "provisional captures: packed_cwt_basis == 882.00 (980.00 available x 0.9 assessment fraction), pool_price_cents == 2000 (CONTRACT_BLEND fallback), gross_cents == 1764000, storage_fees_cents == 50000.00 (12.5 x 1000.00 x 4 weeks), inhibitor_fees_cents == 8000.00, net_payable_cents == 1706000"
            - "final captures: packed_cwt_basis == 200.00 (actuals only), pool_price_cents == 2000 (realized SHIPPED pool), gross_cents == 400000, storage_fees_cents == 75000.00 (6 weeks), net_payable_cents == 317000"
            - "fin_status == FINALIZED and 1706000 != 317000: identical history, two variants, different money"

      - name: raw_draw_lot_assessment_vs_shed_blend
        grounds:
          - calculations.expected_packout_fraction
          - calculations.allocation_waterfall
          - entities.PackOrder.fields.allocation_policy
          - entities.PackOrder.fields.reservations
        distinguishing_aspect: |
          Two identical 100.00-packed-cwt CONTRACT orders against the same pool: LOT_ASSESSMENT
          sizes the raw draw with the lot's own assessment fraction 0.80 (raw 125.00), SHED_BLEND
          uses the 0.75 default blend (raw 75.00 on the depleted first lot + 58.33 on the second).
          Entity domain: allocation/raw-draw estimation (distinct from settlement economics).
        test_recipe:
          setup:
            - "Shed S with bin B1 (capacity 2000); lot A RUSSET_BURBANK 200.00 cwt harvest 2026-07-20 assessed 60/20/20 (fraction 0.80, shrink 0); lot B same variety 300.00 cwt harvest 2026-07-25 assessed 40/20/40 (fraction 0.60, shrink 0)"
            - "ACTIVE contract committed 1000.00 @ 2500, window 2026-08-01..2026-12-01"
            - "No COMPLETED pack run exists, so SHED_BLEND resolves to the 0.75 default"
          setup_api_calls:
            - { call: "POST /potato-shed/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T00:00:00Z" }, as: ShedAdmin }
            - { call: "POST /potato-shed/growers", payload: { name: "Grower Two", grower_code: "G-TWO" }, as: ShedAdmin, captures: { g_id: "$.data.id" } }
            - { call: "POST /potato-shed/sheds", payload: { name: "Shed B" }, as: ShedAdmin, captures: { s_id: "$.data.id" } }
            - { call: "POST /potato-shed/sheds/${s_id}/bins", payload: { bin_code: "B-1", capacity_cwt: 2000.00 }, as: ShedAdmin, captures: { b_id: "$.data.id" } }
            - { call: "POST /potato-shed/growers/${g_id}/field-lots", payload: { variety: "RUSSET_BURBANK", harvest_date: "2026-07-20", original_weight_cwt: 200.00 }, as: IntakeClerk, captures: { la_id: "$.data.id" } }
            - { call: "POST /potato-shed/field-lots/${la_id}/bin-assignment", payload: { bin_id: "${b_id}" }, as: IntakeClerk, captures: { la_v: "$.data.version" } }
            - { call: "POST /potato-shed/field-lots/${la_id}/assessments", payload: { assessment_date: "2026-08-02", us1_pct: 60.0, us2_pct: 20.0, cull_pct: 20.0, cumulative_shrink_cwt: 0.00, expected_field_lot_version: "${la_v}" }, as: StorageManager }
            - { call: "POST /potato-shed/growers/${g_id}/field-lots", payload: { variety: "RUSSET_BURBANK", harvest_date: "2026-07-25", original_weight_cwt: 300.00 }, as: IntakeClerk, captures: { lb_id: "$.data.id" } }
            - { call: "POST /potato-shed/field-lots/${lb_id}/bin-assignment", payload: { bin_id: "${b_id}" }, as: IntakeClerk, captures: { lb_v: "$.data.version" } }
            - { call: "POST /potato-shed/field-lots/${lb_id}/assessments", payload: { assessment_date: "2026-08-02", us1_pct: 40.0, us2_pct: 20.0, cull_pct: 40.0, cumulative_shrink_cwt: 0.00, expected_field_lot_version: "${lb_v}" }, as: StorageManager }
            - { call: "POST /potato-shed/contracts", payload: { buyer_name: "Buyer B", variety: "RUSSET_BURBANK", committed_volume_cwt: 1000.00, price_cents_per_cwt: 2500, grade_min_us1_pct: 50.0, delivery_window_start: "2026-08-01T00:00:00Z", delivery_window_end: "2026-12-01T00:00:00Z", priority_rank: 1 }, as: SalesManager, captures: { c_id: "$.data.id" } }
            - { call: "POST /potato-shed/pack-orders", payload: { order_type: "CONTRACT", contract_id: "${c_id}", shed_id: "${s_id}", variety: "RUSSET_BURBANK", pack_unit_weight_lbs: 50, grade_min_us1_pct: 50.0, requested_packed_cwt: 100.00, allocation_policy: "LOT_ASSESSMENT" }, as: SalesManager, captures: { o1_id: "$.data.id" } }
            - { call: "POST /potato-shed/pack-orders", payload: { order_type: "CONTRACT", contract_id: "${c_id}", shed_id: "${s_id}", variety: "RUSSET_BURBANK", pack_unit_weight_lbs: 50, grade_min_us1_pct: 50.0, requested_packed_cwt: 100.00, allocation_policy: "SHED_BLEND" }, as: SalesManager, captures: { o2_id: "$.data.id" } }
          trigger:
            - { call: "POST /potato-shed/pack-orders/${o1_id}/allocate", payload: {}, as: SalesManager, captures: { o1_res: "$.data.reservations" } }
            - { call: "POST /potato-shed/pack-orders/${o2_id}/allocate", payload: {}, as: SalesManager, captures: { o2_res: "$.data.reservations" } }
          assert:
            - "o1_res == [ { field_lot_id: ${la_id}, raw_cwt: 125.00, packed_equiv_cwt: 100.00 } ] (100 / 0.80, single-lot cover)"
            - "o2_res == [ { field_lot_id: ${la_id}, raw_cwt: 75.00, packed_equiv_cwt: 56.25 }, { field_lot_id: ${lb_id}, raw_cwt: 58.33, packed_equiv_cwt: 43.75 } ] (blend 0.75 over lot A's remaining 75.00 allocatable, then lot B)"
            - "FieldLot.${la_id}.reserved_cwt == 200.00 (125.00 + 75.00) and FieldLot.${lb_id}.reserved_cwt == 58.33"
            - "identical requested_packed_cwt, different policy -> total raw 125.00 vs 133.33"

  - rule_id: combinatorial_formula
    instances:
      - name: open_market_cap_net_of_contract_commitments
        grounds:
          - calculations.open_market_cap
          - calculations.allocation_waterfall
          - errors[ERR_OPEN_MARKET_CAP_EXCEEDED]
        distinguishing_aspect: |
          Mode (a): cap = max(0, sum of per-lot min-scaled assessment estimates (400x0.8 + 100x0.6)
          minus sum of ACTIVE-contract remaining commitments (200 + 100)) = 80.00 — nested max/min
          over 3+ inputs with state-filtered aggregation; requesting exactly 80.00 succeeds and a
          follow-up 0.01 request fails because order 1's reservation itself shrinks the cap to 0.
        test_recipe:
          setup:
            - "Shed S, bin cap 2000; lot1 RUSSET_BURBANK 400.00 harvest 2026-07-20 assessed 60/20/20 (f 0.80); lot2 RUSSET_BURBANK 100.00 harvest 2026-07-22 assessed 40/20/40 (f 0.60)"
            - "ACTIVE contracts C1 committed 200.00 @ 2000 and C2 committed 100.00 @ 3000, same variety, windows 2026-08-01..2026-12-01"
            - "open-market cap = max(0, 320.00 + 60.00 - 300.00) = 80.00 packed cwt"
          setup_api_calls:
            - { call: "POST /potato-shed/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T00:00:00Z" }, as: ShedAdmin }
            - { call: "POST /potato-shed/growers", payload: { name: "Grower Three", grower_code: "G-THREE" }, as: ShedAdmin, captures: { g_id: "$.data.id" } }
            - { call: "POST /potato-shed/sheds", payload: { name: "Shed C" }, as: ShedAdmin, captures: { s_id: "$.data.id" } }
            - { call: "POST /potato-shed/sheds/${s_id}/bins", payload: { bin_code: "B-1", capacity_cwt: 2000.00 }, as: ShedAdmin, captures: { b_id: "$.data.id" } }
            - { call: "POST /potato-shed/growers/${g_id}/field-lots", payload: { variety: "RUSSET_BURBANK", harvest_date: "2026-07-20", original_weight_cwt: 400.00 }, as: IntakeClerk, captures: { l1_id: "$.data.id" } }
            - { call: "POST /potato-shed/field-lots/${l1_id}/bin-assignment", payload: { bin_id: "${b_id}" }, as: IntakeClerk, captures: { l1_v: "$.data.version" } }
            - { call: "POST /potato-shed/field-lots/${l1_id}/assessments", payload: { assessment_date: "2026-08-02", us1_pct: 60.0, us2_pct: 20.0, cull_pct: 20.0, cumulative_shrink_cwt: 0.00, expected_field_lot_version: "${l1_v}" }, as: StorageManager }
            - { call: "POST /potato-shed/growers/${g_id}/field-lots", payload: { variety: "RUSSET_BURBANK", harvest_date: "2026-07-22", original_weight_cwt: 100.00 }, as: IntakeClerk, captures: { l2_id: "$.data.id" } }
            - { call: "POST /potato-shed/field-lots/${l2_id}/bin-assignment", payload: { bin_id: "${b_id}" }, as: IntakeClerk, captures: { l2_v: "$.data.version" } }
            - { call: "POST /potato-shed/field-lots/${l2_id}/assessments", payload: { assessment_date: "2026-08-02", us1_pct: 40.0, us2_pct: 20.0, cull_pct: 40.0, cumulative_shrink_cwt: 0.00, expected_field_lot_version: "${l2_v}" }, as: StorageManager }
            - { call: "POST /potato-shed/contracts", payload: { buyer_name: "Buyer C1", variety: "RUSSET_BURBANK", committed_volume_cwt: 200.00, price_cents_per_cwt: 2000, grade_min_us1_pct: 50.0, delivery_window_start: "2026-08-01T00:00:00Z", delivery_window_end: "2026-12-01T00:00:00Z", priority_rank: 1 }, as: SalesManager }
            - { call: "POST /potato-shed/contracts", payload: { buyer_name: "Buyer C2", variety: "RUSSET_BURBANK", committed_volume_cwt: 100.00, price_cents_per_cwt: 3000, grade_min_us1_pct: 50.0, delivery_window_start: "2026-08-01T00:00:00Z", delivery_window_end: "2026-12-01T00:00:00Z", priority_rank: 2 }, as: SalesManager }
            - { call: "POST /potato-shed/pack-orders", payload: { order_type: "OPEN_MARKET", shed_id: "${s_id}", variety: "RUSSET_BURBANK", pack_unit_weight_lbs: 50, grade_min_us1_pct: 50.0, requested_packed_cwt: 80.00, allocation_policy: "LOT_ASSESSMENT", market_price_cents_per_cwt: 2800 }, as: SalesManager, captures: { o1_id: "$.data.id" } }
            - { call: "POST /potato-shed/pack-orders", payload: { order_type: "OPEN_MARKET", shed_id: "${s_id}", variety: "RUSSET_BURBANK", pack_unit_weight_lbs: 50, grade_min_us1_pct: 50.0, requested_packed_cwt: 0.01, allocation_policy: "LOT_ASSESSMENT", market_price_cents_per_cwt: 2800 }, as: SalesManager, captures: { o2_id: "$.data.id" } }
          trigger:
            - { call: "POST /potato-shed/pack-orders/${o1_id}/allocate", payload: {}, as: SalesManager, captures: { o1_res: "$.data.reservations", o1_status: "$.data.status" } }
            - { call: "POST /potato-shed/pack-orders/${o2_id}/allocate", payload: {}, as: SalesManager, captures: { o2_err: "$.data.error_id" } }
          assert:
            - "o1_status == ALLOCATED and o1_res == [ { field_lot_id: ${l1_id}, raw_cwt: 100.00, packed_equiv_cwt: 80.00 } ] (80/0.80, waterfall takes earliest-harvest lot first)"
            - "o2_err == ERR_OPEN_MARKET_CAP_EXCEEDED: after o1 reserved 100.00 raw, cap recomputes to max(0, round(300x0.8,2) + 60.00 - 300.00) = 0.00 and 0.01 > 0.00"

      - name: settlement_fee_per_lot_round_then_sum
        grounds:
          - calculations.storage_fee
          - calculations.grower_settlement
          - entities.GrowerSettlement.fields.storage_fees_cents
        distinguishing_aspect: |
          Mode (b): the 12.5-cent/cwt/week rate produces a 1250.125-cent product per lot
          (100.01 cwt x 1 week); pinned order rounds each lot first (1250.13 + 1250.13 = 2500.26)
          while sum-then-round would give 2500.25 — a one-cent divergence the scaffold pins.
        test_recipe:
          setup:
            - "Grower G with two RUSSET_BURBANK lots P and Q, each 100.01 cwt, binned 2026-08-05, one inhibitor application each"
            - "both lots condemned WASTE at clock 2026-08-12T00:00:00Z (exactly 7 days -> 1 completed storage week), closing them with zero packed"
          setup_api_calls:
            - { call: "POST /potato-shed/_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T00:00:00Z" }, as: ShedAdmin }
            - { call: "POST /potato-shed/growers", payload: { name: "Grower Four", grower_code: "G-FOUR" }, as: ShedAdmin, captures: { g_id: "$.data.id", g_v: "$.data.version" } }
            - { call: "POST /potato-shed/sheds", payload: { name: "Shed D" }, as: ShedAdmin, captures: { s_id: "$.data.id" } }
            - { call: "POST /potato-shed/sheds/${s_id}/bins", payload: { bin_code: "B-1", capacity_cwt: 2000.00 }, as: ShedAdmin, captures: { b_id: "$.data.id" } }
            - { call: "POST /potato-shed/growers/${g_id}/field-lots", payload: { variety: "RUSSET_BURBANK", harvest_date: "2026-07-28", original_weight_cwt: 100.01 }, as: IntakeClerk, captures: { lp_id: "$.data.id" } }
            - { call: "POST /potato-shed/field-lots/${lp_id}/bin-assignment", payload: { bin_id: "${b_id}" }, as: IntakeClerk }
            - { call: "POST /potato-shed/field-lots/${lp_id}/sprout-inhibitor-applications", payload: { applied_at: "2026-08-05T00:00:00Z" }, as: StorageManager }
            - { call: "POST /potato-shed/growers/${g_id}/field-lots", payload: { variety: "RUSSET_BURBANK", harvest_date: "2026-07-28", original_weight_cwt: 100.01 }, as: IntakeClerk, captures: { lq_id: "$.data.id" } }
            - { call: "POST /potato-shed/field-lots/${lq_id}/bin-assignment", payload: { bin_id: "${b_id}" }, as: IntakeClerk }
            - { call: "POST /potato-shed/field-lots/${lq_id}/sprout-inhibitor-applications", payload: { applied_at: "2026-08-05T00:00:00Z" }, as: StorageManager }
            - { call: "POST /potato-shed/_clock/set_current_utc", payload: { to_iso8601: "2026-08-12T00:00:00Z" }, as: ShedAdmin }
            - { call: "POST /potato-shed/field-lots/${lp_id}/quality-transition", payload: { to_status: "ON_HOLD" }, as: QualityAssuranceManager }
            - { call: "POST /potato-shed/field-lots/${lp_id}/quality-transition", payload: { to_status: "CONDEMNED", diversion_channel: "WASTE" }, as: QualityAssuranceManager }
            - { call: "POST /potato-shed/field-lots/${lq_id}/quality-transition", payload: { to_status: "ON_HOLD" }, as: QualityAssuranceManager }
            - { call: "POST /potato-shed/field-lots/${lq_id}/quality-transition", payload: { to_status: "CONDEMNED", diversion_channel: "WASTE" }, as: QualityAssuranceManager }
            - { call: "POST /potato-shed/growers/${g_id}/settlements", payload: { season_label: "2026-storage", expected_grower_version: "${g_v}" }, as: SettlementClerk, captures: { st_id: "$.data.id" } }
          trigger:
            - { call: "POST /potato-shed/settlements/${st_id}/finalize", payload: {}, as: SettlementClerk, as_user_id: "clerk_one", captures: { fee: "$.data.storage_fees_cents", inh: "$.data.inhibitor_fees_cents", gross: "$.data.gross_cents", net: "$.data.net_payable_cents" } }
          assert:
            - "fee == 2500.26 (per-lot round_half_up(12.5 x 100.01 x 1) = 1250.13, summed twice); sum-then-round would be 2500.25"
            - "inh == 1600.16 (2 x 800.08), gross == 0 (zero packed basis), net == -4100.42 (negative net allowed: grower owes the shed)"

      - name: pool_price_evaluation_order_pinning
        grounds:
          - calculations.pool_price
          - calculations.grower_settlement
          - entities.GrowerSettlement.fields.pool_price_cents
        distinguishing_aspect: |
          Mode (c): the pool price that prices grower G1's settlement includes G1's own SHIPPED
          contract sale (100 @ 2000) plus G2's SHIPPED open-market sale (100 @ 3000) -> 2500 cents,
          NOT G1's contract price 2000; evaluation order is pinned pool-first, and provisional
          settlements never feed the pool.
        test_recipe:
          setup:
            - "Growers G1 (lot L1 RUSSET_BURBANK 500.00, harvest 2026-07-20, no assessment) and G2 (lot L2 same variety 500.00, harvest 2026-07-21), one shed, bin cap 5000"
            - "Contract C1 committed 100.00 @ 2000 (window to 2026-12-01); order O1 CONTRACT 100.00 SHED_BLEND ships raw 133.34 -> packed 100.00 (us1 90 / us2 10, cull 33.34)"
            - "Order O2 OPEN_MARKET 100.00 @ 3000 SHED_BLEND ships another raw 133.34 -> packed 100.00 from L1"
            - "L1 remnant 233.32 condemned WASTE at clock 2026-08-16 (2 storage weeks), lot CLOSED"
          setup_api_calls:
