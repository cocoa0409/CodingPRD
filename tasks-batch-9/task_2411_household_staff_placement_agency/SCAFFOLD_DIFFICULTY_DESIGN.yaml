    mechanism: 'Substantiating a poaching case is a five-hop write: the penalty is computed and stamped, a PENALTY_ASSESSED
      ledger row is appended, the client balance is refolded, the client is suspended, and because it is suspended
      every SCHEDULED trial of that household is cancelled with cancel_reason CLIENT_SUSPENDED, which empties the
      second requisition back to SOURCING and returns that candidate to AVAILABLE. The cascade crosses from the compliance
      aggregate into the sourcing aggregate.'
