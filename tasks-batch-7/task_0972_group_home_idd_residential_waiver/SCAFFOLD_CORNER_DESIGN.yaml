  # ===========================================================================
  # Section: endpoints
  # ===========================================================================
  - section: endpoints
    instances:
      - name: action_endpoint_returns_mutated_entity_in_envelope
        claim_type: computed_read
        grounds: [response_envelope, state_machines.Individual.APPLICANT_to_ENROLLED]
        distinguishing_aspect: "Action endpoints return the full mutated resource inside the fixed envelope: enroll's response carries meta.api_request_id plus data.status == ENROLLED and a non-null enrolled_at."
        test_recipe:
          setup: ["Agency, CaseManager, QIDP; individual registered (APPLICANT)"]
          setup_api_calls:
            - { call: "POST /agencies", payload: { name: "Agency A" }, as: AgencyAdmin, captures: { ag_id: $.data.id } }
            - { call: "POST /staff", payload: { agency_id: "${ag_id}", full_name: "Casey Manager", staff_role: "CASE_MANAGER", certifications: ["CPR"], hire_date: "2025-01-15" }, as: AgencyAdmin, captures: { cm_id: $.data.id } }
            - { call: "POST /staff", payload: { agency_id: "${ag_id}", full_name: "Quinn Qidp", staff_role: "QIDP", certifications: ["CPR"], hire_date: "2025-01-15" }, as: AgencyAdmin, captures: { q_id: $.data.id } }
            - { call: "POST /individuals", payload: { agency_id: "${ag_id}", legal_name: "Ind One", medicaid_id: "MCD-001", date_of_birth: "1990-01-01", mobility_level: "AMBULATORY" }, as: CaseManager, as_user_id: "${cm_id}", captures: { ind_id: $.data.id } }
          trigger:
            - { call: "POST /individuals/${ind_id}/enroll", payload: {}, as: QIDP, as_user_id: "${q_id}", captures: { st: $.data.status, ea: $.data.enrolled_at, v: $.data.version } }
          assert:
            - "response_type == 'object' and meta.api_request_id is present (fixed envelope)"
            - "data.status == ENROLLED, data.enrolled_at != null, data.version == 2 (create v1 + enroll mutation)"

  # ===========================================================================
  # Section: errors — triggerability cross-check for errors whose only coverage
  # lives in §1.8 (all other catalog entries are triggered in validations/rbac
  # corners above).
  # ===========================================================================
  - section: errors
    instances:
      - name: error_isp_not_active_on_create_authorization
        claim_type: violation_to_error
        grounds: ["errors[ERR_ISP_NOT_ACTIVE]"]
        excluded_because:
          difficulty_instance: authorization_create_requires_isp_active
          rationale: "Asserted as the failure path of the named §1.8 instance (PENDING_REVIEW ISP -> ERR_ISP_NOT_ACTIVE)."
      - name: error_home_posture_critical_on_claim_submit
        claim_type: violation_to_error
        grounds: ["errors[ERR_HOME_POSTURE_CRITICAL]"]
        excluded_because:
          difficulty_instance: claim_submit_blocked_by_home_posture
          rationale: "Asserted as the failure path of the named §1.8 instance."
      - name: error_bed_overlap_on_overlapping_assignment
        claim_type: violation_to_error
        grounds: ["errors[ERR_BED_OVERLAP]"]
        excluded_because:
          difficulty_instance: bed_assignment_half_open_adjacency_allowed
          rationale: "The second trigger call of the named §1.8 instance asserts ERR_BED_OVERLAP for a 1-day overlap."
      - name: error_shift_overlap_inside_rest_buffer
        claim_type: violation_to_error
        grounds: ["errors[ERR_SHIFT_OVERLAP]"]
        excluded_because:
          difficulty_instance: shift_rest_buffer_closed_interval
          rationale: "The second trigger call of the named §1.8 instance asserts ERR_SHIFT_OVERLAP at a 7h59m gap."
      - name: error_home_capacity_exceeded_on_overflow
        claim_type: violation_to_error
        grounds: ["errors[ERR_HOME_CAPACITY_EXCEEDED]"]
        excluded_because:
          difficulty_instance: home_capacity_exact_fill_allowed
          rationale: "Asserted as the failure path of the named §1.8 instance."
      - name: error_med_order_discontinued_on_admin_event
        claim_type: violation_to_error
        grounds: ["errors[ERR_MED_ORDER_DISCONTINUED]"]
        excluded_because:
          difficulty_instance: med_admin_blocked_when_order_discontinued
          rationale: "Asserted as the failure path of the named §1.8 instance."
      - name: error_stale_version_covered_by_occ_corners
        claim_type: violation_to_error
        grounds: ["errors[ERR_STALE_VERSION]", "concurrency_rules[isp-create-stale-individual]", "concurrency_rules[isp-amend-stale-isp]"]
        excluded_because:
          difficulty_instance: isp_amendment_cycle_returns_to_active
          rationale: "ERR_STALE_VERSION itself is triggered by the two OCC corner instances (isp_create_with_stale_individual_version_rejected, isp_amend_with_stale_version_rejected) in cross_cutting_layers; the cited §1.8 instance exercises the guarded amend endpoint's happy path."

  # ===========================================================================
  # Section: rbac
  # ===========================================================================
  - section: rbac
    instances:
      - name: dsp_cannot_create_claim_forbidden
        claim_type: role_denial
        grounds: [roles.DSP, roles.BillingSpecialist, "errors[ERR_INSUFFICIENT_PERMISSIONS]"]
        distinguishing_aspect: "DSP has no billing operations: POST /claims under the DSP role is rejected at priority 2 before any existence check."
        test_recipe:
          setup: ["Agency with a DSP staff member"]
          setup_api_calls:
            - { call: "POST /agencies", payload: { name: "Agency A" }, as: AgencyAdmin, captures: { ag_id: $.data.id } }
            - { call: "POST /staff", payload: { agency_id: "${ag_id}", full_name: "Dee Spone", staff_role: "DSP", certifications: ["MED_CERT"], hire_date: "2025-02-01" }, as: AgencyAdmin, captures: { d1_id: $.data.id } }
          trigger:
            - { call: "POST /claims", payload: { individual_id: "${d1_id}", service_period_start: "2026-06-01", service_period_end: "2026-06-02" }, as: DSP, as_user_id: "${d1_id}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INSUFFICIENT_PERMISSIONS (403)"

      - name: case_manager_cannot_approve_isp_forbidden
        claim_type: role_denial
        grounds: [roles.CaseManager, roles.QIDP, "errors[ERR_INSUFFICIENT_PERMISSIONS]"]
        distinguishing_aspect: "Approval authority is QIDP-exclusive: the CaseManager role on POST /isps/{id}/approve is rejected even when the ISP is correctly PENDING_REVIEW."
        test_recipe:
          setup: ["Individual ENROLLED; ISP in PENDING_REVIEW; clock 2026-06-01"]
          setup_api_calls:
            - { call: "POST /agencies", payload: { name: "Agency A" }, as: AgencyAdmin, captures: { ag_id: $.data.id } }
            - { call: "POST /staff", payload: { agency_id: "${ag_id}", full_name: "Casey Manager", staff_role: "CASE_MANAGER", certifications: ["CPR"], hire_date: "2025-01-15" }, as: AgencyAdmin, captures: { cm_id: $.data.id } }
            - { call: "POST /staff", payload: { agency_id: "${ag_id}", full_name: "Quinn Qidp", staff_role: "QIDP", certifications: ["CPR"], hire_date: "2025-01-15" }, as: AgencyAdmin, captures: { q_id: $.data.id } }
            - { call: "POST /individuals", payload: { agency_id: "${ag_id}", legal_name: "Ind One", medicaid_id: "MCD-001", date_of_birth: "1990-01-01", mobility_level: "AMBULATORY" }, as: CaseManager, as_user_id: "${cm_id}", captures: { ind_id: $.data.id } }
            - { call: "POST /individuals/${ind_id}/enroll", payload: {}, as: QIDP, as_user_id: "${q_id}", captures: { ind_v: $.data.version } }
            - { call: "POST /isps", payload: { individual_id: "${ind_id}", plan_year_start: "2026-01-01", plan_year_end: "2026-12-31", goals_summary: "Community integration goals", expected_individual_version: "${ind_v}" }, as: CaseManager, as_user_id: "${cm_id}", captures: { isp_id: $.data.id } }
            - { call: "POST /isps/${isp_id}/submit-review", payload: {}, as: CaseManager, as_user_id: "${cm_id}" }
          trigger:
            - { call: "POST /isps/${isp_id}/approve", payload: {}, as: CaseManager, as_user_id: "${cm_id}", captures: { err: $.data.error_id } }
            - { call: "GET /isps/${isp_id}", payload: {}, as: Any, captures: { st: $.data.status } }
          assert:
            - "error_id == ERR_INSUFFICIENT_PERMISSIONS (403)"
            - "ISP remains PENDING_REVIEW"

      - name: suspend_is_compliance_officer_exclusive
        claim_type: role_denial
        grounds: [roles.ComplianceOfficer, roles.BillingSpecialist, "errors[ERR_INSUFFICIENT_PERMISSIONS]"]
        distinguishing_aspect: "Suspend/reinstate are exclusive to ComplianceOfficer: BillingSpecialist is denied, ComplianceOfficer succeeds (denial plus satisfaction in one instance)."
        test_recipe:
          setup: ["Agency with an ACTIVE home"]
          setup_api_calls:
            - { call: "POST /agencies", payload: { name: "Agency A" }, as: AgencyAdmin, captures: { ag_id: $.data.id } }
            - { call: "POST /homes", payload: { agency_id: "${ag_id}", name: "Home A", license_number: "LIC-1", certified_bed_count: 2 }, as: AgencyAdmin, captures: { hm_id: $.data.id } }
          trigger:
            - { call: "POST /homes/${hm_id}/suspend", payload: {}, as: BillingSpecialist, as_user_id: "bill-1", captures: { err: $.data.error_id } }
            - { call: "POST /homes/${hm_id}/suspend", payload: {}, as: ComplianceOfficer, captures: { st1: $.data.status } }
            - { call: "POST /homes/${hm_id}/reinstate", payload: {}, as: ComplianceOfficer, captures: { st2: $.data.status } }
          assert:
            - "BillingSpecialist suspend -> error_id == ERR_INSUFFICIENT_PERMISSIONS"
            - "ComplianceOfficer suspend -> SUSPENDED; reinstate -> ACTIVE"

      - name: terminated_staff_member_cannot_act_forbidden
        claim_type: role_denial
        grounds: ["validations[priority=2.5]", "errors[ERR_ROLE_IDENTITY_MISMATCH]", state_machines.StaffMember.ACTIVE_to_TERMINATED]
        distinguishing_aspect: "Entity-backed identity requires an ACTIVE staff record: after termination, the same X-User-ID under the DSP role fails ERR_ROLE_IDENTITY_MISMATCH; the termination also cancels the DSP's future shifts."
        test_recipe:
          setup: ["Agency with home; DSP D1 with a future shift on 2026-06-05; individual ENROLLED with ACTIVE med order; clock 2026-06-01"]
          setup_api_calls:
