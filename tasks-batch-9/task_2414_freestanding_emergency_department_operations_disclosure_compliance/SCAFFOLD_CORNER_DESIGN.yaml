scaffold_corner_design:
- section: entities
  instances:
  - name: create_facility_returns_the_declared_entity_inside_the_success_envelope
    claim_type: Creation
    grounds:
    - entities.Facility
    - endpoints[POST /facilities]
    - response_envelope.success
    distinguishing_aspect: POST /facilities with every required field returns 201 with response_type object, a meta block carrying api_request_id and api_request_timestamp, and data holding all declared Facility fields including the computed ones.
    test_recipe:
      setup:
      - Empty database
      - Logical clock at 2026-08-01T08:00:00Z
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-08-01T08:00:00Z'
        as: FacilityAdministrator
        as_user_id: admin-1
      trigger:
      - call: POST /facilities
        payload:
          name: Cedar Freestanding ED
          state_code: TX
          license_category: INDEPENDENT_FREESTANDING_ED
          license_status: ACTIVE
          observation_bed_count: 2
          imaging_scope:
          - XRAY
          - CT
          lab_scope:
          - CBC
          - TROPONIN
          pharmacy_scope_tier: EMERGENCY_ONLY
          max_concurrent_physicians: 2
        as: FacilityAdministrator
        as_user_id: admin-1
        captures:
          fac_new_id: $.data.id
          fac_new_v: $.data.version
      assert:
      - HTTP 201 with response_type == "object" and meta.api_request_id present
      - data.id is a server-minted string and data.version == 1
      - Facility.${fac_new_id}.name == Cedar Freestanding ED, state_code == TX, license_category == INDEPENDENT_FREESTANDING_ED, license_status == ACTIVE
      - Facility.${fac_new_id}.observation_bed_count == 2 and max_concurrent_physicians == 2 and pharmacy_scope_tier == EMERGENCY_ONLY
      - 'computed defaults present: observation_beds_occupied == 0, open_compliance_defect_count == 0, current_published_template_id == null, ambulance_units_committed_total == 0, coverage_deficit_flag == false'
      - created_at and updated_at are present and equal 2026-08-01T08:00:00Z
  - name: get_facility_returns_the_stored_configuration_unchanged
    claim_type: Retrieval
    grounds:
    - entities.Facility
    - endpoints[GET /facilities/{id}]
    distinguishing_aspect: GET /facilities/{id} returns exactly the configuration stored by the create call, with the same id and the version the create returned.
    test_recipe:
      setup:
      - A facility created at 2026-08-01T08:00:00Z with a published template and attested signage
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-08-01T08:00:00Z'
        as: FacilityAdministrator
        as_user_id: admin-1
      - call: POST /facilities
        payload:
          name: Cedar Freestanding ED
          state_code: TX
          license_category: INDEPENDENT_FREESTANDING_ED
          license_status: ACTIVE
          observation_bed_count: 2
          imaging_scope:
          - XRAY
          - CT
          lab_scope:
          - CBC
          - TROPONIN
          pharmacy_scope_tier: EMERGENCY_ONLY
          max_concurrent_physicians: 2
        as: FacilityAdministrator
        as_user_id: admin-1
        captures:
          fac_id: $.data.id
          fac_v1: $.data.version
      - call: POST /facilities/${fac_id}/disclosure-templates
        payload:
          version_label: V1
          facility_fee_cents: 145000
          observation_hourly_cents: 42000
          network_status_statement: OUT_OF_NETWORK_ALL_PLANS
          required_signage_elements:
          - LICENSE_CATEGORY_SIGN
          - FEE_DISCLOSURE_SIGN
          - NETWORK_STATUS_SIGN
          - NOT_A_URGENT_CARE_SIGN
        as: FacilityAdministrator
        as_user_id: admin-1
        captures:
          tpl_v1_id: $.data.id
      - call: POST /disclosure-templates/${tpl_v1_id}/publish
        payload:
          expected_facility_version: ${fac_v1}
        as: FacilityAdministrator
        as_user_id: admin-1
      - call: POST /facilities/${fac_id}/signage-attestations
        payload:
          attested_elements:
          - LICENSE_CATEGORY_SIGN
          - FEE_DISCLOSURE_SIGN
          - NETWORK_STATUS_SIGN
          - NOT_A_URGENT_CARE_SIGN
        as: ComplianceOfficer
        as_user_id: co-1
      trigger:
      - call: GET /facilities/${fac_id}
        payload: {}
        as: FacilityAdministrator
        as_user_id: admin-1
      assert:
      - HTTP 200 with data.id == ${fac_id}
      - Facility.${fac_id}.imaging_scope == [XRAY, CT] and lab_scope == [CBC, TROPONIN]
      - Facility.${fac_id}.current_published_template_id == ${tpl_v1_id}
      - Facility.${fac_id}.signage_attestation_status == ATTESTED and signage_attested_by_user_id == co-1
      - Facility.${fac_id}.compliance_posture == OPEN and restricted_service_codes == []
  - name: list_encounters_paginates_with_total_count_and_has_more
    claim_type: Listing
    grounds:
    - endpoints[GET /encounters]
    - response_envelope.pagination_fields
    distinguishing_aspect: With three encounters at one facility, GET /encounters?facility_id=..&limit=2&offset=0 returns 2 items with total_count 3 and has_more true, and offset=2 returns the last item with has_more false.
    test_recipe:
      setup:
      - Facility with compliance_posture OPEN
      - Three registered encounters PT-0001, PT-0002, PT-0003
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload:
          current_utc: '2026-08-01T08:00:00Z'
        as: FacilityAdministrator
        as_user_id: admin-1
      - call: POST /facilities
        payload:
          name: Cedar Freestanding ED
          state_code: TX
          license_category: INDEPENDENT_FREESTANDING_ED
          license_status: ACTIVE
          observation_bed_count: 2
          imaging_scope:
          - XRAY
          - CT
          lab_scope:
          - CBC
          - TROPONIN
          pharmacy_scope_tier: EMERGENCY_ONLY
          max_concurrent_physicians: 2
        as: FacilityAdministrator
        as_user_id: admin-1
        captures:
          fac_id: $.data.id
          fac_v1: $.data.version
      - call: POST /facilities/${fac_id}/disclosure-templates
        payload:
          version_label: V1
          facility_fee_cents: 145000
          observation_hourly_cents: 42000
          network_status_statement: OUT_OF_NETWORK_ALL_PLANS
          required_signage_elements:
          - LICENSE_CATEGORY_SIGN
          - FEE_DISCLOSURE_SIGN
          - NETWORK_STATUS_SIGN
          - NOT_A_URGENT_CARE_SIGN
        as: FacilityAdministrator
        as_user_id: admin-1
        captures:
          tpl_v1_id: $.data.id
      - call: POST /disclosure-templates/${tpl_v1_id}/publish
        payload:
          expected_facility_version: ${fac_v1}
        as: FacilityAdministrator
        as_user_id: admin-1
      - call: POST /facilities/${fac_id}/signage-attestations
        payload:
          attested_elements:
          - LICENSE_CATEGORY_SIGN
          - FEE_DISCLOSURE_SIGN
          - NETWORK_STATUS_SIGN
          - NOT_A_URGENT_CARE_SIGN
        as: ComplianceOfficer
        as_user_id: co-1
      - call: POST /facilities/${fac_id}/encounters
        payload:
          patient_reference: PT-0001
          acuity_level: 2
          presenting_service_line: GENERAL_MEDICAL
        as: RegistrationClerk
        as_user_id: clerk-1
        captures:
          e1: $.data.id
      - call: POST /facilities/${fac_id}/encounters
        payload:
          patient_reference: PT-0002
          acuity_level: 2
          presenting_service_line: GENERAL_MEDICAL
        as: RegistrationClerk
        as_user_id: clerk-1
        captures:
          e2: $.data.id
      - call: POST /facilities/${fac_id}/encounters
        payload:
          patient_reference: PT-0003
          acuity_level: 2
          presenting_service_line: GENERAL_MEDICAL
        as: RegistrationClerk
        as_user_id: clerk-1
        captures:
          e3: $.data.id
      trigger:
      - call: GET /encounters?facility_id=${fac_id}&limit=2&offset=0
        payload: {}
        as: ComplianceOfficer
        as_user_id: co-1
      - call: GET /encounters?facility_id=${fac_id}&limit=2&offset=2
        payload: {}
        as: ComplianceOfficer
        as_user_id: co-1
      assert:
      - the first read returns response_type == "array" with 2 items, total_count == 3, has_more == true, limit == 2, offset == 0
      - the second read returns 1 item, total_count == 3, has_more == false, offset == 2
      - the union of the two pages is exactly {${e1}, ${e2}, ${e3}} with no duplicates
