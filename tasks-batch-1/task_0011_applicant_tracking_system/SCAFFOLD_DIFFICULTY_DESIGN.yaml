  # ===================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # ===================================================================
  - rule_id: transitive_cascade
    instances:
      - name: offer_accept_chain_application_hired_requisition_closed
        grounds:
          - state_machines.Offer.EXTENDED_to_ACCEPTED
          - state_machines.Application.OFFER_EXTENDED_to_HIRED
          - state_machines.JobRequisition.APPROVED_to_CLOSED
        distinguishing_aspect: |
          Depth-3 cascade from a single trigger POST /offers/{id}/accept: Offer EXTENDED→ACCEPTED
          (link 1) ⇒ Application OFFER_EXTENDED→HIRED (link 2, caused by Offer's transition, not
          by the original request) ⇒ JobRequisition.filled_count++ which equals openings ⇒
          JobRequisition APPROVED→CLOSED auto-transition (link 3, caused by filled_count update).
        test_recipe:
          setup:
            - "Department / Requisition with openings=1, APPROVED"
            - "Candidate / Application / Offer chain through extend; offer in EXTENDED, expires in future"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /ats/departments"
              payload: { name: "Cascade1", cost_center_code: "CSC-001", hiring_budget_cents: 100000000 }
              as: PlatformAdmin
              captures: { dept_id: $.data.id }
            - call: "POST /ats/requisitions"
              payload: { department_id: "${dept_id}", title: "Cascade Role", target_level: "MID", base_salary_min_cents: 10000000, base_salary_max_cents: 15000000, openings: 1 }
              as: Recruiter
              as_user_id: "rec_alice"
              captures: { req_id: $.data.id }
            - call: "POST /ats/requisitions/${req_id}/submit"
              payload: {}
              as: Recruiter
              as_user_id: "rec_alice"
            - call: "POST /ats/requisitions/${req_id}/approve"
              payload: {}
              as: HiringManager
              as_user_id: "hm_bob"
            - call: "POST /ats/candidates"
              payload: { full_name: "Cascade Cand", email: "cc1@example.com", source_channel: "DIRECT", eeo_ethnicity: "WHITE", eeo_gender: "MALE", eeo_veteran: false, eeo_disability: false }
              as: Recruiter
              as_user_id: "rec_alice"
              captures: { cand_id: $.data.id }
            - call: "POST /ats/applications"
              payload: { candidate_id: "${cand_id}", requisition_id: "${req_id}" }
              as: Recruiter
              as_user_id: "rec_alice"
              captures: { app_id: $.data.id }
            - call: "POST /ats/applications/${app_id}/screen"
              payload: {}
              as: Recruiter
              as_user_id: "rec_alice"
            - call: "POST /ats/offers"
              payload: { application_id: "${app_id}", base_salary_cents: 12000000, signing_bonus_cents: 0 }
              as: Recruiter
              as_user_id: "rec_alice"
              captures: { offer_id: $.data.id, offer_v1: $.data.version }
            - call: "POST /ats/offers/${offer_id}/approve"
              payload: { expected_offer_version: "${offer_v1}" }
              as: CompApprover
              as_user_id: "comp_carol"
              captures: { offer_v2: $.data.version }
            - call: "POST /ats/offers/${offer_id}/approve"
              payload: { expected_offer_version: "${offer_v2}" }
              as: VP
              as_user_id: "vp_dave"
            - call: "POST /ats/offers/${offer_id}/extend"
              payload: {}
              as: Recruiter
              as_user_id: "rec_alice"
          trigger:
            - call: "POST /ats/offers/${offer_id}/accept"
              payload: {}
              as: Candidate
              as_user_id: "${cand_id}"
              captures: { accepted_status: $.data.status }
            - call: "GET /ats/applications/${app_id}"
              payload: {}
              as: Recruiter
              as_user_id: "rec_alice"
              captures: { app_after: $.data.status }
            - call: "GET /ats/requisitions/${req_id}"
              payload: {}
              as: Recruiter
              as_user_id: "rec_alice"
              captures: { req_after: $.data.status, req_filled: $.data.filled_count }
          assert:
            - "Offer.status == ACCEPTED (link 1)"
            - "Application.status == HIRED (link 2, caused by link 1)"
            - "JobRequisition.filled_count == 1"
            - "JobRequisition.status == CLOSED (link 3, caused by link 2's bump pushing filled_count to openings)"

      - name: requisition_cancel_chain_applications_withdrawn_offers_revoked_bgcs_cancelled
        grounds:
          - state_machines.JobRequisition.APPROVED_to_CANCELLED
          - state_machines.Application.SCREENING_to_WITHDRAWN
          - state_machines.Offer.APPROVED_to_REVOKED
          - state_machines.BackgroundCheck.INITIATED_to_CANCELLED
        distinguishing_aspect: |
          Depth-3 cascade from a different trigger POST /requisitions/{id}/cancel:
          JobRequisition APPROVED→CANCELLED (link 1) ⇒ Applications under that req → WITHDRAWN
          AND Offers under that req → REVOKED (link 2, caused by link 1) ⇒ BackgroundChecks on
          those Offers → CANCELLED, ReferralBonuses → VOID (link 3, caused by link 2). Originates
          from a different state transition than the offer-accept cascade above.
        test_recipe:
          setup:
