scenario: |
  Generate task harder than expert level!

  2636. Nonprofit Newsroom Membership & Grant Funding (nonprofit news organization): membership program with recurring giving tiers, benefit definition and renewal cadence, major donor cultivation with editorial independence policies and gift acceptance criteria, foundation grant pipeline with proposal development, restricted funding scope and reporting obligations, revenue diversification tracking across membership, grants, events and syndication with concentration risk, editorial independence firewall documentation and donor influence prevention policies, transparency disclosure of funders and coverage areas, collaborative reporting partnerships with shared credit and cost arrangements, financial sustainability metrics and reserve policy for board oversight
domain_name: nonprofit-newsroom-funding
api_prefix: ""           # flat top-level collections, e.g.: /funders, /grant-proposals, /contributions

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

complexity_profile:
  difficulty_level: beyond_expert   # §0.4 Expert band deliberately exceeded: 13 entities / 11 state machines / 11 calculations / 55 ordered validations / 67 endpoints / 68 errors / 5 roles
  primary_archetype: compliance_audit          # editorial-independence firewall gates every money movement, with attestation trail
  secondary_archetype: multi_party_negotiation # gift acceptance and grant clearance need Development + Editorial + Board concurrence
  complexity_layers:
    - dual_variant_calculation      # recognized vs pipeline revenue concentration; self-attested vs audited funder risk
    - cascading_side_effects        # influence contact -> funder -> disclosure -> coverage area -> awarded grant -> fiscal posture
    - rate_threshold_triggers       # HHI / top-source-share breakpoints drive reserve months and release caps
    - optimistic_concurrency        # OCC on Funder.version and Member.version for supersede-style creates

  entity_topology: flat
  # Every entity is a top-level collection joined by explicit FK fields; no nesting in URL paths
  # except two sub-resource reads (grant reports, collaboration partners) that exist for reverse reachability.

  state_machine_shape: cyclic
  # Member ACTIVE->GRACE->LAPSED->ACTIVE, GiftOffer INDEPENDENCE_REVIEW->CONDITIONS_REQUESTED->INDEPENDENCE_REVIEW,
  # GrantProposal INDEPENDENCE_REVIEW->REVISION_REQUESTED->DRAFT->INDEPENDENCE_REVIEW and AWARDED->SUSPENDED->AWARDED,
  # GrantReport SUBMITTED->RETURNED->SUBMITTED; Contribution carries two independent state dimensions.

  relationship_patterns:
    - one_to_many          # Funder -> GiftOffer / GrantProposal; GrantProposal -> GrantReport; Collaboration -> CollaborationPartner
    - many_to_many         # FirewallDisclosure is the Funder x CoverageArea junction
    - self_referential     # FirewallDisclosure.supersedes_disclosure_id -> FirewallDisclosure.id
    - cross_aggregate      # Contribution references Member, Funder, GiftOffer, Collaboration and FiscalPeriod
    - polymorphic          # Contribution.revenue_stream selects which of member_id / funder_id / collaboration_id is populated

  role_model: segregation_of_duties
  # The user id that cultivated a Funder or solicited a GiftOffer may never clear it, attest its firewall
  # disclosure, or ratify it at board level, regardless of which role header that user presents.

  consistency_model: immediate

# ---------------------------------------------------------------------------
# §1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------
entities:
  - name: FiscalPeriod
    parent: null
    common_fields: true
    fields:
      - name: label
        type: string
        source: input
        description: Human label of the fiscal year, e.g. "FY2027".
        constraints: unique across FiscalPeriod; 1-32 chars
      - name: start_date
        type: string
        source: input
        description: First calendar day of the period (ISO 8601 date, YYYY-MM-DD, inclusive).
      - name: end_date
        type: string
        source: input
        description: Last calendar day of the period (ISO 8601 date, YYYY-MM-DD, inclusive).
        constraints: must be strictly after start_date
      - name: status
        type: enum
        source: system
        description: Lifecycle of the period; gates every revenue-posting write.
        default: OPEN
        constraints: one of {OPEN, REVIEW_LOCKED, CLOSED}
      - name: monthly_expense_base_cents
        type: integer
        source: input
        description: Board-approved monthly operating expense base; denominator of the reserve-months metrics.
        constraints: ">= 1"
      - name: reserve_balance_cents
        type: integer
        source: input
        description: Unrestricted operating reserve cash on hand; debited by restricted-fund releases and credited by clawbacks.
        default: 0
        constraints: ">= 0"
      - name: recognized_revenue_cents
        type: integer
        source: computed
        description: RECOGNIZED-basis total revenue for the period (calculations.revenue_diversification_index).
        default: 0
      - name: stream_shares_bps
        type: object
        source: computed
        description: RECOGNIZED-basis share of total revenue per stream in basis points, keys MEMBERSHIP/MAJOR_GIFT/GRANTS/EVENTS/SYNDICATION.
      - name: concentration_hhi
        type: integer
        source: computed
        description: RECOGNIZED-basis Herfindahl-Hirschman index over stream shares, 0-10000.
        default: 0
      - name: top_source_share_bps
        type: integer
        source: computed
        description: RECOGNIZED-basis share in bps of the single largest institutional Funder across contributions plus awarded grants.
        default: 0
      - name: reserve_months_target
        type: integer
        source: computed
        description: Reserve policy months required this period, escalated by concentration breakpoints.
        default: 3
      - name: operating_reserve_target_cents
        type: integer
        source: computed
        description: monthly_expense_base_cents * reserve_months_target.
        default: 0
      - name: reserve_months_ratio_bps
        type: integer
        source: computed
        description: reserve_balance_cents expressed in months of expense base, x10000 (1 month == 10000).
        default: 0
      - name: sustainability_posture
        type: enum
        source: computed
        description: Derived posture that gates restricted-fund releases and board escalation.
        default: HEALTHY
        constraints: one of {HEALTHY, WATCH, CONSTRAINED, CRITICAL}
      - name: restricted_release_cap_pct_bps
        type: integer
        source: computed
        description: Fraction of a grant's unreleased principal releasable in one request under the current posture, in bps.
        default: 10000
      - name: board_override_active
        type: boolean
        source: system
        description: True once BoardOversight has filed a concentration override for this period; relaxes ERR_CONCENTRATION_LIMIT_EXCEEDED only.
        default: false
      - name: board_override_justification
        type: string
        source: system
        description: Justification text captured with the board override; null until an override is filed.
        default: null
      - name: locked_at
        type: datetime
        source: system
        description: Logical-clock instant of the OPEN->REVIEW_LOCKED transition; null before.
        default: null

  - name: MembershipTier
    parent: null
    common_fields: true
    fields:
      - name: tier_code
        type: string
        source: input
        description: Short code for the giving tier, e.g. "SUSTAINER".
        constraints: unique across MembershipTier; uppercase A-Z and underscore, 2-32 chars
      - name: name
        type: string
        source: input
        description: Display name of the tier shown to members.
      - name: renewal_cadence
        type: enum
        source: input
        description: Billing/renewal cadence for the recurring gift.
        constraints: one of {MONTHLY, ANNUAL}
      - name: contribution_amount_cents
        type: integer
        source: input
        description: Recurring contribution charged per cadence period; the quid-pro-quo threshold base.
        constraints: ">= 100"
      - name: grace_period_days
        type: integer
        source: input
        description: Days after a missed renewal during which the member stays in GRACE before lapsing.
        default: 30
        constraints: 0-120
      - name: benefits
        type: array
        source: input
        description: >-
          Benefit definitions for the tier. Each item is an object
          { benefit_code: string, fulfillment_type: enum, annual_fair_market_value_cents: integer }.
        default: []
        constraints: >-
          benefit_code unique within the tier; fulfillment_type one of
          {TOTE_BAG, EVENT_ACCESS, NEWSLETTER, BOOK, MERCH_DISCOUNT};
          annual_fair_market_value_cents >= 0; at most 8 items
      - name: benefit_count
        type: integer
        source: computed
        description: Number of items in benefits (0 when the tier is benefit-free).
        default: 0
      - name: insubstantial_benefit_codes
        type: array
        source: computed
        description: benefit_code values whose per-period fair market value falls at or below the insubstantial-benefit threshold and are therefore excluded from quid pro quo.
        default: []
      - name: quid_pro_quo_per_period_cents
        type: integer
        source: computed
        description: Per-period fair market value of substantial benefits only (calculations.tier_quid_pro_quo_value).
        default: 0
      - name: insubstantial_threshold_cents
        type: integer
        source: computed
        description: min(round_half_up(contribution_amount_cents * INSUBSTANTIAL_PCT_BPS / 10000), INSUBSTANTIAL_CAP_CENTS).
        default: 0
      - name: status
        type: enum
        source: system
        description: Publication state; members may only be enrolled on a PUBLISHED tier.
        default: DRAFT
        constraints: one of {DRAFT, PUBLISHED}
      - name: published_at
        type: datetime
        source: system
        description: Logical-clock instant of the DRAFT->PUBLISHED transition; null before.
        default: null

  - name: Member
    parent: null
    common_fields: true
    fields:
      - name: tier_id
        type: string
        source: input
        description: FK -> MembershipTier.id; the tier whose cadence, amount and benefits govern this membership.
      - name: email
        type: string
        source: input
        description: Contact email of the member.
        constraints: unique across Member; must contain "@"
      - name: full_name
        type: string
        source: input
        description: Member display name.
      - name: employer
        type: string
        source: input
        description: Self-reported employer, used for transparency disclosure of employer-matched giving.
        default: null
      - name: linked_funder_id
        type: string
        source: input
        description: FK -> Funder.id; set when this member is also cultivated as an individual major donor, null otherwise.
        default: null
      - name: status
        type: enum
        source: system
        description: Membership lifecycle state.
        default: PENDING
        constraints: one of {PENDING, ACTIVE, GRACE, LAPSED, CANCELLED}
      - name: cycle_start_date
        type: string
        source: system
        description: ISO date the current paid cycle began; set on activation and advanced on each renewal.
        default: null
      - name: next_renewal_date
        type: string
        source: computed
        description: ISO date the next renewal is due (calculations.member_renewal_schedule).
        default: null
      - name: grace_expires_at
        type: datetime
        source: computed
        description: next_renewal_date 00:00:00Z plus tier.grace_period_days; the instant GRACE becomes LAPSED. Null unless status == GRACE.
        default: null
      - name: lifetime_giving_cents
        type: integer
        source: computed
        description: Sum of amount_cents over this member's SETTLED contributions minus refunded ones (calculations.member_lifetime_giving).
        default: 0
      - name: consecutive_renewals
        type: integer
        source: system
        description: Count of successful renewals without an intervening LAPSED state; reset to 0 on reinstatement.
        default: 0
      - name: is_major_donor
        type: boolean
        source: computed
        description: True when lifetime_giving_cents >= MAJOR_DONOR_THRESHOLD_CENTS.
        default: false
      - name: cultivation_locked
        type: boolean
        source: computed
        description: True when is_major_donor is true and no ACTIVE FirewallDisclosure exists for linked_funder_id; blocks tier changes until disclosed.
        default: false

  - name: CoverageArea
    parent: null
    common_fields: true
    fields:
      - name: area_code
        type: string
        source: input
        description: Short code of the editorial beat, e.g. "HOUSING".
        constraints: unique across CoverageArea; uppercase A-Z and underscore, 2-32 chars
      - name: name
        type: string
        source: input
        description: Display name of the coverage area.
      - name: editorial_lead_user_id
        type: string
        source: input
        description: Opaque user id of the editor accountable for the beat; never compared against any entity id.
      - name: disclosure_status
        type: enum
        source: computed
        description: CURRENT while every FirewallDisclosure touching this area is ACTIVE; STALE once any of them needs reattestation.
        default: CURRENT
        constraints: one of {CURRENT, STALE}
      - name: publication_gate
        type: enum
        source: computed
        description: OPEN while disclosure_status == CURRENT; BLOCKED once disclosure_status == STALE. Gates grant submission and collaboration activation.
        default: OPEN
        constraints: one of {OPEN, BLOCKED}
      - name: restricted_grant_count
        type: integer
        source: computed
        description: Number of GrantProposal rows with status in {AWARDED, SUSPENDED} and restriction_type != UNRESTRICTED pointing at this area; the exact population validations[priority=42] caps at MAX_RESTRICTED_GRANTS_PER_AREA.
        default: 0
      - name: disclosed_funder_count
        type: integer
        source: computed
        description: Number of distinct funder_id values with an ACTIVE FirewallDisclosure for this area.
        default: 0

  - name: Funder
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: Legal name of the foundation, individual, corporate or government funder.
        constraints: unique across Funder
      - name: funder_type
        type: enum
        source: input
        description: Funder classification; drives the base independence risk weight.
        constraints: one of {FOUNDATION, INDIVIDUAL, CORPORATE, GOVERNMENT}
      - name: affiliated_coverage_area_id
        type: string
        source: input
        description: FK -> CoverageArea.id; the beat the funder has declared interest in, null when unaffiliated.
        default: null
      - name: self_attested_advocacy
        type: boolean
        source: input
        description: Funder's own attestation that it engages in advocacy on the beat it funds.
        default: false
      - name: audited_advocacy_index
        type: integer
        source: input
        description: Independent 0-10 advocacy intensity index supplied by an EditorialDirector audit; null until an AUDITED clearance is filed.
        default: null
        constraints: 0-10 when present
      - name: risk_basis
        type: enum
        source: system
        description: Which variant of calculations.funder_independence_risk produced the persisted score.
        default: SELF_ATTESTED
        constraints: one of {SELF_ATTESTED, AUDITED}
      - name: prior_editorial_requests_count
        type: integer
        source: computed
        description: Count of InfluenceContact rows for this funder with contact_type in {EDITORIAL_DIRECTION_REQUEST, CONDITION_ATTEMPT}.
        default: 0
      - name: reporting_reliability_bps
        type: integer
        source: computed
        description: Reliability score in bps, 10000 at creation, reduced 2000 per overdue GrantReport, floored at 0.
        default: 10000
      - name: independence_risk_score
        type: integer
        source: computed
        description: 0-100 weighted independence risk (calculations.funder_independence_risk) under the persisted risk_basis.
        default: 0
      - name: status
        type: enum
        source: system
        description: Gift-acceptance eligibility of the funder.
        default: PROSPECT
        constraints: one of {PROSPECT, CLEARED, RESTRICTED}
      - name: cultivated_by_user_id
        type: string
        source: system
        description: X-User-ID of the DevelopmentOfficer who created the funder record; segregation-of-duties reference.
      - name: cleared_by_user_id
        type: string
        source: system
        description: X-User-ID of the EditorialDirector who filed the most recent CLEAR decision; null before.
        default: null
      - name: lifetime_committed_cents
        type: integer
        source: computed
        description: Sum of this funder's SETTLED contribution amounts plus awarded_amount_cents of its AWARDED or CLOSED proposals.
        default: 0
      - name: restricted_at
        type: datetime
        source: system
        description: Logical-clock instant the funder MOST RECENTLY entered RESTRICTED. Retained after a later CLEAR - validations[priority=34] reads it to enforce the 30-day cooling-off window on a funder that has been rehabilitated. Null only for a funder that has never been restricted.
        default: null

  - name: GiftOffer
    parent: null
    common_fields: true
    fields:
      - name: funder_id
        type: string
        source: input
        description: FK -> Funder.id; the major donor or institution offering the gift.
      - name: coverage_area_id
        type: string
        source: input
        description: FK -> CoverageArea.id; the beat the gift is designated for, null when designation == UNRESTRICTED.
        default: null
      - name: fiscal_period_id
        type: string
        source: input
        description: FK -> FiscalPeriod.id; the period the accepted gift will be recognized in.
      - name: offered_amount_cents
        type: integer
        source: input
        description: Gross amount the donor offers, before the stewardship fee.
        constraints: ">= 100000"
      - name: designation
        type: enum
        source: input
        description: Restriction the donor attaches to the gift.
        constraints: one of {UNRESTRICTED, PROGRAM_RESTRICTED, PROJECT_RESTRICTED}
      - name: donor_conditions
        type: string
        source: input
        description: Verbatim conditions the donor attached; reviewed against the gift acceptance policy.
        default: null
      - name: status
        type: enum
        source: system
        description: Gift acceptance workflow state.
        default: PROPOSED
        constraints: one of {PROPOSED, INDEPENDENCE_REVIEW, CONDITIONS_REQUESTED, CLEARED, ACCEPTED, DECLINED}
      - name: stewardship_fee_cents
        type: integer
        source: computed
        description: Tiered stewardship fee keyed on offered_amount_cents (calculations.gift_stewardship_netting).
        default: 0
      - name: net_acceptable_amount_cents
        type: integer
        source: computed
        description: offered_amount_cents - stewardship_fee_cents; the amount posted as a contribution on acceptance.
        default: 0
      - name: board_ratification_required
        type: boolean
        source: computed
        description: True when offered_amount_cents >= BOARD_RATIFICATION_THRESHOLD_CENTS or funder.independence_risk_score >= RATIFICATION_RISK_FLOOR.
        default: false
      - name: acceptance_gate_score
        type: integer
        source: computed
        description: Snapshot of funder.independence_risk_score taken at the CLEARED transition; the value the acceptance gate is evaluated against.
        default: 0
      - name: solicited_by_user_id
        type: string
        source: system
        description: X-User-ID of the DevelopmentOfficer who created the offer; segregation-of-duties reference.
      - name: cleared_by_user_id
        type: string
        source: system
        description: X-User-ID of the EditorialDirector who cleared the offer; null before clearance.
        default: null
      - name: board_ratified_by_user_id
        type: string
        source: system
        description: X-User-ID of the BoardOversight member who ratified the offer; null before ratification.
        default: null
      - name: conditions_round_count
        type: integer
        source: system
        description: Number of times the offer has cycled through CONDITIONS_REQUESTED; capped by MAX_CONDITION_ROUNDS.
        default: 0

  - name: GrantProposal
    parent: null
    common_fields: true
    fields:
      - name: funder_id
        type: string
        source: input
        description: FK -> Funder.id; the foundation the proposal targets.
      - name: coverage_area_id
        type: string
        source: input
        description: FK -> CoverageArea.id; the beat the restricted funding scope covers, null when restriction_type == UNRESTRICTED.
        default: null
      - name: fiscal_period_id
        type: string
        source: input
        description: FK -> FiscalPeriod.id; the period an award would be recognized in.
      - name: title
        type: string
        source: input
        description: Proposal title.
      - name: requested_amount_cents
        type: integer
        source: input
        description: Amount requested in the proposal.
        constraints: ">= 100000"
      - name: restriction_type
        type: enum
        source: input
        description: Restricted funding scope of the request.
        constraints: one of {UNRESTRICTED, PROGRAM_RESTRICTED, PROJECT_RESTRICTED}
      - name: restriction_start_date
        type: string
        source: input
        description: ISO date the restricted funding window opens (inclusive); required when restriction_type != UNRESTRICTED.
        default: null
      - name: restriction_end_date
        type: string
        source: input
        description: ISO date the restricted funding window closes (inclusive); required when restriction_type != UNRESTRICTED.
        default: null
      - name: reporting_cadence
        type: enum
        source: input
        description: Reporting obligation cadence generated on award.
        default: NONE
        constraints: one of {NONE, SEMIANNUAL, ANNUAL}
      - name: award_probability_bps
        type: integer
        source: input
        description: Development's probability estimate in bps, used only by the PIPELINE revenue variant.
        default: 5000
        constraints: 0-10000
      - name: status
        type: enum
        source: system
        description: Grant pipeline state.
        default: DRAFT
        constraints: one of {DRAFT, INDEPENDENCE_REVIEW, REVISION_REQUESTED, CLEARED, SUBMITTED, AWARDED, DECLINED, WITHDRAWN, SUSPENDED, CLOSED}
      - name: revision_round_count
        type: integer
        source: system
        description: Number of REVISION_REQUESTED rounds so far; capped by MAX_REVISION_ROUNDS.
        default: 0
      - name: awarded_amount_cents
        type: integer
        source: system
        description: Amount actually awarded; 0 until the AWARDED outcome is recorded.
        default: 0
      - name: released_cents
        type: integer
        source: system
        description: Restricted principal released to operations so far.
        default: 0
      - name: unreleased_cents
        type: integer
        source: system
        description: Restricted principal still held back; set to awarded_amount_cents on award.
        default: 0
      - name: returned_cents
        type: integer
        source: system
        description: Restricted principal clawed back on suspension; conserved with released_cents and unreleased_cents.
        default: 0
      - name: compliance_flag
        type: enum
        source: computed
        description: DELINQUENT once any of this proposal's reports is OVERDUE, otherwise COMPLIANT.
        default: COMPLIANT
        constraints: one of {COMPLIANT, DELINQUENT}
      - name: award_date
        type: string
        source: input
        description: ISO date of the award decision, supplied with the AWARDED outcome; null otherwise.
        default: null
      - name: report_count
        type: integer
        source: computed
        description: Number of GrantReport rows generated on award (0 when reporting_cadence == NONE).
        default: 0
      - name: drafted_by_user_id
        type: string
        source: system
        description: X-User-ID of the DevelopmentOfficer who created the proposal; segregation-of-duties reference.
      - name: cleared_by_user_id
        type: string
        source: system
        description: X-User-ID of the EditorialDirector who cleared the proposal; null before clearance.
        default: null
      - name: suspended_reason
        type: enum
        source: system
        description: Why the proposal was suspended; null unless status == SUSPENDED.
        default: null
        constraints: one of {FIREWALL_BREACH, REPORT_DELINQUENCY} when present

  - name: GrantReport
    parent: null
    common_fields: true
    fields:
      - name: grant_proposal_id
        type: string
        source: input
        description: FK -> GrantProposal.id; the awarded proposal this reporting obligation belongs to.
      - name: sequence_no
        type: integer
        source: computed
        description: 1-based ordinal of the reporting obligation within the award.
      - name: period_start
        type: string
        source: computed
        description: ISO date the reported spend period opens (inclusive).
      - name: period_end
        type: string
        source: computed
        description: ISO date the reported spend period closes (inclusive).
      - name: due_date
        type: string
        source: computed
        description: ISO date the report is due (period_end plus REPORT_GRACE_DAYS).
      - name: status
        type: enum
        source: system
        description: Reporting obligation state.
        default: SCHEDULED
        constraints: one of {SCHEDULED, SUBMITTED, ACCEPTED, RETURNED, OVERDUE, WAIVED}
      - name: allocated_release_cents
        type: integer
        source: computed
        description: Share of awarded principal allocated to this reporting bucket by the release waterfall.
        default: 0
      - name: consumed_release_cents
        type: integer
        source: computed
        description: Portion of allocated_release_cents already filled by releases.
        default: 0
      - name: spend_reported_cents
        type: integer
        source: input
        description: Spend the newsroom reports for the period; supplied on submission.
        default: null
      - name: variance_bps
        type: integer
        source: computed
        description: "Signed variance of spend_reported_cents against consumed_release_cents in bps: round_half_up(10000 * (spend_reported_cents - consumed_release_cents) / consumed_release_cents), 0 when consumed_release_cents == 0; null before submission."
        default: null
      - name: submitted_at
        type: datetime
        source: system
        description: Logical-clock instant of the latest submission; null before.
        default: null

  - name: Contribution
    parent: null
    common_fields: true
    fields:
      - name: fiscal_period_id
        type: string
        source: input
        description: FK -> FiscalPeriod.id; the period the revenue is recognized in.
      - name: member_id
        type: string
        source: input
        description: FK -> Member.id; populated only when revenue_stream == MEMBERSHIP, null otherwise.
        default: null
      - name: funder_id
        type: string
        source: input
        description: FK -> Funder.id; populated only when revenue_stream == MAJOR_GIFT (set by the gift-acceptance cascade), null otherwise.
        default: null
      - name: gift_offer_id
        type: string
        source: input
        description: FK -> GiftOffer.id; populated only when revenue_stream == MAJOR_GIFT (set by the gift-acceptance cascade), null otherwise.
        default: null
      - name: collaboration_id
        type: string
        source: input
        description: FK -> Collaboration.id; populated only when revenue_stream == SYNDICATION, null otherwise.
        default: null
      - name: revenue_stream
        type: enum
        source: input
        description: Which diversification stream this revenue belongs to. MAJOR_GIFT is writable only by the gift-acceptance cascade.
        constraints: one of {MEMBERSHIP, MAJOR_GIFT, EVENTS, SYNDICATION}
      - name: amount_cents
        type: integer
        source: input
        description: Gross amount received.
        constraints: ">= 1"
      - name: received_date
        type: string
        source: input
        description: ISO date the funds were received; must fall inside the fiscal period's inclusive date range.
      - name: source_label
        type: string
        source: input
        description: Free-text source label used for EVENTS revenue and for transparency disclosure listings.
        default: null
      - name: settlement_status
        type: enum
        source: system
        description: First independent state dimension - money movement.
        default: INITIATED
        constraints: one of {INITIATED, SETTLED, FAILED, REFUNDED}
      - name: acknowledgment_status
        type: enum
        source: system
        description: Second independent state dimension - donor acknowledgment and public disclosure, evolves independently of settlement_status.
        default: UNACKNOWLEDGED
        constraints: one of {UNACKNOWLEDGED, RECEIPTED, DISCLOSED}
      - name: quid_pro_quo_cents
        type: integer
        source: computed
        description: Fair market value of substantial benefits attached to this contribution (calculations.contribution_deductible_split).
        default: 0
      - name: deductible_cents
        type: integer
        source: computed
        description: Tax-deductible portion, max(0, amount_cents - quid_pro_quo_cents); always 0 for EVENTS and SYNDICATION.
        default: 0
      - name: receipt_number
        type: string
        source: computed
        description: Sequential receipt identifier assigned when acknowledgment_status becomes RECEIPTED; null before.
        default: null
      - name: refunded_at
        type: datetime
        source: system
        description: Logical-clock instant of the refund; null unless settlement_status == REFUNDED.
        default: null

  - name: FirewallDisclosure
    parent: null
    common_fields: true
    fields:
      - name: funder_id
        type: string
        source: input
        description: FK -> Funder.id; the funder side of the disclosed relationship.
      - name: coverage_area_id
        type: string
        source: input
        description: FK -> CoverageArea.id; the beat side of the disclosed relationship.
      - name: supersedes_disclosure_id
        type: string
        source: input
        description: FK -> FirewallDisclosure.id; the prior disclosure this one replaces, null for a first disclosure of the pair.
        default: null
      - name: disclosure_text
        type: string
        source: input
        description: Published firewall statement describing how editorial decisions stay independent of this funder.
        constraints: 20-2000 chars
      - name: status
        type: enum
        source: system
        description: Disclosure lifecycle.
        default: ACTIVE
        constraints: one of {ACTIVE, REATTESTATION_REQUIRED, SUPERSEDED, VOID}
      - name: attested_by_user_id
        type: string
        source: system
        description: X-User-ID of the EditorialDirector who attested the disclosure; must never equal funder.cultivated_by_user_id.
      - name: attested_at
        type: datetime
        source: system
        description: Logical-clock instant of the latest attestation.
      - name: reattestation_reason
        type: enum
        source: system
        description: Why reattestation was demanded; null while ACTIVE.
        default: null
        constraints: one of {FUNDER_RESTRICTED, INFLUENCE_CONTACT} when present

  - name: InfluenceContact
    parent: null
    common_fields: false
    fields:
      - name: funder_id
        type: string
        source: input
        description: FK -> Funder.id; the funder side of the logged contact.
      - name: coverage_area_id
        type: string
        source: input
        description: FK -> CoverageArea.id; the beat the contact touched, null for general stewardship contacts.
        default: null
      - name: contact_type
        type: enum
        source: input
        description: Nature of the contact under the donor-influence-prevention policy.
        constraints: one of {ROUTINE_STEWARDSHIP, COVERAGE_INQUIRY, EDITORIAL_DIRECTION_REQUEST, CONDITION_ATTEMPT}
      - name: occurred_at
        type: datetime
        source: input
        description: ISO 8601 UTC instant the contact happened; must not be after the logical clock.
      - name: summary
        type: string
        source: input
        description: Staff summary of what the funder asked for.
        constraints: 10-1000 chars
      - name: logged_by_user_id
        type: string
        source: system
        description: X-User-ID of the staffer who logged the contact.
      - name: severity_weight
        type: integer
        source: computed
        description: Policy weight of contact_type - ROUTINE_STEWARDSHIP 0, COVERAGE_INQUIRY 1, CONDITION_ATTEMPT 2, EDITORIAL_DIRECTION_REQUEST 3.
        default: 0
      - name: triggered_restriction
        type: boolean
        source: computed
        description: True when logging this contact drove the funder into RESTRICTED.
        default: false

  - name: Collaboration
    parent: null
    common_fields: true
    fields:
      - name: coverage_area_id
        type: string
        source: input
        description: FK -> CoverageArea.id; the beat whose exclusive production window this collaboration occupies.
      - name: fiscal_period_id
        type: string
        source: input
        description: FK -> FiscalPeriod.id; the period the shared costs and syndication revenue land in.
      - name: title
        type: string
        source: input
        description: Working title of the collaborative investigation.
      - name: window_start
        type: datetime
        source: input
        description: ISO 8601 UTC instant the production window opens (inclusive).
      - name: window_end
        type: datetime
        source: input
        description: ISO 8601 UTC instant the production window closes (exclusive - half-open interval).
        constraints: must be strictly after window_start
      - name: total_cost_cents
        type: integer
        source: input
        description: Total production cost to be split across the newsroom and its confirmed partners.
        constraints: ">= 1"
      - name: lead_credit_bps
        type: integer
        source: input
        description: Byline credit share retained by this newsroom, in bps.
        constraints: 0-10000
      - name: lead_cost_share_bps
        type: integer
        source: system
        description: Cost share carried by this newsroom in bps; seeded from input and increased when a partner withdraws.
        constraints: 0-10000
      - name: status
        type: enum
        source: system
        description: Collaboration lifecycle.
        default: DRAFT
        constraints: one of {DRAFT, ACTIVE, SETTLED, DISSOLVED}
      - name: partner_count
        type: integer
        source: computed
        description: Number of CollaborationPartner rows with status == CONFIRMED.
        default: 0
      - name: lead_cost_cents
        type: integer
        source: computed
        description: Newsroom's own cost bucket from the largest-remainder split (calculations.collaboration_cost_split).
        default: 0
      - name: allocated_cost_cents
        type: integer
        source: computed
        description: lead_cost_cents plus the sum of confirmed partners' cost_owed_cents; invariant-equal to total_cost_cents once ACTIVE.
        default: 0
      - name: syndication_revenue_cents
        type: integer
        source: computed
        description: Sum of amount_cents over SETTLED Contribution rows with revenue_stream == SYNDICATION pointing at this collaboration.
        default: 0
      - name: settled_at
        type: datetime
        source: system
        description: Logical-clock instant of the ACTIVE->SETTLED transition; null before.
        default: null

  - name: CollaborationPartner
    parent: null
    common_fields: true
    fields:
      - name: collaboration_id
        type: string
        source: input
        description: FK -> Collaboration.id; the collaboration this partner joined.
      - name: partner_org_name
        type: string
        source: input
        description: Legal name of the partner newsroom.
        constraints: unique within the collaboration
      - name: credit_share_bps
        type: integer
        source: input
        description: Byline credit share allotted to this partner, in bps.
        constraints: 1-10000
      - name: cost_share_bps
        type: integer
        source: input
        description: Share of total_cost_cents this partner carries, in bps.
        constraints: 1-10000
      - name: cost_owed_cents
        type: integer
        source: computed
        description: Whole-cent cost bucket assigned by the largest-remainder split; 0 until the collaboration is ACTIVE.
        default: 0
      - name: remainder_rank
        type: integer
        source: computed
        description: 1-based rank of this partner's fractional remainder in the largest-remainder split (ties broken by created_at ASC); 0 before allocation.
        default: 0
      - name: status
        type: enum
        source: system
        description: Partner participation state.
        default: CONFIRMED
        constraints: one of {CONFIRMED, WITHDRAWN}
      - name: withdrawn_at
        type: datetime
        source: system
        description: Logical-clock instant of withdrawal; null unless status == WITHDRAWN.
        default: null

# ---------------------------------------------------------------------------
# §1.2 State Machine Table
# ---------------------------------------------------------------------------
state_machines:
  - entity: FiscalPeriod
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: REVIEW_LOCKED
        trigger: "POST /fiscal-periods/{id}/status-actions with action == LOCK"
        actor: FinanceController
        preconditions:
          - "fiscal_period.status == OPEN"
        side_effects:
          - "sets locked_at to the logical clock"
          - "recomputes recognized_revenue_cents, stream_shares_bps, concentration_hhi, top_source_share_bps, reserve_months_target, operating_reserve_target_cents, reserve_months_ratio_bps, sustainability_posture and restricted_release_cap_pct_bps on the RECOGNIZED basis"
          - "increments FiscalPeriod.version by 1"
        note: "While REVIEW_LOCKED no Contribution may be created or settled and no award outcome may be recorded against this period."
      - from: REVIEW_LOCKED
        to: OPEN
        trigger: "POST /fiscal-periods/{id}/status-actions with action == UNLOCK"
        actor: FinanceController
        preconditions:
          - "fiscal_period.status == REVIEW_LOCKED"
        side_effects:
          - "clears locked_at to null"
          - "increments FiscalPeriod.version by 1"
        note: "Revert edge; makes the FiscalPeriod machine branching-with-revert rather than a one-way pipeline."
      - from: REVIEW_LOCKED
        to: CLOSED
        trigger: "POST /fiscal-periods/{id}/status-actions with action == CLOSE"
        actor: FinanceController
        preconditions:
          - "fiscal_period.status == REVIEW_LOCKED"
          - "no Contribution of this period has settlement_status == INITIATED"
          - "sustainability_posture != CRITICAL, or board_override_active == true"
        side_effects:
          - "freezes all computed sustainability fields at their current values"
          - "increments FiscalPeriod.version by 1"
      - from: OPEN
        to: OPEN
        trigger: "POST /fiscal-periods/{id}/board-override"
        actor: BoardOversight
        preconditions:
          - "fiscal_period.status in {OPEN, REVIEW_LOCKED}"
          - "concentration_hhi >= CONCENTRATION_BOARD_FLOOR_HHI or sustainability_posture in {CONSTRAINED, CRITICAL}"
          - "board_override_active == false"
        side_effects:
          - "sets board_override_active to true and stores board_override_justification"
          - "increments FiscalPeriod.version by 1"
        note: "Self-loop on OPEN (also legal from REVIEW_LOCKED); status itself is unchanged, only the override flag."

  - entity: MembershipTier
    initial_state: DRAFT
    terminal_states: [PUBLISHED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /membership-tiers/{id}/publish"
        actor: DevelopmentOfficer
        preconditions:
          - "membership_tier.status == DRAFT"
          - "quid_pro_quo_per_period_cents < contribution_amount_cents"
        side_effects:
          - "sets published_at to the logical clock"
          - "increments MembershipTier.version by 1"
        note: "benefits, insubstantial_benefit_codes, insubstantial_threshold_cents and quid_pro_quo_per_period_cents are computed at creation and are immutable thereafter."

  - entity: Member
    initial_state: PENDING
    terminal_states: [CANCELLED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /contributions with revenue_stream == MEMBERSHIP for this member, then POST /contributions/{id}/settlement with outcome == SETTLED (system)"
        actor: system
        preconditions:
          - "member.status == PENDING"
          - "the settling contribution has member_id == member.id and amount_cents >= tier.contribution_amount_cents"
        side_effects:
          - "sets cycle_start_date to the contribution's received_date"
          - "recomputes next_renewal_date via calculations.member_renewal_schedule"
          - "recomputes lifetime_giving_cents and is_major_donor"
          - "recomputes cultivation_locked"
          - "increments Member.version by 1"
      - from: ACTIVE
        to: GRACE
        trigger: "POST /ops/daily-sweep (system)"
        actor: system
        preconditions:
          - "member.status == ACTIVE"
          - "logical clock date > member.next_renewal_date"
        side_effects:
          - "sets grace_expires_at to next_renewal_date 00:00:00Z plus tier.grace_period_days"
          - "increments Member.version by 1"
      - from: GRACE
        to: ACTIVE
        trigger: "POST /members/{id}/lifecycle-actions with action == RENEW"
        actor: DevelopmentOfficer | Member
        preconditions:
          - "member.status == GRACE"
          - "tier.status == PUBLISHED"
        side_effects:
          - "advances cycle_start_date to the previous next_renewal_date and recomputes next_renewal_date"
          - "clears grace_expires_at to null"
          - "increments consecutive_renewals by 1"
          - "increments Member.version by 1"
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /members/{id}/lifecycle-actions with action == RENEW"
        actor: DevelopmentOfficer | Member
        preconditions:
          - "member.status == ACTIVE"
          - "tier.status == PUBLISHED"
        side_effects:
          - "advances cycle_start_date to the previous next_renewal_date and recomputes next_renewal_date"
          - "increments consecutive_renewals by 1"
          - "increments Member.version by 1"
      - from: GRACE
        to: LAPSED
        trigger: "POST /ops/daily-sweep (system)"
        actor: system
        preconditions:
          - "member.status == GRACE"
          - "logical clock >= member.grace_expires_at"
        side_effects:
          - "resets consecutive_renewals to 0"
          - "clears grace_expires_at to null"
          - "increments Member.version by 1"
      - from: LAPSED
        to: ACTIVE
        trigger: "POST /members/{id}/lifecycle-actions with action == REINSTATE"
        actor: DevelopmentOfficer | Member
        preconditions:
          - "member.status == LAPSED"
          - "tier.status == PUBLISHED"
          - "cultivation_locked == false"
        side_effects:
          - "sets cycle_start_date to the logical clock date and recomputes next_renewal_date"
          - "keeps consecutive_renewals at 0"
          - "increments Member.version by 1"
        note: "Closes the ACTIVE -> GRACE -> LAPSED -> ACTIVE cycle."
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /members/{id}/lifecycle-actions with action == CANCEL"
        actor: DevelopmentOfficer | Member
        preconditions:
          - "member.status in {ACTIVE, GRACE, LAPSED}"
        side_effects:
          - "clears next_renewal_date and grace_expires_at to null"
          - "increments Member.version by 1"
        note: "Also legal from GRACE and LAPSED with identical effects."
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /members/{id}/tier-change"
        actor: DevelopmentOfficer | Member
        preconditions:
          - "member.status in {ACTIVE, GRACE}"
          - "new tier.status == PUBLISHED and new_tier_id != member.tier_id"
          - "cultivation_locked == false"
          - "expected_member_version matches member.version"
        side_effects:
          - "repoints tier_id at the new tier and recomputes next_renewal_date under the new cadence"
          - "recomputes quid_pro_quo_cents and deductible_cents on every Contribution of this member whose acknowledgment_status == UNACKNOWLEDGED"
          - "increments Member.version by 1"
        note: "Supersede-style write guarded by OCC; see concurrency_rules.tier-change-stale-member."

  - entity: Funder
    initial_state: PROSPECT
    terminal_states: []
    transitions:
      - from: PROSPECT
        to: CLEARED
        trigger: "POST /funders/{id}/independence-clearance with decision == CLEAR"
        actor: EditorialDirector
        preconditions:
          - "funder.status in {PROSPECT, RESTRICTED}"
          - "X-User-ID != funder.cultivated_by_user_id"
          - "independence_risk_score recomputed under the submitted basis is < RISK_HARD_BAR (60)"
          - "if the recomputed score >= RISK_DISCLOSURE_FLOOR (40) then affiliated_coverage_area_id is not null and a FirewallDisclosure with status == ACTIVE exists for (funder_id, affiliated_coverage_area_id)"
          - "if funder.status == RESTRICTED then no FirewallDisclosure of this funder has status == REATTESTATION_REQUIRED"
        side_effects:
          - "sets risk_basis to the submitted basis, stores audited_advocacy_index when basis == AUDITED, and recomputes independence_risk_score via calculations.funder_independence_risk"
          - "sets cleared_by_user_id to X-User-ID and LEAVES restricted_at untouched, so the cooling-off window of validations[priority=34] keeps running after rehabilitation"
          - "increments Funder.version by 1"
      - from: PROSPECT
        to: RESTRICTED
        trigger: "POST /funders/{id}/independence-clearance with decision == RESTRICT"
        actor: EditorialDirector
        preconditions:
          - "funder.status in {PROSPECT, CLEARED}"
          - "X-User-ID != funder.cultivated_by_user_id"
        side_effects:
          - "recomputes independence_risk_score under the submitted basis and sets restricted_at to the logical clock"
          - "CASCADE hop 2: every FirewallDisclosure of this funder with status == ACTIVE moves to REATTESTATION_REQUIRED with reattestation_reason == FUNDER_RESTRICTED"
          - "CASCADE hop 3: because those disclosures left ACTIVE, each referenced CoverageArea recomputes disclosure_status to STALE and publication_gate to BLOCKED"
          - "CASCADE hop 4: because those CoverageAreas became BLOCKED, every GrantProposal with that coverage_area_id and status == AWARDED moves to SUSPENDED with suspended_reason == FIREWALL_BREACH, clawing back released_cents into returned_cents and debiting FiscalPeriod.reserve_balance_cents by the clawed amount"
          - "CASCADE hop 5: because those proposals left AWARDED, their FiscalPeriod recomputes recognized_revenue_cents, stream_shares_bps, concentration_hhi, top_source_share_bps, reserve_months_target, operating_reserve_target_cents, reserve_months_ratio_bps, sustainability_posture and restricted_release_cap_pct_bps, and each affected CoverageArea recomputes restricted_grant_count"
          - "increments Funder.version by 1"
        note: "Also legal from CLEARED. The same five-hop chain fires when POST /influence-contacts drives the funder into RESTRICTED."
      - from: CLEARED
        to: RESTRICTED
        trigger: "POST /influence-contacts with contact_type == EDITORIAL_DIRECTION_REQUEST, or any contact whose recomputed independence_risk_score >= RISK_HARD_BAR (system)"
        actor: system
        preconditions:
          - "funder.status in {PROSPECT, CLEARED}"
          - "the logged contact_type == EDITORIAL_DIRECTION_REQUEST or the recomputed independence_risk_score >= RISK_HARD_BAR"
        side_effects:
          - "CASCADE hop 1: recomputes prior_editorial_requests_count and independence_risk_score, sets status to RESTRICTED and restricted_at to the logical clock, and sets the new InfluenceContact.triggered_restriction to true"
          - "CASCADE hop 2: every FirewallDisclosure of this funder with status == ACTIVE moves to REATTESTATION_REQUIRED with reattestation_reason == INFLUENCE_CONTACT"
          - "CASCADE hop 3: because those disclosures left ACTIVE, each referenced CoverageArea recomputes disclosure_status to STALE and publication_gate to BLOCKED"
          - "CASCADE hop 4: because those CoverageAreas became BLOCKED, every GrantProposal with that coverage_area_id and status == AWARDED moves to SUSPENDED with suspended_reason == FIREWALL_BREACH, clawing back released_cents into returned_cents and debiting FiscalPeriod.reserve_balance_cents by the clawed amount"
          - "CASCADE hop 5: because those proposals left AWARDED, their FiscalPeriod recomputes every sustainability field and each affected CoverageArea recomputes restricted_grant_count"
          - "increments Funder.version by 1"
        note: "Depth-5 transitive cascade; each hop is caused by the preceding hop, not by the original POST."
      - from: RESTRICTED
        to: CLEARED
        trigger: "POST /funders/{id}/independence-clearance with decision == CLEAR"
        actor: EditorialDirector
        preconditions:
          - "funder.status == RESTRICTED"
          - "every FirewallDisclosure of this funder has status in {ACTIVE, SUPERSEDED, VOID} (no REATTESTATION_REQUIRED left)"
          - "X-User-ID != funder.cultivated_by_user_id"
          - "independence_risk_score recomputed under the submitted basis is < RISK_HARD_BAR"
        side_effects:
          - "recomputes independence_risk_score and sets cleared_by_user_id; restricted_at is NOT cleared, so validations[priority=34] still bars a proposal submission until 30 days after that instant"
          - "increments Funder.version by 1"
        note: "Closes the CLEARED -> RESTRICTED -> CLEARED cycle. Coverage areas return to OPEN only once their disclosures are reattested."

  - entity: FirewallDisclosure
    initial_state: ACTIVE
    terminal_states: [SUPERSEDED, VOID]
    transitions:
      - from: ACTIVE
        to: SUPERSEDED
        trigger: "POST /firewall-disclosures naming this row in supersedes_disclosure_id"
        actor: EditorialDirector
        preconditions:
          - "prior disclosure status in {ACTIVE, REATTESTATION_REQUIRED}"
          - "the new disclosure has the same funder_id and coverage_area_id as the prior one"
          - "expected_funder_version matches funder.version"
        side_effects:
          - "the prior row moves to SUPERSEDED; the new row is created ACTIVE with attested_at set to the logical clock"
          - "the referenced CoverageArea recomputes disclosure_status, publication_gate and disclosed_funder_count"
          - "increments Funder.version by 1"
      - from: ACTIVE
        to: REATTESTATION_REQUIRED
        trigger: "Funder CLEARED->RESTRICTED cascade hop 2 (system)"
        actor: system
        preconditions:
          - "disclosure.status == ACTIVE"
        side_effects:
          - "stores reattestation_reason and forces the CoverageArea's publication_gate to BLOCKED"
          - "increments FirewallDisclosure.version by 1"
      - from: REATTESTATION_REQUIRED
        to: ACTIVE
        trigger: "POST /firewall-disclosures/{id}/attest"
        actor: EditorialDirector
        preconditions:
          - "disclosure.status == REATTESTATION_REQUIRED"
          - "X-User-ID != funder.cultivated_by_user_id"
        side_effects:
          - "clears reattestation_reason, sets attested_by_user_id and attested_at"
          - "the CoverageArea recomputes disclosure_status to CURRENT and publication_gate to OPEN once no disclosure of that area is REATTESTATION_REQUIRED"
          - "increments FirewallDisclosure.version by 1"
        note: "Closes the ACTIVE -> REATTESTATION_REQUIRED -> ACTIVE cycle. Suspended proposals are NOT auto-reinstated; that needs POST /grant-proposals/{id}/reinstate."
      - from: ACTIVE
        to: VOID
        trigger: "POST /firewall-disclosures/{id}/attest with void == true"
        actor: EditorialDirector
        preconditions:
          - "disclosure.status in {ACTIVE, REATTESTATION_REQUIRED}"
          - "no GrantProposal with status == AWARDED references this (funder_id, coverage_area_id) pair"
        side_effects:
          - "sets status to VOID and recomputes the CoverageArea's disclosed_funder_count, disclosure_status and publication_gate"
          - "increments FirewallDisclosure.version by 1"

  - entity: GiftOffer
    initial_state: PROPOSED
    terminal_states: [ACCEPTED, DECLINED]
    transitions:
      - from: PROPOSED
        to: INDEPENDENCE_REVIEW
        trigger: "POST /gift-offers/{id}/submit-for-review"
        actor: DevelopmentOfficer
        preconditions:
          - "gift_offer.status == PROPOSED"
          - "funder.status != RESTRICTED"
          - "if designation != UNRESTRICTED then coverage_area_id is not null and that CoverageArea.publication_gate == OPEN"
        side_effects:
          - "recomputes stewardship_fee_cents and net_acceptable_amount_cents via calculations.gift_stewardship_netting"
          - "recomputes board_ratification_required from offered_amount_cents and funder.independence_risk_score"
          - "increments GiftOffer.version by 1"
      - from: INDEPENDENCE_REVIEW
        to: CONDITIONS_REQUESTED
        trigger: "POST /gift-offers/{id}/independence-review with decision == REQUEST_CONDITIONS"
        actor: EditorialDirector
        preconditions:
          - "gift_offer.status == INDEPENDENCE_REVIEW"
          - "X-User-ID != gift_offer.solicited_by_user_id"
          - "conditions_round_count < MAX_CONDITION_ROUNDS (2)"
        side_effects:
          - "increments conditions_round_count by 1 and stores the conditions note in donor_conditions"
          - "increments GiftOffer.version by 1"
      - from: CONDITIONS_REQUESTED
        to: INDEPENDENCE_REVIEW
        trigger: "POST /gift-offers/{id}/submit-for-review"
        actor: DevelopmentOfficer
        preconditions:
          - "gift_offer.status == CONDITIONS_REQUESTED"
          - "funder.status != RESTRICTED"
        side_effects:
          - "recomputes stewardship_fee_cents, net_acceptable_amount_cents and board_ratification_required"
          - "increments GiftOffer.version by 1"
        note: "Closes the INDEPENDENCE_REVIEW -> CONDITIONS_REQUESTED -> INDEPENDENCE_REVIEW negotiation cycle, bounded by MAX_CONDITION_ROUNDS."
      - from: INDEPENDENCE_REVIEW
        to: CLEARED
        trigger: "POST /gift-offers/{id}/independence-review with decision == CLEAR"
        actor: EditorialDirector
        preconditions:
          - "gift_offer.status == INDEPENDENCE_REVIEW"
          - "X-User-ID != gift_offer.solicited_by_user_id"
          - "funder.status == CLEARED"
          - "funder.independence_risk_score < RISK_HARD_BAR (60)"
          - "if designation != UNRESTRICTED then a FirewallDisclosure with status == ACTIVE exists for (funder_id, coverage_area_id)"
        side_effects:
          - "snapshots funder.independence_risk_score into acceptance_gate_score and sets cleared_by_user_id"
          - "increments GiftOffer.version by 1"
      - from: INDEPENDENCE_REVIEW
        to: DECLINED
        trigger: "POST /gift-offers/{id}/independence-review with decision == DECLINE"
        actor: EditorialDirector
        preconditions:
          - "gift_offer.status in {INDEPENDENCE_REVIEW, CONDITIONS_REQUESTED}"
          - "X-User-ID != gift_offer.solicited_by_user_id"
        side_effects:
          - "records cleared_by_user_id as the deciding reviewer; no contribution is created"
          - "increments GiftOffer.version by 1"
      - from: CLEARED
        to: CLEARED
        trigger: "POST /gift-offers/{id}/board-ratification"
        actor: BoardOversight
        preconditions:
          - "gift_offer.status == CLEARED"
          - "board_ratification_required == true and board_ratified_by_user_id is null"
          - "X-User-ID not in {gift_offer.solicited_by_user_id, gift_offer.cleared_by_user_id}"
        side_effects:
          - "sets board_ratified_by_user_id to X-User-ID"
          - "increments GiftOffer.version by 1"
      - from: CLEARED
        to: ACCEPTED
        trigger: "POST /gift-offers/{id}/accept"
        actor: DevelopmentOfficer
        preconditions:
          - "gift_offer.status == CLEARED"
          - "funder.status == CLEARED"
          - "fiscal_period.status == OPEN"
          - "board_ratification_required == false or board_ratified_by_user_id is not null"
          - "if designation != UNRESTRICTED then the CoverageArea.publication_gate == OPEN"
        side_effects:
          - "creates a Contribution with revenue_stream == MAJOR_GIFT, funder_id, gift_offer_id, amount_cents == net_acceptable_amount_cents, settlement_status == INITIATED and acknowledgment_status == UNACKNOWLEDGED"
          - "recomputes funder.lifetime_committed_cents"
          - "increments GiftOffer.version by 1"
        note: "The cascade-created Contribution is discoverable only through GET /contributions?gift_offer_id=..."

  - entity: GrantProposal
    initial_state: DRAFT
    terminal_states: [DECLINED, WITHDRAWN, CLOSED]
    transitions:
      - from: DRAFT
        to: INDEPENDENCE_REVIEW
        trigger: "POST /grant-proposals/{id}/pipeline-actions with action == SUBMIT_FOR_REVIEW"
        actor: DevelopmentOfficer
        preconditions:
          - "grant_proposal.status in {DRAFT, REVISION_REQUESTED}"
          - "if restriction_type != UNRESTRICTED then coverage_area_id, restriction_start_date and restriction_end_date are all non-null"
        side_effects:
          - "increments GrantProposal.version by 1"
      - from: INDEPENDENCE_REVIEW
        to: REVISION_REQUESTED
        trigger: "POST /grant-proposals/{id}/internal-review with decision == REQUEST_REVISION"
        actor: EditorialDirector
        preconditions:
          - "grant_proposal.status == INDEPENDENCE_REVIEW"
          - "X-User-ID != grant_proposal.drafted_by_user_id"
          - "revision_round_count < MAX_REVISION_ROUNDS (3)"
        side_effects:
          - "increments revision_round_count by 1"
          - "increments GrantProposal.version by 1"
      - from: REVISION_REQUESTED
        to: DRAFT
        trigger: "POST /grant-proposals/{id}/pipeline-actions with action == REVISE"
        actor: DevelopmentOfficer
        preconditions:
          - "grant_proposal.status == REVISION_REQUESTED"
        side_effects:
          - "increments GrantProposal.version by 1"
        note: "Closes the INDEPENDENCE_REVIEW -> REVISION_REQUESTED -> DRAFT -> INDEPENDENCE_REVIEW proposal-development cycle."
      - from: INDEPENDENCE_REVIEW
        to: CLEARED
        trigger: "POST /grant-proposals/{id}/internal-review with decision == CLEAR"
        actor: EditorialDirector
        preconditions:
          - "grant_proposal.status == INDEPENDENCE_REVIEW"
          - "X-User-ID != grant_proposal.drafted_by_user_id"
          - "funder.status == CLEARED"
          - "if restriction_type != UNRESTRICTED then a FirewallDisclosure with status == ACTIVE exists for (funder_id, coverage_area_id)"
        side_effects:
          - "sets cleared_by_user_id to X-User-ID"
          - "increments GrantProposal.version by 1"
      - from: CLEARED
        to: SUBMITTED
        trigger: "POST /grant-proposals/{id}/pipeline-actions with action == SUBMIT"
        actor: DevelopmentOfficer
        preconditions:
          - "grant_proposal.status == CLEARED"
          - "funder.status != RESTRICTED"
          - "if restriction_type != UNRESTRICTED then CoverageArea.publication_gate == OPEN"
          - "no other GrantProposal of this funder with status in {SUBMITTED, AWARDED} has a restriction window within COOLING_OFF_DAYS (30) of this one"
          - "fiscal_period.status == OPEN"
        side_effects:
          - "the proposal now counts toward the PIPELINE revenue variant at award_probability_bps weight"
          - "increments GrantProposal.version by 1"
      - from: SUBMITTED
        to: AWARDED
        trigger: "POST /grant-proposals/{id}/record-outcome with outcome == AWARDED"
        actor: DevelopmentOfficer
        preconditions:
          - "grant_proposal.status == SUBMITTED"
          - "fiscal_period.status == OPEN and award_date falls inside the period's inclusive date range"
          - "awarded_amount_cents >= 1 and <= requested_amount_cents"
          - "if restriction_type != UNRESTRICTED then the CoverageArea has fewer than MAX_RESTRICTED_GRANTS_PER_AREA (2) proposals with status == AWARDED whose restriction windows overlap this one"
        side_effects:
          - "sets awarded_amount_cents, unreleased_cents = awarded_amount_cents, released_cents = 0, returned_cents = 0 and award_date"
          - "generates GrantReport rows per calculations.report_obligation_schedule (0 rows when reporting_cadence == NONE) and sets report_count"
          - "allocates allocated_release_cents across those reports via calculations.restricted_release_waterfall"
          - "recomputes funder.lifetime_committed_cents and CoverageArea.restricted_grant_count"
          - "recomputes every FiscalPeriod sustainability field on the RECOGNIZED basis"
          - "increments GrantProposal.version by 1"
      - from: SUBMITTED
        to: DECLINED
        trigger: "POST /grant-proposals/{id}/record-outcome with outcome == DECLINED"
        actor: DevelopmentOfficer
        preconditions:
          - "grant_proposal.status == SUBMITTED"
        side_effects:
          - "leaves awarded_amount_cents at 0 and drops the proposal from the PIPELINE variant"
          - "recomputes every FiscalPeriod sustainability field on the RECOGNIZED basis"
          - "increments GrantProposal.version by 1"
      - from: AWARDED
        to: AWARDED
        trigger: "POST /grant-proposals/{id}/release-restricted-funds"
        actor: FinanceController
        preconditions:
          - "grant_proposal.status == AWARDED"
          - "fiscal_period.status == OPEN"
          - "compliance_flag == COMPLIANT"
          - "sustainability_posture != CRITICAL"
          - "request_amount_cents <= round_half_up(unreleased_cents * restricted_release_cap_pct_bps / 10000), a check that is vacuous and skipped when the cap is 10000 bps"
          - "request_amount_cents <= the free capacity of the release buckets (validations[priority=51])"
        side_effects:
          - "moves request_amount_cents from unreleased_cents to released_cents, preserving awarded_amount_cents == released_cents + unreleased_cents + returned_cents"
          - "fills the report buckets in due_date ASC order via calculations.restricted_release_waterfall, raising consumed_release_cents per bucket"
          - "credits FiscalPeriod.reserve_balance_cents by request_amount_cents and recomputes reserve_months_ratio_bps and sustainability_posture"
          - "increments GrantProposal.version by 1"
      - from: AWARDED
        to: SUSPENDED
        trigger: "Funder RESTRICTED cascade hop 4, or GrantReport SCHEDULED->OVERDUE cascade hop 2 (system)"
        actor: system
        preconditions:
          - "grant_proposal.status == AWARDED"
        side_effects:
          - "sets suspended_reason to FIREWALL_BREACH or REPORT_DELINQUENCY"
          - "claws back the released principal: returned_cents += released_cents, released_cents = 0, and debits FiscalPeriod.reserve_balance_cents by the same amount, preserving awarded_amount_cents == released_cents + unreleased_cents + returned_cents"
          - "recomputes CoverageArea.restricted_grant_count and every FiscalPeriod sustainability field"
          - "increments GrantProposal.version by 1"
      - from: SUSPENDED
        to: AWARDED
        trigger: "POST /grant-proposals/{id}/reinstate"
        actor: FinanceController
        preconditions:
          - "grant_proposal.status == SUSPENDED"
          - "funder.status == CLEARED"
          - "if restriction_type != UNRESTRICTED then CoverageArea.publication_gate == OPEN"
          - "compliance_flag == COMPLIANT (no report of this proposal is OVERDUE)"
        side_effects:
          - "restores the clawed principal as unreleased: unreleased_cents += returned_cents, returned_cents = 0, keeping awarded_amount_cents == released_cents + unreleased_cents + returned_cents"
          - "resets every report's consumed_release_cents to 0 and re-runs calculations.restricted_release_waterfall"
          - "clears suspended_reason and recomputes CoverageArea.restricted_grant_count and FiscalPeriod sustainability fields"
          - "increments GrantProposal.version by 1"
        note: "Closes the AWARDED -> SUSPENDED -> AWARDED cycle and is the compensating action for the clawback."
      - from: AWARDED
        to: CLOSED
        trigger: "POST /grant-proposals/{id}/close"
        actor: FinanceController
        preconditions:
          - "grant_proposal.status == AWARDED"
          - "every GrantReport of this proposal has status in {ACCEPTED, SCHEDULED, WAIVED}"
          - "unreleased_cents == 0 or a closure justification is supplied"
        side_effects:
          - "every GrantReport with status == SCHEDULED moves to WAIVED"
          - "returns any remaining unreleased principal: returned_cents += unreleased_cents, unreleased_cents = 0"
          - "increments GrantProposal.version by 1"
      - from: DRAFT
        to: WITHDRAWN
        trigger: "POST /grant-proposals/{id}/pipeline-actions with action == WITHDRAW"
        actor: DevelopmentOfficer
        preconditions:
          - "grant_proposal.status in {DRAFT, INDEPENDENCE_REVIEW, REVISION_REQUESTED, CLEARED, SUBMITTED}"
        side_effects:
          - "drops the proposal from the PIPELINE variant and recomputes FiscalPeriod sustainability fields"
          - "increments GrantProposal.version by 1"
        note: "Also legal from INDEPENDENCE_REVIEW, REVISION_REQUESTED, CLEARED and SUBMITTED."

  - entity: GrantReport
    initial_state: SCHEDULED
    terminal_states: [ACCEPTED, WAIVED]
    transitions:
      - from: SCHEDULED
        to: SUBMITTED
        trigger: "POST /grant-reports/{id}/submit"
        actor: DevelopmentOfficer
        preconditions:
          - "grant_report.status in {SCHEDULED, OVERDUE, RETURNED}"
          - "grant_proposal.status in {AWARDED, SUSPENDED}"
          - "spend_reported_cents <= grant_report.consumed_release_cents"
        side_effects:
          - "sets submitted_at to the logical clock and computes variance_bps"
          - "increments GrantReport.version by 1"
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /grant-reports/{id}/review with decision == ACCEPT"
        actor: FinanceController
        preconditions:
          - "grant_report.status == SUBMITTED"
          - "abs(variance_bps) <= MAX_ACCEPTABLE_VARIANCE_BPS (2000)"
        side_effects:
          - "recomputes grant_proposal.compliance_flag"
          - "increments GrantReport.version by 1"
      - from: SUBMITTED
        to: RETURNED
        trigger: "POST /grant-reports/{id}/review with decision == RETURN"
        actor: FinanceController
        preconditions:
          - "grant_report.status == SUBMITTED"
        side_effects:
          - "clears spend_reported_cents and variance_bps back to null"
          - "increments GrantReport.version by 1"
      - from: RETURNED
        to: SUBMITTED
        trigger: "POST /grant-reports/{id}/submit"
        actor: DevelopmentOfficer
        preconditions:
          - "grant_report.status == RETURNED"
        side_effects:
          - "sets submitted_at to the logical clock and recomputes variance_bps"
          - "increments GrantReport.version by 1"
        note: "Closes the SUBMITTED -> RETURNED -> SUBMITTED revision cycle."
      - from: SCHEDULED
        to: OVERDUE
        trigger: "POST /ops/daily-sweep (system)"
        actor: system
        preconditions:
          - "grant_report.status == SCHEDULED"
          - "logical clock date > grant_report.due_date"
        side_effects:
          - "CASCADE hop 1: the report moves to OVERDUE"
          - "CASCADE hop 2: because the report became OVERDUE, grant_proposal.compliance_flag becomes DELINQUENT and, if grant_proposal.status == AWARDED, the proposal moves to SUSPENDED with suspended_reason == REPORT_DELINQUENCY, clawing released_cents into returned_cents and debiting FiscalPeriod.reserve_balance_cents"
          - "CASCADE hop 3: because the proposal left AWARDED, funder.reporting_reliability_bps drops by RELIABILITY_PENALTY_BPS (2000) floored at 0 and funder.independence_risk_score is recomputed; if the new score >= RISK_HARD_BAR the funder moves to RESTRICTED and its own cascade hops 2-5 run"
          - "CASCADE hop 4: because the proposal left AWARDED, its FiscalPeriod recomputes every sustainability field and its CoverageArea recomputes restricted_grant_count"
          - "increments GrantReport.version by 1"
        note: "Depth-4 cascade whose trigger differs from the Funder-restriction cascade."
      - from: OVERDUE
        to: SUBMITTED
        trigger: "POST /grant-reports/{id}/submit"
        actor: DevelopmentOfficer
        preconditions:
          - "grant_report.status == OVERDUE"
        side_effects:
          - "sets submitted_at and variance_bps; compliance_flag stays DELINQUENT until the report is ACCEPTED"
          - "increments GrantReport.version by 1"
      - from: SCHEDULED
        to: WAIVED
        trigger: "POST /grant-proposals/{id}/close (system)"
        actor: system
        preconditions:
          - "grant_report.status == SCHEDULED"
          - "grant_proposal is transitioning AWARDED -> CLOSED"
        side_effects:
          - "increments GrantReport.version by 1"

  - entity: Contribution
    initial_state: "settlement_status=INITIATED x acknowledgment_status=UNACKNOWLEDGED"
    terminal_states: ["settlement_status=FAILED", "settlement_status=REFUNDED", "acknowledgment_status=DISCLOSED"]
    transitions:
      - from: INITIATED
        to: SETTLED
        trigger: "POST /contributions/{id}/settlement with outcome == SETTLED"
        actor: FinanceController
        preconditions:
          - "contribution.settlement_status == INITIATED"
          - "fiscal_period.status == OPEN"
        side_effects:
          - "when revenue_stream == MEMBERSHIP: recomputes member.lifetime_giving_cents, is_major_donor and cultivation_locked, and activates a PENDING member (see Member PENDING->ACTIVE)"
          - "when revenue_stream == MAJOR_GIFT: recomputes funder.lifetime_committed_cents"
          - "when revenue_stream == SYNDICATION: recomputes collaboration.syndication_revenue_cents"
          - "recomputes every FiscalPeriod sustainability field on the RECOGNIZED basis"
          - "increments Contribution.version by 1"
        note: "Dimension: settlement_status. Independent of acknowledgment_status, which may already be RECEIPTED."
      - from: INITIATED
        to: FAILED
        trigger: "POST /contributions/{id}/settlement with outcome == FAILED"
        actor: FinanceController
        preconditions:
          - "contribution.settlement_status == INITIATED"
        side_effects:
          - "no revenue is recognized; a PENDING member stays PENDING"
          - "increments Contribution.version by 1"
        note: "Dimension: settlement_status."
      - from: SETTLED
        to: REFUNDED
        trigger: "POST /contributions/{id}/refund"
        actor: FinanceController
        preconditions:
          - "contribution.settlement_status == SETTLED"
          - "fiscal_period.status == OPEN"
        side_effects:
          - "CASCADE hop 1: sets settlement_status to REFUNDED and refunded_at to the logical clock"
          - "CASCADE hop 2: because the contribution left SETTLED, member.lifetime_giving_cents drops by amount_cents and is_major_donor plus cultivation_locked are recomputed"
          - "CASCADE hop 3: because the member is no longer counted, the linked Funder (member.linked_funder_id, or funder_id for MAJOR_GIFT rows) recomputes lifetime_committed_cents"
          - "CASCADE hop 4: because those source totals changed, the FiscalPeriod recomputes recognized_revenue_cents, stream_shares_bps, concentration_hhi, top_source_share_bps, reserve_months_target, operating_reserve_target_cents, reserve_months_ratio_bps, sustainability_posture and restricted_release_cap_pct_bps"
          - "acknowledgment_status is left untouched - a refunded contribution keeps its receipt record"
          - "increments Contribution.version by 1"
        note: "Dimension: settlement_status. Compensating action for SETTLED; the giving-ledger invariant must hold after it."
      - from: UNACKNOWLEDGED
        to: RECEIPTED
        trigger: "POST /contributions/{id}/acknowledge with disclose_publicly == false"
        actor: DevelopmentOfficer
        preconditions:
          - "contribution.acknowledgment_status == UNACKNOWLEDGED"
          - "contribution.settlement_status != FAILED"
        side_effects:
          - "assigns receipt_number as 'RCPT-' plus a zero-padded 6-digit counter incremented per receipt in created_at ASC order of acknowledgment"
          - "freezes quid_pro_quo_cents and deductible_cents - later tier changes no longer recompute them"
          - "increments Contribution.version by 1"
        note: "Dimension: acknowledgment_status. Reachable while settlement_status is still INITIATED."
      - from: RECEIPTED
        to: DISCLOSED
        trigger: "POST /contributions/{id}/acknowledge with disclose_publicly == true"
        actor: DevelopmentOfficer
        preconditions:
          - "contribution.acknowledgment_status == RECEIPTED"
          - "contribution.settlement_status == SETTLED"
          - "when revenue_stream == MAJOR_GIFT and gift_offer.designation != UNRESTRICTED, a FirewallDisclosure with status == ACTIVE must exist for (funder_id, gift_offer.coverage_area_id)"
        side_effects:
          - "the contribution becomes visible in GET /coverage-areas/{id}/transparency-report"
          - "increments Contribution.version by 1"
        note: "Dimension: acknowledgment_status."

  - entity: Collaboration
    initial_state: DRAFT
    terminal_states: [SETTLED, DISSOLVED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /collaborations/{id}/status-actions with action == ACTIVATE"
        actor: EditorialDirector
        preconditions:
          - "collaboration.status == DRAFT"
          - "partner_count >= 1"
          - "lead_credit_bps + sum(credit_share_bps of CONFIRMED partners) == 10000"
          - "lead_cost_share_bps + sum(cost_share_bps of CONFIRMED partners) == 10000"
          - "CoverageArea.publication_gate == OPEN"
          - "fiscal_period.status == OPEN"
          - "no other Collaboration with status == ACTIVE on the same coverage_area_id has a half-open [window_start, window_end) interval overlapping this one"
        side_effects:
          - "runs calculations.collaboration_cost_split, writing cost_owed_cents and remainder_rank on every CONFIRMED partner plus lead_cost_cents and allocated_cost_cents"
          - "increments Collaboration.version by 1"
      - from: ACTIVE
        to: SETTLED
        trigger: "POST /collaborations/{id}/status-actions with action == SETTLE"
        actor: EditorialDirector
        preconditions:
          - "collaboration.status == ACTIVE"
          - "logical clock >= window_end"
          - "allocated_cost_cents == total_cost_cents"
        side_effects:
          - "sets settled_at and recomputes syndication_revenue_cents"
          - "increments Collaboration.version by 1"
      - from: DRAFT
        to: DISSOLVED
        trigger: "POST /collaborations/{id}/status-actions with action == DISSOLVE"
        actor: EditorialDirector
        preconditions:
          - "collaboration.status in {DRAFT, ACTIVE}"
        side_effects:
          - "every CONFIRMED partner moves to WITHDRAWN, their cost_owed_cents reset to 0 and their shares folded into lead_cost_share_bps and lead_credit_bps"
          - "lead_cost_cents and allocated_cost_cents are recomputed so allocated_cost_cents == total_cost_cents still holds"
          - "increments Collaboration.version by 1"
        note: "Also legal from ACTIVE."

  - entity: CollaborationPartner
    initial_state: CONFIRMED
    terminal_states: [WITHDRAWN]
    transitions:
      - from: CONFIRMED
        to: WITHDRAWN
        trigger: "POST /collaboration-partners/{id}/withdraw"
        actor: EditorialDirector
        preconditions:
          - "partner.status == CONFIRMED"
          - "collaboration.status in {DRAFT, ACTIVE}"
        side_effects:
          - "folds the partner's shares into the lead: collaboration.lead_cost_share_bps += partner.cost_share_bps and collaboration.lead_credit_bps += partner.credit_share_bps"
          - "sets partner.cost_owed_cents to 0 and remainder_rank to 0"
          - "re-runs calculations.collaboration_cost_split over the remaining CONFIRMED partners so sum(cost_owed_cents) + lead_cost_cents == total_cost_cents still holds exactly"
          - "decrements collaboration.partner_count and increments Collaboration.version by 1"
          - "increments CollaborationPartner.version by 1"
        note: "Compensating action for POST /collaborations/{id}/partners; the cost-conservation invariant must hold before and after."

# ---------------------------------------------------------------------------
# §1.2.1 Concurrency Rules  (OCC on the parent's `version` only)
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: disclosure-create-stale-funder
    parent_entity: Funder
    write_endpoint: "POST /firewall-disclosures"
    occ_field: "expected_funder_version"
    description: |
      Creating a FirewallDisclosure for a (funder_id, coverage_area_id) pair whose Funder
      version has advanced since the client last read it is rejected. A new disclosure
      legitimately supersedes the pair's prior disclosure, so a writer holding a stale view
      of the funder would silently retire an attestation it never saw - including one filed
      seconds earlier by another editor, or one invalidated by a funder restriction cascade.
    error_id: ERR_STALE_FUNDER_VERSION
    http_status: 412

  - rule_id: tier-change-stale-member
    parent_entity: Member
    write_endpoint: "POST /members/{id}/tier-change"
    occ_field: "expected_member_version"
    description: |
      Repointing a Member at a new MembershipTier supersedes the prior tier assignment and
      rewrites quid_pro_quo_cents and deductible_cents on every unacknowledged Contribution
      of that member. A request carrying a Member version older than the stored one is
      rejected, because the client's view of the tier, the renewal cadence and the
      unacknowledged receipt set is stale.
    error_id: ERR_STALE_MEMBER_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# §1.3 Calculation Rules Table
# ---------------------------------------------------------------------------
calculations:
  - name: tier_quid_pro_quo_value
    trigger: "POST /membership-tiers (at creation); values are frozen from then on and re-read by every MEMBERSHIP contribution"
    algorithm: threshold
    formula: |
      insubstantial_threshold_cents =
          min(round_half_up(contribution_amount_cents * INSUBSTANTIAL_PCT_BPS / 10000),
              INSUBSTANTIAL_CAP_CENTS)

      # STEP 1 - per-benefit per-period fair market value, ROUNDED TO WHOLE CENTS FIRST.
      for each benefit b in benefits, iterated in the order supplied in the request array:
          if renewal_cadence == ANNUAL:
              per_period_fmv_b = b.annual_fair_market_value_cents
          else:   # MONTHLY
              per_period_fmv_b = round_half_up(b.annual_fair_market_value_cents / 12)
          is_insubstantial_b = (per_period_fmv_b <= insubstantial_threshold_cents)   # <= , NOT <

      # STEP 2 - sum only the substantial ones, AFTER per-benefit rounding.
      quid_pro_quo_per_period_cents =
          sum(per_period_fmv_b for b where is_insubstantial_b == false)

      insubstantial_benefit_codes = [b.benefit_code for b where is_insubstantial_b == true]
      benefit_count = len(benefits)
    input_set: "Every item of MembershipTier.benefits, in request-array order. No entity state filtering - benefits are immutable once the tier exists."
    constants:
      INSUBSTANTIAL_PCT_BPS: 200
      INSUBSTANTIAL_CAP_CENTS: 13000
    precision: "whole cents, round_half_up; ROUNDING ORDER IS PINNED - round each benefit's per-period FMV to whole cents FIRST, then sum. Summing annual FMVs and dividing the total by 12 is NOT permitted and yields a different result (three benefits at 1000 cents/year on a MONTHLY tier give 83+83+83 = 249, not round(3000/12) = 250)."
    variants: []

  - name: contribution_deductible_split
    trigger: "POST /contributions and the MAJOR_GIFT contribution created by POST /gift-offers/{id}/accept; recomputed by POST /members/{id}/tier-change while acknowledgment_status == UNACKNOWLEDGED; frozen at RECEIPTED"
    algorithm: aggregation
    formula: |
      if revenue_stream in {EVENTS, SYNDICATION}:
          quid_pro_quo_cents = 0
          deductible_cents   = 0          # earned revenue, never deductible
      elif revenue_stream == MAJOR_GIFT:
          quid_pro_quo_cents = 0          # no benefits attach to major gifts
          deductible_cents   = amount_cents
      else:   # MEMBERSHIP
          quid_pro_quo_cents = tier.quid_pro_quo_per_period_cents   # tier == Member.tier_id at evaluation time
          deductible_cents   = max(0, amount_cents - quid_pro_quo_cents)
    input_set: "The single Contribution row plus the MembershipTier currently referenced by Member.tier_id. Contributions whose acknowledgment_status is RECEIPTED or DISCLOSED are excluded from recomputation."
    constants: {}
    precision: "whole cents; no rounding needed - both operands are integers"
    variants: []

  - name: gift_stewardship_netting
    trigger: "POST /gift-offers/{id}/submit-for-review (PROPOSED->INDEPENDENCE_REVIEW and CONDITIONS_REQUESTED->INDEPENDENCE_REVIEW)"
    algorithm: tiered_pricing
    formula: |
      # EVALUATION ORDER IS PINNED. The fee tier is keyed on the GROSS offered amount,
      # which is evaluated BEFORE the net is known. Keying the tier on
      # net_acceptable_amount_cents (which itself depends on the fee) is a
      # circular definition and is FORBIDDEN.
      # STEP 1 - select the tier from offered_amount_cents (the gross):
      if   offered_amount_cents <  FEE_TIER_1_FLOOR_CENTS: fee_bps = 0
      elif offered_amount_cents <  FEE_TIER_2_FLOOR_CENTS: fee_bps = FEE_TIER_1_BPS
      else:                                               fee_bps = FEE_TIER_2_BPS
      # STEP 2 - only now compute the fee and the net:
      stewardship_fee_cents       = round_half_up(offered_amount_cents * fee_bps / 10000)
      net_acceptable_amount_cents = offered_amount_cents - stewardship_fee_cents
      # STEP 3 - ratification gate, evaluated on the GROSS as well:
      board_ratification_required =
          (offered_amount_cents >= BOARD_RATIFICATION_THRESHOLD_CENTS)
          or (funder.independence_risk_score >= RATIFICATION_RISK_FLOOR)
    input_set: "The single GiftOffer row plus the current independence_risk_score of its Funder."
    constants:
      FEE_TIER_1_FLOOR_CENTS: 1000000
      FEE_TIER_2_FLOOR_CENTS: 5000000
      FEE_TIER_1_BPS: 150
      FEE_TIER_2_BPS: 250
      BOARD_RATIFICATION_THRESHOLD_CENTS: 2500000
      RATIFICATION_RISK_FLOOR: 40
    precision: "whole cents, round_half_up. Tier floors are inclusive (>=): a 5000000-cent gift is charged FEE_TIER_2_BPS, not FEE_TIER_1_BPS."
    variants: []

  - name: funder_independence_risk
    trigger: "POST /funders (creation), POST /funders/{id}/independence-clearance, POST /influence-contacts, and GrantReport SCHEDULED->OVERDUE cascade hop 3"
    algorithm: weighted_scoring
    formula: |
      advocacy_index = per variant (see variants)
      raw = TYPE_WEIGHT[funder_type]
          + ADVOCACY_WEIGHT * advocacy_index
          + EDITORIAL_REQUEST_WEIGHT * prior_editorial_requests_count
          + (AFFILIATION_WEIGHT if affiliated_coverage_area_id is not null else 0)
          + round_half_up(RELIABILITY_WEIGHT * (10000 - reporting_reliability_bps) / 10000)
      independence_risk_score = min(100, raw)

      prior_editorial_requests_count =
          count(InfluenceContact where funder_id == this funder
                and contact_type in {EDITORIAL_DIRECTION_REQUEST, CONDITION_ATTEMPT})
      reporting_reliability_bps =
          max(0, 10000 - RELIABILITY_PENALTY_BPS * count(GrantReport of this funder's
              proposals that have ever entered OVERDUE))
    input_set: "The Funder row, all of its InfluenceContact rows regardless of age, and the OVERDUE history of every GrantReport under its proposals in any status except WITHDRAWN."
    constants:
      TYPE_WEIGHT: { FOUNDATION: 10, INDIVIDUAL: 5, CORPORATE: 25, GOVERNMENT: 20 }
      ADVOCACY_WEIGHT: 4
      EDITORIAL_REQUEST_WEIGHT: 8
      AFFILIATION_WEIGHT: 10
      RELIABILITY_WEIGHT: 25
      RELIABILITY_PENALTY_BPS: 2000
      SELF_ATTESTED_ADVOCACY_INDEX: 3
      RISK_DISCLOSURE_FLOOR: 40
      RISK_HARD_BAR: 60
    precision: "integer score, clamped to 0-100; the reliability term is round_half_up before summing"
    variants:
      - name: self_attested
        when: "risk_basis == SELF_ATTESTED - the default at funder creation and whenever a clearance is filed with basis == SELF_ATTESTED"
        difference: "advocacy_index = SELF_ATTESTED_ADVOCACY_INDEX (3) when self_attested_advocacy == true, else 0. audited_advocacy_index is ignored even when present."
      - name: audited
        when: "risk_basis == AUDITED - set by POST /funders/{id}/independence-clearance with basis == AUDITED and a supplied audited_advocacy_index"
        difference: "advocacy_index = audited_advocacy_index (0-10) verbatim; self_attested_advocacy is ignored. A FOUNDATION with an affiliated area and self_attested_advocacy == true scores 32 self-attested but 48 audited at audited_advocacy_index == 7, which crosses RISK_DISCLOSURE_FLOOR and flips both the disclosure precondition and board_ratification_required."

  - name: revenue_diversification_index
    trigger: "Every Contribution settlement/refund, every award/decline/suspension/reinstatement/close of a GrantProposal, FiscalPeriod LOCK, and GET /fiscal-periods/{id}/sustainability"
    algorithm: aggregation
    formula: |
      # STEP 1 - stream totals over the period's input set (see variants for membership).
      MEMBERSHIP  = sum(Contribution.amount_cents where fiscal_period_id == P
                        and revenue_stream == MEMBERSHIP  and settlement_status in SETTLED_SET)
      MAJOR_GIFT  = sum(... revenue_stream == MAJOR_GIFT  and settlement_status in SETTLED_SET)
      EVENTS      = sum(... revenue_stream == EVENTS      and settlement_status in SETTLED_SET)
      SYNDICATION = sum(... revenue_stream == SYNDICATION and settlement_status in SETTLED_SET)
      GRANTS      = sum(GrantProposal.awarded_amount_cents where fiscal_period_id == P
                        and status in {AWARDED, CLOSED})
                    + PIPELINE_GRANT_TERM
      # SUSPENDED, DECLINED, WITHDRAWN, SUBMITTED, CLEARED, DRAFT, REVISION_REQUESTED
      # and INDEPENDENCE_REVIEW proposals contribute 0 to the RECOGNIZED basis.

      # STEP 2 - total and per-stream shares.
      recognized_revenue_cents = MEMBERSHIP + MAJOR_GIFT + GRANTS + EVENTS + SYNDICATION
      for each stream s:
          stream_shares_bps[s] = 0 if total == 0
                                 else round_half_up(10000 * revenue_s / total)

      # STEP 3 - concentration index over the FIVE stream shares.
      concentration_hhi = round_half_up(sum(stream_shares_bps[s] ** 2 for all s) / 10000)

      # STEP 4 - largest single institutional source (Funder rows only; Members are
      #          retail sources and are excluded by policy).
      for each Funder F:
          source_total(F) = sum(Contribution.amount_cents where funder_id == F
                                and fiscal_period_id == P and settlement_status in SETTLED_SET)
                          + sum(GrantProposal.awarded_amount_cents where funder_id == F
                                and fiscal_period_id == P and status in {AWARDED, CLOSED})
                          + PIPELINE_SOURCE_TERM(F)
      top_source_share_bps = 0 if total == 0
                             else round_half_up(10000 * max(source_total(F)) / total)
    input_set: "All Contribution rows of the period filtered by settlement_status per variant, plus all GrantProposal rows of the period filtered by status per variant. Ties in max(source_total) do not affect the result because only the value is reported."
    constants: {}
    precision: "share_bps and top_source_share_bps are whole basis points, round_half_up; concentration_hhi is a whole number 0-10000, round_half_up applied once at the end (never per-term)"
    variants:
      - name: recognized
        when: "The persisted basis. Written to FiscalPeriod.recognized_revenue_cents / stream_shares_bps / concentration_hhi / top_source_share_bps on every triggering mutation, and returned by GET /fiscal-periods/{id}/sustainability with basis omitted or basis == RECOGNIZED."
        difference: "SETTLED_SET = {SETTLED}. PIPELINE_GRANT_TERM = 0 and PIPELINE_SOURCE_TERM(F) = 0. Cash and signed awards only."
      - name: pipeline
        when: "Read-only projection returned by GET /fiscal-periods/{id}/sustainability?basis=PIPELINE. Never persisted."
        difference: "SETTLED_SET = {SETTLED, INITIATED} and PIPELINE_GRANT_TERM = sum(round_half_up(requested_amount_cents * award_probability_bps / 10000) for proposals of the period with status == SUBMITTED), with the same term added into PIPELINE_SOURCE_TERM(F) per funder. Identical stored rows therefore yield a different HHI, a different top_source_share_bps, and possibly a different reserve_months_target than the recognized basis."

  - name: reserve_policy_posture
    trigger: "Immediately after every revenue_diversification_index evaluation, and on GET /fiscal-periods/{id}/sustainability"
    algorithm: constraint_propagation
    formula: |
      # EVALUATION ORDER IS PINNED - each step consumes only the steps above it.
      # (1) concentration_hhi and (2) top_source_share_bps come from
      #     revenue_diversification_index on the SAME basis.
      # (3) reserve months target:
      reserve_months_target = RESERVE_MONTHS_BASE
          + (1 if concentration_hhi     >= HHI_ESCALATION_1     else 0)
          + (1 if top_source_share_bps  >= TOP_SOURCE_ESCALATION else 0)
      # (4) target cash:
      operating_reserve_target_cents = monthly_expense_base_cents * reserve_months_target
      # (5) actual months on hand:
      reserve_months_ratio_bps =
          round_half_up(10000 * reserve_balance_cents / monthly_expense_base_cents)
      # (6) posture, first matching branch wins:
      if   reserve_balance_cents <  monthly_expense_base_cents:            posture = CRITICAL
      elif reserve_balance_cents <  round_half_up(operating_reserve_target_cents / 2):
                                                                          posture = CONSTRAINED
      elif reserve_balance_cents <  operating_reserve_target_cents
           or concentration_hhi  >= HHI_WATCH:                             posture = WATCH
      else:                                                               posture = HEALTHY
      # (7) release cap:
      restricted_release_cap_pct_bps = RELEASE_CAP_BPS[posture]
    input_set: "The FiscalPeriod row's monthly_expense_base_cents and reserve_balance_cents plus the concentration outputs of the same basis. reserve_balance_cents is the value BEFORE the current request's release or clawback is applied; the posture is recomputed from the post-mutation balance afterwards, so a release is capped by the pre-release posture."
    constants:
      RESERVE_MONTHS_BASE: 3
      HHI_ESCALATION_1: 3000
      TOP_SOURCE_ESCALATION: 3500
      HHI_WATCH: 4000
      CONCENTRATION_BOARD_FLOOR_HHI: 4500
      RELEASE_CAP_BPS: { HEALTHY: 10000, WATCH: 6000, CONSTRAINED: 2500, CRITICAL: 0 }
    precision: "reserve_months_ratio_bps is whole basis points, round_half_up; the CONSTRAINED half-target comparison uses round_half_up(target/2) and a strict < (a balance exactly equal to half the target is NOT constrained)"
    variants: []

  - name: restricted_release_waterfall
    trigger: "POST /grant-proposals/{id}/release-restricted-funds; bucket capacities are created by POST /grant-proposals/{id}/record-outcome with outcome == AWARDED"
    algorithm: waterfall_allocation
    formula: |
      # STEP A - bucket capacities, assigned once when the proposal is AWARDED.
      buckets = GrantReport rows of the proposal ordered by due_date ASC,
                tie-break created_at ASC (ids are never compared)
      if report_count == 0:            # cadence NONE - a single implicit bucket
          the whole awarded_amount_cents is releasable subject only to the posture cap
      else:
          base = floor(awarded_amount_cents / report_count)
          allocated_release_cents = base for every bucket EXCEPT the last one;
          the LAST bucket (highest due_date) gets
              base + (awarded_amount_cents - base * report_count)
          # the remainder always lands in the last bucket, never spread

      # STEP B - the posture cap on THIS request (pre-release posture, see
      #          reserve_policy_posture step 6 note):
      max_release_cents = round_half_up(unreleased_cents
                                        * fiscal_period.restricted_release_cap_pct_bps / 10000)
      if request_amount_cents > max_release_cents -> the request is rejected

      # STEP C - fill buckets strictly in due_date ASC order:
      remaining = request_amount_cents
      for bucket in buckets:
          fill = min(remaining, bucket.allocated_release_cents - bucket.consumed_release_cents)
          bucket.consumed_release_cents += fill
          remaining -= fill
          if remaining == 0: stop
      if remaining > 0 -> overflow, the request is rejected in full (no partial release)

      # STEP D - ledger:
      released_cents   += request_amount_cents
      unreleased_cents  = awarded_amount_cents - released_cents - returned_cents
    input_set: "Every GrantReport row of the proposal in any status including WAIVED (a waived report keeps its bucket capacity so the award total stays releasable). Buckets are ordered by due_date ASC with created_at ASC as the only tie-break."
    constants: {}
    precision: "whole cents; base uses floor, the last bucket absorbs the remainder, and the posture cap uses round_half_up"
    variants: []

  - name: collaboration_cost_split
    trigger: "POST /collaborations/{id}/status-actions with action == ACTIVATE, POST /collaborations/{id}/partners, and POST /collaboration-partners/{id}/withdraw"
    algorithm: aggregation
    formula: |
      # Largest-remainder apportionment over the lead plus every CONFIRMED partner.
      # WITHDRAWN partners are excluded from the split entirely.
      participants = [lead (share = lead_cost_share_bps, sort key = collaboration.created_at)]
                     + CONFIRMED CollaborationPartner rows ordered by created_at ASC
      for each participant i:
          exact_i     = total_cost_cents * share_bps_i / 10000     # exact rational, NOT rounded
          floor_i     = floor(exact_i)
          remainder_i = exact_i - floor_i
      leftover = total_cost_cents - sum(floor_i)                    # 0 <= leftover < len(participants)
      rank participants by remainder_i DESC, tie-break created_at ASC
      the first `leftover` ranked participants each receive exactly +1 cent
      cost_owed_cents = floor_i + (1 if ranked within the first `leftover` else 0)   # partners
      lead_cost_cents = the lead participant's resulting value
      remainder_rank  = the participant's 1-based position in that ranking (stored on partners only)
      allocated_cost_cents = lead_cost_cents + sum(cost_owed_cents of CONFIRMED partners)
      # INVARIANT: allocated_cost_cents == total_cost_cents, exactly, always.
    input_set: "The Collaboration row and its CollaborationPartner rows with status == CONFIRMED. WITHDRAWN partners keep their historical cost_owed_cents frozen at the value they held at withdrawal but are excluded from every subsequent split."
    constants: {}
    precision: "whole cents; per-participant values use floor and the leftover cents are distributed one each by fractional remainder DESC. Rounding each share with round_half_up independently is FORBIDDEN because it does not sum to total_cost_cents."
    variants: []

  - name: member_renewal_schedule
    trigger: "The Member PENDING->ACTIVE activation inside POST /contributions/{id}/settlement with outcome == SETTLED, POST /members/{id}/lifecycle-actions with action in {RENEW, REINSTATE}, and POST /members/{id}/tier-change when the new tier's renewal_cadence differs"
    algorithm: chronological
    formula: |
      step_months = 1 if renewal_cadence == MONTHLY else 12
      target = cycle_start_date advanced by step_months calendar months
      # DAY-OF-MONTH CLAMP: if the anchor day does not exist in the target month,
      # clamp to the LAST day of the target month. The clamp never advances into
      # the following month.
      next_renewal_date = clamp_to_month_end(target)
      # The anchor day is ALWAYS the day-of-month of the CURRENT cycle_start_date,
      # which every renewal advances to the previous next_renewal_date. A clamp is
      # therefore sticky - the anchor does NOT recover to the original day:
      #   activation 2026-08-31 -> next 2026-09-30
      #   RENEW (cycle_start becomes 2026-09-30) -> next 2026-10-30, NOT 2026-10-31
      # Adding a fixed 30 or 31 days instead of one calendar month is FORBIDDEN.
      grace_expires_at = next_renewal_date + GRACE_DAYS days, at 00:00:00Z
    input_set: "The single Member row plus the renewal_cadence of MembershipTier referenced by tier_id."
    constants:
      GRACE_DAYS: 30
    precision: "whole calendar days, UTC; all dates are date-only and all instants are 00:00:00Z"
    variants: []

  - name: report_obligation_schedule
    trigger: "POST /grant-proposals/{id}/record-outcome with outcome == AWARDED, when reporting_cadence != NONE"
    algorithm: interval_merge
    formula: |
      window_start = restriction_start_date if restriction_type != UNRESTRICTED else award_date
      window_end   = restriction_end_date  if restriction_type != UNRESTRICTED
                     else fiscal_period.end_date
      interval_months = 6 if reporting_cadence == SEMIANNUAL else 12
      span_months = (year(window_end) - year(window_start)) * 12
                    + (month(window_end) - month(window_start)) + 1
      report_count = ceil(span_months / interval_months)
      for i in 1..report_count:
          period_start = clamp_to_month_end(window_start advanced by (i-1)*interval_months months)
          period_end   = min(window_end,
                             clamp_to_month_end(window_start advanced by i*interval_months months)
                             minus 1 day)
          due_date     = period_end + REPORT_GRACE_DAYS days
          sequence_no  = i
      # Windows are contiguous and non-overlapping by construction: report i's
      # period_start is exactly report i-1's period_end plus one day.
    input_set: "The single GrantProposal row plus the end_date of its FiscalPeriod when restriction_type == UNRESTRICTED."
    constants:
      REPORT_GRACE_DAYS: 45
    precision: "whole calendar days, UTC; ceil on the report count so a partial trailing interval still produces a report"
    variants: []

  - name: member_lifetime_giving
    trigger: "Every Contribution settlement, refund, and the MAJOR_GIFT contribution written by POST /gift-offers/{id}/accept when a Member row has linked_funder_id == the offer's funder_id"
    algorithm: aggregation
    formula: |
      lifetime_giving_cents = sum(Contribution.amount_cents
                                  where member_id == M and settlement_status == SETTLED)
      # REFUNDED and FAILED rows leave the SETTLED set, so a refund decrements the
      # total by exactly the refunded amount with no separate subtraction step.
      consecutive_renewals = the number of RENEW transitions since the most recent
                             LAPSED or CANCELLED entry (0 for a member that has never renewed)
      is_major_donor = (lifetime_giving_cents >= MAJOR_DONOR_THRESHOLD_CENTS)
      # Latching: is_major_donor, once true, stays true even if a refund drops
      # lifetime_giving_cents back below the threshold. cultivation_locked follows
      # is_major_donor and is likewise never cleared by a refund.
      cultivation_locked = is_major_donor
    input_set: "All Contribution rows of the member with settlement_status == SETTLED, in any fiscal period, plus the member's own transition history for consecutive_renewals."
    constants:
      MAJOR_DONOR_THRESHOLD_CENTS: 500000
    precision: "whole cents; the threshold comparison is >= (a member at exactly 500000 cents IS a major donor)"
    variants: []

# ---------------------------------------------------------------------------
# §1.4 Validation Rules Table (evaluated in ascending priority; the FIRST
#      violated rule determines the response and no later rule is evaluated)
# ---------------------------------------------------------------------------
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present and X-User-Role is one of the five roles declared in §1.7"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "The supplied X-User-Role appears in the endpoint's roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Every {id} in the path resolves to an existing row, validated left-to-right; each entity raises its own not-found error"
    error_id: ERR_FISCAL_PERIOD_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with a path parameter; the error_id is the not-found code of the entity whose segment failed (ERR_FISCAL_PERIOD_NOT_FOUND, ERR_MEMBERSHIP_TIER_NOT_FOUND, ERR_MEMBER_NOT_FOUND, ERR_COVERAGE_AREA_NOT_FOUND, ERR_FUNDER_NOT_FOUND, ERR_DISCLOSURE_NOT_FOUND, ERR_INFLUENCE_CONTACT_NOT_FOUND, ERR_GIFT_OFFER_NOT_FOUND, ERR_GRANT_PROPOSAL_NOT_FOUND, ERR_GRANT_REPORT_NOT_FOUND, ERR_CONTRIBUTION_NOT_FOUND, ERR_COLLABORATION_NOT_FOUND, ERR_PARTNER_NOT_FOUND)"

  - priority: 4
    category: existence
    check: "Every foreign key supplied in the request body resolves to an existing row; body FKs are validated in the field order declared on the endpoint's input list, after all path ids"
    error_id: ERR_FUNDER_NOT_FOUND
    http_status: 404
    applies_to: "POST /members, POST /coverage-areas, POST /funders, POST /firewall-disclosures, POST /influence-contacts, POST /gift-offers, POST /grant-proposals, POST /contributions, POST /collaborations, POST /members/{id}/tier-change; the error_id is the not-found code of the missing target entity"

  - priority: 5
    category: auth
    check: "When X-User-Role == Member, X-User-ID must equal the id of the Member row addressed by the request (path {id} for member endpoints, member_id for POST /contributions). A Member may never read or write another member's data."
    error_id: ERR_MEMBER_SCOPE_FORBIDDEN
    http_status: 403
    applies_to: "GET /members/{id}, POST /members/{id}/tier-change, POST /contributions, GET /contributions/{id}"

  - priority: 6
    category: existence
    check: "All required input fields are present, enums hold declared values, integers are integers, and cent amounts are strictly positive where the endpoint requires an amount"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: all

  - priority: 7
    category: existence
    check: "Every basis-point input is an integer in 0..10000 inclusive (credit_share_bps, cost_share_bps, lead_credit_bps, lead_cost_share_bps, award_probability_bps, reporting_reliability_bps) and audited_advocacy_index is an integer in 0..10"
    error_id: ERR_INVALID_BPS_RANGE
    http_status: 422
    applies_to: "POST /fiscal-periods, POST /funders, POST /funders/{id}/independence-clearance, POST /grant-proposals, POST /collaborations, POST /collaborations/{id}/partners"

  - priority: 8
    category: existence
    check: "Every date pair satisfies start < end (FiscalPeriod start_date/end_date, GrantProposal restriction_start_date/restriction_end_date, Collaboration window_start/window_end)"
    error_id: ERR_INVALID_DATE_RANGE
    http_status: 422
    applies_to: "POST /fiscal-periods, POST /grant-proposals, POST /collaborations"

  - priority: 9
    category: existence
    check: "spend_reported_cents on a report submission does not exceed that report's consumed_release_cents - a newsroom cannot report spending money it never received"
    error_id: ERR_SPEND_EXCEEDS_RELEASE
    http_status: 422
    applies_to: "POST /grant-reports/{id}/submit"

  - priority: 10
    category: existence
    check: "On outcome == AWARDED, awarded_amount_cents is present, >= 1 and <= requested_amount_cents, and award_date falls inside the FiscalPeriod's inclusive date range"
    error_id: ERR_AWARD_AMOUNT_INVALID
    http_status: 422
    applies_to: "POST /grant-proposals/{id}/record-outcome"

  - priority: 11
    category: state
    check: "The FiscalPeriod that scopes the write is in status OPEN. A period in REVIEW_LOCKED or CLOSED rejects every financial write bound to it, including contributions, awards, releases, refunds, gift acceptance and collaboration settlement."
    error_id: ERR_PERIOD_LOCKED
    http_status: 409
    applies_to: "POST /contributions, POST /contributions/{id}/settlement, POST /contributions/{id}/refund, POST /gift-offers/{id}/accept, POST /grant-proposals/{id}/record-outcome, POST /grant-proposals/{id}/release-restricted-funds, POST /collaborations/{id}/status-actions"

  - priority: 12
    category: state
    check: "The addressed entity is not in a terminal state (FiscalPeriod CLOSED, Member CANCELLED, GrantProposal CLOSED/WITHDRAWN, GiftOffer ACCEPTED/DECLINED, GrantReport ACCEPTED/WAIVED, Contribution REFUNDED/FAILED, FirewallDisclosure SUPERSEDED/VOID, Collaboration SETTLED/DISSOLVED, CollaborationPartner WITHDRAWN)"
    error_id: ERR_TERMINAL_STATE
    http_status: 409
    applies_to: "every POST that drives a state transition"

  - priority: 13
    category: state
    check: "The requested action is a declared transition out of the entity's current non-terminal state (see §1.2). Includes the source-state guard of every action enum value."
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "POST /fiscal-periods/{id}/status-actions, POST /membership-tiers/{id}/publish, POST /members/{id}/lifecycle-actions, POST /funders/{id}/independence-clearance, POST /firewall-disclosures/{id}/attest, POST /gift-offers/{id}/submit-for-review, POST /gift-offers/{id}/independence-review, POST /gift-offers/{id}/board-ratification, POST /gift-offers/{id}/accept, POST /grant-proposals/{id}/internal-review, POST /grant-proposals/{id}/pipeline-actions, POST /grant-proposals/{id}/record-outcome, POST /grant-proposals/{id}/release-restricted-funds, POST /grant-proposals/{id}/reinstate, POST /grant-proposals/{id}/close, POST /grant-reports/{id}/submit, POST /grant-reports/{id}/review, POST /contributions/{id}/settlement, POST /contributions/{id}/refund, POST /contributions/{id}/acknowledge, POST /collaborations/{id}/status-actions, POST /collaboration-partners/{id}/withdraw"

  - priority: 14
    category: state
    check: "No Contribution of the period is still in settlement_status INITIATED when CLOSE is requested"
    error_id: ERR_UNSETTLED_CONTRIBUTIONS
    http_status: 409
    applies_to: "POST /fiscal-periods/{id}/status-actions with action == CLOSE"

  - priority: 15
    category: state
    check: "A board override is warranted and not already recorded: concentration_hhi >= CONCENTRATION_BOARD_FLOOR_HHI (4500) or sustainability_posture in {CONSTRAINED, CRITICAL}, and board_override_active == false"
    error_id: ERR_BOARD_OVERRIDE_NOT_WARRANTED
    http_status: 409
    applies_to: "POST /fiscal-periods/{id}/board-override"

  - priority: 16
    category: state
    check: "A MembershipTier referenced by a membership write is in status PUBLISHED; a DRAFT tier can neither back a new Member nor be the target of a tier change"
    error_id: ERR_TIER_NOT_PUBLISHED
    http_status: 409
    applies_to: "POST /members, POST /members/{id}/tier-change"

  - priority: 17
    category: state
    check: "The Member is in status ACTIVE or GRACE for a tier change, and in PENDING (the enrolment contribution that drives PENDING->ACTIVE), ACTIVE or GRACE for a MEMBERSHIP contribution. LAPSED and CANCELLED members reject both."
    error_id: ERR_MEMBER_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /members/{id}/tier-change, POST /contributions"

  - priority: 18
    category: state
    check: "The supplied expected_<parent>_version equals the parent's current version (§1.2.1). Evaluated after all state preconditions so a stale version never masks a wrong-state request."
    error_id: ERR_STALE_FUNDER_VERSION
    http_status: 412
    applies_to: "POST /firewall-disclosures (ERR_STALE_FUNDER_VERSION), POST /members/{id}/tier-change (ERR_STALE_MEMBER_VERSION)"

  - priority: 19
    category: auth
    check: "Dual control on X-User-ID: the acting user must differ from the user who performed the paired earlier step. POST /firewall-disclosures requires X-User-ID != funder.cultivated_by_user_id; POST /gift-offers/{id}/accept requires X-User-ID != gift_offer.solicited_by_user_id. Deliberately ranked BELOW the state and OCC checks so a wrong-state or stale-version request reports its own error rather than a duties conflict."
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /firewall-disclosures, POST /gift-offers/{id}/accept"

  - priority: 20
    category: business_safety
    check: "The Funder is not in status RESTRICTED. A restricted funder cannot receive a new gift offer, cannot have a proposal submitted or awarded, and cannot be the source of a new contribution."
    error_id: ERR_FUNDER_RESTRICTED
    http_status: 409
    applies_to: "POST /gift-offers, POST /gift-offers/{id}/submit-for-review, POST /gift-offers/{id}/accept, POST /grant-proposals/{id}/pipeline-actions, POST /grant-proposals/{id}/record-outcome, POST /contributions"

  - priority: 21
    category: business_safety
    check: "The Funder's independence_risk_score is strictly below RISK_HARD_BAR (60). A score at or above 60 bars every solicitation, clearance and acceptance outright and cannot be waived by disclosure."
    error_id: ERR_FUNDER_RISK_TOO_HIGH
    http_status: 409
    applies_to: "POST /funders/{id}/independence-clearance, POST /gift-offers/{id}/independence-review, POST /grant-proposals/{id}/internal-review"

  - priority: 22
    category: business_safety
    check: "When the Funder's independence_risk_score >= RISK_DISCLOSURE_FLOOR (40), an ACTIVE FirewallDisclosure must exist for the exact (funder_id, coverage_area_id) pair being funded. A disclosure for a different coverage area does not satisfy the requirement."
    error_id: ERR_DISCLOSURE_REQUIRED
    http_status: 409
    applies_to: "POST /funders/{id}/independence-clearance, POST /gift-offers/{id}/independence-review, POST /grant-proposals/{id}/internal-review"

  - priority: 23
    category: business_safety
    check: "No FirewallDisclosure covering the (funder_id, coverage_area_id) pair is in status REATTESTATION_REQUIRED; a stale disclosure blocks clearance even when another ACTIVE disclosure also exists for the pair"
    error_id: ERR_DISCLOSURE_STALE
    http_status: 409
    applies_to: "POST /funders/{id}/independence-clearance, POST /gift-offers/{id}/independence-review, POST /grant-proposals/{id}/internal-review"

  - priority: 24
    category: business_safety
    check: "The CoverageArea's publication_gate is OPEN. A BLOCKED gate (set when disclosure_status went STALE via the funder-restriction cascade) suspends new funding activity touching that beat."
    error_id: ERR_PUBLICATION_GATE_BLOCKED
    http_status: 409
    applies_to: "POST /gift-offers/{id}/submit-for-review, POST /grant-proposals/{id}/pipeline-actions, POST /collaborations/{id}/status-actions"

  - priority: 25
    category: business_safety
    check: "The GiftOffer carries no non-empty donor_conditions at independence clearance; conditions attached to a gift must be withdrawn by the donor (via POST /gift-offers/{id}/submit-for-review with donor_conditions omitted) before the gift can clear"
    error_id: ERR_EDITORIAL_CONDITION_PRESENT
    http_status: 409
    applies_to: "POST /gift-offers/{id}/independence-review"

  - priority: 26
    category: business_safety
    check: "Negotiation rounds are bounded: GiftOffer.conditions_round_count < MAX_CONDITION_ROUNDS (2) before another REQUEST_CONDITIONS, and GrantProposal.revision_round_count < MAX_REVISION_ROUNDS (3) before another REQUEST_REVISION"
    error_id: ERR_CONDITION_ROUNDS_EXHAUSTED
    http_status: 409
    applies_to: "POST /gift-offers/{id}/independence-review (ERR_CONDITION_ROUNDS_EXHAUSTED), POST /grant-proposals/{id}/internal-review (ERR_REVISION_ROUNDS_EXHAUSTED)"

  - priority: 27
    category: business_safety
    check: "When board_ratification_required is true, the GiftOffer must already carry a board_ratified_by_user_id before it can be accepted"
    error_id: ERR_BOARD_RATIFICATION_REQUIRED
    http_status: 409
    applies_to: "POST /gift-offers/{id}/accept"

  - priority: 28
    category: business_safety
    check: "A disclosure may only be voided when its (funder_id, coverage_area_id) pair no longer backs an AWARDED GrantProposal"
    error_id: ERR_DISCLOSURE_IN_USE
    http_status: 409
    applies_to: "POST /firewall-disclosures/{id}/attest with void == true"

  - priority: 29
    category: business_referential
    check: "A GrantProposal's funder_type is FOUNDATION or GOVERNMENT; individual and corporate donors cannot be grant sources"
    error_id: ERR_FUNDER_NOT_INSTITUTIONAL
    http_status: 422
    applies_to: "POST /grant-proposals"

  - priority: 30
    category: business_referential
    check: "The contribution's source columns match its revenue_stream: MEMBERSHIP requires member_id and forbids funder_id; MAJOR_GIFT requires funder_id and forbids member_id; SYNDICATION requires collaboration_id; EVENTS forbids gift_offer_id"
    error_id: ERR_STREAM_SOURCE_MISMATCH
    http_status: 422
    applies_to: "POST /contributions"

  - priority: 31
    category: business_referential
    check: "supersedes_disclosure_id, when supplied, points to a FirewallDisclosure in status ACTIVE or REATTESTATION_REQUIRED whose funder_id and coverage_area_id both equal the new disclosure's"
    error_id: ERR_SUPERSEDE_TARGET_INVALID
    http_status: 409
    applies_to: "POST /firewall-disclosures"

  - priority: 32
    category: business_referential
    check: "Reports are submitted in sequence: every GrantReport of the same proposal with a lower sequence_no is in status ACCEPTED or WAIVED"
    error_id: ERR_REPORT_SEQUENCE_VIOLATION
    http_status: 409
    applies_to: "POST /grant-reports/{id}/submit"

  - priority: 33
    category: business_referential
    check: "abs(variance_bps) <= MAX_ACCEPTABLE_VARIANCE_BPS (2000) when a report is accepted; a wider variance must be RETURNED instead"
    error_id: ERR_VARIANCE_UNACCEPTABLE
    http_status: 409
    applies_to: "POST /grant-reports/{id}/review with decision == ACCEPT"

  - priority: 34
    category: business_temporal
    check: "Cooling-off: current_utc must be at least COOLING_OFF_DAYS (30) days after funder.restricted_at before a proposal for that funder may be submitted or awarded. Ranked below ERR_FUNDER_RESTRICTED, so a still-restricted funder inside its cooling-off window reports ERR_FUNDER_RESTRICTED."
    error_id: ERR_FUNDER_COOLING_OFF_VIOLATION
    http_status: 409
    applies_to: "POST /grant-proposals/{id}/pipeline-actions with action == SUBMIT, POST /grant-proposals/{id}/record-outcome"

  - priority: 35
    category: business_temporal
    check: "No other ACTIVE Collaboration on the same coverage_area_id has a half-open window [window_start, window_end) overlapping this one. Adjacency (previous.window_end == this.window_start) is permitted."
    error_id: ERR_COLLABORATION_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /collaborations/{id}/status-actions with action == ACTIVATE"

  - priority: 36
    category: business_temporal
    check: "The collaboration window lies inside its FiscalPeriod: window_start >= period.start_date and window_end <= period.end_date"
    error_id: ERR_WINDOW_OUTSIDE_PERIOD
    http_status: 422
    applies_to: "POST /collaborations"

  - priority: 37
    category: business_temporal
    check: "A GrantReport may not be submitted before its reporting period has elapsed: current_utc date >= period_end"
    error_id: ERR_REPORT_PERIOD_NOT_ELAPSED
    http_status: 409
    applies_to: "POST /grant-reports/{id}/submit"

  - priority: 38
    category: business_temporal
    check: "A collaboration may only settle once its production window has closed: logical clock >= window_end"
    error_id: ERR_COLLABORATION_WINDOW_OPEN
    http_status: 409
    applies_to: "POST /collaborations/{id}/status-actions with action == SETTLE"

  - priority: 39
    category: business_temporal
    check: "The logical clock never moves backwards: the supplied current_utc is greater than or equal to the clock's present value (default 2026-08-01T00:00:00Z)"
    error_id: ERR_CLOCK_REWIND
    http_status: 422
    applies_to: "POST /_clock/set_current_utc"

  - priority: 40
    category: business_constraint
    check: "Credit shares close at exactly 10000 bps: lead_credit_bps + sum(credit_share_bps of CONFIRMED partners) == 10000"
    error_id: ERR_CREDIT_SHARE_SUM_INVALID
    http_status: 409
    applies_to: "POST /collaborations/{id}/status-actions with action == ACTIVATE"

  - priority: 41
    category: business_constraint
    check: "Cost shares close at exactly 10000 bps: lead_cost_share_bps + sum(cost_share_bps of CONFIRMED partners) == 10000"
    error_id: ERR_COST_SHARE_SUM_INVALID
    http_status: 409
    applies_to: "POST /collaborations/{id}/status-actions with action == ACTIVATE"

  - priority: 42
    category: business_constraint
    check: "Aggregate cap: a CoverageArea carries at most MAX_RESTRICTED_GRANTS_PER_AREA (2) proposals with restriction_type != UNRESTRICTED in status AWARDED or SUSPENDED. Each proposal is individually valid; only the collective count violates."
    error_id: ERR_RESTRICTED_GRANT_CAP_EXCEEDED
    http_status: 409
    applies_to: "POST /grant-proposals/{id}/record-outcome with outcome == AWARDED"

  - priority: 43
    category: business_constraint
    check: "benefit_code values within a tier's benefits array are unique"
    error_id: ERR_BENEFIT_CODE_DUPLICATE
    http_status: 422
    applies_to: "POST /membership-tiers"

  - priority: 44
    category: business_constraint
    check: "partner_org_name is unique among the CONFIRMED partners of a collaboration"
    error_id: ERR_PARTNER_DUPLICATE
    http_status: 409
    applies_to: "POST /collaborations/{id}/partners"

  - priority: 45
    category: business_constraint
    check: "An ACTIVE collaboration retains at least one CONFIRMED partner; the last remaining partner cannot withdraw (the collaboration must be dissolved instead)"
    error_id: ERR_LAST_PARTNER_WITHDRAWAL
    http_status: 409
    applies_to: "POST /collaboration-partners/{id}/withdraw"

  - priority: 46
    category: business_constraint
    check: "A collaboration cannot activate with partner_count == 0"
    error_id: ERR_NO_CONFIRMED_PARTNER
    http_status: 409
    applies_to: "POST /collaborations/{id}/status-actions with action == ACTIVATE"

  - priority: 47
    category: business_constraint
    check: "A tier may only publish when quid_pro_quo_per_period_cents < contribution_amount_cents; a benefit bundle worth the whole contribution leaves nothing deductible"
    error_id: ERR_BENEFIT_VALUE_EXCEEDS_CONTRIBUTION
    http_status: 409
    applies_to: "POST /membership-tiers/{id}/publish"

  - priority: 48
    category: business_fiscal
    check: "A MEMBERSHIP contribution's amount_cents is at least the member's tier contribution_amount_cents"
    error_id: ERR_CONTRIBUTION_BELOW_TIER_MINIMUM
    http_status: 422
    applies_to: "POST /contributions"

  - priority: 49
    category: business_fiscal
    check: "The FiscalPeriod's restricted_release_cap_pct_bps is greater than 0 (posture is not CRITICAL). Evaluated before the cap-amount check because a CRITICAL posture blocks releases of any size."
    error_id: ERR_POSTURE_BLOCKS_RELEASE
    http_status: 409
    applies_to: "POST /grant-proposals/{id}/release-restricted-funds"

  - priority: 50
    category: business_fiscal
    check: "request_amount_cents <= round_half_up(unreleased_cents * restricted_release_cap_pct_bps / 10000), using the posture computed from the pre-release reserve balance. Cascading check: consumes the output of reserve_policy_posture, which itself consumes revenue_diversification_index. The check is SKIPPED when restricted_release_cap_pct_bps == 10000 (posture HEALTHY), because the cap then equals the whole unreleased principal and adds nothing; an over-large request under a HEALTHY posture is reported by the waterfall-capacity check at priority 51 instead."
    error_id: ERR_RELEASE_CAP_EXCEEDED
    http_status: 409
    applies_to: "POST /grant-proposals/{id}/release-restricted-funds"

  - priority: 51
    category: business_fiscal
    check: "The waterfall can absorb the request: request_amount_cents <= sum over buckets of (allocated_release_cents - consumed_release_cents), where a proposal with report_count == 0 has one implicit bucket of awarded_amount_cents. Overflow rejects the whole request; no partial release is ever written. This is the binding overflow guard under a HEALTHY posture, where priority 50 is skipped."
    error_id: ERR_RELEASE_EXCEEDS_AWARD
    http_status: 409
    applies_to: "POST /grant-proposals/{id}/release-restricted-funds"

  - priority: 52
    category: business_fiscal
    check: "compliance_flag == COMPLIANT: no report of the proposal is OVERDUE. A delinquent grant can neither release funds nor be reinstated."
    error_id: ERR_PROPOSAL_DELINQUENT
    http_status: 409
    applies_to: "POST /grant-proposals/{id}/release-restricted-funds, POST /grant-proposals/{id}/reinstate"

  - priority: 53
    category: business_fiscal
    check: "A refund is only permitted while the contribution's acknowledgment_status is UNACKNOWLEDGED or RECEIPTED; a DISCLOSED contribution has entered public transparency reporting and is frozen"
    error_id: ERR_REFUND_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /contributions/{id}/refund"

  - priority: 54
    category: business_fiscal
    check: "A FiscalPeriod cannot close while reserve_months_ratio_bps < 10000 (less than one month of operating reserve) unless board_override_active is true. Ranked after the state check, so closing a period that is still OPEN reports ERR_INVALID_STATE rather than the reserve breach."
    error_id: ERR_RESERVE_FLOOR_BREACH
    http_status: 409
    applies_to: "POST /fiscal-periods/{id}/status-actions"

  - priority: 55
    category: business_fiscal
    check: "A FiscalPeriod cannot be locked for review while concentration_hhi >= CONCENTRATION_BOARD_FLOOR_HHI (4500) unless board_override_active is true"
    error_id: ERR_CONCENTRATION_BOARD_REVIEW_REQUIRED
    http_status: 409
    applies_to: "POST /fiscal-periods/{id}/status-actions"

# ---------------------------------------------------------------------------
# §1.5 API Endpoint Table
# ---------------------------------------------------------------------------
endpoints:
  # ---- FiscalPeriod -------------------------------------------------------
  - method: POST
    path: "/fiscal-periods"
    description: "Open a fiscal period, the accounting container every money movement is bound to."
    roles: [FinanceController]
    code: 201
    input: [label, start_date, end_date, monthly_expense_base_cents, "reserve_balance_cents?"]
    output: FiscalPeriod
    side_effects:
      - "status = OPEN, board_override_active = false"
      - "runs calculations.revenue_diversification_index (recognized) over an empty input set: recognized_revenue_cents = 0, concentration_hhi = 0, top_source_share_bps = 0"
      - "runs calculations.reserve_policy_posture: reserve_months_target = 3, operating_reserve_target_cents = monthly_expense_base_cents * 3"

  - method: GET
    path: "/fiscal-periods/{id}"
    description: "Read one fiscal period including all persisted sustainability fields."
    roles: [FinanceController, BoardOversight, EditorialDirector, DevelopmentOfficer]
    code: 200
    input: []
    output: FiscalPeriod
    side_effects: []

  - method: GET
    path: "/fiscal-periods"
    description: "List fiscal periods, newest start_date first."
    roles: [FinanceController, BoardOversight, EditorialDirector, DevelopmentOfficer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: FiscalPeriod[]
    side_effects: []

  - method: POST
    path: "/fiscal-periods/{id}/status-actions"
    description: "Drive the period state machine: LOCK (OPEN->REVIEW_LOCKED), UNLOCK (REVIEW_LOCKED->OPEN), CLOSE (REVIEW_LOCKED->CLOSED)."
    roles: [FinanceController]
    code: 200
    input: [action]
    output: FiscalPeriod
    side_effects:
      - "LOCK: recomputes revenue_diversification_index (recognized) and reserve_policy_posture, then sets locked_at; rejected with ERR_CONCENTRATION_BOARD_REVIEW_REQUIRED when concentration_hhi >= 4500 and board_override_active is false"
      - "CLOSE: rejected with ERR_RESERVE_FLOOR_BREACH when reserve_months_ratio_bps < 10000 and board_override_active is false; freezes every field of the period"
      - "UNLOCK: clears locked_at to null and increments FiscalPeriod.version by 1"

  - method: POST
    path: "/fiscal-periods/{id}/board-override"
    description: "Board oversight records a documented override that waives the reserve-floor and concentration gates for this period."
    roles: [BoardOversight]
    code: 200
    input: [justification]
    output: FiscalPeriod
    side_effects:
      - "sets board_override_active = true and board_override_justification = justification (self-loop on the current status)"

  - method: GET
    path: "/fiscal-periods/{id}/sustainability"
    description: "Computed read of the diversification and reserve metrics on either basis. basis omitted or RECOGNIZED replays the persisted values; basis=PIPELINE returns the probability-weighted projection without persisting anything."
    roles: [FinanceController, BoardOversight, EditorialDirector]
    code: 200
    input: ["basis?"]
    output: "{ basis: string, recognized_revenue_cents: integer, membership_share_bps: integer, major_gift_share_bps: integer, grants_share_bps: integer, events_share_bps: integer, syndication_share_bps: integer, concentration_hhi: integer, top_source_share_bps: integer, reserve_months_target: integer, operating_reserve_target_cents: integer, reserve_months_ratio_bps: integer, sustainability_posture: string, restricted_release_cap_pct_bps: integer }"
    side_effects: []

  # ---- MembershipTier -----------------------------------------------------
  - method: POST
    path: "/membership-tiers"
    description: "Define a recurring-giving tier with its benefit bundle; the quid-pro-quo split is frozen at creation."
    roles: [DevelopmentOfficer]
    code: 201
    input: [tier_code, name, renewal_cadence, contribution_amount_cents, benefits, "grace_period_days?"]
    output: MembershipTier
    side_effects:
      - "runs calculations.tier_quid_pro_quo_value, writing insubstantial_threshold_cents, insubstantial_benefit_codes, quid_pro_quo_per_period_cents and benefit_count"
      - "status = DRAFT"

  - method: GET
    path: "/membership-tiers/{id}"
    description: "Read one membership tier with its computed benefit valuation."
    roles: [DevelopmentOfficer, FinanceController, BoardOversight, Member]
    code: 200
    input: []
    output: MembershipTier
    side_effects: []

  - method: GET
    path: "/membership-tiers"
    description: "List membership tiers, ordered created_at ASC."
    roles: [DevelopmentOfficer, FinanceController, BoardOversight, Member]
    code: 200
    input: ["status?", "renewal_cadence?", "limit?", "offset?"]
    output: MembershipTier[]
    side_effects: []

  - method: POST
    path: "/membership-tiers/{id}/publish"
    description: "Publish a DRAFT tier so members may be enrolled on it."
    roles: [DevelopmentOfficer]
    code: 200
    input: []
    output: MembershipTier
    side_effects:
      - "status DRAFT -> PUBLISHED, sets published_at to the logical clock"

  # ---- Member -------------------------------------------------------------
  - method: POST
    path: "/members"
    description: "Enrol a member against a PUBLISHED tier. The member starts PENDING; the first ACTIVATE sets the renewal cycle."
    roles: [DevelopmentOfficer]
    code: 201
    input: [tier_id, email, full_name, "employer?", "linked_funder_id?"]
    output: Member
    side_effects:
      - "status = PENDING, lifetime_giving_cents = 0, is_major_donor = false"

  - method: GET
    path: "/members/{id}"
    description: "Read one member. A Member-role caller may only read their own row."
    roles: [DevelopmentOfficer, FinanceController, Member]
    code: 200
    input: []
    output: Member
    side_effects: []

  - method: GET
    path: "/members"
    description: "List members with FK and status filters; ordered created_at ASC."
    roles: [DevelopmentOfficer, FinanceController]
    code: 200
    input: ["tier_id?", "linked_funder_id?", "status?", "is_major_donor?", "limit?", "offset?"]
    output: Member[]
    side_effects: []

  - method: POST
    path: "/members/{id}/lifecycle-actions"
    description: "Drive the membership state machine: RENEW (ACTIVE->ACTIVE or GRACE->ACTIVE), REINSTATE (LAPSED->ACTIVE), CANCEL (ACTIVE/GRACE/LAPSED->CANCELLED). PENDING->ACTIVE is not an action - it happens when the member's first MEMBERSHIP contribution settles; ACTIVE->GRACE and GRACE->LAPSED are driven by POST /ops/daily-sweep."
    roles: [DevelopmentOfficer, Member]
    code: 200
    input: [action]
    output: Member
    side_effects:
      - "RENEW: advances cycle_start_date to the former next_renewal_date, re-runs calculations.member_renewal_schedule, clears grace_expires_at and increments consecutive_renewals by 1"
      - "REINSTATE: sets cycle_start_date to the logical clock date, re-runs member_renewal_schedule and keeps consecutive_renewals at 0"
      - "CANCEL: clears next_renewal_date and grace_expires_at to null"
      - "increments Member.version by 1"

  - method: POST
    path: "/members/{id}/tier-change"
    description: "Move an ACTIVE or GRACE member to another PUBLISHED tier under optimistic concurrency on the member row (§1.2.1 rule tier-change-stale-member)."
    roles: [DevelopmentOfficer, Member]
    code: 200
    input: [new_tier_id, expected_member_version]
    output: Member
    side_effects:
      - "increments Member.version by 1"
      - "re-runs calculations.member_renewal_schedule when the new tier's renewal_cadence differs"
      - "re-runs calculations.contribution_deductible_split for every Contribution of this member whose acknowledgment_status is still UNACKNOWLEDGED"

  # ---- CoverageArea -------------------------------------------------------
  - method: POST
    path: "/coverage-areas"
    description: "Register an editorial beat that funders may be disclosed against."
    roles: [EditorialDirector]
    code: 201
    input: [area_code, name, editorial_lead_user_id]
    output: CoverageArea
    side_effects:
      - "disclosure_status = CURRENT, publication_gate = OPEN, restricted_grant_count = 0, disclosed_funder_count = 0"

  - method: GET
    path: "/coverage-areas/{id}"
    description: "Read one coverage area with its firewall and publication-gate state."
    roles: [EditorialDirector, DevelopmentOfficer, FinanceController, BoardOversight, Member]
    code: 200
    input: []
    output: CoverageArea
    side_effects: []

  - method: GET
    path: "/coverage-areas"
    description: "List coverage areas, ordered created_at ASC."
    roles: [EditorialDirector, DevelopmentOfficer, FinanceController, BoardOversight, Member]
    code: 200
    input: ["publication_gate?", "disclosure_status?", "limit?", "offset?"]
    output: CoverageArea[]
    side_effects: []

  - method: GET
    path: "/coverage-areas/{id}/transparency-report"
    description: "Public transparency read: which funders are disclosed against this beat, at what committed amounts, and whether the beat's gate is open."
    roles: [EditorialDirector, DevelopmentOfficer, FinanceController, BoardOversight, Member]
    code: 200
    input: ["limit?", "offset?"]
    output: "{ area_code: string, publication_gate: string, disclosure_status: string, disclosed_funder_count: integer, restricted_grant_count: integer, disclosed_funder_ids: array, total_committed_cents: integer }"
    side_effects: []

  # ---- Funder -------------------------------------------------------------
  - method: POST
    path: "/funders"
    description: "Register a prospective funder and score its independence risk on the self-attested basis."
    roles: [DevelopmentOfficer]
    code: 201
    input: [legal_name, funder_type, "affiliated_coverage_area_id?", "self_attested_advocacy?"]
    output: Funder
    side_effects:
      - "status = PROSPECT, risk_basis = SELF_ATTESTED, reporting_reliability_bps = 10000"
      - "sets cultivated_by_user_id to the caller's X-User-ID"
      - "runs calculations.funder_independence_risk (self_attested variant) to write independence_risk_score"

  - method: GET
    path: "/funders/{id}"
    description: "Read one funder with its current independence risk score and clearance state."
    roles: [DevelopmentOfficer, EditorialDirector, FinanceController, BoardOversight]
    code: 200
    input: []
    output: Funder
    side_effects: []

  - method: GET
    path: "/funders"
    description: "List funders with FK and status filters; ordered created_at ASC."
    roles: [DevelopmentOfficer, EditorialDirector, FinanceController, BoardOversight]
    code: 200
    input: ["affiliated_coverage_area_id?", "status?", "funder_type?", "risk_basis?", "limit?", "offset?"]
    output: Funder[]
    side_effects: []

  - method: POST
    path: "/funders/{id}/independence-clearance"
    description: "Editorial rules on a funder: decision == CLEAR moves PROSPECT->CLEARED or RESTRICTED->CLEARED; decision == RESTRICT moves PROSPECT/CLEARED->RESTRICTED and runs the depth-5 firewall cascade. Either decision may switch the risk basis to AUDITED, which re-scores the funder from the audited advocacy index. The caller may not be the funder's cultivator."
    roles: [EditorialDirector]
    code: 200
    input: [decision, basis, "audited_advocacy_index?", "reason?"]
    output: Funder
    side_effects:
      - "sets risk_basis = basis and, when basis == AUDITED, stores audited_advocacy_index, then re-runs calculations.funder_independence_risk on that variant"
      - "CLEAR: rejected with ERR_FUNDER_RISK_TOO_HIGH when the recomputed score is >= 60; sets cleared_by_user_id to the caller's X-User-ID and leaves restricted_at untouched so the cooling-off window keeps running"
      - "RESTRICT: sets restricted_at to the logical clock and executes cascade hops 2-5 of §1.2 Funder (disclosures -> REATTESTATION_REQUIRED, coverage areas -> STALE/BLOCKED, awarded proposals -> SUSPENDED with clawback, fiscal-period sustainability and restricted_grant_count recomputed)"
      - "increments Funder.version by 1"

  # ---- FirewallDisclosure -------------------------------------------------
  - method: POST
    path: "/firewall-disclosures"
    description: "File an editorial-independence firewall disclosure for a (funder, coverage area) pair, optionally superseding an earlier one. Optimistic concurrency on the funder row (§1.2.1 rule disclosure-create-stale-funder); dual control requires a different attester than the funder's clearer."
    roles: [EditorialDirector]
    code: 201
    input: [funder_id, coverage_area_id, disclosure_text, expected_funder_version, "supersedes_disclosure_id?"]
    output: FirewallDisclosure
    side_effects:
      - "status = ACTIVE, attested_by_user_id = caller's X-User-ID, attested_at = logical clock"
      - "increments Funder.version by 1"
      - "the superseded disclosure moves to SUPERSEDED"
      - "recomputes CoverageArea.disclosed_funder_count and, when no REATTESTATION_REQUIRED disclosure remains for the area, sets disclosure_status = CURRENT and publication_gate = OPEN"

  - method: GET
    path: "/firewall-disclosures/{id}"
    description: "Read one firewall disclosure including its supersede chain pointer."
    roles: [EditorialDirector, DevelopmentOfficer, BoardOversight, FinanceController]
    code: 200
    input: []
    output: FirewallDisclosure
    side_effects: []

  - method: GET
    path: "/firewall-disclosures"
    description: "List firewall disclosures with FK filters, including the self-referential supersede filter; ordered created_at ASC."
    roles: [EditorialDirector, DevelopmentOfficer, BoardOversight, FinanceController]
    code: 200
    input: ["funder_id?", "coverage_area_id?", "supersedes_disclosure_id?", "status?", "limit?", "offset?"]
    output: FirewallDisclosure[]
    side_effects: []

  - method: POST
    path: "/firewall-disclosures/{id}/attest"
    description: "Re-attest a stale disclosure (REATTESTATION_REQUIRED->ACTIVE) or, with void == true, retire it (ACTIVE/REATTESTATION_REQUIRED->VOID). ACTIVE->REATTESTATION_REQUIRED is never requested directly; it is only ever produced by the funder-restriction cascade."
    roles: [EditorialDirector]
    code: 200
    input: ["void?"]
    output: FirewallDisclosure
    side_effects:
      - "re-attestation clears reattestation_reason, refreshes attested_by_user_id and attested_at, and returns the CoverageArea to disclosure_status = CURRENT / publication_gate = OPEN once no disclosure of that area is REATTESTATION_REQUIRED"
      - "void == true sets status = VOID and recomputes the CoverageArea's disclosed_funder_count, disclosure_status and publication_gate"
      - "increments FirewallDisclosure.version by 1"

  # ---- InfluenceContact ---------------------------------------------------
  - method: POST
    path: "/influence-contacts"
    description: "Log a donor contact under the influence-prevention policy. An immutable append-only record; an EDITORIAL_DIRECTION_REQUEST restricts the funder outright."
    roles: [DevelopmentOfficer, EditorialDirector]
    code: 201
    input: [funder_id, contact_type, occurred_at, summary, "coverage_area_id?"]
    output: InfluenceContact
    side_effects:
      - "sets severity_weight from contact_type and logged_by_user_id from the caller's X-User-ID"
      - "recomputes Funder.prior_editorial_requests_count and re-runs calculations.funder_independence_risk on the funder's current risk_basis"
      - "sets triggered_restriction = true and drives Funder -> RESTRICTED (cascade hops 1-5) when contact_type == EDITORIAL_DIRECTION_REQUEST or the recomputed score >= 60"

  - method: GET
    path: "/influence-contacts/{id}"
    description: "Read one logged influence contact."
    roles: [EditorialDirector, DevelopmentOfficer, BoardOversight]
    code: 200
    input: []
    output: InfluenceContact
    side_effects: []

  - method: GET
    path: "/influence-contacts"
    description: "List influence contacts with FK filters; ordered occurred_at ASC, created_at ASC."
    roles: [EditorialDirector, DevelopmentOfficer, BoardOversight]
    code: 200
    input: ["funder_id?", "coverage_area_id?", "contact_type?", "limit?", "offset?"]
    output: InfluenceContact[]
    side_effects: []

  # ---- GiftOffer ----------------------------------------------------------
  - method: POST
    path: "/gift-offers"
    description: "Record a major-gift offer from a funder against a fiscal period, optionally designated to a beat."
    roles: [DevelopmentOfficer]
    code: 201
    input: [funder_id, fiscal_period_id, offered_amount_cents, designation, "coverage_area_id?", "donor_conditions?"]
    output: GiftOffer
    side_effects:
      - "status = PROPOSED, solicited_by_user_id = caller's X-User-ID, conditions_round_count = 0"

  - method: GET
    path: "/gift-offers/{id}"
    description: "Read one gift offer with its stewardship netting and ratification flags."
    roles: [DevelopmentOfficer, EditorialDirector, FinanceController, BoardOversight]
    code: 200
    input: []
    output: GiftOffer
    side_effects: []

  - method: GET
    path: "/gift-offers"
    description: "List gift offers with FK and status filters; ordered created_at ASC."
    roles: [DevelopmentOfficer, EditorialDirector, FinanceController, BoardOversight]
    code: 200
    input: ["funder_id?", "coverage_area_id?", "fiscal_period_id?", "status?", "limit?", "offset?"]
    output: GiftOffer[]
    side_effects: []

  - method: POST
    path: "/gift-offers/{id}/submit-for-review"
    description: "Send a PROPOSED offer into independence review, or re-submit one whose conditions were renegotiated (CONDITIONS_REQUESTED -> INDEPENDENCE_REVIEW). Supplying donor_conditions replaces the stored conditions; omitting it clears them."
    roles: [DevelopmentOfficer]
    code: 200
    input: ["donor_conditions?"]
    output: GiftOffer
    side_effects:
      - "runs calculations.gift_stewardship_netting, writing stewardship_fee_cents, net_acceptable_amount_cents and board_ratification_required from the GROSS offered_amount_cents"
      - "increments GiftOffer.version by 1"

  - method: POST
    path: "/gift-offers/{id}/independence-review"
    description: "Editorial rules on an offer under review: CLEAR, REQUEST_CONDITIONS (bounded by MAX_CONDITION_ROUNDS) or DECLINE. The reviewer may not be the soliciting officer."
    roles: [EditorialDirector]
    code: 200
    input: [decision, "review_note?"]
    output: GiftOffer
    side_effects:
      - "CLEAR: snapshots funder.independence_risk_score into acceptance_gate_score and sets cleared_by_user_id"
      - "REQUEST_CONDITIONS: increments conditions_round_count by 1 and stores review_note in donor_conditions"
      - "DECLINE: terminal, no contribution is ever created"
      - "increments GiftOffer.version by 1"

  - method: POST
    path: "/gift-offers/{id}/board-ratification"
    description: "Board ratifies a CLEARED offer that crossed the ratification threshold; a self-loop on CLEARED. The ratifier may be neither the solicitor nor the clearer."
    roles: [BoardOversight]
    code: 200
    input: ["ratification_note?"]
    output: GiftOffer
    side_effects:
      - "sets board_ratified_by_user_id to the caller's X-User-ID"
      - "increments GiftOffer.version by 1"

  - method: POST
    path: "/gift-offers/{id}/accept"
    description: "Accept a CLEARED (and, when required, ratified) offer. Creates the MAJOR_GIFT contribution at the NET amount. Dual control: the accepting officer may not be the soliciting officer."
    roles: [DevelopmentOfficer]
    code: 200
    input: [received_date]
    output: GiftOffer
    side_effects:
      - "creates a Contribution with revenue_stream = MAJOR_GIFT, funder_id, gift_offer_id, amount_cents = net_acceptable_amount_cents, settlement_status = INITIATED, acknowledgment_status = UNACKNOWLEDGED, discoverable only via GET /contributions?gift_offer_id=..."
      - "recomputes funder.lifetime_committed_cents"
      - "increments GiftOffer.version by 1"

  # ---- GrantProposal ------------------------------------------------------
  - method: POST
    path: "/grant-proposals"
    description: "Draft a foundation or government grant proposal, with its restricted scope, reporting cadence and award probability."
    roles: [DevelopmentOfficer]
    code: 201
    input: [funder_id, fiscal_period_id, title, requested_amount_cents, restriction_type, "coverage_area_id?", "restriction_start_date?", "restriction_end_date?", "reporting_cadence?", "award_probability_bps?"]
    output: GrantProposal
    side_effects:
      - "status = DRAFT, drafted_by_user_id = caller's X-User-ID, revision_round_count = 0, awarded_amount_cents = 0"

  - method: GET
    path: "/grant-proposals/{id}"
    description: "Read one grant proposal with its award ledger (awarded / released / unreleased / returned)."
    roles: [DevelopmentOfficer, EditorialDirector, FinanceController, BoardOversight]
    code: 200
    input: []
    output: GrantProposal
    side_effects: []

  - method: GET
    path: "/grant-proposals"
    description: "List grant proposals with FK and status filters; ordered created_at ASC."
    roles: [DevelopmentOfficer, EditorialDirector, FinanceController, BoardOversight]
    code: 200
    input: ["funder_id?", "coverage_area_id?", "fiscal_period_id?", "status?", "compliance_flag?", "limit?", "offset?"]
    output: GrantProposal[]
    side_effects: []

  - method: POST
    path: "/grant-proposals/{id}/pipeline-actions"
    description: "Development-side pipeline moves: SUBMIT_FOR_REVIEW (DRAFT or REVISION_REQUESTED -> INDEPENDENCE_REVIEW), REVISE (REVISION_REQUESTED -> DRAFT), SUBMIT (CLEARED -> SUBMITTED), WITHDRAW (any pre-award state -> WITHDRAWN)."
    roles: [DevelopmentOfficer]
    code: 200
    input: [action]
    output: GrantProposal
    side_effects:
      - "SUBMIT: the proposal starts counting toward the PIPELINE revenue variant at award_probability_bps weight; subject to the funder cooling-off rule"
      - "WITHDRAW: drops the proposal from the PIPELINE variant and recomputes FiscalPeriod sustainability fields"
      - "increments GrantProposal.version by 1"

  - method: POST
    path: "/grant-proposals/{id}/internal-review"
    description: "Editorial independence review of a proposal: CLEAR or REQUEST_REVISION (bounded by MAX_REVISION_ROUNDS). The reviewer may not be the drafting officer."
    roles: [EditorialDirector]
    code: 200
    input: [decision, "review_note?"]
    output: GrantProposal
    side_effects:
      - "CLEAR: sets cleared_by_user_id to the caller's X-User-ID"
      - "REQUEST_REVISION: increments revision_round_count by 1"
      - "increments GrantProposal.version by 1"

  - method: POST
    path: "/grant-proposals/{id}/record-outcome"
    description: "Record the funder's decision on a SUBMITTED proposal: AWARDED (with the awarded amount and award date) or DECLINED."
    roles: [DevelopmentOfficer]
    code: 200
    input: [outcome, "awarded_amount_cents?", "award_date?"]
    output: GrantProposal
    side_effects:
      - "AWARDED: sets awarded_amount_cents, unreleased_cents = awarded_amount_cents, released_cents = 0, returned_cents = 0 and award_date"
      - "AWARDED: generates GrantReport rows via calculations.report_obligation_schedule (0 rows when reporting_cadence == NONE), sets report_count, and allocates allocated_release_cents across them via calculations.restricted_release_waterfall"
      - "AWARDED: recomputes funder.lifetime_committed_cents and CoverageArea.restricted_grant_count"
      - "recomputes every FiscalPeriod sustainability field on the RECOGNIZED basis"
      - "increments GrantProposal.version by 1"

  - method: POST
    path: "/grant-proposals/{id}/release-restricted-funds"
    description: "Finance releases restricted principal against the report buckets. A self-loop on AWARDED, capped by the fiscal period's posture-derived release cap."
    roles: [FinanceController]
    code: 200
    input: [request_amount_cents]
    output: GrantProposal
    side_effects:
      - "moves request_amount_cents from unreleased_cents to released_cents, preserving awarded_amount_cents == released_cents + unreleased_cents + returned_cents"
      - "fills report buckets in due_date ASC order via calculations.restricted_release_waterfall, raising consumed_release_cents per bucket"
      - "credits FiscalPeriod.reserve_balance_cents by request_amount_cents and re-runs calculations.reserve_policy_posture"
      - "increments GrantProposal.version by 1"

  - method: POST
    path: "/grant-proposals/{id}/reinstate"
    description: "Finance reinstates a SUSPENDED award once the firewall breach or report delinquency is cured; the compensating action for the suspension clawback."
    roles: [FinanceController]
    code: 200
    input: []
    output: GrantProposal
    side_effects:
      - "unreleased_cents += returned_cents, returned_cents = 0, keeping awarded_amount_cents == released_cents + unreleased_cents + returned_cents"
      - "resets every report's consumed_release_cents to 0 and re-runs calculations.restricted_release_waterfall"
      - "clears suspended_reason and recomputes CoverageArea.restricted_grant_count and FiscalPeriod sustainability fields"
      - "increments GrantProposal.version by 1"

  - method: POST
    path: "/grant-proposals/{id}/close"
    description: "Close out an AWARDED grant: still-SCHEDULED reports are waived and any unreleased principal is returned."
    roles: [FinanceController]
    code: 200
    input: ["closure_justification?"]
    output: GrantProposal
    side_effects:
      - "every GrantReport with status == SCHEDULED moves to WAIVED"
      - "returned_cents += unreleased_cents, unreleased_cents = 0"
      - "recomputes FiscalPeriod sustainability fields and CoverageArea.restricted_grant_count"
      - "increments GrantProposal.version by 1"

  - method: GET
    path: "/grant-proposals/{id}/reports"
    description: "Sub-resource read of a proposal's reporting obligations, ordered due_date ASC then created_at ASC - the discovery channel for the report rows the award cascade created."
    roles: [DevelopmentOfficer, FinanceController, EditorialDirector, BoardOversight]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: GrantReport[]
    side_effects: []

  # ---- GrantReport --------------------------------------------------------
  - method: GET
    path: "/grant-reports/{id}"
    description: "Read one reporting obligation with its release bucket and variance."
    roles: [DevelopmentOfficer, FinanceController, EditorialDirector, BoardOversight]
    code: 200
    input: []
    output: GrantReport
    side_effects: []

  - method: GET
    path: "/grant-reports"
    description: "List reporting obligations with FK and status filters; ordered due_date ASC then created_at ASC."
    roles: [DevelopmentOfficer, FinanceController, EditorialDirector, BoardOversight]
    code: 200
    input: ["grant_proposal_id?", "status?", "limit?", "offset?"]
    output: GrantReport[]
    side_effects: []

  - method: POST
    path: "/grant-reports/{id}/submit"
    description: "Submit a report from SCHEDULED, OVERDUE or RETURNED, declaring the spend for the period."
    roles: [DevelopmentOfficer]
    code: 200
    input: [spend_reported_cents]
    output: GrantReport
    side_effects:
      - "sets submitted_at to the logical clock and computes variance_bps against consumed_release_cents"
      - "increments GrantReport.version by 1"

  - method: POST
    path: "/grant-reports/{id}/review"
    description: "Finance reviews a SUBMITTED report: ACCEPT (variance within tolerance) or RETURN for rework."
    roles: [FinanceController]
    code: 200
    input: [decision, "review_note?"]
    output: GrantReport
    side_effects:
      - "ACCEPT: recomputes grant_proposal.compliance_flag"
      - "RETURN: clears spend_reported_cents and variance_bps back to null"
      - "increments GrantReport.version by 1"

  # ---- Contribution -------------------------------------------------------
  - method: POST
    path: "/contributions"
    description: "Record incoming revenue on one of the four streams. MEMBERSHIP requires member_id, MAJOR_GIFT requires funder_id, SYNDICATION requires collaboration_id; the deductible split is computed at creation."
    roles: [DevelopmentOfficer, Member]
    code: 201
    input: [fiscal_period_id, revenue_stream, amount_cents, received_date, "member_id?", "funder_id?", "gift_offer_id?", "collaboration_id?", "source_label?"]
    output: Contribution
    side_effects:
      - "settlement_status = INITIATED, acknowledgment_status = UNACKNOWLEDGED"
      - "runs calculations.contribution_deductible_split, writing quid_pro_quo_cents and deductible_cents"

  - method: GET
    path: "/contributions/{id}"
    description: "Read one contribution with its settlement and acknowledgment dimensions. A Member-role caller may only read their own."
    roles: [DevelopmentOfficer, FinanceController, BoardOversight, Member]
    code: 200
    input: []
    output: Contribution
    side_effects: []

  - method: GET
    path: "/contributions"
    description: "List contributions with every FK filter plus stream and status filters; ordered received_date ASC then created_at ASC. The only discovery channel for contributions created by gift acceptance."
    roles: [DevelopmentOfficer, FinanceController, BoardOversight]
    code: 200
    input: ["fiscal_period_id?", "member_id?", "funder_id?", "gift_offer_id?", "collaboration_id?", "revenue_stream?", "settlement_status?", "acknowledgment_status?", "limit?", "offset?"]
    output: Contribution[]
    side_effects: []

  - method: POST
    path: "/contributions/{id}/settlement"
    description: "Finance settles or fails an INITIATED contribution (the settlement_status dimension). A settled MEMBERSHIP contribution activates a PENDING member."
    roles: [FinanceController]
    code: 200
    input: [outcome]
    output: Contribution
    side_effects:
      - "SETTLED + MEMBERSHIP: recomputes member.lifetime_giving_cents, is_major_donor and cultivation_locked and, for a PENDING member, sets cycle_start_date to received_date and runs calculations.member_renewal_schedule"
      - "SETTLED + MAJOR_GIFT: recomputes funder.lifetime_committed_cents"
      - "SETTLED + SYNDICATION: recomputes collaboration.syndication_revenue_cents"
      - "SETTLED: recomputes every FiscalPeriod sustainability field on the RECOGNIZED basis"
      - "FAILED: recognizes nothing and leaves a PENDING member PENDING"
      - "increments Contribution.version by 1"

  - method: POST
    path: "/contributions/{id}/refund"
    description: "Finance refunds a SETTLED contribution; the compensating action for settlement, running the depth-4 giving-ledger cascade."
    roles: [FinanceController]
    code: 200
    input: ["refund_reason?"]
    output: Contribution
    side_effects:
      - "settlement_status -> REFUNDED, refunded_at = logical clock"
      - "member.lifetime_giving_cents drops by amount_cents; is_major_donor and cultivation_locked are recomputed but never un-latch"
      - "the linked Funder recomputes lifetime_committed_cents"
      - "the FiscalPeriod recomputes every sustainability field on the RECOGNIZED basis"
      - "acknowledgment_status and receipt_number are left untouched"
      - "increments Contribution.version by 1"

  - method: POST
    path: "/contributions/{id}/acknowledge"
    description: "Issue the tax receipt (disclose_publicly == false: UNACKNOWLEDGED -> RECEIPTED) or publish the gift in transparency reporting (disclose_publicly == true: RECEIPTED -> DISCLOSED). The acknowledgment dimension moves independently of settlement."
    roles: [DevelopmentOfficer]
    code: 200
    input: [disclose_publicly]
    output: Contribution
    side_effects:
      - "RECEIPTED: assigns receipt_number 'RCPT-' + zero-padded 6-digit counter in acknowledgment order, and freezes quid_pro_quo_cents and deductible_cents against later tier changes"
      - "DISCLOSED: the contribution becomes visible in GET /coverage-areas/{id}/transparency-report"
      - "increments Contribution.version by 1"

  # ---- Collaboration ------------------------------------------------------
  - method: POST
    path: "/collaborations"
    description: "Open a collaborative reporting project on a beat, with its production window, total cost and the newsroom's own credit and cost shares."
    roles: [EditorialDirector]
    code: 201
    input: [coverage_area_id, fiscal_period_id, title, window_start, window_end, total_cost_cents, lead_credit_bps, lead_cost_share_bps]
    output: Collaboration
    side_effects:
      - "status = DRAFT, partner_count = 0, lead_cost_share_bps seeded from the request"

  - method: GET
    path: "/collaborations/{id}"
    description: "Read one collaboration with its cost split and syndication revenue."
    roles: [EditorialDirector, FinanceController, BoardOversight, DevelopmentOfficer]
    code: 200
    input: []
    output: Collaboration
    side_effects: []

  - method: GET
    path: "/collaborations"
    description: "List collaborations with FK and status filters; ordered window_start ASC then created_at ASC."
    roles: [EditorialDirector, FinanceController, BoardOversight, DevelopmentOfficer]
    code: 200
    input: ["coverage_area_id?", "fiscal_period_id?", "status?", "limit?", "offset?"]
    output: Collaboration[]
    side_effects: []

  - method: POST
    path: "/collaborations/{id}/partners"
    description: "Add a partner newsroom with its byline-credit and cost shares. Legal while the collaboration is DRAFT or ACTIVE; adding to an ACTIVE collaboration re-runs the cost split."
    roles: [EditorialDirector]
    code: 201
    input: [partner_org_name, credit_share_bps, cost_share_bps]
    output: CollaborationPartner
    side_effects:
      - "status = CONFIRMED, increments collaboration.partner_count"
      - "when the collaboration is ACTIVE: re-runs calculations.collaboration_cost_split over the lead plus every CONFIRMED partner, rewriting cost_owed_cents and remainder_rank"
      - "increments Collaboration.version by 1"

  - method: GET
    path: "/collaborations/{id}/partners"
    description: "Sub-resource read of a collaboration's partners, ordered created_at ASC - the discovery channel for the largest-remainder cost allocation."
    roles: [EditorialDirector, FinanceController, BoardOversight, DevelopmentOfficer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: CollaborationPartner[]
    side_effects: []

  - method: POST
    path: "/collaborations/{id}/status-actions"
    description: "Drive the collaboration state machine: ACTIVATE (DRAFT -> ACTIVE, validating both bps sums and the window exclusivity), SETTLE (ACTIVE -> SETTLED once the window has closed), DISSOLVE (DRAFT or ACTIVE -> DISSOLVED)."
    roles: [EditorialDirector]
    code: 200
    input: [action]
    output: Collaboration
    side_effects:
      - "ACTIVATE: runs calculations.collaboration_cost_split, writing lead_cost_cents, allocated_cost_cents and every partner's cost_owed_cents and remainder_rank"
      - "SETTLE: sets settled_at and recomputes syndication_revenue_cents"
      - "DISSOLVE: every CONFIRMED partner moves to WITHDRAWN with cost_owed_cents reset to 0, and their shares fold into lead_credit_bps and lead_cost_share_bps"
      - "increments Collaboration.version by 1"

  - method: GET
    path: "/collaboration-partners/{id}"
    description: "Read one partner row with its allocated cost and remainder rank."
    roles: [EditorialDirector, FinanceController, BoardOversight, DevelopmentOfficer]
    code: 200
    input: []
    output: CollaborationPartner
    side_effects: []

  - method: POST
    path: "/collaboration-partners/{id}/withdraw"
    description: "A partner withdraws; its shares fold into the lead and the cost split is recomputed so the conservation invariant still holds exactly."
    roles: [EditorialDirector]
    code: 200
    input: ["withdrawal_reason?"]
    output: CollaborationPartner
    side_effects:
      - "status -> WITHDRAWN, withdrawn_at = logical clock, cost_owed_cents = 0, remainder_rank = 0"
      - "collaboration.lead_credit_bps += credit_share_bps and lead_cost_share_bps += cost_share_bps"
      - "re-runs calculations.collaboration_cost_split over the remaining CONFIRMED partners"
      - "decrements collaboration.partner_count, increments Collaboration.version and CollaborationPartner.version by 1"

  # ---- Operations / test-driving ------------------------------------------
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock, which every deadline, renewal, cooling-off and window rule reads. The clock starts at exactly 2026-08-01T00:00:00Z on a fresh server and never falls back to wall-clock time; it may only move forward."
    roles: [FinanceController, EditorialDirector, DevelopmentOfficer, BoardOversight]
    code: 200
    input: [current_utc]
    output: "{ current_utc: string, previous_utc: string }"
    side_effects:
      - "no entity is mutated; POST /ops/daily-sweep is what turns elapsed time into state transitions"

  - method: POST
    path: "/ops/daily-sweep"
    description: "Run the time-driven transitions at the current logical clock: members past next_renewal_date fall to GRACE, members past grace_expires_at fall to LAPSED, and reports past due_date go OVERDUE with the depth-4 delinquency cascade. Idempotent within a single clock value."
    roles: [FinanceController]
    code: 200
    input: []
    output: "{ swept_at: string, members_moved_to_grace: integer, members_moved_to_lapsed: integer, reports_moved_to_overdue: integer, proposals_suspended: integer, funders_restricted: integer }"
    side_effects:
      - "Member ACTIVE -> GRACE and GRACE -> LAPSED per §1.2"
      - "GrantReport SCHEDULED -> OVERDUE, driving compliance_flag = DELINQUENT, AWARDED -> SUSPENDED with clawback, the funder reliability penalty and re-scoring, and the FiscalPeriod sustainability recomputation"

# ---------------------------------------------------------------------------
# §1.6 Error Code Catalog
# ---------------------------------------------------------------------------
errors:
  # --- authentication / authorization
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or X-User-Role is not one of the five declared roles"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "The caller's role is not listed on the endpoint (e.g. a DevelopmentOfficer calling POST /grant-proposals/{id}/release-restricted-funds)"
  - id: ERR_MEMBER_SCOPE_FORBIDDEN
    http: 403
    condition: "A Member-role caller addresses a Member row or Contribution that is not their own"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "Dual control violated: the acting X-User-ID also performed the paired earlier step (cultivating the funder, soliciting the gift, drafting the proposal, or clearing the offer it now ratifies)"

  # --- existence
  - id: ERR_FISCAL_PERIOD_NOT_FOUND
    http: 404
    condition: "No FiscalPeriod with the given id, in the path or in fiscal_period_id"
  - id: ERR_MEMBERSHIP_TIER_NOT_FOUND
    http: 404
    condition: "No MembershipTier with the given id, in the path or in tier_id / new_tier_id"
  - id: ERR_MEMBER_NOT_FOUND
    http: 404
    condition: "No Member with the given id, in the path or in member_id"
  - id: ERR_COVERAGE_AREA_NOT_FOUND
    http: 404
    condition: "No CoverageArea with the given id, in the path or in coverage_area_id / affiliated_coverage_area_id"
  - id: ERR_FUNDER_NOT_FOUND
    http: 404
    condition: "No Funder with the given id, in the path or in funder_id / linked_funder_id"
  - id: ERR_DISCLOSURE_NOT_FOUND
    http: 404
    condition: "No FirewallDisclosure with the given id, in the path or in supersedes_disclosure_id"
  - id: ERR_INFLUENCE_CONTACT_NOT_FOUND
    http: 404
    condition: "No InfluenceContact with the given id"
  - id: ERR_GIFT_OFFER_NOT_FOUND
    http: 404
    condition: "No GiftOffer with the given id, in the path or in gift_offer_id"
  - id: ERR_GRANT_PROPOSAL_NOT_FOUND
    http: 404
    condition: "No GrantProposal with the given id"
  - id: ERR_GRANT_REPORT_NOT_FOUND
    http: 404
    condition: "No GrantReport with the given id"
  - id: ERR_CONTRIBUTION_NOT_FOUND
    http: 404
    condition: "No Contribution with the given id"
  - id: ERR_COLLABORATION_NOT_FOUND
    http: 404
    condition: "No Collaboration with the given id, in the path or in collaboration_id"
  - id: ERR_PARTNER_NOT_FOUND
    http: 404
    condition: "No CollaborationPartner with the given id"

  # --- request shape
  - id: ERR_INVALID_REQUEST
    http: 422
    condition: "Required input field absent, unknown enum value, wrong type, or a cent amount that is zero or negative where a positive amount is required"
  - id: ERR_INVALID_BPS_RANGE
    http: 422
    condition: "A basis-point input falls outside 0..10000, or audited_advocacy_index falls outside 0..10"
  - id: ERR_INVALID_DATE_RANGE
    http: 422
    condition: "A date pair violates start < end (period, restriction window, or collaboration window)"

  # --- state
  - id: ERR_PERIOD_LOCKED
    http: 409
    condition: "The scoping FiscalPeriod is REVIEW_LOCKED or CLOSED, so no contribution, settlement, refund, gift acceptance, award, release or collaboration settlement may be written against it"
  - id: ERR_TERMINAL_STATE
    http: 409
    condition: "A transition was requested on an entity already in one of its terminal states"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "The requested action is not a declared transition out of the entity's current state (e.g. CLOSE on an OPEN period, accept on a PROPOSED gift offer, REVISE on a DRAFT proposal)"
  - id: ERR_TIER_NOT_PUBLISHED
    http: 409
    condition: "The referenced MembershipTier is still DRAFT"
  - id: ERR_MEMBER_NOT_ACTIVE
    http: 409
    condition: "The Member is not ACTIVE (or ACTIVE/GRACE for a tier change) as the operation requires"
  - id: ERR_STALE_FUNDER_VERSION
    http: 412
    condition: "expected_funder_version on POST /firewall-disclosures does not equal the Funder's current version (§1.2.1 disclosure-create-stale-funder)"
  - id: ERR_STALE_MEMBER_VERSION
    http: 412
    condition: "expected_member_version on POST /members/{id}/tier-change does not equal the Member's current version (§1.2.1 tier-change-stale-member)"

  # --- business safety: editorial independence firewall
  - id: ERR_FUNDER_RESTRICTED
    http: 409
    condition: "The Funder is RESTRICTED, so no new gift offer, review, acceptance, proposal submission, award or contribution may reference it"
  - id: ERR_FUNDER_RISK_TOO_HIGH
    http: 409
    condition: "The Funder's recomputed independence_risk_score is >= RISK_HARD_BAR (60); no disclosure can waive the hard bar"
  - id: ERR_DISCLOSURE_REQUIRED
    http: 409
    condition: "independence_risk_score >= RISK_DISCLOSURE_FLOOR (40), or the funding is restricted to a beat, and no ACTIVE FirewallDisclosure exists for the exact (funder_id, coverage_area_id) pair"
  - id: ERR_DISCLOSURE_STALE
    http: 409
    condition: "A FirewallDisclosure covering the pair is in REATTESTATION_REQUIRED, so the firewall documentation is not current"
  - id: ERR_PUBLICATION_GATE_BLOCKED
    http: 409
    condition: "The CoverageArea's publication_gate is BLOCKED, suspending funding activity on that beat"
  - id: ERR_EDITORIAL_CONDITION_PRESENT
    http: 409
    condition: "The GiftOffer still carries non-empty donor_conditions at independence clearance"
  - id: ERR_CONDITION_ROUNDS_EXHAUSTED
    http: 409
    condition: "conditions_round_count has already reached MAX_CONDITION_ROUNDS (2) and another REQUEST_CONDITIONS was attempted"
  - id: ERR_REVISION_ROUNDS_EXHAUSTED
    http: 409
    condition: "revision_round_count has already reached MAX_REVISION_ROUNDS (3) and another REQUEST_REVISION was attempted"
  - id: ERR_BOARD_RATIFICATION_REQUIRED
    http: 409
    condition: "board_ratification_required is true and board_ratified_by_user_id is still null at acceptance"
  - id: ERR_BOARD_OVERRIDE_NOT_WARRANTED
    http: 409
    condition: "POST /fiscal-periods/{id}/board-override on a period whose concentration_hhi is below CONCENTRATION_BOARD_FLOOR_HHI and whose posture is HEALTHY or WATCH, or that already carries an override"

  # --- business referential
  - id: ERR_FUNDER_NOT_INSTITUTIONAL
    http: 422
    condition: "A GrantProposal names a funder whose funder_type is neither FOUNDATION nor GOVERNMENT"
  - id: ERR_STREAM_SOURCE_MISMATCH
    http: 422
    condition: "The contribution's source columns contradict its revenue_stream (MEMBERSHIP without member_id, MAJOR_GIFT without funder_id, SYNDICATION without collaboration_id, or a forbidden column populated)"
  - id: ERR_SUPERSEDE_TARGET_INVALID
    http: 409
    condition: "supersedes_disclosure_id points at a disclosure that is already SUPERSEDED or VOID, or that covers a different (funder_id, coverage_area_id) pair"
  - id: ERR_REPORT_SEQUENCE_VIOLATION
    http: 409
    condition: "A GrantReport was submitted while an earlier sequence_no of the same proposal is neither ACCEPTED nor WAIVED"
  - id: ERR_VARIANCE_UNACCEPTABLE
    http: 409
    condition: "abs(variance_bps) exceeds MAX_ACCEPTABLE_VARIANCE_BPS (2000) on ACCEPT; the report must be RETURNED instead"
  - id: ERR_SPEND_EXCEEDS_RELEASE
    http: 422
    condition: "spend_reported_cents exceeds the report's consumed_release_cents"
  - id: ERR_AWARD_AMOUNT_INVALID
    http: 422
    condition: "awarded_amount_cents is absent, below 1, or above requested_amount_cents on AWARDED; or award_date falls outside the fiscal period's inclusive date range"

  # --- business temporal
  - id: ERR_FUNDER_COOLING_OFF_VIOLATION
    http: 409
    condition: "Fewer than COOLING_OFF_DAYS (30) days have elapsed since funder.restricted_at, or another SUBMITTED/AWARDED proposal of the same funder has a restriction window within 30 days of this one"
  - id: ERR_COLLABORATION_WINDOW_OVERLAP
    http: 409
    condition: "Another ACTIVE Collaboration on the same coverage area has a half-open [window_start, window_end) interval overlapping this one; adjacency is allowed"
  - id: ERR_WINDOW_OUTSIDE_PERIOD
    http: 422
    condition: "The collaboration window is not contained in its FiscalPeriod's inclusive date range"
  - id: ERR_REPORT_PERIOD_NOT_ELAPSED
    http: 409
    condition: "A GrantReport was submitted before its period_end"
  - id: ERR_COLLABORATION_WINDOW_OPEN
    http: 409
    condition: "SETTLE was requested while the logical clock is still before window_end"
  - id: ERR_CLOCK_REWIND
    http: 422
    condition: "The submitted current_utc is earlier than the clock's present value"

  # --- business constraint
  - id: ERR_CREDIT_SHARE_SUM_INVALID
    http: 409
    condition: "lead_credit_bps plus the CONFIRMED partners' credit_share_bps does not equal exactly 10000 at activation"
  - id: ERR_COST_SHARE_SUM_INVALID
    http: 409
    condition: "lead_cost_share_bps plus the CONFIRMED partners' cost_share_bps does not equal exactly 10000 at activation"
  - id: ERR_NO_CONFIRMED_PARTNER
    http: 409
    condition: "ACTIVATE was requested on a collaboration with partner_count == 0"
  - id: ERR_RESTRICTED_GRANT_CAP_EXCEEDED
    http: 409
    condition: "Awarding would give the CoverageArea more than MAX_RESTRICTED_GRANTS_PER_AREA (2) overlapping restricted grants"
  - id: ERR_BENEFIT_CODE_DUPLICATE
    http: 422
    condition: "The tier's benefits array repeats a benefit_code"
  - id: ERR_BENEFIT_VALUE_EXCEEDS_CONTRIBUTION
    http: 409
    condition: "PUBLISH on a tier whose quid_pro_quo_per_period_cents is greater than or equal to contribution_amount_cents"
  - id: ERR_PARTNER_DUPLICATE
    http: 409
    condition: "partner_org_name already exists among the collaboration's CONFIRMED partners"
  - id: ERR_LAST_PARTNER_WITHDRAWAL
    http: 409
    condition: "The last CONFIRMED partner of an ACTIVE collaboration attempted to withdraw"
  - id: ERR_DISCLOSURE_IN_USE
    http: 409
    condition: "VOID was requested on a disclosure whose (funder_id, coverage_area_id) pair still backs an AWARDED GrantProposal"

  # --- business fiscal
  - id: ERR_CONTRIBUTION_BELOW_TIER_MINIMUM
    http: 422
    condition: "A MEMBERSHIP contribution's amount_cents is below the member's tier contribution_amount_cents"
  - id: ERR_POSTURE_BLOCKS_RELEASE
    http: 409
    condition: "The fiscal period's sustainability_posture is CRITICAL, so restricted_release_cap_pct_bps is 0 and no release of any size is permitted"
  - id: ERR_RELEASE_CAP_EXCEEDED
    http: 409
    condition: "request_amount_cents exceeds round_half_up(unreleased_cents * restricted_release_cap_pct_bps / 10000); not raised when the cap is 10000 bps (HEALTHY), where ERR_RELEASE_EXCEEDS_AWARD is the overflow error"
  - id: ERR_RELEASE_EXCEEDS_AWARD
    http: 409
    condition: "The release waterfall cannot absorb the request: the remaining bucket capacity is smaller than request_amount_cents"
  - id: ERR_PROPOSAL_DELINQUENT
    http: 409
    condition: "A release or reinstatement was requested while compliance_flag is DELINQUENT"
  - id: ERR_REFUND_WINDOW_CLOSED
    http: 409
    condition: "A refund was requested on a contribution whose acknowledgment_status is already DISCLOSED"
  - id: ERR_RESERVE_FLOOR_BREACH
    http: 409
    condition: "CLOSE was requested while reserve_months_ratio_bps < 10000 and board_override_active is false"
  - id: ERR_CONCENTRATION_BOARD_REVIEW_REQUIRED
    http: 409
    condition: "LOCK was requested while concentration_hhi >= CONCENTRATION_BOARD_FLOOR_HHI (4500) and board_override_active is false"
  - id: ERR_UNSETTLED_CONTRIBUTIONS
    http: 409
    condition: "CLOSE was requested while at least one Contribution of the period is still INITIATED"

# ---------------------------------------------------------------------------
# §1.7 RBAC Matrix
# ---------------------------------------------------------------------------
roles:
  - name: DevelopmentOfficer
    description: "Fundraising staff: builds membership tiers, enrols members, cultivates funders, solicits gifts, drafts proposals, submits grant reports and issues receipts. Never rules on independence and never moves money."
    identity: opaque
    exclusive_operations:
      - "POST /membership-tiers"
      - "POST /membership-tiers/{id}/publish"
      - "POST /members"
      - "POST /funders"
      - "POST /gift-offers"
      - "POST /gift-offers/{id}/submit-for-review"
      - "POST /gift-offers/{id}/accept"
      - "POST /grant-proposals"
      - "POST /grant-proposals/{id}/pipeline-actions"
      - "POST /grant-proposals/{id}/record-outcome"
      - "POST /grant-reports/{id}/submit"
      - "POST /contributions/{id}/acknowledge"
    shared_operations:
      - "POST /members/{id}/lifecycle-actions (with Member)"
      - "POST /members/{id}/tier-change (with Member)"
      - "POST /contributions (with Member)"
      - "POST /influence-contacts (with EditorialDirector)"
      - "every GET read except GET /fiscal-periods/{id}/sustainability"
      - "POST /_clock/set_current_utc"

  - name: EditorialDirector
    description: "Newsroom editorial leadership: owns the independence firewall. Clears or restricts funders, rules on gift offers and proposals, attests disclosures, and runs collaborative reporting partnerships. Never solicits and never releases funds."
    identity: opaque
    exclusive_operations:
      - "POST /coverage-areas"
      - "POST /funders/{id}/independence-clearance"
      - "POST /firewall-disclosures"
      - "POST /firewall-disclosures/{id}/attest"
      - "POST /gift-offers/{id}/independence-review"
      - "POST /grant-proposals/{id}/internal-review"
      - "POST /collaborations"
      - "POST /collaborations/{id}/partners"
      - "POST /collaborations/{id}/status-actions"
      - "POST /collaboration-partners/{id}/withdraw"
    shared_operations:
      - "POST /influence-contacts (with DevelopmentOfficer)"
      - "GET /fiscal-periods/{id}/sustainability (with FinanceController, BoardOversight)"
      - "every GET read except GET /members and GET /members/{id}"
      - "POST /_clock/set_current_utc"

  - name: FinanceController
    description: "Finance staff: owns fiscal periods, settlement, refunds, restricted-fund releases, report review and grant closeout. Never rules on independence and never solicits."
    identity: opaque
    exclusive_operations:
      - "POST /fiscal-periods"
      - "POST /fiscal-periods/{id}/status-actions"
      - "POST /contributions/{id}/settlement"
      - "POST /contributions/{id}/refund"
      - "POST /grant-proposals/{id}/release-restricted-funds"
      - "POST /grant-proposals/{id}/reinstate"
      - "POST /grant-proposals/{id}/close"
      - "POST /grant-reports/{id}/review"
      - "POST /ops/daily-sweep"
    shared_operations:
      - "GET /fiscal-periods/{id}/sustainability (with EditorialDirector, BoardOversight)"
      - "every GET read"
      - "POST /_clock/set_current_utc"

  - name: BoardOversight
    description: "Board-level oversight: ratifies large or elevated-risk gifts and records reserve/concentration overrides. Read-only everywhere else; never originates funding activity."
    identity: opaque
    exclusive_operations:
      - "POST /fiscal-periods/{id}/board-override"
      - "POST /gift-offers/{id}/board-ratification"
    shared_operations:
      - "GET /fiscal-periods/{id}/sustainability (with FinanceController, EditorialDirector)"
      - "every GET read except GET /members and GET /members/{id}"
      - "POST /_clock/set_current_utc"

  - name: Member
    description: "A member acting on their own record: may read their own membership and contributions, renew, reinstate, cancel, change tier and give. X-User-ID is the Member row's id."
    identity: "entity_backed:Member"
    exclusive_operations: []
    shared_operations:
      - "GET /members/{id} - own row only (with DevelopmentOfficer, FinanceController)"
      - "POST /members/{id}/lifecycle-actions - own row only (with DevelopmentOfficer)"
      - "POST /members/{id}/tier-change - own row only (with DevelopmentOfficer)"
      - "POST /contributions - own member_id only (with DevelopmentOfficer)"
      - "GET /contributions/{id} - own contributions only"
      - "GET /membership-tiers, GET /membership-tiers/{id}, GET /coverage-areas, GET /coverage-areas/{id}, GET /coverage-areas/{id}/transparency-report"
