              as_user_id: "${lf_id}"
              captures: { c1_id: $.data.id, c1_state: $.data.status }
          trigger:
            - call: "POST /special-waste-approvals"
              payload: { landfill_id: "${lf_id}", generator_name: "Ridgeview Plating Co", waste_code: "IS-4410", profile_stream: "INDUSTRIAL_SPECIAL", approved_tons_cap: 500, effective_from: "2026-01-01T00:00:00Z", expires_on: "2026-12-31T00:00:00Z" }
              as: EnvironmentalManager
              as_user_id: "env-manager-1"
              captures: { swa_state: $.data.status }
            - call: "POST /treatment-agreements"
              payload: { landfill_id: "${lf_id}", facility_name: "Valley POTW", daily_gallon_cap: 20000, base_haul_fee: 350.00, treatment_rate_per_kgal: 62.50, effective_from: "2026-01-01T00:00:00Z", expires_on: "2026-12-31T00:00:00Z", concurrent_slot_capacity: 4 }
              as: EnvironmentalManager
              as_user_id: "env-manager-1"
              captures: { ta_state: $.data.status }
            - call: "POST /closure-cost-estimates"
