  # =================================================================
  # Section: cross_cutting_layers
  # =================================================================
  - section: cross_cutting_layers
    instances:
      - name: classification_create_stale_version_returns_412
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[classification-create-stale-product]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "OCC on Product.version: after a first classification create advanced the product version to 2, a second create carrying the stale expected_product_version=1 is rejected 412 ERR_STALE_VERSION."
        test_recipe:
          setup: ["product created (version 1 captured); first classification created with expected_product_version=1 (product version now 2)"]
          setup_api_calls:
            - call: "POST /compliance/products"
              payload: { sku: "P-070", name: "Coil", controlled_content_pct: 0, unit_value_cents: 10 }
              as: ComplianceAnalyst
              captures: { p_id: $.data.id, p_v: $.data.version }
            - call: "POST /compliance/classifications"
              payload: { product_id: "${p_id}", expected_product_version: "${p_v}", jurisdiction: "EAR", classification_code: "EAR99", determination_basis: "SELF_CLASSIFICATION" }
              as: ComplianceAnalyst
              captures: { c1_id: $.data.id }
          trigger:
            - call: "POST /compliance/classifications"
              payload: { product_id: "${p_id}", expected_product_version: "${p_v}", jurisdiction: "EAR", classification_code: "5A002", determination_basis: "CCATS" }
              as: ComplianceAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "err == \"ERR_STALE_VERSION\" (http 412; captured version 1 is stale after the first create bumped the product to 2)"
            - "GET /compliance/products/${p_id} still shows classification_count == 1 (the rejected create wrote nothing)"

      - name: product_version_increments_on_each_mutation
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[classification-create-stale-product]", entities.Product]
        distinguishing_aspect: "The OCC counter is observable: product version starts at 1 and increments by exactly 1 on each mutation (classification create, then approval side effect)."
        test_recipe:
          setup: ["product created (version 1)"]
          setup_api_calls:
            - call: "POST /compliance/products"
              payload: { sku: "P-071", name: "Wire", controlled_content_pct: 0, unit_value_cents: 10 }
              as: ComplianceAnalyst
              captures: { p_id: $.data.id, p_v: $.data.version }
          trigger:
            - call: "POST /compliance/classifications"
              payload: { product_id: "${p_id}", expected_product_version: "${p_v}", jurisdiction: "EAR", classification_code: "EAR99", determination_basis: "SELF_CLASSIFICATION" }
              as: ComplianceAnalyst
              captures: { c_id: $.data.id }
            - call: "POST /compliance/classifications/${c_id}/submit"
              payload: {}
              as: ComplianceAnalyst
              as_user_id: "analyst-1"
            - call: "POST /compliance/classifications/${c_id}/review"
              payload: { decision: "APPROVE" }
              as: ComplianceManager
              as_user_id: "manager-1"
            - call: "GET /compliance/products/${p_id}"
              payload: {}
              as: ComplianceAnalyst
              captures: { p_v_final: $.data.version }
          assert:
            - "p_v == 1"
            - "p_v_final == 3 (create-classification bump + approval-repoint bump)"

      - name: license_expiry_sweep_boundary
        claim_type: scheduled_actions
        grounds: [state_machines.License.APPROVED_to_EXPIRED, calculations.audit_retention]
        distinguishing_aspect: "License expiry is date-granular and strictly-greater: at clock date == valid_until the license stays APPROVED; one day later the clock-set sweep moves it to EXPIRED."
        test_recipe:
          setup: ["EAR99 product; license valid 2026-07-01..2026-12-31 APPROVED"]
          setup_api_calls:
            - call: "POST /compliance/products"
              payload: { sku: "P-072", name: "Tape", controlled_content_pct: 0, unit_value_cents: 10 }
              as: ComplianceAnalyst
              captures: { p_id: $.data.id, p_v: $.data.version }
            - call: "POST /compliance/classifications"
              payload: { product_id: "${p_id}", expected_product_version: "${p_v}", jurisdiction: "EAR", classification_code: "EAR99", determination_basis: "SELF_CLASSIFICATION" }
              as: ComplianceAnalyst
              captures: { c_id: $.data.id }
            - call: "POST /compliance/classifications/${c_id}/submit"
              payload: {}
              as: ComplianceAnalyst
              as_user_id: "analyst-1"
            - call: "POST /compliance/classifications/${c_id}/review"
              payload: { decision: "APPROVE" }
              as: ComplianceManager
              as_user_id: "manager-1"
            - call: "POST /compliance/licenses"
              payload: { product_id: "${p_id}", issuing_authority: "BIS", approved_value_cents: 1000, approved_quantity: 10, valid_from: "2026-07-01", valid_until: "2026-12-31" }
              as: ComplianceAnalyst
              captures: { l_id: $.data.id }
            - call: "POST /compliance/licenses/${l_id}/submit"
              payload: {}
              as: ComplianceAnalyst
              as_user_id: "analyst-1"
            - call: "POST /compliance/licenses/${l_id}/review"
              payload: { decision: "APPROVE" }
              as: ComplianceManager
              as_user_id: "manager-1"
          trigger:
            - call: "POST /compliance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-31T00:00:00Z" }
              as: ComplianceDirector
            - call: "GET /compliance/licenses/${l_id}"
              payload: {}
              as: ComplianceDirector
              captures: { l_status_eq: $.data.status }
            - call: "POST /compliance/_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-01T00:00:00Z" }
              as: ComplianceDirector
            - call: "GET /compliance/licenses/${l_id}"
              payload: {}
              as: ComplianceDirector
              captures: { l_status_after: $.data.status }
          assert:
            - "l_status_eq == \"APPROVED\" (2026-12-31 == valid_until: still valid, expiry is strict)"
            - "l_status_after == \"EXPIRED\" (2027-01-01 > valid_until triggers the sweep)"

      - name: grant_expiry_sweep_exclusive_end_date
        claim_type: scheduled_actions
        grounds: [state_machines.AccessGrant.ACTIVE_to_EXPIRED, entities.AccessGrant.fields.end_date]
        distinguishing_aspect: "Grant expiry follows the half-open window: at clock date 2026-08-31 (< end_date 2026-09-01) the grant stays ACTIVE with count 1; at 2026-09-01 (== end_date, exclusive end) the sweep expires it and decrements active_grant_count to 0."
        test_recipe:
          setup: ["EAR99 product; ACTIVE TCP; FN party; grant APPROVED then ACTIVATED for [2026-08-01, 2026-09-01)"]
          setup_api_calls:
            - call: "POST /compliance/products"
              payload: { sku: "P-073", name: "Foil", controlled_content_pct: 0, unit_value_cents: 10 }
              as: ComplianceAnalyst
              captures: { p_id: $.data.id, p_v: $.data.version }
            - call: "POST /compliance/classifications"
              payload: { product_id: "${p_id}", expected_product_version: "${p_v}", jurisdiction: "EAR", classification_code: "EAR99", determination_basis: "SELF_CLASSIFICATION" }
              as: ComplianceAnalyst
              captures: { c_id: $.data.id }
            - call: "POST /compliance/classifications/${c_id}/submit"
              payload: {}
              as: ComplianceAnalyst
              as_user_id: "analyst-1"
            - call: "POST /compliance/classifications/${c_id}/review"
              payload: { decision: "APPROVE" }
              as: ComplianceManager
              as_user_id: "manager-1"
            - call: "POST /compliance/tcps"
              payload: { name: "TCP-E", enclave_id: "LAB-E", product_id: "${p_id}", segregation_level: "LEVEL_1", effective_from: "2026-01-01", effective_to: "2027-01-01" }
              as: ComplianceAnalyst
              captures: { tcp_id: $.data.id }
            - call: "POST /compliance/tcps/${tcp_id}/set-status"
              payload: { to: "ACTIVE" }
              as: ComplianceAnalyst
            - call: "POST /compliance/parties"
              payload: { legal_name: "Ines Costa", country_code: "PRT", city: "Faro", party_type: "FOREIGN_NATIONAL", is_foreign_national: true }
              as: ComplianceAnalyst
              captures: { party_id: $.data.id }
            - call: "POST /compliance/access-grants"
              payload: { tcp_id: "${tcp_id}", party_id: "${party_id}", start_date: "2026-08-01", end_date: "2026-09-01" }
              as: ComplianceAnalyst
              as_user_id: "analyst-1"
              captures: { g_id: $.data.id }
            - call: "POST /compliance/access-grants/${g_id}/review"
              payload: { decision: "APPROVE" }
              as: ComplianceManager
              as_user_id: "manager-1"
            - call: "POST /compliance/access-grants/${g_id}/activate"
              payload: {}
              as: ComplianceManager
              as_user_id: "manager-1"
          trigger:
            - call: "POST /compliance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-31T00:00:00Z" }
              as: ComplianceDirector
            - call: "GET /compliance/access-grants/${g_id}"
              payload: {}
              as: ComplianceManager
              captures: { g_status_pre: $.data.status }
            - call: "POST /compliance/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ComplianceDirector
            - call: "GET /compliance/access-grants/${g_id}"
              payload: {}
              as: ComplianceManager
              captures: { g_status_post: $.data.status }
            - call: "GET /compliance/parties/${party_id}"
              payload: {}
              as: ComplianceManager
              captures: { gcount_post: $.data.active_grant_count }
          assert:
            - "g_status_pre == \"ACTIVE\" (2026-08-31 < end_date)"
            - "g_status_post == \"EXPIRED\" (2026-09-01 >= end_date, exclusive end)"
            - "gcount_post == 0"

      - name: determination_pinning_survives_reclassification
        claim_type: version_pinning_on_approval
        grounds: [entities.ExportOrder.fields.determination_classification_sequence, calculations.license_determination]
        distinguishing_aspect: "Version-pinning: the order's final determination and pinned classification sequence are frozen at submit; a later reclassification of the product does NOT retroactively change them."
        test_recipe:
          setup: ["product CLASSIFIED EAR99 (sequence 1); order submitted (determination NOT_REQUIRED pinned at sequence 1); then product reclassified to ECCN 5A002 (sequence 2 ACTIVE)"]
          setup_api_calls:
            - call: "POST /compliance/products"
              payload: { sku: "P-074", name: "Mesh", controlled_content_pct: 50, unit_value_cents: 100 }
              as: ComplianceAnalyst
              captures: { p_id: $.data.id, p_v1: $.data.version }
            - call: "POST /compliance/classifications"
              payload: { product_id: "${p_id}", expected_product_version: "${p_v1}", jurisdiction: "EAR", classification_code: "EAR99", determination_basis: "SELF_CLASSIFICATION" }
              as: ComplianceAnalyst
              captures: { c1_id: $.data.id }
            - call: "POST /compliance/classifications/${c1_id}/submit"
              payload: {}
              as: ComplianceAnalyst
              as_user_id: "analyst-1"
            - call: "POST /compliance/classifications/${c1_id}/review"
              payload: { decision: "APPROVE" }
              as: ComplianceManager
              as_user_id: "manager-1"
            - call: "POST /compliance/parties"
              payload: { legal_name: "Sofia Textiles AD", country_code: "BGR", city: "Sofia", party_type: "CUSTOMER" }
              as: TradeOpsSpecialist
              captures: { party_id: $.data.id }
            - call: "POST /compliance/orders"
              payload: { product_id: "${p_id}", party_id: "${party_id}", destination_country: "BGR", end_use: "CIVILIAN", quantity: 1 }
              as: TradeOpsSpecialist
              captures: { o_id: $.data.id }
            - call: "POST /compliance/orders/${o_id}/submit"
              payload: {}
              as: TradeOpsSpecialist
            - call: "GET /compliance/products/${p_id}"
              payload: {}
              as: ComplianceAnalyst
              captures: { p_v2: $.data.version }
            - call: "POST /compliance/classifications"
              payload: { product_id: "${p_id}", expected_product_version: "${p_v2}", jurisdiction: "EAR", classification_code: "5A002", determination_basis: "CCATS" }
              as: ComplianceAnalyst
              captures: { c2_id: $.data.id }
            - call: "POST /compliance/classifications/${c2_id}/submit"
              payload: {}
              as: ComplianceAnalyst
              as_user_id: "analyst-1"
            - call: "POST /compliance/classifications/${c2_id}/review"
              payload: { decision: "APPROVE" }
              as: ComplianceManager
              as_user_id: "manager-1"
          trigger:
            - call: "GET /compliance/orders/${o_id}"
              payload: {}
              as: TradeOpsSpecialist
              captures: { o_det: $.data.determination, o_seq: $.data.determination_classification_sequence }
          assert:
            - "o_det == \"NOT_REQUIRED\" (frozen at submit; the 5A002 reclassification did not recompute it)"
            - "o_seq == 1 (pinned to the classification ACTIVE at submit time)"

      - name: list_change_cascade_covered
        claim_type: cascading_side_effects
        grounds: [state_machines.ScreeningListEntry.INACTIVE_to_ACTIVE]
        excluded_because:
          difficulty_instance: transitive_cascade / list_activation_rescreen_cascade_depth3
          rationale: "The 3-link cascade (entry -> result -> order -> shipment) is asserted end-to-end there."

      - name: license_revocation_cascade_covered
        claim_type: cascading_side_effects
        grounds: [state_machines.License.APPROVED_to_REVOKED]
        excluded_because:
          difficulty_instance: transitive_cascade / license_revocation_cascade_depth2
          rationale: "The 2-link revocation cascade is asserted end-to-end there."

      - name: dual_variant_calculations_covered
        claim_type: dual_variant_calculation
        grounds: [calculations.license_determination, calculations.screening_match_score]
        excluded_because:
          difficulty_instance: dual_variant_calc / determination_provisional_vs_final_on_reclassification
          rationale: "Both variant divergences (determination provisional/final; screening EXACT/FUZZY) are asserted by the two §1.8 dual_variant_calc instances."

  # =================================================================
  # Section: consistency_model
  # =================================================================
  - section: consistency_model
    instances:
      - name: release_effects_visible_immediately
        claim_type: immediate_visibility
        grounds: [complexity_profile.consistency_model]
        distinguishing_aspect: "Immediate consistency: the shipment release RESPONSE itself carries status RELEASED with computed fee_cents/consumed_value_cents, and the very next GETs of the license and order reflect the decremented/incremented derived fields — no reconciliation lag."
        test_recipe:
          setup: ["EAR99 product unit 1000; NOT_REQUIRED order qty 2 -> CLEARED -> RELEASED; shipment qty 2 SCREENED"]
          setup_api_calls:
            - call: "POST /compliance/products"
              payload: { sku: "P-080", name: "Sleeve", controlled_content_pct: 0, unit_value_cents: 1000 }
              as: ComplianceAnalyst
              captures: { p_id: $.data.id, p_v: $.data.version }
            - call: "POST /compliance/classifications"
              payload: { product_id: "${p_id}", expected_product_version: "${p_v}", jurisdiction: "EAR", classification_code: "EAR99", determination_basis: "SELF_CLASSIFICATION" }
              as: ComplianceAnalyst
              captures: { c_id: $.data.id }
            - call: "POST /compliance/classifications/${c_id}/submit"
              payload: {}
              as: ComplianceAnalyst
              as_user_id: "analyst-1"
            - call: "POST /compliance/classifications/${c_id}/review"
              payload: { decision: "APPROVE" }
              as: ComplianceManager
              as_user_id: "manager-1"
            - call: "POST /compliance/parties"
              payload: { legal_name: "Vilnius Trade UAB", country_code: "LTU", city: "Vilnius", party_type: "CUSTOMER" }
              as: TradeOpsSpecialist
              captures: { party_id: $.data.id }
            - call: "POST /compliance/orders"
              payload: { product_id: "${p_id}", party_id: "${party_id}", destination_country: "LTU", end_use: "CIVILIAN", quantity: 2 }
              as: TradeOpsSpecialist
              captures: { o_id: $.data.id }
            - call: "POST /compliance/orders/${o_id}/submit"
              payload: {}
              as: TradeOpsSpecialist
            - call: "POST /compliance/orders/${o_id}/release"
              payload: {}
              as: TradeOpsSpecialist
            - call: "POST /compliance/shipments"
              payload: { order_id: "${o_id}", quantity: 2, planned_ship_date: "2026-08-10" }
              as: TradeOpsSpecialist
              captures: { s_id: $.data.id }
            - call: "POST /compliance/shipments/${s_id}/screen"
              payload: {}
              as: TradeOpsSpecialist
          trigger:
            - call: "POST /compliance/shipments/${s_id}/release"
              payload: {}
              as: TradeOpsSpecialist
              captures: { s_status: $.data.status, s_fee: $.data.fee_cents, s_consumed: $.data.consumed_value_cents }
            - call: "GET /compliance/orders/${o_id}"
              payload: {}
              as: TradeOpsSpecialist
              captures: { o_shipped: $.data.shipped_quantity, o_fees: $.data.accumulated_fees_cents }
          assert:
            - "s_status == \"RELEASED\" and s_consumed == 2000 and s_fee == 30 (round(2000*0.015)=30) in the release response itself"
            - "o_shipped == 2 and o_fees == 30 on the immediately-following GET (no lag)"


