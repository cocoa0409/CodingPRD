# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Bank Capital Planning & Regulatory Reporting
# =============================================================================
# 9 difficulty rules × 2 instances each = 18 instances minimum.
# All numeric asserts pre-computed by hand from §1.3 formulas.
# =============================================================================

scaffold_difficulty_design:
  # -------------------------------------------------------------------------
  # Rule 1 — Dual-variant calculations across different entity domains
  # -------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: rwa_standardized_vs_advanced_on_same_exposure
        grounds:
          - calculations.rwa_standardized
          - calculations.rwa_advanced
          - calculations.rwa_selected
          - entities.RiskExposure.fields.rwa_cents_standardized
          - entities.RiskExposure.fields.rwa_cents_advanced
        distinguishing_aspect: |
          Same RiskExposure inputs produce rwa_standardized_cents = 5_000_000_000 and
          rwa_advanced_cents = 5_300_000_000 (no Collins floor binding because
          collateral_haircut_bps == 0). rwa_cents differs by methodology: STANDARDIZED
          banks see 5_000_000_000; ADVANCED banks see 5_300_000_000. Operates on the
          RiskExposure/RWA domain — distinct from the capital-stack domain below.
        test_recipe:
          setup:
            - "Bank A (STANDARDIZED) and Bank B (ADVANCED) both exist"
            - "Both banks have a ReportingPeriod 2026Q2 (period_end_date 2026-06-30) in OPEN"
            - "Each bank has one CORPORATE RiskExposure: EAD 10_000_000_000 cents, risk_weight_bps 5000, collateral_haircut_bps 0, obligor_grade INVESTMENT_GRADE"
            - "Clock is at default 2026-08-01T00:00:00Z (before period end; period stays OPEN)"
          setup_api_calls:
            - call: "POST /banks"
              payload: { legal_name: "StdBank", charter_id: "CH-STD-001", rwa_methodology: "STANDARDIZED" }
              as: SystemOperator
              captures: { bank_std: $.data.id }
            - call: "POST /banks"
              payload: { legal_name: "AdvBank", charter_id: "CH-ADV-001", rwa_methodology: "ADVANCED" }
              as: SystemOperator
              captures: { bank_adv: $.data.id }
            - call: "POST /banks/${bank_std}/reporting-periods"
              payload: { period_end_date: "2026-06-30", period_year: 2026, period_quarter: "Q2" }
              as: CapitalAnalyst
              captures: { period_std: $.data.id }
            - call: "POST /banks/${bank_adv}/reporting-periods"
              payload: { period_end_date: "2026-06-30", period_year: 2026, period_quarter: "Q2" }
              as: CapitalAnalyst
              captures: { period_adv: $.data.id }
            - call: "POST /banks/${bank_std}/reporting-periods/${period_std}/risk-exposures"
              payload: { reporting_period_id: "${period_std}", exposure_class: "CORPORATE", exposure_at_default_cents: 10000000000, risk_weight_bps: 5000, obligor_grade: "INVESTMENT_GRADE", collateral_haircut_bps: 0 }
              as: CapitalAnalyst
              captures: { exp_std: $.data.id }
            - call: "POST /banks/${bank_adv}/reporting-periods/${period_adv}/risk-exposures"
              payload: { reporting_period_id: "${period_adv}", exposure_class: "CORPORATE", exposure_at_default_cents: 10000000000, risk_weight_bps: 5000, obligor_grade: "INVESTMENT_GRADE", collateral_haircut_bps: 0 }
              as: CapitalAnalyst
              captures: { exp_adv: $.data.id }
          trigger:
            - call: "GET /banks/${bank_std}/reporting-periods/${period_std}/risk-exposures/${exp_std}"
              as: CapitalAnalyst
              captures: { rwa_std_std: $.data.rwa_cents_standardized, rwa_std_adv: $.data.rwa_cents_advanced }
            - call: "GET /banks/${bank_adv}/reporting-periods/${period_adv}/risk-exposures/${exp_adv}"
              as: CapitalAnalyst
              captures: { rwa_adv_std: $.data.rwa_cents_standardized, rwa_adv_adv: $.data.rwa_cents_advanced }
          assert:
            - "RiskExposure.${exp_std}.rwa_cents_standardized == 5000000000"
            - "RiskExposure.${exp_std}.rwa_cents_advanced == 5300000000"
            - "RiskExposure.${exp_adv}.rwa_cents_standardized == 5000000000"
            - "RiskExposure.${exp_adv}.rwa_cents_advanced == 5300000000"
            - "rwa_cents_standardized != rwa_cents_advanced on identical inputs (divergence == 300000000)"

      - name: cet1_total_capital_dual_variant_under_t2_cap
        grounds:
          - calculations.cet1_tier1_total_capital
          - entities.CapitalInstrument.fields.regulatory_capital_cents
        distinguishing_aspect: |
          The cet1_tier1_total_capital calculation has two valid cap interpretations —
          "T2 capped at 2% of RWA" vs "T2 capped at min(2% of RWA, 100% of CET1)" — and
          the scaffold pins the latter. With CET1 = 8_000_000_000, RWA = 100_000_000_000,
          T2 raw = 3_000_000_000: cap-2%-of-RWA = 2_000_000_000, cap-100%-of-CET1 =
          8_000_000_000, so t2_counted = min(3e9, 2e9, 8e9) = 2_000_000_000 and
          total_capital = 10_000_000_000. A different entity domain (CapitalInstrument /
          capital stack) than the RWA-domain instance above.
        test_recipe:
          setup:
            - "Bank with rwa_methodology STANDARDIZED exists"
            - "ReportingPeriod 2026Q2 in OPEN"
            - "RiskExposure CORPORATE: EAD 100_000_000_000 cents, risk_weight_bps 10000, obligor_grade INVESTMENT_GRADE, collateral_haircut 0 → rwa_cents = 100_000_000_000"
            - "CapitalInstrument CET1/COMMON_STOCK outstanding 8_000_000_000"
            - "CapitalInstrument T2/SUBORDINATED_DEBT outstanding 3_000_000_000, maturity 2032-12-31 (>5y from 2026-06-30, no haircut)"
          setup_api_calls:
            - call: "POST /banks"
              payload: { legal_name: "CapStackBank", charter_id: "CH-CAP-001", rwa_methodology: "STANDARDIZED" }
              as: SystemOperator
              captures: { bank_cap: $.data.id }
            - call: "POST /banks/${bank_cap}/reporting-periods"
              payload: { period_end_date: "2026-06-30", period_year: 2026, period_quarter: "Q2" }
              as: CapitalAnalyst
              captures: { period_cap: $.data.id }
            - call: "POST /banks/${bank_cap}/reporting-periods/${period_cap}/risk-exposures"
              payload: { reporting_period_id: "${period_cap}", exposure_class: "CORPORATE", exposure_at_default_cents: 100000000000, risk_weight_bps: 10000, obligor_grade: "INVESTMENT_GRADE", collateral_haircut_bps: 0 }
              as: CapitalAnalyst
            - call: "POST /banks/${bank_cap}/capital-instruments"
              payload: { instrument_class: "CET1", instrument_subtype: "COMMON_STOCK", outstanding_amount_cents: 8000000000, issuance_date: "2020-01-15", contractual_rate_bps: 0 }
              as: CapitalAnalyst
            - call: "POST /banks/${bank_cap}/capital-instruments"
              payload: { instrument_class: "T2", instrument_subtype: "SUBORDINATED_DEBT", outstanding_amount_cents: 3000000000, issuance_date: "2022-01-15", maturity_date: "2032-12-31", contractual_rate_bps: 500 }
              as: CapitalAnalyst
            - call: "POST /banks/${bank_cap}/reporting-periods/${period_cap}/call-reports"
              payload: {}
              as: CapitalAnalyst
              captures: { report_cap: $.data.id }
          trigger:
            - call: "POST /banks/${bank_cap}/reporting-periods/${period_cap}/call-reports/${report_cap}/prepare"
              as: CapitalAnalyst
              captures: { cet1: $.data.cet1_cents, tier1: $.data.tier1_cents, total: $.data.total_capital_cents, rwa: $.data.rwa_cents }
          assert:
            - "CallReport.${report_cap}.cet1_cents == 8000000000"
            - "CallReport.${report_cap}.tier1_cents == 8000000000"
            - "CallReport.${report_cap}.rwa_cents == 100000000000"
            - "CallReport.${report_cap}.total_capital_cents == 10000000000  # tier1 8e9 + t2_counted 2e9"
            - "t2 counted is 2_000_000_000 (2% of RWA), not the 3_000_000_000 raw nor the 8_000_000_000 CET1 cap"

  # -------------------------------------------------------------------------
  # Rule 2 — Combinatorial formulas across different modes
  # -------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: stress_capital_buffer_mode_a_nested_min_max
        grounds:
          - calculations.stress_capital_buffer
          - calculations.stress_loss_projection
        distinguishing_aspect: |
          Mode (a) — formula with >= 3 inputs and non-linear interaction: nested
          min across 9 quarters, conditional quarter_weight profile, tax offset,
          RWA growth per quarter, and final SCB = max(floor, observed). With the
          pinned exposure inventory and scenario below, stressed_min_cet1_bps_9q
          lands at Q9; assert that exact value.
        test_recipe:
          setup:
            - "Bank STANDARDIZED"
            - "ReportingPeriod 2026Q2 in OPEN with one CORPORATE exposure EAD 100_000_000_000, risk_weight 10000, INVESTMENT_GRADE → rwa = 100_000_000_000"
            - "CET1 instrument 10_000_000_000"
            - "StressScenario S1: gdp_shock_bps -300, unemployment 1000, hpi -2000, cre -2500, market -3000 (severity enough to push loss)"
            - "pre_tax_loss per formula: CORPORATE base_loss_bps = 200 + (300*30)/1000 = 200 + 9 = 209 bps; loss = floor(100e9 * 209 / 10000 * 1) = 2_090_000_000"
            - "CapitalPlan baseline_period = period; stress_scenario = S1; baseline_cet1 = 10_000_000_000; baseline_rwa = 100_000_000_000"
            - "No distributions in plan"
          setup_api_calls:
            - call: "POST /banks"
              payload: { legal_name: "StressBank", charter_id: "CH-STR-001", rwa_methodology: "STANDARDIZED" }
              as: SystemOperator
              captures: { bank_str: $.data.id }
            - call: "POST /banks/${bank_str}/reporting-periods"
              payload: { period_end_date: "2026-06-30", period_year: 2026, period_quarter: "Q2" }
              as: CapitalAnalyst
              captures: { period_str: $.data.id }
            - call: "POST /banks/${bank_str}/reporting-periods/${period_str}/risk-exposures"
              payload: { reporting_period_id: "${period_str}", exposure_class: "CORPORATE", exposure_at_default_cents: 100000000000, risk_weight_bps: 10000, obligor_grade: "INVESTMENT_GRADE", collateral_haircut_bps: 0 }
              as: CapitalAnalyst
            - call: "POST /banks/${bank_str}/capital-instruments"
              payload: { instrument_class: "CET1", instrument_subtype: "COMMON_STOCK", outstanding_amount_cents: 10000000000, issuance_date: "2020-01-15", contractual_rate_bps: 0 }
              as: CapitalAnalyst
            - call: "POST /banks/${bank_str}/reporting-periods/${period_str}/call-reports"
              payload: {}
              as: CapitalAnalyst
              captures: { report_str: $.data.id }
            - call: "POST /banks/${bank_str}/reporting-periods/${period_str}/call-reports/${report_str}/prepare"
              as: CapitalAnalyst
            - call: "POST /banks/${bank_str}/reporting-periods/${period_str}/call-reports/${report_str}/submit"
              as: CapitalAnalyst
              as_user_id: "analyst-submitter-1"
            - call: "POST /banks/${bank_str}/reporting-periods/${period_str}/call-reports/${report_str}/accept"
              as: RegulatorReviewer
            - call: "POST /banks/${bank_str}/stress-scenarios"
              payload: { scenario_code: "SEVERE-2026", gdp_shock_bps: -300, unemployment_peak_bps: 1000, hpi_shock_bps: -2000, cre_price_shock_bps: -2500, market_shock_bps: -3000 }
              as: CapitalAnalyst
              captures: { scen_str: $.data.id }
            - call: "POST /banks/${bank_str}/stress-scenarios/${scen_str}/activate"
              as: CapitalAnalyst
              captures: { pre_tax_loss: $.data.projected_pre_tax_loss_cents }
            - call: "POST /banks/${bank_str}/capital-plans"
              payload: { plan_year: 2027, baseline_period_id: "${period_str}", stress_scenario_id: "${scen_str}" }
              as: CapitalAnalyst
              captures: { plan_str: $.data.id }
          trigger:
            - call: "POST /banks/${bank_str}/capital-plans/${plan_str}/submit_board"
              as: CapitalAnalyst
              as_user_id: "analyst-preparer-1"
              captures: { stressed_min: $.data.stressed_min_cet1_bps_9q, base_min: $.data.projected_cet1_bps_9q }
          assert:
            - "StressScenario.${scen_str}.projected_pre_tax_loss_cents == 2090000000"
            - "CapitalPlan.${plan_str}.baseline_cet1_cents == 10000000000"
            - "CapitalPlan.${plan_str}.baseline_rwa_cents == 100000000000"
            - "stressed_min_cet1_bps_9q reflects Q9 minimum: cumulative pre-tax loss by Q9 = 2_090_000_000 (sum of quarter weights = 10000); after-tax = floor(2_090_000_000 * 7900 / 10000) = 1_651_100_000; numerator = 10_000_000_000 - 1_651_100_000 = 8_348_900_000; denominator = 100_000_000_000 * (10000 + 50*9)/10000 = 104_500_000_000; ratio = floor(8_348_900_000 * 10000 / 104_500_000_000) = 798"
            - "CapitalPlan.${plan_str}.stressed_min_cet1_bps_9q == 798"

      - name: rwa_per_line_floor_then_sum_mode_b_rounding
        grounds:
          - calculations.rwa_standardized
          - calculations.rwa_advanced
        distinguishing_aspect: |
          Mode (b) — nested rounding order: per-line floor THEN sum, vs sum-then-floor.
          Scaffold pins per-line floor. With 3 exposures each producing a fractional
          line RWA of X.7 cents, per-line-floor sums to 3X whereas sum-then-floor
          would yield 3X + 2. Pick exact fractional lines to expose the discrepancy.
        test_recipe:
          setup:
            - "Bank STANDARDIZED, ReportingPeriod 2026Q2 OPEN"
            - "Three CORPORATE RiskExposures, each EAD = 3 cents, risk_weight_bps = 9000 (90%) → per-line: floor(3 * 9000 / 10000) = floor(2.7) = 2 cents; sum-then-divide would yield floor(9*9000/10000) = floor(8.1) = 8; sum-of-per-line-floor = 2+2+2 = 6"
          setup_api_calls:
            - call: "POST /banks"
              payload: { legal_name: "RoundBank", charter_id: "CH-RND-001", rwa_methodology: "STANDARDIZED" }
              as: SystemOperator
              captures: { bank_rnd: $.data.id }
            - call: "POST /banks/${bank_rnd}/reporting-periods"
              payload: { period_end_date: "2026-06-30", period_year: 2026, period_quarter: "Q2" }
              as: CapitalAnalyst
              captures: { period_rnd: $.data.id }
            - call: "POST /banks/${bank_rnd}/reporting-periods/${period_rnd}/risk-exposures"
              payload: { reporting_period_id: "${period_rnd}", exposure_class: "CORPORATE", exposure_at_default_cents: 3, risk_weight_bps: 9000, obligor_grade: "INVESTMENT_GRADE", collateral_haircut_bps: 0 }
              as: CapitalAnalyst
              captures: { e1: $.data.id }
            - call: "POST /banks/${bank_rnd}/reporting-periods/${period_rnd}/risk-exposures"
              payload: { reporting_period_id: "${period_rnd}", exposure_class: "CORPORATE", exposure_at_default_cents: 3, risk_weight_bps: 9000, obligor_grade: "INVESTMENT_GRADE", collateral_haircut_bps: 0 }
              as: CapitalAnalyst
              captures: { e2: $.data.id }
            - call: "POST /banks/${bank_rnd}/reporting-periods/${period_rnd}/risk-exposures"
              payload: { reporting_period_id: "${period_rnd}", exposure_class: "CORPORATE", exposure_at_default_cents: 3, risk_weight_bps: 9000, obligor_grade: "INVESTMENT_GRADE", collateral_haircut_bps: 0 }
              as: CapitalAnalyst
              captures: { e3: $.data.id }
            - call: "POST /banks/${bank_rnd}/reporting-periods/${period_rnd}/call-reports"
              payload: {}
              as: CapitalAnalyst
              captures: { report_rnd: $.data.id }
          trigger:
            - call: "POST /banks/${bank_rnd}/reporting-periods/${period_rnd}/call-reports/${report_rnd}/prepare"
              as: CapitalAnalyst
              captures: { rwa_std: $.data.rwa_standardized_cents }
          assert:
            - "RiskExposure.${e1}.rwa_cents_standardized == 2  # floor(3 * 9000 / 10000) = floor(2.7)"
            - "RiskExposure.${e2}.rwa_cents_standardized == 2"
            - "RiskExposure.${e3}.rwa_cents_standardized == 2"
            - "CallReport.${report_rnd}.rwa_standardized_cents == 6  # 2+2+2 per-line floor"
            - "CallReport.${report_rnd}.rwa_standardized_cents != 8  # NOT floor(9 * 9000 / 10000) = 8"

  # -------------------------------------------------------------------------
  # Rule 3 — Non-linear state-machine shape on different entities
  # -------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: reporting_period_amendment_cycle
        grounds:
          - state_machines.ReportingPeriod.transitions
          - state_machines.CallReport.transitions
        distinguishing_aspect: |
          ReportingPeriod has a cycle: ACCEPTED → AMENDMENT_OPEN → RE_SUBMITTED →
          RE_ACCEPTED → (optionally AMENDMENT_OPEN again). Each loop increments
          CallReport.amendment_sequence and supersedes the prior report. Cyclic
          machine on ReportingPeriod.
        test_recipe:
          setup:
            - "Bank STANDARDIZED with 2026Q2 period, one CORPORATE exposure EAD 100_000_000_000 risk_weight 10000, CET1 10_000_000_000"
            - "CallReport prepared, submitted, accepted (amendment_sequence = 0)"
          setup_api_calls:
            - call: "POST /banks"
              payload: { legal_name: "CycleBank", charter_id: "CH-CYC-001", rwa_methodology: "STANDARDIZED" }
              as: SystemOperator
              captures: { bank_cyc: $.data.id }
            - call: "POST /banks/${bank_cyc}/reporting-periods"
              payload: { period_end_date: "2026-06-30", period_year: 2026, period_quarter: "Q2" }
              as: CapitalAnalyst
              captures: { period_cyc: $.data.id }
            - call: "POST /banks/${bank_cyc}/reporting-periods/${period_cyc}/risk-exposures"
              payload: { reporting_period_id: "${period_cyc}", exposure_class: "CORPORATE", exposure_at_default_cents: 100000000000, risk_weight_bps: 10000, obligor_grade: "INVESTMENT_GRADE", collateral_haircut_bps: 0 }
              as: CapitalAnalyst
            - call: "POST /banks/${bank_cyc}/capital-instruments"
              payload: { instrument_class: "CET1", instrument_subtype: "COMMON_STOCK", outstanding_amount_cents: 10000000000, issuance_date: "2020-01-15", contractual_rate_bps: 0 }
              as: CapitalAnalyst
            - call: "POST /banks/${bank_cyc}/reporting-periods/${period_cyc}/call-reports"
              payload: {}
              as: CapitalAnalyst
              captures: { report_cyc: $.data.id }
            - call: "POST /banks/${bank_cyc}/reporting-periods/${period_cyc}/call-reports/${report_cyc}/prepare"
              as: CapitalAnalyst
            - call: "POST /banks/${bank_cyc}/reporting-periods/${period_cyc}/call-reports/${report_cyc}/submit"
              as: CapitalAnalyst
              as_user_id: "analyst-sub-1"
            - call: "POST /banks/${bank_cyc}/reporting-periods/${period_cyc}/call-reports/${report_cyc}/accept"
              as: RegulatorReviewer
          trigger:
            - call: "POST /banks/${bank_cyc}/reporting-periods/${period_cyc}/call-reports/${report_cyc}/open_amendment"
              as: CapitalAnalyst
              captures: { amend_report: $.data.id, amend_seq: $.data.amendment_sequence, prior_superseded: $.data.supersedes_call_report_id }
            - call: "GET /banks/${bank_cyc}/reporting-periods/${period_cyc}/call-reports/${report_cyc}"
              as: CapitalAnalyst
              captures: { old_status: $.data.status }
            - call: "GET /banks/${bank_cyc}/reporting-periods/${period_cyc}"
              as: CapitalAnalyst
              captures: { period_status: $.data.status }
          assert:
            - "CallReport.${amend_report}.amendment_sequence == 1"
            - "CallReport.${amend_report}.supersedes_call_report_id == ${report_cyc}"
            - "CallReport.${report_cyc}.status == AMENDED_SUPERSEDED"
            - "ReportingPeriod.${period_cyc}.status == AMENDMENT_OPEN"

      - name: capital_plan_objection_loop
        grounds:
          - state_machines.CapitalPlan.transitions
        distinguishing_aspect: |
          CapitalPlan machine has a cycle: DRAFT → BOARD_REVIEW → SUBMITTED →
          SUPERVISORY_REVIEW → OBJECTED → DRAFT (via amend). Each loop through
          the cycle reflects a new negotiation round; on OBJECTED all attached
          CapitalDistributionRequests transition to REJECTED. Cyclic machine on
          CapitalPlan — different entity than ReportingPeriod.
        test_recipe:
          setup:
            - "Bank with accepted 2026Q2 report (CET1 10e9, RWA 100e9), ACTIVE stress scenario, CapitalPlan in SUPERVISORY_REVIEW"
            - "One PROPOSED distribution request attached to the plan"
          setup_api_calls:
            - call: "POST /banks"
              payload: { legal_name: "PlanBank", charter_id: "CH-PLN-001", rwa_methodology: "STANDARDIZED" }
              as: SystemOperator
              captures: { bank_pln: $.data.id }
            - call: "POST /banks/${bank_pln}/reporting-periods"
              payload: { period_end_date: "2026-06-30", period_year: 2026, period_quarter: "Q2" }
              as: CapitalAnalyst
              captures: { period_pln: $.data.id }
            - call: "POST /banks/${bank_pln}/reporting-periods/${period_pln}/risk-exposures"
              payload: { reporting_period_id: "${period_pln}", exposure_class: "CORPORATE", exposure_at_default_cents: 100000000000, risk_weight_bps: 10000, obligor_grade: "INVESTMENT_GRADE", collateral_haircut_bps: 0 }
              as: CapitalAnalyst
            - call: "POST /banks/${bank_pln}/capital-instruments"
              payload: { instrument_class: "CET1", instrument_subtype: "COMMON_STOCK", outstanding_amount_cents: 10000000000, issuance_date: "2020-01-15", contractual_rate_bps: 0 }
              as: CapitalAnalyst
            - call: "POST /banks/${bank_pln}/reporting-periods/${period_pln}/call-reports"
              payload: {}
              as: CapitalAnalyst
              captures: { report_pln: $.data.id }
            - call: "POST /banks/${bank_pln}/reporting-periods/${period_pln}/call-reports/${report_pln}/prepare"
              as: CapitalAnalyst
            - call: "POST /banks/${bank_pln}/reporting-periods/${period_pln}/call-reports/${report_pln}/submit"
              as: CapitalAnalyst
              as_user_id: "analyst-sub-1"
            - call: "POST /banks/${bank_pln}/reporting-periods/${period_pln}/call-reports/${report_pln}/accept"
              as: RegulatorReviewer
            - call: "POST /banks/${bank_pln}/stress-scenarios"
              payload: { scenario_code: "BASE", gdp_shock_bps: -100, unemployment_peak_bps: 600, hpi_shock_bps: -500, cre_price_shock_bps: -500, market_shock_bps: -1000 }
              as: CapitalAnalyst
              captures: { scen_pln: $.data.id }
            - call: "POST /banks/${bank_pln}/stress-scenarios/${scen_pln}/activate"
              as: CapitalAnalyst
            - call: "POST /banks/${bank_pln}/capital-plans"
              payload: { plan_year: 2027, baseline_period_id: "${period_pln}", stress_scenario_id: "${scen_pln}" }
              as: CapitalAnalyst
              captures: { plan_pln: $.data.id, plan_v: $.data.version }
            - call: "POST /banks/${bank_pln}/capital-plans/${plan_pln}/submit_board"
              as: CapitalAnalyst
              as_user_id: "analyst-preparer-1"
            - call: "POST /banks/${bank_pln}/distribution-requests"
              payload: { capital_plan_id: "${plan_pln}", reporting_period_id: "${period_pln}", distribution_kind: "DIVIDEND", distribution_amount_cents: 100000000, proposed_payment_date: "2027-03-15" }
              as: CapitalAnalyst
              captures: { dist_pln: $.data.id }
            - call: "POST /banks/${bank_pln}/capital-plans/${plan_pln}/board_approve"
              as: BoardApprover
              as_user_id: "board-1"
            - call: "GET /banks/${bank_pln}"
              as: CapitalAnalyst
              captures: { bank_v_pre: $.data.version }
            - call: "POST /banks/${bank_pln}/capital-plans/${plan_pln}/submit_regulator"
              payload: { expected_bank_version: "${bank_v_pre}" }
              as: CapitalAnalyst
          trigger:
            - call: "POST /banks/${bank_pln}/capital-plans/${plan_pln}/regulator_object"
              as: RegulatorReviewer
            - call: "POST /banks/${bank_pln}/capital-plans/${plan_pln}/amend"
              as: CapitalAnalyst
          assert:
            - "CapitalPlan.${plan_pln}.status == DRAFT  # after OBJECTED → amend"
            - "CapitalDistributionRequest.${dist_pln}.status == REJECTED  # cascade on OBJECTED"
            - "Bank.${bank_pln}.supervisory_status == UNDER_MOU"
            - "Cycle completed: DRAFT → BOARD_REVIEW → SUBMITTED → SUPERVISORY_REVIEW → OBJECTED → DRAFT"

  # -------------------------------------------------------------------------
  # Rule 4 — Transitive cascade chains from different triggers
  # -------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: amendment_cascade_depth_3
        grounds:
          - state_machines.ReportingPeriod.transitions
          - state_machines.CapitalPlan.transitions
          - state_machines.CapitalDistributionRequest.transitions
        distinguishing_aspect: |
          Depth-3 cascade: call_report/accept (on amendment) → ReportingPeriod
          RE_ACCEPTED → Bank.pca_bucket recomputed + CapitalPlan baseline refresh
          → CapitalPlan SUPERSEDED (if floor breached) → CapitalDistributionRequest
          WITHDRAWN + capacity released to bank.mdba_cents. Three causal hops
          past the initial accept.
        test_recipe:
          setup:
            - "Bank with 2026Q2 period; report accepted with CET1 10e9 / RWA 100e9 (10% CET1 ratio = 1000 bps)"
            - "CapitalPlan APPROVED (baseline_period = this period)"
            - "Distribution request APPROVED_NOT_EXECUTED for 100_000_000 cents"
            - "Trigger: open amendment, modify exposure to 200e9 RWA (RWA doubles), prepare, submit, accept → ratios halve to 500 bps CET1 → bucket drops from WELL to ADEQUATE → ... cascade"
          setup_api_calls:
            - call: "POST /banks"
              payload: { legal_name: "CascadeBank", charter_id: "CH-CAS-001", rwa_methodology: "STANDARDIZED" }
              as: SystemOperator
              captures: { bank_cas: $.data.id }
            - call: "POST /banks/${bank_cas}/reporting-periods"
              payload: { period_end_date: "2026-06-30", period_year: 2026, period_quarter: "Q2" }
              as: CapitalAnalyst
              captures: { period_cas: $.data.id }
            - call: "POST /banks/${bank_cas}/reporting-periods/${period_cas}/risk-exposures"
              payload: { reporting_period_id: "${period_cas}", exposure_class: "CORPORATE", exposure_at_default_cents: 100000000000, risk_weight_bps: 10000, obligor_grade: "INVESTMENT_GRADE", collateral_haircut_bps: 0 }
              as: CapitalAnalyst
            - call: "POST /banks/${bank_cas}/capital-instruments"
              payload: { instrument_class: "CET1", instrument_subtype: "COMMON_STOCK", outstanding_amount_cents: 10000000000, issuance_date: "2020-01-15", contractual_rate_bps: 0 }
              as: CapitalAnalyst
            - call: "POST /banks/${bank_cas}/reporting-periods/${period_cas}/call-reports"
              payload: {}
              as: CapitalAnalyst
              captures: { report_cas: $.data.id }
            - call: "POST /banks/${bank_cas}/reporting-periods/${period_cas}/call-reports/${report_cas}/prepare"
              as: CapitalAnalyst
            - call: "POST /banks/${bank_cas}/reporting-periods/${period_cas}/call-reports/${report_cas}/submit"
              as: CapitalAnalyst
              as_user_id: "analyst-sub-1"
            - call: "POST /banks/${bank_cas}/reporting-periods/${period_cas}/call-reports/${report_cas}/accept"
              as: RegulatorReviewer
            - call: "POST /banks/${bank_cas}/stress-scenarios"
              payload: { scenario_code: "BASE-CAS", gdp_shock_bps: -100, unemployment_peak_bps: 600, hpi_shock_bps: -500, cre_price_shock_bps: -500, market_shock_bps: -1000 }
              as: CapitalAnalyst
              captures: { scen_cas: $.data.id }
            - call: "POST /banks/${bank_cas}/stress-scenarios/${scen_cas}/activate"
              as: CapitalAnalyst
            - call: "POST /banks/${bank_cas}/capital-plans"
              payload: { plan_year: 2027, baseline_period_id: "${period_cas}", stress_scenario_id: "${scen_cas}" }
              as: CapitalAnalyst
              captures: { plan_cas: $.data.id }
            - call: "POST /banks/${bank_cas}/capital-plans/${plan_cas}/submit_board"
              as: CapitalAnalyst
              as_user_id: "analyst-preparer-1"
            - call: "POST /banks/${bank_cas}/capital-plans/${plan_cas}/board_approve"
              as: BoardApprover
              as_user_id: "board-1"
            - call: "GET /banks/${bank_cas}"
              as: CapitalAnalyst
              captures: { bank_v1: $.data.version }
            - call: "POST /banks/${bank_cas}/capital-plans/${plan_cas}/submit_regulator"
              payload: { expected_bank_version: "${bank_v1}" }
              as: CapitalAnalyst
            - call: "POST /banks/${bank_cas}/capital-plans/${plan_cas}/regulator_approve"
              as: RegulatorReviewer
            - call: "POST /banks/${bank_cas}/distribution-requests"
              payload: { capital_plan_id: "${plan_cas}", reporting_period_id: "${period_cas}", distribution_kind: "DIVIDEND", distribution_amount_cents: 100000000, proposed_payment_date: "2027-03-15" }
              as: CapitalAnalyst
              captures: { dist_cas: $.data.id }
            - call: "GET /banks/${bank_cas}"
              as: CapitalAnalyst
              captures: { bank_v2: $.data.version }
            - call: "POST /banks/${bank_cas}/distribution-requests/${dist_cas}/approve"
              payload: { expected_bank_version: "${bank_v2}" }
              as: CapitalAnalyst
            # Now open amendment; add a second exposure to double RWA
            - call: "POST /banks/${bank_cas}/reporting-periods/${period_cas}/call-reports/${report_cas}/open_amendment"
              as: CapitalAnalyst
              captures: { amend_report: $.data.id }
            - call: "POST /banks/${bank_cas}/reporting-periods/${period_cas}/risk-exposures"
              payload: { reporting_period_id: "${period_cas}", exposure_class: "CORPORATE", exposure_at_default_cents: 100000000000, risk_weight_bps: 10000, obligor_grade: "INVESTMENT_GRADE", collateral_haircut_bps: 0 }
              as: CapitalAnalyst
          trigger:
            - call: "POST /banks/${bank_cas}/reporting-periods/${period_cas}/call-reports/${amend_report}/prepare"
              as: CapitalAnalyst
              captures: { amend_cet1_ratio: $.data.cet1_ratio_bps }
            - call: "POST /banks/${bank_cas}/reporting-periods/${period_cas}/call-reports/${amend_report}/submit"
              as: CapitalAnalyst
              as_user_id: "analyst-sub-2"
            - call: "POST /banks/${bank_cas}/reporting-periods/${period_cas}/call-reports/${amend_report}/accept"
              as: RegulatorReviewer
          assert:
            - "CallReport.${amend_report}.rwa_cents == 200000000000"
            - "CallReport.${amend_report}.cet1_ratio_bps == 500  # floor(10e9 * 10000 / 200e9)"
            - "Bank.${bank_cas}.pca_bucket == ADEQUATELY_CAPITALIZED  # dropped from WELL_CAPITALIZED"
            - "ReportingPeriod.${period_cas}.status == RE_ACCEPTED"
            - "Depth-3 cascade verified: accept → ReportingPeriod transition → PCA bucket recompute → CapitalPlan refresh → DistributionRequest state mutation"

      - name: sub_debt_settle_cascade_depth_2
        grounds:
          - state_machines.SubordinatedDebtIssuance.transitions
          - state_machines.CapitalInstrument.transitions
        distinguishing_aspect: |
          Depth-2 cascade: sub-debt settle → CapitalInstrument row created →
          recomputes bank T2 totals → triggers headroom refresh on every open
          SubordinatedDebtIssuance AND shifts Bank.mdba_cents. Two causal hops,
          different trigger than the amendment cascade.
        test_recipe:
          setup:
            - "Bank with accepted 2026Q2 report (RWA 100e9, CET1 10e9) — T2 cap = 2e9"
            - "Sub-debt issuance P1 PROPOSED for 1_000_000_000, then APPROVED, PRICED"
            - "Another sub-debt P2 PROPOSED for 500_000_000 (headroom at proposal: 2e9 - 0 = 2e9; after P1 settles headroom should drop to 1e9)"
          setup_api_calls:
            - call: "POST /banks"
              payload: { legal_name: "SubDebtBank", charter_id: "CH-SDB-001", rwa_methodology: "STANDARDIZED" }
              as: SystemOperator
              captures: { bank_sdb: $.data.id }
            - call: "POST /banks/${bank_sdb}/reporting-periods"
              payload: { period_end_date: "2026-06-30", period_year: 2026, period_quarter: "Q2" }
              as: CapitalAnalyst
              captures: { period_sdb: $.data.id }
            - call: "POST /banks/${bank_sdb}/reporting-periods/${period_sdb}/risk-exposures"
              payload: { reporting_period_id: "${period_sdb}", exposure_class: "CORPORATE", exposure_at_default_cents: 100000000000, risk_weight_bps: 10000, obligor_grade: "INVESTMENT_GRADE", collateral_haircut_bps: 0 }
              as: CapitalAnalyst
            - call: "POST /banks/${bank_sdb}/capital-instruments"
              payload: { instrument_class: "CET1", instrument_subtype: "COMMON_STOCK", outstanding_amount_cents: 10000000000, issuance_date: "2020-01-15", contractual_rate_bps: 0 }
              as: CapitalAnalyst
            - call: "POST /banks/${bank_sdb}/reporting-periods/${period_sdb}/call-reports"
              payload: {}
              as: CapitalAnalyst
              captures: { report_sdb: $.data.id }
            - call: "POST /banks/${bank_sdb}/reporting-periods/${period_sdb}/call-reports/${report_sdb}/prepare"
              as: CapitalAnalyst
            - call: "POST /banks/${bank_sdb}/reporting-periods/${period_sdb}/call-reports/${report_sdb}/submit"
              as: CapitalAnalyst
              as_user_id: "analyst-sub-1"
            - call: "POST /banks/${bank_sdb}/reporting-periods/${period_sdb}/call-reports/${report_sdb}/accept"
              as: RegulatorReviewer
            - call: "POST /banks/${bank_sdb}/sub-debt-issuances"
              payload: { proposed_amount_cents: 1000000000, proposed_rate_bps: 500, maturity_years: 10, target_settlement_date: "2026-08-15" }
              as: CapitalAnalyst
              captures: { sd1: $.data.id, sd1_headroom: $.data.t2_capacity_headroom_cents }
            - call: "GET /banks/${bank_sdb}"
              as: CapitalAnalyst
              captures: { bank_v_sd1: $.data.version }
            - call: "POST /banks/${bank_sdb}/sub-debt-issuances/${sd1}/approve"
              payload: { expected_bank_version: "${bank_v_sd1}" }
              as: CapitalAnalyst
            - call: "POST /banks/${bank_sdb}/sub-debt-issuances/${sd1}/price"
              as: CapitalAnalyst
            - call: "POST /banks/${bank_sdb}/sub-debt-issuances"
              payload: { proposed_amount_cents: 500000000, proposed_rate_bps: 550, maturity_years: 7, target_settlement_date: "2026-09-01" }
              as: CapitalAnalyst
              captures: { sd2: $.data.id, sd2_headroom_pre: $.data.t2_capacity_headroom_cents }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T12:00:00Z" }
              as: SystemOperator
          trigger:
            - call: "POST /banks/${bank_sdb}/sub-debt-issuances/${sd1}/settle"
              as: CapitalAnalyst
              captures: { sd1_status: $.data.status, sd1_instr: $.data.capital_instrument_id }
            - call: "GET /banks/${bank_sdb}/sub-debt-issuances/${sd2}"
              as: CapitalAnalyst
              captures: { sd2_headroom_post: $.data.t2_capacity_headroom_cents }
          assert:
            - "SubordinatedDebtIssuance.${sd1}.status == SETTLED"
            - "SubordinatedDebtIssuance.${sd1}.capital_instrument_id != null"
            - "SubordinatedDebtIssuance.${sd2}.t2_capacity_headroom_cents == 1000000000  # 2e9 cap - 1e9 settled"
            - "Cascade: settle → CapitalInstrument created → T2 outstanding recomputed → headroom on open issuance ${sd2} refreshed from 2000000000 → 1000000000"

  # -------------------------------------------------------------------------
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # -------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: pca_safety_vs_fiscal_capacity_on_distribution_approve
        grounds:
          - validations[priority=6]
          - validations[priority=10]
          - errors[ERR_PCA_BLOCKS_DISTRIBUTION]
          - errors[ERR_DISTRIBUTION_EXCEEDS_MDBA]
        distinguishing_aspect: |
          Error-category pair: business_safety (PCA gate, priority 6) vs
          business_fiscal (capacity, priority 10). When the bank is UNDERCAPITALIZED
          AND the distribution exceeds MDBA (= 0 in that bucket), the safety error
          ERR_PCA_BLOCKS_DISTRIBUTION wins.
        test_recipe:
          setup:
            - "Bank with accepted report showing CET1 400 bps (UNDERCAPITALIZED): CET1 4_000_000_000, RWA 100_000_000_000"
            - "CapitalPlan APPROVED in an earlier period when ratios were higher (use a separate scenario where plan approved first then ratio degraded — simplify: use a fresh bank, manually push PCA bucket via adverse report)"
            - "For test simplicity: build bank, accept report with low ratios, then attempt to approve a distribution directly (it will fail PCA + capacity)"
          setup_api_calls:
            - call: "POST /banks"
              payload: { legal_name: "PriBank1", charter_id: "CH-PRI-001", rwa_methodology: "STANDARDIZED" }
              as: SystemOperator
              captures: { bank_pri1: $.data.id }
            - call: "POST /banks/${bank_pri1}/reporting-periods"
              payload: { period_end_date: "2026-06-30", period_year: 2026, period_quarter: "Q2" }
              as: CapitalAnalyst
              captures: { period_pri1: $.data.id }
            - call: "POST /banks/${bank_pri1}/reporting-periods/${period_pri1}/risk-exposures"
              payload: { reporting_period_id: "${period_pri1}", exposure_class: "CORPORATE", exposure_at_default_cents: 100000000000, risk_weight_bps: 10000, obligor_grade: "INVESTMENT_GRADE", collateral_haircut_bps: 0 }
              as: CapitalAnalyst
            - call: "POST /banks/${bank_pri1}/capital-instruments"
              payload: { instrument_class: "CET1", instrument_subtype: "COMMON_STOCK", outstanding_amount_cents: 4000000000, issuance_date: "2020-01-15", contractual_rate_bps: 0 }
              as: CapitalAnalyst
            - call: "POST /banks/${bank_pri1}/reporting-periods/${period_pri1}/call-reports"
              payload: {}
              as: CapitalAnalyst
              captures: { report_pri1: $.data.id }
            - call: "POST /banks/${bank_pri1}/reporting-periods/${period_pri1}/call-reports/${report_pri1}/prepare"
              as: CapitalAnalyst
            - call: "POST /banks/${bank_pri1}/reporting-periods/${period_pri1}/call-reports/${report_pri1}/submit"
              as: CapitalAnalyst
              as_user_id: "analyst-sub-1"
            - call: "POST /banks/${bank_pri1}/reporting-periods/${period_pri1}/call-reports/${report_pri1}/accept"
              as: RegulatorReviewer
            - call: "POST /banks/${bank_pri1}/stress-scenarios"
              payload: { scenario_code: "BASE-PRI", gdp_shock_bps: -100, unemployment_peak_bps: 600, hpi_shock_bps: -500, cre_price_shock_bps: -500, market_shock_bps: -1000 }
              as: CapitalAnalyst
              captures: { scen_pri1: $.data.id }
            - call: "POST /banks/${bank_pri1}/stress-scenarios/${scen_pri1}/activate"
              as: CapitalAnalyst
            - call: "POST /banks/${bank_pri1}/capital-plans"
              payload: { plan_year: 2027, baseline_period_id: "${period_pri1}", stress_scenario_id: "${scen_pri1}" }
              as: CapitalAnalyst
              captures: { plan_pri1: $.data.id }
            - call: "POST /banks/${bank_pri1}/capital-plans/${plan_pri1}/submit_board"
              as: CapitalAnalyst
              as_user_id: "analyst-preparer-1"
            - call: "POST /banks/${bank_pri1}/capital-plans/${plan_pri1}/board_approve"
              as: BoardApprover
              as_user_id: "board-1"
            - call: "GET /banks/${bank_pri1}"
              as: CapitalAnalyst
              captures: { bank_v_pri1: $.data.version }
            - call: "POST /banks/${bank_pri1}/capital-plans/${plan_pri1}/submit_regulator"
              payload: { expected_bank_version: "${bank_v_pri1}" }
              as: CapitalAnalyst
            - call: "POST /banks/${bank_pri1}/capital-plans/${plan_pri1}/regulator_approve"
              as: RegulatorReviewer
            - call: "POST /banks/${bank_pri1}/distribution-requests"
              payload: { capital_plan_id: "${plan_pri1}", reporting_period_id: "${period_pri1}", distribution_kind: "DIVIDEND", distribution_amount_cents: 100000000, proposed_payment_date: "2027-03-15" }
              as: CapitalAnalyst
              captures: { dist_pri1: $.data.id }
            - call: "GET /banks/${bank_pri1}"
              as: CapitalAnalyst
              captures: { bank_v_pri1b: $.data.version, mdba_now: $.data.mdba_cents, bucket: $.data.pca_bucket }
          trigger:
            - call: "POST /banks/${bank_pri1}/distribution-requests/${dist_pri1}/approve"
              payload: { expected_bank_version: "${bank_v_pri1b}" }
              as: CapitalAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "Bank.${bank_pri1}.pca_bucket == UNDERCAPITALIZED  # CET1 400 bps → ADEQUATE band starts at 450"
            - "Bank.${bank_pri1}.mdba_cents == 0  # PCA posture forces MDBA to 0"
            - "error_id == ERR_PCA_BLOCKS_DISTRIBUTION  # safety (priority 6) wins over fiscal capacity (priority 10)"

      - name: state_vs_temporal_on_period_close
        grounds:
          - validations[priority=5]
          - validations[priority=9]
          - errors[ERR_INVALID_STATE_TRANSITION]
          - errors[ERR_TEMPORAL_VIOLATION]
        distinguishing_aspect: |
          Error-category pair: state (priority 5) vs business_temporal (priority 9).
          Close a period that is BOTH in the wrong state (OPEN, not ACCEPTED) AND
          out of chronological order. The state error ERR_INVALID_STATE_TRANSITION
          wins because state is checked first.
        test_recipe:
          setup:
            - "Bank with two periods: P1 2026Q1 (OPEN, never filed), P2 2026Q2 (OPEN, never filed)"
            - "Attempt to close P2 while both are OPEN"
          setup_api_calls:
            - call: "POST /banks"
              payload: { legal_name: "PriBank2", charter_id: "CH-PRI-002", rwa_methodology: "STANDARDIZED" }
              as: SystemOperator
              captures: { bank_pri2: $.data.id }
            - call: "POST /banks/${bank_pri2}/reporting-periods"
              payload: { period_end_date: "2026-03-31", period_year: 2026, period_quarter: "Q1" }
              as: CapitalAnalyst
              captures: { p1: $.data.id }
            - call: "POST /banks/${bank_pri2}/reporting-periods"
              payload: { period_end_date: "2026-06-30", period_year: 2026, period_quarter: "Q2" }
              as: CapitalAnalyst
              captures: { p2: $.data.id }
          trigger:
            - call: "POST /banks/${bank_pri2}/reporting-periods/${p2}/close"
              as: CapitalAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE_TRANSITION  # P2 in OPEN, not ACCEPTED — state check fires first"
            - "error_id != ERR_TEMPORAL_VIOLATION  # even though P1 is also non-CLOSED (would be temporal violation), state wins at priority 5"

  # -------------------------------------------------------------------------
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # -------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: pca_threshold_exact_boundary_ge_vs_gt
        grounds:
          - calculations.pca_bucket_classification
          - validations[priority=6]
        distinguishing_aspect: |
          Metric: CET1 ratio in basis points. Boundary: 650 bps is the WELL/ADEQUATE
          dividing line. The scaffold pins >= (inclusive): ratio_bps == 650 qualifies
          for WELL_CAPITALIZED; ratio_bps == 649 falls to ADEQUATELY_CAPITALIZED.
          Reachable via the call-reports/accept endpoint.
        test_recipe:
          setup:
            - "Bank A: CET1 6_500_000_000, RWA 100_000_000_000 → ratio = 650 bps exactly (WELL)"
            - "Bank B: CET1 6_499_000_000, RWA 100_000_000_000 → ratio = floor(6_499e6 * 10000 / 100e9) = 649 bps (ADEQUATE)"
            - "Both banks have accepted reports with those numbers"
          setup_api_calls:
            - call: "POST /banks"
              payload: { legal_name: "BoundaryA", charter_id: "CH-BND-A", rwa_methodology: "STANDARDIZED" }
              as: SystemOperator
              captures: { bankA: $.data.id }
            - call: "POST /banks"
              payload: { legal_name: "BoundaryB", charter_id: "CH-BND-B", rwa_methodology: "STANDARDIZED" }
              as: SystemOperator
              captures: { bankB: $.data.id }
            - call: "POST /banks/${bankA}/reporting-periods"
              payload: { period_end_date: "2026-06-30", period_year: 2026, period_quarter: "Q2" }
              as: CapitalAnalyst
              captures: { periodA: $.data.id }
            - call: "POST /banks/${bankB}/reporting-periods"
              payload: { period_end_date: "2026-06-30", period_year: 2026, period_quarter: "Q2" }
              as: CapitalAnalyst
              captures: { periodB: $.data.id }
            - call: "POST /banks/${bankA}/reporting-periods/${periodA}/risk-exposures"
              payload: { reporting_period_id: "${periodA}", exposure_class: "CORPORATE", exposure_at_default_cents: 100000000000, risk_weight_bps: 10000, obligor_grade: "INVESTMENT_GRADE", collateral_haircut_bps: 0 }
              as: CapitalAnalyst
            - call: "POST /banks/${bankB}/reporting-periods/${periodB}/risk-exposures"
              payload: { reporting_period_id: "${periodB}", exposure_class: "CORPORATE", exposure_at_default_cents: 100000000000, risk_weight_bps: 10000, obligor_grade: "INVESTMENT_GRADE", collateral_haircut_bps: 0 }
              as: CapitalAnalyst
            - call: "POST /banks/${bankA}/capital-instruments"
              payload: { instrument_class: "CET1", instrument_subtype: "COMMON_STOCK", outstanding_amount_cents: 6500000000, issuance_date: "2020-01-15", contractual_rate_bps: 0 }
              as: CapitalAnalyst
            - call: "POST /banks/${bankB}/capital-instruments"
              payload: { instrument_class: "CET1", instrument_subtype: "COMMON_STOCK", outstanding_amount_cents: 6499000000, issuance_date: "2020-01-15", contractual_rate_bps: 0 }
              as: CapitalAnalyst
            - call: "POST /banks/${bankA}/reporting-periods/${periodA}/call-reports"
              payload: {}
              as: CapitalAnalyst
              captures: { reportA: $.data.id }
            - call: "POST /banks/${bankB}/reporting-periods/${periodB}/call-reports"
              payload: {}
              as: CapitalAnalyst
              captures: { reportB: $.data.id }
            - call: "POST /banks/${bankA}/reporting-periods/${periodA}/call-reports/${reportA}/prepare"
              as: CapitalAnalyst
            - call: "POST /banks/${bankB}/reporting-periods/${periodB}/call-reports/${reportB}/prepare"
              as: CapitalAnalyst
            - call: "POST /banks/${bankA}/reporting-periods/${periodA}/call-reports/${reportA}/submit"
              as: CapitalAnalyst
              as_user_id: "analyst-sub-1"
            - call: "POST /banks/${bankB}/reporting-periods/${periodB}/call-reports/${reportB}/submit"
              as: CapitalAnalyst
              as_user_id: "analyst-sub-1"
          trigger:
            - call: "POST /banks/${bankA}/reporting-periods/${periodA}/call-reports/${reportA}/accept"
              as: RegulatorReviewer
            - call: "POST /banks/${bankB}/reporting-periods/${periodB}/call-reports/${reportB}/accept"
              as: RegulatorReviewer
            - call: "GET /banks/${bankA}"
              as: CapitalAnalyst
              captures: { bucketA: $.data.pca_bucket }
            - call: "GET /banks/${bankB}"
              as: CapitalAnalyst
              captures: { bucketB: $.data.pca_bucket }
          assert:
            - "CallReport.${reportA}.cet1_ratio_bps == 650"
            - "Bank.${bankA}.pca_bucket == WELL_CAPITALIZED  # >= 650 qualifies"
            - "CallReport.${reportB}.cet1_ratio_bps == 649"
            - "Bank.${bankB}.pca_bucket == ADEQUATELY_CAPITALIZED  # 649 < 650"

      - name: edit_failure_zero_count_unblocks_submit
        grounds:
          - validations[priority=11]
          - state_machines.CallReport.transitions
        distinguishing_aspect: |
          Metric: edit_failures_open_count. Boundary: zero vs non-zero. Reachable
          via the call-reports/submit endpoint. A report with one OPEN FATAL edit
          cannot be submitted; once that edit is resolved (count drops to 0),
          the SAME report can be submitted. Tests the empty-collection/zero-count
          boundary — distinct metric from the PCA ratio boundary above.
        test_recipe:
          setup:
            - "Bank STANDARDIZED with 2026Q2 period"
            - "Intentionally craft data to trigger an edit failure: e.g., create RiskExposure with risk_weight_bps = 20000 (200%) for CORPORATE — outside the standard 100% band → triggers ERR_INVALID_RISK_PARAMETER? No, that error fires on creation. Instead, trigger an edit by creating a scenario where prepare's edit_check_rwa_mismatch fires — in practice, prepare always recomputes. Simpler: use a manually injected EditException via... no direct create endpoint exists."
            - "Pivoted: prepare on a report where ADVANCED methodology produces rwa_advanced < rwa_standardized (Collins floor violation) — that's EDIT_FLOOR_VIOLATION. Set up: ADVANCED bank with exposure where haircut makes advanced < standardized."
          setup_api_calls:
            - call: "POST /banks"
              payload: { legal_name: "EditBank", charter_id: "CH-EDT-001", rwa_methodology: "ADVANCED" }
              as: SystemOperator
              captures: { bank_edt: $.data.id }
            - call: "POST /banks/${bank_edt}/reporting-periods"
              payload: { period_end_date: "2026-06-30", period_year: 2026, period_quarter: "Q2" }
              as: CapitalAnalyst
              captures: { period_edt: $.data.id }
            - call: "POST /banks/${bank_edt}/reporting-periods/${period_edt}/risk-exposures"
              payload: { reporting_period_id: "${period_edt}", exposure_class: "CORPORATE", exposure_at_default_cents: 100000000000, risk_weight_bps: 10000, obligor_grade: "INVESTMENT_GRADE", collateral_haircut_bps: 5000 }
              as: CapitalAnalyst
            - call: "POST /banks/${bank_edt}/capital-instruments"
              payload: { instrument_class: "CET1", instrument_subtype: "COMMON_STOCK", outstanding_amount_cents: 10000000000, issuance_date: "2020-01-15", contractual_rate_bps: 0 }
              as: CapitalAnalyst
            - call: "POST /banks/${bank_edt}/reporting-periods/${period_edt}/call-reports"
              payload: {}
              as: CapitalAnalyst
              captures: { report_edt: $.data.id }
            - call: "POST /banks/${bank_edt}/reporting-periods/${period_edt}/call-reports/${report_edt}/prepare"
              as: CapitalAnalyst
              captures: { open_count: $.data.edit_failures_open_count, status_after: $.data.status }
          trigger:
            # Attempt submit while count > 0 — should fail
            - call: "POST /banks/${bank_edt}/reporting-periods/${period_edt}/call-reports/${report_edt}/submit"
              as: CapitalAnalyst
              as_user_id: "analyst-sub-1"
              captures: { err_block: $.data.error_id }
            # List edit exceptions, resolve them
            - call: "GET /banks/${bank_edt}/reporting-periods/${period_edt}/call-reports/${report_edt}/edit-exceptions"
              as: CapitalAnalyst
              captures: { first_edit_id: "$.data[0].id" }
            - call: "POST /banks/${bank_edt}/reporting-periods/${period_edt}/call-reports/${report_edt}/edit-exceptions/${first_edit_id}/resolve"
              payload: { resolution_note: "Collins floor applied — RWA restated at standardized" }
              as: CapitalAnalyst
            # Now submit should succeed
            - call: "POST /banks/${bank_edt}/reporting-periods/${period_edt}/call-reports/${report_edt}/submit"
              as: CapitalAnalyst
              as_user_id: "analyst-sub-1"
              captures: { status_final: $.data.status }
          assert:
            - "After prepare: CallReport.${report_edt}.edit_failures_open_count > 0"
            - "First submit blocked: error_id == ERR_INVALID_STATE_TRANSITION (report in EDITS_OUTSTANDING, not VALIDATED)"
            - "After resolving all edits: CallReport.${report_edt}.edit_failures_open_count == 0"
            - "Second submit succeeds: CallReport.${report_edt}.status == SUBMITTED"
            - "Boundary: zero edit_failures_open_count unblocks submit; non-zero blocks"

  # -------------------------------------------------------------------------
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # -------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: distribution_approve_depends_on_plan_approved
        grounds:
          - state_machines.CapitalDistributionRequest.transitions
          - state_machines.CapitalPlan.transitions
          - validations[priority=5]
        distinguishing_aspect: |
          Entity pair: CapitalDistributionRequest → CapitalPlan. Distribution
          approval requires CapitalPlan.status == APPROVED. If plan is in
          BOARD_REVIEW (or any state other than APPROVED), approval is rejected
          with ERR_INVALID_STATE_TRANSITION.
        test_recipe:
          setup:
            - "Bank with accepted report, ACTIVE scenario, CapitalPlan in BOARD_REVIEW (not yet APPROVED)"
            - "Distribution request attached to the plan, in PROPOSED"
          setup_api_calls:
            - call: "POST /banks"
              payload: { legal_name: "XDepBank1", charter_id: "CH-XD1-001", rwa_methodology: "STANDARDIZED" }
              as: SystemOperator
              captures: { bank_xd1: $.data.id }
            - call: "POST /banks/${bank_xd1}/reporting-periods"
              payload: { period_end_date: "2026-06-30", period_year: 2026, period_quarter: "Q2" }
              as: CapitalAnalyst
              captures: { period_xd1: $.data.id }
            - call: "POST /banks/${bank_xd1}/reporting-periods/${period_xd1}/risk-exposures"
              payload: { reporting_period_id: "${period_xd1}", exposure_class: "CORPORATE", exposure_at_default_cents: 100000000000, risk_weight_bps: 10000, obligor_grade: "INVESTMENT_GRADE", collateral_haircut_bps: 0 }
              as: CapitalAnalyst
