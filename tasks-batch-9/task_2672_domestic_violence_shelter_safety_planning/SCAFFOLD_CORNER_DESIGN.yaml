      - name: future_dated_wellness_check_and_past_dated_hearing_rejected
        claim_type: temporal_validation
        grounds:
          - validations[priority 76]
          - errors[ERR_INVALID_DATE_WINDOW]
        distinguishing_aspect: |
          One rule enforces opposite directions on two endpoints: a WellnessCheck may not be dated
          after the logical clock, while a hearing window must start strictly after it. Both
          violations return 422 ERR_INVALID_DATE_WINDOW against the same clock reading.
        test_recipe:
          setup:
            - "One HotlineAdvocate (Rosa Marin), one LegalAdvocate (Nils Berg) and Client C-4007 exist."
            - "A PETITION_DRAFTED protective-order case exists for the client."
            - "The logical clock is at its startup default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /staff-members"
              payload: { full_name: "Rosa Marin", role_type: "HOTLINE_ADVOCATE", max_caseload: 10 }
              as: AgencyAdmin
              captures: { adv_id: "$.data.id" }
            - call: "POST /staff-members"
              payload: { full_name: "Nils Berg", role_type: "LEGAL_ADVOCATE", max_caseload: 12 }
              as: AgencyAdmin
              captures: { legal_id: "$.data.id" }
            - call: "POST /clients"
              payload: { client_code: "C-4007", legal_name: "Nora Blaise", household_size: 2, minor_children_count: 0, accessibility_required: false, location_confidential: true }
              as: HotlineAdvocate
              as_user_id: "${adv_id}"
              captures: { client_id: "$.data.id" }
            - call: "POST /protective-order-cases"
              payload: { client_id: "${client_id}", order_type: "EMERGENCY_EX_PARTE" }
              as: LegalAdvocate
              as_user_id: "${legal_id}"
              captures: { poc_id: "$.data.id" }
          trigger:
            - call: "POST /staff-members/${adv_id}/wellness-checks"
              payload: { checked_on_utc: "2026-08-05T00:00:00Z", exposure_hours: 4.0, distress_scale: 3, debrief_completed: false }
              as: AgencyAdmin
              captures: { err_check: "$.data.error_id" }
            - call: "POST /protective-order-cases/${poc_id}/file"
              payload: { filed_court: "County Family Court", hearing_start_utc: "2026-07-30T09:00:00Z", hearing_end_utc: "2026-07-30T10:00:00Z", accompanying_advocate_id: "${legal_id}" }
              as: LegalAdvocate
              as_user_id: "${legal_id}"
              captures: { err_hearing: "$.data.error_id" }
            - call: "POST /protective-order-cases/${poc_id}/file"
              payload: { filed_court: "County Family Court", hearing_start_utc: "2026-08-05T10:00:00Z", hearing_end_utc: "2026-08-05T09:00:00Z", accompanying_advocate_id: "${legal_id}" }
              as: LegalAdvocate
              as_user_id: "${legal_id}"
              captures: { err_inverted: "$.data.error_id" }
          assert:
            - "Call 1: HTTP 422 and ${err_check} == ERR_INVALID_DATE_WINDOW; StaffMember.${adv_id}.last_wellness_check_at is still null and secondary_trauma_index is still 0.0"
            - "Call 2: HTTP 422 and ${err_hearing} == ERR_INVALID_DATE_WINDOW - the window ends before the clock reading"
            - "Call 3: HTTP 422 and ${err_inverted} == ERR_INVALID_DATE_WINDOW - hearing_start_utc must be strictly before hearing_end_utc"
            - "ProtectiveOrderCase.${poc_id}.status is still PETITION_DRAFTED with filed_court == null and version 1"
            - "Client.${client_id}.protective_order_active == false"

