  # =========================================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # =========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: crack_length_150mm_boundary_repair_vs_replace
        grounds:
          - calculations.repair_vs_replace_decision
          - endpoints./work-orders/{id}/damage-assessments
          - entities.DamageAssessment.fields.recommendation
        distinguishing_aspect: |
          Numeric threshold on longest_crack_mm via POST damage-assessments:
          exactly 150 mm (== CRACK_REPAIRABLE_LIMIT_MM) is REPAIR because the
          disqualifier is strictly greater (>), while 150.1 mm is REPLACE.
        test_recipe:
          setup:
            - "An OPEN work order; two assessments at crack 150.0 and 150.1 mm, all other measurements repairable (chip_count 1, not in view, edge 80)."
          setup_api_calls:
            - call: "POST /customers"
              payload: { full_name: "Boyd Boundary", email: "boyd@x.com", phone: "555-0110", service_address_state: "CA" }
              as: ServiceAdvisor
              captures: { cust_id: $.data.id }
            - call: "POST /vehicles"
              payload: { customer_id: "${cust_id}", vin: "CHGCM82633A004364", make: "Honda", model: "CR-V", model_year: 2018, adas_equipped: false, glass_part_number: "FW04135" }
              as: ServiceAdvisor
              captures: { veh_id: $.data.id }
            - call: "POST /work-orders"
              payload: { customer_id: "${cust_id}", vehicle_id: "${veh_id}" }
              as: ServiceAdvisor
              captures: { wo_id: $.data.id }
          trigger:
            - call: "POST /work-orders/${wo_id}/damage-assessments"
              payload: { chip_count: 1, longest_crack_mm: 150, in_driver_primary_view: false, edge_distance_mm: 80 }
              as: ServiceAdvisor
              captures: { rec_at: $.data.recommendation }
            - call: "POST /work-orders/${wo_id}/damage-assessments"
              payload: { chip_count: 1, longest_crack_mm: 150.1, in_driver_primary_view: false, edge_distance_mm: 80 }
              as: ServiceAdvisor
              captures: { rec_over: $.data.recommendation }
          assert:
            - "first DamageAssessment.recommendation == REPAIR (crack exactly 150 mm)"
            - "second DamageAssessment.recommendation == REPLACE (crack 150.1 mm)"

      - name: technician_back_to_back_adjacency_boundary
        grounds:
          - validations[priority=11]
          - endpoints./service-appointments
          - errors[ERR_TECHNICIAN_DOUBLE_BOOKED]
        distinguishing_aspect: |
          Interval-adjacency boundary on a DIFFERENT metric (time intervals on a
          technician) and a DIFFERENT endpoint (POST /service-appointments): a second
          appointment starting exactly when the first ends (10:00==10:00, half-open
