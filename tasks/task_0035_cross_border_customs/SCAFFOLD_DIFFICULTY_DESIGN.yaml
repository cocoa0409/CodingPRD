# =============================================================================
# Cross-Border E-commerce Customs Clearance — Scaffold Difficulty Design (v1)
#
# Test Targeting Index — every difficulty feature §1.1–§1.7 claims to exhibit
# is enumerated below, cross-referenced per the nine §0.5 Difficulty Rules.
# Each instance grounds in declared elements of SCAFFOLD.yaml; deleting this
# file leaves the scaffold's behavior identical.
# =============================================================================

scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  # Rule 1 — Dual-variant calculations across different entity domains
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: dutiable_value_method_variants_on_declaration
        grounds:
          - calculations.dutiable_value
          - state_machines.Declaration.DRAFT_to_SUBMITTED
          - entities.Declaration.fields.dutiable_value_method
          - entities.Declaration.fields.dutiable_value_cny_minor
        distinguishing_aspect: |
          On the Declaration entity domain, the dutiable_value calculation has three named variants
          (TRANSACTION_VALUE, DEDUCTIVE_VALUE, COMPUTED_VALUE) that produce strictly different
          dutiable_value_cny_minor for the same Order line — verified by comparing exactly two of
          the three for one identical order.
        test_recipe:
          setup:
            - "Create HsCode HC1 with vat_rate_bps=0, tariff_rate_bps=0 (we measure dutiable_value, not tax)"
            - "Create ExchangeRate USD->CNY with rate_micros=7000000 effective_date='2026-01-01'"
            - "Advance clock to 2026-01-02T10:00:00Z"
            - "Create Importer I1 (ACTIVE), Declarant D1 (ACTIVE)"
            - "Create Order O1 with currency='USD', trade_mode=GENERAL_TRADE, line_items=[{quantity:1, unit_price:10000, weight_kg:1.0}], total_value_minor=10000"
            - "Create Declaration A on O1 with dutiable_value_method=TRANSACTION_VALUE; add a single DeclarationLine for HC1 with classification_source=AUTO_SUGGESTED"
            - "Create Declaration B on a second identical Order O2 with dutiable_value_method=DEDUCTIVE_VALUE; add identical DeclarationLine"
          trigger:
            - "POST /declarations/A/submit"
            - "POST /declarations/B/submit"
          assert:
            - "Declaration A.dutiable_value_cny_minor == 70000  # floor(10000 * 7_000_000 / 1_000_000) = 70000 fen = 700.00 CNY"
            - "Declaration B.dutiable_value_cny_minor == 74375  # retail=floor(10000*125/100)=12500; deduction=floor(12500*1500/10000)=1875; deductive_minor=10625; CNY=floor(10625*7_000_000/1_000_000)=74375"
            - "Declaration A.dutiable_value_cny_minor != Declaration B.dutiable_value_cny_minor"

      - name: refund_amount_full_vs_partial_on_refund
        grounds:
          - calculations.refund_amount
          - state_machines.Refund.DRAFT_to_SUBMITTED
          - entities.Refund.fields.refund_reason
          - entities.Refund.fields.refundable_amount_cny_minor
        distinguishing_aspect: |
          On the Refund entity domain (different from Declaration), the refund_amount calculation has
          two named variants (full_refund for RETURN/ORDER_CANCELLATION, partial_refund for
          ERRONEOUS_DECLARATION) that yield different refundable_amount_cny_minor for the same paid
          PaymentNotice when the post-amendment tax is lower than the original tax.
        test_recipe:
          setup:
            - "Bring Declaration X through to RELEASED with PaymentNotice.amount_cny_minor=10000 fen, status=PAID"
            - "Order linked to X — copy its workflow to a parallel Declaration Y on Order2 also through to RELEASED with PaymentNotice.amount_cny_minor=10000 fen, status=PAID"
            - "For Y: run /declarations/Y/amend that swaps to a lower-rate HsCode such that recomputed Declaration.total_tax_cny_minor == 4000 fen; finalize_amendment"
            - "For X: POST /orders/Order1/return so Order1.status=RETURNED"
            - "Create Refund Rx on Declaration X with refund_reason=RETURN, supporting_documents=[{doc_type:'SHIPMENT_RETURN_RECEIPT',voucher_url:'u1'}]"
            - "Create Refund Ry on Declaration Y with refund_reason=ERRONEOUS_DECLARATION, supporting_documents=[{doc_type:'AMENDMENT_DECISION',voucher_url:'u2'}]"
          trigger:
            - "POST /refunds/Rx/submit"
            - "POST /refunds/Ry/submit"
          assert:
            - "Refund Rx.refundable_amount_cny_minor == 10000  # full refund equals pn.amount_cny_minor"
            - "Refund Ry.refundable_amount_cny_minor == 6000   # max(0, 10000 - 4000)"
            - "Refund Rx.refundable_amount_cny_minor != Refund Ry.refundable_amount_cny_minor"

  # ---------------------------------------------------------------------------
  # Rule 2 — Combinatorial formulas across different modes
  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: personal_postal_tiered_branching_mode_a
        grounds:
          - calculations.declaration_tax_total
          - entities.Declaration.fields.tax_mode
          - entities.Declaration.fields.trade_mode
          - entities.Declaration.fields.dutiable_value_cny_minor
          - entities.HsCode.fields.postal_tax_rate_bps
        distinguishing_aspect: |
          Mode (a) — the declaration_tax_total formula has 3+ inputs (trade_mode,
          dutiable_value_cny_minor, postal_total) with non-linear interaction across two nested
          conditionals: first trade_mode==B2C_DIRECT_MAIL gates entry to PERSONAL_POSTAL; then
          dutiable_value vs PERSONAL_POSTAL_THRESHOLD_CNY_MINOR (5000 CNY) chooses STANDARD vs
          PERSONAL_POSTAL; then within PERSONAL_POSTAL, postal_total vs POSTAL_EXEMPTION_CNY_MINOR
          (50 CNY) chooses 0 vs postal_total. Three branch decisions, three input axes.
        test_recipe:
          setup:
            - "Create HsCode HC2 with tariff_rate_bps=1000, vat_rate_bps=1300, consumption_tax_rate_bps=0, postal_tax_rate_bps=1000"
            - "Create ExchangeRate USD->CNY rate_micros=7000000 effective_date='2026-01-01'"
            - "Create Order Op (B2C_DIRECT_MAIL, USD currency, single line quantity=1 unit_price=10000 cents USD weight_kg=1)"
            - "Create Order Os (GENERAL_TRADE, otherwise identical lines)"
            - "Create Order Ohigh (B2C_DIRECT_MAIL, single line unit_price=72000 cents USD weight_kg=1)  # converts to ~5040 CNY > threshold"
            - "Build Declaration Dp on Op (dutiable_method=TRANSACTION_VALUE), Ds on Os (TRANSACTION_VALUE), Dhigh on Ohigh (TRANSACTION_VALUE), each with one HC2 DeclarationLine"
          trigger:
            - "POST /declarations/Dp/submit"
            - "POST /declarations/Ds/submit"
            - "POST /declarations/Dhigh/submit"
          assert:
            - "Declaration Dp.dutiable_value_cny_minor == 70000  # 700 CNY < 5000 CNY threshold AND B2C → tax_mode=PERSONAL_POSTAL"
            - "Declaration Dp.tax_mode == 'PERSONAL_POSTAL'"
            - "Declaration Dp.total_tax_cny_minor == 7000  # postal_total=floor(70000*1000/10000)=7000 fen=70 CNY > 50 CNY exemption → no waiver"
            - "Declaration Ds.tax_mode == 'STANDARD'  # trade_mode != B2C → STANDARD even though value < threshold"
            - "Declaration Dhigh.tax_mode == 'STANDARD'  # trade_mode == B2C but dutiable_value > 5000 CNY threshold → STANDARD"

      - name: per_line_floor_then_sum_rounding_order_mode_b
        grounds:
          - calculations.declaration_tax_total
          - calculations.dutiable_value
          - entities.DeclarationLine.fields.line_dutiable_value_cny_minor
        distinguishing_aspect: |
          Mode (b) — the scaffold pins "floor per line then sum across lines"; the alternative
          "sum across lines then floor once" yields strictly different cents on a deliberately
          chosen pair of lines. Two lines each with dutiable_value=5050 fen at 1% tariff:
          floor(5050*100/10000)=50 per line, sum=100 fen; vs sum=10100 then floor(10100*100/10000)=101.
          The scaffold pins the former (100), making the order load-bearing.
        test_recipe:
          setup:
            - "Create HsCode HC3 with tariff_rate_bps=100, vat_rate_bps=0, consumption_tax_rate_bps=0, postal_tax_rate_bps=0"
            - "Create ExchangeRate USD->CNY rate_micros=1000000 (1:1 for arithmetic clarity) effective_date='2026-01-01'"
            - "Create Order Or with currency='USD' GENERAL_TRADE, two line_items each {quantity:1, unit_price:5050, weight_kg:0.1}"
            - "Build Declaration Dr on Or (TRANSACTION_VALUE) with two DeclarationLines, both pointing at HC3 (one per order_line_index)"
          trigger:
            - "POST /declarations/Dr/submit"
          assert:
            - "DeclarationLine[0].line_dutiable_value_cny_minor == 5050"
            - "DeclarationLine[1].line_dutiable_value_cny_minor == 5050"
            - "Declaration Dr.dutiable_value_cny_minor == 10100  # 5050 + 5050"
            - "Declaration Dr.tariff_amount_cny_minor == 100  # floor(5050*100/10000)=50 per line, summed = 100 — NOT 101 which would be 'sum then floor'"

  # ---------------------------------------------------------------------------
  # Rule 3 — Non-linear state-machine shape on different entities
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: declaration_query_response_cycle
        grounds:
          - state_machines.Declaration.UNDER_REVIEW_to_QUERIED
          - state_machines.Declaration.QUERIED_to_UNDER_REVIEW
          - state_machines.Declaration.UNDER_REVIEW_to_REJECTED
          - state_machines.Declaration.REJECTED_to_SUBMITTED
        distinguishing_aspect: |
          On Declaration, the state machine has TWO cycles: UNDER_REVIEW↔QUERIED (officer-initiated
          query/resolve loop) AND REJECTED→SUBMITTED→UNDER_REVIEW (rework loop bounded by
          submission_count<3). At least one round-trip is reachable from a single starting state,
          which a strictly linear A→B→C→D pipeline cannot exhibit.
        test_recipe:
          setup:
            - "Bring Declaration D to UNDER_REVIEW (after submit + start_review)"
          trigger:
            - "POST /declarations/D/queries with required_documents=['INVOICE'] → status=QUERIED"
            - "POST /queries/{q.id}/respond with response_documents=[{doc_type:'INVOICE',voucher_url:'v'}] → query.status=RESPONDED"
            - "POST /queries/{q.id}/resolve → declaration.status=UNDER_REVIEW (round-trip back)"
          assert:
            - "Declaration D.status == 'UNDER_REVIEW'  # returned to original state"
            - "Declaration D.query_id is null  # query closed out"
            - "Query q.status == 'RESOLVED'"

      - name: refund_branching_approve_or_reject
        grounds:
          - state_machines.Refund.SUBMITTED_to_APPROVED
          - state_machines.Refund.SUBMITTED_to_REJECTED
          - state_machines.Refund.APPROVED_to_EXECUTED
        distinguishing_aspect: |
          On Refund (different entity from Declaration), the state machine branches at SUBMITTED:
          one path APPROVED→EXECUTED disburses funds and emits ERP audit event; the other path
          REJECTED is terminal with rejection_reason and no executed_amount. The two branches have
          divergent side-effect sets — disbursement vs rejection_reason recording.
        test_recipe:
          setup:
            - "Set up two parallel refund flows on two declarations: R1 with refund_reason=RETURN supporting_documents intact, R2 likewise; both submitted"
          trigger:
            - "POST /refunds/R1/approve then POST /refunds/R1/execute"
            - "POST /refunds/R2/reject with rejection_reason='insufficient evidence'"
          assert:
            - "Refund R1.status == 'EXECUTED'"
            - "Refund R1.executed_amount_cny_minor == Refund R1.refundable_amount_cny_minor  # disbursement side-effect fired"
            - "Refund R2.status == 'REJECTED'"
            - "Refund R2.executed_amount_cny_minor == 0  # rejection branch has no disbursement"
            - "Refund R2.rejection_reason == 'insufficient evidence'"

  # ---------------------------------------------------------------------------
  # Rule 4 — Transitive cascade chains from different triggers
  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: confirm_payment_three_hop_release_cascade
        grounds:
          - state_machines.PaymentNotice.PENDING_to_PAID
          - state_machines.Declaration.APPROVED_to_RELEASED
          - state_machines.Order.DECLARED_to_RELEASED
        distinguishing_aspect: |
          Depth-3 chain originating from POST /payment_notices/{id}/confirm_payment: hop 1 mutates
          PaymentNotice (PENDING→PAID); the PAID transition's side_effects ITSELF triggers hop 2,
          Declaration APPROVED→RELEASED; the RELEASED transition's side_effects then triggers hop 3,
          Order DECLARED→RELEASED. Each hop is caused by the previous hop's transition, not by
          the original confirm_payment call directly.
        test_recipe:
          setup:
            - "Bring Declaration D to APPROVED with auto-generated PaymentNotice PN (status=PENDING, amount_cny_minor=10000)"
            - "Order O linked to D is in DECLARED state (cascaded from APPROVE)"
          trigger:
            - "POST /payment_notices/PN/confirm_payment with payment_channel=ELECTRONIC_PAYMENT, idempotency_key='k1'"
          assert:
            - "PaymentNotice PN.status == 'PAID'  # hop 1"
            - "Declaration D.status == 'RELEASED'  # hop 2 — caused by PN entering PAID, not by HTTP call"
            - "Order O.status == 'RELEASED'  # hop 3 — caused by D entering RELEASED, not by HTTP call"
            - "Declaration D.pickup_coordinated_at is not null"

      - name: reverse_payment_two_hop_revert_cascade
        grounds:
          - state_machines.PaymentNotice.PAID_to_REVERSED
          - state_machines.Declaration.APPROVED_to_RELEASED  # the inverse-direction annotation in side_effects of PAID_to_REVERSED
        distinguishing_aspect: |
          Depth-2 chain originating from a DIFFERENT trigger — POST /payment_notices/{id}/reverse —
          mutates PaymentNotice (PAID→REVERSED), and that reversal's side_effects ITSELF reverts
          Declaration RELEASED→APPROVED. The chain originates from a different transition than the
          confirm_payment cascade and propagates a compensating rollback rather than forward release.
        test_recipe:
          setup:
            - "Reach end-state of confirm_payment cascade: PaymentNotice PN=PAID, Declaration D=RELEASED, Order O=RELEASED, no EXECUTED Refund exists"
          trigger:
            - "POST /payment_notices/PN/reverse with reverse_reason='bank_dispute'"
          assert:
            - "PaymentNotice PN.status == 'REVERSED'  # hop 1"
            - "Declaration D.status == 'APPROVED'  # hop 2 — caused by PN entering REVERSED, the inverse of the confirm cascade"

  # ---------------------------------------------------------------------------
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_temporal_on_payment_confirm
        grounds:
          - validations[priority=5]  # ERR_INVALID_STATE_TRANSITION (category=state)
          - validations[priority=13]  # ERR_PAYMENT_NOTICE_EXPIRED (category=business_temporal)
          - state_machines.PaymentNotice.PENDING_to_PAID
        distinguishing_aspect: |
          Category pair (state, business_temporal). When confirm_payment is invoked on a notice that
          is BOTH already PAID (state violation) AND past due_at (temporal expiry), priority 5 (state)
          fires before priority 13 (business_temporal). Returns ERR_INVALID_STATE_TRANSITION, not
          ERR_PAYMENT_NOTICE_EXPIRED.
        test_recipe:
          setup:
            - "Reach PaymentNotice PN.status=PAID via a valid confirm_payment"
            - "POST /_clock/advance with seconds=700000 (~8 days, well past due_at)"
          trigger:
            - "POST /payment_notices/PN/confirm_payment with payment_channel=ELECTRONIC_PAYMENT, idempotency_key='k2'  # both invariants violated"
          assert:
            - "Response status == 409"
            - "Response body data.error_id == 'ERR_INVALID_STATE_TRANSITION'  # state (priority 5) wins over temporal (priority 13)"

      - name: business_referential_vs_business_constraint_on_refund_submit
        grounds:
          - validations[priority=16]  # ERR_ORDER_NOT_ELIGIBLE (category=business_referential)
          - validations[priority=17]  # ERR_REFUND_DOCUMENTS_INCOMPLETE (category=business_constraint)
          - state_machines.Refund.DRAFT_to_SUBMITTED
        distinguishing_aspect: |
          Category pair (business_referential, business_constraint), DIFFERENT from the (state,
          business_temporal) pair above. When submitting a RETURN refund where Order.status is NOT
          RETURNED AND supporting_documents is empty, priority 16 (referential) fires before
          priority 17 (constraint). Returns ERR_ORDER_NOT_ELIGIBLE, not ERR_REFUND_DOCUMENTS_INCOMPLETE.
        test_recipe:
          setup:
            - "Reach Declaration RELEASED with PaymentNotice PAID; Order O in RELEASED (NOT in RETURNED)"
            - "Create Refund R on this declaration with refund_reason=RETURN and supporting_documents=[]"
          trigger:
            - "POST /refunds/R/submit  # both invariants violated: order not RETURNED AND no documents"
          assert:
            - "Response status == 409"
            - "Response body data.error_id == 'ERR_ORDER_NOT_ELIGIBLE'  # referential (priority 16) wins over constraint (priority 17)"

  # ---------------------------------------------------------------------------
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: personal_postal_threshold_inclusive_at_500000_fen
        grounds:
          - calculations.declaration_tax_total
          - entities.Declaration.fields.tax_mode
        distinguishing_aspect: |
          Numeric-threshold metric: PERSONAL_POSTAL_THRESHOLD_CNY_MINOR = 500000 fen with INCLUSIVE
          comparison (<=). At dutiable_value_cny_minor == 500000 the tax_mode is PERSONAL_POSTAL; at
          500001 it is STANDARD. Endpoint: POST /declarations/{id}/submit. The boundary distinguishes
          PERSONAL_POSTAL from STANDARD by a single fen.
        test_recipe:
          setup:
            - "Create HsCode HC4 (postal_tax_rate_bps=1000, tariff_rate_bps=1000, vat_rate_bps=0, consumption_tax_rate_bps=0)"
            - "Create ExchangeRate USD->CNY rate_micros=1000000 (1:1) effective_date='2026-01-01'"
            - "Create Order Oeq (B2C_DIRECT_MAIL, single line quantity=1, unit_price=500000, weight_kg=1)  # dutiable=500000 exactly"
            - "Create Order Oover (B2C_DIRECT_MAIL, single line quantity=1, unit_price=500001, weight_kg=1)"
            - "Build Declaration Deq and Dover with TRANSACTION_VALUE method, single HC4 DeclarationLine each"
          trigger:
            - "POST /declarations/Deq/submit"
            - "POST /declarations/Dover/submit"
          assert:
            - "Declaration Deq.dutiable_value_cny_minor == 500000"
            - "Declaration Deq.tax_mode == 'PERSONAL_POSTAL'  # 500000 <= 500000 → inclusive boundary, PERSONAL_POSTAL applies"
            - "Declaration Dover.dutiable_value_cny_minor == 500001"
            - "Declaration Dover.tax_mode == 'STANDARD'  # 500001 > 500000 → strict crossing, STANDARD applies"

      - name: inspection_appointment_half_open_60min_window
        grounds:
          - validations[priority=11]  # ERR_INSPECTION_SLOT_TAKEN
          - entities.InspectionAppointment.fields.scheduled_at
          - entities.InspectionAppointment.fields.bay_code
          - concurrency_rules[bay_overlap]
        distinguishing_aspect: |
          Time-interval metric (DIFFERENT from a numeric threshold), DIFFERENT endpoint
          (POST /declarations/{id}/inspection_appointments). The 60-minute window is HALF-OPEN
          [scheduled_at, scheduled_at+60min). Two appointments on same bay at exactly +60min apart
          are accepted (boundary is open at +60min); at +59min apart they collide.
        test_recipe:
          setup:
            - "Bring two declarations D1 and D2 to UNDER_REVIEW state"
            - "POST /declarations/D1/inspection_appointments with scheduled_at='2026-01-15T10:00:00Z', bay_code='BAY-A1' → succeeds, A1 created"
          trigger:
            - "POST /declarations/D2/inspection_appointments with scheduled_at='2026-01-15T11:00:00Z', bay_code='BAY-A1'  # exactly +60min — boundary open, no overlap"
            - "POST /declarations/D2/inspection_appointments with scheduled_at='2026-01-15T10:59:00Z', bay_code='BAY-A1'  # +59min — overlap"
          assert:
            - "First trigger: response status == 201; new appointment created (boundary +60min is open: not in [10:00, 11:00))"
            - "Second trigger: response status == 409, data.error_id == 'ERR_INSPECTION_SLOT_TAKEN'  # 10:59 in [10:00, 11:00) → overlap"

  # ---------------------------------------------------------------------------
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # ---------------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: declaration_submit_requires_importer_active
        grounds:
          - validations[priority=6]   # ERR_IMPORTER_SUSPENDED
          - state_machines.Declaration.DRAFT_to_SUBMITTED
          - entities.Importer.fields.status
        distinguishing_aspect: |
          Entity pair (Declaration, Importer). Declaration's DRAFT→SUBMITTED transition is gated by
          Importer.status==ACTIVE. Suspending the Importer mid-flow blocks subsequent submissions
          even though the declaration itself is otherwise valid.
        test_recipe:
          setup:
            - "Create Importer I1 (status=ACTIVE), Declarant D1, Order O1 belonging to I1"
            - "Create Declaration A on O1 in DRAFT with all fields complete and one APPROVED-override line"
            - "POST /importers/I1/suspend  # Importer.status now SUSPENDED"
          trigger:
            - "POST /declarations/A/submit"
          assert:
            - "Response status == 409, data.error_id == 'ERR_IMPORTER_SUSPENDED'"
            - "Declaration A.status == 'DRAFT'  # transition blocked by cross-entity state of Importer"

      - name: refund_return_requires_order_returned
        grounds:
          - validations[priority=16]  # ERR_ORDER_NOT_ELIGIBLE
          - state_machines.Refund.DRAFT_to_SUBMITTED
          - entities.Order.fields.status
        distinguishing_aspect: |
          Entity pair (Refund, Order) — DIFFERENT pair from (Declaration, Importer). Refund's
          DRAFT→SUBMITTED with refund_reason=RETURN is gated by Order.status==RETURNED. The Order
          must have been independently transitioned to RETURNED before the refund submission.
        test_recipe:
          setup:
            - "Reach Declaration RELEASED with PaymentNotice PAID; Order O in RELEASED (NOT in RETURNED)"
            - "Create Refund R with refund_reason=RETURN and full supporting_documents=[{doc_type:'SHIPMENT_RETURN_RECEIPT',voucher_url:'v'}]"
          trigger:
            - "POST /refunds/R/submit  # Order is RELEASED, not RETURNED"
          assert:
            - "Response status == 409, data.error_id == 'ERR_ORDER_NOT_ELIGIBLE'"
            - "Refund R.status == 'DRAFT'  # transition blocked by cross-entity state of Order"

  # ---------------------------------------------------------------------------
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: inspection_bay_fixed_60min_half_open_overlap
        grounds:
          - validations[priority=11]  # ERR_INSPECTION_SLOT_TAKEN
          - entities.InspectionAppointment.fields.scheduled_at
          - concurrency_rules[bay_overlap]
        distinguishing_aspect: |
          Resource: InspectionAppointment.bay_code. Interval semantics: FIXED-LENGTH 60-minute
          half-open window [scheduled_at, scheduled_at+60min). Adjacency at exactly +60min is allowed
          (boundary excluded on the right). The duration is implicit (always 60 min), not declared.
        test_recipe:
          setup:
            - "Bring D1, D2 to UNDER_REVIEW"
            - "POST /declarations/D1/inspection_appointments scheduled_at='2026-01-15T10:00:00Z', bay_code='BAY-A1' — accepted"
          trigger:
            - "POST /declarations/D2/inspection_appointments scheduled_at='2026-01-15T10:30:00Z', bay_code='BAY-A1'  # +30min, mid-window, collides"
          assert:
            - "Response status == 409, data.error_id == 'ERR_INSPECTION_SLOT_TAKEN'"

      - name: tariff_rule_arbitrary_length_closed_open_overlap
        grounds:
          - validations[priority=24]  # ERR_TARIFF_RULE_OVERLAP
          - entities.TariffRule.fields.effective_from
          - entities.TariffRule.fields.effective_to
        distinguishing_aspect: |
          Resource: TariffRule keyed by (hs_code_id, origin_country, destination_country) — DIFFERENT
          resource from InspectionAppointment.bay_code. Interval semantics: ARBITRARY-LENGTH
          closed-open [effective_from, effective_to) windows where effective_to may be null
          (open-ended). Two rules are back-to-back legally when effective_to_A == effective_from_B
          (zero-overlap point shared, same as inspection's right-open boundary, but the duration is
          declared per-rule, not fixed).
        test_recipe:
          setup:
            - "Create HsCode HC5"
            - "POST /tariff_rules with hs_code_id=HC5.id, origin_country='US', destination_country='CN', tariff_rate_bps=500, effective_from='2026-01-01T00:00:00Z', effective_to='2026-04-01T00:00:00Z' — accepted"
          trigger:
            - "POST /tariff_rules with hs_code_id=HC5.id, origin_country='US', destination_country='CN', tariff_rate_bps=600, effective_from='2026-04-01T00:00:00Z', effective_to='2026-07-01T00:00:00Z'  # back-to-back, no overlap"
            - "POST /tariff_rules with hs_code_id=HC5.id, origin_country='US', destination_country='CN', tariff_rate_bps=700, effective_from='2026-03-15T00:00:00Z', effective_to='2026-05-01T00:00:00Z'  # straddles boundary"
          assert:
            - "First trigger: response status == 201 (back-to-back accepted)"
            - "Second trigger: response status == 409, data.error_id == 'ERR_TARIFF_RULE_OVERLAP'"

  # ---------------------------------------------------------------------------
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: payment_confirm_then_reverse_preserves_total_tax
        grounds:
          - state_machines.PaymentNotice.PENDING_to_PAID
          - state_machines.PaymentNotice.PAID_to_REVERSED
          - entities.Declaration.fields.total_tax_cny_minor
          - calculations.declaration_tax_total
        distinguishing_aspect: |
          Forward action confirm_payment paired with compensating reverse_payment leaves the
          monetary quantity Declaration.total_tax_cny_minor (= tariff_amount_cny_minor +
          vat_amount_cny_minor + consumption_tax_cny_minor) UNCHANGED. The conserved quantity is a
          MONEY-typed sum over Declaration tax fields. Pinned formula:
            total_tax_after = total_tax_before
            tariff_amount_after = tariff_amount_before
            vat_amount_after = vat_amount_before
            consumption_tax_after = consumption_tax_before
        test_recipe:
          setup:
            - "Bring Declaration D to APPROVED with PaymentNotice PN (amount_cny_minor=10000); record D.total_tax_cny_minor as T_before"
          trigger:
            - "POST /payment_notices/PN/confirm_payment with payment_channel=ELECTRONIC_PAYMENT, idempotency_key='inv1'"
            - "POST /payment_notices/PN/reverse with reverse_reason='compensating_test'"
          assert:
            - "Declaration D.total_tax_cny_minor == T_before  # unchanged across confirm+reverse"
            - "Declaration D.tariff_amount_cny_minor + Declaration D.vat_amount_cny_minor + Declaration D.consumption_tax_cny_minor == Declaration D.total_tax_cny_minor"
            - "PaymentNotice PN.amount_cny_minor == 10000  # pn.amount snapshot also unchanged"

      - name: refund_submit_then_reject_preserves_executed_refund_count
        grounds:
          - state_machines.Refund.DRAFT_to_SUBMITTED
          - state_machines.Refund.SUBMITTED_to_REJECTED
          - entities.Refund.fields.status
          - entities.Refund.fields.executed_amount_cny_minor
        distinguishing_aspect: |
          Forward action submit_refund paired with compensating reject_refund leaves the COUNT-typed
          quantity (count of Refund where status=='EXECUTED' AND declaration_id == D.id)
          UNCHANGED at zero. The conserved quantity is a COUNT over Refund rows — DIFFERENT TYPE
          from the money-typed invariant in the previous instance. Pinned formula:
            count(Refund where status=='EXECUTED' and declaration_id==D.id) before == 0
            count(Refund where status=='EXECUTED' and declaration_id==D.id) after == 0
        test_recipe:
          setup:
            - "Bring Declaration D to RELEASED with PaymentNotice PAID, Order in RETURNED state"
            - "Create Refund R with refund_reason=RETURN and full supporting_documents"
            - "Capture initial count: |{Refund r : r.status=='EXECUTED' AND r.declaration_id==D.id}| == 0"
          trigger:
            - "POST /refunds/R/submit"
            - "POST /refunds/R/reject with rejection_reason='compensating_test'"
          assert:
            - "Refund R.status == 'REJECTED'"
            - "Refund R.executed_amount_cny_minor == 0"
            - "count(Refund where status=='EXECUTED' AND declaration_id==D.id) == 0  # invariant preserved"
