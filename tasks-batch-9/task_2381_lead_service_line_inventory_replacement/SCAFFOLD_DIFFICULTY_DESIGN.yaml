  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: sampling_confidence_exactly_at_floor_validates_and_action_level_is_strict
        grounds:
          - calculations.sampling_statistical_validation
          - state_machines.SamplingBatch.state.OPEN_to_VALIDATED
          - entities.SamplingBatch.fields.classification_confidence
          - entities.WaterSystem.fields.cct_optimization_status
        distinguishing_aspect: |
          Metric: classification_confidence at exactly CONFIDENCE_FLOOR 0.8000, on
          POST /lsl/sampling-batches/{id}/validate. Two boundaries collide in one call: the
          sample at exactly 15.0 ppb must NOT count as an exceedance (ACTION_LEVEL_PPB is
          strictly greater), which keeps exceedance_count at 1 and confidence at exactly
          0.8000, and 0.8000 >= 0.8000 must resolve VALIDATED rather than REJECTED.
        test_recipe:
          setup:
            - "One WaterSystem with cct_optimization_status left at its NOT_REQUIRED default."
            - "One ServiceLine to attach samples to."
            - "One OPEN SamplingBatch with stratum_line_count 20, so required_sample_count = max(5, ceil(20 * 0.05)) = 5."
            - "Exactly five valid samples: 2.0, 3.0, 4.0, 15.0, 16.0 ppb. Sorted, rank = ceil(0.90 * 5) = 5, so percentile_90_ppb = 16.0."
          setup_api_calls:
            - call: "POST /lsl/water-systems"
              payload: { pwsid: "IL2031013", system_name: "Quarrybrook Water", compliance_deadline_date: "2027-10-16", baseline_lead_and_grr_count: 100, disadvantaged_tract_codes: [], funding_mode: "WATERFALL" }
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { ws: $.data.id }
            - call: "POST /lsl/service-lines"
              payload: { water_system_id: "${ws}", address_label: "101 Elm St", census_tract_code: "17031-9900" }
              as: InventoryAnalyst
              as_user_id: "analyst-1"
              captures: { l1: $.data.id }
            - call: "POST /lsl/sampling-batches"
              payload: { water_system_id: "${ws}", stratum_code: "STR-A", stratum_line_count: 20 }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { batch: $.data.id }
            - call: "POST /lsl/sampling-batches/${batch}/samples"
              payload: { service_line_id: "${l1}", lead_ppb: 2.0, collected_at: "2026-07-11T09:00:00Z", sample_type: "FIRST_DRAW" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /lsl/sampling-batches/${batch}/samples"
              payload: { service_line_id: "${l1}", lead_ppb: 3.0, collected_at: "2026-07-12T09:00:00Z", sample_type: "FIRST_DRAW" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /lsl/sampling-batches/${batch}/samples"
              payload: { service_line_id: "${l1}", lead_ppb: 4.0, collected_at: "2026-07-13T09:00:00Z", sample_type: "FIRST_DRAW" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /lsl/sampling-batches/${batch}/samples"
              payload: { service_line_id: "${l1}", lead_ppb: 15.0, collected_at: "2026-07-14T09:00:00Z", sample_type: "FIRST_DRAW" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /lsl/sampling-batches/${batch}/samples"
              payload: { service_line_id: "${l1}", lead_ppb: 16.0, collected_at: "2026-07-15T09:00:00Z", sample_type: "FIRST_DRAW" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { valid_before: $.data.valid_sample_count, required: $.data.required_sample_count, state_before: $.data.state }
          trigger:
            - call: "POST /lsl/sampling-batches/${batch}/validate"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { p90: $.data.percentile_90_ppb, exc: $.data.exceedance, exc_count: $.data.exceedance_count, conf: $.data.classification_confidence, batch_state: $.data.state }
          assert:
            - "${required} == 5"
            - "${valid_before} == 5"
            - "${state_before} == OPEN"
            - "${p90} == 16.0"
            - "${exc} == true"
            - "${exc_count} == 1 (the 15.0 ppb sample is NOT an exceedance; a >= comparison would give 2)"
            - "${conf} == 0.8000"
            - "${conf} != 0.6000 (the value produced if 15.0 were counted as an exceedance)"
            - "${batch_state} == VALIDATED"
            - "${batch_state} != REJECTED (0.8000 >= CONFIDENCE_FLOOR 0.8000 validates; a strict > comparison would reject)"
            - "SamplingBatch.${batch}.rejection_reason == null"
            - "WaterSystem.${ws}.cct_optimization_status == PENDING_REOPTIMIZATION"

      - name: progress_report_empty_universe_yields_exactly_100_pct_and_tier_d
        grounds:
          - calculations.inventory_progress_rate
          - calculations.compliance_credit
          - entities.ProgressReport.common_fields_false
          - endpoints.POST_lsl_progress_reports
        distinguishing_aspect: |
          A different metric on a different endpoint: replacement_progress_pct at the
          zero-denominator boundary on POST /lsl/progress-reports. Every count is zero, so
          baseline_denominator == 0 and the rule must return exactly 100.00 rather than
          divide by zero or return 0.00; simultaneously disadvantaged_share_pct uses
          max(1, 0) to stay at 0.00 -> TIER_D -> 0.90, and mandated 0 minus deferral 1
          clamps shortfall at exactly 0.00 rather than going negative.
        test_recipe:
          setup:
            - "One WaterSystem with baseline_lead_and_grr_count = 0."
            - "One ServiceLine whose records evidence is HISTORIC_RECORD/UTILITY/COPPER plus HISTORIC_RECORD/CUSTOMER/PLASTIC, so classification == NON_LEAD and lead_count / grr_count / unknown_count are all 0."
            - "No ReplacementOrder rows at all, so replaced_count == 0 and every credit count is 0."
          setup_api_calls:
            - call: "POST /lsl/water-systems"
              payload: { pwsid: "IL2031014", system_name: "Nettlewood Water", compliance_deadline_date: "2027-10-16", baseline_lead_and_grr_count: 0, disadvantaged_tract_codes: [], funding_mode: "WATERFALL" }
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { ws: $.data.id }
            - call: "POST /lsl/service-lines"
              payload: { water_system_id: "${ws}", address_label: "101 Elm St", census_tract_code: "17031-9900" }
              as: InventoryAnalyst
              as_user_id: "analyst-1"
              captures: { l1: $.data.id }
            - call: "POST /lsl/evidence-items"
              payload: { service_line_id: "${l1}", source_type: "HISTORIC_RECORD", side: "UTILITY", observed_material: "COPPER", observed_at: "2026-06-01T00:00:00Z" }
              as: InventoryAnalyst
              as_user_id: "analyst-1"
            - call: "POST /lsl/evidence-items"
              payload: { service_line_id: "${l1}", source_type: "HISTORIC_RECORD", side: "CUSTOMER", observed_material: "PLASTIC", observed_at: "2026-06-01T00:00:00Z" }
              as: InventoryAnalyst
              as_user_id: "analyst-1"
            - call: "GET /lsl/water-systems/${ws}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { lead_before: $.data.lead_count, unknown_before: $.data.unknown_count, nonlead_before: $.data.non_lead_count }
          trigger:
            - call: "POST /lsl/progress-reports"
              payload: { water_system_id: "${ws}", period_start_date: "2026-08-01", period_end_date: "2026-08-31" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { rep: $.data.id, pct: $.data.replacement_progress_pct, denom: $.data.baseline_denominator, tier: $.data.equity_tier, shortfall: $.data.shortfall_credit }
          assert:
            - "${lead_before} == 0 and ${unknown_before} == 0 and ${nonlead_before} == 1"
            - "${denom} == 0"
            - "${pct} == 100.00"
            - "${pct} != 0.00 (the empty universe is defined as fully complete, not as zero progress)"
            - "ProgressReport.${rep}.replaced_count == 0"
            - "ProgressReport.${rep}.full_replacement_count == 0 and ProgressReport.${rep}.partial_replacement_count == 0"
            - "ProgressReport.${rep}.base_credit == 0.00"
            - "ProgressReport.${rep}.disadvantaged_share_pct == 0.00"
            - "${tier} == TIER_D and ProgressReport.${rep}.equity_multiplier == 0.90"
            - "ProgressReport.${rep}.total_credit == 0.00"
            - "ProgressReport.${rep}.mandated_annual_credit == 0"
            - "ProgressReport.${rep}.deferral_allowance == 1"
            - "${shortfall} == 0.00 (max(0, 0 - 1 - 0.00) clamps at zero; an unclamped subtraction would give -1.00)"
            - "ProgressReport.${rep}.compliance_status == ON_TRACK"
            - "the ProgressReport response body carries id and created_at but NO version and NO updated_at field (common_fields: false)"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:

      - name: appointment_arrive_depends_on_verification_crew_status
        grounds:
          - validations.priority_60_ERR_CREW_INACTIVE
          - state_machines.VerificationAppointment.state.SCHEDULED_to_ON_SITE
          - endpoints.POST_lsl_verification_crews_id_status
          - entities.VerificationCrew.fields.status
        distinguishing_aspect: |
          Entity pair VerificationAppointment -> VerificationCrew. The appointment's own
          state is a perfectly legal SCHEDULED and the acting FieldTechnician's X-User-ID
          matches crew_id, so nothing about the appointment blocks arrival; the operation
          is refused purely because a DIFFERENT entity (the crew) sits at status ==
          INACTIVE. Reactivating the crew makes the identical request succeed.
        test_recipe:
          setup:
            - "One WaterSystem and one ServiceLine."
            - "One VerificationCrew certified for POTHOLE holding a SCHEDULED appointment on that line."
            - "The crew has since been deactivated with POST /lsl/verification-crews/{id}/status, status = INACTIVE."
          setup_api_calls:
            - call: "POST /lsl/water-systems"
              payload: { pwsid: "IL2031015", system_name: "Windrow Water", compliance_deadline_date: "2027-10-16", baseline_lead_and_grr_count: 100, disadvantaged_tract_codes: [], funding_mode: "WATERFALL" }
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { ws: $.data.id }
            - call: "POST /lsl/service-lines"
              payload: { water_system_id: "${ws}", address_label: "101 Elm St", census_tract_code: "17031-9900" }
              as: InventoryAnalyst
              as_user_id: "analyst-1"
              captures: { l1: $.data.id }
            - call: "POST /lsl/verification-crews"
              payload: { water_system_id: "${ws}", crew_name: "Crew Bravo", shift_start_utc_time: "08:00", shift_end_utc_time: "18:00", daily_appointment_capacity: 5, certified_methods: ["POTHOLE"] }
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { crew: $.data.id }
            - call: "POST /lsl/verification-appointments"
              payload: { service_line_id: "${l1}", crew_id: "${crew}", method: "POTHOLE", window_start_utc: "2026-08-05T09:00:00Z", window_end_utc: "2026-08-05T10:00:00Z" }
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { appt: $.data.id, appt_state_before: $.data.state }
            - call: "POST /lsl/verification-crews/${crew}/status"
              payload: { status: "INACTIVE" }
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { crew_status: $.data.status }
          trigger:
            - call: "POST /lsl/verification-appointments/${appt}/arrive"
              payload: {}
              as: FieldTechnician
              as_user_id: "${crew}"
              captures: { err: $.data.error_id }
          assert:
            - "${appt_state_before} == SCHEDULED"
            - "${crew_status} == INACTIVE"
            - "HTTP status is 409"
            - "${err} == ERR_CREW_INACTIVE"
            - "${err} != ERR_APPOINTMENT_STATE_INVALID (the appointment itself is in the correct SCHEDULED from-state)"
            - "${err} != ERR_CREW_IDENTITY_MISMATCH (X-User-ID equals appointment.crew_id)"
            - "VerificationAppointment.${appt}.state == SCHEDULED (unchanged)"

      - name: publication_certify_depends_on_sampling_batch_state
        grounds:
          - validations.priority_60_ERR_UNVALIDATED_SAMPLING_STRATUM
          - state_machines.InventoryPublication.state.DRAFT_to_CERTIFIED
          - state_machines.SamplingBatch.state.OPEN_to_VALIDATED
          - entities.SamplingBatch.fields.state
        distinguishing_aspect: |
          A different entity pair, InventoryPublication -> SamplingBatch, and a different
          direction of dependency: the publication is a valid DRAFT authored by a different
          user than the certifier, so segregation of duties and the publication's own
          from-state both pass; certification is refused only because the water system's
          statistical stratum is still OPEN rather than VALIDATED.
        test_recipe:
          setup:
            - "One WaterSystem advanced to VALIDATION_PENDING with one LEAD ServiceLine."
            - "One SamplingBatch for that system left at state == OPEN with zero samples appended, so it is neither VALIDATED nor REJECTED."
            - "One DRAFT InventoryPublication drafted by analyst-1."
          setup_api_calls:
            - call: "POST /lsl/water-systems"
              payload: { pwsid: "IL2031016", system_name: "Pinehollow Water", compliance_deadline_date: "2027-10-16", baseline_lead_and_grr_count: 100, disadvantaged_tract_codes: [], funding_mode: "WATERFALL" }
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { ws: $.data.id }
            - call: "POST /lsl/service-lines"
              payload: { water_system_id: "${ws}", address_label: "101 Elm St", census_tract_code: "17031-9900" }
              as: InventoryAnalyst
              as_user_id: "analyst-1"
              captures: { l1: $.data.id }
            - call: "POST /lsl/evidence-items"
              payload: { service_line_id: "${l1}", source_type: "HISTORIC_RECORD", side: "UTILITY", observed_material: "LEAD", observed_at: "2026-06-01T00:00:00Z" }
              as: InventoryAnalyst
              as_user_id: "analyst-1"
            - call: "POST /lsl/sampling-batches"
              payload: { water_system_id: "${ws}", stratum_code: "STR-A", stratum_line_count: 20 }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { batch: $.data.id, batch_state: $.data.state, valid_count: $.data.valid_sample_count }
            - call: "POST /lsl/water-systems/${ws}/advance-inventory-status"
              payload: { target_status: "VALIDATION_PENDING" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { ws_v: $.data.version }
            - call: "POST /lsl/inventory-publications"
              payload: { water_system_id: "${ws}", basis: "RECORDS", reporting_period_label: "2026-H2", expected_water_system_version: "${ws_v}" }
              as: InventoryAnalyst
              as_user_id: "analyst-1"
              captures: { pub: $.data.id, pub_state: $.data.state, drafter: $.data.drafted_by_user_id }
          trigger:
            - call: "POST /lsl/inventory-publications/${pub}/certify"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { err: $.data.error_id }
          assert:
            - "${batch_state} == OPEN and ${valid_count} == 0"
            - "${pub_state} == DRAFT and ${drafter} == analyst-1"
            - "HTTP status is 409"
            - "${err} == ERR_UNVALIDATED_SAMPLING_STRATUM"
            - "${err} != ERR_SEGREGATION_OF_DUTIES (officer-1 did not draft the publication)"
            - "${err} != ERR_PUBLICATION_STATE_INVALID (DRAFT is the correct from-state)"
            - "InventoryPublication.${pub}.state == DRAFT and InventoryPublication.${pub}.notifiable_line_count == null"

      - name: replacement_order_creation_depends_on_water_system_inventory_status
        grounds:
          - validations.priority_60_ERR_INVENTORY_NOT_PUBLISHED
          - state_machines.ServiceLine.replacement_state.ELIGIBLE_to_IN_PROGRAM
          - entities.WaterSystem.fields.inventory_status
          - calculations.program_posture
        distinguishing_aspect: |
          A third entity pair, ReplacementOrder -> WaterSystem, gated on the PARENT's
          lifecycle rather than on a sibling's: the ServiceLine is a perfectly eligible
          LEAD line and program_posture has already left FROZEN (the system is
          VALIDATION_PENDING, unknown_count is 0 and there are no funding sources), yet the
          order is refused because inventory_status has not yet reached PUBLISHED. This
          encodes "replacement may not precede publication".
        test_recipe:
          setup:
            - "One WaterSystem advanced to VALIDATION_PENDING but never published."
            - "One LEAD ServiceLine at replacement_state == ELIGIBLE."
            - "No FundingSource rows and no CustomerNotification rows, so program_posture computes to OPEN and the posture rules cannot pre-empt the referential rule."
          setup_api_calls:
            - call: "POST /lsl/water-systems"
              payload: { pwsid: "IL2031017", system_name: "Stonecreek Water", compliance_deadline_date: "2027-10-16", baseline_lead_and_grr_count: 100, disadvantaged_tract_codes: [], funding_mode: "WATERFALL" }
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { ws: $.data.id }
            - call: "POST /lsl/service-lines"
              payload: { water_system_id: "${ws}", address_label: "101 Elm St", census_tract_code: "17031-9900" }
              as: InventoryAnalyst
              as_user_id: "analyst-1"
              captures: { l1: $.data.id }
            - call: "POST /lsl/evidence-items"
              payload: { service_line_id: "${l1}", source_type: "HISTORIC_RECORD", side: "UTILITY", observed_material: "LEAD", observed_at: "2026-06-01T00:00:00Z" }
              as: InventoryAnalyst
              as_user_id: "analyst-1"
              captures: { ev1: $.data.id }
            - call: "POST /lsl/water-systems/${ws}/advance-inventory-status"
              payload: { target_status: "VALIDATION_PENDING" }
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { status_mid: $.data.inventory_status, posture_mid: $.data.program_posture }
            - call: "GET /lsl/service-lines/${l1}"
              payload: {}
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { rep_before: $.data.replacement_state, cls_before: $.data.classification }
          trigger:
            - call: "POST /lsl/replacement-orders"
              payload: { service_line_id: "${l1}", estimated_cost_cents: 100000, excavation_start_date: "2026-08-10", excavation_end_date: "2026-08-11" }
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { err: $.data.error_id }
          assert:
            - "${status_mid} == VALIDATION_PENDING"
            - "${posture_mid} == OPEN"
            - "${cls_before} == LEAD and ${rep_before} == ELIGIBLE"
            - "HTTP status is 409"
            - "${err} == ERR_INVENTORY_NOT_PUBLISHED"
            - "${err} != ERR_LINE_NOT_ELIGIBLE (the line is ELIGIBLE)"
            - "${err} != ERR_PROGRAM_POSTURE_FROZEN (posture already left FROZEN when the system left DRAFT)"
            - "ServiceLine.${l1}.replacement_state == ELIGIBLE (no IN_PROGRAM transition occurred)"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:

      - name: crew_window_overlap_uses_half_open_interval_plus_45_minute_travel_buffer
        grounds:
          - validations.priority_75_ERR_CREW_WINDOW_CONFLICT
          - endpoints.POST_lsl_verification_appointments
          - entities.VerificationAppointment.fields.window_end_utc
          - entities.VerificationCrew.fields.scheduled_appointment_count
        distinguishing_aspect: |
          Interval semantics: half-open instants [start, end) on the VerificationCrew
          resource, asymmetrically widened by a 45-minute travel buffer on the EXISTING
          appointment's end only. The 10:45:00Z booking that starts exactly at
          10:00 + 45 minutes must SUCCEED (the comparison is strict <), while a
          10:44:00Z..10:45:00Z booking must FAIL against the 09:00-10:00 appointment and
          must NOT conflict with the 10:45-11:30 one (its end 10:45 is not > 10:45).
        test_recipe:
          setup:
            - "One WaterSystem and one ServiceLine."
            - "One ACTIVE VerificationCrew, shift 08:00-18:00 UTC, daily_appointment_capacity 5, certified_methods = [VISUAL_INSPECTION]."
            - "Appointment 1 occupies 2026-08-05T09:00:00Z..10:00:00Z; its buffered end is 10:45:00Z."
            - "Appointment 2 is booked at exactly 2026-08-05T10:45:00Z..11:30:00Z and MUST be accepted — this is the positive edge of the buffer."
          setup_api_calls:
            - call: "POST /lsl/water-systems"
              payload: { pwsid: "IL2031018", system_name: "Alderbrook Water", compliance_deadline_date: "2027-10-16", baseline_lead_and_grr_count: 100, disadvantaged_tract_codes: [], funding_mode: "WATERFALL" }
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { ws: $.data.id }
            - call: "POST /lsl/service-lines"
              payload: { water_system_id: "${ws}", address_label: "101 Elm St", census_tract_code: "17031-9900" }
              as: InventoryAnalyst
              as_user_id: "analyst-1"
              captures: { l1: $.data.id }
            - call: "POST /lsl/verification-crews"
              payload: { water_system_id: "${ws}", crew_name: "Crew Charlie", shift_start_utc_time: "08:00", shift_end_utc_time: "18:00", daily_appointment_capacity: 5, certified_methods: ["VISUAL_INSPECTION"] }
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { crew: $.data.id }
            - call: "POST /lsl/verification-appointments"
              payload: { service_line_id: "${l1}", crew_id: "${crew}", method: "VISUAL_INSPECTION", window_start_utc: "2026-08-05T09:00:00Z", window_end_utc: "2026-08-05T10:00:00Z" }
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { appt1: $.data.id }
            - call: "POST /lsl/verification-appointments"
              payload: { service_line_id: "${l1}", crew_id: "${crew}", method: "VISUAL_INSPECTION", window_start_utc: "2026-08-05T10:45:00Z", window_end_utc: "2026-08-05T11:30:00Z" }
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { appt2: $.data.id, appt2_state: $.data.state }
            - call: "GET /lsl/verification-crews/${crew}"
              payload: {}
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { count_before: $.data.scheduled_appointment_count }
          trigger:
            - call: "POST /lsl/verification-appointments"
              payload: { service_line_id: "${l1}", crew_id: "${crew}", method: "VISUAL_INSPECTION", window_start_utc: "2026-08-05T10:44:00Z", window_end_utc: "2026-08-05T10:45:00Z" }
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { err: $.data.error_id }
          assert:
            - "${appt2_state} == SCHEDULED (10:45:00Z is exactly 09:00-10:00 plus the 45-minute buffer and must be accepted)"
            - "${count_before} == 2"
            - "HTTP status is 409"
            - "${err} == ERR_CREW_WINDOW_CONFLICT"
            - "${err} != ERR_CREW_DAILY_CAPACITY_EXCEEDED (2 < 5, so the priority-78 aggregate rule does not fire)"
            - "${err} != ERR_CREW_OUTSIDE_SHIFT (10:44-10:45 sits inside 08:00-18:00)"
            - "the conflict is with ${appt1} only — the trigger window's end 10:45:00Z is NOT strictly greater than ${appt2}'s start 10:45:00Z, so ${appt2} does not overlap it"
            - "VerificationCrew.${crew}.scheduled_appointment_count == 2 (no third appointment row was created)"

      - name: street_project_excavation_capacity_uses_closed_inclusive_date_overlap
        grounds:
          - validations.priority_78_ERR_EXCAVATION_CAPACITY_EXCEEDED
          - endpoints.POST_lsl_replacement_orders_id_schedule
          - entities.StreetProject.fields.max_concurrent_excavations
          - entities.StreetProject.fields.active_excavation_order_count
        distinguishing_aspect: |
          Different interval semantics on a different resource entity: closed inclusive
          CALENDAR-DATE windows aggregated per date against StreetProject
          max_concurrent_excavations, rather than half-open instants with a travel buffer on
          a crew. The two windows 2026-08-10..08-12 and 2026-08-12..08-14 touch on exactly
          one shared date (08-12), which is enough to breach a capacity of 1; shifting the
          second window to 08-13..08-14 would pass.
        test_recipe:
          setup:
            - "WaterSystem with a PUBLISHED inventory and both of its notifications delivered, so program_posture == OPEN and corrosion control is NOT_REQUIRED."
            - "One StreetProject with max_concurrent_excavations = 1, moratorium 2026-12-01..2026-12-31 (deliberately far from August) and paving_start_date 2027-03-01."
            - "Two LEAD ServiceLine rows, both linked to that street project."
            - "Order A is already SCHEDULED for the closed window 2026-08-10..2026-08-12."
            - "Order B is FUNDED and linked to the same street project, awaiting a window."
