              as: CastingDirector
              captures: { app_a: $.data.id }
            - call: "POST /casting/applicants"
              payload: { casting_call_id: "${call_id}", legal_name: "Bo Lindqvist", date_of_birth: "1990-01-10", residency_state_code: "GA" }
              as: CastingDirector
              captures: { app_b: $.data.id }
            - call: "GET /casting/applicants/${app_a}"
              payload: {}
              as: BusinessAffairs
              captures: { ver_a: $.data.version }
            - call: "POST /casting/participant-agreements"
              payload: { applicant_id: "${app_a}", production_id: "${prod_id}", exclusivity_window_days: 0, confidentiality_tier: "STANDARD", depiction_rights_scope: "FULL", stipend_structure: "PER_EPISODE", base_stipend_cents: 100000, episodes_committed: 2, expected_applicant_version: "${ver_a}" }
              as: BusinessAffairs
              as_user_id: "ba_1"
              captures: { agr_a: $.data.id }
            - call: "GET /casting/applicants/${app_b}"
              payload: {}
              as: BusinessAffairs
              captures: { ver_b: $.data.version }
            - call: "POST /casting/participant-agreements"
              payload: { applicant_id: "${app_b}", production_id: "${prod_id}", exclusivity_window_days: 0, confidentiality_tier: "STANDARD", depiction_rights_scope: "FULL", stipend_structure: "PER_EPISODE", base_stipend_cents: 100000, episodes_committed: 2, expected_applicant_version: "${ver_b}" }
              as: BusinessAffairs
              as_user_id: "ba_1"
              captures: { agr_b: $.data.id }
          trigger:
            - call: "GET /casting/applicants/${app_b}"
              payload: {}
