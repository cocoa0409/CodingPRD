scenario: "Laboratory Results & Critical Value Notification: order entry, sample transport chain, result release, critical value SMS/phone notification, acknowledgement receipt, retest workflow, CLIA compliance."

domain_name: lab-results-critical-value
api_prefix: ""

# -----------------------------------------------------------------------------
# Step 0 — Complexity Profile
# -----------------------------------------------------------------------------
complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation
    - rate_threshold_triggers
    - optimistic_concurrency
    - scheduled_actions
  entity_topology: hybrid
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - self_referential
  role_model: peer_roles
  consistency_model: immediate

# -----------------------------------------------------------------------------
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# -----------------------------------------------------------------------------
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# -----------------------------------------------------------------------------
# §1.1 Entity-Relationship Table
# -----------------------------------------------------------------------------
entities:

  - name: Patient
    parent: null
    common_fields: true
    fields:
      - name: mrn
        type: string
        source: input
        description: "Medical record number; uniquely identifies a patient. Pattern `MRN-[A-Z0-9]{6}`."
        constraints: "unique across all Patients"
      - name: full_name
        type: string
        source: input
        description: "Patient legal name."
      - name: date_of_birth
        type: string
        source: input
        description: "ISO 8601 date (YYYY-MM-DD)."
      - name: age_band
        type: enum
        source: computed
        description: "Age bracket derived from date_of_birth at the time of result release: NEONATE (<28 days), INFANT (<1y), PEDIATRIC (<18y), ADULT (>=18y). Recomputed on each Result.release."
        constraints: "values: NEONATE, INFANT, PEDIATRIC, ADULT"
      - name: results_release_count
        type: integer
        source: computed
        default: 0
        description: "Count of Result rows where Result.lab_order.patient_id == this Patient.id AND Result.status == RELEASED. Maintained by §1.3 patient_results_release_count_recompute (incremented on every Result release, decremented when a release is invalidated by amendment)."
      - name: critical_incidents_count
        type: integer
        source: computed
        default: 0
        description: "Count of CriticalNotification rows where Notification.result.lab_order.patient_id == this Patient.id AND Notification.status IN {SENT, ACKNOWLEDGED, ESCALATED}. Incremented when notification reaches SENT; never decremented."

  - name: Clinician
    parent: null
    common_fields: true
    fields:
      - name: npi
        type: string
        source: input
        description: "National Provider Identifier (10 digits)."
        constraints: "unique across all Clinicians"
      - name: full_name
        type: string
        source: input
        description: "Clinician legal name."
      - name: role_type
        type: enum
        source: input
        description: "Clinician sub-role: ORDERING_PROVIDER, PHLEBOTOMIST, LAB_TECH, LAB_DIRECTOR."
        constraints: "values: ORDERING_PROVIDER, PHLEBOTOMIST, LAB_TECH, LAB_DIRECTOR"
      - name: phone_e164
        type: string
        source: input
        description: "E.164 phone number for SMS/PHONE notification delivery."
        constraints: "pattern `\\+[1-9][0-9]{1,14}`"
      - name: backup_clinician_id
        type: string
        source: input
        description: "FK -> Clinician.id; the escalation target when this clinician fails to acknowledge a CriticalNotification before ack_deadline_at. May be null only for clinicians with role_type=LAB_DIRECTOR."

  - name: LabOrder
    parent: Patient
    common_fields: true
    fields:
      - name: patient_id
        type: string
        source: input
        description: "FK -> Patient.id"
      - name: ordering_clinician_id
        type: string
        source: input
        description: "FK -> Clinician.id; MUST reference a Clinician with role_type=ORDERING_PROVIDER."
      - name: panel_code
        type: enum
        source: input
        description: "Lab panel: CMP (comprehensive metabolic), CBC (complete blood count), TROP (troponin), GLUC (glucose)."
        constraints: "values: CMP, CBC, TROP, GLUC"
      - name: priority
        type: enum
        source: input
        description: "Order priority: STAT (≤60 min TAT target), ROUTINE (≤240 min TAT target)."
        constraints: "values: STAT, ROUTINE"
        default: "ROUTINE"
      - name: status
        type: enum
        source: system
        description: "Order lifecycle: DRAFT, ACCESSIONED, RESULTED, CANCELLED."
        default: "DRAFT"
        constraints: "values: DRAFT, ACCESSIONED, RESULTED, CANCELLED"
      - name: ordered_at
        type: datetime
        source: system
        description: "ISO 8601 UTC; server clock at POST /patients/{id}/lab-orders."
      - name: specimens_count
        type: integer
        source: computed
        default: 0
        description: "Count of Specimens where Specimen.lab_order_id == this LabOrder.id AND Specimen.status != REJECTED. Recomputed by §1.3 order_specimens_count_recompute on every Specimen transition into or out of REJECTED."
      - name: accessioned_count
        type: integer
        source: computed
        default: 0
        description: "Count of Specimens where Specimen.lab_order_id == this LabOrder.id AND Specimen.status == ACCESSIONED. Used by §1.3 conservation invariant (rule 9a)."
      - name: turn_around_time_minutes
        type: integer
        source: computed
        description: "Minutes between ordered_at and the first Result.released_at for this order. Null until first release. Pinned by §1.3 turn_around_time_compute."
      - name: compliance_incident
        type: boolean
        source: computed
        default: false
        description: "True if any CriticalNotification on a Result of this order reached ESCALATED status (CLIA documentation incident). Set by the ESCALATED transition; never cleared once set."

  - name: Specimen
    parent: LabOrder
    common_fields: true
    fields:
      - name: lab_order_id
        type: string
        source: input
        description: "FK -> LabOrder.id"
      - name: collector_clinician_id
        type: string
        source: input
        description: "FK -> Clinician.id; MUST reference a Clinician with role_type=PHLEBOTOMIST."
      - name: container_code
        type: enum
        source: input
        description: "Tube color/additive: RED (serum), LAVENDER (EDTA whole blood), GREEN (heparin), GRAY (fluoride)."
        constraints: "values: RED, LAVENDER, GREEN, GRAY"
      - name: status
        type: enum
        source: system
        description: "Specimen chain-of-custody state."
        default: "DRAFT"
        constraints: "values: DRAFT, COLLECTED, IN_TRANSIT, ACCESSIONED, REJECTED"
      - name: collected_at
        type: datetime
        source: system
        description: "ISO 8601 UTC; server clock at POST /specimens/{id}/collect."
      - name: accessioned_at
        type: datetime
        source: system
        description: "ISO 8601 UTC; server clock at POST /specimens/{id}/accession. Pins the start of §1.3 turn_around_time."
      - name: reject_reason
        type: enum
        source: input
        description: "HEMOLYZED, CLOTTED, INSUFFICIENT_VOLUME, MISLABELED. Required at POST /specimens/{id}/reject."
        constraints: "values: HEMOLYZED, CLOTTED, INSUFFICIENT_VOLUME, MISLABELED"

  - name: Instrument
    parent: null
    common_fields: true
    fields:
      - name: instrument_code
        type: string
        source: input
        description: "Stable instrument identifier (e.g., `BCM-7`)."
        constraints: "unique across all Instruments"
      - name: analyte_panels_supported
        type: array
        source: input
        description: "Array of panel_code enum values this instrument can run: subset of {CMP, CBC, TROP, GLUC}."
      - name: qc_buffer_minutes
        type: integer
        source: input
        default: 5
        description: "Minutes of mandatory cooldown buffer between consecutive InstrumentRun rows on this Instrument. Used by §1.4 priority 7 overlap check on a single resource (rule 8a). Range 0..60."

  - name: InstrumentRun
    parent: null
    common_fields: true
    fields:
      - name: instrument_id
        type: string
        source: input
        description: "FK -> Instrument.id"
      - name: specimen_id
        type: string
        source: input
        description: "FK -> Specimen.id; the Specimen must be in status=ACCESSIONED at the moment of POST /instrument-runs."
      - name: scheduled_start
        type: datetime
        source: input
        description: "ISO 8601 UTC; planned run start. Half-open interval [scheduled_start, scheduled_end) is the booking window."
      - name: scheduled_end
        type: datetime
        source: input
        description: "ISO 8601 UTC; planned run end. MUST be strictly greater than scheduled_start."
      - name: status
        type: enum
        source: system
        description: "Run lifecycle."
        default: "SCHEDULED"
        constraints: "values: SCHEDULED, IN_PROGRESS, COMPLETED, FAILED"

  - name: Result
    parent: LabOrder
    common_fields: true
    fields:
      - name: lab_order_id
        type: string
        source: input
        description: "FK -> LabOrder.id"
      - name: specimen_id
        type: string
        source: input
        description: "FK -> Specimen.id"
      - name: run_id
        type: string
        source: input
        description: "FK -> InstrumentRun.id"
      - name: analyte_code
        type: enum
        source: input
        description: "Analyte being measured: K (potassium mmol/L), GLUCOSE (mg/dL), TROPONIN (ng/mL), HGB (hemoglobin g/dL)."
        constraints: "values: K, GLUCOSE, TROPONIN, HGB"
      - name: numeric_value
        type: number
        source: input
        description: "Measured numeric result. Precision: 2 decimal places."
      - name: unit
        type: string
        source: input
        description: "Unit of measure; MUST match the canonical unit for analyte_code (e.g., K → `mmol/L`)."
      - name: reference_low
        type: number
        source: input
        description: "Lower bound of normal reference range."
      - name: reference_high
        type: number
        source: input
        description: "Upper bound of normal reference range. MUST be > reference_low."
      - name: critical_low
        type: number
        source: input
        description: "Critical-low threshold (numeric_value <= critical_low → CRITICAL_LOW)."
      - name: critical_high
        type: number
        source: input
        description: "Critical-high threshold (numeric_value >= critical_high → CRITICAL_HIGH). MUST be > critical_low."
      - name: criticality
        type: enum
        source: computed
        description: "Computed by §1.3 criticality_classify on Result release. Values: NORMAL, ABNORMAL, CRITICAL_LOW, CRITICAL_HIGH, PANIC."
        constraints: "values: NORMAL, ABNORMAL, CRITICAL_LOW, CRITICAL_HIGH, PANIC"
      - name: status
        type: enum
        source: system
        description: "Result lifecycle (parallel dimension to LabOrder.status)."
        default: "PROVISIONAL"
        constraints: "values: PROVISIONAL, RELEASED, AMENDED, INVALIDATED"
      - name: released_at
        type: datetime
        source: system
        description: "ISO 8601 UTC; server clock at POST /results/{id}/release. Null until release."
      - name: amended_from_result_id
        type: string
        source: input
        description: "FK -> Result.id; populated only on results created via POST /results/{id}/amend. Self-referential FK forming the amendment chain."

  - name: CriticalNotification
    parent: Result
    common_fields: true
    fields:
      - name: result_id
        type: string
        source: input
        description: "FK -> Result.id"
      - name: recipient_clinician_id
        type: string
        source: input
        description: "FK -> Clinician.id; the LabOrder.ordering_clinician_id at the moment of Result release."
      - name: channel
        type: enum
        source: input
        description: "Delivery channel: SMS or PHONE. STAT-priority orders REQUIRE channel=PHONE per §1.4 priority 5 (safety)."
        constraints: "values: SMS, PHONE"
      - name: status
        type: enum
        source: system
        description: "Notification lifecycle."
        default: "PENDING"
        constraints: "values: PENDING, SENT, ACKNOWLEDGED, ESCALATED, VOIDED"
      - name: sent_at
        type: datetime
        source: system
        description: "ISO 8601 UTC; server clock at POST /critical-notifications/{id}/send."
      - name: ack_deadline_at
        type: datetime
        source: computed
        description: "ISO 8601 UTC; computed by §1.3 ack_deadline_compute as sent_at + 30 minutes (PHONE) or sent_at + 60 minutes (SMS)."
      - name: attempt_count
        type: integer
        source: computed
        default: 0
        description: "Total send attempts (initial + retries). Incremented by POST /critical-notifications/{id}/send and POST /critical-notifications/{id}/retry."
      - name: escalation_target_clinician_id
        type: string
        source: computed
        description: "FK -> Clinician.id; populated by ESCALATED transition as recipient_clinician_id.backup_clinician_id at the moment of escalation."

  - name: AcknowledgementReceipt
    parent: CriticalNotification
    common_fields: false
    fields:
      - name: critical_notification_id
        type: string
        source: input
        description: "FK -> CriticalNotification.id"
      - name: acknowledging_clinician_id
        type: string
        source: input
        description: "FK -> Clinician.id; the X-User-ID of the acknowledging clinician, captured from the POST request headers."
      - name: ack_method
        type: enum
        source: input
        description: "How the ack was received: SMS_REPLY, IVR_KEYPRESS, WEB_UI."
        constraints: "values: SMS_REPLY, IVR_KEYPRESS, WEB_UI"
      - name: attestation_text
        type: string
        source: input
        description: "Free-text attestation captured at ack time; mandatory for CLIA documentation. 1..500 chars."

  - name: RetestRequest
    parent: Result
    common_fields: true
    fields:
      - name: original_result_id
        type: string
        source: input
        description: "FK -> Result.id; the Result the retest is auditing. MUST be in status IN {RELEASED, AMENDED}."
      - name: new_order_id
        type: string
        source: computed
        description: "FK -> LabOrder.id; populated when the retest workflow creates a fresh LabOrder. Null until SCHEDULED."
      - name: reason
        type: enum
        source: input
        description: "DELTA_CHECK_FAIL, CLINICIAN_DOUBT, INSTRUMENT_QC_FAIL."
        constraints: "values: DELTA_CHECK_FAIL, CLINICIAN_DOUBT, INSTRUMENT_QC_FAIL"
      - name: status
        type: enum
        source: system
        description: "Retest workflow lifecycle."
        default: "REQUESTED"
        constraints: "values: REQUESTED, SCHEDULED, COMPLETED, CANCELLED"

# -----------------------------------------------------------------------------
# §1.2 State Machine Table
# -----------------------------------------------------------------------------
state_machines:

  - entity: LabOrder
    initial_state: DRAFT
    terminal_states: [RESULTED, CANCELLED]
    transitions:
      - from: DRAFT
        to: ACCESSIONED
        trigger: "POST /specimens/{id}/accession (any specimen of this order transitions to ACCESSIONED)"
        actor: LabTech
        preconditions:
          - "Specimen.lab_order_id resolves to this LabOrder.id"
          - "LabOrder.status == DRAFT"
        side_effects:
          - "LabOrder.status -> ACCESSIONED"
          - "Recompute LabOrder.accessioned_count and LabOrder.specimens_count per §1.3 order_specimens_count_recompute"
          - "LabOrder.version += 1; updated_at refreshed"
      - from: ACCESSIONED
        to: RESULTED
        trigger: "POST /results/{id}/release (first Result on this order reaches RELEASED)"
        actor: LabTech
        preconditions:
          - "At least one Result.lab_order_id == this LabOrder.id AND Result.status == RELEASED"
        side_effects:
          - "LabOrder.status -> RESULTED"
          - "Compute LabOrder.turn_around_time_minutes per §1.3 turn_around_time_compute"
          - "LabOrder.version += 1; updated_at refreshed"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /lab-orders/{id}/cancel"
        actor: OrderingProvider
        preconditions:
          - "LabOrder.status == DRAFT"
          - "No Specimen of this LabOrder is in status ACCESSIONED"
        side_effects:
          - "LabOrder.status -> CANCELLED"
          - "All Specimens with status IN {DRAFT, COLLECTED, IN_TRANSIT} are cascaded to REJECTED with reject_reason=MISLABELED (treated as orphaned)"
          - "LabOrder.version += 1; updated_at refreshed"
      - from: ACCESSIONED
        to: CANCELLED
        trigger: "POST /lab-orders/{id}/cancel — only if cancellation cause is upstream Specimen rejection cascade (system actor)"
        actor: system
        preconditions:
          - "Triggered as the SECOND HOP of the cascade `POST /specimens/{id}/reject` on a specimen whose rejection leaves order.specimens_count == 0"
        side_effects:
          - "LabOrder.status -> CANCELLED"
          - "Any CriticalNotification on this order's Results with status IN {PENDING, SENT} cascades to VOIDED (THIRD HOP — see CriticalNotification.PENDING_to_VOIDED and CriticalNotification.SENT_to_VOIDED transitions)"
          - "LabOrder.version += 1; updated_at refreshed"

  - entity: Specimen
    initial_state: DRAFT
    terminal_states: [REJECTED]
    transitions:
      - from: DRAFT
        to: COLLECTED
        trigger: "POST /specimens/{id}/collect"
        actor: Phlebotomist
        preconditions:
          - "Specimen.status == DRAFT"
          - "LabOrder.status == DRAFT"
          - "Acting Phlebotomist's id == Specimen.collector_clinician_id (X-User-ID match)"
        side_effects:
          - "Specimen.status -> COLLECTED"
          - "Specimen.collected_at = current clock"
          - "Specimen.version += 1"
      - from: COLLECTED
        to: IN_TRANSIT
        trigger: "POST /specimens/{id}/transit"
        actor: Phlebotomist
        preconditions:
          - "Specimen.status == COLLECTED"
        side_effects:
          - "Specimen.status -> IN_TRANSIT"
          - "Specimen.version += 1"
      - from: IN_TRANSIT
        to: ACCESSIONED
        trigger: "POST /specimens/{id}/accession"
        actor: LabTech
        preconditions:
          - "Specimen.status == IN_TRANSIT"
          - "LabOrder.status IN {DRAFT, ACCESSIONED}"
        side_effects:
          - "Specimen.status -> ACCESSIONED"
          - "Specimen.accessioned_at = current clock"
          - "LabOrder transitions DRAFT->ACCESSIONED if currently DRAFT (cross-entity SECOND HOP)"
          - "LabOrder.accessioned_count += 1, LabOrder.specimens_count += 1 per §1.3"
          - "Specimen.version += 1"
      - from: COLLECTED
        to: REJECTED
        trigger: "POST /specimens/{id}/reject"
        actor: LabTech
        preconditions:
          - "Specimen.status IN {COLLECTED, IN_TRANSIT, ACCESSIONED}"
          - "reject_reason in {HEMOLYZED, CLOTTED, INSUFFICIENT_VOLUME, MISLABELED}"
        side_effects:
          - "Specimen.status -> REJECTED"
          - "Specimen.reject_reason = input"
          - "If LabOrder.specimens_count drops to 0, LabOrder transitions ACCESSIONED->CANCELLED (SECOND HOP, system actor)"
          - "Per §1.3 conservation_specimen_accession (rule 9a): if previous status was ACCESSIONED, LabOrder.accessioned_count -= 1"
          - "Specimen.version += 1"
      - from: IN_TRANSIT
        to: REJECTED
        trigger: "POST /specimens/{id}/reject"
        actor: LabTech
        preconditions:
          - "Specimen.status == IN_TRANSIT"
        side_effects:
          - "Specimen.status -> REJECTED"
          - "Specimen.reject_reason = input"
          - "Cascade as above (no accessioned_count change since not previously ACCESSIONED)"
      - from: ACCESSIONED
        to: REJECTED
        trigger: "POST /specimens/{id}/reject"
        actor: LabTech
        preconditions:
          - "Specimen.status == ACCESSIONED"
          - "No Result.specimen_id == this Specimen.id AND Result.status == RELEASED (rejection of an ACCESSIONED specimen with a released Result is forbidden — must amend first)"
        side_effects:
          - "Specimen.status -> REJECTED"
          - "LabOrder.accessioned_count -= 1 (§1.3 rule 9a conservation)"
          - "If LabOrder.specimens_count drops to 0 → LabOrder ACCESSIONED->CANCELLED (SECOND HOP)"
          - "If LabOrder cancelled and any CriticalNotification on its Results in PENDING|SENT → VOIDED (THIRD HOP)"

  - entity: Result
    initial_state: PROVISIONAL
    terminal_states: [INVALIDATED]
    transitions:
      - from: PROVISIONAL
        to: RELEASED
        trigger: "POST /results/{id}/release"
        actor: LabTech
        preconditions:
          - "Result.status == PROVISIONAL"
          - "Specimen.status == ACCESSIONED (cross-entity dependency — rule 7 instance A)"
          - "InstrumentRun.status == COMPLETED"
          - "expected_lab_order_version matches LabOrder.version (OCC — §1.2.1 rule release-stale-order)"
        side_effects:
          - "Result.status -> RELEASED"
          - "Result.released_at = current clock"
          - "Compute Result.criticality per §1.3 criticality_classify"
          - "Patient.results_release_count += 1 (§1.3 patient_results_release_count_recompute, rule 9b conservation increment)"
          - "If criticality IN {CRITICAL_LOW, CRITICAL_HIGH, PANIC}: auto-create one CriticalNotification with status=PENDING, recipient_clinician_id = LabOrder.ordering_clinician_id, channel selected per panel rule"
          - "LabOrder transitions ACCESSIONED->RESULTED on first release"
          - "LabOrder.version += 1; Result.version += 1"
      - from: RELEASED
        to: AMENDED
        trigger: "POST /results/{id}/amend"
        actor: LabTech
        preconditions:
          - "Result.status == RELEASED"
          - "Caller supplies new numeric_value (the prior numeric_value is preserved by reference via amended_from_result_id)"
        side_effects:
          - "The current Result row is marked status=AMENDED (preserved for audit)"
          - "A NEW Result row is created with status=RELEASED, amended_from_result_id pointing to the prior row, identical lab_order_id/specimen_id/run_id, fresh criticality recomputed"
          - "Patient.results_release_count is NOT changed (old row leaves RELEASED, new row enters RELEASED — net 0 per §1.3 rule 9b conservation)"
          - "If prior CriticalNotification on the old row is still in {PENDING, SENT, ACKNOWLEDGED}: it is marked VOIDED and a fresh one is auto-created on the new row if the recomputed criticality is still critical"
          - "Result.version += 1 on both rows"
      - from: RELEASED
        to: INVALIDATED
        trigger: "POST /results/{id}/invalidate"
        actor: LabDirector
        preconditions:
          - "Result.status == RELEASED"
          - "Acting clinician role_type == LAB_DIRECTOR"
        side_effects:
          - "Result.status -> INVALIDATED"
          - "Patient.results_release_count -= 1 (§1.3 rule 9b conservation decrement)"
          - "Any CriticalNotification on this Result in PENDING|SENT is VOIDED"
          - "Result.version += 1"

  - entity: CriticalNotification
    initial_state: PENDING
    terminal_states: [ACKNOWLEDGED, ESCALATED, VOIDED]
    transitions:
      - from: PENDING
        to: SENT
        trigger: "POST /critical-notifications/{id}/send"
        actor: NotificationOperator
        preconditions:
          - "Notification.status == PENDING"
          - "Notification.result.status == RELEASED"
          - "If Notification.result.lab_order.priority == STAT, Notification.channel MUST equal PHONE (rule 5 instance A — safety vs state)"
        side_effects:
          - "Notification.status -> SENT"
          - "Notification.sent_at = current clock"
          - "Notification.ack_deadline_at = sent_at + (30 if channel=PHONE else 60) minutes per §1.3 ack_deadline_compute"
          - "Notification.attempt_count += 1"
          - "Patient.critical_incidents_count += 1 (first SENT only)"
      - from: SENT
        to: ACKNOWLEDGED
        trigger: "POST /critical-notifications/{id}/acknowledgements"
        actor: OrderingProvider
        preconditions:
          - "Notification.status == SENT"
          - "Current clock <= Notification.ack_deadline_at (rule 6 boundary: <= deadline, strictly before deadline+1 minute fails)"
          - "X-User-ID == Notification.recipient_clinician_id (entity_backed ownership)"
        side_effects:
          - "Notification.status -> ACKNOWLEDGED"
          - "Persist a new AcknowledgementReceipt row"
          - "Notification.version += 1"
      - from: SENT
        to: ESCALATED
        trigger: "POST /critical-notifications/{id}/escalate"
        actor: NotificationOperator
        preconditions:
          - "Notification.status == SENT"
          - "Current clock > Notification.ack_deadline_at"
          - "Notification.recipient_clinician.backup_clinician_id is not null"
        side_effects:
          - "Notification.status -> ESCALATED"
          - "Notification.escalation_target_clinician_id = recipient_clinician.backup_clinician_id"
          - "LabOrder.compliance_incident -> true (SECOND HOP of cascade — rule 4 instance B, depth 2)"
          - "Notification.attempt_count += 1"
      - from: PENDING
        to: VOIDED
        trigger: "system cascade from Result.RELEASED_to_INVALIDATED, Result.RELEASED_to_AMENDED, or LabOrder.ACCESSIONED_to_CANCELLED"
        actor: system
        preconditions:
          - "Notification.status == PENDING"
        side_effects:
          - "Notification.status -> VOIDED"
      - from: SENT
        to: VOIDED
        trigger: "system cascade — same triggers as PENDING->VOIDED"
        actor: system
        preconditions:
          - "Notification.status == SENT"
          - "Notification.ack_deadline_at not yet reached OR upstream invalidation"
        side_effects:
          - "Notification.status -> VOIDED"

  - entity: RetestRequest
    initial_state: REQUESTED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: REQUESTED
        to: SCHEDULED
        trigger: "POST /retest-requests/{id}/schedule"
        actor: LabTech
        preconditions:
          - "RetestRequest.status == REQUESTED"
          - "Original Result.status IN {RELEASED, AMENDED}"
        side_effects:
          - "A new LabOrder is auto-created with patient_id and ordering_clinician_id copied from the original LabOrder, panel_code copied, priority=STAT"
          - "RetestRequest.new_order_id = new LabOrder.id"
          - "RetestRequest.status -> SCHEDULED"
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /retest-requests/{id}/complete"
        actor: LabTech
        preconditions:
          - "RetestRequest.status == SCHEDULED"
          - "The new LabOrder.status == RESULTED"
        side_effects:
          - "RetestRequest.status -> COMPLETED"
      - from: REQUESTED
        to: CANCELLED
        trigger: "POST /retest-requests/{id}/cancel"
        actor: OrderingProvider
        preconditions:
          - "RetestRequest.status == REQUESTED"
        side_effects:
          - "RetestRequest.status -> CANCELLED"

# -----------------------------------------------------------------------------
# §1.2.1 Concurrency Rules (true OCC races only)
# -----------------------------------------------------------------------------
concurrency_rules:

  - rule_id: release-stale-lab-order
    parent_entity: LabOrder
    write_endpoint: "POST /results/{id}/release"
    occ_field: "expected_lab_order_version"
    description: |
      Releasing a Result against a LabOrder whose version has advanced since
      the client last observed it is rejected. This captures the create-with-
      supersede case where another writer has just released a different Result
      on the same order (legitimately advancing LabOrder.status DRAFT->ACCESSIONED
      or ACCESSIONED->RESULTED and bumping LabOrder.version via the §1.3 cascade)
      and the current writer's view of the order is therefore stale.
    error_id: ERR_STALE_LAB_ORDER_VERSION
    http_status: 412

  - rule_id: amend-stale-result
    parent_entity: Result
    write_endpoint: "POST /results/{id}/amend"
    occ_field: "expected_result_version"
    description: |
      Amending a Result whose version has advanced since the client last
      observed it is rejected. This captures the case where another writer
      has already amended the same Result (legitimately bumping Result.version
      and creating a fresh RELEASED descendant) and the current writer's view
      of the result is stale.
    error_id: ERR_STALE_RESULT_VERSION
    http_status: 412

# -----------------------------------------------------------------------------
# §1.3 Calculation Rules Table
# -----------------------------------------------------------------------------
calculations:

  - name: criticality_classify
    trigger: "Result transitions PROVISIONAL->RELEASED (also re-runs on amendment)"
    algorithm: threshold
    formula: |
      # Inputs: numeric_value, critical_low, critical_high, reference_low,
      #         reference_high, patient.age_band, analyte_code
      # Two-stage evaluation order pinned by rule 2 instance B:
      #   1. Compute base_tier from numeric_value vs critical/reference bounds.
      #   2. Apply NEONATE age-band PANIC override (analyte-specific).
      base_tier = "NORMAL"
      if numeric_value <= critical_low or numeric_value >= critical_high:
          base_tier = "CRITICAL_LOW" if numeric_value <= critical_low else "CRITICAL_HIGH"
      elif numeric_value < reference_low or numeric_value > reference_high:
          base_tier = "ABNORMAL"

      # NEONATE override: certain analytes trip PANIC regardless of base_tier
      #   K        -> PANIC if numeric_value >= 6.50 or numeric_value <= 2.50
      #   GLUCOSE  -> PANIC if numeric_value <= 40.00
      # PANIC supersedes CRITICAL_* and ABNORMAL.
      if patient.age_band == "NEONATE":
          if analyte_code == "K" and (numeric_value >= 6.50 or numeric_value <= 2.50):
              return "PANIC"
          if analyte_code == "GLUCOSE" and numeric_value <= 40.00:
              return "PANIC"
      return base_tier
    input_set: "Single Result row at release time; reads Patient.age_band (computed at release)."
    constants:
      NEONATE_K_PANIC_HIGH: 6.50
      NEONATE_K_PANIC_LOW: 2.50
      NEONATE_GLUCOSE_PANIC_LOW: 40.00
    precision: "Numeric_value to 2 decimal places, comparisons are >= / <= exact (rule 6 instance A — boundary precision)."
    variants:
      - name: standard
        when: "patient.age_band IN {INFANT, PEDIATRIC, ADULT}"
        difference: "Base-tier output without NEONATE override; PANIC tier unreachable."
      - name: neonate_override
        when: "patient.age_band == NEONATE AND analyte_code IN {K, GLUCOSE}"
        difference: "PANIC tier supersedes CRITICAL_*; tested with identical numeric inputs across ages to demonstrate divergence (dual variant — rule 1 instance A)."

  - name: turn_around_time_compute
    trigger: "First Result on a LabOrder transitions PROVISIONAL->RELEASED, OR retest completion when re-derivation requested"
    algorithm: chronological
    formula: |
      # Two variants produce different TAT for identical raw timestamps —
      # rule 1 instance B (dual variant on LabOrder).
      # Inputs: LabOrder.ordered_at, earliest Specimen.accessioned_at,
      #         earliest Result.released_at among Result rows for this order.
      # Variant: clinical_chronology (the canonical TAT)
      tat_minutes = floor((earliest_released_at - ordered_at).total_seconds() / 60)
      # Variant: lab_processing
      tat_minutes_lab = floor((earliest_released_at - earliest_accessioned_at).total_seconds() / 60)
      # The endpoint always returns clinical_chronology; lab_processing is
      # surfaced via GET /lab-orders/{id}?tat_variant=lab_processing.
    input_set: "LabOrder.ordered_at; min(Specimen.accessioned_at for Specimen.lab_order_id == this and status==ACCESSIONED); min(Result.released_at for Result.lab_order_id == this and status==RELEASED)."
    constants: {}
    precision: "Integer minutes; floor (truncate fractional seconds)."
    variants:
      - name: clinical_chronology
        when: "Default; computed at first release; surfaced as LabOrder.turn_around_time_minutes."
        difference: "Spans ordered_at → first released_at (includes transit + accessioning + analytics)."
      - name: lab_processing
        when: "Requested via GET /lab-orders/{id}?tat_variant=lab_processing"
        difference: "Spans first accessioned_at → first released_at (excludes pre-analytic). Smaller value for the same timestamps; rule 1 instance B demonstrates divergence on a different entity domain (Order, not Result)."

  - name: ack_deadline_compute
    trigger: "CriticalNotification transitions PENDING->SENT"
    algorithm: threshold
    formula: |
      # Inputs: sent_at, channel
      if channel == "PHONE":
          ack_deadline_at = sent_at + 30 minutes
      else:  # SMS
          ack_deadline_at = sent_at + 60 minutes
      # Comparison at ack time uses `current_clock <= ack_deadline_at`
      # (inclusive on the deadline) — rule 6 instance B boundary.
    input_set: "Single Notification at SENT transition."
    constants:
      PHONE_DEADLINE_MINUTES: 30
      SMS_DEADLINE_MINUTES: 60
    precision: "Whole minutes; comparisons use <= (rule 6 boundary)."
    variants: []

  - name: order_specimens_count_recompute
    trigger: "Every Specimen transition (DRAFT->COLLECTED, ->IN_TRANSIT, ->ACCESSIONED, ->REJECTED)"
    algorithm: aggregation
    formula: |
      # Inputs: all Specimen rows where lab_order_id == this LabOrder.id
      LabOrder.specimens_count   = count(s for s in specimens if s.status != "REJECTED")
      LabOrder.accessioned_count = count(s for s in specimens if s.status == "ACCESSIONED")
      # Both invariants must hold after EVERY transition; downstream cascades
      # (LabOrder ACCESSIONED->CANCELLED when specimens_count drops to 0) read
      # the post-recompute value.
    input_set: "All Specimens whose lab_order_id == this LabOrder.id; ordered by Specimen.created_at ASC (deterministic, never by id)."
    constants: {}
    precision: "Integer counts."
    variants: []

  - name: patient_results_release_count_recompute
    trigger: "Result transitions PROVISIONAL->RELEASED, RELEASED->AMENDED (no-op net), or RELEASED->INVALIDATED"
    algorithm: aggregation
    formula: |
      # Inputs: all Result rows where lab_order.patient_id == this Patient.id
      Patient.results_release_count = count(r for r in results if r.status == "RELEASED")
      # Rule 9b conservation invariant: across the entire lifecycle of any
      # Patient, the sum of all +1/-1 deltas applied by RELEASED transitions
      # MUST equal `count of Result rows currently in status=RELEASED for
      # that patient`. Amendment cycles (RELEASED->AMENDED + new RELEASED) are
      # zero-net; invalidation is -1; release is +1.
    input_set: "All Results whose lab_order.patient_id == this Patient.id."
    constants: {}
    precision: "Integer counts."
    variants: []

# -----------------------------------------------------------------------------
# §1.4 Validation Rules Table (ordered by priority)
# -----------------------------------------------------------------------------
validations:

  - priority: 1
    category: auth
    check: "Request carries valid X-User-Role and X-User-ID headers."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "X-User-Role is permitted for the called endpoint per §1.7 RBAC matrix."
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Every path-id parameter resolves to an existing entity, validated left-to-right; every FK in the request body resolves to an existing parent entity."
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path-id or FK fields"

  - priority: 4
    category: state
    check: "Target entity is in a state from which the requested transition is valid per §1.2."
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints (POST /<resource>/{id}/<action>)"

  - priority: 5
    category: business_safety
    check: "When LabOrder.priority == STAT and a CriticalNotification is being sent, the notification's channel MUST be PHONE. SMS notifications on STAT orders are forbidden (CLIA documentation requirement, rule 5 instance A pairing state vs safety)."
    error_id: ERR_STAT_REQUIRES_PHONE_CHANNEL
    http_status: 422
    applies_to: "POST /critical-notifications/{id}/send"

  - priority: 6
    category: business_safety
    check: "An ACCESSIONED Specimen with a RELEASED Result cannot be rejected (would orphan a clinically released finding). Must invalidate the Result first via LabDirector."
    error_id: ERR_RELEASED_RESULT_BLOCKS_REJECT
    http_status: 409
    applies_to: "POST /specimens/{id}/reject"

  - priority: 7
    category: business_temporal
    check: "An InstrumentRun's [scheduled_start, scheduled_end) MUST NOT overlap any existing InstrumentRun on the same instrument_id in status IN {SCHEDULED, IN_PROGRESS, COMPLETED} when extended by the instrument's qc_buffer_minutes on each side (rule 8 instance A — half-open interval + symmetric buffer on a single resource)."
    error_id: ERR_INSTRUMENT_SLOT_CONFLICT
    http_status: 409
    applies_to: "POST /instrument-runs"

  - priority: 8
    category: business_temporal
    check: "A Specimen.collected_at MUST NOT fall within 5 minutes of any other Specimen with the same collector_clinician_id whose status IN {COLLECTED, IN_TRANSIT, ACCESSIONED} (collector cannot collect two specimens within a 5-minute window — rule 8 instance B, different interval semantics: point-collision against a buffered window, no half-open interval)."
    error_id: ERR_COLLECTOR_BUSY
    http_status: 409
    applies_to: "POST /specimens/{id}/collect"

  - priority: 9
    category: business_referential
    check: "Result.specimen_id and Result.lab_order_id MUST reference the same parent (Specimen.lab_order_id == Result.lab_order_id)."
    error_id: ERR_SPECIMEN_ORDER_MISMATCH
    http_status: 422
    applies_to: "POST /results"

  - priority: 10
    category: business_referential
    check: "Result.run_id MUST reference an InstrumentRun whose specimen_id == Result.specimen_id (rule 5 instance B — existence vs referential pairing)."
    error_id: ERR_RUN_SPECIMEN_MISMATCH
    http_status: 422
    applies_to: "POST /results"

  - priority: 11
    category: business_constraint
    check: "Result.reference_high > Result.reference_low AND Result.critical_high > Result.critical_low."
    error_id: ERR_INVALID_RANGE
    http_status: 422
    applies_to: "POST /results"

  - priority: 12
    category: business_constraint
    check: "AcknowledgementReceipt POST: current clock MUST be <= Notification.ack_deadline_at. Strictly past the deadline is rejected (rule 6 instance B — inclusive boundary, ack_at == deadline succeeds, ack_at == deadline + 1 minute fails)."
    error_id: ERR_ACK_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /critical-notifications/{id}/acknowledgements"

  - priority: 13
    category: business_constraint
    check: "AcknowledgementReceipt: X-User-ID MUST equal Notification.recipient_clinician_id (the ordering provider who placed the LabOrder — segregation by entity ownership)."
    error_id: ERR_ACK_WRONG_RECIPIENT
    http_status: 403
    applies_to: "POST /critical-notifications/{id}/acknowledgements"

  - priority: 14
    category: business_constraint
    check: "OCC: expected_lab_order_version (on /results/{id}/release) and expected_result_version (on /results/{id}/amend) MUST match the current parent version."
    error_id: ERR_STALE_LAB_ORDER_VERSION
    http_status: 412
    applies_to: "POST /results/{id}/release, POST /results/{id}/amend"

  - priority: 15
    category: business_constraint
    check: "Patient.mrn MUST be unique across all Patients; Clinician.npi MUST be unique across all Clinicians; Instrument.instrument_code MUST be unique."
    error_id: ERR_DUPLICATE_IDENTIFIER
    http_status: 409
    applies_to: "POST /patients, POST /clinicians, POST /instruments"

# -----------------------------------------------------------------------------
# §1.5 API Endpoint Table
# -----------------------------------------------------------------------------
endpoints:

  # ----- Patient -----
  - method: POST
    path: /patients
    description: "Register a patient."
    roles: [LabTech, LabDirector]
    code: 201
    input: [mrn, full_name, date_of_birth]
    output: Patient
    side_effects:
      - "Patient.age_band computed eagerly from date_of_birth using the current clock."

  - method: GET
    path: /patients/{id}
    description: "Read a patient by id."
    roles: [LabTech, LabDirector, OrderingProvider, Phlebotomist]
    code: 200
    input: []
    output: Patient
    side_effects: []

  - method: GET
    path: /patients
    description: "List patients with optional mrn filter."
    roles: [LabTech, LabDirector, OrderingProvider]
    code: 200
    input: ["mrn?", "limit?", "offset?"]
    output: Patient[]
    side_effects: []

  - method: GET
    path: /patients/{id}/lab-orders
    description: "List lab orders for a patient (FK reverse-reachability for LabOrder.patient_id)."
    roles: [LabTech, LabDirector, OrderingProvider]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: LabOrder[]
    side_effects: []

  # ----- Clinician -----
  - method: POST
    path: /clinicians
    description: "Register a clinician (provider, phlebotomist, lab tech, or lab director). Bootstrap-accessible to Anonymous because the very first LabDirector has no parent director; subsequent registrations are typically made by an authenticated LabDirector, but the endpoint accepts both."
    roles: [Anonymous, LabDirector]
    code: 201
    input: [npi, full_name, role_type, phone_e164, "backup_clinician_id?"]
    output: Clinician
    side_effects: []

  - method: GET
    path: /clinicians/{id}
    description: "Read a clinician."
    roles: [LabTech, LabDirector, OrderingProvider, Phlebotomist]
    code: 200
    input: []
    output: Clinician
    side_effects: []

  - method: GET
    path: /clinicians
    description: "List clinicians with optional role_type and backup_clinician_id filters."
    roles: [LabTech, LabDirector, OrderingProvider]
    code: 200
    input: ["role_type?", "backup_clinician_id?", "limit?", "offset?"]
    output: Clinician[]
    side_effects: []

  # ----- LabOrder -----
  - method: POST
    path: /patients/{patient_id}/lab-orders
    description: "Create a new lab order for a patient."
    roles: [OrderingProvider]
    code: 201
    input: [ordering_clinician_id, panel_code, "priority?"]
    output: LabOrder
    side_effects:
      - "LabOrder.status defaults to DRAFT"
      - "LabOrder.ordered_at = current clock"

  - method: GET
    path: /lab-orders/{id}
    description: "Read a lab order. Optional tat_variant query selects which §1.3 turn_around_time variant the response embeds."
    roles: [LabTech, LabDirector, OrderingProvider]
    code: 200
    input: ["tat_variant?"]
    output: LabOrder
    side_effects: []

  - method: GET
    path: /lab-orders
    description: "List lab orders. Supports filtering by patient_id, ordering_clinician_id, status."
    roles: [LabTech, LabDirector, OrderingProvider]
    code: 200
    input: ["patient_id?", "ordering_clinician_id?", "status?", "limit?", "offset?"]
    output: LabOrder[]
    side_effects: []

  - method: POST
    path: /lab-orders/{id}/cancel
    description: "Cancel a draft lab order."
    roles: [OrderingProvider]
    code: 200
    input: []
    output: LabOrder
    side_effects:
      - "LabOrder transitions DRAFT->CANCELLED per §1.2"
      - "Cascade: orphan Specimens transitioned to REJECTED"

  # ----- Specimen -----
  - method: POST
    path: /lab-orders/{order_id}/specimens
    description: "Register a specimen for a lab order."
    roles: [Phlebotomist, LabTech]
    code: 201
    input: [collector_clinician_id, container_code]
    output: Specimen
    side_effects:
      - "Specimen.status defaults to DRAFT"

  - method: GET
    path: /specimens/{id}
    description: "Read a specimen."
    roles: [LabTech, LabDirector, OrderingProvider, Phlebotomist]
    code: 200
    input: []
    output: Specimen
    side_effects: []

  - method: GET
    path: /specimens
    description: "List specimens. Supports filtering by lab_order_id and collector_clinician_id."
    roles: [LabTech, LabDirector, OrderingProvider, Phlebotomist]
    code: 200
    input: ["lab_order_id?", "collector_clinician_id?", "status?", "limit?", "offset?"]
    output: Specimen[]
    side_effects: []

  - method: POST
    path: /specimens/{id}/collect
    description: "Phlebotomist records specimen collection."
    roles: [Phlebotomist]
    code: 200
    input: []
    output: Specimen
    side_effects:
      - "Specimen.collected_at = current clock"
      - "Specimen.status -> COLLECTED"

  - method: POST
    path: /specimens/{id}/transit
    description: "Specimen handed to courier / in transit to lab."
    roles: [Phlebotomist]
    code: 200
    input: []
    output: Specimen
    side_effects:
      - "Specimen.status -> IN_TRANSIT"

  - method: POST
    path: /specimens/{id}/accession
    description: "Lab receives and accessions the specimen (entry into the lab system)."
    roles: [LabTech]
    code: 200
    input: []
    output: Specimen
    side_effects:
      - "Specimen.status -> ACCESSIONED, accessioned_at = current clock"
      - "Cascade: if LabOrder.status == DRAFT, LabOrder -> ACCESSIONED (recompute accessioned_count and specimens_count)"

  - method: POST
    path: /specimens/{id}/reject
    description: "Reject a specimen with a reason (HEMOLYZED, CLOTTED, INSUFFICIENT_VOLUME, MISLABELED)."
    roles: [LabTech]
    code: 200
    input: [reject_reason]
    output: Specimen
    side_effects:
      - "Specimen.status -> REJECTED"
      - "Cascade: recompute LabOrder.specimens_count / accessioned_count; if specimens_count==0, LabOrder ACCESSIONED->CANCELLED; cascade further to any CriticalNotifications PENDING|SENT -> VOIDED (rule 4 depth-3 chain)"

  # ----- Instrument & InstrumentRun -----
  - method: POST
    path: /instruments
    description: "Register a lab analyzer (instrument)."
    roles: [LabDirector]
    code: 201
    input: [instrument_code, analyte_panels_supported, "qc_buffer_minutes?"]
    output: Instrument
    side_effects: []

  - method: GET
    path: /instruments/{id}
    description: "Read an instrument."
    roles: [LabTech, LabDirector]
    code: 200
    input: []
    output: Instrument
    side_effects: []

  - method: GET
    path: /instruments
    description: "List instruments."
    roles: [LabTech, LabDirector]
    code: 200
    input: ["limit?", "offset?"]
    output: Instrument[]
    side_effects: []

  - method: POST
    path: /instrument-runs
    description: "Schedule an instrument run; rejected if [scheduled_start, scheduled_end) overlaps any existing run on the same instrument by less than qc_buffer_minutes on either side."
    roles: [LabTech]
    code: 201
    input: [instrument_id, specimen_id, scheduled_start, scheduled_end]
    output: InstrumentRun
    side_effects: []

  - method: GET
    path: /instrument-runs/{id}
    description: "Read an instrument run."
    roles: [LabTech, LabDirector]
    code: 200
    input: []
    output: InstrumentRun
    side_effects: []

  - method: GET
    path: /instrument-runs
    description: "List instrument runs (FK reverse-reachability for instrument_id and specimen_id)."
    roles: [LabTech, LabDirector]
    code: 200
    input: ["instrument_id?", "specimen_id?", "status?", "limit?", "offset?"]
    output: InstrumentRun[]
    side_effects: []

  - method: POST
    path: /instrument-runs/{id}/complete
    description: "Mark an instrument run as COMPLETED so a Result may be posted against it."
    roles: [LabTech]
    code: 200
    input: []
    output: InstrumentRun
    side_effects:
      - "InstrumentRun.status -> COMPLETED"

  # ----- Result -----
  - method: POST
    path: /results
    description: "Create a Result in status=PROVISIONAL."
    roles: [LabTech]
    code: 201
    input: [lab_order_id, specimen_id, run_id, analyte_code, numeric_value, unit, reference_low, reference_high, critical_low, critical_high]
    output: Result
    side_effects: []

  - method: GET
    path: /results/{id}
    description: "Read a Result."
    roles: [LabTech, LabDirector, OrderingProvider]
    code: 200
    input: []
    output: Result
    side_effects: []

  - method: GET
    path: /results
    description: "List Results (FK reverse-reachability for lab_order_id, specimen_id, run_id, amended_from_result_id)."
    roles: [LabTech, LabDirector, OrderingProvider]
    code: 200
    input: ["lab_order_id?", "specimen_id?", "run_id?", "amended_from_result_id?", "status?", "limit?", "offset?"]
    output: Result[]
    side_effects: []

  - method: POST
    path: /results/{id}/release
    description: "Release a Result (PROVISIONAL->RELEASED). Auto-creates CriticalNotification when criticality is CRITICAL_* or PANIC. OCC: requires expected_lab_order_version."
    roles: [LabTech]
    code: 200
    input: [expected_lab_order_version]
    output: Result
    side_effects:
      - "Result.criticality computed per §1.3 criticality_classify"
      - "Result.released_at = current clock"
      - "Patient.results_release_count += 1"
      - "If criticality is critical, auto-create CriticalNotification PENDING"
      - "LabOrder.version += 1 (OCC parent bump)"
      - "First release on order: LabOrder ACCESSIONED->RESULTED + LabOrder.turn_around_time_minutes computed"

  - method: POST
    path: /results/{id}/amend
    description: "Amend a previously RELEASED Result; creates a new RELEASED Result row and marks the prior row AMENDED. OCC: requires expected_result_version."
    roles: [LabTech]
    code: 201
    input: [expected_result_version, numeric_value]
    output: Result
    side_effects:
      - "Old Result row: status -> AMENDED"
      - "New Result row created in status=RELEASED, amended_from_result_id = old.id"
      - "Patient.results_release_count net unchanged (conservation rule 9b)"
      - "Old CriticalNotification (if any) VOIDED; new one auto-created if recomputed criticality is critical"

  - method: POST
    path: /results/{id}/invalidate
    description: "Invalidate a RELEASED Result (LAB_DIRECTOR only)."
    roles: [LabDirector]
    code: 200
    input: []
    output: Result
    side_effects:
      - "Result.status -> INVALIDATED"
      - "Patient.results_release_count -= 1"
      - "Any CriticalNotification in PENDING|SENT -> VOIDED"

  # ----- CriticalNotification -----
  - method: GET
    path: /critical-notifications/{id}
    description: "Read a critical notification."
    roles: [LabTech, LabDirector, OrderingProvider]
    code: 200
    input: []
    output: CriticalNotification
    side_effects: []

  - method: GET
    path: /critical-notifications
    description: "List critical notifications. Filters expose FK reverse-reachability for result_id, recipient_clinician_id, escalation_target_clinician_id."
    roles: [LabTech, LabDirector, OrderingProvider]
    code: 200
    input: ["result_id?", "recipient_clinician_id?", "escalation_target_clinician_id?", "status?", "limit?", "offset?"]
    output: CriticalNotification[]
    side_effects: []

  - method: POST
    path: /critical-notifications/{id}/send
    description: "Deliver the notification (PENDING->SENT). Computes ack_deadline_at per §1.3."
    roles: [LabTech]
    code: 200
    input: []
    output: CriticalNotification
    side_effects:
      - "Notification.sent_at = current clock"
      - "Notification.ack_deadline_at = sent_at + (30 if PHONE else 60) minutes"
      - "Notification.attempt_count += 1"
      - "Patient.critical_incidents_count += 1"

  - method: POST
    path: /critical-notifications/{id}/escalate
    description: "Escalate an unacknowledged notification past its deadline (SENT->ESCALATED). Sets LabOrder.compliance_incident=true (rule 4 depth-2 cascade)."
    roles: [LabTech]
    code: 200
    input: []
    output: CriticalNotification
    side_effects:
      - "Notification.status -> ESCALATED"
      - "Notification.escalation_target_clinician_id = recipient_clinician.backup_clinician_id"
      - "LabOrder.compliance_incident -> true (SECOND HOP)"

  - method: POST
    path: /critical-notifications/{id}/acknowledgements
    description: "Ordering provider acknowledges the notification within the ack window. Creates an immutable AcknowledgementReceipt and transitions notification to ACKNOWLEDGED."
    roles: [OrderingProvider]
    code: 201
    input: [ack_method, attestation_text]
    output: AcknowledgementReceipt
    side_effects:
      - "Notification.status -> ACKNOWLEDGED"
      - "Persist AcknowledgementReceipt"

  - method: GET
    path: /critical-notifications/{id}/acknowledgements
    description: "List acknowledgement receipts for a notification (FK reverse-reachability for critical_notification_id)."
    roles: [LabTech, LabDirector, OrderingProvider]
    code: 200
    input: ["limit?", "offset?"]
    output: AcknowledgementReceipt[]
    side_effects: []

  - method: GET
    path: /acknowledgement-receipts/{id}
    description: "Read a single acknowledgement receipt."
    roles: [LabTech, LabDirector, OrderingProvider]
    code: 200
    input: []
    output: AcknowledgementReceipt
    side_effects: []

  - method: GET
    path: /acknowledgement-receipts
    description: "List acknowledgement receipts globally (FK reverse-reachability for acknowledging_clinician_id)."
    roles: [LabTech, LabDirector, OrderingProvider]
    code: 200
    input: ["critical_notification_id?", "acknowledging_clinician_id?", "limit?", "offset?"]
    output: AcknowledgementReceipt[]
    side_effects: []

  # ----- RetestRequest -----
  - method: POST
    path: /results/{id}/retest-requests
    description: "Open a retest request against a released or amended Result."
    roles: [OrderingProvider]
    code: 201
    input: [reason]
    output: RetestRequest
    side_effects: []

  - method: GET
    path: /retest-requests/{id}
    description: "Read a retest request."
    roles: [LabTech, LabDirector, OrderingProvider]
    code: 200
    input: []
    output: RetestRequest
    side_effects: []

  - method: GET
    path: /retest-requests
    description: "List retest requests (FK reverse-reachability for original_result_id and new_order_id)."
    roles: [LabTech, LabDirector, OrderingProvider]
    code: 200
    input: ["original_result_id?", "new_order_id?", "status?", "limit?", "offset?"]
    output: RetestRequest[]
    side_effects: []

  - method: POST
    path: /retest-requests/{id}/schedule
    description: "Schedule the retest: auto-create a fresh LabOrder with priority=STAT and bind to the retest."
    roles: [LabTech]
    code: 200
    input: []
    output: RetestRequest
    side_effects:
      - "New LabOrder auto-created (patient_id and ordering_clinician_id copied from original)"
      - "RetestRequest.new_order_id = new LabOrder.id"
      - "RetestRequest.status -> SCHEDULED"

  # ----- Test-driving clock endpoint -----
  - method: POST
    path: /_clock/set_current_utc
    description: "Test-driving endpoint: pin the server's UTC clock to an ISO 8601 timestamp. Used in tests that exercise ack-window boundaries and overlap rules."
    roles: [LabDirector]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects:
      - "Server `current clock` is set to `to_iso8601` for subsequent requests."

# -----------------------------------------------------------------------------
# §1.6 Error Code Catalog
# -----------------------------------------------------------------------------
errors:

  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Request missing or with invalid X-User-Role / X-User-ID headers."

  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "Caller's X-User-Role is not in the endpoint's `roles:` list."

  - id: ERR_NOT_FOUND
    http: 404
    condition: "A path-id or FK reference does not resolve to an existing entity."

  - id: ERR_INVALID_STATE
    http: 409
    condition: "Target entity is not in a state from which the requested transition is valid per §1.2."

  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Required input field missing, type mismatch, or enum value outside the declared set."

  - id: ERR_DUPLICATE_IDENTIFIER
    http: 409
    condition: "Unique identifier (Patient.mrn, Clinician.npi, Instrument.instrument_code) collides with an existing row."

  - id: ERR_STAT_REQUIRES_PHONE_CHANNEL
    http: 422
    condition: "POST /critical-notifications/{id}/send with channel=SMS when the underlying LabOrder.priority == STAT."

  - id: ERR_RELEASED_RESULT_BLOCKS_REJECT
    http: 409
    condition: "POST /specimens/{id}/reject on a Specimen with at least one RELEASED Result. Must invalidate the Result first."

  - id: ERR_INSTRUMENT_SLOT_CONFLICT
    http: 409
    condition: "Proposed InstrumentRun [scheduled_start, scheduled_end) overlaps another run on the same instrument by less than the instrument's qc_buffer_minutes on either side."

  - id: ERR_COLLECTOR_BUSY
    http: 409
    condition: "Phlebotomist attempts to record a collection within 5 minutes (point-collision against a buffered window) of another non-rejected collection by the same collector."

  - id: ERR_SPECIMEN_ORDER_MISMATCH
    http: 422
    condition: "Result.specimen_id and Result.lab_order_id name a Specimen whose lab_order_id does not equal the supplied lab_order_id."

  - id: ERR_RUN_SPECIMEN_MISMATCH
    http: 422
    condition: "Result.run_id references an InstrumentRun whose specimen_id does not match Result.specimen_id."

  - id: ERR_INVALID_RANGE
    http: 422
    condition: "Result.reference_high <= Result.reference_low OR Result.critical_high <= Result.critical_low."

  - id: ERR_ACK_WINDOW_CLOSED
    http: 409
    condition: "Acknowledgement attempt strictly after Notification.ack_deadline_at."

  - id: ERR_ACK_WRONG_RECIPIENT
    http: 403
    condition: "X-User-ID on POST /critical-notifications/{id}/acknowledgements does not equal Notification.recipient_clinician_id."

  - id: ERR_STALE_LAB_ORDER_VERSION
    http: 412
    condition: "POST /results/{id}/release with expected_lab_order_version != LabOrder.version (OCC, §1.2.1 release-stale-lab-order)."

  - id: ERR_STALE_RESULT_VERSION
    http: 412
    condition: "POST /results/{id}/amend with expected_result_version != Result.version (OCC, §1.2.1 amend-stale-result)."

  - id: ERR_CLINICIAN_ROLE_MISMATCH
    http: 422
    condition: "ordering_clinician_id references a Clinician whose role_type != ORDERING_PROVIDER, or collector_clinician_id references a Clinician whose role_type != PHLEBOTOMIST."

  - id: ERR_BACKUP_REQUIRED
    http: 422
    condition: "POST /clinicians with role_type != LAB_DIRECTOR but backup_clinician_id omitted."

# -----------------------------------------------------------------------------
# §1.7 RBAC Matrix
# -----------------------------------------------------------------------------
roles:

  - name: Anonymous
    description: "Pre-authentication identity used solely for bootstrap registration. X-User-ID is treated as an opaque audit token (not bound to any persisted entity). Cannot read or mutate any business data."
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "POST /clinicians"

  - name: OrderingProvider
    description: "Clinician who places lab orders, acknowledges critical notifications, and may request retests."
    identity: "entity_backed:Clinician"
    exclusive_operations:
      - "POST /patients/{patient_id}/lab-orders"
      - "POST /lab-orders/{id}/cancel"
      - "POST /critical-notifications/{id}/acknowledgements"
      - "POST /results/{id}/retest-requests"
      - "POST /retest-requests/{id}/cancel"
    shared_operations:
      - "GET /patients/{id}, GET /patients"
      - "GET /patients/{id}/lab-orders"
      - "GET /clinicians, GET /clinicians/{id}"
      - "GET /lab-orders, GET /lab-orders/{id}"
      - "GET /specimens, GET /specimens/{id}"
      - "GET /results, GET /results/{id}"
      - "GET /critical-notifications, GET /critical-notifications/{id}"
      - "GET /critical-notifications/{id}/acknowledgements"
      - "GET /acknowledgement-receipts"
      - "GET /retest-requests, GET /retest-requests/{id}"

  - name: Phlebotomist
    description: "Clinician who collects specimens at the patient bedside and hands them to courier."
    identity: "entity_backed:Clinician"
    exclusive_operations:
      - "POST /specimens/{id}/collect"
      - "POST /specimens/{id}/transit"
    shared_operations:
      - "POST /lab-orders/{order_id}/specimens"
      - "GET /patients/{id}"
      - "GET /clinicians/{id}"
      - "GET /specimens, GET /specimens/{id}"

  - name: LabTech
    description: "Laboratory technician who accessions specimens, schedules instrument runs, creates and releases results, sends and escalates critical notifications."
    identity: "entity_backed:Clinician"
    exclusive_operations:
      - "POST /specimens/{id}/accession"
      - "POST /specimens/{id}/reject"
      - "POST /instrument-runs"
      - "POST /instrument-runs/{id}/complete"
      - "POST /results"
      - "POST /results/{id}/release"
      - "POST /results/{id}/amend"
      - "POST /critical-notifications/{id}/send"
      - "POST /critical-notifications/{id}/escalate"
      - "POST /retest-requests/{id}/schedule"
    shared_operations:
      - "POST /patients"
      - "POST /lab-orders/{order_id}/specimens"
      - "GET /patients, GET /patients/{id}, GET /patients/{id}/lab-orders"
      - "GET /clinicians, GET /clinicians/{id}"
      - "GET /lab-orders, GET /lab-orders/{id}"
      - "GET /specimens, GET /specimens/{id}"
      - "GET /instruments, GET /instruments/{id}"
      - "GET /instrument-runs, GET /instrument-runs/{id}"
      - "GET /results, GET /results/{id}"
      - "GET /critical-notifications, GET /critical-notifications/{id}"
      - "GET /critical-notifications/{id}/acknowledgements"
      - "GET /acknowledgement-receipts"
      - "GET /retest-requests, GET /retest-requests/{id}"

  - name: LabDirector
    description: "CLIA-responsible director; sole authority to invalidate released results, register clinicians and instruments, and pin the test clock."
    identity: "entity_backed:Clinician"
    exclusive_operations:
      - "POST /clinicians"
      - "POST /instruments"
      - "POST /results/{id}/invalidate"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /patients"
      - "GET /patients, GET /patients/{id}, GET /patients/{id}/lab-orders"
      - "GET /clinicians, GET /clinicians/{id}"
      - "GET /lab-orders, GET /lab-orders/{id}"
      - "GET /specimens, GET /specimens/{id}"
      - "GET /instruments, GET /instruments/{id}"
      - "GET /instrument-runs, GET /instrument-runs/{id}"
      - "GET /results, GET /results/{id}"
      - "GET /critical-notifications, GET /critical-notifications/{id}"
      - "GET /critical-notifications/{id}/acknowledgements"
      - "GET /acknowledgement-receipts"
      - "GET /retest-requests, GET /retest-requests/{id}"
