          setup:
            - "Household 9 Birch Road in VISIT_COMPLETED (deferred visit completed at 2026-08-01T00:00:00Z) with one ISSUED escape plan; the clock is then advanced to 2026-09-05T00:00:00Z so days_since_visit is 35."
