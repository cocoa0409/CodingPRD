              as: CredentialingOfficer
              as_user_id: "user_credentialing_1"
          trigger:
            - call: "POST /vendor-access/access-appeals/${appeal_ann_id}/decide"
              payload: { decision: "OVERTURN", decision_rationale: "Second look at the same record" }
              as: CredentialingOfficer
              as_user_id: "user_credentialing_1"
              captures: { appeal_state_err: $.data.error_id }
          assert:
            - "HTTP status is 409 and ${appeal_state_err} == ERR_APPEAL_INVALID_STATE"
            - "AccessAppeal.${appeal_ann_id}.status is still UPHELD with decision_rationale == The sister-facility approval does not extend to this hospital"
            - "VendorRep.${rep_ann_id}.access_status is still REVOKED"

      - name: check_in_one_second_before_the_badge_window_returns_422
        claim_type: violation_to_error
        grounds:
          - errors[ERR_BADGE_WINDOW_NOT_OPEN]
          - validations.priority_26
          - calculations.badge_validity_window
        distinguishing_aspect: "This is the loser of the §1.8 priority pair on its own: with a CREDENTIALED, non-revoked rep the only violation left is the clock, and 07:59:59Z — one second before the window opens — yields 422 ERR_BADGE_WINDOW_NOT_OPEN while 08:00:00Z would succeed."
        test_recipe:
          setup:
            - "Facility BW-61 keeps the default badge_lead_minutes 60 and badge_grace_minutes 30."
            - "Vendor BWNV's rep Bea is CREDENTIALED and holds an APPROVED authorization on case CASE-15160 (2026-09-24T09:00:00Z to 11:00:00Z), so her window is 08:00:00Z to 11:30:00Z."
            - "The logical clock is set to 2026-09-24T07:59:59Z."
          setup_api_calls:
