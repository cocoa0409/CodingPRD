            - "Hop 2: Associate.${la1}.issued_action_count == 2 and accountability_score == 60.00 (100 - 15 - 25)"
            - "Hop 3: Associate.${la1}.training_status == SUSPENDED (60.00 < SUSPENSION_SCORE_FLOOR 80)"
            - "Hop 4: LabelTask.${task_1}.placement_status == UNPLACED, print_status == REPRINT_REQUIRED, placed_by_associate_id == null, placed_at == null, printed_label_serial == null"
