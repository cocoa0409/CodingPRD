              as: AdvisorOperationsLead
            - call: "POST /ria/assets/${tx_id}/transfer-out"
              payload: {}
              as: AdvisorOperationsLead
            - call: "POST /ria/assets/${tx_id}/mark-received"
              payload: {}
              as: CustodyOperationsOfficer
          trigger:
            - call: "POST /ria/accounts/${acct_id}/list"
              payload: {}
              as: AdvisorOperationsLead
              captures: { list1_at: $.data.last_listed_at, list1_cents: $.data.last_listed_cents }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:59:59Z" }
