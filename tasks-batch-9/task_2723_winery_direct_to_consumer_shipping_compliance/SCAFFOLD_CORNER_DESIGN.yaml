              as: PlatformAdmin
              captures: { sr_tx_id: $.data.id }
            - call: "POST /dtc/state-permits"
              payload: { winery_id: "${w_id}", state_code: "WY", permit_number: "TX-DTC-1", permit_type: "DIRECT_SHIPPER", effective_date: "2026-01-01", expiration_date: "2026-12-31" }
              as: ComplianceOfficer
