          assert: ["response.data.error_id == ERR_PREORDER_NOT_FOUND"]

      - name: catering_booking_not_found_on_get
        claim_type: Not Found
        grounds: ["errors[ERR_CATERING_BOOKING_NOT_FOUND]"]
        distinguishing_aspect: "GET /catering-bookings/{unknown} -> 404 ERR_CATERING_BOOKING_NOT_FOUND."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /catering-bookings/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Manager
              captures: { err: $.data.error_id }
          assert: ["response.data.error_id == ERR_CATERING_BOOKING_NOT_FOUND"]

      - name: waste_event_not_found_on_get
        claim_type: Not Found
        grounds: ["errors[ERR_WASTE_EVENT_NOT_FOUND]"]
        distinguishing_aspect: "GET /waste-events/{unknown} -> 404 ERR_WASTE_EVENT_NOT_FOUND."
        test_recipe:
          setup: ["Empty DB"]
