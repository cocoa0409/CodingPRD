            - "Referral.${ref_id}.organization_id == ${orgy_id}"
            - "Organization.${orgx_id}.referral_slots_used == 0 (released at DECLINED)"
            - "Organization.${orgy_id}.referral_slots_used == 1 (taken at reroute)"

  - rule_id: transitive_cascade
    instances:
      - name: seal_cascade_case_referral_orgslot_appointment
        grounds:
          - state_machines.Case.privacy_posture
          - state_machines.Referral.SENT_to_SUSPENDED
          - state_machines.Appointment.transitions
          - calculations.referral_slot_accounting
        distinguishing_aspect: |
          Depth-3 cascade from a privacy trigger: Case SEALED (m1) forces the case's SENT
          referral SUSPENDED (m2, caused by the seal), and that suspension itself releases the
          organization's slot (m3a) and system-cancels the linked CONFIRMED accompaniment
          appointment (m3b) — each hop caused by the previous mutation, not by the seal directly.
        test_recipe:
          setup:
            - "Case with STANDARD posture; client holding REFERRAL_SHARE and ACCOMPANIMENT consents; referral SENT to org (capacity 5, slots_used 1); CONFIRMED ACCOMPANIMENT appointment 2026-08-10 10:00-11:00 linked via referral_id"
          setup_api_calls:
            - call: "POST /staff"
              payload: { full_name: "Mgr One", role_level: "CASE_MANAGER", clearance_level: 2, weekly_appointment_capacity: 10 }
              as: CenterAdmin
              captures: { mgr1_id: $.data.id }
            - call: "POST /clients"
              payload: { full_name: "Hana Client", preferred_language: "ko", date_of_birth: "1990-12-01", household_size: 2 }
              as: IntakeSpecialist
