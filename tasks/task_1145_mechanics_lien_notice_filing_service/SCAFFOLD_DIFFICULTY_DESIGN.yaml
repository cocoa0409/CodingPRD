            - { call: "POST /lien/projects", payload: { name: "Broke Job", state_code: "CA", county: "Merced", project_type: "COMMERCIAL_PRIVATE", property_legal_description: "Lot 51", contract_value_cents: 500000, approved_extras_cents: 0, retainage_held_cents: 0 }, as: CustomerAdmin, as_user_id: "${comp_id}", captures: { proj_id: $.data.id } }
            - { call: "POST /lien/parties", payload: { project_id: "${proj_id}", party_role: "OWNER", legal_name: "O", address: "1 Bk Ave" }, as: CustomerAdmin, as_user_id: "${comp_id}", captures: { p_o: $.data.id } }
          trigger:
            - { call: "POST /lien/notices", payload: { project_id: "${proj_id}", recipient_party_id: "${p_o}", delivery_method: "CERTIFIED_MAIL" }, as: CustomerAdmin, as_user_id: "${comp_id}", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_PROJECT_NOT_VERIFIED (priority 6 business_safety beats priority 10 business_fiscal)"
            - "error_id != ERR_INSUFFICIENT_BALANCE"
            - "Company.${comp_id}.prepaid_balance_cents remains 0 (no fee debited)"
