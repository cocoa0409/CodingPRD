      - name: application_lifecycle_guards
        claim_type: violation_to_error
        grounds: ["errors[ERR_APPLICATION_NOT_WITHDRAWABLE]", "errors[ERR_APPLICATION_NOT_DECIDABLE]", "errors[ERR_APPLICATION_NOT_APPEALABLE]"]
        distinguishing_aspect: "withdraw on JURIED_IN fails; decide and appeal on WITHDRAWN fail — terminal/branch guards on the jury machine."
        test_recipe:
