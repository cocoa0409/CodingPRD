# =============================================================================
# Task 1963: Property Maintenance Work Order & Vendor Dispatch — Seed Tables
# =============================================================================

scenario: |
  1963. Property Maintenance Work Order & Vendor Dispatch (property maintenance department):
  request intake & priority classification (emergency/urgent/routine), in-house tech vs
  vendor assignment rules, entry permission & notice requirements, parts inventory &
  purchase approval threshold, completion documentation with photos & resident sign-off,
  recall/re-open tracking for repeat issues, chargeback to resident for damage,
  response/completion SLA reporting

domain_name: property-maintenance
api_prefix: /

# =============================================================================
# Step 0: Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: compliance_audit
  complexity_layers:
    - optimistic_concurrency        # OCC on WorkOrder.version for triage-edit and purchase-request-create
    - cascading_side_effects        # vendor-suspend cascade; completion consumption cascade
    - rate_threshold_triggers       # purchase auto-approve threshold; recall window; SLA breach boundaries
    - derived_field_reconciliation  # Part.restock_status, Resident.chargeback_balance_cents, SLA breach flags

  entity_topology: flat             # peer entities joined by foreign keys; no nested URL ownership
  state_machine_shape: cyclic       # WorkOrder COMPLETED→REOPENED→ASSIGNED→…→COMPLETED; Chargeback BILLED↔DISPUTED

  relationship_patterns:
    - one_to_many                   # Property→Residents/Technicians/Vendors/Parts/WorkOrders; WorkOrder→WorkOrderParts/PurchaseRequests
    - cross_aggregate               # WorkOrder→Technician/Vendor assignment; WorkOrderPart→Part; PurchaseRequest→Part

  role_model: approval_chain        # Technician/Vendor create PurchaseRequests → PropertyManager approves; Manager finalizes Chargebacks
  consistency_model: immediate      # all side effects visible in the mutating response and subsequent reads

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Property
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Property name" }
      - { name: emergency_response_hours, type: integer, source: input, default: 4, description: "SLA response hours for EMERGENCY work orders" }
      - { name: emergency_completion_hours, type: integer, source: input, default: 24, description: "SLA completion hours for EMERGENCY work orders" }
      - { name: urgent_response_hours, type: integer, source: input, default: 24, description: "SLA response hours for URGENT work orders" }
      - { name: urgent_completion_hours, type: integer, source: input, default: 72, description: "SLA completion hours for URGENT work orders" }
      - { name: routine_response_hours, type: integer, source: input, default: 72, description: "SLA response hours for ROUTINE work orders" }
      - { name: routine_completion_hours, type: integer, source: input, default: 168, description: "SLA completion hours for ROUTINE work orders" }
      - { name: purchase_auto_approve_threshold_cents, type: integer, source: input, default: 50000, description: "PurchaseRequest estimated_total_cents <= this value auto-approves" }
      - { name: recall_window_days, type: integer, source: input, default: 30, description: "Days after completed_at during which a work order may be reopened" }
      - { name: vendor_travel_buffer_minutes, type: integer, source: input, default: 60, description: "Minimum gap required between consecutive jobs assigned to the same vendor" }
      - { name: entry_notice_min_hours, type: integer, source: input, default: 24, description: "Minimum lead time between notice_posted_at and scheduled_start_at for NOTICE_POSTED entry" }

  - name: Resident
    parent: null
    common_fields: true
    fields:
      - { name: property_id, type: string, source: input, description: "FK -> Property.id; property the resident belongs to" }
      - { name: unit_number, type: string, source: input, description: "Unit identifier within the property (e.g. '101')" }
      - { name: full_name, type: string, source: input, description: "Resident full name" }
      - { name: email, type: string, source: input, description: "Resident contact email" }
      - { name: chargeback_balance_cents, type: integer, source: computed, default: 0, description: "Sum of final_amount_cents over this resident's Chargebacks with status in {BILLED, DISPUTED}" }

  - name: Technician
    parent: null
    common_fields: true
    fields:
      - { name: property_id, type: string, source: input, description: "FK -> Property.id; employing property" }
      - { name: full_name, type: string, source: input, description: "Technician full name" }
      - { name: trade, type: enum, source: input, description: "PLUMBING | ELECTRICAL | HVAC | APPLIANCE | GENERAL" }

  - name: Vendor
    parent: null
    common_fields: true
    fields:
      - { name: property_id, type: string, source: input, description: "FK -> Property.id; property this vendor serves" }
      - { name: company_name, type: string, source: input, description: "Vendor company name" }
      - { name: trade, type: enum, source: input, description: "PLUMBING | ELECTRICAL | HVAC | APPLIANCE | GENERAL" }
      - { name: insurance_valid_until, type: datetime, source: input, description: "Vendor insurance expiry; dispatch requires insurance_valid_until >= scheduled_start_at" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED; initial ACTIVE" }

  - name: Part
    parent: null
    common_fields: true
    fields:
      - { name: property_id, type: string, source: input, description: "FK -> Property.id; property stocking this part" }
      - { name: sku, type: string, source: input, description: "Stock keeping unit; unique within the property" }
      - { name: name, type: string, source: input, description: "Part display name" }
      - { name: unit_cost_cents, type: integer, source: input, description: "Current standard unit cost in cents" }
      - { name: reorder_level, type: integer, source: input, default: 0, description: "quantity_on_hand <= reorder_level marks the part LOW_STOCK" }
      - { name: initial_stock, type: integer, source: input, default: 0, description: "Starting on-hand quantity (>= 0); seeds quantity_on_hand at creation" }
      - { name: quantity_on_hand, type: integer, source: system, description: "Physical stock; = initial_stock at creation; -= qty on reserve; += qty on release; -= qty on consume; += qty on purchase receive" }
      - { name: reserved_quantity, type: integer, source: computed, description: "Sum of quantity over WorkOrderParts with status RESERVED for this part" }
      - { name: restock_status, type: enum, source: computed, description: "IN_STOCK | LOW_STOCK; LOW_STOCK iff quantity_on_hand <= reorder_level" }

  - name: WorkOrder
    parent: null
    common_fields: true
    fields:
      - { name: property_id, type: string, source: input, description: "FK -> Property.id" }
      - { name: resident_id, type: string, source: input, description: "FK -> Resident.id; reporting resident; must equal X-User-ID when created by Resident role" }
      - { name: unit_number, type: string, source: computed, description: "Snapshot of Resident.unit_number at creation" }
      - { name: category, type: enum, source: input, description: "PLUMBING | ELECTRICAL | HVAC | APPLIANCE | GENERAL" }
      - { name: priority, type: enum, source: input, description: "EMERGENCY | URGENT | ROUTINE; reclassifiable via PATCH while TRIAGED" }
      - { name: description, type: string, source: input, description: "Free-text problem description" }
      - { name: status, type: enum, source: system, description: "TRIAGED | ASSIGNED | IN_PROGRESS | COMPLETED | REOPENED | CLOSED | CANCELLED; initial TRIAGED" }
      - { name: assignment_type, type: enum, source: system, description: "IN_HOUSE | VENDOR; null until dispatched" }
      - { name: assigned_technician_id, type: string, source: system, description: "FK -> Technician.id; set on IN_HOUSE dispatch; null otherwise; nullable" }
      - { name: assigned_vendor_id, type: string, source: system, description: "FK -> Vendor.id; set on VENDOR dispatch; null otherwise; nullable" }
      - { name: scheduled_start_at, type: datetime, source: system, description: "Scheduled window start, taken from dispatch payload; nullable" }
      - { name: scheduled_end_at, type: datetime, source: system, description: "Scheduled window end, taken from dispatch payload; nullable" }
      - { name: entry_authorization, type: enum, source: system, description: "EMERGENCY_ACCESS | RESIDENT_CONSENT | NOTICE_POSTED; taken from dispatch payload; nullable" }
      - { name: notice_posted_at, type: datetime, source: system, description: "When entry notice was posted; required at dispatch iff entry_authorization == NOTICE_POSTED; nullable" }
      - { name: first_responded_at, type: datetime, source: system, description: "Logical clock time of the FIRST dispatch of this work order; never overwritten by later re-dispatches; nullable" }
      - { name: started_at, type: datetime, source: system, description: "Logical clock time when work started; nullable" }
      - { name: completed_at, type: datetime, source: system, description: "Logical clock time of the most recent completion; nullable" }
      - { name: closed_at, type: datetime, source: system, description: "Logical clock time when closed; nullable" }
      - { name: response_due_at, type: datetime, source: computed, description: "created_at + <priority>_response_hours of the property; recomputed when priority changes via PATCH" }
      - { name: completion_due_at, type: datetime, source: computed, description: "created_at + <priority>_completion_hours of the property; recomputed when priority changes via PATCH" }
      - { name: response_sla_breached, type: boolean, source: computed, description: "Set at first dispatch: first_responded_at > response_due_at (strictly greater); false before first dispatch" }
      - { name: completion_sla_breached, type: boolean, source: computed, description: "Set at each completion: completed_at > completion_due_at (strictly greater); false before completion" }
      - { name: resident_signoff, type: boolean, source: system, default: false, description: "True once the reporting resident signs off; reset to false on reopen" }
      - { name: photo_urls, type: array, source: system, description: "Completion photo URLs from the most recent complete call" }
      - { name: damage_reported, type: boolean, source: system, default: false, description: "From complete payload; resident-caused damage flag" }
      - { name: estimated_damage_cost_cents, type: integer, source: system, description: "From complete payload when damage_reported is true; nullable" }
      - { name: recall_count, type: integer, source: system, default: 0, description: "Number of times this work order has been reopened" }
      - { name: parts_total_cents, type: integer, source: computed, default: 0, description: "Sum of line_total_cents over this work order's WorkOrderParts with status CONSUMED" }

  - name: WorkOrderPart
    parent: null
    common_fields: true
    fields:
      - { name: work_order_id, type: string, source: input, description: "FK -> WorkOrder.id" }
      - { name: part_id, type: string, source: input, description: "FK -> Part.id" }
      - { name: quantity, type: integer, source: input, description: "Units reserved; >= 1" }
      - { name: unit_cost_cents_snapshot, type: integer, source: system, description: "Part.unit_cost_cents captured at reservation time" }
      - { name: line_total_cents, type: integer, source: computed, description: "quantity * unit_cost_cents_snapshot" }
      - { name: status, type: enum, source: system, description: "RESERVED | CONSUMED | RELEASED; initial RESERVED" }

  - name: PurchaseRequest
    parent: null
    common_fields: true
    fields:
      - { name: work_order_id, type: string, source: input, description: "FK -> WorkOrder.id" }
      - { name: part_id, type: string, source: input, description: "FK -> Part.id" }
      - { name: quantity, type: integer, source: input, description: "Units to purchase; >= 1" }
      - { name: quoted_unit_cost_cents, type: integer, source: input, description: "Supplier quoted unit cost; >= 0" }
      - { name: shipping_fee_cents, type: integer, source: input, default: 0, description: "Flat shipping fee; >= 0" }
      - { name: items_subtotal_cents, type: integer, source: computed, description: "quantity * quoted_unit_cost_cents" }
      - { name: handling_fee_cents, type: integer, source: computed, description: "0 if quantity >= 10 else round_half_up(items_subtotal_cents * 0.08)" }
      - { name: estimated_total_cents, type: integer, source: computed, description: "items_subtotal_cents + shipping_fee_cents + handling_fee_cents" }
      - { name: auto_approved, type: boolean, source: system, description: "True when status was set to APPROVED automatically at creation" }
      - { name: status, type: enum, source: system, description: "PENDING | APPROVED | REJECTED | SUPERSEDED | RECEIVED; initial PENDING (may auto-advance to APPROVED at creation)" }
      - { name: decision_reason, type: string, source: system, description: "Reason supplied on REJECT; nullable" }

  - name: Chargeback
    parent: null
    common_fields: true
    fields:
      - { name: work_order_id, type: string, source: input, description: "FK -> WorkOrder.id" }
      - { name: resident_id, type: string, source: input, description: "FK -> Resident.id; resident being charged" }
      - { name: provisional_amount_cents, type: integer, source: system, description: "WorkOrder.estimated_damage_cost_cents captured when the chargeback is created at completion" }
      - { name: line_items, type: array, source: system, description: "Finalized lines [{description, quantity, unit_cost_cents, resident_share_pct}] supplied on BILL; empty until billed" }
      - { name: final_amount_cents, type: integer, source: computed, description: "Sum over lines of round_half_up(quantity * unit_cost_cents * resident_share_pct); null until billed; nullable" }
      - { name: status, type: enum, source: system, description: "PENDING | BILLED | DISPUTED | PAID | WAIVED; initial PENDING" }
      - { name: dispute_reason, type: string, source: system, description: "Reason supplied on DISPUTE; nullable" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: WorkOrder
    initial_state: TRIAGED
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: TRIAGED
        to: ASSIGNED
        trigger: "POST /work-orders/{id}/dispatch"
        actor: Dispatcher
        preconditions:
          - "WorkOrder.status == TRIAGED"
          - "assignment_type == IN_HOUSE: Technician exists, Technician.property_id == WorkOrder.property_id, Technician.trade == WorkOrder.category, and no technician schedule conflict (half-open overlap rule)"
          - "assignment_type == VENDOR: Vendor exists, Vendor.property_id == WorkOrder.property_id, Vendor.trade == WorkOrder.category, Vendor.status == ACTIVE, Vendor.insurance_valid_until >= scheduled_start_at, and no vendor schedule conflict (travel-buffer rule)"
          - "entry_authorization == EMERGENCY_ACCESS only if priority == EMERGENCY"
          - "entry_authorization == NOTICE_POSTED requires notice_posted_at present and scheduled_start_at >= notice_posted_at + Property.entry_notice_min_hours"
          - "scheduled_end_at > scheduled_start_at"
        side_effects:
          - "assignment_type, assigned_technician_id or assigned_vendor_id, scheduled window, entry_authorization, notice_posted_at set on the WorkOrder"
          - "first_responded_at := current logical clock if null (never overwritten on re-dispatch)"
          - "response_sla_breached recomputed: first_responded_at > response_due_at"
          - "increments WorkOrder.version by 1"
      - from: REOPENED
        to: ASSIGNED
        trigger: "POST /work-orders/{id}/dispatch"
        actor: Dispatcher
        preconditions:
          - "WorkOrder.status == REOPENED"
          - "same assignment, entry, trade, insurance, and schedule-conflict rules as TRIAGED -> ASSIGNED"
        side_effects:
          - "assignment fields set; first_responded_at NOT overwritten (already set)"
          - "increments WorkOrder.version by 1"
      - from: ASSIGNED
        to: IN_PROGRESS
        trigger: "POST /work-orders/{id}/start"
        actor: Technician or Vendor
        preconditions:
          - "WorkOrder.status == ASSIGNED"
          - "entity-backed caller is the assigned party: IN_HOUSE requires assigned_technician_id == X-User-ID; VENDOR requires assigned_vendor_id == X-User-ID"
          - "entry_authorization == RESIDENT_CONSENT requires payload resident_consent_confirmed == true"
          - "entry_authorization == NOTICE_POSTED requires current logical clock >= notice_posted_at + Property.entry_notice_min_hours"
        side_effects:
          - "started_at := current logical clock"
          - "increments WorkOrder.version by 1"
      - from: IN_PROGRESS
        to: IN_PROGRESS
        trigger: "POST /work-orders/{id}/sign-off"
        actor: Resident
        preconditions:
          - "WorkOrder.status == IN_PROGRESS"
          - "X-User-ID == WorkOrder.resident_id"
        side_effects:
          - "resident_signoff := true"
          - "increments WorkOrder.version by 1"
        note: "Self-transition recording resident sign-off; status remains IN_PROGRESS."
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /work-orders/{id}/complete"
        actor: Technician or Vendor
        preconditions:
          - "WorkOrder.status == IN_PROGRESS"
          - "entity-backed caller is the assigned party"
          - "resident_signoff == true (ERR_RESIDENT_SIGNOFF_REQUIRED)"
          - "len(photo_urls) >= 1 (ERR_COMPLETION_PHOTOS_REQUIRED)"
          - "every PurchaseRequest with work_order_id == WorkOrder.id has status in {RECEIVED, REJECTED, SUPERSEDED} (ERR_OPEN_PURCHASE_REQUESTS)"
          - "damage_reported == true requires estimated_damage_cost_cents present and > 0"
        side_effects:
          - "completed_at := current logical clock; completion_sla_breached := (completed_at > completion_due_at); photo_urls, damage_reported, estimated_damage_cost_cents stored"
          - "CASCADE link 1: every WorkOrderPart of this work order with status RESERVED -> CONSUMED"
          - "CASCADE link 2: per consumed line, Part.reserved_quantity -= line.quantity (quantity_on_hand was already debited at reserve time; consumption writes the stock off)"
          - "CASCADE link 3: per mutated Part, restock_status recomputed (LOW_STOCK iff quantity_on_hand <= reorder_level); WorkOrder.parts_total_cents recomputed as sum of line_total_cents over CONSUMED lines"
          - "if damage_reported: create Chargeback(status=PENDING, work_order_id, resident_id=WorkOrder.resident_id, provisional_amount_cents=estimated_damage_cost_cents)"
          - "increments WorkOrder.version by 1"
      - from: COMPLETED
        to: REOPENED
        trigger: "POST /work-orders/{id}/reopen"
        actor: Resident or Dispatcher
        preconditions:
          - "WorkOrder.status == COMPLETED"
          - "current logical clock - completed_at <= Property.recall_window_days (equality allowed)"
          - "Resident caller must satisfy X-User-ID == WorkOrder.resident_id"
        side_effects:
          - "recall_count += 1; resident_signoff := false; assignment fields cleared (assignment_type, assigned_technician_id, assigned_vendor_id, scheduled window, entry_authorization, notice_posted_at set to null)"
          - "increments WorkOrder.version by 1"
      - from: COMPLETED
        to: CLOSED
        trigger: "POST /work-orders/{id}/close"
        actor: PropertyManager
        preconditions:
          - "WorkOrder.status == COMPLETED"
        side_effects:
          - "closed_at := current logical clock"
          - "increments WorkOrder.version by 1"
      - from: TRIAGED
        to: CANCELLED
        trigger: "POST /work-orders/{id}/cancel"
        actor: Resident or Dispatcher
        preconditions:
          - "WorkOrder.status == TRIAGED"
          - "Resident caller must satisfy X-User-ID == WorkOrder.resident_id"
        side_effects:
          - "increments WorkOrder.version by 1"
      - from: ASSIGNED
        to: CANCELLED
        trigger: "POST /work-orders/{id}/cancel"
        actor: Resident or Dispatcher
        preconditions:
          - "WorkOrder.status == ASSIGNED"
          - "Resident caller must satisfy X-User-ID == WorkOrder.resident_id"
        side_effects:
          - "every RESERVED WorkOrderPart of this work order -> RELEASED; per released line Part.quantity_on_hand += quantity and Part.reserved_quantity -= quantity; restock_status recomputed"
          - "assignment fields cleared"
          - "increments WorkOrder.version by 1"
      - from: REOPENED
        to: CANCELLED
        trigger: "POST /work-orders/{id}/cancel"
        actor: Resident or Dispatcher
        preconditions:
          - "WorkOrder.status == REOPENED"
          - "Resident caller must satisfy X-User-ID == WorkOrder.resident_id"
        side_effects:
          - "increments WorkOrder.version by 1"
      - from: ASSIGNED
        to: TRIAGED
        trigger: "system (vendor suspension cascade)"
        actor: system
        preconditions:
          - "fires only for WorkOrders with assigned_vendor_id == the suspended Vendor and status == ASSIGNED"
        side_effects:
          - "assignment fields cleared (assignment_type, assigned_vendor_id, scheduled window, entry_authorization, notice_posted_at set to null); first_responded_at retained"
          - "CASCADE: every RESERVED WorkOrderPart of this work order -> RELEASED; per released line Part.quantity_on_hand += quantity, Part.reserved_quantity -= quantity; restock_status recomputed"
          - "increments WorkOrder.version by 1"

  - entity: Vendor
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /vendors/{id}/events (event_type=SUSPEND)"
        actor: PropertyManager
        preconditions:
          - "Vendor.status == ACTIVE"
        side_effects:
          - "CASCADE link 1: every WorkOrder with assigned_vendor_id == this Vendor and status == ASSIGNED -> TRIAGED (assignment cleared)"
          - "CASCADE link 2: each such WorkOrder's RESERVED WorkOrderParts -> RELEASED"
          - "CASCADE link 3: per released line Part.quantity_on_hand += quantity, Part.reserved_quantity -= quantity; restock_status recomputed (may flip LOW_STOCK -> IN_STOCK)"
          - "WorkOrders already IN_PROGRESS with this vendor are NOT affected"
          - "increments Vendor.version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /vendors/{id}/events (event_type=REINSTATE)"
        actor: PropertyManager
        preconditions:
          - "Vendor.status == SUSPENDED"
        side_effects:
          - "WorkOrders previously reverted to TRIAGED are NOT auto-restored; they require a fresh dispatch"
          - "increments Vendor.version by 1"

  - entity: WorkOrderPart
    initial_state: RESERVED
    terminal_states: [CONSUMED, RELEASED]
    transitions:
      - from: RESERVED
        to: CONSUMED
        trigger: "system (work order completion)"
        actor: system
        preconditions:
          - "parent WorkOrder completes"
        side_effects:
          - "Part.reserved_quantity -= quantity (quantity_on_hand unchanged; it was debited at reserve time); restock_status recomputed"
      - from: RESERVED
        to: RELEASED
        trigger: "POST /work-orders/{id}/parts/{wop_id}/release OR system (cancel / vendor-suspend cascade)"
        actor: Technician or Vendor or Dispatcher or system
        preconditions:
          - "WorkOrderPart.status == RESERVED"
          - "manual release: caller is the assigned party of the parent WorkOrder or a Dispatcher"
        side_effects:
          - "Part.quantity_on_hand += quantity; Part.reserved_quantity -= quantity; restock_status recomputed"

  - entity: PurchaseRequest
    initial_state: PENDING
    terminal_states: [REJECTED, SUPERSEDED, RECEIVED]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "system (auto-approval at creation when estimated_total_cents <= Property.purchase_auto_approve_threshold_cents) OR POST /purchase-requests/{id}/events (event_type=APPROVE)"
        actor: system or PropertyManager
        preconditions:
          - "manual APPROVE: PurchaseRequest.status == PENDING"
        side_effects:
          - "auto-approval sets auto_approved := true; manual approval sets auto_approved := false"
      - from: PENDING
        to: REJECTED
        trigger: "POST /purchase-requests/{id}/events (event_type=REJECT)"
        actor: PropertyManager
        preconditions:
          - "PurchaseRequest.status == PENDING"
        side_effects:
          - "decision_reason := payload decision_reason"
      - from: PENDING
        to: SUPERSEDED
        trigger: "system (a new PurchaseRequest is created for the same (work_order_id, part_id) while this one is PENDING)"
        actor: system
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: RECEIVED
        trigger: "POST /purchase-requests/{id}/events (event_type=RECEIVE)"
        actor: PropertyManager
        preconditions:
          - "PurchaseRequest.status == APPROVED"
        side_effects:
          - "Part.quantity_on_hand += PurchaseRequest.quantity; restock_status recomputed"

  - entity: Chargeback
    initial_state: PENDING
    terminal_states: [PAID, WAIVED]
    transitions:
      - from: PENDING
        to: BILLED
        trigger: "POST /chargebacks/{id}/events (event_type=BILL)"
        actor: PropertyManager
        preconditions:
          - "Chargeback.status == PENDING"
          - "payload line_items present and non-empty; each line quantity >= 1, unit_cost_cents >= 0, 0 <= resident_share_pct <= 1"
        side_effects:
          - "final_amount_cents computed per chargeback_amount calculation (per-line round_half_up, then sum)"
          - "line_items stored"
          - "Resident.chargeback_balance_cents recomputed (increases by final_amount_cents)"
      - from: BILLED
        to: DISPUTED
        trigger: "POST /chargebacks/{id}/events (event_type=DISPUTE)"
        actor: Resident
        preconditions:
          - "Chargeback.status == BILLED"
          - "X-User-ID == Chargeback.resident_id"
        side_effects:
          - "dispute_reason := payload dispute_reason"
          - "Resident.chargeback_balance_cents unchanged (DISPUTED remains in the balance input set)"
      - from: DISPUTED
        to: BILLED
        trigger: "POST /chargebacks/{id}/events (event_type=UPHOLD)"
        actor: PropertyManager
        preconditions:
          - "Chargeback.status == DISPUTED"
        side_effects:
          - "Resident.chargeback_balance_cents unchanged"
      - from: BILLED
        to: WAIVED
        trigger: "POST /chargebacks/{id}/events (event_type=WAIVE)"
        actor: PropertyManager
        preconditions:
          - "Chargeback.status == BILLED"
        side_effects:
          - "Resident.chargeback_balance_cents recomputed (decreases by final_amount_cents)"
      - from: DISPUTED
        to: WAIVED
        trigger: "POST /chargebacks/{id}/events (event_type=WAIVE)"
        actor: PropertyManager
        preconditions:
          - "Chargeback.status == DISPUTED"
        side_effects:
          - "Resident.chargeback_balance_cents recomputed (decreases by final_amount_cents)"
      - from: BILLED
        to: PAID
        trigger: "POST /chargebacks/{id}/events (event_type=PAY)"
        actor: Resident
        preconditions:
          - "Chargeback.status == BILLED"
          - "X-User-ID == Chargeback.resident_id"
        side_effects:
          - "Resident.chargeback_balance_cents recomputed (decreases by final_amount_cents)"

# =============================================================================
# 1.2.1 Concurrency Rules (OCC on parent version only)
# =============================================================================
concurrency_rules:
  - rule_id: wo-triage-stale-version
    parent_entity: WorkOrder
    write_endpoint: "PATCH /work-orders/{id}"
    occ_field: "expected_work_order_version"
    description: |
      Editing a TRIAGED work order (priority/category/description) against a
      WorkOrder whose version has advanced since the client last observed it is
      rejected. The edit does not change status, so a second sequential edit
      would otherwise legitimately succeed; OCC on WorkOrder.version is the
      guard.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: pr-create-stale-work-order
    parent_entity: WorkOrder
    write_endpoint: "POST /work-orders/{id}/purchase-requests"
    occ_field: "expected_work_order_version"
    description: |
      Creating a PurchaseRequest against a WorkOrder whose version has advanced
      since the client last observed it is rejected. Creation legitimately
      supersedes any prior PENDING request for the same (work_order_id,
      part_id), so a second sequential create would otherwise succeed; OCC on
      WorkOrder.version is the guard.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: sla_due_timestamps
    trigger: "work order creation; recomputed on PATCH when priority changes"
    algorithm: threshold
    formula: |
      response_due_at   = created_at + Property.<priority>_response_hours   * 3600s
      completion_due_at = created_at + Property.<priority>_completion_hours * 3600s
      response_sla_breached   := (first_responded_at > response_due_at)    # strict >
      completion_sla_breached := (completed_at      > completion_due_at)   # strict >
    input_set: "the WorkOrder and its Property SLA configuration"
    precision: "ISO 8601 UTC timestamps; breach comparison is strictly greater-than (equal to due == not breached)"

  - name: sla_compliance_report
    trigger: "GET /properties/{id}/sla-report"
    algorithm: aggregation
    formula: |
      For each priority P in {EMERGENCY, URGENT, ROUTINE}:
        eligible(P) = work orders of the property with priority == P and
                      created_at in [window_start, window_end)  (half-open)
        Variant CLOSED_ONLY:     eligible restricted to status in {COMPLETED, CLOSED}
        Variant OPEN_INCLUSIVE:  eligible also includes status in {TRIAGED, ASSIGNED, IN_PROGRESS, REOPENED}
        response_compliant(wo):
          status in {COMPLETED, CLOSED}: wo.response_sla_breached == false
          open (OPEN_INCLUSIVE only): first_responded_at != null ? first_responded_at <= response_due_at : now <= response_due_at
        completion_compliant(wo):
          status in {COMPLETED, CLOSED}: wo.completion_sla_breached == false
          open (OPEN_INCLUSIVE only): completed_at != null ? completed_at <= completion_due_at : now <= completion_due_at
        response_compliance_pct   = round_half_up(100 * count(response_compliant)   / count(eligible), 2)
        completion_compliance_pct = round_half_up(100 * count(completion_compliant) / count(eligible), 2)
        if count(eligible) == 0: both percentages are 100.00
    input_set: "WorkOrders of the property filtered by priority and created_at window; status filter depends on variant"
    precision: "percentages at 2 decimal places, round_half_up"
    variants:
      - name: CLOSED_ONLY
        when: "request basis=CLOSED_ONLY"
        difference: "only COMPLETED/CLOSED work orders are eligible; open work orders are excluded entirely"
      - name: OPEN_INCLUSIVE
        when: "request basis=OPEN_INCLUSIVE"
        difference: "open work orders enter the denominator; each is compliant iff it is not yet past its due timestamp at report time"

  - name: purchase_request_total
    trigger: "PurchaseRequest creation"
    algorithm: tiered_pricing
    formula: |
      items_subtotal_cents = quantity * quoted_unit_cost_cents
      handling_fee_cents   = 0                                      if quantity >= BULK_HANDLING_FREE_QTY
                           = round_half_up(items_subtotal_cents * HANDLING_PCT)  otherwise
      estimated_total_cents = items_subtotal_cents + shipping_fee_cents + handling_fee_cents
      if estimated_total_cents <= Property.purchase_auto_approve_threshold_cents:
          status := APPROVED, auto_approved := true
      else:
          status := PENDING, auto_approved := false
    input_set: "the new PurchaseRequest payload and the Property threshold"
    constants:
      BULK_HANDLING_FREE_QTY: 10
      HANDLING_PCT: 0.08
    precision: "integer cents; handling fee round_half_up to the nearest cent; threshold comparison is <="

  - name: chargeback_amount
    trigger: "work order completion with damage_reported (PROVISIONAL); chargeback BILL (FINAL)"
    algorithm: aggregation
    formula: |
      PROVISIONAL: provisional_amount_cents = WorkOrder.estimated_damage_cost_cents
                   (raw technician estimate, no rounding, captured at completion)
      FINAL:       final_amount_cents = sum over line_items of
                     round_half_up(quantity * unit_cost_cents * resident_share_pct)
                   rounding is applied PER LINE, then rounded lines are summed
                   (the alternative sum-then-round order is NOT used)
    input_set: "PROVISIONAL: the completing WorkOrder; FINAL: the line_items supplied on BILL"
    precision: "integer cents, round_half_up per line"
    variants:
      - name: PROVISIONAL
        when: "chargeback exists in PENDING status"
        difference: "uses the technician's raw completion estimate; ignores finalized line items"
      - name: FINAL
        when: "chargeback is billed"
        difference: "uses per-line rounded sum of finalized line items; generally differs from the provisional estimate"

  - name: resident_chargeback_balance
    trigger: "chargeback transitions BILL, WAIVE, PAY (recompute); read on Resident"
    algorithm: aggregation
    formula: |
      Resident.chargeback_balance_cents =
        sum of final_amount_cents over Chargebacks with resident_id == Resident.id
        and status in {BILLED, DISPUTED}
    input_set: "Chargebacks of the resident with status in {BILLED, DISPUTED}; PENDING, PAID and WAIVED are excluded"
    precision: "integer cents"

  - name: part_stock_ledger
    trigger: "part reserve, release, completion consume, purchase receive"
    algorithm: aggregation
    formula: |
      reserve:  quantity_on_hand -= qty; reserved_quantity += qty
      release:  quantity_on_hand += qty; reserved_quantity -= qty
      consume:  reserved_quantity -= qty                       (stock leaves the building)
      receive:  quantity_on_hand += PurchaseRequest.quantity
      restock_status := LOW_STOCK if quantity_on_hand <= reorder_level else IN_STOCK
      Invariant: a reserve followed by its compensating release leaves
      (quantity_on_hand + reserved_quantity) unchanged.
    input_set: "the Part and the affected WorkOrderPart / PurchaseRequest"
    precision: "integer units"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all endpoints"
  - priority: 2
    category: auth
    check: "Role is permitted on this endpoint per the endpoint roles list"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all endpoints"
  - priority: 3
    category: auth
    check: "Entity-backed ownership: Resident X-User-ID == WorkOrder.resident_id (create with resident_id == X-User-ID, sign-off, reopen, cancel, DISPUTE/PAY); Technician/Vendor X-User-ID == assigned party on start/complete/parts"
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "ownership-scoped endpoints"
  - priority: 4
    category: existence
    check: "Path resource ids exist (work order, part, work-order-part, purchase request, chargeback, vendor, technician, resident, property)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path ids"
  - priority: 5
    category: concurrency
    check: "expected_work_order_version equals current WorkOrder.version on PATCH and on POST /work-orders/{id}/purchase-requests"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "PATCH /work-orders/{id}; POST /work-orders/{id}/purchase-requests"
  - priority: 6
    category: state
    check: "Target resource is in a status that allows the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 7
    category: business_safety
    check: "Entry rules: EMERGENCY_ACCESS only when priority == EMERGENCY; RESIDENT_CONSENT requires resident_consent_confirmed == true at start; NOTICE_POSTED at start requires clock >= notice_posted_at + entry_notice_min_hours"
    error_id: ERR_ENTRY_RULE_VIOLATION
    http_status: 422
    applies_to: "POST /work-orders/{id}/dispatch; POST /work-orders/{id}/start"
  - priority: 8
    category: business_safety
    check: "NOTICE_POSTED at dispatch: notice_posted_at present and scheduled_start_at >= notice_posted_at + Property.entry_notice_min_hours"
    error_id: ERR_ENTRY_NOTICE_TOO_SHORT
    http_status: 422
    applies_to: "POST /work-orders/{id}/dispatch"
  - priority: 9
    category: business_safety
    check: "Vendor dispatch: Vendor.status == ACTIVE"
    error_id: ERR_VENDOR_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /work-orders/{id}/dispatch"
  - priority: 10
    category: business_safety
    check: "Vendor dispatch: Vendor.insurance_valid_until >= scheduled_start_at"
    error_id: ERR_VENDOR_INSURANCE_EXPIRED
    http_status: 409
    applies_to: "POST /work-orders/{id}/dispatch"
  - priority: 11
    category: business_temporal
    check: "Technician half-open overlap: no other WorkOrder with same assigned_technician_id and status in {ASSIGNED, IN_PROGRESS} where existing.scheduled_start_at < new.scheduled_end_at AND new.scheduled_start_at < existing.scheduled_end_at (adjacent windows allowed)"
    error_id: ERR_TECHNICIAN_SCHEDULE_CONFLICT
    http_status: 409
    applies_to: "POST /work-orders/{id}/dispatch"
  - priority: 12
    category: business_temporal
    check: "Vendor travel-buffer overlap: no other WorkOrder with same assigned_vendor_id and status in {ASSIGNED, IN_PROGRESS} unless new.scheduled_start_at >= existing.scheduled_end_at + buffer OR new.scheduled_end_at + buffer <= existing.scheduled_start_at, buffer = Property.vendor_travel_buffer_minutes (gap exactly == buffer allowed)"
    error_id: ERR_VENDOR_SCHEDULE_CONFLICT
    http_status: 409
    applies_to: "POST /work-orders/{id}/dispatch"
  - priority: 13
    category: business_temporal
    check: "Reopen window: current logical clock - completed_at <= Property.recall_window_days (equality allowed)"
    error_id: ERR_RECALL_WINDOW_EXPIRED
    http_status: 409
    applies_to: "POST /work-orders/{id}/reopen"
  - priority: 14
    category: business_constraint
    check: "Assignment trade match: Technician.trade / Vendor.trade == WorkOrder.category"
    error_id: ERR_TRADE_MISMATCH
    http_status: 409
    applies_to: "POST /work-orders/{id}/dispatch"
  - priority: 15
    category: business_constraint
    check: "Part reserve: quantity >= 1 and Part.property_id == WorkOrder.property_id and Part.quantity_on_hand >= quantity (equality allowed)"
    error_id: ERR_PART_INSUFFICIENT_STOCK
    http_status: 409
    applies_to: "POST /work-orders/{id}/parts"
  - priority: 16
    category: business_constraint
    check: "Part sku unique within property"
    error_id: ERR_DUPLICATE_SKU
    http_status: 409
    applies_to: "POST /parts"
  - priority: 17
    category: business_constraint
    check: "Completion blocked while any PurchaseRequest of the work order is in {PENDING, APPROVED}"
    error_id: ERR_OPEN_PURCHASE_REQUESTS
    http_status: 409
    applies_to: "POST /work-orders/{id}/complete"
  - priority: 18
    category: business_safety
    check: "Completion requires resident_signoff == true"
    error_id: ERR_RESIDENT_SIGNOFF_REQUIRED
    http_status: 409
    applies_to: "POST /work-orders/{id}/complete"
  - priority: 19
    category: business_constraint
    check: "Completion requires len(photo_urls) >= 1"
    error_id: ERR_COMPLETION_PHOTOS_REQUIRED
    http_status: 422
    applies_to: "POST /work-orders/{id}/complete"
  - priority: 20
    category: business_fiscal
    check: "BILL requires non-empty line_items with valid line fields; complete with damage_reported requires estimated_damage_cost_cents > 0"
    error_id: ERR_CHARGEBACK_LINES_REQUIRED
    http_status: 422
    applies_to: "POST /chargebacks/{id}/events"
  - priority: 21
    category: business_constraint
    check: "General shape: required fields present, enums valid, quantity >= 1, datetimes well-formed, scheduled_end_at > scheduled_start_at"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all endpoints"

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 5: API Endpoint Table
# =============================================================================
endpoints:
  # --- Property ---
  - method: POST
    path: "/properties"
    description: "Create a property with SLA/threshold policy configuration (defaults applied when omitted)"
    roles: [PropertyManager]
    code: 201
    input: [name, "emergency_response_hours?", "emergency_completion_hours?", "urgent_response_hours?", "urgent_completion_hours?", "routine_response_hours?", "routine_completion_hours?", "purchase_auto_approve_threshold_cents?", "recall_window_days?", "vendor_travel_buffer_minutes?", "entry_notice_min_hours?"]
    output: Property
    side_effects: ["omitted policy fields take their §1.1 defaults"]
  - method: GET
    path: "/properties/{id}"
    description: "Get a property"
    roles: [Resident, Dispatcher, Technician, Vendor, PropertyManager]
    code: 200
    input: []
    output: Property
    side_effects: []
  - method: GET
    path: "/properties/{id}/sla-report"
    description: "Response/completion SLA compliance per priority over a created_at window; basis selects the calculation variant"
    roles: [Dispatcher, PropertyManager]
    code: 200
    input: [window_start, window_end, "basis?"]
    output: "{ property_id: string, window_start: datetime, window_end: datetime, basis: string, generated_at: datetime, metrics: array }"
    side_effects: ["computes sla_compliance_report (default basis OPEN_INCLUSIVE)"]

  # --- Resident ---
  - method: POST
    path: "/residents"
    description: "Create a resident"
    roles: [PropertyManager]
    code: 201
    input: [property_id, unit_number, full_name, email]
    output: Resident
    side_effects: ["chargeback_balance_cents initialized to 0"]
  - method: GET
    path: "/residents"
    description: "List residents, optionally filtered by property"
    roles: [Dispatcher, PropertyManager]
    code: 200
    input: ["property_id?", "limit?", "offset?"]
    output: Resident[]
    side_effects: []
  - method: GET
    path: "/residents/{id}"
    description: "Get a resident (includes chargeback_balance_cents)"
    roles: [Resident, Dispatcher, PropertyManager]
    code: 200
    input: []
    output: Resident
    side_effects: []

  # --- Technician ---
  - method: POST
    path: "/technicians"
    description: "Create an in-house technician"
    roles: [PropertyManager]
    code: 201
    input: [property_id, full_name, trade]
    output: Technician
    side_effects: []
  - method: GET
    path: "/technicians"
    description: "List technicians, optionally filtered by property"
    roles: [Dispatcher, PropertyManager]
    code: 200
    input: ["property_id?", "limit?", "offset?"]
    output: Technician[]
    side_effects: []
  - method: GET
    path: "/technicians/{id}"
    description: "Get a technician"
    roles: [Dispatcher, Technician, PropertyManager]
    code: 200
    input: []
    output: Technician
    side_effects: []

  # --- Vendor ---
  - method: POST
    path: "/vendors"
    description: "Create a vendor"
    roles: [PropertyManager]
    code: 201
    input: [property_id, company_name, trade, insurance_valid_until]
    output: Vendor
    side_effects: ["status initialized to ACTIVE"]
  - method: GET
    path: "/vendors"
    description: "List vendors, optionally filtered by property"
    roles: [Dispatcher, PropertyManager]
    code: 200
    input: ["property_id?", "limit?", "offset?"]
    output: Vendor[]
    side_effects: []
  - method: GET
    path: "/vendors/{id}"
    description: "Get a vendor"
    roles: [Dispatcher, Vendor, PropertyManager]
    code: 200
    input: []
    output: Vendor
    side_effects: []
  - method: POST
    path: "/vendors/{id}/events"
    description: "Vendor lifecycle event (SUSPEND | REINSTATE)"
    roles: [PropertyManager]
    code: 200
    input: [event_type, "reason?"]
    output: Vendor
    side_effects:
      - "SUSPEND: cascade — ASSIGNED work orders of this vendor revert to TRIAGED (assignment cleared), their RESERVED parts RELEASED, Part stock restored and restock_status recomputed"
      - "REINSTATE: status -> ACTIVE; previously reverted work orders are NOT auto-restored"

  # --- Part ---
  - method: POST
    path: "/parts"
    description: "Create a stocked part"
    roles: [PropertyManager]
    code: 201
    input: [property_id, sku, name, unit_cost_cents, "reorder_level?", "initial_stock?"]
    output: Part
    side_effects: ["quantity_on_hand := initial_stock; reserved_quantity := 0; restock_status computed"]
  - method: GET
    path: "/parts"
    description: "List parts, optionally filtered by property"
    roles: [Dispatcher, Technician, Vendor, PropertyManager]
    code: 200
    input: ["property_id?", "limit?", "offset?"]
    output: Part[]
    side_effects: []
  - method: GET
    path: "/parts/{id}"
    description: "Get a part"
    roles: [Dispatcher, Technician, Vendor, PropertyManager]
    code: 200
    input: []
    output: Part
    side_effects: []

  # --- WorkOrder ---
  - method: POST
    path: "/work-orders"
    description: "Resident files a maintenance request; classified with priority at intake"
    roles: [Resident]
    code: 201
    input: [property_id, resident_id, category, priority, description]
    output: WorkOrder
    side_effects:
      - "status := TRIAGED; unit_number snapshot from Resident; recall_count := 0; resident_signoff := false"
      - "response_due_at / completion_due_at computed from priority and Property SLA config"
  - method: GET
    path: "/work-orders"
    description: "List work orders with filters"
    roles: [Resident, Dispatcher, Technician, Vendor, PropertyManager]
    code: 200
    input: ["property_id?", "resident_id?", "assigned_technician_id?", "assigned_vendor_id?", "status?", "limit?", "offset?"]
    output: WorkOrder[]
    side_effects: []
  - method: GET
    path: "/work-orders/{id}"
    description: "Get a work order"
    roles: [Resident, Dispatcher, Technician, Vendor, PropertyManager]
    code: 200
    input: []
    output: WorkOrder
    side_effects: []
  - method: PATCH
    path: "/work-orders/{id}"
    description: "Triage edit of priority/category/description while TRIAGED; OCC-guarded"
    roles: [Dispatcher]
    code: 200
    input: [expected_work_order_version, "priority?", "category?", "description?"]
    output: WorkOrder
    side_effects:
      - "if priority changed: response_due_at / completion_due_at recomputed from created_at and new priority"
      - "increments WorkOrder.version by 1"
  - method: POST
    path: "/work-orders/{id}/dispatch"
    description: "Assign the work order to an in-house technician or a vendor with a scheduled window and entry authorization"
    roles: [Dispatcher]
    code: 200
    input: [assignment_type, "technician_id?", "vendor_id?", scheduled_start_at, scheduled_end_at, entry_authorization, "notice_posted_at?"]
    output: WorkOrder
    side_effects:
      - "status TRIAGED|REOPENED -> ASSIGNED; assignment fields set"
      - "first_responded_at set iff null; response_sla_breached recomputed"
      - "increments WorkOrder.version by 1"
  - method: POST
    path: "/work-orders/{id}/start"
    description: "Assigned party starts work; entry permission enforced"
    roles: [Technician, Vendor]
    code: 200
    input: ["resident_consent_confirmed?"]
    output: WorkOrder
    side_effects: ["status -> IN_PROGRESS; started_at := current logical clock; increments WorkOrder.version by 1"]
  - method: POST
    path: "/work-orders/{id}/sign-off"
    description: "Reporting resident signs off on completed work (required before completion)"
    roles: [Resident]
    code: 200
    input: []
    output: WorkOrder
    side_effects: ["resident_signoff := true; status stays IN_PROGRESS; increments WorkOrder.version by 1"]
  - method: POST
    path: "/work-orders/{id}/complete"
    description: "Assigned party completes with photo documentation and optional damage report"
    roles: [Technician, Vendor]
    code: 200
    input: [photo_urls, damage_reported, "estimated_damage_cost_cents?", "notes?"]
    output: WorkOrder
    side_effects:
      - "status -> COMPLETED; completed_at set; completion_sla_breached computed"
      - "RESERVED WorkOrderParts -> CONSUMED; Part stock debited; restock_status recomputed; parts_total_cents recomputed"
      - "damage_reported == true creates a PENDING Chargeback with provisional_amount_cents = estimated_damage_cost_cents"
      - "increments WorkOrder.version by 1"
  - method: POST
    path: "/work-orders/{id}/reopen"
    description: "Re-open a completed work order as a recall within the property recall window"
    roles: [Resident, Dispatcher]
    code: 200
    input: []
    output: WorkOrder
    side_effects: ["status -> REOPENED; recall_count += 1; resident_signoff := false; assignment fields cleared; increments WorkOrder.version by 1"]
  - method: POST
    path: "/work-orders/{id}/close"
    description: "Manager closes a completed work order"
    roles: [PropertyManager]
    code: 200
    input: []
    output: WorkOrder
    side_effects: ["status -> CLOSED; closed_at set; increments WorkOrder.version by 1"]
  - method: POST
    path: "/work-orders/{id}/cancel"
    description: "Cancel a work order before work starts"
    roles: [Resident, Dispatcher]
    code: 200
    input: ["reason?"]
    output: WorkOrder
    side_effects: ["status TRIAGED|ASSIGNED|REOPENED -> CANCELLED; from ASSIGNED releases RESERVED parts and clears assignment; increments WorkOrder.version by 1"]

  # --- WorkOrderPart ---
  - method: POST
    path: "/work-orders/{id}/parts"
    description: "Reserve stock of a part against an assigned/in-progress work order"
    roles: [Technician, Vendor]
    code: 201
    input: [part_id, quantity]
    output: WorkOrderPart
    side_effects:
      - "WorkOrder.status must be ASSIGNED or IN_PROGRESS; caller must be the assigned party"
      - "unit_cost_cents_snapshot := Part.unit_cost_cents; status := RESERVED"
      - "Part.quantity_on_hand -= quantity; Part.reserved_quantity += quantity; restock_status recomputed"
  - method: POST
    path: "/work-orders/{id}/parts/{wop_id}/release"
    description: "Release a reservation, returning stock"
    roles: [Technician, Vendor, Dispatcher]
    code: 200
    input: []
    output: WorkOrderPart
    side_effects: ["RESERVED -> RELEASED; Part.quantity_on_hand += quantity; Part.reserved_quantity -= quantity; restock_status recomputed"]
  - method: GET
    path: "/work-order-parts"
    description: "List work-order-part lines, filtered by work order or part"
    roles: [Dispatcher, Technician, Vendor, PropertyManager]
    code: 200
    input: ["work_order_id?", "part_id?", "limit?", "offset?"]
    output: WorkOrderPart[]
    side_effects: []
  - method: GET
    path: "/work-order-parts/{id}"
    description: "Get a work-order-part line"
    roles: [Dispatcher, Technician, Vendor, PropertyManager]
    code: 200
    input: []
    output: WorkOrderPart
    side_effects: []

  # --- PurchaseRequest ---
  - method: POST
    path: "/work-orders/{id}/purchase-requests"
    description: "Assigned party requests a parts purchase; auto-approves at or under the property threshold; OCC-guarded"
    roles: [Technician, Vendor]
    code: 201
    input: [part_id, quantity, quoted_unit_cost_cents, "shipping_fee_cents?", expected_work_order_version]
    output: PurchaseRequest
    side_effects:
      - "WorkOrder.status must be ASSIGNED or IN_PROGRESS; caller must be the assigned party"
      - "items_subtotal_cents, handling_fee_cents, estimated_total_cents computed per purchase_request_total"
      - "estimated_total_cents <= Property.purchase_auto_approve_threshold_cents: status APPROVED, auto_approved true; else PENDING"
      - "any PENDING PurchaseRequest with the same (work_order_id, part_id) -> SUPERSEDED"
      - "increments WorkOrder.version by 1"
  - method: GET
    path: "/purchase-requests"
    description: "List purchase requests, filtered by work order or part"
    roles: [Dispatcher, Technician, Vendor, PropertyManager]
    code: 200
    input: ["work_order_id?", "part_id?", "limit?", "offset?"]
    output: PurchaseRequest[]
    side_effects: []
  - method: GET
    path: "/purchase-requests/{id}"
    description: "Get a purchase request"
    roles: [Dispatcher, Technician, Vendor, PropertyManager]
    code: 200
    input: []
    output: PurchaseRequest
    side_effects: []
  - method: POST
    path: "/purchase-requests/{id}/events"
    description: "Purchase request lifecycle event (APPROVE | REJECT | RECEIVE)"
    roles: [PropertyManager]
    code: 200
    input: [event_type, "decision_reason?"]
    output: PurchaseRequest
    side_effects:
      - "APPROVE: PENDING -> APPROVED (auto_approved false)"
      - "REJECT: PENDING -> REJECTED, decision_reason stored"
      - "RECEIVE: APPROVED -> RECEIVED; Part.quantity_on_hand += quantity; restock_status recomputed"

  # --- Chargeback ---
  - method: GET
    path: "/chargebacks"
    description: "List chargebacks, filtered by resident or work order"
    roles: [Resident, Dispatcher, PropertyManager]
    code: 200
    input: ["resident_id?", "work_order_id?", "limit?", "offset?"]
    output: Chargeback[]
    side_effects: []
  - method: GET
    path: "/chargebacks/{id}"
    description: "Get a chargeback"
    roles: [Resident, Dispatcher, PropertyManager]
    code: 200
    input: []
    output: Chargeback
    side_effects: []
  - method: POST
    path: "/chargebacks/{id}/events"
    description: "Chargeback lifecycle event (BILL | DISPUTE | UPHOLD | WAIVE | PAY)"
    roles: [Resident, PropertyManager]
    code: 200
    input: [event_type, "line_items?", "dispute_reason?"]
    output: Chargeback
    side_effects:
      - "BILL (PropertyManager): PENDING -> BILLED; line_items stored; final_amount_cents computed per chargeback_amount FINAL variant; Resident.chargeback_balance_cents recomputed"
      - "DISPUTE (Resident owner): BILLED -> DISPUTED; balance unchanged"
      - "UPHOLD (PropertyManager): DISPUTED -> BILLED; balance unchanged"
      - "WAIVE (PropertyManager): BILLED|DISPUTED -> WAIVED; balance recomputed"
      - "PAY (Resident owner): BILLED -> PAID; balance recomputed"

  # --- Test-driving clock ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. The logical clock starts at the fixed default 2026-08-01T00:00:00Z on server boot and MUST NOT fall back to wall-clock time; all SLA, notice, and recall-window evaluations read this clock."
    roles: [PropertyManager]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: datetime }"
    side_effects: ["logical clock advanced to to_iso8601"]

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or invalid X-User-Role / X-User-ID headers" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role is not permitted on this endpoint (e.g. Resident calling dispatch, Technician approving a purchase)" }
  - { id: ERR_NOT_RESOURCE_OWNER, http: 403, condition: "Entity-backed caller is not the owner/assigned party of the target resource" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path resource id does not exist" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_work_order_version does not match current WorkOrder.version (OCC)" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Resource status does not allow the requested transition (incl. terminal-state and invalid-from rejections)" }
  - { id: ERR_ENTRY_RULE_VIOLATION, http: 422, condition: "EMERGENCY_ACCESS on a non-EMERGENCY order; RESIDENT_CONSENT not confirmed at start; NOTICE_POSTED start before notice lead time elapsed" }
  - { id: ERR_ENTRY_NOTICE_TOO_SHORT, http: 422, condition: "NOTICE_POSTED dispatch with scheduled_start_at < notice_posted_at + entry_notice_min_hours or missing notice_posted_at" }
  - { id: ERR_VENDOR_NOT_ACTIVE, http: 409, condition: "Dispatch to a SUSPENDED vendor" }
  - { id: ERR_VENDOR_INSURANCE_EXPIRED, http: 409, condition: "Vendor insurance_valid_until < scheduled_start_at at dispatch" }
  - { id: ERR_TECHNICIAN_SCHEDULE_CONFLICT, http: 409, condition: "Half-open window overlap with another ASSIGNED/IN_PROGRESS work order of the same technician" }
  - { id: ERR_VENDOR_SCHEDULE_CONFLICT, http: 409, condition: "Vendor job gap smaller than vendor_travel_buffer_minutes against another ASSIGNED/IN_PROGRESS vendor job" }
  - { id: ERR_RECALL_WINDOW_EXPIRED, http: 409, condition: "Reopen attempted after Property.recall_window_days elapsed since completed_at" }
  - { id: ERR_TRADE_MISMATCH, http: 409, condition: "Assignee trade does not equal the work order category" }
  - { id: ERR_PART_INSUFFICIENT_STOCK, http: 409, condition: "Reserve quantity exceeds Part.quantity_on_hand, or part belongs to a different property" }
  - { id: ERR_DUPLICATE_SKU, http: 409, condition: "Part sku already exists within the property" }
  - { id: ERR_OPEN_PURCHASE_REQUESTS, http: 409, condition: "Completion blocked by a PurchaseRequest in PENDING or APPROVED status" }
  - { id: ERR_RESIDENT_SIGNOFF_REQUIRED, http: 409, condition: "Completion attempted without resident_signoff == true" }
  - { id: ERR_COMPLETION_PHOTOS_REQUIRED, http: 422, condition: "Completion payload has fewer than 1 photo URL" }
  - { id: ERR_CHARGEBACK_LINES_REQUIRED, http: 422, condition: "BILL without a non-empty line_items array, or invalid line fields" }
  - { id: ERR_VALIDATION, http: 400, condition: "Malformed request: missing required field, invalid enum, quantity < 1, scheduled_end_at <= scheduled_start_at" }

# =============================================================================
# Table 7: RBAC Permission Matrix
# =============================================================================
roles:
  - name: Resident
    description: "Unit occupant who files requests, signs off completed work, and manages own chargebacks"
    identity: "entity_backed:Resident"
    exclusive_operations:
      - "POST /work-orders — file a request (resident_id must equal X-User-ID)"
      - "POST /work-orders/{id}/sign-off — sign off own work order"
      - "POST /work-orders/{id}/reopen — recall own completed work order (shared with Dispatcher)"
      - "POST /chargebacks/{id}/events (DISPUTE, PAY) — own chargebacks only"
    shared_operations:
      - "GET reads on own-related resources"
      - "POST /work-orders/{id}/cancel — own work order (shared with Dispatcher)"
  - name: Dispatcher
    description: "Property maintenance coordinator who triages, dispatches, and tracks work orders"
    identity: "opaque"
    exclusive_operations:
      - "PATCH /work-orders/{id} — triage edit (OCC-guarded)"
      - "POST /work-orders/{id}/dispatch — assign technician or vendor"
    shared_operations:
      - "POST /work-orders/{id}/reopen, /cancel — shared with Resident"
      - "POST /work-orders/{id}/parts/{wop_id}/release — shared with assigned party"
      - "GET reads; GET /properties/{id}/sla-report (shared with PropertyManager)"
  - name: Technician
    description: "In-house maintenance technician executing IN_HOUSE work orders"
    identity: "entity_backed:Technician"
    exclusive_operations: []
    shared_operations:
      - "POST /work-orders/{id}/start, /complete — when assigned_technician_id == X-User-ID (shared with Vendor for VENDOR orders)"
      - "POST /work-orders/{id}/parts — reserve stock on own assigned orders (shared with Vendor)"
      - "POST /work-orders/{id}/purchase-requests — request purchases on own assigned orders (shared with Vendor)"
      - "GET reads on parts, work orders, purchase requests, work-order-parts"
  - name: Vendor
    description: "External vendor company executing VENDOR work orders"
    identity: "entity_backed:Vendor"
    exclusive_operations: []
    shared_operations:
      - "POST /work-orders/{id}/start, /complete — when assigned_vendor_id == X-User-ID"
      - "POST /work-orders/{id}/parts, /purchase-requests — on own assigned orders"
      - "GET reads on parts, work orders, purchase requests, work-order-parts"
  - name: PropertyManager
    description: "Property manager administering master data, purchase approvals, chargebacks, closures, and SLA reporting"
    identity: "opaque"
    exclusive_operations:
      - "POST /properties, /residents, /technicians, /vendors, /parts — master data"
      - "POST /vendors/{id}/events — SUSPEND / REINSTATE"
      - "POST /purchase-requests/{id}/events — APPROVE / REJECT / RECEIVE"
      - "POST /chargebacks/{id}/events (BILL, UPHOLD, WAIVE)"
      - "POST /work-orders/{id}/close"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET reads; GET /properties/{id}/sla-report (shared with Dispatcher)"
