              payload: { member_id: "${m_id}", hotel_id: "${hA_id}", rate_plan_id: "${rpB_id}", checkin_date: "2026-07-01", checkout_date: "2026-07-03", room_revenue_cents: 40000 }
              as: ProgramAdministrator
              captures: { e_fifth: $.data.error_id }
          assert:
            - "${e_first} == ERR_HOTEL_NOT_FOUND (404) - priority 10 wins over the reversed dates (23), the negative amount (24) and the mismatched rate plan (25)"
            - "${e_second} == ERR_MEMBER_NOT_FOUND (404) - priority 12 wins over property B's ONBOARDING status (40)"
            - "${e_third} == ERR_INVALID_DATE_RANGE (422) - with both identifiers resolving, shape at 23 still precedes state at 40"
            - "${e_fourth} == ERR_HOTEL_NOT_ACTIVE (409) - only once nothing above 40 is violated does the ONBOARDING status surface"
            - "${e_fifth} == ERR_RATE_PLAN_HOTEL_MISMATCH (422) - property A is ACTIVE and the dates are sane, so the referential check at 25 is what remains"
            - "GET /loyalty/stays returns total_count == 0 - none of the five refusals created a row"

      - name: referenced_rows_must_belong_to_the_parent_named_in_the_request
        claim_type: cross_entity_validation
        grounds:
          - validations.priority_25_ERR_RATE_PLAN_HOTEL_MISMATCH
          - validations.priority_26_ERR_DELIVERY_MEMBER_MISMATCH
        distinguishing_aspect: |
          Both references exist and are individually valid, so neither 404 fires; what fails is the
          relationship - a rate plan filed at another property cannot price this property's stay,
          and a benefit delivery belonging to another member's stay cannot be the subject of this
          member's complaint.
        test_recipe:
          setup:
            - "Two ACTIVE properties, each with its own TRANSIENT rate plan."
