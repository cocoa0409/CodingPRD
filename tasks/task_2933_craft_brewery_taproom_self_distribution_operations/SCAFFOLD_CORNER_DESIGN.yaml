# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task 2933 - Craft Brewery Taproom & Self-Distribution Operations
#
# Breadth walk of references/claim-extraction-guide.md against this scaffold's §1.1-§1.7.
# `section:` values are the guide's nine sections; `claim_type:` values are its per-section rows.
# Corners already asserted by a §1.8 instance appear as `excluded_because:` stubs naming that
# instance. Every recipe below starts from an empty database.
#
# Shared bootstrap prose used by many recipes: create the Brewery singleton, ACTIVATE its
# brewer's notice, then create the beer / tank / batch / run the corner needs.

scaffold_corner_design:
  # =========================================================================
  - section: entities
    instances:
      - name: create_state_license_with_all_required_fields_returns_201
        claim_type: Creation
        grounds:
          - entities.StateLicense
          - endpoints.POST_/state-licenses
        distinguishing_aspect: "Every required input field is echoed back and every system field is initialized: status ACTIVE, carry_in_barrels_ytd 0.000, barrels_shipped_ytd 0.000, active_appointment_count 0, version 1."
        test_recipe:
          setup:
            - "Brewery singleton exists with an ACTIVE brewer's notice."
          setup_api_calls:
            - call: "POST /brewery"
              payload: { legal_name: "Cascade Ridge Brewing", home_state_code: "OR", ttb_brewers_notice_number: "BR-OR-4417" }
              as: BreweryAdmin
              captures: { brewery_id: $.data.id }
            - call: "POST /brewery/notice"
              payload: { action: "ACTIVATE" }
              as: StateRegulator
          trigger:
            - call: "POST /state-licenses"
              payload: { state_code: "ID", license_type: "SELF_DISTRIBUTION", annual_barrel_cap: 1000.00, franchise_state: false, effective_from_utc: "2026-01-01T00:00:00Z", expires_at_utc: "2027-01-01T00:00:00Z", termination_notice_days: 90 }
              as: ComplianceOfficer
              captures: { lic_id: $.data.id }
          assert:
            - "HTTP status == 201"
            - "response_type == object and meta.api_request_id is present"
            - "StateLicense.${lic_id}.state_code == ID"
            - "StateLicense.${lic_id}.license_type == SELF_DISTRIBUTION"
            - "StateLicense.${lic_id}.annual_barrel_cap == 1000.00"
            - "StateLicense.${lic_id}.franchise_state == false"
            - "StateLicense.${lic_id}.status == ACTIVE"
            - "StateLicense.${lic_id}.carry_in_barrels_ytd == 0.000"
            - "StateLicense.${lic_id}.barrels_shipped_ytd == 0.000"
            - "StateLicense.${lic_id}.active_appointment_count == 0"
            - "StateLicense.${lic_id}.version == 1"

      - name: get_state_license_returns_the_stored_row
        claim_type: Retrieval
        grounds:
          - endpoints.GET_/state-licenses/{stateLicenseId}
        distinguishing_aspect: "A single-resource GET returns the same field values the create response carried, wrapped in the object envelope, with version still 1 because a read is not a write."
        test_recipe:
          setup:
            - "Brewery ACTIVE; one WA license of license_type WHOLESALER_ONLY with franchise_state true."
          setup_api_calls:
            - call: "POST /brewery"
              payload: { legal_name: "Cascade Ridge Brewing", home_state_code: "OR", ttb_brewers_notice_number: "BR-OR-4417" }
              as: BreweryAdmin
              captures: { brewery_id: $.data.id }
            - call: "POST /brewery/notice"
              payload: { action: "ACTIVATE" }
              as: StateRegulator
            - call: "POST /state-licenses"
              payload: { state_code: "WA", license_type: "WHOLESALER_ONLY", annual_barrel_cap: 0.00, franchise_state: true, effective_from_utc: "2026-01-01T00:00:00Z", expires_at_utc: "2027-01-01T00:00:00Z" }
              as: ComplianceOfficer
              captures: { lic_id: $.data.id }
          trigger:
            - call: "GET /state-licenses/${lic_id}"
              payload: {}
              as: StateRegulator
          assert:
            - "HTTP status == 200"
            - "data.id == ${lic_id}"
            - "data.state_code == WA and data.license_type == WHOLESALER_ONLY"
            - "data.franchise_state == true"
            - "data.termination_notice_days == 90"
            - "data.version == 1"

      - name: list_taproom_pours_paginates_with_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints.GET_/taproom-pours
          - response_envelope.pagination_fields
        distinguishing_aspect: "Three pours exist; limit=2 must return two rows with total_count 3 and has_more true, and offset=2 must return the remaining row with has_more false. total_count counts the filtered set, not the page."
        test_recipe:
          setup:
            - "Brewery ACTIVE; beer FORMULA_EXEMPT; one COMPLETED TAPROOM HALF_BBL_KEG run; KEG-0001 cleaned, filled and TAPPED."
            - "Exactly three PINT_16OZ pours recorded against that keg."
          setup_api_calls:
            - call: "POST /brewery"
              payload: { legal_name: "Cascade Ridge Brewing", home_state_code: "OR", ttb_brewers_notice_number: "BR-OR-4417" }
              as: BreweryAdmin
              captures: { brewery_id: $.data.id }
            - call: "POST /brewery/notice"
              payload: { action: "ACTIVATE" }
              as: StateRegulator
            - call: "POST /beers"
              payload: { name: "Ridgeline IPA", style: "West Coast IPA", abv_pct: 6.8, price_per_bbl_cents: 42000, requires_formula: false }
              as: BreweryAdmin
              captures: { beer_id: $.data.id }
            - call: "POST /tanks"
              payload: { code: "FV-01", tank_type: "FERMENTER", capacity_bbl: 30.00 }
              as: CellarOperator
              captures: { tank_id: $.data.id }
            - call: "POST /batches"
              payload: { beer_id: "${beer_id}", tank_id: "${tank_id}", batch_code: "B-1001", planned_volume_bbl: 16.00, brew_start_utc: "2026-08-01T06:00:00Z", brew_end_utc: "2026-08-08T06:00:00Z" }
              as: CellarOperator
              captures: { batch_id: $.data.id }
            - call: "POST /batches/${batch_id}/start"
              payload: {}
              as: CellarOperator
            - call: "POST /batches/${batch_id}/condition"
              payload: { actual_yield_bbl: 16.000 }
              as: CellarOperator
              captures: { batch_v: $.data.version }
            - call: "POST /packaging-runs"
              payload: { batch_id: "${batch_id}", run_code: "R-TAP-1", package_type: "HALF_BBL_KEG", destination: "TAPROOM", units_planned: 10, expected_batch_version: "${batch_v}" }
              as: CellarOperator
              captures: { run_id: $.data.id }
            - call: "POST /packaging-runs/${run_id}/complete"
              payload: { units_produced: 10 }
              as: CellarOperator
            - call: "POST /keg-assets"
              payload: { keg_serial: "KEG-0001", size_bbl: 0.5 }
              as: CellarOperator
              captures: { keg_id: $.data.id }
            - call: "POST /keg-assets/${keg_id}/clean"
              payload: { sanitizer_ppm: 200, contact_time_seconds: 90 }
              as: CellarOperator
            - call: "POST /keg-assets/${keg_id}/fill"
              payload: { packaging_run_id: "${run_id}" }
              as: CellarOperator
            - call: "POST /keg-assets/${keg_id}/movements"
              payload: { movement_type: "TAP" }
              as: TaproomStaff
            - call: "POST /taproom-pours"
              payload: { keg_asset_id: "${keg_id}", container_type: "PINT_16OZ", price_cents: 800 }
              as: TaproomStaff
            - call: "POST /taproom-pours"
              payload: { keg_asset_id: "${keg_id}", container_type: "PINT_16OZ", price_cents: 800 }
              as: TaproomStaff
            - call: "POST /taproom-pours"
              payload: { keg_asset_id: "${keg_id}", container_type: "PINT_16OZ", price_cents: 800 }
              as: TaproomStaff
          trigger:
            - call: "GET /taproom-pours"
              payload: { keg_asset_id: "${keg_id}", limit: 2, offset: 0 }
              as: TaproomStaff
            - call: "GET /taproom-pours"
              payload: { keg_asset_id: "${keg_id}", limit: 2, offset: 2 }
              as: TaproomStaff
          assert:
            - "First call: response_type == array, len(data) == 2, total_count == 3, has_more == true, limit == 2, offset == 0"
            - "Second call: len(data) == 1, total_count == 3, has_more == false, offset == 2"
            - "Every returned row has volume_oz == 16 and sanitation_verdict == NOT_REQUIRED"
            - "No returned row carries a version field (TaproomPour declares common_fields false)"

      - name: get_beer_with_unknown_uuid_returns_beer_not_found
        claim_type: Not Found
        grounds:
          - errors.ERR_BEER_NOT_FOUND
          - validations.priority_16
        distinguishing_aspect: "A syntactically valid UUID that names no Beer must yield 404 ERR_BEER_NOT_FOUND from the existence tier, not a 200 with an empty body or a 500."
        test_recipe:
          setup:
            - "Brewery ACTIVE; no beers exist."
          setup_api_calls:
            - call: "POST /brewery"
              payload: { legal_name: "Cascade Ridge Brewing", home_state_code: "OR", ttb_brewers_notice_number: "BR-OR-4417" }
              as: BreweryAdmin
              captures: { brewery_id: $.data.id }
            - call: "POST /brewery/notice"
              payload: { action: "ACTIVATE" }
              as: StateRegulator
          trigger:
            - call: "GET /beers/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "response_type == error"
            - "error_id == ERR_BEER_NOT_FOUND"
            - "data.message is a non-blank string"

      - name: create_tank_missing_required_capacity_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.Tank.fields.capacity_bbl
          - validations.priority_14
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "capacity_bbl has source input and no default, so omitting it is a schema failure (422 ERR_INVALID_REQUEST) raised before any uniqueness or state check, and no Tank row is created."
        test_recipe:
          setup:
            - "Brewery ACTIVE; no tanks exist."
          setup_api_calls:
            - call: "POST /brewery"
              payload: { legal_name: "Cascade Ridge Brewing", home_state_code: "OR", ttb_brewers_notice_number: "BR-OR-4417" }
              as: BreweryAdmin
              captures: { brewery_id: $.data.id }
            - call: "POST /brewery/notice"
              payload: { action: "ACTIVATE" }
              as: StateRegulator
          trigger:
            - call: "POST /tanks"
              payload: { code: "FV-01", tank_type: "FERMENTER" }
              as: CellarOperator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 422"
            - "error_id == ERR_INVALID_REQUEST"
            - "GET /tanks returns total_count 0"

      - name: create_beer_omitting_requires_formula_defaults_to_true
        claim_type: Defaults
        grounds:
          - entities.Beer.fields.requires_formula
          - entities.Beer.fields.registration_state
          - entities.Beer.fields.taproom_sellable
        distinguishing_aspect: "requires_formula defaults to TRUE, which is the conservative TTB posture: an omitted flag leaves registration_state at DRAFT (not FORMULA_EXEMPT) and taproom_sellable false, so the beer cannot be poured until a formula is approved."
        test_recipe:
          setup:
            - "Brewery ACTIVE."
          setup_api_calls:
            - call: "POST /brewery"
              payload: { legal_name: "Cascade Ridge Brewing", home_state_code: "OR", ttb_brewers_notice_number: "BR-OR-4417" }
              as: BreweryAdmin
              captures: { brewery_id: $.data.id }
            - call: "POST /brewery/notice"
              payload: { action: "ACTIVATE" }
              as: StateRegulator
          trigger:
            - call: "POST /beers"
              payload: { name: "Coastal Pils", style: "German Pilsner", abv_pct: 5.0, price_per_bbl_cents: 38000 }
              as: ComplianceOfficer
              captures: { beer_id: $.data.id }
          assert:
            - "HTTP status == 201"
            - "Beer.${beer_id}.requires_formula == true"
            - "Beer.${beer_id}.registration_state == DRAFT"
            - "Beer.${beer_id}.label_state == NO_LABEL"
            - "Beer.${beer_id}.cola_id is null"
            - "Beer.${beer_id}.taproom_sellable == false"
            - "Beer.${beer_id}.distribution_sellable == false"

      - name: pour_volume_oz_is_computed_and_submitted_extra_field_is_ignored
        claim_type: Computed Fields
        grounds:
          - entities.TaproomPour.fields.volume_oz
          - calculations.taproom_taxable_barrels.constants.POUR_OZ
        distinguishing_aspect: "volume_oz has source computed: it comes from POUR_OZ[container_type] alone. A request that also carries a volume_oz of its own must be ignored, not honoured - a SAMPLE_4OZ pour is 4 oz even when the caller claims 64."
        test_recipe:
          setup:
            - "Brewery ACTIVE; beer FORMULA_EXEMPT; one COMPLETED TAPROOM HALF_BBL_KEG run; KEG-0001 filled and TAPPED with no pours yet."
          setup_api_calls:
            - call: "POST /brewery"
              payload: { legal_name: "Cascade Ridge Brewing", home_state_code: "OR", ttb_brewers_notice_number: "BR-OR-4417" }
              as: BreweryAdmin
              captures: { brewery_id: $.data.id }
            - call: "POST /brewery/notice"
              payload: { action: "ACTIVATE" }
              as: StateRegulator
            - call: "POST /beers"
              payload: { name: "Ridgeline IPA", style: "West Coast IPA", abv_pct: 6.8, price_per_bbl_cents: 42000, requires_formula: false }
              as: BreweryAdmin
              captures: { beer_id: $.data.id }
            - call: "POST /tanks"
              payload: { code: "FV-01", tank_type: "FERMENTER", capacity_bbl: 30.00 }
              as: CellarOperator
              captures: { tank_id: $.data.id }
            - call: "POST /batches"
              payload: { beer_id: "${beer_id}", tank_id: "${tank_id}", batch_code: "B-1001", planned_volume_bbl: 16.00, brew_start_utc: "2026-08-01T06:00:00Z", brew_end_utc: "2026-08-08T06:00:00Z" }
              as: CellarOperator
              captures: { batch_id: $.data.id }
            - call: "POST /batches/${batch_id}/start"
              payload: {}
              as: CellarOperator
            - call: "POST /batches/${batch_id}/condition"
              payload: { actual_yield_bbl: 16.000 }
              as: CellarOperator
              captures: { batch_v: $.data.version }
            - call: "POST /packaging-runs"
              payload: { batch_id: "${batch_id}", run_code: "R-TAP-1", package_type: "HALF_BBL_KEG", destination: "TAPROOM", units_planned: 10, expected_batch_version: "${batch_v}" }
              as: CellarOperator
              captures: { run_id: $.data.id }
            - call: "POST /packaging-runs/${run_id}/complete"
              payload: { units_produced: 10 }
              as: CellarOperator
            - call: "POST /keg-assets"
              payload: { keg_serial: "KEG-0001", size_bbl: 0.5 }
              as: CellarOperator
              captures: { keg_id: $.data.id }
            - call: "POST /keg-assets/${keg_id}/clean"
              payload: { sanitizer_ppm: 200, contact_time_seconds: 90 }
              as: CellarOperator
            - call: "POST /keg-assets/${keg_id}/fill"
              payload: { packaging_run_id: "${run_id}" }
              as: CellarOperator
            - call: "POST /keg-assets/${keg_id}/movements"
              payload: { movement_type: "TAP" }
              as: TaproomStaff
          trigger:
            - call: "POST /taproom-pours"
              payload: { keg_asset_id: "${keg_id}", container_type: "SAMPLE_4OZ", price_cents: 0, volume_oz: 64 }
              as: TaproomStaff
              captures: { pour_id: $.data.id }
          assert:
            - "HTTP status == 201"
            - "TaproomPour.${pour_id}.volume_oz == 4 (the submitted 64 is ignored)"
            - "TaproomPour.${pour_id}.price_cents == 0"
            - "TaproomPour.${pour_id}.sanitation_verdict == NOT_REQUIRED"
            - "KegAsset.${keg_id}.poured_volume_oz == 4.00"
            - "KegAsset.${keg_id}.remaining_volume_oz == 1980.00"

      - name: keg_asset_system_fields_are_server_minted_and_input_ignored
        claim_type: System Fields
        grounds:
          - entities.KegAsset.fields.state
          - entities.KegAsset.fields.filled_volume_oz
          - entities.KegAsset.fields.packaging_run_id
        distinguishing_aspect: "id, created_at, updated_at and version are minted by the server, and the system-sourced business fields are ignored on input: a create that tries to preset state FILLED, filled_volume_oz 1984 and a packaging_run_id still yields EMPTY_DIRTY with 0 ounces and a null run."
        test_recipe:
          setup:
            - "Brewery ACTIVE; no kegs exist."
          setup_api_calls:
            - call: "POST /brewery"
              payload: { legal_name: "Cascade Ridge Brewing", home_state_code: "OR", ttb_brewers_notice_number: "BR-OR-4417" }
              as: BreweryAdmin
              captures: { brewery_id: $.data.id }
            - call: "POST /brewery/notice"
              payload: { action: "ACTIVATE" }
              as: StateRegulator
          trigger:
            - call: "POST /keg-assets"
              payload: { keg_serial: "KEG-0001", size_bbl: 0.5, state: "FILLED", filled_volume_oz: 1984.00, version: 99 }
              as: CellarOperator
              captures: { keg_id: $.data.id }
          assert:
            - "HTTP status == 201"
            - "KegAsset.${keg_id}.state == EMPTY_DIRTY (extra input field ignored)"
            - "KegAsset.${keg_id}.filled_volume_oz == 0.00"
            - "KegAsset.${keg_id}.remaining_volume_oz == 0.00"
            - "KegAsset.${keg_id}.packaging_run_id is null"
            - "KegAsset.${keg_id}.cycle_count == 0"
            - "KegAsset.${keg_id}.version == 1 (not 99)"
            - "KegAsset.${keg_id}.id is a UUID with no type prefix and created_at is an ISO-8601 instant with three fractional digits"

      - name: create_event_permit_with_end_not_after_start_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.EventPermit.fields.event_end_utc
          - validations.priority_14
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "event_end_utc must be strictly after event_start_utc; an equal pair is a schema failure at priority 14, ahead of the territory and concurrency rules, so no permit row is created even though the venue state is licensed."
        test_recipe:
          setup:
            - "Brewery ACTIVE; beer FORMULA_EXEMPT; an OR license exists so the territory rule would pass."
          setup_api_calls:
            - call: "POST /brewery"
              payload: { legal_name: "Cascade Ridge Brewing", home_state_code: "OR", ttb_brewers_notice_number: "BR-OR-4417" }
              as: BreweryAdmin
              captures: { brewery_id: $.data.id }
            - call: "POST /brewery/notice"
              payload: { action: "ACTIVATE" }
              as: StateRegulator
            - call: "POST /beers"
              payload: { name: "Ridgeline IPA", style: "West Coast IPA", abv_pct: 6.8, price_per_bbl_cents: 42000, requires_formula: false }
              as: BreweryAdmin
              captures: { beer_id: $.data.id }
            - call: "POST /state-licenses"
              payload: { state_code: "OR", license_type: "SELF_DISTRIBUTION", annual_barrel_cap: 1000.00, franchise_state: false, effective_from_utc: "2026-01-01T00:00:00Z", expires_at_utc: "2027-01-01T00:00:00Z" }
              as: ComplianceOfficer
              captures: { lic_id: $.data.id }
          trigger:
            - call: "POST /event-permits"
              payload: { featured_beer_id: "${beer_id}", event_name: "Zero Length Fest", permit_type: "FESTIVAL", venue_state_code: "OR", event_start_utc: "2026-09-10T12:00:00Z", event_end_utc: "2026-09-10T12:00:00Z", requested_bbl: 2.00 }
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 422"
            - "error_id == ERR_INVALID_REQUEST"
            - "GET /event-permits returns total_count 0"

      - name: taproom_pour_is_immutable_with_no_version_field
        claim_type: Immutability
        grounds:
          - entities.TaproomPour
          - endpoints.GET_/taproom-pours/{pourId}
        distinguishing_aspect: "TaproomPour declares common_fields false: it carries only id and created_at, there is no version field and §1.5 declares no mutating endpoint for it. Depletion is corrected by keg returns and by amending the excise return, never by editing a pour."
        test_recipe:
          setup:
            - "Brewery ACTIVE; beer FORMULA_EXEMPT; KEG-0001 filled from a COMPLETED TAPROOM run and TAPPED; one PINT_16OZ pour recorded."
          setup_api_calls:
            - call: "POST /brewery"
              payload: { legal_name: "Cascade Ridge Brewing", home_state_code: "OR", ttb_brewers_notice_number: "BR-OR-4417" }
              as: BreweryAdmin
              captures: { brewery_id: $.data.id }
            - call: "POST /brewery/notice"
              payload: { action: "ACTIVATE" }
              as: StateRegulator
            - call: "POST /beers"
              payload: { name: "Ridgeline IPA", style: "West Coast IPA", abv_pct: 6.8, price_per_bbl_cents: 42000, requires_formula: false }
              as: BreweryAdmin
              captures: { beer_id: $.data.id }
            - call: "POST /tanks"
              payload: { code: "FV-01", tank_type: "FERMENTER", capacity_bbl: 30.00 }
              as: CellarOperator
              captures: { tank_id: $.data.id }
            - call: "POST /batches"
              payload: { beer_id: "${beer_id}", tank_id: "${tank_id}", batch_code: "B-1001", planned_volume_bbl: 16.00, brew_start_utc: "2026-08-01T06:00:00Z", brew_end_utc: "2026-08-08T06:00:00Z" }
              as: CellarOperator
              captures: { batch_id: $.data.id }
            - call: "POST /batches/${batch_id}/start"
              payload: {}
              as: CellarOperator
            - call: "POST /batches/${batch_id}/condition"
              payload: { actual_yield_bbl: 16.000 }
              as: CellarOperator
              captures: { batch_v: $.data.version }
            - call: "POST /packaging-runs"
              payload: { batch_id: "${batch_id}", run_code: "R-TAP-1", package_type: "HALF_BBL_KEG", destination: "TAPROOM", units_planned: 10, expected_batch_version: "${batch_v}" }
              as: CellarOperator
              captures: { run_id: $.data.id }
            - call: "POST /packaging-runs/${run_id}/complete"
              payload: { units_produced: 10 }
              as: CellarOperator
            - call: "POST /keg-assets"
              payload: { keg_serial: "KEG-0001", size_bbl: 0.5 }
              as: CellarOperator
              captures: { keg_id: $.data.id }
            - call: "POST /keg-assets/${keg_id}/clean"
              payload: { sanitizer_ppm: 200, contact_time_seconds: 90 }
              as: CellarOperator
            - call: "POST /keg-assets/${keg_id}/fill"
              payload: { packaging_run_id: "${run_id}" }
              as: CellarOperator
            - call: "POST /keg-assets/${keg_id}/movements"
              payload: { movement_type: "TAP" }
              as: TaproomStaff
            - call: "POST /taproom-pours"
              payload: { keg_asset_id: "${keg_id}", container_type: "PINT_16OZ", price_cents: 800 }
              as: TaproomStaff
              captures: { pour_id: $.data.id }
          trigger:
            - call: "GET /taproom-pours/${pour_id}"
              payload: {}
              as: ComplianceOfficer
          assert:
            - "HTTP status == 200"
            - "data.id == ${pour_id} and data.created_at is present"
            - "data has no version key and no updated_at key"
            - "data.volume_oz == 16 and data.poured_by_user_id is the X-User-ID that recorded it"
            - "data.poured_at_utc == 2026-08-01T00:00:00Z (the default logical clock, never touched in this chain)"

      - name: create_batch_referencing_unknown_tank_returns_tank_not_found
        claim_type: Parent Relationships
