            - { call: "POST /mi/lenders/${len_id}/status-change", payload: { action: APPROVE }, as: FhaApprover, as_user_id: app-1 }
            - { call: "POST /mi/loan-cases", payload: { lender_id: "${len_id}", borrower_reference: "TCH-1", base_loan_amount_cents: 30000000, appraised_value_cents: 31250000, term_months: 360, note_rate_bps: 700, current_monthly_payment_cents: 200000 }, as: LenderOfficer, as_user_id: "${len_id}", captures: { lc_id: $.data.id } }
            - { call: "POST /mi/loan-cases/${lc_id}/repair-escrows", payload: { amount_cents: 500000, start_date: "2026-01-01", end_date: "2026-06-30" }, as: LenderOfficer, as_user_id: "${len_id}" }
          trigger:
            - { call: "POST /mi/loan-cases/${lc_id}/repair-escrows", payload: { amount_cents: 300000, start_date: "2026-06-30", end_date: "2026-09-30" }, as: LenderOfficer, as_user_id: "${len_id}" }
          assert:
