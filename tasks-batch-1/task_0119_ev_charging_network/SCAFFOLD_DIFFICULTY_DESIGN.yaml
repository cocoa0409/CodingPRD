            - "HTTP status == 409"

      - name: temporal_vs_constraint_window_closed_beats_overlap
        grounds:
          - validations[priority=8]
          - validations[priority=11]
        distinguishing_aspect: |
          Error-category pair (business_temporal vs business_constraint): a check-in
          after window_end on a stall that also has a buffered overlap is rejected with
          ERR_RESERVATION_WINDOW_CLOSED (priority 8, temporal). Distinct pair from the
          state-vs-fiscal conflict. (Confirm is what raises overlap; here check-in is
          attempted on an already-confirmed reservation past its window.)
        test_recipe:
          setup:
