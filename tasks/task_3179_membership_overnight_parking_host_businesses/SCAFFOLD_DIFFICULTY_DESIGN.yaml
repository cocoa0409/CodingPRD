              payload: { site_label: "D2", site_class: "BACK_IN", max_vehicle_length_feet: 45, has_electric: false, electric_service_code: "NONE", blocks_sites: "D1" }
              as: HostOperator
            - call: "GET /api/hosts/${h_lp}"
              payload: {}
              as: HostOperator
              captures: { h_lp_v1: $.data.version }
            - call: "POST /api/hosts/${h_lp}/decisions"
              payload: { action: "APPROVE", reason: "declared", expected_host_version: "${h_lp_v1}" }
              as: PlatformAdmin
            - call: "POST /api/members"
              payload: { email: "m16@x.com", full_name: "M Sixteen", plan_tier: "CLASSIC", home_state_code: "TX" }
              as: Anonymous
              captures: { m16: $.data.id }
            - call: "POST /api/members/${m16}/subscription_actions"
              payload: { action: "ACTIVATE" }
              as: PlatformAdmin
            - call: "POST /api/members/${m16}/vehicles"
              payload: { vehicle_class: "CLASS_C", length_feet: 30, self_contained: true, inspection_state_code: "TX" }
              as: Member
              as_user_id: "${m16}"
              captures: { v16: $.data.id }
            - call: "POST /api/stay-requests"
              payload: { host_id: "${h_lp}", member_id: "${m16}", vehicle_id: "${v16}", arrival_date: "2026-07-01", nights: 4, party_size: 1, electric_request_code: "NONE", request_depth: 0, same_day_hold: false }
              as: Member
              as_user_id: "${m16}"
              captures: { d_circ: $.data.id }
            - call: "POST /api/stay-requests"
              payload: { host_id: "${h_lp}", member_id: "${m16}", vehicle_id: "${v16}", arrival_date: "2026-07-05", nights: 2, party_size: 1, electric_request_code: "NONE", request_depth: 0, same_day_hold: false }
              as: Member
              as_user_id: "${m16}"
              captures: { d_next: $.data.id }
            - call: "GET /api/hosts/${h_lp}"
              payload: {}
              as: HostOperator
              captures: { h_lp_v2: $.data.version }
            - call: "POST /api/stay-requests/${d_circ}/decisions"
              payload: { decision: "CONFIRM", site_id: "D1", expected_host_version: "${h_lp_v2}" }
              as: HostOperator
              as_user_id: "${h_lp}"
              captures: { d_circ_status: $.data.request_status }
          trigger:
            - call: "GET /api/hosts/${h_lp}"
