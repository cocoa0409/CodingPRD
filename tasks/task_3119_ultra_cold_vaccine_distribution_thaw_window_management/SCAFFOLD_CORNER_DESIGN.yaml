            - "required_ice_at_create == 0 and deficit_at_create == 0 because the payload was empty when the shipper was opened"
            - "required_after == 1 and deficit_after == 0.5 for a one-carton payload, so the arithmetic reads ceil(1 * 720 / (400 * 2)) minus the 0.5 kg loaded"
            - "deficit_after == required_after - 0.5, so the loaded quantity is exactly the shortfall below the requirement"

