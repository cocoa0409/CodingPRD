              payload: { channel_id: "${brand_id}", allocated_units: 11, start_date: "2026-09-10", end_date: "2026-09-10", expected_room_type_version: "${king_v}" }
              as: RevenueManager
              captures: { brand_alloc_id: $.data.id }
            - call: "POST /distribution/channel-connections/${ota1_conn_id}/heartbeats"
              payload: { status: "ERROR", failure_code: "TIMEOUT" }
