            - call: "POST /change-orders"
              payload: { project_id: "${proj_id}", origin: "SITE_CONDITION", lines: [{ unit_kind: "TRIM_LINEAR_FT", units_delta: 12.00 }], expected_project_version: "${pv2}" }
              as: ProjectCoordinator
              captures: { co_b_id: $.data.id, co_b_up: $.data.upcharge_cents }
            - call: "POST /change-orders/${co_b_id}/submit"
              payload: {}
