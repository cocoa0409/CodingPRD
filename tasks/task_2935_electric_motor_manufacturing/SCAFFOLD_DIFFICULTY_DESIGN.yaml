            - "WorkOrder.${wo1_id}.rework_reject_count == 1 and build_status == RELEASED"

      - name: distributor_allowance_conserved_across_confirm_cancel_confirm_to_the_exact_limit
        grounds:
          - calculations.distributor_allowance_ledger
          - state_machines.CustomerOrder.CONFIRMED_to_CANCELLED
          - validations[priority=91]
          - errors[ERR_STOCK_ALLOWANCE_EXCEEDED]
          - entities.Distributor.fields.units_outstanding
          - entities.Distributor.fields.stock_allowance_remaining_units
        distinguishing_aspect: |
          A different conserved quantity with a two-sided invariant: units_outstanding +
          stock_allowance_remaining_units must equal committed_annual_units after EVERY operation,
          across a confirm / confirm / cancel / confirm sequence on four separate orders. The final
          confirmation is sized to consume the credited-back allowance exactly (300 against 300
          remaining, accepted at the inclusive boundary), and a one-unit order immediately after it
          must be refused — so an implementation that credits back even one unit too many or too
          few is caught either by the accepted call failing or by the refused call succeeding.
