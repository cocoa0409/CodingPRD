  - id: ERR_STEM_MANIFEST_INCOMPLETE
    http: 422
    condition: "The delivered stem_names set is missing at least one member of REQUIRED_STEM_NAMES"
  - id: ERR_CUE_SHEET_EMPTY
    http: 422
    condition: "Filing or registering was attempted with zero ALLOCATED CueSheetEntry rows"
  - id: ERR_CUE_ENTRY_ALREADY_VOIDED
    http: 409
    condition: "Void was attempted on a CueSheetEntry that is already VOIDED, or on a REGISTERED cue sheet"
  - id: ERR_NO_ELIGIBLE_LIBRARY_TRACK
    http: 409
    condition: "No ACTIVE LibraryTrack satisfies the market-count and length eligibility filter"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: MusicHouseProducer
    description: "Staff producer of the commercial music house. Owns the operational surface: clients, projects, briefs, rosters, session logistics and delivery packaging."
    identity: opaque
    exclusive_operations:
      - "POST /clients"
      - "POST /projects"
      - "POST /projects/{id}/hold"
      - "POST /projects/{id}/resume"
      - "POST /projects/{id}/briefs"
      - "POST /composers"
      - "POST /musicians"
      - "POST /studio-rooms"
      - "POST /session-calls"
      - "POST /session-calls/{id}/bookings"
      - "POST /session-calls/{id}/confirm"
      - "POST /session-calls/{id}/cancel"
      - "POST /session-calls/{id}/complete"
      - "POST /license-deals/{id}/deliverables"
      - "POST /deliverables/{id}/stems"
      - "POST /library-tracks"
    shared_operations:
      - "POST /_clock/set_current_utc"
      - "GET /projects/{id}/sourcing-comparison"
      - "GET /projects/{id}/afm-report"
      - "all GET endpoints"

  - name: ClientRep
    description: "Advertiser-side approver. Acts only on engagements whose Project.client_id equals the acting X-User-ID."
    identity: "entity_backed:Client"
    exclusive_operations:
      - "POST /briefs/{id}/approve"
      - "POST /demos/{id}/request-revision"
      - "POST /demos/{id}/shortlist"
      - "POST /demos/{id}/select"
      - "POST /license-deals/{id}/counter"
      - "POST /license-deals/{id}/accept"
      - "POST /deliverables/{id}/approve-master"
      - "POST /deliverables/{id}/reject-master"
    shared_operations:
      - "GET /projects/{id}/sourcing-comparison"
      - "all GET endpoints except GET /projects/{id}/afm-report"

  - name: Composer
    description: "Writer pitching demos. Acts only on demos whose Demo.composer_id equals the acting X-User-ID."
    identity: "entity_backed:Composer"
    exclusive_operations:
      - "POST /projects/{id}/demos"
      - "POST /demos/{id}/submit"
    shared_operations:
      - "all GET endpoints except GET /projects/{id}/afm-report and GET /projects/{id}/sourcing-comparison"

  - name: RightsAdmin
    description: "Licensing and performance-royalty desk. Two distinct RightsAdmin operator ids are required to draft and to activate the same deal."
    identity: opaque
    exclusive_operations:
      - "POST /license-deals"
      - "POST /license-deals/{id}/propose"
      - "POST /license-deals/{id}/activate"
      - "POST /license-deals/{id}/renew"
      - "POST /license-deals/{id}/reuse-extensions"
      - "POST /deliverables/{id}/cue-entries"
      - "POST /cue-entries/{id}/void"
      - "POST /deliverables/{id}/file-cue-sheet"
      - "POST /deliverables/{id}/register-cue-sheet"
    shared_operations:
      - "POST /_clock/set_current_utc"
      - "GET /projects/{id}/sourcing-comparison"
      - "GET /projects/{id}/afm-report"
      - "all GET endpoints"

  - name: AFMSteward
    description: "American Federation of Musicians steward. Sole authority over signatory clearance and the AFM wage report."
    identity: opaque
    exclusive_operations:
      - "POST /musicians/{id}/afm-clearance"
    shared_operations:
      - "POST /_clock/set_current_utc"
      - "GET /projects/{id}/afm-report"
      - "all GET endpoints except GET /projects/{id}/sourcing-comparison"
