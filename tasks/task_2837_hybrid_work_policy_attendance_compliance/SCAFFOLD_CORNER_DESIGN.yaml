      - name: numeric_range_band_width_and_enum_shape_rejections
        claim_type: violation_to_error
        grounds:
          - validations[priority=30, ERR_INVALID_REQUEST]
        distinguishing_aspect: "One error id is reached by four structurally different checks - a declared numeric range, an enum membership test, a derived relation between two numbers (desk band width == seat_count) and a strict inequality between two numbers (buffer_seats < seat_count) - and it is also reachable through a query parameter, not just a body field."
        test_recipe:
          setup:
            - "Cycle, team T-A, employee E-1001 and that employee's OPEN 2026-W37 week."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T09:00:00Z" }
              as: WorkplaceProgramOffice
            - call: "POST /policy-cycles"
              payload: { cycle_label: "FY27-CRN49", effective_from: "2026-09-01", effective_to: "2026-12-31", days_in_office_floor: 2, badge_weight: 0.60, network_weight: 0.40, collaboration_target_score: 70.00, equity_variance_threshold_pct: 20.00 }
              as: WorkplaceProgramOffice
              captures: { cyc_id: $.data.id }
            - call: "POST /teams"
              payload: { policy_cycle_id: "${cyc_id}", team_code: "T-A", expected_days_in_office_per_week: 3, core_collaboration_days: ["TUE", "WED", "THU"], headcount_planned: 12, signal_corroboration_required: false }
              as: WorkplaceProgramOffice
              captures: { t_a: $.data.id }
            - call: "POST /employees"
              payload: { team_id: "${t_a}", employee_number: "E-1001", work_email: "e1001@corp.example", home_timezone: "America/New_York", tenure_start_date: "2024-03-04", demographic_band: "BAND_A", manager_user_id: "mgr-1", hr_partner_user_id: "hrbp-1", disability_accommodation_on_file: false }
              as: HRBusinessPartner
              as_user_id: "hrbp-1"
              captures: { e1_id: $.data.id }
            - call: "POST /attendance-weeks"
              payload: { employee_id: "${e1_id}", iso_week: "2026-W37", week_start_date: "2026-09-07" }
              as: SystemIntegration
              as_user_id: "sys-1"
              captures: { w37: $.data.id }
          trigger:
            - call: "POST /teams"
              payload: { policy_cycle_id: "${cyc_id}", team_code: "T-SIX", expected_days_in_office_per_week: 6, core_collaboration_days: ["MON", "TUE", "WED", "THU", "FRI"], headcount_planned: 4, signal_corroboration_required: false }
              as: WorkplaceProgramOffice
              captures: { e_days_range: "$.data.error_id" }
            - call: "POST /neighborhoods"
              payload: { policy_cycle_id: "${cyc_id}", anchor_team_id: "${t_a}", neighborhood_code: "N-NARROW", site_code: "NYC-01", seat_count: 13, buffer_seats: 4, desk_index_from: 1, desk_index_to: 12 }
              as: WorkplaceProgramOffice
              captures: { e_band_width: "$.data.error_id" }
            - call: "POST /neighborhoods"
              payload: { policy_cycle_id: "${cyc_id}", anchor_team_id: "${t_a}", neighborhood_code: "N-NOCAP", site_code: "NYC-01", seat_count: 13, buffer_seats: 13, desk_index_from: 1, desk_index_to: 13 }
              as: WorkplaceProgramOffice
              captures: { e_buffer: "$.data.error_id" }
            - call: "POST /attendance-weeks/${w37}/signals"
              payload: { signal_source: "VPN_TUNNEL", site_code: "NYC-01", observed_date: "2026-09-08", minutes_present: 480, dedupe_key: "S-ENUM" }
              as: SystemIntegration
              as_user_id: "sys-1"
              captures: { e_enum: "$.data.error_id" }
            - call: "POST /attendance-weeks/${w37}/signals"
              payload: { signal_source: "BADGE", site_code: "NYC-01", observed_date: "2026-09-08", minutes_present: 1441, dedupe_key: "S-MINUTES" }
              as: SystemIntegration
              as_user_id: "sys-1"
              captures: { e_minutes: "$.data.error_id" }
            - call: "POST /exception-requests"
              payload: { employee_id: "${e1_id}", category: "CAREGIVING", requested_relief_days: 0, start_date: "2026-09-07", end_date: "2026-09-08", rationale: "zero relief days requested" }
              as: HRBusinessPartner
              as_user_id: "hrbp-1"
              captures: { e_relief_range: "$.data.error_id" }
            - call: "POST /recalibration-reviews"
              payload: { policy_cycle_id: "${cyc_id}", review_label: "R-BIG", proposed_days_in_office_delta: 3 }
              as: WorkplaceProgramOffice
