    path: /tabulator-units/{id}/program
    description: "Programs the unit for a locked ballot style (UNPROGRAMMED or LA_FAILED -> PROGRAMMED). The programmer is recorded for the segregation-of-duties check on the public test."
    roles: [VotingSystemTechnician]
    input: [style_id, firmware_version]
    output: TabulatorUnit
    side_effects:
      - "programmed_style_id, firmware_version and programmed_by_user_id = X-User-ID stored; program_status = PROGRAMMED."
