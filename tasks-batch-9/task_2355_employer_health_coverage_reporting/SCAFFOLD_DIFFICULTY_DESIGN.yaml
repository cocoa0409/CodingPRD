            - call: "POST /ale-reporting/group-members"
              payload: { controlled_group_id: "${group_id}", ein: "202020202", legal_name: "Consent Gate Co", ownership_pct: 100, measurement_method: "MONTHLY" }
              as: ComplianceOfficer
