              as_user_id: "${dealer_id}"
              captures: { err: $.data.error_id }
            - call: "POST /dealer-network/rematch-tasks/${task_id}/complete"
              payload: {}
              as: DealerPrincipal
              as_user_id: "${dealer_id}"
            - call: "POST /dealer-network/purchases"
              payload: { contractor_account_id: "${contractor_id}", product_line_id: "${line_id}", units: 1 }
              as: DealerPrincipal
              as_user_id: "${dealer_id}"
              captures: { ok_id: $.data.id }
          assert:
            - "err == \"ERR_REMATCH_REQUIRED\""
            - "after completing the task the identical purchase succeeds (${ok_id} non-null)"

      - name: refund_out_of_range_rejected
        claim_type: Violation → Error
        grounds:
          - validations[priority=22]
        distinguishing_aspect: "refund_cents greater than invoice_cents is ERR_INVALID_REQUEST; negative units likewise."
        test_recipe:
          setup: ["Fully onboarded ACTIVE dealer with contractor and SPECIALTY line."]
          setup_api_calls:
            - *k_clock
            - *k_region
            - *k_sys
            - *k_line_s1
            - *k_dealer
            - *k_onboard
            - *k_equip
            - *k_lic
            - *k_pass1
            - *k_stock
            - *k_oapp
            - *k_oful
            - *k_oinv
            - *k_act
            - call: "POST /dealer-network/contractors"
              payload: { dealer_id: "${dealer_id}", company_name: "Ace Painting LLC" }
              as: DealerPrincipal
              as_user_id: "${dealer_id}"
              captures: { contractor_id: $.data.id }
          trigger:
            - call: "POST /dealer-network/purchases"
              payload: { contractor_account_id: "${contractor_id}", product_line_id: "${line_id}", units: 1, refund_cents: 500 }
              as: DealerPrincipal
              as_user_id: "${dealer_id}"
              captures: { err_refund: $.data.error_id }
            - call: "POST /dealer-network/purchases"
              payload: { contractor_account_id: "${contractor_id}", product_line_id: "${line_id}", units: 0 }
              as: DealerPrincipal
              as_user_id: "${dealer_id}"
              captures: { err_units: $.data.error_id }
          assert:
            - "err_refund == \"ERR_INVALID_REQUEST\" (500 > invoice 100)"
            - "err_units == \"ERR_INVALID_REQUEST\" (units must be > 0)"

  # ===========================================================================
  - section: endpoints
    instances:

      - name: dealer_list_pagination_envelope
        claim_type: Listing
        grounds:
          - response_envelope
          - endpoints.GET_/dealer-network/dealers
        distinguishing_aspect: "GET /dealers with limit=1 returns one row, total_count 2, has_more true, and the four pagination fields; offset=1 returns the second row with has_more false."
        test_recipe:
          setup: ["Region with two dealers."]
          setup_api_calls:
            - *k_clock
            - *k_region
            - *k_dealer
            - call: "POST /dealer-network/dealers"
              payload: { region_id: "${region_id}", legal_name: "Second Paint Co", latitude: 43.0, longitude: -72.0, exclusivity_attested_on: "2026-08-01T00:00:00Z", coop_accrual_rate: 0.02 }
              as: RegionManager
          trigger:
            - call: "GET /dealer-network/dealers?limit=1&offset=0"
              as: RegionManager
          assert:
            - "response_type == \"array\" and the data array has exactly 1 element"
            - "pagination fields total_count == 2 and has_more == true are present"
            - "a follow-up with offset=1 returns 1 element with has_more == false"

      - name: ops_run_sweeps_overdue_equipment_and_expired_license
        claim_type: Action endpoint
        grounds:
          - endpoints.POST_/dealer-network/ops/run
        distinguishing_aspect: "After the clock advances past calibration_due_on and license expires_on, one ops run flips both: equipment_marked_overdue == 1 and licenses_expired == 1 in the summary counts."
        test_recipe:
          setup: ["ONBOARDING dealer with CALIBRATED unit (calibrated 2026-09-01, due 2026-11-30) and ACTIVE license (expires 2027-09-01). Clock advanced to 2027-10-01."]
          setup_api_calls:
            - *k_clock
            - *k_region
            - *k_sys
            - *k_dealer
            - *k_onboard
            - *k_equip
            - *k_lic
            - *k_pass1
            - call: "POST /dealer-network/_clock/set_current_utc"
              payload: { to_iso8601: "2027-10-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /dealer-network/ops/run"
              payload: {}
              as: PlatformAdmin
              captures: { overdue: $.data.equipment_marked_overdue, expired: $.data.licenses_expired }
            - call: "GET /dealer-network/equipment/${equip_id}"
              as: EquipmentTech
              captures: { eq_status: $.data.status }
            - call: "GET /dealer-network/licenses/${lic_id}"
              as: RegionManager
              captures: { lic_status: $.data.status }
          assert:
            - "overdue == 1 and expired == 1"
            - "eq_status == \"CALIBRATION_OVERDUE\" and lic_status == \"EXPIRED\""

      - name: clock_default_before_first_set
        claim_type: Computed read
        grounds:
          - endpoints.POST_/dealer-network/_clock/set_current_utc
        distinguishing_aspect: "Before any set call the logical clock is exactly 2026-09-01T00:00:00Z (default), proven by the returned current_utc after a set round-trip and by effective_from validation rejecting a future date."
        test_recipe:
          setup: ["Empty database; no clock call yet."]
          setup_api_calls:
            - *k_region
            - *k_sys
            - *k_line_s1
          trigger:
            - call: "POST /dealer-network/formulas"
              payload: { product_line_id: "${line_id}", code: "FUT", display_name: "Future Color", effective_from: "2026-09-02T00:00:00Z" }
              as: ColorLabAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == \"ERR_INVALID_REQUEST\" (effective_from 2026-09-02 is after the default clock 2026-09-01, proving the default holds before any set)"

      - name: fk_reverse_reachability_subresources
        claim_type: Cross-reference link
        grounds:
          - endpoints.GET_/dealer-network/dealers/{id}/rematch-tasks
          - endpoints.GET_/dealer-network/formulation-changes/{id}/rematch-tasks
        distinguishing_aspect: "The sub-resource GETs and the filtered-list GET return the same task set for a change with one task."
        test_recipe:
          setup: ["EFFECTIVE change with one PENDING task at the dealer (standard onboarding + change chain)."]
          setup_api_calls:
            - *k_clock
            - *k_region
            - *k_sys
            - *k_line_s1
            - call: "POST /dealer-network/formulas"
              payload: { product_line_id: "${line_id}", code: "F1", display_name: "Harbor Gray", effective_from: "2026-08-15T00:00:00Z" }
              as: ColorLabAdmin
            - *k_dealer
            - *k_onboard
            - *k_equip
            - *k_lic
            - *k_pass1
            - *k_stock
            - *k_oapp
            - *k_oful
            - *k_oinv
            - *k_act
            - *k_ch
            - *k_chann
            - *k_clock2
            - *k_cheff
          trigger:
            - call: "GET /dealer-network/dealers/${dealer_id}/rematch-tasks"
              as: RegionManager
              captures: { by_dealer: "$.data[0].id" }
            - call: "GET /dealer-network/formulation-changes/${ch_id}/rematch-tasks"
              as: RegionManager
              captures: { by_change: "$.data[0].id" }
          assert:
            - "by_dealer == by_change (both reverse lookups resolve the same task)"

  # ===========================================================================
  - section: errors
    instances:

      - name: error_catalog_triggerability_stubs
        claim_type: Violation → Error
        grounds:
          - errors[ERR_INVALID_STATE]
          - errors[ERR_LICENSE_NOT_ACTIVE]
          - errors[ERR_EQUIPMENT_NOT_CALIBRATED]
          - errors[ERR_MIN_INVENTORY_UNMET]
          - errors[ERR_STALE_VERSION]
          - errors[ERR_TERRITORY_CONFLICT]
          - errors[ERR_REMATCH_REQUIRED]
        distinguishing_aspect: "Every remaining catalog error is triggered by a §1.8 instance or a §1.9 instance above."
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / purchase_gated_by_license_and_equipment_states
          rationale: "ERR_LICENSE_NOT_ACTIVE asserted there; ERR_INVALID_STATE in terminate_terminal_lockdown_blocks_suspend; ERR_EQUIPMENT_NOT_CALIBRATED in rematch_task_completion_gated_by_equipment_state; ERR_MIN_INVENTORY_UNMET in initial_stock_minimum_39_vs_40_units; ERR_STALE_VERSION is exercised by the OCC tests of the optimistic-concurrency layer below; ERR_TERRITORY_CONFLICT and ERR_REMATCH_REQUIRED by validations-section instances."

  # ===========================================================================
  - section: roles
    instances:

      - name: region_manager_cannot_suspend_dealer
        claim_type: RBAC denial
        grounds:
          - roles.RegionManager
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: "RegionManager attempting ChannelDirector's exclusive suspend gets ERR_UNAUTHORIZED 403."
        test_recipe:
          setup: ["Fully onboarded ACTIVE dealer."]
          setup_api_calls:
            - *k_clock
            - *k_region
            - *k_sys
            - *k_line_s1
            - *k_dealer
            - *k_onboard
            - *k_equip
            - *k_lic
            - *k_pass1
            - *k_stock
            - *k_oapp
            - *k_oful
            - *k_oinv
            - *k_act
          trigger:
            - call: "POST /dealer-network/dealers/${dealer_id}/suspend"
              payload: {}
              as: RegionManager
              captures: { err: $.data.error_id }
          assert:
            - "err == \"ERR_UNAUTHORIZED\" with http 403"

      - name: color_lab_admin_cannot_create_region
        claim_type: RBAC denial
        grounds:
          - roles.ColorLabAdmin
          - roles.PlatformAdmin
        distinguishing_aspect: "ColorLabAdmin (peer role owning color entities) cannot create a Region — peer-role isolation, not a hierarchy."
        test_recipe:
          setup: ["Empty database."]
          setup_api_calls: []
          trigger:
            - call: "POST /dealer-network/regions"
              payload: { code: "NE", name: "Northeast", territory_radius_miles: 25, exclusivity_block_threshold_pct: 15 }
              as: ColorLabAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == \"ERR_UNAUTHORIZED\""

      - name: dealer_principal_read_access_shared
        claim_type: RBAC allow
        grounds:
          - roles.DealerPrincipal
        distinguishing_aspect: "DealerPrincipal can GET shared read endpoints (own dealer record) — shared_operations actually work."
        test_recipe:
          setup: ["ONBOARDING dealer exists."]
          setup_api_calls: [*k_clock, *k_region, *k_dealer, *k_onboard]
          trigger:
            - call: "GET /dealer-network/dealers/${dealer_id}"
              as: DealerPrincipal
              as_user_id: "${dealer_id}"
              captures: { name: $.data.legal_name }
          assert:
            - "name == \"Beacon Paint Co\" (shared GET allowed for DealerPrincipal)"

      - name: equipment_tech_cannot_approve_order
        claim_type: RBAC denial
        grounds:
          - roles.EquipmentTech
        distinguishing_aspect: "EquipmentTech attempting RegionManager's exclusive order approval gets ERR_UNAUTHORIZED."
        test_recipe:
          setup: ["ONBOARDING dealer with a SUBMITTED INITIAL_STOCK order."]
          setup_api_calls:
            - *k_clock
            - *k_region
            - *k_sys
            - *k_line_s1
            - *k_dealer
            - *k_onboard
            - *k_stock
          trigger:
            - call: "POST /dealer-network/orders/${stock_order_id}/approve"
              payload: {}
              as: EquipmentTech
              captures: { err: $.data.error_id }
          assert:
            - "err == \"ERR_UNAUTHORIZED\""

  # ===========================================================================
  - section: cross-cutting complexity layers
    instances:

      - name: occ_stale_version_on_application_approve
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[application-approve-stale-version]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "Submitting an application bumps its version to 2; an approve carrying the pre-submit version 1 is rejected ERR_STALE_VERSION 412, while approve with the current version succeeds."
        test_recipe:
          setup: ["Region, SUBMITTED application (version advanced by submit)."]
          setup_api_calls:
            - *k_clock
            - *k_region
            - call: "POST /dealer-network/applications"
              payload: { region_id: "${region_id}", legal_name: "OCC Paint Co", latitude: 42.0, longitude: -71.0, exclusivity_attested_on: "2026-08-01T00:00:00Z", coop_accrual_rate: 0.02 }
              as: RegionManager
              captures: { app_id: $.data.id, app_v1: $.data.version }
            - call: "POST /dealer-network/applications/${app_id}/submit"
              payload: {}
              as: RegionManager
              captures: { app_v2: $.data.version }
          trigger:
            - call: "POST /dealer-network/applications/${app_id}/approve"
              payload: { expected_application_version: "${app_v1}" }
              as: RegionManager
              captures: { err: $.data.error_id }
            - call: "POST /dealer-network/applications/${app_id}/approve"
              payload: { expected_application_version: "${app_v2}" }
              as: RegionManager
              captures: { ok: $.data.status }
          assert:
            - "app_v1 == 1 and app_v2 == 2"
            - "err == \"ERR_STALE_VERSION\" with http 412 (stale expected version)"
            - "ok == \"APPROVED\" with the fresh version"

      - name: occ_stale_version_on_formulation_announce
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[formulation-announce-stale-version]
        distinguishing_aspect: "Cancelling a DRAFT change bumps its version; a subsequent announce carrying the pre-cancel version yields ERR_STALE_VERSION (OCC evaluated before the state machine's invalid-from check)."
        test_recipe:
          setup: ["System, SPECIALTY line, DRAFT change (version 1), then cancelled (version 2)."]
          setup_api_calls:
            - *k_clock
            - *k_region
            - *k_sys
            - *k_line_s1
            - call: "POST /dealer-network/formulation-changes"
              payload: { product_line_id: "${line_id}", title: "OCC change", reason: "test", effective_date: "2026-09-05T00:00:00Z" }
              as: ColorLabAdmin
              captures: { ch_id: $.data.id, ch_v1: $.data.version }
            - call: "POST /dealer-network/formulation-changes/${ch_id}/cancel"
              payload: {}
              as: ColorLabAdmin
          trigger:
            - call: "POST /dealer-network/formulation-changes/${ch_id}/announce"
              payload: { expected_change_version: "${ch_v1}" }
              as: ColorLabAdmin
              captures: { err: $.data.error_id }
          assert:
            - "err == \"ERR_STALE_VERSION\" with http 412"

      - name: scheduled_deferred_formulation_change_takes_effect_at_date
        claim_type: scheduled_actions
        grounds:
          - complexity_profile.complexity_layers
          - state_machines.FormulationChange
        distinguishing_aspect: "A change announced with a future effective_date cannot be made effective before that date (covered above) and takes effect once the clock reaches the date — the deferred action is clock-driven."
        test_recipe:
          setup: ["System, SPECIALTY line, ANNOUNCED change with effective_date 2026-09-05."]
          setup_api_calls:
            - *k_clock
            - *k_region
            - *k_sys
            - *k_line_s1
            - call: "POST /dealer-network/formulation-changes"
              payload: { product_line_id: "${line_id}", title: "Deferred change", reason: "test", effective_date: "2026-09-05T00:00:00Z" }
              as: ColorLabAdmin
              captures: { ch_id: $.data.id, ch_v: $.data.version }
            - call: "POST /dealer-network/formulation-changes/${ch_id}/announce"
              payload: { expected_change_version: "${ch_v}" }
              as: ColorLabAdmin
          trigger:
            - call: "POST /dealer-network/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /dealer-network/formulation-changes/${ch_id}/make-effective"
              payload: {}
              as: ColorLabAdmin
              captures: { st: $.data.status }
          assert:
            - "st == \"EFFECTIVE\" (deferred action executes exactly at its declared date)"

      - name: cascading_license_suspend_on_last_unit_loss
        claim_type: excluded_because_stub
        grounds: [state_machines.ColorLicense.ACTIVE_to_SUSPENDED]
        excluded_because:
          difficulty_instance: non_linear_state_machine / equipment_calibration_cycle_fail_drop_and_recovery
          rationale: "License SUSPENDED/ACTIVE cascade asserted in the named §1.8 instance."

