              as: GranteeStaff
              as_user_id: "${org_id}"
              captures: { error_id: $.data.error_id }
            - call: "POST /enrollments/${enr_a}/hour-entries"
              payload: { service_date: "2027-08-15", minutes: 60, activity_code: "DIRECT_SERVICE" }
