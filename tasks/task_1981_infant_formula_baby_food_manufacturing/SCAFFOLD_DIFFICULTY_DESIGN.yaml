              as: REGULATORY_AFFAIRS
              captures: { finv_id: $.data.id }
            - call: "POST /api/v1/formulas/${finv_id}/submit-for-review"
              payload: {}
              as: REGULATORY_AFFAIRS
            - call: "POST /api/v1/process-validations"
              payload:
                formula_id: "${finv_id}"
                validation_type: "DRY_BLEND_HOMOGENEITY"
                protocol_version: "PV-2026-012"
                validation_validity_days: 365
              as: QA_MANAGER
              captures: { pvinv_id: $.data.id }
