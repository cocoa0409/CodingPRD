            - call: "POST /coating/applicators/${app_id}/qualifications"
              payload: { program_id: "${prog_id}" }
              as: ApplicatorRep
              as_user_id: "${app_id}"
              captures:
                qual_id: $.data.id
            - call: "POST /coating/applicators/${app_id}/qualifications/${qual_id}/certify"
              payload: { expected_applicator_version: "${app_v}" }
              as: TechnicalServiceEngineer
            - call: "POST /coating/applicators/${app_id}/qualifications/${qual_id}/suspend"
              payload: {}
              as: TechnicalServiceEngineer
            - call: "POST /coating/applicators/${app_id}/qualifications/${qual_id}/reinstate"
              payload: {}
              as: TechnicalServiceEngineer
            - call: "POST /coating/applicators/${app_id}/qualifications/${qual_id}/suspend"
              payload: {}
              as: TechnicalServiceEngineer
            - call: "POST /coating/applicators/${app_id}/qualifications/${qual_id}/reinstate"
              payload: {}
              as: TechnicalServiceEngineer
            - call: "POST /coating/applicators/${app_id}/qualifications/${qual_id}/suspend"
              payload: {}
              as: TechnicalServiceEngineer
            - call: "POST /coating/applicators/${app_id}/qualifications/${qual_id}/reinstate"
              payload: {}
              as: TechnicalServiceEngineer
            - call: "POST /coating/applicators/${app_id}/qualifications/${qual_id}/suspend"
              payload: {}
              as: TechnicalServiceEngineer
          trigger:
            - call: "POST /coating/applicators/${app_id}/qualifications/${qual_id}/reinstate"
              payload: {}
              as: TechnicalServiceEngineer
          assert:
            - "HTTP 409 with error_id ERR_REINSTATE_LIMIT_EXCEEDED (suspension_count already 3)"
            - "ApplicatorQualification.${qual_id}.suspension_count == 3"
            - "ApplicatorQualification.${qual_id}.status remains 'SUSPENDED'"

