        distinguishing_aspect: "version is a write counter, not a state label: it advances on create, on authorize, on suspend and on re-authorization, it never advances across any number of GETs, and it advances even when a transition returns the entity to a status it already held."
        test_recipe:
          setup:
            - "Clock 2026-08-05T00:00:00Z and one jurisdiction TX-HARRIS with max_authorized_builders 2."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
