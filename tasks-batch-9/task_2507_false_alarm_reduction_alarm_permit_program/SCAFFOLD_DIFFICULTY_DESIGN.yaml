          setup:
            - "One ACTIVE FeeSchedule with appeal_filing_days 20, free_alarm_allowance 0, single tier [1..null: 10000], probation_threshold_count 4, suspension_threshold_count 6, invoice_due_days 3650 (two incidents can never propose a suspension)."
