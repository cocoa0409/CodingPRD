              captures: { c_c_id: $.data.id }
          assert:
            - "the 2026-10-31 start returns HTTP 409 with ${err} == ERR_LOCATION_CAPACITY_EXCEEDED"
            - "the 2026-11-01 start returns HTTP 201"
            - "PurchaseContract.${c_c_id}.hedge_lots_assigned == 9"
            - "ElevatorLocation.${loc3_id}.committed_intake_bushels == 105000.00"
            - "PurchaseContract.${c_a_id}.status == ACTIVE"

  - rule_id: compensating_invariant
    instances:
      - name: open_bushel_commitment_conserved_by_ticket_apply_then_reverse
        grounds:
          - state_machines.DeliveryTicket.GRADED_to_APPLIED
          - state_machines.DeliveryTicket.APPLIED_to_REVERSED
          - calculations.desk_credit_posture
          - entities.TradingDesk.fields.open_bushel_commitment
        distinguishing_aspect: |
          The conserved quantity is BUSHELS: TradingDesk.open_bushel_commitment, defined as the
          sum of (bushels - delivered_bushels) over ACTIVE contracts of the desk. Applying a
          10,000-bushel ticket drops it from 50000.00 to 40000.00 and reversing that ticket
          restores it to exactly 50000.00 with no drift in delivered_bushels, settled_value_usd
          or delivery_status.
        test_recipe:
          setup:
            - "Desk, elevator, ACTIVE CORN discount schedule, SHORT 2026-12 hedge with 10 lots at 448 and an ACTIVE basis -32 bid."
            - "One FULLY_PRICED 50,000-bushel CASH contract at 416 cents gross unit price and one GRADED 10,000-bushel clean ticket."
          setup_api_calls:
            - call: "POST /grain/trading-desks"
              payload: { desk_code: "GD22", name: "Bushel Invariant Desk", credit_line_usd: 5000000.00 }
              as: DeskAdmin
              as_user_id: "u-admin-1"
              captures: { desk_id: $.data.id }
            - call: "POST /grain/elevator-locations"
              payload: { desk_id: "${desk_id}", location_code: "ELV1", name: "Morris Elevator", intake_capacity_bushels: 5000000, rail_served: true }
              as: DeskAdmin
              as_user_id: "u-admin-1"
              captures: { loc1_id: $.data.id }
            - call: "POST /grain/discount-schedules"
              payload: { commodity_code: "CORN", effective_from: "2026-07-01T00:00:00Z", moisture_standard_pct: 15.0, shrink_factor_pct_per_point: 1.18, tiers: [ { factor: "MOISTURE", direction: "ABOVE", threshold_value: 15.0, unit_step: 0.5, rate_cents_per_bushel_per_step: 2.5 }, { factor: "TEST_WEIGHT", direction: "BELOW", threshold_value: 54.0, unit_step: 1.0, rate_cents_per_bushel_per_step: 3.5 }, { factor: "FOREIGN_MATERIAL", direction: "ABOVE", threshold_value: 3.0, unit_step: 0.5, rate_cents_per_bushel_per_step: 1.5 }, { factor: "DAMAGE", direction: "ABOVE", threshold_value: 5.0, unit_step: 1.0, rate_cents_per_bushel_per_step: 4.0 } ] }
              as: DeskAdmin
              as_user_id: "u-admin-1"
              captures: { sch1_id: $.data.id }
            - call: "POST /grain/discount-schedules/${sch1_id}/activate"
              payload: {}
              as: DeskAdmin
              as_user_id: "u-admin-1"
            - call: "POST /grain/hedge-positions"
              payload: { desk_id: "${desk_id}", commodity_code: "CORN", futures_month: "2026-12", side: "SHORT", lots_open: 10, avg_entry_price_cents: 448 }
              as: FuturesTrader
              as_user_id: "u-trader-1"
              captures: { hp1_id: $.data.id }
            - call: "POST /grain/bids"
              payload: { location_id: "${loc1_id}", commodity_code: "CORN", futures_month: "2026-12", delivery_period_start: "2026-10-01", delivery_period_end: "2026-12-31", basis_cents: -32, max_bushels: 1000000, expires_at: "2027-01-15T00:00:00Z" }
              as: Merchandiser
              as_user_id: "u-merch-1"
              captures: { bid1_id: $.data.id }
            - call: "POST /grain/bids/${bid1_id}/activate"
              payload: {}
              as: Merchandiser
              as_user_id: "u-merch-1"
            - call: "POST /grain/purchase-contracts"
              payload: { bid_id: "${bid1_id}", hedge_position_id: "${hp1_id}", contract_type: "CASH", bushels: 50000, seller_name: "Bell Farms", delivery_start: "2026-11-01", delivery_end: "2026-11-30", futures_price_cents: 448, settlement_basis: "SHRINK_FIRST" }
              as: Merchandiser
              as_user_id: "u-merch-1"
              captures: { c1_id: $.data.id }
            - call: "POST /grain/delivery-tickets"
              payload: { contract_id: "${c1_id}", location_id: "${loc1_id}", gross_bushels: 10000, moisture_pct: 15.0, test_weight_lbs: 56.0, foreign_material_pct: 2.0, damage_pct: 0.0 }
              as: GrainInspector
              as_user_id: "u-insp-1"
              captures: { tkt_id: $.data.id }
          trigger:
            - call: "GET /grain/trading-desks/${desk_id}"
              payload: {}
              as: RiskOfficer
              as_user_id: "u-risk-1"
              captures: { obc_before: $.data.open_bushel_commitment }
            - call: "POST /grain/delivery-tickets/${tkt_id}/apply"
              payload: {}
              as: Merchandiser
              as_user_id: "u-merch-1"
            - call: "POST /grain/delivery-tickets/${tkt_id}/reverse"
              payload: { reversal_reason: "scale ticket voided by the state inspector" }
              as: GrainInspector
              as_user_id: "u-insp-1"
          assert:
            - "${obc_before} == 50000.00"
            - "immediately after the apply, TradingDesk.${desk_id}.open_bushel_commitment == 40000.00"
            - "immediately after the apply, PurchaseContract.${c1_id}.settled_value_usd == 41300.00"
            - "after the reverse, TradingDesk.${desk_id}.open_bushel_commitment == 50000.00"
            - "after the reverse, PurchaseContract.${c1_id}.delivered_bushels == 0.00"
            - "after the reverse, PurchaseContract.${c1_id}.settled_value_usd == 0.00"
            - "after the reverse, PurchaseContract.${c1_id}.delivery_status == OPEN"
            - "after the reverse, PurchaseContract.${c1_id}.status == ACTIVE"
            - "DeliveryTicket.${tkt_id}.status == REVERSED and net_bushels is still 10000.00"

      - name: committed_hedge_lots_conserved_by_contract_create_then_cancel
        grounds:
          - state_machines.PurchaseContract.ACTIVE_to_CANCELLED
          - calculations.contract_hedge_lots
          - entities.TradingDesk.fields.committed_hedge_lots
          - entities.HedgePosition.fields.lots_committed
        distinguishing_aspect: |
          The conserved quantity is FUTURES LOTS, a different type of quantity from the bushel
          invariant: TradingDesk.committed_hedge_lots, the sum of lots_committed over
          OPEN/MARGIN_CALL positions. Striking a 25,000-bushel contract raises it from 0 to 5
          and cancelling that contract returns it to exactly 0 while lots_open stays at 10.
        test_recipe:
          setup:
            - "Desk, elevator, SHORT 2026-12 hedge with 10 lots at 448 and an ACTIVE basis -32 bid."
            - "No contracts yet, so committed_hedge_lots starts at 0."
          setup_api_calls:
            - call: "POST /grain/trading-desks"
              payload: { desk_code: "GD23", name: "Lot Invariant Desk", credit_line_usd: 5000000.00 }
              as: DeskAdmin
              as_user_id: "u-admin-1"
              captures: { desk_id: $.data.id }
            - call: "POST /grain/elevator-locations"
              payload: { desk_id: "${desk_id}", location_code: "ELV1", name: "Morris Elevator", intake_capacity_bushels: 5000000, rail_served: true }
              as: DeskAdmin
              as_user_id: "u-admin-1"
              captures: { loc1_id: $.data.id }
            - call: "POST /grain/hedge-positions"
              payload: { desk_id: "${desk_id}", commodity_code: "CORN", futures_month: "2026-12", side: "SHORT", lots_open: 10, avg_entry_price_cents: 448 }
              as: FuturesTrader
              as_user_id: "u-trader-1"
              captures: { hp1_id: $.data.id }
            - call: "POST /grain/bids"
              payload: { location_id: "${loc1_id}", commodity_code: "CORN", futures_month: "2026-12", delivery_period_start: "2026-10-01", delivery_period_end: "2026-12-31", basis_cents: -32, max_bushels: 1000000, expires_at: "2027-01-15T00:00:00Z" }
              as: Merchandiser
              as_user_id: "u-merch-1"
              captures: { bid1_id: $.data.id }
            - call: "POST /grain/bids/${bid1_id}/activate"
              payload: {}
              as: Merchandiser
              as_user_id: "u-merch-1"
          trigger:
            - call: "GET /grain/trading-desks/${desk_id}"
              payload: {}
              as: RiskOfficer
              as_user_id: "u-risk-1"
              captures: { lots_before: $.data.committed_hedge_lots }
            - call: "POST /grain/purchase-contracts"
              payload: { bid_id: "${bid1_id}", hedge_position_id: "${hp1_id}", contract_type: "CASH", bushels: 25000, seller_name: "Bell Farms", delivery_start: "2026-11-01", delivery_end: "2026-11-30", futures_price_cents: 448 }
              as: Merchandiser
              as_user_id: "u-merch-1"
              captures: { c1_id: $.data.id }
            - call: "POST /grain/purchase-contracts/${c1_id}/cancel"
              payload: { damages_method: "MARKET_LOSS", cancellation_reason: "mutual unwind at flat market" }
              as: RiskOfficer
              as_user_id: "u-risk-1"
          assert:
            - "${lots_before} == 0"
            - "immediately after the create, TradingDesk.${desk_id}.committed_hedge_lots == 5"
            - "immediately after the create, HedgePosition.${hp1_id}.lots_committed == 5 and lots_available == 5"
            - "after the cancel, TradingDesk.${desk_id}.committed_hedge_lots == 0"
            - "after the cancel, HedgePosition.${hp1_id}.lots_committed == 0 and lots_available == 10"
            - "after the cancel, HedgePosition.${hp1_id}.lots_open == 10"
            - "PurchaseContract.${c1_id}.status == CANCELLED and damages_usd == 0.00"
            - "TradingDesk.${desk_id}.open_bushel_commitment == 0.00"
