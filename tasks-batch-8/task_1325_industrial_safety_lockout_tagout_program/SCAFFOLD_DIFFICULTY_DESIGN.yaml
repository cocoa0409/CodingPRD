  - rule_id: compensating_invariant
    instances:
      - name: lock_issue_remove_conserves_outstanding
        grounds:
          - calculations.outstanding_lock_count
          - state_machines.EmployeeLock.ISSUED_to_APPLIED
          - state_machines.EmployeeLock.APPLIED_to_REMOVED
        distinguishing_aspect: |
          Conserved quantity: per-employee outstanding locks,
          COUNT(EmployeeLock WHERE employee_id = E AND status IN
          {ISSUED, APPLIED}). The forward+compensating pair (issue -> apply ->
          remove) MUST return Employee.outstanding_lock_count to its exact
          pre-pair value; the mid-pair value proves the counter actually moved.
        test_recipe:
          setup:
            - "Machine M with ACTIVE procedure P; session S in SETUP; W1 qualified with outstanding_lock_count == 0"
          setup_api_calls:
            - call: "POST /employees"
              payload: { employee_no: "E-MGR-LI", full_name: "Mgr LI", qualification: "AUTHORIZED" }
