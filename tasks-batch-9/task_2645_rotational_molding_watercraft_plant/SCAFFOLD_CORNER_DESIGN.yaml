            - &cvQ_release
              call: "POST /production-orders/${po}/release"
              payload: {}
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { po_v: $.data.version }
            - &cvQ_cycle
              call: "POST /molding-cycles"
              payload: { production_order_id: "${po}", oven_station_id: "${station}", arm_index: 1, cooling_bay_id: "${bay}", oven_start_at: "2026-08-01T09:00:00Z", scheduled_oven_minutes: 60, scheduled_cooling_minutes: 30, oven_temp_c: 288.0, arm_rpm_major: 8.00, arm_rpm_minor: 2.00, cooling_mode: "FORCED_AIR", expected_production_order_version: "${po_v}" }
              as: MoldingOperator
              as_user_id: "${t_op}"
              captures: { cyc: $.data.id }
          trigger:
            - call: "GET /resin-lots/${lot_bad}"
              payload: {}
              as: ResinTechnician
              as_user_id: "${t_res}"
              captures: { bad_v: $.data.version }
            - call: "POST /resin-charges"
              payload: { molding_cycle_id: "${cyc}", resin_lot_id: "${lot_bad}", charge_kg: 20.000, regrind_kg: 2.000, expected_resin_lot_version: "${bad_v}" }
              as: ResinTechnician
              as_user_id: "${t_res}"
            - call: "GET /resin-lots/${lot_hot}"
              payload: {}
              as: ResinTechnician
              as_user_id: "${t_res}"
              captures: { hot_v: $.data.version }
            - call: "POST /resin-charges"
              payload: { molding_cycle_id: "${cyc}", resin_lot_id: "${lot_hot}", charge_kg: 20.000, regrind_kg: 2.000, expected_resin_lot_version: "${hot_v}" }
              as: ResinTechnician
              as_user_id: "${t_res}"
            - call: "GET /resin-lots/${lot_thin}"
              payload: {}
              as: ResinTechnician
              as_user_id: "${t_res}"
              captures: { thin_v: $.data.version }
            - call: "POST /resin-charges"
              payload: { molding_cycle_id: "${cyc}", resin_lot_id: "${lot_thin}", charge_kg: 20.000, regrind_kg: 2.000, expected_resin_lot_version: "${thin_v}" }
              as: ResinTechnician
              as_user_id: "${t_res}"
            - call: "GET /resin-lots/${lot_ok}"
              payload: {}
              as: ResinTechnician
              as_user_id: "${t_res}"
              captures: { ok_v: $.data.version }
            - call: "POST /resin-charges"
              payload: { molding_cycle_id: "${cyc}", resin_lot_id: "${lot_ok}", charge_kg: 20.000, regrind_kg: 2.000, expected_resin_lot_version: "${ok_v}" }
              as: ResinTechnician
              as_user_id: "${t_res}"
            - call: "GET /resin-lots/${lot_ok}"
              payload: {}
              as: ResinTechnician
              as_user_id: "${t_res}"
            - call: "GET /molding-cycles/${cyc}"
              payload: {}
              as: MoldingOperator
              as_user_id: "${t_op}"
            - call: "GET /resin-charges?molding_cycle_id=${cyc}"
              payload: {}
              as: ResinTechnician
              as_user_id: "${t_res}"
          assert:
            - "the LOT-CVQ-BAD charge fails 422 ERR_RESIN_LOT_NOT_QUALIFIED: the lot is MDPE against a HDPE_LINEAR model, AND its available_kg 5.000 is far short of the 20.000 requested, so rung 51 and rung 72 are violated by one request and the lower rung answers"
            - "the LOT-CVQ-HOT charge fails 422 ERR_RESIN_LOT_NOT_QUALIFIED with 100.000 kg available — rung 51 alone, on the melt-index band: 6.01 sits just outside the inclusive upper bound max_melt_index_g10min 6.00, so the band is closed at both ends"
            - "the LOT-CVQ-THIN charge fails 409 ERR_RESIN_INSUFFICIENT — rung 72 alone, on a lot that qualifies on grade, colour, additive and melt index but holds only 5.000 of the 20.000 kg needed; this is the proof that rung 72 was genuinely violated in the LOT-CVQ-BAD request"
            - "the two failures return different HTTP codes as well as different ids (422 for 51, 409 for 72), so a handler that evaluated availability first would be caught twice over"
            - "the LOT-CVQ-OK charge returns 201 with status RESERVED: 20.000 >= 20.000, the equality case of rung 72, which drains the lot to available_kg exactly 0.000 with reserved_kg 20.000 and consumed_kg 0.000 — sum 20.000 == received_kg"
            - "MoldingCycle.${cyc}.charged_mass_kg == 20.000 and GET /resin-charges?molding_cycle_id=${cyc} returns exactly 1 row: none of the three refused charges left a row behind"
            - "LOT-CVQ-BAD, LOT-CVQ-HOT and LOT-CVQ-THIN all still read reserved_kg 0.000 and their original available_kg (5.000, 100.000, 5.000) with unchanged version — a refused charge never touches the mass ledger"
            - "the blended regrind share of the accepted charge is round(2.000 / 20.000 * 100, 2) == 10.00 pct, inside max_regrind_pct 30.00, so rungs 50 and 52 are satisfied throughout and cannot be confused with either failure"

      # -----------------------------------------------------------------------
      # V10 — priority 61: warranty eligibility depends on a DIFFERENT entity's
      # state, and only the terminal DELIVERED state admits a claim.
      # -----------------------------------------------------------------------
      - name: val_cross_entity_claim_requires_the_hull_to_be_delivered
        claim_type: "Cross-entity validation"
        grounds:
          - validation_rules.priority_61
          - errors.ERR_UNIT_NOT_DELIVERED
          - state_machines.FinishedUnit.logistics_status
          - endpoints.POST_/warranty-claims
        distinguishing_aspect: "The same claim body is refused 409 ERR_UNIT_NOT_DELIVERED while the hull is STORED and again while it is IN_TRANSIT, and is accepted 201 the moment the shipment is delivered — while a sibling hull still sitting in the warehouse remains unclaimable."
