      - 'NASA retried against the freed seat: HTTP 201 with access_state ''REQUESTED'' — the pool is a live ledger, not a
        high-water mark of grants ever issued'
      - reuse_seats_total == 5 == reuse_seats_granted + reuse_seats_available after every one of the writes above
- section: rbac
  instances:
  - name: every_csp_exclusive_write_is_closed_to_the_other_three_roles
    claim_type: exclusive_operations
    grounds:
    - rbac.CspComplianceLead.exclusive_operations
    - validations[priority=2]
    - errors[ERR_FORBIDDEN_ROLE]
    distinguishing_aspect: 'The provider''s thirteen exclusive writes are the widest role surface in the matrix, and the priority
      2 role gate must fire on all of them before any state, referential or fiscal rule is consulted: the impact-determination-shaped
      calls below are rejected as 403 even though they would ALSO fail their state precondition, which proves the ordering
      rather than the outcome.'
    test_recipe:
      setup:
      - Clock 2026-02-01T00:00:00Z; offering CATEGORIZED, owned by csp-lead-1, sponsored by nobody yet.
      - One CONFIRMED MODERATE data category exists; no control implementations and no findings.
