# =============================================================================
# Window Cleaning & Pressure Washing — Scaffold (Expert tier)
# §1.0–§1.7 in SCAFFOLD.yaml; §1.8 / §1.9 live in sibling design files.
# =============================================================================

scenario: |
  Window Cleaning & Pressure Washing: quote by pane count/sq-ft, recurring vs
  one-time schedule, crew & route dispatch, add-on (gutter/screen/soft-wash),
  weather reschedule, before/after photo, deposit & per-visit billing,
  satisfaction re-clean

domain_name: window-cleaning-pressure-washing
api_prefix: ""   # flat topology: each entity is a top-level collection (/accounts, /properties, /quotes, ...); no single shared path prefix

# =============================================================================
# §0 Complexity Profile
# =============================================================================
complexity_profile:
  difficulty: Expert
  primary_archetype: temporal_windowing
  secondary_archetype: pricing_engine
  complexity_layers:
    - dual_variant_calculation       # pane-count vs sq-ft quoting; estimate vs actual per-visit charge
    - cascading_side_effects         # weather reschedule, agreement cancel, re-clean credit chains
    - derived_field_reconciliation   # account balance, route booked-minutes, visit price
    - optimistic_concurrency         # OCC on Route.version when committing a visit onto a route
    - rate_threshold_triggers        # tiered pane pricing, soft-wash surcharge, deposit threshold

  entity_topology: flat
  # Peer entities linked by FK (accounts, properties, agreements, visits, routes,
  # crews, invoices). URLs are flat collections with FK fields in the body; no
  # deep parent/child nesting beyond one append-only photo log.

  state_machine_shape: parallel
  # Visit carries two independent dimensions (schedule_status × billing_status);
  # ServiceAgreement is cyclic (ACTIVE↔PAUSED); ReCleanRequest and Quote branch.

  relationship_patterns:
    - one_to_many        # Account→Property, Account→ServiceAgreement, Visit→AddOn, Visit→VisitPhoto
    - cross_aggregate    # Visit references Route, Crew, ServiceAgreement, Property across aggregates
    - polymorphic        # LedgerEntry.source_type references Invoice|Payment|Deposit|ReCleanCredit

  role_model: peer_roles
  # Customer owns its own account/quotes/re-clean requests; Dispatcher owns
  # routes & crews; FieldCrew executes visits & uploads photos; Billing owns
  # invoices/deposits/ledger. Distinct resource ownership per role.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: Account
    parent: null
    common_fields: true
    fields:
      - name: company_name
        type: string
        source: input
        description: "Customer-facing account name"
      - name: contact_email
        type: string
        source: input
        description: "Primary contact email; unique per account"
        constraints: "unique across Account"
      - name: region_code
        type: enum
        source: input
        description: "Service region used to match WeatherAdvisory"
        constraints: "one of {NORTH, SOUTH, EAST, WEST}"
      - name: balance_cents
        type: integer
        source: computed
        description: "Derived: sum of LedgerEntry.signed_amount_cents for this account. Positive = owed by customer; negative = customer credit. Starts 0."
      - name: deposit_held_cents
        type: integer
        source: computed
        description: "Derived: sum of Deposit.amount_cents in HELD status for this account. Starts 0."
      - name: status
        type: enum
        source: system
        description: "ACTIVE. Accounts have no suspension lifecycle in this scenario; always ACTIVE on create."
        default: "ACTIVE"
        constraints: "one of {ACTIVE}"

  - name: Property
    parent: null
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: input
        description: "FK -> Account.id; the owning account"
      - name: address_line
        type: string
        source: input
        description: "Street address of the site"
      - name: pane_count
        type: integer
        source: input
        description: "Number of window panes; basis for PANE_COUNT quoting"
        constraints: ">= 0"
      - name: glass_sqft
        type: number
        source: input
        description: "Total glass area in square feet; basis for SQ_FT quoting"
        constraints: ">= 0"
      - name: stories
        type: integer
        source: input
        description: "Building stories; >=3 triggers high-rise surcharge"
        constraints: ">= 1"
      - name: soft_wash_sqft
        type: number
        source: input
        description: "Exterior surface area eligible for soft-wash pressure washing"
        default: 0
        constraints: ">= 0"

  - name: Quote
    parent: null
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: input
        description: "FK -> Account.id; account the quote is for"
      - name: property_id
        type: string
        source: input
        description: "FK -> Property.id; property being quoted"
      - name: pricing_basis
        type: enum
        source: input
        description: "Quoting variant: PANE_COUNT or SQ_FT"
        constraints: "one of {PANE_COUNT, SQ_FT}"
      - name: addon_codes
        type: array
        source: input
        description: "Requested add-on codes; subset of {GUTTER, SCREEN, SOFT_WASH}"
        default: []
      - name: base_price_cents
        type: integer
        source: computed
        description: "Computed window-cleaning base per quote_amount calc (pricing_basis variant + high-rise surcharge)"
      - name: addon_total_cents
        type: integer
        source: computed
        description: "Computed sum of add-on charges per quote_amount calc"
      - name: quoted_total_cents
        type: integer
        source: computed
        description: "Computed: base_price_cents + addon_total_cents (pinned: round each component to whole cents, then sum)"
      - name: required_deposit_cents
        type: integer
        source: computed
        description: "Computed deposit per deposit_requirement calc; 0 when below threshold"
      - name: valid_until
        type: datetime
        source: input
        description: "ISO 8601 UTC; quote auto-expires when current clock passes this instant"
      - name: status
        type: enum
        source: system
        description: "DRAFT | SENT | ACCEPTED | DECLINED | EXPIRED | CONVERTED. Starts DRAFT."
        default: "DRAFT"
        constraints: "one of {DRAFT, SENT, ACCEPTED, DECLINED, EXPIRED, CONVERTED}"

  - name: ServiceAgreement
    parent: null
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: input
        description: "FK -> Account.id; owning account"
      - name: property_id
        type: string
        source: input
        description: "FK -> Property.id; serviced property"
      - name: quote_id
        type: string
        source: input
        description: "FK -> Quote.id; the ACCEPTED quote this agreement was converted from"
      - name: schedule_kind
        type: enum
        source: input
        description: "ONE_TIME or RECURRING"
        constraints: "one of {ONE_TIME, RECURRING}"
      - name: recurrence_interval_days
        type: integer
        source: input
        description: "Days between recurring visits; required when schedule_kind=RECURRING, ignored for ONE_TIME"
        constraints: ">= 7 when RECURRING"
      - name: per_visit_price_cents
        type: integer
        source: computed
        description: "Snapshot of quote.quoted_total_cents at conversion; charged per completed visit"
      - name: required_deposit_cents
        type: integer
        source: computed
        description: "Snapshot of quote.required_deposit_cents at conversion"
      - name: visits_generated_count
        type: integer
        source: computed
        description: "Count of Visit rows generated for this agreement. Starts 0."
      - name: status
        type: enum
        source: system
        description: "PENDING_DEPOSIT | ACTIVE | PAUSED | COMPLETED | CANCELLED. Starts PENDING_DEPOSIT."
        default: "PENDING_DEPOSIT"
        constraints: "one of {PENDING_DEPOSIT, ACTIVE, PAUSED, COMPLETED, CANCELLED}"

  - name: Crew
    parent: null
    common_fields: true
    fields:
      - name: crew_name
        type: string
        source: input
        description: "Crew display name"
      - name: region_code
        type: enum
        source: input
        description: "Region this crew serves; must match Route.region_code"
        constraints: "one of {NORTH, SOUTH, EAST, WEST}"
      - name: skill_codes
        type: array
        source: input
        description: "Capabilities held; subset of {SOFT_WASH, HIGH_RISE}. A visit needing a skill the crew lacks cannot be dispatched on its route."
        default: []
      - name: daily_capacity_minutes
        type: integer
        source: input
        description: "Max booked service minutes per route day for this crew"
        constraints: "> 0"
      - name: status
        type: enum
        source: system
        description: "AVAILABLE | OFFLINE. Starts AVAILABLE."
        default: "AVAILABLE"
        constraints: "one of {AVAILABLE, OFFLINE}"

  - name: Route
    parent: null
    common_fields: true
    fields:
      - name: crew_id
        type: string
        source: input
        description: "FK -> Crew.id; crew assigned to run this route"
      - name: region_code
        type: enum
        source: input
        description: "Region served by this route; must equal crew.region_code"
        constraints: "one of {NORTH, SOUTH, EAST, WEST}"
      - name: service_date
        type: string
        source: input
        description: "Calendar date YYYY-MM-DD the route runs"
      - name: booked_minutes
        type: integer
        source: computed
        description: "Derived: sum of Visit.duration_minutes for visits committed to this route in schedule_status SCHEDULED|DISPATCHED|IN_PROGRESS|COMPLETED. Starts 0."
      - name: status
        type: enum
        source: system
        description: "PLANNING | DISPATCHED | CLOSED. Starts PLANNING."
        default: "PLANNING"
        constraints: "one of {PLANNING, DISPATCHED, CLOSED}"

  - name: Visit
    parent: null
    common_fields: true
    fields:
      - name: agreement_id
        type: string
        source: input
        description: "FK -> ServiceAgreement.id; agreement that generated this visit"
      - name: property_id
        type: string
        source: system
        description: "FK -> Property.id; copied from the agreement at generation"
      - name: route_id
        type: string
        source: input
        description: "FK -> Route.id; route this visit is committed to; null until committed"
      - name: planned_date
        type: string
        source: input
        description: "Calendar date YYYY-MM-DD the visit is planned for; must equal route.service_date when committed"
      - name: window_start_min
        type: integer
        source: input
        description: "Minutes-from-midnight start of the visit's service window on planned_date"
        constraints: "0 <= window_start_min < window_end_min"
      - name: window_end_min
        type: integer
        source: input
        description: "Minutes-from-midnight end of the visit's service window (half-open [start,end))"
        constraints: "window_start_min < window_end_min <= 1440"
      - name: duration_minutes
        type: integer
        source: computed
        description: "Computed: window_end_min - window_start_min; counts toward route.booked_minutes"
      - name: requires_soft_wash
        type: boolean
        source: computed
        description: "True when the source quote.addon_codes contains SOFT_WASH; gates crew SOFT_WASH skill"
      - name: requires_high_rise
        type: boolean
        source: computed
        description: "True when property.stories >= 3; gates crew HIGH_RISE skill"
      - name: reschedule_count
        type: integer
        source: computed
        description: "Number of weather reschedules applied to this visit. Starts 0."
      - name: charge_amount_cents
        type: integer
        source: computed
        description: "Final per-visit charge stamped at completion per visit_charge calc (may differ from agreement.per_visit_price_cents)"
      - name: schedule_status
        type: enum
        source: system
        description: "UNSCHEDULED | SCHEDULED | DISPATCHED | IN_PROGRESS | COMPLETED | CANCELLED. Starts UNSCHEDULED. Independent of billing_status."
        default: "UNSCHEDULED"
        constraints: "one of {UNSCHEDULED, SCHEDULED, DISPATCHED, IN_PROGRESS, COMPLETED, CANCELLED}"
      - name: billing_status
        type: enum
        source: system
        description: "UNBILLED | INVOICED | PAID | WAIVED. Starts UNBILLED. Evolves independently of schedule_status."
        default: "UNBILLED"
        constraints: "one of {UNBILLED, INVOICED, PAID, WAIVED}"

  - name: VisitAddOn
    parent: null
    common_fields: true
    fields:
      - name: visit_id
        type: string
        source: input
        description: "FK -> Visit.id; visit this add-on is attached to"
      - name: addon_code
        type: enum
        source: input
        description: "GUTTER | SCREEN | SOFT_WASH"
        constraints: "one of {GUTTER, SCREEN, SOFT_WASH}"
      - name: charge_cents
        type: integer
        source: computed
        description: "Computed at attach time over the visit's Property, mirroring quote_amount add-on rules: GUTTER=GUTTER_FLAT_CENTS(7500); SCREEN=SCREEN_PER_PANE_CENTS(150)*property.pane_count; SOFT_WASH=max(round_half_up(property.soft_wash_sqft*SOFT_WASH_RATE_CENTS(25)), SOFT_WASH_MIN_CENTS(12000))"

  - name: VisitPhoto
    parent: Visit
    common_fields: false
    fields:
      - name: visit_id
        type: string
        source: input
        description: "FK -> Visit.id; visit this photo documents"
      - name: phase
        type: enum
        source: input
        description: "BEFORE or AFTER"
        constraints: "one of {BEFORE, AFTER}"
      - name: image_uri
        type: string
        source: input
        description: "Opaque URI of the uploaded image"

  - name: ReCleanRequest
    parent: null
    common_fields: true
    fields:
      - name: visit_id
        type: string
        source: input
        description: "FK -> Visit.id; the COMPLETED visit the customer is dissatisfied with"
      - name: reason
        type: string
        source: input
        description: "Free-text dissatisfaction reason"
      - name: remedy_visit_id
        type: string
        source: computed
        description: "FK -> Visit.id; the no-charge remedy Visit synthesized on approval; null until approved"
      - name: credit_cents
        type: integer
        source: computed
        description: "Goodwill credit posted to the account on approval per reclean_credit calc; 0 until approved"
      - name: status
        type: enum
        source: system
        description: "REQUESTED | APPROVED | DENIED | RESOLVED. Starts REQUESTED."
        default: "REQUESTED"
        constraints: "one of {REQUESTED, APPROVED, DENIED, RESOLVED}"

  - name: Invoice
    parent: null
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: system
        description: "FK -> Account.id; billed account, copied from the visit's agreement"
      - name: visit_id
        type: string
        source: input
        description: "FK -> Visit.id; the COMPLETED visit being billed (one invoice per visit)"
        constraints: "unique across Invoice"
      - name: amount_cents
        type: integer
        source: computed
        description: "Snapshot of visit.charge_amount_cents at invoice creation"
      - name: deposit_applied_cents
        type: integer
        source: computed
        description: "Portion of the agreement's HELD deposit applied to this invoice per invoice_settlement calc"
      - name: net_due_cents
        type: integer
        source: computed
        description: "Computed: amount_cents - deposit_applied_cents (floored at 0)"
      - name: status
        type: enum
        source: system
        description: "ISSUED | PAID | VOID. Starts ISSUED."
        default: "ISSUED"
        constraints: "one of {ISSUED, PAID, VOID}"

  - name: Deposit
    parent: null
    common_fields: true
    fields:
      - name: account_id
        type: string
        source: input
        description: "FK -> Account.id; account posting the deposit"
      - name: agreement_id
        type: string
        source: input
        description: "FK -> ServiceAgreement.id; agreement the deposit secures"
      - name: amount_cents
        type: integer
        source: input
        description: "Deposit amount posted, in cents"
        constraints: "> 0"
      - name: status
        type: enum
        source: system
        description: "HELD | APPLIED | REFUNDED. Starts HELD."
        default: "HELD"
        constraints: "one of {HELD, APPLIED, REFUNDED}"

  - name: WeatherAdvisory
    parent: null
    common_fields: true
    fields:
      - name: region_code
        type: enum
        source: input
        description: "Region the advisory covers; matched against route.region_code on weather-reschedule"
        constraints: "one of {NORTH, SOUTH, EAST, WEST}"
      - name: advisory_date
        type: string
        source: input
        description: "Calendar date YYYY-MM-DD the advisory covers; matched against visit.planned_date"
      - name: severity
        type: enum
        source: input
        description: "ADVISORY (informational) or SUSPEND (gates weather-reschedule eligibility)"
        constraints: "one of {ADVISORY, SUSPEND}"

  - name: LedgerEntry
    parent: null
    common_fields: false
    fields:
      - name: account_id
        type: string
        source: input
        description: "FK -> Account.id; account this entry posts against"
      - name: source_type
        type: enum
        source: input
        description: "Polymorphic origin: INVOICE | PAYMENT | DEPOSIT | RECLEAN_CREDIT"
        constraints: "one of {INVOICE, PAYMENT, DEPOSIT, RECLEAN_CREDIT}"
      - name: source_id
        type: string
        source: input
        description: "Id of the originating Invoice|Payment|Deposit|ReCleanRequest row (polymorphic, resolved by source_type)"
      - name: signed_amount_cents
        type: integer
        source: input
        description: "Signed cents: +debit raises balance owed; -credit lowers it. Summed into Account.balance_cents."

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  # ---- Quote: branching lifecycle -------------------------------------------
  - entity: Quote
    initial_state: DRAFT
    terminal_states: [DECLINED, EXPIRED, CONVERTED]
    transitions:
      - from: DRAFT
        to: SENT
        trigger: "POST /quotes/{id}/send"
        actor: Customer
        preconditions:
          - "quote.status == DRAFT"
        side_effects:
          - "Freezes base_price_cents, addon_total_cents, quoted_total_cents, required_deposit_cents (recomputed at send time, then immutable)"
      - from: SENT
        to: ACCEPTED
        trigger: "POST /quotes/{id}/accept"
        actor: Customer
        preconditions:
          - "quote.status == SENT"
          - "current clock < quote.valid_until (else ERR_QUOTE_EXPIRED)"
        side_effects: []
      - from: SENT
        to: DECLINED
        trigger: "POST /quotes/{id}/decline"
        actor: Customer
        preconditions:
          - "quote.status == SENT"
        side_effects: []
      - from: [DRAFT, SENT]
        to: EXPIRED
        trigger: "system: lazily on any read/transition when current clock >= quote.valid_until"
        actor: system
        preconditions:
          - "current clock >= quote.valid_until"
        side_effects: []
      - from: ACCEPTED
        to: CONVERTED
        trigger: "POST /service-agreements (with quote_id)"
        actor: Customer
        preconditions:
          - "quote.status == ACCEPTED"
        side_effects:
          - "Creates ServiceAgreement in PENDING_DEPOSIT"
          - "ServiceAgreement.per_visit_price_cents := quote.quoted_total_cents"
          - "ServiceAgreement.required_deposit_cents := quote.required_deposit_cents"

  # ---- ServiceAgreement: cyclic (ACTIVE <-> PAUSED) --------------------------
  - entity: ServiceAgreement
    initial_state: PENDING_DEPOSIT
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: PENDING_DEPOSIT
        to: ACTIVE
        trigger: "POST /service-agreements/{id}/activate"
        actor: Billing
        preconditions:
          - "agreement.status == PENDING_DEPOSIT"
          - "account.deposit_held_cents (for this agreement) >= agreement.required_deposit_cents (else ERR_DEPOSIT_NOT_MET)"
        side_effects:
          - "Quote.status DRAFT/SENT/ACCEPTED guard already satisfied; no quote change"
          - "Agreement becomes eligible for visit generation"
      - from: ACTIVE
        to: PAUSED
        trigger: "POST /service-agreements/{id}/pause"
        actor: Customer
        preconditions:
          - "agreement.status == ACTIVE"
        side_effects:
          - "All this agreement's Visits in schedule_status SCHEDULED -> CANCELLED (route.booked_minutes decremented for each)"
        note: "PAUSED can return to ACTIVE — cyclic."
      - from: PAUSED
        to: ACTIVE
        trigger: "POST /service-agreements/{id}/resume"
        actor: Customer
        preconditions:
          - "agreement.status == PAUSED"
        side_effects: []
        note: "Completes the ACTIVE<->PAUSED cycle."
      - from: ACTIVE
        to: COMPLETED
        trigger: "POST /service-agreements/{id}/complete"
        actor: Billing
        preconditions:
          - "agreement.status == ACTIVE"
          - "schedule_kind == ONE_TIME with its single Visit in schedule_status COMPLETED, OR schedule_kind == RECURRING with no Visit in schedule_status SCHEDULED|DISPATCHED|IN_PROGRESS (else ERR_OPEN_VISITS_EXIST)"
        side_effects:
          - "Each HELD Deposit for this agreement -> REFUNDED; refund LedgerEntry (source_type=DEPOSIT, source_id=Deposit.id, signed_amount_cents = -amount_cents) posted; account.balance_cents and account.deposit_held_cents recomputed"
      - from: [PENDING_DEPOSIT, ACTIVE, PAUSED]
        to: CANCELLED
        trigger: "POST /service-agreements/{id}/cancel"
        actor: Customer
        preconditions:
          - "agreement.status in {PENDING_DEPOSIT, ACTIVE, PAUSED}"
        side_effects:
          - "All this agreement's Visits in schedule_status SCHEDULED|UNSCHEDULED -> CANCELLED (route.booked_minutes decremented for each that was on a route)"
          - "Each HELD Deposit for this agreement -> REFUNDED; refund LedgerEntry (source_type=DEPOSIT, signed_amount_cents = -amount_cents) posted; account.balance_cents and account.deposit_held_cents recomputed"

  # ---- Route: planning -> dispatched -> closed ------------------------------
  - entity: Route
    initial_state: PLANNING
    terminal_states: [CLOSED]
    transitions:
      - from: PLANNING
        to: DISPATCHED
        trigger: "POST /routes/{id}/dispatch"
        actor: Dispatcher
        preconditions:
          - "route.status == PLANNING"
          - "crew.status == AVAILABLE (else ERR_CREW_OFFLINE)"
          - "at least one Visit committed (schedule_status SCHEDULED) to this route (else ERR_EMPTY_ROUTE)"
        side_effects:
          - "Every committed Visit in schedule_status SCHEDULED -> DISPATCHED (cascade)"
      - from: DISPATCHED
        to: CLOSED
        trigger: "POST /routes/{id}/close"
        actor: Dispatcher
        preconditions:
          - "route.status == DISPATCHED"
          - "no committed Visit remains in schedule_status DISPATCHED or IN_PROGRESS (all must be COMPLETED or CANCELLED) (else ERR_OPEN_VISITS_EXIST)"
        side_effects: []

  # ---- Visit: PARALLEL dimensions (schedule_status × billing_status) --------
  - entity: Visit
    initial_state: UNSCHEDULED
    terminal_states: [CANCELLED]
    transitions:
      # --- schedule_status dimension ---
      - from: UNSCHEDULED
        to: SCHEDULED
        trigger: "POST /routes/{id}/visits (commit visit onto route)"
        actor: Dispatcher
        preconditions:
          - "visit.schedule_status == UNSCHEDULED"
          - "route.status == PLANNING (else ERR_ROUTE_NOT_PLANNING)"
          - "agreement.status == ACTIVE (else ERR_AGREEMENT_NOT_ACTIVE)"
          - "route.region_code == property.region_code via account (else ERR_REGION_MISMATCH)"
          - "visit.requires_soft_wash implies crew.skill_codes contains SOFT_WASH (else ERR_CREW_SKILL_MISSING)"
          - "visit.requires_high_rise implies crew.skill_codes contains HIGH_RISE (else ERR_CREW_SKILL_MISSING)"
          - "visit.planned_date == route.service_date (else ERR_DATE_MISMATCH)"
          - "route.booked_minutes + visit.duration_minutes <= crew.daily_capacity_minutes (else ERR_ROUTE_CAPACITY_EXCEEDED)"
          - "visit window [window_start_min, window_end_min) does not overlap any SCHEDULED|DISPATCHED|IN_PROGRESS visit already on this route (half-open; touching endpoints allowed) (else ERR_VISIT_WINDOW_OVERLAP)"
          - "OCC: expected_route_version == route.version (else ERR_STALE_ROUTE_VERSION)"
        side_effects:
          - "visit.route_id := route.id"
          - "route.booked_minutes recomputed (+= visit.duration_minutes)"
          - "increments Route.version by 1"
      - from: SCHEDULED
        to: DISPATCHED
        trigger: "system: POST /routes/{id}/dispatch cascades to each committed visit"
        actor: system
        preconditions:
          - "visit.schedule_status == SCHEDULED"
          - "route.status transitioning PLANNING -> DISPATCHED"
        side_effects: []
      - from: DISPATCHED
        to: IN_PROGRESS
        trigger: "POST /visits/{id}/start"
        actor: FieldCrew
        preconditions:
          - "visit.schedule_status == DISPATCHED"
          - "exactly one VisitPhoto with phase=BEFORE exists for this visit (else ERR_BEFORE_PHOTO_REQUIRED)"
        side_effects: []
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /visits/{id}/complete"
        actor: FieldCrew
        preconditions:
          - "visit.schedule_status == IN_PROGRESS"
          - "at least one VisitPhoto with phase=AFTER exists for this visit (else ERR_AFTER_PHOTO_REQUIRED)"
        side_effects:
          - "visit.charge_amount_cents stamped via visit_charge calc"
          - "agreement.visits_generated_count unchanged; if RECURRING, system generates the next Visit (UNSCHEDULED) at planned_date + recurrence_interval_days and increments agreement.visits_generated_count"
      - from: SCHEDULED
        to: SCHEDULED
        trigger: "POST /visits/{id}/weather-reschedule"
        actor: Dispatcher
        preconditions:
          - "visit.schedule_status == SCHEDULED"
          - "a WeatherAdvisory with severity=SUSPEND and region_code == route.region_code covers the visit's planned_date (else ERR_NO_WEATHER_HOLD)"
        side_effects:
          - "old route.booked_minutes recomputed (-= visit.duration_minutes); visit.route_id := null; visit.schedule_status := UNSCHEDULED"
          - "visit.planned_date := new_planned_date (re-targets the visit to the rescheduled date)"
          - "visit.reschedule_count += 1"
        note: "Self-loop on schedule dimension (SCHEDULED -> SCHEDULED conceptually via UNSCHEDULED re-commit); models the weather-reschedule cycle. New commit onto a future-date route (whose service_date == new_planned_date) re-enters SCHEDULED."
      - from: [UNSCHEDULED, SCHEDULED]
        to: CANCELLED
        trigger: "POST /visits/{id}/cancel"
        actor: Dispatcher
        preconditions:
          - "visit.schedule_status in {UNSCHEDULED, SCHEDULED}"
        side_effects:
          - "if visit.route_id not null: route.booked_minutes recomputed (-= visit.duration_minutes); visit.route_id := null"
      # --- billing_status dimension (independent of schedule_status) ---
      - from: UNBILLED
        to: INVOICED
        trigger: "POST /invoices (with visit_id)"
        actor: Billing
        preconditions:
          - "visit.billing_status == UNBILLED"
          - "visit.schedule_status == COMPLETED (else ERR_VISIT_NOT_COMPLETED)"
        side_effects:
          - "Creates Invoice (amount_cents := visit.charge_amount_cents)"
          - "invoice_settlement calc applies deposit; LedgerEntry INVOICE debit (+net_due_cents) and, if applied, DEPOSIT credit posted; account.balance_cents recomputed"
        note: "billing_status dimension; schedule_status stays COMPLETED throughout."
      - from: INVOICED
        to: PAID
        trigger: "POST /invoices/{id}/pay"
        actor: Billing
        preconditions:
          - "visit.billing_status == INVOICED"
        side_effects:
          - "Invoice.status -> PAID; LedgerEntry PAYMENT credit (-net_due_cents) posted; account.balance_cents recomputed"
      - from: UNBILLED
        to: WAIVED
        trigger: "system: ReCleanRequest approval for this visit"
        actor: system
        preconditions:
          - "visit.billing_status == UNBILLED"
        side_effects:
          - "billing waived for the unsatisfactory visit; no Invoice will be raised"

  # ---- ReCleanRequest: branching --------------------------------------------
  - entity: ReCleanRequest
    initial_state: REQUESTED
    terminal_states: [DENIED, RESOLVED]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /reclean-requests/{id}/approve"
        actor: Billing
        preconditions:
          - "reclean.status == REQUESTED"
          - "the target Visit.schedule_status == COMPLETED (else ERR_VISIT_NOT_COMPLETED)"
        side_effects:
          - "credit_cents stamped via reclean_credit calc; LedgerEntry RECLEAN_CREDIT (signed -credit_cents) posted; account.balance_cents recomputed"
          - "if target visit.billing_status == UNBILLED -> WAIVED; if INVOICED, the matching Invoice -> VOID and its INVOICE debit reversed"
          - "synthesizes a no-charge remedy Visit (schedule_status UNSCHEDULED, charge waived) on the same agreement; remedy_visit_id := new Visit.id"
      - from: REQUESTED
        to: DENIED
        trigger: "POST /reclean-requests/{id}/deny"
        actor: Billing
        preconditions:
          - "reclean.status == REQUESTED"
        side_effects: []
      - from: APPROVED
        to: RESOLVED
        trigger: "system: remedy Visit reaches schedule_status COMPLETED"
        actor: system
        preconditions:
          - "reclean.status == APPROVED"
          - "remedy Visit.schedule_status == COMPLETED"
        side_effects: []

  # ---- Crew: availability toggle (cyclic) -----------------------------------
  - entity: Crew
    initial_state: AVAILABLE
    terminal_states: []
    transitions:
      - from: AVAILABLE
        to: OFFLINE
        trigger: "POST /crews/{id}/set-status (status=OFFLINE)"
        actor: Dispatcher
        preconditions:
          - "crew.status == AVAILABLE"
        side_effects: []
        note: "An OFFLINE crew blocks Route dispatch (cross-entity precondition on Route.PLANNING_to_DISPATCHED)."
      - from: OFFLINE
        to: AVAILABLE
        trigger: "POST /crews/{id}/set-status (status=AVAILABLE)"
        actor: Dispatcher
        preconditions:
          - "crew.status == OFFLINE"
        side_effects: []

  # ---- Deposit: HELD -> APPLIED | REFUNDED (driven by other entities) -------
  - entity: Deposit
    initial_state: HELD
    terminal_states: [APPLIED, REFUNDED]
    transitions:
      - from: HELD
        to: APPLIED
        trigger: "system: invoice_settlement fully consumes this deposit (POST /invoices)"
        actor: system
        preconditions:
          - "deposit.status == HELD"
          - "the deposit is fully consumed by an invoice (take == amount_cents) under invoice_settlement"
        side_effects:
          - "account.deposit_held_cents recomputed (this deposit no longer HELD)"
      - from: HELD
        to: REFUNDED
        trigger: "system: agreement complete or cancel"
        actor: system
        preconditions:
          - "deposit.status == HELD"
          - "owning agreement transitions to COMPLETED or CANCELLED"
        side_effects:
          - "refund LedgerEntry (source_type=DEPOSIT, signed -amount_cents) posted; account.balance_cents and deposit_held_cents recomputed"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: visit-commit-stale-route
    parent_entity: Route
    write_endpoint: "POST /routes/{id}/visits"
    occ_field: "expected_route_version"
    description: |
      Committing a Visit onto a Route whose version has advanced since the
      client last observed it is rejected. A prior commit (which legitimately
      consumed capacity and bumped route.version) leaves the current writer's
      view of the route stale, so its capacity/overlap reasoning is computed
      against an outdated booked_minutes snapshot.
    error_id: ERR_STALE_ROUTE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  # ---- (A) quote amount: DUAL-VARIANT (pane-count vs sq-ft) + combinatorial --
  - name: quote_amount
    trigger: "POST /quotes (create), recomputed and frozen on POST /quotes/{id}/send"
    algorithm: tiered_pricing
    input_set: "The quote's pricing_basis, the linked Property (pane_count, glass_sqft, stories, soft_wash_sqft), and addon_codes."
    formula: |
      # --- base window-cleaning price (variant selected by pricing_basis) ---
      if pricing_basis == PANE_COUNT:
          # marginal tiered per-pane rate
          n = property.pane_count
          base = 0
          base += min(n, 20)            * PANE_RATE_T1_CENTS          # first 20 panes
          base += min(max(n-20,0), 30)  * PANE_RATE_T2_CENTS          # panes 21..50
          base += max(n-50, 0)          * PANE_RATE_T3_CENTS          # panes 51+
          base = max(base, MIN_JOB_CENTS)
      else:  # SQ_FT
          base = ceil(property.glass_sqft) * SQFT_RATE_CENTS          # whole-sqft, round area UP first
          base = max(base, MIN_JOB_CENTS)
      # --- high-rise surcharge (combinatorial: threshold on stories, % of base) ---
      if property.stories >= HIGH_RISE_STORY_THRESHOLD:    # >= 3
          base = base + round_half_up(base * HIGH_RISE_SURCHARGE_PCT)   # round surcharge to whole cents
      base_price_cents = base
      # --- add-ons (each rounded to whole cents independently, THEN summed) ---
      addon_total_cents = 0
      if GUTTER in addon_codes:   addon_total_cents += GUTTER_FLAT_CENTS
      if SCREEN in addon_codes:   addon_total_cents += SCREEN_PER_PANE_CENTS * property.pane_count
      if SOFT_WASH in addon_codes:
          sw = round_half_up(property.soft_wash_sqft * SOFT_WASH_RATE_CENTS)   # per-line rounding
          addon_total_cents += max(sw, SOFT_WASH_MIN_CENTS)
      # PIN: round each component (base_price_cents, addon_total_cents) to whole
      # cents BEFORE summing — "round per-line then sum", never "sum then round".
      quoted_total_cents = base_price_cents + addon_total_cents
    constants:
      PANE_RATE_T1_CENTS: 300
      PANE_RATE_T2_CENTS: 250
      PANE_RATE_T3_CENTS: 200
      SQFT_RATE_CENTS: 90
      MIN_JOB_CENTS: 9900
      HIGH_RISE_STORY_THRESHOLD: 3
      HIGH_RISE_SURCHARGE_PCT: 0.20
      GUTTER_FLAT_CENTS: 7500
      SCREEN_PER_PANE_CENTS: 150
      SOFT_WASH_RATE_CENTS: 25
      SOFT_WASH_MIN_CENTS: 12000
    precision: "all monetary values in integer cents; round_half_up applied per component (surcharge, soft-wash line) before summing"
    variants:
      - name: pane_count_basis
        when: "quote.pricing_basis == PANE_COUNT"
        difference: "Base derived from marginal tiered per-pane rates over pane_count; ignores glass_sqft entirely."
      - name: sqft_basis
        when: "quote.pricing_basis == SQ_FT"
        difference: "Base derived from ceil(glass_sqft) * SQFT_RATE_CENTS; ignores pane_count entirely. Same inputs (a property with both fields populated) yield a different quoted_total than pane_count_basis."

  # ---- (B) deposit requirement: threshold on quote total --------------------
  - name: deposit_requirement
    trigger: "Computed on POST /quotes and frozen on POST /quotes/{id}/send; snapshotted onto ServiceAgreement at conversion"
    algorithm: threshold
    input_set: "The quote's quoted_total_cents."
    formula: |
      if quoted_total_cents >= DEPOSIT_THRESHOLD_CENTS:        # >= (not >)
          required_deposit_cents = round_half_up(quoted_total_cents * DEPOSIT_PCT)
      else:
          required_deposit_cents = 0
    constants:
      DEPOSIT_THRESHOLD_CENTS: 30000
      DEPOSIT_PCT: 0.25
    precision: "integer cents, round_half_up"

  # ---- (C) visit charge: DUAL-VARIANT vs the agreement snapshot -------------
  - name: visit_charge
    trigger: "Stamped on POST /visits/{id}/complete (IN_PROGRESS -> COMPLETED)"
    algorithm: aggregation
    input_set: "agreement.per_visit_price_cents, the visit's attached VisitAddOn rows created/removed after generation, and visit.reschedule_count."
    formula: |
      # Actual charge can DIVERGE from agreement.per_visit_price_cents (the
      # estimate): add-ons attached/detached after generation change the line,
      # and a goodwill discount applies once a visit was weather-rescheduled 2+ times.
      base = agreement.per_visit_price_cents
      addon_delta = sum(VisitAddOn.charge_cents for addon attached to this visit)
      gross = base + addon_delta
      if visit.reschedule_count >= RESCHEDULE_DISCOUNT_THRESHOLD:    # >= 2
          gross = gross - round_half_up(gross * RESCHEDULE_DISCOUNT_PCT)
      charge_amount_cents = max(gross, 0)
    constants:
      RESCHEDULE_DISCOUNT_THRESHOLD: 2
      RESCHEDULE_DISCOUNT_PCT: 0.10
    precision: "integer cents, round_half_up on the discount line"
    variants:
      - name: estimate_at_generation
        when: "Visit just generated from agreement; not yet completed"
        difference: "Estimate equals agreement.per_visit_price_cents (the quote snapshot); add-ons and reschedule discount not yet reflected."
      - name: actual_at_completion
        when: "Visit transitions IN_PROGRESS -> COMPLETED"
        difference: "Actual includes post-generation add-on deltas and the reschedule goodwill discount; same visit can complete at a different cents value than its estimate."

  # ---- (D) invoice settlement: waterfall of deposit against the invoice -----
  - name: invoice_settlement
    trigger: "POST /invoices (UNBILLED -> INVOICED for the visit)"
    algorithm: waterfall_allocation
    input_set: "The visit's amount (visit.charge_amount_cents) and the agreement's HELD Deposits ordered by Deposit.created_at ASC."
    formula: |
      # Waterfall: consume HELD deposits oldest-first against this invoice's
      # amount; never apply more than the invoice amount; leftover deposit stays HELD.
      remaining = invoice.amount_cents
      applied = 0
      for dep in HELD deposits of this agreement ordered by created_at ASC:
          take = min(dep.amount_cents, remaining)
          applied += take
          remaining -= take
          if take == dep.amount_cents: dep.status := APPLIED
          # partial consumption leaves the deposit HELD with reduced effective balance tracked via APPLIED ledger
          if remaining == 0: break
      deposit_applied_cents = applied
      net_due_cents = invoice.amount_cents - deposit_applied_cents      # >= 0 by construction
    constants: {}
    precision: "integer cents; no rounding (pure integer subtraction)"

  # ---- (E) reclean credit: combinatorial branch on photo evidence -----------
  - name: reclean_credit
    trigger: "POST /reclean-requests/{id}/approve (REQUESTED -> APPROVED)"
    algorithm: threshold
    input_set: "The target visit's charge_amount_cents and the count of AFTER-phase VisitPhoto rows on file for that visit."
    formula: |
      # Goodwill credit, keyed on AFTER-photo documentation density.
      # A completed visit always has >= 1 AFTER photo (required to complete).
      # Well-documented work (>= 2 AFTER photos) earns only a partial credit;
      # thinly-documented work (exactly 1 AFTER photo) earns a full credit.
      v = target visit
      after_n = count(VisitPhoto where visit_id == v.id and phase == AFTER)
      if after_n >= AFTER_PHOTO_DOC_THRESHOLD:        # >= 2 -> partial
          credit_cents = round_half_up(v.charge_amount_cents * PARTIAL_CREDIT_PCT)
      else:                                            # exactly 1 -> full
          credit_cents = v.charge_amount_cents
    constants:
      AFTER_PHOTO_DOC_THRESHOLD: 2
      PARTIAL_CREDIT_PCT: 0.50
    precision: "integer cents, round_half_up"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "X-User-Role is permitted for the requested operation per §1.7"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Every path/body referenced resource exists, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"

  - priority: 4
    category: business_referential
    check: "FK targets resolve and belong together (Quote.property_id.account_id == Quote.account_id; Visit.agreement_id resolves; Route.crew_id resolves)"
    error_id: ERR_REFERENTIAL_MISMATCH
    http_status: 422
    applies_to: "POST /quotes, POST /service-agreements, POST /routes/{id}/visits, POST /invoices"

  - priority: 5
    category: state
    check: "Target resource is in a state from which the requested transition is defined (§1.2)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"

  - priority: 6
    category: state
    check: "Acting on an ACCEPTED quote past valid_until: quote is treated as EXPIRED"
    error_id: ERR_QUOTE_EXPIRED
    http_status: 409
    applies_to: "POST /quotes/{id}/accept, POST /service-agreements"

  - priority: 7
    category: state
    check: "Committing a visit requires its agreement in ACTIVE"
    error_id: ERR_AGREEMENT_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /routes/{id}/visits"

  - priority: 8
    category: state
    check: "Committing a visit requires the route in PLANNING"
    error_id: ERR_ROUTE_NOT_PLANNING
    http_status: 409
    applies_to: "POST /routes/{id}/visits"

  - priority: 9
    category: state
    check: "Invoicing requires the visit's schedule_status == COMPLETED"
    error_id: ERR_VISIT_NOT_COMPLETED
    http_status: 409
    applies_to: "POST /invoices, POST /reclean-requests/{id}/approve"

  - priority: 10
    category: state
    check: "Dispatching a route requires its crew AVAILABLE"
    error_id: ERR_CREW_OFFLINE
    http_status: 409
    applies_to: "POST /routes/{id}/dispatch"

  - priority: 11
    category: business_safety
    check: "Crew must hold every skill a committed visit requires (SOFT_WASH, HIGH_RISE)"
    error_id: ERR_CREW_SKILL_MISSING
    http_status: 422
    applies_to: "POST /routes/{id}/visits"

  - priority: 12
    category: business_safety
    check: "Starting a visit requires a BEFORE photo; completing requires an AFTER photo"
    error_id: ERR_BEFORE_PHOTO_REQUIRED
    http_status: 422
    applies_to: "POST /visits/{id}/start, POST /visits/{id}/complete"

  - priority: 13
    category: business_constraint
    check: "Visit's region (via account.region_code) must equal the route's region_code"
    error_id: ERR_REGION_MISMATCH
    http_status: 422
    applies_to: "POST /routes/{id}/visits"

  - priority: 14
    category: business_constraint
    check: "Visit.planned_date must equal route.service_date on commit"
    error_id: ERR_DATE_MISMATCH
    http_status: 422
    applies_to: "POST /routes/{id}/visits"

  - priority: 15
    category: business_temporal
    check: "Visit service window [start,end) must not overlap any SCHEDULED|DISPATCHED|IN_PROGRESS visit already on the route (half-open; shared endpoints OK)"
    error_id: ERR_VISIT_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /routes/{id}/visits"

  - priority: 16
    category: business_temporal
    check: "Weather-reschedule requires an active SUSPEND WeatherAdvisory covering the visit's planned_date and region"
    error_id: ERR_NO_WEATHER_HOLD
    http_status: 409
    applies_to: "POST /visits/{id}/weather-reschedule"

  - priority: 17
    category: business_fiscal
    check: "Committing a visit must not push route.booked_minutes + duration over crew.daily_capacity_minutes"
    error_id: ERR_ROUTE_CAPACITY_EXCEEDED
    http_status: 422
    applies_to: "POST /routes/{id}/visits"

  - priority: 18
    category: business_fiscal
    check: "Activating an agreement requires HELD deposits >= required_deposit_cents"
    error_id: ERR_DEPOSIT_NOT_MET
    http_status: 422
    applies_to: "POST /service-agreements/{id}/activate"

  - priority: 19
    category: business_constraint
    check: "An Invoice already exists for this visit (one invoice per visit)"
    error_id: ERR_DUPLICATE_INVOICE
    http_status: 409
    applies_to: "POST /invoices"

  - priority: 20
    category: state
    check: "OCC: expected_route_version must equal route.version on visit commit"
    error_id: ERR_STALE_ROUTE_VERSION
    http_status: 412
    applies_to: "POST /routes/{id}/visits"

  - priority: 21
    category: business_constraint
    check: "Closing a route / completing an agreement requires no open (non-terminal) committed visits"
    error_id: ERR_OPEN_VISITS_EXIST
    http_status: 409
    applies_to: "POST /routes/{id}/close, POST /service-agreements/{id}/complete"

  - priority: 22
    category: business_constraint
    check: "Dispatching a route with zero committed visits is rejected"
    error_id: ERR_EMPTY_ROUTE
    http_status: 422
    applies_to: "POST /routes/{id}/dispatch"

  - priority: 23
    category: business_temporal
    check: "A crew may hold at most one non-CLOSED Route per service_date (whole-day exclusivity; two routes for the same crew on the same calendar date collide regardless of any minute window)"
    error_id: ERR_CREW_DOUBLE_BOOKED
    http_status: 409
    applies_to: "POST /routes"

  - priority: 24
    category: business_constraint
    check: "Required body fields present and well-typed; enums in range; recurrence_interval_days present and >=7 when schedule_kind=RECURRING"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all create/transition endpoints"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:

  # ---- Account ----
  - method: POST
    path: "/accounts"
    description: "Create a customer account"
    roles: [Customer, Billing]
    code: 201
    input: [company_name, contact_email, region_code]
    output: Account
    side_effects: ["Account created in ACTIVE; balance_cents=0; deposit_held_cents=0"]
  - method: GET
    path: "/accounts/{id}"
    description: "Read an account (balance_cents and deposit_held_cents derived live)"
    roles: [Customer, Billing, Dispatcher]
    code: 200
    input: []
    output: Account
    side_effects: []
  - method: GET
    path: "/accounts/{id}/ledger-entries"
    description: "List ledger entries for an account (reverse-reachability for LedgerEntry.account_id)"
    roles: [Billing, Customer]
    code: 200
    input: ["limit?", "offset?"]
    output: LedgerEntry[]
    side_effects: []
  - method: GET
    path: "/accounts/{id}/properties"
    description: "List properties of an account (reverse-reachability for Property.account_id)"
    roles: [Customer, Billing, Dispatcher]
    code: 200
    input: ["limit?", "offset?"]
    output: Property[]
    side_effects: []
  - method: GET
    path: "/accounts/{id}/deposits"
    description: "List deposits posted on an account (reverse-reachability for Deposit.account_id)"
    roles: [Billing, Customer]
    code: 200
    input: ["limit?", "offset?"]
    output: Deposit[]
    side_effects: []
  - method: GET
    path: "/accounts/{id}/invoices"
    description: "List invoices billed to an account (reverse-reachability for Invoice.account_id)"
    roles: [Billing, Customer]
    code: 200
    input: ["limit?", "offset?"]
    output: Invoice[]
    side_effects: []
  - method: GET
    path: "/accounts/{id}/service-agreements"
    description: "List agreements of an account (reverse-reachability for ServiceAgreement.account_id)"
    roles: [Customer, Billing]
    code: 200
    input: ["limit?", "offset?"]
    output: ServiceAgreement[]
    side_effects: []
  - method: GET
    path: "/accounts/{id}/quotes"
    description: "List quotes of an account (reverse-reachability for Quote.account_id)"
    roles: [Customer, Billing]
    code: 200
    input: ["limit?", "offset?"]
    output: Quote[]
    side_effects: []

  # ---- Property ----
  - method: POST
    path: "/properties"
    description: "Register a property under an account"
    roles: [Customer, Billing]
    code: 201
    input: [account_id, address_line, pane_count, glass_sqft, stories, "soft_wash_sqft?"]
    output: Property
    side_effects: []
  - method: GET
    path: "/properties/{id}"
    description: "Read a property"
    roles: [Customer, Billing, Dispatcher]
    code: 200
    input: []
    output: Property
    side_effects: []

  # ---- Quote ----
  - method: POST
    path: "/quotes"
    description: "Create a DRAFT quote; computes base/addon/total/deposit via quote_amount + deposit_requirement"
    roles: [Customer, Billing]
    code: 201
    input: [account_id, property_id, pricing_basis, "addon_codes?", valid_until]
    output: Quote
    side_effects: ["quote_amount + deposit_requirement computed; status DRAFT"]
  - method: GET
    path: "/quotes"
    description: "List quotes; filterable by property_id or account_id (reverse-reachability for Quote.property_id)"
    roles: [Customer, Billing]
    code: 200
    input: ["property_id?", "account_id?", "limit?", "offset?"]
    output: Quote[]
    side_effects: []
  - method: GET
    path: "/quotes/{id}"
    description: "Read a quote (lazily expires if clock past valid_until)"
    roles: [Customer, Billing]
    code: 200
    input: []
    output: Quote
    side_effects: ["lazy EXPIRED transition if clock >= valid_until and status in {DRAFT,SENT}"]
  - method: POST
    path: "/quotes/{id}/send"
    description: "DRAFT -> SENT; freezes priced fields"
    roles: [Customer, Billing]
    code: 200
    input: []
    output: Quote
    side_effects: ["recompute then freeze base_price_cents, addon_total_cents, quoted_total_cents, required_deposit_cents"]
  - method: POST
    path: "/quotes/{id}/accept"
    description: "SENT -> ACCEPTED"
    roles: [Customer]
    code: 200
    input: []
    output: Quote
    side_effects: []
  - method: POST
    path: "/quotes/{id}/decline"
    description: "SENT -> DECLINED"
    roles: [Customer]
    code: 200
    input: []
    output: Quote
    side_effects: []

  # ---- ServiceAgreement ----
  - method: POST
    path: "/service-agreements"
    description: "Convert an ACCEPTED quote into an agreement (quote -> CONVERTED); agreement starts PENDING_DEPOSIT"
    roles: [Customer, Billing]
    code: 201
    input: [quote_id, schedule_kind, "recurrence_interval_days?"]
    output: ServiceAgreement
    side_effects: ["Quote ACCEPTED -> CONVERTED", "per_visit_price_cents/required_deposit_cents snapshotted from quote", "account_id/property_id copied from quote"]
  - method: GET
    path: "/service-agreements"
    description: "List agreements; filterable by property_id or quote_id (reverse-reachability for ServiceAgreement.property_id and ServiceAgreement.quote_id)"
    roles: [Customer, Billing, Dispatcher]
    code: 200
    input: ["property_id?", "quote_id?", "limit?", "offset?"]
    output: ServiceAgreement[]
    side_effects: []
  - method: GET
    path: "/service-agreements/{id}"
    description: "Read an agreement"
    roles: [Customer, Billing, Dispatcher]
    code: 200
    input: []
    output: ServiceAgreement
    side_effects: []
  - method: GET
    path: "/service-agreements/{id}/visits"
    description: "List visits generated by an agreement (reverse-reachability for Visit.agreement_id)"
    roles: [Customer, Billing, Dispatcher]
    code: 200
    input: ["limit?", "offset?"]
    output: Visit[]
    side_effects: []
  - method: GET
    path: "/service-agreements/{id}/deposits"
    description: "List deposits securing an agreement (reverse-reachability for Deposit.agreement_id)"
    roles: [Billing, Customer]
    code: 200
    input: ["limit?", "offset?"]
    output: Deposit[]
    side_effects: []
  - method: POST
    path: "/service-agreements/{id}/activate"
    description: "PENDING_DEPOSIT -> ACTIVE; requires deposit met; generates first Visit (UNSCHEDULED)"
    roles: [Billing]
    code: 200
    input: [first_visit_planned_date, first_visit_window_start_min, first_visit_window_end_min]
    output: ServiceAgreement
    side_effects: ["generates first Visit (UNSCHEDULED) for the agreement's property", "agreement.visits_generated_count := 1"]
  - method: POST
    path: "/service-agreements/{id}/pause"
    description: "ACTIVE -> PAUSED; cancels this agreement's SCHEDULED visits"
    roles: [Customer]
    code: 200
    input: []
    output: ServiceAgreement
    side_effects: ["SCHEDULED visits -> CANCELLED with route.booked_minutes decrement"]
  - method: POST
    path: "/service-agreements/{id}/resume"
    description: "PAUSED -> ACTIVE (cycle)"
    roles: [Customer]
    code: 200
    input: []
    output: ServiceAgreement
    side_effects: []
  - method: POST
    path: "/service-agreements/{id}/complete"
    description: "ACTIVE -> COMPLETED; refunds HELD deposits"
    roles: [Billing]
    code: 200
    input: []
    output: ServiceAgreement
    side_effects: ["HELD deposits -> REFUNDED with credit LedgerEntry; account balances recomputed"]
  - method: POST
    path: "/service-agreements/{id}/cancel"
    description: "PENDING_DEPOSIT|ACTIVE|PAUSED -> CANCELLED; cancels open visits, refunds deposits"
    roles: [Customer]
    code: 200
    input: []
    output: ServiceAgreement
    side_effects: ["open visits -> CANCELLED with booked_minutes decrement", "HELD deposits -> REFUNDED with credit LedgerEntry"]

  # ---- Deposit ----
  - method: POST
    path: "/deposits"
    description: "Post a deposit on an account/agreement (HELD)"
    roles: [Billing, Customer]
    code: 201
    input: [account_id, agreement_id, amount_cents]
    output: Deposit
    side_effects: ["Deposit HELD; LedgerEntry DEPOSIT debit (+amount_cents) posted; account.deposit_held_cents and balance_cents recomputed"]
  - method: GET
    path: "/deposits/{id}"
    description: "Read a deposit"
    roles: [Billing, Customer]
    code: 200
    input: []
    output: Deposit
    side_effects: []

  # ---- Crew ----
  - method: POST
    path: "/crews"
    description: "Create a crew"
    roles: [Dispatcher]
    code: 201
    input: [crew_name, region_code, "skill_codes?", daily_capacity_minutes]
    output: Crew
    side_effects: []
  - method: GET
    path: "/crews/{id}"
    description: "Read a crew"
    roles: [Dispatcher, Billing]
    code: 200
    input: []
    output: Crew
    side_effects: []
  - method: POST
    path: "/crews/{id}/set-status"
    description: "Set crew AVAILABLE/OFFLINE"
    roles: [Dispatcher]
    code: 200
    input: [status]
    output: Crew
    side_effects: []

  # ---- Route ----
  - method: POST
    path: "/routes"
    description: "Create a PLANNING route for a crew on a date. Rejected if the crew already holds a non-CLOSED route on the same service_date (ERR_CREW_DOUBLE_BOOKED). region_code must equal crew.region_code."
    roles: [Dispatcher]
    code: 201
    input: [crew_id, region_code, service_date]
    output: Route
    side_effects: ["Route PLANNING; booked_minutes=0"]
  - method: GET
    path: "/routes"
    description: "List routes; filterable by crew_id or service_date (reverse-reachability for Route.crew_id)"
    roles: [Dispatcher, Billing]
    code: 200
    input: ["crew_id?", "service_date?", "limit?", "offset?"]
    output: Route[]
    side_effects: []
  - method: GET
    path: "/routes/{id}"
    description: "Read a route (booked_minutes derived)"
    roles: [Dispatcher, Billing]
    code: 200
    input: []
    output: Route
    side_effects: []
  - method: GET
    path: "/routes/{id}/visits"
    description: "List visits committed to a route (reverse-reachability for Visit.route_id)"
    roles: [Dispatcher, Billing, FieldCrew]
    code: 200
    input: ["limit?", "offset?"]
    output: Visit[]
    side_effects: []
  - method: POST
    path: "/routes/{id}/visits"
    description: "Commit an UNSCHEDULED visit onto this route (UNSCHEDULED -> SCHEDULED); OCC on route.version"
    roles: [Dispatcher]
    code: 201
    input: [visit_id, expected_route_version]
    output: Visit
    side_effects: ["visit.route_id set; visit.schedule_status SCHEDULED; route.booked_minutes recomputed; increments Route.version by 1"]
  - method: POST
    path: "/routes/{id}/dispatch"
    description: "PLANNING -> DISPATCHED; cascades committed visits SCHEDULED -> DISPATCHED"
    roles: [Dispatcher]
    code: 200
    input: []
    output: Route
    side_effects: ["each committed SCHEDULED visit -> DISPATCHED"]
  - method: POST
    path: "/routes/{id}/close"
    description: "DISPATCHED -> CLOSED; requires no open committed visits"
    roles: [Dispatcher]
    code: 200
    input: []
    output: Route
    side_effects: []

  # ---- Visit ----
  - method: GET
    path: "/visits"
    description: "List visits; filterable by property_id (reverse-reachability for Visit.property_id)"
    roles: [Customer, Billing, Dispatcher, FieldCrew]
    code: 200
    input: ["property_id?", "agreement_id?", "route_id?", "limit?", "offset?"]
    output: Visit[]
    side_effects: []
  - method: GET
    path: "/visits/{id}"
    description: "Read a visit (both status dimensions, charge_amount_cents, reschedule_count)"
    roles: [Customer, Billing, Dispatcher, FieldCrew]
    code: 200
    input: []
    output: Visit
    side_effects: []
  - method: GET
    path: "/visits/{id}/add-ons"
    description: "List add-ons attached to a visit (reverse-reachability for VisitAddOn.visit_id)"
    roles: [Customer, Billing, Dispatcher, FieldCrew]
    code: 200
    input: ["limit?", "offset?"]
    output: VisitAddOn[]
    side_effects: []
  - method: GET
    path: "/visits/{id}/photos"
    description: "List before/after photos of a visit (reverse-reachability for VisitPhoto.visit_id)"
    roles: [Customer, Billing, Dispatcher, FieldCrew]
    code: 200
    input: ["limit?", "offset?"]
    output: VisitPhoto[]
    side_effects: []
  - method: POST
    path: "/visits/{id}/add-ons"
    description: "Attach an add-on to a visit (computes charge_cents)"
    roles: [Dispatcher, FieldCrew]
    code: 201
    input: [addon_code]
    output: VisitAddOn
    side_effects: ["VisitAddOn.charge_cents computed; contributes to visit_charge actual at completion"]
  - method: POST
    path: "/visits/{id}/photos"
    description: "Upload a before/after photo for a visit"
    roles: [FieldCrew]
    code: 201
    input: [phase, image_uri]
    output: VisitPhoto
    side_effects: []
  - method: POST
    path: "/visits/{id}/start"
    description: "DISPATCHED -> IN_PROGRESS; requires BEFORE photo"
    roles: [FieldCrew]
    code: 200
    input: []
    output: Visit
    side_effects: []
  - method: POST
    path: "/visits/{id}/complete"
    description: "IN_PROGRESS -> COMPLETED; stamps charge_amount_cents; generates next recurring visit"
    roles: [FieldCrew]
    code: 200
    input: []
    output: Visit
    side_effects: ["charge_amount_cents stamped via visit_charge", "if RECURRING agreement, next Visit generated UNSCHEDULED and visits_generated_count incremented", "if visit is a re-clean remedy, its ReCleanRequest APPROVED -> RESOLVED"]
  - method: POST
    path: "/visits/{id}/weather-reschedule"
    description: "Weather hold: pulls a SCHEDULED visit off its route (route.booked_minutes decrement; back to UNSCHEDULED; reschedule_count++) and re-targets it to new_planned_date so it can be re-committed to a future-date route"
    roles: [Dispatcher]
    code: 200
    input: [new_planned_date]
    output: Visit
    side_effects: ["route.booked_minutes decremented; visit.route_id null; visit.schedule_status UNSCHEDULED; visit.planned_date := new_planned_date; reschedule_count += 1"]
  - method: POST
    path: "/visits/{id}/cancel"
    description: "UNSCHEDULED|SCHEDULED -> CANCELLED (decrements route.booked_minutes if committed)"
    roles: [Dispatcher]
    code: 200
    input: []
    output: Visit
    side_effects: ["route.booked_minutes decremented if committed"]

  # ---- WeatherAdvisory ----
  - method: POST
    path: "/weather-advisories"
    description: "Register a weather advisory for a region/date (gates weather-reschedule)"
    roles: [Dispatcher]
    code: 201
    input: [region_code, advisory_date, severity]
    output: WeatherAdvisory
    side_effects: []
  - method: GET
    path: "/weather-advisories/{id}"
    description: "Read a weather advisory"
    roles: [Dispatcher]
    code: 200
    input: []
    output: WeatherAdvisory
    side_effects: []

  # ---- Invoice ----
  - method: POST
    path: "/invoices"
    description: "Invoice a COMPLETED visit (UNBILLED -> INVOICED); applies deposit via invoice_settlement"
    roles: [Billing]
    code: 201
    input: [visit_id]
    output: Invoice
    side_effects: ["amount/deposit_applied/net_due computed; LedgerEntry INVOICE debit + DEPOSIT credit (if applied); account.balance_cents recomputed"]
  - method: GET
    path: "/invoices"
    description: "List invoices; filterable by visit_id (reverse-reachability for Invoice.visit_id)"
    roles: [Billing, Customer]
    code: 200
    input: ["visit_id?", "account_id?", "limit?", "offset?"]
    output: Invoice[]
    side_effects: []
  - method: GET
    path: "/invoices/{id}"
    description: "Read an invoice"
    roles: [Billing, Customer]
    code: 200
    input: []
    output: Invoice
    side_effects: []
  - method: POST
    path: "/invoices/{id}/pay"
    description: "INVOICED -> PAID for the visit; posts PAYMENT credit"
    roles: [Billing]
    code: 200
    input: []
    output: Invoice
    side_effects: ["Invoice PAID; visit.billing_status PAID; PAYMENT LedgerEntry posted; account.balance_cents recomputed"]

  # ---- ReCleanRequest ----
  - method: POST
    path: "/reclean-requests"
    description: "Customer requests a satisfaction re-clean for a COMPLETED visit"
    roles: [Customer]
    code: 201
    input: [visit_id, reason]
    output: ReCleanRequest
    side_effects: []
  - method: GET
    path: "/reclean-requests/{id}"
    description: "Read a re-clean request"
    roles: [Customer, Billing]
    code: 200
    input: []
    output: ReCleanRequest
    side_effects: []
  - method: GET
    path: "/visits/{id}/reclean-requests"
    description: "List re-clean requests for a visit (reverse-reachability for ReCleanRequest.visit_id)"
    roles: [Customer, Billing]
    code: 200
    input: ["limit?", "offset?"]
    output: ReCleanRequest[]
    side_effects: []
  - method: POST
    path: "/reclean-requests/{id}/approve"
    description: "REQUESTED -> APPROVED; posts credit, waives/voids billing, synthesizes remedy visit"
    roles: [Billing]
    code: 200
    input: []
    output: ReCleanRequest
    side_effects: ["credit_cents via reclean_credit; LedgerEntry RECLEAN_CREDIT", "visit billing WAIVED or invoice VOIDed", "remedy Visit synthesized UNSCHEDULED"]
  - method: POST
    path: "/reclean-requests/{id}/deny"
    description: "REQUESTED -> DENIED"
    roles: [Billing]
    code: 200
    input: []
    output: ReCleanRequest
    side_effects: []

  # ---- Test-driving: clock ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-only: set the server's current UTC instant (drives quote expiry)"
    roles: [Billing, Dispatcher]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["server clock set; subsequent lazy-expiry checks use this instant"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing/blank X-User-Role or X-User-ID header"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "Role not permitted for this operation per §1.7"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Referenced resource id does not exist"
  - id: ERR_REFERENTIAL_MISMATCH
    http: 422
    condition: "FK targets exist but do not belong together (e.g., quote.property_id.account_id != quote.account_id)"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Requested transition not defined from the resource's current state"
  - id: ERR_QUOTE_EXPIRED
    http: 409
    condition: "Accept/convert attempted on a quote whose valid_until has passed"
  - id: ERR_AGREEMENT_NOT_ACTIVE
    http: 409
    condition: "Visit commit attempted while agreement not ACTIVE"
  - id: ERR_ROUTE_NOT_PLANNING
    http: 409
    condition: "Visit commit attempted while route not in PLANNING"
  - id: ERR_VISIT_NOT_COMPLETED
    http: 409
    condition: "Invoice/re-clean approval attempted while visit.schedule_status != COMPLETED"
  - id: ERR_CREW_OFFLINE
    http: 409
    condition: "Dispatch attempted while crew is OFFLINE"
  - id: ERR_CREW_SKILL_MISSING
    http: 422
    condition: "Committed visit requires SOFT_WASH or HIGH_RISE skill the crew lacks"
  - id: ERR_BEFORE_PHOTO_REQUIRED
    http: 422
    condition: "Visit start attempted without a BEFORE photo"
  - id: ERR_AFTER_PHOTO_REQUIRED
    http: 422
    condition: "Visit complete attempted without an AFTER photo"
  - id: ERR_REGION_MISMATCH
    http: 422
    condition: "Visit's account region != route.region_code on commit"
  - id: ERR_DATE_MISMATCH
    http: 422
    condition: "visit.planned_date != route.service_date on commit"
  - id: ERR_VISIT_WINDOW_OVERLAP
    http: 409
    condition: "Visit window collides with an existing committed visit on the route (half-open)"
  - id: ERR_NO_WEATHER_HOLD
    http: 409
    condition: "Weather-reschedule with no active SUSPEND advisory for the visit's date/region"
  - id: ERR_ROUTE_CAPACITY_EXCEEDED
    http: 422
    condition: "Commit would push route.booked_minutes over crew.daily_capacity_minutes"
  - id: ERR_DEPOSIT_NOT_MET
    http: 422
    condition: "Activate attempted with HELD deposits below required_deposit_cents"
  - id: ERR_DUPLICATE_INVOICE
    http: 409
    condition: "An invoice already exists for this visit"
  - id: ERR_STALE_ROUTE_VERSION
    http: 412
    condition: "expected_route_version != route.version on visit commit"
  - id: ERR_OPEN_VISITS_EXIST
    http: 409
    condition: "Close route / complete agreement attempted with non-terminal committed visits"
  - id: ERR_EMPTY_ROUTE
    http: 422
    condition: "Dispatch attempted on a route with zero committed visits"
  - id: ERR_CREW_DOUBLE_BOOKED
    http: 409
    condition: "Route create for a crew that already has a non-CLOSED route on the same service_date"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing/malformed required body field, bad enum, or RECURRING agreement missing recurrence_interval_days>=7"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Customer
    description: "Account holder; manages own properties, quotes, agreements, deposits, re-clean requests"
    identity: "entity_backed:Account"
    exclusive_operations:
      - "POST /quotes/{id}/accept"
      - "POST /quotes/{id}/decline"
      - "POST /service-agreements/{id}/pause"
      - "POST /service-agreements/{id}/resume"
      - "POST /service-agreements/{id}/cancel"
      - "POST /reclean-requests"
    shared_operations:
      - "POST /accounts (with Billing)"
      - "POST /properties (with Billing)"
      - "POST /quotes (with Billing)"
      - "POST /quotes/{id}/send (with Billing)"
      - "POST /service-agreements (with Billing)"
      - "POST /deposits (with Billing)"
      - "GET reads on own account/quotes/agreements/visits/invoices/deposits"

  - name: Dispatcher
    description: "Owns crews, routes, weather advisories, visit scheduling and field-status flow"
    identity: "opaque"
    exclusive_operations:
      - "POST /crews"
      - "POST /crews/{id}/set-status"
      - "POST /routes"
      - "POST /routes/{id}/visits"
      - "POST /routes/{id}/dispatch"
      - "POST /routes/{id}/close"
      - "POST /visits/{id}/weather-reschedule"
      - "POST /visits/{id}/cancel"
      - "POST /weather-advisories"
    shared_operations:
      - "POST /visits/{id}/add-ons (with FieldCrew)"
      - "GET reads on routes/crews/visits/properties/accounts/agreements"

  - name: FieldCrew
    description: "Executes visits on the route: uploads photos, starts/completes work, attaches on-site add-ons"
    identity: "opaque"
    exclusive_operations:
      - "POST /visits/{id}/photos"
      - "POST /visits/{id}/start"
      - "POST /visits/{id}/complete"
    shared_operations:
      - "POST /visits/{id}/add-ons (with Dispatcher)"
      - "GET reads on routes/{id}/visits, visits/{id}, visit add-ons & photos"

  - name: Billing
    description: "Owns deposits, invoices, ledger, agreement activation/completion, re-clean adjudication, clock"
    identity: "opaque"
    exclusive_operations:
      - "POST /service-agreements/{id}/activate"
      - "POST /service-agreements/{id}/complete"
      - "POST /invoices"
      - "POST /invoices/{id}/pay"
      - "POST /reclean-requests/{id}/approve"
      - "POST /reclean-requests/{id}/deny"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /accounts (with Customer)"
      - "POST /properties (with Customer)"
      - "POST /quotes (with Customer)"
      - "POST /quotes/{id}/send (with Customer)"
      - "POST /service-agreements (with Customer)"
      - "POST /deposits (with Customer)"
      - "GET reads on accounts/ledger/invoices/deposits/agreements"
