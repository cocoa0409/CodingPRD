          assert:
            - "Supplier.${sup}.status == SUSPENDED (${sup_st})"
            - "link 1: LeafLot.${l1}.status == ON_HOLD and LeafLot.${l2}.status == ON_HOLD"
            - "link 2: BlendBatch.${b}.status == ON_HOLD (held because its allocated lots were held)"
            - "link 3: ProductionRun.${run}.status == CANCELLED (cancelled because its batch was held)"

      - name: certificate_suspend_depth2_cascade
        grounds:
          - state_machines.CertificateGrant.ACTIVE_to_SUSPENDED
          - state_machines.BlendBatch
          - state_machines.ProductionRun.SCHEDULED_to_CANCELLED
