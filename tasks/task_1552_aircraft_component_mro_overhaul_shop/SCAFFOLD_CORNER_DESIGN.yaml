            - { call: "POST /mro/units", payload: { part_id: "${p_id}", serial_number: "SN-B", ownership: "SHOP", condition_status: "SERVICEABLE", custody_status: "IN_POOL", total_cycles: 5000, cycles_since_overhaul: 50, manufactured_at: "2013-01-01" }, as: CustomerServiceRep, captures: { u_b: $.data.id } }
            - { call: "POST /mro/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:01Z" }, as: ShopManager }
            - { call: "POST /mro/units", payload: { part_id: "${p_id}", serial_number: "SN-C", ownership: "SHOP", condition_status: "SERVICEABLE", custody_status: "IN_POOL", total_cycles: 6000, cycles_since_overhaul: 50, manufactured_at: "2012-01-01" }, as: CustomerServiceRep, captures: { u_c: $.data.id } }
            - { call: "POST /mro/exchange-agreements", payload: { customer_id: "${c_id}", part_id: "${p_id}" }, as: CustomerServiceRep, captures: { ex1: $.data.id } }
            - { call: "POST /mro/exchange-agreements", payload: { customer_id: "${c_id}", part_id: "${p_id}" }, as: CustomerServiceRep, captures: { ex2: $.data.id } }
            - { call: "POST /mro/exchange-agreements", payload: { customer_id: "${c_id}", part_id: "${p_id}" }, as: CustomerServiceRep, captures: { ex3: $.data.id } }
