            - call: "POST /soc/controls"
              payload: { engagement_id: "${eng}", control_ref: "T-01", title: "DataCo backup verification", frequency: "MONTHLY", automation: "MANUAL", risk_rating: "MODERATE", population_size: 30, subservice_organization_id: "${sso}" }
