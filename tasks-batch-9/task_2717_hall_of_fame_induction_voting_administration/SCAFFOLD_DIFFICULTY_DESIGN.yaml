  - rule_id: combinatorial_formula
    instances:
      - name: max_votes_per_elector_nested_clamp_order
        grounds:
          - calculations.max_votes_per_elector_for_round
          - entities.Ballot.fields.max_votes_per_elector
          - entities.Ballot.fields.slot_count
          - entities.BallotSlot.fields.pathway_snapshot
        distinguishing_aspect: |
          Mode (a) - three or more inputs combined non-linearly. max_votes_per_elector is
          floor(slot_count / 2) pushed through a max(MIN_VOTES_FLOOR, .) / min(MAX_VOTES_CAP, .)
          clamp, then a runoff halving keyed on round_number, then a +1 veterans bonus keyed on
          veterans_slot_count and re-clamped. With slot_count 3, veterans_slot_count 1 and
          round_number 1 the only correct answer is 2: floor(3/2) = 1, clamp keeps 1, no runoff
          halving, veterans bonus lifts it to 2. An implementation that adds the veterans bonus
          before the floor division yields 2 by luck on other inputs but 1 here if it divides
          after adding, and a plain floor(slot_count / 2) yields 1.
        test_recipe:
          setup:
