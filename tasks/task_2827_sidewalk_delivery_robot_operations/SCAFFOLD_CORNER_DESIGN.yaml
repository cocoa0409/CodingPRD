              payload: { merchant_id: "${m}", dropoff_segment_id: "${s5}", customer_ref: "C-1", payload_liters: 22.0, declared_value_cents: 9000, promised_by_utc: "2026-08-03T09:40:00.000Z" }
              as: MerchantOperator
