            - call: "POST /weddings"
              payload: { couple_user_id: "couple_w13", title: "W13 Wedding", ceremony_at: "2028-05-01T18:00:00Z", rsvp_deadline_at: "2028-04-15T23:59:59Z" }
              as: Couple
              as_user_id: "couple_w13"
              captures: { w13_id: $.data.id }
            - call: "POST /weddings/${w13_id}/meal-options"
              payload: { code: "ADULT", label: "Adult", is_kids: false, max_servings: 10 }
              as: Couple
              as_user_id: "couple_w13"
              captures: { meal13_id: $.data.id }
            - call: "POST /weddings/${w13_id}/guests"
              payload: { full_name: "Eager", email: "eager@example.com", is_child: false, plus_one_allowed: false }
              as: Couple
              as_user_id: "couple_w13"
              captures: { g_eager_id: $.data.id }
          trigger:
            - call: "POST /guests/${g_eager_id}/rsvp"
              payload: { attending: true, meal_option_id: "${meal13_id}" }
              as: Couple
              as_user_id: "couple_w13"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status == 409."
            - "Response.data.error_id == ERR_INVALID_STATE."
            - "Guest.${g_eager_id}.rsvp_status remains INVITED (no transition occurred)."

      - name: thank_you_draft_blocked_by_purchase_state
        grounds:
          - state_machines.ThankYouNote.transitions.PENDING_to_DRAFTED
          - state_machines.Purchase.transitions.CONFIRMED_to_CANCELLED
          - validations[priority=5]
        distinguishing_aspect: |
          DIFFERENT entity pair: ThankYouNote's PENDING -> DRAFTED transition depends
          on parent Purchase.status == CONFIRMED. After cancelling the Purchase, the
          ThankYouNote is hard-deleted (cascade), so the draft attempt fails with
          ERR_NOT_FOUND. This proves the cross-entity dependency a different way:
          the Purchase state literally controls the ThankYouNote's existence.
        test_recipe:
          setup:
            - "Wedding W14 in RSVP_OPEN. RegistryItem R14 has one CONFIRMED Purchase P14 with an auto-created ThankYouNote TY14 in PENDING."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2028-01-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /weddings"
              payload: { couple_user_id: "couple_w14", title: "W14 Wedding", ceremony_at: "2028-06-01T18:00:00Z", rsvp_deadline_at: "2028-05-15T23:59:59Z" }
              as: Couple
              as_user_id: "couple_w14"
              captures: { w14_id: $.data.id }
            - call: "POST /weddings/${w14_id}/meal-options"
              payload: { code: "ADULT", label: "Adult", is_kids: false, max_servings: 10 }
              as: Couple
              as_user_id: "couple_w14"
            - call: "POST /weddings/${w14_id}/open-rsvp"
              payload: {}
              as: Couple
              as_user_id: "couple_w14"
            - call: "POST /weddings/${w14_id}/registry-items"
              payload: { sku: "VASE", title: "Vase", target_quantity: 2, unit_price_cents: 2000 }
              as: Couple
              as_user_id: "couple_w14"
              captures: { r14_id: $.data.id }
            - call: "POST /registry-items/${r14_id}/purchases"
              payload: { platform_code: "STORE_A", external_purchase_id: "V1", purchaser_name: "Fred", quantity: 1, occurred_at: "2028-01-02T10:00:00Z" }
              as: PlatformIntegration
              captures: { p14_id: $.data.id }
            - call: "GET /thank-you-notes"
              payload: { purchase_id: "${p14_id}" }
              as: Couple
              as_user_id: "couple_w14"
              captures: { ty14_id: "$.data[0].id" }
            - call: "GET /registry-items/${r14_id}"
              payload: {}
              as: Couple
              as_user_id: "couple_w14"
              captures: { r14_v_pre_cancel: $.data.version }
            - call: "POST /purchases/${p14_id}/cancel-duplicate"
              payload: { expected_registry_item_version: "${r14_v_pre_cancel}" }
              as: Couple
              as_user_id: "couple_w14"
          trigger:
            - call: "POST /thank-you-notes/${ty14_id}/draft"
              payload: { drafted_body: "Thanks Fred" }
              as: Couple
              as_user_id: "couple_w14"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status == 404 (the ThankYouNote was hard-deleted by the cascade)."
            - "Response.data.error_id == ERR_NOT_FOUND."
            - "Purchase.${p14_id}.status == CANCELLED."

  # ---------------------------------------------------------------------------
  # Rule 8 — resource temporal-overlap conflicts across different interval semantics
  # ---------------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: table_aggregate_capacity_overflow
        grounds:
          - entities.Table.fields.capacity
          - validations[priority=11]
          - errors[ERR_TABLE_FULL]
        distinguishing_aspect: |
          Resource: Table (a seating-chart unit). Interval semantics: aggregate-capacity
          occupation — every assignee occupies one of capacity slots; adjacency between
          slots does not matter (no buffer, no time dimension); the test is purely
          cardinality on the Table.capacity ceiling. Endpoint: POST /seating-assignments.
        test_recipe:
          setup:
            - "Wedding W15 in RSVP_CLOSED with Table T15 (capacity=1). One ATTENDING guest G_in is already assigned to T15. Trying to assign G_out (also ATTENDING) collides on aggregate capacity."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2028-02-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /weddings"
              payload: { couple_user_id: "couple_w15", title: "W15 Wedding", ceremony_at: "2028-07-01T18:00:00Z", rsvp_deadline_at: "2028-06-15T23:59:59Z" }
              as: Couple
              as_user_id: "couple_w15"
              captures: { w15_id: $.data.id }
            - call: "POST /weddings/${w15_id}/meal-options"
              payload: { code: "ADULT", label: "Adult", is_kids: false, max_servings: 10 }
              as: Couple
              as_user_id: "couple_w15"
              captures: { meal15_id: $.data.id }
            - call: "POST /weddings/${w15_id}/tables"
              payload: { table_number: 1, capacity: 1, kids_only: false }
              as: Couple
              as_user_id: "couple_w15"
              captures: { t15_id: $.data.id }
            - call: "POST /weddings/${w15_id}/guests"
              payload: { full_name: "G In", email: "gin@example.com", is_child: false, plus_one_allowed: false }
              as: Couple
              as_user_id: "couple_w15"
              captures: { g_in_id: $.data.id }
            - call: "POST /weddings/${w15_id}/guests"
              payload: { full_name: "G Out", email: "gout@example.com", is_child: false, plus_one_allowed: false }
              as: Couple
              as_user_id: "couple_w15"
              captures: { g_out_id: $.data.id }
            - call: "POST /weddings/${w15_id}/open-rsvp"
              payload: {}
              as: Couple
              as_user_id: "couple_w15"
            - call: "POST /guests/${g_in_id}/rsvp"
              payload: { attending: true, meal_option_id: "${meal15_id}" }
              as: Couple
              as_user_id: "couple_w15"
            - call: "POST /guests/${g_out_id}/rsvp"
              payload: { attending: true, meal_option_id: "${meal15_id}" }
              as: Couple
              as_user_id: "couple_w15"
            - call: "POST /weddings/${w15_id}/close-rsvp"
              payload: {}
              as: Couple
              as_user_id: "couple_w15"
            - call: "POST /seating-assignments"
              payload: { wedding_id: "${w15_id}", table_id: "${t15_id}", assignee_type: "GUEST", assignee_id: "${g_in_id}" }
              as: Couple
              as_user_id: "couple_w15"
          trigger:
            - call: "POST /seating-assignments"
              payload: { wedding_id: "${w15_id}", table_id: "${t15_id}", assignee_type: "GUEST", assignee_id: "${g_out_id}" }
              as: Couple
              as_user_id: "couple_w15"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status == 422; error_id == ERR_TABLE_FULL."
            - "Exactly 1 SeatingAssignment row exists for wedding_id=${w15_id} (the second one was rejected)."

      - name: assignee_point_uniqueness_collision
        grounds:
          - entities.SeatingAssignment
          - validations[priority=12]
          - errors[ERR_ALREADY_SEATED]
        distinguishing_aspect: |
          Resource: the (wedding_id, assignee_type, assignee_id) identity slot. Interval
          semantics: point-occupation uniqueness — an assignee occupies exactly one
          point in the assignment space; a second SeatingAssignment for the same
          assignee (even at a DIFFERENT Table) collides on the unique key. This is a
          POINT collision, not aggregate capacity — the offending Table itself may have
          free slots. Different resource and different interval semantics from
          instance 1.
        test_recipe:
          setup:
            - "Wedding W16 in RSVP_CLOSED with two Tables T_a (capacity=4, empty) and T_b (capacity=4, empty). One ATTENDING guest G_dup. G_dup is already seated at T_a. Trying to also seat G_dup at T_b collides on the assignee-uniqueness key."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2028-03-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /weddings"
              payload: { couple_user_id: "couple_w16", title: "W16 Wedding", ceremony_at: "2028-08-01T18:00:00Z", rsvp_deadline_at: "2028-07-15T23:59:59Z" }
              as: Couple
              as_user_id: "couple_w16"
              captures: { w16_id: $.data.id }
            - call: "POST /weddings/${w16_id}/meal-options"
              payload: { code: "ADULT", label: "Adult", is_kids: false, max_servings: 10 }
              as: Couple
              as_user_id: "couple_w16"
              captures: { meal16_id: $.data.id }
            - call: "POST /weddings/${w16_id}/tables"
              payload: { table_number: 1, capacity: 4, kids_only: false }
              as: Couple
              as_user_id: "couple_w16"
              captures: { t_a_id: $.data.id }
            - call: "POST /weddings/${w16_id}/tables"
              payload: { table_number: 2, capacity: 4, kids_only: false }
              as: Couple
              as_user_id: "couple_w16"
              captures: { t_b_id: $.data.id }
            - call: "POST /weddings/${w16_id}/guests"
              payload: { full_name: "Dup", email: "dup@example.com", is_child: false, plus_one_allowed: false }
              as: Couple
              as_user_id: "couple_w16"
              captures: { g_dup_id: $.data.id }
            - call: "POST /weddings/${w16_id}/open-rsvp"
              payload: {}
              as: Couple
              as_user_id: "couple_w16"
            - call: "POST /guests/${g_dup_id}/rsvp"
              payload: { attending: true, meal_option_id: "${meal16_id}" }
              as: Couple
              as_user_id: "couple_w16"
            - call: "POST /weddings/${w16_id}/close-rsvp"
              payload: {}
              as: Couple
              as_user_id: "couple_w16"
            - call: "POST /seating-assignments"
              payload: { wedding_id: "${w16_id}", table_id: "${t_a_id}", assignee_type: "GUEST", assignee_id: "${g_dup_id}" }
              as: Couple
              as_user_id: "couple_w16"
          trigger:
            - call: "POST /seating-assignments"
              payload: { wedding_id: "${w16_id}", table_id: "${t_b_id}", assignee_type: "GUEST", assignee_id: "${g_dup_id}" }
              as: Couple
              as_user_id: "couple_w16"
              captures: { err_id: $.data.error_id }
          assert:
            - "HTTP status == 422; error_id == ERR_ALREADY_SEATED."
            - "GET /seating-assignments?wedding_id=${w16_id} returns exactly 1 row (the original T_a assignment is intact; T_b never received one)."
            - "Table T_b.capacity (4) is irrelevant — collision is on the assignee key, not on T_b's free slots."

  # ---------------------------------------------------------------------------
  # Rule 9 — compensating-action invariants across different conserved quantities
  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: purchase_create_cancel_preserves_fulfilled_quantity
        grounds:
          - state_machines.Purchase.transitions.CONFIRMED_to_CANCELLED
          - entities.RegistryItem.fields.fulfilled_quantity
          - calculations.registry_purchase_aggregation
        distinguishing_aspect: |
          Conserved quantity: RegistryItem.fulfilled_quantity (an INTEGER aggregate
          over CONFIRMED Purchases of the item). Invariant: after CREATE Purchase P
          (CONFIRMED, qty=Q) immediately followed by CANCEL Purchase P, the
          fulfilled_quantity returns EXACTLY to its prior value Q_prev. Formula:
          fulfilled_quantity_AFTER == fulfilled_quantity_BEFORE; drift forbidden.
        test_recipe:
          setup:
            - "Wedding W17 in RSVP_OPEN. RegistryItem R17 (target_quantity=5) starts with fulfilled_quantity=0 (no purchases yet)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2028-04-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /weddings"
              payload: { couple_user_id: "couple_w17", title: "W17 Wedding", ceremony_at: "2028-09-01T18:00:00Z", rsvp_deadline_at: "2028-08-15T23:59:59Z" }
              as: Couple
              as_user_id: "couple_w17"
              captures: { w17_id: $.data.id }
            - call: "POST /weddings/${w17_id}/meal-options"
              payload: { code: "ADULT", label: "Adult", is_kids: false, max_servings: 10 }
              as: Couple
              as_user_id: "couple_w17"
            - call: "POST /weddings/${w17_id}/open-rsvp"
              payload: {}
              as: Couple
              as_user_id: "couple_w17"
            - call: "POST /weddings/${w17_id}/registry-items"
              payload: { sku: "TOWELS", title: "Towels", target_quantity: 5, unit_price_cents: 1500 }
              as: Couple
              as_user_id: "couple_w17"
              captures: { r17_id: $.data.id }
            - call: "GET /registry-items/${r17_id}"
              payload: {}
              as: Couple
              as_user_id: "couple_w17"
              captures: { r17_qty_before: $.data.fulfilled_quantity, r17_v_pre_create: $.data.version }
          trigger:
            - call: "POST /registry-items/${r17_id}/purchases"
              payload: { platform_code: "STORE_A", external_purchase_id: "TW1", purchaser_name: "Gina", quantity: 2, occurred_at: "2028-04-02T10:00:00Z" }
              as: PlatformIntegration
              captures: { p17_id: $.data.id }
            - call: "GET /registry-items/${r17_id}"
              payload: {}
              as: Couple
              as_user_id: "couple_w17"
              captures: { r17_v_after_create: $.data.version, r17_qty_after_create: $.data.fulfilled_quantity }
            - call: "POST /purchases/${p17_id}/cancel-duplicate"
              payload: { expected_registry_item_version: "${r17_v_after_create}" }
              as: Couple
              as_user_id: "couple_w17"
            - call: "GET /registry-items/${r17_id}"
              payload: {}
              as: Couple
              as_user_id: "couple_w17"
              captures: { r17_qty_after_cancel: $.data.fulfilled_quantity }
          assert:
            - "RegistryItem.${r17_id}.fulfilled_quantity_BEFORE == 0 and fulfilled_quantity_AFTER == 0 (compensating pair preserves the invariant)."
            - "Intermediate state: fulfilled_quantity_after_create == 2 (proves the create-cancel pair was not a no-op)."
            - "Purchase.${p17_id}.status == CANCELLED."

      - name: rsvp_decline_re_attend_preserves_meal_count
        grounds:
          - state_machines.Guest.transitions.ATTENDING_to_DECLINED
          - state_machines.Guest.transitions.INVITED_to_ATTENDING
          - calculations.meal_count_aggregation
        distinguishing_aspect: |
          Conserved quantity: count(MealOption M) — a DIFFERENT type of conserved
          quantity from fulfilled_quantity (this is a derived count over ATTENDING
          guests+plus-ones with meal_option_id == M, not a gift aggregate). Invariant:
          after the sequence Guest G with meal M -> DECLINE -> revoke -> RSVP again
          with meal M, count(M) returns EXACTLY to its prior value. Different
          compensating quantity, different conserved domain.
        test_recipe:
          setup:
            - "Wedding W18 in RSVP_OPEN. One Guest G_back currently ATTENDING with meal_option_id=M_back; count(M_back)==1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2028-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /weddings"
              payload: { couple_user_id: "couple_w18", title: "W18 Wedding", ceremony_at: "2028-10-01T18:00:00Z", rsvp_deadline_at: "2028-09-15T23:59:59Z" }
              as: Couple
              as_user_id: "couple_w18"
              captures: { w18_id: $.data.id }
            - call: "POST /weddings/${w18_id}/meal-options"
              payload: { code: "BACK", label: "Back option", is_kids: false, max_servings: 10 }
              as: Couple
              as_user_id: "couple_w18"
              captures: { m_back_id: $.data.id }
            - call: "POST /weddings/${w18_id}/guests"
              payload: { full_name: "Back", email: "back@example.com", is_child: false, plus_one_allowed: false }
              as: Couple
              as_user_id: "couple_w18"
              captures: { g_back_id: $.data.id }
            - call: "POST /weddings/${w18_id}/open-rsvp"
              payload: {}
              as: Couple
              as_user_id: "couple_w18"
            - call: "POST /guests/${g_back_id}/rsvp"
              payload: { attending: true, meal_option_id: "${m_back_id}" }
              as: Couple
              as_user_id: "couple_w18"
            - call: "GET /weddings/${w18_id}/meal-summary"
              payload: {}
              as: Couple
              as_user_id: "couple_w18"
              captures: { summary_before: $.data }
          trigger:
            - call: "POST /guests/${g_back_id}/rsvp"
              payload: { attending: false }
              as: Couple
              as_user_id: "couple_w18"
            - call: "POST /guests/${g_back_id}/revoke-rsvp"
              payload: {}
              as: Couple
              as_user_id: "couple_w18"
            - call: "POST /guests/${g_back_id}/rsvp"
              payload: { attending: true, meal_option_id: "${m_back_id}" }
              as: Couple
              as_user_id: "couple_w18"
            - call: "GET /weddings/${w18_id}/meal-summary"
              payload: {}
              as: Couple
              as_user_id: "couple_w18"
              captures: { summary_after: $.data }
          assert:
            - "count(M_back) before the compensating pair == 1 and count(M_back) after == 1 (exactly preserved)."
            - "Guest.${g_back_id}.rsvp_status == ATTENDING and meal_option_id == ${m_back_id} at the end."
            - "Intermediate observation: between the decline and the re-RSVP, count(M_back) was 0 — proves the pair was not a no-op."
