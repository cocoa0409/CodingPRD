scaffold_corner_design:
  # =================================================================
  # Section: entities
  # =================================================================
  - section: entities
    instances:
      - name: face_creation_applies_defaults_and_computed_posture
        claim_type: creation
        grounds: [entities.Face]
        distinguishing_aspect: "A STATIC face created without loop_slots_total starts AVAILABLE with booking_posture OPEN, current_permit_id null, version 1, and a UUID id."
        test_recipe:
          setup: ["empty DB; default clock 2026-08-01T00:00:00Z"]
          setup_api_calls:
            - { call: "POST /api/faces", payload: { face_code: "F-NYC-100", structure_code: "ST-100", market_code: "NYC", display_type: "STATIC", illuminated: false, daily_traffic_count: 50000, width_inches: 168, height_inches: 576 }, as: InventoryManager, captures: { f: $.data.id, f_status: $.data.status, f_posture: $.data.booking_posture, f_v: $.data.version, f_perm: $.data.current_permit_id } }
          trigger:
            - { call: "GET /api/faces/${f}", payload: {}, as: InventoryManager, captures: { g_status: $.data.status, g_posture: $.data.booking_posture } }
          assert:
            - "status == AVAILABLE and booking_posture == OPEN on create and on re-read (immediate consistency)"
            - "current_permit_id is null; version == 1; id is a UUID string"
      - name: campaign_creation_defaults
        claim_type: defaults
        grounds: [entities.Campaign]
        distinguishing_aspect: "New campaign: status DRAFT, billing_status UNINVOICED, contracted_cents 0, delivery_posture ON_TRACK, cancellation_fees_cents 0."
        test_recipe:
          setup: ["advertiser exists"]
          setup_api_calls:
            - { call: "POST /api/advertiser-accounts", payload: { name: "Acme", credit_limit_cents: 90000000 }, as: SalesPlanner, captures: { adv: $.data.id } }
          trigger:
            - { call: "POST /api/campaigns", payload: { advertiser_id: "${adv}", name: "C1", start_date: "2026-08-01", end_date: "2026-09-30" }, as: SalesPlanner, captures: { st: $.data.status, bs: $.data.billing_status, contracted: $.data.contracted_cents, posture: $.data.delivery_posture, fees: $.data.cancellation_fees_cents } }
          assert:
            - "status == DRAFT, billing_status == UNINVOICED"
            - "contracted_cents == 0, cancellation_fees_cents == 0, delivery_posture == ON_TRACK"
      - name: static_face_with_loop_slots_rejected
        claim_type: type_constraints
        grounds: [entities.Face.fields.loop_slots_total, "errors[ERR_DIGITAL_SLOTS_REQUIRED]"]
        distinguishing_aspect: "STATIC face carrying loop_slots_total violates the conditional slot rule at creation."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/faces", payload: { face_code: "F-BAD", structure_code: "ST-BAD", market_code: "NYC", display_type: "STATIC", illuminated: false, daily_traffic_count: 50000, width_inches: 168, height_inches: 576, loop_slots_total: 8 }, as: InventoryManager, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_DIGITAL_SLOTS_REQUIRED (http 400)"
      - name: digital_face_without_loop_slots_rejected
        claim_type: type_constraints
        grounds: [entities.Face.fields.loop_slots_total, "errors[ERR_DIGITAL_SLOTS_REQUIRED]"]
        distinguishing_aspect: "DIGITAL face omitting loop_slots_total violates the mirror image of the slot rule."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/faces", payload: { face_code: "F-BAD2", structure_code: "ST-BAD2", market_code: "NYC", display_type: "DIGITAL", illuminated: true, daily_traffic_count: 300000, width_inches: 168, height_inches: 576 }, as: InventoryManager, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_DIGITAL_SLOTS_REQUIRED (http 400)"
      - name: face_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_FACE_NOT_FOUND]"]
        distinguishing_aspect: "GET on a well-formed but nonexistent face id returns the face-specific 404."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /api/faces/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", payload: {}, as: InventoryManager, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_FACE_NOT_FOUND (http 404)"
      - name: face_computed_field_input_ignored
        claim_type: computed_fields
        grounds: [entities.Face.fields.booking_posture]
        distinguishing_aspect: "Client-supplied booking_posture in the create body is ignored; the server computes OPEN."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /api/faces", payload: { face_code: "F-NYC-101", structure_code: "ST-101", market_code: "NYC", display_type: "STATIC", illuminated: false, daily_traffic_count: 50000, width_inches: 168, height_inches: 576, booking_posture: "BLOCKED" }, as: InventoryManager, captures: { posture: $.data.booking_posture } }
          assert:
            - "booking_posture == OPEN (client-supplied BLOCKED ignored)"
      - name: permit_self_reference_chain_links
        claim_type: parent_relationships
        grounds: [entities.Permit.fields.supersedes_permit_id, state_machines.Permit.RENEWAL_PENDING_to_SUPERSEDED]
        distinguishing_aspect: "Creating permit P2 with supersedes_permit_id = P1 flips P1 to SUPERSEDED, repoints Face.current_permit_id to P2, and P2 appears in P1's successors list (self-referential FK both directions)."
        test_recipe:
          setup: ["face F exists; permit P1 ACTIVE expiring 2026-09-15T00:00:00Z; clock advanced into the renewal window at 2026-08-16T00:00:00Z (P1 -> RENEWAL_PENDING)"]
          setup_api_calls:
            - { call: "POST /api/faces", payload: { face_code: "F-NYC-102", structure_code: "ST-102", market_code: "NYC", display_type: "STATIC", illuminated: true, daily_traffic_count: 300000, width_inches: 168, height_inches: 576 }, as: InventoryManager, captures: { f: $.data.id } }
            - { call: "POST /api/permits", payload: { face_id: "${f}", permit_number: "P-OLD", jurisdiction: "NYC DOB", issued_on: "2026-07-01T00:00:00Z", expires_on: "2026-09-15T00:00:00Z" }, as: ComplianceOfficer, captures: { p1: $.data.id } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-16T00:00:00Z" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /api/permits", payload: { face_id: "${f}", permit_number: "P-NEW", jurisdiction: "NYC DOB", issued_on: "2026-08-16T00:00:00Z", expires_on: "2027-09-15T00:00:00Z", supersedes_permit_id: "${p1}" }, as: ComplianceOfficer, captures: { p2: $.data.id, p2_status: $.data.status } }
            - { call: "GET /api/permits/${p1}", payload: {}, as: ComplianceOfficer, captures: { p1_status: $.data.status } }
            - { call: "GET /api/permits/${p1}/successors", payload: {}, as: ComplianceOfficer, captures: { succ0: "$.data[0].id" } }
            - { call: "GET /api/faces/${f}", payload: {}, as: ComplianceOfficer, captures: { cur_perm: $.data.current_permit_id } }
          assert:
            - "P1 status: RENEWAL_PENDING after the window clock-set, then SUPERSEDED after P2 creation"
            - "P2 status == ACTIVE; successors of P1 == [P2]; Face.current_permit_id == P2.id"

  # =================================================================
  # Section: state_machines
  # =================================================================
  - section: state_machines
    instances:
      - name: flight_invalid_transition_held_to_live_rejected
        claim_type: invalid_transition
        grounds: [state_machines.Flight, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "HELD -> LIVE is not a declared transition; a direct status write is rejected with ERR_INVALID_STATE."
        test_recipe:
          setup: ["booking chain up to a HELD flight on static face F1 (card published, permit to 2026-12-31, campaign DRAFT)"]
          setup_api_calls:
            - { call: "POST /api/rate-cards", payload: { market_code: "NYC", display_type: "STATIC", base_weekly_cents: 200000, illumination_premium_pct: 0.15, traffic_tier_1_threshold: 100000, traffic_tier_1_uplift_pct: 0.10, traffic_tier_2_threshold: 250000, traffic_tier_2_uplift_pct: 0.25 }, as: InventoryManager, captures: { rc: $.data.id, rc_v: $.data.version } }
            - { call: "PUT /api/rate-cards/${rc}", payload: { status: "PUBLISHED", expected_rate_card_version: "${rc_v}" }, as: InventoryManager }
            - { call: "POST /api/faces", payload: { face_code: "F-NYC-001", structure_code: "ST-001", market_code: "NYC", display_type: "STATIC", illuminated: true, daily_traffic_count: 300000, width_inches: 168, height_inches: 576 }, as: InventoryManager, captures: { f1: $.data.id } }
            - { call: "POST /api/permits", payload: { face_id: "${f1}", permit_number: "P-001", jurisdiction: "NYC DOB", issued_on: "2026-07-01T00:00:00Z", expires_on: "2026-12-31T00:00:00Z" }, as: ComplianceOfficer }
            - { call: "GET /api/faces/${f1}", payload: {}, as: SalesPlanner, captures: { f1_v: $.data.version } }
            - { call: "POST /api/advertiser-accounts", payload: { name: "Acme", credit_limit_cents: 90000000 }, as: SalesPlanner, captures: { adv: $.data.id } }
            - { call: "POST /api/campaigns", payload: { advertiser_id: "${adv}", name: "C1", start_date: "2026-08-01", end_date: "2026-09-30" }, as: SalesPlanner, captures: { camp: $.data.id } }
            - { call: "POST /api/flights", payload: { campaign_id: "${camp}", face_id: "${f1}", rate_card_id: "${rc}", start_date: "2026-08-10", end_date: "2026-09-06", expected_face_version: "${f1_v}" }, as: SalesPlanner, captures: { fl: $.data.id } }
          trigger:
            - { call: "PUT /api/flights/${fl}", payload: { status: "LIVE" }, as: SalesPlanner, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE (http 409); Flight remains HELD"
      - name: terminal_state_lockdown_cancelled_flight_rejected
        claim_type: terminal_state_lockdown
        grounds: [state_machines.Flight.BOOKED_to_CANCELLED, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A CANCELLED flight is terminal: a further transition attempt (RELEASED) is rejected and no side effects fire."
        test_recipe:
          setup: ["full chain to BOOKED flight 2026-08-10..2026-09-06 on F1, then cancelled at clock 2026-08-01 (fee 575000)"]
          setup_api_calls:
            - { call: "POST /api/rate-cards", payload: { market_code: "NYC", display_type: "STATIC", base_weekly_cents: 200000, illumination_premium_pct: 0.15, traffic_tier_1_threshold: 100000, traffic_tier_1_uplift_pct: 0.10, traffic_tier_2_threshold: 250000, traffic_tier_2_uplift_pct: 0.25 }, as: InventoryManager, captures: { rc: $.data.id, rc_v: $.data.version } }
            - { call: "PUT /api/rate-cards/${rc}", payload: { status: "PUBLISHED", expected_rate_card_version: "${rc_v}" }, as: InventoryManager }
            - { call: "POST /api/faces", payload: { face_code: "F-NYC-001", structure_code: "ST-001", market_code: "NYC", display_type: "STATIC", illuminated: true, daily_traffic_count: 300000, width_inches: 168, height_inches: 576 }, as: InventoryManager, captures: { f1: $.data.id } }
            - { call: "POST /api/permits", payload: { face_id: "${f1}", permit_number: "P-001", jurisdiction: "NYC DOB", issued_on: "2026-07-01T00:00:00Z", expires_on: "2026-12-31T00:00:00Z" }, as: ComplianceOfficer }
            - { call: "GET /api/faces/${f1}", payload: {}, as: SalesPlanner, captures: { f1_v: $.data.version } }
            - { call: "POST /api/advertiser-accounts", payload: { name: "Acme", credit_limit_cents: 90000000 }, as: SalesPlanner, captures: { adv: $.data.id } }
            - { call: "POST /api/campaigns", payload: { advertiser_id: "${adv}", name: "C1", start_date: "2026-08-01", end_date: "2026-09-30" }, as: SalesPlanner, captures: { camp: $.data.id } }
            - { call: "POST /api/flights", payload: { campaign_id: "${camp}", face_id: "${f1}", rate_card_id: "${rc}", start_date: "2026-08-10", end_date: "2026-09-06", expected_face_version: "${f1_v}" }, as: SalesPlanner, captures: { fl: $.data.id } }
            - { call: "PUT /api/campaigns/${camp}", payload: { status: "SUBMITTED" }, as: SalesPlanner }
            - { call: "PUT /api/campaigns/${camp}", payload: { status: "APPROVED" }, as: SalesManager, captures: { camp_v: $.data.version } }
            - { call: "POST /api/flights/${fl}/confirm", payload: { expected_campaign_version: "${camp_v}" }, as: SalesPlanner }
            - { call: "PUT /api/flights/${fl}", payload: { status: "CANCELLED" }, as: SalesPlanner, captures: { fee: $.data.cancellation_fee_cents } }
          trigger:
            - { call: "PUT /api/flights/${fl}", payload: { status: "RELEASED" }, as: SalesPlanner, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE; cancellation_fee_cents stays 575000 (no double side effects)"
      - name: posting_record_terminal_lockdown_rejected
        claim_type: terminal_state_lockdown
        grounds: [state_machines.PostingRecord, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "A VERIFIED posting record cannot later be REJECTED (terminal lockdown on the proof record)."
        test_recipe:
          setup: ["full chain: flight ART_CLEARED, posting REPORTED then VERIFIED at clock 2026-08-10 (flight LIVE)"]
          setup_api_calls:
            - { call: "POST /api/rate-cards", payload: { market_code: "NYC", display_type: "STATIC", base_weekly_cents: 200000, illumination_premium_pct: 0.15, traffic_tier_1_threshold: 100000, traffic_tier_1_uplift_pct: 0.10, traffic_tier_2_threshold: 250000, traffic_tier_2_uplift_pct: 0.25 }, as: InventoryManager, captures: { rc: $.data.id, rc_v: $.data.version } }
            - { call: "PUT /api/rate-cards/${rc}", payload: { status: "PUBLISHED", expected_rate_card_version: "${rc_v}" }, as: InventoryManager }
            - { call: "POST /api/faces", payload: { face_code: "F-NYC-001", structure_code: "ST-001", market_code: "NYC", display_type: "STATIC", illuminated: true, daily_traffic_count: 300000, width_inches: 168, height_inches: 576 }, as: InventoryManager, captures: { f1: $.data.id } }
            - { call: "POST /api/permits", payload: { face_id: "${f1}", permit_number: "P-001", jurisdiction: "NYC DOB", issued_on: "2026-07-01T00:00:00Z", expires_on: "2026-12-31T00:00:00Z" }, as: ComplianceOfficer }
            - { call: "GET /api/faces/${f1}", payload: {}, as: SalesPlanner, captures: { f1_v: $.data.version } }
            - { call: "POST /api/advertiser-accounts", payload: { name: "Acme", credit_limit_cents: 90000000 }, as: SalesPlanner, captures: { adv: $.data.id } }
            - { call: "POST /api/campaigns", payload: { advertiser_id: "${adv}", name: "C1", start_date: "2026-08-01", end_date: "2026-09-30" }, as: SalesPlanner, captures: { camp: $.data.id } }
            - { call: "POST /api/flights", payload: { campaign_id: "${camp}", face_id: "${f1}", rate_card_id: "${rc}", start_date: "2026-08-10", end_date: "2026-09-06", expected_face_version: "${f1_v}" }, as: SalesPlanner, captures: { fl: $.data.id } }
            - { call: "PUT /api/campaigns/${camp}", payload: { status: "SUBMITTED" }, as: SalesPlanner }
            - { call: "PUT /api/campaigns/${camp}", payload: { status: "APPROVED" }, as: SalesManager, captures: { camp_v: $.data.version } }
            - { call: "POST /api/flights/${fl}/confirm", payload: { expected_campaign_version: "${camp_v}" }, as: SalesPlanner }
            - { call: "POST /api/artwork-orders", payload: { flight_id: "${fl}", creative_code: "CR-1", material: "VINYL", width_inches: 168, height_inches: 576 }, as: ProductionCoordinator, captures: { ao: $.data.id } }
            - { call: "PUT /api/artwork-orders/${ao}", payload: { status: "IN_PRODUCTION" }, as: ProductionCoordinator }
            - { call: "PUT /api/artwork-orders/${ao}", payload: { status: "PRINTED" }, as: ProductionCoordinator }
            - { call: "PUT /api/artwork-orders/${ao}", payload: { status: "SHIPPED" }, as: ProductionCoordinator }
            - { call: "PUT /api/artwork-orders/${ao}", payload: { status: "DELIVERED" }, as: ProductionCoordinator }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /api/posting-records", payload: { flight_id: "${fl}", posted_on: "2026-08-10", photo_proof_url: "https://proof.example/1.jpg" }, as: FieldInstaller, as_user_id: "installer-1", captures: { pr: $.data.id } }
            - { call: "PUT /api/posting-records/${pr}", payload: { status: "VERIFIED" }, as: OperationsAuditor, as_user_id: "auditor-1" }
          trigger:
            - { call: "PUT /api/posting-records/${pr}", payload: { status: "REJECTED", rejection_reason: "blurry" }, as: OperationsAuditor, as_user_id: "auditor-2", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INVALID_STATE; PostingRecord stays VERIFIED; Flight stays LIVE"
      - name: hold_expiry_clock_sweep_boundary
        claim_type: valid_transition
        grounds: [state_machines.Flight.HELD_to_EXPIRED, entities.Flight.fields.held_until]
        distinguishing_aspect: "Auto-transition via clock: HELD expires exactly when now >= held_until (created + 72h); one hour before, it survives."
        test_recipe:
          setup: ["HELD flight created at default clock 2026-08-01T00:00:00Z on static face F1 (permit to 2026-12-31), campaign DRAFT"]
          setup_api_calls:
            - { call: "POST /api/rate-cards", payload: { market_code: "NYC", display_type: "STATIC", base_weekly_cents: 200000, illumination_premium_pct: 0.15, traffic_tier_1_threshold: 100000, traffic_tier_1_uplift_pct: 0.10, traffic_tier_2_threshold: 250000, traffic_tier_2_uplift_pct: 0.25 }, as: InventoryManager, captures: { rc: $.data.id, rc_v: $.data.version } }
            - { call: "PUT /api/rate-cards/${rc}", payload: { status: "PUBLISHED", expected_rate_card_version: "${rc_v}" }, as: InventoryManager }
            - { call: "POST /api/faces", payload: { face_code: "F-NYC-001", structure_code: "ST-001", market_code: "NYC", display_type: "STATIC", illuminated: true, daily_traffic_count: 300000, width_inches: 168, height_inches: 576 }, as: InventoryManager, captures: { f1: $.data.id } }
            - { call: "POST /api/permits", payload: { face_id: "${f1}", permit_number: "P-001", jurisdiction: "NYC DOB", issued_on: "2026-07-01T00:00:00Z", expires_on: "2026-12-31T00:00:00Z" }, as: ComplianceOfficer }
            - { call: "GET /api/faces/${f1}", payload: {}, as: SalesPlanner, captures: { f1_v: $.data.version } }
            - { call: "POST /api/advertiser-accounts", payload: { name: "Acme", credit_limit_cents: 90000000 }, as: SalesPlanner, captures: { adv: $.data.id } }
            - { call: "POST /api/campaigns", payload: { advertiser_id: "${adv}", name: "C1", start_date: "2026-08-01", end_date: "2026-09-30" }, as: SalesPlanner, captures: { camp: $.data.id } }
            - { call: "POST /api/flights", payload: { campaign_id: "${camp}", face_id: "${f1}", rate_card_id: "${rc}", start_date: "2026-08-10", end_date: "2026-09-06", expected_face_version: "${f1_v}" }, as: SalesPlanner, captures: { fl: $.data.id, held_until: $.data.held_until } }
          trigger:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T23:00:00Z" }, as: PlatformAdmin }
            - { call: "GET /api/flights/${fl}", payload: {}, as: SalesPlanner, captures: { st_before: $.data.status } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-04T00:00:00Z" }, as: PlatformAdmin }
            - { call: "GET /api/flights/${fl}", payload: {}, as: SalesPlanner, captures: { st_after: $.data.status } }
          assert:
            - "held_until == 2026-08-04T00:00:00Z (created_at + 72h)"
            - "At 2026-08-03T23:00:00Z: status == HELD"
            - "At 2026-08-04T00:00:00Z: status == EXPIRED (boundary now >= held_until)"
      - name: permit_renewal_window_boundary
        claim_type: valid_transition
        grounds: [state_machines.Permit.ACTIVE_to_RENEWAL_PENDING]
        distinguishing_aspect: "Permit enters RENEWAL_PENDING exactly when now >= expires_on - 30 days; one minute before, still ACTIVE."
        test_recipe:
          setup: ["face F with permit expiring 2026-09-15T00:00:00Z (window opens 2026-08-16T00:00:00Z)"]
          setup_api_calls:
            - { call: "POST /api/faces", payload: { face_code: "F-NYC-001", structure_code: "ST-001", market_code: "NYC", display_type: "STATIC", illuminated: true, daily_traffic_count: 300000, width_inches: 168, height_inches: 576 }, as: InventoryManager, captures: { f1: $.data.id } }
            - { call: "POST /api/permits", payload: { face_id: "${f1}", permit_number: "P-001", jurisdiction: "NYC DOB", issued_on: "2026-07-01T00:00:00Z", expires_on: "2026-09-15T00:00:00Z" }, as: ComplianceOfficer, captures: { perm: $.data.id } }
          trigger:
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-15T23:59:00Z" }, as: PlatformAdmin }
            - { call: "GET /api/permits/${perm}", payload: {}, as: ComplianceOfficer, captures: { st_before: $.data.status } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-16T00:00:00Z" }, as: PlatformAdmin }
            - { call: "GET /api/permits/${perm}", payload: {}, as: ComplianceOfficer, captures: { st_after: $.data.status } }
          assert:
            - "At 2026-08-15T23:59:00Z: status == ACTIVE"
            - "At 2026-08-16T00:00:00Z: status == RENEWAL_PENDING (boundary >= expires_on - 30d)"
      - name: work_order_reopen_cycle_and_downtime
        claim_type: side_effect_execution
        grounds: [state_machines.MaintenanceWorkOrder.COMPLETED_to_REOPENED, entities.MaintenanceWorkOrder.fields.downtime_hours]
        distinguishing_aspect: "Cyclic machine: COMPLETED -> REOPENED -> IN_PROGRESS -> COMPLETED increments reopen_count, nulls then recomputes downtime from the NEW started_at/completed_at, and the face cascade fires on each IN_PROGRESS."
        test_recipe:
          setup: ["face F1 (permit to 2026-12-31); work order SCHEDULED for 2026-08-05T06:00:00Z..2026-08-05T18:00:00Z"]
          setup_api_calls:
            - { call: "POST /api/faces", payload: { face_code: "F-NYC-001", structure_code: "ST-001", market_code: "NYC", display_type: "STATIC", illuminated: true, daily_traffic_count: 300000, width_inches: 168, height_inches: 576 }, as: InventoryManager, captures: { f1: $.data.id } }
            - { call: "POST /api/permits", payload: { face_id: "${f1}", permit_number: "P-001", jurisdiction: "NYC DOB", issued_on: "2026-07-01T00:00:00Z", expires_on: "2026-12-31T00:00:00Z" }, as: ComplianceOfficer }
            - { call: "POST /api/maintenance-work-orders", payload: { face_id: "${f1}", order_type: "STRUCTURAL_REPAIR", description: "panel refit" }, as: ComplianceOfficer, captures: { wo: $.data.id } }
