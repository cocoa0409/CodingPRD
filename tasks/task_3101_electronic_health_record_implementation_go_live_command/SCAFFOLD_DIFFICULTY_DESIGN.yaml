# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3101_electronic_health_record_implementation_go_live_command
# EHR Implementation & Go-Live Command Center
#
# Nine rule_id blocks, >= 2 instances each (>= 18 instances). Every instance
# grounds in §1.1-§1.7 and every setup_api_calls/trigger chain is executable
# from empty DB against the §1.5 endpoint table.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: r1_empty_program_readiness_metric_variants_agree
        grounds:
          - calculations.readiness_posture_score
          - calculations.readiness_posture_score.variants.optimistic
          - entities.EhrImplementation.fields.readiness_score
          - entities.EhrImplementation.fields.optimistic_readiness_score
          - endpoints.GET_/ehr-implementations/{id}
        distinguishing_aspect: "On a brand-new EhrImplementation the pessimistic readiness_score and the optimistic variant both read 100.00 because no build item is BUILD_REJECTED — the two variants diverge only once mid-remediation work exists, so their agreement here is falsifiably tied to the empty-program state."
        test_recipe:
          setup:
            - "Empty database; logical clock at its startup default 2026-09-01T00:00:00Z."
          setup_api_calls:
            - &clk
              call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ImplementationDirector
            - &prog
              call: "POST /ehr-implementations"
              payload: { program_name: "Northline Health EHR", vendor_release: "2026.2", go_live_target_utc: "2026-12-01T00:00:00Z" }
              as: ImplementationDirector
              captures: { prog_id: $.data.id }
          trigger:
            - call: "GET /ehr-implementations/${prog_id}"
              payload: {}
              as: ImplementationDirector
              captures: { score: $.data.readiness_score, opp: $.data.optimistic_readiness_score }
          assert:
            - "the response status is 200 and response_type is object"
            - "EhrImplementation.${prog_id}.readiness_score == 100.00"
            - "EhrImplementation.${prog_id}.optimistic_readiness_score == 100.00"
            - "EhrImplementation.${prog_id}.readiness_posture == OPEN"

      - name: r1_optimistic_variant_discounts_remediation_capped_defect
        grounds:
          - calculations.readiness_posture_score.variants.optimistic
          - state_machines.SystemBuildItem.IN_TESTING_to_BUILD_REJECTED
          - state_machines.Department.BUILD_COMPLETE_to_BUILD_REJECTED
          - entities.EhrImplementation.fields.readiness_score
          - entities.EhrImplementation.fields.optimistic_readiness_score
        distinguishing_aspect: "For the identical SEV1 defect the pessimistic base reports 60.00 (the full 40-point department penalty) while the optimistic variant reports 95.00 (capped at 5 because the owning SystemBuildItem is BUILD_REJECTED); the two readings of one datum differ by exactly 35.00."
        test_recipe:
          setup:
            - "A program with one facility configured for build, one department marked BUILD_COMPLETE and one build item driven into BUILD_REJECTED by a failing SEV1 defect; the department is BUILD_REJECTED and the facility is REMEDIATION_REQUIRED."
          setup_api_calls:
            - *clk
            - *prog
            - &fac
              call: "POST /ehr-implementations/${prog_id}/facilities"
              payload: { name: "Northline Memorial", facility_type: "ACUTE_CARE", bed_count: 240, rollout_wave: 1, conversion_scope: "FULL_RECORD" }
              as: ImplementationDirector
              captures: { fac_id: $.data.id, fac_v0: $.data.version }
            - &dept
              call: "POST /facilities/${fac_id}/departments"
              payload: { department_code: "LAB", application_scope: ["LAB", "REPORTS"], required_staff_count: 1 }
              as: BuildAnalyst
              captures: { dept_id: $.data.id }
            - &item
              call: "POST /departments/${dept_id}/system-build-items"
              payload: { application_code: "LAB", build_classification: "LOCAL_CUSTOM", customization_depth: 3, local_custom_fields: ["F1", "F2", "F3"] }
              as: BuildAnalyst
              captures: { item_id: $.data.id }
            - &scen
              call: "POST /system-build-items/${item_id}/test-scenarios"
              payload: { scenario_class: "UNIT", step_count: 8 }
              as: TestLead
              captures: { scen_id: $.data.id }
            - call: "POST /system-build-items/${item_id}/start-build"
              payload: {}
              as: BuildAnalyst
            - call: "POST /system-build-items/${item_id}/complete-build"
              payload: {}
              as: BuildAnalyst
            - call: "POST /system-build-items/${item_id}/start-testing"
              payload: {}
              as: TestLead
            - &dept_cb
              call: "POST /departments/${dept_id}/complete-build"
              payload: {}
              as: BuildAnalyst
            - &fac_cfg
              call: "POST /facilities/${fac_id}/configure-build"
              payload: {}
              as: BuildAnalyst
            - call: "POST /test-scenarios/${scen_id}/execute"
              payload: { outcome: "FAIL", executed_epoch: 0 }
              as: TestLead
            - call: "POST /test-scenarios/${scen_id}/record-defect"
              payload: { defect_code: "LBL-9001", severity: "SEV1" }
              as: TestLead
              captures: { defect_id: $.data.id }
          trigger:
            - call: "GET /ehr-implementations/${prog_id}"
              payload: { posture_view: "OPTIMISTIC" }
              as: ImplementationDirector
              captures: { score: $.data.readiness_score, opp: $.data.optimistic_readiness_score }
          assert:
            - "the response status is 200"
            - "EhrImplementation.${prog_id}.readiness_score == 60.00"
            - "EhrImplementation.${prog_id}.optimistic_readiness_score == 95.00"
            - "EhrImplementation.${prog_id}.readiness_posture == OPEN (the boundary 60.00 is inclusive)"
            - "EhrImplementation.${prog_id}.readiness_score != EhrImplementation.${prog_id}.optimistic_readiness_score"
            - "SystemBuildItem.${item_id}.status == BUILD_REJECTED and Department.${dept_id}.status == BUILD_REJECTED"

      - name: r1_charge_capture_provisional_final_diverge_on_procedure
        grounds:
          - calculations.charge_capture_reconciliation
          - calculations.charge_capture_reconciliation.variants.provisional_vs_final
          - state_machines.PatientOrder.CONVERTED_to_RECONCILED
          - entities.PatientOrder.fields.charge_variance_cents
        distinguishing_aspect: "For one PROCEDURE order with legacy_charge_cents 10000 the provisional variant is 12500.00 while the final variant adds the rounded 3% OR gap for 12875.00; charge_variance_cents pins the 375.00 delta produced by the same input."
        test_recipe:
          setup:
            - "A program and a facility holding one converted PROCEDURE order with legacy_charge_cents 10000."
          setup_api_calls:
            - *clk
            - *prog
            - *fac
            - call: "POST /facilities/${fac_id}/patient-orders"
              payload: { patient_mrn: "MRN-4001", order_type: "PROCEDURE", encounter_utc: "2026-08-20T00:00:00Z", legacy_charge_cents: 10000 }
              as: ConversionAnalyst
              captures: { order_id: $.data.id, prov_create: $.data.provisional_charge_cents }
          trigger:
            - call: "GET /patient-orders/${order_id}"
              payload: {}
              as: ImplementationAnalyst
              captures: { prov: $.data.provisional_charge_cents, fin: $.data.final_charge_cents, var: $.data.charge_variance_cents }
          assert:
            - "PatientOrder.${order_id}.provisional_charge_cents == 12500.00"
            - "PatientOrder.${order_id}.final_charge_cents == 12500.00 while clinical_state == CONVERTED (the final variant is not published before reconciliation)"
            - "after POST /patient-orders/${order_id}/reconcile as OrderReconciler, PatientOrder.${order_id}.final_charge_cents == 12875.00"
            - "after reconciliation PatientOrder.${order_id}.charge_variance_cents == 375.00"

      - name: r1_conversion_variance_strict_threshold_vs_inclusive
        grounds:
          - calculations.conversion_reconciliation_variance
          - calculations.conversion_reconciliation_variance.variants.strict_threshold_vs_inclusive
          - state_machines.DataConversionBatch.VALIDATING_to_LOADED
          - state_machines.DataConversionBatch.VALIDATING_to_FAILED
          - errors.ERR_BALANCE_VARIANCE_EXCEEDED
        distinguishing_aspect: "For PATIENT_DEMOGRAPHICS loads the variance 1.00 percent exactly equals the 1.00 percent cap and must LOAD (strict >), while 2.00 percent must FAIL — the boundary case and the over-the-line case separate the two readings of the same threshold."
        test_recipe:
          setup:
            - "A program and a facility; the logical clock is at the program epoch 0."
          setup_api_calls:
            - *clk
            - *prog
            - *fac
            - call: "POST /facilities/${fac_id}/data-conversion-batches"
              payload: { payload_class: "PATIENT_DEMOGRAPHICS", attempt_epoch: 0, source_count: 1000, reconciled_count: 990, expected_facility_version: "${fac_v0}" }
              as: ConversionAnalyst
              captures: { batch_at_cap: $.data.id }
            - call: "GET /facilities/${fac_id}"
              payload: {}
              as: ImplementationAnalyst
              captures: { fac_v1: $.data.version }
            - call: "POST /facilities/${fac_id}/data-conversion-batches"
              payload: { payload_class: "PATIENT_DEMOGRAPHICS", attempt_epoch: 0, source_count: 1000, reconciled_count: 980, expected_facility_version: "${fac_v1}" }
              as: ConversionAnalyst
              captures: { batch_over: $.data.id }
          trigger:
            - call: "POST /data-conversion-batches/${batch_at_cap}/begin-validation"
              payload: {}
              as: ConversionAnalyst
              captures: { pen_at_cap: $.data.variance_penalty_points }
            - call: "POST /data-conversion-batches/${batch_at_cap}/load"
              payload: {}
              as: ConversionAnalyst
              captures: { st_at_cap: $.data.status }
            - call: "POST /data-conversion-batches/${batch_over}/begin-validation"
              payload: {}
              as: ConversionAnalyst
              captures: { pen_over: $.data.variance_penalty_points }
            - call: "POST /data-conversion-batches/${batch_over}/load"
              payload: {}
              as: ConversionAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "DataConversionBatch.${batch_at_cap}.variance_penalty_points == 1.00 and status == LOADED"
            - "GET /facilities/${fac_id} reports Facility.${fac_id}.converted_patient_count == 990"
            - "DataConversionBatch.${batch_over}.variance_penalty_points == 2.00"
            - "the second load returns 422 and error_id == ERR_BALANCE_VARIANCE_EXCEEDED"
            - "DataConversionBatch.${batch_over}.status == VALIDATING (a strict > comparison lets the at-cap batch through and rejects only the over-cap batch)"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: r2_customization_risk_tiered_marginal_allocation_at_unit_cap
        grounds:
          - calculations.build_customization_risk
          - entities.SystemBuildItem.fields.customization_risk_points
          - state_machines.SystemBuildItem.IN_BUILD_to_BUILD_COMPLETE
        distinguishing_aspect: "Model (a): three inputs interact non-linearly — 12 locally customized fields (marginal tiers 2/3/5 points capped at unit 12), a LOCAL_CUSTOM weight of 2.0 applied after the tier sum, and a depth-2 multiplier of 1.15 applied after the weight, rounded once to 92.00; a 13th field changes nothing because the unit cap binds."
        test_recipe:
          setup:
            - "A program, facility and department; one LOCAL_CUSTOM build item with 12 locally customized fields and customization_depth 2."
          setup_api_calls:
            - *clk
            - *prog
            - *fac
            - *dept
            - call: "POST /departments/${dept_id}/system-build-items"
              payload: { application_code: "LAB", build_classification: "LOCAL_CUSTOM", customization_depth: 2, local_custom_fields: ["CF01", "CF02", "CF03", "CF04", "CF05", "CF06", "CF07", "CF08", "CF09", "CF10", "CF11", "CF12"] }
              as: BuildAnalyst
              captures: { item_id: $.data.id }
            - call: "POST /system-build-items/${item_id}/start-build"
              payload: {}
              as: BuildAnalyst
          trigger:
            - call: "POST /system-build-items/${item_id}/complete-build"
              payload: {}
              as: BuildAnalyst
              captures: { risk: $.data.customization_risk_points }
          assert:
            - "the response status is 200"
            - "SystemBuildItem.${item_id}.status == BUILD_COMPLETE"
            - "SystemBuildItem.${item_id}.customization_risk_points == 92.00"
            - "the tier sum before weighting is 40 = 2*4 + 3*4 + 5*4"
            - "SystemBuildItem.${item_id}.customization_risk_points != 138.00 (the naive reading that charges every unit the tier-3 rate ignores the marginal tiers)"

      - name: r2_charge_capture_per_line_rounding_order
        grounds:
          - calculations.charge_capture_reconciliation
          - entities.PatientOrder.fields.provisional_charge_cents
          - endpoints.POST_/facilities/{id}/patient-orders
        distinguishing_aspect: "Model (b): nested rounding where the order is pinned to round-each-line-then-sum — for an IMAGING order with legacy_charge_cents 12345 the three lines round to 12345.00 + 1543.13 + 925.88 = 14814.01, whereas rounding the pre-rounded sum instead yields 14814.00 and truncating each line yields 14813.00."
        test_recipe:
          setup:
            - "A program and a facility holding one converted IMAGING order with legacy_charge_cents 12345."
          setup_api_calls:
            - *clk
            - *prog
            - *fac
            - call: "POST /facilities/${fac_id}/patient-orders"
              payload: { patient_mrn: "MRN-4002", order_type: "IMAGING", encounter_utc: "2026-08-28T00:00:00Z", legacy_charge_cents: 12345 }
              as: ConversionAnalyst
              captures: { order_id: $.data.id }
          trigger:
            - call: "GET /patient-orders/${order_id}"
              payload: {}
              as: ImplementationAnalyst
              captures: { prov: $.data.provisional_charge_cents }
          assert:
            - "PatientOrder.${order_id}.provisional_charge_cents == 14814.01"
            - "PatientOrder.${order_id}.provisional_charge_cents != 14814.00"
            - "PatientOrder.${order_id}.provisional_charge_cents != 14813.00"
            - "the three rounded line amounts are exactly 12345.00, 1543.13 and 925.88 and their sum equals the pinned provisional charge"

      - name: r2_command_center_sla_three_input_nonlinear_interaction
        grounds:
          - calculations.command_center_sla_minutes
          - entities.CommandCenterTicket.fields.resolution_sla_minutes
          - endpoints.POST_/command-center-tickets
        distinguishing_aspect: "Model (a): three inputs combine multiplicatively with a conditional branch — a SEV1 severity weight of 0.25, a RADIOLOGY zone modifier of 1.10 and a zero-coverage branch of 0.50 multiply a 60-minute base to 8 for SEV1/ED covered and to 33 for SEV3/RADIOLOGY uncovered, so the coverage factor is applied only when no covering shift is end_utc > clock."
        test_recipe:
          setup:
            - "A program and a facility; no AT_THE_ELBOW shift is active, so the coverage modifier branch fires."
          setup_api_calls:
            - *clk
            - *prog
            - *fac
          trigger:
            - call: "POST /command-center-tickets"
              payload: { facility_id: "${fac_id}", target_ref: "${fac_id}", severity: "SEV3", at_the_elbow_zone: "RADIOLOGY" }
              as: CommandCenterLead
              captures: { ticket_uncovered: $.data.id, sla_uncovered: $.data.resolution_sla_minutes }
          assert:
            - "the response status is 201"
            - "CommandCenterTicket.${ticket_uncovered}.resolution_sla_minutes == 33"
            - "after a covering shift exists the same input reports a different SLA: POST /staffing-shifts with support_role AT_THE_ELBOW for a credentialled staffer, then schedule a SEV3/RADIOLOGY ticket reports resolution_sla_minutes == 66"
            - "CommandCenterTicket.${ticket_uncovered}.severity == SEV3 and triage_state == REPORTED"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: r3_patient_order_parallel_dimensions_advance_independently
        grounds:
          - state_machines.PatientOrder.CONVERTED_to_RECONCILED
          - state_machines.PatientOrder.UNPOSTED_to_CHARGE_POSTED
          - state_machines.PatientOrder.CLAIM_SUBMITTED_to_CLAIM_DENIED
          - entities.PatientOrder.fields.clinical_state
          - entities.PatientOrder.fields.billing_state
        distinguishing_aspect: "PatientOrder carries two independent state dimensions on one row: clinical_state walks CONVERTED -> RECONCILED while billing_state walks UNPOSTED -> CHARGE_POSTED -> CLAIM_SUBMITTED -> CLAIM_DENIED, and a claim denial leaves clinical_state at RECONCILED — a linear single-axis machine cannot represent the resulting (RECONCILED, CLAIM_DENIED) pair."
        test_recipe:
          setup:
            - "A program and a facility holding one converted MEDICATION order."
          setup_api_calls:
            - *clk
            - *prog
            - *fac
            - call: "POST /facilities/${fac_id}/patient-orders"
              payload: { patient_mrn: "MRN-5001", order_type: "MEDICATION", encounter_utc: "2026-08-25T00:00:00Z", legacy_charge_cents: 25000 }
              as: ConversionAnalyst
              captures: { order_id: $.data.id }
          trigger:
            - call: "POST /patient-orders/${order_id}/post-charge"
              payload: {}
              as: RevenueCycleAnalyst
              captures: { bill1: $.data.billing_state, clin1: $.data.clinical_state }
            - call: "POST /patient-orders/${order_id}/reconcile"
              payload: {}
              as: OrderReconciler
              captures: { clin2: $.data.clinical_state, bill2: $.data.billing_state }
            - call: "POST /patient-orders/${order_id}/submit-claim"
              payload: {}
              as: RevenueCycleAnalyst
              captures: { bill3: $.data.billing_state }
            - call: "POST /patient-orders/${order_id}/record-claim-response"
              payload: { claim_response: "DENIED" }
              as: RevenueCycleAnalyst
              captures: { bill4: $.data.billing_state, clin4: $.data.clinical_state }
          assert:
            - "after post-charge billing_state == CHARGE_POSTED while clinical_state == CONVERTED"
            - "after reconcile clinical_state == RECONCILED while billing_state == CHARGE_POSTED"
            - "after submit-claim billing_state == CLAIM_SUBMITTED and clinical_state == RECONCILED"
            - "after the denial billing_state == CLAIM_DENIED and clinical_state is still RECONCILED (the two dimensions are independent)"

      - name: r3_build_item_reject_then_rework_cycle_closes
        grounds:
          - state_machines.SystemBuildItem.IN_TESTING_to_BUILD_REJECTED
          - state_machines.SystemBuildItem.BUILD_REJECTED_to_IN_BUILD
          - state_machines.SystemBuildItem.IN_BUILD_to_BUILD_COMPLETE
          - state_machines.SystemBuildItem.BUILD_COMPLETE_to_IN_TESTING
          - entities.SystemBuildItem.fields.rejection_count
        distinguishing_aspect: "SystemBuildItem is cyclic: a failing scenario drives IN_TESTING -> BUILD_REJECTED, rework drives BUILD_REJECTED -> IN_BUILD, and re-completing build and re-entering testing returns the item to IN_TESTING with rejection_count incremented — a strictly linear pipeline could never revisit IN_TESTING."
        test_recipe:
          setup:
            - "A program, facility and department; one UNIT build item with one defined scenario."
          setup_api_calls:
            - *clk
            - *prog
            - *fac
            - *dept
            - *item
            - *scen
            - call: "POST /system-build-items/${item_id}/start-build"
              payload: {}
              as: BuildAnalyst
            - call: "POST /system-build-items/${item_id}/complete-build"
              payload: {}
              as: BuildAnalyst
            - call: "POST /system-build-items/${item_id}/start-testing"
              payload: {}
              as: TestLead
              captures: { status_before: $.data.status }
          trigger:
            - call: "POST /test-scenarios/${scen_id}/execute"
              payload: { outcome: "FAIL", executed_epoch: 0 }
              as: TestLead
            - call: "GET /system-build-items/${item_id}"
              payload: {}
              as: TestLead
              captures: { status_rejected: $.data.status, rej1: $.data.rejection_count }
            - call: "POST /system-build-items/${item_id}/rework"
              payload: {}
              as: BuildAnalyst
              captures: { status_rework: $.data.status }
            - call: "POST /system-build-items/${item_id}/complete-build"
              payload: {}
              as: BuildAnalyst
            - call: "POST /system-build-items/${item_id}/start-testing"
              payload: {}
              as: TestLead
              captures: { status_back: $.data.status, rej2: $.data.rejection_count }
          assert:
            - "the item entered testing as IN_TESTING before the failure"
            - "after the failing execute the item status is BUILD_REJECTED and rejection_count == 1"
            - "after rework the item status is IN_BUILD"
            - "after complete-build and start-testing the item status is IN_TESTING again with rejection_count == 1 (the cycle closed without a second rejection)"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: r4_defect_resolution_four_hop_cascade
        grounds:
          - state_machines.TestDefect.IN_REMEDIATION_to_RESOLVED
          - state_machines.TestScenario.DEFINED_to_FAILED
          - state_machines.SystemBuildItem.IN_TESTING_to_BUILD_REJECTED
          - state_machines.Department.BUILD_COMPLETE_to_BUILD_REJECTED
          - state_machines.Department.BUILD_REJECTED_to_BUILD_COMPLETE
          - state_machines.Facility.BUILD_CONFIGURED_to_REMEDIATION_REQUIRED
        distinguishing_aspect: "Resolving one SEV1 defect propagates through four dependent hops — TestDefect -> TestScenario.open_defect_count -> SystemBuildItem.open_defect_count -> Department (build_blocking_defect_count then BUILD_REJECTED -> BUILD_COMPLETE) -> Facility (REMEDIATION_REQUIRED -> BUILD_CONFIGURED) — where each hop is caused by the previous hop's mutation, giving a depth-4 chain."
        test_recipe:
          setup:
            - "A program with one facility configured for build, one department marked BUILD_COMPLETE and a build item driven into BUILD_REJECTED by a SEV1 defect; the department is BUILD_REJECTED and the facility is REMEDIATION_REQUIRED."
          setup_api_calls:
            - *clk
            - *prog
            - *fac
            - *dept
            - *item
            - *scen
            - call: "POST /system-build-items/${item_id}/start-build"
              payload: {}
              as: BuildAnalyst
            - call: "POST /system-build-items/${item_id}/complete-build"
              payload: {}
              as: BuildAnalyst
            - call: "POST /system-build-items/${item_id}/start-testing"
              payload: {}
              as: TestLead
            - *dept_cb
            - *fac_cfg
            - call: "POST /test-scenarios/${scen_id}/execute"
              payload: { outcome: "FAIL", executed_epoch: 0 }
              as: TestLead
            - call: "POST /test-scenarios/${scen_id}/record-defect"
              payload: { defect_code: "LBL-9101", severity: "SEV1" }
              as: TestLead
              captures: { defect_id: $.data.id }
            - call: "GET /facilities/${fac_id}"
              payload: {}
              as: ImplementationAnalyst
              captures: { fac_pre: $.data.status }
            - call: "GET /departments/${dept_id}"
              payload: {}
              as: ImplementationAnalyst
              captures: { dept_pre: $.data.status, block_pre: $.data.build_blocking_defect_count }
          trigger:
            - call: "POST /test-defects/${defect_id}/begin-remediation"
              payload: {}
              as: BuildAnalyst
            - call: "POST /test-defects/${defect_id}/resolve"
              payload: {}
              as: BuildAnalyst
            - call: "GET /test-scenarios/${scen_id}"
              payload: {}
              as: TestLead
              captures: { scen_odc: $.data.open_defect_count }
            - call: "GET /system-build-items/${item_id}"
              payload: {}
              as: TestLead
              captures: { item_odc: $.data.open_defect_count, item_status: $.data.status }
            - call: "GET /departments/${dept_id}"
              payload: {}
              as: ImplementationAnalyst
              captures: { dept_post: $.data.status, block_post: $.data.build_blocking_defect_count }
            - call: "GET /facilities/${fac_id}"
              payload: {}
              as: ImplementationAnalyst
              captures: { fac_post: $.data.status }
          assert:
            - "the facility was REMEDIATION_REQUIRED and the department BUILD_REJECTED before resolution with build_blocking_defect_count == 1"
            - "link 1: TestScenario.${scen_id}.open_defect_count == 0"
            - "link 2: SystemBuildItem.${item_id}.open_defect_count == 0"
            - "link 3: Department.${dept_id}.build_blocking_defect_count == 0 and status == BUILD_COMPLETE"
            - "link 4: Facility.${fac_id}.status == BUILD_CONFIGURED"
            - "TestDefect.${defect_id}.status == RESOLVED and blocks_go_live == false"

      - name: r4_interface_message_rejection_two_hop_cascade
        grounds:
          - state_machines.InterfaceMessage.RECEIVED_to_REJECTED
          - state_machines.InterfaceChannel.IN_MESSAGE_VALIDATION_to_VALIDATION_FAILED
          - state_machines.InterfaceChannel.VALIDATION_FAILED_to_BUILDING
          - entities.InterfaceChannel.fields.rejected_message_count
        distinguishing_aspect: "Receiving one malformed message cascades two hops — the InterfaceMessage transitions RECEIVED -> REJECTED, and that rejection in turn drives the owning InterfaceChannel IN_MESSAGE_VALIDATION -> VALIDATION_FAILED with rejected_message_count incremented; the channel transition is caused by the message's mutation, not by the receive request."
        test_recipe:
          setup:
            - "A program with one LAB interface channel under build."
          setup_api_calls:
            - *clk
            - *prog
            - call: "POST /ehr-implementations/${prog_id}/interface-channels"
              payload: { channel_type: "LAB", external_system: "Sysmex", message_format: "HL7_V2", throughput_per_hour: 500, max_latency_minutes: 5 }
              as: InterfaceEngineer
              captures: { ch_id: $.data.id }
            - call: "POST /interface-channels/${ch_id}/begin-build"
              payload: {}
              as: InterfaceEngineer
            - call: "POST /interface-channels/${ch_id}/begin-validation"
              payload: {}
              as: InterfaceEngineer
              captures: { ch_pre: $.data.status }
          trigger:
            - call: "POST /interface-channels/${ch_id}/messages"
              payload: { message_code: "DICOM_STOW", direction: "INBOUND", sent_utc: "2026-09-01T00:00:00Z" }
              as: InterfaceEngineer
              captures: { msg_id: $.data.id }
            - call: "GET /interface-channels/${ch_id}"
              payload: {}
              as: InterfaceEngineer
              captures: { ch_post: $.data.status, rej: $.data.rejected_message_count }
            - call: "GET /interface-messages/${msg_id}"
              payload: {}
              as: InterfaceEngineer
              captures: { msg_status: $.data.validation_status, msg_err: $.data.validation_error_code }
          assert:
            - "the channel entered validation as IN_MESSAGE_VALIDATION"
            - "hop 1: InterfaceMessage.${msg_id}.validation_status == REJECTED and validation_error_code == ERR_INTERFACE_MESSAGE_INVALID"
            - "hop 2: InterfaceChannel.${ch_id}.status == VALIDATION_FAILED"
            - "InterfaceChannel.${ch_id}.rejected_message_count == 1"
            - "after POST /interface-channels/${ch_id}/return-to-build as InterfaceEngineer, InterfaceChannel.${ch_id}.status == BUILDING and rejected_message_count == 0"

  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: r5a_state_precedes_safety_on_submit_claim
        grounds:
          - validations[priority=9]
          - validations[priority=13]
          - errors.ERR_INVALID_STATE
          - errors.ERR_ORDER_NOT_RECONCILED
          - endpoints.POST_/patient-orders/{id}/submit-claim
        distinguishing_aspect: "One request violates both the state precondition (billing_state UNPOSTED instead of CHARGE_POSTED, priority 9) and the clinical-safety rule (clinical_state not RECONCILED, priority 13); the state error wins, so error_id is ERR_INVALID_STATE and not ERR_ORDER_NOT_RECONCILED."
        test_recipe:
          setup:
            - "A program and a facility holding one converted order that has never been charged or reconciled."
          setup_api_calls:
            - *clk
            - *prog
            - *fac
            - call: "POST /facilities/${fac_id}/patient-orders"
              payload: { patient_mrn: "MRN-6001", order_type: "LAB", encounter_utc: "2026-08-27T00:00:00Z", legacy_charge_cents: 10000 }
              as: ConversionAnalyst
              captures: { order_id: $.data.id }
          trigger:
            - call: "POST /patient-orders/${order_id}/submit-claim"
              payload: {}
              as: RevenueCycleAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_INVALID_STATE"
            - "error_id != ERR_ORDER_NOT_RECONCILED"
            - "PatientOrder.${order_id}.billing_state == UNPOSTED and clinical_state == CONVERTED (the failed request changed nothing)"

      - name: r5b_state_precedes_fiscal_on_batch_load
        grounds:
          - validations[priority=12]
          - validations[priority=29]
          - errors.ERR_EPOCH_MISMATCH
          - errors.ERR_BALANCE_VARIANCE_EXCEEDED
          - endpoints.POST_/data-conversion-batches/{id}/load
        distinguishing_aspect: "One load request violates both the epoch state rule (attempt_epoch no longer equals current_epoch_index, priority 12) and the fiscal variance cap (priority 29); the state error wins, so error_id is ERR_EPOCH_MISMATCH and not ERR_BALANCE_VARIANCE_EXCEEDED. This is a different error-category pair from the state-vs-business_safety conflict of the sibling instance."
        test_recipe:
          setup:
            - "A program and facility; a PATIENT_DEMOGRAPHICS batch with a 10 percent variance, validated at epoch 0, then the program advanced to epoch 1."
          setup_api_calls:
            - *clk
            - *prog
            - *fac
            - call: "POST /facilities/${fac_id}/data-conversion-batches"
              payload: { payload_class: "PATIENT_DEMOGRAPHICS", attempt_epoch: 0, source_count: 1000, reconciled_count: 900, expected_facility_version: "${fac_v0}" }
              as: ConversionAnalyst
              captures: { batch_id: $.data.id }
            - call: "POST /data-conversion-batches/${batch_id}/begin-validation"
              payload: {}
              as: ConversionAnalyst
              captures: { pen: $.data.variance_penalty_points }
            - call: "POST /ehr-implementations/${prog_id}/advance-epoch"
              payload: {}
              as: ImplementationDirector
              captures: { epoch: $.data.current_epoch_index }
          trigger:
            - call: "POST /data-conversion-batches/${batch_id}/load"
              payload: {}
              as: ConversionAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "the batch variance_penalty_points == 10.00, which also breaches the PATIENT_DEMOGRAPHICS cap"
            - "the response status is 409 and error_id == ERR_EPOCH_MISMATCH"
            - "error_id != ERR_BALANCE_VARIANCE_EXCEEDED"
            - "DataConversionBatch.${batch_id}.status is still VALIDATING"

      - name: r5c_constraint_precedes_temporal_on_unverified_proctor
        grounds:
          - validations[priority=4]
          - validations[priority=18]
          - errors.ERR_UNVERIFIED_TRAINER
          - errors.ERR_RETEST_COOLDOWN_ACTIVE
          - endpoints.POST_/proficiency-exams/{id}/record-result
        distinguishing_aspect: "One record-result request is made by a proctor whose certification was revoked (priority 4) and before the retake cooldown has elapsed (priority 18); the credential error wins, so error_id is ERR_UNVERIFIED_TRAINER and not ERR_RETEST_COOLDOWN_ACTIVE — a business_constraint-vs-business_temporal pair distinct from both sibling conflicts."
        test_recipe:
          setup:
            - "A program, facility, department and staff member; a trainer certified, then a failed exam, then the trainer revoked; a second exam scheduled."
          setup_api_calls:
            - *clk
            - *prog
            - *fac
            - *dept
            - call: "POST /ehr-implementations/${prog_id}/staffs"
              payload: { full_name: "Nina Okafor", staff_type: "NURSE", primary_facility_id: "${fac_id}", department_id: "${dept_id}", hired_on: "2026-01-05T00:00:00Z" }
              as: TrainingCoordinator
              captures: { staff_id: $.data.id, staff_v0: $.data.version }
            - call: "POST /staffs/${staff_id}/credentialed-trainers"
              payload: { application_code: "CLN", certification_level: "STANDARD", observation_hours: 8, expected_staff_version: "${staff_v0}" }
              as: TrainingCoordinator
              captures: { trainer_id: $.data.id }
            - call: "POST /credentialed-trainers/${trainer_id}/certify"
              payload: {}
              as: TrainingCoordinator
              captures: { trainer_status: $.data.status }
            - call: "POST /staffs/${staff_id}/proficiency-exams"
              payload: { application_code: "CLN", proctored_by_trainer_id: "${trainer_id}" }
              as: TrainingCoordinator
              captures: { exam1: $.data.id }
            - call: "POST /proficiency-exams/${exam1}/record-result"
              payload: { exam_score: 60 }
              as: CredentialedTrainer
              as_user_id: "${trainer_id}"
              captures: { cooldown_until: $.data.next_attempt_eligible_utc }
            - call: "POST /credentialed-trainers/${trainer_id}/revoke"
              payload: {}
              as: TrainingCoordinator
            - call: "POST /staffs/${staff_id}/proficiency-exams"
              payload: { application_code: "CLN", proctored_by_trainer_id: "${trainer_id}" }
              as: TrainingCoordinator
              captures: { exam2: $.data.id }
          trigger:
            - call: "POST /proficiency-exams/${exam2}/record-result"
              payload: { exam_score: 90 }
              as: CredentialedTrainer
              as_user_id: "${trainer_id}"
              captures: { err: $.data.error_id }
          assert:
            - "the clock is 2026-09-01, strictly before the cooldown instant ${cooldown_until}"
            - "the response status is 403 and error_id == ERR_UNVERIFIED_TRAINER"
            - "error_id != ERR_RETEST_COOLDOWN_ACTIVE"
            - "ProficiencyExam.${exam2}.status is still SCHEDULED"

