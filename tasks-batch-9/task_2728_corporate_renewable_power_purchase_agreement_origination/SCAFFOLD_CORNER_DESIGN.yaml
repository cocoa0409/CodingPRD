          assert:
            - "both creations return 201 with project_id ${project_id} and anchor_offtaker_id ${buyer_id}, so one project and one buyer carry two independent links"
            - "Deal.${node_deal}.settlement_point_id == ${node_id} equals the project's own node, while Deal.${hub_deal}.settlement_point_id == ${hub_id} does not - settling off-node is permitted, not an error"
            - "Deal.${node_deal}.contract_price_usd_per_mwh == 22.00 = 22.0000 escalated_base + 0.00 AS_GENERATED premium + 0.00 BUYER basis adder, and Deal.${hub_deal}.contract_price_usd_per_mwh == 23.50 = 22.0000 + 0.00 + 1.50 SELLER basis adder"
            - "the settlement_point_id filter returns exactly one row, ${hub_deal}, proving the link is stored per deal rather than inherited from the project"
            - "GET /ppa/projects/${project_id} reports node_id ${node_id} unchanged, contracted_mw 55.000 = 25.000 + 30.000 and available_mw 45.000: both creations booked capacity against the project, and the project's own node_id is untouched by the hub-settled deal"

      - name: submit_qualification_moves_the_buyer_and_computes_the_whole_score_chain
        claim_type: action_endpoint
        grounds:
          - endpoints.POST_/ppa/offtakers/{id}/submit-qualification
          - state_machines.Offtaker.DRAFT_to_UNDER_REVIEW
        excluded_because:
          difficulty_instance: "dual_variant_calc / credit_score_guarantor_supported_versus_standalone_diverges_by_24_95"
          rationale: |
            That §1.8 instance drives submit-qualification twice and asserts the full
            side-effect list of the DRAFT to UNDER_REVIEW transition - credit_score,
            credit_score_variant, credit_tier, sustainability_score and
            unsecured_credit_limit_usd - once per variant, plus the transition itself.
            The action-endpoint row for this endpoint is therefore already discharged,
            and its precondition limb is covered by the state_machines section's
            invalid-from instance above.

      - name: settlement_period_read_reports_the_derived_net_settlement_amount
        claim_type: computed_read
        grounds:
          - endpoints.GET_/ppa/settlement-periods/{id}
          - calculations.settlement_netting
        excluded_because:
          difficulty_instance: "dual_variant_calc / settlement_netting_hourly_versus_monthly_diverges_by_50_00"
          rationale: |
            The derived-data claim for this read is the netting result itself, and the
            §1.8 instance builds two periods over identical intervals, advances both and
            reads both back, asserting net_settlement_usd for each netting method
            along with the per-interval components. A separate corner instance would
            re-read the same computed field with weaker inputs.

      - name: execute_is_permitted_only_under_the_full_signing_condition_set
        claim_type: conditional_action
        grounds:
          - endpoints.POST_/ppa/deals/{id}/execute
          - validations.priority_8_ERR_INVALID_STATE_TRANSITION
          - validations.priority_11_ERR_OFFTAKER_NOT_QUALIFIED
        excluded_because:
          difficulty_instance: "cross_entity_state_dependency / execute_blocked_by_conditional_then_under_review_anchor_offtaker"
          rationale: |
            That §1.8 instance walks the conditional-action row directly: the same
            execute call is refused while the anchor buyer is CONDITIONAL, refused again
            while the buyer is UNDER_REVIEW after a rating change, and admitted once the
            buyer is QUALIFIED, with the deal itself unchanged throughout. The
            remaining execute conditions (allocation completeness and collateral
            coverage) are covered by the cascading-validation instance above.

  # ---------------------------------------------------------------------------
  # Guide section 6: Errors. The catalog has 44 codes; this section walks the
  # ones no earlier section already triggers. Discharged elsewhere and therefore
  # not repeated here: ERR_INVALID_REQUEST and the field/enum/default codes
  # (entities section), ERR_INVALID_STATE_TRANSITION (state_machines and the
  # validations priority-ordering instance), ERR_DUPLICATE_ALLOCATION,
  # ERR_ROUND_EXPIRED, ERR_INSTRUMENT_TENOR_TOO_SHORT,
  # ERR_ALLOCATION_EXCEEDS_CONTRACTED_MW, ERR_ALLOCATION_INCOMPLETE and
  # ERR_CREDIT_SUPPORT_SHORTFALL (validations section), ERR_UNAUTHENTICATED,
  # ERR_ROLE_NOT_PERMITTED, ERR_NOT_DEAL_COUNTERPARTY and
  # ERR_SEGREGATION_OF_DUTIES (rbac section), ERR_STALE_VERSION (cross-cutting
  # optimistic-concurrency section), ERR_INVALID_WINDOW and
  # ERR_RISK_WINDOW_OVERLAP on the risk-claim path (§1.8 priority pair, stubbed
  # in the validations section above).
  # ---------------------------------------------------------------------------
  - section: errors
    instances:

      - name: deal_create_body_references_return_the_owning_entity_not_found
        claim_type: violation_to_error
        grounds:
          - errors[ERR_PROJECT_NOT_FOUND]
          - errors[ERR_OFFTAKER_NOT_FOUND]
          - errors[ERR_PRICING_NODE_NOT_FOUND]
          - validations.priority_5_ERR_<ENTITY>_NOT_FOUND
        distinguishing_aspect: |
          One endpoint carries three foreign keys, so the 404 must name the entity of
          the offending FIELD rather than a generic not-found: project_id resolves to
          ERR_PROJECT_NOT_FOUND, anchor_offtaker_id to ERR_OFFTAKER_NOT_FOUND and
          settlement_point_id to ERR_PRICING_NODE_NOT_FOUND. Each attempt keeps the
          other two references valid, so exactly one limb can be responsible, and no
          Deal row and no Project capacity change may result from any of them.
        test_recipe:
          setup:
            - "One node, one QUALIFIED buyer and one 100.000 MW project all exist, so each failing call differs from a working call in exactly one field."
          setup_api_calls:
            - call: "POST /ppa/pricing-nodes"
              payload: { name: "KRAMER JUNCTION 1N", iso: "CAISO", settlement_point_type: "NODE" }
              as: Originator
              as_user_id: "u_orig_1"
              captures: { node_id: $.data.id }
            - call: "POST /ppa/offtakers"
              payload: { legal_name: "Northwind Retail Inc", credit_rating: "A", rating_agency: "SP", reported_ebitda_usd: 60000000.00, net_debt_to_ebitda: 2.5, disclosure_framework: "CDP_AND_TCFD", has_science_based_target: true, re100_member: true, scope2_target_year: 2030, registry_account_id: "WREGIS-ACC-00417" }
              as: Originator
              as_user_id: "u_orig_1"
              captures: { buyer_id: $.data.id }
            - call: "POST /ppa/offtakers/${buyer_id}/submit-qualification"
              payload: {}
              as: Originator
              as_user_id: "u_orig_1"
            - call: "POST /ppa/offtakers/${buyer_id}/qualification-decision"
              payload: { decision: "QUALIFY" }
              as: CreditOfficer
              as_user_id: "u_credit_1"
            - call: "POST /ppa/projects"
              payload: { name: "Kramer Junction Solar I", technology: "SOLAR", capacity_mw: 100.000, node_id: "${node_id}", cod_target_date: "2029-06-01T00:00:00Z", p50_annual_mwh: 245280.00 }
              as: Originator
              as_user_id: "u_orig_1"
              captures: { project_id: $.data.id }
          trigger:
            - call: "POST /ppa/deals"
              payload: { project_id: "00000000-0000-4000-8000-0000000000c1", anchor_offtaker_id: "${buyer_id}", settlement_point_id: "${node_id}", product_type: "VIRTUAL_CFD", contracted_mw: 25.000, term_years: 12, first_delivery_year: 2026, commercial_operation_deadline: "2029-12-31T00:00:00Z", settlement_frequency: "HOURLY", base_fixed_price_usd_per_mwh: 22.00, escalation_pct_per_year: 0.0, shape_product: "AS_GENERATED", basis_responsibility: "SHARED" }
              as: Originator
              as_user_id: "u_orig_1"
            - call: "POST /ppa/deals"
              payload: { project_id: "${project_id}", anchor_offtaker_id: "00000000-0000-4000-8000-0000000000c2", settlement_point_id: "${node_id}", product_type: "VIRTUAL_CFD", contracted_mw: 25.000, term_years: 12, first_delivery_year: 2026, commercial_operation_deadline: "2029-12-31T00:00:00Z", settlement_frequency: "HOURLY", base_fixed_price_usd_per_mwh: 22.00, escalation_pct_per_year: 0.0, shape_product: "AS_GENERATED", basis_responsibility: "SHARED" }
              as: Originator
              as_user_id: "u_orig_1"
            - call: "POST /ppa/deals"
              payload: { project_id: "${project_id}", anchor_offtaker_id: "${buyer_id}", settlement_point_id: "00000000-0000-4000-8000-0000000000c3", product_type: "VIRTUAL_CFD", contracted_mw: 25.000, term_years: 12, first_delivery_year: 2026, commercial_operation_deadline: "2029-12-31T00:00:00Z", settlement_frequency: "HOURLY", base_fixed_price_usd_per_mwh: 22.00, escalation_pct_per_year: 0.0, shape_product: "AS_GENERATED", basis_responsibility: "SHARED" }
              as: Originator
