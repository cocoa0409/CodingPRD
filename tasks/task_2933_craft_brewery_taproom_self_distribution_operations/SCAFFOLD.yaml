  # --- writes ----------------------------------------------------------------
  - method: POST
    path: "/brewery"
    description: "Create the brewery singleton; notice_status starts at PENDING_NOTICE so nothing is sellable yet"
    roles: [BreweryAdmin]
    code: 201
    input: [legal_name, home_state_code, ttb_brewers_notice_number]
    output: Brewery
    side_effects: ["notice_status = PENDING_NOTICE", "carry_in_taproom_bbl and carry_in_distribution_bbl = 0.000", "second call rejected with ERR_BREWERY_ALREADY_EXISTS"]

  - method: POST
    path: "/brewery/notice"
    description: "StateRegulator drives the brewer's notice: ACTIVATE, SUSPEND, REINSTATE or REVOKE"
    roles: [StateRegulator]
    code: 200
    input: [action, "reason?"]
    output: Brewery
    side_effects: ["notice_status transition per §1.2", "SUSPEND/REVOKE run the depth-3 cascade: licenses SUSPENDED -> their SUBMITTED/ALLOCATED orders REJECTED (NOTICE_SUSPENDED) -> allocation lines released back to PackagingRun.available_bbl", "REINSTATE returns unexpired licenses to ACTIVE but never revives rejected orders", "re-derives taproom_sellable and distribution_sellable on every Beer", "increments Brewery.version"]

  - method: POST
    path: "/brewery/ytd-adjustments"
    description: "Record pre-go-live barrels already removed this calendar year, so excise tier tests can start near a tier boundary"
    roles: [ComplianceOfficer]
    code: 200
    input: [carry_in_taproom_bbl, carry_in_distribution_bbl]
    output: Brewery
    side_effects: ["overwrites both carry-in fields", "taproom_bbl_ytd, distribution_bbl_ytd and total_bbl_ytd re-derived", "shifts ytd_bbl_before_period for every subsequent excise report", "increments Brewery.version"]

  - method: POST
    path: "/beers"
    description: "Register a brand; requires_formula false mints registration_state FORMULA_EXEMPT, true mints DRAFT"
    roles: [BreweryAdmin, ComplianceOfficer]
    code: 201
    input: [name, style, abv_pct, price_per_bbl_cents, "requires_formula?"]
    output: Beer
    side_effects: ["registration_state = DRAFT or FORMULA_EXEMPT", "label_state = NO_LABEL", "taproom_sellable and distribution_sellable derived (both false until the notice is ACTIVE)"]

  - method: POST
    path: "/beers/{beerId}/filings"
    description: "File a TTB submission for the beer: filing_type FORMULA advances registration_state, LABEL advances label_state"
    roles: [ComplianceOfficer]
    code: 200
    input: [filing_type, "ingredient_list?", "label_fields?"]
    output: Beer
    side_effects: ["FORMULA: DRAFT -> FORMULA_PENDING, requires a non-empty ingredient_list", "LABEL: NO_LABEL or COLA_REVOKED -> COLA_PENDING, stores label_fields and clears cola_id", "the other dimension is untouched", "increments Beer.version"]

  - method: POST
    path: "/beers/{beerId}/filings/{filingType}/decision"
    description: "StateRegulator decides a pending filing: APPROVED, REJECTED, or REVOKED for an approved COLA"
    roles: [StateRegulator]
    code: 200
    input: [decision, "cola_id?", "note?"]
    output: Beer
    side_effects: ["FORMULA APPROVED -> FORMULA_APPROVED, REJECTED -> back to DRAFT", "LABEL APPROVED -> COLA_APPROVED and stores cola_id, REJECTED -> NO_LABEL and clears label_fields", "LABEL REVOKED -> COLA_REVOKED plus the depth-2 cascade: this beer's SUBMITTED/ALLOCATED orders become REJECTED (LABEL_REVOKED) and their allocation lines are released", "re-derives taproom_sellable and distribution_sellable", "increments Beer.version"]

  - method: POST
    path: "/tanks"
    description: "Add a cellar vessel; it starts IDLE"
    roles: [BreweryAdmin, CellarOperator]
    code: 201
    input: [code, tank_type, capacity_bbl]
    output: Tank
    side_effects: ["status = IDLE", "cip_cycle_count = 0"]

  - method: POST
    path: "/tanks/{tankId}/service"
    description: "Cellar service action on a vessel: CIP, TAKE_OUT_OF_SERVICE or RETURN_TO_SERVICE"
    roles: [CellarOperator]
    code: 200
    input: [action, "sanitizer_ppm?", "contact_time_seconds?"]
    output: Tank
    side_effects: ["CIP requires DIRTY plus a PASS from growler_sanitation_verdict; sets last_cip_utc and increments cip_cycle_count, then moves DIRTY -> IDLE", "TAKE_OUT_OF_SERVICE and RETURN_TO_SERVICE toggle IDLE <-> OUT_OF_SERVICE", "increments Tank.version"]

  - method: POST
    path: "/batches"
    description: "Schedule a brew on a vessel for a half-open occupation interval"
    roles: [CellarOperator]
    code: 201
    input: [beer_id, tank_id, batch_code, planned_volume_bbl, brew_start_utc, brew_end_utc, "loss_basis?"]
    output: Batch
    side_effects: ["state = SCHEDULED", "rejects overlap with any live batch on the same tank once the 12-hour CIP buffer is applied (ERR_TANK_SCHEDULE_CONFLICT)", "rejects planned_volume_bbl above Tank.capacity_bbl", "remaining_bbl seeded from planned_volume_bbl"]

  - method: POST
    path: "/batches/{batchId}/start"
    description: "Begin brewing; takes the vessel"
    roles: [CellarOperator]
    code: 200
    input: []
    output: Batch
    side_effects: ["SCHEDULED -> BREWING", "Tank IDLE -> OCCUPIED and Tank.occupying_batch_id set (cross-entity)", "requires Brewery.notice_status == ACTIVE", "increments Batch.version and Tank.version"]

  - method: POST
    path: "/batches/{batchId}/condition"
    description: "Record the measured yield and move the batch to conditioning"
    roles: [CellarOperator]
    code: 200
    input: [actual_yield_bbl]
    output: Batch
    side_effects: ["BREWING -> CONDITIONING", "stores actual_yield_bbl and re-derives remaining_bbl", "rejects a yield above Tank.capacity_bbl", "increments Batch.version"]

  - method: POST
    path: "/batches/{batchId}/dump"
    description: "Dump the batch; permitted from SCHEDULED, BREWING or CONDITIONING"
    roles: [CellarOperator]
    code: 200
    input: [reason]
    output: Batch
    side_effects: ["-> DUMPED", "an OCCUPIED tank moves to DIRTY (cross-entity)", "sets total_loss_bbl when a yield had been recorded", "refused while a PLANNED run exists (ERR_BATCH_HAS_PLANNED_RUNS)", "increments Batch.version"]

  - method: POST
    path: "/packaging-runs"
    description: "Plan a packaging run against a conditioning batch; OCC-guarded on the batch"
    roles: [CellarOperator]
    code: 201
    input: [batch_id, run_code, package_type, destination, units_planned, expected_batch_version]
    output: PackagingRun
    side_effects: ["state = PLANNED, reconciliation_state = NOT_APPLICABLE", "expected_batch_version must equal Batch.version or ERR_STALE_BATCH_VERSION (412)", "increments Batch.version by 1 - the run has staked a claim on the batch, so a second create replayed from the same observed version is rejected", "no barrels move until the run completes"]

  - method: POST
    path: "/packaging-runs/{runId}/complete"
    description: "Certify the run: books bbl_removed off the batch and stamps the tax-determination instant"
    roles: [CellarOperator]
    code: 200
    input: [units_produced]
    output: PackagingRun
    side_effects: ["PLANNED -> COMPLETED", "bbl_removed = units_produced * BBL_PER_UNIT[package_type]; available_bbl = bbl_removed; removed_at_utc and certified_by_user_id set", "Batch.packaged_bbl up and remaining_bbl down (ledger sync)", "when remaining_bbl <= 1.000 the batch auto-closes CONDITIONING -> PACKAGED, the tank moves OCCUPIED -> DIRTY, and packaging_loss_allocation writes loss_share_bbl on every COMPLETED run", "increments PackagingRun.version, Batch.version and possibly Tank.version"]

  - method: POST
    path: "/packaging-runs/{runId}/void"
    description: "Void a run, compensating every barrel it had booked"
    roles: [CellarOperator]
    code: 200
    input: []
    output: PackagingRun
    side_effects: ["PLANNED or COMPLETED -> VOIDED", "from COMPLETED: Batch.packaged_bbl down and remaining_bbl up by bbl_removed, restoring actual_yield_bbl == packaged_bbl + remaining_bbl; bbl_removed and available_bbl reset to 0.000 and loss_share_bbl cleared", "refused when allocated_bbl, shipped_bbl or kegs_filled_count is non-zero", "re-runs packaging_loss_allocation over the surviving runs when the batch had already closed", "increments PackagingRun.version and Batch.version"]

  - method: POST
    path: "/keg-assets"
    description: "Register a physical keg in the float; it starts EMPTY_DIRTY"
    roles: [BreweryAdmin, CellarOperator]
    code: 201
    input: [keg_serial, size_bbl]
    output: KegAsset
    side_effects: ["state = EMPTY_DIRTY", "cycle_count = 0"]

  - method: POST
    path: "/keg-assets/{kegAssetId}/clean"
    description: "Wash the keg; a passing sanitation reading is mandatory"
    roles: [CellarOperator]
    code: 200
    input: [sanitizer_ppm, contact_time_seconds]
    output: KegAsset
    side_effects: ["EMPTY_DIRTY -> CLEANED", "requires a PASS from growler_sanitation_verdict or ERR_SANITATION_BELOW_STANDARD (422)", "sets last_cleaned_utc; clears packaging_run_id, filled_beer_id, returned_volume_oz, depletion_variance_oz, shrinkage_flagged", "increments KegAsset.version"]

  - method: POST
    path: "/keg-assets/{kegAssetId}/fill"
    description: "Fill a cleaned keg from a completed keg-format packaging run"
    roles: [CellarOperator]
    code: 200
    input: [packaging_run_id]
    output: KegAsset
    side_effects: ["CLEANED -> FILLED", "requires run.state == COMPLETED, matching size (ERR_KEG_SIZE_MISMATCH) and kegs_filled_count < units_produced (ERR_RUN_UNITS_EXHAUSTED)", "sets filled_volume_oz = size_bbl * 3968, poured_volume_oz = 0, filled_beer_id from run -> batch -> beer", "the run's reconciliation_state moves NOT_APPLICABLE -> OPEN on the first fill; kegs_filled_count and kegs_outstanding_count up by 1", "increments KegAsset.version and PackagingRun.version"]

  - method: POST
    path: "/keg-assets/{kegAssetId}/movements"
    description: "Move a keg: TAP, DEPLOY_DISTRIBUTION, DEPLOY_EVENT, RETURN or DECOMMISSION"
    roles: [CellarOperator, TaproomStaff]
    code: 200
    input: [movement_type, "returned_volume_gal?", "event_permit_id?"]
    output: KegAsset
    side_effects: ["TAP: FILLED -> TAPPED, sets tapped_at_utc and deployment_channel TAPROOM; this instant is what the WHOLE_KEG_REMOVAL basis taxes", "DEPLOY_DISTRIBUTION: FILLED -> DEPLOYED, requires distribution_sellable", "DEPLOY_EVENT: FILLED -> DEPLOYED, requires an APPROVED EventPermit for the beer", "RETURN: TAPPED or DEPLOYED -> EMPTY_DIRTY and runs the depth-3 cascade - variance and shrinkage_flagged computed, run.kegs_outstanding_count down by 1, and at zero the run reconciles with keg_shrinkage_oz summed over its kegs", "DECOMMISSION: EMPTY_DIRTY -> DECOMMISSIONED", "increments KegAsset.version and, on RETURN, PackagingRun.version"]

  - method: POST
    path: "/taproom-pours"
    description: "Record an immutable taproom pour; growler and crowler fills additionally require a sanitation reading, a second-person attestation and complete label content"
    roles: [TaproomStaff]
    code: 201
    input: [keg_asset_id, container_type, price_cents, "container_sanitized?", "sanitizer_ppm?", "contact_time_seconds?", "attested_by_user_id?", "label_fields?"]
    output: TaproomPour
    side_effects: ["volume_oz derived from container_type; poured_at_utc and poured_by_user_id stamped", "keg must be TAPPED; POUR_OZ must not exceed remaining_volume_oz", "keg.poured_volume_oz up and remaining_volume_oz down", "CROWLER_32OZ and GROWLER_64OZ: sanitation_verdict must compute to PASS, attested_by_user_id must differ from the pouring user, and label_fields must be complete", "adds to the METERED_POUR taxable base for any period containing poured_at_utc", "no version field - the row is immutable"]

  - method: POST
    path: "/state-licenses"
    description: "Register a state distribution license with its self-distribution cap and franchise regime"
    roles: [ComplianceOfficer]
    code: 201
    input: [state_code, license_type, annual_barrel_cap, franchise_state, effective_from_utc, expires_at_utc, "termination_notice_days?"]
    output: StateLicense
    side_effects: ["status = ACTIVE", "state_code is unique (ERR_DUPLICATE_CODE)", "termination_notice_days defaults to 90"]

  - method: POST
    path: "/state-licenses/{stateLicenseId}/ytd-adjustments"
    description: "Record barrels already self-distributed into the state this calendar year"
    roles: [ComplianceOfficer]
    code: 200
    input: [carry_in_barrels_ytd]
    output: StateLicense
    side_effects: ["overwrites carry_in_barrels_ytd and re-derives barrels_shipped_ytd", "moves the effective distance to annual_barrel_cap for cap-boundary tests", "increments StateLicense.version"]

  - method: POST
    path: "/distributor-appointments"
    description: "Propose a wholesaler for a territory; OCC-guarded on the license"
    roles: [BreweryAdmin]
    code: 201
    input: [state_license_id, distributor_name, expected_state_license_version, "appointed_beer_id?", "good_cause_code?"]
    output: DistributorAppointment
    side_effects: ["state = PROPOSED, proposed_by_user_id = X-User-ID", "brand_scope derived: SINGLE_BRAND when appointed_beer_id is present, otherwise ALL_BRANDS", "expected_state_license_version must equal StateLicense.version or ERR_STALE_LICENSE_VERSION (412)", "a PROPOSED appointment does not yet bar self-distribution"]

  - method: POST
    path: "/distributor-appointments/{appointmentId}/approve"
    description: "Approve the appointment; the approver may not be the proposer"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: DistributorAppointment
    side_effects: ["PROPOSED -> ACTIVE, sets approved_by_user_id and activated_at_utc", "X-User-ID != proposed_by_user_id or ERR_SEGREGATION_OF_DUTIES (409)", "refuses an overlapping live scope with ERR_DUPLICATE_APPOINTMENT_SCOPE", "StateLicense.active_appointment_count up by 1 and the state joins Brewery.franchise_locked_state_codes", "CASCADE: live SELF_DISTRIBUTED orders in scope become REJECTED with APPOINTMENT_ACTIVATED and their allocation lines are released", "increments DistributorAppointment.version and StateLicense.version"]

  - method: POST
    path: "/distributor-appointments/{appointmentId}/termination"
    description: "Franchise termination workflow: phase REQUEST starts the statutory notice, FINALIZE ends the appointment, WITHDRAW abandons the request"
    roles: [ComplianceOfficer]
    code: 200
    input: [phase, "good_cause_code?"]
    output: DistributorAppointment
    side_effects: ["REQUEST: ACTIVE -> TERMINATION_REQUESTED, computes termination_effective_utc = now + termination_notice_days days in franchise states (now otherwise), and demands good_cause_code in franchise states", "FINALIZE: TERMINATION_REQUESTED -> TERMINATED only once the clock reaches termination_effective_utc (ERR_TERMINATION_NOTICE_NOT_ELAPSED), decrements active_appointment_count and releases the franchise lock", "WITHDRAW: TERMINATION_REQUESTED -> ACTIVE and clears the termination timestamps", "increments DistributorAppointment.version and, on FINALIZE, StateLicense.version"]

  - method: POST
    path: "/distribution-orders"
    description: "Submit a distribution order; the channel and the full landed cost are derived at creation"
    roles: [BreweryAdmin]
    code: 201
    input: [beer_id, state_license_id, order_code, bbl_requested, ship_to_state_code, distance_miles, requested_ship_utc]
    output: DistributionOrder
    side_effects: ["state = SUBMITTED", "channel = WHOLESALER when a live appointment covers (license, beer), else SELF_DISTRIBUTED, and appointment_id is stamped accordingly", "runs distribution_order_landed_cost to set product_cents, freight_cents, franchise_fee_cents and landed_cost_cents", "requires notice ACTIVE, license ACTIVE and inside its validity window, distribution_sellable == true, and ship_to_state_code == the license's state_code"]

  - method: POST
    path: "/distribution-orders/{orderId}/allocate"
    description: "Reserve packaged inventory for the order, oldest stock first; forks to ALLOCATED or REJECTED"
    roles: [BreweryAdmin]
    code: 200
    input: []
    output: DistributionOrder
    side_effects: ["runs distribution_allocation_waterfall over COMPLETED DISTRIBUTION runs of the ordered beer in removed_at_utc ASC then created_at ASC order", "success: SUBMITTED -> ALLOCATED, allocation_lines written in draw-down order, each run's allocated_bbl up and available_bbl down", "short or empty pool: SUBMITTED -> REJECTED with rejection_reason INSUFFICIENT_INVENTORY, all-or-nothing so no run is touched - still a 200 with the rejected order", "increments DistributionOrder.version and every cited run's version"]

  - method: POST
    path: "/distribution-orders/{orderId}/ship"
    description: "Remove the beer from the brewery; enforces the self-distribution annual ceiling"
    roles: [BreweryAdmin]
    code: 200
    input: []
    output: DistributionOrder
    side_effects: ["ALLOCATED -> SHIPPED (any other state is ERR_ORDER_NOT_ALLOCATED)", "for SELF_DISTRIBUTED: barrels_shipped_ytd + allocated_bbl must be <= annual_barrel_cap (inclusive) or ERR_SELF_DISTRIBUTION_CAP_EXCEEDED (422)", "sets shipped_at_utc, the distribution tax-determination instant", "each cited run moves the line's bbl from allocated_bbl to shipped_bbl", "StateLicense.barrels_shipped_ytd up by allocated_bbl", "increments DistributionOrder.version, StateLicense.version and every cited run's version"]

  - method: POST
    path: "/distribution-orders/{orderId}/cancel"
    description: "Cancel the order, releasing every reserved barrel"
    roles: [BreweryAdmin]
    code: 200
    input: [reason]
    output: DistributionOrder
    side_effects: ["SUBMITTED or ALLOCATED -> CANCELLED", "COMPENSATION from ALLOCATED: every line released so each run's allocated_bbl falls and available_bbl rises, restoring bbl_removed == available_bbl + allocated_bbl + shipped_bbl", "allocation_lines = [] and allocated_bbl = 0.000", "increments DistributionOrder.version and every cited run's version"]

  - method: POST
    path: "/excise-reports"
    description: "Draft an excise return for a period under one of the two taproom determination bases"
    roles: [BreweryAdmin]
    code: 201
    input: [period_start_utc, period_end_utc, taproom_basis, "amends_report_id?"]
    output: ExciseReport
    side_effects: ["state = DRAFT, prepared_by_user_id = X-User-ID", "runs taproom_taxable_barrels under the selected basis and sums SHIPPED order barrels for distribution_bbl", "runs federal_state_excise_tax to set federal_tax_cents, state_tax_cents and total_tax_due_cents", "ytd_bbl_before_period drawn from the brewery carry-ins plus earlier FILED returns"]

  - method: POST
    path: "/excise-reports/{reportId}/file"
    description: "File the return; the filer may not be the preparer and the period must be closed"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: ExciseReport
    side_effects: ["DRAFT -> FILED", "X-User-ID != prepared_by_user_id or ERR_SEGREGATION_OF_DUTIES", "current_utc >= period_end_utc or ERR_PERIOD_NOT_CLOSED", "recomputes and freezes every barrel and tax field at filing time", "Brewery.taproom_bbl_ytd and distribution_bbl_ytd absorb the report", "an amending return moves its target FILED -> SUPERSEDED and pulls the superseded barrels back out of the YTD aggregates", "increments ExciseReport.version"]

  - method: POST
    path: "/event-permits"
    description: "Draft an off-site, festival or farmers-market permit application"
    roles: [ComplianceOfficer]
    code: 201
    input: [featured_beer_id, event_name, permit_type, venue_state_code, event_start_utc, event_end_utc, requested_bbl]
    output: EventPermit
    side_effects: ["state = DRAFT, submission_count = 0", "venue_state_code must have a StateLicense or ERR_TERRITORY_NOT_LICENSED"]

  - method: POST
    path: "/event-permits/{permitId}/submit"
    description: "Submit or re-submit the application to the regulator"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: EventPermit
    side_effects: ["DRAFT or INFO_REQUESTED -> SUBMITTED, submission_count up by 1, info_request_note cleared", "requires notice ACTIVE and taproom_sellable on the featured beer", "aggregate ceiling: SUBMITTED plus APPROVED requested_bbl in the same state must stay <= 25.00 (ERR_EVENT_BARREL_CAP_EXCEEDED)", "increments EventPermit.version"]

  - method: POST
    path: "/event-permits/{permitId}/decision"
    description: "StateRegulator answers the application: APPROVED, DENIED or INFO_REQUESTED"
    roles: [StateRegulator]
    code: 200
    input: [decision, "note?"]
    output: EventPermit
    side_effects: ["APPROVED: SUBMITTED -> APPROVED, refused when 2 approved permits already overlap the CLOSED interval in the same state (ERR_OFFSITE_EVENT_CAPACITY_EXCEEDED); afterwards kegs may be DEPLOY_EVENT'd for the featured beer", "DENIED: SUBMITTED -> DENIED with denial_reason", "INFO_REQUESTED: SUBMITTED -> INFO_REQUESTED with info_request_note, re-openable by another submit", "increments EventPermit.version"]

  - method: POST
    path: "/_clock/set_current_utc"
    description: "Test-driving endpoint: set the server's logical clock. Before any call the clock reads exactly 2026-08-01T00:00:00Z and MUST NOT fall back to wall-clock time. Every deadline, expiry, occupation-interval and reporting-window rule reads this clock."
    roles: [BreweryAdmin, ComplianceOfficer, CellarOperator, TaproomStaff, StateRegulator]
    code: 200
    input: [current_utc]
    output: "{ current_utc: datetime }"
    side_effects: ["moves the logical clock; a forward move can lazily expire StateLicense rows on the next request that reads them", "does not itself mutate any entity"]

# ---------------------------------------------------------------------------
# 1.6 Error Code Catalog
# ---------------------------------------------------------------------------

errors:
  # --- auth ------------------------------------------------------------------
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID missing, blank, or naming a role outside the RBAC matrix"
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "The acting role is not listed in the endpoint's roles"

  # --- schema ----------------------------------------------------------------
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Missing required field, unknown enum value, out-of-range number, too many decimal places, unparseable ISO-8601 instant, reversed interval, out-of-range limit/offset, or a growler/crowler field supplied on a draft container type"

  # --- existence -------------------------------------------------------------
  - id: ERR_BREWERY_NOT_FOUND
    http: 404
    condition: "An operation needs the brewery singleton and no Brewery row has been created"
  - id: ERR_BEER_NOT_FOUND
    http: 404
    condition: "beerId path parameter, or a beer_id / appointed_beer_id / featured_beer_id body field, names no Beer"
  - id: ERR_TANK_NOT_FOUND
    http: 404
    condition: "tankId path parameter or Batch.tank_id names no Tank"
  - id: ERR_BATCH_NOT_FOUND
    http: 404
    condition: "batchId path parameter or PackagingRun.batch_id names no Batch"
  - id: ERR_PACKAGING_RUN_NOT_FOUND
    http: 404
    condition: "runId path parameter or a keg fill's packaging_run_id names no PackagingRun"
  - id: ERR_KEG_ASSET_NOT_FOUND
    http: 404
    condition: "kegAssetId path parameter or TaproomPour.keg_asset_id names no KegAsset"
  - id: ERR_TAPROOM_POUR_NOT_FOUND
    http: 404
    condition: "pourId path parameter names no TaproomPour"
  - id: ERR_STATE_LICENSE_NOT_FOUND
    http: 404
    condition: "stateLicenseId path parameter or a state_license_id body field names no StateLicense"
  - id: ERR_APPOINTMENT_NOT_FOUND
    http: 404
    condition: "appointmentId path parameter names no DistributorAppointment"
  - id: ERR_ORDER_NOT_FOUND
    http: 404
    condition: "orderId path parameter names no DistributionOrder"
  - id: ERR_REPORT_NOT_FOUND
    http: 404
    condition: "reportId path parameter or amends_report_id names no ExciseReport"
  - id: ERR_EVENT_PERMIT_NOT_FOUND
    http: 404
    condition: "permitId path parameter or a movement's event_permit_id names no EventPermit"

  # --- uniqueness ------------------------------------------------------------
  - id: ERR_DUPLICATE_CODE
    http: 409
    condition: "Beer.name, Tank.code, Batch.batch_code, PackagingRun.run_code, KegAsset.keg_serial, DistributionOrder.order_code or StateLicense.state_code already exists"
  - id: ERR_BREWERY_ALREADY_EXISTS
    http: 409
    condition: "POST /brewery when the singleton already exists"

  # --- optimistic concurrency ------------------------------------------------
  - id: ERR_STALE_BATCH_VERSION
    http: 412
    condition: "expected_batch_version on POST /packaging-runs does not equal the Batch's current version"
  - id: ERR_STALE_LICENSE_VERSION
    http: 412
    condition: "expected_state_license_version on POST /distributor-appointments does not equal the StateLicense's current version"

  # --- state transitions -----------------------------------------------------
  - id: ERR_NOTICE_TRANSITION_INVALID
    http: 409
    condition: "A brewer's-notice action is not legal from the current notice_status (e.g. REVOKE from ACTIVE, or any action once REVOKED)"
  - id: ERR_FILING_TRANSITION_INVALID
    http: 409
    condition: "A FORMULA or LABEL filing or decision is not legal from the beer's current registration_state / label_state (e.g. deciding a filing that is not pending, or revoking a COLA that was never approved)"
  - id: ERR_TANK_TRANSITION_INVALID
    http: 409
    condition: "A tank service action is not legal from the current status (e.g. CIP on an IDLE vessel, RETURN_TO_SERVICE on a DIRTY vessel)"
  - id: ERR_BATCH_TRANSITION_INVALID
    http: 409
    condition: "start / condition / dump attempted from a batch state that does not declare it, including anything from PACKAGED or DUMPED"
  - id: ERR_RUN_TRANSITION_INVALID
    http: 409
    condition: "complete on a run that is not PLANNED, or void on a run that is already VOIDED"
  - id: ERR_KEG_TRANSITION_INVALID
    http: 409
    condition: "clean, fill or a movement_type that the keg's current state does not declare, including anything from DECOMMISSIONED"
  - id: ERR_ORDER_TRANSITION_INVALID
    http: 409
    condition: "allocate or cancel attempted from an order state that does not declare it (REJECTED, SHIPPED and CANCELLED are terminal)"
  - id: ERR_ORDER_NOT_ALLOCATED
    http: 409
    condition: "ship attempted on an order whose state is not ALLOCATED"
  - id: ERR_APPOINTMENT_TRANSITION_INVALID
    http: 409
    condition: "approve on an appointment that is not PROPOSED, or a termination phase the current state does not declare"
  - id: ERR_REPORT_TRANSITION_INVALID
    http: 409
    condition: "file on an excise return whose state is not DRAFT"
  - id: ERR_PERMIT_TRANSITION_INVALID
    http: 409
    condition: "submit or decision attempted from a permit state that does not declare it, including anything from APPROVED or DENIED"

  # --- cross-entity state gates ---------------------------------------------
  - id: ERR_NOTICE_NOT_ACTIVE
    http: 409
    condition: "Brewery.notice_status is not ACTIVE on a production, sale, shipment or permit-submission operation"
  - id: ERR_TANK_NOT_IDLE
    http: 409
    condition: "Batch start against a tank whose status is OCCUPIED, DIRTY or OUT_OF_SERVICE"
  - id: ERR_BATCH_NOT_CONDITIONING
    http: 409
    condition: "PackagingRun create or complete while the owning batch is not CONDITIONING"
  - id: ERR_KEG_NOT_TAPPED
    http: 409
    condition: "TaproomPour recorded against a keg whose state is not TAPPED"
  - id: ERR_RUN_NOT_COMPLETED
    http: 409
    condition: "Keg fill against a PackagingRun that is still PLANNED or already VOIDED"
  - id: ERR_LICENSE_NOT_ACTIVE
    http: 409
    condition: "Order create, allocate or ship under a StateLicense whose status is SUSPENDED or EXPIRED; also the rejection_reason recorded when a lazy expiry cascade rejects live orders"

  # --- compliance / safety ---------------------------------------------------
  - id: ERR_FORMULA_NOT_APPROVED
    http: 422
    condition: "A sale path is attempted for a beer whose registration_state is neither FORMULA_APPROVED nor FORMULA_EXEMPT"
  - id: ERR_LABEL_NOT_APPROVED
    http: 422
    condition: "A distribution path (order create or DEPLOY_DISTRIBUTION movement) is attempted for a beer whose label_state is not COLA_APPROVED; never raised for a taproom draft pour"
  - id: ERR_EVENT_PERMIT_NOT_APPROVED
    http: 422
    condition: "A DEPLOY_EVENT movement names no APPROVED EventPermit covering the beer at the current logical instant"
  - id: ERR_SANITATION_BELOW_STANDARD
    http: 422
    condition: "growler_sanitation_verdict computes FAIL: sanitizer_ppm outside [150, 400] or contact_time_seconds below 60, on a growler/crowler fill, a keg wash or a tank CIP"
  - id: ERR_GROWLER_LABEL_INCOMPLETE
    http: 422
    condition: "A growler or crowler fill's label_fields is missing or has a blank brand_name, abv_statement, net_contents, health_warning or fill_date"

  # --- temporal --------------------------------------------------------------
  - id: ERR_TANK_SCHEDULE_CONFLICT
    http: 409
    condition: "A scheduled occupation interval overlaps another live batch on the same tank once the 12-hour CIP buffer is applied; half-open intervals make an exactly-12-hour gap legal"
  - id: ERR_LICENSE_NOT_YET_EFFECTIVE
    http: 409
    condition: "The logical clock is before the license's effective_from_utc"
  - id: ERR_LICENSE_EXPIRED
    http: 409
    condition: "The logical clock has reached or passed the license's exclusive expires_at_utc"
  - id: ERR_PERIOD_NOT_CLOSED
    http: 422
    condition: "An excise return is filed while the logical clock is still before period_end_utc"
  - id: ERR_TERMINATION_NOTICE_NOT_ELAPSED
    http: 409
    condition: "A termination FINALIZE arrives before termination_effective_utc"
  - id: ERR_OFFSITE_EVENT_CAPACITY_EXCEEDED
    http: 409
    condition: "Approving the permit would make 3 approved permits share a state on overlapping closed intervals; the ceiling is 2"

  # --- referential / segregation --------------------------------------------
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 409
    condition: "An appointment approver equals its proposer, an excise filer equals its preparer, or a growler attestation names the pouring user"
  - id: ERR_TERRITORY_NOT_LICENSED
    http: 422
    condition: "DistributionOrder.ship_to_state_code differs from the license's state_code, or an EventPermit's venue_state_code has no StateLicense"
  - id: ERR_WHOLESALER_APPOINTMENT_REQUIRED
    http: 422
    condition: "An order targets a WHOLESALER_ONLY license with no live DistributorAppointment covering the beer"
  - id: ERR_DUPLICATE_APPOINTMENT_SCOPE
    http: 409
    condition: "Approving would leave two live appointments covering the same license with overlapping brand scope"
  - id: ERR_GOOD_CAUSE_REQUIRED
    http: 422
    condition: "A termination REQUEST in a franchise_state license omits good_cause_code"
  - id: ERR_PERIOD_ALREADY_FILED
    http: 409
    condition: "A non-amending return is filed for a period another FILED return already covers"
  - id: ERR_AMENDMENT_TARGET_NOT_FILED
    http: 422
    condition: "amends_report_id points at a return whose state is DRAFT or SUPERSEDED"

  # --- volume / container constraints ---------------------------------------
  - id: ERR_TANK_CAPACITY_EXCEEDED
    http: 422
    condition: "planned_volume_bbl or actual_yield_bbl exceeds the tank's capacity_bbl"
  - id: ERR_UNITS_EXCEED_BATCH_VOLUME
    http: 422
    condition: "units_produced * BBL_PER_UNIT[package_type] exceeds the batch's remaining_bbl"
  - id: ERR_KEG_SIZE_MISMATCH
    http: 422
    condition: "The keg's size_bbl does not equal BBL_PER_UNIT of the run's package_type, including any fill from a CAN_CASE_24 run"
  - id: ERR_RUN_UNITS_EXHAUSTED
    http: 409
    condition: "The run's kegs_filled_count already equals units_produced"
  - id: ERR_POUR_EXCEEDS_KEG_VOLUME
    http: 422
    condition: "POUR_OZ[container_type] exceeds the keg's remaining_volume_oz"
  - id: ERR_RETURN_EXCEEDS_FILL
    http: 422
    condition: "returned_volume_gal * 128 exceeds the keg's filled_volume_oz"
  - id: ERR_RUN_HAS_ALLOCATIONS
    http: 409
    condition: "Voiding a COMPLETED run whose allocated_bbl, shipped_bbl or kegs_filled_count is non-zero"
  - id: ERR_BATCH_HAS_PLANNED_RUNS
    http: 409
    condition: "Dumping a CONDITIONING batch that still has a PLANNED PackagingRun"

  # --- fiscal ceilings -------------------------------------------------------
  - id: ERR_SELF_DISTRIBUTION_CAP_EXCEEDED
    http: 422
    condition: "barrels_shipped_ytd + allocated_bbl would exceed the license's annual_barrel_cap on a SELF_DISTRIBUTED shipment; landing exactly on the cap is allowed"
  - id: ERR_EVENT_BARREL_CAP_EXCEEDED
    http: 422
    condition: "Submitting would push SUBMITTED + APPROVED requested_bbl in the venue state above 25.00 barrels"

# ---------------------------------------------------------------------------
# 1.7 RBAC Matrix
# ---------------------------------------------------------------------------
# Segregation of duties: BreweryAdmin proposes appointments and prepares excise
# returns; ComplianceOfficer approves and files them. The server compares
# X-User-ID against proposed_by_user_id / prepared_by_user_id / poured_by_user_id,
# so every role's identity is `opaque` - no role is backed by a persisted entity.
# All five roles may read every GET endpoint.

roles:
  - name: BreweryAdmin
    description: "Owner-operator of the brewery. Stands up the premises record, the keg float and the commercial surface: orders, appointment proposals and excise drafts. Never approves its own paperwork."
    identity: opaque
    exclusive_operations:
      - "POST /brewery (create the singleton)"
      - "POST /distributor-appointments (propose a wholesaler; recorded as proposed_by_user_id)"
      - "POST /distribution-orders (submit an order and freeze its landed cost)"
      - "POST /distribution-orders/{orderId}/allocate"
      - "POST /distribution-orders/{orderId}/ship"
      - "POST /distribution-orders/{orderId}/cancel"
      - "POST /excise-reports (prepare a draft; recorded as prepared_by_user_id)"
    shared_operations:
      - "POST /beers (with ComplianceOfficer)"
      - "POST /tanks (with CellarOperator)"
      - "POST /keg-assets (with CellarOperator)"
      - "every GET endpoint"
      - "POST /_clock/set_current_utc"

  - name: ComplianceOfficer
    description: "Holds the regulatory file. Makes TTB submissions, registers state licenses, approves appointments proposed by BreweryAdmin, files excise returns prepared by BreweryAdmin, and drives the event-permit application. Cannot propose an appointment or prepare a return, so it can never sit on both sides of a control."
    identity: opaque
    exclusive_operations:
      - "POST /brewery/ytd-adjustments"
      - "POST /beers/{beerId}/filings (FORMULA and LABEL submissions)"
      - "POST /state-licenses"
      - "POST /state-licenses/{stateLicenseId}/ytd-adjustments"
      - "POST /distributor-appointments/{appointmentId}/approve (recorded as approved_by_user_id)"
      - "POST /distributor-appointments/{appointmentId}/termination"
      - "POST /excise-reports/{reportId}/file (recorded as filed_by_user_id)"
      - "POST /event-permits"
      - "POST /event-permits/{permitId}/submit"
    shared_operations:
      - "POST /beers (with BreweryAdmin)"
      - "every GET endpoint"
      - "POST /_clock/set_current_utc"

  - name: CellarOperator
    description: "Runs the brewhouse, the packaging line and the keg float. Owns every production transition from scheduling a brew to filling, deploying and returning kegs. Has no commercial or regulatory authority whatsoever."
    identity: opaque
    exclusive_operations:
      - "POST /tanks/{tankId}/service (CIP, take out of service, return to service)"
      - "POST /batches"
      - "POST /batches/{batchId}/start"
      - "POST /batches/{batchId}/condition"
      - "POST /batches/{batchId}/dump"
      - "POST /packaging-runs"
      - "POST /packaging-runs/{runId}/complete"
      - "POST /packaging-runs/{runId}/void"
      - "POST /keg-assets/{kegAssetId}/clean"
      - "POST /keg-assets/{kegAssetId}/fill"
    shared_operations:
      - "POST /tanks (with BreweryAdmin)"
      - "POST /keg-assets (with BreweryAdmin)"
      - "POST /keg-assets/{kegAssetId}/movements (with TaproomStaff)"
      - "every GET endpoint"
      - "POST /_clock/set_current_utc"

  - name: TaproomStaff
    description: "Works the bar. Records pours, growler and crowler fills with their sanitation attestation, and taps or returns kegs at the bar. Cannot brew, package, or touch a licence."
    identity: opaque
    exclusive_operations:
      - "POST /taproom-pours (recorded as poured_by_user_id; attested_by_user_id must be a different user)"
    shared_operations:
      - "POST /keg-assets/{kegAssetId}/movements (with CellarOperator)"
      - "every GET endpoint"
      - "POST /_clock/set_current_utc"

  - name: StateRegulator
    description: "External authority. Decides the brewer's notice, TTB formula and label filings, and off-site event permits. Deliberately holds no operational write on production, inventory, orders or excise returns - it only ever answers applications."
    identity: opaque
    exclusive_operations:
      - "POST /brewery/notice (ACTIVATE, SUSPEND, REINSTATE, REVOKE)"
      - "POST /beers/{beerId}/filings/{filingType}/decision"
      - "POST /event-permits/{permitId}/decision"
    shared_operations:
      - "every GET endpoint"
      - "POST /_clock/set_current_utc"
