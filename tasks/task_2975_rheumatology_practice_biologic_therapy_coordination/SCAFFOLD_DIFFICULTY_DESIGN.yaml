  - rule_id: boundary_precision_check
    instances:
      - name: cdai_exactly_at_moderate_ceiling_scores_moderate_not_high
        grounds:
          - calculations.visit_disease_activity_score
          - calculations.visit_escalation_recommendation
          - endpoints.POST_visits_id_score
        distinguishing_aspect: |
          Metric: the CDAI activity_score category ladder, whose MODERATE band has an INCLUSIVE
          upper bound of 22.00. Endpoint: POST /visits/{id}/score. Three visits are scored at
          21.90, exactly 22.00 and 22.10 — the first two must both land in MODERATE (with
          escalation OPTIMIZE_CURRENT because no patient has a long-running ACTIVE episode) and
          only 22.10 may cross into HIGH / ESCALATE, so an implementation using a strict
          less-than comparison is caught by the middle case alone.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One rheumatologist and one nurse."
            - "Three patients, one FOLLOW_UP visit each, all CHECKED_IN. The visits are placed on three different days so the two-concurrent-visit clinician cap cannot fire."
            - "No TherapyEpisode exists for any of the three patients, so the MODERATE branch's 90-day dwell test has no ACTIVE episode to find and must resolve to OPTIMIZE_CURRENT."
