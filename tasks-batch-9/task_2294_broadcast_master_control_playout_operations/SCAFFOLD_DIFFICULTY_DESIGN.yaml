              payload: { channel_id: "${ch_id}", feed_source: "NETWORK_PRIMARY", anchor_sequence_number: 2, join_utc: "2026-08-01T12:00:00Z", breakaway_utc: "2026-08-01T12:10:00Z", backtiming_mode: "STRICT", guard_seconds: 2, live_encoder_units: 1 }
              as: MasterControlOperator
              as_user_id: "${mco_id}"
              captures: { fw1_id: "$.data.id" }
          trigger:
            - call: "POST /network-feed-windows"
              payload: { channel_id: "${ch_id}", feed_source: "NETWORK_ALT", anchor_sequence_number: 7, join_utc: "2026-08-01T12:05:00Z", breakaway_utc: "2026-08-01T12:15:00Z", backtiming_mode: "STRICT", guard_seconds: 2, live_encoder_units: 1 }
              as: MasterControlOperator
              as_user_id: "${mco_id}"
          assert:
            - "HTTP 409 with error_id == ERR_FEED_WINDOW_OVERLAP"
            - "The response error_id is NOT ERR_ANCHOR_ITEM_NOT_FOUND"
            - "No second NetworkFeedWindow row exists for channel ${ch_id}; NetworkFeedWindow.${fw1_id}.state == PLANNED and NetworkFeedWindow.${fw1_id}.join_utc == 2026-08-01T12:00:00Z"
            - "Replaying the request with join_utc 2026-08-01T12:20:00Z and breakaway_utc 2026-08-01T12:30:00Z (guarded interval [12:19:58Z, 12:30:02Z], disjoint from [11:59:58Z, 12:10:02Z]) but the same anchor_sequence_number 7 returns HTTP 409 with error_id == ERR_ANCHOR_ITEM_NOT_FOUND"
            - "Replaying that disjoint request with anchor_sequence_number 2 returns HTTP 201 and a NetworkFeedWindow with state == PLANNED"

      - name: uncleared_content_safety_beats_arm_variance_temporal
        grounds:
          - validations[priority=31]
          - validations[priority=46]
          - errors[ERR_UNCLEARED_CONTENT_ON_AIR]
          - errors[ERR_ARM_VARIANCE_EXCEEDED]
          - calculations.playlist_timing_variance
          - state_machines.PlaylistItem.UNCLEARED_to_CLEARED
        distinguishing_aspect: |
          Category pair business_safety(409) x business_temporal(409): the ARM
          request carries BOTH an UNCLEARED PROGRAM element (its asset is only
          RECEIVED, never graded) AND projected_end_variance_seconds == +31, one
          second past ARM_VARIANCE_TOLERANCE_SECONDS 30; priority 31 must win
          over priority 46, and grading the missing asset PASS — which flips the
          item UNCLEARED -> CLEARED without touching any duration — must then
          expose ERR_ARM_VARIANCE_EXCEEDED on an otherwise identical request.
        test_recipe:
          setup:
            - "Transmitter FAC-1 FULL_POWER, MUX-A (total 20000, pilot 500), one ACTIVE channel 12.1 (SD_480I, floor 2000, requested 6000, priority_rank 1), posture NORMAL, air_status DARK."
            - "Asset A (expected 1000 s) is QC_PASSED with score 100. Asset U (expected 831 s) has been delivered but never graded, so Asset.status == RECEIVED."
            - "Playlist for 2026-08-01, schedule_start_utc 12:00:00Z, window_duration_seconds 1800: seq 1 PROGRAM asset A 1000 s at 12:00:00Z, seq 2 PROGRAM asset U 831 s at 12:16:40Z. The items are exactly adjacent (12:00:00 + 1000 == 12:16:40) so playlist_timeline_integrity passes."
            - "Item seq 2 was created with clearance_status UNCLEARED (not BLOCKED), so blocked_item_count == 0 and the playlist reaches VALIDATED."
            - "scheduled_total_seconds == 1831 and window_duration_seconds == 1800, so projected_end_variance_seconds == +31."
            - "The logical clock stands at 2026-08-01T10:00:00Z."
