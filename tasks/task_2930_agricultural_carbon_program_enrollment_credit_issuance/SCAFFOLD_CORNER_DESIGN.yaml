              as: ProgramAdmin
              captures: { e_ok_id: $.data.id }
          assert:
            - "the first four triggers return HTTP 422 with error_id ERR_COMMITMENT_TERMS_INVALID"
            - "commitment_years 2 fails against min_adoption_years 3 while commitment_years 12 would pass — MAX_COMMITMENT_YEARS is 12, so 13 fails"
            - "enrolled_acres 0.00 fails the strict positivity clause even though priority 5 accepts it as a non-negative number"
            - "the fifth trigger returns HTTP 201 with data.enrolled_acres == 1000.00 and data.commitment_years == 3 — equality at both bounds is admissible"
            - "GET /enrollments?field_id=${f1_id} returns total_count == 1 and data[0].id == ${e_ok_id} — the four rejected attempts created nothing"

