            - call: "POST /shows/${sh_id}/perform"
              payload: {}
              as: TourAccountant
            - call: "POST /settlements"
              payload: { show_id: "${sh_id}" }
              as: TourAccountant
              as_user_id: "acct-alice"
              captures: { st_id: $.data.id }
