            - { call: "POST /api/foreclosure-cases/${case_id}/notices-of-default", payload: { recording_date: "2026-08-01", instrument_number: "NOD-O2" }, as: CaseManager }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-10-30T00:00:00Z" }, as: TrusteeAdmin }
            - { call: "POST /api/foreclosure-cases/${case_id}/notices-of-trustee-sale", payload: { recording_date: "2026-10-30", instrument_number: "NOTS-O2" }, as: CaseManager, captures: { nots_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-11-02T00:00:00Z" }, as: TrusteeAdmin }
            - { call: "POST /api/notices-of-trustee-sale/${nots_id}/publications", payload: { run_date: "2026-11-02", newspaper_name: "Daily Journal" }, as: CaseManager, captures: { p1: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-11-08T00:00:00Z" }, as: TrusteeAdmin }
          trigger:
            - { call: "POST /api/notices-of-trustee-sale/${nots_id}/publications", payload: { run_date: "2026-11-08", newspaper_name: "Daily Journal" }, as: CaseManager, captures: { err: $.data.error_id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-11-09T00:00:00Z" }, as: TrusteeAdmin }
            - { call: "POST /api/notices-of-trustee-sale/${nots_id}/publications", payload: { run_date: "2026-11-09", newspaper_name: "Daily Journal" }, as: CaseManager, captures: { p2: $.data.id, idx2: $.data.run_index } }
          assert:
            - "${err} == ERR_PUBLICATION_GAP_VIOLATION (6-day gap rejected)"
            - "exactly-7-day retry succeeds: Publication.${p2}.run_index == 2 (captured idx2 == 2)"
            - "NoticeOfTrusteeSale.${nots_id}.first_publication_date == 2026-11-02"

  - rule_id: compensating_invariant
    instances:
      - name: disbursement_reversal_restores_surplus_conservation
        grounds:
          - calculations.funds_conservation
          - calculations.surplus_waterfall
          - state_machines.Disbursement.CLEARED_to_REVERSED
        distinguishing_aspect: |
          Conserved quantity: money. SUM(CLEARED CLAIMANT/BORROWER_RESIDUE
          disbursements) + undistributed_surplus_cents == 1640950 before the
          run, after the run, and again after reversing the run's
          disbursement — the reverse action is the exact compensation of the
          distribute action, with the claim rolling back PAID/paid_cents.
        test_recipe:
          setup:
            - "Case LN-K1 (STATUTORY_PRIORITY) SOLD on 2026-11-23 with bid 43000000 (surplus 1640950); one claim approved 2000000 (filer cm_filer_1, reviewer cm_reviewer_1)"
