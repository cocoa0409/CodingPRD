          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - { call: "POST /participants", payload: { full_name: "No Auth", date_of_birth: "1990-01-01T00:00:00Z", contact_email: "na@example.org" }, as: Anonymous, captures: { err: "$.data.error_id" } }
          assert:
            - "response error_id == ERR_UNAUTHENTICATED"
            - "http status == 401"

      - name: courtclerk_cannot_create_site_unauthorized
        claim_type: peer_roles
        grounds: ['roles.CourtClerk', 'roles.ProgramCoordinator', 'validations[priority=2]']
