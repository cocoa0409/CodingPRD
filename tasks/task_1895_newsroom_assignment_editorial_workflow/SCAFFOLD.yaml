# =============================================================================
# PRD Benchmark Seed Tables — Newsroom Assignment & Editorial Workflow
# (metro daily newsroom)
# =============================================================================

scenario: |
  1895. Newsroom Assignment & Editorial Workflow (metro daily newsroom): story
  pitch intake & assignment desk prioritization, reporter/photographer
  assignment & resource conflicts, deadline/slot planning across
  print/digital/broadcast, editing stages & fact-check/legal review, embargo &
  publication scheduling, corrections policy & issuance, breaking-news override
  & staffing call-in, content performance analytics feedback

domain_name: newsroom-editorial-workflow
api_prefix: /newsroom

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - selector_policy
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - self_referential
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# Table 1: Entity-Relationship Table
# =============================================================================
entities:
  - name: StaffMember
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Staff member full name" }
      - { name: role_capability, type: enum, source: input, description: "Editorial capability: REPORTER | PHOTOGRAPHER | COPY_EDITOR | FACT_CHECKER | LEGAL_REVIEWER | DESK_EDITOR | MANAGING_EDITOR | NEWS_DIRECTOR | ANALYST" }
      - { name: home_desk, type: enum, source: input, description: "Desk affiliation: METRO | BUSINESS | SPORTS | FEATURES" }
      - { name: employment_status, type: enum, source: system, description: "ACTIVE | ON_LEAVE | INACTIVE; starts ACTIVE, changed via PATCH", default: "ACTIVE" }
      - { name: max_concurrent_assignments, type: integer, source: input, description: "Max ACCEPTED assignments held at one time; cap checked at accept time", default: 3, constraints: ">= 1" }
      - { name: hourly_rate_cents, type: integer, source: input, description: "Hourly cost rate in cents used by assignment_cost and payroll_week_total", constraints: ">= 0" }
      - { name: active_assignment_count, type: integer, source: computed, description: "count(Assignment where staff_id = this AND status IN {PROPOSED, ACCEPTED}); recomputed on every assignment mutation" }

  - name: Pitch
    parent: null
    common_fields: true
    fields:
      - { name: title, type: string, source: input, description: "Pitch headline" }
      - { name: summary, type: string, source: input, description: "Pitch body / angle" }
      - { name: desk, type: enum, source: input, description: "Target desk: METRO | BUSINESS | SPORTS | FEATURES" }
      - { name: urgency, type: enum, source: input, description: "STANDARD | URGENT | BREAKING", default: "STANDARD" }
      - { name: deadline_at, type: datetime, source: input, description: "Editorial deadline; drives time_pressure in story_priority_score" }
      - { name: submitting_staff_id, type: string, source: system, description: "FK -> StaffMember.id; set from X-User-ID of the creator" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | DESK_REVIEW | GREENLIT | REJECTED | WITHDRAWN" }
      - { name: rework_round, type: integer, source: system, description: "Number of desk returns so far; increments on each return; return rejected when rework_round >= 3", default: 0 }
      - { name: greenlit_story_id, type: string, source: system, description: "FK -> Story.id; nullable; set when the pitch is greenlit" }

  - name: Story
    parent: null
    common_fields: true
    fields:
      - { name: pitch_id, type: string, source: system, description: "FK -> Pitch.id; set at greenlight" }
      - { name: desk, type: enum, source: system, description: "Copied from pitch: METRO | BUSINESS | SPORTS | FEATURES" }
      - { name: story_type, type: enum, source: system, description: "PRINT | DIGITAL | BROADCAST; supplied at greenlight; must equal slot channel at schedule" }
      - { name: author_staff_id, type: string, source: system, description: "FK -> StaffMember.id; the pitch submitter" }
      - { name: status, type: enum, source: system, description: "DRAFT | IN_EDIT | FACT_CHECK | LEGAL_REVIEW | CLEARED | SCHEDULED | ON_HOLD | PUBLISHED | RETRACTED | KILLED" }
      - { name: word_count, type: integer, source: input, description: "Current body length; editable in DRAFT/IN_EDIT via PATCH", default: 0, constraints: ">= 0" }
      - { name: embargo_until, type: datetime, source: input, description: "Nullable embargo instant; story may not publish before it" }
      - { name: slot_id, type: string, source: system, description: "FK -> PublicationSlot.id; nullable; set on schedule, cleared on unschedule/kill/bump" }
      - { name: priority_score, type: number, source: computed, description: "story_priority_score DESK_FORWARD variant, computed at creation from the source pitch" }
      - { name: correction_count, type: integer, source: computed, description: "count(Correction where story_id = this AND status = ISSUED)", default: 0 }
      - { name: published_at, type: datetime, source: system, description: "Nullable; set by the publication scheduler at publish" }
      - { name: superseded_by_story_id, type: string, source: input, description: "FK -> Story.id; nullable self-reference to a live follow-up story; set via supersede endpoint" }

  - name: Assignment
    parent: null
    common_fields: true
    fields:
      - { name: story_id, type: string, source: input, description: "FK -> Story.id" }
      - { name: staff_id, type: string, source: input, description: "FK -> StaffMember.id" }
      - { name: assignment_role, type: enum, source: input, description: "REPORTER | PHOTOGRAPHER; must equal the staff member's role_capability" }
      - { name: status, type: enum, source: system, description: "PROPOSED | ACCEPTED | DECLINED | CANCELLED | COMPLETED | BUMPED" }
      - { name: start_at, type: datetime, source: input, description: "Work window start (half-open interval start)" }
      - { name: end_at, type: datetime, source: input, description: "Work window end (half-open interval end; must be > start_at)" }
      - { name: planned_effort_minutes, type: integer, source: input, description: "Planned effort; feeds provisional cost", constraints: ">= 1" }
      - { name: actual_effort_minutes, type: integer, source: input, description: "Actual effort; supplied at complete", constraints: ">= 1" }
      - { name: provisional_cost_cents, type: integer, source: computed, description: "assignment_cost PROVISIONAL variant at creation: round_half_up(planned_effort_minutes x hourly_rate_cents / 60, 0)" }
      - { name: final_cost_cents, type: integer, source: computed, description: "assignment_cost FINAL variant; nullable until COMPLETED; weekly overtime allocated chronologically" }
      - { name: completed_at, type: datetime, source: system, description: "Nullable; logical clock at completion; drives weekly overtime ordering" }
      - { name: bumped_by_event_id, type: string, source: system, description: "FK -> BreakingNewsEvent.id; nullable; set when bumped by breaking-news activation" }

  - name: PublicationSlot
    parent: null
    common_fields: true
    fields:
      - { name: channel, type: enum, source: input, description: "PRINT | DIGITAL | BROADCAST" }
      - { name: window_start, type: datetime, source: input, description: "Publication window start" }
      - { name: window_end, type: datetime, source: input, description: "Publication window end; must be > window_start" }
      - { name: capacity, type: integer, source: input, description: "Max stories schedulable into this slot", constraints: ">= 1" }
      - { name: reserved_count, type: integer, source: computed, description: "count(Story where slot_id = this AND status = SCHEDULED)", default: 0 }
      - { name: status, type: enum, source: system, description: "ACTIVE | CANCELLED" }

  - name: ReviewRecord
    parent: null
    common_fields: false
    fields:
      - { name: story_id, type: string, source: system, description: "FK -> Story.id; from path" }
      - { name: reviewer_staff_id, type: string, source: system, description: "FK -> StaffMember.id; from X-User-ID" }
      - { name: review_type, type: enum, source: input, description: "FACT_CHECK | LEGAL" }
      - { name: verdict, type: enum, source: input, description: "PASS | FAIL" }
      - { name: notes, type: string, source: input, description: "Optional reviewer notes" }
      - { name: reviewed_story_version, type: integer, source: system, description: "Story version pinned at submit (OCC); equals the expected_story_version supplied" }
      - { name: review_round, type: integer, source: computed, description: "Per (story_id, review_type) chronological round: count of prior reviews of same type for the story + 1" }
      - { name: is_current, type: boolean, source: computed, description: "True only on the latest review of its (story_id, review_type); earlier ones flip to false when a newer review of that type is recorded" }

  - name: Correction
    parent: null
    common_fields: true
    fields:
      - { name: story_id, type: string, source: system, description: "FK -> Story.id; from path" }
      - { name: proposer_staff_id, type: string, source: system, description: "FK -> StaffMember.id; from X-User-ID" }
      - { name: severity, type: enum, source: input, description: "MINOR | MAJOR | RETRACTION" }
      - { name: correction_text, type: string, source: input, description: "Public correction text" }
      - { name: status, type: enum, source: system, description: "PROPOSED | APPROVED | REJECTED | ISSUED" }
      - { name: approver_staff_id, type: string, source: system, description: "FK -> StaffMember.id; nullable; set at approve" }
      - { name: correction_number, type: integer, source: computed, description: "Nullable until ISSUED; per-story chronological sequence = count of prior ISSUED corrections for the story + 1" }
      - { name: issued_at, type: datetime, source: system, description: "Nullable; logical clock at issue" }

  - name: AnalyticsReport
    parent: null
    common_fields: false
    fields:
      - { name: story_id, type: string, source: system, description: "FK -> Story.id; from path" }
      - { name: variant, type: enum, source: input, description: "REALTIME | SETTLED" }
      - { name: window_start, type: datetime, source: input, description: "Measurement window start" }
      - { name: window_end, type: datetime, source: input, description: "Measurement window end; unique per (story_id, variant, window_end)" }
      - { name: views, type: integer, source: input, description: "Measured views", constraints: ">= 0" }
      - { name: engagement_minutes, type: integer, source: input, description: "Measured engagement minutes", constraints: ">= 0" }
      - { name: raw_score, type: number, source: computed, description: "performance_score stage 1: round_half_up((views*6 + engagement_minutes*4)/100, 2)" }
      - { name: tier, type: enum, source: computed, description: "A if raw_score >= 100, else B if raw_score >= 40, else C" }
      - { name: performance_score, type: number, source: computed, description: "SETTLED: round_half_up(raw_score x TIER_MULT, 2); REALTIME: additionally x 0.9 then re-rounded; TIER_MULT A=1.25 B=1.0 C=0.8" }
      - { name: status, type: enum, source: system, description: "ACTIVE | VOID; voided when the story is retracted", default: "ACTIVE" }

  - name: BreakingNewsEvent
    parent: null
    common_fields: true
    fields:
      - { name: title, type: string, source: input, description: "Event label" }
      - { name: priority_band, type: integer, source: input, description: "1 | 2 | 3; bump floor BUMP_FLOOR = {1: 9999, 2: 60, 3: 30}", constraints: "1..3" }
      - { name: window_start, type: datetime, source: input, description: "Event coverage window start" }
      - { name: window_end, type: datetime, source: input, description: "Event coverage window end; must be > window_start" }
      - { name: call_in_pool_size, type: integer, source: input, description: "How many staff to page on activation", default: 2, constraints: ">= 0" }
      - { name: status, type: enum, source: system, description: "DECLARED | ACTIVE | RESOLVED" }
      - { name: declared_by, type: string, source: system, description: "Opaque X-User-ID of the declaring NewsDirector (operator id, not an FK)" }
      - { name: resolved_at, type: datetime, source: system, description: "Nullable; logical clock at resolve" }

  - name: StaffCallIn
    parent: null
    common_fields: true
    fields:
      - { name: event_id, type: string, source: system, description: "FK -> BreakingNewsEvent.id" }
      - { name: staff_id, type: string, source: system, description: "FK -> StaffMember.id" }
      - { name: status, type: enum, source: system, description: "PAGED | CONFIRMED | DECLINED | EXPIRED" }
      - { name: paged_at, type: datetime, source: system, description: "Logical clock at activation" }
      - { name: expires_at, type: datetime, source: system, description: "paged_at + CALL_IN_TTL_MINUTES (60)" }

# =============================================================================
# Table 2: State Machine Table
# =============================================================================
state_machines:
  - entity: Pitch
    initial_state: SUBMITTED
    terminal_states: [GREENLIT, REJECTED, WITHDRAWN]
    transitions:
      - from: SUBMITTED
        to: DESK_REVIEW
        trigger: POST /newsroom/pitches/{id}/start-review
        actor: AssignmentEditor
        preconditions:
          - "pitch.status == SUBMITTED (else ERR_INVALID_STATE)"
        side_effects:
          - "pitch.version += 1"
      - from: DESK_REVIEW
        to: SUBMITTED
        trigger: POST /newsroom/pitches/{id}/return
        actor: AssignmentEditor
        preconditions:
          - "pitch.status == DESK_REVIEW (else ERR_INVALID_STATE)"
          - "pitch.rework_round < 3 (else ERR_PITCH_REWORK_LIMIT; business_constraint)"
        side_effects:
          - "pitch.rework_round += 1"
          - "pitch.version += 1"
      - from: DESK_REVIEW
        to: GREENLIT
        trigger: POST /newsroom/pitches/{id}/greenlight
        actor: AssignmentEditor
        preconditions:
          - "pitch.status == DESK_REVIEW (else ERR_INVALID_STATE)"
        side_effects:
          - "create Story: pitch_id = pitch.id, desk = pitch.desk, story_type = request story_type, author_staff_id = pitch.submitting_staff_id, status = DRAFT, word_count = 0, embargo_until = null, slot_id = null, correction_count = 0"
          - "Story.priority_score = story_priority_score DESK_FORWARD computed from pitch.urgency, pitch.desk, pitch.deadline_at and the logical clock"
          - "pitch.greenlit_story_id = new story id; pitch.version += 1"
      - from: DESK_REVIEW
        to: REJECTED
        trigger: POST /newsroom/pitches/{id}/reject
        actor: AssignmentEditor
        preconditions:
          - "pitch.status == DESK_REVIEW (else ERR_INVALID_STATE)"
        side_effects:
          - "pitch.version += 1"
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: POST /newsroom/pitches/{id}/withdraw
        actor: "Reporter | Photographer | CopyEditor | FactChecker | LegalReviewer | AssignmentEditor | ManagingEditor (ownership: X-User-ID == pitch.submitting_staff_id)"
        preconditions:
          - "pitch.status IN {SUBMITTED, DESK_REVIEW} (else ERR_INVALID_STATE)"
          - "X-User-ID == pitch.submitting_staff_id (else ERR_FORBIDDEN)"
        side_effects:
          - "pitch.version += 1"
      - from: DESK_REVIEW
        to: WITHDRAWN
        trigger: POST /newsroom/pitches/{id}/withdraw
        actor: "owner roles as above"
        preconditions:
          - "pitch.status IN {SUBMITTED, DESK_REVIEW} (else ERR_INVALID_STATE)"
          - "X-User-ID == pitch.submitting_staff_id (else ERR_FORBIDDEN)"
        side_effects:
          - "pitch.version += 1"

  - entity: Story
    initial_state: DRAFT
    terminal_states: [RETRACTED, KILLED]
    transitions:
      - from: DRAFT
        to: IN_EDIT
        trigger: POST /newsroom/stories/{id}/submit-edit
        actor: "authoring roles (ownership: X-User-ID == story.author_staff_id)"
        preconditions:
          - "story.status == DRAFT (else ERR_INVALID_STATE)"
          - "count(Assignment where story_id = story.id AND assignment_role = REPORTER AND status IN {ACCEPTED, COMPLETED}) >= 1 (else ERR_NO_REPORTING_ASSIGNMENT; business_safety)"
        side_effects:
          - "story.version += 1"
      - from: IN_EDIT
        to: FACT_CHECK
        trigger: POST /newsroom/stories/{id}/complete-edit
        actor: CopyEditor
        preconditions:
          - "story.status == IN_EDIT (else ERR_INVALID_STATE)"
          - "X-User-ID != story.author_staff_id (segregation of duties; else ERR_SEGREGATION_OF_DUTIES; business_safety)"
        side_effects:
          - "story.version += 1"
      - from: FACT_CHECK
        to: LEGAL_REVIEW
        trigger: POST /newsroom/stories/{id}/reviews with review_type=FACT_CHECK, verdict=PASS
        actor: FactChecker
        preconditions:
          - "story.status == FACT_CHECK AND review_type == FACT_CHECK (else ERR_INVALID_STATE)"
          - "X-User-ID != story.author_staff_id (else ERR_SEGREGATION_OF_DUTIES)"
          - "expected_story_version == story.version (else ERR_STALE_VERSION 412)"
        side_effects:
          - "create ReviewRecord (round = prior FACT_CHECK count + 1); flip previous FACT_CHECK reviews of this story to is_current = false"
          - "story.version += 1"
      - from: FACT_CHECK
        to: IN_EDIT
        trigger: POST /newsroom/stories/{id}/reviews with review_type=FACT_CHECK, verdict=FAIL
        actor: FactChecker
        preconditions:
          - "story.status == FACT_CHECK AND review_type == FACT_CHECK (else ERR_INVALID_STATE)"
          - "X-User-ID != story.author_staff_id (else ERR_SEGREGATION_OF_DUTIES)"
          - "expected_story_version == story.version (else ERR_STALE_VERSION 412)"
        side_effects:
          - "create ReviewRecord as above (revision loop back to edit)"
          - "story.version += 1"
      - from: LEGAL_REVIEW
        to: CLEARED
        trigger: POST /newsroom/stories/{id}/reviews with review_type=LEGAL, verdict=PASS
        actor: LegalReviewer
        preconditions:
          - "story.status == LEGAL_REVIEW AND review_type == LEGAL (else ERR_INVALID_STATE)"
          - "X-User-ID != story.author_staff_id (else ERR_SEGREGATION_OF_DUTIES)"
          - "expected_story_version == story.version (else ERR_STALE_VERSION 412)"
        side_effects:
          - "create ReviewRecord (round = prior LEGAL count + 1); flip previous LEGAL reviews of this story to is_current = false"
          - "story.version += 1"
      - from: LEGAL_REVIEW
        to: IN_EDIT
        trigger: POST /newsroom/stories/{id}/reviews with review_type=LEGAL, verdict=FAIL
        actor: LegalReviewer
        preconditions:
          - "story.status == LEGAL_REVIEW AND review_type == LEGAL (else ERR_INVALID_STATE)"
          - "X-User-ID != story.author_staff_id (else ERR_SEGREGATION_OF_DUTIES)"
          - "expected_story_version == story.version (else ERR_STALE_VERSION 412)"
        side_effects:
          - "create ReviewRecord as above (revision loop back to edit)"
          - "story.version += 1"
      - from: CLEARED
        to: SCHEDULED
        trigger: POST /newsroom/stories/{id}/schedule
        actor: AssignmentEditor
        preconditions:
          - "story.status == CLEARED (else ERR_INVALID_STATE)"
          - "expected_story_version == story.version (else ERR_STALE_VERSION 412)"
          - "slot exists (else ERR_SLOT_NOT_FOUND)"
          - "slot.status == ACTIVE (else ERR_INVALID_STATE)"
          - "story.story_type == slot.channel (else ERR_CHANNEL_MISMATCH; business_referential)"
          - "story.embargo_until IS NULL OR story.embargo_until <= slot.window_end (else ERR_EMBARGO_BEYOND_SLOT; business_temporal)"
          - "slot.reserved_count < slot.capacity (else ERR_SLOT_CAPACITY_EXCEEDED; business_fiscal)"
        side_effects:
          - "story.slot_id = slot.id; slot.reserved_count += 1; story.version += 1"
      - from: SCHEDULED
        to: CLEARED
        trigger: POST /newsroom/stories/{id}/unschedule
        actor: AssignmentEditor
        preconditions:
          - "story.status == SCHEDULED (else ERR_INVALID_STATE)"
        side_effects:
          - "slot.reserved_count -= 1 on story.slot_id; story.slot_id = null; story.version += 1"
      - from: CLEARED
        to: IN_EDIT
        trigger: POST /newsroom/stories/{id}/reopen
        actor: ManagingEditor
        preconditions:
          - "story.status == CLEARED (else ERR_INVALID_STATE)"
        side_effects:
          - "story.version += 1 (major revision; prior ReviewRecords remain but the pipeline must be re-run)"
      - from: SCHEDULED
        to: PUBLISHED
        trigger: "system: POST /newsroom/ops/run-publication-scheduler publishes every SCHEDULED story whose slot.window_start <= now AND (embargo_until IS NULL OR embargo_until <= now)"
        actor: system
        preconditions:
          - "story.status == SCHEDULED"
          - "slot.window_start <= logical now"
          - "embargo satisfied (null or <= logical now)"
        side_effects:
          - "story.published_at = now; story.version += 1"
      - from: PUBLISHED
        to: RETRACTED
        trigger: "system: side effect of POST /newsroom/corrections/{id}/issue when severity = RETRACTION"
        actor: system
        preconditions:
          - "correction.status == APPROVED AND story.status == PUBLISHED"
        side_effects:
          - "story.version += 1"
          - "every AnalyticsReport with story_id = story.id AND status = ACTIVE -> VOID (hop 2 of the retraction cascade)"
      - from: "DRAFT | IN_EDIT | FACT_CHECK | LEGAL_REVIEW | CLEARED | SCHEDULED | ON_HOLD"
        to: KILLED
        trigger: POST /newsroom/stories/{id}/kill
        actor: ManagingEditor
        preconditions:
          - "story.status IN {DRAFT, IN_EDIT, FACT_CHECK, LEGAL_REVIEW, CLEARED, SCHEDULED, ON_HOLD} (PUBLISHED/RETRACTED rejected with ERR_INVALID_STATE)"
        side_effects:
          - "every Assignment with story_id = story.id AND status IN {PROPOSED, ACCEPTED} -> CANCELLED; each affected StaffMember.active_assignment_count recomputed"
          - "if story was SCHEDULED: slot.reserved_count -= 1 and story.slot_id = null"
          - "story.version += 1"
      - from: "DRAFT | IN_EDIT | FACT_CHECK | LEGAL_REVIEW | CLEARED | SCHEDULED"
        to: ON_HOLD
        trigger: "system: side effect of breaking-event activation when the story's last active reporter assignment is bumped"
        actor: system
        preconditions:
          - "an Assignment of this story with assignment_role = REPORTER transitioned ACCEPTED -> BUMPED"
          - "count(Assignment where story_id = story.id AND assignment_role = REPORTER AND status IN {PROPOSED, ACCEPTED}) == 0 after the bump"
        side_effects:
          - "if story was SCHEDULED: slot.reserved_count -= 1 and story.slot_id = null (hop 3 of the bump cascade)"
          - "story.version += 1"
      - from: ON_HOLD
        to: DRAFT
        trigger: "system: bubble-up when a REPORTER Assignment on this story transitions PROPOSED -> ACCEPTED"
        actor: system
        preconditions:
          - "story.status == ON_HOLD"
          - "the accepted assignment has story_id = story.id AND assignment_role = REPORTER"
        side_effects:
          - "story.version += 1"
    notes:
      - "PATCH /newsroom/stories/{id} (word_count, embargo_until) is allowed only in DRAFT and IN_EDIT, is author-owned, and bumps story.version without changing status — this is how schedule/review OCC tokens go stale."

  - entity: Assignment
    initial_state: PROPOSED
    terminal_states: [DECLINED, CANCELLED, COMPLETED, BUMPED]
    transitions:
      - from: null
        to: PROPOSED
        trigger: POST /newsroom/assignments
        actor: AssignmentEditor
        preconditions:
          - "story exists (ERR_STORY_NOT_FOUND) and staff exists (ERR_STAFF_NOT_FOUND)"
          - "story.status IN {DRAFT, IN_EDIT, ON_HOLD} (else ERR_INVALID_STATE)"
          - "staff.employment_status == ACTIVE (else ERR_STAFF_INACTIVE; business_referential)"
          - "staff.role_capability == assignment_role (else ERR_CAPABILITY_MISMATCH; business_referential)"
          - "end_at > start_at (else ERR_INVALID_INTERVAL; business_temporal)"
          - "no half-open overlap with any other Assignment of the same staff_id with status IN {PROPOSED, ACCEPTED}: conflict iff new.start_at < other.end_at AND new.end_at > other.start_at (else ERR_STAFF_TIME_CONFLICT; business_constraint)"
        side_effects:
          - "staff.active_assignment_count recomputed (+1)"
          - "provisional_cost_cents = assignment_cost PROVISIONAL"
      - from: PROPOSED
        to: ACCEPTED
        trigger: POST /newsroom/assignments/{id}/accept
        actor: "Reporter | Photographer (ownership: X-User-ID == assignment.staff_id)"
        preconditions:
          - "assignment.status == PROPOSED (else ERR_INVALID_STATE)"
          - "staff.employment_status == ACTIVE (else ERR_STAFF_INACTIVE)"
          - "overlap re-check against the staff member's other {PROPOSED, ACCEPTED} assignments (else ERR_STAFF_TIME_CONFLICT)"
          - "count(Assignment where staff_id = staff AND status = ACCEPTED) < staff.max_concurrent_assignments (else ERR_ASSIGNMENT_CAP_REACHED; business_fiscal; boundary: rejection when accepted count == max)"
        side_effects:
          - "staff.active_assignment_count unchanged in value (PROPOSED and ACCEPTED both count)"
          - "if story.status == ON_HOLD AND assignment.assignment_role == REPORTER: story ON_HOLD -> DRAFT (bubble-up resume)"
      - from: PROPOSED
        to: DECLINED
        trigger: POST /newsroom/assignments/{id}/decline
        actor: "Reporter | Photographer (ownership)"
        preconditions:
          - "assignment.status == PROPOSED (else ERR_INVALID_STATE)"
        side_effects:
          - "staff.active_assignment_count recomputed (-1)"
      - from: ACCEPTED
        to: COMPLETED
        trigger: POST /newsroom/assignments/{id}/complete
        actor: "Reporter | Photographer (ownership) | AssignmentEditor"
        preconditions:
          - "assignment.status == ACCEPTED (else ERR_INVALID_STATE)"
        side_effects:
          - "completed_at = logical now; actual_effort_minutes recorded"
          - "final_cost_cents = assignment_cost FINAL with weekly overtime allocated chronologically (see calculation); completing also recomputes final_cost_cents for ALL of the staff member's COMPLETED assignments in the same payroll week (retroactive re-allocation)"
          - "staff.active_assignment_count recomputed (-1)"
      - from: PROPOSED
        to: CANCELLED
        trigger: "POST /newsroom/assignments/{id}/cancel or story kill cascade"
        actor: "AssignmentEditor | system"
        preconditions:
          - "assignment.status IN {PROPOSED, ACCEPTED} (else ERR_INVALID_STATE)"
        side_effects:
          - "staff.active_assignment_count recomputed (-1)"
      - from: ACCEPTED
        to: CANCELLED
        trigger: "POST /newsroom/assignments/{id}/cancel or story kill cascade"
        actor: "AssignmentEditor | system"
        preconditions:
          - "assignment.status IN {PROPOSED, ACCEPTED} (else ERR_INVALID_STATE)"
        side_effects:
          - "staff.active_assignment_count recomputed (-1)"
      - from: ACCEPTED
        to: BUMPED
        trigger: "system: side effect of POST /newsroom/breaking-events/{id}/activate"
        actor: system
        preconditions:
          - "assignment.status == ACCEPTED"
          - "half-open window intersection: assignment.start_at < event.window_end AND assignment.end_at > event.window_start"
          - "assignment's story.priority_score < BUMP_FLOOR[event.priority_band]"
        side_effects:
          - "assignment.bumped_by_event_id = event.id"
          - "staff.active_assignment_count recomputed (-1)"
          - "story re-evaluation (hop 2): if the story now has zero REPORTER assignments in {PROPOSED, ACCEPTED} -> story -> ON_HOLD; if it was SCHEDULED, slot release follows (hop 3)"

  - entity: Correction
    initial_state: PROPOSED
    terminal_states: [REJECTED, ISSUED]
    transitions:
      - from: null
        to: PROPOSED
        trigger: POST /newsroom/stories/{id}/corrections
        actor: "Reporter | Photographer | CopyEditor | FactChecker | LegalReviewer | AssignmentEditor | ManagingEditor"
        preconditions:
          - "story.status == PUBLISHED (else ERR_STORY_NOT_PUBLISHED)"
        side_effects:
          - "proposer_staff_id = X-User-ID"
      - from: PROPOSED
        to: APPROVED
        trigger: POST /newsroom/corrections/{id}/approve
        actor: ManagingEditor
        preconditions:
          - "correction.status == PROPOSED (else ERR_INVALID_STATE)"
          - "X-User-ID != correction.proposer_staff_id (segregation of duties; else ERR_SEGREGATION_OF_DUTIES)"
        side_effects:
          - "approver_staff_id = X-User-ID; correction.version += 1"
      - from: PROPOSED
        to: REJECTED
        trigger: POST /newsroom/corrections/{id}/reject
        actor: ManagingEditor
        preconditions:
          - "correction.status == PROPOSED (else ERR_INVALID_STATE)"
        side_effects:
          - "correction.version += 1"
      - from: APPROVED
        to: ISSUED
        trigger: POST /newsroom/corrections/{id}/issue
        actor: ManagingEditor
        preconditions:
          - "correction.status == APPROVED (else ERR_INVALID_STATE)"
          - "story.status == PUBLISHED (else ERR_STORY_NOT_PUBLISHED; cross-entity gate)"
        side_effects:
          - "correction_number = count(prior ISSUED corrections on the story) + 1; issued_at = logical now; correction.version += 1"
          - "story.correction_count += 1; story.version += 1"
          - "if severity == RETRACTION: story PUBLISHED -> RETRACTED, then every ACTIVE AnalyticsReport of the story -> VOID (2-hop cascade)"

  - entity: BreakingNewsEvent
    initial_state: DECLARED
    terminal_states: [RESOLVED]
    transitions:
      - from: DECLARED
        to: ACTIVE
        trigger: POST /newsroom/breaking-events/{id}/activate
        actor: NewsDirector
        preconditions:
          - "event.status == DECLARED (else ERR_INVALID_STATE)"
        side_effects:
          - "hop 1: every ACCEPTED Assignment whose [start_at, end_at) half-open intersects [event.window_start, event.window_end) AND whose story.priority_score < BUMP_FLOOR[event.priority_band] -> BUMPED (staff counts recomputed)"
          - "hop 2: each bumped story with zero remaining REPORTER assignments in {PROPOSED, ACCEPTED} -> ON_HOLD"
          - "hop 3: each such story that was SCHEDULED releases its slot (reserved_count -= 1, slot_id = null)"
          - "selector (independent fan-out): page up to call_in_pool_size StaffMembers — eligibility: employment_status = ACTIVE AND role_capability IN {REPORTER, PHOTOGRAPHER}; ranking: active_assignment_count ASC, tie-break created_at ASC; create StaffCallIn PAGED records IN RANKING ORDER with paged_at = now, expires_at = now + 60 minutes; empty pool -> zero call-ins and activation still succeeds"
      - from: ACTIVE
        to: RESOLVED
        trigger: POST /newsroom/breaking-events/{id}/resolve
        actor: NewsDirector
        preconditions:
          - "event.status == ACTIVE (else ERR_INVALID_STATE)"
        side_effects:
          - "resolved_at = logical now; every StaffCallIn of this event still PAGED -> EXPIRED"

  - entity: StaffCallIn
    initial_state: PAGED
    terminal_states: [CONFIRMED, DECLINED, EXPIRED]
    transitions:
      - from: PAGED
        to: CONFIRMED
        trigger: POST /newsroom/call-ins/{id}/confirm
        actor: "Reporter | Photographer (ownership: X-User-ID == call_in.staff_id)"
        preconditions:
          - "call_in.status == PAGED (else ERR_INVALID_STATE)"
          - "logical now < call_in.expires_at (else auto-transition to EXPIRED and reject with ERR_CALL_IN_EXPIRED; business_temporal)"
        side_effects:
          - "call_in.version += 1"
      - from: PAGED
        to: DECLINED
        trigger: POST /newsroom/call-ins/{id}/decline
        actor: "Reporter | Photographer (ownership)"
        preconditions:
          - "call_in.status == PAGED (else ERR_INVALID_STATE)"
          - "logical now < call_in.expires_at (else EXPIRED + ERR_CALL_IN_EXPIRED)"
        side_effects:
          - "call_in.version += 1"
      - from: PAGED
        to: EXPIRED
        trigger: "system: POST /newsroom/ops/run-publication-scheduler expires every PAGED call-in with expires_at <= now; also on event resolve; also lazily on a late confirm/decline"
        actor: system
        preconditions:
          - "call_in.status == PAGED AND expires_at <= logical now"
        side_effects:
          - "call_in.version += 1"

  - entity: PublicationSlot
    initial_state: ACTIVE
    terminal_states: [CANCELLED]
    transitions:
      - from: ACTIVE
        to: CANCELLED
        trigger: POST /newsroom/slots/{id}/cancel
        actor: ManagingEditor
        preconditions:
          - "slot.status == ACTIVE (else ERR_INVALID_STATE)"
          - "slot.reserved_count == 0 (else ERR_SLOT_NOT_EMPTY; business_constraint)"
        side_effects:
          - "slot.version += 1"

  - entity: AnalyticsReport
    initial_state: ACTIVE
    terminal_states: [VOID]
    transitions:
      - from: ACTIVE
        to: VOID
        trigger: "system: side effect of story retraction (correction issue with severity RETRACTION)"
        actor: system
        preconditions:
          - "report.status == ACTIVE AND report.story_id status became RETRACTED"
        side_effects: []

# =============================================================================
# Concurrency Rules (§1.2.1) — OCC on Story.version only
# =============================================================================
concurrency_rules:
  - rule_id: schedule-story-stale-version
    parent_entity: Story
    write_endpoint: "POST /newsroom/stories/{id}/schedule"
    occ_field: "expected_story_version"
    description: |
      Scheduling a story carries the story version the desk last observed.
      A schedule request whose expected_story_version no longer equals the
      story's current version is rejected — e.g. the story was edited or
      re-scheduled (which legitimately supersedes the desk's prior view)
      since the token was read.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: review-submit-stale-version
    parent_entity: Story
    write_endpoint: "POST /newsroom/stories/{id}/reviews"
    occ_field: "expected_story_version"
    description: |
      A review verdict pins the exact story version it reviewed
      (reviewed_story_version). A verdict submitted against a version that
      has since advanced — e.g. the author filed a new edit after the
      reviewer started reading — is rejected as stale so reviews never
      attach to content they did not see.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 3: Calculation Rules Table
# =============================================================================
calculations:
  - name: story_priority_score
    description: "Desk prioritization score for a story; stored on the story at creation (DESK_FORWARD) and recomputed on demand for the bump check and the analytics-blend read."
    trigger: "story creation at greenlight; GET /newsroom/stories/{id}/priority-score; breaking-event activation bump evaluation (DESK_FORWARD)"
    algorithm: weighted_scoring
    formula: |
      urgency_w = URGENCY_WEIGHT[pitch.urgency]          # STANDARD 10 | URGENT 25 | BREAKING 40
      desk_w    = DESK_WEIGHT[pitch.desk]                # METRO 5 | BUSINESS 4 | SPORTS 3 | FEATURES 2
      hours_to_deadline = (pitch.deadline_at - now) / 3600.0
      time_pressure = min(max((72 - hours_to_deadline) / 72.0, 0), 1)   # clamped both ends
      desk_base = round_half_up(urgency_w * 2 + desk_w + time_pressure * 30, 2)
      DESK_FORWARD    = desk_base
      ANALYTICS_BLEND = round_half_up(0.6 * desk_base + 0.4 * author_track_record(author_staff_id), 2)
    input_set: "The story's source pitch (urgency, desk, deadline_at), the logical clock, and (ANALYTICS_BLEND only) author_track_record over the author's PUBLISHED stories."
    constants:
      URGENCY_WEIGHT_STANDARD: 10
      URGENCY_WEIGHT_URGENT: 25
      URGENCY_WEIGHT_BREAKING: 40
      DESK_WEIGHT_METRO: 5
      DESK_WEIGHT_BUSINESS: 4
      DESK_WEIGHT_SPORTS: 3
      DESK_WEIGHT_FEATURES: 2
      TIME_PRESSURE_HORIZON_HOURS: 72
      TIME_PRESSURE_MAX_POINTS: 30
      ANALYTICS_DESK_FRACTION: 0.6
      ANALYTICS_TRACK_FRACTION: 0.4
    precision: "2 decimal places, round_half_up"
    variants:
      - name: DESK_FORWARD
        when: "Stored on Story.priority_score at creation; used by the breaking-news bump check."
        difference: "Pure forward-looking desk inputs; ignores author history entirely."
      - name: ANALYTICS_BLEND
        when: "Returned by GET /newsroom/stories/{id}/priority-score?variant=ANALYTICS for desk ranking reviews."
        difference: "Blends 0.6 x desk_base with 0.4 x author_track_record; identical story data scores differently once the author has settled analytics."

  - name: author_track_record
    description: "Author's settled performance average feeding ANALYTICS_BLEND."
    trigger: "evaluated inside story_priority_score ANALYTICS_BLEND"
    algorithm: aggregation
    formula: |
      reports = AnalyticsReport where status = ACTIVE AND variant = SETTLED
                AND report.story.author_staff_id = author AND story.status IN {PUBLISHED, RETRACTED}
      if empty: 0
      else: round_half_up(avg(performance_score), 2)
    input_set: "Only ACTIVE, SETTLED reports attached to stories authored by the staff member that are PUBLISHED or RETRACTED; REALTIME and VOID reports excluded."
    constants:
      EMPTY_DEFAULT: 0
    precision: "2 decimal places, round_half_up"

  - name: assignment_cost
    description: "Per-assignment cost with a provisional planned variant and a final actual variant with weekly overtime."
    trigger: "PROVISIONAL at assignment creation; FINAL at assignment completion (and re-allocated across the payroll week on every completion)"
    algorithm: threshold
    formula: |
      rate_per_minute = staff.hourly_rate_cents / 60.0
      PROVISIONAL = round_half_up(planned_effort_minutes * rate_per_minute, 0)
      FINAL (per assignment in payroll week W of staff S):
        process S's COMPLETED assignments in W ordered by completed_at ASC, tie-break created_at ASC
        running_minutes = sum of actual_effort_minutes of earlier assignments in the order
        reg = min(actual_effort_minutes, max(0, WEEKLY_REGULAR_MINUTES - running_minutes))
        ot  = actual_effort_minutes - reg
        final_cost_cents = round_half_up((reg + ot * OT_MULTIPLIER) * rate_per_minute, 0)
    input_set: "PROVISIONAL: the new assignment's planned_effort_minutes and staff rate. FINAL: all COMPLETED assignments of the staff member whose completed_at falls in the same payroll week [Monday 00:00:00Z, next Monday 00:00:00Z)."
    constants:
      WEEKLY_REGULAR_MINUTES: 2400
      OT_MULTIPLIER: 1.5
    precision: "integer cents, round_half_up (0 decimal places)"
    variants:
      - name: PROVISIONAL
        when: "At creation; stored in provisional_cost_cents."
        difference: "Planned minutes, standard rate, no overtime — ignores actuals."
      - name: FINAL
        when: "At completion; stored in final_cost_cents."
        difference: "Actual minutes with weekly overtime threshold; the same assignment can cost more than its provisional figure once the week fills up."

  - name: payroll_week_total
    description: "Weekly payroll snapshot for a staff member; pins the rounding order (round per assignment, then sum)."
    trigger: "GET /newsroom/staff/{id}/payroll?week_start=YYYY-MM-DD"
    algorithm: chronological
    formula: |
      week = [week_start 00:00:00Z, week_start + 7 days 00:00:00Z)   # week_start must be a Monday
      items = staff's COMPLETED assignments with completed_at in week,
              ordered completed_at ASC, tie-break created_at ASC
      for each item: final_cost_cents recomputed per assignment_cost FINAL   # round PER ASSIGNMENT first
      regular_minutes = sum of reg across items (chronological allocation)
      overtime_minutes = sum of ot across items
      total_cents = sum of the per-assignment rounded final_cost_cents       # then SUM — never sum-minutes-then-round
    input_set: "Only COMPLETED assignments of the staff member in the payroll week; DECLINED/CANCELLED/BUMPED/PROPOSED/ACCEPTED excluded."
    constants:
      WEEK_DAYS: 7
    precision: "integer cents; per-assignment rounding (round_half_up, 0 dp) happens before summation"

  - name: performance_score
    description: "Content performance score for an analytics report; tier looks like it depends on the final score but the evaluation order is pinned raw -> tier -> multiplier."
    trigger: "POST /newsroom/stories/{id}/analytics-reports"
    algorithm: weighted_scoring
    formula: |
      # Evaluation order is pinned to break the apparent raw<->tier circularity:
      raw_score = round_half_up((views * 6 + engagement_minutes * 4) / 100.0, 2)   # stage 1
      tier = "A" if raw_score >= 100 else ("B" if raw_score >= 40 else "C")       # stage 2, from RAW only
      SETTLED  = round_half_up(raw_score * TIER_MULT[tier], 2)                    # stage 3
      REALTIME = round_half_up(raw_score * TIER_MULT[tier] * REALTIME_DAMPEN, 2)  # dampen then re-round
    input_set: "The report's own views and engagement_minutes."
    constants:
      VIEW_POINTS_PER: 6
      ENGAGEMENT_POINTS_PER: 4
      DIVISOR: 100
      TIER_A_FLOOR: 100
      TIER_B_FLOOR: 40
      TIER_MULT_A: 1.25
      TIER_MULT_B: 1.0
      TIER_MULT_C: 0.8
      REALTIME_DAMPEN: 0.9
    precision: "2 decimal places, round_half_up; rounding applied at stage 1 and again at stage 3"
    variants:
      - name: SETTLED
        when: "Final measurement for a closed window."
        difference: "raw x tier multiplier only."
      - name: REALTIME
        when: "Provisional in-flight measurement."
        difference: "Additionally multiplied by 0.9 and re-rounded — same inputs score lower than SETTLED."

  - name: active_assignment_count
    description: "StaffMember workload counter (compensating-invariant target)."
    trigger: "any Assignment status mutation for the staff member"
    algorithm: aggregation
    formula: "count(Assignment where staff_id = S AND status IN {PROPOSED, ACCEPTED})"
    input_set: "All non-terminal-plus-active assignments: PROPOSED and ACCEPTED only; DECLINED, CANCELLED, COMPLETED, BUMPED excluded."
    constants: {}
    precision: "integer"

  - name: slot_reserved_count
    description: "PublicationSlot reservation counter (compensating-invariant target)."
    trigger: "story schedule, unschedule, kill of a SCHEDULED story, or bump cascade releasing a slot"
    algorithm: aggregation
    formula: "count(Story where slot_id = slot.id AND status = SCHEDULED)"
    input_set: "Only SCHEDULED stories pointing at the slot; ON_HOLD/CLEARED/KILLED/PUBLISHED excluded."
    constants: {}
    precision: "integer"

  - name: correction_number
    description: "Per-story chronological correction sequence assigned at issue time."
    trigger: "POST /newsroom/corrections/{id}/issue"
    algorithm: chronological
    formula: "correction_number = count(Correction where story_id = story AND status = ISSUED) + 1, evaluated at the instant of issue; concurrent issuance is serialized by the story version bump in the issue side effects."
    input_set: "ISSUED corrections of the same story only; PROPOSED/APPROVED/REJECTED excluded."
    constants: {}
    precision: "integer"

# =============================================================================
# Table 4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present, role recognized; for entity_backed roles X-User-ID must identify an existing StaffMember", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "Acting role is listed in the endpoint's roles", error_id: ERR_FORBIDDEN, http_status: 403, applies_to: "all" }
  - { priority: 3, category: existence, check: "Request body schema: required fields present, types correct, enum values in domain (urgency, story_type, severity, review_type, verdict, variant, channel, role_capability, home_desk, employment_status, assignment_role)", error_id: ERR_VALIDATION, http_status: 400, applies_to: "all POST/PATCH with a body" }
  - { priority: 4, category: existence, check: "Path parameters resolve left-to-right (staffId, pitchId, storyId, assignmentId, slotId, correctionId, eventId, callInId)", error_id: ERR_STAFF_NOT_FOUND, http_status: 404, applies_to: "all parameterized paths; the specific NOT_FOUND id matches the first unresolvable segment (ERR_PITCH_NOT_FOUND, ERR_STORY_NOT_FOUND, ERR_ASSIGNMENT_NOT_FOUND, ERR_SLOT_NOT_FOUND, ERR_CORRECTION_NOT_FOUND, ERR_EVENT_NOT_FOUND, ERR_CALL_IN_NOT_FOUND)" }
  - { priority: 5, category: existence, check: "Request-body foreign keys exist: story_id, staff_id (assignments); slot_id (schedule); superseding_story_id (supersede)", error_id: ERR_STORY_NOT_FOUND, http_status: 404, applies_to: "POST /newsroom/assignments, POST /newsroom/stories/{id}/schedule, POST /newsroom/stories/{id}/supersede; specific id per field (ERR_STAFF_NOT_FOUND, ERR_SLOT_NOT_FOUND, ERR_STORY_NOT_FOUND)" }
  - { priority: 6, category: auth, check: "Ownership scope: X-User-ID == pitch.submitting_staff_id (withdraw); == story.author_staff_id (PATCH story, submit-edit); == assignment.staff_id (accept, decline, complete by field staff); == call_in.staff_id (confirm, decline)", error_id: ERR_FORBIDDEN, http_status: 403, applies_to: "ownership-listed endpoints" }
  - { priority: 7, category: state, check: "Optimistic concurrency on OCC-guarded writes: expected_story_version == story.version; evaluated BEFORE the from-state checks at priority 8 (a stale token therefore yields 412 even when the state is also wrong)", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: "POST /newsroom/stories/{id}/schedule, POST /newsroom/stories/{id}/reviews" }
  - { priority: 8, category: state, check: "Target resource is in a from-state of the invoked transition per §1.2 (includes ERR_STORY_NOT_PUBLISHED for corrections/analytics on non-PUBLISHED stories)", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all action endpoints; corrections/analytics creation uses ERR_STORY_NOT_PUBLISHED (409)" }
  - { priority: 9, category: business_safety, check: "Segregation of duties: complete-edit actor != story author; review submitter != story author; correction approver != correction proposer", error_id: ERR_SEGREGATION_OF_DUTIES, http_status: 422, applies_to: "POST /newsroom/stories/{id}/complete-edit, POST /newsroom/stories/{id}/reviews, POST /newsroom/corrections/{id}/approve" }
  - { priority: 10, category: business_safety, check: "Editorial staffing gate: submit-edit requires >= 1 Assignment on the story with assignment_role = REPORTER and status IN {ACCEPTED, COMPLETED}", error_id: ERR_NO_REPORTING_ASSIGNMENT, http_status: 422, applies_to: "POST /newsroom/stories/{id}/submit-edit" }
  - { priority: 11, category: business_referential, check: "Referenced staff usable: employment_status == ACTIVE at assignment propose/accept; staff.role_capability == assignment_role; story.story_type == slot.channel at schedule", error_id: ERR_STAFF_INACTIVE, http_status: 422, applies_to: "POST /newsroom/assignments, POST /newsroom/assignments/{id}/accept (ERR_STAFF_INACTIVE); capability check ERR_CAPABILITY_MISMATCH (422); channel check ERR_CHANNEL_MISMATCH (422) on schedule" }
  - { priority: 12, category: business_temporal, check: "Interval sanity: end_at > start_at (assignments), window_end > window_start (slots, events, analytics); schedule embargo_until IS NULL OR <= slot.window_end; call-in confirm/decline before expires_at", error_id: ERR_INVALID_INTERVAL, http_status: 422, applies_to: "interval-carrying creates (ERR_INVALID_INTERVAL 422); schedule embargo (ERR_EMBARGO_BEYOND_SLOT 422); call-in expiry (ERR_CALL_IN_EXPIRED 409)" }
  - { priority: 13, category: business_constraint, check: "Mutual exclusion & uniqueness: staff assignment half-open overlap; slot channel window gap < = 30 minutes (inclusive boundary conflicts); analytics uniqueness per (story_id, variant, window_end); slot cancel requires reserved_count == 0; pitch return requires rework_round < 3", error_id: ERR_STAFF_TIME_CONFLICT, http_status: 409, applies_to: "assignments propose/accept (ERR_STAFF_TIME_CONFLICT 409); slots create (ERR_SLOT_WINDOW_CONFLICT 409); analytics create (ERR_DUPLICATE_ANALYTICS_WINDOW 409); slot cancel (ERR_SLOT_NOT_EMPTY 409); pitch return (ERR_PITCH_REWORK_LIMIT 422)" }
  - { priority: 14, category: business_fiscal, check: "Capacity: accept requires count(ACCEPTED assignments of staff) < max_concurrent_assignments; schedule requires slot.reserved_count < slot.capacity", error_id: ERR_ASSIGNMENT_CAP_REACHED, http_status: 422, applies_to: "accept (ERR_ASSIGNMENT_CAP_REACHED 422); schedule (ERR_SLOT_CAPACITY_EXCEEDED 422)" }

# =============================================================================
# Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 5: API Endpoint Table
#
# Conventions applying to every list endpoint in this table:
#   - default sort order is created_at ASC (deterministic; never id-ordered);
#     created_at values are distinct because each creation is a separate request.
#   - pagination follows response_envelope.pagination_defaults.
# =============================================================================
endpoints:
  # --- Staff administration ---
  - { method: POST, path: "/newsroom/staff", description: "Create a staff member", roles: [NewsDirector], code: 201, input: [full_name, role_capability, home_desk, hourly_rate_cents, "max_concurrent_assignments?"], output: StaffMember, side_effects: ["active_assignment_count = 0, employment_status = ACTIVE"] }
  - { method: GET, path: "/newsroom/staff", description: "List staff with filters and pagination", roles: [AssignmentEditor, ManagingEditor, NewsDirector], code: 200, input: ["limit?", "offset?", "role_capability?", "employment_status?", "home_desk?"], output: "StaffMember[]", side_effects: [] }
  - { method: GET, path: "/newsroom/staff/{id}", description: "Read one staff member", roles: [Reporter, Photographer, CopyEditor, FactChecker, LegalReviewer, AssignmentEditor, ManagingEditor, NewsDirector, AnalyticsProducer], code: 200, input: [], output: StaffMember, side_effects: [] }
  - { method: PATCH, path: "/newsroom/staff/{id}", description: "Update employment_status / max_concurrent_assignments / hourly_rate_cents", roles: [NewsDirector], code: 200, input: ["employment_status?", "max_concurrent_assignments?", "hourly_rate_cents?"], output: StaffMember, side_effects: ["staff.version += 1"] }
  - { method: GET, path: "/newsroom/staff/{id}/assignments", description: "Assignments of a staff member (FK reverse)", roles: [AssignmentEditor, ManagingEditor, NewsDirector], code: 200, input: ["limit?", "offset?", "status?"], output: "Assignment[]", side_effects: [] }
  - { method: GET, path: "/newsroom/staff/{id}/payroll", description: "Weekly payroll snapshot; week_start (ISO date, Monday) optional, defaults to the week containing the logical clock", roles: [ManagingEditor, NewsDirector], code: 200, input: ["week_start?"], output: "{ week_start: string, assignment_count: integer, regular_minutes: integer, overtime_minutes: integer, total_cents: integer }", side_effects: ["runs payroll_week_total"] }
  - { method: GET, path: "/newsroom/staff/{id}/reviews", description: "Reviews filed by a staff member (FK reverse)", roles: [AssignmentEditor, ManagingEditor, NewsDirector], code: 200, input: ["limit?", "offset?"], output: "ReviewRecord[]", side_effects: [] }
  - { method: GET, path: "/newsroom/staff/{id}/corrections", description: "Corrections proposed or approved by a staff member (FK reverse)", roles: [ManagingEditor, NewsDirector], code: 200, input: ["limit?", "offset?"], output: "Correction[]", side_effects: [] }
  - { method: GET, path: "/newsroom/staff/{id}/call-ins", description: "Call-ins of a staff member (FK reverse)", roles: [NewsDirector], code: 200, input: ["limit?", "offset?"], output: "StaffCallIn[]", side_effects: [] }

  # --- Pitch intake & desk review ---
  - { method: POST, path: "/newsroom/pitches", description: "Submit a story pitch; submitter recorded from X-User-ID", roles: [Reporter, Photographer, CopyEditor, FactChecker, LegalReviewer, AssignmentEditor, ManagingEditor], code: 201, input: [title, summary, desk, deadline_at, "urgency?"], output: Pitch, side_effects: ["status = SUBMITTED, rework_round = 0"] }
  - { method: GET, path: "/newsroom/pitches", description: "List pitches with filters", roles: [Reporter, Photographer, CopyEditor, FactChecker, LegalReviewer, AssignmentEditor, ManagingEditor, NewsDirector], code: 200, input: ["limit?", "offset?", "status?", "desk?", "submitting_staff_id?", "greenlit_story_id?"], output: "Pitch[]", side_effects: [] }
  - { method: GET, path: "/newsroom/pitches/{id}", description: "Read one pitch", roles: [Reporter, Photographer, CopyEditor, FactChecker, LegalReviewer, AssignmentEditor, ManagingEditor, NewsDirector], code: 200, input: [], output: Pitch, side_effects: [] }
  - { method: GET, path: "/newsroom/pitches/{id}/stories", description: "Stories spawned from a pitch (FK reverse; 0 or 1 element)", roles: [AssignmentEditor, ManagingEditor, NewsDirector], code: 200, input: [], output: "Story[]", side_effects: [] }
  - { method: POST, path: "/newsroom/pitches/{id}/start-review", description: "SUBMITTED -> DESK_REVIEW", roles: [AssignmentEditor], code: 200, input: [], output: Pitch, side_effects: ["pitch.version += 1"] }
  - { method: POST, path: "/newsroom/pitches/{id}/return", description: "DESK_REVIEW -> SUBMITTED rework loop; rework_round += 1; fails at rework_round >= 3", roles: [AssignmentEditor], code: 200, input: [], output: Pitch, side_effects: ["pitch.rework_round += 1", "pitch.version += 1"] }
  - { method: POST, path: "/newsroom/pitches/{id}/greenlight", description: "DESK_REVIEW -> GREENLIT; spawns the Story in DRAFT", roles: [AssignmentEditor], code: 200, input: [story_type], output: Pitch, side_effects: ["create Story (DRAFT) with priority_score = story_priority_score DESK_FORWARD", "pitch.greenlit_story_id set", "pitch.version += 1"] }
  - { method: POST, path: "/newsroom/pitches/{id}/reject", description: "DESK_REVIEW -> REJECTED", roles: [AssignmentEditor], code: 200, input: [], output: Pitch, side_effects: ["pitch.version += 1"] }
  - { method: POST, path: "/newsroom/pitches/{id}/withdraw", description: "SUBMITTED|DESK_REVIEW -> WITHDRAWN; owner only", roles: [Reporter, Photographer, CopyEditor, FactChecker, LegalReviewer, AssignmentEditor, ManagingEditor], code: 200, input: [], output: Pitch, side_effects: ["pitch.version += 1"] }

  # --- Story workflow ---
  - { method: GET, path: "/newsroom/stories", description: "List stories with filters", roles: [Reporter, Photographer, CopyEditor, FactChecker, LegalReviewer, AssignmentEditor, ManagingEditor, NewsDirector, AnalyticsProducer], code: 200, input: ["limit?", "offset?", "status?", "desk?", "author_staff_id?", "superseded_by_story_id?"], output: "Story[]", side_effects: [] }
  - { method: GET, path: "/newsroom/stories/{id}", description: "Read one story", roles: [Reporter, Photographer, CopyEditor, FactChecker, LegalReviewer, AssignmentEditor, ManagingEditor, NewsDirector, AnalyticsProducer], code: 200, input: [], output: Story, side_effects: [] }
  - { method: PATCH, path: "/newsroom/stories/{id}", description: "Edit word_count / embargo_until; author only; only in DRAFT or IN_EDIT; bumps version (invalidates outstanding OCC tokens)", roles: [Reporter, Photographer, CopyEditor, FactChecker, LegalReviewer, AssignmentEditor, ManagingEditor], code: 200, input: ["word_count?", "embargo_until?"], output: Story, side_effects: ["story.version += 1"] }
  - { method: POST, path: "/newsroom/stories/{id}/submit-edit", description: "DRAFT -> IN_EDIT; author only; requires >= 1 ACCEPTED/COMPLETED reporter assignment", roles: [Reporter, Photographer, CopyEditor, FactChecker, LegalReviewer, AssignmentEditor, ManagingEditor], code: 200, input: [], output: Story, side_effects: ["story.version += 1"] }
  - { method: POST, path: "/newsroom/stories/{id}/complete-edit", description: "IN_EDIT -> FACT_CHECK; copy editor who is not the author", roles: [CopyEditor], code: 200, input: [], output: Story, side_effects: ["story.version += 1"] }
  - { method: POST, path: "/newsroom/stories/{id}/reviews", description: "File a fact-check or legal verdict (OCC-pinned to expected_story_version); PASS advances the pipeline, FAIL loops back to IN_EDIT", roles: [FactChecker, LegalReviewer], code: 201, input: [review_type, verdict, "notes?", expected_story_version], output: ReviewRecord, side_effects: ["create ReviewRecord; older same-type reviews is_current = false", "story transition per §1.2; increments Story.version by 1"] }
  - { method: POST, path: "/newsroom/stories/{id}/schedule", description: "CLEARED -> SCHEDULED into a slot (OCC-pinned; supersedes the desk's prior view of the story)", roles: [AssignmentEditor], code: 200, input: [slot_id, expected_story_version], output: Story, side_effects: ["story.slot_id set; slot.reserved_count += 1; increments Story.version by 1"] }
  - { method: POST, path: "/newsroom/stories/{id}/unschedule", description: "SCHEDULED -> CLEARED; releases the slot reservation", roles: [AssignmentEditor], code: 200, input: [], output: Story, side_effects: ["slot.reserved_count -= 1; story.slot_id = null; story.version += 1"] }
  - { method: POST, path: "/newsroom/stories/{id}/reopen", description: "CLEARED -> IN_EDIT major revision; pipeline must be re-run", roles: [ManagingEditor], code: 200, input: [], output: Story, side_effects: ["story.version += 1"] }
  - { method: POST, path: "/newsroom/stories/{id}/kill", description: "Any pre-publication state -> KILLED; cancels open assignments and releases any slot", roles: [ManagingEditor], code: 200, input: [], output: Story, side_effects: ["open assignments -> CANCELLED; staff counts recomputed", "slot release if SCHEDULED", "story.version += 1"] }
  - { method: POST, path: "/newsroom/stories/{id}/supersede", description: "Link a PUBLISHED/RETRACTED story to a live follow-up story (self-referential). Target must be PUBLISHED or RETRACTED (else ERR_INVALID_STATE); superseding_story_id must exist (ERR_STORY_NOT_FOUND), differ from the path id, and reference a non-terminal story (ERR_VALIDATION otherwise)", roles: [AssignmentEditor], code: 200, input: [superseding_story_id], output: Story, side_effects: ["story.superseded_by_story_id set; story.version += 1"] }
  - { method: GET, path: "/newsroom/stories/{id}/priority-score", description: "Computed read of story_priority_score; variant DESK (default) or ANALYTICS", roles: [AssignmentEditor, ManagingEditor, NewsDirector], code: 200, input: ["variant?"], output: "{ variant: string, score: number }", side_effects: ["runs story_priority_score"] }
  - { method: GET, path: "/newsroom/stories/{id}/assignments", description: "Assignments on a story (FK reverse)", roles: [AssignmentEditor, ManagingEditor, NewsDirector], code: 200, input: ["limit?", "offset?", "status?"], output: "Assignment[]", side_effects: [] }
  - { method: GET, path: "/newsroom/stories/{id}/reviews", description: "Review records of a story (FK reverse)", roles: [CopyEditor, FactChecker, LegalReviewer, AssignmentEditor, ManagingEditor, NewsDirector], code: 200, input: ["limit?", "offset?", "review_type?"], output: "ReviewRecord[]", side_effects: [] }
  - { method: GET, path: "/newsroom/stories/{id}/corrections", description: "Corrections of a story (FK reverse)", roles: [Reporter, Photographer, CopyEditor, FactChecker, LegalReviewer, AssignmentEditor, ManagingEditor, NewsDirector, AnalyticsProducer], code: 200, input: ["limit?", "offset?", "status?"], output: "Correction[]", side_effects: [] }
  - { method: GET, path: "/newsroom/stories/{id}/analytics-reports", description: "Analytics reports of a story (FK reverse)", roles: [AnalyticsProducer, AssignmentEditor, ManagingEditor, NewsDirector], code: 200, input: ["limit?", "offset?", "variant?"], output: "AnalyticsReport[]", side_effects: [] }
  - { method: POST, path: "/newsroom/stories/{id}/corrections", description: "Propose a correction on a PUBLISHED story", roles: [Reporter, Photographer, CopyEditor, FactChecker, LegalReviewer, AssignmentEditor, ManagingEditor], code: 201, input: [severity, correction_text], output: Correction, side_effects: ["correction PROPOSED with proposer_staff_id = X-User-ID"] }
  - { method: POST, path: "/newsroom/stories/{id}/analytics-reports", description: "Ingest an analytics measurement and compute performance_score", roles: [AnalyticsProducer], code: 201, input: [variant, window_start, window_end, views, engagement_minutes], output: AnalyticsReport, side_effects: ["runs performance_score", "uniqueness per (story_id, variant, window_end)"] }

  # --- Assignments ---
  - { method: POST, path: "/newsroom/assignments", description: "Propose a reporter/photographer assignment", roles: [AssignmentEditor], code: 201, input: [story_id, staff_id, assignment_role, start_at, end_at, planned_effort_minutes], output: Assignment, side_effects: ["provisional_cost_cents computed", "staff.active_assignment_count recomputed"] }
  - { method: POST, path: "/newsroom/assignments/{id}/accept", description: "PROPOSED -> ACCEPTED; field staff self-service with cap + overlap re-check; may auto-resume an ON_HOLD story", roles: [Reporter, Photographer], code: 200, input: [], output: Assignment, side_effects: ["possible story ON_HOLD -> DRAFT bubble-up"] }
  - { method: POST, path: "/newsroom/assignments/{id}/decline", description: "PROPOSED -> DECLINED", roles: [Reporter, Photographer], code: 200, input: [], output: Assignment, side_effects: ["staff.active_assignment_count recomputed"] }
  - { method: POST, path: "/newsroom/assignments/{id}/complete", description: "ACCEPTED -> COMPLETED with actual minutes; runs FINAL cost and weekly overtime re-allocation", roles: [Reporter, Photographer, AssignmentEditor], code: 200, input: [actual_effort_minutes], output: Assignment, side_effects: ["completed_at = logical now", "final_cost_cents computed; week re-allocation", "staff.active_assignment_count recomputed"] }
  - { method: POST, path: "/newsroom/assignments/{id}/cancel", description: "PROPOSED|ACCEPTED -> CANCELLED by the desk", roles: [AssignmentEditor], code: 200, input: [], output: Assignment, side_effects: ["staff.active_assignment_count recomputed"] }

  # --- Publication slots ---
  - { method: POST, path: "/newsroom/slots", description: "Open a publication slot; same-channel windows must keep a 30-minute gap (inclusive boundary conflicts)", roles: [AssignmentEditor, ManagingEditor], code: 201, input: [channel, window_start, window_end, capacity], output: PublicationSlot, side_effects: ["reserved_count = 0, status = ACTIVE"] }
  - { method: GET, path: "/newsroom/slots", description: "List slots", roles: [Reporter, Photographer, CopyEditor, FactChecker, LegalReviewer, AssignmentEditor, ManagingEditor, NewsDirector, AnalyticsProducer], code: 200, input: ["limit?", "offset?", "channel?", "status?"], output: "PublicationSlot[]", side_effects: [] }
  - { method: GET, path: "/newsroom/slots/{id}", description: "Read one slot", roles: [Reporter, Photographer, CopyEditor, FactChecker, LegalReviewer, AssignmentEditor, ManagingEditor, NewsDirector, AnalyticsProducer], code: 200, input: [], output: PublicationSlot, side_effects: [] }
  - { method: GET, path: "/newsroom/slots/{id}/stories", description: "Stories scheduled in a slot (FK reverse)", roles: [AssignmentEditor, ManagingEditor, NewsDirector], code: 200, input: ["limit?", "offset?"], output: "Story[]", side_effects: [] }
  - { method: POST, path: "/newsroom/slots/{id}/cancel", description: "ACTIVE -> CANCELLED; requires zero reservations", roles: [ManagingEditor], code: 200, input: [], output: PublicationSlot, side_effects: ["slot.version += 1"] }

  # --- Corrections governance ---
  - { method: POST, path: "/newsroom/corrections/{id}/approve", description: "PROPOSED -> APPROVED; approver must differ from proposer (SoD)", roles: [ManagingEditor], code: 200, input: [], output: Correction, side_effects: ["approver_staff_id set; correction.version += 1"] }
  - { method: POST, path: "/newsroom/corrections/{id}/reject", description: "PROPOSED -> REJECTED", roles: [ManagingEditor], code: 200, input: [], output: Correction, side_effects: ["correction.version += 1"] }
  - { method: POST, path: "/newsroom/corrections/{id}/issue", description: "APPROVED -> ISSUED; assigns correction_number; RETRACTION severity cascades story -> RETRACTED and analytics -> VOID", roles: [ManagingEditor], code: 200, input: [], output: Correction, side_effects: ["correction_number assigned; issued_at set", "story.correction_count += 1", "RETRACTION cascade per §1.2"] }

  # --- Breaking news ---
  - { method: POST, path: "/newsroom/breaking-events", description: "Declare a breaking-news event", roles: [NewsDirector], code: 201, input: [title, priority_band, window_start, window_end, "call_in_pool_size?"], output: BreakingNewsEvent, side_effects: ["status = DECLARED; declared_by = X-User-ID"] }
  - { method: GET, path: "/newsroom/breaking-events", description: "List breaking events", roles: [NewsDirector, AssignmentEditor, ManagingEditor], code: 200, input: ["limit?", "offset?", "status?"], output: "BreakingNewsEvent[]", side_effects: [] }
  - { method: GET, path: "/newsroom/breaking-events/{id}", description: "Read one event", roles: [NewsDirector, AssignmentEditor, ManagingEditor], code: 200, input: [], output: BreakingNewsEvent, side_effects: [] }
  - { method: POST, path: "/newsroom/breaking-events/{id}/activate", description: "DECLARED -> ACTIVE; bumps intersecting low-priority assignments, cascades story holds and slot releases, pages the call-in pool", roles: [NewsDirector], code: 200, input: [], output: BreakingNewsEvent, side_effects: ["3-hop bump cascade per §1.2", "call-in selector creates StaffCallIn PAGED records", "event.version += 1"] }
  - { method: POST, path: "/newsroom/breaking-events/{id}/resolve", description: "ACTIVE -> RESOLVED; outstanding PAGED call-ins expire", roles: [NewsDirector], code: 200, input: [], output: BreakingNewsEvent, side_effects: ["PAGED call-ins -> EXPIRED", "resolved_at set; event.version += 1"] }
  - { method: GET, path: "/newsroom/breaking-events/{id}/call-ins", description: "Call-ins paged for an event (FK reverse)", roles: [NewsDirector], code: 200, input: ["limit?", "offset?"], output: "StaffCallIn[]", side_effects: [] }
  - { method: GET, path: "/newsroom/breaking-events/{id}/assignments", description: "Assignments bumped by an event (FK reverse)", roles: [NewsDirector], code: 200, input: ["limit?", "offset?"], output: "Assignment[]", side_effects: [] }
  - { method: POST, path: "/newsroom/call-ins/{id}/confirm", description: "PAGED -> CONFIRMED by the paged staff member before expiry", roles: [Reporter, Photographer], code: 200, input: [], output: StaffCallIn, side_effects: ["call_in.version += 1"] }
  - { method: POST, path: "/newsroom/call-ins/{id}/decline", description: "PAGED -> DECLINED by the paged staff member before expiry", roles: [Reporter, Photographer], code: 200, input: [], output: StaffCallIn, side_effects: ["call_in.version += 1"] }

  # --- Operations ---
  - { method: POST, path: "/newsroom/ops/run-publication-scheduler", description: "Ops-run checkpoint: publishes every SCHEDULED story whose slot window has opened and whose embargo is satisfied; expires every PAGED call-in past expires_at", roles: [NewsDirector], code: 200, input: [], output: "{ published_story_ids: string[], expired_call_in_ids: string[] }", side_effects: ["stories -> PUBLISHED with published_at = now", "call-ins -> EXPIRED"] }
  - { method: POST, path: "/_clock/set_current_utc", description: "Test-driving logical clock. Startup default (before any set) is exactly 2026-08-01T00:00:00Z and MUST NOT fall back to wall-clock time.", roles: [NewsDirector], code: 200, input: [to_iso8601], output: "{ current_utc: string }", side_effects: ["logical clock advanced"] }

# =============================================================================
# Table 6: Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/invalid X-User-Role or X-User-ID, or the role/user does not resolve to a StaffMember for entity_backed roles" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not permitted on the endpoint, or ownership check failed (withdraw/PATCH/submit-edit by non-author, accept/decline/complete by non-assignee, confirm/decline by non-paged staff)" }
  - { id: ERR_VALIDATION, http: 400, condition: "Missing required field, wrong type, or enum value outside the declared domain" }
  - { id: ERR_STAFF_NOT_FOUND, http: 404, condition: "staffId path param or staff_id body FK does not resolve" }
  - { id: ERR_PITCH_NOT_FOUND, http: 404, condition: "pitchId path param does not resolve" }
  - { id: ERR_STORY_NOT_FOUND, http: 404, condition: "storyId path param, or story_id / superseding_story_id body FK, does not resolve" }
  - { id: ERR_ASSIGNMENT_NOT_FOUND, http: 404, condition: "assignmentId path param does not resolve" }
  - { id: ERR_SLOT_NOT_FOUND, http: 404, condition: "slotId path param or slot_id body FK does not resolve" }
  - { id: ERR_CORRECTION_NOT_FOUND, http: 404, condition: "correctionId path param does not resolve" }
  - { id: ERR_EVENT_NOT_FOUND, http: 404, condition: "eventId path param does not resolve" }
  - { id: ERR_CALL_IN_NOT_FOUND, http: 404, condition: "callInId path param does not resolve" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource not in a from-state of the invoked transition (incl. terminal lockdown, review/stage mismatch, activate non-DECLARED event, resolve non-ACTIVE event, confirm non-PAGED call-in)" }
  - { id: ERR_STORY_NOT_PUBLISHED, http: 409, condition: "Correction creation/issue or analytics ingestion attempted on a story that is not PUBLISHED" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 422, condition: "Same staff member attempting a step their authorship/proposal forbids: author completing own edit, author reviewing own story, proposer approving own correction" }
  - { id: ERR_NO_REPORTING_ASSIGNMENT, http: 422, condition: "submit-edit with zero ASSIGNMENT rows on the story having assignment_role = REPORTER and status IN {ACCEPTED, COMPLETED}" }
  - { id: ERR_STAFF_INACTIVE, http: 422, condition: "Assignment propose/accept for a staff member whose employment_status != ACTIVE" }
  - { id: ERR_CAPABILITY_MISMATCH, http: 422, condition: "assignment_role differs from the staff member's role_capability" }
  - { id: ERR_CHANNEL_MISMATCH, http: 422, condition: "schedule: story.story_type != slot.channel" }
  - { id: ERR_INVALID_INTERVAL, http: 422, condition: "end_at <= start_at, or window_end <= window_start (assignments, slots, events, analytics windows)" }
  - { id: ERR_EMBARGO_BEYOND_SLOT, http: 422, condition: "schedule: story.embargo_until is set and later than slot.window_end" }
  - { id: ERR_CALL_IN_EXPIRED, http: 409, condition: "confirm/decline of a PAGED call-in at or past expires_at (the call-in auto-transitions to EXPIRED)" }
  - { id: ERR_STAFF_TIME_CONFLICT, http: 409, condition: "Half-open overlap on a staff member: new assignment [start_at, end_at) intersects another PROPOSED/ACCEPTED assignment; touching endpoints do NOT conflict" }
  - { id: ERR_SLOT_WINDOW_CONFLICT, http: 409, condition: "Same-channel ACTIVE slots must keep a 30-minute gap; a gap of exactly 30 minutes (inclusive boundary) still conflicts" }
  - { id: ERR_DUPLICATE_ANALYTICS_WINDOW, http: 409, condition: "An analytics report already exists for (story_id, variant, window_end)" }
  - { id: ERR_SLOT_NOT_EMPTY, http: 409, condition: "Slot cancel attempted while reserved_count > 0" }
  - { id: ERR_PITCH_REWORK_LIMIT, http: 422, condition: "Pitch return attempted when rework_round >= 3" }
  - { id: ERR_ASSIGNMENT_CAP_REACHED, http: 422, condition: "accept when count(ACCEPTED assignments of the staff member) >= max_concurrent_assignments (rejection exactly at == max)" }
  - { id: ERR_SLOT_CAPACITY_EXCEEDED, http: 422, condition: "schedule when slot.reserved_count >= slot.capacity (full exactly at == capacity)" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_story_version does not equal the story's current version (schedule or review submission against a stale view)" }

# =============================================================================
# Table 7: RBAC Permission Matrix
# =============================================================================
roles:
  - name: Reporter
    description: "Staff reporter; pitches stories, owns authored stories' edits, works reporter assignments, answers call-ins"
    identity: "entity_backed:StaffMember"
    exclusive_operations: []
    shared_operations: ["POST /newsroom/pitches", "POST /newsroom/pitches/{id}/withdraw (own)", "PATCH /newsroom/stories/{id} (own)", "POST /newsroom/stories/{id}/submit-edit (own)", "POST /newsroom/assignments/{id}/accept|decline|complete (own)", "POST /newsroom/stories/{id}/corrections", "POST /newsroom/call-ins/{id}/confirm|decline (own)", "read endpoints"]
  - name: Photographer
    description: "Staff photographer; works photography assignments and answers call-ins; may pitch"
    identity: "entity_backed:StaffMember"
    exclusive_operations: []
    shared_operations: ["POST /newsroom/pitches", "POST /newsroom/assignments/{id}/accept|decline|complete (own)", "POST /newsroom/call-ins/{id}/confirm|decline (own)", "POST /newsroom/stories/{id}/corrections", "read endpoints"]
  - name: CopyEditor
    description: "Copy desk editor; moves stories IN_EDIT -> FACT_CHECK; must not edit own-authored stories (SoD)"
    identity: "entity_backed:StaffMember"
    exclusive_operations: ["POST /newsroom/stories/{id}/complete-edit"]
    shared_operations: ["POST /newsroom/pitches", "POST /newsroom/stories/{id}/corrections", "read endpoints"]
  - name: FactChecker
    description: "Files FACT_CHECK verdicts; must not review own-authored stories (SoD)"
    identity: "entity_backed:StaffMember"
    exclusive_operations: []
    shared_operations: ["POST /newsroom/stories/{id}/reviews (review_type FACT_CHECK)", "POST /newsroom/pitches", "POST /newsroom/stories/{id}/corrections", "read endpoints"]
  - name: LegalReviewer
    description: "Files LEGAL verdicts; must not review own-authored stories (SoD)"
    identity: "entity_backed:StaffMember"
    exclusive_operations: []
    shared_operations: ["POST /newsroom/stories/{id}/reviews (review_type LEGAL)", "POST /newsroom/pitches", "POST /newsroom/stories/{id}/corrections", "read endpoints"]
  - name: AssignmentEditor
    description: "Assignment desk editor; runs pitch triage, proposes/cancels assignments, schedules stories into slots, opens slots, links follow-ups"
    identity: "entity_backed:StaffMember"
    exclusive_operations: ["POST /newsroom/pitches/{id}/start-review|return|greenlight|reject", "POST /newsroom/assignments", "POST /newsroom/assignments/{id}/cancel", "POST /newsroom/stories/{id}/schedule|unschedule|supersede"]
    shared_operations: ["POST /newsroom/pitches", "POST /newsroom/slots", "POST /newsroom/assignments/{id}/complete", "POST /newsroom/stories/{id}/corrections", "read endpoints"]
  - name: ManagingEditor
    description: "Senior editor; reopens and kills stories, cancels slots, governs corrections (approve/reject/issue), reads payroll"
    identity: "entity_backed:StaffMember"
    exclusive_operations: ["POST /newsroom/stories/{id}/reopen|kill", "POST /newsroom/slots/{id}/cancel", "POST /newsroom/corrections/{id}/approve|reject|issue"]
    shared_operations: ["POST /newsroom/pitches", "POST /newsroom/slots", "GET /newsroom/staff/{id}/payroll", "POST /newsroom/stories/{id}/corrections", "read endpoints"]
  - name: NewsDirector
    description: "News director; administers staff, declares/activates/resolves breaking events, runs the publication scheduler and the logical clock. Opaque operator identity (not a StaffMember row) so the very first staff creation can be authenticated from an empty database."
    identity: "opaque"
    exclusive_operations: ["POST /newsroom/staff", "PATCH /newsroom/staff/{id}", "POST /newsroom/breaking-events", "POST /newsroom/breaking-events/{id}/activate|resolve", "POST /newsroom/ops/run-publication-scheduler", "POST /_clock/set_current_utc"]
    shared_operations: ["GET /newsroom/staff/{id}/payroll", "read endpoints"]
  - name: AnalyticsProducer
    description: "Audience analytics producer; ingests performance measurements for published stories"
    identity: "entity_backed:StaffMember"
    exclusive_operations: ["POST /newsroom/stories/{id}/analytics-reports"]
    shared_operations: ["read endpoints"]
