          trigger:
            - call: "POST /carriers/${cb11_id}/inquiries"
              payload: { subject_name: "Ned Nance", subject_dob: "1977-04-18", subject_address: "9 Neches St, Nacogdoches TX", subject_driver_license: "NED-1", permissible_purpose: "UNDERWRITING" }
              as: CarrierUnderwriter
              as_user_id: "${cb11_id}"
