          assert:
            - "len(${p_a_filled}) == 1 (P_A still has exactly one CONFIRMED Captain Assignment after the swap; that assignment's crew_member_id == ${cm_b_id})"
            - "len(${p_b_filled}) == 1 (P_B still has exactly one CONFIRMED Captain Assignment after the swap; that assignment's crew_member_id == ${cm_a_id})"
            - "Invariant: SUM over Pairing.id IN (${p_a_id}, ${p_b_id}) of count(Assignment in {SCHEDULED, CONFIRMED, ACTIVE}) is exactly 2 — same as before execute (the conserved quantity is filled-seat count per pairing)"

      - name: reserve_callup_accept_conserves_filled_captain_seats_on_pairing
        grounds:
          - state_machines.ReserveCallup.transitions.OFFERED_to_ACCEPTED
          - state_machines.Assignment.transitions.CONFIRMED_to_RECOVERED
          - entities.Pairing.fields.required_captains
        distinguishing_aspect: |
          Invariant: when a reserve accepts a callup, the count of
          non-terminal Captain Assignments on the orphaned Pairing remains
          equal to required_captains (the original assignment moves to
          RECOVERED while a new replacement Assignment is created in CONFIRMED
          — terminal-row count for that seat stays at 1 in the non-terminal
          set). Conserved quantity is count(non-terminal Captain Assignment)
          per Pairing — distinct conservation domain from the per-pairing-pair
          conservation in instance 1 (one entity vs two entities).
        test_recipe:
          setup:
            - "Single pairing P with 1 CAPTAIN seat, awarded to CM_L, then CM_L sick-calls; reserve CM_R is offered and accepts"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: SchedulingPlanner
              as_user_id: "p1"
            - call: "POST /crew-members"
              payload: { employee_code: "AB0170", full_name: "L", rank: "CAPTAIN", base_airport: "LAX", seniority_number: 170, line_type: "LINEHOLDER" }
              as: SchedulingPlanner
              as_user_id: "p1"
              captures: { cm_l_id: "$.data.id "}
            - call: "POST /crew-members"
              payload: { employee_code: "AB0171", full_name: "R", rank: "CAPTAIN", base_airport: "LAX", seniority_number: 171, line_type: "RESERVE" }
              as: SchedulingPlanner
              as_user_id: "p1"
              captures: { cm_r_id: "$.data.id "}
            - call: "POST /pairings"
              payload: { pairing_code: "P-2026-170", origin_base: "LAX", scheduled_start_utc: "2026-06-02T00:00:00Z", scheduled_end_utc: "2026-06-02T10:00:00Z", required_captains: 1, required_first_officers: 0, required_cabin_crew: 0, bidding_close_utc: "2026-06-01T12:00:00Z" }
              as: SchedulingPlanner
              as_user_id: "p1"
              captures: { p_id: "$.data.id "}
            - call: "POST /pairings/${p_id}/flight-legs"
              payload: { leg_sequence: 1, departure_airport: "LAX", arrival_airport: "JFK", scheduled_departure_utc: "2026-06-02T01:00:00Z", scheduled_arrival_utc: "2026-06-02T07:00:00Z", leg_type: "REVENUE" }
              as: SchedulingPlanner
              as_user_id: "p1"
            - call: "POST /pairings/${p_id}/open-bidding"
              payload: {}
              as: SchedulingPlanner
              as_user_id: "p1"
            - call: "POST /bids"
              payload: { pairing_id: "${p_id}", crew_member_id: "${cm_l_id}", requested_seat: "CAPTAIN" }
              as: CrewMember
              as_user_id: "${cm_l_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T12:00:01Z" }
              as: SchedulingPlanner
              as_user_id: "p1"
            - call: "GET /pairings/${p_id}"
              payload: {}
              as: SchedulingPlanner
              as_user_id: "p1"
              captures: { p_v: "$.data.version" }
            - call: "POST /pairings/${p_id}/award"
              payload: { expected_pairing_version: "${p_v}" }
              as: SchedulingPlanner
              as_user_id: "p1"
            - call: "GET /assignments"
              payload: { pairing_id: "${p_id}", crew_member_id: "${cm_l_id}" }
              as: SchedulingPlanner
              as_user_id: "p1"
              captures: { a_orig_id: "$.data[0].id "}
            - call: "POST /assignments/${a_orig_id}/confirm"
              payload: {}
              as: CrewMember
              as_user_id: "${cm_l_id}"
            - call: "POST /sick-calls"
              payload: { assignment_id: "${a_orig_id}", reason_code: "ILLNESS" }
              as: CrewMember
              as_user_id: "${cm_l_id}"
              captures: { sc_id: "$.data.id "}
            - call: "POST /sick-calls/${sc_id}/acknowledge"
              payload: {}
              as: OperationsController
              as_user_id: "ops-1"
            - call: "GET /reserve-callups"
              payload: { sick_call_id: "${sc_id}" }
              as: OperationsController
              as_user_id: "ops-1"
              captures: { rc_id: "$.data[0].id "}
          trigger:
            - call: "POST /reserve-callups/${rc_id}/accept"
              payload: {}
              as: CrewMember
              as_user_id: "${cm_r_id}"
            - call: "GET /assignments"
              payload: { pairing_id: "${p_id}", state: "CONFIRMED" }
              as: SchedulingPlanner
              as_user_id: "p1"
              captures: { non_terminal: "$.data "}
          assert:
            - "len(${non_terminal}) == 1 (exactly one CONFIRMED Captain Assignment exists for the pairing post-accept)"
            - "The single non-terminal Assignment's crew_member_id == ${cm_r_id} (the reserve)"
            - "Assignment.${a_orig_id}.state == 'RECOVERED' (compensated out of non-terminal set)"
            - "Invariant: count(non-terminal Assignment on pairing P_${p_id} with seat=='CAPTAIN') == required_captains (= 1) both before and after the accept; the compensating action conserves filled-seat count"
