          assert:
            - "err == ERR_TRANSFER_ALREADY_OPEN and http status 409"
      - name: negotiation_single_brand_returns_not_combined
        claim_type: violation_to_error
        grounds:
          - validations[priority=13]
          - errors[ERR_NOT_COMBINED]
        distinguishing_aspect: "A one-brand 'combined' negotiation contradicts the combined-negotiation rule (2..5 distinct brands) -> ERR_NOT_COMBINED."
        test_recipe:
          setup: ["Retailer R, Brand B1 ACTIVE"]
          setup_api_calls:
            - { call: "POST /portfolio/retailers", payload: { name: "R-VA9", risk_rating: "LOW" }, as: PortfolioManager, captures: { r_id: $.data.id } }
