scenario: '1986. Game Publishing QA & Platform Certification (game publisher QA department): test plan by platform & feature matrix, bug intake,
  triage severity & regression tracking, compliance (TRC/XR) checklist verification, submission package & certification failure remediation cycle,
  localization & age-rating submission, day-one patch planning & release windows, post-launch hotfix process, external QA vendor management

  '
domain_name: game-publishing-qa-cert
api_prefix: /qa-cert
complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: quota_allocation
  complexity_layers:
  - optimistic_concurrency
  - cascading_side_effects
  - dual_variant_calculation
  - scheduled_actions
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
  - one_to_many
  - self_referential
  - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate
entities:
- name: GameTitle
  parent: null
  common_fields: true
  fields:
  - name: title_code
    type: string
    source: input
    description: Unique publisher title code (e.g. 'AURORA-7')
    constraints: unique across all titles
  - name: name
    type: string
    source: input
    description: Display name
  - name: platform_codes
    type: array
    source: input
    description: 'Target platforms: non-empty subset of [PS5, XSX, SWITCH2, PC]'
  - name: target_launch_date
    type: string
    source: input
    description: Planned launch date, ISO 8601 date
  - name: cert_budget_total_cents
    type: integer
    source: input
    description: Total certification budget in cents
    constraints: '>= 0'
  - name: cert_budget_available_cents
    type: integer
    source: computed
    description: = cert_budget_total_cents - cert_budget_escrow_cents - cert_budget_spent_cents
  - name: cert_budget_escrow_cents
    type: integer
    source: computed
    description: Sum of fee_cents on own SubmissionPackages in SUBMITTED or IN_REVIEW
  - name: cert_budget_spent_cents
    type: integer
    source: computed
    description: 'Cumulative spent: decided package fees + filed rating fees + confirmed window fees + expedited hotfix fees'
  - name: open_blocker_count
    type: integer
    source: computed
    description: Count of own BugReports with severity BLOCKER in status OPEN, TRIAGED, IN_PROGRESS, or REOPENED
  - name: hotfix_rollback_count
    type: integer
    source: system
    default: 0
    description: Increments each time one of the title's hotfixes reaches ROLLED_BACK
  - name: embargoed
    type: boolean
    source: system
    default: false
    description: True while a compliance embargo is active; auto-set when hotfix_rollback_count reaches 2
  - name: embargo_reason
    type: string
    source: system
    description: Reason recorded by the last embargo action
    default: null
  - name: status
    type: enum
    source: system
    description: CONCEPT | IN_DEVELOPMENT | CERTIFICATION | CERT_APPROVED | LAUNCHED | SUNSET
- name: QaVendor
  parent: null
  common_fields: true
  fields:
  - name: name
    type: string
    source: input
    description: Vendor legal name
    constraints: unique
  - name: weekly_capacity_hours
    type: integer
    source: input
    description: Contracted tester-hours per ISO week
    constraints: 1..10000
  - name: cost_rate_cents_per_hour
    type: integer
    source: input
    description: Billing rate in cents per hour
    constraints: '>= 1'
  - name: status
    type: enum
    source: system
    description: ACTIVE | SUSPENDED | TERMINATED
  - name: committed_hours_current_week
    type: integer
    source: computed
    description: Sum of reserved_hours of assignments with this vendor, status SCHEDULED or IN_PROGRESS, whose week_start_date is the Monday of
      the logical clock's current ISO week
  - name: available_hours_current_week
    type: integer
    source: computed
    description: = weekly_capacity_hours - committed_hours_current_week
  - name: escapes_count
    type: integer
    source: computed
    description: Count of BugReports with found_by_vendor_id = this vendor, found_post_launch = true, status not in {DUPLICATE, WONT_FIX}
- name: TestPlan
  parent: null
  common_fields: true
  fields:
  - name: title_id
    type: string
    source: input
    description: FK -> GameTitle.id
  - name: platform_code
    type: enum
    source: input
    description: PS5 | XSX | SWITCH2 | PC
  - name: status
    type: enum
    source: system
    description: DRAFT | IN_REVIEW | APPROVED | LOCKED | ARCHIVED
  - name: entries
    type: array
    source: system
    description: 'Feature matrix rows: { feature_area, platform_layer, is_cert_blocker, required_coverage_hours, assigned_hours (computed), coverage_status
      (computed: UNCOVERED | PARTIAL | COVERED) }'
  - name: required_entries_total
    type: integer
    source: computed
    description: Count of entries with is_cert_blocker = true
  - name: covered_required_count
    type: integer
    source: computed
    description: Count of cert-blocker entries whose coverage_status = COVERED
- name: TestAssignment
  parent: null
  common_fields: true
  fields:
  - name: vendor_id
    type: string
    source: input
    description: FK -> QaVendor.id
  - name: plan_id
    type: string
    source: input
    description: FK -> TestPlan.id
  - name: feature_area
    type: string
    source: input
    description: Must equal the feature_area of an entry embedded in plan_id
  - name: week_start_date
    type: string
    source: input
    description: ISO 8601 date of the ISO week consumed; must be a Monday
    constraints: weekday == Monday
  - name: reserved_hours
    type: integer
    source: input
    description: Hours reserved against the vendor's weekly capacity
    constraints: 1..168
  - name: actual_hours
    type: integer
    source: system
    description: Reported hours at completion; null until DONE
    default: null
  - name: status
    type: enum
    source: system
    description: SCHEDULED | IN_PROGRESS | DONE | CANCELLED
- name: Build
  parent: null
  common_fields: true
  fields:
  - name: title_id
    type: string
    source: input
    description: FK -> GameTitle.id
  - name: platform_code
    type: enum
    source: input
    description: PS5 | XSX | SWITCH2 | PC
  - name: version_string
    type: string
    source: input
    description: Build version label; unique per (title_id, platform_code)
  - name: patch_class
    type: enum
    source: input
    default: BASE
    description: BASE | DAY_ONE_PATCH | HOTFIX
  - name: status
    type: enum
    source: system
    description: RECEIVED | IN_TEST | TEST_PASSED | TEST_FAILED | CANDIDATE | CONSUMED | RETIRED
- name: BugReport
  parent: null
  common_fields: true
  fields:
  - name: title_id
    type: string
    source: input
    description: FK -> GameTitle.id
  - name: build_id
    type: string
    source: input
    description: FK -> Build.id; build must belong to title_id
  - name: severity
    type: enum
    source: input
    description: BLOCKER | CRITICAL | MAJOR | MINOR | TRIVIAL; may be re-set at triage and at reopen
  - name: category
    type: enum
    source: input
    description: GAMEPLAY | AUDIO | GRAPHICS | NETWORK | COMPLIANCE | LOCALIZATION | PERFORMANCE
  - name: found_by_vendor_id
    type: string
    source: input
    description: FK -> QaVendor.id; null for internal finds
    default: null
  - name: regression_of_id
    type: string
    source: input
    description: FK -> BugReport.id; target must belong to same title and be RESOLVED, VERIFIED, or CLOSED at creation
    default: null
  - name: is_regression
    type: boolean
    source: computed
    description: = (regression_of_id is not null)
  - name: found_post_launch
    type: boolean
    source: input
    default: false
    description: True for bugs discovered after the title reached LAUNCHED (defect escapes)
  - name: sla_breached
    type: boolean
    source: system
    default: false
    description: Set true by an ops run when an OPEN bug's age exceeds its severity's triage SLA
  - name: reopened_count
    type: integer
    source: system
    default: 0
    description: Increments on every transition into REOPENED
  - name: status
    type: enum
    source: system
    description: OPEN | TRIAGED | IN_PROGRESS | RESOLVED | VERIFIED | CLOSED | REOPENED | WONT_FIX | DUPLICATE
- name: SubmissionPackage
  parent: null
  common_fields: true
  fields:
  - name: title_id
    type: string
    source: system
    description: FK -> GameTitle.id; taken from the create path
  - name: platform_code
    type: enum
    source: input
    description: PS5 | XSX | SWITCH2 | PC; must be in the title's platform_codes
  - name: build_id
    type: string
    source: input
    description: FK -> Build.id; must belong to the title, match platform_code, and be CANDIDATE
  - name: test_plan_id
    type: string
    source: input
    description: FK -> TestPlan.id; must match (title, platform_code) and be APPROVED or LOCKED
  - name: checklist_id
    type: string
    source: system
    description: ID of the auto-created ComplianceChecklist; fetch it via GET /qa-cert/compliance-checklists?submission_package_id=<this package
      id>
  - name: round
    type: integer
    source: system
    description: 1 + count of prior non-SUPERSEDED packages for the same (title_id, platform_code)
  - name: expedited
    type: boolean
    source: input
    default: false
    description: Expedited review requested; multiplies the submission fee
  - name: fee_cents
    type: integer
    source: computed
    description: Submission fee computed at submit time per calculation submission_fee; null until SUBMITTED
    default: null
  - name: readiness_optimistic_pct
    type: number
    source: computed
    description: Optimistic readiness over checklist items (calculation cert_readiness_index, OPTIMISTIC variant)
  - name: readiness_strict_pct
    type: number
    source: computed
    description: Strict readiness over checklist items (calculation cert_readiness_index, STRICT variant)
  - name: submitted_at
    type: datetime
    source: system
    description: Logical-clock timestamp of the SUBMITTED transition; null until then
    default: null
  - name: submitted_by_user_id
    type: string
    source: system
    description: X-User-ID of the submitter; segregation-of-duties anchor
  - name: decided_by_user_id
    type: string
    source: system
    description: X-User-ID of the PlatformReviewer who decided; must differ from submitted_by_user_id
    default: null
  - name: withdrawn_cause
    type: enum
    source: system
    default: null
    description: MANUAL | SYSTEM_BUILD_INVALIDATED; set on the WITHDRAWN transition
  - name: status
    type: enum
    source: system
    description: ASSEMBLING | SUBMITTED | IN_REVIEW | APPROVED | REJECTED | CLOSED | WITHDRAWN | SUPERSEDED
- name: ComplianceChecklist
  parent: null
  common_fields: true
  fields:
  - name: submission_package_id
    type: string
    source: system
    description: FK -> SubmissionPackage.id
  - name: platform_code
    type: enum
    source: system
    description: Copied from the owning package at creation
  - name: items
    type: array
    source: system
    description: 'Seeded per platform TRC catalog: { requirement_code, severity (REQUIRED | RECOMMENDED), auto_verifiable, status (UNVERIFIED
      | PASSED | FAILED | NA | WAIVED), waiver_status (NONE | PENDING | APPROVED | REJECTED | SUPERSEDED), waiver_justification, waiver_requested_by_user_id
      }'
  - name: total_items
    type: integer
    source: computed
    description: Count of items
  - name: passed_count
    type: integer
    source: computed
    description: Items in PASSED
  - name: waived_count
    type: integer
    source: computed
    description: Items in WAIVED
  - name: na_count
    type: integer
    source: computed
    description: Items in NA
  - name: failed_count
    type: integer
    source: computed
    description: Items in FAILED
  - name: unverified_count
    type: integer
    source: computed
    description: Items in UNVERIFIED
- name: CertFinding
  parent: null
  common_fields: true
  fields:
  - name: submission_package_id
    type: string
    source: system
    description: FK -> SubmissionPackage.id; taken from the create path
  - name: severity
    type: enum
    source: input
    description: CATEGORY_A (cert-blocking) | CATEGORY_B (advisory)
  - name: requirement_code
    type: string
    source: input
    description: TRC/XR requirement violated
  - name: description
    type: string
    source: input
    description: Free-text finding detail
  - name: status
    type: enum
    source: system
    description: OPEN | FIXED_IN_BUILD | VERIFIED
  - name: fixed_in_build_id
    type: string
    source: system
    description: FK -> Build.id; set at FIXED_IN_BUILD
    default: null
  - name: reopen_count
    type: integer
    source: system
    default: 0
    description: Increments on failed verification (FIXED_IN_BUILD -> OPEN)
- name: AgeRatingFiling
  parent: null
  common_fields: true
  fields:
  - name: title_id
    type: string
    source: input
    description: FK -> GameTitle.id
  - name: territory
    type: enum
    source: input
    description: ESRB | PEGI | CERO | USK
  - name: content_descriptors
    type: array
    source: input
    description: Non-empty list of descriptor strings
  - name: fee_cents
    type: integer
    source: computed
    description: Territory fee with bundle discount per calculation age_rating_filing_fee; null until FILED
    default: null
  - name: filed_at
    type: datetime
    source: system
    description: Logical-clock timestamp of the FILED transition
    default: null
  - name: status
    type: enum
    source: system
    description: DRAFT | FILED | GRANTED | CHALLENGED
- name: LocalizationPack
  parent: null
  common_fields: true
  fields:
  - name: title_id
    type: string
    source: input
    description: FK -> GameTitle.id
  - name: locale
    type: string
    source: input
    description: BCP-47 locale tag (e.g. 'fr-FR'); unique per title
  - name: is_required
    type: boolean
    source: input
    description: Required locales gate submission
  - name: text_asset_total
    type: integer
    source: input
    description: Total text assets
    constraints: '>= 0'
  - name: audio_asset_total
    type: integer
    source: input
    description: Total audio assets
    constraints: '>= 0'
  - name: translated_text_assets
    type: integer
    source: system
    default: 0
    description: Translated text assets; updated via translation transitions
  - name: translated_audio_assets
    type: integer
    source: system
    default: 0
    description: Translated audio assets; updated via translation transitions
  - name: text_coverage_pct
    type: number
    source: computed
    description: round_half_up(100 * translated_text_assets / text_asset_total, 2); 100.00 when text_asset_total = 0
  - name: audio_coverage_pct
    type: number
    source: computed
    description: round_half_up(100 * translated_audio_assets / audio_asset_total, 2); 100.00 when audio_asset_total = 0
  - name: translation_status
    type: enum
    source: system
    description: 'Axis 1: DRAFT | TRANSLATING | LQA | LOCKED'
  - name: signoff_status
    type: enum
    source: system
    description: 'Axis 2 (independent): UNSIGNED | SIGNED'
- name: ReleaseWindow
  parent: null
  common_fields: true
  fields:
  - name: title_id
    type: string
    source: input
    description: FK -> GameTitle.id
  - name: platform_code
    type: enum
    source: input
    description: PS5 | XSX | SWITCH2 | PC
  - name: kind
    type: enum
    source: input
    description: LAUNCH | DAY_ONE_PATCH | HOTFIX_DEPLOY
  - name: start_utc
    type: datetime
    source: input
    description: Window start (inclusive); must be strictly after the logical clock at creation
  - name: end_utc
    type: datetime
    source: input
    description: Window end (exclusive — half-open interval); must be strictly after start_utc
  - name: fee_cents
    type: integer
    source: computed
    description: Demand-surcharge fee charged at CONFIRM per calculation window_demand_fee; null until CONFIRMED
    default: null
  - name: status
    type: enum
    source: system
    description: RESERVED | CONFIRMED | CONSUMED | RELEASED | EXPIRED
- name: CertBlackoutWindow
  parent: null
  common_fields: true
  fields:
  - name: platform_code
    type: enum
    source: input
    description: PS5 | XSX | SWITCH2 | PC
  - name: start_utc
    type: datetime
    source: input
    description: Blackout start (inclusive)
  - name: end_utc
    type: datetime
    source: input
    description: Blackout end (inclusive — closed interval); must be >= start_utc
  - name: buffer_hours
    type: integer
    source: input
    description: Cooling buffer applied on BOTH sides of the closed interval
    constraints: 0..168
  - name: reason
    type: string
    source: input
    description: Why the platform cert queue is frozen
- name: Hotfix
  parent: null
  common_fields: true
  fields:
  - name: title_id
    type: string
    source: input
    description: FK -> GameTitle.id; title must be LAUNCHED
  - name: platform_code
    type: enum
    source: input
    description: PS5 | XSX | SWITCH2 | PC
  - name: build_id
    type: string
    source: input
    description: FK -> Build.id; the fixing build, must belong to the title and match platform_code
  - name: severity
    type: enum
    source: input
    description: S1 (outage-class, consumes expedited quota) | S2 (contained)
  - name: incident_summary
    type: string
    source: input
    description: Post-launch incident description
  - name: fee_cents
    type: integer
    source: computed
    description: Expedited cert fee charged at EXPEDITED_CERT; null until then
    default: null
  - name: expedited_cert_entered_at
    type: datetime
    source: system
    description: Logical-clock timestamp of entering EXPEDITED_CERT; rolling-quota anchor
    default: null
  - name: status
    type: enum
    source: system
    description: DECLARED | IN_DEV | READY_FOR_CERT | EXPEDITED_CERT | DEPLOYED | ROLLED_BACK
state_machines:
- entity: GameTitle
  initial_state: CONCEPT
  terminal_states:
  - SUNSET
  transitions:
  - from: CONCEPT
    to: IN_DEVELOPMENT
    trigger: 'POST /qa-cert/titles/{titleId}/transition {to_status: IN_DEVELOPMENT}'
    actor: ReleaseManager
    preconditions:
    - status == CONCEPT (else ERR_INVALID_STATE)
    side_effects: []
  - from: IN_DEVELOPMENT
    to: CERTIFICATION
    trigger: 'POST /qa-cert/titles/{titleId}/transition {to_status: CERTIFICATION}'
    actor: ReleaseManager
    preconditions:
    - status == IN_DEVELOPMENT (else ERR_INVALID_STATE)
    side_effects: []
  - from: CERTIFICATION
    to: CERT_APPROVED
    trigger: 'POST /qa-cert/titles/{titleId}/transition {to_status: CERT_APPROVED}'
    actor: ReleaseManager
    preconditions:
    - status == CERTIFICATION (else ERR_INVALID_STATE)
    - At least one SubmissionPackage of this title is APPROVED (ERR_NO_APPROVED_PACKAGE)
    side_effects: []
  - from: CERT_APPROVED
    to: LAUNCHED
    trigger: 'POST /qa-cert/titles/{titleId}/transition {to_status: LAUNCHED}'
    actor: ReleaseManager
    preconditions:
    - status == CERT_APPROVED (else ERR_INVALID_STATE)
    - open_blocker_count == 0 (ERR_OPEN_BLOCKERS_EXIST)
    side_effects: []
  - from: LAUNCHED
    to: SUNSET
    trigger: 'POST /qa-cert/titles/{titleId}/transition {to_status: SUNSET}'
    actor: ReleaseManager
    preconditions:
    - status == LAUNCHED (else ERR_INVALID_STATE)
    side_effects: []
  note: 'embargoed is an orthogonal flag (not a status): written only by POST /qa-cert/titles/{titleId}/embargo and by the auto-embargo at hotfix_rollback_count
    >= 2; it gates package submit and hotfix creation (business_safety, priority 5)'
- entity: TestPlan
  initial_state: DRAFT
  terminal_states:
  - ARCHIVED
  transitions:
  - from: DRAFT
    to: IN_REVIEW
    trigger: 'POST /qa-cert/test-plans/{planId}/transition {to_status: IN_REVIEW}'
    actor: QALead
    preconditions:
    - status == DRAFT (else ERR_INVALID_STATE)
    - entries has at least 1 row (ERR_NO_PLAN_ENTRIES)
    side_effects: []
  - from: IN_REVIEW
    to: APPROVED
    trigger: 'POST /qa-cert/test-plans/{planId}/transition {to_status: APPROVED}'
    actor: QALead
    preconditions:
    - status == IN_REVIEW (else ERR_INVALID_STATE)
    - Every entry with is_cert_blocker = true has coverage_status == COVERED (ERR_REQUIRED_COVERAGE_MISSING)
    side_effects: []
  - from: IN_REVIEW
    to: DRAFT
    trigger: 'POST /qa-cert/test-plans/{planId}/transition {to_status: DRAFT}'
    actor: QALead
    preconditions:
    - status == IN_REVIEW (else ERR_INVALID_STATE)
    side_effects: []
  - from: APPROVED
    to: LOCKED
    trigger: system (a SubmissionPackage referencing this plan is created)
    actor: system
    preconditions: []
    side_effects:
    - 'Plan becomes read-only: entries cannot be added and assignments referencing it cannot be created'
  - from: LOCKED
    to: APPROVED
    trigger: system (every SubmissionPackage referencing this plan reaches APPROVED, WITHDRAWN, SUPERSEDED, or CLOSED)
    actor: system
    preconditions: []
    side_effects: []
  - from: APPROVED
    to: DRAFT
    trigger: 'system (coverage loss: a TestAssignment cancellation drops a cert-blocker entry below COVERED)'
    actor: system
    preconditions: []
    side_effects:
    - Demotion is part of the vendor-termination / assignment-cancel cascade
  - from: DRAFT
    to: ARCHIVED
    trigger: 'POST /qa-cert/test-plans/{planId}/transition {to_status: ARCHIVED}'
    actor: QALead
    preconditions:
    - status == DRAFT or IN_REVIEW (else ERR_INVALID_STATE)
    side_effects: []
  - from: IN_REVIEW
    to: ARCHIVED
    trigger: 'POST /qa-cert/test-plans/{planId}/transition {to_status: ARCHIVED}'
    actor: QALead
    preconditions:
    - status == DRAFT or IN_REVIEW (else ERR_INVALID_STATE)
    side_effects: []
- entity: TestAssignment
  initial_state: SCHEDULED
  terminal_states:
  - DONE
  - CANCELLED
  transitions:
  - from: SCHEDULED
    to: IN_PROGRESS
    trigger: 'POST /qa-cert/assignments/{assignmentId}/transition {to_status: IN_PROGRESS}'
    actor: VendorManager
    preconditions:
    - status == SCHEDULED (else ERR_INVALID_STATE)
    side_effects: []
  - from: IN_PROGRESS
    to: DONE
    trigger: 'POST /qa-cert/assignments/{assignmentId}/transition {to_status: DONE, actual_hours: N}'
    actor: VendorManager
    preconditions:
    - status == IN_PROGRESS (else ERR_INVALID_STATE)
    - actual_hours present, integer >= 0 (ERR_INVALID_REQUEST)
    side_effects:
    - actual_hours recorded; the assignment stops consuming weekly capacity (DONE frees the reservation) but keeps contributing to entry coverage
  - from: SCHEDULED
    to: CANCELLED
    trigger: 'POST /qa-cert/assignments/{assignmentId}/transition {to_status: CANCELLED} or system (vendor terminated)'
    actor: VendorManager | system
    preconditions:
    - status == SCHEDULED or IN_PROGRESS (else ERR_INVALID_STATE)
    side_effects:
    - reserved_hours released from the vendor's weekly commitment
    - Parent plan entry coverage recomputed; if the plan is APPROVED and a cert-blocker entry falls below COVERED, the plan demotes APPROVED ->
      DRAFT
  - from: IN_PROGRESS
    to: CANCELLED
    trigger: 'POST /qa-cert/assignments/{assignmentId}/transition {to_status: CANCELLED} or system (vendor terminated)'
    actor: VendorManager | system
    preconditions:
    - status == SCHEDULED or IN_PROGRESS (else ERR_INVALID_STATE)
    side_effects:
    - reserved_hours released from the vendor's weekly commitment
    - Parent plan entry coverage recomputed; if the plan is APPROVED and a cert-blocker entry falls below COVERED, the plan demotes APPROVED ->
      DRAFT
- entity: Build
  initial_state: RECEIVED
  terminal_states:
  - CONSUMED
  - RETIRED
  transitions:
  - from: RECEIVED
    to: IN_TEST
    trigger: 'POST /qa-cert/builds/{buildId}/transition {to_status: IN_TEST}'
    actor: QALead
    preconditions:
    - status == RECEIVED or TEST_FAILED (else ERR_INVALID_STATE)
    side_effects: []
  - from: TEST_FAILED
    to: IN_TEST
    trigger: 'POST /qa-cert/builds/{buildId}/transition {to_status: IN_TEST} (retest loop)'
    actor: QALead
    preconditions:
    - status == RECEIVED or TEST_FAILED (else ERR_INVALID_STATE)
    side_effects: []
  - from: IN_TEST
    to: TEST_PASSED
    trigger: 'POST /qa-cert/builds/{buildId}/transition {to_status: TEST_PASSED}'
    actor: QALead
    preconditions:
    - status == IN_TEST (else ERR_INVALID_STATE)
    side_effects: []
  - from: IN_TEST
    to: TEST_FAILED
    trigger: 'POST /qa-cert/builds/{buildId}/transition {to_status: TEST_FAILED}'
    actor: QALead
    preconditions:
    - status == IN_TEST (else ERR_INVALID_STATE)
    side_effects: []
  - from: TEST_PASSED
    to: CANDIDATE
    trigger: 'POST /qa-cert/builds/{buildId}/transition {to_status: CANDIDATE}'
    actor: QALead
    preconditions:
    - status == TEST_PASSED (else ERR_INVALID_STATE)
    - No BugReport on this build with severity BLOCKER in status OPEN, TRIAGED, IN_PROGRESS, or REOPENED (ERR_OPEN_BLOCKERS_EXIST)
    side_effects: []
  - from: CANDIDATE
    to: IN_TEST
    trigger: 'system (a BLOCKER bug enters the open set against this build: created with severity BLOCKER, triaged up to BLOCKER, or reopened
      with effective severity BLOCKER); also manual retest via POST /qa-cert/builds/{buildId}/transition {to_status: IN_TEST}'
    actor: system | QALead
    preconditions:
    - status == CANDIDATE (else ERR_INVALID_STATE for the manual form)
    side_effects:
    - 'CASCADE hop 2: every SubmissionPackage referencing this build in ASSEMBLING, SUBMITTED, or IN_REVIEW -> WITHDRAWN with withdrawn_cause
      = SYSTEM_BUILD_INVALIDATED; each withdrawn SUBMITTED/IN_REVIEW package''s fee_cents moves from title escrow back to available'
    - 'CASCADE hop 3 (only for system withdrawals): every ReleaseWindow of the same (title_id, platform_code) with kind = LAUNCH in RESERVED or
      CONFIRMED -> RELEASED; a CONFIRMED window''s fee is NOT refunded'
  - from: CANDIDATE
    to: CONSUMED
    trigger: system (a SubmissionPackage referencing this build is decided APPROVED)
    actor: system
    preconditions: []
    side_effects: []
  - from: CANDIDATE
    to: RETIRED
    trigger: 'POST /qa-cert/builds/{buildId}/transition {to_status: RETIRED}'
    actor: QALead
    preconditions:
    - status == CANDIDATE (else ERR_INVALID_STATE)
    side_effects:
    - Same package/window cascade as the CANDIDATE -> IN_TEST demotion (packages -> WITHDRAWN with SYSTEM_BUILD_INVALIDATED, LAUNCH windows ->
      RELEASED)
- entity: BugReport
  initial_state: OPEN
  terminal_states:
  - CLOSED
  - WONT_FIX
  - DUPLICATE
  transitions:
  - from: OPEN
    to: TRIAGED
    trigger: POST /qa-cert/bugs/{bugId}/triage {severity, category?}
    actor: QALead
    preconditions:
    - status == OPEN (else ERR_INVALID_STATE)
    side_effects:
    - severity replaced by the triage value
    - title.open_blocker_count recomputed
    - 'If effective severity is BLOCKER and the build is CANDIDATE: blocker cascade hop 1 fires (build CANDIDATE -> IN_TEST)'
  - from: TRIAGED
    to: IN_PROGRESS
    trigger: 'POST /qa-cert/bugs/{bugId}/transition {to_status: IN_PROGRESS}'
    actor: QALead
    preconditions:
    - status == TRIAGED or REOPENED (else ERR_INVALID_STATE)
    side_effects: []
  - from: REOPENED
    to: IN_PROGRESS
    trigger: 'POST /qa-cert/bugs/{bugId}/transition {to_status: IN_PROGRESS}'
    actor: QALead
    preconditions:
    - status == TRIAGED or REOPENED (else ERR_INVALID_STATE)
    side_effects: []
  - from: IN_PROGRESS
    to: RESOLVED
    trigger: 'POST /qa-cert/bugs/{bugId}/transition {to_status: RESOLVED}'
    actor: QALead
    preconditions:
    - status == IN_PROGRESS (else ERR_INVALID_STATE)
    side_effects: []
  - from: RESOLVED
    to: VERIFIED
    trigger: 'POST /qa-cert/bugs/{bugId}/transition {to_status: VERIFIED}'
    actor: QALead
    preconditions:
    - status == RESOLVED (else ERR_INVALID_STATE)
    side_effects: []
  - from: VERIFIED
    to: CLOSED
    trigger: 'POST /qa-cert/bugs/{bugId}/transition {to_status: CLOSED}'
    actor: QALead
    preconditions:
    - status == VERIFIED (else ERR_INVALID_STATE)
    side_effects: []
  - from: RESOLVED
    to: REOPENED
    trigger: 'POST /qa-cert/bugs/{bugId}/transition {to_status: REOPENED, severity?}'
    actor: QALead
    preconditions:
    - status == RESOLVED or VERIFIED (else ERR_INVALID_STATE)
    side_effects:
    - reopened_count += 1; optional severity re-triage applied first (effective severity = payload severity if present else current)
    - title.open_blocker_count recomputed
    - 'If effective severity is BLOCKER and the build is CANDIDATE: blocker cascade hop 1 fires (build CANDIDATE -> IN_TEST, then package withdrawal,
      then LAUNCH window release)'
  - from: VERIFIED
    to: REOPENED
    trigger: 'POST /qa-cert/bugs/{bugId}/transition {to_status: REOPENED, severity?}'
    actor: QALead
    preconditions:
    - status == RESOLVED or VERIFIED (else ERR_INVALID_STATE)
    side_effects:
    - reopened_count += 1; optional severity re-triage applied first
    - title.open_blocker_count recomputed
    - 'If effective severity is BLOCKER and the build is CANDIDATE: blocker cascade hop 1 fires'
  - from: TRIAGED
    to: WONT_FIX
    trigger: 'POST /qa-cert/bugs/{bugId}/transition {to_status: WONT_FIX, resolution}'
    actor: QALead
    preconditions:
    - status == TRIAGED or IN_PROGRESS (else ERR_INVALID_STATE)
    - resolution present (ERR_INVALID_REQUEST)
    side_effects:
    - title.open_blocker_count recomputed
  - from: IN_PROGRESS
    to: WONT_FIX
    trigger: 'POST /qa-cert/bugs/{bugId}/transition {to_status: WONT_FIX, resolution}'
    actor: QALead
    preconditions:
    - status == TRIAGED or IN_PROGRESS (else ERR_INVALID_STATE)
    - resolution present (ERR_INVALID_REQUEST)
    side_effects:
    - title.open_blocker_count recomputed
  - from: TRIAGED
    to: DUPLICATE
    trigger: 'POST /qa-cert/bugs/{bugId}/transition {to_status: DUPLICATE, resolution}'
    actor: QALead
    preconditions:
    - status == TRIAGED (else ERR_INVALID_STATE)
    - resolution present (ERR_INVALID_REQUEST)
    side_effects:
    - title.open_blocker_count recomputed
- entity: SubmissionPackage
  initial_state: ASSEMBLING
  terminal_states:
  - APPROVED
  - CLOSED
  - WITHDRAWN
  - SUPERSEDED
  transitions:
  - from: ASSEMBLING
    to: SUBMITTED
    trigger: 'POST /qa-cert/submission-packages/{packageId}/transition {to_status: SUBMITTED}'
    actor: CertificationLead
    preconditions:
    - status == ASSEMBLING (ERR_PACKAGE_NOT_ASSEMBLING)
    - title.embargoed == false (ERR_TITLE_UNDER_EMBARGO)
    - Logical clock is outside every buffered blackout interval for platform_code (ERR_SUBMISSION_BLACKOUT_ACTIVE)
    - Every checklist item in PASSED, WAIVED, or NA (ERR_CHECKLIST_INCOMPLETE)
    - title.open_blocker_count == 0 (ERR_OPEN_BLOCKERS_EXIST)
    - No CertFinding with severity CATEGORY_A in status OPEN or FIXED_IN_BUILD on any REJECTED package of the same (title_id, platform_code) (ERR_OPEN_CATEGORY_A_FINDINGS)
    - An AgeRatingFiling for (title, territory = PLATFORM_TERRITORY[platform_code]) is GRANTED (ERR_AGE_RATING_NOT_GRANTED)
    - Every LocalizationPack of the title with is_required = true has translation_status LOCKED and signoff_status SIGNED (ERR_LOCALIZATION_NOT_LOCKED)
    - title.cert_budget_available_cents >= fee_cents computed at this moment (ERR_CERT_BUDGET_EXCEEDED)
    side_effects:
    - fee_cents computed per submission_fee using the logical clock's weekday
    - submitted_at = logical clock; submitted_by_user_id = X-User-ID
    - title.cert_budget_escrow_cents += fee_cents (available recomputed)
  - from: SUBMITTED
    to: IN_REVIEW
    trigger: 'POST /qa-cert/submission-packages/{packageId}/transition {to_status: IN_REVIEW}'
    actor: PlatformReviewer
    preconditions:
    - status == SUBMITTED (else ERR_INVALID_STATE)
    side_effects: []
  - from: IN_REVIEW
    to: APPROVED
    trigger: 'POST /qa-cert/submission-packages/{packageId}/transition {to_status: APPROVED}'
    actor: PlatformReviewer
    preconditions:
    - status == IN_REVIEW (else ERR_INVALID_STATE)
    - X-User-ID != submitted_by_user_id (ERR_SELF_CERT_DECISION — segregation of duties)
    side_effects:
    - decided_by_user_id = X-User-ID
    - fee_cents moves escrow -> spent on the title
    - Referenced build -> CONSUMED
    - 'If no other non-terminal package references the test plan: plan LOCKED -> APPROVED'
  - from: IN_REVIEW
    to: REJECTED
    trigger: 'POST /qa-cert/submission-packages/{packageId}/transition {to_status: REJECTED}'
    actor: PlatformReviewer
    preconditions:
    - status == IN_REVIEW (else ERR_INVALID_STATE)
    - X-User-ID != submitted_by_user_id (ERR_SELF_CERT_DECISION)
    side_effects:
    - decided_by_user_id = X-User-ID
    - fee_cents moves escrow -> spent on the title (platform holder keeps rejected-review fees)
    - Plan stays LOCKED (remediation continues on this plan); findings may be filed in IN_REVIEW or REJECTED
  - from: REJECTED
    to: CLOSED
    trigger: system (the package's last CertFinding in OPEN or FIXED_IN_BUILD reaches VERIFIED)
    actor: system
    preconditions:
    - All CertFindings of this package are VERIFIED and at least one exists
    side_effects:
    - 'If no other non-terminal package references the test plan: plan LOCKED -> APPROVED'
  - from: SUBMITTED
    to: WITHDRAWN
    trigger: 'POST /qa-cert/submission-packages/{packageId}/transition {to_status: WITHDRAWN} (MANUAL) or system (build demoted/retired — SYSTEM_BUILD_INVALIDATED)'
    actor: CertificationLead | system
    preconditions:
    - status == SUBMITTED or IN_REVIEW (else ERR_INVALID_STATE) for the manual form
    side_effects:
    - withdrawn_cause = MANUAL | SYSTEM_BUILD_INVALIDATED
    - fee_cents moves escrow -> available on the title (100% refund on withdrawal)
    - 'If no other non-terminal package references the test plan: plan LOCKED -> APPROVED'
    - 'System cause only: LAUNCH ReleaseWindows of (title, platform) in RESERVED or CONFIRMED -> RELEASED'
  - from: IN_REVIEW
    to: WITHDRAWN
    trigger: 'POST /qa-cert/submission-packages/{packageId}/transition {to_status: WITHDRAWN} or system (build demoted/retired)'
    actor: CertificationLead | system
    preconditions:
    - status == SUBMITTED or IN_REVIEW (else ERR_INVALID_STATE) for the manual form
    side_effects:
    - withdrawn_cause = MANUAL | SYSTEM_BUILD_INVALIDATED
    - fee_cents moves escrow -> available on the title
    - 'If no other non-terminal package references the test plan: plan LOCKED -> APPROVED'
    - 'System cause only: LAUNCH ReleaseWindows of (title, platform) in RESERVED or CONFIRMED -> RELEASED'
  - from: ASSEMBLING
    to: WITHDRAWN
    trigger: 'POST /qa-cert/submission-packages/{packageId}/transition {to_status: WITHDRAWN} (abandon assembly) or system (build demoted/retired)'
    actor: CertificationLead | system
    preconditions:
    - status == ASSEMBLING (else ERR_INVALID_STATE) for the manual form
    side_effects:
    - withdrawn_cause = MANUAL | SYSTEM_BUILD_INVALIDATED; no escrow existed, nothing refunded
    - 'If no other non-terminal package references the test plan: plan LOCKED -> APPROVED'
    - 'System cause only: LAUNCH ReleaseWindows of (title, platform) in RESERVED or CONFIRMED -> RELEASED'
  - from: ASSEMBLING
    to: SUPERSEDED
    trigger: system (a new SubmissionPackage is created for the same (title_id, platform_code) while this one is ASSEMBLING)
    actor: system
    preconditions: []
    side_effects:
    - 'If no other non-terminal package references the test plan: plan LOCKED -> APPROVED'
  note: 'The remediation cycle spans instances: a REJECTED package''s CATEGORY_A findings gate the next round''s submit; each new package for
    the same (title, platform) increments round, and round drives the resubmission fee tier.'
- entity: ComplianceChecklist
  initial_state: UNVERIFIED
  terminal_states:
  - PASSED
  - WAIVED
  - NA
  note: Per-item embedded machine (items[] inside the checklist). The checklist itself has no status field.
  transitions:
  - from: UNVERIFIED
    to: PASSED
    trigger: 'POST /qa-cert/compliance-checklists/{checklistId}/items/verify {requirement_code, result: PASSED}'
    actor: ComplianceManager
    preconditions:
    - Owning package is ASSEMBLING (ERR_CHECKLIST_NOT_EDITABLE)
    - Item status is UNVERIFIED or FAILED (ERR_INVALID_STATE otherwise)
    - result NA is rejected for REQUIRED items (ERR_NA_NOT_ALLOWED_FOR_REQUIRED)
    side_effects:
    - Checklist counters and owning package readiness fields recomputed; checklist.version increments
  - from: UNVERIFIED
    to: FAILED
    trigger: 'POST .../items/verify {result: FAILED}'
    actor: ComplianceManager
    preconditions:
    - Owning package ASSEMBLING (ERR_CHECKLIST_NOT_EDITABLE)
    side_effects:
    - Counters and readiness recomputed; checklist.version increments
  - from: UNVERIFIED
    to: NA
    trigger: 'POST .../items/verify {result: NA} — RECOMMENDED items only'
    actor: ComplianceManager
    preconditions:
    - Owning package ASSEMBLING
    - Item severity RECOMMENDED (ERR_NA_NOT_ALLOWED_FOR_REQUIRED)
    side_effects:
    - Counters and readiness recomputed; checklist.version increments
  - from: FAILED
    to: PASSED
    trigger: 'POST .../items/verify {result: PASSED} (re-verification loop)'
    actor: ComplianceManager
    preconditions:
    - Owning package ASSEMBLING (ERR_CHECKLIST_NOT_EDITABLE)
    side_effects:
    - 'If the item had waiver_status PENDING: the pending waiver is voided to SUPERSEDED; counters recomputed; checklist.version increments'
  - from: FAILED
    to: WAIVED
    trigger: 'POST .../items/waiver-decision {decision: APPROVED} on a PENDING waiver'
    actor: ComplianceManager
    preconditions:
    - Item waiver_status == PENDING (ERR_WAIVER_NOT_PENDING)
    - X-User-ID != item.waiver_requested_by_user_id (ERR_SELF_WAIVER_DECISION — segregation of duties)
    side_effects:
    - waiver_status -> APPROVED, item status -> WAIVED; counters and readiness recomputed; checklist.version increments
  - from: FAILED
    to: FAILED
    trigger: 'POST .../items/waiver-decision {decision: REJECTED}'
    actor: ComplianceManager
    preconditions:
    - Item waiver_status == PENDING (ERR_WAIVER_NOT_PENDING)
    - X-User-ID != waiver_requested_by_user_id (ERR_SELF_WAIVER_DECISION)
    side_effects:
    - waiver_status -> REJECTED; item stays FAILED; checklist.version increments
  - from: FAILED
    to: FAILED
    trigger: POST .../items/waive (waiver request / supersede)
    actor: CertificationLead
    preconditions:
    - Owning package ASSEMBLING (ERR_CHECKLIST_NOT_EDITABLE)
    - Item status == FAILED (ERR_WAIVER_REQUIRES_FAILED_ITEM)
    - expected_checklist_version matches checklist.version (ERR_STALE_VERSION)
    side_effects:
    - Any existing PENDING waiver on this item -> SUPERSEDED (its justification replaced)
    - waiver_status -> PENDING with new justification and waiver_requested_by_user_id = X-User-ID
    - checklist.version increments (OCC write)
- entity: CertFinding
  initial_state: OPEN
  terminal_states:
  - VERIFIED
  transitions:
  - from: OPEN
    to: FIXED_IN_BUILD
    trigger: 'POST /qa-cert/cert-findings/{findingId}/transition {to_status: FIXED_IN_BUILD, build_id}'
    actor: CertificationLead
    preconditions:
    - status == OPEN (else ERR_INVALID_STATE)
    - build_id present; build belongs to the package's title (ERR_BUILD_TITLE_MISMATCH) and platform (ERR_BUILD_PLATFORM_MISMATCH)
    - build.created_at strictly after the package's rejected build's created_at (ERR_FINDING_BUILD_NOT_NEWER)
    - build.status in {TEST_PASSED, CANDIDATE} (ERR_FIX_BUILD_NOT_QUALIFIED)
    side_effects:
    - fixed_in_build_id set
  - from: FIXED_IN_BUILD
    to: VERIFIED
    trigger: 'POST /qa-cert/cert-findings/{findingId}/transition {to_status: VERIFIED, passed: true}'
    actor: PlatformReviewer
    preconditions:
    - status == FIXED_IN_BUILD (else ERR_INVALID_STATE)
    side_effects:
    - 'If this was the owning package''s last non-VERIFIED finding and at least one finding exists: package REJECTED -> CLOSED'
  - from: FIXED_IN_BUILD
    to: OPEN
    trigger: 'POST /qa-cert/cert-findings/{findingId}/transition {to_status: OPEN, passed: false} (verification failed — reopen loop)'
    actor: PlatformReviewer
    preconditions:
    - status == FIXED_IN_BUILD (else ERR_INVALID_STATE)
    side_effects:
    - reopen_count += 1; fixed_in_build_id cleared
- entity: AgeRatingFiling
  initial_state: DRAFT
  terminal_states:
  - GRANTED
  transitions:
  - from: DRAFT
    to: FILED
    trigger: 'POST /qa-cert/age-rating-filings/{filingId}/transition {to_status: FILED}'
    actor: ReleaseManager
    preconditions:
    - status == DRAFT (else ERR_INVALID_STATE)
    - title status != SUNSET (ERR_INVALID_STATE)
    - title.cert_budget_available_cents >= fee_cents computed now (ERR_CERT_BUDGET_EXCEEDED)
    side_effects:
    - fee_cents computed per age_rating_filing_fee (bundle discount over the title's other FILED/GRANTED filings at this moment)
    - fee_cents charged directly to title spent; filed_at = logical clock
  - from: FILED
    to: GRANTED
    trigger: 'POST /qa-cert/age-rating-filings/{filingId}/transition {to_status: GRANTED}'
    actor: PlatformReviewer
    preconditions:
    - status == FILED (else ERR_INVALID_STATE)
    side_effects: []
  - from: FILED
    to: CHALLENGED
    trigger: 'POST /qa-cert/age-rating-filings/{filingId}/transition {to_status: CHALLENGED}'
    actor: PlatformReviewer
    preconditions:
    - status == FILED (else ERR_INVALID_STATE)
    side_effects: []
  - from: CHALLENGED
    to: DRAFT
    trigger: 'POST /qa-cert/age-rating-filings/{filingId}/transition {to_status: DRAFT, content_descriptors} (amend cycle)'
    actor: ReleaseManager
    preconditions:
    - status == CHALLENGED (else ERR_INVALID_STATE)
    - content_descriptors present and non-empty (ERR_INVALID_REQUEST)
    side_effects:
    - content_descriptors replaced; fee_cents reset to null; re-filing charges a fresh fee with bundle discount recomputed at that time
- entity: LocalizationPack
  initial_state: 'DRAFT / UNSIGNED (two independent axes: translation_status x signoff_status)'
  terminal_states:
  - LOCKED (axis 1)
  - SIGNED (axis 2, non-terminal)
  transitions:
  - from: DRAFT
    to: TRANSLATING
    trigger: 'POST /qa-cert/localization-packs/{packId}/transition {axis: TRANSLATION, to_status: TRANSLATING, translated_text_assets?, translated_audio_assets?}'
    actor: ReleaseManager
    preconditions:
    - translation_status == DRAFT (else ERR_INVALID_STATE)
    side_effects:
    - Optional translated counts applied; coverage fields recomputed
  - from: TRANSLATING
    to: LQA
    trigger: 'POST .../transition {axis: TRANSLATION, to_status: LQA, translated_text_assets?, translated_audio_assets?}'
    actor: ReleaseManager
    preconditions:
    - translation_status == TRANSLATING (else ERR_INVALID_STATE)
    side_effects:
    - Optional translated counts applied; coverage recomputed
  - from: LQA
    to: TRANSLATING
    trigger: 'POST .../transition {axis: TRANSLATION, to_status: TRANSLATING, ...} (LQA fail-back loop)'
    actor: ReleaseManager
    preconditions:
    - translation_status == LQA (else ERR_INVALID_STATE)
    side_effects:
    - Optional translated counts applied; coverage recomputed
  - from: LQA
    to: LOCKED
    trigger: 'POST .../transition {axis: TRANSLATION, to_status: LOCKED, translated_text_assets?, translated_audio_assets?}'
    actor: ReleaseManager
    preconditions:
    - translation_status == LQA (else ERR_INVALID_STATE)
    - text_coverage_pct (after applying this call's counts) >= 98.00 AND audio_coverage_pct >= 95.00 (ERR_COVERAGE_BELOW_LOCK_THRESHOLD)
    side_effects: []
  - from: UNSIGNED
    to: SIGNED
    trigger: 'POST .../transition {axis: SIGNOFF, to_status: SIGNED}'
    actor: QALead
    preconditions:
    - signoff_status == UNSIGNED (else ERR_INVALID_STATE)
    side_effects: []
  note: The two axes evolve independently — signoff does not require LOCKED and locking does not require SIGNED; only the package submit gate
    couples them.
- entity: ReleaseWindow
  initial_state: RESERVED
  terminal_states:
  - CONSUMED
  - RELEASED
  - EXPIRED
  transitions:
  - from: RESERVED
    to: CONFIRMED
    trigger: 'POST /qa-cert/release-windows/{windowId}/transition {to_status: CONFIRMED}'
    actor: ReleaseManager
    preconditions:
    - status == RESERVED (else ERR_INVALID_STATE)
    - 'kind LAUNCH or DAY_ONE_PATCH: title.status == CERT_APPROVED (ERR_TITLE_NOT_CERT_APPROVED); kind HOTFIX_DEPLOY: title.status == LAUNCHED
      (ERR_TITLE_NOT_LAUNCHED)'
    - fee_cents per window_demand_fee fits title.cert_budget_available_cents (ERR_CERT_BUDGET_EXCEEDED)
    side_effects:
    - fee_cents computed and charged directly to title spent
  - from: CONFIRMED
    to: CONSUMED
    trigger: 'POST /qa-cert/release-windows/{windowId}/transition {to_status: CONSUMED} (requires logical clock >= start_utc) or system (hotfix
      DEPLOYED consumes its HOTFIX_DEPLOY window)'
    actor: ReleaseManager | system
    preconditions:
    - status == CONFIRMED (else ERR_INVALID_STATE)
    - 'Manual form: logical clock >= start_utc (ERR_INVALID_STATE)'
    side_effects: []
  - from: RESERVED
    to: RELEASED
    trigger: 'POST .../transition {to_status: RELEASED} or system (package auto-withdrawal releases LAUNCH windows)'
    actor: ReleaseManager | system
    preconditions:
    - status == RESERVED or CONFIRMED (else ERR_INVALID_STATE) for the manual form
    side_effects:
    - Manual release of a CONFIRMED window forfeits its fee (no refund)
  - from: CONFIRMED
    to: RELEASED
    trigger: 'POST .../transition {to_status: RELEASED} or system (package auto-withdrawal)'
    actor: ReleaseManager | system
    preconditions:
    - status == RESERVED or CONFIRMED (else ERR_INVALID_STATE) for the manual form
    side_effects:
    - Manual release of a CONFIRMED window forfeits its fee; system release on package withdrawal also forfeits
  - from: RESERVED
    to: EXPIRED
    trigger: 'system (ops run: logical clock > end_utc while still RESERVED or CONFIRMED)'
    actor: system
    preconditions: []
    side_effects:
    - CONFIRMED windows expiring forfeit their fee
  - from: CONFIRMED
    to: EXPIRED
    trigger: 'system (ops run: logical clock > end_utc)'
    actor: system
    preconditions: []
    side_effects:
    - Fee forfeited
- entity: Hotfix
  initial_state: DECLARED
  terminal_states:
  - DEPLOYED
  - ROLLED_BACK
  transitions:
  - from: DECLARED
    to: IN_DEV
    trigger: 'POST /qa-cert/hotfixes/{hotfixId}/transition {to_status: IN_DEV}'
    actor: ReleaseManager
    preconditions:
    - status == DECLARED (else ERR_INVALID_STATE)
    side_effects: []
  - from: IN_DEV
    to: READY_FOR_CERT
    trigger: 'POST /qa-cert/hotfixes/{hotfixId}/transition {to_status: READY_FOR_CERT}'
    actor: ReleaseManager
    preconditions:
    - status == IN_DEV (else ERR_INVALID_STATE)
    - build.status in {TEST_PASSED, CANDIDATE} (ERR_FIX_BUILD_NOT_QUALIFIED)
    side_effects: []
  - from: READY_FOR_CERT
    to: EXPEDITED_CERT
    trigger: 'POST /qa-cert/hotfixes/{hotfixId}/transition {to_status: EXPEDITED_CERT}'
    actor: PlatformReviewer
    preconditions:
    - status == READY_FOR_CERT (else ERR_INVALID_STATE)
    - 'severity S1: count of the title''s S1 hotfixes with expedited_cert_entered_at in (now - 30 days, now] must be < 2 (ERR_HOTFIX_QUOTA_EXCEEDED);
      S2 uncounted'
    - A CONFIRMED ReleaseWindow of kind HOTFIX_DEPLOY exists for (title_id, platform_code) with start_utc <= now < end_utc (ERR_NO_HOTFIX_WINDOW)
    - title.cert_budget_available_cents >= HOTFIX_CERT_FEE_CENTS (ERR_CERT_BUDGET_EXCEEDED)
    side_effects:
    - fee_cents = HOTFIX_CERT_FEE_CENTS charged directly to title spent
    - expedited_cert_entered_at = logical clock
  - from: EXPEDITED_CERT
    to: DEPLOYED
    trigger: 'POST /qa-cert/hotfixes/{hotfixId}/transition {to_status: DEPLOYED}'
    actor: ReleaseManager
    preconditions:
    - status == EXPEDITED_CERT (else ERR_INVALID_STATE)
    side_effects:
    - The covering CONFIRMED HOTFIX_DEPLOY window -> CONSUMED
  - from: DEPLOYED
    to: ROLLED_BACK
    trigger: 'POST /qa-cert/hotfixes/{hotfixId}/transition {to_status: ROLLED_BACK}'
    actor: ReleaseManager
    preconditions:
    - status == DEPLOYED (else ERR_INVALID_STATE)
    side_effects:
    - title.hotfix_rollback_count += 1
    - 'If hotfix_rollback_count reaches 2: title.embargoed = true, embargo_reason = AUTO_ROLLBACK_THRESHOLD (contagion gate on future submissions
      and hotfixes)'
- entity: QaVendor
  initial_state: ACTIVE
  terminal_states:
  - TERMINATED
  transitions:
  - from: ACTIVE
    to: SUSPENDED
    trigger: 'POST /qa-cert/vendors/{vendorId}/transition {to_status: SUSPENDED}'
    actor: VendorManager
    preconditions:
    - status == ACTIVE (else ERR_INVALID_STATE)
    side_effects: []
  - from: SUSPENDED
    to: ACTIVE
    trigger: 'POST /qa-cert/vendors/{vendorId}/transition {to_status: ACTIVE}'
    actor: VendorManager
    preconditions:
    - status == SUSPENDED (else ERR_INVALID_STATE)
    side_effects: []
  - from: ACTIVE
    to: TERMINATED
    trigger: 'POST /qa-cert/vendors/{vendorId}/transition {to_status: TERMINATED}'
    actor: VendorManager
    preconditions:
    - status == ACTIVE or SUSPENDED (else ERR_INVALID_STATE)
    side_effects:
    - 'CASCADE hop 1: every assignment of this vendor in SCHEDULED or IN_PROGRESS -> CANCELLED, releasing reserved_hours'
    - 'CASCADE hop 2: each cancellation recomputes its plan entry coverage; any APPROVED plan whose cert-blocker entry drops below COVERED demotes
      APPROVED -> DRAFT'
  - from: SUSPENDED
    to: TERMINATED
    trigger: 'POST /qa-cert/vendors/{vendorId}/transition {to_status: TERMINATED}'
    actor: VendorManager
    preconditions:
    - status == ACTIVE or SUSPENDED (else ERR_INVALID_STATE)
    side_effects:
    - 'CASCADE hop 1: SCHEDULED/IN_PROGRESS assignments -> CANCELLED (reserved_hours released)'
    - 'CASCADE hop 2: APPROVED plans losing required coverage demote APPROVED -> DRAFT'
concurrency_rules:
- rule_id: package-create-stale-title-version
  parent_entity: GameTitle
  write_endpoint: POST /qa-cert/titles/{titleId}/submission-packages
  occ_field: expected_title_version
  description: 'Creating a SubmissionPackage legitimately supersedes any existing

    ASSEMBLING package for the same (title, platform). A create carrying an

    expected_title_version that no longer matches GameTitle.version is

    rejected: the caller''s view of the title predates a superseding create

    (which itself advanced GameTitle.version), so its supersede decision was

    made on stale state.

    '
  error_id: ERR_STALE_VERSION
  http_status: 412
- rule_id: waiver-create-stale-checklist-version
  parent_entity: ComplianceChecklist
  write_endpoint: POST /qa-cert/compliance-checklists/{checklistId}/items/waive
  occ_field: expected_checklist_version
  description: 'Requesting a waiver for an item legitimately supersedes that item''s

    existing PENDING waiver (the old justification is discarded). A waive

    call carrying an expected_checklist_version that no longer matches the

    checklist''s version is rejected: the checklist has been mutated (item

    verifications or a superseding waiver) since the caller last read it.

    '
  error_id: ERR_STALE_VERSION
  http_status: 412
calculations:
- name: vendor_weekly_capacity_ledger
  trigger: assignment create, cancel, complete (DONE frees the reservation), vendor transition to TERMINATED, clock crossing into a new ISO week
  algorithm: aggregation
  formula: "For a (vendor, ISO week W) bucket:\n  committed = sum(reserved_hours) over TestAssignment with vendor_id = vendor,\n             \
    \ week_start_date = Monday(W), status IN {SCHEDULED, IN_PROGRESS}\n  available = vendor.weekly_capacity_hours - committed\nQaVendor.committed_hours_current_week\
    \ / available_hours_current_week expose the\nbucket for the logical clock's current ISO week.\nINVARIANT (conserved quantity: weekly capacity-hours):\
    \ committed + available\n== weekly_capacity_hours after every forward action (create) and every\ncompensating action (cancel / complete /\
    \ terminate-cascade).\n"
  input_set: TestAssignment rows of the vendor in the given week with status SCHEDULED or IN_PROGRESS; DONE and CANCELLED excluded
  precision: integer hours (no rounding)
- name: vendor_invoice_settlement
  trigger: GET /qa-cert/vendors/{vendorId}/invoice?week_start_date=<Monday>&variant=PROVISIONAL|FINAL
  algorithm: tiered_pricing
  formula: "PROVISIONAL variant (as-billed estimate):\n  Include assignments of the vendor with week_start_date = W and\n  status IN {SCHEDULED,\
    \ IN_PROGRESS, DONE}.\n  line = reserved_hours * cost_rate_cents_per_hour            (exact integer)\n  subtotal = sum(line); clawback = 0;\
    \ total = subtotal\nFINAL variant (settled):\n  Include only assignments with status DONE and week_start_date = W.\n  Per line (ROUND PER\
    \ LINE, THEN SUM — this order is pinned):\n    regular_hours = min(actual_hours, reserved_hours)\n    ot_hours      = max(0, actual_hours\
    \ - reserved_hours)\n    line = round_half_up(regular_hours * rate)\n         + round_half_up(ot_hours * rate * OT_MULTIPLIER)     # per-line\
    \ cents rounding\n  subtotal = sum(line)\n  escape_count = number of BugReports with found_by_vendor_id = vendor,\n                 found_post_launch\
    \ = true, status NOT IN {DUPLICATE, WONT_FIX},\n                 created_at <= the logical clock time at evaluation\n  clawback_pct = min(ESCAPE_CLAWBACK_CAP_PCT,\
    \ ESCAPE_CLAWBACK_PCT * escape_count)\n  clawback = round_half_up(subtotal * clawback_pct / 100)     # second rounding, after the sum\n  total\
    \ = subtotal - clawback\nThe two variants produce different totals for identical underlying data\nwhenever any DONE assignment has actual_hours\
    \ != reserved_hours or any\nescape exists.\n"
  input_set: TestAssignment by (vendor, week) filtered by status per variant; escape BugReports filtered by vendor + found_post_launch + non-{DUPLICATE,WONT_FIX}
  constants:
    OT_MULTIPLIER: 1.5
    ESCAPE_CLAWBACK_PCT: 10
    ESCAPE_CLAWBACK_CAP_PCT: 50
  precision: integer cents; round_half_up applied PER LINE, then summed, then clawback rounded once (order pinned; sum-then-round is a rejected
    alternative)
  variants:
  - name: PROVISIONAL
    when: variant=PROVISIONAL — pre-settlement estimate over reserved hours
    difference: Uses reserved_hours only, includes SCHEDULED/IN_PROGRESS, no overtime, no clawback
  - name: FINAL
    when: variant=FINAL — settlement over completed work
    difference: DONE only; actual_hours with 1.5x overtime; escape clawback after summation
- name: submission_fee
  trigger: SubmissionPackage ASSEMBLING -> SUBMITTED transition
  algorithm: tiered_pricing
  formula: 'base        = BASE_FEE_CENTS[platform_code]

    round_mult  = 1.00 if round == 1; 0.50 if round == 2; 0.25 if round >= 3

    exped_mult  = 1.75 if expedited else 1.00

    wknd_mult   = 1.20 if submitted_at (logical clock, UTC) falls on Saturday or Sunday else 1.00

    fee_pre_cap = round_half_up(base * round_mult * exped_mult * wknd_mult)

    fee_cents   = min(fee_pre_cap, FEE_CAP_CENTS[platform_code])

    >=3 inputs with non-linear interaction: round tiers x expedite x weekend x cap.

    '
  input_set: The submitting package's platform_code, round, expedited flag, and the logical clock's UTC weekday
  constants:
    BASE_FEE_CENTS:
      PS5: 120000
      XSX: 120000
      SWITCH2: 90000
      PC: 60000
    FEE_CAP_CENTS:
      PS5: 250000
      XSX: 250000
      SWITCH2: 200000
      PC: 150000
    EXPEDITED_MULT: 1.75
    WEEKEND_MULT: 1.2
    ROUND2_MULT: 0.5
    ROUND3_PLUS_MULT: 0.25
  precision: integer cents, round_half_up once after all multipliers
- name: cert_budget_ledger
  trigger: package submit / decide / withdraw, rating filing, window confirm, hotfix expedited-cert
  algorithm: aggregation
  formula: "escrow = sum(fee_cents) over the title's SubmissionPackages in {SUBMITTED, IN_REVIEW}\nspent  = sum of: decided package fees (APPROVED\
    \ or REJECTED),\n         AgeRatingFiling fees charged at FILED, ReleaseWindow fees charged at\n         CONFIRM, Hotfix fees charged at EXPEDITED_CERT\n\
    available = cert_budget_total_cents - escrow - spent\nINVARIANT (conserved quantity: budget cents): available + escrow + spent\n== cert_budget_total_cents\
    \ at all times. Withdrawal refunds escrow 100%;\ndecision converts escrow to spent 1:1 — neither leaks cents.\n"
  input_set: All fee-bearing rows of the title in the listed states
  precision: integer cents (exact)
- name: cert_readiness_index
  trigger: Checklist item verify / waive / waiver-decision, package creation; both values stored on SubmissionPackage
  algorithm: weighted_scoring
  formula: "Let items = checklist items; total = count(items).\nSTRICT (final) variant:\n  readiness_strict_pct = round_half_up(100 * count(status\
    \ IN {PASSED, WAIVED, NA}) / total, 2)\nOPTIMISTIC (provisional) variant:\n  counts UNVERIFIED items with auto_verifiable = true as if passed:\n\
    \  readiness_optimistic_pct = round_half_up(100 * count(status IN {PASSED, WAIVED, NA}\n    OR (status = UNVERIFIED AND auto_verifiable =\
    \ true)) / total, 2)\ntotal is never 0 (the TRC catalog always seeds >= 1 item per platform).\n"
  input_set: All items of the package's auto-created checklist
  precision: 2 decimal places, round_half_up
  variants:
  - name: STRICT
    when: Enforced at submit; the compliance-final reading
    difference: Only terminal pass-equivalent states count
  - name: OPTIMISTIC
    when: Planning reading during assembly
    difference: Auto-verifiable UNVERIFIED items counted as passing
- name: bug_triage_sla_breach
  trigger: POST /qa-cert/ops/run (ops-run checkpoint sweep over the logical clock)
  algorithm: threshold
  formula: "For each BugReport with status == OPEN:\n  sla_hours = SLA_HOURS[severity] (TRIVIAL: no SLA, never breaches)\n  breached iff current_logical_clock\
    \ > created_at + sla_hours   (STRICTLY greater;\n  a bug exactly at created_at + sla_hours is NOT breached)\nSet sla_breached = true on breach\
    \ (sticky; never unset by later transitions).\n"
  input_set: BugReports in OPEN status only (TRIAGED and later states are out of scope)
  constants:
    SLA_HOURS:
      BLOCKER: 24
      CRITICAL: 72
      MAJOR: 168
      MINOR: 720
  precision: timestamp comparison at second resolution
- name: window_demand_fee
  trigger: ReleaseWindow RESERVED -> CONFIRMED
  algorithm: constraint_propagation
  formula: "Circular-looking dependency, evaluation order PINNED as written:\n(1) window_hours = (end_utc - start_utc) in whole hours (inputs\
    \ are whole-hour instants)\n(2) week = ISO week (Monday 00:00:00Z .. next Monday 00:00:00Z) containing start_utc\n(3) existing_hours = sum\
    \ of window_hours over OTHER ReleaseWindows with the same\n    platform_code, status IN {RESERVED, CONFIRMED}, whose start_utc falls in week\n\
    (4) total_hours = existing_hours + window_hours        # self included — pinned\n(5) tier: total_hours < 40 -> LOW (mult 1.00);\n        40\
    \ <= total_hours < 100 -> MEDIUM (1.25);\n        total_hours >= 100 -> HIGH (1.50)\n(6) fee_cents = round_half_up(window_hours * WINDOW_RATE_CENTS_PER_HOUR\
    \ * mult)\nKeying the tier on total_hours (including this window) rather than\nexisting_hours is the pinned disambiguation.\n"
  input_set: Same-platform windows in RESERVED/CONFIRMED whose start_utc shares the ISO week, plus this window's own hours
  constants:
    WINDOW_RATE_CENTS_PER_HOUR: 5000
    TIER_MEDIUM_MIN_HOURS: 40
    TIER_HIGH_MIN_HOURS: 100
  precision: integer cents, round_half_up
- name: release_window_overlap
  trigger: ReleaseWindow creation
  algorithm: interval_merge
  formula: "Half-open interval semantics: the new window occupies [start_utc, end_utc).\nConflict exists iff another ReleaseWindow with the same\
    \ platform_code and\nstatus IN {RESERVED, CONFIRMED} satisfies:\n  existing.start_utc < new.end_utc AND new.start_utc < existing.end_utc\n\
    Adjacent windows (existing.end_utc == new.start_utc, or new.end_utc ==\nexisting.start_utc) do NOT conflict. EXPIRED/RELEASED/CONSUMED windows\
    \ never\nconflict. No buffer is applied.\n"
  input_set: ReleaseWindows with the same platform_code in RESERVED or CONFIRMED
- name: blackout_buffered_exclusion
  trigger: SubmissionPackage ASSEMBLING -> SUBMITTED
  algorithm: interval_merge
  formula: "Closed-interval-with-buffer semantics — deliberately different from\nrelease_window_overlap. A submit at logical time t is BLOCKED\
    \ iff any\nCertBlackoutWindow for the platform satisfies:\n  start_utc - buffer_hours <= t <= end_utc + buffer_hours      (BOTH ends inclusive)\n\
    A submit exactly at (end_utc + buffer_hours) is blocked; one second later\nis allowed. t is the logical clock at submit.\n"
  input_set: All CertBlackoutWindow rows for the package's platform_code
- name: hotfix_rolling_quota
  trigger: Hotfix READY_FOR_CERT -> EXPEDITED_CERT for severity S1
  algorithm: threshold
  formula: "count = number of the title's Hotfixes with severity = S1 and\n        expedited_cert_entered_at in (now - 30 days, now]      # half-open:\n\
    \        # exactly-30-days-old entries are EXCLUDED, the most recent instant included\nBlocked iff count >= 2. S2 hotfixes never count and\
    \ never get blocked.\n"
  input_set: The title's S1 Hotfixes that have entered EXPEDITED_CERT within the rolling 30-day window
  constants:
    HOTFIX_QUOTA_MAX: 2
    QUOTA_WINDOW_DAYS: 30
    HOTFIX_CERT_FEE_CENTS: 50000
- name: age_rating_filing_fee
  trigger: AgeRatingFiling DRAFT -> FILED
  algorithm: threshold
  formula: "base = TERRITORY_FEE_CENTS[territory]\nother_active = count of the title's OTHER AgeRatingFilings in {FILED, GRANTED}\ndiscount =\
    \ 0.10 if other_active >= 2 else 0.00     # bundle tier evaluated on the\n                                                   # pre-filing\
    \ count — pinned order\nfee_cents = round_half_up(base * (1 - discount))\nCharged directly to title spent at FILED.\n"
  input_set: The title's other filings in FILED or GRANTED at the instant of filing
  constants:
    TERRITORY_FEE_CENTS:
      ESRB: 40000
      PEGI: 25000
      CERO: 18000
      USK: 15000
    BUNDLE_MIN_OTHER_FILINGS: 2
    BUNDLE_DISCOUNT: 0.1
  precision: integer cents, round_half_up
- name: checklist_seeding_catalog
  trigger: SubmissionPackage creation
  algorithm: aggregation
  formula: "The package's ComplianceChecklist is seeded with the platform's fixed TRC/XR\ncatalog (requirement_code, severity, auto_verifiable),\
    \ all UNVERIFIED:\n  PS5:     [ (TRC-PS-01, REQUIRED, true), (TRC-PS-02, REQUIRED, false),\n             (TRC-PS-03, REQUIRED, false), (TRC-PS-04,\
    \ RECOMMENDED, false) ]\n  XSX:     [ (XR-XB-01, REQUIRED, true), (XR-XB-02, REQUIRED, false),\n             (XR-XB-03, RECOMMENDED, false)\
    \ ]\n  SWITCH2: [ (LOT-NS-01, REQUIRED, false), (LOT-NS-02, REQUIRED, false) ]\n  PC:      [ (ST-PC-01, REQUIRED, true), (ST-PC-02, RECOMMENDED,\
    \ false) ]\nPLATFORM_TERRITORY (age-rating gate): PS5 -> ESRB, XSX -> ESRB,\nSWITCH2 -> CERO, PC -> USK.\n"
  constants:
    PLATFORM_TERRITORY:
      PS5: ESRB
      XSX: ESRB
      SWITCH2: CERO
      PC: USK
- name: entry_coverage
  trigger: assignment create / cancel / complete, vendor termination cascade
  algorithm: aggregation
  formula: "For a plan entry (plan P, feature_area F):\n  assigned_hours = sum(reserved_hours) over TestAssignment with plan_id = P,\n       \
    \            feature_area = F, status IN {SCHEDULED, IN_PROGRESS, DONE}\n                   (CANCELLED excluded — cancelled reservations stop\
    \ counting\n                   toward coverage even though DONE keeps counting)\n  coverage_status: COVERED iff assigned_hours >= required_coverage_hours;\n\
    \                   PARTIAL iff 0 < assigned_hours < required;\n                   UNCOVERED iff assigned_hours == 0\n"
  input_set: Assignments keyed to (plan_id, feature_area) in the listed statuses
  precision: integer hours
validations:
- priority: 1
  category: auth
  check: X-User-ID and X-User-Role headers present; X-User-Role is a declared role
  error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
  http_status: 400
  applies_to: all
- priority: 2
  category: auth
  check: Role permitted for this endpoint AND for this specific action (per-transition roles on transition endpoints)
  error_id: ERR_INSUFFICIENT_PERMISSIONS
  http_status: 403
  applies_to: all
- priority: 3
  category: existence
  check: Path ids exist, validated left-to-right; body FK references exist (vendor, plan, build, regression target); (plan_id, feature_area) resolves
    to an embedded entry
  error_id: ERR_NOT_FOUND / ERR_ENTRY_NOT_FOUND
  http_status: 404
  applies_to: all resource endpoints
- priority: 3.5
  category: state
  check: 'OCC: expected_title_version == GameTitle.version (package create); expected_checklist_version == ComplianceChecklist.version (waiver)'
  error_id: ERR_STALE_VERSION
  http_status: 412
  applies_to: POST /qa-cert/titles/{titleId}/submission-packages; POST /qa-cert/compliance-checklists/{checklistId}/items/waive
  note: Checked BEFORE all business rules, immediately after existence
- priority: 4
  category: state
  check: Target entity in a legal from-state for the requested transition; package submit requires ASSEMBLING
  error_id: ERR_INVALID_STATE / ERR_PACKAGE_NOT_ASSEMBLING
  http_status: 409
  applies_to: all transition endpoints
- priority: 5
  category: business_safety
  check: 'Compliance embargo: title.embargoed == false for package submit and hotfix creation'
  error_id: ERR_TITLE_UNDER_EMBARGO
  http_status: 403
  applies_to: package SUBMITTED transition; POST /qa-cert/hotfixes
- priority: 6
  category: business_temporal
  check: Buffered blackout exclusion at submit; window start strictly in the future; S1 rolling 30-day quota; finding fix-build must be strictly
    newer than the rejected build
  error_id: ERR_SUBMISSION_BLACKOUT_ACTIVE / ERR_WINDOW_IN_PAST / ERR_HOTFIX_QUOTA_EXCEEDED / ERR_FINDING_BUILD_NOT_NEWER
  http_status: 409
  applies_to: package submit, window create, hotfix EXPEDITED_CERT, finding FIXED_IN_BUILD
  note: ERR_FINDING_BUILD_NOT_NEWER carries http 422; the others 409/400 as catalogued
- priority: 7
  category: business_referential
  check: 'Cross-entity consistency: build belongs to title and matches platform; plan matches (title, platform); regression target closed; week_start_date
    is a Monday'
  error_id: ERR_BUILD_TITLE_MISMATCH / ERR_BUILD_PLATFORM_MISMATCH / ERR_REGRESSION_TARGET_NOT_CLOSED / ERR_WEEK_START_NOT_MONDAY
  http_status: 422
  applies_to: package create/submit, hotfix create, bug create, assignment create, finding mark-fixed
- priority: 8
  category: business_constraint
  check: 'Aggregate/structural gates: checklist complete, zero open blockers, no open CATEGORY_A findings, age rating GRANTED, required locales
    LOCKED+SIGNED, plan coverage for approve, build promote gate, uniqueness (title_code, build version, active filing, locale, plan per platform,
    entry feature_area), waiver rules, window overlap, lock coverage threshold'
  error_id: ERR_CHECKLIST_INCOMPLETE / ERR_OPEN_BLOCKERS_EXIST / ERR_OPEN_CATEGORY_A_FINDINGS / ERR_AGE_RATING_NOT_GRANTED / ERR_LOCALIZATION_NOT_LOCKED
    / ERR_REQUIRED_COVERAGE_MISSING / ERR_DUPLICATE_* / ERR_WINDOW_OVERLAP / ERR_COVERAGE_BELOW_LOCK_THRESHOLD / ERR_WAIVER_REQUIRES_FAILED_ITEM
    / ERR_WAIVER_NOT_PENDING / ERR_NO_PLAN_ENTRIES / ERR_NO_APPROVED_PACKAGE / ERR_CHECKLIST_NOT_EDITABLE / ERR_FIX_BUILD_NOT_QUALIFIED / ERR_NO_HOTFIX_WINDOW
  http_status: 409
  applies_to: domain gates as catalogued
- priority: 9
  category: business_fiscal
  check: 'Money and capacity last: cert budget covers the fee; vendor weekly capacity covers the reservation'
  error_id: ERR_CERT_BUDGET_EXCEEDED / ERR_VENDOR_CAPACITY_EXCEEDED
  http_status: 402
  applies_to: package submit, rating file, window confirm, hotfix expedited; assignment create
  note: ERR_VENDOR_CAPACITY_EXCEEDED carries http 409; ERR_CERT_BUDGET_EXCEEDED carries 402
response_envelope:
  success: "{ \"meta\": { \"api_request_id\": \"req_xxx\", \"api_request_timestamp\": \"ISO8601\" },\n  \"response_type\": \"object\" | \"array\"\
    , \"data\": {} }\n"
  error: "{ \"meta\": { ... }, \"response_type\": \"error\",\n  \"data\": { \"error_id\": \"ERR_XXX\", \"message\": \"...\" } }\n"
  pagination_fields:
  - limit
  - offset
  - total_count
  - has_more
  pagination_defaults:
    limit: 10
    min: 1
    max: 100
    offset: 0
endpoints:
- method: POST
  path: /_clock/set_current_utc
  description: Set the server's logical clock. Before any call, the clock reads exactly 2026-08-01T00:00:00Z (fixed startup default; never wall-clock).
    All timestamps in rules (submitted_at, SLA age, blackout tests, quota windows, window expiry) read this clock.
  roles:
  - PlatformAdmin
  code: 200
  input:
  - to_iso8601
  output: null
  side_effects:
  - current logical time replaced; later time-dependent rules evaluate against it
- method: POST
  path: /qa-cert/ops/run
  description: 'Ops-run checkpoint: sweeps the logical clock — expires RESERVED/CONFIRMED ReleaseWindows with end_utc < now, marks OPEN bugs past
    their triage SLA as sla_breached'
  roles:
  - PlatformAdmin
  code: 200
  input: []
  output: null
  side_effects:
  - Window expiry per ReleaseWindow machine
  - SLA breach per bug_triage_sla_breach
- method: POST
  path: /qa-cert/titles
  description: Register a game title
  roles:
  - ReleaseManager
  code: 201
  input:
  - title_code
  - name
  - platform_codes
  - target_launch_date
  - cert_budget_total_cents
  output: GameTitle
  side_effects:
  - status = CONCEPT, embargoed = false, version = 1
- method: GET
  path: /qa-cert/titles/{titleId}
  description: Get a title
  roles:
  - Any
  code: 200
  input: []
  output: GameTitle
  side_effects: []
- method: GET
  path: /qa-cert/titles
  description: List titles
  roles:
  - Any
  code: 200
  input:
  - title_code?
  - status?
  output: GameTitle[]
  side_effects: []
- method: POST
  path: /qa-cert/titles/{titleId}/transition
  description: Advance title lifecycle (CONCEPT -> IN_DEVELOPMENT -> CERTIFICATION -> CERT_APPROVED -> LAUNCHED -> SUNSET)
  roles:
  - ReleaseManager
  code: 200
  input:
  - to_status
  output: GameTitle
  side_effects:
  - Gates per GameTitle machine (ERR_NO_APPROVED_PACKAGE, ERR_OPEN_BLOCKERS_EXIST)
- method: POST
  path: /qa-cert/titles/{titleId}/embargo
  description: Set or clear the compliance embargo flag
  roles:
  - ComplianceManager
  code: 200
  input:
  - embargoed
  - reason
  output: GameTitle
  side_effects:
  - embargoed/embargo_reason updated
- method: POST
  path: /qa-cert/vendors
  description: Onboard an external QA vendor
  roles:
  - VendorManager
  code: 201
  input:
  - name
  - weekly_capacity_hours
  - cost_rate_cents_per_hour
  output: QaVendor
  side_effects:
  - status = ACTIVE
- method: GET
  path: /qa-cert/vendors/{vendorId}
  description: Get a vendor (includes current-week committed/available hours)
  roles:
  - Any
  code: 200
  input: []
  output: QaVendor
  side_effects: []
- method: GET
  path: /qa-cert/vendors
  description: List vendors
  roles:
  - Any
  code: 200
  input:
  - status?
  output: QaVendor[]
  side_effects: []
- method: POST
  path: /qa-cert/vendors/{vendorId}/transition
  description: 'Vendor lifecycle: ACTIVE <-> SUSPENDED, -> TERMINATED (termination cascades to assignments and plans)'
  roles:
  - VendorManager
  code: 200
  input:
  - to_status
  output: QaVendor
  side_effects:
  - TERMINATED cascade per QaVendor machine
- method: GET
  path: /qa-cert/vendors/{vendorId}/invoice
  description: 'Computed read: weekly invoice for the vendor under the requested variant. Parameters arrive as query params; week_start_date defaults
    to the Monday of the logical clock''s current ISO week, variant defaults to FINAL'
  roles:
  - VendorManager
  code: 200
  input:
  - week_start_date?
  - variant?
  output:
    week_start_date: string
    variant: string
    line_count: integer
    subtotal_cents: integer
    clawback_cents: integer
    total_cents: integer
  side_effects: []
- method: POST
  path: /qa-cert/test-plans
  description: Create a test plan (platform x feature matrix) for a title
  roles:
  - QALead
  code: 201
  input:
  - title_id
  - platform_code
  output: TestPlan
  side_effects:
  - status = DRAFT; at most one non-ARCHIVED plan per (title, platform) (ERR_DUPLICATE_TEST_PLAN)
- method: GET
  path: /qa-cert/test-plans/{planId}
  description: Get a test plan with its embedded entries
  roles:
  - Any
  code: 200
  input: []
  output: TestPlan
  side_effects: []
- method: GET
  path: /qa-cert/test-plans
  description: List test plans
  roles:
  - Any
  code: 200
  input:
  - title_id?
  - platform_code?
  - status?
  output: TestPlan[]
  side_effects: []
- method: POST
  path: /qa-cert/test-plans/{planId}/entries
  description: Append a feature-matrix entry to a DRAFT plan
  roles:
  - QALead
  code: 201
  input:
  - feature_area
  - platform_layer
  - is_cert_blocker
  - required_coverage_hours
  output: TestPlan
  side_effects:
  - Entry appended with assigned_hours 0 / coverage UNCOVERED; plan must be DRAFT (ERR_PLAN_NOT_DRAFT); feature_area unique within plan (ERR_DUPLICATE_FEATURE_AREA)
- method: POST
  path: /qa-cert/test-plans/{planId}/transition
  description: 'Plan lifecycle: DRAFT -> IN_REVIEW -> APPROVED; IN_REVIEW -> DRAFT; DRAFT/IN_REVIEW -> ARCHIVED'
  roles:
  - QALead
  code: 200
  input:
  - to_status
  output: TestPlan
  side_effects:
  - Approval gate per TestPlan machine (ERR_REQUIRED_COVERAGE_MISSING)
- method: POST
  path: /qa-cert/assignments
  description: Reserve vendor tester-hours against a plan entry for one ISO week
  roles:
  - VendorManager
  code: 201
  input:
  - vendor_id
  - plan_id
  - feature_area
  - week_start_date
  - reserved_hours
  output: TestAssignment
  side_effects:
  - 'Gates: vendor ACTIVE (ERR_VENDOR_NOT_ACTIVE); plan not LOCKED/ARCHIVED (ERR_INVALID_STATE); entry exists (ERR_ENTRY_NOT_FOUND); Monday week
    (ERR_WEEK_START_NOT_MONDAY); weekly capacity (ERR_VENDOR_CAPACITY_EXCEEDED)'
  - status = SCHEDULED; consumes vendor weekly capacity; entry coverage recomputed
- method: GET
  path: /qa-cert/assignments/{assignmentId}
  description: Get an assignment
  roles:
  - Any
  code: 200
  input: []
  output: TestAssignment
  side_effects: []
- method: GET
  path: /qa-cert/assignments
  description: List assignments
  roles:
  - Any
  code: 200
  input:
  - vendor_id?
  - plan_id?
  - week_start_date?
  - status?
  output: TestAssignment[]
  side_effects: []
- method: POST
  path: /qa-cert/assignments/{assignmentId}/transition
  description: SCHEDULED -> IN_PROGRESS -> DONE (actual_hours); SCHEDULED/IN_PROGRESS -> CANCELLED (coverage-loss cascade)
  roles:
  - VendorManager
  code: 200
  input:
  - to_status
  - actual_hours?
  output: TestAssignment
  side_effects:
  - Per TestAssignment machine; cancellation may demote an APPROVED plan to DRAFT
- method: POST
  path: /qa-cert/builds
  description: Register a build for a title+platform
  roles:
  - QALead
  code: 201
  input:
  - title_id
  - platform_code
  - version_string
  - patch_class?
  output: Build
  side_effects:
  - status = RECEIVED; version_string unique per (title, platform) (ERR_DUPLICATE_BUILD_VERSION)
- method: GET
  path: /qa-cert/builds/{buildId}
  description: Get a build
  roles:
  - Any
  code: 200
  input: []
  output: Build
  side_effects: []
- method: GET
  path: /qa-cert/builds
  description: List builds
  roles:
  - Any
  code: 200
  input:
  - title_id?
  - platform_code?
  - status?
  output: Build[]
  side_effects: []
- method: POST
  path: /qa-cert/builds/{buildId}/transition
  description: Build lifecycle incl. retest loop and promote-to-candidate gate
  roles:
  - QALead
  code: 200
  input:
  - to_status
  output: Build
  side_effects:
  - CANDIDATE promotion blocked by open BLOCKERs on the build; CANDIDATE -> IN_TEST demote/retire cascades to packages and windows
- method: POST
  path: /qa-cert/bugs
