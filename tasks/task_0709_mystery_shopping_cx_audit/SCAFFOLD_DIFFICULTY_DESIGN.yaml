              payload: { kind: "RECEIPT", object_uri: "s3://e/r.jpg", receipt_amount_cents: 48000 }
              as: Shopper
              as_user_id: "${shopper_id}"
              captures: { rec: $.data.id }
            - call: "POST /evidence/${rec}/review"
              payload: { decision: "APPROVE" }
              as: QaValidator
            - call: "POST /assignments/${asg_id}/scorecard"
              payload: { section_scores_json: { greeting: 88 } }
              as: Shopper
              as_user_id: "${shopper_id}"
            - call: "POST /assignments/${asg_id}/submit"
              payload: {}
              as: Shopper
              as_user_id: "${shopper_id}"
