              as: ProgramDirector
              captures: { nadia_acc_id: "$.data.id" }
            - call: "POST /accreditations/${nadia_acc_id}/transition"
              payload: { action: "APPROVE" }
              as: SupervisingAttorney
              as_user_id: "${atty_b_id}"
            - call: "POST /representatives"
              payload: { full_name: "Omar Vale", rep_type: "ACCREDITED_REP", languages: ["en", "es"], max_case_load: 15, max_supervisees: 0, weekly_capacity_hours: 40 }
              as: ProgramDirector
              captures: { omar_id: "$.data.id" }
          trigger:
            - call: "POST /organization-recognitions/${rec_id}/transition"
