              as: RiskAnalyst
            - call: "POST /crr/crews"
              payload: { crew_code: "CREW-B1", member_count: 2, certification_level: "ADVANCED", max_daily_minutes: 480 }
              as: ProgramAdmin
              captures: { crew_b_id: $.data.id }
            - call: "POST /crr/households"
              payload: { zone_id: "${z_b_id}", address_line: "1 Birch Road", occupant_count: 2, sleeping_areas_count: 1, storeys: 1 }
              as: CanvassCoordinator
              captures: { hh1_id: $.data.id }
            - call: "POST /crr/households"
              payload: { zone_id: "${z_b_id}", address_line: "2 Birch Road", occupant_count: 2, sleeping_areas_count: 1, storeys: 1 }
              as: CanvassCoordinator
              captures: { hh2_id: $.data.id }
            - call: "POST /crr/routes"
              payload: { zone_id: "${z_b_id}", crew_id: "${crew_b_id}", service_date: "2026-08-03", window_start_utc: "2026-08-03T13:00:00Z", window_end_utc: "2026-08-03T21:00:00Z", planned_slots: 2 }
              as: CanvassCoordinator
              captures: { r1_id: $.data.id }
            - call: "POST /crr/routes"
              payload: { zone_id: "${z_b_id}", crew_id: "${crew_b_id}", service_date: "2026-08-03", window_start_utc: "2026-08-03T13:00:00Z", window_end_utc: "2026-08-03T21:00:00Z", planned_slots: 2 }
              as: CanvassCoordinator
              captures: { r2_id: $.data.id }
            - call: "POST /crr/routes/${r1_id}/publish"
              payload: {}
              as: CanvassCoordinator
            - call: "POST /crr/routes/${r2_id}/publish"
              payload: {}
              as: CanvassCoordinator
            - call: "POST /crr/visits"
              payload: { household_id: "${hh1_id}", route_id: "${r1_id}", scheduled_start_utc: "2026-08-03T14:00:00Z", appointment_option: "SCHEDULED_APPOINTMENT" }
              as: CanvassCoordinator
              captures: { v1_id: $.data.id }
