              payload: {}
              as: ReserveController
              captures: { p_se2_ver: $.data.version }
            - call: "POST /warranty/periods/${p_se2_id}/rollforward"
              payload: { expected_period_version: "${p_se2_ver}" }
              as: ReserveController
              captures: { rf_se2_id: $.data.id }
          assert:
            - "Before any approval, AccrualPeriod.${p_se2_id}.significant_exposure_count == 0 and requires_significant_exposure_disclosure == false"
            - "After the first trigger call, FieldAction.${fa_big_id}.specific_accrual_cents == 140000000, significant_exposure_count == 1 and requires_significant_exposure_disclosure == true"
            - "After the second trigger call, FieldAction.${fa_small_id}.specific_accrual_cents == 5500000 but significant_exposure_count is STILL 1 — 5500000 is below the 50000000 threshold"
