              as: CenterAdmin
              captures: { sA: $.data.id }
            - call: "POST /sessions/${sA}/open"
              payload: {}
              as: CenterAdmin
              captures: { sAv: $.data.version }
            - call: "POST /sessions"
              payload: { center_id: "${c1}", program_id: "${prog}", format: "AFTER_SCHOOL", week_count: 1, starts_at: "2026-05-01T17:00:00Z", ends_at: "2026-05-01T19:00:00Z", device_seats_requested: 1, assigned_instructor_count: 5 }
              as: CenterAdmin
              captures: { sB: $.data.id }
            - call: "POST /sessions/${sB}/open"
              payload: {}
              as: CenterAdmin
              captures: { sBv: $.data.version }
            - call: "POST /sessions"
              payload: { center_id: "${c1}", program_id: "${prog}", format: "AFTER_SCHOOL", week_count: 1, starts_at: "2026-05-01T18:00:00Z", ends_at: "2026-05-01T20:00:00Z", device_seats_requested: 1, assigned_instructor_count: 5 }
              as: CenterAdmin
