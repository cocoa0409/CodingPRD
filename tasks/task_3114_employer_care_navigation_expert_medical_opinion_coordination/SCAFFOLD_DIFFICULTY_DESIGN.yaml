  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: consent_revoke_cancels_requests_blocks_opinion_escalates_case
        grounds:
          - state_machines.ConsentGrant.ACTIVE_to_REVOKED
          - state_machines.RecordRequest.REQUESTED_to_CANCELLED
          - state_machines.ExpertOpinionCase.RECORDS_COLLECTION_to_RECORDS_BLOCKED
          - state_machines.NavigationCase.IN_PROGRESS_to_ESCALATED
        distinguishing_aspect: "Depth-3 chain triggered by consent revocation: ConsentGrant REVOKED -> RecordRequests CANCELLED -> ExpertOpinionCase RECORDS_BLOCKED -> origin NavigationCase ESCALATED; each link is caused by the previous mutation, not by the revoke directly."
        test_recipe:
          setup:
            - "Logical clock 2026-09-01. Member ACTIVE with RECORD_RETRIEVAL + EMO_REVIEW consents. Navigation case IN_PROGRESS assigned to nurse nn-1. EMO linked to that case, in RECORDS_COLLECTION with ONE received record and ONE still-REQUESTED record request (so attached_received_count 1 < 3 and pending request exists)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /care/employers"
              payload: { name: "Eta Partners", pepm_fee_cents: 1300, avg_in_out_cost_delta_cents: 210000, emo_benefit_enabled: true }
              as: PlatformAdmin
              captures: { emp_id: $.data.id }
