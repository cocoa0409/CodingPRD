  # validations — violation to error, satisfaction to pass, priority ordering
  - section: validations
    instances:
      - name: second_observation_on_the_same_survey_and_segment_rejected
        claim_type: violation_to_error
        grounds: ["validations.ERR_DUPLICATE_OBSERVATION", "errors.ERR_DUPLICATE_OBSERVATION"]
        distinguishing_aspect: "Uniqueness is on the (survey_id, segment_id) PAIR, not on the segment: the second reading of Maple St inside the SAME survey is 409 ERR_DUPLICATE_OBSERVATION even though it carries different measurements, while an identical second reading of Maple St on a DIFFERENT survey is accepted — so the rule cannot be implemented as a per-segment unique index."
        test_recipe:
          setup:
            - "Empty database, logical clock 2026-08-01T00:00:00Z."
            - "Maple St has one ACCEPTED observation on the OPEN 2026 survey (measured 69.1)."
            - "A second OPEN survey for 2027 also exists and has no observations."
            - "The duplicate attempt uses the 2026 survey and reports different distress (rutting 0.875 instead of 0.55)."
          setup_api_calls:
            - call: "POST /pavement/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PavementEngineer
            - call: "POST /pavement/segments"
              payload: { street_name: "Maple St", from_node: "1st Ave", to_node: "2nd Ave", geo_zone: "Z1", functional_class: "LOCAL", surface_type: "ASPHALT", length_ft: 1000.0, width_ft: 30.0, baseline_condition_index: 92.0, last_treatment_date: "2016-08-01T00:00:00Z" }
              as: PavementEngineer
              captures: { seg1: "$.data.id" }
            - call: "POST /pavement/condition-surveys"
              payload: { survey_year: 2026, collection_method: "AUTOMATED_LCMS" }
              as: PavementEngineer
              captures: { sv: "$.data.id" }
            - call: "POST /pavement/distress-observations"
              payload: { survey_id: "${sv}", segment_id: "${seg1}", alligator_cracking_sqft: 3000.0, longitudinal_cracking_lf: 500.0, rutting_depth_in: 0.55, patching_sqft: 1500.0, iri_in_per_mi: 155.0, sample_coverage_pct: 100.0 }
              as: PavementEngineer
              captures: { obs1: "$.data.id" }
            - call: "POST /pavement/distress-observations/${obs1}/qc"
              payload: { qc_decision: "ACCEPT", qc_note: "LCMS pass reviewed" }
              as: PavementEngineer
            - call: "POST /pavement/condition-surveys"
              payload: { survey_year: 2027, collection_method: "AUTOMATED_LCMS" }
              as: PavementEngineer
              captures: { sv2: "$.data.id" }
          trigger:
            - call: "POST /pavement/distress-observations"
              payload: { survey_id: "${sv}", segment_id: "${seg1}", alligator_cracking_sqft: 0.0, longitudinal_cracking_lf: 0.0, rutting_depth_in: 0.875, patching_sqft: 0.0, iri_in_per_mi: 95.0, sample_coverage_pct: 100.0 }
              as: PavementEngineer
              captures: { obs_dup: "$.data.id", e_id: "$.data.error_id" }
            - call: "GET /pavement/condition-surveys/${sv}"
              payload: {}
              as: PavementEngineer
              captures: { oc: "$.data.observation_count", aoc: "$.data.accepted_observation_count" }
            - call: "POST /pavement/distress-observations"
              payload: { survey_id: "${sv2}", segment_id: "${seg1}", alligator_cracking_sqft: 0.0, longitudinal_cracking_lf: 0.0, rutting_depth_in: 0.875, patching_sqft: 0.0, iri_in_per_mi: 95.0, sample_coverage_pct: 100.0 }
              as: PavementEngineer
              captures: { obs_ok2: "$.data.id", ok2_pci: "$.data.measured_condition_index" }
          assert:
            - "HTTP 409 on the duplicate."
            - "data.error_id == 'ERR_DUPLICATE_OBSERVATION'."
            - "The 2026 survey still reports observation_count == 1 and accepted_observation_count == 1."
            - "The SAME payload against the 2027 survey returns HTTP 201 with measured_condition_index == 75.0, proving the constraint is pair-scoped."
            - "GET /pavement/distress-observations?segment_id={seg1} then returns meta.total_count == 2 (one per survey)."

      - name: duplicate_line_for_the_same_project_and_segment_rejected
