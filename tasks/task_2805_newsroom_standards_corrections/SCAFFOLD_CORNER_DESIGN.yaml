  # =========================================================================
  - section: calculations
    instances:
      - name: severe_subject_correction_due_in_six_hours_from_seventy_two_hour_sla
        claim_type: correct_result
        grounds:
          - calculations.correction_response_due_at
          - calculations.correction_severity_score.intake_provisional
          - endpoints[POST /standards-desk/correction-requests]
        distinguishing_aspect: "IDENTIFICATION (8) + SUBJECT bonus (4) + reach tier 3 (6) gives raw 18 -> SEVERE, so the default 72-hour SLA is multiplied by 0.25 to 18 hours and then bumped by -12 to a 6-hour deadline of 2026-08-01T06:00:00Z; the provisional score is 21 after the SEVERE placement surcharge."
        test_recipe:
          setup:
            - "A newsroom created with default configuration, so correction_response_sla_hours is 72"
            - "One DRAFT story exists and the logical clock still reads 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /standards-desk/newsrooms"
              payload: { name: "Metro Ledger" }
              as: ExecutiveEditor
              as_user_id: "bootstrap-exec"
              captures: { nr: $.data.id }
            - call: "POST /standards-desk/journalists"
              payload: { newsroom_id: "${nr}", full_name: "Dana Ruiz", email: "dana@ledger.test", role_title: "EXECUTIVE_EDITOR" }
              as: ExecutiveEditor
              as_user_id: "bootstrap-exec"
              captures: { exec: $.data.id }
            - call: "POST /standards-desk/journalists"
              payload: { newsroom_id: "${nr}", full_name: "Rae Lindqvist", email: "rae@ledger.test", role_title: "REPORTER" }
              as: ExecutiveEditor
              as_user_id: "${exec}"
              captures: { rep: $.data.id }
            - call: "POST /standards-desk/stories"
              payload: { newsroom_id: "${nr}", lead_journalist_id: "${rep}", headline: "Named in error" }
              as: Reporter
              as_user_id: "${rep}"
              captures: { st: $.data.id }
          trigger:
            - call: "POST /standards-desk/correction-requests"
              payload: { story_id: "${st}", submitter_type: "SUBJECT", submitter_email: "subject@example.test", claim_text: "I am not the person described in paragraph four.", claimed_error_category: "IDENTIFICATION", reader_reported_reach: 120000, subject_named: true }
              as: PublicEditor
              as_user_id: "public-editor-1"
              captures: { cr: $.data.id }
          assert:
            - "response.status == 201"
            - "response.data.provisional_severity_score == 21"
            - "response.data.provisional_severity_band == SEVERE"
            - "response.data.response_due_at == 2026-08-01T06:00:00.000Z"
            - "response.data.breach_flag == false"
            - "response.data.status == INTAKE"

      - name: minimum_due_hours_floor_overrides_negative_subject_bump
        claim_type: constants_applied
        grounds:
          - calculations.correction_response_due_at.constants.MIN_DUE_HOURS
          - calculations.correction_response_due_at.constants.SUBMITTER_BUMP
          - entities.Newsroom.correction_response_sla_hours
        distinguishing_aspect: "With an 8-hour SLA and a MINOR band (factor 1.0) the -12 hour SUBJECT bump drives the arithmetic to -4 hours, and the MIN_DUE_HOURS floor of 4 must clamp it to 2026-08-01T04:00:00Z rather than producing a deadline in the past."
        test_recipe:
          setup:
            - "A newsroom configured with correction_response_sla_hours = 8"
            - "One DRAFT story exists and the logical clock still reads 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /standards-desk/newsrooms"
              payload: { name: "Rapid Desk", correction_response_sla_hours: 8 }
              as: ExecutiveEditor
              as_user_id: "bootstrap-exec"
              captures: { nr: $.data.id }
            - call: "POST /standards-desk/journalists"
              payload: { newsroom_id: "${nr}", full_name: "Dana Ruiz", email: "dana@rapid.test", role_title: "EXECUTIVE_EDITOR" }
              as: ExecutiveEditor
              as_user_id: "bootstrap-exec"
              captures: { exec: $.data.id }
            - call: "POST /standards-desk/journalists"
              payload: { newsroom_id: "${nr}", full_name: "Rae Lindqvist", email: "rae@rapid.test", role_title: "REPORTER" }
              as: ExecutiveEditor
              as_user_id: "${exec}"
              captures: { rep: $.data.id }
            - call: "POST /standards-desk/stories"
              payload: { newsroom_id: "${nr}", lead_journalist_id: "${rep}", headline: "Context missing from the second half" }
              as: Reporter
              as_user_id: "${rep}"
              captures: { st: $.data.id }
          trigger:
            - call: "POST /standards-desk/correction-requests"
              payload: { story_id: "${st}", submitter_type: "SUBJECT", submitter_email: "subject@example.test", claim_text: "The passage omits the context of my remark.", claimed_error_category: "CONTEXT", reader_reported_reach: 0, subject_named: true }
              as: PublicEditor
              as_user_id: "public-editor-1"
              captures: { cr: $.data.id }
          assert:
            - "response.status == 201"
            - "response.data.provisional_severity_score == 8"
