            - "Clock 2026-09-01T00:00:00Z; one registered reader with propensity MEDIUM and no entitlement, one PREMIUM article, one NEWSLETTER_OPEN event recorded today."
          setup_api_calls:
            - call: "POST /paywall/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: SubscriptionOpsAgent
            - call: "POST /paywall/readers"
              payload: { email: "blocked@mail.test", is_registered: true, propensity_band: "MEDIUM" }
              as: SubscriptionOpsAgent
              captures: { rd_bk: "$.data.id" }
            - call: "POST /paywall/articles"
              payload: { headline: "Premium Investigation", section: "politics", content_type: "INVESTIGATION", access_class: "PREMIUM" }
              as: RevenueManager
              captures: { art_bk: "$.data.id" }
            - call: "POST /paywall/readers/${rd_bk}/events"
              payload: { event_type: "NEWSLETTER_OPEN" }
              as: Reader
              as_user_id: "${rd_bk}"
              captures: { ev_bk_open: "$.data.id" }
          trigger:
            - call: "POST /paywall/access-decisions"
              payload: { reader_id: "${rd_bk}", article_id: "${art_bk}" }
              as: Reader
              as_user_id: "${rd_bk}"
              captures: { ev_bk: "$.data.id", ev_bk_decision: "$.data.decision" }
          assert:
            - "the response status is 201 with decision == BLOCKED_PAYWALL and event_type == ARTICLE_VIEW_BLOCKED"
            - "ReaderEvent.${ev_bk}.weight == 0"
            - "ReaderEvent.${ev_bk}.meter_index == null"
            - "Reader.${rd_bk}.engagement_score == 2.00"
            - "Reader.${rd_bk}.churn_risk_band == SEVERE"
            - "Reader.${rd_bk}.metered_distinct_article_count == 0"
            - "Reader.${rd_bk}.metered_article_ids == []"

      - name: rule_selection_prefers_specificity_over_operator_priority
        claim_type: Correct Result
        grounds:
          - calculations.paywall_rule_selection
        distinguishing_aspect: "Two ACTIVE matching rules: a fully generic ALLOW_FREE rule at priority 1 (specificity 0) and a content-type-specific HARD_PAYWALL rule at priority 99 (specificity 100). Specificity DESC outranks priority ASC, so the verdict must be BLOCKED_PAYWALL with applied_rule_id pointing at the specific rule."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z; one METERED INVESTIGATION article in section politics, one registered reader with propensity MEDIUM and no entitlement, and the two competing ACTIVE rules."
          setup_api_calls:
            - call: "POST /paywall/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: SubscriptionOpsAgent
            - call: "POST /paywall/paywall-rules"
              payload: { name: "Generic Free", action: "ALLOW_FREE", priority: 1, content_type_match: "ANY", section_match: "ANY", propensity_band_match: "ANY", status: "ACTIVE" }
              as: RevenueManager
              captures: { rule_generic: "$.data.id", rule_generic_spec: "$.data.specificity_score" }
            - call: "POST /paywall/paywall-rules"
              payload: { name: "Investigations Hard", action: "HARD_PAYWALL", priority: 99, content_type_match: "INVESTIGATION", section_match: "ANY", propensity_band_match: "ANY", status: "ACTIVE" }
              as: RevenueManager
              captures: { rule_specific: "$.data.id", rule_specific_spec: "$.data.specificity_score" }
            - call: "POST /paywall/articles"
              payload: { headline: "Follow The Money", section: "politics", content_type: "INVESTIGATION", access_class: "METERED" }
              as: RevenueManager
              captures: { art_sel: "$.data.id" }
            - call: "POST /paywall/readers"
              payload: { email: "selector@mail.test", is_registered: true, propensity_band: "MEDIUM" }
              as: SubscriptionOpsAgent
              captures: { rd_sel: "$.data.id" }
          trigger:
            - call: "POST /paywall/access-decisions"
              payload: { reader_id: "${rd_sel}", article_id: "${art_sel}" }
              as: Reader
              as_user_id: "${rd_sel}"
              captures: { ev_sel: "$.data.id", ev_sel_rule: "$.data.applied_rule_id" }
          assert:
            - "PaywallRule.${rule_generic}.specificity_score == 0"
            - "PaywallRule.${rule_specific}.specificity_score == 100"
            - "the response status is 201 with decision == BLOCKED_PAYWALL"
            - "ReaderEvent.${ev_sel}.applied_rule_id == ${rule_specific}"
            - "Reader.${rd_sel}.metered_distinct_article_count == 0"

      - name: effective_allowance_combines_override_band_and_floor
        claim_type: Constants Applied
        grounds:
          - calculations.paywall_access_decision.constants
        excluded_because:
          difficulty_instance: combinatorial_formula / effective_allowance_from_override_band_and_floor
          rationale: "That instance already exercises SITE_DEFAULT_METER_ALLOWANCE, meter_allowance_override, PROPENSITY_ALLOWANCE_DELTA and METER_ALLOWANCE_FLOOR together and asserts the resulting effective_allowance."

      - name: engagement_decay_and_band_thresholds_at_boundary
        claim_type: Precision
        grounds:
          - calculations.engagement_score.precision
          - calculations.churn_risk_band.precision
          - calculations.propensity_band_refresh.constants
        excluded_because:
          difficulty_instance: boundary_precision_check / engagement_window_and_propensity_thresholds_at_the_edge
          rationale: "The 30-day half-open window edge, the 10-day decay step, the sum-then-round 2dp rule and the >=/< band comparisons are all asserted there with pre-computed literals."

      - name: cycle_price_variant_divergence
        claim_type: Variant Divergence
        grounds:
          - calculations.cycle_base_price_resolution.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / cycle_price_preview_quote_diverges_from_billed_amount
          rationale: "Same subscription, both variants computed in one scenario with the delta asserted as literals."

      - name: engagement_variant_divergence
        claim_type: Variant Divergence
        grounds:
          - calculations.engagement_score.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / engagement_rolling_30d_diverges_from_cohort_normalized
          rationale: "The rolling_30d score on Reader and the cohort_normalized projection frozen on CancellationRequest are asserted side by side there."

      - name: seat_line_rounds_per_line_then_sums
        claim_type: Precision
        grounds:
          - calculations.seat_charge_assembly.precision
        excluded_because:
          difficulty_instance: combinatorial_formula / seat_charge_rounds_per_line_then_sums
          rationale: "That instance bills three partial-cycle seats and asserts the per-line ROUND_HALF_UP total, distinguishing it from the sum-then-round answer."

      - name: hold_credit_interval_geometry
        claim_type: Correct Result
        grounds:
          - calculations.hold_credit_computation
        excluded_because:
          difficulty_instance: resource_temporal_overlap / hold_closed_interval_plus_buffer_admits_and_rejects
          rationale: "The closed-interval delivery-day count and the buffered conflict geometry are both asserted there."

  - section: validations
    instances:
      - name: unregistered_reader_cannot_open_subscription_rejected
        claim_type: Violation to Error
        grounds:
          - validations[priority=44]
          - errors[ERR_READER_NOT_REGISTERED]
        distinguishing_aspect: "An anonymous device record (is_registered false, email null) passes existence, version and plan-state checks and must still be refused with 422 ERR_READER_NOT_REGISTERED - registration is a prerequisite of the subscription, not of the reader row."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z, one ACTIVE DIGITAL_ONLY plan, one unregistered reader."
          setup_api_calls:
            - call: "POST /paywall/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: SubscriptionOpsAgent
            - call: "POST /paywall/offer-plans"
              payload: { name: "Digital Reg", bundle_type: "DIGITAL_ONLY", intro_price_cents: 499, intro_cycles: 1, standard_price_cents: 1499, standard_from_cycle: 2, cycle_days: 30 }
              as: RevenueManager
              captures: { plan_rg: "$.data.id" }
            - call: "POST /paywall/offer-plans/${plan_rg}/activate"
              payload: {}
              as: RevenueManager
              captures: { plan_rg_v: "$.data.version" }
            - call: "POST /paywall/readers"
              payload: { is_registered: false }
              as: SubscriptionOpsAgent
              captures: { rd_rg: "$.data.id" }
          trigger:
            - call: "POST /paywall/subscriptions"
              payload: { reader_id: "${rd_rg}", offer_plan_id: "${plan_rg}", expected_offer_plan_version: "${plan_rg_v}" }
              as: SubscriptionOpsAgent
              captures: { err_rg: "$.data.error_id" }
          assert:
            - "the response status is 422 and error_id == ERR_READER_NOT_REGISTERED"
            - "Subscription rows == 0"
            - "OfferPlan.${plan_rg}.active_subscription_count == 0"
            - "OfferPlan.${plan_rg}.version == 2"

      - name: embargoed_article_access_decision_rejected
        claim_type: Violation to Error
        grounds:
          - validations[priority=45]
          - errors[ERR_ARTICLE_UNPUBLISHED]
        distinguishing_aspect: "An article whose published_at is 2026-09-05 yields no verdict at clock 2026-09-01: the call must fail 422 and write no ReaderEvent at all, unlike a BLOCKED_* verdict which does write one."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z, one registered reader, one article published_at 2026-09-05T00:00:00Z."
          setup_api_calls:
            - call: "POST /paywall/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: SubscriptionOpsAgent
            - call: "POST /paywall/readers"
              payload: { email: "embargo@mail.test", is_registered: true }
              as: SubscriptionOpsAgent
              captures: { rd_em: "$.data.id" }
            - call: "POST /paywall/articles"
              payload: { headline: "Embargoed Scoop", section: "politics", content_type: "NEWS", access_class: "METERED", published_at: "2026-09-05T00:00:00Z" }
              as: RevenueManager
              captures: { art_em: "$.data.id" }
          trigger:
            - call: "POST /paywall/access-decisions"
              payload: { reader_id: "${rd_em}", article_id: "${art_em}" }
              as: Reader
              as_user_id: "${rd_em}"
              captures: { err_em: "$.data.error_id" }
          assert:
            - "the response status is 422 and error_id == ERR_ARTICLE_UNPUBLISHED"
            - "ReaderEvent rows for Reader.${rd_em} == 0"
            - "Reader.${rd_em}.metered_distinct_article_count == 0"

      - name: system_only_event_type_posted_directly_rejected
        claim_type: Violation to Error
        grounds:
          - validations[priority=43]
          - errors[ERR_EVENT_TYPE_SYSTEM_ONLY]
        distinguishing_aspect: "ARTICLE_VIEW_GRANTED is inside the ReaderEvent enum and carries a positive weight, so the enum check at priority 4 passes and only the system-only rule at priority 43 can stop a client from inflating its own engagement score."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z, one registered reader with engagement_score 0.00."
          setup_api_calls:
            - call: "POST /paywall/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: SubscriptionOpsAgent
            - call: "POST /paywall/readers"
              payload: { email: "sysonly@mail.test", is_registered: true }
              as: SubscriptionOpsAgent
              captures: { rd_so: "$.data.id" }
          trigger:
            - call: "POST /paywall/readers/${rd_so}/events"
              payload: { event_type: "ARTICLE_VIEW_GRANTED" }
              as: Reader
              as_user_id: "${rd_so}"
              captures: { err_so: "$.data.error_id" }
          assert:
            - "the response status is 422 and error_id == ERR_EVENT_TYPE_SYSTEM_ONLY"
            - "error_id != ERR_INVALID_REQUEST"
            - "ReaderEvent rows for Reader.${rd_so} == 0"
            - "Reader.${rd_so}.engagement_score == 0.00"

      - name: third_intervention_in_period_rejected
        claim_type: Violation to Error
        grounds:
          - validations[priority=42]
          - errors[ERR_INTERVENTION_NOT_WARRANTED]
        distinguishing_aspect: "This exercises the count half of the conjunctive rule: the reader stays SEVERE (interventions weigh 0) so the band half passes, and the third intervention in the same meter period must be refused because intervention_count_in_period is already 2."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z, one registered reader (engagement_score 0.00, churn_risk_band SEVERE) with two INTERVENTION_EDITORIAL events already logged today."
          setup_api_calls:
            - call: "POST /paywall/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: SubscriptionOpsAgent
            - call: "POST /paywall/readers"
              payload: { email: "intervene@mail.test", is_registered: true }
              as: SubscriptionOpsAgent
              captures: { rd_iv: "$.data.id" }
            - call: "POST /paywall/readers/${rd_iv}/events"
              payload: { event_type: "INTERVENTION_EDITORIAL" }
              as: SubscriptionOpsAgent
              captures: { ev_iv1: "$.data.id" }
            - call: "POST /paywall/readers/${rd_iv}/events"
              payload: { event_type: "INTERVENTION_EDITORIAL" }
              as: SubscriptionOpsAgent
              captures: { ev_iv2: "$.data.id" }
          trigger:
            - call: "POST /paywall/readers/${rd_iv}/events"
              payload: { event_type: "INTERVENTION_PRODUCT" }
              as: SubscriptionOpsAgent
              captures: { err_iv: "$.data.error_id" }
          assert:
            - "the response status is 422 and error_id == ERR_INTERVENTION_NOT_WARRANTED"
            - "Reader.${rd_iv}.intervention_count_in_period == 2"
            - "Reader.${rd_iv}.churn_risk_band == SEVERE"
            - "Reader.${rd_iv}.engagement_score == 0.00"

      - name: save_offer_above_discount_cap_rejected
        claim_type: Violation to Error
        grounds:
          - validations[priority=39]
          - errors[ERR_SAVE_OFFER_DISCOUNT_CAP]
        distinguishing_aspect: "A single first offer at discount_pct 0.55 exceeds SAVE_OFFER_DISCOUNT_CAP_PCT 0.40 and must be refused 422 while save_offer_count stays 0 - the rejected pitch does not consume the one permitted offer."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z, ACTIVE DIGITAL_ONLY subscription (cycle-1 499 paid) with an INITIATED cancellation request."
          setup_api_calls:
            - call: "POST /paywall/_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: SubscriptionOpsAgent
            - call: "POST /paywall/offer-plans"
              payload: { name: "Digital Cap", bundle_type: "DIGITAL_ONLY", intro_price_cents: 499, intro_cycles: 1, standard_price_cents: 1499, standard_from_cycle: 2, cycle_days: 30 }
              as: RevenueManager
              captures: { plan_cp: "$.data.id" }
            - call: "POST /paywall/offer-plans/${plan_cp}/activate"
              payload: {}
              as: RevenueManager
              captures: { plan_cp_v: "$.data.version" }
            - call: "POST /paywall/readers"
              payload: { email: "cap@mail.test", is_registered: true }
              as: SubscriptionOpsAgent
              captures: { rd_cp: "$.data.id" }
            - call: "POST /paywall/subscriptions"
              payload: { reader_id: "${rd_cp}", offer_plan_id: "${plan_cp}", expected_offer_plan_version: "${plan_cp_v}" }
              as: SubscriptionOpsAgent
              captures: { sub_cp: "$.data.id" }
            - call: "GET /paywall/subscriptions/${sub_cp}/invoices"
              payload: {}
              as: SubscriptionOpsAgent
              captures: { inv_cp: "$.data[0].id" }
            - call: "POST /paywall/invoices/${inv_cp}/payment-attempts"
              payload: { outcome: "SUCCEEDED", amount_cents: 499 }
              as: SubscriptionOpsAgent
            - call: "POST /paywall/subscriptions/${sub_cp}/cancellation-requests"
              payload: { reason_code: "PRICE" }
              as: Reader
              as_user_id: "${rd_cp}"
              captures: { cr_cp: "$.data.id" }
          trigger:
            - call: "POST /paywall/cancellation-requests/${cr_cp}/save-offers"
              payload: { offer_type: "RETENTION_DISCOUNT", discount_pct: 0.55, duration_cycles: 3 }
              as: SubscriptionOpsAgent
              captures: { err_cp: "$.data.error_id" }
          assert:
            - "the response status is 422 and error_id == ERR_SAVE_OFFER_DISCOUNT_CAP"
            - "CancellationRequest.${cr_cp}.status == INITIATED"
            - "CancellationRequest.${cr_cp}.save_offer_count == 0"
            - "SaveOffer rows on CancellationRequest.${cr_cp} == 0"
            - "Subscription.${sub_cp}.retention_discount_pct == 0"

      - name: seat_activation_from_foreign_email_domain_rejected
        claim_type: Violation to Error
        grounds:
          - validations[priority=40]
          - errors[ERR_SEAT_DOMAIN_MISMATCH]
        distinguishing_aspect: "Institutional authentication is enforced at claim time, not at invite time: a reader on other.test may be invited to a campus.test group but must be refused 422 when claiming the seat, and the seat stays INVITED."
        test_recipe:
          setup:
            - "Clock 2026-09-01T00:00:00Z, ACTIVE INSTITUTIONAL_SEAT plan, group account on domain campus.test with an ACTIVE funding subscription, and an INVITED seat held for a reader whose email is outsider@other.test."
          setup_api_calls:
