            - { call: "POST /customs/classifications", payload: { client_id: "${cl}", product_sku: "PANT-01", hts_code: "6203.42.4011", country_of_origin: "CN", duty_rate_bps: 1650, declared_unit_value_cents: 5000 }, as: Analyst, as_user_id: "u_an1", captures: { cls: "$.data.id "} }
            - { call: "POST /customs/classifications/${cls}/submit", payload: {}, as: Analyst, as_user_id: "u_an1" }
            - { call: "POST /customs/classifications/${cls}/review-decision", payload: { decision: "CERTIFY" }, as: LicensedBroker, as_user_id: "u_br1" }
            - { call: "POST /customs/import-entries", payload: { client_id: "${cl}", classification_id: "${cls}", entry_number: "E100", entry_date: "2026-03-10T00:00:00Z", port_code: "2704", line_quantity: 100, entered_value_cents: 500000, duty_paid_cents: 82500 }, as: Analyst, as_user_id: "u_an1", captures: { enA: "$.data.id", en_v0: "$.data.version "} }
            - { call: "POST /customs/export-shipments", payload: { client_id: "${cl}", export_date: "2026-04-01T00:00:00Z", hts_code: "6203.42.4011", quantity: 100, fob_value_cents: 480000, dest_country: "MX", substituted_duty_rate_bps: 1650 }, as: Analyst, as_user_id: "u_an1", captures: { exA: "$.data.id", ex_v0: "$.data.version "} }
            - { call: "POST /customs/claims", payload: { client_id: "${cl}", claim_type: "DIRECT_IDENTIFICATION", period_start: "2026-01-01T00:00:00Z", period_end: "2026-03-31T00:00:00Z" }, as: Analyst, as_user_id: "u_an1", captures: { claimA: "$.data.id", claim_v0: "$.data.version "} }
          trigger:
            - { call: "POST /customs/claims/${claimA}/lines", payload: { import_entry_id: "${enA}", export_shipment_id: "${exA}", matched_quantity: 40 }, as: Analyst, as_user_id: "u_an1", captures: { lineA: "$.data.id "} }
          assert:
            - "captured en_v0 == 1, ex_v0 == 1, claim_v0 == 1"
            - "after one line add: GET entry version == 2, GET export version == 2, GET claim version == 2 (and claim estimate_cents == 32670)"

      - name: derived_field_reconciliation_on_revoke
        claim_type: derived_field_reconciliation
        grounds: [calculations.entry_eligible_duty, state_machines.TariffMeasure.ACTIVE_to_REVOKED]
        distinguishing_aspect: "Revoking a measure reconciles the denormalized entry fields: non_drawbackable drops 25000 -> 0 and eligible/unclaimed rise back to 82500 without any direct write to the entry."
        test_recipe:
          setup: ["SECTION_301 measure 500 bps active before entry; entry E100 created under it (eligible 57500)"]
          setup_api_calls:
            - { call: "POST /customs/clients", payload: { name: "Acme Imports", importer_of_record_number: "12-3456789", contingency_fee_bps: 2500 }, as: FirmAdmin, captures: { cl: "$.data.id "} }
            - { call: "POST /customs/classifications", payload: { client_id: "${cl}", product_sku: "PANT-01", hts_code: "6203.42.4011", country_of_origin: "CN", duty_rate_bps: 1650, declared_unit_value_cents: 5000 }, as: Analyst, as_user_id: "u_an1", captures: { cls: "$.data.id "} }
            - { call: "POST /customs/classifications/${cls}/submit", payload: {}, as: Analyst, as_user_id: "u_an1" }
            - { call: "POST /customs/classifications/${cls}/review-decision", payload: { decision: "CERTIFY" }, as: LicensedBroker, as_user_id: "u_br1" }
            - { call: "POST /customs/tariff-measures", payload: { hts_code_prefix: "6203", measure_type: "SECTION_301", surcharge_bps: 500, effective_from: "2026-01-01T00:00:00Z" }, as: FirmAdmin, captures: { m1: "$.data.id "} }
            - { call: "POST /customs/import-entries", payload: { client_id: "${cl}", classification_id: "${cls}", entry_number: "E100", entry_date: "2026-03-10T00:00:00Z", port_code: "2704", line_quantity: 100, entered_value_cents: 500000, duty_paid_cents: 82500 }, as: Analyst, as_user_id: "u_an1", captures: { enA: "$.data.id", el1: "$.data.drawback_eligible_duty_cents "} }
          trigger:
            - { call: "POST /customs/tariff-measures/${m1}/revoke", payload: {}, as: FirmAdmin, captures: { mst: "$.data.status "} }
          assert:
            - "before revoke: captured el1 == 57500"
            - "captured mst == REVOKED"
            - "GET /customs/import-entries/${enA}: non_drawbackable_cents == 0, drawback_eligible_duty_cents == 82500, unclaimed_duty_cents == 82500"

      - name: measure_expiry_and_retention_sweep_inclusive
        claim_type: rate_threshold_triggers
        grounds: [calculations.retention_eligibility, state_machines.TariffMeasure.ACTIVE_to_EXPIRED, state_machines.ComplianceRecord.RETAINED_to_ELIGIBLE_FOR_DESTRUCTION]
        distinguishing_aspect: "Ops-run checkpoint with inclusive thresholds: at clock == effective_to the measure expires; at clock == retention_until the record becomes ELIGIBLE; one second earlier neither fires. Also covers destroy after eligibility."
        test_recipe:
          setup:
            - "claim PAID at default clock 2026-05-01 (records retention_until 2029-05-01T00:00:00Z)"
            - "measure AD_CVD prefix 8479 with effective_to 2026-06-01T00:00:00Z"
          setup_api_calls:
            - { call: "POST /customs/clients", payload: { name: "Acme Imports", importer_of_record_number: "12-3456789", contingency_fee_bps: 2500 }, as: FirmAdmin, captures: { cl: "$.data.id "} }
            - { call: "POST /customs/classifications", payload: { client_id: "${cl}", product_sku: "PANT-01", hts_code: "6203.42.4011", country_of_origin: "CN", duty_rate_bps: 1650, declared_unit_value_cents: 5000 }, as: Analyst, as_user_id: "u_an1", captures: { cls: "$.data.id "} }
            - { call: "POST /customs/classifications/${cls}/submit", payload: {}, as: Analyst, as_user_id: "u_an1" }
            - { call: "POST /customs/classifications/${cls}/review-decision", payload: { decision: "CERTIFY" }, as: LicensedBroker, as_user_id: "u_br1" }
            - { call: "POST /customs/import-entries", payload: { client_id: "${cl}", classification_id: "${cls}", entry_number: "E100", entry_date: "2026-03-10T00:00:00Z", port_code: "2704", line_quantity: 100, entered_value_cents: 500000, duty_paid_cents: 82500 }, as: Analyst, as_user_id: "u_an1", captures: { enA: "$.data.id "} }
            - { call: "POST /customs/export-shipments", payload: { client_id: "${cl}", export_date: "2026-04-01T00:00:00Z", hts_code: "6203.42.4011", quantity: 100, fob_value_cents: 480000, dest_country: "MX", substituted_duty_rate_bps: 1650 }, as: Analyst, as_user_id: "u_an1", captures: { exA: "$.data.id "} }
            - { call: "POST /customs/claims", payload: { client_id: "${cl}", claim_type: "DIRECT_IDENTIFICATION", period_start: "2026-01-01T00:00:00Z", period_end: "2026-03-31T00:00:00Z" }, as: Analyst, as_user_id: "u_an1", captures: { claimA: "$.data.id "} }
            - { call: "POST /customs/claims/${claimA}/lines", payload: { import_entry_id: "${enA}", export_shipment_id: "${exA}", matched_quantity: 40 }, as: Analyst, as_user_id: "u_an1" }
            - { call: "POST /customs/claims/${claimA}/file", payload: {}, as: LicensedBroker, as_user_id: "u_br1" }
            - { call: "POST /customs/claims/${claimA}/review", payload: { outcome: "APPROVED", approved_duty_cents: 32670 }, as: LicensedBroker, as_user_id: "u_br1" }
            - { call: "POST /customs/claims/${claimA}/record-payment", payload: { paid_duty_cents: 32670 }, as: FirmAdmin }
            - { call: "POST /customs/tariff-measures", payload: { hts_code_prefix: "8479", measure_type: "AD_CVD", surcharge_bps: 5000, effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-06-01T00:00:00Z" }, as: FirmAdmin, captures: { m1: "$.data.id "} }
            - { call: "POST /customs/_clock/set_current_utc", payload: { to_iso8601: "2029-04-30T23:59:59Z" }, as: FirmAdmin }
            - { call: "POST /customs/ops/run_sweep", payload: {}, as: FirmAdmin, captures: { exp1: "$.data.expired_measure_ids", eli1: "$.data.eligible_record_ids "} }
          trigger:
            - { call: "POST /customs/_clock/set_current_utc", payload: { to_iso8601: "2029-05-01T00:00:00Z" }, as: FirmAdmin }
            - { call: "POST /customs/ops/run_sweep", payload: {}, as: FirmAdmin, captures: { exp2: "$.data.expired_measure_ids", eli2: "$.data.eligible_record_ids "} }
            - { call: "GET /customs/records?claim_id=${claimA}", payload: {}, as: ComplianceManager, captures: { rec: "$.data[0].id", rec_st: "$.data[0].status "} }
            - { call: "POST /customs/records/${rec}/destroy", payload: {}, as: ComplianceManager, captures: { rec_final: "$.data.status "} }
          assert:
            - "one second before retention_until: captured eli1 == [] and exp1 contains ${m1} (measure effective_to 2026-06-01 already passed by 2029-04-30)"
            - "at exactly retention_until: captured eli2 has 3 ids; captured rec_st == ELIGIBLE_FOR_DESTRUCTION"
            - "destroy now succeeds: captured rec_final == DESTROYED"

