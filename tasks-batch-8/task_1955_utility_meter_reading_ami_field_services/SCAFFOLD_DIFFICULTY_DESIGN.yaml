            - { call: "POST /service-accounts", payload: { account_number: "A-9002", service_address: "53 Spruce Way", billing_cycle_code: "C18" }, as: MeterOpsAdmin, captures: { acct_id: $.data.id } }
            - { call: "POST /meters", payload: { serial_number: "SN-C-2", meter_type: "AMI" }, as: MeterOpsAdmin, captures: { meter_id: $.data.id } }
            - { call: "POST /meters/${meter_id}/install", payload: { service_account_id: "${acct_id}" }, as: MeterOpsAdmin }
