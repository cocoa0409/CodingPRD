# =============================================================================
# Auto Parts Retail & Distribution — benchmark seed tables
# Difficulty band: EXPERT (§0.4)
# =============================================================================

scenario: |
  337. Auto Parts Retail & Distribution: catalog & vehicle fitment,
  counter/retail vs wholesale account, core charge & return, special order &
  hotshot delivery, price tier/matrix, inventory & reorder,
  warranty/defective return, cross-reference

domain_name: auto-parts-retail-distribution
# Flat topology (§0.3): peer top-level collections (/parts, /vehicles, /accounts,
# /sales-orders, ...) linked by FK. The API root "" is their common prefix.
api_prefix: ""

# =============================================================================
# Step 0: Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: pricing_engine
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation

  entity_topology: flat
  # Peer entities linked by foreign keys; no resource nesting in URL paths.
  # Part, Vehicle, Fitment, CrossReference, Account, PriceTier, SalesOrder,
  # OrderLine, CoreReturn, WarrantyClaim, ReorderRequest all sit at the top
  # level under /parts and reference each other by id in the request body.

  state_machine_shape: parallel
  # SalesOrder carries two independent state dimensions (fulfillment_status ×
  # settlement_status). CoreReturn / WarrantyClaim add branching+revert shapes.

  relationship_patterns:
    - one_to_many       # Part -> Fitment, SalesOrder -> OrderLine
    - many_to_many      # Part <-> Vehicle via Fitment; Part <-> Part via CrossReference
    - self_referential  # CrossReference links Part.id to Part.id
    - cross_aggregate   # OrderLine references Part, Account, PriceTier across aggregates

  role_model: peer_roles
  # CounterClerk (retail), WholesaleRep (account sales), InventoryManager
  # (catalog/stock/reorder), WarrantyAdmin (defective/core/warranty rulings).

  consistency_model: immediate

# =============================================================================
# Table 1.0: Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Table 1.1: Entity-Relationship Table
# =============================================================================
entities:
  - name: Part
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: sku, type: string, source: input, description: "Manufacturer part number; unique across all Parts" }
      - { name: description, type: string, source: input, description: "Catalog description of the part" }
      - { name: list_price_cents, type: integer, source: input, description: "Manufacturer list price in integer cents; must be > 0" }
      - { name: cost_cents, type: integer, source: input, description: "Wholesale acquisition cost in integer cents; must be >= 0" }
      - { name: core_charge_cents, type: integer, source: input, default: 0, description: "Refundable core deposit in integer cents for rebuildable parts; 0 means no core; must be >= 0" }
      - { name: is_rebuildable, type: boolean, source: input, default: false, description: "True if the part carries a returnable core (core_charge_cents must be > 0 when true)" }
      - { name: warranty_days, type: integer, source: input, default: 0, description: "Warranty coverage window in days from sale; must be >= 0" }
      - { name: stockable, type: boolean, source: input, default: true, description: "False marks a special-order-only part that is never auto-reordered and never held in stock" }
      - { name: on_hand_qty, type: integer, source: computed, default: 0, description: "Units physically in stock; debited on SHIP, credited on receiving and defective restock; never negative" }
      - { name: reserved_qty, type: integer, source: computed, default: 0, description: "Units committed to ALLOCATED order lines not yet shipped; never negative" }
      - { name: available_qty, type: integer, source: computed, default: 0, description: "Read-only = on_hand_qty - reserved_qty; never negative" }
      - { name: reorder_point, type: integer, source: input, default: 0, description: "Available-quantity threshold at/below which a reorder is suggested; must be >= 0" }
      - { name: reorder_qty, type: integer, source: input, default: 0, description: "Replenishment lot size used when a ReorderRequest is generated; must be >= 0" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | DISCONTINUED; DISCONTINUED parts cannot start new orders" }

  - name: Vehicle
    parent: null
    common_fields: true
    fields:
      - { name: year, type: integer, source: input, description: "Model year; must be between 1900 and 2100 inclusive" }
      - { name: make, type: string, source: input, description: "Vehicle make, e.g. TOYOTA" }
      - { name: model, type: string, source: input, description: "Vehicle model, e.g. CAMRY" }
      - { name: engine, type: string, source: input, default: "", description: "Optional engine/trim qualifier, e.g. 2.5L-L4" }

  - name: Fitment
    parent: null
    common_fields: false  # immutable association: id, created_at only
    fields:
      - { name: part_id, type: string, source: input, description: "FK -> Part.id" }
      - { name: vehicle_id, type: string, source: input, description: "FK -> Vehicle.id" }
      - { name: position, type: enum, source: input, default: UNIVERSAL, description: "FRONT | REAR | LEFT | RIGHT | UNIVERSAL — installation position" }
      - { name: notes, type: string, source: input, default: "", description: "Free-text fitment notes" }

  - name: CrossReference
    parent: null
    common_fields: false  # immutable directed interchange edge: id, created_at only
    fields:
      - { name: part_id, type: string, source: input, description: "FK -> Part.id; the catalog part being looked up" }
      - { name: interchange_part_id, type: string, source: input, description: "FK -> Part.id; an equivalent substitute part" }
      - { name: relation, type: enum, source: input, default: SUPERSEDES, description: "SUPERSEDES | EQUIVALENT | OE_TO_AFTERMARKET — interchange relation kind" }

  - name: Account
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Customer or shop name" }
      - { name: account_type, type: enum, source: input, description: "RETAIL | WHOLESALE — counter walk-in vs trade account" }
      - { name: price_tier_id, type: string, source: input, description: "FK -> PriceTier.id; the pricing matrix tier applied to this account's lines" }
      - { name: credit_limit_cents, type: integer, source: input, default: 0, description: "Maximum open A/R balance in integer cents for WHOLESALE accounts; ignored for RETAIL; must be >= 0" }
      - { name: ar_balance_cents, type: integer, source: computed, default: 0, description: "Outstanding accounts-receivable balance in integer cents; charged on INVOICED, relieved on settlement/credit; never negative" }
      - { name: status, type: enum, source: system, default: ACTIVE, description: "ACTIVE | ON_HOLD; ON_HOLD accounts cannot open new orders" }

  - name: PriceTier
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Tier name, e.g. JOBBER, INSTALLER, LIST" }
      - { name: discount_pct, type: number, source: input, description: "Fractional discount off list_price applied to non-core merchandise, 0.00–0.90 inclusive" }
      - { name: core_discount_pct, type: number, source: input, default: 0, description: "Fractional discount applied to core_charge component, 0.00–0.90 inclusive" }
      - { name: min_margin_pct, type: number, source: input, default: 0, description: "Floor: a line's net merchandise price may not fall below cost*(1+min_margin_pct); 0.00–5.00 inclusive" }

  - name: SalesOrder
    parent: null
    common_fields: true
    fields:
      - { name: account_id, type: string, source: input, description: "FK -> Account.id; the buyer" }
      - { name: channel, type: enum, source: input, description: "COUNTER | WHOLESALE — must match the account_type (RETAIL->COUNTER, WHOLESALE->WHOLESALE)" }
      - { name: fulfillment_status, type: enum, source: system, default: OPEN, description: "OPEN | ALLOCATED | SHIPPED | CANCELLED — physical fulfillment dimension" }
      - { name: settlement_status, type: enum, source: system, default: UNBILLED, description: "UNBILLED | INVOICED | PAID — financial dimension, evolves independently of fulfillment_status" }
      - { name: merchandise_subtotal_cents, type: integer, source: computed, default: 0, description: "Read-only sum of all line net merchandise extended prices" }
      - { name: core_subtotal_cents, type: integer, source: computed, default: 0, description: "Read-only sum of all line net core charges" }
      - { name: order_total_cents, type: integer, source: computed, default: 0, description: "Read-only = merchandise_subtotal_cents + core_subtotal_cents" }
      - { name: hotshot_requested, type: boolean, source: input, default: false, description: "True requests expedited hotshot delivery for special-order lines on this order" }
      - { name: hotshot_fee_cents, type: integer, source: computed, default: 0, description: "Read-only expedited delivery surcharge; computed at allocation, 0 if not requested or no special-order line" }

  - name: OrderLine
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: input, description: "FK -> SalesOrder.id" }
      - { name: part_id, type: string, source: input, description: "FK -> Part.id" }
      - { name: price_tier_id, type: string, source: system, description: "FK -> PriceTier.id; snapshot of the account's tier at line creation (version-pinned)" }
      - { name: qty, type: integer, source: input, description: "Units ordered on this line; must be >= 1" }
      - { name: is_special_order, type: boolean, source: computed, default: false, description: "True when the part is non-stockable or requested qty exceeds available_qty at line creation" }
      - { name: unit_merch_price_cents, type: integer, source: computed, default: 0, description: "Net per-unit merchandise price after tier discount and margin floor, integer cents" }
      - { name: unit_core_price_cents, type: integer, source: computed, default: 0, description: "Net per-unit core charge after core discount, integer cents" }
      - { name: line_merch_total_cents, type: integer, source: computed, default: 0, description: "Read-only = unit_merch_price_cents * qty" }
      - { name: line_core_total_cents, type: integer, source: computed, default: 0, description: "Read-only = unit_core_price_cents * qty" }
      - { name: cores_outstanding, type: integer, source: computed, default: 0, description: "Number of core deposits not yet returned for this line; set to qty at SHIP for rebuildable parts, decremented by CoreReturn" }
      - { name: status, type: enum, source: system, default: PENDING, description: "PENDING | ALLOCATED | SHIPPED | CANCELLED — line-level fulfillment mirrors order allocation/ship" }

  - name: CoreReturn
    parent: null
    common_fields: true
    fields:
      - { name: order_line_id, type: string, source: input, description: "FK -> OrderLine.id; the line whose cores are being returned" }
      - { name: qty, type: integer, source: input, description: "Number of cores being returned; must be >= 1 and <= the line's cores_outstanding" }
      - { name: refund_cents, type: integer, source: computed, default: 0, description: "Read-only core deposit refund = qty * OrderLine.unit_core_price_cents" }
      - { name: status, type: enum, source: system, default: PENDING_INSPECTION, description: "PENDING_INSPECTION | ACCEPTED | REJECTED" }

  - name: WarrantyClaim
    parent: null
    common_fields: true
    fields:
      - { name: order_line_id, type: string, source: input, description: "FK -> OrderLine.id; the sold line being claimed against" }
      - { name: qty, type: integer, source: input, description: "Units claimed defective; must be >= 1 and <= the line's qty" }
      - { name: reason, type: string, source: input, description: "Free-text defect description" }
      - { name: resolution, type: enum, source: input, default: REPLACE, description: "REPLACE | REFUND — requested remedy" }
      - { name: credit_cents, type: integer, source: computed, default: 0, description: "Read-only credit issued on APPROVED REFUND resolution = qty * OrderLine.unit_merch_price_cents; 0 for REPLACE" }
      - { name: restock_defective, type: boolean, source: input, default: false, description: "True if an APPROVED claim should return the defective unit to on_hand (e.g. repairable); default discards it" }
      - { name: status, type: enum, source: system, default: SUBMITTED, description: "SUBMITTED | UNDER_REVIEW | APPROVED | DENIED" }

  - name: ReorderRequest
    parent: null
    common_fields: true
    fields:
      - { name: part_id, type: string, source: input, description: "FK -> Part.id; the part being replenished" }
      - { name: qty_ordered, type: integer, source: computed, default: 0, description: "Replenishment quantity snapshotted from Part.reorder_qty at generation; must be >= 1" }
      - { name: qty_received, type: integer, source: computed, default: 0, description: "Units received so far against this request; <= qty_ordered" }
      - { name: status, type: enum, source: system, default: SUGGESTED, description: "SUGGESTED | ORDERED | PARTIALLY_RECEIVED | RECEIVED | CANCELLED" }

  - name: Driver
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Hotshot delivery driver name" }
      - { name: turnaround_min, type: integer, source: input, default: 0, description: "Required buffer in minutes between two delivery runs on this driver; must be >= 0" }

  - name: Bay
    parent: null
    common_fields: true
    fields:
      - { name: code, type: string, source: input, description: "Loading bay code, unique across all Bays" }

  - name: DeliveryRun
    parent: null
    common_fields: true
    fields:
      - { name: order_id, type: string, source: input, description: "FK -> SalesOrder.id; the order whose special-order/hotshot lines this run delivers" }
      - { name: driver_id, type: string, source: input, description: "FK -> Driver.id; the assigned hotshot driver (overlap resource A: buffered window)" }
      - { name: bay_id, type: string, source: input, description: "FK -> Bay.id; the loading bay staged from (overlap resource B: half-open window)" }
      - { name: window_start_min, type: integer, source: input, description: "Run window start as minutes-from-epoch (integer); must be >= 0" }
      - { name: window_end_min, type: integer, source: input, description: "Run window end as minutes-from-epoch; must be > window_start_min" }
      - { name: status, type: enum, source: system, default: SCHEDULED, description: "SCHEDULED | DISPATCHED | DELIVERED | CANCELLED" }

# =============================================================================
# Table 1.2: State Machine Table
# =============================================================================
state_machines:
  # ---- SalesOrder.fulfillment_status (parallel dimension A) ----
  - entity: SalesOrder.fulfillment_status
    initial_state: OPEN
    terminal_states: [SHIPPED, CANCELLED]
    transitions:
      - from: OPEN
        to: ALLOCATED
        trigger: "POST /sales-orders/{id}/allocate"
        actor: CounterClerk | WholesaleRep
        preconditions:
          - "Order has >= 1 OrderLine (ERR_EMPTY_ORDER)"
          - "Account.status == ACTIVE (ERR_ACCOUNT_ON_HOLD)"
          - "For every non-special-order line, Part.available_qty >= line.qty (ERR_INSUFFICIENT_STOCK)"
          - "expected_sales_order_version matches SalesOrder.version (ERR_STALE_VERSION)"
        side_effects:
          - "For each non-special-order line: Part.reserved_qty += line.qty; recompute Part.available_qty (cascade: Part mutated, may cross reorder_point -> see reorder auto-suggest below); line.status -> ALLOCATED"
          - "Special-order lines remain status PENDING (no reservation; awaiting hotshot/receiving)"
          - "Compute hotshot_fee_cents (calculation hotshot_fee) when hotshot_requested and >= 1 special-order line exists"
          - "Recompute order subtotals/total including hotshot_fee_cents"
          - "increments SalesOrder.version by 1"
          - "fulfillment_status -> ALLOCATED"
      - from: ALLOCATED
        to: SHIPPED
        trigger: "POST /sales-orders/{id}/ship"
        actor: CounterClerk | WholesaleRep
        preconditions:
          - "fulfillment_status == ALLOCATED (ERR_INVALID_FULFILLMENT_STATE)"
          - "No line is_special_order still PENDING without received stock (ERR_SPECIAL_ORDER_NOT_READY)"
          - "expected_sales_order_version matches SalesOrder.version (ERR_STALE_VERSION)"
        side_effects:
          - "For each ALLOCATED line: Part.on_hand_qty -= line.qty; Part.reserved_qty -= line.qty; recompute available_qty (cascade hop 1: Part mutated; if available_qty <= reorder_point and stockable and no open ReorderRequest -> auto-create ReorderRequest SUGGESTED [cascade hop 2])"
          - "For each line whose Part.is_rebuildable: line.cores_outstanding = line.qty"
          - "line.status -> SHIPPED"
          - "increments SalesOrder.version by 1"
          - "fulfillment_status -> SHIPPED"
      - from: OPEN
        to: CANCELLED
        trigger: "POST /sales-orders/{id}/cancel"
        actor: CounterClerk | WholesaleRep
        preconditions:
          - "fulfillment_status == OPEN (ERR_INVALID_FULFILLMENT_STATE)"
          - "settlement_status == UNBILLED (ERR_ORDER_ALREADY_INVOICED)"
        side_effects:
          - "All lines status -> CANCELLED"
          - "increments SalesOrder.version by 1"
          - "fulfillment_status -> CANCELLED"
      - from: ALLOCATED
        to: CANCELLED
        trigger: "POST /sales-orders/{id}/cancel"
        actor: CounterClerk | WholesaleRep
        preconditions:
          - "fulfillment_status == ALLOCATED (ERR_INVALID_FULFILLMENT_STATE)"
          - "settlement_status == UNBILLED (ERR_ORDER_ALREADY_INVOICED)"
        side_effects:
          - "Compensation: for each ALLOCATED line release reservation -> Part.reserved_qty -= line.qty; recompute available_qty (conserves on_hand_qty + reserved across allocate/cancel)"
          - "All lines status -> CANCELLED"
          - "increments SalesOrder.version by 1"
          - "fulfillment_status -> CANCELLED"

  # ---- SalesOrder.settlement_status (parallel dimension B) ----
  - entity: SalesOrder.settlement_status
    initial_state: UNBILLED
    terminal_states: [PAID]
    transitions:
      - from: UNBILLED
        to: INVOICED
        trigger: "POST /sales-orders/{id}/invoice"
        actor: CounterClerk | WholesaleRep
        preconditions:
          - "fulfillment_status == SHIPPED (ERR_NOT_SHIPPED)"
          - "settlement_status == UNBILLED (ERR_ALREADY_INVOICED)"
          - "If Account.account_type == WHOLESALE: Account.ar_balance_cents + order_total_cents <= Account.credit_limit_cents (ERR_CREDIT_LIMIT_EXCEEDED)"
        side_effects:
          - "Cross-entity: Account.ar_balance_cents += order_total_cents (cascade: Account mutated; recompute Account derived A/R)"
          - "settlement_status -> INVOICED"
      - from: INVOICED
        to: PAID
        trigger: "POST /sales-orders/{id}/pay"
        actor: CounterClerk | WholesaleRep
        preconditions:
          - "settlement_status == INVOICED (ERR_NOT_INVOICED)"
        side_effects:
          - "Cross-entity: Account.ar_balance_cents -= order_total_cents; clamp at 0 floor (compensation pair with INVOICED, conserves A/R)"
          - "settlement_status -> PAID"

  # ---- CoreReturn (branching with revert) ----
  - entity: CoreReturn
    initial_state: PENDING_INSPECTION
    terminal_states: [ACCEPTED, REJECTED]
    transitions:
      - from: PENDING_INSPECTION
        to: ACCEPTED
        trigger: "POST /core-returns/{id}/accept"
        actor: WarrantyAdmin
        preconditions:
          - "CoreReturn.status == PENDING_INSPECTION (ERR_CORE_RETURN_NOT_PENDING)"
          - "Referenced OrderLine.status == SHIPPED (ERR_CORE_RETURN_LINE_NOT_SHIPPED)"
          - "CoreReturn.qty <= OrderLine.cores_outstanding (ERR_CORE_EXCEEDS_OUTSTANDING)"
        side_effects:
          - "Cross-entity cascade hop 1: OrderLine.cores_outstanding -= qty (OrderLine mutated)"
          - "Cross-entity cascade hop 2: refund_cents credited against the order's Account -> Account.ar_balance_cents -= refund_cents, clamp at 0 (Account mutated as a consequence of the line mutation)"
          - "status -> ACCEPTED"
      - from: PENDING_INSPECTION
        to: REJECTED
        trigger: "POST /core-returns/{id}/reject"
        actor: WarrantyAdmin
        preconditions:
          - "CoreReturn.status == PENDING_INSPECTION (ERR_CORE_RETURN_NOT_PENDING)"
        side_effects:
          - "No core deposit refunded; cores_outstanding unchanged"
          - "status -> REJECTED"

  # ---- WarrantyClaim (branching: review fork, approve/deny) ----
  - entity: WarrantyClaim
    initial_state: SUBMITTED
    terminal_states: [APPROVED, DENIED]
    transitions:
      - from: SUBMITTED
        to: UNDER_REVIEW
        trigger: "POST /warranty-claims/{id}/start-review"
        actor: WarrantyAdmin
        preconditions:
          - "WarrantyClaim.status == SUBMITTED (ERR_CLAIM_NOT_SUBMITTED)"
        side_effects:
          - "status -> UNDER_REVIEW"
      - from: SUBMITTED
        to: DENIED
        trigger: "POST /warranty-claims/{id}/deny"
        actor: WarrantyAdmin
        preconditions:
          - "WarrantyClaim.status IN {SUBMITTED, UNDER_REVIEW} (ERR_CLAIM_NOT_OPEN)"
        side_effects:
          - "status -> DENIED; no credit, no restock"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /warranty-claims/{id}/deny"
        actor: WarrantyAdmin
        preconditions:
          - "WarrantyClaim.status IN {SUBMITTED, UNDER_REVIEW} (ERR_CLAIM_NOT_OPEN)"
        side_effects:
          - "status -> DENIED; no credit, no restock"
      - from: UNDER_REVIEW
        to: APPROVED
        trigger: "POST /warranty-claims/{id}/approve"
        actor: WarrantyAdmin
        preconditions:
          - "WarrantyClaim.status == UNDER_REVIEW (ERR_CLAIM_NOT_UNDER_REVIEW)"
          - "Claim filed within warranty window: claim.created_at <= OrderLine ship time + Part.warranty_days days (ERR_WARRANTY_EXPIRED)"
        side_effects:
          - "Compute credit_cents (calculation warranty_credit): REFUND -> qty*unit_merch_price_cents; REPLACE -> 0"
          - "If resolution == REFUND: cross-entity Account.ar_balance_cents -= credit_cents, clamp at 0"
          - "If restock_defective == true: Part.on_hand_qty += qty; recompute available_qty (cascade: Part mutated, available rises)"
          - "If resolution == REPLACE: Part.on_hand_qty -= qty for the replacement issue; recompute available_qty (may cross reorder_point -> auto-suggest ReorderRequest)"
          - "status -> APPROVED"

  # ---- ReorderRequest (replenishment lifecycle with cyclic partial receipt) ----
  - entity: ReorderRequest
    initial_state: SUGGESTED
    terminal_states: [RECEIVED, CANCELLED]
    transitions:
      - from: SUGGESTED
        to: ORDERED
        trigger: "POST /reorder-requests/{id}/place"
        actor: InventoryManager
        preconditions:
          - "ReorderRequest.status == SUGGESTED (ERR_REORDER_NOT_SUGGESTED)"
          - "Part.status == ACTIVE (ERR_PART_DISCONTINUED)"
        side_effects:
          - "status -> ORDERED"
      - from: ORDERED
        to: PARTIALLY_RECEIVED
        trigger: "POST /reorder-requests/{id}/receive"
        actor: InventoryManager
        preconditions:
          - "ReorderRequest.status IN {ORDERED, PARTIALLY_RECEIVED} (ERR_REORDER_NOT_RECEIVABLE)"
          - "receive_qty >= 1 and qty_received + receive_qty < qty_ordered (ERR_INVALID_RECEIVE_QTY)"
        side_effects:
          - "Cross-entity: Part.on_hand_qty += receive_qty; recompute available_qty (Part mutated)"
          - "qty_received += receive_qty"
          - "status -> PARTIALLY_RECEIVED (remains, can loop on further partial receives)"
      - from: PARTIALLY_RECEIVED
        to: PARTIALLY_RECEIVED
        trigger: "POST /reorder-requests/{id}/receive"
        actor: InventoryManager
        preconditions:
          - "ReorderRequest.status == PARTIALLY_RECEIVED (ERR_REORDER_NOT_RECEIVABLE)"
          - "receive_qty >= 1 and qty_received + receive_qty < qty_ordered (ERR_INVALID_RECEIVE_QTY)"
        side_effects:
          - "Cross-entity: Part.on_hand_qty += receive_qty; recompute available_qty"
          - "qty_received += receive_qty (cyclic self-loop until full receipt)"
      - from: ORDERED
        to: RECEIVED
        trigger: "POST /reorder-requests/{id}/receive"
        actor: InventoryManager
        preconditions:
          - "ReorderRequest.status IN {ORDERED, PARTIALLY_RECEIVED} (ERR_REORDER_NOT_RECEIVABLE)"
          - "qty_received + receive_qty == qty_ordered (ERR_INVALID_RECEIVE_QTY)"
        side_effects:
          - "Cross-entity: Part.on_hand_qty += receive_qty; recompute available_qty"
          - "qty_received = qty_ordered"
          - "status -> RECEIVED"
      - from: PARTIALLY_RECEIVED
        to: RECEIVED
        trigger: "POST /reorder-requests/{id}/receive"
        actor: InventoryManager
        preconditions:
          - "ReorderRequest.status == PARTIALLY_RECEIVED (ERR_REORDER_NOT_RECEIVABLE)"
          - "qty_received + receive_qty == qty_ordered (ERR_INVALID_RECEIVE_QTY)"
        side_effects:
          - "Cross-entity: Part.on_hand_qty += receive_qty; recompute available_qty"
          - "qty_received = qty_ordered"
          - "status -> RECEIVED"
      - from: SUGGESTED
        to: CANCELLED
        trigger: "POST /reorder-requests/{id}/cancel"
        actor: InventoryManager
        preconditions:
          - "ReorderRequest.status IN {SUGGESTED, ORDERED} (ERR_REORDER_NOT_CANCELLABLE)"
        side_effects:
          - "status -> CANCELLED (no inventory change)"
      - from: ORDERED
        to: CANCELLED
        trigger: "POST /reorder-requests/{id}/cancel"
        actor: InventoryManager
        preconditions:
          - "ReorderRequest.status IN {SUGGESTED, ORDERED} (ERR_REORDER_NOT_CANCELLABLE)"
        side_effects:
          - "status -> CANCELLED (no inventory change)"

  # ---- Part (catalog lifecycle) ----
  - entity: Part
    initial_state: ACTIVE
    terminal_states: [DISCONTINUED]
    transitions:
      - from: ACTIVE
        to: DISCONTINUED
        trigger: "POST /parts/{id}/discontinue"
        actor: InventoryManager
        preconditions:
          - "Part.status == ACTIVE (ERR_PART_ALREADY_DISCONTINUED)"
          - "Part.reserved_qty == 0 (ERR_PART_HAS_RESERVATIONS)"
        side_effects:
          - "Cross-entity cascade hop 1: every SUGGESTED or ORDERED ReorderRequest for this Part -> CANCELLED (ReorderRequest mutated)"
          - "status -> DISCONTINUED"

  # ---- DeliveryRun (hotshot delivery scheduling; overlap on Driver + Bay) ----
  - entity: DeliveryRun
    initial_state: SCHEDULED
    terminal_states: [DELIVERED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: DISPATCHED
        trigger: "POST /delivery-runs/{id}/dispatch"
        actor: CounterClerk | WholesaleRep
        preconditions:
          - "DeliveryRun.status == SCHEDULED (ERR_RUN_NOT_SCHEDULED)"
          - "Referenced SalesOrder.fulfillment_status == ALLOCATED or SHIPPED (ERR_RUN_ORDER_NOT_READY)"
        side_effects:
          - "status -> DISPATCHED"
      - from: DISPATCHED
        to: DELIVERED
        trigger: "POST /delivery-runs/{id}/complete"
        actor: CounterClerk | WholesaleRep
        preconditions:
          - "DeliveryRun.status == DISPATCHED (ERR_RUN_NOT_DISPATCHED)"
        side_effects:
          - "status -> DELIVERED"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /delivery-runs/{id}/cancel"
        actor: CounterClerk | WholesaleRep
        preconditions:
          - "DeliveryRun.status IN {SCHEDULED, DISPATCHED} (ERR_RUN_NOT_CANCELLABLE)"
        side_effects:
          - "status -> CANCELLED (frees the driver and bay windows for future scheduling)"
      - from: DISPATCHED
        to: CANCELLED
        trigger: "POST /delivery-runs/{id}/cancel"
        actor: CounterClerk | WholesaleRep
        preconditions:
          - "DeliveryRun.status IN {SCHEDULED, DISPATCHED} (ERR_RUN_NOT_CANCELLABLE)"
        side_effects:
          - "status -> CANCELLED (frees the driver and bay windows for future scheduling)"
    note: |
      Creation guard (POST /delivery-runs, see §1.4 priority 17/18): the new run's
      [window_start_min, window_end_min) interval is checked against existing
      non-CANCELLED runs on the SAME driver and SAME bay, with DIFFERENT interval
      semantics per resource:
        - Driver (BUFFERED): two runs collide if the gap between them is strictly
          less than Driver.turnaround_min. Formally, runs A,B collide when
          A.start < B.end + turnaround AND B.start < A.end + turnaround. Touching
          or near-touching within the buffer is a collision (ERR_DRIVER_WINDOW_CONFLICT).
        - Bay (HALF-OPEN, no buffer): two runs collide only on positive overlap of
          half-open intervals: A.start < B.end AND B.start < A.end. Exact adjacency
          (A.end == B.start) does NOT collide (ERR_BAY_WINDOW_CONFLICT).

# =============================================================================
# Table 1.2.1: Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: order-allocate-stale-version
    parent_entity: SalesOrder
    write_endpoint: "POST /sales-orders/{id}/allocate"
    occ_field: "expected_sales_order_version"
    description: |
      Allocating a SalesOrder whose version has advanced since the client last
      observed it is rejected as a stale-version conflict. A line added to the
      order (POST /order-lines) legitimately recomputes the order subtotals and
      bumps SalesOrder.version; an allocate carrying the pre-add version is
      operating on a stale view of the order's line set and is refused.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: order-ship-stale-version
    parent_entity: SalesOrder
    write_endpoint: "POST /sales-orders/{id}/ship"
    occ_field: "expected_sales_order_version"
    description: |
      Shipping a SalesOrder whose version has advanced since the client last
      observed it is rejected as a stale-version conflict. The allocate step
      legitimately advances SalesOrder.version; a ship request carrying the
      pre-allocate version is operating on a stale view and is refused.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# Table 1.3: Calculation Rules Table
# =============================================================================
calculations:
  - name: line_net_pricing
    trigger: "OrderLine creation (POST /order-lines)"
    algorithm: tiered_pricing
    formula: |
      Inputs: Part.list_price_cents (LP), Part.cost_cents (C),
      Part.core_charge_cents (CORE), PriceTier.discount_pct (D),
      PriceTier.core_discount_pct (CD), PriceTier.min_margin_pct (M).
      Pin evaluation order EXACTLY (combinatorial: 3+ inputs, nested branches):
        step 1  discounted = round_half_up(LP * (1 - D))            # cents
        step 2  margin_floor = ceil(C * (1 + M))                    # cents, ceil so floor is never undercut
        step 3  unit_merch_price_cents = max(discounted, margin_floor)
        step 4  unit_core_price_cents  = round_half_up(CORE * (1 - CD))
        step 5  line_merch_total_cents = unit_merch_price_cents * qty
        step 6  line_core_total_cents  = unit_core_price_cents  * qty
      Rounding is applied PER UNIT (steps 1,4) BEFORE multiplying by qty
      (steps 5,6) — round-then-multiply, NOT multiply-then-round. This order is
      pinned; the two orders diverge whenever a per-unit half-cent exists.
    input_set: "Single OrderLine at creation; tier fields read from the line's version-pinned price_tier_id snapshot of the account's tier"
    constants:
      ROUNDING: round_half_up
    precision: "integer cents, round_half_up per unit, ceil on margin floor"
    variants:
      - name: counter_list_pricing
        when: "Account.account_type == RETAIL (channel COUNTER)"
        difference: "Retail lines always price at LP (D forced to 0 and margin floor never binds because list >= cost); unit_merch_price_cents = LP regardless of the tier's discount_pct"
      - name: wholesale_matrix_pricing
        when: "Account.account_type == WHOLESALE (channel WHOLESALE)"
        difference: "Full tier matrix applies: discount_pct and the margin floor both bind, so the same Part yields a different unit_merch_price_cents than the retail variant"

  - name: order_rollup
    trigger: "OrderLine create/cancel and SalesOrder allocate (recompute order totals)"
    algorithm: aggregation
    formula: |
      merchandise_subtotal_cents = sum(line.line_merch_total_cents
        for line in order.lines where line.status != CANCELLED)
      core_subtotal_cents = sum(line.line_core_total_cents
        for line in order.lines where line.status != CANCELLED)
      order_total_cents = merchandise_subtotal_cents + core_subtotal_cents
        + hotshot_fee_cents
    input_set: "All OrderLines of the order whose status is NOT CANCELLED; hotshot_fee_cents added once at order level after allocation"
    precision: "integer cents; sum of already-rounded per-line totals (no further rounding)"

  - name: hotshot_fee
    trigger: "SalesOrder allocate when hotshot_requested == true"
    algorithm: threshold
    formula: |
      special_lines = [line for line in order.lines
                       if line.is_special_order and line.status != CANCELLED]
      if not order.hotshot_requested or len(special_lines) == 0:
          hotshot_fee_cents = 0
      else:
          special_units = sum(line.qty for line in special_lines)
          hotshot_fee_cents = BASE_FEE_CENTS + PER_UNIT_CENTS * special_units
    input_set: "Only special-order, non-cancelled lines count toward special_units"
    constants:
      BASE_FEE_CENTS: 2500
      PER_UNIT_CENTS: 750
    precision: "integer cents (no rounding; integer arithmetic)"
    note: "Boundary: exactly zero special-order lines => fee 0 even when hotshot_requested; one special unit => 2500 + 750"

  - name: warranty_credit
    trigger: "WarrantyClaim approve (UNDER_REVIEW -> APPROVED)"
    algorithm: aggregation
    formula: |
      if resolution == REFUND:
          credit_cents = qty * OrderLine.unit_merch_price_cents
      else:  # REPLACE
          credit_cents = 0
    input_set: "Single approved claim against one OrderLine; unit_merch_price_cents read from the line snapshot (not recomputed from current tier)"
    precision: "integer cents"
    variants:
      - name: refund_resolution
        when: "resolution == REFUND"
        difference: "Issues monetary credit against Account A/R and does NOT issue a replacement unit"
      - name: replace_resolution
        when: "resolution == REPLACE"
        difference: "Issues a replacement unit (debits Part.on_hand_qty) and credit_cents == 0; no A/R credit"

  - name: core_refund
    trigger: "CoreReturn accept (PENDING_INSPECTION -> ACCEPTED)"
    algorithm: aggregation
    formula: |
      refund_cents = qty * OrderLine.unit_core_price_cents
    input_set: "Single accepted CoreReturn against one OrderLine; uses the line's net per-unit core price snapshot"
    precision: "integer cents"

  - name: reorder_suggestion
    trigger: "Part.available_qty recompute after SHIP or REPLACE issue"
    algorithm: threshold
    formula: |
      after recomputing available_qty:
      if Part.stockable
         and Part.status == ACTIVE
         and Part.available_qty <= Part.reorder_point
         and there is NO existing ReorderRequest for this Part in
             {SUGGESTED, ORDERED, PARTIALLY_RECEIVED}:
          create ReorderRequest(part_id, qty_ordered = Part.reorder_qty,
                                status = SUGGESTED)
    input_set: "One Part after an inventory-decrementing side effect"
    constants:
      COMPARATOR: "<= (at-or-below the reorder point triggers; strictly above does not)"
    precision: "integer units"
    note: "Boundary: available_qty == reorder_point triggers (<=); available_qty == reorder_point + 1 does not"

# =============================================================================
# Table 1.4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and well-formed"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role permitted for this operation per §1.7 RBAC matrix"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "All path/body resource ids exist (validated left-to-right: path before body)"
    error_id: "ERR_{RESOURCE}_NOT_FOUND (per resource type)"
    http_status: 404
    applies_to: all endpoints referencing a resource id

  - priority: 4
    category: business_constraint
    check: "Required body fields present and typed; enum members valid; numeric fields satisfy declared ranges (qty>=1, percentages in range, year 1900-2100)"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: all create/update endpoints

  - priority: 5
    category: business_constraint
    check: "Part.sku unique across all Parts on create"
    error_id: ERR_DUPLICATE_SKU
    http_status: 409
    applies_to: "POST /parts"

  - priority: 6
    category: business_referential
    check: "SalesOrder.channel must match Account.account_type (RETAIL->COUNTER, WHOLESALE->WHOLESALE)"
    error_id: ERR_CHANNEL_ACCOUNT_MISMATCH
    http_status: 409
    applies_to: "POST /sales-orders"

  - priority: 7
    category: state
    check: "OrderLine create requires SalesOrder.fulfillment_status == OPEN"
    error_id: ERR_ORDER_NOT_OPEN
    http_status: 409
    applies_to: "POST /order-lines"

  - priority: 8
    category: state
    check: "Target resource in the correct state for the requested transition (order fulfillment/settlement state, core-return state, claim state, reorder state, part state)"
    error_id: "varies (ERR_INVALID_FULFILLMENT_STATE, ERR_NOT_SHIPPED, ERR_CLAIM_NOT_UNDER_REVIEW, ERR_REORDER_NOT_RECEIVABLE, ...)"
    http_status: 409
    applies_to: "all transition endpoints"

  - priority: 9
    category: business_referential
    check: "OrderLine.part_id references an ACTIVE Part (DISCONTINUED parts cannot start new lines)"
    error_id: ERR_PART_DISCONTINUED
    http_status: 409
    applies_to: "POST /order-lines"

  - priority: 10
    category: business_constraint
    check: "is_rebuildable Part must have core_charge_cents > 0; non-rebuildable must have core_charge_cents == 0"
    error_id: ERR_CORE_CHARGE_INCONSISTENT
    http_status: 422
    applies_to: "POST /parts"

  - priority: 11
    category: business_safety
    check: "WarrantyClaim approve only within warranty window (claim.created_at <= ship_time + Part.warranty_days days)"
    error_id: ERR_WARRANTY_EXPIRED
    http_status: 409
    applies_to: "POST /warranty-claims/{id}/approve"

  - priority: 12
    category: business_constraint
    check: "CoreReturn.qty <= OrderLine.cores_outstanding; WarrantyClaim.qty <= OrderLine.qty"
    error_id: "ERR_CORE_EXCEEDS_OUTSTANDING / ERR_CLAIM_QTY_EXCEEDS_LINE"
    http_status: 409
    applies_to: "POST /core-returns/{id}/accept, POST /warranty-claims"

  - priority: 13
    category: business_constraint
    check: "ReorderRequest receive qty: receive_qty>=1 and qty_received+receive_qty <= qty_ordered"
    error_id: ERR_INVALID_RECEIVE_QTY
    http_status: 409
    applies_to: "POST /reorder-requests/{id}/receive"

  - priority: 14
    category: business_constraint
    check: "Allocate requires every non-special-order line have Part.available_qty >= line.qty"
    error_id: ERR_INSUFFICIENT_STOCK
    http_status: 409
    applies_to: "POST /sales-orders/{id}/allocate"

  - priority: 15
    category: business_fiscal
    check: "Invoice a WHOLESALE order only if Account.ar_balance_cents + order_total_cents <= Account.credit_limit_cents"
    error_id: ERR_CREDIT_LIMIT_EXCEEDED
    http_status: 402
    applies_to: "POST /sales-orders/{id}/invoice"

  - priority: 16
    category: business_referential
    check: "OCC: expected_sales_order_version must equal SalesOrder.version on allocate/ship"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /sales-orders/{id}/allocate, POST /sales-orders/{id}/ship"

  - priority: 17
    category: business_temporal
    check: "DeliveryRun create: new [start,end) must not collide with any non-CANCELLED run on the SAME driver under BUFFERED semantics (gap < Driver.turnaround_min is a collision)"
    error_id: ERR_DRIVER_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /delivery-runs"

  - priority: 18
    category: business_temporal
    check: "DeliveryRun create: new [start,end) must not POSITIVELY overlap any non-CANCELLED run on the SAME bay under HALF-OPEN semantics (exact adjacency end==start is allowed)"
    error_id: ERR_BAY_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /delivery-runs"

# =============================================================================
# Table 1.5: API Endpoint Table
# =============================================================================
endpoints:
  # ---- Part (catalog + inventory) ----
  - method: POST
    path: "/parts"
    description: "Create a catalog part"
    roles: [InventoryManager]
    code: 201
    input: ["sku", "description", "list_price_cents", "cost_cents", "core_charge_cents?", "is_rebuildable?", "warranty_days?", "stockable?", "reorder_point?", "reorder_qty?"]
    output: Part
    side_effects: ["on_hand_qty/reserved_qty/available_qty initialized to 0", "status = ACTIVE"]

  - method: GET
    path: "/parts"
    description: "List parts (filterable by sku)"
    roles: [CounterClerk, WholesaleRep, InventoryManager, WarrantyAdmin]
    code: 200
    input: ["sku?", "status?", "limit?", "offset?"]
    output: "Part[]"
    side_effects: []

  - method: GET
    path: "/parts/{id}"
    description: "Get a part"
    roles: [CounterClerk, WholesaleRep, InventoryManager, WarrantyAdmin]
    code: 200
    input: []
    output: Part
    side_effects: []

  - method: POST
    path: "/parts/{id}/receive-stock"
    description: "Ad-hoc stock receipt independent of a reorder request (initial stocking / manual adjustment up)"
    roles: [InventoryManager]
    code: 200
    input: ["qty"]
    output: Part
    side_effects: ["on_hand_qty += qty", "recompute available_qty"]

  - method: POST
    path: "/parts/{id}/discontinue"
    description: "Discontinue a part"
    roles: [InventoryManager]
    code: 200
    input: []
    output: Part
    side_effects: ["status -> DISCONTINUED", "cascade: SUGGESTED/ORDERED ReorderRequests -> CANCELLED"]

  # ---- Vehicle ----
  - method: POST
    path: "/vehicles"
    description: "Create a vehicle application record"
    roles: [InventoryManager]
    code: 201
    input: ["year", "make", "model", "engine?"]
    output: Vehicle
    side_effects: []

  - method: GET
    path: "/vehicles"
    description: "List vehicles (filterable by make/model/year)"
    roles: [CounterClerk, WholesaleRep, InventoryManager, WarrantyAdmin]
    code: 200
    input: ["year?", "make?", "model?", "limit?", "offset?"]
    output: "Vehicle[]"
    side_effects: []

  - method: GET
    path: "/vehicles/{id}"
    description: "Get a vehicle"
    roles: [CounterClerk, WholesaleRep, InventoryManager, WarrantyAdmin]
    code: 200
    input: []
    output: Vehicle
    side_effects: []

  # ---- Fitment (Part <-> Vehicle) ----
  - method: POST
    path: "/fitments"
    description: "Associate a part with a vehicle (fitment/application)"
    roles: [InventoryManager]
    code: 201
    input: ["part_id", "vehicle_id", "position?", "notes?"]
    output: Fitment
    side_effects: []

  - method: GET
    path: "/fitments"
    description: "List fitments; filter by part_id or vehicle_id to resolve fitment lookups in either direction"
    roles: [CounterClerk, WholesaleRep, InventoryManager, WarrantyAdmin]
    code: 200
    input: ["part_id?", "vehicle_id?", "limit?", "offset?"]
    output: "Fitment[]"
    side_effects: []

  - method: GET
    path: "/fitments/{id}"
    description: "Get a fitment"
    roles: [CounterClerk, WholesaleRep, InventoryManager, WarrantyAdmin]
    code: 200
    input: []
    output: Fitment
    side_effects: []

  # ---- CrossReference (Part <-> Part interchange) ----
  - method: POST
    path: "/cross-references"
    description: "Create an interchange edge between two parts"
    roles: [InventoryManager]
    code: 201
    input: ["part_id", "interchange_part_id", "relation?"]
    output: CrossReference
    side_effects: []

  - method: GET
    path: "/cross-references"
    description: "List cross-references; filter by part_id or interchange_part_id"
    roles: [CounterClerk, WholesaleRep, InventoryManager, WarrantyAdmin]
    code: 200
    input: ["part_id?", "interchange_part_id?", "limit?", "offset?"]
    output: "CrossReference[]"
    side_effects: []

  - method: GET
    path: "/cross-references/{id}"
    description: "Get a cross-reference"
    roles: [CounterClerk, WholesaleRep, InventoryManager, WarrantyAdmin]
    code: 200
    input: []
    output: CrossReference
    side_effects: []

  # ---- PriceTier ----
  - method: POST
    path: "/price-tiers"
    description: "Create a price tier in the pricing matrix"
    roles: [InventoryManager]
    code: 201
    input: ["name", "discount_pct", "core_discount_pct?", "min_margin_pct?"]
    output: PriceTier
    side_effects: []

  - method: GET
    path: "/price-tiers"
    description: "List price tiers"
    roles: [CounterClerk, WholesaleRep, InventoryManager, WarrantyAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: "PriceTier[]"
    side_effects: []

  - method: GET
    path: "/price-tiers/{id}"
    description: "Get a price tier"
    roles: [CounterClerk, WholesaleRep, InventoryManager, WarrantyAdmin]
    code: 200
    input: []
    output: PriceTier
    side_effects: []

  # ---- Account ----
  - method: POST
    path: "/accounts"
    description: "Create a retail or wholesale account"
    roles: [InventoryManager, WholesaleRep]
    code: 201
    input: ["name", "account_type", "price_tier_id", "credit_limit_cents?"]
    output: Account
    side_effects: ["ar_balance_cents initialized to 0", "status = ACTIVE"]

  - method: GET
    path: "/accounts"
    description: "List accounts; filter by price_tier_id"
    roles: [CounterClerk, WholesaleRep, InventoryManager, WarrantyAdmin]
    code: 200
    input: ["price_tier_id?", "account_type?", "limit?", "offset?"]
    output: "Account[]"
    side_effects: []

  - method: GET
    path: "/accounts/{id}"
    description: "Get an account (includes ar_balance_cents)"
    roles: [CounterClerk, WholesaleRep, InventoryManager, WarrantyAdmin]
    code: 200
    input: []
    output: Account
    side_effects: []

  - method: POST
    path: "/accounts/{id}/hold"
    description: "Place an account ON_HOLD (blocks new orders)"
    roles: [WholesaleRep, InventoryManager]
    code: 200
    input: []
    output: Account
    side_effects: ["status -> ON_HOLD"]

  - method: POST
    path: "/accounts/{id}/reinstate"
    description: "Return an ON_HOLD account to ACTIVE"
    roles: [WholesaleRep, InventoryManager]
    code: 200
    input: []
    output: Account
    side_effects: ["status -> ACTIVE"]

  # ---- SalesOrder ----
  - method: POST
    path: "/sales-orders"
    description: "Open a sales order for an account"
    roles: [CounterClerk, WholesaleRep]
    code: 201
    input: ["account_id", "channel", "hotshot_requested?"]
    output: SalesOrder
    side_effects: ["fulfillment_status = OPEN", "settlement_status = UNBILLED", "subtotals/total = 0"]

  - method: GET
    path: "/sales-orders"
    description: "List sales orders; filter by account_id"
    roles: [CounterClerk, WholesaleRep, InventoryManager, WarrantyAdmin]
    code: 200
    input: ["account_id?", "fulfillment_status?", "settlement_status?", "limit?", "offset?"]
    output: "SalesOrder[]"
    side_effects: []

  - method: GET
    path: "/sales-orders/{id}"
    description: "Get a sales order with computed totals"
    roles: [CounterClerk, WholesaleRep, InventoryManager, WarrantyAdmin]
    code: 200
    input: []
    output: SalesOrder
    side_effects: []

  - method: POST
    path: "/sales-orders/{id}/allocate"
    description: "Reserve stock for stock lines, price special-order/hotshot, lock order"
    roles: [CounterClerk, WholesaleRep]
    code: 200
    input: ["expected_sales_order_version"]
    output: SalesOrder
    side_effects: ["reserve stock for non-special lines (cascade may auto-suggest reorder)", "compute hotshot_fee_cents", "recompute totals", "fulfillment_status -> ALLOCATED", "increments SalesOrder.version by 1"]

  - method: POST
    path: "/sales-orders/{id}/ship"
    description: "Ship an allocated order; deduct on-hand; open core obligations"
    roles: [CounterClerk, WholesaleRep]
    code: 200
    input: ["expected_sales_order_version"]
    output: SalesOrder
    side_effects: ["on_hand_qty -= qty and release reservation per line (cascade may auto-suggest reorder)", "set cores_outstanding for rebuildable lines", "fulfillment_status -> SHIPPED", "increments SalesOrder.version by 1"]

  - method: POST
    path: "/sales-orders/{id}/cancel"
    description: "Cancel an OPEN or ALLOCATED order (releases reservations on ALLOCATED)"
    roles: [CounterClerk, WholesaleRep]
    code: 200
    input: []
    output: SalesOrder
    side_effects: ["release reservations if ALLOCATED", "all lines -> CANCELLED", "fulfillment_status -> CANCELLED"]

  - method: POST
    path: "/sales-orders/{id}/invoice"
    description: "Invoice a shipped order; charge account A/R"
    roles: [CounterClerk, WholesaleRep]
    code: 200
    input: []
    output: SalesOrder
    side_effects: ["Account.ar_balance_cents += order_total_cents", "settlement_status -> INVOICED"]

  - method: POST
    path: "/sales-orders/{id}/pay"
    description: "Record payment of an invoiced order; relieve A/R"
    roles: [CounterClerk, WholesaleRep]
    code: 200
    input: []
    output: SalesOrder
    side_effects: ["Account.ar_balance_cents -= order_total_cents (clamp 0)", "settlement_status -> PAID"]

  # ---- OrderLine ----
  - method: POST
    path: "/order-lines"
    description: "Add a line to an OPEN order; prices it via the tier matrix and pins the tier snapshot"
    roles: [CounterClerk, WholesaleRep]
    code: 201
    input: ["order_id", "part_id", "qty"]
    output: OrderLine
    side_effects: ["snapshot price_tier_id from account", "compute net unit/line pricing (line_net_pricing)", "set is_special_order", "recompute order rollup", "increments SalesOrder.version by 1"]

  - method: GET
    path: "/order-lines"
    description: "List order lines; filter by order_id, part_id, or price_tier_id"
    roles: [CounterClerk, WholesaleRep, InventoryManager, WarrantyAdmin]
    code: 200
    input: ["order_id?", "part_id?", "price_tier_id?", "limit?", "offset?"]
    output: "OrderLine[]"
    side_effects: []

  - method: GET
    path: "/order-lines/{id}"
    description: "Get an order line"
    roles: [CounterClerk, WholesaleRep, InventoryManager, WarrantyAdmin]
    code: 200
    input: []
    output: OrderLine
    side_effects: []

  # ---- CoreReturn ----
  - method: POST
    path: "/core-returns"
    description: "Open a core return against a shipped rebuildable line"
    roles: [CounterClerk, WholesaleRep, WarrantyAdmin]
    code: 201
    input: ["order_line_id", "qty"]
    output: CoreReturn
    side_effects: ["compute refund_cents (core_refund)", "status = PENDING_INSPECTION"]

  - method: GET
    path: "/core-returns"
    description: "List core returns; filter by order_line_id"
    roles: [CounterClerk, WholesaleRep, InventoryManager, WarrantyAdmin]
    code: 200
    input: ["order_line_id?", "status?", "limit?", "offset?"]
    output: "CoreReturn[]"
    side_effects: []

  - method: GET
    path: "/core-returns/{id}"
    description: "Get a core return"
    roles: [CounterClerk, WholesaleRep, InventoryManager, WarrantyAdmin]
    code: 200
    input: []
    output: CoreReturn
    side_effects: []

  - method: POST
    path: "/core-returns/{id}/accept"
    description: "Inspect and accept a core; refund the deposit"
    roles: [WarrantyAdmin]
    code: 200
    input: []
    output: CoreReturn
    side_effects: ["OrderLine.cores_outstanding -= qty (cascade)", "Account.ar_balance_cents -= refund_cents (clamp 0)", "status -> ACCEPTED"]

  - method: POST
    path: "/core-returns/{id}/reject"
    description: "Reject a core; no refund"
    roles: [WarrantyAdmin]
    code: 200
    input: []
    output: CoreReturn
    side_effects: ["status -> REJECTED"]

  # ---- WarrantyClaim ----
  - method: POST
    path: "/warranty-claims"
    description: "File a warranty/defective claim against a shipped line"
    roles: [CounterClerk, WholesaleRep, WarrantyAdmin]
    code: 201
    input: ["order_line_id", "qty", "reason", "resolution?", "restock_defective?"]
    output: WarrantyClaim
    side_effects: ["status = SUBMITTED"]

  - method: GET
    path: "/warranty-claims"
    description: "List warranty claims; filter by order_line_id"
    roles: [CounterClerk, WholesaleRep, InventoryManager, WarrantyAdmin]
    code: 200
    input: ["order_line_id?", "status?", "limit?", "offset?"]
    output: "WarrantyClaim[]"
    side_effects: []

  - method: GET
    path: "/warranty-claims/{id}"
    description: "Get a warranty claim"
    roles: [CounterClerk, WholesaleRep, InventoryManager, WarrantyAdmin]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: []

  - method: POST
    path: "/warranty-claims/{id}/start-review"
    description: "Move a claim into review"
    roles: [WarrantyAdmin]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: ["status -> UNDER_REVIEW"]

  - method: POST
    path: "/warranty-claims/{id}/approve"
    description: "Approve a claim under review; issue credit and/or replacement"
    roles: [WarrantyAdmin]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: ["compute credit_cents (warranty_credit)", "REFUND: Account.ar_balance_cents -= credit_cents (clamp 0)", "REPLACE: Part.on_hand_qty -= qty (cascade may auto-suggest reorder)", "restock_defective: Part.on_hand_qty += qty", "status -> APPROVED"]

  - method: POST
    path: "/warranty-claims/{id}/deny"
    description: "Deny a claim (from SUBMITTED or UNDER_REVIEW)"
    roles: [WarrantyAdmin]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: ["status -> DENIED"]

  # ---- ReorderRequest ----
  - method: POST
    path: "/reorder-requests"
    description: "Manually create a reorder request for a part (qty snapshotted from Part.reorder_qty)"
    roles: [InventoryManager]
    code: 201
    input: ["part_id"]
    output: ReorderRequest
    side_effects: ["qty_ordered = Part.reorder_qty", "status = SUGGESTED"]

  - method: GET
    path: "/reorder-requests"
    description: "List reorder requests; filter by part_id or status"
    roles: [CounterClerk, WholesaleRep, InventoryManager, WarrantyAdmin]
    code: 200
    input: ["part_id?", "status?", "limit?", "offset?"]
    output: "ReorderRequest[]"
    side_effects: []

  - method: GET
    path: "/reorder-requests/{id}"
    description: "Get a reorder request"
    roles: [CounterClerk, WholesaleRep, InventoryManager, WarrantyAdmin]
    code: 200
    input: []
    output: ReorderRequest
    side_effects: []

  - method: POST
    path: "/reorder-requests/{id}/place"
    description: "Place a suggested reorder with the supplier"
    roles: [InventoryManager]
    code: 200
    input: []
    output: ReorderRequest
    side_effects: ["status -> ORDERED"]

  - method: POST
    path: "/reorder-requests/{id}/receive"
    description: "Receive units against an ordered/partially-received reorder"
    roles: [InventoryManager]
    code: 200
    input: ["receive_qty"]
    output: ReorderRequest
    side_effects: ["Part.on_hand_qty += receive_qty (cascade recompute available)", "qty_received += receive_qty", "status -> PARTIALLY_RECEIVED or RECEIVED"]

  - method: POST
    path: "/reorder-requests/{id}/cancel"
    description: "Cancel a suggested/ordered reorder"
    roles: [InventoryManager]
    code: 200
    input: []
    output: ReorderRequest
    side_effects: ["status -> CANCELLED"]

  # ---- Driver ----
  - method: POST
    path: "/drivers"
    description: "Create a hotshot delivery driver"
    roles: [InventoryManager, CounterClerk, WholesaleRep]
    code: 201
    input: ["name", "turnaround_min?"]
    output: Driver
    side_effects: []

  - method: GET
    path: "/drivers"
    description: "List drivers"
    roles: [CounterClerk, WholesaleRep, InventoryManager, WarrantyAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: "Driver[]"
    side_effects: []

  - method: GET
    path: "/drivers/{id}"
    description: "Get a driver"
    roles: [CounterClerk, WholesaleRep, InventoryManager, WarrantyAdmin]
    code: 200
    input: []
    output: Driver
    side_effects: []

  # ---- Bay ----
  - method: POST
    path: "/bays"
    description: "Create a loading bay"
    roles: [InventoryManager, CounterClerk, WholesaleRep]
    code: 201
    input: ["code"]
    output: Bay
    side_effects: []

  - method: GET
    path: "/bays"
    description: "List bays"
    roles: [CounterClerk, WholesaleRep, InventoryManager, WarrantyAdmin]
    code: 200
    input: ["limit?", "offset?"]
    output: "Bay[]"
    side_effects: []

  - method: GET
    path: "/bays/{id}"
    description: "Get a bay"
    roles: [CounterClerk, WholesaleRep, InventoryManager, WarrantyAdmin]
    code: 200
    input: []
    output: Bay
    side_effects: []

  # ---- DeliveryRun (hotshot scheduling) ----
  - method: POST
    path: "/delivery-runs"
    description: "Schedule a hotshot delivery run on a driver+bay window; enforces overlap rules"
    roles: [CounterClerk, WholesaleRep]
    code: 201
    input: ["order_id", "driver_id", "bay_id", "window_start_min", "window_end_min"]
    output: DeliveryRun
    side_effects: ["driver buffered-overlap check", "bay half-open-overlap check", "status = SCHEDULED"]

  - method: GET
    path: "/delivery-runs"
    description: "List delivery runs; filter by order_id, driver_id, or bay_id"
    roles: [CounterClerk, WholesaleRep, InventoryManager, WarrantyAdmin]
    code: 200
    input: ["order_id?", "driver_id?", "bay_id?", "status?", "limit?", "offset?"]
    output: "DeliveryRun[]"
    side_effects: []

  - method: GET
    path: "/delivery-runs/{id}"
    description: "Get a delivery run"
    roles: [CounterClerk, WholesaleRep, InventoryManager, WarrantyAdmin]
    code: 200
    input: []
    output: DeliveryRun
    side_effects: []

  - method: POST
    path: "/delivery-runs/{id}/dispatch"
    description: "Dispatch a scheduled run"
    roles: [CounterClerk, WholesaleRep]
    code: 200
    input: []
    output: DeliveryRun
    side_effects: ["status -> DISPATCHED"]

  - method: POST
    path: "/delivery-runs/{id}/complete"
    description: "Mark a dispatched run delivered"
    roles: [CounterClerk, WholesaleRep]
    code: 200
    input: []
    output: DeliveryRun
    side_effects: ["status -> DELIVERED"]

  - method: POST
    path: "/delivery-runs/{id}/cancel"
    description: "Cancel a scheduled/dispatched run; frees driver+bay windows"
    roles: [CounterClerk, WholesaleRep]
    code: 200
    input: []
    output: DeliveryRun
    side_effects: ["status -> CANCELLED"]

# =============================================================================
# Table 1.6: Error Code Catalog
# =============================================================================
errors:
  # --- Auth ---
  - id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http: 401
    condition: "X-User-ID or X-User-Role header missing or malformed"
  - id: ERR_INSUFFICIENT_PERMISSIONS
    http: 403
    condition: "Role not permitted for this operation"

  # --- Input ---
  - id: ERR_INVALID_REQUEST
    http: 422
    condition: "Missing/invalid body field, bad enum, out-of-range numeric, qty<1, percentage out of range, or year out of 1900-2100"
  - id: ERR_DUPLICATE_SKU
    http: 409
    condition: "Part.sku already exists"
  - id: ERR_CORE_CHARGE_INCONSISTENT
    http: 422
    condition: "is_rebuildable true with core_charge_cents 0, or is_rebuildable false with core_charge_cents > 0"

  # --- Not found ---
  - id: ERR_PART_NOT_FOUND
    http: 404
    condition: "Part id does not exist"
  - id: ERR_VEHICLE_NOT_FOUND
    http: 404
    condition: "Vehicle id does not exist"
  - id: ERR_FITMENT_NOT_FOUND
    http: 404
    condition: "Fitment id does not exist"
  - id: ERR_CROSS_REFERENCE_NOT_FOUND
    http: 404
    condition: "CrossReference id does not exist"
  - id: ERR_PRICE_TIER_NOT_FOUND
    http: 404
    condition: "PriceTier id does not exist"
  - id: ERR_ACCOUNT_NOT_FOUND
    http: 404
    condition: "Account id does not exist"
  - id: ERR_SALES_ORDER_NOT_FOUND
    http: 404
    condition: "SalesOrder id does not exist"
  - id: ERR_ORDER_LINE_NOT_FOUND
    http: 404
    condition: "OrderLine id does not exist"
  - id: ERR_CORE_RETURN_NOT_FOUND
    http: 404
    condition: "CoreReturn id does not exist"
  - id: ERR_WARRANTY_CLAIM_NOT_FOUND
    http: 404
    condition: "WarrantyClaim id does not exist"
  - id: ERR_REORDER_REQUEST_NOT_FOUND
    http: 404
    condition: "ReorderRequest id does not exist"
  - id: ERR_DRIVER_NOT_FOUND
    http: 404
    condition: "Driver id does not exist"
  - id: ERR_BAY_NOT_FOUND
    http: 404
    condition: "Bay id does not exist"
  - id: ERR_DELIVERY_RUN_NOT_FOUND
    http: 404
    condition: "DeliveryRun id does not exist"

  # --- Referential / config ---
  - id: ERR_CHANNEL_ACCOUNT_MISMATCH
    http: 409
    condition: "SalesOrder.channel does not match Account.account_type"
  - id: ERR_PART_DISCONTINUED
    http: 409
    condition: "Operation references a DISCONTINUED part (new line or reorder place)"

  # --- State: order ---
  - id: ERR_ORDER_NOT_OPEN
    http: 409
    condition: "OrderLine create requires order fulfillment_status OPEN"
  - id: ERR_EMPTY_ORDER
    http: 409
    condition: "Allocate requires at least one order line"
  - id: ERR_ACCOUNT_ON_HOLD
    http: 409
    condition: "Allocate requires the account to be ACTIVE"
  - id: ERR_INVALID_FULFILLMENT_STATE
    http: 409
    condition: "Order not in the required fulfillment_status for this transition"
  - id: ERR_SPECIAL_ORDER_NOT_READY
    http: 409
    condition: "Ship blocked: a special-order line has no received stock to fulfill"
  - id: ERR_ORDER_ALREADY_INVOICED
    http: 409
    condition: "Cancel blocked: order already INVOICED"
  - id: ERR_INSUFFICIENT_STOCK
    http: 409
    condition: "Allocate: a non-special line's available_qty < line.qty"

  # --- State: settlement / fiscal ---
  - id: ERR_NOT_SHIPPED
    http: 409
    condition: "Invoice requires fulfillment_status SHIPPED"
  - id: ERR_ALREADY_INVOICED
    http: 409
    condition: "Invoice requires settlement_status UNBILLED"
  - id: ERR_NOT_INVOICED
    http: 409
    condition: "Pay requires settlement_status INVOICED"
  - id: ERR_CREDIT_LIMIT_EXCEEDED
    http: 402
    condition: "Invoice would push WHOLESALE account A/R above credit_limit_cents"

  # --- State: core return ---
  - id: ERR_CORE_RETURN_NOT_PENDING
    http: 409
    condition: "Accept/reject requires CoreReturn PENDING_INSPECTION"
  - id: ERR_CORE_RETURN_LINE_NOT_SHIPPED
    http: 409
    condition: "Core return references a line that is not SHIPPED"
  - id: ERR_CORE_EXCEEDS_OUTSTANDING
    http: 409
    condition: "CoreReturn.qty exceeds the line's cores_outstanding"

  # --- State: warranty ---
  - id: ERR_CLAIM_NOT_SUBMITTED
    http: 409
    condition: "start-review requires claim SUBMITTED"
  - id: ERR_CLAIM_NOT_UNDER_REVIEW
    http: 409
    condition: "approve requires claim UNDER_REVIEW"
  - id: ERR_CLAIM_NOT_OPEN
    http: 409
    condition: "deny requires claim SUBMITTED or UNDER_REVIEW"
  - id: ERR_CLAIM_QTY_EXCEEDS_LINE
    http: 409
    condition: "WarrantyClaim.qty exceeds the line's qty"
  - id: ERR_WARRANTY_EXPIRED
    http: 409
    condition: "Claim approve outside the part's warranty window"
  - id: ERR_CLAIM_LINE_NOT_SHIPPED
    http: 409
    condition: "Warranty claim references a line that is not SHIPPED"

  # --- State: reorder / part ---
  - id: ERR_REORDER_NOT_SUGGESTED
    http: 409
    condition: "place requires ReorderRequest SUGGESTED"
  - id: ERR_REORDER_NOT_RECEIVABLE
    http: 409
    condition: "receive requires ReorderRequest ORDERED or PARTIALLY_RECEIVED"
  - id: ERR_REORDER_NOT_CANCELLABLE
    http: 409
    condition: "cancel requires ReorderRequest SUGGESTED or ORDERED"
  - id: ERR_INVALID_RECEIVE_QTY
    http: 409
    condition: "receive_qty<1 or qty_received+receive_qty>qty_ordered"
  - id: ERR_PART_ALREADY_DISCONTINUED
    http: 409
    condition: "discontinue requires Part ACTIVE"
  - id: ERR_PART_HAS_RESERVATIONS
    http: 409
    condition: "discontinue blocked: Part.reserved_qty > 0"

  # --- Bay / delivery scheduling ---
  - id: ERR_DUPLICATE_BAY_CODE
    http: 409
    condition: "Bay.code already exists"
  - id: ERR_DRIVER_WINDOW_CONFLICT
    http: 409
    condition: "DeliveryRun collides with an existing run on the same driver under buffered semantics"
  - id: ERR_BAY_WINDOW_CONFLICT
    http: 409
    condition: "DeliveryRun positively overlaps an existing run on the same bay (half-open)"
  - id: ERR_RUN_NOT_SCHEDULED
    http: 409
    condition: "dispatch requires DeliveryRun SCHEDULED"
  - id: ERR_RUN_NOT_DISPATCHED
    http: 409
    condition: "complete requires DeliveryRun DISPATCHED"
  - id: ERR_RUN_NOT_CANCELLABLE
    http: 409
    condition: "cancel requires DeliveryRun SCHEDULED or DISPATCHED"
  - id: ERR_RUN_ORDER_NOT_READY
    http: 409
    condition: "dispatch requires the referenced order to be ALLOCATED or SHIPPED"

  # --- Concurrency ---
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_sales_order_version does not match SalesOrder.version"

# =============================================================================
# Table 1.7: RBAC Matrix
# =============================================================================
roles:
  - name: CounterClerk
    description: "Retail counter staff: walk-in sales orders, lines, fulfillment, intake of returns/claims"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "POST /sales-orders — open order (COUNTER channel)"
      - "POST /order-lines — add line"
      - "POST /sales-orders/{id}/allocate — allocate"
      - "POST /sales-orders/{id}/ship — ship"
      - "POST /sales-orders/{id}/cancel — cancel"
      - "POST /sales-orders/{id}/invoice — invoice"
      - "POST /sales-orders/{id}/pay — pay"
      - "POST /core-returns — open core return"
      - "POST /warranty-claims — file claim"
      - "POST /drivers — create driver"
      - "POST /bays — create bay"
      - "POST /delivery-runs — schedule run"
      - "POST /delivery-runs/{id}/dispatch — dispatch run"
      - "POST /delivery-runs/{id}/complete — complete run"
      - "POST /delivery-runs/{id}/cancel — cancel run"
      - "GET (all read endpoints)"

  - name: WholesaleRep
    description: "Wholesale/trade desk: account sales orders, account credit lifecycle"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "POST /accounts — create account"
      - "POST /accounts/{id}/hold — hold account"
      - "POST /accounts/{id}/reinstate — reinstate account"
      - "POST /sales-orders — open order (WHOLESALE channel)"
      - "POST /order-lines — add line"
      - "POST /sales-orders/{id}/allocate — allocate"
      - "POST /sales-orders/{id}/ship — ship"
      - "POST /sales-orders/{id}/cancel — cancel"
      - "POST /sales-orders/{id}/invoice — invoice"
      - "POST /sales-orders/{id}/pay — pay"
      - "POST /core-returns — open core return"
      - "POST /warranty-claims — file claim"
      - "POST /drivers — create driver"
      - "POST /bays — create bay"
      - "POST /delivery-runs — schedule run"
      - "POST /delivery-runs/{id}/dispatch — dispatch run"
      - "POST /delivery-runs/{id}/complete — complete run"
      - "POST /delivery-runs/{id}/cancel — cancel run"
      - "GET (all read endpoints)"

  - name: InventoryManager
    description: "Catalog, fitment, cross-reference, pricing tiers, parts, stock, and reorder lifecycle"
    identity: opaque
    exclusive_operations:
      - "POST /parts — create part"
      - "POST /parts/{id}/receive-stock — receive ad-hoc stock"
      - "POST /parts/{id}/discontinue — discontinue part"
      - "POST /vehicles — create vehicle"
      - "POST /fitments — create fitment"
      - "POST /cross-references — create cross-reference"
      - "POST /price-tiers — create price tier"
      - "POST /reorder-requests — create reorder request"
      - "POST /reorder-requests/{id}/place — place reorder"
      - "POST /reorder-requests/{id}/receive — receive reorder"
      - "POST /reorder-requests/{id}/cancel — cancel reorder"
    shared_operations:
      - "POST /accounts — create account"
      - "POST /accounts/{id}/hold — hold account"
      - "POST /accounts/{id}/reinstate — reinstate account"
      - "POST /drivers — create driver"
      - "POST /bays — create bay"
      - "GET (all read endpoints)"

  - name: WarrantyAdmin
    description: "Adjudicates core returns and warranty/defective claims"
    identity: opaque
    exclusive_operations:
      - "POST /core-returns/{id}/accept — accept core"
      - "POST /core-returns/{id}/reject — reject core"
      - "POST /warranty-claims/{id}/start-review — start review"
      - "POST /warranty-claims/{id}/approve — approve claim"
      - "POST /warranty-claims/{id}/deny — deny claim"
    shared_operations:
      - "POST /core-returns — open core return"
      - "POST /warranty-claims — file claim"
      - "GET (all read endpoints)"
