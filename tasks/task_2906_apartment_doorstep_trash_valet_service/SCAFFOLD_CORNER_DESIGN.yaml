              as: BillingAnalyst
              as_user_id: "analyst-drafter"
          assert:
            - "HTTP 412 with error_id == 'ERR_STALE_CONTRACT_VERSION'"
            - "GET /valet/statements?contract_id=${contract_id} returns total_count 0"
            - "ServiceContract.${contract_id}.version is unchanged by the rejected write and last_invoiced_period is still null"

      - name: version_increments_on_every_write_and_never_on_a_read
        claim_type: optimistic_concurrency
        grounds:
          - entities.Property.fields.version
          - entities.ServiceContract.fields.version
        distinguishing_aspect: "The Property version advances when the contract activation bubbles up to it, and two consecutive GETs return the same version — reads are not writes, and a bubbled side effect is."
        test_recipe:
          setup:
            - "Property 'Cedar Ridge' unit_count 4 with one DRAFT contract, versions captured at creation"
          setup_api_calls:
            - call: "POST /valet/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /valet/properties"
              payload: { name: "Cedar Ridge", unit_count: 4, market_code: "ATL" }
              as: PlatformAdmin
              captures: { prop_id: $.data.id, prop_v0: $.data.version }
            - call: "POST /valet/properties/${prop_id}/contracts"
              payload: { per_unit_monthly_fee_cents: 3495, property_revenue_share_bps: 1500, service_night_days: ["SUN", "MON", "TUE", "WED", "THU"], effective_from: "2026-09-01", effective_to: "2027-08-31", sla_missed_threshold_bps: 1000 }
              as: BillingAnalyst
              as_user_id: "analyst-drafter"
              captures: { contract_id: $.data.id, contract_v0: $.data.version }
            - call: "GET /valet/properties/${prop_id}"
              payload: {}
              as: PlatformAdmin
          trigger:
            - call: "POST /valet/contracts/${contract_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "GET /valet/properties/${prop_id}"
              payload: {}
              as: PlatformAdmin
            - call: "GET /valet/properties/${prop_id}"
              payload: {}
              as: PlatformAdmin
          assert:
            - "the setup GET returns version == ${prop_v0} — creating a child contract did not bump the parent property"
            - "after activation Property.${prop_id}.version == ${prop_v0} + 1 and ServiceContract.${contract_id}.version == ${contract_v0} + 1"
            - "the two trigger GETs return the identical version, and neither changes status or active_contract_id"

      - name: escalation_cascade_reaches_the_nights_and_their_routes
        claim_type: cascading_side_effects
        grounds:
          - state_machines.Property.ACTIVE_to_SUSPENDED
          - calculations.property_escalation_rollup
        excluded_because:
          difficulty_instance: transitive_cascade / second_escalation_suspends_property_and_cancels_nights_then_routes
          rationale: "That §1.8 instance asserts the full property -> nights -> routes chain and its ordering in a single escalate request."

      - name: both_statement_variants_produce_their_own_numbers
        claim_type: dual_variant_calculation
        grounds:
          - calculations.statement_settlement
        excluded_because:
          difficulty_instance: dual_variant_calc / statement_provisional_vs_final_diverge_on_gross_basis
          rationale: "That §1.8 instance records the PROVISIONAL numbers and the FINAL numbers for the same period and asserts the delta."

      - name: delinquency_threshold_fires_at_its_cumulative_boundary
        claim_type: rate_threshold_triggers
        grounds:
          - calculations.resident_delinquency_rollup.constants.DELINQUENCY_THRESHOLD_CENTS
        excluded_because:
          difficulty_instance: transitive_cascade / contamination_scan_cascades_through_fine_to_property_delinquency_rollup
          rationale: "That §1.8 instance drives fines_outstanding_cents onto the threshold and asserts the resident and property rollups that flip with it."

  - section: consistency_model
    instances:

      - name: derived_resident_and_property_totals_are_visible_in_the_same_response
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - calculations.resident_delinquency_rollup
          - entities.Property.fields.pending_fine_revenue_cents
        distinguishing_aspect: "The AUTO fine cascade fired by one scan request is fully visible without any second write: the scan response already shows tag_status FINED, and reads issued immediately afterwards show the resident and property rollups at their new values — no lag, no reconciliation step."
        test_recipe:
          setup:
            - "Property 'Cedar Ridge' unit_count 4 with resident 101, contract ACTIVE"
            - "Night 2026-09-01 with an ACCEPTED route over 101-104 and no scans yet"
          setup_api_calls:
            - call: "POST /valet/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T19:00:00Z" }
              as: PlatformAdmin
            - call: "POST /valet/properties"
              payload: { name: "Cedar Ridge", unit_count: 4, market_code: "ATL" }
              as: PlatformAdmin
              captures: { prop_id: $.data.id }
            - call: "POST /valet/properties/${prop_id}/contracts"
              payload: { per_unit_monthly_fee_cents: 3495, property_revenue_share_bps: 1500, service_night_days: ["SUN", "MON", "TUE", "WED", "THU"], effective_from: "2026-09-01", effective_to: "2027-08-31", sla_missed_threshold_bps: 1000 }
              as: BillingAnalyst
              as_user_id: "analyst-drafter"
              captures: { contract_id: $.data.id }
            - call: "POST /valet/properties/${prop_id}/residents"
              payload: { unit_number: 101, full_name: "Rosa One", move_in_date: "2026-08-01" }
              as: PlatformAdmin
              captures: { r1_id: $.data.id }
            - call: "POST /valet/contracts/${contract_id}/activate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /valet/contractors"
              payload: { legal_name: "Val Ito", equipment_provided_by_company: true, sets_own_schedule: true, works_exclusively: false, weekly_committed_hours: 20 }
              as: ValetOpsManager
              captures: { ct_id: $.data.id }
            - call: "POST /valet/contractors/${ct_id}/documents"
              payload: { tax_form_type: "W9", direct_deposit_on_file: true }
              as: ValetOpsManager
            - call: "POST /valet/contractors/${ct_id}/background-check"
              payload: { result: "CLEAR" }
              as: ComplianceOfficer
              as_user_id: "co-screener"
            - call: "POST /valet/contractors/${ct_id}/classification"
              payload: { basis: "DECLARED" }
              as: ComplianceOfficer
              as_user_id: "co-screener"
            - call: "POST /valet/contracts/${contract_id}/service-nights"
              payload: { service_date: "2026-09-01", service_window_start: "2026-09-01T18:00:00.000Z", service_window_end: "2026-09-01T22:00:00.000Z" }
              as: ValetOpsManager
              captures: { n1_id: $.data.id, n1_v: $.data.version }
            - call: "POST /valet/service-nights/${n1_id}/route-assignments"
              payload: { contractor_id: "${ct_id}", unit_from: 101, unit_to: 104, expected_service_night_version: "${n1_v}" }
              as: ValetOpsManager
              captures: { rt1_id: $.data.id }
            - call: "POST /valet/route-assignments/${rt1_id}/accept"
              payload: {}
              as: Valet
              as_user_id: "${ct_id}"
          trigger:
            - call: "POST /valet/route-assignments/${rt1_id}/scans"
              payload: { resident_id: "${r1_id}", scan_result: "TAGGED_NOT_SERVICED", container_type: "RECYCLING_BIN", non_compliance_type: "RECYCLING_CONTAMINATION" }
              as: Valet
              as_user_id: "${ct_id}"
              captures: { sc1_id: $.data.id }
            - call: "GET /valet/residents/${r1_id}"
              payload: {}
              as: PropertyManager
              as_user_id: "${prop_id}"
            - call: "GET /valet/properties/${prop_id}"
              payload: {}
              as: PropertyManager
              as_user_id: "${prop_id}"
          assert:
            - "the scan response is HTTP 201 with ServiceScan.${sc1_id}.tag_status == 'FINED' and offense_ordinal == 1 — the AUTO cascade is inside the same request"
            - "GET /valet/resident-fines?scan_id=${sc1_id} returns total_count 1 with amount_cents == 2500 and origin 'AUTO'"
            - "the resident read shows fines_outstanding_cents == 2500, fines_assessed_this_period_cents == 2500, collections_status 'CURRENT'"
            - "the property read shows pending_fine_revenue_cents == 2500 and delinquent_resident_count == 0 — both derived totals already reconcile"
