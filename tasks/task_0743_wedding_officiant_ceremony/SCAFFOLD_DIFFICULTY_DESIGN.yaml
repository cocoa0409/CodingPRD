# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Wedding-Officiant & Ceremony Service — EXPERT
# 9 Difficulty Rules × 2 instances = 18 instances
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: cancellation_settlement_couple_vs_service
        grounds:
          - calculations.cancellation_settlement
          - entities.Booking.fields.refund_issued_cents
          - entities.Booking.fields.forfeit_retained_cents
        distinguishing_aspect: |
          cancellation_settlement runs on the Booking domain: two identical CONFIRMED bookings with
          deposit_captured_cents=83190 diverge — couple_initiated at 60 days refunds 41595 (forfeit 41595)
          while service_initiated refunds the full 83190 plus 23500 goodwill = 106690.
        test_recipe:
          setup:
            - "Officiant ACTIVE (CIVIL, offers SECULAR, certified CA); one Couple; CLASSIC package base 200000, deposit_pct 0.30; CA venue"
            - "Two bookings B1 (ceremony 2026-09-01) and B2 (ceremony 2026-09-08), each dist 100km + UNITY_CANDLE add-on -> deposit_due 83190, both CONFIRMED"
            - "Clock advanced to 2026-07-03T15:00:00Z (B1 is 60 days out -> couple tier 50%)"
          setup_api_calls:
            - call: "POST /officiants"
              payload: { full_name: "Ava Reed", email: "ava@x.com", styles: ["SECULAR"], denomination: "CIVIL", certified_jurisdictions: ["CA"], max_active_holds: 5, travel_buffer_minutes: 180 }
              as: Coordinator
              captures: { off_id: $.data.id }
            - call: "POST /officiants/${off_id}/transition"
              payload: { to_state: "ACTIVE" }
              as: Coordinator
              captures: { off_v: $.data.version }
            - call: "POST /couples"
              payload: { partner_one_name: "Kai", partner_two_name: "Sam", email: "ks@x.com", phone: "555-0100" }
              as: Coordinator
              captures: { cp_id: $.data.id }
            - call: "POST /packages"
              payload: { name: "Classic", tier: "CLASSIC", base_price_cents: 200000, deposit_pct: 0.30 }
              as: Coordinator
              captures: { pkg_id: $.data.id }
            - call: "POST /venues"
              payload: { name: "Rose Garden", jurisdiction: "CA", address: "1 Main St" }
              as: Coordinator
              captures: { ven_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: Coordinator
            - call: "POST /bookings"
              payload: { officiant_id: "${off_id}", couple_id: "${cp_id}", package_id: "${pkg_id}", venue_id: "${ven_id}", ceremony_start: "2026-09-01T15:00:00Z", ceremony_end: "2026-09-01T16:00:00Z", travel_distance_km: 100, required_style: "SECULAR", addon_codes: ["UNITY_CANDLE"] }
              as: Couple
              as_user_id: "${cp_id}"
              captures: { b1_id: $.data.id, dep1: $.data.deposit_due_cents }
            - call: "POST /date-holds"
              payload: { booking_id: "${b1_id}", expected_officiant_version: "${off_v}" }
              as: Couple
              as_user_id: "${cp_id}"
              captures: { hold1_id: $.data.id }
            - call: "GET /officiants/${off_id}"
              payload: {}
              as: Coordinator
              captures: { off_v2: $.data.version }
            - call: "POST /bookings"
              payload: { officiant_id: "${off_id}", couple_id: "${cp_id}", package_id: "${pkg_id}", venue_id: "${ven_id}", ceremony_start: "2026-09-08T15:00:00Z", ceremony_end: "2026-09-08T16:00:00Z", travel_distance_km: 100, required_style: "SECULAR", addon_codes: ["UNITY_CANDLE"] }
              as: Couple
              as_user_id: "${cp_id}"
              captures: { b2_id: $.data.id }
            - call: "POST /date-holds"
              payload: { booking_id: "${b2_id}", expected_officiant_version: "${off_v2}" }
              as: Couple
              as_user_id: "${cp_id}"
            - call: "POST /bookings/${b1_id}/confirm"
              payload: { deposit_amount_cents: 83190 }
              as: Couple
              as_user_id: "${cp_id}"
            - call: "POST /bookings/${b2_id}/confirm"
              payload: { deposit_amount_cents: 83190 }
              as: Couple
              as_user_id: "${cp_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-03T15:00:00Z" }
              as: Coordinator
          trigger:
            - call: "POST /bookings/${b1_id}/cancel"
              payload: { cancel_reason: "COUPLE_REQUEST" }
              as: Couple
              as_user_id: "${cp_id}"
              captures: { r1: $.data.refund_issued_cents, f1: $.data.forfeit_retained_cents }
            - call: "POST /bookings/${b2_id}/cancel"
              payload: { cancel_reason: "OTHER" }
              as: Coordinator
              captures: { r2: $.data.refund_issued_cents, f2: $.data.forfeit_retained_cents }
          assert:
            - "Booking.${b1_id}.refund_issued_cents == 41595"
            - "Booking.${b1_id}.forfeit_retained_cents == 41595"
            - "Booking.${b1_id}.cancel_initiator == COUPLE"
            - "Booking.${b2_id}.refund_issued_cents == 106690"
            - "Booking.${b2_id}.forfeit_retained_cents == 0"
            - "Booking.${b2_id}.cancel_initiator == SERVICE"

      - name: officiant_reputation_displayed_vs_internal
        grounds:
          - calculations.officiant_reputation
          - entities.Officiant.fields.displayed_rating
          - entities.Officiant.fields.internal_rating
        distinguishing_aspect: |
          officiant_reputation runs on the Officiant domain (distinct from cancellation_settlement on Booking):
          over the same two reviews (one PUBLISHED rating 4, one SUBMITTED rating 2) the DISPLAYED variant
          (PUBLISHED only) yields 4.00 while the INTERNAL variant (SUBMITTED+PUBLISHED) yields 3.00.
        test_recipe:
          setup:
            - "Officiant ACTIVE; Couple; CLASSIC package; CA venue"
            - "Two bookings each dist 10km no add-on -> deposit_due 70800, both CONFIRMED then COMPLETED (clock past ceremonies)"
            - "Review on booking-1 rating 4 PUBLISHED; review on booking-2 rating 2 left SUBMITTED"
          setup_api_calls:
            - call: "POST /officiants"
              payload: { full_name: "Ben Cho", email: "ben@x.com", styles: ["SECULAR"], denomination: "CIVIL", certified_jurisdictions: ["CA"], max_active_holds: 5 }
              as: Coordinator
              captures: { off_id: $.data.id }
            - call: "POST /officiants/${off_id}/transition"
              payload: { to_state: "ACTIVE" }
              as: Coordinator
              captures: { off_v: $.data.version }
            - call: "POST /couples"
              payload: { partner_one_name: "Lee", partner_two_name: "Max", email: "lm@x.com", phone: "555-0101" }
              as: Coordinator
              captures: { cp_id: $.data.id }
            - call: "POST /packages"
              payload: { name: "Classic", tier: "CLASSIC", base_price_cents: 200000, deposit_pct: 0.30 }
              as: Coordinator
              captures: { pkg_id: $.data.id }
            - call: "POST /venues"
              payload: { name: "Rose Garden", jurisdiction: "CA", address: "1 Main St" }
              as: Coordinator
              captures: { ven_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: Coordinator
            - call: "POST /bookings"
              payload: { officiant_id: "${off_id}", couple_id: "${cp_id}", package_id: "${pkg_id}", venue_id: "${ven_id}", ceremony_start: "2026-04-01T15:00:00Z", ceremony_end: "2026-04-01T16:00:00Z", travel_distance_km: 10, required_style: "SECULAR" }
              as: Couple
              as_user_id: "${cp_id}"
              captures: { r1_id: $.data.id }
            - call: "POST /date-holds"
              payload: { booking_id: "${r1_id}", expected_officiant_version: "${off_v}" }
              as: Couple
              as_user_id: "${cp_id}"
            - call: "GET /officiants/${off_id}"
              payload: {}
              as: Coordinator
              captures: { off_v2: $.data.version }
            - call: "POST /bookings"
              payload: { officiant_id: "${off_id}", couple_id: "${cp_id}", package_id: "${pkg_id}", venue_id: "${ven_id}", ceremony_start: "2026-04-08T15:00:00Z", ceremony_end: "2026-04-08T16:00:00Z", travel_distance_km: 10, required_style: "SECULAR" }
              as: Couple
              as_user_id: "${cp_id}"
              captures: { r2_id: $.data.id }
            - call: "POST /date-holds"
              payload: { booking_id: "${r2_id}", expected_officiant_version: "${off_v2}" }
              as: Couple
              as_user_id: "${cp_id}"
            - call: "POST /bookings/${r1_id}/confirm"
              payload: { deposit_amount_cents: 70800 }
              as: Couple
              as_user_id: "${cp_id}"
            - call: "POST /bookings/${r2_id}/confirm"
              payload: { deposit_amount_cents: 70800 }
              as: Couple
              as_user_id: "${cp_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-09T00:00:00Z" }
              as: Coordinator
            - call: "POST /bookings/${r1_id}/complete"
              payload: {}
              as: Officiant
              as_user_id: "${off_id}"
            - call: "POST /bookings/${r2_id}/complete"
              payload: {}
              as: Officiant
              as_user_id: "${off_id}"
            - call: "POST /reviews"
              payload: { booking_id: "${r1_id}", rating: 4, text: "Wonderful" }
              as: Couple
              as_user_id: "${cp_id}"
              captures: { rev1_id: $.data.id }
            - call: "POST /reviews"
              payload: { booking_id: "${r2_id}", rating: 2, text: "Okay" }
              as: Couple
              as_user_id: "${cp_id}"
            - call: "POST /reviews/${rev1_id}/moderate"
              payload: { decision: "PUBLISH" }
              as: Coordinator
          trigger:
            - call: "GET /officiants/${off_id}"
              payload: {}
              as: Coordinator
              captures: { disp: $.data.displayed_rating, intern: $.data.internal_rating, cnt: $.data.published_review_count }
          assert:
            - "Officiant.${off_id}.displayed_rating == 4.00"
            - "Officiant.${off_id}.internal_rating == 3.00"
            - "Officiant.${off_id}.published_review_count == 1"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: price_quote_tiered_travel_rush_interfaith_mode_a
        grounds:
          - calculations.booking_price_quote
          - entities.Booking.fields.quoted_subtotal_cents
          - entities.Booking.fields.quoted_rush_cents
        distinguishing_aspect: |
          MODE (a): >=3 inputs with non-linear interaction — tiered travel selection (100km -> tier 76-150 = 30000),
          conditional rush branch (20 days < 30 -> 25000), conditional interfaith branch (required_style INTERFAITH -> 20000),
          plus base 200000 and add-on 8000 -> quoted_subtotal_cents 283000.
        test_recipe:
          setup:
            - "Officiant ACTIVE offering INTERFAITH, certified CA; Couple; CLASSIC package; CA venue; clock 2026-03-01"
          setup_api_calls:
            - call: "POST /officiants"
              payload: { full_name: "Rae Ito", email: "rae@x.com", styles: ["INTERFAITH"], denomination: "NONDENOMINATIONAL", certified_jurisdictions: ["CA"] }
              as: Coordinator
              captures: { off_id: $.data.id }
            - call: "POST /officiants/${off_id}/transition"
              payload: { to_state: "ACTIVE" }
              as: Coordinator
            - call: "POST /couples"
              payload: { partner_one_name: "Nia", partner_two_name: "Ott", email: "no@x.com", phone: "555-0102" }
              as: Coordinator
              captures: { cp_id: $.data.id }
            - call: "POST /packages"
              payload: { name: "Classic", tier: "CLASSIC", base_price_cents: 200000, deposit_pct: 0.30 }
              as: Coordinator
              captures: { pkg_id: $.data.id }
            - call: "POST /venues"
              payload: { name: "City Hall", jurisdiction: "CA", address: "2 Oak Ave" }
              as: Coordinator
              captures: { ven_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: Coordinator
          trigger:
            - call: "POST /bookings"
              payload: { officiant_id: "${off_id}", couple_id: "${cp_id}", package_id: "${pkg_id}", venue_id: "${ven_id}", ceremony_start: "2026-03-21T00:00:00Z", ceremony_end: "2026-03-21T01:00:00Z", travel_distance_km: 100, required_style: "INTERFAITH", addon_codes: ["HANDFASTING"] }
              as: Couple
              as_user_id: "${cp_id}"
              captures: { bk_id: $.data.id }
          assert:
            - "Booking.${bk_id}.quoted_travel_cents == 30000"
            - "Booking.${bk_id}.quoted_rush_cents == 25000"
            - "Booking.${bk_id}.quoted_interfaith_cents == 20000"
            - "Booking.${bk_id}.quoted_addons_cents == 8000"
            - "Booking.${bk_id}.quoted_subtotal_cents == 283000"
            - "Booking.${bk_id}.quoted_total_cents == 333940"
            - "Booking.${bk_id}.deposit_due_cents == 100182"

      - name: gratuity_per_line_rounding_order_mode_b
        grounds:
          - calculations.gratuity_split
          - entities.Booking.fields.quoted_gratuity_cents
          - entities.Booking.fields.deposit_due_cents
        distinguishing_aspect: |
          MODE (b): rounding order matters. Line items [200000,30000,0,0,5025,8025] gratuity at 18% rounded
          PER LINE then summed = 43750; the forbidden sum-then-round order gives 43749. The scaffold pins
          per-line-then-sum, so quoted_gratuity_cents MUST be 43750 (not 43749).
        test_recipe:
          setup:
            - "Officiant ACTIVE offering SECULAR, certified CA; Couple; CLASSIC package; CA venue; clock 2026-03-01"
          setup_api_calls:
            - call: "POST /officiants"
              payload: { full_name: "Uma Vale", email: "uma@x.com", styles: ["SECULAR"], denomination: "CIVIL", certified_jurisdictions: ["CA"] }
              as: Coordinator
              captures: { off_id: $.data.id }
            - call: "POST /officiants/${off_id}/transition"
              payload: { to_state: "ACTIVE" }
              as: Coordinator
            - call: "POST /couples"
              payload: { partner_one_name: "Pia", partner_two_name: "Roy", email: "pr@x.com", phone: "555-0103" }
              as: Coordinator
              captures: { cp_id: $.data.id }
            - call: "POST /packages"
              payload: { name: "Classic", tier: "CLASSIC", base_price_cents: 200000, deposit_pct: 0.30 }
              as: Coordinator
              captures: { pkg_id: $.data.id }
            - call: "POST /venues"
              payload: { name: "Vista Hall", jurisdiction: "CA", address: "3 Elm St" }
              as: Coordinator
              captures: { ven_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: Coordinator
          trigger:
            - call: "POST /bookings"
              payload: { officiant_id: "${off_id}", couple_id: "${cp_id}", package_id: "${pkg_id}", venue_id: "${ven_id}", ceremony_start: "2026-09-01T15:00:00Z", ceremony_end: "2026-09-01T16:00:00Z", travel_distance_km: 100, required_style: "SECULAR", addon_codes: ["PREMIUM_SCRIPT", "BILINGUAL_CEREMONY"] }
              as: Couple
              as_user_id: "${cp_id}"
              captures: { bk_id: $.data.id }
          assert:
            - "Booking.${bk_id}.quoted_addons_cents == 13050"
            - "Booking.${bk_id}.quoted_subtotal_cents == 243050"
            - "Booking.${bk_id}.quoted_gratuity_cents == 43750"
            - "Booking.${bk_id}.quoted_total_cents == 286800"
            - "Booking.${bk_id}.deposit_due_cents == 86040"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: ceremony_script_revision_loop
        grounds:
          - state_machines.CeremonyScript.CHANGES_REQUESTED_to_SUBMITTED
          - state_machines.CeremonyScript.SUBMITTED_to_CHANGES_REQUESTED
          - entities.CeremonyScript.fields.revision_count
        distinguishing_aspect: |
          CeremonyScript has a CYCLIC shape: SUBMITTED->CHANGES_REQUESTED->(submit)->SUBMITTED re-entry.
          Two full loops raise revision_count to 2 and land the script back in SUBMITTED — distinct entity
          from the Officiant ACTIVE<->SUSPENDED cycle.
        test_recipe:
          setup:
            - "Officiant ACTIVE; Couple; CLASSIC package; CA venue; one booking (INQUIRY is fine); a DRAFT script"
          setup_api_calls:
            - call: "POST /officiants"
              payload: { full_name: "Wei Xu", email: "wei@x.com", styles: ["SECULAR"], denomination: "CIVIL", certified_jurisdictions: ["CA"] }
              as: Coordinator
              captures: { off_id: $.data.id }
            - call: "POST /officiants/${off_id}/transition"
              payload: { to_state: "ACTIVE" }
              as: Coordinator
            - call: "POST /couples"
              payload: { partner_one_name: "Sky", partner_two_name: "Tao", email: "st@x.com", phone: "555-0104" }
              as: Coordinator
              captures: { cp_id: $.data.id }
            - call: "POST /packages"
              payload: { name: "Classic", tier: "CLASSIC", base_price_cents: 200000, deposit_pct: 0.30 }
              as: Coordinator
              captures: { pkg_id: $.data.id }
            - call: "POST /venues"
              payload: { name: "Bay Hall", jurisdiction: "CA", address: "4 Fir St" }
              as: Coordinator
              captures: { ven_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: Coordinator
            - call: "POST /bookings"
              payload: { officiant_id: "${off_id}", couple_id: "${cp_id}", package_id: "${pkg_id}", venue_id: "${ven_id}", ceremony_start: "2026-09-01T15:00:00Z", ceremony_end: "2026-09-01T16:00:00Z", travel_distance_km: 10, required_style: "SECULAR" }
              as: Couple
              as_user_id: "${cp_id}"
              captures: { bk_id: $.data.id }
            - call: "POST /ceremony-scripts"
              payload: { booking_id: "${bk_id}", opening_remarks: "Welcome", vow_format: "PERSONAL", closing_blessing: "Go well" }
              as: Couple
              as_user_id: "${cp_id}"
              captures: { sc_id: $.data.id }
          trigger:
            - call: "POST /ceremony-scripts/${sc_id}/submit"
              payload: {}
              as: Couple
              as_user_id: "${cp_id}"
            - call: "POST /ceremony-scripts/${sc_id}/decision"
              payload: { decision: "REQUEST_CHANGES", notes: "Trim opening" }
              as: Officiant
              as_user_id: "${off_id}"
            - call: "PATCH /ceremony-scripts/${sc_id}"
              payload: { opening_remarks: "Welcome all" }
              as: Couple
              as_user_id: "${cp_id}"
            - call: "POST /ceremony-scripts/${sc_id}/submit"
              payload: {}
              as: Couple
              as_user_id: "${cp_id}"
            - call: "POST /ceremony-scripts/${sc_id}/decision"
              payload: { decision: "REQUEST_CHANGES", notes: "Add a reading" }
              as: Officiant
              as_user_id: "${off_id}"
            - call: "POST /ceremony-scripts/${sc_id}/submit"
              payload: {}
              as: Couple
              as_user_id: "${cp_id}"
              captures: { st: $.data.status, rc: $.data.revision_count }
          assert:
            - "CeremonyScript.${sc_id}.status == SUBMITTED"
            - "CeremonyScript.${sc_id}.revision_count == 2"

      - name: officiant_suspend_reinstate_cycle
        grounds:
          - state_machines.Officiant.ACTIVE_to_SUSPENDED
          - state_machines.Officiant.SUSPENDED_to_ACTIVE
          - entities.Officiant.fields.status
        distinguishing_aspect: |
          Officiant has a CYCLIC shape: ACTIVE<->SUSPENDED is revisitable. After approve->suspend->reinstate the
          status returns to ACTIVE and version reaches 4 (create 1, approve 2, suspend 3, reinstate 4) — distinct
          entity from the CeremonyScript revision loop.
        test_recipe:
          setup:
            - "One officiant created (PENDING_REVIEW)"
          setup_api_calls:
            - call: "POST /officiants"
              payload: { full_name: "Yun Zhao", email: "yun@x.com", styles: ["RELIGIOUS"], denomination: "BUDDHIST", certified_jurisdictions: ["CA"] }
              as: Coordinator
              captures: { off_id: $.data.id }
          trigger:
            - call: "POST /officiants/${off_id}/transition"
              payload: { to_state: "ACTIVE" }
              as: Coordinator
            - call: "POST /officiants/${off_id}/transition"
              payload: { to_state: "SUSPENDED" }
              as: Coordinator
            - call: "POST /officiants/${off_id}/transition"
              payload: { to_state: "ACTIVE" }
              as: Coordinator
              captures: { st: $.data.status, v: $.data.version }
          assert:
            - "Officiant.${off_id}.status == ACTIVE"
            - "Officiant.${off_id}.version == 4"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: suspend_cascade_officiant_booking_script_rehearsal_depth3
        grounds:
          - state_machines.Officiant.ACTIVE_to_SUSPENDED
          - state_machines.Booking.CONFIRMED_to_BACKUP_PENDING
          - state_machines.CeremonyScript.APPROVED_to_CHANGES_REQUESTED
          - state_machines.Rehearsal.CONFIRMED_to_SCHEDULED
        distinguishing_aspect: |
          DEPTH-3 chain from officiant suspension: Officiant ACTIVE->SUSPENDED forces its CONFIRMED Booking to
          BACKUP_PENDING (link1); that booking transition forces its APPROVED CeremonyScript to CHANGES_REQUESTED
          (link2, caused by the booking transition); that script transition reverts its CONFIRMED Rehearsal to
          SCHEDULED (link3, caused by the script transition).
        test_recipe:
          setup:
            - "Officiant ACTIVE; Couple; CLASSIC package; CA venue; booking CONFIRMED; script APPROVED; rehearsal CONFIRMED"
          setup_api_calls:
            - call: "POST /officiants"
              payload: { full_name: "Ana Bell", email: "anab@x.com", styles: ["SECULAR"], denomination: "CIVIL", certified_jurisdictions: ["CA"] }
              as: Coordinator
              captures: { off_id: $.data.id }
            - call: "POST /officiants/${off_id}/transition"
              payload: { to_state: "ACTIVE" }
              as: Coordinator
              captures: { off_v: $.data.version }
            - call: "POST /couples"
              payload: { partner_one_name: "Cy", partner_two_name: "Dee", email: "cd@x.com", phone: "555-0105" }
              as: Coordinator
              captures: { cp_id: $.data.id }
            - call: "POST /packages"
              payload: { name: "Classic", tier: "CLASSIC", base_price_cents: 200000, deposit_pct: 0.30 }
              as: Coordinator
              captures: { pkg_id: $.data.id }
            - call: "POST /venues"
              payload: { name: "Lake Hall", jurisdiction: "CA", address: "5 Pine St" }
              as: Coordinator
              captures: { ven_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: Coordinator
            - call: "POST /bookings"
              payload: { officiant_id: "${off_id}", couple_id: "${cp_id}", package_id: "${pkg_id}", venue_id: "${ven_id}", ceremony_start: "2026-09-01T15:00:00Z", ceremony_end: "2026-09-01T16:00:00Z", travel_distance_km: 10, required_style: "SECULAR" }
              as: Couple
              as_user_id: "${cp_id}"
              captures: { bk_id: $.data.id }
            - call: "POST /date-holds"
