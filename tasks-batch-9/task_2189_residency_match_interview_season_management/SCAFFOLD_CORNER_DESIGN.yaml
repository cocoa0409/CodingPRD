  # RBAC - Table 7 rows against the 8 roles of §1.7: a role refused on a write
  # it does not own, a read shared by two roles, a role whose read access does
  # not imply the decision it feeds, and the segregation-of-duties row through
  # its second limb (the cast ballot rather than the authored card).
