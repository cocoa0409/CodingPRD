            - { call: "POST /api/quotes", payload: { property_id: "${pb}", assessment_id: "${a_id}", material_id: "${mat_id}", include_crack_fill: true, include_patch: true, include_seal: true, include_striping: false, coats: 1, expected_property_version: "${pb_v}" }, as: Estimator, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_ASSESSMENT_PROPERTY_MISMATCH (422); no quote persisted"

