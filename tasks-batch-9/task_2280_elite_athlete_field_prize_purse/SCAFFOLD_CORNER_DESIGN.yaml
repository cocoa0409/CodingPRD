              as: AntiDopingLiaison
              captures: { testA_id: "$.data.id" }
            - call: POST /_clock/set_current_utc
              payload: { to_iso8601: "2026-11-01T09:00:00Z" }
              as: TechnicalOfficial
            - call: POST /race-editions/${ed_id}/mark-raced
              as: TechnicalOfficial
            - call: POST /doping-tests/${testA_id}/collect
              payload: { collected_sample_ref: "COC-SG-A" }
              as: AntiDopingLiaison
            - call: POST /doping-tests/${testA_id}/adjudicate
              payload: { outcome: CLEARED }
