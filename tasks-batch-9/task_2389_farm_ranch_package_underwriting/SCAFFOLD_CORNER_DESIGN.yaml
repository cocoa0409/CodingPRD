              captures: { chem_status: $.data.status, chem_prem: $.data.premium_cents }
          assert:
            - "the first decision returns HTTP 422 ERR_ENDORSEMENT_EXPOSURE_MISSING — requires_inspection is true and both priority-11 gates passed on the hazard-10 COMPLETED inspection"
            - "the endorsement is still REQUESTED with premium_cents 0 after that rejection"
            - "adding the CUSTOM_FARMING exposure reverted the policy RATED -> DRAFT and reversed the two rating rows; the REQUESTED endorsement was NOT suspended because only APPROVED rows are"
            - "the re-rating produces property 144000, liability 157500, cat_load 125200 and total_premium_cents 426700"
            - "the second decision succeeds with premium_cents == 110000 (max(round_half_up(5000000 * 0.0220), 90000)) and total_premium_cents == 536700"
            - "the ledger ends with 8 rows: 144000, 125200, -144000, -125200 (RATING_REVERT), 144000, 157500, 125200, 110000 (ENDORSEMENT_APPROVAL) — summing to 536700"

      - name: corner_critical_overdue_recommendation_blocks_bind
        claim_type: violation_to_error
        grounds: ["validations[priority=11]", "errors.ERR_CRITICAL_REC_OVERDUE", "state_machines.Recommendation[OPEN->OVERDUE]", "endpoints.POST_/compliance-sweeps"]
        distinguishing_aspect: "The sweep ages a CRITICAL finding while the policy is still DRAFT, so the RECS_OVERDUE -> SUSPENDED hop cannot fire (it needs RATED or BOUND); the later bind therefore passes the ERR_COMPLIANCE_SUSPENDED gate and lands on ERR_CRITICAL_REC_OVERDUE (422) instead."
        test_recipe:
          setup:
            - "clock 2026-08-15T00:00:00Z, the ZN-1 pool trio, one DRAFT policy with an RC DWELLING and an all-zero labor profile, one Inspector"
            - "an INITIAL inspection completed with NO findings (hazard 10, compliance COMPLIANT), then re-inspected and completed as RE_INSPECTION with one CRITICAL finding due 2026-08-10 -> hazard 35, compliance RECS_OPEN"
          setup_api_calls:
            - *k_clock
            - *k_agent
            - *k_pool_hail
            - *k_pool_wind
            - *k_pool_fire
            - *k_acct
            - *k_policy
            - *k_item
            - *k_labor_zero
            - *k_inspector
            - *k_inspection
            - call: "POST /inspections/${ins_id2}/complete"
              payload: { findings_summary: "no findings on the initial survey", findings: [] }
              as: LossControlSpecialist
              as_user_id: "${insp_id}"
              captures: { h1: $.data.hazard_score }
            - call: "POST /inspections/${ins_id2}/reinspection"
              payload: { scheduled_for: "2026-08-17T09:00:00Z", duration_minutes: 60 }
              as: ComplianceOfficer
              captures: { re_status: $.data.status }
            - call: "POST /inspections/${ins_id2}/complete"
              payload: { findings_summary: "anhydrous storage unguarded", findings: [{ severity: "CRITICAL", description: "Cage the anhydrous tank", due_date: "2026-08-10" }] }
              as: LossControlSpecialist
              as_user_id: "${insp_id}"
              captures: { h2: $.data.hazard_score }
          trigger:
            - call: "POST /compliance-sweeps"
              payload: { policy_id: "${pol_id}" }
              as: ComplianceOfficer
              captures: { swept: $.data.recommendations_marked_overdue, suspended: $.data.policies_suspended }
            - *k_rate_get
            - call: "POST /farm-policies/${pol_id}/rate"
              payload: { expected_policy_version: "${pol_v1}" }
              as: Underwriter
              captures: { rate_after_sweep: $.data.uw_status }
            - call: "GET /farm-policies/${pol_id}"
              as: Underwriter
              captures: { pol_v_crit: $.data.version }
            - call: "POST /farm-policies/${pol_id}/bind"
              payload: { expected_policy_version: "${pol_v_crit}" }
              as: Underwriter
              captures: { e_crit: $.data.error_id }
          assert:
            - "the RE_INSPECTION completion scored 35 (base 5 + CRITICAL 30) and created the recommendation at sequence_no 1, because the first completion supplied no findings"
            - "the sweep returns policies_scanned 1, recommendations_marked_overdue 1, policies_marked_recs_overdue 1, policies_suspended 0 and labor_profiles_lapsed 0 — the SUSPENDED hop needs uw_status RATED or BOUND and the policy was DRAFT"
            - "FarmPolicy.${pol_id}.compliance_status == RECS_OVERDUE after the sweep"
            - "the rating succeeds as RATED (hazard 35 is below the inclusive 40 referral threshold) with total_premium_cents 269200"
            - "the bind returns HTTP 422 ERR_CRITICAL_REC_OVERDUE — compliance_status is RECS_OVERDUE, not SUSPENDED, so the priority-11 first check passes and the second one fires"
            - "the three reservations are still RESERVED and no pool moved from reserved to committed"

      - name: corner_bind_requires_labor_profile_then_verified_coordination
        claim_type: violation_to_error
        grounds: ["validations[priority=13]", "errors.ERR_WC_PROOF_MISSING", "errors.ERR_WC_COORDINATION_UNVERIFIED", "state_machines.LaborProfile[PENDING_PROOF->VERIFIED]"]
        distinguishing_aspect: "Three bind attempts separate the two workers-compensation guards: no LaborProfile row at all -> ERR_WC_PROOF_MISSING, a PENDING_PROOF row -> ERR_WC_COORDINATION_UNVERIFIED, and only after the ComplianceOfficer verifies the certificate does the bind succeed."
        test_recipe:
          setup:
            - "clock 2026-08-15T00:00:00Z, the ZN-1 pool trio, one policy with an RC DWELLING rated to 269200 and NO labor profile"
          setup_api_calls:
            - *k_clock
            - *k_agent
            - *k_pool_hail
            - *k_pool_wind
            - *k_pool_fire
            - *k_acct
            - *k_policy
            - *k_item
            - *k_rate_get
            - *k_rate
            - *k_bind_get
          trigger:
            - call: "POST /farm-policies/${pol_id}/bind"
              payload: { expected_policy_version: "${pol_v_bind}" }
              as: Underwriter
              captures: { e_wc_missing: $.data.error_id }
            - call: "PUT /farm-policies/${pol_id}/labor-profile"
              payload: { full_time_count: 4, seasonal_count: 4, migrant_h2a_count: 0, wc_carrier_name: "Prairie Mutual WC", wc_policy_number: "WC-2026-0007", wc_expiry_date: "2027-08-31" }
              as: Agent
              as_user_id: "${ag_id}"
              captures: { lab_pending: $.data.id, pending_status: $.data.coordination_status }
            - call: "POST /farm-policies/${pol_id}/bind"
              payload: { expected_policy_version: "${pol_v_bind}" }
              as: Underwriter
              captures: { e_wc_unver: $.data.error_id }
            - call: "POST /labor-profiles/${lab_pending}/wc-verification"
              payload: { note: "certificate matches the carrier of record" }
              as: ComplianceOfficer
              captures: { wc_verified: $.data.coordination_status }
            - call: "POST /farm-policies/${pol_id}/bind"
              payload: { expected_policy_version: "${pol_v_bind}" }
              as: Underwriter
              captures: { bound_at_last: $.data.uw_status }
          assert:
            - "attempt 1 returns HTTP 422 ERR_WC_PROOF_MISSING — the existence guard, not the status guard, because no LaborProfile row exists yet"
            - "the PUT creates the row with labor_exposure_units 6.00, wc_required true and coordination_status PENDING_PROOF, and does NOT touch uw_status or any premium field"
            - "attempt 2 returns HTTP 422 ERR_WC_COORDINATION_UNVERIFIED"
            - "the verification moves the profile to VERIFIED with verified_at 2026-08-15T00:00:00Z"
            - "attempt 3 succeeds: uw_status BOUND and the three reservations COMMITTED"
            - "none of the failed binds bumped FarmPolicy.version, so the same expected_policy_version stayed valid across all three attempts"

      - name: corner_role_check_outranks_schema_and_existence_checks
        claim_type: priority_ordering
        grounds: ["validations[priority=2]", "validations[priority=3]", "validations[priority=4]", "validations[priority=5]"]
        distinguishing_aspect: "The ladder is exercised across three adjacent rungs at once: a forbidden role on an unknown id with an unknown body field still returns ERR_FORBIDDEN_ROLE (403), while a legal role with both a schema error and an unknown body id returns ERR_INVALID_REQUEST (400) rather than the 404."
        test_recipe:
          setup:
            - "clock 2026-08-15T00:00:00Z, one Agent, one FarmAccount"
          setup_api_calls:
            - *k_clock
            - *k_agent
            - *k_acct
          trigger:
            - call: "PATCH /agents/00000000-0000-4000-8000-000000000051"
              payload: { appointment_status: "SUSPENDED" }
              as: Agent
              as_user_id: "${ag_id}"
              captures: { e_p2: $.data.error_id }
            - call: "POST /farm-policies"
              payload: { account_id: "00000000-0000-4000-8000-000000000052", term_start_date: "2026-09-01", term_end_date: "2027-08-31" }
              as: Agent
              as_user_id: "${ag_id}"
              captures: { e_p3: $.data.error_id }
            - call: "POST /inspections"
              payload: { policy_id: "00000000-0000-4000-8000-000000000053", inspector_id: "00000000-0000-4000-8000-000000000054", inspection_type: "INITIAL", scheduled_for: "2026-08-16T09:00:00Z", duration_minutes: 120 }
              as: Underwriter
              captures: { e_p5: $.data.error_id }
          assert:
            - "call 1 returns HTTP 403 ERR_FORBIDDEN_ROLE — the priority-2 permission check runs before the priority-4 path-existence check, so the unknown agent id is never reported"
            - "call 2 returns HTTP 400 ERR_INVALID_REQUEST for the missing deductible_cents — priority 3 outranks the priority-5 body-existence check on the unknown account_id"
            - "call 3 returns HTTP 404 ERR_FARM_POLICY_NOT_FOUND, not ERR_INSPECTOR_NOT_FOUND: both body ids are unknown and policy_id is declared first in the §1.5 input list"
            - "no row is created or modified by any of the three calls"

