      - name: parallel_axes_of_one_engagement_advance_without_touching_each_other
        claim_type: state_machine_shape_parallel
        grounds:
          - state_machines.Engagement.execution_state
          - state_machines.Engagement.authorization_state
        excluded_because:
          difficulty_instance: engagement_authorization_and_execution_axes_move_independently
          rationale: "That §1.8 instance already drives both axes end to end — an EXECUTING engagement is paused and resumed while execution_state stays EXECUTING, and every combined pair is asserted — so a separate breadth probe of the parallel shape would repeat it verbatim."

      - name: remediation_returns_to_assigned_after_a_rejected_retest
        claim_type: cascade_down
        grounds:
          - state_machines.Remediation.REJECTED_to_ASSIGNED
          - state_machines.RetestVerification
        excluded_because:
          difficulty_instance: rejected_retest_cycles_remediation_back_through_assigned_twice
          rationale: "The §1.8 cyclic instance walks ASSIGNED -> SUBMITTED -> REJECTED -> ASSIGNED twice and asserts the retest counter and due-date behaviour on each lap, which strictly contains the single-lap breadth claim."

      - name: emergency_pause_cascades_down_to_assignments_and_tester_state
        claim_type: cascade_down
        grounds:
          - state_machines.Engagement.authorization_state.AUTHORIZED_to_SUSPENDED
          - state_machines.TesterAssignment.PROVISIONED_to_REVOKED
          - state_machines.Tester.ASSIGNED_to_AVAILABLE
        excluded_because:
          difficulty_instance: emergency_pause_cascade_reaches_tester_availability_through_six_links
          rationale: "All six declared links of the pause cascade — document, targets, assignments, hour settlement, tester counter, tester availability — are asserted link by link in that §1.8 instance."

      - name: retest_signoff_bubbles_closure_up_to_asset_exposure
        claim_type: bubble_up
        grounds:
          - state_machines.RetestVerification.VERIFIED_to_SIGNED_OFF
          - state_machines.Remediation.VALIDATED_to_CLOSED
          - state_machines.Finding.RETEST_PASSED_to_CLOSED
        excluded_because:
          difficulty_instance: closure_signoff_cascade_clears_asset_exposure_through_five_links
          rationale: "The §1.8 transitive instance follows sign-off up through remediation, finding, plan risk points and the asset's open_finding_count and exposure_state, so the bubble-up claim is already covered at greater depth."

      - name: assignment_revocation_syncs_the_engagement_hour_ledger
        claim_type: ledger_sync
        grounds:
          - state_machines.TesterAssignment.PROVISIONED_to_REVOKED
          - calculations.assignment_hour_settlement
        excluded_because:
          difficulty_instance: assignment_revocations_conserve_the_engagement_hour_ledger
          rationale: "That §1.8 compensating-invariant instance reconciles hours_allocated == hours_reserved + hours_consumed + hours_available across several revocations, which subsumes a single before/after ledger-sync probe."

      - name: revoking_a_risk_acceptance_reverses_every_original_side_effect
        claim_type: compensation
        grounds:
          - state_machines.Finding.RISK_ACCEPTED_to_TRIAGED
          - calculations.plan_risk_point_ledger
        excluded_because:
          difficulty_instance: risk_acceptance_round_trip_conserves_plan_risk_points
          rationale: "The §1.8 instance performs the full RISK_ACCEPT / REVOKE_RISK_ACCEPTANCE round trip and asserts that plan risk points, the asset counter and the finding status all return to their pre-acceptance values, which is exactly the compensation claim."

  - section: calculations
    instances:
      - name: tester_qualification_score_caps_at_one_hundred_and_rescores_on_replacement
        claim_type: constants_applied
        grounds:
          - calculations.tester_qualification_score
          - entities.Tester.fields.qualification_score
          - endpoints[POST /pentest/testers/{id}/certifications]
        distinguishing_aspect: "All four certifications sum to 120 raw points but the score is capped at 100, and replacing the list with a single CREST certification rescores to 25 — proving the cap is a min() and the endpoint replaces rather than merges the array."
        test_recipe:
          setup:
            - "No prior data; the clock is pinned so registration is deterministic."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /pentest/testers"
              payload: { full_name: "Dana Ruiz", certifications: ["OSCP", "GPEN", "CREST", "CISSP"], clearance_expires_at: "2027-01-01T00:00:00Z", max_concurrent_engagements: 2 }
              as: PlatformAdmin
              captures: { tester_id: $.data.id, q0: $.data.qualification_score }
            - call: "POST /pentest/testers/${tester_id}/certifications"
              payload: { certifications: ["CREST"] }
              as: PlatformAdmin
              captures: { q1: $.data.qualification_score }
            - call: "GET /pentest/testers/${tester_id}"
              payload: {}
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { q2: $.data.qualification_score, certs: $.data.certifications }
          assert:
            - "${q0} == 100 — OSCP 45 + GPEN 35 + CREST 25 + CISSP 15 = 120 raw, clamped by min(100, ...)"
            - "${q1} == 25 and ${q2} == 25 — the replacement list is scored on its own, not merged with the previous four"
            - "${certs} == [CREST]"

