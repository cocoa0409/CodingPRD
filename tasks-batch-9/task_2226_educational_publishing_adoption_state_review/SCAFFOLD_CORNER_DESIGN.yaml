              as: PublisherEditor
              captures: { ttl_id: $.data.id }
            - call: "POST /submissions"
              payload: { cycle_id: "${cyc_id}", title_id: "${ttl_id}" }
              as: PublisherEditor
              captures: { sub_id: $.data.id }
          trigger:
            - call: "GET /state-profiles/00000000-0000-4000-8000-000000000001"
              as: PlatformAdmin
              captures: { err_state: $.data.error_id }
            - call: "GET /adoption-cycles/00000000-0000-4000-8000-000000000002"
              as: PlatformAdmin
              captures: { err_cycle: $.data.error_id }
            - call: "GET /content-edits/00000000-0000-4000-8000-000000000003"
              as: PlatformAdmin
              captures: { err_edit: $.data.error_id }
            - call: "GET /committee-panels/00000000-0000-4000-8000-000000000004"
              as: PlatformAdmin
              captures: { err_panel: $.data.error_id }
            - call: "GET /presentation-slots/00000000-0000-4000-8000-000000000005"
              as: PlatformAdmin
              captures: { err_slot: $.data.error_id }
            - call: "GET /pricing-proposals/00000000-0000-4000-8000-000000000006"
              as: PlatformAdmin
              captures: { err_proposal: $.data.error_id }
            - call: "GET /district-orders/00000000-0000-4000-8000-000000000007"
              as: PlatformAdmin
              captures: { err_order: $.data.error_id }
            - call: "POST /public-comments/00000000-0000-4000-8000-000000000008/response"
              payload: { response_body: "There is no such comment to answer." }
              as: PublisherEditor
              captures: { err_comment: $.data.error_id }
            - call: "POST /submissions/${sub_id}/correlations/00000000-0000-4000-8000-000000000009/verdict"
              payload: { verdict: "ACCEPT" }
              as: ReviewCommitteeMember
              as_user_id: "cm-1"
              captures: { err_entry: $.data.error_id }
            - call: "POST /district-orders"
              payload: { district_ref: "ND-DIST-01", state_id: "00000000-0000-4000-8000-00000000000a", title_id: "00000000-0000-4000-8000-00000000000b", print_units: 10, digital_seats: 0 }
              as: SalesRep
