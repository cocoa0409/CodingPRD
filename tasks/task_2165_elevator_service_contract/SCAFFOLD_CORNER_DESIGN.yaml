          setup:
            - "One ACTIVE contract with one car and two CLEARED out-of-service MALFUNCTION callbacks whose intervals overlap: [2026-08-05T09:00Z, 2026-08-05T15:00Z) and [2026-08-05T13:00Z, 2026-08-05T17:00Z)."
