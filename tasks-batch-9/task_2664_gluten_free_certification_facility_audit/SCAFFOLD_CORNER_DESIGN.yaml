              as: ApplicantContact
              as_user_id: "${app_id}"
              captures: { ing_id: $.data.id }
            - call: "POST /gfco/products"
              payload: { applicant_id: "${app_id}", facility_id: "${fac_id}", name: "Rice Sandwich Loaf", sku: "RSL-001" }
              as: ApplicantContact
              as_user_id: "${app_id}"
              captures: { prod_id: $.data.id }
            - call: "POST /gfco/product-ingredients"
              payload: { product_id: "${prod_id}", ingredient_id: "${ing_id}", inclusion_pct: 40 }
              as: ApplicantContact
              as_user_id: "${app_id}"
              captures: { link_id: $.data.id }
          trigger:
