              as: CaptiveManager
              captures: { filing_id: $.data.id }
            - call: "POST /api/captives/${captive_id}/domicile-filings/${filing_id}/submit"
              payload: {}
              as: CaptiveManager
            - call: "POST /api/captives/${captive_id}/domicile-filings/${filing_id}/acknowledge"
              payload: {}
              as: DomicileRegulator
            - call: "POST /api/captives/${captive_id}/domicile-filings/${filing_id}/approve"
              payload: {}
              as: DomicileRegulator
            - call: "POST /api/captives/${captive_id}/programs"
              payload: { program_name: "Cyber Prog P", line_of_business: "CYBER", policy_period_start: "2026-06-01T00:00:00Z", policy_period_end: "2027-05-31T23:59:59Z", aggregate_limit_cents: 1000000, per_occurrence_limit_cents: 250000, attachment_point_cents: 10000, premium_budget_cents: 200000, fronting_required: true, expected_captive_version: "${captive_ver}" }
              as: Underwriter
              captures: { program_id: $.data.id }
            - call: "POST /api/captives/${captive_id}/programs/${program_id}/quote"
              payload: {}
              as: Underwriter
            - call: "POST /api/captives/${captive_id}/programs/${program_id}/fronting"
              payload: { fronting_carrier_name: "FrontCo P", fronting_fee_pct: 0.07, reinsurance_ceded_pct: 0.90 }
              as: Underwriter
              captures: { fronting_id: $.data.id }
            - call: "POST /api/captives/${captive_id}/programs/${program_id}/fronting/${fronting_id}/agree-terms"
              payload: {}
              as: Underwriter
          trigger:
            - call: "POST /api/captives/${captive_id}/programs/${program_id}/fronting/${fronting_id}/collateral"
              payload: { collateral_type: "LETTER_OF_CREDIT", amount_cents: 100000, posted_date: "2026-05-01T00:00:00Z", expiry_date: "2027-01-01T00:00:00Z", issuing_institution: "Bank P" }
              as: CaptiveManager
          assert:
            - "CollateralPosting created but expiry_date (2027-01-01) < policy_period_end (2027-05-31)"
            - "FrontingArrangement collateral_shortfall still reflects gap (insufficient long-term coverage)"

  # =========================================================================
  # Rule 9: Compensating-action invariants across different conserved quantities
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: allocation_dispute_resolve_restores_governance_score
        grounds:
          - state_machines.PremiumAllocation.PROVISIONAL_to_DISPUTED
          - state_machines.PremiumAllocation.DISPUTED_to_PROVISIONAL
          - entities.CaptiveEntity.fields.governance_score
        distinguishing_aspect: |
          Conserved quantity: CaptiveEntity.governance_score. Dispute (-3) followed by
          resolve-dispute (+3) MUST leave governance_score unchanged. This is a
          compensating-action invariant on governance_score.
        test_recipe:
          setup:
            - "CaptiveEntity ACTIVE, program IN_FORCE, allocation PROVISIONAL"
            - "CaptiveEntity.governance_score == 100"
          setup_api_calls:
            - call: "POST /api/captives"
              payload: { captive_name: "Test Captive Q", domicile_jurisdiction: "VERMONT", formation_date: "2026-01-15T00:00:00Z", capitalization_amount: 500000 }
