              as_user_id: "${a_id}"
              captures: { child_a: $.data.id }
          trigger:
            - call: "GET /children/${child_a}"
              payload: {}
              as: AccountHolder
              as_user_id: "${b_id}"
              captures: { err: $.data.error_id }
          assert:
