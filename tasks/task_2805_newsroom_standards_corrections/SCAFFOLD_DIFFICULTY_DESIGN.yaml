          assert:
            - "CorrectionRequest.${cr}.status == ADJUDICATED"
            - "CorrectionRequest.${cr}.adjudicated_severity_score == 21"
            - "CorrectionRequest.${cr}.adjudicated_severity_band == SEVERE"
            - "CorrectionRequest.${cr}.placement == TOP_OF_STORY"
            - "Story.${st}.severe_correction_count == 1"
            - "Story.${st}.standards_status == CORRECTED"
            - "Newsroom.${nr}.open_high_severity_count == 1"
            - "Newsroom.${nr}.standards_posture == HEIGHTENED"

      - name: sustained_fabrication_cascades_suspension_to_reviewer_minute_release
        grounds:
          - state_machines.MisconductInvestigation.RESPONSE_PENDING_to_SUSTAINED
          - state_machines.Journalist.ACTIVE_to_SUSPENDED
          - state_machines.OutsideActivityRequest.APPROVED_to_REVOKED
          - state_machines.PrePublicationReview.SUBMITTED_to_BLOCKED
          - state_machines.ReviewAssignment.SCHEDULED_to_CANCELLED
          - calculations.journalist_penalty_points
          - calculations.reviewer_minute_ledger
          - calculations.misconduct_disclosure_obligation
        distinguishing_aspect: |
          A different trigger — a SUSTAINED misconduct decision, not a correction adjudication — drives a
          four-link chain through a different entity path: investigation SUSTAINED at 12 points (1) ->
          Journalist SUSPENDED (2) -> APPROVED outside activity REVOKED, IN_REVIEW story back to DRAFT and
          its review BLOCKED (3) -> that review's SCHEDULED assignment CANCELLED and the reviewer's 60
          reserved minutes returned (4).
        test_recipe:
          setup:
            - "Newsroom with high_severity_open_threshold 2 and a LEGAL reviewer with weekly_capacity_minutes 600"
            - "The reporter holds an APPROVED outside-activity request for a paid speaking engagement on the courts beat"
            - "The reporter's story is IN_REVIEW with high_risk_declared true, so the review requires legal review and sits in SUBMITTED"
            - "A 60-minute legal review slot is SCHEDULED against that review, so the reviewer shows reserved_minutes 60 and available_minutes 540"
            - "A FABRICATION allegation at EGREGIOUS severity is RESPONSE_PENDING; 9 severity points plus the 3-point fabrication surcharge reach the suspension threshold of 12"
          setup_api_calls:
            - call: "POST /standards-desk/newsrooms"
              payload: { name: "Metro Ledger", correction_response_sla_hours: 72, high_severity_open_threshold: 2, required_module_codes: ["SOURCING"] }
