            - "Campaign C3 with sampling window starting at 2026-07-14T00:00:01Z (one second past the buffer) and a PENDING_SCREEN enrollment for the same panelist."
            - "The panelist has a unique address_hash and account_opened_at 2026-01-01T00:00:00Z, so its screening fraud score is 0.0 and cannot be the cause of any failure."
