            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-28T13:00:01Z" }, as: EventOrganizer }
            - { call: "POST /shift-signups/${su}/mark-no-show", payload: {}, as: EventOrganizer }
          assert:
            - "Before shift end: error_id == ERR_NO_SHOW_TOO_EARLY (409); signup remains SIGNED_UP"
            - "After clock passes end_time: mark-no-show succeeds, status NO_SHOW, signed_up_count decremented"

