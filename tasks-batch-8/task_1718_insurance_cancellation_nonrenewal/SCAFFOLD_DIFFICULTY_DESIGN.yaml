  # ------------------------------------------------------------------
  # Rule 4 — transitive_cascade: two cascades from DIFFERENT triggers (depth >=3 and >=2)
  # ------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: clock_sweep_cancellation_to_report_cascade
        grounds:
          - state_machines.Policy.CANCEL_PENDING_to_CANCELLED
          - state_machines.CancellationCase.NOTICE_SENT_to_EFFECTIVE
          - calculations.nonrenewal_volume
          - entities.PremiumLedgerEntry.fields.entry_kind
        distinguishing_aspect: |
          Depth-3 transitive chain from a single trigger (POST /carrier/_clock/set_current_utc
          crossing scheduled_effective_date): clock sweep flips Policy CANCEL_PENDING ->
          CANCELLED; that flip flips CancellationCase NOTICE_SENT -> EFFECTIVE; that flip
          posts a RETURN_PRO_RATA PremiumLedgerEntry; and the same flip increments
          RegulatoryReport.cancellation_count — A->B->C plus a ledger mutation, each link
          caused by the previous one, not by the clock call directly.
        test_recipe:
          setup:
            - "ACTIVE CO profile (grounds [NONPAYMENT], nonpayment 10, other 30, mortgagee 45, nonrenewal 60, short_rate 0.0, window 45, max reinst 2)"
            - "ACTIVE CO policy (term 2026-01-01..2027-01-01, premium 36500); NONPAYMENT case requested 2026-08-01, approved scheduled_effective_date 2026-08-15, notices dispatched mailed 2026-08-01"
            - "Clock at 2026-08-14 (day before effectiveness); no RegulatoryReport for 2026-08 exists yet"
          setup_api_calls:
            - call: "POST /carrier/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /carrier/state-profiles"
              payload: { state_code: "CO", permissible_grounds: ["NONPAYMENT"], nonpayment_notice_days: 10, other_grounds_notice_days: 30, mortgagee_notice_days: 45, nonrenewal_notice_days: 60, short_rate_penalty_pct: 0.0, reinstatement_window_days: 45, max_reinstatements: 2, nonrenewal_content_codes: ["SPECIFIC_REASON"] }
              as: ComplianceOfficer
              captures: { prof_co: $.data.id }
            - call: "POST /carrier/state-profiles/${prof_co}/activate"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /carrier/policyholders"
              payload: { full_name: "Sweep Insured", mailing_address: "1 Sw St", email: "sw@x.com" }
              as: Underwriter
              captures: { ph_sw: $.data.id }
            - call: "POST /carrier/policies"
              payload: { policyholder_id: "${ph_sw}", state_profile_id: "${prof_co}", policy_number: "P-SW-1", term_start_date: "2026-01-01", term_end_date: "2027-01-01", total_premium_cents: 36500 }
              as: Underwriter
              captures: { pol_sw: $.data.id, pol_sw_v: $.data.version }
            - call: "POST /carrier/cancellation-cases"
              payload: { policy_id: "${pol_sw}", ground_code: "NONPAYMENT", expected_policy_version: "${pol_sw_v}" }
              as: Underwriter
              captures: { case_sw: $.data.id }
            - call: "POST /carrier/cancellation-cases/${case_sw}/approve"
              payload: { scheduled_effective_date: "2026-08-15" }
              as: ComplianceOfficer
            - call: "POST /carrier/cancellation-cases/${case_sw}/dispatch-notices"
              payload: { notices: [ { recipient_kind: "POLICYHOLDER", mailed_on_date: "2026-08-01", tracking_code: "T-SW-1" } ] }
              as: Underwriter
            - call: "POST /carrier/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-14T00:00:00Z" }
              as: ComplianceOfficer
          trigger:
            - call: "POST /carrier/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:00Z" }
              as: ComplianceOfficer
            - call: "GET /carrier/regulatory-reports"
              payload: { state_profile_id: "${prof_co}", report_period: "2026-08" }
              as: ComplianceOfficer
              captures: { rep_sw: $.data }
          assert:
            - "Policy.${pol_sw}.status == CANCELLED (link 1: clock -> policy)"
            - "CancellationCase.${case_sw}.status == EFFECTIVE (link 2: policy flip -> case flip)"
            - "PremiumLedgerEntry for ${pol_sw} contains RETURN_PRO_RATA amount_cents == -13900 (elapsed 226 days; unearned = round_half_up(36500*139/365) = 13900)"
            - "RegulatoryReport (profile ${prof_co}, period 2026-08) auto-created OPEN with cancellation_count == 1 (link 3: case flip -> report increment)"

      - name: appeal_overturn_to_policy_and_ledger_cascade
        grounds:
          - state_machines.AppealCase.UNDER_REVIEW_to_OVERTURNED
          - state_machines.CancellationCase.transitions
          - entities.RegulatoryReport.fields.rescinded_count
        distinguishing_aspect: |
          Depth-2 chain from a DIFFERENT trigger (POST /carrier/appeals/{id}/decide with
          OVERTURNED): appeal decision flips CancellationCase EFFECTIVE -> RESCINDED; the
          case rescission flips Policy CANCELLED -> ACTIVE and posts the compensating
          positive ledger entry, and increments RegulatoryReport.rescinded_count — distinct
          originating transition from the clock-sweep cascade.
        test_recipe:
          setup:
            - "ACTIVE NV profile (grounds [NONPAYMENT], nonpayment 10, other 30, mortgagee 45, nonrenewal 60, short_rate 0.0, window 45, max reinst 2)"
            - "ACTIVE NV policy (term 2026-01-01..2027-01-01, premium 36500) cancelled EFFECTIVE 2026-08-20; return entry -22000... computed: elapsed 231, unearned = round_half_up(36500*134/365) = 13400 -> entry -13400"
            - "Appeal filed 2026-08-25, UNDER_REVIEW; RegulatoryReport for 2026-08 already OPEN with cancellation_count 1 from the sweep"
          setup_api_calls:
            - call: "POST /carrier/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /carrier/state-profiles"
              payload: { state_code: "NV", permissible_grounds: ["NONPAYMENT"], nonpayment_notice_days: 10, other_grounds_notice_days: 30, mortgagee_notice_days: 45, nonrenewal_notice_days: 60, short_rate_penalty_pct: 0.0, reinstatement_window_days: 45, max_reinstatements: 2, nonrenewal_content_codes: ["SPECIFIC_REASON"] }
              as: ComplianceOfficer
              captures: { prof_nv: $.data.id }
            - call: "POST /carrier/state-profiles/${prof_nv}/activate"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /carrier/policyholders"
              payload: { full_name: "Ov Insured", mailing_address: "1 Ov St", email: "ov@x.com" }
              as: Underwriter
              captures: { ph_ov: $.data.id }
            - call: "POST /carrier/policies"
              payload: { policyholder_id: "${ph_ov}", state_profile_id: "${prof_nv}", policy_number: "P-OV-1", term_start_date: "2026-01-01", term_end_date: "2027-01-01", total_premium_cents: 36500 }
              as: Underwriter
              captures: { pol_ov: $.data.id, pol_ov_v: $.data.version }
            - call: "POST /carrier/cancellation-cases"
              payload: { policy_id: "${pol_ov}", ground_code: "NONPAYMENT", expected_policy_version: "${pol_ov_v}" }
              as: Underwriter
              captures: { case_ov: $.data.id }
            - call: "POST /carrier/cancellation-cases/${case_ov}/approve"
              payload: { scheduled_effective_date: "2026-08-20" }
              as: ComplianceOfficer
            - call: "POST /carrier/cancellation-cases/${case_ov}/dispatch-notices"
              payload: { notices: [ { recipient_kind: "POLICYHOLDER", mailed_on_date: "2026-08-05", tracking_code: "T-OV-1" } ] }
              as: Underwriter
            - call: "POST /carrier/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-20T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /carrier/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-25T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /carrier/appeals"
              payload: { cancellation_case_id: "${case_ov}", filed_by: "POLICYHOLDER", grounds_text: "Proof of payment attached" }
              as: Policyholder
              as_user_id: "${ph_ov}"
              captures: { appeal_ov: $.data.id }
            - call: "POST /carrier/appeals/${appeal_ov}/accept-for-review"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-x"
          trigger:
            - call: "POST /carrier/appeals/${appeal_ov}/decide"
              payload: { decision: "OVERTURNED" }
              as: ComplianceOfficer
              as_user_id: "officer-y"
            - call: "GET /carrier/regulatory-reports"
              payload: { state_profile_id: "${prof_nv}", report_period: "2026-08" }
              as: ComplianceOfficer
              captures: { rep_ov: $.data }
          assert:
            - "AppealCase.${appeal_ov}.status == OVERTURNED (link 0)"
            - "CancellationCase.${case_ov}.status == RESCINDED (link 1: decision -> case)"
            - "Policy.${pol_ov}.status == ACTIVE and cancellation_effective_date == null (link 2: case rescission -> policy)"
            - "PremiumLedgerEntry for ${pol_ov} nets to zero return: contains RETURN_PRO_RATA -13400 and compensating RETURN_PRO_RATA +13400"
            - "RegulatoryReport (2026-08) has cancellation_count == 1 and rescinded_count == 1"

  # ------------------------------------------------------------------
  # Rule 5 — priority_pair_validation_conflict: two conflicts on DIFFERENT error-category pairs
  # ------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_temporal_on_approve
        grounds:
          - validations[priority=4]
          - validations[priority=8]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_EFFECTIVE_DATE_TOO_EARLY]
        distinguishing_aspect: |
          Category pair state (priority 4) vs business_temporal (priority 8): approving a
          WITHDRAWN cancellation case while also supplying a scheduled_effective_date
          earlier than earliest_effective_date MUST return ERR_INVALID_STATE (409), never
          ERR_EFFECTIVE_DATE_TOO_EARLY — the state check outranks the temporal check.
        test_recipe:
          setup:
            - "ACTIVE ID profile (grounds [NONPAYMENT], nonpayment 10, other 30, mortgagee 45, nonrenewal 60, short_rate 0.0, window 45, max reinst 2)"
            - "ACTIVE ID policy; NONPAYMENT case created 2026-08-01 (earliest_effective_date 2026-08-11), then withdrawn by the underwriter"
          setup_api_calls:
            - call: "POST /carrier/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /carrier/state-profiles"
              payload: { state_code: "ID", permissible_grounds: ["NONPAYMENT"], nonpayment_notice_days: 10, other_grounds_notice_days: 30, mortgagee_notice_days: 45, nonrenewal_notice_days: 60, short_rate_penalty_pct: 0.0, reinstatement_window_days: 45, max_reinstatements: 2, nonrenewal_content_codes: ["SPECIFIC_REASON"] }
              as: ComplianceOfficer
              captures: { prof_id: $.data.id }
            - call: "POST /carrier/state-profiles/${prof_id}/activate"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /carrier/policyholders"
              payload: { full_name: "W Insured", mailing_address: "1 W St", email: "w@x.com" }
              as: Underwriter
              captures: { ph_w: $.data.id }
            - call: "POST /carrier/policies"
              payload: { policyholder_id: "${ph_w}", state_profile_id: "${prof_id}", policy_number: "P-W-1", term_start_date: "2026-01-01", term_end_date: "2027-01-01", total_premium_cents: 30000 }
              as: Underwriter
              captures: { pol_w: $.data.id, pol_w_v: $.data.version }
            - call: "POST /carrier/cancellation-cases"
              payload: { policy_id: "${pol_w}", ground_code: "NONPAYMENT", expected_policy_version: "${pol_w_v}" }
              as: Underwriter
              captures: { case_w: $.data.id }
            - call: "POST /carrier/cancellation-cases/${case_w}/withdraw"
              payload: {}
              as: Underwriter
          trigger:
            - call: "POST /carrier/cancellation-cases/${case_w}/approve"
              payload: { scheduled_effective_date: "2026-08-05" }
              as: ComplianceOfficer
              captures: { err_w: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE with http 409 (state priority 4 beats business_temporal priority 8; the date 2026-08-05 < earliest 2026-08-11 is never evaluated)"
            - "CancellationCase.${case_w}.status remains WITHDRAWN"

      - name: business_safety_vs_business_constraint_on_case_create
        grounds:
          - validations[priority=6]
          - validations[priority=9]
          - errors[ERR_GROUND_NOT_PERMITTED_IN_STATE]
          - errors[ERR_CANCELLATION_ALREADY_OPEN]
        distinguishing_aspect: |
          Category pair business_safety (priority 6) vs business_constraint (priority 9):
          creating a second open cancellation case for a policy whose first case is still
          open, while also using a ground NOT in the profile's permissible_grounds, MUST
          return ERR_GROUND_NOT_PERMITTED_IN_STATE (422), never ERR_CANCELLATION_ALREADY_OPEN.
        test_recipe:
          setup:
            - "ACTIVE MT profile with permissible_grounds [NONPAYMENT] only (LICENSE_SUSPENSION NOT permitted)"
            - "ACTIVE MT policy with an open PENDING_APPROVAL NONPAYMENT cancellation case"
          setup_api_calls:
            - call: "POST /carrier/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /carrier/state-profiles"
              payload: { state_code: "MT", permissible_grounds: ["NONPAYMENT"], nonpayment_notice_days: 10, other_grounds_notice_days: 30, mortgagee_notice_days: 45, nonrenewal_notice_days: 60, short_rate_penalty_pct: 0.0, reinstatement_window_days: 45, max_reinstatements: 2, nonrenewal_content_codes: ["SPECIFIC_REASON"] }
              as: ComplianceOfficer
              captures: { prof_mt: $.data.id }
            - call: "POST /carrier/state-profiles/${prof_mt}/activate"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /carrier/policyholders"
              payload: { full_name: "Mt Insured", mailing_address: "1 Mt St", email: "mt@x.com" }
              as: Underwriter
              captures: { ph_mt: $.data.id }
            - call: "POST /carrier/policies"
              payload: { policyholder_id: "${ph_mt}", state_profile_id: "${prof_mt}", policy_number: "P-MT-1", term_start_date: "2026-01-01", term_end_date: "2027-01-01", total_premium_cents: 30000 }
              as: Underwriter
              captures: { pol_mt: $.data.id, pol_mt_v: $.data.version }
            - call: "POST /carrier/cancellation-cases"
              payload: { policy_id: "${pol_mt}", ground_code: "NONPAYMENT", expected_policy_version: "${pol_mt_v}" }
              as: Underwriter
              captures: { case_mt: $.data.id }
            - call: "GET /carrier/policies/${pol_mt}"
              payload: {}
              as: ComplianceOfficer
              captures: { pol_mt_v2: $.data.version }
          trigger:
            - call: "POST /carrier/cancellation-cases"
              payload: { policy_id: "${pol_mt}", ground_code: "LICENSE_SUSPENSION", expected_policy_version: "${pol_mt_v2}" }
              as: Underwriter
              captures: { err_mt: $.data.error_id }
          assert:
            - "error_id == ERR_GROUND_NOT_PERMITTED_IN_STATE with http 422 (business_safety priority 6 beats business_constraint priority 9)"
            - "No second CancellationCase is created for policy ${pol_mt}; list for policy_id ${pol_mt} has length 1"

  # ------------------------------------------------------------------
  # Rule 6 — boundary_precision_check: two boundaries on DIFFERENT metrics/endpoints
  # ------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: nonrenewal_notice_mailed_exactly_on_deadline_is_timely
        grounds:
          - calculations.notice_window
          - errors[ERR_NONRENEWAL_NOTICE_LATE]
          - state_machines.NonrenewalCase.APPROVED_to_NOTICE_SENT
        distinguishing_aspect: |
          Metric = days-to-deadline on the dispatch-notices endpoint: notice_deadline_date
          = term_end_date - 60 = 2026-11-01 for term ending 2026-12-31; mailing exactly ON
          2026-11-01 is timely (<=) and dispatch succeeds, while mailing 2026-11-02 fails
          ERR_NONRENEWAL_NOTICE_LATE — a >=/<= boundary, not an empty-set edge.
        test_recipe:
          setup:
            - "ACTIVE UT profile (grounds [NONPAYMENT], nonpayment 10, other 30, mortgagee 45, nonrenewal 60, short_rate 0.0, window 45, max reinst 2, content codes [SPECIFIC_REASON])"
            - "Two ACTIVE UT policies, term 2026-01-01..2026-12-31, premium 24000; two nonrenewal cases approved 2026-08-01 (both policies NONRENEWAL_PENDING)"
            - "Clock 2026-11-01"
          setup_api_calls:
            - call: "POST /carrier/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /carrier/state-profiles"
              payload: { state_code: "UT", permissible_grounds: ["NONPAYMENT"], nonpayment_notice_days: 10, other_grounds_notice_days: 30, mortgagee_notice_days: 45, nonrenewal_notice_days: 60, short_rate_penalty_pct: 0.0, reinstatement_window_days: 45, max_reinstatements: 2, nonrenewal_content_codes: ["SPECIFIC_REASON"] }
              as: ComplianceOfficer
              captures: { prof_ut: $.data.id }
            - call: "POST /carrier/state-profiles/${prof_ut}/activate"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /carrier/policyholders"
              payload: { full_name: "Ut One", mailing_address: "1 Ut St", email: "ut1@x.com" }
              as: Underwriter
              captures: { ph_ut1: $.data.id }
            - call: "POST /carrier/policyholders"
              payload: { full_name: "Ut Two", mailing_address: "2 Ut St", email: "ut2@x.com" }
              as: Underwriter
              captures: { ph_ut2: $.data.id }
            - call: "POST /carrier/policies"
              payload: { policyholder_id: "${ph_ut1}", state_profile_id: "${prof_ut}", policy_number: "P-UT-1", term_start_date: "2026-01-01", term_end_date: "2026-12-31", total_premium_cents: 24000 }
              as: Underwriter
