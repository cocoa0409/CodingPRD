            - "${lifecycle_after} == RENEWED, ${renewed_rent} == 120752, ${rent_now} == 120752, ${renewed_exp} == 2028-12-31 and ${renewed_opt} == OPTION_2_OCAF"
            - "${requested} == 84500, ${voucher_state} == REVERSED, ${claim_amount} == 70000, ${claim_state} == DENIED and ${claim_reason} == Tenant ledger does not support the arrears"
