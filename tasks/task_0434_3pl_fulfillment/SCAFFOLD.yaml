    side_effects: []

  - method: GET
    path: "/orders/{orderId}"
    description: "Get an order by id"
    roles: [ClientUser, WavePlanner, BillingClerk, ShipStation, PackStation]
    code: 200
    input: []
    output: Order
    side_effects: []

  - method: GET
    path: "/waves"
    description: "List waves; filter by client_id (filtered-list reverse-reachability for Wave.client_id)"
