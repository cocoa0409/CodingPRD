# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# task_2830 — Portable Restroom & Restroom Trailer Rental
#
# Every instance grounds in SCAFFOLD.yaml §1.1–§1.7 only. Deleting this file
# leaves the declared behavior identical.
#
# Shared conventions used by every chain below:
#   * The logical clock is repositioned to 2026-08-03T08:00:00Z (a Monday) as the
#     first setup call, so "today" is deterministic. Startup default is
#     2026-08-01T00:00:00Z.
#   * A ServiceSite starts at site_posture RESTRICTED (permit_status NONE). The
#     canonical "make the site placeable" prefix is: create a PLACEMENT permit ->
#     submit -> approve, which drives permit_status APPROVED and site_posture OPEN.
#   * Route weekday MON matches scheduled dates 2026-08-03 / 2026-08-10 / 2026-08-17.
#   * Opaque roles pass an explicit as_user_id only where the assertion depends on
#     the audit identity (charge assessment vs resolution, segregation of duties).
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: unit_mix_provisional_vs_reconciled_diverge_on_contract_ledger
        grounds:
          - calculations.unit_mix_quote
          - calculations.unit_mix_quote.variants.provisional_projection
          - calculations.unit_mix_quote.variants.reconciled_actual
          - state_machines.RentalContract.DRAFT_to_QUOTED
          - state_machines.RentalContract.ACTIVE_to_DEMOBILIZED
          - entities.RentalContract.fields.quoted_cents
          - entities.RentalContract.fields.reconciled_cents
          - entities.QuoteLine.fields.quote_variant
        distinguishing_aspect: |
          This dual variant lives on the RentalContract money ledger: provisional_projection
          models a unit mix from headcount / frequency / ADA overlays, reconciled_actual counts
          the AssetUnit classes that were physically deployed with NO overlays, so the same
          contract carries quoted_cents 181500 and reconciled_cents 29000 simultaneously.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-03T08:00:00Z."
            - "One CONSTRUCTION account, one OPEN site (PLACEMENT permit APPROVED)."
            - "Contract: CONSTRUCTION, headcount 60, service_frequency_per_week 2, ada_required true -> provisional mix 9 STANDARD_PORTABLE + 1 ADA_PORTABLE + 3 HANDWASH_STATION = 181500 cents."
            - "Only 2 STANDARD_PORTABLE units are actually deployed and reach DEPLOYED via activation."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rental-accounts"
              payload: { legal_name: "Northgate Builders LLC", account_type: "CONSTRUCTION", credit_terms_days: 30 }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /service-sites"
              payload: { account_id: "${acct_id}", site_label: "Northgate Lot A", jurisdiction_code: "CA-SD-CITY", access_class: "OPEN_LOT", right_of_way_required: false, gate_open_minute: 360, gate_close_minute: 1080, max_truck_length_ft: 40 }
              as: SalesRep
              captures: { site_id: $.data.id }
            - call: "POST /placement-permits"
              payload: { site_id: "${site_id}", permit_kind: "PLACEMENT", authority_ref: "PL-1001", effective_from: "2026-08-01", effective_to: "2026-12-31" }
              as: PermitCoordinator
              captures: { permit_id: $.data.id }
            - call: "POST /placement-permits/${permit_id}/submit"
              payload: { submission_note: "initial filing" }
              as: PermitCoordinator
            - call: "POST /placement-permits/${permit_id}/approve"
              payload: { authority_decision_ref: "AD-1001" }
              as: ComplianceOfficer
            - call: "POST /asset-units"
              payload: { asset_tag: "SP-001", unit_class: "STANDARD_PORTABLE", yard_code: "YD-1", tare_length_ft: 8 }
              as: PlatformAdmin
              captures: { unit1_id: $.data.id }
            - call: "POST /asset-units"
              payload: { asset_tag: "SP-002", unit_class: "STANDARD_PORTABLE", yard_code: "YD-1", tare_length_ft: 8 }
              as: PlatformAdmin
              captures: { unit2_id: $.data.id }
            - call: "POST /rental-contracts"
              payload: { account_id: "${acct_id}", site_id: "${site_id}", contract_kind: "CONSTRUCTION", term_start: "2026-08-03", term_end: "2026-09-30", headcount: 60, event_duration_hours: 8, service_frequency_per_week: 2, season_code: "SHOULDER", construction_phase: "VERTICAL", ada_required: true }
              as: SalesRep
              captures: { contract_id: $.data.id, contract_v: $.data.version }
            - call: "POST /rental-contracts/${contract_id}/quote"
              payload: { expected_contract_version: "${contract_v}", quote_note: "phase 2 mix" }
              as: SalesRep
              captures: { quoted_after: $.data.quoted_cents }
            - call: "POST /unit-deployments"
              payload: { contract_id: "${contract_id}", asset_unit_id: "${unit1_id}", deploy_from: "2026-08-03", deploy_to: "2026-09-30" }
              as: DispatchPlanner
              captures: { dep1_id: $.data.id }
            - call: "POST /unit-deployments"
              payload: { contract_id: "${contract_id}", asset_unit_id: "${unit2_id}", deploy_from: "2026-08-03", deploy_to: "2026-09-30" }
              as: DispatchPlanner
              captures: { dep2_id: $.data.id }
            - call: "POST /rental-contracts/${contract_id}/activate"
              payload: {}
              as: SalesRep
          trigger:
            - call: "POST /rental-contracts/${contract_id}/demobilize"
              payload: { demobilization_note: "phase 2 complete" }
              as: DispatchPlanner
              captures: { reconciled_after: $.data.reconciled_cents, fulfillment_after: $.data.fulfillment_state }
          assert:
            - "${quoted_after} == 181500"
            - "${reconciled_after} == 29000"
            - "RentalContract.${contract_id}.quoted_cents == 181500 (unchanged by demobilization)"
            - "RentalContract.${contract_id}.reconciled_cents == 29000, i.e. 2 * RATE_STANDARD_PORTABLE_CENTS 14500"
            - "the two variants disagree by exactly 152500 cents on the same contract row"
            - "${fulfillment_after} == DEMOBILIZED"
            - "GET /rental-contracts/${contract_id}/quote-lines returns 4 rows: 3 with quote_variant PROVISIONAL and is_superseded true, and 1 with quote_variant RECONCILED, unit_class STANDARD_PORTABLE, quantity 2, extended_cents 29000"
            - "the RECONCILED set carries NO ADA_PORTABLE and NO HANDWASH_STATION line — reconciled_actual applies neither overlay"

      - name: route_density_planned_vs_realized_diverge_on_same_schedule_set
        grounds:
          - calculations.route_density_score
          - calculations.route_density_score.variants.planned_committed
          - calculations.route_density_score.variants.realized_serviced
          - entities.Route.fields.density_planned_pct
          - entities.Route.fields.density_realized_pct
          - entities.Route.fields.committed_units
          - state_machines.ServiceVisit.EN_ROUTE_to_SERVICED
          - state_machines.ServiceVisit.PLANNED_to_MISSED
        distinguishing_aspect: |
          This dual variant lives on the Route utilisation metric, not on any money field: with the
          ACTIVE schedule set unchanged at 26 committed units on a 40-unit truck, density_planned_pct
          stays 65 while density_realized_pct is 32, because the realized variant counts only
          units_serviced on Route.last_run_date.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-03T08:00:00Z; one CONSTRUCTION account with an OPEN site."
            - "One MON route with truck_capacity_units 40."
            - "Two identical contracts (CONSTRUCTION, headcount 60, frequency 2, ada true) each quoted to 13 units; each gets an ACTIVE schedule on that route -> committed_units 26."
            - "Both schedules have one visit on 2026-08-10; visit A is dispatched and completed (13 units serviced), visit B is still PLANNED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rental-accounts"
              payload: { legal_name: "Harbor Civil Works", account_type: "CONSTRUCTION", credit_terms_days: 30 }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /service-sites"
              payload: { account_id: "${acct_id}", site_label: "Harbor Yard", jurisdiction_code: "CA-SD-CITY", access_class: "OPEN_LOT", right_of_way_required: false, gate_open_minute: 360, gate_close_minute: 1080, max_truck_length_ft: 40 }
              as: SalesRep
              captures: { site_id: $.data.id }
            - call: "POST /placement-permits"
              payload: { site_id: "${site_id}", permit_kind: "PLACEMENT", authority_ref: "PL-2001", effective_from: "2026-08-01", effective_to: "2026-12-31" }
              as: PermitCoordinator
              captures: { permit_id: $.data.id }
            - call: "POST /placement-permits/${permit_id}/submit"
              payload: {}
              as: PermitCoordinator
            - call: "POST /placement-permits/${permit_id}/approve"
              payload: { authority_decision_ref: "AD-2001" }
              as: ComplianceOfficer
            - call: "POST /routes"
              payload: { route_code: "RT-MON-40", service_day: "MON", truck_capacity_units: 40, waste_capacity_gallons: 2500 }
              as: DispatchPlanner
              captures: { route_id: $.data.id }
            - call: "POST /rental-contracts"
              payload: { account_id: "${acct_id}", site_id: "${site_id}", contract_kind: "CONSTRUCTION", term_start: "2026-08-03", term_end: "2026-09-30", headcount: 60, event_duration_hours: 8, service_frequency_per_week: 2, season_code: "SHOULDER", construction_phase: "VERTICAL", ada_required: true }
              as: SalesRep
              captures: { contract_a: $.data.id, contract_a_v: $.data.version }
            - call: "POST /rental-contracts/${contract_a}/quote"
              payload: { expected_contract_version: "${contract_a_v}" }
              as: SalesRep
            - call: "POST /rental-contracts"
              payload: { account_id: "${acct_id}", site_id: "${site_id}", contract_kind: "CONSTRUCTION", term_start: "2026-08-03", term_end: "2026-09-30", headcount: 60, event_duration_hours: 8, service_frequency_per_week: 2, season_code: "SHOULDER", construction_phase: "VERTICAL", ada_required: true }
              as: SalesRep
              captures: { contract_b: $.data.id, contract_b_v: $.data.version }
            - call: "POST /rental-contracts/${contract_b}/quote"
              payload: { expected_contract_version: "${contract_b_v}" }
              as: SalesRep
            - call: "POST /service-schedules"
              payload: { contract_id: "${contract_a}", route_id: "${route_id}", service_day: "MON", window_start_minute: 480, window_end_minute: 540 }
              as: DispatchPlanner
              captures: { sched_a: $.data.id, sched_a_units: $.data.units_on_route }
            - call: "POST /service-schedules"
              payload: { contract_id: "${contract_b}", route_id: "${route_id}", service_day: "MON", window_start_minute: 600, window_end_minute: 660 }
              as: DispatchPlanner
              captures: { sched_b: $.data.id }
            - call: "POST /service-visits"
              payload: { schedule_id: "${sched_a}", visit_kind: "SERVICE", scheduled_date: "2026-08-10", window_start_minute: 480, window_end_minute: 540 }
              as: DispatchPlanner
              captures: { visit_a: $.data.id }
            - call: "POST /service-visits"
              payload: { schedule_id: "${sched_b}", visit_kind: "SERVICE", scheduled_date: "2026-08-10", window_start_minute: 600, window_end_minute: 660 }
              as: DispatchPlanner
              captures: { visit_b: $.data.id }
            - call: "POST /service-visits/${visit_a}/dispatch"
              payload: {}
              as: DriverOperator
            - call: "POST /service-visits/${visit_a}/complete"
              payload: { gallons_pumped: 420 }
              as: DriverOperator
          trigger:
            - call: "POST /service-visits/${visit_b}/mark-missed"
              payload: { missed_reason: "gate padlocked on arrival" }
              as: DispatchPlanner
          assert:
            - "${sched_a_units} == 13"
            - "Route.${route_id}.committed_units == 26 (both schedules still ACTIVE)"
            - "Route.${route_id}.density_planned_pct == 65"
            - "Route.${route_id}.density_realized_pct == 32"
            - "the two variants diverge by 33 percentage points on an unchanged ACTIVE schedule set"
            - "Route.${route_id}.last_run_date == 2026-08-10"
            - "ServiceVisit.${visit_a}.units_serviced == 13 and ServiceVisit.${visit_b}.units_serviced == 0"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: escalation_rounds_each_line_then_sums_not_sum_then_round
        grounds:
          - calculations.line_escalation_invoice
          - entities.QuoteLine.fields.escalated_cents
          - entities.QuoteLine.fields.extended_cents
          - entities.RentalContract.fields.invoice_subtotal_cents
          - state_machines.RentalContract.UNBILLED_to_INVOICED
        distinguishing_aspect: |
          Mode (b) — nested rounding where the order changes the cents. Seasonal 3.25 + phase 4.75 +
          fuel 1.75 = 9.75 percent applied per line and rounded half-up per line sums to 199197,
          whereas the forbidden "sum the extended amounts, escalate once, round once" order yields
          199196; the scaffold pins the per-line order.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-03T08:00:00Z; CONSTRUCTION account, OPEN site."
            - "Contract: CONSTRUCTION, headcount 60, frequency 2, ada true, season_code SHOULDER, construction_phase VERTICAL."
            - "Quoted PROVISIONAL lines: STANDARD_PORTABLE extended 130500, ADA_PORTABLE extended 22500, HANDWASH_STATION extended 28500 (sum 181500)."
            - "Contract activated so fulfillment_state is ACTIVE and invoicing is permitted; billing_state still UNBILLED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rental-accounts"
              payload: { legal_name: "Ridgeline Concrete", account_type: "CONSTRUCTION", credit_terms_days: 30 }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /service-sites"
              payload: { account_id: "${acct_id}", site_label: "Ridgeline Tower", jurisdiction_code: "CA-SD-CITY", access_class: "OPEN_LOT", right_of_way_required: false, gate_open_minute: 360, gate_close_minute: 1080, max_truck_length_ft: 40 }
              as: SalesRep
              captures: { site_id: $.data.id }
            - call: "POST /placement-permits"
              payload: { site_id: "${site_id}", permit_kind: "PLACEMENT", authority_ref: "PL-3001", effective_from: "2026-08-01", effective_to: "2026-12-31" }
              as: PermitCoordinator
              captures: { permit_id: $.data.id }
            - call: "POST /placement-permits/${permit_id}/submit"
              payload: {}
              as: PermitCoordinator
            - call: "POST /placement-permits/${permit_id}/approve"
              payload: { authority_decision_ref: "AD-3001" }
              as: ComplianceOfficer
            - call: "POST /rental-contracts"
              payload: { account_id: "${acct_id}", site_id: "${site_id}", contract_kind: "CONSTRUCTION", term_start: "2026-08-03", term_end: "2026-09-30", headcount: 60, event_duration_hours: 8, service_frequency_per_week: 2, season_code: "SHOULDER", construction_phase: "VERTICAL", ada_required: true }
              as: SalesRep
              captures: { contract_id: $.data.id, contract_v: $.data.version }
            - call: "POST /rental-contracts/${contract_id}/quote"
              payload: { expected_contract_version: "${contract_v}" }
              as: SalesRep
              captures: { quoted_after: $.data.quoted_cents }
            - call: "POST /rental-contracts/${contract_id}/activate"
              payload: {}
              as: SalesRep
          trigger:
            - call: "POST /rental-contracts/${contract_id}/invoice"
              payload: {}
              as: SalesRep
              captures: { subtotal_after: $.data.invoice_subtotal_cents, net_after: $.data.net_billable_cents, billing_after: $.data.billing_state }
          assert:
            - "${quoted_after} == 181500"
            - "${subtotal_after} == 199197"
            - "${net_after} == 199197"
            - "${billing_after} == INVOICED"
            - "the STANDARD_PORTABLE QuoteLine has extended_cents 130500 and escalated_cents 143224"
            - "the ADA_PORTABLE QuoteLine has extended_cents 22500 and escalated_cents 24694"
            - "the HANDWASH_STATION QuoteLine has extended_cents 28500 and escalated_cents 31279"
            - "143224 + 24694 + 31279 == 199197, and the forbidden sum-then-round order (round_half_up(181500 * 1.0975) == 199196) is one cent lower — 199196 is a failure"
            - "RentalContract.${contract_id}.fulfillment_state == ACTIVE (the billing dimension moved alone)"

      - name: missed_credit_pinned_pre_transition_density_resolves_circularity
        grounds:
          - calculations.missed_service_credit
          - calculations.route_density_score
          - entities.Route.fields.density_planned_pct
          - entities.Route.fields.density_realized_pct
          - entities.ChargeEvent.fields.amount_cents
          - state_machines.ServiceVisit.PLANNED_to_MISSED
        distinguishing_aspect: |
          Mode (c) — an apparently circular dependency (the credit depends on a density surcharge that
          the missed visit itself changes) whose evaluation order is pinned: the tier is read from the
          PRE-transition density_planned_pct 65 giving 6.0 percent and a credit of 62413, while the
          forbidden post-transition read would give the 12.0 percent tier and 65946.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-03T08:00:00Z; CONSTRUCTION account, OPEN site."
            - "One MON route with truck_capacity_units 20."
            - "Contract: CONSTRUCTION, headcount 60, frequency 2, ada true -> 9 STANDARD_PORTABLE + 1 ADA_PORTABLE + 3 HANDWASH_STATION, 13 units."
            - "One ACTIVE schedule on that route -> committed_units 13, density_planned_pct 65."
            - "One PLANNED visit on 2026-08-10 that is never dispatched, so Route.last_run_date is still null."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rental-accounts"
              payload: { legal_name: "Summit Sitework", account_type: "CONSTRUCTION", credit_terms_days: 30 }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /service-sites"
              payload: { account_id: "${acct_id}", site_label: "Summit Pad 4", jurisdiction_code: "CA-SD-CITY", access_class: "OPEN_LOT", right_of_way_required: false, gate_open_minute: 360, gate_close_minute: 1080, max_truck_length_ft: 40 }
              as: SalesRep
              captures: { site_id: $.data.id }
            - call: "POST /placement-permits"
              payload: { site_id: "${site_id}", permit_kind: "PLACEMENT", authority_ref: "PL-4001", effective_from: "2026-08-01", effective_to: "2026-12-31" }
              as: PermitCoordinator
              captures: { permit_id: $.data.id }
            - call: "POST /placement-permits/${permit_id}/submit"
              payload: {}
              as: PermitCoordinator
            - call: "POST /placement-permits/${permit_id}/approve"
              payload: { authority_decision_ref: "AD-4001" }
              as: ComplianceOfficer
            - call: "POST /routes"
              payload: { route_code: "RT-MON-20", service_day: "MON", truck_capacity_units: 20, waste_capacity_gallons: 1800 }
              as: DispatchPlanner
              captures: { route_id: $.data.id }
            - call: "POST /rental-contracts"
              payload: { account_id: "${acct_id}", site_id: "${site_id}", contract_kind: "CONSTRUCTION", term_start: "2026-08-03", term_end: "2026-09-30", headcount: 60, event_duration_hours: 8, service_frequency_per_week: 2, season_code: "SHOULDER", construction_phase: "VERTICAL", ada_required: true }
              as: SalesRep
              captures: { contract_id: $.data.id, contract_v: $.data.version }
            - call: "POST /rental-contracts/${contract_id}/quote"
              payload: { expected_contract_version: "${contract_v}" }
              as: SalesRep
            - call: "POST /service-schedules"
              payload: { contract_id: "${contract_id}", route_id: "${route_id}", service_day: "MON", window_start_minute: 480, window_end_minute: 540 }
              as: DispatchPlanner
              captures: { sched_id: $.data.id }
            - call: "GET /routes/${route_id}"
              as: DispatchPlanner
              captures: { density_before: $.data.density_planned_pct }
            - call: "POST /service-visits"
              payload: { schedule_id: "${sched_id}", visit_kind: "SERVICE", scheduled_date: "2026-08-10", window_start_minute: 480, window_end_minute: 540 }
              as: DispatchPlanner
              captures: { visit_id: $.data.id }
          trigger:
            - call: "POST /service-visits/${visit_id}/mark-missed"
              payload: { missed_reason: "truck breakdown" }
              as: DispatchPlanner
            - call: "GET /charge-events"
              payload: { contract_id: "${contract_id}" }
              as: ComplianceOfficer
              captures: { credit_id: "$.data[0].id", credit_amount: "$.data[0].amount_cents", credit_kind: "$.data[0].charge_kind" }
          assert:
            - "${density_before} == 65"
            - "${credit_kind} == MISSED_SERVICE_CREDIT"
            - "${credit_amount} == 62413"
            - "the tier came from the PRE-transition Route.density_planned_pct 65, which selects the first DENSITY_SURCHARGE_TIERS entry with max_density_pct >= 65, i.e. 6.0 percent: base_visit_cents 51200 -> per_visit_service_cents 54272 -> credit 62413"
            - "reading a post-transition density instead would select the 12.0 percent tier and yield 57344 then 65946 — 65946 is a failure"
            - "Route.${route_id}.density_planned_pct == 65 (unchanged: the schedule is still ACTIVE)"
            - "Route.${route_id}.density_realized_pct == 0 (Route.last_run_date is null, so the realized variant contributes nothing)"
            - "RentalContract.${contract_id}.credit_accrued_cents == 62413"
            - "ChargeEvent.${credit_id}.assessed_by_user_id == SYSTEM and ChargeEvent.${credit_id}.source_visit_id == ${visit_id}"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: contract_billing_and_fulfillment_dimensions_advance_independently
        grounds:
          - state_machines.RentalContract
          - state_machines.RentalContract.UNBILLED_to_INVOICED
          - state_machines.RentalContract.INVOICED_to_SETTLED
          - state_machines.RentalContract.ACTIVE_to_DEMOBILIZED
          - entities.RentalContract.fields.fulfillment_state
          - entities.RentalContract.fields.billing_state
          - calculations.line_escalation_invoice
        distinguishing_aspect: |
          Non-linearity by PARALLEL STATE DIMENSIONS on the RentalContract row: billing_state walks
          UNBILLED -> INVOICED -> SETTLED while fulfillment_state stays ACTIVE the whole time, and only
          the join condition (fulfillment demobilizing while billing_state == SETTLED) writes
          fulfillment_state CLOSED instead of DEMOBILIZED.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-03T08:00:00Z; CONSTRUCTION account, OPEN site."
            - "Contract: CONSTRUCTION, headcount 40, frequency 3, ada false, season_code OFF, construction_phase SITEWORK -> 5 STANDARD_PORTABLE (72500) + 2 HANDWASH_STATION (19000), quoted 91500."
            - "One STANDARD_PORTABLE unit deployed and activated, so fulfillment_state is ACTIVE with one DEPLOYED deployment."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rental-accounts"
              payload: { legal_name: "Cascade Grading", account_type: "CONSTRUCTION", credit_terms_days: 15 }
              as: PlatformAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /service-sites"
              payload: { account_id: "${acct_id}", site_label: "Cascade Cut A", jurisdiction_code: "WA-KC-CITY", access_class: "OPEN_LOT", right_of_way_required: false, gate_open_minute: 360, gate_close_minute: 1080, max_truck_length_ft: 40 }
              as: SalesRep
              captures: { site_id: $.data.id }
            - call: "POST /placement-permits"
              payload: { site_id: "${site_id}", permit_kind: "PLACEMENT", authority_ref: "PL-5001", effective_from: "2026-08-01", effective_to: "2026-12-31" }
              as: PermitCoordinator
              captures: { permit_id: $.data.id }
