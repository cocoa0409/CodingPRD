          assert:
            - "${err} == ERR_FORBIDDEN; certificate remains SUBMITTED"

      - name: customer_cannot_read_other_customers_booking
        claim_type: rbac_denial
        grounds: ["roles[Customer]", "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "entity_backed ownership: Customer B's X-User-ID does not match the booking's customer_id, so the read is 403 ERR_FORBIDDEN (not 404)."
        test_recipe:
