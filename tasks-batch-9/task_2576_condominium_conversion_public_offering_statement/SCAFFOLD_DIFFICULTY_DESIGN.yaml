      - name: rofr_window_expired_beats_rofr_unit_not_linked
        grounds:
          - validations[priority=34]
          - validations[priority=41]
          - entities.TenantHousehold.fields.rofr_expires_at
          - entities.TenantHousehold.fields.occupied_unit_id
          - entities.Unit.fields.declaration_status
