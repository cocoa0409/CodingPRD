              payload: { recipient_id: "${rid}", delivery_kind: "EMAIL_PDF", quantity: 1, expected_order_version: "${o_old_v0}" }
              as: Student
              as_user_id: "${sid}"
              captures: { o_old_v1: $.data.version, l_old: $.data.id }
            - call: "POST /registrar/identity-verifications"
