              payload: { serial_number: "SN-FN-2", category: "UPRIGHT", manufacturer: "Yamaha", model: "U3", year_built: 2024, condition_grade: "EXCELLENT", acquisition_type: "NEW", list_price_cents: 600000, floor_price_cents: 500000 }
              as: StoreManager
              captures: { f2: $.data.id }
