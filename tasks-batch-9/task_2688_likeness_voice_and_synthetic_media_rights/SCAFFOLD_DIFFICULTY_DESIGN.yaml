            - call: "POST /digital-replicas/${r_id}/approve-for-use"
              payload: { approval_note: "cleared" }
              as: TalentRepresentative
              as_user_id: "${t_id}"
              captures: { r_v: $.data.version }
            - call: "POST /generated-performances"
              payload: { digital_replica_id: "${r_id}", licensee_name: "Northwind Ads", media_type: "ADVERTISING", territory_codes: ["US", "MX"], intended_use_description: "30 second radio spot", projected_impressions: 6000000, scheduled_first_use_at: "2026-09-01T00:00:00Z" }
              as: LicenseeProducer
              as_user_id: "lic-001"
              captures: { p_id: $.data.id }
            - call: "POST /generated-performances/${p_id}/review"
              payload: { decision: "APPROVE", review_note: "sounds right" }
              as: TalentRepresentative
              as_user_id: "${t_id}"
          trigger:
            - call: "POST /usage-licenses"
              payload: { generated_performance_id: "${p_id}", channel: "ADVERTISING", territory_codes: ["US", "MX"], distribution_start: "2026-09-01T00:00:00Z", distribution_end: "2027-06-01T00:00:00Z", actual_impressions: 12000000, expected_replica_version: "${r_v}" }
              as: LicenseeProducer
              as_user_id: "lic-001"
              captures: { l_id: $.data.id }
          assert:
            - "the PER_USE_FINAL entry from GET /compensation-entries?usage_license_id=${l_id} has amount_cents 470250, talent_share_cents 352687, agency_share_cents 94050, administrator_share_cents 23513"
            - "talent_share_cents + agency_share_cents + administrator_share_cents == 470250 for that entry"
            - "the PER_USE_PROVISIONAL entry for the same grant has amount_cents 346500 with shares 259875 / 69300 / 17325 and a zero remainder"
            - "the INITIAL_CREATION entry has amount_cents 300000 with shares 225000 / 60000 / 15000"

      - name: license_total_surcharge_on_presurcharge_subtotal_with_ceiling
        grounds:
          - calculations.license_total_cost
          - entities.UsageLicense.fields.compliance_surcharge_cents
          - entities.UsageLicense.fields.license_total_cents
          - entities.CompensationEntry.fields.entry_type
        distinguishing_aspect: >-
          Mode (c) — operation order and rounding direction. The 1.75% advertising surcharge is
          assessed on the pre-surcharge subtotal 470250 and rounded UP (8229.375 -> 8230, not the
          round_half_up 8229 used by every royalty amount), then added once, giving 478480; a
          cumulative-base policy would produce 489794 and a round_half_up policy 478479. The
          surcharge is a billing item, so no CompensationEntry is ever created for it.
        test_recipe:
          setup:
            - "Identical fixture to royalty_split_per_participant_rounding_with_signed_remainder: CA law profile, SAG_AFTRA/ADVERTISING union row, ACTIVE grant with per-use base 150000, APPROVED performance over US and MX"
            - "CA disclosure_required_advertising is true, so the license is surcharge-bearing"
          setup_api_calls:
            - call: "POST /state-law-profiles"
