      - name: rating_window_1095_days_excludes_stale_complaints
        claim_type: Input Set Filtering
        grounds:
          - calculations.rating_score
        distinguishing_aspect: "Only complaints filed within trailing 1095 days count: an UNANSWERED complaint filed 2023-08-01 falls outside the window computed at 2026-09-16 (window start 2023-09-17T00:00:00Z) and contributes nothing, while one filed 2026-09-01 contributes 12."
