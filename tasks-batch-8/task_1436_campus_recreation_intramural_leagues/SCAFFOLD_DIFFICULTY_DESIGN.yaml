      - name: facility_half_open_adjacency_overlap
        grounds:
          - calculations.facility_slot_fit
          - errors[ERR_FACILITY_DOUBLE_BOOKED]
          - validations[priority=9]
        distinguishing_aspect: |
          Facility bookings use HALF-OPEN [start,end) semantics with zero buffer: game g2 starting at 19:30 exactly when
          g1 ends 19:30 is ACCEPTED, while g3 at 19:29 is rejected — and because g3's teams also conflict with g2, the
          pinned temporal sub-order (facility before team) is proven by the ERR_FACILITY_DOUBLE_BOOKED response.
        test_recipe:
