          assert:
            - "LiabilityWaiver.${wv2_id}.status == SIGNED and LiabilityWaiver.${wv2_id}.expires_on == 2027-09-02T00:00:00Z from waiver_expiry"
            - "the newer signing superseded the older one, so LiabilityWaiver.${wv1_id}.status == SUPERSEDED rather than EXPIRED"
            - "the ops-run did not move LiabilityWaiver.${wv2_id} out of SIGNED, because its expiry is a year after the clock"
            - "the filtered waiver list returns exactly 2 rows for the member and scope, so both terminal and non-terminal waivers remain queryable"

  # =========================================================================
  # Section: calculations
  # =========================================================================
  - section: calculations
    instances:

      - name: event_dwell_charge_flat_branch_for_free_demo
        claim_type: input_set_filtering
        grounds:
          - calculations.event_dwell_charge
          - entities.EventOffering.fields.registration_cap
        distinguishing_aspect: "A FREE_DEMO offering with cap 0 takes the flat branch and charges exactly 15 minutes whatever volume registers, while a capped seminar charges the two-phase sum."
        test_recipe:
          setup: ["a store with a generous dwell budget and one member"]
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Ozark Flagship", state_code: "MO", dealer_license_no: "MO-DLR-4417", dwell_capacity_minutes: 60000, load_bays_total: 4 }
              as: PlatformAdmin
              captures: { st_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /stores/${st_id}/members"
              payload: { email: "m_ev@x.com", full_name: "Eve Rill", donation_opt_in: false }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /stores/${st_id}/event-offerings"
              payload: { offering_kind: "FREE_DEMO", title: "Boat Wash Demo", starts_at_utc: "2026-10-01T10:00:00Z", ends_at_utc: "2026-10-01T11:00:00Z", registration_cap: 0 }
              as: EventsCoordinator
              captures: { ev_free_id: $.data.id }
            - call: "POST /stores/event-offerings/${ev_free_id}/publish"
              payload: {}
              as: EventsCoordinator
            - call: "POST /stores/${st_id}/event-offerings/${ev_free_id}/registrations"
              payload: { member_id: "${m_id}", seats: 4 }
              as: EventsCoordinator
              captures: { rg_id: $.data.id }
            - call: "POST /stores/event-offerings/${ev_free_id}/registrations/${rg_id}/confirm"
              payload: {}
              as: EventsCoordinator
          trigger:
            - call: "GET /stores/event-offerings/${ev_free_id}"
              as: EventsCoordinator
            - call: "GET /stores/${st_id}/dwell-summary"
              as: StoreManager
          assert:
            - "EventOffering.${ev_free_id}.dwell_charge_minutes == 15 regardless of the 4 confirmed seats"
            - "Store.dwell_committed_minutes == 15, so the seat count never entered the dwell arithmetic"
            - "EventOffering.${ev_free_id}.confirmed_count == 4, proving the seats were counted for capacity but not for dwell"

      - name: event_dwell_charge_two_phase_and_rounding_order
        claim_type: correct_result
        grounds:
          - calculations.event_dwell_charge
          - entities.EventOffering.fields.dwell_charge_minutes
        distinguishing_aspect: "A capped seminar charges the summed two-phase value rounded once: cap 30 costs 23 minutes because 15 seats at half a minute plus 15 seats at one minute rounds once at the sum."
        test_recipe:
          setup: ["a store with a generous dwell budget"]
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Ozark Flagship", state_code: "MO", dealer_license_no: "MO-DLR-4417", dwell_capacity_minutes: 60000, load_bays_total: 4 }
              as: PlatformAdmin
              captures: { st_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /stores/${st_id}/event-offerings"
              payload: { offering_kind: "SEMINAR", title: "Cold Water Safety", starts_at_utc: "2026-10-02T10:00:00Z", ends_at_utc: "2026-10-02T12:00:00Z", registration_cap: 30 }
              as: EventsCoordinator
              captures: { ev_id: $.data.id }
            - call: "POST /stores/${st_id}/event-offerings"
              payload: { offering_kind: "KIDS_WORKSHOP", title: "Bait Tying", starts_at_utc: "2026-10-03T10:00:00Z", ends_at_utc: "2026-10-03T11:30:00Z", registration_cap: 31 }
              as: EventsCoordinator
              captures: { ev2_id: $.data.id }
          trigger:
            - call: "POST /stores/event-offerings/${ev_id}/publish"
              payload: {}
              as: EventsCoordinator
            - call: "GET /stores/event-offerings/${ev_id}"
              as: EventsCoordinator
            - call: "POST /stores/event-offerings/${ev2_id}/publish"
              payload: {}
              as: EventsCoordinator
            - call: "GET /stores/event-offerings/${ev2_id}"
              as: EventsCoordinator
          assert:
            - "EventOffering.${ev_id}.dwell_charge_minutes == 23 for cap 30, which is round_half_up(15 * 0.5 + 15 * 1.0) rounded once at the sum"
            - "EventOffering.${ev2_id}.dwell_charge_minutes == 24 for cap 31, which is round_half_up(16 * 0.5 + 15 * 1.0)"
            - "the two results differ by exactly 1 minute even though the caps differ by 1, so the doubling in the overflow half is what governs the step"
            - "neither offering reports a fractional dwell value, so the single rounding gate is applied"

      - name: club_points_replay_is_chronological_and_floors_at_zero
        claim_type: correct_result
        grounds:
          - calculations.club_points_apply
          - calculations.tier_threshold_eval
          - entities.Member.fields.points_balance
        distinguishing_aspect: "The point replay processes events in created_at order with created_seq as the tie-break and clamps at zero, so a redemption larger than the running balance saturates rather than going negative."
        test_recipe:
          setup: ["a store and one member"]
          setup_api_calls:
            - call: "POST /stores"
              payload: { name: "Ozark Flagship", state_code: "MO", dealer_license_no: "MO-DLR-4417", dwell_capacity_minutes: 60000, load_bays_total: 4 }
              as: PlatformAdmin
              captures: { st_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /stores/${st_id}/members"
              payload: { email: "m_rp@x.com", full_name: "Rhea Pell", donation_opt_in: false }
              as: Anonymous
              captures: { m_id: $.data.id }
            - call: "POST /stores/${st_id}/point-events"
              payload: { member_id: "${m_id}", event_kind: "AWARD", points_delta: 500 }
              as: ClubCardSpecialist
              captures: { pe_id: $.data.id }
          trigger:
            - call: "POST /stores/${st_id}/point-events"
              payload: { member_id: "${m_id}", event_kind: "REDEEM", points_delta: -800 }
              as: ClubCardSpecialist
              captures: { pe2_id: $.data.id }
            - call: "GET /stores/members/${m_id}"
              as: StoreManager
          assert:
            - "Member.${m_id}.points_balance == 0, floored at zero rather than negative by 300"
            - "Member.${m_id}.points_lifetime_earned == 500, because a REDEEM does not reduce lifetime earnings"
            - "Member.${m_id}.club_tier == BASE, below the 8000 SILVER threshold"
            - "the redemption is recorded: PointEvent.${pe2_id}.points_delta == -800 and PointEvent.${pe2_id}.event_kind == REDEEM"

