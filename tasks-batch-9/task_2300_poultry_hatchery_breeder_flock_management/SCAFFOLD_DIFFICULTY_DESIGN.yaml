            - {call: "POST /setter-loads/${s1}/start", payload: {}, as: IncubationOperator}
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2026-08-02T02:00:00Z"}, as: HatcheryManager}
            - {call: "POST /setter-loads/${s1}/environment-readings", payload: {recorded_at: "2026-08-01T18:00:00Z", temp_c: 38.6, humidity_pct: 55.0}, as: IncubationOperator}
            - {call: "POST /setter-loads/${s1}/environment-readings", payload: {recorded_at: "2026-08-01T22:00:00Z", temp_c: 38.6, humidity_pct: 55.0}, as: IncubationOperator}
            - {call: "POST /setter-loads/${s1}/candle", payload: {fertile_count: 9600}, as: IncubationOperator}
            - {call: "POST /incubation-units", payload: {code: "U2", unit_type: "HATCHER", capacity_eggs: 20000}, as: HatcheryManager, captures: {u2: "$.data.id"}}
            - {call: "POST /incubation-units/${u2}/sanitize", payload: {}, as: IncubationOperator}
          trigger:
            - {call: "POST /setter-loads/${s1}/transfer", payload: {hatcher_unit_id: "${u2}"}, as: IncubationOperator}
            - {call: "POST /setter-loads/${s1}/environment-readings", payload: {recorded_at: "2026-08-02T00:00:00Z", temp_c: 37.8, humidity_pct: 55.0}, as: IncubationOperator}
            - {call: "POST /setter-loads/${s1}/abort", payload: {reason: "ENVIRONMENT_DEVIATION"}, as: HatcheryManager}
          assert:
            - "Before the trigger: SetterLoad.${s1}.status == CANDLED, environment_status == DEVIATION_OPEN, deviation_degree_hours == 2.000, deviation_opened_at == 2026-08-01T22:00:00Z"
            - "First call: HTTP 422 with error.code == ERR_ENVIRONMENT_DEVIATION_OPEN; no HatcherLoad is created and IncubationUnit.${u2}.occupancy_status stays FREE"
            - "IncubationUnit.${u1}.occupancy_status is still OCCUPIED and EggLot.${la}.status is still SET after the rejected transfer"
            - "Second call: HTTP 409 with error.code == ERR_INCUBATION_INVALID_STATE, because readings are only accepted while INCUBATING - the deviation can never be resolved now"
            - "Third call: HTTP 200, SetterLoad.${s1}.status == ABORTED; EggLot.${la}.status == CONDEMNED with condemned_reason == LOAD_ABORTED; IncubationUnit.${u1}.occupancy_status == FREE"
            - "SetterLoad.${s1}.environment_status remains DEVIATION_OPEN and deviation_degree_hours remains 2.000 after the abort (the dimension is never reset)"

  - rule_id: resource_temporal_overlap
    instances:
      - name: setter_unit_closed_window_touch_conflicts
        grounds:
          - calculations.unit_and_farm_window_occupancy
          - validations.priority_38.ERR_UNIT_WINDOW_CONFLICT
          - endpoints.POST_/setter-loads
          - entities.IncubationProfile.fields.total_hours
        distinguishing_aspect: |
          The unit window is a CLOSED interval extended by SETTER_TURNAROUND_HOURS, so a load planned
          for exactly busy_to (2026-08-23T06:00:00Z = set + 504 h + 12 h) conflicts, while one hour
          later is accepted. The same instant is simultaneously accepted on a different setter,
          proving the interval is per-unit and that the turnaround buffer, not the profile length
          alone, sets the boundary.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T12:00:00Z; profile PR1 has total_hours 504 and SETTER_TURNAROUND_HOURS is 12."
            - "Setter U1 already holds PLANNED load A with planned_set_at 2026-08-01T18:00:00Z, so its busy interval ends at 2026-08-23T06:00:00Z inclusive."
            - "A second empty setter U2 exists for the cross-unit control."
          setup_api_calls:
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2026-08-01T12:00:00Z"}, as: HatcheryManager}
            - {call: "POST /incubation-units", payload: {code: "U1", unit_type: "SETTER", capacity_eggs: 20000}, as: HatcheryManager, captures: {u1: "$.data.id"}}
            - {call: "POST /incubation-units", payload: {code: "U2", unit_type: "SETTER", capacity_eggs: 20000}, as: HatcheryManager, captures: {u2: "$.data.id"}}
            - {call: "POST /incubation-profiles", payload: {code: "PR1", breed: "ROSS_308", transfer_hours: 456, total_hours: 504, stages: [{from_hour: 0, to_hour: 240, temp_c: 37.8, humidity_pct: 55.0}, {from_hour: 240, to_hour: 456, temp_c: 37.5, humidity_pct: 52.0}, {from_hour: 456, to_hour: 504, temp_c: 36.9, humidity_pct: 65.0}]}, as: HatcheryManager, captures: {pr1: "$.data.id"}}
            - {call: "POST /setter-loads", payload: {unit_id: "${u1}", profile_id: "${pr1}", planned_set_at: "2026-08-01T18:00:00Z"}, as: IncubationOperator, captures: {sa: "$.data.id"}}
          trigger:
            - {call: "POST /setter-loads", payload: {unit_id: "${u1}", profile_id: "${pr1}", planned_set_at: "2026-08-23T06:00:00Z"}, as: IncubationOperator}
            - {call: "POST /setter-loads", payload: {unit_id: "${u1}", profile_id: "${pr1}", planned_set_at: "2026-08-23T07:00:00Z"}, as: IncubationOperator, captures: {sc: "$.data.id"}}
            - {call: "POST /setter-loads", payload: {unit_id: "${u2}", profile_id: "${pr1}", planned_set_at: "2026-08-23T06:00:00Z"}, as: IncubationOperator, captures: {sd: "$.data.id"}}
          assert:
            - "First call: HTTP 409 with error.code == ERR_UNIT_WINDOW_CONFLICT (touching the closed endpoint 2026-08-23T06:00:00Z conflicts)"
            - "Second call: HTTP 201, SetterLoad.${sc}.status == PLANNED with planned_set_at 2026-08-23T07:00:00Z"
            - "Third call: HTTP 201 on unit ${u2} at the very instant rejected on ${u1}: SetterLoad.${sd}.status == PLANNED"
            - "GET /setter-loads?unit_id=${u1} returns total_count 2 (load ${sa} and load ${sc}); the rejected load was never persisted"
            - "GET /setter-loads?unit_id=${u2} returns total_count 1"

      - name: farm_cycle_halfopen_aggregate_capacity
        grounds:
          - calculations.unit_and_farm_window_occupancy
          - validations.priority_39.ERR_FARM_CAPACITY_EXCEEDED
          - state_machines.GrowerPlacementOrder.REQUESTED_to_CONFIRMED
          - entities.GrowerFarm.fields.capacity_chicks
        distinguishing_aspect: |
          The farm cycle is HALF-OPEN, the opposite convention from the unit window in the same
          calculation: an order placed exactly FARM_CYCLE_DAYS (21) after a confirmed one shares no
          capacity and confirms, while one placed a single day earlier overlaps and is rejected. The
          rejection is purely aggregate - every individual order is well inside the 8000-chick
          capacity.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T12:00:00Z; farm FM1 has capacity_chicks 8000 and is CLEARED."
            - "Order O1 for 5000 chicks on 2026-08-22 is CONFIRMED, occupying the half-open cycle [2026-08-22, 2026-09-12)."
            - "Orders O2 (4250 on 2026-08-23), O3 (3000 on 2026-09-12) and O4 (3000 on 2026-09-11) are created but not yet confirmed."
          setup_api_calls:
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2026-08-01T12:00:00Z"}, as: HatcheryManager}
            - {call: "POST /grower-farms", payload: {code: "FM1", operator_user_id: "u_grower_1", capacity_chicks: 8000}, as: HatcheryManager, captures: {fm1: "$.data.id"}}
            - {call: "POST /grower-farms/${fm1}/clear", payload: {}, as: Veterinarian}
            - {call: "POST /placement-orders", payload: {farm_id: "${fm1}", requested_breed: "ROSS_308", requested_placement_date: "2026-08-22T00:00:00Z", requested_chicks: 5000}, as: HatcheryManager, captures: {o1: "$.data.id"}}
            - {call: "POST /placement-orders/${o1}/confirm", payload: {}, as: HatcheryManager}
            - {call: "POST /placement-orders", payload: {farm_id: "${fm1}", requested_breed: "ROSS_308", requested_placement_date: "2026-08-23T00:00:00Z", requested_chicks: 4250}, as: HatcheryManager, captures: {o2: "$.data.id"}}
            - {call: "POST /placement-orders", payload: {farm_id: "${fm1}", requested_breed: "ROSS_308", requested_placement_date: "2026-09-12T00:00:00Z", requested_chicks: 3000}, as: HatcheryManager, captures: {o3: "$.data.id"}}
            - {call: "POST /placement-orders", payload: {farm_id: "${fm1}", requested_breed: "ROSS_308", requested_placement_date: "2026-09-11T00:00:00Z", requested_chicks: 3000}, as: HatcheryManager, captures: {o4: "$.data.id"}}
          trigger:
            - {call: "POST /placement-orders/${o2}/confirm", payload: {}, as: HatcheryManager}
            - {call: "POST /placement-orders/${o3}/confirm", payload: {}, as: HatcheryManager}
            - {call: "POST /placement-orders/${o4}/confirm", payload: {}, as: HatcheryManager}
          assert:
            - "First call: HTTP 422 with error.code == ERR_FARM_CAPACITY_EXCEEDED (5000 + 4250 = 9250 > 8000 across overlapping cycles); GrowerPlacementOrder.${o2}.status stays REQUESTED"
            - "Second call: HTTP 200, GrowerPlacementOrder.${o3}.status == CONFIRMED - the cycle [2026-09-12, 2026-10-03) only touches O1's cycle end and the half-open convention means no overlap"
            - "Third call: HTTP 422 with error.code == ERR_FARM_CAPACITY_EXCEEDED - one day earlier, O4's cycle overlaps BOTH O1 and O3, giving 5000 + 3000 + 3000 = 11000 > 8000"
            - "Every individual order is under the 8000 capacity on its own, so the failures are aggregate-only"
            - "GET /placement-orders?farm_id=${fm1} returns total_count 4 with statuses CONFIRMED, REQUESTED, CONFIRMED, REQUESTED for O1..O4"
            - "GrowerFarm.${fm1}.capacity_chicks is never mutated by any of the three calls"

  - rule_id: compensating_invariant
    instances:
      - name: egg_conservation_across_void_and_restore
        grounds:
          - calculations.conservation_invariants
          - state_machines.SetterLoad.PLANNED_to_ABORTED
          - entities.SetterLoadItem.fields.item_status
          - state_machines.EggLot.ALLOCATED_to_IN_STORAGE
        distinguishing_aspect: |
          Aborting a PLANNED load must restore the exact drawn quantities to two different lots and
          step both back from ALLOCATED to IN_STORAGE while KEEPING the voided items' eggs_taken for
          audit: settable_count == eggs_remaining + sum(ACTIVE item eggs_taken) has to hold before,
          during and after the compensation. A subsequent full 6200-egg draw from the restored lot
          proves the restored pool is real and not just a display value.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T12:00:00Z; flock F1 IN_LAY; lots L1 and L2 each grade to 6200 settable and are stored at 15.0 C."
            - "PLANNED load S1 in setter U1 draws 6000 from L1 and 4000 from L2, so eggs_remaining is 200 and 2200 and total_eggs_set is 10000."
            - "A second setter U2 with a PLANNED load S2 (planned_set_at 2026-08-02T18:00:00Z) is standing by for the re-draw."
          setup_api_calls:
            - {call: "POST /_clock/set_current_utc", payload: {current_utc: "2026-08-01T12:00:00Z"}, as: HatcheryManager}
            - {call: "POST /flock-programs", payload: {code: "P1", breed: "ROSS_308", stimulation_week: 21, lighting_steps: [{age_weeks: 21, photoperiod_hours: 12.0}, {age_weeks: 24, photoperiod_hours: 14.0}, {age_weeks: 30, photoperiod_hours: 16.0}], feed_steps: [{age_weeks: 21, feed_grams_per_hen_day: 150.0}, {age_weeks: 26, feed_grams_per_hen_day: 168.0}]}, as: HatcheryManager, captures: {p1: "$.data.id"}}
            - {call: "POST /breeder-flocks", payload: {code: "F1", program_id: "${p1}", breed: "ROSS_308", house_code: "H1", hatch_date: "2026-01-05T00:00:00Z", placed_at: "2026-05-01T00:00:00Z", hen_count: 9000}, as: FlockManager, captures: {f1: "$.data.id"}}
            - {call: "POST /lab-tests", payload: {subject_type: "BREEDER_FLOCK", subject_id: "${f1}", test_code: "SALMONELLA_PULLORUM", collected_at: "2026-07-20T00:00:00Z"}, as: Veterinarian, captures: {t1: "$.data.id"}}
            - {call: "POST /lab-tests/${t1}/release", payload: {result: "NEGATIVE"}, as: Veterinarian}
            - {call: "POST /breeder-flocks/${f1}/start-lay", payload: {}, as: FlockManager}
            - {call: "POST /egg-lots", payload: {flock_id: "${f1}", collected_at: "2026-07-30T00:00:00Z", collected_count: 6500}, as: FlockManager, captures: {l1: "$.data.id"}}
            - {call: "POST /egg-lots/${l1}/grade", payload: {grade_a_count: 6200, cracked_count: 150, dirty_count: 100, small_count: 50}, as: FlockManager}
            - {call: "POST /egg-lots/${l1}/store", payload: {storage_temp_c: 15.0}, as: IncubationOperator, captures: {l1v: "$.data.version"}}
            - {call: "POST /egg-lots", payload: {flock_id: "${f1}", collected_at: "2026-07-31T00:00:00Z", collected_count: 6500}, as: FlockManager, captures: {l2: "$.data.id"}}
            - {call: "POST /egg-lots/${l2}/grade", payload: {grade_a_count: 6200, cracked_count: 150, dirty_count: 100, small_count: 50}, as: FlockManager}
            - {call: "POST /egg-lots/${l2}/store", payload: {storage_temp_c: 15.0}, as: IncubationOperator, captures: {l2v: "$.data.version"}}
            - {call: "POST /incubation-units", payload: {code: "U1", unit_type: "SETTER", capacity_eggs: 20000}, as: HatcheryManager, captures: {u1: "$.data.id"}}
            - {call: "POST /incubation-units", payload: {code: "U2", unit_type: "SETTER", capacity_eggs: 20000}, as: HatcheryManager, captures: {u2: "$.data.id"}}
            - {call: "POST /incubation-profiles", payload: {code: "PR1", breed: "ROSS_308", transfer_hours: 456, total_hours: 504, stages: [{from_hour: 0, to_hour: 240, temp_c: 37.8, humidity_pct: 55.0}, {from_hour: 240, to_hour: 456, temp_c: 37.5, humidity_pct: 52.0}, {from_hour: 456, to_hour: 504, temp_c: 36.9, humidity_pct: 65.0}]}, as: HatcheryManager, captures: {pr1: "$.data.id"}}
            - {call: "POST /setter-loads", payload: {unit_id: "${u1}", profile_id: "${pr1}", planned_set_at: "2026-08-01T18:00:00Z"}, as: IncubationOperator, captures: {s1: "$.data.id"}}
            - {call: "POST /setter-loads/${s1}/items", payload: {egg_lot_id: "${l1}", eggs_taken: 6000, expected_egg_lot_version: "${l1v}"}, as: IncubationOperator, captures: {i1: "$.data.id"}}
            - {call: "POST /setter-loads/${s1}/items", payload: {egg_lot_id: "${l2}", eggs_taken: 4000, expected_egg_lot_version: "${l2v}"}, as: IncubationOperator, captures: {i2: "$.data.id"}}
            - {call: "POST /setter-loads", payload: {unit_id: "${u2}", profile_id: "${pr1}", planned_set_at: "2026-08-02T18:00:00Z"}, as: IncubationOperator, captures: {s2: "$.data.id"}}
          trigger:
            - {call: "POST /setter-loads/${s1}/abort", payload: {reason: "PLAN_CHANGE"}, as: HatcheryManager}
            - {call: "GET /egg-lots/${l1}", payload: {}, as: IncubationOperator, captures: {l1v2: "$.data.version"}}
            - {call: "POST /setter-loads/${s2}/items", payload: {egg_lot_id: "${l1}", eggs_taken: 6200, expected_egg_lot_version: "${l1v2}"}, as: IncubationOperator, captures: {i3: "$.data.id"}}
          assert:
            - "Before the abort: EggLot.${l1}.eggs_remaining == 200, EggLot.${l2}.eggs_remaining == 2200, SetterLoad.${s1}.total_eggs_set == 10000, both lots ALLOCATED"
            - "After the abort: SetterLoad.${s1}.status == ABORTED and total_eggs_set == 0"
            - "SetterLoadItem.${i1}.item_status == VOIDED with eggs_taken still 6000, and SetterLoadItem.${i2}.item_status == VOIDED with eggs_taken still 4000 (audit trail retained)"
            - "EggLot.${l1}.eggs_remaining == 6200 and status == IN_STORAGE; EggLot.${l2}.eggs_remaining == 6200 and status == IN_STORAGE"
            - "Conservation for each lot: settable_count 6200 == eggs_remaining 6200 + sum of ACTIVE item eggs_taken 0"
            - "Re-draw succeeds: HTTP 201, SetterLoadItem.${i3}.eggs_taken == 6200, EggLot.${l1}.eggs_remaining == 0 and status == ALLOCATED, SetterLoad.${s2}.total_eggs_set == 6200"
            - "No lot ever exceeds its settable_count: a second 100-egg draw from ${l1} would now fail with ERR_INSUFFICIENT_SETTABLE_EGGS"

      - name: chick_conservation_across_reverse_and_reallocation
        grounds:
          - calculations.conservation_invariants
          - calculations.chick_allocation_waterfall
          - state_machines.DeliveryAssignment.ASSIGNED_to_REVERSED
          - entities.GrowerPlacementOrder.fields.remaining_need
          - concurrency_rules.chick-batch-allocate-stale-version
        distinguishing_aspect: |
          saleable_count == unassigned_chicks + sum(ASSIGNED and DELIVERED chicks_assigned) must hold
          after allocation, after a reversal, and after re-running the waterfall - and the re-run must
