            - call: "POST /valuation-opinions/${cr_id}/status"
              payload: { target_status: "SUBMITTED" }
              as: ValuationAnalyst
              as_user_id: "va-1"
            - call: "POST /valuation-opinions/${cr_id}/status"
              payload: { target_status: "ACCEPTED" }
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /acquisitions/${acq_id}/status"
              payload: { target_status: "BOARD_REVIEW" }
              as: DealLead
              as_user_id: "dl-1"
            - call: "POST /payer-contracts"
              payload: { acquisition_id: "${acq_id}", payer_name: "Aetna Choice", payer_type: "COMMERCIAL", contract_form: "CONSENT_REQUIRED", notice_days_required: 0, effective_on: "2026-11-01", terminates_on: "2027-10-31", annual_revenue_share_bps: 4000, committee_slots_per_cycle: 2 }
