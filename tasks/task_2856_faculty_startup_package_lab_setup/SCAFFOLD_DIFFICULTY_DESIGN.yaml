              payload: { name: "Department of Chemistry", unit_type: "DEPARTMENT", parent_unit_id: "${col6_id}", cost_share_pool_cents: 400000000 }
              as: DeanOffice
              captures: { dept6_id: $.data.id }
            - call: "POST /funding-units"
              payload: { name: "Dean Office Strategic Pool", unit_type: "DEAN_OFFICE", parent_unit_id: "${col6_id}", cost_share_pool_cents: 300000000 }
              as: DeanOffice
              captures: { dean6_id: $.data.id }
            - call: "POST /faculty"
