  # ============================================== CROSS-CUTTING COMPLEXITY LAYERS
  - section: cross_cutting_complexity_layers
    instances:

      - name: stale_expected_program_version_on_a_second_reservation_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[reservation-create-stale-program]
          - endpoints[POST /library/programs/{program_id}/reservations]
          - errors[ERR_STALE_PROGRAM_VERSION]
        distinguishing_aspect: "Replaying the version observed before the first reservation returns ERR_STALE_PROGRAM_VERSION (412) and changes nothing, while the same call with the refreshed version supersedes the HELD reservation and lifts Program.version by one more."
        test_recipe:
          setup:
            - "One DRAFT program and one AVAILABLE room; the version read at program creation is retained."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00.000Z" }
              as: ProgramManager
            - call: "POST /library/branches"
              payload: { name: "Central Library", branch_code: "CEN", overlapping_program_capacity: 2, per_program_fee_cap_cents: 150000 }
              as: ProgramManager
              captures: { br: $.data.id }
            - call: "POST /library/branches/${br}/rooms"
              payload: { room_name: "Story Room", capacity_seats: 60, min_setup_minutes: 15, min_teardown_minutes: 15 }
              as: ProgramManager
              captures: { room: $.data.id }
            - call: "POST /library/programs"
