          assert:
            - "BuildToSuitPlan.${plan_id}.provisional_base_rate_psf == 10.08 (12600000.00*0.08/100000)"
            - "BuildToSuitPlan.${plan_id}.commission_cost_estimate == 214064.36 (0.04 * provisional aggregate 5351608.90)"
            - "BuildToSuitPlan.${plan_id}.total_project_cost == 12814064.36"
            - "BuildToSuitPlan.${plan_id}.converted_base_rate_psf == 10.25 and yield_on_cost == 0.0800"

  - rule_id: non_linear_state_machine
    instances:
      - name: loi_counter_cycle_rounds
        grounds:
          - state_machines.LOI.SUBMITTED_to_COUNTERED
          - state_machines.LOI.COUNTERED_to_SUBMITTED
          - concurrency_rules[loi-counter-stale-version]
        distinguishing_aspect: |
          LOI is cyclic (SUBMITTED -> COUNTERED -> SUBMITTED -> COUNTERED): two full
          negotiation rounds drive negotiation_round 1->2->3->4 and the recomputed NER
          tracks the standing counter terms (4.81 after counter 1, 5.94 after counter 2) —
          a non-linear machine on LOI, distinct from the ComplianceReview cycle.
        test_recipe:
          setup:
            - "LOI_A created in DRAFT on toured SITE_A (asking 6.00)"
          setup_api_calls:
            - { call: "POST /api/tenant-requirements", payload: { tenant_name: "Acme Distribution", use_type: DISTRIBUTION, min_sf: 90000, max_sf: 120000, min_clear_height_ft: 32, min_dock_doors: 16, min_power_amps: 3000, min_yard_depth_ft: 150, target_submarket: "Inland Empire", required_delivery_date: "2027-01-01T00:00:00Z" }, as: TenantRep, as_user_id: rep-001, captures: { req_id: $.data.id } }
            - { call: "POST /api/sites", payload: { site_name: "Ridge Logistics Center", submarket: "Inland Empire", parcel_type: EXISTING, total_sf: 200000, clear_height_ft: 36, dock_doors: 20, power_amps: 4000, yard_depth_ft: 200, zoning_designation: "M-1", environmental_phase: PHASE_I_COMPLETE, asking_rate_psf: 6.00 }, as: LeasingManager, captures: { site_id: $.data.id } }
            - { call: "POST /api/tours", payload: { site_id: "${site_id}", requirement_id: "${req_id}", start_at: "2026-08-10T10:00:00Z", end_at: "2026-08-10T11:00:00Z" }, as: TenantRep, as_user_id: rep-001, captures: { tour_id: $.data.id } }
            - { call: "POST /api/tours/${tour_id}/confirm", as: LeasingManager }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T11:00:00Z" }, as: AssetManager }
            - { call: "POST /api/tours/${tour_id}/complete", as: TenantRep, as_user_id: rep-001 }
            - { call: "POST /api/lois", payload: { requirement_id: "${req_id}", site_id: "${site_id}", term_years: 5, leased_sf: 100000, base_rate_psf: 8.00, ti_allowance_psf: 10.00, free_rent_months: 6, escalation_pct: 0.03 }, as: TenantRep, as_user_id: rep-001, captures: { loi_id: $.data.id, loi_v: $.data.version } }
          trigger:
            - { call: "POST /api/lois/${loi_id}/submit", payload: { expected_loi_version: "${loi_v}" }, as: TenantRep, as_user_id: rep-001, captures: { loi_v2: $.data.version } }
            - { call: "POST /api/lois/${loi_id}/counter", payload: { expected_loi_version: "${loi_v2}", base_rate_psf: 7.50, ti_allowance_psf: 12.00, free_rent_months: 6, escalation_pct: 0.03 }, as: LeasingManager, captures: { loi_v3: $.data.version, ner_c1: $.data.net_effective_rent_psf } }
            - { call: "POST /api/lois/${loi_id}/submit", payload: { expected_loi_version: "${loi_v3}" }, as: TenantRep, as_user_id: rep-001, captures: { loi_v4: $.data.version } }
            - { call: "POST /api/lois/${loi_id}/counter", payload: { expected_loi_version: "${loi_v4}", base_rate_psf: 8.25, ti_allowance_psf: 10.00, free_rent_months: 6, escalation_pct: 0.03 }, as: LeasingManager, captures: { loi_v5: $.data.version } }
          assert:
            - "after counter 1: LOI.${loi_id}.status == COUNTERED, negotiation_round == 2, net_effective_rent_psf == 4.81"
            - "after resubmit: status == SUBMITTED, negotiation_round == 3"
            - "after counter 2: status == COUNTERED, negotiation_round == 4, net_effective_rent_psf == 5.94, version == 5"
            - "the cycle never terminates the machine: LOI remains negotiable (not REJECTED/WITHDRAWN)"

      - name: compliance_rereview_cycle
        grounds:
          - state_machines.ComplianceReview.FLAGGED_to_IN_REVIEW
          - state_machines.ComplianceReview.IN_REVIEW_to_CLEARED
        distinguishing_aspect: |
          ComplianceReview cycles IN_REVIEW -> FLAGGED -> IN_REVIEW -> CLEARED (re-review
          loop on a different entity than LOI), and CLEARED is terminal: a further resolve
          from CLEARED is rejected with ERR_INVALID_STATE.
        test_recipe:
          setup:
            - "REQ_A and SITE_A exist; a ZONING_USE review created (PENDING)"
          setup_api_calls:
            - { call: "POST /api/tenant-requirements", payload: { tenant_name: "Acme Distribution", use_type: DISTRIBUTION, min_sf: 90000, max_sf: 120000, min_clear_height_ft: 32, min_dock_doors: 16, min_power_amps: 3000, min_yard_depth_ft: 150, target_submarket: "Inland Empire", required_delivery_date: "2027-01-01T00:00:00Z" }, as: TenantRep, as_user_id: rep-001, captures: { req_id: $.data.id } }
            - { call: "POST /api/sites", payload: { site_name: "Ridge Logistics Center", submarket: "Inland Empire", parcel_type: EXISTING, total_sf: 200000, clear_height_ft: 36, dock_doors: 20, power_amps: 4000, yard_depth_ft: 200, zoning_designation: "M-1", environmental_phase: PHASE_I_COMPLETE, asking_rate_psf: 6.00 }, as: LeasingManager, captures: { site_id: $.data.id } }
            - { call: "POST /api/compliance-reviews", payload: { site_id: "${site_id}", requirement_id: "${req_id}", review_type: ZONING_USE }, as: ComplianceOfficer, captures: { rev_id: $.data.id } }
          trigger:
            - { call: "POST /api/compliance-reviews/${rev_id}/begin", as: ComplianceOfficer }
            - { call: "POST /api/compliance-reviews/${rev_id}/resolve", payload: { outcome: FLAGGED, findings: "outdoor storage conditional use" }, as: ComplianceOfficer }
            - { call: "POST /api/compliance-reviews/${rev_id}/begin", as: ComplianceOfficer }
            - { call: "POST /api/compliance-reviews/${rev_id}/resolve", payload: { outcome: CLEARED, findings: "CUP granted" }, as: ComplianceOfficer, captures: { final_status: $.data.status } }
            - { call: "POST /api/compliance-reviews/${rev_id}/resolve", payload: { outcome: FLAGGED }, as: ComplianceOfficer, captures: { err: $.data.error_id } }
          assert:
            - "review status path observed: PENDING -> IN_REVIEW -> FLAGGED -> IN_REVIEW -> CLEARED"
            - "final_status == CLEARED and findings == 'CUP granted'"
            - "terminal lockdown: resolve from CLEARED -> err == ERR_INVALID_STATE (HTTP 409)"

  - rule_id: transitive_cascade
