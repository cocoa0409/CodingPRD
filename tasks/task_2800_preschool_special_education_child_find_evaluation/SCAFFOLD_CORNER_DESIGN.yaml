      - name: a_pending_or_granted_notice_blocks_a_reissue_while_a_refusal_falls_through
        claim_type: cascading_validation
        grounds:
          - validations[priority=28]
          - validations[priority=11]
        distinguishing_aspect: |
          Re-issuing the consent packet is answered by whichever of two rules the
          referral's consent record selects. A PENDING record and a GRANTED
          record both produce ERR_CONSENT_ALREADY_REQUESTED even though the
          intake dimension has already left RECEIVED; a REFUSED record leaves no
          blocking row, so the same request falls through to the priority-11
          state rule and reports ERR_INVALID_REFERRAL_STATE for intake DECLINED.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Three referred children: A's notice is PENDING, B's is GRANTED, C's was REFUSED."
          setup_api_calls:
            - call: "POST /child-find/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: DistrictAdmin
