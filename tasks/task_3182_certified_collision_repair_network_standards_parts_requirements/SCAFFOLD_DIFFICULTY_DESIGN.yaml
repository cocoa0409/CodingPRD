      - call: POST /network/repair-orders/${order_id}/pass-qc
        payload: {}
        as: ShopManager
        as_user_id: ${shop_id}
      trigger:
      - call: POST /network/_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-04T08:00:00Z'
        as: NetworkAdmin
      - call: GET /network/shops/${shop_id}
        as: NetworkAdmin
      assert:
      - RepairOrder.${order_id}.status == WARRANTY_ACTIVE after the 24h delivery grace sweep
      - 'Shop.${shop_id}.warranty_reserve_cents == 8500 (tiered base 5000; 5000*1.5=7500 rounded -> 7500; + 2*500 rework penalty -> 8500; pinned order: round BEFORE penalty)'
      - RepairOrder.${order_id}.rework_count == 2
- rule_id: non_linear_state_machine
  instances:
  - name: repair_order_qc_rework_cycle_bounded
    grounds:
    - state_machines.RepairOrder.QC_to_REWORK
    - state_machines.RepairOrder.REWORK_to_QC
    - errors[ERR_MAX_REWORK]
    distinguishing_aspect: "RepairOrder cycles QC -> REWORK -> QC repeatedly with rework_count\nincremented per loop and the cycle bounded at MAX_REWORK (3) \u2014 a cyclic\nstate machine on RepairOrder.\n"
    test_recipe:
      setup:
      - CERTIFIED shop with technician; non-ADAS order (2015) driven to QC
      setup_api_calls:
      - call: POST /network/shops
        payload:
          legal_name: Cycle Body
          state_code: WA
          zip_code: '98101'
          latitude: 47.61
          longitude: -122.33
          structural_capability: false
        as: NetworkAdmin
        captures:
          shop_id: $.data.id
          shop_v: $.data.version
      - call: POST /network/shops/${shop_id}/certification-cycles
        payload:
          window_start: '2026-09-01T00:00:00Z'
          window_end: '2027-08-31T23:59:59Z'
        as: NetworkAdmin
        captures:
