          - state_machines.Unit.RESERVED_to_AVAILABLE
          - entities.ApplicationCampaign.fields.waitlist_active_count
        distinguishing_aspect: |
          Depth-3 chain from the DECLINE trigger: offer -> DECLINED (A) mutates
          entry.refusal_count +1 (B); B's threshold crossing itself flips entry -> REMOVED
          (C); C recomputes campaign.waitlist_active_count to 0 (D) — each link caused by the
          previous one, not a fan-out. Trigger distinct from the purge cascade.
