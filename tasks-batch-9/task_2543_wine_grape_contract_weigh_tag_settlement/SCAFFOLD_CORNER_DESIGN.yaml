        distinguishing_aspect: |
          id, created_at, updated_at and version are server-owned on every
          common_fields entity. A create that supplies all four plus a computed
          reliability score must ignore every one of them: the id is server-generated,
          the timestamps come from the logical clock, version starts at 1, and the
          score is derived.
        test_recipe:
          setup:
            - "Empty database with the clock pinned at 2026-08-01T00:00:00Z."
          setup_api_calls:
