              as: Inspector
              as_user_id: "${i1}"
            - call: "POST /msha/citations"
              payload: { inspection_id: "${insp1}", mine_id: "${m_id}", standard_code: "30 CFR 75.400", kind: "CITATION", negligence: "MODERATE", gravity_likelihood: "UNLIKELY", gravity_severity: "NO_INJURY", persons_affected: 1, significant_and_substantial: false, repeat_violation: false }
