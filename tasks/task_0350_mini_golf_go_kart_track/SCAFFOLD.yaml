# =============================================================================
# Mini-Golf & Go-Kart Track — benchmark seed tables (v1)
# Tier: EXPERT (§0.4)
# =============================================================================

scenario: "Mini-Golf & Go-Kart Track: attraction inventory & heat/lane capacity, per-round/per-heat & wristband pricing, timed session & waitlist, height/safety waiver, party package & group, combo pass & arcade card, weather closure, walk-in vs reservation"

domain_name: mini-golf-go-kart-track
api_prefix: /

# =============================================================================
# Complexity Profile (§0.1–§0.4)
# =============================================================================
complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - derived_field_reconciliation

  entity_topology: flat
  # Peer entities linked by foreign keys (no nesting in URL paths). Venue,
  # Attraction, Heat, TeeSession, Guest, Wallet, ComboPass, PartyGroup, Booking
  # are all top-level collections; references live in request bodies as FKs.

  state_machine_shape: posture_driven
  # Venue.posture (OPEN / WEATHER_HOLD / CLOSED) gates all child slot/booking ops;
  # Booking carries a cyclic CONFIRMED<->WAITLISTED axis; PartyGroup is compound.

  relationship_patterns:
    - one_to_many        # Venue->Attraction, Attraction->Heat/TeeSession, Guest->Waiver
    - cross_aggregate    # Booking references Guest, Slot, PricingPlan, ComboPass across aggregates
    - many_to_many       # PartyGroup <-> Booking via group_id back-reference

  role_model: peer_roles
  # Guest owns own bookings/wallet; Cashier handles walk-ins & redemptions;
  # OpsManager controls venue posture, attractions, pricing, slot creation.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Venue
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: name, type: string, source: input, description: "Venue display name" }
      - { name: timezone, type: string, source: input, description: "IANA tz, e.g. America/New_York", default: "America/New_York" }
      - { name: posture, type: enum, source: computed, description: "OPEN | WEATHER_HOLD | CLOSED — gates all slot/booking ops", constraints: "values: OPEN, WEATHER_HOLD, CLOSED; initial OPEN" }
      - { name: weather_hold_reason, type: string, source: system, description: "Reason captured when posture set to WEATHER_HOLD; null otherwise", default: null }
      - { name: current_utc, type: datetime, source: system, description: "Server clock as last set by /venues/{id}/_clock/set_current_utc; defaults to creation wall time" }
      - { name: open_slot_count, type: integer, source: computed, description: "Count of Heat+TeeSession on this venue with status OPEN" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC, 3 fractional digits" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation incl. cascades" }
      - { name: version, type: integer, source: system, description: "OCC version, starts at 1, +1 per mutation" }

  - name: Attraction
    parent: Venue
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: venue_id, type: string, source: input, description: "FK -> Venue.id" }
      - { name: name, type: string, source: input, description: "Attraction display name" }
      - { name: kind, type: enum, source: input, description: "GO_KART | MINI_GOLF | ARCADE", constraints: "values: GO_KART, MINI_GOLF, ARCADE" }
      - { name: min_height_cm, type: integer, source: input, description: "Minimum guest height for safety; 0 if none", default: 0 }
      - { name: lane_count, type: integer, source: input, description: "Lanes available per heat (GO_KART); ignored for others", default: 0 }
      - { name: status, type: enum, source: system, description: "ACTIVE (attractions are created ACTIVE and stay ACTIVE in v1)", constraints: "values: ACTIVE; initial ACTIVE" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation" }
      - { name: version, type: integer, source: system, description: "OCC version" }

  - name: PricingPlan
    parent: Venue
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: venue_id, type: string, source: input, description: "FK -> Venue.id" }
      - { name: name, type: string, source: input, description: "Pricing plan label" }
      - { name: mode, type: enum, source: input, description: "PER_ROUND | PER_HEAT | WRISTBAND", constraints: "values: PER_ROUND, PER_HEAT, WRISTBAND" }
      - { name: base_price_cents, type: integer, source: input, description: "Per-round (mini-golf round) or per-heat (go-kart heat) unit price; for WRISTBAND the flat per-player band price" }
      - { name: peak_surcharge_cents, type: integer, source: input, description: "Flat surcharge added per unit when slot window is PEAK", default: 0 }
      - { name: group_discount_pct, type: number, source: input, description: "Decimal 0..0.5 discount applied when party_size >= GROUP_MIN_SIZE", default: 0 }
      - { name: wristband_unit_cap, type: integer, source: input, description: "Max units a single WRISTBAND covers in one booking; 0 = unlimited; ignored for non-WRISTBAND", default: 0 }
      - { name: status, type: enum, source: system, description: "ACTIVE (pricing plans are created ACTIVE and stay ACTIVE in v1)", constraints: "values: ACTIVE; initial ACTIVE" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation" }
      - { name: version, type: integer, source: system, description: "OCC version" }

  - name: Heat
    parent: Attraction
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: venue_id, type: string, source: input, description: "FK -> Venue.id" }
      - { name: attraction_id, type: string, source: input, description: "FK -> Attraction.id; the attraction must be GO_KART" }
      - { name: start_utc, type: datetime, source: input, description: "Heat start (inclusive)" }
      - { name: end_utc, type: datetime, source: input, description: "Heat end (exclusive); a heat cannot overlap another on the same attraction (half-open)" }
      - { name: window, type: enum, source: input, description: "OFF_PEAK | PEAK — drives peak surcharge", constraints: "values: OFF_PEAK, PEAK", default: "OFF_PEAK" }
      - { name: lane_capacity, type: integer, source: system, description: "Snapshot of attraction.lane_count at heat creation" }
      - { name: lanes_committed, type: integer, source: computed, description: "Sum of party_size over CONFIRMED+CHECKED_IN bookings on this heat" }
      - { name: lanes_available, type: integer, source: computed, description: "lane_capacity - lanes_committed, never negative" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | OPEN | CLOSED | CANCELLED", constraints: "values: SCHEDULED, OPEN, CLOSED, CANCELLED; initial SCHEDULED" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation" }
      - { name: version, type: integer, source: system, description: "OCC version" }

  - name: TeeSession
    parent: Attraction
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: venue_id, type: string, source: input, description: "FK -> Venue.id" }
      - { name: attraction_id, type: string, source: input, description: "FK -> Attraction.id; the attraction must be MINI_GOLF" }
      - { name: start_utc, type: datetime, source: input, description: "Tee session start (inclusive)" }
      - { name: end_utc, type: datetime, source: input, description: "Tee session end (inclusive); two sessions on the same attraction must be separated by a turnover buffer of TURNOVER_GAP_MINUTES (gap-based overlap semantics, distinct from Heat half-open)" }
      - { name: window, type: enum, source: input, description: "OFF_PEAK | PEAK", constraints: "values: OFF_PEAK, PEAK", default: "OFF_PEAK" }
      - { name: party_slot_capacity, type: integer, source: input, description: "Max total players across all bookings in this session" }
      - { name: players_committed, type: integer, source: computed, description: "Sum of party_size over CONFIRMED+CHECKED_IN bookings on this session" }
      - { name: players_available, type: integer, source: computed, description: "party_slot_capacity - players_committed, never negative" }
      - { name: status, type: enum, source: system, description: "SCHEDULED | OPEN | CLOSED | CANCELLED", constraints: "values: SCHEDULED, OPEN, CLOSED, CANCELLED; initial SCHEDULED" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation" }
      - { name: version, type: integer, source: system, description: "OCC version" }

  - name: Guest
    parent: null
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: full_name, type: string, source: input, description: "Guest name" }
      - { name: height_cm, type: integer, source: input, description: "Guest height in cm, used for safety gating" }
      - { name: birthdate, type: string, source: input, description: "ISO date; used only to derive minor status (age < MINOR_AGE_YEARS) for waiver", default: null }
      - { name: waiver_status, type: enum, source: computed, description: "NONE | SIGNED | EXPIRED — derived from latest Waiver vs venue current_utc", constraints: "values: NONE, SIGNED, EXPIRED; initial NONE" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation" }
      - { name: version, type: integer, source: system, description: "OCC version" }

  - name: Waiver
    parent: Guest
    common_fields: false
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: guest_id, type: string, source: input, description: "FK -> Guest.id" }
      - { name: signed_at, type: datetime, source: system, description: "When the waiver was signed (venue current_utc at signing)" }
      - { name: expires_at, type: datetime, source: system, description: "signed_at + WAIVER_VALID_DAYS; waiver invalid once current_utc >= expires_at" }
      - { name: guardian_name, type: string, source: input, description: "Guardian signer for minors; required when guest is a minor", default: null }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC" }

  - name: Wallet
    parent: Guest
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: guest_id, type: string, source: input, description: "FK -> Guest.id (one wallet auto-created per guest)" }
      - { name: arcade_card_balance_cents, type: integer, source: computed, description: "Stored value on the arcade card; debited on arcade redemption / party deposit, credited on top-up / draft refund" }
      - { name: total_loaded_cents, type: integer, source: computed, description: "Lifetime sum of top-ups; loyalty bonus credits excluded" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation" }
      - { name: version, type: integer, source: system, description: "OCC version" }

  - name: ComboPass
    parent: Guest
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: guest_id, type: string, source: input, description: "FK -> Guest.id" }
      - { name: total_credits, type: integer, source: input, description: "Combo activity credits purchased; 1 credit = 1 booking activity unit" }
      - { name: credits_redeemed, type: integer, source: computed, description: "Credits consumed (drawn at booking check-in) against this pass" }
      - { name: credits_remaining, type: integer, source: computed, description: "total_credits - credits_redeemed, never negative" }
      - { name: status, type: enum, source: system, description: "ACTIVE | EXHAUSTED", constraints: "values: ACTIVE, EXHAUSTED; initial ACTIVE; -> EXHAUSTED when credits_remaining reaches 0 at booking check-in" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation" }
      - { name: version, type: integer, source: system, description: "OCC version" }

  - name: PartyGroup
    parent: Venue
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: venue_id, type: string, source: input, description: "FK -> Venue.id" }
      - { name: host_guest_id, type: string, source: input, description: "FK -> Guest.id (party host; deposit debited from this guest's wallet)" }
      - { name: package_name, type: string, source: input, description: "Party package label" }
      - { name: included_unit_count, type: integer, source: input, description: "Activity units bundled in the package across all member bookings" }
      - { name: deposit_cents, type: integer, source: input, description: "Deposit debited from host wallet at creation; non-refundable once CONFIRMED" }
      - { name: units_consumed, type: integer, source: computed, description: "Sum of party_size over CONFIRMED+CHECKED_IN member bookings" }
      - { name: status, type: enum, source: system, description: "DRAFT | CONFIRMED | CHECKED_IN | COMPLETED | CANCELLED", constraints: "values: DRAFT, CONFIRMED, CHECKED_IN, COMPLETED, CANCELLED; initial DRAFT" }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation incl. cascades" }
      - { name: version, type: integer, source: system, description: "OCC version" }

  - name: Booking
    parent: Venue
    common_fields: true
    fields:
      - { name: id, type: string, source: system, description: "Server-minted UUID, identity only" }
      - { name: venue_id, type: string, source: input, description: "FK -> Venue.id" }
      - { name: guest_id, type: string, source: input, description: "FK -> Guest.id" }
      - { name: slot_kind, type: enum, source: input, description: "HEAT | TEE_SESSION — which slot type this booking occupies", constraints: "values: HEAT, TEE_SESSION" }
      - { name: heat_id, type: string, source: input, description: "FK -> Heat.id; set when slot_kind=HEAT, else null", default: null }
      - { name: tee_session_id, type: string, source: input, description: "FK -> TeeSession.id; set when slot_kind=TEE_SESSION, else null", default: null }
      - { name: pricing_plan_id, type: string, source: input, description: "FK -> PricingPlan.id" }
      - { name: group_id, type: string, source: input, description: "FK -> PartyGroup.id; null for standalone bookings", default: null }
      - { name: combo_pass_id, type: string, source: input, description: "FK -> ComboPass.id; when set, credits are applied before cash", default: null }
      - { name: origin, type: enum, source: input, description: "RESERVATION | WALK_IN", constraints: "values: RESERVATION, WALK_IN" }
      - { name: party_size, type: integer, source: input, description: "Number of players/karts requested (>=1)" }
      - { name: units, type: integer, source: input, description: "Activity units (rounds/heats); for WRISTBAND folded into band price; capped at wristband_unit_cap", default: 1 }
      - { name: gross_price_cents, type: integer, source: computed, description: "Price before pass credits; PROVISIONAL at HOLD, FINAL at CONFIRMED" }
      - { name: credits_applied, type: integer, source: computed, description: "Combo credits consumed by this booking" }
      - { name: cash_due_cents, type: integer, source: computed, description: "gross_price_cents minus value of credits applied, never negative" }
      - { name: status, type: enum, source: system, description: "HOLD | CONFIRMED | WAITLISTED | CHECKED_IN | COMPLETED | CANCELLED | NO_SHOW", constraints: "values: HOLD, CONFIRMED, WAITLISTED, CHECKED_IN, COMPLETED, CANCELLED, NO_SHOW; initial HOLD" }
      - { name: waitlist_seq, type: integer, source: system, description: "Monotonic per-slot waitlist sequence assigned when WAITLISTED; null otherwise", default: null }
      - { name: created_at, type: datetime, source: system, description: "ISO 8601 UTC; promotion order is created_at ASC then waitlist_seq ASC" }
      - { name: updated_at, type: datetime, source: system, description: "Refreshed on every mutation incl. cascades" }
      - { name: version, type: integer, source: system, description: "OCC version" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Venue
    field: posture
    initial_state: OPEN
    terminal_states: [CLOSED]
    note: "Weather closure gate. WEATHER_HOLD blocks slot open and booking confirm; CLOSED is terminal end-of-life."
    transitions:
      - from: OPEN
        to: WEATHER_HOLD
        trigger: "POST /venues/{venue_id}/weather-hold"
        actor: OpsManager
        preconditions:
          - "venue.posture == OPEN"
        side_effects:
          - "weather_hold_reason set from request"
          - "Every Heat/TeeSession on this venue with status OPEN -> CLOSED (no new bookings accepted)"
          - "WAITLISTED bookings on those just-CLOSED slots -> CANCELLED; CONFIRMED/CHECKED_IN bookings on them stay CONFIRMED/CHECKED_IN (NOT auto-completed)"
          - "increments Venue.version by 1"
      - from: WEATHER_HOLD
        to: OPEN
        trigger: "POST /venues/{venue_id}/resume"
        actor: OpsManager
        preconditions:
          - "venue.posture == WEATHER_HOLD"
        side_effects:
          - "weather_hold_reason cleared to null"
          - "increments Venue.version by 1"
      - from: [OPEN, WEATHER_HOLD]
        to: CLOSED
        trigger: "POST /venues/{venue_id}/close"
        actor: OpsManager
        preconditions:
          - "No Heat or TeeSession on this venue in status OPEN"
        side_effects:
          - "All SCHEDULED slots on this venue -> CANCELLED (cascading their non-terminal bookings -> CANCELLED)"
          - "increments Venue.version by 1"

  - entity: Heat
    field: status
    initial_state: SCHEDULED
    terminal_states: [CLOSED, CANCELLED]
    note: "Go-kart heat lifecycle. OPEN accepts bookings; half-open [start,end) interval semantics for overlap at creation."
    transitions:
      - from: SCHEDULED
        to: OPEN
        trigger: "POST /heats/{heat_id}/open"
        actor: OpsManager
        preconditions:
          - "heat.status == SCHEDULED"
          - "venue.posture == OPEN (cross-entity guard on Venue)"
        side_effects:
          - "increments Heat.version by 1"
      - from: OPEN
        to: CLOSED
        trigger: "POST /heats/{heat_id}/close OR system (venue weather-hold)"
        actor: "OpsManager or system"
        preconditions:
          - "heat.status == OPEN"
        side_effects:
          - "Manual close only: CONFIRMED+CHECKED_IN bookings on this heat -> COMPLETED. Under weather-hold they stay CONFIRMED/CHECKED_IN."
          - "WAITLISTED bookings on this heat -> CANCELLED (no promotion; slot is closing)"
          - "increments Heat.version by 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /heats/{heat_id}/cancel OR system (venue close)"
        actor: "OpsManager or system"
        preconditions:
          - "heat.status == SCHEDULED"
        side_effects:
          - "All non-terminal bookings on this heat (HOLD, WAITLISTED) -> CANCELLED"
          - "increments Heat.version by 1"

  - entity: TeeSession
    field: status
    initial_state: SCHEDULED
    terminal_states: [CLOSED, CANCELLED]
    note: "Mini-golf tee session lifecycle, parallel to Heat but with closed-interval [start,end] overlap semantics."
    transitions:
      - from: SCHEDULED
        to: OPEN
        trigger: "POST /tee-sessions/{tee_session_id}/open"
        actor: OpsManager
        preconditions:
          - "tee_session.status == SCHEDULED"
          - "venue.posture == OPEN (cross-entity guard on Venue)"
        side_effects:
          - "increments TeeSession.version by 1"
      - from: OPEN
        to: CLOSED
        trigger: "POST /tee-sessions/{tee_session_id}/close OR system (venue weather-hold)"
        actor: "OpsManager or system"
        preconditions:
          - "tee_session.status == OPEN"
        side_effects:
          - "Manual close only: CONFIRMED+CHECKED_IN bookings -> COMPLETED. Under weather-hold they stay CONFIRMED/CHECKED_IN."
          - "WAITLISTED bookings -> CANCELLED"
          - "increments TeeSession.version by 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /tee-sessions/{tee_session_id}/cancel OR system (venue close)"
        actor: "OpsManager or system"
        preconditions:
          - "tee_session.status == SCHEDULED"
        side_effects:
          - "All non-terminal bookings on this session (HOLD, WAITLISTED) -> CANCELLED"
          - "increments TeeSession.version by 1"

  - entity: Booking
    field: status
    initial_state: HOLD
    terminal_states: [COMPLETED, CANCELLED, NO_SHOW]
    note: "Cyclic axis CONFIRMED<->WAITLISTED. A HOLD confirm becomes CONFIRMED if capacity exists, else WAITLISTED; on capacity release the earliest WAITLISTED is promoted CONFIRMED."
    transitions:
      - from: HOLD
        to: CONFIRMED
        trigger: "POST /bookings/{booking_id}/confirm (capacity sufficient)"
        actor: "Guest or Cashier"
        preconditions:
          - "venue.posture == OPEN"
          - "owning slot (Heat or TeeSession) status == OPEN"
          - "expected slot version matches (OCC: expected_heat_version / expected_tee_session_version)"
          - "guest height_cm >= attraction.min_height_cm"
          - "guest.waiver_status == SIGNED (venue current_utc < waiver.expires_at)"
          - "combo pass (if combo_pass_id set) is owned by guest, ACTIVE, credits_remaining > 0"
          - "slot free capacity >= party_size (Heat.lanes_available / TeeSession.players_available)"
        side_effects:
          - "gross_price_cents recomputed via booking_price FINAL variant"
          - "combo_credit_application computes credits_applied and cash_due_cents"
          - "slot committed counter increases by party_size; available recomputed; increments owning slot version by 1"
          - "if group_id set: PartyGroup.units_consumed increases by party_size; increments PartyGroup.version by 1"
          - "increments Booking.version by 1"
      - from: HOLD
        to: WAITLISTED
        trigger: "POST /bookings/{booking_id}/confirm (capacity insufficient)"
        actor: "Guest or Cashier"
        preconditions:
          - "venue.posture == OPEN"
          - "owning slot status == OPEN"
          - "expected slot version matches (OCC)"
          - "guest height_cm >= attraction.min_height_cm and guest.waiver_status == SIGNED"
          - "slot free capacity < party_size"
        side_effects:
          - "waitlist_seq assigned = (max waitlist_seq among WAITLISTED bookings on this slot) + 1, starting at 1"
          - "no capacity consumed; slot version NOT incremented; cash_due_cents stays at provisional value"
          - "increments Booking.version by 1"
      - from: WAITLISTED
        to: CONFIRMED
        trigger: "system (capacity released on the same slot by a CANCELLED/NO_SHOW CONFIRMED booking)"
        actor: system
        preconditions:
          - "slot free capacity >= this booking.party_size after the release"
          - "this is the earliest-eligible WAITLISTED booking by created_at ASC, then waitlist_seq ASC, whose party_size still fits"
          - "venue.posture == OPEN and slot.status == OPEN"
        side_effects:
          - "gross_price_cents recomputed via booking_price FINAL variant (slot window may have changed since HOLD)"
          - "combo_credit_application recomputes credits_applied and cash_due_cents"
          - "slot committed increases by party_size; available recomputed; increments owning slot version by 1"
          - "waitlist_seq cleared to null"
          - "if group_id set: PartyGroup.units_consumed increases by party_size"
          - "increments Booking.version by 1"
      - from: CONFIRMED
        to: CHECKED_IN
        trigger: "POST /bookings/{booking_id}/check-in"
        actor: Cashier
        preconditions:
          - "booking.status == CONFIRMED"
          - "owning slot.status == OPEN"
          - "venue current_utc within [slot.start_utc, slot.end_utc) for Heat; [start, end] for TeeSession, else ERR_CHECK_IN_WINDOW"
        side_effects:
          - "if combo_pass_id set: ComboPass.credits_redeemed += credits_applied; credits_remaining recomputed; status -> EXHAUSTED when credits_remaining == 0; increments ComboPass.version by 1"
          - "increments Booking.version by 1"
      - from: CHECKED_IN
        to: COMPLETED
        trigger: "system (owning Heat/TeeSession manual close)"
        actor: system
        preconditions:
          - "owning slot transitions OPEN -> CLOSED via manual close"
        side_effects:
          - "if group_id set and all member bookings terminal with at least one COMPLETED: PartyGroup bubbles to COMPLETED"
          - "increments Booking.version by 1"
      - from: [HOLD, CONFIRMED, WAITLISTED]
        to: CANCELLED
        trigger: "POST /bookings/{booking_id}/cancel OR system (slot/venue cancel)"
        actor: "Guest or Cashier or system"
        preconditions:
          - "booking.status in {HOLD, CONFIRMED, WAITLISTED}"
        side_effects:
          - "if was CONFIRMED: slot committed decreases by party_size; available recomputed; increments owning slot version by 1; triggers waitlist promotion of earliest-eligible WAITLISTED on the same slot"
          - "if was WAITLISTED: waitlist_seq cleared"
          - "if combo credits were applied at CONFIRMED but not yet redeemed at check-in: credits_applied released (ComboPass.credits_redeemed unchanged)"
          - "if group_id set and was CONFIRMED: PartyGroup.units_consumed decreases by party_size"
          - "increments Booking.version by 1"
      - from: CONFIRMED
        to: NO_SHOW
        trigger: "POST /bookings/{booking_id}/no-show"
        actor: Cashier
        preconditions:
          - "booking.status == CONFIRMED"
          - "venue current_utc >= owning slot.end_utc (slot window has fully passed), else ERR_NO_SHOW_WINDOW"
        side_effects:
          - "slot committed decreases by party_size; available recomputed; increments owning slot version by 1; triggers waitlist promotion of earliest-eligible WAITLISTED on the same slot"
          - "if group_id set: PartyGroup.units_consumed decreases by party_size"
          - "increments Booking.version by 1"

  - entity: PartyGroup
    field: status
    initial_state: DRAFT
    terminal_states: [COMPLETED, CANCELLED]
    note: "Compound aggregate. Confirmation locks the deposit; completion bubbles up from member bookings."
    transitions:
      - from: DRAFT
        to: CONFIRMED
        trigger: "POST /party-groups/{group_id}/confirm"
        actor: "Guest or Cashier"
        preconditions:
          - "venue.posture == OPEN"
          - "expected_group_version matches party_group.version (OCC)"
          - "party_group has at least one member Booking in HOLD or CONFIRMED, else ERR_PARTY_GROUP_EMPTY"
        side_effects:
          - "deposit becomes non-refundable"
          - "increments PartyGroup.version by 1"
      - from: CONFIRMED
        to: CHECKED_IN
        trigger: "POST /party-groups/{group_id}/check-in"
        actor: Cashier
        preconditions:
          - "party_group.status == CONFIRMED"
          - "at least one member booking is CHECKED_IN"
        side_effects:
          - "increments PartyGroup.version by 1"
      - from: [CONFIRMED, CHECKED_IN]
        to: COMPLETED
        trigger: "system (all member bookings terminal with at least one COMPLETED)"
        actor: system
        preconditions:
          - "every member Booking is in a terminal state {COMPLETED, CANCELLED, NO_SHOW}"
          - "at least one member Booking is COMPLETED"
        side_effects:
          - "increments PartyGroup.version by 1"
      - from: [DRAFT, CONFIRMED]
        to: CANCELLED
        trigger: "POST /party-groups/{group_id}/cancel"
        actor: "Guest or Cashier"
        preconditions:
          - "party_group.status in {DRAFT, CONFIRMED}"
        side_effects:
          - "All non-terminal member bookings -> CANCELLED (cascades each booking cancel's side-effects incl. waitlist promotion)"
          - "deposit refunded to host Wallet (arcade_card_balance_cents += deposit_cents) only if cancelled while DRAFT; forfeited if CONFIRMED"
          - "increments PartyGroup.version by 1"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: booking-confirm-stale-heat
    parent_entity: Heat
    write_endpoint: "POST /bookings/{booking_id}/confirm"
    occ_field: "expected_heat_version"
    description: |
      Confirming a Booking against a Heat whose version has advanced since the
      client last observed it is rejected. This captures the case where another
      writer has already confirmed a booking that legitimately consumed the last
      lanes (advancing Heat.version), so the current writer's view of
      lanes_available is stale and confirming would over-commit the heat.
    error_id: ERR_STALE_SLOT_VERSION
    http_status: 412

  - rule_id: party-confirm-stale-group
    parent_entity: PartyGroup
    write_endpoint: "POST /party-groups/{group_id}/confirm"
    occ_field: "expected_group_version"
    description: |
      Confirming a PartyGroup whose version has advanced since the client last
      observed it is rejected. This captures the case where another writer has
      already added or removed a member booking (advancing PartyGroup.version
      and changing units_consumed), so the current writer's confirmation
      decision is based on a stale member set.
    error_id: ERR_STALE_GROUP_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: booking_price
    trigger: "Booking confirm (FINAL); Booking create/HOLD (PROVISIONAL); waitlist promotion (FINAL re-eval)"
    algorithm: tiered_pricing
    formula: |
      # Step order is PINNED: per-unit price first, then group discount, then a
      # SINGLE round at the end (sum-then-round, NOT round-per-unit).
      effective_units = units
      if pricing_plan.mode == WRISTBAND and pricing_plan.wristband_unit_cap > 0:
          effective_units = min(units, pricing_plan.wristband_unit_cap)

      per_unit_cents = pricing_plan.base_price_cents
      if slot.window == PEAK:
          per_unit_cents = per_unit_cents + pricing_plan.peak_surcharge_cents

      if pricing_plan.mode == WRISTBAND:
          # Flat per-player band price; units folded into the band.
          raw_cents = per_unit_cents * party_size
      else:
          # PER_ROUND (mini-golf) / PER_HEAT (go-kart): price per unit per player.
          raw_cents = per_unit_cents * effective_units * party_size

      # Group discount applies only when party_size >= GROUP_MIN_SIZE.
      discount_factor = 1.0
      if party_size >= GROUP_MIN_SIZE:
          discount_factor = 1.0 - pricing_plan.group_discount_pct

      gross_price_cents = round_half_up(raw_cents * discount_factor)   # round ONCE here
    input_set: "Single Booking plus its PricingPlan and owning slot (Heat or TeeSession) window."
    constants:
      GROUP_MIN_SIZE: 4
    precision: "Integer cents; single round_half_up at the end (sum-then-round, NOT round-per-unit)."
    variants:
      - name: PROVISIONAL
        when: "At Booking create (HOLD): slot.window taken as the slot's window at create time."
        difference: "Stored as gross_price_cents on HOLD but NOT finalized; combo credits not yet applied; cash_due_cents = gross_price_cents; credits_applied = 0."
      - name: FINAL
        when: "At confirm and at waitlist promotion."
        difference: "Re-reads slot.window at confirm/promotion time (window may have changed via slot edit), applies combo credits, finalizes cash_due_cents. PROVISIONAL and FINAL diverge whenever the window changed between HOLD and confirm."

  - name: combo_credit_application
    trigger: "Booking confirm and waitlist promotion (after FINAL gross_price_cents is known)"
    algorithm: waterfall_allocation
    formula: |
      # Combo credits cover whole activity units first, cash covers the remainder.
      if combo_pass_id is null or combo_pass.status != ACTIVE:
          credits_applied = 0
          cash_due_cents = gross_price_cents
      else:
          billable_units = effective_units * party_size   # same effective_units as booking_price
          credits_applied = min(combo_pass.credits_remaining, billable_units)
          covered_fraction = credits_applied / billable_units    # exact rational
          credit_value_cents = round_half_up(gross_price_cents * covered_fraction)
          cash_due_cents = max(0, gross_price_cents - credit_value_cents)
      # credits_applied counts credits consumed; ComboPass.credits_redeemed is
      # advanced at CHECK-IN (see Booking state machine), not at confirm.
    input_set: "Single Booking, its ComboPass (status ACTIVE), and the FINAL gross_price_cents."
    constants: {}
    precision: "Integer cents; round_half_up on credit_value_cents."

  - name: slot_capacity_rollup
    trigger: "Booking confirm/cancel/no-show/promotion; slot create"
    algorithm: aggregation
    formula: |
      # Heat:
      lanes_committed = sum(b.party_size for b in bookings
                            where b.heat_id == heat.id and b.status in {CONFIRMED, CHECKED_IN})
      lanes_available = max(0, lane_capacity - lanes_committed)
      # TeeSession:
      players_committed = sum(b.party_size for b in bookings
                              where b.tee_session_id == session.id and b.status in {CONFIRMED, CHECKED_IN})
      players_available = max(0, party_slot_capacity - players_committed)
    input_set: "All bookings on the slot in {CONFIRMED, CHECKED_IN}. HOLD and WAITLISTED do NOT consume capacity."
    constants: {}
    precision: "Integer counts."

  - name: party_group_unit_balance
    trigger: "member Booking confirm/cancel/no-show; PartyGroup confirm"
    algorithm: aggregation
    formula: |
      units_consumed = sum(b.party_size for b in member_bookings
                           where b.group_id == group.id and b.status in {CONFIRMED, CHECKED_IN})
      overage_units = max(0, units_consumed - included_unit_count)
    input_set: "Member bookings on this group in {CONFIRMED, CHECKED_IN}."
    constants: {}
    precision: "Integer counts."

  - name: slot_overlap_check
    trigger: "heat create; tee-session create"
    algorithm: interval_merge
    formula: |
      candidate = new slot [start_utc, end_utc]
      for each existing non-terminal slot s on the same attraction (status in {SCHEDULED, OPEN, CLOSED}):
        if slot is a Heat (GO_KART):
          # half-open [start, end): adjacency allowed (s.end == candidate.start is OK)
          overlap = (candidate.start < s.end) and (s.start < candidate.end)
          if overlap: reject ERR_SLOT_OVERLAP
        if slot is a TeeSession (MINI_GOLF):
          # turnover-buffer: require a gap of TURNOVER_GAP_MINUTES on either side
          if candidate.start >= s.end:
              gap_minutes = (candidate.start - s.end) in minutes
          elif s.start >= candidate.end:
              gap_minutes = (s.start - candidate.end) in minutes
          else:
              gap_minutes = -1   # they interpenetrate
          if gap_minutes < TURNOVER_GAP_MINUTES: reject ERR_SLOT_OVERLAP
    input_set: "All non-terminal slots (status in {SCHEDULED, OPEN, CLOSED}) on the same attraction. CANCELLED slots are ignored."
    constants:
      TURNOVER_GAP_MINUTES: 10
    precision: "Whole minutes; comparison only."

  - name: waiver_validity
    trigger: "waiver sign; guest read (waiver_status derivation); booking confirm safety gate"
    algorithm: threshold
    formula: |
      # Derive guest.waiver_status from the guest's latest Waiver and venue current_utc.
      latest = waiver with greatest signed_at for the guest (tie-break: created_at ASC then take last)
      if latest is null:
          waiver_status = NONE
      elif venue.current_utc >= latest.expires_at:
          waiver_status = EXPIRED
      else:
          waiver_status = SIGNED
      # On sign: expires_at = signed_at + WAIVER_VALID_DAYS days.
      # A minor (age at signed_at < MINOR_AGE_YEARS, from birthdate) requires guardian_name, else ERR_WAIVER_REQUIRED.
    input_set: "The guest's waivers and the venue current_utc."
    constants:
      WAIVER_VALID_DAYS: 365
      MINOR_AGE_YEARS: 18
    precision: "Day-granularity for expiry comparison via UTC instants."

  - name: wallet_balance
    trigger: "arcade top-up; arcade redemption; party deposit debit/refund"
    algorithm: aggregation
    formula: |
      # A loyalty bonus is applied ONLY to the single top-up that crosses the
      # threshold, computed on that one top-up amount (not retroactively).
      on top_up(amount_cents):
          bonus = 0
          if (total_loaded_cents + amount_cents) >= LOYALTY_THRESHOLD_CENTS and total_loaded_cents < LOYALTY_THRESHOLD_CENTS:
              bonus = round_half_up(amount_cents * LOYALTY_BONUS_PCT)
          total_loaded_cents += amount_cents
          arcade_card_balance_cents += amount_cents + bonus
      on redeem(amount_cents):
          # reject if amount_cents > arcade_card_balance_cents (ERR_INSUFFICIENT_CARD_BALANCE)
          arcade_card_balance_cents -= amount_cents
      on party_deposit(deposit_cents):
          # reject if deposit_cents > arcade_card_balance_cents (ERR_INSUFFICIENT_CARD_BALANCE)
          arcade_card_balance_cents -= deposit_cents
    input_set: "Single Wallet; top-up/redeem/deposit events applied in chronological order (created_at ASC)."
    constants:
      LOYALTY_THRESHOLD_CENTS: 5000
      LOYALTY_BONUS_PCT: 0.10
    precision: "Integer cents; round_half_up on bonus."
    variants:
      - name: BALANCE_FORWARD
        when: "Redemption / deposit check uses the live arcade_card_balance_cents (immediate)."
        difference: "Live running balance — each debit checks the current balance only."
      - name: LOYALTY_CHRONOLOGICAL
        when: "Bonus eligibility evaluated chronologically over the top-up history."
        difference: "Whether a top-up earns the loyalty bonus depends on the cumulative total_loaded_cents BEFORE that top-up, so the processing order changes which single top-up earns the bonus."

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Acting role is permitted for this operation per §1.7; a Guest may only act on its own resources"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Every path/body referenced resource exists, validated left-to-right (venue, then attraction/slot, then booking/group)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: business_constraint
    check: "Request body well-formed: required fields present, enums valid, party_size>=1, units>=1, amounts>=0, slot_kind matches the supplied heat_id/tee_session_id"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "all mutations"

  - priority: 5
    category: state
    check: "Venue posture permits the operation: WEATHER_HOLD blocks slot open & booking confirm; CLOSED blocks all child mutations"
    error_id: ERR_VENUE_NOT_OPEN
    http_status: 409
    applies_to: "slot open, booking confirm/check-in, party confirm"

  - priority: 6
    category: state
    check: "OCC: expected_<parent>_version matches the parent's current version on guarded writes (heat/tee-session on booking confirm; group on party confirm)"
    error_id: ERR_STALE_SLOT_VERSION
    http_status: 412
    applies_to: "booking confirm, party confirm"

  - priority: 7
    category: state
    check: "Target resource is in a valid state for the requested transition (incl. terminal-state lockdown and repeated-trigger idempotency rejection)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 7.1
    category: business_referential
    check: "Slot create: Heat requires a GO_KART attraction, TeeSession requires a MINI_GOLF attraction; booking slot_kind must match owning attraction kind"
    error_id: ERR_ATTRACTION_KIND_MISMATCH
    http_status: 409
    applies_to: "heat create, tee-session create, booking create"

  - priority: 7.2
    category: business_temporal
    check: "Booking check-in only within the slot active window (venue current_utc in [start,end) for Heat, [start,end] for TeeSession)"
    error_id: ERR_CHECK_IN_WINDOW
    http_status: 409
    applies_to: "booking check-in"

  - priority: 7.3
    category: business_temporal
    check: "No-show only after the owning slot's end_utc has passed (venue current_utc >= slot.end_utc)"
    error_id: ERR_NO_SHOW_WINDOW
    http_status: 409
    applies_to: "booking no-show"

  - priority: 7.4
    category: business_constraint
    check: "Party group confirm requires at least one member booking in HOLD or CONFIRMED"
    error_id: ERR_PARTY_GROUP_EMPTY
    http_status: 409
    applies_to: "party-group confirm"

  - priority: 8
    category: business_safety
    check: "Booking guest meets attraction.min_height_cm (height/safety gate)"
    error_id: ERR_HEIGHT_REQUIREMENT
    http_status: 422
    applies_to: "booking confirm"

  - priority: 9
    category: business_safety
    check: "Guest has a SIGNED unexpired waiver (venue current_utc < waiver.expires_at); minor's waiver must carry guardian_name"
    error_id: ERR_WAIVER_REQUIRED
    http_status: 422
    applies_to: "booking confirm, waiver signing for minors"

  - priority: 10
    category: business_temporal
    check: "Slot intervals must not collide on the same attraction. Heat: half-open [start,end) — adjacency (one heat's end == another's start) is ALLOWED, any inner overlap rejected. TeeSession: turnover-buffer semantics — two sessions must be separated by at least TURNOVER_GAP_MINUTES, so sessions that merely abut (gap == 0) ARE rejected; required gap = min(next.start - prev.end, prev.start - next.end) >= TURNOVER_GAP_MINUTES."
    error_id: ERR_SLOT_OVERLAP
    http_status: 409
    applies_to: "heat create, tee-session create"

  - priority: 11
    category: business_constraint
    check: "WRISTBAND booking units must not exceed pricing_plan.wristband_unit_cap when cap>0"
    error_id: ERR_WRISTBAND_CAP_EXCEEDED
    http_status: 422
    applies_to: "booking create, booking confirm"

  - priority: 12
    category: business_referential
    check: "combo_pass_id (if supplied) belongs to the booking's guest, is ACTIVE, and has credits_remaining>0"
    error_id: ERR_COMBO_PASS_INVALID
    http_status: 409
    applies_to: "booking confirm"

  - priority: 13
    category: business_fiscal
    check: "Arcade redemption / party deposit must not exceed arcade_card_balance_cents"
    error_id: ERR_INSUFFICIENT_CARD_BALANCE
    http_status: 409
    applies_to: "arcade redemption, party-group create"

  - priority: 14
    category: business_fiscal
    check: "On a confirm path that must commit capacity, slot free capacity >= party_size; otherwise the booking is WAITLISTED, not rejected. Promotion that requires capacity it does not have raises ERR_CAPACITY_EXCEEDED."
    error_id: ERR_CAPACITY_EXCEEDED
    http_status: 409
    applies_to: "booking confirm (capacity-committing paths)"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- Venue ---
  - method: POST
    path: "/venues"
    description: "Create a venue (posture OPEN)"
    roles: [OpsManager]
    code: 201
    input: [name, "timezone?"]
    output: Venue
    side_effects: ["posture=OPEN, current_utc=server wall time, open_slot_count=0, version=1"]

  - method: GET
    path: "/venues/{venue_id}"
    description: "Get venue details incl. posture and open_slot_count"
    roles: [OpsManager, Cashier, Guest]
    code: 200
    input: []
    output: Venue
    side_effects: []

  - method: GET
    path: "/venues"
    description: "List venues"
    roles: [OpsManager, Cashier, Guest]
    code: 200
    input: ["posture?", "limit?", "offset?"]
    output: Venue[]
    side_effects: []

  - method: POST
    path: "/venues/{venue_id}/weather-hold"
    description: "Put venue into WEATHER_HOLD (weather closure)"
    roles: [OpsManager]
    code: 200
    input: [weather_hold_reason, expected_venue_version]
    output: Venue
    side_effects:
      - "posture OPEN -> WEATHER_HOLD"
      - "OPEN slots -> CLOSED; WAITLISTED bookings on those slots -> CANCELLED"
      - "increments Venue.version by 1"

  - method: POST
    path: "/venues/{venue_id}/resume"
    description: "Resume venue from WEATHER_HOLD to OPEN"
    roles: [OpsManager]
    code: 200
    input: [expected_venue_version]
    output: Venue
    side_effects: ["posture WEATHER_HOLD -> OPEN", "weather_hold_reason cleared", "increments Venue.version by 1"]

  - method: POST
    path: "/venues/{venue_id}/close"
    description: "Close venue permanently"
    roles: [OpsManager]
    code: 200
    input: [expected_venue_version]
    output: Venue
    side_effects: ["posture -> CLOSED", "SCHEDULED slots -> CANCELLED (cascading bookings)", "increments Venue.version by 1"]

  - method: POST
    path: "/venues/{venue_id}/_clock/set_current_utc"
    description: "Test-driving: set venue server clock for time-gated checks"
    roles: [OpsManager]
    code: 200
    input: [to_iso8601]
    output: Venue
    side_effects: ["sets Venue.current_utc; guest.waiver_status recomputed against it on read"]

  # --- Attraction ---
  - method: POST
    path: "/attractions"
    description: "Create an attraction"
    roles: [OpsManager]
    code: 201
    input: [venue_id, name, kind, "min_height_cm?", "lane_count?"]
    output: Attraction
    side_effects: ["status=ACTIVE"]

  - method: GET
    path: "/attractions/{attraction_id}"
    description: "Get attraction"
    roles: [OpsManager, Cashier, Guest]
    code: 200
    input: []
    output: Attraction
    side_effects: []

  - method: GET
    path: "/attractions"
    description: "List attractions; filter by venue_id (reverse-reachability for Attraction.venue_id)"
    roles: [OpsManager, Cashier, Guest]
    code: 200
    input: ["venue_id?", "kind?", "limit?", "offset?"]
    output: Attraction[]
    side_effects: []

  # --- PricingPlan ---
  - method: POST
    path: "/pricing-plans"
    description: "Create a pricing plan"
    roles: [OpsManager]
    code: 201
    input: [venue_id, name, mode, base_price_cents, "peak_surcharge_cents?", "group_discount_pct?", "wristband_unit_cap?"]
    output: PricingPlan
    side_effects: ["status=ACTIVE"]

  - method: GET
    path: "/pricing-plans/{pricing_plan_id}"
    description: "Get pricing plan"
    roles: [OpsManager, Cashier, Guest]
    code: 200
    input: []
    output: PricingPlan
    side_effects: []

  - method: GET
    path: "/pricing-plans"
    description: "List pricing plans; filter by venue_id (reverse-reachability for PricingPlan.venue_id)"
    roles: [OpsManager, Cashier, Guest]
    code: 200
    input: ["venue_id?", "mode?", "limit?", "offset?"]
    output: PricingPlan[]
    side_effects: []

  # --- Heat ---
  - method: POST
    path: "/heats"
    description: "Create a go-kart heat (overlap-checked, half-open intervals)"
    roles: [OpsManager]
    code: 201
    input: [venue_id, attraction_id, start_utc, end_utc, "window?"]
    output: Heat
    side_effects: ["status=SCHEDULED", "lane_capacity snapshotted from attraction.lane_count", "ERR_ATTRACTION_KIND_MISMATCH if attraction.kind != GO_KART", "ERR_SLOT_OVERLAP if [start,end) overlaps another non-terminal heat on the attraction"]

  - method: GET
    path: "/heats/{heat_id}"
    description: "Get heat incl. lanes_available"
    roles: [OpsManager, Cashier, Guest]
    code: 200
    input: []
    output: Heat
    side_effects: []

  - method: GET
    path: "/heats"
    description: "List heats; filter by venue_id/attraction_id (reverse-reachability for Heat.venue_id and Heat.attraction_id)"
    roles: [OpsManager, Cashier, Guest]
    code: 200
    input: ["venue_id?", "attraction_id?", "status?", "limit?", "offset?"]
    output: Heat[]
    side_effects: []

  - method: POST
    path: "/heats/{heat_id}/open"
    description: "Open a heat for bookings"
    roles: [OpsManager]
    code: 200
    input: []
    output: Heat
    side_effects: ["status SCHEDULED -> OPEN", "venue must be OPEN"]

  - method: POST
    path: "/heats/{heat_id}/close"
    description: "Close a heat"
    roles: [OpsManager]
    code: 200
    input: []
    output: Heat
    side_effects: ["status OPEN -> CLOSED", "CONFIRMED/CHECKED_IN bookings -> COMPLETED", "WAITLISTED -> CANCELLED"]

  - method: POST
    path: "/heats/{heat_id}/cancel"
    description: "Cancel a scheduled heat"
    roles: [OpsManager]
    code: 200
    input: []
    output: Heat
    side_effects: ["status SCHEDULED -> CANCELLED", "non-terminal bookings -> CANCELLED"]

  # --- TeeSession ---
  - method: POST
    path: "/tee-sessions"
    description: "Create a mini-golf tee session (overlap-checked, closed intervals)"
    roles: [OpsManager]
    code: 201
    input: [venue_id, attraction_id, start_utc, end_utc, party_slot_capacity, "window?"]
    output: TeeSession
    side_effects: ["status=SCHEDULED", "ERR_ATTRACTION_KIND_MISMATCH if attraction.kind != MINI_GOLF", "ERR_SLOT_OVERLAP if gap to another non-terminal session on the attraction is < TURNOVER_GAP_MINUTES (turnover-buffer semantics)"]

  - method: GET
    path: "/tee-sessions/{tee_session_id}"
    description: "Get tee session incl. players_available"
    roles: [OpsManager, Cashier, Guest]
    code: 200
    input: []
    output: TeeSession
    side_effects: []

  - method: GET
    path: "/tee-sessions"
    description: "List tee sessions; filter by venue_id/attraction_id (reverse-reachability for TeeSession.venue_id and TeeSession.attraction_id)"
    roles: [OpsManager, Cashier, Guest]
    code: 200
    input: ["venue_id?", "attraction_id?", "status?", "limit?", "offset?"]
    output: TeeSession[]
    side_effects: []

  - method: POST
    path: "/tee-sessions/{tee_session_id}/open"
    description: "Open a tee session for bookings"
    roles: [OpsManager]
    code: 200
    input: []
    output: TeeSession
    side_effects: ["status SCHEDULED -> OPEN", "venue must be OPEN"]

  - method: POST
    path: "/tee-sessions/{tee_session_id}/close"
    description: "Close a tee session"
    roles: [OpsManager]
    code: 200
    input: []
    output: TeeSession
    side_effects: ["status OPEN -> CLOSED", "CONFIRMED/CHECKED_IN bookings -> COMPLETED", "WAITLISTED -> CANCELLED"]

  - method: POST
    path: "/tee-sessions/{tee_session_id}/cancel"
    description: "Cancel a scheduled tee session"
    roles: [OpsManager]
    code: 200
    input: []
    output: TeeSession
    side_effects: ["status SCHEDULED -> CANCELLED", "non-terminal bookings -> CANCELLED"]

  # --- Guest / Waiver ---
  - method: POST
    path: "/guests"
    description: "Register a guest (auto-creates an empty Wallet)"
    roles: [OpsManager, Cashier, Guest]
    code: 201
    input: [full_name, height_cm, "birthdate?"]
    output: Guest
    side_effects: ["waiver_status=NONE", "a Wallet is created for the guest with zero balance"]

  - method: GET
    path: "/guests/{guest_id}"
    description: "Get guest incl. derived waiver_status"
    roles: [OpsManager, Cashier, Guest]
    code: 200
    input: []
    output: Guest
    side_effects: []

  - method: GET
    path: "/guests"
    description: "List guests"
    roles: [OpsManager, Cashier, Guest]
    code: 200
    input: ["waiver_status?", "limit?", "offset?"]
    output: Guest[]
    side_effects: []

  - method: POST
    path: "/waivers"
    description: "Sign a height/safety waiver for a guest"
    roles: [OpsManager, Cashier, Guest]
    code: 201
    input: [guest_id, "guardian_name?"]
    output: Waiver
    side_effects: ["signed_at=venue current_utc, expires_at=signed_at+WAIVER_VALID_DAYS", "guest.waiver_status recomputed to SIGNED", "minor without guardian_name -> ERR_WAIVER_REQUIRED"]

  - method: GET
    path: "/waivers/{waiver_id}"
    description: "Get a waiver"
    roles: [OpsManager, Cashier, Guest]
    code: 200
    input: []
    output: Waiver
    side_effects: []

  - method: GET
    path: "/waivers"
    description: "List waivers; filter by guest_id (reverse-reachability for Waiver.guest_id)"
    roles: [OpsManager, Cashier, Guest]
    code: 200
    input: ["guest_id?", "limit?", "offset?"]
    output: Waiver[]
    side_effects: []

  # --- Wallet / Arcade card ---
  - method: GET
    path: "/wallets/{wallet_id}"
    description: "Get an arcade wallet"
    roles: [OpsManager, Cashier, Guest]
    code: 200
    input: []
    output: Wallet
    side_effects: []

  - method: GET
    path: "/wallets"
    description: "List wallets; filter by guest_id (reverse-reachability for Wallet.guest_id)"
    roles: [OpsManager, Cashier, Guest]
    code: 200
    input: ["guest_id?", "limit?", "offset?"]
    output: Wallet[]
    side_effects: []

  - method: POST
    path: "/wallets/{wallet_id}/top-ups"
    description: "Load value onto the arcade card; may earn a loyalty bonus"
    roles: [OpsManager, Cashier, Guest]
    code: 200
    input: [amount_cents]
    output: Wallet
    side_effects: ["arcade_card_balance_cents and total_loaded_cents increase per wallet_balance calc", "loyalty bonus applied on the threshold-crossing top-up", "increments Wallet.version by 1"]

  - method: POST
    path: "/wallets/{wallet_id}/redemptions"
    description: "Redeem arcade card value at the arcade"
    roles: [Cashier, Guest]
    code: 200
    input: [amount_cents]
    output: Wallet
    side_effects: ["arcade_card_balance_cents decreases", "ERR_INSUFFICIENT_CARD_BALANCE if amount exceeds balance", "increments Wallet.version by 1"]

  # --- ComboPass ---
  - method: POST
    path: "/combo-passes"
    description: "Purchase a combo pass (activity credits)"
    roles: [OpsManager, Cashier, Guest]
    code: 201
    input: [guest_id, total_credits]
    output: ComboPass
    side_effects: ["status=ACTIVE, credits_redeemed=0, credits_remaining=total_credits"]

  - method: GET
    path: "/combo-passes/{combo_pass_id}"
    description: "Get a combo pass incl. credits_remaining"
    roles: [OpsManager, Cashier, Guest]
    code: 200
    input: []
    output: ComboPass
    side_effects: []

  - method: GET
    path: "/combo-passes"
    description: "List combo passes; filter by guest_id (reverse-reachability for ComboPass.guest_id)"
    roles: [OpsManager, Cashier, Guest]
    code: 200
    input: ["guest_id?", "status?", "limit?", "offset?"]
    output: ComboPass[]
    side_effects: []

  # --- PartyGroup ---
  - method: POST
    path: "/party-groups"
    description: "Create a party package / group (DRAFT); debits deposit from host wallet"
    roles: [OpsManager, Cashier, Guest]
    code: 201
    input: [venue_id, host_guest_id, package_name, included_unit_count, deposit_cents]
    output: PartyGroup
    side_effects: ["status=DRAFT, units_consumed=0", "deposit_cents debited from host Wallet (ERR_INSUFFICIENT_CARD_BALANCE if short)"]

  - method: GET
    path: "/party-groups/{group_id}"
    description: "Get a party group incl. units_consumed"
    roles: [OpsManager, Cashier, Guest]
    code: 200
    input: []
    output: PartyGroup
    side_effects: []

  - method: GET
    path: "/party-groups"
    description: "List party groups; filter by venue_id/host_guest_id (reverse-reachability for PartyGroup.venue_id and host_guest_id)"
    roles: [OpsManager, Cashier, Guest]
    code: 200
    input: ["venue_id?", "host_guest_id?", "status?", "limit?", "offset?"]
    output: PartyGroup[]
    side_effects: []

  - method: POST
    path: "/party-groups/{group_id}/confirm"
    description: "Confirm a party group (locks deposit)"
    roles: [OpsManager, Cashier, Guest]
    code: 200
    input: [expected_group_version]
    output: PartyGroup
    side_effects: ["status DRAFT -> CONFIRMED", "deposit becomes non-refundable", "increments PartyGroup.version by 1"]

  - method: POST
    path: "/party-groups/{group_id}/check-in"
    description: "Check in a party group"
    roles: [OpsManager, Cashier]
    code: 200
    input: []
    output: PartyGroup
    side_effects: ["status CONFIRMED -> CHECKED_IN"]

  - method: POST
    path: "/party-groups/{group_id}/cancel"
    description: "Cancel a party group"
    roles: [OpsManager, Cashier, Guest]
    code: 200
    input: []
    output: PartyGroup
    side_effects: ["status -> CANCELLED", "non-terminal member bookings -> CANCELLED", "deposit refunded to host Wallet only if was DRAFT"]

  # --- Booking ---
  - method: POST
    path: "/bookings"
    description: "Create a booking (HOLD); reservation or walk-in"
    roles: [OpsManager, Cashier, Guest]
    code: 201
    input: [venue_id, guest_id, slot_kind, "heat_id?", "tee_session_id?", pricing_plan_id, "group_id?", "combo_pass_id?", origin, party_size, "units?"]
    output: Booking
    side_effects: ["status=HOLD", "gross_price_cents=PROVISIONAL booking_price", "cash_due_cents=gross_price_cents, credits_applied=0", "ERR_WRISTBAND_CAP_EXCEEDED if units>cap"]

  - method: GET
    path: "/bookings/{booking_id}"
    description: "Get a booking incl. pricing fields"
    roles: [OpsManager, Cashier, Guest]
    code: 200
    input: []
    output: Booking
    side_effects: []

  - method: GET
    path: "/bookings"
    description: "List bookings; filter by venue_id/guest_id/heat_id/tee_session_id/group_id/combo_pass_id/pricing_plan_id (reverse-reachability for Booking FKs)"
    roles: [OpsManager, Cashier, Guest]
    code: 200
    input: ["venue_id?", "guest_id?", "heat_id?", "tee_session_id?", "group_id?", "combo_pass_id?", "pricing_plan_id?", "status?", "limit?", "offset?"]
    output: Booking[]
    side_effects: []

  - method: POST
    path: "/bookings/{booking_id}/confirm"
    description: "Confirm a HOLD booking; CONFIRMED if capacity, else WAITLISTED"
    roles: [OpsManager, Cashier, Guest]
    code: 200
    input: ["expected_heat_version?", "expected_tee_session_version?"]
    output: Booking
    side_effects:
      - "status HOLD -> CONFIRMED (capacity ok) or HOLD -> WAITLISTED (capacity short)"
      - "gross_price_cents recomputed FINAL; combo credits applied; cash_due_cents finalized"
      - "slot committed counters increase; available recomputed; slot version +1 (CONFIRMED path only)"
      - "PartyGroup.units_consumed increases if group_id set (CONFIRMED path)"
      - "increments Booking.version by 1"

  - method: POST
    path: "/bookings/{booking_id}/check-in"
    description: "Check in a confirmed booking"
    roles: [OpsManager, Cashier]
    code: 200
    input: []
    output: Booking
    side_effects: ["status CONFIRMED -> CHECKED_IN", "ComboPass.credits_redeemed += credits_applied; status -> EXHAUSTED at zero", "increments Booking.version by 1"]

  - method: POST
    path: "/bookings/{booking_id}/cancel"
    description: "Cancel a booking; releases capacity and promotes waitlist"
    roles: [OpsManager, Cashier, Guest]
    code: 200
    input: []
    output: Booking
    side_effects:
      - "status -> CANCELLED"
      - "if was CONFIRMED: slot committed decreases; available recomputed; slot version +1; earliest-eligible WAITLISTED promoted to CONFIRMED"
      - "if group_id set and was CONFIRMED: PartyGroup.units_consumed decreases"
      - "increments Booking.version by 1"

  - method: POST
    path: "/bookings/{booking_id}/no-show"
    description: "Mark a confirmed booking as no-show after slot window passes"
    roles: [OpsManager, Cashier]
    code: 200
    input: []
    output: Booking
    side_effects:
      - "status CONFIRMED -> NO_SHOW"
      - "slot committed decreases; available recomputed; slot version +1; earliest-eligible WAITLISTED promoted to CONFIRMED"
      - "if group_id set: PartyGroup.units_consumed decreases"
      - "increments Booking.version by 1"

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- Auth / existence / request ---
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing/invalid X-User-Role or X-User-ID header"
  - id: ERR_FORBIDDEN
    http: 403
    condition: "Role not permitted for operation, or Guest acting on another guest's resource"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Referenced resource does not exist or is outside the path/body scope"
  - id: ERR_INVALID_REQUEST
    http: 422
    condition: "Malformed body, missing required field, invalid enum, party_size<1, units<1, negative amount, or slot_kind not matching the supplied heat_id/tee_session_id"

  # --- State / posture / OCC ---
  - id: ERR_VENUE_NOT_OPEN
    http: 409
    condition: "Venue posture is WEATHER_HOLD or CLOSED and blocks the requested operation"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Target resource not in a valid state for the requested transition (incl. terminal-state lockdown and repeated trigger)"
  - id: ERR_STALE_SLOT_VERSION
    http: 412
    condition: "expected_heat_version / expected_tee_session_version does not match the slot's current version on booking confirm"
  - id: ERR_STALE_GROUP_VERSION
    http: 412
    condition: "expected_group_version does not match the party group's current version on confirm"

  # --- Safety ---
  - id: ERR_HEIGHT_REQUIREMENT
    http: 422
    condition: "Booking guest's height_cm is below the owning attraction.min_height_cm"
  - id: ERR_WAIVER_REQUIRED
    http: 422
    condition: "Guest has no SIGNED unexpired waiver, or a minor's waiver lacks guardian_name"

  # --- Temporal / capacity / constraint ---
  - id: ERR_ATTRACTION_KIND_MISMATCH
    http: 409
    condition: "Heat created on a non-GO_KART attraction, TeeSession created on a non-MINI_GOLF attraction, or slot_kind not matching the owning attraction kind"
  - id: ERR_CHECK_IN_WINDOW
    http: 409
    condition: "Booking check-in attempted when venue current_utc is outside the owning slot's active window ([start,end) for Heat, [start,end] for TeeSession)"
  - id: ERR_NO_SHOW_WINDOW
    http: 409
    condition: "No-show attempted before the owning slot's end_utc has passed"
  - id: ERR_PARTY_GROUP_EMPTY
    http: 409
    condition: "Party group confirm attempted while it has no member booking in HOLD or CONFIRMED"
  - id: ERR_SLOT_OVERLAP
    http: 409
    condition: "New Heat/TeeSession interval overlaps an existing non-terminal slot on the same attraction per that slot type's interval semantics"
  - id: ERR_CAPACITY_EXCEEDED
    http: 409
    condition: "A capacity-committing confirm/promotion path required free capacity >= party_size but the slot had less"
  - id: ERR_WRISTBAND_CAP_EXCEEDED
    http: 422
    condition: "Booking units exceed pricing_plan.wristband_unit_cap for a WRISTBAND plan with cap>0"

  # --- Fiscal / referential ---
  - id: ERR_COMBO_PASS_INVALID
    http: 409
    condition: "combo_pass_id refers to a pass not owned by the guest, not ACTIVE, or with zero credits_remaining"
  - id: ERR_INSUFFICIENT_CARD_BALANCE
    http: 409
    condition: "Arcade redemption amount exceeds arcade_card_balance_cents, or party deposit exceeds host wallet balance at group creation"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: OpsManager
    description: "Operations manager. Controls venue posture (incl. weather closure), attractions, pricing plans, heats and tee sessions, and may act on any booking/party for operational override."
    identity: "opaque"
    exclusive_operations:
      - "POST /venues — create venue"
      - "POST /venues/{id}/weather-hold — weather closure"
      - "POST /venues/{id}/resume — resume from weather hold"
      - "POST /venues/{id}/close — close venue"
      - "POST /venues/{id}/_clock/set_current_utc — set clock (test-driving)"
      - "POST /attractions — create attraction"
      - "POST /pricing-plans — create pricing plan"
      - "POST /heats, /tee-sessions — create slots; open/close/cancel slots"
    shared_operations:
      - "GET endpoints (all)"
      - "POST /bookings and lifecycle (confirm/check-in/cancel/no-show) — operational override"
      - "POST /party-groups and lifecycle"
      - "POST /guests, /waivers, /wallets/{id}/top-ups, /combo-passes"

  - name: Cashier
    description: "Front-desk cashier. Handles walk-ins, check-ins, no-shows, arcade redemptions, and assists with reservations on behalf of any guest. Cannot change venue posture, attractions, pricing, or slot inventory."
    identity: "opaque"
    exclusive_operations:
      - "POST /bookings/{id}/check-in — check in booking"
      - "POST /bookings/{id}/no-show — mark no-show"
      - "POST /party-groups/{id}/check-in — check in party"
      - "POST /wallets/{id}/redemptions — arcade redemption (shared with Guest, see below)"
    shared_operations:
      - "GET endpoints (all)"
      - "POST /bookings and confirm/cancel (assist any guest, incl. walk-ins)"
      - "POST /party-groups, confirm, cancel"
      - "POST /guests, /waivers, /wallets/{id}/top-ups, /wallets/{id}/redemptions, /combo-passes"

  - name: Guest
    description: "A registered guest acting on own resources only. X-User-ID must equal the Guest.id that owns the referenced resource (guest_id / host_guest_id / wallet owner). Cannot manage inventory, pricing, posture, or other guests' resources."
    identity: "entity_backed:Guest"
    exclusive_operations: []
    shared_operations:
      - "GET own resources"
      - "POST /guests (self-register), /waivers (own guest_id), /wallets/{own}/top-ups, /wallets/{own}/redemptions, /combo-passes (own guest_id)"
      - "POST /bookings (own guest_id), confirm, cancel"
      - "POST /party-groups (own host_guest_id), confirm, cancel"
