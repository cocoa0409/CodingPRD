              payload: {}
              as: CirculationPlanner
              captures: { v_status: "$.data.status", v_committed: "$.data.committed_cost_cents", v_ver: "$.data.version" }
            - call: "GET /catalog-circulation/circulation-plans/${plan_id}"
              payload: {}
              as: CirculationPlanner
              captures: { after_committed: "$.data.committed_cost_cents", after_unc: "$.data.uncommitted_budget_cents" }
            - call: "POST /catalog-circulation/circulation-lines/${line_id}/void"
              payload: {}
              as: CirculationPlanner
              captures: { e_revoid: "$.data.error_id" }
          assert:
            - "${v_status} == VOIDED and ${v_committed} == 0"
            - "${after_committed} == 0 and ${after_unc} == 20000000  # the 4720000 debit was credited back exactly once"
            - "${e_revoid} == ERR_INVALID_LINE_STATE with HTTP 409"
            - "CirculationPlan.${plan_id}.committed_cost_cents == 0 and uncommitted_budget_cents == 20000000 after the rejected replay  # no double credit and no negative committed total"
            - "CirculationLine.${line_id}.version == ${v_ver}  # the rejected void did not bump the row"

      - name: cancelling_a_plan_cascades_down_to_lines_drops_and_merge_purge_runs
        claim_type: cascade_down
        grounds:
          - state_machines[CirculationPlan.status].transitions[DRAFT->CANCELLED].side_effects
          - state_machines[Drop.production_status].transitions[PLANNED->CANCELLED]
          - state_machines[MergePurgeRun.status].transitions[COMPLETED->SUPERSEDED]
          - state_machines[CirculationLine.status]
        distinguishing_aspect: "One cancel is asserted across four entity types at once, including the 'only non-terminal children are affected' half: a line that was already VOIDED before the cancel keeps its version, while the still-ALLOCATED line is driven to VOIDED. The budget ledger must land exactly on the full budget, which distinguishes a real per-line credit loop from a handler that simply assigns uncommitted = budget."
        test_recipe:
          setup:
            - "Season FW26; segments S_A (30000 names) and S_B (30000 names); plan P1 budget 20000000 with a COMPLETED housefile-only merge-purge run."
            - "Drop 1 at page_count 64, in_home 2026-09-15 carries an S_A line of 20000 and an S_B line of 10000; both are allocated, then the S_B line is voided by hand before the cancel."
          setup_api_calls:
            - call: "POST /catalog-circulation/seasons"
              payload: { season_code: "FW26", fiscal_year: 2026 }
              as: PlatformAdmin
              captures: { season_id: "$.data.id" }
            - call: "POST /catalog-circulation/housefile-segments"
              payload: { season_id: "${season_id}", segment_code: "S_A", recency_days: 45, orders_12mo: 7, ltv_cents: 62000, housefile_count: 30000, avg_order_value_cents: 18500, historical_response_rate_bps: 620 }
              as: CirculationPlanner
              captures: { seg_a: "$.data.id" }
            - call: "POST /catalog-circulation/housefile-segments"
              payload: { season_id: "${season_id}", segment_code: "S_B", recency_days: 45, orders_12mo: 7, ltv_cents: 62000, housefile_count: 30000, avg_order_value_cents: 18500, historical_response_rate_bps: 620 }
              as: CirculationPlanner
              captures: { seg_b: "$.data.id" }
            - call: "POST /catalog-circulation/circulation-plans"
              payload: { season_id: "${season_id}", plan_code: "P1", budget_cents: 20000000 }
              as: CirculationPlanner
              captures: { plan_id: "$.data.id", plan_v1: "$.data.version" }
            - call: "POST /catalog-circulation/circulation-plans/${plan_id}/merge-purge-runs"
              payload: { expected_plan_version: "${plan_v1}", input_rental_ids: [] }
              as: ListBroker
              captures: { run_id: "$.data.id" }
            - call: "POST /catalog-circulation/circulation-plans/${plan_id}/drops"
              payload: { drop_number: 1, in_home_date: "2026-09-15", page_count: 64 }
              as: CirculationPlanner
              captures: { d1_id: "$.data.id" }
            - call: "POST /catalog-circulation/drops/${d1_id}/circulation-lines"
              payload: { audience_type: "HOUSEFILE", housefile_segment_id: "${seg_a}", requested_quantity: 20000 }
              as: CirculationPlanner
              captures: { line_a: "$.data.id" }
            - call: "POST /catalog-circulation/drops/${d1_id}/circulation-lines"
              payload: { audience_type: "HOUSEFILE", housefile_segment_id: "${seg_b}", requested_quantity: 10000 }
              as: CirculationPlanner
              captures: { line_b: "$.data.id" }
            - call: "POST /catalog-circulation/drops/${d1_id}/allocate"
              payload: {}
              as: CirculationPlanner
            - call: "POST /catalog-circulation/circulation-lines/${line_b}/void"
              payload: {}
              as: CirculationPlanner
              captures: { b_ver_before: "$.data.version" }
          trigger:
            - call: "POST /catalog-circulation/circulation-plans/${plan_id}/cancel"
              payload: {}
              as: CirculationDirector
              captures: { p_status: "$.data.status", p_committed: "$.data.committed_cost_cents", p_unc: "$.data.uncommitted_budget_cents", p_cost: "$.data.planned_cost_cents", p_demand: "$.data.planned_demand_cents", p_contrib: "$.data.planned_contribution_cents" }
          assert:
            - "${p_status} == CANCELLED"
            - "CirculationLine.${line_a}.status == VOIDED with allocated_quantity, holdout_quantity, mailable_quantity, forecast_demand_cents, gross_margin_cents, circulation_cost_cents, contribution_cents and committed_cost_cents all 0"
            - "CirculationLine.${line_b}.status == VOIDED and version == ${b_ver_before}  # an already-terminal child is untouched by the cascade"
            - "Drop.${d1_id}.production_status == CANCELLED  # PLANNED children follow the parent"
            - "Drop.${d1_id}.measurement_status == PENDING  # the cancel does not touch the other dimension"
            - "MergePurgeRun.${run_id}.status == SUPERSEDED, not STALE and not FAILED"
            - "${p_committed} == 0 and ${p_unc} == 20000000  # exactly the 4720000 that line A still held was credited back, so budget == committed + uncommitted holds"
            - "${p_cost} == 0 and ${p_demand} == 0 and ${p_contrib} == 0  # the roll-up sees no ALLOCATED lines on non-CANCELLED drops"

      - name: allocation_debits_the_plan_ledger_in_the_same_response
        claim_type: ledger_sync
        excluded_because:
          difficulty_instance: voiding_a_line_restores_the_plan_budget_cents_exactly
          rationale: "That §1.8 compensating_invariant instance already reconciles the plan ledger across the ALLOCATED debit and the VOIDED credit, asserting committed_cost_cents and uncommitted_budget_cents before and after and pinning budget_cents == committed + uncommitted with zero drift. A separate ledger_sync corner would re-derive the same two numbers from the same waterfall."

      - name: drop_dimensions_change_independently_of_one_another
        claim_type: parallel
        excluded_because:
          difficulty_instance: drop_production_and_measurement_dimensions_advance_independently
          rationale: "The §1.8 non_linear_state_machine instance already advances production_status and measurement_status against each other, showing MAILED -> DELIVERED while measurement sits at MATCHBACK_OPEN and the single coupling guard reading production_status without changing it."

      - name: an_approved_plan_can_loop_back_to_draft
        claim_type: cyclic
        excluded_because:
          difficulty_instance: plan_revision_back_edge_reopens_approved_plan_and_unwinds_presort
          rationale: "The §1.8 instance walks the APPROVED -> DRAFT back edge, asserts revision_round increments, the three user-id fields clear, PRESORTED drops revert to PLANNED, their PostalPresortBatch rows are deleted and cost_basis returns to ESTIMATED_POSTAGE. Nothing about the cycle is left unclaimed."

      - name: merge_purge_fork_paths_each_work
        claim_type: branching
        excluded_because:
          difficulty_instance: merge_purge_fork_completed_and_failed_branches_differ_in_side_effects
          rationale: "The §1.8 instance drives both branches of the PENDING fork from the same endpoint and asserts the divergent side-effect sets - rentals netted or not, the prior COMPLETED universe superseded or preserved - which is strictly stronger than a generic 'each fork path works' claim."

      - name: presort_requires_a_guard_on_a_different_entity
        claim_type: guarded_transitions
        excluded_because:
          difficulty_instance: presorting_a_drop_requires_its_plan_to_be_approved
          rationale: "The §1.8 cross_entity_state_dependency instance already tests the guard in both directions on the same drop: rejected with ERR_INVALID_PLAN_STATE while the plan is DRAFT/COSTED/UNDER_REVIEW, and accepted the moment the plan reaches APPROVED with nothing else changed."

      - name: rental_cancellation_adjusts_lines_on_another_aggregate
        claim_type: cross_entity
        excluded_because:
          difficulty_instance: rental_cancel_cascades_four_hops_and_makes_merge_purge_run_stale
          rationale: "The §1.8 transitive_cascade instance follows the rental cancel into the lines it feeds, the plan ledger, the affected drops' quantities and cost per book, and the COMPLETED -> STALE recompute of the merge-purge run, verifying each downstream entity's state and fields."

      - name: mail_suppression_only_touches_lines_on_still_planned_drops
        claim_type: conditional_cascade
        excluded_because:
          difficulty_instance: mail_drop_cascades_five_hops_to_plan_budget_via_fatigue_suppression
          rationale: "The §1.8 instance already pins the conditional half of the cascade: lines whose parent Drop is PLANNED are SUPPRESSED while lines on drops already PRESORTED or beyond are deliberately left alone, with the budget credited only for the lines that actually left ALLOCATED."

  # ===========================================================================
  # SECTION 3 — calculations
  # ===========================================================================
  - section: calculations
    instances:

      - name: rfm_band_constants_map_to_tier_and_contact_strategy
        claim_type: constants_applied
        grounds:
          - calculations.segment_rfm_score
          - entities.HousefileSegment.fields.segment_tier
          - entities.HousefileSegment.fields.contact_strategy
        distinguishing_aspect: "Five segments are placed in five different tiers, including two that straddle the 600-point CORE/OCCASIONAL edge by a single band step (600 versus 580), and the strategy column is asserted alongside the tier because the mapping is not monotonic in an obvious way: CORE and OCCASIONAL share STANDARD while LAPSED gets REACTIVATION. An implementation that scores the three components correctly but banded the tiers with > instead of >= would put the 600 segment in OCCASIONAL."
        test_recipe:
          setup:
            - "Season FW26 only; no plans or drops are needed because rfm scoring happens entirely at segment creation."
            - "Recency bands: <=90 -> 40, <=180 -> 30, <=365 -> 18, <=730 -> 8, else 0. Frequency bands: >=6 -> 30, >=3 -> 22, >=2 -> 14, >=1 -> 6, else 0. Monetary bands: >=50000 -> 30, >=25000 -> 22, >=12000 -> 14, >=5000 -> 6, else 0. rfm_score is the summed points times 10."
          setup_api_calls:
            - call: "POST /catalog-circulation/seasons"
              payload: { season_code: "FW26", fiscal_year: 2026 }
              as: PlatformAdmin
              captures: { season_id: "$.data.id" }
          trigger:
            - call: "POST /catalog-circulation/housefile-segments"
              payload: { season_id: "${season_id}", segment_code: "S_BEST", recency_days: 45, orders_12mo: 7, ltv_cents: 62000, housefile_count: 30000, avg_order_value_cents: 18500, historical_response_rate_bps: 620 }
              as: CirculationPlanner
              captures: { best_score: "$.data.rfm_score", best_tier: "$.data.segment_tier", best_strategy: "$.data.contact_strategy" }
            - call: "POST /catalog-circulation/housefile-segments"
              payload: { season_id: "${season_id}", segment_code: "S_EDGE600", recency_days: 90, orders_12mo: 2, ltv_cents: 5000, housefile_count: 12000, avg_order_value_cents: 9000, historical_response_rate_bps: 300 }
              as: CirculationPlanner
              captures: { e600_score: "$.data.rfm_score", e600_tier: "$.data.segment_tier", e600_strategy: "$.data.contact_strategy" }
            - call: "POST /catalog-circulation/housefile-segments"
              payload: { season_id: "${season_id}", segment_code: "S_EDGE580", recency_days: 180, orders_12mo: 3, ltv_cents: 5000, housefile_count: 12000, avg_order_value_cents: 9000, historical_response_rate_bps: 300 }
              as: CirculationPlanner
              captures: { e580_score: "$.data.rfm_score", e580_tier: "$.data.segment_tier", e580_strategy: "$.data.contact_strategy" }
            - call: "POST /catalog-circulation/housefile-segments"
              payload: { season_id: "${season_id}", segment_code: "S_LAPSE200", recency_days: 730, orders_12mo: 1, ltv_cents: 5000, housefile_count: 8000, avg_order_value_cents: 7000, historical_response_rate_bps: 120 }
              as: CirculationPlanner
              captures: { lapse_score: "$.data.rfm_score", lapse_tier: "$.data.segment_tier", lapse_strategy: "$.data.contact_strategy" }
            - call: "POST /catalog-circulation/housefile-segments"
              payload: { season_id: "${season_id}", segment_code: "S_DORM", recency_days: 731, orders_12mo: 0, ltv_cents: 4999, housefile_count: 5000, avg_order_value_cents: 6000, historical_response_rate_bps: 40 }
              as: CirculationPlanner
              captures: { dorm_score: "$.data.rfm_score", dorm_tier: "$.data.segment_tier", dorm_strategy: "$.data.contact_strategy" }
          assert:
            - "${best_score} == 1000 with ${best_tier} == BEST and ${best_strategy} == PREMIUM_FULL  # 40 + 30 + 30 points"
            - "${e600_score} == 600 with ${e600_tier} == CORE and ${e600_strategy} == STANDARD  # 40 + 14 + 6; recency exactly 90 still earns the top band and the tier edge is inclusive"
            - "${e580_score} == 580 with ${e580_tier} == OCCASIONAL and ${e580_strategy} == STANDARD  # 30 + 22 + 6; one band step below the previous segment flips the tier but not the strategy"
            - "${lapse_score} == 200 with ${lapse_tier} == LAPSED and ${lapse_strategy} == REACTIVATION  # 8 + 6 + 6; recency exactly 730 is still inside the fourth band"
            - "${dorm_score} == 0 with ${dorm_tier} == DORMANT and ${dorm_strategy} == SUPPRESS_ONLY  # every component falls off its lowest band"
            - "S_DORM.suppressed_at is null even though contact_strategy is SUPPRESS_ONLY  # the timestamp is only stamped by a fatigue suppression, not by a dormant tier"
            - "every segment has rollup_housefile_count == its own housefile_count and is_leaf == true"

      - name: coop_model_score_bands_lift_and_cut_the_prospect_response_rate
        claim_type: correct_result
        grounds:
          - calculations.rental_expected_response_rate
          - entities.CatalogSeason.fields.prospect_base_response_bps
          - state_machines[ProspectListRental.status].transitions[REQUESTED->MODELED]
        distinguishing_aspect: "Four rentals are modeled at 399, 400, 600 and 800 - the three band edges plus the one value below the lowest edge - so the negative bottom band is exercised alongside the two positive lifts and the neutral band. The 399 case is the one an implementation that treats a model score as a quality bonus gets wrong: an unmodelled-quality list must respond BELOW the season base, at 77 bps rather than 110."
        test_recipe:
          setup:
            - "Season FW26 with the default prospect_base_response_bps of 110."
            - "Coop lift bands: score >= 800 -> +4000 bps; >= 600 -> +2000; >= 400 -> 0; else -3000."
          setup_api_calls:
            - call: "POST /catalog-circulation/seasons"
              payload: { season_code: "FW26", fiscal_year: 2026 }
              as: PlatformAdmin
              captures: { season_id: "$.data.id" }
            - call: "POST /catalog-circulation/prospect-list-rentals"
              payload: { season_id: "${season_id}", list_source_name: "L399", requested_gross_names: 10000, cost_per_thousand_cents: 8500, housefile_overlap_bps: 1000, inter_list_overlap_bps: 0 }
              as: ListBroker
              captures: { r399: "$.data.id" }
            - call: "POST /catalog-circulation/prospect-list-rentals"
              payload: { season_id: "${season_id}", list_source_name: "L400", requested_gross_names: 10000, cost_per_thousand_cents: 8500, housefile_overlap_bps: 1000, inter_list_overlap_bps: 0 }
              as: ListBroker
              captures: { r400: "$.data.id" }
            - call: "POST /catalog-circulation/prospect-list-rentals"
              payload: { season_id: "${season_id}", list_source_name: "L600", requested_gross_names: 10000, cost_per_thousand_cents: 8500, housefile_overlap_bps: 1000, inter_list_overlap_bps: 0 }
              as: ListBroker
              captures: { r600: "$.data.id" }
            - call: "POST /catalog-circulation/prospect-list-rentals"
              payload: { season_id: "${season_id}", list_source_name: "L800", requested_gross_names: 10000, cost_per_thousand_cents: 8500, housefile_overlap_bps: 1000, inter_list_overlap_bps: 0 }
              as: ListBroker
              captures: { r800: "$.data.id" }
          trigger:
            - call: "POST /catalog-circulation/prospect-list-rentals/${r399}/model"
              payload: { coop_model_score: 399 }
              as: ListBroker
              captures: { rate399: "$.data.expected_response_rate_bps" }
            - call: "POST /catalog-circulation/prospect-list-rentals/${r400}/model"
              payload: { coop_model_score: 400 }
              as: ListBroker
              captures: { rate400: "$.data.expected_response_rate_bps" }
            - call: "POST /catalog-circulation/prospect-list-rentals/${r600}/model"
              payload: { coop_model_score: 600 }
              as: ListBroker
              captures: { rate600: "$.data.expected_response_rate_bps" }
            - call: "POST /catalog-circulation/prospect-list-rentals/${r800}/model"
              payload: { coop_model_score: 800 }
              as: ListBroker
              captures: { rate800: "$.data.expected_response_rate_bps" }
          assert:
            - "${rate399} == 77  # round_half_up(110 * 7000 / 10000) - the lowest band CUTS the base rate"
            - "${rate400} == 110  # the neutral band leaves the season base untouched, and 400 is inclusive"
            - "${rate600} == 132  # round_half_up(110 * 12000 / 10000)"
            - "${rate800} == 154  # round_half_up(110 * 14000 / 10000)"
            - "all four rentals sit at status MODELED with unit_cost_cents_per_name still 0"

      - name: merge_purge_counts_leaf_segments_only_and_removes_suppressed_ones
        claim_type: input_set_filtering
        grounds:
          - calculations.merge_purge_net_mailable_names
          - entities.HousefileSegment.fields.is_leaf
          - entities.MergePurgeRun.fields.housefile_leaf_segment_count
          - complexity_profile.relationship_patterns
        distinguishing_aspect: "A three-level segment chain plus one dormant leaf pins two independent filters in one run: only leaves contribute names (65000 stored, 35000 counted) and SUPPRESS_ONLY leaves are counted into gross but removed as suppressed_names rather than silently dropped. The conservation invariant then has a non-zero suppressed term, which is the only configuration that distinguishes 'excluded from gross' from 'subtracted as suppressed'."
        test_recipe:
          setup:
            - "Season FW26 with the chain S_TOP (10000 names) -> S_MID (20000) -> S_LEAF (30000) and an unrelated dormant leaf S_SUP (5000) whose zero rfm score makes its contact_strategy SUPPRESS_ONLY."
            - "Plan P1 budget 20000000. No rentals are involved, so duplicates_removed must be 0."
          setup_api_calls:
            - call: "POST /catalog-circulation/seasons"
              payload: { season_code: "FW26", fiscal_year: 2026 }
              as: PlatformAdmin
              captures: { season_id: "$.data.id" }
            - call: "POST /catalog-circulation/housefile-segments"
              payload: { season_id: "${season_id}", segment_code: "S_TOP", recency_days: 45, orders_12mo: 7, ltv_cents: 62000, housefile_count: 10000, avg_order_value_cents: 18500, historical_response_rate_bps: 620 }
              as: CirculationPlanner
              captures: { top_id: "$.data.id" }
            - call: "POST /catalog-circulation/housefile-segments"
              payload: { season_id: "${season_id}", segment_code: "S_MID", recency_days: 45, orders_12mo: 7, ltv_cents: 62000, housefile_count: 20000, avg_order_value_cents: 18500, historical_response_rate_bps: 620, parent_segment_id: "${top_id}" }
              as: CirculationPlanner
              captures: { mid_id: "$.data.id" }
            - call: "POST /catalog-circulation/housefile-segments"
              payload: { season_id: "${season_id}", segment_code: "S_LEAF", recency_days: 45, orders_12mo: 7, ltv_cents: 62000, housefile_count: 30000, avg_order_value_cents: 18500, historical_response_rate_bps: 620, parent_segment_id: "${mid_id}" }
              as: CirculationPlanner
              captures: { leaf_id: "$.data.id" }
            - call: "POST /catalog-circulation/housefile-segments"
              payload: { season_id: "${season_id}", segment_code: "S_SUP", recency_days: 731, orders_12mo: 0, ltv_cents: 4999, housefile_count: 5000, avg_order_value_cents: 6000, historical_response_rate_bps: 40 }
              as: CirculationPlanner
              captures: { sup_id: "$.data.id", sup_strategy: "$.data.contact_strategy" }
            - call: "POST /catalog-circulation/circulation-plans"
              payload: { season_id: "${season_id}", plan_code: "P1", budget_cents: 20000000 }
              as: CirculationPlanner
              captures: { plan_id: "$.data.id", plan_v1: "$.data.version" }
          trigger:
            - call: "POST /catalog-circulation/circulation-plans/${plan_id}/merge-purge-runs"
              payload: { expected_plan_version: "${plan_v1}", input_rental_ids: [] }
              as: ListBroker
              captures: { gross: "$.data.gross_input_names", supp: "$.data.suppressed_names", dupes: "$.data.duplicates_removed", net: "$.data.net_mailable_names", leaf_count: "$.data.housefile_leaf_segment_count", order: "$.data.processing_order", status: "$.data.status" }
          assert:
            - "${sup_strategy} == SUPPRESS_ONLY"
            - "${gross} == 35000  # only S_LEAF (30000) and S_SUP (5000) are leaves; the 10000 and 20000 roll-up parents are NOT summed, so a naive all-segments sum of 65000 is wrong"
            - "${supp} == 5000  # the dormant leaf is counted into gross and then subtracted, not excluded from gross"
            - "${dupes} == 0 and ${order} is an empty array  # no rentals were named"
            - "${net} == 30000 and ${leaf_count} == 2"
            - "${gross} == ${net} + ${supp} + ${dupes}  # 35000 == 30000 + 5000 + 0"
            - "${status} == COMPLETED because net_mailable_names > 0"
            - "HousefileSegment.${top_id}.is_leaf == false, ${mid_id}.is_leaf == false, ${leaf_id}.is_leaf == true, ${sup_id}.is_leaf == true"

      - name: merge_purge_processing_order_is_coop_score_desc_not_creation_order
        claim_type: chronological
        grounds:
          - calculations.merge_purge_net_mailable_names.constants.processing_order_key
          - calculations.merge_purge_net_mailable_names.constants.first_rental_inter_list_rule
          - entities.MergePurgeRun.fields.processing_order
        distinguishing_aspect: "Two rentals are created in the opposite order to their coop scores, so the correct processing_order is the reverse of the creation order and of the payload order. Because only the FIRST list in processing order escapes the inter-list penalty, the two orderings produce different duplicate totals - 7600 versus 9100 - which makes the ordering observable in net_mailable_names rather than only in an array field."
        test_recipe:
          setup:
            - "Season FW26 with one leaf segment S_A (30000 names, not suppressed) and plan P1 budget 20000000."
            - "R_LOW is created FIRST and modeled at coop 500 (gross 10000, housefile overlap 1000 bps, inter-list overlap 4000 bps); R_HIGH is created SECOND and modeled at coop 900 (gross 20000, housefile overlap 1500 bps, inter-list overlap 3000 bps)."
            - "input_rental_ids is deliberately passed in creation order [R_LOW, R_HIGH] so the payload order cannot be mistaken for the processing order."
          setup_api_calls:
            - call: "POST /catalog-circulation/seasons"
              payload: { season_code: "FW26", fiscal_year: 2026 }
              as: PlatformAdmin
              captures: { season_id: "$.data.id" }
            - call: "POST /catalog-circulation/housefile-segments"
              payload: { season_id: "${season_id}", segment_code: "S_A", recency_days: 45, orders_12mo: 7, ltv_cents: 62000, housefile_count: 30000, avg_order_value_cents: 18500, historical_response_rate_bps: 620 }
              as: CirculationPlanner
            - call: "POST /catalog-circulation/prospect-list-rentals"
              payload: { season_id: "${season_id}", list_source_name: "R_LOW", requested_gross_names: 10000, cost_per_thousand_cents: 8500, housefile_overlap_bps: 1000, inter_list_overlap_bps: 4000 }
              as: ListBroker
              captures: { low_id: "$.data.id" }
            - call: "POST /catalog-circulation/prospect-list-rentals"
              payload: { season_id: "${season_id}", list_source_name: "R_HIGH", requested_gross_names: 20000, cost_per_thousand_cents: 8500, housefile_overlap_bps: 1500, inter_list_overlap_bps: 3000 }
              as: ListBroker
              captures: { high_id: "$.data.id" }
            - call: "POST /catalog-circulation/prospect-list-rentals/${low_id}/model"
              payload: { coop_model_score: 500 }
              as: ListBroker
            - call: "POST /catalog-circulation/prospect-list-rentals/${high_id}/model"
              payload: { coop_model_score: 900 }
