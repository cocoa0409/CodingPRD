            - "Outlet.${o}.service_posture == OPEN"
            - "DispenserUnit.${du}.status == IN_SERVICE"

  # ==========================================================================
  # §1.9 / errors — every catalog id must be triggerable. Ids already driven by
  # a §1.8 depth instance (ERR_SANITATION_OVERDUE, ERR_STOP_WINDOW_OVERLAP,
  # ERR_VAN_WINDOW_CONFLICT, ERR_INSUFFICIENT_VAN_PARTS,
  # ERR_RECALL_EXPOSURE_BELOW_FLOOR) or already driven from the entities,
  # state_machines, calculations, validations, rbac or
  # cross_cutting_complexity_layers sections of this file are not repeated
  # here; this section closes the remaining gaps in the 53-id catalog.
  # ==========================================================================
  - section: errors
    instances:

      - name: err_escalation_limit_reached_on_the_third_escalation
        claim_type: error_triggerable
        grounds:
          - errors[ERR_ESCALATION_LIMIT_REACHED]
          - validations[priority 12]
          - endpoints[POST /fountain-network/service-calls/{id}/escalate]
        distinguishing_aspect: "The cap is on escalation_count reaching 2, not on the number of dispatches: the third ON_SITE arrival is legal (a call may be dispatched from ESCALATED) and only the escalate call is refused, leaving the call ON_SITE with escalation_count still 2."
        test_recipe:
          setup:
            - "One OPEN service call cycled twice through dispatch -> arrive -> escalate by tech-1, so escalation_count is 2, then dispatched and arrived a third time."
          setup_api_calls:
            - call: "POST /fountain-network/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: NetworkAdmin
            - call: "POST /fountain-network/outlets"
              payload: { name: "Riverside Diner", account_code: "OUT-1001", region_code: "R-WEST" }
              as: NetworkAdmin
              captures: { o: $.data.id, ov: $.data.version }
            - call: "POST /fountain-network/placement-agreements"
              payload: { outlet_id: "${o}", term_start_date: "2026-01-01T00:00:00Z", term_end_date: "2027-01-01T00:00:00Z", annual_commitment_gallons: 8000, equipment_value_cents: 480000, expected_outlet_version: "${ov}" }
              as: NetworkAdmin
              captures: { ag: $.data.id }
            - call: "POST /fountain-network/dispenser-units"
              payload: { outlet_id: "${o}", agreement_id: "${ag}", serial_number: "SN-9001", model_code: "FREESTYLE_9100", installed_at: "2025-11-01T00:00:00Z" }
              as: NetworkAdmin
