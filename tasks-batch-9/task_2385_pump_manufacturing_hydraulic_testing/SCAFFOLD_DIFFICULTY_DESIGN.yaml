  # =====================================================================
  # Rule 6 - boundary_precision_check (five distinct endpoints)
  # =====================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: head_deviation_exactly_at_grade_1b_band_passes_while_one_hundredth_beyond_fails
        grounds:
          - calculations.certified_test_curve
          - validations[priority=65]
          - state_machines.TestRun.NOT_EVALUATED_to_WITHIN_TOLERANCE
          - endpoints["POST /test-runs/{id}/evaluate"]
        distinguishing_aspect: |
          Endpoint 1 of 5. The GRADE_1B head band is +/-3.0 percent and the comparison is
          inclusive, so head_deviation_pct == -3.00 must stay WITHIN_TOLERANCE while -3.01 must
          flip to OUT_OF_TOLERANCE and fire the rework cascade. The two runs differ by a single
          hundredth of a metre in one measured head (71.75 vs 71.74) on identical rigs, so any
          exclusive comparison, or any float-based rounding of the deviation, breaks exactly one
          of the two asserts.
        test_recipe:
          setup:
            - "Master data and APPROVED Selection on APP-1001 as in rule 1 instance 1: predicted_head_m 73.97, predicted_efficiency_pct 80.96, npshr_catalog_m 3.52 (verification limit 3.82)."
            - "CastingLot H-9001 ACCEPTED (4 pieces), BuildOrder SN-0001 ASSEMBLED."
            - "Two GRADE_1B TestRuns on SN-0001, both at 2950 rpm RATED_SPEED_CORRECTED so speed_ratio is exactly 1.0 and reported values equal measured values; both POINTS_LOCKED."
            - "TR-PASS carries head 71.75 at the 265.0 m3/h guarantee flow (deviation exactly -3.00); TR-FAIL is identical except head 71.74 (deviation -3.01). Both carry an npsh point of 3.40, inside the 3.82 limit."
          setup_api_calls:
            - call: "POST /foundries"
              payload: { foundry_code: "FDY-NORTH", name: "North Iron Works", approved_alloys: ["CI_GG25", "DUPLEX_S31803"], concurrent_pour_capacity: 2 }
