            - { call: "POST /beneficiary-claims/${bc1}/validate", payload: {}, as: ClaimsExaminer, as_user_id: "examiner-1" }
          trigger:
            - { call: "POST /beneficiary-claims/${bc2}/validate", payload: {}, as: ClaimsExaminer, as_user_id: "examiner-1", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_ALLOCATION_CAPACITY_EXCEEDED (409): 60 + 100 = 160 > 100"
            - "Carol's claim remains SUBMITTED; Alice's remains VALIDATED"

      - name: c_dmf_low_score_auto_false_positive
        claim_type: constants_applied
        grounds: ["calculations.dmf_match_score", "entities.DeathMasterMatch.fields.status"]
        distinguishing_aspect: "Score below the MANUAL_REVIEW_FLOOR (60) auto-marks FALSE_POSITIVE at creation and never creates a claim; no manual review is possible afterwards."
        test_recipe:
          setup: ["IL statute; policy with insured Jane Doe dob 1960-01-01 ssn 1234 zip 60601; clock 2026-06-01"]
          setup_api_calls:
            - { call: "POST /state-statutes", payload: { state_code: "IL", annual_interest_rate_bp: 1000, interest_basis: "DATE_OF_DEATH", grace_days: 30, payment_deadline_days: 30, dormancy_years: 3, raa_minimum_cents: 100000, raa_annual_interest_rate_bp: 300 }, as: ComplianceOfficer }
            - { call: "POST /policies", payload: { policy_number: "P-CALC-4", insured_name: "Jane Doe", insured_dob: "1960-01-01", insured_ssn_last4: "1234", insured_zip: "60601", state_code: "IL", face_amount_cents: 5000000, issue_date: "2024-03-01" }, as: PolicyAdministrator, captures: { pol: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-06-01T00:00:00Z" }, as: SystemAdmin }
          trigger:
            - { call: "POST /policies/${pol}/death-master-matches", payload: { deceased_name: "Nobody Else", deceased_dob: "1960-01-01", deceased_death_date: "2026-05-20" }, as: ComplianceOfficer, captures: { m: $.data.id, score: $.data.match_score, st: $.data.status, gc: $.data.generated_claim_id } }
            - { call: "POST /death-master-matches/${m}/review", payload: { review_outcome: "CONFIRMED" }, as: ComplianceOfficer, captures: { err: $.data.error_id } }
            - { call: "GET /claims", payload: { policy_id: "${pol}" }, as: ComplianceOfficer }
          assert:
            - "match_score == 25 (dob only) and status == FALSE_POSITIVE at creation; generated_claim_id == null"
            - "Manual review afterwards: ERR_MATCH_NOT_PENDING_REVIEW (409)"
            - "GET /claims?policy_id= returns 0 items (no claim auto-created)"

      - name: c_statutory_interest_variant_divergence
        claim_type: variant_divergence
        grounds: ["calculations.statutory_interest"]
        excluded_because:
          difficulty_instance: statutory_interest_basis_date_of_death_vs_proof_complete
          rationale: "Both basis variants and their numeric divergence are asserted there with literal values."

      - name: c_raa_yield_variant_divergence
        claim_type: variant_divergence
        grounds: ["calculations.raa_provisional_yield", "calculations.raa_final_yield"]
        excluded_because:
          difficulty_instance: raa_provisional_simple_vs_final_compound_yield
          rationale: "Provisional-vs-final divergence on identical balance is asserted there."

      - name: c_allocation_rounding_order
        claim_type: precision
        grounds: ["calculations.beneficiary_allocation"]
        excluded_because:
          difficulty_instance: allocation_per_beneficiary_rounding_then_remainder
          rationale: "Pinned per-beneficiary-round-first order and remainder assignment asserted with literal cents there."

  # ---------------------------------------------------------------------------
  # Section: validations
  # ---------------------------------------------------------------------------
  - section: validations
    instances:
      - name: c_missing_auth_header_returns_unauthenticated
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER]"]
        distinguishing_aspect: "A request without X-User-Role/X-User-ID headers fails at priority 1 with ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER (400) before any role or state check."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /policies", payload: { policy_number: "P-VAL-1", insured_name: "Amy Doe", insured_dob: "1970-07-07", state_code: "IL", face_amount_cents: 5000000, issue_date: "2024-03-01" }, as: "", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http 400 (request sent with no X-User-Role / X-User-ID headers)"

      - name: c_invalid_enum_returns_invalid_request
        claim_type: violation_to_error
        grounds: ["validations[priority=3]", "entities.BeneficiaryDesignation.fields.beneficiary_type"]
        distinguishing_aspect: "beneficiary_type outside {PRIMARY, CONTINGENT} is a shape error: ERR_INVALID_REQUEST (400) before existence/state checks."
        test_recipe:
          setup: ["policy exists"]
          setup_api_calls:
            - { call: "POST /policies", payload: { policy_number: "P-VAL-2", insured_name: "Amy Doe", insured_dob: "1970-07-07", state_code: "IL", face_amount_cents: 5000000, issue_date: "2024-03-01" }, as: PolicyAdministrator, captures: { pol: $.data.id, pol_v: $.data.version } }
          trigger:
            - { call: "POST /policies/${pol}/beneficiary-designations", payload: { beneficiary_name: "Amy Doe", beneficiary_type: "TERTIARY", share_percent: 50, effective_date: "2024-03-01", expected_policy_version: "${pol_v}" }, as: PolicyAdministrator, captures: { err: $.data.error_id } }
          assert: ["error_id == ERR_INVALID_REQUEST (400); designation list stays empty"]

      - name: c_invalid_death_date_boundaries_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_INVALID_DEATH_DATE]"]
        distinguishing_aspect: "date_of_death in the future (relative to the logical clock) OR before policy issue_date is rejected with ERR_INVALID_DEATH_DATE (422)."
        test_recipe:
          setup: ["IL statute; policy issued 2024-03-01; clock pinned at 2026-01-01"]
          setup_api_calls:
            - { call: "POST /state-statutes", payload: { state_code: "IL", annual_interest_rate_bp: 1000, interest_basis: "DATE_OF_DEATH", grace_days: 30, payment_deadline_days: 30, dormancy_years: 3, raa_minimum_cents: 100000, raa_annual_interest_rate_bp: 300 }, as: ComplianceOfficer }
            - { call: "POST /policies", payload: { policy_number: "P-VAL-3", insured_name: "Amy Doe", insured_dob: "1970-07-07", state_code: "IL", face_amount_cents: 5000000, issue_date: "2024-03-01" }, as: PolicyAdministrator, captures: { pol: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-01-01T00:00:00Z" }, as: SystemAdmin }
          trigger:
            - { call: "POST /claims", payload: { policy_id: "${pol}", date_of_death: "2026-03-01" }, as: ClaimsExaminer, as_user_id: "examiner-1", captures: { err1: $.data.error_id } }
            - { call: "POST /claims", payload: { policy_id: "${pol}", date_of_death: "2023-12-31" }, as: ClaimsExaminer, as_user_id: "examiner-1", captures: { err2: $.data.error_id } }
          assert:
            - "Future death (2026-03-01 > clock 2026-01-01): ERR_INVALID_DEATH_DATE (422)"
            - "Pre-issue death (2023-12-31 < issue 2024-03-01): ERR_INVALID_DEATH_DATE (422)"
            - "GET /claims?policy_id= returns 0 items"

      - name: c_claim_without_statute_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=11]", "errors[ERR_STATUTE_NOT_CONFIGURED]"]
        distinguishing_aspect: "Claim filing requires a configured StateStatute for the policy's state_code (cross-aggregate referential check); ZZ has none."
        test_recipe:
          setup: ["policy in state ZZ; no statute configured; clock 2026-03-05"]
          setup_api_calls:
            - { call: "POST /policies", payload: { policy_number: "P-VAL-4", insured_name: "Amy Doe", insured_dob: "1970-07-07", state_code: "ZZ", face_amount_cents: 5000000, issue_date: "2024-03-01" }, as: PolicyAdministrator, captures: { pol: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-05T00:00:00Z" }, as: SystemAdmin }
          trigger:
            - { call: "POST /claims", payload: { policy_id: "${pol}", date_of_death: "2026-03-01" }, as: ClaimsExaminer, as_user_id: "examiner-1", captures: { err: $.data.error_id } }
          assert: ["error_id == ERR_STATUTE_NOT_CONFIGURED (422)"]

      - name: c_designation_policy_mismatch_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=11]", "errors[ERR_DESIGNATION_POLICY_MISMATCH]"]
        distinguishing_aspect: "A beneficiary claim citing a designation that belongs to a DIFFERENT policy than the claim's policy fails validation with ERR_DESIGNATION_POLICY_MISMATCH."
        test_recipe:
          setup: ["IL statute; policies A and B; designation on B; claim on A; beneficiary claim citing B's designation"]
          setup_api_calls:
            - { call: "POST /state-statutes", payload: { state_code: "IL", annual_interest_rate_bp: 1000, interest_basis: "DATE_OF_DEATH", grace_days: 30, payment_deadline_days: 30, dormancy_years: 3, raa_minimum_cents: 100000, raa_annual_interest_rate_bp: 300 }, as: ComplianceOfficer }
            - { call: "POST /policies", payload: { policy_number: "P-VAL-5A", insured_name: "Amy Doe", insured_dob: "1970-07-07", state_code: "IL", face_amount_cents: 5000000, issue_date: "2024-03-01" }, as: PolicyAdministrator, captures: { pa: $.data.id } }
            - { call: "POST /policies", payload: { policy_number: "P-VAL-5B", insured_name: "Bob Doe", insured_dob: "1971-08-08", state_code: "IL", face_amount_cents: 5000000, issue_date: "2024-03-01" }, as: PolicyAdministrator, captures: { pb: $.data.id, pb_v: $.data.version } }
            - { call: "POST /policies/${pb}/beneficiary-designations", payload: { beneficiary_name: "Alice Doe", beneficiary_type: "PRIMARY", share_percent: 100, effective_date: "2024-03-01", expected_policy_version: "${pb_v}" }, as: PolicyAdministrator, captures: { des: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-05T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /claims", payload: { policy_id: "${pa}", date_of_death: "2026-03-01" }, as: ClaimsExaminer, as_user_id: "examiner-1", captures: { cl: $.data.id } }
            - { call: "POST /claims/${cl}/beneficiary-claims", payload: { designation_id: "${des}", claimant_name: "Alice Doe", claimant_type: "NAMED_BENEFICIARY" }, as: ClaimsExaminer, as_user_id: "examiner-1", captures: { bc: $.data.id } }
          trigger:
            - { call: "POST /beneficiary-claims/${bc}/validate", payload: {}, as: ClaimsExaminer, as_user_id: "examiner-1", captures: { err: $.data.error_id } }
          assert: ["error_id == ERR_DESIGNATION_POLICY_MISMATCH (422); beneficiary claim remains SUBMITTED"]

      - name: c_designation_already_claimed_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=10]", "errors[ERR_DESIGNATION_ALREADY_CLAIMED]"]
        distinguishing_aspect: "A second validation against an already-claimed designation fails with ERR_DESIGNATION_ALREADY_CLAIMED; note the second filing used the SAME claimant_name, so no dispute cascade fired — capacity and dispute are distinct mechanisms."
        test_recipe:
          setup: ["IL statute; policy with Alice PRIMARY 100%; claim UNDER_REVIEW; bc1 (Alice Doe) VALIDATED; bc2 (same claimant name Alice Doe) SUBMITTED"]
          setup_api_calls:
            - { call: "POST /state-statutes", payload: { state_code: "IL", annual_interest_rate_bp: 1000, interest_basis: "DATE_OF_DEATH", grace_days: 30, payment_deadline_days: 30, dormancy_years: 3, raa_minimum_cents: 100000, raa_annual_interest_rate_bp: 300 }, as: ComplianceOfficer }
            - { call: "POST /policies", payload: { policy_number: "P-VAL-6", insured_name: "Amy Doe", insured_dob: "1970-07-07", state_code: "IL", face_amount_cents: 5000000, issue_date: "2024-03-01" }, as: PolicyAdministrator, captures: { pol: $.data.id, pol_v: $.data.version } }
            - { call: "POST /policies/${pol}/beneficiary-designations", payload: { beneficiary_name: "Alice Doe", beneficiary_type: "PRIMARY", share_percent: 100, effective_date: "2024-03-01", expected_policy_version: "${pol_v}" }, as: PolicyAdministrator, captures: { des: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-05T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /claims", payload: { policy_id: "${pol}", date_of_death: "2026-03-01" }, as: ClaimsExaminer, as_user_id: "examiner-1", captures: { cl: $.data.id } }
            - { call: "POST /claims/${cl}/begin-review", payload: {}, as: ClaimsExaminer, as_user_id: "examiner-1" }
            - { call: "POST /claims/${cl}/beneficiary-claims", payload: { designation_id: "${des}", claimant_name: "Alice Doe", claimant_type: "NAMED_BENEFICIARY" }, as: ClaimsExaminer, as_user_id: "examiner-1", captures: { bc1: $.data.id } }
            - { call: "POST /beneficiary-claims/${bc1}/validate", payload: {}, as: ClaimsExaminer, as_user_id: "examiner-1" }
            - { call: "POST /claims/${cl}/beneficiary-claims", payload: { designation_id: "${des}", claimant_name: "Alice Doe", claimant_type: "NAMED_BENEFICIARY" }, as: ClaimsExaminer, as_user_id: "examiner-1", captures: { bc2: $.data.id } }
          trigger:
            - { call: "POST /beneficiary-claims/${bc2}/validate", payload: {}, as: ClaimsExaminer, as_user_id: "examiner-1", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_DESIGNATION_ALREADY_CLAIMED (409)"
            - "bc1 stays VALIDATED and claim stays UNDER_REVIEW (same claimant_name => no DISPUTED cascade)"

      - name: c_raa_minimum_pure_fiscal_rejected
        claim_type: violation_to_error
        grounds: ["validations[priority=12]", "errors[ERR_BELOW_RAA_MINIMUM]"]
        distinguishing_aspect: "Within the election window, an RAA election below the statute minimum (allocated 50000 < 100000) fails with ERR_BELOW_RAA_MINIMUM — the pure fiscal path (no temporal violation)."
        test_recipe:
          setup: ["TX statute; policy face 50000; claim approved 2026-03-05 (allocated 50000); election attempted same day"]
          setup_api_calls:
            - { call: "POST /state-statutes", payload: { state_code: "TX", annual_interest_rate_bp: 1200, interest_basis: "DATE_OF_DEATH", grace_days: 365, payment_deadline_days: 30, dormancy_years: 3, raa_minimum_cents: 100000, raa_annual_interest_rate_bp: 300 }, as: ComplianceOfficer }
            - { call: "POST /policies", payload: { policy_number: "P-VAL-7", insured_name: "Jim Poe", insured_dob: "1965-02-02", state_code: "TX", face_amount_cents: 50000, issue_date: "2024-03-01" }, as: PolicyAdministrator, captures: { pol: $.data.id, pol_v: $.data.version } }
            - { call: "POST /policies/${pol}/beneficiary-designations", payload: { beneficiary_name: "Alice Poe", beneficiary_type: "PRIMARY", share_percent: 100, effective_date: "2024-03-01", expected_policy_version: "${pol_v}" }, as: PolicyAdministrator, captures: { des: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-05T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /claims", payload: { policy_id: "${pol}", date_of_death: "2026-03-01" }, as: ClaimsExaminer, as_user_id: "examiner-1", captures: { cl: $.data.id } }
            - { call: "POST /claims/${cl}/documents", payload: { doc_type: "CERTIFIED_DEATH_CERTIFICATE" }, as: ClaimsExaminer, as_user_id: "examiner-1", captures: { doc: $.data.id } }
            - { call: "POST /claims/${cl}/documents/${doc}/review", payload: { review_result: "VERIFIED" }, as: ClaimsExaminer, as_user_id: "examiner-2" }
            - { call: "POST /claims/${cl}/begin-review", payload: {}, as: ClaimsExaminer, as_user_id: "examiner-1" }
            - { call: "POST /claims/${cl}/beneficiary-claims", payload: { designation_id: "${des}", claimant_name: "Alice Poe", claimant_type: "NAMED_BENEFICIARY" }, as: ClaimsExaminer, as_user_id: "examiner-1", captures: { bc: $.data.id } }
            - { call: "POST /beneficiary-claims/${bc}/validate", payload: {}, as: ClaimsExaminer, as_user_id: "examiner-1" }
            - { call: "POST /claims/${cl}/approve", payload: {}, as: ClaimsApprover, as_user_id: "approver-1", captures: { cl_v: $.data.version } }
          trigger:
            - { call: "POST /beneficiary-claims/${bc}/elections", payload: { option: "RETAINED_ASSET_ACCOUNT", expected_claim_version: "${cl_v}" }, as: ClaimsExaminer, as_user_id: "examiner-1", captures: { err: $.data.error_id } }
          assert: ["error_id == ERR_BELOW_RAA_MINIMUM (422); no election persisted"]

      - name: c_designation_frozen_after_claim_filed
        claim_type: violation_to_error
        grounds: ["validations[priority=9]", "errors[ERR_DESIGNATION_FROZEN_AFTER_CLAIM]"]
        distinguishing_aspect: "Beneficiary rights vest at death: once any claim exists on the policy, both creating and revoking designations are rejected with ERR_DESIGNATION_FROZEN_AFTER_CLAIM."
        test_recipe:
          setup: ["IL statute; policy with one ACTIVE designation; a claim already filed on the policy"]
          setup_api_calls:
            - { call: "POST /state-statutes", payload: { state_code: "IL", annual_interest_rate_bp: 1000, interest_basis: "DATE_OF_DEATH", grace_days: 30, payment_deadline_days: 30, dormancy_years: 3, raa_minimum_cents: 100000, raa_annual_interest_rate_bp: 300 }, as: ComplianceOfficer }
            - { call: "POST /policies", payload: { policy_number: "P-VAL-8", insured_name: "Amy Doe", insured_dob: "1970-07-07", state_code: "IL", face_amount_cents: 5000000, issue_date: "2024-03-01" }, as: PolicyAdministrator, captures: { pol: $.data.id, pol_v: $.data.version } }
            - { call: "POST /policies/${pol}/beneficiary-designations", payload: { beneficiary_name: "Alice Doe", beneficiary_type: "PRIMARY", share_percent: 100, effective_date: "2024-03-01", expected_policy_version: "${pol_v}" }, as: PolicyAdministrator, captures: { des: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-05T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /claims", payload: { policy_id: "${pol}", date_of_death: "2026-03-01" }, as: ClaimsExaminer, as_user_id: "examiner-1" }
            - { call: "GET /policies/${pol}", payload: {}, as: PolicyAdministrator, captures: { pol_v2: $.data.version } }
          trigger:
            - { call: "POST /policies/${pol}/beneficiary-designations", payload: { beneficiary_name: "Bob Doe", beneficiary_type: "CONTINGENT", share_percent: 100, effective_date: "2024-03-01", expected_policy_version: "${pol_v2}" }, as: PolicyAdministrator, captures: { err1: $.data.error_id } }
            - { call: "POST /beneficiary-designations/${des}/revoke", payload: {}, as: PolicyAdministrator, captures: { err2: $.data.error_id } }
          assert:
            - "Create after claim: ERR_DESIGNATION_FROZEN_AFTER_CLAIM (409)"
            - "Revoke after claim: ERR_DESIGNATION_FROZEN_AFTER_CLAIM (409); designation stays ACTIVE"

      - name: c_lapsed_policy_blocks_new_designation
        claim_type: violation_to_error
        grounds: ["validations[priority=6]", "errors[ERR_POLICY_NOT_ACTIVE]", "state_machines.Policy.ACTIVE_to_LAPSED"]
        distinguishing_aspect: "Designation creation on a LAPSED policy is a state error (ERR_POLICY_NOT_ACTIVE); lapse itself sets lapse_date from the logical clock."
        test_recipe:
          setup: ["IL statute; policy lapsed at 2026-01-15"]
          setup_api_calls:
            - { call: "POST /state-statutes", payload: { state_code: "IL", annual_interest_rate_bp: 1000, interest_basis: "DATE_OF_DEATH", grace_days: 30, payment_deadline_days: 30, dormancy_years: 3, raa_minimum_cents: 100000, raa_annual_interest_rate_bp: 300 }, as: ComplianceOfficer }
            - { call: "POST /policies", payload: { policy_number: "P-VAL-9", insured_name: "Amy Doe", insured_dob: "1970-07-07", state_code: "IL", face_amount_cents: 5000000, issue_date: "2024-03-01" }, as: PolicyAdministrator, captures: { pol: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-01-15T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /policies/${pol}/lapse", payload: {}, as: PolicyAdministrator, captures: { st: $.data.status } }
            - { call: "GET /policies/${pol}", payload: {}, as: PolicyAdministrator, captures: { pol_v: $.data.version } }
          trigger:
            - { call: "POST /policies/${pol}/beneficiary-designations", payload: { beneficiary_name: "Bob Doe", beneficiary_type: "PRIMARY", share_percent: 100, effective_date: "2026-01-01", expected_policy_version: "${pol_v}" }, as: PolicyAdministrator, captures: { err: $.data.error_id } }
          assert:
            - "Lapse succeeded: status == LAPSED, lapse_date == '2026-01-15'"
            - "Designation create on lapsed policy: ERR_POLICY_NOT_ACTIVE (409)"

      - name: c_approve_state_vs_safety_priority
        claim_type: priority_ordering
        grounds: ["validations[priority=6]", "validations[priority=7]"]
        excluded_because:
          difficulty_instance: approve_state_error_beats_segregation_of_duties
          rationale: "State-beats-safety priority asserted there."

      - name: c_election_temporal_vs_fiscal_priority
        claim_type: priority_ordering
        grounds: ["validations[priority=9]", "validations[priority=12]"]
        excluded_because:
          difficulty_instance: election_window_closed_beats_raa_minimum
          rationale: "Temporal-beats-fiscal priority asserted there."

  # ---------------------------------------------------------------------------
  # Section: endpoints
  # ---------------------------------------------------------------------------
  - section: endpoints
    instances:
      - name: c_filtered_list_lookups
        claim_type: retrieval
        grounds: ["endpoints.\"GET /claims", "endpoints.\"GET /beneficiary-claims", "endpoints.\"GET /policies/{policyId}/beneficiary-designations"]
        distinguishing_aspect: "FK reverse-reachability filters work: claims by policy_id+status, beneficiary-claims by designation_id, designations by policy path + beneficiary_type."
        test_recipe:
          setup: ["IL statute; policy with one PRIMARY designation; two claims (one NOTIFIED, one UNDER_REVIEW); one beneficiary claim on the designation"]
          setup_api_calls:
            - { call: "POST /state-statutes", payload: { state_code: "IL", annual_interest_rate_bp: 1000, interest_basis: "DATE_OF_DEATH", grace_days: 30, payment_deadline_days: 30, dormancy_years: 3, raa_minimum_cents: 100000, raa_annual_interest_rate_bp: 300 }, as: ComplianceOfficer }
            - { call: "POST /policies", payload: { policy_number: "P-EP-1", insured_name: "Amy Doe", insured_dob: "1970-07-07", state_code: "IL", face_amount_cents: 5000000, issue_date: "2024-03-01" }, as: PolicyAdministrator, captures: { pol: $.data.id, pol_v: $.data.version } }
            - { call: "POST /policies/${pol}/beneficiary-designations", payload: { beneficiary_name: "Alice Doe", beneficiary_type: "PRIMARY", share_percent: 100, effective_date: "2024-03-01", expected_policy_version: "${pol_v}" }, as: PolicyAdministrator, captures: { des: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-03-05T00:00:00Z" }, as: SystemAdmin }
            - { call: "POST /claims", payload: { policy_id: "${pol}", date_of_death: "2026-03-01" }, as: ClaimsExaminer, as_user_id: "examiner-1", captures: { c1: $.data.id } }
            - { call: "POST /claims", payload: { policy_id: "${pol}", date_of_death: "2026-03-02" }, as: ClaimsExaminer, as_user_id: "examiner-1", captures: { c2: $.data.id } }
            - { call: "POST /claims/${c2}/begin-review", payload: {}, as: ClaimsExaminer, as_user_id: "examiner-1" }
            - { call: "POST /claims/${c2}/beneficiary-claims", payload: { designation_id: "${des}", claimant_name: "Alice Doe", claimant_type: "NAMED_BENEFICIARY" }, as: ClaimsExaminer, as_user_id: "examiner-1", captures: { bc: $.data.id } }
          trigger:
            - { call: "GET /claims", payload: { policy_id: "${pol}", status: "NOTIFIED" }, as: ClaimsExaminer }
            - { call: "GET /beneficiary-claims", payload: { designation_id: "${des}" }, as: ClaimsExaminer }
            - { call: "GET /policies/${pol}/beneficiary-designations", payload: { beneficiary_type: "PRIMARY" }, as: ClaimsExaminer }
          assert:
            - "GET /claims?policy_id&status=NOTIFIED returns exactly 1 item with id == ${c1}"
            - "GET /beneficiary-claims?designation_id= returns exactly 1 item with id == ${bc}"
            - "GET /policies/{id}/beneficiary-designations?beneficiary_type=PRIMARY returns exactly 1 item with id == ${des}"

  # ---------------------------------------------------------------------------
