            - "Overflow: error_id == ERR_SITE_CAPACITY_EXCEEDED (422); stockpile stays 0.3"

  # ---------------------------------------------------------------------------
  - section: validations
    instances:
      - name: request_missing_auth_headers_unauthenticated
        claim_type: violation_to_error
        grounds:
          - "validations[priority=1]"
          - "errors[ERR_UNAUTHENTICATED]"
        distinguishing_aspect: "Missing X-User-Role/X-User-ID is rejected before any role or existence check (401)."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /programs"
              as: ""
              captures: { e: $.data.error_id }
          assert:
            - "error_id == ERR_UNAUTHENTICATED, http status 401 (priority 1 precedes everything else)"

      - name: program_window_shorter_than_seven_days_invalid
        claim_type: violation_to_error
        grounds:
          - "entities.Program.fields.window_end"
          - "errors[ERR_VALIDATION]"
          - "endpoints['POST /programs]"
        distinguishing_aspect: "Window of 3 days fails the >= 7 day minimum; also verifies the error envelope shape (response_type error, data.error_id, meta.api_request_id present)."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /programs"
              payload: { name: "Short", season_label: "X", window_start: "2027-01-02T00:00:00Z", window_end: "2027-01-05T00:00:00Z" }
              as: ProgramAdmin
              captures: { e: $.data.error_id }
          assert:
            - "error_id == ERR_VALIDATION, http 400"
            - "Envelope: response_type == error, data.message present, meta.api_request_id and meta.api_request_timestamp present"

      - name: ticket_source_xor_enforced
