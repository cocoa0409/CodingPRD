          setup_api_calls:
            - call: "POST /api/parcels"
              payload: { parcel_name: "DFP", county: "Travis", earnest_money_cents: 100000, planned_sellout_months: 24 }
              as: DeveloperOperator
              captures: { dfp: $.data.id }
            - call: "POST /api/parcels/${dfp}/open-contingency"
              payload: { contingency_end_date: "2027-01-01T00:00:00Z" }
              as: DeveloperOperator
            - call: "POST /api/parcels/${dfp}/clear-contingency"
              payload: {}
              as: DeveloperOperator
            - call: "POST /api/phases"
              payload: { parcel_id: "${dfp}", phase_name: "PH", sequence_number: 1, planned_lot_count: 2, selling_window_start: "2026-09-01T00:00:00Z", selling_window_end: "2027-03-01T00:00:00Z" }
              as: DeveloperOperator
              captures: { dfph: $.data.id }
            - call: "POST /api/phases/${dfph}/submit-plat"
              payload: { plat_lot_count: 2, lot_type: "STANDARD" }
              as: DeveloperOperator
            - call: "POST /api/phases/${dfph}/review-plat"
              payload: { decision: "APPROVE" }
              as: MunicipalClerk
            - call: "POST /api/phases/${dfph}/record-plat"
              payload: {}
              as: MunicipalClerk
            - call: "GET /api/parcels/${dfp}"
              as: DeveloperOperator
              captures: { df_total0: $.data.total_lots_planned, df_avail0: $.data.lots_available_count, df_pct0: $.data.closed_pct }
            - call: "POST /api/infrastructure-bonds"
              payload: { phase_id: "${dfph}", engineer_estimate_cents: 10000000 }
              as: DeveloperOperator
              captures: { dfbd: $.data.id }
            - call: "POST /api/infrastructure-bonds/${dfbd}/award-bid"
              payload: { awarded_bid_cents: 9000000 }
              as: DeveloperOperator
            - call: "POST /api/infrastructure-bonds/${dfbd}/post-bond"
              payload: { posted_amount_cents: 9900000 }
              as: DeveloperOperator
            - call: "POST /api/phases/${dfph}/activate"
              payload: {}
              as: DeveloperOperator
            - call: "POST /api/builders"
              payload: { builder_name: "DFB", license_number: "LIC-DF", contact_email: "df@x.com" }
              as: DeveloperOperator
              captures: { dfb: $.data.id }
            - call: "POST /api/takedown-agreements"
              payload: { parcel_id: "${dfp}", builder_id: "${dfb}", effective_date: "2026-01-01T00:00:00Z", base_lot_price_cents: 5000000, escalator_rate_bp_per_quarter: 300, price_cap_bp: 12000, min_lots_per_quarter: 1, scheduled_lot_count: 2 }
              as: DeveloperOperator
              captures: { dfag: $.data.id }
            - call: "POST /api/takedown-agreements/${dfag}/activate"
              payload: {}
              as: DeveloperOperator
            - call: "POST /api/development-loans"
              payload: { parcel_id: "${dfp}", commitment_amount_cents: 50000000, release_price_floor_bp: 8000 }
              as: DeveloperOperator
              captures: { dfln: $.data.id }
            - call: "POST /api/development-loans/${dfln}/activate"
              payload: {}
              as: DeveloperOperator
            - call: "GET /api/lots?phase_id=${dfph}"
              as: DeveloperOperator
              captures: { dflot: $.data.0.id }
            - call: "POST /api/lots/${dflot}/reserve"
              payload: { agreement_id: "${dfag}" }
              as: BuilderRep
              as_user_id: "${dfb}"
            - call: "POST /api/lot-closings"
              payload: { lot_id: "${dflot}", agreement_id: "${dfag}" }
              as: BuilderRep
              as_user_id: "${dfb}"
              captures: { dfcl: $.data.id }
          trigger:
            - call: "POST /api/lot-closings/${dfcl}/finalize"
              payload: {}
              as: LenderOfficer
            - call: "GET /api/parcels/${dfp}"
              as: DeveloperOperator
              captures: { df_total1: $.data.total_lots_planned, df_avail1: $.data.lots_available_count, df_closed1: $.data.lots_closed_count, df_pct1: $.data.closed_pct, df_pace: $.data.straight_line_pace_pm, df_proj: $.data.projected_months_to_sellout, df_elig: $.data.next_phase_release_eligible }
          assert:
            - "after record: df_total0 == 2, df_avail0 == 2, df_pct0 == 0"
            - "after finalize: df_total1 == 2, df_avail1 == 1, df_closed1 == 1, df_pct1 == 50.0"
            - "df_pace == 0.0833 (2/24, 4dp) and df_proj == 12.0 (1 / 0.0833 rounded 1dp) and df_elig == false (> 6 month lead)"

      - name: cascade_stubs_covered_by_difficulty
        claim_type: cascade_chain
        grounds: [state_machines.LotClosing.PENDING_to_CLOSED, state_machines.TakedownAgreement.ACTIVE_to_DEFAULTED]
        excluded_because:
          difficulty_instance: closing_finalize_cascade
          rationale: "Both cascade chains (finalize depth-4, declare-default depth-3) are asserted end-to-end by §1.8 instances closing_finalize_cascade and agreement_default_cascade."

      - name: loan_auto_paid_off_covered
        claim_type: rate_threshold_trigger
        grounds: [state_machines.DevelopmentLoan.ACTIVE_to_PAID_OFF]
        excluded_because:
          difficulty_instance: closing_finalize_cascade
          rationale: "PAID_OFF at zero balance is asserted in that instance's trigger asserts."

  # ---------------------------------------------------------------------------
  - section: consistency_model
    instances:
      - name: immediate_consistency_visible_in_same_response
        claim_type: immediate_consistency
        grounds: [complexity_profile.consistency_model, endpoints]
        distinguishing_aspect: "Immediate consistency: the reserve response itself shows sales_status RESERVED with version bumped, and a following GET returns the identical state — no lag, no async reconciliation."
        test_recipe:
          setup: ["Parcel P ACQUIRED; phase ACTIVE with 1 lot; agreement ACTIVE"]
          setup_api_calls:
            - call: "POST /api/parcels"
              payload: { parcel_name: "IMP", county: "Travis", earnest_money_cents: 100000 }
              as: DeveloperOperator
              captures: { imp: $.data.id }
            - call: "POST /api/parcels/${imp}/open-contingency"
              payload: { contingency_end_date: "2027-01-01T00:00:00Z" }
              as: DeveloperOperator
            - call: "POST /api/parcels/${imp}/clear-contingency"
              payload: {}
              as: DeveloperOperator
            - call: "POST /api/phases"
              payload: { parcel_id: "${imp}", phase_name: "PH", sequence_number: 1, planned_lot_count: 1, selling_window_start: "2026-09-01T00:00:00Z", selling_window_end: "2027-03-01T00:00:00Z" }
              as: DeveloperOperator
              captures: { imph: $.data.id }
            - call: "POST /api/phases/${imph}/submit-plat"
              payload: { plat_lot_count: 1, lot_type: "STANDARD" }
              as: DeveloperOperator
            - call: "POST /api/phases/${imph}/review-plat"
              payload: { decision: "APPROVE" }
              as: MunicipalClerk
            - call: "POST /api/phases/${imph}/record-plat"
              payload: {}
              as: MunicipalClerk
            - call: "POST /api/infrastructure-bonds"
              payload: { phase_id: "${imph}", engineer_estimate_cents: 10000000 }
              as: DeveloperOperator
              captures: { imbd: $.data.id }
            - call: "POST /api/infrastructure-bonds/${imbd}/award-bid"
              payload: { awarded_bid_cents: 9000000 }
              as: DeveloperOperator
            - call: "POST /api/infrastructure-bonds/${imbd}/post-bond"
              payload: { posted_amount_cents: 9900000 }
              as: DeveloperOperator
            - call: "POST /api/phases/${imph}/activate"
              payload: {}
              as: DeveloperOperator
            - call: "POST /api/builders"
              payload: { builder_name: "IMB", license_number: "LIC-IM", contact_email: "im@x.com" }
              as: DeveloperOperator
              captures: { imb: $.data.id }
            - call: "POST /api/takedown-agreements"
              payload: { parcel_id: "${imp}", builder_id: "${imb}", effective_date: "2026-01-01T00:00:00Z", base_lot_price_cents: 5000000, escalator_rate_bp_per_quarter: 300, price_cap_bp: 12000, min_lots_per_quarter: 1, scheduled_lot_count: 1 }
              as: DeveloperOperator
              captures: { imag: $.data.id }
            - call: "POST /api/takedown-agreements/${imag}/activate"
              payload: {}
              as: DeveloperOperator
            - call: "GET /api/lots?phase_id=${imph}"
              as: DeveloperOperator
              captures: { imlot: $.data.0.id, imlot_v0: $.data.0.version }
          trigger:
            - call: "POST /api/lots/${imlot}/reserve"
              payload: { agreement_id: "${imag}" }
              as: BuilderRep
              as_user_id: "${imb}"
              captures: { im_sales: $.data.sales_status, im_v: $.data.version, im_agr: $.data.reserved_agreement_id }
            - call: "GET /api/lots/${imlot}"
              as: DeveloperOperator
              captures: { im_sales2: $.data.sales_status, im_v2: $.data.version }
          assert:
            - "reserve response itself: captured im_sales == RESERVED, im_agr == ${imag}, im_v == imlot_v0 + 1 (mutation visible in the same response)"
            - "follow-up GET agrees: im_sales2 == RESERVED and im_v2 == im_v"
