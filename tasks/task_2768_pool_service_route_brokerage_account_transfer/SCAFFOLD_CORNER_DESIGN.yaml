              payload: {"deal_id": "${deal_id}", "introduction_date": "2026-08-01"}
              as: Seller
              as_user_id: "${seller_id}"
            - call: "GET /route-listings/${listing_id}"
              as: Broker
            - call: "POST /service-accounts/${a1_id}/introduce"
              payload: {"deal_id": "${deal_id}", "introduction_date": "2026-08-01"}
              as: Seller
              as_user_id: "${seller_id}"
            - call: "GET /route-listings/${listing_id}"
              as: Broker
            - call: "GET /service-accounts/${a2_id}"
              as: Broker
          assert:
            - "GET the listing before any introduction: data.introductions_completed_count == 0."
            - "introduce A2 (MON, the queue head): the 200 response body itself already has data.transfer_status == \"INTRODUCED\", data.deal_id == ${deal_id}, data.introduced_on == \"2026-08-01\" and data.introduction_sequence_no == 1 -- no re-read is needed to see the stamp."
            - "GET the listing immediately after that write: data.introductions_completed_count == 1 already."
            - "introduce A1 (TUE, next in route-day order): the response has data.introduction_sequence_no == 2."
            - "GET the listing again: data.introductions_completed_count == 2 and data.verified_account_count is still 2 -- the introduction moved the transfer dimension only."
            - "GET A2: data.introduction_sequence_no == 1 and data.verification_status is still \"VERIFIED\", identical to what its own write response reported."

