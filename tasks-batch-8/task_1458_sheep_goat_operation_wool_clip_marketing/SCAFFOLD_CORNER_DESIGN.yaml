  # ---------------------------------------------------------------------------
  - section: endpoints
    instances:
      - name: pool_statement_unknown_pool_not_found
        claim_type: computed_read_not_found
        grounds: ["endpoints.GET /api/pool-statements/{pool_ref}", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "The computed pool statement returns 404 for a pool_ref with zero consignments rather than an all-zero statement."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /api/pool-statements/WWPA-NONE", payload: {}, as: RanchManager, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_NOT_FOUND (404)"

      - name: shearing_window_infeasible_and_feasibility_boundary
        claim_type: conditional_action_with_boundary
        grounds: ["validations[priority=13]", "errors[ERR_SHEARING_WINDOW_INFEASIBLE]"]
        distinguishing_aspect: "Feasibility is days*capacity >= expected_head: 201 head against 2 days x 100/day is infeasible, but exactly 200 head (equality) books successfully."
        test_recipe:
          setup: ["Flock (SHEEP, 500); crew capacity 100/day"]
          setup_api_calls:
            - { call: "POST /api/flocks", payload: { flock_name: "Feasible Ranch", species: "SHEEP", baseline_headcount: 500 }, as: RanchManager, captures: { fl: $.data.id } }
            - { call: "POST /api/shearing-crews", payload: { crew_name: "Slow Crew", head_per_day_capacity: 100, daily_rate_cents: 20000 }, as: RanchManager, captures: { cr: $.data.id } }
          trigger:
            - { call: "POST /api/shearing-events", payload: { flock_id: "${fl}", crew_id: "${cr}", scheduled_start: "2026-08-03T00:00:00Z", scheduled_end: "2026-08-05T00:00:00Z", expected_head: 201 }, as: RanchManager, captures: { err: $.data.error_id } }
            - { call: "POST /api/shearing-events", payload: { flock_id: "${fl}", crew_id: "${cr}", scheduled_start: "2026-08-10T00:00:00Z", scheduled_end: "2026-08-12T00:00:00Z", expected_head: 200 }, as: RanchManager, captures: { ev: $.data.id } }
          assert:
            - "201 head in a 2-day window: error_id == ERR_SHEARING_WINDOW_INFEASIBLE (422)"
            - "200 head in a 2-day window (2 * 100 == 200, equality): ShearingEvent.${ev} created SCHEDULED"

      - name: crew_inactive_scheduling_rejected
        claim_type: conditional_action
        grounds: ["validations[priority=6]", "errors[ERR_CREW_INACTIVE]", state_machines.ShearingCrew]
        distinguishing_aspect: "An INACTIVE crew cannot take new bookings (state precondition on a referenced resource)."
        test_recipe:
          setup: ["Flock (SHEEP, 500); crew deactivated while it had no bookings"]
          setup_api_calls:
            - { call: "POST /api/flocks", payload: { flock_name: "Inactive Ranch", species: "SHEEP", baseline_headcount: 500 }, as: RanchManager, captures: { fl: $.data.id } }
            - { call: "POST /api/shearing-crews", payload: { crew_name: "Retired Crew", head_per_day_capacity: 300, daily_rate_cents: 40000 }, as: RanchManager, captures: { cr: $.data.id } }
            - { call: "POST /api/shearing-crews/${cr}/deactivate", payload: {}, as: RanchManager }
          trigger:
            - { call: "POST /api/shearing-events", payload: { flock_id: "${fl}", crew_id: "${cr}", scheduled_start: "2026-08-03T00:00:00Z", scheduled_end: "2026-08-05T00:00:00Z", expected_head: 400 }, as: RanchManager, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_CREW_INACTIVE (409); no event created"

      - name: crew_busy_deactivate_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.ShearingCrew.ACTIVE_to_INACTIVE, "errors[ERR_CREW_BUSY]"]
        distinguishing_aspect: "A crew with a SCHEDULED booking cannot be deactivated."
        test_recipe:
          setup: ["Flock (SHEEP, 500); crew with a SCHEDULED event"]
          setup_api_calls:
            - { call: "POST /api/flocks", payload: { flock_name: "BusyCrew Ranch", species: "SHEEP", baseline_headcount: 500 }, as: RanchManager, captures: { fl: $.data.id } }
            - { call: "POST /api/shearing-crews", payload: { crew_name: "Booked Crew", head_per_day_capacity: 300, daily_rate_cents: 40000 }, as: RanchManager, captures: { cr: $.data.id } }
            - { call: "POST /api/shearing-events", payload: { flock_id: "${fl}", crew_id: "${cr}", scheduled_start: "2026-08-03T00:00:00Z", scheduled_end: "2026-08-05T00:00:00Z", expected_head: 400 }, as: RanchManager, captures: { ev: $.data.id } }
          trigger:
            - { call: "POST /api/shearing-crews/${cr}/deactivate", payload: {}, as: RanchManager, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_CREW_BUSY (409); crew_status stays ACTIVE"

      - name: grazing_moves_filtered_list_reverse_reachability
        claim_type: fk_reverse_reachability
        grounds: [entities.GrazingMove.fields.pasture_id, entities.GrazingMove.fields.flock_id, endpoints.GET /api/grazing-moves]
        distinguishing_aspect: "The filtered list serves as the FK reverse channel: pasture_id filter returns exactly the 2 moves on that pasture, flock_id returns all 3."
        test_recipe:
          setup: ["Flock (SHEEP, 500); pastures P1 and P2; moves P1[09-01,09-10), P1[09-10,09-20) adjacent, P2[09-01,09-10)"]
          setup_api_calls:
            - { call: "POST /api/flocks", payload: { flock_name: "Filter Ranch", species: "SHEEP", baseline_headcount: 500 }, as: RanchManager, captures: { fl: $.data.id } }
            - { call: "POST /api/pastures", payload: { pasture_name: "P1", acres: 100.0, carrying_capacity_head: 500 }, as: RanchManager, captures: { p1: $.data.id } }
            - { call: "POST /api/pastures", payload: { pasture_name: "P2", acres: 100.0, carrying_capacity_head: 500 }, as: RanchManager, captures: { p2: $.data.id } }
            - { call: "POST /api/grazing-moves", payload: { flock_id: "${fl}", pasture_id: "${p1}", move_start: "2026-09-01T00:00:00Z", move_end: "2026-09-10T00:00:00Z", head_count: 100 }, as: RangeHand }
            - { call: "POST /api/grazing-moves", payload: { flock_id: "${fl}", pasture_id: "${p1}", move_start: "2026-09-10T00:00:00Z", move_end: "2026-09-20T00:00:00Z", head_count: 80 }, as: RangeHand }
            - { call: "POST /api/grazing-moves", payload: { flock_id: "${fl}", pasture_id: "${p2}", move_start: "2026-09-01T00:00:00Z", move_end: "2026-09-10T00:00:00Z", head_count: 50 }, as: RangeHand }
          trigger:
            - { call: "GET /api/grazing-moves", payload: { pasture_id: "${p1}" }, as: RanchManager }
            - { call: "GET /api/grazing-moves", payload: { flock_id: "${fl}" }, as: RanchManager }
            - { call: "GET /api/grazing-moves", payload: { pasture_id: "${p2}" }, as: RanchManager }
          assert:
            - "GET ?pasture_id=${p1}: total_count == 2"
            - "GET ?flock_id=${fl}: total_count == 3"
            - "GET ?pasture_id=${p2}: total_count == 1"

      - name: clip_discovery_by_shearing_event
        claim_type: fk_reverse_reachability
        grounds: [entities.WoolClip.fields.shearing_event_id, endpoints.GET /api/wool-clips]
        distinguishing_aspect: "The cascade-created WoolClip is discoverable only via the filtered list: 0 rows before completion, exactly 1 after (1:1 as an array)."
        test_recipe:
          setup: ["Flock (SHEEP, 500); crew; event IN_PROGRESS at clock 2026-08-03"]
          setup_api_calls:
            - { call: "POST /api/flocks", payload: { flock_name: "Clip Ranch", species: "SHEEP", baseline_headcount: 500 }, as: RanchManager, captures: { fl: $.data.id } }
            - { call: "POST /api/shearing-crews", payload: { crew_name: "Crew CL", head_per_day_capacity: 300, daily_rate_cents: 40000 }, as: RanchManager, captures: { cr: $.data.id } }
            - { call: "POST /api/shearing-events", payload: { flock_id: "${fl}", crew_id: "${cr}", scheduled_start: "2026-08-03T00:00:00Z", scheduled_end: "2026-08-05T00:00:00Z", expected_head: 400 }, as: RanchManager, captures: { ev: $.data.id } }
          trigger:
            - { call: "GET /api/wool-clips", payload: { shearing_event_id: "${ev}" }, as: RanchManager, captures: { } }
            - { call: "POST /api/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /api/shearing-events/${ev}/transitions", payload: { to: "IN_PROGRESS" }, as: RangeHand }
            - { call: "POST /api/shearing-events/${ev}/complete", payload: { shorn_head_count: 400, greasy_weight_lbs: 200.0, skirtings_weight_lbs: 20.0 }, as: RangeHand }
            - { call: "GET /api/wool-clips", payload: { shearing_event_id: "${ev}" }, as: RanchManager }
          assert:
            - "Before completion: total_count == 0"
            - "After completion: total_count == 1 and the row's flock_id == ${fl}, greasy_weight_lbs == 200.0, marketing_posture == UNGRADED"

