  - method: POST
    path: "/rmn/line-items/{id}/pause"
    description: "Manually pauses a SERVING line item, releasing its reservation and slot occupancy."
    roles: [NetworkAdmin, AccountManager, AdvertiserUser]
    code: 200
    input: ["pause_reason"]
    output: LineItem
    side_effects: ["sets line_item_status=MANUAL_PAUSED and stamps last_pause_at", "releases LineItem.reserved_cents back to BudgetPlan.available_cents", "decrements PlacementSlot.occupancy_count by 1", "when no line item on the campaign remains SERVING the campaign rolls up DELIVERING -> PAUSED", "increments LineItem.version by 1"]
  - method: POST
    path: "/rmn/line-items/{id}/resume"
    description: "Returns an OOS_PAUSED or MANUAL_PAUSED line item to SERVING once its blocking condition has cleared."
    roles: [NetworkAdmin, AccountManager, CatalogOps, AdvertiserUser]
    code: 200
    input: []
    output: LineItem
    side_effects: ["sets line_item_status=SERVING and clears pause_reason", "re-runs slot_occupancy_overlap and re-increments PlacementSlot.occupancy_count", "re-reserves line_item_reservation against BudgetPlan.available_cents", "increments LineItem.version by 1"]
  - method: POST
    path: "/rmn/line-items/{id}/end"
    description: "Ends a line item from ELIGIBLE, SERVING, OOS_PAUSED or MANUAL_PAUSED; ENDED is the terminal compensator that guarantees no occupancy or reservation leaks."
    roles: [NetworkAdmin, AccountManager, AdvertiserUser]
    code: 200
    input: ["end_reason?"]
    output: LineItem
    side_effects: ["sets line_item_status=ENDED", "releases any remaining LineItem.reserved_cents to BudgetPlan.available_cents so committed + top_up == available + reserved + consumed still holds", "decrements PlacementSlot.occupancy_count by 1 when the line item was holding occupancy", "increments LineItem.version by 1"]
  # --- CatalogProduct -------------------------------------------------------
  - method: POST
    path: "/rmn/catalog-products"
    description: "Registers a retail SKU that sponsored line items may promote."
    roles: [NetworkAdmin, CatalogOps]
    code: 201
    input: ["sku", "category_code", "title", "price_cents", "in_stock_units", "margin_pct", "min_stock_units_for_serving?"]
    output: CatalogProduct
    side_effects: ["creates CatalogProduct with eligibility_status derived from in_stock_units against min_stock_units_for_serving"]
  - method: GET
    path: "/rmn/catalog-products"
    description: "Lists catalog products, filterable by category, eligibility status and SKU."
    roles: [NetworkAdmin, CatalogOps, AccountManager, AuctionService, AdvertiserUser]
    code: 200
    input: ["category_code?", "eligibility_status?", "sku?", "limit?", "offset?"]
    output: CatalogProduct[]
    side_effects: []
  - method: GET
    path: "/rmn/catalog-products/{id}"
    description: "Reads one catalog product with its live stock and eligibility state."
    roles: [NetworkAdmin, CatalogOps, AccountManager, AuctionService, AdvertiserUser]
    code: 200
    input: []
    output: CatalogProduct
    side_effects: []
  - method: POST
    path: "/rmn/catalog-products/{id}/stock-adjustments"
    description: "Applies a signed stock movement; crossing below min_stock_units_for_serving fires the depth-3 out-of-stock pausing cascade and crossing back above it clears the cascade."
    roles: [NetworkAdmin, CatalogOps]
    code: 200
    input: ["delta_units", "adjustment_reference?"]
    output: CatalogProduct
    side_effects: ["updates in_stock_units and last_stock_change_at", "L1: falling below the threshold sets eligibility_status=OUT_OF_STOCK and every ACTIVE ProductAssignment -> PAUSED_OOS", "L2: each affected LineItem recomputes eligible_product_count and, when it reaches 0, transitions SERVING -> OOS_PAUSED releasing its reservation and slot occupancy", "L3: each affected Campaign with no remaining SERVING line item transitions DELIVERING -> PAUSED", "rising back to or above the threshold sets eligibility_status=ELIGIBLE and restores PAUSED_OOS assignments to ACTIVE without auto-resuming line items"]
  - method: POST
    path: "/rmn/catalog-products/{id}/restrict"
    description: "Restricts an ELIGIBLE or OUT_OF_STOCK product for policy reasons, pausing every assignment that references it."
    roles: [NetworkAdmin, CatalogOps]
    code: 200
    input: ["restricted_reason"]
    output: CatalogProduct
    side_effects: ["sets eligibility_status=RESTRICTED", "every ACTIVE or PAUSED_OOS ProductAssignment -> PAUSED_RESTRICTED, driving the same L2/L3 cascade as an out-of-stock event"]
  - method: POST
    path: "/rmn/catalog-products/{id}/reinstate"
    description: "Clears a RESTRICTED product back to ELIGIBLE or OUT_OF_STOCK depending on its current stock level."
    roles: [NetworkAdmin, CatalogOps]
    code: 200
    input: ["reinstatement_note?"]
    output: CatalogProduct
    side_effects: ["clears restricted_reason", "sets eligibility_status=ELIGIBLE when in_stock_units >= min_stock_units_for_serving, otherwise OUT_OF_STOCK", "restores PAUSED_RESTRICTED assignments to ACTIVE or PAUSED_OOS accordingly"]
  - method: POST
    path: "/rmn/catalog-products/{id}/delist"
    description: "Permanently delists a product; DELISTED is terminal and removes every assignment."
    roles: [NetworkAdmin, CatalogOps]
    code: 200
    input: ["delist_reason"]
    output: CatalogProduct
    side_effects: ["sets eligibility_status=DELISTED", "every non-REMOVED ProductAssignment -> REMOVED with removed_at stamped, driving the L2/L3 pausing cascade"]
