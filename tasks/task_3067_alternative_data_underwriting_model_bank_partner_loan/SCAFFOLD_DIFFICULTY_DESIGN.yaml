  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: application_not_found_beats_segregation_of_duties
        grounds:
          - validations[priority=3]
          - validations[priority=6]
        distinguishing_aspect: |
          Category pair existence (priority 3) vs business_safety (priority 6): a
          manual-decision call on a verification under a nonexistent application id
          must return 404 ERR_NOT_FOUND even when the acting officer IS the same
          user who ran the instant check — the SoD violation is never evaluated
          because path existence dominates it.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z (default). Empty database (no applications at all)."
          setup_api_calls: []
          trigger:
            - call: "POST /platform/applications/00000000-0000-4000-8000-0000000000aa/verifications/00000000-0000-4000-8000-0000000000bb/manual-decision"
              payload: { outcome: "PASS" }
              as: VerificationOfficer
              as_user_id: "vo-one"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 404 and error_id == ERR_NOT_FOUND"
            - "error_id != ERR_SEGREGATION_OF_DUTIES — priority 3 existence is evaluated before priority 6 business_safety"

      - name: model_state_error_beats_fairness_gate_error
        grounds:
          - validations[priority=5]
          - validations[priority=7]
        distinguishing_aspect: |
          Category pair state (priority 5) vs business_safety (priority 7): calling
          activate on a model still in DRAFT that ALSO has no PASSED
          disparate-impact review must return ERR_MODEL_INVALID_STATE, not
          ERR_FAIRNESS_GATE_BLOCKING — the state precondition dominates the
          governance gate even though both are violated.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z (default)."
            - "Model M in DRAFT with no fairness reviews at all (so the fairness gate would fail if reached)."
          setup_api_calls:
            - call: "POST /platform/model-versions"
              payload: { model_code: "ADU-P-1", variables: [{ name: "bureau_score", weight: 1, min: 300, max: 850 }], calibration_note: "draft", score_floor: 0, score_ceiling: 1000 }
              as: RiskOfficer
              as_user_id: "ro-creator"
              captures: { m_id: $.data.id }
          trigger:
            - call: "POST /platform/model-versions/${m_id}/activate"
              payload: {}
              as: RiskOfficer
              as_user_id: "ro-creator"
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_MODEL_INVALID_STATE"
            - "error_id != ERR_FAIRNESS_GATE_BLOCKING — priority 5 state dominates priority 7 business_safety"
            - "ModelVersion.${m_id}.status is still DRAFT"

