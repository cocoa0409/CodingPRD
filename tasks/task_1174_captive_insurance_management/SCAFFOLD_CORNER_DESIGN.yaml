        distinguishing_aspect: |
          Request without X-User-ID or X-User-Role header returns 400
          ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER.
        test_recipe:
          setup:
            - "Empty database"
          setup_api_calls: []
          trigger:
            - call: "POST /api/captives"
              payload: { captive_name: "No Auth", domicile_jurisdiction: "VERMONT", formation_date: "2026-01-15T00:00:00Z", capitalization_amount: 500000 }
              as: CaptiveManager
          assert:
            - "Response status == 400"
            - "Response error_id == ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER"

