  - method: GET
    path: "/program/purchase-options/{id}"
    description: "Fetch one purchase option"
    roles: [PlatformAdmin, ComplianceOfficer, SupportAgent, Driver]
    code: 200
    input: [""]
    output: PurchaseOption
    side_effects: []
  - method: GET
    path: "/program/purchase-options"
    description: "List purchase options filtered by agreement or driver"
    roles: [PlatformAdmin, ComplianceOfficer, SupportAgent]
    code: 200
    input: ["agreement_id?", "driver_id?", "option_status?", "limit?", "offset?"]
    output: PurchaseOption[]
    side_effects: []
  - method: POST
    path: "/program/purchase-options/{id}/elect"
    description: "Driver elects the purchase option, deferring the open rental week"
    roles: [Driver]
    code: 200
    input: ["expected_agreement_version"]
    output: PurchaseOption
    side_effects:
      - "option_status OFFERED -> ELECTED"
      - "the agreement's open week becomes DEFERRED"
      - "RentalAgreement.agreement_status -> PURCHASE_PENDING"
      - "increments RentalAgreement.version by 1"
      - "purchase_escrow_schedule recomputed"
  - method: POST
    path: "/program/purchase-options/{id}/fund-escrow"
    description: "Fund one weekly escrow period toward the purchase option"
    roles: [Driver]
    code: 200
    input: [""]
    output: PurchaseOption
    side_effects:
      - "escrow_balance_cents increased by escrow_required_cents"
      - "escrow_weeks_funded advanced by one"
      - "purchase_option_equity_credit recomputed"
      - "increments the option's RentalAgreement.version by 1"
  - method: POST
    path: "/program/purchase-options/{id}/withdraw"
    description: "Driver withdraws the option, reversing the deferred week"
    roles: [Driver]
    code: 200
    input: [""]
    output: PurchaseOption
    side_effects: ["option_status -> WITHDRAWN", "the agreement's deferred week returns to OPEN", "agreement_status PURCHASE_PENDING -> ACTIVE"]
  - method: POST
    path: "/program/purchase-options/{id}/complete"
    description: "Complete the purchase once escrow and equity cover the buyout price"
    roles: [PlatformAdmin]
    code: 200
    input: [""]
    output: PurchaseOption
    side_effects: ["option_status -> COMPLETED", "the vehicle is retired from the rental fleet", "agreement_status PURCHASE_PENDING -> PURCHASED"]

  - method: POST
    path: "/program/platform-checks/{id}"
    description: "Re-run a platform qualification check"
    roles: [ComplianceOfficer]
    code: 200
    input: [""]
    output: PlatformIntegration
    side_effects: ["integration_result, ride_qualified and delivery_qualified recomputed"]
  - method: GET
    path: "/program/platform-checks/{id}"
    description: "Fetch one platform qualification check"
    roles: [PlatformAdmin, ComplianceOfficer, FleetOpsAgent, SupportAgent]
    code: 200
    input: [""]
    output: PlatformIntegration
    side_effects: []
  - method: POST
    path: "/program/platform-checks"
    description: "Submit a program vehicle to the rideshare platform and record whether it qualifies for ride and delivery activity"
    roles: [ComplianceOfficer]
    code: 201
    input: ["agreement_id", "vehicle_id"]
    output: PlatformIntegration
    side_effects:
      - "platform_qualification_verdict computed into integration_result, ride_qualified, delivery_qualified and model_restriction_hit"
      - "the unit is submitted to the platform only when the owning driver's eligibility_status is ELIGIBLE"
  - method: GET
    path: "/program/platform-checks"
    description: "List platform qualification checks filtered by agreement or vehicle"
    roles: [PlatformAdmin, ComplianceOfficer, FleetOpsAgent, SupportAgent]
    code: 200
    input: ["agreement_id?", "vehicle_id?", "integration_result?", "limit?", "offset?"]
    output: PlatformIntegration[]
    side_effects: []

  - method: POST
    path: "/program/fleet-facts"
    description: "Declare regional driver demand in vehicle units for fleet sizing"
    roles: [PlatformAdmin]
    code: 201
    input: ["region_code", "demand_units"]
    output: FleetFact
    side_effects: ["fleet_sizing_utilization computed provisionally"]
  - method: GET
    path: "/program/fleet-facts/{id}"
    description: "Fetch one regional fleet fact"
    roles: [PlatformAdmin, FleetOpsAgent, SupportAgent]
    code: 200
    input: [""]
    output: FleetFact
    side_effects: []
  - method: POST
    path: "/program/fleet-facts/{id}/recompute"
    description: "Recompute utilization and the sizing deficit for the region and re-derive the fleet posture"
    roles: [PlatformAdmin, FleetOpsAgent]
    code: 200
    input: [""]
    output: FleetFact
    side_effects: ["active_agreements_count, available_fleet_count, utilization_bps and sizing_deficit_units recomputed", "fleet_fact_status re-derived"]

  - method: POST
    path: "/program/_clock/set_current_utc"
    description: "Advance the logical clock. The server default clock reads 2026-09-01T00:00:00Z before any call and never falls back to wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: ["to_iso8601"]
    output: { current_utc: string }
    side_effects: ["every time-gated transition whose deadline the new instant reaches is applied"]

errors:
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "request body fails schema validation, a required field is absent, or an unknown field is supplied"
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role is missing or unknown, or X-User-ID is missing or does not resolve to an instance of the role's backing entity"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the acting role may not perform the operation, or the acting X-User-ID neither owns the target resource nor holds override authority"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "the resource named by the path does not exist"
  - id: ERR_REFERENCED_ENTITY_NOT_FOUND
    http: 404
    condition: "a foreign key in the request body names a row that does not exist"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "the target resource is not in a state from which the requested operation is declared"
  - id: ERR_AGREEMENT_FROZEN
    http: 409
    condition: "RentalAgreement.compliance_posture is FROZEN, so the operation is barred while recovery is outstanding"
  - id: ERR_POSTURE_NOT_OPEN
    http: 409
    condition: "the purchase stream requires RentalAgreement.compliance_posture == OPEN, not merely a posture below FROZEN"
  - id: ERR_DRIVING_RECORD_INELIGIBLE
    http: 422
    condition: "Driver.driving_record_points exceeds 6 when the enrollment is evaluated"
  - id: ERR_PLATFORM_ACTIVITY_INSUFFICIENT
    http: 422
    condition: "the driver's platform activity score is below the program activity floor, so the platform would not dispatch work to the unit"
  - id: ERR_DRIVER_NOT_ELIGIBLE
    http: 422
    condition: "Driver.eligibility_status is not ELIGIBLE, or the enrollment is not ACTIVE, at the moment of a dispatch-relevant operation"
  - id: ERR_ENROLLMENT_NOT_ACTIVE
    http: 409
    condition: "RentalAgreement.enrollment_id names an enrollment whose enrollment_status is not ACTIVE"
  - id: ERR_DRIVER_VEHICLE_CONFLICT
    http: 409
    condition: "the driver already holds a ProgramVehicle in ASSIGNED status, so a second assignment is refused"
  - id: ERR_VEHICLE_NOT_AVAILABLE
    http: 409
    condition: "the requested ProgramVehicle is not AVAILABLE"
  - id: ERR_MODEL_NOT_QUALIFIED
    http: 409
    condition: "the requested ProgramVehicle's class is not permitted for the agreement's tier or for the activity the platform requires"
  - id: ERR_WEEK_OVERLAP
    http: 409
    condition: "the operation would leave two weeks of the same agreement sharing a week_number"
  - id: ERR_WEEK_OUTSIDE_AGREEMENT_TERM
    http: 422
    condition: "the weekly period starting at the logical clock instant would extend past RentalAgreement.period_end, so the period falls outside the agreement's contractual term"
  - id: ERR_VEHICLE_INTERVAL_OVERLAP
    http: 409
    condition: "the requested rental interval collides with an existing occupancy interval on the same ProgramVehicle"
  - id: ERR_MAINTENANCE_WINDOW_CONFLICT
    http: 409
    condition: "a maintenance event is reported against a unit whose recovery interval is still open"
  - id: ERR_PAYMENT_BELOW_AMOUNT_DUE
    http: 402
    condition: "the tendered amount is below the outstanding amount due on the week and the payment is not a partial tender"
  - id: ERR_GRACE_NOT_LAPSED
    http: 422
    condition: "the logical clock is before the week's grace_deadline, so the week may not be declared delinquent"
  - id: ERR_PURCHASE_BLOCKED_BY_DELINQUENCY
    http: 409
    condition: "a week of the agreement is delinquent, so the purchase option may not be elected"
  - id: ERR_ESCROW_INCOMPLETE
    http: 422
    condition: "the purchase option has not funded the required number of escrow weeks"
  - id: ERR_RECOVERY_ALREADY_CLOSED
    http: 409
    condition: "the agreement's recovered-week set is already closed, so recovery cannot be executed again"
  - id: ERR_LOANER_UNAVAILABLE
    http: 409
    condition: "no available ProgramVehicle of the required region and class exists to issue as a loaner, so the maintenance window would interrupt the driver's earnings"
  - id: ERR_STALE_AGREEMENT_VERSION
    http: 412
    condition: "expected_agreement_version does not match RentalAgreement.version"
  - id: ERR_STALE_VEHICLE_VERSION
    http: 412
    condition: "expected_vehicle_version does not match ProgramVehicle.version"

roles:
  - name: Driver
    description: "Rideshare driver enrolled in the program; acts only on their own enrollment, agreement and purchase option"
    identity: "entity_backed:Driver"
    exclusive_operations: ["POST /program/purchase-options/{id}/elect", "POST /program/purchase-options/{id}/fund-escrow", "POST /program/purchase-options/{id}/withdraw"]
    shared_operations: ["GET /program/drivers/{id}", "GET /program/drivers/{id}/summary", "GET /program/enrollments/{id}", "POST /program/enrollments/{id}/withdraw", "GET /program/agreements/{id}", "GET /program/agreements/{id}/summary", "GET /program/weeks/{id}", "GET /program/maintenance-events/{id}", "GET /program/purchase-options/{id}"]
  - name: FleetOpsAgent
    description: "Operational agent owning the fleet surface: vehicle admission, dispatch-relevant assignment, swaps, service events and recovery"
    identity: "opaque"
    exclusive_operations: ["POST /program/vehicles", "POST /program/agreements", "POST /program/agreements/{id}/activate", "POST /program/agreements/{id}/swap", "POST /program/agreements/{id}/complete", "POST /program/agreements/{id}/escalate-recovery", "POST /program/agreements/{id}/recover", "POST /program/weeks", "POST /program/maintenance-events", "POST /program/maintenance-events/{id}/start", "POST /program/maintenance-events/{id}/issue-loaner", "POST /program/maintenance-events/{id}/complete"]
