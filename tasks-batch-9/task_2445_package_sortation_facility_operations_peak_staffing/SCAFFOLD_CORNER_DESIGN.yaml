scaffold_corner_design:
  # ===================================================================
  # 1. Entities
  # ===================================================================
  - section: entities
    instances:
      - name: sort_center_create_returns_full_projection
        claim_type: Creation
        grounds:
          - entities.SortCenter
          - endpoints.POST_/sortation/sort-centers
          - response_envelope.success
        distinguishing_aspect: "A create with only the four input fields returns 201 with every computed and system field initialized, the flex pool split as available == total, and created_at equal to the DEFAULT logical clock 2026-08-01T00:00:00Z (no clock call was made)."
        test_recipe:
          setup:
            - "Empty database; the logical clock has never been set, so it holds its default 2026-08-01T00:00:00Z"
          setup_api_calls: []
          trigger:
            - call: "POST /sortation/sort-centers"
              payload: { code: "SC1", name: "Memphis Sort 1", automation_utilization_pct: 70, flex_pool_total: 20 }
              as: FacilityAdmin
              captures: { center_id: $.data.id }
          assert:
            - "HTTP 201 with meta.api_request_id and meta.api_request_timestamp present and response_type == object"
            - "data.code == SC1, data.name == Memphis Sort 1, data.automation_utilization_pct == 70, data.flex_pool_total == 20"
            - "data.ops_posture == OPEN and data.last_posture_change_at == 2026-08-01T00:00:00Z"
            - "data.flex_pool_available == 20 and data.flex_pool_reserved == 0"
            - "data.packages_inducted_count == 0, wip_package_count == 0, exception_hold_count == 0, disposed_package_count == 0, missort_corrected_count == 0"
            - "data.open_jam_count == 0 and data.open_serious_injury_count == 0"
            - "data.id is a UUID, data.version == 1, data.created_at == data.updated_at == 2026-08-01T00:00:00Z"

      - name: dock_door_get_returns_stored_row
        claim_type: Retrieval
        grounds:
          - entities.DockDoor
          - endpoints.GET_/sortation/dock-doors/{id}
        distinguishing_aspect: "A single-resource GET returns exactly what the create stored, including an explicitly supplied turnaround_buffer_min of 30 rather than the default 15."
        test_recipe:
          setup:
            - "Center SC1 with one inbound door IN-1 created with turnaround_buffer_min 30"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T06:00:00Z" }
              as: FacilityAdmin
            - call: "POST /sortation/sort-centers"
              payload: { code: "SC1", name: "Memphis Sort 1", automation_utilization_pct: 70, flex_pool_total: 20 }
              as: FacilityAdmin
              captures: { center_id: $.data.id }
            - call: "POST /sortation/sort-centers/${center_id}/dock-doors"
              payload: { door_number: "IN-1", kind: "INBOUND", turnaround_buffer_min: 30 }
              as: FacilityAdmin
              captures: { door_id: $.data.id }
          trigger:
            - call: "GET /sortation/dock-doors/${door_id}"
              payload: {}
              as: InboundCoordinator
          assert:
            - "HTTP 200 with response_type == object"
            - "data.id == ${door_id}, data.sort_center_id == ${center_id}, data.door_number == IN-1, data.kind == INBOUND"
            - "data.status == ACTIVE and data.turnaround_buffer_min == 30 (the supplied value, not the default 15)"
            - "data.created_at == 2026-08-03T06:00:00Z and data.version == 1"

      - name: workers_list_filtered_by_status_with_pagination
        claim_type: Listing
        grounds:
          - endpoints.GET_/sortation/sort-centers/{id}/workers
          - response_envelope.pagination_fields
          - entities.Worker.fields.status
        distinguishing_aspect: "The sub-resource list applies the status filter and the limit/offset window together, and reports total_count over the FILTERED set with has_more flipping on the last page."
        test_recipe:
          setup:
            - "Center SC1 with three workers: W-A left in APPLIED, W-B advanced to ONBOARDING, W-C advanced to CLEARED"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T06:00:00Z" }
              as: FacilityAdmin
            - call: "POST /sortation/sort-centers"
              payload: { code: "SC1", name: "Memphis Sort 1", automation_utilization_pct: 70, flex_pool_total: 20 }
              as: FacilityAdmin
              captures: { center_id: $.data.id }
            - call: "POST /sortation/sort-centers/${center_id}/workers"
              payload: { full_name: "W-A", hire_class: "CORE", hire_date: "2026-08-01" }
              as: LaborPlanner
              as_user_id: "u_planner_1"
              captures: { wa_id: $.data.id }
            - call: "POST /sortation/sort-centers/${center_id}/workers"
              payload: { full_name: "W-B", hire_class: "SEASONAL", hire_date: "2026-08-01" }
              as: LaborPlanner
              as_user_id: "u_planner_1"
              captures: { wb_id: $.data.id }
            - call: "POST /sortation/workers/${wb_id}/onboarding-events"
              payload: { event_type: "ONBOARDING_STARTED" }
              as: LaborPlanner
              as_user_id: "u_planner_1"
            - call: "POST /sortation/sort-centers/${center_id}/workers"
              payload: { full_name: "W-C", hire_class: "FLEX", hire_date: "2026-08-01" }
              as: LaborPlanner
              as_user_id: "u_planner_1"
              captures: { wc_id: $.data.id }
            - call: "POST /sortation/workers/${wc_id}/onboarding-events"
              payload: { event_type: "ONBOARDING_STARTED" }
              as: LaborPlanner
              as_user_id: "u_planner_1"
            - call: "POST /sortation/workers/${wc_id}/onboarding-events"
              payload: { event_type: "BACKGROUND_CLEARED" }
              as: LaborPlanner
              as_user_id: "u_planner_1"
          trigger:
            - call: "GET /sortation/sort-centers/${center_id}/workers"
              payload: { status: "APPLIED" }
              as: LaborPlanner
              as_user_id: "u_planner_1"
            - call: "GET /sortation/sort-centers/${center_id}/workers"
              payload: { limit: 2, offset: 0 }
              as: LaborPlanner
              as_user_id: "u_planner_1"
            - call: "GET /sortation/sort-centers/${center_id}/workers"
              payload: { limit: 2, offset: 2 }
              as: LaborPlanner
              as_user_id: "u_planner_1"
          assert:
            - "the status == APPLIED call returns response_type == array with exactly one row whose id == ${wa_id}, total_count == 1, has_more == false"
            - "the limit 2 / offset 0 call returns 2 rows, total_count == 3, has_more == true"
            - "the limit 2 / offset 2 call returns 1 row, total_count == 3, has_more == false"
            - "the two pages together contain ${wa_id}, ${wb_id} and ${wc_id} with no duplicates"

      - name: get_shift_plan_unknown_id_returns_not_found
        claim_type: Not Found
        grounds:
          - validations.7_ERR_SHIFT_PLAN_NOT_FOUND
          - endpoints.GET_/sortation/shift-plans/{id}
          - response_envelope.error
        distinguishing_aspect: "A syntactically valid but unknown UUID on the shift-plan read returns the entity-family 404 with the error envelope, not an empty 200."
        test_recipe:
          setup:
            - "Empty database apart from the logical clock being set"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T06:00:00Z" }
              as: FacilityAdmin
          trigger:
            - call: "GET /sortation/shift-plans/00000000-0000-0000-0000-0000000000ff"
              payload: {}
              as: LaborPlanner
              as_user_id: "u_planner_1"
          assert:
            - "HTTP 404 with response_type == error and data.error_id == ERR_SHIFT_PLAN_NOT_FOUND"
            - "data.message is a non-empty string and meta.api_request_id is present"

      - name: trailer_appointment_create_missing_manifest_count_invalid_request
        claim_type: Required Fields
        grounds:
          - validations.3_ERR_INVALID_REQUEST
          - endpoints.POST_/sortation/trailer-appointments
          - entities.TrailerAppointment.fields.manifest_package_count
        distinguishing_aspect: "manifest_package_count has source input with no default, so omitting it fails the shape check at priority 3 before any existence or conflict rule runs."
        test_recipe:
          setup:
            - "Center SC1 with inbound door IN-1"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T06:00:00Z" }
              as: FacilityAdmin
            - call: "POST /sortation/sort-centers"
              payload: { code: "SC1", name: "Memphis Sort 1", automation_utilization_pct: 70, flex_pool_total: 20 }
              as: FacilityAdmin
              captures: { center_id: $.data.id }
            - call: "POST /sortation/sort-centers/${center_id}/dock-doors"
              payload: { door_number: "IN-1", kind: "INBOUND" }
              as: FacilityAdmin
              captures: { door_id: $.data.id }
          trigger:
            - call: "POST /sortation/trailer-appointments"
              payload: { sort_center_id: "${center_id}", door_id: "${door_id}", trailer_code: "T-A", window_start: "2026-08-03T06:00:00Z", window_end: "2026-08-03T07:00:00Z", priority_class: "STANDARD" }
              as: InboundCoordinator
          assert:
            - "HTTP 400 with data.error_id == ERR_INVALID_REQUEST"
            - "no TrailerAppointment row is created: GET /sortation/trailer-appointments filtered by sort_center_id == ${center_id} returns total_count == 0"

      - name: sort_chute_create_applies_concurrency_default
        claim_type: Defaults
        grounds:
          - entities.SortChute.fields.max_concurrent_destinations
          - endpoints.POST_/sortation/sort-centers/{id}/sort-chutes
          - calculations.chute_concurrency_capacity
        distinguishing_aspect: "Omitting max_concurrent_destinations applies DEFAULT_MAX_CONCURRENT_DESTINATIONS 2, which is the value the concurrency calculation later compares against."
        test_recipe:
          setup:
            - "Center SC1"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T06:00:00Z" }
              as: FacilityAdmin
            - call: "POST /sortation/sort-centers"
              payload: { code: "SC1", name: "Memphis Sort 1", automation_utilization_pct: 70, flex_pool_total: 20 }
              as: FacilityAdmin
              captures: { center_id: $.data.id }
          trigger:
            - call: "POST /sortation/sort-centers/${center_id}/sort-chutes"
              payload: { chute_number: "C1", throughput_pph: 1200 }
              as: FacilityAdmin
              captures: { chute_id: $.data.id }
          assert:
            - "HTTP 201 with data.max_concurrent_destinations == 2"
            - "data.status == ACTIVE, data.jam_hold_count == 0, data.throughput_pph == 1200, data.version == 1"

      - name: worker_create_computes_cohort_attrition_score
        claim_type: Computed Fields
        grounds:
          - calculations.attrition_risk_score
          - entities.Worker.fields.tenure_days
          - endpoints.POST_/sortation/sort-centers/{id}/workers
        distinguishing_aspect: "tenure_days and the cohort attrition score are computed at create from hire_date and the logical clock: a CORE worker hired two days ago scores exactly 0.4200 on the 0-14 day bucket with a zero class adjustment."
        test_recipe:
          setup:
            - "Logical clock 2026-08-03T06:00:00Z and center SC1"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T06:00:00Z" }
              as: FacilityAdmin
            - call: "POST /sortation/sort-centers"
              payload: { code: "SC1", name: "Memphis Sort 1", automation_utilization_pct: 70, flex_pool_total: 20 }
              as: FacilityAdmin
              captures: { center_id: $.data.id }
          trigger:
            - call: "POST /sortation/sort-centers/${center_id}/workers"
              payload: { full_name: "Core Casey", hire_class: "CORE", hire_date: "2026-08-01" }
              as: LaborPlanner
              as_user_id: "u_planner_1"
              captures: { w_id: $.data.id }
          assert:
            - "HTTP 201 with data.status == APPLIED and data.tenure_days == 2"
            - "data.attrition_risk_score == 0.4200 and data.attrition_risk_basis == COHORT_BASELINE and data.attrition_flagged == false"
            - "data.training_sessions_completed == 0, training_sessions_missed == 0, no_show_count == 0, completed_assignment_count == 0, consecutive_completed_shifts == 0"

      - name: chute_assignment_create_generates_system_fields
        claim_type: System Fields
        grounds:
          - entities.ChuteAssignment
          - endpoints.POST_/sortation/chute-assignments
          - concurrency_rules.chute-assignment-create-stale-chute
        distinguishing_aspect: "id, created_at, updated_at and version are system-assigned on the assignment while effective_window_end stays null until a supersede or a plan close writes it."
        test_recipe:
          setup:
            - "Center SC1 with chute C1 and lane L-WEST"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T06:00:00Z" }
              as: FacilityAdmin
            - call: "POST /sortation/sort-centers"
              payload: { code: "SC1", name: "Memphis Sort 1", automation_utilization_pct: 70, flex_pool_total: 20 }
              as: FacilityAdmin
              captures: { center_id: $.data.id }
            - call: "POST /sortation/sort-centers/${center_id}/sort-chutes"
              payload: { chute_number: "C1", throughput_pph: 1200 }
              as: FacilityAdmin
              captures: { chute_id: $.data.id, chute_v: $.data.version }
            - call: "POST /sortation/sort-centers/${center_id}/destination-lanes"
              payload: { lane_code: "L-WEST", region: "WEST", service_class: "GROUND", forecast_hourly_volume: 3000 }
              as: FacilityAdmin
              captures: { lane_id: $.data.id }
          trigger:
            - call: "POST /sortation/chute-assignments"
              payload: { chute_id: "${chute_id}", destination_lane_id: "${lane_id}", window_start: "2026-08-03T06:00:00Z", window_end: "2026-08-03T14:00:00Z", expected_chute_version: "${chute_v}" }
              as: SortSupervisor
              captures: { ca_id: $.data.id }
          assert:
            - "HTTP 201 with data.id a system-generated UUID, data.version == 1, data.created_at == data.updated_at == 2026-08-03T06:00:00Z"
            - "data.status == ACTIVE, data.effective_window_end == null, data.suspended_reason == null"
            - "SortChute.${chute_id}.version == 2 (the OCC parent was bumped by exactly 1)"
            - "DestinationLane.${lane_id}.assigned_capacity_pph == 1200 and lane_pressure_ratio == 0.0000"

      - name: sort_center_create_out_of_range_automation_rejected
        claim_type: Type Constraints
        grounds:
          - validations.3_ERR_INVALID_REQUEST
          - entities.SortCenter.fields.automation_utilization_pct
          - entities.InjuryReport.fields.severity
        distinguishing_aspect: "Numeric range and enum membership are both part of the priority-3 shape check: 101 percent automation and a severity outside {FIRST_AID, RECORDABLE, SERIOUS} are each rejected with ERR_INVALID_REQUEST."
        test_recipe:
          setup:
            - "Center SC1 with one worker, used only as the target of the malformed injury report"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T06:00:00Z" }
              as: FacilityAdmin
            - call: "POST /sortation/sort-centers"
              payload: { code: "SC1", name: "Memphis Sort 1", automation_utilization_pct: 70, flex_pool_total: 20 }
              as: FacilityAdmin
              captures: { center_id: $.data.id }
            - call: "POST /sortation/sort-centers/${center_id}/workers"
              payload: { full_name: "Core Casey", hire_class: "CORE", hire_date: "2026-08-01" }
              as: LaborPlanner
              as_user_id: "u_planner_1"
              captures: { w_id: $.data.id }
          trigger:
            - call: "POST /sortation/sort-centers"
              payload: { code: "SC9", name: "Bad Automation", automation_utilization_pct: 101, flex_pool_total: 5 }
              as: FacilityAdmin
            - call: "POST /sortation/injury-reports"
              payload: { sort_center_id: "${center_id}", worker_id: "${w_id}", severity: "CATASTROPHIC", body_part: "BACK", occurred_at: "2026-08-03T06:00:00Z" }
              as: SortSupervisor
          assert:
            - "the automation_utilization_pct 101 create returns HTTP 400 with data.error_id == ERR_INVALID_REQUEST and no second SortCenter exists"
            - "the severity CATASTROPHIC create returns HTTP 400 with data.error_id == ERR_INVALID_REQUEST"
            - "SortCenter.${center_id}.ops_posture stays OPEN and open_serious_injury_count stays 0 (the malformed report was never persisted)"

      - name: dock_door_create_under_unknown_center_not_found
        claim_type: Parent Relationships
        grounds:
          - validations.4_ERR_SORT_CENTER_NOT_FOUND
          - endpoints.POST_/sortation/sort-centers/{id}/dock-doors
          - entities.DockDoor.fields.sort_center_id
        distinguishing_aspect: "The nested create resolves its parent from the path before anything else, so an unknown center id yields ERR_SORT_CENTER_NOT_FOUND rather than creating an orphan door."
        test_recipe:
          setup:
            - "Empty database apart from the logical clock"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T06:00:00Z" }
              as: FacilityAdmin
          trigger:
            - call: "POST /sortation/sort-centers/00000000-0000-0000-0000-0000000000aa/dock-doors"
              payload: { door_number: "IN-1", kind: "INBOUND" }
              as: FacilityAdmin
          assert:
            - "HTTP 404 with data.error_id == ERR_SORT_CENTER_NOT_FOUND"
            - "no DockDoor row exists anywhere"

      - name: outbound_load_lane_from_other_center_rejected
        claim_type: Parent Relationships
        grounds:
          - validations.35_ERR_WORKER_CENTER_MISMATCH
          - endpoints.POST_/sortation/outbound-loads
          - complexity_profile.entity_topology
        distinguishing_aspect: "Hybrid topology cross-cutting integrity: the load's door belongs to SC1 but the destination lane belongs to SC2, and because that lane HAS a chute assignment the priority-34 referential rule passes and priority 35 is the rule that must fire."
        test_recipe:
          setup:
            - "Center SC1 with outbound door OUT-1, chute C1 and lane L-WEST assigned to C1"
            - "Center SC2 with chute C9 and lane L-FAR assigned to C9, so L-FAR is a legally mapped lane at the wrong center"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T06:00:00Z" }
              as: FacilityAdmin
            - call: "POST /sortation/sort-centers"
              payload: { code: "SC1", name: "Memphis Sort 1", automation_utilization_pct: 70, flex_pool_total: 20 }
              as: FacilityAdmin
              captures: { center1_id: $.data.id }
            - call: "POST /sortation/sort-centers"
              payload: { code: "SC2", name: "Nashville Sort 2", automation_utilization_pct: 70, flex_pool_total: 20 }
              as: FacilityAdmin
              captures: { center2_id: $.data.id }
            - call: "POST /sortation/sort-centers/${center1_id}/dock-doors"
              payload: { door_number: "OUT-1", kind: "OUTBOUND" }
              as: FacilityAdmin
              captures: { door_out_id: $.data.id }
            - call: "POST /sortation/sort-centers/${center2_id}/sort-chutes"
              payload: { chute_number: "C9", throughput_pph: 1200 }
              as: FacilityAdmin
              captures: { chute9_id: $.data.id, chute9_v: $.data.version }
            - call: "POST /sortation/sort-centers/${center2_id}/destination-lanes"
              payload: { lane_code: "L-FAR", region: "WEST", service_class: "GROUND", forecast_hourly_volume: 1000 }
              as: FacilityAdmin
              captures: { lane_far_id: $.data.id }
            - call: "POST /sortation/chute-assignments"
              payload: { chute_id: "${chute9_id}", destination_lane_id: "${lane_far_id}", window_start: "2026-08-03T06:00:00Z", window_end: "2026-08-03T14:00:00Z", expected_chute_version: "${chute9_v}" }
              as: SortSupervisor
          trigger:
            - call: "POST /sortation/outbound-loads"
              payload: { sort_center_id: "${center1_id}", door_id: "${door_out_id}", destination_lane_id: "${lane_far_id}", trailer_code: "T-OUT-1", trailer_cube_cuft: 1000, dispatch_cut_time: "2026-08-03T13:00:00Z" }
              as: SortSupervisor
          assert:
            - "HTTP 409 with data.error_id == ERR_WORKER_CENTER_MISMATCH"
            - "the error is NOT ERR_LANE_NOT_ASSIGNED_TO_CHUTE, because L-FAR does have a ChuteAssignment row"
            - "no OutboundLoad row exists: GET /sortation/outbound-loads filtered by sort_center_id == ${center1_id} returns total_count == 0"

  # ===================================================================
  # 2. State Machines
  # ===================================================================
  - section: state_machines
    instances:
      - name: trailer_appointment_starts_in_scheduled
        claim_type: Initial State
        grounds:
          - state_machines.TrailerAppointment.initial_state
          - entities.TrailerAppointment.fields.jam_count
          - endpoints.POST_/sortation/trailer-appointments
        distinguishing_aspect: "A freshly booked appointment is SCHEDULED with jam_count 0, no timestamps and unload_sequence_rank null, because ranking only covers the ARRIVED set."
        test_recipe:
          setup:
            - "Center SC1 with inbound door IN-1"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T06:00:00Z" }
              as: FacilityAdmin
            - call: "POST /sortation/sort-centers"
              payload: { code: "SC1", name: "Memphis Sort 1", automation_utilization_pct: 70, flex_pool_total: 20 }
              as: FacilityAdmin
              captures: { center_id: $.data.id }
            - call: "POST /sortation/sort-centers/${center_id}/dock-doors"
              payload: { door_number: "IN-1", kind: "INBOUND" }
              as: FacilityAdmin
              captures: { door_id: $.data.id }
          trigger:
            - call: "POST /sortation/trailer-appointments"
              payload: { sort_center_id: "${center_id}", door_id: "${door_id}", trailer_code: "T-A", window_start: "2026-08-03T06:00:00Z", window_end: "2026-08-03T07:00:00Z", priority_class: "EXPRESS", manifest_package_count: 900 }
              as: InboundCoordinator
              captures: { appt_id: $.data.id }
          assert:
            - "HTTP 201 with data.status == SCHEDULED"
            - "data.jam_count == 0, data.unload_sequence_rank == null, data.arrived_at == null, data.unloaded_at == null"
            - "SortCenter.${center_id}.wip_package_count == 0 (booking inducts nothing)"

      - name: complete_unload_from_scheduled_rejected
        claim_type: Invalid Transitions
        grounds:
          - validations.14_ERR_INVALID_APPOINTMENT_STATE
          - state_machines.TrailerAppointment.UNLOADING_to_UNLOADED
        distinguishing_aspect: "complete-unload is only declared from UNLOADING, so firing it on a SCHEDULED appointment is refused and no induction side effect runs."
        test_recipe:
          setup:
            - "Center SC1 with inbound door IN-1 and one SCHEDULED appointment T-A (manifest 900)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T06:00:00Z" }
              as: FacilityAdmin
            - call: "POST /sortation/sort-centers"
              payload: { code: "SC1", name: "Memphis Sort 1", automation_utilization_pct: 70, flex_pool_total: 20 }
              as: FacilityAdmin
              captures: { center_id: $.data.id }
            - call: "POST /sortation/sort-centers/${center_id}/dock-doors"
              payload: { door_number: "IN-1", kind: "INBOUND" }
              as: FacilityAdmin
              captures: { door_id: $.data.id }
            - call: "POST /sortation/trailer-appointments"
              payload: { sort_center_id: "${center_id}", door_id: "${door_id}", trailer_code: "T-A", window_start: "2026-08-03T06:00:00Z", window_end: "2026-08-03T07:00:00Z", priority_class: "STANDARD", manifest_package_count: 900 }
              as: InboundCoordinator
              captures: { appt_id: $.data.id }
          trigger:
            - call: "POST /sortation/trailer-appointments/${appt_id}/complete-unload"
              payload: {}
              as: InboundCoordinator
          assert:
