              as: TradeMarketingDirector
              as_user_id: "dir-1"
              captures: { brand_id: $.data.id }
            - call: "POST /trade-marketing/customers"
              payload: { program_id: "${prog_id}", name: "AlphaGrocer", channel: "GROCERY", deduction_validation_policy: "EVIDENCE_BASED" }
              as: TradeMarketingDirector
              as_user_id: "dir-1"
              captures: { cust_a_id: $.data.id }
            - call: "POST /trade-marketing/customers"
              payload: { program_id: "${prog_id}", name: "BetaMass", channel: "MASS", deduction_validation_policy: "EVIDENCE_BASED" }
              as: TradeMarketingDirector
              as_user_id: "dir-1"
