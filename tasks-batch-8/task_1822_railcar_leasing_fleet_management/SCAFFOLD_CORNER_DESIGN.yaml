# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# =============================================================================
scaffold_corner_design:
  - section: entities
    instances:
      - name: lessee_creation_applies_defaults
        claim_type: creation
        grounds: ["entities.Lessee"]
        distinguishing_aspect: "A lessee created with only the four input fields starts ACTIVE with outstanding_balance_cents 0 and version 1; computed/system inputs are not client-settable."
        test_recipe:
          setup: ["empty database; default logical clock 2026-08-01T00:00:00Z"]
          setup_api_calls: []
          trigger:
            - { call: "POST /lessees", payload: { company_name: "New Lessee", credit_tier: "TIER_B", credit_limit_cents: 500000, security_deposit_cents: 100000 }, as: LeaseAdmin, captures: { les: "$.data.id" } }
          assert:
            - "response 201; Lessee.${les}.status == ACTIVE and outstanding_balance_cents == 0"
            - "Lessee.${les}.version == 1 and created_at == 2026-08-01T00:00:00.000Z (default logical clock)"

      - name: railcar_duplicate_mark_rejected
        claim_type: type_constraints
        grounds: ["entities.Railcar.fields.car_mark", "errors[ERR_DUPLICATE_CAR_MARK]"]
        distinguishing_aspect: "car_mark uniqueness is global: the second registration of GATX1001 fails with 409 while the first persists unchanged."
        test_recipe:
          setup: ["car GATX1001 already registered"]
          setup_api_calls:
            - { call: "POST /railcars", payload: { car_mark: "GATX1001", car_type: "BOX", built_year: 2018 }, as: FleetPlanner, captures: { car: "$.data.id" } }
          trigger:
            - { call: "POST /railcars", payload: { car_mark: "GATX1001", car_type: "GONDOLA", built_year: 2020 }, as: FleetPlanner, captures: { err: "$.data.error_id" } }
          assert:
            - "second create returns 409 with error_id == ERR_DUPLICATE_CAR_MARK"
            - "Railcar.${car}.car_type remains BOX (first record untouched)"

      - name: railcar_missing_required_field_returns_validation
        claim_type: required_fields
        grounds: ["entities.Railcar.fields.car_type", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "Omitting the required input car_type is a 400 ERR_VALIDATION, not a 422 business error."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /railcars", payload: { car_mark: "GATX1002", built_year: 2018 }, as: FleetPlanner, captures: { err: "$.data.error_id" } }
          assert:
            - "response 400 with error_id == ERR_VALIDATION"

      - name: railcar_get_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_RAILCAR_NOT_FOUND]"]
        distinguishing_aspect: "A well-formed but unknown railcar UUID yields 404 ERR_RAILCAR_NOT_FOUND."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "GET /railcars/00000000-0000-0000-0000-000000000000", payload: {}, as: FleetPlanner, captures: { err: "$.data.error_id" } }
          assert:
            - "response 404 with error_id == ERR_RAILCAR_NOT_FOUND"

      - name: railcar_list_pagination_envelope
        claim_type: listing
        grounds: ["response_envelope", "entities.Railcar"]
        distinguishing_aspect: "Pagination defaults and envelope: limit=2 over 3 cars yields total_count 3, has_more true, exactly 2 items; offset=2 yields 1 item and has_more false."
        test_recipe:
          setup: ["three railcars registered"]
          setup_api_calls:
            - { call: "POST /railcars", payload: { car_mark: "GATX1101", car_type: "BOX", built_year: 2018 }, as: FleetPlanner }
            - { call: "POST /railcars", payload: { car_mark: "GATX1102", car_type: "BOX", built_year: 2019 }, as: FleetPlanner }
            - { call: "POST /railcars", payload: { car_mark: "GATX1103", car_type: "GONDOLA", built_year: 2020 }, as: FleetPlanner }
          trigger:
            - { call: "GET /railcars", payload: { limit: 2, offset: 0 }, as: FleetPlanner }
            - { call: "GET /railcars", payload: { limit: 2, offset: 2 }, as: FleetPlanner }
          assert:
            - "page 1: response_type array, total_count == 3, has_more == true, 2 items"
            - "page 2: total_count == 3, has_more == false, 1 item"

      - name: railcar_computed_age_input_ignored
        claim_type: computed_fields
        grounds: ["entities.Railcar.fields.car_age_years"]
        distinguishing_aspect: "car_age_years is computed from built_year against the logical clock year: a client-supplied value is ignored and 2026 - 2015 = 11 is returned."
        test_recipe:
          setup: ["default clock 2026-08-01"]
          setup_api_calls: []
          trigger:
            - { call: "POST /railcars", payload: { car_mark: "GATX1104", car_type: "BOX", built_year: 2015, car_age_years: 99 }, as: FleetPlanner, captures: { car: "$.data.id" } }
          assert:
            - "Railcar.${car}.car_age_years == 11 (client-supplied 99 ignored)"

      - name: lease_agreement_invalid_enum_rejected
        claim_type: type_constraints
        grounds: ["entities.LeaseAgreement.fields.lease_type", "errors[ERR_VALIDATION]"]
        distinguishing_aspect: "lease_type outside {FULL_SERVICE, NET} is rejected at shape validation with ERR_VALIDATION."
        test_recipe:
          setup: ["lessee exists"]
          setup_api_calls:
            - { call: "POST /lessees", payload: { company_name: "L", credit_tier: "TIER_A", credit_limit_cents: 1000000, security_deposit_cents: 0 }, as: LeaseAdmin, captures: { les: "$.data.id" } }
          trigger:
            - { call: "POST /lease-agreements", payload: { lessee_id: "${les}", lease_type: "TRIPLE_NET", base_daily_rate_cents: 5000, car_hire_lessor_share_pct: 100, authorized_repair_cap_cents: 1000, start_date: "2026-08-01", end_date: "2027-07-31" }, as: LeaseAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "response 400 with error_id == ERR_VALIDATION"

      - name: lease_create_with_unknown_lessee_returns_not_found
        claim_type: parent_relationships
        grounds: ["entities.LeaseAgreement.fields.lessee_id", "errors[ERR_LESSEE_NOT_FOUND]"]
        distinguishing_aspect: "FK integrity: a lease referencing a nonexistent lessee fails with 404 ERR_LESSEE_NOT_FOUND before any business rule runs."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - { call: "POST /lease-agreements", payload: { lessee_id: "00000000-0000-0000-0000-000000000000", lease_type: "NET", base_daily_rate_cents: 5000, car_hire_lessor_share_pct: 100, authorized_repair_cap_cents: 1000, start_date: "2026-08-01", end_date: "2027-07-31" }, as: LeaseAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "response 404 with error_id == ERR_LESSEE_NOT_FOUND"

  - section: state_machines
    instances:
      - name: assignment_created_in_initial_state_scheduled
        claim_type: initial_state
        grounds: ["state_machines.LeaseAssignment"]
        distinguishing_aspect: "A new assignment starts SCHEDULED with null actual dates and tariff pins snapshot from the window effective at scheduled_start."
        test_recipe:
          setup: ["tariffs 9000/55; lessee; ACTIVE lease; car GATX1201"]
          setup_api_calls:
            - { call: "POST /tariff-rates", payload: { car_type: "COVERED_HOPPER", rate_kind: "CAR_HIRE_BASE", effective_from: "2026-01-01", effective_to: "2027-01-01", unit_rate_cents: 9000 }, as: LeaseAdmin }
            - { call: "POST /tariff-rates", payload: { car_type: "COVERED_HOPPER", rate_kind: "MILEAGE_CREDIT", effective_from: "2026-01-01", effective_to: "2027-01-01", unit_rate_cents: 55 }, as: LeaseAdmin }
            - { call: "POST /lessees", payload: { company_name: "L", credit_tier: "TIER_A", credit_limit_cents: 100000000, security_deposit_cents: 0 }, as: LeaseAdmin, captures: { les: "$.data.id" } }
            - { call: "POST /railcars", payload: { car_mark: "GATX1201", car_type: "COVERED_HOPPER", built_year: 2015 }, as: FleetPlanner, captures: { car: "$.data.id" } }
            - { call: "POST /lease-agreements", payload: { lessee_id: "${les}", lease_type: "FULL_SERVICE", base_daily_rate_cents: 5000, car_hire_lessor_share_pct: 100, authorized_repair_cap_cents: 20000, start_date: "2026-08-01", end_date: "2027-07-31" }, as: LeaseAdmin, captures: { lea: "$.data.id" } }
            - { call: "POST /lease-agreements/${lea}/submit", payload: {}, as: LeaseAdmin }
            - { call: "POST /lease-agreements/${lea}/approve", payload: {}, as: ComplianceOfficer }
          trigger:
            - { call: "POST /lease-assignments", payload: { lease_id: "${lea}", railcar_id: "${car}", planned_commodity: "GRAIN", scheduled_start: "2026-09-01", scheduled_end: "2026-09-30" }, as: FleetPlanner, captures: { asg: "$.data.id" } }
          assert:
            - "LeaseAssignment.${asg}.status == SCHEDULED, actual_on_lease_date == null, actual_off_lease_date == null"
            - "pinned_car_hire_daily_cents == 9000 and pinned_mileage_credit_cents == 55"

      - name: deliver_from_returned_rejected_invalid_state
        claim_type: invalid_transition
        grounds: ["state_machines.LeaseAssignment", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "deliver is defined only from SCHEDULED; a RETURNED assignment rejects deliver with 409 ERR_INVALID_STATE and no fields change."
        test_recipe:
          setup: ["assignment delivered 2026-08-01 then returned (RETURNED)"]
          setup_api_calls:
            - { call: "POST /tariff-rates", payload: { car_type: "COVERED_HOPPER", rate_kind: "CAR_HIRE_BASE", effective_from: "2026-01-01", effective_to: "2027-01-01", unit_rate_cents: 9000 }, as: LeaseAdmin }
            - { call: "POST /tariff-rates", payload: { car_type: "COVERED_HOPPER", rate_kind: "MILEAGE_CREDIT", effective_from: "2026-01-01", effective_to: "2027-01-01", unit_rate_cents: 55 }, as: LeaseAdmin }
            - { call: "POST /lessees", payload: { company_name: "L", credit_tier: "TIER_A", credit_limit_cents: 100000000, security_deposit_cents: 0 }, as: LeaseAdmin, captures: { les: "$.data.id" } }
            - { call: "POST /railcars", payload: { car_mark: "GATX1202", car_type: "COVERED_HOPPER", built_year: 2015 }, as: FleetPlanner, captures: { car: "$.data.id" } }
            - { call: "POST /lease-agreements", payload: { lessee_id: "${les}", lease_type: "FULL_SERVICE", base_daily_rate_cents: 5000, car_hire_lessor_share_pct: 100, authorized_repair_cap_cents: 20000, start_date: "2026-08-01", end_date: "2027-07-31" }, as: LeaseAdmin, captures: { lea: "$.data.id" } }
            - { call: "POST /lease-agreements/${lea}/submit", payload: {}, as: LeaseAdmin }
            - { call: "POST /lease-agreements/${lea}/approve", payload: {}, as: ComplianceOfficer }
            - { call: "POST /lease-assignments", payload: { lease_id: "${lea}", railcar_id: "${car}", planned_commodity: "GRAIN", scheduled_start: "2026-08-01", scheduled_end: "2026-08-31" }, as: FleetPlanner, captures: { asg: "$.data.id" } }
            - { call: "POST /lease-assignments/${asg}/deliver", payload: {}, as: FleetPlanner }
            - { call: "POST /lease-assignments/${asg}/return", payload: {}, as: FleetPlanner }
          trigger:
            - { call: "POST /lease-assignments/${asg}/deliver", payload: {}, as: FleetPlanner, captures: { err: "$.data.error_id" } }
          assert:
            - "response 409 with error_id == ERR_INVALID_STATE"
            - "LeaseAssignment.${asg}.status remains RETURNED"

      - name: retired_railcar_terminal_lockdown
        claim_type: terminal_lockdown
        grounds: ["state_machines.Railcar", "state_machines.RetirementCase", "errors[ERR_RAILCAR_NOT_AVAILABLE]"]
        distinguishing_aspect: "RETIRED is terminal: after execute, no transition exists — a new assignment on the car fails and the car stays RETIRED."
        test_recipe:
          setup: ["car GATX1203 retired via full retirement flow (pool FY2026 open; approver different user than proposer)"]
          setup_api_calls:
            - { call: "POST /railcars", payload: { car_mark: "GATX1203", car_type: "BOX", built_year: 1970 }, as: FleetPlanner, captures: { car: "$.data.id" } }
            - { call: "POST /capital-pools", payload: { fiscal_year: 2026, opening_balance_cents: 5000000 }, as: SystemAdmin, captures: { pool: "$.data.id" } }
            - { call: "POST /retirement-cases", payload: { railcar_id: "${car}", reason: "AGE_LIMIT" }, as: FleetPlanner, as_user_id: "fp-1", captures: { rc: "$.data.id" } }
            - { call: "POST /retirement-cases/${rc}/appraise", payload: { salvage_value_cents: 1500000, book_value_cents: 8000000 }, as: FleetPlanner }
            - { call: "POST /retirement-cases/${rc}/approve", payload: {}, as: ComplianceOfficer, as_user_id: "co-1" }
            - { call: "POST /retirement-cases/${rc}/execute", payload: {}, as: FleetPlanner }
            - { call: "POST /tariff-rates", payload: { car_type: "BOX", rate_kind: "CAR_HIRE_BASE", effective_from: "2026-01-01", effective_to: "2027-01-01", unit_rate_cents: 9000 }, as: LeaseAdmin }
            - { call: "POST /tariff-rates", payload: { car_type: "BOX", rate_kind: "MILEAGE_CREDIT", effective_from: "2026-01-01", effective_to: "2027-01-01", unit_rate_cents: 55 }, as: LeaseAdmin }
            - { call: "POST /lessees", payload: { company_name: "L", credit_tier: "TIER_A", credit_limit_cents: 100000000, security_deposit_cents: 0 }, as: LeaseAdmin, captures: { les: "$.data.id" } }
            - { call: "POST /lease-agreements", payload: { lessee_id: "${les}", lease_type: "FULL_SERVICE", base_daily_rate_cents: 5000, car_hire_lessor_share_pct: 100, authorized_repair_cap_cents: 20000, start_date: "2026-08-01", end_date: "2027-07-31" }, as: LeaseAdmin, captures: { lea: "$.data.id" } }
            - { call: "POST /lease-agreements/${lea}/submit", payload: {}, as: LeaseAdmin }
            - { call: "POST /lease-agreements/${lea}/approve", payload: {}, as: ComplianceOfficer }
          trigger:
            - { call: "POST /lease-assignments", payload: { lease_id: "${lea}", railcar_id: "${car}", planned_commodity: "LUMBER", scheduled_start: "2026-09-01", scheduled_end: "2026-09-30" }, as: FleetPlanner, captures: { err: "$.data.error_id" } }
          assert:
            - "response 409 with error_id == ERR_RAILCAR_NOT_AVAILABLE"
            - "Railcar.${car}.status == RETIRED and retired_at != null"
            - "CapitalPool.${pool}.replenishment_cents == 1500000 (execute side effect persisted)"

      - name: lease_expires_automatically_past_end_date
        claim_type: valid_transition
        grounds: ["state_machines.LeaseAgreement.ACTIVE_to_EXPIRED"]
        distinguishing_aspect: "The ACTIVE -> EXPIRED transition is system-driven by the logical clock and evaluated lazily on read: no explicit endpoint call moves the lease."
        test_recipe:
          setup: ["lease ACTIVE 2026-08-01..2026-08-31; clock then advanced to 2026-09-01"]
          setup_api_calls:
            - { call: "POST /lessees", payload: { company_name: "L", credit_tier: "TIER_A", credit_limit_cents: 100000000, security_deposit_cents: 0 }, as: LeaseAdmin, captures: { les: "$.data.id" } }
            - { call: "POST /lease-agreements", payload: { lessee_id: "${les}", lease_type: "NET", base_daily_rate_cents: 5000, car_hire_lessor_share_pct: 100, authorized_repair_cap_cents: 20000, start_date: "2026-08-01", end_date: "2026-08-31" }, as: LeaseAdmin, captures: { lea: "$.data.id" } }
            - { call: "POST /lease-agreements/${lea}/submit", payload: {}, as: LeaseAdmin }
            - { call: "POST /lease-agreements/${lea}/approve", payload: {}, as: ComplianceOfficer }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: SystemAdmin }
            - { call: "GET /lease-agreements/${lea}", payload: {}, as: LeaseAdmin }
          assert:
            - "LeaseAgreement.${lea}.status == EXPIRED after the clock passes end_date (lazily, on read)"

      - name: retirement_cancel_compensates_railcar_status
        claim_type: side_effect_execution
        grounds: ["state_machines.RetirementCase.APPROVED_to_CANCELLED"]
        distinguishing_aspect: "Cancelling an APPROVED retirement compensates the approval side effect exactly: the railcar returns RETIREMENT_PENDING -> AVAILABLE with no residual state."
        test_recipe:
          setup: ["car GATX1204 with APPROVED retirement case (status RETIREMENT_PENDING)"]
          setup_api_calls:
            - { call: "POST /railcars", payload: { car_mark: "GATX1204", car_type: "BOX", built_year: 1974 }, as: FleetPlanner, captures: { car: "$.data.id" } }
            - { call: "POST /retirement-cases", payload: { railcar_id: "${car}", reason: "OBSOLESCENCE" }, as: FleetPlanner, as_user_id: "fp-1", captures: { rc: "$.data.id" } }
            - { call: "POST /retirement-cases/${rc}/appraise", payload: { salvage_value_cents: 900000, book_value_cents: 2000000 }, as: FleetPlanner }
            - { call: "POST /retirement-cases/${rc}/approve", payload: {}, as: ComplianceOfficer, as_user_id: "co-1" }
          trigger:
            - { call: "POST /retirement-cases/${rc}/cancel", payload: {}, as: FleetPlanner }
            - { call: "GET /railcars/${car}", payload: {}, as: FleetPlanner }
          assert:
            - "RetirementCase.${rc}.status == CANCELLED"
            - "Railcar.${car}.status == AVAILABLE (compensation restores pre-approval state)"
            - "RetirementCase.${rc}.impairment_loss_cents == 1100000 (max(0, 2000000-900000) computed at appraise)"

      - name: cleaning_fail_reclean_cycle_to_certified
        claim_type: valid_transition
        grounds: ["state_machines.CleaningRecord.COMPLETED_to_FAILED", "state_machines.CleaningRecord.FAILED_to_COMPLETED"]
        distinguishing_aspect: "FAILED is not terminal: the re-clean loop FAILED -> COMPLETED -> CERTIFIED works and the replaced cost/grade of the second completion persist."
        test_recipe:
          setup: ["cleaning record GRAIN -> COAL on car GATX1205 completed with WASH then FAILED by inspection"]
          setup_api_calls:
            - { call: "POST /railcars", payload: { car_mark: "GATX1205", car_type: "COVERED_HOPPER", built_year: 2015 }, as: FleetPlanner, captures: { car: "$.data.id" } }
            - { call: "POST /cleaning-records", payload: { railcar_id: "${car}", prior_commodity: "GRAIN", next_commodity: "COAL", planned_date: "2026-08-16" }, as: MaintenanceController, captures: { cl: "$.data.id" } }
            - { call: "POST /cleaning-records/${cl}/complete", payload: { cleaning_grade_performed: "WASH", cost_cents: 50000 }, as: MaintenanceController }
            - { call: "POST /cleaning-records/${cl}/fail", payload: { reason: "residue found" }, as: ComplianceOfficer }
          trigger:
            - { call: "POST /cleaning-records/${cl}/complete", payload: { cleaning_grade_performed: "STEAM_CLEAN", cost_cents: 90000 }, as: MaintenanceController }
            - { call: "POST /cleaning-records/${cl}/certify", payload: { certificate_ref: "CLN-1205" }, as: ComplianceOfficer }
          assert:
            - "second complete from FAILED succeeds: CleaningRecord.${cl}.cost_cents == 90000 and cleaning_grade_performed == STEAM_CLEAN"
            - "CleaningRecord.${cl}.status == CERTIFIED and certificate_ref == CLN-1205"
            - "CleaningRecord.${cl}.cleaning_grade_required == WASH (GRAIN not in steam set) and bill_to == LESSOR (attributable_to_lessee default false)"

      - name: retirement_approve_by_proposer_rejected_sod
        claim_type: precondition_enforcement
        grounds: ["state_machines.RetirementCase.APPRAISED_to_APPROVED", "errors[ERR_SOD_VIOLATION]"]
        distinguishing_aspect: "Segregation of duties is by user id, not just role: a ComplianceOfficer whose X-User-ID equals proposer_user_id cannot approve."
        test_recipe:
          setup: ["car GATX1206; retirement case proposed by user fp-9 and appraised"]
          setup_api_calls:
            - { call: "POST /railcars", payload: { car_mark: "GATX1206", car_type: "GONDOLA", built_year: 1972 }, as: FleetPlanner, captures: { car: "$.data.id" } }
            - { call: "POST /retirement-cases", payload: { railcar_id: "${car}", reason: "DAMAGE_BEYOND_REPAIR" }, as: FleetPlanner, as_user_id: "fp-9", captures: { rc: "$.data.id" } }
            - { call: "POST /retirement-cases/${rc}/appraise", payload: { salvage_value_cents: 100000, book_value_cents: 400000 }, as: FleetPlanner }
          trigger:
            - { call: "POST /retirement-cases/${rc}/approve", payload: {}, as: ComplianceOfficer, as_user_id: "fp-9", captures: { err: "$.data.error_id" } }
          assert:
            - "response 403 with error_id == ERR_SOD_VIOLATION"
            - "RetirementCase.${rc}.status remains APPRAISED"

      - name: statement_settle_amount_mismatch_rejected
        claim_type: precondition_enforcement
        grounds: ["state_machines.CarHireStatement.FINALIZED_to_SETTLED", "errors[ERR_PAYMENT_MISMATCH]"]
        distinguishing_aspect: "Settlement requires exact amount: paying 223999 against final_net_cents 224000 fails with 422 ERR_PAYMENT_MISMATCH and the statement stays FINALIZED."
        test_recipe:
          setup: ["statement FINALIZED with final_net_cents 224000 (tariffs 9000/55, 1000 loaded miles validated, August, full month)"]
          setup_api_calls:
            - { call: "POST /tariff-rates", payload: { car_type: "COVERED_HOPPER", rate_kind: "CAR_HIRE_BASE", effective_from: "2026-01-01", effective_to: "2027-01-01", unit_rate_cents: 9000 }, as: LeaseAdmin }
            - { call: "POST /tariff-rates", payload: { car_type: "COVERED_HOPPER", rate_kind: "MILEAGE_CREDIT", effective_from: "2026-01-01", effective_to: "2027-01-01", unit_rate_cents: 55 }, as: LeaseAdmin }
            - { call: "POST /lessees", payload: { company_name: "L", credit_tier: "TIER_A", credit_limit_cents: 10000000, security_deposit_cents: 0 }, as: LeaseAdmin, captures: { les: "$.data.id" } }
            - { call: "POST /railcars", payload: { car_mark: "GATX1207", car_type: "COVERED_HOPPER", built_year: 2015 }, as: FleetPlanner, captures: { car: "$.data.id" } }
            - { call: "POST /lease-agreements", payload: { lessee_id: "${les}", lease_type: "FULL_SERVICE", base_daily_rate_cents: 5000, car_hire_lessor_share_pct: 100, authorized_repair_cap_cents: 20000, start_date: "2026-08-01", end_date: "2027-07-31" }, as: LeaseAdmin, captures: { lea: "$.data.id" } }
            - { call: "POST /lease-agreements/${lea}/submit", payload: {}, as: LeaseAdmin }
            - { call: "POST /lease-agreements/${lea}/approve", payload: {}, as: ComplianceOfficer }
            - { call: "POST /lease-assignments", payload: { lease_id: "${lea}", railcar_id: "${car}", planned_commodity: "GRAIN", scheduled_start: "2026-08-01", scheduled_end: "2026-12-31" }, as: FleetPlanner, captures: { asg: "$.data.id" } }
            - { call: "POST /lease-assignments/${asg}/deliver", payload: {}, as: FleetPlanner }
            - { call: "POST /mileage-reports", payload: { railcar_id: "${car}", lease_assignment_id: "${asg}", report_month: "2026-08", loaded_miles: 1000, empty_miles: 200 }, as: LesseeRep, as_user_id: "${les}", captures: { rep: "$.data.id" } }
            - { call: "POST /mileage-reports/${rep}/validate", payload: {}, as: BillingAnalyst }
            - { call: "POST /car-hire-statements/generate", payload: { statement_month: "2026-08" }, as: BillingAnalyst, captures: { stmt: "$.data[0].id" } }
            - { call: "POST /car-hire-statements/${stmt}/finalize", payload: {}, as: BillingAnalyst }
          trigger:
            - { call: "POST /car-hire-statements/${stmt}/settle", payload: { amount_cents: 223999 }, as: BillingAnalyst, captures: { err: "$.data.error_id" } }
          assert:
            - "response 422 with error_id == ERR_PAYMENT_MISMATCH"
            - "CarHireStatement.${stmt}.status remains FINALIZED and lessee balance stays 224000"

      - name: repair_complete_second_shop_repair_keeps_car_in_shop
        claim_type: side_effect_execution
        grounds: ["state_machines.RepairAuthorization.IN_PROGRESS_to_COMPLETED", "entities.Railcar.fields.open_shop_repair_count"]
        distinguishing_aspect: "Conditional cascade: completing one of two open shop repairs decrements open_shop_repair_count to 1 and the car stays IN_SHOP; only the completion that reaches 0 restores status_before_shop."
        test_recipe:
          setup: ["car GATX1208 AVAILABLE with two APPROVED requires_shop repairs, both started (count 2)"]
          setup_api_calls:
            - { call: "POST /railcars", payload: { car_mark: "GATX1208", car_type: "BOX", built_year: 2018 }, as: FleetPlanner, captures: { car: "$.data.id" } }
            - { call: "POST /repair-authorizations", payload: { railcar_id: "${car}", defect_description: "door", defect_cause: "PRE_EXISTING", estimate_cents: 50000, requires_shop: true }, as: MaintenanceController, captures: { r1: "$.data.id" } }
            - { call: "POST /repair-authorizations/${r1}/approve", payload: { approved_amount_cents: 50000 }, as: MaintenanceController }
            - { call: "POST /repair-authorizations/${r1}/start-work", payload: {}, as: MaintenanceController }
            - { call: "POST /repair-authorizations", payload: { railcar_id: "${car}", defect_description: "floor", defect_cause: "PRE_EXISTING", estimate_cents: 60000, requires_shop: true }, as: MaintenanceController, captures: { r2: "$.data.id" } }
            - { call: "POST /repair-authorizations/${r2}/approve", payload: { approved_amount_cents: 60000 }, as: MaintenanceController }
            - { call: "POST /repair-authorizations/${r2}/start-work", payload: {}, as: MaintenanceController }
          trigger:
            - { call: "POST /repair-authorizations/${r1}/complete", payload: { final_cost_cents: 50000 }, as: MaintenanceController }
            - { call: "GET /railcars/${car}", payload: {}, as: FleetPlanner, captures: { st1: "$.data.status" } }
            - { call: "POST /repair-authorizations/${r2}/complete", payload: { final_cost_cents: 60000 }, as: MaintenanceController }
            - { call: "GET /railcars/${car}", payload: {}, as: FleetPlanner }
          assert:
            - "after first complete: Railcar.${car}.status == IN_SHOP and open_shop_repair_count == 1"
            - "after second complete: status == AVAILABLE, open_shop_repair_count == 0, status_before_shop == null"

