            - "ShiftPlan 2026-08-03 06:00-14:00, forecast_volume 4000, planned_core_headcount 30, planned_seasonal_headcount 0, labor_budget_cents 1000, submitted by u_planner_1 so required_headcount == 4 and flex_needed == 0"
