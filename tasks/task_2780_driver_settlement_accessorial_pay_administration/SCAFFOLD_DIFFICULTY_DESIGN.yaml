        grounds:
          - calculations.accessorial_pay
          - validations[priority=46]
          - entities.AccessorialClaim.fields.billable_units
          - state_machines.AccessorialClaim.SUBMITTED_to_APPROVED
        distinguishing_aspect: |
          A QUANTITY-threshold boundary in the accessorial calculation: 120 minutes of detention is
          exactly the free allowance and yields 0 billable units, 134 minutes yields 14 billable
          minutes which truncates to 0 increments, and 135 minutes yields exactly 1 increment worth
          500 cents - so the first payable minute is the 135th, not the 121st.
        test_recipe:
          setup:
            - "logical clock at 2026-08-01T00:00:00Z"
            - "package PKG_M: LEASED_OPERATOR, PRACTICAL, per_diem_method NONE, escrow_required false, PER_MILE 58 and REVENUE_PERCENT 2500 bps"
