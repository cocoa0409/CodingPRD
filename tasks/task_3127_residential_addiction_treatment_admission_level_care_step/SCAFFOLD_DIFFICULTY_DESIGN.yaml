  - name: episode_clinical_status_reassessment_cycle
    grounds:
    - state_machines.TreatmentEpisode.clinical_status
    - state_machines.TreatmentEpisode.clinical_status.AWAITING_AUTHORIZATION_to_AWAITING_ASSESSMENT
    - state_machines.TreatmentEpisode.clinical_status.AWAITING_AUTHORIZATION_to_AWAITING_AUTHORIZATION
    - entities.ClinicalAssessment.fields.status
    distinguishing_aspect: 'The episode''s clinical_status dimension is CYCLIC and NOT a forward pipeline:
      AWAITING_ASSESSMENT → UNDER_ASSESSMENT → AWAITING_AUTHORIZATION → AWAITING_ASSESSMENT is a full
      round trip, and the cycle re-opens authorization because a replacement request is refused while
      the prior authorization is still APPROVED (ERR_AUTHORIZATION_NOT_REOPENABLE), so the second pass
      reaches AWAITING_ADMISSION only after the first approval is cancelled away.'
