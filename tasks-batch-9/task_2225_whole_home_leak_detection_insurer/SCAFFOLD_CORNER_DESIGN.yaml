            - call: "POST /devices/${d1}/telemetry"
              payload: { reading_at: "2026-08-01T00:00:00Z", static_pressure_psi: 60.0, flow_gpm: 0.0, duration_minutes: 0, total_gallons: 0.0 }
              as: DeviceGateway
              as_user_id: "gw-01"
            - call: "POST /devices/${d1}/telemetry"
              payload: { reading_at: "2026-08-01T00:20:00Z", static_pressure_psi: 62.0, flow_gpm: 6.0, duration_minutes: 4, total_gallons: 24.0 }
              as: DeviceGateway
              as_user_id: "gw-01"
            - call: "POST /devices/${d1}/telemetry"
              payload: { reading_at: "2026-08-01T00:40:00Z", static_pressure_psi: 58.0, flow_gpm: 0.0, duration_minutes: 0, total_gallons: 0.0 }
              as: DeviceGateway
              as_user_id: "gw-01"
          trigger:
            - call: "POST /devices/${d1}/telemetry"
              payload: { reading_at: "2026-08-01T06:10:00Z", static_pressure_psi: 30.0, flow_gpm: 9.0, duration_minutes: 3, total_gallons: 29.99 }
              as: DeviceGateway
              as_user_id: "gw-01"
            - call: "POST /devices/${d1}/telemetry"
              payload: { reading_at: "2026-08-01T06:20:00Z", static_pressure_psi: 30.0, flow_gpm: 9.0, duration_minutes: 3, total_gallons: 30.0 }
              as: DeviceGateway
              as_user_id: "gw-01"
          assert:
            - "The 06:10:00Z reading is BELOW the cumulative gate by one hundredth of a gallon: classification_at_ingest == NONE, anomaly_event_created == false, baseline_eligible == true (NONE verdict, reading_source DEVICE, not irrigation-suppressed) and no AnomalyEvent exists yet (GET /anomaly-events with device_id ${d1} returns total_count == 0); the already-COMPLETE profile is untouched, baseline_version still 3"
            - "It does not fall through to RUNNING_FIXTURE (duration 3 < RUNNING_MIN_DURATION_MINUTES 20) nor to DRIP (duration 3 < DRIP_MIN_DURATION_MINUTES 60) even though flow 9.0 clears both flow gates"
            - "The 06:20:00Z reading AT the gate mints exactly one AnomalyEvent with classification == CATASTROPHIC_BURST, event_state == ALERTED, observed_gallons == 30.0 and baseline_version_used == 3"
            - "severity_score == 0.500: flow_component 9.0 / round(9.00 * 2.0, 4) == 0.5, duration_component 3 / 6.0 == 0.5, gallon_component 30.0 / 60.0 == 0.5, weighted 0.5*0.5 + 0.5*0.3 + 0.5*0.2 and rounded once to three places"
            - "auto_shutoff ran on the second reading only: Device.${d1}.valve_state == CLOSED, close_count == 1, auto_shutoff_executed == true and shutoff_latency_minutes == 0"
            - "GET /devices/${d1}/telemetry returns total_count == 5 with $.data[3].classification_at_ingest == NONE and $.data[4].classification_at_ingest == CATASTROPHIC_BURST — the verdicts are frozen per reading"

      - name: cascading_side_effects_multi_level_chain
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile.complexity_layers
          - endpoints[POST /devices/{id}/telemetry].side_effects
        distinguishing_aspect: "Covered by the transitive_cascade depth instances, which verify the burst ingest chain and the transfer-accept chain end to end."
        excluded_because:
          difficulty_instance: transitive_cascade / telemetry_burst_three_hop_cascade
          rationale: "That instance walks one ingest through classification, event creation, severity, auto-shutoff, ticket creation and irrigation suspension in order, and transfer_accept_five_hop_cascade covers the five-hop ownership chain; a breadth-level cascade check adds no new observation."

      - name: dual_variant_calculation_divergence_and_switch
        claim_type: dual_variant_calculation
        grounds:
          - complexity_profile.complexity_layers
          - calculations.premium_credit_award.variants
          - calculations.claim_payout_award.variants
        distinguishing_aspect: "Covered by the dual_variant_calc depth instances for the premium credit and the claim payout."
        excluded_because:
          difficulty_instance: dual_variant_calc / credit_provisional_vs_annual_true_up
          rationale: "The credit instance drives both variants on identical uptime data and reconciles the true-up delta into the ledger, and claim_mitigated_vs_unmitigated_payout does the same for the payout waterfall, so both rows of the dual-variant table are already exercised."

  - section: consistency_model
    instances:
      - name: immediate_burst_ingest_response_already_carries_every_derived_change
        claim_type: immediate
        grounds:
          - complexity_profile.consistency_model
          - endpoints[POST /devices/{id}/telemetry].side_effects
          - endpoints[GET /devices/{id}/health-summary].output
          - calculations.uptime_coverage_pct
        distinguishing_aspect: "consistency_model is immediate: the 201 body of the burst ingest and every read issued straight afterwards in the same logical instant already show the whole fan-out (frozen classification, AnomalyEvent, EscalationTicket, closed valve, suspended irrigation window and the recomputed health summary) with no intervening sweep, retry or delay."
        test_recipe:
          setup:
            - "Homeowner ${h1} owns Property ${p1} (irrigation_present true); Device ${d1} on that property was install-verified at 62.0 psi by InstallerTech user tech-01."
            - "Three DEVICE readings at 2026-08-01T00:00Z / 00:20Z / 00:40Z closed learning cycle 1: BaselineProfile learning_state COMPLETE, baseline_static_pressure_psi 60.0, baseline_peak_flow_gpm 6.00, drip_threshold_gpm 0.12, baseline_version 3."
            - "Device ${d1} is ARMED with valve_state OPEN and monitor_mode NORMAL; the logical clock stands at 2026-08-01T06:05:00Z."
            - "Property ${p1} has an ACTIVE IrrigationWindow ${iw1} over [2026-08-01T05:00:00Z, 2026-08-01T09:00:00Z) with expected_max_flow_gpm 4.0, so a 12.0 gpm reading is well outside it and is not suppressed."
            - "No AnomalyEvent and no EscalationTicket exist for Device ${d1} before the trigger."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T06:05:00Z" }
              as: ProgramAdmin
            - call: "POST /homeowners"
              payload: { full_name: "Ada Reyes", email: "ada@example.com", phone_e164: "+14155550101" }
              as: ProgramAdmin
              captures: { h1: $.data.id }
            - call: "POST /properties"
              payload: { homeowner_id: "${h1}", address_line1: "14 Cedar Ln", city: "Somerville", state_code: "MA", postal_code: "02143", year_built: 1968, irrigation_present: true }
              as: Homeowner
              as_user_id: "${h1}"
              captures: { p1: $.data.id }
            - call: "POST /devices"
              payload: { property_id: "${p1}", serial_number: "FLO-000001", model_code: "FLO_SMART_3_4" }
              as: InstallerTech
              as_user_id: "tech-01"
              captures: { d1: $.data.id }
            - call: "POST /devices/${d1}/verify-install"
              payload: { installed_static_pressure_psi: 62.0, pressure_drop_psi: 0.8 }
              as: InstallerTech
              as_user_id: "tech-01"
            - call: "POST /devices/${d1}/telemetry"
              payload: { reading_at: "2026-08-01T00:00:00Z", static_pressure_psi: 60.0, flow_gpm: 0.0, duration_minutes: 0, total_gallons: 0.0 }
              as: DeviceGateway
              as_user_id: "gw-01"
            - call: "POST /devices/${d1}/telemetry"
              payload: { reading_at: "2026-08-01T00:20:00Z", static_pressure_psi: 62.0, flow_gpm: 6.0, duration_minutes: 4, total_gallons: 24.0 }
              as: DeviceGateway
              as_user_id: "gw-01"
            - call: "POST /devices/${d1}/telemetry"
              payload: { reading_at: "2026-08-01T00:40:00Z", static_pressure_psi: 58.0, flow_gpm: 0.0, duration_minutes: 0, total_gallons: 0.0 }
              as: DeviceGateway
              as_user_id: "gw-01"
            - call: "POST /properties/${p1}/irrigation-windows"
              payload: { start_at: "2026-08-01T05:00:00Z", end_at: "2026-08-01T09:00:00Z", expected_max_flow_gpm: 4.0, label: "front lawn" }
              as: Homeowner
              as_user_id: "${h1}"
              captures: { iw1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T07:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /devices/${d1}/telemetry"
              payload: { reading_at: "2026-08-01T07:00:00Z", static_pressure_psi: 30.0, flow_gpm: 12.0, duration_minutes: 6, total_gallons: 72.0 }
              as: DeviceGateway
              as_user_id: "gw-01"
          assert:
            - "The 201 ingest body itself already carries the frozen verdict: classification_at_ingest == CATASTROPHIC_BURST, anomaly_event_created == true, suppressed_by_irrigation == false and coverage_minutes == 120"
            - "GET /anomaly-events with device_id ${d1} immediately afterwards returns total_count == 1 with event_state == ALERTED, detected_at == 2026-08-01T07:00:00Z, auto_shutoff_executed == true and shutoff_latency_minutes == 0"
            - "GET /escalation-tickets with anomaly_event_id set to that event returns total_count == 1 with stage == PENDING_HOMEOWNER, homeowner_deadline_at == 2026-08-01T07:15:00Z, notification_attempt_count == 1 and notified_contact_id == null"
            - "GET /devices/${d1} returns valve_state == CLOSED, close_count == 1 and last_shutoff_at == 2026-08-01T07:00:00Z in the same instant — no ops sweep was called"
            - "GET /properties/${p1}/irrigation-windows returns $.data[0].status == SUSPENDED_BY_SHUTOFF with suspended_at == 2026-08-01T07:00:00Z"
            - "GET /devices/${d1}/health-summary recomputes on read and already counts the 07:00:00Z sample, so no field lags behind the write that produced it"
