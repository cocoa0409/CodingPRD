  - section: cross_cutting_complexity_layers
    instances:
      - name: policy_update_stale_version_returns_412
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[property-policy-stale-version]
          - errors[ERR_STALE_PROPERTY_VERSION]
        distinguishing_aspect: "After a locker creation bumps Property.version, a policy PATCH carrying the pre-bump expected_property_version is rejected with ERR_STALE_PROPERTY_VERSION (412)."
        test_recipe:
          setup: ["Property created (version captured), then a locker created which bumps Property.version."]
          setup_api_calls:
            - call: "POST /parcelroom/properties"
              payload: { name: "OCC Court" }
              as: PropertyManager
              captures: { prop_id: $.data.id, prop_v0: $.data.version }
            - call: "POST /parcelroom/locker-banks"
              payload: { property_id: "${prop_id}", label: "A", storage_class: "AMBIENT" }
              as: PropertyManager
              captures: { bank_id: $.data.id }
            - call: "POST /parcelroom/lockers"
              payload: { locker_bank_id: "${bank_id}", size_class: "MEDIUM", storage_class: "AMBIENT" }
              as: PropertyManager
          trigger:
            - call: "PATCH /parcelroom/properties/${prop_id}/policy"
              payload: { expected_property_version: "${prop_v0}", holding_fee_daily_cents: 200 }
              as: PropertyManager
          assert:
            - "response error_id == ERR_STALE_PROPERTY_VERSION"
            - "http_status == 412"

      - name: policy_update_fresh_version_succeeds_and_bumps
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[property-policy-stale-version]
          - entities.Property.fields.version
        distinguishing_aspect: "A policy PATCH carrying the current Property.version succeeds, applies the field, and increments version by 1."
        test_recipe:
          setup: ["Property created; current version read back."]
          setup_api_calls:
            - call: "POST /parcelroom/properties"
              payload: { name: "OCC2 Court" }
              as: PropertyManager
              captures: { prop_id: $.data.id }
            - call: "GET /parcelroom/properties/${prop_id}"
              payload: {}
              as: PropertyManager
              captures: { prop_v: $.data.version }
          trigger:
            - call: "PATCH /parcelroom/properties/${prop_id}/policy"
              payload: { expected_property_version: "${prop_v}", holding_fee_daily_cents: 200 }
              as: PropertyManager
              captures: { new_v: $.data.version }
          assert:
            - "Property.${prop_id}.holding_fee_daily_cents == 200"
            - "Property.${prop_id}.version == ${prop_v} + 1"

