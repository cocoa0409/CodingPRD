            - call: "POST /demurrage/placement-cycles/${cyc_id}/release"
              payload: { released_at: "2026-08-10T16:00:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "GET /demurrage/charges?placement_cycle_id=${cyc_id}&status=FINAL&limit=10&offset=0"
              payload: {}
              as: BillingAdmin
              captures: { final_id: "$.data[0].id" }
            - call: "GET /demurrage/charges/${prov_id}"
              payload: {}
              as: BillingAdmin
          assert:
            - "the PROVISIONAL-filtered list before release returned total_count 1"
            - "after release the PROVISIONAL filter would return total_count 0 and the FINAL filter returns total_count 1 with the SAME charge id"
            - "the single read returns 200 with charge_kind DEMURRAGE, computation_basis ACTUAL, chargeable_days 3, billable_days 3, gross_amount_cents 47550, credit_applied_cents 0 and net_amount_cents 47550"
            - "there is no POST, PATCH or DELETE on /demurrage/charges: the row is only ever written by the cycle cascade"

      - name: void_on_an_ordered_cycle_has_no_charge_to_reverse
        claim_type: conditional_action
        grounds:
          - endpoints.POST_/demurrage/placement-cycles/{id}/void
          - state_machines.PlacementCycle.ORDERED_to_VOIDED
        distinguishing_aspect: |
          The same void endpoint does materially different work depending on
          where the cycle stands: from ORDERED there is no DemurrageCharge in
          existence yet, so the response is a plain VOIDED cycle with nothing to
          reverse, while from RELEASED it must void a FINAL charge and unwind
          the aggregates. This is the branch with no money in it.
        test_recipe:
          setup:
            - "one ORDERED cycle that was never constructively placed"
          setup_api_calls:
            - call: "POST /demurrage/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: BillingAdmin
            - call: "POST /demurrage/customers"
              payload: { customer_code: "C9P6-CUST", name: "Conditional Celestite", serving_station_code: "STN95" }
              as: BillingAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /demurrage/facilities"
              payload: { facility_code: "C9P6-TRK", kind: "INDUSTRY_TRACK", gate_close_hour: 16, car_spot_capacity: 3, switch_buffer_minutes: 0 }
              as: BillingAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /demurrage/tariff-rule-sets"
              payload: { tariff_code: "C9P6-6004", car_ownership_scope: "ANY" }
              as: RegulatoryOfficer
              captures: { tar_id: $.data.id }
            - call: "POST /demurrage/tariff-rule-sets/${tar_id}/publish"
              payload: {}
              as: RegulatoryOfficer
            - call: "POST /demurrage/rail-cars"
              payload: { car_mark: "C9P6-CEX01", ownership: "RAILROAD_OWNED" }
              as: RailroadAgent
              captures: { car_id: $.data.id, car_v: $.data.version }
            - call: "POST /demurrage/placement-cycles"
              payload: { customer_id: "${cust_id}", rail_car_id: "${car_id}", facility_id: "${fac_id}", tariff_rule_set_id: "${tar_id}", waybill_number: "WB-C9P6-A", expected_rail_car_version: "${car_v}" }
              as: RailroadAgent
              captures: { cyc_id: $.data.id }
          trigger:
            - call: "POST /demurrage/placement-cycles/${cyc_id}/void"
              payload: { void_reason: "Waybill cancelled before the car moved." }
              as: BillingAdmin
            - call: "GET /demurrage/charges?placement_cycle_id=${cyc_id}&limit=10&offset=0"
              payload: {}
              as: BillingAdmin
          assert:
            - "200 with movement_status VOIDED, billing_status UNBILLED and void_reason stored"
            - "the charges list returns total_count 0 and an empty data array: no charge was ever created, so none was voided"
            - "Facility.occupied_spot_count is still 0 and the rail car's occupation interval is released, so a new cycle for the same car is immediately creatable"

  # ==========================================================================
  # §1.6 Error Catalog — every one of the 58 codes must be reachable
  # --------------------------------------------------------------------------
  # Coverage ledger (code -> the instance that triggers it):
  #   ERR_UNAUTHENTICATED              -> rbac / missing_role_header_on_a_public_looking_read
  #                                       and rbac / missing_user_id_header_on_a_customer_action
  #   ERR_ROLE_FORBIDDEN               -> rbac / billing_admin_cannot_decide_a_dispute
  #   ERR_NOT_RESOURCE_OWNER           -> rbac / customer_cannot_release_another_customers_car
  #   ERR_SEGREGATION_OF_DUTIES        -> rbac / first_level_adjudicator_cannot_take_the_appeal
  #   ERR_CUSTOMER_NOT_FOUND           -> entities / get_customer_unknown_id_returns_customer_not_found
  #   ERR_TARIFF_RULE_SET_NOT_FOUND    -> entities / publish_unknown_tariff_rule_set_...
  #   ERR_FACILITY_NOT_FOUND           -> entities / placement_cycle_create_with_unknown_facility_id_...
  #   ERR_RAIL_CAR_NOT_FOUND           -> entities / placement_cycle_create_with_unknown_rail_car_id_...
  #   ERR_PLACEMENT_CYCLE_NOT_FOUND    -> entities / notify_unknown_placement_cycle_...
  #   ERR_DEMURRAGE_CHARGE_NOT_FOUND   -> entities / get_charge_unknown_id_...
  #   ERR_INVOICE_NOT_FOUND            -> entities / dispute_create_with_unknown_invoice_id_...
  #   ERR_BUNCHING_CLAIM_NOT_FOUND     -> entities / analyze_unknown_bunching_claim_...
  #   ERR_DEMURRAGE_DISPUTE_NOT_FOUND  -> entities / evidence_on_unknown_dispute_...
  #   ERR_AVERAGE_AGREEMENT_NOT_FOUND  -> entities / reconcile_unknown_average_agreement_...
  #   ERR_REGULATORY_COMPLAINT_NOT_FOUND -> entities / answer_unknown_regulatory_complaint_...
  #   ERR_INVALID_REQUEST              -> entities / customer_create_missing_serving_station_code_...
  #                                       (plus the enum, multiple-of-24 and ratio instances)
  #   ERR_INVALID_PAGINATION           -> entities / placement_cycles_list_with_limit_zero_...
  #   ERR_INVALID_MOVEMENT_STATE       -> state_machines / actual_placement_from_ordered_...
  #                                       and state_machines / void_on_a_voided_cycle_is_rejected
  #   ERR_INVOICE_NOT_DISPUTABLE       -> §1.8 rule 5 / closed_invoice_state_409_outranks_expired_dispute_window_422
  #   ERR_INVOICE_INVALID_STATE        -> state_machines / close_an_invoice_while_a_charge_is_disputed_...
  #   ERR_DISPUTE_INVALID_STATE        -> errors / begin_review_on_a_draft_dispute_...
  #   ERR_CHARGE_INVALID_STATE         -> state_machines / second_dispute_submit_on_an_already_disputed_charge_...
  #   ERR_CLAIM_INVALID_STATE          -> state_machines / analyze_twice_on_a_bunching_claim_...
  #   ERR_AGREEMENT_INVALID_STATE      -> state_machines / reconcile_twice_on_an_average_agreement_...
  #   ERR_COMPLAINT_INVALID_STATE      -> state_machines / decide_a_regulatory_complaint_before_the_railroad_answers_...
  #   ERR_TARIFF_INVALID_STATE         -> state_machines / publish_twice_on_the_same_tariff_rule_set_...
  #   ERR_INVOICE_VERSION_STALE        -> complexity_layers / stale_invoice_version_on_dispute_create
  #   ERR_RAIL_CAR_VERSION_STALE       -> complexity_layers / stale_rail_car_version_on_cycle_create
  #   ERR_FACILITY_EMBARGOED           -> §1.8 rule 5 / facility_embargo_409_outranks_customer_credit_hold_402
  #   ERR_FACILITY_NOT_OPEN            -> §1.8 rule 7 / actual_placement_blocked_by_facility_access_mode_not_by_cycle_state
  #   ERR_TARIFF_WITHDRAWN             -> validations / new_cycle_on_a_tariff_withdrawn_by_the_regulator
  #   ERR_TARIFF_NOT_PUBLISHED         -> §1.8 rule 7 / placement_cycle_create_gated_by_tariff_rule_set_publication
  #   ERR_TARIFF_SCOPE_MISMATCH        -> validations / private_car_placed_under_a_railroad_only_tariff
  #   ERR_DISPUTE_SCOPE_MISMATCH       -> validations / whole_invoice_dispute_that_also_names_a_single_charge
  #   ERR_CHARGE_INVOICE_MISMATCH      -> validations / single_charge_dispute_pointing_at_another_invoices_charge
  #   ERR_SUPERSEDE_TARGET_INVALID     -> validations / supersedes_a_dispute_that_was_never_decided
  #   ERR_CAR_CYCLE_OVERLAP            -> §1.8 rule 8 / rail_car_occupation_interval_is_half_open_at_released_at
  #   ERR_FACILITY_SPOT_UNAVAILABLE    -> §1.8 rule 8 / facility_spot_capacity_and_switch_buffer_are_separate_overlap_gates
  #   ERR_FACILITY_SWITCH_BUFFER       -> §1.8 rule 8 / facility_spot_capacity_and_switch_buffer_are_separate_overlap_gates
  #   ERR_REFUSAL_LIMIT                -> state_machines / third_refusal_on_one_cycle_...
  #   ERR_INFO_REQUEST_LIMIT           -> state_machines / third_information_request_...
  #   ERR_APPEAL_LIMIT                 -> state_machines / second_appeal_after_the_appeal_round_...
  #   ERR_DISPUTE_WINDOW_CLOSED        -> validations / dispute_submit_after_deadline_on_issued_invoice
  #   ERR_NON_CHRONOLOGICAL_EVENT      -> validations / actual_placement_dated_before_the_constructive_placement
  #   ERR_INVALID_CLUSTER_WINDOW       -> validations / inverted_cluster_window_is_rejected_at_create
  #   ERR_CLUSTER_WINDOW_OVERLAP       -> validations / second_cluster_window_sharing_one_date_with_a_granted_claim
  #   ERR_DUPLICATE_AGREEMENT_MONTH    -> validations / second_open_average_agreement_for_the_same_month
  #   ERR_CUSTOMER_CREDIT_HOLD         -> validations / release_a_car_for_a_customer_on_credit_hold
  #   ERR_INVOICE_NO_CHARGES           -> validations / issue_an_invoice_with_no_attached_charges
  #   ERR_DISPUTE_NO_EVIDENCE          -> validations / submit_a_dispute_with_no_evidence_at_all
  #   ERR_CLAIM_EXCEEDS_CHARGE         -> validations / single_charge_claim_one_cent_above_the_charge_gross
  #   ERR_ALLOWANCE_PCT_MISMATCH       -> validations / allowed_decision_carrying_a_fractional_allowance_pct
  #   ERR_BUNCHING_CLAIM_NOT_GRANTED   -> validations / bunching_dispute_submitted_on_a_denied_claim
  #   ERR_APPEAL_NOT_EXHAUSTED         -> §1.8 rule 7 / regulatory_complaint_requires_a_twice_decided_dispute
  #   ERR_ORDERED_CREDIT_EXCEEDS_CLAIM -> validations / regulatory_decision_ordering_more_credit_than_was_claimed
  #   ERR_CLAIM_NO_DELIVERIES          -> validations / analyze_a_cluster_window_that_caught_no_deliveries
  #   ERR_NO_PENDING_NOTIFICATION      -> validations / acknowledge_when_the_only_notice_failed_on_the_wrong_channel
  #   ERR_NOTIFICATION_NOT_SENT        -> validations / release_before_any_notice_reached_the_customer
  # ==========================================================================
  - section: errors
    instances:
      - name: begin_review_on_a_draft_dispute_returns_dispute_invalid_state
        claim_type: triggerable
        grounds:
          - errors.ERR_DISPUTE_INVALID_STATE
          - state_machines.DemurrageDispute.SUBMITTED_to_UNDER_REVIEW
        distinguishing_aspect: |
          This is the only code in the 409 family that belongs to the dispute
          itself rather than to the invoice or the charge, and the cleanest way
          to reach it is to review a dispute that was never submitted. The
          adjudicator is a legitimate role, so the 403 band does not fire.
        test_recipe:
          setup:
            - "Cycle A released, invoiced and issued, with a DRAFT dispute carrying one evidence row"
          setup_api_calls:
            - call: "POST /demurrage/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: BillingAdmin
            - call: "POST /demurrage/customers"
              payload: { customer_code: "C9X1-CUST", name: "Premature Pyrite", serving_station_code: "STN96", notification_method: "EDI" }
              as: BillingAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /demurrage/facilities"
              payload: { facility_code: "C9X1-TRK", kind: "INDUSTRY_TRACK", gate_close_hour: 16, car_spot_capacity: 3, switch_buffer_minutes: 0 }
              as: BillingAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /demurrage/tariff-rule-sets"
              payload: { tariff_code: "C9X1-6004", car_ownership_scope: "ANY" }
              as: RegulatoryOfficer
              captures: { tar_id: $.data.id }
            - call: "POST /demurrage/tariff-rule-sets/${tar_id}/publish"
              payload: {}
              as: RegulatoryOfficer
            - call: "POST /demurrage/rail-cars"
              payload: { car_mark: "C9X1-PYX01", ownership: "RAILROAD_OWNED" }
              as: RailroadAgent
              captures: { car_id: $.data.id, car_v: $.data.version }
            - call: "POST /demurrage/placement-cycles"
              payload: { customer_id: "${cust_id}", rail_car_id: "${car_id}", facility_id: "${fac_id}", tariff_rule_set_id: "${tar_id}", waybill_number: "WB-C9X1-A", expected_rail_car_version: "${car_v}" }
              as: RailroadAgent
              captures: { cyc_id: $.data.id }
            - call: "POST /demurrage/placement-cycles/${cyc_id}/constructive-placement"
              payload: { constructive_placement_at: "2026-08-03T08:00:00Z", reason_code: "TRACK_FULL" }
              as: RailroadAgent
            - call: "POST /demurrage/placement-cycles/${cyc_id}/notify"
              payload: { channel: "EDI", sent_at: "2026-08-03T09:00:00Z" }
              as: RailroadAgent
            - call: "POST /demurrage/placement-cycles/${cyc_id}/actual-placement"
              payload: { actual_placement_at: "2026-08-05T10:00:00Z" }
              as: RailroadAgent
            - call: "POST /demurrage/placement-cycles/${cyc_id}/release"
              payload: { released_at: "2026-08-10T16:00:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
            - call: "POST /demurrage/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:00Z" }
              as: BillingAdmin
            - call: "POST /demurrage/invoices"
              payload: { customer_id: "${cust_id}", billing_period_start: "2026-08-01", billing_period_end: "2026-08-31" }
              as: BillingAdmin
              captures: { inv_id: $.data.id }
            - call: "POST /demurrage/invoices/${inv_id}/issue"
              payload: {}
              as: BillingAdmin
              captures: { inv_v: $.data.version }
            - call: "POST /demurrage/disputes"
              payload: { invoice_id: "${inv_id}", scope: "WHOLE_INVOICE", grounds: "NOTIFICATION_FAILURE", narrative: "The notice never arrived.", claimed_credit_cents: 8000, expected_invoice_version: "${inv_v}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { dsp_id: $.data.id }
            - call: "POST /demurrage/disputes/${dsp_id}/evidence"
              payload: { evidence_type: "EMAIL_NOTICE", observed_at: "2026-08-06T00:00:00Z", description: "Mailbox with no notice." }
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /demurrage/disputes/${dsp_id}/begin-review"
              payload: {}
              as: DemurrageAdjudicator
              as_user_id: "adj-c9x1-a"
              captures: { error_id: $.data.error_id, message: $.data.message }
          assert:
            - "409 with error_id ERR_DISPUTE_INVALID_STATE"
            - "the dispute is still DRAFT with first_level_adjudicator_id null and version unchanged"
            - "the charge is still FINAL and the invoice is still ISSUED"

      - name: closed_invoice_is_not_disputable
        claim_type: triggerable
        grounds:
          - errors.ERR_INVOICE_NOT_DISPUTABLE
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / closed_invoice_state_409_outranks_expired_dispute_window_422
          rationale: |
            That §1.8 instance submits against a CLOSED invoice and pins the 409
            ERR_INVOICE_NOT_DISPUTABLE as the winner over the expired window, so
            the code is already triggered and asserted there.

      - name: complaint_before_the_appeal_is_exhausted
        claim_type: triggerable
        grounds:
          - errors.ERR_APPEAL_NOT_EXHAUSTED
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / regulatory_complaint_requires_a_twice_decided_dispute
          rationale: |
            The §1.8 instance files the complaint against a round-1 DECIDED
            dispute and pins the 422 ERR_APPEAL_NOT_EXHAUSTED, then appeals and
            re-decides to show the same request succeeding.

      - name: cycle_on_a_draft_tariff_rule_set
        claim_type: triggerable
        grounds:
          - errors.ERR_TARIFF_NOT_PUBLISHED
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / placement_cycle_create_gated_by_tariff_rule_set_publication
          rationale: |
            The §1.8 instance creates the cycle against a DRAFT rule set, pins
            the 422 ERR_TARIFF_NOT_PUBLISHED, publishes and retries, and also
            covers the SUPERSEDED arm of the same code.

      - name: car_occupied_by_an_overlapping_cycle
        claim_type: triggerable
        grounds:
          - errors.ERR_CAR_CYCLE_OVERLAP
        excluded_because:
          difficulty_instance: resource_temporal_overlap / rail_car_occupation_interval_is_half_open_at_released_at
          rationale: |
            The §1.8 instance pins the 409 one millisecond inside the interval
            and the success exactly at released_at, so the code and its boundary
            are both already asserted.

      - name: facility_out_of_spots
        claim_type: triggerable
        grounds:
          - errors.ERR_FACILITY_SPOT_UNAVAILABLE
        excluded_because:
          difficulty_instance: resource_temporal_overlap / facility_spot_capacity_and_switch_buffer_are_separate_overlap_gates
          rationale: |
            The §1.8 instance fills the track to capacity and pins the 409
            ERR_FACILITY_SPOT_UNAVAILABLE as the winner, then frees a spot to
            expose the buffer gate underneath.

      - name: facility_switch_buffer_not_elapsed
        claim_type: triggerable
        grounds:
          - errors.ERR_FACILITY_SWITCH_BUFFER
        excluded_because:
          difficulty_instance: resource_temporal_overlap / facility_spot_capacity_and_switch_buffer_are_separate_overlap_gates
          rationale: |
            The same §1.8 instance's second half places a car inside the switch
            buffer with a spot free and pins the 409 ERR_FACILITY_SWITCH_BUFFER,
            proving the two gates are independent.

      - name: embargoed_track_blocks_the_release
        claim_type: triggerable
        grounds:
          - errors.ERR_FACILITY_EMBARGOED
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / facility_embargo_409_outranks_customer_credit_hold_402
          rationale: |
            The §1.8 instance triggers ERR_FACILITY_EMBARGOED on a release that
            also violates the credit-hold rule, so the code is asserted there as
            the higher-priority winner.

      - name: gate_controlled_track_blocks_a_new_spot
        claim_type: triggerable
        grounds:
          - errors.ERR_FACILITY_NOT_OPEN
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / actual_placement_blocked_by_facility_access_mode_not_by_cycle_state
          rationale: |
            The §1.8 instance actual-places into a GATE_CONTROLLED facility and
            pins the 409 ERR_FACILITY_NOT_OPEN while showing the release on the
            very same facility succeeding.

  # ==========================================================================
  # §1.7 RBAC — five non-overlapping ladders plus segregation of duties
  # ==========================================================================
  - section: rbac
    instances:
      - name: read_with_no_role_header_is_unauthenticated_before_it_is_not_found
        claim_type: authentication
        grounds:
          - validations.priority_10_role_header
          - errors.ERR_UNAUTHENTICATED
        distinguishing_aspect: |
          The auth band sits above existence, so a header-less request at a
          non-existent customer id returns 401 and leaks nothing about whether
          the id exists. An unrecognised role name fails the same way, which is
          what makes this a header check rather than a role check.
        test_recipe:
          setup:
            - "an empty system: no rows of any kind are needed"
          setup_api_calls: []
          trigger:
            - call: "GET /demurrage/customers/00000000-0000-0000-0000-0000000009c1"
              payload: {}
              as: NONE
              notes: "X-Role-Name header omitted entirely"
              captures: { error_id: $.data.error_id, message: $.data.message }
          assert:
            - "401 with error_id ERR_UNAUTHENTICATED, NOT 404 ERR_CUSTOMER_NOT_FOUND"
            - "the same request with X-Role-Name: Stationmaster (not a declared role) also returns 401"
            - "the same request with an empty X-Role-Name returns 401 as well"

      - name: customer_action_with_no_user_id_header_is_unauthenticated
        claim_type: authentication
        grounds:
          - validations.priority_12_user_id_header
          - errors.ERR_UNAUTHENTICATED
        distinguishing_aspect: |
          The role header is present and correct, so this is not the previous
          check: Customer identity resolution needs the user id, so its absence
          is authentication rather than a 400 schema failure or a 403 ownership
          failure. The same omission is harmless for a RailroadAgent.
        test_recipe:
          setup:
            - "one cycle ACTUALLY_PLACED and releasable by its owning customer"
          setup_api_calls:
            - call: "POST /demurrage/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: BillingAdmin
            - call: "POST /demurrage/customers"
              payload: { customer_code: "C9R2-CUST", name: "Anonymous Andalusite", serving_station_code: "STN97", notification_method: "EDI" }
              as: BillingAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /demurrage/facilities"
              payload: { facility_code: "C9R2-TRK", kind: "INDUSTRY_TRACK", gate_close_hour: 16, car_spot_capacity: 3, switch_buffer_minutes: 0 }
              as: BillingAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /demurrage/tariff-rule-sets"
              payload: { tariff_code: "C9R2-6004", car_ownership_scope: "ANY" }
              as: RegulatoryOfficer
              captures: { tar_id: $.data.id }
            - call: "POST /demurrage/tariff-rule-sets/${tar_id}/publish"
              payload: {}
              as: RegulatoryOfficer
            - call: "POST /demurrage/rail-cars"
              payload: { car_mark: "C9R2-ADX01", ownership: "RAILROAD_OWNED" }
              as: RailroadAgent
              captures: { car_id: $.data.id, car_v: $.data.version }
            - call: "POST /demurrage/placement-cycles"
              payload: { customer_id: "${cust_id}", rail_car_id: "${car_id}", facility_id: "${fac_id}", tariff_rule_set_id: "${tar_id}", waybill_number: "WB-C9R2-A", expected_rail_car_version: "${car_v}" }
              as: RailroadAgent
              captures: { cyc_id: $.data.id }
            - call: "POST /demurrage/placement-cycles/${cyc_id}/constructive-placement"
              payload: { constructive_placement_at: "2026-08-03T08:00:00Z", reason_code: "TRACK_FULL" }
              as: RailroadAgent
            - call: "POST /demurrage/placement-cycles/${cyc_id}/notify"
              payload: { channel: "EDI", sent_at: "2026-08-03T09:00:00Z" }
              as: RailroadAgent
            - call: "POST /demurrage/placement-cycles/${cyc_id}/actual-placement"
              payload: { actual_placement_at: "2026-08-05T10:00:00Z" }
              as: RailroadAgent
          trigger:
            - call: "POST /demurrage/placement-cycles/${cyc_id}/release"
              payload: { released_at: "2026-08-10T16:00:00Z" }
              as: Customer
              as_user_id: NONE
              notes: "X-Role-Name: Customer is sent, X-User-ID is omitted"
              captures: { error_id: $.data.error_id, message: $.data.message }
          assert:
            - "401 with error_id ERR_UNAUTHENTICATED"
            - "the cycle is still ACTUALLY_PLACED with released_at null"
            - "the same release with the owning customer's id in X-User-ID succeeds"

      - name: billing_admin_cannot_decide_a_dispute
        claim_type: exclusive_operation_denied
        grounds:
          - rbac.roles.BillingAdmin
          - rbac.roles.DemurrageAdjudicator.exclusive_operations
          - errors.ERR_ROLE_FORBIDDEN
        distinguishing_aspect: |
          The money ladder and the adjudication ladder never intersect, so the
          role that raised the charge cannot forgive it. The dispute is genuinely
          UNDER_REVIEW and the payload is valid, so only the role band rejects
          this.
        test_recipe:
          setup:
            - "a dispute UNDER_REVIEW with one evidence row on an issued invoice"
          setup_api_calls:
            - call: "POST /demurrage/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
