            - "after the clock advances to the effective date, effectuate succeeds and change_status == EFFECTIVE"

      - name: effectuate_without_client_notice_blocked
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.MethodologyChange.APPROVED_to_EFFECTIVE
        distinguishing_aspect: "client_notice_sent == false blocks effectuation with ERR_INVALID_STATE_TRANSITION even when the clock has passed the effective date."
        test_recipe:
          setup:
            - "Methodology QN EFFECTIVE; change CHGN approved with effective_date 2026-09-01 (clock already there); NO notice recorded."
          setup_api_calls:
            - *c_clock
            - call: "POST /research/methodologies"
              payload: { methodology_code: "QN1", methodology_kind: "QUANTITATIVE", version_number: 1, effective_from: "2026-01-01", weight_return_bp: 6000, weight_risk_bp: 4000, rating_ceilings: [7000, 5000, 3000, 1000] }
              as: ResearchOps
              captures: { mqn_id: $.data.id }
            - call: "POST /research/methodologies/${mqn_id}/activate"
              payload: {}
              as: ResearchOps
            - call: "GET /research/methodologies/${mqn_id}"
              payload: {}
              as: ResearchOps
              captures: { mqn_v: $.data.version }
            - call: "POST /research/methodologies/${mqn_id}/changes"
