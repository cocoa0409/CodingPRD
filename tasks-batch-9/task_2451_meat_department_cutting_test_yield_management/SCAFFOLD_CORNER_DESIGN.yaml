      - name: grind_input_link_binds_a_run_to_a_lot_and_moves_both_sides
        claim_type: cross_reference_link
        grounds:
          - endpoints[POST /meat-ops/grind-runs/{id}/inputs]
          - endpoints[GET /meat-ops/grind-inputs]
          - entities.GrindInput
          - errors[ERR_TRIM_LOT_NOT_FOUND]
        distinguishing_aspect: "The junction row demands that both endpoints of the edge exist — an unknown trim_lot_id yields ERR_TRIM_LOT_NOT_FOUND (404) — and a successful link pulls the lot's cost, lean and country into the run's blend fields while advancing TrimLot.allocated_lb and GrindRun.batch_weight_lb, so the same edge is discoverable from either side of the many-to-many."
        test_recipe:
          setup:
            - "Department 'Meat 41' at default config; clock at 2026-08-05T08:00:00Z."
            - "Purchase PA (chuck roll, net 100.00 lb, landed total 30000) has an APPROVED test whose GRIND_TRIM line carries 25.0 lb at lean 80.0 and 200.0000 per lb."
            - "TrimLot TL-1 holds 10.0 lb from that line; GrindRun GR1 (target GRD80, declared_coo USA, window 2026-08-06T06:00:00Z..07:00:00Z) is SCHEDULED and empty."
