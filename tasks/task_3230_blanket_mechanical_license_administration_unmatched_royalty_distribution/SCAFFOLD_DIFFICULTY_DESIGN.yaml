              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: MLCAdministrator
            - call: "POST /mlc/rate-schedules"
              payload: { effective_from: "2026-01-01T00:00:00Z", rate_cents_under_5min: 131, rate_cents_per_minute_over_5min: 252 }
