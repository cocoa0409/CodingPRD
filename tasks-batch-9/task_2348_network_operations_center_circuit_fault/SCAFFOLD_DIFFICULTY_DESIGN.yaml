  - rule_id: priority_pair_validation_conflict
    instances:
      - name: claim_submit_incident_not_mitigated_beats_claim_below_minimum
        grounds:
          - validations[priority=43]
          - validations[priority=93]
          - errors.ERR_INCIDENT_NOT_MITIGATED
          - errors.ERR_CLAIM_BELOW_MINIMUM
          - endpoints["POST /sla-credit-claims/{id}/submit"]
        distinguishing_aspect: |
          A cross-entity state check (priority 43, 409) outranks a fiscal-threshold check (priority 93,
          422) on the SAME request, and the two are engineered to be violated together: the auto-drafted
          claim is 45999 against a min_claim_amount_cents of 100000 while its incident is still DETECTED.
          The control call proves the 422 was genuinely pending underneath the 409.
        test_recipe:
          setup:
            - "Carrier NLC created with min_claim_amount_cents 100000 (all other terms default)."
            - "Circuit NLC-CKT-1001 MONITORED, mrc_cents 920000, with the four single-leg GOLD/SILVER/SILVER/BRONZE paths (W = 9)."
            - "Alarm at 00:00 -> SEV1 incident (target 240); ticket opened 00:30; carrier reports RESTORED at 05:00 (carrier clock 270.00)."
            - "Alarm cleared 05:00; restoration confirmed at 05:30 by lead-1, which auto-drafts a 45999-cent claim."
            - "The incident is deliberately left in response_state DETECTED, so BOTH the priority-43 and the priority-93 conditions hold when the claim is submitted."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /carriers"
              payload: { name: "NorthLink Communications", carrier_code: "NLC", min_claim_amount_cents: 100000 }
              as: PlatformAdmin
              captures: { nlc_id: $.data.id }
            - call: "POST /circuits"
              payload: { carrier_id: "${nlc_id}", carrier_circuit_identifier: "NLC-CKT-1001", site_a_code: "NYC01", site_z_code: "BOS01", bandwidth_mbps: 200, mrc_cents: 920000, monitoring_state: "MONITORED" }
              as: PlatformAdmin
              captures: { c1_id: $.data.id }
            - call: "POST /application-paths"
              payload: { name: "Trading Gateway", service_tier: "GOLD", protection_scheme: "ACTIVE_STANDBY", min_surviving_legs: 1 }
              as: PlatformAdmin
              captures: { pg_id: $.data.id }
            - call: "POST /application-paths"
              payload: { name: "Claims Portal", service_tier: "SILVER", protection_scheme: "ACTIVE_STANDBY", min_surviving_legs: 1 }
              as: PlatformAdmin
              captures: { ps1_id: $.data.id }
            - call: "POST /application-paths"
              payload: { name: "Payroll Feed", service_tier: "SILVER", protection_scheme: "ACTIVE_STANDBY", min_surviving_legs: 1 }
              as: PlatformAdmin
              captures: { ps2_id: $.data.id }
            - call: "POST /application-paths"
