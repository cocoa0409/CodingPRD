  - method: GET
    path: "/lab/consignment-agreements"
    description: "List consignment agreements (paginated)"
    roles: [OpsAdmin, CatalogManager, InventoryClerk, QualityManager, AccountManager, Customer]
    code: 200
    input: ["customer_id?", "product_id?", "replenishment_warehouse_id?", "status?", "limit?", "offset?"]
    output: "ConsignmentAgreement[]"
    side_effects: []
  - method: GET
    path: "/lab/consignment-agreements/{agreementId}"
