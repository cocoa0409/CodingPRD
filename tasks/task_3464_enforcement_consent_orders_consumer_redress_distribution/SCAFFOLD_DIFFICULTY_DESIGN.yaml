        grounds:
          - calculations.redress_waterfall
          - entities.RedressFund.fields.distributable_pool_cents
        distinguishing_aspect: "Mode (b) nested-rounding: the waterfall floors each claim FIRST (A=floor(2650000*2500000/3500000)=1892857, B=floor(2650000*1000000/3500000)=757142) and only THEN hands the 1-cent remainder to the earliest-created claim, so A==1892858 and B==757142; a sum-then-round order would leave A at 1892857."
        test_recipe:
          setup:
            - "Order IN_MONITORING; judgment 3000000 fully collected; fund OPEN_FOR_CLAIMS; claims A (loss 3000000, created first) and B (loss 1000000) both APPROVED; fund driven CLAIMS_CLOSED -> DISBURSING."
