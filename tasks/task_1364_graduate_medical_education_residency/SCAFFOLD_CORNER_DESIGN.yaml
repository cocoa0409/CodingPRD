      - name: effective_funded_positions_zero_floor
        claim_type: correct_result
        grounds:
          - calculations.effective_funded_positions
          - calculations.resident_year_stipend
          - errors[ERR_FUNDING_CAP_EXCEEDED]
        distinguishing_aspect: "Zero-quantity edge: with resident_year_stipend_cents 7,000,006 (stipend 7,000,000 -> per-block 538,462 x 13) and budget 6,999,999 the floor division yields effective_funded_positions == 0 and the very first activation is rejected on funding."
