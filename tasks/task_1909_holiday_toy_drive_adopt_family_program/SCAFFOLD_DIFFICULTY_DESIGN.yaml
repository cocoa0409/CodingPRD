  # ===========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: adoption_confirm_then_donor_cancel_preserves_wish_value
        grounds:
          - state_machines.Adoption.CONFIRMED_to_DONOR_CANCELLED
          - calculations.wish_list_value
          - calculations.adoption_commitment_snapshot
        distinguishing_aspect: |
          Conserved quantity = child's gift_estimate_cents and each wish
          item's pre-adoption status. Confirm moves wish items APPROVED ->
          COMMITTED and child WISH_LOCKED -> ADOPTED; donor cancel (before
          deadline, no gifts received) MUST restore wish items to APPROVED
          and child to BACKFILL_ELIGIBLE... but the invariant pinned is that
          gift_estimate_cents (recomputed off {REQUESTED, APPROVED}) returns
          bit-for-bit to its pre-adoption value, and family.status returns
          to VERIFIED.
        test_recipe:
          setup:
            - "family F verified with one child, gift_estimate_cents == 5000"
            - "donor pledges + confirms adoption (snapshot commitment 5000)"
            - "before any gift is received, donor cancels within deadline"
          setup_api_calls:
            - call: "POST /toy-drive/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /toy-drive/campaigns"
              payload: { season_year: 2026, intake_open_at: "2026-09-01T00:00:00Z", intake_close_at: "2026-10-15T00:00:00Z", gift_return_deadline: "2026-12-10T00:00:00Z", distribution_date: "2026-12-18T00:00:00Z", max_children_per_family: 6, max_gift_value_cents: 20000, min_gift_value_cents: 2000, backfill_budget_cents: 0, privacy_mode: "STRICT" }
