            - "NonStandardTerm.${term_id}.reviewed_by_user_id == null"

      - name: line_discount_above_the_max_stack_cap_is_rejected
        claim_type: satisfaction_to_pass
        grounds:
          - validations.P15_fiscal_floors_and_budgets
          - errors.ERR_DISCOUNT_STACK_EXCEEDED
          - entities.DeskPolicy.fields.max_stack_discount_pct
        distinguishing_aspect: |
          The stack cap is checked against the requested discount on the line write itself, inclusively:
          requested_discount_pct 0.50 on a Premium Support line is rejected with
          ERR_DISCOUNT_STACK_EXCEEDED (422) and creates no line, while 0.45 — exactly the policy cap —
          is accepted and yields final_net_cents 165000 on a 300000-cent list.
        test_recipe:
          setup:
            - "The base configuration and account from the anchored chain; max_stack_discount_pct is 0.45."
            - "One empty DRAFT quote, term_months 12, payment_terms_days 30."
          setup_api_calls:
            - *cb_clock
            - *cb_policy
            - *cb_t1
            - *cb_t2
            - *cb_t3
            - *cb_t4
            - *cb_activate
