            - "The league lowered salary_cap_limit_cents to 50000000, so provisional_cap_committed_cents 83333333 exceeds it and the EVENT-mode evaluation armed GRACE with grace_expires_at 2026-08-11T14:00:00Z."
            - "Logical clock advanced to 2026-08-11T14:00:00Z and two sweeps walked the posture ladder GRACE -> NON_COMPLIANT -> TRANSACTION_FROZEN (consecutive_noncompliant_checks 3)."
            - "A third UNROSTERED player, Ollie Frame, is available to sign."
