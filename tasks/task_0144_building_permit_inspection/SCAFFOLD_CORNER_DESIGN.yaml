        claim_type: Input Set Filtering
        grounds:
          - calculations.amount_paid
          - entities.FeePayment.fields.payment_status
          - entities.PermitApplication.fields.amount_paid
        distinguishing_aspect: "A VOID FeePayment is excluded from amount_paid: after one CLEARED 100.00 and one VOID 65.00 on a 165.00 permit, amount_paid is 100.00 and balance_due is 65.00."
        test_recipe:
          setup:
            - "A SUBMITTED permit total_permit_fee 165.00."
          setup_api_calls:
            - call: "POST /jurisdictions"
              payload: { name: "C-c1", code_edition: "IBC-2021", valuation_fee_rate_per_1000: 10, square_foot_rate: 120, plan_review_fee_pct: 0.65, minimum_permit_fee: 100 }
              as: BuildingOfficial
              captures: { jur_id: $.data.id }
            - call: "POST /contractors"
              payload: { business_name: "Cc1", license_number: "CC-1", license_status: "ACTIVE", license_expiry: "2030-01-01T00:00:00Z", bond_amount: 20000, bond_status: "VERIFIED" }
              as: PermitClerk
              captures: { con_id: $.data.id }
