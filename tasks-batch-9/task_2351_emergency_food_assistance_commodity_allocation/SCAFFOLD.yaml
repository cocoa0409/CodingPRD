    side_effects: ["writes admin_funds_base_cents, admin_funds_withheld_cents, admin_funds_cents on every AgencyAllocation", "every AgencyAllocation -> RECONCILED", "admin_funds_allocated_cents == admin_funds_pool_cents", "increments AllocationCycle.version by 1"]

