scenario: |
  Generate task harder than expert level!

  2473. Hotel Management Agreement & Owner Reporting (third-party hotel management company): agreement structure with base management fee on revenue and incentive fee on operating profit thresholds, owner-approved annual operating and capital budget with variance approval authority, performance test provisions with cure rights and termination for failure against a competitive set, working capital funding, reserve for replacement contributions and cash distribution waterfalls, centralized services allocation and chargeback transparency, employee status as owner or manager employees with liability implications, monthly reporting package with profit-and-loss, forecast and market share benchmarking, franchise agreement interplay and brand standard cost disputes
domain_name: hotel-management-agreement-owner-reporting
api_prefix: /hotel-management

complexity_profile:
  primary_archetype: multi_party_negotiation
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - rate_threshold_triggers
    - optimistic_concurrency
  entity_topology: flat
  # Peer entities linked by explicit foreign keys; no entity nests more than one
  # segment under its parent collection in the URL surface.
  state_machine_shape: cyclic
  # OperatingBudget and BrandStandardDispute are revision/negotiation cycles;
  # MonthlyReportPackage additionally carries two independent state dimensions
  # (financial_status, benchmark_status) that advance on their own triggers and
  # roll up into the computed package_status.
  relationship_patterns:
    - one_to_many
    - self_referential      # OperatingBudget.supersedes_budget_id -> OperatingBudget.id
    - cross_aggregate       # FeeAccrual/CashDistribution reference MonthlyReportPackage across the fee ledger boundary
  role_model: segregation_of_duties
  consistency_model: immediate
  difficulty_level: expert_plus
  # Density notes: 13 entities, 40 endpoints, 11 state machines, 13 calculation
  # rules (3 carrying divergent variants), 50 ordered validations, 50 error
  # codes, 2 OCC concurrency rules.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ---------------------------------------------------------------------------
# §1.1 Entity-Relationship Table
# ---------------------------------------------------------------------------

entities:
  - name: ManagementAgreement
    parent: null
    common_fields: true
    fields:
      - name: hotel_name
        type: string
        source: input
        description: trading name of the managed hotel
      - name: owner_entity_name
        type: string
        source: input
        description: legal name of the owner entity that is party to the agreement
      - name: status
        type: enum
        source: computed
        description: agreement lifecycle state
        default: DRAFT
        constraints: "one of {DRAFT, ACTIVE, CURE_PERIOD, TERMINATION_NOTICED, TERMINATED}"
      - name: base_fee_pct
        type: number
        source: input
        description: base management fee rate applied to each revenue line
        constraints: "0 < base_fee_pct <= 0.10, at most 4 decimal places"
      - name: incentive_fee_pct
        type: number
        source: input
        description: tier-1 incentive fee rate applied to AGOP above the owner priority
        constraints: "0 < incentive_fee_pct <= 0.50"
      - name: incentive_tier2_pct
        type: number
        source: input
        description: tier-2 incentive fee rate applied to annual excess above incentive_tier2_threshold_cents
        default: 0.15
        constraints: "incentive_tier2_pct >= incentive_fee_pct"
      - name: incentive_tier2_threshold_cents
        type: integer
        source: input
        description: annual excess-over-priority amount at which the tier-2 incentive rate starts
        default: 5000000
        constraints: ">= 0"
      - name: owner_priority_cents
        type: integer
        source: input
        description: annual owner priority return that AGOP must clear before incentive fee is earned
        constraints: ">= 0"
      - name: ffe_reserve_pct
        type: number
        source: input
        description: reserve-for-replacement contribution rate applied to gross revenue
        default: 0.04
        constraints: "0 <= ffe_reserve_pct <= 0.10"
      - name: centralized_services_cap_pct
        type: number
        source: input
        description: cap on total centralized-services chargebacks per period, as a share of that period's gross revenue
        default: 0.015
        constraints: "0 <= centralized_services_cap_pct <= 0.10"
      - name: working_capital_floor_cents
        type: integer
        source: input
        description: minimum working capital the owner must keep funded in the hotel operating account
        default: 0
        constraints: ">= 0"
      - name: working_capital_balance_cents
        type: integer
        source: computed
        description: current working capital balance; seeded from initial_working_capital_cents and moved by funded calls, distribution bucket 1, cure payments and employment-claim allocations
        default: 0
        constraints: "may go negative"
      - name: initial_working_capital_cents
        type: integer
        source: input
        description: owner's opening working capital deposit, written into working_capital_balance_cents at creation
        default: 0
        constraints: ">= 0"
      - name: ffe_reserve_balance_cents
        type: integer
        source: computed
        description: reserve-for-replacement cash balance; equals the signed sum of all ReserveLedgerEntry.amount_cents for this agreement
        default: 0
        constraints: ">= 0"
      - name: manager_liability_accrued_cents
        type: integer
        source: computed
        description: total manager-borne employment liability; equals the sum of manager_share_cents over EmploymentClaim rows in status ALLOCATED
        default: 0
        constraints: ">= 0"
      - name: owner_review_window_days
        type: integer
        source: input
        description: days the owner has to decide a submitted OperatingBudget before it is deemed approved
        default: 30
        constraints: ">= 1"
      - name: max_revision_rounds
        type: integer
        source: input
        description: number of REQUEST_REVISION rounds allowed before a further revision request deadlocks the budget
        default: 2
        constraints: ">= 0"
      - name: gop_test_threshold_pct
        type: number
        source: input
        description: minimum AGOP achievement ratio (actual / pro-rated budget) the performance test requires
        default: 0.85
        constraints: "0 < gop_test_threshold_pct <= 2"
      - name: rpi_test_threshold
        type: number
        source: input
        description: minimum revenue-per-available-room index against the competitive set the performance test requires
        default: 90.0
        constraints: "> 0"
      - name: min_benchmark_months
        type: integer
        source: input
        description: minimum count of STR_REPORT-sourced accepted benchmark months required before a performance test can be scored
        default: 10
        constraints: ">= 1"
      - name: test_periods_expected
        type: integer
        source: input
        description: denominator used to pro-rate the annual budgeted AGOP across the accepted reporting periods
        default: 12
        constraints: ">= 1"
      - name: consecutive_failure_limit
        type: integer
        source: input
        description: number of consecutive performance-test failures that removes the cure right
        default: 2
        constraints: ">= 1"
      - name: performance_failure_streak
        type: integer
        source: computed
        description: consecutive scored performance-test failures; reset to 0 by a PASSED test or a completed cure
        default: 0
        constraints: ">= 0"
      - name: employee_model
        type: enum
        source: input
        description: whether hotel personnel are employed by the owner or by the manager
        default: MANAGER_EMPLOYEES
        constraints: "one of {OWNER_EMPLOYEES, MANAGER_EMPLOYEES}"
      - name: manager_indemnity_cap_cents
        type: integer
        source: input
        description: ceiling on the manager's share of any single employment claim
        default: 0
        constraints: ">= 0"
      - name: cure_window_days
        type: integer
        source: input
        description: days after a curable performance-test failure during which the manager may elect and pay a cure
        default: 60
        constraints: ">= 1"
      - name: dispute_standstill_days
        type: integer
        source: input
        description: standstill period that starts when a brand standard dispute is escalated to the franchisor
        default: 45
        constraints: ">= 1"
      - name: max_dispute_rounds
        type: integer
        source: input
        description: owner-counter rounds required before a brand standard dispute may be escalated to the franchisor
        default: 2
        constraints: ">= 1"
      - name: funding_due_days
        type: integer
        source: input
        description: days a working capital call remains fundable before it becomes OVERDUE
        default: 15
        constraints: ">= 1"
      - name: termination_notice_days
        type: integer
        source: input
        description: notice period between a termination notice and the agreement becoming TERMINATED
        default: 90
        constraints: ">= 1"
      - name: distribution_hold
        type: boolean
        source: computed
        description: true while status == CURE_PERIOD or TERMINATION_NOTICED; blocks execution of CashDistribution rows
        default: false
      - name: termination_effective_utc
        type: datetime
        source: computed
        description: instant at which a TERMINATION_NOTICED agreement becomes TERMINATED; null until notice is issued
        default: null

  - name: OperatingBudget
    parent: null
    common_fields: true
    fields:
      - name: agreement_id
        type: string
        source: input
        description: "FK -> ManagementAgreement.id; the agreement this annual budget belongs to"
      - name: supersedes_budget_id
        type: string
        source: input
        description: "FK -> OperatingBudget.id; the earlier budget revision this row replaces for the same agreement and fiscal year; null on the first revision"
        default: null
      - name: fiscal_year
        type: integer
        source: input
        description: calendar fiscal year the budget covers
        constraints: "2000 <= fiscal_year <= 2100"
      - name: status
        type: enum
        source: computed
        description: budget approval state
        default: DRAFT
        constraints: "one of {DRAFT, SUBMITTED, REVISION_REQUESTED, APPROVED, DEEMED_APPROVED, DEADLOCK_CARRYFORWARD, SUPERSEDED}"
      - name: budgeted_revenue_cents
        type: integer
        source: input
        description: total budgeted gross revenue for the fiscal year
        constraints: "> 0"
      - name: budgeted_operating_expenses_cents
        type: integer
        source: input
        description: total budgeted operating expenses for the fiscal year, excluding management fees and centralized services
        constraints: ">= 0"
      - name: budgeted_capital_ffe_cents
        type: integer
        source: input
        description: routine FF&E capital budget for the fiscal year
        default: 0
        constraints: ">= 0"
      - name: budgeted_capital_brand_cents
        type: integer
        source: input
        description: brand-mandated capital budget for the fiscal year
        default: 0
        constraints: ">= 0"
      - name: budgeted_base_fee_cents
        type: integer
        source: computed
        description: budgeted base management fee, per calculation budget_agop_derivation
      - name: budgeted_centralized_cents
        type: integer
        source: computed
        description: budgeted centralized-services charge at the contractual cap, per calculation budget_agop_derivation
      - name: budgeted_agop_cents
        type: integer
        source: computed
        description: budgeted adjusted gross operating profit, per calculation budget_agop_derivation
      - name: revision_round
        type: integer
        source: computed
        description: number of completed REQUEST_REVISION rounds on this row
        default: 0
        constraints: ">= 0"
      - name: submitted_at
        type: datetime
        source: computed
        description: logical-clock instant of the most recent submit
        default: null
      - name: submitted_by_user_id
        type: string
        source: computed
        description: X-User-ID of the actor who performed the most recent submit; used by the segregation-of-duties check
        default: null
      - name: owner_decision_deadline_utc
        type: datetime
        source: computed
        description: submitted_at + agreement.owner_review_window_days; after this instant the budget is deemed approved
        default: null
      - name: decided_by_user_id
        type: string
        source: computed
        description: X-User-ID of the owner-side actor who approved or requested revision
        default: null
      - name: carryforward_applied
        type: boolean
        source: computed
        description: true when DEADLOCK_CARRYFORWARD rewrote the budgeted amounts from the prior fiscal year
        default: false

  - name: VarianceRequest
    parent: null
    common_fields: true
    fields:
      - name: budget_id
        type: string
        source: input
        description: "FK -> OperatingBudget.id; the approved budget whose line this request overspends"
      - name: category
        type: enum
        source: input
        description: which budget line the variance is measured against
        constraints: "one of {OPERATING, CAPITAL_FFE, CAPITAL_BRAND}"
      - name: requested_amount_cents
        type: integer
        source: input
        description: incremental spend authority requested above the effective baseline
        constraints: "> 0"
      - name: justification
        type: string
        source: input
        description: manager's written justification
      - name: effective_baseline_cents
        type: integer
        source: computed
        description: baseline used for the variance ratio, per calculation variance_approval_routing
      - name: variance_pct
        type: number
        source: computed
        description: requested_amount_cents / effective_baseline_cents rounded to 6 decimal places
      - name: approval_level
        type: enum
        source: computed
        description: authority tier required to decide this request, per calculation variance_approval_routing
        constraints: "one of {MANAGER_DISCRETION, ASSET_MANAGER, OWNER_REP}"
      - name: status
        type: enum
        source: computed
        description: decision state
        constraints: "one of {AUTO_APPROVED, PENDING, APPROVED, DENIED}"
      - name: requested_by_user_id
        type: string
        source: system
        description: X-User-ID of the manager actor who created the request
      - name: decided_by_user_id
        type: string
        source: computed
        description: X-User-ID of the actor who approved or denied the request
        default: null
      - name: denied_by_cascade
        type: boolean
        source: computed
        description: true when the request was denied by the termination-notice cascade rather than by an owner-side decision
        default: false

  - name: MonthlyReportPackage
    parent: null
    common_fields: true
    fields:
      - name: agreement_id
        type: string
        source: input
        description: "FK -> ManagementAgreement.id; the agreement this monthly package reports on"
      - name: fiscal_year
        type: integer
        source: input
        description: fiscal year of the reported period
      - name: period_month
        type: integer
        source: input
        description: calendar month of the reported period
        constraints: "1 <= period_month <= 12"
      - name: rooms_revenue_cents
        type: integer
        source: input
        description: rooms department revenue for the period
        constraints: ">= 0"
      - name: fnb_revenue_cents
        type: integer
        source: input
        description: food and beverage department revenue for the period
        constraints: ">= 0"
      - name: other_revenue_cents
        type: integer
        source: input
        description: other operating department revenue for the period
        constraints: ">= 0"
      - name: operating_expenses_cents
        type: integer
        source: input
        description: departmental and undistributed operating expenses, excluding management fees and centralized services
        constraints: ">= 0"
      - name: closing_cash_available_cents
        type: integer
        source: input
        description: cash in the operating account available for the period's distribution waterfall
        constraints: ">= 0"
      - name: gross_revenue_cents
        type: integer
        source: computed
        description: rooms_revenue_cents + fnb_revenue_cents + other_revenue_cents
      - name: allocated_centralized_cents
        type: integer
        source: computed
        description: sum of allocated_amount_cents over this package's CentralizedServiceCharge rows
        default: 0
      - name: base_fee_cents
        type: integer
        source: computed
        description: base management fee for the period, per calculation base_management_fee_per_line
        default: 0
      - name: agop_cents
        type: integer
        source: computed
        description: adjusted gross operating profit for the period, per calculation agop_and_provisional_incentive
        default: 0
      - name: incentive_fee_provisional_cents
        type: integer
        source: computed
        description: monthly provisional incentive fee, per calculation agop_and_provisional_incentive
        default: 0
      - name: reported_rpi
        type: number
        source: computed
        description: simple monthly revenue-per-available-room index from this package's non-superseded MarketBenchmark row; null when none exists
        default: null
      - name: financial_status
        type: enum
        source: computed
        description: profit-and-loss review dimension, independent of benchmark_status
        default: PENDING
        constraints: "one of {PENDING, SUBMITTED, ACCEPTED, DISPUTED}"
      - name: benchmark_status
        type: enum
        source: computed
        description: market-share review dimension, independent of financial_status
        default: PENDING
        constraints: "one of {PENDING, SUBMITTED, ACCEPTED, CHALLENGED}"
      - name: package_status
        type: enum
        source: computed
        description: roll-up of the two dimensions, per calculation package_status_rollup
        default: INCOMPLETE
        constraints: "one of {INCOMPLETE, PARTIAL, COMPLETE, CONTESTED}"
      - name: due_date_utc
        type: datetime
        source: computed
        description: reporting deadline, per calculation package_derived_fields
      - name: submitted_at
        type: datetime
        source: computed
        description: logical-clock instant of the most recent financial submit
        default: null
      - name: submitted_late
        type: boolean
        source: computed
        description: true when submitted_at > due_date_utc at the most recent financial submit
        default: false
      - name: resubmission_count
        type: integer
        source: computed
        description: number of financial submits after a DISPUTED outcome
        default: 0

  - name: MarketBenchmark
    parent: null
    common_fields: true
    fields:
      - name: report_package_id
        type: string
        source: input
        description: "FK -> MonthlyReportPackage.id; the reporting period this benchmark covers"
      - name: hotel_revpar_cents
        type: integer
        source: input
        description: the hotel's revenue per available room for the period
        constraints: "> 0"
      - name: comp_set_revpar_cents
        type: integer
        source: input
        description: the competitive set's revenue per available room for the period
        constraints: "> 0"
      - name: rooms_available
        type: integer
        source: input
        description: the hotel's available room-nights in the period; the weight used by the annual weighted index
        constraints: "> 0"
      - name: source
        type: enum
        source: input
        description: provenance of the benchmark data
        constraints: "one of {STR_REPORT, MANAGER_ESTIMATE}"
      - name: rpi
        type: number
        source: computed
        description: hotel_revpar_cents / comp_set_revpar_cents * 100, rounded to 2 decimal places
      - name: superseded
        type: boolean
        source: computed
        description: true once a replacement benchmark is posted after the owner challenged this one
        default: false

  - name: CentralizedServiceCharge
    parent: null
    common_fields: true
    fields:
      - name: report_package_id
        type: string
        source: input
        description: "FK -> MonthlyReportPackage.id; the period this chargeback is allocated to"
      - name: service_code
        type: enum
        source: input
        description: centralized service being charged back
        constraints: "one of {RESERVATIONS, REVENUE_MANAGEMENT, IT_HOSTING, PROCUREMENT, TALENT}; unique per report_package_id"
      - name: allocation_basis
        type: enum
        source: input
        description: basis disclosed to the owner for the hotel's share of the pool
        constraints: "one of {ROOMS_AVAILABLE, GROSS_REVENUE, HEADCOUNT, FLAT}"
      - name: pool_amount_cents
        type: integer
        source: input
        description: system-wide pool cost for the service in the period
        constraints: "> 0"
      - name: hotel_basis_share
        type: number
        source: input
        description: the hotel's share of the disclosed basis, as a decimal fraction
        constraints: "0 < hotel_basis_share <= 1, at most 6 decimal places"
      - name: allow_deferral
        type: boolean
        source: input
        description: when true the charge may be truncated at the period cap and the remainder deferred instead of rejected
        default: false
      - name: supporting_detail_provided
        type: boolean
        source: input
        description: whether the manager attached basis-level supporting detail for the owner
        default: false
      - name: requested_amount_cents
        type: integer
        source: computed
        description: round_half_up(pool_amount_cents * hotel_basis_share)
      - name: allocated_amount_cents
        type: integer
        source: computed
        description: portion of requested_amount_cents that fits under the period cap, per calculation centralized_services_allocation
      - name: deferred_amount_cents
        type: integer
        source: computed
        description: requested_amount_cents - allocated_amount_cents
        default: 0
      - name: disclosure_status
        type: enum
        source: computed
        description: chargeback transparency state
        default: DISCLOSED
        constraints: "one of {DISCLOSED, CONTESTED, ADJUSTED}"
      - name: adjusted_amount_cents
        type: integer
        source: computed
        description: allocated amount after a manager adjustment; null until disclosure_status becomes ADJUSTED
        default: null

  - name: FeeAccrual
    parent: null
    common_fields: true
    fields:
      - name: report_package_id
        type: string
        source: input
        description: "FK -> MonthlyReportPackage.id; the period the accrual is posted against; annual true-up accruals attach to the latest ACCEPTED period of the fiscal year"
      - name: fee_type
        type: enum
        source: system
        description: which fee this accrual represents
        constraints: "one of {BASE, INCENTIVE, CENTRALIZED_SERVICES}"
      - name: variant
        type: enum
        source: system
        description: PROVISIONAL for monthly accruals, FINAL for annual true-up accruals
        constraints: "one of {PROVISIONAL, FINAL}"
      - name: fiscal_year
        type: integer
        source: system
        description: fiscal year the accrual belongs to
      - name: period_month
        type: integer
        source: system
        description: calendar month the accrual belongs to; for FINAL accruals the month of the attachment period
      - name: amount_cents
        type: integer
        source: computed
        description: accrual amount; may be negative for a FINAL true-up credit to the owner
      - name: status
        type: enum
        source: computed
        description: accrual lifecycle state
        default: ACCRUED
        constraints: "one of {ACCRUED, INVOICED, PAID, REVERSED, DISPUTED_HELD}"
      - name: paid_amount_cents
        type: integer
        source: computed
        description: amount settled by an executed CashDistribution
        default: 0

  - name: CashDistribution
    parent: null
    common_fields: true
    fields:
      - name: report_package_id
        type: string
        source: input
        description: "FK -> MonthlyReportPackage.id; the period whose available cash this waterfall distributes"
      - name: available_cash_cents
        type: integer
        source: computed
        description: snapshot of the package's closing_cash_available_cents at calculation time
      - name: wc_restoration_cents
        type: integer
        source: computed
        description: bucket 1 allocation, per calculation cash_distribution_waterfall
      - name: base_fee_paid_cents
        type: integer
        source: computed
        description: bucket 2 allocation
      - name: reserve_contribution_cents
        type: integer
        source: computed
        description: bucket 3 allocation
      - name: owner_priority_paid_cents
        type: integer
        source: computed
        description: bucket 4 allocation
      - name: incentive_fee_paid_cents
        type: integer
        source: computed
        description: bucket 5 allocation
      - name: residual_to_owner_cents
        type: integer
        source: computed
        description: bucket 6 residual
      - name: shortfall_cents
        type: integer
        source: computed
        description: unmet demand across buckets 1-5; drives the auto-created working capital call
        default: 0
      - name: status
        type: enum
        source: computed
        description: distribution state
        default: CALCULATED
        constraints: "one of {CALCULATED, HELD, EXECUTED}"

  - name: ReserveLedgerEntry
    parent: null
    common_fields: false
    fields:
      - name: agreement_id
        type: string
        source: input
        description: "FK -> ManagementAgreement.id; the agreement whose reserve-for-replacement account this entry moves"
      - name: entry_type
        type: enum
        source: system
        description: kind of reserve movement
        constraints: "one of {CONTRIBUTION, DISBURSEMENT, DISBURSEMENT_REVERSAL}"
      - name: amount_cents
        type: integer
        source: system
        description: signed movement; positive for CONTRIBUTION and DISBURSEMENT_REVERSAL, negative for DISBURSEMENT
      - name: balance_after_cents
        type: integer
        source: computed
        description: running reserve balance after this entry, per calculation reserve_ledger_running_balance
      - name: source_kind
        type: enum
        source: system
        description: which action produced the entry
        constraints: "one of {DISTRIBUTION_EXECUTION, BRAND_DISPUTE_FUNDING, BRAND_DISPUTE_RESCISSION}"
      - name: memo
        type: string
        source: system
        description: human-readable provenance note naming the producing resource id

  - name: WorkingCapitalCall
    parent: null
    common_fields: true
    fields:
      - name: agreement_id
        type: string
        source: input
        description: "FK -> ManagementAgreement.id; the agreement whose owner is called to fund working capital"
      - name: amount_cents
        type: integer
        source: input
        description: amount the owner is called to fund
        constraints: "> 0"
      - name: reason
        type: enum
        source: input
        description: contractual basis for the call
        constraints: "one of {FLOOR_RESTORATION, DISTRIBUTION_SHORTFALL, CLAIM_ALLOCATION}"
      - name: status
        type: enum
        source: computed
        description: funding state
        default: REQUESTED
        constraints: "one of {REQUESTED, FUNDED, OVERDUE, WAIVED_OFFSET}"
      - name: due_date_utc
        type: datetime
        source: computed
        description: issue instant + agreement.funding_due_days
      - name: funded_amount_cents
        type: integer
        source: computed
        description: amount actually funded by the owner
        default: 0
      - name: late_funded
        type: boolean
        source: computed
        description: true when the funding arrived while the call was OVERDUE
        default: false
      - name: auto_created
        type: boolean
        source: computed
        description: true when the call was created by a cascade rather than by a manager request
        default: false

  - name: PerformanceTest
    parent: null
    common_fields: true
    fields:
      - name: agreement_id
        type: string
        source: input
        description: "FK -> ManagementAgreement.id; the agreement being tested"
      - name: fiscal_year
        type: integer
        source: input
        description: fiscal year under test
      - name: accepted_period_count
        type: integer
        source: computed
        description: count of the fiscal year's MonthlyReportPackage rows with financial_status == ACCEPTED
      - name: actual_agop_cents
        type: integer
        source: computed
        description: sum of agop_cents over those accepted periods
      - name: budgeted_agop_snapshot_cents
        type: integer
        source: computed
        description: budgeted_agop_cents copied from the budget selected by calculation performance_test_evaluation
      - name: budget_source_status
        type: enum
        source: computed
        description: status the selected budget held when the snapshot was taken
        constraints: "one of {APPROVED, DEEMED_APPROVED, DEADLOCK_CARRYFORWARD}"
      - name: prorated_budget_agop_cents
        type: integer
        source: computed
        description: budgeted_agop_snapshot_cents pro-rated across accepted_period_count of agreement.test_periods_expected
      - name: gop_achievement_pct
        type: number
        source: computed
        description: actual_agop_cents / prorated_budget_agop_cents, rounded to 4 decimal places
      - name: rpi_weighted
        type: number
        source: computed
        description: rooms-weighted annual index over STR_REPORT benchmarks, rounded to 2 decimal places
      - name: rpi_simple_average
        type: number
        source: computed
        description: unweighted mean of the same months' MarketBenchmark.rpi values, rounded to 2 decimal places; disclosed for comparison and never used for scoring
      - name: str_month_count
        type: integer
        source: computed
        description: count of STR_REPORT benchmarks on accepted periods whose benchmark_status is ACCEPTED
      - name: status
        type: enum
        source: computed
        description: test outcome and cure state
        constraints: "one of {PASSED, FAILED_CURABLE, CURE_ELECTED, CURED, TERMINATION_TRIGGERED, TERMINATED_NOTICE_ISSUED}"
      - name: cure_payment_due_cents
        type: integer
        source: computed
        description: AGOP shortfall the manager must pay to cure, per calculation performance_test_evaluation
        default: 0
      - name: cure_paid_cents
        type: integer
        source: computed
        description: cure amount actually paid
        default: 0
      - name: cure_deadline_utc
        type: datetime
        source: computed
        description: scoring instant + agreement.cure_window_days; null when the test passed
        default: null
      - name: streak_after_test
        type: integer
        source: computed
        description: agreement.performance_failure_streak as of this test's scoring

  - name: BrandStandardDispute
    parent: null
    common_fields: true
    fields:
      - name: agreement_id
        type: string
        source: input
        description: "FK -> ManagementAgreement.id; the agreement under which the brand standard cost is disputed"
      - name: franchise_requirement_ref
        type: string
        source: input
        description: franchisor requirement identifier the dispute concerns
      - name: estimated_cost_cents
        type: integer
        source: input
        description: manager's estimate of the brand-mandated cost
        constraints: "> 0"
      - name: remediation_start_utc
        type: datetime
        source: input
        description: start of the franchisor's remediation window for this requirement (inclusive)
      - name: remediation_deadline_utc
        type: datetime
        source: input
        description: end of the franchisor's remediation window (exclusive)
        constraints: "> remediation_start_utc"
      - name: status
        type: enum
        source: computed
        description: negotiation state
        default: OPENED
        constraints: "one of {OPENED, MANAGER_RESPONDED, OWNER_COUNTERED, ESCALATED_TO_FRANCHISOR, RESOLVED_OWNER_FUNDS, RESOLVED_WAIVED, DEADLOCKED}"
      - name: round
        type: integer
        source: computed
        description: completed owner-counter rounds
        default: 0
      - name: current_cost_estimate_cents
        type: integer
        source: computed
        description: most recent cost figure put forward by either party
      - name: standstill_start_utc
        type: datetime
        source: computed
        description: instant of escalation to the franchisor; null before escalation
        default: null
      - name: standstill_end_utc
        type: datetime
        source: computed
        description: standstill_start_utc + agreement.dispute_standstill_days (exclusive); null before escalation
        default: null
      - name: funding_source
        type: enum
        source: computed
        description: how a RESOLVED_OWNER_FUNDS outcome is funded
        default: null
        constraints: "one of {FFE_RESERVE, OWNER_CONTRIBUTION}"
      - name: funded_amount_cents
        type: integer
        source: computed
        description: amount drawn for the resolution; reversed to 0 by a rescission
        default: 0

  - name: EmploymentClaim
    parent: null
    common_fields: true
    fields:
      - name: agreement_id
        type: string
        source: input
        description: "FK -> ManagementAgreement.id; the agreement whose hotel personnel the claim concerns"
      - name: position_class
        type: enum
        source: input
        description: personnel class of the claimant
        constraints: "one of {GM, EXEC_COMMITTEE, LINE_STAFF}"
      - name: claim_amount_cents
        type: integer
        source: input
        description: settled or reserved value of the claim
        constraints: "> 0"
      - name: gross_negligence
        type: boolean
        source: input
        description: whether the claim arises from manager gross negligence or wilful misconduct
        default: false
      - name: employer_of_record
        type: enum
        source: computed
        description: employer of the claimant, copied from agreement.employee_model at creation
        constraints: "one of {OWNER, MANAGER}"
      - name: owner_share_cents
        type: integer
        source: computed
        description: owner-borne share, per calculation employment_claim_liability_split
        default: 0
      - name: manager_share_cents
        type: integer
        source: computed
        description: manager-borne share, per calculation employment_claim_liability_split
        default: 0
      - name: status
        type: enum
        source: computed
        description: allocation state
        default: FILED
        constraints: "one of {FILED, ALLOCATED, REVERSED}"

# ---------------------------------------------------------------------------
# §1.2 State Machine Table
# ---------------------------------------------------------------------------

state_machines:
  - entity: ManagementAgreement
    initial_state: DRAFT
    terminal_states: [TERMINATED]
    transitions:
      - from: DRAFT
        to: ACTIVE
        trigger: "POST /hotel-management/agreements/{id}/activate"
        actor: PlatformAdmin
        preconditions: ["status == DRAFT"]
        side_effects:
          - "working_capital_balance_cents set to initial_working_capital_cents"
          - "distribution_hold set to false"
          - "increments ManagementAgreement.version by 1"
      - from: ACTIVE
        to: CURE_PERIOD
        trigger: "system, during POST /hotel-management/agreements/{id}/performance-tests when the scored test lands in FAILED_CURABLE"
        actor: system
        preconditions: ["status == ACTIVE", "the scored PerformanceTest.status == FAILED_CURABLE"]
        side_effects:
          - "performance_failure_streak incremented by 1 (cascade hop 1)"
          - "distribution_hold set to true because status became CURE_PERIOD (cascade hop 2)"
          - "because distribution_hold became true, every CashDistribution whose report_package_id belongs to this agreement and whose status == CALCULATED transitions to HELD, processed in created_at ASC order (cascade hop 3)"
      - from: CURE_PERIOD
        to: ACTIVE
        trigger: "system, during POST /hotel-management/performance-tests/{id}/cure with action PAY_CURE when the payment satisfies cure_payment_due_cents"
        actor: system
        preconditions: ["status == CURE_PERIOD", "PerformanceTest.status == CURE_ELECTED"]
        side_effects:
          - "performance_failure_streak reset to 0"
          - "working_capital_balance_cents increased by PerformanceTest.cure_paid_cents"
          - "distribution_hold set to false"
          - "because distribution_hold became false, every CashDistribution of this agreement in status HELD returns to CALCULATED, processed in created_at ASC order"
      - from: CURE_PERIOD
        to: TERMINATION_NOTICED
        trigger: "POST /hotel-management/performance-tests/{id}/terminate"
        actor: OwnerRep
        preconditions: ["status == CURE_PERIOD", "PerformanceTest.status == TERMINATION_TRIGGERED"]
        side_effects:
          - "termination_effective_utc set to current logical clock + termination_notice_days"
          - "distribution_hold stays true"
          - "every VarianceRequest on a budget of this agreement with status == PENDING transitions to DENIED with denied_by_cascade = true, processed in created_at ASC order"
          - "every OperatingBudget of this agreement with status == SUBMITTED transitions to SUPERSEDED"
      - from: ACTIVE
        to: TERMINATION_NOTICED
        trigger: "POST /hotel-management/performance-tests/{id}/terminate"
        actor: OwnerRep
        preconditions: ["status == ACTIVE", "PerformanceTest.status == TERMINATION_TRIGGERED (no cure right, streak >= consecutive_failure_limit)"]
        side_effects:
          - "termination_effective_utc set to current logical clock + termination_notice_days"
          - "distribution_hold set to true"
          - "every CashDistribution of this agreement in status CALCULATED transitions to HELD, processed in created_at ASC order"
          - "every VarianceRequest on a budget of this agreement with status == PENDING transitions to DENIED with denied_by_cascade = true, processed in created_at ASC order"
      - from: TERMINATION_NOTICED
        to: TERMINATED
        trigger: "system, during POST /_clock/set_current_utc when the new clock value >= termination_effective_utc"
        actor: system
        preconditions: ["status == TERMINATION_NOTICED", "termination_effective_utc <= new clock value"]
        side_effects:
          - "distribution_hold stays true; no further operational writes are accepted"

  - entity: OperatingBudget
    initial_state: DRAFT
    terminal_states: [APPROVED, DEEMED_APPROVED, DEADLOCK_CARRYFORWARD, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /hotel-management/budgets/{id}/submit"
        actor: HotelManagerOps
        preconditions: ["status == DRAFT", "agreement.status == ACTIVE"]
        side_effects:
          - "submitted_at set to current logical clock; submitted_by_user_id set to X-User-ID"
          - "owner_decision_deadline_utc set to submitted_at + agreement.owner_review_window_days"
          - "budgeted_base_fee_cents, budgeted_centralized_cents and budgeted_agop_cents recomputed per calculation budget_agop_derivation from the amounts carried in the request body when present"
      - from: REVISION_REQUESTED
        to: SUBMITTED
        trigger: "POST /hotel-management/budgets/{id}/submit"
        actor: HotelManagerOps
        preconditions: ["status == REVISION_REQUESTED", "agreement.status == ACTIVE"]
        side_effects:
          - "revision_round incremented by 1"
          - "submitted_at, submitted_by_user_id and owner_decision_deadline_utc refreshed as on the DRAFT submit"
          - "budgeted_* amounts recomputed per calculation budget_agop_derivation"
        note: "revision cycle; the row returns to SUBMITTED without creating a new budget"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /hotel-management/budgets/{id}/decision with decision APPROVE"
        actor: OwnerRep
        preconditions:
          - "status == SUBMITTED"
          - "current logical clock <= owner_decision_deadline_utc"
          - "X-User-ID != submitted_by_user_id"
          - "no other OperatingBudget of the same agreement and fiscal_year already holds status in {APPROVED, DEEMED_APPROVED, DEADLOCK_CARRYFORWARD}"
        side_effects:
          - "decided_by_user_id set to X-User-ID"
      - from: SUBMITTED
        to: REVISION_REQUESTED
        trigger: "POST /hotel-management/budgets/{id}/decision with decision REQUEST_REVISION"
        actor: OwnerRep
        preconditions:
          - "status == SUBMITTED"
          - "current logical clock <= owner_decision_deadline_utc"
          - "X-User-ID != submitted_by_user_id"
          - "revision_round < agreement.max_revision_rounds"
        side_effects:
          - "decided_by_user_id set to X-User-ID"
      - from: SUBMITTED
        to: DEADLOCK_CARRYFORWARD
        trigger: "POST /hotel-management/budgets/{id}/decision with decision REQUEST_REVISION"
        actor: OwnerRep
        preconditions:
          - "status == SUBMITTED"
          - "current logical clock <= owner_decision_deadline_utc"
          - "X-User-ID != submitted_by_user_id"
          - "revision_round >= agreement.max_revision_rounds"
        side_effects:
          - "carryforward_applied set to true"
          - "budgeted_revenue_cents, budgeted_operating_expenses_cents, budgeted_capital_ffe_cents and budgeted_capital_brand_cents overwritten per calculation deadlock_carryforward_amounts"
          - "budgeted_base_fee_cents, budgeted_centralized_cents and budgeted_agop_cents recomputed per calculation budget_agop_derivation from the overwritten amounts"
        note: "branch of the same trigger as SUBMITTED -> REVISION_REQUESTED; the branch is selected by revision_round and carries a different side-effect set"
      - from: SUBMITTED
        to: DEEMED_APPROVED
        trigger: "system, during POST /_clock/set_current_utc when the new clock value > owner_decision_deadline_utc"
        actor: system
        preconditions: ["status == SUBMITTED", "owner_decision_deadline_utc < new clock value"]
        side_effects:
          - "decided_by_user_id stays null; the deemed approval is attributed to no actor"
        note: "processed in created_at ASC order across all agreements"
      - from: DRAFT
        to: SUPERSEDED
        trigger: "system, during POST /hotel-management/agreements/{id}/budgets when the request carries supersedes_budget_id pointing at this row"
        actor: system
        preconditions: ["status == DRAFT"]
        side_effects: ["no ledger effect; the new revision row becomes the live budget for the fiscal year"]
      - from: SUBMITTED
        to: SUPERSEDED
        trigger: "system, during POST /hotel-management/agreements/{id}/budgets when the request carries supersedes_budget_id pointing at this row"
        actor: system
        preconditions: ["status == SUBMITTED"]
        side_effects: ["no ledger effect; the pending owner decision on this row is abandoned"]
      - from: REVISION_REQUESTED
        to: SUPERSEDED
        trigger: "system, during POST /hotel-management/agreements/{id}/budgets when the request carries supersedes_budget_id pointing at this row"
        actor: system
        preconditions: ["status == REVISION_REQUESTED"]
        side_effects: ["no ledger effect"]

  - entity: MonthlyReportPackage
    initial_state: PENDING
    terminal_states: []
    transitions:
      - from: "financial_status == PENDING"
        to: "financial_status == SUBMITTED"
        trigger: "POST /hotel-management/report-packages/{id}/submit"
        actor: HotelManagerOps
        preconditions:
          - "financial_status == PENDING"
          - "agreement.status == ACTIVE"
          - "an OperatingBudget of the same agreement and fiscal_year holds status in {APPROVED, DEEMED_APPROVED, DEADLOCK_CARRYFORWARD}"
        side_effects:
          - "submitted_at set to current logical clock; submitted_late set per calculation package_derived_fields"
          - "allocated_centralized_cents, base_fee_cents, agop_cents and incentive_fee_provisional_cents frozen per calculation agop_and_provisional_incentive"
          - "creates FeeAccrual rows in status ACCRUED: BASE/PROVISIONAL with amount base_fee_cents, CENTRALIZED_SERVICES/PROVISIONAL with amount allocated_centralized_cents (omitted when 0), INCENTIVE/PROVISIONAL with amount incentive_fee_provisional_cents (omitted when 0)"
          - "package_status recomputed per calculation package_status_rollup"
      - from: "financial_status == DISPUTED"
        to: "financial_status == SUBMITTED"
        trigger: "POST /hotel-management/report-packages/{id}/submit"
        actor: HotelManagerOps
        preconditions: ["financial_status == DISPUTED", "agreement.status == ACTIVE"]
        side_effects:
          - "resubmission_count incremented by 1"
          - "submitted_at and submitted_late refreshed; fee amounts recomputed and a fresh ACCRUED FeeAccrual set is created"
          - "package_status recomputed per calculation package_status_rollup"
        note: "financial dimension cycle SUBMITTED -> DISPUTED -> SUBMITTED"
      - from: "financial_status == SUBMITTED"
        to: "financial_status == ACCEPTED"
        trigger: "POST /hotel-management/report-packages/{id}/owner-review with dimension FINANCIAL and decision ACCEPT"
        actor: OwnerRep
        preconditions: ["financial_status == SUBMITTED", "agreement.status in {ACTIVE, CURE_PERIOD}"]
        side_effects:
          - "because financial_status became ACCEPTED, every FeeAccrual of this package with status == ACCRUED transitions to INVOICED, processed in created_at ASC order (cascade hop 2)"
          - "because those accruals became INVOICED, a CashDistribution row is created in status CALCULATED with buckets filled per calculation cash_distribution_waterfall (cascade hop 3)"
          - "because that distribution carries shortfall_cents > 0, a WorkingCapitalCall with reason DISTRIBUTION_SHORTFALL, amount_cents = shortfall_cents, auto_created = true and status REQUESTED is created (cascade hop 4; skipped when shortfall_cents == 0)"
          - "package_status recomputed per calculation package_status_rollup"
      - from: "financial_status == SUBMITTED"
        to: "financial_status == DISPUTED"
        trigger: "POST /hotel-management/report-packages/{id}/owner-review with dimension FINANCIAL and decision DISPUTE"
        actor: OwnerRep
        preconditions: ["financial_status == SUBMITTED", "agreement.status in {ACTIVE, CURE_PERIOD}"]
        side_effects:
          - "every FeeAccrual of this package with status == ACCRUED transitions to REVERSED, processed in created_at ASC order"
          - "no CashDistribution row is created and no reserve movement is posted"
          - "package_status recomputed per calculation package_status_rollup"
        note: "sibling branch of the ACCEPT decision on the same trigger with a disjoint side-effect set"
      - from: "benchmark_status == PENDING"
        to: "benchmark_status == SUBMITTED"
        trigger: "POST /hotel-management/report-packages/{id}/benchmarks"
        actor: HotelManagerOps
        preconditions: ["benchmark_status == PENDING", "agreement.status == ACTIVE"]
        side_effects:
          - "MarketBenchmark row created with computed rpi; package.reported_rpi set to that rpi"
          - "package_status recomputed per calculation package_status_rollup"
        note: "independent dimension; advances whatever financial_status currently is"
      - from: "benchmark_status == CHALLENGED"
        to: "benchmark_status == SUBMITTED"
        trigger: "POST /hotel-management/report-packages/{id}/benchmarks"
        actor: HotelManagerOps
        preconditions: ["benchmark_status == CHALLENGED", "agreement.status == ACTIVE"]
        side_effects:
          - "the previous non-superseded MarketBenchmark of this package gets superseded = true"
          - "new MarketBenchmark row created; package.reported_rpi replaced by the new rpi"
          - "package_status recomputed per calculation package_status_rollup"
        note: "benchmark dimension cycle"
      - from: "benchmark_status == SUBMITTED"
        to: "benchmark_status == ACCEPTED"
        trigger: "POST /hotel-management/report-packages/{id}/owner-review with dimension BENCHMARK and decision ACCEPT"
        actor: OwnerRep
        preconditions: ["benchmark_status == SUBMITTED"]
        side_effects:
          - "the accepted benchmark month becomes eligible for the annual weighted index in calculation performance_test_evaluation"
          - "package_status recomputed per calculation package_status_rollup"
      - from: "benchmark_status == SUBMITTED"
        to: "benchmark_status == CHALLENGED"
        trigger: "POST /hotel-management/report-packages/{id}/owner-review with dimension BENCHMARK and decision DISPUTE"
        actor: OwnerRep
        preconditions: ["benchmark_status == SUBMITTED"]
        side_effects:
          - "the month is excluded from str_month_count until a replacement benchmark is accepted"
          - "package_status recomputed per calculation package_status_rollup"

  - entity: VarianceRequest
    initial_state: PENDING
    terminal_states: [AUTO_APPROVED, APPROVED, DENIED]
    transitions:
      - from: PENDING
        to: AUTO_APPROVED
        trigger: "POST /hotel-management/budgets/{id}/variance-requests"
        actor: system
        preconditions: ["approval_level == MANAGER_DISCRETION as computed at creation"]
        side_effects: ["decided_by_user_id stays null; the request immediately enters the effective_baseline_cents of later requests in the same category"]
        note: "the row is persisted directly in AUTO_APPROVED; PENDING is never observable for manager-discretion variances"
      - from: PENDING
        to: APPROVED
        trigger: "POST /hotel-management/variance-requests/{id}/decision with decision APPROVE"
        actor: AssetManager | OwnerRep
        preconditions:
          - "status == PENDING"
          - "agreement.status == ACTIVE"
          - "X-User-ID != requested_by_user_id"
          - "acting role authority covers approval_level (AssetManager covers ASSET_MANAGER only; OwnerRep covers ASSET_MANAGER and OWNER_REP)"
        side_effects: ["decided_by_user_id set to X-User-ID"]
      - from: PENDING
        to: DENIED
        trigger: "POST /hotel-management/variance-requests/{id}/decision with decision DENY"
        actor: AssetManager | OwnerRep
        preconditions:
          - "status == PENDING"
          - "agreement.status == ACTIVE"
          - "X-User-ID != requested_by_user_id"
          - "acting role authority covers approval_level"
        side_effects: ["decided_by_user_id set to X-User-ID"]
      - from: PENDING
        to: DENIED
        trigger: "system, during POST /hotel-management/performance-tests/{id}/terminate"
        actor: system
        preconditions: ["status == PENDING", "the agreement transitions to TERMINATION_NOTICED"]
        side_effects: ["denied_by_cascade set to true; decided_by_user_id stays null"]

  - entity: CentralizedServiceCharge
    initial_state: DISCLOSED
    terminal_states: [ADJUSTED]
    transitions:
      - from: DISCLOSED
        to: CONTESTED
        trigger: "POST /hotel-management/centralized-charges/{id}/review with action CONTEST"
        actor: AssetManager
        preconditions: ["disclosure_status == DISCLOSED", "the parent package financial_status in {SUBMITTED, ACCEPTED}"]
        side_effects:
          - "the parent package's FeeAccrual with fee_type == CENTRALIZED_SERVICES and status in {ACCRUED, INVOICED} transitions to DISPUTED_HELD"
      - from: CONTESTED
        to: DISCLOSED
        trigger: "POST /hotel-management/centralized-charges/{id}/review with action REAFFIRM"
        actor: HotelManagerOps
        preconditions: ["disclosure_status == CONTESTED"]
        side_effects:
          - "the held CENTRALIZED_SERVICES FeeAccrual returns to ACCRUED when the package financial_status == SUBMITTED, or to INVOICED when it is ACCEPTED"
      - from: CONTESTED
        to: ADJUSTED
        trigger: "POST /hotel-management/centralized-charges/{id}/review with action ADJUST"
        actor: HotelManagerOps
        preconditions: ["disclosure_status == CONTESTED", "adjusted_amount_cents present and 0 <= adjusted_amount_cents <= allocated_amount_cents"]
        side_effects:
          - "allocated_amount_cents replaced by adjusted_amount_cents and deferred_amount_cents recomputed as requested_amount_cents - allocated_amount_cents (cascade hop 1)"
          - "because the charge's allocated amount changed, package.allocated_centralized_cents, package.agop_cents and package.incentive_fee_provisional_cents are recomputed per calculation agop_and_provisional_incentive (cascade hop 2)"
          - "because package.incentive_fee_provisional_cents changed, the package's INCENTIVE/PROVISIONAL FeeAccrual amount_cents is rewritten to the new value and the CENTRALIZED_SERVICES accrual amount_cents is rewritten to the adjusted amount and returned from DISPUTED_HELD to its pre-contest status (cascade hop 3)"

  - entity: FeeAccrual
    initial_state: ACCRUED
    terminal_states: [PAID, REVERSED]
    transitions:
      - from: ACCRUED
        to: INVOICED
        trigger: "system, during POST /hotel-management/report-packages/{id}/owner-review with dimension FINANCIAL and decision ACCEPT"
        actor: system
        preconditions: ["status == ACCRUED"]
        side_effects: ["becomes payable demand in buckets 2 and 5 of calculation cash_distribution_waterfall"]
      - from: ACCRUED
        to: REVERSED
        trigger: "system, during POST /hotel-management/report-packages/{id}/owner-review with dimension FINANCIAL and decision DISPUTE"
        actor: system
        preconditions: ["status == ACCRUED"]
        side_effects: ["amount_cents retained for audit; the row no longer contributes to any waterfall or true-up sum"]
      - from: INVOICED
        to: PAID
        trigger: "system, during POST /hotel-management/distributions/{id}/execute"
        actor: system
        preconditions: ["status == INVOICED", "the executing distribution allocated cash to this accrual's bucket"]
        side_effects: ["paid_amount_cents set to the allocated amount"]
      - from: ACCRUED
        to: DISPUTED_HELD
        trigger: "system, during POST /hotel-management/centralized-charges/{id}/review with action CONTEST"
        actor: system
        preconditions: ["status == ACCRUED", "fee_type == CENTRALIZED_SERVICES"]
        side_effects: ["blocks distribution execution for the package per validation priority 46"]
      - from: INVOICED
        to: DISPUTED_HELD
        trigger: "system, during POST /hotel-management/centralized-charges/{id}/review with action CONTEST"
        actor: system
        preconditions: ["status == INVOICED", "fee_type == CENTRALIZED_SERVICES"]
        side_effects: ["blocks distribution execution for the package per validation priority 46"]
      - from: DISPUTED_HELD
        to: ACCRUED
        trigger: "system, during POST /hotel-management/centralized-charges/{id}/review with action REAFFIRM or ADJUST while the package financial_status == SUBMITTED"
        actor: system
        preconditions: ["status == DISPUTED_HELD"]
        side_effects: ["amount_cents rewritten to the charge's post-review allocated amount"]
      - from: DISPUTED_HELD
        to: INVOICED
        trigger: "system, during POST /hotel-management/centralized-charges/{id}/review with action REAFFIRM or ADJUST while the package financial_status == ACCEPTED"
        actor: system
        preconditions: ["status == DISPUTED_HELD"]
        side_effects: ["amount_cents rewritten to the charge's post-review allocated amount"]

  - entity: CashDistribution
    initial_state: CALCULATED
    terminal_states: [EXECUTED]
    transitions:
      - from: CALCULATED
        to: EXECUTED
        trigger: "POST /hotel-management/distributions/{id}/execute"
        actor: HotelManagerOps
        preconditions:
          - "status == CALCULATED"
          - "agreement.distribution_hold == false"
          - "no FeeAccrual of the same package holds status DISPUTED_HELD"
        side_effects:
          - "agreement.working_capital_balance_cents increased by wc_restoration_cents"
          - "every WorkingCapitalCall of the agreement with reason FLOOR_RESTORATION and status REQUESTED transitions to WAIVED_OFFSET when wc_restoration_cents alone lifts working_capital_balance_cents to or above working_capital_floor_cents, processed in created_at ASC order"
          - "BASE and INCENTIVE accruals of the package that received cash transition INVOICED -> PAID"
          - "a ReserveLedgerEntry with entry_type CONTRIBUTION, amount_cents = reserve_contribution_cents and source_kind DISTRIBUTION_EXECUTION is appended, and agreement.ffe_reserve_balance_cents increased by the same amount (skipped when reserve_contribution_cents == 0)"
      - from: CALCULATED
        to: HELD
        trigger: "system, when agreement.distribution_hold becomes true (curable performance-test failure, or termination notice from ACTIVE)"
        actor: system
        preconditions: ["status == CALCULATED"]
        side_effects: ["execution is refused while HELD"]
      - from: HELD
        to: CALCULATED
        trigger: "system, when agreement.distribution_hold becomes false after a completed cure"
        actor: system
        preconditions: ["status == HELD", "agreement.status returns to ACTIVE"]
        side_effects: ["bucket amounts are retained unchanged; no recalculation occurs"]

  - entity: WorkingCapitalCall
    initial_state: REQUESTED
    terminal_states: [FUNDED, WAIVED_OFFSET]
    transitions:
      - from: REQUESTED
        to: FUNDED
        trigger: "POST /hotel-management/working-capital-calls/{id}/fund"
        actor: OwnerRep
        preconditions: ["status == REQUESTED", "funded_amount_cents == amount_cents"]
        side_effects:
          - "funded_amount_cents recorded; agreement.working_capital_balance_cents increased by amount_cents"
      - from: OVERDUE
        to: FUNDED
        trigger: "POST /hotel-management/working-capital-calls/{id}/fund"
        actor: OwnerRep
        preconditions: ["status == OVERDUE", "funded_amount_cents == amount_cents"]
        side_effects:
          - "late_funded set to true; agreement.working_capital_balance_cents increased by amount_cents"
      - from: REQUESTED
        to: OVERDUE
        trigger: "system, during POST /_clock/set_current_utc when the new clock value > due_date_utc"
        actor: system
        preconditions: ["status == REQUESTED", "due_date_utc < new clock value"]
        side_effects: ["no cash movement; processed in created_at ASC order"]
      - from: REQUESTED
        to: WAIVED_OFFSET
        trigger: "system, during POST /hotel-management/distributions/{id}/execute"
        actor: system
        preconditions: ["status == REQUESTED", "reason == FLOOR_RESTORATION", "the distribution's wc_restoration_cents lifts working_capital_balance_cents to or above agreement.working_capital_floor_cents"]
        side_effects: ["funded_amount_cents stays 0; the call is extinguished by the offsetting distribution"]

  - entity: PerformanceTest
    initial_state: PASSED
    terminal_states: [PASSED, CURED, TERMINATED_NOTICE_ISSUED]
    transitions:
      - from: "(creation)"
        to: PASSED
        trigger: "POST /hotel-management/agreements/{id}/performance-tests"
        actor: PlatformAdmin
        preconditions: ["scoring per calculation performance_test_evaluation yields failed == false"]
        side_effects: ["agreement.performance_failure_streak reset to 0", "cure_deadline_utc stays null"]
      - from: "(creation)"
        to: FAILED_CURABLE
        trigger: "POST /hotel-management/agreements/{id}/performance-tests"
        actor: PlatformAdmin
        preconditions: ["scoring yields failed == true", "agreement.performance_failure_streak + 1 < agreement.consecutive_failure_limit"]
        side_effects:
          - "cure_payment_due_cents and cure_deadline_utc set per calculation performance_test_evaluation"
          - "agreement transitions ACTIVE -> CURE_PERIOD, which drives the distribution-hold cascade documented on that transition"
      - from: "(creation)"
        to: TERMINATION_TRIGGERED
        trigger: "POST /hotel-management/agreements/{id}/performance-tests"
        actor: PlatformAdmin
        preconditions: ["scoring yields failed == true", "agreement.performance_failure_streak + 1 >= agreement.consecutive_failure_limit"]
        side_effects:
          - "agreement.performance_failure_streak incremented by 1; agreement.status stays ACTIVE until the owner issues notice"
          - "cure_deadline_utc stays null; no cure right arises"
        note: "branch of the same trigger as FAILED_CURABLE, selected by the streak threshold, with a disjoint side-effect set"
      - from: FAILED_CURABLE
        to: CURE_ELECTED
        trigger: "POST /hotel-management/performance-tests/{id}/cure with action ELECT_CURE"
        actor: HotelManagerOps
        preconditions: ["status == FAILED_CURABLE", "current logical clock <= cure_deadline_utc"]
        side_effects: ["no cash movement; the manager's election is recorded"]
      - from: CURE_ELECTED
        to: CURED
        trigger: "POST /hotel-management/performance-tests/{id}/cure with action PAY_CURE"
        actor: HotelManagerOps
        preconditions: ["status == CURE_ELECTED", "current logical clock <= cure_deadline_utc", "payment_amount_cents >= cure_payment_due_cents"]
        side_effects:
          - "cure_paid_cents set to payment_amount_cents"
          - "agreement transitions CURE_PERIOD -> ACTIVE, which drives the hold-release cascade documented on that transition"
      - from: FAILED_CURABLE
        to: TERMINATION_TRIGGERED
        trigger: "system, during POST /_clock/set_current_utc when the new clock value > cure_deadline_utc"
        actor: system
        preconditions: ["status == FAILED_CURABLE", "cure_deadline_utc < new clock value"]
        side_effects: ["agreement.status stays CURE_PERIOD; the owner may now issue a termination notice"]
      - from: CURE_ELECTED
        to: TERMINATION_TRIGGERED
        trigger: "system, during POST /_clock/set_current_utc when the new clock value > cure_deadline_utc"
        actor: system
        preconditions: ["status == CURE_ELECTED", "cure_deadline_utc < new clock value"]
        side_effects: ["the election lapses without payment; agreement.status stays CURE_PERIOD"]
      - from: TERMINATION_TRIGGERED
        to: TERMINATED_NOTICE_ISSUED
        trigger: "POST /hotel-management/performance-tests/{id}/terminate"
        actor: OwnerRep
        preconditions: ["status == TERMINATION_TRIGGERED", "agreement.status in {ACTIVE, CURE_PERIOD}"]
        side_effects: ["agreement transitions to TERMINATION_NOTICED with the cascade documented on that transition"]

  - entity: BrandStandardDispute
    initial_state: OPENED
    terminal_states: [RESOLVED_WAIVED, DEADLOCKED]
    transitions:
      - from: OPENED
        to: MANAGER_RESPONDED
        trigger: "POST /hotel-management/brand-disputes/{id}/rounds with action MANAGER_RESPONSE"
        actor: HotelManagerOps
        preconditions: ["status == OPENED", "cost_estimate_cents present"]
        side_effects: ["current_cost_estimate_cents replaced by cost_estimate_cents"]
      - from: MANAGER_RESPONDED
        to: OWNER_COUNTERED
        trigger: "POST /hotel-management/brand-disputes/{id}/rounds with action OWNER_COUNTER"
        actor: AssetManager | OwnerRep
        preconditions: ["status == MANAGER_RESPONDED", "cost_estimate_cents present"]
        side_effects: ["round incremented by 1", "current_cost_estimate_cents replaced by cost_estimate_cents"]
      - from: OWNER_COUNTERED
        to: MANAGER_RESPONDED
        trigger: "POST /hotel-management/brand-disputes/{id}/rounds with action MANAGER_RESPONSE"
        actor: HotelManagerOps
        preconditions: ["status == OWNER_COUNTERED", "cost_estimate_cents present"]
        side_effects: ["current_cost_estimate_cents replaced by cost_estimate_cents"]
        note: "negotiation cycle MANAGER_RESPONDED -> OWNER_COUNTERED -> MANAGER_RESPONDED"
      - from: OWNER_COUNTERED
        to: ESCALATED_TO_FRANCHISOR
        trigger: "POST /hotel-management/brand-disputes/{id}/rounds with action ESCALATE_TO_FRANCHISOR"
        actor: HotelManagerOps
        preconditions: ["status == OWNER_COUNTERED", "round >= agreement.max_dispute_rounds"]
        side_effects:
          - "standstill_start_utc set to current logical clock; standstill_end_utc set to standstill_start_utc + agreement.dispute_standstill_days"
      - from: ESCALATED_TO_FRANCHISOR
        to: DEADLOCKED
        trigger: "system, during POST /_clock/set_current_utc when the new clock value >= standstill_end_utc"
        actor: system
        preconditions: ["status == ESCALATED_TO_FRANCHISOR", "standstill_end_utc <= new clock value"]
        side_effects: ["the requirement remains unfunded; no reserve movement"]
      - from: MANAGER_RESPONDED
        to: RESOLVED_OWNER_FUNDS
        trigger: "POST /hotel-management/brand-disputes/{id}/rounds with action RESOLVE_OWNER_FUNDS"
        actor: OwnerRep
        preconditions:
          - "status == MANAGER_RESPONDED"
          - "funding_source present"
          - "when funding_source == FFE_RESERVE: agreement.ffe_reserve_balance_cents >= current_cost_estimate_cents"
        side_effects:
          - "funded_amount_cents set to current_cost_estimate_cents"
          - "when funding_source == FFE_RESERVE a ReserveLedgerEntry with entry_type DISBURSEMENT, amount_cents = -current_cost_estimate_cents and source_kind BRAND_DISPUTE_FUNDING is appended and agreement.ffe_reserve_balance_cents decreased by the same amount"
          - "when funding_source == OWNER_CONTRIBUTION a WorkingCapitalCall with reason FLOOR_RESTORATION, amount_cents = current_cost_estimate_cents, auto_created = true and status REQUESTED is created instead, and the reserve is untouched"
      - from: OWNER_COUNTERED
        to: RESOLVED_OWNER_FUNDS
        trigger: "POST /hotel-management/brand-disputes/{id}/rounds with action RESOLVE_OWNER_FUNDS"
        actor: OwnerRep
        preconditions:
          - "status == OWNER_COUNTERED"
          - "funding_source present"
          - "when funding_source == FFE_RESERVE: agreement.ffe_reserve_balance_cents >= current_cost_estimate_cents"
        side_effects: ["identical to the MANAGER_RESPONDED -> RESOLVED_OWNER_FUNDS side-effect set"]
      - from: RESOLVED_OWNER_FUNDS
        to: OWNER_COUNTERED
        trigger: "POST /hotel-management/brand-disputes/{id}/rounds with action RESCIND_RESOLUTION"
        actor: OwnerRep
        preconditions: ["status == RESOLVED_OWNER_FUNDS"]
        side_effects:
          - "when the resolution drew on the reserve, a ReserveLedgerEntry with entry_type DISBURSEMENT_REVERSAL, amount_cents = +funded_amount_cents and source_kind BRAND_DISPUTE_RESCISSION is appended and agreement.ffe_reserve_balance_cents increased by the same amount"
          - "funded_amount_cents reset to 0; funding_source reset to null; round left unchanged"
        note: "compensating action for the reserve disbursement"
      - from: MANAGER_RESPONDED
        to: RESOLVED_WAIVED
        trigger: "POST /hotel-management/brand-disputes/{id}/rounds with action RESOLVE_WAIVED"
        actor: OwnerRep
        preconditions: ["status == MANAGER_RESPONDED"]
        side_effects: ["no cash movement; the franchisor requirement is recorded as waived"]
      - from: OWNER_COUNTERED
        to: RESOLVED_WAIVED
        trigger: "POST /hotel-management/brand-disputes/{id}/rounds with action RESOLVE_WAIVED"
        actor: OwnerRep
        preconditions: ["status == OWNER_COUNTERED"]
        side_effects: ["no cash movement"]

  - entity: EmploymentClaim
    initial_state: FILED
    terminal_states: []
    transitions:
      - from: FILED
        to: ALLOCATED
        trigger: "POST /hotel-management/employment-claims/{id}/allocation with action ALLOCATE"
        actor: AssetManager
        preconditions: ["status == FILED", "agreement.status in {ACTIVE, CURE_PERIOD}"]
        side_effects:
          - "owner_share_cents and manager_share_cents set per calculation employment_claim_liability_split"
          - "agreement.working_capital_balance_cents decreased by owner_share_cents and agreement.manager_liability_accrued_cents increased by manager_share_cents (cascade hop 1)"
          - "because working_capital_balance_cents fell below agreement.working_capital_floor_cents, a WorkingCapitalCall with reason CLAIM_ALLOCATION, amount_cents = working_capital_floor_cents - working_capital_balance_cents, auto_created = true and status REQUESTED is created (cascade hop 2; skipped when the balance still meets the floor)"
      - from: ALLOCATED
        to: REVERSED
        trigger: "POST /hotel-management/employment-claims/{id}/allocation with action REVERSE"
        actor: AssetManager
        preconditions: ["status == ALLOCATED"]
        side_effects:
          - "agreement.working_capital_balance_cents increased by owner_share_cents and agreement.manager_liability_accrued_cents decreased by manager_share_cents"
          - "owner_share_cents and manager_share_cents reset to 0"
        note: "compensating action for the allocation"
      - from: REVERSED
        to: ALLOCATED
        trigger: "POST /hotel-management/employment-claims/{id}/allocation with action ALLOCATE"
        actor: AssetManager
        preconditions: ["status == REVERSED", "agreement.status in {ACTIVE, CURE_PERIOD}"]
        side_effects: ["identical to the FILED -> ALLOCATED side-effect set, recomputed against the agreement's current configuration"]
        note: "allocation cycle ALLOCATED -> REVERSED -> ALLOCATED"

# ---------------------------------------------------------------------------
# §1.2.1 Concurrency Rules (OCC on the parent's version — see §1.2.1 filter)
# ---------------------------------------------------------------------------

concurrency_rules:
  - rule_id: budget-revision-stale-agreement
    parent_entity: ManagementAgreement
    write_endpoint: "POST /hotel-management/agreements/{id}/budgets"
    occ_field: "expected_agreement_version"
    description: |
      Creating an OperatingBudget revision against an agreement whose version has
      advanced since the client last read it is rejected. A budget revision
      legitimately supersedes the live budget for the same fiscal year, so a
      writer working from a stale view of the agreement would silently displace a
      revision it never saw; the stale-version check converts that into a
      deterministic rejection.
    error_id: ERR_STALE_AGREEMENT_VERSION
    http_status: 412
  - rule_id: true-up-stale-agreement
    parent_entity: ManagementAgreement
    write_endpoint: "POST /hotel-management/agreements/{id}/annual-true-up"
    occ_field: "expected_agreement_version"
    description: |
      Running the annual incentive true-up against an agreement whose version has
      advanced since the client last read it is rejected. A true-up run
      legitimately supersedes the prior FINAL accrual for the fiscal year, so a
      writer holding a stale view of the agreement would reverse and re-post
      against economics it never observed.
    error_id: ERR_STALE_AGREEMENT_VERSION
    http_status: 412

# ---------------------------------------------------------------------------
# §1.3 Calculation Rules Table
# ---------------------------------------------------------------------------

calculations:
  - name: package_derived_fields
    trigger: "on POST /hotel-management/agreements/{id}/report-packages (creation) and refreshed on every POST /hotel-management/report-packages/{id}/submit"
    algorithm: aggregation
    formula: |
      gross_revenue_cents = rooms_revenue_cents + fnb_revenue_cents + other_revenue_cents

      # reporting deadline: the 25th of the month after the reported period, 00:00:00Z
      if period_month < 12:
          due_date_utc = ISO(fiscal_year, period_month + 1, 25, 00:00:00Z)
      else:
          due_date_utc = ISO(fiscal_year + 1, 1, 25, 00:00:00Z)

      # evaluated at each financial submit against the logical clock
      submitted_late = (submitted_at > due_date_utc)   # strict: equality is on time
    input_set: "the three revenue input fields of this package only; no sibling packages participate"
    constants:
      DUE_DAY_OF_FOLLOWING_MONTH: 25
    precision: "integer cents; datetimes ISO 8601 UTC with three fractional digits"

  - name: package_status_rollup
    trigger: "recomputed at the end of every transition that changes financial_status or benchmark_status"
    algorithm: constraint_propagation
    formula: |
      if financial_status == DISPUTED or benchmark_status == CHALLENGED:
          package_status = CONTESTED
      elif financial_status == ACCEPTED and benchmark_status == ACCEPTED:
          package_status = COMPLETE
      elif financial_status == ACCEPTED or benchmark_status == ACCEPTED:
          package_status = PARTIAL
      else:
          package_status = INCOMPLETE
    input_set: "the two independent status dimensions of this package row only"
    constants: {}
    precision: "enum; the four branches are evaluated top-to-bottom so CONTESTED dominates COMPLETE"

  - name: base_management_fee_per_line
    trigger: "on POST /hotel-management/report-packages/{id}/submit, before agop_and_provisional_incentive"
    algorithm: tiered_pricing
    formula: |
      # PINNED ROUNDING ORDER: round each revenue line to whole cents, then sum.
      # Summing first and rounding once is NOT the contractual order and yields a
      # different cent figure for the same inputs.
      base_fee_cents = round_half_up(rooms_revenue_cents  * agreement.base_fee_pct)
                     + round_half_up(fnb_revenue_cents    * agreement.base_fee_pct)
                     + round_half_up(other_revenue_cents  * agreement.base_fee_pct)
    input_set: "the three revenue lines of the package being submitted"
    constants: {}
    precision: "round_half_up per line to whole cents; round_half_up(x) = floor(|x| + 0.5) with the sign of x re-applied"

  - name: centralized_services_allocation
    trigger: "on POST /hotel-management/report-packages/{id}/centralized-charges (full recompute over the package's charges) and on POST /hotel-management/centralized-charges/{id}/review with action ADJUST"
    algorithm: waterfall_allocation
    formula: |
      cap_cents = floor(package.gross_revenue_cents * agreement.centralized_services_cap_pct)

      # processing order: fixed service priority, then created_at ASC for safety
      SERVICE_PRIORITY = [RESERVATIONS, REVENUE_MANAGEMENT, IT_HOSTING, PROCUREMENT, TALENT]
      charges = package.charges sorted by (index in SERVICE_PRIORITY, created_at ASC)

      remaining = cap_cents
      for c in charges:
          c.requested_amount_cents = round_half_up(c.pool_amount_cents * c.hotel_basis_share)
          if c.disclosure_status == ADJUSTED:
              c.allocated_amount_cents = c.adjusted_amount_cents
          else:
              c.allocated_amount_cents = min(c.requested_amount_cents, max(0, remaining))
          c.deferred_amount_cents = c.requested_amount_cents - c.allocated_amount_cents
          remaining = remaining - c.allocated_amount_cents

      package.allocated_centralized_cents = sum(c.allocated_amount_cents for c in charges)
    input_set: "every CentralizedServiceCharge row of the package regardless of disclosure_status; ADJUSTED rows keep their adjusted amount and still consume cap"
    constants:
      SERVICE_PRIORITY: "[RESERVATIONS, REVENUE_MANAGEMENT, IT_HOSTING, PROCUREMENT, TALENT]"
    precision: "cap floored to whole cents; each requested amount round_half_up to whole cents"
    variants:
      - name: hard_cap_rejection
        when: "the incoming charge carries allow_deferral == false"
        difference: "the post is rejected with ERR_CENTRALIZED_CAP_EXCEEDED when cumulative requested_amount_cents across the package would exceed cap_cents; nothing is persisted"
      - name: deferral_truncation
        when: "the incoming charge carries allow_deferral == true"
        difference: "the charge is persisted with allocated_amount_cents truncated to the cap remainder and deferred_amount_cents carrying the rest"

  - name: agop_and_provisional_incentive
    trigger: "on POST /hotel-management/report-packages/{id}/submit and on POST /hotel-management/centralized-charges/{id}/review with action ADJUST"
    algorithm: threshold
    formula: |
      # PINNED EVALUATION ORDER — the dependency looks circular because the fees
      # both reduce AGOP while the centralized cap is keyed on gross revenue:
      #   1. allocated_centralized_cents  (calculation centralized_services_allocation, cap keyed on gross revenue)
      #   2. base_fee_cents               (calculation base_management_fee_per_line)
      #   3. agop_cents                   (uses the outputs of 1 and 2)
      #   4. monthly owner priority       (independent of 1-3)
      #   5. incentive_fee_provisional    (uses the outputs of 3 and 4)
      # The FF&E reserve contribution is keyed on gross revenue too but is NEVER
      # deducted in step 3.
      agop_cents = package.gross_revenue_cents
                 - package.operating_expenses_cents
                 - package.base_fee_cents
                 - package.allocated_centralized_cents

      monthly_priority_cents = round_half_up(agreement.owner_priority_cents / 12)

      incentive_fee_provisional_cents = max(
          0,
          round_half_up((agop_cents - monthly_priority_cents) * agreement.incentive_fee_pct)
      )
    input_set: "this package row plus its CentralizedServiceCharge rows; sibling periods never participate"
    constants:
      MONTHS_PER_YEAR: 12
    precision: "round_half_up to whole cents at steps 4 and 5; no intermediate rounding inside step 3"
    variants:
      - name: monthly_provisional
        when: "at every financial submit of a monthly package"
        difference: "each month is floored at 0 independently and the owner priority enters as the rounded monthly twelfth, so loss months never offset profit months"

  - name: annual_incentive_true_up
    trigger: "on POST /hotel-management/agreements/{id}/annual-true-up"
    algorithm: tiered_pricing
    formula: |
      accepted = MonthlyReportPackage rows of the agreement with
                 fiscal_year == request.fiscal_year and financial_status == ACCEPTED
      if count(accepted) == 0: reject with ERR_NO_ACCEPTED_PERIODS

      annual_agop_cents = sum(p.agop_cents for p in accepted)
      excess_cents = annual_agop_cents - agreement.owner_priority_cents   # FULL annual priority, not 12 rounded twelfths

      if excess_cents <= 0:
          final_incentive_fee_cents = 0
      else:
          tier1_base = min(excess_cents, agreement.incentive_tier2_threshold_cents)
          tier2_base = max(0, excess_cents - agreement.incentive_tier2_threshold_cents)
          final_incentive_fee_cents = round_half_up(tier1_base * agreement.incentive_fee_pct) \
                                    + round_half_up(tier2_base * agreement.incentive_tier2_pct)

      provisional_total_cents = sum(a.amount_cents for a in FeeAccrual
                                    where a.fiscal_year == request.fiscal_year
                                      and a.fee_type == INCENTIVE
                                      and a.variant == PROVISIONAL
                                      and a.status in {ACCRUED, INVOICED, PAID})

      true_up_delta_cents = final_incentive_fee_cents - provisional_total_cents

      # attachment period: the ACCEPTED package with the highest period_month,
      # tie-break created_at DESC (a tie cannot occur under the period uniqueness rule)
      attach = accepted sorted by (period_month DESC, created_at DESC)[0]

      # a prior FINAL accrual for the same fiscal_year is set to REVERSED first
      post FeeAccrual(report_package_id = attach.id, fee_type = INCENTIVE,
                      variant = FINAL, amount_cents = true_up_delta_cents,
                      status = ACCRUED)
    input_set: "only packages whose financial_status == ACCEPTED; DISPUTED, SUBMITTED and PENDING periods are excluded, and REVERSED provisional accruals never enter provisional_total_cents"
    constants: {}
    precision: "round_half_up per tier, then sum the two tiers; a negative delta is persisted as a negative amount_cents"
    variants:
      - name: final_annual
        when: "at the annual true-up"
        difference: "the annual computation nets loss months against profit months, applies the full unrounded annual owner priority, and adds a second incentive tier above incentive_tier2_threshold_cents — none of which the monthly provisional variant can express, so the same accepted periods yield a different fee"

  - name: budget_agop_derivation
    trigger: "on POST /hotel-management/agreements/{id}/budgets and on every POST /hotel-management/budgets/{id}/submit"
    algorithm: aggregation
    formula: |
      budgeted_base_fee_cents    = round_half_up(budgeted_revenue_cents * agreement.base_fee_pct)
      budgeted_centralized_cents = floor(budgeted_revenue_cents * agreement.centralized_services_cap_pct)
      budgeted_agop_cents        = budgeted_revenue_cents
                                 - budgeted_operating_expenses_cents
                                 - budgeted_base_fee_cents
                                 - budgeted_centralized_cents
    input_set: "the budget row's own amounts; the budgeted base fee is rounded ONCE on the annual total, unlike the per-line actual fee"
    constants: {}
    precision: "round_half_up for the fee, floor for the capped centralized amount"

  - name: deadlock_carryforward_amounts
    trigger: "on the SUBMITTED -> DEADLOCK_CARRYFORWARD transition of OperatingBudget"
    algorithm: projection
    formula: |
      # eligibility filter for the source budget
      candidates = OperatingBudget rows of the same agreement with
                   fiscal_year == this.fiscal_year - 1 and
                   status in {APPROVED, DEEMED_APPROVED, DEADLOCK_CARRYFORWARD}
      # ranking, then tie-break
      source = candidates sorted by (revision_round DESC, created_at DESC)[0]

      if source exists:
          budgeted_revenue_cents            = round_half_up(source.budgeted_revenue_cents * CARRYFORWARD_FACTOR)
          budgeted_operating_expenses_cents = round_half_up(source.budgeted_operating_expenses_cents * CARRYFORWARD_FACTOR)
          budgeted_capital_ffe_cents        = round_half_up(source.budgeted_capital_ffe_cents * CARRYFORWARD_FACTOR)
          budgeted_capital_brand_cents      = round_half_up(source.budgeted_capital_brand_cents * CARRYFORWARD_FACTOR)
          carryforward_applied = true
      else:
          # empty-candidate fallback: the last submitted amounts stand unchanged
          carryforward_applied = false
    input_set: "prior fiscal-year budgets of the same agreement in an approved-equivalent status"
    constants:
      CARRYFORWARD_FACTOR: 1.03
    precision: "round_half_up to whole cents per amount"

  - name: variance_approval_routing
    trigger: "on POST /hotel-management/budgets/{id}/variance-requests"
    algorithm: threshold
    formula: |
      baseline_cents = {
          OPERATING:     budget.budgeted_operating_expenses_cents,
          CAPITAL_FFE:   budget.budgeted_capital_ffe_cents,
          CAPITAL_BRAND: budget.budgeted_capital_brand_cents,
      }[category]

      # ORDER-SENSITIVE: earlier approved variances on the same budget and category
      # raise the baseline for this one. Ordering key is created_at ASC.
      cumulative_approved_cents = sum(v.requested_amount_cents for v in VarianceRequest
                                      where v.budget_id == this.budget_id
                                        and v.category == this.category
                                        and v.status in {AUTO_APPROVED, APPROVED}
                                        and v.created_at < this.created_at)

      effective_baseline_cents = baseline_cents + cumulative_approved_cents
      if effective_baseline_cents <= 0: reject with ERR_VARIANCE_BASELINE_ZERO

      variance_pct = round(requested_amount_cents / effective_baseline_cents, 6)

      if variance_pct <= 0.05 and requested_amount_cents <= MANAGER_DISCRETION_CAP_CENTS:
          approval_level = MANAGER_DISCRETION ; status = AUTO_APPROVED
      elif variance_pct <= 0.15 and requested_amount_cents <= ASSET_MANAGER_CAP_CENTS:
          approval_level = ASSET_MANAGER ; status = PENDING
      else:
          approval_level = OWNER_REP ; status = PENDING
    input_set: "sibling VarianceRequest rows on the same budget_id and category with status in {AUTO_APPROVED, APPROVED} and created_at strictly earlier than this row"
    constants:
      MANAGER_DISCRETION_CAP_CENTS: 2500000
      ASSET_MANAGER_CAP_CENTS: 25000000
      TIER1_PCT_INCLUSIVE: 0.05
      TIER2_PCT_INCLUSIVE: 0.15
    precision: "variance_pct rounded to 6 decimal places before the two inclusive comparisons; both tier tests are <= so a ratio of exactly 0.05 stays MANAGER_DISCRETION"

  - name: cash_distribution_waterfall
    trigger: "on the financial_status SUBMITTED -> ACCEPTED transition of MonthlyReportPackage, once the package's accruals are INVOICED"
    algorithm: waterfall_allocation
    formula: |
      available = package.closing_cash_available_cents

      # bucket demands, all computed before any allocation
      wc_gap_cents      = max(0, agreement.working_capital_floor_cents - agreement.working_capital_balance_cents)
      base_due_cents    = sum(a.amount_cents for a in package accruals where fee_type == BASE      and status == INVOICED)
      reserve_due_cents = round_half_up(package.gross_revenue_cents * agreement.ffe_reserve_pct)
      priority_due_cents= round_half_up(agreement.owner_priority_cents / 12)
      incent_due_cents  = sum(a.amount_cents for a in package accruals where fee_type == INCENTIVE and variant == PROVISIONAL and status == INVOICED)

      # fixed bucket order; each bucket takes min(remaining, its demand)
      wc_restoration_cents      = min(available, wc_gap_cents)                 ; available -= wc_restoration_cents
      base_fee_paid_cents       = min(available, base_due_cents)               ; available -= base_fee_paid_cents
      reserve_contribution_cents= min(available, reserve_due_cents)            ; available -= reserve_contribution_cents
      owner_priority_paid_cents = min(available, priority_due_cents)           ; available -= owner_priority_paid_cents
      incentive_fee_paid_cents  = min(available, incent_due_cents)             ; available -= incentive_fee_paid_cents
      residual_to_owner_cents   = available

      shortfall_cents = (wc_gap_cents + base_due_cents + reserve_due_cents + priority_due_cents + incent_due_cents)
                      - (wc_restoration_cents + base_fee_paid_cents + reserve_contribution_cents
                         + owner_priority_paid_cents + incentive_fee_paid_cents)
    input_set: "only INVOICED accruals of this package; DISPUTED_HELD and REVERSED accruals contribute nothing to any bucket demand, and CENTRALIZED_SERVICES accruals are settled outside the waterfall"
    constants:
      BUCKET_ORDER: "[WC_RESTORATION, BASE_FEE, FFE_RESERVE, OWNER_PRIORITY, INCENTIVE_FEE, RESIDUAL]"
    precision: "integer cents throughout; reserve and priority demands round_half_up before allocation"

  - name: reserve_ledger_running_balance
    trigger: "on every ReserveLedgerEntry append (distribution execution, brand-dispute funding, brand-dispute rescission)"
    algorithm: chronological
    formula: |
      prior_entries = ReserveLedgerEntry rows of the agreement with created_at < this.created_at,
                      ordered created_at ASC
      balance_after_cents = sum(e.amount_cents for e in prior_entries) + this.amount_cents

      # conservation invariant, asserted after every append
      agreement.ffe_reserve_balance_cents == sum(e.amount_cents for e in all entries of the agreement)
    input_set: "all ReserveLedgerEntry rows of the agreement in created_at ASC order; the ledger is append-only and entries are never mutated"
    constants: {}
    precision: "integer cents; signed amounts"

  - name: performance_test_evaluation
    trigger: "on POST /hotel-management/agreements/{id}/performance-tests"
    algorithm: weighted_scoring
    formula: |
      accepted = MonthlyReportPackage rows of the agreement with
                 fiscal_year == request.fiscal_year and financial_status == ACCEPTED
      accepted_period_count = count(accepted)
      if accepted_period_count == 0: reject with ERR_NO_ACCEPTED_PERIODS

      # budget selection: eligibility filter, ranking, tie-break, empty fallback
      cands = OperatingBudget rows of the agreement with fiscal_year == request.fiscal_year
              and status in {APPROVED, DEEMED_APPROVED, DEADLOCK_CARRYFORWARD}
      if cands is empty: reject with ERR_BUDGET_NOT_APPROVED
      budget = cands sorted by (revision_round DESC, created_at DESC)[0]
      budgeted_agop_snapshot_cents = budget.budgeted_agop_cents
      budget_source_status = budget.status

      prorated_budget_agop_cents = round_half_up(
          budgeted_agop_snapshot_cents * accepted_period_count / agreement.test_periods_expected)
      if prorated_budget_agop_cents <= 0: reject with ERR_BUDGET_AGOP_NON_POSITIVE

      actual_agop_cents   = sum(p.agop_cents for p in accepted)
      gop_achievement_pct = round(actual_agop_cents / prorated_budget_agop_cents, 4)

      # benchmark input set: STR_REPORT only, non-superseded, on accepted periods
      # whose benchmark_status == ACCEPTED
      rows = [b for b in MarketBenchmark
              if b.report_package_id in accepted
              and b.source == STR_REPORT and b.superseded == false
              and package(b).benchmark_status == ACCEPTED]
      str_month_count = count(rows)
      if str_month_count < agreement.min_benchmark_months:
          reject with ERR_INSUFFICIENT_BENCHMARK_DATA

      # SCORING index is rooms-weighted over the whole set
      rpi_weighted = round(100 * sum(b.hotel_revpar_cents * b.rooms_available for b in rows)
                               / sum(b.comp_set_revpar_cents * b.rooms_available for b in rows), 2)
      # DISCLOSED-ONLY index, never used for scoring
      rpi_simple_average = round(sum(b.rpi for b in rows) / str_month_count, 2)

      failed = (gop_achievement_pct <  agreement.gop_test_threshold_pct) and \
               (rpi_weighted        <  agreement.rpi_test_threshold)
      # both tests must fail; a value exactly equal to either threshold passes that leg

      if not failed:
          status = PASSED ; streak_after_test = 0 ; cure_payment_due_cents = 0
      else:
          streak_after_test = agreement.performance_failure_streak + 1
          cure_payment_due_cents = max(0, prorated_budget_agop_cents - actual_agop_cents)
          if streak_after_test >= agreement.consecutive_failure_limit:
              status = TERMINATION_TRIGGERED ; cure_deadline_utc = null
          else:
              status = FAILED_CURABLE
              cure_deadline_utc = current_clock + agreement.cure_window_days
    input_set: "packages with financial_status == ACCEPTED for the tested fiscal year; benchmarks limited to non-superseded STR_REPORT rows on those packages whose benchmark_status == ACCEPTED (MANAGER_ESTIMATE rows and CHALLENGED months are excluded from both the count and the index)"
    constants: {}
    precision: "gop_achievement_pct to 4 decimal places, both indices to 2 decimal places, all comparisons strict <"
    variants:
      - name: rpi_rooms_weighted
        when: "scoring the performance test"
        difference: "weights each month by rooms_available, so a strong month with more available room-nights lifts the annual index"
      - name: rpi_simple_average
        when: "disclosed on the test row and mirrored by MonthlyReportPackage.reported_rpi"
        difference: "treats every month equally, producing a different index from the identical benchmark rows whenever rooms_available varies across months; it is reported but MUST NOT decide the test"

  - name: employment_claim_liability_split
    trigger: "on POST /hotel-management/employment-claims/{id}/allocation with action ALLOCATE"
    algorithm: constraint_propagation
    formula: |
      claim = claim_amount_cents
      if gross_negligence == true:
          manager_share_cents = min(claim, agreement.manager_indemnity_cap_cents)
      elif agreement.employee_model == OWNER_EMPLOYEES:
          manager_share_cents = 0
      elif position_class in {GM, EXEC_COMMITTEE}:
          # 50/50 with the odd cent to the owner, then the indemnity cap applies
          manager_share_cents = min(claim // 2, agreement.manager_indemnity_cap_cents)
      else:   # MANAGER_EMPLOYEES, LINE_STAFF
          manager_share_cents = 0

      owner_share_cents = claim - manager_share_cents
      # conservation invariant
      owner_share_cents + manager_share_cents == claim_amount_cents
    input_set: "this claim row plus the agreement's employee_model and manager_indemnity_cap_cents as of the allocation instant"
    constants: {}
    precision: "integer cents; claim // 2 is floor division so the odd cent lands on the owner"
    variants:
      - name: negligence_override
        when: "gross_negligence == true"
        difference: "the position class and employee model are ignored; the manager bears the claim up to the indemnity cap regardless of who employs the claimant"

# ---------------------------------------------------------------------------
# §1.4 Validation Rules Table (ordered by priority)
# ---------------------------------------------------------------------------

validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present and X-User-Role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all
  - priority: 2
    category: auth
    check: "the acting role appears in the endpoint's roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: all
  - priority: 3
    category: business_constraint
    check: "request body carries every required field with the declared type"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all POST endpoints"
  - priority: 4
    category: business_constraint
    check: "every enum-typed field value is a member of its declared constraint set"
    error_id: ERR_INVALID_ENUM
    http_status: 400
    applies_to: "all POST endpoints carrying enum inputs"
  - priority: 5
    category: business_constraint
    check: "limit is between 1 and 100 and offset is >= 0"
    error_id: ERR_INVALID_PAGINATION
    http_status: 400
    applies_to: "GET /hotel-management/budgets"
  - priority: 6
    category: existence
    check: "the agreement in the path exists"
    error_id: ERR_AGREEMENT_NOT_FOUND
    http_status: 404
    applies_to: "every /agreements/{id}/... endpoint"
  - priority: 7
    category: existence
    check: "the budget in the path exists"
    error_id: ERR_BUDGET_NOT_FOUND
    http_status: 404
    applies_to: "every /budgets/{id}/... endpoint"
  - priority: 8
    category: existence
    check: "the report package in the path exists"
    error_id: ERR_PACKAGE_NOT_FOUND
    http_status: 404
    applies_to: "every /report-packages/{id}/... endpoint"
  - priority: 9
    category: existence
    check: "the variance request in the path exists"
    error_id: ERR_VARIANCE_NOT_FOUND
    http_status: 404
    applies_to: "POST /hotel-management/variance-requests/{id}/decision"
  - priority: 10
    category: existence
    check: "the centralized service charge in the path exists"
    error_id: ERR_CHARGE_NOT_FOUND
    http_status: 404
    applies_to: "POST /hotel-management/centralized-charges/{id}/review"
  - priority: 11
    category: existence
    check: "the distribution in the path exists"
    error_id: ERR_DISTRIBUTION_NOT_FOUND
    http_status: 404
    applies_to: "POST /hotel-management/distributions/{id}/execute"
  - priority: 12
    category: existence
    check: "the working capital call in the path exists"
    error_id: ERR_CALL_NOT_FOUND
    http_status: 404
    applies_to: "POST /hotel-management/working-capital-calls/{id}/fund"
  - priority: 13
    category: existence
    check: "the performance test in the path exists"
    error_id: ERR_TEST_NOT_FOUND
    http_status: 404
    applies_to: "POST /hotel-management/performance-tests/{id}/cure and .../terminate"
  - priority: 14
    category: existence
    check: "the brand standard dispute in the path exists"
    error_id: ERR_DISPUTE_NOT_FOUND
    http_status: 404
    applies_to: "POST /hotel-management/brand-disputes/{id}/rounds"
  - priority: 15
    category: existence
    check: "the employment claim in the path exists"
    error_id: ERR_CLAIM_NOT_FOUND
    http_status: 404
    applies_to: "POST /hotel-management/employment-claims/{id}/allocation"
  - priority: 16
    category: business_referential
    check: "when supersedes_budget_id is present it names a budget of the same agreement and fiscal_year whose status is in {DRAFT, SUBMITTED, REVISION_REQUESTED}"
    error_id: ERR_SUPERSEDE_TARGET_INVALID
    http_status: 422
    applies_to: "POST /hotel-management/agreements/{id}/budgets"
  - priority: 17
    category: state
    check: "expected_agreement_version equals the agreement's current version"
    error_id: ERR_STALE_AGREEMENT_VERSION
    http_status: 412
    applies_to: "POST /hotel-management/agreements/{id}/budgets, POST /hotel-management/agreements/{id}/annual-true-up"
  - priority: 18
    category: state
    check: "the agreement is ACTIVE"
    error_id: ERR_AGREEMENT_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /agreements/{id}/budgets, POST /budgets/{id}/submit, POST /budgets/{id}/decision, POST /budgets/{id}/variance-requests, POST /variance-requests/{id}/decision, POST /agreements/{id}/report-packages, POST /report-packages/{id}/submit, POST /report-packages/{id}/benchmarks, POST /report-packages/{id}/centralized-charges, POST /agreements/{id}/working-capital-calls, POST /agreements/{id}/brand-disputes, POST /agreements/{id}/annual-true-up"
  - priority: 19
    category: state
    check: "the agreement's distribution_hold is false"
    error_id: ERR_DISTRIBUTION_ON_HOLD
    http_status: 409
    applies_to: "POST /hotel-management/distributions/{id}/execute"
  - priority: 20
    category: state
    check: "the budget is in a state the requested transition declares as `from`"
    error_id: ERR_INVALID_BUDGET_STATE
    http_status: 409
    applies_to: "POST /hotel-management/budgets/{id}/submit, POST /hotel-management/budgets/{id}/decision"
  - priority: 21
    category: state
    check: "the package's financial_status is in a state the requested financial transition declares as `from`"
    error_id: ERR_INVALID_PACKAGE_STATE
    http_status: 409
    applies_to: "POST /hotel-management/report-packages/{id}/submit, POST /hotel-management/report-packages/{id}/owner-review with dimension FINANCIAL"
  - priority: 22
    category: state
    check: "the package's benchmark_status is in a state the requested benchmark transition declares as `from`"
    error_id: ERR_INVALID_BENCHMARK_STATE
    http_status: 409
    applies_to: "POST /hotel-management/report-packages/{id}/benchmarks, POST /hotel-management/report-packages/{id}/owner-review with dimension BENCHMARK"
  - priority: 23
    category: state
    check: "the variance request is PENDING"
    error_id: ERR_INVALID_VARIANCE_STATE
    http_status: 409
    applies_to: "POST /hotel-management/variance-requests/{id}/decision"
  - priority: 24
    category: state
    check: "the distribution is CALCULATED"
    error_id: ERR_INVALID_DISTRIBUTION_STATE
    http_status: 409
    applies_to: "POST /hotel-management/distributions/{id}/execute"
  - priority: 25
    category: state
    check: "the working capital call is REQUESTED or OVERDUE"
    error_id: ERR_INVALID_CALL_STATE
    http_status: 409
    applies_to: "POST /hotel-management/working-capital-calls/{id}/fund"
  - priority: 26
    category: state
    check: "the performance test is in a state the requested cure or termination transition declares as `from`"
    error_id: ERR_INVALID_TEST_STATE
    http_status: 409
    applies_to: "POST /hotel-management/performance-tests/{id}/cure, POST /hotel-management/performance-tests/{id}/terminate"
  - priority: 27
    category: state
    check: "the brand standard dispute is in a state the requested action declares as `from`"
    error_id: ERR_INVALID_DISPUTE_STATE
    http_status: 409
    applies_to: "POST /hotel-management/brand-disputes/{id}/rounds"
  - priority: 28
    category: state
    check: "the employment claim is in a state the requested allocation action declares as `from`"
    error_id: ERR_INVALID_CLAIM_STATE
    http_status: 409
    applies_to: "POST /hotel-management/employment-claims/{id}/allocation"
  - priority: 29
    category: state
    check: "the centralized service charge is in a state the requested review action declares as `from`"
    error_id: ERR_INVALID_CHARGE_STATE
    http_status: 409
    applies_to: "POST /hotel-management/centralized-charges/{id}/review"
  - priority: 30
    category: business_safety
    check: "the acting X-User-ID differs from the X-User-ID that submitted the budget or raised the variance request"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /hotel-management/budgets/{id}/decision, POST /hotel-management/variance-requests/{id}/decision"
  - priority: 31
    category: business_safety
    check: "the acting role's authority covers the row's approval_level (AssetManager covers ASSET_MANAGER; OwnerRep covers ASSET_MANAGER and OWNER_REP)"
    error_id: ERR_APPROVAL_AUTHORITY_INSUFFICIENT
    http_status: 403
    applies_to: "POST /hotel-management/variance-requests/{id}/decision"
  - priority: 32
    category: business_safety
    check: "the action requested on a multi-action endpoint is permitted for the acting role"
    error_id: ERR_ACTION_ROLE_MISMATCH
    http_status: 403
    applies_to: "POST /hotel-management/brand-disputes/{id}/rounds, POST /hotel-management/centralized-charges/{id}/review"
  - priority: 33
    category: business_temporal
    check: "the logical clock is at or before owner_decision_deadline_utc"
    error_id: ERR_OWNER_DECISION_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /hotel-management/budgets/{id}/decision"
  - priority: 34
    category: business_temporal
    check: "the logical clock is at or before cure_deadline_utc"
    error_id: ERR_CURE_WINDOW_CLOSED
    http_status: 409
    applies_to: "POST /hotel-management/performance-tests/{id}/cure"
  - priority: 35
    category: business_temporal
    check: "the new dispute's half-open remediation window [remediation_start_utc, remediation_deadline_utc) does not overlap the half-open standstill window [standstill_start_utc, standstill_end_utc) of an existing ESCALATED_TO_FRANCHISOR dispute on the same agreement and franchise_requirement_ref; windows that merely touch at an endpoint do not overlap"
    error_id: ERR_DISPUTE_WINDOW_CONFLICT
    http_status: 409
    applies_to: "POST /hotel-management/agreements/{id}/brand-disputes"
  - priority: 36
    category: business_constraint
    check: "no other MonthlyReportPackage of the agreement already occupies the closed month slot (fiscal_year, period_month); adjacent months never collide"
    error_id: ERR_PERIOD_ALREADY_REPORTED
    http_status: 409
    applies_to: "POST /hotel-management/agreements/{id}/report-packages"
  - priority: 37
    category: business_constraint
    check: "the package has no existing CentralizedServiceCharge with the same service_code"
    error_id: ERR_SERVICE_CODE_ALREADY_CHARGED
    http_status: 409
    applies_to: "POST /hotel-management/report-packages/{id}/centralized-charges"
  - priority: 38
    category: business_constraint
    check: "no other budget of the same agreement and fiscal_year already holds status in {APPROVED, DEEMED_APPROVED, DEADLOCK_CARRYFORWARD}"
    error_id: ERR_BUDGET_YEAR_ALREADY_APPROVED
    http_status: 409
    applies_to: "POST /hotel-management/budgets/{id}/decision"
  - priority: 39
    category: business_constraint
    check: "a charge posted with allow_deferral == true also carries supporting_detail_provided == true"
    error_id: ERR_CHARGEBACK_DETAIL_REQUIRED
    http_status: 422
    applies_to: "POST /hotel-management/report-packages/{id}/centralized-charges"
  - priority: 40
    category: business_referential
    check: "an OperatingBudget of the same agreement and fiscal_year holds status in {APPROVED, DEEMED_APPROVED, DEADLOCK_CARRYFORWARD}"
    error_id: ERR_BUDGET_NOT_APPROVED
    http_status: 422
    applies_to: "POST /hotel-management/report-packages/{id}/submit, POST /hotel-management/agreements/{id}/performance-tests"
  - priority: 41
    category: business_referential
    check: "at least one MonthlyReportPackage of the fiscal year has financial_status == ACCEPTED"
    error_id: ERR_NO_ACCEPTED_PERIODS
    http_status: 422
    applies_to: "POST /hotel-management/agreements/{id}/annual-true-up, POST /hotel-management/agreements/{id}/performance-tests"
  - priority: 42
    category: business_referential
    check: "the count of non-superseded STR_REPORT benchmarks on accepted periods whose benchmark_status == ACCEPTED is at least agreement.min_benchmark_months"
    error_id: ERR_INSUFFICIENT_BENCHMARK_DATA
    http_status: 422
    applies_to: "POST /hotel-management/agreements/{id}/performance-tests"
  - priority: 43
    category: business_referential
    check: "no FeeAccrual of the package holds status DISPUTED_HELD"
    error_id: ERR_ACCRUALS_ON_HOLD
    http_status: 409
    applies_to: "POST /hotel-management/distributions/{id}/execute"
  - priority: 44
    category: business_fiscal
    check: "cumulative requested_amount_cents across the package's charges, including the incoming one, is at most floor(gross_revenue_cents * centralized_services_cap_pct) whenever the incoming charge carries allow_deferral == false"
    error_id: ERR_CENTRALIZED_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /hotel-management/report-packages/{id}/centralized-charges"
  - priority: 45
    category: business_fiscal
    check: "payment_amount_cents is at least cure_payment_due_cents"
    error_id: ERR_CURE_PAYMENT_INSUFFICIENT
    http_status: 422
    applies_to: "POST /hotel-management/performance-tests/{id}/cure with action PAY_CURE"
  - priority: 46
    category: business_fiscal
    check: "agreement.ffe_reserve_balance_cents is at least current_cost_estimate_cents when a dispute resolution draws on the reserve"
    error_id: ERR_INSUFFICIENT_RESERVE_BALANCE
    http_status: 422
    applies_to: "POST /hotel-management/brand-disputes/{id}/rounds with action RESOLVE_OWNER_FUNDS and funding_source FFE_RESERVE"
  - priority: 47
    category: business_fiscal
    check: "funded_amount_cents equals the call's amount_cents exactly"
    error_id: ERR_FUNDING_AMOUNT_MISMATCH
    http_status: 422
    applies_to: "POST /hotel-management/working-capital-calls/{id}/fund"
  - priority: 48
    category: business_fiscal
    check: "adjusted_amount_cents is present and between 0 and the charge's allocated_amount_cents inclusive"
    error_id: ERR_ADJUSTMENT_OUT_OF_RANGE
    http_status: 422
    applies_to: "POST /hotel-management/centralized-charges/{id}/review with action ADJUST"
  - priority: 49
    category: business_fiscal
    check: "effective_baseline_cents computed for the variance request is greater than zero"
    error_id: ERR_VARIANCE_BASELINE_ZERO
    http_status: 422
    applies_to: "POST /hotel-management/budgets/{id}/variance-requests"
  - priority: 50
    category: business_fiscal
    check: "prorated_budget_agop_cents computed for the performance test is greater than zero"
    error_id: ERR_BUDGET_AGOP_NON_POSITIVE
    http_status: 422
    applies_to: "POST /hotel-management/agreements/{id}/performance-tests"

# ---------------------------------------------------------------------------
# §1.5 API Endpoint Table
# ---------------------------------------------------------------------------

endpoints:
  - method: POST
    path: "/hotel-management/agreements"
    description: "register a management agreement in DRAFT"
    roles: [PlatformAdmin]
    code: 201
    input: [hotel_name, owner_entity_name, base_fee_pct, incentive_fee_pct, owner_priority_cents,
            "incentive_tier2_pct?", "incentive_tier2_threshold_cents?", "ffe_reserve_pct?",
            "centralized_services_cap_pct?", "working_capital_floor_cents?", "initial_working_capital_cents?",
            "owner_review_window_days?", "max_revision_rounds?", "gop_test_threshold_pct?", "rpi_test_threshold?",
            "min_benchmark_months?", "test_periods_expected?", "consecutive_failure_limit?", "employee_model?",
            "manager_indemnity_cap_cents?", "cure_window_days?", "dispute_standstill_days?", "max_dispute_rounds?",
            "funding_due_days?", "termination_notice_days?"]
    output: ManagementAgreement
    side_effects: ["persists the agreement in DRAFT with all unspecified configuration at its declared default"]
  - method: GET
    path: "/hotel-management/agreements/{id}"
    description: "read one agreement including its computed balances and version"
    roles: [PlatformAdmin, HotelManagerOps, AssetManager, OwnerRep]
    code: 200
    input: []
    output: ManagementAgreement
    side_effects: []
  - method: POST
    path: "/hotel-management/agreements/{id}/activate"
    description: "activate a DRAFT agreement and fund the opening working capital balance"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: ManagementAgreement
    side_effects: ["DRAFT -> ACTIVE", "working_capital_balance_cents set to initial_working_capital_cents", "increments ManagementAgreement.version by 1"]
  - method: POST
    path: "/hotel-management/agreements/{id}/budgets"
    description: "create an annual operating and capital budget revision in DRAFT; optionally supersede an earlier revision"
    roles: [HotelManagerOps]
    code: 201
    input: [fiscal_year, budgeted_revenue_cents, budgeted_operating_expenses_cents, expected_agreement_version,
            "budgeted_capital_ffe_cents?", "budgeted_capital_brand_cents?", "supersedes_budget_id?"]
    output: OperatingBudget
    side_effects:
      - "computes budgeted_base_fee_cents, budgeted_centralized_cents and budgeted_agop_cents per calculation budget_agop_derivation"
      - "when supersedes_budget_id is present, that budget transitions to SUPERSEDED"
      - "increments ManagementAgreement.version by 1"
  - method: GET
    path: "/hotel-management/budgets/{id}"
    description: "read one budget revision"
    roles: [PlatformAdmin, HotelManagerOps, AssetManager, OwnerRep]
    code: 200
    input: []
    output: OperatingBudget
    side_effects: []
  - method: GET
    path: "/hotel-management/budgets"
    description: "list budget revisions, filterable by agreement, superseded target, fiscal year and status"
    roles: [PlatformAdmin, HotelManagerOps, AssetManager, OwnerRep]
    code: 200
    input: ["agreement_id?", "supersedes_budget_id?", "fiscal_year?", "status?", "limit?", "offset?"]
    output: OperatingBudget[]
    side_effects: []
  - method: POST
    path: "/hotel-management/budgets/{id}/submit"
    description: "submit a DRAFT or REVISION_REQUESTED budget for owner decision, optionally with revised amounts"
    roles: [HotelManagerOps]
    code: 200
    input: ["budgeted_revenue_cents?", "budgeted_operating_expenses_cents?", "budgeted_capital_ffe_cents?", "budgeted_capital_brand_cents?"]
    output: OperatingBudget
    side_effects: ["sets submitted_at, submitted_by_user_id and owner_decision_deadline_utc", "recomputes the budgeted_* derived amounts", "increments revision_round when re-submitting from REVISION_REQUESTED"]
  - method: POST
    path: "/hotel-management/budgets/{id}/decision"
    description: "owner approves a submitted budget or requests a revision; the revision-limit branch deadlocks into carry-forward"
    roles: [OwnerRep]
    code: 200
    input: [decision, "note?"]
    output: OperatingBudget
    side_effects: ["SUBMITTED -> APPROVED, REVISION_REQUESTED or DEADLOCK_CARRYFORWARD", "records decided_by_user_id", "rewrites the budgeted amounts per calculation deadlock_carryforward_amounts on the deadlock branch"]
  - method: POST
    path: "/hotel-management/budgets/{id}/variance-requests"
    description: "manager requests spend authority above an approved budget line; manager-discretion tiers are auto-approved"
    roles: [HotelManagerOps]
    code: 201
    input: [category, requested_amount_cents, justification]
    output: VarianceRequest
    side_effects: ["computes effective_baseline_cents, variance_pct and approval_level per calculation variance_approval_routing", "persists status AUTO_APPROVED or PENDING"]
  - method: GET
    path: "/hotel-management/budgets/{id}/variance-requests"
    description: "list variance requests raised against a budget"
    roles: [PlatformAdmin, HotelManagerOps, AssetManager, OwnerRep]
    code: 200
    input: ["category?", "status?", "limit?", "offset?"]
    output: VarianceRequest[]
    side_effects: []
  - method: POST
    path: "/hotel-management/variance-requests/{id}/decision"
    description: "owner-side authority approves or denies a pending variance request"
    roles: [AssetManager, OwnerRep]
    code: 200
    input: [decision, "note?"]
    output: VarianceRequest
    side_effects: ["PENDING -> APPROVED or DENIED", "records decided_by_user_id", "an approval raises the effective_baseline_cents of later requests in the same category"]
  - method: POST
    path: "/hotel-management/agreements/{id}/report-packages"
    description: "open a monthly reporting package for a period with its profit-and-loss inputs"
    roles: [HotelManagerOps]
    code: 201
    input: [fiscal_year, period_month, rooms_revenue_cents, fnb_revenue_cents, other_revenue_cents,
            operating_expenses_cents, closing_cash_available_cents]
    output: MonthlyReportPackage
    side_effects: ["computes gross_revenue_cents and due_date_utc per calculation package_derived_fields", "both status dimensions start at PENDING and package_status at INCOMPLETE"]
  - method: GET
    path: "/hotel-management/agreements/{id}/report-packages"
    description: "list an agreement's monthly reporting packages"
    roles: [PlatformAdmin, HotelManagerOps, AssetManager, OwnerRep]
    code: 200
    input: ["fiscal_year?", "period_month?", "financial_status?", "limit?", "offset?"]
    output: MonthlyReportPackage[]
    side_effects: []
  - method: GET
    path: "/hotel-management/report-packages/{id}"
    description: "read one monthly reporting package including frozen fee and AGOP figures"
    roles: [PlatformAdmin, HotelManagerOps, AssetManager, OwnerRep]
    code: 200
    input: []
    output: MonthlyReportPackage
    side_effects: []
  - method: POST
    path: "/hotel-management/report-packages/{id}/benchmarks"
    description: "post the period's competitive-set benchmark; a replacement is allowed only after the owner challenged the prior one"
    roles: [HotelManagerOps]
    code: 201
    input: [hotel_revpar_cents, comp_set_revpar_cents, rooms_available, source]
    output: MarketBenchmark
    side_effects: ["advances benchmark_status to SUBMITTED", "sets package.reported_rpi", "marks a prior benchmark superseded when replacing a CHALLENGED one", "recomputes package_status"]
  - method: GET
    path: "/hotel-management/report-packages/{id}/benchmarks"
    description: "list the period's benchmark rows including superseded ones"
    roles: [PlatformAdmin, HotelManagerOps, AssetManager, OwnerRep]
    code: 200
    input: ["source?", "superseded?", "limit?", "offset?"]
    output: MarketBenchmark[]
    side_effects: []
  - method: POST
    path: "/hotel-management/report-packages/{id}/centralized-charges"
    description: "post a centralized-services chargeback for the period with its disclosed allocation basis"
    roles: [HotelManagerOps]
    code: 201
    input: [service_code, allocation_basis, pool_amount_cents, hotel_basis_share, "allow_deferral?", "supporting_detail_provided?"]
    output: CentralizedServiceCharge
    side_effects: ["recomputes the package's charge allocation per calculation centralized_services_allocation", "updates package.allocated_centralized_cents"]
  - method: GET
    path: "/hotel-management/report-packages/{id}/centralized-charges"
    description: "list the period's centralized-services chargebacks with allocated and deferred amounts"
    roles: [PlatformAdmin, HotelManagerOps, AssetManager, OwnerRep]
    code: 200
    input: ["service_code?", "disclosure_status?", "limit?", "offset?"]
    output: CentralizedServiceCharge[]
    side_effects: []
  - method: POST
    path: "/hotel-management/centralized-charges/{id}/review"
    description: "owner side contests a chargeback; the manager then reaffirms or adjusts it"
    roles: [AssetManager, HotelManagerOps]
    code: 200
    input: [action, "adjusted_amount_cents?", "note?"]
    output: CentralizedServiceCharge
    side_effects: ["DISCLOSED -> CONTESTED -> DISCLOSED or ADJUSTED", "holds or releases the package's CENTRALIZED_SERVICES accrual", "an adjustment cascades into package AGOP and the INCENTIVE accrual amount"]
  - method: POST
    path: "/hotel-management/report-packages/{id}/submit"
    description: "freeze the period's profit-and-loss, compute the fees and raise the accruals"
    roles: [HotelManagerOps]
    code: 200
    input: []
    output: MonthlyReportPackage
    side_effects: ["financial_status PENDING or DISPUTED -> SUBMITTED", "computes base_fee_cents, agop_cents and incentive_fee_provisional_cents", "creates the ACCRUED FeeAccrual set", "recomputes package_status"]
  - method: POST
    path: "/hotel-management/report-packages/{id}/owner-review"
    description: "owner accepts or disputes one dimension of the package: the profit-and-loss or the market-share benchmark"
    roles: [OwnerRep]
    code: 200
    input: [dimension, decision, "note?"]
    output: MonthlyReportPackage
    side_effects: ["advances the named dimension only", "the FINANCIAL ACCEPT branch invoices the accruals, calculates the distribution and may raise a shortfall working capital call", "the FINANCIAL DISPUTE branch reverses the accruals and creates nothing", "recomputes package_status"]
  - method: GET
    path: "/hotel-management/report-packages/{id}/fee-accruals"
    description: "list the period's fee accruals including reversed and held rows"
    roles: [PlatformAdmin, HotelManagerOps, AssetManager, OwnerRep]
    code: 200
    input: ["fee_type?", "variant?", "status?", "limit?", "offset?"]
    output: FeeAccrual[]
    side_effects: []
  - method: GET
    path: "/hotel-management/report-packages/{id}/distributions"
    description: "list the cash distribution waterfalls calculated for the period"
    roles: [PlatformAdmin, HotelManagerOps, AssetManager, OwnerRep]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: CashDistribution[]
    side_effects: []
  - method: POST
    path: "/hotel-management/distributions/{id}/execute"
    description: "execute a calculated waterfall, moving working capital, fees and the reserve contribution"
    roles: [HotelManagerOps]
    code: 200
    input: []
    output: CashDistribution
    side_effects: ["CALCULATED -> EXECUTED", "credits working capital, pays the invoiced BASE and INCENTIVE accruals, appends the reserve CONTRIBUTION entry", "may extinguish a FLOOR_RESTORATION call as WAIVED_OFFSET"]
  - method: GET
    path: "/hotel-management/agreements/{id}/reserve-ledger"
    description: "list the reserve-for-replacement ledger in append order"
    roles: [PlatformAdmin, HotelManagerOps, AssetManager, OwnerRep]
    code: 200
    input: ["entry_type?", "source_kind?", "limit?", "offset?"]
    output: ReserveLedgerEntry[]
    side_effects: []
  - method: POST
    path: "/hotel-management/agreements/{id}/working-capital-calls"
    description: "manager calls the owner to fund working capital"
    roles: [HotelManagerOps]
    code: 201
    input: [amount_cents, reason]
    output: WorkingCapitalCall
    side_effects: ["sets due_date_utc to the logical clock plus agreement.funding_due_days"]
  - method: GET
    path: "/hotel-management/agreements/{id}/working-capital-calls"
    description: "list the agreement's working capital calls"
    roles: [PlatformAdmin, HotelManagerOps, AssetManager, OwnerRep]
    code: 200
    input: ["status?", "reason?", "limit?", "offset?"]
    output: WorkingCapitalCall[]
    side_effects: []
  - method: POST
    path: "/hotel-management/working-capital-calls/{id}/fund"
    description: "owner funds a working capital call in full"
    roles: [OwnerRep]
    code: 200
    input: [funded_amount_cents]
    output: WorkingCapitalCall
    side_effects: ["REQUESTED or OVERDUE -> FUNDED", "credits agreement.working_capital_balance_cents", "sets late_funded when funding an OVERDUE call"]
  - method: POST
    path: "/hotel-management/agreements/{id}/annual-true-up"
    description: "run the annual incentive-fee true-up for a fiscal year and post the FINAL accrual"
    roles: [HotelManagerOps]
    code: 200
    input: [fiscal_year, expected_agreement_version]
    output: "{ fiscal_year: integer, accepted_period_count: integer, annual_agop_cents: integer, final_incentive_fee_cents: integer, provisional_incentive_total_cents: integer, true_up_delta_cents: integer, true_up_accrual_id: string, attached_report_package_id: string }"
    side_effects: ["reverses any prior FINAL accrual of the fiscal year", "posts a FINAL INCENTIVE accrual carrying true_up_delta_cents against the latest accepted period", "increments ManagementAgreement.version by 1"]
  - method: POST
    path: "/hotel-management/agreements/{id}/performance-tests"
    description: "score the annual performance test against budget and the competitive set"
    roles: [PlatformAdmin]
    code: 201
    input: [fiscal_year]
    output: PerformanceTest
    side_effects: ["scores per calculation performance_test_evaluation", "a curable failure drives the agreement into CURE_PERIOD and holds the calculated distributions", "a repeat failure lands in TERMINATION_TRIGGERED without a cure right"]
  - method: GET
    path: "/hotel-management/agreements/{id}/performance-tests"
    description: "list the agreement's scored performance tests"
    roles: [PlatformAdmin, HotelManagerOps, AssetManager, OwnerRep]
    code: 200
    input: ["fiscal_year?", "status?", "limit?", "offset?"]
    output: PerformanceTest[]
    side_effects: []
  - method: POST
    path: "/hotel-management/performance-tests/{id}/cure"
    description: "manager elects and then pays the cure amount for a curable failure"
    roles: [HotelManagerOps]
    code: 200
    input: [action, "payment_amount_cents?"]
    output: PerformanceTest
    side_effects: ["FAILED_CURABLE -> CURE_ELECTED -> CURED", "a sufficient payment returns the agreement to ACTIVE and releases the held distributions"]
  - method: POST
    path: "/hotel-management/performance-tests/{id}/terminate"
    description: "owner issues a termination notice on a triggered performance test"
    roles: [OwnerRep]
    code: 200
    input: ["reason?"]
    output: PerformanceTest
    side_effects: ["TERMINATION_TRIGGERED -> TERMINATED_NOTICE_ISSUED", "agreement -> TERMINATION_NOTICED with the pending-variance and submitted-budget cascade"]
  - method: POST
    path: "/hotel-management/agreements/{id}/brand-disputes"
    description: "owner side opens a brand standard cost dispute for a franchisor requirement"
    roles: [AssetManager]
    code: 201
    input: [franchise_requirement_ref, estimated_cost_cents, remediation_start_utc, remediation_deadline_utc]
    output: BrandStandardDispute
    side_effects: ["persists the dispute in OPENED with current_cost_estimate_cents set to estimated_cost_cents"]
  - method: GET
    path: "/hotel-management/agreements/{id}/brand-disputes"
    description: "list the agreement's brand standard cost disputes"
    roles: [PlatformAdmin, HotelManagerOps, AssetManager, OwnerRep]
    code: 200
    input: ["status?", "franchise_requirement_ref?", "limit?", "offset?"]
    output: BrandStandardDispute[]
    side_effects: []
  - method: POST
    path: "/hotel-management/brand-disputes/{id}/rounds"
    description: "advance a brand standard dispute: manager response, owner counter, escalation, resolution or rescission"
    roles: [HotelManagerOps, AssetManager, OwnerRep]
    code: 200
    input: [action, "cost_estimate_cents?", "funding_source?", "note?"]
    output: BrandStandardDispute
    side_effects: ["cycles MANAGER_RESPONDED and OWNER_COUNTERED", "escalation opens the standstill window", "a reserve-funded resolution appends a DISBURSEMENT entry and a rescission appends the offsetting DISBURSEMENT_REVERSAL"]
  - method: POST
    path: "/hotel-management/agreements/{id}/employment-claims"
    description: "file an employment claim against the hotel's personnel"
    roles: [HotelManagerOps]
    code: 201
    input: [position_class, claim_amount_cents, "gross_negligence?"]
    output: EmploymentClaim
    side_effects: ["copies agreement.employee_model into employer_of_record", "persists the claim in FILED with both shares at 0"]
  - method: GET
    path: "/hotel-management/agreements/{id}/employment-claims"
    description: "list the agreement's employment claims with their liability split"
    roles: [PlatformAdmin, HotelManagerOps, AssetManager, OwnerRep]
    code: 200
    input: ["status?", "position_class?", "limit?", "offset?"]
    output: EmploymentClaim[]
    side_effects: []
  - method: POST
    path: "/hotel-management/employment-claims/{id}/allocation"
    description: "allocate an employment claim between owner and manager, or reverse a prior allocation"
    roles: [AssetManager]
    code: 200
    input: [action]
    output: EmploymentClaim
    side_effects: ["splits the claim per calculation employment_claim_liability_split", "moves working_capital_balance_cents and manager_liability_accrued_cents", "may raise a CLAIM_ALLOCATION working capital call", "REVERSE restores both balances exactly"]
  - method: POST
    path: "/_clock/set_current_utc"
    description: "set the server's logical clock; before any call the clock reads exactly 2026-08-01T00:00:00Z and never falls back to real wall-clock time. Advancing the clock runs the epoch sweep in this fixed order: (1) SUBMITTED budgets past owner_decision_deadline_utc become DEEMED_APPROVED, (2) REQUESTED working capital calls past due_date_utc become OVERDUE, (3) FAILED_CURABLE and CURE_ELECTED performance tests past cure_deadline_utc become TERMINATION_TRIGGERED, (4) ESCALATED_TO_FRANCHISOR disputes at or past standstill_end_utc become DEADLOCKED, (5) TERMINATION_NOTICED agreements at or past termination_effective_utc become TERMINATED. Each step processes its rows in created_at ASC order."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string, deemed_approved_budget_count: integer, overdue_call_count: integer, lapsed_cure_count: integer, deadlocked_dispute_count: integer, terminated_agreement_count: integer }"
    side_effects: ["runs the five-step epoch sweep described above"]

# ---------------------------------------------------------------------------
# §1.6 Error Code Catalog
# ---------------------------------------------------------------------------

errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing, or the role is not one of the four declared roles"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the acting role is not listed on the endpoint"
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "a required body field is absent or carries the wrong type"
  - id: ERR_INVALID_ENUM
    http: 400
    condition: "an enum-typed field carries a value outside its declared set"
  - id: ERR_INVALID_PAGINATION
    http: 400
    condition: "limit outside 1..100 or offset negative on GET /hotel-management/budgets"
  - id: ERR_AGREEMENT_NOT_FOUND
    http: 404
    condition: "the agreement id in the path matches no agreement"
  - id: ERR_BUDGET_NOT_FOUND
    http: 404
    condition: "the budget id in the path matches no budget"
  - id: ERR_PACKAGE_NOT_FOUND
    http: 404
    condition: "the report package id in the path matches no package"
  - id: ERR_VARIANCE_NOT_FOUND
    http: 404
    condition: "the variance request id in the path matches no request"
  - id: ERR_CHARGE_NOT_FOUND
    http: 404
    condition: "the centralized service charge id in the path matches no charge"
  - id: ERR_DISTRIBUTION_NOT_FOUND
    http: 404
    condition: "the distribution id in the path matches no distribution"
  - id: ERR_CALL_NOT_FOUND
    http: 404
    condition: "the working capital call id in the path matches no call"
  - id: ERR_TEST_NOT_FOUND
    http: 404
    condition: "the performance test id in the path matches no test"
  - id: ERR_DISPUTE_NOT_FOUND
    http: 404
    condition: "the brand standard dispute id in the path matches no dispute"
  - id: ERR_CLAIM_NOT_FOUND
    http: 404
    condition: "the employment claim id in the path matches no claim"
  - id: ERR_SUPERSEDE_TARGET_INVALID
    http: 422
    condition: "supersedes_budget_id names a budget of another agreement or fiscal year, or one already in a terminal status"
  - id: ERR_STALE_AGREEMENT_VERSION
    http: 412
    condition: "expected_agreement_version does not match the agreement's current version"
  - id: ERR_AGREEMENT_NOT_ACTIVE
    http: 409
    condition: "an operational write is attempted while the agreement is DRAFT, CURE_PERIOD, TERMINATION_NOTICED or TERMINATED"
  - id: ERR_DISTRIBUTION_ON_HOLD
    http: 409
    condition: "distribution execution is attempted while the agreement's distribution_hold is true"
  - id: ERR_INVALID_BUDGET_STATE
    http: 409
    condition: "the budget's status does not permit the requested submit or decision"
  - id: ERR_INVALID_PACKAGE_STATE
    http: 409
    condition: "the package's financial_status does not permit the requested submit or financial review"
  - id: ERR_INVALID_BENCHMARK_STATE
    http: 409
    condition: "the package's benchmark_status does not permit the requested benchmark post or benchmark review"
  - id: ERR_INVALID_VARIANCE_STATE
    http: 409
    condition: "a decision is attempted on a variance request that is not PENDING"
  - id: ERR_INVALID_DISTRIBUTION_STATE
    http: 409
    condition: "execution is attempted on a distribution that is HELD or already EXECUTED"
  - id: ERR_INVALID_CALL_STATE
    http: 409
    condition: "funding is attempted on a call that is already FUNDED or WAIVED_OFFSET"
  - id: ERR_INVALID_TEST_STATE
    http: 409
    condition: "the performance test's status does not permit the requested cure action or termination"
  - id: ERR_INVALID_DISPUTE_STATE
    http: 409
    condition: "the dispute's status does not permit the requested round action"
  - id: ERR_INVALID_CLAIM_STATE
    http: 409
    condition: "the claim's status does not permit the requested allocation action"
  - id: ERR_INVALID_CHARGE_STATE
    http: 409
    condition: "the charge's disclosure_status does not permit the requested review action"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the deciding X-User-ID equals the X-User-ID that submitted the budget or raised the variance request"
  - id: ERR_APPROVAL_AUTHORITY_INSUFFICIENT
    http: 403
    condition: "an AssetManager decides a variance request whose approval_level is OWNER_REP"
  - id: ERR_ACTION_ROLE_MISMATCH
    http: 403
    condition: "the acting role may call the endpoint but not the specific action requested"
  - id: ERR_OWNER_DECISION_WINDOW_CLOSED
    http: 409
    condition: "a budget decision is attempted after owner_decision_deadline_utc"
  - id: ERR_CURE_WINDOW_CLOSED
    http: 409
    condition: "a cure election or payment is attempted after cure_deadline_utc"
  - id: ERR_DISPUTE_WINDOW_CONFLICT
    http: 409
    condition: "the new dispute's remediation window overlaps the standstill window of an escalated dispute on the same requirement"
  - id: ERR_PERIOD_ALREADY_REPORTED
    http: 409
    condition: "a package already exists for the agreement's (fiscal_year, period_month) slot"
  - id: ERR_SERVICE_CODE_ALREADY_CHARGED
    http: 409
    condition: "the package already carries a charge with the same service_code"
  - id: ERR_BUDGET_YEAR_ALREADY_APPROVED
    http: 409
    condition: "another budget of the same agreement and fiscal year already holds an approved-equivalent status"
  - id: ERR_CHARGEBACK_DETAIL_REQUIRED
    http: 422
    condition: "allow_deferral is true while supporting_detail_provided is false"
  - id: ERR_BUDGET_NOT_APPROVED
    http: 422
    condition: "no approved-equivalent budget exists for the agreement and fiscal year"
  - id: ERR_NO_ACCEPTED_PERIODS
    http: 422
    condition: "the fiscal year has no package with financial_status ACCEPTED"
  - id: ERR_INSUFFICIENT_BENCHMARK_DATA
    http: 422
    condition: "fewer accepted STR_REPORT benchmark months than agreement.min_benchmark_months"
  - id: ERR_ACCRUALS_ON_HOLD
    http: 409
    condition: "the package carries a FeeAccrual in DISPUTED_HELD when execution is attempted"
  - id: ERR_CENTRALIZED_CAP_EXCEEDED
    http: 422
    condition: "a non-deferrable chargeback would push cumulative requested amounts past the period cap"
  - id: ERR_CURE_PAYMENT_INSUFFICIENT
    http: 422
    condition: "payment_amount_cents is below cure_payment_due_cents"
  - id: ERR_INSUFFICIENT_RESERVE_BALANCE
    http: 422
    condition: "a reserve-funded dispute resolution exceeds ffe_reserve_balance_cents"
  - id: ERR_FUNDING_AMOUNT_MISMATCH
    http: 422
    condition: "funded_amount_cents differs from the call's amount_cents"
  - id: ERR_ADJUSTMENT_OUT_OF_RANGE
    http: 422
    condition: "adjusted_amount_cents is absent, negative, or above the charge's allocated_amount_cents"
  - id: ERR_VARIANCE_BASELINE_ZERO
    http: 422
    condition: "the variance category's effective baseline is zero, so no ratio is defined"
  - id: ERR_BUDGET_AGOP_NON_POSITIVE
    http: 422
    condition: "the pro-rated budgeted AGOP is zero or negative, so no achievement ratio is defined"

# ---------------------------------------------------------------------------
# §1.7 RBAC Matrix
# ---------------------------------------------------------------------------

roles:
  - name: PlatformAdmin
    description: "operator of the reporting platform; onboards agreements, advances the logical clock and scores performance tests"
    identity: opaque
    exclusive_operations:
      - "POST /hotel-management/agreements"
      - "POST /hotel-management/agreements/{id}/activate"
      - "POST /hotel-management/agreements/{id}/performance-tests"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "all GET endpoints"
  - name: HotelManagerOps
    description: "the third-party management company's on-property and above-property finance team"
    identity: opaque
    exclusive_operations:
      - "POST /hotel-management/agreements/{id}/budgets"
      - "POST /hotel-management/budgets/{id}/submit"
