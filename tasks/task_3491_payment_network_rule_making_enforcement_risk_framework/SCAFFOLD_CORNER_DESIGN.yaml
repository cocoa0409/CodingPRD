            - call: "POST /network/originators/${o1}/transition"
              payload: { to_state: "APPROVED" }
              as: ParticipantOfficer
              as_user_id: "${p1}"
            - call: "POST /network/payment-entries"
              payload: { originator_id: "${o1}", transaction_code_id: "${tc_ppd}", amount_cents: 5000, receiver_account_number_hash: "self-1", receiver_name: "R", authorization_type: "NONE", same_day: false }
              as: ParticipantOfficer
              as_user_id: "${p1}"
              captures: { e1: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T18:00:00Z" }
              as: PlatformAdmin
            - call: "POST /network/settlement-windows/${w1}/run-settlement"
              payload: {}
              as: PlatformAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-02T10:00:00Z" }
              as: PlatformAdmin
