      - name: cold_chain_rejection_cascades_four_levels_and_credits_the_fee
        grounds:
          - calculations.shipment_integrity_verdict
          - endpoints."POST /eye-bank/shipments/{id}/deliver"
          - state_machines.Shipment.status
          - state_machines.Allocation.status
          - calculations.surgeon_fee_ledger
        distinguishing_aspect: |
          A second, structurally different cascade rooted in a CALCULATION rather than an
          adjudication: the delivery verdict EXCURSION_MAJOR drives shipment ->
          REJECTED_ON_ARRIVAL, both tissue dimensions (custody RETURNED_TO_BANK, disposition
          QUARANTINED), the allocation CONFIRMED -> RELEASED, the request back to OPEN, and the
          money ledger compensation in ONE call. The excursion duration is measured from the
          reading BEFORE the out-of-range run, so a single 15.0 C sample at 11:00 costs 60 minutes.
        test_recipe:
