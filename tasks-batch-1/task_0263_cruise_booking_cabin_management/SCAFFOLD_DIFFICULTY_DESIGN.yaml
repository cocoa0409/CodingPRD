            - "response data.error_id == ERR_NOT_FOUND (no folio exists for a CONFIRMED, not-yet-embarked booking)"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: excursion_halfopen_overlap_on_guest_touching_allowed
        grounds:
          - validations[priority=8]
          - entities.AddOn.fields.window_start
          - entities.AddOn.fields.window_end
          - errors[ERR_TIME_WINDOW_CONFLICT]
        distinguishing_aspect: |
          Excursion overlap on a Guest uses half-open intervals [start, end): a second excursion starting
          exactly when the first ends (10:00-12:00 then 12:00-14:00) does NOT conflict, but 11:00-13:00 DOES.
          Interval semantics: half-open, adjacency allowed; resource entity: Guest (via AddOn.guest_id).
        test_recipe:
          setup:
            - "A QUOTE booking with 1 guest, holding one RESERVED EXCURSION 10:00-12:00 on that guest."
          setup_api_calls:
            - call: "POST /sailings"
              payload: { ship_name: "Aurora", itinerary_code: "WCAR7N", embark_date: "2026-09-01T16:00:00Z", disembark_date: "2026-09-08T16:00:00Z", nights: 7 }
              as: RevenueManager
              captures: { s_id: $.data.id }
            - call: "POST /cabin-categories"
              payload: { sailing_id: "${s_id}", code: "BALCONY", deck_low: 8, deck_high: 10, base_fare_per_guest_cents: 119900, max_occupancy: 4 }
              as: RevenueManager
              captures: { cc_id: $.data.id }
            - call: "POST /cabins"
              payload: { cabin_category_id: "${cc_id}", cabin_number: "8001", deck: 8 }
              as: RevenueManager
            - call: "POST /sailings/${s_id}/open"
              payload: {}
              as: RevenueManager
              captures: { s_v: $.data.version }
            - call: "POST /bookings"
              payload: { sailing_id: "${s_id}", cabin_category_id: "${cc_id}", owner_user_id: "guest-13", expected_sailing_version: "${s_v}" }
              as: GuestUser
              as_user_id: "guest-13"
              captures: { b_id: $.data.id }
            - call: "POST /guests"
              payload: { booking_id: "${b_id}", full_name: "N One", age: 40 }
              as: GuestUser
              as_user_id: "guest-13"
              captures: { g_id: $.data.id }
            - call: "POST /add-ons"
              payload: { booking_id: "${b_id}", guest_id: "${g_id}", kind: "EXCURSION", title: "Snorkel", price_cents: 12000, window_start: "2026-09-02T10:00:00Z", window_end: "2026-09-02T12:00:00Z" }
              as: GuestUser
              as_user_id: "guest-13"
          trigger:
            - call: "POST /add-ons"
              payload: { booking_id: "${b_id}", guest_id: "${g_id}", kind: "EXCURSION", title: "Reef Tour", price_cents: 9000, window_start: "2026-09-02T11:00:00Z", window_end: "2026-09-02T13:00:00Z" }
              as: GuestUser
              as_user_id: "guest-13"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response data.error_id == ERR_TIME_WINDOW_CONFLICT"
            - "A separate 12:00-14:00 excursion on the same guest would succeed (touching endpoint, half-open, no conflict)"

      - name: dining_buffer_overlap_on_booking_touching_conflicts
        grounds:
          - validations[priority=8]
          - entities.DiningReservation.fields.seating_start
          - entities.DiningReservation.fields.venue_code
          - errors[ERR_TIME_WINDOW_CONFLICT]
        distinguishing_aspect: |
          Dining seatings on a Booking use a buffer-expanded interval (DINING_TURNOVER_MINUTES = 90):
          two seatings 18:00 and 19:00 collide because they are within 90 minutes, whereas a 20:00 seating
          (>= 90 min after 18:00) would not. Interval semantics: closed + turnover buffer (touching within
          buffer conflicts); resource entity: DiningReservation/Booking — distinct from the half-open
          excursion-on-guest rule.
        test_recipe:
          setup:
            - "A QUOTE booking with 2 guests, holding one BOOKED dining seating at 18:00 in MAIN."
          setup_api_calls:
            - call: "POST /sailings"
              payload: { ship_name: "Aurora", itinerary_code: "WCAR7N", embark_date: "2026-09-01T16:00:00Z", disembark_date: "2026-09-08T16:00:00Z", nights: 7 }
              as: RevenueManager
              captures: { s_id: $.data.id }
            - call: "POST /cabin-categories"
              payload: { sailing_id: "${s_id}", code: "BALCONY", deck_low: 8, deck_high: 10, base_fare_per_guest_cents: 119900, max_occupancy: 4 }
              as: RevenueManager
              captures: { cc_id: $.data.id }
            - call: "POST /cabins"
              payload: { cabin_category_id: "${cc_id}", cabin_number: "8001", deck: 8 }
              as: RevenueManager
            - call: "POST /sailings/${s_id}/open"
              payload: {}
              as: RevenueManager
              captures: { s_v: $.data.version }
            - call: "POST /bookings"
              payload: { sailing_id: "${s_id}", cabin_category_id: "${cc_id}", owner_user_id: "guest-14", expected_sailing_version: "${s_v}" }
              as: GuestUser
              as_user_id: "guest-14"
              captures: { b_id: $.data.id }
            - call: "POST /guests"
              payload: { booking_id: "${b_id}", full_name: "O One", age: 40 }
              as: GuestUser
              as_user_id: "guest-14"
            - call: "POST /guests"
              payload: { booking_id: "${b_id}", full_name: "O Two", age: 38 }
              as: GuestUser
              as_user_id: "guest-14"
            - call: "POST /dining-reservations"
              payload: { booking_id: "${b_id}", venue_code: "MAIN", seating_start: "2026-09-02T18:00:00Z", party_size: 2 }
              as: GuestUser
              as_user_id: "guest-14"
          trigger:
            - call: "POST /dining-reservations"
              payload: { booking_id: "${b_id}", venue_code: "SPECIALTY_A", seating_start: "2026-09-02T19:00:00Z", party_size: 2 }
              as: GuestUser
              as_user_id: "guest-14"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "response data.error_id == ERR_TIME_WINDOW_CONFLICT"
            - "A 20:00 seating (>= 90 min after 18:00) on the same booking would succeed"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: cabin_inventory_conservation_book_then_cancel
        grounds:
          - state_machines.Booking.QUOTE_to_DEPOSIT_HELD
          - state_machines.Booking.DEPOSIT_HELD_to_CANCELLED
          - entities.CabinCategory.fields.available_cabins
          - entities.CabinCategory.fields.total_cabins
        distinguishing_aspect: |
          Conserved quantity = cabin count: available_cabins + held_cabins + assigned_cabins + blocked_cabins
          == total_cabins at all times. Holding then cancelling a booking leaves available_cabins back at 2
          (no drift). Conserved quantity type: physical cabin inventory.
        test_recipe:
          setup:
            - "OPEN sailing, BALCONY category with 2 cabins (available_cabins=2, total_cabins=2)."
            - "A booking, 2 guests, DEPOSIT_HELD (available_cabins=1, held_cabins=1)."
          setup_api_calls:
            - call: "POST /sailings"
              payload: { ship_name: "Aurora", itinerary_code: "WCAR7N", embark_date: "2026-09-01T16:00:00Z", disembark_date: "2026-09-08T16:00:00Z", nights: 7 }
              as: RevenueManager
              captures: { s_id: $.data.id }
            - call: "POST /cabin-categories"
              payload: { sailing_id: "${s_id}", code: "BALCONY", deck_low: 8, deck_high: 10, base_fare_per_guest_cents: 119900, max_occupancy: 4 }
              as: RevenueManager
              captures: { cc_id: $.data.id }
            - call: "POST /cabins"
              payload: { cabin_category_id: "${cc_id}", cabin_number: "8001", deck: 8 }
              as: RevenueManager
            - call: "POST /cabins"
              payload: { cabin_category_id: "${cc_id}", cabin_number: "8002", deck: 8 }
              as: RevenueManager
            - call: "POST /sailings/${s_id}/open"
              payload: {}
              as: RevenueManager
              captures: { s_v: $.data.version }
            - call: "POST /bookings"
              payload: { sailing_id: "${s_id}", cabin_category_id: "${cc_id}", owner_user_id: "guest-15", expected_sailing_version: "${s_v}" }
              as: GuestUser
              as_user_id: "guest-15"
              captures: { b_id: $.data.id }
            - call: "POST /guests"
              payload: { booking_id: "${b_id}", full_name: "P One", age: 40 }
              as: GuestUser
              as_user_id: "guest-15"
            - call: "POST /guests"
              payload: { booking_id: "${b_id}", full_name: "P Two", age: 38 }
              as: GuestUser
              as_user_id: "guest-15"
            - call: "POST /payments"
              payload: { booking_id: "${b_id}", kind: "DEPOSIT", amount_cents: 50000 }
              as: GuestUser
              as_user_id: "guest-15"
              captures: { dep_id: $.data.id }
            - call: "POST /payments/${dep_id}/capture"
              payload: {}
              as: GuestUser
              as_user_id: "guest-15"
            - call: "POST /bookings/${b_id}/hold-deposit"
              payload: {}
              as: GuestUser
              as_user_id: "guest-15"
          trigger:
            - call: "POST /bookings/${b_id}/cancel"
              payload: { cancellation_mode: "FCC" }
              as: GuestUser
              as_user_id: "guest-15"
          assert:
            - "CabinCategory.${cc_id}.available_cabins == 2"
            - "CabinCategory.${cc_id}.held_cabins == 0"
            - "CabinCategory.${cc_id}.assigned_cabins == 0"
            - "CabinCategory.${cc_id}.blocked_cabins == 0"
            - "available_cabins + held_cabins + assigned_cabins + blocked_cabins == total_cabins (2)"

      - name: money_conservation_cash_cancel_mints_refund_payment
        grounds:
          - state_machines.Booking.DEPOSIT_HELD_to_CANCELLED
