              as: CarrierOps
              captures: { err_auto: $.data.error_id }
            - call: "POST /shipments/${p}/scans"
              payload: { scan_source: "MANUAL_REWEIGH", scanned_length_in: 10, scanned_width_in: 10, scanned_height_in: 20, scanned_weight_lbs: 30.0, expected_shipment_version: "${p_v2}" }
              as: CarrierOps
              captures: { err_manual: $.data.error_id }
          assert:
            - "${ms} == VERIFIED — one MANUAL_REWEIGH takes the measurement axis straight to its terminal state"
            - "Shipment.${p}.scanned_cube_in3 == 2200, final_billable_weight_lbs == 31 with final_basis == ACTUAL (dim weight ceil(2200 / 139) == 16 loses to the 31 lb scale weight)"
            - "The AUTOMATED_DWS scan returns HTTP 409 with ${err_auto} == ERR_MEASUREMENT_FINAL — the version was correct, the state was not"
            - "The MANUAL_REWEIGH scan returns HTTP 409 with ${err_manual} == ERR_MEASUREMENT_FINAL"
            - "GET /shipments/${p}/scans returns total_count == 1 and Shipment.${p}.version is still ${p_v2}"

      - name: issuing_an_already_issued_invoice_is_rejected_not_replayed
