# =============================================================================
# task_0105_standardized_test_registration — SCAFFOLD_DIFFICULTY_DESIGN.yaml
# §1.8 Test Targeting Index — cross-references §1.1–§1.7 of SCAFFOLD.yaml against
# the nine Difficulty Rules in the scaffold-generator skill (§0.5).
#
# Every instance MUST ground in declared elements of SCAFFOLD.yaml; every
# instance's test_recipe MUST be reproducible from an empty DB using only the
# endpoints declared in §1.5 (the /_clock/advance and /_sweep/no-show-and-promote
# test-driver endpoints are explicit so every state is reachable).
# =============================================================================

scaffold_difficulty_design:

  # ============================================================
  # Rule 1 — Dual-variant calculations across different entity domains
  # ============================================================
  - rule_id: dual_variant_calc
    instances:
      - name: refund_self_vs_official_cancellation
        grounds:
          - calculations.tiered_refund_amount
          - calculations.tiered_refund_amount.variants.self_initiated
          - calculations.tiered_refund_amount.variants.official_cancellation
          - entities.Registration.fields.registration_channel
          - entities.RefundTransaction.fields.amount_cents
          - state_machines.Registration.CONFIRMED_to_CANCELLED
        distinguishing_aspect: |
          Operates on the financial-ledger entity domain (Registration + RefundTransaction).
          Two distinct paths through Registration.registration_channel produce different
          RefundTransaction.amount_cents for identical inputs (same Registration, same
          cancellation clock instant): SELF_INITIATED uses the days_before_test tier table
          and yields 0 cents at days_before_test=6, while OFFICIAL_CANCELLATION forces
          rate=1.00 and yields full 6000 cents.
        test_recipe:
          setup:
            - "POST /_clock/advance to T0 = 2026-06-01T00:00:00Z"
            - "POST /test-events with test_type=SAT, base_fee_cents=6000, late_fee_cents=0, test_date=2026-06-08T09:00:00Z (T0 + 7 days), registration_deadline=2026-06-04, late_registration_deadline=2026-06-07T00:00:00Z, score_release_date=2026-06-15"
            - "POST /test-centers, POST /test-events/{id}/test-center-capacities total_capacity=10, accommodation_capacity=0"
            - "POST /candidates (CandidateA, CandidateB), each POST /test-events/{id}/registrations with force_confirmed=true so both Registrations are CONFIRMED with amount_charged_cents=6000"
            - "POST /_clock/advance to T1 = 2026-06-02T00:00:00Z (days_before_test = floor((2026-06-08 - 2026-06-02)/86400) = 6)"
          trigger:
            - "DELETE /test-events/{eventId}/registrations/{registrationId_A} as Candidate (channel=SELF_INITIATED)"
            - "POST /test-events/{eventId}/registrations/{registrationId_B}/admin-cancel as Registrar (channel=OFFICIAL_CANCELLATION)"
          assert:
            - "RefundTransaction for Registration_A: amount_cents == 0 AND tier_label == 'NONE' AND refund_channel == 'SELF_INITIATED'"
            - "RefundTransaction for Registration_B: amount_cents == 6000 AND tier_label == 'NONE' AND refund_channel == 'OFFICIAL_CANCELLATION'"
            - "Registration_A.amount_refunded_cents == 0; Registration_B.amount_refunded_cents == 6000"

      - name: super_score_college_board_vs_institutional
        grounds:
          - calculations.super_score_composite
          - calculations.super_score_composite.variants.college_board_official
          - calculations.super_score_composite.variants.institutional_submission
          - entities.ScoreReport.fields.section_scores
          - entities.ScoreReport.fields.total_score
          - endpoints.GET_/candidates/{candidateId}/super-score
        distinguishing_aspect: |
          Operates on the academic-results entity domain (ScoreReport) — structurally
          different from the financial Registration/RefundTransaction domain in the
          first instance. The COLLEGE_BOARD_OFFICIAL variant takes per-section maxima
          across sittings (650 RW from sitting 2, 700 M from sitting 1 → composite 1350),
          while INSTITUTIONAL_SUBMISSION pins all sections to the single sitting with
          highest total (both sittings tie at 1300 → tie-break to later by created_at →
          composite 1300). Same ScoreReport rows, different composite.
        test_recipe:
          setup:
            - "POST /_clock/advance to T_pre1 = 2024-06-01"
            - "Create SAT TestEvent_1, advance clock past test_date+score_release, create a CONFIRMED→CHECKED_IN→COMPLETED Registration for CandidateX, POST ScoreReport with section_scores={reading_writing:600, math:700}, total_score=1300"
            - "POST /_clock/advance to T_pre2 = 2025-06-01, create SAT TestEvent_2, complete the same lifecycle, POST ScoreReport with section_scores={reading_writing:650, math:650}, total_score=1300 (created later by created_at)"
            - "POST /_clock/advance to T_now = 2025-09-01 (both events within 730-day lookback)"
          trigger:
            - "GET /candidates/{candidateX}/super-score?test_type=SAT&reporting_mode=COLLEGE_BOARD_OFFICIAL"
            - "GET /candidates/{candidateX}/super-score?test_type=SAT&reporting_mode=INSTITUTIONAL_SUBMISSION"
          assert:
            - "COLLEGE_BOARD_OFFICIAL response: composite == 1350 AND sections == {reading_writing: 650, math: 700} AND sittings_used == 2"
            - "INSTITUTIONAL_SUBMISSION response: composite == 1300 AND sections == {reading_writing: 650, math: 650} AND sittings_used == 1"

  # ============================================================
  # Rule 2 — Combinatorial formulas across different modes
  # ============================================================
  - rule_id: combinatorial_formula
    instances:
      - name: standby_promotion_priority_nested_branches_mode_a
        grounds:
          - calculations.standby_promotion_priority
          - entities.Registration.fields.accommodation_required
          - entities.Registration.fields.registered_at
          - entities.Registration.fields.candidate_id
          - entities.TestCenterCapacity.fields.accommodation_capacity
          - state_machines.Registration.STANDBY_to_CONFIRMED
        distinguishing_aspect: |
          Mode (a) — ≥3 inputs with non-linear interaction. The selector ingests
          four inputs per STANDBY row (accommodation_required, accommodation_capacity
          headroom, registered_at, candidate_id) and partitions the pool into two
          waterfall pools (accommodation-only, general-with-spill). The ranking key
          is a 3-level lexicographic tuple (priority_class, registered_at,
          candidate_id) with explicit tie-break, and the spill rule (unused
          accommodation slots flow back into general) creates a conditional branch
          that depends on the relative size of S_accommodation vs K. Not a plain
          tiered-rate formula.
        test_recipe:
          setup:
            - "POST /_clock/advance to T0; create TestEvent (SAT), TestCenter, capacity total=2, accommodation=1"
            - "POST /candidates (A, B, C, D). A and B set has_iep_or_504=true; C and D set false."
            - "POST AccommodationRequests for A and B; advance clock and walk both through SUBMITTED→UNDER_REVIEW→APPROVED (so accommodation_required becomes true on their later Registrations)"
            - "Submit four registrations in order C (T0+10s), D (T0+20s), A (T0+30s), B (T0+40s). Because total_capacity already filled by an earlier helper Registrar-confirmed CandidateE, F (force_confirmed=true) — all four new ones start STANDBY"
            - "Both confirmed seats (held by E and F) cancelled via admin-cancel — freeing seats_freed=2, accommodation_seats_freed=1"
          trigger:
            - "POST /_sweep/no-show-and-promote (selector fires)"
          assert:
            - "Promoted order: first slot (accommodation pool) → A (earliest among accommodation_required=true), second slot (general, after accommodation pool drains) → C (earliest among general). B and D remain STANDBY."
            - "Registration_A.status == 'CONFIRMED'; Registration_C.status == 'CONFIRMED'"
            - "Registration_B.status == 'STANDBY'; Registration_D.status == 'STANDBY'"

      - name: tiered_refund_per_line_rounding_pinned_mode_b
        grounds:
          - calculations.tiered_refund_amount
          - calculations.tiered_refund_amount.precision
          - entities.Registration.fields.base_fee_cents_charged
          - entities.Registration.fields.late_fee_cents_charged
          - entities.RefundTransaction.fields.amount_cents
        distinguishing_aspect: |
          Mode (b) — nested rounding where order matters. The scaffold PINS
          "round per-line then sum" (round_half_up applied to base_fee*rate and
          late_fee*rate independently, then summed). For (base=5999, late=3001,
          rate=0.50): per-line yields round_half_up(2999.5)=3000 plus
          round_half_up(1500.5)=1501 → 4501. Sum-then-round would yield
          round_half_up(9000*0.5) = round_half_up(4500.0) = 4500. The 1-cent
          difference is the litmus test for whether the implementation followed
          the pinned order.
        test_recipe:
          setup:
            - "POST /_clock/advance to T0 = 2026-06-01"
            - "POST /test-events with base_fee_cents=5999, late_fee_cents=3001, test_date=2026-06-23T09:00:00Z (T0+22 days), registration_deadline=2026-05-25 (already past so registration is 'late'), late_registration_deadline=2026-06-20"
            - "POST /test-centers, capacity; POST /candidate; POST /test-events/{id}/registrations with force_confirmed=true → Registration.late_fee_cents_charged=3001, base_fee_cents_charged=5999, amount_charged_cents=9000"
            - "POST /_clock/advance to T1 = 2026-06-06 (days_before_test = floor((2026-06-23 - 2026-06-06)/86400) = 17 → tier PARTIAL_75? no: 17 falls in [15,30) → PARTIAL_75 rate=0.75; not what we want)"
            - "Adjust: advance instead to T1' = 2026-06-08 (days_before_test = 15 → PARTIAL_75) — but we want rate=0.50. So advance to T1'' so days_before_test ∈ [7,15) — pick T1'' = 2026-06-15 (days_before_test = floor((2026-06-23 - 2026-06-15)/86400) = 8 → PARTIAL_50 rate=0.50)"
          trigger:
            - "DELETE /test-events/{eventId}/registrations/{registrationId} as Candidate"
          assert:
            - "RefundTransaction.amount_cents == 4501  # per-line: round_half_up(5999*0.5)=3000 + round_half_up(3001*0.5)=1501; sum-then-round would yield 4500"
            - "RefundTransaction.tier_label == 'PARTIAL_50'"
            - "Registration.amount_refunded_cents == 4501; Registration.amount_retained_cents == 9000 - 4501 == 4499"

  # ============================================================
  # Rule 3 — Non-linear state-machine shape on different entities
  # ============================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: accommodation_request_review_cycle
        grounds:
          - state_machines.AccommodationRequest
          - state_machines.AccommodationRequest.SUBMITTED_to_UNDER_REVIEW
          - state_machines.AccommodationRequest.UNDER_REVIEW_to_NEEDS_MORE_INFO
          - state_machines.AccommodationRequest.NEEDS_MORE_INFO_to_SUBMITTED
          - entities.AccommodationRequest.fields.status
          - endpoints.POST_/accommodation-requests/{accommodationRequestId}/start-review
          - endpoints.POST_/accommodation-requests/{accommodationRequestId}/request-info
          - endpoints.PATCH_/accommodation-requests/{accommodationRequestId}/resubmit
        distinguishing_aspect: |
          AccommodationRequest is the FIRST cyclic state machine: SUBMITTED →
          UNDER_REVIEW → NEEDS_MORE_INFO → SUBMITTED is a true cycle (state
          returns to a previously-visited state via a different transition).
          The cycle can repeat any number of times before terminating in
          APPROVED / DENIED / EXPIRED.
        test_recipe:
          setup:
            - "POST /_clock/advance to T0; create TestEvent (test_date 2026-07-01, registration_deadline 2026-06-15); create CandidateA with has_iep_or_504=true"
            - "POST /accommodation-requests as CandidateA"
          trigger:
            - "POST /accommodation-requests/{id}/start-review as AccommodationsOfficer (SUBMITTED → UNDER_REVIEW)"
            - "POST /accommodation-requests/{id}/request-info as same officer (UNDER_REVIEW → NEEDS_MORE_INFO)"
            - "PATCH /accommodation-requests/{id}/resubmit as CandidateA with additional supporting_documents (NEEDS_MORE_INFO → SUBMITTED — cycle returns)"
            - "POST /accommodation-requests/{id}/start-review again (SUBMITTED → UNDER_REVIEW second time)"
          assert:
            - "After the first start-review: status == 'UNDER_REVIEW' AND version == 2 (creation→1, start-review→2)"
            - "After request-info: status == 'NEEDS_MORE_INFO' AND version == 3"
            - "After resubmit: status == 'SUBMITTED' AND version == 4"
            - "After second start-review: status == 'UNDER_REVIEW' AND version == 5 — the same state visited twice on different versions, proving cyclicity"

      - name: id_verification_reject_resubmit_cycle
        grounds:
          - state_machines.IDVerification
          - state_machines.IDVerification.DOCS_SUBMITTED_to_REJECTED
          - state_machines.IDVerification.REJECTED_to_DOCS_SUBMITTED
          - entities.IDVerification.fields.status
          - endpoints.POST_/test-events/{testEventId}/registrations/{registrationId}/id-verification/submit
          - endpoints.POST_/test-events/{testEventId}/registrations/{registrationId}/id-verification/reject
        distinguishing_aspect: |
          IDVerification is the SECOND, structurally distinct, cyclic state
          machine on a different entity. The cycle DOCS_SUBMITTED → REJECTED →
          DOCS_SUBMITTED has different semantics from the AccommodationRequest
          one: it is triggered by a Registrar's REJECT followed by the
          Candidate's re-submit (different actors per hop), whereas the
          AccommodationRequest cycle alternates between an Officer hop and a
          Candidate hop in a different order.
        test_recipe:
          setup:
            - "Create CandidateA, TestEvent, capacity; POST /test-events/{id}/registrations force_confirmed=true to get Registration in CONFIRMED"
          trigger:
            - "POST .../id-verification/submit as CandidateA (NOT_STARTED → DOCS_SUBMITTED)"
            - "POST .../id-verification/reject as Registrar with rejection_reason='blurry' (DOCS_SUBMITTED → REJECTED)"
            - "POST .../id-verification/submit again as CandidateA with new id_document_type=PASSPORT (REJECTED → DOCS_SUBMITTED)"
          assert:
            - "After first submit: IDVerification.status == 'DOCS_SUBMITTED'"
            - "After reject: IDVerification.status == 'REJECTED' AND rejection_reason == 'blurry'"
            - "After second submit: IDVerification.status == 'DOCS_SUBMITTED' AND id_document_type == 'PASSPORT' (the same logical state revisited after a cycle)"

  # ============================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # ============================================================
  - rule_id: transitive_cascade
    instances:
      - name: admin_cancel_to_standby_promotion_depth_4
        grounds:
          - state_machines.Registration.CONFIRMED_to_CANCELLED
          - state_machines.Registration.STANDBY_to_CONFIRMED
          - calculations.tiered_refund_amount
          - calculations.capacity_seat_reconciliation
          - calculations.standby_promotion_priority
          - entities.TestCenterCapacity.fields.confirmed_seats_used
          - entities.TestCenterCapacity.fields.standby_seats_pending
          - entities.RefundTransaction
        distinguishing_aspect: |
          Depth 4 transitive chain originating at Registrar.admin-cancel:
          (1) Registrar invokes admin-cancel → Registration_X.status: CONFIRMED → CANCELLED;
          (2) THAT status change triggers tiered_refund_amount → a new
              RefundTransaction row is created and Registration_X.amount_refunded_cents
              is set (caused by the link-1 mutation, not by the original call);
          (3) THAT RefundTransaction creation forces capacity_seat_reconciliation
              → TestCenterCapacity.confirmed_seats_used decremented;
          (4) THAT decrement triggers standby_promotion_priority → Registration_Y.status:
              STANDBY → CONFIRMED → TestCenterCapacity.confirmed_seats_used incremented
              again (re-reconciliation, hop 4). Every hop is caused by the previous
              hop's mutation; no fan-out from the original call.
        test_recipe:
          setup:
            - "POST /_clock/advance to T0; TestEvent, TestCenter, capacity total_capacity=1, accommodation_capacity=0"
            - "POST /candidates (X, Y); X's Registration created with force_confirmed=true (CONFIRMED, occupies the only seat); Y's Registration created (lands in STANDBY because capacity exhausted)"
            - "Advance clock so days_before_test = 6 → tier=NONE (refund amount won't affect cascade assertions; we just need the cascade to run)"
          trigger:
            - "POST /test-events/{eventId}/registrations/{registrationId_X}/admin-cancel as Registrar"
          assert:
            - "Registration_X.status == 'CANCELLED' (hop 1)"
            - "RefundTransaction row exists with registration_id == Registration_X.id (hop 2; created by hop-1 mutation, not by the direct call)"
            - "TestCenterCapacity.confirmed_seats_used (after the cascade) == 1 (decremented to 0 in hop 3, then re-incremented in hop 4)"
            - "Registration_Y.status == 'CONFIRMED' (hop 4 — promoted from STANDBY by hop-3-driven selector)"

      - name: accommodation_approval_to_demotion_depth_3
        grounds:
          - state_machines.AccommodationRequest.UNDER_REVIEW_to_APPROVED
          - state_machines.Registration.CONFIRMED_to_STANDBY
          - calculations.capacity_seat_reconciliation
          - entities.Registration.fields.accommodation_required
          - entities.Registration.fields.locked_accommodation_request_version
          - entities.TestCenterCapacity.fields.accommodation_seats_used
        distinguishing_aspect: |
          Depth 3 transitive chain originating at AccommodationsOfficer.approve
          (DIFFERENT trigger from the first instance — different actor,
          different state machine, different starting entity):
          (1) approve → AccommodationRequest.status: UNDER_REVIEW → APPROVED;
          (2) THAT approval causes the matching Registration to flip
              accommodation_required=true and locks its version;
          (3) THAT flip, because accommodation_capacity is already exhausted,
              causes Registration.status: CONFIRMED → STANDBY, and
              capacity_seat_reconciliation runs (TestCenterCapacity.confirmed_seats_used
              decremented, standby_seats_pending incremented). Each hop caused
              by the previous, not by the original approve call.
        test_recipe:
          setup:
            - "POST /_clock/advance to T0; TestEvent, TestCenter, capacity total_capacity=2, accommodation_capacity=1"
            - "POST /candidates A (has_iep_or_504=true) and B (has_iep_or_504=true)"
            - "A's Registration created with force_confirmed=true (CONFIRMED, regular pool)"
            - "B's Registration created with force_confirmed=true (CONFIRMED, regular pool — accommodation_capacity untouched)"
            - "POST /accommodation-requests as A → status SUBMITTED; POST /start-review as Officer; POST /accommodation-requests as B → status SUBMITTED; POST /start-review as Officer; POST /approve for A → A now occupies accommodation pool"
            - "Now accommodation_capacity (1) is exhausted by A"
          trigger:
            - "POST /accommodation-requests/{B_request_id}/approve as AccommodationsOfficer (the trigger)"
          assert:
            - "AccommodationRequest_B.status == 'APPROVED' (hop 1)"
            - "Registration_B.accommodation_required == True AND Registration_B.locked_accommodation_request_version == AccommodationRequest_B.version (hop 2; caused by hop-1)"
            - "Registration_B.status == 'STANDBY' (hop 3; demoted because accommodation pool exhausted — caused by hop-2's flag flip, not by the original approve call)"
            - "TestCenterCapacity.confirmed_seats_used == 1 (only A); standby_seats_pending == 1 (B); accommodation_seats_used == 1 (A)"

  # ============================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # ============================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_constraint_on_register
        grounds:
          - validations[priority=4]   # ERR_REGISTRATION_CLOSED (category=state)
          - validations[priority=14]  # ERR_DUPLICATE_REGISTRATION (category=business_constraint)
          - state_machines.TestEvent.REGISTRATION_OPEN_to_REGISTRATION_CLOSED
          - endpoints.POST_/test-events/{testEventId}/registrations
        distinguishing_aspect: |
          Pair (state vs business_constraint). Two failures co-occur on the
          same POST /registrations call: the TestEvent has rolled into
          REGISTRATION_CLOSED (state, priority 4) AND the (candidate_id,
          test_event_id) tuple already has a non-CANCELLED row (duplicate,
          priority 14). The priority order in §1.4 demands ERR_REGISTRATION_CLOSED
          wins; an implementation that returns ERR_DUPLICATE_REGISTRATION has
          mis-ordered the categories.
        test_recipe:
          setup:
            - "POST /_clock/advance to T0; TestEvent test_date=2026-06-08, registration_deadline=2026-06-01, late_registration_deadline=2026-06-05, TestCenter, capacity total=10"
            - "CandidateA; POST /test-events/{id}/registrations for A (succeeds, CONFIRMED)"
            - "POST /_clock/advance to 2026-06-06T00:00:00Z (past late_registration_deadline → TestEvent.status auto-flips to REGISTRATION_CLOSED)"
          trigger:
            - "POST /test-events/{id}/registrations as CandidateA again (same candidate_id + test_event_id → would-be duplicate AND event closed)"
          assert:
            - "Response error_id == 'ERR_REGISTRATION_CLOSED' (state, priority 4) — NOT ERR_DUPLICATE_REGISTRATION (business_constraint, priority 14)"
            - "HTTP status == 409"

      - name: business_referential_vs_business_temporal_on_checkin
        grounds:
          - validations[priority=6]   # ERR_ID_NOT_CLEARED (business_referential)
          - validations[priority=10]  # ERR_CHECK_IN_WINDOW_CLOSED (business_temporal)
          - state_machines.Registration.CONFIRMED_to_CHECKED_IN
          - endpoints.POST_/test-events/{testEventId}/registrations/{registrationId}/check-in
        distinguishing_aspect: |
          Pair (business_referential vs business_temporal) — STRUCTURALLY
          DIFFERENT from the first instance (state vs business_constraint).
          On a check-in call BOTH conditions hold: IDVerification is in
          DOCS_SUBMITTED (not CLEARED — referential failure, priority 6) AND
          now() is 30 hours before test_date which is outside
          [test_date - 2h, test_date + 1h] (temporal failure, priority 10).
          Priority order in §1.4 demands ERR_ID_NOT_CLEARED wins.
        test_recipe:
          setup:
            - "POST /_clock/advance to T0; TestEvent test_date=2026-06-08T09:00:00Z; TestCenter; capacity total=2"
            - "CandidateA; POST registration force_confirmed=true (Registration is CONFIRMED, IDVerification not yet started → submit it but do NOT clear)"
            - "POST .../id-verification/submit (NOT_STARTED → DOCS_SUBMITTED)"
            - "POST /_clock/advance to T1 = 2026-06-07T03:00:00Z (30 hours before test_date → outside check-in window which only opens at test_date - 2h = 2026-06-08T07:00:00Z)"
          trigger:
            - "POST /test-events/{id}/registrations/{registrationId}/check-in as Proctor"
          assert:
            - "Response error_id == 'ERR_ID_NOT_CLEARED' (business_referential, priority 6) — NOT ERR_CHECK_IN_WINDOW_CLOSED (business_temporal, priority 10)"
            - "HTTP status == 409"

  # ============================================================
  # Rule 6 — Boundary-precision checks on different metrics/endpoints
  # ============================================================
  - rule_id: boundary_precision_check
    instances:
      - name: refund_tier_boundary_30_days
        grounds:
          - calculations.tiered_refund_amount
          - calculations.tiered_refund_amount.constants.FULL_TIER_THRESHOLD_DAYS
          - entities.RefundTransaction.fields.tier_label
          - endpoints.DELETE_/test-events/{testEventId}/registrations/{registrationId}
        distinguishing_aspect: |
          Numeric-threshold boundary. days_before_test == 30 MUST map to tier
          FULL (rate=1.00) per the formula clause `days_before_test >= 30 → FULL`;
          days_before_test == 29 MUST map to PARTIAL_75 (rate=0.75). Reached
          via the DELETE self-cancellation endpoint (the metric is the
          time-delta between now() and test_date).
        test_recipe:
          setup:
            - "POST /_clock/advance to T0 = 2026-05-09T09:00:00Z; TestEvent test_date=2026-06-08T09:00:00Z (exactly 30 days later); TestCenter; capacity"
            - "CandidateA, CandidateB each registered with force_confirmed=true; both Registrations have base_fee_cents_charged=6000, late_fee_cents=0, amount_charged_cents=6000"
          trigger:
            - "DELETE /test-events/{eventId}/registrations/{Reg_A_id} at T0 (days_before_test = 30 exactly)"
            - "POST /_clock/advance to T0' = 2026-05-10T09:00:00Z (days_before_test now 29)"
            - "DELETE /test-events/{eventId}/registrations/{Reg_B_id} at T0' (days_before_test = 29 exactly)"
          assert:
            - "RefundTransaction for Reg_A: tier_label == 'FULL' AND amount_cents == 6000  # days_before_test == 30 hits the >= 30 boundary"
            - "RefundTransaction for Reg_B: tier_label == 'PARTIAL_75' AND amount_cents == 4500  # days_before_test == 29 falls in [15, 30)"

      - name: super_score_empty_pool_zero_sittings
        grounds:
          - calculations.super_score_composite
          - calculations.super_score_composite.formula  # explicit empty-pool fallback clause
          - endpoints.GET_/candidates/{candidateId}/super-score
        distinguishing_aspect: |
          Empty-collection edge — STRUCTURALLY DIFFERENT from the numeric
          boundary in the first instance. Reached via a DIFFERENT endpoint
          (GET super-score, not DELETE registrations). The metric here is a
          set cardinality (sittings_used), not a numeric threshold. When the
          filtered ScoreReport pool is empty, the response MUST be
          {composite: null, sections: {}, sittings_used: 0} — not a 404 and
          not an error.
        test_recipe:
          setup:
            - "POST /_clock/advance to T0; create CandidateA (no Registrations, no ScoreReports — pool is empty)"
          trigger:
            - "GET /candidates/{candidateA_id}/super-score?test_type=SAT"
          assert:
            - "HTTP status == 200"
            - "Response data: composite == None / null, sections == {}, sittings_used == 0, source_score_report_ids == []"

  # ============================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # ============================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: registration_checkin_requires_idverification_cleared
        grounds:
          - validations[priority=6]
          - state_machines.Registration.CONFIRMED_to_CHECKED_IN
          - state_machines.IDVerification
          - entities.IDVerification.fields.status
          - endpoints.POST_/test-events/{testEventId}/registrations/{registrationId}/check-in
        distinguishing_aspect: |
          Entity pair (Registration, IDVerification). Registration.CONFIRMED →
          CHECKED_IN is gated on IDVerification.status == CLEARED — a state on
          a DIFFERENT entity (child IDVerification). The same Registration
          row is CONFIRMED and inside the check-in window, but the dependent
          IDVerification is REJECTED → check-in MUST fail with
          ERR_ID_NOT_CLEARED.
        test_recipe:
          setup:
            - "POST /_clock/advance to T0; TestEvent test_date=2026-06-08T09:00:00Z; TestCenter; capacity"
            - "CandidateA; POST /test-events/{id}/registrations force_confirmed=true (Registration CONFIRMED)"
            - "POST .../id-verification/submit, then POST .../id-verification/reject as Registrar with rejection_reason='mismatch' (IDVerification.status=REJECTED)"
            - "POST /_clock/advance to T_in_window = 2026-06-08T08:00:00Z (within [test_date - 2h, test_date + 1h])"
          trigger:
            - "POST .../check-in as Proctor"
          assert:
            - "Response error_id == 'ERR_ID_NOT_CLEARED' AND HTTP status == 409"
            - "Registration.status remains 'CONFIRMED' (not CHECKED_IN)"

      - name: registration_checkin_blocked_by_pending_accommodation
        grounds:
          - validations[priority=7]
          - state_machines.Registration.CONFIRMED_to_CHECKED_IN
          - state_machines.AccommodationRequest
          - entities.AccommodationRequest.fields.status
          - endpoints.POST_/test-events/{testEventId}/registrations/{registrationId}/check-in
        distinguishing_aspect: |
          Entity pair (Registration, AccommodationRequest) — DIFFERENT entity
          pair from the previous instance. The check-in transition is gated
          not by a child entity but by a SIBLING entity (AccommodationRequest
          shares the candidate_id but is NOT a child of Registration). When
          AccommodationRequest.status ∈ {SUBMITTED, UNDER_REVIEW,
          NEEDS_MORE_INFO} the check-in MUST fail with
          ERR_ACCOMMODATION_PENDING — distinct from the IDVerification
          dependency above.
        test_recipe:
          setup:
            - "POST /_clock/advance to T0; TestEvent; TestCenter; capacity"
            - "CandidateA with has_iep_or_504=true; force_confirmed=true Registration; ID submitted and CLEARED"
            - "POST /accommodation-requests as A (status=SUBMITTED — pending)"
            - "POST /_clock/advance to T_in_window for the check-in window"
          trigger:
            - "POST .../check-in as Proctor"
          assert:
            - "Response error_id == 'ERR_ACCOMMODATION_PENDING' AND HTTP status == 409"
            - "Registration.status remains 'CONFIRMED'"

  # ============================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # ============================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: test_center_event_overlap_no_buffer
        grounds:
          - validations[priority=12]
          - entities.TestEvent.fields.test_date
          - entities.TestCenter
          - entities.TestCenterCapacity
          - endpoints.POST_/test-events/{testEventId}/test-center-capacities
        distinguishing_aspect: |
          Resource: TestCenter. Interval semantics: CLOSED interval, NO
          adjacency buffer — two TestEvents whose [test_date, test_date +
          TEST_SESSION_HOURS] windows touch at any single instant are in
          conflict at the same TestCenter. A new TestCenterCapacity whose
          parent TestEvent's window overlaps an existing event's window at
          this center → ERR_TEST_CENTER_TIME_CONFLICT.
        test_recipe:
          setup:
            - "POST /_clock/advance to T0; POST TestCenter_X"
            - "POST TestEvent_1 with test_date=2026-06-08T09:00:00Z (window 09:00–13:00 UTC); POST /test-events/{TestEvent_1_id}/test-center-capacities for TestCenter_X (success)"
            - "POST TestEvent_2 with test_date=2026-06-08T12:00:00Z (window 12:00–16:00 UTC — overlaps TestEvent_1's window at [12:00, 13:00])"
          trigger:
            - "POST /test-events/{TestEvent_2_id}/test-center-capacities for TestCenter_X"
          assert:
            - "Response error_id == 'ERR_TEST_CENTER_TIME_CONFLICT' AND HTTP status == 409"
            - "No TestCenterCapacity row created for (TestEvent_2_id, TestCenter_X)"

      - name: candidate_session_overlap_with_cooldown_buffer
        grounds:
          - validations[priority=13]
          - entities.Candidate
          - entities.Registration
          - endpoints.POST_/test-events/{testEventId}/registrations
        distinguishing_aspect: |
          Resource: Candidate (a DIFFERENT resource from TestCenter — humans
          not venues). Interval semantics: CLOSED interval WITH a
          CANDIDATE_COOLDOWN_HOURS buffer applied on both sides — STRUCTURALLY
          DIFFERENT from the no-buffer closed-interval rule in the previous
          instance. Two Registrations whose extended windows ([test_date - 4h,
          test_date + TEST_SESSION_HOURS + 4h]) overlap each other for the
          same Candidate → ERR_CANDIDATE_SESSION_OVERLAP. The buffer means
          even back-to-back-with-gap test events that respect the no-buffer
          rule still fail this rule for the same candidate.
        test_recipe:
          setup:
            - "POST /_clock/advance to T0; POST TestCenter_X and TestCenter_Y (different centers, so the no-buffer rule does NOT fire)"
            - "POST TestEvent_1 with test_date=2026-06-08T09:00:00Z (window 09–13 UTC, buffered window 05–17)"
            - "POST TestEvent_2 with test_date=2026-06-08T16:00:00Z (window 16–20, buffered window 12–24) — overlaps TestEvent_1's BUFFERED window at [12, 17], although the raw windows don't overlap"
            - "POST TestCenterCapacities at TestCenter_X for both events (no conflict because different centers — well, same center actually wouldn't work; use TestCenter_X for event 1 and TestCenter_Y for event 2)"
            - "POST /candidates A; POST /test-events/{TestEvent_1_id}/registrations for A at TestCenter_X (success, CONFIRMED)"
          trigger:
            - "POST /test-events/{TestEvent_2_id}/registrations for A at TestCenter_Y"
          assert:
            - "Response error_id == 'ERR_CANDIDATE_SESSION_OVERLAP' AND HTTP status == 409"
            - "No second Registration created for CandidateA"

  # ============================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # ============================================================
  - rule_id: compensating_invariant
    instances:
      - name: money_conservation_under_cancel_refund
        grounds:
          - calculations.tiered_refund_amount
          - entities.Registration.fields.amount_charged_cents
          - entities.Registration.fields.amount_refunded_cents
          - entities.Registration.fields.amount_retained_cents
          - entities.RefundTransaction.fields.amount_cents
          - state_machines.Registration.CONFIRMED_to_CANCELLED
        distinguishing_aspect: |
          Conserved quantity: MONEY (USD cents) attached to a Registration.
          Forward action = Registration creation (charge); compensating action =
          cancellation (refund). The named invariant pinned by the scaffold:
          amount_charged_cents == amount_refunded_cents + amount_retained_cents
          MUST hold at every observable instant — both BEFORE and AFTER the
          cancellation+refund cascade. The sum of refund and retained equals
          the original charge to the cent.
        test_recipe:
          setup:
            - "POST /_clock/advance to T0; TestEvent base_fee_cents=6000, late_fee_cents=2000, test_date=2026-06-23, registration_deadline already past so registration is a 'late' registration; TestCenter; capacity"
            - "CandidateA; POST registration force_confirmed=true → amount_charged_cents == 8000 (base 6000 + late 2000)"
            - "Pre-cancel observable: amount_charged_cents == 8000, amount_refunded_cents == 0, amount_retained_cents == 8000 → invariant 8000 == 0 + 8000 holds"
            - "POST /_clock/advance to T1 = 2026-06-15 (days_before_test = 8 → PARTIAL_50 rate=0.50)"
          trigger:
            - "DELETE /test-events/{eventId}/registrations/{registrationId} as CandidateA"
          assert:
            - "RefundTransaction.amount_cents == 4000  # round_half_up(6000*0.5) + round_half_up(2000*0.5) = 3000 + 1000"
            - "Registration.amount_refunded_cents == 4000 AND Registration.amount_retained_cents == 4000"
            - "Invariant holds: Registration.amount_charged_cents == Registration.amount_refunded_cents + Registration.amount_retained_cents  # 8000 == 4000 + 4000"

      - name: seat_conservation_through_cancellation_and_promotion
        grounds:
          - calculations.capacity_seat_reconciliation
          - calculations.standby_promotion_priority
          - entities.TestCenterCapacity.fields.total_capacity
          - entities.TestCenterCapacity.fields.confirmed_seats_used
          - entities.TestCenterCapacity.fields.available_seats
          - entities.TestCenterCapacity.fields.standby_seats_pending
          - state_machines.Registration.CONFIRMED_to_CANCELLED
          - state_machines.Registration.STANDBY_to_CONFIRMED
        distinguishing_aspect: |
          Conserved quantity: SEAT COUNT (integer) attached to a
          TestCenterCapacity — STRUCTURALLY DIFFERENT TYPE OF CONSERVED
          QUANTITY from money. Forward action = creating a Registration
          (claims a seat); compensating action = cancelling (releases) +
          standby-promoting (re-claims for someone else). The named
          invariant: total_capacity == confirmed_seats_used + available_seats
          MUST hold at every observable instant including immediately after
          the cascade. Even though confirmed_seats_used briefly dips during
          the cancel→promote cascade, the post-cascade value equals the
          pre-cascade value (one cancellation balanced by one promotion).
        test_recipe:
          setup:
            - "POST /_clock/advance to T0; TestEvent; TestCenter; capacity total_capacity=1, accommodation_capacity=0"
            - "CandidateX, CandidateY; X registered force_confirmed=true (CONFIRMED, occupies the seat); Y registered (lands STANDBY)"
            - "Pre-cascade observable on the TestCenterCapacity: total_capacity == 1, confirmed_seats_used == 1, available_seats == 0, standby_seats_pending == 1 → invariant 1 == 1 + 0 holds"
            - "POST /_clock/advance forward so days_before_test = 6 (refund tier NONE — irrelevant to seat invariant but pins clock)"
          trigger:
            - "POST /test-events/{eventId}/registrations/{Reg_X_id}/admin-cancel as Registrar"
          assert:
            - "Registration_X.status == 'CANCELLED'"
            - "Registration_Y.status == 'CONFIRMED'  # standby_promotion_priority moved Y into the freed seat"
            - "Post-cascade TestCenterCapacity: total_capacity == 1, confirmed_seats_used == 1, available_seats == 0, standby_seats_pending == 0"
            - "Invariant holds: TestCenterCapacity.total_capacity == TestCenterCapacity.confirmed_seats_used + TestCenterCapacity.available_seats  # 1 == 1 + 0"
