          trigger:
            - call: "POST /shipments/${sh0_id}/ship"
              payload: { route_id: "00000000-0000-0000-0000-000000000000", delivery_window_start: "2026-03-10T09:00:00Z", delivery_window_end: "2026-03-10T10:00:00Z" }
              as: FulfillmentOps
