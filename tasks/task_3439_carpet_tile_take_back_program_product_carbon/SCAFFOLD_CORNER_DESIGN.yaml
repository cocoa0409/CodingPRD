  - section: endpoints
    instances:

      - name: filtered_lists_return_scoped_rows_and_empty_states
        claim_type: Computed read
        grounds:
          - endpoints."GET /carpetloop/zones"
          - endpoints."GET /carpetloop/replacement-orders"
