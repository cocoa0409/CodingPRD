# ============================================================================
# SCAFFOLD_CORNER_DESIGN.yaml — §1.9 Scaffold Corner Design
#   Wetland Mitigation Banking & Credit Sales (task 2665).
#   Breadth probe over SCAFFOLD.yaml §1.1–§1.7, walked section-by-section
#   against references/claim-extraction-guide.md. Depth (the nine §0.5
#   difficulty rules) lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml; corners that
#   file already exercises appear here as `excluded_because:` stubs.
#
#   Logical clock: every chain pins it explicitly; process default is
#   2026-08-01T00:00:00Z. All money is integer cents, all credits 2 decimals,
#   every asserted number below was computed with Decimal/ROUND_HALF_UP against
#   the §1.3 formulas before being written down.
# ============================================================================

scaffold_corner_design:

  # ==========================================================================
  # 1. From Table 1 (Entities)
  # ==========================================================================
  - section: entities
    instances:

      - name: sponsor_and_permittee_creation_stamps_derived_counters
        claim_type: creation
        grounds:
          - entities.Sponsor.fields.banks_count
          - entities.Sponsor.fields.good_standing
          - entities.Permittee.fields.unmet_requirement_credits
          - endpoints[POST /mitigation/sponsors]
          - endpoints[POST /mitigation/permittees]
        distinguishing_aspect: "A freshly registered Sponsor reports banks_count 0 and good_standing true, and a freshly registered Permittee reports deposited_cents 0, escrow_balance_cents 0, assigned_credits 0.00 and unmet_requirement_credits equal to required_credits — none of these four counters is an input field."
        test_recipe:
          setup:
            - "Empty database, logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /mitigation/sponsors"
              payload: { legal_name: "Cypress Bend Mitigation LLC", legal_entity_type: "PRIVATE_ENTREPRENEURIAL", performance_bond_cents: 30000000 }
              as: ProgramAdmin
              captures: { sponsor_id: $.data.id }
            - call: "POST /mitigation/permittees"
              payload: { organization_name: "Delta Logistics Park", permit_number: "COE-2026-00417", impact_huc8_code: "03130002", required_credits: 20.00 }
              as: ProgramAdmin
              captures: { permittee_id: $.data.id }
          assert:
            - "POST /mitigation/sponsors returns 201"
            - "Sponsor.${sponsor_id}.banks_count == 0"
            - "Sponsor.${sponsor_id}.good_standing == true"
            - "Sponsor.${sponsor_id}.performance_bond_cents == 30000000"
            - "Sponsor.${sponsor_id}.version == 1"
            - "POST /mitigation/permittees returns 201"
            - "Permittee.${permittee_id}.deposited_cents == 0"
            - "Permittee.${permittee_id}.escrow_balance_cents == 0"
            - "Permittee.${permittee_id}.assigned_credits == 0.00"
            - "Permittee.${permittee_id}.unmet_requirement_credits == 20.00"

      - name: bank_creation_and_retrieval_returns_stored_and_derived_state
        claim_type: retrieval
        grounds:
          - entities.MitigationBank.fields.sales_posture
          - entities.MitigationBank.fields.stewardship_required_cents
          - calculations.stewardship_endowment_requirement
          - endpoints[GET /mitigation/banks/{id}]
        distinguishing_aspect: "GET /mitigation/banks/{id} returns exactly what POST stored plus every derived field: status DRAFT, sales_posture FROZEN, stewardship_required_cents 113680000 (from annual_stewardship_cost_cents 4200000) and all four credit counters 0.00."
        test_recipe:
          setup:
            - "One sponsor and one DRAFT bank with annual_stewardship_cost_cents 4200000, clock 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /mitigation/sponsors"
              payload: { legal_name: "Cypress Bend Mitigation LLC", legal_entity_type: "PRIVATE_ENTREPRENEURIAL", performance_bond_cents: 30000000 }
              as: ProgramAdmin
              captures: { sponsor_id: $.data.id }
            - call: "POST /mitigation/banks"
              payload: { sponsor_id: "${sponsor_id}", site_name: "Cypress Bend", site_huc8_code: "03130002", service_area_huc8_codes: ["03130002", "03130003"], hgm_class: "DEPRESSIONAL", annual_stewardship_cost_cents: 4200000 }
              as: Sponsor
              as_user_id: "${sponsor_id}"
              captures: { bank_id: $.data.id }
          trigger:
            - call: "GET /mitigation/banks/${bank_id}"
              payload: {}
              as: Sponsor
              as_user_id: "${sponsor_id}"
          assert:
            - "GET /mitigation/banks/${bank_id} returns 200"
            - "MitigationBank.${bank_id}.status == DRAFT"
            - "MitigationBank.${bank_id}.sales_posture == FROZEN"
            - "MitigationBank.${bank_id}.stewardship_required_cents == 113680000"
            - "MitigationBank.${bank_id}.stewardship_funded_cents == 0"
            - "MitigationBank.${bank_id}.total_authorized_credits == 0.00"
            - "MitigationBank.${bank_id}.credits_released == 0.00"
            - "MitigationBank.${bank_id}.credits_available == 0.00"
            - "MitigationBank.${bank_id}.easement_recorded == false"
            - "MitigationBank.${bank_id}.easement_recorded_at == null"
            - "MitigationBank.${bank_id}.service_area_huc8_codes == [\"03130002\", \"03130003\"]"
            - "Sponsor.${sponsor_id}.banks_count == 1"

      - name: banks_listing_filters_by_sponsor_and_paginates
        claim_type: listing
        grounds:
          - endpoints[GET /mitigation/banks]
          - entities.MitigationBank.fields.sponsor_id
        distinguishing_aspect: "With two banks under sponsor A and one under sponsor B, GET /mitigation/banks?sponsor_id=A&limit=1&offset=0 returns total_count 2, has_more true and exactly one row; offset=1 returns has_more false."
        test_recipe:
          setup:
            - "Two sponsors; sponsor A owns two banks, sponsor B owns one."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /mitigation/sponsors"
              payload: { legal_name: "Cypress Bend Mitigation LLC", legal_entity_type: "PRIVATE_ENTREPRENEURIAL", performance_bond_cents: 30000000 }
              as: ProgramAdmin
              captures: { sponsor_a: $.data.id }
            - call: "POST /mitigation/sponsors"
              payload: { legal_name: "Blackwater Restoration Trust", legal_entity_type: "NGO", performance_bond_cents: 30000000 }
              as: ProgramAdmin
              captures: { sponsor_b: $.data.id }
            - call: "POST /mitigation/banks"
              payload: { sponsor_id: "${sponsor_a}", site_name: "Cypress Bend", site_huc8_code: "03130002", service_area_huc8_codes: ["03130002", "03130003"], hgm_class: "DEPRESSIONAL", annual_stewardship_cost_cents: 4200000 }
              as: Sponsor
              as_user_id: "${sponsor_a}"
              captures: { bank_a1: $.data.id }
            - call: "POST /mitigation/banks"
              payload: { sponsor_id: "${sponsor_a}", site_name: "Cypress Bend North", site_huc8_code: "03130003", service_area_huc8_codes: ["03130003"], hgm_class: "RIVERINE", annual_stewardship_cost_cents: 3000000 }
              as: Sponsor
              as_user_id: "${sponsor_a}"
              captures: { bank_a2: $.data.id }
            - call: "POST /mitigation/banks"
              payload: { sponsor_id: "${sponsor_b}", site_name: "Blackwater Flats", site_huc8_code: "03140101", service_area_huc8_codes: ["03140101"], hgm_class: "FLATS", annual_stewardship_cost_cents: 2000000 }
              as: Sponsor
              as_user_id: "${sponsor_b}"
              captures: { bank_b1: $.data.id }
          trigger:
            - call: "GET /mitigation/banks"
              payload: { sponsor_id: "${sponsor_a}", limit: 1, offset: 0 }
              as: ProgramAdmin
              captures: { first_page_bank: "$.data[0].id" }
            - call: "GET /mitigation/banks"
              payload: { sponsor_id: "${sponsor_a}", limit: 1, offset: 1 }
              as: ProgramAdmin
              captures: { second_page_bank: "$.data[0].id" }
            - call: "GET /mitigation/banks"
              payload: { status: "DRAFT", limit: 10, offset: 0 }
              as: ProgramAdmin
          assert:
            - "first page: total_count == 2, has_more == true, len(data) == 1"
            - "second page: total_count == 2, has_more == false, len(data) == 1"
            - "${first_page_bank} != ${second_page_bank} and both are in {${bank_a1}, ${bank_a2}}"
            - "neither page contains ${bank_b1}"
            - "unfiltered DRAFT listing: total_count == 3, has_more == false, len(data) == 3"
            - "Sponsor.${sponsor_a}.banks_count == 2 and Sponsor.${sponsor_b}.banks_count == 1"

      - name: unknown_ids_return_entity_specific_not_found_errors
        claim_type: not_found
        grounds:
          - validations[priority=20]
          - errors[ERR_SPONSOR_NOT_FOUND]
          - errors[ERR_PERMITTEE_NOT_FOUND]
          - errors[ERR_IRT_MEMBER_NOT_FOUND]
          - errors[ERR_BANK_NOT_FOUND]
          - errors[ERR_PROSPECTUS_NOT_FOUND]
          - errors[ERR_WORK_PLAN_NOT_FOUND]
          - errors[ERR_MILESTONE_NOT_FOUND]
          - errors[ERR_MONITORING_REPORT_NOT_FOUND]
          - errors[ERR_REMEDIAL_ACTION_NOT_FOUND]
          - errors[ERR_CREDIT_SALE_NOT_FOUND]
        distinguishing_aspect: "Priority-20 path resolution returns a DIFFERENT error_id per collection: ten reads/writes against the same non-existent UUID yield ten distinct 404 codes, never a generic one."
        test_recipe:
          setup:
            - "Empty database (no row of any kind exists), clock 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "GET /mitigation/sponsors/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ProgramAdmin
              captures: { e_sponsor: $.data.error_id }
            - call: "GET /mitigation/permittees/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ProgramAdmin
              captures: { e_permittee: $.data.error_id }
            - call: "GET /mitigation/irt-members/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ProgramAdmin
              captures: { e_member: $.data.error_id }
            - call: "GET /mitigation/banks/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ProgramAdmin
              captures: { e_bank: $.data.error_id }
            - call: "GET /mitigation/prospectuses/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ProgramAdmin
              captures: { e_prospectus: $.data.error_id }
            - call: "POST /mitigation/work-plans/00000000-0000-0000-0000-000000000000/submit"
              payload: {}
              as: Sponsor
              as_user_id: "00000000-0000-0000-0000-000000000000"
              captures: { e_work_plan: $.data.error_id }
            - call: "GET /mitigation/milestones/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ProgramAdmin
              captures: { e_milestone: $.data.error_id }
            - call: "GET /mitigation/monitoring-reports/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ProgramAdmin
              captures: { e_report: $.data.error_id }
            - call: "GET /mitigation/remedial-actions/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ProgramAdmin
              captures: { e_action: $.data.error_id }
            - call: "GET /mitigation/credit-sales/00000000-0000-0000-0000-000000000000"
              payload: {}
              as: ProgramAdmin
              captures: { e_sale: $.data.error_id }
          assert:
            - "${e_sponsor} == ERR_SPONSOR_NOT_FOUND with HTTP 404"
            - "${e_permittee} == ERR_PERMITTEE_NOT_FOUND with HTTP 404"
            - "${e_member} == ERR_IRT_MEMBER_NOT_FOUND with HTTP 404"
            - "${e_bank} == ERR_BANK_NOT_FOUND with HTTP 404"
            - "${e_prospectus} == ERR_PROSPECTUS_NOT_FOUND with HTTP 404"
            - "${e_work_plan} == ERR_WORK_PLAN_NOT_FOUND with HTTP 404"
            - "${e_milestone} == ERR_MILESTONE_NOT_FOUND with HTTP 404"
            - "${e_report} == ERR_MONITORING_REPORT_NOT_FOUND with HTTP 404"
            - "${e_action} == ERR_REMEDIAL_ACTION_NOT_FOUND with HTTP 404"
            - "${e_sale} == ERR_CREDIT_SALE_NOT_FOUND with HTTP 404"

      - name: bank_creation_missing_required_fields_rejected
        claim_type: required_fields
        grounds:
          - entities.MitigationBank.required_fields
          - validations[priority=10]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "Omitting any one of site_name, site_huc8_code or annual_stewardship_cost_cents from POST /mitigation/banks yields 422 ERR_INVALID_REQUEST and creates nothing — the missing field is not silently defaulted, and sponsor.banks_count stays 0."
        test_recipe:
          setup:
            - "One registered sponsor, no banks, clock 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /mitigation/sponsors"
              payload: { legal_name: "Cypress Bend Mitigation LLC", legal_entity_type: "PRIVATE_ENTREPRENEURIAL", performance_bond_cents: 30000000 }
              as: ProgramAdmin
              captures: { sponsor_id: $.data.id }
          trigger:
            - call: "POST /mitigation/banks"
              payload: { sponsor_id: "${sponsor_id}", site_huc8_code: "03130002", service_area_huc8_codes: ["03130002"], hgm_class: "DEPRESSIONAL", annual_stewardship_cost_cents: 4200000 }
              as: Sponsor
              as_user_id: "${sponsor_id}"
              captures: { e_no_name: $.data.error_id }
            - call: "POST /mitigation/banks"
              payload: { sponsor_id: "${sponsor_id}", site_name: "Cypress Bend", service_area_huc8_codes: ["03130002"], hgm_class: "DEPRESSIONAL", annual_stewardship_cost_cents: 4200000 }
              as: Sponsor
              as_user_id: "${sponsor_id}"
              captures: { e_no_huc: $.data.error_id }
            - call: "POST /mitigation/banks"
              payload: { sponsor_id: "${sponsor_id}", site_name: "Cypress Bend", site_huc8_code: "03130002", service_area_huc8_codes: ["03130002"], hgm_class: "DEPRESSIONAL" }
              as: Sponsor
              as_user_id: "${sponsor_id}"
              captures: { e_no_cost: $.data.error_id }
            - call: "GET /mitigation/banks"
              payload: { sponsor_id: "${sponsor_id}", limit: 10, offset: 0 }
              as: ProgramAdmin
          assert:
            - "${e_no_name} == ERR_INVALID_REQUEST with HTTP 422"
            - "${e_no_huc} == ERR_INVALID_REQUEST with HTTP 422"
            - "${e_no_cost} == ERR_INVALID_REQUEST with HTTP 422"
            - "GET /mitigation/banks: total_count == 0"
            - "Sponsor.${sponsor_id}.banks_count == 0"

      - name: optional_inputs_fall_back_to_declared_defaults
        claim_type: defaults
        grounds:
          - entities.Sponsor.fields.performance_bond_cents
          - entities.IRTMember.fields.roster_status
          - entities.Prospectus.fields.revision_round
          - entities.Prospectus.fields.concur_count
        distinguishing_aspect: "Omitting performance_bond_cents yields 0 (not null and not a rejection); omitting roster_status yields SEATED; a fresh prospectus is stamped revision_round 1 with concur_count, object_count and abstain_count all 0."
        test_recipe:
          setup:
            - "Empty database, clock 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /mitigation/sponsors"
              payload: { legal_name: "Cypress Bend Mitigation LLC", legal_entity_type: "PRIVATE_ENTREPRENEURIAL" }
              as: ProgramAdmin
              captures: { sponsor_id: $.data.id }
            - call: "POST /mitigation/irt-members"
              payload: { member_name: "R. Alvarez", agency: "USACE" }
              as: ProgramAdmin
              captures: { member_id: $.data.id }
            - call: "POST /mitigation/banks"
              payload: { sponsor_id: "${sponsor_id}", site_name: "Cypress Bend", site_huc8_code: "03130002", service_area_huc8_codes: ["03130002"], hgm_class: "DEPRESSIONAL", annual_stewardship_cost_cents: 4200000 }
              as: Sponsor
              as_user_id: "${sponsor_id}"
              captures: { bank_id: $.data.id }
            - call: "POST /mitigation/prospectuses"
              payload: { bank_id: "${bank_id}", objective_summary: "Restore 205 acres of depressional wetland", proposed_credits: 98.77 }
              as: Sponsor
              as_user_id: "${sponsor_id}"
              captures: { prospectus_id: $.data.id }
          assert:
            - "Sponsor.${sponsor_id}.performance_bond_cents == 0"
            - "IRTMember.${member_id}.roster_status == SEATED"
            - "Prospectus.${prospectus_id}.revision_round == 1"
            - "Prospectus.${prospectus_id}.concur_count == 0"
            - "Prospectus.${prospectus_id}.object_count == 0"
            - "Prospectus.${prospectus_id}.abstain_count == 0"
            - "Prospectus.${prospectus_id}.status == DRAFT"

      - name: computed_fields_are_derived_from_inputs_not_supplied_values
        claim_type: computed_fields
        grounds:
          - entities.IRTMember.fields.veto_authority
          - entities.Permittee.fields.unmet_requirement_credits
        distinguishing_aspect: "veto_authority is computed from agency alone — true for USACE, false for EPA and STATE_DEQ — and unmet_requirement_credits is computed as required_credits minus assigned_credits, so it equals required_credits on a brand-new permittee."
        test_recipe:
          setup:
            - "Empty database, clock 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
          trigger:
            - call: "POST /mitigation/irt-members"
              payload: { member_name: "R. Alvarez", agency: "USACE" }
              as: ProgramAdmin
              captures: { m_corps_id: $.data.id }
            - call: "POST /mitigation/irt-members"
              payload: { member_name: "T. Nakamura", agency: "EPA" }
              as: ProgramAdmin
              captures: { m_epa_id: $.data.id }
            - call: "POST /mitigation/irt-members"
              payload: { member_name: "L. Okonkwo", agency: "STATE_DEQ" }
              as: ProgramAdmin
              captures: { m_deq_id: $.data.id }
            - call: "POST /mitigation/permittees"
              payload: { organization_name: "Delta Logistics Park", permit_number: "COE-2026-00417", impact_huc8_code: "03130002", required_credits: 7.25 }
              as: ProgramAdmin
              captures: { permittee_id: $.data.id }
          assert:
            - "IRTMember.${m_corps_id}.veto_authority == true"
            - "IRTMember.${m_epa_id}.veto_authority == false"
            - "IRTMember.${m_deq_id}.veto_authority == false"
            - "Permittee.${permittee_id}.required_credits == 7.25"
            - "Permittee.${permittee_id}.assigned_credits == 0.00"
            - "Permittee.${permittee_id}.unmet_requirement_credits == 7.25"

      - name: system_fields_are_stamped_by_the_server_from_the_logical_clock
        claim_type: system_fields
        grounds:
          - entities.MitigationBank.fields.created_at
          - entities.MitigationBank.fields.version
          - endpoints[POST /_clock/set_current_utc]
        distinguishing_aspect: "created_at is taken from the logical clock, not from wall time or a client field: a bank created while the clock reads 2026-08-01T00:00:00Z has exactly that created_at, and a prospectus created after the clock advances to 2026-08-15T00:00:00Z carries the later stamp while the bank's created_at is unchanged."
        test_recipe:
          setup:
            - "Clock pinned at 2026-08-01T00:00:00Z, one sponsor."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /mitigation/sponsors"
              payload: { legal_name: "Cypress Bend Mitigation LLC", legal_entity_type: "PRIVATE_ENTREPRENEURIAL", performance_bond_cents: 30000000 }
              as: ProgramAdmin
              captures: { sponsor_id: $.data.id }
          trigger:
            - call: "POST /mitigation/banks"
              payload: { sponsor_id: "${sponsor_id}", site_name: "Cypress Bend", site_huc8_code: "03130002", service_area_huc8_codes: ["03130002"], hgm_class: "DEPRESSIONAL", annual_stewardship_cost_cents: 4200000 }
              as: Sponsor
              as_user_id: "${sponsor_id}"
              captures: { bank_id: $.data.id, bank_created_at: $.data.created_at, bank_version: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-15T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /mitigation/prospectuses"
              payload: { bank_id: "${bank_id}", objective_summary: "Restore 205 acres of depressional wetland", proposed_credits: 98.77 }
              as: Sponsor
              as_user_id: "${sponsor_id}"
              captures: { prospectus_id: $.data.id, prospectus_created_at: $.data.created_at }
            - call: "GET /mitigation/banks/${bank_id}"
              payload: {}
              as: Sponsor
              as_user_id: "${sponsor_id}"
          assert:
            - "${bank_created_at} == 2026-08-01T00:00:00Z"
            - "${bank_version} == 1"
            - "${prospectus_created_at} == 2026-08-15T00:00:00Z"
            - "MitigationBank.${bank_id}.created_at == 2026-08-01T00:00:00Z"
            - "MitigationBank.${bank_id}.updated_at == 2026-08-01T00:00:00Z (creating a prospectus does not touch the bank row)"
            - "MitigationBank.${bank_id}.version == 1"

      - name: creation_with_invalid_enum_and_interval_inputs_is_rejected
        claim_type: type_constraints
        grounds:
          - entities.MitigationBank.fields.hgm_class
          - entities.MitigationBank.fields.site_huc8_code
          - entities.ReleaseMilestone.fields.release_pct
          - validations[priority=10]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "Priority-10 schema validation rejects an out-of-enum hgm_class (\"BOG\"), a HUC-8 code that is not exactly eight digits (\"0313\"), a release_pct above 1.000 and a window whose end is not strictly after its start — all four as 422 ERR_INVALID_REQUEST, before any state or ownership check runs."
        test_recipe:
          setup:
            - "One sponsor and one DRAFT bank (state is irrelevant: priority 10 precedes priority 30/40)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ProgramAdmin
            - call: "POST /mitigation/sponsors"
              payload: { legal_name: "Cypress Bend Mitigation LLC", legal_entity_type: "PRIVATE_ENTREPRENEURIAL", performance_bond_cents: 30000000 }
              as: ProgramAdmin
              captures: { sponsor_id: $.data.id }
            - call: "POST /mitigation/banks"
              payload: { sponsor_id: "${sponsor_id}", site_name: "Cypress Bend", site_huc8_code: "03130002", service_area_huc8_codes: ["03130002"], hgm_class: "DEPRESSIONAL", annual_stewardship_cost_cents: 4200000 }
              as: Sponsor
              as_user_id: "${sponsor_id}"
              captures: { bank_id: $.data.id }
          trigger:
            - call: "POST /mitigation/banks"
              payload: { sponsor_id: "${sponsor_id}", site_name: "Peat Hollow", site_huc8_code: "03130004", service_area_huc8_codes: ["03130004"], hgm_class: "BOG", annual_stewardship_cost_cents: 4200000 }
              as: Sponsor
              as_user_id: "${sponsor_id}"
              captures: { e_enum: $.data.error_id }
