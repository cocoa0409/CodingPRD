            - { call: "POST /f2s/compliance-documents", payload: { farm_id: "${farm}", doc_type: "SAFETY_CERT", issuer: "StateAg", effective_on: "2026-01-01", expires_on: "2027-12-31" }, as: FarmManager, as_user_id: "${farm}" }
            - { call: "POST /f2s/compliance-documents", payload: { farm_id: "${farm}", doc_type: "LIABILITY_INSURANCE", issuer: "InsCo", coverage_cents: 600000, effective_on: "2026-01-01", expires_on: "2027-12-31" }, as: FarmManager, as_user_id: "${farm}" }
            - { call: "POST /f2s/farms/${farm}/approve", payload: {}, as: DistrictProgramAdmin }
            - { call: "POST /f2s/offerings", payload: { farm_id: "${farm}", program_year_id: "${yr}", product_id: "${prod}", price_cents_per_unit: 250, max_weekly_quantity: 500, harvest_start_week: 4, harvest_end_week: 12 }, as: FarmManager, as_user_id: "${farm}", captures: { off: $.data.id } }
            - { call: "POST /f2s/offerings/${off}/submit", payload: {}, as: FarmManager, as_user_id: "${farm}" }
            - { call: "POST /f2s/offerings/${off}/verify", payload: {}, as: DistrictProgramAdmin }
            - { call: "POST /f2s/forecast-lines", payload: { program_year_id: "${yr}", product_id: "${prod}", week_number: 6, planned_quantity: 400 }, as: DistrictProgramAdmin }
            - { call: "POST /f2s/kitchens", payload: { name: "Lincoln ES" }, as: DistrictProgramAdmin, captures: { kit: $.data.id } }
            - { call: "POST /f2s/receiving-windows", payload: { kitchen_id: "${kit}", weekday: "MON", start_minute: 480, end_minute: 720, capacity_deliveries: 3 }, as: KitchenManager, as_user_id: "${kit}", captures: { win: $.data.id } }
            - { call: "POST /f2s/planting-agreements", payload: { program_year_id: "${yr}", offering_id: "${off}", committed_quantity: 200, harvest_start_week: 5, harvest_end_week: 10 }, as: DistrictProgramAdmin, captures: { agr: $.data.id } }
            - { call: "POST /f2s/planting-agreements/${agr}/sign", payload: {}, as: FarmManager, as_user_id: "${farm}" }
            - { call: "POST /f2s/deliveries", payload: { agreement_id: "${agr}", kitchen_id: "${kit}", window_id: "${win}", delivery_date: "2026-08-10", quantity: 40 }, as: FarmManager, as_user_id: "${farm}", captures: { del_ok: $.data.id } }
            - { call: "POST /f2s/deliveries", payload: { agreement_id: "${agr}", kitchen_id: "${kit}", window_id: "${win}", delivery_date: "2026-08-10", quantity: 10 }, as: FarmManager, as_user_id: "${farm}", captures: { del_bad: $.data.id } }
          trigger:
            - { call: "POST /f2s/deliveries/${del_ok}/check-in", payload: {}, as: KitchenManager, as_user_id: "${kit}" }
            - { call: "POST /f2s/deliveries/${del_ok}/accept", payload: { accepted_quantity: 40 }, as: KitchenManager, as_user_id: "${kit}" }
            - { call: "POST /f2s/deliveries/${del_bad}/check-in", payload: {}, as: KitchenManager, as_user_id: "${kit}" }
            - { call: "POST /f2s/deliveries/${del_bad}/reject", payload: { reason: "spoiled" }, as: KitchenManager, as_user_id: "${kit}" }
            - { call: "GET /f2s/planting-agreements/${agr}", payload: {}, as: DistrictProgramAdmin, captures: { delivered: $.data.delivered_quantity, agr_status: $.data.status } }
          assert:
            - "Delivery.${del_ok}.status == ACCEPTED AND Delivery.${del_bad}.status == REJECTED"
            - "PlantingAgreement.${agr}.delivered_quantity == 40 (rejected fork added nothing)"
            - "PlantingAgreement.${agr}.status == FULFILLING"

  # ===========================================================================
  # Rule 4 - transitive_cascade (depth-4 farm suspension; depth-3 claim
  # disallow; different triggers)
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: farm_suspension_depth4_cascade
        grounds:
          - state_machines.Farm.APPROVED_to_SUSPENDED
          - state_machines.FarmProductOffering.VERIFIED_to_SUSPENDED
          - state_machines.PlantingAgreement.FULFILLING_to_BREACHED
          - state_machines.Delivery.SCHEDULED_to_CANCELLED
          - state_machines.Invoice.DRAFT_to_VOIDED
        distinguishing_aspect: |
          Depth-4 chain from POST /f2s/farms/{id}/suspend: farm SUSPENDED causes
          offering SUSPENDED (1), which breaches its agreement (2), which cancels
          its SCHEDULED delivery (3) and voids its DRAFT invoice (4). The
          CHECKED_IN delivery is untouched (conditional cascade).
        test_recipe:
          setup:
            - "APPROVED farm with VERIFIED offering; agreement committed 200 SIGNED then FULFILLING"
            - "Delivery S (qty 40) still SCHEDULED; delivery C (qty 10) CHECKED_IN; delivery A (qty 40) ACCEPTED with DRAFT invoice"
          setup_api_calls:
