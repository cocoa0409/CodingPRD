              as: FranchisorOps
              captures: { chef_id: $.data.id }
            - call: "POST /kiosk-ops/chefs/${chef_id}/training"
              payload: { hours: 30, curriculum_code: "HS-CORE-24" }
              as: FranchisorOps
            - call: "POST /kiosk-ops/chefs/${chef_id}/certifications"
              payload: { cert_type: "FOOD_HANDLER", exam_score: 92, issued_at: "2026-08-01T00:00:00Z", valid_days: 365 }
              as: QualityAuditor
              captures: { cert_fh_id: $.data.id }
            - call: "POST /kiosk-ops/chefs/${chef_id}/certifications"
              payload: { cert_type: "HACCP_RICE_ACIDIFICATION", exam_score: 95, issued_at: "2026-08-01T00:00:00Z", valid_days: 365 }
              as: QualityAuditor
              captures: { cert_hc_id: $.data.id }
