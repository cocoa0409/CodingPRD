  # ===========================================================================
  # Rule 5 — priority_pair_validation_conflict (two instances, different pairs)
  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_fiscal_on_invoice_issue
        grounds:
          - validations[priority=5]
          - validations[priority=10]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_CREDIT_LIMIT_EXCEEDED]
        distinguishing_aspect: |
          Pair (state, business_fiscal): issuing an invoice that is already
          ISSUED while the customer is also over credit limit must return the
          state error ERR_INVALID_STATE (priority 5), not
          ERR_CREDIT_LIMIT_EXCEEDED (priority 10) — state beats fiscal.
        test_recipe:
          setup:
            - "Plant P; COG customer C with credit_limit_cents=0 (any positive charge exceeds limit once balance > 0)"
            - "Category TOWEL cog rate 120, piece_weight_lb 0.5"
            - "Full pipeline → one FINISHED load of 100 pieces (50 lb → 6000 cents)"
            - "Invoice I generated and issued once (account_balance_cents = 6000 > 0 = credit_limit → subsequent issues would fail fiscal check if they reached it)"
          setup_api_calls:
            - call: "POST /plants"
              payload: { name: "P", reject_rate_alert_pct: 25.0, par_shortage_alert_pieces: 5, utility_baseline_kwh_per_lb: 1.0, utility_baseline_gal_per_lb: 2.0 }
              as: PlantAdmin
