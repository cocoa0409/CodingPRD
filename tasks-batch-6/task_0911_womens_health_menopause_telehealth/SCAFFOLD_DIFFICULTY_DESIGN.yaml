            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-25T00:00:00Z" }
              as: BillingAdmin
            - call: "POST /visits"
              payload: { patient_id: "${pat_id}", provider_id: "${prov_id}", intake_assessment_id: "${intake_id}", scheduled_start: "2026-06-25T09:00:00Z", scheduled_end: "2026-06-25T10:00:00Z" }
