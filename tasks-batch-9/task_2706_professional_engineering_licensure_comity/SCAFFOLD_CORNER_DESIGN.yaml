              captures: { case_pim_v2: $.data.version }
            - call: "POST /consent-orders"
              payload: { case_id: "${case_pim}", sanction_type: "SUSPENSION", suspension_months: 6, penalty_paid_cents: 298000, expected_case_version: "${case_pim_v2}" }
              as: BoardInvestigator
