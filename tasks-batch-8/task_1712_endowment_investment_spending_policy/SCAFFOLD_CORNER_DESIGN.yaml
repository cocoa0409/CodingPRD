# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Breadth walk over SCAFFOLD.yaml §1.1–§1.7 per references/claim-extraction-guide.
# Instances already exercised by §1.8 are emitted as excluded_because stubs.
# =============================================================================
scaffold_corner_design:
  # ===================== Section: entities =====================
  - section: entities
    instances:
      - name: pool_creation_applies_system_defaults
        claim_type: creation_defaults
        grounds: [entities.EndowmentPool]
        distinguishing_aspect: "A new pool starts ACTIVE at quarter 0 with the inception unit price and zero units/MV, version 1."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - { call: "POST /endowment/pools", payload: { pool_name: "Pool NEW", inception_fiscal_year: 2026 }, as: EndowmentAdmin, captures: { nw_pool: $.data.id } }
          trigger:
            - { call: "GET /endowment/pools/${nw_pool}", as: EndowmentAdmin }
          assert:
            - "pool_status == ACTIVE, current_quarter_index == 0, current_unit_price_millicents == 100000, total_units_outstanding_micro == 0, total_market_value_cents == 0, version == 1"

      - name: fund_get_not_found_returns_404
        claim_type: not_found
        grounds: [entities.Fund, "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "Reading a fund by a well-formed but nonexistent UUID returns the error envelope with ERR_NOT_FOUND."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /endowment/funds/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", as: DevelopmentOfficer, captures: { nf_err: $.data.error_id } }
          assert:
            - "http 404 and error_id == ERR_NOT_FOUND"

      - name: create_missing_required_field_and_invalid_enum_rejected
        claim_type: required_fields_and_type_constraints
        grounds: [entities.EndowmentPool, entities.Donor, "validations[priority=4]"]
        distinguishing_aspect: "Missing inception_fiscal_year on pool create and a non-enum donor_type on donor create both fail with ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /endowment/pools", payload: { pool_name: "No FY" }, as: EndowmentAdmin, captures: { ir_err1: $.data.error_id } }
            - { call: "POST /endowment/donors", payload: { donor_name: "Bad", donor_type: "ROBOT" }, as: DevelopmentOfficer, captures: { ir_err2: $.data.error_id } }
          assert:
            - "both calls return http 400 with error_id == ERR_INVALID_REQUEST"

      - name: term_fund_requires_term_end_and_other_classes_forbid_it
        claim_type: type_constraints
        grounds: [entities.Fund.fields.term_end_quarter_index, entities.Fund.fields.endowment_class]
        distinguishing_aspect: "TERM_ENDOWMENT without term_end_quarter_index and TRUE_ENDOWMENT carrying one are both ERR_INVALID_REQUEST; TERM with term_end_quarter_index succeeds."
        test_recipe:
          setup: ["one pool exists"]
          setup_api_calls:
            - { call: "POST /endowment/pools", payload: { pool_name: "Pool TC", inception_fiscal_year: 2026 }, as: EndowmentAdmin, captures: { tc_pool: $.data.id } }
          trigger:
            - { call: "POST /endowment/funds", payload: { pool_id: "${tc_pool}", fund_code: "FT1", fund_name: "Bad Term", endowment_class: TERM_ENDOWMENT, purpose_restriction: UNRESTRICTED }, as: DevelopmentOfficer, captures: { tc_err1: $.data.error_id } }
            - { call: "POST /endowment/funds", payload: { pool_id: "${tc_pool}", fund_code: "FT2", fund_name: "Bad True", endowment_class: TRUE_ENDOWMENT, term_end_quarter_index: 8, purpose_restriction: UNRESTRICTED }, as: DevelopmentOfficer, captures: { tc_err2: $.data.error_id } }
            - { call: "POST /endowment/funds", payload: { pool_id: "${tc_pool}", fund_code: "FT3", fund_name: "Good Term", endowment_class: TERM_ENDOWMENT, term_end_quarter_index: 8, purpose_restriction: UNRESTRICTED }, as: DevelopmentOfficer, captures: { tc_ok: $.data.fund_status } }
          assert:
            - "first two calls return ERR_INVALID_REQUEST (400)"
            - "third call returns 201 with fund_status == DRAFT"

      - name: donor_total_contributed_computed_on_receive_and_compensated_on_rescind
        claim_type: computed_fields
        grounds: [entities.Donor.fields.total_contributed_cents, state_machines.GiftContribution.RECEIVED_to_RETURNED]
        distinguishing_aspect: "Receive credits the donor total; rescind debits it exactly (compensation), and the fund's pledged corpus moves in lockstep — observable on both entities."
        test_recipe:
          setup: ["pool, ACTIVE fund FDC (pledged via gift G), donor"]
          setup_api_calls:
            - { call: "POST /endowment/pools", payload: { pool_name: "Pool DC", inception_fiscal_year: 2026 }, as: EndowmentAdmin, captures: { dc_pool: $.data.id } }
            - { call: "POST /endowment/funds", payload: { pool_id: "${dc_pool}", fund_code: "FDC", fund_name: "Fund DC", endowment_class: TRUE_ENDOWMENT, purpose_restriction: UNRESTRICTED }, as: DevelopmentOfficer, captures: { dc_fund: $.data.id } }
            - { call: "POST /endowment/donors", payload: { donor_name: "D DC", donor_type: ESTATE }, as: DevelopmentOfficer, captures: { dc_donor: $.data.id } }
            - { call: "POST /endowment/gifts", payload: { fund_id: "${dc_fund}", donor_id: "${dc_donor}", external_ref: "DC1", gift_type: CORPUS, amount_cents: 5000000 }, as: DevelopmentOfficer, captures: { dc_g: $.data.id } }
            - { call: "POST /endowment/funds/${dc_fund}/activate", payload: {}, as: DevelopmentOfficer }
            - { call: "POST /endowment/gifts/${dc_g}/receive", payload: {}, as: DevelopmentOfficer }
            - { call: "GET /endowment/donors/${dc_donor}", as: DevelopmentOfficer, captures: { dc_tot1: $.data.total_contributed_cents } }
          trigger:
            - { call: "POST /endowment/gifts/${dc_g}/rescind", payload: {}, as: DevelopmentOfficer }
            - { call: "GET /endowment/donors/${dc_donor}", as: DevelopmentOfficer, captures: { dc_tot2: $.data.total_contributed_cents } }
            - { call: "GET /endowment/funds/${dc_fund}", as: DevelopmentOfficer, captures: { dc_pledged: $.data.pledged_corpus_cents } }
          assert:
            - "after receive: donor.total_contributed_cents == 5000000"
            - "after rescind: donor.total_contributed_cents == 0 and gift_status == RETURNED"
            - "after rescind: fund.pledged_corpus_cents == 0 (the activate-time pledge was compensated)"

      - name: ledger_entries_are_append_only_and_carry_unitization_fields
        claim_type: immutability
        grounds: [entities.UnitLedgerEntry, state_machines.GiftContribution.RECEIVED_to_UNITIZED]
        distinguishing_aspect: "Unitization emits a GIFT_UNITIZE ledger row (positive units/amount, quarter 1, reference to the gift); UnitLedgerEntry has common_fields false — no version/updated_at and no mutating endpoint exists."
        test_recipe:
          setup: ["pool with allocation, ACTIVE fund FLE with CORPUS gift 5000000 RECEIVED in Q1; Q1 finalized with no managers (MV 0)"]
          setup_api_calls:
            - { call: "POST /endowment/pools", payload: { pool_name: "Pool LE", inception_fiscal_year: 2026 }, as: EndowmentAdmin, captures: { le_pool: $.data.id, le_pv: $.data.version } }
            - { call: "POST /endowment/allocations/bulk_upsert", payload: { pool_id: "${le_pool}", items: [ { asset_class: CASH, target_pct_bps: 10000, rebalance_band_bps: 500 } ] }, as: EndowmentAdmin }
            - { call: "POST /endowment/funds", payload: { pool_id: "${le_pool}", fund_code: "FLE", fund_name: "Fund LE", endowment_class: TRUE_ENDOWMENT, purpose_restriction: UNRESTRICTED }, as: DevelopmentOfficer, captures: { le_fund: $.data.id } }
            - { call: "POST /endowment/donors", payload: { donor_name: "D LE", donor_type: INDIVIDUAL }, as: DevelopmentOfficer, captures: { le_donor: $.data.id } }
            - { call: "POST /endowment/gifts", payload: { fund_id: "${le_fund}", donor_id: "${le_donor}", external_ref: "LE1", gift_type: CORPUS, amount_cents: 5000000 }, as: DevelopmentOfficer, captures: { le_g: $.data.id } }
            - { call: "POST /endowment/funds/${le_fund}/activate", payload: {}, as: DevelopmentOfficer }
            - { call: "POST /endowment/gifts/${le_g}/receive", payload: {}, as: DevelopmentOfficer }
            - { call: "POST /endowment/valuations", payload: { pool_id: "${le_pool}", estimated_pool_market_value_cents: 0 }, as: InvestmentOfficer, captures: { le_v1: $.data.id } }
          trigger:
            - { call: "POST /endowment/valuations/${le_v1}/finalize", payload: { final_pool_market_value_cents: 0, expected_pool_version: "${le_pv}" }, as: InvestmentOfficer }
            - { call: "GET /endowment/ledger-entries?fund_id=${le_fund}&entry_type=GIFT_UNITIZE", as: InvestmentOfficer, captures: { le_units: "$.data[0].units_delta_micro", le_amt: "$.data[0].amount_cents", le_q: "$.data[0].quarter_index", le_ref: "$.data[0].reference_id" } }
          assert:
            - "exactly one GIFT_UNITIZE row: units_delta_micro == 50000000000, amount_cents == 5000000, quarter_index == 1, reference_id == ${le_g}"
            - "the row has no version or updated_at field (immutable append-only entity)"

  # ===================== Section: state_machines =====================
  - section: state_machines
    instances:
      - name: gift_initial_state_and_receive_side_effects
        claim_type: initial_state_and_side_effects
        grounds: [state_machines.GiftContribution.PLEDGED_to_RECEIVED]
        distinguishing_aspect: "A created gift starts PLEDGED; receive stamps the open quarter and computes the provisional estimate at the latest FINAL price."
        test_recipe:
          setup: ["pool with allocation and one finalized quarter at price 100000 (zero-manager pool, MV 0), ACTIVE fund FGS"]
          setup_api_calls:
            - { call: "POST /endowment/pools", payload: { pool_name: "Pool GS", inception_fiscal_year: 2026 }, as: EndowmentAdmin, captures: { gs_pool: $.data.id, gs_pv: $.data.version } }
            - { call: "POST /endowment/allocations/bulk_upsert", payload: { pool_id: "${gs_pool}", items: [ { asset_class: CASH, target_pct_bps: 10000, rebalance_band_bps: 500 } ] }, as: EndowmentAdmin }
            - { call: "POST /endowment/valuations", payload: { pool_id: "${gs_pool}", estimated_pool_market_value_cents: 0 }, as: InvestmentOfficer, captures: { gs_v1: $.data.id } }
            - { call: "POST /endowment/valuations/${gs_v1}/finalize", payload: { final_pool_market_value_cents: 0, expected_pool_version: "${gs_pv}" }, as: InvestmentOfficer }
            - { call: "POST /endowment/funds", payload: { pool_id: "${gs_pool}", fund_code: "FGS", fund_name: "Fund GS", endowment_class: TRUE_ENDOWMENT, purpose_restriction: UNRESTRICTED }, as: DevelopmentOfficer, captures: { gs_fund: $.data.id } }
            - { call: "POST /endowment/donors", payload: { donor_name: "D GS", donor_type: INDIVIDUAL }, as: DevelopmentOfficer, captures: { gs_donor: $.data.id } }
            - { call: "POST /endowment/gifts", payload: { fund_id: "${gs_fund}", donor_id: "${gs_donor}", external_ref: "GS0", gift_type: CORPUS, amount_cents: 5000000 }, as: DevelopmentOfficer }
            - { call: "POST /endowment/gifts", payload: { fund_id: "${gs_fund}", donor_id: "${gs_donor}", external_ref: "GS1", gift_type: EXPENDABLE, amount_cents: 250000 }, as: DevelopmentOfficer, captures: { gs_g: $.data.id, gs_st0: $.data.gift_status } }
            - { call: "POST /endowment/funds/${gs_fund}/activate", payload: {}, as: DevelopmentOfficer }
          trigger:
            - { call: "POST /endowment/gifts/${gs_g}/receive", payload: {}, as: DevelopmentOfficer, captures: { gs_st1: $.data.gift_status, gs_rq: $.data.received_quarter_index, gs_est: $.data.provisional_units_estimate_micro } }
          assert:
            - "create response had gift_status == PLEDGED"
            - "receive response: gift_status == RECEIVED, received_quarter_index == 2 (one quarter finalized)"
            - "provisional_units_estimate_micro == 2500000000 (round_half_up(250000 * 1e9 / 100000))"

      - name: unitized_gift_rejects_receive_and_rescind_invalid_state
        claim_type: invalid_transition
        grounds: [state_machines.GiftContribution, "errors[ERR_INVALID_STATE_TRANSITION]"]
        distinguishing_aspect: "UNITIZED is terminal for the receive/rescind triggers: both a second receive and a rescind on a UNITIZED gift fail with ERR_INVALID_STATE_TRANSITION and change nothing."
        test_recipe:
          setup: ["zero-manager pool with allocation; ACTIVE fund FUG; gift unitized at the Q1 finalize"]
          setup_api_calls:
            - { call: "POST /endowment/pools", payload: { pool_name: "Pool UG", inception_fiscal_year: 2026 }, as: EndowmentAdmin, captures: { ug_pool: $.data.id, ug_pv: $.data.version } }
            - { call: "POST /endowment/allocations/bulk_upsert", payload: { pool_id: "${ug_pool}", items: [ { asset_class: CASH, target_pct_bps: 10000, rebalance_band_bps: 500 } ] }, as: EndowmentAdmin }
            - { call: "POST /endowment/funds", payload: { pool_id: "${ug_pool}", fund_code: "FUG", fund_name: "Fund UG", endowment_class: TRUE_ENDOWMENT, purpose_restriction: UNRESTRICTED }, as: DevelopmentOfficer, captures: { ug_fund: $.data.id } }
            - { call: "POST /endowment/donors", payload: { donor_name: "D UG", donor_type: INDIVIDUAL }, as: DevelopmentOfficer, captures: { ug_donor: $.data.id } }
            - { call: "POST /endowment/gifts", payload: { fund_id: "${ug_fund}", donor_id: "${ug_donor}", external_ref: "UG1", gift_type: CORPUS, amount_cents: 5000000 }, as: DevelopmentOfficer, captures: { ug_g: $.data.id } }
            - { call: "POST /endowment/funds/${ug_fund}/activate", payload: {}, as: DevelopmentOfficer }
            - { call: "POST /endowment/gifts/${ug_g}/receive", payload: {}, as: DevelopmentOfficer }
            - { call: "POST /endowment/valuations", payload: { pool_id: "${ug_pool}", estimated_pool_market_value_cents: 0 }, as: InvestmentOfficer, captures: { ug_v1: $.data.id } }
            - { call: "POST /endowment/valuations/${ug_v1}/finalize", payload: { final_pool_market_value_cents: 0, expected_pool_version: "${ug_pv}" }, as: InvestmentOfficer }
          trigger:
            - { call: "POST /endowment/gifts/${ug_g}/receive", payload: {}, as: DevelopmentOfficer, captures: { ug_err1: $.data.error_id } }
            - { call: "POST /endowment/gifts/${ug_g}/rescind", payload: {}, as: DevelopmentOfficer, captures: { ug_err2: $.data.error_id } }
          assert:
            - "both calls return http 409 with error_id == ERR_INVALID_STATE_TRANSITION"
            - "GET /endowment/gifts/${ug_g} still shows gift_status == UNITIZED and units_purchased_micro == 50000000000"

      - name: double_finalize_and_terminal_valuation_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.UnitValuation.PRELIMINARY_to_FINAL]
        distinguishing_aspect: "A FINAL valuation cannot be finalized again — the second finalize is rejected before any business check."
        test_recipe:
          setup: ["zero-manager pool with allocation; Q1 valuation already FINAL (pool version advanced by the finalize)"]
          setup_api_calls:
            - { call: "POST /endowment/pools", payload: { pool_name: "Pool DF", inception_fiscal_year: 2026 }, as: EndowmentAdmin, captures: { df_pool: $.data.id, df_pv: $.data.version } }
            - { call: "POST /endowment/allocations/bulk_upsert", payload: { pool_id: "${df_pool}", items: [ { asset_class: CASH, target_pct_bps: 10000, rebalance_band_bps: 500 } ] }, as: EndowmentAdmin }
            - { call: "POST /endowment/valuations", payload: { pool_id: "${df_pool}", estimated_pool_market_value_cents: 0 }, as: InvestmentOfficer, captures: { df_v1: $.data.id } }
            - { call: "POST /endowment/valuations/${df_v1}/finalize", payload: { final_pool_market_value_cents: 0, expected_pool_version: "${df_pv}" }, as: InvestmentOfficer }
            - { call: "GET /endowment/pools/${df_pool}", as: InvestmentOfficer, captures: { df_pv2: $.data.version } }
          trigger:
            - { call: "POST /endowment/valuations/${df_v1}/finalize", payload: { final_pool_market_value_cents: 0, expected_pool_version: "${df_pv2}" }, as: InvestmentOfficer, captures: { df_err: $.data.error_id } }
          assert:
            - "http 409 with error_id == ERR_INVALID_STATE_TRANSITION (FINAL is terminal for finalize; OCC is not even consulted with the now-current version)"

      - name: engaged_manager_cannot_be_terminated_until_watchlisted
        claim_type: precondition_enforcement
        grounds: [state_machines.InvestmentManager.WATCHLIST_to_TERMINATED, "errors[ERR_INVALID_STATE_TRANSITION]"]
        distinguishing_aspect: "Governance guard: terminate from ENGAGED (no negative streak) is rejected; after three negative quarters the same call succeeds from WATCHLIST."
        test_recipe:
          setup: ["pool with allocation; manager ENGAGED with no reports filed yet (zero negative quarters on record)"]
          setup_api_calls:
            - { call: "POST /endowment/pools", payload: { pool_name: "Pool TM", inception_fiscal_year: 2026 }, as: EndowmentAdmin, captures: { tm_pool: $.data.id, tm_pv: $.data.version } }
            - { call: "POST /endowment/allocations/bulk_upsert", payload: { pool_id: "${tm_pool}", items: [ { asset_class: US_EQUITY, target_pct_bps: 10000, rebalance_band_bps: 500 } ] }, as: EndowmentAdmin }
            - { call: "POST /endowment/managers", payload: { pool_id: "${tm_pool}", manager_name: "M TM", asset_class: US_EQUITY, benchmark_code: "SPX", coverage_start_quarter: 1 }, as: InvestmentOfficer, captures: { tm_mgr: $.data.id } }
            - { call: "POST /endowment/managers/${tm_mgr}/engage", payload: {}, as: InvestmentOfficer }
          trigger:
            - { call: "POST /endowment/managers/${tm_mgr}/terminate", payload: {}, as: BoardMember, as_user_id: "bm-1", captures: { tm_err: $.data.error_id } }
          assert:
            - "http 409 with error_id == ERR_INVALID_STATE_TRANSITION (ENGAGED is not a terminable state)"
            - "GET /endowment/managers/${tm_mgr} still shows engagement_status == ENGAGED and coverage_end_quarter null"

      - name: payout_full_spend_closes_and_locks
        claim_type: valid_transition_and_terminal_lockdown
        grounds: [state_machines.ProgramPayout.DISBURSED_to_CLOSED_FULLY_SPENT]
        distinguishing_aspect: "Reporting spent == allocated moves the payout to CLOSED_FULLY_SPENT with unspent 0; any further report_spending is then rejected."
        test_recipe:
          setup: ["pool with allocation, policy ADOPTED, engaged manager, ACTIVE fund FFS with 100000000000 micro-units (gift 10000000, Q1 finalized flat); FY2026 distribution DISTRIBUTED (500000); payout PPS of 200000 DISBURSED"]
          setup_api_calls:
            - { call: "POST /endowment/pools", payload: { pool_name: "Pool FS", inception_fiscal_year: 2026 }, as: EndowmentAdmin, captures: { fs_pool: $.data.id, fs_pv: $.data.version } }
            - { call: "POST /endowment/allocations/bulk_upsert", payload: { pool_id: "${fs_pool}", items: [ { asset_class: US_EQUITY, target_pct_bps: 10000, rebalance_band_bps: 500 } ] }, as: EndowmentAdmin }
            - { call: "POST /endowment/policies", payload: { pool_id: "${fs_pool}", spending_rate_bps: 500, smoothing_window_quarters: 4, band_floor_bps: 0, band_cap_bps: 10000, effective_from_fiscal_year: 2026 }, as: InvestmentOfficer, as_user_id: "io-1", captures: { fs_pol: $.data.id } }
            - { call: "POST /endowment/policies/${fs_pol}/adopt", payload: { expected_pool_version: "${fs_pv}" }, as: BoardMember, as_user_id: "bm-1" }
            - { call: "POST /endowment/managers", payload: { pool_id: "${fs_pool}", manager_name: "M FS", asset_class: US_EQUITY, benchmark_code: "SPX", coverage_start_quarter: 1 }, as: InvestmentOfficer, captures: { fs_mgr: $.data.id } }
            - { call: "POST /endowment/managers/${fs_mgr}/engage", payload: {}, as: InvestmentOfficer }
            - { call: "POST /endowment/funds", payload: { pool_id: "${fs_pool}", fund_code: "FFS", fund_name: "Fund FS", endowment_class: TRUE_ENDOWMENT, purpose_restriction: UNRESTRICTED }, as: DevelopmentOfficer, captures: { fs_fund: $.data.id } }
            - { call: "POST /endowment/donors", payload: { donor_name: "D FS", donor_type: INDIVIDUAL }, as: DevelopmentOfficer, captures: { fs_donor: $.data.id } }
            - { call: "POST /endowment/gifts", payload: { fund_id: "${fs_fund}", donor_id: "${fs_donor}", external_ref: "FS1", gift_type: CORPUS, amount_cents: 10000000 }, as: DevelopmentOfficer, captures: { fs_g: $.data.id } }
            - { call: "POST /endowment/funds/${fs_fund}/activate", payload: {}, as: DevelopmentOfficer }
            - { call: "POST /endowment/gifts/${fs_g}/receive", payload: {}, as: DevelopmentOfficer }
            - { call: "POST /endowment/manager-quarter-reports", payload: { manager_id: "${fs_mgr}", quarter_index: 1, beginning_mv_cents: 0, ending_mv_cents: 10000000, flows: [ { day_offset: 0, amount_cents: 10000000 } ], benchmark_return_bps: 0 }, as: InvestmentOfficer }
            - { call: "POST /endowment/valuations", payload: { pool_id: "${fs_pool}", estimated_pool_market_value_cents: 10000000 }, as: InvestmentOfficer, captures: { fs_v1: $.data.id } }
            - { call: "GET /endowment/pools/${fs_pool}", as: InvestmentOfficer, captures: { fs_pv1: $.data.version } }
            - { call: "POST /endowment/valuations/${fs_v1}/finalize", payload: { final_pool_market_value_cents: 10000000, expected_pool_version: "${fs_pv1}" }, as: InvestmentOfficer }
            - { call: "POST /endowment/distributions", payload: { fund_id: "${fs_fund}", fiscal_year: 2026 }, as: DevelopmentOfficer, as_user_id: "dev-1", captures: { fs_d: $.data.id } }
            - { call: "POST /endowment/distributions/${fs_d}/propose", payload: {}, as: DevelopmentOfficer, as_user_id: "dev-1" }
            - { call: "POST /endowment/distributions/${fs_d}/approve", payload: {}, as: BoardMember, as_user_id: "bm-1" }
            - { call: "POST /endowment/distributions/${fs_d}/distribute", payload: {}, as: InvestmentOfficer }
            - { call: "POST /endowment/payouts", payload: { distribution_id: "${fs_d}", program_code: "LIB-1", program_purpose: RESEARCH, allocated_amount_cents: 200000 }, as: DevelopmentOfficer, captures: { fs_pay: $.data.id } }
            - { call: "POST /endowment/payouts/${fs_pay}/disburse", payload: {}, as: DevelopmentOfficer }
          trigger:
            - { call: "POST /endowment/payouts/${fs_pay}/report_spending", payload: { spent_amount_cents: 200000 }, as: ProgramManager, as_user_id: "pm-1", captures: { fs_pay_st: $.data.payout_status, fs_pay_unspent: $.data.unspent_amount_cents } }
            - { call: "POST /endowment/payouts/${fs_pay}/report_spending", payload: { spent_amount_cents: 200000 }, as: ProgramManager, as_user_id: "pm-1", captures: { fs_pay_err: $.data.error_id } }
          assert:
            - "first report: payout_status == CLOSED_FULLY_SPENT and unspent_amount_cents == 0"
            - "second report on the closed payout: http 409 ERR_INVALID_STATE_TRANSITION"

  # ===================== Section: calculations =====================
  - section: calculations
    instances:
      - name: inception_price_applies_when_zero_units_outstanding
        claim_type: correct_result
        grounds: [calculations.unit_price_calculation]
        distinguishing_aspect: "With zero pre-flow units the FINAL price is the inception constant 100000 regardless of the MV input, and a gift unitizes at that price even though pool MV is 0."
        test_recipe:
          setup: ["zero-manager pool with CASH allocation; ACTIVE fund FZU with a CORPUS gift of 10000000 RECEIVED in Q1; Q1 valuation PRELIMINARY with estimate 0"]
          setup_api_calls:
            - { call: "POST /endowment/pools", payload: { pool_name: "Pool ZU", inception_fiscal_year: 2026 }, as: EndowmentAdmin, captures: { zu_pool: $.data.id, zu_pv: $.data.version } }
            - { call: "POST /endowment/allocations/bulk_upsert", payload: { pool_id: "${zu_pool}", items: [ { asset_class: CASH, target_pct_bps: 10000, rebalance_band_bps: 500 } ] }, as: EndowmentAdmin }
