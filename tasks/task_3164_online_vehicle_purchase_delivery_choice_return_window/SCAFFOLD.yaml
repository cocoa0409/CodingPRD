scenario: |
  Online Vehicle Purchase, Delivery Choice & Return Window (Carvana): online inventory with high-resolution imaging and disclosed imperfection annotation, financing pre-qualification and structuring with real-time payment terms, trade-in offer with condition questionnaire and adjustment at pickup, delivery choice between home delivery and vending machine pickup with appointment scheduling, title and registration processing across states with temporary tag issuance and timeline commitments, seven-day return window with mileage limits and refund processing, reconditioning center throughput and inventory placement across markets, post-sale defect claims and limited warranty repair authorization

domain_name: online-vehicle-purchase
api_prefix: /vehicle-hub

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: temporal_windowing
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - optimistic_concurrency
    - temporal_windowing
  entity_topology: flat
  state_machine_shape: parallel
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: peer_roles
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Customer
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Customer legal full name"
      - name: email
        type: string
        source: input
        description: "Contact email; unique across Customers"
        constraints: "unique"
      - name: state_code
        type: string
        source: input
        description: "Two-letter US state of the customer's registration address; drives title/registration handling"
      - name: default_fulfillment_choice
        type: enum
        source: input
        description: "Preferred fulfillment mode when an order does not override it"
        default: HOME_DELIVERY
        constraints: "one of {HOME_DELIVERY, VENDING_MACHINE}"

  - name: ReconditioningCenter
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Center display name"
      - name: market_code
        type: string
        source: input
        description: "Market the center feeds; placement target market for its vehicles"
      - name: daily_capacity
        type: integer
        source: input
        description: "Maximum number of vehicles that may be IN_WORK on any calendar day"
        constraints: ">= 1"
      - name: slot_count
        type: integer
        source: input
        description: "Physical bay count; caps the number of vehicles co-resident in INTAKE or IN_WORK status at the center"
        constraints: ">= 1"

  - name: Vehicle
    parent: null
    common_fields: true
    fields:
      - name: vin
        type: string
        source: input
        description: "17-char vehicle identification number; unique"
        constraints: "unique, 17 chars"
      - name: make
        type: string
        source: input
        description: "Manufacturer name"
      - name: model
        type: string
        source: input
        description: "Model name"
      - name: year
        type: integer
        source: input
        description: "Model year"
      - name: mileage
        type: integer
        source: input
        description: "Odometer reading at intake"
        constraints: ">= 0"
      - name: base_price_cents
        type: integer
        source: input
        description: "List price before imperfection deductions"
        constraints: "> 0"
      - name: market_code
        type: string
        source: input
        description: "Market where the vehicle is offered"
      - name: center_id
        type: string
        source: input
        description: "FK -> ReconditioningCenter.id; null once the vehicle leaves reconditioning"
        constraints: "nullable"
      - name: status
        type: enum
        source: system
        description: "Lifecycle state"
        default: INTAKE
        constraints: "one of {INTAKE, IN_RECON, LISTED, RESERVED, SOLD, RETURN_INBOUND, REMOVED}"
      - name: listed_price_cents
        type: integer
        source: computed
        description: "base_price_cents minus sum of ACTIVE ImperfectionAnnotation.deduction_cents; recomputed whenever annotations change or the vehicle is listed"
      - name: annotation_count
        type: integer
        source: computed
        description: "Count of ACTIVE ImperfectionAnnotation rows for this vehicle"
        default: 0

  - name: ImperfectionAnnotation
    parent: null
    common_fields: true
    fields:
      - name: vehicle_id
        type: string
        source: input
        description: "FK -> Vehicle.id; annotated vehicle"
      - name: area
        type: string
        source: input
        description: "Body area descriptor (e.g. driver door, hood)"
      - name: severity
        type: enum
        source: input
        description: "Disclosed severity band"
        constraints: "one of {COSMETIC, MINOR, MODERATE, MAJOR}"
      - name: deduction_cents
        type: integer
        source: input
        description: "Price deduction attributed to this imperfection"
        constraints: ">= 0"
      - name: image_count
        type: integer
        source: input
        description: "Number of high-resolution images attached to the annotation"
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: "ACTIVE annotations affect listed_price_cents; RETRACTED ones do not"
        default: ACTIVE
        constraints: "one of {ACTIVE, RETRACTED}"

  - name: FinancingPrequalification
    parent: null
    common_fields: true
    fields:
      - name: customer_id
        type: string
        source: input
        description: "FK -> Customer.id; applicant"
      - name: annual_income_cents
        type: integer
        source: input
        description: "Declared annual income in cents"
        constraints: ">= 0"
      - name: credit_band
        type: enum
        source: input
        description: "Self-declared credit band used for terms generation"
        constraints: "one of {A, B, C, D}"
      - name: max_amount_cents
        type: integer
        source: computed
        description: "Cap on financed amount; per-variant formula (standard vs conservative)"
      - name: apr_bps
        type: integer
        source: computed
        description: "Annual percentage rate in basis points derived from credit_band"
      - name: monthly_payment_cents
        type: integer
        source: computed
        description: "Provisional amortized monthly payment for TERM_MONTHS at max_amount_cents"
      - name: pricing_mode
        type: enum
        source: system
        description: "Which max-amount variant was applied at creation"
        constraints: "one of {STANDARD, CONSERVATIVE}"
      - name: status
        type: enum
        source: system
        description: "Lifecycle"
        default: PREQUALIFIED
        constraints: "one of {PREQUALIFIED, LOCKED, EXPIRED}"
      - name: expires_at
        type: datetime
        source: computed
        description: "expires_at = created_at + PREQUAL_VALID_DAYS (14 days); checked at structure time"
      - name: locked_order_id
        type: string
        source: computed
        description: "FK -> PurchaseOrder.id; set when the prequalification is locked into an order"
        constraints: "nullable"

  - name: TradeInOffer
    parent: null
    common_fields: true
    fields:
      - name: customer_id
        type: string
        source: input
        description: "FK -> Customer.id; trade-in owner"
      - name: vin
        type: string
        source: input
        description: "Trade-in vehicle VIN"
      - name: questionnaire
        type: object
        source: input
        description: "Condition questionnaire answers: {vehicle_band: ECONOMY|MID|PREMIUM, accident_history: boolean, mechanical_issues: boolean, tire_condition: GOOD|FAIR|POOR, odometer: integer, smoker_vehicle: boolean}"
      - name: initial_offer_cents
        type: integer
        source: computed
        description: "Offer computed from the questionnaire via the trade-in formula"
      - name: adjusted_offer_cents
        type: integer
        source: computed
        description: "Set by the inspection at pickup; null until inspected"
        constraints: "nullable"
      - name: status
        type: enum
        source: system
        description: "Lifecycle"
        default: OFFERED
        constraints: "one of {OFFERED, INSPECTED, CONFIRMED, DECLINED, EXPIRED}"
      - name: expires_at
        type: datetime
        source: computed
        description: "expires_at = created_at + TRADE_IN_VALID_DAYS (7 days)"

  - name: PurchaseOrder
    parent: null
    common_fields: true
    fields:
      - name: customer_id
        type: string
        source: input
        description: "FK -> Customer.id; buyer"
      - name: vehicle_id
        type: string
        source: input
        description: "FK -> Vehicle.id; purchased vehicle"
      - name: fulfillment_choice
        type: enum
        source: input
        description: "Delivery mode; may be switched while DRAFT/RESERVED"
        constraints: "one of {HOME_DELIVERY, VENDING_MACHINE}"
      - name: state_code
        type: string
        source: computed
        description: "Copied from Customer.state_code at creation; drives TitleRegistration and DeliveryAppointment eligibility"
      - name: trade_in_offer_id
        type: string
        source: input
        description: "FK -> TradeInOffer.id; nullable when no trade-in"
        constraints: "nullable"
      - name: financing_id
        type: string
        source: computed
        description: "FK -> FinancingPrequalification.id; set on structure, null for cash purchases"
        constraints: "nullable"
      - name: status
        type: enum
        source: system
        description: "Primary lifecycle state"
        default: DRAFT
        constraints: "one of {DRAFT, RESERVED, STRUCTURED, APPOINTMENT_SET, COMPLETED, RETURN_INITIATED, RETURN_COMPLETED, CANCELLED}"
      - name: payment_status
        type: enum
        source: system
        description: "Parallel dimension: funding state, evolves independently of status"
        default: UNPAID
        constraints: "one of {UNPAID, FINANCED, PAID, REFUND_PENDING, REFUNDED}"
      - name: delivery_status
        type: enum
        source: system
        description: "Parallel dimension: logistics state, evolves independently of status"
        default: NOT_SCHEDULED
        constraints: "one of {NOT_SCHEDULED, SCHEDULED, DELIVERED}"
      - name: down_payment_cents
        type: integer
        source: computed
        description: "Down payment set at structuring; 0 for cash purchase (full amount paid at completion)"
      - name: amount_financed_cents
        type: integer
        source: computed
        description: "Financed principal set at structuring; 0 for cash purchase"
      - name: total_due_cents
        type: integer
        source: computed
        description: "Amount due from the customer at structuring = listed_price_cents + taxes - confirmed trade credit (floored at 0)"
      - name: odometer_at_delivery
        type: integer
        source: computed
        description: "Odometer recorded when delivery is marked; null until DELIVERED"
        constraints: "nullable"
      - name: delivered_at
        type: datetime
        source: computed
        description: "Timestamp of handoff; start of the return window"
        constraints: "nullable"
      - name: return_deadline
        type: datetime
        source: computed
        description: "return_deadline = delivered_at + RETURN_WINDOW_DAYS (7 days); null until DELIVERED"
        constraints: "nullable"
      - name: return_requested_mileage
        type: integer
        source: computed
        description: "Odometer reported by the customer on return initiation; null until RETURN_INITIATED"
        constraints: "nullable"
      - name: return_reason_code
        type: string
        source: computed
        description: "Customer-provided return reason; null until RETURN_INITIATED"
        constraints: "nullable"
      - name: return_inspection_result
        type: enum
        source: computed
        description: "Advocate inspection outcome on the returned vehicle; null until intake"
        constraints: "nullable; one of {ACCEPT, REJECT}"
      - name: refund_amount_cents
        type: integer
        source: computed
        description: "Final refund computed by the refund calculation at return acceptance"
        constraints: "nullable"
      - name: refund_processed_at
        type: datetime
        source: computed
        description: "Timestamp when the refund is disbursed"
        constraints: "nullable"
      - name: deposit_cents
        type: integer
        source: computed
        description: "Refundable vending-machine deposit charged on vending-machine completion; 0 for home delivery"

  - name: TitleRegistration
    parent: null
    common_fields: true
    fields:
      - name: order_id
        type: string
        source: input
        description: "FK -> PurchaseOrder.id; owning order"
      - name: vehicle_id
        type: string
        source: computed
        description: "FK -> Vehicle.id; copied from the order at creation"
      - name: state_code
        type: string
        source: computed
        description: "Copied from PurchaseOrder.state_code; selects IN_STATE vs OUT_OF_STATE variant"
      - name: status
        type: enum
        source: system
        description: "Lifecycle"
        default: PENDING
        constraints: "one of {PENDING, TEMP_TAG_ISSUED, FILED, REGISTERED, BLOCKED}"
      - name: temp_tag_number
        type: string
        source: computed
        description: "Issued temporary tag identifier"
        constraints: "nullable"
      - name: temp_tag_expires_at
        type: datetime
        source: computed
        description: "temp_tag_expires_at = issued_at + state temp-tag validity days (30 in-state, 45 out-of-state)"
        constraints: "nullable"
      - name: filed_at
        type: datetime
        source: computed
        description: "Timestamp when paperwork was filed with the state"
        constraints: "nullable"
      - name: registration_due_at
        type: datetime
        source: computed
        description: "Timeline commitment: filed_at + state processing days (10 in-state, 21 out-of-state)"
        constraints: "nullable"
      - name: missed_commitment
        type: boolean
        source: computed
        description: "true when registration completes after registration_due_at; set at completion"
        default: false
      - name: processing_mode
        type: enum
        source: computed
        description: "Variant applied at filing: IN_STATE when order.state_code == market state handling, else OUT_OF_STATE"
        constraints: "one of {IN_STATE, OUT_OF_STATE}"

  - name: DeliveryAppointment
    parent: null
    common_fields: true
    fields:
      - name: order_id
        type: string
        source: input
        description: "FK -> PurchaseOrder.id; order being delivered"
      - name: kind
        type: enum
        source: computed
        description: "Copied from PurchaseOrder.fulfillment_choice at scheduling"
        constraints: "one of {HOME_DELIVERY, VENDING_MACHINE}"
      - name: market_code
        type: string
        source: input
        description: "Service market for the appointment; must equal Vehicle.market_code"
      - name: address_region
        type: string
        source: input
        description: "Destination region code; required for HOME_DELIVERY, must be in the market serviceability list"
        constraints: "nullable; required when kind == HOME_DELIVERY"
      - name: vending_site_code
        type: string
        source: input
        description: "Vending machine site; required for VENDING_MACHINE kind"
        constraints: "nullable; required when kind == VENDING_MACHINE"
      - name: start_at
        type: datetime
        source: input
        description: "Interval start (inclusive)"
      - name: end_at
        type: datetime
        source: input
        description: "Interval end (exclusive); must be strictly greater than start_at"
      - name: status
        type: enum
        source: system
        description: "Lifecycle"
        default: SCHEDULED
        constraints: "one of {SCHEDULED, COMPLETED, NO_SHOW, CANCELLED}"

  - name: ReturnTransit
    parent: null
    common_fields: true
    fields:
      - name: order_id
        type: string
        source: computed
        description: "FK -> PurchaseOrder.id; set when the return pickup is scheduled"
      - name: vehicle_id
        type: string
        source: computed
        description: "FK -> Vehicle.id; copied from the order's vehicle at scheduling"
      - name: market_code
        type: string
        source: computed
        description: "Copied from the order's vehicle market at scheduling"
      - name: start_at
        type: datetime
        source: input
        description: "Pickup interval start (inclusive)"
      - name: end_at
        type: datetime
        source: input
        description: "Pickup interval end (exclusive)"
      - name: buffer_minutes
        type: integer
        source: system
        description: "Mandatory crew turnaround buffer; interval occupation extends end_at + buffer_minutes"
        default: 120
      - name: status
        type: enum
        source: system
        description: "Lifecycle"
        default: PICKUP_SCHEDULED
        constraints: "one of {PICKUP_SCHEDULED, PICKED_UP, ARRIVED_AT_CENTER, INTAKE_DONE}"

  - name: DefectClaim
    parent: null
    common_fields: true
    fields:
      - name: order_id
        type: string
        source: input
        description: "FK -> PurchaseOrder.id; order the claim is filed against"
      - name: vehicle_id
        type: string
        source: computed
        description: "FK -> Vehicle.id; copied from the order at filing; used for disclosure matching"
      - name: defect_description
        type: string
        source: input
        description: "Customer description of the defect"
      - name: defect_area
        type: string
        source: input
        description: "Area code; matched against the vehicle's ACTIVE ImperfectionAnnotation area set for disclosure"
      - name: status
        type: enum
        source: system
        description: "Lifecycle"
        default: FILED
        constraints: "one of {FILED, UNDER_REVIEW, AUTHORIZED, DENIED, REPAIR_COMPLETE}"
      - name: disclosure_flag
        type: enum
        source: computed
        description: "Set at filing: DISCLOSED when defect_area matches an ACTIVE annotation area on the vehicle, else UNDISCLOSED"
        constraints: "one of {DISCLOSED, UNDISCLOSED}"
      - name: review_note
        type: string
        source: computed
        description: "WarrantyAdmin review rationale"
        constraints: "nullable"
      - name: authorized_estimate_cents
        type: integer
        source: computed
        description: "Estimate approved at authorization; null until AUTHORIZED"
        constraints: "nullable"

  - name: RepairAuthorization
    parent: null
    common_fields: true
    fields:
      - name: claim_id
        type: string
        source: computed
        description: "FK -> DefectClaim.id; claim being authorized"
      - name: estimate_cents
        type: integer
        source: input
        description: "Repair estimate in cents; must satisfy the warranty cap at authorization time"
        constraints: "> 0"
      - name: covered_amount_cents
        type: integer
        source: computed
        description: "Amount covered under the limited warranty = min(estimate_cents, WARRANTY_CLAIM_CAP_CENTS)"
      - name: deductible_cents
        type: integer
        source: computed
        description: "Customer deductible = estimate_cents - covered_amount_cents"
      - name: status
        type: enum
        source: system
        description: "Lifecycle"
        default: ISSUED
        constraints: "one of {ISSUED, COMPLETED, VOIDED}"

  - name: ReconIntake
    parent: null
    common_fields: true
    fields:
      - name: vehicle_id
        type: string
        source: input
        description: "FK -> Vehicle.id; vehicle entering reconditioning"
      - name: center_id
        type: string
        source: input
        description: "FK -> ReconditioningCenter.id; receiving center"
      - name: arrived_at
        type: datetime
        source: computed
        description: "Arrival timestamp; null until arrival is recorded"
        constraints: "nullable"
      - name: status
        type: enum
        source: system
        description: "Lifecycle"
        default: PENDING_ARRIVAL
        constraints: "one of {PENDING_ARRIVAL, RECEIVED, IN_WORK, COMPLETE, CANCELLED}"

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Vehicle
    initial_state: INTAKE
    terminal_states: [REMOVED]
    transitions:
      - from: INTAKE
        to: IN_RECON
        trigger: "POST /vehicle-hub/vehicles/{id}/start-recon"
        actor: ReconOperator
        preconditions:
          - "vehicle.center_id references an existing ReconditioningCenter"
          - "count of vehicles with status IN_RECON at center_id, grouped by current UTC calendar day, is < center.daily_capacity (check at transition time)"
          - "count of vehicles with status IN {INTAKE, IN_RECON} at center_id is < center.slot_count"
        side_effects:
          - "increments Vehicle.version by 1"
      - from: IN_RECON
        to: LISTED
        trigger: "POST /vehicle-hub/vehicles/{id}/list"
        actor: ReconOperator
        preconditions:
          - "every linked ReconIntake for this vehicle is in status COMPLETE or CANCELLED"
        side_effects:
          - "runs calculation listed_price (stores listed_price_cents and annotation_count)"
          - "sets Vehicle.center_id to null"
          - "increments Vehicle.version by 1"
      - from: LISTED
        to: RESERVED
        trigger: "POST /vehicle-hub/orders/{id}/reserve"
        actor: Customer
        preconditions:
          - "order.vehicle_id == this vehicle and order.status == DRAFT"
        side_effects:
          - "PurchaseOrder.status DRAFT -> RESERVED"
          - "increments Vehicle.version by 1"
      - from: RESERVED
        to: LISTED
        trigger: "POST /vehicle-hub/orders/{id}/cancel"
        actor: Customer | PlatformAdmin
        preconditions:
          - "order.status IN {RESERVED, STRUCTURED, APPOINTMENT_SET}"
        side_effects:
          - "PurchaseOrder compensation chain fires (see PurchaseOrder RESERVED->CANCELLED)"
          - "increments Vehicle.version by 1"
      - from: RESERVED
        to: SOLD
        trigger: "POST /vehicle-hub/orders/{id}/complete"
        actor: PlatformAdmin
        preconditions:
          - "order.status == APPOINTMENT_SET"
          - "linked DeliveryAppointment exists in status SCHEDULED"
        side_effects:
          - "PurchaseOrder.status -> COMPLETED"
          - "PurchaseOrder.payment_status -> PAID when amount_financed_cents == 0 else FINANCED"
          - "increments Vehicle.version by 1"
      - from: SOLD
        to: RETURN_INBOUND
        trigger: "POST /vehicle-hub/orders/{id}/return"
        actor: Customer
        preconditions:
          - "order.status == COMPLETED"
        side_effects:
          - "PurchaseOrder.status -> RETURN_INITIATED"
          - "increments Vehicle.version by 1"
      - from: RETURN_INBOUND
        to: IN_RECON
        trigger: "POST /vehicle-hub/recon-intakes/{id}/start-work"
        actor: ReconOperator
        preconditions:
          - "linked ReconIntake.status == RECEIVED"
          - "daily IN_WORK capacity and slot_count checks at the receiving center pass"
        side_effects:
          - "ReconIntake.status RECEIVED -> IN_WORK"
          - "increments Vehicle.version by 1"
      - from: RETURN_INBOUND
        to: REMOVED
        trigger: "POST /vehicle-hub/returns/{orderId}/intake with result REJECT"
        actor: CustomerAdvocate
        preconditions:
          - "order.status == RETURN_INITIATED and ReturnTransit.status == ARRIVED_AT_CENTER"
        side_effects:
          - "PurchaseOrder compensation: payment_status REFUND_PENDING -> PAID or FINANCED (per original funding), status RETURN_INITIATED -> COMPLETED"
          - "increments Vehicle.version by 1"
      - from: RETURN_INBOUND
        to: INTAKE
        trigger: "POST /vehicle-hub/returns/{orderId}/intake with result ACCEPT"
        actor: CustomerAdvocate
        preconditions:
          - "order.status == RETURN_INITIATED and ReturnTransit.status == ARRIVED_AT_CENTER"
        side_effects:
          - "ReconIntake PENDING_ARRIVAL created for the center selected by market (see PurchaseOrder RETURN_INITIATED -> RETURN_COMPLETED)"
          - "increments Vehicle.version by 1"
      - from: INTAKE
        to: REMOVED
        trigger: "POST /vehicle-hub/vehicles/{id}/remove"
        actor: PlatformAdmin
        preconditions:
          - "vehicle.status == INTAKE"
        side_effects:
          - "increments Vehicle.version by 1"

  - entity: FinancingPrequalification
    initial_state: PREQUALIFIED
    terminal_states: [EXPIRED]
    transitions:
      - from: PREQUALIFIED
        to: LOCKED
        trigger: "POST /vehicle-hub/orders/{id}/structure with financing_id referencing this prequalification"
        actor: Customer
        preconditions:
          - "prequalification.customer_id == order.customer_id"
          - "current_utc <= prequalification.expires_at"
          - "order.status == RESERVED"
        side_effects:
          - "sets locked_order_id to the order id"
          - "increments FinancingPrequalification.version by 1"
      - from: LOCKED
        to: PREQUALIFIED
        trigger: "POST /vehicle-hub/orders/{id}/cancel (compensation release)"
        actor: system
        preconditions:
          - "locked_order_id == order.id and order is being cancelled from STRUCTURED"
        side_effects:
          - "clears locked_order_id"
          - "increments FinancingPrequalification.version by 1"
      - from: PREQUALIFIED
        to: EXPIRED
        trigger: "system sweep: any read or structure attempt when current_utc > expires_at"
        actor: system
        preconditions:
          - "current_utc > expires_at"
        side_effects:
          - "increments FinancingPrequalification.version by 1"

  - entity: TradeInOffer
    initial_state: OFFERED
    terminal_states: [DECLINED, EXPIRED]
    transitions:
      - from: OFFERED
        to: INSPECTED
        trigger: "POST /vehicle-hub/trade-ins/{id}/inspect"
        actor: CustomerAdvocate
        preconditions:
          - "offer.status == OFFERED"
          - "current_utc <= offer.expires_at"
        side_effects:
          - "runs calculation trade_in_adjustment and stores adjusted_offer_cents"
          - "increments TradeInOffer.version by 1"
      - from: INSPECTED
        to: CONFIRMED
        trigger: "POST /vehicle-hub/trade-ins/{id}/confirm"
        actor: Customer
        preconditions:
          - "offer.customer_id == acting customer"
          - "current_utc <= offer.expires_at"
        side_effects:
          - "recomputes total_due_cents on every PurchaseOrder in status IN {DRAFT, RESERVED} that references this offer"
          - "increments TradeInOffer.version by 1"
      - from: INSPECTED
        to: DECLINED
        trigger: "POST /vehicle-hub/trade-ins/{id}/decline"
        actor: Customer
        preconditions:
          - "offer.customer_id == acting customer"
        side_effects:
          - "PurchaseOrder rows in status IN {DRAFT, RESERVED} referencing this offer have trade_in_offer_id cleared and total_due_cents recomputed"
          - "increments TradeInOffer.version by 1"
      - from: OFFERED
        to: EXPIRED
        trigger: "system sweep: any read or use attempt when current_utc > expires_at"
        actor: system
        preconditions:
          - "current_utc > expires_at"
        side_effects:
          - "increments TradeInOffer.version by 1"

  - entity: PurchaseOrder
    initial_state: DRAFT
    terminal_states: [CANCELLED, RETURN_COMPLETED]
    transitions:
      - from: DRAFT
        to: RESERVED
        trigger: "POST /vehicle-hub/orders/{id}/reserve"
        actor: Customer
        preconditions:
          - "vehicle.status == LISTED"
          - "when trade_in_offer_id is set, the offer status must be IN {OFFERED, INSPECTED, CONFIRMED}"
        side_effects:
          - "Vehicle LISTED -> RESERVED"
          - "increments PurchaseOrder.version by 1"
      - from: RESERVED
        to: STRUCTURED
        trigger: "POST /vehicle-hub/orders/{id}/structure"
        actor: Customer
        preconditions:
          - "order.customer_id == acting customer"
          - "when financing_id supplied: prequalification.status == PREQUALIFIED, not expired, customer matches"
          - "when trade_in_offer_id set: offer.status == CONFIRMED"
          - "down payment and financed amount satisfy min/max constraints of the financing calculation"
        side_effects:
          - "runs calculation financed_terms; sets down_payment_cents, amount_financed_cents, total_due_cents, financing_id"
          - "FinancingPrequalification PREQUALIFIED -> LOCKED (when financed)"
          - "creates TitleRegistration in PENDING with state_code copied from the order"
          - "increments PurchaseOrder.version by 1"
      - from: STRUCTURED
        to: APPOINTMENT_SET
        trigger: "POST /vehicle-hub/orders/{id}/appointments"
        actor: Customer
        preconditions:
          - "order.customer_id == acting customer"
          - "appointment kind matches order.fulfillment_choice"
          - "market serviceability and overlap rules pass (see DeliveryAppointment machine)"
        side_effects:
          - "PurchaseOrder.delivery_status NOT_SCHEDULED -> SCHEDULED"
          - "increments PurchaseOrder.version by 1"
      - from: APPOINTMENT_SET
        to: COMPLETED
        trigger: "POST /vehicle-hub/orders/{id}/complete"
        actor: PlatformAdmin
        preconditions:
          - "linked DeliveryAppointment.status == SCHEDULED"
          - "when fulfillment_choice == HOME_DELIVERY: odometer_at_delivery and total_due_cents payment confirmed in payload"
        side_effects:
          - "Vehicle RESERVED -> SOLD"
          - "PurchaseOrder.delivery_status -> DELIVERED; sets delivered_at, odometer_at_delivery, return_deadline"
          - "PurchaseOrder.payment_status -> PAID when amount_financed_cents == 0 else FINANCED"
          - "when fulfillment_choice == VENDING_MACHINE: sets deposit_cents = VENDING_DEPOSIT_CENTS (25000) and appointment -> COMPLETED"
          - "TitleRegistration PENDING -> TEMP_TAG_ISSUED (issues temp_tag_number, temp_tag_expires_at)"
          - "increments PurchaseOrder.version by 1"
      - from: COMPLETED
        to: RETURN_INITIATED
        trigger: "POST /vehicle-hub/orders/{id}/return"
        actor: Customer
        preconditions:
          - "order.customer_id == acting customer"
          - "current_utc <= return_deadline (7-day window, inclusive of the deadline instant)"
          - "return_mileage - odometer_at_delivery <= RETURN_MILEAGE_LIMIT (400 miles)"
        side_effects:
          - "Vehicle SOLD -> RETURN_INBOUND"
          - "PurchaseOrder.payment_status -> REFUND_PENDING; stores return_requested_mileage and return_reason_code"
          - "when linked TitleRegistration.status == TEMP_TAG_ISSUED: TitleRegistration -> BLOCKED"
          - "increments PurchaseOrder.version by 1"
      - from: RETURN_INITIATED
        to: RETURN_COMPLETED
        trigger: "POST /vehicle-hub/returns/{orderId}/intake with result ACCEPT"
        actor: CustomerAdvocate
        preconditions:
          - "ReturnTransit.status == ARRIVED_AT_CENTER"
          - "inspection result ACCEPT recorded"
        side_effects:
          - "runs calculation refund_amount; sets refund_amount_cents and return_inspection_result"
          - "Vehicle RETURN_INBOUND -> INTAKE; creates ReconIntake in PENDING_ARRIVAL for the center of the vehicle's original market (selector: center with market_code == vehicle.market_code; tie-break lowest created_at; empty -> ERR_NO_CENTER_FOR_MARKET)"
          - "PurchaseOrder.payment_status REFUND_PENDING -> REFUNDED; sets refund_processed_at"
          - "linked DefectClaim rows in status IN {FILED, UNDER_REVIEW} are auto-DENIED with review_note 'order returned'"
          - "increments PurchaseOrder.version by 1"
      - from: RETURN_INITIATED
        to: COMPLETED
        trigger: "POST /vehicle-hub/returns/{orderId}/intake with result REJECT"
        actor: CustomerAdvocate
        preconditions:
          - "ReturnTransit.status == ARRIVED_AT_CENTER"
          - "inspection result REJECT recorded (e.g. undisclosed damage found at intake)"
        side_effects:
          - "Vehicle RETURN_INBOUND -> REMOVED from sale pending disposition"
          - "PurchaseOrder.payment_status REFUND_PENDING -> PAID or FINANCED (original funding); clears return_requested_mileage, return_reason_code"
          - "when linked TitleRegistration.status == BLOCKED: TitleRegistration -> TEMP_TAG_ISSUED (restored)"
          - "increments PurchaseOrder.version by 1"
      - from: RESERVED
        to: CANCELLED
        trigger: "POST /vehicle-hub/orders/{id}/cancel"
        actor: Customer | PlatformAdmin
        preconditions:
          - "order.status IN {RESERVED, STRUCTURED, APPOINTMENT_SET}"
        side_effects:
          - "Vehicle RESERVED -> LISTED"
          - "when order was STRUCTURED or APPOINTMENT_SET and financing_id set: FinancingPrequalification LOCKED -> PREQUALIFIED"
          - "when order was STRUCTURED or APPOINTMENT_SET: linked TitleRegistration PENDING is deleted"
          - "when order was APPOINTMENT_SET: linked DeliveryAppointment SCHEDULED -> CANCELLED"
          - "increments PurchaseOrder.version by 1"
      - from: STRUCTURED
        to: CANCELLED
        trigger: "POST /vehicle-hub/orders/{id}/cancel"
        actor: Customer | PlatformAdmin
        preconditions:
          - "order.status IN {RESERVED, STRUCTURED, APPOINTMENT_SET}"
        side_effects:
          - "same compensation chain as RESERVED -> CANCELLED"
          - "increments PurchaseOrder.version by 1"
      - from: APPOINTMENT_SET
        to: CANCELLED
        trigger: "POST /vehicle-hub/orders/{id}/cancel"
        actor: Customer | PlatformAdmin
        preconditions:
          - "order.status IN {RESERVED, STRUCTURED, APPOINTMENT_SET}"
        side_effects:
          - "same compensation chain as RESERVED -> CANCELLED plus DeliveryAppointment cancellation"
          - "increments PurchaseOrder.version by 1"

  - entity: TitleRegistration
    initial_state: PENDING
    terminal_states: [REGISTERED]
    transitions:
      - from: PENDING
        to: TEMP_TAG_ISSUED
        trigger: "POST /vehicle-hub/orders/{id}/complete (cascade)"
        actor: system
        preconditions:
          - "order completes successfully"
        side_effects:
          - "issues temp_tag_number; temp_tag_expires_at = now + TEMP_TAG_DAYS (30 IN_STATE, 45 OUT_OF_STATE)"
          - "increments TitleRegistration.version by 1"
      - from: TEMP_TAG_ISSUED
        to: FILED
        trigger: "POST /vehicle-hub/title-registrations/{id}/file"
        actor: RegistrationClerk
        preconditions:
          - "order.status == COMPLETED"
          - "current_utc <= temp_tag_expires_at"
        side_effects:
          - "sets filed_at; registration_due_at = filed_at + REG_PROCESSING_DAYS (10 IN_STATE, 21 OUT_OF_STATE)"
          - "stores processing_mode per registration_timeline (IN_STATE when order.state_code == 'GA', else OUT_OF_STATE)"
          - "increments TitleRegistration.version by 1"
      - from: FILED
        to: REGISTERED
        trigger: "POST /vehicle-hub/title-registrations/{id}/register"
        actor: RegistrationClerk
        preconditions:
          - "status == FILED"
        side_effects:
          - "sets missed_commitment = (current_utc > registration_due_at)"
          - "increments TitleRegistration.version by 1"
      - from: TEMP_TAG_ISSUED
        to: BLOCKED
        trigger: "POST /vehicle-hub/orders/{id}/return (cascade)"
        actor: system
        preconditions:
          - "order enters RETURN_INITIATED"
        side_effects:
          - "increments TitleRegistration.version by 1"
      - from: BLOCKED
        to: TEMP_TAG_ISSUED
        trigger: "POST /vehicle-hub/returns/{orderId}/intake with result REJECT (cascade restore)"
        actor: system
        preconditions:
          - "return is rejected"
        side_effects:
          - "increments TitleRegistration.version by 1"
    note: "BLOCKED is transient: it is either restored to TEMP_TAG_ISSUED (return REJECT) or hard-deleted (return ACCEPT); it never proceeds to FILED/REGISTERED"

  - entity: DeliveryAppointment
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, NO_SHOW, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: COMPLETED
        trigger: "POST /vehicle-hub/orders/{id}/complete (cascade)"
        actor: system
        preconditions:
          - "order completes"
        side_effects:
          - "increments DeliveryAppointment.version by 1"
      - from: SCHEDULED
        to: NO_SHOW
        trigger: "POST /vehicle-hub/appointments/{id}/no-show"
        actor: CustomerAdvocate
        preconditions:
          - "appointment.status == SCHEDULED"
          - "current_utc > appointment.end_at"
        side_effects:
          - "PurchaseOrder.status APPOINTMENT_SET -> STRUCTURED (delivery reverts to NOT_SCHEDULED, order must re-book)"
          - "PurchaseOrder.delivery_status SCHEDULED -> NOT_SCHEDULED"
          - "increments DeliveryAppointment.version by 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /vehicle-hub/orders/{id}/cancel (cascade) or POST /vehicle-hub/appointments/{id}/cancel"
        actor: Customer | system
        preconditions:
          - "appointment.status == SCHEDULED"
          - "direct cancel requires the acting customer to own the order"
        side_effects:
          - "when cancelled directly (not via order cancel): PurchaseOrder.status APPOINTMENT_SET -> STRUCTURED and delivery_status -> NOT_SCHEDULED"
          - "increments DeliveryAppointment.version by 1"

  - entity: ReturnTransit
    initial_state: PICKUP_SCHEDULED
    terminal_states: [INTAKE_DONE]
    transitions:
      - from: PICKUP_SCHEDULED
        to: PICKED_UP
        trigger: "POST /vehicle-hub/returns/{orderId}/transit/pickup"
        actor: CustomerAdvocate
        preconditions:
          - "order.status == RETURN_INITIATED"
          - "transit.status == PICKUP_SCHEDULED"
        side_effects:
          - "increments ReturnTransit.version by 1"
      - from: PICKED_UP
        to: ARRIVED_AT_CENTER
        trigger: "POST /vehicle-hub/returns/{orderId}/transit/arrive"
        actor: CustomerAdvocate
        preconditions:
          - "transit.status == PICKED_UP"
        side_effects:
          - "increments ReturnTransit.version by 1"
      - from: ARRIVED_AT_CENTER
        to: INTAKE_DONE
        trigger: "POST /vehicle-hub/returns/{orderId}/intake (cascade on ACCEPT or REJECT)"
        actor: system
        preconditions:
          - "intake decision recorded"
        side_effects:
          - "increments ReturnTransit.version by 1"

  - entity: DefectClaim
    initial_state: FILED
    terminal_states: [DENIED, REPAIR_COMPLETE]
    transitions:
      - from: FILED
        to: UNDER_REVIEW
        trigger: "POST /vehicle-hub/defect-claims/{id}/review"
        actor: WarrantyAdmin
        preconditions:
          - "order.status == COMPLETED (post-sale claims only)"
        side_effects:
          - "increments DefectClaim.version by 1"
      - from: UNDER_REVIEW
        to: AUTHORIZED
        trigger: "POST /vehicle-hub/defect-claims/{id}/authorize"
        actor: WarrantyAdmin
        preconditions:
          - "order.status == COMPLETED (claims on returned/cancelled orders cannot be authorized)"
          - "claim.disclosure_flag == UNDISCLOSED (DISCLOSED defects are never covered)"
          - "current_utc <= order.delivered_at + WARRANTY_WINDOW_DAYS (100 days)"
          - "order.odometer_at_delivery is set and claim filed mileage within order; odometer delta <= WARRANTY_MILEAGE_LIMIT (4189 miles) when supplied"
          - "estimate_cents > 0"
        side_effects:
          - "creates RepairAuthorization in ISSUED with covered_amount_cents and deductible_cents per warranty_coverage calculation"
          - "increments DefectClaim.version by 1"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /vehicle-hub/defect-claims/{id}/deny"
        actor: WarrantyAdmin
        preconditions:
          - "claim.status == UNDER_REVIEW"
        side_effects:
          - "stores review_note"
          - "increments DefectClaim.version by 1"
      - from: AUTHORIZED
        to: REPAIR_COMPLETE
        trigger: "POST /vehicle-hub/defect-claims/{id}/complete-repair"
        actor: WarrantyAdmin
        preconditions:
          - "linked RepairAuthorization.status == ISSUED"
        side_effects:
          - "RepairAuthorization ISSUED -> COMPLETED"
          - "increments DefectClaim.version by 1"
      - from: FILED
        to: DENIED
        trigger: "POST /vehicle-hub/returns/{orderId}/intake with result ACCEPT (cascade auto-deny)"
        actor: system
        preconditions:
          - "order return accepted"
        side_effects:
          - "review_note set to 'order returned'"
          - "increments DefectClaim.version by 1"
      - from: UNDER_REVIEW
        to: DENIED
        trigger: "POST /vehicle-hub/returns/{orderId}/intake with result ACCEPT (cascade auto-deny)"
        actor: system
        preconditions:
          - "order return accepted"
        side_effects:
          - "review_note set to 'order returned'"
          - "increments DefectClaim.version by 1"

  - entity: RepairAuthorization
    initial_state: ISSUED
    terminal_states: [COMPLETED, VOIDED]
    transitions:
      - from: ISSUED
        to: COMPLETED
        trigger: "POST /vehicle-hub/defect-claims/{id}/complete-repair (cascade)"
        actor: system
        preconditions:
          - "claim completes repair"
        side_effects:
          - "increments RepairAuthorization.version by 1"
      - from: ISSUED
        to: VOIDED
        trigger: "POST /vehicle-hub/repair-authorizations/{id}/void"
        actor: WarrantyAdmin
        preconditions:
          - "authorization.status == ISSUED"
          - "reason: shop closed or customer declined repair"
        side_effects:
          - "claim remains AUTHORIZED and may be re-authorized with a new estimate"
          - "increments RepairAuthorization.version by 1"

  - entity: ReconIntake
    initial_state: PENDING_ARRIVAL
    terminal_states: [COMPLETE, CANCELLED]
    transitions:
      - from: PENDING_ARRIVAL
        to: RECEIVED
        trigger: "POST /vehicle-hub/recon-intakes/{id}/arrive"
        actor: ReconOperator
        preconditions:
          - "count of vehicles with status IN {INTAKE, IN_RECON} at center_id is < center.slot_count"
        side_effects:
          - "sets arrived_at"
          - "when intake.vehicle_id vehicle.status == RETURN_INBOUND: vehicle moves to INTAKE"
          - "increments ReconIntake.version by 1"
      - from: RECEIVED
        to: IN_WORK
        trigger: "POST /vehicle-hub/recon-intakes/{id}/start-work"
        actor: ReconOperator
        preconditions:
          - "daily IN_WORK count at center_id for current UTC calendar day < center.daily_capacity"
        side_effects:
          - "vehicle INTAKE or RETURN_INBOUND -> IN_RECON"
          - "increments ReconIntake.version by 1"
      - from: IN_WORK
        to: COMPLETE
        trigger: "POST /vehicle-hub/recon-intakes/{id}/complete"
        actor: ReconOperator
        preconditions:
          - "vehicle.status == IN_RECON"
        side_effects:
          - "increments ReconIntake.version by 1"
      - from: PENDING_ARRIVAL
        to: CANCELLED
        trigger: "POST /vehicle-hub/recon-intakes/{id}/cancel"
        actor: PlatformAdmin
        preconditions:
          - "intake.status == PENDING_ARRIVAL"
        side_effects:
          - "increments ReconIntake.version by 1"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: order-reserve-stale-vehicle
    parent_entity: Vehicle
    write_endpoint: "POST /vehicle-hub/orders/{id}/reserve"
    occ_field: "expected_vehicle_version"
    description: |
      Reserving a PurchaseOrder against a Vehicle whose version has advanced
      since the client last observed it is rejected. This captures the case
      where another writer has just listed, annotated, or reserved the
      vehicle and the current writer's view of it is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: appointment-book-stale-order
    parent_entity: PurchaseOrder
    write_endpoint: "POST /vehicle-hub/orders/{id}/appointments"
    occ_field: "expected_order_version"
    description: |
      Booking a DeliveryAppointment against a PurchaseOrder whose version has
      advanced since the client last observed it is rejected. This captures
      the case where another writer has just restructured or re-booked the
      order and the current writer's view of it is therefore stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: listed_price
    trigger: "Vehicle IN_RECON -> LISTED; also recomputed whenever an ImperfectionAnnotation is created, updated, or retracted on a LISTED vehicle"
    algorithm: aggregation
    formula: |
      deduction_total = sum(deduction_cents for ImperfectionAnnotation where vehicle_id == vehicle.id AND status == ACTIVE)
      listed_price_cents = max(base_price_cents - deduction_total, MIN_LISTED_PRICE_CENTS)
      annotation_count = count of those ACTIVE annotations
    input_set: "ImperfectionAnnotation rows for the vehicle in status ACTIVE only; RETRACTED excluded"
    constants:
      MIN_LISTED_PRICE_CENTS: 100000
    precision: "integer cents, no rounding"

  - name: trade_in_initial_offer
    trigger: "POST /vehicle-hub/trade-ins (creation)"
    algorithm: weighted_scoring
    formula: |
      base = QUESTIONNAIRE_BASE_BY_BAND[questionnaire.vehicle_band]  # cents, input-declared band in {ECONOMY, MID, PREMIUM}
      if questionnaire.accident_history:   base -= 150000
      if questionnaire.mechanical_issues:  base -= 250000
      if questionnaire.smoker_vehicle:     base -=  75000
      tire_adj = {GOOD: 0, FAIR: -30000, POOR: -90000}[questionnaire.tire_condition]
      base += tire_adj
      odo_over = max(questionnaire.odometer - ODOMETER_SOFT_CAP, 0)
      base -= (odo_over // 1000) * ODO_DEDUCT_PER_1K_CENTS
      initial_offer_cents = max(base, TRADE_IN_FLOOR_CENTS)
    input_set: "single TradeInOffer questionnaire at creation"
    constants:
      ODOMETER_SOFT_CAP: 60000
      ODO_DEDUCT_PER_1K_CENTS: 1200
      TRADE_IN_FLOOR_CENTS: 50000
      QUESTIONNAIRE_BASE_BY_BAND: {ECONOMY: 1200000, MID: 2000000, PREMIUM: 3200000}
    precision: "integer cents; integer division floor for odometer steps"

  - name: trade_in_adjustment
    trigger: "POST /vehicle-hub/trade-ins/{id}/inspect"
    algorithm: threshold
    formula: |
      mismatches = count of questionnaire items contradicted by inspection payload (accident_history, mechanical_issues, smoker_vehicle, tire_condition worse than declared)
      if mismatches == 0: adjusted_offer_cents = initial_offer_cents
      elif mismatches <= 2: adjusted_offer_cents = max(initial_offer_cents - mismatches * ADJUST_PER_MISMATCH_CENTS, TRADE_IN_FLOOR_CENTS)
      else: adjusted_offer_cents = max((initial_offer_cents * 70) // 100, TRADE_IN_FLOOR_CENTS)
    input_set: "the offer plus the inspection payload's contradiction flags"
    constants:
      ADJUST_PER_MISMATCH_CENTS: 40000
      TRADE_IN_FLOOR_CENTS: 50000
    precision: "integer cents; percentage via integer floor"
    variants:
      - name: lenient_band
        when: "mismatches <= 2"
        difference: "linear per-mismatch deduction"
      - name: severe_band
        when: "mismatches >= 3"
        difference: "30 percent haircut of the initial offer instead of linear deduction"

  - name: financed_terms
    trigger: "POST /vehicle-hub/orders/{id}/structure"
    algorithm: tiered_pricing
    formula: |
      # evaluation order pinned: price -> taxes -> trade credit -> amount due -> down payment -> financed -> monthly
      price = vehicle.listed_price_cents
      tax_rate_bps = STATE_TAX_BPS[order.state_code]  # e.g. GA 700, TX 625, CA 725; unknown state -> ERR_UNSUPPORTED_STATE
      tax_cents = (price * tax_rate_bps) // 10000     # integer floor, per-order single rounding
      trade_credit = trade_in.adjusted_offer_cents when offer CONFIRMED else 0
      total_due_cents = max(price + tax_cents - trade_credit, 0)
      if financing_id is null:   # cash
          down_payment_cents = 0; amount_financed_cents = 0
      else:
          prequal must be PREQUALIFIED and unexpired
          amount_financed_cents = total_due_cents - down_payment_input
          require amount_financed_cents <= prequal.max_amount_cents else ERR_FINANCING_CAP_EXCEEDED
          require down_payment_input >= (total_due_cents * MIN_DOWN_BPS) // 10000 else ERR_DOWN_PAYMENT_TOO_LOW
          down_payment_cents = down_payment_input
      monthly_payment_cents = amortize(amount_financed_cents, prequal.apr_bps, TERM_MONTHS)
      # amortize pinned: monthly_rate_bps = apr_bps / 12; pay = principal * r / (1 - (1+r)^-n)
      # evaluated in fixed-point milli-cents; HALF-UP rounding applied exactly once at the final step
      # (rounding the per-month rate or an intermediate payment before exponentiation is forbidden —
      #  rounding order is pinned: compute exact rational, then round half-up to cents)
    input_set: "order + vehicle + optional confirmed TradeInOffer + optional FinancingPrequalification"
    constants:
      TERM_MONTHS: 72
      MIN_DOWN_BPS: 1000
      STATE_TAX_BPS: {GA: 700, TX: 625, CA: 725, FL: 600, NY: 800}
    precision: "2 decimal places expressed in integer cents; tax floored once; monthly payment rounded half-up at final step only"
    variants:
      - name: cash_purchase
        when: "financing_id is null"
        difference: "no cap/min-down checks; full total_due_cents collected at completion"
      - name: financed_purchase
        when: "financing_id supplied"
        difference: "cap and minimum-down checks apply; monthly payment computed"

  - name: prequalification_terms
    trigger: "POST /vehicle-hub/financing/prequalify"
    algorithm: weighted_scoring
    formula: |
      apr_bps = {A: 490, B: 690, C: 990, D: 1490}[credit_band]
      income_cap = (annual_income_cents * INCOME_MULTIPLIER_BPS) // 10000   # 25% of annual income
      band_cap = {A: 9000000, B: 6500000, C: 4000000, D: 2200000}[credit_band]
      STANDARD:    max_amount_cents = min(income_cap, band_cap)
      CONSERVATIVE: max_amount_cents = min((income_cap * 80) // 100, (band_cap * 90) // 100)
      pricing_mode = CONSERVATIVE when request header/flag conservative_mode == true else STANDARD
      monthly_payment_cents = amortize(max_amount_cents, apr_bps, TERM_MONTHS)
    input_set: "annual_income_cents and credit_band from the request"
    constants:
      INCOME_MULTIPLIER_BPS: 2500
      TERM_MONTHS: 72
    precision: "integer cents; monthly payment rounded half-up at final step only"
    variants:
      - name: standard
        when: "conservative_mode flag absent or false"
        difference: "full income and band caps"
      - name: conservative
        when: "conservative_mode flag true"
        difference: "income cap scaled to 80 percent and band cap scaled to 90 percent before the min — strictly lower max_amount_cents for identical inputs"

  - name: refund_amount
    trigger: "POST /vehicle-hub/returns/{orderId}/intake with result ACCEPT"
    algorithm: aggregation
    formula: |
      base_refund = total_due_cents                     # everything the customer paid or financed
      if return_requested_mileage - odometer_at_delivery > RETURN_MILEAGE_LIMIT:
          rejected — but this path is blocked earlier at return initiation, so at intake base stands
      excess_wear_fee = EXCESS_WEAR_FEE_CENTS when intake inspection flags excess_wear == true else 0
      refund_amount_cents = max(base_refund - excess_wear_fee, 0)
      # compensating invariant: refund_amount_cents + excess_wear_fee == total_due_cents (when base >= fee)
    input_set: "order + intake inspection payload"
    constants:
      RETURN_MILEAGE_LIMIT: 400
      EXCESS_WEAR_FEE_CENTS: 50000
    precision: "integer cents"

  - name: warranty_coverage
    trigger: "POST /vehicle-hub/defect-claims/{id}/authorize"
    algorithm: threshold
    formula: |
      covered_amount_cents = min(estimate_cents, WARRANTY_CLAIM_CAP_CENTS)
      deductible_cents = estimate_cents - covered_amount_cents
      # invariant: covered_amount_cents + deductible_cents == estimate_cents
    input_set: "the estimate_cents supplied at authorization"
    constants:
      WARRANTY_CLAIM_CAP_CENTS: 400000
    precision: "integer cents"

  - name: registration_timeline
    trigger: "TitleRegistration TEMP_TAG_ISSUED -> FILED"
    algorithm: threshold
    formula: |
      processing_mode = IN_STATE when order.state_code == HOME_STATE else OUT_OF_STATE
      temp_tag validity days = 30 (IN_STATE) / 45 (OUT_OF_STATE)   # applied at issuance
      REG_PROCESSING_DAYS = 10 (IN_STATE) / 21 (OUT_OF_STATE)
      registration_due_at = filed_at + REG_PROCESSING_DAYS days
      missed_commitment (set at REGISTERED) = current_utc > registration_due_at
    input_set: "order.state_code and filing timestamp"
    constants:
      HOME_STATE: GA
      TEMP_TAG_DAYS_IN_STATE: 30
      TEMP_TAG_DAYS_OUT_OF_STATE: 45
      REG_PROCESSING_DAYS_IN_STATE: 10
      REG_PROCESSING_DAYS_OUT_OF_STATE: 21
    precision: "datetime arithmetic, day granularity"
    variants:
      - name: in_state
        when: "order.state_code == GA"
        difference: "30-day temp tag, 10-day registration commitment"
      - name: out_of_state
        when: "order.state_code != GA"
        difference: "45-day temp tag, 21-day registration commitment"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present; role is a declared role"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "Role permitted to invoke this endpoint per RBAC matrix"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: existence
    check: "Every path id and body FK reference exists (validated left-to-right in path, then body)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 4
    category: existence
    check: "OCC expected_<parent>_version fields match the parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: ["POST /vehicle-hub/orders/{id}/reserve", "POST /vehicle-hub/orders/{id}/appointments"]
  - priority: 5
    category: state
    check: "Target resource in a valid from-state for the requested transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 6
    category: state
    check: "Entity-backed actor owns the resource: Customer endpoints require X-User-ID == resource.customer_id"
    error_id: ERR_FORBIDDEN_OWNERSHIP
    http_status: 403
    applies_to: ["POST /vehicle-hub/orders/{id}/reserve", "POST /vehicle-hub/orders/{id}/structure", "POST /vehicle-hub/orders/{id}/appointments", "POST /vehicle-hub/orders/{id}/return", "POST /vehicle-hub/orders/{id}/cancel", "POST /vehicle-hub/trade-ins/{id}/confirm", "POST /vehicle-hub/trade-ins/{id}/decline", "POST /vehicle-hub/defect-claims"]
  - priority: 6.5
    category: state
    check: "Defect claim creation: referenced order.status == COMPLETED (claims exist only post-sale, pre-return)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: ["POST /vehicle-hub/defect-claims"]
  - priority: 7
    category: business_temporal
    check: "FinancingPrequalification current_utc <= expires_at at structure time; TradeInOffer current_utc <= expires_at at inspect/confirm/structure"
    error_id: ERR_PREQUAL_EXPIRED
    http_status: 422
    applies_to: ["POST /vehicle-hub/orders/{id}/structure", "POST /vehicle-hub/trade-ins/{id}/inspect", "POST /vehicle-hub/trade-ins/{id}/confirm"]
  - priority: 8
    category: business_temporal
    check: "Return initiation: current_utc <= order.return_deadline (7-day window inclusive of deadline instant)"
    error_id: ERR_RETURN_WINDOW_CLOSED
    http_status: 422
    applies_to: ["POST /vehicle-hub/orders/{id}/return"]
  - priority: 9
    category: business_temporal
    check: "Return initiation: return_mileage - odometer_at_delivery <= 400 (boundary: exactly 400 allowed, 401 rejected)"
    error_id: ERR_MILEAGE_LIMIT_EXCEEDED
    http_status: 422
    applies_to: ["POST /vehicle-hub/orders/{id}/return"]
  - priority: 10
    category: business_safety
    check: "Defect claim authorization: disclosure_flag == UNDISCLOSED; disclosed defects never covered"
    error_id: ERR_DEFECT_DISCLOSED
    http_status: 422
    applies_to: ["POST /vehicle-hub/defect-claims/{id}/authorize"]
  - priority: 11
    category: business_temporal
    check: "Defect claim authorization: current_utc <= delivered_at + 100 days and odometer delta <= 4189 miles"
    error_id: ERR_WARRANTY_WINDOW_EXPIRED
    http_status: 422
    applies_to: ["POST /vehicle-hub/defect-claims/{id}/authorize"]
  - priority: 12
    category: business_constraint
    check: "Appointment overlap: HOME_DELIVERY per market (start_at, end_at) half-open must not intersect another SCHEDULED home-delivery interval in the same market; VENDING_MACHINE per vending_site_code same rule; edge-touching intervals (a.end_at == b.start_at) do NOT conflict"
    error_id: ERR_APPOINTMENT_CONFLICT
    http_status: 409
    applies_to: ["POST /vehicle-hub/orders/{id}/appointments"]
  - priority: 13
    category: business_constraint
    check: "ReturnTransit overlap: per market, the buffered interval [start_at, end_at + 120 minutes) must not intersect another PICKUP_SCHEDULED or PICKED_UP transit's buffered interval; adjacency is allowed only when gap >= 120 minutes"
    error_id: ERR_TRANSIT_SLOT_CONFLICT
    http_status: 409
    applies_to: ["POST /vehicle-hub/returns/{orderId}/schedule-pickup"]
  - priority: 14
    category: business_constraint
    check: "Recon capacity: daily IN_WORK count < daily_capacity and co-resident INTAKE+IN_RECON count < slot_count at the center"
    error_id: ERR_RECON_CAPACITY_FULL
    http_status: 409
    applies_to: ["POST /vehicle-hub/vehicles/{id}/start-recon", "POST /vehicle-hub/recon-intakes/{id}/arrive", "POST /vehicle-hub/recon-intakes/{id}/start-work"]
  - priority: 15
    category: business_constraint
    check: "HOME_DELIVERY address_region must be in the serviceability list of appointment market_code; appointment market_code must equal the order vehicle's market_code"
    error_id: ERR_REGION_NOT_SERVICED
    http_status: 422
    applies_to: ["POST /vehicle-hub/orders/{id}/appointments"]
  - priority: 16
    category: business_fiscal
    check: "Financed structure: amount_financed_cents <= prequal.max_amount_cents"
    error_id: ERR_FINANCING_CAP_EXCEEDED
    http_status: 402
    applies_to: ["POST /vehicle-hub/orders/{id}/structure"]
  - priority: 17
    category: business_fiscal
    check: "Financed structure: down_payment_input >= 10 percent of total_due_cents"
    error_id: ERR_DOWN_PAYMENT_TOO_LOW
    http_status: 402
    applies_to: ["POST /vehicle-hub/orders/{id}/structure"]
  - priority: 18
    category: business_fiscal
    check: "Registration filing: current_utc <= temp_tag_expires_at"
    error_id: ERR_TEMP_TAG_EXPIRED
    http_status: 422
    applies_to: ["POST /vehicle-hub/title-registrations/{id}/file"]
  - priority: 19
    category: business_referential
    check: "Vehicle list: every linked ReconIntake in COMPLETE or CANCELLED; order structure referencing trade-in requires offer CONFIRMED"
    error_id: ERR_DEPENDENCY_NOT_READY
    http_status: 409
    applies_to: ["POST /vehicle-hub/vehicles/{id}/list", "POST /vehicle-hub/orders/{id}/structure"]
  - priority: 20
    category: business_constraint
    check: "Required request fields present and well-typed; enum values valid; end_at > start_at; quantities non-negative where declared"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"
  - priority: 21
    category: business_constraint
    check: "Registration: state_code must be in the supported tax/state table"
    error_id: ERR_UNSUPPORTED_STATE
    http_status: 422
    applies_to: ["POST /vehicle-hub/customers", "POST /vehicle-hub/orders", "POST /vehicle-hub/orders/{id}/structure"]
  - priority: 22
    category: business_referential
    check: "Selector fallbacks: no center exists for a returned vehicle's market at return-acceptance placement"
    error_id: ERR_NO_CENTER_FOR_MARKET
    http_status: 422
    applies_to: ["POST /vehicle-hub/returns/{orderId}/intake"]

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  - method: POST
    path: "/vehicle-hub/_clock/set_current_utc"
    description: "Sets the logical server clock. Startup default is exactly 2026-09-01T00:00:00Z; before any call the clock reads this default and never falls back to wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: ["recalculates time-derived statuses on next read (prequalification/trade-in expiry sweeps)"]

  - method: POST
    path: "/vehicle-hub/customers"
    description: "Register a customer"
    roles: [PlatformAdmin]
    code: 201
    input: [full_name, email, state_code, "default_fulfillment_choice?"]
    output: Customer
    side_effects: []

  - method: GET
    path: "/vehicle-hub/customers/{id}"
    description: "Fetch a customer"
    roles: [PlatformAdmin, Customer, CustomerAdvocate]
    code: 200
    input: []
    output: Customer
    side_effects: []

  - method: GET
    path: "/vehicle-hub/customers"
    description: "List customers"
    roles: [PlatformAdmin, CustomerAdvocate]
    code: 200
    input: ["state_code?", "limit?", "offset?"]
    output: Customer[]
    side_effects: []

  - method: POST
    path: "/vehicle-hub/reconditioning-centers"
    description: "Create a reconditioning center"
    roles: [PlatformAdmin]
    code: 201
    input: [name, market_code, daily_capacity, slot_count]
    output: ReconditioningCenter
    side_effects: []

  - method: GET
    path: "/vehicle-hub/reconditioning-centers/{id}"
    description: "Fetch a center"
    roles: [PlatformAdmin, ReconOperator]
    code: 200
    input: []
    output: ReconditioningCenter
    side_effects: []

  - method: GET
    path: "/vehicle-hub/reconditioning-centers"
    description: "List centers"
    roles: [PlatformAdmin, ReconOperator]
    code: 200
    input: ["market_code?", "limit?", "offset?"]
    output: ReconditioningCenter[]
    side_effects: []

  - method: POST
    path: "/vehicle-hub/vehicles"
    description: "Intake a vehicle into inventory"
    roles: [PlatformAdmin, ReconOperator]
    code: 201
    input: [vin, make, model, year, mileage, base_price_cents, market_code, "center_id?"]
    output: Vehicle
    side_effects: ["status INTAKE; creates a ReconIntake in PENDING_ARRIVAL when center_id supplied"]

  - method: GET
    path: "/vehicle-hub/vehicles/{id}"
    description: "Fetch a vehicle with computed listed price"
    roles: [PlatformAdmin, ReconOperator, Customer, CustomerAdvocate, WarrantyAdmin]
    code: 200
    input: []
    output: Vehicle
    side_effects: []

  - method: GET
    path: "/vehicle-hub/vehicles"
    description: "List vehicles with filters"
    roles: [PlatformAdmin, ReconOperator, Customer, CustomerAdvocate, WarrantyAdmin]
    code: 200
    input: ["status?", "market_code?", "center_id?", "limit?", "offset?"]
    output: Vehicle[]
    side_effects: []

  - method: POST
    path: "/vehicle-hub/vehicles/{id}/start-recon"
    description: "Move vehicle INTAKE -> IN_RECON subject to center capacity"
    roles: [ReconOperator]
    code: 200
    input: []
    output: Vehicle
    side_effects: ["increments Vehicle.version by 1"]

  - method: POST
    path: "/vehicle-hub/vehicles/{id}/list"
    description: "Move vehicle IN_RECON -> LISTED; computes listed price"
    roles: [ReconOperator]
    code: 200
    input: []
    output: Vehicle
    side_effects: ["runs calculation listed_price", "sets center_id null", "increments Vehicle.version by 1"]

  - method: POST
    path: "/vehicle-hub/vehicles/{id}/remove"
    description: "Remove a vehicle from sellable inventory (INTAKE only)"
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Vehicle
    side_effects: ["increments Vehicle.version by 1"]

  - method: POST
    path: "/vehicle-hub/vehicles/{id}/annotations"
    description: "Disclose an imperfection with imaging count and deduction"
