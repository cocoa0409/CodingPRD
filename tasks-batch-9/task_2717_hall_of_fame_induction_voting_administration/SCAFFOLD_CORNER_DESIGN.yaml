          The very first rule in the ladder: the request carries a declared X-User-Role of Elector but
          no X-User-ID header at all. Priority 1 fires with 401 ERR_UNAUTHENTICATED before the
          entity_backed identity lookup at priority 4 and before any cycle-state or eligibility work,
          so the response cannot be the 403 an unknown-but-present identity would produce.
