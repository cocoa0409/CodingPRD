  - section: rbac
    instances:
      - name: create_jurisdiction_as_auditor_forbidden
        claim_type: role_exclusive_denial
        grounds:
          - "roles.AssociationAdmin"
          - "errors[ERR_INSUFFICIENT_PERMISSIONS]"
        distinguishing_aspect: "Jurisdiction registration is exclusive to AssociationAdmin; AuditAuthority is rejected at priority 2 before any other check."
        test_recipe:
          setup: ["Empty database"]
          setup_api_calls: []
          trigger:
