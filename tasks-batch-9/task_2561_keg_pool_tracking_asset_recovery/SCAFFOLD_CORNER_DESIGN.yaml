# §1.9 Scaffold Corner Design — task 2561 Keg Pool Tracking & Asset Recovery
#
# Breadth probe over the whole §1.1–§1.7 surface of SCAFFOLD.yaml. `section:` values are
# the nine sections of references/claim-extraction-guide.md; `claim_type:` values are that
# section's own table rows (Table 6 declares no rows, only the obligation "verify every
# error code is triggerable", so its instances carry claim_type: triggerable).
#
# Conventions shared with SCAFFOLD_DIFFICULTY_DESIGN.yaml:
#   * The logical clock is pinned FIRST with POST /_clock/set_current_utc and parked late in
#     the day (23:00Z) when an instance needs several earlier same-day instants, because
#     validation priority 33 rejects any scanned_at / received_at / dispatched_at / effective_date
#     in the future.
#   * A CommodityIndex row is posted before any LossAssessment (validation priority 32).
#   * Every allocate re-reads FloatAgreement.version immediately before the call, because
#     allocate itself bumps that version (§1.2.1 order-allocate-stale-agreement).
#   * Pools are stocked so the post-allocation available_pct stays at or above
#     restrict_threshold_pct unless the instance is specifically about the posture cascade.
#   * Opaque actor ids: PoolOperator "op-1", ServiceTechnician "tech-1"/"tech-2",
#     AssetRecoveryAnalyst "analyst-1"/"analyst-2" (the pairs exist for the two §1.7
#     segregation-of-duties rules). Brewer / Distributor X-User-ID is the entity id.
#   * Every money / percentage literal below was executed against the §1.3 formula and its
#     `constants:` before being written.
#
# §1.5 audit performed while writing this file (priority-ladder outcomes, all rung 1 —
# every corner turned out reachable by composing declared endpoints; no new endpoint and
# no /_ test-driving endpoint was needed beyond the clock setter §1.5 already had):
#   - EVIDENCE_HOLD out of a bucket other than IN_TRADE had no declared Keg edge, which made
#     invariant pool_census_conserved variant B ("held kegs from three different buckets")
#     and every clawback of a RETURN_DWELL accrual unreachable -> §1.2 gained hold/resume
#     edges for IN_FLOAT / FILLED / AT_RETAIL / IN_SERVICE and the CLOSE side effects were
#     narrowed to "attached kegs that are on EVIDENCE_HOLD".
#   - ERR_SCAN_SEQUENCE_INVALID was unreachable because validation priority 10 also judged
#     keg custody_state for the requested scan_point -> priority 10's check now excludes it
#     and keeps only the cross-entity "FILL requires its order DISPATCHED" clause.
#   - ERR_SCAN_PARTY_MISMATCH's "forbids" half is pre-empted by priority 4, so priority 28's
#     check now names the MISSING-identifier half as its reachable failure mode.
#   - stainless_scrap_value's "on a tie of effective_date take the latest created_at" clause
#     contradicted validation priority 38 (effective_date globally unique) -> replaced.
#   - POST /pools/{pool_id}/kegs with no CommodityIndex row had undefined scrap value ->
#     pinned to 0, with priority 32 refusing only POST /loss-assessments.
#   - POST /pools/{pool_id}/replenishment-sweep's swept_keg_count had no definition ->
#     pinned to the kegs that actually had an open dwell spell.
#   - IssuanceOrder ALLOCATED -> CANCELLED promised that "kegs already FILLED stay with the
#     brewer", which is unreachable (a FILL requires the order to be DISPATCHED and DISPATCHED
#     is terminal) -> the clause now states the reachable conditional cascade: a REQUESTED order
#     returns nothing, a PARTIALLY_ALLOCATED one returns its allocated_keg_count.
#   - TheftInvestigation.stainless_value_at_risk_cents cited a calculation name that does not
#     exist -> repointed at stainless_scrap_value with "rounded per keg, then summed".
#   - keg_loss_value said REPLACEMENT_COST was "mandatory" when fill_count = 0 or the cause is
#     STOLEN_SUSPECTED without saying whether a contrary assessment_basis errors -> pinned as
#     silent coercion (no ERR_INVALID_REQUEST), which is what makes the variant selection
#     observable on the stored row.
#   - POST /theft-investigations accepts a keg_ids list and required every keg to belong to the
#     pool, but no rule said which error a foreign-pool keg raises -> validation priority 7 now
#     resolves list-valued FKs element by element inside the scope named earlier in the body,
#     so a keg of another pool is ERR_KEG_NOT_FOUND and nothing is attached.
#   - cascade L1 of the assessment uphold promised a custody move for every cause, but §1.2
#     declares LOST only from FILLED / IN_TRADE / AT_RETAIL and SCRAPPED only from QUARANTINED,
#     so upholding a LOST_IN_TRADE assessment on an ISSUED_TO_BREWER keg had no defined target
#     -> L1 now scopes the move to the declared edges and leaves custody and the census
#     untouched (with no error) in every other bucket, which is what makes the WAIVED and
#     ISSUED_TO_BREWER corners below assertable.
#   - Keg.asset_tag was constrained "unique within pool_id" while validation priority 38 made
#     it globally unique, so ERR_DUPLICATE_ASSET_TAG had two different trigger conditions ->
#     the field now matches priority 38 (globally unique, etched on the shell).
#   - two independent probation gates (balance >= 25000 in cascade L3, trailing loss rate
#     >= 1500 bp in calculations.brewer_loss_rate_bp) can trip in the same uphold with no
#     stated winner for Brewer.status_reason -> brewer_loss_rate_bp now pins the order:
#     L3's balance gate runs first and claims CHARGEBACK_BALANCE_THRESHOLD, so
#     LOSS_RATE_THRESHOLD is observable only below the balance threshold.
#   - the REVERSE cascade lifted PROBATION on any brewer whose recomputed balance fell below
#     25000, which would have erased a probation that the loss-rate gate had forced (that
#     brewer's balance is below 25000 the whole time) -> the cascade is now conditioned on
#     status_reason == CHARGEBACK_BALANCE_THRESHOLD: a reversal only undoes the gate it tripped.
#   - the SETTLE / REVERSE role split lived only as a §1.2 precondition ("X-User-Role ==
#     PoolOperator") with no error code, and priority 2 could not enforce it because both roles
#     are on the endpoint and the split depends on payload.action -> validation priority 26
#     gained clause (b): a role/action mismatch on chargeback-resolution is
#     ERR_SEGREGATION_OF_DUTIES 403, judged after priority 10 and before priority 51.
#   - POST /service-cycles promised "keg custody_state moves to IN_SERVICE if it is not already"
#     while §1.2 declared no edge into IN_SERVICE except a RETURN scan and an EVIDENCE_HOLD
#     resume, so a recertification pull off the float was an undeclared transition -> §1.2 gained
#     the IN_FLOAT -> IN_SERVICE edge (the only intake that lowers available_pct) and priority 10
#     now judges keg custody_state IN {IN_FLOAT, IN_SERVICE} for this endpoint, every other
#     bucket being ERR_INVALID_STATE 409.
#   - a cascade recompute that changes nothing (a keg import re-evaluating an ACTIVE agreement's
#     float_posture to the same value) had no stated version behaviour, which made every
#     expected_agreement_version literal unpredictable -> §1.2.1 now pins "a recompute bumps the
#     row only when it changes a stored field of that row", so version numbers are countable.
#   - version bumping under multi-link cascades was ambiguous -> §1.2.1 gained the
#     "exactly one bump per affected row per request" note, which is what lets the
#     optimistic_concurrency instances below assert literal version numbers.

scaffold_corner_design:

  # ==========================================================================
  # ENTITIES — Table 1 rows plus the `graph` topology rows
  # ==========================================================================
  - section: entities
    instances:
      - name: brewer_creation_returns_active_status_and_zeroed_ledgers
        claim_type: Creation
        grounds:
          - endpoints[POST /brewers]
          - entities.Brewer.fields.status
          - entities.Brewer.fields.chargeback_balance_cents
          - entities.Brewer.fields.lifetime_fill_count
          - entities.Brewer.fields.upheld_loss_count
        distinguishing_aspect: "A brewer created with only name/brand_code/credit_limit_cents comes back 201 with status ACTIVE, all five risk-and-money counters at 0 and status_reason null — no field is left absent from the response."
        test_recipe:
          setup:
            - "Empty DB; logical clock pinned to 2026-08-01T23:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T23:00:00Z" }
              as: PoolOperator
              as_user_id: "op-1"
          trigger:
            - call: "POST /brewers"
              payload: { name: "Ridgeline Brewing", brand_code: "RDG", credit_limit_cents: 400000 }
              as: PoolOperator
              as_user_id: "op-1"
              captures: { b1_id: "$.data.id" }
          assert:
            - "HTTP 201"
            - "Brewer.${b1_id}.name == Ridgeline Brewing and brand_code == RDG"
            - "Brewer.${b1_id}.status == ACTIVE and status_reason == null"
            - "Brewer.${b1_id}.credit_limit_cents == 400000"
            - "Brewer.${b1_id}.chargeback_balance_cents == 0"
            - "Brewer.${b1_id}.lifetime_fill_count == 0 and upheld_loss_count == 0"
            - "Brewer.${b1_id}.loss_rate_bp_trailing_90d == 0 and loss_rate_bp_lifetime == 0"
            - "Brewer.${b1_id}.version == 1 and id, created_at, updated_at are all present"
            - "response envelope: meta.api_request_id and meta.api_request_timestamp present, response_type == object"

      - name: pool_creation_applies_threshold_defaults_and_starts_frozen
        claim_type: Defaults
        grounds:
          - endpoints[POST /pools]
          - entities.KegPool.fields.restrict_threshold_pct
          - entities.KegPool.fields.freeze_threshold_pct
          - entities.KegPool.fields.restricted_max_kegs_per_order
          - calculations.pool_posture
        distinguishing_aspect: "Omitting all three optional threshold inputs yields restrict_threshold_pct 25, freeze_threshold_pct 10 and restricted_max_kegs_per_order 2, and an empty pool reports available_pct 0.00 with posture FROZEN rather than OPEN."
        test_recipe:
          setup:
            - "Empty DB; clock at 2026-08-01T23:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T23:00:00Z" }
              as: PoolOperator
              as_user_id: "op-1"
          trigger:
            - call: "POST /pools"
              payload: { pool_code: "HB-50L", size_liters: 50, stainless_weight_kg: 12.5, replacement_cost_cents: 23500, region_code: "CO" }
              as: PoolOperator
              as_user_id: "op-1"
              captures: { p1_id: "$.data.id" }
          assert:
            - "HTTP 201"
            - "KegPool.${p1_id}.restrict_threshold_pct == 25"
            - "KegPool.${p1_id}.freeze_threshold_pct == 10"
            - "KegPool.${p1_id}.restricted_max_kegs_per_order == 2"
            - "KegPool.${p1_id}.kegs_total == 0 and kegs_available == 0 and kegs_circulating == 0 and kegs_servicing == 0 and kegs_held == 0 and kegs_written_off == 0"
            - "KegPool.${p1_id}.available_pct == 0.00"
            - "KegPool.${p1_id}.posture == FROZEN (calculation pool_posture: kegs_total = 0 is FROZEN, not OPEN)"
            - "KegPool.${p1_id}.version == 1"

      - name: keg_import_defaults_custody_service_state_and_certification
        claim_type: Defaults
        grounds:
          - endpoints[POST /pools/{pool_id}/kegs]
          - entities.Keg.fields.custody_state
          - entities.Keg.fields.service_state
          - entities.Keg.fields.last_pressure_test_at
          - entities.Keg.fields.stainless_scrap_value_cents
          - calculations.stainless_scrap_value
        distinguishing_aspect: "A keg imported with nothing but an asset_tag lands IN_FLOAT / SERVICE_OK / WITHIN_LIMIT with last_pressure_test_at equal to its own created_at (never null) and stainless_scrap_value_cents 3900 = round_half_up(12.5 kg x 480 c/kg x 0.65)."
        test_recipe:
          setup:
            - "Clock 2026-08-01T23:00:00Z; one CommodityIndex row effective 2026-07-01 at 480 cents/kg."
            - "Pool HB-50L with stainless_weight_kg 12.5 and replacement_cost_cents 23500."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T23:00:00Z" }
              as: PoolOperator
              as_user_id: "op-1"
            - call: "POST /commodity-index"
              payload: { effective_date: "2026-07-01", usd_cents_per_kg: 480, source: "LME_SS304" }
              as: PoolOperator
              as_user_id: "op-1"
            - call: "POST /pools"
              payload: { pool_code: "HB-50L", size_liters: 50, stainless_weight_kg: 12.5, replacement_cost_cents: 23500, region_code: "CO" }
              as: PoolOperator
              as_user_id: "op-1"
              captures: { p1_id: "$.data.id" }
          trigger:
            - call: "POST /pools/${p1_id}/kegs"
              payload: { asset_tag: "K-0001" }
              as: PoolOperator
              as_user_id: "op-1"
              captures: { k1_id: "$.data.id" }
          assert:
            - "HTTP 201"
            - "Keg.${k1_id}.custody_state == IN_FLOAT and service_state == SERVICE_OK and dwell_flag == WITHIN_LIMIT"
            - "Keg.${k1_id}.fill_count == 0 and fills_at_last_pressure_test == 0 and scan_count == 0 and cumulative_dwell_days == 0"
            - "Keg.${k1_id}.last_pressure_test_at == Keg.${k1_id}.created_at == 2026-08-01T23:00:00Z"
            - "Keg.${k1_id}.current_brewer_id, current_distributor_id, filling_brewer_id, issuance_order_id, theft_investigation_id, filled_brand_code, dwell_started_at, distributor_custody_started_at, last_scanned_at and pre_hold_custody_state are all null"
            - "Keg.${k1_id}.misdelivery_open == false and assessment_open == false"
            - "Keg.${k1_id}.stainless_scrap_value_cents == 3900"
            - "KegPool.${p1_id}.kegs_total == 1 and kegs_available == 1 and available_pct == 100.00 and posture == OPEN"

      - name: keg_import_derives_service_state_from_the_supplied_counters
        claim_type: Computed Fields
        grounds:
          - endpoints[POST /pools/{pool_id}/kegs]
          - entities.Keg.fields.service_state
          - entities.Keg.fields.fills_at_last_pressure_test
        distinguishing_aspect: "service_state is derived, never accepted: fill_count 25 with fills_at_last_pressure_test 0 imports as SERVICE_DUE (25 >= the 25-fill interval), fill_count 24 imports as SERVICE_OK, and a 2024-01-01 certification imports as SERVICE_OVERDUE because 943 days > 730."
        test_recipe:
          setup:
            - "Clock 2026-08-01T23:00:00Z; CommodityIndex effective 2026-07-01 at 480; pool HB-50L."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T23:00:00Z" }
              as: PoolOperator
              as_user_id: "op-1"
            - call: "POST /commodity-index"
              payload: { effective_date: "2026-07-01", usd_cents_per_kg: 480, source: "LME_SS304" }
              as: PoolOperator
              as_user_id: "op-1"
            - call: "POST /pools"
              payload: { pool_code: "HB-50L", size_liters: 50, stainless_weight_kg: 12.5, replacement_cost_cents: 23500, region_code: "CO" }
              as: PoolOperator
              as_user_id: "op-1"
              captures: { p1_id: "$.data.id" }
          trigger:
            - call: "POST /pools/${p1_id}/kegs"
              payload: { asset_tag: "K-DUE", fill_count: 25, fills_at_last_pressure_test: 0 }
              as: PoolOperator
              as_user_id: "op-1"
              captures: { kdue_id: "$.data.id" }
            - call: "POST /pools/${p1_id}/kegs"
              payload: { asset_tag: "K-OK", fill_count: 24, fills_at_last_pressure_test: 0 }
              as: PoolOperator
              as_user_id: "op-1"
              captures: { kok_id: "$.data.id" }
            - call: "POST /pools/${p1_id}/kegs"
              payload: { asset_tag: "K-OVERDUE", last_pressure_test_at: "2024-01-01T00:00:00Z" }
              as: PoolOperator
              as_user_id: "op-1"
              captures: { kover_id: "$.data.id" }
          assert:
            - "Keg.${kdue_id}.service_state == SERVICE_DUE and fill_count == 25 (boundary is inclusive at 25)"
            - "Keg.${kok_id}.service_state == SERVICE_OK and fill_count == 24"
            - "Keg.${kover_id}.service_state == SERVICE_OVERDUE and last_pressure_test_at == 2024-01-01T00:00:00Z"
            - "all three kegs are custody_state IN_FLOAT, so KegPool.${p1_id}.kegs_available == 3 and available_pct == 100.00 and posture == OPEN"
            - "Keg.${kover_id}.dwell_flag == WITHIN_LIMIT (service lapse is not a dwell condition)"

      - name: keg_import_ignores_client_supplied_id_version_extra_field
        claim_type: System Fields
        grounds:
          - endpoints[POST /pools/{pool_id}/kegs]
          - entities.Keg.common_fields
        distinguishing_aspect: "id, version, created_at and updated_at are server-generated: a payload carrying id, version 99 and created_at is accepted with those extra fields ignored, and the stored row still has version 1 and a server-minted id different from the supplied one."
        test_recipe:
          setup:
            - "Clock 2026-08-01T23:00:00Z; CommodityIndex effective 2026-07-01 at 480; pool HB-50L."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T23:00:00Z" }
              as: PoolOperator
              as_user_id: "op-1"
            - call: "POST /commodity-index"
              payload: { effective_date: "2026-07-01", usd_cents_per_kg: 480, source: "LME_SS304" }
              as: PoolOperator
              as_user_id: "op-1"
            - call: "POST /pools"
              payload: { pool_code: "HB-50L", size_liters: 50, stainless_weight_kg: 12.5, replacement_cost_cents: 23500, region_code: "CO" }
              as: PoolOperator
              as_user_id: "op-1"
              captures: { p1_id: "$.data.id" }
          trigger:
            - call: "POST /pools/${p1_id}/kegs"
              payload: { asset_tag: "K-0001", id: "11111111-1111-4111-8111-111111111111", version: 99, created_at: "2020-01-01T00:00:00Z" }
              as: PoolOperator
              as_user_id: "op-1"
              captures: { k1_id: "$.data.id" }
          assert:
            - "HTTP 201"
            - "Keg.${k1_id}.id != 11111111-1111-4111-8111-111111111111"
            - "Keg.${k1_id}.version == 1 (the supplied 99 is ignored, not stored)"
            - "Keg.${k1_id}.created_at == 2026-08-01T23:00:00Z (logical clock, not the supplied 2020-01-01T00:00:00Z)"
            - "Keg.${k1_id}.asset_tag == K-0001 and custody_state == IN_FLOAT"
            - "GET /pools/${p1_id}/kegs returns exactly one row and its id is ${k1_id}"

      - name: pool_and_keg_retrieval_round_trip_every_stored_field
        claim_type: Retrieval
        grounds:
          - endpoints[GET /pools/{pool_id}]
          - endpoints[GET /kegs/{keg_id}]
          - entities.Keg.fields.pool_id
        distinguishing_aspect: "GET /pools/{pool_id} and GET /kegs/{keg_id} return the stored values verbatim — pool_code HB-50L, stainless_weight_kg 12.5, replacement_cost_cents 23500, keg.pool_id equal to the parent id — with no field silently defaulted on read."
        test_recipe:
          setup:
            - "Clock 2026-08-01T23:00:00Z; index effective 2026-07-01 at 480; pool HB-50L with one keg K-0001."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T23:00:00Z" }
              as: PoolOperator
              as_user_id: "op-1"
            - call: "POST /commodity-index"
              payload: { effective_date: "2026-07-01", usd_cents_per_kg: 480, source: "LME_SS304" }
              as: PoolOperator
              as_user_id: "op-1"
            - call: "POST /pools"
              payload: { pool_code: "HB-50L", size_liters: 50, stainless_weight_kg: 12.5, replacement_cost_cents: 23500, region_code: "CO", restrict_threshold_pct: 25, freeze_threshold_pct: 10, restricted_max_kegs_per_order: 2 }
              as: PoolOperator
              as_user_id: "op-1"
              captures: { p1_id: "$.data.id" }
            - call: "POST /pools/${p1_id}/kegs"
              payload: { asset_tag: "K-0001" }
              as: PoolOperator
              as_user_id: "op-1"
              captures: { k1_id: "$.data.id" }
          trigger:
            - call: "GET /pools/${p1_id}"
              payload: {}
              as: ServiceTechnician
              as_user_id: "tech-1"
            - call: "GET /kegs/${k1_id}"
              payload: {}
              as: ServiceTechnician
              as_user_id: "tech-1"
          assert:
            - "both reads are HTTP 200 with response_type object"
            - "KegPool.${p1_id}.pool_code == HB-50L and size_liters == 50 and stainless_weight_kg == 12.5 and replacement_cost_cents == 23500 and region_code == CO"
            - "KegPool.${p1_id}.kegs_total == 1 and kegs_available == 1 and available_pct == 100.00 and posture == OPEN"
            - "Keg.${k1_id}.pool_id == ${p1_id} and asset_tag == K-0001 and custody_state == IN_FLOAT and stainless_scrap_value_cents == 3900"
            - "neither read bumps a version: KegPool.${p1_id}.version and Keg.${k1_id}.version are unchanged at 2 and 1 respectively (the pool was bumped once by the keg import)"

      - name: pool_kegs_listing_reports_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints[GET /pools/{pool_id}/kegs]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With five kegs in the pool, limit 2 offset 0 returns 2 rows with total_count 5 and has_more true; limit 2 offset 4 returns 1 row with has_more false; omitting limit applies the default 10 and returns all 5 with has_more false."
        test_recipe:
          setup:
            - "Clock 2026-08-01T23:00:00Z; index effective 2026-07-01 at 480; pool HB-50L with kegs K-0001..K-0005."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T23:00:00Z" }
              as: PoolOperator
              as_user_id: "op-1"
            - call: "POST /commodity-index"
              payload: { effective_date: "2026-07-01", usd_cents_per_kg: 480, source: "LME_SS304" }
              as: PoolOperator
              as_user_id: "op-1"
            - call: "POST /pools"
              payload: { pool_code: "HB-50L", size_liters: 50, stainless_weight_kg: 12.5, replacement_cost_cents: 23500, region_code: "CO" }
              as: PoolOperator
              as_user_id: "op-1"
              captures: { p1_id: "$.data.id" }
            - call: "POST /pools/${p1_id}/kegs"
              payload: { asset_tag: "K-0001" }
              as: PoolOperator
              as_user_id: "op-1"
            - call: "POST /pools/${p1_id}/kegs"
              payload: { asset_tag: "K-0002" }
              as: PoolOperator
              as_user_id: "op-1"
            - call: "POST /pools/${p1_id}/kegs"
              payload: { asset_tag: "K-0003" }
              as: PoolOperator
              as_user_id: "op-1"
            - call: "POST /pools/${p1_id}/kegs"
              payload: { asset_tag: "K-0004" }
              as: PoolOperator
              as_user_id: "op-1"
            - call: "POST /pools/${p1_id}/kegs"
              payload: { asset_tag: "K-0005" }
              as: PoolOperator
              as_user_id: "op-1"
          trigger:
            - call: "GET /pools/${p1_id}/kegs"
              payload: { limit: 2, offset: 0 }
              as: PoolOperator
              as_user_id: "op-1"
            - call: "GET /pools/${p1_id}/kegs"
              payload: { limit: 2, offset: 4 }
              as: PoolOperator
              as_user_id: "op-1"
            - call: "GET /pools/${p1_id}/kegs"
              payload: {}
              as: PoolOperator
              as_user_id: "op-1"
          assert:
            - "first read: response_type == array, data length 2, limit 2, offset 0, total_count 5, has_more true"
            - "second read: data length 1, limit 2, offset 4, total_count 5, has_more false"
            - "third read: limit 10 (default), offset 0, data length 5, total_count 5, has_more false"
