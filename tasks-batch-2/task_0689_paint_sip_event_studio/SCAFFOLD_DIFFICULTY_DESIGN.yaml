# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Paint & Sip Event Studio — 9 Difficulty Rules x >= 2 instances each.
# Default logical clock: 2026-04-01T00:00:00Z (set explicitly per instance).
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: dvc_cancellation_credit_ladder_vs_studio_override
        grounds:
          - calculations.cancellation_credit_ladder
          - state_machines.Reservation.HELD_to_CANCELLED
          - state_machines.StudioEvent.OPEN_to_CANCELLED
          - entities.Reservation.fields.credit_granted_cents
        distinguishing_aspect: "Same reservation (total_cents=26250) cancelled <24h before start yields 0 credit on the customer-initiated ladder, but 26250 (100%) when the cancellation is a side effect of a studio-initiated event cancel — two divergent results from the same input on the Reservation credit domain."
        test_recipe:
          setup:
            - "Clock at 2026-04-01T00:00:00Z; event starts 2026-04-01T10:00:00Z (10h out => <24h tier)."
            - "Two identical OPEN reservations of 5 seats @4500 + kit 1200 each => total_cents=26250."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /studio-ops/studios"
              payload: { name: "Main Room", room_capacity_seats: 30 }
              as: StudioManager
              captures: { studio_id: $.data.id }
            - call: "POST /studio-ops/artists"
              payload: { full_name: "Ada", hourly_rate_cents: 5000 }
              as: StudioManager
              captures: { artist_id: $.data.id }
            - call: "POST /studio-ops/events"
              payload: { studio_id: "${studio_id}", title: "Sunset", event_type: "PUBLIC_CLASS", start_utc: "2026-04-01T10:00:00Z", end_utc: "2026-04-01T12:00:00Z", seats_capacity: 30, price_cents_per_seat: 4500, kit_fee_cents: 1200 }
              as: StudioManager
              captures: { event_id: $.data.id }
            - call: "POST /studio-ops/assignments"
              payload: { event_id: "${event_id}", artist_id: "${artist_id}" }
              as: StudioManager
            - call: "POST /studio-ops/events/${event_id}/schedule"
              payload: {}
              as: StudioManager
            - call: "POST /studio-ops/events/${event_id}/open"
              payload: {}
              as: StudioManager
              captures: { ev_v: $.data.version }
            - call: "POST /studio-ops/customers"
              payload: { email: "c1@x.com", full_name: "C One", birthdate: "1990-01-01T00:00:00Z" }
              as: Customer
              captures: { cust_id: $.data.id }
            - call: "POST /studio-ops/reservations"
              payload: { event_id: "${event_id}", customer_id: "${cust_id}", booking_mode: "PUBLIC", seats: 5, include_supply_kit: true, expected_event_version: "${ev_v}" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { res_a_id: $.data.id, ev_v2: $.data.version }
          trigger:
            - call: "POST /studio-ops/reservations/${res_a_id}/cancel"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
              captures: { credit_ladder: $.data.credit_granted_cents }
          assert:
            - "Reservation.${res_a_id}.credit_granted_cents == 0"
            - "Reservation.${res_a_id}.cancelled_at_hours_before == 10"
            - "A second reservation of the same shape, cancelled via POST /studio-ops/events/{id}/cancel, has credit_granted_cents == 26250 (100% studio-override) despite the same <24h timing."

      - name: dvc_fundraiser_pledged_vs_settled
        grounds:
          - calculations.fundraiser_donation
          - entities.StudioEvent.fields.pledged_donation_cents
          - entities.StudioEvent.fields.settled_donation_cents
          - state_machines.StudioEvent.OPEN_to_CLOSED
        distinguishing_aspect: "On a FUNDRAISER event (donation_pct=40), pledged_donation_cents=22380 over HELD+CONFIRMED bookings (totals 13500+26250+16200) but settled_donation_cents=16980 at close over only CHECKED_IN bookings (26250+16200) — different input set on the StudioEvent donation domain, distinct from the Reservation-credit dual variant."
        test_recipe:
          setup:
            - "FUNDRAISER event donation_pct=40, capacity 30, start 2026-04-02T10:00:00Z."
            - "Three reservations: A=3 seats@4500 (total 13500), B=5 seats@4500+kit1200 (26250), C=4 seats@4500 (16200, gp10)."
            - "A is paid+confirmed but becomes NO_SHOW at close; B and C are checked-in."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /studio-ops/studios"
              payload: { name: "Gala Room", room_capacity_seats: 40 }
              as: StudioManager
              captures: { studio_id: $.data.id }
            - call: "POST /studio-ops/artists"
              payload: { full_name: "Bo", hourly_rate_cents: 6000 }
              as: StudioManager
              captures: { artist_id: $.data.id }
            - call: "POST /studio-ops/events"
              payload: { studio_id: "${studio_id}", title: "Charity Night", event_type: "FUNDRAISER", start_utc: "2026-04-02T10:00:00Z", end_utc: "2026-04-02T12:00:00Z", seats_capacity: 30, price_cents_per_seat: 4500, kit_fee_cents: 1200, fundraiser_donation_pct: 40 }
              as: StudioManager
              captures: { event_id: $.data.id }
            - call: "POST /studio-ops/assignments"
              payload: { event_id: "${event_id}", artist_id: "${artist_id}" }
              as: StudioManager
            - call: "POST /studio-ops/events/${event_id}/schedule"
              payload: {}
              as: StudioManager
            - call: "POST /studio-ops/events/${event_id}/open"
              payload: {}
              as: StudioManager
              captures: { v0: $.data.version }
            - call: "POST /studio-ops/customers"
              payload: { email: "fa@x.com", full_name: "F A", birthdate: "1990-01-01T00:00:00Z" }
              as: Customer
              captures: { ca: $.data.id }
            - call: "POST /studio-ops/reservations"
              payload: { event_id: "${event_id}", customer_id: "${ca}", booking_mode: "PUBLIC", seats: 3, expected_event_version: "${v0}" }
              as: Customer
              as_user_id: "${ca}"
              captures: { res_a: $.data.id, v1: $.data.version }
            - call: "POST /studio-ops/reservations"
              payload: { event_id: "${event_id}", customer_id: "${ca}", booking_mode: "PUBLIC", seats: 5, include_supply_kit: true, expected_event_version: "${v1}" }
              as: Customer
              as_user_id: "${ca}"
              captures: { res_b: $.data.id, v2: $.data.version }
            - call: "POST /studio-ops/reservations"
              payload: { event_id: "${event_id}", customer_id: "${ca}", booking_mode: "PUBLIC", seats: 4, expected_event_version: "${v2}" }
              as: Customer
              as_user_id: "${ca}"
              captures: { res_c: $.data.id }
            # Pay + confirm B and C, then add full attendee rosters and check them in.
            - call: "POST /studio-ops/reservations/${res_b}/pay"
              payload: { use_studio_credit: false }
              as: Customer
              as_user_id: "${ca}"
            - call: "POST /studio-ops/reservations/${res_b}/confirm"
              payload: {}
              as: Customer
              as_user_id: "${ca}"
            - call: "POST /studio-ops/reservations/${res_c}/pay"
              payload: { use_studio_credit: false }
              as: Customer
              as_user_id: "${ca}"
            - call: "POST /studio-ops/reservations/${res_c}/confirm"
              payload: {}
              as: Customer
              as_user_id: "${ca}"
            - call: "POST /studio-ops/attendees"
              payload: { reservation_id: "${res_b}", full_name: "b1", age_years: 30 }
              as: Customer
              as_user_id: "${ca}"
            - call: "POST /studio-ops/attendees"
              payload: { reservation_id: "${res_b}", full_name: "b2", age_years: 30 }
              as: Customer
              as_user_id: "${ca}"
            - call: "POST /studio-ops/attendees"
              payload: { reservation_id: "${res_b}", full_name: "b3", age_years: 30 }
              as: Customer
              as_user_id: "${ca}"
            - call: "POST /studio-ops/attendees"
              payload: { reservation_id: "${res_b}", full_name: "b4", age_years: 30 }
              as: Customer
              as_user_id: "${ca}"
            - call: "POST /studio-ops/attendees"
              payload: { reservation_id: "${res_b}", full_name: "b5", age_years: 30 }
              as: Customer
              as_user_id: "${ca}"
            - call: "POST /studio-ops/attendees"
              payload: { reservation_id: "${res_c}", full_name: "c1", age_years: 30 }
              as: Customer
              as_user_id: "${ca}"
            - call: "POST /studio-ops/attendees"
              payload: { reservation_id: "${res_c}", full_name: "c2", age_years: 30 }
              as: Customer
              as_user_id: "${ca}"
            - call: "POST /studio-ops/attendees"
              payload: { reservation_id: "${res_c}", full_name: "c3", age_years: 30 }
              as: Customer
              as_user_id: "${ca}"
            - call: "POST /studio-ops/attendees"
              payload: { reservation_id: "${res_c}", full_name: "c4", age_years: 30 }
              as: Customer
              as_user_id: "${ca}"
            - call: "POST /studio-ops/reservations/${res_b}/check-in"
              payload: {}
              as: FrontDesk
            - call: "POST /studio-ops/reservations/${res_c}/check-in"
              payload: {}
              as: FrontDesk
          trigger:
            - call: "GET /studio-ops/events/${event_id}"
              payload: {}
              as: StudioManager
              captures: { pledged_before: $.data.pledged_donation_cents }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-02T11:00:00Z" }
              as: PlatformAdmin
            - call: "POST /studio-ops/events/${event_id}/close"
              payload: {}
              as: StudioManager
              captures: { settled_after: $.data.settled_donation_cents }
          assert:
            - "Before close, StudioEvent.${event_id}.pledged_donation_cents == 22380 (40% of 13500+26250+16200)."
            - "After close (clock at 2026-04-02T11:00:00Z), StudioEvent.${event_id}.settled_donation_cents == 16980 (40% of 26250+16200; res_a forced NO_SHOW and excluded)."

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: cf_tiered_group_discount_then_kit_add
        grounds:
          - calculations.reservation_pricing
          - entities.Reservation.fields.total_cents
          - entities.Reservation.fields.group_discount_pct
        distinguishing_aspect: "Mode (a): >=3 inputs (seats, price_cents_per_seat, kit_fee_cents, include_supply_kit) with tiered-rate selection on seats and a conditional kit branch; 8 seats @4500 +kit1200 => 15% on base 36000 then +9600 kit => total 40200, not (36000+9600)*0.85."
        test_recipe:
          setup:
            - "OPEN event price 4500/seat, kit_fee 1200, capacity 30."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /studio-ops/studios"
              payload: { name: "R1", room_capacity_seats: 40 }
              as: StudioManager
              captures: { sid: $.data.id }
            - call: "POST /studio-ops/artists"
              payload: { full_name: "Cy", hourly_rate_cents: 0 }
              as: StudioManager
              captures: { aid: $.data.id }
            - call: "POST /studio-ops/events"
              payload: { studio_id: "${sid}", title: "Big Class", event_type: "PUBLIC_CLASS", start_utc: "2026-04-05T10:00:00Z", end_utc: "2026-04-05T12:00:00Z", seats_capacity: 30, price_cents_per_seat: 4500, kit_fee_cents: 1200 }
              as: StudioManager
              captures: { eid: $.data.id }
            - call: "POST /studio-ops/assignments"
              payload: { event_id: "${eid}", artist_id: "${aid}" }
              as: StudioManager
            - call: "POST /studio-ops/events/${eid}/schedule"
              payload: {}
              as: StudioManager
            - call: "POST /studio-ops/events/${eid}/open"
              payload: {}
              as: StudioManager
              captures: { ev_v: $.data.version }
            - call: "POST /studio-ops/customers"
              payload: { email: "g8@x.com", full_name: "G8", birthdate: "1990-01-01T00:00:00Z" }
              as: Customer
              captures: { cid: $.data.id }
          trigger:
            - call: "POST /studio-ops/reservations"
              payload: { event_id: "${eid}", customer_id: "${cid}", booking_mode: "PUBLIC", seats: 8, include_supply_kit: true, expected_event_version: "${ev_v}" }
              as: Customer
              as_user_id: "${cid}"
              captures: { rid: $.data.id }
          assert:
            - "Reservation.${rid}.base_cents == 36000"
            - "Reservation.${rid}.group_discount_pct == 15"
            - "Reservation.${rid}.kit_charge_cents == 9600"
            - "Reservation.${rid}.total_cents == 40200"

      - name: cf_giftcard_credit_card_waterfall
        grounds:
          - calculations.gift_card_payment_waterfall
          - entities.Payment.fields.amount_cents
          - entities.GiftCard.fields.balance_cents
          - state_machines.Reservation.payment_status.UNPAID_to_PAID
        distinguishing_aspect: "Mode (c): pinned evaluation order over an ordered bucket chain (gift cards by created_at ASC, then studio credit, then card) — total 26250 draws gc1=10000, gc2=5000, card=11250; reordering the buckets would change which Payment rows carry which cents, so the order must be explicit."
        test_recipe:
          setup:
            - "Reservation total_cents=26250 (5 seats @4500 +kit1200), UNPAID."
            - "Two gift cards: gc1 issued 10000 (created first), gc2 issued 5000 (created second)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /studio-ops/studios"
              payload: { name: "R2", room_capacity_seats: 30 }
              as: StudioManager
              captures: { sid: $.data.id }
            - call: "POST /studio-ops/artists"
              payload: { full_name: "Di", hourly_rate_cents: 0 }
              as: StudioManager
              captures: { aid: $.data.id }
            - call: "POST /studio-ops/events"
              payload: { studio_id: "${sid}", title: "Pay Class", event_type: "PUBLIC_CLASS", start_utc: "2026-04-05T10:00:00Z", end_utc: "2026-04-05T12:00:00Z", seats_capacity: 30, price_cents_per_seat: 4500, kit_fee_cents: 1200 }
              as: StudioManager
              captures: { eid: $.data.id }
            - call: "POST /studio-ops/assignments"
              payload: { event_id: "${eid}", artist_id: "${aid}" }
              as: StudioManager
            - call: "POST /studio-ops/events/${eid}/schedule"
              payload: {}
              as: StudioManager
            - call: "POST /studio-ops/events/${eid}/open"
              payload: {}
              as: StudioManager
              captures: { ev_v: $.data.version }
            - call: "POST /studio-ops/gift-cards"
              payload: { code: "GC-1", issued_value_cents: 10000 }
              as: StudioManager
              captures: { gc1: $.data.id }
            - call: "POST /studio-ops/gift-cards"
              payload: { code: "GC-2", issued_value_cents: 5000 }
              as: StudioManager
              captures: { gc2: $.data.id }
            - call: "POST /studio-ops/customers"
              payload: { email: "wf@x.com", full_name: "WF", birthdate: "1990-01-01T00:00:00Z" }
              as: Customer
              captures: { cid: $.data.id }
            - call: "POST /studio-ops/reservations"
              payload: { event_id: "${eid}", customer_id: "${cid}", booking_mode: "PUBLIC", seats: 5, include_supply_kit: true, expected_event_version: "${ev_v}" }
              as: Customer
              as_user_id: "${cid}"
              captures: { rid: $.data.id }
          trigger:
            - call: "POST /studio-ops/reservations/${rid}/pay"
              payload: { gift_card_ids: ["${gc1}", "${gc2}"], use_studio_credit: false }
              as: Customer
              as_user_id: "${cid}"
              captures: { paid_status: $.data.payment_status }
          assert:
            - "Reservation.${rid}.payment_status == PAID"
            - "Reservation.${rid}.amount_paid_cents == 26250"
            - "GiftCard.${gc1}.balance_cents == 0 and status == DEPLETED"
            - "GiftCard.${gc2}.balance_cents == 0 and status == DEPLETED"
            - "Payments for ${rid}: one GIFT_CARD amount_cents==10000 (gc1), one GIFT_CARD amount_cents==5000 (gc2), one CARD amount_cents==11250."

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: nlsm_event_open_full_open_cycle
        grounds:
          - state_machines.StudioEvent.OPEN_to_FULL
          - state_machines.StudioEvent.FULL_to_OPEN
          - entities.StudioEvent.fields.seats_available
        distinguishing_aspect: "StudioEvent cycles OPEN->FULL->OPEN: a reservation filling the last seat drives status to FULL; cancelling it drives status back to OPEN — a true cycle on the StudioEvent.status machine, not a forward-only pipeline."
        test_recipe:
          setup:
            - "OPEN event capacity 5, price 4500; one reservation of 5 seats fills it."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /studio-ops/studios"
              payload: { name: "Tiny", room_capacity_seats: 5 }
              as: StudioManager
              captures: { sid: $.data.id }
            - call: "POST /studio-ops/artists"
              payload: { full_name: "Ed", hourly_rate_cents: 0 }
              as: StudioManager
              captures: { aid: $.data.id }
            - call: "POST /studio-ops/events"
              payload: { studio_id: "${sid}", title: "Small", event_type: "PUBLIC_CLASS", start_utc: "2026-04-05T10:00:00Z", end_utc: "2026-04-05T12:00:00Z", seats_capacity: 5, price_cents_per_seat: 4500 }
              as: StudioManager
              captures: { eid: $.data.id }
            - call: "POST /studio-ops/assignments"
              payload: { event_id: "${eid}", artist_id: "${aid}" }
              as: StudioManager
            - call: "POST /studio-ops/events/${eid}/schedule"
              payload: {}
              as: StudioManager
            - call: "POST /studio-ops/events/${eid}/open"
              payload: {}
              as: StudioManager
              captures: { ev_v: $.data.version }
            - call: "POST /studio-ops/customers"
              payload: { email: "cyc@x.com", full_name: "Cyc", birthdate: "1990-01-01T00:00:00Z" }
              as: Customer
              captures: { cid: $.data.id }
            - call: "POST /studio-ops/reservations"
              payload: { event_id: "${eid}", customer_id: "${cid}", booking_mode: "PUBLIC", seats: 5, expected_event_version: "${ev_v}" }
              as: Customer
              as_user_id: "${cid}"
              captures: { rid: $.data.id }
          trigger:
            - call: "GET /studio-ops/events/${eid}"
              payload: {}
              as: StudioManager
              captures: { st_full: $.data.status }
            - call: "POST /studio-ops/reservations/${rid}/cancel"
              payload: {}
              as: Customer
              as_user_id: "${cid}"
          assert:
            - "After the 5-seat reservation, StudioEvent.${eid}.status == FULL and seats_available == 0."
            - "After cancelling ${rid}, StudioEvent.${eid}.status == OPEN and seats_available == 5."

      - name: nlsm_reservation_parallel_dimensions
        grounds:
          - state_machines.Reservation.HELD_to_CONFIRMED
          - state_machines.Reservation.payment_status.UNPAID_to_PAID
          - entities.Reservation.fields.status
          - entities.Reservation.fields.payment_status
        distinguishing_aspect: "Reservation carries two independent state dimensions on one row: booking status (HELD) and payment_status evolve separately — pay flips payment_status UNPAID->PAID while booking status stays HELD, then confirm flips booking HELD->CONFIRMED while payment_status stays PAID (parallel dimensions on the Reservation entity, a different entity than the StudioEvent cycle)."
        test_recipe:
          setup:
            - "OPEN event price 4500; one HELD reservation of 3 seats (total 13500)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /studio-ops/studios"
              payload: { name: "Par", room_capacity_seats: 20 }
              as: StudioManager
              captures: { sid: $.data.id }
            - call: "POST /studio-ops/artists"
              payload: { full_name: "Fi", hourly_rate_cents: 0 }
              as: StudioManager
              captures: { aid: $.data.id }
            - call: "POST /studio-ops/events"
              payload: { studio_id: "${sid}", title: "Par Class", event_type: "PUBLIC_CLASS", start_utc: "2026-04-05T10:00:00Z", end_utc: "2026-04-05T12:00:00Z", seats_capacity: 20, price_cents_per_seat: 4500 }
              as: StudioManager
              captures: { eid: $.data.id }
            - call: "POST /studio-ops/assignments"
              payload: { event_id: "${eid}", artist_id: "${aid}" }
              as: StudioManager
            - call: "POST /studio-ops/events/${eid}/schedule"
              payload: {}
              as: StudioManager
            - call: "POST /studio-ops/events/${eid}/open"
              payload: {}
              as: StudioManager
              captures: { ev_v: $.data.version }
            - call: "POST /studio-ops/customers"
              payload: { email: "pd@x.com", full_name: "PD", birthdate: "1990-01-01T00:00:00Z" }
              as: Customer
              captures: { cid: $.data.id }
            - call: "POST /studio-ops/reservations"
              payload: { event_id: "${eid}", customer_id: "${cid}", booking_mode: "PUBLIC", seats: 3, expected_event_version: "${ev_v}" }
              as: Customer
              as_user_id: "${cid}"
              captures: { rid: $.data.id }
          trigger:
            - call: "POST /studio-ops/reservations/${rid}/pay"
              payload: { use_studio_credit: false }
              as: Customer
              as_user_id: "${cid}"
              captures: { ps_after_pay: $.data.payment_status, bs_after_pay: $.data.status }
            - call: "POST /studio-ops/reservations/${rid}/confirm"
              payload: {}
              as: Customer
              as_user_id: "${cid}"
              captures: { bs_after_confirm: $.data.status }
          assert:
            - "After pay: Reservation.${rid}.payment_status == PAID AND Reservation.${rid}.status == HELD (booking dimension unchanged)."
            - "After confirm: Reservation.${rid}.status == CONFIRMED AND Reservation.${rid}.payment_status == PAID (payment dimension unchanged)."

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: tc_event_cancel_three_hop
        grounds:
          - state_machines.StudioEvent.OPEN_to_CANCELLED
          - state_machines.Reservation.HELD_to_CANCELLED
          - state_machines.Reservation.payment_status.PAID_to_REFUNDED
          - entities.Customer.fields.credit_balance_cents
        distinguishing_aspect: "Depth-3 cascade from StudioEvent cancel: hop1 event CANCELLED -> reservation CANCELLED; hop2 the now-CANCELLED reservation's CARD Payment -> REVERSED and payment_status REFUNDED; hop3 the refund event credits Customer.credit_balance_cents by total_cents (13500). Each hop is caused by the previous, not by the original action directly."
        test_recipe:
          setup:
            - "Event OPEN, one PAID+CONFIRMED reservation of 3 seats (total 13500), paid by CARD."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-04-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /studio-ops/studios"
              payload: { name: "Casc", room_capacity_seats: 20 }
