- section: endpoints
  instances:
  - name: account_list_pagination_envelope
    claim_type: listing
    grounds:
    - response_envelope
    distinguishing_aspect: 'GET /bank/accounts honors limit/offset and reports total_count
      and has_more: 3 accounts, limit 2 -> 2 items with has_more true; offset 2 ->
      1 item with has_more false.'
    test_recipe:
      setup:
      - three accounts created
      setup_api_calls:
      - call: POST /bank/accounts
        payload:
          primary_owner_name: Pg 1
          owner_tax_id: P1
          ownership_type: INDIVIDUAL
          product_code: SAVINGS
          rate_bps: 0
          opening_deposit_cents: 1000
        as: OpsOfficer
      - call: POST /bank/accounts
        payload:
          primary_owner_name: Pg 2
          owner_tax_id: P2
          ownership_type: INDIVIDUAL
          product_code: SAVINGS
          rate_bps: 0
          opening_deposit_cents: 1000
        as: OpsOfficer
      - call: POST /bank/accounts
        payload:
          primary_owner_name: Pg 3
          owner_tax_id: P3
          ownership_type: INDIVIDUAL
          product_code: SAVINGS
          rate_bps: 0
          opening_deposit_cents: 1000
        as: OpsOfficer
      trigger:
      - call: GET /bank/accounts
        payload: {}
        as: Auditor
      assert:
      - GET /bank/accounts?limit=2 returns exactly 2 items with total_count == 3 and
        has_more == true
      - GET /bank/accounts?limit=2&offset=2 returns exactly 1 item with has_more ==
        false
  - name: account_list_filter_by_status
    claim_type: listing
    grounds:
    - endpoints
    distinguishing_aspect: The status? filter on GET /bank/accounts restricts results
      to matching lifecycle_status — one CLOSED account is excluded from a status=OPEN
      listing.
    test_recipe:
      setup:
      - two accounts; the second is closed
      setup_api_calls:
      - call: POST /bank/accounts
        payload:
          primary_owner_name: Fl 1
          owner_tax_id: F1
          ownership_type: INDIVIDUAL
          product_code: SAVINGS
          rate_bps: 0
          opening_deposit_cents: 1000
        as: OpsOfficer
        captures:
          acct_open: $.data.id
      - call: POST /bank/accounts
        payload:
          primary_owner_name: Fl 2
          owner_tax_id: F2
          ownership_type: INDIVIDUAL
          product_code: SAVINGS
          rate_bps: 0
          opening_deposit_cents: 1000
        as: OpsOfficer
        captures:
          acct_closed: $.data.id
          v_closed: $.data.version
      - call: POST /bank/accounts/${acct_closed}/close
        payload:
          expected_account_version: ${v_closed}
        as: OpsOfficer
      trigger:
      - call: GET /bank/accounts
        payload: {}
        as: Auditor
      assert:
      - GET /bank/accounts?status=OPEN contains ${acct_open} and not ${acct_closed}
      - GET /bank/accounts?status=CLOSED contains ${acct_closed} and not ${acct_open}
  - name: response_envelope_shape_on_success_and_error
    claim_type: computed_read
    grounds:
    - response_envelope
    distinguishing_aspect: Every response carries meta.api_request_id, meta.api_request_timestamp
      and response_type; success uses response_type object/array, error uses response_type
      error with data.error_id and data.message.
    test_recipe:
      setup:
      - one account
      setup_api_calls:
      - call: POST /bank/accounts
        payload:
          primary_owner_name: Env E
          owner_tax_id: E1
          ownership_type: INDIVIDUAL
          product_code: SAVINGS
          rate_bps: 0
          opening_deposit_cents: 1000
        as: OpsOfficer
        captures:
          acct: $.data.id
      trigger:
      - call: GET /bank/accounts/${acct}
        payload: {}
        as: Auditor
      assert:
      - success response has meta.api_request_id, meta.api_request_timestamp, response_type
        == object
      - an error response (any 4xx) has response_type == error and data.error_id +
        data.message
