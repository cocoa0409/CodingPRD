              as: Analyst
              as_user_id: "${an_id}"
              captures: { p_id: $.data.id }
            - call: "POST /api/assessments"
              payload: { parcel_id: "${p_id}", tax_year: 2026, original_assessed_value_cents: 30000000, millage_rate: 25.0, notice_date: "2026-06-15T00:00:00Z" }
              as: Analyst
              as_user_id: "${an_id}"
              captures: { as_id: $.data.id }
            - call: "POST /api/appeals"
              payload: { assessment_id: "${as_id}", analyst_id: "${an_id}", fee_agreement_id: "${fa_id}", valuation_method: "SALES_COMPARISON" }
              as: Analyst
              as_user_id: "${an_id}"
              captures: { ap_id: $.data.id }
            - call: "POST /api/appeals/${ap_id}/evidence"
              payload: { comp_address: "x", sale_price_cents: 30000000, sale_date: "2025-06-01T00:00:00Z", comp_assessed_value_cents: 27000000, adjustment_pct: 0.00 }
              as: Analyst
              as_user_id: "${an_id}"
            - call: "POST /api/appeals/${ap_id}/file"
              payload: {}
              as: Analyst
              as_user_id: "${an_id}"
            - call: "GET /api/appeals/${ap_id}"
              as: Analyst
              as_user_id: "${an_id}"
              captures: { av: $.data.version }
            - call: "POST /api/appeals/${ap_id}/settlement-offers"
              payload: { proposed_by: "JURISDICTION", offer_value_cents: 26000000, expires_at: "2026-12-31T00:00:00Z", expected_appeal_version: "${av}" }
              as: Analyst
              as_user_id: "${an_id}"
              captures: { off_id: $.data.id }
          trigger:
            - call: "POST /api/settlement-offers/${off_id}/accept"
              payload: {}
              as: Analyst
              as_user_id: "${an2_id}"
          assert:
