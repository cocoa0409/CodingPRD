              as: ClientIntegrator
              as_user_id: "${client_id}"
              captures: { s_id: "$.data.id" }
            - call: "POST /idv/verification-sessions/${s_id}/method-attempts"
              payload: { method_profile_id: "${p_doc_id}" }
              as: ClientIntegrator
              as_user_id: "${client_id}"
