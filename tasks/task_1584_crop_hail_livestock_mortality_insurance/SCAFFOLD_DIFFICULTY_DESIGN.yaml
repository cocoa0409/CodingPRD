  # ---------------------------------------------------------------------------
  # Rule 3 — non_linear_state_machine on DIFFERENT entities
  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: policy_parallel_billing_and_lifecycle_dimensions
        grounds:
          - state_machines.Policy
        distinguishing_aspect: |
          Policy has two INDEPENDENT state axes (lifecycle_state and
          billing_state) that evolve in parallel on the same row. Claims_posture
          is derived from their cross-product. The test exercises them
          independently: lifecycle moves BOUND→ACTIVE while billing stays
          PARTIALLY_PAID; then billing moves PARTIALLY_PAID→DELINQUENT while
          lifecycle stays ACTIVE.
        test_recipe:
          setup:
            - "Carrier; grower; PUBLISHED rate; Policy P (crop-hail, 1 CU of 1 acre; premium=1332) BOUND at 2026-08-01"
            - "Partial payment 600 → billing_state=PARTIALLY_PAID, lifecycle still BOUND"
            - "Clock to 2026-08-03 (>= effective) → lifecycle=ACTIVE, billing still PARTIALLY_PAID"
            - "Clock to 2026-09-03 (> bind+30d) → billing=DELINQUENT, lifecycle still ACTIVE"
          setup_api_calls:
            - call: "POST /carriers"
              payload: { carrier_code: "CHL-E", legal_name: "Carrier E", reinsurance_treaty_attachment_cents: 100000000 }
              as: PlatformAdmin
              captures: { carrier_id: $.data.id }
            - call: "POST /carriers/${carrier_id}/growers"
              payload: { full_name: "Grower E", tax_id_last4: "9999", email: "e@x.com", county_code: "06001", state_code: "CA" }
              as: Underwriter
              captures: { grower_id: $.data.id }
            - call: "POST /carriers/${carrier_id}/rate-tables"
              payload: { rating_kind: "CROP_HAIL", county_code: "06001", crop_code: "CORN", rate_per_100_cents_of_liability: 333, effective_from: "2026-01-01T00:00:00Z" }
              as: Underwriter
              captures: { rt: $.data.id }
            - call: "POST /carriers/${carrier_id}/rate-tables/${rt}/publish"
              payload: {}
              as: Underwriter
            - call: "POST /carriers/${carrier_id}/policies"
              payload: { grower_id: "${grower_id}", policy_kind: "CROP_HAIL", effective_date: "2026-08-02T00:00:00Z", expiration_date: "2026-12-31T00:00:00Z" }
              as: Underwriter
              captures: { policy_id: $.data.id }
            - call: "POST /carriers/${carrier_id}/policies/${policy_id}/coverage-units"
              payload: { county_code: "06001", crop_code: "CORN", declared_acres: 1 }
              as: Underwriter
            - call: "POST /carriers/${carrier_id}/policies/${policy_id}/bind"
              payload: {}
              as: Underwriter
            - call: "POST /carriers/${carrier_id}/policies/${policy_id}/premium-payments"
              payload: { amount_cents: 600 }
              as: Policyholder
              as_user_id: "${grower_id}"
              captures: { pp1: $.data.id }
          trigger:
            - call: "POST /carriers/${carrier_id}/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T00:00:00Z" }
              as: Underwriter
            - call: "GET /carriers/${carrier_id}/policies/${policy_id}"
              payload: {}
              as: Underwriter
              captures: { p_lifecycle_1: $.data.lifecycle_state, p_billing_1: $.data.billing_state, p_posture_1: $.data.claims_posture }
            - call: "POST /carriers/${carrier_id}/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-03T00:00:00Z" }
              as: Underwriter
            - call: "GET /carriers/${carrier_id}/policies/${policy_id}"
              payload: {}
              as: Underwriter
              captures: { p_lifecycle_2: $.data.lifecycle_state, p_billing_2: $.data.billing_state, p_posture_2: $.data.claims_posture }
          assert:
            - "after first clock set: Policy.lifecycle_state == ACTIVE AND Policy.billing_state == PARTIALLY_PAID"
            - "after second clock set: Policy.lifecycle_state == ACTIVE AND Policy.billing_state == DELINQUENT"
            - "Policy.claims_posture transitions OPEN → OPEN → RESTRICTED across the two clock sets"

      - name: claim_cyclic_withdraw_refile_loop
        grounds:
          - state_machines.Claim
          - state_machines.CoverageUnit
        distinguishing_aspect: |
          Claim contains a cycle in effect: REPORTED→INSPECTION_SCHEDULED→
          WITHDRAWN releases the CoverageUnit (UNDER_CLAIM→REPORTED) which
          allows a NEW Claim to be filed against the same unit — a cyclic loop
          at the entity-composition level. Different entity from Policy (the
          other instance) and uses a revert (REPORTED→WITHDRAWN) rather than
          parallel axes.
        test_recipe:
          setup:
            - "Carrier; grower; PUBLISHED rate; BOUND+ACTIVE+PAID policy; CU REPORTED (timely acreage report)"
            - "Claim C1 filed (loss_date 2026-08-04)"
            - "Adjuster assigned (C1 REPORTED→INSPECTION_SCHEDULED)"
            - "C1 withdrawn (INSPECTION_SCHEDULED→WITHDRAWN), CoverageUnit back to REPORTED"
          setup_api_calls:
            - call: "POST /carriers"
              payload: { carrier_code: "CHL-F", legal_name: "Carrier F", reinsurance_treaty_attachment_cents: 100000000 }
              as: PlatformAdmin
              captures: { carrier_id: $.data.id }
            - call: "POST /carriers/${carrier_id}/growers"
              payload: { full_name: "Grower F", tax_id_last4: "1010", email: "f@x.com", county_code: "06001", state_code: "CA" }
              as: Underwriter
              captures: { grower_id: $.data.id }
            - call: "POST /carriers/${carrier_id}/adjusters"
              payload: { full_name: "Adj F", license_number: "ADJ-F-1", county_codes: ["06001"], species_qualified: [], capacity_max_open_claims: 10 }
              as: Underwriter
              captures: { adjuster_id: $.data.id }
            - call: "POST /carriers/${carrier_id}/rate-tables"
              payload: { rating_kind: "CROP_HAIL", county_code: "06001", crop_code: "CORN", rate_per_100_cents_of_liability: 333, effective_from: "2026-01-01T00:00:00Z" }
              as: Underwriter
              captures: { rt: $.data.id }
            - call: "POST /carriers/${carrier_id}/rate-tables/${rt}/publish"
              payload: {}
              as: Underwriter
            - call: "POST /carriers/${carrier_id}/policies"
              payload: { grower_id: "${grower_id}", policy_kind: "CROP_HAIL", effective_date: "2026-08-02T00:00:00Z", expiration_date: "2026-12-31T00:00:00Z" }
              as: Underwriter
              captures: { policy_id: $.data.id }
            - call: "POST /carriers/${carrier_id}/policies/${policy_id}/coverage-units"
              payload: { county_code: "06001", crop_code: "CORN", declared_acres: 10 }
              as: Underwriter
              captures: { cu_id: $.data.id }
            - call: "POST /carriers/${carrier_id}/policies/${policy_id}/bind"
              payload: {}
              as: Underwriter
            # premium = round_half_up(10*40000*333/10000) = 13320
            - call: "POST /carriers/${carrier_id}/policies/${policy_id}/premium-payments"
              payload: { amount_cents: 13320 }
              as: Policyholder
              as_user_id: "${grower_id}"
            - call: "POST /carriers/${carrier_id}/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T00:00:00Z" }
              as: Underwriter
            - call: "POST /carriers/${carrier_id}/policies/${policy_id}/coverage-units/${cu_id}/acreage-reports"
              payload: { report_kind: "PLANTING", reported_acres: 10 }
              as: Policyholder
              as_user_id: "${grower_id}"
            - call: "POST /carriers/${carrier_id}/policies/${policy_id}/claims"
              payload: { coverage_unit_id: "${cu_id}", loss_date: "2026-08-04T00:00:00Z", percent_damage_estimate_pct: 20 }
              as: Policyholder
              as_user_id: "${grower_id}"
              captures: { claim1: $.data.id }
            - call: "POST /carriers/${carrier_id}/policies/${policy_id}/claims/${claim1}/assign-adjuster"
              payload: { adjuster_id: "${adjuster_id}" }
              as: ClaimsApprover
            - call: "POST /carriers/${carrier_id}/policies/${policy_id}/claims/${claim1}/withdraw"
              payload: {}
              as: Policyholder
              as_user_id: "${grower_id}"
          trigger:
            - call: "POST /carriers/${carrier_id}/policies/${policy_id}/claims"
              payload: { coverage_unit_id: "${cu_id}", loss_date: "2026-08-05T00:00:00Z", percent_damage_estimate_pct: 30 }
              as: Policyholder
              as_user_id: "${grower_id}"
              captures: { claim2: $.data.id }
          assert:
            - "Claim.${claim1}.claim_state == WITHDRAWN"
            - "CoverageUnit.${cu_id}.status == UNDER_CLAIM  (because claim2 opened it again)"
            - "Claim.${claim2}.claim_state == REPORTED"
            - "Claim.${claim2}.id != Claim.${claim1}.id  (the cycle produces a fresh claim, not a resurrection)"

  # ---------------------------------------------------------------------------
  # Rule 4 — transitive_cascade from DIFFERENT triggers
  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: claim_approve_cascades_to_grower_policy_and_coverage_unit
        grounds:
          - state_machines.Claim.UNDER_REVIEW_to_APPROVED
          - calculations.premium_reserve_recompute
        distinguishing_aspect: |
          Depth-3 chain: LossDetermination APPROVE → Claim (state, final_indemnity)
          → Policy (premium_reserve_cents recomputed, version bumped) → Grower
          (prior_claims_count incremented). Each hop caused by the previous one,
          not by the original API call directly.
        test_recipe:
          setup:
            - "Carrier; grower G with prior_claims_count=0; PUBLISHED crop-hail rate; policy P BOUND+ACTIVE+PAID with 1 CU (10 acres); premium=13320; reserve=floor(13320*0.6)=7992"
            - "Claim filed, adjuster assigned, inspection submitted (observed_damage=10%), submit-for-review"
            - "provisional = 10*40000*0.10 = 40000 cents"
            - "Safety cap = premium_reserve + provisional = 7992 + 40000 = 47992. Approver picks approved=5000 ≤ cap."
            - "Capture Grower.prior_claims_count before (=0), Policy.premium_reserve_cents before (=7992), Policy.version before"
          setup_api_calls:
            - call: "POST /carriers"
              payload: { carrier_code: "CHL-G", legal_name: "Carrier G", reinsurance_treaty_attachment_cents: 100000000 }
              as: PlatformAdmin
              captures: { carrier_id: $.data.id }
            - call: "POST /carriers/${carrier_id}/growers"
              payload: { full_name: "Grower G", tax_id_last4: "2222", email: "g@x.com", county_code: "06001", state_code: "CA" }
              as: Underwriter
              captures: { grower_id: $.data.id }
            - call: "POST /carriers/${carrier_id}/adjusters"
              payload: { full_name: "Adj G", license_number: "ADJ-G-1", county_codes: ["06001"], species_qualified: [], capacity_max_open_claims: 5 }
              as: Underwriter
              captures: { adjuster_id: $.data.id }
            - call: "POST /carriers/${carrier_id}/rate-tables"
              payload: { rating_kind: "CROP_HAIL", county_code: "06001", crop_code: "CORN", rate_per_100_cents_of_liability: 333, effective_from: "2026-01-01T00:00:00Z" }
              as: Underwriter
              captures: { rt: $.data.id }
            - call: "POST /carriers/${carrier_id}/rate-tables/${rt}/publish"
              payload: {}
              as: Underwriter
            - call: "POST /carriers/${carrier_id}/policies"
              payload: { grower_id: "${grower_id}", policy_kind: "CROP_HAIL", effective_date: "2026-08-02T00:00:00Z", expiration_date: "2026-12-31T00:00:00Z" }
              as: Underwriter
              captures: { policy_id: $.data.id }
            - call: "POST /carriers/${carrier_id}/policies/${policy_id}/coverage-units"
              payload: { county_code: "06001", crop_code: "CORN", declared_acres: 10 }
              as: Underwriter
              captures: { cu_id: $.data.id }
            - call: "POST /carriers/${carrier_id}/policies/${policy_id}/bind"
              payload: {}
              as: Underwriter
            - call: "POST /carriers/${carrier_id}/policies/${policy_id}/premium-payments"
              payload: { amount_cents: 13320 }
              as: Policyholder
              as_user_id: "${grower_id}"
            - call: "POST /carriers/${carrier_id}/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T00:00:00Z" }
              as: Underwriter
            - call: "POST /carriers/${carrier_id}/policies/${policy_id}/coverage-units/${cu_id}/acreage-reports"
              payload: { report_kind: "PLANTING", reported_acres: 10 }
              as: Policyholder
              as_user_id: "${grower_id}"
            - call: "POST /carriers/${carrier_id}/policies/${policy_id}/claims"
              payload: { coverage_unit_id: "${cu_id}", loss_date: "2026-08-04T00:00:00Z", percent_damage_estimate_pct: 10 }
              as: Policyholder
              as_user_id: "${grower_id}"
              captures: { claim_id: $.data.id }
            - call: "POST /carriers/${carrier_id}/policies/${policy_id}/claims/${claim_id}/assign-adjuster"
              payload: { adjuster_id: "${adjuster_id}" }
              as: ClaimsApprover
            - call: "POST /carriers/${carrier_id}/policies/${policy_id}/claims/${claim_id}/field-inspections"
              payload: { adjuster_id: "${adjuster_id}", scheduled_for: "2026-08-04T12:00:00Z", observed_percent_damage_pct: 10, notes: "10% hail" }
              as: Adjuster
              as_user_id: "${adjuster_id}"
            - call: "POST /carriers/${carrier_id}/policies/${policy_id}/claims/${claim_id}/submit-for-review"
              payload: {}
              as: Adjuster
              as_user_id: "${adjuster_id}"
            - call: "GET /carriers/${carrier_id}/policies/${policy_id}"
              payload: {}
              as: ClaimsApprover
              captures: { p_v_pre: $.data.version, p_reserve_pre: $.data.premium_reserve_cents }
