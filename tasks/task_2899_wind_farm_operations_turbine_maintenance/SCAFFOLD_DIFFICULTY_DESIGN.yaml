            - call: "POST /wind-ops/crane-mobilizations"
              payload: { wind_farm_id: "${farm_id}", crane_class: "CRAWLER_600T", mobilization_start_utc: "2026-08-10T00:00:00Z", demobilization_end_utc: "2026-08-12T00:00:00Z", day_rate_cents: 3800000, mobilization_fee_cents: 12000000, max_lift_wind_speed_ms: 9.0 }
