        distinguishing_aspect: |
          A depth-3 cascade from a DIFFERENT trigger (POST /_ops/run-expiry-sweep, not an abuse
          uphold): sweep -> Domain ACTIVE -> EXPIRED -> (because the domain expired and it is the
          subscription's primary_domain_id) HostingSubscription ACTIVE -> SUSPENDED -> (because
          the subscription suspended) its ACTIVE mailbox AddOn -> SUSPENDED.
