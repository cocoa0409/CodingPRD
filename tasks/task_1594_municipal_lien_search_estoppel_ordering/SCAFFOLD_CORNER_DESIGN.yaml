            - call: "POST /departments"
              payload: { jurisdiction_id: "${j_id}", dept_type: "UTILITY", name: "Water & Sewer", research_fee_cents: 5000, rush_surcharge_cents: 2500, supports_rush: true }
              as: ProviderAdmin
            - call: "POST /associations"
              payload: { jurisdiction_id: "${j_id}", name: "Sunset HOA", management_company: "Sunset Mgmt", estoppel_fee_cents: 10000, estoppel_validity_days: 30 }
              as: ProviderAdmin
              captures: { a_id: "$.data.id" }
            - call: "POST /search-orders"
              payload: { property_address: "3 AH St", parcel_number: "P-AH3", closing_date: "2026-09-20", order_class: "STANDARD", association_id: "${a_id}" }
              as: TitleAgent
              as_user_id: "agent_1"
              captures: { o_id: "$.data.id" }
            - { call: "POST /search-orders/${o_id}/identify-jurisdiction", payload: { jurisdiction_id: "${j_id}" }, as: ResearchAnalyst, as_user_id: "analyst_1" }
            - call: "GET /search-orders/${o_id}/estoppel-orders"
              as: ResearchAnalyst
              as_user_id: "analyst_1"
              captures: { e_id: "$.data[0].id" }
            - { call: "POST /estoppel-orders/${e_id}/place", payload: { fee_quoted_cents: 10000 }, as: ResearchAnalyst, as_user_id: "analyst_1" }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-11T10:00:00Z" }, as: ProviderAdmin }
            - call: "GET /estoppel-orders/${e_id}"
              as: ResearchAnalyst
              as_user_id: "analyst_1"
              captures: { e_st_due: "$.data.status", e_due: "$.data.statutory_due_at" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-12T10:00:00Z" }, as: ProviderAdmin }
            - call: "GET /estoppel-orders/${e_id}"
              as: ResearchAnalyst
              as_user_id: "analyst_1"
              captures: { e_st_late: "$.data.status" }
          assert:
            - "statutory_due_at == 2026-08-11T23:59:59.000Z (ordered 2026-08-01 + 10 days)"
            - "On 2026-08-11 the estoppel is still ORDERED (due day is inclusive)"
            - "On 2026-08-12 the sweep has moved it to OVERDUE"

      - name: dual_variant_calculation_covered_by_difficulty
        claim_type: dual_variant_calculation
        grounds: [calculations.estoppel_fee_charge, calculations.missed_item_liability]
        excluded_because:
          difficulty_instance: dual_variant_calc / estoppel_fee_on_time_vs_late_forfeiture
          rationale: "Both variant pairs are exercised by the §1.8 dual_variant_calc instances (estoppel fee and missed-item liability)."

      - name: cascading_side_effects_covered_by_difficulty
        claim_type: cascading_side_effects
        grounds: [state_machines.EstoppelOrder.RECEIVED_to_EXPIRED, state_machines.Delivery.READY_to_VOIDED]
        excluded_because:
          difficulty_instance: transitive_cascade / clock_sweep_estoppel_expiry_reverts_order_and_voids_delivery
          rationale: "The 4-link expiry cascade is asserted end-to-end by the named §1.8 instance."

      - name: rate_threshold_capacity_covered_by_difficulty
        claim_type: rate_threshold_triggers
        grounds: [calculations.rush_capacity_check]
        excluded_because:
          difficulty_instance: boundary_precision_check / rush_capacity_exactly_at_capacity_rejected
          rationale: "The >= capacity threshold boundary is asserted by the named §1.8 instance."

