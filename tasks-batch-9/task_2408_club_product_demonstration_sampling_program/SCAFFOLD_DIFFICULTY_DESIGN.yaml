  # ===========================================================================
  # RULE 4 — transitive_cascade
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: third_strike_cascades_to_on_leave_then_releases_a_future_event_staffing
        grounds:
          - state_machines.EventAssignment.transitions.ASSIGNED_to_NO_SHOW
          - state_machines.DemoEvent.transitions.FULLY_STAFFED_to_UNSTAFFED
          - calculations.demonstrator_reliability_score
          - entities.Demonstrator.fields.no_show_strike_count
          - entities.Demonstrator.fields.employment_status
          - endpoints[POST /_inject/assignment-history]
        distinguishing_aspect: |
          A single NO_SHOW on event E1 propagates five hops through three
          entity types: (1) Demonstrator.no_show_strike_count 2 -> 3 and both
          reliability variants recomputed to 64.00; (2) that strike count
          reaching NO_SHOW_STRIKE_LIMIT 3 flips employment_status ACTIVE ->
          ON_LEAVE; (3) ON_LEAVE releases the demonstrator's OTHER future
          assignment on event E2 (event_date 2026-09-21) to RELEASED; (4) E2's
          staffing_status falls FULLY_STAFFED -> UNSTAFFED and E2.version
          increments even though nobody called any endpoint on E2; (5) E1's own
          staffing_status falls to UNSTAFFED with no_show_recovery_open true and
          a 33810-cent DEMONSTRATOR_NO_SHOW credit is minted. Hops 3 and 4
          reach a DemoEvent that is not the trigger's target at all.
        test_recipe:
          setup:
            - "Manufacturer M (STANDARD, limit 5000000), club C (STANDARD, daily_event_capacity 4, food_station_count 3), FOOD product P (samples_per_case 60, weekly_sample_case_pool 40, unit_cost_cents 210)."
            - "Demonstrator D homed at C with a valid FOOD_HANDLER certification, max_weekly_events default 5, and exactly two historical NO_SHOWs injected on 2026-07-10 and 2026-07-17 so no_show_strike_count is 2 — one short of NO_SHOW_STRIKE_LIMIT 3 — and employment_status is still ACTIVE."
            - "A DRAFT DemoEvent E0 on 2026-10-12 hosts the injected history rows and is never submitted."
            - "DemoEvent E1 on 2026-09-14 MIDDAY and DemoEvent E2 on 2026-09-21 MIDDAY, each requested_sample_cases 4 so allocated_sample_cases is 4, required_support_count is 0 and a lone LEAD makes each FULLY_STAFFED. The two dates are in different ISO weeks, so neither the club-week sample pool nor the demonstrator's weekly cap interferes."
            - "D is the ASSIGNED LEAD on both E1 and E2, and both events are CONFIRMED."
            - "Logical clock moved to 2026-09-14T11:35:00Z: past E1's scheduled_start_utc 11:15Z plus NO_SHOW_GRACE_MINUTES 15, and still before E2's event_date so E2's assignment is in the future-release scope."
          setup_api_calls:
            - call: "POST /manufacturers"
              payload: { legal_name: "Kesterlin Foods Ltd", billing_email: "ap@kesterlin.example", program_tier: "STANDARD", credit_limit_cents: 5000000, credit_terms_days: 30 }
              as: ProgramAdmin
              as_user_id: "admin_hq"
              captures: { mfr_id: "$.data.id" }
            - call: "POST /clubs"
              payload: { club_number: "C-4707", name: "Kesterlin Club 4707", region_code: "MW", club_tier: "STANDARD", daily_event_capacity: 4, food_station_count: 3, health_permit_expires_on: "2027-09-30" }
              as: ProgramAdmin
              as_user_id: "admin_hq"
              captures: { club_id: "$.data.id" }
            - call: "POST /products"
              payload: { manufacturer_id: "${mfr_id}", sku: "KF-SAU-707", name: "Smoked Paprika Sausage Bites", category: "SNACK", requires_food_handling: true, requires_heat_equipment: false, allergen_flag: false, unit_cost_cents: 210, samples_per_case: 60, weekly_sample_case_pool: 40 }
              as: Manufacturer
              as_user_id: "${mfr_id}"
              captures: { product_id: "$.data.id" }
            - call: "POST /demonstrators"
              payload: { home_club_id: "${club_id}", full_name: "Odalys Brun", hourly_rate_cents: 2400 }
              as: StaffingCoordinator
              as_user_id: "staff_ops"
              captures: { dem_id: "$.data.id" }
            - call: "POST /demonstrators/${dem_id}/certifications"
              payload: { cert_type: "FOOD_HANDLER", certificate_number: "FH-2026-0901", issued_on: "2026-01-20", expires_on: "2027-01-20" }
              as: StaffingCoordinator
              as_user_id: "staff_ops"
            - call: "POST /demo-events"
              payload: { manufacturer_id: "${mfr_id}", club_id: "${club_id}", product_id: "${product_id}", event_date: "2026-10-12", day_part: "MORNING", requested_sample_cases: 3, addon_services: [] }
              as: Manufacturer
              as_user_id: "${mfr_id}"
              captures: { e0_id: "$.data.id" }
            - call: "POST /_inject/assignment-history"
              payload:
                demonstrator_id: "${dem_id}"
                demo_event_id: "${e0_id}"
                entries:
                  - { scheduled_start_utc: "2026-07-10T11:15:00Z", scheduled_end_utc: "2026-07-10T17:15:00Z", assignment_status: "NO_SHOW", role: "SUPPORT" }
                  - { scheduled_start_utc: "2026-07-17T11:15:00Z", scheduled_end_utc: "2026-07-17T17:15:00Z", assignment_status: "NO_SHOW", role: "SUPPORT" }
              as: ProgramAdmin
              as_user_id: "admin_hq"
            - call: "POST /demo-events"
              payload: { manufacturer_id: "${mfr_id}", club_id: "${club_id}", product_id: "${product_id}", event_date: "2026-09-14", day_part: "MIDDAY", requested_sample_cases: 4, addon_services: [] }
              as: Manufacturer
              as_user_id: "${mfr_id}"
              captures: { e1_id: "$.data.id" }
            - call: "POST /demo-events/${e1_id}/transitions"
              payload: { action: "SUBMIT" }
              as: Manufacturer
              as_user_id: "${mfr_id}"
            - call: "POST /demo-events/${e1_id}/transitions"
              payload: { action: "APPROVE" }
              as: ClubOperations
              as_user_id: "${club_id}"
            - call: "POST /demo-events"
              payload: { manufacturer_id: "${mfr_id}", club_id: "${club_id}", product_id: "${product_id}", event_date: "2026-09-21", day_part: "MIDDAY", requested_sample_cases: 4, addon_services: [] }
              as: Manufacturer
              as_user_id: "${mfr_id}"
              captures: { e2_id: "$.data.id" }
            - call: "POST /demo-events/${e2_id}/transitions"
              payload: { action: "SUBMIT" }
              as: Manufacturer
              as_user_id: "${mfr_id}"
            - call: "POST /demo-events/${e2_id}/transitions"
              payload: { action: "APPROVE" }
              as: ClubOperations
              as_user_id: "${club_id}"
            - call: "POST /demo-events/${e1_id}/assignments"
              payload: { demonstrator_id: "${dem_id}", role: "LEAD" }
              as: StaffingCoordinator
              as_user_id: "staff_ops"
              captures: { e1_asg_id: "$.data.id" }
            - call: "POST /demo-events/${e2_id}/assignments"
              payload: { demonstrator_id: "${dem_id}", role: "LEAD" }
              as: StaffingCoordinator
              as_user_id: "staff_ops"
              captures: { e2_asg_id: "$.data.id" }
            - call: "GET /demo-events/${e2_id}"
              payload: {}
              as: StaffingCoordinator
              as_user_id: "staff_ops"
              captures: { e2_version_before: "$.data.version", e2_staffing_before: "$.data.staffing_status" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-14T11:35:00Z" }
              as: ProgramAdmin
              as_user_id: "admin_hq"
          trigger:
            - call: "POST /event-assignments/${e1_asg_id}/transitions"
              payload: { action: "NO_SHOW", note: "third strike" }
              as: StaffingCoordinator
              as_user_id: "staff_ops"
            - call: "GET /demo-events/${e2_id}"
              payload: {}
              as: StaffingCoordinator
              as_user_id: "staff_ops"
              captures: { e2_version_after: "$.data.version", e2_staffing_after: "$.data.staffing_status" }
            - call: "GET /cancellation-credits?demo_event_id=${e1_id}"
              payload: { demo_event_id: "${e1_id}" }
              as: ProgramAdmin
              as_user_id: "admin_hq"
              captures: { credit_id: "$.data[0].id" }
          assert:
            - "${e2_staffing_before} == FULLY_STAFFED"
            - "Demonstrator.${dem_id}.no_show_strike_count == 3"
            - "Demonstrator.${dem_id}.employment_status == ON_LEAVE"
            - "Demonstrator.${dem_id}.reliability_score_rolling_90 == 64.00"
            - "Demonstrator.${dem_id}.reliability_score_program_to_date == 64.00"
            - "Demonstrator.${dem_id}.completed_event_count == 0"
            - "EventAssignment.${e1_asg_id}.assignment_status == NO_SHOW"
            - "EventAssignment.${e2_asg_id}.assignment_status == RELEASED"
            - "${e2_staffing_after} == UNSTAFFED"
            - "${e2_version_after} == ${e2_version_before} + 1"
            - "DemoEvent.${e2_id}.booking_status == CONFIRMED"
            - "DemoEvent.${e1_id}.staffing_status == UNSTAFFED"
            - "DemoEvent.${e1_id}.no_show_recovery_open == true"
            - "DemoEvent.${e1_id}.booking_status == CONFIRMED"
            - "CancellationCredit.${credit_id}.credit_reason == DEMONSTRATOR_NO_SHOW"
            - "CancellationCredit.${credit_id}.billable_base_cents == 48300"
            - "CancellationCredit.${credit_id}.notice_hours == 0"
            - "CancellationCredit.${credit_id}.notice_tier_pct == 0.70"
            - "CancellationCredit.${credit_id}.credit_amount_cents == 33810"
            - "DemoEvent.${e0_id}.staffing_status == UNSTAFFED"

      - name: credit_approval_cascades_through_invoice_to_receivable_and_releases_credit_hold
        grounds:
          - state_machines.CancellationCredit.transitions.APPROVED_to_APPLIED
          - state_machines.EventInvoice.transitions.DRAFT_to_ISSUED
          - calculations.manufacturer_receivable_rollup
          - calculations.event_invoice_total
          - entities.Manufacturer.fields.outstanding_balance_cents
          - entities.Manufacturer.fields.account_status
          - validations[priority=48]
        distinguishing_aspect: |
          Approving one credit propagates four hops across three entity types
          in a single request: credit_applied_cents on the invoice rises to
          33810, the invoice's total_due_cents recomputes 66260 -> 32450,
          Manufacturer.outstanding_balance_cents re-rolls 66260 -> 32450, and
          because 32450 is now under credit_limit_cents 60000 the
          account_status flips HOLD -> ACTIVE. The chain differs from the
          third-strike cascade in both its entity domain (money, not staffing)
          and its direction: the credit is the leaf and the manufacturer
          account is the root, and the segregation-of-duties gate at priority
          48 forces the approving user (admin_controller) to differ from the
          issuing user (admin_billing).
        test_recipe:
          setup:
            - "Manufacturer M program_tier STANDARD with credit_limit_cents 60000, deliberately BELOW the invoice total so ISSUE trips the auto-HOLD."
            - "Club C club_tier STANDARD, event on 2026-09-14 MIDDAY, event_type FOOD_SAMPLING, no add-ons, requested_sample_cases 4 so allocated_sample_cases is 4 and required_support_count is 0."
            - "LEAD demonstrator (hourly_rate_cents 2400) works 11:15Z-15:45Z for billable_hours 4.50; an extra SUPPORT demonstrator is ASSIGNED then declared NO_SHOW at clock 2026-09-14T11:35:00Z, which mints the 33810-cent DEMONSTRATOR_NO_SHOW credit while staffing_coverage still reports FULLY_STAFFED because required_support_count is 0."
            - "4 cases shipped and received in full; reconciliation 200 + 30 + 10 = 240 against units_delivered 240 so recon_status is BALANCED."
