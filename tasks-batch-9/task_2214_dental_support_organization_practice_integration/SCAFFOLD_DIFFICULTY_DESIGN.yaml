      - name: cutover_window_closed_interval_forty_eight_hour_buffer
        grounds:
          - validations[priority=31]
          - errors.ERR_CUTOVER_WINDOW_CONFLICT
          - entities.MigrationBatch.fields.cutover_start_at
          - entities.MigrationBatch.fields.cutover_end_at
          - state_machines.MigrationBatch.STAGED_to_SCHEDULED
          - state_machines.MigrationBatch.STAGED_to_SUPERSEDED
