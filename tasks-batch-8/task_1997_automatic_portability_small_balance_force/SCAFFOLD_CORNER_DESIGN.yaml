            - { call: "POST /participants", payload: { ssn_hash: "hash-a", full_name: "Ann A", date_of_birth: "1980-01-01", mailing_address_line1: "1 Main St", mailing_city: "Springfield", mailing_state: "IL", mailing_zip: "62701" }, as: PlanSponsor, captures: { p_a: $.data.id } }
            - { call: "POST /participants", payload: { ssn_hash: "hash-b", full_name: "Bob B", date_of_birth: "1981-02-02", mailing_address_line1: "2 Main St", mailing_city: "Springfield", mailing_state: "IL", mailing_zip: "62701" }, as: PlanSponsor, captures: { p_b: $.data.id } }
            - { call: "POST /distribution-batches", payload: { plan_id: "${plan_x}" }, as: PlanSponsor, captures: { b_x: $.data.id } }
            - { call: "POST /distribution-cases", payload: { distribution_batch_id: "${b_x}", plan_id: "${plan_x}", participant_id: "${p_a}", separation_date: "2026-07-15T00:00:00Z", separation_date_balance_cents: 50000, processing_date_balance_cents: 50000 }, as: PlanSponsor, captures: { c_a: $.data.id } }
            - { call: "POST /distribution-cases", payload: { distribution_batch_id: "${b_x}", plan_id: "${plan_x}", participant_id: "${p_b}", separation_date: "2026-07-15T00:00:00Z", separation_date_balance_cents: 60000, processing_date_balance_cents: 60000 }, as: PlanSponsor, captures: { c_b: $.data.id } }
            - { call: "POST /distribution-batches/${b_x}/lock", payload: {}, as: PlanSponsor }
            - { call: "POST /distribution-cases/${c_a}/notices", payload: { notice_type: "FORCE_OUT_ELECTION" }, as: ProviderOps, captures: { n_a: $.data.id } }
            - { call: "POST /notices/${n_a}/record-delivery", payload: { outcome: "DELIVERED" }, as: ProviderOps }
            - { call: "POST /distribution-cases/${c_b}/notices", payload: { notice_type: "FORCE_OUT_ELECTION" }, as: ProviderOps }
          trigger:
            - { call: "GET /distribution-cases?case_status=NOTIFIED", payload: {}, as: ProviderOps, captures: { hit: "$.data[0].id" } }
            - { call: "GET /distribution-cases?case_status=EXECUTED", payload: {}, as: ProviderOps }
          assert:
            - "NOTIFIED filter: exactly one row, hit == ${c_a}"
            - "EXECUTED filter: data == [], total_count == 0, has_more == false, http 200"

