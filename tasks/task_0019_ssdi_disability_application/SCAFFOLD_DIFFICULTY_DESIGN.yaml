              as: SSAAdmin
              captures: { ada_id: "$.data.id", ada_v: "$.data.version "}
            - call: "POST /ssdi/applications/${ada_id}/evidence"
              payload: { source_type: "TREATING_PHYSICIAN", report_date: "2024-02-01T00:00:00Z", diagnosis_code: "M54.5", severity_score: 80 }
              as: Claimant
              as_user_id: "${da_id}"
          trigger:
            - call: "POST /ssdi/applications/${ada_id}/medical-decision"
              payload: { decision_type: "RFC_DISABLED", established_onset_date: "2024-01-15T00:00:00Z", rfc_score: 30, expected_application_version: "${ada_v}" }
              as: DDSExaminer
              captures: { err: "$.data.error_id "}
          assert:
            - "response.status_code == 409"
            - "response.data.error_id == ERR_INVALID_APPLICATION_STATE"

