  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: venue_double_booking_overlap
        grounds:
          - state_machines.PermitApplication.DRAFT_to_SUBMITTED
          - errors[ERR_VENUE_DOUBLE_BOOKED]
          - entities.PermitApplication.fields.venue_id
        distinguishing_aspect: "Two applications on the SAME venue whose event intervals overlap ([18:00,23:00) vs [22:00,23:30)) collide on submit -> ERR_VENUE_DOUBLE_BOOKED; the interval semantics are half-open on the Venue resource (adjacent end==start would be allowed)."
        test_recipe:
          setup:
            - "Application A1 already SUBMITTED for venue with event [18:00,23:00); a second draft A2 on the same venue overlaps at [22:00,23:30)."
          setup_api_calls:
            - { call: "POST /permits/venues", payload: { name: "Shared Hall", address: "7 Shared Ave", occupancy_limit: 200 }, as: PermitClerk, captures: { v: $.data.id } }
            - { call: "POST /permits/applications", payload: { venue_id: "${v}", organizer_name: "Club A", event_name: "Gala A", event_start: "2026-06-15T18:00:00Z", event_end: "2026-06-15T23:00:00Z", alcohol_service_hours: 5, expected_attendance: 151, requested_sales_limit_cents: 250050 }, as: Applicant, captures: { a1: $.data.id } }
            - { call: "POST /permits/servers", payload: { application_id: "${a1}", full_name: "Sam Pour", cert_number: "C-1", training_provider: "TIPS", cert_issued_date: "2025-01-01T00:00:00Z", cert_expiry_date: "2027-01-01T00:00:00Z" }, as: Applicant }
            - { call: "POST /permits/insurance-policies", payload: { application_id: "${a1}", insurer_name: "Acme Ins", coverage_cents: 200000000, effective_date: "2026-06-01T00:00:00Z", expiry_date: "2026-07-01T00:00:00Z" }, as: Applicant }
            - { call: "POST /permits/security-plans", payload: { application_id: "${a1}", planned_guard_count: 3, plan_summary: "Perimeter" }, as: Applicant }
            - { call: "POST /permits/applications/${a1}/submit", payload: {}, as: Applicant }
            - { call: "POST /permits/applications", payload: { venue_id: "${v}", organizer_name: "Club B", event_name: "Gala B", event_start: "2026-06-15T22:00:00Z", event_end: "2026-06-15T23:30:00Z", alcohol_service_hours: 1, expected_attendance: 100, requested_sales_limit_cents: 100000 }, as: Applicant, captures: { a2: $.data.id } }
            - { call: "POST /permits/servers", payload: { application_id: "${a2}", full_name: "Bea Tap", cert_number: "C-2", training_provider: "TIPS", cert_issued_date: "2025-01-01T00:00:00Z", cert_expiry_date: "2027-01-01T00:00:00Z" }, as: Applicant }
            - { call: "POST /permits/insurance-policies", payload: { application_id: "${a2}", insurer_name: "Acme Ins", coverage_cents: 200000000, effective_date: "2026-06-01T00:00:00Z", expiry_date: "2026-07-01T00:00:00Z" }, as: Applicant }
            - { call: "POST /permits/security-plans", payload: { application_id: "${a2}", planned_guard_count: 3, plan_summary: "Perimeter" }, as: Applicant }
          trigger:
            - { call: "POST /permits/applications/${a2}/submit", payload: {}, as: Applicant }
          assert:
            - "response.status == 409"
            - "response.error_id == ERR_VENUE_DOUBLE_BOOKED"
            - "PermitApplication.${a2}.status == DRAFT"

      - name: inspector_buffer_overlap
        grounds:
          - state_machines.Inspection
          - errors[ERR_INSPECTOR_UNAVAILABLE]
          - entities.Inspection.fields.inspector_id
        distinguishing_aspect: "Two inspections for the SAME inspector whose windows are only 30 minutes apart (10:00-11:00 then 11:30-12:00) violate the 60-minute INSPECTION_BUFFER_MINUTES gap -> ERR_INSPECTOR_UNAVAILABLE; the interval semantics add a buffer around each window (distinct from the venue's plain half-open overlap)."
