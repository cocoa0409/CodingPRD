scaffold_difficulty_design:
  # ===========================================================================
  # Rule 1 — dual_variant_calc (different entity domains)
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: domestic_content_cost_vs_count_variants
        grounds:
          - calculations.domestic_content
          - entities.ComplianceCertificate.fields.variant
          - entities.ComplianceCertificate.fields.domestic_content_pct
        distinguishing_aspect: |
          Same bus component kit, same instant: variant COST_BASED weights by
          unit_cost_cents and yields 53.3, while variant COMPONENT_COUNT weights
          by count and yields 50.0 — two valid algorithms over the same inputs
          producing different certified percentages.
        test_recipe:
          setup:
            - "Agency A exists (federally_funded=true)"
            - "Contract C for A in ACTIVE with a FROZEN BusConfiguration (DIESEL) listing 4 components with costs 100000, 200000, 300000, 150000 cents; domestic flags true,false,true,false"
            - "BusUnit B created and ENGINEERED (PartsKit carries the 4 component ids)"
          setup_api_calls:
            - call: "POST /api/agencies"
              payload: { name: "Metro Transit", agency_code: "MTA1", federally_funded: true, transition_target_year: 2035 }
              as: PlatformAdmin
              captures: { ag_id: $.data.id }
            - call: "POST /api/contracts"
              payload: { agency_id: "${ag_id}", base_quantity: 2, base_unit_price_cents: 50000000, base_contract_year: 2027, escalation_index: PPI_1413 }
              as: ProcurementOfficer
              captures: { ct_id: $.data.id, ct_v0: $.data.version }
            - call: "POST /api/components"
              payload: { name: "Axle", category: AXLE, unit_cost_cents: 100000, is_domestic: true }
              as: ComplianceOfficer
              captures: { c1: $.data.id }
            - call: "POST /api/components"
              payload: { name: "Motor", category: PROPULSION, unit_cost_cents: 200000, is_domestic: false }
              as: ComplianceOfficer
              captures: { c2: $.data.id }
            - call: "POST /api/components"
              payload: { name: "Body Panel", category: BODY, unit_cost_cents: 300000, is_domestic: true }
              as: ComplianceOfficer
              captures: { c3: $.data.id }
            - call: "POST /api/components"
              payload: { name: "Farebox", category: FARE, unit_cost_cents: 150000, is_domestic: false }
              as: ComplianceOfficer
              captures: { c4: $.data.id }
            - call: "POST /api/bus-configurations"
              payload: { contract_id: "${ct_id}", propulsion_type: DIESEL, seating_layout: { rows: 10 }, fare_equipment: { farebox: "GFI" }, accessibility_features: ["WHEELCHAIR_LIFT"], component_ids: ["${c1}", "${c2}", "${c3}", "${c4}"] }
              as: ConfigEngineer
              captures: { cfg_id: $.data.id }
            - call: "POST /api/bus-configurations/${cfg_id}/submit-review"
              payload: {}
              as: ConfigEngineer
            - call: "POST /api/bus-configurations/${cfg_id}/freeze"
              payload: { expected_contract_version: "${ct_v0}" }
              as: ConfigEngineer
            - call: "POST /api/contracts/${ct_id}/award"
              payload: {}
              as: ProcurementOfficer
            - call: "POST /api/audit-records"
              payload: { contract_id: "${ct_id}", audit_type: PRE_AWARD, auditor_id: "aud-1" }
              as: Auditor
              captures: { au_id: $.data.id }
            - call: "POST /api/components/${c1}/supplier-docs"
              payload: {}
              as: SupplierRep
              as_user_id: "sup-1"
            - call: "POST /api/components/${c1}/verify-docs"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /api/components/${c2}/supplier-docs"
              payload: {}
              as: SupplierRep
              as_user_id: "sup-1"
            - call: "POST /api/components/${c2}/verify-docs"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /api/audit-records/${au_id}/complete"
              payload: {}
              as: Auditor
            - call: "POST /api/contracts/${ct_id}/activate"
              payload: {}
              as: ProcurementOfficer
            - call: "POST /api/bus-units"
              payload: { contract_id: "${ct_id}", bus_configuration_id: "${cfg_id}", assembly_location: US_MAIN }
              as: ProductionPlanner
              captures: { bu_id: $.data.id }
            - call: "POST /api/bus-units/${bu_id}/engineer"
              payload: {}
              as: ConfigEngineer
          trigger:
            - call: "POST /api/bus-units/${bu_id}/compliance-certificates"
              payload: { variant: COST_BASED, issued_by: "co-1" }
              as: ComplianceOfficer
              captures: { cert_cost_pct: $.data.domestic_content_pct }
            - call: "POST /api/bus-units/${bu_id}/compliance-certificates"
              payload: { variant: COMPONENT_COUNT, issued_by: "co-1" }
              as: ComplianceOfficer
              captures: { cert_count_pct: $.data.domestic_content_pct }
          assert:
            - "cert_cost_pct == 53.3"
            - "cert_count_pct == 50.0"
            - "cert_cost_pct != cert_count_pct"

      - name: zev_ratio_realized_vs_projected_variants
        grounds:
          - calculations.fleet_zev_ratio
          - entities.Agency.fields.zev_ratio
          - entities.Agency.fields.projected_zev_ratio
        distinguishing_aspect: |
          Different entity domain from domestic_content (Agency fleet planning vs
          ComplianceCertificate sourcing): at the same instant the realized
          zev_ratio counts ACCEPTED buses only (0.5000) while the projected
          variant folds in the EXERCISED BEV option pipeline (0.8000).
        test_recipe:
          setup:
            - "Agency A with one ACCEPTED BEV bus and one ACCEPTED DIESEL bus (zev_ratio 0.5000)"
            - "An AVAILABLE OptionOrder of quantity 3 with propulsion_type BEV on the same contract"
          setup_api_calls:
            - call: "POST /api/agencies"
              payload: { name: "Valley Transit", agency_code: "VTA1", federally_funded: true, transition_target_year: 2040 }
              as: PlatformAdmin
              captures: { ag_id: $.data.id }
            - call: "POST /api/contracts"
              payload: { agency_id: "${ag_id}", base_quantity: 2, base_unit_price_cents: 50000000, base_contract_year: 2027, escalation_index: PPI_1413, option_years: 1, option_specs: [ { quantity: 3, propulsion_type: BEV } ] }
              as: ProcurementOfficer
              captures: { ct_id: $.data.id, ct_v0: $.data.version }
            - call: "POST /api/components"
              payload: { name: "Battery Pack", category: PROPULSION, unit_cost_cents: 900000, is_domestic: true }
              as: ComplianceOfficer
              captures: { cb: $.data.id }
            - call: "POST /api/bus-configurations"
              payload: { contract_id: "${ct_id}", propulsion_type: BEV, seating_layout: { rows: 10 }, fare_equipment: {}, accessibility_features: ["WHEELCHAIR_LIFT"], component_ids: ["${cb}"] }
              as: ConfigEngineer
              captures: { cfg_bev: $.data.id }
            - call: "POST /api/bus-configurations/${cfg_bev}/submit-review"
              payload: {}
              as: ConfigEngineer
            - call: "POST /api/bus-configurations/${cfg_bev}/freeze"
              payload: { expected_contract_version: "${ct_v0}" }
              as: ConfigEngineer
            - call: "POST /api/bus-configurations"
              payload: { contract_id: "${ct_id}", propulsion_type: DIESEL, seating_layout: { rows: 12 }, fare_equipment: {}, accessibility_features: ["WHEELCHAIR_LIFT"], component_ids: ["${cb}"] }
              as: ConfigEngineer
              captures: { cfg_dsl: $.data.id }
            - call: "POST /api/bus-configurations/${cfg_dsl}/submit-review"
              payload: {}
              as: ConfigEngineer
            - call: "GET /api/contracts/${ct_id}"
              payload: {}
              as: ProcurementOfficer
              captures: { ct_v1: $.data.version }
            - call: "POST /api/bus-configurations/${cfg_dsl}/freeze"
              payload: { expected_contract_version: "${ct_v1}" }
              as: ConfigEngineer
            - call: "POST /api/contracts/${ct_id}/award"
              payload: {}
              as: ProcurementOfficer
            - call: "POST /api/audit-records"
              payload: { contract_id: "${ct_id}", audit_type: PRE_AWARD, auditor_id: "aud-1" }
              as: Auditor
              captures: { au_id: $.data.id }
            - call: "POST /api/components/${cb}/supplier-docs"
              payload: {}
              as: SupplierRep
              as_user_id: "sup-1"
            - call: "POST /api/components/${cb}/verify-docs"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /api/audit-records/${au_id}/complete"
              payload: {}
              as: Auditor
            - call: "POST /api/contracts/${ct_id}/activate"
              payload: {}
              as: ProcurementOfficer
            - call: "POST /api/bus-units"
              payload: { contract_id: "${ct_id}", bus_configuration_id: "${cfg_bev}", assembly_location: US_MAIN }
              as: ProductionPlanner
              captures: { bu_bev: $.data.id }
            - call: "POST /api/bus-units/${bu_bev}/engineer"
              payload: {}
              as: ConfigEngineer
            - call: "POST /api/production-slots"
              payload: { line_id: LINE_A, start_ts: "2026-09-01T00:00:00Z", end_ts: "2026-09-05T00:00:00Z" }
              as: ProductionPlanner
              captures: { sl1: $.data.id }
            - call: "POST /api/production-slots/${sl1}/assign"
              payload: { bus_unit_id: "${bu_bev}" }
              as: ProductionPlanner
            - call: "POST /api/production-slots/${sl1}/start-production"
              payload: {}
              as: ProductionPlanner
            - call: "POST /api/production-slots/${sl1}/complete-production"
              payload: {}
              as: ProductionPlanner
            - call: "POST /api/bus-units/${bu_bev}/compliance-certificates"
              payload: { variant: COST_BASED, issued_by: "co-1" }
              as: ComplianceOfficer
            - call: "POST /api/bus-units/${bu_bev}/submit-plant-inspection"
              payload: {}
              as: ProductionPlanner
            - call: "POST /api/inspection-records"
              payload: { bus_unit_id: "${bu_bev}", inspection_type: PLANT, inspector_id: "insp-1", result: PASS }
              as: AgencyInspector
            - call: "POST /api/bus-units/${bu_bev}/deliver"
              payload: {}
              as: ProductionPlanner
            - call: "POST /api/bus-units/${bu_bev}/accept"
              payload: {}
              as: AgencyInspector
            - call: "POST /api/bus-units"
              payload: { contract_id: "${ct_id}", bus_configuration_id: "${cfg_dsl}", assembly_location: US_MAIN }
              as: ProductionPlanner
              captures: { bu_dsl: $.data.id }
            - call: "POST /api/bus-units/${bu_dsl}/engineer"
              payload: {}
              as: ConfigEngineer
            - call: "POST /api/production-slots"
              payload: { line_id: LINE_A, start_ts: "2026-09-05T00:00:00Z", end_ts: "2026-09-09T00:00:00Z" }
              as: ProductionPlanner
              captures: { sl2: $.data.id }
            - call: "POST /api/production-slots/${sl2}/assign"
              payload: { bus_unit_id: "${bu_dsl}" }
              as: ProductionPlanner
            - call: "POST /api/production-slots/${sl2}/start-production"
              payload: {}
              as: ProductionPlanner
            - call: "POST /api/production-slots/${sl2}/complete-production"
              payload: {}
              as: ProductionPlanner
            - call: "POST /api/bus-units/${bu_dsl}/compliance-certificates"
              payload: { variant: COST_BASED, issued_by: "co-1" }
              as: ComplianceOfficer
            - call: "POST /api/bus-units/${bu_dsl}/submit-plant-inspection"
              payload: {}
              as: ProductionPlanner
            - call: "POST /api/inspection-records"
              payload: { bus_unit_id: "${bu_dsl}", inspection_type: PLANT, inspector_id: "insp-1", result: PASS }
              as: AgencyInspector
            - call: "POST /api/bus-units/${bu_dsl}/deliver"
              payload: {}
              as: ProductionPlanner
            - call: "POST /api/bus-units/${bu_dsl}/accept"
              payload: {}
              as: AgencyInspector
            - call: "GET /api/contracts/${ct_id}/option-orders"
              payload: {}
              as: ProcurementOfficer
              captures: { oo_id: $.data.0.id }
            - call: "GET /api/contracts/${ct_id}"
              payload: {}
              as: ProcurementOfficer
              captures: { ct_v2: $.data.version }
          trigger:
            - call: "POST /api/option-orders/${oo_id}/exercise"
              payload: { expected_contract_version: "${ct_v2}" }
              as: ProcurementOfficer
            - call: "GET /api/agencies/${ag_id}"
              payload: {}
              as: PlatformAdmin
              captures: { ag_zev: $.data.zev_ratio, ag_proj: $.data.projected_zev_ratio }
          assert:
            - "ag_zev == 0.5000"
            - "ag_proj == 0.8000"
            - "ag_zev != ag_proj"

  # ===========================================================================
  # Rule 2 — combinatorial_formula (different modes)
  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: option_escalation_multi_input_tier_formula
        grounds:
          - calculations.option_escalation
          - entities.OptionOrder.fields.exercised_unit_price_cents
        distinguishing_aspect: |
          Mode (a): >=3 inputs (base price 50000000, escalation factor 1.031^2,
          quantity tier 0.02 at quantity 10) with non-linear interaction and a
          pinned evaluation order (escalate, then tier, then round once) yields
          exactly 52085089 cents; any other order or tier selection differs.
        test_recipe:
          setup:
            - "ACTIVE contract (PPI_1413, base 50000000 cents) with option year 2 spec quantity 10 propulsion DIESEL and a FROZEN DIESEL configuration"
          setup_api_calls:
            - call: "POST /api/agencies"
              payload: { name: "Hill Country Transit", agency_code: "HCT1", federally_funded: true, transition_target_year: 2038 }
              as: PlatformAdmin
              captures: { ag_id: $.data.id }
            - call: "POST /api/contracts"
              payload: { agency_id: "${ag_id}", base_quantity: 2, base_unit_price_cents: 50000000, base_contract_year: 2027, escalation_index: PPI_1413, option_years: 2, option_specs: [ { quantity: 4, propulsion_type: DIESEL }, { quantity: 10, propulsion_type: DIESEL } ] }
              as: ProcurementOfficer
              captures: { ct_id: $.data.id, ct_v0: $.data.version }
            - call: "POST /api/components"
              payload: { name: "Engine", category: PROPULSION, unit_cost_cents: 800000, is_domestic: true }
              as: ComplianceOfficer
              captures: { ce: $.data.id }
            - call: "POST /api/bus-configurations"
              payload: { contract_id: "${ct_id}", propulsion_type: DIESEL, seating_layout: { rows: 10 }, fare_equipment: {}, accessibility_features: ["WHEELCHAIR_LIFT"], component_ids: ["${ce}"] }
              as: ConfigEngineer
              captures: { cfg_id: $.data.id }
            - call: "POST /api/bus-configurations/${cfg_id}/submit-review"
              payload: {}
              as: ConfigEngineer
            - call: "POST /api/bus-configurations/${cfg_id}/freeze"
              payload: { expected_contract_version: "${ct_v0}" }
              as: ConfigEngineer
            - call: "POST /api/contracts/${ct_id}/award"
              payload: {}
              as: ProcurementOfficer
            - call: "POST /api/audit-records"
              payload: { contract_id: "${ct_id}", audit_type: PRE_AWARD, auditor_id: "aud-1" }
              as: Auditor
              captures: { au_id: $.data.id }
            - call: "POST /api/components/${ce}/supplier-docs"
              payload: {}
              as: SupplierRep
              as_user_id: "sup-1"
            - call: "POST /api/components/${ce}/verify-docs"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /api/audit-records/${au_id}/complete"
              payload: {}
              as: Auditor
            - call: "POST /api/contracts/${ct_id}/activate"
              payload: {}
              as: ProcurementOfficer
            - call: "GET /api/contracts/${ct_id}/option-orders"
              payload: {}
              as: ProcurementOfficer
              captures: { oo_y1: $.data.0.id, oo_y2: $.data.1.id }
            - call: "GET /api/contracts/${ct_id}"
              payload: {}
              as: ProcurementOfficer
              captures: { ct_v: $.data.version }
          trigger:
            - call: "POST /api/option-orders/${oo_y2}/exercise"
              payload: { expected_contract_version: "${ct_v}" }
              as: ProcurementOfficer
              captures: { oo_price: $.data.exercised_unit_price_cents }
          assert:
            - "oo_price == 52085089"
            - "OptionOrder.${oo_y2}.status == EXERCISED"

      - name: domestic_content_boundary_rounding_order
        grounds:
          - calculations.domestic_content
          - calculations.kit_completeness
        distinguishing_aspect: |
          Mode (b) nested rounding where order matters: COST_BASED percentage
          69.95 must round once at the end to 70.0 (passing a 70.0 threshold),
          whereas rounding the ratio at an intermediate step (69.9 or 69) flips
          the ERR_DOMESTIC_CONTENT_BELOW_THRESHOLD gate the opposite way.
        test_recipe:
          setup:
            - "ACTIVE contract; FROZEN DIESEL config with components: domestic 6995 cents, foreign 3005 cents (cost pct = 69.95 exactly); bus ENGINEERED and BUILT"
          setup_api_calls:
            - call: "POST /api/agencies"
              payload: { name: "Prairie Transit", agency_code: "PTA1", federally_funded: true, transition_target_year: 2036 }
              as: PlatformAdmin
              captures: { ag_id: $.data.id }
            - call: "POST /api/contracts"
              payload: { agency_id: "${ag_id}", base_quantity: 1, base_unit_price_cents: 50000000, base_contract_year: 2027, escalation_index: PPI_1413 }
              as: ProcurementOfficer
              captures: { ct_id: $.data.id, ct_v0: $.data.version }
            - call: "POST /api/components"
              payload: { name: "Fasteners", category: BODY, unit_cost_cents: 6995, is_domestic: true }
              as: ComplianceOfficer
              captures: { cd: $.data.id }
            - call: "POST /api/components"
              payload: { name: "Engine", category: PROPULSION, unit_cost_cents: 3005, is_domestic: false }
              as: ComplianceOfficer
              captures: { cf: $.data.id }
            - call: "POST /api/bus-configurations"
              payload: { contract_id: "${ct_id}", propulsion_type: DIESEL, seating_layout: { rows: 10 }, fare_equipment: {}, accessibility_features: ["WHEELCHAIR_LIFT"], component_ids: ["${cd}", "${cf}"] }
              as: ConfigEngineer
              captures: { cfg_id: $.data.id }
            - call: "POST /api/bus-configurations/${cfg_id}/submit-review"
              payload: {}
              as: ConfigEngineer
            - call: "POST /api/bus-configurations/${cfg_id}/freeze"
              payload: { expected_contract_version: "${ct_v0}" }
              as: ConfigEngineer
            - call: "POST /api/contracts/${ct_id}/award"
              payload: {}
              as: ProcurementOfficer
            - call: "POST /api/audit-records"
              payload: { contract_id: "${ct_id}", audit_type: PRE_AWARD, auditor_id: "aud-1" }
              as: Auditor
              captures: { au_id: $.data.id }
            - call: "POST /api/components/${cf}/supplier-docs"
              payload: {}
              as: SupplierRep
              as_user_id: "sup-1"
            - call: "POST /api/components/${cf}/verify-docs"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /api/audit-records/${au_id}/complete"
              payload: {}
              as: Auditor
            - call: "POST /api/contracts/${ct_id}/activate"
              payload: {}
              as: ProcurementOfficer
            - call: "POST /api/bus-units"
              payload: { contract_id: "${ct_id}", bus_configuration_id: "${cfg_id}", assembly_location: US_MAIN }
              as: ProductionPlanner
              captures: { bu_id: $.data.id }
            - call: "POST /api/bus-units/${bu_id}/engineer"
              payload: {}
              as: ConfigEngineer
            - call: "POST /api/production-slots"
              payload: { line_id: LINE_B, start_ts: "2026-09-01T00:00:00Z", end_ts: "2026-09-03T00:00:00Z" }
              as: ProductionPlanner
              captures: { sl: $.data.id }
            - call: "POST /api/production-slots/${sl}/assign"
              payload: { bus_unit_id: "${bu_id}" }
              as: ProductionPlanner
            - call: "POST /api/production-slots/${sl}/start-production"
              payload: {}
              as: ProductionPlanner
            - call: "POST /api/production-slots/${sl}/complete-production"
              payload: {}
              as: ProductionPlanner
          trigger:
            - call: "POST /api/bus-units/${bu_id}/compliance-certificates"
              payload: { variant: COST_BASED, issued_by: "co-1" }
              as: ComplianceOfficer
              captures: { cert_pct: $.data.domestic_content_pct, cert_thr: $.data.threshold_pct }
            - call: "POST /api/bus-units/${bu_id}/submit-plant-inspection"
              payload: {}
              as: ProductionPlanner
          assert:
            - "cert_pct == 70.0"
            - "cert_thr == 70"
            - "submit-plant-inspection succeeds (BusUnit.${bu_id}.status == PLANT_INSPECTION); an intermediate-rounded 69.9 would have failed with ERR_DOMESTIC_CONTENT_BELOW_THRESHOLD"

  # ===========================================================================
  # Rule 3 — non_linear_state_machine (different entities)
  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: bus_configuration_revision_cycle
        grounds:
          - state_machines.BusConfiguration.FROZEN_to_DRAFT
          - state_machines.BusConfiguration.ENGINEERING_REVIEW_to_FROZEN
          - entities.BusConfiguration.fields.freeze_version
        distinguishing_aspect: |
          Cycle on BusConfiguration: DRAFT -> ENGINEERING_REVIEW -> FROZEN ->
          DRAFT -> ENGINEERING_REVIEW -> FROZEN; freeze_version accumulates (2)
          across the loop and seat_count locks on each freeze.
        test_recipe:
          setup:
            - "Agency + DRAFT contract; configuration created with 10-row seating"
          setup_api_calls:
            - call: "POST /api/agencies"
              payload: { name: "Coastal Transit", agency_code: "CTA1", federally_funded: true, transition_target_year: 2037 }
              as: PlatformAdmin
              captures: { ag_id: $.data.id }
            - call: "POST /api/contracts"
              payload: { agency_id: "${ag_id}", base_quantity: 3, base_unit_price_cents: 45000000, base_contract_year: 2027, escalation_index: CPI_U }
              as: ProcurementOfficer
              captures: { ct_id: $.data.id, ct_v0: $.data.version }
            - call: "POST /api/components"
              payload: { name: "Engine", category: PROPULSION, unit_cost_cents: 800000, is_domestic: true }
              as: ComplianceOfficer
              captures: { ce: $.data.id }
            - call: "POST /api/bus-configurations"
              payload: { contract_id: "${ct_id}", propulsion_type: DIESEL, seating_layout: { rows: 10 }, fare_equipment: {}, accessibility_features: ["WHEELCHAIR_LIFT"], component_ids: ["${ce}"] }
              as: ConfigEngineer
              captures: { cfg_id: $.data.id }
            - call: "POST /api/bus-configurations/${cfg_id}/submit-review"
              payload: {}
              as: ConfigEngineer
            - call: "POST /api/bus-configurations/${cfg_id}/freeze"
              payload: { expected_contract_version: "${ct_v0}" }
              as: ConfigEngineer
              captures: { fv1: $.data.freeze_version, sc1: $.data.seat_count }
            - call: "POST /api/bus-configurations/${cfg_id}/return-to-draft"
              payload: {}
              as: ConfigEngineer
            - call: "POST /api/bus-configurations/${cfg_id}/submit-review"
              payload: {}
              as: ConfigEngineer
            - call: "GET /api/contracts/${ct_id}"
              payload: {}
              as: ProcurementOfficer
              captures: { ct_v: $.data.version }
          trigger:
            - call: "POST /api/bus-configurations/${cfg_id}/freeze"
              payload: { expected_contract_version: "${ct_v}" }
              as: ConfigEngineer
              captures: { fv2: $.data.freeze_version, st2: $.data.status }
          assert:
            - "fv1 == 1"
            - "fv2 == 2"
            - "st2 == FROZEN"
