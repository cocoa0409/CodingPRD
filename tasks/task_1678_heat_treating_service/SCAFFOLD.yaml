  - method: POST
    path: "/load-batches/{loadBatchId}/complete-run"
    description: "Complete the run (quench verified)"
    roles: [FurnaceOperator]
    code: 200
    input: []
    output: LoadBatch
    side_effects: ["status RUNNING -> COMPLETED", "completed_at = logical clock", "tc_excursion_assessment", "WorkOrders IN_PROCESS -> PROCESSED with energy_surcharge_cents", "total_energy_surcharge_cents computed"]

  - method: POST
    path: "/load-batches/{loadBatchId}/abort"
    description: "Abort a running load"
    roles: [FurnaceOperator]
    code: 200
    input: []
    output: LoadBatch
    side_effects: ["status RUNNING -> ABORTED", "assignments -> REMOVED", "WorkOrders IN_PROCESS -> RECEIVED", "total_weight_lb recomputed"]

  - method: POST
    path: "/thermocouple-readings"
    description: "Append a load thermocouple reading (batch traceability)"
    roles: [FurnaceOperator]
    code: 201
    input: [load_batch_id, channel, recorded_at, temp_f]
    output: LoadThermocoupleReading
    side_effects: ["precondition: load RUNNING (ERR_LOAD_NOT_RUNNING)"]

  - method: GET
    path: "/thermocouple-readings"
    description: "List load thermocouple readings"
    roles: [CustomerServiceRep, ShopScheduler, FurnaceOperator, CalibrationTech, QualityEngineer, NadcapAuditor, Customer]
    code: 200
    input: ["load_batch_id?", "limit?", "offset?"]
    output: "LoadThermocoupleReading[]"
    side_effects: []

  - method: GET
    path: "/thermocouple-readings/{readingId}"
    description: "Get a thermocouple reading"
    roles: [CustomerServiceRep, ShopScheduler, FurnaceOperator, CalibrationTech, QualityEngineer, NadcapAuditor, Customer]
    code: 200
    input: []
    output: LoadThermocoupleReading
    side_effects: []

  - method: POST
    path: "/audit-packages"
    description: "Compile a Nadcap evidence package over completed loads"
    roles: [QualityEngineer]
    code: 201
    input: [furnace_id, load_batch_ids]
    output: AuditPackage
    side_effects: ["status = DRAFT", "evidence_manifest computed: listed load ids + furnace pyrometry records with performed_at <= latest listed load's completed_at + thermocouple reading counts per load", "precondition: every listed load COMPLETED on this furnace (ERR_LOAD_NOT_COMPLETED)"]

  - method: GET
    path: "/audit-packages"
    description: "List audit packages"
    roles: [CustomerServiceRep, ShopScheduler, FurnaceOperator, CalibrationTech, QualityEngineer, NadcapAuditor, Customer]
    code: 200
    input: ["furnace_id?", "status?", "limit?", "offset?"]
    output: "AuditPackage[]"
    side_effects: []

  - method: GET
    path: "/audit-packages/{packageId}"
    description: "Get an audit package"
    roles: [CustomerServiceRep, ShopScheduler, FurnaceOperator, CalibrationTech, QualityEngineer, NadcapAuditor, Customer]
    code: 200
    input: []
    output: AuditPackage
    side_effects: []

  - method: POST
    path: "/audit-packages/{packageId}/issue"
    description: "Issue (lock) a DRAFT package; issuer must not be the compiler role"
    roles: [NadcapAuditor]
    code: 200
    input: []
    output: AuditPackage
    side_effects: ["status DRAFT -> ISSUED", "issued_at = logical clock", "evidence_manifest frozen"]

  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock (test-driving endpoint). Server startup default is exactly 2026-08-01T00:00:00Z; before any set_current_utc call the logical clock reads this default and never falls back to wall-clock time."
    roles: [CustomerServiceRep, ShopScheduler, FurnaceOperator, CalibrationTech, QualityEngineer, NadcapAuditor, Customer]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["logical clock advanced; furnace postures recompute on next read"]

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER, http: 400, condition: "X-User-ID or X-User-Role header missing or empty" }
  - { id: ERR_INSUFFICIENT_PERMISSIONS, http: 403, condition: "Role not permitted for this endpoint" }
  - { id: ERR_OWNERSHIP_MISMATCH, http: 403, condition: "Customer-role caller's X-User-ID does not match the resource's customer_id" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, invalid enum, empty hardness_readings, scheduled_start_at >= scheduled_end_at, or RUSH lane without guaranteed_turnaround_hours" }
  - { id: ERR_CUSTOMER_NOT_FOUND, http: 404, condition: "CustomerAccount id does not exist" }
  - { id: ERR_RECIPE_NOT_FOUND, http: 404, condition: "FurnaceRecipe id does not exist" }
  - { id: ERR_FURNACE_NOT_FOUND, http: 404, condition: "Furnace id does not exist" }
  - { id: ERR_WORK_ORDER_NOT_FOUND, http: 404, condition: "WorkOrder id does not exist" }
  - { id: ERR_LOAD_BATCH_NOT_FOUND, http: 404, condition: "LoadBatch id does not exist" }
  - { id: ERR_ASSIGNMENT_NOT_FOUND, http: 404, condition: "LoadAssignment id does not exist on this load" }
  - { id: ERR_DISPOSITION_CASE_NOT_FOUND, http: 404, condition: "DispositionCase id does not exist" }
  - { id: ERR_CLAIM_NOT_FOUND, http: 404, condition: "LiabilityClaim id does not exist" }
  - { id: ERR_AUDIT_PACKAGE_NOT_FOUND, http: 404, condition: "AuditPackage id does not exist" }
  - { id: ERR_PYROMETRY_RECORD_NOT_FOUND, http: 404, condition: "PyrometryRecord id does not exist" }
  - { id: ERR_THERMOCOUPLE_READING_NOT_FOUND, http: 404, condition: "LoadThermocoupleReading id does not exist" }
  - { id: ERR_INSPECTION_TEST_NOT_FOUND, http: 404, condition: "InspectionTest id does not exist" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_load_batch_version does not equal LoadBatch.version" }
  - { id: ERR_RECIPE_NOT_APPROVED, http: 409, condition: "Load create/release references a recipe not in APPROVED" }
  - { id: ERR_DUPLICATE_RECIPE, http: 409, condition: "A recipe with the same (alloy_code, spec_code) already exists" }
  - { id: ERR_FURNACE_NOT_QUALIFIED, http: 422, condition: "Release or start-run while furnace qualification_status != QUALIFIED" }
  - { id: ERR_RECIPE_CLASS_MISMATCH, http: 422, condition: "Furnace class rank exceeds the recipe's required_furnace_class rank" }
  - { id: ERR_QUENCH_MEDIA_INCOMPATIBLE, http: 422, condition: "Furnace does not support the recipe's quench_media" }
  - { id: ERR_RECIPE_MISMATCH, http: 422, condition: "Work order's recipe_id differs from the load's recipe_id" }
  - { id: ERR_WORK_ORDER_NOT_ASSIGNABLE, http: 409, condition: "Assignment requires work order processing_status in {RECEIVED, AWAITING_RETREAT}" }
  - { id: ERR_LOAD_WEIGHT_EXCEEDED, http: 422, condition: "Assignment would push total_weight_lb strictly above Furnace.max_load_weight_lb" }
  - { id: ERR_EMPTY_LOAD, http: 422, condition: "Release requires at least one ACTIVE assignment" }
  - { id: ERR_LOAD_NOT_BUILDING, http: 409, condition: "Operation requires load status BUILDING (assignment writes also accept HOLD); covers release/unassign from other states" }
  - { id: ERR_LOAD_NOT_RELEASED, http: 409, condition: "start-run requires status RELEASED" }
  - { id: ERR_LOAD_NOT_RUNNING, http: 409, condition: "complete-run, abort, and thermocouple readings require status RUNNING" }
  - { id: ERR_WORK_ORDER_NOT_TESTABLE, http: 409, condition: "Inspection requires processing_status == PROCESSED and quality_status == PENDING_TEST" }
  - { id: ERR_WORK_ORDER_NOT_SHIPPABLE, http: 409, condition: "Ship requires PROCESSED with quality_status in {PASSED, WAIVED}" }
  - { id: ERR_WORK_ORDER_NOT_CANCELLABLE, http: 409, condition: "Cancel requires processing_status in {RECEIVED, SCHEDULED}" }
  - { id: ERR_DISPOSITION_NOT_OPEN, http: 409, condition: "Decide requires disposition case status OPEN" }
  - { id: ERR_RETREAT_LIMIT_REACHED, http: 422, condition: "RE_TREAT rejected when retreat_count == recipe.max_retreats" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Disposition decider's X-User-ID equals the inspection test's recorded_by_user_id" }
  - { id: ERR_CLAIM_NOT_PENDING, http: 409, condition: "Accept/reject requires claim status PENDING" }
  - { id: ERR_CLAIM_NOT_ACCEPTED, http: 409, condition: "Pay requires claim status ACCEPTED" }
  - { id: ERR_LOAD_NOT_COMPLETED, http: 409, condition: "Audit package requires every listed load COMPLETED on the given furnace" }
  - { id: ERR_PACKAGE_NOT_DRAFT, http: 409, condition: "Issue requires package status DRAFT" }
  - { id: ERR_FURNACE_SCHEDULE_OVERLAP, http: 409, condition: "Load window overlaps another load in {RELEASED, RUNNING, COMPLETED} on the same furnace" }
  - { id: ERR_QUENCH_PURGE_GAP_VIOLATION, http: 409, condition: "Adjacent loads with different quench media have less than 60 minutes between the earlier end and later start" }
  - { id: ERR_PYROMETRY_WINDOW_VIOLATION, http: 422, condition: "Load window not fully contained in latest PASS TUS and calibration validity intervals at release" }
  - { id: ERR_INVALID_GUARANTEE_WINDOW, http: 422, condition: "RUSH guaranteed_turnaround_hours < 4" }
  - { id: ERR_CUSTOMER_CREDIT_HOLD, http: 402, condition: "Work order creation while customer credit_hold is true" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: CustomerServiceRep
    description: "Front-office: customer accounts, work order intake, ship/cancel, claim settlement"
    identity: opaque
    exclusive_operations:
      - "POST /customer-accounts"
      - "POST /work-orders, POST /work-orders/{id}/ship, POST /work-orders/{id}/cancel"
      - "POST /liability-claims/{id}/reject, POST /liability-claims/{id}/pay"
    shared_operations:
      - "All GET endpoints; POST /_clock/set_current_utc"

  - name: ShopScheduler
    description: "Builds loads: furnaces, load batches, assignments, release"
    identity: opaque
    exclusive_operations:
      - "POST /furnaces"
      - "POST /load-batches"
      - "POST /load-batches/{id}/assignments, POST /load-batches/{id}/assignments/{aid}/unassign"
      - "POST /load-batches/{id}/release"
    shared_operations:
      - "All GET endpoints; POST /_clock/set_current_utc"

  - name: FurnaceOperator
    description: "Runs furnace loads and appends thermocouple readings"
    identity: opaque
    exclusive_operations:
      - "POST /load-batches/{id}/start-run, POST /load-batches/{id}/complete-run, POST /load-batches/{id}/abort"
      - "POST /thermocouple-readings"
    shared_operations:
      - "All GET endpoints; POST /_clock/set_current_utc"

  - name: CalibrationTech
    description: "Performs pyrometry surveys and instrument calibrations"
    identity: opaque
    exclusive_operations:
      - "POST /pyrometry-records"
    shared_operations:
      - "All GET endpoints; POST /_clock/set_current_utc"

  - name: QualityEngineer
    description: "Recipes, inspection testing, disposition decisions, audit package compilation; disposition decider must differ from the test recorder (segregation of duties)"
    identity: opaque
    exclusive_operations:
      - "POST /furnace-recipes, POST /furnace-recipes/{id}/approve"
      - "POST /inspection-tests"
      - "POST /disposition-cases/{id}/decide"
      - "POST /audit-packages"
    shared_operations:
      - "All GET endpoints; POST /_clock/set_current_utc"

  - name: NadcapAuditor
    description: "External auditor: issues (locks) audit packages; read-only otherwise"
    identity: opaque
    exclusive_operations:
      - "POST /audit-packages/{id}/issue"
    shared_operations:
      - "All GET endpoints; POST /_clock/set_current_utc"

  - name: Customer
    description: "Customer of the heat treater; reads own resources and accepts liability claims"
    identity: entity_backed:CustomerAccount
    exclusive_operations:
      - "POST /liability-claims/{id}/accept (ownership: X-User-ID == claim.customer_id)"
    shared_operations:
      - "GET endpoints scoped to own customer_id; POST /_clock/set_current_utc"
