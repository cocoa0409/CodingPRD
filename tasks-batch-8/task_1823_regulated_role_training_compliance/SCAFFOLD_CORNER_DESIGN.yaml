          - "response_envelope.pagination_defaults"
        distinguishing_aspect: "Filters narrow the result set; limit/offset paginate the filtered set with correct total_count and has_more at each page."
        test_recipe:
          setup: ["Clock 2026-08-03T09:00:00Z; regulator REG-PG; curriculum CUR-PG ACTIVE; role R-PG with SOFT INITIAL_ONLY req (due 30); employees E-P1, E-P2, E-P3 each with exactly one assignment"]
