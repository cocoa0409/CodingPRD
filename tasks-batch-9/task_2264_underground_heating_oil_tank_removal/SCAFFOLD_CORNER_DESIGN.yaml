              payload: { survey_method: "GPR", tanks_detected_count: 1, tank_capacity_gallons: 550, tank_depth_to_top_inches: 60, tank_distance_to_foundation_inches: 90, tank_under_structure: false, tank_material: "STEEL" }
              as: FieldTechnician
            - call: "POST /disclosures"
              payload: { tank_project_id: "${proj_id}", disclosure_kind: "SWEEP_FINDINGS" }
              as: ProjectCoordinator
              captures: { disc_id: $.data.id }
            - call: "POST /disclosures/${disc_id}/respond"
              payload: { response: "ACKNOWLEDGED", response_channel: "PORTAL" }
              as: Homeowner
              as_user_id: "${prop_id}"
            - call: "POST /permits"
              payload: { tank_project_id: "${proj_id}", permit_type: "MUNICIPAL_DECOMMISSION" }
              as: ProjectCoordinator
              captures: { mun_permit_id: $.data.id }
            - call: "POST /permits/${mun_permit_id}/decision"
              payload: { decision: "ISSUED" }
              as: ComplianceOfficer
            - call: "POST /permits"
              payload: { tank_project_id: "${proj_id}", permit_type: "FIRE_MARSHAL_NOTIFICATION" }
              as: ProjectCoordinator
              captures: { fm_permit_id: $.data.id }
            - call: "POST /permits/${fm_permit_id}/decision"
              payload: { decision: "ISSUED" }
              as: ComplianceOfficer
            - call: "POST /crews"
              payload: { crew_name: "Crew Scope Gates", cert_level: "TANK_TECH_II" }
              as: ProjectCoordinator
              captures: { crew_id: $.data.id }
            - call: "POST /work-orders"
              payload: { tank_project_id: "${proj_id}", crew_id: "${crew_id}", method: "REMOVAL", scheduled_start_at: "2026-08-06T13:00:00Z", scheduled_end_at: "2026-08-06T21:00:00Z" }
              as: ProjectCoordinator
              captures: { wo_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-06T13:00:00Z" }
              as: ComplianceOfficer
            - call: "POST /work-orders/${wo_id}/field-events"
              payload: { event: "MOBILIZE" }
              as: FieldTechnician
            - call: "POST /work-orders/${wo_id}/field-events"
              payload: { event: "START" }
              as: FieldTechnician
            - call: "POST /work-orders/${wo_id}/field-events"
              payload: { event: "COMPLETE", actual_excavated_cubic_yards: 9.5, hauled_tons: 12.4 }
