          setup:
            - "Clock 2026-06-01T00:00:00Z. Client+Program (monthly 600, reserve_floor 0). One debt 5000. Program ACTIVE."
            - "An offer 0.40 (need 2500) created then REJECTED. Account balance is 0 (no deposits) so the offer would ALSO fail the projected reserve check."
