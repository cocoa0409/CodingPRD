  # ========================================================== 5. Endpoints
  - section: endpoints
    instances:
      - name: corner_truck_carrier_patch_updates_only_the_supplied_fields
        claim_type: Standard CRUD
        grounds:
          - endpoints.PATCH_/vpc/truck-carriers/{carrierId}
          - endpoints.GET_/vpc/truck-carriers/{carrierId}
          - entities.TruckCarrier
        distinguishing_aspect: "PATCH with only linehaul_rate_cents_per_mile 380 changes that field and bumps version to 2 while status stays ACTIVE, slot_capacity stays 4 and available_slots stays 4; a second PATCH with concurrent_load_capacity 3 leaves the new rate intact."
        test_recipe:
          setup:
            - "One ACTIVE carrier at 412 cents/mile, slot_capacity 4, concurrent_load_capacity 2."
          setup_api_calls:
            - call: "POST /vpc/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PortOperationsPlanner
            - call: "POST /vpc/truck-carriers"
              payload: { carrier_code: "TC-ROAD", name: "Roadway Auto Transport", served_route_zones: ["A", "B"], linehaul_rate_cents_per_mile: 412, slot_capacity: 4, concurrent_load_capacity: 2 }
              as: DistributionManager
              captures: { carrier_id: $.data.id, v0: $.data.version }
          trigger:
            - call: "PATCH /vpc/truck-carriers/${carrier_id}"
              payload: { linehaul_rate_cents_per_mile: 380 }
              as: DistributionManager
              captures: { rate1: $.data.linehaul_rate_cents_per_mile, status1: $.data.status, v1: $.data.version, avail1: $.data.available_slots }
            - call: "PATCH /vpc/truck-carriers/${carrier_id}"
              payload: { concurrent_load_capacity: 3 }
              as: DistributionManager
              captures: { conc2: $.data.concurrent_load_capacity, rate2: $.data.linehaul_rate_cents_per_mile, v2: $.data.version }
            - call: "GET /vpc/truck-carriers/${carrier_id}"
              payload: {}
              as: PortOperationsPlanner
              captures: { read_rate: $.data.linehaul_rate_cents_per_mile, read_conc: $.data.concurrent_load_capacity, read_zones: $.data.served_route_zones }
          assert:
            - "${v0} == 1, ${v1} == 2 and ${v2} == 3 — every accepted write bumps version"
            - "${rate1} == 380, ${status1} == ACTIVE and ${avail1} == 4 (slot_capacity 4 - committed_slots 0)"
            - "${conc2} == 3 and ${rate2} == 380 — the second PATCH does not reset the first field"
            - "${read_rate} == 380, ${read_conc} == 3 and ${read_zones} == [A, B] (served_route_zones is not patchable)"

