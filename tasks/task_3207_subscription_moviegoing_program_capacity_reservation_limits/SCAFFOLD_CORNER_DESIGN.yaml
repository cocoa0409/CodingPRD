        test_recipe:
          setup:
            - "Clock 2026-09-01; plan quota=3 cap=2 PUBLISHED; ACTIVE member with subscription; week 0 untouched; clock advanced to 2026-09-08T00:00:00Z"
          setup_api_calls:
