              as: Originator
              as_user_id: "${orig_id}"
              captures: { err: $.data.error_id }
            - call: "GET /advertisements/${ad_id}"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
              captures: { st_after: $.data.status, pub: $.data.published_at, find: $.data.disclosure_findings }
          assert:
            - "${ad_st} == DRAFT"
            - "HTTP status is 409"
            - "${err} == ERR_INVALID_STATE_TRANSITION"
            - "${st_after} == DRAFT"
            - "${pub} == null"
            - "${find} == [] (findings are only computed at submission)"

      - name: surrender_action_on_revoked_license_returns_already_terminal
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.LicenseRegistration.terminal_states
          - validations[priority=12]
          - errors[ERR_ALREADY_TERMINAL]
        distinguishing_aspect: |
          REVOKED is a terminal state of LicenseRegistration, so a follow-up SURRENDER
          status-action returns 409 ERR_ALREADY_TERMINAL (priority 12, not the priority-11
          invalid-transition error) and the licence stays REVOKED with authorized_state_codes
          still empty.
        test_recipe:
          setup:
            - "Originator 2200001 with a CA licence that was ACTIVE and sponsored, then
               REVOKED at 2026-08-01T00:00:00Z (the revoke cascade already relinquished the
               sponsorship and emptied authorized_state_codes)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
              as_user_id: "admin-1"
            - call: "POST /originators"
              payload: { nmls_unique_id: "2200001", legal_name: "Avery Lane", hire_date: "2024-01-15T00:00:00Z" }
              as: LicensingAnalyst
              as_user_id: "analyst-1"
              captures: { orig_id: $.data.id }
