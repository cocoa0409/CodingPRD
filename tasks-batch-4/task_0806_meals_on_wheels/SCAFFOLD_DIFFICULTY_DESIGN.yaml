          On POST /deliveries a state violation (client not ACTIVE, category
          state, priority 9) and a capacity violation (route full, category
          business_constraint, priority 13) co-occur; the state error
          ERR_CLIENT_NOT_ACTIVE wins. Category pair: state vs business_constraint.
        test_recipe:
          setup:
            - "Route max_meals_per_run 2 in zone Z1. Client H is ACTIVE with a HOT plan (meals_per_day 2) and a SCHEDULED delivery on 2026-03-02 (meal_count 2, filling capacity). Client A is only ASSESSED (never activated) but has an ACTIVE HOT plan (meals_per_day 2) on the same route."
