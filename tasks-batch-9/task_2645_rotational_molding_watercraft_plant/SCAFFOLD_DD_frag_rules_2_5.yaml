              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { lot_small: $.data.id }
            - call: "POST /production-orders"
              payload: { order_code: "PO-P2", product_model_id: "${pm}", target_warehouse_id: "${wh}", ordered_qty: 1 }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { po: $.data.id }
            - call: "POST /production-orders/${po}/release"
              payload: {}
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { po_v: $.data.version }
            - call: "POST /molding-cycles"
