# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Grocery Online Ordering & Fulfillment — Expert
# 9 rule_ids x 2 instances = 18 instances. Every grounds ref resolves into
# SCAFFOLD.yaml §1.1-§1.7. Every setup/trigger chain is empty-DB executable
# against §1.5. All formula-derived asserts are pre-computed literals.
# =============================================================================
scaffold_difficulty_design:

  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: dvc_weighted_line_estimated_vs_final
        grounds:
          - calculations.line_charge
          - entities.OrderLine.fields.estimated_line_cents
          - entities.OrderLine.fields.final_line_cents
          - state_machines.OrderLine.PENDING_to_PICKED
        distinguishing_aspect: |
          On the OrderLine domain: a WEIGHT product priced 199 c/kg yields estimated_line_cents=299
          from estimated_weight_kg=1.50 (round_half_up(298.5)) but final_line_cents=364 from
          actual_weight_kg=1.83 (round_half_up(364.17)); the two variants differ by 65 cents.
        test_recipe:
          setup:
            - "Store S (ebt_enabled true). Customer C. Picker P at S (AVAILABLE). WEIGHT product (199 c/kg)."
            - "Slot capacity 1. Order placed with one WEIGHT line est_weight 1.50kg. Order PLACED, line PENDING, estimated_line_cents=299."
            - "Picker claims order (PICKING)."
          setup_api_calls:
            - call: "POST /v1/stores"
              payload: { name: "S", ebt_enabled: true }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /v1/customers"
              payload: { email: "c@x.com", full_name: "C", date_of_birth: "1990-01-01", snap_ebt_balance_cents: 100000 }
              as: PlatformAdmin
              captures: { c_id: $.data.id }
            - call: "POST /v1/pickers"
              payload: { store_id: "${s_id}", full_name: "P" }
              as: StoreOps
              captures: { p_id: $.data.id }
            - call: "POST /v1/products"
              payload: { store_id: "${s_id}", sku: "BAN", name: "Bananas", pricing_mode: "WEIGHT", unit_price_cents: 199, ebt_eligible: true }
              as: StoreOps
              captures: { prod_id: $.data.id }
            - call: "POST /v1/slots"
              payload: { store_id: "${s_id}", slot_type: "PICKUP", window_start: "2026-06-15T09:00:00Z", window_end: "2026-06-15T11:00:00Z", capacity: 1 }
              as: StoreOps
              captures: { slot_id: $.data.id, slot_v: $.data.version }
            - call: "POST /v1/orders"
              payload: { store_id: "${s_id}", customer_id: "${c_id}", slot_id: "${slot_id}", expected_slot_version: "${slot_v}", lines: [ { product_id: "${prod_id}", requested_qty: 1, estimated_weight_kg: 1.50, substitution_policy: "NO_SUBSTITUTION" } ] }
              as: Customer
              as_user_id: "${c_id}"
              captures: { ord_id: $.data.id, est_total: $.data.estimated_total_cents }
            - call: "GET /v1/order-lines"
              payload: { order_id: "${ord_id}" }
              as: Picker
              as_user_id: "${p_id}"
              captures: { line_id: "$.data[0].id" }
            - call: "POST /v1/orders/${ord_id}/claim"
              payload: { window_start: "2026-06-15T08:00:00Z", window_end: "2026-06-15T08:45:00Z" }
              as: Picker
              as_user_id: "${p_id}"
          trigger:
            - call: "POST /v1/order-lines/${line_id}/pick"
              payload: { actual_weight_kg: 1.83 }
              as: Picker
              as_user_id: "${p_id}"
              captures: { final_cents: $.data.final_line_cents }
          assert:
            - "OrderLine.${line_id}.estimated_line_cents == 299"
            - "OrderLine.${line_id}.final_line_cents == 364"
            - "OrderLine.${line_id}.status == PICKED"

      - name: dvc_order_total_estimated_vs_final
        grounds:
          - calculations.order_total_estimated
          - calculations.order_total_final
          - entities.Order.fields.estimated_total_cents
          - entities.Order.fields.final_total_cents
          - state_machines.Order.PICKING_to_STAGED
        distinguishing_aspect: |
          On the Order domain (distinct entity from the OrderLine dual-variant): estimated_total_cents=997
          (banana est 299 + milk 698) diverges from final_total_cents=1062 (banana final 364 + milk 698) after
          the WEIGHT line is picked heavier, proving the order-level estimate-vs-final divergence.
        test_recipe:
          setup:
            - "Store S, Customer C, Picker P, slot cap 1. Order with two lines: WEIGHT banana est 1.50kg (199 c/kg) and UNIT milk qty 2 (349 c each), tip 0."
            - "estimated_total_cents = 299 + 698 = 997. Order claimed (PICKING)."
            - "Banana picked at 1.83kg -> 364; milk picked qty 2 -> 698. Both lines PICKED."
          setup_api_calls:
            - call: "POST /v1/stores"
              payload: { name: "S", ebt_enabled: true }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /v1/customers"
              payload: { email: "c2@x.com", full_name: "C", date_of_birth: "1990-01-01", snap_ebt_balance_cents: 100000 }
              as: PlatformAdmin
              captures: { c_id: $.data.id }
            - call: "POST /v1/pickers"
              payload: { store_id: "${s_id}", full_name: "P" }
              as: StoreOps
              captures: { p_id: $.data.id }
            - call: "POST /v1/products"
              payload: { store_id: "${s_id}", sku: "BAN", name: "Bananas", pricing_mode: "WEIGHT", unit_price_cents: 199, ebt_eligible: true }
              as: StoreOps
              captures: { ban_id: $.data.id }
            - call: "POST /v1/products"
              payload: { store_id: "${s_id}", sku: "MILK", name: "Milk", pricing_mode: "UNIT", unit_price_cents: 349, ebt_eligible: true }
              as: StoreOps
              captures: { milk_id: $.data.id }
            - call: "POST /v1/slots"
              payload: { store_id: "${s_id}", slot_type: "PICKUP", window_start: "2026-06-15T09:00:00Z", window_end: "2026-06-15T11:00:00Z", capacity: 1 }
              as: StoreOps
              captures: { slot_id: $.data.id, slot_v: $.data.version }
            - call: "POST /v1/orders"
              payload: { store_id: "${s_id}", customer_id: "${c_id}", slot_id: "${slot_id}", expected_slot_version: "${slot_v}", tip_cents: 0, lines: [ { product_id: "${ban_id}", requested_qty: 1, estimated_weight_kg: 1.50 }, { product_id: "${milk_id}", requested_qty: 2 } ] }
              as: Customer
              as_user_id: "${c_id}"
              captures: { ord_id: $.data.id, est_total: $.data.estimated_total_cents }
            - call: "GET /v1/order-lines"
              payload: { order_id: "${ord_id}", product_id: "${ban_id}" }
              as: Picker
              as_user_id: "${p_id}"
              captures: { ban_line: "$.data[0].id" }
            - call: "GET /v1/order-lines"
              payload: { order_id: "${ord_id}", product_id: "${milk_id}" }
              as: Picker
              as_user_id: "${p_id}"
              captures: { milk_line: "$.data[0].id" }
            - call: "POST /v1/orders/${ord_id}/claim"
              payload: { window_start: "2026-06-15T08:00:00Z", window_end: "2026-06-15T08:45:00Z" }
              as: Picker
              as_user_id: "${p_id}"
            - call: "POST /v1/order-lines/${ban_line}/pick"
              payload: { actual_weight_kg: 1.83 }
              as: Picker
              as_user_id: "${p_id}"
            - call: "POST /v1/order-lines/${milk_line}/pick"
              payload: { picked_qty: 2 }
              as: Picker
              as_user_id: "${p_id}"
          trigger:
            - call: "POST /v1/orders/${ord_id}/stage"
              payload: {}
              as: Picker
              as_user_id: "${p_id}"
              captures: { fin_total: $.data.final_total_cents }
          assert:
            - "Order.${ord_id}.estimated_total_cents == 997"
            - "Order.${ord_id}.final_total_cents == 1062"
            - "Order.${ord_id}.fulfillment_status == STAGED"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: cf_split_tender_nested_min   # mode (a): >=3 inputs, nested min, overflow to card
        grounds:
          - calculations.split_tender_allocation
          - entities.Order.fields.ebt_charged_cents
          - entities.Order.fields.card_charged_cents
          - entities.Customer.fields.snap_ebt_balance_cents
          - state_machines.Order.AUTHORIZED_to_CAPTURED
        distinguishing_aspect: |
          Mode (a): three inputs (final_ebt_eligible_cents E=1062, snap_ebt_balance B=800, final_total T=1562
          including a 500c tip) combine non-linearly via ebt=min(E,B)=800 and card=T-ebt=762; the eligible
          remainder (262) plus the non-eligible tip (500) spill to card. Distinct from the mode-(b)
          rounding-order instance below.
        test_recipe:
          setup:
            - "Store S (ebt_enabled true). Customer C snap_ebt_balance 800. Picker P. Slot cap 1."
            - "Order with EBT-eligible banana (199 c/kg) + EBT-eligible milk (349 UNIT), tip 500."
            - "Picked: banana 1.83kg->364, milk qty 2->698. final_ebt_eligible=1062, final_total=1062+500=1562. Staged."
          setup_api_calls:
            - call: "POST /v1/stores"
              payload: { name: "S", ebt_enabled: true }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /v1/customers"
              payload: { email: "c3@x.com", full_name: "C", date_of_birth: "1990-01-01", snap_ebt_balance_cents: 800 }
              as: PlatformAdmin
              captures: { c_id: $.data.id }
            - call: "POST /v1/pickers"
              payload: { store_id: "${s_id}", full_name: "P" }
              as: StoreOps
              captures: { p_id: $.data.id }
            - call: "POST /v1/products"
              payload: { store_id: "${s_id}", sku: "BAN", name: "Bananas", pricing_mode: "WEIGHT", unit_price_cents: 199, ebt_eligible: true }
              as: StoreOps
              captures: { ban_id: $.data.id }
            - call: "POST /v1/products"
              payload: { store_id: "${s_id}", sku: "MILK", name: "Milk", pricing_mode: "UNIT", unit_price_cents: 349, ebt_eligible: true }
              as: StoreOps
              captures: { milk_id: $.data.id }
            - call: "POST /v1/slots"
              payload: { store_id: "${s_id}", slot_type: "PICKUP", window_start: "2026-06-15T09:00:00Z", window_end: "2026-06-15T11:00:00Z", capacity: 1 }
              as: StoreOps
              captures: { slot_id: $.data.id, slot_v: $.data.version }
            - call: "POST /v1/orders"
              payload: { store_id: "${s_id}", customer_id: "${c_id}", slot_id: "${slot_id}", expected_slot_version: "${slot_v}", tip_cents: 500, lines: [ { product_id: "${ban_id}", requested_qty: 1, estimated_weight_kg: 1.50 }, { product_id: "${milk_id}", requested_qty: 2 } ] }
              as: Customer
              as_user_id: "${c_id}"
              captures: { ord_id: $.data.id }
            - call: "GET /v1/order-lines"
              payload: { order_id: "${ord_id}", product_id: "${ban_id}" }
              as: Picker
              as_user_id: "${p_id}"
              captures: { ban_line: "$.data[0].id" }
            - call: "GET /v1/order-lines"
              payload: { order_id: "${ord_id}", product_id: "${milk_id}" }
              as: Picker
              as_user_id: "${p_id}"
              captures: { milk_line: "$.data[0].id" }
            - call: "POST /v1/orders/${ord_id}/claim"
              payload: { window_start: "2026-06-15T08:00:00Z", window_end: "2026-06-15T08:45:00Z" }
              as: Picker
              as_user_id: "${p_id}"
            - call: "POST /v1/order-lines/${ban_line}/pick"
              payload: { actual_weight_kg: 1.83 }
              as: Picker
              as_user_id: "${p_id}"
            - call: "POST /v1/order-lines/${milk_line}/pick"
              payload: { picked_qty: 2 }
              as: Picker
              as_user_id: "${p_id}"
            - call: "POST /v1/orders/${ord_id}/stage"
              payload: {}
              as: Picker
              as_user_id: "${p_id}"
          trigger:
            - call: "POST /v1/orders/${ord_id}/capture"
              payload: {}
              as: StoreOps
              captures: { ebt: $.data.ebt_charged_cents, card: $.data.card_charged_cents }
          assert:
            - "Order.${ord_id}.ebt_charged_cents == 800"
            - "Order.${ord_id}.card_charged_cents == 762"
            - "Order.${ord_id}.payment_status == CAPTURED"
            - "Customer.${c_id}.snap_ebt_balance_cents == 0"

      - name: cf_weighted_rounding_order   # mode (b): nested rounding where order matters
        grounds:
          - calculations.order_total_estimated
          - calculations.line_charge
          - entities.OrderLine.fields.estimated_line_cents
          - entities.Order.fields.estimated_total_cents
        distinguishing_aspect: |
          Mode (b): two WEIGHT lines of 100 c/kg at 0.005 kg each. Round-per-line-then-sum (the pinned order)
          gives round_half_up(0.5)+round_half_up(0.5)=1+1=2; sum-then-round would give round_half_up(1.0)=1.
          estimated_total_cents must equal 2, proving the round-per-line ordering. Distinct mode from the
          mode-(a) split-tender instance.
        test_recipe:
          setup:
            - "Store S. Customer C. WEIGHT product 'gram' priced 100 c/kg. Slot cap 1."
            - "Order with TWO lines of product 'gram', each estimated_weight_kg 0.005, tip 0."
          setup_api_calls:
            - call: "POST /v1/stores"
              payload: { name: "S", ebt_enabled: true }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /v1/customers"
              payload: { email: "c4@x.com", full_name: "C", date_of_birth: "1990-01-01" }
              as: PlatformAdmin
              captures: { c_id: $.data.id }
            - call: "POST /v1/products"
              payload: { store_id: "${s_id}", sku: "GRAM", name: "Gram", pricing_mode: "WEIGHT", unit_price_cents: 100 }
              as: StoreOps
              captures: { gram_id: $.data.id }
            - call: "POST /v1/slots"
              payload: { store_id: "${s_id}", slot_type: "PICKUP", window_start: "2026-06-15T09:00:00Z", window_end: "2026-06-15T11:00:00Z", capacity: 1 }
              as: StoreOps
              captures: { slot_id: $.data.id, slot_v: $.data.version }
          trigger:
            - call: "POST /v1/orders"
              payload: { store_id: "${s_id}", customer_id: "${c_id}", slot_id: "${slot_id}", expected_slot_version: "${slot_v}", tip_cents: 0, lines: [ { product_id: "${gram_id}", requested_qty: 1, estimated_weight_kg: 0.005 }, { product_id: "${gram_id}", requested_qty: 1, estimated_weight_kg: 0.005 } ] }
              as: Customer
              as_user_id: "${c_id}"
              captures: { ord_id: $.data.id, est_total: $.data.estimated_total_cents }
          assert:
            - "Order.${ord_id}.estimated_total_cents == 2"
            - "Order.${ord_id}.fulfillment_status == PLACED"

  # ---------------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: nlsm_order_parallel_dimensions
        grounds:
          - state_machines.Order.AUTHORIZED_to_CAPTURED
          - state_machines.Order.PICKING_to_STAGED
          - entities.Order.fields.fulfillment_status
          - entities.Order.fields.payment_status
        distinguishing_aspect: |
          Order carries two independent state dimensions: fulfillment_status (PLACED->PICKING->STAGED) and
          payment_status (AUTHORIZED->CAPTURED). After stage+capture the order is STAGED on the fulfillment
          axis yet CAPTURED on the payment axis — the two axes hold distinct values at once on one row.
        test_recipe:
          setup:
            - "Store, Customer, Picker, slot cap 1. Order with one UNIT milk line qty 1 (349)."
            - "Claimed (PICKING), line picked, staged (STAGED, still AUTHORIZED)."
          setup_api_calls:
            - call: "POST /v1/stores"
              payload: { name: "S", ebt_enabled: true }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /v1/customers"
              payload: { email: "c5@x.com", full_name: "C", date_of_birth: "1990-01-01" }
              as: PlatformAdmin
              captures: { c_id: $.data.id }
            - call: "POST /v1/pickers"
              payload: { store_id: "${s_id}", full_name: "P" }
              as: StoreOps
              captures: { p_id: $.data.id }
            - call: "POST /v1/products"
              payload: { store_id: "${s_id}", sku: "MILK", name: "Milk", pricing_mode: "UNIT", unit_price_cents: 349 }
              as: StoreOps
              captures: { milk_id: $.data.id }
            - call: "POST /v1/slots"
              payload: { store_id: "${s_id}", slot_type: "PICKUP", window_start: "2026-06-15T09:00:00Z", window_end: "2026-06-15T11:00:00Z", capacity: 1 }
              as: StoreOps
              captures: { slot_id: $.data.id, slot_v: $.data.version }
            - call: "POST /v1/orders"
              payload: { store_id: "${s_id}", customer_id: "${c_id}", slot_id: "${slot_id}", expected_slot_version: "${slot_v}", lines: [ { product_id: "${milk_id}", requested_qty: 1 } ] }
              as: Customer
              as_user_id: "${c_id}"
              captures: { ord_id: $.data.id }
            - call: "GET /v1/order-lines"
              payload: { order_id: "${ord_id}" }
              as: Picker
              as_user_id: "${p_id}"
              captures: { line_id: "$.data[0].id" }
            - call: "POST /v1/orders/${ord_id}/claim"
              payload: { window_start: "2026-06-15T08:00:00Z", window_end: "2026-06-15T08:45:00Z" }
              as: Picker
              as_user_id: "${p_id}"
            - call: "POST /v1/order-lines/${line_id}/pick"
              payload: { picked_qty: 1 }
              as: Picker
              as_user_id: "${p_id}"
            - call: "POST /v1/orders/${ord_id}/stage"
              payload: {}
              as: Picker
              as_user_id: "${p_id}"
          trigger:
            - call: "POST /v1/orders/${ord_id}/capture"
              payload: {}
              as: StoreOps
              captures: { fs: $.data.fulfillment_status, ps: $.data.payment_status }
          assert:
            - "Order.${ord_id}.fulfillment_status == STAGED"
            - "Order.${ord_id}.payment_status == CAPTURED"

      - name: nlsm_orderline_branching_outcomes
        grounds:
          - state_machines.OrderLine.PENDING_to_PICKED
          - state_machines.OrderLine.PENDING_to_SUBSTITUTED
          - state_machines.OrderLine.PENDING_to_OUT_OF_STOCK
          - entities.OrderLine.fields.status
        distinguishing_aspect: |
          OrderLine (a different entity from Order) branches from PENDING into divergent terminal outcomes with
          different side-effect sets: SUBSTITUTED (final_line_cents from the substitute=300) and OUT_OF_STOCK
          (final_line_cents=0). Two PENDING lines in one order take different branches, proving fork divergence.
        test_recipe:
          setup:
            - "Store, Customer, Picker, slot cap 1. UNIT products A(349) and B(500)."
            - "Order with line A (SHOPPER_CHOICE) and line B (NO_SUBSTITUTION). Claimed (PICKING)."
            - "Substitute product SUB(300) created and proposed for A."
          setup_api_calls:
            - call: "POST /v1/stores"
              payload: { name: "S", ebt_enabled: true }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /v1/customers"
              payload: { email: "c6@x.com", full_name: "C", date_of_birth: "1990-01-01" }
              as: PlatformAdmin
              captures: { c_id: $.data.id }
            - call: "POST /v1/pickers"
              payload: { store_id: "${s_id}", full_name: "P" }
              as: StoreOps
              captures: { p_id: $.data.id }
            - call: "POST /v1/products"
              payload: { store_id: "${s_id}", sku: "A", name: "A", pricing_mode: "UNIT", unit_price_cents: 349 }
              as: StoreOps
              captures: { a_id: $.data.id }
            - call: "POST /v1/products"
              payload: { store_id: "${s_id}", sku: "B", name: "B", pricing_mode: "UNIT", unit_price_cents: 500 }
              as: StoreOps
              captures: { b_id: $.data.id }
            - call: "POST /v1/products"
              payload: { store_id: "${s_id}", sku: "SUB", name: "Sub", pricing_mode: "UNIT", unit_price_cents: 300 }
              as: StoreOps
              captures: { sub_id: $.data.id }
            - call: "POST /v1/slots"
              payload: { store_id: "${s_id}", slot_type: "PICKUP", window_start: "2026-06-15T09:00:00Z", window_end: "2026-06-15T11:00:00Z", capacity: 1 }
              as: StoreOps
              captures: { slot_id: $.data.id, slot_v: $.data.version }
            - call: "POST /v1/orders"
              payload: { store_id: "${s_id}", customer_id: "${c_id}", slot_id: "${slot_id}", expected_slot_version: "${slot_v}", lines: [ { product_id: "${a_id}", requested_qty: 1, substitution_policy: "SHOPPER_CHOICE" }, { product_id: "${b_id}", requested_qty: 1, substitution_policy: "NO_SUBSTITUTION" } ] }
              as: Customer
              as_user_id: "${c_id}"
              captures: { ord_id: $.data.id }
            - call: "GET /v1/order-lines"
              payload: { order_id: "${ord_id}", product_id: "${a_id}" }
              as: Picker
              as_user_id: "${p_id}"
              captures: { a_line: "$.data[0].id" }
            - call: "GET /v1/order-lines"
              payload: { order_id: "${ord_id}", product_id: "${b_id}" }
              as: Picker
              as_user_id: "${p_id}"
              captures: { b_line: "$.data[0].id" }
            - call: "POST /v1/orders/${ord_id}/claim"
              payload: { window_start: "2026-06-15T08:00:00Z", window_end: "2026-06-15T08:45:00Z" }
              as: Picker
              as_user_id: "${p_id}"
            - call: "POST /v1/substitutions"
              payload: { order_line_id: "${a_line}", substitute_product_id: "${sub_id}", substitute_qty: 1 }
              as: Picker
              as_user_id: "${p_id}"
              captures: { sub_rec: $.data.id }
          trigger:
            - call: "POST /v1/substitutions/${sub_rec}/accept"
              payload: {}
              as: Picker
              as_user_id: "${p_id}"
            - call: "POST /v1/order-lines/${b_line}/out-of-stock"
              payload: {}
              as: Picker
              as_user_id: "${p_id}"
          assert:
            - "OrderLine.${a_line}.status == SUBSTITUTED"
            - "OrderLine.${a_line}.final_line_cents == 300"
            - "OrderLine.${b_line}.status == OUT_OF_STOCK"
            - "OrderLine.${b_line}.final_line_cents == 0"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: tc_out_of_stock_refund_depth3
        grounds:
          - state_machines.OrderLine.PICKED_to_OUT_OF_STOCK
          - calculations.out_of_stock_refund
          - entities.Order.fields.refunded_total_cents
          - entities.Order.fields.payment_status
          - entities.Order.fields.net_captured_cents
        distinguishing_aspect: |
          Depth-3 chain from a single trigger (POST out-of-stock on a PICKED line of a STAGED+captured order):
          (1) OrderLine.status -> OUT_OF_STOCK and final_line_cents zeroed; (2) that zeroing causes a Refund
          record + Order.refunded_total_cents += 698; (3) the refunded_total change causes payment_status
          CAPTURED -> PARTIALLY_REFUNDED and net_captured_cents 1562 -> 864. Each link is caused by the prior.
        test_recipe:
          setup:
            - "Store, Customer (snap 800), Picker, slot cap 1. EBT banana(199 c/kg) + EBT milk(349 UNIT), tip 500."
            - "Banana picked 1.83->364, milk picked qty 2->698. Staged. Captured: ebt 800, card 762, net 1562."
          setup_api_calls:
            - call: "POST /v1/stores"
              payload: { name: "S", ebt_enabled: true }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /v1/customers"
              payload: { email: "c7@x.com", full_name: "C", date_of_birth: "1990-01-01", snap_ebt_balance_cents: 800 }
              as: PlatformAdmin
              captures: { c_id: $.data.id }
            - call: "POST /v1/pickers"
              payload: { store_id: "${s_id}", full_name: "P" }
              as: StoreOps
              captures: { p_id: $.data.id }
            - call: "POST /v1/products"
              payload: { store_id: "${s_id}", sku: "BAN", name: "Bananas", pricing_mode: "WEIGHT", unit_price_cents: 199, ebt_eligible: true }
              as: StoreOps
              captures: { ban_id: $.data.id }
            - call: "POST /v1/products"
              payload: { store_id: "${s_id}", sku: "MILK", name: "Milk", pricing_mode: "UNIT", unit_price_cents: 349, ebt_eligible: true }
              as: StoreOps
              captures: { milk_id: $.data.id }
            - call: "POST /v1/slots"
              payload: { store_id: "${s_id}", slot_type: "PICKUP", window_start: "2026-06-15T09:00:00Z", window_end: "2026-06-15T11:00:00Z", capacity: 1 }
              as: StoreOps
              captures: { slot_id: $.data.id, slot_v: $.data.version }
            - call: "POST /v1/orders"
              payload: { store_id: "${s_id}", customer_id: "${c_id}", slot_id: "${slot_id}", expected_slot_version: "${slot_v}", tip_cents: 500, lines: [ { product_id: "${ban_id}", requested_qty: 1, estimated_weight_kg: 1.50 }, { product_id: "${milk_id}", requested_qty: 2 } ] }
              as: Customer
              as_user_id: "${c_id}"
              captures: { ord_id: $.data.id }
            - call: "GET /v1/order-lines"
              payload: { order_id: "${ord_id}", product_id: "${milk_id}" }
              as: Picker
              as_user_id: "${p_id}"
              captures: { milk_line: "$.data[0].id" }
            - call: "GET /v1/order-lines"
              payload: { order_id: "${ord_id}", product_id: "${ban_id}" }
              as: Picker
              as_user_id: "${p_id}"
              captures: { ban_line: "$.data[0].id" }
            - call: "POST /v1/orders/${ord_id}/claim"
              payload: { window_start: "2026-06-15T08:00:00Z", window_end: "2026-06-15T08:45:00Z" }
