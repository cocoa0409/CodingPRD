              as: VenueOperator
              as_user_id: "${p1_id}"
              captures: { app_p1_id: "$.data.id" }
            - call: "POST /licensing/license-applications/${app_p1_id}/submit"
              payload: {}
              as: VenueOperator
              as_user_id: "${p1_id}"
            - call: "POST /licensing/license-applications/${app_p1_id}/review"
              payload: { disposition: "ACCEPT_FOR_REVIEW" }
              as: LicensingAdmin
            - call: "POST /licensing/license-applications/${app_p1_id}/review"
              payload: { disposition: "APPROVE" }
              as: LicensingAdmin
            - call: "GET /licensing/licenses"
              payload: { application_id: "${app_p1_id}" }
