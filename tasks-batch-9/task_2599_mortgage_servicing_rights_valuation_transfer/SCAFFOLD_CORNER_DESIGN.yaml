              as_user_id: admin-001
              captures: { e_bp: "$.data.error_id" }
            - call: "GET /msr/tape-lines/00000000-0000-0000-0000-0000000000c7"
              payload: {}
              as: PlatformAdmin
              as_user_id: admin-001
              captures: { e_tl: "$.data.error_id" }
            - call: "GET /msr/bids/00000000-0000-0000-0000-0000000000c8"
              payload: {}
              as: PlatformAdmin
              as_user_id: admin-001
              captures: { e_bid: "$.data.error_id" }
            - call: "GET /msr/purchase-agreements/00000000-0000-0000-0000-0000000000c9"
              payload: {}
              as: PlatformAdmin
              as_user_id: admin-001
              captures: { e_pa: "$.data.error_id" }
            - call: "GET /msr/approval-requests/00000000-0000-0000-0000-0000000000ca"
              payload: {}
              as: PlatformAdmin
              as_user_id: admin-001
              captures: { e_ar: "$.data.error_id" }
            - call: "GET /msr/servicing-transfers/00000000-0000-0000-0000-0000000000cb"
              payload: {}
              as: PlatformAdmin
              as_user_id: admin-001
              captures: { e_st: "$.data.error_id" }
            - call: "GET /msr/error-cases/00000000-0000-0000-0000-0000000000cc"
              payload: {}
              as: PlatformAdmin
