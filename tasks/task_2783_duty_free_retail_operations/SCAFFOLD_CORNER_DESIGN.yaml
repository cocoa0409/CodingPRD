          assert:
            - "the unfiltered-by-type list returns 3 movements in created_at ASC order: ${m1}, ${m2}, ${m3}"
            - "the limit 2 / offset 1 page returns exactly ${m2} and ${m3}"
            - "the SALE_ISSUE filter returns an EMPTY array, not the three RECEIPT rows"
            - "the pre-orders list returns an EMPTY array"
            - "BondedStockItem.${si_whisky}.on_hand_qty == 6"
            - "every list response wraps its array in the data key with error null"

