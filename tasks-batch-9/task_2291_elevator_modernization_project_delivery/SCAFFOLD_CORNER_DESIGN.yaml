scaffold_corner_design:

  - section: entities
    instances:
      - name: jurisdiction_creation_echoes_every_declared_input_field
        claim_type: creation
        grounds:
          - entities.Jurisdiction
          - endpoints[POST /jurisdictions]
          - response_envelope.success
        distinguishing_aspect: "A POST /jurisdictions with all nine declared inputs returns 201 and every input verbatim, plus the four common fields; the code-edition metadata is stored, not derived."
        test_recipe:
          setup:
            - "Empty database, logical clock at the default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemOperator
          trigger:
            - call: "POST /jurisdictions"
              payload: { name: "County of Marlow", code_edition_year: 2022, fire_service_required: true, seismic_zone: 3, door_protection_required: true, inspection_lead_days: 14, witness_test_required: true, reinspection_extension_hours: 48, permit_surcharge_pct: 0.0250 }
              as: SystemOperator
              captures: { j_id: $.data.id }
          assert:
            - "HTTP 201 with response_type == object"
            - "data.name == County of Marlow, code_edition_year == 2022, fire_service_required == true, seismic_zone == 3, door_protection_required == true"
            - "data.inspection_lead_days == 14, witness_test_required == true, reinspection_extension_hours == 48, permit_surcharge_pct == 0.0250"
            - "data.id is a UUID with no type prefix, data.version == 1, data.created_at == 2026-08-01T00:00:00.000Z, data.updated_at == data.created_at"
            - "meta.api_request_id and meta.api_request_timestamp are present on the envelope"

      - name: jurisdiction_omitted_optional_inputs_apply_declared_defaults
        claim_type: defaults
        grounds:
          - entities.Jurisdiction.fields.inspection_lead_days
          - entities.Jurisdiction.fields.witness_test_required
          - entities.Jurisdiction.fields.reinspection_extension_hours
          - entities.Jurisdiction.fields.permit_surcharge_pct
        distinguishing_aspect: "Only the five required inputs are sent; the four optional ones must fall back to their declared defaults 10 / false / 24 / 0.0000 rather than to null or zero."
        test_recipe:
          setup:
            - "Empty database, logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemOperator
          trigger:
            - call: "POST /jurisdictions"
              payload: { name: "City of Brentwood", code_edition_year: 2019, fire_service_required: false, seismic_zone: 0, door_protection_required: false }
              as: SystemOperator
              captures: { j_id: $.data.id }
          assert:
            - "HTTP 201 and data.inspection_lead_days == 10"
            - "data.witness_test_required == false"
            - "data.reinspection_extension_hours == 24"
            - "data.permit_surcharge_pct == 0.0000"
            - "GET /jurisdictions/${j_id} returns the same four defaulted values, so the defaults were persisted and not only rendered"

      - name: project_system_and_computed_fields_are_server_initialized
        claim_type: system_fields
        grounds:
          - entities.ModernizationProject.fields.status
          - entities.ModernizationProject.fields.car_count
          - entities.ModernizationProject.fields.approved_scope_value_cents
          - entities.ModernizationProject.fields.staging_committed_sqft
          - entities.ModernizationProject.fields.active_outage_count
          - entities.ModernizationProject.fields.downtime_posture
        distinguishing_aspect: "None of the six system/computed fields is an input; a freshly created project must read SURVEY / 0 / 0 / 0 / 0 / OPEN with version 1 even though the client supplied only business inputs."
        test_recipe:
          setup:
            - "One jurisdiction; logical clock at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemOperator
            - call: "POST /jurisdictions"
              payload: { name: "City of Brentwood", code_edition_year: 2019, fire_service_required: false, seismic_zone: 0, door_protection_required: false }
              as: SystemOperator
              captures: { j_id: $.data.id }
          trigger:
            - call: "POST /projects"
              payload: { jurisdiction_id: "${j_id}", building_name: "Brentwood Tower", occupancy_type: "OCCUPIED", contract_value_cents: 60000000, staging_area_sqft: 1200, max_concurrent_outages: 2 }
              as: ProjectManager
              captures: { p_id: $.data.id }
          assert:
            - "HTTP 201 and data.status == SURVEY"
            - "data.car_count == 0, approved_scope_value_cents == 0, staging_committed_sqft == 0, active_outage_count == 0"
            - "data.downtime_posture == OPEN"
            - "data.outage_buffer_hours == 4 and tenant_notice_lead_hours == 72, the declared defaults for the two omitted optional inputs"
            - "data.version == 1 and data.created_at == 2026-08-01T00:00:00.000Z"

      - name: car_count_reconciles_on_both_project_and_group_as_cars_are_added
        claim_type: computed_fields
        grounds:
          - entities.ModernizationProject.fields.car_count
          - entities.ElevatorGroup.fields.car_count
          - entities.ElevatorGroup.fields.cars_in_service
          - endpoints[POST /elevator-cars]
        distinguishing_aspect: "car_count is a derived counter on two entities at once; after two cars in one group and a third in a second group the project reads 3 while the groups read 2 and 1, and cars_in_service tracks car_count while no outage is active."
        test_recipe:
          setup:
            - "One jurisdiction and one project with two ElevatorGroups, both min_cars_in_service 0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemOperator
            - call: "POST /jurisdictions"
              payload: { name: "City of Brentwood", code_edition_year: 2019, fire_service_required: false, seismic_zone: 0, door_protection_required: false }
              as: SystemOperator
              captures: { j_id: $.data.id }
            - call: "POST /projects"
              payload: { jurisdiction_id: "${j_id}", building_name: "Brentwood Tower", occupancy_type: "OCCUPIED", contract_value_cents: 60000000, staging_area_sqft: 1200, max_concurrent_outages: 2 }
              as: ProjectManager
              captures: { p_id: $.data.id }
            - call: "POST /elevator-groups"
              payload: { project_id: "${p_id}", group_label: "BANK-A", min_cars_in_service: 0 }
              as: ProjectManager
              captures: { gA_id: $.data.id }
            - call: "POST /elevator-groups"
              payload: { project_id: "${p_id}", group_label: "BANK-B", min_cars_in_service: 0 }
              as: ProjectManager
              captures: { gB_id: $.data.id }
          trigger:
            - call: "POST /elevator-cars"
              payload: { project_id: "${p_id}", group_id: "${gA_id}", car_designation: "CAR-1", rated_load_lbs: 3500, controller_type_legacy: "RELAY", machine_type: "GEARLESS", duty_rank: 1 }
              as: ProjectManager
              captures: { c1_id: $.data.id }
            - call: "POST /elevator-cars"
              payload: { project_id: "${p_id}", group_id: "${gA_id}", car_designation: "CAR-2", rated_load_lbs: 3500, controller_type_legacy: "RELAY", machine_type: "GEARLESS", duty_rank: 2 }
              as: ProjectManager
              captures: { c2_id: $.data.id }
            - call: "POST /elevator-cars"
              payload: { project_id: "${p_id}", group_id: "${gB_id}", car_designation: "CAR-3", rated_load_lbs: 4000, controller_type_legacy: "MICROPROCESSOR", machine_type: "MRL_GEARLESS", duty_rank: 1 }
              as: ProjectManager
              captures: { c3_id: $.data.id }
          assert:
            - "Each POST returns 201 with work_status == SURVEY_PENDING, compliance_status == NOT_EVALUATED, condition_score == null, recommended_scope_tier == null, approved_scope_option_id == null"
            - "GET /projects/${p_id} reports car_count == 3"
            - "GET /elevator-groups/${gA_id} reports car_count == 2 and cars_in_service == 2"
            - "GET /elevator-groups/${gB_id} reports car_count == 1 and cars_in_service == 1"
            - "GET /projects/${p_id}/posture reports groups_below_floor == 0 because both floors are 0"

      - name: elevator_car_retrieval_returns_the_stored_row
        claim_type: retrieval
        grounds:
          - endpoints[GET /elevator-cars/{car_id}]
          - entities.ElevatorCar
        distinguishing_aspect: "GET /elevator-cars/{car_id} returns exactly the row created, including the two independent status dimensions, and is readable by every role."
        test_recipe:
          setup:
            - "One jurisdiction, one project, one group, one car."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemOperator
            - call: "POST /jurisdictions"
              payload: { name: "City of Brentwood", code_edition_year: 2019, fire_service_required: false, seismic_zone: 0, door_protection_required: false }
              as: SystemOperator
              captures: { j_id: $.data.id }
            - call: "POST /projects"
              payload: { jurisdiction_id: "${j_id}", building_name: "Brentwood Tower", occupancy_type: "OCCUPIED", contract_value_cents: 60000000, staging_area_sqft: 1200, max_concurrent_outages: 2 }
              as: ProjectManager
              captures: { p_id: $.data.id }
            - call: "POST /elevator-groups"
              payload: { project_id: "${p_id}", group_label: "BANK-A", min_cars_in_service: 0 }
              as: ProjectManager
              captures: { g_id: $.data.id }
            - call: "POST /elevator-cars"
              payload: { project_id: "${p_id}", group_id: "${g_id}", car_designation: "CAR-1", rated_load_lbs: 3500, controller_type_legacy: "SOLID_STATE_ANALOG", machine_type: "GEARED", duty_rank: 1 }
              as: ProjectManager
              captures: { c1_id: $.data.id }
          trigger:
            - call: "GET /elevator-cars/${c1_id}"
              as: SurveyTechnician
          assert:
            - "HTTP 200 with response_type == object"
            - "data.id == ${c1_id}, project_id == ${p_id}, group_id == ${g_id}, car_designation == CAR-1"
            - "data.rated_load_lbs == 3500, controller_type_legacy == SOLID_STATE_ANALOG, machine_type == GEARED, duty_rank == 1"
            - "data.work_status == SURVEY_PENDING and data.compliance_status == NOT_EVALUATED"
            - "data.version == 1"

      - name: elevator_car_listing_filters_by_work_status_with_pagination_fields
        claim_type: listing
        grounds:
          - endpoints[GET /elevator-cars]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With one surveyed car and one untouched car, the work_status filter partitions the two rows and the array envelope carries limit 10 / offset 0 / total_count / has_more."
        test_recipe:
          setup:
            - "One project with one group holding two cars; car 1 has a COUNTERSIGNED survey so it is SURVEYED, car 2 is still SURVEY_PENDING."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemOperator
            - call: "POST /jurisdictions"
              payload: { name: "City of Brentwood", code_edition_year: 2019, fire_service_required: false, seismic_zone: 0, door_protection_required: false }
              as: SystemOperator
              captures: { j_id: $.data.id }
            - call: "POST /projects"
              payload: { jurisdiction_id: "${j_id}", building_name: "Brentwood Tower", occupancy_type: "OCCUPIED", contract_value_cents: 60000000, staging_area_sqft: 1200, max_concurrent_outages: 2 }
              as: ProjectManager
              captures: { p_id: $.data.id }
            - call: "POST /elevator-groups"
              payload: { project_id: "${p_id}", group_label: "BANK-A", min_cars_in_service: 0 }
              as: ProjectManager
              captures: { g_id: $.data.id }
            - call: "POST /elevator-cars"
              payload: { project_id: "${p_id}", group_id: "${g_id}", car_designation: "CAR-1", rated_load_lbs: 3500, controller_type_legacy: "RELAY", machine_type: "GEARLESS", duty_rank: 1 }
              as: ProjectManager
              captures: { c1_id: $.data.id }
            - call: "POST /elevator-cars"
              payload: { project_id: "${p_id}", group_id: "${g_id}", car_designation: "CAR-2", rated_load_lbs: 3500, controller_type_legacy: "RELAY", machine_type: "GEARLESS", duty_rank: 2 }
              as: ProjectManager
              captures: { c2_id: $.data.id }
            - call: "POST /equipment-surveys"
              payload: { car_id: "${c1_id}", controller_condition: "GOOD", machine_condition: "GOOD", door_equipment_condition: "EXCELLENT" }
              as: SurveyTechnician
              as_user_id: "tech-001"
              captures: { s1_id: $.data.id }
            - call: "POST /equipment-surveys/${s1_id}/countersign"
              as: SurveyTechnician
              as_user_id: "tech-002"
          trigger:
            - call: "GET /elevator-cars?project_id=${p_id}&work_status=SURVEYED"
              as: ProjectManager
              captures: { first_car_id: "$.data[0].id" }
          assert:
            - "HTTP 200 with response_type == array"
            - "total_count == 1, has_more == false, limit == 10, offset == 0"
            - "The single row is ${c1_id} with work_status == SURVEYED and condition_score == 85.00"
            - "GET /elevator-cars?project_id=${p_id}&work_status=SURVEY_PENDING returns total_count == 1 and that row is ${c2_id}"
            - "GET /elevator-cars?project_id=${p_id} with no status filter returns total_count == 2"

      - name: get_scope_option_with_unknown_id_returns_not_found
        claim_type: not_found
        grounds:
          - validations[priority=3]
          - errors.ERR_NOT_FOUND
          - endpoints[GET /scope-options/{scope_option_id}]
        distinguishing_aspect: "A well-formed but unknown path UUID is a band-3 existence failure: 404 ERR_NOT_FOUND, never 400 and never an empty 200 object."
        test_recipe:
          setup:
            - "Empty database beyond the logical clock."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemOperator
          trigger:
            - call: "GET /scope-options/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              as: ProjectManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404 with response_type == error"
            - "data.error_id == ERR_NOT_FOUND and data.message is a non-empty string"
            - "GET /scope-options with no filter returns total_count == 0, confirming the id really does not exist"

      - name: post_projects_missing_staging_area_sqft_is_rejected_as_invalid_request
        claim_type: required_fields
        grounds:
          - validations[priority=8]
          - errors.ERR_INVALID_REQUEST
          - entities.ModernizationProject.fields.staging_area_sqft
        distinguishing_aspect: "staging_area_sqft has source input and no default, so omitting it is a band-8 ERR_INVALID_REQUEST (400) and no project row is created."
        test_recipe:
          setup:
            - "One jurisdiction."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemOperator
            - call: "POST /jurisdictions"
              payload: { name: "City of Brentwood", code_edition_year: 2019, fire_service_required: false, seismic_zone: 0, door_protection_required: false }
              as: SystemOperator
              captures: { j_id: $.data.id }
          trigger:
            - call: "POST /projects"
              payload: { jurisdiction_id: "${j_id}", building_name: "Brentwood Tower", occupancy_type: "OCCUPIED", contract_value_cents: 60000000, max_concurrent_outages: 2 }
              as: ProjectManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400 with data.error_id == ERR_INVALID_REQUEST"
            - "GET /projects?jurisdiction_id=${j_id} returns total_count == 0"

      - name: equipment_survey_with_undeclared_condition_enum_is_rejected
        claim_type: type_constraints
        grounds:
          - validations[priority=8]
          - errors.ERR_INVALID_REQUEST
          - entities.EquipmentSurvey.fields.controller_condition
        distinguishing_aspect: "controller_condition is closed over six values; MEDIOCRE is outside the set, so the request fails at band 8 before any car-state or scoring logic runs."
        test_recipe:
          setup:
            - "One project with one group and one car in SURVEY_PENDING."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemOperator
            - call: "POST /jurisdictions"
              payload: { name: "City of Brentwood", code_edition_year: 2019, fire_service_required: false, seismic_zone: 0, door_protection_required: false }
              as: SystemOperator
              captures: { j_id: $.data.id }
            - call: "POST /projects"
              payload: { jurisdiction_id: "${j_id}", building_name: "Brentwood Tower", occupancy_type: "OCCUPIED", contract_value_cents: 60000000, staging_area_sqft: 1200, max_concurrent_outages: 2 }
              as: ProjectManager
              captures: { p_id: $.data.id }
            - call: "POST /elevator-groups"
              payload: { project_id: "${p_id}", group_label: "BANK-A", min_cars_in_service: 0 }
              as: ProjectManager
              captures: { g_id: $.data.id }
            - call: "POST /elevator-cars"
              payload: { project_id: "${p_id}", group_id: "${g_id}", car_designation: "CAR-1", rated_load_lbs: 3500, controller_type_legacy: "RELAY", machine_type: "GEARLESS", duty_rank: 1 }
              as: ProjectManager
              captures: { c1_id: $.data.id }
          trigger:
            - call: "POST /equipment-surveys"
              payload: { car_id: "${c1_id}", controller_condition: "MEDIOCRE", machine_condition: "GOOD", door_equipment_condition: "GOOD" }
              as: SurveyTechnician
              as_user_id: "tech-001"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 400 with data.error_id == ERR_INVALID_REQUEST"
            - "GET /equipment-surveys?car_id=${c1_id} returns total_count == 0"
            - "ElevatorCar.${c1_id}.work_status is still SURVEY_PENDING and condition_score is still null"

      - name: elevator_car_creation_with_unknown_group_id_returns_not_found
        claim_type: parent_relationships
        grounds:
          - validations[priority=4]
          - errors.ERR_NOT_FOUND
          - entities.ElevatorCar.fields.group_id
        distinguishing_aspect: "group_id is a body foreign key, so an unresolvable value is a band-4 existence failure (404 ERR_NOT_FOUND), not a band-8 shape failure, and it outranks nothing else in the ladder."
        test_recipe:
          setup:
            - "One jurisdiction and one project with no groups."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemOperator
            - call: "POST /jurisdictions"
              payload: { name: "City of Brentwood", code_edition_year: 2019, fire_service_required: false, seismic_zone: 0, door_protection_required: false }
              as: SystemOperator
              captures: { j_id: $.data.id }
            - call: "POST /projects"
              payload: { jurisdiction_id: "${j_id}", building_name: "Brentwood Tower", occupancy_type: "OCCUPIED", contract_value_cents: 60000000, staging_area_sqft: 1200, max_concurrent_outages: 2 }
              as: ProjectManager
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /elevator-cars"
              payload: { project_id: "${p_id}", group_id: "8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", car_designation: "CAR-1", rated_load_lbs: 3500, controller_type_legacy: "RELAY", machine_type: "GEARLESS", duty_rank: 1 }
              as: ProjectManager
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404 with data.error_id == ERR_NOT_FOUND"
            - "GET /projects/${p_id} still reports car_count == 0"
            - "GET /elevator-cars?project_id=${p_id} returns total_count == 0"

  - section: state_machines
    instances:
      - name: countersign_promotes_provisional_score_and_advances_car_and_project
        claim_type: valid_transition
        grounds:
          - state_machines.EquipmentSurvey.SUBMITTED_to_COUNTERSIGNED
          - state_machines.ElevatorCar.SURVEY_PENDING_to_SURVEYED
          - state_machines.ModernizationProject.SURVEY_to_SCOPING
          - endpoints[POST /equipment-surveys/{survey_id}/countersign]
        distinguishing_aspect: "One countersignature moves three entities at once: the survey to COUNTERSIGNED with a binding final_score, the car to SURVEYED with the score and tier copied down, and the project out of SURVEY on its first countersignature."
        test_recipe:
          setup:
            - "One project with one group and one car; one SUBMITTED EquipmentSurvey by tech-001 rating controller GOOD, machine GOOD, door EXCELLENT."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemOperator
            - call: "POST /jurisdictions"
              payload: { name: "City of Brentwood", code_edition_year: 2019, fire_service_required: false, seismic_zone: 0, door_protection_required: false }
              as: SystemOperator
              captures: { j_id: $.data.id }
            - call: "POST /projects"
              payload: { jurisdiction_id: "${j_id}", building_name: "Brentwood Tower", occupancy_type: "OCCUPIED", contract_value_cents: 60000000, staging_area_sqft: 1200, max_concurrent_outages: 2 }
              as: ProjectManager
              captures: { p_id: $.data.id }
            - call: "POST /elevator-groups"
              payload: { project_id: "${p_id}", group_label: "BANK-A", min_cars_in_service: 0 }
              as: ProjectManager
              captures: { g_id: $.data.id }
            - call: "POST /elevator-cars"
              payload: { project_id: "${p_id}", group_id: "${g_id}", car_designation: "CAR-1", rated_load_lbs: 3500, controller_type_legacy: "RELAY", machine_type: "GEARLESS", duty_rank: 1 }
              as: ProjectManager
              captures: { c1_id: $.data.id }
            - call: "POST /equipment-surveys"
              payload: { car_id: "${c1_id}", controller_condition: "GOOD", machine_condition: "GOOD", door_equipment_condition: "EXCELLENT" }
              as: SurveyTechnician
              as_user_id: "tech-001"
              captures: { s1_id: $.data.id }
            - call: "GET /projects/${p_id}"
              as: ProjectManager
              captures: { pv_before: $.data.version }
          trigger:
            - call: "POST /equipment-surveys/${s1_id}/countersign"
              as: SurveyTechnician
              as_user_id: "tech-002"
          assert:
            - "HTTP 200 with data.status == COUNTERSIGNED and data.countersigned_by_user_id == tech-002"
            - "data.surveyed_by_user_id == tech-001 (unchanged) and data.final_score == 85.00"
            - "data.recommended_scope_tier == CONTROLLER_ONLY"
            - "ElevatorCar.${c1_id}.work_status == SURVEYED, condition_score == 85.00, recommended_scope_tier == CONTROLLER_ONLY"
            - "ElevatorCar.${c1_id}.compliance_status is still NOT_EVALUATED - the compliance dimension is untouched by a survey"
            - "ModernizationProject.${p_id}.status == SCOPING and its version is exactly ${pv_before} + 1"

      - name: equipment_survey_starts_in_submitted_with_advisory_score_only
        claim_type: initial_state
        grounds:
          - state_machines.EquipmentSurvey.initial_state
          - entities.EquipmentSurvey.fields.provisional_score
          - entities.EquipmentSurvey.fields.final_score
        distinguishing_aspect: "A new survey is SUBMITTED with provisional_score computed on the OBSERVED_ONLY basis (82.75 for EXCELLENT / GOOD / FAIR), final_score still null, and the car untouched at SURVEY_PENDING - the advisory score must not leak onto the car."
        test_recipe:
          setup:
            - "One project with one group and one car in SURVEY_PENDING."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
