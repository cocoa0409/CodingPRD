            - call: "POST /claims/${claim_id}/assess"
              payload: { estimated_repair_cost_cents: 20000 }
              as: Dispatcher
            - call: "POST /_clock/set"
              payload: { to_iso8601: "2026-02-01T08:00:00Z" }
              as: PlatformAdmin
            - call: "POST /claims/${claim_id}/dispatch"
              payload: { technician_id: "tech-Q", scheduled_utc: "2026-02-01T09:00:00Z" }
              as: Dispatcher
            - call: "GET /dispatches"
              payload: { claim_id: "${claim_id}" }
