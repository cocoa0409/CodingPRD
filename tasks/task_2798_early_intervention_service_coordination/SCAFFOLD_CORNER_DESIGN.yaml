              as: ProgramAdmin
            - call: "POST /ei/service-visits"
              payload: { provider_authorization_id: "${auth_id}", scheduled_start: "2026-04-02T15:00:00Z", scheduled_end: "2026-04-02T15:45:00Z", setting_code: "HOME", makeup_for_visit_id: "${v2_id}" }
              as: ProgramAdmin
