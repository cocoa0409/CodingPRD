              as: PlatformAdmin
              captures: { m_id: $.data.id }
            - call: "POST /field-force/territories/${t2}/representatives"
              payload: { employee_id: "E9303", full_name: "Cust Wes", hire_date: "2022-01-01T00:00:00Z", manager_rep_id: "${m_id}" }
              as: PlatformAdmin
              captures: { c2_id: $.data.id }
            - call: "POST /field-force/products"
              payload: { ndc_code: "0006-0012", brand_name: "Dermalex", controlled: false, per_visit_max_units: 10, annual_max_units_per_prescriber: 100, storage_temp_min_c: 2.0, storage_temp_max_c: 8.0 }
              as: PlatformAdmin
              captures: { p_id: $.data.id }
            - call: "POST /field-force/products/${p_id}/sample-lots"
