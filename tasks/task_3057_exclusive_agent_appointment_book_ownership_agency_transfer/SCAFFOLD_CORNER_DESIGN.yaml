    grounds:
    - entities.MarketingCampaign.fields.participation_posture
    - endpoints.PUT_/agency-network/agencies/{id}/marketing-campaigns/{cid}
    distinguishing_aspect: Participation_posture is computed from the parent agency and cannot be set by the client; a PUT smuggling FROZEN leaves the derived value intact.
    test_recipe:
      setup:
      - "Logical clock 2026-09-01T00:00:00Z. Agency Cali ACTIVE with one PLANNED campaign."
      setup_api_calls:
      - call: POST /agency-network/_clock/set_current_utc
