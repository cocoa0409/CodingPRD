              as: QualityEngineer
              captures: { inst_id: $.data.id, inst_v: $.data.version }
            - call: "POST /instruments/${inst_id}/calibration-events"
              payload: { standard_id: "${std_id}", scheduled_epoch: 5, expected_instrument_version: "${inst_v}" }
              as: Technician
              captures: { ev_bad: $.data.id }
            - call: "POST /calibration-events/${ev_bad}/measurement-points"
              payload: { point_label: "P1", nominal: 25.0, tol_plus: 0.05, tol_minus: 0.05, as_found_value: 25.40, as_left_value: 25.40 }
              as: Technician
            - call: "POST /calibration-events/${ev_bad}/start"
              payload: {}
              as: Technician
            - call: "POST /calibration-events/${ev_bad}/finalize"
              payload: {}
              as: Technician
            - call: "GET /instruments/${inst_id}"
              payload: {}
              as: QualityEngineer
              captures: { inst_v2: $.data.version }
            - call: "POST /instruments/${inst_id}/calibration-events"
              payload: { standard_id: "${std_id}", scheduled_epoch: 6, expected_instrument_version: "${inst_v2}" }
              as: Technician
              captures: { ev2: $.data.id }
            - call: "POST /calibration-events/${ev2}/measurement-points"
              payload: { point_label: "P1", nominal: 25.0, tol_plus: 0.05, tol_minus: 0.05, as_found_value: 25.00 }
              as: Technician
          trigger:
            - call: "POST /calibration-events/${ev2}/start"
              payload: {}
              as: Technician
              captures: { err: $.data.error_id }
          assert:
            - "start response status code == 409"
            - "start response data.error_id == ERR_INSTRUMENT_NOT_ACTIVE"

      - name: cert_verify_depends_on_event_finalized
        grounds:
          - state_machines.CalibrationCertificate.ISSUED_to_VERIFIED
          - entities.CalibrationEvent.fields.status
          - validations[priority=9]
        distinguishing_aspect: |
          CalibrationCertificate→CalibrationEvent pair (different from the
          Event→Instrument pair): verifying an ISSUED certificate is rejected with
          ERR_EVENT_NOT_FINALIZED when the owning event is still IN_PROGRESS, a
          cross-entity dependency on the event's state.
        test_recipe:
          setup:
            - "Accredited vendor; traceable standard; IN_PROGRESS event (external, vendor-linked); an ISSUED certificate for that event."
          setup_api_calls:
            - call: "POST /calibration-standards"
              payload: { name: "GB-CE2", nist_test_number: "NIST-12", nominal_value: 25.0, standard_unit: "mm", uncertainty: 0.001, certified_through_epoch: 9999 }
              as: Metrologist
              captures: { std_id: $.data.id }
            - call: "POST /calibration-vendors"
              payload: { name: "AccLab", accreditation_body: "A2LA", accreditation_number: "A2LA-001", accredited_through_epoch: 9999 }
              as: Metrologist
              captures: { vend_id: $.data.id }
            - call: "POST /instruments"
