      - name: authorization_revoke_is_shared_by_privacy_officer_and_the_owning_requester
        claim_type: shared_operation
        grounds:
          - roles.PrivacyOfficer.shared_operations
          - roles.Requester.shared_operations
          - endpoints.POST_/roi/authorizations/{id}/revoke
          - validations.priority_3
        distinguishing_aspect: >
          A route with two roles in its list has to satisfy both, and each for a
          different reason: the PrivacyOfficer passes because of its role alone, the
          owning Requester passes only because ownership also holds, and a THIRD
          party who is a perfectly valid Requester is refused by priority 3 on an
          authorization it does not own. The second revoke of the same authorization
          then shows state beats sharing.
        test_recipe:
