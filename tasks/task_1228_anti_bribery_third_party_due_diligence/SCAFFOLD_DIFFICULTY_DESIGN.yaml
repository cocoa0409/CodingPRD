            - { call: "POST /compliance/risk-scoring-policies/${pol_id}/activate", payload: { expected_policy_version: "${pol_v}" }, as: ComplianceAdmin }
            - { call: "POST /compliance/third-parties", payload: { legal_name: "TP-A", country_code: "CH", industry: "TECHNOLOGY", government_touchpoint: "NONE" }, as: BusinessSponsor, as_user_id: "u_sp1", captures: { tpa: $.data.id } }
            - { call: "POST /compliance/third-parties/${tpa}/submit", payload: {}, as: BusinessSponsor, as_user_id: "u_sp1" }
            - { call: "GET /compliance/third-parties/${tpa}/screening-checks", as: ComplianceOfficer, captures: { a0: "$.data[0].id", a1: "$.data[1].id", a2: "$.data[2].id" } }
