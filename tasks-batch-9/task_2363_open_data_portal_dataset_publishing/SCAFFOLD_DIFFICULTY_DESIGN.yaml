              captures: { pl_id: "$.data.id" }
            - call: "POST /open-data/publication-pipelines/${pl_id}/arm"
              as: DataCoordinator
              as_user_id: "${dept_id}"
            - call: "POST /open-data/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T09:00:00Z" }
              as: PortalAdmin
            - call: "POST /open-data/pipeline-runs"
              payload: { pipeline_id: "${pl_id}", scheduled_for_utc: "2026-08-01T09:00:00Z" }
              as: PortalAdmin
              captures: { run1_id: "$.data.id" }
            - call: "POST /open-data/pipeline-runs/${run1_id}/start"
              as: PortalAdmin
          trigger:
            - call: "POST /open-data/pipeline-runs/${run1_id}/report-success"
              payload: { rows_ingested: 45000 }
              as: PortalAdmin
            - call: "GET /open-data/departments/${dept_id}/scorecard"
              as: PortalAdmin
          assert:
            - "PublicationPipeline.${pl_id}.escrow_required_units == 2.00 (ceil(30/30) * 2)"
            - "PipelineRun.${run1_id}.total_charge_credits == 19.00, escrow_drawn_units == 2.00, balance_drawn_units == 17.00"
            - "PublicationPipeline.${pl_id}.escrowed_credit_units == 0.00 and status is still ARMED"
            - "scorecard credits_issued_units == 100.00, credit_balance_units == 81.00, credits_escrowed_units == 0.00, credits_consumed_units == 19.00"
            - "scorecard credit_ledger_balanced == true (81.00 + 0.00 + 19.00 == 100.00)"
            - "Dataset.${ds_id}.live_row_count == 45000 and next_due_at == 2026-08-31T09:00:00Z (MONTHLY cadence from the settlement time)"

