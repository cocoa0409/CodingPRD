            - call: "POST /affiliates/${aff6_id}/agreements"
              payload: { term_start_date: "2026-01-01", term_end_date: "2026-12-31", facility_standard_tier: "TIER_2", club_reimbursement_cap_cents: 900000, minimum_active_players: 0 }
              as: ComplianceOfficer
              as_user_id: "u-comp-1"
              captures: { agr6_id: $.data.id }
            - call: "POST /agreements/${agr6_id}/disposition"
              payload: { action: "SUBMIT" }
              as: AffiliateOperator
              as_user_id: "${aff6_id}"
            - call: "POST /agreements/${agr6_id}/disposition"
              payload: { action: "ACTIVATE" }
              as: ComplianceOfficer
              as_user_id: "u-comp-1"
            - call: "POST /affiliates/${aff6_id}/facility-reviews"
              payload: { category: "WEIGHT_ROOM", review_date: "2026-04-01", score: 84 }
              as: ComplianceOfficer
              as_user_id: "u-comp-1"
              captures: { rev6: $.data.id, lvl6: $.data.deficiency_level, due6a: $.data.remediation_due_date }
          trigger:
            - call: "POST /facility-reviews/${rev6}/disposition"
              payload: { action: "SUBMIT_REMEDIATION", note: "new racks installed" }
              as: AffiliateOperator
              as_user_id: "${aff6_id}"
              captures: { st6a: $.data.status }
            - call: "POST /facility-reviews/${rev6}/disposition"
              payload: { action: "CLOSE" }
              as: ComplianceOfficer
