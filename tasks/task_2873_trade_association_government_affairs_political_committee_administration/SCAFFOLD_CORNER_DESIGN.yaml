      - name: disbursing_a_contribution_that_was_never_approved_rejected
        claim_type: Violation -> Error
        grounds:
          - validations[priority=8].error_id
          - state_machines.PacContribution[BOARD_APPROVED -> DISBURSED].preconditions
        distinguishing_aspect: "Disbursement is declared only from BOARD_APPROVED, so paying a PENDING_BOARD row is 409 ERR_CONTRIBUTION_NOT_APPROVED and none of the four fund accumulators or three candidate accumulators move."
        test_recipe:
          setup:
            - "FEDERAL 2026 fund with min_reserve_cents 0 and no receipts; FEDERAL INCUMBENT candidate scoring 80.50; one PENDING_BOARD contribution of 100000."
