              payload: { station_id: "${station_id}", event_code: "TOR", originator_sequence: "KSWEA-0104", fips_codes: ["20173"], received_at: "2026-08-12T11:57:59Z" }
              captures: { a_lower_out: "$.data.id" }
            - call: "POST /alert-events"
              as: StationEngineer
              as_user_id: eng-1
              payload: { station_id: "${station_id}", event_code: "TOR", originator_sequence: "KSWEA-0105", fips_codes: ["20173"], received_at: "2026-08-12T12:10:00Z" }
              captures: { a_fips_disjoint: "$.data.id" }
            - call: "GET /alert-events/${a_upper_in}"
              as: ComplianceAdmin
              as_user_id: adm-1
            - call: "GET /alert-events/${a_fips_disjoint}"
              as: ComplianceAdmin
              as_user_id: adm-1
          assert:
            - "a_upper_in (received_at 12:32:00Z == 12:00:00Z + 1800 s + 120 s, the inclusive upper bound): relay_state == SUPPRESSED_DUPLICATE, suppression_source == WIRELESS_NOTICE, suppression_reference_alert_id == null"
            - "a_upper_in also proves the selector was skipped: matched_relay_rule_id == null, relay_class_applied == NONE, forward_delay_seconds_applied == 0 even though rr_state matches TOR statewide"
            - "a_upper_out (12:32:01Z, one second past the closed upper bound): relay_state == RELAY_PENDING, suppression_source == NONE, matched_relay_rule_id == ${rr_state}, relay_class_applied == OPTIONAL, forward_delay_seconds_applied == 25"
            - "a_lower_in (11:58:00Z == 12:00:00Z - 120 s, the inclusive lower bound): SUPPRESSED_DUPLICATE / WIRELESS_NOTICE / null reference — the buffer is symmetric and applies BEFORE wea_sent_at too"
            - "a_lower_out (11:57:59Z, one second before the lower bound): RELAY_PENDING / NONE / matched_relay_rule_id == ${rr_state}"
            - "a_fips_disjoint (12:10:00Z, comfortably inside the window) is NOT suppressed: suppression_source == NONE, relay_state == RELAY_PENDING — intersection(['20209'], ['20173']) is empty, so the interval test alone is not sufficient"
            - "no probe interfered with another: each used its own originator_sequence, so phase A's pool (same station + sequence + event_code) was empty for all five"
            - "GET /alert-events/${a_upper_in} and GET /alert-events/${a_fips_disjoint} echo the same values in the same request cycle (consistency_model immediate)"

      - name: station_repeat_phase_a_half_open_window_ignores_fips_and_picks_latest_reference
        grounds:
          - "§1.3 calculations.duplicate_suppression_window PHASE A: 'window_A = [t - STATION_DEDUP_SECONDS, t)  # lower bound inclusive, upper bound exclusive', 'no buffer, no FIPS test'"
          - "§1.3 PHASE A pool 'AlertEvent rows with the same station_id, the same originator_sequence and the same event_code, any relay_state' and 'reference = max(candidates_A by received_at); tie-break created_at ASC'"
          - "§1.3 constants STATION_DEDUP_SECONDS 900"
          - "§1.1 AlertEvent.suppression_reference_alert_id (self-referential FK) and §1.5 GET /alert-events filter suppression_reference_alert_id"
        distinguishing_aspect: "Phase A's interval is half-open in the opposite sense from phase B: a predecessor exactly 900 s earlier is inside the window, one 901 s earlier is not, and a predecessor at the SAME instant as the new alert is NOT a duplicate (upper bound exclusive) — and unlike phase B the FIPS sets are never compared, while the reference is the LATEST candidate even when that candidate is itself already SUPPRESSED_DUPLICATE."
        test_recipe:
          setup:
            - "Clock 2026-08-12T13:00:00Z; plan KS 2026-R1 activated with mandatory_relay_event_codes []; station KWEA; statewide OPTIONAL rule rr_state for TOR, fips_codes [], forward_delay_seconds 25."
            - "No WirelessAlertNotice rows exist at all, so phase B can never fire and every non-suppression below is attributable to phase A."
            - "Five independent originator_sequences, each with its own baseline alert at 2026-08-12T12:00:00Z: KSREP-0201 (lower bound), KSREP-0202 (one second outside), KSREP-0203 (same instant), KSREP-0204 (disjoint FIPS), KSREP-0205 (latest-reference chain)."
