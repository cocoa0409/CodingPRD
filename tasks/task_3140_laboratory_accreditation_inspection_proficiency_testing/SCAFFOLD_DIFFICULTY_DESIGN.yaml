              payload: { shipment_id: "${sh_id}", collected_at: "2026-09-02T00:00:00Z", analyte_scores: [{ name: "glucose", score: 90 }, { name: "sodium", score: 85 }, { name: "potassium", score: 80 }, { name: "chloride", score: 80 }, { name: "calcium", score: 79 }] }
              as: LaboratoryDirector
              as_user_id: "${lab_id}"
              captures: { res_id: $.data.id }
          assert:
            - "PTResult.${res_id}.event_score == 80.0 (4 of 5 pass, round_half_up(100*4/5, 1))"
            - "PTResult.${res_id}.event_evaluation == SATISFACTORY (>= 80.0 is inclusive; calcium's 79 is on a NON-critical analyte so no critical failure)"
