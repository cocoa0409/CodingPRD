# =============================================================================
# SCAFFOLD.yaml — Reliability Standard Compliance Audit & Violation Mitigation
# (North American Electric Reliability Corporation style compliance system)
# §1.0–§1.7 only. Difficulty design and corner design live in sibling files.
# =============================================================================

scenario: |
  Reliability Standard Compliance Audit & Violation Mitigation (North American
  Electric Reliability Corporation): registration of entities by function with
  applicable standard sets determined by registration type, compliance monitoring
  through scheduled audits, self-certifications, spot checks and self-reports,
  evidence retention requirements demonstrating continuous compliance rather than
  point-in-time, violation risk factor and severity level assessment feeding
  penalty determination, mitigation plan submission with milestones and completion
  verification, self-logging programs for minimal-risk issues with periodic review
  rather than formal processing, critical infrastructure protection standards with
  asset categorization and access control evidence, appeals and regional entity
  oversight with federal review

domain_name: reliability-compliance-audit
api_prefix: /compliance

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# Complexity Profile (§0)
# =============================================================================
complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: multi_party_negotiation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - derived_field_reconciliation
    - ops_run_checkpoint
  entity_topology: hybrid
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: RegisteredEntity
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Registered legal name of the entity" }
      - { name: registration_functions, type: array, source: input, description: "List of function codes the entity registers under", constraints: "non-empty subset of {GO, GOP, TO, TOP, TP, BA, RC, IA, PC, DP, LSE, RP}" }
      - { name: applicable_standards, type: array, source: computed, description: "Union of STANDARD_LIBRARY entries for every code in registration_functions; recomputed whenever registration_functions changes or when PATCH /compliance/registrations/{id} runs; each element is {standard_id, standard_code}" }
      - { name: compliance_status, type: enum, source: computed, description: "Derived posture field; transitions ACTIVE->RESTRICTED when a confirmed penalty on this entity is unsettled and current clock >= Penalty.due_date; RESTRICTED->ACTIVE when the outstanding penalty is settled; clock sweep also applies it", constraints: "ACTIVE | RESTRICTED" }
      - { name: enrollment_self_logging, type: boolean, source: input, default: false, description: "Whether the entity is enrolled in the self-logging program (checked when registering self-logged exceptions)" }
      - { name: applicable_standard_count, type: integer, source: computed, description: "count(applicable_standards); kept in sync by the same recomputation that writes applicable_standards" }
      - { name: open_violation_count, type: integer, source: computed, description: "count of Violation rows for this entity whose status is in {OPEN, MITIGATION_SUBMITTED, MITIGATION_IN_PROGRESS, APPEALED}; recomputed on every Violation create/status change" }
      - { name: unresolved_appeal_count, type: integer, source: computed, description: "count of Appeal rows for this entity whose status is APPEAL_PENDING_REVIEW" }

  - name: Engagement
    parent: null
    common_fields: true
    fields:
      - { name: entity_id, type: string, source: input, description: "FK -> RegisteredEntity.id; monitored entity" }
      - { name: engagement_type, type: enum, source: input, description: "AUDIT | SPOT_CHECK | SELF_CERTIFICATION", constraints: "AUDIT | SPOT_CHECK | SELF_CERTIFICATION" }
      - { name: standard_ids, type: array, source: input, description: "Non-empty list of standard ids in scope" }
      - { name: period_start, type: datetime, source: input, description: "Start of the monitored compliance period (ISO8601)" }
      - { name: period_end, type: datetime, source: input, description: "End of the monitored compliance period; must be > period_start" }
      - { name: status, type: enum, source: system, description: "SCHEDULED -> IN_PROGRESS -> COMPLETED; CANCELLED reachable from SCHEDULED or IN_PROGRESS", constraints: "SCHEDULED | IN_PROGRESS | COMPLETED | CANCELLED" }
      - { name: coverage_fraction, type: number, source: computed, description: "Fraction of the monitored period covered by SUBMITTED or ACCEPTED EvidenceArtifact coverage windows for the in-scope standards; recomputed after every covered_period_change on an artifact in scope" }

  - name: EvidenceArtifact
    parent: null
    common_fields: true
    fields:
      - { name: engagement_id, type: string, source: input, description: "FK -> Engagement.id; engagement this evidence supports" }
      - { name: standard_id, type: string, source: input, description: "Standard id this artifact demonstrates compliance for" }
      - { name: artifact_kind, type: enum, source: input, description: "OPERATING_RECORD | ACCESS_LOG | MAINTENANCE_RECORD", constraints: "OPERATING_RECORD | ACCESS_LOG | MAINTENANCE_RECORD" }
      - { name: coverage_start, type: datetime, source: input, description: "Start of the coverage window the artifact attests (ISO8601)" }
      - { name: coverage_end, type: datetime, source: input, description: "End of the coverage window; must be > coverage_start" }
      - { name: submitted_at, type: datetime, source: system, description: "Server-stamped submission time (current logical clock)" }
      - { name: status, type: enum, source: system, description: "SUBMITTED -> ACCEPTED | REJECTED", constraints: "SUBMITTED | ACCEPTED | REJECTED" }
      - { name: review_note, type: string, source: input, default: "", description: "Optional reviewer note recorded at accept/reject time" }
      - { name: cip_asset_id, type: string, source: input, default: null, description: "FK -> CIPAsset.id; required when artifact_kind == ACCESS_LOG; null otherwise" }

  - name: SelfReport
    parent: null
    common_fields: true
    fields:
      - { name: entity_id, type: string, source: input, description: "FK -> RegisteredEntity.id; reporting entity (must equal caller)" }
      - { name: standard_id, type: string, source: input, description: "Standard id self-reported as violated; must belong to entity.applicable_standards" }
      - { name: description, type: string, source: input, description: "Narrative description of the potential noncompliance" }
      - { name: occurred_at, type: datetime, source: input, description: "When the noncompliance occurred (must be <= current clock)" }
      - { name: status, type: enum, source: system, description: "RECEIVED -> TRIAGED -> CONFIRMED | DISMISSED", constraints: "RECEIVED | TRIAGED | CONFIRMED | DISMISSED" }

  - name: Violation
    parent: null
    common_fields: true
    fields:
      - { name: entity_id, type: string, source: input, description: "FK -> RegisteredEntity.id; violating entity" }
      - { name: standard_id, type: string, source: input, description: "Standard id violated" }
      - { name: source_type, type: enum, source: input, description: "AUDIT | SPOT_CHECK | SELF_REPORT | SELF_LOG", constraints: "AUDIT | SPOT_CHECK | SELF_REPORT | SELF_LOG" }
      - { name: source_engagement_id, type: string, source: input, default: null, description: "FK -> Engagement.id; required when source_type is AUDIT or SPOT_CHECK; engagement must be COMPLETED" }
      - { name: source_self_report_id, type: string, source: input, default: null, description: "FK -> SelfReport.id; required when source_type == SELF_REPORT; self-report must be CONFIRMED" }
      - { name: violation_start, type: datetime, source: input, description: "Start of violation interval (ISO8601)" }
      - { name: violation_end, type: datetime, source: input, description: "End of violation interval; must be > violation_start" }
      - { name: violation_risk_factor, type: enum, source: input, description: "Risk factor to reliability of the bulk power system", constraints: "MINIMAL | MODERATE | SERIOUS" }
      - { name: severity_level, type: enum, source: input, description: "Assessed severity level", constraints: "LOWER | MODERATE | HIGH | SEVERE" }
      - { name: status, type: enum, source: system, description: "OPEN -> MITIGATION_SUBMITTED <-> MITIGATION_IN_PROGRESS -> MITIGATION_COMPLETE -> CLOSED; APPEALED from OPEN/MITIGATION_SUBMITTED/MITIGATION_IN_PROGRESS; CLOSED from APPEALED on appeal grant; DISMISSED from OPEN on SELF_LOG qualification", constraints: "OPEN | MITIGATION_SUBMITTED | MITIGATION_IN_PROGRESS | MITIGATION_COMPLETE | APPEALED | CLOSED | DISMISSED" }
      - { name: proposed_penalty, type: number, source: computed, description: "Penalty computed by propose_penalty at OPEN; only final when status in {OPEN, APPEALED}" }
      - { name: final_penalty, type: number, source: computed, description: "Penalty recomputed by final_penalty at CLOSED; null until closed" }
      - { name: is_self_logging_qualified, type: boolean, source: computed, description: "true only when source_type == SELF_LOG AND violation_risk_factor == MINIMAL AND severity_level == LOWER; set at creation" }

  - name: MitigationPlan
    parent: null
    common_fields: true
    fields:
      - { name: violation_id, type: string, source: input, description: "FK -> Violation.id; violation being mitigated (1:1)" }
      - { name: description, type: string, source: input, description: "Plan narrative" }
      - { name: submitted_at, type: datetime, source: system, description: "Server-stamped submission time" }
      - { name: status, type: enum, source: system, description: "DRAFT -> SUBMITTED -> APPROVED -> REJECTED -> VERIFIED; APPROVED -> REJECTED is a resubmission loop", constraints: "DRAFT | SUBMITTED | APPROVED | REJECTED | VERIFIED" }

  - name: Milestone
    parent: MitigationPlan
    common_fields: true
    fields:
      - { name: plan_id, type: string, source: system, description: "FK -> MitigationPlan.id; owning plan" }
      - { name: title, type: string, source: input, description: "Milestone title" }
      - { name: due_date, type: datetime, source: input, description: "Scheduled completion date; must be > clock now at creation" }
      - { name: completed_at, type: datetime, source: system, default: null, description: "Server-stamped completion time when marked complete" }
      - { name: status, type: enum, source: system, description: "PENDING -> COMPLETED; PENDING -> MISSED (clock sweep); MISSED -> COMPLETED (late completion)", constraints: "PENDING | COMPLETED | MISSED" }

  - name: SelfLogEntry
    parent: null
    common_fields: true
    fields:
      - { name: entity_id, type: string, source: input, description: "FK -> RegisteredEntity.id; enrolled entity (must equal caller)" }
      - { name: standard_id, type: string, source: input, description: "Standard id of the logged minimal-risk exception; must belong to entity.applicable_standards" }
      - { name: exception_note, type: string, source: input, description: "Description of the minimal-risk exception" }
      - { name: logged_at, type: datetime, source: system, description: "Server-stamped log time" }
      - { name: period_id, type: string, source: input, default: null, description: "FK -> ReviewPeriod.id; explicit review period at registration; if null the system attaches the nearest unclosed period by open_at" }
      - { name: status, type: enum, source: system, description: "LOGGED -> REVIEWED_OK | ESCALATED", constraints: "LOGGED | REVIEWED_OK | ESCALATED" }

  - name: ReviewPeriod
    parent: null
    common_fields: true
    fields:
      - { name: open_at, type: datetime, source: system, description: "Server-stamped open time (clock at open)" }
      - { name: closed_at, type: datetime, source: system, default: null, description: "Server-stamped close time" }
      - { name: status, type: enum, source: system, description: "OPEN -> REVIEWING -> CLOSED", constraints: "OPEN | REVIEWING | CLOSED" }
      - { name: entry_count, type: integer, source: computed, description: "count of SelfLogEntry rows with period_id == this period" }
      - { name: reviewed_ok_count, type: integer, source: computed, description: "count of entries in this period with status == REVIEWED_OK" }
      - { name: escalated_count, type: integer, source: computed, description: "count of entries in this period with status == ESCALATED" }

  - name: CIPAsset
    parent: null
    common_fields: true
    fields:
      - { name: entity_id, type: string, source: input, description: "FK -> RegisteredEntity.id; owning entity" }
      - { name: asset_name, type: string, source: input, description: "Asset name" }
      - { name: impact_rating, type: enum, source: input, description: "Impact categorization; HIGH implies BES cyber asset", constraints: "HIGH | MEDIUM | LOW" }
      - { name: is_bes_cyber_asset, type: boolean, source: computed, description: "true iff impact_rating == HIGH; drives access-log evidence obligations" }
      - { name: status, type: enum, source: system, description: "ACTIVE -> DECOMMISSIONED (one-way)", constraints: "ACTIVE | DECOMMISSIONED" }

  - name: AccessGrant
    parent: null
    common_fields: true
    fields:
      - { name: asset_id, type: string, source: input, description: "FK -> CIPAsset.id; asset access is granted to" }
      - { name: grantee_badge, type: string, source: input, description: "Opaque badge identifier of the person granted access" }
      - { name: scope, type: enum, source: input, description: "PHYSICAL | ELECTRONIC", constraints: "PHYSICAL | ELECTRONIC" }
      - { name: granted_at, type: datetime, source: system, description: "Server-stamped grant time" }
      - { name: revoked_at, type: datetime, source: system, default: null, description: "Server-stamped revocation time" }
      - { name: status, type: enum, source: system, description: "ACTIVE -> REVOKED (one-way)", constraints: "ACTIVE | REVOKED" }

  - name: Penalty
    parent: null
    common_fields: true
    fields:
      - { name: violation_id, type: string, source: input, description: "FK -> Violation.id; 1:1 with violation, created when penalty is issued" }
      - { name: base_amount, type: number, source: computed, description: "Base penalty from propose_penalty" }
      - { name: adjustment_factor, type: number, source: computed, description: "Compound aggravating/mitigating factor from propose_penalty; rounds to 4dp HALF_EVEN" }
      - { name: amount, type: number, source: computed, description: "base_amount * adjustment_factor rounded to 2dp HALF_UP" }
      - { name: issued_at, type: datetime, source: system, description: "Server-stamped issuance time" }
      - { name: due_date, type: datetime, source: system, description: "issued_at + 30 days; past-due penalties drive RegisteredEntity compliance_status -> RESTRICTED" }
      - { name: status, type: enum, source: system, description: "ASSESSED -> CONFIRMED -> SETTLED | WAIVED", constraints: "ASSESSED | CONFIRMED | SETTLED | WAIVED" }

  - name: Appeal
    parent: null
    common_fields: true
    fields:
      - { name: violation_id, type: string, source: input, description: "FK -> Violation.id; appealed violation" }
      - { name: grounds, type: string, source: input, description: "Appeal grounds narrative" }
      - { name: submitted_at, type: datetime, source: system, description: "Server-stamped submission time; must be within APPEAL_WINDOW_DAYS of Violation transition into OPEN" }
      - { name: status, type: enum, source: system, description: "APPEAL_PENDING_REVIEW -> APPEAL_GRANTED | APPEAL_DENIED -> FEDERAL_REVIEW_REQUESTED -> APPEAL_GRANTED | APPEAL_DENIED; second grant/deny are final", constraints: "APPEAL_PENDING_REVIEW | APPEAL_GRANTED | APPEAL_DENIED | FEDERAL_REVIEW_REQUESTED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Engagement
    initial_state: SCHEDULED
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /compliance/engagements/{engagementId}/start"
        actor: ComplianceAuditor
        preconditions:
          - "current clock >= period_start (else ERR_ENGAGEMENT_NOT_YET_OPEN)"
          - "every standard_id in standard_ids must belong to the entity's applicable_standards (else ERR_STANDARD_NOT_APPLICABLE)"
        side_effects: []
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /compliance/engagements/{engagementId}/complete"
        actor: ComplianceAuditor
        preconditions: []
        side_effects:
          - "recompute engagement.coverage_fraction one final time"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /compliance/engagements/{engagementId}/cancel"
        actor: ComplianceAuditor
        preconditions: []
        side_effects:
          - "all SUBMITTED EvidenceArtifact rows with engagement_id == this engagement -> REJECTED"
      - from: IN_PROGRESS
        to: CANCELLED
        trigger: "POST /compliance/engagements/{engagementId}/cancel"
        actor: ComplianceAuditor
        preconditions: []
        side_effects:
          - "all SUBMITTED EvidenceArtifact rows with engagement_id == this engagement -> REJECTED"

  - entity: EvidenceArtifact
    initial_state: SUBMITTED
    terminal_states: [ACCEPTED, REJECTED]
    transitions:
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /compliance/evidence/{evidenceId}/accept"
        actor: ComplianceAuditor
        preconditions:
          - "engagement.status == IN_PROGRESS (else ERR_EVIDENCE_NOT_REVIEWABLE)"
        side_effects:
          - "recompute engagement.coverage_fraction (covered_period_change)"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /compliance/evidence/{evidenceId}/reject"
        actor: ComplianceAuditor
        preconditions:
          - "engagement.status == IN_PROGRESS (else ERR_EVIDENCE_NOT_REVIEWABLE)"
        side_effects:
          - "recompute engagement.coverage_fraction (covered_period_change)"
      - from: SUBMITTED
        to: REJECTED
        trigger: "system (engagement cancel cascade)"
        actor: system
        preconditions: []
        side_effects:
          - "recompute engagement.coverage_fraction (covered_period_change)"

  - entity: SelfReport
    initial_state: RECEIVED
    terminal_states: [CONFIRMED, DISMISSED]
    transitions:
      - from: RECEIVED
        to: TRIAGED
        trigger: "POST /compliance/self-reports/{selfReportId}/triage"
        actor: ComplianceAuditor
        preconditions: []
        side_effects: []
      - from: TRIAGED
        to: CONFIRMED
        trigger: "POST /compliance/self-reports/{selfReportId}/confirm"
        actor: ComplianceAuditor
        preconditions: []
        side_effects:
          - "a Violation with source_type SELF_REPORT may now be created referencing this self-report"
      - from: TRIAGED
        to: DISMISSED
        trigger: "POST /compliance/self-reports/{selfReportId}/dismiss"
        actor: ComplianceAuditor
        preconditions: []
        side_effects: []

  - entity: Violation
    initial_state: OPEN
    terminal_states: [CLOSED, DISMISSED]
    transitions:
      - from: OPEN
        to: MITIGATION_SUBMITTED
        trigger: "POST /compliance/violations/{violationId}/mitigation-plans"
        actor: EntityComplianceOfficer
        preconditions:
          - "violation.status == OPEN (else ERR_VIOLATION_STATE)"
          - "no existing MitigationPlan row for this violation_id (else ERR_MITIGATION_PLAN_EXISTS)"
        side_effects:
          - "create MitigationPlan (DRAFT) then immediately SUBMITTED"
          - "recompute entity.open_violation_count (no change in membership, stays counted)"
      - from: MITIGATION_SUBMITTED
        to: MITIGATION_IN_PROGRESS
        trigger: "system (when MitigationPlan transitions SUBMITTED -> APPROVED)"
        actor: system
        preconditions: []
        side_effects: []
      - from: MITIGATION_IN_PROGRESS
        to: MITIGATION_COMPLETE
        trigger: "POST /compliance/violations/{violationId}/complete-mitigation"
        actor: EntityComplianceOfficer
        preconditions:
          - "violation.status == MITIGATION_IN_PROGRESS (else ERR_VIOLATION_STATE)"
          - "all Milestone rows of the plan have status in {COMPLETED} — none PENDING, none MISSED (else ERR_MILESTONES_INCOMPLETE)"
        side_effects: []
      - from: MITIGATION_COMPLETE
        to: CLOSED
        trigger: "system (when MitigationPlan transitions APPROVED -> VERIFIED)"
        actor: system
        preconditions: []
        side_effects:
          - "recompute Violation.final_penalty via final_penalty"
          - "decrement entity.open_violation_count by 1"
          - "create-or-update the Penalty row for this violation with amount = final_penalty"
      - from: OPEN
        to: APPEALED
        trigger: "POST /compliance/violations/{violationId}/appeals"
        actor: EntityComplianceOfficer
        preconditions:
          - "violation.status in {OPEN, MITIGATION_SUBMITTED, MITIGATION_IN_PROGRESS} (else ERR_VIOLATION_STATE)"
          - "clock now <= violation transition-to-OPEN time + APPEAL_WINDOW_DAYS (else ERR_APPEAL_WINDOW_EXPIRED)"
          - "no APPEAL_PENDING_REVIEW or FEDERAL_REVIEW_REQUESTED appeal exists for this violation (else ERR_DUPLICATE_ACTIVE_APPEAL)"
        side_effects:
          - "create Appeal (APPEAL_PENDING_REVIEW)"
          - "increment entity.unresolved_appeal_count by 1"
      - from: MITIGATION_SUBMITTED
        to: APPEALED
        trigger: "POST /compliance/violations/{violationId}/appeals"
        actor: EntityComplianceOfficer
        preconditions:
          - "same as OPEN -> APPEALED"
        side_effects:
          - "same as OPEN -> APPEALED"
      - from: MITIGATION_IN_PROGRESS
        to: APPEALED
        trigger: "POST /compliance/violations/{violationId}/appeals"
        actor: EntityComplianceOfficer
        preconditions:
          - "same as OPEN -> APPEALED"
        side_effects:
          - "same as OPEN -> APPEALED"
      - from: APPEALED
        to: CLOSED
        trigger: "system (when Appeal transitions to APPEAL_GRANTED at either level)"
        actor: system
        preconditions: []
        side_effects:
          - "recompute Violation.final_penalty via final_penalty"
          - "decrement entity.open_violation_count by 1"
          - "decrement entity.unresolved_appeal_count by 1"
          - "create-or-update the Penalty row for this violation with amount = final_penalty"
      - from: APPEALED
        to: OPEN
        trigger: "system (when Appeal transitions to APPEAL_DENIED at either level and no MitigationPlan exists for the violation)"
        actor: system
        preconditions: []
        side_effects:
          - "decrement entity.unresolved_appeal_count by 1 (only if the denied appeal was not subsequently re-opened for federal review — see Appeal machine)"
      - from: APPEALED
        to: MITIGATION_SUBMITTED
        trigger: "system (when Appeal transitions to APPEAL_DENIED at either level and the violation's MitigationPlan status == SUBMITTED or REJECTED)"
        actor: system
        preconditions: []
        side_effects:
          - "decrement entity.unresolved_appeal_count by 1 (same rule as APPEALED -> OPEN)"
      - from: APPEALED
        to: MITIGATION_IN_PROGRESS
        trigger: "system (when Appeal transitions to APPEAL_DENIED at either level and the violation's MitigationPlan status == APPROVED)"
        actor: system
        preconditions: []
        side_effects:
          - "decrement entity.unresolved_appeal_count by 1 (same rule as APPEALED -> OPEN)"
      - from: OPEN
        to: DISMISSED
        trigger: "system (when a self-log review qualifies the logged exception and creates the violation as is_self_logging_qualified)"
        actor: system
        preconditions:
          - "violation.is_self_logging_qualified == true"
        side_effects:
          - "violation never enters open_violation_count (created and dismissed atomically; count net zero)"

  - entity: MitigationPlan
    initial_state: DRAFT
    terminal_states: [VERIFIED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "system (immediate upon creation via POST /compliance/violations/{violationId}/mitigation-plans)"
        actor: system
        preconditions: []
        side_effects: []
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /compliance/mitigation-plans/{planId}/approve"
        actor: ComplianceAuditor
        preconditions: []
        side_effects:
          - "violation transitions MITIGATION_SUBMITTED -> MITIGATION_IN_PROGRESS"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /compliance/mitigation-plans/{planId}/reject"
        actor: ComplianceAuditor
        preconditions: []
        side_effects: []
      - from: APPROVED
        to: REJECTED
        trigger: "POST /compliance/mitigation-plans/{planId}/reject"
        actor: ComplianceAuditor
        preconditions: []
        side_effects:
          - "violation stays MITIGATION_IN_PROGRESS; plan may be resubmitted"
      - from: REJECTED
        to: SUBMITTED
        trigger: "POST /compliance/mitigation-plans/{planId}/resubmit"
        actor: EntityComplianceOfficer
        preconditions:
          - "plan.status == REJECTED (else ERR_PLAN_STATE)"
        side_effects: []
      - from: APPROVED
        to: VERIFIED
        trigger: "POST /compliance/mitigation-plans/{planId}/verify"
        actor: ComplianceAuditor
        preconditions:
          - "plan.status == APPROVED (else ERR_PLAN_STATE)"
          - "violation.status == MITIGATION_COMPLETE (else ERR_VIOLATION_STATE)"
        side_effects:
          - "violation transitions MITIGATION_COMPLETE -> CLOSED (cascades: final_penalty, open_violation_count, Penalty upsert)"

  - entity: Milestone
    initial_state: PENDING
    terminal_states: [COMPLETED]
    transitions:
      - from: PENDING
        to: COMPLETED
        trigger: "POST /compliance/milestones/{milestoneId}/complete"
        actor: EntityComplianceOfficer
        preconditions:
          - "plan.status == APPROVED (else ERR_PLAN_STATE)"
        side_effects:
          - "completed_at stamped with current clock"
      - from: PENDING
        to: MISSED
        trigger: "system (POST /compliance/_clock/advance sweep: due_date < now and status == PENDING)"
        actor: system
        preconditions: []
        side_effects: []
      - from: MISSED
        to: COMPLETED
        trigger: "POST /compliance/milestones/{milestoneId}/complete"
        actor: EntityComplianceOfficer
        preconditions:
          - "plan.status == APPROVED (else ERR_PLAN_STATE)"
        side_effects:
          - "completed_at stamped with current clock; late completion is allowed but the MISSED episode remains auditable via updated_at/version"

  - entity: SelfLogEntry
    initial_state: LOGGED
    terminal_states: [REVIEWED_OK, ESCALATED]
    transitions:
      - from: LOGGED
        to: REVIEWED_OK
        trigger: "POST /compliance/self-log-entries/{entryId}/review with outcome REVIEWED_OK"
        actor: ComplianceAuditor
        preconditions:
          - "the entry's period.status == REVIEWING (else ERR_INVALID_STATE)"
        side_effects:
          - "period.reviewed_ok_count += 1"
      - from: LOGGED
        to: ESCALATED
        trigger: "POST /compliance/self-log-entries/{entryId}/review with outcome ESCALATED"
        actor: ComplianceAuditor
        preconditions:
          - "the entry's period.status == REVIEWING (else ERR_INVALID_STATE)"
        side_effects:
          - "period.escalated_count += 1"
          - "create Violation with source_type SELF_LOG for the entry's entity and standard; when the escalation rationale qualifies (violation_risk_factor MINIMAL and severity_level LOWER, passed in the review call) the violation is created atomically DISMISSED (is_self_logging_qualified == true); otherwise it is created OPEN and entity.open_violation_count += 1"

  - entity: ReviewPeriod
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: REVIEWING
        trigger: "POST /compliance/review-periods/{periodId}/start-review"
        actor: ComplianceAuditor
        preconditions:
          - "period.entry_count > 0 (else ERR_EMPTY_REVIEW_PERIOD)"
        side_effects: []
      - from: REVIEWING
        to: CLOSED
        trigger: "POST /compliance/review-periods/{periodId}/close"
        actor: ComplianceAuditor
        preconditions:
          - "every SelfLogEntry in this period has status in {REVIEWED_OK, ESCALATED} (else ERR_ENTRIES_UNREVIEWED)"
        side_effects:
          - "closed_at stamped with current clock"

  - entity: CIPAsset
    initial_state: ACTIVE
    terminal_states: [DECOMMISSIONED]
    transitions:
      - from: ACTIVE
        to: DECOMMISSIONED
        trigger: "POST /compliance/cip-assets/{assetId}/decommission"
        actor: CIPAssetManager
        preconditions:
          - "no AccessGrant with asset_id == this asset and status == ACTIVE (else ERR_ACTIVE_ACCESS_GRANTS)"
        side_effects: []

  - entity: AccessGrant
    initial_state: ACTIVE
    terminal_states: [REVOKED]
    transitions:
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /compliance/access-grants/{grantId}/revoke"
        actor: CIPAssetManager
        preconditions: []
        side_effects:
          - "revoked_at stamped with current clock"

  - entity: Penalty
    initial_state: ASSESSED
    terminal_states: [SETTLED, WAIVED]
    transitions:
      - from: ASSESSED
        to: CONFIRMED
        trigger: "POST /compliance/penalties/{penaltyId}/confirm"
        actor: ComplianceAuditor
        preconditions: []
        side_effects: []
      - from: CONFIRMED
        to: SETTLED
        trigger: "POST /compliance/penalties/{penaltyId}/settle"
        actor: EntityComplianceOfficer
        preconditions: []
        side_effects:
          - "if entity.compliance_status == RESTRICTED and no other CONFIRMED past-due penalty exists for the entity, entity.compliance_status -> ACTIVE"
      - from: CONFIRMED
        to: WAIVED
        trigger: "POST /compliance/penalties/{penaltyId}/waive"
        actor: FederalReviewer
        preconditions: []
        side_effects:
          - "if entity.compliance_status == RESTRICTED and no other CONFIRMED past-due penalty exists for the entity, entity.compliance_status -> ACTIVE"

  - entity: Appeal
    initial_state: APPEAL_PENDING_REVIEW
    terminal_states: [APPEAL_GRANTED, APPEAL_DENIED]
    transitions:
      - from: APPEAL_PENDING_REVIEW
        to: APPEAL_GRANTED
        trigger: "POST /compliance/appeals/{appealId}/grant"
        actor: RegionalEntityReviewer
        preconditions: []
        side_effects:
          - "violation transitions APPEALED -> CLOSED"
      - from: APPEAL_PENDING_REVIEW
        to: APPEAL_DENIED
        trigger: "POST /compliance/appeals/{appealId}/deny"
        actor: RegionalEntityReviewer
        preconditions: []
        side_effects:
          - "violation transitions APPEALED back to OPEN/MITIGATION_SUBMITTED/MITIGATION_IN_PROGRESS per its plan state"
      - from: APPEAL_DENIED
        to: FEDERAL_REVIEW_REQUESTED
        trigger: "POST /compliance/appeals/{appealId}/request-federal-review"
        actor: EntityComplianceOfficer
        preconditions:
          - "appeal.status == APPEAL_DENIED (else ERR_INVALID_STATE)"
          - "clock now <= appeal denial time + FEDERAL_REVIEW_WINDOW_DAYS (else ERR_APPEAL_WINDOW_EXPIRED)"
        side_effects:
          - "increment entity.unresolved_appeal_count by 1"
      - from: FEDERAL_REVIEW_REQUESTED
        to: APPEAL_GRANTED
        trigger: "POST /compliance/appeals/{appealId}/grant"
        actor: FederalReviewer
        preconditions: []
        side_effects:
          - "violation transitions APPEALED -> CLOSED (unresolved_appeal_count net effect handled by the violation transition)"
      - from: FEDERAL_REVIEW_REQUESTED
        to: APPEAL_DENIED
        trigger: "POST /compliance/appeals/{appealId}/deny"
        actor: FederalReviewer
        preconditions: []
        side_effects:
          - "violation transitions APPEALED back per its plan state (OPEN / MITIGATION_SUBMITTED / MITIGATION_IN_PROGRESS); unresolved_appeal_count net effect handled by the violation transition"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: mitigation-plan-create-stale-violation
    parent_entity: Violation
    write_endpoint: "POST /compliance/violations/{violationId}/mitigation-plans"
    occ_field: expected_violation_version
    description: |
      Creating a MitigationPlan against a Violation whose version has advanced
      since the client last observed it is rejected. This captures the case where
      another writer has just created a plan (which transitions the violation and
      makes the second create invalid by state) or an appeal moved the violation,
      so the current writer's view of the violation is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: appeal-file-stale-violation
    parent_entity: Violation
    write_endpoint: "POST /compliance/violations/{violationId}/appeals"
    occ_field: expected_violation_version
    description: |
      Filing an Appeal against a Violation whose version has advanced since the
      client last observed it is rejected, because the appeal window and plan
      state the client relied on may no longer hold.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: propose_penalty
    description: "Penalty proposed when a violation enters OPEN"
    trigger: "Violation transitions into OPEN (creation)"
    algorithm: weighted_scoring
    formula: |
      base_amount = BASE_BY_VRF[violation.violation_risk_factor]
      factor = 1.0
      if violation.severity_level == "SEVERE": factor = factor * SEVERE_MULTIPLIER
      if violation.severity_level == "HIGH":   factor = factor * HIGH_MULTIPLIER
      if violation.source_type == "SELF_REPORT": factor = factor * SELF_REPORT_DISCOUNT
      if violation.source_type == "SELF_LOG":    factor = factor * SELF_LOG_DISCOUNT
      if violation.source_engagement_id is not null and the referenced engagement.coverage_fraction < COVERAGE_GAP_THRESHOLD: factor = factor * GAP_AGGRAVATION
      prior_confirmed = count of other Violation rows for the same entity_id with status CLOSED and final_penalty not null
      factor = factor * (1.0 + RECIDIVISM_RATE * min(prior_confirmed, RECIDIVISM_CAP))
      factor = round(factor, 4)   # HALF_EVEN at 4 decimal places
      amount = round(base_amount * factor, 2)  # HALF_UP at 2 decimal places
    input_set: "the Violation row; its referenced Engagement coverage_fraction when source_engagement_id is not null; the entity's prior closed-violation history"
    constants:
      BASE_MINIMAL: 1000
      BASE_MODERATE: 5000
      BASE_SERIOUS: 25000
      SEVERE_MULTIPLIER: 2.0
      HIGH_MULTIPLIER: 1.5
      SELF_REPORT_DISCOUNT: 0.6
      SELF_LOG_DISCOUNT: 0.4
      GAP_AGGRAVATION: 1.25
      RECIDIVISM_RATE: 0.1
      RECIDIVISM_CAP: 5
      COVERAGE_GAP_THRESHOLD: 0.8
    precision: "4 decimal places for factor, round_half_even; 2 decimal places for amount, round_half_up"
    variants:
      - name: final_penalty
        when: "Violation transitions to CLOSED"
        difference: "base_amount is replaced by round(BASE_BY_VRF[vrf] * 0.9, 2) when violation violation_end < the closure time minus 365 days (stale violation discount); all other steps identical"

  - name: covered_period
    description: "Union length of accepted/submitted evidence coverage windows for one standard inside one engagement period"
    trigger: "any covered_period_change on an EvidenceArtifact in scope (accept, reject, cascade-reject)"
    algorithm: interval_merge
    formula: |
      # Collect coverage windows of EvidenceArtifact rows where
      # engagement_id == this engagement, standard_id == S, status in {SUBMITTED, ACCEPTED}.
      # Sweep line: merge half-open [start, end) intervals; adjacent intervals (gap == 0) merge;
      # overlapping intervals union. Sum merged lengths inside [engagement.period_start, engagement.period_end).
      total = 0
      for each merged interval [a, b) intersected with [period_start, period_end):
          total += max(0, min(b, period_end) - max(a, period_start))
      return total
    input_set: "EvidenceArtifact rows for the engagement+standard with status in {SUBMITTED, ACCEPTED}"
    precision: "integer seconds"
    constants: {}

  - name: coverage_fraction
    description: "Fraction of monitored period covered by evidence, averaged across in-scope standards"
    trigger: "any covered_period_change; also recomputed on engagement complete"
    algorithm: aggregation
    formula: |
      per_standard = []
      for S in engagement.standard_ids:
          per_standard.append( covered_period(S) / (period_end - period_start) )
      coverage_fraction = round( sum(per_standard) / len(per_standard), 4 )  # HALF_UP
    input_set: "engagement.standard_ids; per-standard covered_period"
    precision: "4 decimal places, round_half_up"
    constants: {}

  - name: restriction_due
    description: "Whether an entity must be RESTRICTED due to a confirmed past-due penalty"
    trigger: "POST /compliance/_clock/advance sweep; also checked inline after Penalty confirm/settle/waive"
    algorithm: threshold
    formula: |
      for each Penalty P where P.status == CONFIRMED and P.due_date < clock_now:
          entity(P.violation.entity_id).compliance_status = RESTRICTED
      entity returns to ACTIVE only when no CONFIRMED past-due penalty remains
    input_set: "all Penalty rows"
    constants: {}
    precision: "exact datetime comparison"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1, category: auth, check: "X-User-Role and X-User-ID headers present and well-formed", error_id: ERR_UNAUTHENTICATED, http_status: 401, applies_to: "all" }
  - { priority: 2, category: auth, check: "caller role is authorized for the endpoint per §1.7, including appeal-level scoping: RegionalEntityReviewer may grant/deny only appeals in APPEAL_PENDING_REVIEW, FederalReviewer only appeals in FEDERAL_REVIEW_REQUESTED", error_id: ERR_UNAUTHORIZED, http_status: 403, applies_to: "all" }
  - { priority: 3, category: existence, check: "every id referenced in path and body resolves to an existing row, validated left-to-right", error_id: ERR_NOT_FOUND, http_status: 404, applies_to: "all" }
  - { priority: 4, category: business_safety, check: "registered-entity posture gate: entity.compliance_status != RESTRICTED for entity-initiated mutation endpoints (self-reports, mitigation-plans, appeals, self-log, access grants)", error_id: ERR_ENTITY_RESTRICTED, http_status: 409, applies_to: ["POST /compliance/self-reports", "POST /compliance/violations/{violationId}/mitigation-plans", "POST /compliance/violations/{violationId}/appeals", "POST /compliance/self-log-entries", "POST /compliance/access-grants"] }
  - { priority: 6, category: state, check: "target resource is in a state from which the requested transition is defined (per §1.2)", error_id: ERR_INVALID_STATE, http_status: 409, applies_to: "all action endpoints" }
  - { priority: 7, category: business_safety, check: "self-logging enrollment: POST /compliance/self-log-entries requires entity.enrollment_self_logging == true", error_id: ERR_SELF_LOG_NOT_ENROLLED, http_status: 422, applies_to: ["POST /compliance/self-log-entries"] }
  - { priority: 8, category: business_safety, check: "CIP access-log requirement: EvidenceArtifact with artifact_kind == ACCESS_LOG must carry a non-null cip_asset_id referencing an ACTIVE asset whose is_bes_cyber_asset == true", error_id: ERR_CIP_EVIDENCE_REQUIRED, http_status: 422, applies_to: ["POST /compliance/evidence"] }
  - { priority: 9, category: business_temporal, check: "engagement must be IN_PROGRESS to submit evidence", error_id: ERR_ENGAGEMENT_NOT_IN_PROGRESS, http_status: 409, applies_to: ["POST /compliance/evidence"] }
  - { priority: 10, category: business_temporal, check: "engagement start requires current clock >= period_start", error_id: ERR_ENGAGEMENT_NOT_YET_OPEN, http_status: 409, applies_to: ["POST /compliance/engagements/{engagementId}/start"] }
  - { priority: 11, category: business_temporal, check: "appeal window: appeal submitted within APPEAL_WINDOW_DAYS of the violation entering OPEN; federal review within FEDERAL_REVIEW_WINDOW_DAYS of denial", error_id: ERR_APPEAL_WINDOW_EXPIRED, http_status: 422, applies_to: ["POST /compliance/violations/{violationId}/appeals", "POST /compliance/appeals/{appealId}/request-federal-review"] }
  - { priority: 12, category: business_temporal, check: "evidence coverage window must satisfy coverage_end > coverage_start; violation interval violation_end > violation_start; milestone due_date > clock now at creation", error_id: ERR_INVALID_INTERVAL, http_status: 422, applies_to: ["POST /compliance/evidence", "POST /compliance/violations", "POST /compliance/mitigation-plans/{planId}/milestones"] }
  - { priority: 13, category: business_referential, check: "self-log / self-report / access-grant caller must act on their own entity (X-User-ID equals the entity id referenced)", error_id: ERR_FORBIDDEN, http_status: 403, applies_to: ["POST /compliance/self-reports", "POST /compliance/self-log-entries", "POST /compliance/violations/{violationId}/mitigation-plans", "POST /compliance/violations/{violationId}/appeals", "POST /compliance/violations/{violationId}/complete-mitigation", "POST /compliance/penalties/{penaltyId}/settle"] }
  - { priority: 14, category: business_referential, check: "standard_id in scope must belong to the entity's applicable_standards", error_id: ERR_STANDARD_NOT_APPLICABLE, http_status: 422, applies_to: ["POST /compliance/engagements", "POST /compliance/self-reports", "POST /compliance/self-log-entries", "POST /compliance/violations"] }
  - { priority: 15, category: business_constraint, check: "violation source integrity: when source_engagement_id is provided it must reference a COMPLETED engagement of the matching type (AUDIT or SPOT_CHECK); when source_type == SELF_REPORT, source_self_report_id is required and must reference a CONFIRMED self-report", error_id: ERR_VIOLATION_SOURCE_INVALID, http_status: 422, applies_to: ["POST /compliance/violations"] }
  - { priority: 16, category: business_constraint, check: "one active mitigation plan per violation", error_id: ERR_MITIGATION_PLAN_EXISTS, http_status: 409, applies_to: ["POST /compliance/violations/{violationId}/mitigation-plans"] }
  - { priority: 17, category: business_constraint, check: "complete-mitigation requires every milestone of the plan in COMPLETED", error_id: ERR_MILESTONES_INCOMPLETE, http_status: 409, applies_to: ["POST /compliance/violations/{violationId}/complete-mitigation"] }
  - { priority: 18, category: business_constraint, check: "close review period requires every entry reviewed", error_id: ERR_ENTRIES_UNREVIEWED, http_status: 409, applies_to: ["POST /compliance/review-periods/{periodId}/close"] }
  - { priority: 19, category: business_constraint, check: "start review period requires entry_count > 0", error_id: ERR_EMPTY_REVIEW_PERIOD, http_status: 422, applies_to: ["POST /compliance/review-periods/{periodId}/start-review"] }
  - { priority: 20, category: business_constraint, check: "CIP asset decommission requires no ACTIVE access grants", error_id: ERR_ACTIVE_ACCESS_GRANTS, http_status: 409, applies_to: ["POST /compliance/cip-assets/{assetId}/decommission"] }
  - { priority: 21, category: business_constraint, check: "access grant requires target asset status == ACTIVE", error_id: ERR_ASSET_DECOMMISSIONED, http_status: 409, applies_to: ["POST /compliance/access-grants"] }
  - { priority: 22, category: business_constraint, check: "no second active appeal (APPEAL_PENDING_REVIEW or FEDERAL_REVIEW_REQUESTED) for the same violation", error_id: ERR_DUPLICATE_ACTIVE_APPEAL, http_status: 409, applies_to: ["POST /compliance/violations/{violationId}/appeals"] }
  - { priority: 23, category: business_constraint, check: "evidence accept/reject only when engagement IN_PROGRESS", error_id: ERR_EVIDENCE_NOT_REVIEWABLE, http_status: 409, applies_to: ["POST /compliance/evidence/{evidenceId}/accept", "POST /compliance/evidence/{evidenceId}/reject"] }
  - { priority: 24, category: business_constraint, check: "violation state precondition for plan/appeal/complete endpoints", error_id: ERR_VIOLATION_STATE, http_status: 409, applies_to: ["POST /compliance/violations/{violationId}/mitigation-plans", "POST /compliance/violations/{violationId}/appeals", "POST /compliance/violations/{violationId}/complete-mitigation"] }
  - { priority: 25, category: business_constraint, check: "mitigation plan state precondition for approve/reject/resubmit/verify/milestone endpoints (milestone creation requires plan.status == APPROVED; milestone completion requires plan.status == APPROVED)", error_id: ERR_PLAN_STATE, http_status: 409, applies_to: ["POST /compliance/mitigation-plans/{planId}/approve", "POST /compliance/mitigation-plans/{planId}/reject", "POST /compliance/mitigation-plans/{planId}/resubmit", "POST /compliance/mitigation-plans/{planId}/verify", "POST /compliance/mitigation-plans/{planId}/milestones", "POST /compliance/milestones/{milestoneId}/complete"] }
  - { priority: 26, category: business_safety, check: "segregation of duties: the same X-User-ID who submitted a MitigationPlan may not approve or verify it; the same X-User-ID who created a Violation may not confirm its Penalty", error_id: ERR_SOD_CONFLICT, http_status: 403, applies_to: ["POST /compliance/mitigation-plans/{planId}/approve", "POST /compliance/mitigation-plans/{planId}/verify", "POST /compliance/penalties/{penaltyId}/confirm"] }
  - { priority: 27, category: business_fiscal, check: "penalty settle/waive requires penalty status CONFIRMED", error_id: ERR_PENALTY_NOT_CONFIRMED, http_status: 409, applies_to: ["POST /compliance/penalties/{penaltyId}/settle", "POST /compliance/penalties/{penaltyId}/waive"] }
  - { priority: 28, category: business_fiscal, check: "penalty confirm requires status ASSESSED", error_id: ERR_PENALTY_ALREADY_RESOLVED, http_status: 409, applies_to: ["POST /compliance/penalties/{penaltyId}/confirm"] }
  - { priority: 5, category: business_constraint, check: "OCC: expected_violation_version matches current Violation.version", error_id: ERR_STALE_VERSION, http_status: 412, applies_to: ["POST /compliance/violations/{violationId}/mitigation-plans", "POST /compliance/violations/{violationId}/appeals"] }
  - { priority: 29, category: business_constraint, check: "generic malformed input (missing required field, wrong type, bad enum)", error_id: ERR_INVALID_REQUEST, http_status: 400, applies_to: "all" }

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  - { method: POST, path: "/compliance/_clock/set_current_utc", description: "Set the logical clock; server default before any call is 2026-09-01T00:00:00Z", roles: [RegionalEntityReviewer], code: 200, input: [to_iso8601], output: { now: string }, side_effects: [] }
  - { method: POST, path: "/compliance/_clock/advance", description: "Advance logical clock by seconds; runs milestone MISSED sweep and restriction sweep", roles: [RegionalEntityReviewer], code: 200, input: [seconds], output: { now: string }, side_effects: ["Milestone PENDING with due_date < now -> MISSED", "restriction_due recomputed for all entities"] }

  - { method: POST, path: "/compliance/registrations", description: "Register an entity by function set", roles: [RegistrationCoordinator], code: 201, input: [legal_name, registration_functions, "enrollment_self_logging?"], output: RegisteredEntity, side_effects: ["compute applicable_standards, applicable_standard_count"] }
  - { method: GET, path: "/compliance/registrations", description: "List registered entities", roles: [RegistrationCoordinator, ComplianceAuditor, RegionalEntityReviewer, FederalReviewer, EntityComplianceOfficer, CIPAssetManager], code: 200, input: ["limit?", "offset?", "compliance_status?"], output: "RegisteredEntity[]", side_effects: [] }
  - { method: GET, path: "/compliance/registrations/{entityId}", description: "Get one registered entity", roles: [RegistrationCoordinator, ComplianceAuditor, RegionalEntityReviewer, FederalReviewer, EntityComplianceOfficer, CIPAssetManager], code: 200, input: [], output: RegisteredEntity, side_effects: [] }
  - { method: PATCH, path: "/compliance/registrations/{entityId}", description: "Update registration_functions and/or enrollment_self_logging; recomputes applicable_standards", roles: [RegistrationCoordinator], code: 200, input: ["registration_functions?", "enrollment_self_logging?"], output: RegisteredEntity, side_effects: ["recompute applicable_standards, applicable_standard_count"] }

  - { method: POST, path: "/compliance/engagements", description: "Schedule an audit/spot-check/self-certification engagement", roles: [ComplianceAuditor], code: 201, input: [entity_id, engagement_type, standard_ids, period_start, period_end], output: Engagement, side_effects: ["validate standard_ids subset of entity.applicable_standards"] }
  - { method: GET, path: "/compliance/engagements", description: "List engagements", roles: [ComplianceAuditor, RegionalEntityReviewer, FederalReviewer, EntityComplianceOfficer], code: 200, input: ["limit?", "offset?", "entity_id?", "status?"], output: "Engagement[]", side_effects: [] }
  - { method: GET, path: "/compliance/engagements/{engagementId}", description: "Get one engagement", roles: [ComplianceAuditor, RegionalEntityReviewer, FederalReviewer, EntityComplianceOfficer], code: 200, input: [], output: Engagement, side_effects: [] }
  - { method: POST, path: "/compliance/engagements/{engagementId}/start", description: "Transition SCHEDULED -> IN_PROGRESS", roles: [ComplianceAuditor], code: 200, input: [], output: Engagement, side_effects: ["increments Engagement.version by 1"] }
  - { method: POST, path: "/compliance/engagements/{engagementId}/complete", description: "Transition IN_PROGRESS -> COMPLETED", roles: [ComplianceAuditor], code: 200, input: [], output: Engagement, side_effects: ["final coverage_fraction recompute", "increments Engagement.version by 1"] }
  - { method: POST, path: "/compliance/engagements/{engagementId}/cancel", description: "Cancel a non-terminal engagement; cascade-rejects SUBMITTED evidence", roles: [ComplianceAuditor], code: 200, input: [], output: Engagement, side_effects: ["SUBMITTED evidence -> REJECTED", "coverage_fraction recompute", "increments Engagement.version by 1"] }

  - { method: POST, path: "/compliance/evidence", description: "Submit an evidence artifact to an IN_PROGRESS engagement", roles: [EntityComplianceOfficer], code: 201, input: [engagement_id, standard_id, artifact_kind, coverage_start, coverage_end, "cip_asset_id?"], output: EvidenceArtifact, side_effects: ["coverage_fraction recompute"] }
  - { method: GET, path: "/compliance/evidence", description: "List evidence artifacts", roles: [ComplianceAuditor, RegionalEntityReviewer, FederalReviewer, EntityComplianceOfficer], code: 200, input: ["limit?", "offset?", "engagement_id?", "cip_asset_id?", "status?"], output: "EvidenceArtifact[]", side_effects: [] }
  - { method: GET, path: "/compliance/evidence/{evidenceId}", description: "Get one evidence artifact", roles: [ComplianceAuditor, RegionalEntityReviewer, FederalReviewer, EntityComplianceOfficer], code: 200, input: [], output: EvidenceArtifact, side_effects: [] }
  - { method: POST, path: "/compliance/evidence/{evidenceId}/accept", description: "Accept SUBMITTED evidence", roles: [ComplianceAuditor], code: 200, input: ["review_note?"], output: EvidenceArtifact, side_effects: ["coverage_fraction recompute", "increments EvidenceArtifact.version by 1"] }
  - { method: POST, path: "/compliance/evidence/{evidenceId}/reject", description: "Reject SUBMITTED evidence", roles: [ComplianceAuditor], code: 200, input: ["review_note?"], output: EvidenceArtifact, side_effects: ["coverage_fraction recompute", "increments EvidenceArtifact.version by 1"] }

  - { method: POST, path: "/compliance/self-reports", description: "Entity self-reports a potential violation", roles: [EntityComplianceOfficer], code: 201, input: [entity_id, standard_id, description, occurred_at], output: SelfReport, side_effects: [] }
  - { method: GET, path: "/compliance/self-reports", description: "List self-reports", roles: [ComplianceAuditor, RegionalEntityReviewer, FederalReviewer, EntityComplianceOfficer], code: 200, input: ["limit?", "offset?", "entity_id?", "status?"], output: "SelfReport[]", side_effects: [] }
  - { method: GET, path: "/compliance/self-reports/{selfReportId}", description: "Get one self-report", roles: [ComplianceAuditor, RegionalEntityReviewer, FederalReviewer, EntityComplianceOfficer], code: 200, input: [], output: SelfReport, side_effects: [] }
  - { method: POST, path: "/compliance/self-reports/{selfReportId}/triage", description: "RECEIVED -> TRIAGED", roles: [ComplianceAuditor], code: 200, input: [], output: SelfReport, side_effects: [] }
  - { method: POST, path: "/compliance/self-reports/{selfReportId}/confirm", description: "TRIAGED -> CONFIRMED", roles: [ComplianceAuditor], code: 200, input: [], output: SelfReport, side_effects: [] }
  - { method: POST, path: "/compliance/self-reports/{selfReportId}/dismiss", description: "TRIAGED -> DISMISSED", roles: [ComplianceAuditor], code: 200, input: [], output: SelfReport, side_effects: [] }

  - { method: POST, path: "/compliance/violations", description: "Record a violation from an audit, spot check, or confirmed self-report; computes proposed penalty", roles: [ComplianceAuditor], code: 201, input: [entity_id, standard_id, source_type, violation_start, violation_end, violation_risk_factor, severity_level, "source_engagement_id?", "source_self_report_id?"], output: Violation, side_effects: ["propose_penalty -> proposed_penalty", "entity.open_violation_count += 1"] }
  - { method: GET, path: "/compliance/violations", description: "List violations", roles: [ComplianceAuditor, RegionalEntityReviewer, FederalReviewer, EntityComplianceOfficer], code: 200, input: ["limit?", "offset?", "entity_id?", "status?", "source_engagement_id?", "source_self_report_id?"], output: "Violation[]", side_effects: [] }
  - { method: GET, path: "/compliance/violations/{violationId}", description: "Get one violation", roles: [ComplianceAuditor, RegionalEntityReviewer, FederalReviewer, EntityComplianceOfficer], code: 200, input: [], output: Violation, side_effects: [] }

  - { method: POST, path: "/compliance/violations/{violationId}/mitigation-plans", description: "Submit a mitigation plan for an OPEN violation (OCC-guarded)", roles: [EntityComplianceOfficer], code: 201, input: [description, expected_violation_version], output: MitigationPlan, side_effects: ["violation OPEN -> MITIGATION_SUBMITTED", "increments Violation.version by 1"] }
  - { method: GET, path: "/compliance/mitigation-plans", description: "List mitigation plans", roles: [ComplianceAuditor, RegionalEntityReviewer, FederalReviewer, EntityComplianceOfficer], code: 200, input: ["limit?", "offset?", "violation_id?", "status?"], output: "MitigationPlan[]", side_effects: [] }
  - { method: GET, path: "/compliance/mitigation-plans/{planId}", description: "Get one mitigation plan", roles: [ComplianceAuditor, RegionalEntityReviewer, FederalReviewer, EntityComplianceOfficer], code: 200, input: [], output: MitigationPlan, side_effects: [] }
  - { method: POST, path: "/compliance/mitigation-plans/{planId}/approve", description: "SUBMITTED -> APPROVED; violation -> MITIGATION_IN_PROGRESS", roles: [ComplianceAuditor], code: 200, input: [], output: MitigationPlan, side_effects: ["violation MITIGATION_SUBMITTED -> MITIGATION_IN_PROGRESS"] }
  - { method: POST, path: "/compliance/mitigation-plans/{planId}/reject", description: "SUBMITTED or APPROVED -> REJECTED", roles: [ComplianceAuditor], code: 200, input: [], output: MitigationPlan, side_effects: [] }
  - { method: POST, path: "/compliance/mitigation-plans/{planId}/resubmit", description: "REJECTED -> SUBMITTED (revision loop)", roles: [EntityComplianceOfficer], code: 200, input: ["description?"], output: MitigationPlan, side_effects: [] }
  - { method: POST, path: "/compliance/mitigation-plans/{planId}/verify", description: "APPROVED -> VERIFIED; closes the violation and recomputes final penalty", roles: [ComplianceAuditor], code: 200, input: [], output: MitigationPlan, side_effects: ["violation MITIGATION_COMPLETE -> CLOSED", "final_penalty recompute", "Penalty upsert", "entity.open_violation_count -= 1"] }

  - { method: POST, path: "/compliance/mitigation-plans/{planId}/milestones", description: "Add a milestone to a plan", roles: [EntityComplianceOfficer], code: 201, input: [title, due_date], output: Milestone, side_effects: [] }
  - { method: GET, path: "/compliance/mitigation-plans/{id}/milestones", description: "List milestones of a plan", roles: [ComplianceAuditor, RegionalEntityReviewer, FederalReviewer, EntityComplianceOfficer], code: 200, input: ["limit?", "offset?"], output: "Milestone[]", side_effects: [] }
  - { method: GET, path: "/compliance/milestones/{milestoneId}", description: "Get one milestone", roles: [ComplianceAuditor, RegionalEntityReviewer, FederalReviewer, EntityComplianceOfficer], code: 200, input: [], output: Milestone, side_effects: [] }
  - { method: POST, path: "/compliance/milestones/{milestoneId}/complete", description: "PENDING or MISSED -> COMPLETED", roles: [EntityComplianceOfficer], code: 200, input: [], output: Milestone, side_effects: [] }
  - { method: POST, path: "/compliance/violations/{violationId}/complete-mitigation", description: "MITIGATION_IN_PROGRESS -> MITIGATION_COMPLETE; requires all milestones COMPLETED", roles: [EntityComplianceOfficer], code: 200, input: [], output: Violation, side_effects: [] }

  - { method: POST, path: "/compliance/self-log-entries", description: "Log a minimal-risk exception under the self-logging program", roles: [EntityComplianceOfficer], code: 201, input: [entity_id, standard_id, exception_note, "period_id?"], output: SelfLogEntry, side_effects: ["if period_id null, attach to nearest unclosed period by open_at", "period.entry_count += 1"] }
  - { method: GET, path: "/compliance/self-log-entries", description: "List self-log entries", roles: [ComplianceAuditor, RegionalEntityReviewer, FederalReviewer, EntityComplianceOfficer], code: 200, input: ["limit?", "offset?", "entity_id?", "period_id?", "status?"], output: "SelfLogEntry[]", side_effects: [] }
  - { method: GET, path: "/compliance/self-log-entries/{entryId}", description: "Get one self-log entry", roles: [ComplianceAuditor, RegionalEntityReviewer, FederalReviewer, EntityComplianceOfficer], code: 200, input: [], output: SelfLogEntry, side_effects: [] }
  - { method: GET, path: "/compliance/review-periods/{periodId}/entries", description: "List self-log entries attached to a review period", roles: [ComplianceAuditor, RegionalEntityReviewer, FederalReviewer, EntityComplianceOfficer], code: 200, input: ["limit?", "offset?", "status?"], output: "SelfLogEntry[]", side_effects: [] }
  - { method: POST, path: "/compliance/self-log-entries/{entryId}/review", description: "Apply the review outcome to a LOGGED entry whose period is REVIEWING", roles: [ComplianceAuditor], code: 200, input: [outcome, "violation_risk_factor?", "severity_level?"], output: SelfLogEntry, side_effects: ["entry -> REVIEWED_OK or ESCALATED", "period counters updated", "on ESCALATED: Violation (SELF_LOG) created — DISMISSED when violation_risk_factor == MINIMAL and severity_level == LOWER, else OPEN"] }

  - { method: POST, path: "/compliance/review-periods", description: "Open a new self-log review period", roles: [ComplianceAuditor], code: 201, input: [], output: ReviewPeriod, side_effects: [] }
  - { method: GET, path: "/compliance/review-periods", description: "List review periods", roles: [ComplianceAuditor, RegionalEntityReviewer, FederalReviewer, EntityComplianceOfficer], code: 200, input: ["limit?", "offset?", "status?"], output: "ReviewPeriod[]", side_effects: [] }
  - { method: GET, path: "/compliance/review-periods/{periodId}", description: "Get one review period", roles: [ComplianceAuditor, RegionalEntityReviewer, FederalReviewer, EntityComplianceOfficer], code: 200, input: [], output: ReviewPeriod, side_effects: [] }
  - { method: POST, path: "/compliance/review-periods/{periodId}/start-review", description: "OPEN -> REVIEWING (requires entry_count > 0)", roles: [ComplianceAuditor], code: 200, input: [], output: ReviewPeriod, side_effects: [] }
  - { method: POST, path: "/compliance/review-periods/{periodId}/close", description: "REVIEWING -> CLOSED; requires every entry reviewed", roles: [ComplianceAuditor], code: 200, input: [], output: ReviewPeriod, side_effects: ["closed_at stamped"] }

  - { method: POST, path: "/compliance/cip-assets", description: "Register a CIP asset with impact categorization", roles: [CIPAssetManager], code: 201, input: [entity_id, asset_name, impact_rating], output: CIPAsset, side_effects: ["is_bes_cyber_asset computed"] }
  - { method: GET, path: "/compliance/cip-assets", description: "List CIP assets", roles: [ComplianceAuditor, RegionalEntityReviewer, FederalReviewer, EntityComplianceOfficer, CIPAssetManager], code: 200, input: ["limit?", "offset?", "entity_id?", "status?"], output: "CIPAsset[]", side_effects: [] }
  - { method: GET, path: "/compliance/cip-assets/{assetId}", description: "Get one CIP asset", roles: [ComplianceAuditor, RegionalEntityReviewer, FederalReviewer, EntityComplianceOfficer, CIPAssetManager], code: 200, input: [], output: CIPAsset, side_effects: [] }
  - { method: POST, path: "/compliance/cip-assets/{assetId}/decommission", description: "ACTIVE -> DECOMMISSIONED (requires no ACTIVE grants)", roles: [CIPAssetManager], code: 200, input: [], output: CIPAsset, side_effects: [] }

  - { method: POST, path: "/compliance/access-grants", description: "Grant physical/electronic access to a CIP asset", roles: [CIPAssetManager], code: 201, input: [asset_id, grantee_badge, scope], output: AccessGrant, side_effects: [] }
  - { method: GET, path: "/compliance/access-grants", description: "List access grants", roles: [ComplianceAuditor, RegionalEntityReviewer, FederalReviewer, CIPAssetManager], code: 200, input: ["limit?", "offset?", "asset_id?", "status?"], output: "AccessGrant[]", side_effects: [] }
  - { method: GET, path: "/compliance/access-grants/{grantId}", description: "Get one access grant", roles: [ComplianceAuditor, RegionalEntityReviewer, FederalReviewer, CIPAssetManager], code: 200, input: [], output: AccessGrant, side_effects: [] }
  - { method: POST, path: "/compliance/access-grants/{grantId}/revoke", description: "ACTIVE -> REVOKED", roles: [CIPAssetManager], code: 200, input: [], output: AccessGrant, side_effects: [] }

  - { method: POST, path: "/compliance/penalties", description: "Issue the penalty for a violation (creates Penalty row in ASSESSED)", roles: [ComplianceAuditor], code: 201, input: [violation_id], output: Penalty, side_effects: ["amount = violation.proposed_penalty snapshot", "due_date = issued_at + 30 days"] }
  - { method: GET, path: "/compliance/penalties", description: "List penalties", roles: [ComplianceAuditor, RegionalEntityReviewer, FederalReviewer, EntityComplianceOfficer], code: 200, input: ["limit?", "offset?", "violation_id?", "status?"], output: "Penalty[]", side_effects: [] }
  - { method: GET, path: "/compliance/penalties/{penaltyId}", description: "Get one penalty", roles: [ComplianceAuditor, RegionalEntityReviewer, FederalReviewer, EntityComplianceOfficer], code: 200, input: [], output: Penalty, side_effects: [] }
  - { method: POST, path: "/compliance/penalties/{penaltyId}/confirm", description: "ASSESSED -> CONFIRMED", roles: [ComplianceAuditor], code: 200, input: [], output: Penalty, side_effects: ["restriction_due check for owning entity"] }
  - { method: POST, path: "/compliance/penalties/{penaltyId}/settle", description: "CONFIRMED -> SETTLED", roles: [EntityComplianceOfficer], code: 200, input: [], output: Penalty, side_effects: ["restriction_due check for owning entity"] }
  - { method: POST, path: "/compliance/penalties/{penaltyId}/waive", description: "CONFIRMED -> WAIVED (federal override)", roles: [FederalReviewer], code: 200, input: [], output: Penalty, side_effects: ["restriction_due check for owning entity"] }

  - { method: POST, path: "/compliance/violations/{violationId}/appeals", description: "File an appeal (OCC-guarded)", roles: [EntityComplianceOfficer], code: 201, input: [grounds, expected_violation_version], output: Appeal, side_effects: ["violation -> APPEALED", "increments Violation.version by 1", "entity.unresolved_appeal_count += 1"] }
  - { method: GET, path: "/compliance/appeals", description: "List appeals", roles: [ComplianceAuditor, RegionalEntityReviewer, FederalReviewer, EntityComplianceOfficer], code: 200, input: ["limit?", "offset?", "violation_id?", "status?"], output: "Appeal[]", side_effects: [] }
  - { method: GET, path: "/compliance/appeals/{appealId}", description: "Get one appeal", roles: [ComplianceAuditor, RegionalEntityReviewer, FederalReviewer, EntityComplianceOfficer], code: 200, input: [], output: Appeal, side_effects: [] }
  - { method: POST, path: "/compliance/appeals/{appealId}/grant", description: "Grant appeal (regional or federal level depending on status)", roles: [RegionalEntityReviewer, FederalReviewer], code: 200, input: [], output: Appeal, side_effects: ["violation APPEALED -> CLOSED", "final_penalty recompute", "entity counters updated"] }
  - { method: POST, path: "/compliance/appeals/{appealId}/deny", description: "Deny appeal (regional or federal level depending on status)", roles: [RegionalEntityReviewer, FederalReviewer], code: 200, input: [], output: Appeal, side_effects: ["violation APPEALED -> prior posture per plan state", "entity counters updated"] }
  - { method: POST, path: "/compliance/appeals/{appealId}/request-federal-review", description: "APPEAL_DENIED -> FEDERAL_REVIEW_REQUESTED within the federal window", roles: [EntityComplianceOfficer], code: 200, input: [], output: Appeal, side_effects: ["entity.unresolved_appeal_count += 1"] }

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing or malformed X-User-Role / X-User-ID headers" }
  - { id: ERR_UNAUTHORIZED, http: 403, condition: "Role not permitted for the endpoint" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Entity-scoped caller attempted to act on another entity's resource" }
  - { id: ERR_SOD_CONFLICT, http: 403, condition: "Segregation of duties: same user performed an earlier step of the same workflow" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Referenced id does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field, wrong type, or invalid enum value" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource is in a state from which the requested transition is undefined" }
  - { id: ERR_ENTITY_RESTRICTED, http: 409, condition: "Entity compliance_status is RESTRICTED; entity-initiated mutations are blocked" }
  - { id: ERR_STANDARD_NOT_APPLICABLE, http: 422, condition: "Referenced standard is not in the entity's applicable_standards set" }
  - { id: ERR_INVALID_INTERVAL, http: 422, condition: "Interval end not after start, or milestone due_date not in the future" }
  - { id: ERR_ENGAGEMENT_NOT_YET_OPEN, http: 409, condition: "Engagement start attempted before period_start" }
  - { id: ERR_ENGAGEMENT_NOT_IN_PROGRESS, http: 409, condition: "Evidence submitted to an engagement not in IN_PROGRESS" }
  - { id: ERR_EVIDENCE_NOT_REVIEWABLE, http: 409, condition: "Evidence accept/reject attempted while engagement is not IN_PROGRESS" }
  - { id: ERR_CIP_EVIDENCE_REQUIRED, http: 422, condition: "ACCESS_LOG evidence missing a valid ACTIVE BES cyber asset reference" }
  - { id: ERR_VIOLATION_SOURCE_INVALID, http: 422, condition: "Violation source references are missing, mismatched, or not in the required terminal state" }
  - { id: ERR_VIOLATION_STATE, http: 409, condition: "Violation not in a state that permits the requested mitigation/appeal/completion action" }
  - { id: ERR_MITIGATION_PLAN_EXISTS, http: 409, condition: "A mitigation plan already exists for this violation" }
  - { id: ERR_PLAN_STATE, http: 409, condition: "Mitigation plan not in a state that permits the requested action" }
  - { id: ERR_MILESTONES_INCOMPLETE, http: 409, condition: "complete-mitigation attempted with PENDING or MISSED milestones remaining" }
  - { id: ERR_SELF_LOG_NOT_ENROLLED, http: 422, condition: "Self-log entry attempted by an entity not enrolled in the self-logging program" }
  - { id: ERR_EMPTY_REVIEW_PERIOD, http: 422, condition: "start-review attempted on a review period with zero entries" }
  - { id: ERR_ENTRIES_UNREVIEWED, http: 409, condition: "close attempted while entries remain in LOGGED status" }
  - { id: ERR_ACTIVE_ACCESS_GRANTS, http: 409, condition: "CIP asset decommission attempted with ACTIVE access grants" }
  - { id: ERR_ASSET_DECOMMISSIONED, http: 409, condition: "Access grant attempted on a DECOMMISSIONED asset" }
  - { id: ERR_APPEAL_WINDOW_EXPIRED, http: 422, condition: "Appeal or federal-review request filed after its window closed" }
  - { id: ERR_DUPLICATE_ACTIVE_APPEAL, http: 409, condition: "An appeal is already active for this violation" }
  - { id: ERR_PENALTY_NOT_CONFIRMED, http: 409, condition: "settle/waive attempted on a penalty not in CONFIRMED status" }
  - { id: ERR_PENALTY_ALREADY_RESOLVED, http: 409, condition: "confirm attempted on a penalty not in ASSESSED status" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_violation_version does not match the current Violation.version" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: RegistrationCoordinator
    description: "Manages entity registrations and applicable standard sets"
    identity: opaque
    exclusive_operations: ["POST /compliance/registrations", "PATCH /compliance/registrations/{entityId}"]
    shared_operations: ["GET endpoints"]
  - name: ComplianceAuditor
    description: "Runs engagements, reviews evidence, triages self-reports, records violations, adjudicates mitigation plans, reviews self-log periods, issues and confirms penalties"
    identity: opaque
    exclusive_operations: ["engagement lifecycle", "evidence accept/reject", "self-report triage/confirm/dismiss", "POST /compliance/violations", "mitigation plan approve/reject/verify", "review period lifecycle", "penalty issue/confirm"]
    shared_operations: ["GET endpoints"]
  - name: EntityComplianceOfficer
    description: "Acts for a registered entity: submits evidence, self-reports, mitigation plans, milestones, appeals, self-log entries, settles penalties"
    identity: "entity_backed:RegisteredEntity"
    exclusive_operations: ["POST /compliance/evidence", "POST /compliance/self-reports", "mitigation plan create/resubmit", "milestone add/complete", "complete-mitigation", "POST /compliance/self-log-entries", "appeal create/request-federal-review", "penalty settle"]
    shared_operations: ["GET endpoints"]
  - name: CIPAssetManager
    description: "Manages CIP assets and access grants"
    identity: "entity_backed:RegisteredEntity"
    exclusive_operations: ["POST /compliance/cip-assets", "decommission", "POST /compliance/access-grants", "revoke"]
    shared_operations: ["GET endpoints"]
  - name: RegionalEntityReviewer
    description: "Regional oversight body; first-level appeal adjudication; operates the logical clock for scheduled sweeps"
    identity: opaque
    exclusive_operations: ["appeal grant/deny at APPEAL_PENDING_REVIEW", "clock set/advance"]
    shared_operations: ["GET endpoints"]
  - name: FederalReviewer
    description: "Federal review authority; second-level appeal adjudication; may waive confirmed penalties"
    identity: opaque
    exclusive_operations: ["appeal grant/deny at FEDERAL_REVIEW_REQUESTED", "POST /compliance/penalties/{penaltyId}/waive"]
    shared_operations: ["GET endpoints"]
