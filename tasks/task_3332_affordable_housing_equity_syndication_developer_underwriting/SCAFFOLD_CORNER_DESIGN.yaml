# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3332_affordable_housing_equity_syndication_developer_underwriting
#
# Breadth probe over the claim-extraction-guide taxonomy. Corners already
# exercised by SCAFFOLD_DIFFICULTY_DESIGN.yaml appear as excluded_because stubs.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: logical_clock_starts_at_the_pinned_default_instant
        claim_type: System Fields
        grounds:
          - endpoints.POST_/_clock/set_current_utc
          - entities.CapitalCall.fields.scheduled_date
          - errors[ERR_CALL_NOT_DUE]
        distinguishing_aspect: "Before any set_current_utc call the logical clock reads exactly 2026-09-01T00:00:00Z rather than wall-clock time, so a call scheduled for 2026-10-01 is still not due and ERR_CALL_NOT_DUE is returned without any clock manipulation."
        test_recipe:
          setup:
            - "Empty database, no clock call made."
          setup_api_calls:
            - call: "POST /developers"
              payload: { name: "Cedar Ridge Communities", developer_type: "FOR_PROFIT", sponsor_experience_months: 96, projects_completed: 4, net_worth_cents: 2000000000, liquid_assets_cents: 30000000 }
              as: PlatformAdmin
              captures: { dev_id: $.data.id }
            - call: "POST /investors"
              payload: { name: "Meridian Capital Group", investor_type: "BANK", committed_capacity_cents: 500000000, risk_tier: "TIER_3" }
              as: PlatformAdmin
              captures: { inv_id: $.data.id }
            - call: "POST /funds"
              payload: { fund_name: "ECP Housing Fund IV", target_equity_cents: 500000000, price_per_credit_dollar: 0.9123, target_yield_pct: 0.07, close_threshold_pct: 0.85, subscription_open_date: "2026-09-01T00:00:00Z", subscription_close_date: "2026-12-31T00:00:00Z" }
              as: Underwriter
              captures: { fund_id: $.data.id }
            - call: "POST /projects"
              payload: { developer_id: "${dev_id}", fund_id: "${fund_id}", project_name: "Riverside Commons", state_code: "OR", total_credit_dollars_cents: 912345678, construction_budget_cents: 1234567890, construction_loan_cents: 700000000, operating_pro_forma_noi_cents: 72000000, debt_service_cents: 60000000, market_study_absorption_score: 0.83, sponsor_experience_months: 96, placed_in_service_deadline: "2028-12-31T00:00:00Z", compliance_period_months: 180 }
              as: Underwriter
              captures: { proj_id: $.data.id, proj_version: $.data.version }
            - call: "POST /projects/${proj_id}/capital-calls"
              payload: { milestone: "CONSTRUCTION_START", scheduled_date: "2026-10-01T00:00:00Z", due_date: "2026-10-31T00:00:00Z", milestone_share: 0.2, expected_project_version: "${proj_version}" }
              as: AssetManager
              captures: { call_id: $.data.id }
          trigger:
            - call: "POST /capital-calls/${call_id}/transitions"
              payload: { action: "ISSUE" }
              as: AssetManager
              captures: { err: $.data.error_id }
          assert:
            - "the response status is 422 and error_id == ERR_CALL_NOT_DUE"
            - "CapitalCall.${call_id}.status == SCHEDULED"

      - name: developer_create_returns_derived_status_and_zero_counters
        claim_type: Creation
        grounds:
          - entities.Developer
          - endpoints.POST_/developers
          - calculations.sponsor_eligibility
        distinguishing_aspect: "A developer posted with no guarantees and no projects comes back 201 with status ELIGIBLE, version 1, guarantee_exposure_cents 0 and active_project_count 0 — status is never client-supplied."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-02T00:00:00Z. Empty database."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-02T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /developers"
              payload: { name: "Cedar Ridge Communities", developer_type: "FOR_PROFIT", sponsor_experience_months: 96, projects_completed: 4, net_worth_cents: 2000000000, liquid_assets_cents: 30000000 }
              as: PlatformAdmin
              captures: { dev_id: $.data.id }
          assert:
            - "the response status is 201 and response_type is object"
            - "Developer.${dev_id}.developer_type == FOR_PROFIT and net_worth_cents == 2000000000"
            - "Developer.${dev_id}.status == ELIGIBLE"
            - "Developer.${dev_id}.guarantee_exposure_cents == 0 and active_project_count == 0"
            - "Developer.${dev_id}.version == 1"
            - "meta.api_request_id and meta.api_request_timestamp are present"

      - name: fund_create_omitting_close_threshold_defaults_to_eighty_five_percent
        claim_type: Defaults
        grounds:
          - entities.SyndicationFund.fields.close_threshold_pct
          - endpoints.POST_/funds
        distinguishing_aspect: "Omitting close_threshold_pct applies the 0.85 default while every other posted field round-trips, and the fund starts FORMING with all counters at zero."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-02T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-02T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /funds"
              payload: { fund_name: "ECP Housing Fund IV", target_equity_cents: 500000000, price_per_credit_dollar: 0.9123, target_yield_pct: 0.07, subscription_open_date: "2026-09-01T00:00:00Z", subscription_close_date: "2026-12-31T00:00:00Z" }
              as: Underwriter
              captures: { fund_id: $.data.id }
          assert:
            - "SyndicationFund.${fund_id}.close_threshold_pct == 0.85"
            - "SyndicationFund.${fund_id}.status == FORMING"
            - "SyndicationFund.${fund_id}.posture == OPEN"
            - "SyndicationFund.${fund_id}.subscribed_equity_cents == 0 and funded_equity_cents == 0 and subscription_count == 0"
            - "SyndicationFund.${fund_id}.price_per_credit_dollar == 0.9123"

      - name: project_get_with_an_unknown_id_returns_project_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/projects/{project_id}
          - errors[ERR_PROJECT_NOT_FOUND]
          - validations[priority=4]
        distinguishing_aspect: "A syntactically valid but unallocated id on the project path yields the entity-specific 404 ERR_PROJECT_NOT_FOUND rather than a generic envelope or a 400."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-02T00:00:00Z. No project has been created."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-02T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /projects/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Underwriter
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 404 and error_id == ERR_PROJECT_NOT_FOUND"
            - "response_type is error and data carries both error_id and message"

      - name: subscription_create_missing_committed_cents_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.FundSubscription.fields.committed_cents
          - validations[priority=3]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "committed_cents is a required input with no default, so omitting it is a 400 ERR_INVALID_REQUEST from the shape check rather than the 422 ERR_SUBSCRIPTION_EXCEEDS_CAPACITY that an oversized value produces."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-02T00:00:00Z."
            - "Investor Meridian Capital Group exists with 500000000 cents of capacity, and fund ECP Housing Fund IV is FORMING."
          setup_api_calls:
            - &c_clock
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-02T00:00:00Z" }
              as: PlatformAdmin
            - &c_dev
              call: "POST /developers"
              payload: { name: "Cedar Ridge Communities", developer_type: "FOR_PROFIT", sponsor_experience_months: 96, projects_completed: 4, net_worth_cents: 2000000000, liquid_assets_cents: 30000000 }
              as: PlatformAdmin
              captures: { dev_id: $.data.id }
            - &c_inv
              call: "POST /investors"
              payload: { name: "Meridian Capital Group", investor_type: "BANK", committed_capacity_cents: 500000000, risk_tier: "TIER_3" }
              as: PlatformAdmin
              captures: { inv_id: $.data.id }
            - &c_fund
              call: "POST /funds"
              payload: { fund_name: "ECP Housing Fund IV", target_equity_cents: 500000000, price_per_credit_dollar: 0.9123, target_yield_pct: 0.07, close_threshold_pct: 0.85, subscription_open_date: "2026-09-01T00:00:00Z", subscription_close_date: "2026-12-31T00:00:00Z" }
              as: Underwriter
              captures: { fund_id: $.data.id, fund_v: $.data.version }
          trigger:
            - call: "POST /funds/${fund_id}/subscriptions"
              payload: { investor_id: "${inv_id}", payin_schedule: [{ milestone: "CONSTRUCTION_START", share_pct: 1.0 }], expected_fund_version: "${fund_v}" }
              as: Investor
              as_user_id: "${inv_id}"
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 400 and error_id == ERR_INVALID_REQUEST"
            - "SyndicationFund.${fund_id}.subscribed_equity_cents == 0 and subscription_count == 0"

      - name: allocation_create_under_the_wrong_project_returns_allocation_not_found
        claim_type: Parent Relationships
        grounds:
          - entities.Allocation.parent
          - errors[ERR_ALLOCATION_NOT_FOUND]
          - validations[priority=5]
        distinguishing_aspect: "An allocation that belongs to project A is not addressable through project B's path segment, so the nested POST returns ERR_ALLOCATION_NOT_FOUND rather than mutating the allocation anyway."
        test_recipe:
          setup:
            - "Two projects exist under the same developer and fund; only the first carries an allocation."
          setup_api_calls:
            - *c_clock
            - *c_dev
            - *c_inv
            - *c_fund
            - &c_proj_a
              call: "POST /projects"
              payload: { developer_id: "${dev_id}", fund_id: "${fund_id}", project_name: "Riverside Commons", state_code: "OR", total_credit_dollars_cents: 912345678, construction_budget_cents: 1234567890, construction_loan_cents: 700000000, operating_pro_forma_noi_cents: 72000000, debt_service_cents: 60000000, market_study_absorption_score: 0.83, sponsor_experience_months: 96, placed_in_service_deadline: "2028-12-31T00:00:00Z", compliance_period_months: 180 }
              as: Underwriter
              captures: { proj_a_id: $.data.id, proj_a_version: $.data.version }
            - call: "POST /projects"
              payload: { developer_id: "${dev_id}", fund_id: "${fund_id}", project_name: "Juniper Flats", state_code: "OR", total_credit_dollars_cents: 600000000, construction_budget_cents: 800000000, construction_loan_cents: 400000000, operating_pro_forma_noi_cents: 80000000, debt_service_cents: 60000000, market_study_absorption_score: 0.85, sponsor_experience_months: 96, placed_in_service_deadline: "2028-12-31T00:00:00Z", compliance_period_months: 180 }
              as: Underwriter
              captures: { proj_b_id: $.data.id }
            - call: "POST /projects/${proj_a_id}/allocations"
              payload: { action: "CREATE", state_agency: "Oregon Housing and Community Services", awarded_credit_dollars_cents: 912345678, commitment_fee_pct: 0.014, awarded_date: "2026-08-15T00:00:00Z", placed_in_service_deadline: "2028-12-31T00:00:00Z" }
              as: Underwriter
              captures: { alloc_a_id: $.data.id }
          trigger:
            - call: "POST /projects/${proj_b_id}/allocations"
              payload: { action: "RESCIND", allocation_id: "${alloc_a_id}" }
              as: AssetManager
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 404 and error_id == ERR_ALLOCATION_NOT_FOUND"
            - "Allocation.${alloc_a_id}.status == AWARDED"

      - name: project_create_ignores_an_input_supplied_status_field
        claim_type: System Fields
        grounds:
          - entities.Project.fields.status
          - endpoints.POST_/projects
        distinguishing_aspect: "An input-supplied status is not a declared input for POST /projects, so the created project starts UNDERWRITING with proportionally derived underwriting figures regardless of what the caller asked for."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-02T00:00:00Z."
          setup_api_calls:
            - *c_clock
            - *c_dev
            - *c_inv
            - *c_fund
          trigger:
            - call: "POST /projects"
              payload: { developer_id: "${dev_id}", fund_id: "${fund_id}", project_name: "Riverside Commons", state_code: "OR", total_credit_dollars_cents: 912345678, construction_budget_cents: 1234567890, construction_loan_cents: 700000000, operating_pro_forma_noi_cents: 72000000, debt_service_cents: 60000000, market_study_absorption_score: 0.83, sponsor_experience_months: 96, placed_in_service_deadline: "2028-12-31T00:00:00Z", compliance_period_months: 180 }
              as: Underwriter
              captures: { proj_id: $.data.id }
          assert:
            - "Project.${proj_id}.status == UNDERWRITING and underwriting_stage == PRELIMINARY"
            - "Project.${proj_id}.preliminary_equity_cents == 490198755 and underwritten_equity_cents == 490198755"
            - "Project.${proj_id}.final_equity_cents is null"
            - "Project.${proj_id}.dscr == 1.2 and operating_deficit_cents == 0"
            - "Project.${proj_id}.committed_credit_dollars_cents == 0 and delivered_credit_dollars_cents == 0"

      - name: subscriptions_list_paginates_and_filters_by_fund_status_and_investor
        claim_type: Listing
        grounds:
          - endpoints.GET_/subscriptions
          - response_envelope.pagination_fields
          - entities.FundSubscription.fields.status
        distinguishing_aspect: "With three subscriptions across two funds, fund_id and status filters compose with limit/offset, and total_count reports the whole filtered set rather than the page."
        test_recipe:
          setup:
            - "Three subscriptions exist: two in fund IV for Meridian and Northline, one in fund V for Meridian."
          setup_api_calls:
            - *c_clock
            - *c_dev
            - *c_inv
            - *c_fund
            - call: "POST /investors"
              payload: { name: "Northline Mutual", investor_type: "INSURANCE", committed_capacity_cents: 500000000, risk_tier: "TIER_2" }
              as: PlatformAdmin
              captures: { inv_north_id: $.data.id }
            - call: "POST /funds"
              payload: { fund_name: "ECP Housing Fund V", target_equity_cents: 400000000, price_per_credit_dollar: 0.9050, target_yield_pct: 0.065, close_threshold_pct: 0.85, subscription_open_date: "2026-09-01T00:00:00Z", subscription_close_date: "2027-06-30T00:00:00Z" }
              as: Underwriter
              captures: { fund5_id: $.data.id, fund5_v: $.data.version }
            - call: "POST /funds/${fund_id}/subscriptions"
              payload: { investor_id: "${inv_id}", committed_cents: 300000000, payin_schedule: [{ milestone: "CONSTRUCTION_START", share_pct: 1.0 }], expected_fund_version: "${fund_v}" }
              as: Investor
              as_user_id: "${inv_id}"
            - call: "POST /funds/${fund_id}/subscriptions"
              payload: { investor_id: "${inv_north_id}", committed_cents: 100000000, payin_schedule: [{ milestone: "CONSTRUCTION_START", share_pct: 1.0 }], expected_fund_version: "${fund_v}" }
              as: Investor
              as_user_id: "${inv_north_id}"
            - call: "POST /funds/${fund5_id}/subscriptions"
              payload: { investor_id: "${inv_id}", committed_cents: 200000000, payin_schedule: [{ milestone: "CONSTRUCTION_START", share_pct: 1.0 }], expected_fund_version: "${fund5_v}" }
              as: Investor
              as_user_id: "${inv_id}"
          trigger:
            - call: "GET /subscriptions"
              payload: { fund_id: "${fund_id}", limit: 1, offset: 0 }
              as: Underwriter
          assert:
            - "the response status is 200 and response_type is array"
            - "the page returns exactly 1 row with total_count == 2 and has_more == true"
            - "GET /subscriptions?fund_id=${fund_id}&limit=1&offset=1 returns exactly 1 row with total_count == 2 and has_more == false"
            - "GET /subscriptions?investor_id=${inv_north_id} returns exactly 1 row"
            - "GET /subscriptions?status=PLEDGED returns 3 rows and total_count == 3"
            - "GET /subscriptions with no query parameters returns 3 rows with limit defaulting to 10"

      - name: fund_get_returns_the_stored_configuration_unchanged
        claim_type: Retrieval
        grounds:
          - endpoints.GET_/funds/{fund_id}
          - entities.SyndicationFund
        distinguishing_aspect: "Every posted fund field round-trips through GET exactly as written, including the two ISO subscription dates and the decimal price."
        test_recipe:
          setup:
            - "Fund ECP Housing Fund IV is FORMING with the full configuration posted."
          setup_api_calls:
            - *c_clock
            - *c_dev
            - *c_inv
            - *c_fund
          trigger:
            - call: "GET /funds/${fund_id}"
              payload: {}
              as: Investor
              as_user_id: "${inv_id}"
          assert:
            - "the response status is 200"
            - "SyndicationFund.${fund_id}.fund_name == \"ECP Housing Fund IV\""
            - "SyndicationFund.${fund_id}.target_equity_cents == 500000000 and price_per_credit_dollar == 0.9123"
            - "SyndicationFund.${fund_id}.target_yield_pct == 0.07 and close_threshold_pct == 0.85"
            - "SyndicationFund.${fund_id}.subscription_open_date == \"2026-09-01T00:00:00Z\""
            - "SyndicationFund.${fund_id}.subscription_close_date == \"2026-12-31T00:00:00Z\""

  # ===========================================================================
  - section: state_machines
    instances:

      - name: commit_from_an_already_committed_project_returns_project_not_committable
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Project.transitions.UNDERWRITING_to_COMMITTED
          - errors[ERR_PROJECT_NOT_COMMITTABLE]
          - validations[priority=6]
        distinguishing_aspect: "A second commit on a project already in COMMITTED is rejected with ERR_PROJECT_NOT_COMMITTABLE and fires no side effects — the allocation statuses and the fund status are untouched."
        test_recipe:
          setup:
            - "Project Riverside Commons is COMMITTED with one COMMITTED allocation and the fund is DEPLOYING."
          setup_api_calls:
            - *c_clock
            - *c_dev
            - *c_inv
            - *c_fund
            - *c_proj_a
            - call: "POST /projects/${proj_a_id}/allocations"
              payload: { action: "CREATE", state_agency: "Oregon Housing and Community Services", awarded_credit_dollars_cents: 912345678, commitment_fee_pct: 0.014, awarded_date: "2026-08-15T00:00:00Z", placed_in_service_deadline: "2028-12-31T00:00:00Z" }
              as: Underwriter
              captures: { alloc_id: $.data.id }
            - call: "PUT /projects/${proj_a_id}"
              payload: { underwriting_action: "FINALIZE", expected_project_version: "${proj_a_version}" }
              as: Underwriter
            - call: "POST /projects/${proj_a_id}/commit"
              payload: {}
              as: Underwriter
          trigger:
            - call: "POST /projects/${proj_a_id}/commit"
              payload: {}
              as: Underwriter
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_PROJECT_NOT_COMMITTABLE"
            - "Project.${proj_a_id}.status == COMMITTED"
            - "Allocation.${alloc_id}.status == COMMITTED"
            - "SyndicationFund.${fund_id}.status == DEPLOYING"

      - name: exit_event_issue_notice_from_a_closed_event_returns_exit_event_not_pending
        claim_type: Invalid Transitions
        grounds:
          - state_machines.ExitEvent.transitions.PENDING_to_OPTION_NOTICE_ISSUED
          - errors[ERR_EXIT_EVENT_NOT_PENDING]
          - validations[priority=6]
        distinguishing_aspect: "ISSUE_NOTICE from CLOSED is rejected with ERR_EXIT_EVENT_NOT_PENDING rather than re-pricing the option, so option_price_cents keeps the value pinned by the first issuance."
        test_recipe:
          setup:
            - "Project Riverside Commons has reached COMPLIANCE_PERIOD and carries a CLOSED exit event whose option was declined."
          setup_api_calls:
            - *c_clock
            - *c_dev
            - *c_inv
            - *c_fund
            - *c_proj_a
            - call: "POST /projects/${proj_a_id}/allocations"
              payload: { action: "CREATE", state_agency: "Oregon Housing and Community Services", awarded_credit_dollars_cents: 912345678, commitment_fee_pct: 0.014, awarded_date: "2026-08-15T00:00:00Z", placed_in_service_deadline: "2028-12-31T00:00:00Z" }
              as: Underwriter
            - call: "PUT /projects/${proj_a_id}"
              payload: { underwriting_action: "FINALIZE", expected_project_version: "${proj_a_version}" }
              as: Underwriter
            - call: "POST /projects/${proj_a_id}/commit"
              payload: {}
              as: Underwriter
            - call: "POST /projects/${proj_a_id}/milestones"
              payload: { milestone: "CONSTRUCTION_START" }
              as: AssetManager
            - call: "POST /projects/${proj_a_id}/milestones"
              payload: { milestone: "LEASE_UP_50PCT" }
              as: AssetManager
            - call: "POST /projects/${proj_a_id}/milestones"
              payload: { milestone: "LEASE_UP_STABILIZED" }
              as: AssetManager
            - call: "POST /projects/${proj_a_id}/milestones"
              payload: { milestone: "PLACED_IN_SERVICE" }
              as: AssetManager
            - call: "POST /projects/${proj_a_id}/exit-events"
              payload: { exit_year: 15, rofr_notice_date: "2031-01-01T00:00:00Z", rofr_window_days: 90, exercise_deadline: "2031-06-30T00:00:00Z" }
              as: Underwriter
              captures: { exit_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2031-01-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /exit-events/${exit_id}/exercise"
              payload: { action: "ISSUE_NOTICE" }
              as: Underwriter
            - call: "POST /exit-events/${exit_id}/exercise"
              payload: { action: "DECLINE" }
              as: Underwriter
            - call: "POST /exit-events/${exit_id}/exercise"
              payload: { action: "CLOSE" }
              as: AssetManager
          trigger:
            - call: "POST /exit-events/${exit_id}/exercise"
              payload: { action: "ISSUE_NOTICE" }
              as: Underwriter
              captures: { error_id: $.data.error_id }
          assert:
            - "the response status is 409 and error_id == ERR_EXIT_EVENT_NOT_PENDING"
            - "ExitEvent.${exit_id}.status == CLOSED"
            - "Project.${proj_a_id}.status == COMPLIANCE_PERIOD"

      - name: payin_against_a_defaulted_subscription_returns_subscription_terminal
        claim_type: Idempotency
        grounds:
          - state_machines.FundSubscription.transitions.PLEDGED_to_DEFAULTED
          - errors[ERR_SUBSCRIPTION_TERMINAL]
          - validations[priority=6]
        distinguishing_aspect: "DEFAULTED is terminal for pay-ins, so a subsequent pay-in is rejected with ERR_SUBSCRIPTION_TERMINAL and leaves paid_in_cents and the fund's funded equity untouched."
        test_recipe:
          setup:
            - "Subscription S1 defaulted after a short settlement on a 460000000-cent commitment, leaving the investor SUSPENDED."
          setup_api_calls:
            - *c_clock
            - *c_dev
            - *c_inv
            - *c_fund
            - *c_proj_a
            - call: "POST /funds/${fund_id}/subscriptions"
              payload: { investor_id: "${inv_id}", committed_cents: 460000000, payin_schedule: [{ milestone: "CONSTRUCTION_START", share_pct: 0.2 }, { milestone: "CONSTRUCTION_50PCT", share_pct: 0.2 }, { milestone: "LEASE_UP_50PCT", share_pct: 0.2 }, { milestone: "LEASE_UP_STABILIZED", share_pct: 0.2 }, { milestone: "PLACED_IN_SERVICE", share_pct: 0.2 }], expected_fund_version: "${fund_v}" }
              as: Investor
              as_user_id: "${inv_id}"
              captures: { sub_id: $.data.id }
            - call: "POST /subscriptions/${sub_id}/payins"
              payload: { amount_cents: 100000000 }
              as: Investor
              as_user_id: "${inv_id}"
            - call: "POST /projects/${proj_a_id}/allocations"
