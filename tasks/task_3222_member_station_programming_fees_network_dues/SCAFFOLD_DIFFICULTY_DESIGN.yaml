              payload: {}
              as: NetworkComplianceAuditor
              captures: { st_q_ver: $.data.version }
            - call: "POST /network/dues-proposals"
              payload: { fiscal_year: 2027, proposed_base_fee_cents: 1350000, proposed_revenue_rate_bps: 275, quorum_required_votes: 1, effective_from: "2027-01-01T00:00:00Z" }
              as: NetworkGovernanceOfficer
              captures: { prop_q_id: $.data.id }
