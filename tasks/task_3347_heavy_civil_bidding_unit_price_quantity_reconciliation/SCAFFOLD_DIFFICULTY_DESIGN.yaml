- rule_id: resource_temporal_overlap
  instances:
  - name: same_bond_type_adjacent_coverage_periods_do_not_overlap
    grounds:
    - state_machines.Bond.PENDING_to_ISSUED
    - errors[ERR_RESERVATION_OVERLAP]
    - validations[priority=21]
    distinguishing_aspect: 'This rule treats coverage intervals as half-open [effective_from, effective_to): a bond

      whose interval begins exactly when the incumbent''s ends is accepted, while one that

      begins a single second earlier is rejected — adjacency is permitted, true intersection

      is not.

      '
    test_recipe:
      setup:
      - one project with a PENDING PERFORMANCE bond covering [2026-09-01, 2026-12-01) already ISSUED
      setup_api_calls:
      - call: POST /construction/_clock/set_current_utc
        payload:
          to_iso8601: '2026-09-01T00:00:00Z'
        as: PlatformAdmin
      - call: POST /construction/sureties
        payload:
          surety_name: Pacific Surety Co
          aggregate_capacity_cents: 200000000
          single_job_limit_cents: 150000000
        as: PlatformAdmin
        captures:
          s_o1: $.data.id
      - call: POST /construction/projects
        payload:
          project_code: CALTRANS-04-1J5618
          owner_agency_name: Caltrans District 4
          contract_type: UNIT_PRICE
          bid_deadline_at: '2026-12-01T00:00:00Z'
          retention_rate_pct: 5.0
          advertised_dbe_goal_pct: 0.0
        as: Estimator
        captures:
          p_o1: $.data.id
