          - entities.Resident.fields.bed_hold_days_used
          - endpoints.POST_/svh/residents/{id}/readmission
        distinguishing_aspect: |
          The cap is inclusive: bed_hold_days_used + days_between(bed_hold_started_on,
          readmission_date) <= BED_HOLD_MAX_DAYS 30. A readmission on 2026-09-02 spans 31 days and
          must be rejected, while 2026-09-01 spans exactly 30 and must succeed, landing
          bed_hold_days_used at exactly 30. An exclusive comparison rejects the 30-day readmission
          too; an off-by-one on days_between accepts the 31-day one.
