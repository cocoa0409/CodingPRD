            - call: "POST /ir/reporting-cycles/${cyc}/cohorts"
              payload: { cohort_type: "RETENTION_FT", entry_term: "FALL2025", publication_metric_key: "RETENTION_FT_FALL2025" }
              as: RegistrarOfficer
