              as: AssociationAdmin
              as_user_id: "admin-1"
              captures: { m1_id: $.data.id }
            - call: "POST /lockboxes"
              payload: { association_id: "${assoc_id}", serial_number: "LB-0001", model: "LB_STD", replacement_cost_cents: 9000, in_service_since: "2025-08-01" }
              as: AssociationAdmin
              as_user_id: "admin-1"
              captures: { box1_id: $.data.id, box1_v: $.data.version }
            - call: "POST /lockboxes"
              payload: { association_id: "${assoc_id}", serial_number: "LB-0002", model: "LB_STD", replacement_cost_cents: 9000, in_service_since: "2025-08-01" }
              as: AssociationAdmin
              as_user_id: "admin-1"
              captures: { box2_id: $.data.id, box2_v: $.data.version }
            - call: "POST /lockboxes"
              payload: { association_id: "${assoc_id}", serial_number: "LB-0003", model: "LB_STD", replacement_cost_cents: 9000, in_service_since: "2025-08-01" }
              as: AssociationAdmin
              as_user_id: "admin-1"
              captures: { box3_id: $.data.id, box3_v: $.data.version }
            - call: "POST /lockboxes/${box1_id}/state"
              payload: { action: "ASSIGN", member_id: "${m1_id}", expected_lockbox_version: "${box1_v}" }
              as: AssociationAdmin
              as_user_id: "admin-1"
            - call: "POST /lockboxes/${box2_id}/state"
              payload: { action: "ASSIGN", member_id: "${m1_id}", expected_lockbox_version: "${box2_v}" }
              as: AssociationAdmin
              as_user_id: "admin-1"
            - call: "POST /lockboxes/${box3_id}/state"
              payload: { action: "ASSIGN", member_id: "${m1_id}", expected_lockbox_version: "${box3_v}" }
              as: AssociationAdmin
              as_user_id: "admin-1"
            - call: "POST /listings"
              payload: { association_id: "${assoc_id}", listing_agent_id: "${m1_id}", address_line: "12 Pine St", mls_number: "MLS-1001" }
              as: Member
              as_user_id: "${m1_id}"
              captures: { lstA_id: $.data.id }
            - call: "POST /listings"
              payload: { association_id: "${assoc_id}", listing_agent_id: "${m1_id}", address_line: "34 Cedar Ave", mls_number: "MLS-1002" }
              as: Member
              as_user_id: "${m1_id}"
              captures: { lstB_id: $.data.id }
            - call: "POST /listings"
              payload: { association_id: "${assoc_id}", listing_agent_id: "${m1_id}", address_line: "56 Alder Way", mls_number: "MLS-1003" }
              as: Member
              as_user_id: "${m1_id}"
              captures: { lstC_id: $.data.id }
            - call: "POST /lockbox-placements"
              payload: { lockbox_id: "${box1_id}", listing_id: "${lstA_id}" }
              as: Member
              as_user_id: "${m1_id}"
              captures: { pA_id: $.data.id }
            - call: "POST /lockbox-placements"
              payload: { lockbox_id: "${box2_id}", listing_id: "${lstB_id}" }
              as: Member
              as_user_id: "${m1_id}"
              captures: { pB_id: $.data.id }
            - call: "POST /lockbox-placements"
