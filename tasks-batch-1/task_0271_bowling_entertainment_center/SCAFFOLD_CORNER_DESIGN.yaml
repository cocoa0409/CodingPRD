# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# task_0271_bowling_entertainment_center
# Breadth probe across claim-extraction-guide sections. Every active instance's
# setup_api_calls is a §1.5-conformant chain; excluded_because stubs cite a §1.8
# instance by name.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_reservation_returns_201_with_system_fields
        claim_type: Creation
        grounds: [entities.Reservation.fields.status, endpoints]
        distinguishing_aspect: "POST /reservations with all required fields returns 201; status defaults to DRAFT and id/created_at/version are system-minted."
        test_recipe:
          setup:
            - "RateCard rc, Lane L IN_SERVICE, Customer C ACTIVE."
          setup_api_calls:
            - call: "POST /rate-cards"
              payload: { name: "E1", per_game_cents: 500, per_hour_cents: 2000 }
              as: CenterManager
              captures: { rc_id: $.data.id }
            - call: "POST /lanes"
              payload: { number: 201 }
              as: CenterManager
              captures: { l_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "e1@x.com", full_name: "E1 C" }
              as: FrontDesk
              captures: { c_id: $.data.id }
          trigger:
            - call: "POST /reservations"
              payload: { customer_id: "${c_id}", rate_card_id: "${rc_id}", resource_kind: "LANE", lane_id: "${l_id}", pricing_mode: "PER_GAME", start_at: "2026-09-01T18:00:00.000Z", end_at: "2026-09-01T19:00:00.000Z", bowler_count: 2, game_count: 2 }
              as: FrontDesk
              captures: { r_id: $.data.id, r_status: $.data.status, r_version: $.data.version }
          assert:
            - "response.http_status == 201"
            - "Reservation.${r_id}.status == DRAFT"
            - "Reservation.${r_id}.version == 1"

      - name: get_reservation_not_found_returns_404
        claim_type: Not Found
        grounds: [entities.Reservation, "validations[priority=10]"]
        distinguishing_aspect: "GET /reservations/{id} on a non-existent UUID returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup:
            - "Empty DB (no reservation with this id)."
          setup_api_calls: []
          trigger:
            - call: "GET /reservations/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_NOT_FOUND"
            - "response.http_status == 404"

      - name: create_reservation_missing_required_field_returns_400
        claim_type: Required Fields
        grounds: [entities.Reservation.fields.customer_id, "validations[priority=20]"]
        distinguishing_aspect: "POST /reservations omitting required pricing_mode returns ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup:
            - "RateCard rc, Lane L, Customer C exist."
          setup_api_calls:
            - call: "POST /rate-cards"
              payload: { name: "E2", per_game_cents: 500, per_hour_cents: 2000 }
              as: CenterManager
              captures: { rc_id: $.data.id }
            - call: "POST /lanes"
              payload: { number: 202 }
              as: CenterManager
              captures: { l_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "e2@x.com", full_name: "E2 C" }
              as: FrontDesk
              captures: { c_id: $.data.id }
          trigger:
            - call: "POST /reservations"
              payload: { customer_id: "${c_id}", rate_card_id: "${rc_id}", resource_kind: "LANE", lane_id: "${l_id}", start_at: "2026-09-02T18:00:00.000Z", end_at: "2026-09-02T19:00:00.000Z", bowler_count: 2 }
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_INVALID_REQUEST"
            - "response.http_status == 400"

      - name: create_reservation_start_after_end_returns_400
        claim_type: Type Constraints
        grounds: [entities.Reservation.fields.end_at, "validations[priority=20]"]
        distinguishing_aspect: "start_at >= end_at violates the well-formedness check -> ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup:
            - "RateCard rc, Lane L, Customer C exist."
          setup_api_calls:
            - call: "POST /rate-cards"
              payload: { name: "E3", per_game_cents: 500, per_hour_cents: 2000 }
              as: CenterManager
              captures: { rc_id: $.data.id }
            - call: "POST /lanes"
              payload: { number: 203 }
              as: CenterManager
              captures: { l_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "e3@x.com", full_name: "E3 C" }
              as: FrontDesk
              captures: { c_id: $.data.id }
          trigger:
            - call: "POST /reservations"
              payload: { customer_id: "${c_id}", rate_card_id: "${rc_id}", resource_kind: "LANE", lane_id: "${l_id}", pricing_mode: "PER_GAME", start_at: "2026-09-03T19:00:00.000Z", end_at: "2026-09-03T18:00:00.000Z", bowler_count: 2, game_count: 1 }
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_INVALID_REQUEST"
            - "response.http_status == 400"

      - name: create_lane_defaults_max_bowlers_and_status
        claim_type: Defaults
        grounds: [entities.Lane.fields.max_bowlers, entities.Lane.fields.status]
        distinguishing_aspect: "Omitting max_bowlers applies default 6 and status defaults to IN_SERVICE."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /lanes"
              payload: { number: 204 }
              as: CenterManager
              captures: { l_id: $.data.id, mb: $.data.max_bowlers, st: $.data.status }
          assert:
            - "Lane.${l_id}.max_bowlers == 6"
            - "Lane.${l_id}.status == IN_SERVICE"

      - name: duplicate_lane_number_rejected
        claim_type: Type Constraints
        grounds: [entities.Lane.fields.number, "errors[ERR_DUPLICATE_LANE_NUMBER]"]
        distinguishing_aspect: "Creating a second lane with an already-used number returns ERR_DUPLICATE_LANE_NUMBER (409)."
        test_recipe:
          setup: ["Lane number 205 exists."]
          setup_api_calls:
            - call: "POST /lanes"
              payload: { number: 205 }
              as: CenterManager
              captures: { l1_id: $.data.id }
          trigger:
            - call: "POST /lanes"
              payload: { number: 205 }
              as: CenterManager
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_DUPLICATE_LANE_NUMBER"
            - "response.http_status == 409"

      - name: rental_item_computed_available_count_on_create
        claim_type: Computed Fields
        grounds: [entities.RentalItem.fields.available_count, entities.RentalItem.fields.out_on_rent_count]
        distinguishing_aspect: "On RentalItem create, available_count is computed = total_count and out_on_rent_count = 0, ignoring any client-supplied values."
        test_recipe:
          setup: ["Empty DB."]
          setup_api_calls: []
          trigger:
            - call: "POST /rental-items"
              payload: { kind: "BUMPER", label: "std", unit_price_cents: 0, total_count: 8 }
              as: CenterManager
              captures: { ri_id: $.data.id, avail: $.data.available_count, out: $.data.out_on_rent_count }
          assert:
            - "RentalItem.${ri_id}.available_count == 8"
            - "RentalItem.${ri_id}.out_on_rent_count == 0"

      - name: food_order_line_immutable_no_version_field
        claim_type: Immutability
        grounds: [entities.FoodOrderLine]
        distinguishing_aspect: "FoodOrderLine has common_fields:false — it carries id and created_at only, no version; it is created and deleted but never PUT/PATCHed (no update endpoint exists)."
        test_recipe:
          setup:
            - "RateCard rc, Lane L, Customer C, FoodItem FI, a HELD Reservation R with one food line."
          setup_api_calls:
            - call: "POST /rate-cards"
              payload: { name: "E4", per_game_cents: 0, per_hour_cents: 0, deposit_pct_bps: 2000 }
              as: CenterManager
              captures: { rc_id: $.data.id }
            - call: "POST /lanes"
              payload: { number: 206 }
              as: CenterManager
              captures: { l_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "e4@x.com", full_name: "E4 C" }
              as: FrontDesk
              captures: { c_id: $.data.id }
            - call: "POST /food-items"
              payload: { name: "Fries", unit_cents: 300, taxable: true }
              as: CenterManager
              captures: { fi_id: $.data.id }
            - call: "POST /reservations"
              payload: { customer_id: "${c_id}", rate_card_id: "${rc_id}", resource_kind: "LANE", lane_id: "${l_id}", pricing_mode: "PER_GAME", start_at: "2026-09-04T18:00:00.000Z", end_at: "2026-09-04T19:00:00.000Z", bowler_count: 2, game_count: 0 }
              as: FrontDesk
              captures: { r_id: $.data.id }
            - call: "POST /reservations/${r_id}/hold"
              payload: {}
              as: FrontDesk
            - call: "POST /food-lines"
              payload: { reservation_id: "${r_id}", food_item_id: "${fi_id}", quantity: 2 }
              as: FrontDesk
              captures: { fl_id: $.data.id }
          trigger:
            - call: "GET /food-lines/${fl_id}"
              payload: {}
              as: FrontDesk
              captures: { line_total: $.data.line_total_cents }
          assert:
            - "FoodOrderLine.${fl_id}.line_total_cents == 650 (gross 600 + tax round_half_up(600*0.0825=49.5)=50)"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: confirm_from_draft_invalid_state
        claim_type: Invalid Transitions
        grounds: [state_machines.Reservation.HELD_to_CONFIRMED, "validations[priority=30]"]
        distinguishing_aspect: "Confirming a DRAFT reservation (never held) is an invalid transition -> ERR_INVALID_STATE (409); no HELD prerequisite met."
        test_recipe:
          setup:
            - "RateCard rc, Lane L, Customer C, a DRAFT Reservation R (not held)."
          setup_api_calls:
            - call: "POST /rate-cards"
              payload: { name: "S1", per_game_cents: 500, per_hour_cents: 0, deposit_pct_bps: 2000 }
              as: CenterManager
              captures: { rc_id: $.data.id }
            - call: "POST /lanes"
              payload: { number: 211 }
              as: CenterManager
              captures: { l_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "s1@x.com", full_name: "S1 C" }
              as: FrontDesk
              captures: { c_id: $.data.id }
            - call: "POST /reservations"
              payload: { customer_id: "${c_id}", rate_card_id: "${rc_id}", resource_kind: "LANE", lane_id: "${l_id}", pricing_mode: "PER_GAME", start_at: "2026-09-05T18:00:00.000Z", end_at: "2026-09-05T19:00:00.000Z", bowler_count: 2, game_count: 1 }
              as: FrontDesk
              captures: { r_id: $.data.id, v0: $.data.version }
          trigger:
            - call: "POST /reservations/${r_id}/confirm"
              payload: { expected_reservation_version: "${v0}" }
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_INVALID_STATE"
            - "response.http_status == 409"

      - name: cancel_from_cancelled_terminal_lockdown
        claim_type: Terminal State Lockdown
        grounds: [state_machines.Reservation.HELD_to_CANCELLED, "validations[priority=30]"]
        distinguishing_aspect: "A second cancel on an already CANCELLED reservation is rejected ERR_INVALID_STATE (409) — terminal state admits no transitions."
        test_recipe:
          setup:
            - "RateCard rc, Lane L, Customer C, Reservation R HELD then CANCELLED."
          setup_api_calls:
            - call: "POST /rate-cards"
              payload: { name: "S2", per_game_cents: 500, per_hour_cents: 0, deposit_pct_bps: 2000 }
              as: CenterManager
              captures: { rc_id: $.data.id }
            - call: "POST /lanes"
              payload: { number: 212 }
              as: CenterManager
              captures: { l_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "s2@x.com", full_name: "S2 C" }
              as: FrontDesk
              captures: { c_id: $.data.id }
            - call: "POST /reservations"
              payload: { customer_id: "${c_id}", rate_card_id: "${rc_id}", resource_kind: "LANE", lane_id: "${l_id}", pricing_mode: "PER_GAME", start_at: "2026-09-06T18:00:00.000Z", end_at: "2026-09-06T19:00:00.000Z", bowler_count: 2, game_count: 1 }
              as: FrontDesk
              captures: { r_id: $.data.id }
            - call: "POST /reservations/${r_id}/hold"
              payload: {}
              as: FrontDesk
            - call: "POST /reservations/${r_id}/cancel"
              payload: {}
              as: FrontDesk
          trigger:
            - call: "POST /reservations/${r_id}/cancel"
              payload: {}
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_INVALID_STATE"
            - "response.http_status == 409"

      - name: initial_state_reservation_is_draft
        claim_type: Initial State
        grounds: [state_machines.Reservation.DRAFT_to_HELD, entities.Reservation.fields.status]
        distinguishing_aspect: "A newly created reservation starts in the declared initial_state DRAFT."
        test_recipe:
          setup: ["RateCard rc, Lane L, Customer C exist."]
          setup_api_calls:
            - call: "POST /rate-cards"
              payload: { name: "S3", per_game_cents: 500, per_hour_cents: 0 }
              as: CenterManager
              captures: { rc_id: $.data.id }
            - call: "POST /lanes"
              payload: { number: 213 }
              as: CenterManager
              captures: { l_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "s3@x.com", full_name: "S3 C" }
              as: FrontDesk
              captures: { c_id: $.data.id }
          trigger:
            - call: "POST /reservations"
              payload: { customer_id: "${c_id}", rate_card_id: "${rc_id}", resource_kind: "LANE", lane_id: "${l_id}", pricing_mode: "PER_GAME", start_at: "2026-09-07T18:00:00.000Z", end_at: "2026-09-07T19:00:00.000Z", bowler_count: 2, game_count: 1 }
              as: FrontDesk
              captures: { r_id: $.data.id, st: $.data.status }
          assert:
            - "Reservation.${r_id}.status == DRAFT"

      - name: complete_blocked_when_rentals_outstanding
        claim_type: Precondition Enforcement
        grounds: [state_machines.Reservation.CHECKED_IN_to_COMPLETED, "validations[priority=41]", "errors[ERR_RENTALS_OUTSTANDING]"]
        distinguishing_aspect: "Completing a CHECKED_IN reservation with an OPEN rental line is rejected ERR_RENTALS_OUTSTANDING (409) — the Reservation->RentalLine precondition."
        test_recipe:
          setup:
            - "RateCard rc, Lane L, Customer C, RentalItem RI total_count=4, Reservation R held->confirmed->checked-in (clock within window), one OPEN rental line."
          setup_api_calls:
            - call: "POST /rate-cards"
              payload: { name: "S4", per_game_cents: 500, per_hour_cents: 0, deposit_pct_bps: 2000 }
              as: CenterManager
              captures: { rc_id: $.data.id }
            - call: "POST /lanes"
              payload: { number: 214 }
              as: CenterManager
              captures: { l_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "s4@x.com", full_name: "S4 C" }
              as: FrontDesk
              captures: { c_id: $.data.id }
            - call: "POST /rental-items"
              payload: { kind: "SHOES", label: "W8", unit_price_cents: 300, total_count: 4 }
              as: CenterManager
              captures: { ri_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { now_utc: "2026-09-08T17:55:00.000Z" }
              as: FrontDesk
            - call: "POST /reservations"
              payload: { customer_id: "${c_id}", rate_card_id: "${rc_id}", resource_kind: "LANE", lane_id: "${l_id}", pricing_mode: "PER_GAME", start_at: "2026-09-08T18:00:00.000Z", end_at: "2026-09-08T19:00:00.000Z", bowler_count: 2, game_count: 1 }
              as: FrontDesk
              captures: { r_id: $.data.id }
            - call: "POST /reservations/${r_id}/hold"
              payload: {}
              as: FrontDesk
            - call: "POST /rental-lines"
              payload: { reservation_id: "${r_id}", rental_item_id: "${ri_id}", quantity: 2 }
              as: FrontDesk
              captures: { rl_id: $.data.id }
            - call: "GET /reservations/${r_id}"
              payload: {}
              as: FrontDesk
              captures: { v_after_rental: $.data.version }
            - call: "POST /reservations/${r_id}/confirm"
              payload: { expected_reservation_version: "${v_after_rental}" }
              as: FrontDesk
            - call: "POST /reservations/${r_id}/check-in"
              payload: {}
              as: FrontDesk
          trigger:
            - call: "POST /reservations/${r_id}/complete"
              payload: {}
              as: FrontDesk
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_RENTALS_OUTSTANDING"
            - "response.http_status == 409"

      - name: close_league_blocked_with_scheduled_nights
        claim_type: Precondition Enforcement
        grounds: [state_machines.League.ACTIVE_to_CLOSED, "errors[ERR_LEAGUE_HAS_SCHEDULED_NIGHTS]"]
        distinguishing_aspect: "Closing an ACTIVE league while a night remains SCHEDULED is rejected ERR_LEAGUE_HAS_SCHEDULED_NIGHTS (409)."
        test_recipe:
          setup:
            - "RateCard rc, one lane, League LG ACTIVE with one still-SCHEDULED night."
          setup_api_calls:
            - call: "POST /rate-cards"
              payload: { name: "S5", per_game_cents: 0, per_hour_cents: 0 }
              as: CenterManager
              captures: { rc_id: $.data.id }
            - call: "POST /lanes"
              payload: { number: 215 }
              as: CenterManager
              captures: { l_id: $.data.id }
            - call: "POST /leagues"
              payload: { name: "Open League", rate_card_id: "${rc_id}", season_night_count: 1, lanes_per_night: 1, weekly_fee_cents: 5000 }
              as: LeagueAdmin
              captures: { lg_id: $.data.id }
            - call: "POST /league-nights"
              payload: { league_id: "${lg_id}", night_index: 1, start_at: "2026-09-10T18:00:00.000Z", end_at: "2026-09-10T20:00:00.000Z" }
              as: LeagueAdmin
              captures: { n_id: $.data.id }
            - call: "POST /leagues/${lg_id}/activate"
              payload: {}
              as: LeagueAdmin
          trigger:
            - call: "POST /leagues/${lg_id}/close"
              payload: {}
              as: LeagueAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_LEAGUE_HAS_SCHEDULED_NIGHTS"
            - "response.http_status == 409"

      - name: activate_league_with_no_nights_rejected
        claim_type: Precondition Enforcement
        grounds: [state_machines.League.DRAFT_to_ACTIVE, "errors[ERR_LEAGUE_NO_NIGHTS]"]
        distinguishing_aspect: "Activating a DRAFT league that has no scheduled nights is rejected ERR_LEAGUE_NO_NIGHTS (409)."
        test_recipe:
          setup: ["RateCard rc, League LG DRAFT with zero nights."]
          setup_api_calls:
            - call: "POST /rate-cards"
              payload: { name: "S6", per_game_cents: 0, per_hour_cents: 0 }
              as: CenterManager
              captures: { rc_id: $.data.id }
            - call: "POST /leagues"
              payload: { name: "Empty League", rate_card_id: "${rc_id}", season_night_count: 2, lanes_per_night: 1, weekly_fee_cents: 5000 }
              as: LeagueAdmin
              captures: { lg_id: $.data.id }
          trigger:
            - call: "POST /leagues/${lg_id}/activate"
              payload: {}
              as: LeagueAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response.error_id == ERR_LEAGUE_NO_NIGHTS"
            - "response.http_status == 409"

      - name: no_show_requires_past_end_window
        claim_type: Precondition Enforcement
        grounds: [state_machines.Reservation.CONFIRMED_to_NO_SHOW, entities.Reservation.fields.refund_cents]
        distinguishing_aspect: "Marking a CONFIRMED reservation NO_SHOW after current_utc passes end_at forfeits the deposit: refund_cents == 0 and Customer.deposit_balance_cents drops by the held amount."
        test_recipe:
          setup:
            - "RateCard rc deposit 20%, Lane L, Customer C, Reservation R held->confirmed; clock advanced past end_at."
          setup_api_calls:
            - call: "POST /rate-cards"
              payload: { name: "S7", per_game_cents: 1000, per_hour_cents: 0, deposit_pct_bps: 2000 }
              as: CenterManager
              captures: { rc_id: $.data.id }
            - call: "POST /lanes"
              payload: { number: 216 }
              as: CenterManager
              captures: { l_id: $.data.id }
            - call: "POST /customers"
              payload: { email: "s7@x.com", full_name: "S7 C" }
              as: FrontDesk
              captures: { c_id: $.data.id }
            - call: "POST /_clock/set"
              payload: { now_utc: "2026-09-11T17:00:00.000Z" }
              as: FrontDesk
            - call: "POST /reservations"
              payload: { customer_id: "${c_id}", rate_card_id: "${rc_id}", resource_kind: "LANE", lane_id: "${l_id}", pricing_mode: "PER_GAME", start_at: "2026-09-11T18:00:00.000Z", end_at: "2026-09-11T19:00:00.000Z", bowler_count: 2, game_count: 3 }
              as: FrontDesk
              captures: { r_id: $.data.id }
            - call: "POST /reservations/${r_id}/hold"
              payload: {}
              as: FrontDesk
              captures: { v_held: $.data.version }
            - call: "POST /reservations/${r_id}/confirm"
              payload: { expected_reservation_version: "${v_held}" }
              as: FrontDesk
            - call: "POST /_clock/set"
              payload: { now_utc: "2026-09-11T20:00:00.000Z" }
              as: FrontDesk
          trigger:
            - call: "POST /reservations/${r_id}/no-show"
              payload: {}
              as: FrontDesk
              captures: { refund: $.data.refund_cents, st: $.data.status }
            - call: "GET /customers/${c_id}"
              payload: {}
              as: FrontDesk
              captures: { bal: $.data.deposit_balance_cents }
          assert:
            - "Reservation.${r_id}.status == NO_SHOW"
            - "Reservation.${r_id}.refund_cents == 0"
            - "Customer.${c_id}.deposit_balance_cents == 0"

      - name: revision_loop_reprice_reconciles_deposit_delta
        claim_type: Side Effect Execution
        grounds: [state_machines.Reservation.CONFIRMED_to_HELD, calculations.deposit_amount, entities.Customer.fields.deposit_balance_cents]
        distinguishing_aspect: "Revise re-prices the booking and reconciles the deposit delta: raising game_count from 2 to 4 (per_game 1000, 2 bowlers) lifts quoted 4000->8000 and deposit 800->1600, so Customer.deposit_balance_cents moves 800->1600."
        test_recipe:
          setup:
            - "RateCard rc per_game_cents=1000 deposit 20%, Lane L, Customer C, Reservation R held (2 bowlers, 2 games) then confirmed."
          setup_api_calls:
            - call: "POST /rate-cards"
              payload: { name: "S8", per_game_cents: 1000, per_hour_cents: 0, deposit_pct_bps: 2000 }
              as: CenterManager
              captures: { rc_id: $.data.id }
            - call: "POST /lanes"
              payload: { number: 217 }
              as: CenterManager
