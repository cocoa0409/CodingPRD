      - name: cycle_window_buffer_conflict_closed_interval
        grounds:
          - validations[priority=11]
          - entities.MarketCycle.fields.fulfillment_date
          - entities.MarketCycle.fields.region_code
          - errors[ERR_CYCLE_WINDOW_CONFLICT]
        distinguishing_aspect: "MarketCycle interval semantics = closed window + 24h buffer, region-scoped: a new R1 cycle opening 2026-06-06T12:00Z sits only 12h after the existing R1 cycle's fulfillment 2026-06-06T00:00Z (< CYCLE_BUFFER_HOURS=24) and is rejected — buffer geometry distinct from the half-open aggregate-capacity delivery slot, on a different resource entity."
