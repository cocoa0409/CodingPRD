            - { call: "POST /schools", payload: { tournament_id: "${t}", name: "Alpha" }, as: TournamentDirector, captures: { s_a: $.data.id } }
            - { call: "POST /judges", payload: { tournament_id: "${t}", school_id: "${s_a}", name: "J-Alpha" }, as: SchoolCoach, as_user_id: "${s_a}", captures: { j_a: $.data.id } }
          trigger:
            - { call: "POST /judge-conflicts", payload: { judge_id: "${j_a}", school_id: "${s_a}", reason: "alum" }, as: SchoolCoach, as_user_id: "${s_a}", captures: { jc: $.data.id } }
            - { call: "GET /judge-conflicts/${jc}", as: TournamentDirector }
          assert:
            - "JudgeConflict.${jc} response contains id and created_at"
            - "JudgeConflict.${jc} response contains no version field and no updated_at field"
  # -------------------------------------------------------- state_machines ---
  - section: state_machines
    instances:
      - name: entry_withdraw_after_lock_rejected
        claim_type: invalid_transition
        grounds: ["state_machines.Entry.CONFIRMED_to_WITHDRAWN", "validations[priority=5]"]
        distinguishing_aspect: "Withdrawal is only legal while the tournament is REGISTRATION_OPEN; after lock the same request fails with ERR_TOURNAMENT_PHASE_FORBIDDEN and the entry stays CONFIRMED."
        test_recipe:
          setup:
            - "Tournament locked; school Alpha CONFIRMED with 1 confirmed entry and 1 committed 4-round judge (prelim_round_count 4)."
          setup_api_calls:
            - { call: "POST /tournaments", payload: { name: "WL", registration_opens_at: "2026-08-01T00:00:00Z", registration_locks_at: "2026-08-10T00:00:00Z" }, as: TournamentDirector, captures: { t: $.data.id } }
            - { call: "POST /divisions", payload: { tournament_id: "${t}", event_type: "DEBATE", event_code: "CX", division: "VARSITY" }, as: TournamentDirector, captures: { d: $.data.id } }
            - { call: "POST /schools", payload: { tournament_id: "${t}", name: "Alpha" }, as: TournamentDirector, captures: { s_a: $.data.id } }
            - { call: "POST /tournaments/${t}/open-registration", as: TournamentDirector }
            - { call: "POST /entries", payload: { school_id: "${s_a}", division_id: "${d}", competitor_name: "A-One" }, as: SchoolCoach, as_user_id: "${s_a}", captures: { e1: $.data.id } }
            - { call: "POST /entries/${e1}/confirm", as: SchoolCoach, as_user_id: "${s_a}" }
            - { call: "POST /judges", payload: { tournament_id: "${t}", school_id: "${s_a}", name: "J-Alpha" }, as: SchoolCoach, as_user_id: "${s_a}", captures: { j_a: $.data.id } }
            - { call: "POST /judges/${j_a}/commit", payload: { commitment_rounds: 4 }, as: SchoolCoach, as_user_id: "${s_a}" }
            - { call: "POST /schools/${s_a}/confirm", as: SchoolCoach, as_user_id: "${s_a}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: TournamentDirector }
            - { call: "GET /tournaments/${t}", as: TournamentDirector, captures: { t_v: $.data.version } }
            - { call: "POST /tournaments/${t}/lock-registration", payload: { expected_tournament_version: "${t_v}" }, as: TournamentDirector }
          trigger:
            - { call: "POST /entries/${e1}/withdraw", as: SchoolCoach, as_user_id: "${s_a}", captures: { err: $.data.error_id } }
            - { call: "GET /entries/${e1}", as: SchoolCoach, as_user_id: "${s_a}" }
          assert:
            - "error_id == ERR_TOURNAMENT_PHASE_FORBIDDEN"
            - "Entry.${e1}.status == CONFIRMED (unchanged)"

      - name: entry_reconfirm_cycle_restores_invoice
        claim_type: cyclic_transition
        grounds: ["state_machines.Entry.WITHDRAWN_to_CONFIRMED"]
        distinguishing_aspect: "The WITHDRAWN -> CONFIRMED loop is legal pre-lock: after confirm -> withdraw -> confirm, the entry is CONFIRMED again and the invoice is 2500 (fee re-charged exactly once)."
        test_recipe:
          setup: ["tournament (fee 2500), division, school Alpha, registration open, one entry"]
          setup_api_calls:
            - { call: "POST /tournaments", payload: { name: "RC", registration_opens_at: "2026-08-01T00:00:00Z", registration_locks_at: "2026-08-10T00:00:00Z", entry_fee_cents: 2500 }, as: TournamentDirector, captures: { t: $.data.id } }
            - { call: "POST /divisions", payload: { tournament_id: "${t}", event_type: "DEBATE", event_code: "CX", division: "VARSITY" }, as: TournamentDirector, captures: { d: $.data.id } }
            - { call: "POST /schools", payload: { tournament_id: "${t}", name: "Alpha" }, as: TournamentDirector, captures: { s_a: $.data.id } }
            - { call: "POST /tournaments/${t}/open-registration", as: TournamentDirector }
            - { call: "POST /entries", payload: { school_id: "${s_a}", division_id: "${d}", competitor_name: "A-One" }, as: SchoolCoach, as_user_id: "${s_a}", captures: { e1: $.data.id } }
          trigger:
            - { call: "POST /entries/${e1}/confirm", as: SchoolCoach, as_user_id: "${s_a}" }
            - { call: "POST /entries/${e1}/withdraw", as: SchoolCoach, as_user_id: "${s_a}" }
            - { call: "POST /entries/${e1}/confirm", as: SchoolCoach, as_user_id: "${s_a}" }
            - { call: "GET /entries/${e1}", as: SchoolCoach, as_user_id: "${s_a}" }
            - { call: "GET /schools/${s_a}", as: SchoolCoach, as_user_id: "${s_a}" }
          assert:
            - "Entry.${e1}.status == CONFIRMED after the WITHDRAWN -> CONFIRMED loop"
            - "School.${s_a}.invoice_balance_cents == 2500 (exactly one active fee after the cycle)"
            - "School.${s_a}.confirmed_entry_count == 1"

      - name: round_tabulate_requires_all_verified_rejected
        claim_type: precondition_enforcement
        grounds: ["state_machines.Round.BALLOTS_OPEN_to_TABULATED"]
        distinguishing_aspect: "Tabulate with a pairing still at BALLOT_SUBMITTED (ballot submitted but not verified) fails with ERR_ROUND_INVALID_STATE and the round stays BALLOTS_OPEN."
        test_recipe:
          setup:
            - "Tournament (prelim_round_count 2), DEBATE/CX/VARSITY, schools Alpha and Beta with 1 confirmed entry each, school Epsilon with 1 committed judge; locked; round 1 paired (A1,B1), staffed, ballots open; ballot submitted but NOT verified."
          setup_api_calls:
            - { call: "POST /tournaments", payload: { name: "TV", registration_opens_at: "2026-08-01T00:00:00Z", registration_locks_at: "2026-08-10T00:00:00Z", prelim_round_count: 2 }, as: TournamentDirector, captures: { t: $.data.id } }
            - { call: "POST /divisions", payload: { tournament_id: "${t}", event_type: "DEBATE", event_code: "CX", division: "VARSITY" }, as: TournamentDirector, captures: { d: $.data.id } }
            - { call: "POST /schools", payload: { tournament_id: "${t}", name: "Alpha" }, as: TournamentDirector, captures: { s_a: $.data.id } }
            - { call: "POST /schools", payload: { tournament_id: "${t}", name: "Beta" }, as: TournamentDirector, captures: { s_b: $.data.id } }
            - { call: "POST /schools", payload: { tournament_id: "${t}", name: "Epsilon" }, as: TournamentDirector, captures: { s_e: $.data.id } }
            - { call: "POST /tournaments/${t}/open-registration", as: TournamentDirector }
            - { call: "POST /entries", payload: { school_id: "${s_a}", division_id: "${d}", competitor_name: "A-One" }, as: SchoolCoach, as_user_id: "${s_a}", captures: { e_a1: $.data.id } }
            - { call: "POST /entries", payload: { school_id: "${s_b}", division_id: "${d}", competitor_name: "B-One" }, as: SchoolCoach, as_user_id: "${s_b}", captures: { e_b1: $.data.id } }
            - { call: "POST /entries/${e_a1}/confirm", as: SchoolCoach, as_user_id: "${s_a}" }
            - { call: "POST /entries/${e_b1}/confirm", as: SchoolCoach, as_user_id: "${s_b}" }
            - { call: "POST /judges", payload: { tournament_id: "${t}", school_id: "${s_a}", name: "J-Alpha" }, as: SchoolCoach, as_user_id: "${s_a}", captures: { j_a: $.data.id } }
            - { call: "POST /judges/${j_a}/commit", payload: { commitment_rounds: 2 }, as: SchoolCoach, as_user_id: "${s_a}" }
            - { call: "POST /judges", payload: { tournament_id: "${t}", school_id: "${s_b}", name: "J-Beta" }, as: SchoolCoach, as_user_id: "${s_b}", captures: { j_b: $.data.id } }
            - { call: "POST /judges/${j_b}/commit", payload: { commitment_rounds: 2 }, as: SchoolCoach, as_user_id: "${s_b}" }
            - { call: "POST /judges", payload: { tournament_id: "${t}", school_id: "${s_e}", name: "J-Epsilon-1" }, as: SchoolCoach, as_user_id: "${s_e}", captures: { j_e1: $.data.id } }
            - { call: "POST /judges/${j_e1}/commit", payload: { commitment_rounds: 2 }, as: SchoolCoach, as_user_id: "${s_e}" }
            - { call: "POST /schools/${s_a}/confirm", as: SchoolCoach, as_user_id: "${s_a}" }
            - { call: "POST /schools/${s_b}/confirm", as: SchoolCoach, as_user_id: "${s_b}" }
            - { call: "POST /schools/${s_e}/confirm", as: SchoolCoach, as_user_id: "${s_e}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-10T00:00:00Z" }, as: TournamentDirector }
            - { call: "GET /tournaments/${t}", as: TournamentDirector, captures: { t_v: $.data.version } }
            - { call: "POST /tournaments/${t}/lock-registration", payload: { expected_tournament_version: "${t_v}" }, as: TournamentDirector }
            - { call: "POST /rounds", payload: { division_id: "${d}", round_number: 1, kind: "PRELIM", starts_at: "2026-08-12T14:00:00Z", ends_at: "2026-08-12T15:30:00Z" }, as: TabStaff, captures: { r1: $.data.id, r1_v: $.data.version } }
            - { call: "POST /tournaments/${t}/start-prelims", as: TournamentDirector }
            - { call: "POST /rooms", payload: { tournament_id: "${t}", name: "Room 1" }, as: TournamentDirector, captures: { rm1: $.data.id } }
            - { call: "POST /rounds/${r1}/generate-pairings", payload: { expected_round_version: "${r1_v}" }, as: TabStaff }
            - { call: "GET /pairings?round_id=${r1}", as: TabStaff, captures: { p1: "$.data[0].id" } }
            - { call: "POST /pairings/${p1}/assign-room", payload: { room_id: "${rm1}" }, as: TabStaff }
            - { call: "POST /pairings/${p1}/assign-judge", payload: { judge_id: "${j_e1}" }, as: TabStaff }
            - { call: "POST /rounds/${r1}/open-ballots", as: TabStaff }
            - { call: "GET /pairing-entries?pairing_id=${p1}", as: TabStaff, captures: { p1w: "$.data[0].entry_id", p1l: "$.data[1].entry_id" } }
            - { call: "POST /ballots", payload: { pairing_id: "${p1}", winner_entry_id: "${p1w}", speaker_points: { "${p1w}": 27, "${p1l}": 25 } }, as: Judge, as_user_id: "${j_e1}", captures: { b1: $.data.id } }
            - { call: "POST /ballots/${b1}/submit", as: Judge, as_user_id: "${j_e1}" }
          trigger:
            - { call: "POST /rounds/${r1}/tabulate", as: TabStaff, captures: { err: $.data.error_id } }
