              payload: {}
              as: StoreManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NO_DAYPARTS_DEFINED"
            - "StoreDay.${sd_id}.status == PLANNING"

      - name: double_claim_rejected_second_time
        claim_type: idempotency
        grounds:
          - state_machines.Order.fulfillment_READY_to_fulfillment_PICKED_UP
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "Claiming twice with the correct code: the first succeeds (PICKED_UP), the second hits terminal-state lockdown with ERR_INVALID_STATE — no double fulfillment."
        test_recipe:
          setup:
            - "StoreDay 2026-10-10 opened; LUNCH daypart ACTIVE; locker; portal order READY with code"
          setup_api_calls:
            - call: "POST /store-days"
