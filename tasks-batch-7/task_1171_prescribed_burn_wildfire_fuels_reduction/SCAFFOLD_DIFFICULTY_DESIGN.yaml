            - { call: "POST /executions/${ex}/declare-escape", payload: {}, as: BurnBoss, as_user_id: "${bossA}" }
            - { call: "GET /executions/${ex}/incidents", payload: {}, as: Any, captures: {i1: "$.data[0].id"} }
            - { call: "POST /incidents/${i1}/confirm", payload: {}, as: IncidentCommander }
            - { call: "POST /incidents/${i1}/mark-contained", payload: {}, as: IncidentCommander }
            - { call: "POST /incidents/${i1}/close", payload: {}, as: IncidentCommander }
            - { call: "POST /incidents/${i1}/assess-costs", payload: {suppression_cost_cents: 3000000, escaped_acres: 60}, as: IncidentCommander }
            - { call: "POST /incidents/${i1}/liability-claims", payload: {}, as: IncidentCommander, captures: {c1: $.data.id} }
            - { call: "POST /liability-claims/${c1}/begin-investigation", payload: {}, as: AssociationAdmin }
            - { call: "POST /executions/${ex}/incidents", payload: {incident_type: "SPOT"}, as: IncidentCommander, captures: {i2: $.data.id} }
            - { call: "POST /incidents/${i2}/confirm", payload: {}, as: IncidentCommander }
            - { call: "POST /incidents/${i2}/mark-contained", payload: {}, as: IncidentCommander }
            - { call: "POST /incidents/${i2}/close", payload: {}, as: IncidentCommander }
            - { call: "POST /incidents/${i2}/assess-costs", payload: {suppression_cost_cents: 3000000, escaped_acres: 60}, as: IncidentCommander }
            - { call: "POST /incidents/${i2}/liability-claims", payload: {}, as: IncidentCommander, captures: {c2: $.data.id} }
