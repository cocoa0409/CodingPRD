          assert:
            - "the create response status is 404 with data.error_id == ERR_LOOP_NOT_FOUND"
            - "the list response has total_count == 0"

      - name: upstream_segment_chain_rejects_a_cycle_and_a_cross_loop_link
        claim_type: graph
        grounds:
          - complexity_profile.entity_topology
          - entities.PipeSegment.fields.upstream_segment_id
          - validations[priority=8]
          - errors[ERR_SEGMENT_CYCLE]
        distinguishing_aspect: "The self-referential upstream_segment_id chain must terminate at a null-upstream segment inside the same loop, so a create whose upstream sits on a different loop returns HTTP 409 ERR_SEGMENT_CYCLE while a well-formed two-hop chain on one loop succeeds."
        test_recipe:
          setup:
            - "NetworkLoop LOOP-Z1 with root PipeSegment SEG-Z1 (upstream null) and NetworkLoop LOOP-Z2 with root PipeSegment SEG-Y1."
