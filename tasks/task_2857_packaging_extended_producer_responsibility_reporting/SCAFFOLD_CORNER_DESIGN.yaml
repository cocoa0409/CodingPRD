            - "After the trigger: Registration.${reg_id}.compliance_posture == DELINQUENT"
            - "PackagingReport.${rep_old_id}.submission_status == DRAFT and line_count == 0"
            - "Membership.${mem_id}.status == TERMINATED with decision_reason == SUPERSEDED_BY_NEW_MEMBERSHIP"
            - "Membership.${mem_2_id}.status == PENDING, membership_fee_cents == 0, fee_payment_status == OUTSTANDING and fee_schedule_version_pinned == null"
            - "Registration.${reg_id}.reported_weight_kg_ytd == 5.500 (unchanged by the membership switch)"

      - name: eco_modulation_clamp_bounds_and_discount_only_policy
        claim_type: correct_result
        grounds:
          - calculations.eco_modulation_adjustment.formula
          - calculations.eco_modulation_adjustment.constants
        excluded_because:
          difficulty_instance: combinatorial_formula / eco_modulation_mode_a_nested_min_max_clamp
          rationale: "That instance walks the nested min/max clamp and the DISCOUNT_ONLY waiver with pre-computed cent literals for each mode."

      - name: report_fee_total_honours_the_state_rounding_order
        claim_type: correct_result
        grounds:
          - calculations.report_fee_total.formula
          - entities.StateProgram.fields.fee_rounding_order
        excluded_because:
          difficulty_instance: combinatorial_formula / fee_rounding_order_mode_b_per_line_then_sum_vs_sum_then_round
          rationale: "That instance prices identical line data under both orders and asserts the divergent subtotals."

      - name: invoice_admin_fee_bracket_is_keyed_on_the_subtotal
        claim_type: constants_applied
        grounds:
          - calculations.invoice_administrative_fee
          - calculations.invoice_administrative_fee.constants
        excluded_because:
          difficulty_instance: combinatorial_formula / invoice_admin_fee_mode_c_bracket_keyed_on_subtotal
          rationale: "That instance pins the bracket selection at ADMIN_TIER_BREAK_CENTS and proves total_cents never re-selects it."

      - name: exemption_determination_diverges_between_entity_and_group_basis
        claim_type: variant_divergence
        grounds:
          - calculations.exemption_determination.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / exemption_variant_divergence_entity_level_vs_group_level
          rationale: "That instance runs identical producer data through both obligation_basis variants and asserts the opposite exemption_status."

      - name: report_fee_variant_selects_a_different_tier_basis
        claim_type: variant_selection
        grounds:
          - calculations.report_fee_assessment.variants
          - entities.PackagingReport.fields.tier_basis_kg
        excluded_because:
          difficulty_instance: dual_variant_calc / report_fee_variant_divergence_provisional_vs_final
          rationale: "That instance asserts both tier bases, both subtotals and the delta when the variant switches PROVISIONAL -> FINAL."

      - name: redesign_projection_units_basis_variants_scale_the_delta
        claim_type: variant_divergence
        grounds:
          - calculations.redesign_fee_projection.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / redesign_projection_baseline_units_vs_projected_units
          rationale: "That instance asserts both units bases and the proportional difference in fee_delta_cents."

      - name: fee_tier_band_boundary_selects_the_upper_band
        claim_type: tiered_pricing
        grounds:
          - calculations.report_fee_assessment.formula
          - entities.FeeSchedule.fields.material_rates
        excluded_because:
          difficulty_instance: boundary_precision_check / tier_basis_exactly_at_band_minimum_selects_upper_band
          rationale: "That instance walks tier_min_kg minus one thousandth, exactly tier_min_kg and above it with pre-computed cent literals."

      - name: small_producer_thresholds_are_strictly_less_than_comparisons
        claim_type: threshold
        grounds:
          - calculations.exemption_determination.formula
          - entities.StateProgram.fields.small_producer_revenue_threshold_usd
        excluded_because:
          difficulty_instance: boundary_precision_check / group_revenue_exactly_at_small_producer_threshold
          rationale: "That instance asserts OBLIGATED exactly at the threshold and EXEMPT_SMALL_PRODUCER one dollar below it."

      - name: producer_fee_balance_rollup_sums_only_issued_invoices
        claim_type: input_set_filtering
        grounds:
          - calculations.producer_fee_balance_rollup.input_set
          - entities.Producer.fields.assessed_fee_balance_cents
        excluded_because:
          difficulty_instance: compensating_invariant / invoice_issue_void_reissue_restores_fee_balance_exactly
          rationale: "That instance asserts the balance after issue, after void and after reissue, which pins the ISSUED-only input set."

  - section: validations
    instances:
      - name: golden_path_submit_assess_invoice_close_satisfies_every_gate
        claim_type: satisfaction_to_pass
        grounds:
          - validations.priority_21.check
          - validations.priority_48.check
          - validations.priority_51.check
          - endpoints.POST /epr/reports/{id}/assess.side_effects
          - endpoints.POST /epr/invoices.side_effects
          - endpoints.POST /epr/reports/{id}/close.side_effects
        distinguishing_aspect: "With every gate satisfied the whole chain succeeds and the report reaches FINALIZED/INVOICED with fee_subtotal_cents 50, admin fee 3 and total 53 — the ERR_VERIFICATION_REQUIRED gate stays silent because 5.500 kg is below the 3000 kg verification threshold."
