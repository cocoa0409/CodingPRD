  - rule_id: transitive_cascade
    instances:
      - name: inspection_completion_chain_inspection_complaint_property_zone
        grounds:
          - state_machines.Inspection.IN_PROGRESS_to_COMPLETED
          - state_machines.Complaint.INSPECTION_SCHEDULED_to_INSPECTED
          - calculations.property_chronic_score
          - entities.Property.fields.chronic_flag
          - entities.Zone.fields.chronic_property_count
          - endpoints[POST /vector-control/inspections/{id}/complete]
        distinguishing_aspect: |
          Depth-4 chain triggered by inspection completion: the Inspection reaching COMPLETED
          drives the Complaint to INSPECTED, the Complaint entering INSPECTED drives the
          REVIEWED re-score of the Property which flips chronic_flag to true, and only that
          flag flip drives Zone.chronic_property_count from 0 to 1 - each hop caused by the
          previous one, not by the original call.
        test_recipe:
          setup:
            - "Zone Riverside with parcel APN-1001, one open HIGH complaint in INSPECTION_SCHEDULED"
            - "The visit is IN_PROGRESS and carries an assessment scoring 83.50 (SEVERE)"
            - "Property.chronic_flag is false and Zone.chronic_property_count is 0 before the trigger"
          setup_api_calls:
            - call: "POST /vector-control/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-04T09:00:00Z" }
              as: ProgramAdmin
            - call: "POST /vector-control/zones"
