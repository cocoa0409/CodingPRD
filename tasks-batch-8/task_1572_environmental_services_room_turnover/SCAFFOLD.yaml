    roles: [QualityAuditor]
    code: 201
    input: [clean_request_id, audit_method, "rlu_reading?", "marker_fraction_removed?"]
    output: QualityAudit
    side_effects: ["result computed; PASS -> request VERIFIED + bed READY + matching; FAIL -> request NEEDS_RECLEAN + bed VACANT_DIRTY + completer penalty"]

  - method: GET
