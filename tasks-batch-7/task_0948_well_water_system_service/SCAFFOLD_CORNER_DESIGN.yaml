      - name: corner_calc_severity_band_edges_at_59_60_and_the_hundred_point_cap
        claim_type: Correct Result
        grounds: ["calculations.no_water_severity_score", "calculations.emergency_surcharge_tier_cents", "calculations.membership_surcharge_credit_cents", "entities.EmergencyTicket.fields.severity_score"]
        distinguishing_aspect: |
          Three NONE-tier tickets straddle the MID/HIGH surcharge edge and the score
          ceiling. CONTROL_FAILURE with 3.9 outage hours, household 5 and a vulnerable
          occupant scores 25 + min(30, floor(3.9)*3=9) + min(15, 15) + 10 = 59 and
          bills the MID surcharge 14000; PRESSURE_TANK_FAILURE with 5.0 hours,
          household 5 and no vulnerable occupant scores 30 + 15 + 15 + 0 = 60 and
          crosses to the HIGH surcharge 24000; WELL_DRY with 40.0 hours, household 12
          and a vulnerable occupant scores 45 + min(30, 120) + min(15, 36) + 10 = 100,
          not 175, because both component caps and SEVERITY_MAX bind. With
          membership_tier_at_intake NONE the credit is 0 on all three, so net equals
          the gross surcharge. An implementation that rounds 3.9 hours up to 4 scores
          62 on the first ticket and jumps it to the HIGH band.
          Note: floor(3.9) = 3, so outage points are 9, not 12.
