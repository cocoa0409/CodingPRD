    instances:
      - name: reopen_cancel_conserves_open_reverification_count
        grounds:
          - state_machines.Dispute.REVERIFYING_to_REOPENED
          - state_machines.ReverificationRequest.PENDING_to_CANCELLED
          - entities.Furnisher.fields.open_reverification_count
        distinguishing_aspect: |
          Conserved quantity = Furnisher.open_reverification_count. Forward action
          POST /reverification-requests (+1); compensating action reopen cancels
          that PENDING request (-1). Invariant: open_reverification_count ==
          count(ReverificationRequest where furnisher_id==F and status==PENDING).
          After dispatch then reopen, the furnisher's count returns to 0.
