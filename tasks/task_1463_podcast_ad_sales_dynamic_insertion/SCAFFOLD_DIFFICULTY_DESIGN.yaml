              captures: { a2: $.data.id }
            - call: "POST /adnet/advertisers"
              payload: { name: "SlotC", category: "ALCOHOL" }
              as: AdOps
              captures: { a3: $.data.id }
            - call: "POST /adnet/campaigns"
              payload: { advertiser_id: "${a1}", name: "C1", flight_start: "2026-08-01T00:00:00Z", flight_end: "2026-09-01T00:00:00Z", booked_impressions: 10, cpm_cents: 1000, billing_model: "ACTUAL_DELIVERY" }
              as: AdOps
