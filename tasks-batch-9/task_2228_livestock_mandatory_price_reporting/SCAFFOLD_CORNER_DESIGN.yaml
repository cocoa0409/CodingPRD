# =============================================================================
# §1.9 Scaffold Corner Design (Breadth Probe)
# task_2228_livestock_mandatory_price_reporting
#
# Walks references/claim-extraction-guide.md row-by-row against SCAFFOLD.yaml
# §1.1-§1.7. Corners already asserted by SCAFFOLD_DIFFICULTY_DESIGN.yaml are
# emitted as `excluded_because:` stubs (no test_recipe).
#
# Logical clock starts at 2026-08-01T00:00:00Z; every clock move is an explicit
# POST /_clock/set_current_utc call. Every numeric literal in an `assert:` line
# was produced by executing the referenced §1.3 formula against the pinned
# fixture inputs.
#
# Error-catalog coverage map (§1.6, 60 errors) — each error id is triggered by:
#   ERR_UNAUTHENTICATED, ERR_UNAUTHORIZED ............. validations/auth_headers_and_role_gate_returns_401_403, rbac/*
#   ERR_FOREIGN_REPORTING_ENTITY ...................... rbac/foreign_plant_filing_by_other_reporter_forbidden
#   ERR_SEGREGATION_OF_DUTIES ......................... rbac/segregation_of_duties_blocks_same_user_both_directions
#   ERR_REPORT_NOT_PUBLISHED .......................... rbac/public_user_sees_only_published_market_reports
#   ERR_INVALID_REQUEST ............................... validations/invalid_enum_and_missing_required_input_returns_400
#   ERR_*_NOT_FOUND (9) ............................... entities/unknown_path_ids_return_per_collection_not_found + entities/body_foreign_keys_must_exist_not_found
#   ERR_STALE_WINDOW_VERSION / ERR_STALE_ENTITY_VERSION  complexity_layers/stale_*_version_*_rejected
#   ERR_SUBMISSION_NOT_EDITABLE, ERR_INVALID_SUBMISSION_STATE,
#   ERR_INVALID_REGISTRATION_STATE, ERR_INVALID_AUDIT_STATE,
#   ERR_INVALID_METHODOLOGY_STATE ..................... validations/lifecycle_actions_from_wrong_state_rejected, state_machines/terminal_states_reject_every_further_action
#   ERR_WINDOW_NOT_OPEN, ERR_EMPTY_SUBMISSION ......... validations/locked_window_and_empty_submission_rejected
#   ERR_REPORT_NOT_COMPUTED, ERR_DISCLOSURE_NOT_REVIEWED,
#   ERR_PUBLICATION_BEFORE_RELEASE_TIME,
#   ERR_REPORT_ALREADY_PUBLISHED ...................... state_machines/publication_gate_sequence_rejects_out_of_order_actions
#   ERR_PENALTY_ALREADY_SETTLED, ERR_PAYMENT_AMOUNT_MISMATCH,
#   ERR_OUTSTANDING_PENALTY_BLOCKS_ACTIVATION ......... validations/penalty_money_gates_and_activation_block_rejected
#   ERR_CONFIDENTIALITY_SUPPRESSION_REQUIRED .......... calculations/packer_owned_only_yields_null_price_statistics
#   ERR_NO_ELIGIBLE_DATA .............................. calculations/compute_without_accepted_submission_rejected
#   ERR_WHOLESALE_NOT_AUTHORIZED, ERR_SPECIES_CLASS_MISMATCH,
#   ERR_LINE_ITEM_CLASS_MISMATCH ...................... validations/class_and_authorization_mismatches_rejected
#   ERR_CORRECTION_WINDOW_CLOSED, ERR_RESUBMISSION_LIMIT_REACHED  validations/correction_cycles_exhausted_then_deadline_closed_rejected
#   ERR_WINDOW_PERIOD_NOT_ENDED, ERR_PENDING_SUBMISSIONS_EXIST    state_machines/window_lock_preconditions_then_success
#   ERR_COMMENT_PERIOD_NOT_ENDED, ERR_NO_PUBLIC_COMMENTS          validations/comment_close_and_adoption_prerequisites_rejected
#   ERR_COMMENT_PERIOD_TOO_SHORT, ERR_EFFECTIVE_DATE_TOO_SOON     validations/comment_period_minimums_and_notice_window_rejected
#   ERR_FORWARD_DELIVERY_INTERVAL_INVALID, ERR_MISSING_PURCHASE_TYPE_ELEMENT,
#   ERR_FORBIDDEN_PURCHASE_TYPE_ELEMENT ............... validations/purchase_type_data_element_rules_rejected
#   ERR_SUPERSEDE_TARGET_NOT_ACCEPTED, ERR_DUPLICATE_SUBMISSION   state_machines/superseding_filing_marks_target_superseded
#   ERR_DUPLICATE_REGISTRATION_YEAR ................... validations/duplicate_registration_year_rejected_but_new_year_passes
#   ERR_APPEAL_LIMIT_REACHED, ERR_ENTITY_EXEMPT ....... state_machines/exempt_activation_and_appeal_ceiling_rejected
#   ERR_INCOMPLETE_SLAUGHTER_HISTORY, ERR_NO_ELIGIBLE_PLANTS      validations/determination_prerequisites_rejected
#   ERR_SUPERSEDE_TARGET_PLANT_MISMATCH ............... §1.8 supersede_mismatch_outranks_duplicate_filing
#   ERR_WINDOW_PERIOD_OVERLAP ......................... §1.8 window_calendar_half_open_adjacency
#   ERR_FORWARD_COMMITMENT_CAP_EXCEEDED ............... §1.8 forward_commitment_closed_interval_aggregate_cap
#   ERR_REGISTRATION_NOT_ACTIVE ....................... §1.8 submission_submit_requires_active_registration
#   ERR_WINDOW_NOT_LOCKED ............................. §1.8 report_publish_requires_locked_window
#   ERR_AUDIT_CASE_NOT_DISCREPANT ..................... §1.8 penalty_requires_discrepant_audit_case
#
# §1.5 has no bulk endpoint, no soft delete, no idempotency key and no
# scheduled action, so the guide's `bulk_action`, `soft_delete`, `idempotency`,
# `scheduled_actions`, `multi_tenancy` and `conditional_feature_flags` rows are
# not applicable and are skipped without ceremony.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: reporting_entity_creation_returns_full_projection_with_zeroed_ledgers
        claim_type: creation
        grounds:
          - entities.ReportingEntity
          - endpoints.POST_/reporting-entities
          - entities.ReportingEntity.fields.outstanding_penalty_cents
        distinguishing_aspect: |
          POST with all three required inputs returns 201 and the complete field
          projection: the five computed money/points ledgers all start at 0 and
          the common fields (id, created_at, updated_at, version) are present with
          version == 1.
        test_recipe:
          setup:
            - "Empty database; logical clock at its 2026-08-01T00:00:00Z startup default."
          setup_api_calls: []
          trigger:
            - call: "POST /reporting-entities"
              payload: { legal_name: "Alpha Packing", entity_type: "PACKER", species_scope: "CATTLE" }
              as: ProgramAdmin
              captures: { ent_a: $.data.id }
          assert:
            - "HTTP 201 and response_type == object"
            - "ReportingEntity.${ent_a}.legal_name == 'Alpha Packing' and entity_type == PACKER and species_scope == CATTLE"
            - "ReportingEntity.${ent_a}.delinquency_points == 0"
            - "ReportingEntity.${ent_a}.assessed_penalty_cents == 0 and paid_penalty_cents == 0 and waived_penalty_cents == 0 and outstanding_penalty_cents == 0"
            - "ReportingEntity.${ent_a}.version == 1 and id, created_at, updated_at are all non-null"
            - "meta.api_request_id and meta.api_request_timestamp are present on the envelope"

      - name: plant_retrieval_round_trips_stored_values
        claim_type: retrieval
        grounds:
          - endpoints.GET_/plants/{id}
          - entities.Plant.fields.annual_head_history
        distinguishing_aspect: |
          GET /plants/{id} returns exactly what POST stored, including the
          object-typed annual_head_history map with all five year keys intact and
          the two optional integers that were supplied.
        test_recipe:
          setup:
            - "Alpha Packing exists with one CATTLE plant EST-101."
          setup_api_calls:
            - call: "POST /reporting-entities"
              payload: { legal_name: "Alpha Packing", entity_type: "PACKER", species_scope: "CATTLE" }
              as: ProgramAdmin
              captures: { ent_a: $.data.id }
            - call: "POST /plants"
              payload: { reporting_entity_id: "${ent_a}", plant_code: "EST-101", species: "CATTLE", annual_head_history: { "2021": 120000, "2022": 124000, "2023": 126000, "2024": 128000, "2025": 132000 }, boxed_beef_volume_lbs_prior_year: 2500000, forward_commitment_cap_head: 3000 }
              as: ProgramAdmin
              captures: { plant_a: $.data.id }
          trigger:
            - call: "GET /plants/${plant_a}"
              payload: {}
              as: ProgramAdmin
          assert:
            - "HTTP 200 and Plant.${plant_a}.plant_code == 'EST-101'"
            - "Plant.${plant_a}.reporting_entity_id == ${ent_a} and species == CATTLE"
            - "Plant.${plant_a}.annual_head_history has exactly the keys 2021,2022,2023,2024,2025 with values 120000,124000,126000,128000,132000"
            - "Plant.${plant_a}.boxed_beef_volume_lbs_prior_year == 2500000 and forward_commitment_cap_head == 3000"
            - "Plant.${plant_a}.status == ACTIVE and wholesale_reporting_required == true"

      - name: plant_listing_paginates_and_filters_by_owning_entity
        claim_type: listing
        grounds:
          - endpoints.GET_/plants
          - response_envelope.pagination
        distinguishing_aspect: |
          Three plants under one entity plus one under another: the
          reporting_entity_id filter narrows total_count to 3, and limit 2 /
          offset 0 then offset 2 walks the page boundary with has_more flipping
          true then false.
        test_recipe:
          setup:
            - "Alpha Packing owns EST-101, EST-101B and EST-101C; Bravo Beef owns EST-202."
          setup_api_calls:
            - call: "POST /reporting-entities"
              payload: { legal_name: "Alpha Packing", entity_type: "PACKER", species_scope: "CATTLE" }
              as: ProgramAdmin
              captures: { ent_a: $.data.id }
            - call: "POST /reporting-entities"
              payload: { legal_name: "Bravo Beef", entity_type: "PACKER", species_scope: "CATTLE" }
              as: ProgramAdmin
              captures: { ent_b: $.data.id }
            - call: "POST /plants"
              payload: { reporting_entity_id: "${ent_a}", plant_code: "EST-101", species: "CATTLE", annual_head_history: { "2021": 0, "2022": 0, "2023": 0, "2024": 0, "2025": 0 }, boxed_beef_volume_lbs_prior_year: 0, forward_commitment_cap_head: 500 }
              as: ProgramAdmin
              captures: { plant_a1: $.data.id }
            - call: "POST /plants"
              payload: { reporting_entity_id: "${ent_a}", plant_code: "EST-101B", species: "CATTLE", annual_head_history: { "2021": 0, "2022": 0, "2023": 0, "2024": 0, "2025": 0 }, boxed_beef_volume_lbs_prior_year: 0, forward_commitment_cap_head: 500, status: "IDLE" }
              as: ProgramAdmin
              captures: { plant_a2: $.data.id }
            - call: "POST /plants"
              payload: { reporting_entity_id: "${ent_a}", plant_code: "EST-101C", species: "CATTLE", annual_head_history: { "2021": 0, "2022": 0, "2023": 0, "2024": 0, "2025": 0 }, boxed_beef_volume_lbs_prior_year: 0, forward_commitment_cap_head: 500, status: "CLOSED" }
              as: ProgramAdmin
              captures: { plant_a3: $.data.id }
            - call: "POST /plants"
              payload: { reporting_entity_id: "${ent_b}", plant_code: "EST-202", species: "CATTLE", annual_head_history: { "2021": 0, "2022": 0, "2023": 0, "2024": 0, "2025": 0 }, boxed_beef_volume_lbs_prior_year: 0, forward_commitment_cap_head: 500 }
              as: ProgramAdmin
              captures: { plant_b1: $.data.id }
          trigger:
            - call: "GET /plants"
              payload: { reporting_entity_id: "${ent_a}", limit: 2, offset: 0 }
              as: ProgramAdmin
            - call: "GET /plants"
              payload: { reporting_entity_id: "${ent_a}", limit: 2, offset: 2 }
              as: ProgramAdmin
            - call: "GET /plants"
              payload: { reporting_entity_id: "${ent_a}", status: "CLOSED" }
              as: ProgramAdmin
          assert:
            - "First page: HTTP 200, response_type == array, len(data) == 2, total_count == 3, limit == 2, offset == 0, has_more == true"
            - "Second page: len(data) == 1, total_count == 3, offset == 2, has_more == false"
            - "Status-filtered read: total_count == 1 and data[0].id == ${plant_a3}"
            - "Bravo's plant ${plant_b1} never appears in any of the three responses"
            - "GET /plants with no query parameters returns total_count == 4 with limit == 10 and offset == 0 defaults"

      - name: unknown_path_ids_return_per_collection_not_found
        claim_type: not_found
        grounds:
          - validations.priority_4_ERR_SUBMISSION_NOT_FOUND
          - errors[ERR_REPORTING_ENTITY_NOT_FOUND]
          - errors[ERR_METHODOLOGY_CHANGE_NOT_FOUND]
        distinguishing_aspect: |
          Priority 4 resolves the path resource left-to-right and each collection
          owns its OWN 404 id — nine distinct error ids, not one generic
          ERR_NOT_FOUND. A syntactically valid but unknown uuid on each collection
          returns the collection-specific code.
        test_recipe:
          setup:
            - "Empty database; no entity of any kind exists."
          setup_api_calls: []
          trigger:
            - call: "GET /reporting-entities/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: ProgramAdmin
              captures: { e1: $.data.error_id }
            - call: "GET /plants/00000000-0000-4000-8000-000000000002"
              payload: {}
              as: ProgramAdmin
              captures: { e2: $.data.error_id }
            - call: "GET /registrations/00000000-0000-4000-8000-000000000003"
              payload: {}
              as: ProgramAdmin
              captures: { e3: $.data.error_id }
            - call: "GET /reporting-windows/00000000-0000-4000-8000-000000000004"
              payload: {}
              as: ProgramAdmin
              captures: { e4: $.data.error_id }
            - call: "GET /submissions/00000000-0000-4000-8000-000000000005"
              payload: {}
              as: ProgramAdmin
              captures: { e5: $.data.error_id }
            - call: "GET /market-reports/00000000-0000-4000-8000-000000000006"
              payload: {}
              as: MarketAnalyst
              captures: { e6: $.data.error_id }
            - call: "GET /audit-cases/00000000-0000-4000-8000-000000000007"
              payload: {}
              as: ComplianceAuditor
              captures: { e7: $.data.error_id }
            - call: "GET /penalty-assessments/00000000-0000-4000-8000-000000000008"
              payload: {}
              as: PenaltyOfficer
              captures: { e8: $.data.error_id }
            - call: "GET /methodology-changes/00000000-0000-4000-8000-000000000009"
              payload: {}
              as: ProgramAdmin
              captures: { e9: $.data.error_id }
          assert:
            - "All nine responses are HTTP 404 with response_type == error"
            - "${e1} == ERR_REPORTING_ENTITY_NOT_FOUND"
            - "${e2} == ERR_PLANT_NOT_FOUND"
            - "${e3} == ERR_REGISTRATION_NOT_FOUND"
            - "${e4} == ERR_REPORTING_WINDOW_NOT_FOUND"
            - "${e5} == ERR_SUBMISSION_NOT_FOUND"
            - "${e6} == ERR_MARKET_REPORT_NOT_FOUND"
            - "${e7} == ERR_AUDIT_CASE_NOT_FOUND"
            - "${e8} == ERR_PENALTY_ASSESSMENT_NOT_FOUND"
            - "${e9} == ERR_METHODOLOGY_CHANGE_NOT_FOUND"

      - name: plant_creation_missing_required_species_returns_invalid_request
        claim_type: required_fields
        grounds:
          - endpoints.POST_/plants
          - validations.priority_3_ERR_INVALID_REQUEST
          - entities.Plant.fields.species
        distinguishing_aspect: |
          species and annual_head_history are `source: input` with NO default, so
          each omission is a 400 at priority 3 — before the FK existence check at
          priority 5 and before any species/entity-scope comparison.
        test_recipe:
          setup:
            - "Alpha Packing exists; no plant has been created yet."
          setup_api_calls:
            - call: "POST /reporting-entities"
              payload: { legal_name: "Alpha Packing", entity_type: "PACKER", species_scope: "CATTLE" }
              as: ProgramAdmin
              captures: { ent_a: $.data.id }
          trigger:
            - call: "POST /plants"
              payload: { reporting_entity_id: "${ent_a}", plant_code: "EST-101", annual_head_history: { "2021": 1, "2022": 1, "2023": 1, "2024": 1, "2025": 1 } }
              as: ProgramAdmin
              captures: { err_species: $.data.error_id }
            - call: "POST /plants"
              payload: { reporting_entity_id: "${ent_a}", plant_code: "EST-101", species: "CATTLE" }
              as: ProgramAdmin
              captures: { err_history: $.data.error_id }
            - call: "POST /reporting-windows"
              payload: { species: "CATTLE", report_class: "LIVE_ANIMAL", frequency: "WEEKLY", period_start: "2026-08-03T00:00:00Z", period_end: "2026-08-10T00:00:00Z" }
              as: ProgramAdmin
              captures: { err_window: $.data.error_id }
          assert:
            - "${err_species} == ERR_INVALID_REQUEST with HTTP 400"
            - "${err_history} == ERR_INVALID_REQUEST with HTTP 400"
            - "${err_window} == ERR_INVALID_REQUEST with HTTP 400 (three required deadline datetimes omitted)"
            - "GET /plants returns total_count == 0 — no partial row was written by any rejected call"

      - name: omitted_optional_inputs_apply_declared_defaults
        claim_type: defaults
        grounds:
          - entities.Plant.fields.status
          - entities.ReportingWindow.fields.min_reporter_count
          - entities.AuditCase.fields.materiality_pct
          - entities.MarketReport.fields.purchase_type_filter
          - endpoints.POST_/registrations
        distinguishing_aspect: |
          Five declared defaults land in one sweep: Plant.status ACTIVE,
          ReportingWindow guidelines 3 / 70.00 / 2000, Registration.basis_variant
          FIVE_YEAR_AVERAGE, MarketReport.purchase_type_filter ALL_PRICED and
          AuditCase.materiality_pct 2.00 — each supplied by the server, never by
          the client.
        test_recipe:
          setup:
            - "Alpha Packing exists with a five-year plant history; the logical clock is at 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /reporting-entities"
              payload: { legal_name: "Alpha Packing", entity_type: "PACKER", species_scope: "CATTLE" }
              as: ProgramAdmin
              captures: { ent_a: $.data.id }
          trigger:
            - call: "POST /plants"
              payload: { reporting_entity_id: "${ent_a}", plant_code: "EST-101", species: "CATTLE", annual_head_history: { "2021": 120000, "2022": 124000, "2023": 126000, "2024": 128000, "2025": 132000 }, boxed_beef_volume_lbs_prior_year: 2500000, forward_commitment_cap_head: 3000 }
              as: ProgramAdmin
              captures: { plant_a: $.data.id }
            - call: "POST /registrations"
              payload: { reporting_entity_id: "${ent_a}", determination_year: 2026 }
              as: ProgramAdmin
              captures: { reg_a: $.data.id }
            - call: "POST /reporting-windows"
              payload: { species: "CATTLE", report_class: "LIVE_ANIMAL", frequency: "WEEKLY", period_start: "2026-08-03T00:00:00Z", period_end: "2026-08-10T00:00:00Z", submission_deadline_utc: "2026-08-11T15:00:00Z", correction_deadline_utc: "2026-08-18T15:00:00Z", publication_release_utc: "2026-08-12T12:00:00Z" }
              as: ProgramAdmin
              captures: { win_1: $.data.id }
            - call: "POST /market-reports"
              payload: { reporting_window_id: "${win_1}", category: "LIVE_STEER_HEIFER", weighting_variant: "HEAD_WEIGHTED" }
              as: MarketAnalyst
              captures: { rep_1: $.data.id }
          assert:
            - "Plant.${plant_a}.status == ACTIVE (default applied, no status supplied)"
            - "ReportingWindow.${win_1}.min_reporter_count == 3 and max_single_reporter_share_pct == 70.00 and min_reported_head == 2000"
            - "ReportingWindow.${win_1}.status == OPEN"
            - "Registration.${reg_a}.basis_variant == FIVE_YEAR_AVERAGE and status == DRAFT and appeal_count == 0"
            - "Registration.${reg_a}.determination_outcome is null and registration_number is null while status == DRAFT"
            - "MarketReport.${rep_1}.purchase_type_filter == ALL_PRICED"
            - "MarketReport.${rep_1}.aggregation_state == PENDING and disclosure_state == UNREVIEWED and publication_state == UNPUBLISHED"

      - name: wholesale_flag_computed_at_boxed_beef_threshold
        claim_type: computed_fields
        grounds:
          - entities.Plant.fields.wholesale_reporting_required
          - validations.priority_23_ERR_WHOLESALE_NOT_AUTHORIZED
        distinguishing_aspect: |
          wholesale_reporting_required is `source: computed` from
          boxed_beef_volume_lbs_prior_year >= 2000000 with a NON-strict
          comparison: exactly 2000000 is true, 1999999 is false, and a client
          value supplied for the flag itself is ignored.
        test_recipe:
          setup:
            - "Alpha Packing exists; two plants will be created either side of the 2000000 lb boxed-beef threshold."
          setup_api_calls:
            - call: "POST /reporting-entities"
              payload: { legal_name: "Alpha Packing", entity_type: "PACKER", species_scope: "CATTLE" }
              as: ProgramAdmin
              captures: { ent_a: $.data.id }
          trigger:
            - call: "POST /plants"
              payload: { reporting_entity_id: "${ent_a}", plant_code: "EST-AT", species: "CATTLE", annual_head_history: { "2021": 0, "2022": 0, "2023": 0, "2024": 0, "2025": 0 }, boxed_beef_volume_lbs_prior_year: 2000000, forward_commitment_cap_head: 500 }
              as: ProgramAdmin
              captures: { plant_at: $.data.id }
            - call: "POST /plants"
              payload: { reporting_entity_id: "${ent_a}", plant_code: "EST-BELOW", species: "CATTLE", annual_head_history: { "2021": 0, "2022": 0, "2023": 0, "2024": 0, "2025": 0 }, boxed_beef_volume_lbs_prior_year: 1999999, forward_commitment_cap_head: 500 }
              as: ProgramAdmin
              captures: { plant_below: $.data.id }
          assert:
            - "Plant.${plant_at}.boxed_beef_volume_lbs_prior_year == 2000000 and wholesale_reporting_required == true"
            - "Plant.${plant_below}.boxed_beef_volume_lbs_prior_year == 1999999 and wholesale_reporting_required == false"
            - "The 1 lb difference is the only distinguishing input between the two plants"

      - name: client_supplied_system_fields_are_ignored_extra_field_discarded
        claim_type: system_fields
        grounds:
          - entities.ReportingWindow.fields.status
          - entities.Submission.fields.status
          - response_envelope
        distinguishing_aspect: |
          id / created_at / updated_at / version and every `source: system` enum
          are server-owned: a create payload carrying id, version and
          status: "LOCKED" is accepted with those keys discarded, and the window
          still comes back OPEN with version 1.
        test_recipe:
          setup:
            - "Empty database."
          setup_api_calls: []
          trigger:
            - call: "POST /reporting-windows"
              payload: { species: "CATTLE", report_class: "LIVE_ANIMAL", frequency: "WEEKLY", period_start: "2026-08-03T00:00:00Z", period_end: "2026-08-10T00:00:00Z", submission_deadline_utc: "2026-08-11T15:00:00Z", correction_deadline_utc: "2026-08-18T15:00:00Z", publication_release_utc: "2026-08-12T12:00:00Z", id: "00000000-0000-4000-8000-0000000000ff", version: 99, status: "LOCKED", accepted_submission_count: 7, total_head_reported: 12345 }
              as: ProgramAdmin
              captures: { win_1: $.data.id }
          assert:
            - "HTTP 201 and ReportingWindow.${win_1}.id != '00000000-0000-4000-8000-0000000000ff'"
            - "ReportingWindow.${win_1}.version == 1 (client 99 ignored)"
            - "ReportingWindow.${win_1}.status == OPEN (client LOCKED ignored)"
            - "ReportingWindow.${win_1}.accepted_submission_count == 0 and total_head_reported == 0 (client values ignored)"
            - "ReportingWindow.${win_1}.created_at == ReportingWindow.${win_1}.updated_at == 2026-08-01T00:00:00Z (logical clock, not client input)"

      - name: line_items_are_immutable_and_carry_no_version
        claim_type: immutability
        grounds:
          - entities.TransactionRecord
          - entities.WholesaleLot
          - endpoints.GET_/submissions/{id}/transactions
        distinguishing_aspect: |
          TransactionRecord and WholesaleLot are the only two entities declared
          `common_fields: false`: §1.5 exposes POST and GET for them and NO
          PATCH/PUT/DELETE, and their rows carry no `version` field, so a
          correction is modelled as a new submission rather than an edit.
        test_recipe:
          setup:
            - "Alpha Packing files one DRAFT submission on an OPEN CATTLE LIVE_ANIMAL window and attaches one NEGOTIATED transaction of 100 head."
          setup_api_calls:
            - call: "POST /reporting-entities"
              payload: { legal_name: "Alpha Packing", entity_type: "PACKER", species_scope: "CATTLE" }
              as: ProgramAdmin
              captures: { ent_a: $.data.id }
            - call: "POST /plants"
