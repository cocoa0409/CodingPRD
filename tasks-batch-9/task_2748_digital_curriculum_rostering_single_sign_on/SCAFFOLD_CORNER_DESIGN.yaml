      - name: cascade_depth4_withdrawal_chain_end_to_end
        claim_type: "cascading_side_effects — N-level chain verified end-to-end"
        grounds:
          - state_machines.Student[ENROLLED->WITHDRAWN]
          - "endpoints[POST /rostering/students/{student_id}/withdraw]"
          - complexity_profile.complexity_layers
        distinguishing_aspect: "The deepest chain in the design runs Student -> Enrollment -> AppAccount (both axes) -> BuildingAllocation -> VendorApp counters and charge ledger, and every hop must be observable in one response."
        excluded_because:
          difficulty_instance: student_withdraw_depth4_cascade
          rationale: "The §1.8 instance already drives a single withdrawal through all four hops and asserts each hop's fields — enrollment DROPPED, seat RELEASED with refund, identity DEPROVISIONED, allocation decrement, and the licence's consumed_seats/committed_charge_cents/renewal recomputation — so a separate corner test would only restate the same call and the same assertions."

      - name: cascade_ordering_sensitivity_on_teacher_separation
        claim_type: "cascading_side_effects — ordering sensitivity tested"
        grounds:
          - entities.Teacher.fields.employment_status
          - "endpoints[POST /rostering/teachers/{teacher_id}/separate]"
          - complexity_profile.complexity_layers
        distinguishing_aspect: "Separation must mark the sections' roster_health and enqueue the unmatched-teacher work items in a fixed order relative to the seat and identity effects, or the queue contents and the sections' health flags disagree."
        excluded_because:
          difficulty_instance: teacher_separation_depth3_cascade
          rationale: "The §1.8 instance already fixes the hop order for separation (section roster_health -> ErrorQueueItem creation -> licence sync_health) and asserts the intermediate states that would differ under any other ordering, so the corner claim is fully consumed there."

      - name: dual_variant_seat_charge_provisional_vs_final_delta
        claim_type: "dual_variant_calculation — both variants and the delta on switch"
        grounds:
          - calculations.sync_seat_charge.variants
          - complexity_profile.complexity_layers
        distinguishing_aspect: "sync_seat_charge carries a provisional variant charged at provisioning time and a final variant reconciled per instructional-day proration, so the same seat produces two different cent amounts and the switch must post exactly the delta to VendorApp.committed_charge_cents."
        excluded_because:
          difficulty_instance: seat_charge_provisional_vs_final_on_sync_run
          rationale: "The §1.8 instance computes both variants from the same fixture, asserts the two literal cent values and the signed delta applied to committed_charge_cents on the provisional -> final switch, which is exactly the Variant Divergence + Reconciliation pair this corner row asks for."

      - name: dual_variant_renewal_score_context_selection
        claim_type: "dual_variant_calculation — correct variant applied in the correct context"
        grounds:
          - calculations.renewal_recommendation_score.variants
          - complexity_profile.complexity_layers
        distinguishing_aspect: "The renewal summary must answer with the final variant for a licence whose term has rolled over and the provisional variant while the term is live, and the `basis` query parameter must not be able to override the context silently."
        excluded_because:
          difficulty_instance: renewal_score_final_vs_provisional_on_vendor_app
          rationale: "The §1.8 instance already pins both variant outputs and the context that selects each one (live term vs rolled-over term, with the explicit basis parameter), so a corner instance would duplicate that fixture and its literals."

      - name: soft_delete_archival_default_excludes_archived_but_references_stay_valid
        claim_type: "soft_delete_archival — archived rows excluded by default, reachable under the filter, references still valid"
        grounds:
          - calculations.archived_access_window
          - "endpoints[GET /rostering/vendor-apps/{vendor_app_id}/roster-feed]"
          - "endpoints[GET /rostering/sections/{section_id}]"
          - entities.Section.fields.status
