# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3466_patent_trial_proceedings_post_grant_review_administration
# Depth probe: 2 instances per Difficulty Rule (rule 2 carries a third, one per
# mode). Every instance grounds in SCAFFOLD.yaml §1.1–§1.7 and its recipe is
# directly executable against the §1.5 endpoint table from empty-DB.
# Logical clock default 2026-09-01T00:00:00Z; every recipe sets it explicitly.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: merits_per_ground_max_decides_while_weighted_aggregate_would_deny
        grounds:
          - calculations.merits_likelihood_evaluation
          - entities.Petition.fields.merits_max_score
          - entities.Petition.fields.advisory_aggregate_score
        distinguishing_aspect: |
          Same petition domain, same per-ground scores [40, 0, 0]: the OPERATIVE
          per_ground_max variant yields 40 >= 40 (IPR threshold) and institutes,
          while the advisory aggregate_weighted variant yields
          round_half_up(0.7*40 + 0.3*13.33) = 28 < 40 — two valid formulas over
          identical inputs disagreeing on the merits outcome; the decision record
          must show both values and the institute must follow only the max.
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Petitioner party P1 and owner party O1 exist. Patent with 5 claims owned by O1. IPR petition by P1 challenging claims [1,2,3], fee exactly 1900000 cents, filing date accorded. No litigation matters (fintiv_score 0)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /ptab/parties"
              payload: { name: "P1 Corp", party_type: "PETITIONER" }
              as: PlatformAdmin
              captures: { p1_id: $.data.id }
            - call: "POST /ptab/parties"
              payload: { name: "O1 Corp", party_type: "PATENT_OWNER" }
              as: PlatformAdmin
              captures: { o1_id: $.data.id }
            - call: "POST /ptab/patents"
              payload: { patent_number: "US10000001", title: "Widget", issue_date: "2020-06-01T00:00:00Z", owner_id: "${o1_id}", total_claims: 5 }
              as: PlatformAdmin
              captures: { pat_id: $.data.id, pat_v: $.data.version }
            - call: "POST /ptab/petitions"
              payload: { patent_id: "${pat_id}", petitioner_id: "${p1_id}", review_type: "IPR", challenged_claims: [1, 2, 3], grounds: [{ claim_number: 1, basis: "ANTICIPATION_102" }, { claim_number: 2, basis: "OBVIOUSNESS_103" }, { claim_number: 3, basis: "ANTICIPATION_102" }], prior_art: [{ reference_type: "PATENT", citation: "US5555555" }], real_party_in_interest: "P1 Corp", fee_paid_cents: 1900000, expected_patent_version: "${pat_v}" }
              as: Petitioner
              as_user_id: "${p1_id}"
              captures: { pet_id: $.data.id }
            - call: "POST /ptab/petitions/${pet_id}/accord-filing-date"
              payload: {}
              as: BoardPanel
          trigger:
            - call: "POST /ptab/petitions/${pet_id}/decide-institution"
              payload: { per_ground_scores: [{ claim_number: 1, basis: "ANTICIPATION_102", score: 40 }, { claim_number: 2, basis: "OBVIOUSNESS_103", score: 0 }, { claim_number: 3, basis: "ANTICIPATION_102", score: 0 }], lead_judge_user_id: "judge-alice" }
              as: BoardPanel
              captures: { outcome: $.data.outcome, mmax: $.data.merits_max_score, agg: $.data.advisory_aggregate_score, thr: $.data.threshold_used, proc_id: $.data.proceeding_id }
          assert:
            - "the decision outcome == INSTITUTED (operative per_ground_max 40 >= 40)"
            - "merits_max_score == 40"
            - "advisory_aggregate_score == 28 (round_half_up(0.7*40 + 0.3*40/3) — the weighted variant would NOT have met the threshold)"
            - "threshold_used == 40"
            - "Petition.${pet_id}.status == INSTITUTED and its merits_max_score == 40 and advisory_aggregate_score == 28"

      - name: fwd_deadline_fixed_days_vs_calendar_anniversary_across_leap_day
        grounds:
          - calculations.fwd_deadline_computation
          - entities.Proceeding.fields.fwd_due_date
          - entities.Proceeding.fields.advisory_anniversary_date
        distinguishing_aspect: |
          Proceeding deadline domain (different entity domain from the petition
          merits instance): institution at 2027-03-10 spans 2028-02-29, so the
          operative fixed-days variant gives fwd_due_date 2028-03-09 while the
          advisory anniversary variant gives 2028-03-10 — same institution
          instant, two defensible deadline computations, different dates.
        test_recipe:
          setup:
            - "Logical clock at 2027-03-10T00:00:00Z. Parties P2 (petitioner) and O2 (owner). Patent with 3 claims. IPR petition challenging claims [1,2] filed and accorded on 2027-03-10. No litigation matters."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-03-10T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /ptab/parties"
              payload: { name: "P2 Corp", party_type: "PETITIONER" }
              as: PlatformAdmin
              captures: { p2_id: $.data.id }
            - call: "POST /ptab/parties"
              payload: { name: "O2 Corp", party_type: "PATENT_OWNER" }
              as: PlatformAdmin
              captures: { o2_id: $.data.id }
            - call: "POST /ptab/patents"
              payload: { patent_number: "US10000002", title: "Gadget", issue_date: "2019-01-15T00:00:00Z", owner_id: "${o2_id}", total_claims: 3 }
              as: PlatformAdmin
              captures: { pat2_id: $.data.id, pat2_v: $.data.version }
            - call: "POST /ptab/petitions"
              payload: { patent_id: "${pat2_id}", petitioner_id: "${p2_id}", review_type: "IPR", challenged_claims: [1, 2], grounds: [{ claim_number: 1, basis: "ANTICIPATION_102" }, { claim_number: 2, basis: "OBVIOUSNESS_103" }], prior_art: [{ reference_type: "PRINTED_PUBLICATION", citation: "IEEE 2019" }], real_party_in_interest: "P2 Corp", fee_paid_cents: 1900000, expected_patent_version: "${pat2_v}" }
              as: Petitioner
              as_user_id: "${p2_id}"
              captures: { pet2_id: $.data.id }
            - call: "POST /ptab/petitions/${pet2_id}/accord-filing-date"
              payload: {}
              as: BoardPanel
          trigger:
            - call: "POST /ptab/petitions/${pet2_id}/decide-institution"
              payload: { per_ground_scores: [{ claim_number: 1, basis: "ANTICIPATION_102", score: 75 }, { claim_number: 2, basis: "OBVIOUSNESS_103", score: 60 }], lead_judge_user_id: "judge-bob" }
              as: BoardPanel
              captures: { proc2_id: $.data.proceeding_id }
            - call: "GET /ptab/proceedings/${proc2_id}"
              payload: {}
              as: BoardPanel
              captures: { due: $.data.fwd_due_date, anniv: $.data.advisory_anniversary_date }
          assert:
            - "Proceeding.${proc2_id}.fwd_due_date == 2028-03-09T00:00:00Z (institution 2027-03-10 + 365 days, spanning the 2028 leap day)"
            - "Proceeding.${proc2_id}.advisory_anniversary_date == 2028-03-10T00:00:00Z (institution + 12 calendar months)"
            - "the two deadline fields differ by exactly one day, proving both variants are computed from the same institution_date"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: garmin_empty_factor_cap_and_reply_phase_bonus
        grounds:
          - calculations.garmin_interest_score
          - entities.DiscoveryRequest.fields.garmin_score
        distinguishing_aspect: |
          Mode (a) combinatorial: 5 factor inputs interact non-linearly — a
          single 0 factor caps the total at 4, and the proceeding phase adds a
          +1 bonus only in REPLY_WINDOW. Identical factor vector [1,1,1,1,1]
          scores 5 (DENIED) when filed in phase INSTITUTED and 6 (GRANTED) when
          filed in REPLY_WINDOW.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Parties P3/O3, patent (5 claims) owned by O3, IPR petition by P3 on claims [1,2,3] accorded and INSTITUTED (scores 80/70/60, judge-carol). Proceeding phase == INSTITUTED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /ptab/parties"
              payload: { name: "P3 Corp", party_type: "PETITIONER" }
              as: PlatformAdmin
              captures: { p3_id: $.data.id }
            - call: "POST /ptab/parties"
              payload: { name: "O3 Corp", party_type: "PATENT_OWNER" }
              as: PlatformAdmin
              captures: { o3_id: $.data.id }
            - call: "POST /ptab/patents"
              payload: { patent_number: "US10000003", title: "Sprocket", issue_date: "2018-03-01T00:00:00Z", owner_id: "${o3_id}", total_claims: 5 }
              as: PlatformAdmin
              captures: { pat3_id: $.data.id, pat3_v: $.data.version }
            - call: "POST /ptab/petitions"
              payload: { patent_id: "${pat3_id}", petitioner_id: "${p3_id}", review_type: "IPR", challenged_claims: [1, 2, 3], grounds: [{ claim_number: 1, basis: "ANTICIPATION_102" }, { claim_number: 2, basis: "OBVIOUSNESS_103" }, { claim_number: 3, basis: "ANTICIPATION_102" }], prior_art: [{ reference_type: "PATENT", citation: "US6666666" }], real_party_in_interest: "P3 Corp", fee_paid_cents: 1900000, expected_patent_version: "${pat3_v}" }
              as: Petitioner
              as_user_id: "${p3_id}"
              captures: { pet3_id: $.data.id }
            - call: "POST /ptab/petitions/${pet3_id}/accord-filing-date"
              payload: {}
              as: BoardPanel
            - call: "POST /ptab/petitions/${pet3_id}/decide-institution"
              payload: { per_ground_scores: [{ claim_number: 1, basis: "ANTICIPATION_102", score: 80 }, { claim_number: 2, basis: "OBVIOUSNESS_103", score: 70 }, { claim_number: 3, basis: "ANTICIPATION_102", score: 60 }], lead_judge_user_id: "judge-carol" }
              as: BoardPanel
              captures: { proc3_id: $.data.proceeding_id }
          trigger:
            - call: "POST /ptab/proceedings/${proc3_id}/discovery-requests"
              payload: { discovery_type: "ADDITIONAL", factor_scores: [1, 1, 1, 1, 1] }
              as: Petitioner
              as_user_id: "${p3_id}"
              captures: { dr1_id: $.data.id, dr1_score: $.data.garmin_score }
            - call: "POST /ptab/discovery-requests/${dr1_id}/rule"
              payload: {}
              as: BoardPanel
              captures: { dr1_status: $.data.status }
            - call: "POST /ptab/proceedings/${proc3_id}/briefs"
              payload: { brief_type: "PO_RESPONSE", page_count: 90 }
              as: PatentOwner
              as_user_id: "${o3_id}"
            - call: "POST /ptab/proceedings/${proc3_id}/discovery-requests"
              payload: { discovery_type: "ADDITIONAL", factor_scores: [1, 1, 1, 1, 1] }
              as: PatentOwner
              as_user_id: "${o3_id}"
              captures: { dr2_id: $.data.id, dr2_score: $.data.garmin_score }
            - call: "POST /ptab/discovery-requests/${dr2_id}/rule"
              payload: {}
              as: BoardPanel
              captures: { dr2_status: $.data.status }
          assert:
            - "DiscoveryRequest.${dr1_id}.garmin_score == 5 (sum of [1,1,1,1,1], no zero-factor cap, no phase bonus in INSTITUTED)"
            - "DiscoveryRequest.${dr1_id}.status == DENIED after the ruling (5 < 6)"
            - "DiscoveryRequest.${dr2_id}.garmin_score == 6 (identical factor vector + 1 reply-window bonus)"
            - "DiscoveryRequest.${dr2_id}.status == GRANTED after the ruling (6 >= 6)"

      - name: brief_overage_fee_round_per_brief_then_sum
        grounds:
          - calculations.brief_overage_fee
          - entities.Brief.fields.overage_fee_cents
          - entities.Proceeding.fields.total_overage_fee_cents
        distinguishing_aspect: |
          Mode (b) nested rounding: the fee rate 316.25 cents/page forces a
          rounding-order choice. Pinned order is round_half_up per brief THEN
          sum: a 91-page PO_RESPONSE (1 overage page) and a 21-page PO_SUR_REPLY
          (1 overage page) cost 316 + 316 = 632 cents; summing raw products
          first would give round_half_up(632.5) = 633 cents.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Parties P4/O4, patent (5 claims) owned by O4, IPR petition by P4 on claims [1,2,3] accorded and INSTITUTED (scores 80/70/60, judge-dana). Proceeding phase == INSTITUTED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /ptab/parties"
              payload: { name: "P4 Corp", party_type: "PETITIONER" }
              as: PlatformAdmin
              captures: { p4_id: $.data.id }
            - call: "POST /ptab/parties"
              payload: { name: "O4 Corp", party_type: "PATENT_OWNER" }
              as: PlatformAdmin
              captures: { o4_id: $.data.id }
            - call: "POST /ptab/patents"
              payload: { patent_number: "US10000004", title: "Flange", issue_date: "2017-07-01T00:00:00Z", owner_id: "${o4_id}", total_claims: 5 }
              as: PlatformAdmin
              captures: { pat4_id: $.data.id, pat4_v: $.data.version }
            - call: "POST /ptab/petitions"
              payload: { patent_id: "${pat4_id}", petitioner_id: "${p4_id}", review_type: "IPR", challenged_claims: [1, 2, 3], grounds: [{ claim_number: 1, basis: "ANTICIPATION_102" }, { claim_number: 2, basis: "OBVIOUSNESS_103" }, { claim_number: 3, basis: "ANTICIPATION_102" }], prior_art: [{ reference_type: "PATENT", citation: "US7777777" }], real_party_in_interest: "P4 Corp", fee_paid_cents: 1900000, expected_patent_version: "${pat4_v}" }
              as: Petitioner
              as_user_id: "${p4_id}"
              captures: { pet4_id: $.data.id }
            - call: "POST /ptab/petitions/${pet4_id}/accord-filing-date"
              payload: {}
              as: BoardPanel
            - call: "POST /ptab/petitions/${pet4_id}/decide-institution"
              payload: { per_ground_scores: [{ claim_number: 1, basis: "ANTICIPATION_102", score: 80 }, { claim_number: 2, basis: "OBVIOUSNESS_103", score: 70 }, { claim_number: 3, basis: "ANTICIPATION_102", score: 60 }], lead_judge_user_id: "judge-dana" }
              as: BoardPanel
              captures: { proc4_id: $.data.proceeding_id }
          trigger:
            - call: "POST /ptab/proceedings/${proc4_id}/briefs"
              payload: { brief_type: "PO_RESPONSE", page_count: 91 }
              as: PatentOwner
              as_user_id: "${o4_id}"
              captures: { br1_fee: $.data.overage_fee_cents }
            - call: "POST /ptab/proceedings/${proc4_id}/briefs"
              payload: { brief_type: "PETITIONER_REPLY", page_count: 45 }
              as: Petitioner
              as_user_id: "${p4_id}"
              captures: { br2_fee: $.data.overage_fee_cents }
            - call: "POST /ptab/proceedings/${proc4_id}/briefs"
              payload: { brief_type: "PO_SUR_REPLY", page_count: 21 }
              as: PatentOwner
              as_user_id: "${o4_id}"
              captures: { br3_fee: $.data.overage_fee_cents }
            - call: "GET /ptab/proceedings/${proc4_id}"
              payload: {}
              as: BoardPanel
              captures: { proc_total_fee: $.data.total_overage_fee_cents }
          assert:
            - "PO_RESPONSE brief overage_fee_cents == 316 (round_half_up(1 * 316.25))"
            - "PETITIONER_REPLY brief overage_fee_cents == 0 (45 pages == limit, no overage)"
            - "PO_SUR_REPLY brief overage_fee_cents == 316"
            - "Proceeding.${proc4_id}.total_overage_fee_cents == 632 (per-brief rounding then sum; sum-then-round would yield 633)"

      - name: fintiv_proximity_compared_against_base_projected_fwd_never_extended
        grounds:
          - calculations.fintiv_discretionary_score
          - calculations.fwd_deadline_computation
        distinguishing_aspect: |
          Mode (c) circular-looking dependency with pinned evaluation order: the
          Fintiv proximity factor compares the litigation trial date to the BASE
          projected decision date + 365 days, and a statutory extension (only
          grantable post-institution) must never widen that comparison. Trial
          date 2027-10-15 sits beyond the base projection (2027-09-01) but inside
          the would-be extended date (2028-03-02): only the pinned order yields
          proximity 0, fintiv 40, INSTITUTED.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Parties P5/O5. Patent (4 claims) owned by O5. Litigation matter for the patent naming P5 as defendant: complaint served 2025-12-01T00:00:00Z (274 days before filing -> investment +20), status ACTIVE, trial_date 2027-10-15T00:00:00Z (beyond decision+365d, inside decision+548d). IPR petition by P5 on claims [1,2] filed and accorded 2026-09-01."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /ptab/parties"
              payload: { name: "P5 Corp", party_type: "PETITIONER" }
              as: PlatformAdmin
              captures: { p5_id: $.data.id }
            - call: "POST /ptab/parties"
              payload: { name: "O5 Corp", party_type: "PATENT_OWNER" }
              as: PlatformAdmin
              captures: { o5_id: $.data.id }
            - call: "POST /ptab/patents"
              payload: { patent_number: "US10000005", title: "Ratchet", issue_date: "2021-02-01T00:00:00Z", owner_id: "${o5_id}", total_claims: 4 }
              as: PlatformAdmin
              captures: { pat5_id: $.data.id, pat5_v: $.data.version }
            - call: "POST /ptab/patents/${pat5_id}/litigation-matters"
              payload: { defendant_party_id: "${p5_id}", court_name: "W.D. Tex.", docket_number: "6:25-cv-00100", complaint_served_date: "2025-12-01T00:00:00Z", trial_date: "2027-10-15T00:00:00Z" }
              as: PlatformAdmin
              captures: { m5_id: $.data.id }
            - call: "POST /ptab/petitions"
              payload: { patent_id: "${pat5_id}", petitioner_id: "${p5_id}", review_type: "IPR", challenged_claims: [1, 2], grounds: [{ claim_number: 1, basis: "ANTICIPATION_102" }, { claim_number: 2, basis: "OBVIOUSNESS_103" }], prior_art: [{ reference_type: "PATENT", citation: "US8888888" }], real_party_in_interest: "P5 Corp", fee_paid_cents: 1900000, expected_patent_version: "${pat5_v}" }
              as: Petitioner
              as_user_id: "${p5_id}"
              captures: { pet5_id: $.data.id }
            - call: "POST /ptab/petitions/${pet5_id}/accord-filing-date"
              payload: {}
              as: BoardPanel
          trigger:
            - call: "POST /ptab/petitions/${pet5_id}/decide-institution"
              payload: { per_ground_scores: [{ claim_number: 1, basis: "ANTICIPATION_102", score: 90 }, { claim_number: 2, basis: "OBVIOUSNESS_103", score: 85 }], lead_judge_user_id: "judge-erin" }
              as: BoardPanel
              captures: { f_outcome: $.data.outcome, f_score: $.data.fintiv_score }
          assert:
            - "the decision outcome == INSTITUTED (merits max 90 >= 40 and Fintiv below the denial band)"
            - "fintiv_score == 40 (base 20 + proximity 0 + investment 20 + stay 0): trial 2027-10-15 is strictly after the base projected decision date + 365 days (2027-09-01)"
            - "an implementation that widened the comparison by the 183-day extension (2028-03-02) would score 80 and DENY — the pinned base-date order is what admits institution"

  # ===========================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: proceeding_remand_cycle_reopens_trial_and_reanchors_windows
        grounds:
          - state_machines.Proceeding.transitions.DECIDED_to_REMANDED
          - state_machines.Proceeding.transitions.REMANDED_to_REPLY_WINDOW
          - state_machines.Appeal.transitions.FILED_to_VACATED_AND_REMANDED
        distinguishing_aspect: |
          Proceeding is cyclic: DECIDED -> REMANDED -> REPLY_WINDOW closes a
          loop back into the briefing pipeline (briefing_cycle 0 -> 1, deadlines
          re-anchored to the remand date, amendment budget incremented), whereas
          the second instance exercises a different entity (OralHearing) looping
          SCHEDULED -> REQUESTED -> SCHEDULED.
        test_recipe:
          setup:
            - "Logical clock 2026-09-01T00:00:00Z. Parties P6/O6, patent (3 claims) owned by O6, petition by P6 on claims [1,2] INSTITUTED (judge-frank). PO_RESPONSE (80 pages) and PETITIONER_REPLY (40 pages) filed on day 0; hearing requested, scheduled 2027-03-01T14:00-15:00Z in Room R6 and resolved HELD; final written decision issued finding claim 1 UNPATENTABLE and claim 2 NOT_UNPATENTABLE -> proceeding DECIDED. Petitioner appeals. Clock then advanced to 2027-10-01T00:00:00Z for the appellate disposition."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /ptab/parties"
              payload: { name: "P6 Corp", party_type: "PETITIONER" }
              as: PlatformAdmin
              captures: { p6_id: $.data.id }
            - call: "POST /ptab/parties"
              payload: { name: "O6 Corp", party_type: "PATENT_OWNER" }
              as: PlatformAdmin
              captures: { o6_id: $.data.id }
            - call: "POST /ptab/patents"
              payload: { patent_number: "US10000006", title: "Crank", issue_date: "2019-11-01T00:00:00Z", owner_id: "${o6_id}", total_claims: 3 }
              as: PlatformAdmin
              captures: { pat6_id: $.data.id, pat6_v: $.data.version }
            - call: "POST /ptab/petitions"
              payload: { patent_id: "${pat6_id}", petitioner_id: "${p6_id}", review_type: "IPR", challenged_claims: [1, 2], grounds: [{ claim_number: 1, basis: "ANTICIPATION_102" }, { claim_number: 2, basis: "OBVIOUSNESS_103" }], prior_art: [{ reference_type: "PATENT", citation: "US9999999" }], real_party_in_interest: "P6 Corp", fee_paid_cents: 1900000, expected_patent_version: "${pat6_v}" }
              as: Petitioner
              as_user_id: "${p6_id}"
              captures: { pet6_id: $.data.id }
            - call: "POST /ptab/petitions/${pet6_id}/accord-filing-date"
              payload: {}
              as: BoardPanel
            - call: "POST /ptab/petitions/${pet6_id}/decide-institution"
              payload: { per_ground_scores: [{ claim_number: 1, basis: "ANTICIPATION_102", score: 88 }, { claim_number: 2, basis: "OBVIOUSNESS_103", score: 77 }], lead_judge_user_id: "judge-frank" }
              as: BoardPanel
              captures: { proc6_id: $.data.proceeding_id }
            - call: "POST /ptab/proceedings/${proc6_id}/briefs"
              payload: { brief_type: "PO_RESPONSE", page_count: 80 }
              as: PatentOwner
              as_user_id: "${o6_id}"
            - call: "POST /ptab/proceedings/${proc6_id}/briefs"
              payload: { brief_type: "PETITIONER_REPLY", page_count: 40 }
              as: Petitioner
              as_user_id: "${p6_id}"
            - call: "POST /ptab/hearing-rooms"
              payload: { name: "Room R6", capacity: 40 }
              as: PlatformAdmin
              captures: { room6_id: $.data.id }
            - call: "POST /ptab/proceedings/${proc6_id}/oral-hearings"
              payload: {}
              as: Petitioner
              as_user_id: "${p6_id}"
              captures: { oh6_id: $.data.id }
