        distinguishing_aspect: "A participant born 1990-02-14 is 35 at termination_date 2026-01-15, below normal_retirement_age 65, so the RETIREMENT branch returns ERR_RETIREMENT_AGE_NOT_ATTAINED (422) and the participant stays ACTIVE."
