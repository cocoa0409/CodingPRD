            - { call: "POST /glass/qual-cycles/${q_id}/record-result", payload: { outcome: "PASSED" }, as: DeviceMaker, as_user_id: "${m_id}" }
            - { call: "GET /glass/programs/${p_id}", as: ProgramManager, captures: { p_v: $.data.version } }
            - { call: "POST /glass/commitments", payload: { program_id: "${p_id}", committed_units: 5000, required_units: 5000, prepayment_cents: 2500000, expected_program_version: "${p_v}" }, as: ProgramManager, captures: { c_id: $.data.id } }
            - { call: "POST /glass/commitments/${c_id}/sign", as: DeviceMaker, as_user_id: "${m_id}" }
            - { call: "POST /glass/commitments/${c_id}/countersign", as: CapacityPlanner, as_user_id: "planner-01" }
            - { call: "POST /glass/commitments/${c_id}/confirm-prepayment", as: FinanceController, as_user_id: "fin-01" }
            - { call: "POST /glass/tanks", payload: { commitment_id: "${c_id}", capacity_units_per_day: 1000 }, as: CapacityPlanner, captures: { t_id: $.data.id } }
            - { call: "POST /glass/_clock/set_current_utc", payload: { to_iso8601: "2028-02-23T00:00:00Z" }, as: PlatformAdmin }
            - { call: "POST /glass/tanks/${t_id}/commission", as: CapacityPlanner }
          trigger:
            - { call: "POST /glass/campaigns", payload: { tank_id: "${t_id}", composition_id: "${cx_id}", start_date: "2028-03-01T00:00:00Z", end_date: "2029-03-01T00:00:00Z", planned_units: 49999 }, as: CapacityPlanner, captures: { a_cost: $.data.provisional_unit_cost_cents, a_good: $.data.expected_good_units } }
            - { call: "POST /glass/campaigns", payload: { tank_id: "${t_id}", composition_id: "${cx_id}", start_date: "2029-03-01T00:00:00Z", end_date: "2030-03-01T00:00:00Z", planned_units: 50000 }, as: CapacityPlanner, captures: { b_cost: $.data.provisional_unit_cost_cents, b_good: $.data.expected_good_units } }
