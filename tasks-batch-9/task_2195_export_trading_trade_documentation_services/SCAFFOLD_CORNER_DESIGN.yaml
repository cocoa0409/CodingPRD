            - "lc_status_after == \"UTILISED\" because drawn == 197375.00 is at or above min_drawable 190000.00, and fulfillment_after == \"CLOSED\""
      - name: corner_pinned_source_version_travels_with_each_document_revision
        claim_type: version_pinning_on_approval
        grounds:
          - complexity_layers.version_pinning_on_approval
          - entities.TradeDocument.fields.pinned_order_version
          - entities.TradeDocument.fields.supersedes_document_id
          - errors[ERR_DOCUMENT_STALE_SOURCE]
          - state_machines.TradeDocument.transitions.DRAFT_to_SUPERSEDED
        distinguishing_aspect: "A document is a snapshot: revision 1 pins the order version it was drafted from, an unrelated issue moves the order underneath it, and the pin — not the content — is what blocks issuance. Regeneration is the only repair, and it re-pins to the current version while writing the self-referential supersedes_document_id edge, so the chain is readable in both directions and the abandoned revision is left SUPERSEDED rather than deleted."
        test_recipe:
          setup:
            - "one compliance-cleared order with a single line of 100 EA at 250.0000"
            - "an unrelated CERTIFICATE_OF_ORIGIN is issued between drafting and issuing the invoice, purely to advance the order version"
          setup_api_calls:
            - call: "POST /foreign-buyers"
              as: TradeComplianceOfficer
              as_user_id: "u_comp_carl"
              payload: { legal_name: "Lisbon Cork Importers Lda", country_code: "PT", credit_rating: "A", sanctions_tier: "NONE", restricted_party_flag: false }
              captures: { buyer_id: "$.data.id" }
            - call: "POST /export-orders"
              as: ExportOpsCoordinator
              as_user_id: "u_ops_alice"
              payload: { buyer_id: "${buyer_id}", incoterm: "FOB", incoterm_named_place: "Port of Charleston", origin_country_code: "US", destination_country_code: "PT", destination_zone: "ZONE_2", invoice_currency: "USD", fx_rate_usd_to_invoice: 1.000000, ship_by_date: "2026-09-30T00:00:00Z" }
              captures: { order_id: "$.data.id" }
            - call: "POST /export-orders/${order_id}/shipment-lines"
              as: ExportOpsCoordinator
              as_user_id: "u_ops_alice"
              payload: { line_no: 1, goods_description: "cork press dies", hs_code: "820790", quantity: 100.000, uom: "EA", unit_price_usd: 250.0000, net_weight_kg: 1000.000, gross_weight_kg: 1200.000, package_count: 10 }
              captures: { line_id: "$.data.id" }
            - call: "POST /letters-of-credit"
              as: ExportOpsCoordinator
              as_user_id: "u_ops_alice"
              payload: { export_order_id: "${order_id}", lc_number: "LC-CORNER-9001", issuing_bank_swift: "BCOMPTPL", amount_usd: 25000.00, tolerance_pct: 5.00, availability: "SIGHT", usance_days: 0, expiry_date: "2026-12-31T00:00:00Z", latest_shipment_date: "2026-09-20T00:00:00Z", presentation_period_days: 21, required_document_types: ["COMMERCIAL_INVOICE"] }
              captures: { lc_id: "$.data.id", lc_v: "$.data.version" }
            - call: "POST /letters-of-credit/${lc_id}/reviews"
              as: DocumentaryCreditReviewer
              as_user_id: "u_rev_bob"
              payload: { expected_letter_of_credit_version: "${lc_v}" }
              captures: { review_id: "$.data.id", reviewed_lc_version: "$.data.reviewed_lc_version" }
            - call: "POST /lc-terms-reviews/${review_id}/submit"
              as: DocumentaryCreditReviewer
              as_user_id: "u_rev_bob"
              payload: { recommendation: "ACCEPT" }
            - call: "POST /export-orders/${order_id}/submit-for-compliance"
              as: ExportOpsCoordinator
              as_user_id: "u_ops_alice"
              payload: {}
            - call: "GET /export-control-screenings"
              as: TradeComplianceOfficer
              as_user_id: "u_comp_carl"
              payload: { export_order_id: "${order_id}", limit: 10, offset: 0 }
              captures: { screening_id: "$.data[0].id" }
            - call: "POST /export-control-screenings/${screening_id}/decision"
              as: TradeComplianceOfficer
              as_user_id: "u_comp_carl"
              payload: { license_determination: "NLR", eccn: "3A991", denied_party_hits: 0 }
            - call: "GET /export-orders/${order_id}"
              as: ExportOpsCoordinator
              as_user_id: "u_ops_alice"
              payload: {}
              captures: { order_v_at_drafting: "$.data.version" }
            - call: "POST /trade-documents"
              as: ExportOpsCoordinator
              as_user_id: "u_ops_alice"
              payload: { export_order_id: "${order_id}", doc_type: "COMMERCIAL_INVOICE" }
              captures: { inv_v1: "$.data.id", pin_v1: "$.data.pinned_order_version", revision_v1: "$.data.revision", supersedes_v1: "$.data.supersedes_document_id" }
          trigger:
            - call: "POST /trade-documents"
              as: ExportOpsCoordinator
              as_user_id: "u_ops_alice"
              payload: { export_order_id: "${order_id}", doc_type: "CERTIFICATE_OF_ORIGIN" }
              captures: { coo_id: "$.data.id" }
            - call: "POST /trade-documents/${coo_id}/issue"
              as: ExportOpsCoordinator
              as_user_id: "u_ops_alice"
              payload: {}
              captures: { coo_status: "$.data.status" }
            - call: "POST /trade-documents/${inv_v1}/issue"
              as: ExportOpsCoordinator
              as_user_id: "u_ops_alice"
              payload: {}
              captures: { err_stale_source: "$.data.error_id" }
            - call: "POST /trade-documents/${inv_v1}/regenerate"
              as: ExportOpsCoordinator
              as_user_id: "u_ops_alice"
              payload: { reason: "order version advanced after an unrelated certificate was issued" }
              captures: { inv_v2: "$.data.id", pin_v2: "$.data.pinned_order_version", revision_v2: "$.data.revision", supersedes_v2: "$.data.supersedes_document_id" }
            - call: "GET /trade-documents/${inv_v1}"
              as: ExportOpsCoordinator
              as_user_id: "u_ops_alice"
              payload: {}
              captures: { v1_status_after: "$.data.status" }
            - call: "POST /trade-documents/${inv_v2}/issue"
              as: ExportOpsCoordinator
              as_user_id: "u_ops_alice"
              payload: {}
              captures: { v2_status: "$.data.status", v2_declared_total: "$.data.declared_total_usd" }
            - call: "GET /trade-documents"
              as: ExportOpsCoordinator
              as_user_id: "u_ops_alice"
              payload: { supersedes_document_id: "${inv_v1}", limit: 10, offset: 0 }
              captures: { chained_child: "$.data[0].id", chained_revision: "$.data[0].revision" }
          assert:
            - "pin_v1 == order_v_at_drafting, revision_v1 == 1 and supersedes_v1 is null — revision 1 pins the order version it was drafted from"
            - "coo_status == \"ISSUED\", which advanced the order version by 1 and left the invoice pin one behind"
            - "err_stale_source == \"ERR_DOCUMENT_STALE_SOURCE\" with HTTP 409: the DRAFT to ISSUED transition requires pinned_order_version to equal the order's current version, and nothing about the invoice content changed"
            - "revision_v2 == 2, supersedes_v2 == inv_v1 and pin_v2 == pin_v1 + 1 — regeneration re-pins to the current order version"
            - "v1_status_after == \"SUPERSEDED\": the abandoned revision is retained, not deleted, so the audit chain stays intact"
            - "v2_status == \"ISSUED\" and v2_declared_total == 25000.00, and that issue advanced the order version once more"
            - "the filtered read returns total_count 1 with chained_child == inv_v2 and chained_revision == 2, so the self-referential supersedes_document_id edge is traversable from parent to child"
            - "reviewed_lc_version is stamped on the terms review at creation, giving the credit the same snapshot discipline the documents get from pinned_order_version"

  - section: consistency_model
    instances:
      - name: corner_one_booking_write_is_already_visible_in_four_aggregates
        claim_type: immediate_visibility
        grounds:
          - consistency_model.immediate
          - endpoints.POST /freight-bookings
          - calculations.sailing_capacity_ledger
          - calculations.incoterm_cost_allocation
        distinguishing_aspect: "The declared consistency model is immediate, so a single booking write must be fully observable the instant it returns: its own computed window and chargeable weight in the response body, the sailing's capacity ledger, the order's fulfillment status and stored provisional costs, and the recomputed cost-allocation read — with no second call needed to settle. The DRY_20 container minimum makes the chargeable weight diverge from the booked weight, which proves the read is showing computed state rather than echoing input."
        test_recipe:
          setup:
            - "gross weight 1200.000 kg booked in a DRY_20 container whose minimum chargeable weight is 8000.000 kg"
            - "sailing capacity 20000.000 kg, cutoff 2026-08-18T00:00:00Z, etd 2026-08-21T00:00:00Z, DOC_BUFFER_HOURS 24"
