              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { cls_id: $.data.id }
            - call: "POST /parity/nqtl-items"
              payload: { plan_year_id: "${py_id}", classification_id: "${cls_id}", nqtl_type: "REIMBURSEMENT_RATE", applied_to: "BOTH", description: "Outpatient reimbursement rate methodology." }
              as: ComplianceOfficer
              as_user_id: "user-officer-01"
              captures: { item_id: $.data.id, item_v: $.data.version }
            - call: "POST /parity/comparative-analyses"
              payload: { nqtl_item_id: "${item_id}", factor_count: 2, evidentiary_standard_count: 1, stringency_written_finding: "COMPARABLE", stringency_operation_finding: "COMPARABLE", expected_nqtl_item_version: "${item_v}" }
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
              captures: { ca_id: $.data.id }
            - call: "POST /parity/comparative-analyses/${ca_id}/submit"
              payload: {}
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
            - call: "POST /parity/comparative-analyses/${ca_id}/review"
              payload: { outcome: "INSUFFICIENT", review_note: "Round 1: the factor inventory is not comparable in operation." }
              as: ComplianceOfficer
              as_user_id: "user-officer-02"
            - call: "POST /parity/comparative-analyses/${ca_id}/reopen"
              payload: {}
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
            - call: "POST /parity/comparative-analyses/${ca_id}/submit"
              payload: {}
              as: PlanSponsor
              as_user_id: "user-sponsor-01"
            - call: "POST /parity/comparative-analyses/${ca_id}/review"
