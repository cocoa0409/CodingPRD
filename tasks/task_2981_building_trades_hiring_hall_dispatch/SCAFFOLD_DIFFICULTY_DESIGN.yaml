            - "${both_error} != ERR_REREGISTRATION_WINDOW_EXPIRED"
            - "Second trigger returns 409 with ${temporal_only_error} == ERR_REREGISTRATION_WINDOW_EXPIRED — with a well-owned predecessor the temporal rule is reached, proving the ordering rather than a swallowed check"
  - rule_id: boundary_precision_check
    instances:
      - name: acceptance_deadline_exact_instant_is_inclusive
        grounds:
          - entities.Referral.fields.acceptance_deadline
          - calculations.registration_timing_windows
          - validations[priority=27]
          - endpoints["POST /hiring-hall/referrals/{id}/accept"]
          - endpoints["POST /hiring-hall/dispatch-runs"]
        distinguishing_aspect: |
          METRIC: a millisecond-precision INSTANT (acceptance_deadline) probed at
          deadline-exactly and deadline+0.001s, across two DIFFERENT endpoints
          (accept and the dispatch-runs sweep), which sit on opposite sides of the
          comparison: accept passes while clock <= deadline, the sweep expires only when
          clock > deadline. The sibling instance probes an integer count, not an instant.
        test_recipe:
          setup:
            - "Clock 2026-09-02T00:00:00.000Z; home Local 512; GROUP_1 (SENIORITY, requires_local_hours 4000); ACTIVE ratio policy."
            - "Zoe Amin (9000 h) and Ash Brar (8000 h) both register on GROUP_1."
            - "Two LONG_CALL requests, each for one journeyworker: request A is referred to Zoe (rank 1), then request B is referred to Ash (now rank 1)."
            - "Both referrals are issued at 2026-09-02T00:00:00.000Z, so ACCEPTANCE_WINDOW_HOURS 24 puts both acceptance_deadline values at exactly 2026-09-03T00:00:00.000Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-02T00:00:00.000Z" }
              as: HallAdmin
            - call: "POST /hiring-hall/locals"
              payload: { local_number: 512, name: "Local 512 (home)", kind: "HOME", reciprocity_factor_bp: 0 }
              as: HallAdmin
              captures: { home_local_id: $.data.id }
            - call: "POST /hiring-hall/out-of-work-lists"
              payload: { group_code: "GROUP_1", priority_rank: 1, ordering_policy: "SENIORITY", requires_local_hours: 4000, accepts_travelers: false }
              as: HallAdmin
              captures: { g1_id: $.data.id }
            - call: "POST /hiring-hall/ratio-policies"
              payload: { policy_code: "STD-2026", first_apprentice_at_jw_count: 1, then_every_n_jw: 4, effective_from: "2026-01-01T00:00:00.000Z" }
              as: HallAdmin
              captures: { policy_id: $.data.id }
            - call: "POST /hiring-hall/members"
              payload: { full_name: "Zoe Amin", home_local_id: "${home_local_id}", classification: "JOURNEYWORKER", local_hours_in_trade: 9000 }
              as: HallAdmin
              captures: { m_zoe_id: $.data.id }
            - call: "POST /hiring-hall/members"
              payload: { full_name: "Ash Brar", home_local_id: "${home_local_id}", classification: "JOURNEYWORKER", local_hours_in_trade: 8000 }
              as: HallAdmin
