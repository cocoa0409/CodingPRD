              captures: { err_404: $.data.error_id, msg_404: $.data.message }
            - call: "POST /sponsors"
              payload: { name: "Zephyr Cola", category: "SPACECRAFT", contact_email: "ops@zephyr.example" }
              as: SponsorshipSeller
              as_user_id: "u-seller-01"
              captures: { err_422: $.data.error_id, msg_422: $.data.message }
          assert:
            - "${err_404} == ERR_PROPERTY_NOT_FOUND"
            - "${err_422} == ERR_VALIDATION_FAILED"
            - "${msg_404} is a non-empty string"
            - "${msg_422} is a non-empty string"
            - "both responses carry response_type == error and a meta block with api_request_id and api_request_timestamp"

