            - "after the second withdrawal RecoveryGroup.${g1_id}.open_finding_count == 0, back to its starting value"
            - "Finding.${fM1_id}.state == WITHDRAWN and Finding.${fM2_id}.state == WITHDRAWN, and neither row was deleted"
            - "RecoveryGroup.${g1_id}.posture == READY with posture_reason == READY_ALL_CHECKS_PASSED throughout — MEDIUM findings never gate posture, so the compensation leaves no residue"
            - "Runbook.${rb1_id}.readiness_score is still 100.00, confirming the finding ledger is independent of the readiness ledger"
