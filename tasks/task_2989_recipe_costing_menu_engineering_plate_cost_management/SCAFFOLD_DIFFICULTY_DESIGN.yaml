            - "${c1_region} == MW — copied from the menu item, so all four campaigns share the region the capacity rule scopes by"
            - "${c4_status_created} == PLANNED — the fourth create succeeded, which is only possible because each create re-read the item version bumped by the previous create"
            - "${c1_status} == LAUNCHED — zero LAUNCHED neighbours"
            - "${c2_status} == LAUNCHED — exactly one LAUNCHED window intersects [2026-08-12, 2026-08-22), and 1 < 2"
            - "${c3_error} == ERR_LTO_WINDOW_CAPACITY with HTTP 409 — C1 and C2 both intersect [2026-08-15, 2026-08-25), so the count is 2 and the strict comparison fails"
            - "${c4_status} == LAUNCHED — window_start 2026-08-22 equals C2's window_end and is after C1's, so the half-open windows have zero intersections; C3 is still COSTED and is not counted"
            - "LTOCampaign.${c3_id}.status == COSTED with promo_plate_cost_cents 100 preserved — the refused launch changed nothing on the campaign"
            - "MenuItem.${mi_id}.open_lto_count == 4 and is_lto == true — the counter tracks planned campaigns while the flag tracks launches"
            - "GET /culinary/lto-campaigns filtered by status LAUNCHED returns 3 rows in window_start ASC order: C1, C2, C4"
  - rule_id: compensating_invariant
    instances:
      - name: spec_change_rollback_restores_the_batch_cost_identity_exactly
        grounds:
          - state_machines.SpecChangeOrder.APPROVED_to_ROLLED_BACK
          - entities.SpecChangeOrder.fields.pre_change_batch_cost_micros
          - entities.SpecChangeOrder.fields.pre_change_ep_quantity_base_units
          - calculations.recipe_cost_rollup
          - entities.Recipe.fields.cost_state
        distinguishing_aspect: |
          The conserved quantity is the identity Recipe.batch_cost_micros == sum of
          extended_cost_micros over ACTIVE components. A roll-up deliberately runs BETWEEN approve
          and rollback, so the rollback's snapshot restore (batch back to 3880071) leaves the
          component still holding the 5820106 the roll-up wrote — the identity is momentarily
          broken and cost_state == STALE is the only marker of that, with portion_cost_micros left
          at 1455027 because it is not in the snapshot set; a compensating roll-up closes the loop
          exactly. The other compensating_invariant instance conserves a BITMASK through an
          add-then-delete pair with no snapshot fields at all.
        test_recipe:
          setup:
            - "GRILL WORLD: CHEDDAR-BLOCK at 22000000 per 2268 PUBLISHED for MW; Recipe PLATE-GRILL ACTIVE / FRESH (batch_yield 4, portions 4, one cheddar component at ep 400) with batch_cost_micros 3880071, portion_cost_micros 970018, kcal_per_portion_micros 400000000 and sodium_mcg_per_portion 620000; MenuItem MI-GRILL-MW ACTIVE with plate_cost_cents 100."
            - "One SpecChangeOrder of change_type COMPONENT_QTY on that component with new_ep_quantity_base_units 600, submitted by u-dev-1 and approved by u-dir-1, whose approval snapshotted pre_change_batch_cost_micros 3880071 and pre_change_ep_quantity_base_units 400."
            - "A cost roll-up is then run on the changed specification, writing extended_cost_micros 5820106, batch_cost_micros 5820106 and portion_cost_micros 1455027 and returning the recipe to FRESH."
          setup_api_calls:
            - call: "POST /culinary/ingredients"
              payload: { sku: "CHEDDAR-BLOCK", name: "Cheddar Block", base_uom: "GRAM", pack_base_units: 2268, trim_yield_bps: 10000, cook_shrink_bps: 0, allergen_mask: 1, kcal_per_base_unit_micros: 4000000, sodium_mcg_per_base_unit: 6200 }
              as: RecipeDeveloper
              as_user_id: u-dev-1
              captures: { ched_id: $.data.id }
            - call: "POST /culinary/price-feeds"
              payload: { distributor_code: "BROADLINE", region_code: "MW", feed_date: "2026-07-01T00:00:00.000Z" }
              as: CostAnalyst
              captures: { feed1_id: $.data.id }
            - call: "POST /culinary/price-feeds/${feed1_id}/lines"
              payload: { ingredient_id: "${ched_id}", pack_cost_micros: 22000000, effective_from: "2026-07-01T00:00:00.000Z" }
              as: CostAnalyst
            - call: "POST /culinary/price-feeds/${feed1_id}/publish"
              as: CostAnalyst
            - call: "POST /culinary/recipes"
              payload: { code: "PLATE-GRILL", name: "Grilled Cheese Plate", recipe_type: "PLATED", base_uom: "EACH", batch_yield_base_units: 4, portions_per_batch: 4 }
              as: RecipeDeveloper
              as_user_id: u-dev-1
              captures: { grill_id: $.data.id, grill_v0: $.data.version }
            - call: "POST /culinary/recipes/${grill_id}/components"
              payload: { component_type: "INGREDIENT", ingredient_id: "${ched_id}", ep_quantity_base_units: 400, sequence_no: 1, expected_recipe_version: "${grill_v0}" }
              as: RecipeDeveloper
              as_user_id: u-dev-1
              captures: { comp1_id: $.data.id }
            - call: "POST /culinary/recipes/${grill_id}/cost-rollup"
              payload: { basis: "LATEST_PUBLISHED" }
              as: CostAnalyst
              captures: { batch_before: $.data.batch_cost_micros, portion_before: $.data.portion_cost_micros }
            - call: "POST /culinary/recipes/${grill_id}/submit-review"
              as: RecipeDeveloper
              as_user_id: u-dev-1
            - call: "POST /culinary/recipes/${grill_id}/activate"
              as: CulinaryDirector
              as_user_id: u-dir-1
              captures: { grill_v_active: $.data.version }
            - call: "POST /culinary/menu-items"
              payload: { code: "MI-GRILL-MW", name: "Grilled Cheese", recipe_id: "${grill_id}", region_code: "MW", current_price_cents: 400, target_food_cost_bps: 3000, declared_allergen_mask: 1 }
              as: RecipeDeveloper
              as_user_id: u-dev-1
              captures: { mi_id: $.data.id }
            - call: "POST /culinary/menu-items/${mi_id}/plate-cost"
              as: CostAnalyst
              captures: { plate_before: $.data.plate_cost_cents }
            - call: "POST /culinary/menu-items/${mi_id}/activate"
              as: CulinaryDirector
              as_user_id: u-dir-1
            - call: "POST /culinary/spec-change-orders"
              payload: { recipe_id: "${grill_id}", change_type: "COMPONENT_QTY", target_component_id: "${comp1_id}", new_ep_quantity_base_units: 600, expected_recipe_version: "${grill_v_active}" }
              as: RecipeDeveloper
              as_user_id: u-dev-1
              captures: { sco_id: $.data.id }
            - call: "POST /culinary/spec-change-orders/${sco_id}/submit"
              as: RecipeDeveloper
              as_user_id: u-dev-1
            - call: "POST /culinary/spec-change-orders/${sco_id}/approve"
              as: CulinaryDirector
              as_user_id: u-dir-1
              captures: { pre_batch: $.data.pre_change_batch_cost_micros, pre_ep: $.data.pre_change_ep_quantity_base_units, pre_mask: $.data.pre_change_allergen_mask }
            - call: "POST /culinary/recipes/${grill_id}/cost-rollup"
              payload: { basis: "LATEST_PUBLISHED" }
              as: CostAnalyst
              captures: { batch_mid: $.data.batch_cost_micros, portion_mid: $.data.portion_cost_micros, state_mid: $.data.cost_state }
          trigger:
            - call: "POST /culinary/spec-change-orders/${sco_id}/rollback"
              as: CulinaryDirector
              as_user_id: u-dir-1
              captures: { sco_approval: $.data.approval_status, sco_prop: $.data.propagation_status }
            - call: "GET /culinary/recipes/${grill_id}"
              as: CostAnalyst
              captures: { batch_after_rollback: $.data.batch_cost_micros, portion_after_rollback: $.data.portion_cost_micros, state_after_rollback: $.data.cost_state, kcal_after_rollback: $.data.kcal_per_portion_micros, open_sco_after: $.data.open_spec_change_count }
            - call: "GET /culinary/recipe-components/${comp1_id}"
              as: CostAnalyst
              captures: { comp_ep_after: $.data.ep_quantity_base_units, comp_ext_after: $.data.extended_cost_micros }
            - call: "POST /culinary/recipes/${grill_id}/cost-rollup"
              payload: { basis: "LATEST_PUBLISHED" }
              as: CostAnalyst
              captures: { batch_final: $.data.batch_cost_micros, portion_final: $.data.portion_cost_micros, state_final: $.data.cost_state }
          assert:
            - "${batch_before} == 3880071, ${portion_before} == 970018 and ${plate_before} == 100 — the pre-change identity"
            - "${pre_batch} == 3880071, ${pre_ep} == 400 and ${pre_mask} == 1 — the snapshot taken at approval, before any figure moved"
            - "${batch_mid} == 5820106 (ap 600 * 22000000 / 2268), ${portion_mid} == 1455027 and ${state_mid} == FRESH — the roll-up that runs between the approve and the rollback is what makes the compensation non-trivial"
            - "${sco_approval} == ROLLED_BACK and ${sco_prop} == NOT_STARTED"
            - "${comp_ep_after} == 400 with ap_quantity_base_units 400 — the specification is restored exactly"
            - "${comp_ext_after} == 5820106 — the rollback restores specifications and snapshots, never per-component costs"
            - "${batch_after_rollback} == 3880071 — restored from pre_change_batch_cost_micros, so batch_cost_micros != sum of ACTIVE extended_cost_micros (3880071 vs 5820106) for exactly this window"
            - "${state_after_rollback} == STALE — the flag that marks the identity as unreconciled is the only thing standing between the two figures"
            - "${portion_after_rollback} == 1455027 — portion_cost_micros is not part of the restored snapshot set, so it still shows the rolled-back specification's value"
            - "${kcal_after_rollback} == 400000000 and sodium_mcg_per_portion == 620000 — the nutrition roll-up IS recomputed from the restored component set, unlike the cost figures"
            - "${open_sco_after} == 0 — decremented at approval and left alone by the rollback"
            - "${batch_final} == 3880071, ${portion_final} == 970018 and ${state_final} == FRESH, with RecipeComponent.${comp1_id}.extended_cost_micros back to 3880071 — the compensating roll-up closes the identity with no drift from the pre-change figures"
            - "MenuItem.${mi_id}.plate_cost_state == STALE with plate_cost_cents still 100, allergen_mask 1 and sodium_mcg_per_portion 620000 copied back from the recipe"

      - name: component_add_then_delete_conserves_the_recipe_allergen_bitmask
        grounds:
          - calculations.allergen_nutrition_rollup
          - endpoints[DELETE /culinary/recipe-components/{recipe_component_id}]
          - endpoints[POST /culinary/recipes/{recipe_id}/components]
          - entities.RecipeComponent.fields.status
          - entities.Recipe.fields.allergen_mask
          - concurrency_rules[component-remove-stale-recipe]
        distinguishing_aspect: |
          The conserved quantity is a BITMASK (plus the kcal roll-up) rather than a money identity,
          and it is conserved with NO snapshot anywhere: adding PEANUT-OIL takes allergen_mask 1 ->
          9 and kcal_per_portion_micros 400000000 -> 500000000, and the soft DELETE recomputes both
          back to 1 and 400000000 from the remaining ACTIVE components alone, while the removed row
          deliberately keeps its historical extended_cost_micros 634249 instead of being zeroed and
          sodium_mcg_per_portion never moves at all because peanut oil carries no sodium. The other
          compensating_invariant instance restores money figures from explicit pre_change snapshots
          on a workflow row.
        test_recipe:
          setup:
            - "Two ingredients with PUBLISHED MW prices from 2026-07-01T00:00:00Z: CHEDDAR-BLOCK (pack 2268, 22000000, allergen_mask 1 = MILK, kcal_per_base_unit_micros 4000000, sodium_mcg_per_base_unit 6200) and PEANUT-OIL (pack 946, 12000000, allergen_mask 8 = PEANUT, kcal_per_base_unit_micros 8000000, sodium_mcg_per_base_unit 0). Both prices must exist or the second roll-up would fail with ERR_NO_PUBLISHED_PRICE."
            - "Recipe PLATE-GRILL stays in DRAFT for the whole chain, the only state besides UNDER_REVIEW in which its component set may be edited; batch_yield_base_units 4 and portions_per_batch 4."
            - "It starts with one ACTIVE cheddar component at ep 400 and is rolled up to batch_cost_micros 3880071 with allergen_mask 1, kcal_per_portion_micros 400000000 and sodium_mcg_per_portion 620000."
            - "Every component write and the DELETE consume the recipe version from a fresh read, since each of them increments Recipe.version."
          setup_api_calls:
            - call: "POST /culinary/ingredients"
              payload: { sku: "CHEDDAR-BLOCK", name: "Cheddar Block", base_uom: "GRAM", pack_base_units: 2268, trim_yield_bps: 10000, cook_shrink_bps: 0, allergen_mask: 1, kcal_per_base_unit_micros: 4000000, sodium_mcg_per_base_unit: 6200 }
              as: RecipeDeveloper
              captures: { ched_id: $.data.id }
            - call: "POST /culinary/ingredients"
              payload: { sku: "PEANUT-OIL", name: "Peanut Oil", base_uom: "GRAM", pack_base_units: 946, trim_yield_bps: 10000, cook_shrink_bps: 0, allergen_mask: 8, kcal_per_base_unit_micros: 8000000, sodium_mcg_per_base_unit: 0 }
              as: RecipeDeveloper
              captures: { oil_id: $.data.id }
            - call: "POST /culinary/price-feeds"
              payload: { distributor_code: "BROADLINE", region_code: "MW", feed_date: "2026-07-01T00:00:00.000Z" }
              as: CostAnalyst
              captures: { feed1_id: $.data.id }
            - call: "POST /culinary/price-feeds/${feed1_id}/lines"
              payload: { ingredient_id: "${ched_id}", pack_cost_micros: 22000000, effective_from: "2026-07-01T00:00:00.000Z" }
              as: CostAnalyst
            - call: "POST /culinary/price-feeds/${feed1_id}/lines"
              payload: { ingredient_id: "${oil_id}", pack_cost_micros: 12000000, effective_from: "2026-07-01T00:00:00.000Z" }
              as: CostAnalyst
            - call: "POST /culinary/price-feeds/${feed1_id}/publish"
              as: CostAnalyst
            - call: "POST /culinary/recipes"
              payload: { code: "PLATE-GRILL", name: "Grilled Cheese Plate", recipe_type: "PLATED", base_uom: "EACH", batch_yield_base_units: 4, portions_per_batch: 4 }
              as: RecipeDeveloper
              captures: { grill_id: $.data.id, grill_v0: $.data.version }
            - call: "POST /culinary/recipes/${grill_id}/components"
              payload: { component_type: "INGREDIENT", ingredient_id: "${ched_id}", ep_quantity_base_units: 400, sequence_no: 1, expected_recipe_version: "${grill_v0}" }
              as: RecipeDeveloper
              captures: { comp1_id: $.data.id }
            - call: "POST /culinary/recipes/${grill_id}/cost-rollup"
              payload: { basis: "LATEST_PUBLISHED" }
              as: CostAnalyst
              captures: { batch_before: $.data.batch_cost_micros, mask_before: $.data.allergen_mask, kcal_before: $.data.kcal_per_portion_micros, sodium_before: $.data.sodium_mcg_per_portion, count_before: $.data.component_count }
            - call: "GET /culinary/recipes/${grill_id}"
              as: RecipeDeveloper
              captures: { grill_v1: $.data.version }
          trigger:
            - call: "POST /culinary/recipes/${grill_id}/components"
              payload: { component_type: "INGREDIENT", ingredient_id: "${oil_id}", ep_quantity_base_units: 50, sequence_no: 2, expected_recipe_version: "${grill_v1}" }
              as: RecipeDeveloper
              captures: { comp2_id: $.data.id, comp2_ap: $.data.ap_quantity_base_units }
            - call: "GET /culinary/recipes/${grill_id}"
              as: RecipeDeveloper
              captures: { mask_mid: $.data.allergen_mask, kcal_mid: $.data.kcal_per_portion_micros, sodium_mid: $.data.sodium_mcg_per_portion, count_mid: $.data.component_count, grill_v2: $.data.version }
            - call: "POST /culinary/recipes/${grill_id}/cost-rollup"
              payload: { basis: "LATEST_PUBLISHED" }
              as: CostAnalyst
              captures: { batch_mid: $.data.batch_cost_micros }
            - call: "GET /culinary/recipes/${grill_id}"
              as: RecipeDeveloper
              captures: { grill_v3: $.data.version }
            - call: "DELETE /culinary/recipe-components/${comp2_id}"
              payload: { expected_recipe_version: "${grill_v3}" }
              as: RecipeDeveloper
              captures: { comp2_status: $.data.status, comp2_ext: $.data.extended_cost_micros }
            - call: "GET /culinary/recipes/${grill_id}"
              as: RecipeDeveloper
              captures: { mask_after: $.data.allergen_mask, kcal_after: $.data.kcal_per_portion_micros, sodium_after: $.data.sodium_mcg_per_portion, count_after: $.data.component_count, state_after: $.data.cost_state, batch_after: $.data.batch_cost_micros }
            - call: "POST /culinary/recipes/${grill_id}/cost-rollup"
              payload: { basis: "LATEST_PUBLISHED" }
              as: CostAnalyst
              captures: { batch_final: $.data.batch_cost_micros, portion_final: $.data.portion_cost_micros }
          assert:
            - "${batch_before} == 3880071, ${mask_before} == 1, ${kcal_before} == 400000000, ${sodium_before} == 620000 and ${count_before} == 1"
            - "${comp2_ap} == 50 — peanut oil has no trim and no shrink, so ap equals ep"
            - "${mask_mid} == 9 == 1 | 8 (MILK | PEANUT), ${kcal_mid} == 500000000 ((400 * 4000000 + 50 * 8000000) / 4) and ${count_mid} == 2 — the add recomputes the roll-up immediately, without any cost roll-up"
            - "${sodium_mid} == 620000 — unchanged, because peanut oil contributes no sodium; not every roll-up field moves"
            - "${batch_mid} == 4514320 (3880071 + 634249)"
            - "${comp2_status} == REMOVED with ${comp2_ext} == 634249 — the soft delete keeps the historical extended cost instead of zeroing it"
            - "${mask_after} == 1 — exactly the pre-add bitmask, recomputed as the OR over the remaining ACTIVE components with no snapshot involved; a delete that merely cleared the PEANUT bit would coincidentally agree here, but a delete that left the mask at 9 would not"
            - "${kcal_after} == 400000000, ${sodium_after} == 620000 and ${count_after} == 1"
            - "${state_after} == STALE with ${batch_after} == 4514320 — the delete recomputes the nutrition roll-up but leaves the money figure to the next roll-up, so the identity is broken exactly while cost_state says so"
            - "${batch_final} == 3880071 and ${portion_final} == 970018 — identical to the pre-add figures, and the REMOVED row's 634249 contributes nothing to the sum"
            - "RecipeComponent.${comp1_id}.extended_cost_micros == 3880071 and status == ACTIVE throughout"
