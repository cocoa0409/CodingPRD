  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: plan_confirm_gated_on_fulfillment_center_receiving_status
        grounds:
          - validations[priority=9]
          - errors[ERR_FC_RECEIVING_SUSPENDED]
          - state_machines.InboundShipmentPlan.DRAFT_to_CONFIRMED
          - entities.FulfillmentCenter.fields.receiving_status
        distinguishing_aspect: |
          Entity pair InboundShipmentPlan -> FulfillmentCenter: the plan's own DRAFT state and quota are
          entirely valid, and the confirm outcome is decided purely by the other entity's receiving_status —
          SUSPENDED gives 409 ERR_FC_RECEIVING_SUSPENDED, and after patching the same center back to OPEN the
          identical call succeeds.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Seller with an ACTIVE quota of restock_limit_units 3000 and one DRAFT plan of 100 units, well within every limit."
            - "Destination FulfillmentCenter patched to receiving_status SUSPENDED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: MarketplaceAdmin
            - call: "POST /fulfillment/sellers"
              payload: { legal_name: "Northwind Goods", storage_cubic_feet_entitlement: 1000.0000, unit_cost_cap_cents: 200000 }
              as: MarketplaceAdmin
              captures: { s_id: "$.data.id" }
