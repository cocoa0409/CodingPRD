  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: hsr_size_exactly_at_threshold_is_not_below_threshold
        grounds:
          - calculations.hsr_size_of_transaction
          - entities.HsrAnalysis.fields.determination
          - errors[ERR_TRANSACTION_NOT_ANALYZED]
        distinguishing_aspect: |
          Numeric threshold boundary on the size-of-transaction metric, reached
          through POST /compliance/hsr-analyses: a size of exactly
          12000000000 cents is NOT below the threshold (the comparison is
          strictly <) and therefore falls through to the size-of-person test and
          becomes FILING_REQUIRED, while 11999999999 is BELOW_THRESHOLD.
        test_recipe:
          setup:
            - "One BusinessUnit and two DRAFT Transactions whose SIGNED_DEAL sizes are exactly 12000000000 and exactly 11999999999 cents; both pass the size-of-person test with 50000000000 / 5000000000 assets."
          setup_api_calls:
            - call: "POST /compliance/business-units"
              payload: { name: "Specialty Resins EMEA", market_code: "EU-RESIN", market_share_bps: 1200, interaction_point_count: 4, competitor_overlap_pct: 25, exposure_budget_points: 100, review_minutes_budget: 480 }
              as: ComplianceAdmin
              as_user_id: "admin-1"
              captures: { bu_id: $.data.id }
            - call: "POST /compliance/transactions"
              payload: { business_unit_id: "${bu_id}", target_name: "Exactly At Threshold BV", deal_value_cents: 11900000000, assumed_liabilities_cents: 100000000, market_valuation_cents: 11900000000, acquirer_total_assets_cents: 50000000000, target_total_assets_cents: 5000000000, signed_at: "2026-06-01T00:00:00Z", exemption_code: "NONE" }
              as: BusinessLead
              as_user_id: "${bu_id}"
              captures: { tx_at_id: $.data.id, tx_at_v: $.data.version }
            - call: "POST /compliance/transactions"
              payload: { business_unit_id: "${bu_id}", target_name: "One Cent Below BV", deal_value_cents: 11899999999, assumed_liabilities_cents: 100000000, market_valuation_cents: 11899999999, acquirer_total_assets_cents: 50000000000, target_total_assets_cents: 5000000000, signed_at: "2026-06-01T00:00:00Z", exemption_code: "NONE" }
              as: BusinessLead
              as_user_id: "${bu_id}"
              captures: { tx_below_id: $.data.id, tx_below_v: $.data.version }
          trigger:
            - call: "POST /compliance/hsr-analyses"
              payload: { transaction_id: "${tx_at_id}", valuation_variant: "SIGNED_DEAL", expected_transaction_version: "${tx_at_v}" }
              as: AntitrustCounsel
              as_user_id: "counsel-1"
              captures: { an_at_id: $.data.id }
            - call: "POST /compliance/hsr-analyses"
              payload: { transaction_id: "${tx_below_id}", valuation_variant: "SIGNED_DEAL", expected_transaction_version: "${tx_below_v}" }
              as: AntitrustCounsel
              as_user_id: "counsel-1"
              captures: { an_below_id: $.data.id }
          assert:
            - "HsrAnalysis.${an_at_id}.size_of_transaction_cents == 12000000000"
            - "HsrAnalysis.${an_at_id}.determination == FILING_REQUIRED"
            - "HsrAnalysis.${an_at_id}.filing_required == true"
            - "Transaction.${tx_at_id}.status == ANALYZED"
            - "HsrAnalysis.${an_below_id}.size_of_transaction_cents == 11999999999"
            - "HsrAnalysis.${an_below_id}.determination == BELOW_THRESHOLD"
            - "HsrAnalysis.${an_below_id}.filing_required == false"
            - "Transaction.${tx_below_id}.status == EXEMPT"

      - name: risk_variants_converge_on_empty_incident_set
        grounds:
          - calculations.market_risk_index
          - entities.RiskAssessment.fields.interaction_component
          - entities.RiskAssessment.fields.incident_load
        distinguishing_aspect: |
          A DIFFERENT boundary metric on a DIFFERENT endpoint
          (POST /compliance/risk-assessments): the empty-collection edge. With
          zero escalated contacts, zero flagged attendances, zero completed
          audits AND interaction_point_count 0, INCIDENT_ADJUSTED must collapse
          onto BASELINE at exactly 46.00 rather than erroring or defaulting to a
          non-zero load, and interaction_component must be 0, not the cap.
        test_recipe:
          setup:
            - "A brand-new BusinessUnit with market_share_bps 3000, interaction_point_count 0, competitor_overlap_pct 5 and no contacts, attendances or audits of any kind."
          setup_api_calls:
