    instances:
      - name: injection_administer_blocked_by_expired_series_pack
        grounds:
          - state_machines.SeriesPack.ACTIVE_to_EXPIRED
          - validations[priority=32]
          - conservation_invariants.series_entitlement_conservation
          - errors[ERR_SERIES_EXPIRED]
        distinguishing_aspect: |
          Entity pair InjectionVisit to SeriesPack: the visit's administer transition is
          legal on its own axis but is refused because the referenced pack has crossed
          expires_at, and the refusal first commits the forfeiture so all 8 entitlements
          move from remaining_visits to forfeited_visits.
        test_recipe:
          setup:
            - "A B12 series pack purchased at 2026-05-01T00:00:00Z, so it expires at 2027-05-01T00:00:00Z."
            - "A SCHEDULED B12 injection visit for 2027-05-02T09:00:00Z."
