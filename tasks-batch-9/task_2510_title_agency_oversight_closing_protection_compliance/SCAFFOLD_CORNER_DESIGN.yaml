          - calculations.unremitted_premium_ledger
        excluded_because:
          difficulty_instance: compensating_invariant / unremitted_premium_ledger_restored_exactly_by_statement_reopen
          rationale: "Reopening a settled statement and the exact restoration of every side effect it had applied is the whole subject of that §1.8 instance."

