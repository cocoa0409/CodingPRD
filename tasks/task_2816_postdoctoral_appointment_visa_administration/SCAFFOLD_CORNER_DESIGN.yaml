      - name: the_grievance_window_end_carries_exactly_three_fractional_second_digits
        claim_type: precision
        grounds:
          - calculations.non_renewal_notice_policy
          - constants.GRIEVANCE_WINDOW_DAYS
          - state_machines.ReappointmentReview.RECOMMENDED_NON_RENEW_to_FINALIZED_NON_RENEWED
        distinguishing_aspect: "The declared precision is integer days for the notice fields and exactly three fractional second digits for grievance_window_end. Finalizing a non-renewal at 2027-05-01T10:00:00Z must produce 2027-05-22T23:59:59.999Z - not ...59Z, not ...59.999999Z, and not the finalization time-of-day carried forward - while notice_days_required stays the integer 30 and term_extension_days stays 0 because the notice is timely."
        test_recipe:
          setup:
            - "One US-citizen scholar needing no sponsorship, one mentor with valid training."
            - "One VERIFIED NIH_SCALE FEDERAL_GRANT (300000.00, 2026-09-01 to 2027-12-31) with no document requirements."
