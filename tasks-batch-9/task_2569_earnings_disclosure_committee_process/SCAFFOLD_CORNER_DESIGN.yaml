              captures: { legal_id: $.data.id }
            - call: "POST /disclosure/charters/${charter_a}/members"
              payload: { full_name: "Nora Finance", function: "FINANCE", is_officer: false, voting: true }
              as: ComplianceAdmin
              captures: { fin_id: $.data.id }
            - call: "POST /disclosure/charters/${charter_a}/members"
              payload: { full_name: "Rhea Chief", function: "FINANCE", is_officer: true, voting: true }
              as: ComplianceAdmin
              captures: { ceo_id: $.data.id }
            - call: "POST /disclosure/charters/${charter_a}/members"
              payload: { full_name: "Sam Fiscal", function: "FINANCE", is_officer: true, voting: true }
              as: ComplianceAdmin
              captures: { cfo_id: $.data.id }
            - call: "POST /disclosure/charters/${charter_a}/transitions"
              payload: { action: "ADOPT" }
              as: DisclosureCommitteeChair
              as_user_id: "${legal_id}"
            - call: "POST /disclosure/charters"
              payload: { name: "Sibling Issuer Charter", version_label: "2026.1", min_quorum_count: 2, required_functions: ["FINANCE"] }
              as: ComplianceAdmin
              captures: { charter_b: $.data.id }
            - call: "POST /disclosure/charters/${charter_b}/members"
              payload: { full_name: "Vic Foreign", function: "FINANCE", is_officer: true, voting: true }
              as: ComplianceAdmin
              captures: { foreign_officer: $.data.id }
            - call: "POST /disclosure/charters/${charter_b}/members"
              payload: { full_name: "Wren Foreign", function: "FINANCE", is_officer: true, voting: true }
