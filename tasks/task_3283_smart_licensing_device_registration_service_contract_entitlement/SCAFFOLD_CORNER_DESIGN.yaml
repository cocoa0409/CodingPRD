            - call: "POST /api/smart-accounts"
              payload: { account_ref: "C18B", display_name: "P2" }
              as: PlatformAdmin
          trigger:
            - call: "GET /api/smart-accounts?limit=1&offset=1"
              payload: {}
              as: PlatformAdmin
              captures: { rows: $.data }
          assert:
            - "rows.data has length 1"
            - "rows.total_count == 2"
            - "rows.has_more == false"
            - "the returned row is the second-created account (created_at ordering)"
