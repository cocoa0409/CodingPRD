            - "the well-formed DRIVER returns 201: Volunteer.${driver_id}.cdl_number == IL-99887766, credential_id == null, screening_status == PENDING"
            - "${show_missing_time_err} == ERR_CONDITIONAL_FIELD_MISMATCH and ${rehearsal_with_time_err} == ERR_CONDITIONAL_FIELD_MISMATCH"
            - "${orphan_mileage_err} == ERR_CONDITIONAL_FIELD_MISMATCH — travel_miles_from_previous must be 0 when previous_stop_id is null"
            - "no TourStop exists and exactly one Volunteer exists after the seven calls"

      - name: future_dating_outranks_the_withdrawal_back_date_window
        claim_type: priority_ordering
        grounds:
          - validations.priority_44_ERR_FUTURE_DATED_INPUT
          - validations.priority_45_ERR_WITHDRAWAL_DATE_OUT_OF_RANGE
        distinguishing_aspect: "A withdrawal_date of 2027-05-01 read against a clock at 2027-04-01 violates BOTH temporal rules at once — it is in the future (44) and before spring_training_start_date 2027-05-10 (45) — and the lower priority number must win; the same date with the clock at 2027-05-20 then isolates rule 45, and a screening decided_on in the future proves rule 44 fires on the other endpoint too."
        test_recipe:
          setup:
            - "One OFFERED member exists in a season whose spring training starts 2027-05-10, plus one PENDING volunteer. The clock is moved to 2027-04-01, before spring training."
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "2027 Tour", year: 2027, tuition_base_cents: 399900, spring_training_start_date: "2027-05-10", spring_training_end_date: "2027-06-05", tour_departure_date: "2027-06-12" }
              as: CorpsDirector
              captures: { season_id: "$.data.id" }
            - call: "POST /members"
              payload: { season_id: "${season_id}", full_name: "Avery Nakamura", email: "avery@corps.test", date_of_birth: "2005-03-04", section: "BRASS", dietary_flag: "NONE" }
              as: MembershipCoordinator
              captures: { member_id: "$.data.id" }
            - call: "POST /members/${member_id}/audition-decision"
              payload: { decision: "OFFER", audition_score: 90 }
              as: MembershipCoordinator
            - call: "POST /volunteers"
              payload: { full_name: "Rosa Cook", email: "rosa@corps.test", role_type: "COOK" }
              as: VolunteerScreener
              captures: { volunteer_id: "$.data.id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-04-01T00:00:00Z" }
              as: MembershipCoordinator
          trigger:
            - call: "POST /members/${member_id}/withdraw"
              payload: { withdrawal_date: "2027-05-01", reason: "both rules violated" }
              as: MembershipCoordinator
              captures: { both_err: "$.data.error_id" }
            - call: "POST /volunteers/${volunteer_id}/screening-decision"
              payload: { decision: "CLEAR", decided_on: "2027-04-02" }
              as: VolunteerScreener
              captures: { screening_future_err: "$.data.error_id" }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-05-20T00:00:00Z" }
              as: MembershipCoordinator
            - call: "POST /members/${member_id}/withdraw"
              payload: { withdrawal_date: "2027-05-01", reason: "back-dated only" }
              as: MembershipCoordinator
              captures: { range_only_err: "$.data.error_id" }
            - call: "POST /members/${member_id}/withdraw"
              payload: { withdrawal_date: "2027-05-20", reason: "legal" }
              as: MembershipCoordinator
          assert:
            - "${both_err} == ERR_FUTURE_DATED_INPUT with HTTP 409 — priority 44 beats priority 45 when a single date violates both"
            - "${screening_future_err} == ERR_FUTURE_DATED_INPUT and Volunteer.${volunteer_id}.screening_status is still PENDING with screening_decided_on == null"
            - "${range_only_err} == ERR_WITHDRAWAL_DATE_OUT_OF_RANGE with HTTP 409 once the clock has passed the date, isolating rule 45"
            - "Member.${member_id}.membership_status stayed OFFERED through all three refusals"
            - "the legal withdrawal returns 200 with membership_status == WITHDRAWN, withdrawal_obligation_basis == NONE and withdrawal_obligation_cents == 0 because no contract was ever executed"

      - name: site_block_gap_of_exactly_180_minutes_is_accepted
        claim_type: aggregate_validation
        grounds:
          - validations.priority_39_ERR_SITE_BLOCK_CONFLICT
          - calculations.site_booking_exclusivity
        distinguishing_aspect: "The 90-minute load buffer on both sides makes the required clear gap 180 minutes with STRICT comparisons: a block starting exactly 180 minutes after the previous one ends is accepted, 179 minutes is refused, and the same 179-minute block becomes legal the moment the earlier booking is released because RELEASED bookings impose no buffer at all."
        test_recipe:
          setup:
            - "A SIGNED tour-rehearsal agreement covers 2027-06-18 to 2027-06-25 at one school. Booking one occupies 2027-06-19T08:00Z to 12:00Z on a PLANNED stop."
          setup_api_calls:
            - call: "POST /seasons"
              payload: { name: "2027 Tour", year: 2027, tuition_base_cents: 399900, spring_training_start_date: "2027-05-10", spring_training_end_date: "2027-06-05", tour_departure_date: "2027-06-12" }
