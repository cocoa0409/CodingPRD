  # Section: errors
  # ===========================================================================
  - section: errors
    instances:
      - name: error_invalid_state_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_INVALID_STATE]"]
        excluded_because:
          difficulty_instance: state_before_segregation_of_duties_on_verify
          rationale: "Asserted as the failure path of the named §1.8 instance (verify on PROPOSED plan)."

      - name: error_deadline_passed_covered
        claim_type: violation_to_error
        grounds: ["errors[ERR_DEADLINE_PASSED]"]
        excluded_because:
          difficulty_instance: response_due_at_exact_boundary
          rationale: "Boundary instance pins the <= semantics; the past-deadline rejection is also exercised by response_submit_after_deadline_returns_deadline_passed and risk_acceptance_expired_at_creation_rejected in §1.9."

      - name: error_template_not_published_on_issue
        claim_type: violation_to_error
        grounds: ["errors[ERR_TEMPLATE_NOT_PUBLISHED]"]
        distinguishing_aspect: "Issuing a cycle whose template is still DRAFT returns ERR_TEMPLATE_NOT_PUBLISHED (422)."
        test_recipe:
          setup: ["Cycle created against a DRAFT template (template drafted after cycle creation) — issue attempted while template unpublished"]
          setup_api_calls:
            - call: "POST /vsa/tier-policies"
              payload: { name: "P1", active: true, tier_matrix: {} }
              as: PlatformAdmin
            - call: "POST /vsa/questionnaire-templates"
              payload: { title: "T", applies_to_tiers: ["TIER_1"], items: [ {item_key: "a", prompt: "p", weight: 1, control_domain: "d"} ] }
              as: RiskAnalyst
              captures: { t_id: $.data.id }
            - call: "POST /vsa/vendors"
              payload: { legal_name: "V", data_sensitivity: "INTERNAL", access_level: "READ_ONLY", criticality: "LOW" }
              as: RiskAnalyst
              captures: { v_id: $.data.id, v_ver: $.data.version }
            - call: "POST /vsa/vendors/${v_id}/cycles"
              payload: { template_id: "${t_id}", expected_vendor_version: "${v_ver}" }
              as: RiskAnalyst
              captures: { c_id: $.data.id }
          trigger:
            - call: "POST /vsa/vendors/${v_id}/cycles/${c_id}/issue"
              payload: {}
              as: RiskAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_TEMPLATE_NOT_PUBLISHED"

      - name: error_pagination_invalid
        claim_type: violation_to_error
        grounds: ["errors[ERR_PAGINATION_INVALID]", response_envelope]
        distinguishing_aspect: "limit=0 or limit=101 returns ERR_PAGINATION_INVALID (422) per envelope bounds (min 1, max 100)."
        test_recipe:
          setup: ["Any data"]
          setup_api_calls:
            - call: "POST /vsa/tier-policies"
              payload: { name: "P1", active: true, tier_matrix: {} }
              as: PlatformAdmin
          trigger:
            - call: "GET /vsa/vendors"
              payload: { limit: 0 }
              as: RiskAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_PAGINATION_INVALID"

