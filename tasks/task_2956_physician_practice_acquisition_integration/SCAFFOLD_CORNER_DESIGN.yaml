              as: IntegrationManager
              as_user_id: "im-1"
              captures: { offer_id: "$.data.id" }
          assert:
            - "StaffTransitionOffer.${offer_id}.uplift_component_cents == 144000"
            - "StaffTransitionOffer.${offer_id}.pto_component_cents == 34615"
            - "StaffTransitionOffer.${offer_id}.wage_floor_applied == true"
            - "StaffTransitionOffer.${offer_id}.offered_annual_wage_cents == 4200000 (the floor, not the harmonised 3778615)"
            - "StaffTransitionOffer.${offer_id}.retention_bonus_cents == 210000 and status == DRAFT"
            - "Acquisition.${acq_id}.retention_pool_committed_cents == 0 and retention_pool_available_cents == 3000000"
            - "Acquisition.${acq_id}.hr_staffing_coverage_pct == 0.00 because DRAFT offers are outside the covered set"

      - name: liability_item_listing_filters_by_disposition
        claim_type: Listing
        grounds:
          - endpoints[GET /liability-items]
          - entities.LiabilityItem.fields.disposition
          - calculations.liability_escrow_ledger
        distinguishing_aspect: |
          GET /liability-items is the flat-topology reverse-reachability route for
          LiabilityItem.acquisition_id, and combining acquisition_id with disposition
          narrows the result to the ESCROWED subset that the escrow ledger sums,
          proving the filter and the aggregate agree on the same row set.
        test_recipe:
          setup:
            - "One ASSET Acquisition with escrow_total_cents 10000000."
            - "Two LiabilityItems: an EQUIPMENT_LEASE exposure of 2500000 moved to ESCROWED, and an UNPAID_PTO exposure of 400000 left UNASSIGNED."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
