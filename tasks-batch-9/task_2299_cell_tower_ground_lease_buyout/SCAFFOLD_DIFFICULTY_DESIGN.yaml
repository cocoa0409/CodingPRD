  - rule_id: resource_temporal_overlap
    instances:
      - name: pledge_period_closed_interval_forbids_adjacent_start_day
        grounds:
          - calculations.pledge_period_conflict_check
          - validations[priority=38]
          - entities.CollateralPledge.fields.pledge_end_date
          - concurrency_rules[pledge-create-stale-facility]
        distinguishing_aspect: |
          This overlap check is over CLOSED date intervals on a LeaseStream and forbids adjacency: a
          second pledge starting on 2026-12-31, the exact end day of the existing pledge, is rejected with
          ERR_PLEDGE_PERIOD_OVERLAP, and only a start of 2027-01-01 is accepted — the opposite convention
          to the half-open ROFR window in rofr_window_half_open_allows_adjacent_notice_after_lapse.
        test_recipe:
          setup:
            - "An acquired lease stream pledged to a MARK_TO_MODEL facility for the closed interval 2026-08-01 to 2026-12-31."
            - "The facility has no advances outstanding, so no borrowing-base rule interferes."
            - "The logical clock is at the default 2026-08-01T00:00:00Z; pledge periods are pure date data and are not clock-gated."
          setup_api_calls:
