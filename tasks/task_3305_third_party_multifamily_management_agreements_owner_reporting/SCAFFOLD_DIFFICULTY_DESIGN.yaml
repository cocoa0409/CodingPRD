  # ===========================================================================
  # Rule 4 — transitive_cascade (different triggers; one depth >= 3, one >= 2)
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: disposition_listing_to_termination_cascade_depth3
        grounds:
          - state_machines.Property.OPEN_to_OPEN
          - state_machines.Property.OPEN_to_CLOSED
          - state_machines.ManagementAgreement.TERMINATION_PENDING_to_TERMINATED
        distinguishing_aspect: |
          Depth-3 cascade from complete_disposition: (1) Property OPEN ->
          CLOSED, which (2) drives the TERMINATION_PENDING(DISPOSITION)
          agreement -> TERMINATED, which itself (3) cascades VendorContract
          ASSIGNED_TO_MANAGER -> TERMINATED — each link caused by the
          previous link, not fan-out from the original call.
        test_recipe:
          setup:
            - "Owner O7; Agreement AG7 ACTIVE; Property P7 MANAGED (zero-balance onboarding, one resident)"
            - "VendorContract V7 on P7 with assignment_status == ASSIGNED_TO_MANAGER"
            - "P7 listed for disposition; AG7 terminated with terminated_reason == DISPOSITION (fee tail computed; tail invoiced via EXPENSE ledger entry of the computed amount so the tail-invoice precondition holds)"
          setup_api_calls:
            - call: "POST /mgmt/owners"
              payload: { legal_name: "Dispo Owner LP", distribution_day_of_month: 10 }
              as: PortfolioManager
              captures: { o7_id: $.data.id }
