            - call: "POST /loyalty/stays/${s2_id}/post"
              payload: {}
              as: ProgramAdministrator
            - call: "GET /loyalty/elite-benefit-deliveries"
              payload: { stay_id: "${s2_id}" }
              as: ProgramAdministrator
              captures: { d_id: "$.data[0].id" }
          trigger:
            - call: "POST /loyalty/stays"
              payload: { member_id: "${m2_id}", hotel_id: "${hA_id}", rate_plan_id: "${rpB_id}", checkin_date: "2026-07-01", checkout_date: "2026-07-03", room_revenue_cents: 40000 }
              as: ProgramAdministrator
              captures: { e_rate_plan: $.data.error_id }
            - call: "POST /loyalty/member-complaints"
              payload: { member_id: "${m2_id}", subject_type: "BENEFIT_DENIAL", description: "I want this upgrade reviewed.", related_delivery_id: "${d_id}" }
              as: Member
              as_user_id: "${m2_id}"
              captures: { e_delivery: $.data.error_id }
            - call: "POST /loyalty/member-complaints"
              payload: { member_id: "${m1_id}", subject_type: "BENEFIT_DENIAL", description: "My own upgrade, please review.", related_delivery_id: "${d_id}" }
              as: Member
              as_user_id: "${m1_id}"
              captures: { c_ok: $.data.id, c_status: $.data.status }
          assert:
            - "${e_rate_plan} == ERR_RATE_PLAN_HOTEL_MISMATCH with http 422 - both the hotel and the rate plan exist, so neither priority 10 nor 11 fires"
            - "${e_delivery} == ERR_DELIVERY_MEMBER_MISMATCH with http 422 - the delivery exists, so priority 15 does not fire; it simply hangs off Member One's stay"
            - "the third call succeeds: MemberComplaint.${c_ok} exists with ${c_status} == OPEN and related_delivery_id == ${d_id}, proving the same delivery is acceptable to its own member"
            - "GET /loyalty/member-complaints returns total_count == 1"

      - name: channel_and_pricing_prerequisites_are_checked_before_anything_is_priced
        claim_type: conditional_validation
        grounds:
          - validations.priority_27_ERR_PARTNER_CHANNEL_MISMATCH
          - validations.priority_28_ERR_NO_REDEMPTION_PRICING
          - calculations.point_purchase_pricing
          - calculations.redemption_pricing_selection
        distinguishing_aspect: |
          Whether partner_id is required flips on the channel: PARTNER_SALE demands it while
          CO_BRAND_CARD and DIRECT_PURCHASE forbid it, and both violations answer with the same
          conditional rule. In the same spirit a redemption whose arrival no pricing row covers is
          refused before any price, blackout, inventory or balance check can run - the arrival is
          one day outside the only window on file.
        test_recipe:
          setup:
            - "One ACTIVE property with a single STANDARD pricing row covering only 2026-09-01..2026-09-30."
            - "One AIRLINE partner and one member funded with 40000 points."
          setup_api_calls:
            - call: "POST /loyalty/hotels"
              payload: { name: "Prereq Palace", brand_code: "PQP", market_tier: "URBAN", program_fee_pct: 0.05, rooms_count: 100, trailing_12m_occupancy_pct: 0.82, trailing_12m_adr_cents: 30000 }
              as: ProgramAdministrator
              captures: { h_id: $.data.id }
            - call: "POST /loyalty/hotels/${h_id}/rate-plans"
              payload: { rate_code: "BAR", rate_category: "TRANSIENT" }
              as: ProgramAdministrator
              captures: { rp_id: $.data.id }
            - call: "POST /loyalty/hotels/${h_id}/activate"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /loyalty/hotels/${h_id}/redemption-pricing"
              payload: { season: "STANDARD", window_start_date: "2026-09-01", window_end_date: "2026-09-30", points_per_night: 20000, cash_copay_cents: 0, min_tier_required: "BASE", award_allotment_per_night: 2 }
              as: ProgramAdministrator
              captures: { pr_id: $.data.id }
            - call: "POST /loyalty/partners"
              payload: { name: "Northline Air", partner_type: "AIRLINE", points_cost_per_1000_cents: 900, monthly_cap_points: 500000 }
              as: ProgramAdministrator
              captures: { pt_id: $.data.id }
            - call: "POST /loyalty/members"
              payload: { email: "pq1@example.com", full_name: "Sofia Marchetti", enrollment_date: "2026-01-18" }
              as: ProgramAdministrator
              captures: { m_id: $.data.id }
            - call: "POST /loyalty/point-purchases"
              payload: { member_id: "${m_id}", channel: "DIRECT_PURCHASE", points_quantity: 40000 }
              as: ProgramAdministrator
              captures: { pp_id: $.data.id }
            - call: "POST /loyalty/point-purchases/${pp_id}/settle"
              payload: {}
              as: ProgramAdministrator
            - call: "GET /loyalty/hotels/${h_id}"
              payload: {}
              as: ProgramAdministrator
              captures: { h_v: $.data.version }
          trigger:
            - call: "POST /loyalty/point-purchases"
              payload: { member_id: "${m_id}", channel: "PARTNER_SALE", points_quantity: 10000 }
              as: ProgramAdministrator
              captures: { e_missing_partner: $.data.error_id }
            - call: "POST /loyalty/point-purchases"
              payload: { member_id: "${m_id}", channel: "DIRECT_PURCHASE", points_quantity: 10000, partner_id: "${pt_id}" }
              as: ProgramAdministrator
              captures: { e_extra_partner: $.data.error_id }
            - call: "POST /loyalty/point-purchases"
              payload: { member_id: "${m_id}", channel: "PARTNER_SALE", points_quantity: 10000, partner_id: "${pt_id}" }
              as: ProgramAdministrator
              captures: { pp_ok: $.data.id, pp_ok_cash: $.data.cash_due_cents }
            - call: "POST /loyalty/redemptions"
              payload: { member_id: "${m_id}", hotel_id: "${h_id}", checkin_date: "2026-10-01", checkout_date: "2026-10-03", expected_hotel_version: "${h_v}" }
              as: MemberCareAgent
              as_user_id: "care-pq-01"
              captures: { e_no_pricing: $.data.error_id }
            - call: "POST /loyalty/redemptions"
              payload: { member_id: "${m_id}", hotel_id: "${h_id}", checkin_date: "2026-09-30", checkout_date: "2026-10-02", expected_hotel_version: "${h_v}" }
              as: MemberCareAgent
              as_user_id: "care-pq-01"
              captures: { r_ok: $.data.id, r_season: $.data.season, r_charged: $.data.points_charged }
          assert:
            - "${e_missing_partner} == ERR_PARTNER_CHANNEL_MISMATCH with http 422"
            - "${e_extra_partner} == ERR_PARTNER_CHANNEL_MISMATCH with http 422 - the partner exists and is valid; it is simply not allowed on a direct sale"
            - "${pp_ok_cash} == 9000 - 10 lots at the partner's own 900-cent list price, with no volume discount below 25000 points"
            - "${e_no_pricing} == ERR_NO_REDEMPTION_PRICING with http 422 - the 2026-10-01 arrival is one day past the only window, and no inventory or balance check ran"
            - "${r_season} == STANDARD and ${r_charged} == 40000 - selection keys on the arrival date only, so a 2026-09-30 arrival is covered even though the departure is in October"
            - "PointPurchase.${pp_ok}.partner_id == ${pt_id} and Partner.${pt_id}.purchased_points_mtd == 0 while the purchase is still PENDING"

      - name: partner_monthly_cap_masks_the_members_annual_purchase_cap
        claim_type: priority_conflict
        grounds:
          - validations.priority_77_ERR_PARTNER_MONTHLY_CAP_EXCEEDED
          - validations.priority_81_ERR_PURCHASE_CAP_EXCEEDED
          - calculations.point_purchase_pricing
        distinguishing_aspect: |
          One 60000-point partner sale violates two independent ceilings at once - the partner's
          50000-point monthly cap and the member's 200000-point annual cap, already 190000 consumed -
          and answers with the lower-numbered partner rule at 422 rather than the member rule at 402.
          Removing only the partner from the request unmasks the annual cap immediately.
        test_recipe:
          setup:
            - "One RETAIL partner with monthly_cap_points 50000 and points_cost_per_1000_cents 1000."
            - "One member whose points_purchased_current_year is 190000, built from a settled 100000-point purchase and a settled 90000-point purchase."
          setup_api_calls:
            - call: "POST /loyalty/partners"
              payload: { name: "Grocerway Rewards", partner_type: "RETAIL", points_cost_per_1000_cents: 1000, monthly_cap_points: 50000 }
              as: ProgramAdministrator
              captures: { pt_id: $.data.id }
            - call: "POST /loyalty/members"
              payload: { email: "cap1@example.com", full_name: "Bruno Feld", enrollment_date: "2026-01-21" }
              as: ProgramAdministrator
              captures: { m_id: $.data.id }
            - call: "POST /loyalty/point-purchases"
              payload: { member_id: "${m_id}", channel: "DIRECT_PURCHASE", points_quantity: 100000 }
              as: ProgramAdministrator
              captures: { pp1_id: $.data.id }
            - call: "POST /loyalty/point-purchases/${pp1_id}/settle"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /loyalty/point-purchases"
              payload: { member_id: "${m_id}", channel: "DIRECT_PURCHASE", points_quantity: 90000 }
              as: ProgramAdministrator
              captures: { pp2_id: $.data.id }
            - call: "POST /loyalty/point-purchases/${pp2_id}/settle"
              payload: {}
              as: ProgramAdministrator
              captures: { m_purchased: $.data.points_quantity }
          trigger:
            - call: "POST /loyalty/point-purchases"
              payload: { member_id: "${m_id}", channel: "PARTNER_SALE", points_quantity: 60000, partner_id: "${pt_id}" }
              as: ProgramAdministrator
              captures: { e_masked: $.data.error_id }
            - call: "POST /loyalty/point-purchases"
              payload: { member_id: "${m_id}", channel: "DIRECT_PURCHASE", points_quantity: 60000 }
              as: ProgramAdministrator
              captures: { e_unmasked: $.data.error_id }
            - call: "POST /loyalty/point-purchases"
              payload: { member_id: "${m_id}", channel: "PARTNER_SALE", points_quantity: 10000, partner_id: "${pt_id}" }
              as: ProgramAdministrator
              captures: { pp3_id: $.data.id, pp3_cash: $.data.cash_due_cents }
          assert:
            - "Member.${m_id}.points_purchased_current_year == 190000 before the triggers, with ${m_purchased} == 90000 on the second settlement"
            - "${e_masked} == ERR_PARTNER_MONTHLY_CAP_EXCEEDED with http 422 - priority 77 precedes priority 81 even though both ceilings are breached"
            - "${e_unmasked} == ERR_PURCHASE_CAP_EXCEEDED with http 402 - with no partner in the request only the annual cap remains, and 190000 + 60000 exceeds 200000"
            - "${pp3_cash} == 10000 - a 10000-point partner sale fits both caps and is priced at the partner's 1000-cent list with no volume discount"
            - "Partner.${pt_id}.purchased_points_mtd == 0 - the accepted purchase is still PENDING, so no volume has been consumed yet"

      - name: pricing_windows_collide_within_a_season_and_ignore_each_other_across_seasons
        claim_type: temporal_validation
        grounds:
          - validations.priority_74_ERR_PRICING_WINDOW_OVERLAP
          - validations.priority_23_ERR_INVALID_DATE_RANGE
        distinguishing_aspect: |
          The uniqueness scope is (hotel, season) and the comparison is inclusive on both ends, so a
          single shared calendar day is a collision on either side, an abutting window that starts
          the day after the incumbent ends is fine, and a PEAK window may sit wholly inside a
          STANDARD window without complaint - until a second PEAK window touches the first.
        test_recipe:
          setup:
            - "One ACTIVE property carrying a single STANDARD pricing row for 2026-01-01..2026-06-30."
          setup_api_calls:
            - call: "POST /loyalty/hotels"
              payload: { name: "Windowline Resort", brand_code: "WLR", market_tier: "RESORT", program_fee_pct: 0.06, rooms_count: 120, trailing_12m_occupancy_pct: 0.78, trailing_12m_adr_cents: 36000 }
              as: ProgramAdministrator
              captures: { h_id: $.data.id }
            - call: "POST /loyalty/hotels/${h_id}/rate-plans"
              payload: { rate_code: "BAR", rate_category: "TRANSIENT" }
              as: ProgramAdministrator
              captures: { rp_id: $.data.id }
            - call: "POST /loyalty/hotels/${h_id}/activate"
              payload: {}
              as: ProgramAdministrator
            - call: "POST /loyalty/hotels/${h_id}/redemption-pricing"
              payload: { season: "STANDARD", window_start_date: "2026-01-01", window_end_date: "2026-06-30", points_per_night: 20000, cash_copay_cents: 0, min_tier_required: "BASE", award_allotment_per_night: 2 }
              as: ProgramAdministrator
              captures: { pr_base: $.data.id }
          trigger:
            - call: "POST /loyalty/hotels/${h_id}/redemption-pricing"
              payload: { season: "STANDARD", window_start_date: "2026-06-30", window_end_date: "2026-07-31", points_per_night: 22000, cash_copay_cents: 0, min_tier_required: "BASE", award_allotment_per_night: 2 }
              as: ProgramAdministrator
              captures: { e_tail: $.data.error_id }
            - call: "POST /loyalty/hotels/${h_id}/redemption-pricing"
              payload: { season: "STANDARD", window_start_date: "2025-12-01", window_end_date: "2026-01-01", points_per_night: 18000, cash_copay_cents: 0, min_tier_required: "BASE", award_allotment_per_night: 2 }
              as: ProgramAdministrator
              captures: { e_head: $.data.error_id }
            - call: "POST /loyalty/hotels/${h_id}/redemption-pricing"
              payload: { season: "STANDARD", window_start_date: "2026-08-31", window_end_date: "2026-08-01", points_per_night: 18000, cash_copay_cents: 0, min_tier_required: "BASE", award_allotment_per_night: 2 }
              as: ProgramAdministrator
              captures: { e_reversed: $.data.error_id }
            - call: "POST /loyalty/hotels/${h_id}/redemption-pricing"
              payload: { season: "PEAK", window_start_date: "2026-03-01", window_end_date: "2026-03-15", points_per_night: 30000, cash_copay_cents: 5000, min_tier_required: "GOLD", award_allotment_per_night: 1 }
              as: ProgramAdministrator
              captures: { pr_peak: $.data.id, pr_peak_season: $.data.season }
            - call: "POST /loyalty/hotels/${h_id}/redemption-pricing"
              payload: { season: "STANDARD", window_start_date: "2026-07-01", window_end_date: "2026-07-31", points_per_night: 22000, cash_copay_cents: 0, min_tier_required: "BASE", award_allotment_per_night: 2 }
              as: ProgramAdministrator
              captures: { pr_next: $.data.id }
            - call: "POST /loyalty/hotels/${h_id}/redemption-pricing"
              payload: { season: "PEAK", window_start_date: "2026-03-15", window_end_date: "2026-03-20", points_per_night: 31000, cash_copay_cents: 5000, min_tier_required: "GOLD", award_allotment_per_night: 1 }
              as: ProgramAdministrator
              captures: { e_peak_tail: $.data.error_id }
          assert:
            - "${e_tail} == ERR_PRICING_WINDOW_OVERLAP with http 409 - 2026-06-30 is the incumbent's last day and both bounds are inclusive"
            - "${e_head} == ERR_PRICING_WINDOW_OVERLAP with http 409 - the collision is symmetric; a window ending on the incumbent's first day is just as bad"
            - "${e_reversed} == ERR_INVALID_DATE_RANGE with http 422 - priority 23 runs before the overlap scan, and that reversed window overlaps nothing at all"
            - "${pr_peak_season} == PEAK and the row was created - a PEAK window entirely inside the STANDARD window is not an overlap, because the scope is (hotel, season)"
            - "the 2026-07-01..2026-07-31 STANDARD row ${pr_next} was created - abutting the day after the incumbent ends is legal"
            - "${e_peak_tail} == ERR_PRICING_WINDOW_OVERLAP with http 409 - now that a PEAK row exists, a second PEAK row sharing 2026-03-15 collides"
            - "GET /loyalty/redemption-pricing?hotel_id=${h_id} returns total_count == 3"

      - name: uniqueness_is_scoped_to_the_parent_not_to_the_program
        claim_type: aggregate_validation
        grounds:
          - validations.priority_73_ERR_DUPLICATE_RATE_CODE
          - validations.priority_75_ERR_DUPLICATE_BATCH_PERIOD
        distinguishing_aspect: |
          Two collection-level uniqueness rules with different scopes are exercised side by side:
          rate_code is unique inside one property so the same code is free at the next property, and
          a live reimbursement batch is unique per (property, period_month) so the same month is
          free at another property and another month is free at the same property.
        test_recipe:
          setup:
            - "Two ACTIVE properties, each with a BAR rate plan."
          setup_api_calls:
            - call: "POST /loyalty/hotels"
              payload: { name: "Unique Alpha", brand_code: "UNA", market_tier: "URBAN", program_fee_pct: 0.05, rooms_count: 100, trailing_12m_occupancy_pct: 0.82, trailing_12m_adr_cents: 30000 }
