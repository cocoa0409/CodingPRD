            - { call: "POST /awareness/phishing-templates", payload: { name: "Shared Deal Document", pretext_category: "SHARED_DOCUMENT", difficulty_tier: "TIER_1_BASIC", theme_tags: ["CURIOSITY"], credential_capture_enabled: false }, as: CampaignAuthor, as_user_id: "author-1", captures: { tpl: "$.data.id" } }
            - { call: "POST /awareness/phishing-templates/${tpl}/approve-for-use", payload: {}, as: CampaignApprover, as_user_id: "approver-1" }
            - { call: "POST /awareness/campaigns", payload: { name: "SALES Doc Wave", template_id: "${tpl}", difficulty_tier: "TIER_1_BASIC", target_departments: ["SALES"], communication_policy_ack: true }, as: CampaignAuthor, as_user_id: "author-1", captures: { c: "$.data.id" } }
            - { call: "POST /awareness/campaigns/${c}/submit-for-review", payload: {}, as: CampaignAuthor, as_user_id: "author-1" }
            - { call: "POST /awareness/campaigns/${c}/approve", payload: {}, as: CampaignApprover, as_user_id: "approver-1", captures: { c_v: "$.data.version" } }
          trigger:
            - { call: "POST /awareness/campaigns/${c}/schedule", payload: { scheduled_send_at: "2026-08-12T00:00:00Z", expected_campaign_version: "${c_v}" }, as: CampaignAuthor, as_user_id: "author-1", captures: { err: "$.data.error_id" } }
            - { call: "GET /awareness/campaigns/${c}", payload: {}, as: ProgramAdmin }
            - { call: "GET /awareness/employees/${e}", payload: {}, as: ProgramAdmin }
          assert:
            - "the schedule call returns HTTP 409 with error_id == ERR_COMMUNICATION_BLACKOUT_CONFLICT (end_at is inside the closed interval)"
            - "PhishingCampaign.${c}.state == APPROVED, scheduled_send_at == null, version unchanged at ${c_v}"
            - "no SimulationDelivery rows exist for ${c} and Employee.${e}.reserved_simulation_slots == 0"
            - "a schedule at 2026-08-12T00:00:01Z with expected_campaign_version ${c_v} succeeds, giving state SCHEDULED and reserved_simulation_slots == 1"
            - "a schedule at 2026-08-09T23:59:59Z would likewise succeed, so both endpoints are exclusive-outside and inclusive-on"

      - name: quiet_period_half_open_allows_send_exactly_at_boundary
        grounds:
          - validations[priority=24]
          - errors[ERR_SIMULATION_QUIET_PERIOD_CONFLICT]
          - entities.SimulationDelivery.fields.quiet_period_until
          - calculations.cohort_resolution
          - entities.Employee.fields.reserved_simulation_slots
        distinguishing_aspect: |
          The per-employee quiet period is HALF-OPEN, the exact opposite endpoint convention from the blackout
          window in the sibling instance: a send at [reference_instant, quiet_period_until) is refused but a send
          at exactly quiet_period_until is allowed, so the pair pins both conventions against each other and an
          implementation that uses one comparison for both temporal resources fails at least one of them.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One ACTIVE employee in HR."
            - "Campaign C1 launched at 2026-08-02T09:00:00Z so the employee's delivery has delivered_at 2026-08-02T09:00:00Z and quiet_period_until 2026-08-07T09:00:00Z (QUIET_PERIOD_DAYS 5)."
            - "Campaign C2 over the same cohort is APPROVED and its version captured."
          setup_api_calls:
            - { call: "POST /awareness/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /awareness/employees", payload: { email: "quinn.hr@corp.example", full_name: "Quinn Quiet", department: "HR", role_code: "IC", hire_date: "2017-03-03" }, as: ProgramAdmin, captures: { e: "$.data.id" } }
            - { call: "POST /awareness/phishing-templates", payload: { name: "Benefits Enrollment Window", pretext_category: "HR_BENEFITS_ENROLLMENT", difficulty_tier: "TIER_1_BASIC", theme_tags: ["REWARD"], credential_capture_enabled: false }, as: CampaignAuthor, as_user_id: "author-1", captures: { tpl: "$.data.id" } }
            - { call: "POST /awareness/phishing-templates/${tpl}/approve-for-use", payload: {}, as: CampaignApprover, as_user_id: "approver-1" }
            - { call: "POST /awareness/campaigns", payload: { name: "HR Wave 1", template_id: "${tpl}", difficulty_tier: "TIER_1_BASIC", target_departments: ["HR"], communication_policy_ack: true }, as: CampaignAuthor, as_user_id: "author-1", captures: { c1: "$.data.id" } }
            - { call: "POST /awareness/campaigns/${c1}/submit-for-review", payload: {}, as: CampaignAuthor, as_user_id: "author-1" }
            - { call: "POST /awareness/campaigns/${c1}/approve", payload: {}, as: CampaignApprover, as_user_id: "approver-1", captures: { c1_v: "$.data.version" } }
            - { call: "POST /awareness/campaigns/${c1}/schedule", payload: { scheduled_send_at: "2026-08-02T09:00:00Z", expected_campaign_version: "${c1_v}" }, as: CampaignAuthor, as_user_id: "author-1" }
            - { call: "POST /awareness/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T09:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /awareness/campaigns/${c1}/launch", payload: {}, as: ProgramAdmin }
            - { call: "GET /awareness/simulation-deliveries", payload: { campaign_id: "${c1}", employee_id: "${e}" }, as: ProgramAdmin, captures: { d1: "$.data[0].id", qpu: "$.data[0].quiet_period_until" } }
            - { call: "POST /awareness/campaigns", payload: { name: "HR Wave 2", template_id: "${tpl}", difficulty_tier: "TIER_1_BASIC", target_departments: ["HR"], communication_policy_ack: true }, as: CampaignAuthor, as_user_id: "author-1", captures: { c2: "$.data.id" } }
            - { call: "POST /awareness/campaigns/${c2}/submit-for-review", payload: {}, as: CampaignAuthor, as_user_id: "author-1" }
            - { call: "POST /awareness/campaigns/${c2}/approve", payload: {}, as: CampaignApprover, as_user_id: "approver-1", captures: { c2_v: "$.data.version" } }
          trigger:
            - { call: "POST /awareness/campaigns/${c2}/schedule", payload: { scheduled_send_at: "2026-08-07T09:00:00Z", expected_campaign_version: "${c2_v}" }, as: CampaignAuthor, as_user_id: "author-1", captures: { c2_state: "$.data.state" } }
            - { call: "GET /awareness/simulation-deliveries", payload: { campaign_id: "${c2}", employee_id: "${e}" }, as: ProgramAdmin, captures: { d2: "$.data[0].id" } }
            - { call: "GET /awareness/employees/${e}", payload: {}, as: ProgramAdmin }
          assert:
            - "SimulationDelivery.${d1}.delivered_at == 2026-08-02T09:00:00Z and quiet_period_until == 2026-08-07T09:00:00Z"
            - "the schedule at exactly 2026-08-07T09:00:00Z succeeds: PhishingCampaign.${c2}.state == SCHEDULED, scheduled_send_at == 2026-08-07T09:00:00Z, evaluable_count == 1"
            - "SimulationDelivery.${d2}.state == QUEUED with base_difficulty_tier TIER_1_BASIC"
            - "Employee.${e}.reserved_simulation_slots == 1 (C1's delivery is DELIVERED, only C2 holds a reservation)"
            - "a schedule at 2026-08-07T08:59:59Z instead returns 409 ERR_SIMULATION_QUIET_PERIOD_CONFLICT, leaving C2 APPROVED with scheduled_send_at null"

  - rule_id: compensating_invariant
    instances:
      - name: suspension_ledger_restored_when_assignment_voided
        grounds:
          - state_machines.CurriculumAssignment.ESCALATED_to_VOIDED
          - endpoints[POST /awareness/curriculum-assignments/{id}/void]
          - calculations.access_consequence_severity
          - entities.Employee.fields.active_suspension_count
          - entities.Employee.fields.access_posture
          - entities.AccessConsequence.fields.lift_reason_code
        distinguishing_aspect: |
          The invariant is "Employee.active_suspension_count equals the number of that employee's ACTIVE
          SYSTEM_ACCESS_SUSPENSION rows, and access_posture equals rank_to_posture of the maximum ACTIVE rank".
          One sweep at 14 days overdue walks levels 1, 2 and 3 in ascending order and drives the ledger to
          SUSPENDED / count 1 through TWO consequence rows; the void must unwind every one of them and restore the
          ledger exactly, with no residue in either the count or the posture.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "A MANAGER employee and one ACTIVE direct report holding an ANNUAL assignment due 2026-08-31T00:00:00Z."
            - "The clock is advanced to 2026-09-14T00:00:00Z (14 days overdue) and one sweep is run, which walks levels 1, 2 and 3, creating three notices and two consequences (MFA_REVIEW rank 2 from level 2, SYSTEM_ACCESS_SUSPENSION rank 3 from level 3)."
          setup_api_calls:
            - { call: "POST /awareness/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /awareness/employees", payload: { email: "gina.mgr@corp.example", full_name: "Gina Guard", department: "ENGINEERING", role_code: "MANAGER", hire_date: "2011-11-11" }, as: ProgramAdmin, captures: { mgr: "$.data.id" } }
            - { call: "POST /awareness/employees", payload: { email: "gus.report@corp.example", full_name: "Gus Ledger", department: "ENGINEERING", role_code: "ENGINEER", hire_date: "2016-08-08", manager_id: "${mgr}" }, as: ProgramAdmin, captures: { e: "$.data.id", e_v: "$.data.version" } }
            - { call: "POST /awareness/training-modules", payload: { code: "ANNUAL-SEC-F", title: "Annual Security Awareness F", module_type: "ANNUAL" }, as: ProgramAdmin, captures: { m: "$.data.id" } }
            - { call: "POST /awareness/training-modules/${m}/publish", payload: {}, as: ProgramAdmin }
            - { call: "POST /awareness/curriculum-assignments", payload: { employee_id: "${e}", module_id: "${m}", assignment_reason: "ANNUAL", expected_employee_version: "${e_v}" }, as: ProgramAdmin, captures: { a: "$.data.id" } }
            - { call: "POST /awareness/_clock/set_current_utc", payload: { to_iso8601: "2026-09-14T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /awareness/compliance-sweeps", payload: {}, as: ProgramAdmin, captures: { cons_count: "$.data.consequences_applied_count" } }
            - { call: "GET /awareness/access-consequences", payload: { source_assignment_id: "${a}", state: "ACTIVE" }, as: ProgramAdmin, captures: { ac_first: "$.data[0].id" } }
            - { call: "GET /awareness/employees/${e}", payload: {}, as: ProgramAdmin, captures: { posture_before: "$.data.access_posture", susp_before: "$.data.active_suspension_count" } }
          trigger:
            - { call: "POST /awareness/curriculum-assignments/${a}/void", payload: { void_reason_code: "ASSIGNED_IN_ERROR" }, as: ProgramAdmin, captures: { a_state: "$.data.state" } }
            - { call: "GET /awareness/access-consequences", payload: { source_assignment_id: "${a}" }, as: ProgramAdmin }
            - { call: "GET /awareness/escalation-notices", payload: { assignment_id: "${a}" }, as: ProgramAdmin }
            - { call: "GET /awareness/employees/${e}", payload: {}, as: ProgramAdmin }
          assert:
            - "before the void: CurriculumAssignment.${a}.state == ESCALATED with days_overdue == 14 and escalation_level == 3"
            - "before the void: three EscalationNotice rows (levels 1, 2, 3) are SENT and two AccessConsequence rows are ACTIVE with severity_rank 2 and 3"
            - "before the void: Employee.${e}.access_posture == SUSPENDED and active_suspension_count == 1"
            - "after the void: CurriculumAssignment.${a}.state == VOIDED with void_reason_code ASSIGNED_IN_ERROR and next_reminder_due_at == null"
            - "after the void: every AccessConsequence for ${a} has state == VOIDED with lift_reason_code == ASSIGNMENT_VOIDED and lifted_at == 2026-09-14T00:00:00Z, and none remains ACTIVE"
            - "after the void: all three EscalationNotice rows have state == EXPIRED"
            - "after the void: Employee.${e}.active_suspension_count == 0 and access_posture == NONE, exactly the pre-escalation values"
            - "after the void: Employee.${e}.compliance_state == COMPLIANT and risk_score_provisional == 0.00 (VOIDED assignments contribute no OVERDUE_WEIGHT)"

      - name: reservation_ledger_restored_when_campaign_cancelled
        grounds:
          - endpoints[POST /awareness/campaigns/{id}/cancel]
          - state_machines.PhishingCampaign.SCHEDULED_to_CANCELLED
          - state_machines.SimulationDelivery.QUEUED_to_EXCLUDED
          - entities.Employee.fields.reserved_simulation_slots
          - entities.SimulationDelivery.fields.excluded_reason
          - calculations.cohort_resolution
        distinguishing_aspect: |
          A second, independent ledger with its own compensating action: scheduling reserves one simulation slot
          per cohort member and cancelling must release every one of them, so the invariant
          "sum(Employee.reserved_simulation_slots) == count(SimulationDelivery rows in state QUEUED)" holds both
          before (2 == 2) and after (0 == 0) the cancel, while the deliveries survive as EXCLUDED audit rows
          rather than disappearing.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Two ACTIVE employees in EXECUTIVE, neither with any prior delivery."
            - "A TIER_2_TARGETED campaign targeting EXECUTIVE, APPROVED and then SCHEDULED for 2026-08-20T09:00:00Z but never launched, so both members hold QUEUED deliveries and one reserved slot each."
          setup_api_calls:
            - { call: "POST /awareness/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /awareness/employees", payload: { email: "x1.exec@corp.example", full_name: "Xena One", department: "EXECUTIVE", role_code: "EXECUTIVE", hire_date: "2012-01-01" }, as: ProgramAdmin, captures: { e1: "$.data.id" } }
            - { call: "POST /awareness/employees", payload: { email: "x2.exec@corp.example", full_name: "Xander Two", department: "EXECUTIVE", role_code: "EXECUTIVE", hire_date: "2013-02-02" }, as: ProgramAdmin, captures: { e2: "$.data.id" } }
            - { call: "POST /awareness/phishing-templates", payload: { name: "Board Deck Review", pretext_category: "SHARED_DOCUMENT", difficulty_tier: "TIER_2_TARGETED", theme_tags: ["AUTHORITY"], credential_capture_enabled: false }, as: CampaignAuthor, as_user_id: "author-1", captures: { tpl: "$.data.id" } }
            - { call: "POST /awareness/phishing-templates/${tpl}/approve-for-use", payload: {}, as: CampaignApprover, as_user_id: "approver-1" }
            - { call: "POST /awareness/campaigns", payload: { name: "EXEC Board Wave", template_id: "${tpl}", difficulty_tier: "TIER_2_TARGETED", target_departments: ["EXECUTIVE"], communication_policy_ack: true }, as: CampaignAuthor, as_user_id: "author-1", captures: { c: "$.data.id" } }
            - { call: "POST /awareness/campaigns/${c}/submit-for-review", payload: {}, as: CampaignAuthor, as_user_id: "author-1" }
            - { call: "POST /awareness/campaigns/${c}/approve", payload: {}, as: CampaignApprover, as_user_id: "approver-1", captures: { c_v: "$.data.version" } }
            - { call: "POST /awareness/campaigns/${c}/schedule", payload: { scheduled_send_at: "2026-08-20T09:00:00Z", expected_campaign_version: "${c_v}" }, as: CampaignAuthor, as_user_id: "author-1", captures: { evaluable: "$.data.evaluable_count" } }
            - { call: "GET /awareness/simulation-deliveries", payload: { campaign_id: "${c}", state: "QUEUED" }, as: ProgramAdmin, captures: { d1: "$.data[0].id" } }
          trigger:
            - { call: "POST /awareness/campaigns/${c}/cancel", payload: {}, as: CampaignAuthor, as_user_id: "author-1", captures: { c_state: "$.data.state" } }
            - { call: "GET /awareness/simulation-deliveries", payload: { campaign_id: "${c}" }, as: ProgramAdmin }
            - { call: "GET /awareness/employees/${e1}", payload: {}, as: ProgramAdmin, captures: { slots1: "$.data.reserved_simulation_slots" } }
            - { call: "GET /awareness/employees/${e2}", payload: {}, as: ProgramAdmin, captures: { slots2: "$.data.reserved_simulation_slots" } }
          assert:
            - "before the cancel: PhishingCampaign.${c}.state == SCHEDULED with target_count == 2 and evaluable_count == 2"
            - "before the cancel: two SimulationDelivery rows are QUEUED and Employee.${e1}.reserved_simulation_slots == 1 and Employee.${e2}.reserved_simulation_slots == 1 (ledger balance 2 == 2)"
            - "after the cancel: PhishingCampaign.${c}.state == CANCELLED with cancelled_at == 2026-08-01T00:00:00Z"
            - "after the cancel: both SimulationDelivery rows still exist with state == EXCLUDED and excluded_reason == CAMPAIGN_CANCELLED (audit rows are not deleted)"
            - "after the cancel: Employee.${e1}.reserved_simulation_slots == 0 and Employee.${e2}.reserved_simulation_slots == 0 (ledger balance 0 == 0)"
            - "after the cancel: no SimulationDelivery for ${c} is in state QUEUED"
            - "after the cancel: both employees' risk_score_provisional == 0.00 and repeat_clicker_tier == 0 (a cancelled campaign leaves no risk footprint)"
