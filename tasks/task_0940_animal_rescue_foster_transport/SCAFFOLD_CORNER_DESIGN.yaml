  - section: validations
    instances:
      - name: legal_hold_blocks_transport_while_medical_hold_does_not
        claim_type: Cross-entity validation
        grounds:
          - write_gates[gate_order=3]
          - write_gates[gate_order=4]
          - validations[priority=14]
          - validations[priority=15]
          - errors[ERR_LEGAL_HOLD_ACTIVE]
        distinguishing_aspect: "The three hold axes are asymmetric: an ACTIVE LEGAL hold blocks manifesting the animal onto a leg with ERR_LEGAL_HOLD_ACTIVE, while an ACTIVE MEDICAL hold on an otherwise identical animal permits both the manifest and the owner reclaim."
        test_recipe:
          setup:
            - "Two STRAY animals intaken 2026-05-01T00:00:00Z with CALENDAR_DAY billing; animal L carries an ACTIVE LEGAL hold and animal M carries an ACTIVE MEDICAL hold."
            - "One PLANNED rescue-leg run with a 10-unit leg."
          setup_api_calls:
            - call: "POST /rescue/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /rescue/organizations"
              payload: { name: "Harbor Rescue", org_type: "SHELTER", state_code: "OR" }
              as: PlatformAdmin
              captures: { org_id: $.data.id }
            - call: "POST /rescue/persons"
              payload: { full_name: "Milo Frey", email: "milo@example.test", driver_license_number: "CDL-8891" }
              as: PlatformAdmin
              captures: { driver_id: $.data.id }
            - call: "POST /rescue/persons"
              payload: { full_name: "Owner M", email: "om@example.test" }
              as: PlatformAdmin
              captures: { owner_m: $.data.id }
            - call: "POST /rescue/animals"
              payload: { name: "Legal", species: "DOG", size_class: "SMALL", weight_lb: 20.0, date_of_birth: "2022-01-01T00:00:00Z", current_organization_id: "${org_id}" }
              as: IntakeOfficer
              captures: { animal_l: $.data.id }
            - call: "POST /rescue/animals"
              payload: { name: "Medical", species: "DOG", size_class: "SMALL", weight_lb: 20.0, date_of_birth: "2022-01-01T00:00:00Z", current_organization_id: "${org_id}" }
              as: IntakeOfficer
              captures: { animal_m: $.data.id }
            - call: "POST /rescue/animals/${animal_l}/intake-records"
              payload: { intake_type: "STRAY", intake_datetime: "2026-05-01T00:00:00Z", impound_billing_basis: "CALENDAR_DAY" }
              as: IntakeOfficer
              captures: { intake_l: $.data.id }
            - call: "POST /rescue/animals/${animal_m}/intake-records"
              payload: { intake_type: "STRAY", intake_datetime: "2026-05-01T00:00:00Z", source_person_id: "${owner_m}", impound_billing_basis: "CALENDAR_DAY" }
              as: IntakeOfficer
              captures: { intake_m: $.data.id }
            - call: "POST /rescue/animals/${animal_l}/holds"
              payload: { hold_type: "LEGAL", reason: "cruelty investigation" }
              as: IntakeOfficer
              captures: { hold_l: $.data.id }
            - call: "POST /rescue/animals/${animal_m}/holds"
              payload: { hold_type: "MEDICAL", reason: "upper respiratory infection" }
              as: Veterinarian
              captures: { hold_m: $.data.id }
            - call: "POST /rescue/transport-runs"
              payload: { origin_organization_id: "${org_id}", run_type: "RESCUE_LEG", origin_hub_code: "HUB-A", destination_hub_code: "HUB-B" }
              as: TransportDispatcher
              captures: { run_id: $.data.id }
            - call: "POST /rescue/transport-runs/${run_id}/transport-legs"
              payload: { driver_person_id: "${driver_id}", sequence_no: 1, origin_hub_code: "HUB-A", destination_hub_code: "HUB-B", scheduled_depart_at: "2026-05-05T08:00:00Z", scheduled_arrive_at: "2026-05-05T12:00:00Z", crate_capacity_units: 10, weight_capacity_lb: 400.0, species_policy: "DOGS_ONLY" }
              as: TransportDispatcher
              captures: { leg_id: $.data.id, leg_v1: $.data.version }
          trigger:
            - call: "POST /rescue/transport-legs/${leg_id}/manifest-entries"
              payload: { animal_id: "${animal_l}", expected_leg_version: "${leg_v1}" }
              as: TransportDispatcher
              captures: { legal_err: $.data.error_id }
            - call: "POST /rescue/transport-legs/${leg_id}/manifest-entries"
              payload: { animal_id: "${animal_m}", expected_leg_version: "${leg_v1}" }
              as: TransportDispatcher
              captures: { medical_entry: $.data.id, medical_entry_status: $.data.status }
            - call: "POST /rescue/intake-records/${intake_m}/reclaim"
              payload: { reclaiming_person_id: "${owner_m}" }
              as: IntakeOfficer
              captures: { reclaim_outcome: $.data.id, reclaim_type: $.data.outcome_type }
          assert:
            - "legal_err == ERR_LEGAL_HOLD_ACTIVE"
            - "the legal-hold manifest returns HTTP 409"
            - "medical_entry_status == ASSIGNED"
            - "reclaim_type == RETURN_TO_OWNER"
            - "IntakeRecord.${intake_m}.reclaim_total_cents == 4500"
            - "HoldRecord.${hold_l}.status == ACTIVE"
            - "HoldRecord.${hold_m}.status == ACTIVE"

      - name: behavioral_hold_blocks_adoption_only
        claim_type: Conditional validation
        grounds:
          - write_gates[gate_order=5]
          - validations[priority=16]
          - errors[ERR_BEHAVIORAL_HOLD_ACTIVE]
        distinguishing_aspect: "An ACTIVE BEHAVIORAL hold leaves the animal manifestable onto a transport leg but refuses adoption finalization with ERR_BEHAVIORAL_HOLD_ACTIVE at HTTP 409."
        test_recipe:
