            - call: "POST /jbp/plans/${plan_id}/negotiate"
              payload: { growth_target_pct: 10 }
              as: ManufacturerPlanner
              captures: { err: "$.data.error_id" }
            - call: "GET /jbp/plans/${plan_id}"
              as: ManufacturerPlanner
          assert:
            - "after 5 successful negotiates negotiation_round == 6 and status == COUNTERED (round 6 is the last legal state)"
            - "6th negotiate fails with ERR_NEGOTIATION_ROUNDS_EXHAUSTED (round == MAX_NEGOTIATION_ROUNDS)"
            - "after the failed negotiate, JointBusinessPlan.${plan_id}.status == EXPIRED (error and auto-transition share one request)"
            - "negotiation_round remains 6 (the rejected negotiate does not increment)"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: shelf_rec_requires_accepted_analysis
        grounds:
          - validations[priority=13]
          - state_machines.CategoryAnalysis.SUBMITTED_to_ACCEPTED
        distinguishing_aspect: |
          Pair ShelfRecommendation -> CategoryAnalysis: creating the shelf
          recommendation is gated on a DIFFERENT entity (the plan's analysis)
          being in ACCEPTED; while the analysis is SUBMITTED the create fails
          ERR_ANALYSIS_NOT_ACCEPTED, and flipping the analysis unlocks the very
          same request (same OCC version, since analysis acceptance does not
          bump the plan version).
        test_recipe:
          setup:
            - "ACTIVATED plan at version 3; one CategoryAnalysis in SUBMITTED"
          setup_api_calls:
            - call: "POST /jbp/retailers"
              payload: { name: "Retailer Alpha", country_code: "US", channels: ["MASS", "GROCERY"] }
              as: PlatformAdmin
              captures: { ret_id: "$.data.id" }
            - call: "POST /jbp/categories"
              payload: { name: "Laundry Care", advisory_scope: "FULL_CATEGORY" }
              as: PlatformAdmin
              captures: { cat_id: "$.data.id" }
            - call: "POST /jbp/plans"
              payload: { retailer_id: "${ret_id}", category_id: "${cat_id}", fiscal_year: 2027, growth_target_pct: 8, weekly_baseline_cases: 100, avg_unit_net_price_cents: 450 }
              as: ManufacturerPlanner
              captures: { plan_id: "$.data.id" }
            - call: "POST /jbp/plans/${plan_id}/decide"
              payload: { decision: "ACCEPT" }
              as: RetailerBuyer
              as_user_id: "${ret_id}"
            - call: "POST /jbp/plans/${plan_id}/activate"
              payload: { accrual_rate_pct: 4, edlp_split_pct: 60 }
              as: ManufacturerPlanner
              captures: { plan_v3: "$.data.version" }
            - call: "POST /jbp/plans/${plan_id}/category-analyses"
              payload: { title: "Category Review 2027H1", period_label: "2027-H1", total_category_growth_pct: 6, manufacturer_share_pct: 55, includes_competitor_data: true }
              as: CategoryAdvisor
              captures: { ana_id: "$.data.id" }
          trigger:
            - call: "POST /jbp/plans/${plan_id}/shelf-recommendations"
              payload: { expected_plan_version: "${plan_v3}", title: "Reset A", space_change_pct: 5, target_store_count: 100 }
              as: CategoryAdvisor
              captures: { err: "$.data.error_id" }
            - call: "POST /jbp/category-analyses/${ana_id}/decide"
              payload: { decision: "ACCEPT" }
              as: RetailerBuyer
              as_user_id: "${ret_id}"
            - call: "POST /jbp/plans/${plan_id}/shelf-recommendations"
              payload: { expected_plan_version: "${plan_v3}", title: "Reset A", space_change_pct: 5, target_store_count: 100 }
              as: CategoryAdvisor
              captures: { shelf_id: "$.data.id" }
          assert:
            - "first create fails with ERR_ANALYSIS_NOT_ACCEPTED (analysis SUBMITTED, not ACCEPTED)"
            - "after analysis ACCEPT, the identical create (same expected_plan_version ${plan_v3}) succeeds with 201"
            - "ShelfRecommendation.${shelf_id}.status == PROPOSED"
            - "CategoryAnalysis.${ana_id}.competitor_share_pct == 45 (100 - 55)"

      - name: forecast_create_requires_activated_plan
        grounds:
          - validations[priority=12]
          - state_machines.JointBusinessPlan.ACCEPTED_to_ACTIVATED
        distinguishing_aspect: |
          Pair Forecast -> JointBusinessPlan (different pair than
          ShelfRecommendation -> CategoryAnalysis): forecast publication is
          gated on the PLAN's lifecycle state, failing on PROPOSED and
          succeeding after the ACTIVATED transition.
        test_recipe:
          setup:
            - "plan still PROPOSED (never accepted/activated)"
          setup_api_calls:
            - call: "POST /jbp/retailers"
              payload: { name: "Retailer Alpha", country_code: "US", channels: ["MASS", "GROCERY"] }
              as: PlatformAdmin
              captures: { ret_id: "$.data.id" }
            - call: "POST /jbp/categories"
              payload: { name: "Laundry Care", advisory_scope: "FULL_CATEGORY" }
              as: PlatformAdmin
              captures: { cat_id: "$.data.id" }
            - call: "POST /jbp/plans"
              payload: { retailer_id: "${ret_id}", category_id: "${cat_id}", fiscal_year: 2027, growth_target_pct: 8, weekly_baseline_cases: 100, avg_unit_net_price_cents: 450 }
              as: ManufacturerPlanner
              captures: { plan_id: "$.data.id" }
          trigger:
            - call: "POST /jbp/plans/${plan_id}/forecasts"
              payload: { week_start: "2027-03-01T00:00:00Z", baseline_cases: 1000 }
              as: SupplyChainPlanner
              captures: { err: "$.data.error_id" }
          assert:
            - "error_id == ERR_PLAN_NOT_ACTIVATED"
            - "GET /jbp/plans/${plan_id}/forecasts returns an empty list (no forecast persisted)"

  - rule_id: resource_temporal_overlap
    instances:
      - name: promo_overlap_half_open_adjacency
        grounds:
          - validations[priority=27]
        distinguishing_aspect: |
          Interval semantics A (half-open [start,end) pure overlap) on the
          PromotionalEvent resource: same-plan same-type events may touch
          (end == start passes) but any positive intersection is rejected;
          different event_types may freely overlap the same dates.
        test_recipe:
          setup:
            - "ACTIVATED plan; event A FEATURE [2027-03-01, 2027-03-10) already created"
          setup_api_calls:
            - call: "POST /jbp/retailers"
              payload: { name: "Retailer Alpha", country_code: "US", channels: ["MASS", "GROCERY"] }
              as: PlatformAdmin
              captures: { ret_id: "$.data.id" }
            - call: "POST /jbp/categories"
              payload: { name: "Laundry Care", advisory_scope: "FULL_CATEGORY" }
              as: PlatformAdmin
              captures: { cat_id: "$.data.id" }
            - call: "POST /jbp/plans"
              payload: { retailer_id: "${ret_id}", category_id: "${cat_id}", fiscal_year: 2027, growth_target_pct: 8, weekly_baseline_cases: 100, avg_unit_net_price_cents: 450 }
              as: ManufacturerPlanner
              captures: { plan_id: "$.data.id" }
            - call: "POST /jbp/plans/${plan_id}/decide"
              payload: { decision: "ACCEPT" }
              as: RetailerBuyer
              as_user_id: "${ret_id}"
            - call: "POST /jbp/plans/${plan_id}/activate"
              payload: { accrual_rate_pct: 4, edlp_split_pct: 60 }
              as: ManufacturerPlanner
            - call: "POST /jbp/plans/${plan_id}/events"
              payload: { name: "Feature A", event_type: "FEATURE", start_date: "2027-03-01T00:00:00Z", end_date: "2027-03-10T00:00:00Z", discount_depth_pct: 20 }
              as: ManufacturerPlanner
              captures: { ev_a: "$.data.id" }
          trigger:
            - call: "POST /jbp/plans/${plan_id}/events"
              payload: { name: "Feature B", event_type: "FEATURE", start_date: "2027-03-10T00:00:00Z", end_date: "2027-03-20T00:00:00Z", discount_depth_pct: 20 }
              as: ManufacturerPlanner
              captures: { ev_b: "$.data.id" }
            - call: "POST /jbp/plans/${plan_id}/events"
              payload: { name: "Feature C", event_type: "FEATURE", start_date: "2027-03-09T00:00:00Z", end_date: "2027-03-12T00:00:00Z", discount_depth_pct: 20 }
              as: ManufacturerPlanner
              captures: { err: "$.data.error_id" }
            - call: "POST /jbp/plans/${plan_id}/events"
              payload: { name: "Display D", event_type: "DISPLAY", start_date: "2027-03-05T00:00:00Z", end_date: "2027-03-08T00:00:00Z", discount_depth_pct: 15 }
              as: ManufacturerPlanner
              captures: { ev_d: "$.data.id" }
          assert:
            - "Feature B created (201): adjacency end==start is allowed under half-open semantics"
            - "Feature C rejected with ERR_PROMO_OVERLAP: [03-09, 03-12) intersects A and B"
            - "Display D created (201): the overlap rule is per (plan, event_type) — different type may overlap the same dates"

      - name: launch_min_gap_buffer_semantics
        grounds:
          - validations[priority=30]
        distinguishing_aspect: |
          Interval semantics B (minimum-separation buffer around a point date)
          on the InnovationLaunch resource — different entity and different
          geometry than the promo half-open overlap: two launches exactly
          LAUNCH_MIN_GAP_DAYS apart PASS (>= semantics), one day closer fails.
        test_recipe:
          setup:
            - "ACTIVATED plan; launch 1 dated 2027-03-01 created (PLANNING)"
          setup_api_calls:
            - call: "POST /jbp/retailers"
              payload: { name: "Retailer Alpha", country_code: "US", channels: ["MASS", "GROCERY"] }
              as: PlatformAdmin
              captures: { ret_id: "$.data.id" }
            - call: "POST /jbp/categories"
              payload: { name: "Laundry Care", advisory_scope: "FULL_CATEGORY" }
              as: PlatformAdmin
              captures: { cat_id: "$.data.id" }
            - call: "POST /jbp/plans"
              payload: { retailer_id: "${ret_id}", category_id: "${cat_id}", fiscal_year: 2027, growth_target_pct: 8, weekly_baseline_cases: 100, avg_unit_net_price_cents: 450 }
              as: ManufacturerPlanner
              captures: { plan_id: "$.data.id" }
            - call: "POST /jbp/plans/${plan_id}/decide"
              payload: { decision: "ACCEPT" }
              as: RetailerBuyer
              as_user_id: "${ret_id}"
            - call: "POST /jbp/plans/${plan_id}/activate"
              payload: { accrual_rate_pct: 4, edlp_split_pct: 60 }
              as: ManufacturerPlanner
            - call: "POST /jbp/plans/${plan_id}/launches"
              payload: { product_name: "UltraTabs", pack_family: "tabs", launch_date: "2027-03-01T00:00:00Z", total_trade_budget_cents: 500000 }
              as: ManufacturerPlanner
              captures: { lau1: "$.data.id" }
          trigger:
            - call: "POST /jbp/plans/${plan_id}/launches"
              payload: { product_name: "MegaPods", pack_family: "pods", launch_date: "2027-05-20T00:00:00Z", total_trade_budget_cents: 300000 }
              as: ManufacturerPlanner
              captures: { err: "$.data.error_id" }
            - call: "POST /jbp/plans/${plan_id}/launches"
              payload: { product_name: "MegaPods", pack_family: "pods", launch_date: "2027-05-24T00:00:00Z", total_trade_budget_cents: 300000 }
              as: ManufacturerPlanner
              captures: { lau2: "$.data.id" }
          assert:
            - "launch at 2027-05-20 rejected with ERR_LAUNCH_TOO_CLOSE (80 days < LAUNCH_MIN_GAP_DAYS 84)"
            - "launch at 2027-05-24 created (201): exactly 84 days of separation passes (>= boundary)"
            - "InnovationLaunch.${lau2}.status == PLANNING"

  - rule_id: compensating_invariant
    instances:
      - name: event_lock_cancel_conserves_event_funding
        grounds:
          - state_machines.PromotionalEvent.PENCILED_to_LOCKED
          - state_machines.PromotionalEvent.LOCKED_to_CANCELLED
          - entities.TradeFund.fields.event_available_cents
        distinguishing_aspect: |
          Conserved quantity: EVENT bucket funding. The forward action (lock,
          reserving estimated_cost_cents) paired with its compensation (cancel,
          releasing it) leaves event_available_cents byte-identical, and the
          invariant event_accrued == available + reserved + settled holds at
          every intermediate step.
        test_recipe:
          setup:
            - "ACTIVATED plan (baseline 100 cases, unit price 450 cents); fund accrued one period of 1000000 cents (event bucket 16000); one PENCILED FEATURE event (discount 25 -> estimate 11250)"
          setup_api_calls:
            - call: "POST /jbp/retailers"
              payload: { name: "Retailer Alpha", country_code: "US", channels: ["MASS", "GROCERY"] }
              as: PlatformAdmin
              captures: { ret_id: "$.data.id" }
            - call: "POST /jbp/categories"
              payload: { name: "Laundry Care", advisory_scope: "FULL_CATEGORY" }
              as: PlatformAdmin
              captures: { cat_id: "$.data.id" }
            - call: "POST /jbp/plans"
              payload: { retailer_id: "${ret_id}", category_id: "${cat_id}", fiscal_year: 2027, growth_target_pct: 8, weekly_baseline_cases: 100, avg_unit_net_price_cents: 450 }
              as: ManufacturerPlanner
              captures: { plan_id: "$.data.id" }
            - call: "POST /jbp/plans/${plan_id}/decide"
              payload: { decision: "ACCEPT" }
              as: RetailerBuyer
              as_user_id: "${ret_id}"
            - call: "POST /jbp/plans/${plan_id}/activate"
              payload: { accrual_rate_pct: 4, edlp_split_pct: 60 }
              as: ManufacturerPlanner
            - call: "GET /jbp/funds?plan_id=${plan_id}"
              as: ManufacturerPlanner
              captures: { fund_id: "$.data[0].id" }
            - call: "POST /jbp/funds/${fund_id}/accruals"
              payload: { period: "2027-01", invoiced_sales_cents: 1000000 }
              as: FinanceAnalyst
            - call: "POST /jbp/plans/${plan_id}/events"
              payload: { name: "Feature A", event_type: "FEATURE", start_date: "2027-03-01T00:00:00Z", end_date: "2027-03-10T00:00:00Z", discount_depth_pct: 25 }
              as: ManufacturerPlanner
              captures: { ev_id: "$.data.id" }
            - call: "GET /jbp/funds/${fund_id}"
              as: FinanceAnalyst
              captures: { avail_pre: "$.data.event_available_cents" }
          trigger:
            - call: "POST /jbp/events/${ev_id}/lock"
              as: ManufacturerPlanner
            - call: "GET /jbp/funds/${fund_id}"
              as: FinanceAnalyst
            - call: "POST /jbp/events/${ev_id}/cancel"
              as: ManufacturerPlanner
            - call: "GET /jbp/funds/${fund_id}"
              as: FinanceAnalyst
          assert:
            - "before lock: event_available_cents == 16000"
            - "PromotionalEvent.${ev_id}.estimated_cost_cents == 11250 (round_half_up(100*450*0.25)) — plan baseline fallback, no forecast exists"
            - "after lock: event_reserved_cents == 11250, event_available_cents == 4750, event_accrued_cents == 16000 (16000 == 4750 + 11250 + 0)"
            - "after cancel: event_reserved_cents == 0, event_available_cents == 16000 == value before the lock (compensating pair conserves the bucket)"
            - "event_accrued_cents == 16000 at every step (accrual untouched by reserve/release)"

      - name: phase_budget_patch_conserves_total
        grounds:
          - entities.InnovationLaunch.fields.budget_remaining_cents
          - state_machines.LaunchPhase.GATE_FAILED_to_PENDING
        distinguishing_aspect: |
          Conserved quantity: launch trade budget (a different conserved
          quantity than the fund's event bucket). Raising one phase's
          trade_spend_cents and later re-lowering it keeps
          total_trade_budget_cents == budget_remaining_cents + SUM(phases.
          trade_spend_cents) true after every write.
        test_recipe:
          setup:
            - "ACTIVATED plan; launch with total_trade_budget_cents 1000000 and four zeroed PENDING phases"
          setup_api_calls:
            - call: "POST /jbp/retailers"
              payload: { name: "Retailer Alpha", country_code: "US", channels: ["MASS", "GROCERY"] }
              as: PlatformAdmin
              captures: { ret_id: "$.data.id" }
            - call: "POST /jbp/categories"
              payload: { name: "Laundry Care", advisory_scope: "FULL_CATEGORY" }
              as: PlatformAdmin
              captures: { cat_id: "$.data.id" }
            - call: "POST /jbp/plans"
              payload: { retailer_id: "${ret_id}", category_id: "${cat_id}", fiscal_year: 2027, growth_target_pct: 8, weekly_baseline_cases: 100, avg_unit_net_price_cents: 450 }
              as: ManufacturerPlanner
              captures: { plan_id: "$.data.id" }
            - call: "POST /jbp/plans/${plan_id}/decide"
              payload: { decision: "ACCEPT" }
              as: RetailerBuyer
              as_user_id: "${ret_id}"
            - call: "POST /jbp/plans/${plan_id}/activate"
              payload: { accrual_rate_pct: 4, edlp_split_pct: 60 }
              as: ManufacturerPlanner
            - call: "POST /jbp/plans/${plan_id}/launches"
              payload: { product_name: "UltraTabs", pack_family: "tabs", launch_date: "2027-03-01T00:00:00Z", total_trade_budget_cents: 1000000 }
              as: ManufacturerPlanner
              captures: { lau_id: "$.data.id" }
            - call: "GET /jbp/launches/${lau_id}/phases"
              as: ManufacturerPlanner
              captures: { ph1: "$.data[0].id" }
          trigger:
            - call: "PATCH /jbp/launches/${lau_id}/phases/${ph1}"
              payload: { trade_spend_cents: 100000 }
              as: ManufacturerPlanner
            - call: "GET /jbp/launches/${lau_id}"
              as: ManufacturerPlanner
            - call: "PATCH /jbp/launches/${lau_id}/phases/${ph1}"
              payload: { trade_spend_cents: 400000 }
              as: ManufacturerPlanner
            - call: "GET /jbp/launches/${lau_id}"
              as: ManufacturerPlanner
          assert:
            - "after first patch: budget_remaining_cents == 900000 (1000000 - 100000)"
            - "after second patch: budget_remaining_cents == 600000 (1000000 - 400000)"
            - "invariant holds at each step: total_trade_budget_cents == budget_remaining_cents + SUM(phases.trade_spend_cents) == 1000000"
