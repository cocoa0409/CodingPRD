scaffold_corner_design:
  # ===========================================================================
  # Section: entities
  # ===========================================================================
  - section: entities
    instances:
      - name: create_target_applies_defaults_and_autocreates_transition_items
        claim_type: creation_defaults
        grounds: [entities.AcquisitionTarget, entities.TransitionItem]
        distinguishing_aspect: "POST /acquisitions/targets creates the target in SCREENING with council_approved=false, and exactly four PENDING TransitionItems in fixed order BILLING_RECORDS, DEPOSITS, SERVICE_AGREEMENTS, METER_READS."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - call: "POST /acquisitions/targets"
              payload: { system_name: "T", municipality_name: "M", state_code: "PA", system_type: "COMBINED", customer_count: 42, permitted_valuation_methods: ["FMV_INDEPENDENT", "REPLACEMENT_COST"] }
              as: AcquisitionAnalyst
              captures: { t_id: $.data.id, t_status: $.data.status, t_ca: $.data.council_approved }
          trigger:
            - call: "GET /acquisitions/targets/${t_id}/transition-items"
              payload: {}
              as: AcquisitionAnalyst
          assert:
            - "AcquisitionTarget.${t_id}.status == SCREENING"
            - "AcquisitionTarget.${t_id}.council_approved == false"
            - "GET transition-items returns 4 items, in order BILLING_RECORDS, DEPOSITS, SERVICE_AGREEMENTS, METER_READS, all status == PENDING"

      - name: create_target_rejects_nonpositive_customer_count
        claim_type: type_constraints
        grounds: [entities.AcquisitionTarget.fields.customer_count]
        distinguishing_aspect: "customer_count must be > 0; zero is rejected with ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /acquisitions/targets"
              payload: { system_name: "T", municipality_name: "M", state_code: "PA", system_type: "WATER", customer_count: 0, permitted_valuation_methods: ["FMV_INDEPENDENT"] }
              as: AcquisitionAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST"

      - name: create_target_rejects_empty_permitted_methods
        claim_type: type_constraints
        grounds: [entities.AcquisitionTarget.fields.permitted_valuation_methods]
        distinguishing_aspect: "permitted_valuation_methods must be a non-empty subset of the three statutory methods; an empty list is rejected with ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /acquisitions/targets"
              payload: { system_name: "T", municipality_name: "M", state_code: "PA", system_type: "WATER", customer_count: 5, permitted_valuation_methods: [] }
              as: AcquisitionAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST"

      - name: create_target_rejects_invalid_system_type_enum
        claim_type: type_constraints
        grounds: [entities.AcquisitionTarget.fields.system_type]
        distinguishing_aspect: "system_type outside {WATER, WASTEWATER, COMBINED} is rejected with ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /acquisitions/targets"
              payload: { system_name: "T", municipality_name: "M", state_code: "PA", system_type: "GAS", customer_count: 5, permitted_valuation_methods: ["FMV_INDEPENDENT"] }
              as: AcquisitionAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST"

      - name: get_target_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "GET /acquisitions/targets/{id} with a non-existent id returns ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /acquisitions/targets/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              payload: {}
              as: AcquisitionAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND"

      - name: list_targets_paginates_with_envelope_fields
        claim_type: listing
        grounds: [response_envelope]
        distinguishing_aspect: "GET /acquisitions/targets returns the array envelope with total_count and has_more; creating 2 targets and requesting limit=1 yields has_more=true and total_count=2."
        test_recipe:
          setup: ["two targets exist"]
          setup_api_calls:
            - call: "POST /acquisitions/targets"
              payload: { system_name: "T1", municipality_name: "M1", state_code: "PA", system_type: "WATER", customer_count: 5, permitted_valuation_methods: ["FMV_INDEPENDENT"] }
              as: AcquisitionAnalyst
            - call: "POST /acquisitions/targets"
              payload: { system_name: "T2", municipality_name: "M2", state_code: "OH", system_type: "WASTEWATER", customer_count: 6, permitted_valuation_methods: ["FMV_INDEPENDENT"] }
              as: AcquisitionAnalyst
          trigger:
            - call: "GET /acquisitions/targets"
              payload: { limit: 1, offset: 0 }
              as: AcquisitionAnalyst
          assert:
            - "response data array has length 1"
            - "envelope reports total_count == 2 and has_more == true"

      - name: capital_item_midpoint_is_computed_input_ignored
        claim_type: computed_fields
        grounds: [entities.CapitalNeedItem.fields.midpoint_estimate_cents]
        distinguishing_aspect: "midpoint_estimate_cents is computed by the server as round_half_up((low+high)/2); for low=101, high=200 it is 151 (150.5 rounds half-up)."
        test_recipe:
          setup: ["target T with DRAFT assessment A"]
          setup_api_calls:
            - call: "POST /acquisitions/targets"
              payload: { system_name: "T", municipality_name: "M", state_code: "OH", system_type: "WATER", customer_count: 5, permitted_valuation_methods: ["FMV_INDEPENDENT"] }
              as: AcquisitionAnalyst
              captures: { t_id: $.data.id }
            - call: "POST /acquisitions/targets/${t_id}/assessments"
              payload: { notes: "s" }
              as: AcquisitionAnalyst
              as_user_id: analyst-1
              captures: { a_id: $.data.id }
          trigger:
            - call: "POST /acquisitions/assessments/${a_id}/capital-items"
              payload: { category: "GENERAL", horizon: "IMMEDIATE", description: "d", cost_low_cents: 101, cost_high_cents: 200, crews_required: 1 }
              as: AcquisitionAnalyst
              captures: { i_id: $.data.id }
          assert:
            - "CapitalNeedItem.${i_id}.midpoint_estimate_cents == 151"

      - name: capital_item_rejects_inverted_cost_bounds
        claim_type: type_constraints
        grounds: [entities.CapitalNeedItem.fields.cost_high_cents, "validations[priority=13]"]
        distinguishing_aspect: "cost_high_cents < cost_low_cents is rejected with ERR_INVALID_REQUEST (422)."
        test_recipe:
          setup: ["target T with DRAFT assessment A"]
          setup_api_calls:
            - call: "POST /acquisitions/targets"
              payload: { system_name: "T", municipality_name: "M", state_code: "OH", system_type: "WATER", customer_count: 5, permitted_valuation_methods: ["FMV_INDEPENDENT"] }
              as: AcquisitionAnalyst
              captures: { t_id: $.data.id }
            - call: "POST /acquisitions/targets/${t_id}/assessments"
              payload: { notes: "s" }
              as: AcquisitionAnalyst
              as_user_id: analyst-1
              captures: { a_id: $.data.id }
          trigger:
            - call: "POST /acquisitions/assessments/${a_id}/capital-items"
              payload: { category: "GENERAL", horizon: "IMMEDIATE", description: "d", cost_low_cents: 500, cost_high_cents: 100, crews_required: 1 }
              as: AcquisitionAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST"

      - name: customer_account_ref_unique_within_target
        claim_type: violation_to_error
        grounds: ["validations[priority=16]", "errors[ERR_DUPLICATE]"]
        distinguishing_aspect: "Two accounts with the same account_ref under one target are rejected with ERR_DUPLICATE; the same ref under a different target is allowed."
        test_recipe:
          setup: ["targets T1 and T2 exist"]
          setup_api_calls:
            - call: "POST /acquisitions/targets"
              payload: { system_name: "T1", municipality_name: "M1", state_code: "PA", system_type: "WATER", customer_count: 5, permitted_valuation_methods: ["FMV_INDEPENDENT"] }
              as: AcquisitionAnalyst
              captures: { t1: $.data.id }
            - call: "POST /acquisitions/targets"
              payload: { system_name: "T2", municipality_name: "M2", state_code: "OH", system_type: "WATER", customer_count: 5, permitted_valuation_methods: ["FMV_INDEPENDENT"] }
              as: AcquisitionAnalyst
              captures: { t2: $.data.id }
            - call: "POST /acquisitions/targets/${t1}/customer-accounts"
              payload: { account_ref: "A-1", deposit_cents: 100, ar_balance_cents: 0 }
              as: TransitionManager
          trigger:
            - call: "POST /acquisitions/targets/${t1}/customer-accounts"
              payload: { account_ref: "A-1", deposit_cents: 200, ar_balance_cents: 0 }
              as: TransitionManager
              captures: { err: $.data.error_id }
            - call: "POST /acquisitions/targets/${t2}/customer-accounts"
              payload: { account_ref: "A-1", deposit_cents: 300, ar_balance_cents: 0 }
              as: TransitionManager
              captures: { ok_id: $.data.id }
          assert:
            - "First trigger call returns error_id == ERR_DUPLICATE"
            - "Second trigger call succeeds (account_ref uniqueness is target-scoped)"

  # ===========================================================================
  # Section: state_machines
  # ===========================================================================
  - section: state_machines
    instances:
      - name: submit_assessment_without_items_rejected
        claim_type: precondition_enforcement
        grounds: [state_machines.ConditionAssessment.DRAFT_to_SUBMITTED, "errors[ERR_ASSESSMENT_EMPTY]"]
        distinguishing_aspect: "Submitting a DRAFT assessment with zero capital items fails with ERR_ASSESSMENT_EMPTY."
        test_recipe:
          setup: ["target T with empty DRAFT assessment A"]
          setup_api_calls:
            - call: "POST /acquisitions/targets"
              payload: { system_name: "T", municipality_name: "M", state_code: "OH", system_type: "WATER", customer_count: 5, permitted_valuation_methods: ["FMV_INDEPENDENT"] }
              as: AcquisitionAnalyst
              captures: { t_id: $.data.id }
            - call: "POST /acquisitions/targets/${t_id}/assessments"
              payload: { notes: "s" }
              as: AcquisitionAnalyst
              as_user_id: analyst-1
              captures: { a_id: $.data.id }
          trigger:
            - call: "POST /acquisitions/assessments/${a_id}/submit"
              payload: {}
              as: AcquisitionAnalyst
              as_user_id: analyst-1
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_ASSESSMENT_EMPTY"
            - "ConditionAssessment.${a_id}.status == DRAFT"

      - name: terminal_target_rejects_further_transitions
        claim_type: invalid_transition
        grounds: [state_machines.AcquisitionTarget]
        distinguishing_aspect: "Once REJECTED (terminal), a close attempt returns ERR_INVALID_STATE and nothing changes."
        test_recipe:
          setup: ["target T in MUNICIPAL_REVIEW with HELD hearing, SCHEDULED vote; vote hard-fails (1 yes / 5 no = 16.67 < 50)"]
          setup_api_calls:
            - call: "POST /acquisitions/targets"
              payload: { system_name: "T", municipality_name: "M", state_code: "PA", system_type: "WATER", customer_count: 5, permitted_valuation_methods: ["FMV_INDEPENDENT"] }
              as: AcquisitionAnalyst
              captures: { t_id: $.data.id }
            - call: "POST /acquisitions/targets/${t_id}/assessments"
              payload: { notes: "s" }
              as: AcquisitionAnalyst
              as_user_id: analyst-1
              captures: { a_id: $.data.id }
            - call: "POST /acquisitions/assessments/${a_id}/capital-items"
              payload: { category: "GENERAL", horizon: "IMMEDIATE", description: "d", cost_low_cents: 1000, cost_high_cents: 1000, crews_required: 1 }
              as: AcquisitionAnalyst
            - call: "POST /acquisitions/assessments/${a_id}/submit"
              payload: {}
              as: AcquisitionAnalyst
              as_user_id: analyst-1
            - call: "POST /acquisitions/assessments/${a_id}/accept"
              payload: {}
              as: EngineeringReviewer
              as_user_id: reviewer-1
            - call: "GET /acquisitions/targets/${t_id}"
              payload: {}
              as: AcquisitionAnalyst
              captures: { t_v: $.data.version }
            - call: "POST /acquisitions/targets/${t_id}/valuation-cases"
              payload: { expected_target_version: "${t_v}" }
              as: AcquisitionAnalyst
              captures: { c_id: $.data.id }
            - call: "POST /acquisitions/valuation-cases/${c_id}/entries"
              payload: { method: "FMV_INDEPENDENT", value_cents: 5000000, law_citation: "c" }
              as: Appraiser
              as_user_id: appraiser-1
              captures: { e_id: $.data.id }
            - call: "POST /acquisitions/valuation-cases/${c_id}/finalize"
              payload: { select_entry_id: "${e_id}" }
              as: AcquisitionAnalyst
              as_user_id: analyst-1
            - call: "POST /acquisitions/targets/${t_id}/council-events"
              payload: { kind: "PUBLIC_HEARING", scheduled_start: "2026-09-02T00:00:00Z", scheduled_end: "2026-09-02T02:00:00Z" }
              as: MunicipalClerk
              captures: { h_id: $.data.id }
            - call: "POST /acquisitions/council-events/${h_id}/record-outcome"
              payload: {}
              as: MunicipalClerk
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /acquisitions/targets/${t_id}/council-events"
              payload: { kind: "COUNCIL_VOTE", scheduled_start: "2026-09-10T03:00:00Z", scheduled_end: "2026-09-10T04:00:00Z" }
              as: MunicipalClerk
              captures: { v_id: $.data.id }
            - call: "POST /acquisitions/council-events/${v_id}/record-outcome"
              payload: { yes_votes: 1, no_votes: 5 }
              as: MunicipalClerk
          trigger:
            - call: "POST /acquisitions/targets/${t_id}/close"
              payload: {}
              as: TransitionManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE"
            - "AcquisitionTarget.${t_id}.status == REJECTED"

      - name: record_outcome_twice_is_idempotent_rejected
        claim_type: idempotency
        grounds: [state_machines.CouncilEvent.SCHEDULED_to_HELD]
        distinguishing_aspect: "Recording the outcome of an already-HELD hearing again returns ERR_INVALID_STATE; terminal states accept no triggers."
        test_recipe:
          setup: ["target T with a PUBLIC_HEARING already recorded HELD"]
          setup_api_calls:
            - call: "POST /acquisitions/targets"
              payload: { system_name: "T", municipality_name: "M", state_code: "OH", system_type: "WATER", customer_count: 5, permitted_valuation_methods: ["FMV_INDEPENDENT"] }
              as: AcquisitionAnalyst
              captures: { t_id: $.data.id }
            - call: "POST /acquisitions/targets/${t_id}/council-events"
              payload: { kind: "PUBLIC_HEARING", scheduled_start: "2026-09-02T00:00:00Z", scheduled_end: "2026-09-02T02:00:00Z" }
              as: MunicipalClerk
              captures: { h_id: $.data.id }
            - call: "POST /acquisitions/council-events/${h_id}/record-outcome"
              payload: {}
              as: MunicipalClerk
          trigger:
            - call: "POST /acquisitions/council-events/${h_id}/record-outcome"
              payload: {}
              as: MunicipalClerk
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE"
            - "CouncilEvent.${h_id}.status == HELD"

      - name: hearing_votes_ignored_vote_requires_votes
        claim_type: precondition_enforcement
        grounds: [state_machines.CouncilEvent.SCHEDULED_to_PASSED, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "Recording a COUNCIL_VOTE outcome without yes_votes/no_votes returns ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["target T with a SCHEDULED COUNCIL_VOTE"]
          setup_api_calls:
            - call: "POST /acquisitions/targets"
              payload: { system_name: "T", municipality_name: "M", state_code: "OH", system_type: "WATER", customer_count: 5, permitted_valuation_methods: ["FMV_INDEPENDENT"] }
              as: AcquisitionAnalyst
              captures: { t_id: $.data.id }
            - call: "POST /acquisitions/targets/${t_id}/council-events"
              payload: { kind: "COUNCIL_VOTE", scheduled_start: "2026-09-12T00:00:00Z", scheduled_end: "2026-09-12T02:00:00Z" }
              as: MunicipalClerk
              captures: { v_id: $.data.id }
          trigger:
            - call: "POST /acquisitions/council-events/${v_id}/record-outcome"
              payload: {}
              as: MunicipalClerk
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST"
            - "CouncilEvent.${v_id}.status == SCHEDULED"

      - name: valuation_entry_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: [state_machines.ValuationEntry]
        distinguishing_aspect: "A NOT_SELECTED entry cannot be re-selected: finalizing a second case referencing it fails with ERR_INVALID_STATE."
        test_recipe:
          setup: ["target T in VALUATION: case C1 FINALIZED with entry E1 NOT_SELECTED (another entry selected); a second OPEN case C2 exists after superseding"]
          setup_api_calls:
            - call: "POST /acquisitions/targets"
              payload: { system_name: "T", municipality_name: "M", state_code: "OH", system_type: "WATER", customer_count: 5, permitted_valuation_methods: ["FMV_INDEPENDENT"] }
              as: AcquisitionAnalyst
              captures: { t_id: $.data.id }
            - call: "POST /acquisitions/targets/${t_id}/assessments"
              payload: { notes: "s" }
              as: AcquisitionAnalyst
              as_user_id: analyst-1
              captures: { a_id: $.data.id }
            - call: "POST /acquisitions/assessments/${a_id}/capital-items"
              payload: { category: "GENERAL", horizon: "IMMEDIATE", description: "d", cost_low_cents: 1000, cost_high_cents: 1000, crews_required: 1 }
              as: AcquisitionAnalyst
            - call: "POST /acquisitions/assessments/${a_id}/submit"
              payload: {}
              as: AcquisitionAnalyst
              as_user_id: analyst-1
            - call: "POST /acquisitions/assessments/${a_id}/accept"
              payload: {}
              as: EngineeringReviewer
              as_user_id: reviewer-1
            - call: "GET /acquisitions/targets/${t_id}"
              payload: {}
              as: AcquisitionAnalyst
              captures: { t_v: $.data.version }
            - call: "POST /acquisitions/targets/${t_id}/valuation-cases"
              payload: { expected_target_version: "${t_v}" }
              as: AcquisitionAnalyst
              captures: { c1: $.data.id }
            - call: "POST /acquisitions/valuation-cases/${c1}/entries"
              payload: { method: "FMV_INDEPENDENT", value_cents: 5000000, law_citation: "c" }
              as: Appraiser
              as_user_id: appraiser-1
              captures: { e1: $.data.id }
            - call: "POST /acquisitions/valuation-cases/${c1}/entries"
              payload: { method: "FMV_INDEPENDENT", value_cents: 6000000, law_citation: "c" }
              as: Appraiser
              as_user_id: appraiser-2
              captures: { e2: $.data.id }
            - call: "POST /acquisitions/valuation-cases/${c1}/finalize"
              payload: { select_entry_id: "${e2}" }
              as: AcquisitionAnalyst
              as_user_id: analyst-1
          trigger:
            - call: "POST /acquisitions/valuation-cases/${c1}/entries"
              payload: { method: "FMV_INDEPENDENT", value_cents: 7000000, law_citation: "c" }
              as: Appraiser
              as_user_id: appraiser-3
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (case FINALIZED accepts no new entries)"
            - "ValuationEntry.${e1}.status == NOT_SELECTED"
            - "ValuationEntry.${e2}.status == SELECTED"

      - name: transition_item_done_is_terminal
        claim_type: terminal_state_lockdown
        grounds: [state_machines.TransitionItem]
        distinguishing_aspect: "Resolving an already-DONE transition item returns ERR_INVALID_STATE."
        test_recipe:
          setup: ["target T in CLOSING; SERVICE_AGREEMENTS item resolved DONE"]
          setup_api_calls:
            - call: "POST /acquisitions/targets"
              payload: { system_name: "T", municipality_name: "M", state_code: "PA", system_type: "WATER", customer_count: 5, permitted_valuation_methods: ["FMV_INDEPENDENT"] }
              as: AcquisitionAnalyst
              captures: { t_id: $.data.id }
            - call: "POST /acquisitions/targets/${t_id}/assessments"
              payload: { notes: "s" }
              as: AcquisitionAnalyst
              as_user_id: analyst-1
              captures: { a_id: $.data.id }
            - call: "POST /acquisitions/assessments/${a_id}/capital-items"
              payload: { category: "GENERAL", horizon: "IMMEDIATE", description: "d", cost_low_cents: 1000, cost_high_cents: 1000, crews_required: 1 }
              as: AcquisitionAnalyst
            - call: "POST /acquisitions/assessments/${a_id}/submit"
              payload: {}
              as: AcquisitionAnalyst
              as_user_id: analyst-1
            - call: "POST /acquisitions/assessments/${a_id}/accept"
              payload: {}
              as: EngineeringReviewer
              as_user_id: reviewer-1
            - call: "GET /acquisitions/targets/${t_id}"
              payload: {}
              as: AcquisitionAnalyst
              captures: { t_v: $.data.version }
            - call: "POST /acquisitions/targets/${t_id}/valuation-cases"
              payload: { expected_target_version: "${t_v}" }
              as: AcquisitionAnalyst
              captures: { c_id: $.data.id }
            - call: "POST /acquisitions/valuation-cases/${c_id}/entries"
              payload: { method: "FMV_INDEPENDENT", value_cents: 5000000, law_citation: "c" }
              as: Appraiser
              as_user_id: appraiser-1
              captures: { e_id: $.data.id }
            - call: "POST /acquisitions/valuation-cases/${c_id}/finalize"
              payload: { select_entry_id: "${e_id}" }
              as: AcquisitionAnalyst
              as_user_id: analyst-1
            - call: "POST /acquisitions/targets/${t_id}/council-events"
              payload: { kind: "PUBLIC_HEARING", scheduled_start: "2026-09-02T00:00:00Z", scheduled_end: "2026-09-02T02:00:00Z" }
              as: MunicipalClerk
              captures: { h_id: $.data.id }
            - call: "POST /acquisitions/council-events/${h_id}/record-outcome"
              payload: {}
              as: MunicipalClerk
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /acquisitions/targets/${t_id}/council-events"
              payload: { kind: "COUNCIL_VOTE", scheduled_start: "2026-09-10T03:00:00Z", scheduled_end: "2026-09-10T04:00:00Z" }
              as: MunicipalClerk
              captures: { v_id: $.data.id }
            - call: "POST /acquisitions/council-events/${v_id}/record-outcome"
              payload: { yes_votes: 3, no_votes: 2 }
              as: MunicipalClerk
            - call: "POST /acquisitions/targets/${t_id}/regulatory-applications"
              payload: { purchase_price_cents: 5000000, rate_base_method: "AS_PAID" }
              as: RegulatoryOfficer
              captures: { r_id: $.data.id }
            - call: "POST /acquisitions/regulatory-applications/${r_id}/decide"
              payload: { outcome: "APPROVED" }
              as: Commissioner
            - call: "GET /acquisitions/targets/${t_id}/transition-items"
              payload: {}
              as: TransitionManager
              captures: { ti_sa: "$.data[2].id" }
            - call: "POST /acquisitions/transition-items/${ti_sa}/resolve"
              payload: {}
              as: TransitionManager
          trigger:
