scenario: |
  Carbon emission trading system: enterprise carbon quota allocation with industry benchmark methods,
  historical-emission methods, free-and-paid allocation ratio, allocation publication and objection
  handling, and quota account opening; emission data reporting with data-source classification
  (fuel/electricity/process/fugitive), reporting templates by industry, periodic submission deadlines,
  supporting-document upload, and reporting-version control; verification and certification with
  third-party verification agency assignment, on-site verification scheduling, data cross-check,
  verification report issuance, and dispute review; carbon credit trading matching with order types
  (limit/market), price-time priority matching, block trade and over-the-counter handling, transaction
  fee calculation, and settlement workflow; compliance offset with annual compliance period, quota and
  credit offset rules, CCER usage cap, multi-year banking and borrowing rules, and compliance status
  declaration; penalty calculation with non-compliance identification, penalty rate by jurisdiction
  and severity, mandatory quota deduction, payment workflow, and credit record reporting; annual
  settlement with quota balance reconciliation, surplus carry-forward or repurchase, deficit purchase
  requirement, account closing, and next-cycle quota issuance; event-driven synchronization with
  banking, regulatory authority, and energy-data systems; audit logging for quota changes and trading
  records.

domain_name: "carbon-emission-trading"
api_prefix: "/enterprises"

complexity_profile:
  primary_archetype: "compliance_audit"
  secondary_archetype: "quota_allocation"
  complexity_layers:
    - "dual_variant_calculation"      # benchmark vs historical allocation; provisional vs verified emissions
    - "cascading_side_effects"        # verification -> compliance -> penalty -> settlement
    - "rate_threshold_triggers"       # CCER cap, severity tiers, free/paid allocation ratio
    - "scheduled_deferred_actions"    # compliance deadline, settlement, quota issuance
  entity_topology: "hybrid"
  state_machine_shape: "branching"
  relationship_patterns:
    - "one_to_many"
    - "many_to_many"
    - "cross_aggregate"
  role_model: "segregation_of_duties"
  consistency_model: "saga"

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Enterprise
    parent: null
    common_fields: true
    fields:
      - name: legal_name
        type: string
        source: input
        description: "Registered legal name"
      - name: jurisdiction_code
        type: enum
        source: input
        description: "Jurisdiction this enterprise reports under; drives penalty rates and templates"
        constraints: "one of {JD_ALPHA, JD_BETA, JD_GAMMA}"
      - name: industry_code
        type: enum
        source: input
        description: "Industry classification driving allocation method and reporting template"
        constraints: "one of {POWER, STEEL, CEMENT, CHEMICAL, PETROCHEMICAL}"
      - name: account_status
        type: enum
        source: computed
        description: "Lifecycle status of the carbon quota account"
        default: PENDING
        constraints: "one of {PENDING, OPEN, RESTRICTED, CLOSED}"
      - name: quota_balance
        type: number
        source: computed
        description: "Current free quota balance in tCO2e (allocated - retired - sold + bought + carried_forward)"
        default: 0
      - name: paid_quota_balance
        type: number
        source: computed
        description: "Current paid-auctioned quota balance in tCO2e tracked separately for reporting"
        default: 0
      - name: ccer_balance
        type: number
        source: computed
        description: "Current CCER credit balance in tCO2e usable for offset under cap"
        default: 0
      - name: contact_email
        type: string
        source: input
        description: "Notification address for objection windows and compliance notices"

  - name: AllocationCycle
    parent: null
    common_fields: true
    fields:
      - name: cycle_year
        type: integer
        source: input
        description: "Compliance year this cycle covers (e.g., 2025)"
        constraints: "unique"
      - name: status
        type: enum
        source: computed
        description: "Cycle lifecycle"
        default: DRAFT
        constraints: "one of {DRAFT, PUBLISHED, OBJECTION_OPEN, FINALIZED, COMPLIANCE_OPEN, SETTLED, CLOSED}"
      - name: free_paid_ratio
        type: number
        source: input
        description: "Fraction of allocation issued as free quota (0.0-1.0); rest is paid auction"
        constraints: "0.0 <= x <= 1.0"
      - name: ccer_cap_pct
        type: number
        source: input
        description: "Maximum CCER share usable for offset, expressed as fraction of verified emissions"
        constraints: "0.0 <= x <= 0.20"
      - name: publication_date
        type: datetime
        source: system
        description: "Timestamp when allocations were published"
        default: null
      - name: objection_deadline
        type: datetime
        source: input
        description: "Latest timestamp at which an Objection may be filed"
      - name: compliance_deadline
        type: datetime
        source: input
        description: "Latest timestamp by which compliance declaration must be submitted"
      - name: settlement_date
        type: datetime
        source: system
        description: "Timestamp when annual settlement was performed"
        default: null

  - name: Allocation
    parent: AllocationCycle
    common_fields: true
    fields:
      - name: enterprise_id
        type: string
        source: input
        description: "Enterprise receiving allocation"
      - name: method
        type: enum
        source: input
        description: "Method used to compute the allocation"
        constraints: "one of {INDUSTRY_BENCHMARK, HISTORICAL_EMISSION}"
      - name: activity_volume
        type: number
        source: input
        description: "Activity throughput for benchmark method (e.g., MWh, tonnes of product)"
      - name: benchmark_factor
        type: number
        source: input
        description: "tCO2e per unit of activity for benchmark method"
        default: null
      - name: historical_baseline
        type: number
        source: input
        description: "Baseline emissions in tCO2e for historical method (avg of prior 3 years)"
        default: null
      - name: total_quota
        type: number
        source: computed
        description: "Total quota issued (free + paid) in tCO2e"
      - name: free_quota
        type: number
        source: computed
        description: "Free portion of total quota in tCO2e"
      - name: paid_quota
        type: number
        source: computed
        description: "Paid-auction portion of total quota in tCO2e"
      - name: status
        type: enum
        source: computed
        description: "Allocation lifecycle"
        default: PROPOSED
        constraints: "one of {PROPOSED, PUBLISHED, OBJECTED, REVISED, FINALIZED}"

  - name: Objection
    parent: Allocation
    common_fields: false
    fields:
      - name: filer_enterprise_id
        type: string
        source: input
        description: "Enterprise filing the objection (must equal allocation owner)"
      - name: ground
        type: string
        source: input
        description: "Reason for objection"
      - name: status
        type: enum
        source: computed
        description: "Objection lifecycle"
        default: PENDING
        constraints: "one of {PENDING, UPHELD, REJECTED}"
      - name: revised_total_quota
        type: number
        source: input
        description: "Proposed revised total_quota if upheld (regulator only)"
        default: null
      - name: filed_at
        type: datetime
        source: system
        description: "When objection was filed"
      - name: resolved_at
        type: datetime
        source: system
        description: "When objection was resolved"
        default: null

  - name: EmissionReport
    parent: Enterprise
    common_fields: true
    fields:
      - name: cycle_year
        type: integer
        source: input
        description: "Reporting year"
      - name: version
        type: integer
        source: computed
        description: "Sequential version number per (enterprise, cycle_year); starts at 1, +1 per resubmit"
      - name: status
        type: enum
        source: computed
        description: "Report lifecycle"
        default: DRAFT
        constraints: "one of {DRAFT, SUBMITTED, UNDER_VERIFICATION, VERIFIED, DISPUTED, FINALIZED, REJECTED}"
      - name: submission_deadline
        type: datetime
        source: computed
        description: "Cycle compliance_deadline minus 90 days; report must be submitted by this time"
      - name: submitted_at
        type: datetime
        source: system
        description: "When the current version was submitted"
        default: null
      - name: total_reported_emissions
        type: number
        source: computed
        description: "Sum of source_amount across child EmissionDataLines (fuel+electricity+process+fugitive)"
        default: 0
      - name: total_verified_emissions
        type: number
        source: computed
        description: "Verified total after data cross-check; differs from reported when adjustments applied"
        default: null
      - name: is_current_version
        type: boolean
        source: computed
        description: "True only for the latest non-rejected version per (enterprise, cycle_year)"
        default: true
      - name: supporting_document_count
        type: integer
        source: computed
        description: "Number of attached supporting documents"
        default: 0

  - name: EmissionDataLine
    parent: EmissionReport
    common_fields: false
    fields:
      - name: source_category
        type: enum
        source: input
        description: "Data source classification"
        constraints: "one of {FUEL, ELECTRICITY, PROCESS, FUGITIVE}"
      - name: activity_data
        type: number
        source: input
        description: "Quantity of activity (e.g., tonnes of fuel, MWh of electricity)"
      - name: emission_factor
        type: number
        source: input
        description: "tCO2e per unit of activity"
      - name: source_amount
        type: number
        source: computed
        description: "activity_data * emission_factor in tCO2e"
      - name: verified_amount
        type: number
        source: computed
        description: "Adjusted amount after verification cross-check; null until verification finalizes"
        default: null
      - name: supporting_document_id
        type: string
        source: input
        description: "Reference to a SupportingDocument; required when source_category in {FUEL, PROCESS}"
        default: null

  - name: SupportingDocument
    parent: EmissionReport
    common_fields: false
    fields:
      - name: document_type
        type: enum
        source: input
        description: "Document classification"
        constraints: "one of {FUEL_INVOICE, METER_LOG, PROCESS_SHEET, EXTERNAL_AUDIT}"
      - name: file_uri
        type: string
        source: input
        description: "URI to the uploaded file"
      - name: uploaded_at
        type: datetime
        source: system
        description: "Upload timestamp"

  - name: VerificationAssignment
    parent: EmissionReport
    common_fields: true
    fields:
      - name: agency_id
        type: string
        source: input
        description: "Third-party verification agency assigned by regulator"
      - name: scheduled_visit_at
        type: datetime
        source: input
        description: "On-site verification visit time; must be at least 7 days after assignment"
      - name: status
        type: enum
        source: computed
        description: "Assignment lifecycle"
        default: ASSIGNED
        constraints: "one of {ASSIGNED, SCHEDULED, ON_SITE_DONE, REPORT_ISSUED, DISPUTED, RESOLVED}"
      - name: cross_check_delta_pct
        type: number
        source: computed
        description: "abs(verified - reported)/reported * 100; null until on-site complete"
        default: null
      - name: report_issued_at
        type: datetime
        source: system
        description: "When verification report was issued"
        default: null

  - name: TradingOrder
    parent: null
    common_fields: true
    fields:
      - name: enterprise_id
        type: string
        source: input
        description: "Enterprise placing the order"
      - name: side
        type: enum
        source: input
        description: "Buy or sell"
        constraints: "one of {BUY, SELL}"
      - name: instrument
        type: enum
        source: input
        description: "Asset traded"
        constraints: "one of {QUOTA, CCER}"
      - name: order_type
        type: enum
        source: input
        description: "LIMIT or MARKET"
        constraints: "one of {LIMIT, MARKET}"
      - name: quantity
        type: number
        source: input
        description: "Order size in tCO2e"
        constraints: "> 0"
      - name: limit_price
        type: number
        source: input
        description: "Price per tCO2e for LIMIT orders; null for MARKET"
        default: null
      - name: filled_quantity
        type: number
        source: computed
        description: "Quantity matched so far"
        default: 0
      - name: status
        type: enum
        source: computed
        description: "Order lifecycle"
        default: OPEN
        constraints: "one of {OPEN, PARTIALLY_FILLED, FILLED, CANCELLED, REJECTED}"
      - name: channel
        type: enum
        source: input
        description: "Trading channel"
        constraints: "one of {EXCHANGE, BLOCK, OTC}"
      - name: placed_at
        type: datetime
        source: system
        description: "Order placement timestamp; tie-breaker for price-time priority"

  - name: Trade
    parent: null
    common_fields: false
    fields:
      - name: buy_order_id
        type: string
        source: system
        description: "Matched buy-side order"
      - name: sell_order_id
        type: string
        source: system
        description: "Matched sell-side order"
      - name: instrument
        type: enum
        source: system
        description: "Quota or CCER traded"
        constraints: "one of {QUOTA, CCER}"
      - name: quantity
        type: number
        source: system
        description: "Matched quantity in tCO2e"
      - name: price
        type: number
        source: system
        description: "Execution price; for EXCHANGE LIMIT match = price of resting order"
      - name: gross_value
        type: number
        source: computed
        description: "quantity * price"
      - name: buyer_fee
        type: number
        source: computed
        description: "Tiered fee charged to buyer"
      - name: seller_fee
        type: number
        source: computed
        description: "Tiered fee charged to seller"
      - name: settlement_status
        type: enum
        source: computed
        description: "Settlement workflow status"
        default: PENDING
        constraints: "one of {PENDING, SETTLED, FAILED}"
      - name: executed_at
        type: datetime
        source: system
        description: "Match timestamp"

  - name: ComplianceDeclaration
    parent: Enterprise
    common_fields: true
    fields:
      - name: cycle_year
        type: integer
        source: input
        description: "Compliance year"
      - name: declared_offset_quota
        type: number
        source: input
        description: "tCO2e of free/paid quota the enterprise designates for retirement"
      - name: declared_offset_ccer
        type: number
        source: input
        description: "tCO2e of CCER the enterprise designates for retirement (capped by ccer_cap_pct)"
      - name: declared_borrow_amount
        type: number
        source: input
        description: "Quota borrowed from next cycle (capped by 5% of verified emissions)"
        default: 0
      - name: declared_bank_amount
        type: number
        source: input
        description: "Surplus quota deferred to next cycle (after offset)"
        default: 0
      - name: status
        type: enum
        source: computed
        description: "Declaration lifecycle"
        default: DRAFT
        constraints: "one of {DRAFT, SUBMITTED, COMPLIANT, NON_COMPLIANT, PENALIZED, FINALIZED}"
      - name: deficit_amount
        type: number
        source: computed
        description: "max(0, verified_emissions - declared_offset_quota - declared_offset_ccer - declared_borrow_amount)"
        default: 0
      - name: surplus_amount
        type: number
        source: computed
        description: "max(0, declared_offset_quota + declared_offset_ccer + declared_borrow_amount - verified_emissions)"
        default: 0

  - name: PenaltyOrder
    parent: ComplianceDeclaration
    common_fields: true
    fields:
      - name: severity
        type: enum
        source: computed
        description: "Severity classification driving penalty rate; computed from deficit_pct"
        constraints: "one of {MINOR, MODERATE, SEVERE}"
      - name: penalty_rate
        type: number
        source: computed
        description: "Currency per tCO2e deficit; varies by jurisdiction and severity"
      - name: deficit_amount
        type: number
        source: computed
        description: "Carried over from declaration; tCO2e of unmet compliance"
      - name: penalty_amount
        type: number
        source: computed
        description: "deficit_amount * penalty_rate"
      - name: mandatory_deduction_amount
        type: number
        source: computed
        description: "deficit_amount * 1.5 — quota deducted from next cycle's allocation"
      - name: payment_status
        type: enum
        source: computed
        description: "Payment lifecycle"
        default: UNPAID
        constraints: "one of {UNPAID, PAID, OVERDUE}"
      - name: payment_due_at
        type: datetime
        source: system
        description: "30 days after issuance"
      - name: paid_at
        type: datetime
        source: system
        description: "When payment was confirmed"
        default: null
      - name: credit_record_reported
        type: boolean
        source: computed
        description: "True once reported to regulator credit registry"
        default: false

  - name: AnnualSettlement
    parent: AllocationCycle
    common_fields: true
    fields:
      - name: enterprise_id
        type: string
        source: input
        description: "Enterprise being settled"
      - name: opening_quota
        type: number
        source: computed
        description: "Free + paid balance at start of settlement"
      - name: net_traded_quota
        type: number
        source: computed
        description: "Sum of bought - sold QUOTA trades for this enterprise this cycle"
      - name: retired_quota
        type: number
        source: computed
        description: "Quota retired through offset declaration"
      - name: closing_balance
        type: number
        source: computed
        description: "opening_quota + net_traded_quota - retired_quota - mandatory_deductions"
      - name: carry_forward_amount
        type: number
        source: computed
        description: "Surplus carried into next cycle (capped by 10% of next-cycle allocation)"
      - name: repurchase_amount
        type: number
        source: computed
        description: "Surplus above carry-forward cap repurchased by regulator at floor price"
      - name: deficit_purchase_amount
        type: number
        source: computed
        description: "Quota the enterprise must purchase if borrowing exceeded cap"
        default: 0
      - name: status
        type: enum
        source: computed
        description: "Settlement lifecycle"
        default: PENDING
        constraints: "one of {PENDING, RECONCILED, CLOSED}"

  - name: AuditLogEntry
    parent: null
    common_fields: false
    fields:
      - name: subject_type
        type: enum
        source: system
        description: "Entity type the entry concerns"
        constraints: "one of {QUOTA_CHANGE, TRADE_RECORD, EXTERNAL_SYNC}"
      - name: subject_id
        type: string
        source: system
        description: "ID of the subject entity"
      - name: enterprise_id
        type: string
        source: system
        description: "Affected enterprise"
      - name: action
        type: string
        source: system
        description: "Action performed (e.g., ALLOCATE, RETIRE, TRADE_EXECUTED, BANK_SYNC)"
      - name: delta_quota
        type: number
        source: system
        description: "Signed change in quota balance; 0 for non-quota events"
        default: 0
      - name: delta_ccer
        type: number
        source: system
        description: "Signed change in CCER balance; 0 for non-CCER events"
        default: 0
      - name: external_system
        type: enum
        source: system
        description: "External system involved if applicable"
        default: null
        constraints: "one of {BANK, REGULATOR, ENERGY_DATA, null}"
      - name: occurred_at
        type: datetime
        source: system
        description: "When the event occurred"

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: AllocationCycle
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: PUBLISHED
        trigger: "POST /allocation-cycles/{id}/publish"
        actor: Regulator
        preconditions:
          - "All allocations in cycle have status=PROPOSED"
          - "free_paid_ratio set; ccer_cap_pct set"
        side_effects:
          - "Each Allocation transitions PROPOSED -> PUBLISHED"
          - "Set publication_date = now"
          - "AuditLogEntry(subject_type=QUOTA_CHANGE, action=ALLOCATIONS_PUBLISHED) appended"
      - from: PUBLISHED
        to: OBJECTION_OPEN
        trigger: "system: publication_date set marks objection window open"
        actor: system
        preconditions:
          - "now < objection_deadline"
        side_effects: []
        note: "Auto-transitions immediately on publish; OBJECTION_OPEN reflects window state"
      - from: OBJECTION_OPEN
        to: FINALIZED
        trigger: "POST /allocation-cycles/{id}/finalize (after objection_deadline)"
        actor: Regulator
        preconditions:
          - "now >= objection_deadline"
          - "All Objections resolved (UPHELD or REJECTED)"
        side_effects:
          - "Each Allocation in PUBLISHED or REVISED transitions to FINALIZED"
          - "Each Enterprise.account_status: PENDING -> OPEN; quota_balance += allocation.free_quota; paid_quota_balance += allocation.paid_quota"
          - "AuditLogEntry per enterprise (action=ALLOCATION_FINALIZED, delta_quota=free_quota+paid_quota)"
      - from: FINALIZED
        to: COMPLIANCE_OPEN
        trigger: "system: cycle_year >= current year and EmissionReports begin"
        actor: system
        preconditions:
          - "Cycle is FINALIZED"
        side_effects: []
      - from: COMPLIANCE_OPEN
        to: SETTLED
        trigger: "POST /allocation-cycles/{id}/settle"
        actor: Regulator
        preconditions:
          - "now >= compliance_deadline"
          - "All ComplianceDeclarations submitted with status in {COMPLIANT, NON_COMPLIANT, PENALIZED, FINALIZED}"
        side_effects:
          - "Create AnnualSettlement per enterprise; compute closing_balance/carry_forward/repurchase/deficit_purchase"
          - "Set settlement_date = now"
      - from: SETTLED
        to: CLOSED
        trigger: "POST /allocation-cycles/{id}/close"
        actor: Regulator
        preconditions:
          - "All AnnualSettlements transitioned to CLOSED"
          - "All PenaltyOrders for this cycle in payment_status=PAID"
        side_effects:
          - "Each Enterprise account_status: OPEN -> CLOSED for THIS cycle's reporting; reopened on next cycle's FINALIZED"
          - "AuditLogEntry(action=CYCLE_CLOSED)"

  - entity: Allocation
    initial_state: PROPOSED
    terminal_states: [FINALIZED]
    transitions:
      - from: PROPOSED
        to: PUBLISHED
        trigger: "Cascade from AllocationCycle.publish"
        actor: system
        preconditions:
          - "Parent AllocationCycle transitioning DRAFT -> PUBLISHED"
        side_effects:
          - "Set total_quota, free_quota, paid_quota via calc_allocation_total"
      - from: PUBLISHED
        to: OBJECTED
        trigger: "POST /allocations/{id}/objections"
        actor: Enterprise
        preconditions:
          - "now < parent cycle objection_deadline"
          - "filer_enterprise_id == enterprise_id"
        side_effects:
          - "Create Objection with status=PENDING"
      - from: OBJECTED
        to: REVISED
        trigger: "POST /objections/{id}/uphold"
        actor: Regulator
        preconditions:
          - "Objection.status=PENDING"
          - "revised_total_quota provided"
        side_effects:
          - "Set Objection.status=UPHELD; Objection.resolved_at=now"
          - "Recompute free_quota = revised_total_quota * free_paid_ratio (round_half_up 2dp)"
          - "Recompute paid_quota = revised_total_quota - free_quota"
      - from: OBJECTED
        to: PUBLISHED
        trigger: "POST /objections/{id}/reject"
        actor: Regulator
        preconditions:
          - "Objection.status=PENDING"
        side_effects:
          - "Set Objection.status=REJECTED; Objection.resolved_at=now"
      - from: PUBLISHED
        to: FINALIZED
        trigger: "Cascade from AllocationCycle.finalize"
        actor: system
        preconditions:
          - "Parent cycle transitioning OBJECTION_OPEN -> FINALIZED"
        side_effects:
          - "Cascade to Enterprise: account_status PENDING->OPEN; quota_balance += free_quota; paid_quota_balance += paid_quota"
          - "AuditLogEntry(action=QUOTA_ALLOCATED, delta_quota=free_quota+paid_quota)"
      - from: REVISED
        to: FINALIZED
        trigger: "Cascade from AllocationCycle.finalize"
        actor: system
        preconditions:
          - "Parent cycle transitioning OBJECTION_OPEN -> FINALIZED"
        side_effects:
          - "Same as PUBLISHED -> FINALIZED but using revised totals"

  - entity: EmissionReport
    initial_state: DRAFT
    terminal_states: [FINALIZED, REJECTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /emission-reports/{id}/submit"
        actor: Enterprise
        preconditions:
          - "Parent cycle status in {COMPLIANCE_OPEN}"
          - "now <= submission_deadline"
          - "At least one EmissionDataLine exists"
          - "Every line with source_category in {FUEL, PROCESS} has supporting_document_id set"
        side_effects:
          - "Recompute total_reported_emissions via calc_total_reported_emissions"
          - "Set submitted_at=now"
          - "Older versions of (enterprise, cycle_year) get is_current_version=false"
      - from: SUBMITTED
        to: DRAFT
        trigger: "POST /emission-reports (creates new version)"
        actor: Enterprise
        preconditions:
          - "now <= submission_deadline"
          - "Existing report status in {SUBMITTED, REJECTED}"
        side_effects:
          - "New EmissionReport created with version = previous.version + 1"
          - "Previous report.is_current_version = false"
        note: "Resubmission cycle (cyclic shape: DRAFT -> SUBMITTED -> DRAFT via versioning)"
      - from: SUBMITTED
        to: UNDER_VERIFICATION
        trigger: "POST /emission-reports/{id}/assign-verifier"
        actor: Regulator
        preconditions:
          - "agency_id provided and agency != enterprise"
          - "scheduled_visit_at provided, >= now + 7 days"
        side_effects:
          - "Create VerificationAssignment(status=ASSIGNED, scheduled_visit_at)"
      - from: UNDER_VERIFICATION
        to: VERIFIED
        trigger: "POST /verification-assignments/{id}/issue-report"
        actor: VerifierAgency
        preconditions:
          - "VerificationAssignment.status=ON_SITE_DONE"
          - "cross_check_delta_pct computed"
        side_effects:
          - "Set total_verified_emissions on report"
          - "Each EmissionDataLine.verified_amount populated"
          - "VerificationAssignment.status=REPORT_ISSUED, report_issued_at=now"
      - from: VERIFIED
        to: DISPUTED
        trigger: "POST /emission-reports/{id}/dispute"
        actor: Enterprise
        preconditions:
          - "Within 14 days of report_issued_at"
        side_effects:
          - "VerificationAssignment.status=DISPUTED"
      - from: DISPUTED
        to: VERIFIED
        trigger: "POST /verification-assignments/{id}/resolve-dispute"
        actor: Regulator
        preconditions:
          - "VerificationAssignment.status=DISPUTED"
        side_effects:
          - "VerificationAssignment.status=RESOLVED"
          - "Optionally adjust total_verified_emissions"
        note: "Cyclic: VERIFIED -> DISPUTED -> VERIFIED supported for one round per assignment"
      - from: VERIFIED
        to: FINALIZED
        trigger: "POST /emission-reports/{id}/finalize"
        actor: Regulator
        preconditions:
          - "VerificationAssignment.status in {REPORT_ISSUED, RESOLVED}"
          - "14-day dispute window elapsed OR enterprise waived dispute"
        side_effects:
          - "Report locked; serves as authoritative input for ComplianceDeclaration"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /emission-reports/{id}/reject"
        actor: Regulator
        preconditions:
          - "Report violates template constraints (e.g., missing FUEL document)"
        side_effects:
          - "is_current_version remains; enterprise must submit new version"

  - entity: TradingOrder
    initial_state: OPEN
    terminal_states: [FILLED, CANCELLED, REJECTED]
    transitions:
      - from: OPEN
        to: PARTIALLY_FILLED
        trigger: "system: matching engine partial fill"
        actor: system
        preconditions:
          - "0 < filled_quantity < quantity"
        side_effects:
          - "Trade(s) created"
          - "Buyer Enterprise: paid_quota_balance += matched_qty (or ccer_balance for CCER); fee debited via cash workflow"
          - "Seller Enterprise: appropriate balance -= matched_qty"
          - "AuditLogEntry(action=TRADE_EXECUTED) per Trade"
      - from: PARTIALLY_FILLED
        to: FILLED
        trigger: "system: filled_quantity reaches quantity"
        actor: system
        preconditions:
          - "filled_quantity == quantity"
        side_effects: []
      - from: OPEN
        to: FILLED
        trigger: "system: full fill on placement (MARKET or matching LIMIT)"
        actor: system
        preconditions:
          - "Single match consumes full quantity"
        side_effects:
          - "Trade created and balances/fees applied as above"
      - from: OPEN
        to: CANCELLED
        trigger: "POST /trading-orders/{id}/cancel"
        actor: Enterprise
        preconditions:
          - "Order placed by this enterprise"
          - "Status in {OPEN, PARTIALLY_FILLED}"
        side_effects: []
      - from: PARTIALLY_FILLED
        to: CANCELLED
        trigger: "POST /trading-orders/{id}/cancel"
        actor: Enterprise
        preconditions:
          - "Order placed by this enterprise"
        side_effects: []
      - from: OPEN
        to: REJECTED
        trigger: "system: matching attempt detects insufficient balance"
        actor: system
        preconditions:
          - "Sell side: enterprise quota/CCER balance < quantity at placement"
          - "OR Block trade lacks counterparty acceptance"
        side_effects: []

  - entity: ComplianceDeclaration
    initial_state: DRAFT
    terminal_states: [FINALIZED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /compliance-declarations/{id}/submit"
        actor: Enterprise
        preconditions:
          - "Corresponding EmissionReport.status=FINALIZED"
          - "now <= cycle.compliance_deadline"
          - "declared_offset_ccer <= verified_emissions * cycle.ccer_cap_pct (rounded down 2dp)"
          - "declared_borrow_amount <= verified_emissions * 0.05 AND <= enterprise.next_cycle_allocation_estimate"
          - "Enterprise has sufficient (quota_balance + paid_quota_balance) >= declared_offset_quota"
          - "Enterprise has sufficient ccer_balance >= declared_offset_ccer"
        side_effects:
          - "Compute deficit_amount via calc_compliance_balance"
          - "Compute surplus_amount via calc_compliance_balance"
          - "Retire declared_offset_quota: Enterprise.quota_balance -= min(quota_balance, declared_offset_quota); paid_quota_balance -= remainder"
          - "Retire declared_offset_ccer: Enterprise.ccer_balance -= declared_offset_ccer"
          - "Bank declared_bank_amount via banking ledger entry"
          - "AuditLogEntry(action=COMPLIANCE_RETIRE)"
      - from: SUBMITTED
        to: COMPLIANT
        trigger: "system: deficit_amount == 0"
        actor: system
        preconditions:
          - "deficit_amount == 0"
        side_effects:
          - "Sync to RegulatorSystem via event-driven hook"
      - from: SUBMITTED
        to: NON_COMPLIANT
        trigger: "system: deficit_amount > 0"
        actor: system
        preconditions:
          - "deficit_amount > 0"
        side_effects:
          - "Create PenaltyOrder via calc_penalty_amount"
          - "Sync to RegulatorSystem"
      - from: NON_COMPLIANT
        to: PENALIZED
        trigger: "POST /penalty-orders/{id}/pay"
        actor: Enterprise
        preconditions:
          - "PenaltyOrder.payment_status transitions to PAID"
        side_effects:
          - "Mandatory deduction recorded against next cycle Allocation: pending_deduction += deficit_amount * 1.5"
          - "AuditLogEntry(action=PENALTY_PAID, external_system=BANK)"
      - from: COMPLIANT
        to: FINALIZED
        trigger: "Cascade from AllocationCycle.settle"
        actor: system
        preconditions:
          - "Parent cycle transitioning COMPLIANCE_OPEN -> SETTLED"
        side_effects: []
      - from: PENALIZED
        to: FINALIZED
        trigger: "Cascade from AllocationCycle.settle"
        actor: system
        preconditions:
          - "Parent cycle transitioning COMPLIANCE_OPEN -> SETTLED"
          - "PenaltyOrder.payment_status=PAID and credit_record_reported=true"
        side_effects: []

  - entity: PenaltyOrder
    initial_state: UNPAID
    terminal_states: [PAID]
    transitions:
      - from: UNPAID
        to: PAID
        trigger: "POST /penalty-orders/{id}/pay"
        actor: Enterprise
        preconditions:
          - "now <= payment_due_at"
        side_effects:
          - "Set paid_at=now"
          - "credit_record_reported=true"
          - "AuditLogEntry(action=PENALTY_PAID, external_system=REGULATOR)"
          - "Cascade ComplianceDeclaration NON_COMPLIANT -> PENALIZED"
      - from: UNPAID
        to: OVERDUE
        trigger: "system: now > payment_due_at and unpaid"
        actor: system
        preconditions:
          - "now > payment_due_at"
          - "payment_status=UNPAID"
        side_effects:
          - "credit_record_reported=true (overdue mark)"
          - "AuditLogEntry(action=PENALTY_OVERDUE, external_system=REGULATOR)"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - scenario: "Two SELL orders against the same seller exhaust the seller's quota balance"
    guarantee: "Total filled SELL quantity per enterprise per instrument cannot exceed available balance at match time; second match attempt rejected"
    error_id: ERR_INSUFFICIENT_BALANCE
    http_status: 409
    serialization: "First-writer-wins on placed_at; matching engine validates balance just before each fill"

  - scenario: "Enterprise files a second Objection on the same Allocation while the first is still PENDING"
    guarantee: "At most one open Objection per Allocation; second filing rejected"
    error_id: ERR_OBJECTION_ALREADY_PENDING
    http_status: 409
    serialization: "First-writer-wins on Objection.filed_at"

  - scenario: "Two ComplianceDeclaration submissions race for the same (enterprise, cycle_year)"
    guarantee: "At most one ComplianceDeclaration per (enterprise, cycle_year); second submission rejected"
    error_id: ERR_DECLARATION_ALREADY_SUBMITTED
    http_status: 409
    serialization: "First-writer-wins on submission"

  - scenario: "PenaltyOrder.pay races with system marking it OVERDUE"
    guarantee: "Exactly one wins; if pay arrives first the order becomes PAID, if overdue marker fires first the pay is rejected"
    error_id: ERR_PENALTY_OVERDUE
    http_status: 409
    serialization: "First-writer-wins on payment_status mutation"

  - scenario: "Two Trades attempt to settle simultaneously moving the same enterprise's quota balance below zero"
    guarantee: "Settlement engine rejects the trade that would push the balance below zero; loser gets ERR_INSUFFICIENT_BALANCE"
    error_id: ERR_INSUFFICIENT_BALANCE
    http_status: 409
    serialization: "First-writer-wins on Trade.settlement_status mutation"

  - scenario: "Cycle.publish races with cycle.finalize for the same cycle"
    guarantee: "Cycle status transitions are linearized; the second action sees the new state and is rejected with ERR_INVALID_STATE"
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on AllocationCycle.status"

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: calc_allocation_total
    trigger: "On AllocationCycle.publish (cascade to each Allocation), and on Allocation.uphold (recompute)"
    algorithm: "dual_variant_calculation"
    formula: |
      if method == INDUSTRY_BENCHMARK:
        total_quota = round(activity_volume * benchmark_factor, 2)
      elif method == HISTORICAL_EMISSION:
        total_quota = round(historical_baseline * 0.97, 2)   # 3% annual reduction
      free_quota = round(total_quota * cycle.free_paid_ratio, 2)
      paid_quota = round(total_quota - free_quota, 2)
    input_set: "Allocation.method drives variant; activity_volume * benchmark_factor for benchmark, historical_baseline * 0.97 for historical"
    constants:
      ANNUAL_REDUCTION_FACTOR: 0.97
    precision: "2 decimal places, round_half_up; free_quota rounded then paid_quota = total - free (to keep total exact)"
    variants:
      - name: industry_benchmark
        when: "Allocation.method = INDUSTRY_BENCHMARK"
        difference: "Forward-looking: based on planned activity_volume and industry-published benchmark_factor; quota grows with volume"
      - name: historical_emission
        when: "Allocation.method = HISTORICAL_EMISSION"
        difference: "Backward-looking: based on prior 3-year baseline reduced by ANNUAL_REDUCTION_FACTOR; quota independent of planned activity"

  - name: calc_total_reported_emissions
    trigger: "On EmissionReport.submit; on EmissionDataLine create/update"
    algorithm: "aggregation"
    formula: |
      total_reported_emissions =
        round(
          sum(round(line.activity_data * line.emission_factor, 2)
              for line in EmissionDataLine where line.report_id == report.id),
          2
        )
      # Round per-line first, then sum; sum NOT re-rounded across lines.
      # The outer round is a no-op (sum of 2dp is 2dp); explicit for determinism.
    input_set: "All EmissionDataLine rows attached to this report version (FUEL+ELECTRICITY+PROCESS+FUGITIVE)"
    constants: {}
    precision: "Per-line round_half_up to 2dp, then sum (this rounding order is the canonical one and MUST NOT be reversed)"
    variants:
      - name: per_line_round_then_sum
        when: "Always for total_reported_emissions"
        difference: "Pinned order: round each line first, then sum. The alternative (sum activity*factor across lines, then round) produces different cents and is forbidden."

  - name: calc_verified_emissions
    trigger: "On VerificationAssignment.issue-report"
    algorithm: "aggregation"
    formula: |
      for each EmissionDataLine line:
        line.verified_amount = round(line.activity_data * line.emission_factor * (1 + verifier_adjustment_pct(line.source_category)), 2)
      total_verified_emissions = sum(line.verified_amount for line in lines)   # 2dp, no extra round
      cross_check_delta_pct = round(abs(total_verified_emissions - total_reported_emissions) / total_reported_emissions * 100, 2)
    input_set: "Verifier-supplied adjustment per source_category at on-site visit"
    constants: {}
    precision: "Per-line round_half_up to 2dp, then sum"
    variants:
      - name: provisional_reported
        when: "Pre-verification — used by enterprise to plan offset purchases"
        difference: "Uses self-reported totals; emission_factor is enterprise's own"
      - name: final_verified
        when: "Post-verification — authoritative input for ComplianceDeclaration"
        difference: "Uses verifier-adjusted factors; differs from provisional whenever any verifier_adjustment_pct != 0"

  - name: calc_trade_fee
    trigger: "On Trade creation"
    algorithm: "tiered_pricing"
    formula: |
      gross_value = round(quantity * price, 2)
      base_rate = TIER_BASE_RATE_BY_CHANNEL[channel]   # exchange=0.0010, block=0.0006, otc=0.0008
      # Tier discount applies at gross_value breakpoints — marginal NOT average:
      # tier 1 (0, 100_000]: full rate
      # tier 2 (100_000, 1_000_000]: 0.80 * rate on portion above 100_000
      # tier 3 (1_000_000, +inf): 0.60 * rate on portion above 1_000_000
      tier1 = min(gross_value, 100_000)
      tier2 = max(0, min(gross_value, 1_000_000) - 100_000)
      tier3 = max(0, gross_value - 1_000_000)
      fee_per_side = round(tier1 * base_rate + tier2 * base_rate * 0.80 + tier3 * base_rate * 0.60, 2)
      buyer_fee = fee_per_side
      seller_fee = fee_per_side
    input_set: "channel, quantity, price"
    constants:
      TIER_BASE_RATE_BY_CHANNEL: { EXCHANGE: 0.0010, BLOCK: 0.0006, OTC: 0.0008 }
      TIER1_CAP: 100000
      TIER2_CAP: 1000000
      TIER2_DISCOUNT: 0.80
      TIER3_DISCOUNT: 0.60
    precision: "Compute gross_value first (round to 2dp); compute marginal tier portions with raw arithmetic; round fee_per_side to 2dp at the end. This rounding order is canonical."
    variants:
      - name: marginal_tier
        when: "Always"
        difference: "Tier discounts apply marginally to portions; an average-rate interpretation produces different cents and is forbidden."

  - name: calc_compliance_balance
    trigger: "On ComplianceDeclaration.submit"
    algorithm: "constraint_propagation"
    formula: |
      verified = EmissionReport(enterprise, cycle).total_verified_emissions
      offset_total = declared_offset_quota + declared_offset_ccer + declared_borrow_amount
      deficit_amount = round(max(0, verified - offset_total), 2)
      surplus_amount = round(max(0, offset_total - verified), 2)
      # Three-way evaluation order: validate caps first, retire balances second, compute deficit/surplus third.
    input_set: "Verified emissions; declared offset components"
    constants: {}
    precision: "round_half_up 2dp"
    variants: []

  - name: calc_penalty_amount
    trigger: "On ComplianceDeclaration.SUBMITTED -> NON_COMPLIANT (deficit_amount > 0)"
    algorithm: "threshold"
    formula: |
      deficit_pct = deficit_amount / verified_emissions
      if deficit_pct < 0.05:
        severity = MINOR
      elif deficit_pct < 0.20:
        severity = MODERATE
      else:
        severity = SEVERE
      penalty_rate = JURISDICTION_PENALTY_RATE[enterprise.jurisdiction_code][severity]
      penalty_amount = round(deficit_amount * penalty_rate, 2)
      mandatory_deduction_amount = round(deficit_amount * 1.5, 2)
    input_set: "deficit_amount, verified_emissions, enterprise.jurisdiction_code"
    constants:
      JURISDICTION_PENALTY_RATE:
        JD_ALPHA: { MINOR: 100.00, MODERATE: 200.00, SEVERE: 500.00 }
        JD_BETA:  { MINOR: 80.00,  MODERATE: 180.00, SEVERE: 450.00 }
        JD_GAMMA: { MINOR: 120.00, MODERATE: 250.00, SEVERE: 600.00 }
      MANDATORY_DEDUCTION_MULTIPLIER: 1.5
      SEVERITY_MINOR_BREAKPOINT: 0.05   # < this => MINOR
      SEVERITY_MODERATE_BREAKPOINT: 0.20 # < this => MODERATE; else SEVERE
    precision: "round_half_up 2dp; severity is exclusive on lower bound (deficit_pct == 0.05 maps to MODERATE, == 0.20 maps to SEVERE)"
    variants: []

  - name: calc_annual_settlement
    trigger: "On AllocationCycle.settle"
    algorithm: "waterfall_allocation"
    formula: |
      opening_quota = enterprise.quota_balance + enterprise.paid_quota_balance + retired_amount  # at settle time, before reduction
      net_traded_quota = sum(buy.quantity - sell.quantity for trades involving this enterprise this cycle, instrument=QUOTA)
      retired_quota = ComplianceDeclaration.declared_offset_quota
      mandatory_deductions = sum(PenaltyOrder.mandatory_deduction_amount for this enterprise this cycle)
      closing_balance = round(opening_quota + net_traded_quota - retired_quota - mandatory_deductions, 2)

      next_cycle_allocation = next AllocationCycle's Allocation.total_quota for this enterprise (0 if none)
      carry_forward_cap = round(next_cycle_allocation * 0.10, 2)

      if closing_balance >= 0:
        carry_forward_amount = min(closing_balance, carry_forward_cap)
        repurchase_amount = round(closing_balance - carry_forward_amount, 2)   # at REPURCHASE_FLOOR_PRICE
        deficit_purchase_amount = 0
      else:
        carry_forward_amount = 0
        repurchase_amount = 0
        deficit_purchase_amount = round(-closing_balance, 2)
    input_set: "Enterprise balances at settle time, all this-cycle Trades, ComplianceDeclaration, PenaltyOrders, next cycle's Allocation if any"
    constants:
      CARRY_FORWARD_CAP_PCT: 0.10
      REPURCHASE_FLOOR_PRICE: 30.00
    precision: "round_half_up 2dp; computation order pinned: opening -> net_traded -> retired -> deductions -> closing -> carry/repurchase/deficit"
    variants: []

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and non-empty"
    error_id: ERR_AUTH_REQUIRED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "X-User-Role permitted for endpoint per RBAC matrix (§1.7)"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Path resources resolve in left-to-right order; missing resource returns 404 for that segment"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path parameters"

  - priority: 4
    category: state
    check: "Target resource is in a state that permits the requested transition (per §1.2)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"

  - priority: 5
    category: business_referential
    check: "Cross-entity foreign keys point to entities owned by/related to the acting enterprise (e.g., ComplianceDeclaration.enterprise_id == X-User-ID for Enterprise role)"
    error_id: ERR_OWNERSHIP_VIOLATION
    http_status: 403
    applies_to: "Enterprise-acting endpoints"

  - priority: 6
    category: business_safety
    check: "Verifier agency assigned to a report cannot equal the enterprise being verified"
    error_id: ERR_VERIFIER_CONFLICT_OF_INTEREST
    http_status: 422
    applies_to: "POST /emission-reports/{id}/assign-verifier"

  - priority: 7
    category: business_temporal
    check: "Action falls within its declared window: Objection before objection_deadline; ComplianceDeclaration before compliance_deadline; EmissionReport.submit before submission_deadline; dispute within 14 days of report_issued_at; penalty pay before payment_due_at; verification visit >= now + 7 days"
    error_id: ERR_WINDOW_CLOSED
    http_status: 422
    applies_to: "Time-windowed action endpoints"

  - priority: 8
    category: business_constraint
    check: "EmissionDataLine with source_category in {FUEL, PROCESS} requires supporting_document_id"
    error_id: ERR_SUPPORTING_DOCUMENT_REQUIRED
    http_status: 422
    applies_to: "POST /emission-reports/{id}/lines, POST /emission-reports/{id}/submit"

  - priority: 9
    category: business_constraint
    check: "ComplianceDeclaration.declared_offset_ccer <= round_down(verified_emissions * cycle.ccer_cap_pct, 2)"
    error_id: ERR_CCER_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /compliance-declarations/{id}/submit"

  - priority: 10
    category: business_constraint
    check: "ComplianceDeclaration.declared_borrow_amount <= round_down(verified_emissions * 0.05, 2)"
    error_id: ERR_BORROW_CAP_EXCEEDED
    http_status: 422
    applies_to: "POST /compliance-declarations/{id}/submit"

  - priority: 11
    category: business_fiscal
    check: "Sufficient balance for retirement: (enterprise.quota_balance + enterprise.paid_quota_balance) >= declared_offset_quota AND enterprise.ccer_balance >= declared_offset_ccer AND for SELL orders enterprise has sufficient instrument balance"
    error_id: ERR_INSUFFICIENT_BALANCE
    http_status: 422
    applies_to: "POST /compliance-declarations/{id}/submit, POST /trading-orders (SELL)"

  - priority: 12
    category: business_constraint
    check: "TradingOrder.quantity > 0; LIMIT order requires limit_price > 0; MARKET order requires limit_price == null"
    error_id: ERR_INVALID_ORDER
    http_status: 422
    applies_to: "POST /trading-orders"

  - priority: 13
    category: business_constraint
    check: "Allocation.free_paid_ratio in [0.0, 1.0]; ccer_cap_pct in [0.0, 0.20]"
    error_id: ERR_INVALID_RATIO
    http_status: 422
    applies_to: "POST /allocation-cycles, PATCH /allocation-cycles/{id}"

  - priority: 14
    category: business_constraint
    check: "OCC: client-supplied version (when present) equals server version; mismatch rejected"
    error_id: ERR_STALE_VERSION
    http_status: 409
    applies_to: "All PATCH/PUT/DELETE on common_fields entities"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ----- Enterprise -----
  - method: POST
    path: "/enterprises"
    description: "Register a new enterprise (account_status starts PENDING until first cycle FINALIZED)"
    roles: [Regulator]
    code: 201
    input: [legal_name, jurisdiction_code, industry_code, contact_email]
    output: Enterprise
    side_effects: ["Enterprise account_status=PENDING; balances all 0"]

  - method: GET
    path: "/enterprises/{id}"
    description: "Read enterprise including current balances"
    roles: [Regulator, Enterprise]
    code: 200
    input: []
    output: Enterprise
    side_effects: []

  - method: GET
    path: "/enterprises"
    description: "List enterprises (paginated, filterable by jurisdiction_code, industry_code, account_status)"
    roles: [Regulator]
    code: 200
    input: ["limit?", "offset?", "jurisdiction_code?", "industry_code?", "account_status?"]
    output: "Enterprise[]"
    side_effects: []

  # ----- Allocation Cycle -----
  - method: POST
    path: "/allocation-cycles"
    description: "Create a draft allocation cycle"
    roles: [Regulator]
    code: 201
    input: [cycle_year, free_paid_ratio, ccer_cap_pct, objection_deadline, compliance_deadline]
    output: AllocationCycle
    side_effects: []

  - method: POST
    path: "/allocation-cycles/{id}/allocations"
    description: "Propose an allocation for an enterprise in this cycle"
    roles: [Regulator]
    code: 201
    input: [enterprise_id, method, "activity_volume?", "benchmark_factor?", "historical_baseline?"]
    output: Allocation
    side_effects: ["Compute total/free/paid via calc_allocation_total"]

  - method: POST
    path: "/allocation-cycles/{id}/publish"
    description: "Publish all proposed allocations and open objection window"
    roles: [Regulator]
    code: 200
    input: ["version?"]
    output: AllocationCycle
    side_effects: ["Cycle DRAFT->PUBLISHED auto->OBJECTION_OPEN; Allocations PROPOSED->PUBLISHED; AuditLog appended"]

  - method: POST
    path: "/allocations/{id}/objections"
    description: "File an objection to a published allocation"
    roles: [Enterprise]
    code: 201
    input: [filer_enterprise_id, ground]
    output: Objection
    side_effects: ["Allocation PUBLISHED->OBJECTED; Objection PENDING"]

  - method: POST
    path: "/objections/{id}/uphold"
    description: "Regulator upholds an objection and revises the allocation"
    roles: [Regulator]
    code: 200
    input: [revised_total_quota]
    output: Objection
    side_effects: ["Objection PENDING->UPHELD; Allocation OBJECTED->REVISED with recomputed free/paid"]

  - method: POST
    path: "/objections/{id}/reject"
    description: "Regulator rejects an objection"
    roles: [Regulator]
    code: 200
    input: []
    output: Objection
    side_effects: ["Objection PENDING->REJECTED; Allocation OBJECTED->PUBLISHED"]

  - method: POST
    path: "/allocation-cycles/{id}/finalize"
    description: "Finalize cycle after objection_deadline; cascades quota into enterprise balances"
    roles: [Regulator]
    code: 200
    input: ["version?"]
    output: AllocationCycle
    side_effects: ["Cycle OBJECTION_OPEN->FINALIZED; each Allocation->FINALIZED; Enterprise quota_balance/paid_quota_balance increased; account_status PENDING->OPEN; AuditLog per enterprise"]

  - method: POST
    path: "/allocation-cycles/{id}/settle"
    description: "Run annual settlement: reconcile balances, compute carry/repurchase/deficit"
    roles: [Regulator]
    code: 200
    input: []
    output: AllocationCycle
    side_effects: ["Cycle COMPLIANCE_OPEN->SETTLED; AnnualSettlement created per enterprise via calc_annual_settlement"]

  - method: POST
    path: "/allocation-cycles/{id}/close"
    description: "Close cycle once all settlements and penalties paid"
    roles: [Regulator]
    code: 200
    input: []
    output: AllocationCycle
    side_effects: ["Cycle SETTLED->CLOSED"]

  - method: GET
    path: "/allocation-cycles/{id}"
    description: "Read cycle"
    roles: [Regulator, Enterprise]
    code: 200
    input: []
    output: AllocationCycle
    side_effects: []

  # ----- Emission Report -----
  - method: POST
    path: "/enterprises/{id}/emission-reports"
    description: "Create a draft emission report (a new version if one already exists for cycle_year)"
    roles: [Enterprise]
    code: 201
    input: [cycle_year]
    output: EmissionReport
    side_effects: ["Compute submission_deadline = cycle.compliance_deadline - 90d; version = previous + 1; previous.is_current_version=false"]

  - method: POST
    path: "/emission-reports/{id}/lines"
    description: "Add an emission data line"
    roles: [Enterprise]
    code: 201
    input: [source_category, activity_data, emission_factor, "supporting_document_id?"]
    output: EmissionDataLine
    side_effects: ["source_amount computed; recompute report.total_reported_emissions"]

  - method: POST
    path: "/emission-reports/{id}/documents"
    description: "Upload a supporting document"
    roles: [Enterprise]
    code: 201
    input: [document_type, file_uri]
    output: SupportingDocument
    side_effects: ["report.supporting_document_count += 1"]

  - method: POST
    path: "/emission-reports/{id}/submit"
    description: "Submit emission report for verification"
    roles: [Enterprise]
    code: 200
    input: ["version?"]
    output: EmissionReport
    side_effects: ["Report DRAFT->SUBMITTED; recompute total_reported_emissions"]

  - method: POST
    path: "/emission-reports/{id}/assign-verifier"
    description: "Regulator assigns a third-party verifier and schedules visit"
    roles: [Regulator]
    code: 201
    input: [agency_id, scheduled_visit_at]
    output: VerificationAssignment
    side_effects: ["Report SUBMITTED->UNDER_VERIFICATION; Assignment ASSIGNED"]

  - method: POST
    path: "/verification-assignments/{id}/complete-onsite"
    description: "Verifier records on-site completion with adjusted line amounts"
    roles: [VerifierAgency]
    code: 200
    input: ["line_adjustments[]: {line_id, verified_amount}"]
    output: VerificationAssignment
    side_effects: ["Assignment ASSIGNED->ON_SITE_DONE; per-line verified_amount stored; cross_check_delta_pct computed"]

  - method: POST
    path: "/verification-assignments/{id}/issue-report"
    description: "Verifier issues final verification report"
    roles: [VerifierAgency]
    code: 200
    input: []
    output: VerificationAssignment
    side_effects: ["Assignment ON_SITE_DONE->REPORT_ISSUED; Report UNDER_VERIFICATION->VERIFIED; total_verified_emissions written"]

  - method: POST
    path: "/emission-reports/{id}/dispute"
    description: "Enterprise disputes verification within 14 days"
    roles: [Enterprise]
    code: 200
    input: [ground]
    output: EmissionReport
    side_effects: ["Report VERIFIED->DISPUTED; Assignment REPORT_ISSUED->DISPUTED"]

  - method: POST
    path: "/verification-assignments/{id}/resolve-dispute"
    description: "Regulator resolves dispute"
    roles: [Regulator]
    code: 200
    input: ["adjusted_total_verified_emissions?"]
    output: VerificationAssignment
    side_effects: ["Assignment DISPUTED->RESOLVED; Report DISPUTED->VERIFIED; optionally updated total_verified_emissions"]

  - method: POST
    path: "/emission-reports/{id}/finalize"
    description: "Lock verified report"
    roles: [Regulator]
    code: 200
    input: []
    output: EmissionReport
    side_effects: ["Report VERIFIED->FINALIZED"]

  - method: POST
    path: "/emission-reports/{id}/reject"
    description: "Reject a submitted report (template violation)"
    roles: [Regulator]
    code: 200
    input: [reason]
    output: EmissionReport
    side_effects: ["Report SUBMITTED->REJECTED"]

  - method: GET
    path: "/emission-reports/{id}"
    description: "Read emission report including lines and verified totals"
    roles: [Regulator, Enterprise, VerifierAgency]
    code: 200
    input: []
    output: EmissionReport
    side_effects: []

  # ----- Trading -----
  - method: POST
    path: "/trading-orders"
    description: "Place a trading order; matching is attempted immediately"
    roles: [Enterprise]
    code: 201
    input: [enterprise_id, side, instrument, order_type, quantity, "limit_price?", channel]
    output: TradingOrder
    side_effects: ["Matching engine runs price-time priority for EXCHANGE; BLOCK requires counterparty acceptance; OTC settled directly. Trade(s) may be created with calc_trade_fee. Balances updated; AuditLogEntry per Trade."]

  - method: POST
    path: "/trading-orders/{id}/cancel"
    description: "Cancel an open or partially-filled order"
    roles: [Enterprise]
    code: 200
    input: ["version?"]
    output: TradingOrder
    side_effects: ["Order ->CANCELLED"]

  - method: GET
    path: "/trading-orders/{id}"
    description: "Read order"
    roles: [Regulator, Enterprise]
    code: 200
    input: []
    output: TradingOrder
    side_effects: []

  - method: GET
    path: "/trades"
    description: "List trades (paginated; filter by enterprise_id, instrument, channel, executed_after, executed_before)"
    roles: [Regulator, Enterprise]
    code: 200
    input: ["limit?", "offset?", "enterprise_id?", "instrument?", "channel?", "executed_after?", "executed_before?"]
    output: "Trade[]"
    side_effects: []

  # ----- Compliance & Penalty -----
  - method: POST
    path: "/enterprises/{id}/compliance-declarations"
    description: "Create draft compliance declaration"
    roles: [Enterprise]
    code: 201
    input: [cycle_year]
    output: ComplianceDeclaration
    side_effects: []

  - method: POST
    path: "/compliance-declarations/{id}/submit"
    description: "Submit compliance declaration; retires offset balances and may trigger penalty"
    roles: [Enterprise]
    code: 200
    input: [declared_offset_quota, declared_offset_ccer, "declared_borrow_amount?", "declared_bank_amount?", "version?"]
    output: ComplianceDeclaration
    side_effects: ["calc_compliance_balance; retire balances; if deficit -> NON_COMPLIANT, create PenaltyOrder via calc_penalty_amount; if no deficit -> COMPLIANT; AuditLog"]

  - method: POST
    path: "/penalty-orders/{id}/pay"
    description: "Pay a penalty order"
    roles: [Enterprise]
    code: 200
    input: ["version?"]
    output: PenaltyOrder
    side_effects: ["Penalty UNPAID->PAID; Declaration NON_COMPLIANT->PENALIZED; pending_deduction recorded; AuditLog with external_system=BANK"]

  - method: GET
    path: "/penalty-orders/{id}"
    description: "Read penalty order"
    roles: [Regulator, Enterprise]
    code: 200
    input: []
    output: PenaltyOrder
    side_effects: []

  # ----- Settlement & Audit -----
  - method: GET
    path: "/annual-settlements"
    description: "List annual settlements (filter by enterprise_id, cycle_year)"
    roles: [Regulator, Enterprise]
    code: 200
    input: ["limit?", "offset?", "enterprise_id?", "cycle_year?"]
    output: "AnnualSettlement[]"
    side_effects: []

  - method: GET
    path: "/audit-logs"
    description: "List audit log entries (filter by enterprise_id, subject_type, action, occurred_after, occurred_before)"
    roles: [Regulator]
    code: 200
    input: ["limit?", "offset?", "enterprise_id?", "subject_type?", "action?", "occurred_after?", "occurred_before?"]
    output: "AuditLogEntry[]"
    side_effects: []

  # ----- Test driver endpoints (required per §1.5 testability principle) -----
  - method: POST
    path: "/_clock/advance"
    description: "Advance the system clock to ISO timestamp; required for testing time-windowed transitions and OVERDUE/auto-transitions"
    roles: [Regulator]
    code: 200
    input: [target_timestamp]
    output: "{ now: ISO8601 }"
    side_effects: ["System now() updated; sweep is NOT auto-run"]

  - method: POST
    path: "/_sweep/run"
    description: "Run periodic sweep: marks PenaltyOrder OVERDUE if past due, transitions cycle status if deadlines reached"
    roles: [Regulator]
    code: 200
    input: []
    output: "{ swept_count: integer }"
    side_effects: ["PenaltyOrder UNPAID->OVERDUE for past-due; AuditLogEntry per state change"]

  - method: POST
    path: "/_events/emit"
    description: "Emit a synthetic event from external system (BANK, REGULATOR, ENERGY_DATA) for event-driven sync testing"
    roles: [Regulator]
    code: 201
    input: [external_system, event_type, payload]
    output: AuditLogEntry
    side_effects: ["AuditLogEntry(subject_type=EXTERNAL_SYNC, external_system=...) appended; if event_type=BANK_PAYMENT_CONFIRMED and payload.penalty_id matches an UNPAID PenaltyOrder, marks it PAID (idempotent on duplicate event_id)"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_AUTH_REQUIRED
    http: 401
    condition: "Missing or empty X-User-ID / X-User-Role header"

  - id: ERR_FORBIDDEN
    http: 403
    condition: "Role not permitted for this endpoint per RBAC matrix"

  - id: ERR_OWNERSHIP_VIOLATION
    http: 403
    condition: "Acting Enterprise does not own the target resource (enterprise_id mismatch)"

  - id: ERR_NOT_FOUND
    http: 404
    condition: "Path resource does not exist"

  - id: ERR_INVALID_STATE
    http: 409
    condition: "Target resource is not in a state that permits the requested action"

  - id: ERR_STALE_VERSION
    http: 409
    condition: "Client-supplied version does not match server version (OCC)"

  - id: ERR_OBJECTION_ALREADY_PENDING
    http: 409
    condition: "An Objection on this Allocation is already in PENDING state"

  - id: ERR_DECLARATION_ALREADY_SUBMITTED
    http: 409
    condition: "A ComplianceDeclaration for (enterprise, cycle_year) was already submitted"

  - id: ERR_INSUFFICIENT_BALANCE
    http: 409
    condition: "Enterprise lacks sufficient quota / paid_quota / CCER balance for the requested operation (retirement, SELL placement, trade settlement)"

  - id: ERR_PENALTY_OVERDUE
    http: 409
    condition: "PenaltyOrder is OVERDUE; pay action rejected"

  - id: ERR_WINDOW_CLOSED
    http: 422
    condition: "Action attempted outside its declared time window (objection, submission, dispute, payment)"

  - id: ERR_VERIFIER_CONFLICT_OF_INTEREST
    http: 422
    condition: "Assigned verifier agency_id matches the enterprise being verified"

  - id: ERR_SUPPORTING_DOCUMENT_REQUIRED
    http: 422
    condition: "EmissionDataLine with source_category in {FUEL, PROCESS} missing supporting_document_id"

  - id: ERR_CCER_CAP_EXCEEDED
    http: 422
    condition: "declared_offset_ccer exceeds cycle.ccer_cap_pct * verified_emissions"

  - id: ERR_BORROW_CAP_EXCEEDED
    http: 422
    condition: "declared_borrow_amount exceeds 5% of verified_emissions"

  - id: ERR_INVALID_ORDER
    http: 422
    condition: "Order has non-positive quantity, missing limit_price for LIMIT, or limit_price set for MARKET"

  - id: ERR_INVALID_RATIO
    http: 422
    condition: "free_paid_ratio not in [0, 1] or ccer_cap_pct not in [0, 0.20]"

  - id: ERR_INVALID_INPUT
    http: 422
    condition: "Generic structural input violation (missing required field, type mismatch)"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Regulator
    description: "Government regulator: defines cycles, allocations, assigns verifiers, adjudicates objections and disputes, runs settlement"
    identity: "opaque"
    exclusive_operations:
      - "POST /enterprises"
      - "POST /allocation-cycles"
      - "POST /allocation-cycles/{id}/allocations"
      - "POST /allocation-cycles/{id}/publish"
      - "POST /allocation-cycles/{id}/finalize"
      - "POST /allocation-cycles/{id}/settle"
      - "POST /allocation-cycles/{id}/close"
      - "POST /objections/{id}/uphold"
      - "POST /objections/{id}/reject"
      - "POST /emission-reports/{id}/assign-verifier"
      - "POST /emission-reports/{id}/finalize"
      - "POST /emission-reports/{id}/reject"
      - "POST /verification-assignments/{id}/resolve-dispute"
      - "GET /audit-logs"
      - "POST /_clock/advance"
      - "POST /_sweep/run"
      - "POST /_events/emit"
    shared_operations:
      - "GET /enterprises (and {id}, list)"
      - "GET /allocation-cycles/{id}"
      - "GET /emission-reports/{id}"
      - "GET /trading-orders/{id}"
      - "GET /trades"
      - "GET /penalty-orders/{id}"
      - "GET /annual-settlements"

  - name: Enterprise
    description: "Carbon-market participant: files emission reports, places trades, declares compliance, pays penalties"
    identity: "entity_backed:Enterprise"
    exclusive_operations:
      - "POST /allocations/{id}/objections (only by allocation owner)"
      - "POST /enterprises/{id}/emission-reports (only on own)"
      - "POST /emission-reports/{id}/lines (only on own report)"
      - "POST /emission-reports/{id}/documents (only on own report)"
      - "POST /emission-reports/{id}/submit (only on own)"
      - "POST /emission-reports/{id}/dispute (only on own)"
      - "POST /trading-orders (only as own enterprise_id)"
      - "POST /trading-orders/{id}/cancel (only on own order)"
      - "POST /enterprises/{id}/compliance-declarations (only on own)"
      - "POST /compliance-declarations/{id}/submit (only on own)"
      - "POST /penalty-orders/{id}/pay (only on own)"
    shared_operations:
      - "GET /enterprises/{id} (only own)"
      - "GET /allocation-cycles/{id}"
      - "GET /emission-reports/{id} (only own)"
      - "GET /trading-orders/{id} (only own)"
      - "GET /trades (filtered to own)"
      - "GET /penalty-orders/{id} (only own)"
      - "GET /annual-settlements (filtered to own)"

  - name: VerifierAgency
    description: "Third-party verification agency: conducts on-site verification and issues reports for assigned reports"
    identity: "opaque"
    exclusive_operations:
      - "POST /verification-assignments/{id}/complete-onsite (only when assigned)"
      - "POST /verification-assignments/{id}/issue-report (only when assigned)"
    shared_operations:
      - "GET /emission-reports/{id} (only when assigned via VerificationAssignment)"
