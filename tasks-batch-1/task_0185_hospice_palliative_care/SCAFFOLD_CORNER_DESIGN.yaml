              payload: { provider_id: "${prov_id}", patient_name: "Cert Pt", election_date: "2026-01-01T00:00:00Z", attending_physician_id: "ext-att-c28" }
              as: IntakeCoordinator
              captures: { e_id: $.data.id, e_ver: $.data.version }
          trigger:
            - call: "POST /hospice/certifications"
              payload: { election_id: "${e_id}", period_sequence: 1, certifying_physician_id: "${doc_id}", narrative_present: true, expected_election_version: "${e_ver}", commit: true }
              as: Physician
              as_user_id: "${doc_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_CERTIFICATION_INCOMPLETE"

  # =========================================================================
  # Endpoints
  # =========================================================================
  - section: endpoints
    instances:
      - name: bereavement_close_action_endpoint
        claim_type: Action endpoint
        grounds:
          - endpoints["POST /hospice/bereavement-cases/{id}/close"]
          - state_machines.BereavementCase.OPEN_to_CLOSED
        distinguishing_aspect: "POST /bereavement-cases/{id}/close transitions an OPEN case to CLOSED and returns 200."
        test_recipe:
          setup:
            - "Death-discharged election with an OPEN bereavement case."
          setup_api_calls:
            - call: "POST /hospice/providers"
              payload: { name: "EpClose Hospice", cap_year_start: "2026-01-01T00:00:00Z", per_beneficiary_cap_cents: 3490000 }
              as: BillingAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: BillingAdmin
            - call: "POST /hospice/elections"
              payload: { provider_id: "${prov_id}", patient_name: "EpClose Pt", election_date: "2026-01-01T00:00:00Z", attending_physician_id: "ext-att-c29" }
              as: IntakeCoordinator
              captures: { e_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-05T00:00:00Z" }
              as: BillingAdmin
            - call: "POST /hospice/elections/${e_id}/discharge"
              payload: { discharge_date: "2026-01-05T00:00:00Z", discharge_reason: "DEATH" }
              as: ClinicalManager
            - call: "POST /hospice/bereavement-cases"
              payload: { election_id: "${e_id}", enrolled_date: "2026-01-06T00:00:00Z" }
              as: ClinicalManager
              captures: { bc_id: $.data.id }
          trigger:
            - call: "POST /hospice/bereavement-cases/${bc_id}/close"
              payload: {}
              as: ClinicalManager
              captures: { st: $.data.status }
          assert:
            - "BereavementCase.${bc_id}.status == CLOSED"

      - name: careplan_coverage_items_reverse_lookup
        claim_type: Computed read
        grounds:
          - endpoints["GET /hospice/care-plans/{id}/coverage-items"]
          - entities.CoverageItem.fields.care_plan_id
        distinguishing_aspect: "GET /care-plans/{id}/coverage-items returns the array of coverage items ordered under that plan revision (FK reverse lookup)."
        test_recipe:
          setup:
            - "Election with ACTIVE plan and one covered DME item under it."
          setup_api_calls:
            - call: "POST /hospice/providers"
              payload: { name: "EpRev Hospice", cap_year_start: "2026-01-01T00:00:00Z", per_beneficiary_cap_cents: 3490000 }
              as: BillingAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: BillingAdmin
            - call: "POST /hospice/elections"
              payload: { provider_id: "${prov_id}", patient_name: "Rev Pt", election_date: "2026-01-01T00:00:00Z", attending_physician_id: "ext-att-c30" }
              as: IntakeCoordinator
              captures: { e_id: $.data.id, e_ver: $.data.version }
            - call: "POST /hospice/care-plans"
              payload: { election_id: "${e_id}", idg_members: ["PHYSICIAN","NURSE","SOCIAL_WORK","COUNSELOR"], expected_election_version: "${e_ver}" }
              as: ClinicalManager
              captures: { plan_id: $.data.id }
            - call: "POST /hospice/coverage-items"
              payload: { election_id: "${e_id}", care_plan_id: "${plan_id}", item_type: "DME", related_to_terminal_dx: true }
              as: ClinicalManager
              captures: { ci_id: $.data.id }
          trigger:
            - call: "GET /hospice/care-plans/${plan_id}/coverage-items"
              payload: {}
              as: ClinicalManager
          assert:
            - "response_type == array"
            - "data array length == 1"
            - "data[0].id == ${ci_id}"

  # =========================================================================
  # Errors
  # =========================================================================
  - section: errors
    instances:
      - name: unauthenticated_missing_headers_returns_401
        claim_type: violation_to_error
        grounds:
          - errors[ERR_UNAUTHENTICATED]
          - validations[priority=1]
          - endpoints["GET /hospice/elections"]
        distinguishing_aspect: "A request with no X-User-Role / X-User-ID headers returns ERR_UNAUTHENTICATED (401)."
        test_recipe:
          setup:
            - "Empty DB; request sent with no auth headers."
          setup_api_calls: []
          trigger:
            - call: "GET /hospice/elections"
              payload: {}
              as: Anonymous
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_UNAUTHENTICATED"

      - name: duplicate_care_day_already_covered_by_difficulty
        claim_type: violation_to_error
        grounds:
          - errors[ERR_DUPLICATE_CARE_DAY]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / duplicate_care_day_same_service_date
          rationale: "ERR_DUPLICATE_CARE_DAY is asserted as the failure path of the named §1.8 overlap instance."

  # =========================================================================
  # RBAC
  # =========================================================================
  - section: rbac
    instances:
      - name: intake_coordinator_cannot_post_care_days
        claim_type: forbidden_operation
        grounds:
          - roles.IntakeCoordinator
          - roles.ClinicalManager
          - endpoints["POST /hospice/care-days"]
          - errors[ERR_FORBIDDEN_ROLE]
        distinguishing_aspect: "IntakeCoordinator calling POST /care-days (a ClinicalManager-exclusive op) returns ERR_FORBIDDEN_ROLE (403)."
        test_recipe:
          setup:
            - "Election elected 2026-01-02; clock 2026-01-02."
          setup_api_calls:
            - call: "POST /hospice/providers"
              payload: { name: "RbacCd Hospice", cap_year_start: "2026-01-01T00:00:00Z", per_beneficiary_cap_cents: 3490000 }
              as: BillingAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-02T00:00:00Z" }
              as: BillingAdmin
            - call: "POST /hospice/elections"
              payload: { provider_id: "${prov_id}", patient_name: "RbacCd Pt", election_date: "2026-01-02T00:00:00Z", attending_physician_id: "ext-att-c31" }
              as: IntakeCoordinator
              captures: { e_id: $.data.id }
          trigger:
            - call: "POST /hospice/care-days"
              payload: { election_id: "${e_id}", service_date: "2026-01-02T00:00:00Z", level_of_care: "GIP", high_intensity: false }
              as: IntakeCoordinator
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_FORBIDDEN_ROLE"

      - name: clinical_manager_cannot_settle_cap
        claim_type: forbidden_operation
        grounds:
          - roles.ClinicalManager
          - roles.BillingAdmin
          - endpoints["POST /hospice/providers/{id}/settle-cap"]
          - errors[ERR_FORBIDDEN_ROLE]
        distinguishing_aspect: "ClinicalManager calling POST /providers/{id}/settle-cap (a BillingAdmin-exclusive op) returns ERR_FORBIDDEN_ROLE (403)."
        test_recipe:
          setup:
            - "Provider exists; clock 2026-01-02."
          setup_api_calls:
            - call: "POST /hospice/providers"
              payload: { name: "RbacSettle Hospice", cap_year_start: "2026-01-01T00:00:00Z", per_beneficiary_cap_cents: 3490000 }
              as: BillingAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-02T00:00:00Z" }
              as: BillingAdmin
          trigger:
            - call: "POST /hospice/providers/${prov_id}/settle-cap"
              payload: {}
              as: ClinicalManager
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_FORBIDDEN_ROLE"

      - name: physician_cannot_create_election
        claim_type: forbidden_operation
        grounds:
          - roles.Physician
          - roles.IntakeCoordinator
          - endpoints["POST /hospice/elections"]
          - errors[ERR_FORBIDDEN_ROLE]
        distinguishing_aspect: "Physician calling POST /elections (an IntakeCoordinator-exclusive op) returns ERR_FORBIDDEN_ROLE (403)."
        test_recipe:
          setup:
            - "Provider exists; a registered physician; clock 2026-01-01."
          setup_api_calls:
            - call: "POST /hospice/providers"
              payload: { name: "RbacElect Hospice", cap_year_start: "2026-01-01T00:00:00Z", per_beneficiary_cap_cents: 3490000 }
              as: BillingAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /hospice/physicians"
              payload: { full_name: "Dr RBAC", is_medical_director: true }
              as: ClinicalManager
              captures: { md_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: BillingAdmin
          trigger:
            - call: "POST /hospice/elections"
              payload: { provider_id: "${prov_id}", patient_name: "Blocked Pt", election_date: "2026-01-01T00:00:00Z", attending_physician_id: "ext-att-c32" }
              as: Physician
              as_user_id: "${md_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_FORBIDDEN_ROLE"

  # =========================================================================
  # Cross-Cutting Complexity Layers
  # =========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: careplan_supersede_stale_election_occ
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[careplan-supersede-stale-election]
          - entities.Election.fields.version
          - errors[ERR_STALE_ELECTION_VERSION]
          - endpoints["POST /hospice/care-plans"]
        distinguishing_aspect: "Committing a second CarePlan revision with a stale expected_election_version (the value observed before the first revision bumped the version) returns ERR_STALE_ELECTION_VERSION (412)."
        test_recipe:
          setup:
            - "Election elected 2026-01-01; one CarePlan revision committed (Election.version advanced)."
          setup_api_calls:
            - call: "POST /hospice/providers"
              payload: { name: "OccCp Hospice", cap_year_start: "2026-01-01T00:00:00Z", per_beneficiary_cap_cents: 3490000 }
              as: BillingAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: BillingAdmin
            - call: "POST /hospice/elections"
              payload: { provider_id: "${prov_id}", patient_name: "OccCp Pt", election_date: "2026-01-01T00:00:00Z", attending_physician_id: "ext-att-c33" }
              as: IntakeCoordinator
              captures: { e_id: $.data.id, e_ver0: $.data.version }
            - call: "POST /hospice/care-plans"
              payload: { election_id: "${e_id}", idg_members: ["PHYSICIAN","NURSE","SOCIAL_WORK","COUNSELOR"], expected_election_version: "${e_ver0}" }
              as: ClinicalManager
              captures: { plan1_id: $.data.id }
          trigger:
            - call: "POST /hospice/care-plans"
              payload: { election_id: "${e_id}", supersedes_plan_id: "${plan1_id}", idg_members: ["PHYSICIAN","NURSE","SOCIAL_WORK","COUNSELOR"], expected_election_version: "${e_ver0}" }
              as: ClinicalManager
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_STALE_ELECTION_VERSION"

      - name: certify_stale_election_version_occ
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[cert-create-stale-election]
          - entities.Election.fields.version
          - errors[ERR_STALE_ELECTION_VERSION]
          - endpoints["POST /hospice/certifications"]
        distinguishing_aspect: "Committing a period-2 certification carrying the pre-certification election version (stale by one after period 1's commit bumped it) returns ERR_STALE_ELECTION_VERSION (412)."
        test_recipe:
          setup:
            - "Election elected 2026-01-01; medical-director physician; period 1 certified (version advanced)."
          setup_api_calls:
            - call: "POST /hospice/providers"
              payload: { name: "OccCert Hospice", cap_year_start: "2026-01-01T00:00:00Z", per_beneficiary_cap_cents: 3490000 }
              as: BillingAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /hospice/physicians"
              payload: { full_name: "Dr Occ", is_medical_director: true }
              as: ClinicalManager
              captures: { md_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: BillingAdmin
            - call: "POST /hospice/elections"
              payload: { provider_id: "${prov_id}", patient_name: "Occ Pt", election_date: "2026-01-01T00:00:00Z", attending_physician_id: "ext-att-c34" }
              as: IntakeCoordinator
              captures: { e_id: $.data.id, e_ver0: $.data.version }
            - call: "POST /hospice/certifications"
              payload: { election_id: "${e_id}", period_sequence: 1, certifying_physician_id: "${md_id}", narrative_present: true, expected_election_version: "${e_ver0}", commit: true }
              as: Physician
              as_user_id: "${md_id}"
          trigger:
            - call: "POST /hospice/certifications"
              payload: { election_id: "${e_id}", period_sequence: 2, certifying_physician_id: "${md_id}", narrative_present: true, expected_election_version: "${e_ver0}", commit: true }
              as: Physician
              as_user_id: "${md_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response_type == error"
            - "data.error_id == ERR_STALE_ELECTION_VERSION"

      - name: version_increments_on_certify
        claim_type: derived_field_reconciliation
        grounds:
          - entities.Election.fields.version
          - state_machines.Election.ELECTED_to_ELECTED
          - endpoints["POST /hospice/certifications"]
        distinguishing_aspect: "A successful period-1 certify increments Election.version from 1 to 2 (every mutation bumps version by 1)."
        test_recipe:
          setup:
            - "Election elected 2026-01-01 (version 1); medical-director physician."
          setup_api_calls:
            - call: "POST /hospice/providers"
              payload: { name: "VerInc Hospice", cap_year_start: "2026-01-01T00:00:00Z", per_beneficiary_cap_cents: 3490000 }
              as: BillingAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /hospice/physicians"
              payload: { full_name: "Dr Ver", is_medical_director: true }
              as: ClinicalManager
              captures: { md_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00Z" }
              as: BillingAdmin
            - call: "POST /hospice/elections"
              payload: { provider_id: "${prov_id}", patient_name: "Ver Pt", election_date: "2026-01-01T00:00:00Z", attending_physician_id: "ext-att-c35" }
              as: IntakeCoordinator
              captures: { e_id: $.data.id, e_ver0: $.data.version }
          trigger:
            - call: "POST /hospice/certifications"
              payload: { election_id: "${e_id}", period_sequence: 1, certifying_physician_id: "${md_id}", narrative_present: true, expected_election_version: "${e_ver0}", commit: true }
              as: Physician
              as_user_id: "${md_id}"
          assert:
            - "Election.${e_id}.version == 2"

  # =========================================================================
  # Consistency Model
  # =========================================================================
  - section: consistency_model
    instances:
      - name: cap_ledger_visible_immediately_in_same_response
        claim_type: immediate
        grounds:
          - calculations.provisional_cap_liability
          - entities.Provider.fields.total_paid_cents
          - endpoints["POST /hospice/care-days"]
          - endpoints["GET /hospice/providers/{id}/cap-summary"]
        distinguishing_aspect: "Immediately after a GIP care-day post, GET /providers/{id}/cap-summary shows total_paid_cents 110000 with no lag (immediate consistency)."
        test_recipe:
          setup:
            - "Provider; election elected 2026-01-02; clock 2026-01-02."
          setup_api_calls:
            - call: "POST /hospice/providers"
              payload: { name: "ConsImm Hospice", cap_year_start: "2026-01-01T00:00:00Z", per_beneficiary_cap_cents: 3490000 }
              as: BillingAdmin
              captures: { prov_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-02T00:00:00Z" }
              as: BillingAdmin
            - call: "POST /hospice/elections"
              payload: { provider_id: "${prov_id}", patient_name: "Imm Pt", election_date: "2026-01-02T00:00:00Z", attending_physician_id: "ext-att-c36" }
              as: IntakeCoordinator
              captures: { e_id: $.data.id }
            - call: "POST /hospice/care-days"
              payload: { election_id: "${e_id}", service_date: "2026-01-02T00:00:00Z", level_of_care: "GIP", high_intensity: false }
              as: ClinicalManager
          trigger:
            - call: "GET /hospice/providers/${prov_id}/cap-summary"
              payload: {}
              as: BillingAdmin
          assert:
            - "Provider.${prov_id}.total_paid_cents == 110000"
