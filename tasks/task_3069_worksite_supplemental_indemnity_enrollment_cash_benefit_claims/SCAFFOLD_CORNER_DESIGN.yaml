            - { call: "POST /benefit-counselors", payload: { license_id: "LIC-GD2", full_name: "CGD2", home_state: "TX" }, as: CarrierAdmin, captures: { cd2: $.data.id } }
            - { call: "POST /policy-series", payload: { series_code: "SD2", product_line: "ACCIDENT" }, as: CarrierAdmin, captures: { sd2: $.data.id, sd2_v: $.data.version } }
            - { call: "POST /benefit-schedules", payload: { policy_series_id: "${sd2}", schedule_version: 1, effective_date: "2026-01-01T00:00:00Z", benefit_items: [{ event_code: "D2", benefit_amount_cents: 100, max_occurrences_per_year: 1, lifetime_max_cents: 1000 }], monthly_premium_cents: 100, wellness_benefit_cents: 50, wellness_waiting_months: 0, preexisting_exclusion_months: 0 }, as: CarrierAdmin, captures: { schd2: $.data.id } }
            - { call: "POST /benefit-schedules/${schd2}/publish", payload: { expected_series_version: "${sd2_v}" }, as: CarrierAdmin }
            - { call: "POST /policy-series/${sd2}/activate", payload: {}, as: CarrierAdmin }
