      - name: activating_an_already_active_agreement_is_refused
        claim_type: precondition_enforcement
        grounds:
          - state_machines.ConsignmentAgreement.transitions.DRAFT_to_ACTIVE.preconditions
          - validations[priority 40]
          - errors[ERR_AGREEMENT_STATE_INVALID]
        distinguishing_aspect: "The DRAFT -> ACTIVE transition declares the precondition status == DRAFT; a second activate answers ERR_AGREEMENT_STATE_INVALID with HTTP 409 and does NOT re-stamp effective_at, expires_at, approved_by_user_id or version."
        test_recipe:
          setup:
            - "a STD-2026 schedule with one step, consignor Alpha, and an agreement already activated by mgr-1 at 2026-08-01T00:00:00Z"
          setup_api_calls:
            - call: "POST /price-schedules"
              payload: { name: "STD-2026", unsold_trigger_day: 120, election_window_days: 14 }
              as: GalleryManager
              as_user_id: "mgr-1"
              captures: { sched_id: $.data.id }
            - call: "POST /price-schedule-steps"
              payload: { schedule_id: "${sched_id}", sequence: 1, start_day_offset: 0, markdown_pct: 0.00, min_price_cents: 0 }
              as: GalleryManager
              as_user_id: "mgr-1"
