            - call: "POST /disclosure/dissemination-engagements"
              payload: { undertaking_id: "${und_id}", agent_name: "Summit Disclosure Agents", effective_date: "2026-08-01", expiration_date: "2027-12-31", retainer_cents: 400000, last_calendar_ack_date: "2026-08-01", expected_undertaking_version: "${und_v}" }
              as: FinanceDirector
              as_user_id: "fd-1"
              captures: { eng_id: "$.data.id", billable0: "$.data.billable_filing_count", invoice0: "$.data.invoice_total_cents" }
            - call: "POST /disclosure/material-event-notices"
              payload: { issue_id: "${issue_id}", event_type: "BOND_CALL", occurrence_date: "2026-08-01" }
              as: DisclosureOfficer
