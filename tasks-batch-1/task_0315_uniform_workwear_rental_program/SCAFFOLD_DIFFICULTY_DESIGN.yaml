  # ===========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: on_hold_account_beats_wearer_not_active_on_assignment
        grounds:
          - validations[priority=6]
          - validations[priority=7]
          - errors[ERR_ACCOUNT_ON_HOLD]
          - errors[ERR_WEARER_NOT_ACTIVE]
        distinguishing_aspect: |
          Category pair business_safety (priority 6, ERR_ACCOUNT_ON_HOLD) vs business_constraint
          (priority 7, ERR_WEARER_NOT_ACTIVE): an assignment to a RAMP_DOWN wearer on an ON_HOLD account
          violates both; priority 6 wins so ERR_ACCOUNT_ON_HOLD is returned.
        test_recipe:
          setup:
            - "Account driven ON_HOLD (outstanding>50000 via a 60000 LOSS, then place-hold); a wearer ramped down; an IN_STOCK garment available."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { legal_name: "Acme I", service_day: "THU", shortage_grace_units: 0 }
              as: ProgramAdmin
              captures: { acct: $.data.id }
            - call: "POST /garment-types"
              payload: { sku: "COV-I", category: "COVERALL", weekly_rate_cents: 1000, replacement_cost_cents: 60000, emblem_setup_cents: 0 }
              as: ProgramAdmin
              captures: { gtc: $.data.id }
            - call: "POST /garment-types"
              payload: { sku: "SHIRT-I", category: "SHIRT", weekly_rate_cents: 1000, replacement_cost_cents: 8000, emblem_setup_cents: 0 }
              as: ProgramAdmin
              captures: { gts: $.data.id }
            - call: "POST /accounts/${acct}/wearers"
              payload: { full_name: "Ivy", shirt_size: "M", pant_size: 30, locker_label: "L1" }
              as: AccountManager
              captures: { wr_lost: $.data.id }
            - call: "POST /accounts/${acct}/wearers"
              payload: { full_name: "Ike", shirt_size: "L", pant_size: 34, locker_label: "L2" }
              as: AccountManager
              captures: { wr_rd: $.data.id }
            - call: "POST /accounts/${acct}/garments"
              payload: { garment_type_id: "${gtc}", tag_code: "TC" }
              as: ProgramAdmin
              captures: { gc: $.data.id }
            - call: "POST /accounts/${acct}/garments"
              payload: { garment_type_id: "${gts}", tag_code: "TS" }
              as: ProgramAdmin
              captures: { gs: $.data.id }
            - call: "POST /assignments"
              payload: { garment_id: "${gc}", wearer_id: "${wr_lost}" }
              as: AccountManager
              captures: { a_lost: $.data.id }
            - call: "POST /assignments/${a_lost}/declare-loss"
              payload: {}
              as: AccountManager
            - call: "POST /accounts/${acct}/place-hold"
              payload: {}
              as: ProgramAdmin
            - call: "POST /wearers/${wr_rd}/ramp-down"
              payload: {}
              as: AccountManager
          trigger:
            - call: "POST /assignments"
              payload: { garment_id: "${gs}", wearer_id: "${wr_rd}" }
              as: AccountManager
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_ACCOUNT_ON_HOLD"
            - "HTTP status == 409"

      - name: invalid_state_beats_stale_version_on_reconcile
        grounds:
          - validations[priority=5]
          - validations[priority=13]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_STALE_VISIT_VERSION]
          - state_machines.ServiceVisit.DELIVERED_to_RECONCILED
        distinguishing_aspect: |
          Category pair state (priority 5, ERR_INVALID_STATE) vs business_fiscal (priority 13/OCC,
          ERR_STALE_VISIT_VERSION): reconciling a still-SCHEDULED visit while ALSO passing a stale version
          violates both; the state precondition (priority 5) wins so ERR_INVALID_STATE is returned.
        test_recipe:
          setup:
            - "A visit left in SCHEDULED (never picked up/delivered); a stale expected version supplied."
          setup_api_calls:
            - call: "POST /accounts"
              payload: { legal_name: "Acme J", service_day: "FRI", shortage_grace_units: 0 }
              as: ProgramAdmin
              captures: { acct: $.data.id }
            - call: "POST /routes"
              payload: { route_code: "R-J", service_day: "FRI", driver_user_id: "drv-j" }
              as: ProgramAdmin
              captures: { rt: $.data.id }
            - call: "POST /routes/${rt}/stops"
              payload: { account_id: "${acct}", stop_sequence: 1, window_start_min: 480, window_end_min: 540 }
              as: ProgramAdmin
              captures: { stop: $.data.id }
            - call: "POST /route-stops/${stop}/service-visits"
              payload: { week_index: 0 }
              as: ProgramAdmin
              captures: { v: $.data.id, vver: $.data.version }
          trigger:
            - call: "POST /service-visits/${v}/reconcile"
              payload: { expected_service_visit_version: "${vver} - 1" }
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_INVALID_STATE"
            - "HTTP status == 409"

