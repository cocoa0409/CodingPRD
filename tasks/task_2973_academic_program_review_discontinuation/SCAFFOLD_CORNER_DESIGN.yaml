              as_user_id: "${rev_b}"
              captures: { e_read_report: $.data.error_id }
            - call: "GET /provost/reviewer-visits/${visit_a}/reports"
              payload: { limit: 10, offset: 0 }
              as: ExternalReviewer
              as_user_id: "${rev_a}"
            - call: "GET /provost/review-cycles/${cycle_a}/self-studies"
              payload: {}
              as: ProgramChair
              as_user_id: "${prog_a}"
          assert:
            - "${e_create} == ERR_NOT_PROGRAM_OWNER with HTTP 403 — the cycle resolves transitively to prog_a, not to the caller's own program id"
            - "${e_patch} == ERR_NOT_PROGRAM_OWNER with HTTP 403 and NOT ERR_SELF_STUDY_NOT_DRAFT — priority 4 answers before priority 20 would have objected that the study is ACCEPTED, so the wrong chair cannot even probe the study's state"
            - "${e_read} == ERR_NOT_PROGRAM_OWNER with HTTP 403 — the appointment list resolves to prog_a; ownership scoping applies to reads as well as writes"
            - "${e_cycle} == ERR_NOT_PROGRAM_OWNER with HTTP 403"
            - "${e_file} == ERR_NOT_ASSIGNED_REVIEWER with HTTP 403 — rev_b is a real reviewer, so this is not ERR_REVIEWER_NOT_FOUND (404); the visit's reviewer_id simply is not rev_b"
            - "the filing by rev_a returns 201 with sequence_number 1"
            - "${e_read_report} == ERR_NOT_ASSIGNED_REVIEWER with HTTP 403 — priority 5 covers the GET as well as the POST, so rev_b cannot read rev_a's report"
            - "the same GET as rev_a returns 200 with total_count 1 and recommendation DISCONTINUE"
            - "the self-study list as the OWNING chair returns 200 with total_count 1 and narrative \"History self-study\" — the refused PATCH changed nothing"

      - name: the_shared_read_surface_answers_every_role_that_declares_it
        claim_type: shared_operations
        grounds:
          - roles.ProgramChair.shared_operations
          - roles.ReviewCoordinator.shared_operations
          - roles.Provost.shared_operations
          - roles.Registrar.shared_operations
          - roles.HRPartner.shared_operations
          - validations[priority=3]
        distinguishing_aspect: |
          The same GET returns the same body to five different roles, and the
          clock endpoint is shared by all six — shared operations are not a
          watered-down view but literally the same response envelope. The one
          shared read that is NOT unconditional is the program-scoped one: a
          ProgramChair reading its own program succeeds where the identical call
          for another program is refused, which is priority 4 narrowing a shared
          operation rather than priority 3 blocking it.
        test_recipe:
          setup:
            - "One program with a decision-bearing cycle is not needed; a single program plus one review cycle is enough to exercise the shared read surface."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: HRPartner
            - call: "POST /provost/academic-programs"
              payload: { code: "HIST-BA", name: "History BA", degree_level: "UNDERGRADUATE", department_code: "HIST" }
