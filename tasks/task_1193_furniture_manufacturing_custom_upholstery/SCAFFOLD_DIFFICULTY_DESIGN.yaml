  # ---------------------------------------------------------------------------
  # Rule 6 — boundary_precision_check (different metrics, different endpoints)
  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: shortfall_boundary_exact_coverage
        grounds:
          - calculations.shortfall_evaluation
          - entities.OrderLine.fields.shortfall_yards
        distinguishing_aspect: |
          Metric = yardage; endpoint under test = POST /mill/material-lots/{id}/inspect
          (COM auto-allocation). Coverage is INCLUSIVE at the boundary: allocated 14.950 ==
          required 14.950 → ALLOCATED with shortfall 0.000, while 14.949 leaves
          shortfall_yards 0.001 and the line MATERIAL_SHORTFALL.
        test_recipe:
          setup:
            - "Logical clock at 2026-05-10T00:00:00Z; dealer; model M-PM (pattern match); COM spec FAB-COM-Z (width 54, repeat 9.0, STRAIGHT, credit 250)"
            - "Order ORD-B1 with COM line qty 4 (requirement 14.950) confirmed → MATERIAL_SHORTFALL; bound COM lot received exactly 14.950"
            - "Order ORD-B2 with identical COM line confirmed → MATERIAL_SHORTFALL; bound COM lot received exactly 14.949"
          setup_api_calls:
            - call: "POST /mill/_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-10T00:00:00Z" }
              as: PlantAdmin
            - call: "POST /mill/product-models"
              payload: { model_code: "M-PM", category: "SOFA", base_fabric_yards: 3.0, base_price_cents: 50000, requires_pattern_match: true, flammability_standard: "TB117_2013", required_component_codes: [], option_rules: [{ fabric_grade: "COM", finish_code: "ANY", allowed: true, surcharge_pct: 0.0, lead_time_adder_days: 0 }] }
              as: ProductionPlanner
              captures: { model_id: $.data.id }
            - call: "POST /mill/fabric-specs"
              payload: { fabric_code: "FAB-COM-Z", origin: "CUSTOMER", grade: "COM", nominal_width_inches: 54.0, pattern_repeat_v_inches: 9.0, match_method: "STRAIGHT", com_credit_per_yard_cents: 250 }
              as: ProductionPlanner
              captures: { spec_id: $.data.id }
            - call: "POST /mill/dealer-accounts"
              payload: { dealer_code: "DLR-001", name: "Blue Ridge Furniture", credit_limit_cents: 100000000, sample_allowance_cents: 5000000 }
              as: SalesRep
              captures: { dealer_id: $.data.id }
            - call: "POST /mill/customer-orders"
              payload: { order_number: "ORD-B1", dealer_id: "${dealer_id}", ship_to_state: "NC", delivery_method: "LTL_FREIGHT" }
              as: SalesRep
              captures: { order1: $.data.id }
            - call: "POST /mill/order-lines"
              payload: { order_id: "${order1}", model_id: "${model_id}", fabric_spec_id: "${spec_id}", fabric_source: "COM", finish_code: "ESPRESSO", quantity: 4 }
              as: SalesRep
              captures: { line1: $.data.id }
            - call: "POST /mill/customer-orders/${order1}/confirm"
              payload: {}
              as: SalesRep
            - call: "POST /mill/material-lots"
              payload: { fabric_spec_id: "${spec_id}", order_line_id: "${line1}", expected_yards: 14.95 }
              as: MaterialReceiver
              captures: { lot1: $.data.id }
            - call: "POST /mill/material-lots/${lot1}/receive"
              payload: { received_yards: 14.95 }
              as: MaterialReceiver
            - call: "POST /mill/customer-orders"
              payload: { order_number: "ORD-B2", dealer_id: "${dealer_id}", ship_to_state: "NC", delivery_method: "LTL_FREIGHT" }
              as: SalesRep
              captures: { order2: $.data.id }
            - call: "POST /mill/order-lines"
              payload: { order_id: "${order2}", model_id: "${model_id}", fabric_spec_id: "${spec_id}", fabric_source: "COM", finish_code: "ESPRESSO", quantity: 4 }
              as: SalesRep
              captures: { line2: $.data.id }
            - call: "POST /mill/customer-orders/${order2}/confirm"
              payload: {}
              as: SalesRep
            - call: "POST /mill/material-lots"
              payload: { fabric_spec_id: "${spec_id}", order_line_id: "${line2}", expected_yards: 14.949 }
              as: MaterialReceiver
              captures: { lot2: $.data.id }
            - call: "POST /mill/material-lots/${lot2}/receive"
              payload: { received_yards: 14.949 }
              as: MaterialReceiver
          trigger:
            - call: "POST /mill/material-lots/${lot1}/inspect"
              payload: { result: "PASS", usable_yards: 14.95, rejected_yards: 0.0, measured_width_inches: 54.0 }
              as: QualityInspector
              as_user_id: "qi-1"
            - call: "POST /mill/material-lots/${lot2}/inspect"
              payload: { result: "PASS", usable_yards: 14.949, rejected_yards: 0.0, measured_width_inches: 54.0 }
              as: QualityInspector
              as_user_id: "qi-1"
          assert:
            - "OrderLine.${line1}.allocated_yards == 14.950, shortfall_yards == 0.000, status == ALLOCATED (equality is sufficient)"
            - "CustomerOrder.${order1}.status == CONFIRMED"
            - "OrderLine.${line2}.allocated_yards == 14.949, shortfall_yards == 0.001, status == MATERIAL_SHORTFALL"
            - "CustomerOrder.${order2}.status == MATERIAL_HOLD"

