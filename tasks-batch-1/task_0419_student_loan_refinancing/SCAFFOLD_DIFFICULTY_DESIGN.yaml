  # =========================================================================
  # Rule 7 — Cross-entity state dependencies across different entity pairs
  # =========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: offer_lock_requires_cosigner_consented
        grounds:
          - validations[priority=7]
          - state_machines.Application.PREQUALIFIED_to_UNDER_REVIEW
          - entities.Cosigner.fields.consent_status
        distinguishing_aspect: |
          Entity pair Offer/Application -> Cosigner: locking an Offer (advancing the Application) is rejected with
          ERR_COSIGNER_NOT_CONSENTED while the attached Cosigner.consent_status == INVITED, proving the Offer
          transition depends on a different entity's (Cosigner) state.
        test_recipe:
          setup:
            - "An Application prequalified with a Cosigner still INVITED; one PRESENTED offer."
          setup_api_calls:
            - call: "POST /rate-grid-entries"
              payload: { rate_type: "FIXED", term_months: 120, min_fico_band: "NEAR_PRIME", base_apr_bps: 650, index_apr_bps: 0 }
              as: PlatformAdmin
            - call: "POST /borrowers"
              payload: { email: "b12@x.com", full_name: "B Twelve", annual_income_cents: 12000000, fico_band: "PRIME" }
              as: Borrower
              captures: { b12_id: $.data.id }
            - call: "POST /applications"
              payload: { borrower_id: "${b12_id}", requested_principal_cents: 5000000, requested_term_months: 120, requested_rate_type: "FIXED" }
              as: Borrower
              as_user_id: "${b12_id}"
              captures: { app12_id: $.data.id, app12_ver: $.data.version }
            - call: "POST /cosigners"
              payload: { application_id: "${app12_id}", cosigner_email: "c12@x.com", cosigner_annual_income_cents: 4000000 }
              as: Borrower
              as_user_id: "${b12_id}"
              captures: { cos12_id: $.data.id }
            - call: "POST /applications/${app12_id}/prequalify"
              payload: {}
              as: Borrower
              as_user_id: "${b12_id}"
            - call: "GET /offers"
              payload: { application_id: "${app12_id}" }
              as: Borrower
              as_user_id: "${b12_id}"
              captures: { offer12_id: "$.data[0].id"}
          trigger:
            - call: "POST /offers/${offer12_id}/lock"
              payload: { expected_application_version: "${app12_ver}", autopay_elected: true }
              as: Borrower
              as_user_id: "${b12_id}"
              captures: { err: $.data.error_id }
          assert:
            - "response error_id == ERR_COSIGNER_NOT_CONSENTED"
            - "Application.${app12_id}.status == PREQUALIFIED (transition blocked by Cosigner state)"

      - name: disbursement_send_requires_loan_current
        grounds:
          - state_machines.Disbursement.SCHEDULED_to_SENT
          - state_machines.Loan.CURRENT_to_FORBEARANCE
          - entities.Loan.fields.repayment_status
        distinguishing_aspect: |
          Entity pair Disbursement -> Loan (different from Offer->Cosigner): sending a Disbursement is rejected
          with ERR_INVALID_STATE when the parent Loan.repayment_status == FORBEARANCE rather than CURRENT,
          proving the Disbursement transition depends on the Loan's state.
