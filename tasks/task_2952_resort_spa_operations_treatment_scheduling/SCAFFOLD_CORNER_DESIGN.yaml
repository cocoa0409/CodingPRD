      - "it is accepted although the certification's expires_on equals the clock date, proving rung 19 uses expires_on >= date(clock)"
      - "it is accepted although start_at is exactly clock + MIN_LEAD_MINUTES, proving rung 26 uses start_at >= clock + 120"
      - "it is accepted although [start_at, end_at] coincides with the block's own bounds, proving rung 23 treats both block bounds as inclusive"
      - "it is accepted although the authoritative form is OVERRIDDEN rather than SCREENED_CLEAR (rung 12) and carries a high-risk code that is not in contraindication_codes (rung 14): screened_condition_codes == [\"RECENT_SURGERY_90D\"] and the intersection with [\"ACUTE_HYPERTENSION\"] is empty"
      - "POST /appointments/${appt}/confirm then returns 200 with schedule_status CONFIRMED, so the same five boundary conditions are re-evaluated identically at confirm time"

- section: endpoints
  instances:
  - name: logical_clock_default_instant_and_monotonic_advance_only
    claim_type: Conditional action
    grounds:
    - endpoints.POST_/_clock/set_current_utc
    - validations.p33_ERR_CLOCK_REWIND.check
    - validations.p3_ERR_INVALID_REQUEST.check
    distinguishing_aspect: "The very first write of the run must be stamped 2026-08-01T00:00:00.000Z without any clock call, and a rewind attempt must be rejected without moving the clock — an implementation that seeds from wall-clock time, or that clamps a rewind to the current value and returns 200, is distinguishable from one that returns 422 and leaves the clock untouched."
    test_recipe:
      setup: An empty system. No clock call is issued before the first trigger, so the logical clock must still hold its declared default.
      setup_api_calls: []
      trigger:
      - call: POST /guests
        payload: { full_name: "Default Clock Guest", resort_room_number: "2201", folio_limit_cents: 100000 }
        as: SpaCoordinator
        captures: { g_default: $.data.id, g_default_created: $.data.created_at }
      - call: POST /_clock/set_current_utc
        payload: { current_utc: "2026-07-31T23:59:59.999Z" }
        as: SpaDirector
        captures: { err_rewind_below_default: $.data.error_id }
      - call: POST /_clock/set_current_utc
        payload: { current_utc: "2026-08-01T00:00:00.000Z" }
        as: SpaDirector
      - call: POST /_clock/set_current_utc
        payload: { current_utc: "2026-08-05T09:00:00.000+02:00" }
        as: SpaDirector
        captures: { err_offset_instant: $.data.error_id }
      - call: POST /_clock/set_current_utc
        payload: { current_utc: "2026-08-05T09:00:00.000Z" }
        as: SpaDirector
      - call: POST /_clock/set_current_utc
        payload: { current_utc: "2026-08-05T08:59:59.999Z" }
        as: SpaDirector
        captures: { err_rewind_one_ms: $.data.error_id }
      - call: POST /guests
        payload: { full_name: "Advanced Clock Guest", resort_room_number: "2202", folio_limit_cents: 100000 }
        as: SpaCoordinator
        captures: { g_advanced: $.data.id }
      assert:
      - "the first guest is created with created_at == updated_at == 2026-08-01T00:00:00.000Z, the declared default logical clock, with no clock call preceding it"
      - "setting the clock one millisecond before the default returns 422 ERR_CLOCK_REWIND"
      - "setting the clock to exactly its current value returns 200 with current_utc 2026-08-01T00:00:00.000Z: the guard is >=, not >"
      - "the non-UTC offset instant returns 422 ERR_INVALID_REQUEST, not ERR_CLOCK_REWIND — shape (priority 3) outranks the temporal guard (priority 33) — and the clock does not move"
      - "advancing to 2026-08-05T09:00:00.000Z returns 200 with that value echoed back"
      - "the one-millisecond rewind from there returns 422 ERR_CLOCK_REWIND"
      - "the second guest is created with created_at 2026-08-05T09:00:00.000Z, proving neither rejected clock call altered the clock"

  - name: report_window_guards_on_both_report_endpoints
    claim_type: Computed read
    grounds:
    - validations.p32_ERR_INVALID_REPORT_WINDOW.check
    - calculations.room_utilization_and_margin.constants.MAX_REPORT_WINDOW_DAYS
    - endpoints.GET_/reports/room-utilization.input
    - endpoints.GET_/reports/retail-attachment.input
    distinguishing_aspect: "The window guard is a strict from_at < to_at plus an inclusive span ceiling of exactly MAX_REPORT_WINDOW_DAYS days, and it must be enforced identically on both report endpoints: a 92-day window returns 200 while a 92-day-plus-one-millisecond window returns 422, so an off-by-one span check or a guard wired to only one report is caught."
    test_recipe:
      setup: A single room and a single therapist so both reports have a non-empty row set to compute over; no appointments are needed because the guard is evaluated before the aggregate.
      setup_api_calls:
      - call: POST /_clock/set_current_utc
        payload: { current_utc: "2026-08-01T09:00:00.000Z" }
        as: SpaDirector
      - call: POST /treatment-rooms
        payload: { code: "DRY-1", room_class: "DRY", capacity_guests: 1, turnover_buffer_minutes: 15, hourly_fixed_cost_cents: 2500 }
