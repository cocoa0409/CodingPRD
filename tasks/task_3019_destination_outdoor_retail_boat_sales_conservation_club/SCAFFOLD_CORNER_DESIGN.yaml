              payload: { email: "m_ap1@x.com", full_name: "Ada Pike", donation_opt_in: false }
              as: Anonymous
              captures: { m1_id: $.data.id }
            - call: "POST /stores/${st_roomy_id}/members"
              payload: { email: "m_ap2@x.com", full_name: "Abe Pike", donation_opt_in: false }
              as: Anonymous
              captures: { m2_id: $.data.id }
            - call: "POST /stores/${st_tight_id}/attractions"
              payload: { attraction_type: "AQUARIUM", capacity_units: 40, dwell_cost_minutes: 30 }
              as: StoreManager
              captures: { at_tight_id: $.data.id }
            - call: "POST /stores/attractions/${at_tight_id}/open"
              payload: {}
              as: StoreManager
            - call: "POST /stores/${st_roomy_id}/attractions"
              payload: { attraction_type: "AQUARIUM", capacity_units: 40, dwell_cost_minutes: 30 }
              as: StoreManager
              captures: { at_roomy_id: $.data.id }
            - call: "POST /stores/attractions/${at_roomy_id}/open"
              payload: {}
              as: StoreManager
            - call: "POST /stores/${st_tight_id}/attraction-sessions"
              payload: { attraction_id: "${at_tight_id}", member_id: "${m1_id}", session_kind: "GENERAL_ADMISSION", party_size: 4, slot_start_utc: "2026-11-01T10:00:00Z", slot_end_utc: "2026-11-01T11:00:00Z" }
              as: AttractionHost
              captures: { s_tight_id: $.data.id }
            - call: "POST /stores/${st_roomy_id}/attraction-sessions"
              payload: { attraction_id: "${at_roomy_id}", member_id: "${m2_id}", session_kind: "GENERAL_ADMISSION", party_size: 4, slot_start_utc: "2026-11-01T10:00:00Z", slot_end_utc: "2026-11-01T11:00:00Z" }
              as: AttractionHost
              captures: { s_roomy_id: $.data.id }
          trigger:
            - call: "GET /stores/${st_tight_id}/dwell-summary"
              as: StoreManager
            - call: "GET /stores/${st_roomy_id}/dwell-summary"
              as: StoreManager
            - call: "POST /stores/${st_tight_id}/attraction-sessions"
              payload: { attraction_id: "${at_tight_id}", member_id: "${m1_id}", session_kind: "GENERAL_ADMISSION", party_size: 1, slot_start_utc: "2026-11-02T10:00:00Z", slot_end_utc: "2026-11-02T11:00:00Z" }
              as: AttractionHost
              captures: { err_tight: $.data.error_id }
            - call: "POST /stores/${st_roomy_id}/attraction-sessions"
              payload: { attraction_id: "${at_roomy_id}", member_id: "${m2_id}", session_kind: "GENERAL_ADMISSION", party_size: 1, slot_start_utc: "2026-11-02T10:00:00Z", slot_end_utc: "2026-11-02T11:00:00Z" }
              as: AttractionHost
              captures: { err_roomy: $.data.error_id }
          assert:
            - "both stores committed exactly 120 minutes: AttractionSession.${s_tight_id}.dwell_charge_minutes == 120 and AttractionSession.${s_roomy_id}.dwell_charge_minutes == 120"
            - "the tight store reads Store.${st_tight_id}.attraction_posture == FROZEN with dwell_free_minutes == -20, taking the first branch of the if-chain"
            - "the roomy store reads Store.${st_roomy_id}.attraction_posture == RESTRICTED with dwell_free_minutes == 20, inside the 30-minute critical band, taking the second branch"
            - "the tight store's next request is rejected with data.error_id == ERR_POSTURE_FROZEN"
            - "the roomy store's next request is rejected with data.error_id == ERR_POSTURE_RESTRICTED, so identical commits yield different errors purely from the ordered predicate"

