      - name: list_endpoint_envelope_and_pagination
        claim_type: listing
        grounds: [response_envelope, "endpoints[GET /annuity/payees]"]
        distinguishing_aspect: "List responses carry the fixed envelope: meta.api_request_id/api_request_timestamp, response_type 'array', and pagination fields total_count/has_more honoring limit/offset (default limit 10)."
        test_recipe:
          setup: ["CA profile; three payees created"]
          setup_api_calls:
            - call: "POST /annuity/state-statute-profiles"
              payload: { state_code: "CA", age_of_majority: 18, sspa_max_discount_rate_bps: 700, disclosure_cooling_off_days: 10, ipa_required: true, dormancy_years: 3, commutation_permitted: true }
              as: PlatformAdmin
            - call: "POST /annuity/payees"
              payload: { full_name: "Page One", date_of_birth: "1980-01-01", tax_id: "474-01-0001", address_line1: "1 A St", address_city: "Fresno", address_state_code: "CA", address_postal_code: "93701" }
              as: CaseManager
            - call: "POST /annuity/payees"
              payload: { full_name: "Page Two", date_of_birth: "1981-02-02", tax_id: "474-02-0002", address_line1: "2 B St", address_city: "Fresno", address_state_code: "CA", address_postal_code: "93701" }
              as: CaseManager
            - call: "POST /annuity/payees"
              payload: { full_name: "Page Three", date_of_birth: "1982-03-03", tax_id: "474-03-0003", address_line1: "3 C St", address_city: "Fresno", address_state_code: "CA", address_postal_code: "93701" }
              as: CaseManager
          trigger:
            - call: "GET /annuity/payees?limit=2"
              payload: {}
              as: Any
            - call: "GET /annuity/payees?limit=2&offset=2"
              payload: {}
              as: Any
          assert:
            - "page 1: response_type == 'array', meta.api_request_id present, data length == 2, total_count == 3, has_more == true"
            - "page 2 (offset 2): data length == 1, total_count == 3, has_more == false"
            - "union of the two pages covers all 3 payees with no duplicates"

      - name: list_limit_above_max_returns_invalid_request
        claim_type: listing
        grounds: [response_envelope.pagination_defaults, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "limit is bounded at 100 per the fixed envelope; limit=200 is rejected with ERR_INVALID_REQUEST (400)."
        test_recipe:
          setup: ["empty database is sufficient"]
          setup_api_calls: []
          trigger:
            - call: "GET /annuity/payees?limit=200"
              payload: {}
              as: Any
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_INVALID_REQUEST (http 400; envelope max limit is 100)"

