      - name: therapy_episode_hold_resume_cycle_is_non_linear
        claim_type: state_cycle
        grounds:
          - state_machines.TherapyEpisode.transitions[ACTIVE->HELD]
          - state_machines.TherapyEpisode.transitions[HELD->ACTIVE]
        excluded_because:
          difficulty_instance: therapy_episode_hold_resume_cycle_with_reason_specific_gates
          rationale: "The §1.8 instance already walks ACTIVE -> HELD(SURGERY) -> ACTIVE -> HELD(INFECTION) -> ACTIVE, pinning hold_count 1 then 2, the two different resume_not_before instants (2026-08-19 and 2026-08-27) and the reason-specific attestation gate on each resume. A separate corner instance would re-test the same edges with weaker assertions."

      - name: authorization_appeal_cycle_is_bounded_by_appeal_rounds_allowed
        claim_type: state_cycle
        grounds:
          - state_machines.Authorization.transitions[DENIED->SUBMITTED]
          - validations.priority_20_ERR_APPEAL_ROUNDS_EXHAUSTED
        excluded_because:
          difficulty_instance: authorization_denied_resubmit_appeal_cycle_until_rounds_exhausted
          rationale: "The §1.8 instance traverses SUBMITTED -> DENIED -> SUBMITTED twice, pins appeal_round 0/1/2 and ends on ERR_APPEAL_ROUNDS_EXHAUSTED at the third resubmission, which covers both the cycle edge and its bound."

      - name: lab_triggered_hold_cascade_reaches_the_enrollment
          # depth-4 system cascade: MonitoringLab -> TherapyEpisode -> InfusionAppointment -> Authorization/AssistanceEnrollment
