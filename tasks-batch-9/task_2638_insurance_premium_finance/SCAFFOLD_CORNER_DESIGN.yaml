            - "${iv_e_submit} == 'ERR_AGREEMENT_STATE_INVALID' with HTTP 409 — ACTIVE has no outbound submit edge, and the note's ACTIVE quote and installments are unchanged"
            - "${iv_e_activate} == 'ERR_AGREEMENT_STATE_INVALID' with HTTP 409 — DRAFT has no outbound activate edge, even though licensing, down payment and service fee would all pass; verification cannot be skipped"
