      - name: contract_rescission_vacates_position_and_reopens_soap_four_hop
        grounds:
          - endpoints.POST_/contracts/{id}/rescind
          - state_machines.Contract.SIGNED_to_RESCINDED
          - state_machines.MatchResult.MATCHED_to_VACATED
          - state_machines.Program.SEASON_CLOSED_to_SOAP_ACTIVE
          - entities.Program.fields.matched_count
          - entities.Program.fields.unfilled_positions
        cascade_chain: |
          hop 1  Contract c1: SIGNED -> RESCINDED
          hop 2  because the contract left its filled state, MatchResult mr1.outcome MATCHED -> VACATED
          hop 3  because mr1 is no longer MATCHED, Program.matched_count 1 -> 0 and
                 Program.unfilled_positions 0 -> 1
          hop 4  because Program.unfilled_positions rose above 0, the Program re-opens
                 SEASON_CLOSED -> SOAP_ACTIVE
          plus   every CredentialItem on c1 whose status is not VERIFIED becomes VOIDED
        distinguishing_aspect: |
          This is the compensating direction of the same conserved quantity: the cascade reaches all
          the way from a single contract row back up to the Program's season_phase, re-opening a
          season that had already closed. An implementation that flips only the contract, or that
          decrements matched_count without re-opening the phase, or that voids the already-VERIFIED
          credential too, produces a different observable end state.
        test_recipe:
          setup:
            - "a Program with quota_positions 1 driven through the whole season to SEASON_CLOSED"
            - "one matched application whose MatchResult mr1 has outcome MATCHED"
            - "a SIGNED contract c1 with mandatory_credential_count 3 (STATE_LICENSE, BLS, DEA)"
            - "the STATE_LICENSE credential item VERIFIED; the BLS and DEA items still PENDING"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-01T00:00:00Z" }
              as: NrmpAdmin
            - call: "POST /programs"
