        grounds:
          - state_machines.VerificationAudit.FIELDWORK_to_FINDINGS_ISSUED
          - state_machines.CreditPathway.CERTIFIED_to_SUSPENDED
          - state_machines.DigesterFacility.OPEN_to_RESTRICTED
          - calculations.credit_quantity
          - calculations.net_distributable_waterfall
          - calculations.dscr_and_distribution_posture
        distinguishing_aspect: |
          One POST /verification-audits/{id}/findings propagates five links deep - audit
          finding_severity MATERIAL, pathway CERTIFIED -> SUSPENDED, the ISSUED batch
          revalued from 269027 to 260780 cents, the DRAFT statement's whole waterfall
          recomputed so net_distributable_cents falls 1406289 -> 1400506, and the facility
          distribution_posture flipped OPEN -> RESTRICTED because dscr_current crossed
