  # ===========================================================================
  # Rule 8 — resource_temporal_overlap (different interval semantics)
  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: production_slot_half_open_adjacency
        grounds:
          - validations[priority=7]
          - entities.ProductionSlot.fields.start_ts
          - entities.ProductionSlot.fields.end_ts
        distinguishing_aspect: |
          Half-open interval semantics on ProductionSlot (resource = line_id):
          slot B starting exactly at slot A's end_ts is legal (no overlap), but
          slot C starting one second before A's end_ts conflicts with
          ERR_SCHEDULE_CONFLICT.
        test_recipe:
          setup:
            - "Slot A on LINE_A occupying [2026-09-01T00:00:00Z, 2026-09-05T00:00:00Z) in OPEN"
          setup_api_calls:
            - call: "POST /api/production-slots"
              payload: { line_id: LINE_A, start_ts: "2026-09-01T00:00:00Z", end_ts: "2026-09-05T00:00:00Z" }
              as: ProductionPlanner
              captures: { sa: $.data.id }
          trigger:
            - call: "POST /api/production-slots"
              payload: { line_id: LINE_A, start_ts: "2026-09-05T00:00:00Z", end_ts: "2026-09-08T00:00:00Z" }
              as: ProductionPlanner
              captures: { sb: $.data.id }
            - call: "POST /api/production-slots"
              payload: { line_id: LINE_A, start_ts: "2026-09-04T23:59:59Z", end_ts: "2026-09-07T00:00:00Z" }
              as: ProductionPlanner
              captures: { err: $.data.error_id }
          assert:
            - "Slot B creation succeeds (back-to-back adjacency allowed; sb is a valid id)"
            - "err == ERR_SCHEDULE_CONFLICT"

      - name: training_session_whole_day_collision
        grounds:
          - validations[priority=7]
          - entities.TrainingSession.fields.scheduled_date
        distinguishing_aspect: |
          Different interval semantics on a different resource (agency calendar
          day, not a line interval): two sessions for the same agency on the
          same calendar date conflict even at different times of day, while the
          same date for a different agency (or an adjacent date for the same
          agency) is allowed.
        test_recipe:
          setup:
            - "Two agencies exist; agency A has a SCHEDULED session on 2026-09-10T09:00:00Z"
          setup_api_calls:
            - call: "POST /api/agencies"
              payload: { name: "Front Range Transit", agency_code: "FRT1", federally_funded: true, transition_target_year: 2036 }
              as: PlatformAdmin
              captures: { ag_a: $.data.id }
            - call: "POST /api/agencies"
              payload: { name: "Plains Transit", agency_code: "PLT1", federally_funded: false, transition_target_year: 2040 }
              as: PlatformAdmin
              captures: { ag_b: $.data.id }
            - call: "POST /api/training-sessions"
              payload: { agency_id: "${ag_a}", propulsion_type: BEV, scheduled_date: "2026-09-10T09:00:00Z", attendee_count: 4 }
              as: WarrantyAdmin
              captures: { ts1: $.data.id }
          trigger:
            - call: "POST /api/training-sessions"
              payload: { agency_id: "${ag_a}", propulsion_type: CNG, scheduled_date: "2026-09-10T15:00:00Z", attendee_count: 2 }
              as: WarrantyAdmin
              captures: { err_same: $.data.error_id }
            - call: "POST /api/training-sessions"
              payload: { agency_id: "${ag_b}", propulsion_type: BEV, scheduled_date: "2026-09-10T09:00:00Z", attendee_count: 3 }
              as: WarrantyAdmin
              captures: { ts2: $.data.id }
            - call: "POST /api/training-sessions"
              payload: { agency_id: "${ag_a}", propulsion_type: BEV, scheduled_date: "2026-09-11T09:00:00Z", attendee_count: 2 }
              as: WarrantyAdmin
              captures: { ts3: $.data.id }
          assert:
            - "err_same == ERR_SCHEDULE_CONFLICT (same agency, same calendar date, different time-of-day)"
            - "Different-agency same-date session succeeds (ts2 valid)"
            - "Same-agency next-day session succeeds (ts3 valid)"

