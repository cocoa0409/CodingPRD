            - call: "POST /society/verification-visits"
              payload: { school_id: "${op_id}", self_study_id: "${oss_id}", consultant_id: "con-ada", window_start: "2026-10-01", window_end: "2026-10-03" }
              as: AccreditationReviewer
              captures: { ov_id: $.data.id }
