            - call: "POST /tours/${tid}/shows/${sid}/holds"
              payload: { promoter_name: "P", guarantee_cents: 100000, versus_pct: 70 }
              as: Promoter
              captures: { hid: $.data.id }
            - call: "POST /tours/${tid}/shows/${sid}/holds/${hid}/accept"
              payload: {}
              as: Promoter
            - call: "GET /tours/${tid}"
              payload: {}
              as: TourManager
              captures: { tv: $.data.version }
          trigger:
            - call: "POST /tours/${tid}/shows/${sid}/confirm"
              payload: { expected_tour_version: "${tv}" }
