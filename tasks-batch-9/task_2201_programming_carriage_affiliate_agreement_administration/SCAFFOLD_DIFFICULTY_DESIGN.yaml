  # ===========================================================================
  # RULE 9 — compensating_invariant
  # ===========================================================================
  - rule_id: compensating_invariant
    rule_summary: >-
      Two reversals whose correctness is stated as an identity that must hold
      before, during and after. Voiding an issued invoice must return the
      marketing ledger, the receivable and the reports' billing links to their
      exact pre-issue values while leaving recognized revenue untouched;
      reinstating a suspended agreement must undo the window and title cascade
      the suspension caused, again without reversing a cent of recognized
      revenue. Both are deliberately PARTIAL compensations — money is never
      un-recognized — so a test that asserts full symmetry fails.
    instances:

      - instance_id: CI-1
        name: invoice_void_restores_coop_ledger_receivable_and_report_link
        grounds:
          - state_machines.Invoice.ISSUED_to_VOID
          - calculations.marketing_commitment_ledger
          - entities.MarketingCommitment.fields.billed_cents
          - entities.MarketingCommitment.fields.earned_unbilled_cents
          - entities.Distributor.fields.receivable_balance_cents
          - errors[ERR_INVALID_INVOICE_STATE]
        title: "Voiding an ISSUED invoice restores the co-op ledger, the receivable and the report link exactly, but not revenue"
        forward_operation: "POST /carriage/invoices/{invoiceId}/lifecycle action=ISSUE — consumes 416,000 cents of earned co-op, loads a 4,784,000-cent receivable and stamps invoice_id on the billed report"
        compensating_operation: "POST /carriage/invoices/{invoiceId}/lifecycle action=VOID from ISSUED with paid_cents == 0"
        invariant: >-
          committed_cents == earned_cents + remaining_cents + forfeited_cents AND
          earned_unbilled_cents == earned_cents - billed_cents hold after EVERY
          step; Distributor.receivable_balance_cents equals the sum of
          net_due_cents - paid_cents over ISSUED/PARTIALLY_PAID invoices at every
          step; and CarriageAgreement.recognized_revenue_cents is monotone —
          5,200,000 before the issue, during it and after the void.
        rationale: >-
          A co-op offset is a real consumption of a finite committed pool, so a
          billing error that is voided must give the pool back, or the network
          silently loses the ability to ever pay that co-op again. Equally the
          voided month must become re-billable, which requires releasing the
          report's invoice_id. Revenue, by contrast, was recognized when the
          operator's subscriber count was accepted — voiding an invoice is a
          billing correction, not a restatement, so revenue must NOT unwind.
        distinguishing_aspect: >-
          The full before/during/after triple on four counters at once: co-op
          billed 0 -> 416000 -> 0, earned_unbilled 500000 -> 84000 -> 500000,
          receivable 0 -> 4784000 -> 0, report.invoice_id null -> set -> null —
          while recognized_revenue_cents stays 5200000 throughout and the voided
          month is then re-billable for the identical 4,784,000. An
          implementation that reverses revenue, or that leaves billed_cents
          consumed, or that leaves invoice_id stamped (making the month
          permanently unbillable), each fails a different assert.
        test_recipe:
          setup: >-
            Cliffside Telco holds a 1,000,000-cent co-op commitment of which
            500,000 has been earned with proof of performance. Its 2026-06 month
            is accepted at 130,000 subscribers for 5,200,000 cents, and a
            LICENSE_FEE invoice is drafted and issued: the 8% band applies to a
            gross of 5,200,000, so 416,000 of co-op is consumed and 4,784,000 is
            loaded onto the receivable, comfortably inside the 100,000,000 credit
            limit so no credit cascade fires.
          setup_api_calls:
            - call: "POST /carriage/distributors"
              payload:
                legal_name: "Cliffside Telco"
                distributor_type: "TELCO"
                rate_card_class: "CLASS_B"
                total_subscribers: 200000
                credit_limit_cents: 100000000
              as: NetworkAdmin
              as_user_id: "u-admin-1"
              captures:
                d4_id: "id"
            - call: "POST /carriage/agreements"
              payload:
                distributor_id: "${d4_id}"
                contract_code: "CT-2025-01"
                term_start_date: "2025-01-01T00:00:00Z"
                term_end_date: "2028-12-31T00:00:00Z"
                base_license_fee_cents_per_sub: 40.0000
                escalator_pct: 0.00
                penetration_floor_pct: 0.50
                committed_tier: "BASIC"
                launch_fee_cents: 0
                marketing_commitment_cents: 0
              as: AffiliateSalesExec
              as_user_id: "u-sales-1"
              captures:
                a4_id: "id"
            - call: "POST /carriage/agreements/${a4_id}/lifecycle"
              payload:
                action: "SUBMIT_FOR_NEGOTIATION"
              as: AffiliateSalesExec
              as_user_id: "u-sales-1"
            - call: "POST /carriage/agreements/${a4_id}/lifecycle"
              payload:
                action: "EXECUTE"
              as: AffiliateSalesExec
              as_user_id: "u-sales-1"
              captures:
                a4_version: "version"
            - call: "POST /carriage/marketing-commitments"
              payload:
                agreement_id: "${a4_id}"
                commitment_type: "COOP_ADVERTISING"
                committed_cents: 1000000
                performance_deadline: "2026-12-31T00:00:00Z"
              as: AffiliateSalesExec
              as_user_id: "u-sales-1"
              captures:
                coop1_id: "id"
            - call: "POST /carriage/marketing-commitments/${coop1_id}/earn"
              payload:
                earned_cents: 500000
                proof_reference: "COOP-Q2-2026-INSERTION-ORDER"
              as: AffiliateSalesExec
              as_user_id: "u-sales-1"
              captures:
                coop1_earned_pre: "earned_cents"
                coop1_billed_pre: "billed_cents"
                coop1_unbilled_pre: "earned_unbilled_cents"
