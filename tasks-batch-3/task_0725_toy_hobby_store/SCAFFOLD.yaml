  - { id: ERR_RETURN_WINDOW_EXPIRED, http: 409, condition: "Return approved beyond 30 days after fulfillment" }
  - { id: ERR_NO_ALLOCATION, http: 409, condition: "No ACTIVE allocation for product+store to convert against" }
