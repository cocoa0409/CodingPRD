            - call: "POST /culinary/recipes/${grill_id}/cost-rollup"
              payload: { basis: "LATEST_PUBLISHED" }
              as: CostAnalyst
            - call: "POST /culinary/recipes/${grill_id}/submit-review"
              as: RecipeDeveloper
            - call: "POST /culinary/recipes/${grill_id}/activate"
              as: CulinaryDirector
            - call: "POST /culinary/menu-items"
              payload: { code: "MI-GRILL-MW", name: "Grilled Cheese", recipe_id: "${grill_id}", region_code: "MW", current_price_cents: 400, target_food_cost_bps: 3000, declared_allergen_mask: 1 }
              as: RecipeDeveloper
              captures: { mi_id: $.data.id }
            - call: "POST /culinary/menu-items/${mi_id}/plate-cost"
              as: CostAnalyst
              captures: { plate: $.data.plate_cost_cents }
            - call: "POST /culinary/menu-items/${mi_id}/activate"
              as: CulinaryDirector
              captures: { mi_v1: $.data.version }
            - call: "POST /culinary/lto-campaigns"
              payload: { menu_item_id: "${mi_id}", window_start: "2026-07-01T00:00:00.000Z", window_end: "2026-08-01T00:00:00.000Z", promo_price_cents: 380, forecast_units: 500, expected_menu_item_version: "${mi_v1}" }
              as: RecipeDeveloper
              captures: { lto_a: $.data.id }
            - call: "POST /culinary/lto-campaigns/${lto_a}/cost"
              as: CostAnalyst
              captures: { a_fc: $.data.promo_food_cost_bps, a_fcc: $.data.forecast_contribution_cents }
            - call: "POST /culinary/lto-campaigns/${lto_a}/launch"
              as: CulinaryDirector
              captures: { a_launched: $.data.status }
            - call: "POST /culinary/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00.000Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /culinary/lto-campaigns/${lto_a}/close-review"
              payload: { actual_units: 300, actual_gross_sales_cents: 114000 }
              as: CostAnalyst
              captures: { a_st: $.data.status, a_sup: $.data.promo_support_cost_cents, a_con: $.data.promo_contribution_cents, a_att: $.data.forecast_attainment_bps, a_vd: $.data.verdict, a_rev: $.data.reviewed_at }
            - call: "GET /culinary/menu-items/${mi_id}"
              as: CostAnalyst
              captures: { mi_v2: $.data.version, mi_lto_after_a: $.data.is_lto, mi_open_after_a: $.data.open_lto_count }
            - call: "POST /culinary/lto-campaigns"
              payload: { menu_item_id: "${mi_id}", window_start: "2026-08-01T00:00:00.000Z", window_end: "2026-09-01T00:00:00.000Z", promo_price_cents: 380, forecast_units: 100, expected_menu_item_version: "${mi_v2}" }
              as: RecipeDeveloper
              captures: { lto_b: $.data.id }
            - call: "POST /culinary/lto-campaigns/${lto_b}/cost"
              as: CostAnalyst
              captures: { b_fcc: $.data.forecast_contribution_cents }
            - call: "POST /culinary/lto-campaigns/${lto_b}/launch"
              as: CulinaryDirector
            - call: "POST /culinary/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00.000Z" }
              as: PlatformAdmin
            - call: "POST /culinary/lto-campaigns/${lto_b}/close-review"
              payload: { actual_units: 100, actual_gross_sales_cents: 9000 }
              as: CostAnalyst
              captures: { b_st: $.data.status, b_sup: $.data.promo_support_cost_cents, b_con: $.data.promo_contribution_cents, b_att: $.data.forecast_attainment_bps, b_vd: $.data.verdict }
          assert:
            - "${plate} == 100, ${a_fc} == 2632 == round_half_up(100*10000/380), ${a_fcc} == 140000 == 500*280 and ${a_launched} == LAUNCHED"
            - "arm A: ${a_st} == CLOSED, ${a_sup} == 3420 == round_half_up(114000*300/10000), ${a_con} == 80580 == 114000 - 300*100 - 3420, ${a_att} == 6000 == round_half_up(300*10000/500)"
            - "${a_vd} == UNPROFITABLE — the contribution gate passes (80580 >= 0) and the attainment gate fails (6000 < 8000); an OR would report PROFITABLE"
            - "${a_rev} == 2026-08-01T00:00:00.000Z, the clock at close-review time"
            - "${b_fcc} == 28000 == 100*280"
            - "arm B: ${b_st} == CLOSED, ${b_sup} == 270 == round_half_up(9000*300/10000), ${b_con} == -1270 == 9000 - 100*100 - 270, ${b_att} == 10000 == round_half_up(100*10000/100)"
            - "${b_vd} == UNPROFITABLE — the attainment gate passes at exactly LTO_MIN_ATTAINMENT_BPS and the contribution gate fails; dropping the support cost still leaves -1000, so the sign is robust"
            - "${mi_lto_after_a} == false and ${mi_open_after_a} == 0 — A's close-review released the item before B was planned"
            - "campaign B's own launch proves campaign A no longer occupies regional capacity once it is CLOSED"

      - name: recipe_cost_rollup_dual_variant_divergence_on_one_recipe
        claim_type: variant_divergence
        excluded_because:
          difficulty_instance: recipe_cost_rollup_latest_published_versus_weighted_average_on_recipe
          rationale: "That §1.8 dual_variant_calc instance runs both bases over the same two-window price history on one recipe and asserts the divergent batch_cost_micros for each, including the duration-weighting arithmetic and the window-truncation effect."
      - name: theoretical_food_cost_variant_divergence_on_one_review
        claim_type: variant_divergence
        excluded_because:
          difficulty_instance: theoretical_versus_actual_variance_sales_mix_versus_usage_basis_on_period_review
          rationale: "That §1.8 instance loads identical mix and count data into a SALES_MIX_BASED review and a USAGE_BASED review and asserts both theoretical figures, the divergent variance_bps and both variance_flag outcomes."
      - name: recipe_cost_rollup_rounds_each_component_before_summing
        claim_type: precision
        excluded_because:
          difficulty_instance: component_extended_costs_rounded_then_summed_on_plate_melt_rollup
          rationale: "That §1.8 combinatorial_formula instance pins round-then-sum against sum-then-round on a recipe whose components both carry fractional remainders, which is the whole content of this claim."
      - name: price_change_projection_cap_relief_ordering
        claim_type: constants_applied
        excluded_because:
          difficulty_instance: market_cap_relief_applied_only_after_projected_food_cost_step
          rationale: "That §1.8 combinatorial_formula instance submits the same proposed price against two target_food_cost_bps values and asserts the accepted/rejected split that only the pinned STEP 5 -> STEP 6 order produces."
      - name: recipe_cost_rollup_ignores_removed_components
        claim_type: input_set_filtering
        excluded_because:
          difficulty_instance: component_add_then_delete_conserves_the_recipe_allergen_bitmask
          rationale: "That §1.8 compensating_invariant instance adds a component, re-rolls, deletes it, re-rolls and asserts the batch cost, the allergen mask and the nutrition totals all return to their exact pre-add values, which is exactly the claim that REMOVED rows leave the input set."
      - name: menu_mix_classification_at_the_popularity_threshold
        claim_type: correct_result
        excluded_because:
          difficulty_instance: mix_percentage_exactly_at_popularity_threshold_classifies_as_plowhorse
          rationale: "That §1.8 boundary_precision_check instance sits a line exactly on popularity_threshold_bps and its neighbour one basis point below, asserting the inclusive comparison and both resulting margin_class values."

  - section: validations
    instances:
      - name: kids_menu_sodium_cap_applies_only_when_the_flag_is_set
        claim_type: violation_to_error
        grounds:
          - validations[priority 33] ERR_NUTRITION_LIMIT_EXCEEDED
          - constants.KIDS_MENU_SODIUM_CAP_MCG
          - state_machines[MenuItem] DRAFT -> ACTIVE
        distinguishing_aspect: "Conditional validation. Three activations on two recipes: the 620000-mcg recipe activates as a kids item, the 775000-mcg recipe is rejected as a kids item with ERR_NUTRITION_LIMIT_EXCEEDED, and the SAME 775000-mcg recipe activates fine as a non-kids item. The rule is therefore gated on is_kids_menu and not on the sodium figure alone, and it is enforced at activation rather than at creation — both DRAFT items are created successfully."
        test_recipe:
          setup:
            - "CHEDDAR-BLOCK at 6200 sodium mcg per base unit, PUBLISHED in MW at 22000000 micros for a 2268-unit pack."
            - "KIDS-LOW (PLATED, EACH, batch_yield 4, portions 4) with CHEDDAR at ep 400 -> sodium_mcg_per_portion round_half_up(400*6200/4) == 620000, ACTIVE. KIDS-HIGH identical but ep 500 -> 775000, ACTIVE."
            - "Three DRAFT menu items in MW, all with declared_allergen_mask 1: MI-KIDS-LOW (is_kids_menu true) on KIDS-LOW, MI-KIDS-HIGH (is_kids_menu true) and MI-ADULT-HIGH (is_kids_menu omitted) on KIDS-HIGH, each plate-costed to FRESH."
          setup_api_calls:
            - call: "POST /culinary/ingredients"
              payload: { sku: "CHEDDAR-BLOCK", name: "Cheddar Block", base_uom: "GRAM", pack_base_units: 2268, trim_yield_bps: 10000, cook_shrink_bps: 0, allergen_mask: 1, kcal_per_base_unit_micros: 4000000, sodium_mcg_per_base_unit: 6200 }
              as: RecipeDeveloper
              captures: { ched_id: $.data.id }
            - call: "POST /culinary/price-feeds"
              payload: { distributor_code: "BROADLINE", region_code: "MW", feed_date: "2026-07-01T00:00:00.000Z" }
              as: CostAnalyst
              captures: { feed1_id: $.data.id }
            - call: "POST /culinary/price-feeds/${feed1_id}/lines"
              payload: { ingredient_id: "${ched_id}", pack_cost_micros: 22000000, effective_from: "2026-07-01T00:00:00.000Z" }
              as: CostAnalyst
            - call: "POST /culinary/price-feeds/${feed1_id}/publish"
              as: CostAnalyst
            - call: "POST /culinary/recipes"
              payload: { code: "KIDS-LOW", name: "Small Cheese Plate", recipe_type: "PLATED", base_uom: "EACH", batch_yield_base_units: 4, portions_per_batch: 4 }
              as: RecipeDeveloper
              captures: { low_id: $.data.id, low_v0: $.data.version }
            - call: "POST /culinary/recipes/${low_id}/components"
              payload: { component_type: "INGREDIENT", ingredient_id: "${ched_id}", ep_quantity_base_units: 400, sequence_no: 1, expected_recipe_version: "${low_v0}" }
              as: RecipeDeveloper
            - call: "POST /culinary/recipes/${low_id}/cost-rollup"
              payload: { basis: "LATEST_PUBLISHED" }
              as: CostAnalyst
              captures: { low_sodium: $.data.sodium_mcg_per_portion, low_kcal: $.data.kcal_per_portion_micros }
            - call: "POST /culinary/recipes/${low_id}/submit-review"
              as: RecipeDeveloper
            - call: "POST /culinary/recipes/${low_id}/activate"
              as: CulinaryDirector
            - call: "POST /culinary/recipes"
              payload: { code: "KIDS-HIGH", name: "Large Cheese Plate", recipe_type: "PLATED", base_uom: "EACH", batch_yield_base_units: 4, portions_per_batch: 4 }
              as: RecipeDeveloper
              captures: { high_id: $.data.id, high_v0: $.data.version }
            - call: "POST /culinary/recipes/${high_id}/components"
              payload: { component_type: "INGREDIENT", ingredient_id: "${ched_id}", ep_quantity_base_units: 500, sequence_no: 1, expected_recipe_version: "${high_v0}" }
              as: RecipeDeveloper
            - call: "POST /culinary/recipes/${high_id}/cost-rollup"
              payload: { basis: "LATEST_PUBLISHED" }
              as: CostAnalyst
              captures: { high_sodium: $.data.sodium_mcg_per_portion, high_portion: $.data.portion_cost_micros }
            - call: "POST /culinary/recipes/${high_id}/submit-review"
              as: RecipeDeveloper
            - call: "POST /culinary/recipes/${high_id}/activate"
              as: CulinaryDirector
            - call: "POST /culinary/menu-items"
              payload: { code: "MI-KIDS-LOW", name: "Kids Cheese", recipe_id: "${low_id}", region_code: "MW", current_price_cents: 400, target_food_cost_bps: 3000, declared_allergen_mask: 1, is_kids_menu: true }
              as: RecipeDeveloper
              captures: { mi_kl: $.data.id, mi_kl_kids: $.data.is_kids_menu }
            - call: "POST /culinary/menu-items/${mi_kl}/plate-cost"
              as: CostAnalyst
              captures: { kl_cents: $.data.plate_cost_cents }
            - call: "POST /culinary/menu-items"
              payload: { code: "MI-KIDS-HIGH", name: "Kids Big Cheese", recipe_id: "${high_id}", region_code: "MW", current_price_cents: 400, target_food_cost_bps: 3000, declared_allergen_mask: 1, is_kids_menu: true }
              as: RecipeDeveloper
              captures: { mi_kh: $.data.id }
            - call: "POST /culinary/menu-items/${mi_kh}/plate-cost"
              as: CostAnalyst
              captures: { kh_cents: $.data.plate_cost_cents, kh_state: $.data.plate_cost_state, kh_sodium: $.data.sodium_mcg_per_portion }
            - call: "POST /culinary/menu-items"
              payload: { code: "MI-ADULT-HIGH", name: "Big Cheese", recipe_id: "${high_id}", region_code: "MW", current_price_cents: 400, target_food_cost_bps: 3000, declared_allergen_mask: 1 }
              as: RecipeDeveloper
              captures: { mi_ah: $.data.id, mi_ah_kids: $.data.is_kids_menu }
            - call: "POST /culinary/menu-items/${mi_ah}/plate-cost"
              as: CostAnalyst
          trigger:
            - call: "POST /culinary/menu-items/${mi_kl}/activate"
              as: CulinaryDirector
              captures: { kl_status: $.data.status }
            - call: "POST /culinary/menu-items/${mi_kh}/activate"
              as: CulinaryDirector
              captures: { err: $.data.error_id }
            - call: "GET /culinary/menu-items/${mi_kh}"
              as: CulinaryDirector
              captures: { kh_status: $.data.status }
            - call: "POST /culinary/menu-items/${mi_ah}/activate"
              as: CulinaryDirector
              captures: { ah_status: $.data.status }
          assert:
            - "${low_sodium} == 620000 == round_half_up(400*6200/4) and ${low_kcal} == 400000000; ${high_sodium} == 775000 and ${high_portion} == 1212522"
            - "${mi_kl_kids} == true and ${mi_ah_kids} == false — is_kids_menu defaults to false when omitted"
            - "${kl_cents} == 100 and ${kh_cents} == 126 == round_half_up((1236772 + 18552)/10000); ${kh_state} == FRESH and ${kh_sodium} == 775000 copied onto the item"
            - "${kl_status} == ACTIVE — 620000 <= KIDS_MENU_SODIUM_CAP_MCG 640000"
            - "${err} == ERR_NUTRITION_LIMIT_EXCEEDED (422) — 775000 > 640000, and this is the only failing gate: the recipe is ACTIVE, the plate cost is FRESH and mask 1 covers mask 1"
            - "${kh_status} == DRAFT — the rejected activation wrote nothing"
            - "${ah_status} == ACTIVE — the identical recipe passes for a non-kids item, proving the rule is conditional on the flag and not on the sodium figure"

      - name: sku_and_code_uniqueness_are_scoped_per_entity_type
        claim_type: violation_to_error
        grounds:
          - validations[priority 36] ERR_DUPLICATE_SKU
          - validations[priority 37] ERR_DUPLICATE_CODE
        distinguishing_aspect: "Four uniqueness scopes are probed independently: a duplicate Ingredient.sku returns ERR_DUPLICATE_SKU while duplicate Unit.code, Recipe.code and MenuItem.code all return ERR_DUPLICATE_CODE — and a Unit whose code equals an existing Recipe's code is ACCEPTED, proving the code scope is per entity type rather than global. A single global uniqueness table passes the four negative arms and fails the last one."
        test_recipe:
          setup:
            - "One Unit STORE-001 (MW), one Ingredient CHEDDAR-BLOCK, one DRAFT Recipe PLATE-GRILL and one DRAFT MenuItem MI-GRILL-MW on it. No feed and no roll-up are needed: every check here fires before any cost logic."
          setup_api_calls:
            - call: "POST /culinary/units"
              payload: { code: "STORE-001", name: "Downtown", region_code: "MW" }
              as: PlatformAdmin
              captures: { unit_id: $.data.id }
            - call: "POST /culinary/ingredients"
              payload: { sku: "CHEDDAR-BLOCK", name: "Cheddar Block", base_uom: "GRAM", pack_base_units: 2268, trim_yield_bps: 10000, cook_shrink_bps: 0, allergen_mask: 1, kcal_per_base_unit_micros: 4000000, sodium_mcg_per_base_unit: 6200 }
              as: RecipeDeveloper
              captures: { ched_id: $.data.id }
            - call: "POST /culinary/recipes"
              payload: { code: "PLATE-GRILL", name: "Grilled Cheese Plate", recipe_type: "PLATED", base_uom: "EACH", batch_yield_base_units: 4, portions_per_batch: 4 }
              as: RecipeDeveloper
              captures: { grill_id: $.data.id }
            - call: "POST /culinary/menu-items"
              payload: { code: "MI-GRILL-MW", name: "Grilled Cheese", recipe_id: "${grill_id}", region_code: "MW", current_price_cents: 400, target_food_cost_bps: 3000, declared_allergen_mask: 1 }
              as: RecipeDeveloper
              captures: { mi_id: $.data.id }
          trigger:
            - call: "POST /culinary/ingredients"
              payload: { sku: "CHEDDAR-BLOCK", name: "Cheddar Block Reprice", base_uom: "GRAM", pack_base_units: 4536, trim_yield_bps: 9000, cook_shrink_bps: 500, allergen_mask: 3, kcal_per_base_unit_micros: 4100000, sodium_mcg_per_base_unit: 6300 }
              as: RecipeDeveloper
              captures: { e_sku: $.data.error_id }
            - call: "POST /culinary/units"
              payload: { code: "STORE-001", name: "Downtown Annex", region_code: "SE" }
              as: PlatformAdmin
              captures: { e_unit: $.data.error_id }
            - call: "POST /culinary/recipes"
              payload: { code: "PLATE-GRILL", name: "Other Grilled Cheese", recipe_type: "SUB_RECIPE", base_uom: "GRAM", batch_yield_base_units: 1000, portions_per_batch: 10 }
              as: RecipeDeveloper
              captures: { e_recipe: $.data.error_id }
            - call: "POST /culinary/menu-items"
              payload: { code: "MI-GRILL-MW", name: "Grilled Cheese Again", recipe_id: "${grill_id}", region_code: "SE", current_price_cents: 500, target_food_cost_bps: 2800, declared_allergen_mask: 1 }
              as: RecipeDeveloper
              captures: { e_mi: $.data.error_id }
            - call: "POST /culinary/units"
              payload: { code: "PLATE-GRILL", name: "Unit Named Like A Recipe", region_code: "NE" }
              as: PlatformAdmin
              captures: { ok_unit: $.data.id, ok_code: $.data.code }
          assert:
            - "${e_sku} == ERR_DUPLICATE_SKU (409) — the sku collides even though every other field differs"
            - "${e_unit} == ERR_DUPLICATE_CODE (409) — a different region does not create a new code namespace"
            - "${e_recipe} == ERR_DUPLICATE_CODE (409) — a different recipe_type does not either"
            - "${e_mi} == ERR_DUPLICATE_CODE (409) — nor does a different region on a menu item"
            - "${ok_code} == PLATE-GRILL with a fresh ${ok_unit} — Unit.code and Recipe.code are separate namespaces, so the collision is per entity type"

      - name: cycle_detection_outranks_the_depth_limit_and_both_look_at_the_whole_dag
        claim_type: priority_ordering
        grounds:
          - validations[priority 34] ERR_RECIPE_CYCLE
          - validations[priority 35] ERR_RECIPE_DEPTH_EXCEEDED
          - constants.MAX_RECIPE_DEPTH
        distinguishing_aspect: "On a five-deep chain sitting exactly at MAX_RECIPE_DEPTH, adding the TOP recipe as a child of the BOTTOM one violates both rules at once — it closes a cycle and it would push the chain to depth 5 — and the cycle error must win. A third arm adds an unrelated recipe under the bottom of the chain: no cycle, but the transitive containers push past the limit, so ERR_RECIPE_DEPTH_EXCEEDED comes from a recipe the request never named. A fourth arm shows the limit is a max and not a sum: the same unrelated recipe attaches under SR4 without complaint."
        test_recipe:
          setup:
            - "Six DRAFT recipes with no ingredients at all: SR0 (unattached) and the chain SR2 contains SR1, SR3 contains SR2, SR4 contains SR3, SR5 contains SR4, each SUB_RECIPE component at ep 100. depth(SR1) == 0 ... depth(SR5) == 4 == MAX_RECIPE_DEPTH."
          setup_api_calls:
            - call: "POST /culinary/recipes"
              payload: { code: "SR0", name: "Spare Sauce", recipe_type: "SUB_RECIPE", base_uom: "MILLILITER", batch_yield_base_units: 1000, portions_per_batch: 10 }
              as: RecipeDeveloper
