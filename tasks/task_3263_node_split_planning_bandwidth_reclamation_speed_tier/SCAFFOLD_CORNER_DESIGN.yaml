# =============================================================================
# §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# Task: task_3263_node_split_planning_bandwidth_reclamation_speed_tier
#
# Breadth probe over §1.1-§1.7 claims not exercised by SCAFFOLD_DIFFICULTY_DESIGN.
# Corners already covered by §1.8 appear as excluded_because stubs.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: franchise_area_create_returns_defaults_and_computed_progress
        claim_type: Creation
        grounds:
          - entities.FranchiseArea
          - endpoints.POST_/franchise-areas
        distinguishing_aspect: "Creating a franchise area without blackout_windows applies the [] default, starts homes_built_progress at 0, version 1, and returns system id/created_at/updated_at."
        test_recipe:
          setup:
            - "Empty database; logical clock unset (default 2026-09-01T00:00:00Z)"
          setup_api_calls: []
          trigger:
            - call: "POST /franchise-areas"
              payload: { name: "Bay Franchise", region_code: "BF", obligation_homes_required: 12000, obligation_deadline: "2027-12-31T00:00:00Z" }
              as: PlatformAdmin
              captures: { fa: $.data.id }
          assert:
            - "response 201 with response_type object"
            - "FranchiseArea.${fa}.blackout_windows == [] (default applied)"
            - "FranchiseArea.${fa}.homes_built_progress == 0 and version == 1"
            - "response data carries non-null id, created_at, updated_at"

      - name: optical_node_retrieval_round_trips_stored_fields
        claim_type: Retrieval
        grounds:
          - entities.OpticalNode
          - endpoints.GET_/optical-nodes/{id}
        distinguishing_aspect: "Every stored OpticalNode field round-trips through GET, including the upstream_config enum given at creation."
        test_recipe:
          setup:
            - "Franchise area exists; node NE-RTRV created with upstream_config MID_SPLIT"
          setup_api_calls:
            - call: "POST /franchise-areas"
              payload: { name: "Bay Franchise", region_code: "BF", obligation_homes_required: 12000, obligation_deadline: "2027-12-31T00:00:00Z" }
              as: PlatformAdmin
              captures: { fa: $.data.id }
            - call: "POST /franchise-areas/${fa}/optical-nodes"
              payload: { node_code: "NE-RTRV", homes_passed: 450, downstream_spectrum_mhz: 96, upstream_config: "MID_SPLIT" }
              as: NetworkPlanner
              captures: { on: $.data.id }
          trigger:
            - call: "GET /optical-nodes/${on}"
              as: Any
          assert:
            - "OpticalNode.${on}.node_code == NE-RTRV, homes_passed == 450, downstream_spectrum_mhz == 96"
            - "OpticalNode.${on}.upstream_config == MID_SPLIT and status == ACTIVE"

      - name: spectrum_block_list_pagination_envelope
        claim_type: Listing
        grounds:
          - endpoints.GET_/optical-nodes/{id}/spectrum-blocks
          - response_envelope.pagination_fields
        distinguishing_aspect: "Listing blocks with limit 2 over 3 blocks returns pagination fields limit/offset/total_count/has_more with total_count 3 and has_more true."
        test_recipe:
          setup:
            - "Node NE-PG with 3 spectrum blocks (24, 24, 48)"
          setup_api_calls:
            - call: "POST /franchise-areas"
              payload: { name: "Bay Franchise", region_code: "BF", obligation_homes_required: 12000, obligation_deadline: "2027-12-31T00:00:00Z" }
              as: PlatformAdmin
              captures: { fa: $.data.id }
            - call: "POST /franchise-areas/${fa}/optical-nodes"
              payload: { node_code: "NE-PG", homes_passed: 100, downstream_spectrum_mhz: 96, upstream_config: "LEGACY" }
              as: NetworkPlanner
              captures: { on: $.data.id }
            - call: "POST /optical-nodes/${on}/spectrum-blocks"
              payload: { block_type: "LEGACY_VIDEO", mhz: 24 }
              as: CapacityEngineer
            - call: "POST /optical-nodes/${on}/spectrum-blocks"
              payload: { block_type: "LEGACY_VIDEO", mhz: 24 }
              as: CapacityEngineer
            - call: "POST /optical-nodes/${on}/spectrum-blocks"
              payload: { block_type: "DATA", mhz: 48 }
              as: CapacityEngineer
          trigger:
            - call: "GET /optical-nodes/${on}/spectrum-blocks?limit=2&offset=0"
              as: Any
          assert:
            - "response meta carries api_request_id and api_request_timestamp"
            - "response data has 2 entries; total_count == 3 and has_more == true"

      - name: get_missing_optical_node_returns_not_found
        claim_type: Not Found
        grounds:
          - errors[ERR_NOT_FOUND]
          - validations[priority=3]
        distinguishing_aspect: "GET with a well-formed but nonexistent node id returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup:
            - "Empty database"
          setup_api_calls: []
          trigger:
            - call: "GET /optical-nodes/00000000-0000-0000-0000-000000000000"
              as: Any
              captures: { err: $.data.error_id }
          assert:
            - "response 404 with error_id ERR_NOT_FOUND and response_type error"

      - name: service_group_create_missing_required_field_rejected
        claim_type: Required Fields
        grounds:
          - entities.ServiceGroup
          - errors[ERR_VALIDATION]
        distinguishing_aspect: "Omitting critical_threshold_pct from service-group creation returns 400 ERR_VALIDATION."
        test_recipe:
          setup:
            - "Node NE-RF exists"
          setup_api_calls:
            - call: "POST /franchise-areas"
              payload: { name: "Bay Franchise", region_code: "BF", obligation_homes_required: 12000, obligation_deadline: "2027-12-31T00:00:00Z" }
              as: PlatformAdmin
              captures: { fa: $.data.id }
            - call: "POST /franchise-areas/${fa}/optical-nodes"
              payload: { node_code: "NE-RF", homes_passed: 100, downstream_spectrum_mhz: 48, upstream_config: "LEGACY" }
              as: NetworkPlanner
              captures: { on: $.data.id }
          trigger:
            - call: "POST /optical-nodes/${on}/service-groups"
              payload: { sg_code: "SG-RF", homes_passed: 100, warn_threshold_pct: 70, utilization_method: "PEAK_PCT95" }
              as: CapacityEngineer
              captures: { err: $.data.error_id }
          assert:
            - "response 400 ERR_VALIDATION; no service group created"

      - name: complaint_reopen_count_default_zero
        claim_type: Defaults
        grounds:
          - entities.CongestionComplaint.fields.reopen_count
        distinguishing_aspect: "A freshly filed complaint carries reopen_count 0 and status INVESTIGATING without either being supplied in the request."
        test_recipe:
          setup:
            - "SG with one premise"
          setup_api_calls:
            - call: "POST /franchise-areas"
              payload: { name: "Bay Franchise", region_code: "BF", obligation_homes_required: 12000, obligation_deadline: "2027-12-31T00:00:00Z" }
              as: PlatformAdmin
              captures: { fa: $.data.id }
            - call: "POST /franchise-areas/${fa}/optical-nodes"
              payload: { node_code: "NE-DF", homes_passed: 100, downstream_spectrum_mhz: 48, upstream_config: "LEGACY" }
              as: NetworkPlanner
              captures: { on: $.data.id }
            - call: "POST /optical-nodes/${on}/spectrum-blocks"
              payload: { block_type: "DATA", mhz: 48 }
              as: CapacityEngineer
            - call: "POST /optical-nodes/${on}/service-groups"
              payload: { sg_code: "SG-DF", homes_passed: 100, warn_threshold_pct: 70, critical_threshold_pct: 85, utilization_method: "PEAK_PCT95" }
              as: CapacityEngineer
              captures: { sg: $.data.id }
            - call: "POST /service-groups/${sg}/customer-premises"
              payload: { premise_ref: "P-DF1", address: "1 Default Way" }
              as: ProvisioningAgent
              captures: { cp: $.data.id }
          trigger:
            - call: "POST /customer-premises/${cp}/congestion-complaints"
              payload: { description: "slow evenings", plant_signal: 50, home_signal: 30, destination_signal: 20 }
              as: CustomerCare
              captures: { cc: $.data.id }
          assert:
            - "CongestionComplaint.${cc}.reopen_count == 0 and status == INVESTIGATING"
            - "cause_category is null before classify"

      - name: spectrum_block_computed_channels_and_capacity
        claim_type: Computed Fields
        grounds:
          - entities.SpectrumBlock.fields.channels
          - entities.SpectrumBlock.fields.capacity_mbps
          - calculations.sg_downstream_capacity
        distinguishing_aspect: "A 25-MHz DATA block reports channels 4 and capacity_mbps 152 (per-block truncation discards the 1-MHz remainder); a same-size VIDEO block reports channels 4 but capacity_mbps 0."
        test_recipe:
          setup:
            - "Node NE-CMP with spectrum 98"
          setup_api_calls:
            - call: "POST /franchise-areas"
              payload: { name: "Bay Franchise", region_code: "BF", obligation_homes_required: 12000, obligation_deadline: "2027-12-31T00:00:00Z" }
              as: PlatformAdmin
              captures: { fa: $.data.id }
            - call: "POST /franchise-areas/${fa}/optical-nodes"
              payload: { node_code: "NE-CMP", homes_passed: 100, downstream_spectrum_mhz: 98, upstream_config: "LEGACY" }
              as: NetworkPlanner
              captures: { on: $.data.id }
            - call: "POST /optical-nodes/${on}/spectrum-blocks"
              payload: { block_type: "DATA", mhz: 25 }
              as: CapacityEngineer
              captures: { bd: $.data.id }
            - call: "POST /optical-nodes/${on}/spectrum-blocks"
              payload: { block_type: "LEGACY_VIDEO", mhz: 25 }
              as: CapacityEngineer
              captures: { bv: $.data.id }
          trigger:
            - call: "GET /spectrum-blocks/${bd}"
              as: Any
            - call: "GET /spectrum-blocks/${bv}"
              as: Any
          assert:
            - "SpectrumBlock.${bd}.channels == 4 and capacity_mbps == 152 and status == DATA_ACTIVE"
            - "SpectrumBlock.${bv}.channels == 4 and capacity_mbps == 0 and status == VIDEO_ACTIVE"

      - name: utilization_sample_is_append_only_without_version_field
        claim_type: Immutability
        grounds:
          - entities.UtilizationSample
        distinguishing_aspect: "UtilizationSample (common_fields false) carries id and created_at but no updated_at/version, and no update or delete endpoint exists for it."
        test_recipe:
          setup:
            - "SG-IM with one sample ingested"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /franchise-areas"
              payload: { name: "Bay Franchise", region_code: "BF", obligation_homes_required: 12000, obligation_deadline: "2027-12-31T00:00:00Z" }
              as: PlatformAdmin
              captures: { fa: $.data.id }
            - call: "POST /franchise-areas/${fa}/optical-nodes"
              payload: { node_code: "NE-IM", homes_passed: 100, downstream_spectrum_mhz: 48, upstream_config: "LEGACY" }
              as: NetworkPlanner
              captures: { on: $.data.id }
            - call: "POST /optical-nodes/${on}/spectrum-blocks"
              payload: { block_type: "DATA", mhz: 48 }
              as: CapacityEngineer
            - call: "POST /optical-nodes/${on}/service-groups"
              payload: { sg_code: "SG-IM", homes_passed: 100, warn_threshold_pct: 70, critical_threshold_pct: 85, utilization_method: "PEAK_PCT95" }
              as: CapacityEngineer
              captures: { sg: $.data.id }
            - call: "POST /service-groups/${sg}/utilization-samples"
              payload: { measured_at: "2026-09-30T18:00:00Z", downstream_mbps: 100, upstream_mbps: 5 }
              as: PlatformAdmin
          trigger:
            - call: "GET /service-groups/${sg}/utilization-samples"
              as: Any
          assert:
            - "the single sample entry has id, created_at, service_group_id, measured_at, downstream_mbps, upstream_mbps"
            - "the sample entry has no version and no updated_at member"

      - name: node_split_project_requires_existing_parent_action
        claim_type: Parent Relationships
        grounds:
          - entities.NodeSplitProject.fields.capacity_action_id
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "Creating a node-split project under a nonexistent capacity-action id returns 404 ERR_NOT_FOUND."
        test_recipe:
          setup:
            - "Empty database"
          setup_api_calls: []
          trigger:
            - call: "POST /capacity-actions/00000000-0000-0000-0000-000000000000/node-split-projects"
              payload: { child_count: 2, min_homes_per_child: 100, max_homes_per_child: 300 }
              as: NetworkPlanner
              captures: { err: $.data.error_id }
          assert:
            - "response 404 ERR_NOT_FOUND"

      - name: invalid_enum_value_on_block_type_rejected
        claim_type: Type Constraints
        grounds:
          - entities.SpectrumBlock.fields.block_type
          - errors[ERR_VALIDATION]
        distinguishing_aspect: "block_type SATELLITE is not in {LEGACY_VIDEO, DATA}; creation fails 400 ERR_VALIDATION."
        test_recipe:
          setup:
            - "Node NE-EN exists"
          setup_api_calls:
            - call: "POST /franchise-areas"
              payload: { name: "Bay Franchise", region_code: "BF", obligation_homes_required: 12000, obligation_deadline: "2027-12-31T00:00:00Z" }
              as: PlatformAdmin
              captures: { fa: $.data.id }
            - call: "POST /franchise-areas/${fa}/optical-nodes"
              payload: { node_code: "NE-EN", homes_passed: 100, downstream_spectrum_mhz: 48, upstream_config: "LEGACY" }
              as: NetworkPlanner
              captures: { on: $.data.id }
          trigger:
            - call: "POST /optical-nodes/${on}/spectrum-blocks"
              payload: { block_type: "SATELLITE", mhz: 24 }
              as: CapacityEngineer
              captures: { err: $.data.error_id }
          assert:
            - "response 400 ERR_VALIDATION"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: complaint_full_cycle_investigating_classified_resolved_reopen
        claim_type: Valid Transition
        grounds:
          - state_machines.CongestionComplaint
        distinguishing_aspect: "The full complaint cycle runs INVESTIGATING->CLASSIFIED->RESOLVED->INVESTIGATING->CLASSIFIED->RESOLVED->CLOSED with reopen_count 1 after the single reopen."
        test_recipe:
          setup:
            - "SG with premise; complaint signals 80/10/10 (EVIDENCE argmax PLANT)"
          setup_api_calls:
            - call: "POST /franchise-areas"
              payload: { name: "Bay Franchise", region_code: "BF", obligation_homes_required: 12000, obligation_deadline: "2027-12-31T00:00:00Z" }
              as: PlatformAdmin
              captures: { fa: $.data.id }
            - call: "POST /franchise-areas/${fa}/optical-nodes"
              payload: { node_code: "NE-CY", homes_passed: 100, downstream_spectrum_mhz: 48, upstream_config: "LEGACY" }
              as: NetworkPlanner
              captures: { on: $.data.id }
            - call: "POST /optical-nodes/${on}/spectrum-blocks"
              payload: { block_type: "DATA", mhz: 48 }
              as: CapacityEngineer
            - call: "POST /optical-nodes/${on}/service-groups"
              payload: { sg_code: "SG-CY", homes_passed: 100, warn_threshold_pct: 70, critical_threshold_pct: 85, utilization_method: "PEAK_PCT95" }
              as: CapacityEngineer
              captures: { sg: $.data.id }
            - call: "POST /service-groups/${sg}/customer-premises"
              payload: { premise_ref: "P-CY1", address: "1 Cycle Ct" }
              as: ProvisioningAgent
              captures: { cp: $.data.id }
            - call: "POST /customer-premises/${cp}/congestion-complaints"
              payload: { description: "evening slowdowns", plant_signal: 80, home_signal: 10, destination_signal: 10 }
              as: CustomerCare
              captures: { cc: $.data.id }
          trigger:
            - call: "POST /congestion-complaints/${cc}/classify"
              payload: { scoring_variant: "EVIDENCE_WEIGHTED", cause_category: "PLANT" }
              as: CustomerCare
            - call: "POST /congestion-complaints/${cc}/resolve"
              payload: { resolution_note: "node split proposed" }
              as: CustomerCare
            - call: "POST /congestion-complaints/${cc}/reopen"
              as: CustomerCare
            - call: "POST /congestion-complaints/${cc}/classify"
              payload: { scoring_variant: "EVIDENCE_WEIGHTED", cause_category: "PLANT" }
              as: CustomerCare
            - call: "POST /congestion-complaints/${cc}/resolve"
              payload: { resolution_note: "split scheduled" }
              as: CustomerCare
            - call: "POST /congestion-complaints/${cc}/close"
              as: CustomerCare
          assert:
            - "after first resolve: status RESOLVED and a SYSTEM PROPOSED NODE_SPLIT CapacityAction exists for ${sg}"
            - "after reopen: status INVESTIGATING, reopen_count == 1, cause_category null"
            - "after second classify+resolve+close: status CLOSED and reopen_count == 1"

      - name: capacity_action_complete_from_proposed_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.CapacityAction
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "POST complete on a PROPOSED action (never approved or begun) fails 409 ERR_INVALID_STATE and leaves status PROPOSED."
        test_recipe:
          setup:
            - "SG with a PROPOSED MID_SPLIT_UPGRADE action"
          setup_api_calls:
            - call: "POST /franchise-areas"
              payload: { name: "Bay Franchise", region_code: "BF", obligation_homes_required: 12000, obligation_deadline: "2027-12-31T00:00:00Z" }
              as: PlatformAdmin
              captures: { fa: $.data.id }
            - call: "POST /franchise-areas/${fa}/optical-nodes"
              payload: { node_code: "NE-IT", homes_passed: 100, downstream_spectrum_mhz: 48, upstream_config: "LEGACY" }
              as: NetworkPlanner
              captures: { on: $.data.id }
            - call: "POST /optical-nodes/${on}/spectrum-blocks"
              payload: { block_type: "DATA", mhz: 48 }
              as: CapacityEngineer
            - call: "POST /optical-nodes/${on}/service-groups"
              payload: { sg_code: "SG-IT", homes_passed: 100, warn_threshold_pct: 70, critical_threshold_pct: 85, utilization_method: "PEAK_PCT95" }
              as: CapacityEngineer
              captures: { sg: $.data.id, sg_v: $.data.version }
            - call: "POST /service-groups/${sg}/capacity-actions"
              payload: { action_type: "MID_SPLIT_UPGRADE", target_upstream_config: "MID_SPLIT", expected_service_group_version: "${sg_v}" }
              as: NetworkPlanner
              captures: { ca: $.data.id }
          trigger:
            - call: "POST /capacity-actions/${ca}/complete"
              as: CapacityEngineer
              captures: { err: $.data.error_id }
          assert:
            - "response 409 ERR_INVALID_STATE; CapacityAction.${ca}.status remains PROPOSED"

      - name: node_split_initial_state_is_permit_review
        claim_type: Initial State
        grounds:
          - state_machines.NodeSplitProject
        distinguishing_aspect: "A newly created node-split project starts in PERMIT_REVIEW (the permit application is filed at creation), not in a DRAFT or PLANNING state."
        test_recipe:
          setup:
            - "SG with PROPOSED NODE_SPLIT action"
          setup_api_calls:
            - call: "POST /franchise-areas"
              payload: { name: "Bay Franchise", region_code: "BF", obligation_homes_required: 12000, obligation_deadline: "2027-12-31T00:00:00Z" }
              as: PlatformAdmin
              captures: { fa: $.data.id }
            - call: "POST /franchise-areas/${fa}/optical-nodes"
              payload: { node_code: "NE-IS", homes_passed: 600, downstream_spectrum_mhz: 48, upstream_config: "LEGACY" }
              as: NetworkPlanner
              captures: { on: $.data.id }
            - call: "POST /optical-nodes/${on}/spectrum-blocks"
              payload: { block_type: "DATA", mhz: 48 }
              as: CapacityEngineer
            - call: "POST /optical-nodes/${on}/service-groups"
              payload: { sg_code: "SG-IS", homes_passed: 600, warn_threshold_pct: 70, critical_threshold_pct: 85, utilization_method: "PEAK_PCT95" }
              as: CapacityEngineer
              captures: { sg: $.data.id, sg_v: $.data.version }
            - call: "POST /service-groups/${sg}/capacity-actions"
              payload: { action_type: "NODE_SPLIT", expected_service_group_version: "${sg_v}" }
              as: NetworkPlanner
              captures: { ca: $.data.id }
          trigger:
            - call: "POST /capacity-actions/${ca}/node-split-projects"
              payload: { child_count: 2, min_homes_per_child: 200, max_homes_per_child: 400 }
              as: NetworkPlanner
              captures: { nsp: $.data.id }
          assert:
            - "NodeSplitProject.${nsp}.status == PERMIT_REVIEW"
            - "window_start and window_end are null until schedule"

      - name: terminal_completed_action_rejects_all_further_transitions
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.CapacityAction
        distinguishing_aspect: "A COMPLETED action rejects approve, begin, revise, complete, and cancel — every further transition — with 409 ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "Completed MID_SPLIT_UPGRADE action on SG-TL"
          setup_api_calls:
            - call: "POST /franchise-areas"
              payload: { name: "Bay Franchise", region_code: "BF", obligation_homes_required: 12000, obligation_deadline: "2027-12-31T00:00:00Z" }
              as: PlatformAdmin
              captures: { fa: $.data.id }
            - call: "POST /franchise-areas/${fa}/optical-nodes"
              payload: { node_code: "NE-TL", homes_passed: 100, downstream_spectrum_mhz: 48, upstream_config: "LEGACY" }
              as: NetworkPlanner
              captures: { on: $.data.id }
            - call: "POST /optical-nodes/${on}/spectrum-blocks"
              payload: { block_type: "DATA", mhz: 48 }
              as: CapacityEngineer
            - call: "POST /optical-nodes/${on}/service-groups"
              payload: { sg_code: "SG-TL", homes_passed: 100, warn_threshold_pct: 70, critical_threshold_pct: 85, utilization_method: "PEAK_PCT95" }
              as: CapacityEngineer
              captures: { sg: $.data.id, sg_v: $.data.version }
            - call: "POST /service-groups/${sg}/capacity-actions"
              payload: { action_type: "MID_SPLIT_UPGRADE", target_upstream_config: "MID_SPLIT", expected_service_group_version: "${sg_v}" }
              as: NetworkPlanner
              captures: { ca: $.data.id }
            - call: "POST /capacity-actions/${ca}/approve"
              as: CapacityEngineer
            - call: "POST /capacity-actions/${ca}/begin"
              as: CapacityEngineer
            - call: "POST /capacity-actions/${ca}/complete"
              as: CapacityEngineer
          trigger:
            - call: "POST /capacity-actions/${ca}/cancel"
              payload: { reason: "too late" }
              as: CapacityEngineer
              captures: { err1: $.data.error_id }
            - call: "POST /capacity-actions/${ca}/revise"
              payload: { note: "rework" }
              as: CapacityEngineer
              captures: { err2: $.data.error_id }
          assert:
            - "cancel responds 409 ERR_INVALID_STATE"
            - "revise responds 409 ERR_INVALID_STATE"
            - "CapacityAction.${ca}.status remains COMPLETED"

      - name: resolve_classified_plant_complaint_auto_proposes_node_split
        claim_type: Side Effect Execution
        grounds:
          - state_machines.CongestionComplaint.CLASSIFIED_to_RESOLVED
        distinguishing_aspect: "Resolving a PLANT-classified complaint creates a SYSTEM PROPOSED NODE_SPLIT capacity action on the premise's service group; resolving an IN_HOME-classified complaint creates none."
        test_recipe:
          setup:
            - "SG-SE with two premises; complaint A signals 90/5/5 (PLANT), complaint B signals 5/90/5 (IN_HOME)"
          setup_api_calls:
            - call: "POST /franchise-areas"
              payload: { name: "Bay Franchise", region_code: "BF", obligation_homes_required: 12000, obligation_deadline: "2027-12-31T00:00:00Z" }
              as: PlatformAdmin
              captures: { fa: $.data.id }
            - call: "POST /franchise-areas/${fa}/optical-nodes"
              payload: { node_code: "NE-SE", homes_passed: 100, downstream_spectrum_mhz: 48, upstream_config: "LEGACY" }
              as: NetworkPlanner
              captures: { on: $.data.id }
            - call: "POST /optical-nodes/${on}/spectrum-blocks"
              payload: { block_type: "DATA", mhz: 48 }
              as: CapacityEngineer
            - call: "POST /optical-nodes/${on}/service-groups"
              payload: { sg_code: "SG-SE", homes_passed: 100, warn_threshold_pct: 70, critical_threshold_pct: 85, utilization_method: "PEAK_PCT95" }
              as: CapacityEngineer
              captures: { sg: $.data.id }
            - call: "POST /service-groups/${sg}/customer-premises"
