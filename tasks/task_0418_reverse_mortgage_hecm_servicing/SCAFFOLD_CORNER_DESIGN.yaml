# =============================================================================
# §1.9 Scaffold Corner Design — Reverse Mortgage / HECM Servicing (task_0418)
# Breadth probe: every testable claim in §1.1–§1.7 that §1.8 does not already
# cover. Names are unique across the union with SCAFFOLD_DIFFICULTY_DESIGN.yaml.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  # Section 1 — Entities (creation, retrieval, listing, not-found, required
  # fields, computed/system fields, type constraints, immutability, FK parent)
  # ===========================================================================
  - section: entities
    instances:
      - name: create_lender_returns_201_with_all_fields_and_default_clock
        claim_type: Creation
        grounds:
          - entities.Lender
          - endpoints["POST /lenders"]
        distinguishing_aspect: "POST /lenders with name + hud_lending_limit_cents returns 201; response.data carries server-minted id and clock_utc defaulted to 1970-01-01T00:00:00.000Z (not supplied by client)."
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls: []
          trigger:
            - call: "POST /lenders"
              payload: { name: "Acme Servicing", hud_lending_limit_cents: 80000000 }
              as: ServicerOps
              captures: { lender_id: $.data.id }
          assert:
            - "HTTP status == 201"
            - "response_type == object"
            - "data.name == 'Acme Servicing'"
            - "data.hud_lending_limit_cents == 80000000"
            - "data.clock_utc == '1970-01-01T00:00:00.000Z'"
            - "data.id is a non-empty string"

      - name: get_loan_returns_stored_entity_by_id
        claim_type: Retrieval
        grounds:
          - entities.Loan
          - endpoints["GET /loans/{loanId}"]
        distinguishing_aspect: "GET /loans/{loanId} returns the exact loan persisted by POST /loans — borrower_id, appraised_value_cents, draw_type and id all match the created record."
        test_recipe:
          setup:
            - "A pre-origination loan exists."
          setup_api_calls:
            - call: "POST /lenders"
              payload: { name: "Get Loan Servicer", hud_lending_limit_cents: 80000000 }
              as: ServicerOps
              captures: { lender_id: $.data.id }
            - call: "POST /borrowers"
              payload: { lender_id: "${lender_id}", full_name: "Tom Borrower", birthdate: "1948-06-01" }
              as: ServicerOps
              captures: { borrower_id: $.data.id }
            - call: "POST /loans"
              payload: { lender_id: "${lender_id}", borrower_id: "${borrower_id}", appraised_value_cents: 30000000, expected_rate_bps: 500, draw_type: "LINE_OF_CREDIT" }
              as: ServicerOps
              captures: { loan_id: $.data.id }
          trigger:
            - call: "GET /loans/${loan_id}"
              payload: {}
              as: ServicerOps
          assert:
            - "HTTP status == 200"
            - "data.id == ${loan_id}"
            - "data.borrower_id == ${borrower_id}"
            - "data.appraised_value_cents == 30000000"
            - "data.draw_type == 'LINE_OF_CREDIT'"

      - name: list_loans_filtered_by_lender_id_returns_array_envelope
        claim_type: Listing
        grounds:
          - entities.Loan
          - endpoints["GET /loans"]
        distinguishing_aspect: "GET /loans?lender_id=... returns response_type array with only that lender's loans and pagination fields total_count/has_more present."
        test_recipe:
          setup:
            - "One lender with two loans created under it."
          setup_api_calls:
            - call: "POST /lenders"
              payload: { name: "List Servicer", hud_lending_limit_cents: 80000000 }
              as: ServicerOps
              captures: { lender_id: $.data.id }
            - call: "POST /borrowers"
              payload: { lender_id: "${lender_id}", full_name: "Una Borrower", birthdate: "1948-06-01" }
              as: ServicerOps
              captures: { borrower_id: $.data.id }
            - call: "POST /loans"
              payload: { lender_id: "${lender_id}", borrower_id: "${borrower_id}", appraised_value_cents: 30000000, expected_rate_bps: 500, draw_type: "LUMP_SUM" }
              as: ServicerOps
            - call: "POST /loans"
              payload: { lender_id: "${lender_id}", borrower_id: "${borrower_id}", appraised_value_cents: 40000000, expected_rate_bps: 500, draw_type: "LINE_OF_CREDIT" }
              as: ServicerOps
          trigger:
            - call: "GET /loans?lender_id=${lender_id}"
              payload: {}
              as: ServicerOps
          assert:
            - "HTTP status == 200"
            - "response_type == array"
            - "data is an array of length 2"
            - "meta/envelope exposes total_count == 2 and has_more == false"
            - "every element data[*].lender_id == ${lender_id}"

      - name: get_loan_nonexistent_id_returns_not_found
        claim_type: Not Found
        grounds:
          - entities.Loan
          - endpoints["GET /loans/{loanId}"]
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "GET /loans/{loanId} with an id that was never created returns 404 ERR_NOT_FOUND (priority-3 existence), not an empty object."
        test_recipe:
          setup:
            - "Empty DB (a lender exists only so the caller context is valid)."
          setup_api_calls:
            - call: "POST /lenders"
              payload: { name: "NF Servicer", hud_lending_limit_cents: 80000000 }
              as: ServicerOps
          trigger:
            - call: "GET /loans/loan_does_not_exist_0000"
              payload: {}
              as: ServicerOps
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "data.error_id == ERR_NOT_FOUND"

      - name: create_loan_missing_required_draw_type_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.Loan.fields.draw_type
          - endpoints["POST /loans"]
          - validations[priority=4]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "POST /loans omitting the required input field draw_type fails priority-4 well-formedness with 400 ERR_INVALID_REQUEST; no loan row is persisted."
        test_recipe:
          setup:
            - "A lender and borrower exist."
          setup_api_calls:
            - call: "POST /lenders"
              payload: { name: "Req Servicer", hud_lending_limit_cents: 80000000 }
              as: ServicerOps
              captures: { lender_id: $.data.id }
            - call: "POST /borrowers"
              payload: { lender_id: "${lender_id}", full_name: "Val Borrower", birthdate: "1948-06-01" }
              as: ServicerOps
              captures: { borrower_id: $.data.id }
          trigger:
            - call: "POST /loans"
              payload: { lender_id: "${lender_id}", borrower_id: "${borrower_id}", appraised_value_cents: 30000000, expected_rate_bps: 500 }
              as: ServicerOps
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 400"
            - "data.error_id == ERR_INVALID_REQUEST"

      - name: create_loan_invalid_draw_type_enum_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.Loan.fields.draw_type
          - endpoints["POST /loans"]
          - validations[priority=4]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "draw_type is an enum {LUMP_SUM, LINE_OF_CREDIT, TENURE, TERM}; a non-member value 'BALLOON' is rejected 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup:
            - "A lender and borrower exist."
          setup_api_calls:
            - call: "POST /lenders"
              payload: { name: "Enum Servicer", hud_lending_limit_cents: 80000000 }
              as: ServicerOps
              captures: { lender_id: $.data.id }
            - call: "POST /borrowers"
              payload: { lender_id: "${lender_id}", full_name: "Wes Borrower", birthdate: "1948-06-01" }
              as: ServicerOps
              captures: { borrower_id: $.data.id }
          trigger:
            - call: "POST /loans"
              payload: { lender_id: "${lender_id}", borrower_id: "${borrower_id}", appraised_value_cents: 30000000, expected_rate_bps: 500, draw_type: "BALLOON" }
              as: ServicerOps
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 400"
            - "data.error_id == ERR_INVALID_REQUEST"

      - name: create_lesa_non_positive_charge_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.LesaSetAside.fields.annual_property_charge_cents
          - endpoints["POST /lesa-set-asides"]
          - validations[priority=4]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "annual_property_charge_cents constraint is > 0; submitting 0 fails priority-4 amounts->0 check with 400 ERR_INVALID_REQUEST."
        test_recipe:
          setup:
            - "A pre-origination loan exists to attach the LESA to."
          setup_api_calls:
            - call: "POST /lenders"
              payload: { name: "Lesa Amt Servicer", hud_lending_limit_cents: 80000000 }
              as: ServicerOps
              captures: { lender_id: $.data.id }
            - call: "POST /borrowers"
              payload: { lender_id: "${lender_id}", full_name: "Xan Borrower", birthdate: "1948-06-01" }
              as: ServicerOps
              captures: { borrower_id: $.data.id }
            - call: "POST /loans"
              payload: { lender_id: "${lender_id}", borrower_id: "${borrower_id}", appraised_value_cents: 30000000, expected_rate_bps: 500, draw_type: "LINE_OF_CREDIT" }
              as: ServicerOps
              captures: { loan_id: $.data.id }
          trigger:
            - call: "POST /lesa-set-asides"
              payload: { loan_id: "${loan_id}", funding_mode: "FULLY_FUNDED", annual_property_charge_cents: 0, life_expectancy_years: 10 }
              as: ServicerOps
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 400"
            - "data.error_id == ERR_INVALID_REQUEST"

      - name: loan_computed_fields_ignore_client_supplied_values_on_origination
        claim_type: Computed Fields
        grounds:
          - entities.Loan.fields.max_claim_amount_cents
          - entities.Loan.fields.gross_principal_limit_cents
          - endpoints["POST /loans/{loanId}/originate"]
        distinguishing_aspect: "max_claim_amount_cents and gross_principal_limit_cents are source: computed; after origination they equal the formula result (max_claim = min(30000000, 80000000) = 30000000; gross = round_half_up(30000000 * 523000 / 1_000_000) = 15690000), independent of any client input."
        test_recipe:
          setup:
            - "Lender clock at 2024-01-01; PLF age 75 @ 500bps = 523000; borrower aged ~75."
          setup_api_calls:
            - call: "POST /lenders"
              payload: { name: "Computed Servicer", hud_lending_limit_cents: 80000000 }
              as: ServicerOps
              captures: { lender_id: $.data.id }
            - call: "POST /principal-limit-factors"
              payload: { lender_id: "${lender_id}", age: 75, expected_rate_bps: 500, factor_micros: 523000 }
              as: ServicerOps
            - call: "POST /loans/_clock/set"
              payload: { lender_id: "${lender_id}", to_iso8601: "2024-01-01T00:00:00.000Z" }
              as: ServicerOps
            - call: "POST /borrowers"
              payload: { lender_id: "${lender_id}", full_name: "Yin Borrower", birthdate: "1948-06-01" }
              as: ServicerOps
              captures: { borrower_id: $.data.id }
            - call: "POST /loans"
              payload: { lender_id: "${lender_id}", borrower_id: "${borrower_id}", appraised_value_cents: 30000000, expected_rate_bps: 500, draw_type: "LINE_OF_CREDIT" }
              as: ServicerOps
              captures: { loan_id: $.data.id }
          trigger:
            - call: "POST /loans/${loan_id}/originate"
              payload: {}
              as: ServicerOps
          assert:
            - "HTTP status == 200"
            - "data.max_claim_amount_cents == 30000000"
            - "data.principal_limit_factor_micros == 523000"
            - "data.gross_principal_limit_cents == 15690000"

      - name: create_loan_with_nonexistent_borrower_id_returns_not_found
        claim_type: Parent Relationships
        grounds:
          - entities.Loan.fields.borrower_id
          - endpoints["POST /loans"]
          - validations[priority=3]
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: "borrower_id is an FK -> Borrower.id; POST /loans referencing a borrower id that does not exist fails priority-3 existence with 404 ERR_NOT_FOUND (FK integrity)."
        test_recipe:
          setup:
            - "A lender exists; no borrower with the referenced id exists."
          setup_api_calls:
            - call: "POST /lenders"
              payload: { name: "FK Servicer", hud_lending_limit_cents: 80000000 }
              as: ServicerOps
              captures: { lender_id: $.data.id }
          trigger:
            - call: "POST /loans"
              payload: { lender_id: "${lender_id}", borrower_id: "borrower_missing_0000", appraised_value_cents: 30000000, expected_rate_bps: 500, draw_type: "LUMP_SUM" }
              as: ServicerOps
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 404"
            - "data.error_id == ERR_NOT_FOUND"

      - name: ledger_entry_immutable_no_update_or_version_field
        claim_type: Immutability
        grounds:
          - entities.LedgerEntry
          - endpoints["GET /ledger-entries"]
        distinguishing_aspect: "LedgerEntry is common_fields: false (append-only audit row): the §1.5 surface exposes only GET /ledger-entries, no POST/PATCH/version, and listed entries carry no version field."
        test_recipe:
          setup:
            - "An originated loan posts an INITIAL ADVANCE ledger entry."
          setup_api_calls:
            - call: "POST /lenders"
              payload: { name: "Ledger Servicer", hud_lending_limit_cents: 80000000 }
              as: ServicerOps
              captures: { lender_id: $.data.id }
            - call: "POST /principal-limit-factors"
              payload: { lender_id: "${lender_id}", age: 75, expected_rate_bps: 500, factor_micros: 523000 }
              as: ServicerOps
            - call: "POST /loans/_clock/set"
              payload: { lender_id: "${lender_id}", to_iso8601: "2024-01-01T00:00:00.000Z" }
              as: ServicerOps
            - call: "POST /borrowers"
              payload: { lender_id: "${lender_id}", full_name: "Zed Borrower", birthdate: "1948-06-01" }
              as: ServicerOps
              captures: { borrower_id: $.data.id }
            - call: "POST /loans"
              payload: { lender_id: "${lender_id}", borrower_id: "${borrower_id}", appraised_value_cents: 30000000, expected_rate_bps: 500, draw_type: "LINE_OF_CREDIT", initial_financed_costs_cents: 1000000 }
              as: ServicerOps
              captures: { loan_id: $.data.id }
            - call: "POST /loans/${loan_id}/originate"
              payload: {}
              as: ServicerOps
          trigger:
            - call: "GET /ledger-entries?loan_id=${loan_id}"
              payload: {}
              as: HudAuditor
          assert:
            - "HTTP status == 200"
            - "response_type == array"
            - "data is a non-empty array (>= 1 ADVANCE entry)"
            - "no element data[*] carries a 'version' field"
            - "data[0].entry_type == 'ADVANCE'"

  # ===========================================================================
  # Section 2 — State Machines (valid transition, precondition, invalid-from,
  # initial state, terminal lockdown, idempotency)
  # ===========================================================================
  - section: state_machines
    instances:
      - name: new_loan_starts_active_pre_origination_initial_state
        claim_type: Initial State
        grounds:
          - state_machines.Loan
          - entities.Loan.fields.disposition_status
          - entities.Loan.fields.origination_date
          - endpoints["POST /loans"]
        distinguishing_aspect: "A freshly created loan starts disposition_status=ACTIVE, servicing_status=CURRENT, origination_date=null and zero balances — the pre-origination initial state, before any origination side effects fire."
        test_recipe:
          setup:
            - "A lender and borrower exist."
          setup_api_calls:
            - call: "POST /lenders"
              payload: { name: "Init Servicer", hud_lending_limit_cents: 80000000 }
              as: ServicerOps
              captures: { lender_id: $.data.id }
            - call: "POST /borrowers"
              payload: { lender_id: "${lender_id}", full_name: "Amy Borrower", birthdate: "1948-06-01" }
              as: ServicerOps
              captures: { borrower_id: $.data.id }
          trigger:
            - call: "POST /loans"
              payload: { lender_id: "${lender_id}", borrower_id: "${borrower_id}", appraised_value_cents: 30000000, expected_rate_bps: 500, draw_type: "LINE_OF_CREDIT" }
              as: ServicerOps
          assert:
            - "HTTP status == 201"
            - "data.disposition_status == 'ACTIVE'"
            - "data.servicing_status == 'CURRENT'"
            - "data.origination_date == null"
            - "data.principal_balance_cents == 0"

      - name: originate_already_originated_loan_returns_already_originated
        claim_type: Idempotency
        grounds:
          - state_machines.Loan.transitions["(none)_to_ACTIVE"]
          - endpoints["POST /loans/{loanId}/originate"]
          - errors[ERR_ALREADY_ORIGINATED]
        distinguishing_aspect: "Origination is a one-shot transition guarded by origination_date null; a second POST /loans/{loanId}/originate on an already-originated loan returns 409 ERR_ALREADY_ORIGINATED with no re-computation."
        test_recipe:
          setup:
            - "An originated LINE_OF_CREDIT loan (origination_date set)."
          setup_api_calls:
            - call: "POST /lenders"
              payload: { name: "ReOrig Servicer", hud_lending_limit_cents: 80000000 }
              as: ServicerOps
              captures: { lender_id: $.data.id }
            - call: "POST /principal-limit-factors"
              payload: { lender_id: "${lender_id}", age: 75, expected_rate_bps: 500, factor_micros: 523000 }
              as: ServicerOps
            - call: "POST /loans/_clock/set"
              payload: { lender_id: "${lender_id}", to_iso8601: "2024-01-01T00:00:00.000Z" }
              as: ServicerOps
            - call: "POST /borrowers"
              payload: { lender_id: "${lender_id}", full_name: "Bea Borrower", birthdate: "1948-06-01" }
              as: ServicerOps
              captures: { borrower_id: $.data.id }
            - call: "POST /loans"
              payload: { lender_id: "${lender_id}", borrower_id: "${borrower_id}", appraised_value_cents: 30000000, expected_rate_bps: 500, draw_type: "LINE_OF_CREDIT", initial_financed_costs_cents: 1000000 }
              as: ServicerOps
              captures: { loan_id: $.data.id }
            - call: "POST /loans/${loan_id}/originate"
              payload: {}
              as: ServicerOps
          trigger:
            - call: "POST /loans/${loan_id}/originate"
              payload: {}
              as: ServicerOps
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "data.error_id == ERR_ALREADY_ORIGINATED"

      - name: approve_disbursement_from_rejected_state_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Disbursement.transitions.REQUESTED_to_REJECTED
          - state_machines.Disbursement.transitions.REQUESTED_to_APPROVED
          - endpoints["POST /disbursements/{disbursementId}/approve"]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "approve is defined only from REQUESTED; once a disbursement is REJECTED (terminal) the approve trigger is not in its transition list, so it returns 409 ERR_INVALID_STATE."
        test_recipe:
          setup:
            - "An originated LOC loan with a REJECTED LINE_DRAW disbursement."
          setup_api_calls:
            - call: "POST /lenders"
              payload: { name: "InvState Servicer", hud_lending_limit_cents: 80000000 }
              as: ServicerOps
              captures: { lender_id: $.data.id }
            - call: "POST /principal-limit-factors"
              payload: { lender_id: "${lender_id}", age: 75, expected_rate_bps: 500, factor_micros: 523000 }
              as: ServicerOps
            - call: "POST /loans/_clock/set"
              payload: { lender_id: "${lender_id}", to_iso8601: "2024-01-01T00:00:00.000Z" }
              as: ServicerOps
            - call: "POST /borrowers"
              payload: { lender_id: "${lender_id}", full_name: "Cam Borrower", birthdate: "1948-06-01" }
              as: ServicerOps
              captures: { borrower_id: $.data.id }
            - call: "POST /loans"
              payload: { lender_id: "${lender_id}", borrower_id: "${borrower_id}", appraised_value_cents: 30000000, expected_rate_bps: 500, draw_type: "LINE_OF_CREDIT", initial_financed_costs_cents: 1000000 }
              as: ServicerOps
              captures: { loan_id: $.data.id }
            - call: "POST /loans/${loan_id}/originate"
              payload: {}
              as: ServicerOps
            - call: "GET /loans/${loan_id}"
              payload: {}
              as: ServicerOps
              captures: { loan_v: $.data.version }
            - call: "POST /disbursements"
              payload: { loan_id: "${loan_id}", kind: "LINE_DRAW", requested_amount_cents: 100000 }
              as: ServicerOps
              captures: { disb_id: $.data.id }
            - call: "POST /disbursements/${disb_id}/reject"
              payload: {}
              as: ServicerOps
          trigger:
            - call: "POST /disbursements/${disb_id}/approve"
              payload: { expected_loan_version: "${loan_v}" }
              as: ServicerOps
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "data.error_id == ERR_INVALID_STATE"
            - "Disbursement.${disb_id}.status == REJECTED (unchanged)"

      - name: settle_resolution_twice_second_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Resolution.transitions.INITIATED_to_SETTLED
          - endpoints["POST /resolutions/{resolutionId}/settle"]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "SETTLED is terminal for Resolution; a second POST /resolutions/{resolutionId}/settle from SETTLED has no defined transition and returns 409 ERR_INVALID_STATE (no second TERMINATED cascade)."
        test_recipe:
          setup:
            - "A loan driven to DUE_AND_PAYABLE then IN_RESOLUTION via a PAYOFF resolution, already SETTLED."
          setup_api_calls:
            - call: "POST /lenders"
              payload: { name: "Settle Servicer", hud_lending_limit_cents: 80000000 }
              as: ServicerOps
              captures: { lender_id: $.data.id }
            - call: "POST /principal-limit-factors"
              payload: { lender_id: "${lender_id}", age: 75, expected_rate_bps: 500, factor_micros: 523000 }
              as: ServicerOps
            - call: "POST /loans/_clock/set"
              payload: { lender_id: "${lender_id}", to_iso8601: "2024-01-01T00:00:00.000Z" }
              as: ServicerOps
            - call: "POST /borrowers"
              payload: { lender_id: "${lender_id}", full_name: "Dot Borrower", birthdate: "1948-06-01" }
              as: ServicerOps
              captures: { borrower_id: $.data.id }
            - call: "POST /loans"
              payload: { lender_id: "${lender_id}", borrower_id: "${borrower_id}", appraised_value_cents: 30000000, expected_rate_bps: 500, draw_type: "LUMP_SUM", initial_financed_costs_cents: 1000000 }
              as: ServicerOps
              captures: { loan_id: $.data.id }
            - call: "POST /loans/${loan_id}/originate"
              payload: {}
              as: ServicerOps
            - call: "POST /maturity-events"
              payload: { loan_id: "${loan_id}", event_type: "SALE_OF_PROPERTY", event_date: "2024-06-01" }
              as: ComplianceOfficer
            - call: "POST /resolutions"
              payload: { loan_id: "${loan_id}", path: "PAYOFF" }
              as: ComplianceOfficer
              captures: { res_id: $.data.id }
            - call: "POST /resolutions/${res_id}/settle"
              payload: {}
              as: ComplianceOfficer
          trigger:
            - call: "POST /resolutions/${res_id}/settle"
              payload: {}
              as: ComplianceOfficer
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status == 409"
            - "data.error_id == ERR_INVALID_STATE"
            - "Resolution.${res_id}.status == SETTLED (unchanged)"

      - name: acknowledge_maturity_event_moves_recorded_to_acknowledged
        claim_type: Valid Transition
        grounds:
          - state_machines.MaturityEvent.transitions.RECORDED_to_ACKNOWLEDGED
          - endpoints["POST /maturity-events/{eventId}/acknowledge"]
