scenario: |
  Generate task harder than expert level!

  2654. Orphan Well Plugging Program (state oil and gas regulatory agency): well inventory with
  operator status, production history and orphan classification criteria, prioritization scoring by
  methane emissions, groundwater risk, proximity to populations and surface impacts, site access with
  surface owner agreements and legal authority for entry, plugging contractor procurement with bid
  evaluation and unit-cost contracts, plugging operations with cement placement, casing removal and
  documentation of downhole conditions, surface reclamation with equipment removal, pit closure and
  revegetation, funding administration across state funds, federal grants and forfeited bonds with
  reporting requirements, operator financial assurance reform and enforcement against transfers to
  insolvent operators
domain_name: "orphan-well-plugging-program"
api_prefix: "/"

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: quota_allocation
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - selector_policy
  entity_topology: graph
  # Wells, Operators and FundingSources form a graph: Operator is self-referential
  # (successor_operator_id), WellTransfer is a junction across two Operators and a Well, and
  # FundingAllocation is a many-to-many junction between PluggingJob and FundingSource. No single
  # ownership tree exists — a Well is reachable from an Operator, from a Solicitation's awarded
  # UnitCostContract, and from a FundingSource, by three different paths.
  state_machine_shape: cyclic
  # OrphanDetermination (SUBMITTED -> REVISION_REQUESTED -> SUBMITTED), PluggingJob
  # (FIELD_REPORTED -> REWORK_REQUIRED -> FIELD_REPORTED), Solicitation (EVALUATING -> OPEN),
  # Bid (RESPONSIVE <-> NONRESPONSIVE), ReclamationTask (IN_PROGRESS -> REWORK_NEEDED ->
  # IN_PROGRESS), GrantReport (REJECTED -> SUBMITTED), FundingSource (ACTIVE -> EXHAUSTED ->
  # ACTIVE) all cycle. Well additionally carries two independent state dimensions
  # (status x access_status) on the same row.
  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate
  role_model: segregation_of_duties
  # Three explicit SoD gates keyed on X-User-ID: the reviewer that decides an OrphanDetermination
  # cannot be its author; the AwardAuthority that awards a Solicitation cannot be the
  # ProcurementOfficer that created it; the FundingOfficer that disburses a FundingAllocation
  # cannot be the officer that committed it.
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

entities:
  - name: Operator
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: legal name of the oil and gas operator of record
      - name: region_code
        type: string
        source: input
        description: two-letter regulatory district code the operator is registered in
        constraints: exactly 2 uppercase letters
      - name: financial_assurance_tier
        type: enum
        source: input
        description: which financial-assurance variant governs this operator's required bond
        constraints: one of {BLANKET, INDIVIDUAL}
      - name: bond_amount_cents
        type: integer
        source: input
        description: financial assurance actually posted by the operator, in cents
        constraints: ">= 0"
      - name: status
        type: enum
        source: system
        description: regulatory standing; drives orphan classification and transfer eligibility
        default: ACTIVE
        constraints: one of {ACTIVE, DELINQUENT, INSOLVENT, REVOKED}
      - name: required_bond_cents
        type: integer
        source: computed
        description: output of calculations.operator_financial_assurance_requirement for this operator's current well inventory
      - name: active_well_count
        type: integer
        source: computed
        description: count of Wells with operator_id == this operator and status NOT IN {PLUGGED, RECLAIMED}
        default: 0
      - name: orphan_candidate_count
        type: integer
        source: computed
        description: count of Wells with operator_id == this operator and status IN {ORPHAN_CANDIDATE, ORPHAN_CONFIRMED, PLUGGING_SCHEDULED}
        default: 0
      - name: successor_operator_id
        type: string
        source: input
        description: "FK -> Operator.id; operator named as successor when this operator is declared INSOLVENT; null until then"
        default: null
      - name: insolvency_declared_at
        type: datetime
        source: system
        description: logical-clock instant at which enforcement declared this operator INSOLVENT; null otherwise
        default: null
      - name: bond_forfeited_at
        type: datetime
        source: system
        description: logical-clock instant at which this operator's bond was forfeited into a FundingSource; null otherwise
        default: null

  - name: Well
    parent: null
    common_fields: true
    fields:
      - name: api_well_number
        type: string
        source: input
        description: state API well number; unique across all wells
        constraints: unique, non-empty
      - name: operator_id
        type: string
        source: input
        description: "FK -> Operator.id; operator currently responsible for the well; reassigned only by an APPROVED WellTransfer"
      - name: spud_year
        type: integer
        source: input
        description: year the well was drilled
      - name: total_depth_ft
        type: integer
        source: input
        description: total measured depth in feet; selects the per-well financial assurance base amount
        constraints: "> 0"
      - name: casing_strings
        type: integer
        source: input
        description: number of casing strings in the wellbore; documented in plugging field reports
        constraints: ">= 0"
      - name: methane_scfd
        type: number
        source: input
        description: measured methane emission rate in standard cubic feet per day
        constraints: ">= 0"
      - name: groundwater_depth_ft
        type: integer
        source: input
        description: depth to the shallowest protected groundwater zone, in feet
        constraints: "> 0"
      - name: population_within_1000ft
        type: integer
        source: input
        description: number of residents within 1000 feet of the wellhead
        constraints: ">= 0"
      - name: surface_disturbance_acres
        type: number
        source: input
        description: acres of disturbed surface at the well site (pad, pit, access road)
        constraints: ">= 0"
      - name: last_production_month
        type: string
        source: input
        description: "latest month with reported production, format YYYY-MM; null when the well never produced"
        default: null
      - name: status
        type: enum
        source: system
        description: lifecycle dimension of the well (independent of access_status)
        default: PRODUCING
        constraints: one of {PRODUCING, INACTIVE, ORPHAN_CANDIDATE, ORPHAN_CONFIRMED, PLUGGING_SCHEDULED, PLUGGED, RECLAIMED}
      - name: access_status
        type: enum
        source: system
        description: site-access dimension of the well, mirroring the latest SiteAccess row; evolves independently of status
        default: NO_ACCESS_REQUESTED
        constraints: one of {NO_ACCESS_REQUESTED, ACCESS_PENDING, AGREEMENT_EXECUTED, ENTRY_ORDERED, ACCESS_DENIED}
      - name: screening_score
        type: number
        source: computed
        description: screening variant of calculations.orphan_priority_score, 2 decimal places
        default: 0
      - name: remediation_score
        type: number
        source: computed
        description: remediation variant of calculations.orphan_priority_score, 2 decimal places
        default: 0
      - name: idle_months
        type: integer
        source: computed
        description: whole calendar months from last_production_month to the logical clock month; 999 when last_production_month is null
        default: 999
      - name: cumulative_boe_60mo
        type: number
        source: computed
        description: trailing-60-month barrel-of-oil-equivalent production per calculations.orphan_classification_criteria, 2 decimal places
        default: 0
      - name: orphan_confirmed_at
        type: datetime
        source: system
        description: logical-clock instant at which an OrphanDetermination for this well reached CONFIRMED; null otherwise
        default: null

  - name: ProductionRecord
    parent: Well
    common_fields: false
    fields:
      - name: well_id
        type: string
        source: input
        description: "FK -> Well.id; well the production month belongs to"
      - name: month
        type: string
        source: input
        description: "production month, format YYYY-MM; unique per well"
        constraints: "matches ^\\d{4}-(0[1-9]|1[0-2])$"
      - name: oil_bbl
        type: number
        source: input
        description: reported oil volume for the month, in barrels
        constraints: ">= 0"
      - name: gas_mcf
        type: number
        source: input
        description: reported gas volume for the month, in thousand cubic feet
        constraints: ">= 0"
      - name: boe
        type: number
        source: computed
        description: "oil_bbl + gas_mcf / 6, unrounded at the row level; rounding happens once at the aggregate"
      - name: reported_by_user_id
        type: string
        source: system
        description: X-User-ID of the caller that appended the record (an Operator.id when the caller was an Operator, an opaque admin id when it was a ProgramAdmin)

  - name: OrphanDetermination
    parent: Well
    common_fields: true
    fields:
      - name: well_id
        type: string
        source: input
        description: "FK -> Well.id; well being classified"
      - name: inspector_notes
        type: string
        source: input
        description: field inspector's narrative supporting the orphan classification
      - name: status
        type: enum
        source: system
        description: determination review state; cycles between SUBMITTED and REVISION_REQUESTED
        default: DRAFT
        constraints: one of {DRAFT, SUBMITTED, REVISION_REQUESTED, CONFIRMED, REJECTED, SUPERSEDED}
      - name: revision_round
        type: integer
        source: system
        description: number of completed REVISION_REQUESTED -> SUBMITTED cycles
        default: 0
      - name: created_by_user_id
        type: string
        source: system
        description: X-User-ID of the FieldInspector that created the determination; the SoD gate compares this to the deciding reviewer
      - name: decided_by_user_id
        type: string
        source: system
        description: X-User-ID of the DeterminationReviewer that decided the determination; null before a decision
        default: null
      - name: snapshot_idle_months
        type: integer
        source: computed
        description: Well.idle_months frozen at the instant of the CONFIRM/REJECT decision
        default: null
      - name: snapshot_cumulative_boe_60mo
        type: number
        source: computed
        description: Well.cumulative_boe_60mo frozen at the instant of the CONFIRM/REJECT decision
        default: null
      - name: snapshot_screening_score
        type: number
        source: computed
        description: Well.screening_score frozen at the instant of the CONFIRM/REJECT decision
        default: null
      - name: decision_rationale
        type: string
        source: system
        description: rationale text supplied with the decision; null before a decision
        default: null
      - name: submitted_at
        type: datetime
        source: system
        description: logical-clock instant of the latest DRAFT/REVISION_REQUESTED -> SUBMITTED transition
        default: null
      - name: decided_at
        type: datetime
        source: system
        description: logical-clock instant of the CONFIRMED/REJECTED transition
        default: null

  - name: SiteAccess
    parent: Well
    common_fields: true
    fields:
      - name: well_id
        type: string
        source: input
        description: "FK -> Well.id; well the access request covers"
      - name: surface_owner_name
        type: string
        source: input
        description: surface owner named in the agreement or in the statutory entry notice
      - name: mode
        type: enum
        source: input
        description: whether access is sought by negotiated agreement or by statutory entry authority
        constraints: one of {AGREEMENT, STATUTORY_ENTRY}
      - name: waiting_period_days
        type: integer
        source: input
        description: statutory notice period in days before entry may be ordered
        default: null
        constraints: "0..180; when omitted defaults to 30 for mode STATUTORY_ENTRY and 0 for mode AGREEMENT"
      - name: compensation_cents
        type: integer
        source: input
        description: surface damage compensation offered to the surface owner, in cents
        default: 0
        constraints: ">= 0"
      - name: notice_sent_at
        type: datetime
        source: system
        description: logical-clock instant at which this request was created; start of the closed notice window
      - name: window_end_at
        type: datetime
        source: computed
        description: notice_sent_at plus waiting_period_days days; end of the closed notice window (inclusive)
      - name: status
        type: enum
        source: system
        description: access resolution state
        default: REQUESTED
        constraints: one of {REQUESTED, AGREEMENT_EXECUTED, ENTRY_ORDERED, DENIED}
      - name: legal_authority_citation
        type: string
        source: system
        description: statute citation recorded when entry is ordered without a surface owner agreement; null otherwise
        default: null
      - name: resolved_at
        type: datetime
        source: system
        description: logical-clock instant of the REQUESTED -> AGREEMENT_EXECUTED/ENTRY_ORDERED/DENIED transition
        default: null

  - name: WellTransfer
    parent: null
    common_fields: true
    fields:
      - name: well_id
        type: string
        source: input
        description: "FK -> Well.id; well whose operator of record would change"
      - name: from_operator_id
        type: string
        source: system
        description: "FK -> Operator.id; well.operator_id captured at request time"
      - name: to_operator_id
        type: string
        source: input
        description: "FK -> Operator.id; proposed transferee"
      - name: status
        type: enum
        source: system
        description: transfer review state; an APPROVED transfer can still be VOIDED by enforcement
        default: PENDING
        constraints: one of {PENDING, APPROVED, DENIED, VOIDED}
      - name: transferee_required_bond_cents
        type: integer
        source: computed
        description: forward-looking output of calculations.operator_financial_assurance_requirement for to_operator INCLUDING this well
        default: null
      - name: decided_by_user_id
        type: string
        source: system
        description: X-User-ID of the ProgramAdmin that approved, denied or voided the transfer
        default: null
      - name: approved_at
        type: datetime
        source: system
        description: logical-clock instant of the PENDING -> APPROVED transition; the 180-day void lookback is measured from it
        default: null
      - name: voided_at
        type: datetime
        source: system
        description: logical-clock instant of the APPROVED -> VOIDED transition
        default: null
      - name: void_reason
        type: string
        source: system
        description: "reason recorded on VOIDED; one of the literals TRANSFEREE_INSOLVENT (cascade) or MANUAL_VOID (direct action)"
        default: null

  - name: Contractor
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: plugging contractor's legal name
      - name: license_number
        type: string
        source: input
        description: state plugging contractor license number; unique
        constraints: unique, non-empty
      - name: bond_amount_cents
        type: integer
        source: input
        description: contractor performance bond posted with the agency, in cents
        constraints: ">= 0"
      - name: performance_score
        type: number
        source: input
        description: agency past-performance rating, 0..100
        constraints: "0 <= performance_score <= 100"
      - name: license_status
        type: enum
        source: system
        description: licensing standing; gates bid responsiveness and contract activity
        default: GOOD_STANDING
        constraints: one of {GOOD_STANDING, SUSPENDED, DEBARRED}
      - name: suspended_at
        type: datetime
        source: system
        description: logical-clock instant of the latest SUSPENDED/DEBARRED transition; null while GOOD_STANDING
        default: null

  - name: Solicitation
    parent: null
    common_fields: true
    fields:
      - name: region_code
        type: string
        source: input
        description: regulatory district the plugging work is solicited for
        constraints: exactly 2 uppercase letters
      - name: scope_description
        type: string
        source: input
        description: narrative scope of the plugging work being procured
      - name: bid_due_at
        type: datetime
        source: input
        description: bid submission deadline; bids are rejected once the logical clock passes it
      - name: ceiling_cents
        type: integer
        source: input
        description: ceiling in cents; a bid whose evaluated_unit_cost_cents exceeds it is rejected, and the value is copied onto the awarded UnitCostContract as its total obligation ceiling
        constraints: "> 0"
      - name: min_technical_score
        type: number
        source: input
        description: minimum technical score for a bid to be eligible for RESPONSIVE
        constraints: "0 <= min_technical_score <= 100"
      - name: status
        type: enum
        source: system
        description: procurement state; EVALUATING can cycle back to OPEN once
        default: DRAFT
        constraints: one of {DRAFT, OPEN, EVALUATING, AWARDED, CANCELLED}
      - name: reopen_round
        type: integer
        source: system
        description: number of completed EVALUATING -> OPEN cycles
        default: 0
      - name: created_by_user_id
        type: string
        source: system
        description: X-User-ID of the ProcurementOfficer that created the solicitation; the SoD gate compares this to the awarding AwardAuthority

  - name: Bid
    parent: Solicitation
    common_fields: true
    fields:
      - name: solicitation_id
        type: string
        source: input
        description: "FK -> Solicitation.id; solicitation this bid answers"
      - name: contractor_id
        type: string
        source: input
        description: "FK -> Contractor.id; bidding contractor; must equal the caller's X-User-ID"
      - name: cement_per_sack_cents
        type: integer
        source: input
        description: unit price per sack of cement placed, in cents
        constraints: "> 0"
      - name: rig_day_rate_cents
        type: integer
        source: input
        description: unit price per rig day, in cents
        constraints: "> 0"
      - name: casing_per_ft_cents
        type: integer
        source: input
        description: unit price per foot of casing removed, in cents
        constraints: "> 0"
      - name: mobilization_fee_cents
        type: integer
        source: input
        description: lump-sum mobilization fee per job, in cents
        constraints: "> 0"
      - name: technical_score
        type: number
        source: input
        description: technical evaluation score assigned by the ProcurementOfficer at submission, 0..100
        constraints: "0 <= technical_score <= 100"
      - name: evaluated_unit_cost_cents
        type: integer
        source: computed
        description: standard-basket cost per calculations.bid_composite_score step 1
      - name: price_score
        type: number
        source: computed
        description: 0..100 price score per calculations.bid_composite_score step 3; null until the award pass runs
        default: null
      - name: composite_score
        type: number
        source: computed
        description: weighted price/technical score per calculations.bid_composite_score step 4; null until the award pass runs
        default: null
      - name: status
        type: enum
        source: system
        description: responsiveness and award state; RESPONSIVE and NONRESPONSIVE can flip back and forth until award
        default: SUBMITTED
        constraints: one of {SUBMITTED, RESPONSIVE, NONRESPONSIVE, AWARDED, NOT_AWARDED}
      - name: evaluated_by_user_id
        type: string
        source: system
        description: X-User-ID of the ProcurementOfficer that last set responsiveness; null while SUBMITTED
        default: null
      - name: nonresponsive_reason
        type: string
        source: system
        description: reason recorded when the bid is marked NONRESPONSIVE; null otherwise
        default: null

  - name: UnitCostContract
    parent: null
    common_fields: true
    fields:
      - name: solicitation_id
        type: string
        source: system
        description: "FK -> Solicitation.id; solicitation that produced this contract"
      - name: contractor_id
        type: string
        source: system
        description: "FK -> Contractor.id; awarded contractor"
      - name: winning_bid_id
        type: string
        source: system
        description: "FK -> Bid.id; bid the award pass selected"
      - name: cement_per_sack_cents
        type: integer
        source: system
        description: unit price copied from the winning bid
      - name: rig_day_rate_cents
        type: integer
        source: system
        description: unit price copied from the winning bid
      - name: casing_per_ft_cents
        type: integer
        source: system
        description: unit price copied from the winning bid
      - name: mobilization_fee_cents
        type: integer
        source: system
        description: lump-sum mobilization fee copied from the winning bid
      - name: ceiling_cents
        type: integer
        source: system
        description: obligation ceiling copied from Solicitation.ceiling_cents
      - name: obligated_cents
        type: integer
        source: computed
        description: sum over PluggingJobs on this contract of max(plugging_cost_estimate_cents, actual_cost_cents)
        default: 0
      - name: status
        type: enum
        source: system
        description: contract availability; SUSPENDED while the contractor is not GOOD_STANDING, CLOSED once fully obligated
        default: ACTIVE
        constraints: one of {ACTIVE, SUSPENDED, CLOSED}
      - name: awarded_by_user_id
        type: string
        source: system
        description: X-User-ID of the AwardAuthority that made the award

  - name: PluggingJob
    parent: null
    common_fields: true
    fields:
      - name: well_id
        type: string
        source: input
        description: "FK -> Well.id; well to be plugged"
      - name: contract_id
        type: string
        source: input
        description: "FK -> UnitCostContract.id; unit-cost contract the work is ordered under"
      - name: scheduled_start
        type: datetime
        source: input
        description: start of the contractor crew occupation window (half-open interval start)
      - name: planned_cement_sacks
        type: integer
        source: input
        description: planned sacks of cement for plug placement
        constraints: "> 0"
      - name: planned_rig_days
        type: integer
        source: input
        description: planned rig days; crew window length is planned_rig_days + CREW_DEMOB_BUFFER_DAYS
        constraints: "> 0"
      - name: planned_casing_ft
        type: integer
        source: input
        description: planned feet of casing to be removed
        constraints: ">= 0"
      - name: plugging_cost_estimate_cents
        type: integer
        source: computed
        description: output of calculations.plugging_cost_estimate at job creation, in cents
      - name: crew_window_end_at
        type: datetime
        source: computed
        description: scheduled_start plus (planned_rig_days + CREW_DEMOB_BUFFER_DAYS) days, where CREW_DEMOB_BUFFER_DAYS is 2; exclusive end of the crew occupation interval
      - name: status
        type: enum
        source: system
        description: field-operations state; FIELD_REPORTED can cycle back through REWORK_REQUIRED
        default: SCHEDULED
        constraints: one of {SCHEDULED, MOBILIZED, FIELD_REPORTED, REWORK_REQUIRED, PLUGGED, RECLAIMED}
      - name: rework_round
        type: integer
        source: system
        description: number of completed FIELD_REPORTED -> REWORK_REQUIRED -> FIELD_REPORTED cycles
        default: 0
      - name: cement_sacks_used
        type: integer
        source: system
        description: sacks of cement placed in the most recent field report; null before the first report
        default: null
      - name: rig_days_used
        type: integer
        source: system
        description: rig days consumed in the most recent field report; null before the first report
        default: null
      - name: casing_removed_ft
        type: integer
        source: system
        description: feet of casing removed in the most recent field report; null before the first report
        default: null
      - name: downhole_conditions
        type: string
        source: system
        description: narrative documentation of downhole conditions from the most recent field report; null before the first report
        default: null
      - name: plug_intervals
        type: array
        source: system
        description: "array of objects {top_ft, bottom_ft, sacks} documenting cement placement from the most recent field report; null before the first report"
        default: null
      - name: last_round_cost_cents
        type: integer
        source: computed
        description: cost of the most recent field-report round per calculations.plugging_actual_cost
        default: null
      - name: actual_cost_cents
        type: integer
        source: computed
        description: cumulative cost across all field-report rounds per calculations.plugging_actual_cost
        default: 0
      - name: funded_cents
        type: integer
        source: computed
        description: sum of FundingAllocation.allocated_cents for this job with status IN {COMMITTED, DISBURSED}
        default: 0
      - name: mobilized_at
        type: datetime
        source: system
        description: logical-clock instant of the SCHEDULED -> MOBILIZED transition
        default: null
      - name: plugging_accepted_at
        type: datetime
        source: system
        description: logical-clock instant of the FIELD_REPORTED -> PLUGGED transition; the revegetation waiting period is measured from it
        default: null
      - name: reclaimed_at
        type: datetime
        source: system
        description: logical-clock instant of the PLUGGED -> RECLAIMED transition
        default: null

  - name: ReclamationTask
    parent: PluggingJob
    common_fields: true
    fields:
      - name: job_id
        type: string
        source: input
        description: "FK -> PluggingJob.id; plugging job whose surface reclamation this task covers"
      - name: task_type
        type: enum
        source: system
        description: which surface reclamation step this row tracks; the three rows are created together on plugging acceptance
        constraints: one of {EQUIPMENT_REMOVAL, PIT_CLOSURE, REVEGETATION}
      - name: status
        type: enum
        source: system
        description: inspection state; a failed inspection cycles back through REWORK_NEEDED
        default: PENDING
        constraints: one of {PENDING, IN_PROGRESS, COMPLETE, REWORK_NEEDED}
      - name: inspection_round
        type: integer
        source: system
        description: number of completed IN_PROGRESS -> REWORK_NEEDED -> IN_PROGRESS cycles
        default: 0
      - name: inspected_by_user_id
        type: string
        source: system
        description: X-User-ID of the FieldInspector that last inspected the task; null before the first inspection
        default: null
      - name: notes
        type: string
        source: system
        description: inspector notes from the latest progress call; null when none supplied
        default: null
      - name: completed_at
        type: datetime
        source: system
        description: logical-clock instant of the IN_PROGRESS -> COMPLETE transition
        default: null

  - name: FundingSource
    parent: null
    common_fields: true
    fields:
      - name: kind
        type: enum
        source: input
        description: funding stream; also fixes the waterfall rank (FORFEITED_BOND 1, FEDERAL_GRANT 2, STATE_FUND 3)
        constraints: one of {STATE_FUND, FEDERAL_GRANT, FORFEITED_BOND}
      - name: name
        type: string
        source: input
        description: appropriation, grant or forfeiture identifier
      - name: authorized_cents
        type: integer
        source: input
        description: total authorized amount, in cents
        constraints: "> 0"
      - name: committed_cents
        type: integer
        source: computed
        description: sum of FundingAllocation.allocated_cents against this source with status IN {COMMITTED, DISBURSED}
        default: 0
      - name: disbursed_cents
        type: integer
        source: computed
        description: sum of FundingAllocation.disbursed_cents against this source with status == DISBURSED
        default: 0
      - name: expires_at
        type: datetime
        source: input
        description: obligation expiry; a source is EXPIRED once the logical clock is strictly after this instant
      - name: federal_match_required_pct
        type: integer
        source: input
        description: non-federal match percentage the grant requires; required for kind FEDERAL_GRANT, must be omitted or null otherwise
        default: null
        constraints: "0..100"
      - name: allowable_cost_categories
        type: array
        source: input
        description: "array of enum values from {PLUGGING, RECLAMATION, ADMIN}; a source is eligible for plugging commitments only when PLUGGING is present"
      - name: bond_operator_id
        type: string
        source: input
        description: "FK -> Operator.id; operator whose forfeited bond created this source; required for kind FORFEITED_BOND, null otherwise"
        default: null
      - name: status
        type: enum
        source: system
        description: availability state; EXHAUSTED when committed_cents == authorized_cents, EXPIRED once the clock passes expires_at
        default: ACTIVE
        constraints: one of {ACTIVE, EXHAUSTED, EXPIRED}
      - name: reporting_required
        type: boolean
        source: computed
        description: true when kind == FEDERAL_GRANT, false otherwise; GrantReport rows may only be generated for sources where this is true
        default: false

  - name: FundingAllocation
    parent: null
    common_fields: true
    fields:
      - name: job_id
        type: string
        source: system
        description: "FK -> PluggingJob.id; job the commitment funds"
      - name: source_id
        type: string
        source: system
        description: "FK -> FundingSource.id; source the cents are obligated against"
      - name: allocated_cents
        type: integer
        source: computed
        description: cents obligated to this source by calculations.job_funding_waterfall
      - name: disbursed_cents
        type: integer
        source: system
        description: cents actually paid out against this allocation
        default: 0
      - name: waterfall_rank
        type: integer
        source: computed
        description: 1-based position this source occupied in the waterfall pass that created the row
      - name: status
        type: enum
        source: system
        description: obligation state
        default: COMMITTED
        constraints: one of {COMMITTED, DISBURSED, DEOBLIGATED}
      - name: committed_by_user_id
        type: string
        source: system
        description: X-User-ID of the FundingOfficer that ran the commitment pass; the SoD gate compares this to the disbursing officer
      - name: disbursed_by_user_id
        type: string
        source: system
        description: X-User-ID of the FundingOfficer that disbursed the allocation; null until disbursement
        default: null
      - name: disbursed_at
        type: datetime
        source: system
        description: logical-clock instant of the COMMITTED -> DISBURSED transition
        default: null
      - name: deobligated_at
        type: datetime
        source: system
        description: logical-clock instant of the COMMITTED -> DEOBLIGATED transition
        default: null

  - name: GrantReport
    parent: FundingSource
    common_fields: true
    fields:
      - name: source_id
        type: string
        source: input
        description: "FK -> FundingSource.id; federal grant being reported on"
      - name: period_start
        type: string
        source: input
        description: "inclusive first day of the reporting period, format YYYY-MM-DD"
      - name: period_end
        type: string
        source: input
        description: "inclusive last day of the reporting period, format YYYY-MM-DD"
      - name: wells_plugged_count
        type: integer
        source: computed
        description: count per calculations.grant_report_figures
      - name: reported_cost_cents
        type: integer
        source: computed
        description: federal cents disbursed inside the window per calculations.grant_report_figures
      - name: federal_share_pct
        type: number
        source: computed
        description: federal share of total disbursed project cost inside the window, 2 decimal places
      - name: status
        type: enum
        source: system
        description: reporting state; a REJECTED report can be resubmitted
        default: DUE
        constraints: one of {DUE, SUBMITTED, ACCEPTED, REJECTED}
      - name: revision_round
        type: integer
        source: system
        description: number of completed REJECTED -> SUBMITTED cycles
        default: 0
      - name: submitted_by_user_id
        type: string
        source: system
        description: X-User-ID of the FundingOfficer that submitted the report; null while DUE
        default: null
      - name: reviewer_note
        type: string
        source: system
        description: note recorded on ACCEPT/REJECT; null before review
        default: null

state_machines:
  - entity: Operator
    dimension: status
    initial_state: ACTIVE
    terminal_states: [REVOKED]
    transitions:
      - from: ACTIVE
        to: DELINQUENT
        trigger: "system, on any recompute of required_bond_cents (well created under this operator, WellTransfer APPROVED/VOIDED touching this operator, Well reaching PLUGGED or RECLAIMED)"
        actor: system
        preconditions: ["bond_amount_cents < required_bond_cents after the recompute"]
        side_effects:
          - "sets status = DELINQUENT"
          - "increments Operator.version by 1"
        note: "boundary is strict: bond_amount_cents == required_bond_cents keeps the operator ACTIVE"
      - from: DELINQUENT
        to: ACTIVE
        trigger: "system, on any recompute of required_bond_cents (same triggers as ACTIVE -> DELINQUENT)"
        actor: system
        preconditions: ["bond_amount_cents >= required_bond_cents after the recompute"]
        side_effects:
          - "sets status = ACTIVE"
          - "increments Operator.version by 1"
        note: "auto-cure; the compensating direction of the deficiency rule"
      - from: ACTIVE
        to: INSOLVENT
        trigger: "POST /operators/{id}/enforcement with action DECLARE_INSOLVENT"
        actor: ProgramAdmin
        preconditions:
          - "status IN {ACTIVE, DELINQUENT}"
          - "expected_operator_version equals the operator's current version"
        side_effects:
          - "sets status = INSOLVENT, insolvency_declared_at = logical clock, successor_operator_id = payload successor_operator_id when supplied"
          - "CASCADE hop 1: every WellTransfer with to_operator_id == this operator, status == APPROVED and approved_at >= (logical clock - TRANSFER_VOID_LOOKBACK_DAYS days) transitions APPROVED -> VOIDED with void_reason = TRANSFEREE_INSOLVENT"
          - "CASCADE hop 2 (caused by hop 1): each voided transfer resets Well.operator_id back to that transfer's from_operator_id and increments Well.version by 1"
          - "CASCADE hop 3 (caused by hop 2): active_well_count, orphan_candidate_count and required_bond_cents are recomputed for both the reverting from_operator and this operator"
          - "CASCADE hop 4 (caused by hop 3): each recomputed operator whose bond_amount_cents < required_bond_cents and status == ACTIVE transitions ACTIVE -> DELINQUENT"
          - "increments Operator.version by 1"
      - from: DELINQUENT
        to: INSOLVENT
        trigger: "POST /operators/{id}/enforcement with action DECLARE_INSOLVENT"
        actor: ProgramAdmin
        preconditions:
          - "status IN {ACTIVE, DELINQUENT}"
          - "expected_operator_version equals the operator's current version"
        side_effects:
          - "identical to the ACTIVE -> INSOLVENT transition, including CASCADE hops 1-4"
      - from: DELINQUENT
        to: REVOKED
        trigger: "POST /operators/{id}/enforcement with action REVOKE"
        actor: ProgramAdmin
        preconditions:
          - "status == DELINQUENT"
          - "expected_operator_version equals the operator's current version"
        side_effects:
          - "sets status = REVOKED"
          - "CASCADE: every Well with operator_id == this operator and status IN {PRODUCING, INACTIVE} transitions to ORPHAN_CANDIDATE, then each such well's screening_score and remediation_score are recomputed, then orphan_candidate_count is recomputed"
          - "increments Operator.version by 1"
      - from: INSOLVENT
        to: REVOKED
        trigger: "POST /operators/{id}/enforcement with action FORFEIT_BOND"
        actor: ProgramAdmin
        preconditions:
          - "status == INSOLVENT"
          - "bond_forfeited_at IS NULL"
          - "bond_amount_cents > 0"
          - "expected_operator_version equals the operator's current version"
        side_effects:
          - "CASCADE hop 1: creates a FundingSource with kind = FORFEITED_BOND, name = 'FORFEITED BOND ' || operator.name, authorized_cents = operator.bond_amount_cents, bond_operator_id = operator.id, allowable_cost_categories = [PLUGGING, RECLAMATION], expires_at = logical clock + FORFEITED_BOND_TERM_DAYS days, status = ACTIVE"
          - "CASCADE hop 2 (caused by hop 1): sets bond_amount_cents = 0 and bond_forfeited_at = logical clock, because the posted assurance now lives in the new FundingSource"
          - "CASCADE hop 3 (caused by hop 2): recomputes required_bond_cents against the zeroed bond and sets status = REVOKED (an insolvent operator with no remaining assurance loses its permit)"
          - "CASCADE hop 4 (caused by hop 3): every Well with operator_id == this operator and status IN {PRODUCING, INACTIVE} transitions to ORPHAN_CANDIDATE, each such well's screening_score and remediation_score are recomputed, and orphan_candidate_count is recomputed"
          - "increments Operator.version by 1"

  - entity: Well
    dimension: status
    initial_state: PRODUCING
    terminal_states: [RECLAIMED]
    transitions:
      - from: PRODUCING
        to: INACTIVE
        trigger: "system, on POST /wells/{id}/orphan-determinations (determination creation reclassifies the inventory record)"
        actor: system
        preconditions: ["idle_months >= WELL_INACTIVE_IDLE_MONTHS"]
        side_effects:
          - "sets status = INACTIVE"
          - "recomputes idle_months, cumulative_boe_60mo, screening_score and remediation_score"
          - "increments Well.version by 1"
      - from: PRODUCING
        to: ORPHAN_CANDIDATE
        trigger: "system, on POST /orphan-determinations/{id}/submit, or cascade from Operator DELINQUENT -> REVOKED / INSOLVENT -> REVOKED"
        actor: system
        preconditions: ["status IN {PRODUCING, INACTIVE}"]
        side_effects:
          - "sets status = ORPHAN_CANDIDATE"
          - "recomputes screening_score and remediation_score"
          - "recomputes the owning Operator's orphan_candidate_count"
          - "increments Well.version by 1"
      - from: INACTIVE
        to: ORPHAN_CANDIDATE
        trigger: "system, on POST /orphan-determinations/{id}/submit, or cascade from Operator DELINQUENT -> REVOKED / INSOLVENT -> REVOKED"
        actor: system
        preconditions: ["status IN {PRODUCING, INACTIVE}"]
        side_effects:
          - "identical to the PRODUCING -> ORPHAN_CANDIDATE transition"
      - from: ORPHAN_CANDIDATE
        to: ORPHAN_CONFIRMED
        trigger: "system, on POST /orphan-determinations/{id}/decision with action CONFIRM"
        actor: system
        preconditions:
          - "status == ORPHAN_CANDIDATE"
          - "all orphan classification criteria in calculations.orphan_classification_criteria hold"
        side_effects:
          - "sets status = ORPHAN_CONFIRMED and orphan_confirmed_at = logical clock"
          - "recomputes remediation_score (the score that orders remediation work)"
          - "increments Well.version by 1"
      - from: ORPHAN_CANDIDATE
        to: INACTIVE
        trigger: "system, on POST /orphan-determinations/{id}/decision with action REJECT"
        actor: system
        preconditions: ["status == ORPHAN_CANDIDATE"]
        side_effects:
          - "sets status = INACTIVE (compensates the submit-time promotion)"
          - "recomputes the owning Operator's orphan_candidate_count"
          - "increments Well.version by 1"
      - from: ORPHAN_CONFIRMED
        to: PLUGGING_SCHEDULED
        trigger: "POST /plugging-jobs"
        actor: ProgramAdmin
        preconditions:
          - "status == ORPHAN_CONFIRMED"
          - "no PluggingJob with this well_id and status NOT IN {RECLAIMED} exists"
        side_effects:
          - "sets status = PLUGGING_SCHEDULED"
          - "increments Well.version by 1"
      - from: PLUGGING_SCHEDULED
        to: PLUGGED
        trigger: "system, on POST /plugging-jobs/{id}/review with action ACCEPT"
        actor: system
        preconditions: ["status == PLUGGING_SCHEDULED"]
        side_effects:
          - "CASCADE hop 1: sets status = PLUGGED"
          - "CASCADE hop 2 (caused by hop 1): the owning Operator's active_well_count and required_bond_cents are recomputed, because a plugged well no longer requires assurance"
          - "CASCADE hop 3 (caused by hop 2): if the operator's status == DELINQUENT and bond_amount_cents >= the new required_bond_cents, the operator transitions DELINQUENT -> ACTIVE"
          - "increments Well.version by 1"
      - from: PLUGGED
        to: RECLAIMED
        trigger: "system, on the ReclamationTask progress call that makes all three tasks of the job COMPLETE"
        actor: system
        preconditions:
          - "status == PLUGGED"
          - "all three ReclamationTask rows for the well's PluggingJob have status == COMPLETE"
        side_effects:
          - "sets status = RECLAIMED"
          - "recomputes the owning Operator's active_well_count and required_bond_cents"
          - "increments Well.version by 1"

  - entity: Well
    dimension: access_status
    initial_state: NO_ACCESS_REQUESTED
    terminal_states: []
    transitions:
      - from: NO_ACCESS_REQUESTED
        to: ACCESS_PENDING
        trigger: "POST /wells/{id}/site-accesses"
        actor: ProgramAdmin
        preconditions: ["no SiteAccess row for this well has status == REQUESTED"]
        side_effects:
          - "sets access_status = ACCESS_PENDING (mirror of the new SiteAccess row)"
          - "increments Well.version by 1"
        note: "independent of the status dimension: a well can be ACCESS_PENDING while still PRODUCING"
      - from: ACCESS_DENIED
        to: ACCESS_PENDING
        trigger: "POST /wells/{id}/site-accesses (a fresh access attempt after a denial)"
        actor: ProgramAdmin
        preconditions:
          - "no SiteAccess row for this well has status == REQUESTED"
          - "the closed notice window of every SiteAccess row with status IN {REQUESTED, DENIED} has ended before the logical clock"
        side_effects:
          - "sets access_status = ACCESS_PENDING"
          - "increments Well.version by 1"
      - from: ACCESS_PENDING
        to: AGREEMENT_EXECUTED
        trigger: "system, on POST /site-accesses/{id}/resolution with outcome EXECUTE_AGREEMENT"
        actor: system
        preconditions: ["the SiteAccess row being resolved has status == REQUESTED and mode == AGREEMENT"]
        side_effects:
          - "sets access_status = AGREEMENT_EXECUTED"
          - "increments Well.version by 1"
      - from: ACCESS_PENDING
        to: ENTRY_ORDERED
        trigger: "system, on POST /site-accesses/{id}/resolution with outcome ORDER_ENTRY"
        actor: system
        preconditions:
          - "the SiteAccess row being resolved has status == REQUESTED and mode == STATUTORY_ENTRY"
          - "logical clock >= SiteAccess.window_end_at"
        side_effects:
          - "sets access_status = ENTRY_ORDERED"
          - "increments Well.version by 1"
      - from: ACCESS_PENDING
        to: ACCESS_DENIED
        trigger: "system, on POST /site-accesses/{id}/resolution with outcome DENY"
        actor: system
        preconditions: ["the SiteAccess row being resolved has status == REQUESTED"]
        side_effects:
          - "sets access_status = ACCESS_DENIED"
          - "increments Well.version by 1"

  - entity: OrphanDetermination
    initial_state: DRAFT
    terminal_states: [CONFIRMED, REJECTED, SUPERSEDED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /orphan-determinations/{id}/submit"
        actor: FieldInspector
        preconditions:
          - "status IN {DRAFT, REVISION_REQUESTED}"
          - "X-User-ID == created_by_user_id"
        side_effects:
          - "sets status = SUBMITTED, submitted_at = logical clock"
          - "promotes the Well from PRODUCING/INACTIVE to ORPHAN_CANDIDATE"
          - "increments OrphanDetermination.version by 1"
      - from: SUBMITTED
        to: REVISION_REQUESTED
        trigger: "POST /orphan-determinations/{id}/decision with action REQUEST_REVISION"
        actor: DeterminationReviewer
        preconditions:
          - "status == SUBMITTED"
          - "X-User-ID != created_by_user_id"
        side_effects:
          - "sets status = REVISION_REQUESTED, decision_rationale = payload rationale, decided_by_user_id = X-User-ID"
          - "leaves Well.status at ORPHAN_CANDIDATE (the classification is still pending)"
          - "increments OrphanDetermination.version by 1"
      - from: REVISION_REQUESTED
        to: SUBMITTED
        trigger: "POST /orphan-determinations/{id}/submit (revision cycle)"
        actor: FieldInspector
        preconditions:
          - "status IN {DRAFT, REVISION_REQUESTED}"
          - "X-User-ID == created_by_user_id"
          - "revision_round < MAX_REVISION_ROUNDS"
        side_effects:
          - "increments revision_round by 1"
          - "sets status = SUBMITTED, submitted_at = logical clock"
          - "increments OrphanDetermination.version by 1"
        note: "the cycle: SUBMITTED -> REVISION_REQUESTED -> SUBMITTED, bounded by MAX_REVISION_ROUNDS"
      - from: SUBMITTED
        to: CONFIRMED
        trigger: "POST /orphan-determinations/{id}/decision with action CONFIRM"
        actor: DeterminationReviewer
        preconditions:
          - "status == SUBMITTED"
          - "X-User-ID != created_by_user_id"
          - "the Well's owning Operator has status IN {DELINQUENT, INSOLVENT, REVOKED}"
          - "all numeric criteria in calculations.orphan_classification_criteria hold"
        side_effects:
          - "freezes snapshot_idle_months, snapshot_cumulative_boe_60mo and snapshot_screening_score from the Well"
          - "sets status = CONFIRMED, decided_at = logical clock, decided_by_user_id = X-User-ID"
          - "transitions the Well ORPHAN_CANDIDATE -> ORPHAN_CONFIRMED"
          - "increments OrphanDetermination.version by 1"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /orphan-determinations/{id}/decision with action REJECT"
        actor: DeterminationReviewer
        preconditions:
          - "status == SUBMITTED"
          - "X-User-ID != created_by_user_id"
        side_effects:
          - "freezes the three snapshot fields from the Well"
          - "sets status = REJECTED, decided_at = logical clock, decided_by_user_id = X-User-ID"
          - "transitions the Well ORPHAN_CANDIDATE -> INACTIVE (compensation for the submit-time promotion)"
          - "increments OrphanDetermination.version by 1"
      - from: DRAFT
        to: SUPERSEDED
        trigger: "system, on POST /wells/{id}/orphan-determinations for the same well"
        actor: system
        preconditions: ["status IN {DRAFT, REVISION_REQUESTED}"]
        side_effects:
          - "sets status = SUPERSEDED"
          - "increments OrphanDetermination.version by 1"
        note: "create-with-supersede; the OCC race this enables is concurrency_rules.determination-create-stale-well"
      - from: REVISION_REQUESTED
        to: SUPERSEDED
        trigger: "system, on POST /wells/{id}/orphan-determinations for the same well"
        actor: system
        preconditions: ["status IN {DRAFT, REVISION_REQUESTED}"]
        side_effects:
          - "identical to the DRAFT -> SUPERSEDED transition"

  - entity: SiteAccess
    initial_state: REQUESTED
    terminal_states: [AGREEMENT_EXECUTED, ENTRY_ORDERED, DENIED]
    transitions:
      - from: REQUESTED
        to: AGREEMENT_EXECUTED
        trigger: "POST /site-accesses/{id}/resolution with outcome EXECUTE_AGREEMENT"
        actor: ProgramAdmin
        preconditions:
          - "status == REQUESTED"
          - "mode == AGREEMENT"
        side_effects:
          - "sets status = AGREEMENT_EXECUTED, resolved_at = logical clock"
          - "sets Well.access_status = AGREEMENT_EXECUTED"
          - "increments SiteAccess.version by 1"
      - from: REQUESTED
        to: ENTRY_ORDERED
        trigger: "POST /site-accesses/{id}/resolution with outcome ORDER_ENTRY"
        actor: ProgramAdmin
        preconditions:
          - "status == REQUESTED"
          - "mode == STATUTORY_ENTRY"
          - "logical clock >= window_end_at (the statutory notice period has fully elapsed)"
          - "payload legal_authority_citation is present and non-empty"
        side_effects:
          - "sets status = ENTRY_ORDERED, resolved_at = logical clock, legal_authority_citation = payload value"
          - "sets Well.access_status = ENTRY_ORDERED"
          - "increments SiteAccess.version by 1"
      - from: REQUESTED
        to: DENIED
        trigger: "POST /site-accesses/{id}/resolution with outcome DENY"
        actor: ProgramAdmin
        preconditions: ["status == REQUESTED"]
        side_effects:
          - "sets status = DENIED, resolved_at = logical clock"
          - "sets Well.access_status = ACCESS_DENIED"
          - "the row keeps occupying its closed notice window [notice_sent_at, window_end_at] for the access-window conflict rule"
          - "increments SiteAccess.version by 1"

  - entity: WellTransfer
    initial_state: PENDING
    terminal_states: [DENIED, VOIDED]
    transitions:
      - from: PENDING
        to: APPROVED
        trigger: "POST /well-transfers/{id}/decision with action APPROVE"
        actor: ProgramAdmin
        preconditions:
          - "status == PENDING"
          - "to_operator.status NOT IN {INSOLVENT, REVOKED}"
          - "well.status NOT IN {PLUGGING_SCHEDULED, PLUGGED, RECLAIMED}"
          - "to_operator.bond_amount_cents >= transferee_required_bond_cents (forward-looking, computed with this well added to the transferee's inventory)"
        side_effects:
          - "sets status = APPROVED, approved_at = logical clock, decided_by_user_id = X-User-ID"
          - "sets Well.operator_id = to_operator_id and increments Well.version by 1"
          - "recomputes active_well_count, orphan_candidate_count and required_bond_cents on BOTH operators"
          - "each recomputed operator may auto-transition ACTIVE -> DELINQUENT or DELINQUENT -> ACTIVE"
          - "increments WellTransfer.version by 1"
      - from: PENDING
        to: DENIED
        trigger: "POST /well-transfers/{id}/decision with action DENY"
        actor: ProgramAdmin
        preconditions: ["status == PENDING"]
        side_effects:
          - "sets status = DENIED, decided_by_user_id = X-User-ID"
          - "leaves Well.operator_id unchanged"
          - "increments WellTransfer.version by 1"
      - from: APPROVED
        to: VOIDED
        trigger: "POST /well-transfers/{id}/decision with action VOID, or system cascade from Operator ACTIVE/DELINQUENT -> INSOLVENT on to_operator"
        actor: ProgramAdmin | system
        preconditions:
          - "status == APPROVED"
          - "well.status NOT IN {PLUGGING_SCHEDULED, PLUGGED, RECLAIMED}"
        side_effects:
          - "sets status = VOIDED, voided_at = logical clock, void_reason = MANUAL_VOID for the direct action or TRANSFEREE_INSOLVENT for the cascade"
          - "resets Well.operator_id = from_operator_id and increments Well.version by 1"
          - "recomputes active_well_count, orphan_candidate_count and required_bond_cents on BOTH operators, exactly reversing the APPROVED side effects"
          - "each recomputed operator may auto-transition ACTIVE -> DELINQUENT or DELINQUENT -> ACTIVE"
          - "increments WellTransfer.version by 1"

  - entity: Contractor
    dimension: license_status
    initial_state: GOOD_STANDING
    terminal_states: [DEBARRED]
    transitions:
      - from: GOOD_STANDING
        to: SUSPENDED
        trigger: "POST /contractors/{id}/eligibility with action SUSPEND_LICENSE"
        actor: ProcurementOfficer
        preconditions: ["license_status == GOOD_STANDING"]
        side_effects:
          - "sets license_status = SUSPENDED, suspended_at = logical clock"
          - "CASCADE: every UnitCostContract with contractor_id == this contractor and status == ACTIVE transitions ACTIVE -> SUSPENDED"
          - "increments Contractor.version by 1"
      - from: SUSPENDED
        to: GOOD_STANDING
        trigger: "POST /contractors/{id}/eligibility with action REINSTATE"
        actor: ProcurementOfficer
        preconditions: ["license_status == SUSPENDED"]
        side_effects:
          - "sets license_status = GOOD_STANDING, suspended_at = null"
          - "CASCADE: every UnitCostContract with contractor_id == this contractor and status == SUSPENDED transitions SUSPENDED -> ACTIVE"
          - "increments Contractor.version by 1"
      - from: GOOD_STANDING
        to: DEBARRED
        trigger: "POST /contractors/{id}/eligibility with action DEBAR"
        actor: ProcurementOfficer
        preconditions: ["license_status IN {GOOD_STANDING, SUSPENDED}"]
        side_effects:
          - "sets license_status = DEBARRED, suspended_at = logical clock"
          - "CASCADE: every UnitCostContract with contractor_id == this contractor and status == ACTIVE transitions ACTIVE -> SUSPENDED"
          - "increments Contractor.version by 1"
      - from: SUSPENDED
        to: DEBARRED
        trigger: "POST /contractors/{id}/eligibility with action DEBAR"
        actor: ProcurementOfficer
        preconditions: ["license_status IN {GOOD_STANDING, SUSPENDED}"]
        side_effects:
          - "sets license_status = DEBARRED"
          - "increments Contractor.version by 1"

  - entity: Solicitation
    initial_state: DRAFT
    terminal_states: [AWARDED, CANCELLED]
    transitions:
      - from: DRAFT
        to: OPEN
        trigger: "POST /solicitations/{id}/lifecycle with action OPEN"
        actor: ProcurementOfficer
        preconditions:
          - "status == DRAFT"
          - "logical clock < bid_due_at"
        side_effects:
          - "sets status = OPEN"
          - "increments Solicitation.version by 1"
      - from: OPEN
        to: EVALUATING
        trigger: "POST /solicitations/{id}/lifecycle with action CLOSE"
        actor: ProcurementOfficer
        preconditions: ["status == OPEN"]
        side_effects:
          - "sets status = EVALUATING (no further bids accepted)"
          - "increments Solicitation.version by 1"
      - from: EVALUATING
        to: OPEN
        trigger: "POST /solicitations/{id}/lifecycle with action REOPEN"
        actor: ProcurementOfficer
        preconditions:
          - "status == EVALUATING"
          - "count of Bids for this solicitation with status == RESPONSIVE is exactly 0"
          - "reopen_round < MAX_REOPEN_ROUNDS"
          - "payload new_bid_due_at is present and strictly after the logical clock"
        side_effects:
          - "increments reopen_round by 1"
          - "sets status = OPEN and bid_due_at = payload new_bid_due_at"
          - "increments Solicitation.version by 1"
        note: "the procurement cycle: OPEN -> EVALUATING -> OPEN, permitted only while no responsive bid exists"
      - from: EVALUATING
        to: AWARDED
        trigger: "POST /solicitations/{id}/award"
        actor: AwardAuthority
        preconditions:
          - "status == EVALUATING"
          - "X-User-ID != created_by_user_id"
          - "at least one Bid for this solicitation has status == RESPONSIVE"
        side_effects:
          - "runs calculations.bid_composite_score over the RESPONSIVE bid set, writing price_score and composite_score on every RESPONSIVE bid"
          - "selects the winning bid, sets it AWARDED and every other RESPONSIVE bid NOT_AWARDED"
          - "creates a UnitCostContract copying the winning bid's four unit prices and Solicitation.ceiling_cents"
          - "sets status = AWARDED"
          - "increments Solicitation.version by 1"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /solicitations/{id}/lifecycle with action CANCEL"
        actor: ProcurementOfficer
        preconditions: ["status IN {DRAFT, OPEN, EVALUATING}"]
        side_effects:
          - "sets status = CANCELLED"
          - "every Bid for this solicitation with status IN {SUBMITTED, RESPONSIVE, NONRESPONSIVE} transitions to NOT_AWARDED"
          - "increments Solicitation.version by 1"
      - from: OPEN
        to: CANCELLED
        trigger: "POST /solicitations/{id}/lifecycle with action CANCEL"
        actor: ProcurementOfficer
        preconditions: ["status IN {DRAFT, OPEN, EVALUATING}"]
        side_effects:
          - "identical to the DRAFT -> CANCELLED transition"
      - from: EVALUATING
        to: CANCELLED
        trigger: "POST /solicitations/{id}/lifecycle with action CANCEL"
        actor: ProcurementOfficer
        preconditions: ["status IN {DRAFT, OPEN, EVALUATING}"]
        side_effects:
          - "identical to the DRAFT -> CANCELLED transition"

  - entity: Bid
    initial_state: SUBMITTED
    terminal_states: [AWARDED, NOT_AWARDED]
    transitions:
      - from: SUBMITTED
        to: RESPONSIVE
        trigger: "POST /bids/{id}/evaluation with outcome RESPONSIVE"
        actor: ProcurementOfficer
        preconditions:
          - "status IN {SUBMITTED, NONRESPONSIVE}"
          - "solicitation.status IN {OPEN, EVALUATING}"
          - "technical_score >= solicitation.min_technical_score"
          - "evaluated_unit_cost_cents <= solicitation.ceiling_cents"
          - "contractor.license_status == GOOD_STANDING"
        side_effects:
          - "sets status = RESPONSIVE, evaluated_by_user_id = X-User-ID, nonresponsive_reason = null"
          - "increments Bid.version by 1"
      - from: SUBMITTED
        to: NONRESPONSIVE
        trigger: "POST /bids/{id}/evaluation with outcome NONRESPONSIVE"
        actor: ProcurementOfficer
        preconditions:
          - "status IN {SUBMITTED, RESPONSIVE}"
          - "solicitation.status IN {OPEN, EVALUATING}"
        side_effects:
          - "sets status = NONRESPONSIVE, nonresponsive_reason = payload reason, evaluated_by_user_id = X-User-ID"
          - "increments Bid.version by 1"
      - from: NONRESPONSIVE
        to: RESPONSIVE
        trigger: "POST /bids/{id}/evaluation with outcome RESPONSIVE (re-evaluation)"
        actor: ProcurementOfficer
        preconditions:
          - "status IN {SUBMITTED, NONRESPONSIVE}"
          - "solicitation.status IN {OPEN, EVALUATING}"
          - "technical_score >= solicitation.min_technical_score"
          - "evaluated_unit_cost_cents <= solicitation.ceiling_cents"
          - "contractor.license_status == GOOD_STANDING"
        side_effects:
          - "identical to the SUBMITTED -> RESPONSIVE transition"
        note: "responsiveness cycles: RESPONSIVE -> NONRESPONSIVE -> RESPONSIVE is legal until the solicitation is AWARDED"
      - from: RESPONSIVE
        to: NONRESPONSIVE
        trigger: "POST /bids/{id}/evaluation with outcome NONRESPONSIVE (re-evaluation)"
        actor: ProcurementOfficer
        preconditions:
          - "status IN {SUBMITTED, RESPONSIVE}"
          - "solicitation.status IN {OPEN, EVALUATING}"
        side_effects:
          - "identical to the SUBMITTED -> NONRESPONSIVE transition"
      - from: RESPONSIVE
        to: AWARDED
        trigger: "system, on POST /solicitations/{id}/award for the winning bid"
        actor: system
        preconditions: ["status == RESPONSIVE", "this bid is the winner of the award selector"]
        side_effects:
          - "sets status = AWARDED, price_score and composite_score"
          - "increments Bid.version by 1"
      - from: RESPONSIVE
        to: NOT_AWARDED
        trigger: "system, on POST /solicitations/{id}/award for every losing RESPONSIVE bid, or on solicitation CANCEL"
        actor: system
        preconditions: ["status IN {SUBMITTED, RESPONSIVE, NONRESPONSIVE}"]
        side_effects:
          - "sets status = NOT_AWARDED and, for award, price_score and composite_score"
          - "increments Bid.version by 1"
      - from: NONRESPONSIVE
        to: NOT_AWARDED
        trigger: "system, on POST /solicitations/{id}/lifecycle with action CANCEL"
        actor: system
        preconditions: ["status IN {SUBMITTED, RESPONSIVE, NONRESPONSIVE}"]
        side_effects:
          - "sets status = NOT_AWARDED without computing scores"
          - "increments Bid.version by 1"
      - from: SUBMITTED
        to: NOT_AWARDED
        trigger: "system, on POST /solicitations/{id}/lifecycle with action CANCEL, or on award for bids never evaluated"
        actor: system
        preconditions: ["status IN {SUBMITTED, RESPONSIVE, NONRESPONSIVE}"]
        side_effects:
          - "sets status = NOT_AWARDED without computing scores"
          - "increments Bid.version by 1"

  - entity: UnitCostContract
    initial_state: ACTIVE
    terminal_states: [CLOSED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system, cascade from Contractor GOOD_STANDING -> SUSPENDED or -> DEBARRED"
        actor: system
        preconditions: ["status == ACTIVE"]
        side_effects:
          - "sets status = SUSPENDED (no job on this contract may mobilize)"
          - "increments UnitCostContract.version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "system, cascade from Contractor SUSPENDED -> GOOD_STANDING"
        actor: system
        preconditions: ["status == SUSPENDED"]
        side_effects:
          - "sets status = ACTIVE"
          - "increments UnitCostContract.version by 1"
      - from: ACTIVE
        to: CLOSED
        trigger: "system, on POST /plugging-jobs/{id}/field-report once obligated_cents reaches the ceiling"
        actor: system
        preconditions:
          - "status == ACTIVE"
          - "obligated_cents >= ceiling_cents after the field-report recompute"
        side_effects:
          - "sets status = CLOSED (fully obligated; no new job may be created against it)"
          - "increments UnitCostContract.version by 1"
        note: "boundary: obligated_cents == ceiling_cents closes the contract, while obligated_cents > ceiling_cents is rejected before it can happen"

  - entity: PluggingJob
    initial_state: SCHEDULED
    terminal_states: [RECLAIMED]
    transitions:
      - from: SCHEDULED
        to: MOBILIZED
        trigger: "POST /plugging-jobs/{id}/mobilize"
        actor: Contractor | ProgramAdmin
        preconditions:
          - "status == SCHEDULED"
          - "the well's latest SiteAccess row has status IN {AGREEMENT_EXECUTED, ENTRY_ORDERED}"
          - "contract.status == ACTIVE"
          - "contractor.license_status == GOOD_STANDING"
        side_effects:
          - "sets status = MOBILIZED, mobilized_at = logical clock"
          - "increments PluggingJob.version by 1"
      - from: MOBILIZED
        to: FIELD_REPORTED
        trigger: "POST /plugging-jobs/{id}/field-report"
        actor: Contractor
        preconditions:
          - "status IN {MOBILIZED, REWORK_REQUIRED}"
          - "contract.status == ACTIVE"
          - "payload plug_intervals is a non-empty array and downhole_conditions is a non-empty string"
          - "contract.obligated_cents recomputed with this round's cost does not exceed contract.ceiling_cents"
        side_effects:
          - "stores cement_sacks_used, rig_days_used, casing_removed_ft, downhole_conditions and plug_intervals from the payload"
          - "runs calculations.plugging_actual_cost for round number (rework_round + 1), writing last_round_cost_cents and adding it to actual_cost_cents"
          - "recomputes contract.obligated_cents; if it now equals or exceeds contract.ceiling_cents the contract transitions ACTIVE -> CLOSED"
          - "sets status = FIELD_REPORTED"
          - "increments PluggingJob.version by 1"
      - from: REWORK_REQUIRED
        to: FIELD_REPORTED
        trigger: "POST /plugging-jobs/{id}/field-report (rework round)"
        actor: Contractor
        preconditions:
          - "status IN {MOBILIZED, REWORK_REQUIRED}"
          - "contract.status == ACTIVE"
          - "payload plug_intervals is a non-empty array and downhole_conditions is a non-empty string"
          - "contract.obligated_cents recomputed with this round's cost does not exceed contract.ceiling_cents"
        side_effects:
          - "identical to the MOBILIZED -> FIELD_REPORTED transition, except the round's mobilization line is the remobilization fee instead of the full mobilization fee"
        note: "the operations cycle: FIELD_REPORTED -> REWORK_REQUIRED -> FIELD_REPORTED, bounded by MAX_REWORK_ROUNDS"
      - from: FIELD_REPORTED
        to: REWORK_REQUIRED
        trigger: "POST /plugging-jobs/{id}/review with action REWORK"
        actor: FieldInspector
        preconditions:
          - "status == FIELD_REPORTED"
          - "rework_round < MAX_REWORK_ROUNDS"
        side_effects:
          - "increments rework_round by 1"
          - "sets status = REWORK_REQUIRED"
          - "increments PluggingJob.version by 1"
      - from: FIELD_REPORTED
        to: PLUGGED
        trigger: "POST /plugging-jobs/{id}/review with action ACCEPT"
        actor: FieldInspector
        preconditions: ["status == FIELD_REPORTED"]
        side_effects:
          - "sets status = PLUGGED, plugging_accepted_at = logical clock"
          - "CASCADE hop 1: creates exactly three ReclamationTask rows with task_type EQUIPMENT_REMOVAL, PIT_CLOSURE and REVEGETATION, each status PENDING"
          - "CASCADE hop 2: transitions the Well PLUGGING_SCHEDULED -> PLUGGED"
          - "CASCADE hop 3 (caused by hop 2): recomputes the owning Operator's active_well_count and required_bond_cents"
          - "CASCADE hop 4 (caused by hop 3): the operator may auto-transition DELINQUENT -> ACTIVE when bond_amount_cents >= the new required_bond_cents"
          - "increments PluggingJob.version by 1"
      - from: PLUGGED
        to: RECLAIMED
        trigger: "system, on the POST /reclamation-tasks/{id}/progress call that makes the third task COMPLETE"
        actor: system
        preconditions:
          - "status == PLUGGED"
          - "all three ReclamationTask rows for this job have status == COMPLETE"
        side_effects:
          - "sets status = RECLAIMED, reclaimed_at = logical clock"
          - "transitions the Well PLUGGED -> RECLAIMED, which recomputes the operator's active_well_count and required_bond_cents"
          - "increments PluggingJob.version by 1"

  - entity: ReclamationTask
    initial_state: PENDING
    terminal_states: [COMPLETE]
    transitions:
      - from: PENDING
        to: IN_PROGRESS
        trigger: "POST /reclamation-tasks/{id}/progress with action START"
        actor: FieldInspector
        preconditions:
          - "status IN {PENDING, REWORK_NEEDED}"
          - "job.status == PLUGGED"
          - "for task_type == REVEGETATION only: the job's PIT_CLOSURE task is COMPLETE and logical clock >= that task's completed_at + REVEGETATION_MIN_WAIT_DAYS (90) days (validations priority 52)"
        side_effects:
          - "sets status = IN_PROGRESS, notes = payload notes when supplied"
          - "increments ReclamationTask.version by 1"
      - from: REWORK_NEEDED
        to: IN_PROGRESS
        trigger: "POST /reclamation-tasks/{id}/progress with action START (rework cycle)"
        actor: FieldInspector
        preconditions:
          - "status IN {PENDING, REWORK_NEEDED}"
          - "job.status == PLUGGED"
          - "for task_type == REVEGETATION only: the same 90-day post-pit-closure wait as the PENDING -> IN_PROGRESS transition"
        side_effects:
          - "identical to the PENDING -> IN_PROGRESS transition"
      - from: IN_PROGRESS
        to: COMPLETE
        trigger: "POST /reclamation-tasks/{id}/progress with action PASS"
        actor: FieldInspector
        preconditions:
          - "status == IN_PROGRESS"
          - "for task_type == REVEGETATION only: the job's EQUIPMENT_REMOVAL and PIT_CLOSURE tasks are both COMPLETE (validations priority 53); revegetation sign-off is the job's final acceptance"
        side_effects:
          - "sets status = COMPLETE, completed_at = logical clock, inspected_by_user_id = X-User-ID"
          - "when this makes all three tasks COMPLETE, the job transitions PLUGGED -> RECLAIMED and the well transitions PLUGGED -> RECLAIMED"
          - "increments ReclamationTask.version by 1"
      - from: IN_PROGRESS
        to: REWORK_NEEDED
        trigger: "POST /reclamation-tasks/{id}/progress with action FAIL"
        actor: FieldInspector
        preconditions: ["status == IN_PROGRESS"]
        side_effects:
          - "increments inspection_round by 1"
          - "sets status = REWORK_NEEDED, inspected_by_user_id = X-User-ID"
          - "increments ReclamationTask.version by 1"

  - entity: FundingSource
    initial_state: ACTIVE
    terminal_states: [EXPIRED]
    transitions:
      - from: ACTIVE
        to: EXHAUSTED
        trigger: "system, on POST /plugging-jobs/{id}/funding-commitments"
        actor: system
        preconditions:
          - "status == ACTIVE"
          - "committed_cents == authorized_cents after the commitment pass"
        side_effects:
          - "sets status = EXHAUSTED"
          - "increments FundingSource.version by 1"
      - from: EXHAUSTED
        to: ACTIVE
        trigger: "system, on POST /funding-allocations/{id}/transitions with action DEOBLIGATE"
        actor: system
        preconditions:
          - "status == EXHAUSTED"
          - "committed_cents < authorized_cents after the deobligation"
        side_effects:
          - "sets status = ACTIVE"
          - "increments FundingSource.version by 1"
        note: "the availability cycle: ACTIVE -> EXHAUSTED -> ACTIVE"
      - from: ACTIVE
        to: EXPIRED
        trigger: "system, on POST /_clock/set_current_utc"
        actor: system
        preconditions: ["status IN {ACTIVE, EXHAUSTED}", "the new logical clock is strictly after expires_at"]
        side_effects:
          - "sets status = EXPIRED (no new commitment may name it and no allocation against it may be disbursed)"
          - "increments FundingSource.version by 1"
      - from: EXHAUSTED
        to: EXPIRED
        trigger: "system, on POST /_clock/set_current_utc"
        actor: system
        preconditions: ["status IN {ACTIVE, EXHAUSTED}", "the new logical clock is strictly after expires_at"]
        side_effects:
          - "identical to the ACTIVE -> EXPIRED transition"

  - entity: FundingAllocation
    initial_state: COMMITTED
    terminal_states: [DISBURSED, DEOBLIGATED]
    transitions:
      - from: COMMITTED
        to: DISBURSED
        trigger: "POST /funding-allocations/{id}/transitions with action DISBURSE"
        actor: FundingOfficer
        preconditions:
          - "status == COMMITTED"
          - "X-User-ID != committed_by_user_id"
          - "job.status IN {FIELD_REPORTED, PLUGGED, RECLAIMED} (work must be performed before payment)"
          - "source.status != EXPIRED"
          - "payload invoice_cents <= allocated_cents"
        side_effects:
          - "sets disbursed_cents = payload invoice_cents, status = DISBURSED, disbursed_at = logical clock, disbursed_by_user_id = X-User-ID"
          - "recomputes source.disbursed_cents"
          - "increments FundingAllocation.version by 1"
      - from: COMMITTED
        to: DEOBLIGATED
        trigger: "POST /funding-allocations/{id}/transitions with action DEOBLIGATE"
        actor: FundingOfficer
        preconditions:
          - "status == COMMITTED"
          - "job.status NOT IN {PLUGGED, RECLAIMED}"
        side_effects:
          - "sets status = DEOBLIGATED, deobligated_at = logical clock"
          - "recomputes source.committed_cents (the allocation leaves the COMMITTED/DISBURSED set), restoring the source's available cents exactly"
          - "recomputes job.funded_cents"
          - "when the source was EXHAUSTED it transitions EXHAUSTED -> ACTIVE"
          - "increments FundingAllocation.version by 1"

  - entity: GrantReport
    initial_state: DUE
    terminal_states: [ACCEPTED]
    transitions:
      - from: DUE
        to: SUBMITTED
        trigger: "POST /grant-reports/{id}/submission with action SUBMIT"
        actor: FundingOfficer
        preconditions: ["status IN {DUE, REJECTED}"]
        side_effects:
          - "recomputes wells_plugged_count, reported_cost_cents and federal_share_pct per calculations.grant_report_figures at submission time"
          - "sets status = SUBMITTED, submitted_by_user_id = X-User-ID"
          - "increments GrantReport.version by 1"
      - from: REJECTED
        to: SUBMITTED
        trigger: "POST /grant-reports/{id}/submission with action SUBMIT (resubmission)"
        actor: FundingOfficer
        preconditions: ["status IN {DUE, REJECTED}"]
        side_effects:
          - "increments revision_round by 1"
          - "otherwise identical to the DUE -> SUBMITTED transition, so the figures are recomputed against the state at resubmission time"
        note: "the reporting cycle: SUBMITTED -> REJECTED -> SUBMITTED"
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /grant-reports/{id}/submission with action ACCEPT"
        actor: ProgramAdmin
        preconditions: ["status == SUBMITTED"]
        side_effects:
          - "sets status = ACCEPTED, reviewer_note = payload reviewer_note"
          - "increments GrantReport.version by 1"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /grant-reports/{id}/submission with action REJECT"
        actor: ProgramAdmin
        preconditions: ["status == SUBMITTED"]
        side_effects:
          - "sets status = REJECTED, reviewer_note = payload reviewer_note"
          - "increments GrantReport.version by 1"

concurrency_rules:
  - rule_id: determination-create-stale-well
    parent_entity: Well
    write_endpoint: "POST /wells/{id}/orphan-determinations"
    occ_field: "expected_well_version"
    description: |
      Creating an OrphanDetermination against a Well whose version has advanced since the client
      last observed it is rejected. A new determination legitimately supersedes any prior DRAFT or
      REVISION_REQUESTED determination on the same well, so state preconditions alone would let a
      second create succeed; the stale-version check is what tells the caller that the well it
      classified is not the well it is writing against (its operator, status, production history or
      score has moved on).
    error_id: ERR_STALE_WELL_VERSION
    http_status: 412
  - rule_id: enforcement-stale-operator
    parent_entity: Operator
    write_endpoint: "POST /operators/{id}/enforcement"
    occ_field: "expected_operator_version"
    description: |
      An enforcement action against an Operator whose version has advanced since the client last
      observed it is rejected. Successive enforcement actions are individually legal (DECLARE_INSOLVENT
      then FORFEIT_BOND, REVOKE after a deficiency), so no state precondition rejects the second
      action; the stale-version check is what prevents an officer from acting on a bond deficiency,
      well count or standing that a prior action or cascade has already changed.
    error_id: ERR_STALE_OPERATOR_VERSION
    http_status: 412

calculations:
  - name: orphan_priority_score
    trigger: "on POST /wells; on POST /wells/{id}/production-records; on POST /wells/{id}/orphan-determinations; on every Well status transition; on the Operator REVOKED cascade — writes Well.screening_score and Well.remediation_score"
    algorithm: weighted_scoring
    formula: |
      # Step 1 - four risk components, each already clamped to 0..100 and each ROUNDED to 2 dp
      #          (round_half_up) BEFORE any weighting. Weighting unrounded components is wrong.
      methane_component     = min(100, round(well.methane_scfd / 5.0, 2))
      groundwater_component = 100 if well.groundwater_depth_ft <= 50  else
                               75 if well.groundwater_depth_ft <= 200 else
                               40 if well.groundwater_depth_ft <= 500 else 10
      population_component  = min(100, round(well.population_within_1000ft * 4.0, 2))
      surface_component     = min(100, round(well.surface_disturbance_acres * 20.0, 2))

      # Step 2 - variant SCREENING (inventory triage weighting)
      screening_score = round(0.35 * methane_component
                            + 0.30 * groundwater_component
                            + 0.20 * population_component
                            + 0.15 * surface_component, 2)

      # Step 3 - variant REMEDIATION (work-ordering weighting) applies a public-proximity
      #          override BEFORE weighting, then a different weight vector.
      population_component_remediation = 100 if well.population_within_1000ft >= 5
                                             else population_component
      remediation_score = round(0.20 * methane_component
                              + 0.25 * groundwater_component
                              + 0.40 * population_component_remediation
                              + 0.15 * surface_component, 2)
    input_set: "single Well row; all four inputs are operator-reported fields on the Well; no cross-entity aggregation"
    constants:
      METHANE_FULL_SCALE_SCFD: 500
      POPULATION_FULL_SCALE: 25
      SURFACE_FULL_SCALE_ACRES: 5.0
      GROUNDWATER_BAND_FT: [50, 200, 500]
      GROUNDWATER_BAND_SCORES: [100, 75, 40, 10]
      SCREENING_WEIGHTS: { methane: 0.35, groundwater: 0.30, population: 0.20, surface: 0.15 }
      REMEDIATION_WEIGHTS: { methane: 0.20, groundwater: 0.25, population: 0.40, surface: 0.15 }
      REMEDIATION_POPULATION_OVERRIDE_COUNT: 5
      ORPHAN_SCORE_ELIGIBILITY_MIN: 40.00
    precision: "components 2 decimal places round_half_up, weighted sum 2 decimal places round_half_up; the groundwater band is an exact integer"
    variants:
      - name: screening
        when: "written to Well.screening_score; the value the orphan classification criteria gate on (>= ORPHAN_SCORE_ELIGIBILITY_MIN)"
        difference: "weights methane heaviest (0.35) and population lightest (0.20); no population override"
      - name: remediation
        when: "written to Well.remediation_score; the value that orders confirmed wells for remediation work and reporting"
        difference: "weights population heaviest (0.40) and applies the >= 5-resident override that forces population_component to 100, so identical well inputs yield a different number from the screening variant"

  - name: operator_financial_assurance_requirement
    trigger: "on POST /wells; on WellTransfer APPROVED/VOIDED; on Well -> PLUGGED and Well -> RECLAIMED; on Operator FORFEIT_BOND — writes Operator.required_bond_cents, and (forward-looking) WellTransfer.transferee_required_bond_cents"
    algorithm: tiered_pricing
    formula: |
      # per-well base amount from a depth tier (boundaries are inclusive on the upper edge)
      def base_cents(well):
          if well.total_depth_ft <= 3000: return 250000
          if well.total_depth_ft <= 7000: return 750000
          return 1500000

      included = [ w for w in Well
                   if w.operator_id == operator.id
                   and w.status IN {PRODUCING, INACTIVE, ORPHAN_CANDIDATE,
                                    ORPHAN_CONFIRMED, PLUGGING_SCHEDULED} ]

      # variant BLANKET: sum first, then apply the single blanket cap
      required_blanket    = min(sum(base_cents(w) for w in included), BLANKET_CAP_CENTS)
      # variant INDIVIDUAL: cap each well first, then sum (no blanket cap)
      required_individual = sum(min(base_cents(w), INDIVIDUAL_WELL_CAP_CENTS) for w in included)

      required_bond_cents = required_blanket    if operator.financial_assurance_tier == BLANKET
                       else required_individual

      # deficiency test (strict boundary: equality is compliant)
      deficient = operator.bond_amount_cents < required_bond_cents
    input_set: "Wells with operator_id == operator.id and status IN {PRODUCING, INACTIVE, ORPHAN_CANDIDATE, ORPHAN_CONFIRMED, PLUGGING_SCHEDULED}; PLUGGED and RECLAIMED wells are excluded"
    constants:
      DEPTH_TIER_FT: [3000, 7000]
      DEPTH_TIER_BASE_CENTS: [250000, 750000, 1500000]
      BLANKET_CAP_CENTS: 25000000
      INDIVIDUAL_WELL_CAP_CENTS: 1000000
    precision: "integer cents; no rounding occurs because every input is an integer cent amount"
    variants:
      - name: blanket
        when: "operator.financial_assurance_tier == BLANKET"
        difference: "cap applied once to the summed exposure (min(sum, 25000000)), so a single deep well contributes its full 1500000"
      - name: individual
        when: "operator.financial_assurance_tier == INDIVIDUAL"
        difference: "cap applied per well (min(base, 1000000)) before summing, so a well deeper than 7000 ft contributes only 1000000 and the same inventory yields a lower requirement than the blanket variant"

  - name: bid_composite_score
    trigger: "on POST /solicitations/{id}/award, over the solicitation's RESPONSIVE bid set — writes Bid.price_score and Bid.composite_score and selects the winner; Bid.evaluated_unit_cost_cents is written earlier, at POST /solicitations/{id}/bids"
    algorithm: weighted_scoring
    formula: |
      # Step 1 (runs at bid submission, per bid, independent of any other bid)
      evaluated_unit_cost_cents = SACKS_BASIS * bid.cement_per_sack_cents
                                + RIG_DAYS_BASIS * bid.rig_day_rate_cents
                                + CASING_FT_BASIS * bid.casing_per_ft_cents
                                + bid.mobilization_fee_cents

      # Step 2 (runs at award) - candidate set is fixed BEFORE any score is computed
      candidates = [ b for b in Bid if b.solicitation_id == solicitation.id
                                    and b.status == RESPONSIVE ]
      if len(candidates) == 0: reject ERR_NO_RESPONSIVE_BIDS

      # Step 3 - price score is relative to the cheapest candidate only (never to the
      #          full bid population, and never recomputed after a winner is chosen)
      lowest = min(b.evaluated_unit_cost_cents for b in candidates)
      for b in candidates:
          b.price_score = round(100.0 * lowest / b.evaluated_unit_cost_cents, 2)
          b.composite_score = round(PRICE_WEIGHT * b.price_score
                                  + TECH_WEIGHT * b.technical_score, 2)

      # Step 4 - winner selection (selector policy, fully deterministic)
      #   eligibility : status == RESPONSIVE
      #   ranking     : composite_score DESC
      #   tie-break 1 : evaluated_unit_cost_cents ASC
      #   tie-break 2 : created_at ASC   (never id)
      #   empty pool  : ERR_NO_RESPONSIVE_BIDS (422)
      winner = sorted(candidates, key=(-composite_score, evaluated_unit_cost_cents, created_at))[0]
    input_set: "Bids of one Solicitation with status == RESPONSIVE at the instant the award endpoint is called; SUBMITTED, NONRESPONSIVE, AWARDED and NOT_AWARDED bids are excluded from both the price_score denominator basis and the winner pool"
    constants:
      SACKS_BASIS: 120
      RIG_DAYS_BASIS: 4
      CASING_FT_BASIS: 800
      PRICE_WEIGHT: 0.60
      TECH_WEIGHT: 0.40
    precision: "price_score and composite_score 2 decimal places round_half_up; evaluated_unit_cost_cents is exact integer cents"

  - name: plugging_cost_estimate
    trigger: "on POST /plugging-jobs — writes PluggingJob.plugging_cost_estimate_cents and feeds the contract-ceiling check"
    algorithm: aggregation
    formula: |
      plugging_cost_estimate_cents = job.planned_cement_sacks * contract.cement_per_sack_cents
                                  + job.planned_rig_days     * contract.rig_day_rate_cents
                                  + job.planned_casing_ft    * contract.casing_per_ft_cents
                                  + contract.mobilization_fee_cents

      # contract exposure after this job would be created (max, not sum, so a job's estimate is
      # replaced by - never added to - its own actual once field reports arrive)
      obligated_after = sum( max(j.plugging_cost_estimate_cents, j.actual_cost_cents)
                             for j in PluggingJob if j.contract_id == contract.id )
                        + plugging_cost_estimate_cents
      if obligated_after > contract.ceiling_cents: reject ERR_CONTRACT_CEILING_EXCEEDED
    input_set: "the job being created plus every existing PluggingJob on the same contract regardless of status (including RECLAIMED jobs, whose spend is permanently obligated)"
    constants:
      ADMIN_FEE_PCT: 0.0425
    precision: "exact integer cents; the estimate carries no administrative fee (only actuals do), which is why estimate and actual diverge for identical field quantities"

  - name: plugging_actual_cost
    trigger: "on POST /plugging-jobs/{id}/field-report — writes PluggingJob.last_round_cost_cents, adds it to PluggingJob.actual_cost_cents, and recomputes UnitCostContract.obligated_cents"
    algorithm: aggregation
    formula: |
      round_number = job.rework_round + 1        # 1 for the first report, 2 after one REWORK, ...

      L1_cement = payload.cement_sacks_used  * contract.cement_per_sack_cents
      L2_rig    = payload.rig_days_used      * contract.rig_day_rate_cents
      L3_casing = payload.casing_removed_ft  * contract.casing_per_ft_cents
      L4_mob    = contract.mobilization_fee_cents                       if round_number == 1
                  else round_half_up(contract.mobilization_fee_cents * REMOB_PCT)

      # PINNED ROUNDING ORDER: the 4.25 % state administrative fee is computed PER LINE ITEM and
      # rounded to whole cents per line, THEN the four rounded fees are summed. Applying 4.25 % to
      # the line subtotal and rounding once is a DIFFERENT number and is wrong.
      fee_i        = round_half_up(L_i * ADMIN_FEE_PCT)  for i in [L1_cement, L2_rig, L3_casing, L4_mob]
      admin_fee    = fee_1 + fee_2 + fee_3 + fee_4
      subtotal     = L1_cement + L2_rig + L3_casing + L4_mob

      last_round_cost_cents = subtotal + admin_fee
      actual_cost_cents     = actual_cost_cents_before + last_round_cost_cents   # cumulative

      obligated_cents = sum( max(j.plugging_cost_estimate_cents, j.actual_cost_cents)
                             for j in PluggingJob if j.contract_id == contract.id )
      if obligated_cents > contract.ceiling_cents: reject ERR_CONTRACT_CEILING_EXCEEDED
      if obligated_cents == contract.ceiling_cents: contract.status = CLOSED
    input_set: "one field report round on one job; the cumulative actual is the sum over every accepted round of this job, and no round is ever recomputed retroactively"
    constants:
      ADMIN_FEE_PCT: 0.0425
      REMOB_PCT: 0.50
    precision: "administrative fee rounded to whole cents per line item with round_half_up, then summed; all other arithmetic is exact integer cents"

  - name: job_funding_waterfall
    trigger: "on POST /plugging-jobs/{id}/funding-commitments — creates the FundingAllocation rows and writes PluggingJob.funded_cents plus FundingSource.committed_cents"
    algorithm: waterfall_allocation
    formula: |
      need = job.plugging_cost_estimate_cents
      well = Well[job.well_id]

      # Eligibility filter (explicit, no fuzzy adjectives)
      pool = [ s for s in FundingSource
               if s.status == ACTIVE
               and s.expires_at > clock_now
               and 'PLUGGING' IN s.allowable_cost_categories
               and s.authorized_cents - s.committed_cents > 0
               and ( s.kind != FORFEITED_BOND or s.bond_operator_id == well.operator_id ) ]

      # Ordering: kind rank ASC, then expires_at ASC, then created_at ASC (never id)
      KIND_RANK = { FORFEITED_BOND: 1, FEDERAL_GRANT: 2, STATE_FUND: 3 }
      ordered = sorted(pool, key=(KIND_RANK[s.kind], s.expires_at, s.created_at))

      remaining        = need
      non_federal_base = 0        # cents committed on THIS job to non-federal sources SO FAR
      allocations      = []
      federal_capped   = False    # set when a federal grant was throttled by the match rule
      for rank, s in enumerate(ordered, start=1):
          if remaining == 0: break
          available = s.authorized_cents - s.committed_cents
          if s.kind == FEDERAL_GRANT:
              P = s.federal_match_required_pct
              # SINGLE PASS, ORDER-PINNED: the match base is only the non-federal cents already
              # committed on this job at the moment this source is evaluated. STATE_FUND cents
              # committed LATER in the same pass do NOT retroactively raise this cap, and the
              # waterfall never runs a second pass.
              federal_cap = remaining if P == 0 else floor(non_federal_base * (100 - P) / P)
              contribution = min(remaining, available, federal_cap)
              if contribution < min(remaining, available): federal_capped = True
          else:
              contribution = min(remaining, available)
          if contribution <= 0: continue
          allocations.append({ source_id: s.id, allocated_cents: contribution, waterfall_rank: rank })
          remaining -= contribution
          if s.kind != FEDERAL_GRANT: non_federal_base += contribution

      if remaining > 0:
          # priority between the two shortfall errors is explicit: a match-throttled federal grant
          # that could otherwise have covered the gap reports the match failure, not the shortfall
          if federal_capped: reject ERR_FEDERAL_MATCH_INSUFFICIENT
          else:              reject ERR_FUNDING_SHORTFALL
          # nothing is persisted: the commitment pass is all-or-nothing

      persist allocations; job.funded_cents = need; each source.committed_cents += its contribution
    input_set: "FundingSource rows with status == ACTIVE, expires_at strictly after the logical clock, PLUGGING among allowable_cost_categories, positive remaining authority, and (for FORFEITED_BOND) bond_operator_id equal to the well's current operator_id; EXHAUSTED and EXPIRED sources are excluded"
    constants:
      KIND_RANK: { FORFEITED_BOND: 1, FEDERAL_GRANT: 2, STATE_FUND: 3 }
      FEDERAL_CAP_ROUNDING: "floor (a federal grant may never exceed its match entitlement by even one cent)"
    precision: "integer cents; the federal cap uses floor division, every other amount is an exact min() of integers"

  - name: orphan_classification_criteria
    trigger: "on POST /wells/{id}/orphan-determinations and on POST /orphan-determinations/{id}/decision with action CONFIRM — writes Well.idle_months and Well.cumulative_boe_60mo and gates the CONFIRMED transition"
    algorithm: threshold
    formula: |
      clock_month = YYYY-MM of clock_now
      idle_months = 999 if well.last_production_month IS NULL else
                    (year(clock_month) - year(well.last_production_month)) * 12
                    + (month(clock_month) - month(well.last_production_month))

      # trailing 60-month window, both endpoints INCLUSIVE, compared as YYYY-MM strings
      window_start = clock_month minus (DE_MINIMIS_WINDOW_MONTHS - 1) months
      rows = [ r for r in ProductionRecord
               if r.well_id == well.id
               and r.month >= window_start and r.month <= clock_month ]
      # sum the unrounded per-row boe, then round ONCE at the aggregate
      cumulative_boe_60mo = round(sum(r.oil_bbl + r.gas_mcf / GAS_TO_BOE_DIVISOR for r in rows), 2)
      # empty window: the sum of an empty set is 0, which SATISFIES the de-minimis test

      criteria_met = idle_months >= IDLE_THRESHOLD_MONTHS
                 and cumulative_boe_60mo <= DE_MINIMIS_BOE
                 and well.screening_score >= ORPHAN_SCORE_ELIGIBILITY_MIN
      # NOTE: operator regulatory standing is deliberately NOT part of this predicate; an
      # operator's REVOKED cascade pushes wells to ORPHAN_CANDIDATE independently.
    input_set: "ProductionRecord rows for the well whose month lies in the inclusive 60-month window ending at the logical clock month; rows outside the window are excluded even though they remain stored"
    constants:
      IDLE_THRESHOLD_MONTHS: 24
      DE_MINIMIS_WINDOW_MONTHS: 60
      DE_MINIMIS_BOE: 180.00
      GAS_TO_BOE_DIVISOR: 6
      ORPHAN_SCORE_ELIGIBILITY_MIN: 40.00
      WELL_INACTIVE_IDLE_MONTHS: 12
    precision: "cumulative_boe_60mo 2 decimal places round_half_up, rounded once after summing unrounded row values; idle_months is an exact integer month count"

  - name: grant_report_figures
    trigger: "on POST /funding-sources/{id}/grant-reports and again on every POST /grant-reports/{id}/submission with action SUBMIT — writes GrantReport.wells_plugged_count, reported_cost_cents and federal_share_pct"
    algorithm: aggregation
    formula: |
      # window is a pair of inclusive dates; comparisons use the DATE part of the timestamps
      in_window(ts) = report.period_start <= date(ts) <= report.period_end

      federal_allocs = [ a for a in FundingAllocation
                         if a.source_id == report.source_id
                         and a.status == DISBURSED
                         and in_window(a.disbursed_at) ]
      reported_cost_cents = sum(a.disbursed_cents for a in federal_allocs)

      # wells counted are the distinct jobs behind those federal disbursements whose plugging was
      # accepted (status IN {PLUGGED, RECLAIMED}) - a job funded but not yet accepted is excluded
      jobs = distinct( PluggingJob[a.job_id] for a in federal_allocs
                       if PluggingJob[a.job_id].status IN {PLUGGED, RECLAIMED} )
      wells_plugged_count = count(jobs)

      total_disbursed = sum( a.disbursed_cents for a in FundingAllocation
                             if a.status == DISBURSED
                             and a.job_id IN {j.id for j in jobs}
                             and in_window(a.disbursed_at) )
      federal_share_pct = 0.00 if total_disbursed == 0
                          else round(100.0 * reported_cost_cents / total_disbursed, 2)
    input_set: "FundingAllocation rows against this FundingSource with status == DISBURSED and disbursed_at date inside the inclusive [period_start, period_end] window; COMMITTED and DEOBLIGATED rows are excluded, as are disbursements dated outside the window"
    constants:
      FEDERAL_SHARE_PRECISION: 2
    precision: "reported_cost_cents exact integer cents; federal_share_pct 2 decimal places round_half_up"

validations:
  # ---------------------------------------------------------------- auth (1-14)
  - priority: 1
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    category: auth
    applies_to: "every endpoint"
    condition: "the X-Role header is absent or empty"
  - priority: 2
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    category: auth
    applies_to: "every endpoint"
    condition: "the X-Role header names a role that is not one of the eight declared roles, or the X-User-ID header is absent on any endpoint whose rules reference the acting user"
  - priority: 10
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    category: auth
    applies_to: "every endpoint"
    condition: "the acting role is not listed in that endpoint's roles"
  - priority: 12
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    category: auth
    applies_to: "GET /wells, GET /wells/{id}, GET /bids, GET /bids/{id}, POST /plugging-jobs/{id}/field-report"
    condition: "the acting role is Operator and the target Well.operator_id is not the acting operator's own id, or the acting role is Contractor and the target Bid.contractor_id / PluggingJob's contract contractor_id is not the acting contractor's own id"
  - priority: 14
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    category: auth
    applies_to: "POST /orphan-determinations/{id}/decision, POST /solicitations/{id}/award, POST /funding-allocations/{id}/transitions"
    condition: "the acting X-User-ID equals OrphanDetermination.created_by_user_id on a determination decision, equals Solicitation.created_by_user_id on an award, or equals FundingAllocation.committed_by_user_id on a DISBURSE transition"

  # ------------------------------------------------------- existence (20-22)
  - priority: 20
    error_id: "ERR_{ENTITY}_NOT_FOUND"
    http_status: 404
    category: existence
    applies_to: "every endpoint with a path {id}"
    condition: "no row of the path entity exists with that id (ERR_OPERATOR_NOT_FOUND, ERR_WELL_NOT_FOUND, ERR_ORPHAN_DETERMINATION_NOT_FOUND, ERR_SITE_ACCESS_NOT_FOUND, ERR_WELL_TRANSFER_NOT_FOUND, ERR_CONTRACTOR_NOT_FOUND, ERR_SOLICITATION_NOT_FOUND, ERR_BID_NOT_FOUND, ERR_UNIT_COST_CONTRACT_NOT_FOUND, ERR_PLUGGING_JOB_NOT_FOUND, ERR_RECLAMATION_TASK_NOT_FOUND, ERR_FUNDING_SOURCE_NOT_FOUND, ERR_FUNDING_ALLOCATION_NOT_FOUND, ERR_GRANT_REPORT_NOT_FOUND)"
  - priority: 22
    error_id: "ERR_{ENTITY}_NOT_FOUND"
    http_status: 404
    category: existence
    applies_to: "POST /wells (operator_id), POST /operators/{id}/enforcement (successor_operator_id), POST /wells/{id}/transfers (to_operator_id), POST /solicitations (contract_ceiling context), POST /solicitations/{id}/bids (contractor_id), POST /plugging-jobs (well_id, contract_id), POST /plugging-jobs/{id}/funding-commitments (override_source_id)"
    condition: "a foreign key supplied in the request body names no existing row"

  # ---------------------------------------------------------- schema (30)
  - priority: 30
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    category: schema
    applies_to: "every POST endpoint"
    condition: "a required input is missing, a type is wrong, an enum value is outside its declared set, a number violates its declared bound (negative cents, non-positive depth, methane_scfd < 0, technical_score outside 0..100, limit outside 1..100), a YYYY-MM or ISO-8601 string is malformed, period_end < period_start, or api_well_number duplicates an existing well; also raised when a GrantReport is requested against a FundingSource whose reporting_required is false (only FEDERAL_GRANT sources are reportable)"

  # -------------------------------------------------- concurrency (35)
  - priority: 35
    error_id: ERR_STALE_WELL_VERSION
    http_status: 412
    category: concurrency
    applies_to: "POST /wells/{id}/orphan-determinations"
    condition: "expected_well_version does not equal the Well's current version; the check runs after schema validation and before any state-machine check, and the endpoint bumps Well.version on success"
  - priority: 35
    error_id: ERR_STALE_OPERATOR_VERSION
    http_status: 412
    category: concurrency
    applies_to: "POST /operators/{id}/enforcement"
    condition: "expected_operator_version does not equal the Operator's current version; the check runs after schema validation and before any state-machine check, and the endpoint bumps Operator.version on success"

  # ------------------------------------------------------------- state (39-45)
  - priority: 39
    error_id: ERR_OPERATOR_STILL_SOLVENT
    http_status: 422
    category: business_referential
    applies_to: "POST /operators/{id}/enforcement with action FORFEIT_BOND"
    condition: "Operator.status is not INSOLVENT; a bond may only be forfeited from an operator already declared insolvent. This rule deliberately sits AHEAD of the generic priority-40 edge check, because FORFEIT_BOND is only an edge out of INSOLVENT: without the carve-out every solvent-operator forfeiture would report the generic ERR_INVALID_STATE_TRANSITION and the specific error would be unreachable"
  - priority: 40
    error_id: ERR_INVALID_STATE_TRANSITION
    http_status: 409
    category: state
    applies_to: "every POST that advances a state machine"
    condition: "the requested action is not an edge out of the current state of the row the action directly advances - the path {id} row for an action endpoint, or the created row for a create endpoint (for example a determination decision on a DRAFT determination, a mobilize on an already MOBILIZED job, a REOPEN of a CANCELLED solicitation, a DISBURSE of a DEOBLIGATED allocation, or a PASS on a ReclamationTask still PENDING). The state of a merely REFERENCED entity is never judged here: those gates live at priorities 39 and 41-63 (for example POST /plugging-jobs advances the new job from its initial state, so a non-ORPHAN_CONFIRMED well is reported by priority 41, not by this rule), and a lower-numbered specific rule always preempts this one"
  - priority: 41
    error_id: ERR_WELL_NOT_ORPHAN_CONFIRMED
    http_status: 409
    category: state
    applies_to: "POST /plugging-jobs"
    condition: "Well.status is not ORPHAN_CONFIRMED"
  - priority: 43
    error_id: ERR_SOLICITATION_NOT_OPEN
    http_status: 409
    category: state
    applies_to: "POST /solicitations/{id}/bids"
    condition: "Solicitation.status is not OPEN"
  - priority: 45
    error_id: ERR_FUNDING_SOURCE_EXPIRED
    http_status: 409
    category: state
    applies_to: "POST /funding-sources/{id}/grant-reports, POST /plugging-jobs/{id}/funding-commitments with override_source_id"
    condition: "the named FundingSource has status EXPIRED, or its expires_at is at or before the logical clock"

  # ---------------------------------------------------- business_safety (50-53)
  - priority: 50
    error_id: ERR_SITE_ACCESS_NOT_AUTHORIZED
    http_status: 422
    category: business_safety
    applies_to: "POST /plugging-jobs/{id}/mobilize"
    condition: "the job's Well.access_status is not one of {AGREEMENT_EXECUTED, ENTRY_ORDERED}"
  - priority: 51
    error_id: ERR_STATUTORY_NOTICE_PERIOD_ACTIVE
    http_status: 422
    category: business_safety
    applies_to: "POST /site-accesses/{id}/resolution with outcome ORDER_ENTRY"
    condition: "the logical clock is strictly before SiteAccess.window_end_at (that is, notice_sent_at plus waiting_period_days days); entry may not be ordered before the surface owner's statutory response period has run"
  - priority: 52
    error_id: ERR_REVEGETATION_WAITING_PERIOD
    http_status: 422
    category: business_safety
    applies_to: "POST /reclamation-tasks/{id}/progress with action START on a REVEGETATION task"
    condition: "the job's PIT_CLOSURE task is not COMPLETE (it has no completed_at yet), or fewer than REVEGETATION_MIN_WAIT_DAYS (90) days have elapsed between that completed_at and the logical clock"
  - priority: 53
    error_id: ERR_RECLAMATION_INCOMPLETE
    http_status: 422
    category: business_safety
    applies_to: "POST /reclamation-tasks/{id}/progress with action PASS on a REVEGETATION task"
    condition: "another ReclamationTask of the same job (EQUIPMENT_REMOVAL or PIT_CLOSURE) is not COMPLETE; revegetation sign-off is the job's final acceptance and may not be recorded while any sibling task is outstanding, which is what makes the automatic PLUGGED -> RECLAIMED transition safe to treat as a pure side effect of the third completion"

  # --------------------------------------------------- business_rule (55)
  - priority: 55
    error_id: ERR_ORPHAN_CRITERIA_NOT_MET
    http_status: 422
    category: business_rule
    applies_to: "POST /orphan-determinations/{id}/decision with action CONFIRM"
    condition: "calculations.orphan_classification_criteria is not satisfied at decision time: idle_months < 24, or cumulative_boe_60mo > 180.00, or Well.screening_score < 40.00"

  # ------------------------------------------------ business_temporal (58-59)
  - priority: 58
    error_id: ERR_ACCESS_WINDOW_CONFLICT
    http_status: 409
    category: business_temporal
    applies_to: "POST /wells/{id}/site-accesses"
    condition: "an existing SiteAccess for the same well with status IN {REQUESTED, AGREEMENT_EXECUTED, ENTRY_ORDERED} has a CLOSED interval [notice_sent_at, window_end_at] that overlaps the requested [notice_sent_at, window_end_at]; because the interval is closed, touching endpoints DO conflict"
  - priority: 59
    error_id: ERR_CREW_WINDOW_CONFLICT
    http_status: 409
    category: business_temporal
    applies_to: "POST /plugging-jobs"
    condition: "the crew occupancy interval of the job being created, the HALF-OPEN [scheduled_start, scheduled_start + (planned_rig_days + CREW_DEMOB_BUFFER_DAYS) days), overlaps the same half-open interval of another PluggingJob whose contract has the same contractor_id and whose status IN {SCHEDULED, MOBILIZED, FIELD_REPORTED, REWORK_REQUIRED}; because the interval is half-open, a job whose scheduled_start falls exactly on another job's crew_window_end_at is allowed"

  # --------------------------------------------- business_referential (61-64)
  - priority: 61
    error_id: ERR_CONTRACTOR_NOT_ELIGIBLE
    http_status: 422
    category: business_referential
    applies_to: "POST /solicitations/{id}/bids, POST /solicitations/{id}/award"
    condition: "the bidding or winning Contractor has license_status other than GOOD_STANDING (that is, SUSPENDED or DEBARRED)"
  - priority: 62
    error_id: ERR_CONTRACT_NOT_ACTIVE
    http_status: 422
    category: business_referential
    applies_to: "POST /plugging-jobs, POST /plugging-jobs/{id}/mobilize, POST /plugging-jobs/{id}/field-report"
    condition: "the job's UnitCostContract.status is not ACTIVE"
  - priority: 63
    error_id: ERR_TRANSFER_TO_INSOLVENT_OPERATOR
    http_status: 422
    category: business_referential
    applies_to: "POST /wells/{id}/transfers, POST /well-transfers/{id}/decision with action APPROVE"
    condition: "the receiving Operator has status IN {INSOLVENT, REVOKED}, or has status DELINQUENT and orphan_candidate_count > 0"
  - priority: 64
    error_id: ERR_FORFEITED_BOND_OPERATOR_MISMATCH
    http_status: 422
    category: business_referential
    applies_to: "POST /plugging-jobs/{id}/funding-commitments with override_source_id naming a FORFEITED_BOND source"
    condition: "that source's bond_operator_id is not equal to the job's Well.operator_id"

  # --------------------------------------------- business_constraint (65-72)
  - priority: 65
    error_id: ERR_DUPLICATE_BID
    http_status: 409
    category: business_constraint
    applies_to: "POST /solicitations/{id}/bids"
    condition: "a Bid already exists for this solicitation and contractor with status IN {SUBMITTED, RESPONSIVE, NONRESPONSIVE, AWARDED}"
  - priority: 66
    error_id: ERR_DUPLICATE_PRODUCTION_MONTH
    http_status: 409
    category: business_constraint
    applies_to: "POST /wells/{id}/production-records"
    condition: "a ProductionRecord already exists for this well and month"
  - priority: 67
    error_id: ERR_BID_DEADLINE_PASSED
    http_status: 422
    category: business_constraint
    applies_to: "POST /solicitations/{id}/bids"
    condition: "the logical clock is at or after Solicitation.bid_due_at"
  - priority: 68
    error_id: ERR_TECHNICAL_SCORE_BELOW_MINIMUM
    http_status: 422
    category: business_constraint
    applies_to: "POST /bids/{id}/evaluation with outcome RESPONSIVE"
    condition: "Bid.technical_score is strictly below Solicitation.min_technical_score"
  - priority: 69
    error_id: ERR_BID_EXCEEDS_CEILING
    http_status: 422
    category: business_constraint
    applies_to: "POST /solicitations/{id}/bids"
    condition: "the bid's evaluated_unit_cost_cents is strictly greater than Solicitation.ceiling_cents"
  - priority: 70
    error_id: ERR_NO_RESPONSIVE_BIDS
    http_status: 422
    category: business_constraint
    applies_to: "POST /solicitations/{id}/award"
    condition: "the RESPONSIVE bid set for this solicitation has cardinality zero"
  - priority: 71
    error_id: ERR_REVISION_LIMIT_EXCEEDED
    http_status: 422
    category: business_constraint
    applies_to: "POST /orphan-determinations/{id}/decision with action REQUEST_REVISION"
    condition: "OrphanDetermination.revision_round is already at MAX_REVISION_ROUNDS (2)"
  - priority: 72
    error_id: ERR_REWORK_LIMIT_EXCEEDED
    http_status: 422
    category: business_constraint
    applies_to: "POST /plugging-jobs/{id}/review with action REWORK"
    condition: "PluggingJob.rework_round is already at MAX_REWORK_ROUNDS (2)"

  - priority: 73
    error_id: ERR_REOPEN_LIMIT_EXCEEDED
    http_status: 422
    category: business_constraint
    applies_to: "POST /solicitations/{id}/lifecycle with action REOPEN"
    condition: "Solicitation.reopen_round is already at MAX_REOPEN_ROUNDS (1)"

  # ------------------------------------------------- business_fiscal (75-80)
  - priority: 75
    error_id: ERR_TRANSFEREE_ASSURANCE_INSUFFICIENT
    http_status: 422
    category: business_fiscal
    applies_to: "POST /well-transfers/{id}/decision with action APPROVE"
    condition: "the receiving operator's bond_amount_cents is strictly less than its post-transfer required_bond_cents computed by calculations.operator_financial_assurance_requirement under its own tier"
  - priority: 76
    error_id: ERR_CONTRACT_CEILING_EXCEEDED
    http_status: 422
    category: business_fiscal
    applies_to: "POST /plugging-jobs, POST /plugging-jobs/{id}/field-report"
    condition: "the contract's obligated_cents after this write would strictly exceed UnitCostContract.ceiling_cents"
  - priority: 78
    error_id: ERR_FEDERAL_MATCH_INSUFFICIENT
    http_status: 422
    category: business_fiscal
    applies_to: "POST /plugging-jobs/{id}/funding-commitments"
    condition: "the waterfall ends with a positive remainder AND at least one FEDERAL_GRANT contribution was throttled below the lesser of the remaining need and its remaining authority by the match cap; this error outranks ERR_FUNDING_SHORTFALL"
  - priority: 79
    error_id: ERR_FUNDING_SHORTFALL
    http_status: 422
    category: business_fiscal
    applies_to: "POST /plugging-jobs/{id}/funding-commitments"
    condition: "the waterfall ends with a positive remainder and no federal grant was match-throttled; no FundingAllocation rows are persisted"
  - priority: 80
    error_id: ERR_DISBURSEMENT_EXCEEDS_ALLOCATION
    http_status: 422
    category: business_fiscal
    applies_to: "POST /funding-allocations/{id}/transitions with action DISBURSE"
    condition: "invoice_cents is strictly greater than FundingAllocation.allocated_cents"

endpoints:
  # ------------------------------------------------------------------ Operator
  - method: POST
    path: "/operators"
    description: "Register an oil and gas operator with its financial assurance tier and posted bond."
    roles: [ProgramAdmin]
    code: 201
    input: [name, region_code, financial_assurance_tier, bond_amount_cents]
    output: Operator
    side_effects: ["required_bond_cents = 0 and status = ACTIVE for an operator with no wells"]
  - method: GET
    path: "/operators/{id}"
    description: "Fetch one operator with its computed assurance requirement and well counts."
    roles: [ProgramAdmin, FieldInspector, DeterminationReviewer, ProcurementOfficer, AwardAuthority, FundingOfficer, Operator]
    code: 200
    input: []
    output: Operator
    side_effects: []
  - method: GET
    path: "/operators"
    description: "List operators, filterable by regulatory standing, district, or the operator they are the named successor of."
    roles: [ProgramAdmin, FieldInspector, DeterminationReviewer, ProcurementOfficer, AwardAuthority, FundingOfficer]
    code: 200
    input: ["status?", "region_code?", "successor_operator_id?", "limit?", "offset?"]
    output: Operator[]
    side_effects: []
  - method: POST
    path: "/operators/{id}/enforcement"
    description: "Take an enforcement action against an operator: DECLARE_INSOLVENT, REVOKE, or FORFEIT_BOND. Requires expected_operator_version because successive enforcement actions contend on the same operator row."
    roles: [ProgramAdmin]
    code: 200
    input: [action, expected_operator_version, "memo?", "successor_operator_id?"]
    output: Operator
    side_effects:
      - "action DECLARE_INSOLVENT: status ACTIVE|DELINQUENT -> INSOLVENT, insolvency_declared_at = clock, successor_operator_id stored when supplied, and every APPROVED WellTransfer into this operator whose approved_at is within TRANSFER_VOID_LOOKBACK_DAYS (180) days of the clock is VOIDED, returning each well to its from_operator and recomputing both operators' required_bond_cents and counts"
      - "action REVOKE: status DELINQUENT -> REVOKED and every Well of this operator with status IN {PRODUCING, INACTIVE} becomes ORPHAN_CANDIDATE with both priority scores recomputed"
      - "action FORFEIT_BOND: status INSOLVENT -> REVOKED, bond_forfeited_at = clock, a FundingSource of kind FORFEITED_BOND is created with authorized_cents = the operator's pre-forfeiture bond_amount_cents, bond_operator_id = this operator, allowable_cost_categories = [PLUGGING, RECLAMATION], expires_at = clock + FORFEITED_BOND_TERM_DAYS (3650) days, and status ACTIVE, operator bond_amount_cents is set to 0, and the ORPHAN_CANDIDATE cascade above also runs"
      - "Operator.version is incremented on every successful call"

  # ---------------------------------------------------------------------- Well
  - method: POST
    path: "/wells"
    description: "Add a well to the state inventory under an operator, with the emissions, groundwater, population and surface inputs that drive both priority scores."
    roles: [ProgramAdmin, FieldInspector]
    code: 201
    input: [api_well_number, operator_id, spud_year, total_depth_ft, casing_strings, methane_scfd, groundwater_depth_ft, population_within_1000ft, surface_disturbance_acres, "last_production_month?"]
    output: Well
    side_effects:
      - "calculations.orphan_priority_score writes screening_score and remediation_score"
      - "calculations.orphan_classification_criteria writes idle_months and cumulative_boe_60mo"
      - "calculations.operator_financial_assurance_requirement recomputes the operator's required_bond_cents, active_well_count, and ACTIVE<->DELINQUENT standing"
  - method: GET
    path: "/wells/{id}"
    description: "Fetch one well with both priority-score variants and both state dimensions."
    roles: [ProgramAdmin, FieldInspector, DeterminationReviewer, ProcurementOfficer, AwardAuthority, FundingOfficer, Operator]
    code: 200
    input: []
    output: Well
    side_effects: []
  - method: GET
    path: "/wells"
    description: "List wells filtered by operator, lifecycle status, access status, or a minimum screening score."
    roles: [ProgramAdmin, FieldInspector, DeterminationReviewer, ProcurementOfficer, AwardAuthority, FundingOfficer, Operator]
    code: 200
    input: ["operator_id?", "status?", "access_status?", "min_screening_score?", "limit?", "offset?"]
    output: Well[]
    side_effects: []
  - method: POST
    path: "/wells/{id}/production-records"
    description: "Report one month of oil and gas production for a well; feeds the de-minimis production test."
    roles: [ProgramAdmin, FieldInspector, Operator]
    code: 201
    input: [month, oil_bbl, gas_mcf]
    output: ProductionRecord
    side_effects:
      - "boe = oil_bbl + gas_mcf / 6, stored UNROUNDED at the row level; the 2-decimal round_half_up happens exactly once, on the aggregate Well.cumulative_boe_60mo"
      - "Well.last_production_month is advanced when month is later than the stored value"
      - "calculations.orphan_classification_criteria recomputes Well.idle_months and Well.cumulative_boe_60mo"
  - method: GET
    path: "/wells/{id}/production-records"
    description: "List a well's reported production months, ordered by month ascending."
    roles: [ProgramAdmin, FieldInspector, DeterminationReviewer, FundingOfficer, Operator]
    code: 200
    input: ["limit?", "offset?"]
    output: ProductionRecord[]
    side_effects: []

  # ------------------------------------------------------- OrphanDetermination
  - method: POST
    path: "/wells/{id}/orphan-determinations"
    description: "Open a new orphan determination on a well. Requires expected_well_version because a second inspector opening a determination supersedes any open DRAFT or REVISION_REQUESTED determination on the same well."
    roles: [FieldInspector, ProgramAdmin]
    code: 201
    input: [inspector_notes, expected_well_version]
    output: OrphanDetermination
    side_effects:
      - "any existing OrphanDetermination for this well with status IN {DRAFT, REVISION_REQUESTED} becomes SUPERSEDED"
      - "Well.status PRODUCING -> INACTIVE"
      - "Well.version is incremented"
      - "created_by_user_id = the acting X-User-ID"
  - method: GET
    path: "/orphan-determinations/{id}"
    description: "Fetch one orphan determination with the criteria snapshot taken at its last submission."
    roles: [ProgramAdmin, FieldInspector, DeterminationReviewer]
    code: 200
    input: []
    output: OrphanDetermination
    side_effects: []
  - method: GET
    path: "/wells/{id}/orphan-determinations"
    description: "List every orphan determination ever opened on a well, ordered by created_at ascending."
    roles: [ProgramAdmin, FieldInspector, DeterminationReviewer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: OrphanDetermination[]
    side_effects: []
  - method: POST
    path: "/orphan-determinations/{id}/submit"
    description: "Submit a DRAFT or REVISION_REQUESTED determination for reviewer decision, snapshotting the classification criteria as of the logical clock."
    roles: [FieldInspector, ProgramAdmin]
    code: 200
    input: ["inspector_notes?"]
    output: OrphanDetermination
    side_effects:
      - "snapshot_idle_months, snapshot_cumulative_boe_60mo and snapshot_screening_score are written from the well's current computed values"
      - "submitted_at = clock; Well.status PRODUCING|INACTIVE -> ORPHAN_CANDIDATE"
  - method: POST
    path: "/orphan-determinations/{id}/decision"
    description: "Reviewer decision on a submitted determination: CONFIRM, REJECT, or REQUEST_REVISION. The decider may not be the determination's author."
    roles: [DeterminationReviewer]
    code: 200
    input: [action, rationale]
    output: OrphanDetermination
    side_effects:
      - "action CONFIRM: re-evaluates calculations.orphan_classification_criteria against live data, sets status CONFIRMED, Well.status ORPHAN_CANDIDATE -> ORPHAN_CONFIRMED, Well.orphan_confirmed_at = clock, and increments the operator's orphan_candidate_count"
      - "action REJECT: status REJECTED and Well.status ORPHAN_CANDIDATE -> INACTIVE"
      - "action REQUEST_REVISION: status REVISION_REQUESTED and revision_round += 1"
      - "decided_by_user_id and decided_at are recorded"

  # ---------------------------------------------------------------- SiteAccess
  - method: POST
    path: "/wells/{id}/site-accesses"
    description: "Open a surface-access request on a well, either by negotiated AGREEMENT or by STATUTORY_ENTRY notice. The notice window [notice_sent_at, window_end_at] is CLOSED, so a new request touching an open request's endpoint is rejected."
    roles: [ProgramAdmin, FieldInspector]
    code: 201
    input: [surface_owner_name, mode, "waiting_period_days?", "compensation_cents?"]
    output: SiteAccess
    side_effects:
      - "notice_sent_at = clock; window_end_at = notice_sent_at + waiting_period_days days"
      - "Well.access_status NO_ACCESS_REQUESTED|ACCESS_DENIED -> ACCESS_PENDING"
  - method: GET
    path: "/site-accesses/{id}"
    description: "Fetch one surface-access request with its notice window and legal authority citation."
    roles: [ProgramAdmin, FieldInspector, DeterminationReviewer]
    code: 200
    input: []
    output: SiteAccess
    side_effects: []
  - method: GET
    path: "/wells/{id}/site-accesses"
    description: "List every surface-access request on a well, ordered by notice_sent_at ascending."
    roles: [ProgramAdmin, FieldInspector, DeterminationReviewer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: SiteAccess[]
    side_effects: []
  - method: POST
    path: "/site-accesses/{id}/resolution"
    description: "Resolve an access request: EXECUTE_AGREEMENT with the surface owner, ORDER_ENTRY under statutory authority once the notice period has run, or DENY."
    roles: [ProgramAdmin]
    code: 200
    input: [outcome, "legal_authority_citation?"]
    output: SiteAccess
    side_effects:
      - "outcome EXECUTE_AGREEMENT: status AGREEMENT_EXECUTED, Well.access_status -> AGREEMENT_EXECUTED"
      - "outcome ORDER_ENTRY: status ENTRY_ORDERED, legal_authority_citation stored, Well.access_status -> ENTRY_ORDERED"
      - "outcome DENY: status DENIED, Well.access_status -> ACCESS_DENIED"
      - "resolved_at = clock"

  # --------------------------------------------------------------- WellTransfer
  - method: POST
    path: "/wells/{id}/transfers"
    description: "Propose transfer of a well from its current operator to a receiving operator."
    roles: [ProgramAdmin, Operator]
    code: 201
    input: [to_operator_id]
    output: WellTransfer
    side_effects:
      - "from_operator_id is copied from the well's current operator_id; status = PENDING"
      - "transferee_required_bond_cents is computed as the receiving operator's required_bond_cents under its own tier assuming this well is added"
  - method: GET
    path: "/well-transfers/{id}"
    description: "Fetch one proposed or decided well transfer."
    roles: [ProgramAdmin, FieldInspector, DeterminationReviewer, FundingOfficer, Operator]
    code: 200
    input: []
    output: WellTransfer
    side_effects: []
  - method: GET
    path: "/well-transfers"
    description: "List well transfers filtered by well, releasing operator, receiving operator, or status."
    roles: [ProgramAdmin, FieldInspector, DeterminationReviewer, FundingOfficer]
    code: 200
    input: ["well_id?", "from_operator_id?", "to_operator_id?", "status?", "limit?", "offset?"]
    output: WellTransfer[]
    side_effects: []
  - method: POST
    path: "/well-transfers/{id}/decision"
    description: "Decide a pending transfer (APPROVE, DENY) or void an approved one (VOID). APPROVE is blocked when the receiving operator is insolvent, revoked, or under-bonded for its post-transfer inventory."
    roles: [ProgramAdmin]
    code: 200
    input: [action, "rationale?"]
    output: WellTransfer
    side_effects:
      - "action APPROVE: Well.operator_id becomes to_operator_id, approved_at = clock, and calculations.operator_financial_assurance_requirement recomputes required_bond_cents, active_well_count and orphan_candidate_count for BOTH operators, flipping each between ACTIVE and DELINQUENT as needed"
      - "action VOID: Well.operator_id is restored to from_operator_id, voided_at = clock, void_reason stored from rationale, and both operators' computed fields are recomputed so that the pre-approval values are restored exactly"
      - "decided_by_user_id is recorded"

  # ----------------------------------------------------------------- Contractor
  - method: POST
    path: "/contractors"
    description: "Register a plugging contractor eligible to bid on state solicitations."
    roles: [ProcurementOfficer, ProgramAdmin]
    code: 201
    input: [name, license_number, bond_amount_cents, performance_score]
    output: Contractor
    side_effects: ["license_status = GOOD_STANDING"]
  - method: GET
    path: "/contractors/{id}"
    description: "Fetch one contractor with its licensing standing."
    roles: [ProgramAdmin, ProcurementOfficer, AwardAuthority, FundingOfficer, FieldInspector, Contractor]
    code: 200
    input: []
    output: Contractor
    side_effects: []
  - method: GET
    path: "/contractors"
    description: "List contractors filtered by licensing standing."
    roles: [ProgramAdmin, ProcurementOfficer, AwardAuthority, FundingOfficer, FieldInspector]
    code: 200
    input: ["license_status?", "limit?", "offset?"]
    output: Contractor[]
    side_effects: []
  - method: POST
    path: "/contractors/{id}/eligibility"
    description: "Change a contractor's licensing standing: SUSPEND_LICENSE, REINSTATE, or DEBAR."
    roles: [ProgramAdmin]
    code: 200
    input: [action, "reason?"]
    output: Contractor
    side_effects:
      - "SUSPEND_LICENSE and DEBAR set suspended_at = clock and cascade every ACTIVE UnitCostContract of this contractor to SUSPENDED"
      - "REINSTATE clears suspended_at and cascades every SUSPENDED UnitCostContract of this contractor back to ACTIVE"

  # --------------------------------------------------------------- Solicitation
  - method: POST
    path: "/solicitations"
    description: "Draft a plugging-services solicitation with its bid deadline, cost ceiling and minimum technical score."
    roles: [ProcurementOfficer]
    code: 201
    input: [region_code, scope_description, bid_due_at, ceiling_cents, min_technical_score]
    output: Solicitation
    side_effects: ["status = DRAFT; created_by_user_id = the acting X-User-ID, which the award SoD gate later compares against"]
  - method: GET
    path: "/solicitations/{id}"
    description: "Fetch one solicitation with its procurement state and reopen count."
    roles: [ProgramAdmin, ProcurementOfficer, AwardAuthority, FundingOfficer, Contractor]
    code: 200
    input: []
    output: Solicitation
    side_effects: []
  - method: GET
    path: "/solicitations"
    description: "List solicitations filtered by district or procurement state."
    roles: [ProgramAdmin, ProcurementOfficer, AwardAuthority, FundingOfficer, Contractor]
    code: 200
    input: ["region_code?", "status?", "limit?", "offset?"]
    output: Solicitation[]
    side_effects: []
  - method: POST
    path: "/solicitations/{id}/lifecycle"
    description: "Advance a solicitation: OPEN it for bidding, CLOSE it for evaluation, REOPEN it once for more bids, or CANCEL it."
    roles: [ProcurementOfficer]
    code: 200
    input: [action, "new_bid_due_at?"]
    output: Solicitation
    side_effects:
      - "action REOPEN: status EVALUATING -> OPEN, reopen_round += 1, bid_due_at replaced by new_bid_due_at; allowed at most MAX_REOPEN_ROUNDS (1) times"
      - "action CANCEL: every Bid still SUBMITTED, RESPONSIVE or NONRESPONSIVE becomes NOT_AWARDED"

  # ------------------------------------------------------------------------ Bid
  - method: POST
    path: "/solicitations/{id}/bids"
    description: "Submit a unit-price bid on an open solicitation. The evaluated unit cost is computed from the fixed 120-sack / 4-rig-day / 800-ft basket plus mobilization."
    roles: [ProcurementOfficer, Contractor]
    code: 201
    input: [contractor_id, cement_per_sack_cents, rig_day_rate_cents, casing_per_ft_cents, mobilization_fee_cents, technical_score]
    output: Bid
    side_effects: ["evaluated_unit_cost_cents is computed per calculations.bid_composite_score step 1; status = SUBMITTED"]
  - method: GET
    path: "/bids/{id}"
    description: "Fetch one bid with its evaluated unit cost and, after award, its price and composite scores."
    roles: [ProgramAdmin, ProcurementOfficer, AwardAuthority, FundingOfficer, Contractor]
    code: 200
    input: []
    output: Bid
    side_effects: []
  - method: GET
    path: "/bids"
    description: "List bids filtered by solicitation, contractor, or responsiveness status."
    roles: [ProgramAdmin, ProcurementOfficer, AwardAuthority, FundingOfficer, Contractor]
    code: 200
    input: ["solicitation_id?", "contractor_id?", "status?", "limit?", "offset?"]
    output: Bid[]
    side_effects: []
  - method: POST
    path: "/bids/{id}/evaluation"
    description: "Record a responsiveness determination on a bid; a bid may be re-evaluated in either direction while the solicitation is EVALUATING."
    roles: [ProcurementOfficer]
    code: 200
    input: [outcome, "reason?"]
    output: Bid
    side_effects: ["status SUBMITTED|NONRESPONSIVE -> RESPONSIVE or SUBMITTED|RESPONSIVE -> NONRESPONSIVE; evaluated_by_user_id recorded; nonresponsive_reason stored on NONRESPONSIVE"]
  - method: POST
    path: "/solicitations/{id}/award"
    description: "Award the solicitation to the highest composite-scoring responsive bid and create the unit-cost contract. The awarding AwardAuthority may not be the officer who created the solicitation."
    roles: [AwardAuthority]
    code: 201
    input: []
    output: UnitCostContract
    side_effects:
      - "calculations.bid_composite_score writes price_score and composite_score on every RESPONSIVE bid and selects the winner"
      - "winning Bid -> AWARDED; every other RESPONSIVE or SUBMITTED bid -> NOT_AWARDED"
      - "Solicitation.status EVALUATING -> AWARDED"
      - "a UnitCostContract is created with the winner's four unit rates, ceiling_cents copied from the solicitation, obligated_cents = 0, status = ACTIVE, and awarded_by_user_id = the acting X-User-ID"

  # ----------------------------------------------------------- UnitCostContract
  - method: GET
    path: "/unit-cost-contracts/{id}"
    description: "Fetch one unit-cost contract with its rates, ceiling and current obligation."
    roles: [ProgramAdmin, ProcurementOfficer, AwardAuthority, FundingOfficer, FieldInspector, Contractor]
    code: 200
    input: []
    output: UnitCostContract
    side_effects: []
  - method: GET
    path: "/unit-cost-contracts"
    description: "List unit-cost contracts filtered by solicitation, contractor, or winning bid."
    roles: [ProgramAdmin, ProcurementOfficer, AwardAuthority, FundingOfficer, FieldInspector]
    code: 200
    input: ["solicitation_id?", "contractor_id?", "winning_bid_id?", "status?", "limit?", "offset?"]
    output: UnitCostContract[]
    side_effects: []

  # ----------------------------------------------------------------- PluggingJob
  - method: POST
    path: "/plugging-jobs"
    description: "Order plugging of an orphan-confirmed well under a unit-cost contract. The crew occupancy interval [scheduled_start, scheduled_start + (planned_rig_days + 2) days) is HALF-OPEN, so back-to-back jobs that touch at the boundary are allowed."
    roles: [ProgramAdmin, ProcurementOfficer]
    code: 201
    input: [well_id, contract_id, scheduled_start, planned_cement_sacks, planned_rig_days, planned_casing_ft]
    output: PluggingJob
    side_effects:
      - "calculations.plugging_cost_estimate writes plugging_cost_estimate_cents and raises UnitCostContract.obligated_cents"
      - "crew_window_end_at = scheduled_start + (planned_rig_days + CREW_DEMOB_BUFFER_DAYS (2)) days"
      - "Well.status ORPHAN_CONFIRMED -> PLUGGING_SCHEDULED; status = SCHEDULED"
  - method: GET
    path: "/plugging-jobs/{id}"
    description: "Fetch one plugging job with its estimate, cumulative actual cost, funded amount and downhole documentation."
    roles: [ProgramAdmin, FieldInspector, ProcurementOfficer, AwardAuthority, FundingOfficer, Contractor]
    code: 200
    input: []
    output: PluggingJob
    side_effects: []
  - method: GET
    path: "/plugging-jobs"
    description: "List plugging jobs filtered by well, contract, or field-operations status."
    roles: [ProgramAdmin, FieldInspector, ProcurementOfficer, AwardAuthority, FundingOfficer, Contractor]
    code: 200
    input: ["well_id?", "contract_id?", "status?", "limit?", "offset?"]
    output: PluggingJob[]
    side_effects: []
  - method: POST
    path: "/plugging-jobs/{id}/mobilize"
    description: "Mobilize the crew to the well site. Requires an executed surface owner agreement or an entry order, and an ACTIVE contract."
    roles: [ProgramAdmin, FieldInspector]
    code: 200
    input: []
    output: PluggingJob
    side_effects: ["status SCHEDULED -> MOBILIZED; mobilized_at = clock"]
  - method: POST
    path: "/plugging-jobs/{id}/field-report"
    description: "File a plugging field report documenting cement placement, casing removal and downhole conditions. Each round's cost adds to the job's cumulative actual, with the 4.25 percent state administrative fee rounded PER LINE ITEM before summing."
    roles: [FieldInspector, Contractor]
    code: 200
    input: [cement_sacks_used, rig_days_used, casing_removed_ft, downhole_conditions, plug_intervals]
    output: PluggingJob
    side_effects:
      - "calculations.plugging_actual_cost writes last_round_cost_cents, adds it to actual_cost_cents, and recomputes UnitCostContract.obligated_cents"
      - "status MOBILIZED|REWORK_REQUIRED -> FIELD_REPORTED"
      - "rounds after the first bill only REMOB_PCT (50 percent) of the contract mobilization fee"
      - "UnitCostContract.status ACTIVE -> CLOSED when obligated_cents reaches ceiling_cents exactly"
  - method: POST
    path: "/plugging-jobs/{id}/review"
    description: "Review a filed field report: ACCEPT the plugging, or send it back for REWORK (at most twice)."
    roles: [ProgramAdmin, DeterminationReviewer]
    code: 200
    input: [action, findings]
    output: PluggingJob
    side_effects:
      - "action ACCEPT: status FIELD_REPORTED -> PLUGGED, plugging_accepted_at = clock, Well.status PLUGGING_SCHEDULED -> PLUGGED, the operator's required_bond_cents / active_well_count / orphan_candidate_count are recomputed (which can flip the operator DELINQUENT -> ACTIVE), and three ReclamationTask rows are created PENDING (EQUIPMENT_REMOVAL, PIT_CLOSURE, REVEGETATION)"
      - "action REWORK: status FIELD_REPORTED -> REWORK_REQUIRED and rework_round += 1"

  # -------------------------------------------------------------- ReclamationTask
  - method: GET
    path: "/plugging-jobs/{id}/reclamation-tasks"
    description: "List the three surface reclamation tasks of a job, ordered by task_type ascending (EQUIPMENT_REMOVAL, PIT_CLOSURE, REVEGETATION)."
    roles: [ProgramAdmin, FieldInspector, DeterminationReviewer, FundingOfficer, Contractor]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: ReclamationTask[]
    side_effects: []
  - method: GET
    path: "/reclamation-tasks/{id}"
    description: "Fetch one surface reclamation task with its inspection round."
    roles: [ProgramAdmin, FieldInspector, DeterminationReviewer, FundingOfficer, Contractor]
    code: 200
    input: []
    output: ReclamationTask
    side_effects: []
  - method: POST
    path: "/reclamation-tasks/{id}/progress"
    description: "Advance a reclamation task: START the work, PASS the inspection, or FAIL it back to rework. Revegetation may not START until 90 days after pit closure completed."
    roles: [FieldInspector]
    code: 200
    input: [action, "notes?"]
    output: ReclamationTask
    side_effects:
      - "action START: status PENDING|REWORK_NEEDED -> IN_PROGRESS"
      - "action PASS: status IN_PROGRESS -> COMPLETE, completed_at = clock; when this makes all three tasks of the job COMPLETE, PluggingJob.status PLUGGED -> RECLAIMED, reclaimed_at = clock, Well.status PLUGGED -> RECLAIMED, and the operator's computed fields are recomputed"
      - "action FAIL: status IN_PROGRESS -> REWORK_NEEDED and inspection_round += 1"
      - "inspected_by_user_id and notes are recorded"

  # ---------------------------------------------------------------- FundingSource
  - method: POST
    path: "/funding-sources"
    description: "Register a funding stream: a state fund, a federal grant with its required match percentage, or a forfeited bond tied to one operator."
    roles: [FundingOfficer, ProgramAdmin]
    code: 201
    input: [kind, name, authorized_cents, expires_at, allowable_cost_categories, "federal_match_required_pct?", "bond_operator_id?"]
    output: FundingSource
    side_effects: ["status = ACTIVE; committed_cents = 0; reporting_required = true only for kind FEDERAL_GRANT"]
  - method: GET
    path: "/funding-sources/{id}"
    description: "Fetch one funding source with its authorized, committed and disbursed cents."
    roles: [ProgramAdmin, FundingOfficer, ProcurementOfficer, AwardAuthority, DeterminationReviewer]
    code: 200
    input: []
    output: FundingSource
    side_effects: []
  - method: GET
    path: "/funding-sources"
    description: "List funding sources filtered by kind, availability status, or the operator whose forfeited bond created them."
    roles: [ProgramAdmin, FundingOfficer, ProcurementOfficer, AwardAuthority, DeterminationReviewer]
    code: 200
    input: ["kind?", "status?", "bond_operator_id?", "limit?", "offset?"]
    output: FundingSource[]
    side_effects: []

  # ------------------------------------------------------------ FundingAllocation
  - method: POST
    path: "/plugging-jobs/{id}/funding-commitments"
    description: "Run the funding waterfall for a job's estimate: forfeited bonds first, then federal grants throttled by their match entitlement (single pass, no retroactive match expansion), then state funds. All-or-nothing. When override_source_id is supplied the eligible pool is restricted to that single FundingSource, which must still satisfy every eligibility test in calculations.job_funding_waterfall (status, expiry, PLUGGING category, remaining authority, and bond-operator match), and it occupies waterfall_rank 1."
    roles: [FundingOfficer]
    code: 201
    input: ["override_source_id?"]
    output: FundingAllocation[]
    side_effects:
      - "calculations.job_funding_waterfall creates one COMMITTED FundingAllocation per contributing source with its waterfall_rank"
      - "each source's committed_cents rises by its contribution and the source flips ACTIVE -> EXHAUSTED when committed_cents reaches authorized_cents"
      - "PluggingJob.funded_cents = the job's plugging_cost_estimate_cents"
      - "committed_by_user_id = the acting X-User-ID, which the disbursement SoD gate later compares against"
      - "on ERR_FUNDING_SHORTFALL or ERR_FEDERAL_MATCH_INSUFFICIENT nothing is persisted: no allocations, no committed_cents change, no funded_cents change"
  - method: GET
    path: "/funding-allocations/{id}"
    description: "Fetch one funding allocation with its waterfall rank and obligation state."
    roles: [ProgramAdmin, FundingOfficer, AwardAuthority, DeterminationReviewer]
    code: 200
    input: []
    output: FundingAllocation
    side_effects: []
  - method: GET
    path: "/funding-allocations"
    description: "List funding allocations filtered by job, source, or obligation state; ordered by waterfall_rank ascending."
    roles: [ProgramAdmin, FundingOfficer, AwardAuthority, DeterminationReviewer]
    code: 200
    input: ["job_id?", "source_id?", "status?", "limit?", "offset?"]
    output: FundingAllocation[]
    side_effects: []
  - method: POST
    path: "/funding-allocations/{id}/transitions"
    description: "DISBURSE an allocation against an invoice, or DEOBLIGATE it and return the cents to its source. The disbursing officer may not be the officer who committed the allocation."
    roles: [FundingOfficer]
    code: 200
    input: [action, "invoice_cents?"]
    output: FundingAllocation
    side_effects:
      - "action DISBURSE: status COMMITTED -> DISBURSED, disbursed_cents = invoice_cents, disbursed_at = clock, disbursed_by_user_id recorded, and FundingSource.disbursed_cents rises by the same amount"
      - "action DEOBLIGATE: status COMMITTED -> DEOBLIGATED, deobligated_at = clock, FundingSource.committed_cents falls by allocated_cents (restoring the pre-commitment value exactly), the source flips EXHAUSTED -> ACTIVE when authority again remains, and PluggingJob.funded_cents falls by allocated_cents"

  # ------------------------------------------------------------------ GrantReport
  - method: POST
    path: "/funding-sources/{id}/grant-reports"
    description: "Generate the federal reporting period figures for a grant: wells plugged, reported federal cost and federal share of project cost inside the inclusive window."
    roles: [FundingOfficer]
    code: 201
    input: [period_start, period_end]
    output: GrantReport
    side_effects: ["calculations.grant_report_figures writes wells_plugged_count, reported_cost_cents and federal_share_pct; status = DUE"]
  - method: GET
    path: "/funding-sources/{id}/grant-reports"
    description: "List the reporting periods filed against a federal grant, ordered by period_start ascending."
    roles: [ProgramAdmin, FundingOfficer, AwardAuthority]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: GrantReport[]
    side_effects: []
  - method: GET
    path: "/grant-reports/{id}"
    description: "Fetch one grant report with its computed figures and review state."
    roles: [ProgramAdmin, FundingOfficer, AwardAuthority]
    code: 200
    input: []
    output: GrantReport
    side_effects: []
  - method: POST
    path: "/grant-reports/{id}/submission"
    description: "SUBMIT a grant report (recomputing its figures from current data), or ACCEPT or REJECT a submitted one."
    roles: [FundingOfficer, AwardAuthority]
    code: 200
    input: [action, "reviewer_note?"]
    output: GrantReport
    side_effects:
      - "action SUBMIT: calculations.grant_report_figures is re-run, status DUE|REJECTED -> SUBMITTED, submitted_by_user_id recorded"
      - "action ACCEPT: status SUBMITTED -> ACCEPTED"
      - "action REJECT: status SUBMITTED -> REJECTED and revision_round += 1"

  # ----------------------------------------------------------------------- clock
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server's logical clock. Before any call to this endpoint the logical clock reads exactly 2026-08-01T00:00:00Z (the fixed startup default) and never falls back to real wall-clock time."
    roles: [ProgramAdmin, FieldInspector, DeterminationReviewer, ProcurementOfficer, AwardAuthority, FundingOfficer]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["every FundingSource whose expires_at is at or before the new clock value flips ACTIVE|EXHAUSTED -> EXPIRED"]

errors:
  # ------------------------------------------------------------------ auth
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-Role header missing, empty, or naming an undeclared role; or X-User-ID missing on an endpoint whose rules reference the acting user"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "the acting role is not listed in the target endpoint's roles"
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "an Operator-role caller targets a well it does not operate, or a Contractor-role caller targets a bid or plugging job that is not its own"
  - id: ERR_SEGREGATION_OF_DUTIES
    http: 403
    condition: "the acting user decides its own orphan determination, awards a solicitation it created, or disburses an allocation it committed"

  # -------------------------------------------------------------- not found
  - id: ERR_OPERATOR_NOT_FOUND
    http: 404
    condition: "no Operator exists with the given id (path or body reference, including successor_operator_id and to_operator_id)"
  - id: ERR_WELL_NOT_FOUND
    http: 404
    condition: "no Well exists with the given id"
  - id: ERR_ORPHAN_DETERMINATION_NOT_FOUND
    http: 404
    condition: "no OrphanDetermination exists with the given id"
  - id: ERR_SITE_ACCESS_NOT_FOUND
    http: 404
    condition: "no SiteAccess exists with the given id"
  - id: ERR_WELL_TRANSFER_NOT_FOUND
    http: 404
    condition: "no WellTransfer exists with the given id"
  - id: ERR_CONTRACTOR_NOT_FOUND
    http: 404
    condition: "no Contractor exists with the given id"
  - id: ERR_SOLICITATION_NOT_FOUND
    http: 404
    condition: "no Solicitation exists with the given id"
  - id: ERR_BID_NOT_FOUND
    http: 404
    condition: "no Bid exists with the given id"
  - id: ERR_UNIT_COST_CONTRACT_NOT_FOUND
    http: 404
    condition: "no UnitCostContract exists with the given id"
  - id: ERR_PLUGGING_JOB_NOT_FOUND
    http: 404
    condition: "no PluggingJob exists with the given id"
  - id: ERR_RECLAMATION_TASK_NOT_FOUND
    http: 404
    condition: "no ReclamationTask exists with the given id"
  - id: ERR_FUNDING_SOURCE_NOT_FOUND
    http: 404
    condition: "no FundingSource exists with the given id"
  - id: ERR_FUNDING_ALLOCATION_NOT_FOUND
    http: 404
    condition: "no FundingAllocation exists with the given id"
  - id: ERR_GRANT_REPORT_NOT_FOUND
    http: 404
    condition: "no GrantReport exists with the given id"

  # ------------------------------------------------------------------ schema
  - id: ERR_INVALID_REQUEST
    http: 422
    condition: "missing required input, wrong type, enum value outside its declared set, numeric bound violation, malformed YYYY-MM or ISO-8601 value, period_end earlier than period_start, duplicate api_well_number, or a grant report requested against a source whose reporting_required is false"

  # ------------------------------------------------------------- concurrency
  - id: ERR_STALE_WELL_VERSION
    http: 412
    condition: "expected_well_version does not match the Well's current version on POST /wells/{id}/orphan-determinations"
  - id: ERR_STALE_OPERATOR_VERSION
    http: 412
    condition: "expected_operator_version does not match the Operator's current version on POST /operators/{id}/enforcement"

  # ------------------------------------------------------------------- state
  - id: ERR_INVALID_STATE_TRANSITION
    http: 409
    condition: "the requested action is not a declared edge out of the row's current state"
  - id: ERR_WELL_NOT_ORPHAN_CONFIRMED
    http: 409
    condition: "a plugging job is ordered for a well whose status is not ORPHAN_CONFIRMED"
  - id: ERR_SOLICITATION_NOT_OPEN
    http: 409
    condition: "a bid is submitted to a solicitation whose status is not OPEN"
  - id: ERR_FUNDING_SOURCE_EXPIRED
    http: 409
    condition: "a funding source referenced for reporting or as a commitment override is EXPIRED or its expires_at is at or before the logical clock"

  # --------------------------------------------------------- business safety
  - id: ERR_SITE_ACCESS_NOT_AUTHORIZED
    http: 422
    condition: "mobilization is attempted while the well's access_status is not AGREEMENT_EXECUTED or ENTRY_ORDERED"
  - id: ERR_STATUTORY_NOTICE_PERIOD_ACTIVE
    http: 422
    condition: "entry is ordered before the surface owner's statutory notice window has closed (clock strictly before window_end_at)"
  - id: ERR_REVEGETATION_WAITING_PERIOD
    http: 422
    condition: "revegetation is started before the job's pit closure task is complete, or fewer than 90 days after it completed"
  - id: ERR_RECLAMATION_INCOMPLETE
    http: 422
    condition: "a REVEGETATION task is PASSed while a sibling EQUIPMENT_REMOVAL or PIT_CLOSURE task of the same job is not COMPLETE"

  # ----------------------------------------------------------- business rule
  - id: ERR_ORPHAN_CRITERIA_NOT_MET
    http: 422
    condition: "a determination is confirmed while idle_months < 24, cumulative_boe_60mo > 180.00, or screening_score < 40.00"

  # ------------------------------------------------------- business temporal
  - id: ERR_ACCESS_WINDOW_CONFLICT
    http: 409
    condition: "a new access request's CLOSED notice window overlaps or touches an open request's window on the same well"
  - id: ERR_CREW_WINDOW_CONFLICT
    http: 409
    condition: "a new job's HALF-OPEN crew occupancy interval overlaps another active job of the same contractor; touching at the boundary does not conflict"

  # ---------------------------------------------------- business referential
  - id: ERR_OPERATOR_STILL_SOLVENT
    http: 422
    condition: "a bond forfeiture is attempted against an operator that has not been declared INSOLVENT"
  - id: ERR_CONTRACTOR_NOT_ELIGIBLE
    http: 422
    condition: "a bid is submitted by, or an award would go to, a contractor whose license_status is SUSPENDED or DEBARRED"
  - id: ERR_CONTRACT_NOT_ACTIVE
    http: 422
    condition: "a job is ordered, mobilized, or field-reported under a UnitCostContract whose status is SUSPENDED or CLOSED"
  - id: ERR_TRANSFER_TO_INSOLVENT_OPERATOR
    http: 422
    condition: "a well transfer targets an INSOLVENT or REVOKED operator, or a DELINQUENT operator that already carries orphan candidates"
  - id: ERR_FORFEITED_BOND_OPERATOR_MISMATCH
    http: 422
    condition: "a FORFEITED_BOND source is forced onto a job whose well belongs to a different operator than the source's bond_operator_id"

  # ---------------------------------------------------- business constraint
  - id: ERR_DUPLICATE_BID
    http: 409
    condition: "the contractor already has a live bid on this solicitation"
  - id: ERR_DUPLICATE_PRODUCTION_MONTH
    http: 409
    condition: "a production record already exists for this well and month"
  - id: ERR_BID_DEADLINE_PASSED
    http: 422
    condition: "the logical clock is at or after the solicitation's bid_due_at"
  - id: ERR_TECHNICAL_SCORE_BELOW_MINIMUM
    http: 422
    condition: "a bid is marked RESPONSIVE while its technical_score is below the solicitation's min_technical_score"
  - id: ERR_BID_EXCEEDS_CEILING
    http: 422
    condition: "a bid's evaluated_unit_cost_cents exceeds the solicitation's ceiling_cents"
  - id: ERR_NO_RESPONSIVE_BIDS
    http: 422
    condition: "an award is attempted while the solicitation's RESPONSIVE bid set is empty"
  - id: ERR_REVISION_LIMIT_EXCEEDED
    http: 422
    condition: "a third revision is requested on the same orphan determination"
  - id: ERR_REWORK_LIMIT_EXCEEDED
    http: 422
    condition: "a third rework is requested on the same plugging job"
  - id: ERR_REOPEN_LIMIT_EXCEEDED
    http: 422
    condition: "a second reopen is attempted on the same solicitation"

  # -------------------------------------------------------- business fiscal
  - id: ERR_TRANSFEREE_ASSURANCE_INSUFFICIENT
    http: 422
    condition: "the receiving operator's posted bond is below its post-transfer required_bond_cents"
  - id: ERR_CONTRACT_CEILING_EXCEEDED
    http: 422
    condition: "a job creation or field report would push the contract's obligated_cents above its ceiling_cents"
  - id: ERR_FEDERAL_MATCH_INSUFFICIENT
    http: 422
    condition: "the waterfall leaves a remainder and a federal grant was throttled by its match entitlement; outranks ERR_FUNDING_SHORTFALL"
  - id: ERR_FUNDING_SHORTFALL
    http: 422
    condition: "eligible funding authority cannot cover the job estimate and no federal grant was match-throttled"
  - id: ERR_DISBURSEMENT_EXCEEDS_ALLOCATION
    http: 422
    condition: "invoice_cents exceeds the allocation's allocated_cents"

roles:
  - name: ProgramAdmin
    identity: opaque
    description: "state program administrator; registers operators and wells, resolves site access, decides transfers, takes enforcement action, and reviews field reports"
    permissions:
      - "full read across every collection"
      - "POST /operators, POST /operators/{id}/enforcement, POST /wells, POST /wells/{id}/production-records, POST /wells/{id}/orphan-determinations, POST /wells/{id}/site-accesses, POST /site-accesses/{id}/resolution, POST /wells/{id}/transfers, POST /well-transfers/{id}/decision, POST /contractors, POST /contractors/{id}/eligibility, POST /plugging-jobs, POST /plugging-jobs/{id}/mobilize, POST /plugging-jobs/{id}/review, POST /funding-sources, POST /_clock/set_current_utc"
      - "cannot decide orphan determinations, evaluate or award bids, run funding commitments, or disburse allocations"
  - name: FieldInspector
    identity: opaque
    description: "field inspector; inventories wells, reports production, authors orphan determinations, mobilizes crews, files field reports and inspects reclamation"
    permissions:
      - "read wells, production records, determinations, site accesses, transfers, contractors, contracts, jobs, reclamation tasks"
      - "POST /wells, POST /wells/{id}/production-records, POST /wells/{id}/orphan-determinations, POST /orphan-determinations/{id}/submit, POST /wells/{id}/site-accesses, POST /plugging-jobs/{id}/mobilize, POST /plugging-jobs/{id}/field-report, POST /reclamation-tasks/{id}/progress, POST /_clock/set_current_utc"
      - "cannot decide the determinations it authors (that is the DeterminationReviewer's role) and cannot touch procurement or funding"
  - name: DeterminationReviewer
    identity: opaque
    description: "orphan determination reviewer; confirms, rejects or returns determinations for revision and reviews plugging field reports"
    permissions:
      - "read wells, production records, determinations, site accesses, transfers, jobs, reclamation tasks, funding sources and allocations"
      - "POST /orphan-determinations/{id}/decision, POST /plugging-jobs/{id}/review, POST /_clock/set_current_utc"
      - "blocked by ERR_SEGREGATION_OF_DUTIES from deciding a determination whose created_by_user_id equals the acting X-User-ID"
  - name: ProcurementOfficer
    identity: opaque
    description: "procurement officer; drafts and runs solicitations, registers contractors, records bid responsiveness, and orders plugging jobs under awarded contracts"
    permissions:
      - "read operators, wells, contractors, solicitations, bids, contracts, jobs, funding sources"
      - "POST /contractors, POST /solicitations, POST /solicitations/{id}/lifecycle, POST /solicitations/{id}/bids, POST /bids/{id}/evaluation, POST /plugging-jobs, POST /_clock/set_current_utc"
      - "cannot award (that is the AwardAuthority's role) and cannot commit or disburse funding"
  - name: AwardAuthority
    identity: opaque
    description: "award authority; makes the final award decision on evaluated solicitations and accepts or rejects federal grant reports"
    permissions:
      - "read operators, wells, contractors, solicitations, bids, contracts, jobs, funding sources, allocations, grant reports"
      - "POST /solicitations/{id}/award, POST /grant-reports/{id}/submission, POST /_clock/set_current_utc"
      - "blocked by ERR_SEGREGATION_OF_DUTIES from awarding a solicitation whose created_by_user_id equals the acting X-User-ID"
  - name: FundingOfficer
    identity: opaque
    description: "funding officer; registers funding streams, runs the commitment waterfall, disburses or deobligates allocations, and files federal grant reports"
    permissions:
      - "read operators, wells, transfers, contractors, contracts, jobs, reclamation tasks, funding sources, allocations, grant reports"
      - "POST /funding-sources, POST /plugging-jobs/{id}/funding-commitments, POST /funding-allocations/{id}/transitions, POST /funding-sources/{id}/grant-reports, POST /grant-reports/{id}/submission, POST /_clock/set_current_utc"
      - "blocked by ERR_SEGREGATION_OF_DUTIES from disbursing an allocation whose committed_by_user_id equals the acting X-User-ID"
  - name: Contractor
    identity: "entity_backed:Contractor"
    description: "plugging contractor; sees its own bids and jobs, submits bids, and files field reports for its own work"
    permissions:
      - "GET /contractors/{id}, GET /solicitations, GET /solicitations/{id}, GET /bids, GET /bids/{id}, GET /unit-cost-contracts/{id}, GET /plugging-jobs, GET /plugging-jobs/{id}, GET /plugging-jobs/{id}/reclamation-tasks — scoped to its own contractor row; ERR_NOT_RESOURCE_OWNER otherwise"
      - "POST /solicitations/{id}/bids and POST /plugging-jobs/{id}/field-report for its own contractor row only"
      - "cannot read or write operators, wells, determinations, funding sources or allocations"
  - name: Operator
    identity: "entity_backed:Operator"
    description: "regulated operator; sees its own record and wells, reports production for them, and proposes transfers of them"
    permissions:
      - "GET /operators/{id}, GET /wells, GET /wells/{id}, GET /wells/{id}/production-records, GET /well-transfers/{id} — scoped to its own wells and its own operator row; ERR_NOT_RESOURCE_OWNER otherwise"
      - "POST /wells/{id}/production-records and POST /wells/{id}/transfers for its own wells only"
      - "cannot author or decide determinations, resolve site access, procure, or touch funding"
