  # ==========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: appraisal_permanent_threshold_inclusive_at_and_one_cent_below
        grounds:
          - calculations.appraisal_score
          - entities.RetentionSchedule.fields.min_appraisal_score_for_permanent
          - state_machines.RecordSeries.ACTIVE_to_PERMANENT
          - state_machines.RecordSeries.ACTIVE_to_ELIGIBLE_FOR_DISPOSITION
        distinguishing_aspect: |
          Metric: final_score against min_appraisal_score_for_permanent, compared with
          `>=` on the value already rounded to 2 decimals. Endpoint:
          POST /appraisals/{id}/finalize. Series A lands EXACTLY on its threshold
          (70.00 vs 70.00) and must be PERMANENT; series B lands one hundredth below
          (58.00 vs 58.01) and must not. The two series differ only in whether a
          CERTIFIED trademark package admits brand_heritage_value, so the boundary is
          reached through the calculation rather than by editing the threshold.
        test_recipe:
          setup:
            - "RetentionSchedule S-A: retention_years 10, disposition_action DESTROY, min_appraisal_score_for_permanent 70.00."
            - "RetentionSchedule S-B: retention_years 10, disposition_action REVIEW, min_appraisal_score_for_permanent 58.01."
            - "RecordSeries A on S-A: 1946-2025 (span 80 -> age_bonus min(10, 16) = 10), annual_volume_linear_feet 120 (penalty floor((120-50)/10) = 7)."
            - "RecordSeries B on S-B: 1915-1994 (span 80 -> age_bonus 10), annual_volume_linear_feet 120 (penalty 7); retention_expiry_utc 2004-12-31T23:59:59.000Z is already elapsed at the default clock."
            - "Series A carries a CERTIFIED TrademarkEvidencePackage (claimed_first_use_year 2018, evidence years 2018 / 2022 / 2026 -> max_gap 3, coverage 33.33); series B carries none."
            - "Both appraisals use informational 8, evidential 7, brand_heritage 6, uniqueness 5, provenance_verified true: core 24+21+12+10 = 67 with brand admitted (raw 67+10-7 = 70) and 24+21+0+10 = 55 without (raw 55+10-7 = 58)."
          setup_api_calls:
            - call: "POST /retention-schedules"
              payload: { code: "BND-A", retention_years: 10, disposition_action: "DESTROY", legal_citation: "Appraisal Policy 3.7(a)", min_appraisal_score_for_permanent: 70.00 }
              as: ArchivesDirector
