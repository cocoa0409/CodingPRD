              as: FranchisorAdmin
              captures: { csub4: $.data.id }
            - call: "POST /franchise-system/subleases/${csub4}/activate"
              payload: {}
              as: FranchisorAdmin
            - call: "POST /franchise-system/stores/${cst4}/open"
              payload: {}
              as: FranchisorAdmin
            - call: "GET /franchise-system/subleases/${csub4}"
              payload: {}
              as: FranchiseFinance
              captures: { csub4_v: $.data.version }
            - call: "POST /franchise-system/rent-charges"
              payload: { store_id: "${cst4}", billing_period: "2026", period_start: "2026-04-01", period_end: "2027-03-31", expected_sublease_version: "${csub4_v}" }
