            - call: "POST /members"
              payload: { email: "host9@x.com", full_name: "Host Nine" }
              as: Cashier
              captures: { host_id: $.data.id }
            - call: "POST /party-bookings"
              payload: { room_id: "${room1}", package_id: "${pkg_id}", host_member_id: "${host_id}", start_at: "2026-05-01T14:00:00Z", end_at: "2026-05-01T16:00:00Z", guest_count: 150 }
