  # ===========================================================================
  # Errors
  # ===========================================================================
  - section: errors
    instances:
      - name: error_stale_lot_version_excluded
        claim_type: violation_to_error
        grounds: ["errors[ERR_STALE_LOT_VERSION]", "concurrency_rules[reservation-create-stale-lot]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / stall_capacity_overlap_aggregate_count
          rationale: "ERR_STALE_LOT_VERSION OCC behavior is covered by the dedicated cross-cutting OCC instance below; the aggregate-capacity instance exercises the success path on Lot.version. A dedicated OCC stale instance appears under section cross_cutting."
      - name: error_no_stall_available_excluded
        claim_type: violation_to_error
        grounds: ["errors[ERR_NO_STALL_AVAILABLE]"]
        excluded_because:
          difficulty_instance: boundary_precision_check / no_stall_available_at_zero_count_empty_inventory
          rationale: "ERR_NO_STALL_AVAILABLE is the asserted failure path of the named §1.8 boundary instance."
      - name: error_shuttle_full_excluded
        claim_type: violation_to_error
        grounds: ["errors[ERR_SHUTTLE_FULL]"]
        excluded_because:
          difficulty_instance: resource_temporal_overlap / shuttle_seat_capacity_overlap_per_trip
          rationale: "ERR_SHUTTLE_FULL is asserted as the failure path of the seat-capacity overlap §1.8 instance."
      - name: error_customer_suspended_excluded
        claim_type: violation_to_error
        grounds: ["errors[ERR_CUSTOMER_SUSPENDED]"]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / suspended_state_beats_no_stall_constraint
          rationale: "ERR_CUSTOMER_SUSPENDED is asserted as the winning error of the named §1.8 priority instance."

