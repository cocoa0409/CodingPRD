            - "After resubmit: status == SUBMITTED and submitted_by_user_id == ${w1} (refreshed on the loop)"
            - "After approve: status == APPROVED, straight_minutes == 480, ot_minutes == 0, dt_minutes == 0, meal_penalty_minutes == 0, gross_pay_cents == 32000"

  # ---------------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: safety_incident_full_stoppage_depth4_cascade
        grounds:
          - state_machines.SafetyIncident
          - calculations.work_posture_derivation
          - state_machines.GangOrder.WORKING_to_SUSPENDED
          - state_machines.EquipmentAssignment.ACTIVE_to_RELEASED
          - state_machines.EquipmentUnit.ASSIGNED_to_AVAILABLE
        distinguishing_aspect: |
          Depth-4 chain from one trigger (incident create): SafetyIncident(CRITICAL, VESSEL)
          -> VesselCall.work_posture FULL_STOPPAGE -> GangOrder WORKING->SUSPENDED
          (suspension_count += 1) -> EquipmentAssignment ACTIVE->RELEASED ->
          EquipmentUnit ASSIGNED->AVAILABLE. Each hop is caused by the previous hop's
          mutation, not by the original request.
        test_recipe:
          setup:
            - "Vessel V WORKING; gang G (headcount 1, RTG x1) WORKING; RTG-1 ACTIVE on G; W1 WORKING"
          setup_api_calls:
            - call: "POST /api/vessel-calls"
              payload: { vessel_name: "MV Cascade", voyage_number: "CA-801", shipping_line: "LineCo", eta_utc: "2026-08-09T00:00:00Z", planned_moves: 200, planned_tons: 100, contracted_mph_target: 25.0, credit_limit_cents: 500000000 }
              as: StevedoreAdmin
              captures: { v: $.data.id }
            - call: "POST /api/vessel-calls/${v}/berth"
              as: StevedoreSuperintendent
            - call: "POST /api/shift-windows"
              payload: { vessel_call_id: "${v}", shift_date: "2026-08-10", period: "DAY", start_utc: "2026-08-10T08:00:00Z", end_utc: "2026-08-10T16:00:00Z" }
