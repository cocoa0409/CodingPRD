scaffold_corner_design:

  # =========================================================================
  # Section: entities  (creation, retrieval, required-fields, defaults, system fields)
  # =========================================================================
  - section: entities
    instances:
      - name: create_guest_returns_201_with_default_status_active
        claim_type: Creation
        grounds:
          - endpoints.POST_/v1/guests
          - entities.Guest.fields.status
          - entities.Guest.fields.no_show_strike_count
        distinguishing_aspect: |
          Newly created Guest has status='ACTIVE' (default) and no_show_strike_count=0
          (default), and id/created_at/updated_at/version are server-stamped.
        test_recipe:
          setup:
            - "Empty DB; clock at 2026-01-15T12:00:00Z."
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-15T12:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /v1/guests"
              payload: { email: "corner_guest@x.com", full_name: "Corner Guest", home_timezone: "America/New_York" }
              as: PlatformAdmin
              captures: { g_id: $.data.id, g_status: $.data.status, g_strike: $.data.no_show_strike_count, g_v: $.data.version }
          assert:
            - "Response HTTP status == 201"
            - "Guest.${g_id}.status == 'ACTIVE'"
            - "Guest.${g_id}.no_show_strike_count == 0"
            - "${g_v} == 1"

      - name: get_guest_not_found_returns_404
        claim_type: Not Found
        grounds:
          - endpoints.GET_/v1/guests/{id}
          - errors[ERR_NOT_FOUND]
        distinguishing_aspect: |
          GET on a non-existent guest id returns ERR_NOT_FOUND (404).
        test_recipe:
          setup:
            - "Empty DB."
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-15T12:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "GET /v1/guests/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "Response HTTP status == 404"
            - "response.data.error_id == 'ERR_NOT_FOUND'"

      - name: list_restaurants_pagination_defaults_applied
        claim_type: Listing
        grounds:
          - endpoints.GET_/v1/restaurants
          - response_envelope.pagination_defaults
        distinguishing_aspect: |
          GET /v1/restaurants without limit/offset returns up to default limit (10), with
          response envelope's pagination_fields populated (limit=10, offset=0, total_count,
          has_more).
        test_recipe:
          setup:
            - "PlatformAdmin has created 3 restaurants in EPCOT."
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-15T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /v1/restaurants"
              payload: { name: "R1", park_code: "EPCOT", capacity_per_slot: 20, slot_minutes: 30, dining_plan_credit_cost: 1, no_show_base_fee_cents: 1000, opening_local_time: "11:00", closing_local_time: "22:00" }
              as: PlatformAdmin
            - call: "POST /v1/restaurants"
              payload: { name: "R2", park_code: "EPCOT", capacity_per_slot: 20, slot_minutes: 30, dining_plan_credit_cost: 1, no_show_base_fee_cents: 1000, opening_local_time: "11:00", closing_local_time: "22:00" }
              as: PlatformAdmin
            - call: "POST /v1/restaurants"
              payload: { name: "R3", park_code: "EPCOT", capacity_per_slot: 20, slot_minutes: 30, dining_plan_credit_cost: 1, no_show_base_fee_cents: 1000, opening_local_time: "11:00", closing_local_time: "22:00" }
              as: PlatformAdmin
          trigger:
            - call: "GET /v1/restaurants"
              payload: {}
              as: PlatformAdmin
          assert:
            - "Response HTTP status == 200"
            - "response.response_type == 'array'"
            - "len(response.data) == 3"

      - name: create_reservation_missing_required_field_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - endpoints.POST_/v1/reservations
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          POST /v1/reservations missing the required `party_size` body field returns
          ERR_INVALID_REQUEST (400).
        test_recipe:
          setup:
            - "PlatformAdmin provisioned Guest, Restaurant, DiningPlan, and ParkSession."
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-15T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /v1/guests"
              payload: { email: "g_req@x.com", full_name: "Req", home_timezone: "America/New_York" }
              as: PlatformAdmin
              captures: { g_id: $.data.id }
            - call: "POST /v1/restaurants"
              payload: { name: "Req Restaurant", park_code: "EPCOT", capacity_per_slot: 10, slot_minutes: 30, dining_plan_credit_cost: 1, no_show_base_fee_cents: 1000, opening_local_time: "11:00", closing_local_time: "22:00" }
              as: PlatformAdmin
              captures: { r_id: $.data.id }
            - call: "POST /v1/dining-plans"
              payload: { guest_id: "${g_id}", tier: "STANDARD", table_service_credits_initial: 5, valid_from: "2026-01-01T00:00:00Z", valid_until: "2026-12-31T00:00:00Z" }
              as: PlatformAdmin
              captures: { dp_id: $.data.id }
            - call: "POST /v1/park-sessions"
              payload: { guest_id: "${g_id}", park_code: "EPCOT", visit_date: "2026-02-15" }
              as: Guest
              as_user_id: "${g_id}"
              captures: { ps_id: $.data.id }
          trigger:
            - call: "POST /v1/reservations"
              payload: { guest_id: "${g_id}", restaurant_id: "${r_id}", park_session_id: "${ps_id}", dining_plan_id: "${dp_id}", slot_start_utc: "2026-02-15T18:00:00Z" }
              as: Guest
              as_user_id: "${g_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Response HTTP status == 400"
            - "response.data.error_id == 'ERR_INVALID_REQUEST'"

      - name: dining_plan_held_field_initial_value_is_zero_on_create
        claim_type: Computed Fields
        grounds:
          - endpoints.POST_/v1/dining-plans
          - entities.DiningPlan.fields.table_service_credits_held
          - entities.DiningPlan.fields.table_service_credits_remaining
        distinguishing_aspect: |
          On DiningPlan creation, table_service_credits_held=0 (computed default) and
          table_service_credits_remaining = table_service_credits_initial.
        test_recipe:
          setup:
            - "Guest exists."
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-15T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /v1/guests"
              payload: { email: "g_dpc@x.com", full_name: "DPC", home_timezone: "America/New_York" }
              as: PlatformAdmin
              captures: { g_id: $.data.id }
          trigger:
            - call: "POST /v1/dining-plans"
              payload: { guest_id: "${g_id}", tier: "DELUXE", table_service_credits_initial: 25, valid_from: "2026-01-01T00:00:00Z", valid_until: "2026-12-31T00:00:00Z" }
              as: PlatformAdmin
              captures: { dp_id: $.data.id, dp_remaining: $.data.table_service_credits_remaining, dp_held: $.data.table_service_credits_held }
          assert:
            - "${dp_remaining} == 25"
            - "${dp_held} == 0"
            - "DiningPlan.${dp_id}.status == 'ACTIVE'"

  # =========================================================================
  # Section: state_machines (invalid transitions, terminal-state lockdown, idempotency)
  # =========================================================================
  - section: state_machines
    instances:
      - name: cancel_already_cancelled_reservation_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Reservation.PENDING_to_CANCELLED
          - errors[ERR_INVALID_STATE]
          - endpoints.POST_/v1/reservations/{id}/cancel
        distinguishing_aspect: |
          A Reservation already in terminal CANCELLED state cannot be cancelled again.
          Second cancel returns ERR_INVALID_STATE (409); no side effects fire.
        test_recipe:
          setup:
            - "Reservation in status CANCELLED."
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-15T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /v1/guests"
              payload: { email: "g_inv1@x.com", full_name: "INV1", home_timezone: "America/New_York" }
              as: PlatformAdmin
              captures: { g_id: $.data.id }
            - call: "POST /v1/restaurants"
              payload: { name: "Rinv1", park_code: "EPCOT", capacity_per_slot: 20, slot_minutes: 30, dining_plan_credit_cost: 1, no_show_base_fee_cents: 1000, opening_local_time: "11:00", closing_local_time: "22:00" }
              as: PlatformAdmin
              captures: { r_id: $.data.id }
            - call: "POST /v1/dining-plans"
              payload: { guest_id: "${g_id}", tier: "STANDARD", table_service_credits_initial: 5, valid_from: "2026-01-01T00:00:00Z", valid_until: "2026-12-31T00:00:00Z" }
              as: PlatformAdmin
              captures: { dp_id: $.data.id }
            - call: "POST /v1/park-sessions"
              payload: { guest_id: "${g_id}", park_code: "EPCOT", visit_date: "2026-02-15" }
              as: Guest
              as_user_id: "${g_id}"
              captures: { ps_id: $.data.id }
            - call: "POST /v1/reservations"
              payload: { guest_id: "${g_id}", restaurant_id: "${r_id}", park_session_id: "${ps_id}", dining_plan_id: "${dp_id}", slot_start_utc: "2026-02-15T18:00:00Z", party_size: 1 }
              as: Guest
              as_user_id: "${g_id}"
              captures: { res_id: $.data.id, res_v: $.data.version }
            - call: "POST /v1/reservations/${res_id}/cancel"
              payload: { expected_reservation_version: "${res_v}" }
              as: Guest
              as_user_id: "${g_id}"
              captures: { res_v_after_cancel: $.data.version }
          trigger:
            - call: "POST /v1/reservations/${res_id}/cancel"
              payload: { expected_reservation_version: "${res_v_after_cancel}" }
              as: Guest
              as_user_id: "${g_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Response HTTP status == 409"
            - "response.data.error_id == 'ERR_INVALID_STATE'"

      - name: check_in_pending_reservation_skipping_confirm_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Reservation.CONFIRMED_to_CHECKED_IN
          - errors[ERR_INVALID_STATE]
          - endpoints.POST_/v1/reservations/{id}/check-in
        distinguishing_aspect: |
          PENDING reservation cannot skip CONFIRMED; POST /check-in returns
          ERR_INVALID_STATE.
        test_recipe:
          setup:
            - "Reservation in PENDING."
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-15T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /v1/guests"
              payload: { email: "g_inv2@x.com", full_name: "INV2", home_timezone: "America/New_York" }
              as: PlatformAdmin
              captures: { g_id: $.data.id }
            - call: "POST /v1/restaurants"
              payload: { name: "Rinv2", park_code: "EPCOT", capacity_per_slot: 20, slot_minutes: 30, dining_plan_credit_cost: 1, no_show_base_fee_cents: 1000, opening_local_time: "11:00", closing_local_time: "22:00" }
              as: PlatformAdmin
              captures: { r_id: $.data.id }
            - call: "POST /v1/dining-plans"
              payload: { guest_id: "${g_id}", tier: "STANDARD", table_service_credits_initial: 5, valid_from: "2026-01-01T00:00:00Z", valid_until: "2026-12-31T00:00:00Z" }
              as: PlatformAdmin
              captures: { dp_id: $.data.id }
            - call: "POST /v1/park-sessions"
              payload: { guest_id: "${g_id}", park_code: "EPCOT", visit_date: "2026-02-15" }
              as: Guest
              as_user_id: "${g_id}"
              captures: { ps_id: $.data.id }
            - call: "POST /v1/reservations"
              payload: { guest_id: "${g_id}", restaurant_id: "${r_id}", park_session_id: "${ps_id}", dining_plan_id: "${dp_id}", slot_start_utc: "2026-02-15T18:00:00Z", party_size: 1 }
              as: Guest
              as_user_id: "${g_id}"
              captures: { res_id: $.data.id }
          trigger:
            - call: "POST /v1/reservations/${res_id}/check-in"
              payload: {}
              as: Guest
              as_user_id: "${g_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Response HTTP status == 409"
            - "response.data.error_id == 'ERR_INVALID_STATE'"

      - name: cancel_confirmed_inside_two_hour_cutoff_returns_invalid_state
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Reservation.CONFIRMED_to_CANCELLED
          - errors[ERR_INVALID_STATE]
          - endpoints.POST_/v1/reservations/{id}/cancel
        distinguishing_aspect: |
          CONFIRMED → CANCELLED precondition requires current_utc < slot_start_utc - 2 hours
          (free-cancel window). Inside the 2-hour window, cancel fails with
          ERR_INVALID_STATE; credits remain held.
        test_recipe:
          setup:
            - "Reservation CONFIRMED at slot_start_utc=2026-02-15T18:00:00Z."
            - "Clock advanced to 2026-02-15T16:30:00Z (90 min before slot — INSIDE cutoff)."
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-15T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /v1/guests"
              payload: { email: "g_pe1@x.com", full_name: "PE1", home_timezone: "America/New_York" }
              as: PlatformAdmin
              captures: { g_id: $.data.id }
            - call: "POST /v1/restaurants"
              payload: { name: "Rpe1", park_code: "EPCOT", capacity_per_slot: 20, slot_minutes: 30, dining_plan_credit_cost: 1, no_show_base_fee_cents: 1000, opening_local_time: "11:00", closing_local_time: "22:00" }
              as: PlatformAdmin
              captures: { r_id: $.data.id }
            - call: "POST /v1/dining-plans"
              payload: { guest_id: "${g_id}", tier: "STANDARD", table_service_credits_initial: 5, valid_from: "2026-01-01T00:00:00Z", valid_until: "2026-12-31T00:00:00Z" }
              as: PlatformAdmin
              captures: { dp_id: $.data.id }
            - call: "POST /v1/park-sessions"
              payload: { guest_id: "${g_id}", park_code: "EPCOT", visit_date: "2026-02-15" }
              as: Guest
              as_user_id: "${g_id}"
              captures: { ps_id: $.data.id }
            - call: "POST /v1/reservations"
              payload: { guest_id: "${g_id}", restaurant_id: "${r_id}", park_session_id: "${ps_id}", dining_plan_id: "${dp_id}", slot_start_utc: "2026-02-15T18:00:00Z", party_size: 2 }
              as: Guest
              as_user_id: "${g_id}"
              captures: { res_id: $.data.id }
            - call: "POST /v1/reservations/${res_id}/confirm"
              payload: {}
              as: Guest
              as_user_id: "${g_id}"
              captures: { res_v: $.data.version }
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-15T16:30:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /v1/reservations/${res_id}/cancel"
              payload: { expected_reservation_version: "${res_v}" }
              as: Guest
              as_user_id: "${g_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Response HTTP status == 409"
            - "response.data.error_id == 'ERR_INVALID_STATE'"
            - "Reservation.${res_id}.status == 'CONFIRMED'"
            - "Reservation.${res_id}.credits_held == 2"

      - name: no_show_sweep_idempotent_second_sweep_finds_nothing
        claim_type: Idempotency
        grounds:
          - state_machines.Reservation.CONFIRMED_to_NO_SHOW
          - endpoints.POST_/v1/_ops/no-show-sweep
        distinguishing_aspect: |
          POST /_ops/no-show-sweep is idempotent: a second sweep right after the first
          returns swept_count=0 (no candidates remain in CONFIRMED past slot_end_utc).
        test_recipe:
          setup:
            - "One CONFIRMED reservation whose slot_end_utc has elapsed."
            - "First sweep ran and set the reservation NO_SHOW."
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-15T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /v1/guests"
              payload: { email: "g_id1@x.com", full_name: "ID1", home_timezone: "America/New_York" }
              as: PlatformAdmin
              captures: { g_id: $.data.id }
            - call: "POST /v1/restaurants"
              payload: { name: "Rid1", park_code: "EPCOT", capacity_per_slot: 20, slot_minutes: 30, dining_plan_credit_cost: 1, no_show_base_fee_cents: 1000, opening_local_time: "11:00", closing_local_time: "22:00" }
              as: PlatformAdmin
              captures: { r_id: $.data.id }
            - call: "POST /v1/dining-plans"
              payload: { guest_id: "${g_id}", tier: "STANDARD", table_service_credits_initial: 5, valid_from: "2026-01-01T00:00:00Z", valid_until: "2026-12-31T00:00:00Z" }
              as: PlatformAdmin
              captures: { dp_id: $.data.id }
            - call: "POST /v1/park-sessions"
              payload: { guest_id: "${g_id}", park_code: "EPCOT", visit_date: "2026-02-15" }
              as: Guest
              as_user_id: "${g_id}"
              captures: { ps_id: $.data.id }
            - call: "POST /v1/reservations"
              payload: { guest_id: "${g_id}", restaurant_id: "${r_id}", park_session_id: "${ps_id}", dining_plan_id: "${dp_id}", slot_start_utc: "2026-02-15T18:00:00Z", party_size: 1 }
              as: Guest
              as_user_id: "${g_id}"
              captures: { res_id: $.data.id }
            - call: "POST /v1/reservations/${res_id}/confirm"
              payload: {}
              as: Guest
              as_user_id: "${g_id}"
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-15T19:00:00Z" }
              as: PlatformAdmin
            - call: "POST /v1/_ops/no-show-sweep"
              payload: {}
              as: PlatformAdmin
              captures: { first_sweep: $.data.swept_count }
          trigger:
            - call: "POST /v1/_ops/no-show-sweep"
              payload: {}
              as: PlatformAdmin
              captures: { second_sweep: $.data.swept_count }
          assert:
            - "${first_sweep} == 1"
            - "${second_sweep} == 0"

      - name: error_reservation_no_show_branch_already_covered_by_dual_variant
        claim_type: Side Effect Execution
        grounds:
          - state_machines.Reservation.CONFIRMED_to_NO_SHOW
        excluded_because:
          difficulty_instance: combinatorial_formula / no_show_fee_nested_rounding_per_seat_first_mode_b
          rationale: "NO_SHOW transition's side-effects (strike increment, fee assessment) are asserted as the positive path of the §1.8 instance."

  # =========================================================================
  # Section: validations
  # =========================================================================
  - section: validations
    instances:
      - name: slot_misaligned_off_30min_grid_returns_invalid_request_error
        claim_type: Violation -> Error
        grounds:
          - validations[priority=12]
          - errors[ERR_SLOT_MISALIGNED]
          - endpoints.POST_/v1/reservations
        distinguishing_aspect: |
          slot_start_utc not aligned to 30-minute grid (opening 11:00 local, candidate 11:10
          local = 16:10 UTC EST) is rejected with ERR_SLOT_MISALIGNED.
        test_recipe:
          setup:
            - "Restaurant with opening_local_time=11:00, slot_minutes=30."
            - "Booking candidate slot_start_utc=2026-02-15T16:10:00Z (which is 11:10 EST — off the 30-min grid)."
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-15T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /v1/guests"
              payload: { email: "g_v1@x.com", full_name: "V1", home_timezone: "America/New_York" }
              as: PlatformAdmin
              captures: { g_id: $.data.id }
            - call: "POST /v1/restaurants"
              payload: { name: "Rv1", park_code: "EPCOT", capacity_per_slot: 20, slot_minutes: 30, dining_plan_credit_cost: 1, no_show_base_fee_cents: 1000, opening_local_time: "11:00", closing_local_time: "22:00" }
              as: PlatformAdmin
              captures: { r_id: $.data.id }
            - call: "POST /v1/dining-plans"
              payload: { guest_id: "${g_id}", tier: "STANDARD", table_service_credits_initial: 5, valid_from: "2026-01-01T00:00:00Z", valid_until: "2026-12-31T00:00:00Z" }
              as: PlatformAdmin
              captures: { dp_id: $.data.id }
            - call: "POST /v1/park-sessions"
              payload: { guest_id: "${g_id}", park_code: "EPCOT", visit_date: "2026-02-15" }
              as: Guest
              as_user_id: "${g_id}"
              captures: { ps_id: $.data.id }
          trigger:
            - call: "POST /v1/reservations"
              payload: { guest_id: "${g_id}", restaurant_id: "${r_id}", park_session_id: "${ps_id}", dining_plan_id: "${dp_id}", slot_start_utc: "2026-02-15T16:10:00Z", party_size: 1 }
              as: Guest
              as_user_id: "${g_id}"
              captures: { err: $.data.error_id }
          assert:
            - "Response HTTP status == 422"
            - "response.data.error_id == 'ERR_SLOT_MISALIGNED'"

      - name: slot_outside_hours_after_closing_returns_error
        claim_type: Violation -> Error
        grounds:
          - validations[priority=11]
          - errors[ERR_SLOT_OUTSIDE_HOURS]
          - endpoints.POST_/v1/reservations
        distinguishing_aspect: |
          slot_start_utc projecting to local wall-clock 22:30 (after closing_local_time=22:00)
          returns ERR_SLOT_OUTSIDE_HOURS.
        test_recipe:
          setup:
            - "Restaurant with closing_local_time=22:00."
            - "Candidate slot at 22:30 local = 2026-02-16T03:30:00Z UTC."
          setup_api_calls:
            - call: "POST /v1/_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-15T12:00:00Z" }
              as: PlatformAdmin
            - call: "POST /v1/guests"
              payload: { email: "g_v2@x.com", full_name: "V2", home_timezone: "America/New_York" }
              as: PlatformAdmin
              captures: { g_id: $.data.id }
            - call: "POST /v1/restaurants"
              payload: { name: "Rv2", park_code: "EPCOT", capacity_per_slot: 20, slot_minutes: 30, dining_plan_credit_cost: 1, no_show_base_fee_cents: 1000, opening_local_time: "11:00", closing_local_time: "22:00" }
              as: PlatformAdmin
              captures: { r_id: $.data.id }
