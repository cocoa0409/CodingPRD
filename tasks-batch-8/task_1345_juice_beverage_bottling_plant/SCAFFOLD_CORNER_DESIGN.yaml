            - { call: "POST /v1/batches/${batch_id}/release", payload: {}, as: QAInspector, as_user_id: "qa-1" }
            - { call: "POST /v1/bottling-lines", payload: { line_code: "L-OR", supported_container_types: ["PET_473"], nominal_cpm: 200 }, as: PlantManager, captures: { line_id: $.data.id } }
