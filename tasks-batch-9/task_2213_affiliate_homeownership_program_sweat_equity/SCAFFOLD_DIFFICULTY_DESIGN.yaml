  # ===========================================================================
  - rule_id: compensating_invariant
    instances:

      - name: invariant_subsidy_pool_approve_then_deny_restores_available_cents
        conserved_quantity: "subsidy capital cents (MONETARY ledger) — AffiliateProgram.subsidy_pool_cents == subsidy_available_cents + subsidy_committed_cents + subsidy_disbursed_cents"
        grounds:
          - calculations.subsidy_pool_ledger
          - calculations.affordable_payment_structure
          - state_machines.MortgageApplication.status.UNDERWRITING_to_APPROVED
          - state_machines.MortgageApplication.status.APPROVED_to_DENIED
          - entities.AffiliateProgram.fields.subsidy_available_cents
          - entities.AffiliateProgram.fields.subsidy_committed_cents
          - validations[priority=38]
          - concurrency_rules[mortgage-approve-stale-program]
        distinguishing_aspect: |
          The conserved quantity is MONETARY: the pinned identity
          subsidy_pool_cents == subsidy_available_cents + subsidy_committed_cents
          + subsidy_disbursed_cents over a 20000000-cent pool. The forward action
          (approve) really moves it — available falls 20000000 -> 18050000 and
          committed rises 0 -> 1950000, because the pinned 8-step structure on
          appraised_value 15000000 / income 3000000 yields escrow 15625 + 5000 =
          20625, affordable_pi 75000 - 20625 = 54375, provisional 54375*360 =
          19575000 >= 13500000 so term 240, first mortgage 54375*240 = 13050000,
          silent second 15000000 - 13050000 = 1950000 — and the compensating
          action (deny from APPROVED) restores available to exactly 20000000 with
          committed back at 0, leaving disbursed untouched at 0.
        test_recipe:
          setup:
            - "One AffiliateProgram with subsidy_pool_cents 20000000, ami_median_income_cents 6000000, committee_quorum 2, sweat_equity_base_hours_required 12; status ACTIVE, program_posture OPEN, subsidy_committed_cents 0, subsidy_disbursed_cents 0, subsidy_available_cents 20000000."
            - "One ApplicantHousehold in selection_status SELECTED (composite_selection_score 91.0 on the FINAL basis: 0.40*90 + 0.35*100 + 0.25*80), documentation_status VERIFIED, verified_annual_income_cents 3000000, one ACTIVE APPLICANT member."
            - "Six SUBMITTED SelectionReview rows from committee-alice and committee-bruno across NEED / ABILITY / WILLINGNESS, all score 80 and recommendation ADVANCE, so quorum 2 is met on all three dimensions and no veto exists."
            - "One BuildSite P-1001 in READY_TO_BUILD (appraised_value_cents 15000000) assigned to the household by the application create."
            - "One MortgageApplication in status UNDERWRITING structured by officer-1: escrow_monthly_cents 20625, affordable_pi_payment_cents 54375, term_months 240, first_mortgage_principal_cents 13050000, silent_second_amount_cents 1950000; lien_status NONE."
          setup_api_calls:
            - { call: "POST /homeownership/programs", payload: { affiliate_name: "Ridgeline Habitat", service_area_code: "TRAVIS", ami_median_income_cents: 6000000, subsidy_pool_cents: 20000000, sweat_equity_base_hours_required: 12, committee_quorum: 2 }, as: ProgramAdmin, as_user_id: "admin-1", captures: { prog_id: $.data.id } }
            - { call: "POST /homeownership/households", payload: { program_id: "${prog_id}", household_name: "Alvarez", household_size: 4, current_bedroom_count: 1, habitability_deficiency_count: 3, self_reported_annual_income_cents: 3600000, self_reported_housing_cost_cents: 150000, monthly_debt_payment_cents: 30000, credit_score: 640, on_time_housing_payment_months: 24 }, as: FamilyServicesCoordinator, as_user_id: "fsc-1", captures: { hh_id: $.data.id } }
            - { call: "POST /homeownership/household-members", payload: { household_id: "${hh_id}", full_name: "Rosa Alvarez", relationship: "APPLICANT", birth_date: "1985-03-15T00:00:00.000Z", is_adult_occupant: true }, as: FamilyServicesCoordinator, as_user_id: "fsc-1", captures: { mem_app_id: $.data.id } }
            - { call: "POST /homeownership/households/${hh_id}/submit", payload: { attestation_signed: true }, as: FamilyServicesCoordinator, as_user_id: "fsc-1" }
            - { call: "POST /homeownership/households/${hh_id}/screen", payload: { income_documents_received: true, verified_annual_income_cents: 3000000, verified_housing_cost_cents: 100000 }, as: FamilyServicesCoordinator, as_user_id: "fsc-1" }
            - { call: "POST /homeownership/households/${hh_id}/committee-referral", payload: { referral_memo: "Docs verified" }, as: FamilyServicesCoordinator, as_user_id: "fsc-1" }
            - { call: "POST /homeownership/selection-reviews", payload: { household_id: "${hh_id}", dimension: "NEED", score: 80, recommendation: "ADVANCE" }, as: SelectionCommitteeMember, as_user_id: "committee-alice" }
            - { call: "POST /homeownership/selection-reviews", payload: { household_id: "${hh_id}", dimension: "NEED", score: 80, recommendation: "ADVANCE" }, as: SelectionCommitteeMember, as_user_id: "committee-bruno" }
            - { call: "POST /homeownership/selection-reviews", payload: { household_id: "${hh_id}", dimension: "ABILITY", score: 80, recommendation: "ADVANCE" }, as: SelectionCommitteeMember, as_user_id: "committee-alice" }
            - { call: "POST /homeownership/selection-reviews", payload: { household_id: "${hh_id}", dimension: "ABILITY", score: 80, recommendation: "ADVANCE" }, as: SelectionCommitteeMember, as_user_id: "committee-bruno" }
            - { call: "POST /homeownership/selection-reviews", payload: { household_id: "${hh_id}", dimension: "WILLINGNESS", score: 80, recommendation: "ADVANCE" }, as: SelectionCommitteeMember, as_user_id: "committee-alice" }
            - { call: "POST /homeownership/selection-reviews", payload: { household_id: "${hh_id}", dimension: "WILLINGNESS", score: 80, recommendation: "ADVANCE" }, as: SelectionCommitteeMember, as_user_id: "committee-bruno" }
            - { call: "POST /homeownership/households/${hh_id}/selection-decision", payload: { decision_minutes: "Committee vote 2026-08-01: advance on all three dimensions" }, as: ProgramAdmin, as_user_id: "admin-1" }
            - { call: "POST /homeownership/build-sites", payload: { program_id: "${prog_id}", parcel_number: "P-1001", street_address: "12 Cedar Ln", acquisition_cost_cents: 4000000, appraised_value_cents: 15000000 }, as: ProgramAdmin, as_user_id: "admin-1", captures: { site_id: $.data.id } }
            - { call: "POST /homeownership/build-sites/${site_id}/readiness-advance", payload: { step: "TITLE", document_reference: "T-1" }, as: ConstructionManager, as_user_id: "cm-1" }
            - { call: "POST /homeownership/build-sites/${site_id}/readiness-advance", payload: { step: "ENVIRONMENTAL", document_reference: "E-1" }, as: ConstructionManager, as_user_id: "cm-1" }
            - { call: "POST /homeownership/build-sites/${site_id}/readiness-advance", payload: { step: "UTILITIES", document_reference: "U-1" }, as: ConstructionManager, as_user_id: "cm-1" }
            - { call: "GET /homeownership/households/${hh_id}", as: MortgageOfficer, as_user_id: "officer-1", captures: { hh_v: $.data.version } }
            - { call: "POST /homeownership/mortgage-applications", payload: { household_id: "${hh_id}", build_site_id: "${site_id}", expected_household_version: "${hh_v}", term_months: 240 }, as: MortgageOfficer, as_user_id: "officer-1", captures: { app_id: $.data.id } }
            - { call: "POST /homeownership/mortgage-applications/${app_id}/submit-underwriting", as: MortgageOfficer, as_user_id: "officer-1", captures: { ss_amount: $.data.silent_second_amount_cents } }
            - { call: "GET /homeownership/programs/${prog_id}", as: MortgageOfficer, as_user_id: "officer-2", captures: { prog_v0: $.data.version, pool_total_before: $.data.subsidy_pool_cents, avail_before: $.data.subsidy_available_cents, committed_before: $.data.subsidy_committed_cents, disbursed_before: $.data.subsidy_disbursed_cents, posture_before: $.data.program_posture } }
          trigger:
            - { call: "POST /homeownership/mortgage-applications/${app_id}/approve", payload: { expected_program_version: "${prog_v0}", resale_restriction_months: 240 }, as: MortgageOfficer, as_user_id: "officer-2" }
            - { call: "GET /homeownership/programs/${prog_id}", as: MortgageOfficer, as_user_id: "officer-2", captures: { avail_mid: $.data.subsidy_available_cents, committed_mid: $.data.subsidy_committed_cents, disbursed_mid: $.data.subsidy_disbursed_cents, pool_total_mid: $.data.subsidy_pool_cents, posture_mid: $.data.program_posture } }
            - { call: "POST /homeownership/mortgage-applications/${app_id}/deny", payload: { denial_reason_code: "READINESS" }, as: MortgageOfficer, as_user_id: "officer-2" }
            - { call: "GET /homeownership/programs/${prog_id}", as: MortgageOfficer, as_user_id: "officer-2", captures: { avail_after: $.data.subsidy_available_cents, committed_after: $.data.subsidy_committed_cents, disbursed_after: $.data.subsidy_disbursed_cents, pool_total_after: $.data.subsidy_pool_cents, posture_after: $.data.program_posture } }
          assert:
            - "${ss_amount} == 1950000"
            - "MortgageApplication.${app_id}.escrow_monthly_cents == 20625"
            - "MortgageApplication.${app_id}.affordable_pi_payment_cents == 54375"
            - "MortgageApplication.${app_id}.term_months == 240"
            - "MortgageApplication.${app_id}.first_mortgage_principal_cents == 13050000"
            - "${pool_total_before} == 20000000"
            - "${avail_before} == 20000000"
            - "${committed_before} == 0"
            - "${disbursed_before} == 0"
            - "${posture_before} == OPEN"
            - "${committed_mid} == 1950000  # forward action really moved the quantity"
            - "${avail_mid} == 18050000"
            - "${disbursed_mid} == 0"
            - "${pool_total_mid} == 20000000"
            - "${posture_mid} == OPEN"
            - "${avail_after} == 20000000"
            - "${committed_after} == 0"
            - "${disbursed_after} == 0"
            - "${pool_total_after} == 20000000"
            - "${posture_after} == OPEN"
            - "AffiliateProgram.${prog_id}.subsidy_pool_cents == AffiliateProgram.${prog_id}.subsidy_available_cents + AffiliateProgram.${prog_id}.subsidy_committed_cents + AffiliateProgram.${prog_id}.subsidy_disbursed_cents"
            - "MortgageApplication.${app_id}.status == DENIED"
            - "MortgageApplication.${app_id}.denial_reason_code == READINESS"
            - "MortgageApplication.${app_id}.silent_second_amount_cents == 1950000  # the sized structure survives the denial; only the pool entry is compensated"
            - "MortgageApplication.${app_id}.lien_status == NONE"
            - "BuildSite.${site_id}.assigned_household_id == null"

      - name: invariant_sweat_equity_hours_credit_then_reverse_nets_to_zero
        conserved_quantity: "credited sweat equity hours (NON-MONETARY counter) — ApplicantHousehold.sweat_equity_credited_hours == round(sum(SweatEquityEntry.hours_credited over rows with status IN {CREDITED, REVERSED}), 2), mirrored on HouseholdMember.credited_hours_to_date"
        grounds:
          - calculations.sweat_equity_ledger_invariant
          - calculations.sweat_equity_credit_allocation
          - state_machines.SweatEquityEntry.status.VERIFIED_to_CREDITED
          - state_machines.SweatEquityEntry.status.CREDITED_to_REVERSED
          - entities.ApplicantHousehold.fields.sweat_equity_credited_hours
          - entities.HouseholdMember.fields.credited_hours_to_date
          - entities.SweatEquityEntry.fields.reversal_of_entry_id
          - validations[priority=19]
        distinguishing_aspect: |
          The conserved quantity is NON-MONETARY — an hour counter, not a money
          ledger: sweat_equity_credited_hours (and the member's
          credited_hours_to_date) must return to exactly 0.00 after credit(6.00h
          CONSTRUCTION at credit_weight 1.00 -> hours_credited 6.00) is followed by
          reverse, because the original stays in LEDGER_SET at +6.00 in status
          REVERSED while the mirror row sits in status CREDITED at -6.00, so the
          pair nets to 0.00 rather than the mirror being deleted. The mid-state
          capture of 6.00 proves the forward action moved the counter, and
          selection_status stays PARTNERSHIP_ACTIVE afterwards, proving the
          compensation is scoped to the counter and not to the state dimension.
