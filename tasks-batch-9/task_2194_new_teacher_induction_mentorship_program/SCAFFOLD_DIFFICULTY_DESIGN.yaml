        grounds:
          - validations[priority=10]
          - validations[priority=43]
          - state_machines.MentorMatch.ACTIVE_to_SUSPENDED
          - calculations.contact_log_credited_minutes
        distinguishing_aspect: |
          ERROR-CATEGORY PAIR state (priority 10, ERR_MATCH_STATE_INVALID, 409) versus
          business_fiscal (priority 43, ERR_DAILY_CREDIT_CAP_REACHED, 422): one request
          violates both, and the response is the 409 state error because priority 10
          precedes priority 43.
