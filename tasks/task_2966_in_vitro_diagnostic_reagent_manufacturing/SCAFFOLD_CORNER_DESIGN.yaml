              captures: { dcr_out_id: $.data.id, d2: $.data.trace_depth }
            - call: "GET /product-specifications/${ps_id}"
              payload: {}
              as: RegulatoryAffairs
              captures: { ps_v3: $.data.version }
            - call: "POST /design-control-records"
              payload: { product_specification_id: "${ps_id}", record_type: "VERIFICATION", document_ref: "DHF-VER-CA4", traces_to_record_id: "${dcr_out_id}", expected_product_specification_version: "${ps_v3}" }
              as: RegulatoryAffairs
              as_user_id: "ra-01"
              captures: { dcr_ver_id: $.data.id, d3: $.data.trace_depth }
            - call: "POST /design-control-records/${dcr_in_id}/approve"
              payload: {}
              as: QAReleaser
              as_user_id: "qa-01"
            - call: "POST /design-control-records/${dcr_out_id}/approve"
              payload: {}
              as: QAReleaser
              as_user_id: "qa-01"
            - call: "POST /design-control-records/${dcr_ver_id}/approve"
              payload: {}
              as: QAReleaser
              as_user_id: "qa-01"
              captures: { trace_after_ver: $.data.status }
            - call: "GET /product-specifications/${ps_id}"
              payload: {}
              as: RegulatoryAffairs
              captures: { flag_half: $.data.design_trace_complete, ps_v4: $.data.version }
          trigger:
            - call: "POST /product-specifications/${ps_id}/clearance"
              payload: { submission_ref: "K900004" }
              as: RegulatoryAffairs
              as_user_id: "ra-01"
              captures: { err_trace: $.data.error_id }
            - call: "POST /design-control-records"
              payload: { product_specification_id: "${ps_id}", record_type: "VALIDATION", document_ref: "DHF-VAL-CA4", traces_to_record_id: "${dcr_in_id}", expected_product_specification_version: "${ps_v4}" }
              as: RegulatoryAffairs
              as_user_id: "ra-01"
              captures: { err_link: $.data.error_id }
            - call: "POST /design-control-records"
              payload: { product_specification_id: "${ps_id}", record_type: "VALIDATION", document_ref: "DHF-VAL-CA4", traces_to_record_id: "${dcr_out_id}", expected_product_specification_version: "${ps_v4}" }
              as: RegulatoryAffairs
              as_user_id: "ra-01"
              captures: { dcr_val_id: $.data.id, d3b: $.data.trace_depth, val_status: $.data.status }
            - call: "GET /product-specifications/${ps_id}"
              payload: {}
              as: RegulatoryAffairs
              captures: { flag_draft_val: $.data.design_trace_complete, ps_v5: $.data.version }
            - call: "POST /design-control-records/${dcr_val_id}/approve"
              payload: {}
              as: QAReleaser
              as_user_id: "qa-01"
            - call: "GET /product-specifications/${ps_id}"
              payload: {}
              as: RegulatoryAffairs
              captures: { flag_full: $.data.design_trace_complete }
            - call: "POST /product-specifications/${ps_id}/clearance"
              payload: { submission_ref: "K900004" }
              as: RegulatoryAffairs
              as_user_id: "ra-01"
              captures: { cleared: $.data.clearance_status }
          assert:
            - "trace_depth is 1 for the DESIGN_INPUT, 2 for the DESIGN_OUTPUT and 3 for the VERIFICATION, computed as predecessor depth plus one"
            - "with the VERIFICATION approved but no VALIDATION at all, design_trace_complete is FALSE and clearance returns HTTP 409 ERR_DESIGN_TRACE_INCOMPLETE"
            - "a VALIDATION tracing to the DESIGN_INPUT returns HTTP 422 ERR_INVALID_TRACE_LINK, because a VALIDATION must trace to a DESIGN_OUTPUT — this is what makes cycles unreachable"
            - "the same VALIDATION tracing to the DESIGN_OUTPUT is accepted with trace_depth 3 and status DRAFT, and design_trace_complete is STILL false because DRAFT rows are excluded from the input set"
            - "approving that VALIDATION flips design_trace_complete to true, and the clearance that just failed now returns HTTP 200 with clearance_status CLEARED"

