      - name: already_matched_bank_record_resubmitted_rejected
        claim_type: violation_error
        grounds:
          - validations[priority=58]
          - entities.BankCreditRecord.fields.match_state
          - errors[ERR_BANK_CREDIT_ALREADY_MATCHED]
        distinguishing_aspect: >
          A consumed credit cannot be re-presented: resubmitting the already-MATCHED FINAL record
