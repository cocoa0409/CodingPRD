            - { call: "POST /care-network/organizations/${r_id}/activate", payload: {}, as: NetworkCoordinator }
            - { call: "POST /care-network/organizations/${r2_id}/activate", payload: {}, as: NetworkCoordinator }
            - call: "POST /care-network/agreements"
              payload: { party_a_org_id: "${s_id}", party_b_org_id: "${r_id}", effective_at: "2026-09-01T12:00:00Z" }
              as: NetworkCoordinator
              captures: { a1_id: $.data.id }
            - call: "POST /care-network/agreements"
              payload: { party_a_org_id: "${s_id}", party_b_org_id: "${r2_id}", effective_at: "2026-09-01T12:00:01Z" }
              as: NetworkCoordinator
              captures: { a2_id: $.data.id }
          trigger:
            - { call: "POST /care-network/agreements/${a1_id}/approve", payload: {}, as: NetworkCoordinator }
