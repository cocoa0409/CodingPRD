            - call: "POST /trip-requests"
              payload: { zone_id: "${z_id}", rider_id: "${rt2_id}", origin_stop_id: "${s0_id}", destination_stop_id: "${s2_id}", requested_pickup_utc: "2026-08-03T07:00:00Z", party_size: 1 }
