              captures: { dv1: $.data.version }
          trigger:
            - call: "POST /devices/${d1}/valve-commands"
              payload: { command: "OPEN", expected_device_version: "${dv1}", override_reason: "Burst hose bib replaced, restoring water", acknowledge_water_damage_risk: true }
              as: Homeowner
              as_user_id: "${h1}"
