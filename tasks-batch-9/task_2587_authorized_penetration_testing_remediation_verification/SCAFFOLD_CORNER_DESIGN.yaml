              as: ProgramManager
              as_user_id: "pm-1"
              captures: { err_asset: $.data.error_id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2027-01-01T00:00:00Z" }
              as: ProgramManager
              as_user_id: "pm-1"
              captures: { err_clock: $.data.error_id }
            - call: "POST /pentest/test-plans"
              payload: { fiscal_year: 2027, risk_appetite_score: 50, planned_engagement_count: 2, prioritization_mode: "RISK_DRIVEN" }
              as: ComplianceOfficer
              as_user_id: "co-1"
