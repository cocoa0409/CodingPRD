            - "${points_after} == 12, ${score_after} == 88 and ${hold_after} == false - 100 - 12 == 88 keeps the conservation identity"
            - "${assigned_driver} == ${driver_id} with HTTP 200 and ${bid_status} == SUBMITTED with ${bid_score} == 88 - both privileges return together"

      - name: a_stop_whose_references_do_not_match_its_type_is_structurally_incomplete
        claim_type: Error triggerable
        grounds:
          - errors.ERR_REFERENTIAL_INCOMPLETE
          - validations[priority 13]
          - endpoints[POST /fleet/trips/{trip_id}/stops]
        distinguishing_aspect: "store_id and replenishment_order_id are declared optional on the stop endpoint because non-delivery stops must omit them, which turns their presence into a structural rule rather than a required-field rule: a DELIVERY missing either reference and a FUEL carrying one both fail with ERR_REFERENTIAL_INCOMPLETE (422) rather than ERR_INVALID_REQUEST."
        test_recipe:
          setup:
            - "TRIP-X7 is DRAFT with no stops; store S-6070 and order O-X7 both exist and resolve."
          setup_api_calls:
            - call: "POST /fleet/_clock/set_current_utc"
