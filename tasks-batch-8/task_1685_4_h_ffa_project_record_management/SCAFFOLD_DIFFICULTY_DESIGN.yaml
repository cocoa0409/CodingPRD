              as: Member
              as_user_id: "${mem_id}"
              captures: { proj_id: $.data.id }
            - call: "POST /api/projects/${proj_id}/start"
              payload: {}
              as: Member
              as_user_id: "${mem_id}"
            - call: "POST /api/record-books"
              payload: { project_id: "${proj_id}", program_year: 2026 }
              as: Member
              as_user_id: "${mem_id}"
              captures: { rb_id: $.data.id }
            - call: "POST /api/ledger-entries"
              payload: { record_book_id: "${rb_id}", entry_kind: "EXPENSE", amount_cents: 5000, hours: 0, recorded_on: "2026-06-01" }
