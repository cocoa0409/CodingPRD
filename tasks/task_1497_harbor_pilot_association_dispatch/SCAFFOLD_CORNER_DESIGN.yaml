      - call: POST /pilotage/tariff-schedules
        payload:
          effective_from: '2026-07-01T00:00:00Z'
          tiers:
          - min_gt_exclusive: 0
            max_gt_inclusive: null
            rate_cents_per_gt: 100
          draft_surcharge_threshold_dm: 100
          draft_surcharge_pct: 0.15
          detention_free_minutes: 30
          detention_rate_cents_per_minute: 200
          delay_rate_cents_per_minute: 150
        as: AssociationAdmin
        captures:
          s2_id: $.data.id
      trigger:
      - call: POST /pilotage/vessel-orders
        payload:
          vessel_name: MV Sched
          gt: 1000
          draft_dm: 50
          order_type: ARRIVAL
          eta: '2026-08-10T00:00:00Z'
        as: VesselAgent
        as_user_id: agent-1
        captures:
          o_sched: $.data.tariff_schedule_id
          o_prov: $.data.provisional_fee_cents
      assert:
