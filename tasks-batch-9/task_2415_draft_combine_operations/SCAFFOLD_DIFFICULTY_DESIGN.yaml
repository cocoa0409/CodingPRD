          - entities.CompensatoryClaim.fields.claim_score
          - entities.CompensatoryClaim.fields.qualifies
          - entities.CompensatoryClaim.fields.advisory_snap_adjusted_score
        distinguishing_aspect: |
          A departure at 250000000 cents with snap_pct 0.70 and no honor scores exactly
          250.00, the inclusive COMP_QUALIFY_SCORE_MIN, so qualifies is true; a second claim
          one tenth of a unit lower scores 249.90 and does not qualify. The advisory variant
