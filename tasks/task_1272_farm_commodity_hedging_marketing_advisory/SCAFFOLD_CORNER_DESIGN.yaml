  # ============================================================ calculations
  - section: calculations
    instances:
      - name: insurance_guarantee_floor_and_indemnity
        claim_type: correct_result
        grounds: [calculations.insurance_guarantee_and_indemnity]
        distinguishing_aspect: "guarantee = floor(200000 x 0.75) = 150000 frozen at bind; indemnity uses max(projected 4.50, harvest 4.80) = 4.80 over a 10000-bushel shortfall -> 48000.00."
        test_recipe:
          setup: ["BALANCED operation expected 200000 (acres 1000, aph 200); baseline CERTIFIED; policy QUOTED with coverage 0.75, projected_price 4.50"]
          setup_api_calls:
            - { call: "POST /advisory/operations", payload: { name: "Ins Farm", primary_commodity: CORN, crop_year: 2026, risk_profile: BALANCED, yield_method: APH }, as: CommodityAdvisor, captures: { op_id: $.data.id, op_v: $.data.version } }
            - { call: "POST /advisory/production-baselines", payload: { operation_id: "${op_id}", planted_acres: 1000, aph_yield_bushels: 200, trend_yield_bushels: 205, expected_operation_version: "${op_v}" }, as: CommodityAdvisor, captures: { bl_id: $.data.id } }
            - { call: "POST /advisory/production-baselines/${bl_id}/certify", as: Grower, as_user_id: "${op_id}" }
            - { call: "POST /advisory/insurance-policies", payload: { operation_id: "${op_id}", baseline_id: "${bl_id}", coverage_level_pct: 0.75, projected_price: 4.50 }, as: CommodityAdvisor, captures: { pol: $.data.id } }
          trigger:
            - { call: "POST /advisory/insurance-policies/${pol}/bind", as: Grower, as_user_id: "${op_id}", captures: { guar: $.data.guarantee_bushels } }
            - { call: "POST /advisory/insurance-policies/${pol}/file-claim", payload: { actual_harvested_bushels: 140000, harvest_price: 4.80 }, as: Grower, as_user_id: "${op_id}", captures: { indem: $.data.indemnity_dollars, st: $.data.status } }
            - { call: "GET /advisory/operations/${op_id}", as: CommodityAdvisor, captures: { osf: $.data.over_sold_flag } }
          assert:
            - "guarantee_bushels == 150000 at bind (floor)"
            - "After claim of 140000 @ harvest 4.80: status CLAIM_SETTLED, indemnity_dollars == 48000.00 (10000 shortfall x max(4.50, 4.80))"
            - "over_sold_flag == false (no contracts outstanding)"
      - name: indemnity_zero_when_harvest_meets_guarantee
        claim_type: threshold_boundary
        grounds: [calculations.insurance_guarantee_and_indemnity]
        distinguishing_aspect: "actual_harvested == guarantee_bushels exactly (150000): max(0, 0) -> indemnity 0.00, boundary does not pay a cent and does not set over_sold_flag."
        test_recipe:
          setup: ["BALANCED operation expected 200000; CERTIFIED baseline; policy BOUND at 0.75 (guarantee 150000)"]
          setup_api_calls:
            - { call: "POST /advisory/operations", payload: { name: "Ins Farm 2", primary_commodity: CORN, crop_year: 2026, risk_profile: BALANCED, yield_method: APH }, as: CommodityAdvisor, captures: { op_id: $.data.id, op_v: $.data.version } }
            - { call: "POST /advisory/production-baselines", payload: { operation_id: "${op_id}", planted_acres: 1000, aph_yield_bushels: 200, trend_yield_bushels: 205, expected_operation_version: "${op_v}" }, as: CommodityAdvisor, captures: { bl_id: $.data.id } }
            - { call: "POST /advisory/production-baselines/${bl_id}/certify", as: Grower, as_user_id: "${op_id}" }
            - { call: "POST /advisory/insurance-policies", payload: { operation_id: "${op_id}", baseline_id: "${bl_id}", coverage_level_pct: 0.75, projected_price: 4.50 }, as: CommodityAdvisor, captures: { pol: $.data.id } }
            - { call: "POST /advisory/insurance-policies/${pol}/bind", as: Grower, as_user_id: "${op_id}" }
          trigger:
            - { call: "POST /advisory/insurance-policies/${pol}/file-claim", payload: { actual_harvested_bushels: 150000, harvest_price: 4.30 }, as: Grower, as_user_id: "${op_id}", captures: { indem: $.data.indemnity_dollars } }
          assert:
            - "indemnity_dollars == 0.00 at the exact guarantee boundary"
      - name: over_sold_flag_blocks_then_clears_on_cancel
        claim_type: input_set_filtering
        grounds: [calculations.insurance_guarantee_and_indemnity, entities.GrowerOperation.fields.over_sold_flag, "errors[ERR_OVER_SOLD_POSITION]"]
        distinguishing_aspect: "Crop-insurance interaction: settling a claim at 140000 actual while 160000 bu sit undelivered trips over_sold_flag (new contracts rejected ERR_OVER_SOLD_POSITION); cancelling the 60000-bu contract brings undelivered to 100000 <= 140000 and the flag auto-clears."
        test_recipe:
          setup: ["BALANCED operation expected 200000 (cap 160000), ACTIVE plan max 0.80, buyer APPROVED, FLAT contracts 100000 (Oct) + 60000 (Nov); policy BOUND 0.75"]
          setup_api_calls:
            - { call: "POST /advisory/operations", payload: { name: "OverSold Farm", primary_commodity: CORN, crop_year: 2026, risk_profile: BALANCED, yield_method: APH }, as: CommodityAdvisor, captures: { op_id: $.data.id, op_v: $.data.version } }
            - { call: "POST /advisory/production-baselines", payload: { operation_id: "${op_id}", planted_acres: 1000, aph_yield_bushels: 200, trend_yield_bushels: 205, expected_operation_version: "${op_v}" }, as: CommodityAdvisor, captures: { bl_id: $.data.id } }
            - { call: "POST /advisory/production-baselines/${bl_id}/certify", as: Grower, as_user_id: "${op_id}" }
            - { call: "POST /advisory/advisory-agreements", payload: { operation_id: "${op_id}", fee_type: FLAT_ANNUAL, flat_annual_fee: 1000 }, as: CommodityAdvisor, captures: { ag_id: $.data.id } }
            - { call: "POST /advisory/advisory-agreements/${ag_id}/submit", as: CommodityAdvisor }
            - { call: "POST /advisory/advisory-agreements/${ag_id}/deliver-disclosure", as: CommodityAdvisor }
            - { call: "POST /advisory/advisory-agreements/${ag_id}/acknowledge-disclosure", as: Grower, as_user_id: "${op_id}" }
            - { call: "POST /advisory/advisory-agreements/${ag_id}/sign", as: Grower, as_user_id: "${op_id}" }
            - { call: "POST /advisory/marketing-plans", payload: { operation_id: "${op_id}", baseline_id: "${bl_id}", max_priced_pct: 0.80 }, as: CommodityAdvisor, captures: { plan_id: $.data.id } }
            - { call: "POST /advisory/marketing-plans/${plan_id}/activate", as: CommodityAdvisor }
            - { call: "POST /advisory/buyers", payload: { name: "OS Buyer", buyer_type: ELEVATOR, credit_rating: A }, as: CommodityAdvisor, captures: { buyer_id: $.data.id } }
            - { call: "POST /advisory/buyers/${buyer_id}/approve", as: ComplianceOfficer }
            - { call: "POST /advisory/sales-contracts", payload: { operation_id: "${op_id}", plan_id: "${plan_id}", buyer_id: "${buyer_id}", contract_type: FLAT_PRICE, bushels: 100000, fixed_price: 4.50, delivery_window_start: "2026-10-01", delivery_window_end: "2026-11-01" }, as: CommodityAdvisor, captures: { c1: $.data.id } }
            - { call: "POST /advisory/sales-contracts", payload: { operation_id: "${op_id}", plan_id: "${plan_id}", buyer_id: "${buyer_id}", contract_type: FLAT_PRICE, bushels: 60000, fixed_price: 4.55, delivery_window_start: "2026-11-01", delivery_window_end: "2026-12-01" }, as: CommodityAdvisor, captures: { c2: $.data.id } }
            - { call: "POST /advisory/insurance-policies", payload: { operation_id: "${op_id}", baseline_id: "${bl_id}", coverage_level_pct: 0.75, projected_price: 4.50 }, as: CommodityAdvisor, captures: { pol: $.data.id } }
            - { call: "POST /advisory/insurance-policies/${pol}/bind", as: Grower, as_user_id: "${op_id}" }
          trigger:
            - { call: "POST /advisory/insurance-policies/${pol}/file-claim", payload: { actual_harvested_bushels: 140000, harvest_price: 4.80 }, as: Grower, as_user_id: "${op_id}" }
            - { call: "GET /advisory/operations/${op_id}", as: CommodityAdvisor, captures: { osf1: $.data.over_sold_flag } }
            - { call: "POST /advisory/sales-contracts", payload: { operation_id: "${op_id}", plan_id: "${plan_id}", buyer_id: "${buyer_id}", contract_type: FLAT_PRICE, bushels: 1000, fixed_price: 4.60, delivery_window_start: "2026-12-01", delivery_window_end: "2027-01-01" }, as: CommodityAdvisor, captures: { err: $.data.error_id } }
            - { call: "POST /advisory/sales-contracts/${c2}/cancel", as: CommodityAdvisor }
            - { call: "GET /advisory/operations/${op_id}", as: CommodityAdvisor, captures: { osf2: $.data.over_sold_flag } }
            - { call: "POST /advisory/sales-contracts", payload: { operation_id: "${op_id}", plan_id: "${plan_id}", buyer_id: "${buyer_id}", contract_type: FLAT_PRICE, bushels: 1000, fixed_price: 4.60, delivery_window_start: "2026-12-01", delivery_window_end: "2027-01-01" }, as: CommodityAdvisor, captures: { c3: $.data.id } }
          assert:
