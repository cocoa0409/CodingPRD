        distinguishing_aspect: |
          A DIFFERENT entity pair, PermitApplication -> Audition: the APPROVED edge is refused with
          ERR_AUDITION_REQUIRED while the linked Audition row is still SCHEDULED, and the identical
          decision call succeeds the moment that Audition row alone moves to PASSED. Nothing on the
          PermitApplication row changes between the two calls except the status the audition pushed.
        test_recipe:
          setup:
            - "Performer Bo holds an AMPLIFIED_MUSIC 2026 application with amplification_requested true, so requires_audition is true."
            - "The application was reviewed into AUDITION_REQUIRED and a sitting was scheduled, moving it to AUDITION_SCHEDULED with the Audition row in SCHEDULED."
            - "Three panelists have filed passing scores (9,8,8), (8,8,7) and (7,8,8), but nobody has finalized the sitting."
          setup_api_calls:
            - call: "POST /busking/zones"
              payload: { name: "Riverside Plaza", code: "RP", base_noise_cap_db: 78, evening_start_minute: 1080, quiet_hours_start_minute: 1380, quiet_hours_end_minute: 360, weekend_noise_bonus_db: 3, evening_penalty_db: 5, max_concurrent_closures: 1 }
              as: PermitOfficer
