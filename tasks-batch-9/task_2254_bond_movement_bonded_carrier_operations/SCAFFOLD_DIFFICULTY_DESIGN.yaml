# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task 2254 — In-Bond Movement & Bonded Carrier Operations
#
# Every numeric literal in `assert:` was computed by executing the §1.3 formulas
# (see each calculation's `precision:` witnesses). Logical clock starts at
# 2026-08-01T00:00:00Z and is only ever advanced by POST /_clock/set_current_utc.
#
# Fixture vocabulary reused across instances:
#   ports    "4601" Port of New York  (NE,  1 bay, GO warehouse)
#            "3901" Port of Chicago   (MW,  2 bays, GO warehouse)
#            "2704" Port of Los Angeles (PSW, 1 bay, no GO warehouse)
#   carrier  "Atlas Bonded Carriage" irs 12-3456789
#   bond     CONTINUOUS 50000.00, 2026-07-01 .. 2027-06-30, surety SUR-100
#   M1       IT, 4601 -> 3901, cargo 1234.60, weight 100.28, 3 packages
#            -> obligation 41.75, 35 transit days, deadline 2026-09-05T00:00:00Z
# =============================================================================
scaffold_difficulty_design:

  # =========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: transit_deadline_anchor_rebases_on_diversion_but_not_on_extension
        grounds:
          - calculations.transit_allowance_and_deadline
          - entities.InBondMovement.fields.deadline_anchor_utc
          - entities.InBondMovement.fields.transit_deadline_utc
          - state_machines.AmendmentRequest.SUBMITTED_to_APPROVED
        distinguishing_aspect: |
          Variant on_diversion_rebase moves deadline_anchor_utc to the decision
          instant while variant at_filing leaves it at filed_at, so an approved
          diversion decided on 2026-08-20 yields transit_deadline_utc
          2026-09-24T00:00:00Z where the extension variant on the identical
          movement would have yielded 2026-09-05 + granted days from 2026-08-01.
        test_recipe:
          setup:
            - "Clock at 2026-08-20T00:00:00Z; ports 4601 (NE), 3901 (MW), 2704 (PSW) registered."
            - "Carrier ACTIVE with sanction_points 0.0; CONTINUOUS bond 50000.00 ACTIVE."
            - "M1 filed 2026-08-01T00:00:00Z (35 transit days, deadline 2026-09-05T00:00:00Z), departed and IN_TRANSIT with an intact seal."
            - "A SUBMITTED DIVERSION amendment redirecting M1 to port 2704 is pending."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: CBPOfficer
              as_user_id: "OFF-1"
            - call: "POST /in-bond/ports"
              payload: { port_code: "4601", name: "Port of New York", region_code: "NE", exam_capacity_slots: 1, go_warehouse_available: true }
              as: CBPOfficer
              as_user_id: "OFF-1"
              captures: { p_ny: $.data.id }
            - call: "POST /in-bond/ports"
              payload: { port_code: "3901", name: "Port of Chicago", region_code: "MW", exam_capacity_slots: 2, go_warehouse_available: true }
              as: CBPOfficer
              as_user_id: "OFF-1"
              captures: { p_chi: $.data.id }
            - call: "POST /in-bond/ports"
              payload: { port_code: "2704", name: "Port of Los Angeles", region_code: "PSW", exam_capacity_slots: 1, go_warehouse_available: false }
              as: CBPOfficer
              as_user_id: "OFF-1"
              captures: { p_la: $.data.id }
            - call: "POST /in-bond/carriers"
              payload: { name: "Atlas Bonded Carriage", irs_number: "12-3456789" }
              as: CBPOfficer
              as_user_id: "OFF-1"
              captures: { c1: $.data.id }
            - call: "POST /in-bond/bonds"
              payload: { carrier_id: "${c1}", bond_type: "CONTINUOUS", limit_amount: 50000.00, effective_date: "2026-07-01T00:00:00Z", expiry_date: "2027-06-30T00:00:00Z", surety_code: "SUR-100" }
              as: CBPOfficer
              as_user_id: "OFF-1"
              captures: { b1: $.data.id }
            - call: "POST /in-bond/movements"
              payload: { carrier_id: "${c1}", in_bond_type: "IT", origin_port_id: "${p_ny}", destination_port_id: "${p_chi}", manifest_reference: "MAN-0001", cargo_value: 1234.60, gross_weight_kg: 100.28, package_count: 3, bond_id: "${b1}" }
              as: BondedCarrier
              as_user_id: "${c1}"
              captures: { m1: $.data.id }
            - call: "POST /in-bond/movements/${m1}/departure"
              payload: { seal_number: "SEAL-100" }
              as: BondedCarrier
              as_user_id: "${c1}"
              captures: { m1_v_dep: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-20T00:00:00Z" }
              as: CBPOfficer
              as_user_id: "OFF-1"
            - call: "POST /in-bond/amendment-requests"
              payload: { movement_id: "${m1}", amendment_type: "DIVERSION", justification_code: "CONSIGNEE_CHANGE", expected_movement_version: "${m1_v_dep}", requested_destination_port_code: "2704", requested_in_bond_type: "IT" }
              as: BondedCarrier
              as_user_id: "${c1}"
              captures: { am_div: $.data.id }
          trigger:
            - call: "POST /in-bond/amendment-requests/${am_div}/decision"
              payload: { decision: "APPROVE", decision_reason_code: "DIVERSION_GRANTED" }
              as: CBPOfficer
              as_user_id: "OFF-1"
              captures: { am_deadline: $.data.resulting_deadline_utc }
          assert:
            - "AmendmentRequest.${am_div}.status == APPROVED"
            - "AmendmentRequest.${am_div}.resulting_deadline_utc == 2026-09-24T00:00:00Z"
            - "InBondMovement.${m1}.deadline_anchor_utc == 2026-08-20T00:00:00Z"
            - "InBondMovement.${m1}.transit_deadline_utc == 2026-09-24T00:00:00Z"
            - "InBondMovement.${m1}.transit_days_allowed == 35"
            - "InBondMovement.${m1}.extension_days_granted == 0"
            - "InBondMovement.${m1}.destination_port_id == ${p_la}"
            - "InBondMovement.${m1}.transit_status == IN_TRANSIT"

      - name: mitigation_offer_diverges_between_first_and_supplemental_round
        grounds:
          - calculations.mitigation_offer_amount
          - entities.MitigationPetition.fields.mitigation_pct
          - entities.MitigationPetition.fields.offer_amount
          - state_machines.MitigationPetition.SUPPLEMENT_REQUESTED_to_SUBMITTED
        distinguishing_aspect: |
          With identical mitigation_factors (raw credit 0.90) and identical gross
          1234.60, variant first_petition clamps at CAP_FIRST 0.50 producing
          offer_amount 717.30 while variant supplemental_petition clamps at
          CAP_SUPPLEMENTAL 0.75 producing 408.65 — a 309.65 delta driven purely by
          the round, on a different entity and a different calculation than the
          transit-deadline variant pair.
        test_recipe:
          setup:
            - "Clock at 2026-09-11T12:00:00Z; M1 departed, arrival reported late at Chicago (7 days overdue)."
            - "CBP officer OFF-1 issued a LATE_ARRIVAL claim: assessed_amount 1234.60 (raw 1750.00 capped by cargo_value)."
            - "Carrier filed petition round 1 with factors FIRST_VIOLATION, CARGO_SECURED_INTACT, CBP_ADMIN_DELAY, EXTRAORDINARY_CIRCUMSTANCE -> offer_amount 717.30."
            - "FPF officer FPF-9 (not the issuer) requested a supplement, so the petition is SUPPLEMENT_REQUESTED at round 1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: CBPOfficer
              as_user_id: "OFF-1"
            - call: "POST /in-bond/ports"
              payload: { port_code: "4601", name: "Port of New York", region_code: "NE", exam_capacity_slots: 1, go_warehouse_available: true }
              as: CBPOfficer
              as_user_id: "OFF-1"
              captures: { p_ny: $.data.id }
            - call: "POST /in-bond/ports"
              payload: { port_code: "3901", name: "Port of Chicago", region_code: "MW", exam_capacity_slots: 2, go_warehouse_available: true }
              as: CBPOfficer
              as_user_id: "OFF-1"
              captures: { p_chi: $.data.id }
            - call: "POST /in-bond/carriers"
              payload: { name: "Atlas Bonded Carriage", irs_number: "12-3456789" }
              as: CBPOfficer
              as_user_id: "OFF-1"
              captures: { c1: $.data.id }
            - call: "POST /in-bond/bonds"
              payload: { carrier_id: "${c1}", bond_type: "CONTINUOUS", limit_amount: 50000.00, effective_date: "2026-07-01T00:00:00Z", expiry_date: "2027-06-30T00:00:00Z", surety_code: "SUR-100" }
              as: CBPOfficer
              as_user_id: "OFF-1"
              captures: { b1: $.data.id }
            - call: "POST /in-bond/movements"
              payload: { carrier_id: "${c1}", in_bond_type: "IT", origin_port_id: "${p_ny}", destination_port_id: "${p_chi}", manifest_reference: "MAN-0001", cargo_value: 1234.60, gross_weight_kg: 100.28, package_count: 3, bond_id: "${b1}" }
              as: BondedCarrier
              as_user_id: "${c1}"
              captures: { m1: $.data.id }
            - call: "POST /in-bond/movements/${m1}/departure"
              payload: { seal_number: "SEAL-100" }
              as: BondedCarrier
              as_user_id: "${c1}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-11T12:00:00Z" }
              as: CBPOfficer
              as_user_id: "OFF-1"
            - call: "POST /in-bond/reports"
              payload: { movement_id: "${m1}", port_id: "${p_chi}", report_type: "ARRIVAL", packages_reported: 3 }
              as: BondedCarrier
              as_user_id: "${c1}"
            - call: "POST /in-bond/ld-claims"
              payload: { movement_id: "${m1}", claim_type: "LATE_ARRIVAL", reason_code: "OVERDUE_ARRIVAL" }
              as: CBPOfficer
              as_user_id: "OFF-1"
              captures: { cl1: $.data.id, cl1_v: $.data.version }
            - call: "POST /in-bond/petitions"
              payload: { claim_id: "${cl1}", mitigation_factors: ["FIRST_VIOLATION", "CARGO_SECURED_INTACT", "CBP_ADMIN_DELAY", "EXTRAORDINARY_CIRCUMSTANCE"], narrative_reference: "PET-0001", expected_claim_version: "${cl1_v}" }
              as: BondedCarrier
              as_user_id: "${c1}"
              captures: { pet1: $.data.id, pet1_offer: $.data.offer_amount }
            - call: "POST /in-bond/petitions/${pet1}/decision"
              payload: { decision: "REQUEST_SUPPLEMENT", decision_reason_code: "NEED_SEAL_EVIDENCE" }
              as: FPFOfficer
              as_user_id: "FPF-9"
          trigger:
            - call: "POST /in-bond/petitions/${pet1}/supplement"
              payload: { mitigation_factors: ["FIRST_VIOLATION", "CARGO_SECURED_INTACT", "CBP_ADMIN_DELAY", "EXTRAORDINARY_CIRCUMSTANCE"], narrative_reference: "PET-0001-S1" }
              as: BondedCarrier
              as_user_id: "${c1}"
          assert:
            - "LiquidatedDamagesClaim.${cl1}.assessed_amount == 1234.60"
            - "MitigationPetition.${pet1}.round == 2"
            - "MitigationPetition.${pet1}.status == SUBMITTED"
            - "MitigationPetition.${pet1}.mitigation_pct == 0.75"
            - "MitigationPetition.${pet1}.net_before_fee == 308.65"
            - "MitigationPetition.${pet1}.processing_fee == 100.00"
            - "MitigationPetition.${pet1}.offer_amount == 408.65"
            - "MitigationPetition.${pet1}.offer_amount != 717.30 (the round-1 value captured as ${pet1_offer})"
            - "MitigationPetition.${pet1}.prior_violation_count == 0"

  # =========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: obligation_rounds_each_component_before_summing
        grounds:
          - calculations.movement_bond_obligation
          - entities.InBondMovement.fields.obligation_amount
          - entities.CustomsBond.fields.obligated_amount
        distinguishing_aspect: |
          Mode (b) intermediate-rounding order: cargo 1234.60 / weight 100.28 /
          3 packages gives per-component 40.12 + 1.25 + 0.38 = 41.75, whereas
          summing the raw products (40.1245 + 1.2535 + 0.3825 = 41.7605) and
          rounding once yields 41.76 — the assert pins 41.75, so a
          sum-then-round implementation fails.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z; ports 4601 (NE) and 3901 (MW) registered."
            - "Carrier ACTIVE, CONTINUOUS bond 50000.00 ACTIVE with obligated_amount 0.00."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: CBPOfficer
              as_user_id: "OFF-1"
            - call: "POST /in-bond/ports"
              payload: { port_code: "4601", name: "Port of New York", region_code: "NE", exam_capacity_slots: 1, go_warehouse_available: true }
              as: CBPOfficer
              as_user_id: "OFF-1"
              captures: { p_ny: $.data.id }
            - call: "POST /in-bond/ports"
              payload: { port_code: "3901", name: "Port of Chicago", region_code: "MW", exam_capacity_slots: 2, go_warehouse_available: true }
              as: CBPOfficer
              as_user_id: "OFF-1"
              captures: { p_chi: $.data.id }
            - call: "POST /in-bond/carriers"
              payload: { name: "Atlas Bonded Carriage", irs_number: "12-3456789" }
              as: CBPOfficer
              as_user_id: "OFF-1"
              captures: { c1: $.data.id }
            - call: "POST /in-bond/bonds"
              payload: { carrier_id: "${c1}", bond_type: "CONTINUOUS", limit_amount: 50000.00, effective_date: "2026-07-01T00:00:00Z", expiry_date: "2027-06-30T00:00:00Z", surety_code: "SUR-100" }
              as: CBPOfficer
              as_user_id: "OFF-1"
              captures: { b1: $.data.id }
          trigger:
            - call: "POST /in-bond/movements"
              payload: { carrier_id: "${c1}", in_bond_type: "IT", origin_port_id: "${p_ny}", destination_port_id: "${p_chi}", manifest_reference: "MAN-0001", cargo_value: 1234.60, gross_weight_kg: 100.28, package_count: 3, bond_id: "${b1}" }
              as: BondedCarrier
              as_user_id: "${c1}"
              captures: { m1: $.data.id }
          assert:
            - "InBondMovement.${m1}.obligation_amount == 41.75"
            - "InBondMovement.${m1}.obligation_amount != 41.76"
            - "CustomsBond.${b1}.obligated_amount == 41.75"
            - "CustomsBond.${b1}.available_amount == 49958.25"
            - "CustomsBond.${b1}.status == ACTIVE"
            - "BondObligationLedgerEntry for bond ${b1} count == 1 with entry_type == OBLIGATE, amount == 41.75, balance_after == 41.75"

      - name: mitigation_fee_tier_selected_on_pre_fee_net_only
        grounds:
          - calculations.mitigation_offer_amount
          - entities.MitigationPetition.fields.processing_fee
          - entities.MitigationPetition.fields.net_before_fee
          - calculations.liquidated_damages_assessment
        distinguishing_aspect: |
          Mode (c) order-sensitive multi-step evaluation: gross 3900.00 at cap
          0.50 gives net_before_fee 1950.00, which selects FEE_TIER1_FLAT 100.00
          and offer 2050.00; re-selecting the tier after adding the fee (net+fee
          = 2050.00 >= 2000.00) would pick 250.00 and give 2200.00, so the assert
          on 100.00 / 2050.00 falsifies any re-selection order.
        test_recipe:
          setup:
            - "Clock at 2026-09-25T00:00:00Z; M2 (cargo_value 3900.00) departed and arrived 20 days after its 2026-09-05T00:00:00Z deadline."
            - "LATE_ARRIVAL claim on M2: raw 250.00*1.0*20 = 5000.00 capped by cargo_value -> assessed_amount 3900.00."
            - "No other claim exists on any other movement of the carrier, so prior_violation_count is 0."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: CBPOfficer
              as_user_id: "OFF-1"
            - call: "POST /in-bond/ports"
              payload: { port_code: "4601", name: "Port of New York", region_code: "NE", exam_capacity_slots: 1, go_warehouse_available: true }
              as: CBPOfficer
              as_user_id: "OFF-1"
              captures: { p_ny: $.data.id }
            - call: "POST /in-bond/ports"
              payload: { port_code: "3901", name: "Port of Chicago", region_code: "MW", exam_capacity_slots: 2, go_warehouse_available: true }
              as: CBPOfficer
              as_user_id: "OFF-1"
              captures: { p_chi: $.data.id }
            - call: "POST /in-bond/carriers"
              payload: { name: "Atlas Bonded Carriage", irs_number: "12-3456789" }
              as: CBPOfficer
              as_user_id: "OFF-1"
              captures: { c1: $.data.id }
            - call: "POST /in-bond/bonds"
              payload: { carrier_id: "${c1}", bond_type: "CONTINUOUS", limit_amount: 50000.00, effective_date: "2026-07-01T00:00:00Z", expiry_date: "2027-06-30T00:00:00Z", surety_code: "SUR-100" }
              as: CBPOfficer
              as_user_id: "OFF-1"
              captures: { b1: $.data.id }
            - call: "POST /in-bond/movements"
              payload: { carrier_id: "${c1}", in_bond_type: "IT", origin_port_id: "${p_ny}", destination_port_id: "${p_chi}", manifest_reference: "MAN-0002", cargo_value: 3900.00, gross_weight_kg: 100.00, package_count: 4, bond_id: "${b1}" }
              as: BondedCarrier
              as_user_id: "${c1}"
              captures: { m2: $.data.id }
            - call: "POST /in-bond/movements/${m2}/departure"
              payload: { seal_number: "SEAL-200" }
              as: BondedCarrier
              as_user_id: "${c1}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-09-25T00:00:00Z" }
              as: CBPOfficer
              as_user_id: "OFF-1"
            - call: "POST /in-bond/reports"
              payload: { movement_id: "${m2}", port_id: "${p_chi}", report_type: "ARRIVAL", packages_reported: 4 }
              as: BondedCarrier
              as_user_id: "${c1}"
            - call: "POST /in-bond/ld-claims"
              payload: { movement_id: "${m2}", claim_type: "LATE_ARRIVAL", reason_code: "OVERDUE_ARRIVAL" }
              as: CBPOfficer
              as_user_id: "OFF-1"
              captures: { cl2: $.data.id, cl2_v: $.data.version }
          trigger:
            - call: "POST /in-bond/petitions"
              payload: { claim_id: "${cl2}", mitigation_factors: ["FIRST_VIOLATION", "CARGO_SECURED_INTACT", "CBP_ADMIN_DELAY", "EXTRAORDINARY_CIRCUMSTANCE"], narrative_reference: "PET-0002", expected_claim_version: "${cl2_v}" }
              as: BondedCarrier
              as_user_id: "${c1}"
              captures: { pet2: $.data.id }
          assert:
            - "InBondMovement.${m2}.obligation_amount == 128.51"
            - "LiquidatedDamagesClaim.${cl2}.overdue_days_at_issue == 20"
            - "LiquidatedDamagesClaim.${cl2}.assessed_amount == 3900.00"
            - "MitigationPetition.${pet2}.mitigation_pct == 0.50"
            - "MitigationPetition.${pet2}.net_before_fee == 1950.00"
            - "MitigationPetition.${pet2}.processing_fee == 100.00"
            - "MitigationPetition.${pet2}.offer_amount == 2050.00"
            - "MitigationPetition.${pet2}.offer_amount != 2200.00"

  # =========================================================================
  - rule_id: non_linear_state_machine
    instances:

      - name: custody_and_transit_dimensions_advance_independently
        grounds:
          - state_machines.InBondMovement.transit_status.IN_TRANSIT_to_ARRIVED
          - state_machines.InBondMovement.custody_status.BONDED_to_EXAM_HOLD
          - state_machines.InBondMovement.custody_status.EXAM_HOLD_to_BONDED
          - state_machines.ExaminationHold.OPEN_to_RELEASED
        distinguishing_aspect: |
          The parallel shape is falsified if either dimension drags the other:
          placing a hold while IN_TRANSIT must leave transit_status == IN_TRANSIT
          with custody_status == EXAM_HOLD, arrival must move transit_status to
          ARRIVED while custody_status stays EXAM_HOLD, and releasing the hold
          must return custody_status to BONDED without touching transit_status.
        test_recipe:
          setup:
            - "Clock at 2026-08-05T00:00:00Z; M1 departed and IN_TRANSIT with custody BONDED."
            - "Officer OFF-1 places a document examination hold at Chicago while the movement is still in transit."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: CBPOfficer
              as_user_id: "OFF-1"
            - call: "POST /in-bond/ports"
              payload: { port_code: "4601", name: "Port of New York", region_code: "NE", exam_capacity_slots: 1, go_warehouse_available: true }
              as: CBPOfficer
              as_user_id: "OFF-1"
              captures: { p_ny: $.data.id }
            - call: "POST /in-bond/ports"
              payload: { port_code: "3901", name: "Port of Chicago", region_code: "MW", exam_capacity_slots: 2, go_warehouse_available: true }
              as: CBPOfficer
              as_user_id: "OFF-1"
              captures: { p_chi: $.data.id }
            - call: "POST /in-bond/carriers"
              payload: { name: "Atlas Bonded Carriage", irs_number: "12-3456789" }
              as: CBPOfficer
              as_user_id: "OFF-1"
              captures: { c1: $.data.id }
            - call: "POST /in-bond/bonds"
              payload: { carrier_id: "${c1}", bond_type: "CONTINUOUS", limit_amount: 50000.00, effective_date: "2026-07-01T00:00:00Z", expiry_date: "2027-06-30T00:00:00Z", surety_code: "SUR-100" }
              as: CBPOfficer
              as_user_id: "OFF-1"
              captures: { b1: $.data.id }
            - call: "POST /in-bond/movements"
              payload: { carrier_id: "${c1}", in_bond_type: "IT", origin_port_id: "${p_ny}", destination_port_id: "${p_chi}", manifest_reference: "MAN-0001", cargo_value: 1234.60, gross_weight_kg: 100.28, package_count: 3, bond_id: "${b1}" }
              as: BondedCarrier
              as_user_id: "${c1}"
              captures: { m1: $.data.id }
            - call: "POST /in-bond/movements/${m1}/departure"
              payload: { seal_number: "SEAL-100" }
              as: BondedCarrier
              as_user_id: "${c1}"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T00:00:00Z" }
              as: CBPOfficer
              as_user_id: "OFF-1"
            - call: "POST /in-bond/examination-holds"
              payload: { movement_id: "${m1}", port_id: "${p_chi}", hold_type: "DOCUMENT", reason_code: "MANIFEST_REVIEW" }
              as: CBPOfficer
              as_user_id: "OFF-1"
              captures: { h1: $.data.id }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-10T00:00:00Z" }
              as: CBPOfficer
              as_user_id: "OFF-1"
            - call: "POST /in-bond/reports"
              payload: { movement_id: "${m1}", port_id: "${p_chi}", report_type: "ARRIVAL", packages_reported: 3 }
              as: BondedCarrier
              as_user_id: "${c1}"
