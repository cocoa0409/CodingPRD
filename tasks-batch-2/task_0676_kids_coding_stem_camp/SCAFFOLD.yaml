scenario: "Kids' Coding & STEM Camp (Code Ninjas/iD Tech style): program/belt-level & age track, session (after-school/camp/weekly) enrollment, curriculum progression & badge, instructor ratio & device/lab, parent portal & progress, drop-in vs membership, sibling/multi-week discount, showcase/competition"

domain_name: kids-coding-stem-camp
api_prefix: /

# ---------------------------------------------------------------------------
# Step 0 — Complexity Profile
# ---------------------------------------------------------------------------
complexity_profile:
  primary_archetype: quota_allocation
  secondary_archetype: pricing_engine
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - optimistic_concurrency
    - derived_field_reconciliation

  entity_topology: flat
  # Peer entities linked by FK references (Center, Program, Session, Member,
  # Guardian, Membership, Enrollment, etc.). URLs are flat collections with
  # foreign keys carried in request bodies, not nested ownership trees.

  state_machine_shape: parallel
  # Enrollment carries two independent state axes (attendance_status ×
  # billing_status). Membership runs a cyclic ACTIVE<->PAUSED loop. Session is
  # compound (its derived posture is a function of seat / instructor headroom).

  relationship_patterns:
    - one_to_many        # Guardian -> Member, Session -> Enrollment, Program -> BeltLevel
    - self_referential   # BeltLevel.prereq_belt_level_id references BeltLevel
    - cross_aggregate    # Enrollment references Session AND Member across aggregates

  role_model: peer_roles
  # Guardian owns its Members/Memberships/Enrollments; Instructor records
  # attendance and awards badges on sessions assigned to it; CenterAdmin runs
  # capacity/config/billing-sweep operations. CenterAdmin is a superset only for
  # configuration, not a blanket override of Guardian-owned data.

  consistency_model: immediate

# ---------------------------------------------------------------------------
# §1.0 Response Envelope (FIXED — verbatim)
# ---------------------------------------------------------------------------
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# ===========================================================================
# §1.1 Entity-Relationship Table
# ===========================================================================
entities:

  - name: Center
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Display name of the physical center."
      - name: device_count
        type: integer
        source: input
        description: "Number of lab devices (laptops/robots) physically available at the center; the per-session device cap is min(device_count, session.device_seats_requested)."
        constraints: ">= 1"
      - name: min_student_instructor_ratio
        type: integer
        source: input
        description: "Maximum students one instructor may supervise (e.g., 6 means 1 instructor per 6 students). A session's instructor headroom = assigned_instructor_count * min_student_instructor_ratio."
        constraints: ">= 1"
      - name: timezone
        type: string
        source: input
        description: "IANA timezone string used only for display; all stored timestamps are UTC."
        default: "UTC"

  - name: Program
    parent: null
    common_fields: true
    fields:
      - name: name
        type: string
        source: input
        description: "Program/track name (e.g., 'JR Robotics', 'CREATE Coding')."
      - name: code
        type: string
        source: input
        description: "Short unique program code."
        constraints: "unique across all Program rows; uppercase A-Z0-9, 2-8 chars"
      - name: min_age
        type: integer
        source: input
        description: "Minimum member age (whole years) allowed to enroll in any session of this program."
        constraints: ">= 4"
      - name: max_age
        type: integer
        source: input
        description: "Maximum member age (whole years, inclusive) allowed in this program; max_age >= min_age."
      - name: drop_in_fee_cents
        type: integer
        source: input
        description: "Base per-seat drop-in fee in cents for a single session of this program (pre-discount)."
        constraints: ">= 0"

  - name: BeltLevel
    parent: null
    common_fields: true
    fields:
      - name: program_id
        type: string
        source: input
        description: "FK -> Program.id; the program this belt belongs to."
      - name: name
        type: string
        source: input
        description: "Belt name (e.g., 'White', 'Yellow', 'Black')."
      - name: rank
        type: integer
        source: input
        description: "1-based ordinal of this belt within its program; lower rank is earned first. Unique per program_id."
        constraints: ">= 1; unique per (program_id, rank)"
      - name: prereq_belt_level_id
        type: string
        source: input
        description: "FK -> BeltLevel.id; the belt that must be held before promoting into this one. Null for the rank-1 (entry) belt only."
        default: null
      - name: required_badge_count
        type: integer
        source: input
        description: "Number of distinct ACTIVE badges of this belt a member must have been awarded before promotion into the NEXT belt is allowed."
        constraints: ">= 0"

  - name: Badge
    parent: null
    common_fields: true
    fields:
      - name: belt_level_id
        type: string
        source: input
        description: "FK -> BeltLevel.id; the belt whose curriculum this badge belongs to."
      - name: name
        type: string
        source: input
        description: "Badge name (e.g., 'Loops', 'Variables')."
      - name: status
        type: enum
        source: system
        description: "ACTIVE when created; RETIRED after a retire action. Retired badges no longer count toward promotion requirements computed AFTER retirement, but already-issued BadgeAward rows are preserved."
        default: "ACTIVE"
        constraints: "one of {ACTIVE, RETIRED}"

  - name: Guardian
    parent: null
    common_fields: true
    fields:
      - name: full_name
        type: string
        source: input
        description: "Parent/guardian full name."
      - name: email
        type: string
        source: input
        description: "Login/contact email."
        constraints: "unique across all Guardian rows; case-insensitive"
      - name: wallet_credit_cents
        type: integer
        source: computed
        description: "Account credit balance in cents, held at the Guardian level. Increased by enrollment-cancellation refunds and membership credits; decreased when applied to a drop-in enrollment. Never negative."
        default: 0

  - name: Member
    parent: null
    common_fields: true
    fields:
      - name: guardian_id
        type: string
        source: input
        description: "FK -> Guardian.id; the owning guardian (parent)."
      - name: program_id
        type: string
        source: input
        description: "FK -> Program.id; the program/track this member is on."
      - name: full_name
        type: string
        source: input
        description: "Child's full name."
      - name: birth_date
        type: datetime
        source: input
        description: "Child's date of birth (ISO 8601, date portion authoritative). Age is computed against the logical clock as whole completed years."
      - name: current_belt_level_id
        type: string
        source: computed
        description: "FK -> BeltLevel.id; the member's current belt. Initialized to the rank-1 belt of program_id on creation; advanced by the promote action."
      - name: active_badge_count
        type: integer
        source: computed
        description: "Count of distinct ACTIVE BadgeAward rows for this member whose underlying Badge.status == ACTIVE and whose Badge.belt_level_id == current_belt_level_id. Recomputed on every badge award, badge revoke, and badge retire."
        default: 0

  - name: Membership
    parent: null
    common_fields: true
    fields:
      - name: member_id
        type: string
        source: input
        description: "FK -> Member.id; the member this membership covers."
      - name: monthly_fee_cents
        type: integer
        source: input
        description: "Recurring monthly membership fee in cents (pre-discount)."
        constraints: ">= 0"
      - name: included_sessions_per_cycle
        type: integer
        source: input
        description: "Number of membership-covered (zero-marginal-cost) session enrollments granted per billing cycle."
        constraints: ">= 0"
      - name: sessions_used_this_cycle
        type: integer
        source: computed
        description: "Membership-covered enrollments consumed in the current cycle; incremented on a membership-covered enrollment, decremented on its cancellation, reset to 0 on a cycle-advance sweep."
        default: 0
      - name: status
        type: enum
        source: system
        description: "Lifecycle state. PENDING at creation, ACTIVE after activation payment, PAUSED on pause, ACTIVE again on resume, CANCELLED on cancel."
        default: "PENDING"
        constraints: "one of {PENDING, ACTIVE, PAUSED, CANCELLED}"
      - name: cycle_index
        type: integer
        source: computed
        description: "0-based count of completed billing cycles; incremented by the cycle-advance sweep."
        default: 0

  - name: Session
    parent: null
    common_fields: true
    fields:
      - name: center_id
        type: string
        source: input
        description: "FK -> Center.id; where the session runs."
      - name: program_id
        type: string
        source: input
        description: "FK -> Program.id; the track this session teaches (members must be on this program to enroll)."
      - name: format
        type: enum
        source: input
        description: "Delivery format. CAMP sessions run a multi-week block (week_count > 1); AFTER_SCHOOL and WEEKLY are single-week (week_count must be 1)."
        constraints: "one of {AFTER_SCHOOL, WEEKLY, CAMP}"
      - name: week_count
        type: integer
        source: input
        description: "Number of weeks the session spans; drives the multi-week discount and the per-seat price multiplier."
        constraints: ">= 1; must equal 1 unless format == CAMP"
      - name: starts_at
        type: datetime
        source: input
        description: "ISO 8601 UTC start instant of the session block."
      - name: ends_at
        type: datetime
        source: input
        description: "ISO 8601 UTC end instant; must be strictly after starts_at."
      - name: device_seats_requested
        type: integer
        source: input
        description: "Devices this session needs per seat-holder; the effective seat cap is min(this, center.device_count)."
        constraints: ">= 1"
      - name: assigned_instructor_count
        type: integer
        source: input
        description: "Instructors staffed on this session; instructor headroom = assigned_instructor_count * center.min_student_instructor_ratio."
        constraints: ">= 1"
      - name: status
        type: enum
        source: system
        description: "Lifecycle. DRAFT at creation, OPEN after open action (accepts enrollments), then auto-derived RESTRICTED/FULL as headroom is consumed; CANCELLED on cancel; COMPLETED after the complete action."
        default: "DRAFT"
        constraints: "one of {DRAFT, OPEN, RESTRICTED, FULL, CANCELLED, COMPLETED}"
      - name: confirmed_seat_count
        type: integer
        source: computed
        description: "Count of Enrollments on this session whose attendance_status IN {RESERVED, CHECKED_IN, ATTENDED}. Recomputed on every enrollment create, cancel, and check-in. Drives capacity posture."
        default: 0

  - name: Enrollment
    parent: null
    common_fields: true
    fields:
      - name: session_id
        type: string
        source: input
        description: "FK -> Session.id; the session being enrolled into."
      - name: member_id
        type: string
        source: input
        description: "FK -> Member.id; the child being enrolled."
      - name: coverage
        type: enum
        source: input
        description: "DROP_IN means the seat is paid per-session (price_cents > 0 unless covered by wallet credit); MEMBERSHIP means it consumes one included session from the member's ACTIVE membership."
        constraints: "one of {DROP_IN, MEMBERSHIP}"
      - name: sibling_index
        type: integer
        source: input
        description: "1-based ordinal of this child among the guardian's children enrolled in THIS session at create time; 2nd+ siblings receive the sibling discount. The client supplies it and the server validates it against existing sibling enrollments."
        default: 1
        constraints: ">= 1"
      - name: price_cents
        type: integer
        source: computed
        description: "Final charged price in cents for this enrollment after multi-week, sibling, and wallet-credit application. 0 for MEMBERSHIP coverage."
        default: 0
      - name: wallet_applied_cents
        type: integer
        source: computed
        description: "Amount of guardian wallet credit applied to this enrollment at create time (DROP_IN only)."
        default: 0
      - name: attendance_status
        type: enum
        source: system
        description: "Attendance axis (independent of billing_status). RESERVED at create, CHECKED_IN on check-in, ATTENDED on session completion, CANCELLED on cancel, NO_SHOW if not checked in by session completion."
        default: "RESERVED"
        constraints: "one of {RESERVED, CHECKED_IN, ATTENDED, NO_SHOW, CANCELLED}"
      - name: billing_status
        type: enum
        source: system
        description: "Billing axis (independent of attendance_status). UNBILLED then CHARGED at create for DROP_IN (or COVERED for MEMBERSHIP); REFUNDED on a refundable cancel; FORFEITED on a non-refundable cancel."
        default: "UNBILLED"
        constraints: "one of {UNBILLED, CHARGED, COVERED, REFUNDED, FORFEITED}"

  - name: BadgeAward
    parent: null
    common_fields: true
    fields:
      - name: enrollment_id
        type: string
        source: input
        description: "FK -> Enrollment.id; the enrollment during which the badge was earned (pins member and session)."
      - name: badge_id
        type: string
        source: input
        description: "FK -> Badge.id; the badge awarded."
      - name: status
        type: enum
        source: system
        description: "ACTIVE when awarded; REVOKED after a revoke action. Only ACTIVE awards count toward active_badge_count and promotion."
        default: "ACTIVE"
        constraints: "one of {ACTIVE, REVOKED}"

  - name: Showcase
    parent: null
    common_fields: true
    fields:
      - name: center_id
        type: string
        source: input
        description: "FK -> Center.id; the host center."
      - name: program_id
        type: string
        source: input
        description: "FK -> Program.id; only members on this program may enter."
      - name: min_belt_rank
        type: integer
        source: input
        description: "Minimum belt rank (within program) an entrant's current belt must meet or exceed."
        constraints: ">= 1"
      - name: capacity
        type: integer
        source: input
        description: "Maximum number of ACCEPTED entries."
        constraints: ">= 1"
      - name: starts_at
        type: datetime
        source: input
        description: "ISO 8601 UTC start instant of the showcase."
      - name: entry_deadline_at
        type: datetime
        source: input
        description: "ISO 8601 UTC; entries may only be submitted at or before this instant (inclusive boundary). Must be strictly before starts_at."
      - name: status
        type: enum
        source: system
        description: "DRAFT, OPEN (accepting entries), JUDGING (after deadline sweep), COMPLETED (results posted), CANCELLED."
        default: "DRAFT"
        constraints: "one of {DRAFT, OPEN, JUDGING, COMPLETED, CANCELLED}"
      - name: accepted_entry_count
        type: integer
        source: computed
        description: "Count of ShowcaseEntry rows on this showcase whose status == ACCEPTED. Recomputed on entry accept and entry withdraw."
        default: 0

  - name: ShowcaseEntry
    parent: null
    common_fields: true
    fields:
      - name: showcase_id
        type: string
        source: input
        description: "FK -> Showcase.id; the showcase entered."
      - name: member_id
        type: string
        source: input
        description: "FK -> Member.id; the entrant."
      - name: score
        type: number
        source: input
        description: "Judge score 0-100, supplied on the score action; null until scored."
        default: null
        constraints: "0 <= score <= 100 when present"
      - name: rank
        type: integer
        source: computed
        description: "1-based final placement assigned by the judging sweep among ACCEPTED entries, ordered by score DESC then created_at ASC. Null until the showcase is JUDGING/COMPLETED."
        default: null
      - name: status
        type: enum
        source: system
        description: "SUBMITTED at create, ACCEPTED on accept, REJECTED on reject, WITHDRAWN on withdraw, SCORED after a score action (only from ACCEPTED)."
        default: "SUBMITTED"
        constraints: "one of {SUBMITTED, ACCEPTED, REJECTED, WITHDRAWN, SCORED}"

# ===========================================================================
# §1.2 State Machine Table
# ===========================================================================
state_machines:

  # ---- Session: compound capacity posture (auto-derived RESTRICTED/FULL) ----
  - entity: Session
    initial_state: DRAFT
    terminal_states: [CANCELLED, COMPLETED]
    transitions:
      - from: DRAFT
        to: OPEN
        trigger: "POST /sessions/{id}/open"
        actor: CenterAdmin
        preconditions:
          - "session.status == DRAFT"
          - "ends_at strictly after starts_at"
          - "assigned_instructor_count >= 1"
        side_effects:
          - "set confirmed_seat_count = 0"
          - "session.status becomes OPEN (accepts enrollments)"
          - "increments Session.version by 1"
      - from: OPEN
        to: RESTRICTED
        trigger: "system (auto) on enrollment create"
        actor: system
        preconditions:
          - "after the new enrollment, confirmed_seat_count >= ceil(effective_capacity * 0.8) AND confirmed_seat_count < effective_capacity"
        side_effects:
          - "session.status becomes RESTRICTED (still accepts enrollments up to effective_capacity)"
        note: "effective_capacity = min(center.device_count, assigned_instructor_count * center.min_student_instructor_ratio, ...) capped by device_seats_requested per §1.3 session_effective_capacity."
      - from: RESTRICTED
        to: FULL
        trigger: "system (auto) on enrollment create"
        actor: system
        preconditions:
          - "after the new enrollment, confirmed_seat_count == effective_capacity"
        side_effects:
          - "session.status becomes FULL (rejects further RESERVED enrollments)"
      - from: RESTRICTED
        to: OPEN
        trigger: "system (auto) on enrollment cancel"
        actor: system
        preconditions:
          - "after cancellation, confirmed_seat_count < ceil(effective_capacity * 0.8)"
        side_effects:
          - "session.status reverts to OPEN"
      - from: FULL
        to: RESTRICTED
        trigger: "system (auto) on enrollment cancel"
        actor: system
        preconditions:
          - "after cancellation, ceil(effective_capacity * 0.8) <= confirmed_seat_count < effective_capacity"
        side_effects:
          - "session.status reverts to RESTRICTED (re-opens a seat)"
      - from: FULL
        to: OPEN
        trigger: "system (auto) on enrollment cancel"
        actor: system
        preconditions:
          - "after cancellation, confirmed_seat_count < ceil(effective_capacity * 0.8)"
        side_effects:
          - "session.status reverts to OPEN (re-opens a seat; reached directly from FULL when the RESTRICTED band [ceil(0.8*cap), cap) is empty, i.e., when effective_capacity is small enough that one cancel drops below the restricted threshold)"
        note: "For small effective_capacity (e.g., 2), ceil(0.8*2)=2 equals capacity, so the RESTRICTED band is empty and a cancel from FULL lands directly in OPEN."
      - from: OPEN
        to: COMPLETED
        trigger: "POST /sessions/{id}/complete"
        actor: CenterAdmin
        preconditions:
          - "session.status IN {OPEN, RESTRICTED, FULL}"
          - "logical clock now >= session.ends_at"
        side_effects:
          - "every Enrollment with attendance_status == CHECKED_IN transitions to ATTENDED"
          - "every Enrollment with attendance_status == RESERVED transitions to NO_SHOW (no refund; billing_status set FORFEITED if it was CHARGED)"
          - "increments Session.version by 1"
        note: "Same complete trigger applies from RESTRICTED and FULL (the IN-set precondition covers all three)."
      - from: RESTRICTED
        to: COMPLETED
        trigger: "POST /sessions/{id}/complete"
        actor: CenterAdmin
        preconditions:
          - "session.status IN {OPEN, RESTRICTED, FULL}"
          - "logical clock now >= session.ends_at"
        side_effects:
          - "every Enrollment with attendance_status == CHECKED_IN transitions to ATTENDED"
          - "every Enrollment with attendance_status == RESERVED transitions to NO_SHOW (billing_status set FORFEITED if it was CHARGED)"
          - "increments Session.version by 1"
      - from: FULL
        to: COMPLETED
        trigger: "POST /sessions/{id}/complete"
        actor: CenterAdmin
        preconditions:
          - "session.status IN {OPEN, RESTRICTED, FULL}"
          - "logical clock now >= session.ends_at"
        side_effects:
          - "every Enrollment with attendance_status == CHECKED_IN transitions to ATTENDED"
          - "every Enrollment with attendance_status == RESERVED transitions to NO_SHOW (billing_status set FORFEITED if it was CHARGED)"
          - "increments Session.version by 1"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /sessions/{id}/cancel"
        actor: CenterAdmin
        preconditions:
          - "session.status IN {DRAFT, OPEN, RESTRICTED, FULL}"
        side_effects:
          - "every non-terminal Enrollment (attendance_status IN {RESERVED, CHECKED_IN}) transitions to CANCELLED with a FULL refund: DROP_IN credits guardian.wallet_credit_cents += (price_cents + wallet_applied_cents) (billing_status REFUNDED); MEMBERSHIP enrollment decrements membership.sessions_used_this_cycle by 1"
          - "increments Session.version by 1"
        note: "Center-initiated cancel always refunds in full regardless of the 24-hour window (contrast with guardian-initiated enrollment cancel). Refund restores price_cents + wallet_applied_cents so money is conserved."
      - from: OPEN
        to: CANCELLED
        trigger: "POST /sessions/{id}/cancel"
        actor: CenterAdmin
        preconditions:
          - "session.status IN {DRAFT, OPEN, RESTRICTED, FULL}"
        side_effects:
          - "HOP 1 (Session->Enrollment): the session moving to CANCELLED drives every non-terminal Enrollment (RESERVED/CHECKED_IN) on it to CANCELLED"
          - "HOP 2 (Enrollment->Guardian/Membership): each Enrollment's cancellation sets billing_status REFUNDED and, for DROP_IN, credits guardian.wallet_credit_cents += (price_cents + wallet_applied_cents); for MEMBERSHIP, decrements membership.sessions_used_this_cycle -= 1"
          - "HOP 3 (Guardian wallet now non-zero) is observable: a subsequent DROP_IN enrollment for that guardian applies the restored wallet credit via enrollment_drop_in_price"
          - "increments Session.version by 1"
        note: "Depth-3 transitive cascade: Session CANCELLED -> Enrollment CANCELLED -> Guardian.wallet_credit_cents increased. Each hop is caused by the prior hop, not directly by the cancel action."

  # ---- Membership: cyclic ACTIVE<->PAUSED loop ----
  - entity: Membership
    initial_state: PENDING
    terminal_states: [CANCELLED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /memberships/{id}/activate"
        actor: Guardian
        preconditions:
          - "membership.status == PENDING"
        side_effects:
          - "set sessions_used_this_cycle = 0, cycle_index = 0"
          - "increments Membership.version by 1"
      - from: ACTIVE
        to: PAUSED
        trigger: "POST /memberships/{id}/pause"
        actor: Guardian
        preconditions:
          - "membership.status == ACTIVE"
        side_effects:
          - "membership stops covering new enrollments while PAUSED"
          - "increments Membership.version by 1"
      - from: PAUSED
        to: ACTIVE
        trigger: "POST /memberships/{id}/resume"
        actor: Guardian
        preconditions:
          - "membership.status == PAUSED"
        side_effects:
          - "membership resumes covering enrollments (sessions_used_this_cycle unchanged across the pause)"
          - "increments Membership.version by 1"
        note: "ACTIVE<->PAUSED is a cycle: a membership may be paused and resumed any number of times."
      - from: ACTIVE
        to: CANCELLED
        trigger: "POST /memberships/{id}/cancel"
        actor: Guardian
        preconditions:
          - "membership.status IN {ACTIVE, PAUSED}"
        side_effects:
          - "all future enrollments default to DROP_IN coverage"
          - "increments Membership.version by 1"
      - from: PAUSED
        to: CANCELLED
        trigger: "POST /memberships/{id}/cancel"
        actor: Guardian
        preconditions:
          - "membership.status IN {ACTIVE, PAUSED}"
        side_effects:
          - "all future enrollments default to DROP_IN coverage"
          - "increments Membership.version by 1"

  # ---- Enrollment: PARALLEL dimensions (attendance_status x billing_status) ----
  - entity: Enrollment
    initial_state: RESERVED
    terminal_states: [ATTENDED, NO_SHOW, CANCELLED]
    transitions:
      - from: RESERVED
        to: CHECKED_IN
        trigger: "POST /enrollments/{id}/check-in"
        actor: Instructor
        preconditions:
          - "enrollment.attendance_status == RESERVED"
          - "session.status IN {OPEN, RESTRICTED, FULL}"
          - "logical clock now >= session.starts_at"
        side_effects:
          - "attendance_status becomes CHECKED_IN (billing_status unchanged)"
          - "increments Enrollment.version by 1"
        note: "Attendance axis only; billing_status (CHARGED/COVERED) is untouched, demonstrating independent parallel dimensions."
      - from: RESERVED
        to: CANCELLED
        trigger: "POST /enrollments/{id}/cancel"
        actor: Guardian
        preconditions:
          - "enrollment.attendance_status == RESERVED"
          - "session.status != COMPLETED"
        side_effects:
          - "attendance_status becomes CANCELLED"
          - "if DROP_IN AND (session.starts_at - now) >= 24h: billing_status becomes REFUNDED and guardian.wallet_credit_cents += (price_cents + wallet_applied_cents) — i.e., the full original charge is restored: the cash paid (price_cents) PLUS the wallet credit originally consumed (wallet_applied_cents). This keeps total money conserved (see compensating_invariant)."
          - "if DROP_IN AND (session.starts_at - now) < 24h: billing_status becomes FORFEITED and NO wallet credit is returned (neither price_cents nor wallet_applied_cents)"
          - "if MEMBERSHIP: billing_status becomes REFUNDED and membership.sessions_used_this_cycle -= 1 (seat returned regardless of window)"
          - "session.confirmed_seat_count -= 1 and session capacity posture re-derived (FULL->RESTRICTED->OPEN as applicable)"
          - "increments Enrollment.version by 1"
        note: "The 24h refund window is the temporal-overlap boundary on the cancellation deadline. A refundable cancel restores price_cents + wallet_applied_cents so no money is created or destroyed."
      - from: CHECKED_IN
        to: CANCELLED
        trigger: "POST /enrollments/{id}/cancel"
        actor: Guardian
        preconditions:
          - "enrollment.attendance_status == CHECKED_IN"
          - "session.status != COMPLETED"
        side_effects:
          - "attendance_status becomes CANCELLED; billing_status becomes FORFEITED (no refund once checked in)"
          - "session.confirmed_seat_count -= 1 and posture re-derived"
          - "increments Enrollment.version by 1"
      - from: CHECKED_IN
        to: ATTENDED
        trigger: "system (auto) on session complete"
        actor: system
        preconditions:
          - "session transitions to COMPLETED while enrollment.attendance_status == CHECKED_IN"
        side_effects:
          - "attendance_status becomes ATTENDED"
      - from: RESERVED
        to: NO_SHOW
        trigger: "system (auto) on session complete"
        actor: system
        preconditions:
          - "session transitions to COMPLETED while enrollment.attendance_status == RESERVED"
        side_effects:
          - "attendance_status becomes NO_SHOW; if billing_status == CHARGED it becomes FORFEITED; if billing_status == COVERED the membership seat is NOT returned"

  # ---- ShowcaseEntry: branching fork (ACCEPTED vs REJECTED) ----
  - entity: ShowcaseEntry
    initial_state: SUBMITTED
    terminal_states: [REJECTED, WITHDRAWN]
    transitions:
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /showcase-entries/{id}/accept"
        actor: CenterAdmin
        preconditions:
          - "entry.status == SUBMITTED"
          - "showcase.status == OPEN"
          - "showcase.accepted_entry_count < showcase.capacity"
          - "member.current_belt rank >= showcase.min_belt_rank (cross-entity)"
        side_effects:
          - "entry.status becomes ACCEPTED"
          - "showcase.accepted_entry_count += 1"
          - "increments ShowcaseEntry.version by 1"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /showcase-entries/{id}/reject"
        actor: CenterAdmin
        preconditions:
          - "entry.status == SUBMITTED"
          - "showcase.status IN {OPEN, JUDGING}"
        side_effects:
          - "entry.status becomes REJECTED (no capacity change)"
          - "increments ShowcaseEntry.version by 1"
        note: "Fork: an entry from SUBMITTED goes to ACCEPTED (capacity-consuming, belt-gated) OR REJECTED (no capacity effect) — divergent side-effect sets per branch."
      - from: ACCEPTED
        to: WITHDRAWN
        trigger: "POST /showcase-entries/{id}/withdraw"
        actor: Guardian
        preconditions:
          - "entry.status == ACCEPTED"
          - "showcase.status IN {OPEN, JUDGING}"
        side_effects:
          - "entry.status becomes WITHDRAWN"
          - "showcase.accepted_entry_count -= 1 (frees a slot)"
          - "increments ShowcaseEntry.version by 1"
      - from: ACCEPTED
        to: SCORED
        trigger: "POST /showcase-entries/{id}/score"
        actor: CenterAdmin
        preconditions:
          - "entry.status == ACCEPTED"
          - "showcase.status == JUDGING"
          - "0 <= score <= 100"
        side_effects:
          - "entry.status becomes SCORED; entry.score set"
          - "increments ShowcaseEntry.version by 1"

  # ---- Showcase: linear with deadline sweep ----
  - entity: Showcase
    initial_state: DRAFT
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: DRAFT
        to: OPEN
        trigger: "POST /showcases/{id}/open"
        actor: CenterAdmin
        preconditions:
          - "showcase.status == DRAFT"
          - "entry_deadline_at strictly before starts_at"
        side_effects:
          - "showcase.status becomes OPEN (accepts entries)"
          - "increments Showcase.version by 1"
      - from: OPEN
        to: JUDGING
        trigger: "POST /showcases/{id}/close-entries"
        actor: CenterAdmin
        preconditions:
          - "showcase.status == OPEN"
          - "logical clock now > showcase.entry_deadline_at"
        side_effects:
          - "every entry still in SUBMITTED transitions to REJECTED (deadline sweep)"
          - "showcase.status becomes JUDGING"
          - "increments Showcase.version by 1"
      - from: JUDGING
        to: COMPLETED
        trigger: "POST /showcases/{id}/post-results"
        actor: CenterAdmin
        preconditions:
          - "showcase.status == JUDGING"
          - "every ACCEPTED entry has status SCORED (no un-scored accepted entries remain)"
        side_effects:
          - "rank assigned to all SCORED entries: order by score DESC, then created_at ASC; rank 1..N"
          - "showcase.status becomes COMPLETED"
          - "increments Showcase.version by 1"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /showcases/{id}/cancel"
        actor: CenterAdmin
        preconditions:
          - "showcase.status IN {DRAFT, OPEN, JUDGING}"
        side_effects:
          - "every non-terminal entry (SUBMITTED, ACCEPTED, SCORED) transitions to WITHDRAWN; accepted_entry_count set to 0"
          - "increments Showcase.version by 1"
      - from: OPEN
        to: CANCELLED
        trigger: "POST /showcases/{id}/cancel"
        actor: CenterAdmin
        preconditions:
          - "showcase.status IN {DRAFT, OPEN, JUDGING}"
        side_effects:
          - "every non-terminal entry transitions to WITHDRAWN; accepted_entry_count set to 0"
          - "increments Showcase.version by 1"

# ---------------------------------------------------------------------------
# §1.2.1 Concurrency Rules
# ---------------------------------------------------------------------------
concurrency_rules:
  - rule_id: enroll-stale-session
    parent_entity: Session
    write_endpoint: "POST /enrollments"
    occ_field: "expected_session_version"
    description: |
      Creating an Enrollment against a Session whose version has advanced since
      the client last observed it is rejected with a stale-version error. A seat
      is a finite resource: when an earlier enrollment consumed the last seat the
      Session's version advanced (confirmed_seat_count bumped, posture re-derived
      to FULL), so a create that still carries the pre-fill version is operating
      on a stale view of remaining capacity and must be refused rather than
      silently over-subscribing the lab.
    error_id: ERR_STALE_SESSION_VERSION
    http_status: 412

  - rule_id: showcase-entry-accept-stale
    parent_entity: Showcase
    write_endpoint: "POST /showcase-entries/{id}/accept"
    occ_field: "expected_showcase_version"
    description: |
      Accepting a ShowcaseEntry against a Showcase whose version has advanced
      since the client last observed it is rejected with a stale-version error.
      Showcase capacity is a finite pool; when a prior accept consumed the final
      slot the Showcase.version advanced (accepted_entry_count bumped), so an
      accept still carrying the pre-fill version is operating on a stale view of
      remaining capacity and must be refused.
    error_id: ERR_STALE_SHOWCASE_VERSION
    http_status: 412

# ===========================================================================
# §1.3 Calculation Rules Table
# ===========================================================================
calculations:

  # ---- (combinatorial mode (c): circular-looking dependency, evaluation order pinned)
  - name: enrollment_drop_in_price
    trigger: "POST /enrollments with coverage == DROP_IN (computes price_cents and wallet_applied_cents)"
    algorithm: tiered_pricing
    formula: |
      # Evaluation order is PINNED and must be followed exactly:
      # Step 1 — base = program.drop_in_fee_cents
      # Step 2 — multi-week multiplier (CAMP only):
      #     if session.format == CAMP and session.week_count >= MULTI_WEEK_THRESHOLD:
      #         week_factor = session.week_count * (1 - MULTI_WEEK_DISCOUNT_PCT)
      #     else:
      #         week_factor = session.week_count          # single week => factor 1
      #     gross = round_half_up(base * week_factor)      # ROUND HERE, per-line, before discount
      # Step 3 — sibling discount (applies to gross, AFTER multi-week rounding):
      #     if enrollment.sibling_index >= 2:
      #         discounted = round_half_up(gross * (1 - SIBLING_DISCOUNT_PCT))
      #     else:
      #         discounted = gross
      # Step 4 — wallet credit application (circular-looking: the charge depends
      #     on wallet, and wallet is then debited by exactly what it covered):
      #     wallet_applied_cents = min(guardian.wallet_credit_cents, discounted)
      #     price_cents = discounted - wallet_applied_cents
      #     guardian.wallet_credit_cents -= wallet_applied_cents   # debit AFTER price pinned
      # The order (compute discounted -> derive wallet_applied from it -> debit) makes
      # the otherwise circular price<->wallet dependency well-defined.
    input_set: "Single enrollment at create time; uses program.drop_in_fee_cents, session.format, session.week_count, enrollment.sibling_index, guardian.wallet_credit_cents."
    constants:
      MULTI_WEEK_THRESHOLD: 2
      MULTI_WEEK_DISCOUNT_PCT: 0.10
      SIBLING_DISCOUNT_PCT: 0.15
    precision: "integer cents; round_half_up at each pinned rounding step (Step 2 and Step 3)"
    variants:
      - name: full_price_no_credit
        when: "guardian.wallet_credit_cents == 0"
        difference: "wallet_applied_cents = 0; price_cents == discounted."
      - name: credit_offset
        when: "guardian.wallet_credit_cents > 0"
        difference: "wallet_applied_cents = min(credit, discounted); price reduced accordingly; wallet debited."

  # ---- (combinatorial mode (b): nested rounding order matters — block vs per-seat)
  - name: camp_block_quote
    trigger: "GET /sessions/{id}/quote with member_ids (read-only price preview for a multi-child CAMP enrollment block)"
    algorithm: aggregation
    formula: |
      # A guardian previews enrolling SEVERAL siblings into one CAMP session.
      # The order of rounding vs summing is PINNED to ROUND-PER-SEAT-THEN-SUM.
      #   per_seat[i] = enrollment_drop_in_price(member_i)   # each already rounded twice per its own steps
      #   block_total = sum(per_seat[i] for i in 1..N)       # SUM the already-rounded per-seat prices
      # The benchmark deliberately does NOT do sum-then-round: summing the raw
      # (pre-round) discounted amounts and rounding once at the end yields a
      # different cent total. round-per-seat-then-sum is authoritative.
      # sibling_index is assigned 1..N in member_ids order (first child index 1).
    input_set: "Up to N members supplied in member_ids, all on session.program_id; pricing identical to enrollment_drop_in_price but aggregated; wallet credit is NOT applied in the quote (preview only)."
    constants:
      MULTI_WEEK_THRESHOLD: 2
      MULTI_WEEK_DISCOUNT_PCT: 0.10
      SIBLING_DISCOUNT_PCT: 0.15
    precision: "integer cents; per-seat rounded first (round_half_up), then summed; NO final rounding of the sum"
    variants:
      - name: round_per_seat_then_sum
        when: "always (authoritative)"
        difference: "Each per-seat price rounded before summation; the sum is exact (integer cents) and is NOT re-rounded."

  # ---- (dual-variant on a DIFFERENT entity domain: membership cycle credit)
  - name: membership_cycle_unused_credit
    trigger: "POST /_billing/advance-cycle (cycle-advance sweep) for each ACTIVE membership"
    algorithm: forward_looking
    formula: |
      # Two valid interpretations of "unused session credit" at cycle rollover.
      # The benchmark PINS the prorated variant as authoritative; the flat variant
      # is the divergent alternative a naive implementation would produce.
      unused = max(0, membership.included_sessions_per_cycle - membership.sessions_used_this_cycle)
      per_session_value = monthly_fee_cents / max(1, included_sessions_per_cycle)   # not yet rounded
      # PINNED (prorated) variant:
      credit = round_half_up(unused * per_session_value)
      # Side effect: guardian.wallet_credit_cents += credit; then reset
      # sessions_used_this_cycle = 0 and cycle_index += 1.
    input_set: "Per ACTIVE membership at sweep time; PAUSED and CANCELLED memberships are skipped (no credit, no reset)."
    constants:
      MIN_CREDITABLE_UNUSED: 1
    precision: "integer cents; round_half_up once after multiplying unused * per_session_value"
    variants:
      - name: prorated_rollover_credit
        when: "authoritative"
        difference: "credit = round_half_up(unused * (monthly_fee_cents / included_sessions_per_cycle)) — proportional to UNUSED sessions only."
      - name: flat_full_refund
        when: "naive alternative (NOT used)"
        difference: "credit = monthly_fee_cents whenever any session is unused — ignores usage; produces a strictly larger credit. The PRD pins prorated_rollover_credit."

  # ---- (combinatorial mode (a) candidate also; weighted member progress score on a DIFFERENT entity)
  - name: member_progress_score
    trigger: "GET /members/{id}/progress (parent-portal progress read)"
    algorithm: weighted_scoring
    formula: |
      # >=3 inputs with non-linear interaction (min cap + conditional branch).
      belt_factor   = member.current_belt.rank / total_belts_in_program        # 0..1
      badge_factor  = min(1.0, active_badge_count / max(1, current_belt.required_badge_count))   # capped at 1.0
      attend_factor = attended_sessions / max(1, attended_sessions + no_show_sessions)           # 0..1, conditional on having any sessions
      # weights: belt 0.5, badges 0.3, attendance 0.2
      raw = belt_factor*W_BELT + badge_factor*W_BADGE + attend_factor*W_ATTEND
      progress_score = round_half_up(raw * 100)    # 0..100 integer
      # attended_sessions = count(Enrollment where member_id and attendance_status == ATTENDED)
      # no_show_sessions  = count(Enrollment where member_id and attendance_status == NO_SHOW)
    input_set: "Single member; aggregates the member's terminal-attendance Enrollments and current belt; badges counted only if Badge.status==ACTIVE and belt matches current belt."
    constants:
      W_BELT: 0.5
      W_BADGE: 0.3
      W_ATTEND: 0.2
    precision: "integer 0-100; round_half_up after weighting"
    variants:
      - name: no_sessions_yet
        when: "attended_sessions + no_show_sessions == 0"
        difference: "attend_factor defined as 0 (not 0/0); score reflects belt+badge only."

  # ---- session effective capacity (dual-constraint, threshold posture)
  - name: session_effective_capacity
    trigger: "computed on session open and re-evaluated on every enrollment create/cancel"
    algorithm: threshold
    formula: |
      device_cap     = center.device_count                       # total lab devices
      instructor_cap = session.assigned_instructor_count * center.min_student_instructor_ratio
      # device_seats_requested is per-seat demand; a seat consumes device_seats_requested devices,
      # so the device-bound seat count is floor(device_cap / device_seats_requested).
      device_seat_cap = floor(device_cap / session.device_seats_requested)
      effective_capacity = min(device_seat_cap, instructor_cap)
      # Posture thresholds (>= vs <, exact):
      #   confirmed_seat_count <  ceil(effective_capacity * 0.8)  -> OPEN
      #   ceil(effective_capacity*0.8) <= confirmed_seat_count < effective_capacity -> RESTRICTED
      #   confirmed_seat_count == effective_capacity              -> FULL
      #   a create that would push confirmed_seat_count > effective_capacity is rejected
    input_set: "Single session + its center; recomputed whenever confirmed_seat_count changes."
    constants:
      RESTRICTED_FRACTION: 0.8
    precision: "integer seats; floor on device division, ceil on the 0.8 restricted threshold"
    variants:
      - name: device_bound
        when: "device_seat_cap < instructor_cap"
        difference: "capacity limited by devices; adding instructors does not raise capacity."
      - name: instructor_bound
        when: "instructor_cap < device_seat_cap"
        difference: "capacity limited by staffing ratio; adding devices does not raise capacity."

# ===========================================================================
# §1.4 Validation Rules Table (ordered by priority)
# ===========================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role."
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Acting role is permitted for this operation per §1.7 RBAC."
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: auth
    check: "For Guardian-owned resources, X-User-ID equals the owning guardian_id (directly, or transitively via member.guardian_id / membership.member.guardian_id / enrollment.member.guardian_id)."
    error_id: ERR_NOT_RESOURCE_OWNER
    http_status: 403
    applies_to: "POST /enrollments, POST /enrollments/{id}/cancel, POST /memberships, POST /memberships/{id}/activate, POST /memberships/{id}/pause, POST /memberships/{id}/resume, POST /memberships/{id}/cancel, POST /members, GET /members/{id}/progress, POST /showcase-entries, POST /showcase-entries/{id}/withdraw"

  - priority: 4
    category: existence
    check: "Every path-referenced and body-referenced resource exists, validated left-to-right (Center, Program, BeltLevel, Badge, Guardian, Member, Membership, Session, Enrollment, Showcase, ShowcaseEntry)."
    error_id: ERR_RESOURCE_NOT_FOUND
    http_status: 404
    applies_to: "all"

  - priority: 5
    category: state
    check: "Target resource is in a state from which the requested transition is defined in §1.2."
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 6
    category: business_referential
    check: "Member.program_id equals Session.program_id on enrollment, and equals Showcase.program_id on showcase entry (the member must be on the session's/showcase's program)."
    error_id: ERR_PROGRAM_MISMATCH
    http_status: 409
    applies_to: "POST /enrollments, POST /showcase-entries"

  - priority: 7
    category: business_constraint
    check: "Member age in whole years at the logical clock falls within [program.min_age, program.max_age] (inclusive) for the session's program."
    error_id: ERR_AGE_OUT_OF_RANGE
    http_status: 409
    applies_to: "POST /enrollments"

  - priority: 8
    category: business_constraint
    check: "Member is not already enrolled in this session with a non-terminal attendance_status (RESERVED or CHECKED_IN)."
    error_id: ERR_DUPLICATE_ENROLLMENT
    http_status: 409
    applies_to: "POST /enrollments"

  - priority: 9
    category: business_temporal
    check: "On enrollment create, the target Session's half-open time interval [starts_at, ends_at) must not overlap the [starts_at, ends_at) interval of ANY other Session in which this member holds a non-terminal enrollment (RESERVED/CHECKED_IN). Adjacency is allowed: two sessions where one's ends_at == the other's starts_at do NOT conflict (half-open, end-exclusive). This is a member self-scheduling clash on Session intervals."
    error_id: ERR_MEMBER_SCHEDULE_CONFLICT
    http_status: 409
    applies_to: "POST /enrollments"

  - priority: 10
    category: business_temporal
    check: "On showcase entry submit, the Showcase's buffered interval [starts_at - SHOWCASE_BUFFER_MINUTES, starts_at + SHOWCASE_BUFFER_MINUTES] (CLOSED both ends, a symmetric buffer around the showcase start instant; SHOWCASE_BUFFER_MINUTES = 120) must not contain the starts_at of ANY Session in which the member holds a non-terminal enrollment. Unlike the half-open member-schedule rule, this clash uses a closed buffered window around a single point (the showcase start) rather than two half-open intervals."
    error_id: ERR_SHOWCASE_SESSION_CLASH
    http_status: 409
    applies_to: "POST /showcase-entries"

  - priority: 11
    category: business_temporal
    check: "ShowcaseEntry submitted at or before showcase.entry_deadline_at (inclusive); after the deadline instant it is rejected."
    error_id: ERR_ENTRY_DEADLINE_PASSED
    http_status: 409
    applies_to: "POST /showcase-entries"

  - priority: 12
    category: business_constraint
    check: "Member's current belt rank >= showcase.min_belt_rank on entry accept."
    error_id: ERR_BELT_TOO_LOW
    http_status: 409
    applies_to: "POST /showcase-entries/{id}/accept"

  - priority: 13
    category: business_constraint
    check: "Promotion target belt = the rank+1 belt in the member's program; member's active_badge_count for the CURRENT belt must be >= current_belt.required_badge_count, and the member must currently hold the prerequisite belt (rank order)."
    error_id: ERR_PROMOTION_REQUIREMENTS_NOT_MET
    http_status: 409
    applies_to: "POST /members/{id}/promote"

  - priority: 14
    category: business_constraint
    check: "Sibling_index supplied on enrollment must equal 1 + the count of the SAME guardian's other children already holding a non-terminal enrollment in THIS session (no gaps, no duplicates)."
    error_id: ERR_INVALID_SIBLING_INDEX
    http_status: 409
    applies_to: "POST /enrollments"

  - priority: 15
    category: business_constraint
    check: "For MEMBERSHIP coverage: the member has an ACTIVE membership with sessions_used_this_cycle < included_sessions_per_cycle (an included seat remains)."
    error_id: ERR_NO_INCLUDED_SESSIONS
    http_status: 409
    applies_to: "POST /enrollments"

  - priority: 16
    category: business_safety
    check: "Enrollment create would not push session.confirmed_seat_count above session_effective_capacity (seat/device/instructor capacity)."
    error_id: ERR_SESSION_AT_CAPACITY
    http_status: 409
    applies_to: "POST /enrollments"

  - priority: 17
    category: business_safety
    check: "Showcase entry accept would not push accepted_entry_count above showcase.capacity."
    error_id: ERR_SHOWCASE_AT_CAPACITY
    http_status: 409
    applies_to: "POST /showcase-entries/{id}/accept"

  - priority: 18
    category: business_constraint
    check: "OCC: expected_<parent>_version matches the current parent version (Session for enrollment create, Showcase for entry accept)."
    error_id: ERR_STALE_SESSION_VERSION
    http_status: 412
    applies_to: "POST /enrollments, POST /showcase-entries/{id}/accept"

  - priority: 19
    category: business_constraint
    check: "Field-level shape: required fields present, enums valid, numbers in declared range, ends_at > starts_at, week_count==1 unless CAMP, entry_deadline_at < starts_at."
    error_id: ERR_INVALID_FIELD
    http_status: 422
    applies_to: "all create/update endpoints"

# ===========================================================================
# §1.5 API Endpoint Table
# ===========================================================================
endpoints:

  # ---- Configuration: Center / Program / BeltLevel / Badge ----
  - method: POST
    path: "/centers"
    description: "Create a center with device inventory and instructor ratio."
    roles: [CenterAdmin]
    code: 201
    input: [name, device_count, min_student_instructor_ratio, "timezone?"]
    output: Center
    side_effects: []

  - method: GET
    path: "/centers/{id}"
    description: "Fetch a center."
    roles: [CenterAdmin, Instructor, Guardian]
    code: 200
    input: []
    output: Center
    side_effects: []

  - method: POST
    path: "/programs"
    description: "Create a program/track with age range and base drop-in fee."
    roles: [CenterAdmin]
    code: 201
    input: [name, code, min_age, max_age, drop_in_fee_cents]
    output: Program
    side_effects: []

  - method: GET
    path: "/programs/{id}"
    description: "Fetch a program."
    roles: [CenterAdmin, Instructor, Guardian]
    code: 200
    input: []
    output: Program
    side_effects: []

  - method: POST
    path: "/belt-levels"
    description: "Create a belt level within a program; prereq_belt_level_id null only for rank 1."
    roles: [CenterAdmin]
    code: 201
    input: [program_id, name, rank, "prereq_belt_level_id?", required_badge_count]
    output: BeltLevel
    side_effects: []

  - method: GET
    path: "/belt-levels/{id}"
    description: "Fetch a belt level."
    roles: [CenterAdmin, Instructor, Guardian]
    code: 200
    input: []
    output: BeltLevel
    side_effects: []

  - method: GET
    path: "/belt-levels"
    description: "List belt levels; filter by program_id or prereq_belt_level_id."
    roles: [CenterAdmin, Instructor, Guardian]
    code: 200
    input: ["program_id?", "prereq_belt_level_id?", "limit?", "offset?"]
    output: BeltLevel[]
    side_effects: []

  - method: POST
    path: "/badges"
    description: "Create a curriculum badge tied to a belt level."
    roles: [CenterAdmin]
    code: 201
    input: [belt_level_id, name]
    output: Badge
    side_effects: []

  - method: GET
    path: "/badges/{id}"
    description: "Fetch a badge."
    roles: [CenterAdmin, Instructor, Guardian]
    code: 200
    input: []
    output: Badge
    side_effects: []

  - method: GET
    path: "/badges"
    description: "List badges; filter by belt_level_id."
    roles: [CenterAdmin, Instructor, Guardian]
    code: 200
    input: ["belt_level_id?", "limit?", "offset?"]
    output: Badge[]
    side_effects: []

  - method: POST
    path: "/badges/{id}/retire"
    description: "Retire a badge; recomputes active_badge_count on affected members."
    roles: [CenterAdmin]
    code: 200
    input: []
    output: Badge
    side_effects:
      - "badge.status becomes RETIRED"
      - "for every member with an ACTIVE BadgeAward of this badge on their current belt: recompute active_badge_count (cascade to member)"
      - "increments Badge.version by 1"

  # ---- Guardian / Member ----
  - method: POST
    path: "/guardians"
    description: "Register a guardian (parent)."
    roles: [CenterAdmin, Guardian]
    code: 201
    input: [full_name, email]
    output: Guardian
    side_effects: []

  - method: GET
    path: "/guardians/{id}"
    description: "Fetch a guardian (includes wallet_credit_cents)."
    roles: [CenterAdmin, Guardian]
    code: 200
    input: []
    output: Guardian
    side_effects: []

  - method: POST
    path: "/guardians/{id}/wallet/adjustments"
    description: "Admin credit/debit of a guardian wallet (e.g., goodwill credit, correction). Positive amount credits; negative debits but cannot drive below 0."
    roles: [CenterAdmin]
    code: 200
    input: [amount_cents, reason]
    output: Guardian
    side_effects:
      - "guardian.wallet_credit_cents += amount_cents (clamped at 0 floor)"
      - "increments Guardian.version by 1"

  - method: POST
    path: "/members"
    description: "Create a child member; current_belt_level_id auto-set to the program's rank-1 belt."
    roles: [CenterAdmin, Guardian]
    code: 201
    input: [guardian_id, program_id, full_name, birth_date]
    output: Member
    side_effects:
      - "current_belt_level_id set to rank-1 BeltLevel of program_id"
      - "active_badge_count initialized to 0"

  - method: GET
    path: "/members/{id}"
    description: "Fetch a member."
    roles: [CenterAdmin, Instructor, Guardian]
    code: 200
    input: []
    output: Member
    side_effects: []

  - method: GET
    path: "/members"
    description: "List members; filter by guardian_id, program_id, or current_belt_level_id."
    roles: [CenterAdmin, Instructor, Guardian]
    code: 200
    input: ["guardian_id?", "program_id?", "current_belt_level_id?", "limit?", "offset?"]
    output: Member[]
    side_effects: []

  - method: GET
    path: "/members/{id}/progress"
    description: "Parent-portal progress read; returns member_progress_score plus belt/badge/attendance breakdown."
    roles: [CenterAdmin, Instructor, Guardian]
    code: 200
    input: []
    output: Member
    side_effects:
      - "computes member_progress_score (read-only; persists active_badge_count reconciliation if stale)"

  - method: POST
    path: "/members/{id}/promote"
    description: "Promote a member to the next belt if badge/prerequisite requirements are met."
    roles: [CenterAdmin, Instructor]
    code: 200
    input: []
    output: Member
    side_effects:
      - "current_belt_level_id advances to rank+1 belt of program"
      - "active_badge_count recomputed for the new current belt (resets relative to new belt)"
      - "increments Member.version by 1"

  # ---- Membership ----
  - method: POST
    path: "/memberships"
    description: "Create a PENDING membership for a member."
    roles: [CenterAdmin, Guardian]
    code: 201
    input: [member_id, monthly_fee_cents, included_sessions_per_cycle]
    output: Membership
    side_effects: []

  - method: GET
    path: "/memberships/{id}"
    description: "Fetch a membership."
    roles: [CenterAdmin, Guardian]
    code: 200
    input: []
    output: Membership
    side_effects: []

  - method: GET
    path: "/memberships"
    description: "List memberships; filter by member_id."
    roles: [CenterAdmin, Guardian]
    code: 200
    input: ["member_id?", "limit?", "offset?"]
    output: Membership[]
    side_effects: []

  - method: POST
    path: "/memberships/{id}/activate"
    description: "Activate a PENDING membership."
    roles: [CenterAdmin, Guardian]
    code: 200
    input: []
    output: Membership
    side_effects:
      - "status PENDING->ACTIVE; sessions_used_this_cycle=0; cycle_index=0"
      - "increments Membership.version by 1"

  - method: POST
    path: "/memberships/{id}/pause"
    description: "Pause an ACTIVE membership."
    roles: [CenterAdmin, Guardian]
    code: 200
    input: []
    output: Membership
    side_effects:
      - "status ACTIVE->PAUSED"
      - "increments Membership.version by 1"

  - method: POST
    path: "/memberships/{id}/resume"
    description: "Resume a PAUSED membership."
    roles: [CenterAdmin, Guardian]
    code: 200
    input: []
    output: Membership
    side_effects:
      - "status PAUSED->ACTIVE (sessions_used_this_cycle preserved)"
      - "increments Membership.version by 1"

  - method: POST
    path: "/memberships/{id}/cancel"
    description: "Cancel an ACTIVE or PAUSED membership."
    roles: [CenterAdmin, Guardian]
    code: 200
    input: []
    output: Membership
    side_effects:
      - "status ->CANCELLED"
      - "increments Membership.version by 1"

  # ---- Session ----
  - method: POST
    path: "/sessions"
    description: "Create a DRAFT session at a center for a program."
    roles: [CenterAdmin]
    code: 201
    input: [center_id, program_id, format, week_count, starts_at, ends_at, device_seats_requested, assigned_instructor_count]
    output: Session
    side_effects: []

  - method: GET
    path: "/sessions/{id}"
    description: "Fetch a session (includes confirmed_seat_count and derived posture)."
    roles: [CenterAdmin, Instructor, Guardian]
    code: 200
    input: []
    output: Session
    side_effects: []

  - method: GET
    path: "/sessions"
    description: "List sessions; filter by center_id, program_id, or status."
    roles: [CenterAdmin, Instructor, Guardian]
    code: 200
    input: ["center_id?", "program_id?", "status?", "limit?", "offset?"]
    output: Session[]
    side_effects: []

  - method: GET
    path: "/sessions/{id}/quote"
    description: "Read-only multi-child CAMP price preview using camp_block_quote (round-per-seat-then-sum)."
    roles: [CenterAdmin, Guardian]
    code: 200
    input: [member_ids]
    output: Session
    side_effects:
      - "computes camp_block_quote; returns block_total_cents and per_seat breakdown (no persistence)"

  - method: POST
    path: "/sessions/{id}/open"
    description: "Open a DRAFT session for enrollment."
    roles: [CenterAdmin]
    code: 200
    input: []
    output: Session
    side_effects:
      - "status DRAFT->OPEN; confirmed_seat_count=0; effective_capacity computed"
      - "increments Session.version by 1"

  - method: POST
    path: "/sessions/{id}/complete"
    description: "Complete a session after its end instant; settles attendance and forfeits no-shows."
    roles: [CenterAdmin]
    code: 200
    input: []
    output: Session
    side_effects:
      - "CHECKED_IN enrollments -> ATTENDED; RESERVED enrollments -> NO_SHOW (FORFEIT if CHARGED)"
      - "increments Session.version by 1"

  - method: POST
    path: "/sessions/{id}/cancel"
    description: "Cancel a session; full-refunds all non-terminal enrollments."
    roles: [CenterAdmin]
    code: 200
    input: []
    output: Session
    side_effects:
      - "non-terminal enrollments CANCELLED with full refund (DROP_IN -> wallet credit; MEMBERSHIP -> seat returned)"
      - "increments Session.version by 1"

  # ---- Enrollment ----
  - method: POST
    path: "/enrollments"
    description: "Enroll a member in a session (drop-in or membership). OCC-guarded on Session.version."
    roles: [CenterAdmin, Guardian]
    code: 201
    input: [session_id, member_id, coverage, "sibling_index?", expected_session_version]
    output: Enrollment
    side_effects:
      - "DROP_IN: compute enrollment_drop_in_price (multi-week, sibling, wallet); set price_cents, wallet_applied_cents; billing_status CHARGED; debit guardian.wallet_credit_cents"
      - "MEMBERSHIP: membership.sessions_used_this_cycle += 1; price_cents=0; billing_status COVERED"
      - "session.confirmed_seat_count += 1; posture re-derived (OPEN->RESTRICTED->FULL)"
      - "increments Session.version by 1"

  - method: GET
    path: "/enrollments/{id}"
    description: "Fetch an enrollment (both attendance_status and billing_status)."
    roles: [CenterAdmin, Instructor, Guardian]
    code: 200
    input: []
    output: Enrollment
    side_effects: []

  - method: GET
    path: "/enrollments"
    description: "List enrollments; filter by session_id or member_id."
    roles: [CenterAdmin, Instructor, Guardian]
    code: 200
    input: ["session_id?", "member_id?", "limit?", "offset?"]
    output: Enrollment[]
    side_effects: []

  - method: POST
    path: "/enrollments/{id}/check-in"
    description: "Instructor checks a reserved enrollment in (attendance axis only)."
    roles: [Instructor, CenterAdmin]
    code: 200
    input: []
    output: Enrollment
    side_effects:
      - "attendance_status RESERVED->CHECKED_IN"
      - "increments Enrollment.version by 1"

  - method: POST
    path: "/enrollments/{id}/cancel"
    description: "Guardian cancels an enrollment; refund depends on 24h window and coverage."
    roles: [Guardian, CenterAdmin]
    code: 200
    input: []
    output: Enrollment
    side_effects:
      - "attendance_status ->CANCELLED; billing refund/forfeit per 24h window and coverage"
      - "session.confirmed_seat_count -= 1; posture re-derived (FULL->RESTRICTED->OPEN)"
      - "increments Enrollment.version by 1"

  # ---- BadgeAward ----
  - method: POST
    path: "/badge-awards"
    description: "Instructor awards a badge to a member via an enrollment; recomputes member.active_badge_count."
    roles: [Instructor, CenterAdmin]
    code: 201
    input: [enrollment_id, badge_id]
    output: BadgeAward
    side_effects:
      - "member.active_badge_count recomputed (cascade: BadgeAward create -> member.active_badge_count -> may unblock promotion)"
      - "increments Member.version by 1"

  - method: GET
    path: "/badge-awards/{id}"
    description: "Fetch a badge award."
    roles: [CenterAdmin, Instructor, Guardian]
    code: 200
    input: []
    output: BadgeAward
    side_effects: []

  - method: GET
    path: "/badge-awards"
    description: "List badge awards; filter by enrollment_id or badge_id."
    roles: [CenterAdmin, Instructor, Guardian]
    code: 200
    input: ["enrollment_id?", "badge_id?", "limit?", "offset?"]
    output: BadgeAward[]
    side_effects: []

  - method: POST
    path: "/badge-awards/{id}/revoke"
    description: "Revoke a badge award; recomputes member.active_badge_count."
    roles: [Instructor, CenterAdmin]
    code: 200
    input: []
    output: BadgeAward
    side_effects:
      - "status ACTIVE->REVOKED; member.active_badge_count recomputed (cascade to member)"
      - "increments BadgeAward.version by 1"

  # ---- Showcase / ShowcaseEntry ----
  - method: POST
    path: "/showcases"
    description: "Create a DRAFT showcase/competition."
    roles: [CenterAdmin]
    code: 201
    input: [center_id, program_id, min_belt_rank, capacity, starts_at, entry_deadline_at]
    output: Showcase
    side_effects: []

  - method: GET
    path: "/showcases/{id}"
    description: "Fetch a showcase."
    roles: [CenterAdmin, Instructor, Guardian]
    code: 200
    input: []
    output: Showcase
    side_effects: []

  - method: GET
    path: "/showcases"
    description: "List showcases; filter by center_id or program_id or status."
    roles: [CenterAdmin, Instructor, Guardian]
    code: 200
    input: ["center_id?", "program_id?", "status?", "limit?", "offset?"]
    output: Showcase[]
    side_effects: []

  - method: POST
    path: "/showcases/{id}/open"
    description: "Open a showcase for entries."
    roles: [CenterAdmin]
    code: 200
    input: []
    output: Showcase
    side_effects:
      - "status DRAFT->OPEN"
      - "increments Showcase.version by 1"

  - method: POST
    path: "/showcases/{id}/close-entries"
    description: "Close entries after the deadline; sweep un-accepted SUBMITTED entries to REJECTED; ->JUDGING."
    roles: [CenterAdmin]
    code: 200
    input: []
    output: Showcase
    side_effects:
      - "SUBMITTED entries -> REJECTED; status OPEN->JUDGING"
      - "increments Showcase.version by 1"

  - method: POST
    path: "/showcases/{id}/post-results"
    description: "Post results: assign ranks to SCORED entries; ->COMPLETED."
    roles: [CenterAdmin]
    code: 200
    input: []
    output: Showcase
    side_effects:
      - "ranks assigned (score DESC, created_at ASC); status JUDGING->COMPLETED"
      - "increments Showcase.version by 1"

  - method: POST
    path: "/showcases/{id}/cancel"
    description: "Cancel a showcase; withdraw all non-terminal entries."
    roles: [CenterAdmin]
    code: 200
    input: []
    output: Showcase
    side_effects:
      - "non-terminal entries -> WITHDRAWN; accepted_entry_count=0"
      - "increments Showcase.version by 1"

  - method: POST
    path: "/showcase-entries"
    description: "Submit a member into a showcase (before the deadline)."
    roles: [CenterAdmin, Guardian]
    code: 201
    input: [showcase_id, member_id]
    output: ShowcaseEntry
    side_effects: []

  - method: GET
    path: "/showcase-entries/{id}"
    description: "Fetch a showcase entry."
    roles: [CenterAdmin, Instructor, Guardian]
    code: 200
    input: []
    output: ShowcaseEntry
    side_effects: []

  - method: GET
    path: "/showcase-entries"
    description: "List entries; filter by showcase_id or member_id."
    roles: [CenterAdmin, Instructor, Guardian]
    code: 200
    input: ["showcase_id?", "member_id?", "limit?", "offset?"]
    output: ShowcaseEntry[]
    side_effects: []

  - method: POST
    path: "/showcase-entries/{id}/accept"
    description: "Accept a SUBMITTED entry (belt + capacity gated). OCC-guarded on Showcase.version."
    roles: [CenterAdmin]
    code: 200
    input: [expected_showcase_version]
    output: ShowcaseEntry
    side_effects:
      - "status SUBMITTED->ACCEPTED; showcase.accepted_entry_count += 1"
      - "increments Showcase.version by 1"

  - method: POST
    path: "/showcase-entries/{id}/reject"
    description: "Reject a SUBMITTED entry (no capacity effect)."
    roles: [CenterAdmin]
    code: 200
    input: []
    output: ShowcaseEntry
    side_effects:
      - "status SUBMITTED->REJECTED"
      - "increments ShowcaseEntry.version by 1"

  - method: POST
    path: "/showcase-entries/{id}/score"
    description: "Score an ACCEPTED entry during JUDGING."
    roles: [CenterAdmin]
    code: 200
    input: [score]
    output: ShowcaseEntry
    side_effects:
      - "status ACCEPTED->SCORED; entry.score set"
      - "increments ShowcaseEntry.version by 1"

  - method: POST
    path: "/showcase-entries/{id}/withdraw"
    description: "Guardian withdraws an ACCEPTED entry (frees a slot)."
    roles: [Guardian, CenterAdmin]
    code: 200
    input: []
    output: ShowcaseEntry
    side_effects:
      - "status ACCEPTED->WITHDRAWN; showcase.accepted_entry_count -= 1"
      - "increments ShowcaseEntry.version by 1"

  # ---- Test-driving endpoints (/_ namespace) ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock. Server startup default is fixed at 2026-04-01T00:00:00Z; before any set call the clock reads exactly this default (never real wall-clock). Used for age, 24h-window, deadline, and session-end determinism."
    roles: [CenterAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects:
      - "logical clock set to to_iso8601 for all subsequent now() reads"

  - method: POST
    path: "/_billing/advance-cycle"
    description: "Advance the billing cycle for ACTIVE memberships: credit prorated unused sessions to guardian wallets, reset usage, increment cycle_index. Test-driving + real-world admin sweep."
    roles: [CenterAdmin]
    code: 200
    input: ["member_id?"]
    output: null
    side_effects:
      - "for each ACTIVE membership (optionally filtered by member_id): membership_cycle_unused_credit -> guardian.wallet_credit_cents; sessions_used_this_cycle=0; cycle_index += 1"
      - "PAUSED/CANCELLED memberships skipped"

# ===========================================================================
# §1.6 Error Code Catalog
# ===========================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing/invalid X-User-Role or X-User-ID headers, or unknown role."
  - id: ERR_FORBIDDEN_ROLE
    http: 403
    condition: "Acting role is not permitted for this operation."
  - id: ERR_NOT_RESOURCE_OWNER
    http: 403
    condition: "Guardian acting on a resource it does not own (guardian_id mismatch directly or transitively)."
  - id: ERR_RESOURCE_NOT_FOUND
    http: 404
    condition: "A path- or body-referenced resource does not exist."
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Requested transition is not defined from the target resource's current state."
  - id: ERR_PROGRAM_MISMATCH
    http: 409
    condition: "Member.program_id != Session.program_id (enroll) or != Showcase.program_id (entry)."
  - id: ERR_AGE_OUT_OF_RANGE
    http: 409
    condition: "Member age in whole years outside [program.min_age, program.max_age]."
  - id: ERR_DUPLICATE_ENROLLMENT
    http: 409
    condition: "Member already has a non-terminal enrollment (RESERVED/CHECKED_IN) in this session."
  - id: ERR_MEMBER_SCHEDULE_CONFLICT
    http: 409
    condition: "Target session's half-open [starts_at, ends_at) interval overlaps another non-terminal enrollment's session interval for this member (adjacency allowed)."
  - id: ERR_SHOWCASE_SESSION_CLASH
    http: 409
    condition: "Showcase start falls within +/- SHOWCASE_BUFFER_MINUTES of a session start the member is enrolled in (closed buffered window)."
  - id: ERR_ENTRY_DEADLINE_PASSED
    http: 409
    condition: "Showcase entry submitted after showcase.entry_deadline_at."
  - id: ERR_BELT_TOO_LOW
    http: 409
    condition: "Member current belt rank below showcase.min_belt_rank on accept."
  - id: ERR_PROMOTION_REQUIREMENTS_NOT_MET
    http: 409
    condition: "active_badge_count < current_belt.required_badge_count, no next belt exists, or prerequisite belt not held."
  - id: ERR_INVALID_SIBLING_INDEX
    http: 409
    condition: "sibling_index != 1 + count of guardian's other non-terminal enrollments in this session."
  - id: ERR_NO_INCLUDED_SESSIONS
    http: 409
    condition: "MEMBERSHIP coverage requested but no ACTIVE membership with a remaining included session."
  - id: ERR_SESSION_AT_CAPACITY
    http: 409
    condition: "Enrollment would push confirmed_seat_count above session_effective_capacity."
  - id: ERR_SHOWCASE_AT_CAPACITY
    http: 409
    condition: "Entry accept would push accepted_entry_count above showcase.capacity."
  - id: ERR_STALE_SESSION_VERSION
    http: 412
    condition: "expected_session_version != current Session.version on enrollment create (OCC)."
  - id: ERR_STALE_SHOWCASE_VERSION
    http: 412
    condition: "expected_showcase_version != current Showcase.version on entry accept (OCC)."
  - id: ERR_INVALID_FIELD
    http: 422
    condition: "Missing required field, bad enum, out-of-range number, ends_at<=starts_at, week_count!=1 for non-CAMP, entry_deadline_at>=starts_at, score out of 0-100."
  - id: ERR_WALLET_INSUFFICIENT
    http: 409
    condition: "Wallet adjustment debit (negative amount) larger than current balance would drive wallet below 0."
  - id: ERR_SESSION_NOT_ENDED
    http: 409
    condition: "Session complete attempted before logical clock reaches session.ends_at."
  - id: ERR_DEADLINE_NOT_REACHED
    http: 409
    condition: "Showcase close-entries attempted before logical clock passes entry_deadline_at."
  - id: ERR_UNSCORED_ENTRIES_REMAIN
    http: 409
    condition: "post-results attempted while an ACCEPTED entry is not yet SCORED."

# ===========================================================================
# §1.7 RBAC Matrix
# ===========================================================================
roles:
  - name: CenterAdmin
    description: "Operations staff: configures centers/programs/belts/badges, runs sessions and showcases, runs billing sweeps and clock. Superset for CONFIGURATION and lifecycle, not a blanket override of Guardian-owned billing decisions."
    identity: "opaque"
    exclusive_operations:
      - "create/configure Center, Program, BeltLevel, Badge; retire Badge"
      - "create/open/complete/cancel Session"
      - "create/open/close-entries/post-results/cancel Showcase"
      - "accept/reject/score ShowcaseEntry"
      - "guardian wallet adjustments"
      - "advance billing cycle; set logical clock"
    shared_operations:
      - "create Guardian/Member/Membership (shared with Guardian)"
      - "membership activate/pause/resume/cancel (shared with Guardian)"
      - "create Enrollment; cancel Enrollment (shared with Guardian)"
      - "check-in Enrollment; promote Member (shared with Instructor)"
      - "award/revoke BadgeAward (shared with Instructor)"
      - "all GET reads"

  - name: Instructor
    description: "Teaching staff: records attendance, awards/revokes badges, promotes members on assigned sessions."
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "check-in Enrollment (shared with CenterAdmin)"
      - "award/revoke BadgeAward (shared with CenterAdmin)"
      - "promote Member (shared with CenterAdmin)"
      - "GET reads on centers/programs/belts/badges/members/sessions/enrollments/badge-awards/showcases/showcase-entries"

  - name: Guardian
    description: "Parent: owns their members, memberships, enrollments, and showcase entries; manages enrollment and membership lifecycle for their own children."
    identity: "entity_backed:Guardian"
    exclusive_operations:
      - "withdraw own ShowcaseEntry"
    shared_operations:
      - "create Guardian/Member/Membership (shared with CenterAdmin)"
      - "membership activate/pause/resume/cancel (shared with CenterAdmin)"
      - "create Enrollment; cancel own Enrollment (shared with CenterAdmin)"
      - "create ShowcaseEntry (shared with CenterAdmin)"
      - "GET reads on own resources + public config (centers/programs/belts/badges/sessions/showcases)"
