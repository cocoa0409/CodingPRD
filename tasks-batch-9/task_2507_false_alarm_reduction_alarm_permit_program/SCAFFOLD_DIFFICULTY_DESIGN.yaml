            - {call: "POST /false-alarm-program/alarm-systems", payload: {alarm_site_id: "${site_cap}", monitoring_company_id: "${company_cap}", system_type: "BURGLARY", zone_count: 20, ecv_enabled: true, verified_response_mode: "NONE", installed_at: "2026-01-05T00:00:00Z"}, as: ProgramAdministrator, captures: {sys_k1: $.data.id}}
