        distinguishing_aspect: |
          set-maintenance is blocked while the line hosts a SCHEDULED run;
          scheduling onto a MAINTENANCE line is blocked; after cancel +
          set-active the same schedule call succeeds — the line guard is
          symmetric in both directions.
        test_recipe:
