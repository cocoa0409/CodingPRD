          - errors.ERR_ASSESSMENT_REMAND_LIMIT_EXCEEDED
          - constants.MAX_ASSESSMENT_REMANDS
        distinguishing_aspect: "MAX_ASSESSMENT_REMANDS is a ceiling on the FIELD_REVIEW -> DRAFT cycle only: the first two remands succeed, the third is HTTP 409 ERR_ASSESSMENT_REMAND_LIMIT_EXCEEDED, and the row is left in FIELD_REVIEW where a CONCUR still finalizes it. The ceiling never blocks CONCUR."
        test_recipe:
          setup:
