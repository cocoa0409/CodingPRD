  # ===========================================================================
  # Rule 4 — transitive_cascade (2 instances, different triggers; depth 3 and 2)
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: close_period_lapse_cascade_three_links
        grounds:
          - state_machines.QueryLetter.REQUESTED_to_LAPSED
          - state_machines.Manuscript
          - "endpoints: POST /agencies/{agencyId}/close-period"
        distinguishing_aspect: |
          Depth-3 chain triggered by close-period: (1) Agency.period_index
          increments (Agency mutation); (2) the period advance causes the lapse
          sweep to flip the stale QueryLetter REQUESTED -> LAPSED; (3) the lapse
          itself causes the linked Manuscript -> DECLINED. Each link is caused
          by the previous link, not by close-period directly.
        test_recipe:
          setup:
            - "Agency at period 0; query assigned and manuscript requested at period 0 (requested_period_index == 0); manuscript never evaluated (stays READER_ASSIGNED)"
          setup_api_calls:
            - { call: "POST /agencies", payload: { name: "Agency LP", commission_pct: 0.15, slush_capacity: 50 }, as: AgencyAdmin, as_user_id: "admin-1", captures: { ag: $.data.id } }
            - { call: "POST /agents", payload: { agency_id: "${ag}", display_name: "Agent One", email: "a1@x.com" }, as: AgencyAdmin, as_user_id: "admin-1", captures: { agent1: $.data.id } }
            - { call: "POST /authors", payload: { agency_id: "${ag}", display_name: "Author One", email: "au1@x.com" }, as: AgencyAdmin, as_user_id: "admin-1", captures: { author1: $.data.id } }
            - { call: "POST /query-letters", payload: { author_id: "${author1}", genre: "YA", word_count: 80000 }, as: Agent, as_user_id: "${agent1}", captures: { q1: $.data.id } }
            - { call: "POST /query-letters/${q1}/assign", payload: { agent_id: "${agent1}" }, as: Agent, as_user_id: "${agent1}" }
            - { call: "POST /query-letters/${q1}/request-manuscript", payload: { title: "Stale Book" }, as: Agent, as_user_id: "${agent1}", captures: { ms1: $.data.id } }
            - { call: "POST /manuscripts/${ms1}/assign-reader", payload: { agent_id: "${agent1}" }, as: Agent, as_user_id: "${agent1}" }
          trigger:
            - { call: "POST /agencies/${ag}/close-period", payload: {}, as: AgencyAdmin, as_user_id: "admin-1", captures: { p1: $.data.period_index } }
            - { call: "GET /query-letters/${q1}", payload: {}, as: Agent, as_user_id: "${agent1}", captures: { qstat1: $.data.status } }
            - { call: "POST /agencies/${ag}/close-period", payload: {}, as: AgencyAdmin, as_user_id: "admin-1", captures: { p2: $.data.period_index } }
            - { call: "GET /query-letters/${q1}", payload: {}, as: Agent, as_user_id: "${agent1}", captures: { qstat2: $.data.status } }
            - { call: "GET /manuscripts/${ms1}", payload: {}, as: Agent, as_user_id: "${agent1}", captures: { mstat2: $.data.status } }
          assert:
            - "${p1} == 1 and ${qstat1} == REQUESTED   # closing period 0: requested_period_index 0 <= -1 is false, no lapse yet"
            - "${p2} == 2 and ${qstat2} == LAPSED      # closing period 1: 0 <= 0 triggers the sweep"
            - "${mstat2} == DECLINED   # link 3: caused by the lapse, not by close-period directly"

      - name: offer_accept_award_cascade_supersede_then_pass
        grounds:
          - state_machines.Offer.RECEIVED_to_ACCEPTED
          - state_machines.Offer.RECEIVED_to_SUPERSEDED
          - state_machines.Submission.OFFER_EXTENDED_to_PASSED
        distinguishing_aspect: |
          Depth-2 chain from a DIFFERENT trigger (offer accept, not
          close-period): (1) accepting offer O1 causes losing offer O2 RECEIVED
          -> SUPERSEDED; (2) O2's supersession — not the accept itself — causes
          O2's parent Submission S2 OFFER_EXTENDED -> PASSED per the Submission
          machine's cascade edge. The winner's submission stays OFFER_EXTENDED
          until deal execute, proving the chain is per-offer, not a blanket
          fan-out.
        test_recipe:
          setup:
            - "Signed pipeline; round open (non-auction); submissions S1 (ed1) and S2 (ed2) both SENT; offers O1 on S1 (advance 300000, pcts 0.10/0.08/0.25) and O2 on S2 (advance 250000, same pcts), both RECEIVED; both submissions OFFER_EXTENDED"
          setup_api_calls:
            - { call: "POST /agencies", payload: { name: "Agency AC", commission_pct: 0.15, slush_capacity: 50 }, as: AgencyAdmin, as_user_id: "admin-1", captures: { ag: $.data.id } }
            - { call: "POST /agents", payload: { agency_id: "${ag}", display_name: "Agent One", email: "a1@x.com" }, as: AgencyAdmin, as_user_id: "admin-1", captures: { agent1: $.data.id } }
            - { call: "POST /authors", payload: { agency_id: "${ag}", display_name: "Author One", email: "au1@x.com" }, as: AgencyAdmin, as_user_id: "admin-1", captures: { author1: $.data.id } }
            - { call: "POST /editors", payload: { agency_id: "${ag}", display_name: "Ed A", imprint: "IA", email: "eda@x.com" }, as: AgencyAdmin, as_user_id: "admin-1", captures: { ed1: $.data.id } }
            - { call: "POST /editors", payload: { agency_id: "${ag}", display_name: "Ed B", imprint: "IB", email: "edb@x.com" }, as: AgencyAdmin, as_user_id: "admin-1", captures: { ed2: $.data.id } }
            - { call: "POST /query-letters", payload: { author_id: "${author1}", genre: "FICTION", word_count: 90000 }, as: Agent, as_user_id: "${agent1}", captures: { q1: $.data.id } }
            - { call: "POST /query-letters/${q1}/assign", payload: { agent_id: "${agent1}" }, as: Agent, as_user_id: "${agent1}" }
            - { call: "POST /query-letters/${q1}/request-manuscript", payload: { title: "Auction Book" }, as: Agent, as_user_id: "${agent1}", captures: { ms1: $.data.id } }
            - { call: "POST /manuscripts/${ms1}/assign-reader", payload: { agent_id: "${agent1}" }, as: Agent, as_user_id: "${agent1}" }
            - { call: "POST /manuscripts/${ms1}/evaluate", payload: { eval_score: 80 }, as: Agent, as_user_id: "${agent1}" }
            - { call: "POST /manuscripts/${ms1}/accept", payload: {}, as: Agent, as_user_id: "${agent1}" }
