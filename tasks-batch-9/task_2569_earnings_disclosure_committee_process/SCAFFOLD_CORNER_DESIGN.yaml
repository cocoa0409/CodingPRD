          - state_machines.Filing.SUBMITTED_to_AMENDED_SUPERSEDED
          - state_machines.ReportingCycle.FILED_to_AMENDED
          - state_machines.DraftDocument.APPROVED_to_FILED
          - validations[priority=13]
          - validations[priority=37]
        distinguishing_aspect: |
          The accession suffix is a count of prior Filing rows ordered by created_at ASC, never by id, so
          the amending filing must read FORM_10Q-FY2026-Q2-2 while the original keeps
          FORM_10Q-FY2026-Q2-1 even though both are built from the same cycle fields. The chain also
          proves the amendment path is actually reachable: a second PERIODIC_FILING document is drafted,
