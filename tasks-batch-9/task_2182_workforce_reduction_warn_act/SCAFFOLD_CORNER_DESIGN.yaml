      - name: error_owbpa_disclosure_stale_after_the_selection_set_moves
        claim_type: violation_to_error
        grounds: ["errors[ERR_OWBPA_DISCLOSURE_STALE]", "validations[priority=15]", state_machines.OwbpaDisclosure.ATTACHED_to_STALE, entities.OwbpaDisclosure.fields.snapshot_selected_count]
        distinguishing_aspect: "A disclosure snapshotted at selected_count 1 goes STALE once a second selection is decided, and even after a fresh analysis is cleared and the plan approved the offer create answers 422 ERR_OWBPA_DISCLOSURE_STALE rather than pricing against an out-of-date age table."
        test_recipe:
          setup:
            - "TX site with Alice (48) and Carla (54), no WarnRule; both hold selections in one plan."
            - "Alice is SELECTED first, analysis #1 is CLEARED and a disclosure is generated at snapshot_selected_count 1 / snapshot_pool_count 2."
            - "Carla is then SELECTED, which flips that disclosure to STALE; analysis #2 is created and CLEARED, the plan is APPROVED and Alice's notice is DELIVERED."
          setup_api_calls:
            - call: "POST /sites"
              payload: { name: "Austin Campus", state_code: "TX", is_single_site: true }
              as: RestructuringLead
              as_user_id: "u-lead-1"
              captures: { site_id: $.data.id }
            - call: "POST /sites/${site_id}/roster-import"
              payload: { entries: [ { full_name: "Alice Nunez", job_title: "Senior Analyst", birth_date: "1978-05-10", hire_date: "2015-04-01", annual_base_cents: 8700000, weekly_hours: 40, demographic_code: "CLASS_A", monthly_premium_cents: 90000 }, { full_name: "Carla Reyes", job_title: "Ops Manager", birth_date: "1972-11-05", hire_date: "2018-06-01", annual_base_cents: 7280000, weekly_hours: 40, demographic_code: "CLASS_B", monthly_premium_cents: 90000 } ] }
              as: RestructuringLead
              as_user_id: "u-lead-1"
              captures: { alice_id: "$.data.employee_ids[0]", carla_id: "$.data.employee_ids[1]" }
            - call: "POST /reduction-plans"
              payload: { name: "Austin Reduction", decisional_unit_name: "Austin Operations", selection_criteria: [ { criterion_code: "PERFORMANCE", weight_pct: 50, description: "Most recent performance rating" }, { criterion_code: "CRITICAL_SKILLS", weight_pct: 30, description: "Retained-skill criticality" }, { criterion_code: "TENURE", weight_pct: 20, description: "Length of continuous service" } ], severance_budget_cents: 20000000 }
              as: RestructuringLead
              as_user_id: "u-lead-1"
              captures: { plan_id: $.data.id }
            - call: "POST /reduction-plans/${plan_id}/lock-criteria"
              payload: {}
              as: RestructuringLead
              as_user_id: "u-lead-1"
            - call: "POST /reduction-plans/${plan_id}/selection-batch"
              payload: { employee_ids: ["${alice_id}", "${carla_id}"], proposed_separation_date: "2026-12-01", criterion_scores: [ { criterion_code: "PERFORMANCE", score: 72 }, { criterion_code: "CRITICAL_SKILLS", score: 55 }, { criterion_code: "TENURE", score: 88 } ] }
              as: RestructuringLead
              as_user_id: "u-lead-1"
              captures: { s_alice: "$.data.selection_ids[0]", s_carla: "$.data.selection_ids[1]" }
            - call: "POST /selections/${s_alice}/decide"
              payload: { decision: "SELECT" }
              as: RestructuringLead
              as_user_id: "u-lead-1"
            - call: "GET /reduction-plans/${plan_id}"
              payload: {}
              as: EmploymentCounsel
              as_user_id: "u-counsel-1"
              captures: { plan_v1: $.data.version }
            - call: "POST /adverse-impact-analyses"
              payload: { plan_id: "${plan_id}", method: "IMPACT_RATIO", expected_plan_version: "${plan_v1}" }
              as: EmploymentCounsel
              as_user_id: "u-counsel-1"
              captures: { analysis_1: $.data.id }
            - call: "POST /adverse-impact-analyses/${analysis_1}/clear"
              payload: { justification: "First pass." }
              as: EmploymentCounsel
              as_user_id: "u-counsel-1"
            - call: "POST /owbpa-disclosures"
              payload: { plan_id: "${plan_id}" }
              as: EmploymentCounsel
              as_user_id: "u-counsel-1"
              captures: { disclosure_id: $.data.id, snap_sel: $.data.snapshot_selected_count }
            - call: "POST /selections/${s_carla}/decide"
              payload: { decision: "SELECT" }
              as: RestructuringLead
              as_user_id: "u-lead-1"
            - call: "GET /reduction-plans/${plan_id}"
              payload: {}
              as: EmploymentCounsel
              as_user_id: "u-counsel-1"
              captures: { plan_v2: $.data.version }
            - call: "POST /adverse-impact-analyses"
              payload: { plan_id: "${plan_id}", method: "IMPACT_RATIO", expected_plan_version: "${plan_v2}" }
              as: EmploymentCounsel
              as_user_id: "u-counsel-1"
              captures: { analysis_2: $.data.id }
            - call: "POST /adverse-impact-analyses/${analysis_2}/clear"
              payload: { justification: "Second pass covering both selections." }
              as: EmploymentCounsel
              as_user_id: "u-counsel-1"
            - call: "POST /reduction-plans/${plan_id}/submit-legal-review"
              payload: {}
              as: RestructuringLead
              as_user_id: "u-lead-1"
            - call: "POST /reduction-plans/${plan_id}/legal-decision"
              payload: { decision: "APPROVE" }
              as: EmploymentCounsel
              as_user_id: "u-counsel-1"
            - call: "POST /selections/${s_alice}/deliver-notice"
              payload: { script_code: "MANAGER_SCRIPT_STANDARD" }
              as: RestructuringLead
              as_user_id: "u-lead-1"
            - call: "GET /selections/${s_alice}"
              payload: {}
              as: BenefitsAdministrator
              as_user_id: "u-benefits-1"
              captures: { sel_v1: $.data.version }
          trigger:
            - call: "POST /severance-offers"
              payload: { selection_id: "${s_alice}", variant: "STANDARD", expected_selection_version: "${sel_v1}" }
              as: BenefitsAdministrator
              as_user_id: "u-benefits-1"
              captures: { err_id: $.data.error_id }
          assert:
            - "${snap_sel} == 1"
            - "${err_id} == ERR_OWBPA_DISCLOSURE_STALE"
            - "HTTP status == 422"
            - "OwbpaDisclosure.${disclosure_id}.status == STALE"
            - "AdverseImpactAnalysis.${analysis_1}.status == SUPERSEDED"
            - "AdverseImpactAnalysis.${analysis_2}.status == CLEARED"
            - "ReductionPlan.${plan_id}.selected_count == 2"
            - "GET /severance-offers?plan_id=${plan_id} returns exactly 0 rows"

      - name: error_invalid_offer_state_on_reissuing_an_issued_offer
        claim_type: violation_to_error
        grounds: ["errors[ERR_INVALID_OFFER_STATE]"]
        excluded_because:
          difficulty_instance: state_check_beats_budget_check_when_reissuing_an_already_issued_offer
          rationale: "Asserted as the winning error of the named 1.8 priority-conflict instance."

      - name: error_impact_analysis_not_cleared_on_offer_creation
        claim_type: violation_to_error
        grounds: ["errors[ERR_IMPACT_ANALYSIS_NOT_CLEARED]"]
        excluded_because:
          difficulty_instance: severance_offer_blocked_while_latest_analysis_is_not_cleared
          rationale: "Asserted as the failure path of the named 1.8 cross-entity instance."

      - name: error_impact_analysis_insufficient_data_on_an_empty_pool
        claim_type: violation_to_error
        grounds: ["errors[ERR_IMPACT_ANALYSIS_INSUFFICIENT_DATA]"]
        excluded_because:
          difficulty_instance: impact_analysis_zero_selected_and_empty_reference_group_are_rejected
          rationale: "Both zero-count edges are triggered and asserted by the named 1.8 boundary instance."

      - name: error_warn_window_collision_inside_an_issued_notice_window
        claim_type: violation_to_error
        grounds: ["errors[ERR_WARN_WINDOW_COLLISION]"]
        excluded_because:
          difficulty_instance: warn_aggregation_window_on_site_is_closed_for_state_notices
          rationale: "The named 1.8 overlap instance triggers the collision at the closed window end and the accepted date one day later."

      - name: error_offer_window_conflict_during_the_cooldown
        claim_type: violation_to_error
        grounds: ["errors[ERR_OFFER_WINDOW_CONFLICT]"]
        excluded_because:
          difficulty_instance: offer_window_on_employee_is_closed_plus_a_one_day_cooldown
          rationale: "The named 1.8 overlap instance triggers the conflict at end + 1 day and the accepted re-issue one day later."

      - name: error_plan_not_approved_on_notice_delivery
        claim_type: violation_to_error
        grounds: ["errors[ERR_PLAN_NOT_APPROVED]"]
        excluded_because:
          difficulty_instance: notice_delivery_blocked_while_plan_is_not_approved
          rationale: "Asserted as the failure path of the named 1.8 cross-entity instance."

      - name: error_notice_period_insufficient_without_acknowledgement
        claim_type: violation_to_error
        grounds: ["errors[ERR_NOTICE_PERIOD_INSUFFICIENT]"]
        excluded_because:
          difficulty_instance: safety_check_beats_temporal_check_on_notice_delivery_with_stale_analysis
          rationale: "The named 1.8 priority-conflict instance constructs the short-notice violation; the acknowledged-shortfall pass path is covered by acknowledged_short_notice_drives_the_notice_pay_offset."
