        captures:
          po6_st: $.data.status
      - call: GET /v1/organizations/${org6}/security-keys
        payload:
          purchase_order_id: ${po6}
        as: SecurityAdmin
        as_user_id: seca1
        captures:
          k6_hw: $.data[0].hardware_status
      - call: GET /v1/identity-accounts/${acct6}/enrollments
        payload: {}
        as: SecurityAdmin
        as_user_id: seca1
        captures:
