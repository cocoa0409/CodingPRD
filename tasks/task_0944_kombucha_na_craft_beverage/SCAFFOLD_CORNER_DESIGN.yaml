          - errors[ERR_SUBSCRIPTION_SKIP_CAP]
        distinguishing_aspect: "The ACTIVE -> ACTIVE skip self-loop may run exactly three times in a calendar year; the fourth is refused with ERR_SUBSCRIPTION_SKIP_CAP and cycle_index stays at 4."
        test_recipe:
          setup: ["One ACTIVE subscription created at the default clock that has already skipped three cycles."]
          setup_api_calls:
            - call: "POST /recipes"
