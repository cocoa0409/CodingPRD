            - call: "POST /grant-proposals/${gp_id}/reinstate"
              payload: {}
              as: FinanceController
          assert:
            - "after the award: released_cents 0 + unreleased_cents 350000 + returned_cents 0 == awarded_amount_cents 350000"
            - "after the release: released_cents 210000 + unreleased_cents 140000 + returned_cents 0 == 350000; FiscalPeriod.${fp_id}.reserve_balance_cents == 710000; GrantReport.${rep_id}.consumed_release_cents == 210000"
            - "after the sweep: GrantProposal.${gp_id}.status == SUSPENDED, suspended_reason == REPORT_DELINQUENCY, released_cents 0 + unreleased_cents 140000 + returned_cents 210000 == 350000; FiscalPeriod.${fp_id}.reserve_balance_cents == 500000; compliance_flag == DELINQUENT"
            - "trigger[0] -> 409 ERR_PROPOSAL_DELINQUENT - the compensation is refused while the report is still OVERDUE, and the ledger stays 0/140000/210000"
            - "trigger[1] -> 200: GrantReport.${rep_id}.status == SUBMITTED, spend_reported_cents == 205000, variance_bps == -238 (computed against the surviving consumed_release_cents 210000)"
            - "trigger[2] -> 200: GrantReport.${rep_id}.status == ACCEPTED and GrantProposal.${gp_id}.compliance_flag == COMPLIANT"
            - "trigger[3] -> 200: GrantProposal.${gp_id}.status == AWARDED, released_cents == 0, unreleased_cents == 350000, returned_cents == 0, awarded_amount_cents == 350000, suspended_reason == null"
            - "trigger[3]: GrantReport.${rep_id}.consumed_release_cents == 0 and allocated_release_cents == 350000 - the buckets were rebuilt, not left at 210000"
            - "trigger[3]: FiscalPeriod.${fp_id}.reserve_balance_cents == 500000 (reinstatement restores principal to unreleased_cents and does NOT credit the reserve again), recognized_revenue_cents == 350000, concentration_hhi == 10000, reserve_months_target == 5, sustainability_posture == WATCH"
            - "Funder.${f_id}.reporting_reliability_bps == 8000 and independence_risk_score == 15 after the whole sequence - the reliability penalty is NOT compensated by reinstatement"

      - name: ci_partner_withdrawal_refolds_shares_and_preserves_allocated_cost
        grounds:
          - state_machines.CollaborationPartner.CONFIRMED_to_WITHDRAWN
          - calculations.collaboration_cost_split
          - entities.Collaboration.fields.allocated_cost_cents
          - entities.Collaboration.fields.lead_cost_share_bps
          - validations[priority=45]
          - state_machines.Collaboration.ACTIVE_to_SETTLED
        distinguishing_aspect: |
          A withdrawal is a compensating rewrite of the whole apportionment, not a transfer of one
          bucket: on total_cost_cents 99998 the split moves from lead 33999 / P1 33000 / P2 32999 to
          lead 66999 / P1 32999, so the surviving partner's own bucket DROPS by one cent while the lead
          absorbs 33000, and allocated_cost_cents stays exactly 99998 at every step including the
          refused withdrawal of the last partner.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; OPEN FiscalPeriod FY2027 (2026-08-01..2027-07-31)."
            - "CoverageArea CLIMATE with publication_gate OPEN."
            - "Collaboration on CLIMATE, window 2026-09-01T00:00:00Z..2026-10-01T00:00:00Z, total_cost_cents 99998, lead_credit_bps 3400, lead_cost_share_bps 3400."
            - "Two CONFIRMED partners created in order, each at credit_share_bps 3300 and cost_share_bps 3300; the collaboration is ACTIVATED, giving lead 33999, partner 1 33000 (remainder_rank 1) and partner 2 32999 (remainder_rank 2)."
            - "One SETTLED SYNDICATION contribution of 40000 points at the collaboration."
          setup_api_calls:
            - call: "POST /fiscal-periods"
              payload: { label: "FY2027", start_date: "2026-08-01", end_date: "2027-07-31", monthly_expense_base_cents: 200000, reserve_balance_cents: 500000 }
              as: FinanceController
              captures: { fp_id: "$.data.id" }
            - call: "POST /coverage-areas"
              payload: { area_code: "CLIMATE", name: "Climate and energy", editorial_lead_user_id: "user-ed-7" }
              as: EditorialDirector
              as_user_id: "user-ed-1"
              captures: { ca_id: "$.data.id" }
            - call: "POST /collaborations"
              payload: { coverage_area_id: "${ca_id}", fiscal_period_id: "${fp_id}", title: "Cross-border emissions audit", window_start: "2026-09-01T00:00:00Z", window_end: "2026-10-01T00:00:00Z", total_cost_cents: 99998, lead_credit_bps: 3400, lead_cost_share_bps: 3400 }
              as: EditorialDirector
              as_user_id: "user-ed-1"
              captures: { col_id: "$.data.id" }
            - call: "POST /collaborations/${col_id}/partners"
              payload: { partner_org_name: "Delta River Report", credit_share_bps: 3300, cost_share_bps: 3300 }
              as: EditorialDirector
              as_user_id: "user-ed-1"
              captures: { p1_id: "$.data.id" }
            - call: "POST /collaborations/${col_id}/partners"
              payload: { partner_org_name: "Harbor Light News", credit_share_bps: 3300, cost_share_bps: 3300 }
              as: EditorialDirector
              as_user_id: "user-ed-1"
              captures: { p2_id: "$.data.id" }
            - call: "POST /collaborations/${col_id}/status-actions"
              payload: { action: "ACTIVATE" }
              as: EditorialDirector
              as_user_id: "user-ed-1"
            - call: "POST /contributions"
              payload: { fiscal_period_id: "${fp_id}", revenue_stream: "SYNDICATION", collaboration_id: "${col_id}", amount_cents: 40000, received_date: "2026-09-15", source_label: "Regional wire syndication" }
              as: DevelopmentOfficer
              as_user_id: "user-dev-1"
              captures: { syn_c_id: "$.data.id" }
            - call: "POST /contributions/${syn_c_id}/settlement"
              payload: { outcome: "SETTLED" }
              as: FinanceController
          trigger:
            - call: "POST /collaboration-partners/${p2_id}/withdraw"
              payload: { withdrawal_reason: "Partner newsroom lost its grant match." }
              as: EditorialDirector
              as_user_id: "user-ed-1"
            - call: "POST /collaboration-partners/${p1_id}/withdraw"
              payload: { withdrawal_reason: "Second partner also wants out." }
              as: EditorialDirector
              as_user_id: "user-ed-1"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-10-01T00:00:00Z" }
              as: EditorialDirector
              as_user_id: "user-ed-1"
            - call: "POST /collaborations/${col_id}/status-actions"
              payload: { action: "SETTLE" }
              as: EditorialDirector
              as_user_id: "user-ed-1"
          assert:
            - "end of setup: Collaboration.${col_id}.lead_cost_cents == 33999, CollaborationPartner.${p1_id}.cost_owed_cents == 33000 with remainder_rank 1, CollaborationPartner.${p2_id}.cost_owed_cents == 32999 with remainder_rank 2, allocated_cost_cents == 99998 == total_cost_cents"
            - "trigger[0] -> 200: CollaborationPartner.${p2_id}.status == WITHDRAWN, cost_owed_cents == 0, remainder_rank == 0, withdrawn_at == 2026-08-01T00:00:00Z"
            - "trigger[0]: Collaboration.${col_id}.lead_cost_share_bps == 6700 and lead_credit_bps == 6700 and partner_count == 1"
            - "trigger[0]: Collaboration.${col_id}.lead_cost_cents == 66999 and CollaborationPartner.${p1_id}.cost_owed_cents == 32999 with remainder_rank 2 - the surviving partner's bucket FELL from 33000 to 32999"
            - "trigger[0]: allocated_cost_cents == 99998 == total_cost_cents, exactly (66999 + 32999)"
            - "trigger[1] -> 409 ERR_LAST_PARTNER_WITHDRAWAL; CollaborationPartner.${p1_id}.status is still CONFIRMED, cost_owed_cents is still 32999 and allocated_cost_cents is still 99998"
            - "trigger[3] -> 200: Collaboration.${col_id}.status == SETTLED, settled_at == 2026-10-01T00:00:00Z, allocated_cost_cents == 99998, syndication_revenue_cents == 40000"
            - "at no observation point does lead_cost_cents + sum(cost_owed_cents of CONFIRMED partners) differ from total_cost_cents 99998"
