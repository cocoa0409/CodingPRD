  # ===========================================================================
  # RULE 6 — boundary_precision_check
  # Three instances on THREE different metrics and THREE different endpoints,
  # each landing exactly ON an inclusive/exclusive boundary:
  #   6a: recalculation delta vs UP_THRESHOLD 0.25 / DOWN_THRESHOLD -0.35
  #       endpoint POST /tennis/sections/{id}/year-end-recalc
  #   6b: half-open facility occupancy end instant vs court_count
  #       endpoint POST /tennis/matches/{id}/schedule
  #   6c: weighted strike total vs Section.strike_limit
  #       endpoint POST /tennis/strikes
  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:

      - name: recalc_delta_hits_both_thresholds_exactly_and_signed_comparison_decides
        grounds:
          - calculations.year_end_rating_recalculation
          - calculations.player_dynamic_rating
          - entities.Player.fields.proposed_recalc_level
          - entities.Player.fields.proposed_recalc_dynamic
          - entities.Section.fields.recalculated_player_count
        distinguishing_aspect: |
          One verified match produces three players sitting exactly on a threshold: a2 at
          delta == +0.250 (== UP_THRESHOLD, bumps up), h5 and h6 at delta == -0.350
          (== DOWN_THRESHOLD, bump down) and a1 at delta == -0.250, which must leave the level
          untouched because the comparison is signed, not absolute. An implementation using
          abs(delta) >= 0.25 wrongly demotes a1, one using strict > drops a2 and h5/h6, and
          both errors show up in recalculated_player_count 12 with exactly 5 level changes.
        test_recipe:
          setup:
            - "Section SOCAL-2026, SECTION league ntrp_level 4.0, two six-player rosters, one REGULAR match M1 reviewed to VERIFIED."
            - "Home players h1..h6 are all COMPUTER_RATED 4.0. Away players alternate: a1 4.0, a2 3.5, a3 4.0, a4 3.5, a5 4.0, a6 3.5, so both partners of a line share one line rating but differ in baseline."
            - "M1 lines: line 1 6-4 6-0 home, line 2 6-4 6-3 home, line 3 4-6 4-6 away. Verification credits every line as PLAYED, so all twelve players have verified_line_count 1."
            - "With exactly one counted REGULAR line per player the year_end_final variant equals that single line rating: h1/h2 4.000, h3/h4 3.882, h5/h6 3.650, a1/a2 3.750, a3/a4 3.868, a5/a6 4.100."
            - "Deltas against rating_level: h1 0.000, h3 -0.118, h5 -0.350, a1 -0.250, a2 +0.250, a3 -0.132, a4 +0.368, a5 +0.100, a6 +0.600."
