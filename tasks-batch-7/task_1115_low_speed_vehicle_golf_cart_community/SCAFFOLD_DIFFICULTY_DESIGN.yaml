            - { call: "POST /api/charging-stations", payload: { community_id: "${comm_id}", name: "S-TO2", slot_count: 2, rate_cents_per_min: 10 }, as: CommunityAdmin, captures: { st_id: $.data.id } }
            - { call: "POST /api/charging-reservations", payload: { station_id: "${st_id}", holder_id: "${h_id}", slot_index: 0, start_at: "2026-06-01T10:00:00Z", end_at: "2026-06-01T11:00:00Z" }, as: PermitHolder, as_user_id: "${h_id}", captures: { r1: $.data.id } }
          trigger:
            - { call: "POST /api/charging-reservations", payload: { station_id: "${st_id}", holder_id: "${h_id}", slot_index: 0, start_at: "2026-06-01T11:14:00Z", end_at: "2026-06-01T12:00:00Z" }, as: PermitHolder, as_user_id: "${h_id}", captures: { err1: $.data.error_id } }
            - { call: "POST /api/charging-reservations", payload: { station_id: "${st_id}", holder_id: "${h_id}", slot_index: 0, start_at: "2026-06-01T11:15:00Z", end_at: "2026-06-01T12:00:00Z" }, as: PermitHolder, as_user_id: "${h_id}", captures: { r2: $.data.id, fee2: $.data.fee_cents } }
            - { call: "POST /api/charging-reservations", payload: { station_id: "${st_id}", holder_id: "${h_id}", slot_index: 0, start_at: "2026-06-01T09:45:00Z", end_at: "2026-06-01T10:00:00Z" }, as: PermitHolder, as_user_id: "${h_id}", captures: { err2: $.data.error_id } }
            - { call: "POST /api/charging-reservations", payload: { station_id: "${st_id}", holder_id: "${h_id}", slot_index: 0, start_at: "2026-06-01T09:00:00Z", end_at: "2026-06-01T09:45:00Z" }, as: PermitHolder, as_user_id: "${h_id}", captures: { r3: $.data.id } }
            - { call: "POST /api/charging-reservations", payload: { station_id: "${st_id}", holder_id: "${h_id}", slot_index: 1, start_at: "2026-06-01T10:00:00Z", end_at: "2026-06-01T11:00:00Z" }, as: PermitHolder, as_user_id: "${h_id}", captures: { r4: $.data.id } }
          assert:
            - "err1 == ERR_CHARGING_OVERLAP (11:14 < 11:00 + 15min)"
            - "r2 created, fee2 == 450 (11:15 - 11:00 == 15min buffer exactly satisfies the gap)"
            - "err2 == ERR_CHARGING_OVERLAP (10:00 end + 15min = 10:15 > R1 start 10:00)"
            - "r3 created (09:45 + 15min == 10:00: exact buffer gap on the early side is legal)"
            - "r4 created (overlap is scoped per slot_index; slot 1 is free for the identical window)"

      - name: dispatch_window_closed_adjacency_conflicts
        grounds:
          - validations[priority=7]
          - entities.FleetDispatch.fields.shift_start
          - entities.FleetDispatch.fields.shift_end
        distinguishing_aspect: |
          Interval semantics: CLOSED interval with NO buffer per fleet vehicle — the
          mirror image of the route pass. Touching endpoints CONFLICT: D1
          [10:00,12:00] blocks D2 starting at exactly 12:00 (a window the half-open
          route-pass rule would accept); D2 at 12:00:01 is legal. Different resource
          (FleetVehicle) and different adjacency verdict from route_pass_half_open_adjacency.
        test_recipe:
          setup:
            - "AVAILABLE fleet vehicle; ELIGIBLE holder"
          setup_api_calls:
            - { call: "POST /api/communities", payload: { name: "C-TO3" }, as: PlatformAdmin, captures: { comm_id: $.data.id } }
            - { call: "POST /api/permit-holders", payload: { community_id: "${comm_id}", full_name: "H TO3", birth_date: "2010-05-01", driver_license_class: "STANDARD" }, as: Anonymous, captures: { h_id: $.data.id } }
            - { call: "POST /api/permit-holders/${h_id}/verify-eligibility", payload: {}, as: CommunityAdmin }
            - { call: "POST /api/charging-stations", payload: { community_id: "${comm_id}", name: "S-TO3", slot_count: 1, rate_cents_per_min: 10 }, as: CommunityAdmin, captures: { st_id: $.data.id } }
            - { call: "POST /api/fleet-vehicles", payload: { community_id: "${comm_id}", station_id: "${st_id}", label: "F-TO3" }, as: CommunityAdmin, captures: { fv_id: $.data.id } }
          trigger:
            - { call: "POST /api/fleet-dispatches", payload: { vehicle_id: "${fv_id}", holder_id: "${h_id}", shift_start: "2026-06-01T10:00:00Z", shift_end: "2026-06-01T12:00:00Z" }, as: PermitHolder, as_user_id: "${h_id}", captures: { d1: $.data.id } }
            - { call: "POST /api/fleet-dispatches", payload: { vehicle_id: "${fv_id}", holder_id: "${h_id}", shift_start: "2026-06-01T12:00:00Z", shift_end: "2026-06-01T14:00:00Z" }, as: PermitHolder, as_user_id: "${h_id}", captures: { err: $.data.error_id } }
            - { call: "POST /api/fleet-dispatches", payload: { vehicle_id: "${fv_id}", holder_id: "${h_id}", shift_start: "2026-06-01T12:00:01Z", shift_end: "2026-06-01T14:00:00Z" }, as: PermitHolder, as_user_id: "${h_id}", captures: { d2: $.data.id } }
          assert:
            - "d1 created with status BOOKED"
            - "err == ERR_DISPATCH_WINDOW_OVERLAP with http 409 (closed semantics: 12:00 <= 12:00 collides)"
            - "d2 created (one second later clears the closed interval) — direct contrast with the half-open route-pass adjacency"

  # ---------------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: wallet_conserved_across_charge_and_refund
        grounds:
          - calculations.charging_fee
          - state_machines.ChargingReservation.BOOKED_to_CANCELLED
          - entities.PermitHolder.fields.wallet_balance_cents
        distinguishing_aspect: |
          Conserved quantity: wallet cents. The forward action (book: debit 600) paired
          with its compensating action (cancel before start: credit 600) MUST leave
          wallet_balance_cents bit-identical to its pre-booking value:
          100000 -> 99400 -> 100000. Any drift (partial refund, double debit) breaks it.
        test_recipe:
          setup:
            - "ONLINE station rate 10 c/min; holder wallet exactly 100000 after deposit; clock 2026-05-01 (reservation window is in the future)"
          setup_api_calls:
            - { call: "POST /api/communities", payload: { name: "C-CI1" }, as: PlatformAdmin, captures: { comm_id: $.data.id } }
            - { call: "POST /api/permit-holders", payload: { community_id: "${comm_id}", full_name: "H CI1", birth_date: "2010-05-01", driver_license_class: "STANDARD" }, as: Anonymous, captures: { h_id: $.data.id } }
            - { call: "POST /api/permit-holders/${h_id}/verify-eligibility", payload: {}, as: CommunityAdmin, captures: { h_v: $.data.version } }
            - { call: "POST /api/permit-holders/${h_id}/wallet/deposits", payload: { amount_cents: 100000, expected_permit_holder_version: "${h_v}" }, as: PermitHolder, as_user_id: "${h_id}", captures: { w0: $.data.wallet_balance_cents } }
            - { call: "POST /api/charging-stations", payload: { community_id: "${comm_id}", name: "S-CI1", slot_count: 2, rate_cents_per_min: 10 }, as: CommunityAdmin, captures: { st_id: $.data.id } }
          trigger:
            - { call: "POST /api/charging-reservations", payload: { station_id: "${st_id}", holder_id: "${h_id}", slot_index: 0, start_at: "2026-06-01T10:00:00Z", end_at: "2026-06-01T11:00:00Z" }, as: PermitHolder, as_user_id: "${h_id}", captures: { res_id: $.data.id, fee: $.data.fee_cents } }
            - { call: "GET /api/permit-holders/${h_id}", as: CommunityAdmin, captures: { w1: $.data.wallet_balance_cents } }
            - { call: "POST /api/charging-reservations/${res_id}/cancel", payload: {}, as: PermitHolder, as_user_id: "${h_id}", captures: { res_st: $.data.status } }
            - { call: "GET /api/permit-holders/${h_id}", as: CommunityAdmin, captures: { w2: $.data.wallet_balance_cents } }
          assert:
            - "w0 == 100000 and fee == 600 and w1 == 99400 (forward action)"
            - "res_st == CANCELLED and w2 == 100000 == w0 (compensating action restores the conserved quantity exactly)"

      - name: fleet_checked_out_count_conserved_across_checkout_return
        grounds:
          - state_machines.FleetDispatch.BOOKED_to_CHECKED_OUT
          - state_machines.FleetDispatch.CHECKED_OUT_to_RETURNED
          - entities.Community.fields.checked_out_count
          - entities.FleetVehicle.fields.status
        distinguishing_aspect: |
          Conserved quantity: fleet checked-out COUNT (a cardinality, not money — a
          different quantity type from the wallet). Community.checked_out_count must
          equal the number of CHECKED_OUT FleetVehicles at every step, and checkout +
          return must restore the pre-checkout value: 0 -> 1 -> 0 with the vehicle
          flipping AVAILABLE -> CHECKED_OUT -> AVAILABLE in lockstep.
        test_recipe:
          setup:
            - "AVAILABLE fleet vehicle in community with checked_out_count 0; ELIGIBLE holder; dispatch booked for 2026-05-01T09:00-17:00; clock 2026-05-01T10:00 (inside the shift)"
          setup_api_calls:
            - { call: "POST /api/communities", payload: { name: "C-CI2" }, as: PlatformAdmin, captures: { comm_id: $.data.id, c0: $.data.checked_out_count } }
            - { call: "POST /api/permit-holders", payload: { community_id: "${comm_id}", full_name: "H CI2", birth_date: "2010-05-01", driver_license_class: "STANDARD" }, as: Anonymous, captures: { h_id: $.data.id } }
            - { call: "POST /api/permit-holders/${h_id}/verify-eligibility", payload: {}, as: CommunityAdmin }
            - { call: "POST /api/charging-stations", payload: { community_id: "${comm_id}", name: "S-CI2", slot_count: 1, rate_cents_per_min: 10 }, as: CommunityAdmin, captures: { st_id: $.data.id } }
            - { call: "POST /api/fleet-vehicles", payload: { community_id: "${comm_id}", station_id: "${st_id}", label: "F-CI2" }, as: CommunityAdmin, captures: { fv_id: $.data.id } }
            - { call: "POST /api/fleet-dispatches", payload: { vehicle_id: "${fv_id}", holder_id: "${h_id}", shift_start: "2026-05-01T09:00:00Z", shift_end: "2026-05-01T17:00:00Z" }, as: PermitHolder, as_user_id: "${h_id}", captures: { d_id: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T10:00:00Z" }, as: PlatformAdmin }
          trigger:
            - { call: "POST /api/fleet-dispatches/${d_id}/checkout", payload: {}, as: PermitHolder, as_user_id: "${h_id}" }
            - { call: "GET /api/communities/${comm_id}", as: CommunityAdmin, captures: { c1: $.data.checked_out_count } }
            - { call: "POST /api/fleet-dispatches/${d_id}/return", payload: {}, as: PermitHolder, as_user_id: "${h_id}", captures: { d_st: $.data.status, fine: $.data.late_fine_cents } }
            - { call: "GET /api/communities/${comm_id}", as: CommunityAdmin, captures: { c2: $.data.checked_out_count } }
            - { call: "GET /api/fleet-vehicles/${fv_id}", as: CommunityAdmin, captures: { fv_st: $.data.status } }
          assert:
            - "c0 == 0 (pre-checkout baseline)"
            - "c1 == 1 and vehicle status CHECKED_OUT after checkout (count tracks the vehicle set exactly)"
            - "d_st == RETURNED and fine == 0 (returned at 10:00, before shift_end 17:00)"
            - "c2 == 0 == c0 and fv_st == AVAILABLE (checkout + return conserves the count)"
