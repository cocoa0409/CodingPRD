        excluded_because:
          difficulty_instance: cyclic_state_machine_loop / petition_rerun_cycle_reenters_election_set
          rationale: "The named \u00a71.8 instance drives the sustained objection into schedule-rerun and asserts round_number 2, prior_round_id pointing at the SET_ASIDE round and the case back in ELECTION_SET."

