  # ===================================================================
  # Section: calculations
  # ===================================================================
  - section: calculations
    instances:
      - name: calc_panel_database_yield_adjustment
        claim_type: correct_result
        grounds: [calculations.nutrient_panel_computation]
        distinguishing_aspect: "Yield factor divides the finished mass: 160g raw at yield 0.8 gives 128g finished, so per-100g calories are 58680/128 = 458.44, not the yield-1.0 value 366.75."
        test_recipe:
          setup: ["client, product, flour+sugar ingredients, recipe 120g/40g with yield_factor 0.8, LOCKED"]
          setup_api_calls:
            - { call: "POST /api/clients", payload: { name: "Acme Foods", home_market_code: "US_FDA" }, as: PlatformAdmin, captures: { cid: $.data.id } }
            - { call: "POST /api/clients/${cid}/products", payload: { name: "Cookie", product_category: "BAKED_GOOD", net_weight_g: 110, total_surface_area_sq_in: 30.0, pdp_area_sq_in: 6.0 }, as: ClientRep, as_user_id: "${cid}", captures: { pid: $.data.id } }
            - { call: "POST /api/clients/${cid}/ingredients", payload: { name: "Wheat Flour", allergen_tags: ["WHEAT"], kcal_per_100g: 360, fat_g_per_100g: 2.0, satfat_g_per_100g: 0.3, chol_mg_per_100g: 0, sodium_mg_per_100g: 5, carb_g_per_100g: 75, fiber_g_per_100g: 3.0, sugar_g_per_100g: 1.0, protein_g_per_100g: 10 }, as: ClientRep, as_user_id: "${cid}", captures: { i_flour: $.data.id } }
            - { call: "POST /api/clients/${cid}/ingredients", payload: { name: "Sugar", allergen_tags: [], kcal_per_100g: 387, fat_g_per_100g: 0, satfat_g_per_100g: 0, chol_mg_per_100g: 0, sodium_mg_per_100g: 0, carb_g_per_100g: 100, fiber_g_per_100g: 0, sugar_g_per_100g: 100, protein_g_per_100g: 0 }, as: ClientRep, as_user_id: "${cid}", captures: { i_sugar: $.data.id } }
            - { call: "POST /api/products/${pid}/recipes", payload: { name: "baked", yield_factor: 0.8, lines: [ { ingredient_id: "${i_flour}", quantity_g: 120 }, { ingredient_id: "${i_sugar}", quantity_g: 40 } ] }, as: ClientRep, as_user_id: "${cid}", captures: { rid: $.data.id } }
            - { call: "POST /api/recipes/${rid}/lock", as: ClientRep, as_user_id: "${cid}" }
          trigger:
            - { call: "POST /api/recipes/${rid}/nutrient-panels", payload: { method: "DATABASE" }, as: LabelAnalyst, as_user_id: "analyst-1", captures: { kcal: $.data.kcal_per_100g, fat: $.data.fat_g_per_100g, sodium: $.data.sodium_mg_per_100g, protein: $.data.protein_g_per_100g } }
          assert:
            - "kcal == 458.44 (58680 / 128)"
            - "fat == 1.88 (240 / 128 = 1.875, round_half_up 2dp)"
            - "sodium == 4.69 (600 / 128 = 4.6875)"
            - "protein == 9.38 (1200 / 128 = 9.375)"

      - name: calc_profile_incomplete_rejected
        claim_type: input_set_filtering
        grounds: [calculations.nutrient_panel_computation, "errors[ERR_NUTRIENT_PROFILE_INCOMPLETE]"]
        distinguishing_aspect: "DATABASE computation over a line whose ingredient has any null nutrient field fails with ERR_NUTRIENT_PROFILE_INCOMPLETE; no panel is persisted."
        test_recipe:
          setup: ["client, product, ingredient WITHOUT sodium_mg_per_100g, recipe LOCKED"]
          setup_api_calls:
            - { call: "POST /api/clients", payload: { name: "Acme Foods", home_market_code: "US_FDA" }, as: PlatformAdmin, captures: { cid: $.data.id } }
            - { call: "POST /api/clients/${cid}/products", payload: { name: "Cookie", product_category: "BAKED_GOOD", net_weight_g: 110, total_surface_area_sq_in: 30.0, pdp_area_sq_in: 6.0 }, as: ClientRep, as_user_id: "${cid}", captures: { pid: $.data.id } }
            - { call: "POST /api/clients/${cid}/ingredients", payload: { name: "Mystery Mix", kcal_per_100g: 400, fat_g_per_100g: 8.0, satfat_g_per_100g: 2.0, chol_mg_per_100g: 0, carb_g_per_100g: 70, fiber_g_per_100g: 2.0, sugar_g_per_100g: 20.0, protein_g_per_100g: 5.0 }, as: ClientRep, as_user_id: "${cid}", captures: { i_mix: $.data.id } }
            - { call: "POST /api/products/${pid}/recipes", payload: { name: "v1", lines: [ { ingredient_id: "${i_mix}", quantity_g: 100 } ] }, as: ClientRep, as_user_id: "${cid}", captures: { rid: $.data.id } }
            - { call: "POST /api/recipes/${rid}/lock", as: ClientRep, as_user_id: "${cid}" }
          trigger:
            - { call: "POST /api/recipes/${rid}/nutrient-panels", payload: { method: "DATABASE" }, as: LabelAnalyst, as_user_id: "analyst-1", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_NUTRIENT_PROFILE_INCOMPLETE and HTTP status == 422"
            - "GET /api/recipes/${rid}/nutrient-panels returns empty list"

      - name: calc_lab_panel_requires_validated_analysis
        claim_type: input_set_filtering
        grounds: [calculations.nutrient_panel_computation, "errors[ERR_NO_VALIDATED_LAB_ANALYSIS]"]
        distinguishing_aspect: "method=LAB with only a SUBMITTED (not VALIDATED) analysis fails with ERR_NO_VALIDATED_LAB_ANALYSIS."
        test_recipe:
          setup: ["client, product, recipe LOCKED, lab analysis SUBMITTED only"]
          setup_api_calls:
            - { call: "POST /api/clients", payload: { name: "Acme Foods", home_market_code: "US_FDA" }, as: PlatformAdmin, captures: { cid: $.data.id } }
            - { call: "POST /api/clients/${cid}/products", payload: { name: "Cookie", product_category: "BAKED_GOOD", net_weight_g: 110, total_surface_area_sq_in: 30.0, pdp_area_sq_in: 6.0 }, as: ClientRep, as_user_id: "${cid}", captures: { pid: $.data.id } }
            - { call: "POST /api/clients/${cid}/ingredients", payload: { name: "Wafers", kcal_per_100g: 400, fat_g_per_100g: 8.0, satfat_g_per_100g: 2.0, chol_mg_per_100g: 0, sodium_mg_per_100g: 200, carb_g_per_100g: 70, fiber_g_per_100g: 2.0, sugar_g_per_100g: 20.0, protein_g_per_100g: 5.0 }, as: ClientRep, as_user_id: "${cid}", captures: { i_waf: $.data.id } }
            - { call: "POST /api/products/${pid}/recipes", payload: { name: "v1", lines: [ { ingredient_id: "${i_waf}", quantity_g: 100 } ] }, as: ClientRep, as_user_id: "${cid}", captures: { rid: $.data.id } }
            - { call: "POST /api/recipes/${rid}/lock", as: ClientRep, as_user_id: "${cid}" }
            - { call: "POST /api/recipes/${rid}/lab-analyses", payload: { lab_report_ref: "LR-1", kcal_per_100g: 350.0, fat_g_per_100g: 1.4, satfat_g_per_100g: 0.2, chol_mg_per_100g: 0, sodium_mg_per_100g: 3.5, carb_g_per_100g: 80.0, fiber_g_per_100g: 2.2, sugar_g_per_100g: 24.0, protein_g_per_100g: 7.4 }, as: ClientRep, as_user_id: "${cid}" }
          trigger:
            - { call: "POST /api/recipes/${rid}/nutrient-panels", payload: { method: "LAB" }, as: LabelAnalyst, as_user_id: "analyst-1", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_NO_VALIDATED_LAB_ANALYSIS and HTTP status == 422"

      - name: calc_ingredient_statement_canonical_order
        claim_type: correct_result
        grounds: [calculations.ingredient_statement_ordering, "endpoints.GET /api/recipes/{id}/ingredient-statement"]
        distinguishing_aspect: "Descending-weight order with created_at tie-break: flour(100g, created first) before sugar(100g) before butter(50g); Contains lists allergens by first appearance along that order."
        test_recipe:
          setup: ["client, product, ingredients flour(WHEAT, 100g), sugar(100g), butter(MILK, 50g) created in that order; recipe LOCKED"]
          setup_api_calls:
            - { call: "POST /api/clients", payload: { name: "Acme Foods", home_market_code: "US_FDA" }, as: PlatformAdmin, captures: { cid: $.data.id } }
            - { call: "POST /api/clients/${cid}/products", payload: { name: "Cookie", product_category: "BAKED_GOOD", net_weight_g: 110, total_surface_area_sq_in: 30.0, pdp_area_sq_in: 6.0 }, as: ClientRep, as_user_id: "${cid}", captures: { pid: $.data.id } }
            - { call: "POST /api/clients/${cid}/ingredients", payload: { name: "Wheat Flour", allergen_tags: ["WHEAT"], kcal_per_100g: 360, fat_g_per_100g: 2.0, satfat_g_per_100g: 0.3, chol_mg_per_100g: 0, sodium_mg_per_100g: 5, carb_g_per_100g: 75, fiber_g_per_100g: 3.0, sugar_g_per_100g: 1.0, protein_g_per_100g: 10 }, as: ClientRep, as_user_id: "${cid}", captures: { i_flour: $.data.id } }
            - { call: "POST /api/clients/${cid}/ingredients", payload: { name: "Sugar", allergen_tags: [], kcal_per_100g: 387, fat_g_per_100g: 0, satfat_g_per_100g: 0, chol_mg_per_100g: 0, sodium_mg_per_100g: 0, carb_g_per_100g: 100, fiber_g_per_100g: 0, sugar_g_per_100g: 100, protein_g_per_100g: 0 }, as: ClientRep, as_user_id: "${cid}", captures: { i_sugar: $.data.id } }
            - { call: "POST /api/clients/${cid}/ingredients", payload: { name: "Butter", allergen_tags: ["MILK"], kcal_per_100g: 717, fat_g_per_100g: 81.0, satfat_g_per_100g: 51.0, chol_mg_per_100g: 215, sodium_mg_per_100g: 11, carb_g_per_100g: 0.1, fiber_g_per_100g: 0, sugar_g_per_100g: 0.1, protein_g_per_100g: 0.9 }, as: ClientRep, as_user_id: "${cid}", captures: { i_butter: $.data.id } }
            - { call: "POST /api/products/${pid}/recipes", payload: { name: "v1", lines: [ { ingredient_id: "${i_butter}", quantity_g: 50 }, { ingredient_id: "${i_sugar}", quantity_g: 100 }, { ingredient_id: "${i_flour}", quantity_g: 100 } ] }, as: ClientRep, as_user_id: "${cid}", captures: { rid: $.data.id } }
            - { call: "POST /api/recipes/${rid}/lock", as: ClientRep, as_user_id: "${cid}" }
          trigger:
            - { call: "GET /api/recipes/${rid}/ingredient-statement", as: PlatformAdmin, captures: { stmt: $.data.ingredient_statement_text, contains: $.data.contains_text } }
          assert:
            - "stmt == 'Wheat Flour, Sugar, Butter' (quantity DESC; the 100g tie breaks by ingredient created_at ASC — flour before sugar — regardless of line input order)"
            - "contains == 'Contains: Wheat, Milk.' (allergens in first-appearance order along canonical line order)"

      - name: calc_format_type_size_violation
        claim_type: constants_applied
        grounds: [calculations.format_compliance_evaluation, entities.FormatCheck.fields.min_type_size_in]
        distinguishing_aspect: "PDP area 6.0 (> 5.0) sets min type 0.0625in; declared 0.03125 fails with TYPE_SIZE_BELOW_MIN while the format itself (TABULAR at 30 sq in) is allowed."
        test_recipe:
          setup: ["client, product (area 30, pdp 6.0), LOCKED recipe, panel, RACC, DRAFT label declared_type_size_in 0.03125"]
