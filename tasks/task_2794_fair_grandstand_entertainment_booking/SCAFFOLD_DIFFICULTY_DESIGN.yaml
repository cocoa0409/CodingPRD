              as: ProductionManager
            - call: "POST /grandstand/rider-items/${seed1}/rule"
              payload: { decision: "APPROVED" }
              as: ProductionManager
            - call: "POST /grandstand/production-advances/${adv1}/complete"
              payload: {}
              as: ProductionManager
            - call: "GET /grandstand/show-bookings/${bk1}"
              payload: {}
              as: BoxOfficeManager
              captures: { bk1_v: "$.data.version" }
            - call: "POST /grandstand/show-bookings/${bk1}/ticket-scales"
