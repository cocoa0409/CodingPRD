            - "After RESTORE: School.${sch_id}.epinephrine_days_of_supply == 50.0"
            - "School.${sch_id}.albuterol_days_of_supply == 0.0 throughout"
            - "School.${sch_id}.stock_protocol_status == DEPLETED throughout (albuterol units are zero)"

