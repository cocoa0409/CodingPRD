            - call: "POST /kiosk-ops/content-bundles/${natl_bundle_id}/daypart-slots"
              payload: { expected_content_bundle_version: "${natl_bundle_ver2}", daypart_code: "DINNER", start_minute_of_day: 960, end_minute_of_day: 1320, layout_code: "NATL_DINNER", buffer_minutes: 15, category_codes: ["ENTREE"] }
              as: ContentManager
            - call: "POST /kiosk-ops/content-bundles/${natl_bundle_id}/actions"
