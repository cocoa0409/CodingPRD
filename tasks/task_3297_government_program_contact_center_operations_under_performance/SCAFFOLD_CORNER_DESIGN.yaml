      - auth_err != ERR_CONTRACT_NOT_FOUND
  - name: stale_version_on_invoice_approve
    claim_type: violation_to_error
    grounds:
    - errors.ERR_STALE_VERSION
    - concurrency_rules[invoice-approve-stale-contract]
    distinguishing_aspect: 'The second OCC rule fires on invoice approval: a contract mutation between the client''s read and the approve (e.g.
      another service-level activation bumped Contract.version) makes the carried expected_contract_version stale — 412 ERR_STALE_VERSION, invoice
      stays SUBMITTED.'
    test_recipe:
      setup:
      - ACTIVE contract with two DRAFT service levels (ASA effective 2026-09-01 already EFFECTIVE, ABANDON still DRAFT); invoice prepared and
        submitted; client read contract version before activating the ABANDON SL.
