      - name: award_and_adjustment_state_gates_rejected
        claim_type: Violation → Error
        grounds:
          - validations.priority_66
          - validations.priority_67
          - errors.ERR_AWARD_STATE_INVALID
          - errors.ERR_ADJUSTMENT_NOT_PENDING
          - entities.ParticipantAward.fields.allocation_status
          - entities.DiscretionaryAdjustment.fields.status
        distinguishing_aspect: |
          Both rules are isolated from their neighbours. Bea's award is retracted
          while the POOL is legally ALLOCATING (so priority 65 cannot fire) and only
          the award's own UNALLOCATED status is wrong -> 409
          ERR_AWARD_STATE_INVALID. The adjustment is reversed while it is still
          PENDING_APPROVAL: reverse is declared only from APPROVED, so the 409 is
          ERR_ADJUSTMENT_NOT_PENDING and the adjustment must remain
          PENDING_APPROVAL, not slide to REVERSED.
        test_recipe:
          setup:
            - "CHAIN-shaped plan with two identical L5 participants (targets 4,000,000 each, funded pool 8,000,000, discretionary budget 800,000)."
