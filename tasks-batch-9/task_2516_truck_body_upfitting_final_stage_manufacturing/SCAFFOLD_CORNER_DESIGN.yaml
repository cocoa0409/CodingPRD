            - call: "POST /upfit/body-specs"
              payload: { code: "SERVICE-11FT", body_type: "SERVICE", weight_lb: 2100, cg_from_body_front_in: 62, cargo_cg_from_body_front_in: 66, length_in: 132, required_min_ca_in: 84, required_min_wheelbase_in: 189, aux_amp_draw: 12, requires_hydraulics: false, list_price_cents: 1450000 }
              as: PlantAdmin
              as_user_id: "adm-1"
              captures: { bs_svc: "$.data.id" }
            - call: "POST /upfit/customers"
              payload: { name: "Metro Fleet Services", account_code: "MFS-001", fleet_contact_email: "fleet@metro.example" }
              as: PlantAdmin
              as_user_id: "adm-1"
              captures: { cust: "$.data.id" }
            - call: "POST /upfit/build-configurations"
              payload: { config_code: "CFG-SVC-A", chassis_model_id: "${cm_a}", body_spec_id: "${bs_svc}", standardization_tier: "CUSTOM" }
              as: UpfitEngineer
              as_user_id: "eng-1"
              captures: { cfg: "$.data.id" }
            - call: "POST /upfit/build-configurations/${cfg}/publish"
              payload: {}
              as: UpfitEngineer
              as_user_id: "eng-1"
            - call: "POST /upfit/upfit-orders"
              payload: { order_number: "UO-5011", order_type: "CUSTOMER_SPECIFIC", customer_id: "${cust}", build_configuration_id: "${cfg}", body_mount_offset_from_front_axle_in: 120 }
              as: ProductionScheduler
              as_user_id: "ps-1"
              captures: { uo: "$.data.id" }
            - call: "POST /upfit/electrical-interfaces"
              payload: { upfit_order_id: "${uo}", interface_method: "BODY_BUILDER_MODULE", circuit_amp_draw: 20, signal_source: "BODY_CONTROLLER" }
              as: UpfitEngineer
              as_user_id: "eng-1"
              captures: { if1: "$.data.id" }
            - call: "POST /upfit/electrical-interfaces"
              payload: { upfit_order_id: "${uo}", interface_method: "BODY_BUILDER_MODULE", circuit_amp_draw: 8, signal_source: "BODY_CONTROLLER" }
              as: UpfitEngineer
              as_user_id: "eng-1"
              captures: { if2: "$.data.id" }
            - call: "POST /upfit/electrical-interfaces/${if1}/approve"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
          trigger:
            - call: "POST /upfit/electrical-interfaces/${if2}/approve"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
          assert:
            - "HTTP 200"
            - "ElectricalInterface.${if2}.status == \"APPROVED\" and approved_by_user_id == \"co-1\""
            - "ElectricalInterface.${if1}.status == \"SUPERSEDED\""
            - "UpfitOrder.${uo}.committed_aux_amp_draw == 20 (body 12 + the 8 A survivor; the superseded 20 A row dropped out)"
            - "UpfitOrder.${uo}.chassis_warranty_status == \"INTACT\" (BODY_BUILDER_MODULE on J1939_CAN maps to warranty_impact NONE)"
            - "ElectricalInterface.${if1}.warranty_impact and ElectricalInterface.${if2}.warranty_impact are both \"NONE\""

