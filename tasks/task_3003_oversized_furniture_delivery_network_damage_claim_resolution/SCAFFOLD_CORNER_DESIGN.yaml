# =============================================================================
# §1.9 Scaffold Corner Design — Coverage Index for Non-Difficulty Tests
# Task 3003 — Oversized Furniture Delivery Network & Damage Claim Resolution
#
# Breadth probe: every testable claim the §1.1–§1.7 surface declares that
# SCAFFOLD_DIFFICULTY_DESIGN.yaml does not already exercise. Corners that §1.8
# covers appear as `excluded_because:` stubs with no test_recipe.
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:

      - name: item_create_returns_computed_fields_and_ignores_client_state
        claim_type: Creation
        grounds:
          - entities.Item
          - endpoints.POST_/oversize-freight/items
        distinguishing_aspect: "A 40x40x20 / 30lb item comes back 201 with cube_score 52.52, freight_class LTL_250, declared_girth_in 140, parcel_ok true, status LISTED, version 1 — computed and system fields are server-derived, never client-supplied."
        test_recipe:
          setup:
            - "Logical clock 2026-09-05T00:00:00Z. Supplier SUP-A ACTIVE."
          setup_api_calls:
            - &k_clock
              call: "POST /oversize-freight/_clock/set_current_utc"
              payload: { current_utc: "2026-09-05T00:00:00Z" }
              as: NetworkAdmin
            - &k_sup
              call: "POST /oversize-freight/suppliers"
              payload: { supplier_code: "SUP-A", legal_name: "Acme Furniture Co", drop_ship_enabled: false }
              as: NetworkAdmin
              captures: { sup_id: "$.data.id" }
          trigger:
            - &k_item
              call: "POST /oversize-freight/items"
              payload: { supplier_id: "${sup_id}", sku: "SKU-LG-1", dim_length_in: 40, dim_width_in: 40, dim_height_in: 20, weight_lb: 30, declared_value_cents: 80000, white_glove_eligible: true }
              as: NetworkAdmin
              captures: { item_id: "$.data.id" }
          assert:
            - "the response status is 201 and response_type is object"
            - "Item.${item_id}.cube_score == 52.52 and freight_class == LTL_250"
            - "Item.${item_id}.declared_girth_in == 140 and parcel_ok == true"
            - "Item.${item_id}.status == LISTED and version == 1"
            - "the response data carries non-null id, created_at and updated_at"

      - name: supplier_create_omitting_lead_time_defaults_to_3
        claim_type: Defaults
        grounds:
          - entities.Supplier.fields.lead_time_days
          - endpoints.POST_/oversize-freight/suppliers
        distinguishing_aspect: "lead_time_days declares default 3, so omitting it stores 3 (not null), while compliance_score, on_time_ship_rate and chargeback_rate initialize to 100.00 / 100.00 / 0.00 regardless of input."
        test_recipe:
          setup:
            - "Logical clock 2026-09-05T00:00:00Z. Empty database."
          setup_api_calls:
            - *k_clock
          trigger:
            - call: "POST /oversize-freight/suppliers"
              payload: { supplier_code: "SUP-DFT", legal_name: "Defaults Inc", drop_ship_enabled: true }
              as: NetworkAdmin
              captures: { sup_dft: "$.data.id" }
          assert:
            - "Supplier.${sup_dft}.lead_time_days == 3"
            - "Supplier.${sup_dft}.compliance_score == 100.00 and on_time_ship_rate == 100.00 and chargeback_rate == 0.00"
            - "Supplier.${sup_dft}.status == ACTIVE"

      - name: item_create_with_extra_computed_field_input_ignored
        claim_type: System Fields
        grounds:
          - entities.Item.fields.cube_score
          - endpoints.POST_/oversize-freight/items
        distinguishing_aspect: "cube_score is source: computed; a client that smuggles cube_score 999.99 and version 77 into the create payload has both ignored — the stored row carries the computed 52.52 and version 1."
        test_recipe:
          setup:
            - "Logical clock 2026-09-05T00:00:00Z. Supplier SUP-A ACTIVE."
          setup_api_calls:
            - *k_clock
            - *k_sup
          trigger:
            - call: "POST /oversize-freight/items"
              payload: { supplier_id: "${sup_id}", sku: "SKU-SMUG", dim_length_in: 40, dim_width_in: 40, dim_height_in: 20, weight_lb: 30, declared_value_cents: 80000, white_glove_eligible: true, cube_score: 999.99, version: 77 }
              as: NetworkAdmin
              captures: { item_smug: "$.data.id" }
          assert:
            - "the response status is 201"
            - "Item.${item_smug}.cube_score == 52.52 (computed), not 999.99"
            - "Item.${item_smug}.version == 1"

      - name: item_get_with_unknown_id_returns_not_found
        claim_type: Not Found
        grounds:
          - endpoints.GET_/oversize-freight/items/{itemId}
          - errors.ERR_NOT_FOUND
          - validations[priority=3]
        distinguishing_aspect: "A syntactically valid but unallocated UUID on the path produces the 404 ERR_NOT_FOUND envelope, not a 400 and not an empty 200."
        test_recipe:
          setup:
            - "Logical clock 2026-09-05T00:00:00Z. No items exist."
          setup_api_calls:
            - *k_clock
          trigger:
            - call: "GET /oversize-freight/items/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: NetworkAdmin
              captures: { err_404: "$.data.error_id" }
          assert:
            - "the response status is 404 and err_404 == ERR_NOT_FOUND"
            - "response_type is error and data carries both error_id and message"

      - name: order_create_missing_item_id_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.Order.fields.item_id
          - validations[priority=4]
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "item_id is a required input with no default; omitting it entirely is a 400 ERR_INVALID_REQUEST from the required-field check — not the 404 ERR_NOT_FOUND that a present-but-unknown item_id produces."
        test_recipe:
          setup:
            - "Logical clock 2026-09-05T00:00:00Z. Customer C1 in ZONE_NE."
          setup_api_calls:
            - *k_clock
            - &k_cust
              call: "POST /oversize-freight/customers"
              payload: { email: "c1@example.com", full_name: "Customer One", destination_zone: "ZONE_NE" }
              as: NetworkAdmin
              captures: { cust_id: "$.data.id" }
          trigger:
            - call: "POST /oversize-freight/orders"
              payload: { customer_id: "${cust_id}", service_level: "THRESHOLD" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err_req: "$.data.error_id" }
            - call: "POST /oversize-freight/orders"
              payload: { customer_id: "${cust_id}", item_id: "00000000-0000-4000-8000-000000000001", service_level: "THRESHOLD" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err_nf: "$.data.error_id" }
          assert:
            - "the first request returns 400 and err_req == ERR_INVALID_REQUEST"
            - "the second request returns 404 and err_nf == ERR_NOT_FOUND"
            - "GET /oversize-freight/orders?customer_id=${cust_id} returns 0 rows"

      - name: order_create_with_out_of_enum_service_level_returns_invalid_request
        claim_type: Type Constraints
        grounds:
          - entities.Order.fields.service_level
          - validations[priority=4]
          - errors.ERR_INVALID_REQUEST
        distinguishing_aspect: "service_level is a closed enum {THRESHOLD, ROOM_OF_CHOICE}; a value like WHITE_GLOVE is rejected 400 at priority 4 before any routing work happens."
        test_recipe:
          setup:
            - "Logical clock 2026-09-05T00:00:00Z. Supplier SUP-A, item-lg LISTED, customer C1."
          setup_api_calls:
            - *k_clock
            - *k_sup
            - *k_item
            - *k_cust
          trigger:
            - call: "POST /oversize-freight/orders"
              payload: { customer_id: "${cust_id}", item_id: "${item_id}", service_level: "WHITE_GLOVE" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { err_enum: "$.data.error_id" }
          assert:
            - "the response status is 400 and err_enum == ERR_INVALID_REQUEST"
            - "no Shipment was created: GET /oversize-freight/shipments returns 0 rows"

      - name: items_list_paginates_with_total_count_and_has_more
        claim_type: Listing
        grounds:
          - endpoints.GET_/oversize-freight/items
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With three items on file, limit=2&offset=0 returns 2 rows with total_count 3 and has_more true; offset=2 returns the final row with has_more false — total_count counts the filtered set, not the page."
        test_recipe:
          setup:
            - "Logical clock 2026-09-05T00:00:00Z. Supplier SUP-A with three items."
          setup_api_calls:
            - *k_clock
            - *k_sup
            - *k_item
            - call: "POST /oversize-freight/items"
              payload: { supplier_id: "${sup_id}", sku: "SKU-P2", dim_length_in: 20, dim_width_in: 16, dim_height_in: 12, weight_lb: 12, declared_value_cents: 9000, white_glove_eligible: false }
              as: NetworkAdmin
            - call: "POST /oversize-freight/items"
              payload: { supplier_id: "${sup_id}", sku: "SKU-P3", dim_length_in: 100, dim_width_in: 40, dim_height_in: 40, weight_lb: 60, declared_value_cents: 50000, white_glove_eligible: false }
              as: NetworkAdmin
          trigger:
            - call: "GET /oversize-freight/items"
              payload: { supplier_id: "${sup_id}", limit: 2, offset: 0 }
              as: NetworkAdmin
          assert:
            - "the response returns exactly 2 rows with total_count == 3 and has_more == true"
            - "GET /oversize-freight/items?supplier_id=${sup_id}&limit=2&offset=2 returns exactly 1 row with total_count == 3 and has_more == false"
            - "GET /oversize-freight/items?freight_class=LTL_250 returns exactly 1 row (the 40x40x20 item)"
            - "GET /oversize-freight/items with no parameters returns 3 rows with limit defaulting to 10 and offset to 0"

  # ===========================================================================
  - section: state_machines
    instances:

      - name: claim_settle_from_open_is_an_invalid_transition
        claim_type: invalid_transition
        grounds:
          - state_machines.DamageClaim
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "OPEN → SETTLED is not a declared transition; settling a claim that was never inspected fails 409 ERR_INVALID_STATE and leaves the claim OPEN with no Chargeback created."
        test_recipe:
          setup:
            - "Delivered network order for C1; claim opened but never inspected."
          setup_api_calls:
            - *k_clock
            - *k_sup
            - &k_hub
              call: "POST /oversize-freight/hubs"
              payload: { hub_code: "HUB-A", name: "Northeast Hub", serves_zones: ["ZONE_NE"], white_glove_capable: true, daily_capacity: 5 }
              as: NetworkAdmin
              captures: { hub_id: "$.data.id" }
            - &k_lane
              call: "POST /oversize-freight/freight-lanes"
              payload: { leg_mode: "LTL", dest_zone: "ZONE_NE", base_rate_cents: 40000, per_lb_rate_cents: 50, transit_days: 3 }
              as: NetworkAdmin
              captures: { lane_id: "$.data.id" }
            - *k_item
            - *k_cust
            - &k_linehaul
              call: "POST /oversize-freight/linehauls"
              payload: { hub_id: "${hub_id}", planned_arrival_date: "2026-09-10", origin_ship_date: "2026-09-07", capacity: 10 }
              as: NetworkAdmin
              captures: { lh_id: "$.data.id" }
            - &k_order
              call: "POST /oversize-freight/orders"
              payload: { customer_id: "${cust_id}", item_id: "${item_id}", service_level: "THRESHOLD" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_id: "$.data.id" }
            - &k_ship
              call: "GET /oversize-freight/shipments"
              payload: { order_id: "${order_id}" }
              as: NetworkAdmin
              captures: { ship_id: "$.data[0].id", ship_v0: "$.data[0].version" }
            - &k_depart
              call: "POST /oversize-freight/shipments/${ship_id}/depart"
              payload: {}
              as: CarrierRep
            - &k_lhdep
              call: "POST /oversize-freight/linehauls/${lh_id}/depart"
              payload: {}
              as: NetworkAdmin
            - &k_lharr
              call: "POST /oversize-freight/linehauls/${lh_id}/arrive"
              payload: {}
              as: HubOperator
            - &k_appt
              call: "POST /oversize-freight/appointments"
              payload: { shipment_id: "${ship_id}", window_start: "2026-09-12T09:00:00Z", window_end: "2026-09-12T13:00:00Z", crew_id: "CREW-1", expected_shipment_version: "${ship_v0}" }
              as: HubOperator
              captures: { appt_id: "$.data.id" }
            - &k_complete
              call: "POST /oversize-freight/appointments/${appt_id}/complete"
              payload: {}
              as: HubOperator
            - call: "POST /oversize-freight/damage-claims"
              payload: { shipment_id: "${ship_id}", claimant_role: "CUSTOMER", concealment: "CONCEALED" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { claim_s: "$.data.id" }
          trigger:
            - call: "POST /oversize-freight/damage-claims/${claim_s}/settle"
              payload: {}
              as: ClaimsAdjuster
              captures: { err_settle: "$.data.error_id" }
          assert:
            - "the response status is 409 and err_settle == ERR_INVALID_STATE"
            - "DamageClaim.${claim_s}.status remains OPEN"
            - "GET /oversize-freight/chargebacks?damage_claim_id=${claim_s} returns 0 rows"

      - name: withdrawn_claim_is_terminal_and_cannot_be_inspected
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.DamageClaim
          - errors.ERR_INVALID_STATE
        distinguishing_aspect: "WITHDRAWN is terminal: inspecting a withdrawn claim fails 409 ERR_INVALID_STATE, and a second withdraw also fails — no transition out of WITHDRAWN exists."
        test_recipe:
          setup:
            - "Delivered network order for C1; claim opened then withdrawn by the customer."
          setup_api_calls:
            - *k_clock
            - *k_sup
            - *k_hub
            - *k_lane
            - *k_item
            - *k_cust
            - *k_linehaul
            - *k_order
            - *k_ship
            - *k_depart
            - *k_lhdep
            - *k_lharr
            - *k_appt
            - *k_complete
            - call: "POST /oversize-freight/damage-claims"
              payload: { shipment_id: "${ship_id}", claimant_role: "CUSTOMER", concealment: "VISIBLE_AT_DELIVERY" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { claim_w: "$.data.id" }
            - call: "POST /oversize-freight/damage-claims/${claim_w}/withdraw"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
          trigger:
            - call: "POST /oversize-freight/damage-claims/${claim_w}/inspect"
              payload: { damage_pct: 10, is_structural: false, repair_cost_cents: 1000 }
              as: HubOperator
              captures: { err_w: "$.data.error_id" }
          assert:
            - "the response status is 409 and err_w == ERR_INVALID_STATE"
            - "DamageClaim.${claim_w}.status remains WITHDRAWN"

      - name: new_entities_start_in_declared_initial_states
        claim_type: initial_state
        grounds:
          - state_machines.Linehaul
          - state_machines.ReturnAuthorization
          - state_machines.DamageClaim
        distinguishing_aspect: "A created Linehaul reads PLANNED with committed_count 0; a created ReturnAuthorization reads REQUESTED with no disposition yet; a created DamageClaim reads OPEN with chargeback_amount_cents 0."
        test_recipe:
          setup:
            - "Delivered network order for C1 (base chain)."
          setup_api_calls:
            - *k_clock
            - *k_sup
            - *k_hub
            - *k_lane
            - *k_item
            - *k_cust
            - *k_linehaul
            - *k_order
            - *k_ship
            - *k_depart
            - *k_lhdep
            - *k_lharr
            - *k_appt
            - *k_complete
          trigger:
            - call: "POST /oversize-freight/linehauls"
              payload: { hub_id: "${hub_id}", planned_arrival_date: "2026-09-20", origin_ship_date: "2026-09-18", capacity: 8 }
              as: NetworkAdmin
              captures: { lh_new: "$.data.id" }
            - call: "POST /oversize-freight/return-authorizations"
              payload: { order_id: "${order_id}", reason: "DAMAGE" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ra_new: "$.data.id" }
            - call: "POST /oversize-freight/damage-claims"
              payload: { shipment_id: "${ship_id}", claimant_role: "HUB_INSPECTOR", concealment: "CONCEALED" }
              as: HubOperator
              captures: { claim_new: "$.data.id" }
          assert:
            - "Linehaul.${lh_new}.status == PLANNED and committed_count == 0"
            - "ReturnAuthorization.${ra_new}.status == REQUESTED and disposition is null"
            - "DamageClaim.${claim_new}.status == OPEN and chargeback_amount_cents == 0"

      - name: no_show_keeps_shipment_out_for_delivery_and_allows_rebooking
        claim_type: side_effect_execution
        grounds:
          - state_machines.DeliveryAppointment.BOOKED_to_NO_SHOW
          - entities.Shipment.fields.current_state
        distinguishing_aspect: "mark-no-show terminates the appointment (NO_SHOW) but leaves the Shipment OUT_FOR_DELIVERY, so a replacement appointment on the same crew window can be booked with the fresh OCC version."
        test_recipe:
          setup:
            - "Base network order with appointment appt1 BOOKED for 2026-09-12 09:00–13:00 on CREW-1."
          setup_api_calls:
            - *k_clock
            - *k_sup
            - *k_hub
            - *k_lane
            - *k_item
            - *k_cust
            - *k_linehaul
            - *k_order
            - *k_ship
            - *k_depart
            - *k_lhdep
            - *k_lharr
            - *k_appt
          trigger:
            - call: "POST /oversize-freight/appointments/${appt_id}/mark-no-show"
              payload: {}
              as: HubOperator
            - call: "GET /oversize-freight/shipments/${ship_id}"
              payload: {}
              as: NetworkAdmin
              captures: { ship_ns_state: "$.data.current_state", ship_ns_v: "$.data.version" }
            - call: "POST /oversize-freight/appointments"
              payload: { shipment_id: "${ship_id}", window_start: "2026-09-13T09:00:00Z", window_end: "2026-09-13T12:00:00Z", crew_id: "CREW-1", expected_shipment_version: "${ship_ns_v}" }
              as: HubOperator
              captures: { appt_re: "$.data.id" }
          assert:
            - "DeliveryAppointment.${appt_id}.status == NO_SHOW"
            - "ship_ns_state == OUT_FOR_DELIVERY (no-show does not revert the shipment to AT_HUB)"
            - "the rebooking succeeds (201) and DeliveryAppointment.${appt_re}.status == BOOKED"

      - name: linehaul_slot_release_on_cancel_is_invariant
        claim_type: compensation
        grounds:
          - state_machines.Order.ROUTED_to_CANCELLED
          - entities.Linehaul.fields.committed_count
        excluded_because:
          difficulty_instance: linehaul_slot_commit_release_conserves_capacity
          rationale: "Asserted as the conserved-quantity invariant of the named §1.8 compensating_invariant instance."

      - name: crew_window_overlap_and_back_to_back_semantics
        claim_type: guarded_transition
        grounds:
          - validations[priority=11]
          - errors.ERR_APPOINTMENT_OVERLAP
        excluded_because:
          difficulty_instance: crew_window_half_open_overlap
          rationale: "Exercised as the §1.8 resource_temporal_overlap instance (half-open crew windows)."

  # ===========================================================================
  - section: calculations
    instances:

      - name: shipping_price_ceil_weight_and_fee_split_literals
        claim_type: correct_result
        grounds:
          - calculations.shipping_price
          - calculations.order_fee_split
          - entities.Order.fields.oversized_surcharge_cents
        distinguishing_aspect: "Weight 30.4lb ceils to 31 for pricing (40000 + 50*31 = 41550), then the pinned evaluation order yields total 121550, surcharge 6078 (round_half_up of 6077.5), handling 9238 (8% of 115472) — any other order produces different cents."
        test_recipe:
          setup:
            - "Logical clock 2026-09-05T00:00:00Z. Item 40x40x20 weight 30.4 declared 80000c (LTL_250); LTL lane ZONE_NE base 40000c per-lb 50c transit 3; customer C1 ZONE_NE; hub and linehaul available."
          setup_api_calls:
            - *k_clock
            - *k_sup
            - *k_hub
            - *k_lane
            - call: "POST /oversize-freight/items"
              payload: { supplier_id: "${sup_id}", sku: "SKU-W30", dim_length_in: 40, dim_width_in: 40, dim_height_in: 20, weight_lb: 30.4, declared_value_cents: 80000, white_glove_eligible: false }
              as: NetworkAdmin
              captures: { item_w: "$.data.id" }
            - *k_cust
            - *k_linehaul
          trigger:
            - call: "POST /oversize-freight/orders"
              payload: { customer_id: "${cust_id}", item_id: "${item_w}", service_level: "THRESHOLD" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_w: "$.data.id" }
          assert:
            - "Order.${order_w}.shipping_amount_cents == 41550 (40000 + 50 * ceil(30.4))"
            - "Order.${order_w}.order_total_cents == 121550"
            - "Order.${order_w}.oversized_surcharge_cents == 6078 (round_half_up 121550 * 0.05)"
            - "Order.${order_w}.handling_fee_cents == 9238 (round_half_up (121550 - 6078) * 0.08)"

      - name: damage_triage_threshold_boundaries
        claim_type: correct_result
        grounds:
          - calculations.damage_triage
          - entities.DamageClaim.fields.resolution_type
        distinguishing_aspect: "Three boundary pins on one inspection: damage_pct exactly 40 (non-structural) does NOT force FULL_REPLACEMENT, damage_pct 41 does; repair_cost exactly 20000 (inclusive floor) resolves REPAIR while 19999 resolves REPLACEMENT_PART."
        test_recipe:
          setup:
            - "Delivered network order for C1; four claims opened on the same shipment."
          setup_api_calls:
            - *k_clock
            - *k_sup
            - *k_hub
            - *k_lane
            - *k_item
            - *k_cust
            - *k_linehaul
            - *k_order
            - *k_ship
            - *k_depart
            - *k_lhdep
            - *k_lharr
            - *k_appt
            - *k_complete
            - call: "POST /oversize-freight/damage-claims"
              payload: { shipment_id: "${ship_id}", claimant_role: "CUSTOMER", concealment: "CONCEALED" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { cl40: "$.data.id" }
            - call: "POST /oversize-freight/damage-claims"
              payload: { shipment_id: "${ship_id}", claimant_role: "CUSTOMER", concealment: "CONCEALED" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { cl41: "$.data.id" }
            - call: "POST /oversize-freight/damage-claims"
              payload: { shipment_id: "${ship_id}", claimant_role: "CUSTOMER", concealment: "CONCEALED" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { cl20k: "$.data.id" }
            - call: "POST /oversize-freight/damage-claims"
              payload: { shipment_id: "${ship_id}", claimant_role: "CUSTOMER", concealment: "CONCEALED" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { cl19k: "$.data.id" }
          trigger:
            - call: "POST /oversize-freight/damage-claims/${cl40}/inspect"
              payload: { damage_pct: 40, is_structural: false, repair_cost_cents: 15000 }
              as: HubOperator
            - call: "POST /oversize-freight/damage-claims/${cl41}/inspect"
              payload: { damage_pct: 41, is_structural: false, repair_cost_cents: 15000 }
              as: HubOperator
            - call: "POST /oversize-freight/damage-claims/${cl20k}/inspect"
              payload: { damage_pct: 20, is_structural: false, repair_cost_cents: 20000 }
              as: HubOperator
            - call: "POST /oversize-freight/damage-claims/${cl19k}/inspect"
              payload: { damage_pct: 20, is_structural: false, repair_cost_cents: 19999 }
              as: HubOperator
          assert:
            - "DamageClaim.${cl40}.resolution_type == REPLACEMENT_PART (40 is not > 40)"
            - "DamageClaim.${cl41}.resolution_type == FULL_REPLACEMENT (41 > 40)"
            - "DamageClaim.${cl20k}.resolution_type == REPAIR (20000 >= 20000 inclusive floor)"
            - "DamageClaim.${cl19k}.resolution_type == REPLACEMENT_PART (19999 < 20000)"

      - name: promised_date_base_and_parcel_branch_routing
        claim_type: correct_result
        grounds:
          - calculations.promised_date
          - calculations.routing_decision
          - entities.Shipment.fields.fulfillment_mode
        distinguishing_aspect: "A PARCEL_ELIGIBLE item (cube 25.70, girth 76 <= 165) with an ACTIVE parcel lane routes fulfillment_mode PARCEL with hub_id null and promised_date = creation + 2 + transit (2026-09-09 for transit 2); the OWNED_FINAL_MILE base instead adds a +1 hub-dwell day (2026-09-11 for transit 3)."
        test_recipe:
          setup:
            - "Logical clock 2026-09-05T00:00:00Z. Supplier SUP-A; small item (20x16x12, 12lb, declared 9000c); PARCEL lane ZONE_NE base 1500c per-lb 10c transit 2; LTL lane ZONE_NE transit 3; HUB-A; customer C1 ZONE_NE."
          setup_api_calls:
            - *k_clock
            - *k_sup
            - *k_hub
            - *k_lane
            - call: "POST /oversize-freight/freight-lanes"
              payload: { leg_mode: "PARCEL", dest_zone: "ZONE_NE", base_rate_cents: 1500, per_lb_rate_cents: 10, transit_days: 2 }
              as: NetworkAdmin
            - call: "POST /oversize-freight/items"
              payload: { supplier_id: "${sup_id}", sku: "SKU-SM-1", dim_length_in: 20, dim_width_in: 16, dim_height_in: 12, weight_lb: 12, declared_value_cents: 9000, white_glove_eligible: false }
              as: NetworkAdmin
              captures: { item_sm: "$.data.id" }
            - *k_cust
            - *k_linehaul
          trigger:
            - call: "POST /oversize-freight/orders"
              payload: { customer_id: "${cust_id}", item_id: "${item_sm}", service_level: "THRESHOLD" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_sm: "$.data.id" }
            - call: "GET /oversize-freight/shipments"
              payload: { order_id: "${order_sm}" }
              as: NetworkAdmin
              captures: { ship_sm: "$.data[0].id", ship_sm_mode: "$.data[0].fulfillment_mode", ship_sm_prom: "$.data[0].promised_date" }
            - call: "POST /oversize-freight/orders"
              payload: { customer_id: "${cust_id}", item_id: "${item_id}", service_level: "THRESHOLD" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { order_lg: "$.data.id" }
            - call: "GET /oversize-freight/shipments"
              payload: { order_id: "${order_lg}" }
              as: NetworkAdmin
              captures: { ship_lg_mode: "$.data[0].fulfillment_mode", ship_lg_prom: "$.data[0].promised_date" }
          assert:
            - "ship_sm_mode == PARCEL and Shipment.${ship_sm}.hub_id is null"
            - "ship_sm_prom == \"2026-09-09\" (2026-09-05 + 2 handling + 2 transit, no hub dwell)"
            - "Order.${order_sm}.shipping_amount_cents == 1620 (1500 + 10 * 12) and oversized_surcharge_cents == 0 (PARCEL_ELIGIBLE)"
            - "Order.${order_sm}.handling_fee_cents == 850 (round_half_up 10620 * 0.08)"
            - "ship_lg_mode == OWNED_FINAL_MILE and ship_lg_prom == \"2026-09-11\" (+1 hub dwell day)"

      - name: return_disposition_economics_and_tie_break
        claim_type: correct_result
        grounds:
          - calculations.return_disposition
          - entities.ReturnAuthorization.fields.disposition
        distinguishing_aspect: "With the LTL lane base 40000c the reverse-haul cost is 48000c: DAMAGE on a 250000c item (refurb 25000) disposes; BUYERS_REMORSE on a 300000c item (refurb 120000) returns to hub; DAMAGE on a 480000c item ties at 48000 and the tie resolves to FIELD_DISPOSAL."
        test_recipe:
          setup:
            - "Logical clock 2026-09-05T00:00:00Z. Supplier SUP-DS drop-ship enabled (lead_time_days 3). LTL lane ZONE_MA base 40000c per-lb 20c transit 4. Customer C3 in ZONE_MA."
            - "Three drop-ship items with declared values 250000c / 300000c / 480000c, each ordered with THRESHOLD and delivered via the drop-ship path."
          setup_api_calls:
            - *k_clock
            - call: "POST /oversize-freight/suppliers"
              payload: { supplier_code: "SUP-DS", legal_name: "Return Source Co", drop_ship_enabled: true, lead_time_days: 3 }
              as: NetworkAdmin
              captures: { sup_ds: "$.data.id" }
            - call: "POST /oversize-freight/freight-lanes"
              payload: { leg_mode: "LTL", dest_zone: "ZONE_MA", base_rate_cents: 40000, per_lb_rate_cents: 20, transit_days: 4 }
              as: NetworkAdmin
            - call: "POST /oversize-freight/items"
              payload: { supplier_id: "${sup_ds}", sku: "SKU-R1", dim_length_in: 40, dim_width_in: 40, dim_height_in: 20, weight_lb: 25, declared_value_cents: 250000, white_glove_eligible: false }
              as: NetworkAdmin
              captures: { item_r1: "$.data.id" }
            - call: "POST /oversize-freight/items"
              payload: { supplier_id: "${sup_ds}", sku: "SKU-R2", dim_length_in: 40, dim_width_in: 40, dim_height_in: 20, weight_lb: 25, declared_value_cents: 300000, white_glove_eligible: false }
              as: NetworkAdmin
              captures: { item_r2: "$.data.id" }
            - call: "POST /oversize-freight/items"
              payload: { supplier_id: "${sup_ds}", sku: "SKU-R3", dim_length_in: 40, dim_width_in: 40, dim_height_in: 20, weight_lb: 25, declared_value_cents: 480000, white_glove_eligible: false }
              as: NetworkAdmin
              captures: { item_r3: "$.data.id" }
            - call: "POST /oversize-freight/customers"
              payload: { email: "c3@example.com", full_name: "Customer Three", destination_zone: "ZONE_MA" }
              as: NetworkAdmin
              captures: { cust3_id: "$.data.id" }
            # deliver three drop-ship orders
            - call: "POST /oversize-freight/orders"
              payload: { customer_id: "${cust3_id}", item_id: "${item_r1}", service_level: "THRESHOLD" }
              as: Customer
              as_user_id: "${cust3_id}"
              captures: { o_r1: "$.data.id" }
            - call: "GET /oversize-freight/shipments"
              payload: { order_id: "${o_r1}" }
              as: NetworkAdmin
              captures: { s_r1: "$.data[0].id" }
            - call: "POST /oversize-freight/shipments/${s_r1}/depart"
              payload: {}
              as: SupplierRep
              as_user_id: "${sup_ds}"
            - call: "POST /oversize-freight/shipments/${s_r1}/deliver"
              payload: {}
              as: SupplierRep
              as_user_id: "${sup_ds}"
            - call: "POST /oversize-freight/orders"
              payload: { customer_id: "${cust3_id}", item_id: "${item_r2}", service_level: "THRESHOLD" }
              as: Customer
              as_user_id: "${cust3_id}"
              captures: { o_r2: "$.data.id" }
            - call: "GET /oversize-freight/shipments"
              payload: { order_id: "${o_r2}" }
              as: NetworkAdmin
              captures: { s_r2: "$.data[0].id" }
            - call: "POST /oversize-freight/shipments/${s_r2}/depart"
              payload: {}
              as: SupplierRep
              as_user_id: "${sup_ds}"
            - call: "POST /oversize-freight/shipments/${s_r2}/deliver"
              payload: {}
              as: SupplierRep
              as_user_id: "${sup_ds}"
            - call: "POST /oversize-freight/orders"
              payload: { customer_id: "${cust3_id}", item_id: "${item_r3}", service_level: "THRESHOLD" }
              as: Customer
              as_user_id: "${cust3_id}"
              captures: { o_r3: "$.data.id" }
            - call: "GET /oversize-freight/shipments"
              payload: { order_id: "${o_r3}" }
              as: NetworkAdmin
              captures: { s_r3: "$.data[0].id" }
            - call: "POST /oversize-freight/shipments/${s_r3}/depart"
              payload: {}
              as: SupplierRep
              as_user_id: "${sup_ds}"
            - call: "POST /oversize-freight/shipments/${s_r3}/deliver"
              payload: {}
              as: SupplierRep
              as_user_id: "${sup_ds}"
          trigger:
            - call: "POST /oversize-freight/return-authorizations"
              payload: { order_id: "${o_r1}", reason: "DAMAGE" }
              as: Customer
              as_user_id: "${cust3_id}"
              captures: { ra1: "$.data.id" }
            - call: "POST /oversize-freight/return-authorizations/${ra1}/approve"
              payload: {}
              as: NetworkAdmin
            - call: "POST /oversize-freight/return-authorizations"
              payload: { order_id: "${o_r2}", reason: "BUYERS_REMORSE" }
              as: Customer
              as_user_id: "${cust3_id}"
              captures: { ra2: "$.data.id" }
            - call: "POST /oversize-freight/return-authorizations/${ra2}/approve"
              payload: {}
              as: NetworkAdmin
            - call: "POST /oversize-freight/return-authorizations"
              payload: { order_id: "${o_r3}", reason: "DAMAGE" }
              as: Customer
              as_user_id: "${cust3_id}"
              captures: { ra3: "$.data.id" }
            - call: "POST /oversize-freight/return-authorizations/${ra3}/approve"
              payload: {}
              as: NetworkAdmin
          assert:
            - "ReturnAuthorization.${ra1}.reverse_haul_cost_cents == 48000 and refurb_value_cents == 25000 and disposition == FIELD_DISPOSAL"
            - "ReturnAuthorization.${ra2}.reverse_haul_cost_cents == 48000 and refurb_value_cents == 120000 and disposition == RETURN_TO_HUB"
            - "ReturnAuthorization.${ra3}.refurb_value_cents == 48000 == reverse_haul_cost_cents and disposition == FIELD_DISPOSAL (tie breaks to disposal)"

      - name: freight_class_boundary_exactly_40
        claim_type: correct_result
        grounds:
          - calculations.freight_class_assignment
        excluded_because:
