      - name: corner_wartime_requirement_is_checked_at_approval_time
        claim_type: error_triggerable
        grounds:
          - validations[priority=75]
          - errors[ERR_PROGRAM_WARTIME_REQUIRED]
          - calculations.wartime_service_days
        distinguishing_aspect: "A veteran who served 1985-01-01 to 1989-01-01 has wartime_service_days 0 because that span sits entirely between the declared wartime periods, so the application is accepted but the StateAuditor's APPROVE is refused with ERR_PROGRAM_WARTIME_REQUIRED (409); flipping requires_wartime to false by PATCH lets the identical APPROVE succeed."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z."
            - "rep_a ACTIVE COUNTY_CVSO."
            - "StateProgram prog PTX-2026-D, PROPERTY_TAX_EXEMPTION, fiscal_year 2026, min_rating_pct 0, requires_wartime true, annual_pool_cents 100000000, max_award_cents 10000000."
            - "Veteran vet served 1985-01-01 to 1989-01-01, HONORABLE, VERIFIED, screened, so wartime_service_days is 0."
            - "One SUBMITTED PROPERTY_TAX_EXEMPTION application with assessed_property_value_cents 8500000."
          setup_api_calls:
            - call: "POST /cvso/_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
            - call: "POST /cvso/representatives"
              payload: { full_name: "Dana Reyes", accreditation_number: "ACC-2849-701", accreditation_type: "COUNTY_CVSO", accreditation_expires_on: "2029-12-31" }
              as: SystemAdmin
              captures: { rep_a: $.data.id }
            - call: "POST /cvso/representatives/${rep_a}/accreditation"
              payload: { action: "ACTIVATE" }
              as: SystemAdmin
            - call: "POST /cvso/state-programs"
              payload: { program_code: "PTX-2026-D", program_name: "County Property Tax Exemption", program_type: "PROPERTY_TAX_EXEMPTION", fiscal_year: 2026, annual_pool_cents: 100000000, min_rating_pct: 0, requires_wartime: true, max_award_cents: 10000000 }
              as: SystemAdmin
              captures: { prog: $.data.id }
            - call: "GET /cvso/state-programs/${prog}"
              payload: {}
              as: SystemAdmin
              captures: { prog_v: $.data.version }
            - call: "POST /cvso/veterans"
              payload: { full_name: "Marta Quinn", date_of_birth: "1963-05-05", service_start_date: "1985-01-01", service_end_date: "1989-01-01", household_income_cents: 1500000, net_worth_cents: 2000000, dependent_count: 0, homeless_status: "NOT_HOMELESS", referral_source: "WALK_IN" }
              as: IntakeClerk
              captures: { vet: $.data.id }
            - call: "POST /cvso/veterans/${vet}/discharge-documents"
              payload: { document_type: "DD214", source: "VETERAN_PROVIDED", claimed_service_start: "1985-01-01", claimed_service_end: "1989-01-01", claimed_character_of_service: "HONORABLE" }
              as: IntakeClerk
              captures: { doc: $.data.id }
            - call: "POST /cvso/discharge-documents/${doc}/review"
              payload: { action: "VERIFY" }
              as: CountyOfficer
              as_user_id: "${rep_a}"
            - call: "POST /cvso/veterans/${vet}/screen"
              payload: {}
              as: CountyOfficer
              as_user_id: "${rep_a}"
              captures: { wd: $.data.wartime_service_days_at_screen }
            - call: "POST /cvso/state-benefit-applications"
              payload: { veteran_id: "${vet}", program_id: "${prog}", fiscal_year: 2026, expected_program_version: "${prog_v}", assessed_property_value_cents: 8500000 }
              as: IntakeClerk
              captures: { app: $.data.id }
          trigger:
            - call: "POST /cvso/state-benefit-applications/${app}/determination"
              payload: { action: "APPROVE" }
              as: StateAuditor
              captures: { err: $.data.error_id }
            - call: "PATCH /cvso/state-programs/${prog}"
              payload: { requires_wartime: false }
              as: SystemAdmin
            - call: "POST /cvso/state-benefit-applications/${app}/determination"
              payload: { action: "APPROVE" }
              as: StateAuditor
              captures: { dstatus: $.data.determination_status }
          assert:
            - "${wd} == 0"
            - "Veteran.${vet}.wartime_service_days == 0"
            - "${err} == ERR_PROGRAM_WARTIME_REQUIRED"
            - "HTTP status of the first determination call == 409"
            - "StateBenefitApplication.${app}.determination_status is still SUBMITTED right after the refusal"
            - "${dstatus} == APPROVED"

