        distinguishing_aspect: "The two 422 decline codes are audit-bearing - each writes a DECLINED row carrying its decline_reason_code, zeroed tender and the computed subtotals - whereas the 409 gate code writes nothing at all. Three failed sales therefore leave exactly two rows."
        test_recipe:
