            - { call: "GET /claims/${cl_id}/recovery-cases", payload: {}, as: RecoverySpecialist, captures: { rc_id: "$.data[0].id", rc_src: "$.data[0].source", rc_days: "$.data[0].unnecessary_days", rc_amt: "$.data[0].assessed_amount_cents" } }
            - { call: "GET /claims/${cl_id}", payload: {}, as: RecoverySpecialist, captures: { bal: $.data.recovery_balance_cents } }
          assert:
            - "Invoice.${inv_id}.status == DISPUTED"
            - "RecoveryCase created with source == INVOICE_DISPUTE, unnecessary_days == 2, assessed_amount_cents == 12000 (2 x min(6000, 6000)), status == OPEN"
            - "Claim.recovery_balance_cents == 12000 (claim aggregate updated by the case creation, not by the audit call directly)"
            - "GET /claims/${cl_id}/communication-logs contains an entry with template == RECOVERY_NOTICE"

  # ------------------------------------------------------------------ Rule 5
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: extension_create_state_beats_fiscal
        grounds:
          - validations[priority=8]
          - validations[priority=13]
          - errors[ERR_RESERVATION_INVALID_STATE]
          - errors[ERR_DURATION_CAP_EXHAUSTED]
        distinguishing_aspect: |
          Error-category pair state(8) vs business_fiscal(13): the extension
          create violates BOTH (reservation CANCELLED; claim cap fully consumed
          by the other 20-day reservation) and the state error
          ERR_RESERVATION_INVALID_STATE must win over ERR_DURATION_CAP_EXHAUSTED.
        test_recipe:
          setup:
            - "Claim (limit 6000, cap 20, reserve 120000) verified; R1 = STANDARD 2026-08-05..2026-08-25 (20 days == cap, estimate 120000) AUTHORIZED -> authorized_days_total == 20, cap_remaining == 0"
            - "R2 = STANDARD 2026-08-25..2026-08-26 created then cancelled -> status CANCELLED"
            - "A DELAY_REPORTED milestone (estimate 2026-08-28) exists on the shared repair order (milestone referential check passes)"
          setup_api_calls:
            - { call: "POST /policyholders", payload: { full_name: "Pat Holder", policy_number: "POL-100", contact_email: "pat@x.com" }, as: SystemAdmin, captures: { ph_id: $.data.id } }
            - { call: "POST /repair-shops", payload: { shop_name: "Ace Auto Body", shop_code: "SHOP-1" }, as: SystemAdmin, captures: { shop_id: $.data.id } }
            - { call: "POST /rental-partners", payload: { partner_name: "RentCo", partner_code: "RC-1", economy_rate_cents: 4500, standard_rate_cents: 6000, premium_rate_cents: 9000, economy_capacity: 2, standard_capacity: 2, premium_capacity: 1 }, as: SystemAdmin, captures: { rp_id: $.data.id } }
            - { call: "POST /claims", payload: { policyholder_id: "${ph_id}", incident_date: "2026-07-28", coverage_daily_limit_cents: 6000, coverage_duration_cap_days: 20, loss_of_use_per_diem_cents: 3500 }, as: ClaimsAdjuster, captures: { cl_id: $.data.id, cl_v: $.data.version } }
            - { call: "POST /coverage-verifications", payload: { claim_id: "${cl_id}", expected_claim_version: "${cl_v}" }, as: ClaimsAdjuster, captures: { cv_id: $.data.id } }
            - { call: "POST /coverage-verifications/${cv_id}/decide", payload: { decision: "VERIFIED", rental_eligible: true, loss_of_use_eligible: true }, as: ClaimsAdjuster }
            - { call: "POST /repair-orders", payload: { claim_id: "${cl_id}", estimated_completion_date: "2026-08-24", labor_hours_estimate: 40 }, as: RepairShop, as_user_id: "${shop_id}", captures: { ro_id: $.data.id } }
            - { call: "POST /repair-orders/${ro_id}/approve", payload: {}, as: ClaimsAdjuster }
            - { call: "POST /repair-orders/${ro_id}/start", payload: {}, as: RepairShop, as_user_id: "${shop_id}" }
            - { call: "GET /claims/${cl_id}", payload: {}, as: ClaimsAdjuster, captures: { cl_v3: $.data.version } }
            - { call: "POST /rental-reservations", payload: { claim_id: "${cl_id}", rental_partner_id: "${rp_id}", repair_order_id: "${ro_id}", vehicle_class: "STANDARD", pickup_date: "2026-08-05", authorized_return_date: "2026-08-25", expected_claim_version: "${cl_v3}" }, as: RentalDeskAgent, captures: { r1_id: $.data.id } }
            - { call: "POST /rental-reservations/${r1_id}/authorize", payload: {}, as: RentalDeskAgent }
            - { call: "GET /claims/${cl_id}", payload: {}, as: ClaimsAdjuster, captures: { cl_v4: $.data.version } }
            - { call: "POST /rental-reservations", payload: { claim_id: "${cl_id}", rental_partner_id: "${rp_id}", repair_order_id: "${ro_id}", vehicle_class: "STANDARD", pickup_date: "2026-08-25", authorized_return_date: "2026-08-26", expected_claim_version: "${cl_v4}" }, as: RentalDeskAgent, captures: { r2_id: $.data.id } }
            - { call: "POST /rental-reservations/${r2_id}/cancel", payload: {}, as: RentalDeskAgent }
            - { call: "POST /repair-orders/${ro_id}/milestones", payload: { milestone_type: "DELAY_REPORTED", new_estimated_completion_date: "2026-08-28" }, as: RepairShop, as_user_id: "${shop_id}", captures: { ms_id: $.data.id } }
            - { call: "GET /rental-reservations/${r2_id}", payload: {}, as: RentalDeskAgent, captures: { r2_v: $.data.version } }
          trigger:
            - { call: "POST /extension-requests", payload: { reservation_id: "${r2_id}", milestone_id: "${ms_id}", requested_additional_days: 1, expected_reservation_version: "${r2_v}" }, as: RentalDeskAgent, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_RESERVATION_INVALID_STATE  (state priority 8 beats business_fiscal priority 13)"
            - "error_id != ERR_DURATION_CAP_EXHAUSTED although cap_remaining == 0 (R1 consumes all 20 days)"
            - "GET /rental-reservations/${r2_id}/extension-requests returns total_count == 0 (no side effects escaped)"

      - name: booking_temporal_beats_referential
        grounds:
          - validations[priority=10]
          - validations[priority=11]
          - errors[ERR_PICKUP_DATE_IN_PAST]
          - errors[ERR_PARTNER_SUSPENDED]
        distinguishing_aspect: |
          Error-category pair business_temporal(10) vs business_referential(11)
          (a different pair than state-vs-fiscal): a booking with a past pickup
          date on a SUSPENDED partner must fail with ERR_PICKUP_DATE_IN_PAST,
          not ERR_PARTNER_SUSPENDED; the control arm (future pickup, same
          suspended partner) confirms the referential error is reachable.
        test_recipe:
          setup:
            - "Claim verified; partner RC-1 SUSPENDED; logical clock at 2026-08-05"
          setup_api_calls:
            - { call: "POST /policyholders", payload: { full_name: "Pat Holder", policy_number: "POL-100", contact_email: "pat@x.com" }, as: SystemAdmin, captures: { ph_id: $.data.id } }
            - { call: "POST /repair-shops", payload: { shop_name: "Ace Auto Body", shop_code: "SHOP-1" }, as: SystemAdmin, captures: { shop_id: $.data.id } }
            - { call: "POST /rental-partners", payload: { partner_name: "RentCo", partner_code: "RC-1", economy_rate_cents: 4500, standard_rate_cents: 6000, premium_rate_cents: 9000, economy_capacity: 2, standard_capacity: 1, premium_capacity: 1 }, as: SystemAdmin, captures: { rp_id: $.data.id } }
            - { call: "POST /claims", payload: { policyholder_id: "${ph_id}", incident_date: "2026-07-28", coverage_daily_limit_cents: 6000, coverage_duration_cap_days: 20, loss_of_use_per_diem_cents: 3500 }, as: ClaimsAdjuster, captures: { cl_id: $.data.id, cl_v: $.data.version } }
            - { call: "POST /coverage-verifications", payload: { claim_id: "${cl_id}", expected_claim_version: "${cl_v}" }, as: ClaimsAdjuster, captures: { cv_id: $.data.id } }
            - { call: "POST /coverage-verifications/${cv_id}/decide", payload: { decision: "VERIFIED", rental_eligible: true, loss_of_use_eligible: true }, as: ClaimsAdjuster }
            - { call: "POST /repair-orders", payload: { claim_id: "${cl_id}", estimated_completion_date: "2026-08-14", labor_hours_estimate: 12 }, as: RepairShop, as_user_id: "${shop_id}", captures: { ro_id: $.data.id } }
            - { call: "POST /repair-orders/${ro_id}/approve", payload: {}, as: ClaimsAdjuster }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T09:00:00Z" }, as: SystemAdmin }
            - { call: "POST /rental-partners/${rp_id}/suspend", payload: {}, as: SystemAdmin }
            - { call: "GET /claims/${cl_id}", payload: {}, as: ClaimsAdjuster, captures: { cl_v3: $.data.version } }
          trigger:
            - { call: "POST /rental-reservations", payload: { claim_id: "${cl_id}", rental_partner_id: "${rp_id}", repair_order_id: "${ro_id}", vehicle_class: "STANDARD", pickup_date: "2026-08-04", authorized_return_date: "2026-08-10", expected_claim_version: "${cl_v3}" }, as: RentalDeskAgent, captures: { err1: $.data.error_id } }
            - { call: "POST /rental-reservations", payload: { claim_id: "${cl_id}", rental_partner_id: "${rp_id}", repair_order_id: "${ro_id}", vehicle_class: "STANDARD", pickup_date: "2026-08-06", authorized_return_date: "2026-08-10", expected_claim_version: "${cl_v3}" }, as: RentalDeskAgent, captures: { err2: $.data.error_id } }
          assert:
            - "Dual-failure arm: error_id == ERR_PICKUP_DATE_IN_PAST (temporal 10 beats referential 11)"
            - "Control arm: error_id == ERR_PARTNER_SUSPENDED when pickup_date is not in the past"
            - "GET /claims/${cl_id}/rental-reservations returns total_count == 0"

  # ------------------------------------------------------------------ Rule 6
  - rule_id: boundary_precision_check
    instances:
      - name: extension_grant_at_cap_exactly
        grounds:
          - calculations.extension_day_grant
          - errors[ERR_DURATION_CAP_EXHAUSTED]
        distinguishing_aspect: |
          Metric = day-count threshold on the extension-approve endpoint.
          Granting exactly cap_remaining (authorized_days_total lands at exactly
          the cap 20, <= semantics) must SUCCEED, while a further extension with
          cap_remaining == 0 must fail with ERR_DURATION_CAP_EXHAUSTED — the
          >= vs > boundary is the test target.
        test_recipe:
          setup:
            - "Base fixture (cap 20); reservation ACTIVE with 10 authorized days; milestone pushes estimate to 2026-08-25 (days_needed 11)"
          setup_api_calls:
