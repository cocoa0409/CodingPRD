      - name: reciprocity_required_error_is_distinct_from_carrier_not_active
        claim_type: Violation → Error
        grounds:
          - errors.ERR_RECIPROCITY_REQUIRED
          - errors.ERR_CARRIER_NOT_ACTIVE
        distinguishing_aspect: "A SUSPENDED carrier's inquiry is not an error at the endpoint level — it is accepted (201) with report_blocked_reason RECIPROCITY — whereas a WITHDRAWN carrier's inquiry is a hard 409 ERR_CARRIER_NOT_ACTIVE; the two carrier non-active conditions diverge in observability."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z; ExchangeRule defaults. Carrier B11 ACTIVE (batch 2026-09-01 for consumer Ned); clock advanced to 2026-10-17 (lag 46 -> SUSPENDED)."
          setup_api_calls:
            - *k_clock
            - *k_rules
            - &k_carrier_b11
              call: "POST /carriers"
              payload: { legal_name: "Nacogdoches Mutual", naic_code: "90021" }
              as: PlatformAdmin
              captures: { cb11_id: $.data.id }
            - &k_consumer_ned
              call: "POST /consumers"
              payload: { full_name: "Ned Nance", date_of_birth: "1977-04-18", address_line: "9 Neches St, Nacogdoches TX", driver_license_number: "NED-1" }
              as: PlatformAdmin
              captures: { cned_id: $.data.id }
            - call: "POST /carriers/${cb11_id}/batches"
              payload:
                claims:
                  - { consumer_id: "${cned_id}", policy_number: "PN-11", claim_number: "N11-1", loss_date: "2025-09-09", loss_type: "OTHER", cause_of_loss_code: "NN1", paid_amount_cents: 6000, claim_status_code: "CLOSED_WITH_PAYMENT", vehicle_identifier: "" }
