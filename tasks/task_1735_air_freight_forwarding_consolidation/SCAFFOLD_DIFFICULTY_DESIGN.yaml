            - { call: "POST /air-freight/master-waybills", payload: { booking_id: "${bk1}", mawb_number: "180-12345675" }, as: CapacityPlanner, captures: { mb1: "$.data.id" } }
            - { call: "POST /air-freight/master-waybills/${mb1}/open", as: CapacityPlanner }
            - { call: "POST /air-freight/house-waybills", payload: { shipper_id: "${sh1}", hwb_number: "HWB-C9", origin_code: "SFO", destination_code: "NRT", pieces: 5, gross_weight_kg: 80.0, declared_volume_m3: 0.60, dg_flag: false, declared_value_amount: 0, declared_value_surcharge_paid: false }, as: ForwarderOps, captures: { hw1: "$.data.id" } }
            - { call: "POST /air-freight/house-waybills/${hw1}/submit", as: ForwarderOps, as_user_id: "ops-1" }
