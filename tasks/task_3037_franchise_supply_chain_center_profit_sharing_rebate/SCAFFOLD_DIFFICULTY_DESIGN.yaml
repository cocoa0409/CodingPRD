  - rule_id: boundary_precision_check
    instances:

      - name: food_cost_variance_yellow_boundary
        grounds:
          - calculations.food_cost_variance
          - entities.FoodCostVariance.fields.severity
        distinguishing_aspect: |
          variance_pct boundary at 0.05 (GREEN threshold): a PO with variance_pct
          exactly 0.05 must yield GREEN (<=, not <), while 0.0501 yields YELLOW.
          This is a numeric threshold on the variance metric.
        test_recipe:
          setup:
            - "Center ACTIVE. One Store ACTIVE. Variance analysis for week with theoretical=100000c actual=105000c (variance=0.05 exactly)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
