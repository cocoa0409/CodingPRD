          trigger:
            - call: "POST /upfit/equipment-installations"
              payload: { upfit_order_id: "${uo}", equipment_spec_id: "${eq_crane}", mount_cg_from_front_axle_in: 208, hydraulic_circuit: "PRIMARY" }
              as: InstallTechnician
              as_user_id: "tech-1"
              captures: { inst: "$.data.id" }
            - call: "POST /upfit/weight-certifications"
              payload: { upfit_order_id: "${uo}", basis: "AS_MEASURED", expected_upfit_order_version: "${uo_v}" }
              as: UpfitEngineer
              as_user_id: "eng-1"
              captures: { wc: "$.data.id" }
            - call: "POST /upfit/weight-certifications/${wc}/approve"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
              captures: { wc_status: "$.data.status" }
          assert:
            - "the installation response is already fully derived: EquipmentInstallation.${inst}.status == \"PLANNED\", hydraulic_status == \"OK\" and allocated_flow_gpm == 8 — the waterfall ran inside the same request, not afterwards"
            - "the parent ledgers are visible without any further write: GET /upfit/upfit-orders/${uo} immediately reports committed_pto_flow_gpm 8 and committed_aux_amp_draw 22 (body 12 + crane 10)"
            - "the certification response carries its own computed weights in the create response: front_axle_load_lb, rear_axle_load_lb, gvw_lb, payload_capacity_lb and included_component_count are all populated on the 201, not null-then-filled"
            - "the approve response shows the certification's new status \"APPROVED\" and the very same response's parent read agrees: GET /upfit/upfit-orders/${uo} reports compliance_status \"MEASURED_CERTIFIED\" with no intervening call"
            - "read-after-write equality holds field for field: GET /upfit/equipment-installations/${inst} and GET /upfit/weight-certifications/${wc} return bodies identical to the create/approve responses except for updated_at and version"
            - "GET /upfit/upfit-orders/${uo}/weight-projection?basis=AS_MEASURED, issued right after the installation, already includes the crane in its item set (count 1) — the projection reads live state rather than a cached snapshot"
