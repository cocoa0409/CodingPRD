  - rule_id: transitive_cascade
    instances:

      - name: finalized_major_assessment_cascades_four_levels_to_slot_staffing
        grounds:
          - state_machines.DamageAssessment.FILED_to_FINALIZED
          - state_machines.Reservation.DAMAGE_REVIEW_to_SETTLED
          - state_machines.Producer.ACTIVE_to_SUSPENDED
          - state_machines.Reservation.CONFIRMED_to_CANCELLED
          - state_machines.CrewAssignment.CONFIRMED_to_RELEASED
          - calculations.damage_penalty_assessment
          - calculations.crew_staffing_readiness
          - constants.SUSPENSION_THRESHOLD_POINTS
          - constants.REPAIR_ESCALATION_CENTS
        distinguishing_aspect: |
          Depth 4 from a single finalize call, and each link exists only because
          the previous one fired: finalizing the assessment settles the
          reservation, the settled penalty pushes the producer to the suspension
          threshold, the suspension cancels the producer's other reservation and
          releases the crew commitment, and the release is what drops the
          playback slot out of READY. Trigger endpoint is
          POST /damage-assessments/{assessmentId}/finalize.
