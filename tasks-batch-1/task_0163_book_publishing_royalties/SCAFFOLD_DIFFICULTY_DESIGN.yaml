            - call: "POST /sales-periods/${p1_id}/sales-records"
              payload: { format_id: "${format_id}", units_sold: 10, units_returned: 0 }
              as: Publisher
              captures: { err: $.data.error_id }
          assert:
            - "Title.${title_id}.status == OUT_OF_PRINT"
            - "Format.${format_id}.active == false (cascade from retire)"
            - "POST sales-records returns 409 ERR_PERIOD_NOT_OPEN (inactive format)"

  # ===================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # ===================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: existence_before_state_on_finalize
        grounds:
          - validations[priority=3]
          - validations[priority=8]
          - errors[ERR_NOT_FOUND]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          Error-category pair existence(404) vs state(409): finalizing a non-existent statement id returns
          ERR_NOT_FOUND (priority 3), never ERR_INVALID_STATE (priority 8) — existence is checked before state.
        test_recipe:
          setup:
            - "A contract exists (so a real version can be read), but no statement with the queried id exists."
          setup_api_calls:
            - call: "POST /authors"
              payload: { full_name: "Exist Auth", email: "existauth@x.com" }
              as: Publisher
              captures: { author_id: $.data.id }
            - call: "POST /contracts"
              payload: { author_id: "${author_id}", advance_cents: 0 }
              as: Publisher
              captures: { contract_id: $.data.id, cv: $.data.version }
          trigger:
            - call: "POST /statements/00000000-0000-4000-8000-000000000999/finalize"
              payload: { expected_contract_version: "${cv}" }
              as: Publisher
              captures: { err: $.data.error_id }
          assert:
            - "response status == 404"
            - "data.error_id == ERR_NOT_FOUND (existence checked at priority 3, before any OCC at priority 15)"

      - name: period_sequence_temporal_before_state_on_close
        grounds:
          - validations[priority=11]
          - validations[priority=8]
          - errors[ERR_PERIOD_SEQUENCE_VIOLATION]
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          Error-category pair business_temporal(409 ERR_PERIOD_SEQUENCE_VIOLATION) vs state(409 ERR_INVALID_STATE),
          a different pair than instance 1: closing period seq2 while seq1 is still OPEN (not STATEMENTED) — both the
          sequence-ordering temporal rule (priority 11) and any state framing apply, and the temporal rule wins.
        test_recipe:
          setup:
            - "ACTIVE contract C with periods seq1 (OPEN, never statemented) and seq2 (OPEN)."
          setup_api_calls:
            - call: "POST /authors"
              payload: { full_name: "A Nine", email: "a9@x.com" }
              as: Publisher
              captures: { author_id: $.data.id }
            - call: "POST /contracts"
              payload: { author_id: "${author_id}", advance_cents: 0, reserve_pct: 0, reserve_hold_periods: 1 }
              as: Publisher
              captures: { contract_id: $.data.id }
            - call: "POST /contracts/${contract_id}/royalty-tiers"
              payload: { lower_unit: 1, rate: 0.10 }
              as: Publisher
            - call: "POST /contracts/${contract_id}/titles"
              payload: { name: "Book Nine" }
              as: Publisher
              captures: { title_id: $.data.id }
            - call: "POST /titles/${title_id}/formats"
              payload: { format_type: "HARDCOVER", list_price_cents: 3000 }
              as: Publisher
              captures: { format_id: $.data.id }
            - call: "POST /contracts/${contract_id}/activate"
              payload: {}
              as: Publisher
            - call: "POST /contracts/${contract_id}/sales-periods"
              payload: { label: "P1", sequence: 1 }
              as: Publisher
              captures: { p1_id: $.data.id }
            - call: "POST /contracts/${contract_id}/sales-periods"
              payload: { label: "P2", sequence: 2 }
              as: Publisher
              captures: { p2_id: $.data.id }
          trigger:
            - call: "POST /sales-periods/${p2_id}/close"
              payload: {}
              as: Publisher
              captures: { err: $.data.error_id }
          assert:
            - "response status == 409"
            - "data.error_id == ERR_PERIOD_SEQUENCE_VIOLATION"

  # ===================================================================
