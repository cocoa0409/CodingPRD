              captures: { s_id: $.data.id, s_v: $.data.version }
          trigger:
            - call: "POST /creamery/suppliers/${s_id}/commitments"
              payload: { ingredient_category: "VANILLA", fair_trade_required: true, min_social_score: 60, premium_over_commodity_pct: 5, effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z", expected_supplier_version: "${s_v}" }
              as: SourcingManager
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_SUPPLIER_NOT_APPROVED (HTTP 409)"

      - name: payment_create_requires_assessed_enrollment
        claim_type: precondition_enforcement
        grounds: [state_machines.FarmProgramEnrollment, "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "Premium payments require the enrollment ASSESSED (blended_score present); an ENROLLED-only farm rejects payment creation."
        test_recipe:
