              as: Consumer
              as_user_id: "${cons_id}"
              captures: { q_early: $.data.id }
            - call: "POST /quotes"
              payload: { consumer_id: "${cons_id}", product_id: "${p_auto}", channel: "DIRECT", coverages: [{ coverage_code: "LIABILITY", tier: "BASIC" }] }
              as: Consumer
              as_user_id: "${cons_id}"
              captures: { q_late: $.data.id }
            - call: "POST /quotes/${q_early}/submit"
              payload: {}
              as: Consumer
              as_user_id: "${cons_id}"
            - call: "POST /quotes/${q_late}/submit"
              payload: {}
              as: Consumer
              as_user_id: "${cons_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-30T23:59:59Z" }
              as: CarrierAdmin
            - call: "POST /quotes/${q_early}/bind"
              payload: {}
              as: Consumer
              as_user_id: "${cons_id}"
              captures: { pol_ok: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-31T00:00:00Z" }
              as: CarrierAdmin
          trigger:
