      - name: occ_trip_book_stale_version_conflict
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[trip-book-stale-trip]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "A trip booking carrying a stale DiveTrip version (after another booking advanced it) is rejected with ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["A boat capacity 5; an OPEN trip min_cert OPEN_WATER; two OPEN_WATER-certified divers; one booking already placed advancing DiveTrip.version."]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-06-01T00:00:00Z" }
              as: ShopAdmin
            - call: "POST /boats"
              payload: { name: "Occ Boat", capacity: 5 }
              as: ShopAdmin
              captures: { boat_id: $.data.id }
            - call: "POST /dive-trips"
              payload: { boat_id: "${boat_id}", starts_at: "2026-06-25T08:00:00Z", ends_at: "2026-06-25T12:00:00Z", min_cert_level: "OPEN_WATER", base_fare_cents: 10000, fill_addon_cents: 0 }
              as: ShopAdmin
