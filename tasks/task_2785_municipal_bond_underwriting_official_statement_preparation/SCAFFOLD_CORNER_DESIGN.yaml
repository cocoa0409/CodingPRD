      - name: order_placed_after_the_window_closes_rejected
        claim_type: temporal_validation
        grounds:
          - validations[order-window-open] (priority 14, category business_temporal)
          - errors[ERR_ORDER_PERIOD_WINDOW_CLOSED]
        distinguishing_aspect: |
          The window is half-open: an order at exactly closes_at must be refused with
          ERR_ORDER_PERIOD_WINDOW_CLOSED even though the period is still OPEN (nothing has
          closed it), which separates the temporal rule from the state rule. The identical order
          one millisecond earlier succeeds, and the OCC token stays valid across the refusal.
        test_recipe:
          setup:
            - "A NEGOTIATED deal of 5,000,000 has an OPEN institutional period for 13:00-17:00 and one ACTIVE SENIOR_MANAGER."
            - "The logical clock is moved to exactly 2026-08-05T17:00:00.000Z, the period's closes_at, after the period was opened at 14:00."
