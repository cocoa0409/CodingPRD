              captures: { obs_a_id: $.data.id }
            - call: "POST /rmd/traffic-observations"
              payload: { provider_id: "${prov_id}", customer_id: "${cust_b_id}", window_start: "2026-07-01T00:00:00Z", window_end: "2026-07-02T00:00:00Z", total_call_count: 1000, short_duration_call_count: 1000, unanswered_call_count: 1000, complaint_count: 9 }
              as: ProviderAdmin
