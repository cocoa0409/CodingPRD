    roles: [DepotPlanner]
    code: 200
    input: []
    output: CrossDockRun
    side_effects:
      - "all PROPOSED allocations -> VOIDED (void_reason='RUN_CANCELLED')"
      - "their pallets ALLOCATED -> RECEIVED"
      - "club slot counts decremented; postures recomputed"
      - "run -> CANCELLED"

