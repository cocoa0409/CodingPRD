        distinguishing_aspect: |
          Resource: Facility field grid. Interval semantics: half-open [start_minute, end_minute)
          with adjacency allowed — application B starting exactly when A ends (1200 == 1200) does
          NOT conflict, while application C overlapping by 30 minutes is WAITLISTED SLOT_CONFLICT.
        test_recipe:
          setup:
            - "Three orgs (identical scores 103, decided by created_at order A,B,C) applying 2026-08-10: A 18:00-20:00, B 20:00-22:00, C 19:30-21:00, no lights"
