      - call: POST /broadcasters
        payload:
          legal_name: B
          home_territory: US
          platform_classes:
          - LINEAR_TV
          credit_rating: INVESTMENT_GRADE
        as: RightsManager
        captures:
          b_id: $.data.id
      - call: POST /broadcasters/${b_id}/accredit
        payload: {}
        as: RightsManager
      - call: POST /packages
        payload:
          package_code: SM1-A
          territory_code: US
          platform_class: LINEAR_TV
          window_start: '2026-01-01T00:00:00Z'
          window_end: '2026-12-31T23:59:59Z'
          exclusivity_class: EXCLUSIVE
          minimum_bid_cents: 1000000
          games_committed: 5
          asset_id: ${asset_id}
        as: RightsManager
        captures:
          pkg_id: $.data.id
      - call: POST /rights-assets/${asset_id}/lock-packages
        payload: {}
        as: RightsManager
      - call: POST /packages/${pkg_id}/bids
        payload:
          bidder_id: ${b_id}
          offered_fee_cents: 1000000
          upfront_pct: 0.1
          escalator_rate_pct: 0.0
          minimum_growth_pct: 0.0
          fee_cap_cents: 2000000
          production_commitment_games: 5
          audience_commitment_pct: 0.5
          exclusivity_request: MATCH_PACKAGE
        as: BidCoordinator
        as_user_id: ${b_id}
        captures:
          bid_id: $.data.id
      trigger:
      - call: POST /packages/${pkg_id}/bids/${bid_id}/shortlist
        payload: {}
        as: RightsManager
        captures:
          err: $.data.error_id
      assert:
      - err == ERR_BID_NOT_UNDER_REVIEW
      - Bid.${bid_id}.status == DRAFT (unchanged)
  - name: terminal_state_lockdown_bid_accepted
    claim_type: terminal_state_lockdown
    grounds:
    - state_machines.Bid
    distinguishing_aspect: Once Bid reaches ACCEPTED terminal state, no further transitions
      permitted
    test_recipe:
      setup:
      - Bid already ACCEPTED via full award flow
      setup_api_calls:
      - call: POST /rights-assets
        payload:
          asset_code: SM2
          competition_name: SM2
          season_label: '2026'
          season_start_date: '2026-01-01T00:00:00Z'
          season_end_date: '2026-12-31T23:59:59Z'
