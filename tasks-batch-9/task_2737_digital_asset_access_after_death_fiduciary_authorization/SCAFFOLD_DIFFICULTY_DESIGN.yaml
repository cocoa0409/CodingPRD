            - "after the EXECUTE: Estate.${est_id}.administration_phase == WIND_DOWN"
            - "after the EXECUTE: Estate.${est_id}.assets_disposed_count == 1 and assets_pending_disposition_count == 0"
            - "after the REVERSE: Estate.${est_id}.administration_phase == DISCLOSURE"
            - "after the REVERSE: Estate.${est_id}.assets_disposed_count == 0 and assets_pending_disposition_count == 1"
            - "after the REVERSE: DigitalAsset.${a_id}.disposition_status == PENDING and disposed_at == null"
            - "after the REVERSE: DispositionElection.${el_id}.status == REVERSED"
            - "after the second EXECUTE: Estate.${est_id}.administration_phase == WIND_DOWN"
            - "after the close: Estate.${est_id}.administration_phase == CLOSED and closed_at is not null"
            - "Estate.${est_id}.inventory_total_count == 1"
            - "a further POST /estates/${est_id}/digital-assets after the close returns HTTP 409 with error_id ERR_ESTATE_CLOSED"
            - "a REVERSE of ${el2_id} after the close returns HTTP 409 with error_id ERR_ESTATE_CLOSED"

  # ===========================================================================
  - rule_id: transitive_cascade
    instances:

      - name: approval_cascades_grant_to_disclosure_to_cancellation_order_to_estate_counters
        grounds:
          - state_machines.PlatformRequest.transitions[UNDER_REVIEW->APPROVED]
          - state_machines.DigitalAsset.transitions[access_status UNVERIFIED->CATALOG_DISCLOSED]
          - entities.CancellationOrder.fields.refund_policy_snapshot
          - entities.Estate.fields.disclosed_asset_count
          - entities.Estate.fields.open_cancellation_count
          - calculations.asset_disclosure_level
          - calculations.estate_administration_phase
        distinguishing_aspect: |
          One DECIDE call propagates four hops deep across four entities — AuthorityGrant created
          (hop 1), two DigitalAssets disclosed (hop 2), a CancellationOrder auto-created for the
          SUBSCRIPTION asset only (hop 3, itself caused by hop 2), and Estate counters plus
          administration_phase re-derived (hop 4) — and hop 3 is conditional on hop 2's per-asset
          outcome, so the CLOUD_STORAGE asset disclosed in the same hop gets no order.
        test_recipe:
          setup:
            - "clock at 2026-08-01T00:00:00Z; one platform StreamOne with refund_policy PRORATA_DAILY"
            - "one estate with a VERIFIED death certificate and VERIFIED letters naming an EXECUTOR"
            - "no AuthorityDirective at all, so the statutory default applies"
            - "two assets on StreamOne: a SUBSCRIPTION asset (with a SubscriptionTerm) and a CLOUD_STORAGE asset"
            - "one CATALOG_ACCESS request advanced to UNDER_REVIEW"
          setup_api_calls:
