      - 'after the grant create: Agency.${agency_epa_id}.reuse_grant_count == 1, open_notice_count == 0'
      - 'after the deficient close: open_notice_count == 1 (${epa_notices}) and ReuseGrant.${grant_epa_id}.notice_count ==
