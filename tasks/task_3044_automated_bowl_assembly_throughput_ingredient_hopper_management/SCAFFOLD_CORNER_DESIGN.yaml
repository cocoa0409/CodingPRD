            - call: "POST /api/hoppers/${h1}/load"
              payload: { load_grams: 300, expected_hopper_version: "${h1_v}" }
              as: LineOperator
            - call: "POST /api/prep-batches"
              payload: { restaurant_id: "${r1}", ingredient_id: "${ing}", quantity_grams: 300 }
              as: PrepCook
              captures: { b_old: $.data.id }
            - call: "POST /api/prep-batches/${b_old}/mark-ready"
              payload: {}
              as: PrepCook
            - call: "POST /api/hoppers/${h1}/sensor-reading"
              payload: { grams_reading: 0 }
              as: LineOperator
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T01:00:00Z" }
              as: OpsAdmin
            - call: "POST /api/prep-batches"
              payload: { restaurant_id: "${r1}", ingredient_id: "${ing}", quantity_grams: 1000 }
              as: PrepCook
              captures: { b_new: $.data.id }
            - call: "POST /api/prep-batches/${b_new}/mark-ready"
              payload: {}
              as: PrepCook
          trigger:
            - call: "GET /api/hoppers/${h1}/refill-tasks"
              payload: {}
              as: LineOperator
              captures: { t_alloc: $.data.0.allocated_grams, t_batch: $.data.0.prep_batch_id, t_status: $.data.0.status }
          assert:
            - "task allocated from B_old (FEFO — expires 02:00 before B_new's 03:00): prep_batch_id == ${b_old}"
            - "allocated_grams == 300.0 (partial: min(500 requested, 300 available)) and status == READY"
            - "PrepBatch.${b_old}.available_grams == 0 after allocation"

  # ==========================================================================
  # Section: validations
  # ==========================================================================
  - section: validations
    instances:
      - name: missing_auth_headers_returns_401
        claim_type: violation_to_error
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request without X-User-Role/X-User-ID headers is rejected with ERR_UNAUTHENTICATED (401) before any other check."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "GET /api/restaurants"
              payload: {}
              as: ""
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_UNAUTHENTICATED with http 401"
      - name: nonexistent_recipe_in_order_body_returns_404
        claim_type: violation_to_error
        grounds: ["validations[priority=4]", "errors[ERR_NOT_FOUND]"]
        distinguishing_aspect: "POST /api/orders with a random recipe_id UUID returns ERR_NOT_FOUND (404) from the body-existence check, not a validation error."
