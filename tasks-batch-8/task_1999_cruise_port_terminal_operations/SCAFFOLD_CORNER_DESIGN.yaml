# =============================================================================
# Task 1999 — §1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# All recipes start from empty-DB. Logical clock default: 2026-08-01T00:00:00Z.
# =============================================================================
scaffold_corner_design:
  # ============================================================ entities ====
  - section: entities
    instances:
      - name: terminal_creation_applies_defaults
        claim_type: creation
        grounds:
          - entities.Terminal.fields.posture
          - entities.Terminal.fields.ops_run_index
        distinguishing_aspect: "A freshly created terminal starts posture=OPERATIONAL, ops_run_index=0, all berth counts 0, version 1."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls:
            - { call: "POST /port-ops/terminals", payload: { name: "T1", max_apron_slots: 4, taxi_dispatch_capacity_per_window: 2 }, as: PortAuthorityAdmin, captures: { term: $.data.id, posture: $.data.posture, ops: $.data.ops_run_index, freeb: $.data.free_berth_count, ver: $.data.version } }
          trigger:
            - { call: "GET /port-ops/terminals/${term}", as: Harbormaster }
          assert:
            - "posture == OPERATIONAL and ops == 0 and freeb == 0 and ver == 1"
            - "GET returns identical computed fields (immediate consistency)"
      - name: berth_get_not_found_returns_404
        claim_type: not_found
        grounds:
          - errors[ERR_NOT_FOUND]
          - validations[priority=3]
        distinguishing_aspect: "GET with a well-formed but unknown UUID yields ERR_NOT_FOUND (404)."
        test_recipe:
          setup: ["one terminal exists"]
          setup_api_calls:
            - { call: "POST /port-ops/terminals", payload: { name: "T1", max_apron_slots: 4, taxi_dispatch_capacity_per_window: 2 }, as: PortAuthorityAdmin }
          trigger:
            - { call: "GET /port-ops/berths/00000000-0000-0000-0000-000000000000", as: Harbormaster, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_NOT_FOUND and HTTP status 404"
      - name: terminal_missing_required_field_returns_400
        claim_type: required_fields
        grounds:
          - errors[ERR_VALIDATION]
          - validations[priority=6]
        distinguishing_aspect: "Omitting required max_apron_slots / taxi_dispatch_capacity_per_window is rejected ERR_VALIDATION (400) before any persistence."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /port-ops/terminals", payload: { name: "T1" }, as: PortAuthorityAdmin, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_VALIDATION"
            - "GET /port-ops/terminals afterwards returns total_count 0 (nothing persisted)"
      - name: manifest_entry_invalid_enum_returns_400
        claim_type: type_constraints
        grounds:
          - entities.ManifestEntry.fields.direction
          - errors[ERR_VALIDATION]
        distinguishing_aspect: "direction outside {EMBARK, DEBARK} is rejected ERR_VALIDATION."
        test_recipe:
          setup: ["Terminal, vessel, call V1 SCHEDULED"]
          setup_api_calls:
            - { call: "POST /port-ops/terminals", payload: { name: "T1", max_apron_slots: 4, taxi_dispatch_capacity_per_window: 2 }, as: PortAuthorityAdmin, captures: { term: $.data.id } }
            - { call: "POST /port-ops/vessels", payload: { terminal_id: "${term}", name: "MV A", loa_ft: 950, draft_ft: 30.0, pax_capacity: 4000, crew_count: 900 }, as: PortAuthorityAdmin, captures: { ves: $.data.id } }
            - { call: "POST /port-ops/port-calls", payload: { terminal_id: "${term}", vessel_id: "${ves}", voyage_ref: "V1", scheduled_eta: "2026-08-10T08:00:00Z", scheduled_etd: "2026-08-10T20:00:00Z", booked_embark_pax: 10, booked_debark_pax: 10 }, as: VesselAgent, as_user_id: "${ves}", captures: { pc: $.data.id } }
          trigger:
            - { call: "POST /port-ops/port-calls/${pc}/manifest-entries", payload: { passenger_ref: "P1", direction: "SIDEWAYS", cabin_class: "STANDARD" }, as: VesselAgent, as_user_id: "${ves}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_VALIDATION (400)"
      - name: port_call_computed_field_input_ignored
        claim_type: computed_fields
        grounds:
          - entities.PortCall.fields.passengers_aboard
          - entities.PortCall.fields.bags_aboard
        distinguishing_aspect: "Client-supplied passengers_aboard/bags_aboard on create are ignored; both compute to 0."
        test_recipe:
          setup: ["Terminal and vessel exist"]
          setup_api_calls:
            - { call: "POST /port-ops/terminals", payload: { name: "T1", max_apron_slots: 4, taxi_dispatch_capacity_per_window: 2 }, as: PortAuthorityAdmin, captures: { term: $.data.id } }
            - { call: "POST /port-ops/vessels", payload: { terminal_id: "${term}", name: "MV A", loa_ft: 950, draft_ft: 30.0, pax_capacity: 4000, crew_count: 900 }, as: PortAuthorityAdmin, captures: { ves: $.data.id } }
          trigger:
            - { call: "POST /port-ops/port-calls", payload: { terminal_id: "${term}", vessel_id: "${ves}", voyage_ref: "V1", scheduled_eta: "2026-08-10T08:00:00Z", scheduled_etd: "2026-08-10T20:00:00Z", booked_embark_pax: 10, booked_debark_pax: 10, passengers_aboard: 99, bags_aboard: 99 }, as: VesselAgent, as_user_id: "${ves}", captures: { pc: $.data.id, pa: $.data.passengers_aboard, baga: $.data.bags_aboard } }
          assert:
            - "pa == 0 and baga == 0 (computed fields ignore input)"
      - name: vessel_system_fields_input_ignored
        claim_type: system_fields
        grounds:
          - entities.Vessel
        distinguishing_aspect: "Client-supplied id/version on create are ignored; server mints its own id and version 1."
        test_recipe:
          setup: ["Terminal exists"]
          setup_api_calls:
            - { call: "POST /port-ops/terminals", payload: { name: "T1", max_apron_slots: 4, taxi_dispatch_capacity_per_window: 2 }, as: PortAuthorityAdmin, captures: { term: $.data.id } }
          trigger:
            - { call: "POST /port-ops/vessels", payload: { terminal_id: "${term}", name: "MV A", loa_ft: 950, draft_ft: 30.0, pax_capacity: 4000, crew_count: 900, id: "11111111-1111-1111-1111-111111111111", version: 42 }, as: PortAuthorityAdmin, captures: { vid: $.data.id, vver: $.data.version } }
          assert:
            - "vid != 11111111-1111-1111-1111-111111111111 (server-minted)"
            - "vver == 1"
      - name: berth_list_pagination_envelope
        claim_type: listing
        grounds:
          - response_envelope
        distinguishing_aspect: "limit/offset/total_count/has_more behave per envelope: 3 berths, limit=2 -> has_more true; offset=2 -> 1 row, has_more false."
        test_recipe:
          setup: ["Terminal with berths B1, B2, B3"]
          setup_api_calls:
            - { call: "POST /port-ops/terminals", payload: { name: "T1", max_apron_slots: 4, taxi_dispatch_capacity_per_window: 2 }, as: PortAuthorityAdmin, captures: { term: $.data.id } }
            - { call: "POST /port-ops/berths", payload: { terminal_id: "${term}", berth_code: "B1", length_ft: 1200, max_draft_ft: 40.0 }, as: PortAuthorityAdmin }
            - { call: "POST /port-ops/berths", payload: { terminal_id: "${term}", berth_code: "B2", length_ft: 1100, max_draft_ft: 38.0 }, as: PortAuthorityAdmin }
            - { call: "POST /port-ops/berths", payload: { terminal_id: "${term}", berth_code: "B3", length_ft: 1000, max_draft_ft: 36.0 }, as: PortAuthorityAdmin }
          trigger:
            - { call: "GET /port-ops/berths", payload: { terminal_id: "${term}", limit: 2, offset: 0 }, as: Harbormaster }
            - { call: "GET /port-ops/berths", payload: { terminal_id: "${term}", limit: 2, offset: 2 }, as: Harbormaster }
          assert:
            - "Page 1: 2 rows, total_count == 3, has_more == true"
            - "Page 2: 1 row, total_count == 3, has_more == false"
      - name: berth_code_duplicate_per_terminal_returns_400
        claim_type: type_constraints
        grounds:
          - validations[priority=15]
          - entities.Berth.fields.berth_code
        distinguishing_aspect: "berth_code unique per terminal: duplicate on same terminal -> ERR_VALIDATION; same code on another terminal succeeds."
        test_recipe:
          setup: ["Terminals T1 and T2; T1 already has berth B1"]
          setup_api_calls:
            - { call: "POST /port-ops/terminals", payload: { name: "T1", max_apron_slots: 4, taxi_dispatch_capacity_per_window: 2 }, as: PortAuthorityAdmin, captures: { t1: $.data.id } }
            - { call: "POST /port-ops/terminals", payload: { name: "T2", max_apron_slots: 2, taxi_dispatch_capacity_per_window: 1 }, as: PortAuthorityAdmin, captures: { t2: $.data.id } }
            - { call: "POST /port-ops/berths", payload: { terminal_id: "${t1}", berth_code: "B1", length_ft: 1200, max_draft_ft: 40.0 }, as: PortAuthorityAdmin }
          trigger:
            - { call: "POST /port-ops/berths", payload: { terminal_id: "${t1}", berth_code: "B1", length_ft: 1100, max_draft_ft: 38.0 }, as: PortAuthorityAdmin, captures: { err: $.data.error_id } }
            - { call: "POST /port-ops/berths", payload: { terminal_id: "${t2}", berth_code: "B1", length_ft: 1100, max_draft_ft: 38.0 }, as: PortAuthorityAdmin, captures: { ok: $.data.id } }
          assert:
            - "Duplicate on T1: err == ERR_VALIDATION (400)"
            - "Same code on T2: created (201)"
      - name: voyage_ref_duplicate_per_terminal_returns_400
        claim_type: type_constraints
        grounds:
          - validations[priority=15]
          - entities.PortCall.fields.voyage_ref
        distinguishing_aspect: "voyage_ref unique per terminal; second call with same voyage_ref -> ERR_VALIDATION."
        test_recipe:
          setup: ["Terminal, vessel, call voyage_ref V1"]
          setup_api_calls:
            - { call: "POST /port-ops/terminals", payload: { name: "T1", max_apron_slots: 4, taxi_dispatch_capacity_per_window: 2 }, as: PortAuthorityAdmin, captures: { term: $.data.id } }
            - { call: "POST /port-ops/vessels", payload: { terminal_id: "${term}", name: "MV A", loa_ft: 950, draft_ft: 30.0, pax_capacity: 4000, crew_count: 900 }, as: PortAuthorityAdmin, captures: { ves: $.data.id } }
            - { call: "POST /port-ops/port-calls", payload: { terminal_id: "${term}", vessel_id: "${ves}", voyage_ref: "V1", scheduled_eta: "2026-08-10T08:00:00Z", scheduled_etd: "2026-08-10T20:00:00Z", booked_embark_pax: 10, booked_debark_pax: 10 }, as: VesselAgent, as_user_id: "${ves}" }
          trigger:
            - { call: "POST /port-ops/port-calls", payload: { terminal_id: "${term}", vessel_id: "${ves}", voyage_ref: "V1", scheduled_eta: "2026-08-12T08:00:00Z", scheduled_etd: "2026-08-12T20:00:00Z", booked_embark_pax: 10, booked_debark_pax: 10 }, as: VesselAgent, as_user_id: "${ves}", captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_VALIDATION (400)"
      - name: berth_create_unknown_terminal_returns_404
        claim_type: parent_relationships
        grounds:
          - entities.Berth.fields.terminal_id
          - validations[priority=3]
        distinguishing_aspect: "FK integrity: creating a berth against a non-existent terminal_id -> ERR_NOT_FOUND."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "POST /port-ops/berths", payload: { terminal_id: "00000000-0000-0000-0000-000000000000", berth_code: "B1", length_ft: 1200, max_draft_ft: 40.0 }, as: PortAuthorityAdmin, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_NOT_FOUND (404)"

  # ======================================================= state_machines ====
  - section: state_machines
    instances:
      - name: port_call_depart_from_scheduled_rejected
        claim_type: invalid_transition
        grounds:
          - state_machines.PortCall
        distinguishing_aspect: "depart exists only from TURNAROUND; from SCHEDULED it fails ERR_INVALID_STATE and no cascade fires."
        test_recipe:
          setup: ["Call V1 SCHEDULED (no assignment)"]
          setup_api_calls:
            - { call: "POST /port-ops/terminals", payload: { name: "T1", max_apron_slots: 4, taxi_dispatch_capacity_per_window: 2 }, as: PortAuthorityAdmin, captures: { term: $.data.id } }
            - { call: "POST /port-ops/vessels", payload: { terminal_id: "${term}", name: "MV A", loa_ft: 950, draft_ft: 30.0, pax_capacity: 4000, crew_count: 900 }, as: PortAuthorityAdmin, captures: { ves: $.data.id } }
            - { call: "POST /port-ops/port-calls", payload: { terminal_id: "${term}", vessel_id: "${ves}", voyage_ref: "V1", scheduled_eta: "2026-08-10T08:00:00Z", scheduled_etd: "2026-08-10T20:00:00Z", booked_embark_pax: 10, booked_debark_pax: 10 }, as: VesselAgent, as_user_id: "${ves}", captures: { pc: $.data.id } }
          trigger:
            - { call: "POST /port-ops/port-calls/${pc}/depart", payload: { actual_etd: "2026-08-10T20:00:00Z" }, as: Harbormaster, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_STATE; PortCall.${pc}.status remains SCHEDULED; no FINAL invoice created (GET /port-ops/invoices?port_call_id total_count == 0)"
      - name: port_call_cancel_from_cancelled_rejected
        claim_type: terminal_state_lockdown
        grounds:
          - state_machines.PortCall
        distinguishing_aspect: "CANCELLED is terminal: a second cancel fails ERR_INVALID_STATE."
        test_recipe:
          setup: ["Call V1 already CANCELLED"]
          setup_api_calls:
            - { call: "POST /port-ops/terminals", payload: { name: "T1", max_apron_slots: 4, taxi_dispatch_capacity_per_window: 2 }, as: PortAuthorityAdmin, captures: { term: $.data.id } }
            - { call: "POST /port-ops/vessels", payload: { terminal_id: "${term}", name: "MV A", loa_ft: 950, draft_ft: 30.0, pax_capacity: 4000, crew_count: 900 }, as: PortAuthorityAdmin, captures: { ves: $.data.id } }
            - { call: "POST /port-ops/port-calls", payload: { terminal_id: "${term}", vessel_id: "${ves}", voyage_ref: "V1", scheduled_eta: "2026-08-10T08:00:00Z", scheduled_etd: "2026-08-10T20:00:00Z", booked_embark_pax: 10, booked_debark_pax: 10 }, as: VesselAgent, as_user_id: "${ves}", captures: { pc: $.data.id } }
            - { call: "POST /port-ops/port-calls/${pc}/cancel", as: VesselAgent, as_user_id: "${ves}" }
          trigger:
            - { call: "POST /port-ops/port-calls/${pc}/cancel", as: Harbormaster, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_INVALID_STATE (409); status stays CANCELLED"
      - name: berth_out_of_service_blocked_while_assignment_active
        claim_type: precondition_enforcement
        grounds:
          - state_machines.Berth.ACTIVE_to_OUT_OF_SERVICE
        distinguishing_aspect: "A berth holding an ACTIVE assignment cannot go OUT_OF_SERVICE; after depart releases it, the same action succeeds."
        test_recipe:
          setup: ["Call ARRIVED with ACTIVE assignment on B1; customs case CLEARED so depart is possible"]
          setup_api_calls:
            - { call: "POST /port-ops/terminals", payload: { name: "T1", max_apron_slots: 4, taxi_dispatch_capacity_per_window: 2 }, as: PortAuthorityAdmin, captures: { term: $.data.id } }
            - { call: "POST /port-ops/berths", payload: { terminal_id: "${term}", berth_code: "B1", length_ft: 1200, max_draft_ft: 40.0 }, as: PortAuthorityAdmin, captures: { b1: $.data.id } }
            - { call: "POST /port-ops/vessels", payload: { terminal_id: "${term}", name: "MV A", loa_ft: 950, draft_ft: 30.0, pax_capacity: 4000, crew_count: 900 }, as: PortAuthorityAdmin, captures: { ves: $.data.id } }
            - { call: "POST /port-ops/port-calls", payload: { terminal_id: "${term}", vessel_id: "${ves}", voyage_ref: "V1", scheduled_eta: "2026-08-10T08:00:00Z", scheduled_etd: "2026-08-10T20:00:00Z", booked_embark_pax: 10, booked_debark_pax: 10 }, as: VesselAgent, as_user_id: "${ves}", captures: { pc: $.data.id, pc_v: $.data.version } }
            - { call: "POST /port-ops/port-calls/${pc}/berth-assignments", payload: { berth_id: "${b1}", window_start: "2026-08-10T06:00:00Z", window_end: "2026-08-10T22:00:00Z", expected_port_call_version: "${pc_v}" }, as: Harbormaster, captures: { ba: $.data.id } }
            - { call: "POST /port-ops/berth-assignments/${ba}/confirm", as: Harbormaster }
            - { call: "POST /port-ops/port-calls/${pc}/customs-cases", as: CustomsOfficer, captures: { cc: $.data.id } }
            - { call: "POST /port-ops/customs-cases/${cc}/file", as: CustomsOfficer }
            - { call: "POST /port-ops/port-calls/${pc}/arrive", payload: { actual_eta: "2026-08-10T08:00:00Z" }, as: Harbormaster }
            - { call: "POST /port-ops/screening-lanes", payload: { terminal_id: "${term}", lane_code: "L1" }, as: PortAuthorityAdmin, captures: { lane: $.data.id } }
            - { call: "POST /port-ops/screening-lanes/${lane}/open", payload: { officers_assigned: 2 }, as: TerminalOperator }
            - { call: "POST /port-ops/port-calls/${pc}/begin-turnaround", as: TerminalOperator }
            - { call: "POST /port-ops/customs-cases/${cc}/clear", as: CustomsOfficer }
          trigger:
            - { call: "POST /port-ops/berths/${b1}/out-of-service", as: PortAuthorityAdmin, captures: { err: $.data.error_id } }
            - { call: "POST /port-ops/port-calls/${pc}/depart", payload: { actual_etd: "2026-08-10T20:00:00Z" }, as: Harbormaster }
            - { call: "POST /port-ops/berths/${b1}/out-of-service", as: PortAuthorityAdmin, captures: { st: $.data.status } }
          assert:
            - "While ACTIVE: err == ERR_INVALID_STATE"
            - "After depart (assignment RELEASED): st == OUT_OF_SERVICE"
      - name: transport_requeue_limit_second_requeue_rejected
        claim_type: precondition_enforcement
        grounds:
          - state_machines.TransportSlot.NO_SHOW_to_QUEUED
          - errors[ERR_REQUEUE_LIMIT]
        distinguishing_aspect: "The NO_SHOW -> QUEUED loop runs exactly once per slot; the second requeue fails ERR_REQUEUE_LIMIT."
        test_recipe:
          setup: ["Call ARRIVED; one TAXI slot QUEUED"]
          setup_api_calls:
            - { call: "POST /port-ops/terminals", payload: { name: "T1", max_apron_slots: 4, taxi_dispatch_capacity_per_window: 5 }, as: PortAuthorityAdmin, captures: { term: $.data.id } }
            - { call: "POST /port-ops/berths", payload: { terminal_id: "${term}", berth_code: "B1", length_ft: 1200, max_draft_ft: 40.0 }, as: PortAuthorityAdmin, captures: { b1: $.data.id } }
            - { call: "POST /port-ops/vessels", payload: { terminal_id: "${term}", name: "MV A", loa_ft: 950, draft_ft: 30.0, pax_capacity: 4000, crew_count: 900 }, as: PortAuthorityAdmin, captures: { ves: $.data.id } }
            - { call: "POST /port-ops/port-calls", payload: { terminal_id: "${term}", vessel_id: "${ves}", voyage_ref: "V1", scheduled_eta: "2026-08-10T08:00:00Z", scheduled_etd: "2026-08-10T20:00:00Z", booked_embark_pax: 10, booked_debark_pax: 10 }, as: VesselAgent, as_user_id: "${ves}", captures: { pc: $.data.id, pc_v: $.data.version } }
            - { call: "POST /port-ops/port-calls/${pc}/berth-assignments", payload: { berth_id: "${b1}", window_start: "2026-08-10T06:00:00Z", window_end: "2026-08-10T22:00:00Z", expected_port_call_version: "${pc_v}" }, as: Harbormaster, captures: { ba: $.data.id } }
            - { call: "POST /port-ops/berth-assignments/${ba}/confirm", as: Harbormaster }
            - { call: "POST /port-ops/port-calls/${pc}/arrive", payload: { actual_eta: "2026-08-10T08:00:00Z" }, as: Harbormaster }
            - { call: "POST /port-ops/transport-slots", payload: { terminal_id: "${term}", port_call_id: "${pc}", vehicle_class: "TAXI", party_size: 2 }, as: TerminalOperator, captures: { ts: $.data.id } }
            - { call: "POST /port-ops/transport-slots/${ts}/dispatch", as: TerminalOperator }
            - { call: "POST /port-ops/transport-slots/${ts}/no-show", as: TerminalOperator }
          trigger:
            - { call: "POST /port-ops/transport-slots/${ts}/requeue", as: TerminalOperator, captures: { st: $.data.status, rc: $.data.requeue_count } }
            - { call: "POST /port-ops/transport-slots/${ts}/dispatch", as: TerminalOperator }
            - { call: "POST /port-ops/transport-slots/${ts}/no-show", as: TerminalOperator }
            - { call: "POST /port-ops/transport-slots/${ts}/requeue", as: TerminalOperator, captures: { err: $.data.error_id } }
          assert:
            - "First requeue: st == QUEUED and rc == 1 (rejoined with new queue_seq)"
            - "Second requeue: err == ERR_REQUEUE_LIMIT (409)"
      - name: baggage_mistag_recovery_loop
        claim_type: valid_transition
        grounds:
          - state_machines.BaggageItem.MISTAGGED_to_RECOVERED
          - state_machines.BaggageItem.RECOVERED_to_STAGED
        distinguishing_aspect: "The mis-tag loop STAGED -> MISTAGGED -> RECOVERED -> STAGED re-enters the normal flow; each hop observable."
        test_recipe:
          setup: ["Call SCHEDULED; EMBARK entry CHECKED_IN; bag TAG1"]
          setup_api_calls:
            - { call: "POST /port-ops/terminals", payload: { name: "T1", max_apron_slots: 4, taxi_dispatch_capacity_per_window: 2 }, as: PortAuthorityAdmin, captures: { term: $.data.id } }
            - { call: "POST /port-ops/vessels", payload: { terminal_id: "${term}", name: "MV A", loa_ft: 950, draft_ft: 30.0, pax_capacity: 4000, crew_count: 900 }, as: PortAuthorityAdmin, captures: { ves: $.data.id } }
            - { call: "POST /port-ops/port-calls", payload: { terminal_id: "${term}", vessel_id: "${ves}", voyage_ref: "V1", scheduled_eta: "2026-08-10T08:00:00Z", scheduled_etd: "2026-08-10T20:00:00Z", booked_embark_pax: 10, booked_debark_pax: 10 }, as: VesselAgent, as_user_id: "${ves}", captures: { pc: $.data.id } }
            - { call: "POST /port-ops/port-calls/${pc}/manifest-entries", payload: { passenger_ref: "P1", direction: "EMBARK", cabin_class: "STANDARD" }, as: VesselAgent, as_user_id: "${ves}", captures: { e1: $.data.id } }
            - { call: "POST /port-ops/manifest-entries/${e1}/check-in", as: TerminalOperator }
            - { call: "POST /port-ops/baggage-items", payload: { manifest_entry_id: "${e1}", tag_code: "TAG1" }, as: TerminalOperator, captures: { bag: $.data.id } }
          trigger:
            - { call: "POST /port-ops/baggage-items/${bag}/stage", as: TerminalOperator, captures: { s1: $.data.status } }
            - { call: "POST /port-ops/baggage-items/${bag}/report-mistag", payload: { note: "tag reads different voyage" }, as: TerminalOperator, captures: { s2: $.data.status } }
            - { call: "POST /port-ops/baggage-items/${bag}/recover", as: TerminalOperator, captures: { s3: $.data.status } }
            - { call: "POST /port-ops/baggage-items/${bag}/stage", as: TerminalOperator, captures: { s4: $.data.status } }
          assert:
            - "s1 == STAGED, s2 == MISTAGGED, s3 == RECOVERED, s4 == STAGED (full recovery loop)"
      - name: depart_no_show_cascade
        claim_type: side_effect_execution
        grounds:
          - state_machines.PortCall.TURNAROUND_to_DEPARTED
          - state_machines.ManifestEntry.CHECKED_IN_to_NO_SHOW
        distinguishing_aspect: "Depart flips a CHECKED_IN embark entry to NO_SHOW and its STAGED bag to OFFLOADED; passengers_aboard stays 0."
        test_recipe:
