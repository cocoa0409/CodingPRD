      - name: idempotency_replay_returns_original
        claim_type: idempotency
        grounds: ["validations[priority=12]", "errors[ERR_IDEMPOTENCY_CONFLICT]"]
        distinguishing_aspect: "Same (nominator, idempotency_key) with an IDENTICAL payload returns the original nomination with no new row and no extra reservation; the same key with a DIFFERENT payload is rejected ERR_IDEMPOTENCY_CONFLICT."
