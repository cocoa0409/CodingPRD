          - entities.Cage.fields.operational_status
        distinguishing_aspect: "A cage created without required_camera_coverage_pct or required_reader_zone_count defaults to 95.0 and 2, starts at operational_status FIT_OUT and reports camera_coverage_pct 0.00 with active_reader_zone_count 0."
        test_recipe:
          setup:
