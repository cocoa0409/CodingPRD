  # ===========================================================================
  # Rule 7 — cross_entity_state_dependency (different entity pairs)
  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: stop_stage_depends_on_tour_active
        grounds:
          - state_machines.TourStop.PLANNED_to_GEAR_STAGED
          - state_machines.Tour.DRAFT_to_ACTIVE
        distinguishing_aspect: |
          Pair TourStop->Tour: the stage transition on TourStop is guarded by
          the parent Tour being ACTIVE; staging against a DRAFT tour fails
          ERR_INVALID_STATE even when all rider lines are sourced and a
          shipment has been delivered.
        test_recipe:
          setup:
            - "Tour left in DRAFT; stop with one rider line SOURCED; shipment DELIVERED to the stop city"
          setup_api_calls:
            - call: "POST /backline/artists"
              payload: { legal_name: "Guard Act", tier: "PLATINUM", deposit_waived: true }
              as: OpsManager
              captures: { ga: $.data.id }
            - call: "POST /backline/gear-models"
              payload: { sku: "GD-AMP-1", category: "AMP", daily_rate_cents: 10000, replacement_value_cents: 100000, weight_class: "HAND_CARRY" }
              as: OpsManager
              captures: { gm: $.data.id }
            - call: "POST /backline/gear-units"
              payload: { gear_model_id: "${gm}", serial_number: "GD-U1", home_city_code: "LAX" }
              as: OpsManager
              captures: { gu: $.data.id }
            - call: "POST /backline/tours"
              payload: { artist_id: "${ga}", name: "Guard Tour", start_date: "2026-08-01T00:00:00Z", end_date: "2026-08-31T00:00:00Z" }
              as: TourManager
              captures: { gt: $.data.id }
            - call: "POST /backline/tours/${gt}/stops"
              payload: { city_code: "LAX", venue_date: "2026-08-10T00:00:00Z", load_in_ts: "2026-08-10T10:00:00Z" }
              as: TourManager
              captures: { gs: $.data.id }
            - call: "POST /backline/tour-stops/${gs}/rider-lines"
              payload: { gear_model_id: "${gm}", quantity: 1 }
              as: TourManager
              captures: { grl: $.data.id }
            - call: "POST /backline/rider-lines/${grl}/source"
              payload: { origin_city_code: "LAX", dest_city_code: "LAX", start_date: "2026-08-09T00:00:00Z", end_date: "2026-08-11T00:00:00Z" }
              as: LogisticsCoordinator
            - call: "POST /backline/shipments"
              payload: { tour_id: "${gt}", from_city_code: "LAX", to_city_code: "LAX", ship_date: "2026-08-09T00:00:00Z", capacity_kg: 100 }
              as: LogisticsCoordinator
              captures: { gsh: $.data.id }
            - call: "POST /backline/shipments/${gsh}/lines"
              payload: { gear_unit_id: "${gu}", weight_kg: 5, labor_minutes: 5 }
              as: LogisticsCoordinator
            - call: "POST /backline/shipments/${gsh}/begin-loading"
              payload: {}
              as: LogisticsCoordinator
            - call: "GET /backline/shipments/${gsh}/lines"
              as: LogisticsCoordinator
              captures: { gsl: "$.data[0].id" }
            - call: "POST /backline/shipment-lines/${gsl}/load"
              payload: {}
              as: WarehouseTech
            - call: "POST /backline/shipments/${gsh}/depart"
              payload: {}
              as: LogisticsCoordinator
            - call: "POST /backline/shipments/${gsh}/mark-delivered"
              payload: {}
              as: LogisticsCoordinator
          trigger:
            - call: "POST /backline/tour-stops/${gs}/stage"
              payload: {}
              as: LogisticsCoordinator
              captures: { stage_err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE (tour DRAFT blocks staging despite fulfilled rider and delivered shipment)"

      - name: crossrental_settle_depends_on_reservation_settled
        grounds:
          - state_machines.CrossRentalRequest.FULFILLED_to_SETTLED
          - state_machines.ReservationLine.INSPECTED_to_SETTLED
        distinguishing_aspect: |
          Pair CrossRentalRequest->ReservationLine (different pair than
          TourStop->Tour): settling a FULFILLED cross-rental while its linked
          reservation is merely INSPECTED (not yet SETTLED) fails
          ERR_INVALID_STATE; only after the reservation settles does the
          cross-rental settle succeed and compute commission.
        test_recipe:
          setup:
            - "Cross-rental sourced reservation (no in-house unit of model), request ACCEPTED then FULFILLED"
            - "Reservation driven DISPATCHED->DELIVERED->RETURNED->INSPECTED (cross-rental reservations still flow through logistics states)"
          setup_api_calls:
            - call: "POST /backline/artists"
              payload: { legal_name: "XR Act", tier: "PLATINUM", deposit_waived: true }
              as: OpsManager
