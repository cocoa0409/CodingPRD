            - "Institution 61033 (estimated_liquidation_recovery_cents 4005000) is CLOSED_IN_RECEIVERSHIP with two depositors: Cleo holds a SINGLE account of 7000000 with a CERTIFIED determination, Dario holds a SINGLE account of 2000000 with no determination at all."
