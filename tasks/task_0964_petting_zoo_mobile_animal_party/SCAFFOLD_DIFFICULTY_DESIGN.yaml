            - { call: "POST /petting-zoo/animals", payload: { name: "Gogo", species: "GOAT", weight_class: "SMALL", temperament_tier: 3, base_event_fee_cents: 8000 }, as: Operator, captures: { a_goat: $.data.id } }
            - { call: "POST /petting-zoo/animals/${a_goat}/health-records", payload: { exam_date: "2026-05-09T00:00:00Z", result: "PASS", valid_until: "2026-07-01T00:00:00Z" }, as: Veterinarian }
            - { call: "POST /petting-zoo/bookings", payload: { venue_id: "${v9}", start_time: "2026-06-17T14:00:00Z", end_time: "2026-06-17T16:00:00Z", guest_count: 20, child_guest_count: 0, booking_type: "PRIVATE_PARTY", planned_handwash_stations: 1 }, as: Customer, as_user_id: "${c9}", captures: { bk: $.data.id } }
            - { call: "POST /petting-zoo/bookings/${bk}/animals", payload: { animal_id: "${a_goat}", role: "PETTING_ZOO" }, as: Coordinator, captures: { ba: $.data.id } }
            - { call: "POST /petting-zoo/bookings/${bk}/animals/${ba}/confirm", payload: {}, as: Coordinator }
            - { call: "POST /petting-zoo/bookings/${bk}/quote", payload: {}, as: Coordinator }
            - { call: "POST /petting-zoo/bookings/${bk}/payments", payload: { amount_cents: 4872, method: "CARD" }, as: Customer, as_user_id: "${c9}" }
            - { call: "POST /petting-zoo/bookings/${bk}/confirm", payload: {}, as: Customer, as_user_id: "${c9}" }
            - { call: "POST /petting-zoo/handlers", payload: { name: "Hank", certifications: ["FIRST_AID"] }, as: Operator, captures: { h1: $.data.id } }
            - { call: "POST /petting-zoo/bookings/${bk}/staff-assignments", payload: { handler_id: "${h1}", role: "LEAD" }, as: Coordinator, captures: { sa: $.data.id } }
          trigger:
            - { call: "POST /petting-zoo/bookings/${bk}/cancel", payload: { reason: "CUSTOMER" }, as: Customer, as_user_id: "${c9}" }
          assert:
            - "Booking.${bk}.status == CANCELLED_CUSTOMER and payment_status == REFUND_FULL (>=168h tier: 100% of 4872)"
            - "Ledger for ${bk}: PAYMENT 4872 and REFUND 4872; no FORFEIT entry (100% tier)"
            - "GET /petting-zoo/bookings/${bk}/staff-assignments shows ${sa} status == RELEASED with release_reason == BOOKING_CANCELLED (link 1)"
            - "GET /petting-zoo/handlers/${h1} scheduled_minutes_total == 0 (link 2: recompute after release; was 120 before cancel)"

  # ---------------------------------------------------------------------------
  # Rule 5 — priority_pair_validation_conflict (different error-category pairs)
  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_safety_on_dispatch_from_quoted
        grounds:
          - validations[priority=5]
          - validations[priority=12]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_WAIVER_INCOMPLETE]
        distinguishing_aspect: |
          Category pair state (priority 5) vs business_safety (priority 12): a
