      - name: reinstate_requires_valid_credentials
        grounds:
          - state_machines.Driver.SUSPENDED_to_ACTIVE
          - state_machines.Credential.ACTIVE_to_EXPIRED
          - errors[ERR_ENDORSEMENT_MISSING]
        distinguishing_aspect: |
          Pair Credential->Driver: a SUSPENDED driver cannot be reinstated while
          the S_ENDORSEMENT credential is EXPIRED — the credential's state gates
          the driver's transition. Distinct pair from Driver->Assignment and
          Bus->Assignment.
        test_recipe:
          setup: ["Driver ACTIVE with CDL_B expiring 2027-01-01 and S_ENDORSEMENT expiring 2026-06-10; driver SUSPENDED via discipline at default clock; clock advanced to 2026-06-11 so the endorsement expires while the driver is suspended"]
