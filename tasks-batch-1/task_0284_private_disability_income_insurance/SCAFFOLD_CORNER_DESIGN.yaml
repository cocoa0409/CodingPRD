# =============================================================================
# §1.9 Scaffold Corner Design (breadth coverage of non-difficulty claims)
# Private Disability Income Insurance — Expert
# =============================================================================
scaffold_corner_design:

  # ===========================================================================
  - section: entities
    instances:
      - name: create_policy_returns_201_with_system_fields
        claim_type: Creation
        grounds:
          - entities.Policy
          - endpoints
        distinguishing_aspect: "POST /policies with all required fields returns 201; lifecycle_status=PENDING, premium_status=CURRENT, benefit_months_consumed=0, version=1, server-minted id present."
        test_recipe:
          setup: ["An insurer, a MEDIUM occupation class, and a policyholder exist."]
          setup_api_calls:
            - call: "POST /disability/insurers"
              payload: { name: "ENT1 Insurer" }
              as: Underwriter
              captures: { ins_id: $.data.id }
            - call: "POST /disability/occupation-classes"
              payload: { insurer_id: "${ins_id}", code: "MED", risk_tier: "MEDIUM", max_benefit_months: 120, min_elimination_days: 0, own_occ_window_months_cap: 60 }
              as: Underwriter
              captures: { oc_id: $.data.id }
            - call: "POST /disability/policyholders"
              payload: { insurer_id: "${ins_id}", full_name: "PH ENT1", pre_disability_monthly_income_cents: 1000000 }
              as: Underwriter
              captures: { ph_id: $.data.id }
          trigger:
            - call: "POST /disability/policies"
              payload: { insurer_id: "${ins_id}", policyholder_id: "${ph_id}", occupation_class_id: "${oc_id}", monthly_benefit_cents: 500000, benefit_period_months: 12, elimination_period_days: 90, occupation_definition: "OWN_OCC", own_occ_window_months: 24, cola_rider: true, cola_annual_rate: 0.03 }
              as: Underwriter
              captures: { p_id: $.data.id, p_life: $.data.lifecycle_status, p_prem: $.data.premium_status, p_ver: $.data.version }
          assert:
            - "HTTP 201; Policy.${p_id}.lifecycle_status == PENDING"
            - "Policy.${p_id}.premium_status == CURRENT"
            - "Policy.${p_id}.benefit_months_consumed == 0"
            - "Policy.${p_id}.version == 1"

      - name: create_policy_missing_monthly_benefit_returns_invalid_request
        claim_type: Required Fields
        grounds:
          - entities.Policy.fields.monthly_benefit_cents
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "Omitting required monthly_benefit_cents on POST /policies returns 422 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["An insurer, occupation class, and policyholder exist."]
          setup_api_calls:
            - call: "POST /disability/insurers"
              payload: { name: "ENT2 Insurer" }
              as: Underwriter
              captures: { ins_id: $.data.id }
            - call: "POST /disability/occupation-classes"
              payload: { insurer_id: "${ins_id}", code: "MED", risk_tier: "MEDIUM", max_benefit_months: 120, min_elimination_days: 0, own_occ_window_months_cap: 60 }
              as: Underwriter
              captures: { oc_id: $.data.id }
            - call: "POST /disability/policyholders"
              payload: { insurer_id: "${ins_id}", full_name: "PH ENT2", pre_disability_monthly_income_cents: 1000000 }
              as: Underwriter
              captures: { ph_id: $.data.id }
          trigger:
            - call: "POST /disability/policies"
              payload: { insurer_id: "${ins_id}", policyholder_id: "${ph_id}", occupation_class_id: "${oc_id}", benefit_period_months: 12, elimination_period_days: 90, occupation_definition: "ANY_OCC" }
              as: Underwriter
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 422 and data.error_id == ERR_INVALID_REQUEST (monthly_benefit_cents missing)"

      - name: create_policy_cola_rate_nonzero_without_rider_invalid
        claim_type: Type Constraints
        grounds:
          - entities.Policy.fields.cola_rider
          - entities.Policy.fields.cola_annual_rate
          - validations[priority=13]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "cola_annual_rate > 0 while cola_rider false is a conditional field-shape violation -> 422 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["An insurer, occupation class, and policyholder exist."]
          setup_api_calls:
            - call: "POST /disability/insurers"
              payload: { name: "ENT3 Insurer" }
              as: Underwriter
              captures: { ins_id: $.data.id }
            - call: "POST /disability/occupation-classes"
              payload: { insurer_id: "${ins_id}", code: "MED", risk_tier: "MEDIUM", max_benefit_months: 120, min_elimination_days: 0, own_occ_window_months_cap: 60 }
              as: Underwriter
              captures: { oc_id: $.data.id }
            - call: "POST /disability/policyholders"
              payload: { insurer_id: "${ins_id}", full_name: "PH ENT3", pre_disability_monthly_income_cents: 1000000 }
              as: Underwriter
              captures: { ph_id: $.data.id }
          trigger:
            - call: "POST /disability/policies"
              payload: { insurer_id: "${ins_id}", policyholder_id: "${ph_id}", occupation_class_id: "${oc_id}", monthly_benefit_cents: 500000, benefit_period_months: 12, elimination_period_days: 90, occupation_definition: "ANY_OCC", cola_rider: false, cola_annual_rate: 0.03 }
              as: Underwriter
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 422 and data.error_id == ERR_INVALID_REQUEST (cola_annual_rate 0.03 with cola_rider false)"

      - name: create_policy_elimination_below_class_floor_invalid
        claim_type: Type Constraints
        grounds:
          - entities.OccupationClass.fields.min_elimination_days
          - entities.Policy.fields.elimination_period_days
          - validations[priority=13]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "elimination_period_days below occupation_class.min_elimination_days is rejected with 422 ERR_INVALID_REQUEST."
        test_recipe:
          setup: ["An insurer with an occupation class whose min_elimination_days is 60, plus a policyholder."]
          setup_api_calls:
            - call: "POST /disability/insurers"
              payload: { name: "ENT4 Insurer" }
              as: Underwriter
              captures: { ins_id: $.data.id }
            - call: "POST /disability/occupation-classes"
              payload: { insurer_id: "${ins_id}", code: "HI", risk_tier: "HIGH", max_benefit_months: 120, min_elimination_days: 60, own_occ_window_months_cap: 12 }
              as: Underwriter
              captures: { oc_id: $.data.id }
            - call: "POST /disability/policyholders"
              payload: { insurer_id: "${ins_id}", full_name: "PH ENT4", pre_disability_monthly_income_cents: 1000000 }
              as: Underwriter
              captures: { ph_id: $.data.id }
          trigger:
            - call: "POST /disability/policies"
              payload: { insurer_id: "${ins_id}", policyholder_id: "${ph_id}", occupation_class_id: "${oc_id}", monthly_benefit_cents: 500000, benefit_period_months: 12, elimination_period_days: 30, occupation_definition: "ANY_OCC" }
              as: Underwriter
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 422 and data.error_id == ERR_INVALID_REQUEST (elimination_period_days 30 < class floor 60)"

      - name: get_policy_nonexistent_returns_not_found
        claim_type: Not Found
        grounds:
          - entities.Policy
          - errors[ERR_POLICY_NOT_FOUND]
        distinguishing_aspect: "GET /policies/{id} with a non-existent UUID returns 404 ERR_POLICY_NOT_FOUND."
        test_recipe:
          setup: ["An insurer exists; no policy with the queried id."]
          setup_api_calls:
            - call: "POST /disability/insurers"
              payload: { name: "ENT5 Insurer" }
              as: Underwriter
          trigger:
            - call: "GET /disability/policies/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: Underwriter
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 404 and data.error_id == ERR_POLICY_NOT_FOUND"

      - name: create_claim_ignores_client_supplied_status_system_field
        claim_type: System Fields
        grounds:
          - entities.Claim.fields.status
          - entities.Claim.fields.elimination_satisfied_month
        distinguishing_aspect: "Claim.status is system-sourced: a new claim starts DRAFT regardless of input; elimination_satisfied_month is computed = onset + ceil(elim_days/30)."
        test_recipe:
          setup: ["An ACTIVE policy with elimination_period_days 90 (elim_sat = onset 2 + ceil(90/30)=3 -> 5)."]
          setup_api_calls:
            - call: "POST /disability/insurers"
              payload: { name: "ENT6 Insurer" }
              as: Underwriter
              captures: { ins_id: $.data.id }
            - call: "POST /disability/occupation-classes"
              payload: { insurer_id: "${ins_id}", code: "MED", risk_tier: "MEDIUM", max_benefit_months: 120, min_elimination_days: 0, own_occ_window_months_cap: 60 }
              as: Underwriter
              captures: { oc_id: $.data.id }
            - call: "POST /disability/policyholders"
              payload: { insurer_id: "${ins_id}", full_name: "PH ENT6", pre_disability_monthly_income_cents: 1000000 }
              as: Underwriter
              captures: { ph_id: $.data.id }
            - call: "POST /disability/policies"
              payload: { insurer_id: "${ins_id}", policyholder_id: "${ph_id}", occupation_class_id: "${oc_id}", monthly_benefit_cents: 500000, benefit_period_months: 12, elimination_period_days: 90, occupation_definition: "ANY_OCC" }
              as: Underwriter
              captures: { p_id: $.data.id }
            - call: "POST /disability/policies/${p_id}/activate"
              payload: {}
              as: Underwriter
          trigger:
            - call: "POST /disability/claims"
              payload: { insurer_id: "${ins_id}", policy_id: "${p_id}", disability_onset_month: 2, claimed_disability_type: "TOTAL" }
              as: Policyholder
              as_user_id: "${ph_id}"
              captures: { c_id: $.data.id, c_status: $.data.status, c_elim: $.data.elimination_satisfied_month }
          assert:
            - "HTTP 201; Claim.${c_id}.status == DRAFT"
            - "Claim.${c_id}.elimination_satisfied_month == 5 (onset 2 + ceil(90/30)=3)"

  # ===========================================================================
  - section: state_machines
    instances:
      - name: submit_claim_from_already_submitted_returns_invalid_state
        claim_type: Invalid Transitions
        grounds:
          - state_machines.Claim.transitions.DRAFT_to_SUBMITTED
          - errors[ERR_CLAIM_NOT_DRAFT]
        distinguishing_aspect: "Submitting a claim already in SUBMITTED returns 409 ERR_CLAIM_NOT_DRAFT; no state change."
        test_recipe:
          setup: ["An ACTIVE policy and a TOTAL claim already SUBMITTED."]
          setup_api_calls:
            - call: "POST /disability/insurers"
              payload: { name: "SM1 Insurer" }
              as: Underwriter
              captures: { ins_id: $.data.id }
            - call: "POST /disability/occupation-classes"
              payload: { insurer_id: "${ins_id}", code: "MED", risk_tier: "MEDIUM", max_benefit_months: 120, min_elimination_days: 0, own_occ_window_months_cap: 60 }
              as: Underwriter
              captures: { oc_id: $.data.id }
            - call: "POST /disability/policyholders"
              payload: { insurer_id: "${ins_id}", full_name: "PH SM1", pre_disability_monthly_income_cents: 1000000 }
              as: Underwriter
              captures: { ph_id: $.data.id }
            - call: "POST /disability/policies"
              payload: { insurer_id: "${ins_id}", policyholder_id: "${ph_id}", occupation_class_id: "${oc_id}", monthly_benefit_cents: 500000, benefit_period_months: 12, elimination_period_days: 90, occupation_definition: "ANY_OCC" }
              as: Underwriter
              captures: { p_id: $.data.id }
            - call: "POST /disability/policies/${p_id}/activate"
              payload: {}
              as: Underwriter
            - call: "POST /disability/claims"
              payload: { insurer_id: "${ins_id}", policy_id: "${p_id}", disability_onset_month: 0, claimed_disability_type: "TOTAL" }
              as: Policyholder
              as_user_id: "${ph_id}"
              captures: { c_id: $.data.id }
            - call: "POST /disability/claims/${c_id}/submit"
              payload: {}
              as: Policyholder
              as_user_id: "${ph_id}"
          trigger:
            - call: "POST /disability/claims/${c_id}/submit"
              payload: {}
              as: Policyholder
              as_user_id: "${ph_id}"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 and data.error_id == ERR_CLAIM_NOT_DRAFT"

      - name: approve_claim_from_denied_terminal_returns_invalid_state
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.Claim.transitions.UNDER_REVIEW_to_DENIED
          - state_machines.Claim.transitions.UNDER_REVIEW_to_APPROVED
          - errors[ERR_CLAIM_NOT_UNDER_REVIEW]
        distinguishing_aspect: "From terminal DENIED no transition is possible; approve returns 409 ERR_CLAIM_NOT_UNDER_REVIEW."
        test_recipe:
          setup: ["Insurer at month 5; an UNDER_REVIEW claim then DENIED."]
          setup_api_calls:
            - call: "POST /disability/insurers"
              payload: { name: "SM2 Insurer" }
              as: Underwriter
              captures: { ins_id: $.data.id }
            - call: "POST /disability/insurers/${ins_id}/clock/advance"
              payload: { by_months: 5 }
              as: SystemOperator
            - call: "POST /disability/occupation-classes"
              payload: { insurer_id: "${ins_id}", code: "MED", risk_tier: "MEDIUM", max_benefit_months: 120, min_elimination_days: 0, own_occ_window_months_cap: 60 }
              as: Underwriter
              captures: { oc_id: $.data.id }
            - call: "POST /disability/policyholders"
              payload: { insurer_id: "${ins_id}", full_name: "PH SM2", pre_disability_monthly_income_cents: 1000000 }
              as: Underwriter
              captures: { ph_id: $.data.id }
            - call: "POST /disability/policies"
              payload: { insurer_id: "${ins_id}", policyholder_id: "${ph_id}", occupation_class_id: "${oc_id}", monthly_benefit_cents: 500000, benefit_period_months: 12, elimination_period_days: 90, occupation_definition: "ANY_OCC" }
              as: Underwriter
              captures: { p_id: $.data.id }
            - call: "POST /disability/policies/${p_id}/activate"
              payload: {}
              as: Underwriter
            - call: "POST /disability/claims"
              payload: { insurer_id: "${ins_id}", policy_id: "${p_id}", disability_onset_month: 0, claimed_disability_type: "TOTAL" }
              as: Policyholder
              as_user_id: "${ph_id}"
              captures: { c_id: $.data.id }
            - call: "POST /disability/claims/${c_id}/submit"
              payload: {}
              as: Policyholder
              as_user_id: "${ph_id}"
            - call: "POST /disability/claims/${c_id}/begin-review"
              payload: {}
              as: ClaimsAdjudicator
            - call: "POST /disability/claims/${c_id}/deny"
              payload: {}
              as: ClaimsAdjudicator
          trigger:
            - call: "POST /disability/claims/${c_id}/approve"
              payload: {}
              as: ClaimsAdjudicator
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 and data.error_id == ERR_CLAIM_NOT_UNDER_REVIEW (DENIED is terminal)"

      - name: activate_declined_occupation_class_policy_rejected
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Policy.transitions.lifecycle_status_PENDING_to_ACTIVE
          - entities.OccupationClass.fields.risk_tier
          - errors[ERR_OCCUPATION_CLASS_DECLINED]
        distinguishing_aspect: "Activating a PENDING policy whose occupation class risk_tier is DECLINE returns 409 ERR_OCCUPATION_CLASS_DECLINED (cross-entity Policy->OccupationClass precondition)."
        test_recipe:
          setup: ["A PENDING policy backed by a DECLINE-tier occupation class."]
          setup_api_calls:
            - call: "POST /disability/insurers"
              payload: { name: "SM3 Insurer" }
              as: Underwriter
              captures: { ins_id: $.data.id }
            - call: "POST /disability/occupation-classes"
              payload: { insurer_id: "${ins_id}", code: "DEC", risk_tier: "DECLINE", max_benefit_months: 120, min_elimination_days: 0, own_occ_window_months_cap: 0 }
              as: Underwriter
              captures: { oc_id: $.data.id }
            - call: "POST /disability/policyholders"
              payload: { insurer_id: "${ins_id}", full_name: "PH SM3", pre_disability_monthly_income_cents: 1000000 }
              as: Underwriter
              captures: { ph_id: $.data.id }
            - call: "POST /disability/policies"
              payload: { insurer_id: "${ins_id}", policyholder_id: "${ph_id}", occupation_class_id: "${oc_id}", monthly_benefit_cents: 500000, benefit_period_months: 12, elimination_period_days: 90, occupation_definition: "ANY_OCC" }
              as: Underwriter
              captures: { p_id: $.data.id }
          trigger:
            - call: "POST /disability/policies/${p_id}/activate"
              payload: {}
              as: Underwriter
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 and data.error_id == ERR_OCCUPATION_CLASS_DECLINED"

      - name: terminate_policy_with_open_claim_rejected
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.Policy.transitions.lifecycle_status_ACTIVE_to_TERMINATED
          - errors[ERR_OPEN_CLAIM_EXISTS]
        distinguishing_aspect: "Terminating an ACTIVE policy while a claim is UNDER_REVIEW returns 409 ERR_OPEN_CLAIM_EXISTS."
        test_recipe:
          setup: ["Insurer at month 5; an ACTIVE policy with a claim UNDER_REVIEW."]
          setup_api_calls:
            - call: "POST /disability/insurers"
              payload: { name: "SM4 Insurer" }
              as: Underwriter
              captures: { ins_id: $.data.id }
            - call: "POST /disability/insurers/${ins_id}/clock/advance"
              payload: { by_months: 5 }
              as: SystemOperator
            - call: "POST /disability/occupation-classes"
              payload: { insurer_id: "${ins_id}", code: "MED", risk_tier: "MEDIUM", max_benefit_months: 120, min_elimination_days: 0, own_occ_window_months_cap: 60 }
              as: Underwriter
              captures: { oc_id: $.data.id }
            - call: "POST /disability/policyholders"
              payload: { insurer_id: "${ins_id}", full_name: "PH SM4", pre_disability_monthly_income_cents: 1000000 }
              as: Underwriter
              captures: { ph_id: $.data.id }
            - call: "POST /disability/policies"
              payload: { insurer_id: "${ins_id}", policyholder_id: "${ph_id}", occupation_class_id: "${oc_id}", monthly_benefit_cents: 500000, benefit_period_months: 12, elimination_period_days: 90, occupation_definition: "ANY_OCC" }
              as: Underwriter
              captures: { p_id: $.data.id }
            - call: "POST /disability/policies/${p_id}/activate"
              payload: {}
              as: Underwriter
            - call: "POST /disability/claims"
              payload: { insurer_id: "${ins_id}", policy_id: "${p_id}", disability_onset_month: 0, claimed_disability_type: "TOTAL" }
              as: Policyholder
              as_user_id: "${ph_id}"
              captures: { c_id: $.data.id }
            - call: "POST /disability/claims/${c_id}/submit"
              payload: {}
              as: Policyholder
              as_user_id: "${ph_id}"
            - call: "POST /disability/claims/${c_id}/begin-review"
              payload: {}
              as: ClaimsAdjudicator
          trigger:
            - call: "POST /disability/policies/${p_id}/terminate"
              payload: {}
              as: Underwriter
              captures: { err: $.data.error_id }
          assert:
            - "HTTP 409 and data.error_id == ERR_OPEN_CLAIM_EXISTS"

      - name: terminate_policy_cascades_approved_claim_to_closed
        claim_type: Side Effect Execution
        grounds:
          - state_machines.Policy.transitions.lifecycle_status_ACTIVE_to_TERMINATED
          - state_machines.Claim.transitions.APPROVED_to_CLOSED
        distinguishing_aspect: "Terminating an ACTIVE policy cascades its APPROVED claim to CLOSED (cascade-down side effect)."
        test_recipe:
          setup: ["Insurer at month 5; an ACTIVE policy with an APPROVED claim (no open reviews)."]
          setup_api_calls:
            - call: "POST /disability/insurers"
              payload: { name: "SM5 Insurer" }
              as: Underwriter
              captures: { ins_id: $.data.id }
            - call: "POST /disability/insurers/${ins_id}/clock/advance"
              payload: { by_months: 5 }
              as: SystemOperator
            - call: "POST /disability/occupation-classes"
              payload: { insurer_id: "${ins_id}", code: "MED", risk_tier: "MEDIUM", max_benefit_months: 120, min_elimination_days: 0, own_occ_window_months_cap: 60 }
              as: Underwriter
              captures: { oc_id: $.data.id }
            - call: "POST /disability/policyholders"
              payload: { insurer_id: "${ins_id}", full_name: "PH SM5", pre_disability_monthly_income_cents: 1000000 }
              as: Underwriter
              captures: { ph_id: $.data.id }
            - call: "POST /disability/policies"
              payload: { insurer_id: "${ins_id}", policyholder_id: "${ph_id}", occupation_class_id: "${oc_id}", monthly_benefit_cents: 500000, benefit_period_months: 12, elimination_period_days: 90, occupation_definition: "ANY_OCC" }
              as: Underwriter
              captures: { p_id: $.data.id }
            - call: "POST /disability/policies/${p_id}/activate"
              payload: {}
              as: Underwriter
            - call: "POST /disability/claims"
              payload: { insurer_id: "${ins_id}", policy_id: "${p_id}", disability_onset_month: 0, claimed_disability_type: "TOTAL" }
              as: Policyholder
              as_user_id: "${ph_id}"
              captures: { c_id: $.data.id }
            - call: "POST /disability/claims/${c_id}/submit"
              payload: {}
              as: Policyholder
              as_user_id: "${ph_id}"
            - call: "POST /disability/claims/${c_id}/begin-review"
              payload: {}
              as: ClaimsAdjudicator
            - call: "POST /disability/claims/${c_id}/approve"
              payload: {}
              as: ClaimsAdjudicator
          trigger:
            - call: "POST /disability/policies/${p_id}/terminate"
              payload: {}
              as: Underwriter
            - call: "GET /disability/claims/${c_id}"
              payload: {}
              as: ClaimsAdjudicator
              captures: { c_status: $.data.status }
          assert:
            - "Policy.${p_id}.lifecycle_status == TERMINATED"
            - "Claim.${c_id}.status == CLOSED (cascade)"

      - name: void_benefit_period_already_reversed_returns_invalid_state
        claim_type: Idempotency
        grounds:
          - state_machines.BenefitPeriod.transitions.ACCRUED_to_REVERSED
          - errors[ERR_BENEFIT_PERIOD_NOT_ACCRUED]
        distinguishing_aspect: "Voiding a BenefitPeriod already REVERSED returns 409 ERR_BENEFIT_PERIOD_NOT_ACCRUED."
        test_recipe:
          setup: ["Insurer at month 5; APPROVED TOTAL claim; one BenefitPeriod accrued at month 3 then voided."]
          setup_api_calls:
            - call: "POST /disability/insurers"
              payload: { name: "SM6 Insurer" }
              as: Underwriter
              captures: { ins_id: $.data.id }
            - call: "POST /disability/insurers/${ins_id}/clock/advance"
              payload: { by_months: 5 }
              as: SystemOperator
            - call: "POST /disability/occupation-classes"
              payload: { insurer_id: "${ins_id}", code: "MED", risk_tier: "MEDIUM", max_benefit_months: 120, min_elimination_days: 0, own_occ_window_months_cap: 60 }
              as: Underwriter
              captures: { oc_id: $.data.id }
            - call: "POST /disability/policyholders"
              payload: { insurer_id: "${ins_id}", full_name: "PH SM6", pre_disability_monthly_income_cents: 1000000 }
              as: Underwriter
              captures: { ph_id: $.data.id }
            - call: "POST /disability/policies"
              payload: { insurer_id: "${ins_id}", policyholder_id: "${ph_id}", occupation_class_id: "${oc_id}", monthly_benefit_cents: 500000, benefit_period_months: 12, elimination_period_days: 90, occupation_definition: "ANY_OCC" }
              as: Underwriter
              captures: { p_id: $.data.id }
            - call: "POST /disability/policies/${p_id}/activate"
              payload: {}
              as: Underwriter
            - call: "POST /disability/claims"
              payload: { insurer_id: "${ins_id}", policy_id: "${p_id}", disability_onset_month: 0, claimed_disability_type: "TOTAL" }
              as: Policyholder
              as_user_id: "${ph_id}"
              captures: { c_id: $.data.id }
