        claim_type: optimistic_concurrency
        grounds:
          - "concurrency_rules[vend-create-stale-machine]"
          - "errors[ERR_STALE_VERSION]"
        distinguishing_aspect: "A second vend carrying the machine's pre-first-vend version -> ERR_STALE_VERSION (412); machine.version advanced on the first vend."
