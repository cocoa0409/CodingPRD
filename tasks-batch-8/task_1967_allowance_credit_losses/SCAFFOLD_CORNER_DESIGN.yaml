        claim_type: cross_entity_validation
        grounds: [state_machines.ModelRun.DRAFT_to_EXECUTED, "errors[ERR_MODEL_NOT_ACTIVE]"]
        distinguishing_aspect: "A run created against model A cannot execute after model B's activation auto-retired A: execute fails with ERR_MODEL_NOT_ACTIVE (cross-entity state gate ModelRun x LossModel)."
        test_recipe:
          setup: ["Run DRAFT referencing model A; model B created and activated afterwards"]
          setup_api_calls:
            - call: "POST /cecl/loss-models"
              payload: { name: "CECL-A", method: LOSS_RATE, forecast_period_quarters: 2, reversion_method: IMMEDIATE, reversion_period_quarters: 0, historical_lookback_quarters: 8 }
              as: ModelValidator
              captures: { m_a: $.data.id }
            - call: "POST /cecl/loss-models/${m_a}/activate"
              payload: {}
              as: ModelValidator
            - call: "POST /cecl/economic-scenarios"
              payload: { name: "Baseline", scenario_type: BASELINE, unemployment_rate_bps: 500, gdp_growth_bps: 200, effective_from_period: "2026-Q1", effective_to_period: "2027-Q1" }
              as: ModelValidator
              captures: { sc_base: $.data.id }
            - call: "POST /cecl/model-runs"
              payload: { as_of_period: "2026-Q1", loss_model_id: "${m_a}", scenario_weights: [ { scenario_id: "${sc_base}", weight_bps: 10000 } ] }
              as: CreditAnalyst
              captures: { run_id: $.data.id }
            - call: "POST /cecl/loss-models"
              payload: { name: "CECL-B", method: VINTAGE, forecast_period_quarters: 4, reversion_method: STRAIGHT_LINE, reversion_period_quarters: 2, historical_lookback_quarters: 12 }
              as: ModelValidator
              captures: { m_b: $.data.id }
            - call: "POST /cecl/loss-models/${m_b}/activate"
              payload: {}
              as: ModelValidator
          trigger:
            - call: "POST /cecl/model-runs/${run_id}/execute"
              payload: {}
              as: CreditAnalyst
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_MODEL_NOT_ACTIVE (${err})"
            - "LossModel.${m_a}.status == RETIRED; LossModel.${m_b}.status == ACTIVE"

