            - { call: "POST /pm/disputes/${disp_a}/escalate", payload: {}, as: Tenant, as_user_id: "${ten_a}" }
            - { call: "POST /pm/disputes/${disp_b}/escalate", payload: {}, as: Tenant, as_user_id: "${ten_b}" }
          assert:
            - "DepositStatement.${stmt_a}.late == false, deadline_on == 2026-08-22, deduction_total_cents == 68000, refund_due_cents == 141337"
            - "DepositStatement.${stmt_b}.late == true, deduction_total_cents == 68000, refund_due_cents == 141337 (still billed; lateness is not forfeiture)"
            - "Dispute.${disp_a}.exposure_cents == 20000 (timely: no multiplier)"
            - "Dispute.${disp_b}.exposure_cents == 40000 (late: bad_faith_multiplier 2 applies)"

      - name: carpet_age_exactly_life_zero_charge
        grounds:
