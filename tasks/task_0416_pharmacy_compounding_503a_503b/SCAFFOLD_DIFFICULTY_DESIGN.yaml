      - name: anticipatory_rolling_window_aggregate_capacity_overlap
        grounds:
          - calculations.anticipatory_consumed_units
          - validations[priority=15]
          - entities.AnticipatoryLimitLedger.fields.consumed_units
          - entities.AnticipatoryLimitLedger.fields.window_start_utc
          - errors[ERR_ANTICIPATORY_LIMIT_EXCEEDED]
          - state_machines.CompoundingBatch.QUARANTINED_to_RELEASED
        distinguishing_aspect: |
          The anticipatory ledger is an aggregate-capacity rolling time window
          [current_utc - window_days, current_utc] (left-inclusive) on the
          MasterFormulationRecord resource: a second OFFICE_USE release whose yield
          plus the prior in-window released yield exceeds anticipatory_max_units
          collides with the window's aggregate capacity and is rejected
          ERR_ANTICIPATORY_LIMIT_EXCEEDED — aggregate-capacity interval semantics,
          distinct from instance 1's point-vs-interval BUD boundary.
