            - "after finalize: settle succeeds; LeaseAssignment.${asg}.billable_days == 20 and final_rent_cents == 100000"
            - "DamageAssessment.${da}.lessee_liable_cents == 13250 (6000 + 0.5 x 14500; age 11 < 30 so no betterment)"
      - name: retrofit_certification_ungates_tank_assignment
        grounds:
          - validations[priority=8]
          - state_machines.RetrofitOrder.COMPLETED_to_CERTIFIED
          - errors[ERR_TANK_CAR_NONCOMPLIANT]
        distinguishing_aspect: |
          Pair RetrofitOrder/ComplianceDirective -> LeaseAssignment (third distinct pair): a
