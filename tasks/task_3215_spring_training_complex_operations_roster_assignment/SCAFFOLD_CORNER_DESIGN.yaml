        distinguishing_aspect: "Packaging is allowed only between six hours before first pitch and first pitch itself, so a call 12 hours early is refused with 422 ERR_OUTSIDE_WINDOW while the same call inside the window locks the confirmed participation."
        test_recipe:
          setup:
            - "Logical clock at 2026-01-05T00:00:00Z. One DEDICATED complex with a published HOME game at 2026-02-12T19:00:00Z and one cleared position player confirmed into the home squad."
