              as_user_id: "${ck_cl}"
              captures: { ag_run: $.data.id }
            - call: "POST /payroll-runs/${ag_run}/submit"
              payload: {}
              as: ClientPayrollAdmin
              as_user_id: "${ck_cl}"
            - call: "GET /clients/${ck_cl}"
              payload: {}
              as: BureauCompliance
              captures: { ag_clv: $.data.version }
            - call: "POST /payroll-runs/${ag_run}/initiate-impound"
              payload: { expected_client_version: "${ag_clv}" }
              as: ClientPayrollAdmin
              as_user_id: "${ck_cl}"
              captures: { ag_imp: $.data.id }
            - call: "POST /impounds/${ag_imp}/settle"
              payload: {}
              as: BureauTreasury
            - call: "GET /payroll-runs/${ag_run}"
              payload: {}
              as: BureauTaxFiler
              captures: { ag_runv: $.data.version }
            - call: "POST /payroll-runs/${ag_run}/deposits"
