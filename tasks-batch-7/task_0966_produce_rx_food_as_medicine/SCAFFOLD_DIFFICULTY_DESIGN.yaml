      - name: tier2_threshold_exact_completion_count
        grounds:
          - calculations.engagement_tier
          - entities.Program.fields.tier2_completions
          - entities.Enrollment.fields.engagement_tier
        distinguishing_aspect: |
          Boundary on a COUNT metric via POST
