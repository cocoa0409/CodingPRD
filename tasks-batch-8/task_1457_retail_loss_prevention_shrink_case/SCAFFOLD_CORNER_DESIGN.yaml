        distinguishing_aspect: "Two-stage guard: closing a store with an OPEN period fails ERR_PERIOD_LOCKED; after reconciling and closing the period, store close succeeds — and any child creation (exception event) against the CLOSED store then fails ERR_STORE_CLOSED."
