  # ===========================================================================
  # Section: rbac
  # ===========================================================================
  - section: rbac
    instances:
      - name: reviewer_cannot_create_board_meeting
        claim_type: role_denial
        grounds: ["roles[Reviewer]", "endpoints[POST /irb/board-meetings]", "errors[ERR_FORBIDDEN]"]
        distinguishing_aspect: "The Reviewer role is not in the endpoint's roles list; even a valid member identity is denied with ERR_FORBIDDEN (403)."
        test_recipe:
          setup: ["One member exists"]
          setup_api_calls:
            - call: "POST /irb/irb-members"
              payload: { full_name: "Rev RB", email: "revrb@univ.edu", member_category: "SCIENTIST" }
              as: IrbAdmin
              captures: { m: $.data.id }
          trigger:
            - call: "POST /irb/board-meetings"
              payload: { room_id: "R-RB", scheduled_at: "2026-06-01T10:00:00Z", duration_minutes: 60 }
              as: Reviewer
              as_user_id: "${m}"
              captures: { err: $.data.error_id }
          assert:
            - "Rejected with error_id ERR_FORBIDDEN (http 403)"

      - name: pi_cannot_submit_others_protocol
        claim_type: role_denial
        grounds: ["roles[PrincipalInvestigator]", "errors[ERR_FORBIDDEN]", entities.Protocol.fields.pi_id]
        distinguishing_aspect: "Entity-backed ownership: PI-B's X-User-ID does not equal Protocol.pi_id (PI-A), so PI-B's submit is ERR_FORBIDDEN even though all other preconditions would pass."
        test_recipe:
          setup: ["PI-A with a DRAFT protocol (consent document attached); PI-B exists"]
          setup_api_calls:
            - call: "POST /irb/investigators"
              payload: { full_name: "Dr A", email: "pia@univ.edu", department: "Math", training_expires_at: "2027-01-01T00:00:00Z" }
              as: IrbAdmin
              captures: { inv_a: $.data.id }
            - call: "POST /irb/investigators"
              payload: { full_name: "Dr B", email: "pib@univ.edu", department: "Math", training_expires_at: "2027-01-01T00:00:00Z" }
              as: IrbAdmin
              captures: { inv_b: $.data.id }
            - call: "POST /irb/protocols"
              payload: { title: "Owned by A", claimed_review_level: "EXPEDITED", risk_level: "MINIMAL" }
              as: PrincipalInvestigator
              as_user_id: "${inv_a}"
              captures: { p: $.data.id }
            - call: "POST /irb/protocols/${p}/consent-documents"
              payload: { file_ref: "s3://consent/own.pdf" }
              as: PrincipalInvestigator
              as_user_id: "${inv_a}"
          trigger:
            - call: "POST /irb/protocols/${p}/submit"
              payload: {}
              as: PrincipalInvestigator
              as_user_id: "${inv_b}"
              captures: { err: $.data.error_id }
          assert:
            - "Rejected with error_id ERR_FORBIDDEN (http 403)"
            - "Protocol.${p}.status == DRAFT"

      - name: non_chair_member_cannot_convene
        claim_type: role_denial
        grounds: ["roles[IrbChair]", "errors[ERR_FORBIDDEN]", entities.IrbMember.fields.is_chair]
        distinguishing_aspect: "IrbChair is entity-backed by IrbMember but gated on is_chair: a plain member acting with role IrbChair is denied with ERR_FORBIDDEN."
        test_recipe:
          setup: ["Member m_plain (is_chair false); meeting M SCHEDULED"]
          setup_api_calls:
            - call: "POST /irb/irb-members"
              payload: { full_name: "Plain Member", email: "plain@univ.edu", member_category: "SCIENTIST" }
              as: IrbAdmin
              captures: { m_plain: $.data.id }
            - call: "POST /irb/board-meetings"
              payload: { room_id: "R-NC", scheduled_at: "2026-06-01T10:00:00Z", duration_minutes: 60 }
              as: IrbCoordinator
              captures: { mtg: $.data.id }
          trigger:
            - call: "POST /irb/board-meetings/${mtg}/convene"
              payload: { attendee_member_ids: ["${m_plain}"] }
              as: IrbChair
              as_user_id: "${m_plain}"
              captures: { err: $.data.error_id }
          assert:
            - "Rejected with error_id ERR_FORBIDDEN (http 403)"

      - name: unauthenticated_request_rejected
        claim_type: role_denial
        grounds: ["validations[priority=1]", "errors[ERR_UNAUTHENTICATED]"]
        distinguishing_aspect: "A request with no X-User-Role/X-User-ID headers fails priority 1 with ERR_UNAUTHENTICATED (401) before any role or existence check."
        test_recipe:
          setup: ["One anchor investigator"]
          setup_api_calls:
            - call: "POST /irb/investigators"
              payload: { full_name: "Dr An", email: "an@univ.edu", department: "Math", training_expires_at: "2027-01-01T00:00:00Z" }
              as: IrbAdmin
          trigger:
            - call: "GET /irb/protocols/00000000-0000-0000-0000-000000000000"
              captures: { err: $.data.error_id }
          assert:
            - "Rejected with error_id ERR_UNAUTHENTICATED (http 401), not a 404"

