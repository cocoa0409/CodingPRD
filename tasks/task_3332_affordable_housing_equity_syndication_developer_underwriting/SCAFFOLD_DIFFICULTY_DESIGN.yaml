  - rule_id: compensating_invariant
    instances:

      - name: commit_then_rescind_conserves_committed_credit_dollars
        grounds:
          - calculations.compensating_invariants
          - state_machines.Project.transitions.UNDERWRITING_to_COMMITTED
          - state_machines.Allocation.transitions.COMMITTED_to_RESCINDED
          - entities.Project.fields.committed_credit_dollars_cents
        distinguishing_aspect: "The conserved quantity is credit dollars: committing raises Project.committed_credit_dollars_cents by the allocation's award, and rescinding that same allocation afterwards must return the field to its pre-commit value to the cent."
        test_recipe:
          setup:
            - "Project Riverside Commons has a FINAL underwriting and one AWARDED allocation of 912345678 credit dollars."
            - "The logical clock is 2026-09-02T00:00:00Z."
