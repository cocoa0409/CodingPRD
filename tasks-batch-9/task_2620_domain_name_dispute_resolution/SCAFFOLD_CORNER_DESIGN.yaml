              as_user_id: "cm-001"
              captures: { cpl_own: "$.data.id" }
            - call: "POST /udrp/complainants"
              payload: { legal_name: "Stranger Ltd", country_code: "GB", email: "ip@stranger.example" }
              as: CaseManager
              as_user_id: "cm-001"
              captures: { cpl_other: "$.data.id" }
            - call: "POST /udrp/cases"
              payload: { complainant_id: "${cpl_own}", domain_id: "${dom_id}", mutual_jurisdiction: "US", remedy_requested: "TRANSFER", panel_election: "SINGLE" }
              as: Complainant
              as_user_id: "${cpl_own}"
              captures: { case_id: "$.data.id" }
          trigger:
            - call: "POST /udrp/cases/${case_id}/grounds"
              payload: { ground_type: "TRADEMARK_RIGHTS", assertion_text: "A stranger asserting rights on someone else's case.", evidence_count: 1, similarity_claim: "IDENTICAL" }
              as: Complainant
              as_user_id: "${cpl_other}"
              captures: { err_ground: "$.data.error_id" }
            - call: "POST /udrp/cases/${case_id}/withdraw"
              payload: { reason: "A stranger withdrawing someone else's case." }
              as: Complainant
              as_user_id: "${cpl_other}"
              captures: { err_withdraw: "$.data.error_id" }
            - call: "POST /udrp/cases/${case_id}/grounds"
              payload: { ground_type: "NOT_A_GROUND_TYPE", assertion_text: "Malformed and unowned at once.", evidence_count: -4 }
              as: Complainant
              as_user_id: "${cpl_other}"
              captures: { err_both: "$.data.error_id" }
            - call: "POST /udrp/cases/${case_id}/grounds"
              payload: { ground_type: "TRADEMARK_RIGHTS", assertion_text: "OWNER is a registered mark, exhibit A attached.", evidence_count: 1, similarity_claim: "IDENTICAL" }
              as: CaseManager
              as_user_id: "cm-001"
              captures: { cm_ground_id: "$.data.id" }
            - call: "POST /udrp/cases/${case_id}/grounds"
              payload: { ground_type: "NO_LEGITIMATE_INTEREST", assertion_text: "No trading history under the name.", evidence_count: 1 }
              as: Complainant
              as_user_id: "${cpl_own}"
              captures: { own_ground_id: "$.data.id" }
            - call: "GET /udrp/cases/${case_id}/grounds"
              payload: {}
              as: CaseManager
              as_user_id: "cm-001"
              captures: { ground_total: "$.meta.total_count", ground0_type: "$.data[0].ground_type" }
            - call: "GET /udrp/cases/${case_id}"
              payload: {}
              as: CaseManager
              as_user_id: "cm-001"
              captures: { case_status: "$.data.status" }
          assert:
            - "The stranger's ground returns HTTP 403 with data.error_id == 'ERR_NOT_OWNER'"
            - "The stranger's withdrawal returns HTTP 403 with data.error_id == 'ERR_NOT_OWNER' and Case.${case_id}.status is still FILED"
            - "The stranger's malformed ground still returns HTTP 403 with data.error_id == 'ERR_NOT_OWNER', not the 400 the bad enum and the negative evidence_count would earn, because priority 25 precedes priority 38"
            - "The CaseManager's ground is accepted with HTTP 201 - the ownership rule binds the Complainant role only"
            - "The owner's own ground is accepted with HTTP 201 and GET /udrp/cases/${case_id}/grounds reports meta.total_count 2, so exactly the two legitimate rows exist"

      - name: respondent_identity_is_proven_by_the_payload_email_not_by_the_header
        claim_type: violation_to_error
        grounds:
          - validations[priority=27].ERR_RESPONDENT_IDENTITY_MISMATCH
          - roles.Respondent.ownership_rule
          - entities.Case.fields.verified_registrant_email
        distinguishing_aspect: "The Respondent is the only role with no backing entity, because the registrant is unknown until the registrar discloses it. Identity is therefore proven per request by the payload's respondent_email against Case.verified_registrant_email, so a wrong email fails even from a plausible operator id, and the right email succeeds from an operator id that matches nothing in the database."
        test_recipe:
          setup:
            - "Clock 2026-08-01T00:00:00Z; registrar IANA-9039; domain ident.example; complainant Ident Ltd (country_code GB); a single-member case driven to COMMENCED, with verified_registrant_email registrant@ident.example disclosed by the registrar."
