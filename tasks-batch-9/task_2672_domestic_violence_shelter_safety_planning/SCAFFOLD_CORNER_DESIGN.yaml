# Scaffold Corner Design (1.9) - breadth probe over every testable claim the scaffold's
# 1.1-1.7 surface declares that SCAFFOLD_DIFFICULTY_DESIGN.yaml (1.8) does not already cover.
# Sections and claim_type values come from references/claim-extraction-guide.md.
scaffold_corner_design:

  - section: entities
    instances:
      - name: client_creation_populates_every_declared_field
        claim_type: creation
        grounds:
          - entities.Client
          - endpoints[POST /clients]
        distinguishing_aspect: |
          A create with every input field present returns 201 and echoes all seven inputs while the
          server initializes all six computed/system fields to their declared launch values and
          version to 1 - no computed field is left null that 1.1 declares a default for.
        test_recipe:
          setup:
            - "One HotlineAdvocate (Rosa Marin) exists."
            - "No Client row exists yet."
            - "The logical clock is at its startup default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /staff-members"
              payload: { full_name: "Rosa Marin", role_type: "HOTLINE_ADVOCATE", max_caseload: 10 }
              as: AgencyAdmin
              captures: { adv_id: "$.data.id" }
          trigger:
            - call: "POST /clients"
              payload: { client_code: "C-1001", legal_name: "Alina Ford", household_size: 4, minor_children_count: 2, accessibility_required: false, location_confidential: true, hmis_disclosure_consent: "DENIED" }
              as: HotlineAdvocate
              as_user_id: "${adv_id}"
              captures: { client_id: "$.data.id", client_v: "$.data.version" }
          assert:
            - "HTTP 201 and the envelope carries meta.api_request_id, meta.api_request_timestamp and response_type object"
            - "Echoed inputs: client_code == C-1001, legal_name == Alina Ford, household_size == 4, minor_children_count == 2, accessibility_required == false, location_confidential == true, hmis_disclosure_consent == DENIED"
            - "Initialized fields: status == INTAKE, confidentiality_posture == NORMAL, current_danger_score == null, current_risk_band == null, protective_order_active == false, resource_referral_count == 0"
            - "${client_v} == 1 and id is a bare UUID with no type prefix"
            - "created_at and updated_at are ISO 8601 UTC with three fractional digits and are equal on a freshly created row"

      - name: shelter_unit_retrieval_returns_the_stored_row
        claim_type: retrieval
        grounds:
          - entities.ShelterUnit
          - endpoints[GET /shelter-units/{id}]
        distinguishing_aspect: |
          GET /shelter-units/{id} returns exactly what the create stored, including the three
          ledger counters the create derived - the read path performs no recomputation drift.
        test_recipe:
          setup:
            - "One ShelterManager (Dana Whit) exists."
            - "Shelter Cedar House has one FAMILY_SUITE unit A1 of bed_capacity 4 and no admissions."
          setup_api_calls:
            - call: "POST /staff-members"
              payload: { full_name: "Dana Whit", role_type: "SHELTER_MANAGER", max_caseload: 20 }
              as: AgencyAdmin
              captures: { mgr_id: "$.data.id" }
            - call: "POST /shelters"
              payload: { name: "Cedar House", confidential_location: true, nightly_rate_cents: 8500, weekend_surcharge_cents: 2500, child_supplement_cents: 1200 }
              as: ShelterManager
              as_user_id: "${mgr_id}"
              captures: { shelter_id: "$.data.id" }
            - call: "POST /shelters/${shelter_id}/units"
              payload: { unit_label: "A1", unit_type: "FAMILY_SUITE", bed_capacity: 4 }
              as: ShelterManager
              as_user_id: "${mgr_id}"
              captures: { unit_id: "$.data.id" }
          trigger:
            - call: "GET /shelter-units/${unit_id}"
              payload: {}
              as: ShelterManager
              as_user_id: "${mgr_id}"
          assert:
            - "HTTP 200 and data.id == ${unit_id}"
            - "shelter_id == ${shelter_id}, unit_label == A1, unit_type == FAMILY_SUITE, bed_capacity == 4"
            - "reserved_beds == 0, occupied_beds == 0, available_beds == 4, status == AVAILABLE"
            - "version == 1 and updated_at == created_at"

      - name: hotline_call_listing_paginates_with_total_count_and_has_more
        claim_type: listing
        grounds:
          - endpoints[GET /hotline-calls]
          - response_envelope.pagination_fields
        distinguishing_aspect: |
          limit/offset paging over three calls of one client: page one returns 2 rows with
          total_count 3 and has_more true, page two returns the remaining row with has_more false.
          total_count counts the filtered set, not the page.
        test_recipe:
          setup:
            - "One HotlineAdvocate (Rosa Marin) and one Client C-1002 exist."
            - "The client has exactly three HotlineCall rows, all still in status RECEIVED."
          setup_api_calls:
            - call: "POST /staff-members"
              payload: { full_name: "Rosa Marin", role_type: "HOTLINE_ADVOCATE", max_caseload: 10 }
              as: AgencyAdmin
              captures: { adv_id: "$.data.id" }
            - call: "POST /clients"
              payload: { client_code: "C-1002", legal_name: "Bea Lang", household_size: 2, minor_children_count: 0, accessibility_required: false, location_confidential: true }
              as: HotlineAdvocate
              as_user_id: "${adv_id}"
              captures: { client_id: "$.data.id" }
            - call: "POST /hotline-calls"
              payload: { client_id: "${client_id}", caller_type: "SURVIVOR", presenting_concerns: "First contact, asking what options exist." }
              as: HotlineAdvocate
              as_user_id: "${adv_id}"
              captures: { call1: "$.data.id" }
            - call: "POST /hotline-calls"
              payload: { client_id: "${client_id}", caller_type: "FAMILY_MEMBER", presenting_concerns: "Sister calling on her behalf." }
              as: HotlineAdvocate
              as_user_id: "${adv_id}"
              captures: { call2: "$.data.id" }
            - call: "POST /hotline-calls"
              payload: { client_id: "${client_id}", caller_type: "PROFESSIONAL_REFERRAL", presenting_concerns: "Clinic nurse referring the survivor." }
              as: HotlineAdvocate
              as_user_id: "${adv_id}"
              captures: { call3: "$.data.id" }
          trigger:
            - call: "GET /hotline-calls"
              payload: { client_id: "${client_id}", limit: 2, offset: 0 }
              as: HotlineAdvocate
              as_user_id: "${adv_id}"
              captures: { first_id: "$.data[0].id" }
            - call: "GET /hotline-calls"
              payload: { client_id: "${client_id}", limit: 2, offset: 2 }
              as: HotlineAdvocate
              as_user_id: "${adv_id}"
              captures: { third_id: "$.data[0].id" }
          assert:
            - "Call 1: HTTP 200, response_type array, exactly 2 rows, total_count == 3, has_more == true, limit == 2, offset == 0"
            - "Call 2: exactly 1 row, total_count == 3, has_more == false, limit == 2, offset == 2"
            - "The three ids across both pages are exactly {${call1}, ${call2}, ${call3}} with no repetition, and ${first_id} != ${third_id}"
            - "Every returned row has status == RECEIVED, taken_by_staff_id == ${adv_id} and received_at_utc == 2026-08-01T00:00:00.000Z"

      - name: get_client_with_unknown_id_returns_not_found
        claim_type: not_found
        grounds:
          - errors[ERR_CLIENT_NOT_FOUND]
          - validations[priority 40]
        distinguishing_aspect: |
          A well-formed UUID that matches no row yields 404 ERR_CLIENT_NOT_FOUND in the error
          envelope - not 200 with a null body and not 400.
        test_recipe:
          setup:
            - "One HotlineAdvocate (Rosa Marin) exists and no Client row exists."
          setup_api_calls:
            - call: "POST /staff-members"
              payload: { full_name: "Rosa Marin", role_type: "HOTLINE_ADVOCATE", max_caseload: 10 }
              as: AgencyAdmin
              captures: { adv_id: "$.data.id" }
          trigger:
            - call: "GET /clients/2f4d0000-0000-4000-8000-000000000001"
              payload: {}
              as: HotlineAdvocate
              as_user_id: "${adv_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 404 and ${err} == ERR_CLIENT_NOT_FOUND"
            - "response_type == error and data.message is a non-empty string"
            - "data carries no entity fields - only error_id and message"

      - name: client_create_missing_required_household_size_returns_invalid_request
        claim_type: required_fields
        grounds:
          - endpoints[POST /clients].input
          - validations[priority 30]
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: |
          household_size carries no default in 1.1, so omitting it is a 400 ERR_INVALID_REQUEST and
          no Client row is created - the optional siblings minor_children_count,
          accessibility_required, location_confidential and hmis_disclosure_consent are not.
        test_recipe:
          setup:
            - "One HotlineAdvocate (Rosa Marin) exists and no Client row exists."
          setup_api_calls:
            - call: "POST /staff-members"
              payload: { full_name: "Rosa Marin", role_type: "HOTLINE_ADVOCATE", max_caseload: 10 }
              as: AgencyAdmin
              captures: { adv_id: "$.data.id" }
          trigger:
            - call: "POST /clients"
              payload: { client_code: "C-1003", legal_name: "Cara Vex" }
              as: HotlineAdvocate
              as_user_id: "${adv_id}"
              captures: { err: "$.data.error_id" }
            - call: "POST /clients"
              payload: { client_code: "C-1003", legal_name: "Cara Vex", household_size: 3 }
              as: HotlineAdvocate
              as_user_id: "${adv_id}"
              captures: { ok_id: "$.data.id" }
          assert:
            - "Call 1: HTTP 400 and ${err} == ERR_INVALID_REQUEST"
            - "Call 1 creates nothing: the retry in call 2 with the same client_code succeeds with HTTP 201, proving the uniqueness check at priority 84 sees no leftover row"
            - "Call 2: ${ok_id} is a fresh UUID, household_size == 3 and version == 1"

      - name: omitted_optional_inputs_take_their_declared_defaults
        claim_type: defaults
        grounds:
          - entities.StaffMember.fields.max_caseload
          - entities.Client.fields.minor_children_count
          - entities.Client.fields.hmis_disclosure_consent
          - entities.Shelter.fields.weekend_surcharge_cents
          - endpoints[POST /staff-members]
          - endpoints[POST /clients]
          - endpoints[POST /shelters]
        distinguishing_aspect: |
          Every 1.5 input marked optional whose 1.1 field declares a default resolves to exactly
          that default when omitted: max_caseload 8, minor_children_count 0,
          accessibility_required false, location_confidential true, hmis_disclosure_consent DENIED,
          confidential_location true, weekend_surcharge_cents 0 and child_supplement_cents 0.
        test_recipe:
          setup:
            - "The database is empty."
            - "The logical clock is at its startup default 2026-08-01T00:00:00Z."
          setup_api_calls: []
          trigger:
            - call: "POST /staff-members"
              payload: { full_name: "Rosa Marin", role_type: "HOTLINE_ADVOCATE" }
              as: AgencyAdmin
              captures: { adv_id: "$.data.id", caseload_cap: "$.data.max_caseload" }
            - call: "POST /clients"
              payload: { client_code: "C-1004", legal_name: "Dana Pell", household_size: 2 }
              as: HotlineAdvocate
              as_user_id: "${adv_id}"
              captures: { client_id: "$.data.id" }
            - call: "POST /shelters"
              payload: { name: "Birch House", nightly_rate_cents: 8500 }
              as: AgencyAdmin
              captures: { shelter_id: "$.data.id" }
          assert:
            - "${caseload_cap} == 8 (StaffMember.max_caseload default) and active_caseload_count == 0, secondary_trauma_index == 0.0, wellness_posture == OPEN, last_wellness_check_at == null"
            - "Client ${client_id}: minor_children_count == 0, accessibility_required == false, location_confidential == true, hmis_disclosure_consent == DENIED"
            - "Shelter ${shelter_id}: confidential_location == true, weekend_surcharge_cents == 0, child_supplement_cents == 0"
            - "Shelter ${shelter_id}: total_bed_capacity == 0, available_beds == 0, capacity_posture == FULL (a shelter with zero units is FULL, per calculation unit_bed_ledger precision)"

      - name: risk_assessment_computed_score_fields_input_ignored
        claim_type: computed_fields
        grounds:
          - entities.RiskAssessment.fields.danger_score
          - calculations.lethality_danger_score
          - endpoints[POST /hotline-calls/{id}/risk-assessments]
        distinguishing_aspect: |
          danger_score, risk_band, base_subtotal, escalation_multiplier, variant_applied and
          corroborating_fact_count are source computed: values supplied in the request body are
          discarded and the formula result stands (44.0 * 1.10 = 48.4, MODERATE).
        test_recipe:
          setup:
            - "One HotlineAdvocate (Rosa Marin) and Client C-1005 (no prior history) exist."
            - "The client has one HotlineCall in status RECEIVED."
          setup_api_calls:
            - call: "POST /staff-members"
              payload: { full_name: "Rosa Marin", role_type: "HOTLINE_ADVOCATE", max_caseload: 10 }
              as: AgencyAdmin
              captures: { adv_id: "$.data.id" }
            - call: "POST /clients"
              payload: { client_code: "C-1005", legal_name: "Elle Doss", household_size: 2, minor_children_count: 0, accessibility_required: false, location_confidential: true }
              as: HotlineAdvocate
              as_user_id: "${adv_id}"
              captures: { client_id: "$.data.id" }
            - call: "POST /hotline-calls"
              payload: { client_id: "${client_id}", caller_type: "SURVIVOR", presenting_concerns: "He took the car keys and blocked the door." }
              as: HotlineAdvocate
              as_user_id: "${adv_id}"
              captures: { call_id: "$.data.id" }
          trigger:
            - call: "POST /hotline-calls/${call_id}/risk-assessments"
              payload: { weapon_access: true, strangulation_history: false, separation_recent: true, threats_to_kill: false, stalking_frequency_per_week: 2, corroborate_with_history: false, danger_score: 99.9, risk_band: "IMMINENT", base_subtotal: 0.0, escalation_multiplier: 3.0, variant_applied: "CORROBORATED_REVIEW", corroborating_fact_count: 5 }
              as: HotlineAdvocate
              as_user_id: "${adv_id}"
          assert:
            - "HTTP 201 and the submitted computed values are ignored: base_subtotal == 44.0, escalation_multiplier == 1.10, danger_score == 48.4, risk_band == MODERATE"
            - "variant_applied == INTAKE_SNAPSHOT and corroborating_fact_count == 0"
            - "Client.${client_id}.current_danger_score == 48.4 and current_risk_band == MODERATE"
            - "HotlineCall.${call_id}.status == RISK_ASSESSED"

      - name: hotline_call_system_fields_are_server_minted_and_input_ignored
        claim_type: system_fields
        grounds:
          - entities.HotlineCall.fields.taken_by_staff_id
          - entities.HotlineCall.fields.received_at_utc
          - entities.HotlineCall.fields.status
          - endpoints[POST /hotline-calls]
        distinguishing_aspect: |
          taken_by_staff_id comes from X-User-ID, received_at_utc from the logical clock and status
          from the state machine's initial_state: a body that names a different staff member, a
          2020 timestamp and status RISK_ASSESSED changes none of them.
        test_recipe:
          setup:
            - "Two HotlineAdvocates exist: Rosa Marin (the caller) and Tess Okoye (the decoy)."
            - "Client C-1006 exists and the logical clock is at its startup default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /staff-members"
              payload: { full_name: "Rosa Marin", role_type: "HOTLINE_ADVOCATE", max_caseload: 10 }
              as: AgencyAdmin
              captures: { adv_id: "$.data.id" }
            - call: "POST /staff-members"
              payload: { full_name: "Tess Okoye", role_type: "HOTLINE_ADVOCATE", max_caseload: 10 }
              as: AgencyAdmin
              captures: { decoy_id: "$.data.id" }
            - call: "POST /clients"
              payload: { client_code: "C-1006", legal_name: "Fern Ruiz", household_size: 2, minor_children_count: 0, accessibility_required: false, location_confidential: true }
              as: HotlineAdvocate
              as_user_id: "${adv_id}"
              captures: { client_id: "$.data.id" }
          trigger:
            - call: "POST /hotline-calls"
              payload: { client_id: "${client_id}", caller_type: "SURVIVOR", presenting_concerns: "Calling from a neighbour's phone.", taken_by_staff_id: "${decoy_id}", received_at_utc: "2020-01-01T00:00:00Z", status: "RISK_ASSESSED", version: 9 }
              as: HotlineAdvocate
              as_user_id: "${adv_id}"
              captures: { call_id: "$.data.id" }
          assert:
            - "HTTP 201 and taken_by_staff_id == ${adv_id}, never ${decoy_id}"
            - "received_at_utc == 2026-08-01T00:00:00.000Z, the logical clock reading, not the submitted 2020 value"
            - "status == RECEIVED and disposed_at == null"
            - "version == 1 (the submitted 9 is ignored) and ${call_id} is a server-minted UUID"

      - name: client_create_rejects_out_of_range_numbers_and_unknown_enums
        claim_type: type_constraints
        grounds:
          - entities.Client.fields.household_size
          - entities.Client.fields.minor_children_count
          - entities.Client.fields.hmis_disclosure_consent
          - validations[priority 30]
        distinguishing_aspect: |
          Each 1.1 constraint on Client is enforced at priority 30: household_size outside 1..12,
          minor_children_count greater than household_size - 1, an unknown consent enum, and the
          create-time-forbidden REVOKED value all return 400 ERR_INVALID_REQUEST.
        test_recipe:
          setup:
            - "One HotlineAdvocate (Rosa Marin) exists and no Client row exists."
          setup_api_calls:
            - call: "POST /staff-members"
              payload: { full_name: "Rosa Marin", role_type: "HOTLINE_ADVOCATE", max_caseload: 10 }
              as: AgencyAdmin
              captures: { adv_id: "$.data.id" }
          trigger:
            - call: "POST /clients"
              payload: { client_code: "C-1007", legal_name: "Gia Hall", household_size: 0 }
              as: HotlineAdvocate
              as_user_id: "${adv_id}"
              captures: { err_size: "$.data.error_id" }
            - call: "POST /clients"
              payload: { client_code: "C-1007", legal_name: "Gia Hall", household_size: 4, minor_children_count: 4 }
              as: HotlineAdvocate
              as_user_id: "${adv_id}"
              captures: { err_children: "$.data.error_id" }
            - call: "POST /clients"
              payload: { client_code: "C-1007", legal_name: "Gia Hall", household_size: 4, hmis_disclosure_consent: "MAYBE" }
              as: HotlineAdvocate
              as_user_id: "${adv_id}"
              captures: { err_enum: "$.data.error_id" }
            - call: "POST /clients"
              payload: { client_code: "C-1007", legal_name: "Gia Hall", household_size: 4, hmis_disclosure_consent: "REVOKED" }
              as: HotlineAdvocate
              as_user_id: "${adv_id}"
              captures: { err_revoked: "$.data.error_id" }
          assert:
            - "All four calls return HTTP 400 with error_id ERR_INVALID_REQUEST: ${err_size}, ${err_children}, ${err_enum} and ${err_revoked}"
            - "Call 2 is rejected by the compound constraint minor_children_count <= household_size - 1, so 4 of 4 is invalid while 3 of 4 would pass"
            - "Call 4 shows REVOKED is unreachable at creation; it is only settable later through POST /clients/{id}/consent"
            - "No Client row exists after the four calls"

      - name: risk_assessment_is_immutable_and_carries_no_version_field
        claim_type: immutability
        grounds:
          - entities.RiskAssessment
          - entities.WellnessCheck
        distinguishing_aspect: |
          Both common_fields false entities expose id and created_at only: no version, no
          updated_at, and 1.5 declares no update or delete endpoint for either, so a scored
          assessment is an append-only fact.
        test_recipe:
          setup:
            - "One HotlineAdvocate (Rosa Marin), Client C-1008 and one risk-assessed HotlineCall exist."
          setup_api_calls:
            - call: "POST /staff-members"
              payload: { full_name: "Rosa Marin", role_type: "HOTLINE_ADVOCATE", max_caseload: 10 }
              as: AgencyAdmin
              captures: { adv_id: "$.data.id" }
            - call: "POST /clients"
              payload: { client_code: "C-1008", legal_name: "Hana Ives", household_size: 2, minor_children_count: 0, accessibility_required: false, location_confidential: true }
              as: HotlineAdvocate
              as_user_id: "${adv_id}"
              captures: { client_id: "$.data.id" }
            - call: "POST /hotline-calls"
              payload: { client_id: "${client_id}", caller_type: "SURVIVOR", presenting_concerns: "Threats escalated after she filed for separation." }
              as: HotlineAdvocate
              as_user_id: "${adv_id}"
              captures: { call_id: "$.data.id" }
          trigger:
            - call: "POST /hotline-calls/${call_id}/risk-assessments"
              payload: { weapon_access: true, strangulation_history: false, separation_recent: true, threats_to_kill: false, stalking_frequency_per_week: 2 }
              as: HotlineAdvocate
              as_user_id: "${adv_id}"
              captures: { ra_id: "$.data.id" }
            - call: "GET /hotline-calls/${call_id}/risk-assessments"
              payload: { limit: 10, offset: 0 }
              as: HotlineAdvocate
              as_user_id: "${adv_id}"
              captures: { listed_ra: "$.data[0].id" }
          assert:
            - "The create response carries id and created_at but no version and no updated_at key"
            - "${listed_ra} == ${ra_id} and the listed row is byte-identical to the create response"
            - "1.5 declares no PATCH, PUT or DELETE for RiskAssessment or WellnessCheck, so danger_score 48.4 can never be edited after the fact"
            - "total_count == 1: a single assessment exists for the call"

      - name: plan_component_create_under_unknown_plan_returns_not_found
        claim_type: parent_relationships
        grounds:
          - entities.PlanComponent.parent
          - errors[ERR_SAFETY_PLAN_NOT_FOUND]
          - validations[priority 40]
        distinguishing_aspect: |
          PlanComponent is a child of SafetyPlan: the parent path id is resolved before the body is
          considered, so a valid component body under an unknown plan id is 404
          ERR_SAFETY_PLAN_NOT_FOUND, not 400 and not 201.
        test_recipe:
          setup:
            - "One HotlineAdvocate (Rosa Marin) exists and no SafetyPlan row exists."
          setup_api_calls:
            - call: "POST /staff-members"
              payload: { full_name: "Rosa Marin", role_type: "HOTLINE_ADVOCATE", max_caseload: 10 }
              as: AgencyAdmin
              captures: { adv_id: "$.data.id" }
          trigger:
            - call: "POST /safety-plans/2f4d0000-0000-4000-8000-000000000009/components"
              payload: { component_type: "RELOCATION", detail: "Move to the far side of the county.", target_completion_date: "2026-08-25" }
              as: HotlineAdvocate
              as_user_id: "${adv_id}"
              captures: { err: "$.data.error_id" }
          assert:
            - "HTTP 404 and ${err} == ERR_SAFETY_PLAN_NOT_FOUND"
            - "No PlanComponent row is created"

      - name: screening_request_body_foreign_keys_resolved_left_to_right_not_found
        claim_type: foreign_key_references_validated
        grounds:
          - validations[priority 45]
          - errors[ERR_CLIENT_NOT_FOUND]
          - errors[ERR_SHELTER_NOT_FOUND]
          - complexity_profile.entity_topology
        distinguishing_aspect: |
          In the flat topology every body foreign key is checked, left to right in the declared
          order: an unknown client_id reports ERR_CLIENT_NOT_FOUND even when requested_shelter_id
          is also unknown, and fixing the client surfaces ERR_SHELTER_NOT_FOUND next.
        test_recipe:
          setup:
            - "One HotlineAdvocate (Rosa Marin), Client C-1009 and one risk-assessed HotlineCall exist."
            - "No Shelter row exists."
          setup_api_calls:
            - call: "POST /staff-members"
              payload: { full_name: "Rosa Marin", role_type: "HOTLINE_ADVOCATE", max_caseload: 10 }
              as: AgencyAdmin
              captures: { adv_id: "$.data.id" }
            - call: "POST /clients"
              payload: { client_code: "C-1009", legal_name: "Ida Kerr", household_size: 2, minor_children_count: 0, accessibility_required: false, location_confidential: true }
              as: HotlineAdvocate
              as_user_id: "${adv_id}"
              captures: { client_id: "$.data.id" }
            - call: "POST /hotline-calls"
