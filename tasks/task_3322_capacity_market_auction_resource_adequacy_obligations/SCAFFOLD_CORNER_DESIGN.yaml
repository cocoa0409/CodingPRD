        distinguishing_aspect: "Every rejection uses the fixed error envelope: response_type 'error', data.error_id, data.message, and meta.api_request_id/api_request_timestamp present."
        test_recipe:
          setup: ["Empty DB"]
          setup_api_calls:
            - call: "POST /capacity-market/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
