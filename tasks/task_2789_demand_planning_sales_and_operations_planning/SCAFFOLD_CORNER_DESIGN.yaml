            - "${cycle_v_stale} != ${cycle_v_now} — the cycle advanced four times after creation, so the creation-time token is genuinely stale"
            - "The author's select returns 403 with ${err_sod} == \"ERR_SEGREGATION_OF_DUTIES\", NOT 412 — priority 80 precedes priority 90"
            - "The other executive's select with the same stale token returns 412 with ${err_occ} == \"ERR_STALE_CYCLE_VERSION\""
            - "The final select returns 200: Scenario.${sc_id}.status == \"SELECTED\" and selected_by_user_id == \"exec-2\""
            - "PlanningCycle.${cycle_id}.selected_closure_cents == 287800 and residual_gap_cents == 812200 == 1100000 - 287800, posture == \"AT_RISK\""

      - name: phase_actor_beats_cycle_frozen_on_supply_plan_create
        claim_type: Priority Ordering
        grounds:
          - validations[priority=60]
          - validations[priority=100]
          - errors.ERR_UNAUTHORIZED_PHASE_ACTOR
          - errors.ERR_CYCLE_FROZEN
        distinguishing_aspect: |
          The same PUBLISHED cycle answers two different errors depending on which priority
          lists the endpoint. POST /sop/supply-plans appears in BOTH rule 60 and rule 100, so
          the earlier phase-actor rule wins with 403 ERR_UNAUTHORIZED_PHASE_ACTOR; POST
          /sop/demand-forecasts appears only in rule 100, so it answers 409 ERR_CYCLE_FROZEN.
          Reporting ERR_CYCLE_FROZEN for the supply-plan create would be a priority inversion.
        test_recipe:
          setup:
            - "The base family, item and customer; a cycle over 2026-09..2026-09 with commitment 0 and no children, walked all the way to PUBLISHED so its posture is FROZEN."
          setup_api_calls:
            - call: "POST /sop/product-families"
              payload: { family_code: "FAM-BASE", name: "Base Family", accountable_planner_user_id: "planner-1", units_per_hour: 100, max_monthly_hours: 800 }
              as: SopAdmin
              captures: { fam_id: $.data.id }
            - call: "POST /sop/items"
              payload: { sku: "SKU-BASE", family_id: "${fam_id}", unit_price_cents: 1000, unit_cost_cents: 400, on_hand_units: 0, material_supply_cap_units: 100000, avg_monthly_demand_units: 1000, lifecycle_state: "MATURE" }
              as: SopAdmin
              captures: { item_id: $.data.id }
            - call: "POST /sop/customers"
              payload: { customer_code: "CUST-BASE", name: "Base Grocery", channel: "GROCERY", priority_rank: 3 }
              as: SopAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /sop/planning-cycles"
              payload: { cycle_code: "CY-SPLIT", horizon_start_month: "2026-09", horizon_end_month: "2026-09", financial_commitment_cents: 0, supply_review_policy: "NET_INVENTORY_FIRST" }
              as: SopAdmin
              captures: { cycle_id: $.data.id }
            - call: "POST /sop/planning-cycles/${cycle_id}/transitions"
              payload: { target_status: "SUPPLY_REVIEW" }
              as: SopAdmin
            - call: "POST /sop/planning-cycles/${cycle_id}/transitions"
              payload: { target_status: "SCENARIO_REVIEW" }
              as: SopAdmin
            - call: "POST /sop/planning-cycles/${cycle_id}/transitions"
              payload: { target_status: "EXECUTIVE_REVIEW" }
              as: SopAdmin
            - call: "POST /sop/planning-cycles/${cycle_id}/transitions"
              payload: { target_status: "PUBLISHED" }
              as: ExecutiveSponsor
              as_user_id: "exec-1"
          trigger:
            - call: "POST /sop/supply-plans"
              payload: { cycle_id: "${cycle_id}", item_id: "${item_id}" }
              as: SupplyPlanner
              as_user_id: "supply-1"
              captures: { err_plan: $.data.error_id }
            - call: "POST /sop/demand-forecasts"
              payload: { cycle_id: "${cycle_id}", item_id: "${item_id}", customer_id: "${cust_id}", month: "2026-09", level_units: 1000, trend_units_per_month: 0, seasonal_index: 1.0, causal_uplift_pct: 0 }
              as: DemandPlanner
              as_user_id: "planner-1"
              captures: { err_fc: $.data.error_id }
          assert:
            - "PlanningCycle.${cycle_id}.status == \"PUBLISHED\" and posture == \"FROZEN\""
            - "The supply-plan create returns 403 with ${err_plan} == \"ERR_UNAUTHORIZED_PHASE_ACTOR\" — NOT 409 ERR_CYCLE_FROZEN and NOT 422 ERR_FORECAST_NOT_LOCKED"
            - "The forecast create returns 409 with ${err_fc} == \"ERR_CYCLE_FROZEN\" — rule 60 does not list this endpoint, so rule 100 is the first to fire"
            - "GET /sop/supply-plans?cycle_id=${cycle_id} and GET /sop/demand-forecasts?cycle_id=${cycle_id} both return total_count == 0"

      - name: phase_closed_fires_only_where_phase_actor_is_silent
        claim_type: Priority Ordering
        grounds:
          - validations[priority=60]
          - validations[priority=110]
          - errors.ERR_CYCLE_PHASE_CLOSED
          - errors.ERR_UNAUTHORIZED_PHASE_ACTOR
        distinguishing_aspect: |
          On a cycle that has moved to SUPPLY_REVIEW the demand phase is closed, and the two
          overlapping rules split the same way as on a frozen cycle but with a non-frozen
          posture: creating a forecast answers 409 ERR_CYCLE_PHASE_CLOSED (only rule 110 lists
          it) while creating an adjustment on an existing forecast answers 403
          ERR_UNAUTHORIZED_PHASE_ACTOR (rule 60 lists it first). Both are distinct from the
          FROZEN case because posture is still GREEN.
        test_recipe:
          setup:
            - "The base family, item and customer; a cycle over 2026-09..2026-09 (commitment 0) with one forecast of 1000 units, advanced once to SUPPLY_REVIEW so the forecast is CONSENSUS_LOCKED."
          setup_api_calls:
            - call: "POST /sop/product-families"
              payload: { family_code: "FAM-BASE", name: "Base Family", accountable_planner_user_id: "planner-1", units_per_hour: 100, max_monthly_hours: 800 }
              as: SopAdmin
              captures: { fam_id: $.data.id }
            - call: "POST /sop/items"
              payload: { sku: "SKU-BASE", family_id: "${fam_id}", unit_price_cents: 1000, unit_cost_cents: 400, on_hand_units: 0, material_supply_cap_units: 100000, avg_monthly_demand_units: 1000, lifecycle_state: "MATURE" }
              as: SopAdmin
              captures: { item_id: $.data.id }
            - call: "POST /sop/customers"
              payload: { customer_code: "CUST-BASE", name: "Base Grocery", channel: "GROCERY", priority_rank: 3 }
              as: SopAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /sop/planning-cycles"
              payload: { cycle_code: "CY-CLOSED", horizon_start_month: "2026-09", horizon_end_month: "2026-09", financial_commitment_cents: 0, supply_review_policy: "NET_INVENTORY_FIRST" }
              as: SopAdmin
              captures: { cycle_id: $.data.id }
            - call: "POST /sop/demand-forecasts"
              payload: { cycle_id: "${cycle_id}", item_id: "${item_id}", customer_id: "${cust_id}", month: "2026-09", level_units: 1000, trend_units_per_month: 0, seasonal_index: 1.0, causal_uplift_pct: 0 }
              as: DemandPlanner
              as_user_id: "planner-1"
              captures: { fc_id: $.data.id, fc_v0: $.data.version }
            - call: "POST /sop/planning-cycles/${cycle_id}/transitions"
              payload: { target_status: "SUPPLY_REVIEW" }
              as: SopAdmin
            - call: "GET /sop/demand-forecasts/${fc_id}"
              payload: {}
              as: DemandPlanner
              as_user_id: "planner-1"
              captures: { fc_v_now: $.data.version }
          trigger:
            - call: "POST /sop/demand-forecasts"
              payload: { cycle_id: "${cycle_id}", item_id: "${item_id}", customer_id: "${cust_id}", month: "2026-09", level_units: 500, trend_units_per_month: 0, seasonal_index: 1.0, causal_uplift_pct: 0 }
              as: DemandPlanner
              as_user_id: "planner-1"
              captures: { err_fc: $.data.error_id }
            - call: "POST /sop/consensus-adjustments"
              payload: { demand_forecast_id: "${fc_id}", adjustment_type: "SALES_INTELLIGENCE", delta_units: 100, rationale: "too late in the cycle", expected_demand_forecast_version: "${fc_v_now}" }
              as: DemandPlanner
              as_user_id: "planner-1"
              captures: { err_adj: $.data.error_id }
          assert:
            - "PlanningCycle.${cycle_id}.status == \"SUPPLY_REVIEW\" and posture == \"GREEN\" — nothing here is frozen"
            - "The forecast create returns 409 with ${err_fc} == \"ERR_CYCLE_PHASE_CLOSED\" — NOT ERR_DUPLICATE_FORECAST, even though a 2026-09 line for the same triple already exists, because priority 110 precedes priority 150"
            - "The adjustment create returns 403 with ${err_adj} == \"ERR_UNAUTHORIZED_PHASE_ACTOR\" — NOT ERR_CYCLE_PHASE_CLOSED, because rule 60 lists this endpoint and fires first"
            - "The adjustment create also carried a CURRENT OCC token ${fc_v_now}, so priority 90 was not the failure"
            - "DemandForecast.${fc_id}.status == \"CONSENSUS_LOCKED\" and consensus_units == 1000; GET /sop/consensus-adjustments returns total_count == 0"

      - name: customer_rep_listing_allocations_without_customer_id_rejected
        claim_type: Violation to Error
        grounds:
          - validations[priority=70]
          - errors.ERR_CUSTOMER_SCOPE_VIOLATION
          - roles.CustomerRep
        distinguishing_aspect: |
          A CustomerRep's X-User-ID IS a Customer id, so an unfiltered list is a scope violation
          rather than an empty result: GET /sop/allocations with no customer_id returns 403
          ERR_CUSTOMER_SCOPE_VIOLATION, filtering by ANOTHER customer's id returns the same 403,
          and only its own id returns 200 with just its own row.
        test_recipe:
          setup:
            - "The base fixture with a 9-hour block (900 units), two customers CUST-SELF (rank 3) and CUST-OTHER (rank 4) each holding a locked forecast of 500 units, and a RATIONED SupplyPlan with constrained_units 900."
          setup_api_calls:
            - call: "POST /sop/product-families"
              payload: { family_code: "FAM-BASE", name: "Base Family", accountable_planner_user_id: "planner-1", units_per_hour: 100, max_monthly_hours: 800 }
              as: SopAdmin
              captures: { fam_id: $.data.id }
            - call: "POST /sop/items"
              payload: { sku: "SKU-BASE", family_id: "${fam_id}", unit_price_cents: 1000, unit_cost_cents: 400, on_hand_units: 0, material_supply_cap_units: 100000, avg_monthly_demand_units: 1000, service_level_target_pct: 95.0, demand_cv: 0.20, lead_time_days: 30, lifecycle_state: "MATURE" }
              as: SopAdmin
              captures: { item_id: $.data.id }
            - call: "POST /sop/customers"
              payload: { customer_code: "CUST-SELF", name: "Self Grocery", channel: "GROCERY", priority_rank: 3 }
              as: SopAdmin
              captures: { self_id: $.data.id }
            - call: "POST /sop/customers"
              payload: { customer_code: "CUST-OTHER", name: "Other Club", channel: "CLUB", priority_rank: 4 }
              as: SopAdmin
              captures: { other_id: $.data.id }
            - call: "POST /sop/capacity-blocks"
              payload: { family_id: "${fam_id}", start_date: "2026-09-01", end_date: "2026-09-30", available_hours: 9 }
              as: SupplyPlanner
              as_user_id: "supply-1"
            - call: "POST /sop/planning-cycles"
              payload: { cycle_code: "CY-SCOPE", horizon_start_month: "2026-09", horizon_end_month: "2026-09", financial_commitment_cents: 0, supply_review_policy: "NET_INVENTORY_FIRST" }
              as: SopAdmin
              captures: { cycle_id: $.data.id }
            - call: "POST /sop/demand-forecasts"
              payload: { cycle_id: "${cycle_id}", item_id: "${item_id}", customer_id: "${self_id}", month: "2026-09", level_units: 500, trend_units_per_month: 0, seasonal_index: 1.0, causal_uplift_pct: 0 }
              as: DemandPlanner
              as_user_id: "planner-1"
            - call: "POST /sop/demand-forecasts"
              payload: { cycle_id: "${cycle_id}", item_id: "${item_id}", customer_id: "${other_id}", month: "2026-09", level_units: 500, trend_units_per_month: 0, seasonal_index: 1.0, causal_uplift_pct: 0 }
              as: DemandPlanner
              as_user_id: "planner-1"
            - call: "POST /sop/planning-cycles/${cycle_id}/transitions"
              payload: { target_status: "SUPPLY_REVIEW" }
              as: SopAdmin
            - call: "POST /sop/supply-plans"
              payload: { cycle_id: "${cycle_id}", item_id: "${item_id}" }
              as: SupplyPlanner
              as_user_id: "supply-1"
              captures: { plan_id: $.data.id }
            - call: "POST /sop/supply-plans/${plan_id}/ration"
              payload: {}
              as: SupplyPlanner
              as_user_id: "supply-1"
          trigger:
            - call: "GET /sop/allocations"
              payload: {}
              as: CustomerRep
              as_user_id: "${self_id}"
              captures: { err_unscoped: $.data.error_id }
            - call: "GET /sop/allocations?customer_id=${other_id}"
              payload: {}
              as: CustomerRep
              as_user_id: "${self_id}"
              captures: { err_foreign: $.data.error_id }
            - call: "GET /sop/allocations?customer_id=${self_id}"
              payload: {}
              as: CustomerRep
              as_user_id: "${self_id}"
          assert:
            - "The unfiltered list returns 403 with ${err_unscoped} == \"ERR_CUSTOMER_SCOPE_VIOLATION\" — NOT 200 with an empty page"
            - "The foreign-scoped list returns 403 with ${err_foreign} == \"ERR_CUSTOMER_SCOPE_VIOLATION\""
            - "The self-scoped list returns 200 with total_count == 1, and its single Allocation has customer_id == ${self_id}, requested_units == 500 and allocated_units == 450"
            - "GET /sop/allocations as SupplyPlanner with no filter returns total_count == 2 — the restriction is a property of the CustomerRep role, not of the endpoint"

  - section: endpoints
    instances:
      - name: inventory_policy_reset_returns_200_item_and_bumps_version_once
        claim_type: Action endpoint
        grounds:
          - endpoints[POST /sop/items/{item_id}/inventory-policy]
          - calculations.calc_inventory_policy
          - entities.Item.fields.version
        distinguishing_aspect: |
          This is a 200 mutation on an existing Item, not a 201 sub-resource create: the
          response body is the whole Item with BOTH derived fields recomputed, and the write
          costs exactly one version increment even though two fields change. The recompute is
          unconditional rather than diff-based, so re-posting byte-identical policy inputs still
          bumps the version and still returns the same derived numbers.
        test_recipe:
          setup:
            - "One family and one MATURE item at service level 95.0, demand_cv 0.20, lead_time_days 30 and avg_monthly_demand_units 1000, so it starts at safety_stock_units 330 / reorder_point_units 1330."
            - "No cycle and no SupplyPlan exist, so the staling side effect has nothing to act on and cannot mask the Item write."
          setup_api_calls:
            - call: "POST /sop/product-families"
              payload: { family_code: "FAM-BASE", name: "Base Family", accountable_planner_user_id: "planner-1", units_per_hour: 100, max_monthly_hours: 800 }
              as: SopAdmin
              captures: { fam_id: $.data.id }
            - call: "POST /sop/items"
              payload: { sku: "SKU-BASE", family_id: "${fam_id}", unit_price_cents: 1000, unit_cost_cents: 400, on_hand_units: 0, material_supply_cap_units: 100000, avg_monthly_demand_units: 1000, service_level_target_pct: 95.0, demand_cv: 0.20, lead_time_days: 30, lifecycle_state: "MATURE" }
              as: SopAdmin
              captures: { item_id: $.data.id, v0: $.data.version, ss0: $.data.safety_stock_units, rp0: $.data.reorder_point_units }
          trigger:
            - call: "POST /sop/items/${item_id}/inventory-policy"
              payload: { service_level_target_pct: 97.5, demand_cv: 0.20, lead_time_days: 30 }
              as: SupplyPlanner
              as_user_id: "supply-1"
              captures: { v1: $.data.version, ss1: $.data.safety_stock_units, rp1: $.data.reorder_point_units }
            - call: "POST /sop/items/${item_id}/inventory-policy"
              payload: { service_level_target_pct: 97.5, demand_cv: 0.20, lead_time_days: 30 }
              as: SupplyPlanner
              as_user_id: "supply-1"
              captures: { v2: $.data.version, ss2: $.data.safety_stock_units, rp2: $.data.reorder_point_units }
          assert:
            - "${ss0} == 330 and ${rp0} == 1330 — the create already ran calc_inventory_policy from the declared defaults"
            - "Both policy calls return HTTP 200 (not 201) and the body is a full Item object carrying sku, family_id and unit_price_cents, not a bare policy fragment"
            - "${ss1} == 392 == ceil(1.96 * 0.20 * 1000 * sqrt(30 / 30)) and ${rp1} == 1392 == ceil(1000 * 30 / 30) + 392"
            - "${v1} == ${v0} + 1 — two fields changed but the version advanced exactly once"
            - "${ss2} == 392 and ${rp2} == 1392, yet ${v2} == ${v1} + 1 — the recompute is unconditional, so an identical resubmission is still a write"
            - "avg_monthly_demand_units is still 1000 and unit_price_cents is still 1000: the endpoint touches only the three declared policy inputs and the two derived fields"

      - name: accuracy_summary_worst_item_and_family_filter_narrow_the_record_set
        claim_type: Computed read
        grounds:
          - endpoints[GET /sop/planning-cycles/{cycle_id}/accuracy-summary]
          - calculations.calc_accuracy_rollup
        distinguishing_aspect: |
          worst_item_id is the argmax of PER-ITEM WMAPE, not the largest absolute error, so the
          tiny 130-unit line (30 % of 100 actual) beats the 5200-unit line that contributed 200
          units of error. The optional family_id filter re-scopes every one of the eight output
          fields, and accuracy_grade is driven by wmape_pct 4.51 (grade A) even though mape_pct
          is 17.00 (which would be grade B).
        test_recipe:
          setup:
            - "Two families FAM-SMALL (planner-s) and FAM-BIG (planner-b), each with one MATURE item, plus one customer."
            - "One cycle over 2026-09..2026-09 with commitment 0, holding a locked forecast of 130 units for ITEM-SMALL and 5200 units for ITEM-BIG, walked to PUBLISHED."
            - "Actuals of 100 and 5000 are posted, giving abs errors of 30 and 200 with ape_pct 30.00 and 4.00."
          setup_api_calls:
            - call: "POST /sop/product-families"
              payload: { family_code: "FAM-SMALL", name: "Small Family", accountable_planner_user_id: "planner-s", units_per_hour: 100, max_monthly_hours: 800 }
              as: SopAdmin
              captures: { fam_small: $.data.id }
            - call: "POST /sop/product-families"
              payload: { family_code: "FAM-BIG", name: "Big Family", accountable_planner_user_id: "planner-b", units_per_hour: 100, max_monthly_hours: 800 }
              as: SopAdmin
              captures: { fam_big: $.data.id }
            - call: "POST /sop/items"
              payload: { sku: "SKU-SMALL", family_id: "${fam_small}", unit_price_cents: 1000, unit_cost_cents: 400, on_hand_units: 0, material_supply_cap_units: 100000, avg_monthly_demand_units: 130, lifecycle_state: "MATURE" }
              as: SopAdmin
              captures: { item_small: $.data.id }
            - call: "POST /sop/items"
              payload: { sku: "SKU-BIG", family_id: "${fam_big}", unit_price_cents: 1000, unit_cost_cents: 400, on_hand_units: 0, material_supply_cap_units: 100000, avg_monthly_demand_units: 5200, lifecycle_state: "MATURE" }
              as: SopAdmin
              captures: { item_big: $.data.id }
            - call: "POST /sop/customers"
              payload: { customer_code: "CUST-BASE", name: "Base Grocery", channel: "GROCERY", priority_rank: 3 }
              as: SopAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /sop/planning-cycles"
              payload: { cycle_code: "CY-SUMMARY", horizon_start_month: "2026-09", horizon_end_month: "2026-09", financial_commitment_cents: 0, supply_review_policy: "NET_INVENTORY_FIRST" }
              as: SopAdmin
              captures: { cycle_id: $.data.id }
            - call: "POST /sop/demand-forecasts"
              payload: { cycle_id: "${cycle_id}", item_id: "${item_small}", customer_id: "${cust_id}", month: "2026-09", level_units: 130, trend_units_per_month: 0, seasonal_index: 1.0, causal_uplift_pct: 0 }
              as: DemandPlanner
              as_user_id: "planner-s"
            - call: "POST /sop/demand-forecasts"
              payload: { cycle_id: "${cycle_id}", item_id: "${item_big}", customer_id: "${cust_id}", month: "2026-09", level_units: 5200, trend_units_per_month: 0, seasonal_index: 1.0, causal_uplift_pct: 0 }
              as: DemandPlanner
              as_user_id: "planner-b"
            - call: "POST /sop/planning-cycles/${cycle_id}/transitions"
              payload: { target_status: "SUPPLY_REVIEW" }
              as: SopAdmin
            - call: "POST /sop/planning-cycles/${cycle_id}/transitions"
              payload: { target_status: "SCENARIO_REVIEW" }
              as: SopAdmin
            - call: "POST /sop/planning-cycles/${cycle_id}/transitions"
              payload: { target_status: "EXECUTIVE_REVIEW" }
              as: SopAdmin
            - call: "POST /sop/planning-cycles/${cycle_id}/transitions"
              payload: { target_status: "PUBLISHED" }
              as: ExecutiveSponsor
              as_user_id: "exec-1"
            - call: "POST /sop/accuracy-records"
              payload: { cycle_id: "${cycle_id}", item_id: "${item_small}", customer_id: "${cust_id}", actual_units: 100 }
              as: SopAdmin
            - call: "POST /sop/accuracy-records"
              payload: { cycle_id: "${cycle_id}", item_id: "${item_big}", customer_id: "${cust_id}", actual_units: 5000 }
              as: SopAdmin
          trigger:
            - call: "GET /sop/planning-cycles/${cycle_id}/accuracy-summary"
              payload: {}
              as: ExecutiveSponsor
              as_user_id: "exec-1"
              captures: { all_count: $.data.record_count, all_mape: $.data.mape_pct, all_wmape: $.data.wmape_pct, all_bias: $.data.bias_pct, all_flag: $.data.bias_flag, all_grade: $.data.accuracy_grade, all_actual: $.data.total_actual_units, all_abs: $.data.total_abs_error_units, all_worst: $.data.worst_item_id }
            - call: "GET /sop/planning-cycles/${cycle_id}/accuracy-summary?family_id=${fam_big}"
              payload: {}
              as: DemandReviewLead
              as_user_id: "lead-1"
              captures: { big_count: $.data.record_count, big_mape: $.data.mape_pct, big_wmape: $.data.wmape_pct, big_grade: $.data.accuracy_grade, big_actual: $.data.total_actual_units, big_abs: $.data.total_abs_error_units, big_worst: $.data.worst_item_id }
            - call: "GET /sop/planning-cycles/${cycle_id}/accuracy-summary?family_id=${fam_small}"
              payload: {}
              as: DemandReviewLead
              as_user_id: "lead-1"
              captures: { small_wmape: $.data.wmape_pct, small_flag: $.data.bias_flag, small_grade: $.data.accuracy_grade, small_worst: $.data.worst_item_id }
          assert:
            - "Unfiltered: ${all_count} == 2, ${all_actual} == 5100, ${all_abs} == 230, ${all_mape} == 17.00 == round_half_up((30.00 + 4.00) / 2, 2), ${all_wmape} == 4.51 == round_half_up(230 / 5100 * 100, 2)"
            - "${all_bias} == 4.51 and ${all_flag} == \"NONE\" — 4.51 < BIAS_THRESHOLD_PCT 5.0 even though one line is 30 % over"
            - "${all_grade} == \"A\" because the grade reads wmape_pct 4.51 (<= 10.00); a grade computed from mape_pct 17.00 would report \"B\""
            - "${all_worst} == ${item_small} — per-item WMAPE is 30 / 100 == 30 % versus 200 / 5000 == 4 %, so the item with the SMALLER absolute error (30 < 200) is the worst offender"
            - "family_id=${fam_big}: ${big_count} == 1, ${big_mape} == 4.00, ${big_wmape} == 4.00, ${big_actual} == 5000, ${big_abs} == 200, ${big_grade} == \"A\", ${big_worst} == ${item_big}"
            - "family_id=${fam_small}: ${small_wmape} == 30.00, ${small_flag} == \"OVER_FORECAST\", ${small_grade} == \"C\" and ${small_worst} == ${item_small}"
            - "The filter narrows the record set, it does not merely hide rows: ${big_actual} + 100 == ${all_actual} and ${big_abs} + 30 == ${all_abs}"

      - name: clock_moves_backward_and_reopens_a_frozen_promotion_horizon
        claim_type: Conditional action
        grounds:
          - endpoints[POST /_clock/set_current_utc]
          - validations[priority=140]
          - errors.ERR_PROMOTION_HORIZON_FROZEN
        distinguishing_aspect: |
          The logical clock is authoritative and freely repositionable in BOTH directions: the
          same untouched 2026-09 promotion is approvable at the default 2026-08-01T00:00:00Z,
          refused with 422 ERR_PROMOTION_HORIZON_FROZEN once the clock reads 2026-09-15, and
          approvable again after the clock is moved BACK to 2026-08-01. The clock call itself
          modifies no business row, so the promotion's version is unchanged across both moves.
        test_recipe:
          setup:
            - "One family, one MATURE item and one customer; a single DRAFT promotion for 2026-09..2026-09. The logical clock is left at its default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /sop/product-families"
              payload: { family_code: "FAM-BASE", name: "Base Family", accountable_planner_user_id: "planner-1", units_per_hour: 100, max_monthly_hours: 800 }
              as: SopAdmin
              captures: { fam_id: $.data.id }
            - call: "POST /sop/items"
              payload: { sku: "SKU-BASE", family_id: "${fam_id}", unit_price_cents: 1000, unit_cost_cents: 400, on_hand_units: 0, material_supply_cap_units: 100000, avg_monthly_demand_units: 1000, lifecycle_state: "MATURE" }
              as: SopAdmin
              captures: { item_id: $.data.id }
            - call: "POST /sop/customers"
              payload: { customer_code: "CUST-BASE", name: "Base Grocery", channel: "GROCERY", priority_rank: 3 }
              as: SopAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /sop/promotions"
              payload: { item_id: "${item_id}", customer_id: "${cust_id}", start_month: "2026-09", end_month: "2026-09", lift_pct: 10, cannibalization_pct: 2 }
              as: DemandPlanner
              as_user_id: "planner-1"
              captures: { promo_id: $.data.id, promo_v0: $.data.version }
          trigger:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-15T00:00:00Z" }
              as: SopAdmin
              captures: { now_forward: $.data.current_utc }
            - call: "POST /sop/promotions/${promo_id}/approve"
              payload: {}
              as: DemandReviewLead
              as_user_id: "lead-1"
              captures: { err: $.data.error_id }
            - call: "GET /sop/promotions/${promo_id}"
              payload: {}
              as: DemandReviewLead
              as_user_id: "lead-1"
              captures: { promo_v_mid: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SopAdmin
              captures: { now_back: $.data.current_utc }
            - call: "POST /sop/promotions/${promo_id}/approve"
              payload: {}
              as: DemandReviewLead
              as_user_id: "lead-1"
              captures: { promo_status: $.data.status }
          assert:
            - "${now_forward} == \"2026-09-15T00:00:00Z\" and ${now_back} == \"2026-08-01T00:00:00Z\" — the endpoint echoes the logical now and accepts a move into the past"
            - "The first approve returns 422 with ${err} == \"ERR_PROMOTION_HORIZON_FROZEN\" — start_month 2026-09 is not STRICTLY after the current logical month 2026-09"
            - "It is NOT 422 ERR_ITEM_NOT_PROMOTABLE: the item is MATURE, so priority 130(a) passes and 140(c) is the reported failure"
            - "${promo_v_mid} == ${promo_v0} — neither the clock move nor the rejected approve touched the Promotion row"
            - "The second approve returns 200 with ${promo_status} == \"APPROVED\", proving the refusal was a pure function of the logical clock and not a latched state on the promotion"
            - "GET /sop/promotions?status=APPROVED returns total_count == 1"

      - name: list_supply_plans_filter_by_constraint_type_narrows_result_set
        claim_type: Standard CRUD
        grounds:
          - endpoints[GET /sop/supply-plans]
          - calculations.calc_constrained_supply
          - calculations.calc_cycle_financials
        distinguishing_aspect: |
          constraint_type is a DERIVED discriminator, so the list filter must partition plans by
          what the constraint solver concluded rather than by any stored request field. One cycle
          carries three plans that differ only in their family's capacity and their item's
          material cap, producing NONE, CAPACITY and MATERIAL; each single-valued filter returns
          exactly one row, and constrained_plan_count counts only the two non-NONE plans.
        test_recipe:
          setup:
            - "Three families FAM-A / FAM-B / FAM-C, each units_per_hour 100 and max_monthly_hours 800, each with one MATURE item at service level 95.0, demand_cv 0.20, lead_time_days 30, avg_monthly_demand_units 1000, on_hand 0 and unit_price 1000 cents (safety_stock 330 each)."
            - "ITEM-A and ITEM-B have material cap 100000; ITEM-C has material cap 500. Capacity blocks fully inside 2026-09: FAM-A 14 h (1400 units), FAM-B 9 h (900 units), FAM-C 20 h (2000 units)."
            - "One cycle over 2026-09..2026-09 with commitment 0 and NET_INVENTORY_FIRST, one locked 1000-unit forecast per item, advanced to SUPPLY_REVIEW, then one plan created per item."
