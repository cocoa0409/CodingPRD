      - name: program_planned_load_rounds_each_block_before_summing_to_30_02
        claim_type: Precision
        claim: "program_planned_load rounds each block's contribution half-up to 2dp BEFORE summing, so two blocks whose exact contributions each end in .005 total 30.02 rather than the 30.01 a sum-then-round implementation produces"
        test_recipe:
          setup:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T09:00:00Z" }
              as: PerformanceDirector
            - call: "POST /athletes"
              payload: { full_name: "Precision Load Athlete", date_of_birth: "2009-02-02", sport: "BASKETBALL", position: "GUARD" }
              as: FrontDesk
              captures: { athlete_id: $.data.id }
            - call: "POST /training-programs"
              payload: { athlete_id: "${athlete_id}", sport: "BASKETBALL", position: "GUARD", competition_start_date: "2026-11-01", competition_end_date: "2027-02-01" }
              as: PerformanceDirector
              captures: { program_id: $.data.id }
          action:
            - call: "POST /training-programs/${program_id}/blocks"
              payload: { expected_training_program_version: 1, phase: "GENERAL_PREP", start_week: 1, end_week: 1, target_intensity_pct: 50, weekly_volume_units: 20.01 }
              as: PerformanceDirector
              captures: { block_one: $.data.id }
            - call: "POST /training-programs/${program_id}/blocks"
              payload: { expected_training_program_version: 2, phase: "SPECIFIC_PREP", start_week: 2, end_week: 2, target_intensity_pct: 50, weekly_volume_units: 40.01, predecessor_block_id: "${block_one}" }
              as: PerformanceDirector
              captures: { planned_load: $.data.id }
          assertions:
            - "both calls return 201"
            - "block one exact contribution is 1 week * 20.01 * 0.50 = 10.005, rounded half-up to 10.01"
            - "block two exact contribution is 1 week * 40.01 * 0.50 = 20.005, rounded half-up to 20.01"
            - "GET /training-programs/${program_id} shows planned_load_units == 30.02, NOT 30.01 (which is what round(10.005 + 20.005) = round(30.01) would give under sum-then-round)"
            - "block_count == 2 and total_weeks == 2 (max(end_week) 2 - min(start_week) 1 + 1)"
            - "each block carries sequence_index 0 then 1 and status PLANNED"

