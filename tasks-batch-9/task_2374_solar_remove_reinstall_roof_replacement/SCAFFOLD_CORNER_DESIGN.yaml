          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "A HOST_OWNED project has a MEDIUM MOISTURE_INTRUSION finding over 80 sqft affecting 4 attachments, scoped by Ridgeline Roofing at 80 * 950 + 4 * 4200 = 92800, times the MEDIUM multiplier 1.15 = 106720 cents, well inside the 2,000,000-cent budget."
