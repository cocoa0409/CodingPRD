      - name: sla_deadline_five_step_self_counting_queue_load
        grounds:
          - calculations.interpretation_sla_and_turnaround
          - calculations.interpreter_assignment_selection
          - entities.InterpretationReport.fields.queue_load_pct
          - entities.InterpretationReport.fields.load_tier
          - entities.InterpretationReport.fields.due_at
          - endpoints[POST /pft-lab/test-sessions/{session_id}/interpretation-reports]
        distinguishing_aspect: |
          due_at is the product of five ordered steps (insert the report -> count open reports INCLUDING
          the row just inserted -> divide by the ON_DUTY roster capacity -> tier the load -> multiply the
          context base), and the self-counting step is what discriminates: report 1 with a one-seat roster
          lands at queue_load_pct 100.00 / SURGE / sla_minutes 2880 rather than 0.00 / NORMAL / 1440, while
          report 2 on a two-seat roster lands exactly on the 50.00 tier boundary and keeps the 1.00
