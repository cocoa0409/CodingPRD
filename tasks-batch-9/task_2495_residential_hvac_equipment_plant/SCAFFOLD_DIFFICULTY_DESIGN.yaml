          A warranty claim - an entity with no relationship to distributor demand - propagates four
          hops across aggregate boundaries: platform posture, then a new corrective action that
          derates the compressor lot to zero, then revocation of that lot's RESERVED line together
          with its control-board kit sibling, then regression of the distributor order's allocation
