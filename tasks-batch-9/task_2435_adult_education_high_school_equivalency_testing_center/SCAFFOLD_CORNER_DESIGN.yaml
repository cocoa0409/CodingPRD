      - name: proctor_revocation_cascade_five_links_from_registration_to_the_funding_pool
        claim_type: cascading_side_effects
        grounds:
          - complexity_profile[complexity_layers=cascading_side_effects]
          - state_machines[Proctor CERTIFIED -> REVOKED]
          - state_machines[ExamRegistration SCORED -> RESULT_INVALIDATED]
          - state_machines[CredentialIssuance ISSUED -> VOIDED]
          - state_machines[TranscriptOrder QUEUED -> HELD]
          - state_machines[OutcomeRecord CERTIFIED -> RESCINDED]
          - validations[priority=42]
          - errors[ERR_CREDENTIAL_NOT_ISSUED]
        distinguishing_aspect: |
          This is the longest chain the scaffold declares and it is driven by a single write: revoking one
          proctor invalidates four scored registrations (link 2b), which voids the credential they
          qualified (link 3), which both holds the queued transcript order and rescinds the credential's
          outcome record (link 4), which returns the committed allocation to the funding pool (link 5).
          Every link is a different entity with a different reason field, so a partial implementation that
          stops at the registrations, or that voids the credential without unwinding the money, is
          detectable. The fixture deliberately leaves the four sessions COMPLETED so links 1 and 2a are
          no-ops - the cascade must be reached through identity_verified_by_proctor_id rather than through
          the session revert. The final probe proves the void is not merely cosmetic: a new transcript
          order against the voided credential is refused at priority 42.
        test_recipe:
          setup:
            - "Clock at 2026-08-01T00:00:00Z. A FULL_AUTHORIZED center, one room, one CERTIFIED proctor (expiry 2027-01-01, default 8.00-hour cap)."
