  # ---------------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_beats_fiscal_on_bind
        grounds:
          - validations[priority=7]
          - validations[priority=12]
          - state_machines.Policy.QUOTED_to_BOUND
        distinguishing_aspect: |
          Category pair (state, business_fiscal): binding a policy on a RUN_OFF program
          whose tranche also cannot cover the premium violates both ERR_PROGRAM_NOT_ACTIVE
          (priority 7) and ERR_TRANCHE_EXHAUSTED (priority 12) — the state error wins.
        test_recipe:
          setup:
            - "ACTIVE program; tranche only 100000 (policy gross 155000 would exceed it); policy QUOTED; then program enters RUN_OFF"
          setup_api_calls:
            - { call: "POST /mga/carriers", payload: { name: "Carrier PP1", naic_code: "NAIC-PP1", contact_email: "uw@pp1.com" }, as: PlatformAdmin, captures: { ca: $.data.id } }
            - { call: "POST /mga/programs", payload: { carrier_id: "${ca}", name: "PP1 Program", line_of_business: "GENERAL_LIABILITY", states_covered: ["CA"], inception_date: "2026-08-01T00:00:00Z", aggregate_limit_cents: 500000, commission_rate_pct: 0.15, corrective_threshold_pct: 70, termination_threshold_pct: 85, min_trust_balance_cents: 10000, min_earned_premium_for_ratio_cents: 50000 }, as: MGAUnderwriter, captures: { prog: $.data.id, prog_v: $.data.version } }
            - { call: "POST /mga/programs/${prog}/guidelines", payload: { state_code: "CA", class_code: "ARTISAN", max_policy_premium_cents: 250000, max_policy_limit_cents: 1000000, min_policy_premium_cents: 5000, expected_program_version: "${prog_v}" }, as: MGAUnderwriter }
            - { call: "GET /mga/programs/${prog}", payload: {}, as: MGAUnderwriter, captures: { prog_v2: $.data.version } }
            - { call: "POST /mga/programs/${prog}/capacity-allocations", payload: { period_label: "2026-Q3", allocated_cents: 100000, expected_program_version: "${prog_v2}" }, as: CarrierUnderwriter, as_user_id: "${ca}" }
            - { call: "POST /mga/programs/${prog}/rate-filings", payload: { state_code: "CA", filing_type: "RATE", base_rates: { ARTISAN: 1500 }, policy_fee_cents: 5000, effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-08-01T00:00:00Z" }, as: MGAUnderwriter, captures: { fil: $.data.id } }
            - { call: "POST /mga/rate-filings/${fil}/submit", payload: {}, as: MGAUnderwriter }
            - { call: "POST /mga/rate-filings/${fil}/approve", payload: {}, as: CarrierUnderwriter, as_user_id: "${ca}" }
            - { call: "POST /mga/rate-filings/${fil}/mark-effective", payload: {}, as: CarrierUnderwriter, as_user_id: "${ca}" }
            - { call: "POST /mga/programs/${prog}/activate", payload: {}, as: CarrierUnderwriter, as_user_id: "${ca}" }
            - { call: "POST /mga/programs/${prog}/policies", payload: { insured_name: "Prio Co", state_code: "CA", class_code: "ARTISAN", exposure_units: 100, coverage_limit_cents: 500000, experience_mod: 1.0, effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-08-01T00:00:00Z" }, as: MGAUnderwriter, captures: { pol: $.data.id } }
            - { call: "POST /mga/programs/${prog}/enter-runoff", payload: {}, as: CarrierUnderwriter, as_user_id: "${ca}" }
          trigger:
            - { call: "POST /mga/policies/${pol}/bind", payload: {}, as: MGAUnderwriter, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_PROGRAM_NOT_ACTIVE (state, priority 7) — NOT ERR_TRANCHE_EXHAUSTED (fiscal, priority 12), though both hold (tranche 100000 < gross 155000)"
            - "Policy.${pol}.status remains QUOTED"

      - name: temporal_beats_constraint_on_quote
        grounds:
          - validations[priority=9]
          - validations[priority=10]
        distinguishing_aspect: |
          Category pair (business_temporal, business_constraint) — different pair from
          (state, business_fiscal): quoting a policy whose window lies outside the
          EFFECTIVE filing window (temporal) AND whose class has no guideline
          (constraint) returns ERR_POLICY_WINDOW_OUTSIDE_FILING (priority 9), not
          ERR_CLASS_NOT_ELIGIBLE (priority 10).
        test_recipe:
          setup:
            - "ACTIVE program; EFFECTIVE filing covers [2026-08-01, 2027-08-01); guideline exists only for CA/ARTISAN"
          setup_api_calls:
            - { call: "POST /mga/carriers", payload: { name: "Carrier PP2", naic_code: "NAIC-PP2", contact_email: "uw@pp2.com" }, as: PlatformAdmin, captures: { ca: $.data.id } }
            - { call: "POST /mga/programs", payload: { carrier_id: "${ca}", name: "PP2 Program", line_of_business: "GENERAL_LIABILITY", states_covered: ["CA"], inception_date: "2026-08-01T00:00:00Z", aggregate_limit_cents: 500000, commission_rate_pct: 0.15, corrective_threshold_pct: 70, termination_threshold_pct: 85, min_trust_balance_cents: 10000, min_earned_premium_for_ratio_cents: 50000 }, as: MGAUnderwriter, captures: { prog: $.data.id, prog_v: $.data.version } }
            - { call: "POST /mga/programs/${prog}/guidelines", payload: { state_code: "CA", class_code: "ARTISAN", max_policy_premium_cents: 250000, max_policy_limit_cents: 1000000, min_policy_premium_cents: 5000, expected_program_version: "${prog_v}" }, as: MGAUnderwriter }
            - { call: "GET /mga/programs/${prog}", payload: {}, as: MGAUnderwriter, captures: { prog_v2: $.data.version } }
            - { call: "POST /mga/programs/${prog}/capacity-allocations", payload: { period_label: "2026-Q3", allocated_cents: 300000, expected_program_version: "${prog_v2}" }, as: CarrierUnderwriter, as_user_id: "${ca}" }
            - { call: "POST /mga/programs/${prog}/rate-filings", payload: { state_code: "CA", filing_type: "RATE", base_rates: { ARTISAN: 1500 }, policy_fee_cents: 5000, effective_from: "2026-08-01T00:00:00Z", effective_to: "2027-08-01T00:00:00Z" }, as: MGAUnderwriter, captures: { fil: $.data.id } }
            - { call: "POST /mga/rate-filings/${fil}/submit", payload: {}, as: MGAUnderwriter }
            - { call: "POST /mga/rate-filings/${fil}/approve", payload: {}, as: CarrierUnderwriter, as_user_id: "${ca}" }
            - { call: "POST /mga/rate-filings/${fil}/mark-effective", payload: {}, as: CarrierUnderwriter, as_user_id: "${ca}" }
            - { call: "POST /mga/programs/${prog}/activate", payload: {}, as: CarrierUnderwriter, as_user_id: "${ca}" }
          trigger:
            - { call: "POST /mga/programs/${prog}/policies", payload: { insured_name: "Dual Fail", state_code: "CA", class_code: "TRUCKING", exposure_units: 100, coverage_limit_cents: 500000, experience_mod: 1.0, effective_from: "2027-08-05T00:00:00Z", effective_to: "2028-08-01T00:00:00Z" }, as: MGAUnderwriter, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_POLICY_WINDOW_OUTSIDE_FILING (temporal beats constraint): effective_from 2027-08-05 is outside filing window ending 2027-08-01, AND class TRUCKING has no guideline — the temporal error is returned"
            - "no Policy row created (GET /mga/programs/${prog}/policies total_count == 0)"

      - name: safety_beats_fiscal_on_remittance
        grounds:
          - validations[priority=8]
          - validations[priority=12]
          - calculations.trust_remittance
        distinguishing_aspect: |
          Category pair (business_safety, business_fiscal): a remittance whose declared
          amount both mismatches the computed remittance (fiscal) AND would drive the
          trust below its fiduciary floor (safety) returns ERR_TRUST_FLOOR_BREACH
          (priority 8), not ERR_REMITTANCE_MISMATCH (priority 12).
        test_recipe:
          setup:
            - "ACTIVE program (commission 0.15, min_trust_balance 10000); policy bound; COLLECTION 365000 -> trust 365000; computed remittance would be 279225"
          setup_api_calls:
