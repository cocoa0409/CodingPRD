        distinguishing_aspect: "Each action endpoint maps an unresolvable path id to its own error id at priority 3, so the catalog's three path-based not-found errors are distinguishable rather than collapsing into one generic 404."
        test_recipe:
          setup: ["empty DB; clock at default"]
          setup_api_calls:
            - call: "POST /api/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
