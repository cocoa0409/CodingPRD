      - name: open_enforcement_freeze_beats_the_no_gain_refinancing_check
        pair: "business_safety (priority 48, ERR_CONCESSION_UNDER_ENFORCEMENT) vs business_fiscal (priority 76, ERR_NO_REFINANCING_GAIN)"
        grounds:
          - validations.priority_48
          - validations.priority_76
