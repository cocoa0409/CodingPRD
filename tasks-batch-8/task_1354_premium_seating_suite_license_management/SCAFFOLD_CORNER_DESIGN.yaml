          setup:
            - "Venue, GOLD suite (unlicensed), S1 PUBLISHED, E2 RIVALRY 2026-10-05, renter account ACTIVE"
            - "Rental CONFIRMED on E2 (quoted 650000 GOLD: 650000*1.0, guests 20 no overage); catering order under the rental CONFIRMED (subtotal 1000); credential ISSUED under the rental"
