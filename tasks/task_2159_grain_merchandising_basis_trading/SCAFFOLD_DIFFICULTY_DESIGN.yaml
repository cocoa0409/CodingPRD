          setup:
            - "Desk, elevator, ACTIVE CORN discount schedule with moisture standard 15.0 and shrink factor 1.18."
            - "SHORT 2026-12 hedge with 20 lots at 448, ACTIVE basis -32 bid, and one 50,000-bushel SHRINK_FIRST CASH contract."
          setup_api_calls:
            - call: "POST /grain/trading-desks"
              payload: { desk_code: "GD14", name: "Moisture Desk", credit_line_usd: 5000000.00 }
              as: DeskAdmin
              as_user_id: "u-admin-1"
              captures: { desk_id: $.data.id }
            - call: "POST /grain/elevator-locations"
              payload: { desk_id: "${desk_id}", location_code: "ELV1", name: "Morris Elevator", intake_capacity_bushels: 5000000, rail_served: true }
              as: DeskAdmin
              as_user_id: "u-admin-1"
              captures: { loc1_id: $.data.id }
            - call: "POST /grain/discount-schedules"
              payload: { commodity_code: "CORN", effective_from: "2026-07-01T00:00:00Z", moisture_standard_pct: 15.0, shrink_factor_pct_per_point: 1.18, tiers: [ { factor: "MOISTURE", direction: "ABOVE", threshold_value: 15.0, unit_step: 0.5, rate_cents_per_bushel_per_step: 2.5 }, { factor: "TEST_WEIGHT", direction: "BELOW", threshold_value: 54.0, unit_step: 1.0, rate_cents_per_bushel_per_step: 3.5 }, { factor: "FOREIGN_MATERIAL", direction: "ABOVE", threshold_value: 3.0, unit_step: 0.5, rate_cents_per_bushel_per_step: 1.5 }, { factor: "DAMAGE", direction: "ABOVE", threshold_value: 5.0, unit_step: 1.0, rate_cents_per_bushel_per_step: 4.0 } ] }
              as: DeskAdmin
              as_user_id: "u-admin-1"
              captures: { sch1_id: $.data.id }
            - call: "POST /grain/discount-schedules/${sch1_id}/activate"
              payload: {}
              as: DeskAdmin
              as_user_id: "u-admin-1"
            - call: "POST /grain/hedge-positions"
              payload: { desk_id: "${desk_id}", commodity_code: "CORN", futures_month: "2026-12", side: "SHORT", lots_open: 20, avg_entry_price_cents: 448 }
              as: FuturesTrader
              as_user_id: "u-trader-1"
              captures: { hp1_id: $.data.id }
            - call: "POST /grain/bids"
              payload: { location_id: "${loc1_id}", commodity_code: "CORN", futures_month: "2026-12", delivery_period_start: "2026-10-01", delivery_period_end: "2026-12-31", basis_cents: -32, max_bushels: 1000000, expires_at: "2027-01-15T00:00:00Z" }
              as: Merchandiser
              as_user_id: "u-merch-1"
              captures: { bid1_id: $.data.id }
            - call: "POST /grain/bids/${bid1_id}/activate"
              payload: {}
              as: Merchandiser
              as_user_id: "u-merch-1"
            - call: "POST /grain/purchase-contracts"
              payload: { bid_id: "${bid1_id}", hedge_position_id: "${hp1_id}", contract_type: "CASH", bushels: 50000, seller_name: "Bell Farms", delivery_start: "2026-11-01", delivery_end: "2026-11-30", futures_price_cents: 448, settlement_basis: "SHRINK_FIRST" }
              as: Merchandiser
              as_user_id: "u-merch-1"
              captures: { c1_id: $.data.id }
          trigger:
            - call: "POST /grain/delivery-tickets"
              payload: { contract_id: "${c1_id}", location_id: "${loc1_id}", gross_bushels: 10000, moisture_pct: 15.0, test_weight_lbs: 56.0, foreign_material_pct: 2.0, damage_pct: 0.0 }
              as: GrainInspector
              as_user_id: "u-insp-1"
              captures: { tkt_at_id: $.data.id }
            - call: "POST /grain/delivery-tickets"
              payload: { contract_id: "${c1_id}", location_id: "${loc1_id}", gross_bushels: 10000, moisture_pct: 15.1, test_weight_lbs: 56.0, foreign_material_pct: 2.0, damage_pct: 0.0 }
              as: GrainInspector
              as_user_id: "u-insp-1"
              captures: { tkt_over_id: $.data.id }
          assert:
            - "DeliveryTicket.${tkt_at_id}.shrink_pct == 0"
            - "DeliveryTicket.${tkt_at_id}.net_bushels == 10000.00"
            - "DeliveryTicket.${tkt_at_id}.discount_total_usd == 0.00"
            - "DeliveryTicket.${tkt_over_id}.shrink_pct == 0.118"
            - "DeliveryTicket.${tkt_over_id}.net_bushels == 9988.20"
            - "DeliveryTicket.${tkt_over_id}.discount_total_usd == 0.00"

      - name: risk_limit_accepts_exactly_at_ceiling_rejects_one_bushel_over
        grounds:
          - validations[priority=24]
          - entities.RiskLimit.fields.max_unpriced_bushels
          - entities.TradingDesk.fields.unpriced_bushels
          - errors[ERR_RISK_LIMIT_BREACH]
        distinguishing_aspect: |
          Boundary metric 2 — a strictly-greater-than ceiling on cumulative unpriced bushels,
          a different metric on a different endpoint (POST /grain/purchase-contracts) from the
          moisture threshold. A DEFERRED contract taking the desk to exactly 100000 unpriced
          bushels is accepted; the next DEFERRED contract for a single bushel takes it to
          100001 and is rejected with ERR_RISK_LIMIT_BREACH.
        test_recipe:
          setup:
            - "One desk with an ACTIVE CORN RiskLimit of max_unpriced_bushels 100000 and max_net_short_lots 100."
            - "One elevator with 5,000,000 bushels of intake capacity, a SHORT 2026-12 hedge with 20 lots at 448, and an ACTIVE basis -32 bid with max_bushels 1,000,000."
          setup_api_calls:
            - call: "POST /grain/trading-desks"
              payload: { desk_code: "GD15", name: "Limit Boundary Desk", credit_line_usd: 5000000.00 }
              as: DeskAdmin
              as_user_id: "u-admin-1"
              captures: { desk_id: $.data.id, dv0: $.data.version }
            - call: "POST /grain/risk-limits"
              payload: { desk_id: "${desk_id}", commodity_code: "CORN", max_unpriced_bushels: 100000, max_net_short_lots: 100, expected_desk_version: "${dv0}" }
              as: RiskOfficer
              as_user_id: "u-risk-1"
              captures: { rl1_id: $.data.id }
            - call: "POST /grain/elevator-locations"
              payload: { desk_id: "${desk_id}", location_code: "ELV1", name: "Morris Elevator", intake_capacity_bushels: 5000000, rail_served: true }
              as: DeskAdmin
              as_user_id: "u-admin-1"
              captures: { loc1_id: $.data.id }
            - call: "POST /grain/hedge-positions"
              payload: { desk_id: "${desk_id}", commodity_code: "CORN", futures_month: "2026-12", side: "SHORT", lots_open: 20, avg_entry_price_cents: 448 }
              as: FuturesTrader
              as_user_id: "u-trader-1"
              captures: { hp1_id: $.data.id }
            - call: "POST /grain/bids"
              payload: { location_id: "${loc1_id}", commodity_code: "CORN", futures_month: "2026-12", delivery_period_start: "2026-10-01", delivery_period_end: "2026-12-31", basis_cents: -32, max_bushels: 1000000, expires_at: "2027-01-15T00:00:00Z" }
              as: Merchandiser
              as_user_id: "u-merch-1"
              captures: { bid1_id: $.data.id }
            - call: "POST /grain/bids/${bid1_id}/activate"
              payload: {}
              as: Merchandiser
              as_user_id: "u-merch-1"
          trigger:
            - call: "POST /grain/purchase-contracts"
              payload: { bid_id: "${bid1_id}", hedge_position_id: "${hp1_id}", contract_type: "DEFERRED", bushels: 100000, seller_name: "Bell Farms", delivery_start: "2026-11-01", delivery_end: "2026-11-30" }
              as: Merchandiser
              as_user_id: "u-merch-1"
              captures: { c_at_id: $.data.id }
            - call: "POST /grain/purchase-contracts"
              payload: { bid_id: "${bid1_id}", hedge_position_id: "${hp1_id}", contract_type: "DEFERRED", bushels: 1, seller_name: "Halberd Farms", delivery_start: "2026-11-01", delivery_end: "2026-11-30" }
              as: Merchandiser
              as_user_id: "u-merch-1"
              captures: { err: $.data.error_id }
          assert:
            - "the first create returns HTTP 201 and PurchaseContract.${c_at_id}.unpriced_bushels == 100000.00"
            - "TradingDesk.${desk_id}.unpriced_bushels == 100000.00"
            - "PurchaseContract.${c_at_id}.pricing_status == UNPRICED"
            - "PurchaseContract.${c_at_id}.hedge_lots_assigned == 20"
            - "the second create returns HTTP 422 with ${err} == ERR_RISK_LIMIT_BREACH"
            - "TradingDesk.${desk_id}.unpriced_bushels == 100000.00 after the rejected create"

      - name: position_report_empty_contract_scope_yields_zero_coverage_ratio
        grounds:
          - calculations.desk_position_report
          - entities.RiskLimit.fields.max_net_short_lots
          - endpoints["GET /grain/trading-desks/{deskId}/position-report"]
        distinguishing_aspect: |
          Boundary metric 3 — an EMPTY collection rather than a numeric threshold, reached
          through a third endpoint (GET /grain/trading-desks/{deskId}/position-report). With
          zero ACTIVE contracts, required_hedge_lots is 0 and hedge_coverage_ratio must be
          exactly 0 rather than a division-by-zero error, while net_futures_lots is still -3
          and the short-lot limb of the risk limit reports BREACH.
        test_recipe:
          setup:
            - "One desk with an ACTIVE CORN RiskLimit of max_unpriced_bushels 500000 and max_net_short_lots 2."
            - "One SHORT CORN 2026-12 hedge position with 3 lots at 448 and no purchase contracts at all."
          setup_api_calls:
            - call: "POST /grain/trading-desks"
              payload: { desk_code: "GD16", name: "Empty Scope Desk", credit_line_usd: 5000000.00 }
              as: DeskAdmin
              as_user_id: "u-admin-1"
              captures: { desk_id: $.data.id, dv0: $.data.version }
            - call: "POST /grain/risk-limits"
              payload: { desk_id: "${desk_id}", commodity_code: "CORN", max_unpriced_bushels: 500000, max_net_short_lots: 2, expected_desk_version: "${dv0}" }
