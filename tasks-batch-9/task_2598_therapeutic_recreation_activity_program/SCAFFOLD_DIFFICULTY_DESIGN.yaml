          - entities.Resident.fields.engagement_index
          - entities.Resident.fields.absence_count
          - state_machines.ParticipationRecord.PLANNED_to_ABSENT
        distinguishing_aspect: |
          A different metric on a different endpoint: the degenerate lower edge of the engagement
          window rather than a staffing comparator. Documenting the resident's only record as
          ABSENT leaves the ENGAGEMENT_POINTS window empty, and the pinned contract is that an
          empty window scores exactly 0.0 rather than raising a divide-by-zero or leaving the
          field null. It must also NOT touch refusal_streak, because ABSENT is not a refusal.
        test_recipe:
          setup:
            - "one ADMITTED resident with a governing assessment and no prior participation history at all"
            - "one session with the resident enrolled, started at 2026-08-03T09:00:00Z with the clock moved to that instant"
