  # ---------------------------------------------------------------------------
  - section: calculations
    instances:
      - name: head_pressure_min_clamp_applied
        claim_type: correct_result
        grounds: [calculations.floating_head_pressure_target]
        distinguishing_aspect: "Cold wet bulb drives raw saturation pressure below min_head_psig: raw 83.7 psig is clamped up to the 150.0 floor — the nested min/max branch is exercised."
        test_recipe:
          setup: ["Facility + system (approach 15.0, min 150.0, max 185.0, float enabled) + operator"]
          setup_api_calls:
            - call: "POST /psm/facilities"
              payload: { name: "ColdCo Plant" }
              as: FacilityAdmin
              captures: { fac: $.data.id }
            - call: "POST /psm/employees"
              payload: { facility_id: "${fac}", full_name: "Olivia Operator" }
              as: FacilityAdmin
              captures: { emp: $.data.id }
            - call: "POST /psm/refrigeration-systems"
              payload: { facility_id: "${fac}", name: "ER1", design_charge_lbs: 3000, condenser_approach_f: 15.0, min_head_psig: 150.0, max_head_psig: 185.0, float_head_enabled: true }
              as: FacilityAdmin
              captures: { sys: $.data.id }
          trigger:
            - call: "POST /psm/refrigeration-systems/${sys}/head-pressure-target"
              payload: { wet_bulb_f: 40.0, condenser_load_pct: 10 }
              as: Operator
              as_user_id: "${emp}"
              captures: { raw: $.data.raw_psig, tgt: $.data.target_psig, variant: $.data.variant }
          assert:
            - "raw_psig == 83.7 (T = 40 + 15 = 55F -> interp(50:74.5, 60:92.9) = 74.5 + 0.5*18.4)"
            - "target_psig == 150.0 (min_head_psig clamp binds: max(83.7, 150.0) then min(..., 185.0))"
            - "variant == 'floating'"

      - name: head_pressure_fixed_design_variant_when_float_disabled
        claim_type: variant_selection
        grounds: [calculations.floating_head_pressure_target, entities.RefrigerationSystem.fields.float_head_enabled]
        distinguishing_aspect: "float_head_enabled == false selects the fixed_design variant: target is always max_head_psig regardless of weather inputs."
        test_recipe:
          setup: ["Facility + system with float_head_enabled false + operator"]
          setup_api_calls:
            - call: "POST /psm/facilities"
              payload: { name: "ColdCo Plant" }
              as: FacilityAdmin
              captures: { fac: $.data.id }
            - call: "POST /psm/employees"
              payload: { facility_id: "${fac}", full_name: "Olivia Operator" }
              as: FacilityAdmin
              captures: { emp: $.data.id }
            - call: "POST /psm/refrigeration-systems"
              payload: { facility_id: "${fac}", name: "ER1", design_charge_lbs: 3000, condenser_approach_f: 15.0, min_head_psig: 150.0, max_head_psig: 185.0, float_head_enabled: false }
              as: FacilityAdmin
              captures: { sys: $.data.id }
          trigger:
            - call: "POST /psm/refrigeration-systems/${sys}/head-pressure-target"
              payload: { wet_bulb_f: 70.0, condenser_load_pct: 80 }
              as: Operator
              as_user_id: "${emp}"
              captures: { tgt: $.data.target_psig, variant: $.data.variant }
          assert:
            - "target_psig == 185.0 (max_head_psig) even though floating math would give 159.5"
            - "variant == 'fixed_design'"

      - name: posture_score_exactly_ten_noncompliant
        claim_type: boundary
        grounds: [calculations.compliance_posture_score, entities.Facility.fields.compliance_posture]
        distinguishing_aspect: "Two overdue inspections give posture_score exactly 10; the >= boundary maps 10 to NONCOMPLIANT (a '>' implementation would stay DEGRADED)."
        test_recipe:
          setup: ["Facility + system; equipment V-101 and V-102 each with an inspection due 2026-08-05; clock 2026-08-10; checkpoint run"]
          setup_api_calls:
            - call: "POST /psm/facilities"
              payload: { name: "ColdCo Plant" }
              as: FacilityAdmin
              captures: { fac: $.data.id }
            - call: "POST /psm/refrigeration-systems"
              payload: { facility_id: "${fac}", name: "ER1", design_charge_lbs: 3000 }
              as: FacilityAdmin
              captures: { sys: $.data.id }
            - call: "POST /psm/equipment"
              payload: { system_id: "${sys}", tag_number: "V-101", equipment_type: "VESSEL", inspection_interval_days: 180, inspection_method: "FIXED" }
              as: MaintenanceLead
              captures: { eq1: $.data.id }
            - call: "POST /psm/equipment"
              payload: { system_id: "${sys}", tag_number: "V-102", equipment_type: "VESSEL", inspection_interval_days: 180, inspection_method: "FIXED" }
              as: MaintenanceLead
              captures: { eq2: $.data.id }
            - call: "POST /psm/inspections"
              payload: { equipment_id: "${eq1}", due_at: "2026-08-05T00:00:00Z" }
              as: MaintenanceLead
            - call: "POST /psm/inspections"
              payload: { equipment_id: "${eq2}", due_at: "2026-08-05T00:00:00Z" }
              as: MaintenanceLead
            - call: "POST /psm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-10T00:00:00Z" }
              as: FacilityAdmin
            - call: "POST /psm/checkpoints/run"
              as: ComplianceOfficer
          trigger:
            - call: "GET /psm/facilities/${fac}"
              as: ComplianceOfficer
              captures: { oic: $.data.overdue_inspection_count, score: $.data.posture_score, cpost: $.data.compliance_posture }
          assert:
            - "overdue_inspection_count == 2, posture_score == 10 (5*2)"
            - "compliance_posture == 'NONCOMPLIANT' at score exactly 10 (>= boundary)"

      - name: posture_score_nine_stays_degraded
        claim_type: boundary
        grounds: [calculations.compliance_posture_score]
        distinguishing_aspect: "Three open incidents give posture_score 9 — one below the NONCOMPLIANT floor — and posture stays DEGRADED."
        test_recipe:
          setup: ["Facility with reporter employee; three RECORDABLE incidents reported"]
          setup_api_calls:
            - call: "POST /psm/facilities"
              payload: { name: "ColdCo Plant" }
              as: FacilityAdmin
              captures: { fac: $.data.id }
            - call: "POST /psm/employees"
              payload: { facility_id: "${fac}", full_name: "Rita Reporter" }
              as: FacilityAdmin
              captures: { emp_r: $.data.id }
            - call: "POST /psm/incidents"
              payload: { facility_id: "${fac}", severity: "RECORDABLE", description: "incident one", reported_by_employee_id: "${emp_r}" }
              as: Operator
              as_user_id: "${emp_r}"
            - call: "POST /psm/incidents"
              payload: { facility_id: "${fac}", severity: "RECORDABLE", description: "incident two", reported_by_employee_id: "${emp_r}" }
              as: Operator
              as_user_id: "${emp_r}"
            - call: "POST /psm/incidents"
              payload: { facility_id: "${fac}", severity: "RECORDABLE", description: "incident three", reported_by_employee_id: "${emp_r}" }
              as: Operator
              as_user_id: "${emp_r}"
          trigger:
            - call: "GET /psm/facilities/${fac}"
              as: ComplianceOfficer
              captures: { oic: $.data.open_incident_count, score: $.data.posture_score, cpost: $.data.compliance_posture }
          assert:
            - "open_incident_count == 3, posture_score == 9 (3*3)"
            - "compliance_posture == 'DEGRADED' (1..9 band; 9 is NOT noncompliant)"

      - name: training_currency_boundaries
        claim_type: boundary
        grounds: [entities.TrainingRecord.fields.expires_at, entities.TrainingRecord.fields.currency]
        distinguishing_aspect: "Two exact boundaries: expires - now == 90 days maps to EXPIRING_SOON (<=); now == expires_at maps to EXPIRED (>=) — completed 1095 days ago is already expired."
        test_recipe:
          setup: ["Facility + two ACTIVE employees; clock 2026-08-01T00:00:00Z; record A completed 2023-10-31 (expires 2026-10-30, exactly 90 days out); record B completed 2023-08-02 (expires 2026-08-01, exactly now)"]
          setup_api_calls:
            - call: "POST /psm/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: FacilityAdmin
            - call: "POST /psm/facilities"
              payload: { name: "ColdCo Plant" }
              as: FacilityAdmin
              captures: { fac: $.data.id }
            - call: "POST /psm/employees"
              payload: { facility_id: "${fac}", full_name: "Amy A" }
