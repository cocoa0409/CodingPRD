            - "After the refused call, GET /vpc/release-orders?vehicle_id=${veh_id} returns total_count == 0 and TruckCarrier.${carrier_id}.committed_slots == 0"
            - "${ro_state} == ALLOCATED and ${ro_carrier} == ${carrier_id} on the retry with the fresh version"
            - "Dealer.${dealer_id}.open_allocation_count == 1 only after the accepted call"

      - name: corner_occ_stale_survey_version_blocks_claim_filing
        claim_type: optimistic_concurrency
        grounds:
