          assert:
            - "at 119 guests StoreDay.${day_id}.traffic_state == STEADY and StoreDay.${day_id}.conversion_gate == OPEN"
            - "at 120 guests StoreDay.${day_id}.traffic_state == RUSH and StoreDay.${day_id}.conversion_gate == GATED_RESTRICTED, so the threshold is inclusive"
            - "at 121 guests StoreDay.${day_id}.traffic_state == RUSH and StoreDay.${day_id}.conversion_gate == GATED_RESTRICTED"
            - "the 40-guest edge is also inclusive: a 39-guest post leaves traffic_state QUIET and a 40-guest post moves it to STEADY, so a strict greater-than test fails at both edges"

