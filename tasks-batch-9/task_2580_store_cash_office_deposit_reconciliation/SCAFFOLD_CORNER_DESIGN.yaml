          trigger:
            - call: "POST /cash-ops/sales-journals/${journal_id}/post-tenders"
              payload: { journal_cash_sales_cents: 999999, journal_card_sales_cents: 50000 }
              as: CashOfficeClerk
              as_user_id: "U-CLERK-1"
              captures: { err: $.data.error_id }
          assert:
            - "HTTP status is 409 and data.error_id == \"ERR_TENDERS_ALREADY_POSTED\""
            - "SalesJournal.${journal_id}.journal_cash_sales_cents == 100000 and journal_card_sales_cents == 50000"
            - "SalesJournal.${journal_id}.status == \"TENDERS_POSTED\" — the structural clause is unmet (no sessions, no settlement, no deposit), so no compound edge fires"

      - name: second_settlement_for_the_same_network_rejected
        claim_type: violation_error
        grounds:
          - validations[priority=58]
          - errors[ERR_SETTLEMENT_ALREADY_POSTED]
          - calculations.card_settlement_reconciliation.input_set
        distinguishing_aspect: >
          One settlement row per (sales_journal_id, card_network): a second VISA_MC advice for the same
          journal returns 409 ERR_SETTLEMENT_ALREADY_POSTED, while an AMEX advice for the same journal is
          accepted, leaving settlement_count 2.
        test_recipe:
          setup:
            - "Store S-1944 with journal 2026-08-03 carrying one MATCHED VISA_MC settlement (gross 50000, 20 txns, monthly 1000000, funded 48510)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T08:00:00Z" }
              as: TreasuryAnalyst
            - call: "POST /cash-ops/stores"
              payload: { store_code: "S-1944", name: "Store 1944", region_code: "WEST" }
              as: TreasuryAnalyst
              as_user_id: "U-TREAS-1"
              captures: { store_id: $.data.id }
            - call: "POST /cash-ops/sales-journals"
              payload: { store_id: "${store_id}", business_date: "2026-08-03" }
              as: CashOfficeClerk
              as_user_id: "U-CLERK-1"
              captures: { journal_id: $.data.id }
            - call: "POST /cash-ops/card-settlements"
              payload: { sales_journal_id: "${journal_id}", card_network: "VISA_MC", gross_card_sales_cents: 50000, txn_count: 20, monthly_volume_cents: 1000000, funded_amount_cents: 48510 }
              as: TreasuryAnalyst
