            - call: "POST /offerings"
              payload: { issuer_id: "${iss_id}", regulation: "REG_CF", security_type: "EQUITY", price_per_security_cents: 1000, min_target_cents: 500000, max_target_cents: 2000000, deadline_at: "2026-07-01T00:00:00Z" }
              as: Issuer
              as_user_id: "${iss_id}"
              captures: { off_id: $.data.id }
            - call: "POST /offerings/${off_id}/form-c/submit"
              payload: {}
              as: Issuer
              as_user_id: "${iss_id}"
            - call: "POST /offerings/${off_id}/form-c/qualify"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "co-1"
            - call: "POST /offerings/${off_id}/go-live"
              payload: {}
              as: Issuer
              as_user_id: "${iss_id}"
              captures: { v0: $.data.version }
            - call: "POST /investments"
              payload: { offering_id: "${off_id}", investor_id: "${inv_id}", amount_cents: 200000, expected_offering_version: "${v0}" }
              as: Investor
              as_user_id: "${inv_id}"
              captures: { my_inv_id: $.data.id }
          trigger:
            - call: "POST /offerings/${off_id}/close"
              payload: {}
              as: Issuer
