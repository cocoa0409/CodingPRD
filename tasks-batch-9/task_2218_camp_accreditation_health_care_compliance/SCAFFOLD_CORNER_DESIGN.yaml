              as: AccreditationOfficer
              as_user_id: "officer-1"
          assert:
            - "call 1: 201 with VisitAssignment.${seat_lead_id}.status == ASSIGNED, team_role == LEAD and travel_days == 3"
            - "after call 1: AccreditationVisit.${visit_id}.team_size == 1 and lead_visitor_id == ${lead_id}"
            - "call 2: 201 with VisitAssignment.${seat_member_id}.travel_days == 5 for the closed interval 2026-08-02..2026-08-06"
            - "after call 2: AccreditationVisit.${visit_id}.team_size == 2 and lead_visitor_id still ${lead_id} - a MEMBER seat never moves the lead pointer"
            - "call 3: 200 with two rows, total_count == 2 and has_more == false"
            - "call 4: 200 with Visitor.${lead_id}.committed_travel_days == 3, while the member's stands at 5 - each visitor accumulates only their own seats"

      - name: deactivation_is_refused_the_second_time_and_a_quiet_clock_advance_reports_zero_cascades
        claim_type: Conditional action
        grounds:
          - endpoints[POST /accreditation/visitors/{visitorId}/deactivate]
          - endpoints[POST /_clock/set_current_utc]
          - validations[priority 28]
          - errors[ERR_VISITOR_INACTIVE]
        distinguishing_aspect: "The same deactivate request succeeds once and then fails, and the clock endpoint must still answer 200 with both cascade counters at zero when nothing is due - the counters are reports of work done, not of rows inspected."
        test_recipe:
          setup:
            - "one ACTIVE visitor holding no seats and no deficiencies anywhere in the system"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: AccreditationOfficer
              as_user_id: "officer-1"
            - call: "POST /accreditation/visitors"
              payload: { full_name: "Roster Only Visitor", home_state_code: "PA", trained_through_year: 2026, certifications: ["LEAD_VISITOR"] }
              as: AccreditationOfficer
              as_user_id: "officer-1"
              captures: { visitor_id: "$.data.id" }
          trigger:
            - call: "POST /accreditation/visitors/${visitor_id}/deactivate"
              payload: { deactivated_reason: "left the corps" }
              as: AccreditationOfficer
              as_user_id: "officer-1"
            - call: "POST /accreditation/visitors/${visitor_id}/deactivate"
              payload: { deactivated_reason: "left the corps again" }
              as: AccreditationOfficer
              as_user_id: "officer-1"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-31T00:00:00Z" }
              as: AccreditationOfficer
              as_user_id: "officer-1"
          assert:
            - "call 1: 200 with Visitor.${visitor_id}.status == INACTIVE, deactivated_reason stored and committed_travel_days == 0"
            - "call 2: 409 ERR_VISITOR_INACTIVE - the second identical request is refused rather than being absorbed"
            - "call 3: 200 with current_utc == 2026-12-31T00:00:00Z, escalated_deficiency_count == 0 and terminated_cycle_count == 0"
            - "Visitor.${visitor_id}.version is unchanged by call 2"

      - name: patch_endpoints_return_the_whole_camp_and_rebuild_every_derived_field
        claim_type: Standard CRUD
        grounds:
          - endpoints[PATCH /accreditation/camps/{campId}/state-license]
          - endpoints[PATCH /accreditation/camps/{campId}/health-center]
          - calculations.required_health_staffing_level
          - calculations.camp_compliance_posture
          - calculations.camp_risk_index
        distinguishing_aspect: "Two partial updates on disjoint field groups must each return the full row, bump version by exactly one, and re-derive the staffing requirement, posture and risk from scratch - the census and distance edit alone promotes the requirement to RN_ONSITE and opens a 15-point staffing gap that the next edit closes."
        test_recipe:
          setup:
            - "a DAY / YOUTH_ONLY camp in OH staffed FIRST_AIDER_ONLY with census 0 and hospital distance 0"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: AccreditationOfficer
              as_user_id: "officer-1"
            - call: "POST /accreditation/camps"
              payload: { name: "Patch Camp", camp_type: "DAY", state_code: "OH", population_served: "YOUTH_ONLY", resident_census: 0, distance_to_hospital_km: 0, health_staffing_level: "FIRST_AIDER_ONLY" }
              as: AccreditationOfficer
              as_user_id: "officer-1"
              captures: { camp_id: "$.data.id" }
          trigger:
            - call: "PATCH /accreditation/camps/${camp_id}/state-license"
              payload: { state_license_status: "PROBATION", state_license_number: "OH-CAMP-51002" }
              as: StateLicensingAgent
              as_user_id: "state-agent-1"
            - call: "PATCH /accreditation/camps/${camp_id}/health-center"
              payload: { resident_census: 130, distance_to_hospital_km: 25 }
              as: HealthCareStaff
              as_user_id: "${camp_id}"
            - call: "PATCH /accreditation/camps/${camp_id}/health-center"
              payload: { health_staffing_level: "RN_ONSITE" }
              as: CampDirector
              as_user_id: "${camp_id}"
            - call: "GET /accreditation/camps/${camp_id}/risk-index"
              as: StateLicensingAgent
              as_user_id: "state-agent-1"
          assert:
            - "after setup: version == 1, required_health_staffing_level == FIRST_AIDER_ONLY, compliance_posture == OPEN, risk_index == 16.00 (10 base plus 6 for the unlicensed status)"
            - "call 1: 200 with the full Camp row echoed, state_license_status == PROBATION, state_license_number stored, version == 2, compliance_posture == RESTRICTED and risk_index == 20.00 (licence penalty 10 replaces 6)"
            - "call 2: 200 with resident_census == 130 and distance_to_hospital_km == 25, version == 3, required_health_staffing_level == RN_ONSITE (census rank 3 is the maximum, only two components reach rank 2 so no combination bump) and risk_index == 35.00 (10 + 15 staffing gap + 10 licence)"
            - "call 2: health_staffing_level is still FIRST_AIDER_ONLY - the endpoint touched only the fields present in the payload"
            - "call 3: 200 with health_staffing_level == RN_ONSITE, version == 4, required_health_staffing_level unchanged at RN_ONSITE and risk_index back to 20.00 - the gap penalty is gone but PROBATION still costs 10 and keeps the posture RESTRICTED"
            - "call 4: 200 with risk_index_variant == PRE_VISIT, staffing_gap_penalty == 0.00, license_penalty == 10.00, compliance_component == 0.00 and risk_index == 20.00 matching the stored field"

  - section: errors
    instances:
      - name: one_envelope_shape_carries_every_status_class_in_the_catalog
        claim_type: Error Triggerability
        grounds:
          - errors[ERR_INVALID_REQUEST]
          - errors[ERR_CAMP_NOT_FOUND]
          - errors[ERR_STANDARDS_SET_ALREADY_PUBLISHED]
          - errors[ERR_STALE_CAMP_VERSION]
          - errors[ERR_VISIT_WINDOW_INVALID]
          - response_envelope.error
        distinguishing_aspect: "One walk touches 400, 404, 409, 412 and 422 and every response must carry response_type error with data.error_id and data.message and no data payload of the target entity - the 412 in particular must be produced by a version the client legitimately held before an unrelated write advanced it."
        test_recipe:
          setup:
            - "clock 2026-08-01; one camp and one published edition; the camp version is captured before the licensing agent advances it"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: AccreditationOfficer
              as_user_id: "officer-1"
            - call: "POST /accreditation/camps"
              payload: { name: "Envelope Camp", camp_type: "DAY", state_code: "OH", population_served: "YOUTH_ONLY", health_staffing_level: "FIRST_AIDER_ONLY" }
              as: AccreditationOfficer
              as_user_id: "officer-1"
              captures: { camp_id: "$.data.id", stale_camp_version: "$.data.version" }
            - call: "POST /accreditation/standards-sets"
              payload: { edition_code: "ACA-2026-ENV", effective_year: 2026 }
              as: AccreditationOfficer
              as_user_id: "officer-1"
              captures: { set_id: "$.data.id" }
            - call: "POST /accreditation/standards"
              payload: { standards_set_id: "${set_id}", code: "SU.1", title: "Supervision ratios", domain: "SUPERVISION", mandatory: true, scoring_weight: 1 }
              as: AccreditationOfficer
              as_user_id: "officer-1"
            - call: "POST /accreditation/standards-sets/${set_id}/publish"
              as: AccreditationOfficer
              as_user_id: "officer-1"
            - call: "PATCH /accreditation/camps/${camp_id}/state-license"
              payload: { state_license_status: "ACTIVE", state_license_number: "OH-CAMP-60003" }
              as: StateLicensingAgent
              as_user_id: "state-agent-1"
            - call: "GET /accreditation/camps/${camp_id}"
              as: AccreditationOfficer
              as_user_id: "officer-1"
              captures: { fresh_camp_version: "$.data.version" }
          trigger:
            - call: "POST /accreditation/camps"
              payload: { name: "Bad Enum Camp", camp_type: "GLAMPING", state_code: "OH", population_served: "YOUTH_ONLY" }
              as: AccreditationOfficer
              as_user_id: "officer-1"
            - call: "GET /accreditation/camps/00000000-0000-0000-0000-0000000000ff"
              as: AccreditationOfficer
              as_user_id: "officer-1"
            - call: "POST /accreditation/standards-sets/${set_id}/publish"
              as: AccreditationOfficer
              as_user_id: "officer-1"
            - call: "POST /accreditation/cycles"
              payload: { camp_id: "${camp_id}", standards_set_id: "${set_id}", cycle_year: 2026, expected_camp_version: "${stale_camp_version}" }
              as: AccreditationOfficer
              as_user_id: "officer-1"
            - call: "POST /accreditation/cycles"
              payload: { camp_id: "${camp_id}", standards_set_id: "${set_id}", cycle_year: 2026, expected_camp_version: "${fresh_camp_version}" }
              as: AccreditationOfficer
              as_user_id: "officer-1"
              captures: { cycle_id: "$.data.id" }
            - call: "GET /accreditation/cycles/${cycle_id}"
              as: AccreditationOfficer
              as_user_id: "officer-1"
              captures: { cycle_version: "$.data.version" }
            - call: "POST /accreditation/visits"
              payload: { cycle_id: "${cycle_id}", window_start_date: "2026-09-01", window_end_date: "2026-08-31", expected_cycle_version: "${cycle_version}" }
              as: AccreditationOfficer
              as_user_id: "officer-1"
          assert:
            - "call 1: 400 with data.error_id == ERR_INVALID_REQUEST - camp_type GLAMPING is outside the declared enum"
            - "call 2: 404 with data.error_id == ERR_CAMP_NOT_FOUND"
            - "call 3: 409 with data.error_id == ERR_STANDARDS_SET_ALREADY_PUBLISHED"
            - "call 4: 412 with data.error_id == ERR_STALE_CAMP_VERSION - the version captured at creation is one behind after the licence patch"
            - "call 5: 201 - the same request with the fresh version succeeds, proving the 412 was about the version and nothing else"
            - "call 7: 422 with data.error_id == ERR_VISIT_WINDOW_INVALID"
            - "every error response carries response_type == error, a non-empty data.message, a meta.api_request_id and a meta.api_request_timestamp, and never an entity body"
            - "no error response leaves a row behind: exactly one Camp, one StandardsSet, one AccreditationCycle and zero AccreditationVisit rows exist at the end"

  - section: rbac
    instances:
      - name: other_roles_exclusive_operations_cannot_be_reached_and_a_missing_x_user_header_returns_401
        claim_type: Role Isolation
        grounds:
          - roles.CampDirector.exclusive_operations
          - roles.HealthCareStaff.exclusive_operations
          - roles.AccreditationOfficer.exclusive_operations
          - roles.StateLicensingAgent.exclusive_operations
          - validations[priority 1]
          - validations[priority 2]
          - errors[ERR_UNAUTHENTICATED]
          - errors[ERR_UNAUTHORIZED]
        distinguishing_aspect: "Authentication is checked before authorisation, so a request with no X-User-ID header answers 401 even when the role would also have been wrong; and the licensing agent - who has real standing on the camp row - still cannot touch the accreditation catalogue."
        test_recipe:
          setup:
            - "one camp and one visitor created by the national office"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: AccreditationOfficer
              as_user_id: "officer-1"
            - call: "POST /accreditation/camps"
              payload: { name: "Rbac Camp", camp_type: "DAY", state_code: "OH", population_served: "YOUTH_ONLY", health_staffing_level: "RN_ONSITE" }
              as: AccreditationOfficer
              as_user_id: "officer-1"
              captures: { camp_id: "$.data.id" }
            - call: "POST /accreditation/visitors"
              payload: { full_name: "Rbac Visitor", home_state_code: "PA", trained_through_year: 2026, certifications: ["LEAD_VISITOR"] }
              as: AccreditationOfficer
              as_user_id: "officer-1"
              captures: { visitor_id: "$.data.id" }
          trigger:
            - call: "POST /accreditation/camps"
              payload: { name: "Self Registered Camp", camp_type: "DAY", state_code: "OH", population_served: "YOUTH_ONLY" }
              as: CampDirector
              as_user_id: "${camp_id}"
            - call: "PATCH /accreditation/camps/${camp_id}/state-license"
              payload: { state_license_status: "ACTIVE" }
              as: CampDirector
              as_user_id: "${camp_id}"
            - call: "POST /accreditation/medication-records"
              payload: { camp_id: "${camp_id}", camper_reference: "CR-R1", medication_class: "OTC", dose_units: 1, administered_at: "2026-08-01T09:00:00.000Z", administered_by_role: "RN" }
              as: CampDirector
              as_user_id: "${camp_id}"
            - call: "POST /accreditation/visitors/${visitor_id}/deactivate"
              payload: { deactivated_reason: "self removal" }
              as: Visitor
              as_user_id: "${visitor_id}"
            - call: "GET /accreditation/visitors/${visitor_id}"
              as: StateLicensingAgent
              as_user_id: "state-agent-1"
            - call: "POST /accreditation/standards-sets"
              payload: { edition_code: "ACA-2026-RBX", effective_year: 2026 }
              as: StateLicensingAgent
              as_user_id: "state-agent-1"
            - call: "GET /accreditation/camps/${camp_id}"
              as: CampDirector
          assert:
            - "call 1: 403 ERR_UNAUTHORIZED - camp registration is exclusive to the AccreditationOfficer"
            - "call 2: 403 ERR_UNAUTHORIZED - the licence axis belongs to the StateLicensingAgent alone, even on the director's own camp"
            - "call 3: 403 ERR_UNAUTHORIZED - medication administration is exclusive to HealthCareStaff, who shares the camp identity but not this operation"
            - "call 4: 403 ERR_UNAUTHORIZED - roster removal is the office's call, not the visitor's"
            - "call 5: 403 ERR_UNAUTHORIZED - the visitor roster is not among the licensing agent's shared reads"
            - "call 6: 403 ERR_UNAUTHORIZED - the standards catalogue is closed to the licensing agent"
            - "call 7: 401 ERR_UNAUTHENTICATED - the request omits the X-User-ID header entirely on an endpoint whose role list does include CampDirector, so only the authentication rule at priority 1 can answer"
            - "Camp.${camp_id}.state_license_status is still NONE and Visitor.${visitor_id}.status is still ACTIVE - no rejected call wrote anything"

      - name: camp_and_visitor_scoped_actors_are_confined_to_their_own_rows
        claim_type: Ownership Scope
        grounds:
          - roles.CampDirector.scope
          - roles.Visitor.scope
          - validations[priority 17]
          - errors[ERR_FORBIDDEN_SCOPE]
        distinguishing_aspect: "The role is right and the endpoint is right - only the identity is wrong, and the two visitor-scoped shapes differ: starting a visit demands the lead seat while scoring only demands any ASSIGNED seat, so a seated MEMBER is refused on one and accepted on the other."
        test_recipe:
          setup:
            - "clock 2026-08-01; two camps; one published edition with a single mandatory supervision standard; camp A's cycle self-assessed, submitted and its visit scheduled with a LEAD and a MEMBER seat; a third visitor holds no seat"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
