            - call: "POST /nmtc/qlicis"
              payload: { qei_id: "${qei_id}", qalicb_id: "${qalicb_id}", loan_class: "A", principal_cents: 30000000 }
              as: CDESponsor
              as_user_id: "${cde_id}"
              captures: { qlici_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
