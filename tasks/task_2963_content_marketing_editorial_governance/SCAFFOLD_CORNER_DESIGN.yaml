          rationale: "Scoring the same evidence set under both variants, including the inadmissible source types and the two recency cut-offs, is exactly what the named §1.8 instance asserts."

      - name: last_touch_versus_assisted_pipeline_divergence_is_covered_by_the_difficulty_design
        claim_type: Variant Divergence
        grounds:
          - calculations.content_pipeline_attribution.variants
        excluded_because:
          difficulty_instance: dual_variant_calc / pipeline_attribution_last_touch_diverges_from_assisted_fractional
          rationale: "The named §1.8 instance already asserts both variants over one snapshot set and shows they disagree in total and in which snapshots contribute."

      - name: assisted_attribution_per_snapshot_rounding_order_is_covered_by_the_difficulty_design
        claim_type: Precision
        grounds:
