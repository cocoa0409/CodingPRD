              captures: { err_id: $.data.error_id }
          assert:
            - "Response error_id is in {ERR_PRECONDITION_FAILED, ERR_INVALID_STATE} (either cross-entity parent-state guard fires, OR the offer itself is REVOKED via cascade and the state precondition fails)"
            - "Offer.status remains REVOKED (not EXTENDED)"
            - "JobRequisition.status == CANCELLED"

  # ===================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # ===================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: interview_overlap_per_application_half_open_adjacency_allowed
        grounds:
          - validations[priority=14.5]
          - errors[ERR_INTERVIEW_OVERLAP_APPLICATION]
        distinguishing_aspect: |
          Resource = Application; interval semantics = pure half-open [scheduled_at,
          scheduled_at + duration_minutes) with NO buffer. Two interviews on the SAME application
          whose intervals share even a single instant are rejected; adjacency at end == start is
          permitted. This is the unbuffered geometry — different from the panelist-buffered case.
        test_recipe:
          setup:
            - "Application A approved & screened; interview I1 scheduled 10:00–11:00 UTC; panel includes only emp_panelA"
            - "Attempt to schedule second interview I2 on SAME application at 10:30–11:30 UTC (overlap by 30 min); panel uses a completely different panelist to isolate the application-level rule from the panelist-level rule"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /ats/departments"
              payload: { name: "OvlAppDept", cost_center_code: "OVA-001", hiring_budget_cents: 100000000 }
              as: PlatformAdmin
              captures: { dept_id: $.data.id }
            - call: "POST /ats/requisitions"
              payload: { department_id: "${dept_id}", title: "OvlAppRole", target_level: "MID", base_salary_min_cents: 10000000, base_salary_max_cents: 15000000, openings: 1 }
              as: Recruiter
              as_user_id: "rec_alice"
              captures: { req_id: $.data.id }
            - call: "POST /ats/requisitions/${req_id}/submit"
              payload: {}
              as: Recruiter
              as_user_id: "rec_alice"
            - call: "POST /ats/requisitions/${req_id}/approve"
              payload: {}
              as: HiringManager
              as_user_id: "hm_bob"
            - call: "POST /ats/candidates"
              payload: { full_name: "OvlApp Cand", email: "ovlappc@example.com", source_channel: "DIRECT", eeo_ethnicity: "WHITE", eeo_gender: "MALE", eeo_veteran: false, eeo_disability: false }
              as: Recruiter
              as_user_id: "rec_alice"
              captures: { cand_id: $.data.id }
            - call: "POST /ats/applications"
              payload: { candidate_id: "${cand_id}", requisition_id: "${req_id}" }
              as: Recruiter
              as_user_id: "rec_alice"
              captures: { app_id: $.data.id }
            - call: "POST /ats/applications/${app_id}/screen"
              payload: {}
              as: Recruiter
              as_user_id: "rec_alice"
            - call: "POST /ats/interviews"
              payload: { application_id: "${app_id}", round_number: 1, scheduled_at: "2026-12-02T10:00:00Z", duration_minutes: 60, panel_user_ids: ["emp_panelA"] }
              as: Recruiter
              as_user_id: "rec_alice"
              captures: { intv1_id: $.data.id }
          trigger:
            - call: "POST /ats/interviews"
              payload: { application_id: "${app_id}", round_number: 2, scheduled_at: "2026-12-02T10:30:00Z", duration_minutes: 60, panel_user_ids: ["emp_panelB"] }
              as: Recruiter
              as_user_id: "rec_alice"
              captures: { err_id: $.data.error_id }
          assert:
            - "Response error_id == ERR_INTERVIEW_OVERLAP_APPLICATION (priority 14.5)"
            - "Only one Interview exists for application_id=${app_id} (the second was rejected)"

      - name: interview_overlap_per_panelist_15min_buffered_interval
        grounds:
          - validations[priority=14.6]
          - errors[ERR_INTERVIEW_OVERLAP_PANELIST]
        distinguishing_aspect: |
          Resource = Panelist (Employee user id); interval semantics = 15-minute symmetric buffer
          [scheduled_at - 15min, scheduled_at + duration_minutes + 15min). Two interviews on
          DIFFERENT applications sharing a panelist whose BUFFERED intervals overlap are rejected
          even though the raw intervals are 5 minutes apart. Different semantics (buffered vs
          unbuffered) and different resource entity (Panelist user vs Application) than the
          application-level rule above.
        test_recipe:
          setup:
            - "Two applications A1 (in INTERVIEWING after screening) and A2 (screened), each with shared panelist emp_panelX"
            - "Interview I1 on A1 scheduled 10:00–11:00; attempt I2 on A2 scheduled 11:05–12:05 (raw gap=5min, but buffered gap=−25min → overlap)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
