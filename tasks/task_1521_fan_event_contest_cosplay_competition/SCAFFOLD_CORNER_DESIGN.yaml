          assert:
            - "ScoreSheet.${sa1}.sheet_total == 7.9 (0.5*9 + 0.3*8 + 0.2*5)"
            - "Entry A final_score == 7.0 and craftsmanship_mean == 7.67"
            - "Entry B final_score == 7.0 and craftsmanship_mean == 6.67"
            - "Entry A placement_rank == 1, Entry B placement_rank == 2 (tie broken by craftsmanship_mean DESC)"

      - name: placement_tiebreak_created_at_order
        claim_type: correct_result
        grounds: [calculations.placement_rank_assignment]
        distinguishing_aspect: "When final_score AND craftsmanship_mean both tie, the earlier-created entry wins (created_at ASC); random id is never a tie-break input."
