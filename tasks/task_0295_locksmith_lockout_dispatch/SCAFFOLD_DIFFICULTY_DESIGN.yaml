  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: after_hours_surcharge_threshold_1080_inclusive
        grounds:
          - calculations.surcharge_multiplier
          - calculations.quote_estimated_total_cents
          - entities.OnSiteQuote.fields.estimated_total_cents
        distinguishing_aspect: |
          Numeric threshold boundary on requested_at_minute: at exactly 1080 (18:00) the
          AFTER_HOURS_MULTIPLIER applies (estimate = 9000*1.5 = 13500 for LOCKOUT), while at 1079
          it does NOT (estimate = 9000). The >= boundary is reached via the quote-draft endpoint.
        test_recipe:
          setup:
            - "Two LOCKOUT jobs: one requested_at_minute=1080, one=1079, each with a drafted quote."
          setup_api_calls:
            - call: "POST /technicians"
              payload: { full_name: "T11", certified_for: ["LOCKOUT"], base_travel_minutes: 15 }
              as: Dispatcher
              captures: { tech11: $.data.id }
            - call: "POST /service-jobs"
              payload: { customer_name: "C11a", customer_user_id: "cust-11a", service_type: "LOCKOUT", service_address: "11a Main St", requested_at_minute: 1080 }
              as: Dispatcher
              captures: { job11a: $.data.id }
            - call: "POST /service-jobs/${job11a}/dispatches"
              payload: { technician_id: "${tech11}", eta_start_minute: 1085, eta_end_minute: 1120 }
              as: Dispatcher
              captures: { disp11a: $.data.id }
            - call: "POST /dispatches/${disp11a}/depart"
              payload: {}
              as: Technician
              as_user_id: "${tech11}"
            - call: "POST /dispatches/${disp11a}/arrive"
              payload: { arrived_at_minute: 1110 }
              as: Technician
              as_user_id: "${tech11}"
          trigger:
            - call: "POST /service-jobs/${job11a}/quotes"
              payload: { labor_hours: 0, part_lines: [] }
              as: Technician
              as_user_id: "${tech11}"
              captures: { est11a: $.data.estimated_total_cents }
          assert:
            - "OnSiteQuote at requested_at_minute=1080 has estimated_total_cents == 13500"

      - name: reservation_zero_quantity_empty_count_boundary
        grounds:
          - validations[priority=10]
          - entities.PartReservation.fields.quantity
          - errors[ERR_INVALID_QUANTITY]
        distinguishing_aspect: |
          Different metric (a count, not a price threshold) on a different endpoint
          (POST /part-reservations): quantity == 0 is the empty/zero-count boundary and is
          rejected with ERR_INVALID_QUANTITY, whereas quantity >= 1 is accepted.
        test_recipe:
          setup:
            - "LockPart units_total=3; job ON_SITE with a DRAFTED quote."
          setup_api_calls:
            - call: "POST /lock-parts"
              payload: { sku: "PIN-12", units_total: 3 }
              as: InventoryManager
              captures: { lp12: $.data.id, lp12v: $.data.version }
            - call: "POST /technicians"
              payload: { full_name: "T12", certified_for: ["REKEY"], base_travel_minutes: 20 }
              as: Dispatcher
              captures: { tech12: $.data.id }
            - call: "POST /service-jobs"
              payload: { customer_name: "C12", customer_user_id: "cust-12", service_type: "REKEY", service_address: "12 Main St", requested_at_minute: 600 }
              as: Dispatcher
              captures: { job12: $.data.id }
            - call: "POST /service-jobs/${job12}/dispatches"
              payload: { technician_id: "${tech12}", eta_start_minute: 605, eta_end_minute: 650 }
              as: Dispatcher
              captures: { disp12: $.data.id }
            - call: "POST /dispatches/${disp12}/depart"
              payload: {}
              as: Technician
              as_user_id: "${tech12}"
            - call: "POST /dispatches/${disp12}/arrive"
              payload: { arrived_at_minute: 640 }
              as: Technician
              as_user_id: "${tech12}"
            - call: "POST /service-jobs/${job12}/quotes"
              payload: { labor_hours: 1.0, part_lines: [] }
              as: Technician
              as_user_id: "${tech12}"
              captures: { quote12: $.data.id }
          trigger:
            - call: "POST /part-reservations"
              payload: { on_site_quote_id: "${quote12}", lock_part_id: "${lp12}", quantity: 0, expected_lockpart_version: "${lp12v}" }
              as: Technician
              as_user_id: "${tech12}"
              captures: { err12: $.data.error_id }
          assert:
            - "response.status == 422"
            - "response.data.error_id == ERR_INVALID_QUANTITY"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: quote_submit_requires_job_on_site
        grounds:
          - state_machines.OnSiteQuote.DRAFTED_to_SUBMITTED
          - entities.ServiceJob.fields.job_status
          - errors[ERR_JOB_NOT_ON_SITE]
        distinguishing_aspect: |
          Entity pair OnSiteQuote -> ServiceJob: a quote can only transition DRAFTED->SUBMITTED
          when its parent ServiceJob.job_status == ON_SITE; with the job still DISPATCHED the
          submit is rejected with ERR_JOB_NOT_ON_SITE.
        test_recipe:
          setup:
            - "Job DISPATCHED (technician dispatched but NOT yet arrived); a DRAFTED quote exists."
            - "Quote is draftable because draft has no job-state precondition; submit requires ON_SITE."
          setup_api_calls:
            - call: "POST /technicians"
              payload: { full_name: "T13", certified_for: ["REKEY"], base_travel_minutes: 20 }
              as: Dispatcher
              captures: { tech13: $.data.id }
            - call: "POST /service-jobs"
              payload: { customer_name: "C13", customer_user_id: "cust-13", service_type: "REKEY", service_address: "13 Main St", requested_at_minute: 600 }
              as: Dispatcher
              captures: { job13: $.data.id }
            - call: "POST /service-jobs/${job13}/dispatches"
              payload: { technician_id: "${tech13}", eta_start_minute: 605, eta_end_minute: 650 }
              as: Dispatcher
              captures: { disp13: $.data.id }
            - call: "POST /service-jobs/${job13}/quotes"
              payload: { labor_hours: 1.0, part_lines: [] }
              as: Technician
              as_user_id: "${tech13}"
              captures: { quote13: $.data.id }
          trigger:
            - call: "POST /quotes/${quote13}/submit"
              payload: {}
              as: Technician
              as_user_id: "${tech13}"
              captures: { err13: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_JOB_NOT_ON_SITE"
            - "OnSiteQuote.${quote13}.status == DRAFTED"

      - name: dispatch_requires_technician_on_duty
        grounds:
          - state_machines.ServiceJob.INTAKE_to_DISPATCHED
          - entities.Technician.fields.status
          - errors[ERR_TECHNICIAN_UNAVAILABLE]
        distinguishing_aspect: |
          Different entity pair Dispatch -> Technician: a new dispatch can only be created when
          the target Technician.status == ON_DUTY; a technician taken OFF_DUTY is rejected with
          ERR_TECHNICIAN_UNAVAILABLE.
        test_recipe:
          setup:
            - "Technician taken OFF_DUTY; an INTAKE job exists."
          setup_api_calls:
            - call: "POST /technicians"
              payload: { full_name: "T14", certified_for: ["LOCKOUT"], base_travel_minutes: 20 }
              as: Dispatcher
              captures: { tech14: $.data.id }
            - call: "POST /technicians/${tech14}/set-off-duty"
              payload: {}
              as: Dispatcher
            - call: "POST /service-jobs"
              payload: { customer_name: "C14b", customer_user_id: "cust-14b", service_type: "LOCKOUT", service_address: "14b Main St", requested_at_minute: 700 }
              as: Dispatcher
              captures: { job14b: $.data.id }
          trigger:
            - call: "POST /service-jobs/${job14b}/dispatches"
              payload: { technician_id: "${tech14}", eta_start_minute: 705, eta_end_minute: 750 }
              as: Dispatcher
              captures: { err14: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_TECHNICIAN_UNAVAILABLE"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: technician_eta_window_overlap_with_buffer
        grounds:
          - validations[priority=7]
          - entities.Dispatch.fields.eta_start_minute
          - entities.Dispatch.fields.eta_end_minute
          - errors[ERR_ETA_WINDOW_OVERLAP]
        distinguishing_aspect: |
          Resource = Technician. Half-open ETA windows with a BUFFER_MINUTES travel buffer:
          a second dispatch of the SAME on-duty technician whose window starts inside
          [prior_start, prior_end + BUFFER) collides. Distinct interval arithmetic
          (buffer-extended, half-open) from the bay rule. A technician stays ON_DUTY across
          scheduled dispatches, so the overlap check (not an availability gate) is what fires.
        test_recipe:
          setup:
            - "One ON_DUTY technician dispatched to job A with ETA [600,640); a second INTAKE job B exists."
            - "A second dispatch with ETA [650,700) starts within 640+BUFFER (BUFFER_MINUTES=15 -> 655), so it overlaps."
          setup_api_calls:
            - call: "POST /technicians"
              payload: { full_name: "T15", certified_for: ["LOCKOUT", "REKEY"], base_travel_minutes: 10 }
              as: Dispatcher
              captures: { tech15: $.data.id }
            - call: "POST /service-jobs"
              payload: { customer_name: "C15a", customer_user_id: "cust-15a", service_type: "LOCKOUT", service_address: "15a Main St", requested_at_minute: 600 }
              as: Dispatcher
              captures: { job15a: $.data.id }
            - call: "POST /service-jobs/${job15a}/dispatches"
              payload: { technician_id: "${tech15}", eta_start_minute: 600, eta_end_minute: 640 }
              as: Dispatcher
              captures: { disp15a: $.data.id }
            - call: "POST /service-jobs"
              payload: { customer_name: "C15b", customer_user_id: "cust-15b", service_type: "REKEY", service_address: "15b Main St", requested_at_minute: 650 }
              as: Dispatcher
              captures: { job15b: $.data.id }
          trigger:
            - call: "POST /service-jobs/${job15b}/dispatches"
              payload: { technician_id: "${tech15}", eta_start_minute: 650, eta_end_minute: 700 }
              as: Dispatcher
              captures: { err15: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_ETA_WINDOW_OVERLAP"

      - name: bay_slot_overlap_closed_interval
        grounds:
          - validations[priority=8]
          - entities.BayBooking.fields.slot_start_minute
          - entities.BayBooking.fields.slot_end_minute
          - errors[ERR_BAY_SLOT_OVERLAP]
        distinguishing_aspect: |
          Resource = JobBay. Closed intervals with inclusive endpoints and NO buffer: a booking
          [640,700] collides with an existing [600,640] because they share the endpoint minute 640
          (inclusive). Distinct interval semantics from the half-open buffered technician rule.
        test_recipe:
          setup:
            - "Bay with an existing BOOKED slot [600,640]; two INTAKE jobs exist."
          setup_api_calls:
            - call: "POST /job-bays"
              payload: { bay_name: "Bench-1" }
              as: Dispatcher
              captures: { bay16: $.data.id }
            - call: "POST /service-jobs"
              payload: { customer_name: "C16a", customer_user_id: "cust-16a", service_type: "REKEY", service_address: "16a Main St", requested_at_minute: 600 }
              as: Dispatcher
              captures: { job16a: $.data.id }
            - call: "POST /service-jobs"
              payload: { customer_name: "C16b", customer_user_id: "cust-16b", service_type: "REKEY", service_address: "16b Main St", requested_at_minute: 640 }
              as: Dispatcher
              captures: { job16b: $.data.id }
            - call: "POST /bay-bookings"
              payload: { service_job_id: "${job16a}", job_bay_id: "${bay16}", slot_start_minute: 600, slot_end_minute: 640 }
              as: Dispatcher
              captures: { bk16a: $.data.id }
          trigger:
            - call: "POST /bay-bookings"
              payload: { service_job_id: "${job16b}", job_bay_id: "${bay16}", slot_start_minute: 640, slot_end_minute: 700 }
              as: Dispatcher
              captures: { err16: $.data.error_id }
          assert:
            - "response.status == 409"
            - "response.data.error_id == ERR_BAY_SLOT_OVERLAP"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: inventory_units_conserved_on_reserve_then_release
        grounds:
          - calculations.lockpart_unit_ledger
          - state_machines.PartReservation.RESERVED_to_RELEASED
          - entities.LockPart.fields.units_total
          - entities.LockPart.fields.units_available
        distinguishing_aspect: |
          Conserved quantity = physical inventory units. Reserve(+2 reserved, -2 available)
          followed by its compensating release (via quote reject) restores
          units_total == units_available + units_reserved + units_committed with units_available
          back to its pre-reserve value (5). No drift.
        test_recipe:
          setup:
            - "LockPart units_total=5; job ON_SITE with a SUBMITTED quote and one RESERVED reservation qty 2."
          setup_api_calls:
            - call: "POST /lock-parts"
              payload: { sku: "PIN-17", units_total: 5 }
              as: InventoryManager
              captures: { lp17: $.data.id, lp17v: $.data.version }
            - call: "POST /technicians"
              payload: { full_name: "T17", certified_for: ["REKEY"], base_travel_minutes: 20 }
              as: Dispatcher
              captures: { tech17: $.data.id }
            - call: "POST /service-jobs"
              payload: { customer_name: "C17", customer_user_id: "cust-17", service_type: "REKEY", service_address: "17 Main St", requested_at_minute: 600 }
              as: Dispatcher
              captures: { job17: $.data.id }
            - call: "POST /service-jobs/${job17}/dispatches"
              payload: { technician_id: "${tech17}", eta_start_minute: 605, eta_end_minute: 650 }
              as: Dispatcher
              captures: { disp17: $.data.id }
            - call: "POST /dispatches/${disp17}/depart"
              payload: {}
              as: Technician
              as_user_id: "${tech17}"
            - call: "POST /dispatches/${disp17}/arrive"
              payload: { arrived_at_minute: 640 }
              as: Technician
              as_user_id: "${tech17}"
            - call: "POST /service-jobs/${job17}/quotes"
              payload: { labor_hours: 1.0, part_lines: [] }
              as: Technician
              as_user_id: "${tech17}"
              captures: { quote17: $.data.id }
            - call: "POST /part-reservations"
              payload: { on_site_quote_id: "${quote17}", lock_part_id: "${lp17}", quantity: 2, expected_lockpart_version: "${lp17v}" }
              as: Technician
              as_user_id: "${tech17}"
              captures: { resv17: $.data.id }
            - call: "POST /quotes/${quote17}/submit"
              payload: {}
              as: Technician
              as_user_id: "${tech17}"
          trigger:
            - call: "POST /quotes/${quote17}/reject"
              payload: {}
              as: Customer
              as_user_id: "cust-17"
          assert:
            - "PartReservation.${resv17}.status == RELEASED"
            - "LockPart.${lp17}.units_available == 5"
            - "LockPart.${lp17}.units_reserved == 0"
            - "LockPart.${lp17}.units_committed == 0"

      - name: money_conserved_on_capture_then_warranty_refund
        grounds:
          - calculations.job_net_paid_cents
          - state_machines.ServiceJob.PAID_to_REFUNDED
          - state_machines.WarrantyClaim.FILED_to_APPROVED
          - entities.Payment.fields.captured_amount_cents
          - entities.Payment.fields.refunded_amount_cents
        distinguishing_aspect: |
          Conserved quantity = money (cents), distinct from inventory units. A capture(+8000)
          fully refunded by an approved warranty claim(-8000) leaves net_paid_cents back at 0;
          captured_amount_cents - refunded_amount_cents nets to 0 with no drift.
        test_recipe:
          setup:
            - "Job CLOSED and PAID for 8000 (REKEY daytime, labor 1.0h, no parts -> final 8000); a warranty claim FILED for 8000 with days_since_close=3."
          setup_api_calls:
            - call: "POST /technicians"
              payload: { full_name: "T18", certified_for: ["REKEY"], base_travel_minutes: 20 }
              as: Dispatcher
              captures: { tech18: $.data.id }
            - call: "POST /service-jobs"
              payload: { customer_name: "C18", customer_user_id: "cust-18", service_type: "REKEY", service_address: "18 Main St", requested_at_minute: 600 }
              as: Dispatcher
              captures: { job18: $.data.id }
            - call: "POST /service-jobs/${job18}/dispatches"
              payload: { technician_id: "${tech18}", eta_start_minute: 605, eta_end_minute: 650 }
              as: Dispatcher
              captures: { disp18: $.data.id }
            - call: "POST /dispatches/${disp18}/depart"
              payload: {}
              as: Technician
              as_user_id: "${tech18}"
            - call: "POST /dispatches/${disp18}/arrive"
              payload: { arrived_at_minute: 640 }
              as: Technician
              as_user_id: "${tech18}"
            - call: "POST /service-jobs/${job18}/quotes"
              payload: { labor_hours: 1.0, part_lines: [] }
              as: Technician
              as_user_id: "${tech18}"
              captures: { quote18: $.data.id }
            - call: "POST /quotes/${quote18}/submit"
              payload: {}
              as: Technician
              as_user_id: "${tech18}"
            - call: "POST /quotes/${quote18}/approve"
              payload: {}
              as: Customer
              as_user_id: "cust-18"
            - call: "POST /service-jobs/${job18}/payments"
              payload: { captured_amount_cents: 8000 }
              as: BillingAgent
              captures: { pay18: $.data.id }
            - call: "POST /service-jobs/${job18}/complete-work"
              payload: {}
              as: Technician
              as_user_id: "${tech18}"
            - call: "POST /service-jobs/${job18}/close"
              payload: {}
              as: Dispatcher
            - call: "POST /service-jobs/${job18}/warranty-claims"
              payload: { filed_at_minute: 700, days_since_close: 3, reason: "lock failed", refund_amount_cents: 8000 }
              as: Customer
              as_user_id: "cust-18"
              captures: { claim18: $.data.id }
          trigger:
            - call: "POST /warranty-claims/${claim18}/approve"
              payload: {}
              as: Dispatcher
          assert:
            - "WarrantyClaim.${claim18}.status == APPROVED"
            - "Payment.${pay18}.status == REFUNDED"
            - "Payment.${pay18}.refunded_amount_cents == 8000"
            - "ServiceJob.${job18}.payment_status == REFUNDED"
            - "ServiceJob.${job18}.net_paid_cents == 0"
