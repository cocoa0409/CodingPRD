          difficulty_instance: order_authorization_estimate_vs_final_capture
          rationale: "That §1.8 instance already runs the same order through the ESTIMATE authorization and the FINAL capture and asserts the delta on every money field, which is the variant-divergence claim for order_estimate_authorization."

