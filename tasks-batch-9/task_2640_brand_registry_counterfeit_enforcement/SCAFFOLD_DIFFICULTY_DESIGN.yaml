              as: BrandAdministrator
              captures: { reg_id: $.data.id }
            - call: "POST /brand-protection/enrollments"
              payload: { brand_id: "${brand_id}", asserted_registration_id: "${reg_id}", marketplace_code: "AMZ", requested_nice_class: 8, expected_brand_version: "${brand_v}" }
              as: BrandAdministrator
              captures: { enr_id: $.data.id }
            - call: "POST /brand-protection/enrollments/${enr_id}/activate"
              as: MarketplaceLiaison
            - call: "POST /brand-protection/representatives"
              payload: { enrollment_id: "${enr_id}", authority_scope: "SUBMIT_TAKEDOWN", effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-09-01T00:00:00Z", power_of_attorney_ref: "POA-INCUMBENT" }
              as: BrandAdministrator
              captures: { rep1_id: $.data.id }
          trigger:
            - call: "POST /brand-protection/representatives"
              payload: { enrollment_id: "${enr_id}", authority_scope: "SUBMIT_TAKEDOWN", effective_from: "2026-09-01T00:00:00Z", effective_to: "2026-10-01T00:00:00Z", power_of_attorney_ref: "POA-ADJACENT" }
              as: BrandAdministrator
              captures: { rep2_id: $.data.id }
            - call: "POST /brand-protection/representatives"
              payload: { enrollment_id: "${enr_id}", authority_scope: "SUBMIT_TAKEDOWN", effective_from: "2026-08-31T23:59:59Z", effective_to: "2026-10-01T00:00:00Z", power_of_attorney_ref: "POA-ONE-SECOND" }
              as: BrandAdministrator
              captures: { err_overlap: $.data.error_id }
            - call: "POST /brand-protection/representatives"
              payload: { enrollment_id: "${enr_id}", authority_scope: "AUTHORIZE_LITIGATION", effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-09-01T00:00:00Z", power_of_attorney_ref: "POA-LITIGATION" }
              as: BrandAdministrator
              captures: { rep4_id: $.data.id }
            - call: "POST /brand-protection/representatives"
              payload: { enrollment_id: "${enr_id}", authority_scope: "BOTH", effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-09-01T00:00:00Z", power_of_attorney_ref: "POA-BOTH" }
              as: BrandAdministrator
              captures: { err_both: $.data.error_id }
            - call: "POST /brand-protection/representatives/${rep1_id}/revoke"
              payload: { reason_code: "SUPERSEDED_BY_COUNSEL" }
              as: BrandAdministrator
            - call: "POST /brand-protection/representatives"
              payload: { enrollment_id: "${enr_id}", authority_scope: "SUBMIT_TAKEDOWN", effective_from: "2026-08-01T00:00:00Z", effective_to: "2026-09-01T00:00:00Z", power_of_attorney_ref: "POA-REPLACEMENT" }
              as: BrandAdministrator
              captures: { rep6_id: $.data.id }
          assert:
            - "the adjacent designation returns HTTP 201 and AuthorizedRepresentative.${rep2_id}.designation_status == DESIGNATED (gap of exactly zero is legal under a half-open window)"
            - "the one-second-early designation returns HTTP 409 with error_id ERR_REPRESENTATIVE_WINDOW_OVERLAP"
            - "the AUTHORIZE_LITIGATION designation returns HTTP 201 with the incumbent's exact window, because scope_set(AUTHORIZE_LITIGATION) does not intersect scope_set(SUBMIT_TAKEDOWN)"
