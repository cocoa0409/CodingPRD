          assert:
            - "the response status is 400 and error_id == ERR_INVALID_MINIMUM_LETTER"
            - "GET /hospital-safety-rating/employers returns 0 rows"

      - name: embargo_active_error_is_triggerable_and_distinct_from_window_closed
