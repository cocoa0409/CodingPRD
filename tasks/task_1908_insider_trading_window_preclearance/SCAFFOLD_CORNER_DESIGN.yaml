  # ---------------------------------------------------------------------------
  - section: cross_cutting_layers
    instances:
      - name: decision_stale_version_returns_412
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[preclearance-decision-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "A decision carrying expected_preclearance_version one behind the current version fails ERR_STALE_VERSION (412) while the request remains UNDER_REVIEW."
        test_recipe:
          setup: ["clock 2026-08-01T00:00:00Z; officer; insider policy/training current; request UNDER_REVIEW at version ${req_v2}"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: LegalAdmin
            - call: "POST /covered-persons"
              payload: { full_name: "Officer X1", email: "officer_x1@x.com", designation: "EMPLOYEE", department: "Legal" }
              as: LegalAdmin
              captures: { officer_id: $.data.id }
            - call: "POST /covered-persons"
              payload: { full_name: "Insider X1", email: "insider_x1@x.com", designation: "EMPLOYEE", department: "Ops" }
              as: LegalAdmin
              captures: { person_id: $.data.id }
            - call: "POST /attestations"
              payload: { covered_person_id: "${person_id}", kind: "POLICY_ACK", period_year: 2026, due_date: "2026-12-31T00:00:00Z" }
              as: LegalAdmin
              captures: { ack_id: $.data.id }
            - call: "POST /attestations/${ack_id}/complete"
              payload: {}
              as: Insider
              as_user_id: "${person_id}"
            - call: "POST /attestations"
              payload: { covered_person_id: "${person_id}", kind: "ANNUAL_TRAINING", period_year: 2026, due_date: "2026-12-31T00:00:00Z" }
              as: LegalAdmin
              captures: { trn_id: $.data.id }
            - call: "POST /attestations/${trn_id}/complete"
              payload: {}
              as: Insider
              as_user_id: "${person_id}"
            - call: "POST /preclearance-requests"
              payload: { covered_person_id: "${person_id}", security_ticker: "ACME", trade_side: "BUY", quantity: 10, proposed_trade_date: "2026-08-20T00:00:00Z" }
              as: Insider
              as_user_id: "${person_id}"
              captures: { req_id: $.data.id }
            - call: "POST /preclearance-requests/${req_id}/review"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "${officer_id}"
              captures: { req_v2: $.data.version }
          trigger:
            - call: "POST /preclearance-requests/${req_id}/decision"
              payload: { outcome: "APPROVE", expected_preclearance_version: "${req_v2} - 1" }
              as: ComplianceOfficer
              as_user_id: "${officer_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_STALE_VERSION"
            - "PreclearanceRequest.${req_id}.status == UNDER_REVIEW and version == ${req_v2}"

      - name: plan_create_stale_person_version_returns_412
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[plan-create-stale-person-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Creating a plan with expected_covered_person_version one behind the person's current version fails ERR_STALE_VERSION (412); no plan is persisted."
        test_recipe:
          setup: ["clock 2026-08-01T00:00:00Z; owner policy/training current; owner version captured as ${p_v}"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: LegalAdmin
            - call: "POST /covered-persons"
              payload: { full_name: "Owner X2", email: "owner_x2@x.com", designation: "EMPLOYEE", department: "Ops" }
              as: LegalAdmin
              captures: { p_id: $.data.id }
            - call: "POST /attestations"
              payload: { covered_person_id: "${p_id}", kind: "POLICY_ACK", period_year: 2026, due_date: "2026-12-31T00:00:00Z" }
              as: LegalAdmin
              captures: { ack_id: $.data.id }
            - call: "POST /attestations/${ack_id}/complete"
              payload: {}
              as: Insider
              as_user_id: "${p_id}"
            - call: "POST /attestations"
              payload: { covered_person_id: "${p_id}", kind: "ANNUAL_TRAINING", period_year: 2026, due_date: "2026-12-31T00:00:00Z" }
              as: LegalAdmin
              captures: { trn_id: $.data.id }
            - call: "POST /attestations/${trn_id}/complete"
              payload: {}
              as: Insider
              as_user_id: "${p_id}"
            - call: "GET /covered-persons/${p_id}"
              payload: {}
              as: LegalAdmin
              captures: { p_v: $.data.version }
          trigger:
            - call: "POST /tenb5-plans"
              payload: { covered_person_id: "${p_id}", security_ticker: "ACME", total_quantity: 100, first_trade_date: "2026-09-01T00:00:00Z", expected_covered_person_version: "${p_v} - 1" }
              as: Insider
              as_user_id: "${p_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_STALE_VERSION"
            - "GET /tenb5-plans?covered_person_id=${p_id} returns 0 rows"

      - name: window_extend_stale_version_returns_412
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[window-extend-stale-version]", "errors[ERR_STALE_VERSION]"]
        distinguishing_aspect: "Extending a window with expected_blackout_window_version one behind current fails ERR_STALE_VERSION (412); end_at unchanged."
        test_recipe:
          setup: ["clock 2026-08-01T00:00:00Z; officer; SCHEDULED QUARTERLY window at version ${w_v}"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: LegalAdmin
            - call: "POST /covered-persons"
              payload: { full_name: "Officer X3", email: "officer_x3@x.com", designation: "EMPLOYEE", department: "Legal" }
              as: LegalAdmin
              captures: { officer_id: $.data.id }
            - call: "POST /blackout-windows"
              payload: { kind: "QUARTERLY", fiscal_year: 2026, fiscal_quarter: "Q3", start_at: "2026-08-10T00:00:00Z", end_at: "2026-08-20T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "${officer_id}"
              captures: { w_id: $.data.id, w_v: $.data.version }
          trigger:
            - call: "POST /blackout-windows/${w_id}/extend"
              payload: { new_end_at: "2026-08-25T00:00:00Z", expected_blackout_window_version: "${w_v} - 1" }
              as: ComplianceOfficer
              as_user_id: "${officer_id}"
              captures: { err: $.data.error_id }
          assert:
            - "err == ERR_STALE_VERSION"
            - "BlackoutWindow.${w_id}.end_at == 2026-08-20T00:00:00Z"

      - name: window_extend_success_with_fresh_version
        claim_type: occ_stale_version
        grounds: ["concurrency_rules[window-extend-stale-version]", state_machines.BlackoutWindow]
        distinguishing_aspect: "The matching OCC happy path: a fresh expected_blackout_window_version extends end_at and increments version to ${w_v} + 1."
        test_recipe:
          setup: ["clock 2026-08-01T00:00:00Z; officer; SCHEDULED QUARTERLY window at version ${w_v}"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: LegalAdmin
            - call: "POST /covered-persons"
              payload: { full_name: "Officer X4", email: "officer_x4@x.com", designation: "EMPLOYEE", department: "Legal" }
              as: LegalAdmin
              captures: { officer_id: $.data.id }
            - call: "POST /blackout-windows"
              payload: { kind: "QUARTERLY", fiscal_year: 2026, fiscal_quarter: "Q3", start_at: "2026-08-10T00:00:00Z", end_at: "2026-08-20T00:00:00Z" }
              as: ComplianceOfficer
              as_user_id: "${officer_id}"
              captures: { w_id: $.data.id, w_v: $.data.version }
          trigger:
            - call: "POST /blackout-windows/${w_id}/extend"
              payload: { new_end_at: "2026-08-25T00:00:00Z", expected_blackout_window_version: "${w_v}" }
              as: ComplianceOfficer
              as_user_id: "${officer_id}"
              captures: { new_end: $.data.end_at, new_v: $.data.version }
          assert:
            - "new_end == 2026-08-25T00:00:00Z"
            - "new_v == ${w_v} + 1"

      - name: exception_expires_after_decision_window
        claim_type: scheduled_action
        grounds: [state_machines.ExceptionRequest.SUBMITTED_to_EXPIRED, calculations.sweep_recompute]
        distinguishing_aspect: "A SUBMITTED exception with no quorum is EXPIRED by the sweep once now > decision_window_end (created_at + 5 days = 2026-08-06T00:00:00Z)."
        test_recipe:
          setup: ["exception created at 2026-08-01T00:00:00Z with one APPROVE vote (no quorum); clock advanced to 2026-08-07T00:00:00Z"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: LegalAdmin
            - call: "POST /covered-persons"
              payload: { full_name: "Requester X5", email: "requester_x5@x.com", designation: "EMPLOYEE", department: "Ops" }
              as: LegalAdmin
              captures: { requester_id: $.data.id }
            - call: "POST /covered-persons"
              payload: { full_name: "Member X5", email: "member_x5@x.com", designation: "DIRECTOR", department: "Board" }
              as: LegalAdmin
              captures: { m1_id: $.data.id }
            - call: "POST /covered-persons"
              payload: { full_name: "Officer X5", email: "officer_x5@x.com", designation: "EMPLOYEE", department: "Legal" }
              as: LegalAdmin
              captures: { officer_id: $.data.id }
            - call: "POST /exception-requests"
              payload: { covered_person_id: "${requester_id}", security_ticker: "ACME", quantity: 100, hardship_reason: "hardship" }
              as: Insider
              as_user_id: "${requester_id}"
              captures: { ex_id: $.data.id }
            - call: "POST /exception-requests/${ex_id}/vote"
              payload: { vote: "APPROVE" }
              as: CommitteeMember
              as_user_id: "${m1_id}"
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-07T00:00:00Z" }
              as: LegalAdmin
          trigger:
            - call: "POST /compliance-sweeps"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "${officer_id}"
              captures: { expired_count: $.data.exceptions_expired }
          assert:
            - "ExceptionRequest.${ex_id}.decision_window_end == 2026-08-06T00:00:00Z"
            - "expired_count == 1"
            - "ExceptionRequest.${ex_id}.status == EXPIRED (a late second vote can no longer decide it)"

      - name: plan_create_supersedes_existing_draft
        claim_type: cascading_side_effects
        grounds: [state_machines.TenB5Plan.DRAFT_to_CANCELLED, "concurrency_rules[plan-create-stale-person-version]"]
        distinguishing_aspect: "Creating a second plan for the same person + ticker CANCELS the existing DRAFT plan (supersede) and increments the person's version by 1."
        test_recipe:
          setup: ["clock 2026-08-01T00:00:00Z; owner policy/training current; owner has a DRAFT plan for ACME; owner version re-read after first create"]
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: LegalAdmin
            - call: "POST /covered-persons"
              payload: { full_name: "Owner X6", email: "owner_x6@x.com", designation: "EMPLOYEE", department: "Ops" }
              as: LegalAdmin
              captures: { p_id: $.data.id }
            - call: "POST /attestations"
              payload: { covered_person_id: "${p_id}", kind: "POLICY_ACK", period_year: 2026, due_date: "2026-12-31T00:00:00Z" }
              as: LegalAdmin
              captures: { ack_id: $.data.id }
            - call: "POST /attestations/${ack_id}/complete"
              payload: {}
              as: Insider
              as_user_id: "${p_id}"
            - call: "POST /attestations"
              payload: { covered_person_id: "${p_id}", kind: "ANNUAL_TRAINING", period_year: 2026, due_date: "2026-12-31T00:00:00Z" }
              as: LegalAdmin
              captures: { trn_id: $.data.id }
            - call: "POST /attestations/${trn_id}/complete"
              payload: {}
              as: Insider
              as_user_id: "${p_id}"
            - call: "GET /covered-persons/${p_id}"
              payload: {}
              as: LegalAdmin
              captures: { p_v1: $.data.version }
            - call: "POST /tenb5-plans"
              payload: { covered_person_id: "${p_id}", security_ticker: "ACME", total_quantity: 100, first_trade_date: "2026-09-01T00:00:00Z", expected_covered_person_version: "${p_v1}" }
              as: Insider
              as_user_id: "${p_id}"
              captures: { plan1_id: $.data.id }
            - call: "GET /covered-persons/${p_id}"
              payload: {}
              as: LegalAdmin
              captures: { p_v2: $.data.version }
          trigger:
            - call: "POST /tenb5-plans"
              payload: { covered_person_id: "${p_id}", security_ticker: "ACME", total_quantity: 200, first_trade_date: "2026-10-01T00:00:00Z", expected_covered_person_version: "${p_v2}" }
              as: Insider
              as_user_id: "${p_id}"
              captures: { plan2_id: $.data.id }
          assert:
            - "TenB5Plan.${plan1_id}.status == CANCELLED (superseded)"
            - "TenB5Plan.${plan2_id}.status == DRAFT"
            - "CoveredPerson.${p_id}.version == ${p_v1} + 2 (one increment per plan creation)"

      - name: flag_cascade_and_hold_release
        claim_type: cascading_side_effects
        grounds: [state_machines.TradeConfirmation.RECEIVED_to_FLAGGED, state_machines.ViolationCase.UNFOUNDED_to_CLOSED]
        excluded_because:
          difficulty_instance: confirmation_flag_to_case_to_compliance_hold
          rationale: "The flag -> case -> hold chain is asserted by the named §1.8 instance; the release half is covered by violation_case_escalation_and_fork's UNFOUNDED branch clearing."

      - name: deal_activate_cascade
        claim_type: cascading_side_effects
        grounds: [state_machines.Deal.INTAKE_to_ACTIVE]
        excluded_because:
          difficulty_instance: deal_activate_to_entry_to_auto_deny
          rationale: "Entry creation and auto-denial hops asserted by the named §1.8 instance."

  # ---------------------------------------------------------------------------
  - section: consistency_model
    instances:
      - name: create_then_get_returns_identical_state
        claim_type: immediate_visibility
        grounds: [complexity_profile.consistency_model]
        distinguishing_aspect: "Immediate consistency: the POST response body and a subsequent GET of the same id expose identical field values with no reconciliation lag."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - call: "POST /covered-persons"
              payload: { full_name: "Consistent C", email: "consistent@x.com", designation: "EMPLOYEE", department: "Ops" }
              as: LegalAdmin
              captures: { p_id: $.data.id, p_status: $.data.status }
            - call: "GET /covered-persons/${p_id}"
              payload: {}
              as: LegalAdmin
              captures: { g_status: $.data.status, g_version: $.data.version }
          assert:
            - "p_status == g_status == ACTIVE"
            - "g_version == 1 and GET email == consistent@x.com"
