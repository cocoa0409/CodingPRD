            - "${e_variance} == ERR_ARM_VARIANCE_EXCEEDED with status 409, and Playlist.${pl_v31_id}.projected_end_variance_seconds == 31 with status still VALIDATED"
            - "the PROJECTED variance uses scheduled durations only: projected_end_utc for ${pl_v31_id} == 2026-08-03T12:30:31Z against a window end of 2026-08-03T12:30:00Z"
