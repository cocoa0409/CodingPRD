            - { call: "POST /api/destruction-records", payload: { kit_id: "${k2}", site_id: "${site}", method: "INCINERATION", facility_window_start: "2026-08-20T11:30:00Z", facility_window_end: "2026-08-20T12:30:00Z", quantity_destroyed: 10, witness_staff_id: "${p2}" }, as: Pharmacist, as_user_id: "${p1}", captures: { dr2: $.data.id } }
          assert:
            - "dr1 created (201) — first booking [10:00, 11:00] closed interval"
