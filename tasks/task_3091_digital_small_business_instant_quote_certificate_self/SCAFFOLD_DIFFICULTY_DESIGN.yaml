  # =========================================================================
  # Rule 8 — Resource temporal-overlap conflicts across different interval semantics
  # =========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: appetite_rule_window_boundary_exclusivity
        grounds:
          - entities.AppetiteRule.fields.effective_from
          - entities.AppetiteRule.fields.effective_to
          - calculations.class_of_business_determination
        distinguishing_aspect: |
          Half-open [from, to) window semantics on AppetiteRule: a quote evaluated
          at exactly effective_to does NOT match the rule (upper bound exclusive),
          while one second before it does — with the clock at to, classification
          finds no admitted class and declines.
        test_recipe:
          setup:
            - "CC_E class (GL rate 5000, rf 1.0, appetite_active) with the ONLY rule for keyword 'caterer' having effective_to 2026-10-01T00:00:00Z."
            - "Clock advanced to exactly 2026-10-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /ins/class-codes"
              payload: { code: "CC_E", description: "Catering", eligible_lines: ["GL"], base_rates_cents: { GL: 5000 }, risk_factor: 1.0, appetite_active: true }
              as: PlatformAdmin
            - call: "POST /ins/appetite-rules"
              payload: { keyword: "caterer", class_code: "CC_E", disposition: "ADMIT", effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-10-01T00:00:00Z", priority_rank: 1, is_enabled: true }
              as: PlatformAdmin
            - call: "POST /ins/business-accounts"
              payload: { legal_name: "Late Bite", contact_email: "lb@x.com", channel: "DIRECT" }
              as: Agent
              captures: { ba_lb: $.data.id }
            - call: "POST /ins/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /ins/quotes"
              payload: { business_account_id: "${ba_lb}", raw_description: "caterer for events", selected_lines: ["GL"], exposure_units: 10, requested_effective_at: "2026-10-01T00:00:00Z", uw_answers: {} }
              as: Policyholder
              as_user_id: "${ba_lb}"
              captures: { qlb_status: $.data.status }
          assert:
            - "Quote.status == DECLINED (rule window [from,to) excludes effective_to; zero admitted classes at clock == to)"

      - name: endorsement_backdating_blocked_beyond_term_start
        grounds:
          - entities.Endorsement.fields.effective_at
          - errors[ERR_ENDORSEMENT_WINDOW]
        distinguishing_aspect: |
          Day-granularity occupancy semantics on Endorsement: two endorsements may
          share the same effective day (no exclusivity), but an endorsement whose
          effective day precedes the policy term_start day is rejected — the
          interval gate is [term_start day, clock day], inclusive at both ends,
          floored to UTC days, not instants.
        test_recipe:
          setup:
            - "CC_C; ACTIVE policy bound with term_start 2026-09-01; clock 2026-09-10."
          setup_api_calls:
            - call: "POST /ins/class-codes"
              payload: { code: "CC_C", description: "Solo trades", eligible_lines: ["GL"], base_rates_cents: { GL: 10000 }, risk_factor: 0.5, appetite_active: true }
              as: PlatformAdmin
            - call: "POST /ins/appetite-rules"
              payload: { keyword: "handyman", class_code: "CC_C", disposition: "ADMIT", effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z", priority_rank: 1, is_enabled: true }
              as: PlatformAdmin
            - call: "POST /ins/business-accounts"
              payload: { legal_name: "Backdate Co", contact_email: "bd@x.com", channel: "DIRECT" }
              as: Agent
              captures: { ba_bd: $.data.id }
            - call: "POST /ins/quotes"
              payload: { business_account_id: "${ba_bd}", raw_description: "handyman", selected_lines: ["GL"], exposure_units: 10, requested_effective_at: "2026-09-01T00:00:00Z", uw_answers: {} }
              as: Policyholder
              as_user_id: "${ba_bd}"
              captures: { qbd_id: $.data.id, qbd_v: $.data.version }
            - call: "POST /ins/quotes/${qbd_id}/bind"
              payload: { expected_quote_version: "${qbd_v}" }
              as: Policyholder
              as_user_id: "${ba_bd}"
              captures: { pbd_id: $.data.id, pbd_v: $.data.version }
            - call: "POST /ins/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-10T00:00:00Z" }
              as: PlatformAdmin
          trigger:
            - call: "POST /ins/policies/${pbd_id}/endorsements"
              payload: { endorsement_type: "ADDITIONAL_INSURED", effective_at: "2026-08-31T23:59:59Z", expected_policy_version: "${pbd_v}", ai_holder_name: "Backdated Holder" }
              as: Policyholder
              as_user_id: "${ba_bd}"
              captures: { err_id: $.data.error_id }
          assert:
            - "trigger returns 422 with error_id ERR_ENDORSEMENT_WINDOW (2026-08-31 floors to a day before term_start day 2026-09-01)"

  # =========================================================================
  # Rule 9 — Compensating-action invariants across different conserved quantities
  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: earned_premium_invariant
        grounds:
          - calculations.earned_premium_reconciliation
          - calculations.midterm_proration
        distinguishing_aspect: |
          Conserved quantity: premium mass. earned + unearned must equal
          base + signed endorsement deltas at every clock position:
          55575 + 188338 == 450775 + (-206862) == 243913 after a downgrade
          endorsement; the invariant is checked on a computed read at day 303.
        test_recipe:
          setup:
            - "CC_I class (GL rate 100, rf 1.0, appetite_active), ADMIT keyword 'invariant'."
            - "Account with no signals and no claims (claims_free true throughout)."
            - "P_A bound: [GL], exposure 3650 (tier 1.30), effective 2026-09-01 -> base = round_half_up(474500*0.95) = 450775."
            - "Clock 2026-10-01 (day 273): E1 COVERAGE_ADJUST exposure 3650 -> 1825 -> new premium = round_half_up(100*1825*1.3*0.95) = 225388; delta = round_half_up((225388-450775)*335/365) = -206862."
          setup_api_calls:
            - call: "POST /ins/class-codes"
              payload: { code: "CC_I", description: "Invariant", eligible_lines: ["GL"], base_rates_cents: { GL: 100 }, risk_factor: 1.0, appetite_active: true }
              as: PlatformAdmin
            - call: "POST /ins/appetite-rules"
              payload: { keyword: "invariant", class_code: "CC_I", disposition: "ADMIT", effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z", priority_rank: 1, is_enabled: true }
              as: PlatformAdmin
            - call: "POST /ins/business-accounts"
              payload: { legal_name: "Invariant Co", contact_email: "inv@x.com", channel: "DIRECT" }
              as: Agent
              captures: { ba_in: $.data.id }
            - call: "POST /ins/quotes"
              payload: { business_account_id: "${ba_in}", raw_description: "invariant", selected_lines: ["GL"], exposure_units: 3650, requested_effective_at: "2026-09-01T00:00:00Z", uw_answers: {} }
              as: Policyholder
              as_user_id: "${ba_in}"
              captures: { qi_id: $.data.id, qi_v: $.data.version }
            - call: "POST /ins/quotes/${qi_id}/bind"
              payload: { expected_quote_version: "${qi_v}" }
              as: Policyholder
              as_user_id: "${ba_in}"
              captures: { pi_id: $.data.id, pi_v: $.data.version, pi_base: $.data.base_annual_premium_cents }
            - call: "POST /ins/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /ins/policies/${pi_id}/endorsements"
              payload: { endorsement_type: "COVERAGE_ADJUST", effective_at: "2026-10-01T00:00:00Z", expected_policy_version: "${pi_v}", new_exposure_units: 1825 }
              as: Policyholder
              as_user_id: "${ba_in}"
              captures: { ei_delta: $.data.premium_delta_cents }
          trigger:
            - call: "POST /ins/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-31T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /ins/policies/${pi_id}"
              payload: {}
              as: PlatformAdmin
              captures: { pi_earned: $.data.earned_premium_cents }
          assert:
            - "Policy.${pi_id}.base_annual_premium_cents == 450775"
            - "Endorsement E1.premium_delta_cents == -206862"
            - "Policy.${pi_id}.earned_premium_cents == 55575 (per-segment sums: round_half_up(450775*30/365) + round_half_up(225388*30/365) = 37050 + 18525)"
            - "invariant: earned (55575) + unearned (round_half_up(225388*(608-303)/365) == 188338) == 243913 == base (450775) + delta (-206862)"

      - name: account_credit_conservation_invariant
        grounds:
          - calculations.account_credit_ledger
          - entities.BusinessAccount.fields.account_credit_cents
        distinguishing_aspect: |
          Conserved quantity: monetary credit. Accruals minus consumption must
          equal the running balance exactly: accrue 206862 (downgrade) + 185758
          (short-rate cancel of a second policy) = 392620; renewal consumes
          min(392620, 225388) = 225388; final balance == 167232 == 392620 - 225388.
        test_recipe:
          setup:
            - "CC_I (GL rate 100, rf 1.0, keyword 'invariant') and CC_J (PL-only rate 200, rf 1.0, keyword 'adjunct'); account claims_free true throughout (cancellations are not claims)."
            - "P_A: CC_I [GL], exposure 3650 -> base 450775; downgrade 3650 -> 1825 at day 273 -> delta -206862 -> credit 206862."
            - "P_B: CC_J [PL], exposure 1000 (tier 1.30) -> base = round_half_up(260000*0.95) = 247000; cancelled at clock day 303 -> short-rate credit = round_half_up(247000*0.9*305/365) = 185758. Credit total = 392620."
            - "Renew P_A at clock day 548 (2027-07-03): renewal premium (final variant, claims_free true, downgrade lineage so no 3% uplift) = 225388; consumed = min(392620, 225388) = 225388; balance = 167232."
          setup_api_calls:
            - call: "POST /ins/class-codes"
              payload: { code: "CC_I", description: "Invariant", eligible_lines: ["GL"], base_rates_cents: { GL: 100 }, risk_factor: 1.0, appetite_active: true }
              as: PlatformAdmin
            - call: "POST /ins/class-codes"
              payload: { code: "CC_J", description: "Adjunct", eligible_lines: ["PL"], base_rates_cents: { PL: 200 }, risk_factor: 1.0, appetite_active: true }
              as: PlatformAdmin
            - call: "POST /ins/appetite-rules"
              payload: { keyword: "invariant", class_code: "CC_I", disposition: "ADMIT", effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z", priority_rank: 1, is_enabled: true }
              as: PlatformAdmin
            - call: "POST /ins/appetite-rules"
              payload: { keyword: "adjunct", class_code: "CC_J", disposition: "ADMIT", effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z", priority_rank: 1, is_enabled: true }
              as: PlatformAdmin
            - call: "POST /ins/business-accounts"
              payload: { legal_name: "Credit Co", contact_email: "cr@x.com", channel: "DIRECT" }
              as: Agent
              captures: { ba_cr: $.data.id }
            - call: "POST /ins/quotes"
              payload: { business_account_id: "${ba_cr}", raw_description: "invariant", selected_lines: ["GL"], exposure_units: 3650, requested_effective_at: "2026-09-01T00:00:00Z", uw_answers: {} }
              as: Policyholder
              as_user_id: "${ba_cr}"
              captures: { qa_id: $.data.id, qa_v: $.data.version }
            - call: "POST /ins/quotes/${qa_id}/bind"
              payload: { expected_quote_version: "${qa_v}" }
              as: Policyholder
              as_user_id: "${ba_cr}"
              captures: { pa_id: $.data.id, pa_v: $.data.version }
            - call: "POST /ins/quotes"
              payload: { business_account_id: "${ba_cr}", raw_description: "adjunct", selected_lines: ["PL"], exposure_units: 1000, requested_effective_at: "2026-09-01T00:00:00Z", uw_answers: {} }
              as: Policyholder
              as_user_id: "${ba_cr}"
              captures: { qb_id: $.data.id, qb_v: $.data.version }
            - call: "POST /ins/quotes/${qb_id}/bind"
              payload: { expected_quote_version: "${qb_v}" }
              as: Policyholder
              as_user_id: "${ba_cr}"
              captures: { pb_id: $.data.id }
            - call: "POST /ins/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /ins/policies/${pa_id}/endorsements"
              payload: { endorsement_type: "COVERAGE_ADJUST", effective_at: "2026-10-01T00:00:00Z", expected_policy_version: "${pa_v}", new_exposure_units: 1825 }
              as: Policyholder
              as_user_id: "${ba_cr}"
            - call: "POST /ins/_clock/set_current_utc"
              payload: { to_iso8601: "2026-10-31T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /ins/policies/${pb_id}/cancel"
              payload: {}
              as: Policyholder
              as_user_id: "${ba_cr}"
            - call: "GET /ins/business-accounts/${ba_cr}"
              payload: {}
              as: Policyholder
              as_user_id: "${ba_cr}"
              captures: { cr_pre: $.data.account_credit_cents }
            - call: "POST /ins/_clock/set_current_utc"
              payload: { to_iso8601: "2027-07-03T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /ins/policies/${pa_id}"
              payload: {}
              as: Policyholder
              as_user_id: "${ba_cr}"
              captures: { pa_v2: $.data.version }
          trigger:
            - call: "POST /ins/policies/${pa_id}/renew"
              payload: { expected_policy_version: "${pa_v2}" }
              as: Policyholder
              as_user_id: "${ba_cr}"
              captures: { pa2_base: $.data.base_annual_premium_cents }
            - call: "GET /ins/business-accounts/${ba_cr}"
              payload: {}
              as: Policyholder
              as_user_id: "${ba_cr}"
              captures: { cr_post: $.data.account_credit_cents }
          assert:
            - "pre-renewal account_credit_cents == 392620 (206862 downgrade + 185758 short-rate cancel)"
            - "successor policy base_annual_premium_cents == 225388 (final variant; claims_free still true — cancellation is not a claim; uplift does not apply to downgrade lineage)"
            - "post-renewal account_credit_cents == 167232 == 392620 - 225388 (conserved: accruals - consumption == balance)"
