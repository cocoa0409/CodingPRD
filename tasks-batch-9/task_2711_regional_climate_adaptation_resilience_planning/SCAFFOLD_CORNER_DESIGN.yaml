        distinguishing_aspect: "Ranking an asset whose only VulnerabilityAssessment is still DRAFT returns 409 ERR_NO_ASSESSED_VULNERABILITY, so the input set is filtered on assessment status rather than on mere existence of a row."
        test_recipe:
