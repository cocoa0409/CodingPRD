      - name: each_error_id_is_pinned_to_exactly_one_http_status
        claim_type: error_response_shape
        grounds:
          - errors["ERR_SURVEY_WINDOW_INVALID"]
          - errors["ERR_SURVEY_WINDOW_CONFLICT"]
          - errors["ERR_INSUFFICIENT_BANK_CREDITS"]
          - errors["ERR_BANK_NOT_ELIGIBLE"]
        distinguishing_aspect: >-
          Status is a property of the ERROR ID, not of the endpoint or of the
          field involved: two rejections of the same survey_window pair split
          422 / 409, and two rejections of the same commitment body split
          422 / 409 in the opposite direction. Nothing about "which field was
          wrong" predicts the status, so the mapping has to be carried per id.
        test_recipe:
          setup:
            - "Canonical fixture up to a DRAFT plan; the Mojave bank holds 500.00 credits and a second Vireo Riparian Bank covers SP-T."
            - "PD1 of action 1 already holds a FIELD_SURVEY window 2026-05-04..2026-05-08 on CHU-1."
            - "A second action in SCREENING is available for the survey-window probes, since branch A of the interval rule compares across actions."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: {to_iso8601: "2026-10-01T00:00:00Z"}
              as: WildlifeAgency
              as_user_id: "fws-user-registrar"
            - call: "POST /species"
              payload: {scientific_name: "Gopherus agassizii", common_name: "Desert tortoise", listing_status: "ENDANGERED", take_authorization_unit: "INDIVIDUALS", take_density_per_acre: 0.40, recovery_unit_population: 4000, survey_season_start_month: 4, survey_season_end_month: 7}
              as: WildlifeAgency
              as_user_id: "fws-user-registrar"
