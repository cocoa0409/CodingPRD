            - "FeatureMapping.${map_id}.self_review_status == PASSED"
            - "AppRecord.${app_id}.feature_compliance_index == 100.00"
            - "AppRecord.${app_id}.compliance_posture == OPEN"
            - "AppRecord.${app_id}.posture_reason_codes == []"
            - "PublisherAccount.${acct_id}.rejection_strike_count == 0"
            - "PublisherAccount.${acct_id}.standing_score_rolling_365 == 98.00"
            - "PublisherAccount.${acct_id}.standing_score_lifetime == 98.00"
            - "ReviewCapacityWindow.${win_id}.slots_reserved == 0 and slots_consumed == 1 and slots_available == 4"

      - name: approve_moves_in_review_to_approved_without_touching_standing
        claim_type: Valid Transition
        grounds:
          - state_machines.Submission.transitions.IN_REVIEW_to_APPROVED
          - endpoints.POST_/submissions/{id}/decision
        distinguishing_aspect: "APPROVE with no rejection_reasons leaves both standing variants at 100.00 and the posture OPEN, sets decided_at to the clock and leaves rejected_at null, while still moving the window slot from reserved to consumed."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z. Submission build 100 IN_REVIEW claimed by rev-01."
            - "disclosure_accuracy_score_final == 1.0000 (>= 0.9500), derived_age_rating 0 <= attested 4, no BehaviorFinding rows, no SUBMITTED commerce items, no ImpactAssessment."
          setup_api_calls:
            - *c_clock
            - *c_acct
            - *c_cert
            - *c_acct_reread
