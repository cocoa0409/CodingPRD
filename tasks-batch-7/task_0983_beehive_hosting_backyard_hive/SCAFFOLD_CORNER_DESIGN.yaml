        grounds: ["errors[ERR_SUBSCRIPTION_NOT_ACTIVE]", state_machines.Subscription]
        distinguishing_aspect: "CANCELLED is terminal: a change-plan with the correct current version still fails the state check with ERR_SUBSCRIPTION_NOT_ACTIVE."
        test_recipe:
          setup: ["host ACTIVE; BASIC subscription; invoice paid; subscription cancelled (version captured from the cancel response)"]
          setup_api_calls:
            - { call: "POST /api/hosts", payload: { full_name: "Cxl Host", email: "cxl@x.com" }, as: Anonymous, captures: { h: $.data.id } }
            - { call: "POST /api/hosts/${h}/sign-waiver", payload: { waiver_version: "W-2026" }, as: Host, as_user_id: "${h}" }
            - { call: "POST /api/subscriptions", payload: { host_id: "${h}", plan: "BASIC" }, as: PlatformOps, captures: { sub: $.data.id } }
            - { call: "GET /api/invoices", payload: { subscription_id: "${sub}" }, as: PlatformOps, captures: { inv1: "$.data[0].id" } }
            - { call: "POST /api/invoices/${inv1}/pay", payload: {}, as: Host, as_user_id: "${h}" }
