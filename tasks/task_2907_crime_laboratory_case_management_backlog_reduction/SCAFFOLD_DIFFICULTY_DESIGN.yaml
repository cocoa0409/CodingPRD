            - call: "POST /lab/cases"
              payload: { agency_case_number: "B-2026-1616", submitting_agency: "METRO PD", offense_category: "BURGLARY", suspect_in_custody: false }
              as: EvidenceTechnician
              captures: { c1: $.data.id }
            - call: "POST /lab/evidence-items"
              payload: { case_id: "${c1}", item_number: "1", item_description: "Sealed mobile handset", item_type: "DIGITAL_DEVICE", seal_intact: true }
              as: EvidenceTechnician
