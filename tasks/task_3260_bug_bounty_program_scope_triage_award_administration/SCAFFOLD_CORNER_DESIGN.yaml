        distinguishing_aspect: "OCC on Program.version: two sequential PATCHes carrying the same observed version — the first succeeds (version 1 -> 2), the second is rejected 412 ERR_STALE_VERSION."
        test_recipe:
          setup: ["program P created (version 1)"]
          setup_api_calls:
            - call: "POST /api/programs"
              payload: { name: "P", bounty_pool_cents: 5000000, min_reputation: 0, response_sla_hours: 72, resolution_sla_days: 30, disclosure_window_days: 30 }
              as: PlatformAdmin
              captures: { prog: $.data.id, prog_v: $.data.version }
          trigger:
            - call: "PATCH /api/programs/${prog}"
              payload: { expected_program_version: "${prog_v}", response_sla_hours: 48 }
              as: ProgramAdmin
            - call: "PATCH /api/programs/${prog}"
              payload: { expected_program_version: "${prog_v}", response_sla_hours: 24 }
              as: ProgramAdmin
              captures: { err: $.data.error_id }
          assert:
