          rationale: "That §1.8 instance drives production before disclosure and disclosure before production on two sibling orders and asserts both dimensions converge to the same pair, which is exactly the parallel-shape independence claim."

      - name: production_start_on_a_placed_order_is_rejected_as_invalid_order_state
        claim_type: invalid_transitions
        grounds:
          - state_machines.Order.fulfillment_status.ZONE_CLEARED_to_IN_PRODUCTION
          - validations.priority_12
          - errors.ERR_INVALID_ORDER_STATE
        distinguishing_aspect: "START is declared only from {ZONE_CLEARED, REMAKE_QUEUED}, so calling it on a PLACED order that has not passed the zone gate fails with ERR_INVALID_ORDER_STATE (409) and the order stays PLACED."
        test_recipe:
          setup:
            - "A store with an ACTIVE zone version, one IN_ZONE address and one order still in PLACED."
