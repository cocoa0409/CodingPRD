              as_user_id: "cm-001"
              captures: { apt_total_after_412: "$.meta.total_count" }
            - call: "POST /udrp/cases/${case_id}/fee-transactions"
              payload: { kind: "FILING_FEE", payer: "COMPLAINANT", amount_cents: 125000, reference: "WIRE-9040-TOPUP" }
              as: CaseManager
              as_user_id: "cm-001"
            - call: "POST /udrp/cases/${case_id}/fee-transactions"
              payload: { kind: "PANEL_SUPPLEMENT", payer: "RESPONDENT", amount_cents: 125000, reference: "WIRE-9040-SUPP" }
              as: CaseManager
              as_user_id: "cm-001"
            - call: "GET /udrp/cases/${case_id}"
              payload: {}
              as: CaseManager
              as_user_id: "cm-001"
              captures: { cv_now: "$.data.version", paid_now: "$.data.paid_cents" }
            - call: "POST /udrp/cases/${case_id}/appointments"
              payload: { seat: "PRESIDING", nominated_by: "PROVIDER", expected_case_version: "${cv_now}", panelist_id: "${pan_id}" }
              as: CaseManager
              as_user_id: "cm-001"
              captures: { apt_id: "$.data.id", apt_seat: "$.data.seat", apt_status: "$.data.status" }
            - call: "GET /udrp/cases/${case_id}"
              payload: {}
              as: CaseManager
              as_user_id: "cm-001"
              captures: { cv_after_write: "$.data.version" }
          assert:
            - "Before the response the case reports required_seat_count 1 and assessed_fee_cents 150000"
            - "After the three-member election required_seat_count is 3, assessed_fee_cents is 400000 and version is strictly greater than ${cv_pre}"
            - "The nomination carrying ${cv_pre} returns HTTP 412 with data.error_id == 'ERR_STALE_CASE_VERSION', reported at priority 45 and therefore before the seat-vocabulary check at 63 could ever comment on PRESIDING"
            - "GET /udrp/appointments?case_id=${case_id} reports meta.total_count 0 immediately after the 412 - a refused nomination writes no row"
            - "Once the 125000 top-up and the 125000 respondent supplement bring paid_cents to 400000, the nomination carrying the freshly read version succeeds with HTTP 201, seat PRESIDING and status NOMINATED"
            - "Case.version is strictly greater after the accepted nomination than the ${cv_now} it was given, so every accepted write advances the occ field"

      - name: decision_draft_refuses_a_case_version_read_before_a_seat_replacement
        claim_type: optimistic_concurrency
        grounds:
