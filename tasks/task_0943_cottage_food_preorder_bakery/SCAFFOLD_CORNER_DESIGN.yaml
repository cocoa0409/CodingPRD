      - name: component_referencing_a_recalled_lot_is_rejected
        claim_type: violation_to_error
        grounds:
          - validations[priority=27]
          - errors[ERR_LOT_RECALLED]
          - state_machines.IngredientLot.RECEIVED_to_RECALLED
        distinguishing_aspect: "Priority 27 rejects any component that references a RECALLED IngredientLot with ERR_LOT_RECALLED; recalling a lot that was never RELEASED terminates the cascade at hop 2 with no batch, order or label touched."
        test_recipe:
          setup:
            - "An ACTIVE baker with a DRAFT recipe and one ingredient lot that has been recalled straight from RECEIVED."
          setup_api_calls:
            - call: "POST /bakery/bakers"
              payload: { display_name: "Hearth and Crumb", jurisdiction_code: "CA-ALAMEDA", payout_period_start: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { baker_id: $.data.id }
            - call: "POST /bakery/bakers/${baker_id}/permit-status"
              payload: { to_status: "ACTIVE" }
              as: PlatformAdmin
            - call: "POST /bakery/ingredient-lots"
              payload: { baker_id: "${baker_id}", lot_code: "BAD-1", received_at: "2026-04-20T00:00:00Z", expires_at: "2026-12-01T00:00:00Z", allergens: ["wheat"] }
              as: Baker
              as_user_id: "${baker_id}"
              captures: { lot_bad: $.data.id }
            - call: "POST /bakery/recipes"
              payload: { baker_id: "${baker_id}", name: "Brown Butter Cookie" }
              as: Baker
              as_user_id: "${baker_id}"
              captures: { r_cookie: $.data.id }
            - call: "POST /bakery/ingredient-lots/${lot_bad}/recall"
              payload: { recall_reason: "supplier withdrew the lot before release" }
              as: PlatformAdmin
              captures: { lot_st: $.data.lot_status }
          trigger:
            - call: "POST /bakery/recipes/${r_cookie}/components"
              payload: { component_name: "recalled flour", quantity_grams: 500, declared_allergens: ["wheat"], ingredient_lot_id: "${lot_bad}" }
              as: Baker
              as_user_id: "${baker_id}"
              captures: { err: $.data.error_id }
          assert:
            - "${lot_st} == RECALLED"
            - "${err} == ERR_LOT_RECALLED with HTTP 409"
            - "GET /bakery/recipe-components with recipe_id ${r_cookie} returns 0 components"
            - "GET /bakery/batches with recipe_id ${r_cookie} returns 0 batches, so the cascade never reached hop 3"

      - name: self_referential_sub_recipe_is_rejected_as_a_cycle
        claim_type: violation_to_error
        grounds:
          - validations[priority=28]
          - errors[ERR_RECIPE_CYCLE_DETECTED]
          - entities.RecipeComponent.fields.sub_recipe_id
        distinguishing_aspect: "A component whose sub_recipe_id equals its own recipe_id makes the closure cyclic, so priority 28 returns ERR_RECIPE_CYCLE_DETECTED with HTTP 422 and the component is not persisted."
        test_recipe:
          setup:
            - "An ACTIVE baker with one DRAFT recipe and no components."
          setup_api_calls:
            - call: "POST /bakery/bakers"
              payload: { display_name: "Hearth and Crumb", jurisdiction_code: "CA-ALAMEDA", payout_period_start: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { baker_id: $.data.id }
            - call: "POST /bakery/bakers/${baker_id}/permit-status"
              payload: { to_status: "ACTIVE" }
              as: PlatformAdmin
            - call: "POST /bakery/recipes"
              payload: { baker_id: "${baker_id}", name: "Self Referential Dough" }
              as: Baker
              as_user_id: "${baker_id}"
              captures: { r_self: $.data.id }
          trigger:
            - call: "POST /bakery/recipes/${r_self}/components"
              payload: { component_name: "itself", quantity_grams: 10, sub_recipe_id: "${r_self}" }
              as: Baker
              as_user_id: "${baker_id}"
              captures: { err: $.data.error_id }
          assert:
            - "${err} == ERR_RECIPE_CYCLE_DETECTED with HTTP 422"
            - "GET /bakery/recipe-components with recipe_id ${r_self} returns 0 components"
            - "Recipe.${r_self}.tree_depth == 1 and Recipe.${r_self}.recipe_status == DRAFT"

      - name: anaphylactic_avoidance_hard_blocks_even_with_acknowledgement
        claim_type: priority_ordering
        grounds:
          - validations[priority=29]
          - validations[priority=30]
          - calculations.allergen_gate
          - errors[ERR_ALLERGEN_HARD_BLOCK]
          - errors[ERR_ALLERGEN_ACK_REQUIRED]
        distinguishing_aspect: "For a customer avoiding milk at severity ANAPHYLACTIC and wheat at severity INTOLERANCE, priority 29 fires first and returns ERR_ALLERGEN_HARD_BLOCK even when allergen_ack is true, so ERR_ALLERGEN_ACK_REQUIRED at priority 30 is never reached."
