          - state_machines.Subscription."(none)_to_PENDING_ACTIVATION"
        distinguishing_aspect: |
          Entity pair 1 of 3 — Subscription depends on Terminal: the Subscription creation transition
          is legal on the ServiceOrder side (RESERVED, unexpired) yet is refused because the named
          Terminal sits in DELIVERED rather than INSTALLED, returning ERR_TERMINAL_NOT_INSTALLED (409).
