              as: PharmacyOperations
              captures: { pt_id: $.data.id }
            - call: "POST /pharmacy/prescriptions"
              payload: { patient_id: "${pt_id}", prescriber_npi: "1487654321", drug_name: "Metformin ER", ndc: "00093-1049-01", strength: "500mg", form: "TABLET", copay_tier: "GENERIC", dose_times: ["MORNING"], quantity_per_dose: 1, days_supply_written: 30, refills_authorized: 3, written_date: "2026-05-01", expiration_date: "2027-05-01" }
              as: Prescriber
              captures: { rx1: $.data.id }
            - call: "POST /pharmacy/vacation-exceptions"
              payload: { patient_id: "${pt_id}", travel_start_date: "2026-08-20", travel_end_date: "2026-08-27", requested_extra_days: 5 }
              as: Patient
              as_user_id: "${pt_id}"
              captures: { vac_1: $.data.id }
            - call: "POST /pharmacy/vacation-exceptions/${vac_1}/decide"
              payload: { decision: "APPROVE_PHARMACIST", approved_extra_days: 3 }
              as: VerifyingPharmacist
              as_user_id: "rph-01"
              captures: { first_status: $.data.status, granted: $.data.approved_extra_days }
          trigger:
            - call: "POST /pharmacy/vacation-exceptions/${vac_1}/decide"
              payload: { decision: "APPROVE_PHARMACIST", approved_extra_days: 5 }
              as: VerifyingPharmacist
              as_user_id: "rph-01"
              captures: { err_reapprove: $.data.error_id }
            - call: "POST /pharmacy/vacation-exceptions/${vac_1}/decide"
