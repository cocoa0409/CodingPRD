            - "Trigger step 6: the facility is at version 2 — every successful write bumps its own row's version, and only that row's"

      - name: the_cycle_counters_reconcile_after_a_score_a_withdrawal_and_an_allocation
        claim_type: derived_field_reconciliation
        grounds:
          - entities.CapitalCycle.scored_count
          - entities.CapitalCycle.expedited_count
          - entities.CapitalCycle.allocation_count
          - endpoints[POST /capital/requests/{id}/withdraw]
