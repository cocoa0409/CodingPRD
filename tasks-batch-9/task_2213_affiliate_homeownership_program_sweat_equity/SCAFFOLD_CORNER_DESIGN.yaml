      - name: the_logical_clock_refuses_a_repeated_or_backward_instant
        claim_type: violation_to_error
        grounds: ["validations[priority=44]", errors.ERR_CLOCK_MUST_ADVANCE, "endpoints.POST /_clock/set_current_utc"]
        distinguishing_aspect: "The clock is strictly monotonic, not merely non-decreasing: re-sending the instant it already holds is refused with the same error as sending an earlier instant, and a one-millisecond step forward is accepted — which pins the comparator as > rather than >=."
        setup_note: "The payload field is current_utc, the name the §1.5 input declares; priority 44's prose calls it to_iso8601. The endpoint's declared input is authoritative here."
        test_recipe:
          setup:
            - "A bare program exists so the ProgramAdmin fixture is meaningful. The logical clock stands at its initial 2026-08-01T00:00:00.000Z and has been advanced once to 2026-08-05T00:00:00.000Z."
          setup_api_calls:
            - { call: "POST /homeownership/programs", payload: { affiliate_name: "Ridgeline Habitat", service_area_code: "TRAVIS", ami_median_income_cents: 6000000, subsidy_pool_cents: 5000000, sweat_equity_base_hours_required: 12, committee_quorum: 2 }, as: ProgramAdmin, as_user_id: "admin-1" }
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-05T00:00:00.000Z" }, as: ProgramAdmin, as_user_id: "admin-1" }
          trigger:
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-05T00:00:00.000Z" }, as: ProgramAdmin, as_user_id: "admin-1", captures: { e_same: $.data.error_id } }
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-01T00:00:00.000Z" }, as: ProgramAdmin, as_user_id: "admin-1", captures: { e_back: $.data.error_id } }
            - { call: "POST /_clock/set_current_utc", payload: { current_utc: "2026-08-05T00:00:00.001Z" }, as: ProgramAdmin, as_user_id: "admin-1" }
          assert:
            - "Re-sending the current instant: HTTP 422 and ${e_same} == ERR_CLOCK_MUST_ADVANCE"
            - "Sending an earlier instant: HTTP 422 and ${e_back} == ERR_CLOCK_MUST_ADVANCE"
            - "Sending one millisecond later: HTTP 200 and the clock now reads 2026-08-05T00:00:00.001Z"

      # --- validations corners already owned by a §1.8 depth instance ------------
      - name: committee_quorum_shortfall_blocks_the_selection_decision
        claim_type: violation_to_error
        grounds: ["validations[priority=15]", errors.ERR_COMMITTEE_QUORUM_NOT_MET]
        excluded_because:
          difficulty_instance: willingness_review_set_two_then_one_then_empty_collection_edge
          rationale: "That instance walks the review collection down from two reviewers to one to none and asserts ERR_COMMITTEE_QUORUM_NOT_MET at the point the distinct-reviewer count falls under committee_quorum, which is exactly this row's violation case."

      - name: a_frozen_program_blocks_downstream_writes
        claim_type: violation_to_error
        grounds: ["validations[priority=12]", errors.ERR_PROGRAM_FROZEN]
        excluded_because:
          difficulty_instance: frozen_program_priority_12_beats_subsidy_exhaustion_priority_38
          rationale: "The depth instance stages a SUSPENDED program against an approval that would also exhaust the pool and asserts the priority 12 error wins, which subsumes the plain violation case for this row."

      - name: approval_beyond_the_available_subsidy_is_refused
        claim_type: violation_to_error
        grounds: ["validations[priority=38]", errors.ERR_SUBSIDY_POOL_EXHAUSTED]
        excluded_because:
          difficulty_instance: subsidy_available_one_cent_below_versus_exactly_equal_to_silent_second
          rationale: "That instance already probes both sides of the approve comparator, taking the one-cent-short case to ERR_SUBSIDY_POOL_EXHAUSTED and the exactly-equal case to a successful approval."

      - name: one_officer_cannot_structure_and_approve_the_same_loan
        claim_type: violation_to_error
        grounds: ["validations[priority=18]", errors.ERR_SEGREGATION_OF_DUTIES]
        excluded_because:
          difficulty_instance: segregation_priority_18_beats_subsidy_exhaustion_priority_38
          rationale: "The depth instance has officer-1 attempt the approval of the loan officer-1 structured while the pool is simultaneously short, and asserts ERR_SEGREGATION_OF_DUTIES is returned ahead of the pool error."

      - name: an_expired_waiver_blocks_a_seat
        claim_type: violation_to_error
        grounds: ["validations[priority=28]", errors.ERR_WAIVER_EXPIRED]
        excluded_because:
          difficulty_instance: waiver_expiry_priority_28_beats_volunteer_double_booking_priority_29
          rationale: "That instance stages a volunteer whose waiver has lapsed AND who is already booked on an overlapping shift, and asserts ERR_WAIVER_EXPIRED, covering this row's violation case."

      - name: overlapping_shifts_on_one_site_are_refused
        claim_type: violation_to_error
        grounds: ["validations[priority=29]", errors.ERR_SITE_SHIFT_BUFFER_CONFLICT]
        excluded_because:
          difficulty_instance: overlap_site_closed_60min_cleanup_buffer_exact_abutment
          rationale: "The depth instance walks the closed 60-minute cleanup buffer to its exact abutment on both sides, which covers both the violation and the satisfaction case for this row."

      - name: closing_requires_a_completed_build_site
        claim_type: violation_to_error
        grounds: ["validations[priority=37]", errors.ERR_SITE_NOT_COMPLETED]
        excluded_because:
          difficulty_instance: mortgage_close_blocked_until_build_site_leaves_safety_hold_and_completes
          rationale: "That instance attempts the close while the site sits at SAFETY_HOLD and then again after FINAL_INSPECTION, so both the ERR_SITE_NOT_COMPLETED violation and its release are already pinned."

  # ===========================================================================
  # SECTION 5 — From Table 5 (Endpoints)
  # The endpoint-pattern rows the earlier sections did not already consume:
  # the one computed read, the one bulk action, a standard CRUD round trip
  # with filtering and pagination, and a conditional action.
  # ===========================================================================
  - section: endpoints
    instances:

      - name: structure_preview_is_a_pure_read_that_predicts_the_underwriting
        claim_type: computed_read
        grounds: [calculations.affordable_payment_structure, "endpoints.GET /homeownership/mortgage-applications/{id}/structure-preview", "endpoints.POST /homeownership/mortgage-applications/{id}/submit-underwriting", entities.MortgageApplication.fields.silent_second_amount_cents, "state_machines.MortgageApplication.status.DRAFT_to_UNDERWRITING"]
        distinguishing_aspect: "The preview must run the pinned forward pass without touching the row: on a DRAFT application it already reports the escrow, payment, term tier, principal and silent second that submit-underwriting will later persist, and the application's status and version are unchanged by the read. Calling it again after underwriting returns the identical figures, proving the preview reads the same snapshots the writer used."
        test_recipe:
          setup:
            - "Canonical program, a SELECTED household verifying 3000000 annual income, and a site appraised at 15000000. A DRAFT mortgage application pins income_basis_annual_cents 3000000 and appraised_value_cents 15000000."
          setup_api_calls:
            - { call: "POST /homeownership/programs", payload: { affiliate_name: "Ridgeline Habitat", service_area_code: "TRAVIS", ami_median_income_cents: 6000000, subsidy_pool_cents: 5000000, sweat_equity_base_hours_required: 12, committee_quorum: 2 }, as: ProgramAdmin, as_user_id: "admin-1", captures: { prog_id: $.data.id } }
            - { call: "POST /homeownership/build-sites", payload: { program_id: "${prog_id}", parcel_number: "P-1001", street_address: "12 Cedar Ln", acquisition_cost_cents: 4000000, appraised_value_cents: 15000000 }, as: ProgramAdmin, as_user_id: "admin-1", captures: { site_id: $.data.id } }
            - { call: "POST /homeownership/households", payload: { program_id: "${prog_id}", household_name: "Alvarez", household_size: 4, current_bedroom_count: 1, habitability_deficiency_count: 3, self_reported_annual_income_cents: 3600000, self_reported_housing_cost_cents: 150000, monthly_debt_payment_cents: 30000, credit_score: 640, on_time_housing_payment_months: 24 }, as: FamilyServicesCoordinator, as_user_id: "fsc-1", captures: { hh_id: $.data.id } }
            - { call: "POST /homeownership/household-members", payload: { household_id: "${hh_id}", full_name: "Rosa Alvarez", relationship: "APPLICANT", birth_date: "1985-03-15T00:00:00.000Z", is_adult_occupant: true }, as: FamilyServicesCoordinator, as_user_id: "fsc-1" }
            - { call: "POST /homeownership/households/${hh_id}/submit", payload: { attestation_signed: true }, as: FamilyServicesCoordinator, as_user_id: "fsc-1" }
            - { call: "POST /homeownership/households/${hh_id}/screen", payload: { income_documents_received: true, verified_annual_income_cents: 3000000, verified_housing_cost_cents: 100000 }, as: FamilyServicesCoordinator, as_user_id: "fsc-1" }
            - { call: "POST /homeownership/households/${hh_id}/committee-referral", payload: { referral_memo: "File verified, referred to committee" }, as: FamilyServicesCoordinator, as_user_id: "fsc-1" }
            - { call: "POST /homeownership/selection-reviews", payload: { household_id: "${hh_id}", dimension: "NEED", score: 80, recommendation: "ADVANCE" }, as: SelectionCommitteeMember, as_user_id: "committee-alice" }
            - { call: "POST /homeownership/selection-reviews", payload: { household_id: "${hh_id}", dimension: "ABILITY", score: 80, recommendation: "ADVANCE" }, as: SelectionCommitteeMember, as_user_id: "committee-alice" }
            - { call: "POST /homeownership/selection-reviews", payload: { household_id: "${hh_id}", dimension: "WILLINGNESS", score: 80, recommendation: "ADVANCE" }, as: SelectionCommitteeMember, as_user_id: "committee-alice" }
            - { call: "POST /homeownership/selection-reviews", payload: { household_id: "${hh_id}", dimension: "NEED", score: 80, recommendation: "ADVANCE" }, as: SelectionCommitteeMember, as_user_id: "committee-bruno" }
            - { call: "POST /homeownership/selection-reviews", payload: { household_id: "${hh_id}", dimension: "ABILITY", score: 80, recommendation: "ADVANCE" }, as: SelectionCommitteeMember, as_user_id: "committee-bruno" }
            - { call: "POST /homeownership/selection-reviews", payload: { household_id: "${hh_id}", dimension: "WILLINGNESS", score: 80, recommendation: "ADVANCE" }, as: SelectionCommitteeMember, as_user_id: "committee-bruno" }
            - { call: "POST /homeownership/households/${hh_id}/selection-decision", payload: { decision_minutes: "Committee minutes 2026-08-01: household selected for partnership" }, as: ProgramAdmin, as_user_id: "admin-1" }
            - { call: "GET /homeownership/households/${hh_id}", as: MortgageOfficer, as_user_id: "officer-1", captures: { hh_v: $.data.version } }
            - { call: "POST /homeownership/mortgage-applications", payload: { household_id: "${hh_id}", build_site_id: "${site_id}", expected_household_version: "${hh_v}", term_months: 240 }, as: MortgageOfficer, as_user_id: "officer-1", captures: { app_id: $.data.id, app_v0: $.data.version } }
          trigger:
            - { call: "GET /homeownership/mortgage-applications/${app_id}/structure-preview", as: MortgageOfficer, as_user_id: "officer-1" }
            - { call: "GET /homeownership/mortgage-applications/${app_id}", as: MortgageOfficer, as_user_id: "officer-1", captures: { app_v1: $.data.version } }
            - { call: "POST /homeownership/mortgage-applications/${app_id}/submit-underwriting", payload: {}, as: MortgageOfficer, as_user_id: "officer-1" }
            - { call: "GET /homeownership/mortgage-applications/${app_id}/structure-preview", as: ProgramAdmin, as_user_id: "admin-1" }
          assert:
            - "Preview on the DRAFT row: HTTP 200, response_type == object, reporting escrow_monthly_cents 20625 (tax round(15000000 * 0.0125 / 12) == 15625 plus insurance round(max(60000, 52500) / 12) == 5000), affordable_pi_payment_cents 54375 (floor(250000 * 0.30) == 75000 minus 20625), term_months 240 because 54375 * 360 == 19575000 is at or above round(0.90 * 15000000) == 13500000, first_mortgage_principal_cents 13050000 and silent_second_amount_cents 1950000"
            - "Application re-read after the preview: status is still DRAFT, silent_second_amount_cents is still null and ${app_v1} == ${app_v0} — the computed read wrote nothing"
            - "submit-underwriting: HTTP 200 with status == UNDERWRITING and the persisted escrow_monthly_cents 20625, affordable_pi_payment_cents 54375, term_months 240, first_mortgage_principal_cents 13050000, silent_second_amount_cents 1950000 — identical to what the preview predicted"
            - "Preview again after underwriting, read by ProgramAdmin: the same five figures, unchanged"

      - name: bulk_promotion_is_clamped_by_site_capacity_without_a_partial_error
