              captures: { err: $.data.error_id }
          assert:
            - "first create succeeded (captured ${fs1})"
            - "second create with stale version -> error_id ERR_STALE_CLIENT_VERSION, HTTP 412 (captured ${err})"

      - name: order_version_increments_on_cascade_side_effect
        claim_type: derived_field_reconciliation
        grounds: ["entities.AppraisalOrder", "state_machines.AppraisalOrder.ASSIGNED_to_INSPECTION_SCHEDULED"]
        distinguishing_aspect: "A system-side cascade (appointment confirm -> order INSPECTION_SCHEDULED) increments the parent's version by exactly 1 and refreshes updated_at, observable across two sequential GETs."
        test_recipe:
          setup: ["inspection order ASSIGNED to A with PROPOSED appointment; order version captured before confirm"]
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: FirmAdmin }
            - call: "POST /appraisal/clients"
              payload: { name: "C", client_type: AMC, contact_email: "c@x.example", default_turn_time_days: 7 }
              as: FirmAdmin
              captures: { c_id: $.data.id, c_v: $.data.version }
            - call: "POST /appraisal/fee-schedules"
              payload: { client_id: "${c_id}", complexity_tier: STANDARD, base_fee_cents: 45000, rush_multiplier_bps: 1500, revision_fee_cents: 15000, effective_from: "2026-07-01T00:00:00Z", expected_client_version: "${c_v}" }
              as: FirmAdmin
            - call: "POST /appraisal/appraisers"
