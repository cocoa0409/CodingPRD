    side_effects: ["set check_out_time = clock", "compute actual_hours/gross_pay_cents", "accrue worker payroll + one-time stipend", "recompute place.total_payroll_cents", "status CHECKED_IN -> CHECKED_OUT", "increments Shift.version by 1"]

  - method: POST
