              captures: { p2: $.data.id }
            - call: "POST /plans/${p2}/forecasts"
              payload: { scenario_tag: "BASE", forecast_year: 2030, residential_mw: 10, commercial_mw: 0, industrial_mw: 0, electrification_mw: 0 }
              as: UtilityPlanner
            - call: "POST /plans/${p2}/portfolios"
              payload: { portfolio_name: "PF-W2", preferred_flag: true }
              as: UtilityPlanner
            - call: "POST /plans/${p2}/open-comment"
              payload: {}
              as: UtilityPlanner
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-31T00:00:00Z" }
              as: UtilityPlanner
          trigger:
            - call: "POST /plans/${p1}/comments"
              payload: { commenter_name: "On Time", commenter_email: "on@example.org", body: "Filed on the closing date." }
              as: PublicCommenter
              captures: { c1: $.data.status }
            - call: "POST /plans/${p1}/submit-for-review"
              payload: {}
              as: UtilityPlanner
              captures: { s1: $.data.status }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
