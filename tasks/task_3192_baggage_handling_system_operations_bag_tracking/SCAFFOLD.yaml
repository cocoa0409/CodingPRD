    roles: [Screener]
    code: 201
    input: [bag_id, lane_id, start_utc, "alarm_code?"]
    output: ScreeningEvent
    side_effects:
      - "end_utc = start_utc + 20m; the window is the half-open interval [start_utc, end_utc)"
      - "status=IN_PROGRESS then immediately CLEARED when alarm_code is null, ALARMED otherwise"
      - "an alarm sets the bag's screening_status to ALARMED and drops its custody_status to HELD"
      - "screening_lane.last_event_end_utc recomputed"

  - method: GET
    path: "/baggage/screenings/{id}"
