          assert:
            - "after INVOICE, Vehicle.${v51_id}.vehicle_status == ACTIVE with credential_status NONE, and after issue-credentials credential_status == ISSUED with vehicle_status still ACTIVE"
            - "after the first distribute, Vehicle.${v51_id}.credential_status == ISSUED (not every live credential is distributed yet) and vehicle_status == ACTIVE"
            - "after the third distribute, Vehicle.${v51_id}.credential_status == DISTRIBUTED and vehicle_status == ACTIVE — the vehicle_status dimension never moved"
            - "Vehicle.${v52_id}.credential_status == ISSUED and vehicle_status == ACTIVE throughout (distribution touched only V51's credentials)"
            - "after the APPROVE, Vehicle.${v53_id}.vehicle_status == ACTIVE with activated_on_date 2026-07-15 and credential_status == NONE — activation mints no credentials"
            - "after the REVERSE, Vehicle.${v53_id}.vehicle_status == PENDING with activated_on_date null and credential_status still NONE"
            - "FleetChangeRequest.${fc5_id}.change_status == REVERSED with fee_delta retained at 1154.25 and prorate_months 6"
            - "GET /apportionment/credentials?vehicle_id=${v53_id} returns 0 rows at every step"
            - "GET /apportionment/credentials?distributed_to_driver_id=${d1_id} returns 3 rows, one per credential_type, all DISTRIBUTED"

  - rule_id: transitive_cascade
    instances:
      - name: return_for_correction_cascades_through_trips_carrier_and_audit_selection
        cascade_depth: 4
        grounds:
          - state_machines.FuelTaxReturn.PREPARED_to_RETURNED_FOR_CORRECTION
          - state_machines.TripRecord.ACCEPTED_to_GAP_FLAGGED
          - calculations.carrier_unsubstantiated_mileage_ratio
          - state_machines.AuditSelection.NOT_SELECTED_to_SELECTED
          - calculations.audit_risk_score
        distinguishing_aspect: |
          A four-hop cascade fired by one review call, travelling upward from a child ledger to a
          grandparent's audit posture: ReturnJurisdictionLine rows void and the return's totals
          zero out (hop 1), which reopens every ACCEPTED manually reconstructed trip in the
          quarter back to GAP_FLAGGED (hop 2), which recomputes the carrier's
          unsubstantiated_mileage_ratio from 0.0000 to 0.2500 and flips audit_flag to true
          (hop 3), which promotes the previously NOT_SELECTED AuditSelection to SELECTED with its
          risk_score rewritten from 37 to 77 (hop 4). Nothing about the fleet or its credentials
          is touched — this cascade runs entirely through the compliance chain.
        test_recipe:
          setup:
            - "Jurisdictions IL, IN, KY declared; carrier c6 based in IL with one power unit."
            - "Three trips all end ACCEPTED: Z1 700.0 mi (IL 300.0 / IN 200.0 / KY 200.0) telematics, Z2 800.0 mi (IL 400.0 / IN 250.0 / KY 150.0) telematics, and Z3 500.0 mi with a 100.0 mi gap reconstructed by analyst-1 to IL 250.0 / KY 350.0 and accepted."
            - "Because the reconstruction was accepted, the carrier's unsubstantiated_mileage_ratio is 0.0000 and audit_flag is false."
            - "Fuel: IL 175.000 / IN 80.000 / KY 30.000 gallons ACCEPTED in Q2-2026."
            - "The Q2-2026 return is PREPARED by preparer-1 (fleet_mpg 7.37, total_amount_due 118.60), so Carrier.latest_prepared_fleet_mpg is 7.37."
