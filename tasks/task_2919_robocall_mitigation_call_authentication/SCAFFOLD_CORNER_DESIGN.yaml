            - "The second attempt is 422 with data.error_id == ERR_INVALID_INTERVAL because effective_from 2026-09-01T00:00:00Z is not before effective_to 2026-08-01T00:00:00Z"
            - "The certificate attempt is 422 with data.error_id == ERR_INVALID_INTERVAL because not_before == not_after is not strictly ordered"
            - "GET /rmd/number-assignments?provider_id=${prov_id} returns total_count == 0 and GET /rmd/certificates?provider_id=${prov_id} returns total_count == 0"

      - name: out_of_order_customer_and_assignment_calls_are_rejected
