# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
#
# Machine-readable index of every difficulty feature SCAFFOLD.yaml claims, keyed
# by the nine §0.5 Difficulty Rules. Every `grounds:` entry resolves into
# SCAFFOLD.yaml §1.1-§1.7; every numeric `assert:` literal below was produced by
# executing the relevant §1.3 `formula:` against its `constants:` in code.
#
# Server startup logical clock is exactly 2026-08-01T00:00:00Z; chains that do
# not call POST /_clock/set_current_utc rely on that default.
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  # RULE 1 - dual_variant_calc
  # Two calculations carrying `variants:`, on different entity domains:
  #   (a) Offtaker creditworthiness scoring, (b) SettlementPeriod money netting.
  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: credit_score_guarantor_supported_versus_standalone_diverges_by_24_95
        grounds:
          - calculations.offtaker_credit_score
          - calculations.offtaker_credit_tier
          - calculations.unsecured_credit_limit
          - entities.Offtaker.fields.parent_guarantor_offtaker_id
          - entities.Offtaker.fields.credit_score_variant
          - state_machines.Offtaker.DRAFT_to_UNDER_REVIEW
        distinguishing_aspect: |
          This instance's dual variant lives in the Offtaker credit domain: two
          subsidiaries with byte-identical financials (BB / 4.0 / CDP_ONLY) score
          58.75 STANDALONE and 83.70 GUARANTOR_SUPPORTED, a 24.95-point delta,
          because only one of them is linked to a guarantor that is itself
          QUALIFIED - linkage alone does not select the variant.
        test_recipe:
          setup:
            - "A parent guarantor Offtaker (AA, net_debt_to_ebitda 1.0, TCFD_ONLY, SBT + RE100 + scope2 2030) has been driven to qualification_status QUALIFIED, so its credit_score is 89.60 and credit_tier PRIME."
            - "Subsidiary S1 (BB, net_debt_to_ebitda 4.0, CDP_ONLY, no commitments) is linked to that QUALIFIED guarantor via parent_guarantor_offtaker_id."
            - "Subsidiary S2 has the identical financial profile to S1 but is linked to a second parent (BBB, 3.0) that is deliberately left in qualification_status DRAFT."
            - "Both subsidiaries report reported_ebitda_usd 20000000.00, so the unsecured limit is EBITDA-bound in both variants."
            - "Logical clock is the 2026-08-01T00:00:00Z startup default."
          setup_api_calls:
            - call: "POST /ppa/offtakers"
              payload: { legal_name: "Northwind Global Holdings plc", credit_rating: "AA", rating_agency: "SP", reported_ebitda_usd: 400000000.00, net_debt_to_ebitda: 1.0, disclosure_framework: "TCFD_ONLY", has_science_based_target: true, re100_member: true, scope2_target_year: 2030 }
              as: Originator
              as_user_id: "u_orig_1"
              captures: { guarantor_id: $.data.id }
            - call: "POST /ppa/offtakers/${guarantor_id}/submit-qualification"
              payload: {}
              as: Originator
              as_user_id: "u_orig_1"
            - call: "POST /ppa/offtakers/${guarantor_id}/qualification-decision"
              payload: { decision: "QUALIFY" }
              as: CreditOfficer
              as_user_id: "u_credit_1"
            - call: "POST /ppa/offtakers"
              payload: { legal_name: "Weakling Parent SA", credit_rating: "BBB", rating_agency: "FITCH", reported_ebitda_usd: 90000000.00, net_debt_to_ebitda: 3.0, disclosure_framework: "TCFD_ONLY", has_science_based_target: true, re100_member: true, scope2_target_year: 2030 }
              as: Originator
              as_user_id: "u_orig_1"
              captures: { unqualified_parent_id: $.data.id }
            - call: "POST /ppa/offtakers"
              payload: { legal_name: "Northwind Retail Iberia SL", credit_rating: "BB", rating_agency: "SP", reported_ebitda_usd: 20000000.00, net_debt_to_ebitda: 4.0, disclosure_framework: "CDP_ONLY", has_science_based_target: false, re100_member: false, parent_guarantor_offtaker_id: "${guarantor_id}" }
              as: Originator
              as_user_id: "u_orig_1"
              captures: { sub_supported_id: $.data.id }
            - call: "POST /ppa/offtakers"
              payload: { legal_name: "Northwind Retail Nordics AB", credit_rating: "BB", rating_agency: "SP", reported_ebitda_usd: 20000000.00, net_debt_to_ebitda: 4.0, disclosure_framework: "CDP_ONLY", has_science_based_target: false, re100_member: false, parent_guarantor_offtaker_id: "${unqualified_parent_id}" }
              as: Originator
              as_user_id: "u_orig_1"
              captures: { sub_standalone_id: $.data.id }
          trigger:
            - call: "POST /ppa/offtakers/${sub_supported_id}/submit-qualification"
              payload: {}
              as: Originator
              as_user_id: "u_orig_1"
              captures: { supported_score: $.data.credit_score, supported_variant: $.data.credit_score_variant }
            - call: "POST /ppa/offtakers/${sub_standalone_id}/submit-qualification"
              payload: {}
              as: Originator
              as_user_id: "u_orig_1"
              captures: { standalone_score: $.data.credit_score, standalone_variant: $.data.credit_score_variant }
          assert:
            - "Offtaker.${sub_supported_id}.credit_score_variant == GUARANTOR_SUPPORTED"
            - "Offtaker.${sub_supported_id}.credit_score == 83.70"
            - "Offtaker.${sub_supported_id}.credit_tier == PRIME"
            - "Offtaker.${sub_supported_id}.unsecured_credit_limit_usd == 1000000.00"
            - "Offtaker.${sub_standalone_id}.credit_score_variant == STANDALONE"
            - "Offtaker.${sub_standalone_id}.credit_score == 58.75"
            - "Offtaker.${sub_standalone_id}.credit_tier == SUBPRIME"
            - "Offtaker.${sub_standalone_id}.unsecured_credit_limit_usd == 100000.00"
            - "Offtaker.${sub_supported_id}.credit_score - Offtaker.${sub_standalone_id}.credit_score == 24.95"
            - "Offtaker.${sub_supported_id}.sustainability_score == 10.00 and Offtaker.${sub_standalone_id}.sustainability_score == 10.00 - the disclosure and commitment components are never inherited from a guarantor, so the two subsidiaries stay identical on this axis"
            - "Offtaker.${guarantor_id}.credit_score == 89.60 and Offtaker.${guarantor_id}.credit_tier == PRIME"

      - name: settlement_netting_hourly_versus_monthly_diverges_by_50_00
        grounds:
          - calculations.settlement_netting
          - calculations.deal_contract_price
          - entities.SettlementPeriod.fields.netting_method
          - entities.SettlementPeriod.fields.energy_settlement_usd
          - entities.SettlementPeriod.fields.weighted_avg_index_usd_per_mwh
          - state_machines.SettlementPeriod.OPEN_to_CALCULATED
        distinguishing_aspect: |
          This instance's dual variant lives in the SettlementPeriod money domain,
          not the Offtaker credit domain: the SAME four metered hours (one of them
          at a negative hub price of -5.00) settle to energy_settlement_usd
          -545.23 under HOURLY netting and -595.23 under MONTHLY netting, an exact
          50.00 divergence created solely by HOURLY's per-hour zero floor on the
          index.
        test_recipe:
          setup:
            - "Both deals sit on one 100 MW project (25.000 MW each) and share one anchor buyer whose unsecured_credit_limit_usd of 3000000.00 exceeds each deal's exposure_usd of 2704212.00, so credit_support_required_usd is 0.00 on both and no instrument has to be posted."
            - "Buyer NW (A, net_debt_to_ebitda 2.5, CDP_AND_TCFD, SBT + RE100 + scope2 2030, EBITDA 60000000.00, registry account held) is QUALIFIED with credit_score 83.70, credit_tier PRIME and unsecured_credit_limit_usd 3000000.00."
            - "Project KJ1 (SOLAR, 100.000 MW) has been advanced all the way to OPERATIONAL, so any deal executed on it gets an EMPTY conditions-precedent template and becomes EFFECTIVE inside the execute request."
            - "Deal H (settlement_frequency HOURLY) and Deal M (settlement_frequency MONTHLY) are both EFFECTIVE, both 25.000 MW, both settling at the SP15 HUB with basis_responsibility SHARED, and both carry contract_price_usd_per_mwh 44.10."
            - "Each deal has one settlement period covering 2027-07-01T00:00:00Z to 2027-08-01T00:00:00Z holding the identical four MeterInterval rows for hours 00:00-03:00 of 2027-07-01, all with curtailment_flag NONE."
          setup_api_calls:
            - call: "POST /ppa/pricing-nodes"
              payload: { name: "SP15 EZ GEN HUB", iso: "CAISO", settlement_point_type: "HUB" }
              as: Originator
              captures: { hub_id: $.data.id }
            - call: "POST /ppa/pricing-nodes"
              payload: { name: "KRAMER JUNCTION 1N", iso: "CAISO", settlement_point_type: "NODE" }
              as: Originator
              captures: { node_id: $.data.id }
            - call: "POST /ppa/offtakers"
              payload: { legal_name: "Northwind Retail Inc", credit_rating: "A", rating_agency: "SP", reported_ebitda_usd: 60000000.00, net_debt_to_ebitda: 2.5, disclosure_framework: "CDP_AND_TCFD", has_science_based_target: true, re100_member: true, scope2_target_year: 2030, registry_account_id: "WREGIS-ACC-00417" }
              as: Originator
              as_user_id: "u_orig_1"
              captures: { buyer_id: $.data.id }
            - call: "POST /ppa/offtakers/${buyer_id}/submit-qualification"
              payload: {}
              as: Originator
              as_user_id: "u_orig_1"
            - call: "POST /ppa/offtakers/${buyer_id}/qualification-decision"
              payload: { decision: "QUALIFY" }
              as: CreditOfficer
              as_user_id: "u_credit_1"
            - call: "POST /ppa/projects"
              payload: { name: "Kramer Junction Solar I", technology: "SOLAR", capacity_mw: 100.000, node_id: "${node_id}", cod_target_date: "2027-06-01T00:00:00Z", p50_annual_mwh: 245280.00 }
              as: Originator
              as_user_id: "u_orig_1"
              captures: { project_id: $.data.id }
            - call: "POST /ppa/projects/${project_id}/advance-milestone"
              payload: { milestone: "PERMITTED", evidence_ref: "CUP-2026-0091" }
              as: Originator
              as_user_id: "u_orig_1"
            - call: "POST /ppa/projects/${project_id}/advance-milestone"
              payload: { milestone: "INTERCONNECTION_APPROVED", evidence_ref: "LGIA-CAISO-2026-114" }
              as: Originator
              as_user_id: "u_orig_1"
            - call: "POST /ppa/projects/${project_id}/advance-milestone"
              payload: { milestone: "NOTICE_TO_PROCEED", evidence_ref: "NTP-KJ1-2026-06" }
              as: Originator
              as_user_id: "u_orig_1"
            - call: "POST /ppa/projects/${project_id}/advance-milestone"
              payload: { milestone: "OPERATIONAL", evidence_ref: "COD-KJ1-2027-05-28" }
              as: Originator
              as_user_id: "u_orig_1"
            - call: "POST /ppa/deals"
              payload: { project_id: "${project_id}", anchor_offtaker_id: "${buyer_id}", settlement_point_id: "${hub_id}", product_type: "VIRTUAL_CFD", contracted_mw: 25.000, term_years: 12, first_delivery_year: 2027, commercial_operation_deadline: "2027-12-31T00:00:00Z", settlement_frequency: "HOURLY", base_fixed_price_usd_per_mwh: 42.50, escalation_pct_per_year: 2.0, shape_product: "AS_GENERATED", basis_responsibility: "SHARED" }
              as: Originator
