              payload: { code: "TX", name: "Texas", hazard_tier: "T2", admin_agency_name: "Texas Workforce Commission Civil Rights Division", pre_suit_window_days: 120, wage_hour_multiplier: 1.10, class_action_propensity_pct: 18.00 }
              as: PlatformAdmin
              as_user_id: "admin-001"
            - call: "POST /epli/applicants"
              payload: { legal_name: "Bayline Foods LLC", total_headcount: 40, prior_year_separations: 4, jurisdiction_headcounts: [{ code: "TX", headcount: 40 }], primary_jurisdiction_code: "TX" }
              as: Underwriter
              as_user_id: "uw-001"
              captures: { app_id: $.data.id }
            - call: "POST /epli/applicants/${app_id}/risk-management-services"
              payload: { service_type: "HOTLINE_SUBSCRIPTION", credit_pct: 0.08, effective_from: "2026-09-01T00:00:00.000Z", effective_to: "2027-09-01T00:00:00.000Z" }
              as: Underwriter
              as_user_id: "uw-001"
              captures: { svc_id: $.data.id }
          trigger:
            - call: "POST /epli/risk-management-services/${svc_id}/complete"
