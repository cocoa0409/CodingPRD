            - { call: "POST /spd/trays/${u2}/decontamination/complete", as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /spd/trays", payload: { template_id: "${tpl}", label: "U3" }, as: SpdTechnician, as_user_id: "${tech_a}", captures: { u3: "$.data.id" } }
            - { call: "POST /spd/trays/${u3}/decontamination/start", as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /spd/trays/${u3}/decontamination/complete", as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /spd/trays", payload: { template_id: "${tpl}", label: "U4" }, as: SpdTechnician, as_user_id: "${tech_a}", captures: { u4: "$.data.id" } }
            - { call: "POST /spd/trays/${u4}/decontamination/start", as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /spd/trays/${u4}/decontamination/complete", as: SpdTechnician, as_user_id: "${tech_a}" }
          trigger:
            - { call: "POST /spd/iuss-exceptions", payload: { tray_id: "${u1}", case_id: "${cu}", justification: "Emergency turnover; no sterile tray available" }, as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /spd/iuss-exceptions", payload: { tray_id: "${u2}", case_id: "${cu}", justification: "Emergency turnover; no sterile tray available" }, as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /spd/iuss-exceptions", payload: { tray_id: "${u3}", case_id: "${cu}", justification: "Emergency turnover; no sterile tray available" }, as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /spd/iuss-exceptions", payload: { tray_id: "${u4}", case_id: "${cu}", justification: "Emergency turnover; no sterile tray available" }, as: SpdTechnician, as_user_id: "${tech_a}", captures: { err: "$.data.error_id" } }
            - { call: "POST /spd/iuss-exceptions", payload: { tray_id: "${u4}", case_id: "${cu}", justification: "Emergency turnover; supervisor authorized flash" }, as: SpdSupervisor, as_user_id: "${tech_s}" }
            - { call: "GET /spd/trays/${u4}", as: Any }
          assert:
            - "Events 1-3 by the technician succeed (201): prospective counts 1, 2, 3 are all < SUPERVISOR_THRESHOLD 4"
            - "The technician's 4th event: err == ERR_IUSS_RATE_EXCEEDED (prospective count 4 >= 4)"
            - "The supervisor's identical 4th event succeeds (201) — the gate is role-based, not a hard stop"
            - "Tray.${u4}.status == IN_USE exactly once (the rejected technician attempt left it DECONTAMINATED; the supervisor attempt moved it)"

      - name: count_sheet_exact_match_vs_off_by_one
        grounds:
          - entities.AssemblyVerification.fields.result
          - state_machines.Tray.IN_ASSEMBLY_to_ASSEMBLED
        distinguishing_aspect: |
          Zero-tolerance integer-count boundary on the count-sheet metric, via a
          different endpoint (POST /spd/trays/{id}/assembly-verifications) than
          the IUSS counter: counted_qty == required quantity on every line yields
          PASS and moves the tray to ASSEMBLED, while a single line short by
          exactly one unit yields FAIL with mismatch_count == 1 and the tray stays
          IN_ASSEMBLY.
        test_recipe:
          setup:
            - "Template requires SCALPEL x2 and FORCEPS x1; technician A; trays ta and tb both IN_ASSEMBLY"
          setup_api_calls:
            - { call: "POST /spd/tray-templates", payload: { code: "SP-01", name: "Spine Set", specialty: "SPINE", packaging_type: "RIGID_CONTAINER", instrument_requirements: [{ instrument_type: "SCALPEL", quantity: 2 }, { instrument_type: "FORCEPS", quantity: 1 }], assembly_minutes: 30 }, as: FacilityAdmin, captures: { tpl: "$.data.id" } }
            - { call: "POST /spd/technicians", payload: { name: "Tech A", certification_level: 2, certified_methods: ["STEAM_GRAVITY"], certification_expires_at: "2027-01-01T00:00:00Z" }, as: FacilityAdmin, captures: { tech_a: "$.data.id" } }
            - { call: "POST /spd/trays", payload: { template_id: "${tpl}", label: "TA" }, as: SpdTechnician, as_user_id: "${tech_a}", captures: { ta: "$.data.id" } }
            - { call: "POST /spd/trays/${ta}/decontamination/start", as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /spd/trays/${ta}/decontamination/complete", as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /spd/trays/${ta}/assembly/start", as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /spd/trays", payload: { template_id: "${tpl}", label: "TB" }, as: SpdTechnician, as_user_id: "${tech_a}", captures: { tb: "$.data.id" } }
            - { call: "POST /spd/trays/${tb}/decontamination/start", as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /spd/trays/${tb}/decontamination/complete", as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /spd/trays/${tb}/assembly/start", as: SpdTechnician, as_user_id: "${tech_a}" }
          trigger:
            - { call: "POST /spd/trays/${ta}/assembly-verifications", payload: { lines: [{ instrument_type: "SCALPEL", counted_qty: 2 }, { instrument_type: "FORCEPS", counted_qty: 1 }] }, as: SpdTechnician, as_user_id: "${tech_a}", captures: { va: "$.data.result", va_mm: "$.data.mismatch_count" } }
            - { call: "POST /spd/trays/${tb}/assembly-verifications", payload: { lines: [{ instrument_type: "SCALPEL", counted_qty: 1 }, { instrument_type: "FORCEPS", counted_qty: 1 }] }, as: SpdTechnician, as_user_id: "${tech_a}", captures: { vb: "$.data.result", vb_mm: "$.data.mismatch_count" } }
            - { call: "GET /spd/trays/${ta}", as: Any }
            - { call: "GET /spd/trays/${tb}", as: Any }
          assert:
            - "Exact match: va == PASS and va_mm == 0; Tray.${ta}.status == ASSEMBLED"
            - "Off by one: vb == FAIL and vb_mm == 1; Tray.${tb}.status == IN_ASSEMBLY (no transition on FAIL)"

      - name: sterility_expiry_exact_equality_rejected
        grounds:
          - calculations.sterility_expiry_assignment
          - errors[ERR_STERILITY_EXPIRED_FOR_CASE]
          - entities.Tray.fields.sterility_expires_at
        distinguishing_aspect: |
          Strict-inequality boundary on a datetime metric via POST
          /spd/or-cases/{id}/reservations (distinct metric and endpoint from the
          IUSS-count and count-sheet instances): a case whose scheduled_start_at
          equals the tray's sterility_expires_at exactly is rejected (expiry must
          be STRICTLY greater), while one minute earlier is accepted.
        test_recipe:
          setup:
            - "Template (WRAPPED); technicians A, S; sterilizer; tray te STERILE with sterility_expires_at exactly 2026-05-31T03:00:00Z (released 2026-05-01T03:00:00Z + 720h)"
            - "Case CE1 scheduled exactly at the expiry instant (2026-05-31T03:00:00Z); case CE2 scheduled one minute earlier (2026-05-31T02:59:00Z)"
          setup_api_calls:
            - { call: "POST /spd/tray-templates", payload: { code: "ENT-02", name: "ENT Basic", specialty: "ENT", packaging_type: "WRAPPED", instrument_requirements: [{ instrument_type: "SCALPEL", quantity: 2 }], assembly_minutes: 10 }, as: FacilityAdmin, captures: { tpl: "$.data.id" } }
            - { call: "POST /spd/technicians", payload: { name: "Tech A", certification_level: 2, certified_methods: ["STEAM_GRAVITY"], certification_expires_at: "2027-01-01T00:00:00Z" }, as: FacilityAdmin, captures: { tech_a: "$.data.id" } }
            - { call: "POST /spd/technicians", payload: { name: "Sup S", certification_level: 3, certified_methods: ["STEAM_GRAVITY"], certification_expires_at: "2027-01-01T00:00:00Z" }, as: FacilityAdmin, captures: { tech_s: "$.data.id" } }
            - { call: "POST /spd/sterilizers", payload: { name: "ST-G1", method: "STEAM_GRAVITY", chamber_capacity: 4, cycle_minutes: 60, required_certification_level: 1 }, as: FacilityAdmin, captures: { ster: "$.data.id" } }
            - { call: "POST /spd/trays", payload: { template_id: "${tpl}", label: "TE" }, as: SpdTechnician, as_user_id: "${tech_a}", captures: { te: "$.data.id" } }
            - { call: "POST /spd/trays/${te}/decontamination/start", as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /spd/trays/${te}/decontamination/complete", as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /spd/trays/${te}/assembly/start", as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /spd/trays/${te}/assembly-verifications", payload: { lines: [{ instrument_type: "SCALPEL", counted_qty: 2 }] }, as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /spd/sterilization-loads", payload: { sterilizer_id: "${ster}", planned_start_at: "2026-05-01T00:00:00Z" }, as: SpdTechnician, as_user_id: "${tech_a}", captures: { le: "$.data.id" } }
            - { call: "POST /spd/sterilization-loads/${le}/trays", payload: { tray_id: "${te}" }, as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /spd/sterilization-loads/${le}/start", as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /spd/sterilization-loads/${le}/complete", as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T03:00:00Z" }, as: FacilityAdmin }
            - { call: "GET /spd/biological-indicators?load_id=${le}", as: Any, captures: { bie: "$.data[0].id" } }
            - { call: "POST /spd/biological-indicators/${bie}/record-result", payload: { result: "NEGATIVE" }, as: QualityAuditor }
            - { call: "POST /spd/sterilization-loads/${le}/release", as: SpdSupervisor, as_user_id: "${tech_s}" }
            - { call: "POST /spd/or-cases", payload: { case_number: "C-E1", surgeon: "Dr E", scheduled_start_at: "2026-05-31T03:00:00Z", scheduled_end_at: "2026-05-31T04:00:00Z", priority: "ELECTIVE" }, as: OrScheduler, captures: { ce1: "$.data.id", ce1_v: "$.data.version" } }
            - { call: "POST /spd/or-cases", payload: { case_number: "C-E2", surgeon: "Dr E", scheduled_start_at: "2026-05-31T02:59:00Z", scheduled_end_at: "2026-05-31T04:00:00Z", priority: "ELECTIVE" }, as: OrScheduler, captures: { ce2: "$.data.id", ce2_v: "$.data.version" } }
          trigger:
            - { call: "POST /spd/or-cases/${ce1}/reservations", payload: { tray_id: "${te}", expected_or_case_version: "${ce1_v}" }, as: OrScheduler, captures: { err: "$.data.error_id" } }
            - { call: "POST /spd/or-cases/${ce2}/reservations", payload: { tray_id: "${te}", expected_or_case_version: "${ce2_v}" }, as: OrScheduler, captures: { r2: "$.data.id", r2_st: "$.data.status" } }
            - { call: "GET /spd/trays/${te}", as: Any }
          assert:
            - "Equality rejected: err == ERR_STERILITY_EXPIRED_FOR_CASE (case start 2026-05-31T03:00:00Z == expiry; strict > required)"
            - "One minute earlier accepted: r2_st == RESERVED"
            - "Tray.${te}.status == STERILE (rejected first attempt left no trace; booking does not change tray status)"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: load_start_requires_sterilizer_idle
        grounds:
          - state_machines.SterilizationLoad.LOADING_to_RUNNING
          - entities.Sterilizer.fields.status
          - errors[ERR_STERILIZER_NOT_IDLE]
        distinguishing_aspect: |
          Entity pair SterilizationLoad -> Sterilizer: a load's LOADING->RUNNING
          transition is gated by the sterilizer's aggregate status — while L1 is
          RUNNING the sterilizer is RUNNING and L2's start is rejected even though
          L2's own planned window (02:00) has arrived and does not overlap L1's
          actual window [00:00, 01:00); completing L1 frees the sterilizer and the
          identical retry succeeds.
        test_recipe:
          setup:
            - "Template, technician A, sterilizer SG (60min, cap 4)"
            - "L1 with tray t1 started at 2026-05-01T00:00:00Z -> RUNNING; sterilizer RUNNING"
            - "L2 with tray t2 created (planned 2026-05-01T02:00:00Z, non-overlapping) -> LOADING; clock at 02:00"
          setup_api_calls:
            - { call: "POST /spd/tray-templates", payload: { code: "LAP-01", name: "Lap Set", specialty: "GEN", packaging_type: "WRAPPED", instrument_requirements: [{ instrument_type: "SCALPEL", quantity: 2 }], assembly_minutes: 10 }, as: FacilityAdmin, captures: { tpl: "$.data.id" } }
            - { call: "POST /spd/technicians", payload: { name: "Tech A", certification_level: 2, certified_methods: ["STEAM_GRAVITY"], certification_expires_at: "2027-01-01T00:00:00Z" }, as: FacilityAdmin, captures: { tech_a: "$.data.id" } }
            - { call: "POST /spd/sterilizers", payload: { name: "SG", method: "STEAM_GRAVITY", chamber_capacity: 4, cycle_minutes: 60, required_certification_level: 1 }, as: FacilityAdmin, captures: { sg: "$.data.id" } }
            - { call: "POST /spd/trays", payload: { template_id: "${tpl}", label: "T1" }, as: SpdTechnician, as_user_id: "${tech_a}", captures: { t1: "$.data.id" } }
            - { call: "POST /spd/trays/${t1}/decontamination/start", as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /spd/trays/${t1}/decontamination/complete", as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /spd/trays/${t1}/assembly/start", as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /spd/trays/${t1}/assembly-verifications", payload: { lines: [{ instrument_type: "SCALPEL", counted_qty: 2 }] }, as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /spd/sterilization-loads", payload: { sterilizer_id: "${sg}", planned_start_at: "2026-05-01T00:00:00Z" }, as: SpdTechnician, as_user_id: "${tech_a}", captures: { l1: "$.data.id" } }
            - { call: "POST /spd/sterilization-loads/${l1}/trays", payload: { tray_id: "${t1}" }, as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /spd/sterilization-loads/${l1}/start", as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /spd/trays", payload: { template_id: "${tpl}", label: "T2" }, as: SpdTechnician, as_user_id: "${tech_a}", captures: { t2: "$.data.id" } }
            - { call: "POST /spd/trays/${t2}/decontamination/start", as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /spd/trays/${t2}/decontamination/complete", as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /spd/trays/${t2}/assembly/start", as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /spd/trays/${t2}/assembly-verifications", payload: { lines: [{ instrument_type: "SCALPEL", counted_qty: 2 }] }, as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /spd/sterilization-loads", payload: { sterilizer_id: "${sg}", planned_start_at: "2026-05-01T02:00:00Z" }, as: SpdTechnician, as_user_id: "${tech_a}", captures: { l2: "$.data.id" } }
            - { call: "POST /spd/sterilization-loads/${l2}/trays", payload: { tray_id: "${t2}" }, as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T02:00:00Z" }, as: FacilityAdmin }
          trigger:
            - { call: "POST /spd/sterilization-loads/${l2}/start", as: SpdTechnician, as_user_id: "${tech_a}", captures: { err: "$.data.error_id" } }
            - { call: "POST /spd/sterilization-loads/${l1}/complete", as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /spd/sterilization-loads/${l2}/start", as: SpdTechnician, as_user_id: "${tech_a}", captures: { l2_st: "$.data.status" } }
          assert:
            - "First start attempt: err == ERR_STERILIZER_NOT_IDLE (sterilizer held RUNNING by L1) and L2 stays LOADING"
            - "After L1 completes (sterilizer -> IDLE): identical retry succeeds, l2_st == RUNNING — the gate was the sterilizer's state, not L2's own data"

      - name: tray_reservation_gated_by_load_release
        grounds:
          - state_machines.Tray.IN_LOAD_to_STERILE
          - state_machines.SterilizationLoad.COMPLETED_to_RELEASED
          - errors[ERR_TRAY_NOT_STERILE]
        distinguishing_aspect: |
          Entity pair Tray -> SterilizationLoad: the tray only becomes reservable
          when its load crosses COMPLETED -> RELEASED. While the load is COMPLETED
          (cycle done, BI still incubating) the tray sits IN_LOAD and the
          reservation is rejected with ERR_TRAY_NOT_STERILE; after release the
          identical reservation payload (same OCC version, still current)
          succeeds.
        test_recipe:
          setup:
            - "Template, technicians A and S, sterilizer; tray tj processed to ASSEMBLED, added to load LJ, which is RUNNING then COMPLETED (tj IN_LOAD; BI incubating until 03:00)"
            - "Case CJ (2026-05-10T09:00-11:00) created, version captured"
          setup_api_calls:
            - { call: "POST /spd/tray-templates", payload: { code: "GYN-01", name: "GYN Set", specialty: "GYN", packaging_type: "WRAPPED", instrument_requirements: [{ instrument_type: "SCALPEL", quantity: 2 }], assembly_minutes: 10 }, as: FacilityAdmin, captures: { tpl: "$.data.id" } }
            - { call: "POST /spd/technicians", payload: { name: "Tech A", certification_level: 2, certified_methods: ["STEAM_GRAVITY"], certification_expires_at: "2027-01-01T00:00:00Z" }, as: FacilityAdmin, captures: { tech_a: "$.data.id" } }
            - { call: "POST /spd/technicians", payload: { name: "Sup S", certification_level: 3, certified_methods: ["STEAM_GRAVITY"], certification_expires_at: "2027-01-01T00:00:00Z" }, as: FacilityAdmin, captures: { tech_s: "$.data.id" } }
            - { call: "POST /spd/sterilizers", payload: { name: "ST-G1", method: "STEAM_GRAVITY", chamber_capacity: 4, cycle_minutes: 60, required_certification_level: 1 }, as: FacilityAdmin, captures: { ster: "$.data.id" } }
            - { call: "POST /spd/trays", payload: { template_id: "${tpl}", label: "TJ" }, as: SpdTechnician, as_user_id: "${tech_a}", captures: { tj: "$.data.id" } }
            - { call: "POST /spd/trays/${tj}/decontamination/start", as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /spd/trays/${tj}/decontamination/complete", as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /spd/trays/${tj}/assembly/start", as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /spd/trays/${tj}/assembly-verifications", payload: { lines: [{ instrument_type: "SCALPEL", counted_qty: 2 }] }, as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /spd/sterilization-loads", payload: { sterilizer_id: "${ster}", planned_start_at: "2026-05-01T00:00:00Z" }, as: SpdTechnician, as_user_id: "${tech_a}", captures: { lj: "$.data.id" } }
            - { call: "POST /spd/sterilization-loads/${lj}/trays", payload: { tray_id: "${tj}" }, as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /spd/sterilization-loads/${lj}/start", as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /spd/sterilization-loads/${lj}/complete", as: SpdTechnician, as_user_id: "${tech_a}" }
            - { call: "POST /spd/or-cases", payload: { case_number: "C-J", surgeon: "Dr J", scheduled_start_at: "2026-05-10T09:00:00Z", scheduled_end_at: "2026-05-10T11:00:00Z", priority: "ELECTIVE" }, as: OrScheduler, captures: { cj: "$.data.id", cj_v: "$.data.version" } }
          trigger:
            - { call: "POST /spd/or-cases/${cj}/reservations", payload: { tray_id: "${tj}", expected_or_case_version: "${cj_v}" }, as: OrScheduler, captures: { err: "$.data.error_id" } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-01T03:00:00Z" }, as: FacilityAdmin }
            - { call: "GET /spd/biological-indicators?load_id=${lj}", as: Any, captures: { bij: "$.data[0].id" } }
            - { call: "POST /spd/biological-indicators/${bij}/record-result", payload: { result: "NEGATIVE" }, as: QualityAuditor }
            - { call: "POST /spd/sterilization-loads/${lj}/release", as: SpdSupervisor, as_user_id: "${tech_s}" }
            - { call: "POST /spd/or-cases/${cj}/reservations", payload: { tray_id: "${tj}", expected_or_case_version: "${cj_v}" }, as: OrScheduler, captures: { rj: "$.data.status" } }
          assert:
            - "Before release: err == ERR_TRAY_NOT_STERILE (tray IN_LOAD — gated by the load's state, not by anything on the case)"
            - "After COMPLETED -> RELEASED: Tray.${tj} is STERILE and the retried reservation rj == RESERVED"
            - "The retry reused the same expected_or_case_version — the failed first attempt did not bump ORCase.version"

      - name: case_start_gated_by_loaner_readiness
        grounds:
          - state_machines.ORCase.TRAYS_RESERVED_to_IN_PROGRESS
          - state_machines.LoanerSet.BOOKED_to_RECEIVED
          - state_machines.LoanerSet.RECEIVED_to_READY
          - errors[ERR_LOANER_NOT_READY]
        distinguishing_aspect: |
          Entity pair ORCase -> LoanerSet (distinct from Load->Sterilizer and
          Tray->Load): a TRAYS_RESERVED case with a valid reserved sterile tray
          still cannot start while its linked loaner set is BOOKED; only after the
          loaner passes RECEIVED -> READY does the identical start call succeed.
        test_recipe:
          setup:
            - "Template, technicians A and S, sterilizer; tray tl STERILE (expiry 2026-05-31T03:00:00Z)"
            - "Case CL (2026-05-10T09:00-11:00) holds a reservation on tl (case TRAYS_RESERVED)"
            - "Loaner LN (vendor VendorMed, 3 trays) BOOKED for CL with due_by 2026-05-09T09:00:00Z (24h lead)"
