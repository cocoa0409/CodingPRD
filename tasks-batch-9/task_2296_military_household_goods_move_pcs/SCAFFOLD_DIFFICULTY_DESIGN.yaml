      - name: shipment_booking_requires_authorized_entitlement
        grounds:
          - validations[priority=20]
          - errors.ERR_ENTITLEMENT_NOT_AUTHORIZED
          - state_machines.EntitlementAuthorization.DRAFT_to_AUTHORIZED
        distinguishing_aspect: >-
          Entity pair (Shipment, EntitlementAuthorization): booking a shipment is legal in itself —
          member, orders, TSP and market are all valid and the OCC version is fresh — yet it is
          refused with ERR_ENTITLEMENT_NOT_AUTHORIZED purely because the referenced ledger is still
          in DRAFT; authorizing that ledger and replaying the identical body succeeds.
        test_recipe:
          setup:
            - "Clock at 2026-08-03T00:00:00Z; counseling completed so the entitlement exists in DRAFT."
            - "TSP ACTIVE and serving MKT-BWI."
