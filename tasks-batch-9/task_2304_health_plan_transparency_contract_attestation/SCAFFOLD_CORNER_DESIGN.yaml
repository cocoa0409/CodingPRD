            - "GET /compliance/machine-readable-files?plan_year_id=${py} -> total_count == 0 and GET /compliance/plan-years/${py} -> data.compliance_posture == \"FROZEN\""

      - name: gag_review_with_no_prohibited_clauses_clears_to_compliant
        claim_type: satisfaction_to_pass
        grounds:
          - validations[priority=29]
          - state_machines.ServiceProviderContract.IN_REVIEW_to_COMPLIANT
        distinguishing_aspect: "When the guarded condition is satisfied the operation must succeed and score nothing: clearing a 40/0 review moves gag_review_status to COMPLIANT, leaves gag_non_compliant_since null, posts NO ledger entry and keeps deficiency_points at 0 — a scaffold that charges points on every review is detectable."
        test_recipe:
          setup:
            - "ACTIVE PlanYear PY2027 with one TPA contract reviewed at clause_inventory_count 40 / prohibited_clause_count 0; clock at 2027-02-01T09:00:00Z."
          setup_api_calls:
            - call: "POST /compliance/_clock/set_current_utc"
              payload: { current_utc: "2027-02-01T09:00:00Z" }
