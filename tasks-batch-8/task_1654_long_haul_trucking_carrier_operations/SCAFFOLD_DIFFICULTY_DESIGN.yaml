# =============================================================================
# §1.8 Scaffold Difficulty Design — Test Targeting Index
# Task 1654: Long-Haul Trucking Carrier Operations
# Canonical fixture F1 arithmetic (precomputed, used across instances):
#   Lane TX->GA 900 mi, floor 200; national pump 450 / baseline 300 -> diff 150
#   FSC = round_half_up(900*150/6.5) = 20769
#   Load rate 250000; revenue = 270769; screen miles 1000 (900+100 est)
#   provisional margin = 270769 - (1000*145 + 1000*62) = 270769 - 207000 = 63769
#   projected RPM = round_half_up(270769/1000) = 271
#   Trip: deadhead 120 -> planned miles 1020; required_drive = ceil(1020*60/50) = 1224
#   provisional pay (MILEAGE 62cpm) = 1020*62 = 63240
#   Completion odo 100000 -> 101050: actual 1050; pay_miles = max(1050,1020) = 1050
#   final pay = 65100; fuel burn = ceil(1050/6.5) = 162 -> 150-162 -> max(0,.) = 0
#   Pickup leg: arrive 07:50 (< appt 08:00) -> anchor 08:00; depart 10:00 -> 120-120 = 0
#   Delivery leg: arrive 17:00 (< appt 18:00) -> anchor 18:00; delivered 21:00
#     -> 180-120 = 60 billable -> ceil(60/15)=4 increments -> 6000
#   Invoice total = 250000 + 20769 + 6000 = 276769
#   Final margin = 276769 - (1050*145 + 65100) = 276769 - 217350 = 59419
#   Settlement: trip_pay 65100; share round_half_up(6000*0.25)=1500; subtotal 66600;
#     top_up = 120000-66600 = 53400; gross 120000
# =============================================================================

scaffold_difficulty_design:
  # ---------------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: load_margin_provisional_vs_final
        grounds:
          - calculations.lane_margin_screen
          - calculations.fuel_surcharge_calc
          - state_machines.Load.TENDERED_to_SCREENED
          - state_machines.Load.DELIVERED_to_INVOICED
        distinguishing_aspect: |
          Dual-variant on the LOAD domain: the provisional variant (estimated deadhead 100,
          fleet-average pay, no accessorials) yields 63769 while the final variant (actual
          miles 1050, actual final pay 65100, BILLED accessorials in revenue) yields 59419
          for the same tender data.
        test_recipe:
          setup:
            - "Clock 2026-08-01T06:00:00Z; customer ACTIVE; lane TX->GA 900mi floor 200; US-NATIONAL pump 450"
            - "MILEAGE driver 62cpm, last_home 2026-07-28; tractor odo 100000 in TX, fuel 150/200"
            - "Load rate 250000, pickup 2026-08-02T08:00Z, delivery 2026-08-03T18:00Z; full trip through DELIVERED with 60 billable detention minutes at delivery"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T06:00:00Z" }, as: FleetAdmin }
            - { call: "POST /customers", payload: { name: "Acme Foods" }, as: FleetAdmin, captures: { cust: $.data.id } }
            - { call: "POST /lanes", payload: { origin_state: "TX", destination_state: "GA", loaded_miles: 900, rpm_floor_cents: 200 }, as: LoadPlanner, captures: { lane: $.data.id } }
            - { call: "POST /state-fuel-rates", payload: { state_code: "US-NATIONAL", tax_cents_per_gallon: 0, avg_pump_price_cents: 450, effective_from: "2026-01-01T00:00:00Z" }, as: FleetAdmin }
            - { call: "POST /drivers", payload: { cdl_number: "CDL-1", full_name: "D One", home_terminal: "DAL", pay_model: "MILEAGE", pay_rate_cents_per_mile: 62, hired_at: "2025-01-01T00:00:00Z", last_home_at: "2026-07-28T00:00:00Z" }, as: FleetAdmin, captures: { drv: $.data.id } }
            - { call: "POST /tractors", payload: { unit_number: "T-1", home_terminal: "DAL", odometer_miles: 100000, current_state_code: "TX", tank_capacity_gallons: 200, current_fuel_gallons: 150 }, as: FleetAdmin, captures: { tr: $.data.id } }
            - { call: "POST /loads", payload: { customer_id: "${cust}", lane_id: "${lane}", rate_cents: 250000, weight_lbs: 42000, pickup_appt_at: "2026-08-02T08:00:00Z", delivery_appt_at: "2026-08-03T18:00:00Z" }, as: LoadPlanner, captures: { load: $.data.id } }
            - { call: "POST /loads/${load}/screen", payload: {}, as: LoadPlanner, captures: { proj_margin: $.data.projected_margin_cents, fsc: $.data.fuel_surcharge_cents } }
            - { call: "POST /loads/${load}/accept", payload: {}, as: LoadPlanner }
            - { call: "POST /trips", payload: { load_id: "${load}", driver_id: "${drv}", tractor_id: "${tr}", planned_deadhead_miles: 120, planned_start_at: "2026-08-02T06:00:00Z", route_states: [ { state_code: "TX", miles: 300 }, { state_code: "LA", miles: 280 }, { state_code: "MS", miles: 120 }, { state_code: "AL", miles: 120 }, { state_code: "GA", miles: 200 } ] }, as: Dispatcher, captures: { trip: $.data.id } }
            - { call: "POST /trips/${trip}/dispatch", payload: {}, as: Dispatcher }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T21:00:00Z" }, as: FleetAdmin }
            - { call: "POST /trips/${trip}/check-calls", payload: { kind: "ARRIVED_PICKUP", occurred_at: "2026-08-02T07:50:00Z", state_code: "TX", odometer_miles: 100120 }, as: Driver, as_user_id: "${drv}" }
            - { call: "POST /trips/${trip}/check-calls", payload: { kind: "DEPARTED_PICKUP", occurred_at: "2026-08-02T10:00:00Z", state_code: "TX", odometer_miles: 100120 }, as: Driver, as_user_id: "${drv}" }
            - { call: "POST /trips/${trip}/check-calls", payload: { kind: "ARRIVED_DELIVERY", occurred_at: "2026-08-03T17:00:00Z", state_code: "GA", odometer_miles: 101050 }, as: Driver, as_user_id: "${drv}" }
            - { call: "POST /trips/${trip}/check-calls", payload: { kind: "DELIVERED", occurred_at: "2026-08-03T21:00:00Z", state_code: "GA", odometer_miles: 101050 }, as: Driver, as_user_id: "${drv}" }
            - { call: "POST /loads/${load}/invoice", payload: {}, as: LoadPlanner, captures: { inv: $.data.id } }
          trigger:
            - { call: "POST /invoices/${inv}/issue", payload: {}, as: LoadPlanner, captures: { inv_total: $.data.total_cents } }
            - { call: "GET /loads/${load}", payload: {}, as: LoadPlanner, captures: { final_margin: $.data.final_margin_cents } }
          assert:
            - "captured ${proj_margin} == 63769 (provisional variant)"
            - "captured ${fsc} == 20769"
            - "captured ${final_margin} == 59419 (final variant: 276769 - (1050*145 + 65100))"
            - "captured ${inv_total} == 276769"
            - "${proj_margin} != ${final_margin} (63769 != 59419)"

      - name: driver_pay_provisional_vs_final_percentage
        grounds:
          - calculations.driver_trip_pay
          - state_machines.Trip.PLANNED_to_DISPATCHED
          - state_machines.Trip.AT_DELIVERY_to_COMPLETED
        distinguishing_aspect: |
          Dual-variant on the TRIP/driver-pay domain (different domain than load margin):
          PERCENTAGE provisional uses linehaul-only base (250001*0.275 -> 68750) while final
          uses linehaul+FSC base (270770*0.275 -> 74462) for identical trip data.
        test_recipe:
          setup:
            - "Clock 2026-08-01T06:00:00Z; F1 reference data (customer, lane 900mi, national pump 450)"
            - "PERCENTAGE driver 2750bp; tractor odo 100000; load rate 250001, pickup 2026-08-02T08:00Z, delivery 2026-08-03T18:00Z"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T06:00:00Z" }, as: FleetAdmin }
            - { call: "POST /customers", payload: { name: "Acme Foods" }, as: FleetAdmin, captures: { cust: $.data.id } }
            - { call: "POST /lanes", payload: { origin_state: "TX", destination_state: "GA", loaded_miles: 900, rpm_floor_cents: 200 }, as: LoadPlanner, captures: { lane: $.data.id } }
            - { call: "POST /state-fuel-rates", payload: { state_code: "US-NATIONAL", tax_cents_per_gallon: 0, avg_pump_price_cents: 450, effective_from: "2026-01-01T00:00:00Z" }, as: FleetAdmin }
            - { call: "POST /drivers", payload: { cdl_number: "CDL-2", full_name: "P Two", home_terminal: "DAL", pay_model: "PERCENTAGE", pay_percentage_bp: 2750, hired_at: "2025-01-01T00:00:00Z", last_home_at: "2026-07-28T00:00:00Z" }, as: FleetAdmin, captures: { drv: $.data.id } }
            - { call: "POST /tractors", payload: { unit_number: "T-2", home_terminal: "DAL", odometer_miles: 100000, current_state_code: "TX", tank_capacity_gallons: 200, current_fuel_gallons: 150 }, as: FleetAdmin, captures: { tr: $.data.id } }
            - { call: "POST /loads", payload: { customer_id: "${cust}", lane_id: "${lane}", rate_cents: 250001, weight_lbs: 42000, pickup_appt_at: "2026-08-02T08:00:00Z", delivery_appt_at: "2026-08-03T18:00:00Z" }, as: LoadPlanner, captures: { load: $.data.id } }
            - { call: "POST /loads/${load}/screen", payload: {}, as: LoadPlanner }
            - { call: "POST /loads/${load}/accept", payload: {}, as: LoadPlanner }
          trigger:
            - { call: "POST /trips", payload: { load_id: "${load}", driver_id: "${drv}", tractor_id: "${tr}", planned_deadhead_miles: 120, planned_start_at: "2026-08-02T06:00:00Z", route_states: [ { state_code: "TX", miles: 1020 } ] }, as: Dispatcher, captures: { trip: $.data.id, prov_pay: $.data.provisional_pay_cents } }
            - { call: "POST /trips/${trip}/dispatch", payload: {}, as: Dispatcher }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T19:00:00Z" }, as: FleetAdmin }
            - { call: "POST /trips/${trip}/check-calls", payload: { kind: "ARRIVED_PICKUP", occurred_at: "2026-08-02T08:00:00Z", state_code: "TX", odometer_miles: 100120 }, as: Driver, as_user_id: "${drv}" }
            - { call: "POST /trips/${trip}/check-calls", payload: { kind: "DEPARTED_PICKUP", occurred_at: "2026-08-02T09:00:00Z", state_code: "TX", odometer_miles: 100120 }, as: Driver, as_user_id: "${drv}" }
            - { call: "POST /trips/${trip}/check-calls", payload: { kind: "ARRIVED_DELIVERY", occurred_at: "2026-08-03T17:00:00Z", state_code: "GA", odometer_miles: 101000 }, as: Driver, as_user_id: "${drv}" }
            - { call: "POST /trips/${trip}/check-calls", payload: { kind: "DELIVERED", occurred_at: "2026-08-03T19:00:00Z", state_code: "GA", odometer_miles: 101000 }, as: Driver, as_user_id: "${drv}", captures: { cc_done: $.data.id } }
            - { call: "GET /trips/${trip}", payload: {}, as: Dispatcher, captures: { final_pay: $.data.final_pay_cents } }
          assert:
            - "captured ${prov_pay} == 68750 (round_half_up(250001*2750/10000)=round_half_up(68750.275))"
            - "captured ${final_pay} == 74462 (round_half_up((250001+20769)*2750/10000)=round_half_up(74461.75))"
            - "${prov_pay} != ${final_pay} (68750 != 74462)"

  # ---------------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: hos_feasibility_multi_clause_gate
        grounds:
          - calculations.hos_feasibility_check
          - calculations.hos_clock_projection
          - validations[priority=8]
        distinguishing_aspect: |
          Mode (a) combinatorial: 4+ inputs (drive_11h, cycle_70h, appointment slack,
          planned miles) interacting through nested min/floor clauses; clause (3) horizon
          capacity (660*(1+floor(slack/1440))) rejects a 1224-minute drive with only 1320
          minutes of slack even though today's 660-minute clause (1) passes at equality.
        test_recipe:
          setup:
            - "Clock 2026-08-01T06:00:00Z; F1 reference data; fresh MILEAGE driver (no duty events -> drive_11h 660)"
            - "Load TIGHT: delivery 2026-08-02T04:00:00Z (1320 min after now); Load ROOMY: delivery 2026-08-03T18:00:00Z"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T06:00:00Z" }, as: FleetAdmin }
            - { call: "POST /customers", payload: { name: "Acme Foods" }, as: FleetAdmin, captures: { cust: $.data.id } }
            - { call: "POST /lanes", payload: { origin_state: "TX", destination_state: "GA", loaded_miles: 900, rpm_floor_cents: 200 }, as: LoadPlanner, captures: { lane: $.data.id } }
            - { call: "POST /state-fuel-rates", payload: { state_code: "US-NATIONAL", tax_cents_per_gallon: 0, avg_pump_price_cents: 450, effective_from: "2026-01-01T00:00:00Z" }, as: FleetAdmin }
            - { call: "POST /drivers", payload: { cdl_number: "CDL-3", full_name: "D Three", home_terminal: "DAL", pay_model: "MILEAGE", pay_rate_cents_per_mile: 62, hired_at: "2025-01-01T00:00:00Z", last_home_at: "2026-07-28T00:00:00Z" }, as: FleetAdmin, captures: { drv: $.data.id } }
            - { call: "POST /tractors", payload: { unit_number: "T-3", home_terminal: "DAL", odometer_miles: 100000, current_state_code: "TX", tank_capacity_gallons: 200, current_fuel_gallons: 150 }, as: FleetAdmin, captures: { tr: $.data.id } }
            - { call: "POST /loads", payload: { customer_id: "${cust}", lane_id: "${lane}", rate_cents: 250000, weight_lbs: 42000, pickup_appt_at: "2026-08-01T08:00:00Z", delivery_appt_at: "2026-08-02T04:00:00Z" }, as: LoadPlanner, captures: { load_tight: $.data.id } }
            - { call: "POST /loads/${load_tight}/screen", payload: {}, as: LoadPlanner }
            - { call: "POST /loads/${load_tight}/accept", payload: {}, as: LoadPlanner }
            - { call: "POST /loads", payload: { customer_id: "${cust}", lane_id: "${lane}", rate_cents: 250000, weight_lbs: 42000, pickup_appt_at: "2026-08-02T08:00:00Z", delivery_appt_at: "2026-08-03T18:00:00Z" }, as: LoadPlanner, captures: { load_roomy: $.data.id } }
            - { call: "POST /loads/${load_roomy}/screen", payload: {}, as: LoadPlanner }
            - { call: "POST /loads/${load_roomy}/accept", payload: {}, as: LoadPlanner }
          trigger:
            - { call: "POST /trips", payload: { load_id: "${load_tight}", driver_id: "${drv}", tractor_id: "${tr}", planned_deadhead_miles: 120, planned_start_at: "2026-08-01T07:00:00Z", route_states: [ { state_code: "TX", miles: 1020 } ] }, as: Dispatcher, captures: { err1: $.data.error_id } }
            - { call: "POST /trips", payload: { load_id: "${load_roomy}", driver_id: "${drv}", tractor_id: "${tr}", planned_deadhead_miles: 120, planned_start_at: "2026-08-02T06:00:00Z", route_states: [ { state_code: "TX", miles: 1020 } ] }, as: Dispatcher, captures: { trip2: $.data.id, prov2: $.data.provisional_pay_cents } }
          assert:
            - "tight trip create rejected: captured ${err1} == ERR_HOS_INSUFFICIENT (clause 3: 660*(1+floor(1320/1440)) = 660 < 1224; clause 4: 1224+600 = 1824 > 1320)"
            - "roomy trip create succeeds: ${trip2} present, ${prov2} == 63240"
            - "fresh driver clause (1) boundary held at equality: drive_11h 660 >= min(1224,660) = 660"

      - name: settlement_per_charge_rounding_order
        grounds:
          - calculations.settlement_gross_pay
          - entities.Settlement.fields.accessorial_share_cents
        distinguishing_aspect: |
          Mode (b) nested rounding: share is round_half_up PER CHARGE then summed —
          two LUMPER charges of 3013 each yield 753+753 = 1506; the conforming result
          differs from sum-then-round (round_half_up(6026*0.25) = 1507).
        test_recipe:
          setup:
            - "Clock 2026-08-01T06:00:00Z; customer; lane TX->LA 300mi floor 100; US-NATIONAL pump 450 (FSC 6923)"
            - "MILEAGE driver 62cpm; tractor odo 200000 fuel 150; two loads (rate 100000 each), each run to completion (350 actual miles -> final pay 21700 each), each with one BILLED LUMPER of 3013"
          setup_api_calls:
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T06:00:00Z" }, as: FleetAdmin }
            - { call: "POST /customers", payload: { name: "Acme Foods" }, as: FleetAdmin, captures: { cust: $.data.id } }
            - { call: "POST /lanes", payload: { origin_state: "TX", destination_state: "LA", loaded_miles: 300, rpm_floor_cents: 100 }, as: LoadPlanner, captures: { lane: $.data.id } }
            - { call: "POST /state-fuel-rates", payload: { state_code: "US-NATIONAL", tax_cents_per_gallon: 0, avg_pump_price_cents: 450, effective_from: "2026-01-01T00:00:00Z" }, as: FleetAdmin }
            - { call: "POST /drivers", payload: { cdl_number: "CDL-4", full_name: "D Four", home_terminal: "DAL", pay_model: "MILEAGE", pay_rate_cents_per_mile: 62, hired_at: "2025-01-01T00:00:00Z", last_home_at: "2026-07-28T00:00:00Z" }, as: FleetAdmin, captures: { drv: $.data.id } }
            - { call: "POST /tractors", payload: { unit_number: "T-4", home_terminal: "DAL", odometer_miles: 200000, current_state_code: "TX", tank_capacity_gallons: 200, current_fuel_gallons: 150 }, as: FleetAdmin, captures: { tr: $.data.id } }
            - { call: "POST /loads", payload: { customer_id: "${cust}", lane_id: "${lane}", rate_cents: 100000, weight_lbs: 30000, pickup_appt_at: "2026-08-02T08:00:00Z", delivery_appt_at: "2026-08-02T20:00:00Z" }, as: LoadPlanner, captures: { loadA: $.data.id } }
            - { call: "POST /loads/${loadA}/screen", payload: {}, as: LoadPlanner }
            - { call: "POST /loads/${loadA}/accept", payload: {}, as: LoadPlanner }
            - { call: "POST /trips", payload: { load_id: "${loadA}", driver_id: "${drv}", tractor_id: "${tr}", planned_deadhead_miles: 50, planned_start_at: "2026-08-02T06:00:00Z", route_states: [ { state_code: "TX", miles: 200 }, { state_code: "LA", miles: 150 } ] }, as: Dispatcher, captures: { tripA: $.data.id } }
            - { call: "POST /trips/${tripA}/dispatch", payload: {}, as: Dispatcher }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T19:30:00Z" }, as: FleetAdmin }
            - { call: "POST /trips/${tripA}/check-calls", payload: { kind: "ARRIVED_PICKUP", occurred_at: "2026-08-02T08:00:00Z", state_code: "TX", odometer_miles: 200050 }, as: Driver, as_user_id: "${drv}" }
            - { call: "POST /trips/${tripA}/check-calls", payload: { kind: "DEPARTED_PICKUP", occurred_at: "2026-08-02T09:00:00Z", state_code: "TX", odometer_miles: 200050 }, as: Driver, as_user_id: "${drv}" }
            - { call: "POST /trips/${tripA}/check-calls", payload: { kind: "ARRIVED_DELIVERY", occurred_at: "2026-08-02T19:00:00Z", state_code: "LA", odometer_miles: 200350 }, as: Driver, as_user_id: "${drv}" }
            - { call: "POST /trips/${tripA}/check-calls", payload: { kind: "DELIVERED", occurred_at: "2026-08-02T19:30:00Z", state_code: "LA", odometer_miles: 200350 }, as: Driver, as_user_id: "${drv}" }
            - { call: "POST /loads/${loadA}/accessorials", payload: { type: "LUMPER", quantity: 3013 }, as: Dispatcher, captures: { accA: $.data.id } }
            - { call: "POST /accessorials/${accA}/submit", payload: {}, as: Dispatcher }
            - { call: "POST /accessorials/${accA}/approve", payload: {}, as: LoadPlanner }
            - { call: "POST /loads/${loadA}/invoice", payload: {}, as: LoadPlanner, captures: { invA: $.data.id } }
            - { call: "POST /invoices/${invA}/issue", payload: {}, as: LoadPlanner }
            - { call: "POST /loads", payload: { customer_id: "${cust}", lane_id: "${lane}", rate_cents: 100000, weight_lbs: 30000, pickup_appt_at: "2026-08-03T08:00:00Z", delivery_appt_at: "2026-08-03T20:00:00Z" }, as: LoadPlanner, captures: { loadB: $.data.id } }
            - { call: "POST /loads/${loadB}/screen", payload: {}, as: LoadPlanner }
            - { call: "POST /loads/${loadB}/accept", payload: {}, as: LoadPlanner }
            - { call: "POST /trips", payload: { load_id: "${loadB}", driver_id: "${drv}", tractor_id: "${tr}", planned_deadhead_miles: 50, planned_start_at: "2026-08-03T06:00:00Z", route_states: [ { state_code: "TX", miles: 200 }, { state_code: "LA", miles: 150 } ] }, as: Dispatcher, captures: { tripB: $.data.id } }
            - { call: "POST /trips/${tripB}/dispatch", payload: {}, as: Dispatcher }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T19:30:00Z" }, as: FleetAdmin }
            - { call: "POST /trips/${tripB}/check-calls", payload: { kind: "ARRIVED_PICKUP", occurred_at: "2026-08-03T08:00:00Z", state_code: "TX", odometer_miles: 200400 }, as: Driver, as_user_id: "${drv}" }
            - { call: "POST /trips/${tripB}/check-calls", payload: { kind: "DEPARTED_PICKUP", occurred_at: "2026-08-03T09:00:00Z", state_code: "TX", odometer_miles: 200400 }, as: Driver, as_user_id: "${drv}" }
            - { call: "POST /trips/${tripB}/check-calls", payload: { kind: "ARRIVED_DELIVERY", occurred_at: "2026-08-03T19:00:00Z", state_code: "LA", odometer_miles: 200700 }, as: Driver, as_user_id: "${drv}" }
            - { call: "POST /trips/${tripB}/check-calls", payload: { kind: "DELIVERED", occurred_at: "2026-08-03T19:30:00Z", state_code: "LA", odometer_miles: 200700 }, as: Driver, as_user_id: "${drv}" }
            - { call: "POST /loads/${loadB}/accessorials", payload: { type: "LUMPER", quantity: 3013 }, as: Dispatcher, captures: { accB: $.data.id } }
            - { call: "POST /accessorials/${accB}/submit", payload: {}, as: Dispatcher }
            - { call: "POST /accessorials/${accB}/approve", payload: {}, as: LoadPlanner }
            - { call: "POST /loads/${loadB}/invoice", payload: {}, as: LoadPlanner, captures: { invB: $.data.id } }
            - { call: "POST /invoices/${invB}/issue", payload: {}, as: LoadPlanner }
          trigger:
            - { call: "POST /settlements", payload: { driver_id: "${drv}", period_start: "2026-08-01T00:00:00Z", period_end: "2026-08-08T00:00:00Z" }, as: PayrollClerk, as_user_id: "payroll-1", captures: { stl: $.data.id, share: $.data.accessorial_share_cents, trip_pay: $.data.trip_pay_cents, topup: $.data.guarantee_top_up_cents, gross: $.data.gross_pay_cents } }
          assert:
            - "captured ${share} == 1506 (753+753; per-charge round_half_up(3013*0.25)=753; NOT the sum-then-round value 1507)"
            - "captured ${trip_pay} == 43400 (21700*2)"
            - "captured ${topup} == 75094 (120000-44906)"
            - "captured ${gross} == 120000"

      - name: settlement_guarantee_topup_evaluation_order
        grounds:
          - calculations.settlement_gross_pay
          - entities.Settlement.fields.guarantee_top_up_cents
        distinguishing_aspect: |
          Mode (c) circular-looking dependency resolved by pinned evaluation order:
          subtotal (trip_pay + share + adjustment) is computed FIRST excluding the top-up,
