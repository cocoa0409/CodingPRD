  - rule_id: resource_temporal_overlap
    instances:
      - name: adjacent_referral_intervals_legal_but_intersecting_one_rejected
        grounds:
          - calculations.agreement_interval_overlap
          - validations[priority=67]
          - errors[ERR_AGREEMENT_INTERVAL_OVERLAP]
          - state_machines.ReferralAgreement.DRAFT_to_ACTIVE
        distinguishing_aspect: |
          Coverage intervals are half-open [effective_from, effective_to): an agreement starting exactly
          when the ACTIVE one ends activates cleanly, while one starting a month earlier is refused.
          The overlap test also fires only on activate — the DRAFT row is created successfully first,
          proving creation and interval arbitration are separate steps.
        test_recipe:
          setup:
            - "two trauma centers forming one directed referral pair"
            - "agreement A1 covering 2026-01-01 to 2026-07-01 already ACTIVE on that pair"
            - "agreements A2 (2026-07-01 to 2027-01-01) and A3 (2026-06-01 to 2026-08-01) both created as DRAFT on the same directed pair"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "u_admin"
            - call: "POST /trauma-centers"
              payload: { name: "Cedar Fork Trauma", state_code: "IA", designation_level: "LEVEL_III", verification_cycle_start_date: "2026-01-01T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "u_admin"
              captures: { c1: $.data.id }
            - call: "POST /trauma-centers"
              payload: { name: "Statehouse Regional Trauma", state_code: "IA", designation_level: "LEVEL_I", verification_cycle_start_date: "2026-01-01T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "u_admin"
              captures: { c2: $.data.id }
            - call: "POST /referral-agreements"
              payload: { referring_center_id: "${c1}", receiving_center_id: "${c2}", effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-07-01T00:00:00Z", guaranteed_acceptance_minutes: 45 }
              as: TraumaProgramManager
              as_user_id: "${c1}"
              captures: { a1: $.data.id }
            - call: "POST /referral-agreements/${a1}/activate"
              payload: {}
              as: TraumaProgramManager
              as_user_id: "${c2}"
            - call: "POST /referral-agreements"
              payload: { referring_center_id: "${c1}", receiving_center_id: "${c2}", effective_from: "2026-07-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z", guaranteed_acceptance_minutes: 45 }
              as: TraumaProgramManager
              as_user_id: "${c1}"
              captures: { a2: $.data.id }
            - call: "POST /referral-agreements"
              payload: { referring_center_id: "${c1}", receiving_center_id: "${c2}", effective_from: "2026-06-01T00:00:00Z", effective_to: "2026-08-01T00:00:00Z", guaranteed_acceptance_minutes: 45 }
              as: TraumaProgramManager
              as_user_id: "${c1}"
              captures: { a3: $.data.id }
          trigger:
            - call: "POST /referral-agreements/${a2}/activate"
              payload: {}
              as: TraumaProgramManager
              as_user_id: "${c2}"
            - call: "POST /referral-agreements/${a3}/activate"
              payload: {}
              as: TraumaProgramManager
              as_user_id: "${c2}"
              captures: { err_id: $.data.error_id }
          assert:
            - "the A2 activate returns HTTP 200 with ReferralAgreement.${a2}.agreement_status == ACTIVE, because [2026-07-01, 2027-01-01) only touches A1's exclusive upper bound"
            - "the A3 activate returns HTTP 409 with data.error_id == ERR_AGREEMENT_INTERVAL_OVERLAP"
            - "ReferralAgreement.${a3}.agreement_status is still DRAFT with activated_at null"
            - "GET /trauma-centers/${c1}/referral-agreements?agreement_status=ACTIVE returns exactly two agreements, ${a1} and ${a2}"
      - name: surveyor_booking_buffer_rejects_twenty_three_hour_gap
        grounds:
          - calculations.surveyor_window_conflict
          - validations[priority=68]
          - errors[ERR_SURVEYOR_WINDOW_CONFLICT]
          - entities.SurveyorBooking.fields.travel_buffer_hours
        distinguishing_aspect: |
          Surveyor windows are closed intervals padded by TRAVEL_BUFFER_HOURS (24): a booking whose
          window_start is 23 hours after the previous window_end is refused even though the windows do
          not overlap at all, while a start exactly 24 hours later is accepted — the conflict is defined
          by the padded gap, not by raw intersection, which is the opposite convention from the half-open
          agreement intervals above.
        test_recipe:
          setup:
            - "one trauma center with a SUBMITTED NATIONAL_VERIFICATION cycle, since bookings may only be recorded while the cycle is SUBMITTED"
            - "surveyor u_surveyor_1 already booked 2026-09-10T08:00:00Z to 2026-09-10T17:00:00Z with the default travel_buffer_hours of 24"
            - "the clock stands at 2026-08-01T00:00:00Z, so both requested windows are in the future"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "u_admin"
            - call: "POST /trauma-centers"
              payload: { name: "Lakeshore Trauma", state_code: "MI", designation_level: "LEVEL_I", verification_cycle_start_date: "2026-01-01T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "u_admin"
              captures: { c1: $.data.id }
            - call: "POST /verification-cycles"
              payload: { center_id: "${c1}", cycle_type: "NATIONAL_VERIFICATION", site_visit_date: "2026-09-10T13:00:00Z" }
              as: TraumaProgramManager
              as_user_id: "${c1}"
              captures: { cyc: $.data.id }
            - call: "POST /verification-cycles/${cyc}/submit"
              payload: {}
              as: TraumaProgramManager
              as_user_id: "${c1}"
            - call: "POST /verification-cycles/${cyc}/surveyor-bookings"
              payload: { surveyor_user_id: "u_surveyor_1", window_start: "2026-09-10T08:00:00Z", window_end: "2026-09-10T17:00:00Z" }
              as: VerificationReviewer
              as_user_id: "u_reviewer_1"
              captures: { b1: $.data.id }
          trigger:
            - call: "POST /verification-cycles/${cyc}/surveyor-bookings"
              payload: { surveyor_user_id: "u_surveyor_1", window_start: "2026-09-11T16:00:00Z", window_end: "2026-09-11T20:00:00Z" }
              as: VerificationReviewer
              as_user_id: "u_reviewer_1"
              captures: { err_id: $.data.error_id }
            - call: "POST /verification-cycles/${cyc}/surveyor-bookings"
              payload: { surveyor_user_id: "u_surveyor_1", window_start: "2026-09-11T17:00:00Z", window_end: "2026-09-11T20:00:00Z" }
              as: VerificationReviewer
              as_user_id: "u_reviewer_1"
              captures: { b2: $.data.id }
          assert:
            - "the 23 hour gap request returns HTTP 409 with data.error_id == ERR_SURVEYOR_WINDOW_CONFLICT"
            - "the exactly 24 hour gap request returns HTTP 201 with SurveyorBooking.${b2}.travel_buffer_hours == 24"
            - "SurveyorBooking.${b1}.window_end == 2026-09-10T17:00:00Z and SurveyorBooking.${b2}.window_start == 2026-09-11T17:00:00Z"
            - "GET /verification-cycles/${cyc}/surveyor-bookings?surveyor_user_id=u_surveyor_1 returns exactly two bookings"
  - rule_id: compensating_invariant
    instances:
      - name: pi_loop_reopen_restores_open_closed_event_partition
        grounds:
          - state_machines.PIEvent.ACTION_PLANNED_to_LOOP_CLOSED
          - state_machines.PIEvent.LOOP_CLOSED_to_REOPENED
          - entities.TraumaCenter.fields.open_pi_event_count
          - entities.TraumaCenter.fields.closed_pi_event_count
        distinguishing_aspect: |
          open_pi_event_count + closed_pi_event_count is conserved: closing the loop moves the event
          from one bucket to the other and reopening moves it back to exactly the pre-closure values,
          while review_round advances to 2 and closed_at returns to null — the counters are restored
          without the audit history being rewound.
        test_recipe:
          setup:
            - "one trauma center whose only PIEvent is a MANUAL MEDIUM TRANSFER_DELAY event"
            - "the event is walked IDENTIFIED -> UNDER_REVIEW -> ACTION_PLANNED with one CorrectiveAction owned by u_pm_1"
            - "the action is completed and then verified by u_reviewer_1, who is not its owner"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "u_admin"
            - call: "POST /trauma-centers"
              payload: { name: "Elk River Trauma", state_code: "MN", designation_level: "LEVEL_II", verification_cycle_start_date: "2026-01-01T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "u_admin"
              captures: { c1: $.data.id }
            - call: "POST /pi-events"
              payload: { center_id: "${c1}", event_type: "TRANSFER_DELAY", severity: "MEDIUM" }
              as: TraumaMedicalDirector
              as_user_id: "u_director_1"
              captures: { pi: $.data.id }
            - call: "POST /pi-events/${pi}/start-review"
              payload: {}
              as: TraumaMedicalDirector
              as_user_id: "u_director_1"
            - call: "POST /pi-events/${pi}/corrective-actions"
              payload: { action_type: "PROCESS_CHANGE", owner_user_id: "u_pm_1", due_at: "2026-09-01T00:00:00Z" }
              as: TraumaMedicalDirector
              as_user_id: "u_director_1"
              captures: { ca: $.data.id }
            - call: "POST /corrective-actions/${ca}/complete"
              payload: { completion_note: "Transfer checklist rewritten and in service." }
              as: TraumaMedicalDirector
              as_user_id: "u_director_1"
            - call: "POST /corrective-actions/${ca}/verify"
              payload: {}
              as: VerificationReviewer
              as_user_id: "u_reviewer_1"
            - call: "GET /trauma-centers/${c1}"
              payload: {}
              as: TraumaProgramManager
              as_user_id: "${c1}"
              captures: { open_before: $.data.open_pi_event_count, closed_before: $.data.closed_pi_event_count }
          trigger:
            - call: "POST /pi-events/${pi}/close-loop"
              payload: { loop_closure_note: "Loop closed: verified process change with 30 day audit." }
              as: TraumaMedicalDirector
              as_user_id: "u_director_1"
            - call: "POST /pi-events/${pi}/reopen"
              payload: { reopen_reason: "Recurrence found in the following month's audit." }
              as: VerificationReviewer
              as_user_id: "u_reviewer_1"
          assert:
            - "before the closure ${open_before} == 1 and ${closed_before} == 0"
            - "immediately after close-loop, PIEvent.${pi}.status == LOOP_CLOSED, closed_at == 2026-08-01T00:00:00Z, and TraumaCenter.${c1}.open_pi_event_count == 0 with closed_pi_event_count == 1"
            - "after the reopen, TraumaCenter.${c1}.open_pi_event_count == 1 and closed_pi_event_count == 0, exactly the pre-closure partition"
            - "PIEvent.${pi}.status == REOPENED with closed_at null, review_round == 2 and loop_closure_due_at == 2026-08-31T00:00:00Z"
            - "CorrectiveAction.${ca}.completion_status is still VERIFIED and PIEvent.${pi}.verified_action_count == 1 — the reopen compensates the counters, not the action history"
      - name: outreach_rejection_returns_credit_ledger_without_drift
        grounds:
          - calculations.outreach_credit_hour_ledger
          - state_machines.OutreachActivity.VERIFIED_to_REJECTED
          - state_machines.OutreachActivity.REJECTED_to_VERIFIED
          - calculations.verification_readiness_score
        distinguishing_aspect: |
          The credit-hour ledger is recomputed from the VERIFIED set rather than incrementally adjusted,
          so verify -> reject -> verify lands on 1.75, 0.00 and 1.75 exactly, and the dependent cycle
          readiness score returns to 84.62 both times — repeated crossings introduce no rounding drift,
          which an increment/decrement implementation would accumulate on the 1.725 raw value.
        test_recipe:
          setup:
            - "one trauma center with a NATIONAL_VERIFICATION cycle in PREP, no deficiencies and no PI events"
            - "one INJURY_PREVENTION outreach activity of 1.15 credit hours, weighted 1.725 and quantized to 1.75"
            - "outreach_credit_hours_ytd starts at 0.00, so the cycle starts at readiness 82.00"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "u_admin"
            - call: "POST /trauma-centers"
              payload: { name: "Fairhaven Trauma", state_code: "VT", designation_level: "LEVEL_III", verification_cycle_start_date: "2026-01-01T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "u_admin"
              captures: { c1: $.data.id }
            - call: "POST /verification-cycles"
              payload: { center_id: "${c1}", cycle_type: "NATIONAL_VERIFICATION", site_visit_date: "2026-11-05T13:00:00Z" }
              as: TraumaProgramManager
              as_user_id: "${c1}"
              captures: { cyc: $.data.id }
            - call: "POST /trauma-centers/${c1}/outreach-activities"
              payload: { activity_kind: "INJURY_PREVENTION", event_date: "2026-06-14T00:00:00Z", credit_hours: 1.15, audience_count: 60 }
              as: TraumaProgramManager
              as_user_id: "${c1}"
              captures: { oa: $.data.id }
          trigger:
            - call: "POST /outreach-activities/${oa}/verify"
              payload: {}
              as: TraumaMedicalDirector
              as_user_id: "u_director_1"
            - call: "POST /outreach-activities/${oa}/reject"
              payload: { rejection_reason: "Attendance roster could not be produced for audit." }
              as: TraumaMedicalDirector
              as_user_id: "u_director_1"
            - call: "POST /outreach-activities/${oa}/verify"
              payload: {}
              as: TraumaMedicalDirector
              as_user_id: "u_director_1"
          assert:
            - "after the first verify, OutreachActivity.${oa}.weighted_credit_hours == 1.75 and TraumaCenter.${c1}.outreach_credit_hours_ytd == 1.75"
            - "GET /verification-cycles/${cyc}/readiness then reports outreach_penalty == 15.38 and readiness_score == 84.62"
            - "after the reject, TraumaCenter.${c1}.outreach_credit_hours_ytd == 0.00 exactly and GET /verification-cycles/${cyc}/readiness reports outreach_penalty == 18.00 with readiness_score == 82.00"
            - "after the second verify, outreach_credit_hours_ytd == 1.75 again and readiness_score == 84.62 again, with no 0.01 drift in either direction"
            - "OutreachActivity.${oa}.weighted_credit_hours is still 1.75 in every state, since the per-activity quantization does not depend on verified_status"
      - name: transfer_out_rescind_restores_cohort_partition_counters
        grounds:
          - state_machines.RegistryCase.EXCLUDED_to_INCLUDED
          - calculations.case_inclusion_classification
          - entities.TraumaCenter.fields.registry_included_case_count
          - entities.TraumaCenter.fields.registry_excluded_case_count
        distinguishing_aspect: |
          The cohort partition is rebuilt by re-running the classifier rather than by decrementing a
          counter, so rescinding a transfer-out restores included/excluded to 1/0 and resets both
          transfer_out_to_center_id and ed_disposition, while the case version keeps advancing — a
          compensation that reverses derived state without reversing the write history.
        test_recipe:
          setup:
            - "two trauma centers with an ACTIVE ReferralAgreement on the directed pair covering 2026-01-01 to 2027-01-01"
            - "one case at the referring center with los_hours 12.00 and injury_severity_score 5, initially INCLUDED / MEETS_INCLUSION_CRITERIA"
            - "no abstraction exists, so effective_iss stays at the arrival-recorded 5"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "u_admin"
            - call: "POST /trauma-centers"
              payload: { name: "Willow Creek Trauma", state_code: "KS", designation_level: "LEVEL_III", verification_cycle_start_date: "2026-01-01T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "u_admin"
              captures: { c1: $.data.id }
            - call: "POST /trauma-centers"
              payload: { name: "Capitol Regional Trauma", state_code: "KS", designation_level: "LEVEL_I", verification_cycle_start_date: "2026-01-01T00:00:00Z" }
              as: SystemAdmin
              as_user_id: "u_admin"
              captures: { c2: $.data.id }
            - call: "POST /trauma-centers/${c1}/activation-tiers"
              payload: { tier_code: "TIER_2_MODIFIED", surgeon_response_limit_minutes: 30, specialty_response_limit_minutes: 60, iss_threshold: 9 }
              as: TraumaProgramManager
              as_user_id: "${c1}"
              captures: { tier_mod: $.data.id }
            - call: "POST /referral-agreements"
              payload: { referring_center_id: "${c1}", receiving_center_id: "${c2}", effective_from: "2026-01-01T00:00:00Z", effective_to: "2027-01-01T00:00:00Z", guaranteed_acceptance_minutes: 30 }
              as: TraumaProgramManager
              as_user_id: "${c1}"
              captures: { ag: $.data.id }
            - call: "POST /referral-agreements/${ag}/activate"
              payload: {}
              as: TraumaProgramManager
              as_user_id: "${c2}"
            - call: "POST /registry-cases"
              payload: { center_id: "${c1}", activation_tier_id: "${tier_mod}", mrn: "MRN-WC1", arrival_at: "2026-07-10T02:00:00Z", injury_severity_score: 5, los_hours: 12.00, ed_disposition: "ADMIT" }
              as: RegistryAbstractor
              as_user_id: "u_abstractor_1"
              captures: { k1: $.data.id, k1_v: $.data.version }
          trigger:
            - call: "POST /registry-cases/${k1}/transfer-out"
              payload: { transfer_out_to_center_id: "${c2}" }
              as: TraumaProgramManager
              as_user_id: "${c1}"
            - call: "POST /registry-cases/${k1}/transfer-out/rescind"
              payload: { rescind_reason: "Receiving center refused the patient; the transfer never occurred." }
              as: TraumaProgramManager
              as_user_id: "${c1}"
          assert:
            - "before the transfer-out, TraumaCenter.${c1}.registry_included_case_count == 1 and registry_excluded_case_count == 0"
            - "after the transfer-out, RegistryCase.${k1}.inclusion_status == EXCLUDED with inclusion_reason == TRANSFER_OUT_MINOR_UNDER_24H, and the center counters are 0 included / 1 excluded"
            - "after the rescind, RegistryCase.${k1}.inclusion_status == INCLUDED with inclusion_reason == MEETS_INCLUSION_CRITERIA, transfer_out_to_center_id is null and ed_disposition == ADMIT"
            - "the center counters are back to 1 included / 0 excluded, and TraumaCenter.${c1}.under_triage_rate_pct == 0.00 with readiness_posture == READY"
            - "RegistryCase.${k1}.version is strictly greater than ${k1_v} by 2, proving the compensation advanced rather than rewound the write history"
