  # =====================================================================
  # Rule 5 — Validation priority conflicts across different error-category pairs
  # =====================================================================
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: state_vs_business_temporal_publish_overlapping_schedule
        grounds:
          - validations[priority=6]
          - validations[priority=8]
          - errors[ERR_INVALID_STATE]
          - errors[ERR_SCHEDULE_OVERLAP]
        distinguishing_aspect: |
          Pair = state (priority 6) vs business_temporal (priority 8).
          Publishing an already-PUBLISHED schedule violates state, but
          also a schedule that overlaps in time violates temporal.
          The state error must win because priority 6 < 8.
        test_recipe:
          setup:
            - "Category PROF, schedule S1 already PUBLISHED with effective_from=2026-01-01, annual=120000"
            - "Second schedule S2 in DRAFT with overlapping range (effective_from=2026-06-01) — this violates temporal overlap"
            - "First, attempt publish on S1 again — S1 is already PUBLISHED, so state check fires (priority 6)"
          setup_api_calls:
            - call: "POST /api/membership-categories"
              payload: { code: "PROF", name: "P", is_voting: true, is_directory_eligible: true, allows_auto_renew: true, lapse_grace_days: 30, reinstatement_window_days: 90 }
              as: DuesAdministrator
              captures: { cat: $.data.id }
