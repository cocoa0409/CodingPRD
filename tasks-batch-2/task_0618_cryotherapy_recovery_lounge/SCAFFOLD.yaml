    input: []
    output: Location
    side_effects: ["status -> CLOSED"]

  - method: POST
    path: "/locations/{location_id}/open"
    description: "Re-open a closed location"
    roles: [PlatformAdmin, LocationManager]
    code: 200
    input: []
    output: Location
    side_effects: ["status -> OPEN"]

  # ---- Service types (menu) ----
