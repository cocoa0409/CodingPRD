        grounds:
          - "state_machines.Listing.MARKETED_to_WITHDRAWN"
        excluded_because:
          difficulty_instance: listing_withdraw_cancels_open_auction_depth3
          rationale: "The transitive-cascade difficulty instance asserts every hop including rights unlock."
      - name: earnest_forfeiture_deadline_mechanics
        claim_type: side_effect_execution
        grounds:
          - "calculations.earnest_money_requirement"
        excluded_because:
          difficulty_instance: earnest_forfeit_unwinds_award_depth5
          rationale: "LATE and FORFEITED transitions plus the full unwind are asserted there; the exact-grace boundary is covered by emd_forfeit_grace_boundary_not_yet_forfeited in this file."

