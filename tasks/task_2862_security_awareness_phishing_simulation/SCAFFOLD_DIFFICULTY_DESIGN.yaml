# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task 2862 - Security Awareness & Phishing Simulation
# Every rule_id below is verbatim from §0.5; every grounds entry resolves into SCAFFOLD.yaml §1.1-§1.7.
# Logical clock: the server starts at 2026-08-01T00:00:00Z and only POST /awareness/_clock/set_current_utc moves it.

scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: risk_score_provisional_vs_settled_diverge_on_one_employee
        grounds:
          - calculations.employee_risk_score
          - entities.Employee.fields.risk_score_provisional
          - entities.Employee.fields.risk_score_settled
          - calculations.repeat_clicker_tier
          - state_machines.PhishingCampaign.RUNNING_to_CLOSED
          - state_machines.SimulationDelivery.DELIVERED_to_CLICKED
          - state_machines.SimulationDelivery.DELIVERED_to_NO_INTERACTION
        distinguishing_aspect: |
          The two variants of employee_risk_score differ only in which deliveries are in scope: PROVISIONAL
          counts deliveries of RUNNING and CLOSED campaigns and forces settled_no_interaction_deliveries to 0,
          while SETTLED counts only CLOSED-campaign deliveries and pays NO_INTERACTION_CREDIT for them, so one
          employee with one ignored closed simulation and one clicked running simulation reads 11.00 provisional
          and 0.00 settled in the same response.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One VETERAN employee (hire_date 2018-01-01) in ENGINEERING with no assignments at all, so delinquent_assignments == 0."
            - "Campaign A (TIER_1_BASIC, ENGINEERING) launched 2026-08-02T09:00:00Z and CLOSED on 2026-08-02T12:00:00Z with the employee's delivery left untouched, so that delivery is NO_INTERACTION in a CLOSED campaign."
            - "Campaign B (same template, ENGINEERING) launched 2026-08-08T09:00:00Z and still RUNNING, with the employee's delivery CLICKED at 2026-08-08T10:00:00Z."
            - "repeat_clicker_tier is therefore 1 (exactly one failure delivery inside REPEAT_WINDOW_DAYS), which multiplies the penalty by 1.10 in BOTH variants."
          setup_api_calls:
            - { call: "POST /awareness/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /awareness/employees", payload: { email: "vera.teran@corp.example", full_name: "Vera Teran", department: "ENGINEERING", role_code: "ENGINEER", hire_date: "2018-01-01" }, as: ProgramAdmin, captures: { emp: "$.data.id" } }
            - { call: "POST /awareness/phishing-templates", payload: { name: "Package Delivery Notice", pretext_category: "PACKAGE_DELIVERY", difficulty_tier: "TIER_1_BASIC", theme_tags: ["URGENCY"], credential_capture_enabled: false }, as: CampaignAuthor, as_user_id: "author-1", captures: { tpl: "$.data.id" } }
            - { call: "POST /awareness/phishing-templates/${tpl}/approve-for-use", payload: {}, as: CampaignApprover, as_user_id: "approver-1" }
            - { call: "POST /awareness/campaigns", payload: { name: "Aug Wave 1 ENG", template_id: "${tpl}", difficulty_tier: "TIER_1_BASIC", target_departments: ["ENGINEERING"], communication_policy_ack: true }, as: CampaignAuthor, as_user_id: "author-1", captures: { ca: "$.data.id" } }
            - { call: "POST /awareness/campaigns/${ca}/submit-for-review", payload: {}, as: CampaignAuthor, as_user_id: "author-1" }
            - { call: "POST /awareness/campaigns/${ca}/approve", payload: {}, as: CampaignApprover, as_user_id: "approver-1", captures: { ca_v: "$.data.version" } }
            - { call: "POST /awareness/campaigns/${ca}/schedule", payload: { scheduled_send_at: "2026-08-02T09:00:00Z", expected_campaign_version: "${ca_v}" }, as: CampaignAuthor, as_user_id: "author-1" }
            - { call: "POST /awareness/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T09:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /awareness/campaigns/${ca}/launch", payload: {}, as: ProgramAdmin }
            - { call: "POST /awareness/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T12:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /awareness/campaigns/${ca}/close", payload: { debrief_note: "Wave 1 baseline: no interaction observed." }, as: ProgramAdmin }
            - { call: "POST /awareness/campaigns", payload: { name: "Aug Wave 2 ENG", template_id: "${tpl}", difficulty_tier: "TIER_1_BASIC", target_departments: ["ENGINEERING"], communication_policy_ack: true }, as: CampaignAuthor, as_user_id: "author-1", captures: { cb: "$.data.id" } }
            - { call: "POST /awareness/campaigns/${cb}/submit-for-review", payload: {}, as: CampaignAuthor, as_user_id: "author-1" }
            - { call: "POST /awareness/campaigns/${cb}/approve", payload: {}, as: CampaignApprover, as_user_id: "approver-1", captures: { cb_v: "$.data.version" } }
            - { call: "POST /awareness/campaigns/${cb}/schedule", payload: { scheduled_send_at: "2026-08-08T09:00:00Z", expected_campaign_version: "${cb_v}" }, as: CampaignAuthor, as_user_id: "author-1" }
            - { call: "POST /awareness/_clock/set_current_utc", payload: { to_iso8601: "2026-08-08T09:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /awareness/campaigns/${cb}/launch", payload: {}, as: ProgramAdmin }
            - { call: "POST /awareness/_clock/set_current_utc", payload: { to_iso8601: "2026-08-08T10:00:00Z" }, as: ProgramAdmin }
            - { call: "GET /awareness/simulation-deliveries", payload: { campaign_id: "${cb}", employee_id: "${emp}" }, as: ProgramAdmin, captures: { dlv_b: "$.data[0].id" } }
            - { call: "POST /awareness/simulation-deliveries/${dlv_b}/interactions", payload: { event_type: "CLICK", occurred_at: "2026-08-08T10:00:00Z", source: "LANDING_PAGE" }, as: ProgramAdmin }
          trigger:
            - { call: "GET /awareness/employees/${emp}", payload: {}, as: ProgramAdmin }
          assert:
            - "Employee.${emp}.tenure_band == VETERAN"
            - "Employee.${emp}.repeat_clicker_tier == 1"
            - "Employee.${emp}.risk_score_provisional == 11.00"
            - "Employee.${emp}.risk_score_settled == 0.00"
            - "the two variant fields differ by exactly 11.00 in one and the same GET response"

      - name: effectiveness_correlation_concurrent_vs_lagged_diverge
        grounds:
          - calculations.program_effectiveness_correlation
          - entities.IncidentRecord.fields.phish_related
          - entities.PhishingCampaign.fields.closed_at
          - calculations.campaign_scorecard_rates
          - validations[priority=29]
        distinguishing_aspect: |
          This dual-variant pair lives in a different entity domain than the risk-score pair: it correlates the
          program's monthly report_rate series against phish-related IncidentRecord volume, and CONCURRENT pairs
          bucket b's rate with bucket b's own incident count (3 pairs, r == 0.5000) while LAGGED pairs it with
          bucket b+1's count and drops the final bucket (2 pairs, r == -1.0000) over byte-identical data.
        test_recipe:
          setup:
            - "Two VETERAN ENGINEERING employees, so every campaign resolves a 2-member cohort."
            - "Three campaigns closed one per month: March (1 of 2 delivery reported -> report_rate 0.5000), April (2 of 2 -> 1.0000), May (0 of 2 -> 0.0000)."
            - "Phish-related incidents: 2 in March (CREDENTIAL_PHISH, BEC), 1 in April (CREDENTIAL_PHISH), 0 in May."
            - "Report window [2026-03-01T00:00:00Z, 2026-06-01T00:00:00Z) therefore yields exactly the three monthly buckets March, April, May."
          setup_api_calls:
            - { call: "POST /awareness/_clock/set_current_utc", payload: { to_iso8601: "2026-03-01T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /awareness/employees", payload: { email: "e1.corr@corp.example", full_name: "Ana Ruiz", department: "ENGINEERING", role_code: "ENGINEER", hire_date: "2018-01-01" }, as: ProgramAdmin, captures: { e1: "$.data.id" } }
            - { call: "POST /awareness/employees", payload: { email: "e2.corr@corp.example", full_name: "Ben Cole", department: "ENGINEERING", role_code: "ENGINEER", hire_date: "2018-02-01" }, as: ProgramAdmin, captures: { e2: "$.data.id" } }
            - { call: "POST /awareness/phishing-templates", payload: { name: "Shared Document Invite", pretext_category: "SHARED_DOCUMENT", difficulty_tier: "TIER_1_BASIC", theme_tags: ["CURIOSITY"], credential_capture_enabled: false }, as: CampaignAuthor, as_user_id: "author-1", captures: { tpl: "$.data.id" } }
            - { call: "POST /awareness/phishing-templates/${tpl}/approve-for-use", payload: {}, as: CampaignApprover, as_user_id: "approver-1" }
            - { call: "POST /awareness/campaigns", payload: { name: "March Wave", template_id: "${tpl}", difficulty_tier: "TIER_1_BASIC", target_departments: ["ENGINEERING"], communication_policy_ack: true }, as: CampaignAuthor, as_user_id: "author-1", captures: { cm: "$.data.id" } }
            - { call: "POST /awareness/campaigns/${cm}/submit-for-review", payload: {}, as: CampaignAuthor, as_user_id: "author-1" }
            - { call: "POST /awareness/campaigns/${cm}/approve", payload: {}, as: CampaignApprover, as_user_id: "approver-1", captures: { cm_v: "$.data.version" } }
            - { call: "POST /awareness/campaigns/${cm}/schedule", payload: { scheduled_send_at: "2026-03-10T09:00:00Z", expected_campaign_version: "${cm_v}" }, as: CampaignAuthor, as_user_id: "author-1" }
            - { call: "POST /awareness/_clock/set_current_utc", payload: { to_iso8601: "2026-03-10T09:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /awareness/campaigns/${cm}/launch", payload: {}, as: ProgramAdmin }
            - { call: "POST /awareness/_clock/set_current_utc", payload: { to_iso8601: "2026-03-10T10:00:00Z" }, as: ProgramAdmin }
            - { call: "GET /awareness/simulation-deliveries", payload: { campaign_id: "${cm}", employee_id: "${e1}" }, as: ProgramAdmin, captures: { dm1: "$.data[0].id" } }
            - { call: "POST /awareness/simulation-deliveries/${dm1}/interactions", payload: { event_type: "REPORT", occurred_at: "2026-03-10T10:00:00Z", source: "REPORT_BUTTON" }, as: ProgramAdmin }
            - { call: "POST /awareness/_clock/set_current_utc", payload: { to_iso8601: "2026-03-15T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /awareness/campaigns/${cm}/close", payload: { debrief_note: "March wave debrief." }, as: ProgramAdmin }
            - { call: "POST /awareness/incidents", payload: { incident_type: "CREDENTIAL_PHISH", severity: "HIGH", department: "ENGINEERING", occurred_at: "2026-03-05T08:00:00Z", summary: "Real credential phish, engineering." }, as: SecurityAnalyst }
            - { call: "POST /awareness/incidents", payload: { incident_type: "BEC", severity: "MEDIUM", department: "ENGINEERING", occurred_at: "2026-03-20T08:00:00Z", summary: "Real BEC attempt, engineering." }, as: SecurityAnalyst }
            - { call: "POST /awareness/campaigns", payload: { name: "April Wave", template_id: "${tpl}", difficulty_tier: "TIER_1_BASIC", target_departments: ["ENGINEERING"], communication_policy_ack: true }, as: CampaignAuthor, as_user_id: "author-1", captures: { ca2: "$.data.id" } }
            - { call: "POST /awareness/campaigns/${ca2}/submit-for-review", payload: {}, as: CampaignAuthor, as_user_id: "author-1" }
            - { call: "POST /awareness/campaigns/${ca2}/approve", payload: {}, as: CampaignApprover, as_user_id: "approver-1", captures: { ca2_v: "$.data.version" } }
            - { call: "POST /awareness/campaigns/${ca2}/schedule", payload: { scheduled_send_at: "2026-04-10T09:00:00Z", expected_campaign_version: "${ca2_v}" }, as: CampaignAuthor, as_user_id: "author-1" }
            - { call: "POST /awareness/_clock/set_current_utc", payload: { to_iso8601: "2026-04-10T09:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /awareness/campaigns/${ca2}/launch", payload: {}, as: ProgramAdmin }
            - { call: "POST /awareness/_clock/set_current_utc", payload: { to_iso8601: "2026-04-10T10:00:00Z" }, as: ProgramAdmin }
            - { call: "GET /awareness/simulation-deliveries", payload: { campaign_id: "${ca2}", employee_id: "${e1}" }, as: ProgramAdmin, captures: { da1: "$.data[0].id" } }
            - { call: "POST /awareness/simulation-deliveries/${da1}/interactions", payload: { event_type: "REPORT", occurred_at: "2026-04-10T10:00:00Z", source: "REPORT_BUTTON" }, as: ProgramAdmin }
            - { call: "GET /awareness/simulation-deliveries", payload: { campaign_id: "${ca2}", employee_id: "${e2}" }, as: ProgramAdmin, captures: { da2: "$.data[0].id" } }
            - { call: "POST /awareness/simulation-deliveries/${da2}/interactions", payload: { event_type: "REPORT", occurred_at: "2026-04-10T10:00:00Z", source: "REPORT_BUTTON" }, as: ProgramAdmin }
            - { call: "POST /awareness/_clock/set_current_utc", payload: { to_iso8601: "2026-04-15T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /awareness/campaigns/${ca2}/close", payload: { debrief_note: "April wave debrief." }, as: ProgramAdmin }
            - { call: "POST /awareness/incidents", payload: { incident_type: "CREDENTIAL_PHISH", severity: "HIGH", department: "ENGINEERING", occurred_at: "2026-04-18T08:00:00Z", summary: "Real credential phish, april." }, as: SecurityAnalyst }
            - { call: "POST /awareness/campaigns", payload: { name: "May Wave", template_id: "${tpl}", difficulty_tier: "TIER_1_BASIC", target_departments: ["ENGINEERING"], communication_policy_ack: true }, as: CampaignAuthor, as_user_id: "author-1", captures: { cy: "$.data.id" } }
            - { call: "POST /awareness/campaigns/${cy}/submit-for-review", payload: {}, as: CampaignAuthor, as_user_id: "author-1" }
            - { call: "POST /awareness/campaigns/${cy}/approve", payload: {}, as: CampaignApprover, as_user_id: "approver-1", captures: { cy_v: "$.data.version" } }
            - { call: "POST /awareness/campaigns/${cy}/schedule", payload: { scheduled_send_at: "2026-05-12T09:00:00Z", expected_campaign_version: "${cy_v}" }, as: CampaignAuthor, as_user_id: "author-1" }
            - { call: "POST /awareness/_clock/set_current_utc", payload: { to_iso8601: "2026-05-12T09:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /awareness/campaigns/${cy}/launch", payload: {}, as: ProgramAdmin }
            - { call: "POST /awareness/_clock/set_current_utc", payload: { to_iso8601: "2026-05-20T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /awareness/campaigns/${cy}/close", payload: { debrief_note: "May wave debrief: silence everywhere." }, as: ProgramAdmin }
          trigger:
            - { call: "GET /awareness/effectiveness-report", payload: { period_start: "2026-03-01T00:00:00Z", period_end: "2026-06-01T00:00:00Z", variant: "CONCURRENT" }, as: SecurityAnalyst, captures: { r_concurrent: "$.data.correlation", n_concurrent: "$.data.pair_count" } }
            - { call: "GET /awareness/effectiveness-report", payload: { period_start: "2026-03-01T00:00:00Z", period_end: "2026-06-01T00:00:00Z", variant: "LAGGED" }, as: SecurityAnalyst, captures: { r_lagged: "$.data.correlation", n_lagged: "$.data.pair_count" } }
          assert:
            - "the CONCURRENT response has pair_count == 3 and correlation == 0.5000"
            - "the LAGGED response has pair_count == 2 and correlation == -1.0000"
            - "the CONCURRENT response has total_incidents == 3"
            - "both responses report the same three monthly buckets with report_rate 0.5000 (2026-03), 1.0000 (2026-04) and 0.0000 (2026-05)"
            - "correlation_reason_code is null in both responses (neither INSUFFICIENT_PAIRS nor ZERO_VARIANCE applies)"

  - rule_id: combinatorial_formula
    instances:
      - name: difficulty_escalation_nested_max_then_min_with_newhire_cap
        grounds:
          - calculations.simulation_difficulty_escalation
          - entities.SimulationDelivery.fields.effective_difficulty_tier
          - entities.SimulationDelivery.fields.base_difficulty_tier
          - entities.Employee.fields.tenure_band
          - calculations.employee_tenure_band
          - calculations.cohort_resolution
          - state_machines.PhishingCampaign.APPROVED_to_SCHEDULED
        distinguishing_aspect: |
          Mode (a): a nested max-then-min composition over four inputs (campaign.difficulty_tier,
          Employee.repeat_clicker_tier, Employee.consecutive_clean_simulations, Employee.tenure_band) evaluated
          in the pinned order max -> global MAX_RANK cap -> NEW_HIRE_RANK_CAP, so one and the same TIER_3_SPEAR
          campaign freezes TIER_3_SPEAR onto the VETERAN's delivery and TIER_2_TARGETED onto the NEW_HIRE's.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Employee NEW (hire_date 2026-07-20, 12 days of tenure -> NEW_HIRE) and employee VET (hire_date 2018-01-01 -> VETERAN), both ENGINEERING, both with repeat_clicker_tier 0 and consecutive_clean_simulations 0."
            - "A TIER_3_SPEAR template APPROVED_FOR_USE and a TIER_3_SPEAR campaign targeting ENGINEERING, in state APPROVED."
          setup_api_calls:
            - { call: "POST /awareness/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /awareness/employees", payload: { email: "nina.new@corp.example", full_name: "Nina New", department: "ENGINEERING", role_code: "ENGINEER", hire_date: "2026-07-20" }, as: ProgramAdmin, captures: { e_new: "$.data.id" } }
            - { call: "POST /awareness/employees", payload: { email: "val.vet@corp.example", full_name: "Val Vetera", department: "ENGINEERING", role_code: "ENGINEER", hire_date: "2018-01-01" }, as: ProgramAdmin, captures: { e_vet: "$.data.id" } }
            - { call: "POST /awareness/phishing-templates", payload: { name: "Exec Urgent Wire Review", pretext_category: "EXEC_URGENT_REQUEST", difficulty_tier: "TIER_3_SPEAR", theme_tags: ["AUTHORITY", "URGENCY"], credential_capture_enabled: false }, as: CampaignAuthor, as_user_id: "author-1", captures: { tpl: "$.data.id" } }
            - { call: "POST /awareness/phishing-templates/${tpl}/approve-for-use", payload: {}, as: CampaignApprover, as_user_id: "approver-1" }
            - { call: "POST /awareness/campaigns", payload: { name: "Spear Wave ENG", template_id: "${tpl}", difficulty_tier: "TIER_3_SPEAR", target_departments: ["ENGINEERING"], communication_policy_ack: true }, as: CampaignAuthor, as_user_id: "author-1", captures: { c: "$.data.id" } }
            - { call: "POST /awareness/campaigns/${c}/submit-for-review", payload: {}, as: CampaignAuthor, as_user_id: "author-1" }
            - { call: "POST /awareness/campaigns/${c}/approve", payload: {}, as: CampaignApprover, as_user_id: "approver-1", captures: { c_v: "$.data.version" } }
          trigger:
            - { call: "POST /awareness/campaigns/${c}/schedule", payload: { scheduled_send_at: "2026-08-05T09:00:00Z", expected_campaign_version: "${c_v}" }, as: CampaignAuthor, as_user_id: "author-1" }
            - { call: "GET /awareness/simulation-deliveries", payload: { campaign_id: "${c}", employee_id: "${e_new}" }, as: ProgramAdmin, captures: { d_new: "$.data[0].id", d_new_tier: "$.data[0].effective_difficulty_tier" } }
            - { call: "GET /awareness/simulation-deliveries", payload: { campaign_id: "${c}", employee_id: "${e_vet}" }, as: ProgramAdmin, captures: { d_vet: "$.data[0].id", d_vet_tier: "$.data[0].effective_difficulty_tier" } }
          assert:
            - "PhishingCampaign.${c}.state == SCHEDULED"
            - "PhishingCampaign.${c}.target_count == 2 and PhishingCampaign.${c}.evaluable_count == 2"
            - "SimulationDelivery.${d_vet}.base_difficulty_tier == TIER_3_SPEAR"
            - "SimulationDelivery.${d_vet}.effective_difficulty_tier == TIER_3_SPEAR"
            - "SimulationDelivery.${d_new}.base_difficulty_tier == TIER_3_SPEAR"
            - "SimulationDelivery.${d_new}.effective_difficulty_tier == TIER_2_TARGETED"
            - "Employee.${e_new}.tenure_band == NEW_HIRE and Employee.${e_new}.reserved_simulation_slots == 1"
            - "Employee.${e_vet}.tenure_band == VETERAN and Employee.${e_vet}.reserved_simulation_slots == 1"

      - name: scorecard_rates_divide_then_round_never_average_segments
        grounds:
          - calculations.campaign_scorecard_rates
          - entities.PhishingCampaign.fields.click_rate
          - entities.PhishingCampaign.fields.report_rate
          - entities.PhishingCampaign.fields.resilience_ratio
          - entities.SimulationDelivery.fields.outcome_class
          - state_machines.SimulationDelivery.DELIVERED_to_CLICKED
        distinguishing_aspect: |
          Mode (b): the rounding ORDER is what the formula pins - raw counts are divided once and the quotient is
          rounded once to RATE_DECIMALS, so 1 click over 3 evaluable deliveries is 0.3333 program-wide, never the
          0.2500 that averaging the department rates 0.5000 and 0.0000 would produce.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "Three ACTIVE employees: two in ENGINEERING, one in FINANCE, all VETERAN and all repeat_clicker_tier 0."
            - "One campaign with no department filter, launched 2026-08-02T09:00:00Z, so all three employees hold DELIVERED deliveries."
            - "Exactly one ENGINEERING employee clicks at 2026-08-02T10:00:00Z; nobody reports and nobody submits credentials."
          setup_api_calls:
            - { call: "POST /awareness/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /awareness/employees", payload: { email: "s1@corp.example", full_name: "Sam One", department: "ENGINEERING", role_code: "ENGINEER", hire_date: "2018-01-01" }, as: ProgramAdmin, captures: { s1: "$.data.id" } }
            - { call: "POST /awareness/employees", payload: { email: "s2@corp.example", full_name: "Sue Two", department: "ENGINEERING", role_code: "ENGINEER", hire_date: "2018-01-02" }, as: ProgramAdmin, captures: { s2: "$.data.id" } }
            - { call: "POST /awareness/employees", payload: { email: "s3@corp.example", full_name: "Sid Three", department: "FINANCE", role_code: "FINANCE_APPROVER", hire_date: "2018-01-03" }, as: ProgramAdmin, captures: { s3: "$.data.id" } }
            - { call: "POST /awareness/phishing-templates", payload: { name: "IT Password Reset", pretext_category: "IT_PASSWORD_RESET", difficulty_tier: "TIER_1_BASIC", theme_tags: ["URGENCY"], credential_capture_enabled: false }, as: CampaignAuthor, as_user_id: "author-1", captures: { tpl: "$.data.id" } }
            - { call: "POST /awareness/phishing-templates/${tpl}/approve-for-use", payload: {}, as: CampaignApprover, as_user_id: "approver-1" }
            - { call: "POST /awareness/campaigns", payload: { name: "Company Wide Wave", template_id: "${tpl}", difficulty_tier: "TIER_1_BASIC", communication_policy_ack: true }, as: CampaignAuthor, as_user_id: "author-1", captures: { c: "$.data.id" } }
            - { call: "POST /awareness/campaigns/${c}/submit-for-review", payload: {}, as: CampaignAuthor, as_user_id: "author-1" }
            - { call: "POST /awareness/campaigns/${c}/approve", payload: {}, as: CampaignApprover, as_user_id: "approver-1", captures: { c_v: "$.data.version" } }
            - { call: "POST /awareness/campaigns/${c}/schedule", payload: { scheduled_send_at: "2026-08-02T09:00:00Z", expected_campaign_version: "${c_v}" }, as: CampaignAuthor, as_user_id: "author-1" }
            - { call: "POST /awareness/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T09:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /awareness/campaigns/${c}/launch", payload: {}, as: ProgramAdmin }
            - { call: "POST /awareness/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T10:00:00Z" }, as: ProgramAdmin }
            - { call: "GET /awareness/simulation-deliveries", payload: { campaign_id: "${c}", employee_id: "${s1}" }, as: ProgramAdmin, captures: { d1: "$.data[0].id" } }
            - { call: "POST /awareness/simulation-deliveries/${d1}/interactions", payload: { event_type: "CLICK", occurred_at: "2026-08-02T10:00:00Z", source: "LANDING_PAGE" }, as: ProgramAdmin }
          trigger:
            - { call: "GET /awareness/campaigns/${c}/scorecard", payload: { segment_by: "DEPARTMENT" }, as: SecurityAnalyst, captures: { prog_click_rate: "$.data.click_rate" } }
          assert:
            - "scorecard.evaluable_count == 3 and scorecard.excluded_count == 0"
            - "scorecard.click_rate == 0.3333"
            - "scorecard.click_rate != 0.2500 (the value a round-then-average implementation returns)"
            - "scorecard.report_rate == 0.0000 and scorecard.credential_rate == 0.0000"
            - "scorecard.resilience_ratio == 0.0000 (0 reports over max(1, 1 click))"
            - "the ENGINEERING segment has click_rate == 0.5000 and the FINANCE segment has click_rate == 0.0000"
            - "SimulationDelivery.${d1}.outcome_class == CLICKED_NO_REPORT"

      - name: access_consequence_severity_pinned_order_breaks_circularity
        grounds:
          - calculations.access_consequence_severity
          - entities.AccessConsequence.fields.severity_rank
          - entities.Employee.fields.access_posture
          - entities.Employee.fields.active_suspension_count
          - concurrency_rules[access-consequence-create-stale-employee]
          - state_machines.Employee.access_posture=NONE_to_access_posture=WARNED
        distinguishing_aspect: |
          Mode (c): the formula looks circular - the new row's severity depends on the employee's posture, which
          depends on the set of ACTIVE rows including the new one - and is resolved by the five pinned steps in
          which step 1 deliberately EXCLUDES the row being created, so a second derived consequence on a WARNED
          employee lands on rank 2 (MFA_REVIEW), not rank 1 again and not rank 3.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One ACTIVE employee with no assignments, whose first derived access consequence has already been applied, leaving one ACTIVE WARNING row (severity_rank 1) and access_posture WARNED."
          setup_api_calls:
            - { call: "POST /awareness/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /awareness/employees", payload: { email: "cara.consequence@corp.example", full_name: "Cara Cons", department: "SALES", role_code: "IC", hire_date: "2019-05-06" }, as: ProgramAdmin, captures: { e: "$.data.id", e_v1: "$.data.version" } }
            - { call: "POST /awareness/employees/${e}/access-consequences", payload: { reason_code: "MISSED_ANNUAL_TRAINING", expected_employee_version: "${e_v1}" }, as: ProgramAdmin, captures: { ac1: "$.data.id" } }
            - { call: "GET /awareness/employees/${e}", payload: {}, as: ProgramAdmin, captures: { e_v2: "$.data.version" } }
          trigger:
            - { call: "POST /awareness/employees/${e}/access-consequences", payload: { reason_code: "SECOND_MISSED_MODULE", expected_employee_version: "${e_v2}" }, as: ProgramAdmin, captures: { ac2: "$.data.id", ac2_rank: "$.data.severity_rank" } }
            - { call: "GET /awareness/access-consequences", payload: { employee_id: "${e}", state: "ACTIVE" }, as: ProgramAdmin }
            - { call: "GET /awareness/employees/${e}", payload: {}, as: ProgramAdmin }
          assert:
            - "AccessConsequence.${ac2}.consequence_type == MFA_REVIEW"
            - "AccessConsequence.${ac2}.severity_rank == 2"
            - "AccessConsequence.${ac2}.state == ACTIVE"
            - "AccessConsequence.${ac1}.state == ACTIVE and AccessConsequence.${ac1}.severity_rank == 1 (a different consequence_type is never superseded)"
            - "the ACTIVE list for ${e} contains exactly 2 rows"
            - "Employee.${e}.access_posture == ELEVATED_REVIEW"
            - "Employee.${e}.active_suspension_count == 0"
            - "Employee.${e}.risk_score_provisional == 0.00 and Employee.${e}.risk_score_settled == 0.00 (access consequences carry no risk weight)"

  - rule_id: non_linear_state_machine
    instances:
      - name: assignment_cycles_in_progress_failed_attempt_and_back
        grounds:
          - state_machines.CurriculumAssignment.IN_PROGRESS_to_FAILED_ATTEMPT
          - state_machines.CurriculumAssignment.FAILED_ATTEMPT_to_IN_PROGRESS
          - state_machines.CurriculumAssignment.IN_PROGRESS_to_COMPLETED
          - entities.CurriculumAssignment.fields.attempt_count
          - entities.CurriculumAssignment.fields.last_score_pct
          - endpoints[POST /awareness/curriculum-assignments/{id}/retake]
        distinguishing_aspect: |
          The cycle IN_PROGRESS -> FAILED_ATTEMPT -> IN_PROGRESS re-enters a state the assignment already
          occupied, so no monotone state ordering exists; attempt_count is the only witness that the loop ran,
          and the second visit to IN_PROGRESS behaves differently from the first (a submit from it can now
          complete an assignment that already carries last_score_pct 55).
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "A PUBLISHED ANNUAL module with passing_score_pct 80."
            - "One ACTIVE employee holding an ANNUAL assignment for that module, already started (IN_PROGRESS, attempt_count 0)."
          setup_api_calls:
            - { call: "POST /awareness/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /awareness/employees", payload: { email: "lena.learner@corp.example", full_name: "Lena Learner", department: "SALES", role_code: "IC", hire_date: "2020-03-04" }, as: ProgramAdmin, captures: { e: "$.data.id", e_v: "$.data.version" } }
            - { call: "POST /awareness/training-modules", payload: { code: "ANNUAL-SEC-2026", title: "Annual Security Awareness 2026", module_type: "ANNUAL", passing_score_pct: 80 }, as: ProgramAdmin, captures: { m: "$.data.id" } }
            - { call: "POST /awareness/training-modules/${m}/publish", payload: {}, as: ProgramAdmin }
            - { call: "POST /awareness/curriculum-assignments", payload: { employee_id: "${e}", module_id: "${m}", assignment_reason: "ANNUAL", expected_employee_version: "${e_v}" }, as: ProgramAdmin, captures: { a: "$.data.id" } }
            - { call: "POST /awareness/curriculum-assignments/${a}/start", payload: {}, as: Learner, as_user_id: "${e}" }
          trigger:
            - { call: "POST /awareness/curriculum-assignments/${a}/submit", payload: { score_pct: 55 }, as: Learner, as_user_id: "${e}", captures: { s1_state: "$.data.state", s1_attempts: "$.data.attempt_count" } }
            - { call: "POST /awareness/curriculum-assignments/${a}/retake", payload: {}, as: Learner, as_user_id: "${e}", captures: { s2_state: "$.data.state" } }
            - { call: "POST /awareness/curriculum-assignments/${a}/submit", payload: { score_pct: 88 }, as: Learner, as_user_id: "${e}", captures: { s3_state: "$.data.state" } }
          assert:
            - "after the failing submit: CurriculumAssignment.${a}.state == FAILED_ATTEMPT, attempt_count == 1, last_score_pct == 55, completed_at == null"
            - "after the retake: CurriculumAssignment.${a}.state == IN_PROGRESS, attempt_count == 1 (retake does not count as an attempt), last_score_pct == 55 (retained across the loop)"
            - "after the passing submit: CurriculumAssignment.${a}.state == COMPLETED, attempt_count == 2, last_score_pct == 88, completed_at == 2026-08-01T00:00:00Z"
            - "Employee.${e}.compliance_state == COMPLIANT and Employee.${e}.risk_score_provisional == 0.00"
            - "a further POST /awareness/curriculum-assignments/${a}/retake returns ERR_ASSIGNMENT_STATE_INVALID (409) because COMPLETED is terminal"

      - name: employee_parallel_axes_move_independently
        grounds:
          - state_machines.Employee
          - entities.Employee.fields.employment_status
          - entities.Employee.fields.compliance_state
          - entities.Employee.fields.access_posture
          - calculations.employee_compliance_state
          - calculations.access_consequence_severity
          - endpoints[POST /awareness/access-consequences/{id}/lift]
        distinguishing_aspect: |
          Employee is a parallel machine over three independent axes (employment_status, compliance_state,
          access_posture) whose combined state is not a single path: lifting the access consequence walks the
          access axis all the way back to NONE while the compliance axis stays DELINQUENT and employment stays
          ACTIVE, a combination no linear state ordering can express.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "A MANAGER employee and one ACTIVE direct report."
            - "The report holds an ANNUAL assignment due 2026-08-31T00:00:00Z."
            - "The clock is advanced to 2026-09-08T00:00:00Z (8 days overdue) and one compliance sweep is run, which sends the level-1 and level-2 notices, applies an MFA_REVIEW consequence and drives the report to ELEVATED_REVIEW / DELINQUENT."
          setup_api_calls:
            - { call: "POST /awareness/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /awareness/employees", payload: { email: "mona.manager@corp.example", full_name: "Mona Manager", department: "SALES", role_code: "MANAGER", hire_date: "2015-02-02" }, as: ProgramAdmin, captures: { mgr: "$.data.id" } }
            - { call: "POST /awareness/employees", payload: { email: "ray.report@corp.example", full_name: "Ray Report", department: "SALES", role_code: "IC", hire_date: "2019-06-06", manager_id: "${mgr}" }, as: ProgramAdmin, captures: { e: "$.data.id", e_v: "$.data.version" } }
            - { call: "POST /awareness/training-modules", payload: { code: "ANNUAL-SEC-B", title: "Annual Security Awareness B", module_type: "ANNUAL" }, as: ProgramAdmin, captures: { m: "$.data.id" } }
            - { call: "POST /awareness/training-modules/${m}/publish", payload: {}, as: ProgramAdmin }
            - { call: "POST /awareness/curriculum-assignments", payload: { employee_id: "${e}", module_id: "${m}", assignment_reason: "ANNUAL", expected_employee_version: "${e_v}" }, as: ProgramAdmin, captures: { a: "$.data.id" } }
            - { call: "POST /awareness/_clock/set_current_utc", payload: { to_iso8601: "2026-09-08T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /awareness/compliance-sweeps", payload: {}, as: ProgramAdmin }
            - { call: "GET /awareness/access-consequences", payload: { employee_id: "${e}", state: "ACTIVE" }, as: ProgramAdmin, captures: { ac: "$.data[0].id", ac_type: "$.data[0].consequence_type" } }
          trigger:
            - { call: "POST /awareness/access-consequences/${ac}/lift", payload: { lift_reason_code: "MANUAL_LIFT" }, as: ProgramAdmin }
            - { call: "GET /awareness/employees/${e}", payload: {}, as: ProgramAdmin, captures: { posture_after: "$.data.access_posture", compliance_after: "$.data.compliance_state" } }
            - { call: "GET /awareness/curriculum-assignments/${a}", payload: {}, as: ProgramAdmin }
          assert:
            - "before the lift: Employee.${e}.access_posture == ELEVATED_REVIEW, compliance_state == DELINQUENT, employment_status == ACTIVE"
            - "AccessConsequence.${ac}.consequence_type == MFA_REVIEW and after the lift its state == LIFTED with lift_reason_code == MANUAL_LIFT and lifted_at == 2026-09-08T00:00:00Z"
            - "after the lift: Employee.${e}.access_posture == NONE (no ACTIVE rows remain, so post_rank is 0)"
            - "after the lift: Employee.${e}.compliance_state == DELINQUENT (the compliance axis did not move)"
            - "after the lift: Employee.${e}.employment_status == ACTIVE (the employment axis did not move)"
            - "CurriculumAssignment.${a}.state == ESCALATED and escalation_level == 2 (lifting a consequence is not remediation)"
            - "Employee.${e}.active_suspension_count == 0 and Employee.${e}.risk_score_provisional == 8.00"

  - rule_id: transitive_cascade
    instances:
      - name: sweep_cascade_overdue_to_notice_to_consequence_to_posture
        grounds:
          - state_machines.CurriculumAssignment.OVERDUE_to_ESCALATED
          - calculations.escalation_ladder
          - calculations.access_consequence_severity
          - calculations.employee_compliance_state
          - entities.EscalationNotice.fields.level
          - entities.Employee.fields.access_posture
          - endpoints[POST /awareness/compliance-sweeps]
        distinguishing_aspect: |
          One sweep call fires a four-hop chain across four entity kinds - assignment OVERDUE -> ESCALATED
          (hop 1) -> EscalationNotice created (hop 2) -> AccessConsequence applied because the notice level is
          >= 2 (hop 3) -> Employee.access_posture and active_suspension_count recomputed (hop 4) - and every
          intermediate hop is observable, including the level-1 notice that deliberately produces no consequence.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "A MANAGER employee and one ACTIVE direct report with an ANNUAL assignment due 2026-08-31T00:00:00Z, untouched by the learner."
            - "The clock is advanced to 2026-09-08T00:00:00Z, making the assignment 8 days overdue (>= ESCALATION_L2_DAYS 7, < ESCALATION_L3_DAYS 14)."
          setup_api_calls:
            - { call: "POST /awareness/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /awareness/employees", payload: { email: "cass.mgr@corp.example", full_name: "Cass Chain", department: "IT", role_code: "MANAGER", hire_date: "2014-04-04" }, as: ProgramAdmin, captures: { mgr: "$.data.id" } }
            - { call: "POST /awareness/employees", payload: { email: "dana.report@corp.example", full_name: "Dana Down", department: "IT", role_code: "IT_ADMIN", hire_date: "2017-07-07", manager_id: "${mgr}" }, as: ProgramAdmin, captures: { e: "$.data.id", e_v: "$.data.version" } }
            - { call: "POST /awareness/training-modules", payload: { code: "ANNUAL-SEC-C", title: "Annual Security Awareness C", module_type: "ANNUAL" }, as: ProgramAdmin, captures: { m: "$.data.id" } }
            - { call: "POST /awareness/training-modules/${m}/publish", payload: {}, as: ProgramAdmin }
            - { call: "POST /awareness/curriculum-assignments", payload: { employee_id: "${e}", module_id: "${m}", assignment_reason: "ANNUAL", expected_employee_version: "${e_v}" }, as: ProgramAdmin, captures: { a: "$.data.id", due: "$.data.effective_due_at" } }
            - { call: "POST /awareness/_clock/set_current_utc", payload: { to_iso8601: "2026-09-08T00:00:00Z" }, as: ProgramAdmin }
          trigger:
            - { call: "POST /awareness/compliance-sweeps", payload: {}, as: ProgramAdmin, captures: { escalations: "$.data.escalations_created_count", consequences: "$.data.consequences_applied_count" } }
            - { call: "GET /awareness/curriculum-assignments/${a}", payload: {}, as: ProgramAdmin }
            - { call: "GET /awareness/escalation-notices", payload: { assignment_id: "${a}", level: 2 }, as: ProgramAdmin, captures: { n2: "$.data[0].id" } }
            - { call: "GET /awareness/access-consequences", payload: { source_assignment_id: "${a}", state: "ACTIVE" }, as: ProgramAdmin, captures: { ac: "$.data[0].id" } }
            - { call: "GET /awareness/employees/${e}", payload: {}, as: ProgramAdmin }
          assert:
            - "hop 1: CurriculumAssignment.${a}.state == ESCALATED, days_overdue == 8, escalation_level == 2"
            - "hop 2: two EscalationNotice rows exist for ${a}, one with level 1 and one with level 2, both state SENT and manager_id == ${mgr}, both sent_at == 2026-09-08T00:00:00Z"
            - "hop 3: exactly one AccessConsequence exists for ${a}, consequence_type MFA_REVIEW, severity_rank 2, state ACTIVE, applied_at 2026-09-08T00:00:00Z (the level-1 notice applied none)"
            - "hop 4: Employee.${e}.access_posture == ELEVATED_REVIEW and active_suspension_count == 0"
            - "Employee.${e}.compliance_state == DELINQUENT"
            - "Employee.${e}.risk_score_provisional == 8.00 and risk_score_settled == 8.00 (OVERDUE_WEIGHT 8 x 1 delinquent assignment, tier 0, no credits)"
            - "the sweep response reports escalations_created_count == 2 and consequences_applied_count == 1"

      - name: interaction_cascade_click_to_delivery_to_tier_to_intervention
        grounds:
          - state_machines.SimulationDelivery.DELIVERED_to_CLICKED
          - calculations.repeat_clicker_tier
          - calculations.simulation_difficulty_escalation
          - entities.RepeatClickerIntervention.fields.tier_at_open
          - entities.RepeatClickerIntervention.fields.simulation_frequency_days
          - entities.Employee.fields.repeat_clicker_tier
          - endpoints[POST /awareness/simulation-deliveries/{id}/interactions]
        distinguishing_aspect: |
          A single CLICK event cascades four levels outward - InteractionEvent recorded -> SimulationDelivery
          DELIVERED -> CLICKED with outcome_class CLICKED_NO_REPORT -> Employee.repeat_clicker_tier recomputed
          over the 180-day window -> a RepeatClickerIntervention opened with the tier and cadence frozen at open
          time - and the same event also re-prices both risk-score variants.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One ACTIVE VETERAN employee in FINANCE with repeat_clicker_tier 0."
            - "Campaign C1 (TIER_1_BASIC) launched 2026-08-02T09:00:00Z targeting FINANCE; the employee clicks it at 2026-08-02T09:30:00Z, taking repeat_clicker_tier to 1."
            - "Campaign C2 (TIER_1_BASIC) is scheduled for 2026-08-08T09:00:00Z, which is >= the employee's quiet_period_until of 2026-08-07T09:00:00Z, and launched."
          setup_api_calls:
            - { call: "POST /awareness/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /awareness/employees", payload: { email: "rick.clicker@corp.example", full_name: "Rick Clicker", department: "FINANCE", role_code: "FINANCE_APPROVER", hire_date: "2016-06-06" }, as: ProgramAdmin, captures: { e: "$.data.id" } }
            - { call: "POST /awareness/phishing-templates", payload: { name: "Invoice Approval Needed", pretext_category: "INVOICE_APPROVAL", difficulty_tier: "TIER_1_BASIC", theme_tags: ["URGENCY"], credential_capture_enabled: false }, as: CampaignAuthor, as_user_id: "author-1", captures: { tpl: "$.data.id" } }
            - { call: "POST /awareness/phishing-templates/${tpl}/approve-for-use", payload: {}, as: CampaignApprover, as_user_id: "approver-1" }
            - { call: "POST /awareness/campaigns", payload: { name: "FIN Wave 1", template_id: "${tpl}", difficulty_tier: "TIER_1_BASIC", target_departments: ["FINANCE"], communication_policy_ack: true }, as: CampaignAuthor, as_user_id: "author-1", captures: { c1: "$.data.id" } }
            - { call: "POST /awareness/campaigns/${c1}/submit-for-review", payload: {}, as: CampaignAuthor, as_user_id: "author-1" }
            - { call: "POST /awareness/campaigns/${c1}/approve", payload: {}, as: CampaignApprover, as_user_id: "approver-1", captures: { c1_v: "$.data.version" } }
            - { call: "POST /awareness/campaigns/${c1}/schedule", payload: { scheduled_send_at: "2026-08-02T09:00:00Z", expected_campaign_version: "${c1_v}" }, as: CampaignAuthor, as_user_id: "author-1" }
            - { call: "POST /awareness/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T09:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /awareness/campaigns/${c1}/launch", payload: {}, as: ProgramAdmin }
            - { call: "GET /awareness/simulation-deliveries", payload: { campaign_id: "${c1}", employee_id: "${e}" }, as: ProgramAdmin, captures: { d1: "$.data[0].id" } }
            - { call: "POST /awareness/_clock/set_current_utc", payload: { to_iso8601: "2026-08-02T09:30:00Z" }, as: ProgramAdmin }
            - { call: "POST /awareness/simulation-deliveries/${d1}/interactions", payload: { event_type: "CLICK", occurred_at: "2026-08-02T09:30:00Z", source: "LANDING_PAGE" }, as: ProgramAdmin }
            - { call: "POST /awareness/campaigns", payload: { name: "FIN Wave 2", template_id: "${tpl}", difficulty_tier: "TIER_1_BASIC", target_departments: ["FINANCE"], communication_policy_ack: true }, as: CampaignAuthor, as_user_id: "author-1", captures: { c2: "$.data.id" } }
            - { call: "POST /awareness/campaigns/${c2}/submit-for-review", payload: {}, as: CampaignAuthor, as_user_id: "author-1" }
            - { call: "POST /awareness/campaigns/${c2}/approve", payload: {}, as: CampaignApprover, as_user_id: "approver-1", captures: { c2_v: "$.data.version" } }
            - { call: "POST /awareness/campaigns/${c2}/schedule", payload: { scheduled_send_at: "2026-08-08T09:00:00Z", expected_campaign_version: "${c2_v}" }, as: CampaignAuthor, as_user_id: "author-1" }
            - { call: "POST /awareness/_clock/set_current_utc", payload: { to_iso8601: "2026-08-08T09:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /awareness/campaigns/${c2}/launch", payload: {}, as: ProgramAdmin }
            - { call: "GET /awareness/simulation-deliveries", payload: { campaign_id: "${c2}", employee_id: "${e}" }, as: ProgramAdmin, captures: { d2: "$.data[0].id" } }
            - { call: "POST /awareness/_clock/set_current_utc", payload: { to_iso8601: "2026-08-08T10:00:00Z" }, as: ProgramAdmin }
          trigger:
            - { call: "POST /awareness/simulation-deliveries/${d2}/interactions", payload: { event_type: "CLICK", occurred_at: "2026-08-08T10:00:00Z", source: "LANDING_PAGE" }, as: ProgramAdmin, captures: { ev2: "$.data.id" } }
            - { call: "GET /awareness/simulation-deliveries/${d2}", payload: {}, as: ProgramAdmin }
            - { call: "GET /awareness/employees/${e}", payload: {}, as: ProgramAdmin, captures: { tier_after: "$.data.repeat_clicker_tier" } }
            - { call: "GET /awareness/interventions", payload: { employee_id: "${e}", triggering_delivery_id: "${d2}" }, as: ProgramAdmin, captures: { iv: "$.data[0].id" } }
          assert:
            - "level 1: the InteractionEvent ${ev2} is stored with event_type CLICK, occurred_at 2026-08-08T10:00:00Z and sequence_index 1 (first event on that delivery)"
            - "level 2: SimulationDelivery.${d2}.state == CLICKED, first_click_at == 2026-08-08T10:00:00Z, outcome_class == CLICKED_NO_REPORT, time_to_report_minutes == null"
            - "level 3: Employee.${e}.repeat_clicker_tier == 2 (2 clicks inside the 180-day window) and consecutive_clean_simulations == 0"
            - "level 4: exactly one RepeatClickerIntervention exists for ${d2}, state OPEN, tier_at_open == 2, current_tier == 2, simulation_frequency_days == 30, opened_at == 2026-08-08T10:00:00Z"
            - "Employee.${e}.risk_score_provisional == 24.00 (2 clicks x CLICK_WEIGHT 10 = 20, x (1 + 0.10 x 2) = 24.00, no credits, both campaigns RUNNING)"
            - "Employee.${e}.risk_score_settled == 0.00 (neither campaign is CLOSED, so the settled in-scope delivery set is empty)"
            - "SimulationDelivery.${d1}.state == CLICKED is unchanged by the second click"

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: campaign_approve_harmful_theme_outranks_sod_returns_422
        grounds:
          - validations[priority=13]
          - validations[priority=14]
          - validations[priority=15]
          - calculations.harmful_theme_screen
          - errors[ERR_HARMFUL_PRETEXT_THEME]
          - errors[ERR_SEGREGATION_OF_DUTIES_VIOLATION]
        distinguishing_aspect: |
          One approve call violates the safety screen (priority 13) and segregation of duties (priority 14) at
          the same time, with the same acting user, and the response must be ERR_HARMFUL_PRETEXT_THEME: safety
          outranks the duty split, so an implementation that checks "who is asking" before "what is being asked"
          returns the wrong error_id at the wrong 422 for the wrong reason.
        conflicting_rules: [13, 14]
        expected_winner: 13
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One ACTIVE employee in HR so the cohort is non-empty."
            - "A template authored by user author-1 carrying the prohibited theme tag LAYOFF_NOTICE, so harmful_flag_hits is non-empty and it remains in review_state DRAFT."
            - "A campaign over that template authored by author-1 and moved to IN_REVIEW."
          setup_api_calls:
            - { call: "POST /awareness/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /awareness/employees", payload: { email: "hank.hr@corp.example", full_name: "Hank HR", department: "HR", role_code: "IC", hire_date: "2018-08-08" }, as: ProgramAdmin, captures: { e: "$.data.id" } }
            - { call: "POST /awareness/phishing-templates", payload: { name: "Workforce Reduction Notice", pretext_category: "HR_BENEFITS_ENROLLMENT", difficulty_tier: "TIER_2_TARGETED", theme_tags: ["URGENCY", "LAYOFF_NOTICE"], credential_capture_enabled: false }, as: CampaignAuthor, as_user_id: "author-1", captures: { tpl: "$.data.id", hits: "$.data.harmful_flag_hits" } }
            - { call: "POST /awareness/campaigns", payload: { name: "HR Restructure Wave", template_id: "${tpl}", difficulty_tier: "TIER_2_TARGETED", target_departments: ["HR"], communication_policy_ack: true }, as: CampaignAuthor, as_user_id: "author-1", captures: { c: "$.data.id" } }
            - { call: "POST /awareness/campaigns/${c}/submit-for-review", payload: {}, as: CampaignAuthor, as_user_id: "author-1", captures: { c_state: "$.data.state" } }
          trigger:
            - { call: "POST /awareness/campaigns/${c}/approve", payload: {}, as: CampaignApprover, as_user_id: "author-1", captures: { err: "$.data.error_id" } }
          assert:
            - "the approve call returns HTTP 422 with error_id == ERR_HARMFUL_PRETEXT_THEME"
            - "the error_id is NOT ERR_SEGREGATION_OF_DUTIES_VIOLATION even though the acting X-User-ID equals PhishingCampaign.${c}.author_user_id"
            - "the error_id is NOT ERR_TEMPLATE_NOT_APPROVED (priority 15) even though the template is still DRAFT"
            - "PhishingCampaign.${c}.state == IN_REVIEW, reviewer_user_id == null, rejection_reason == null"
            - "PhishingTemplate.${tpl}.harmful_flag_hits contains LAYOFF_NOTICE and review_state == DRAFT"
            - "no SimulationDelivery rows exist for ${c}"

      - name: campaign_schedule_stale_version_outranks_blackout_returns_412
        grounds:
          - validations[priority=10]
          - validations[priority=23]
          - concurrency_rules[campaign-schedule-stale-campaign]
          - errors[ERR_STALE_CAMPAIGN_VERSION]
          - errors[ERR_COMMUNICATION_BLACKOUT_CONFLICT]
          - entities.CommunicationWindow.fields.window_type
        distinguishing_aspect: |
          A single schedule call carries a stale expected_campaign_version AND a send instant that sits inside a
          SIMULATION_BLACKOUT window, so an implementation that validates the business calendar before the
          optimistic-concurrency guard answers 409 ERR_COMMUNICATION_BLACKOUT_CONFLICT where priority 10 demands
          412 ERR_STALE_CAMPAIGN_VERSION - and the HTTP status differs too, not just the error_id.
        conflicting_rules: [10, 23]
        expected_winner: 10
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One ACTIVE employee in EXECUTIVE so the cohort is non-empty."
            - "A SIMULATION_BLACKOUT CommunicationWindow covering 2026-08-10T00:00:00Z .. 2026-08-12T00:00:00Z with no scope_department, so it applies to every cohort."
            - "An APPROVED campaign whose current version has been captured."
          setup_api_calls:
            - { call: "POST /awareness/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /awareness/employees", payload: { email: "eve.exec@corp.example", full_name: "Eve Exec", department: "EXECUTIVE", role_code: "EXECUTIVE", hire_date: "2013-03-03" }, as: ProgramAdmin, captures: { e: "$.data.id" } }
            - { call: "POST /awareness/communication-windows", payload: { window_type: "SIMULATION_BLACKOUT", start_at: "2026-08-10T00:00:00Z", end_at: "2026-08-12T00:00:00Z", reason: "Quarter-end close" }, as: ProgramAdmin, captures: { w: "$.data.id" } }
            - { call: "POST /awareness/phishing-templates", payload: { name: "Shared Document Review", pretext_category: "SHARED_DOCUMENT", difficulty_tier: "TIER_2_TARGETED", theme_tags: ["CURIOSITY"], credential_capture_enabled: false }, as: CampaignAuthor, as_user_id: "author-1", captures: { tpl: "$.data.id" } }
            - { call: "POST /awareness/phishing-templates/${tpl}/approve-for-use", payload: {}, as: CampaignApprover, as_user_id: "approver-1" }
            - { call: "POST /awareness/campaigns", payload: { name: "EXEC Doc Wave", template_id: "${tpl}", difficulty_tier: "TIER_2_TARGETED", target_departments: ["EXECUTIVE"], communication_policy_ack: true }, as: CampaignAuthor, as_user_id: "author-1", captures: { c: "$.data.id" } }
            - { call: "POST /awareness/campaigns/${c}/submit-for-review", payload: {}, as: CampaignAuthor, as_user_id: "author-1" }
            - { call: "POST /awareness/campaigns/${c}/approve", payload: {}, as: CampaignApprover, as_user_id: "approver-1", captures: { c_v: "$.data.version" } }
          trigger:
            - { call: "POST /awareness/campaigns/${c}/schedule", payload: { scheduled_send_at: "2026-08-11T09:00:00Z", expected_campaign_version: "${c_v} - 1" }, as: CampaignAuthor, as_user_id: "author-1", captures: { err: "$.data.error_id" } }
          assert:
            - "the schedule call returns HTTP 412 with error_id == ERR_STALE_CAMPAIGN_VERSION"
            - "the error_id is NOT ERR_COMMUNICATION_BLACKOUT_CONFLICT and the status is NOT 409"
            - "PhishingCampaign.${c}.state == APPROVED, scheduled_send_at == null, version unchanged at ${c_v}"
            - "no SimulationDelivery rows exist for ${c} and Employee.${e}.reserved_simulation_slots == 0"
            - "re-issuing the same call with expected_campaign_version ${c_v} then returns 409 ERR_COMMUNICATION_BLACKOUT_CONFLICT, proving both rules were live"

  - rule_id: boundary_precision_check
    instances:
      - name: reminder_cadence_inclusive_boundary_exact_instant_sends
        grounds:
          - calculations.reminder_cadence_schedule
          - entities.CurriculumAssignment.fields.next_reminder_due_at
          - entities.CurriculumAssignment.fields.reminders_sent
          - entities.TrainingModule.fields.reminder_offsets_days
          - endpoints[POST /awareness/compliance-sweeps]
        distinguishing_aspect: |
          The cadence comparison is inclusive (next_reminder_due_at <= clock_now) at second resolution, so a
          sweep one second early sends nothing and a sweep exactly at the instant sends the reminder; the pair of
          sweeps at 2026-08-23T23:59:59Z and 2026-08-24T00:00:00Z separates <= from <.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "A PUBLISHED ANNUAL module with the default reminder_offsets_days [7, 3, 1, -2]."
            - "One ACTIVE employee with an ANNUAL assignment, so effective_due_at is 2026-08-31T00:00:00Z and next_reminder_due_at is 2026-08-24T00:00:00Z."
            - "One sweep is run at 2026-08-23T23:59:59Z, exactly one second before the first reminder instant."
          setup_api_calls:
            - { call: "POST /awareness/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /awareness/employees", payload: { email: "boris.boundary@corp.example", full_name: "Boris Boundary", department: "ENGINEERING", role_code: "ENGINEER", hire_date: "2017-01-09" }, as: ProgramAdmin, captures: { e: "$.data.id", e_v: "$.data.version" } }
            - { call: "POST /awareness/training-modules", payload: { code: "ANNUAL-SEC-D", title: "Annual Security Awareness D", module_type: "ANNUAL", reminder_offsets_days: [7, 3, 1, -2] }, as: ProgramAdmin, captures: { m: "$.data.id" } }
            - { call: "POST /awareness/training-modules/${m}/publish", payload: {}, as: ProgramAdmin }
            - { call: "POST /awareness/curriculum-assignments", payload: { employee_id: "${e}", module_id: "${m}", assignment_reason: "ANNUAL", expected_employee_version: "${e_v}" }, as: ProgramAdmin, captures: { a: "$.data.id", due0: "$.data.effective_due_at", nr0: "$.data.next_reminder_due_at" } }
            - { call: "POST /awareness/_clock/set_current_utc", payload: { to_iso8601: "2026-08-23T23:59:59Z" }, as: ProgramAdmin }
            - { call: "POST /awareness/compliance-sweeps", payload: {}, as: ProgramAdmin, captures: { early_reminders: "$.data.reminders_sent_count" } }
            - { call: "GET /awareness/curriculum-assignments/${a}", payload: {}, as: ProgramAdmin, captures: { sent_before: "$.data.reminders_sent" } }
            - { call: "POST /awareness/_clock/set_current_utc", payload: { to_iso8601: "2026-08-24T00:00:00Z" }, as: ProgramAdmin }
          trigger:
            - { call: "POST /awareness/compliance-sweeps", payload: {}, as: ProgramAdmin, captures: { on_time_reminders: "$.data.reminders_sent_count" } }
            - { call: "GET /awareness/curriculum-assignments/${a}", payload: {}, as: ProgramAdmin, captures: { sent_after: "$.data.reminders_sent" } }
          assert:
            - "at creation: CurriculumAssignment.${a}.effective_due_at == 2026-08-31T00:00:00Z and next_reminder_due_at == 2026-08-24T00:00:00Z"
            - "the 2026-08-23T23:59:59Z sweep reports reminders_sent_count == 0 and leaves reminders_sent == 0, last_reminder_at == null"
            - "the 2026-08-24T00:00:00Z sweep reports reminders_sent_count == 1"
            - "after the on-time sweep: CurriculumAssignment.${a}.reminders_sent == 1 and last_reminder_at == 2026-08-24T00:00:00Z"
            - "after the on-time sweep: next_reminder_due_at == 2026-08-28T00:00:00Z (effective_due_at minus offsets[1] = 3 days)"
            - "CurriculumAssignment.${a}.state == ASSIGNED and escalation_level == 0 throughout (a reminder is not an escalation)"

      - name: escalation_ladder_first_overdue_day_floor_boundary
        grounds:
          - calculations.escalation_ladder
          - entities.CurriculumAssignment.fields.days_overdue
          - entities.CurriculumAssignment.fields.escalation_level
          - calculations.employee_compliance_state
          - state_machines.CurriculumAssignment.ASSIGNED_to_OVERDUE
        distinguishing_aspect: |
          days_overdue is a FLOOR over whole 86400-second days, so for the first 23h59m59s past the deadline the
          assignment is OVERDUE with days_overdue 0 and target_level 0 - no notice at all - and it is only the
          sweep at exactly deadline + 24h that reaches ESCALATION_L1_DAYS and emits a level-1 notice, which by
          design still applies no AccessConsequence.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "A MANAGER employee and one ACTIVE direct report holding an ANNUAL assignment due 2026-08-31T00:00:00Z."
            - "One sweep is run at 2026-08-31T23:59:59Z, 23h59m59s past the deadline."
          setup_api_calls:
            - { call: "POST /awareness/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /awareness/employees", payload: { email: "fern.mgr@corp.example", full_name: "Fern Floor", department: "SALES", role_code: "MANAGER", hire_date: "2012-12-12" }, as: ProgramAdmin, captures: { mgr: "$.data.id" } }
            - { call: "POST /awareness/employees", payload: { email: "flo.report@corp.example", full_name: "Flo Floor", department: "SALES", role_code: "IC", hire_date: "2019-09-09", manager_id: "${mgr}" }, as: ProgramAdmin, captures: { e: "$.data.id", e_v: "$.data.version" } }
            - { call: "POST /awareness/training-modules", payload: { code: "ANNUAL-SEC-E", title: "Annual Security Awareness E", module_type: "ANNUAL" }, as: ProgramAdmin, captures: { m: "$.data.id" } }
            - { call: "POST /awareness/training-modules/${m}/publish", payload: {}, as: ProgramAdmin }
            - { call: "POST /awareness/curriculum-assignments", payload: { employee_id: "${e}", module_id: "${m}", assignment_reason: "ANNUAL", expected_employee_version: "${e_v}" }, as: ProgramAdmin, captures: { a: "$.data.id" } }
            - { call: "POST /awareness/_clock/set_current_utc", payload: { to_iso8601: "2026-08-31T23:59:59Z" }, as: ProgramAdmin }
            - { call: "POST /awareness/compliance-sweeps", payload: {}, as: ProgramAdmin, captures: { esc_before: "$.data.escalations_created_count" } }
            - { call: "GET /awareness/curriculum-assignments/${a}", payload: {}, as: ProgramAdmin, captures: { od_before: "$.data.days_overdue" } }
            - { call: "POST /awareness/_clock/set_current_utc", payload: { to_iso8601: "2026-09-01T00:00:00Z" }, as: ProgramAdmin }
          trigger:
            - { call: "POST /awareness/compliance-sweeps", payload: {}, as: ProgramAdmin, captures: { esc_after: "$.data.escalations_created_count", cons_after: "$.data.consequences_applied_count" } }
            - { call: "GET /awareness/curriculum-assignments/${a}", payload: {}, as: ProgramAdmin, captures: { od_after: "$.data.days_overdue" } }
            - { call: "GET /awareness/escalation-notices", payload: { assignment_id: "${a}" }, as: ProgramAdmin, captures: { n1: "$.data[0].id", n1_level: "$.data[0].level" } }
            - { call: "GET /awareness/employees/${e}", payload: {}, as: ProgramAdmin }
          assert:
            - "after the 2026-08-31T23:59:59Z sweep: CurriculumAssignment.${a}.state == OVERDUE, days_overdue == 0, escalation_level == 0"
            - "that sweep reports escalations_created_count == 0 and no EscalationNotice exists for ${a}"
            - "after the 2026-09-01T00:00:00Z sweep: days_overdue == 1 and escalation_level == 1"
            - "that sweep reports escalations_created_count == 1 and consequences_applied_count == 0"
            - "exactly one EscalationNotice exists for ${a}, with level == 1, state == SENT, manager_id == ${mgr}"
            - "Employee.${e}.access_posture == NONE and active_suspension_count == 0 (a level-1 notice is notify-only)"
            - "Employee.${e}.compliance_state == AT_RISK (not DELINQUENT, which needs an ESCALATED assignment)"
            - "CurriculumAssignment.${a}.state is still OVERDUE, not ESCALATED"

  - rule_id: cross_entity_state_dependency
    instances:
      - name: assignment_start_blocked_by_retired_module_returns_409
        grounds:
          - validations[priority=17]
          - errors[ERR_MODULE_RETIRED]
          - state_machines.TrainingModule.PUBLISHED_to_RETIRED
          - state_machines.CurriculumAssignment.ASSIGNED_to_IN_PROGRESS
          - entities.TrainingModule.fields.status
        distinguishing_aspect: |
          The assignment is untouched and perfectly startable on its own axis; whether POST /start succeeds
          depends entirely on the CURRENT status of a different entity (TrainingModule), which changed after the
          assignment was created - so a correct implementation must re-read the module at start time rather than
          trust what was true at assignment time.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "A PUBLISHED ROLE_SPECIFIC module eligible for role_code FINANCE_APPROVER."
            - "One ACTIVE employee with a ROLE_CHANGE assignment for that module, in state ASSIGNED."
            - "The module is then RETIRED at 2026-08-03T00:00:00Z, while the assignment is left in ASSIGNED."
          setup_api_calls:
            - { call: "POST /awareness/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /awareness/employees", payload: { email: "fay.finance@corp.example", full_name: "Fay Finance", department: "FINANCE", role_code: "FINANCE_APPROVER", hire_date: "2016-04-04" }, as: ProgramAdmin, captures: { e: "$.data.id", e_v: "$.data.version" } }
            - { call: "POST /awareness/training-modules", payload: { code: "ROLE-WIRE-FRAUD", title: "Wire Fraud Controls", module_type: "ROLE_SPECIFIC", applies_to_role_codes: ["FINANCE_APPROVER"] }, as: ProgramAdmin, captures: { m: "$.data.id" } }
            - { call: "POST /awareness/training-modules/${m}/publish", payload: {}, as: ProgramAdmin }
            - { call: "POST /awareness/curriculum-assignments", payload: { employee_id: "${e}", module_id: "${m}", assignment_reason: "ROLE_CHANGE", expected_employee_version: "${e_v}" }, as: ProgramAdmin, captures: { a: "$.data.id" } }
            - { call: "POST /awareness/_clock/set_current_utc", payload: { to_iso8601: "2026-08-03T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /awareness/training-modules/${m}/retire", payload: {}, as: ProgramAdmin, captures: { m_status: "$.data.status" } }
          trigger:
            - { call: "POST /awareness/curriculum-assignments/${a}/start", payload: {}, as: Learner, as_user_id: "${e}", captures: { err: "$.data.error_id" } }
            - { call: "GET /awareness/curriculum-assignments/${a}", payload: {}, as: ProgramAdmin }
          assert:
            - "the start call returns HTTP 409 with error_id == ERR_MODULE_RETIRED"
            - "TrainingModule.${m}.status == RETIRED and retired_at == 2026-08-03T00:00:00Z"
            - "CurriculumAssignment.${a}.state is still ASSIGNED, attempt_count == 0, version unchanged"
            - "Employee.${e}.compliance_state == COMPLIANT (the blocked start changed nothing on the employee)"
            - "the same start call would have returned 200 before the retire, proving the dependency is on the module's CURRENT state"

      - name: campaign_approve_blocked_by_draft_template_returns_409
        grounds:
          - validations[priority=15]
          - errors[ERR_TEMPLATE_NOT_APPROVED]
          - state_machines.PhishingTemplate.DRAFT_to_APPROVED_FOR_USE
          - state_machines.PhishingCampaign.IN_REVIEW_to_APPROVED
          - entities.PhishingTemplate.fields.review_state
        distinguishing_aspect: |
          A second, structurally different cross-entity gate: the campaign satisfies every rule on its own record
          (safe theme tags, distinct approver, tier within the template's tier, non-empty cohort, policy
          acknowledged) and is refused purely because the referenced PhishingTemplate still sits in DRAFT - a
          409 driven by another entity's review_state, and approving the template afterwards makes the identical
          call succeed.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One ACTIVE employee in IT so the cohort is non-empty."
            - "A TIER_2_TARGETED template with only safe theme tags, left in review_state DRAFT (never approved for use)."
            - "A TIER_2_TARGETED campaign over that template authored by author-1 and moved to IN_REVIEW."
          setup_api_calls:
            - { call: "POST /awareness/_clock/set_current_utc", payload: { to_iso8601: "2026-08-01T00:00:00Z" }, as: ProgramAdmin }
            - { call: "POST /awareness/employees", payload: { email: "ivan.it@corp.example", full_name: "Ivan IT", department: "IT", role_code: "IT_ADMIN", hire_date: "2015-05-05" }, as: ProgramAdmin, captures: { e: "$.data.id" } }
            - { call: "POST /awareness/phishing-templates", payload: { name: "Password Expiry Reminder", pretext_category: "IT_PASSWORD_RESET", difficulty_tier: "TIER_2_TARGETED", theme_tags: ["URGENCY", "AUTHORITY"], credential_capture_enabled: false }, as: CampaignAuthor, as_user_id: "author-1", captures: { tpl: "$.data.id", tpl_state: "$.data.review_state" } }
            - { call: "POST /awareness/campaigns", payload: { name: "IT Password Wave", template_id: "${tpl}", difficulty_tier: "TIER_2_TARGETED", target_departments: ["IT"], communication_policy_ack: true }, as: CampaignAuthor, as_user_id: "author-1", captures: { c: "$.data.id" } }
            - { call: "POST /awareness/campaigns/${c}/submit-for-review", payload: {}, as: CampaignAuthor, as_user_id: "author-1" }
          trigger:
            - { call: "POST /awareness/campaigns/${c}/approve", payload: {}, as: CampaignApprover, as_user_id: "approver-1", captures: { err: "$.data.error_id" } }
            - { call: "GET /awareness/campaigns/${c}", payload: {}, as: ProgramAdmin }
          assert:
            - "the approve call returns HTTP 409 with error_id == ERR_TEMPLATE_NOT_APPROVED"
            - "the error_id is NOT ERR_HARMFUL_PRETEXT_THEME: PhishingTemplate.${tpl}.harmful_flag_hits is empty"
            - "the error_id is NOT ERR_SEGREGATION_OF_DUTIES_VIOLATION: approver-1 differs from author_user_id author-1"
            - "PhishingCampaign.${c}.state is still IN_REVIEW with reviewer_user_id == null"
            - "PhishingTemplate.${tpl}.review_state == DRAFT"
            - "after POST /awareness/phishing-templates/${tpl}/approve-for-use the identical approve call returns 200 and PhishingCampaign.${c}.state == APPROVED"

  - rule_id: resource_temporal_overlap
    instances:
      - name: blackout_closed_interval_rejects_send_exactly_at_end_at_returns_409
        grounds:
          - validations[priority=23]
          - errors[ERR_COMMUNICATION_BLACKOUT_CONFLICT]
          - entities.CommunicationWindow.fields.end_at
          - entities.CommunicationWindow.fields.scope_department
          - state_machines.PhishingCampaign.APPROVED_to_SCHEDULED
        distinguishing_aspect: |
          The blackout window is a CLOSED interval, so a send instant landing exactly on end_at still overlaps
          and must be refused, while one second later is accepted; this is the inclusive-endpoint half of the
          overlap pair and it is scoped by department, so the same instant is legal for a cohort the window does
          not cover.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z."
            - "One ACTIVE employee in SALES."
            - "A SIMULATION_BLACKOUT CommunicationWindow scoped to SALES covering 2026-08-10T00:00:00Z .. 2026-08-12T00:00:00Z."
            - "An APPROVED TIER_1_BASIC campaign targeting SALES, with its version captured."
