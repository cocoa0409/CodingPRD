# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# Task: task_3423_wholesaler_territory_agreements_brand_equity_draft_quality
# 9 rules x 2 instances. Every instance grounds in SCAFFOLD.yaml §1.1-§1.7.
# Unless a recipe sets the clock explicitly, the logical clock is at the
# startup default 2026-09-01T00:00:00Z.
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:
      - name: equity_index_provisional_vs_audited
        grounds:
          - calculations.equity_index_score
          - endpoints.GET_/agreements/{id}/equity-index
          - entities.Agreement.fields.declared_distribution_pct
        distinguishing_aspect: "Dual-variant scoring on the AGREEMENT domain: identical agreement state yields 77.00 under PROVISIONAL (wholesaler-declared metrics) and 71.00 under AUDITED (latest review metrics) — variant selection, not data, moves the index."
        test_recipe:
          setup:
            - "Logical clock at startup default 2026-09-01T00:00:00Z."
            - "Territory TX awarded to wholesaler W1 (GOLD) via an ACTIVE agreement with declared metrics 80/90/50 and STANDARD profile."
            - "Account A1 served by W1 has one FAIL-but-not-critical audit on 2026-09-10 (one 95-day keg of 20 bbl among 100 bbl; lines cleaned 7 days prior) making pooled Q3 freshness 80.00."
            - "W1 has a 2026-Q3 review with distribution_pct 70, share_pct 60 (composite 70.00, at the corrective floor, so no plan is spawned)."
          setup_api_calls:
            - call: "POST /territories"
              payload: { name: "North Texas", state_code: "TX" }
              as: BrewerAdmin
              captures: { t1_id: $.data.id }
            - call: "POST /wholesalers"
              payload: { legal_name: "Plains Distributing", home_state: "TX", license_number: "TX-W-1001", tier: "GOLD", financial_capacity_score: 80, warehouse_capacity_score: 80, market_coverage_score: 80 }
              as: BrewerAdmin
              captures: { w1_id: $.data.id }
            - call: "POST /agreements"
              payload: { territory_id: "${t1_id}", wholesaler_id: "${w1_id}", brand_scope: ["BUD", "BUD-LTD"], distribution_target_pct: 85, freshness_target_index: 90, share_target_pct: 45, declared_distribution_pct: 80, declared_freshness_index: 90, declared_share_pct: 50, term_years: 5 }
              as: BrewerAdmin
              captures: { ag1_id: $.data.id }
            - call: "POST /retail-accounts"
              payload: { name: "Downtown Tap", state_code: "TX", serving_wholesaler_id: "${w1_id}" }
              as: BrewerAdmin
              captures: { a1_id: $.data.id }
            - call: "POST /draft-audits"
              payload: { account_id: "${a1_id}", conducted_at: "2026-09-10T00:00:00Z", line_cleaning_last_at: "2026-09-03T00:00:00Z", kegs: [{ brand_code: "BUD", filled_at: "2026-08-31T00:00:00Z", volume_bbl: 80 }, { brand_code: "BUD", filled_at: "2026-06-07T00:00:00Z", volume_bbl: 20 }] }
              as: DraftAuditor
              captures: { au1_id: $.data.id }
            - call: "POST /performance-reviews"
              payload: { wholesaler_id: "${w1_id}", period_year: 2026, period_quarter: "Q3", distribution_pct: 70, share_pct: 60 }
              as: BrewerAdmin
              captures: { rev1_id: $.data.id }
          trigger:
            - call: "GET /agreements/${ag1_id}/equity-index"
              payload: { variant: "PROVISIONAL" }
              as: BrewerAdmin
              captures: { prov_idx: $.data.equity_index, prov_src: $.data.components_source }
            - call: "GET /agreements/${ag1_id}/equity-index"
              payload: { variant: "AUDITED" }
              as: BrewerCompliance
              captures: { aud_idx: $.data.equity_index, aud_src: $.data.components_source }
          assert:
            - "DraftAudit.${au1_id}.result == FAIL and stale_keg_count == 1"
            - "PerformanceReview.${rev1_id}.freshness_index == 80.00 and composite_score == 70.00"
            - "PROVISIONAL response: equity_index == 77.00 and components_source == DECLARED (0.5*80 + 0.3*90 + 0.2*50)"
            - "AUDITED response: equity_index == 71.00 and components_source == LATEST_REVIEW (0.5*70 + 0.3*80.00 + 0.2*60)"
            - "prov_idx != aud_idx"

      - name: composite_score_standard_vs_share_tilted
        grounds:
          - calculations.performance_composite_score
          - entities.Agreement.fields.weighting_profile
          - endpoints.POST_/performance-reviews
        distinguishing_aspect: "Dual-variant scoring on the PERFORMANCE-REVIEW domain (distinct from instance equity_index_provisional_vs_audited's agreement domain): identical metrics 80/100.00/40 produce 74.00 under STANDARD weights and 65.00 under SHARE_TILTED weights, and only the SHARE_TILTED review spawns a corrective plan."
        test_recipe:
          setup:
            - "Logical clock at startup default 2026-09-01T00:00:00Z."
            - "Two territories TX-A/TX-B awarded to wholesalers WA (STANDARD profile) and WB (SHARE_TILTED profile); neither wholesaler has any audit, so freshness_index defaults to 100.00 for both."
          setup_api_calls:
            - call: "POST /territories"
              payload: { name: "Territory A", state_code: "TX" }
              as: BrewerAdmin
              captures: { ta_id: $.data.id }
            - call: "POST /territories"
              payload: { name: "Territory B", state_code: "TX" }
              as: BrewerAdmin
              captures: { tb_id: $.data.id }
            - call: "POST /wholesalers"
              payload: { legal_name: "WA Distributing", home_state: "TX", license_number: "TX-W-2001", tier: "SILVER", financial_capacity_score: 70, warehouse_capacity_score: 70, market_coverage_score: 70 }
              as: BrewerAdmin
              captures: { wa_id: $.data.id }
            - call: "POST /wholesalers"
              payload: { legal_name: "WB Distributing", home_state: "TX", license_number: "TX-W-2002", tier: "SILVER", financial_capacity_score: 70, warehouse_capacity_score: 70, market_coverage_score: 70 }
              as: BrewerAdmin
              captures: { wb_id: $.data.id }
            - call: "POST /agreements"
              payload: { territory_id: "${ta_id}", wholesaler_id: "${wa_id}", brand_scope: ["BUD"], weighting_profile: "STANDARD", distribution_target_pct: 80, freshness_target_index: 90, share_target_pct: 40, declared_distribution_pct: 80, declared_freshness_index: 100, declared_share_pct: 40, term_years: 5 }
              as: BrewerAdmin
              captures: { aga_id: $.data.id }
            - call: "POST /agreements"
              payload: { territory_id: "${tb_id}", wholesaler_id: "${wb_id}", brand_scope: ["BUD"], weighting_profile: "SHARE_TILTED", distribution_target_pct: 80, freshness_target_index: 90, share_target_pct: 40, declared_distribution_pct: 80, declared_freshness_index: 100, declared_share_pct: 40, term_years: 5 }
              as: BrewerAdmin
              captures: { agb_id: $.data.id }
            - call: "POST /performance-reviews"
              payload: { wholesaler_id: "${wa_id}", period_year: 2026, period_quarter: "Q3", distribution_pct: 80, share_pct: 40 }
              as: BrewerAdmin
              captures: { reva_id: $.data.id }
            - call: "POST /performance-reviews"
              payload: { wholesaler_id: "${wb_id}", period_year: 2026, period_quarter: "Q3", distribution_pct: 80, share_pct: 40 }
              as: BrewerAdmin
              captures: { revb_id: $.data.id }
          trigger:
            - call: "GET /performance-reviews/${reva_id}/corrective-plans"
              payload: {}
              as: BrewerAdmin
            - call: "GET /performance-reviews/${revb_id}/corrective-plans"
              payload: {}
              as: BrewerAdmin
              captures: { planb_id: "$.data[0].id" }
          assert:
            - "PerformanceReview.${reva_id}.composite_score == 74.00 and weighting_profile_snapshot == STANDARD (0.4*80 + 0.3*100 + 0.3*40)"
            - "PerformanceReview.${revb_id}.composite_score == 65.00 and weighting_profile_snapshot == SHARE_TILTED (0.25*80 + 0.25*100 + 0.5*40)"
            - "GET /performance-reviews/${reva_id}/corrective-plans returns an empty array (74.00 is not below the 70.00 floor)"
            - "GET /performance-reviews/${revb_id}/corrective-plans returns exactly one plan with status PROPOSED and revision_count == 0"

  - rule_id: combinatorial_formula
    instances:
      - name: allocation_waterfall_tier_cap_iteration
        grounds:
          - calculations.allocation_waterfall_assignment
          - endpoints.POST_/allocation-events/{id}/lock
        distinguishing_aspect: "Mode (a) combinatorial formula: the waterfall combines 4 non-linear inputs (min guarantee, tier multiplier, per-wholesaler 40% cap, remaining pool) and its iterative cap-and-redistribute pass yields 400/360/240 — values no single-pass proportional split produces."
        test_recipe:
          setup:
            - "Logical clock at startup default 2026-09-01T00:00:00Z."
            - "Three territories awarded to GOLD wholesaler W1, SILVER wholesaler W2, BRONZE wholesaler W3, each with brand_scope including BUD-LTD."
            - "One OPEN allocation event for BUD-LTD with total_qty_cases 1000 and default min_guarantee_cases 100 / territory_cap_pct 0.40; requests: W1 500, W2 400, W3 300 (in that order)."
          setup_api_calls:
            - call: "POST /territories"
              payload: { name: "Alloc T1", state_code: "TX" }
              as: BrewerAdmin
              captures: { at1_id: $.data.id }
            - call: "POST /territories"
              payload: { name: "Alloc T2", state_code: "TX" }
              as: BrewerAdmin
              captures: { at2_id: $.data.id }
            - call: "POST /territories"
              payload: { name: "Alloc T3", state_code: "TX" }
              as: BrewerAdmin
              captures: { at3_id: $.data.id }
            - call: "POST /wholesalers"
              payload: { legal_name: "Gold Wholesaler", home_state: "TX", license_number: "TX-W-3001", tier: "GOLD", financial_capacity_score: 90, warehouse_capacity_score: 90, market_coverage_score: 90 }
              as: BrewerAdmin
              captures: { gw1_id: $.data.id }
            - call: "POST /wholesalers"
              payload: { legal_name: "Silver Wholesaler", home_state: "TX", license_number: "TX-W-3002", tier: "SILVER", financial_capacity_score: 80, warehouse_capacity_score: 80, market_coverage_score: 80 }
              as: BrewerAdmin
              captures: { gw2_id: $.data.id }
            - call: "POST /wholesalers"
              payload: { legal_name: "Bronze Wholesaler", home_state: "TX", license_number: "TX-W-3003", tier: "BRONZE", financial_capacity_score: 70, warehouse_capacity_score: 70, market_coverage_score: 70 }
              as: BrewerAdmin
              captures: { gw3_id: $.data.id }
            - call: "POST /agreements"
              payload: { territory_id: "${at1_id}", wholesaler_id: "${gw1_id}", brand_scope: ["BUD-LTD"], distribution_target_pct: 80, freshness_target_index: 90, share_target_pct: 40, declared_distribution_pct: 80, declared_freshness_index: 95, declared_share_pct: 40, term_years: 5 }
              as: BrewerAdmin
            - call: "POST /agreements"
              payload: { territory_id: "${at2_id}", wholesaler_id: "${gw2_id}", brand_scope: ["BUD-LTD"], distribution_target_pct: 80, freshness_target_index: 90, share_target_pct: 40, declared_distribution_pct: 80, declared_freshness_index: 95, declared_share_pct: 40, term_years: 5 }
              as: BrewerAdmin
            - call: "POST /agreements"
              payload: { territory_id: "${at3_id}", wholesaler_id: "${gw3_id}", brand_scope: ["BUD-LTD"], distribution_target_pct: 80, freshness_target_index: 90, share_target_pct: 40, declared_distribution_pct: 80, declared_freshness_index: 95, declared_share_pct: 40, term_years: 5 }
              as: BrewerAdmin
            - call: "POST /allocation-events"
              payload: { brand_code: "BUD-LTD", total_qty_cases: 1000 }
              as: BrewerAdmin
              captures: { ev_id: $.data.id }
            - call: "POST /allocation-events/${ev_id}/requests"
              payload: { requested_qty_cases: 500 }
              as: WholesalerPrincipal
              as_user_id: "${gw1_id}"
            - call: "POST /allocation-events/${ev_id}/requests"
              payload: { requested_qty_cases: 400 }
              as: WholesalerPrincipal
              as_user_id: "${gw2_id}"
            - call: "POST /allocation-events/${ev_id}/requests"
              payload: { requested_qty_cases: 300 }
              as: WholesalerPrincipal
              as_user_id: "${gw3_id}"
          trigger:
            - call: "POST /allocation-events/${ev_id}/lock"
              payload: {}
              as: BrewerAdmin
          assert:
            - "AllocationEvent.${ev_id}.status == LOCKED"
            - "Assignment for ${gw1_id}: assigned_qty == 400, tier_snapshot == GOLD, status == PENDING (phase-1 100, capped at floor(0.40*1000))"
            - "Assignment for ${gw2_id}: assigned_qty == 360, tier_snapshot == SILVER, status == PENDING (256 proportional + 4 remainder-cycle cases)"
            - "Assignment for ${gw3_id}: assigned_qty == 240, tier_snapshot == BRONZE, status == PENDING (136 proportional + 4 remainder-cycle cases)"
            - "AllocationEvent.${ev_id}.unassigned_remainder == 0 and pending_qty == 1000 and committed_qty == 0 and released_qty == 0"
            - "400 + 360 + 240 == 1000 == total_qty_cases"

      - name: composite_component_first_rounding_order
        grounds:
          - calculations.performance_composite_score
          - calculations.keg_freshness_index
        distinguishing_aspect: "Mode (b) nested rounding (distinct from instance allocation_waterfall_tier_cap_iteration's mode (a)): the pinned component-first order (round each metric to 1dp, then weight, then round to 2dp) yields 71.32, while the forbidden weight-first order would yield 71.27 for the same inputs."
        test_recipe:
          setup:
            - "Logical clock at startup default 2026-09-01T00:00:00Z."
            - "Territory awarded to wholesaler WR (STANDARD profile); account AR served by WR."
            - "One audit of AR conducted 2026-09-01: kegs 168.3 bbl filled 2026-08-20 (12 days, fresh) and 31.7 bbl filled 2026-06-03 (exactly 90 days, stale) — pooled freshness 100 - 100*31.7/200 = 84.15."
          setup_api_calls:
            - call: "POST /territories"
              payload: { name: "Round Territory", state_code: "TX" }
              as: BrewerAdmin
              captures: { rt_id: $.data.id }
            - call: "POST /wholesalers"
              payload: { legal_name: "Round Distributing", home_state: "TX", license_number: "TX-W-3004", tier: "SILVER", financial_capacity_score: 75, warehouse_capacity_score: 75, market_coverage_score: 75 }
              as: BrewerAdmin
              captures: { wr_id: $.data.id }
            - call: "POST /agreements"
              payload: { territory_id: "${rt_id}", wholesaler_id: "${wr_id}", brand_scope: ["BUD"], weighting_profile: "STANDARD", distribution_target_pct: 90, freshness_target_index: 85, share_target_pct: 35, declared_distribution_pct: 90, declared_freshness_index: 85, declared_share_pct: 35, term_years: 5 }
              as: BrewerAdmin
              captures: { agr_id: $.data.id }
            - call: "POST /retail-accounts"
              payload: { name: "Round Bar", state_code: "TX", serving_wholesaler_id: "${wr_id}" }
              as: BrewerAdmin
              captures: { ar_id: $.data.id }
            - call: "POST /draft-audits"
              payload: { account_id: "${ar_id}", conducted_at: "2026-09-01T00:00:00Z", line_cleaning_last_at: "2026-08-28T00:00:00Z", kegs: [{ brand_code: "BUD", filled_at: "2026-08-20T00:00:00Z", volume_bbl: 168.3 }, { brand_code: "BUD", filled_at: "2026-06-03T00:00:00Z", volume_bbl: 31.7 }] }
              as: DraftAuditor
              captures: { aur_id: $.data.id }
          trigger:
            - call: "POST /performance-reviews"
              payload: { wholesaler_id: "${wr_id}", period_year: 2026, period_quarter: "Q3", distribution_pct: 90.06, share_pct: 33.35 }
              as: BrewerAdmin
              captures: { revr_id: $.data.id, revr_composite: $.data.composite_score }
            - call: "GET /performance-reviews/${revr_id}/corrective-plans"
              payload: {}
              as: BrewerAdmin
          assert:
            - "DraftAudit.${aur_id}.stale_keg_count == 1 (the 90-day keg counts as stale; >= 90 is inclusive)"
            - "PerformanceReview.${revr_id}.freshness_index == 84.15"
            - "PerformanceReview.${revr_id}.composite_score == 71.32 — pinned order round1(90.06)=90.1, round1(84.15)=84.2, round1(33.35)=33.4, then 0.4*90.1 + 0.3*84.2 + 0.3*33.4 = 36.04 + 25.26 + 10.02"
            - "composite_score != 71.27 (the value the forbidden weight-first order 0.4*90.06 + 0.3*84.15 + 0.3*33.35 = 71.274 would produce)"
            - "No CorrectivePlan is spawned (71.32 >= 70.00): GET /performance-reviews/${revr_id}/corrective-plans returns an empty array"

  - rule_id: non_linear_state_machine
    instances:
      - name: corrective_plan_failed_revision_cycle
        grounds:
          - state_machines.CorrectivePlan.FAILED_to_PROPOSED
          - state_machines.CorrectivePlan.PROPOSED_to_ACTIVE
          - state_machines.CorrectivePlan.ACTIVE_to_VERIFIED
          - entities.CorrectivePlan.fields.revision_count
        distinguishing_aspect: "Cyclic machine on CorrectivePlan: the PROPOSED -> ACTIVE -> FAILED -> PROPOSED revision loop runs once and terminates VERIFIED on the second pass, with revision_count ending at exactly 1."
        test_recipe:
          setup:
            - "Logical clock at startup default 2026-09-01T00:00:00Z."
            - "Territory awarded to wholesaler WC (STANDARD profile); a 2026-Q3 review with distribution_pct 50, share_pct 30 and no audits (freshness 100.00) scores composite 59.00 < 70.00, so one CorrectivePlan is auto-created PROPOSED."
          setup_api_calls:
            - call: "POST /territories"
              payload: { name: "Cycle Territory", state_code: "TX" }
              as: BrewerAdmin
              captures: { tc_id: $.data.id }
            - call: "POST /wholesalers"
              payload: { legal_name: "Cycle Distributing", home_state: "TX", license_number: "TX-W-4001", tier: "SILVER", financial_capacity_score: 75, warehouse_capacity_score: 75, market_coverage_score: 75 }
              as: BrewerAdmin
              captures: { wc_id: $.data.id }
            - call: "POST /agreements"
              payload: { territory_id: "${tc_id}", wholesaler_id: "${wc_id}", brand_scope: ["BUD"], weighting_profile: "STANDARD", distribution_target_pct: 80, freshness_target_index: 90, share_target_pct: 40, declared_distribution_pct: 50, declared_freshness_index: 100, declared_share_pct: 30, term_years: 5 }
              as: BrewerAdmin
            - call: "POST /performance-reviews"
              payload: { wholesaler_id: "${wc_id}", period_year: 2026, period_quarter: "Q3", distribution_pct: 50, share_pct: 30 }
              as: BrewerAdmin
              captures: { revc_id: $.data.id }
            - call: "GET /performance-reviews/${revc_id}/corrective-plans"
              payload: {}
              as: BrewerAdmin
              captures: { plc_id: "$.data[0].id" }
            - call: "POST /performance-reviews/${revc_id}/response"
              payload: { action: "ACKNOWLEDGE" }
              as: WholesalerPrincipal
              as_user_id: "${wc_id}"
            - call: "POST /corrective-plans/${plc_id}/activate"
              payload: {}
              as: BrewerCompliance
            - call: "POST /corrective-plans/${plc_id}/resolve"
              payload: { outcome: "FAILED", resolution_notes: "first round missed freshness target" }
              as: BrewerCompliance
          trigger:
            - call: "POST /corrective-plans/${plc_id}/revise"
              payload: {}
              as: WholesalerPrincipal
              as_user_id: "${wc_id}"
            - call: "POST /corrective-plans/${plc_id}/activate"
              payload: {}
              as: BrewerCompliance
            - call: "POST /corrective-plans/${plc_id}/resolve"
              payload: { outcome: "VERIFIED", resolution_notes: "second round verified" }
              as: BrewerCompliance
          assert:
            - "PerformanceReview.${revc_id}.composite_score == 59.00 (0.4*50 + 0.3*100 + 0.3*30)"
            - "After revise: CorrectivePlan.${plc_id}.status == PROPOSED and revision_count == 1 (the FAILED -> PROPOSED loop ran exactly once)"
            - "After the second activate: status == ACTIVE with revision_count unchanged at 1"
            - "After the second resolve: status == VERIFIED and revision_count == 1 (resolve does not touch revision_count)"

      - name: transfer_rofr_branch_divergence
        grounds:
          - state_machines.TransferApplication.ROFR_OPEN_to_ROFR_EXERCISED
          - state_machines.TransferApplication.ROFR_OPEN_to_ROFR_WAIVED
          - state_machines.TransferApplication.ROFR_EXERCISED_to_APPROVED
          - state_machines.TransferApplication.ROFR_WAIVED_to_APPROVED
        distinguishing_aspect: "Branching fork-join on TransferApplication (a different entity than corrective_plan_failed_revision_cycle's CorrectivePlan): the ROFR_EXERCISED branch sets successor to the ROFR holder while the ROFR_WAIVED branch keeps the original buyer, so identical downstream APPROVE/consummate steps reassign the two territories to different wholesalers."
        test_recipe:
          setup:
            - "Logical clock at startup default 2026-09-01T00:00:00Z."
            - "Two territories each awarded to a seller wholesaler via agreements that name ROFR holders H1 / H2 (both APPLICANT wholesalers, distinct from the sellers)."
            - "Each seller files a transfer naming a clean APPLICANT buyer (B1 / B2, scores 80/80/80 -> qualification 80.00); both transfers are qualified into ROFR_OPEN with rofr_deadline 2026-10-01T00:00:00Z."
            - "Branch E: H1 exercises. Branch W: H2 waives. Both are then approved and consummated."
          setup_api_calls:
            - call: "POST /territories"
              payload: { name: "Branch E Territory", state_code: "TX" }
              as: BrewerAdmin
              captures: { te_id: $.data.id }
            - call: "POST /territories"
              payload: { name: "Branch W Territory", state_code: "TX" }
              as: BrewerAdmin
              captures: { tw_id: $.data.id }
            - call: "POST /wholesalers"
              payload: { legal_name: "Seller E", home_state: "TX", license_number: "TX-W-4101", tier: "SILVER", financial_capacity_score: 60, warehouse_capacity_score: 60, market_coverage_score: 60 }
              as: BrewerAdmin
              captures: { se_id: $.data.id }
            - call: "POST /wholesalers"
              payload: { legal_name: "Seller W", home_state: "TX", license_number: "TX-W-4102", tier: "SILVER", financial_capacity_score: 60, warehouse_capacity_score: 60, market_coverage_score: 60 }
              as: BrewerAdmin
              captures: { sw_id: $.data.id }
            - call: "POST /wholesalers"
              payload: { legal_name: "Holder One", home_state: "TX", license_number: "TX-W-4103", tier: "GOLD", financial_capacity_score: 85, warehouse_capacity_score: 85, market_coverage_score: 85 }
              as: BrewerAdmin
              captures: { h1_id: $.data.id }
            - call: "POST /wholesalers"
              payload: { legal_name: "Holder Two", home_state: "TX", license_number: "TX-W-4104", tier: "GOLD", financial_capacity_score: 85, warehouse_capacity_score: 85, market_coverage_score: 85 }
              as: BrewerAdmin
              captures: { h2_id: $.data.id }
            - call: "POST /wholesalers"
              payload: { legal_name: "Buyer One", home_state: "TX", license_number: "TX-W-4105", tier: "BRONZE", financial_capacity_score: 80, warehouse_capacity_score: 80, market_coverage_score: 80 }
              as: BrewerAdmin
              captures: { b1_id: $.data.id }
            - call: "POST /wholesalers"
              payload: { legal_name: "Buyer Two", home_state: "TX", license_number: "TX-W-4106", tier: "BRONZE", financial_capacity_score: 80, warehouse_capacity_score: 80, market_coverage_score: 80 }
              as: BrewerAdmin
              captures: { b2_id: $.data.id }
            - call: "POST /agreements"
              payload: { territory_id: "${te_id}", wholesaler_id: "${se_id}", rofr_holder_wholesaler_id: "${h1_id}", brand_scope: ["BUD"], distribution_target_pct: 80, freshness_target_index: 90, share_target_pct: 40, declared_distribution_pct: 80, declared_freshness_index: 95, declared_share_pct: 40, term_years: 5 }
              as: BrewerAdmin
              captures: { age_id: $.data.id }
            - call: "POST /agreements"
