  - rule_id: cross_entity_state_dependency
    instances:
      - name: case_create_requires_batch_open
        grounds:
          - "endpoints POST /distribution-cases"
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: |
          Pair DistributionCase -> DistributionBatch: attaching a case to a batch that has left OPEN
          (LOCKED here) is rejected with ERR_INVALID_STATE/409 even though every other input is valid.
        test_recipe:
          setup: ["Batch ${b_x} LOCKED with one case already attached"]
          setup_api_calls:
            - { call: "POST /recordkeepers", payload: { recordkeeper_code: "RK-A", legal_name: "Recordkeeper A" }, as: ProviderOps, captures: { rk_a: $.data.id } }
            - { call: "POST /recordkeepers/${rk_a}/activate", payload: {}, as: ProviderOps }
