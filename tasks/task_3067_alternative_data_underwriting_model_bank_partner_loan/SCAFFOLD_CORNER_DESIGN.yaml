              captures: { err2: $.data.error_id }
          assert:
            - "the first response is 400 and err1 == ERR_INVALID_REQUEST (PARTNER_REFERRAL requires referral_partner_id)"
            - "the second response is 400 and err2 == ERR_INVALID_REQUEST (DIRECT forbids referral_partner_id)"
