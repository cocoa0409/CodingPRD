      - name: corner_ineligible_threshold_at_eighty_nine_and_ninety_with_the_duration_cap
        claim_type: threshold
        grounds:
          - calculations.project_risk_score
          - calculations.project_risk_score.constants.INELIGIBLE_THRESHOLD
          - state_machines[ConstructionProject].SUBMITTED->INELIGIBLE
        distinguishing_aspect: "Two FRAME / WIND_TIER_1 projects at hard_cost 10000000000 differ only in projected completion: a 550-day programme scores 89 (duration_pts 2 * (19 - 12) == 14) and screens ELIGIBLE, while a 580-day programme scores exactly 90 because duration_pts is clipped at 15 rather than reaching 16, and screens INELIGIBLE."
        test_recipe:
          setup:
            - "Both projects: FRAME (30 pts), WIND_TIER_1 (25 pts), tiv 10000000000 -> value_pts min(20, 20) == 20, NEW_CONSTRUCTION (0 reno pts), claim_count 0 by definition of SUBMISSION_BASIS. Grade B, so the grade never forces INELIGIBLE."
            - "Project A: planned 2026-01-01, completion 2027-07-05 -> 550 days, ceil(550/30) == 19, duration_pts 14, score 89 (< 90)."
            - "Project B: planned 2026-01-01, completion 2027-08-04 -> 580 days, ceil(580/30) == 20, raw 2 * 8 == 16 capped to 15, score 90 (>= 90)."
          setup_api_calls:
            - call: "POST /builders-risk/projects"
              payload: { name: "Longspan Bridge Deck A", site_address: "1 Longspan Way", construction_type: "FRAME", project_kind: "NEW_CONSTRUCTION", hard_cost_value_cents: 10000000000, cat_zone: "WIND_TIER_1", planned_start_date: "2026-01-01T00:00:00Z", projected_completion_date: "2027-07-05T00:00:00Z" }
              as: Underwriter
              as_user_id: "uw-001"
              captures: { pa: $.data.id }
            - call: "POST /builders-risk/projects"
              payload: { name: "Longspan Bridge Deck B", site_address: "2 Longspan Way", construction_type: "FRAME", project_kind: "NEW_CONSTRUCTION", hard_cost_value_cents: 10000000000, cat_zone: "WIND_TIER_1", planned_start_date: "2026-01-01T00:00:00Z", projected_completion_date: "2027-08-04T00:00:00Z" }
              as: Underwriter
              as_user_id: "uw-001"
              captures: { pb: $.data.id }
          trigger:
            - call: "POST /builders-risk/projects/${pa}/screen"
              payload: { engineering_grade: "B", loss_control_report_ref: "LC-A" }
              as: RiskEngineer
              as_user_id: "re-001"
              captures: { sc_a: $.data.submission_risk_score, st_a: $.data.status, pav: $.data.version }
            - call: "POST /builders-risk/projects/${pb}/screen"
              payload: { engineering_grade: "B", loss_control_report_ref: "LC-B" }
              as: RiskEngineer
              as_user_id: "re-001"
              captures: { sc_b: $.data.submission_risk_score, st_b: $.data.status, pbv: $.data.version }
            - call: "POST /builders-risk/policies"
              payload: { project_id: "${pb}", expected_project_version: "${pbv}", term_start_date: "2026-01-01T00:00:00Z", term_end_date: "2027-08-31T00:00:00Z", includes_existing_structure: false, deductible_tier: "STANDARD_25K", limit_cents: 10000000000, daily_delay_rate_cents: 0 }
              as: Underwriter
              as_user_id: "uw-001"
              captures: { e_pol: $.data.error_id }
          assert:
            - "sc_a == 89 and st_a == ELIGIBLE"
            - "sc_b == 90 and st_b == INELIGIBLE - the score is stored even though the project is declined, and engineering_grade B / loss_control_report_ref 'LC-B' are stored too"
            - "e_pol == ERR_INVALID_PROJECT_STATE 409 - no policy may be written on the INELIGIBLE project"
            - "GET /builders-risk/projects/${pb}/policies returns total_count == 0"
            - "the one-point gap comes from the min(15, ...) clip: an uncapped duration term would have scored project B at 91, which is still INELIGIBLE, so the cap is proven by sc_b == 90 exactly"

