  - section: cross_cutting_complexity_layers
    instances:
      - name: stale_licensee_version_blocks_a_new_permissible_investment_test
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.pi-test-create-stale-licensee
          - validations[priority=57]
          - errors[ERR_STALE_LICENSEE_VERSION]
        distinguishing_aspect: "The OCC token is Licensee.version, which a financials patch bumps even though nothing about the holdings changed: the version captured before the patch is refused with ERR_STALE_LICENSEE_VERSION (412) and the refreshed one succeeds, proving the token is compared and not merely echoed."
        test_recipe:
          setup:
            - "One licensee with 4000000 of CASH; Licensee.version captured BEFORE a financials patch."
            - "A financials patch is then applied, bumping the version."
          setup_api_calls:
            - call: "POST /licensees"
              payload: { legal_name: "Meridian Transfer LLC", ein: "74-1100001", reported_tangible_net_worth_cents: 500000000, net_worth_statement_date: "2026-06-30T00:00:00Z" }
              as: LicensingManager
              captures: { lic_id: "$.data.id", v_old: "$.data.version" }
            - call: "POST /investment-holdings"
              payload: { licensee_id: "${lic_id}", asset_class: "CASH", counterparty_name: "First Republic Trust", book_value_cents: 4000000, market_value_cents: 4000000 }
              as: ComplianceOfficer
              as_user_id: "user-co-1"
            - call: "PATCH /licensees/${lic_id}/financials"
              payload: { reported_tangible_net_worth_cents: 480000000, net_worth_statement_date: "2026-07-31T00:00:00Z" }
              as: LicensingManager
              captures: { v_new: "$.data.version" }
          trigger:
            - call: "POST /permissible-investment-tests"
              payload: { licensee_id: "${lic_id}", coverage_period_start: "2026-07-01T00:00:00Z", coverage_period_end: "2026-07-31T00:00:00Z", method: "ELIGIBLE_MARKET", expected_licensee_version: "${v_old}" }
              as: ComplianceOfficer
              as_user_id: "user-co-1"
              captures: { e1: "$.data.error_id" }
            - call: "POST /permissible-investment-tests"
              payload: { licensee_id: "${lic_id}", coverage_period_start: "2026-07-01T00:00:00Z", coverage_period_end: "2026-07-31T00:00:00Z", method: "ELIGIBLE_MARKET", expected_licensee_version: "${v_new}" }
              as: ComplianceOfficer
              as_user_id: "user-co-1"
              captures: { s1: "$.data.status" }
          assert:
            - "${v_new} == ${v_old} + 1"
            - "trigger call 1: HTTP 412 with ${e1} == ERR_STALE_LICENSEE_VERSION and GET /permissible-investment-tests?licensee_id=${lic_id} returns 0 rows"
            - "trigger call 2: HTTP 200 with ${s1} == DRAFT and method == ELIGIBLE_MARKET"

