              payload: { status: "DELIST_REVERSED" }
              as: ListingAnalyst
          assert:
            - "before the decision: the OPEN list has 0 rows (the sole deficiency is PANEL_REVIEW) and the DELIST_REVERSED list has 0 rows"
            - "after the decision: the DELIST_REVERSED list has exactly 1 row (Deficiency.${def_id}) and the OPEN list has exactly 1 row — a NEW deficiency id != ${def_id}"
            - "the forward action (staff determination closing the OPEN track) plus its compensating action (panel reversal) conserve the issuer's live-deficiency cardinality: 1 actionable deficiency before the whole sequence, 1 actionable deficiency after"
            - "the new OPEN row's detected_at == 2027-04-01 (the reversal clock) and compliance_due_at == 2027-09-28 (180 days later)"

      - name: plan_approve_reject_preserves_plan_singleton
        grounds:
