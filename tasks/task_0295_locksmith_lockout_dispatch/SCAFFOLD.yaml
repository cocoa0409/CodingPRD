# =============================================================================
# Locksmith & Lockout Dispatch — Scaffold Seed Tables (SCAFFOLD.yaml)
# §1.0–§1.7 + preamble. No scaffold_difficulty_design / scaffold_corner_design here.
# =============================================================================

scenario: |
  295. Locksmith & Lockout Dispatch: service type (lockout/rekey/install/safe),
  dispatch & ETA, on-site quote/approval, parts/lock inventory,
  emergency/after-hours surcharge, key/code authorization records, warranty, payment

domain_name: locksmith-lockout-dispatch
api_prefix: /
# Flat multi-root API: ServiceJob, Technician, JobBay, LockPart, Dispatch, BayBooking,
# OnSiteQuote, PartReservation, Payment, WarrantyClaim each have a top-level collection
# directly under root (no single shared resource prefix), so api_prefix is the root "/".

# =============================================================================
# Complexity Profile (§0.1–§0.4)
# =============================================================================
complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: pricing_engine
  complexity_layers:
    - dual_variant_calculation      # estimate-at-dispatch vs final-on-site (quote) and promised-vs-actual ETA (technician)
    - cascading_side_effects        # job cancel → quote void → reservation release → inventory restock
    - rate_threshold_triggers       # after-hours / emergency surcharge breakpoints
    - optimistic_concurrency        # OCC on LockPart.version for stock reservation races

  entity_topology: flat
  # Peer entities linked by foreign keys (ServiceJob, Technician, JobBay, LockPart are
  # top-level; Dispatch / BayBooking / OnSiteQuote / PartReservation / KeyAuthorizationRecord /
  # Payment / WarrantyClaim are flat children referenced by FK, not nested in URL paths).

  state_machine_shape: parallel
  # ServiceJob carries two independent axes (job_status × payment_status). OnSiteQuote is
  # cyclic (revision loop). Others are branching-with-revert.

  relationship_patterns:
    - one_to_many        # ServiceJob → Dispatch / OnSiteQuote / Payment / KeyAuthorizationRecord / WarrantyClaim
    - cross_aggregate    # PartReservation references both OnSiteQuote and LockPart (separate aggregates)

  role_model: peer_roles
  # Dispatcher owns job/dispatch/bay creation; Technician owns on-site quote drafting +
  # authorization records; Customer owns quote approval + warranty filing; InventoryManager
  # owns LockPart stock; BillingAgent owns Payment capture/refund. Non-overlapping ownership.

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: ServiceJob
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: customer_name, type: string, source: input, description: "Customer display name on the work order" }
      - { name: customer_user_id, type: string, source: input, description: "Opaque id of the Customer principal who owns this job; compared to X-User-ID for Customer-role ownership checks" }
      - { name: service_type, type: enum, source: input, description: "LOCKOUT | REKEY | INSTALL | SAFE", constraints: "one of LOCKOUT, REKEY, INSTALL, SAFE" }
      - { name: service_address, type: string, source: input, description: "Where the work is performed (used for LOCKOUT/SAFE on-site jobs)" }
      - { name: is_emergency, type: boolean, source: input, default: false, description: "Customer flagged this as an emergency call-out at intake" }
      - { name: requested_at_minute, type: integer, source: input, description: "Time-of-day in minutes from local midnight (0..1439) the service is requested/performed; drives after-hours surcharge", constraints: "0 <= requested_at_minute <= 1439" }
      - { name: job_status, type: enum, source: system, description: "Lifecycle axis: INTAKE | DISPATCHED | ON_SITE | WORK_COMPLETE | CLOSED | CANCELLED", constraints: "INTAKE, DISPATCHED, ON_SITE, WORK_COMPLETE, CLOSED, CANCELLED" }
      - { name: payment_status, type: enum, source: system, default: "UNPAID", description: "Independent money axis: UNPAID | PARTIALLY_PAID | PAID | REFUNDED", constraints: "UNPAID, PARTIALLY_PAID, PAID, REFUNDED" }
      - { name: amount_due_cents, type: integer, source: computed, description: "Approved OnSiteQuote.final_total_cents once a quote is APPROVED, else 0" }
      - { name: net_paid_cents, type: integer, source: computed, description: "sum(Payment.captured_amount_cents for status=CAPTURED) - sum(Payment.refunded_amount_cents for status=REFUNDED) across this job's Payments; starts at 0" }

  - name: Technician
    parent: null
    common_fields: true
    identity_note: "Backs the Technician role: X-User-ID equals this entity's id when X-User-Role=Technician"
    fields:
      - { name: full_name, type: string, source: input, description: "Technician name" }
      - { name: certified_for, type: array, source: input, description: "Array of service_type values the technician may be dispatched for (subset of LOCKOUT, REKEY, INSTALL, SAFE)" }
      - { name: status, type: enum, source: system, default: "ON_DUTY", description: "ON_DUTY (working, dispatchable) | OFF_DUTY (not dispatchable). A technician may hold several scheduled Dispatches at once as long as their ETA windows do not overlap; Dispatch trip progress is tracked on the Dispatch entity, not here.", constraints: "ON_DUTY, OFF_DUTY" }
      - { name: base_travel_minutes, type: integer, source: input, description: "Nominal one-way travel time used to project promised ETA", constraints: ">= 0" }

  - name: JobBay
    parent: null
    common_fields: true
    fields:
      - { name: bay_name, type: string, source: input, description: "Workshop bench/bay label for REKEY/INSTALL bench work" }
      - { name: status, type: enum, source: system, default: "OPEN", description: "OPEN (bookable) | CLOSED_FOR_MAINT (not bookable). Toggled by the close-for-maint / reopen endpoints.", constraints: "OPEN, CLOSED_FOR_MAINT" }

  - name: Dispatch
    parent: null
    common_fields: true
    fields:
      - { name: service_job_id, type: string, source: input, description: "FK -> ServiceJob.id; the job this dispatch serves" }
      - { name: technician_id, type: string, source: input, description: "FK -> Technician.id; the technician being sent" }
      - { name: eta_start_minute, type: integer, source: input, description: "Start of the promised ETA window, minutes from local midnight (0..1439)", constraints: "0 <= eta_start_minute <= 1439" }
      - { name: eta_end_minute, type: integer, source: input, description: "End of the promised ETA window, minutes from local midnight; must be > eta_start_minute", constraints: "eta_end_minute > eta_start_minute" }
      - { name: promised_eta_minutes, type: integer, source: computed, description: "Forward-looking projected response time at dispatch (variant A of ETA calc)" }
      - { name: actual_response_minutes, type: integer, source: computed, description: "Chronological actual response time stamped at on-site arrival (variant B of ETA calc); null until arrival" }
      - { name: arrived_at_minute, type: integer, source: input, description: "Time-of-day in minutes the technician arrived on-site; supplied on the arrive call", constraints: "0 <= arrived_at_minute <= 1439" }
      - { name: status, type: enum, source: system, default: "ASSIGNED", description: "ASSIGNED | EN_ROUTE | ARRIVED | CANCELLED", constraints: "ASSIGNED, EN_ROUTE, ARRIVED, CANCELLED" }

  - name: BayBooking
    parent: null
    common_fields: true
    fields:
      - { name: service_job_id, type: string, source: input, description: "FK -> ServiceJob.id; the bench job occupying the bay" }
      - { name: job_bay_id, type: string, source: input, description: "FK -> JobBay.id; the bay being reserved" }
      - { name: slot_start_minute, type: integer, source: input, description: "Closed-interval bench slot start, minutes from local midnight (0..1439)", constraints: "0 <= slot_start_minute <= 1439" }
      - { name: slot_end_minute, type: integer, source: input, description: "Closed-interval bench slot end, minutes from local midnight; must be >= slot_start_minute", constraints: "slot_end_minute >= slot_start_minute" }
      - { name: status, type: enum, source: system, default: "BOOKED", description: "BOOKED | RELEASED", constraints: "BOOKED, RELEASED" }

  - name: OnSiteQuote
    parent: null
    common_fields: true
    fields:
      - { name: service_job_id, type: string, source: input, description: "FK -> ServiceJob.id; the job this quote prices" }
      - { name: labor_hours, type: number, source: input, description: "On-site measured labor in hours used for the FINAL quote total", constraints: ">= 0" }
      - { name: part_lines, type: array, source: input, description: "Array of { lock_part_id, quantity, unit_price_cents } the technician records on-site for the FINAL total" }
      - { name: estimated_total_cents, type: integer, source: computed, description: "Variant A (dispatch estimate): service_type base flat rate + surcharges, computed at DRAFT (no measured labor/parts)" }
      - { name: final_total_cents, type: integer, source: computed, description: "Variant B (on-site final): measured labor + part lines + surcharges, round-per-line then sum; computed at SUBMIT" }
      - { name: status, type: enum, source: system, default: "DRAFTED", description: "DRAFTED | SUBMITTED | APPROVED | REJECTED | VOIDED", constraints: "DRAFTED, SUBMITTED, APPROVED, REJECTED, VOIDED" }

  - name: LockPart
    parent: null
    common_fields: true   # version field used for OCC stock reservation
    fields:
      - { name: sku, type: string, source: input, description: "Lock/part stock-keeping code" }
      - { name: part_status, type: enum, source: input, default: "STOCKED", description: "STOCKED | DISCONTINUED; DISCONTINUED parts cannot be newly reserved", constraints: "STOCKED, DISCONTINUED" }
      - { name: restricted_blank, type: boolean, source: input, default: false, description: "True for restricted/registered key blanks that require a key/code authorization record on file before reservation" }
      - { name: units_total, type: integer, source: input, description: "Total physical units owned; conserved quantity (units_total == units_available + units_reserved + units_committed)", constraints: ">= 0" }
      - { name: units_available, type: integer, source: computed, description: "Units free to reserve; initialized to units_total" }
      - { name: units_reserved, type: integer, source: computed, description: "Units held by RESERVED PartReservations; starts at 0" }
      - { name: units_committed, type: integer, source: computed, description: "Units consumed by COMMITTED PartReservations; starts at 0" }

  - name: PartReservation
    parent: null
    common_fields: true
    fields:
      - { name: on_site_quote_id, type: string, source: input, description: "FK -> OnSiteQuote.id; the quote consuming the parts" }
      - { name: lock_part_id, type: string, source: input, description: "FK -> LockPart.id; the inventory SKU being held" }
      - { name: quantity, type: integer, source: input, description: "Units to hold; must be a positive count", constraints: "quantity >= 1" }
      - { name: status, type: enum, source: system, default: "RESERVED", description: "RESERVED | COMMITTED | RELEASED", constraints: "RESERVED, COMMITTED, RELEASED" }

  - name: KeyAuthorizationRecord
    parent: null
    common_fields: false   # append-only compliance record: only id + created_at, no updates, no version
    fields:
      - { name: service_job_id, type: string, source: input, description: "FK -> ServiceJob.id; the job this authorization belongs to" }
      - { name: auth_kind, type: enum, source: input, description: "KEY_DUPLICATION | CODE_RESET | RESTRICTED_BLANK", constraints: "KEY_DUPLICATION, CODE_RESET, RESTRICTED_BLANK" }
      - { name: authorizing_party, type: string, source: input, description: "Name of the property owner / authorized agent who signed off" }
      - { name: id_document_ref, type: string, source: input, description: "Reference to the verified identity document captured at authorization" }

  - name: Payment
    parent: null
    common_fields: true
    fields:
      - { name: service_job_id, type: string, source: input, description: "FK -> ServiceJob.id; the job being paid" }
      - { name: captured_amount_cents, type: integer, source: input, description: "Amount captured on this payment in cents", constraints: ">= 1" }
      - { name: refunded_amount_cents, type: integer, source: computed, description: "Amount refunded against this payment in cents; 0 until refunded, then equals captured_amount_cents" }
      - { name: status, type: enum, source: system, default: "CAPTURED", description: "CAPTURED | REFUNDED", constraints: "CAPTURED, REFUNDED" }

  - name: WarrantyClaim
    parent: null
    common_fields: true
    fields:
      - { name: service_job_id, type: string, source: input, description: "FK -> ServiceJob.id; the closed job under warranty" }
      - { name: filed_at_minute, type: integer, source: input, description: "Time-of-day in minutes the claim was filed; used only for record-keeping", constraints: "0 <= filed_at_minute <= 1439" }
      - { name: days_since_close, type: integer, source: input, description: "Whole days elapsed since the job was CLOSED, supplied by the filer; warranty is valid when days_since_close <= WARRANTY_DAYS", constraints: ">= 0" }
      - { name: reason, type: string, source: input, description: "Defect description" }
      - { name: refund_amount_cents, type: integer, source: input, description: "Requested refund amount in cents (<= job net_paid_cents)", constraints: ">= 1" }
      - { name: status, type: enum, source: system, default: "FILED", description: "FILED | APPROVED | DENIED", constraints: "FILED, APPROVED, DENIED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  # ----- ServiceJob: PARALLEL dimensions (job_status × payment_status) -----
  - entity: ServiceJob
    field: job_status
    initial_state: INTAKE
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: INTAKE
        to: DISPATCHED
        trigger: "POST /service-jobs/{id}/dispatches (first ASSIGNED dispatch created for the job)"
        actor: Dispatcher
        preconditions:
          - "job_status == INTAKE (else ERR_JOB_NOT_DISPATCHABLE)"
          - "Technician.status == ON_DUTY (cross-entity; else ERR_TECHNICIAN_UNAVAILABLE)"
          - "service_type is in Technician.certified_for (else ERR_TECHNICIAN_NOT_CERTIFIED)"
          - "ETA window does not overlap any other ASSIGNED/EN_ROUTE Dispatch of the same technician within BUFFER (else ERR_ETA_WINDOW_OVERLAP)"
        side_effects:
          - "Create Dispatch in ASSIGNED; compute Dispatch.promised_eta_minutes"
          - "ServiceJob.job_status INTAKE -> DISPATCHED"
        note: "Dispatch creation does NOT change Technician.status; a technician stays ON_DUTY and may carry several non-overlapping scheduled dispatches."
      - from: DISPATCHED
        to: ON_SITE
        trigger: "POST /dispatches/{id}/arrive"
        actor: Technician
        preconditions:
          - "Dispatch.status == EN_ROUTE (else ERR_DISPATCH_NOT_EN_ROUTE)"
        side_effects:
          - "Dispatch.status EN_ROUTE -> ARRIVED; stamp Dispatch.arrived_at_minute; compute Dispatch.actual_response_minutes"
          - "ServiceJob.job_status DISPATCHED -> ON_SITE"
      - from: ON_SITE
        to: WORK_COMPLETE
        trigger: "POST /service-jobs/{id}/complete-work"
        actor: Technician
        preconditions:
          - "ServiceJob has an OnSiteQuote in APPROVED status (cross-entity; else ERR_NO_APPROVED_QUOTE)"
        side_effects:
          - "All RESERVED PartReservations of the approved quote -> COMMITTED (LockPart.units_reserved decremented, units_committed incremented per part)"
          - "ServiceJob.job_status ON_SITE -> WORK_COMPLETE"
      - from: WORK_COMPLETE
        to: CLOSED
        trigger: "POST /service-jobs/{id}/close"
        actor: Dispatcher
        preconditions:
          - "payment_status == PAID (cross-axis; else ERR_JOB_NOT_FULLY_PAID)"
        side_effects:
          - "ServiceJob.job_status WORK_COMPLETE -> CLOSED"
      - from: [INTAKE, DISPATCHED, ON_SITE]
        to: CANCELLED
        trigger: "POST /service-jobs/{id}/cancel"
        actor: Dispatcher
        preconditions:
          - "job_status in {INTAKE, DISPATCHED, ON_SITE} (else ERR_JOB_NOT_CANCELLABLE)"
        side_effects:
          - "All non-CANCELLED Dispatches of this job -> CANCELLED"
          - "Any non-terminal OnSiteQuote (DRAFTED/SUBMITTED/APPROVED) of this job -> VOIDED"
          - "VOIDED quote cascade: every RESERVED PartReservation under it -> RELEASED (LockPart.units_reserved decremented, units_available incremented per part)"
          - "All BOOKED BayBookings of this job -> RELEASED"
          - "ServiceJob.job_status -> CANCELLED"

  - entity: ServiceJob
    field: payment_status
    initial_state: UNPAID
    terminal_states: [REFUNDED]
    transitions:
      - from: [UNPAID, PARTIALLY_PAID]
        to: PARTIALLY_PAID
        trigger: "POST /service-jobs/{id}/payments (capture leaves net_paid < amount_due)"
        actor: BillingAgent
        preconditions:
          - "ServiceJob has an OnSiteQuote in APPROVED status (cross-entity; else ERR_NO_APPROVED_QUOTE)"
          - "net_paid_cents after capture < amount_due_cents"
        side_effects:
          - "Create Payment in CAPTURED; recompute ServiceJob.net_paid_cents"
          - "payment_status -> PARTIALLY_PAID"
      - from: [UNPAID, PARTIALLY_PAID]
        to: PAID
        trigger: "POST /service-jobs/{id}/payments (capture brings net_paid == amount_due)"
        actor: BillingAgent
        preconditions:
          - "ServiceJob has an OnSiteQuote in APPROVED status (cross-entity; else ERR_NO_APPROVED_QUOTE)"
          - "net_paid_cents after capture == amount_due_cents (overpay rejected: ERR_PAYMENT_EXCEEDS_DUE)"
        side_effects:
          - "Create Payment in CAPTURED; recompute ServiceJob.net_paid_cents"
          - "payment_status -> PAID"
      - from: PAID
        to: REFUNDED
        trigger: "system (WarrantyClaim approved on this job)"
        actor: system
        preconditions:
          - "Job has a CAPTURED Payment whose captured_amount_cents >= claim.refund_amount_cents"
        side_effects:
          - "Selected Payment.status CAPTURED -> REFUNDED; Payment.refunded_amount_cents := captured_amount_cents"
          - "recompute ServiceJob.net_paid_cents"
          - "payment_status -> REFUNDED"
        note: "Refund target = the CAPTURED Payment of this job with captured_amount_cents >= refund_amount_cents, lowest captured_amount_cents first, ties broken by created_at ASC."

  # ----- OnSiteQuote: CYCLIC (revision loop) -----
  - entity: OnSiteQuote
    field: status
    initial_state: DRAFTED
    terminal_states: [APPROVED, VOIDED]
    transitions:
      - from: DRAFTED
        to: SUBMITTED
        trigger: "POST /quotes/{id}/submit"
        actor: Technician
        preconditions:
          - "Parent ServiceJob.job_status == ON_SITE (cross-entity; else ERR_JOB_NOT_ON_SITE)"
          - "labor_hours and part_lines present on the quote (else ERR_QUOTE_INCOMPLETE)"
        side_effects:
          - "compute OnSiteQuote.final_total_cents (round-per-line then sum)"
          - "status DRAFTED -> SUBMITTED"
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /quotes/{id}/approve"
        actor: Customer
        preconditions:
          - "Acting Customer owns parent ServiceJob (X-User-ID == ServiceJob.customer_user_id; else ERR_NOT_JOB_OWNER)"
          - "No other APPROVED quote exists on the same job (else ERR_QUOTE_ALREADY_APPROVED)"
        side_effects:
          - "status SUBMITTED -> APPROVED"
          - "ServiceJob.amount_due_cents := final_total_cents"
      - from: SUBMITTED
        to: DRAFTED
        trigger: "POST /quotes/{id}/request-revision"
        actor: Customer
        preconditions:
          - "Acting Customer owns parent ServiceJob (else ERR_NOT_JOB_OWNER)"
        side_effects:
          - "status SUBMITTED -> DRAFTED (revision loop; technician may re-submit with new labor/parts)"
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /quotes/{id}/reject"
        actor: Customer
        preconditions:
          - "Acting Customer owns parent ServiceJob (else ERR_NOT_JOB_OWNER)"
        side_effects:
          - "status SUBMITTED -> REJECTED"
          - "Every RESERVED PartReservation under this quote -> RELEASED (inventory restocked)"
      - from: REJECTED
        to: DRAFTED
        trigger: "POST /quotes/{id}/reopen"
        actor: Technician
        preconditions:
          - "Parent ServiceJob.job_status == ON_SITE (else ERR_JOB_NOT_ON_SITE)"
        side_effects:
          - "status REJECTED -> DRAFTED (cyclic re-entry)"
      - from: [DRAFTED, SUBMITTED, APPROVED]
        to: VOIDED
        trigger: "system (parent ServiceJob cancelled)"
        actor: system
        preconditions: []
        side_effects:
          - "status -> VOIDED"
          - "Every RESERVED PartReservation under this quote -> RELEASED (inventory restocked)"

  # ----- Dispatch: branching with revert -----
  - entity: Dispatch
    field: status
    initial_state: ASSIGNED
    terminal_states: [CANCELLED]
    transitions:
      - from: ASSIGNED
        to: EN_ROUTE
        trigger: "POST /dispatches/{id}/depart"
        actor: Technician
        preconditions:
          - "Dispatch.status == ASSIGNED (else ERR_DISPATCH_NOT_ASSIGNED)"
        side_effects:
          - "status ASSIGNED -> EN_ROUTE"
      - from: EN_ROUTE
        to: ARRIVED
        trigger: "POST /dispatches/{id}/arrive"
        actor: Technician
        preconditions:
          - "status == EN_ROUTE (else ERR_DISPATCH_NOT_EN_ROUTE)"
        side_effects:
          - "status EN_ROUTE -> ARRIVED; stamp arrived_at_minute; compute actual_response_minutes; drives ServiceJob DISPATCHED -> ON_SITE"
      - from: [ASSIGNED, EN_ROUTE]
        to: CANCELLED
        trigger: "system (parent ServiceJob cancelled) or POST /dispatches/{id}/cancel"
        actor: Dispatcher
        preconditions:
          - "status in {ASSIGNED, EN_ROUTE} (else ERR_DISPATCH_NOT_CANCELLABLE)"
        side_effects:
          - "status -> CANCELLED (frees the ETA window so the technician can be re-dispatched)"

  # ----- PartReservation: branching -----
  - entity: PartReservation
    field: status
    initial_state: RESERVED
    terminal_states: [COMMITTED, RELEASED]
    transitions:
      - from: RESERVED
        to: COMMITTED
        trigger: "system (parent job complete-work)"
        actor: system
        preconditions:
          - "Parent OnSiteQuote.status == APPROVED"
        side_effects:
          - "LockPart.units_reserved -= quantity; LockPart.units_committed += quantity"
      - from: RESERVED
        to: RELEASED
        trigger: "system (quote rejected/voided or job cancelled)"
        actor: system
        preconditions: []
        side_effects:
          - "LockPart.units_reserved -= quantity; LockPart.units_available += quantity"

  # ----- Technician: duty toggle -----
  - entity: Technician
    field: status
    initial_state: ON_DUTY
    terminal_states: []
    transitions:
      - from: ON_DUTY
        to: OFF_DUTY
        trigger: "POST /technicians/{id}/set-off-duty"
        actor: Dispatcher
        preconditions: []
        side_effects:
          - "status ON_DUTY -> OFF_DUTY (technician no longer dispatchable)"
      - from: OFF_DUTY
        to: ON_DUTY
        trigger: "POST /technicians/{id}/set-on-duty"
        actor: Dispatcher
        preconditions: []
        side_effects:
          - "status OFF_DUTY -> ON_DUTY"

  # ----- JobBay: maintenance toggle -----
  - entity: JobBay
    field: status
    initial_state: OPEN
    terminal_states: []
    transitions:
      - from: OPEN
        to: CLOSED_FOR_MAINT
        trigger: "POST /job-bays/{id}/close-for-maint"
        actor: Dispatcher
        preconditions: []
        side_effects:
          - "status OPEN -> CLOSED_FOR_MAINT (bay no longer bookable)"
      - from: CLOSED_FOR_MAINT
        to: OPEN
        trigger: "POST /job-bays/{id}/reopen"
        actor: Dispatcher
        preconditions: []
        side_effects:
          - "status CLOSED_FOR_MAINT -> OPEN"

  # ----- WarrantyClaim: branching -----
  - entity: WarrantyClaim
    field: status
    initial_state: FILED
    terminal_states: [APPROVED, DENIED]
    transitions:
      - from: FILED
        to: APPROVED
        trigger: "POST /warranty-claims/{id}/approve"
        actor: Dispatcher
        preconditions:
          - "Parent ServiceJob.job_status == CLOSED (cross-entity; else ERR_JOB_NOT_CLOSED)"
          - "claim.days_since_close <= WARRANTY_DAYS (else ERR_WARRANTY_EXPIRED)"
          - "claim.refund_amount_cents <= ServiceJob.net_paid_cents (else ERR_REFUND_EXCEEDS_PAID)"
        side_effects:
          - "status FILED -> APPROVED"
          - "Drives ServiceJob payment_status PAID -> REFUNDED (selected Payment refunded; net_paid_cents recomputed)"
      - from: FILED
        to: DENIED
        trigger: "POST /warranty-claims/{id}/deny"
        actor: Dispatcher
        preconditions:
          - "status == FILED"
        side_effects:
          - "status FILED -> DENIED"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: reservation-create-stale-lockpart
    parent_entity: LockPart
    write_endpoint: "POST /part-reservations"
    occ_field: "expected_lockpart_version"
    description: |
      Creating a PartReservation against a LockPart whose version has advanced
      since the client last observed it is rejected with a stale-version error.
      A reservation legitimately decrements units_available (and bumps the
      LockPart version); a writer whose view of the part predates a prior
      reservation holds a stale availability count, so its create is rejected
      on the version check before any stock is touched.
    error_id: ERR_STALE_LOCKPART_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  # --- Rule 1 dual-variant #1 (OnSiteQuote, money domain) ---
  - name: quote_estimated_total_cents
    trigger: "OnSiteQuote creation (DRAFTED) — dispatch-time estimate"
    algorithm: forward_looking
    formula: |
      base = BASE_RATE_CENTS[service_type]           # flat call-out estimate, no measured labor/parts
      surcharge_multiplier = surcharge_multiplier(job)   # see surcharge_multiplier calc
      estimated_total_cents = round_half_up(base * surcharge_multiplier)
    input_set: "Only the parent ServiceJob's service_type, is_emergency, requested_at_minute; NO labor_hours and NO part_lines (those are unknown at dispatch time)."
    constants:
      BASE_RATE_CENTS: { LOCKOUT: 9000, REKEY: 12000, INSTALL: 15000, SAFE: 20000 }
    precision: "integer cents, round_half_up"
    variants:
      - name: estimate_at_dispatch
        when: "quote DRAFTED before on-site assessment"
        difference: "Uses flat BASE_RATE_CENTS only; excludes measured labor and parts entirely."

  - name: quote_final_total_cents
    trigger: "OnSiteQuote SUBMITTED (POST /quotes/{id}/submit) — on-site final"
    algorithm: aggregation
    formula: |
      m = surcharge_multiplier(job)
      # ROUND-PER-LINE THEN SUM (pinned order):
      labor_line   = round_half_up(LABOR_RATE_CENTS_PER_HOUR * labor_hours * m)
      parts_total  = 0
      for line in part_lines:                         # iterate in array order as submitted
        parts_total += round_half_up(line.unit_price_cents * line.quantity * m)
      final_total_cents = labor_line + parts_total
    input_set: "The submitted quote's labor_hours and part_lines, plus parent job's surcharge inputs."
    constants:
      LABOR_RATE_CENTS_PER_HOUR: 8000
    precision: "integer cents, round_half_up; multiplier applied per line, each line rounded, THEN summed (NOT sum-then-round)"
    variants:
      - name: final_on_site
        when: "quote SUBMITTED with measured labor_hours and part_lines"
        difference: "Includes measured labor + actual parts; round-per-line then sum. Diverges from estimate_at_dispatch for identical job because it adds labor & parts the estimate omits."

  # --- Rule 1 dual-variant #2 (Technician/Dispatch, time domain) ---
  - name: dispatch_promised_eta_minutes
    trigger: "Dispatch creation (forward-looking projection at dispatch)"
    algorithm: forward_looking
    formula: |
      # projected = nominal travel + queue weight from technician's other live dispatches
      live = count Dispatches of this technician with status in {ASSIGNED, EN_ROUTE} (excluding the one being created)
      promised_eta_minutes = technician.base_travel_minutes + live * QUEUE_PENALTY_MINUTES
    input_set: "Technician.base_travel_minutes + count of the technician's ASSIGNED/EN_ROUTE dispatches at dispatch time."
    constants:
      QUEUE_PENALTY_MINUTES: 10
    precision: "integer minutes"

  - name: dispatch_actual_response_minutes
    trigger: "Dispatch arrive (POST /dispatches/{id}/arrive) — chronological actual"
    algorithm: chronological
    formula: |
      actual_response_minutes = arrived_at_minute - parent_job.requested_at_minute
      if actual_response_minutes < 0: actual_response_minutes = 0   # next-day arrival floor
    input_set: "Dispatch.arrived_at_minute and the parent ServiceJob.requested_at_minute (timestamps), independent of the projection inputs."
    precision: "integer minutes, floored at 0"

  # --- shared surcharge helper (Rule 2 mode-a non-linear inputs) ---
  - name: surcharge_multiplier
    trigger: "called by quote_estimated_total_cents and quote_final_total_cents"
    algorithm: threshold
    formula: |
      # >=3 inputs (requested_at_minute, is_emergency, service_type), non-linear: nested conditionals + tier selection
      m = 1.0
      if requested_at_minute >= AFTER_HOURS_START_MINUTE OR requested_at_minute < AFTER_HOURS_END_MINUTE:
        m = m * AFTER_HOURS_MULTIPLIER          # after-hours window is [1080..1439] ∪ [0..479]
      if is_emergency AND service_type == "LOCKOUT":
        m = m * EMERGENCY_LOCKOUT_MULTIPLIER    # emergency surcharge stacks only for emergency LOCKOUTs
      return m
    input_set: "ServiceJob.requested_at_minute, ServiceJob.is_emergency, ServiceJob.service_type."
    constants:
      AFTER_HOURS_START_MINUTE: 1080     # 18:00 inclusive
      AFTER_HOURS_END_MINUTE: 480        # 08:00 exclusive (before 08:00 is after-hours)
      AFTER_HOURS_MULTIPLIER: 1.5
      EMERGENCY_LOCKOUT_MULTIPLIER: 1.25
    precision: "multipliers stack multiplicatively; surcharge applied at >= AFTER_HOURS_START_MINUTE (boundary: 1080 triggers, 1079 does not)"

  # --- technician ETA overlap geometry (Rule 8 resource #1) ---
  - name: technician_eta_overlap_check
    trigger: "Dispatch creation (POST /service-jobs/{id}/dispatches)"
    algorithm: interval_merge
    formula: |
      # Half-open windows [eta_start, eta_end) on a per-technician timeline, each EXTENDED
      # forward by BUFFER_MINUTES of travel slack. The new window [s, e) collides with an
      # existing live window [s0, e0) of the SAME technician iff:
      #     s < (e0 + BUFFER_MINUTES)  AND  s0 < (e + BUFFER_MINUTES)
      # Live = existing Dispatches of this technician with status in {ASSIGNED, EN_ROUTE}.
      # Adjacency: a window starting exactly at e0 + BUFFER_MINUTES does NOT collide (half-open).
    input_set: "All Dispatches whose technician_id == target technician AND status in {ASSIGNED, EN_ROUTE}."
    constants:
      BUFFER_MINUTES: 15
    precision: "integer minutes; reject with ERR_ETA_WINDOW_OVERLAP on collision"

  # --- bay slot overlap geometry (Rule 8 resource #2) ---
  - name: bay_slot_overlap_check
    trigger: "BayBooking creation (POST /bay-bookings)"
    algorithm: interval_merge
    formula: |
      # CLOSED intervals [slot_start, slot_end] on a per-bay timeline, NO buffer. The new slot
      # [s, e] collides with an existing BOOKED slot [s0, e0] of the SAME bay iff:
      #     s <= e0  AND  s0 <= e
      # Inclusive endpoints: sharing a single endpoint minute (s == e0) IS a collision.
      input_set_note: "distinct interval arithmetic from technician_eta_overlap_check: closed vs half-open, no buffer."
    input_set: "All BayBookings whose job_bay_id == target bay AND status == BOOKED."
    constants: {}
    precision: "integer minutes; reject with ERR_BAY_SLOT_OVERLAP on collision"

  # --- warranty window (boundary constant) ---
  - name: warranty_window_check
    trigger: "WarrantyClaim approve (POST /warranty-claims/{id}/approve)"
    algorithm: threshold
    formula: |
      valid = (claim.days_since_close <= WARRANTY_DAYS)
      if not valid: reject ERR_WARRANTY_EXPIRED
    input_set: "WarrantyClaim.days_since_close at approval."
    constants:
      WARRANTY_DAYS: 90
    precision: "integer days; <= boundary inclusive (exactly 90 days is still covered, 91 is expired)"

  # --- inventory ledger (Rule 9 conserved quantity #1) ---
  - name: lockpart_unit_ledger
    trigger: "PartReservation RESERVED/COMMITTED/RELEASED transitions and reservation creation"
    algorithm: aggregation
    formula: |
      units_reserved  = sum(quantity for this part's PartReservations with status == RESERVED)
      units_committed = sum(quantity for this part's PartReservations with status == COMMITTED)
      units_available = units_total - units_reserved - units_committed
      INVARIANT: units_total == units_available + units_reserved + units_committed (always)
    input_set: "All PartReservations whose lock_part_id == this LockPart.id, grouped by status."
    precision: "integer units; units_available must never go negative (reservation rejected first via ERR_INSUFFICIENT_STOCK)"

  # --- money ledger (Rule 9 conserved quantity #2) ---
  - name: job_net_paid_cents
    trigger: "Payment capture and warranty-driven refund"
    algorithm: aggregation
    formula: |
      net_paid_cents = sum(p.captured_amount_cents for p in job.Payments if p.status == CAPTURED)
                       - sum(p.refunded_amount_cents for p in job.Payments if p.status == REFUNDED)
      INVARIANT: a capture(+X) followed by its compensating refund(-X) leaves net_paid_cents unchanged
    input_set: "All Payments whose service_job_id == this ServiceJob.id, partitioned by status (CAPTURED vs REFUNDED)."
    precision: "integer cents"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and well-formed"
    error_id: ERR_MISSING_AUTH_CONTEXT
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Role permitted for this operation per §1.7 RBAC"
    error_id: ERR_FORBIDDEN_ROLE
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Path/body resource ids exist, validated left-to-right (job, then dispatch/quote/reservation/payment/claim, then referenced technician/bay/part)"
    error_id: "ERR_JOB_NOT_FOUND / ERR_TECHNICIAN_NOT_FOUND / ERR_BAY_NOT_FOUND / ERR_QUOTE_NOT_FOUND / ERR_DISPATCH_NOT_FOUND / ERR_LOCKPART_NOT_FOUND / ERR_RESERVATION_NOT_FOUND / ERR_PAYMENT_NOT_FOUND / ERR_CLAIM_NOT_FOUND"
    http_status: 404
    applies_to: all endpoints with a referenced resource

  - priority: 4
    category: business_referential
    check: "Customer principal acting on a quote/claim must own the parent ServiceJob (X-User-ID == ServiceJob.customer_user_id)"
    error_id: ERR_NOT_JOB_OWNER
    http_status: 403
    applies_to: "POST /quotes/{id}/approve, /reject, /request-revision; POST /service-jobs/{id}/warranty-claims"

  - priority: 5
    category: state
    check: "Target resource is in the correct state for the transition (job_status / quote.status / dispatch.status / reservation.status / claim.status / bay OPEN for booking / payment requires APPROVED quote)"
    error_id: "ERR_JOB_NOT_DISPATCHABLE / ERR_JOB_NOT_ON_SITE / ERR_JOB_NOT_CANCELLABLE / ERR_JOB_NOT_CLOSED / ERR_JOB_NOT_FULLY_PAID / ERR_DISPATCH_NOT_ASSIGNED / ERR_DISPATCH_NOT_EN_ROUTE / ERR_DISPATCH_NOT_CANCELLABLE / ERR_QUOTE_INVALID_STATE / ERR_NO_APPROVED_QUOTE / ERR_QUOTE_ALREADY_APPROVED / ERR_CLAIM_INVALID_STATE / ERR_BAY_NOT_OPEN"
    http_status: 409
    applies_to: all state-transition endpoints; ERR_BAY_NOT_OPEN applies to POST /bay-bookings (bay must be OPEN)

  - priority: 6
    category: business_constraint
    check: "Technician must be ON_DUTY and certified for service_type before dispatch"
    error_id: "ERR_TECHNICIAN_UNAVAILABLE / ERR_TECHNICIAN_NOT_CERTIFIED"
    http_status: 409
    applies_to: "POST /service-jobs/{id}/dispatches"

  - priority: 7
    category: business_temporal
    check: "Technician ETA window must not overlap (within BUFFER_MINUTES, half-open) another live Dispatch of the same technician"
    error_id: ERR_ETA_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /service-jobs/{id}/dispatches"

  - priority: 8
    category: business_temporal
    check: "Bay booking slot must not overlap (closed interval, inclusive endpoints, no buffer) another BOOKED BayBooking of the same bay"
    error_id: ERR_BAY_SLOT_OVERLAP
    http_status: 409
    applies_to: "POST /bay-bookings"

  - priority: 9
    category: business_safety
    check: "Reserving a restricted_blank LockPart requires a RESTRICTED_BLANK KeyAuthorizationRecord on file for the quote's parent job"
    error_id: ERR_AUTHORIZATION_MISSING
    http_status: 403
    applies_to: "POST /part-reservations"

  - priority: 10
    category: business_constraint
    check: "Referenced LockPart must not be DISCONTINUED and reservation quantity must be a positive count (>= 1)"
    error_id: "ERR_PART_DISCONTINUED / ERR_INVALID_QUANTITY"
    http_status: 422
    applies_to: "POST /part-reservations"

  - priority: 11
    category: business_fiscal
    check: "LockPart must have units_available >= quantity (stock sufficiency)"
    error_id: ERR_INSUFFICIENT_STOCK
    http_status: 409
    applies_to: "POST /part-reservations"

  - priority: 12
    category: business_fiscal
    check: "Payment capture must not bring net_paid_cents above ServiceJob.amount_due_cents"
    error_id: ERR_PAYMENT_EXCEEDS_DUE
    http_status: 409
    applies_to: "POST /service-jobs/{id}/payments"

  - priority: 13
    category: business_fiscal
    check: "Warranty refund amount must not exceed ServiceJob.net_paid_cents, and warranty must not be expired (days_since_close <= WARRANTY_DAYS)"
    error_id: "ERR_REFUND_EXCEEDS_PAID / ERR_WARRANTY_EXPIRED"
    http_status: 409
    applies_to: "POST /warranty-claims/{id}/approve"

  - priority: 14
    category: business_constraint
    check: "OCC: expected_lockpart_version must match LockPart.version on reservation create"
    error_id: ERR_STALE_LOCKPART_VERSION
    http_status: 412
    applies_to: "POST /part-reservations"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---------------- ServiceJob ----------------
  - method: POST
    path: "/service-jobs"
    description: "Create a service job (intake)"
    roles: [Dispatcher]
    code: 201
    input: [customer_name, customer_user_id, service_type, service_address, "is_emergency?", requested_at_minute]
    output: ServiceJob
    side_effects: ["job_status=INTAKE, payment_status=UNPAID, amount_due_cents=0, net_paid_cents=0"]

  - method: GET
    path: "/service-jobs"
    description: "List service jobs"
    roles: [Dispatcher, Technician, Customer, InventoryManager, BillingAgent]
    code: 200
    input: ["service_type?", "job_status?", "limit?", "offset?"]
    output: ServiceJob[]
    side_effects: []

  - method: GET
    path: "/service-jobs/{id}"
    description: "Get a service job"
    roles: [Dispatcher, Technician, Customer, InventoryManager, BillingAgent]
    code: 200
    input: []
    output: ServiceJob
    side_effects: []

  - method: POST
    path: "/service-jobs/{id}/cancel"
    description: "Cancel a job (cascades to dispatches, quotes, reservations, bay bookings)"
    roles: [Dispatcher]
    code: 200
    input: []
    output: ServiceJob
    side_effects:
      - "All non-CANCELLED Dispatches -> CANCELLED (Technician.status unchanged)"
      - "Non-terminal OnSiteQuotes -> VOIDED; RESERVED PartReservations under them -> RELEASED (inventory restocked)"
      - "BOOKED BayBookings -> RELEASED"
      - "job_status -> CANCELLED"

  - method: POST
    path: "/service-jobs/{id}/complete-work"
    description: "Mark on-site work complete (commits reserved parts)"
    roles: [Technician]
    code: 200
    input: []
    output: ServiceJob
    side_effects:
      - "RESERVED PartReservations of the APPROVED quote -> COMMITTED (units_reserved->units_committed per part)"
      - "job_status ON_SITE -> WORK_COMPLETE"

  - method: POST
    path: "/service-jobs/{id}/close"
    description: "Close a fully-paid completed job"
    roles: [Dispatcher]
    code: 200
    input: []
    output: ServiceJob
    side_effects: ["job_status WORK_COMPLETE -> CLOSED"]

  - method: POST
    path: "/service-jobs/{id}/payments"
    description: "Capture a payment against an approved quote"
    roles: [BillingAgent]
    code: 201
    input: [captured_amount_cents]
    output: Payment
    side_effects:
      - "Create Payment CAPTURED; recompute job.net_paid_cents"
      - "payment_status -> PARTIALLY_PAID or PAID"

  - method: GET
    path: "/service-jobs/{id}/payments"
    description: "List payments for a job (reverse-reachability for Payment.service_job_id)"
    roles: [Dispatcher, BillingAgent, Customer]
    code: 200
    input: ["limit?", "offset?"]
    output: Payment[]
    side_effects: []

  - method: POST
    path: "/service-jobs/{id}/key-authorizations"
    description: "File an append-only key/code authorization record"
    roles: [Technician]
    code: 201
    input: [auth_kind, authorizing_party, id_document_ref]
    output: KeyAuthorizationRecord
    side_effects: ["Append KeyAuthorizationRecord (no version, immutable)"]

  - method: GET
    path: "/service-jobs/{id}/key-authorizations"
    description: "List authorization records for a job (reverse-reachability for KeyAuthorizationRecord.service_job_id)"
    roles: [Dispatcher, Technician, InventoryManager]
    code: 200
    input: ["limit?", "offset?"]
    output: KeyAuthorizationRecord[]
    side_effects: []

  - method: POST
    path: "/service-jobs/{id}/warranty-claims"
    description: "File a warranty claim against a closed job"
    roles: [Customer]
    code: 201
    input: [filed_at_minute, days_since_close, reason, refund_amount_cents]
    output: WarrantyClaim
    side_effects: ["Create WarrantyClaim FILED"]

  - method: GET
    path: "/service-jobs/{id}/warranty-claims"
    description: "List warranty claims for a job (reverse-reachability for WarrantyClaim.service_job_id)"
    roles: [Dispatcher, Customer]
    code: 200
    input: ["limit?", "offset?"]
    output: WarrantyClaim[]
    side_effects: []

  # ---------------- Dispatch ----------------
  - method: POST
    path: "/service-jobs/{id}/dispatches"
    description: "Dispatch a technician with an ETA window"
    roles: [Dispatcher]
    code: 201
    input: [technician_id, eta_start_minute, eta_end_minute]
    output: Dispatch
    side_effects:
      - "Create Dispatch ASSIGNED; compute promised_eta_minutes"
      - "job_status INTAKE -> DISPATCHED (Technician.status unchanged; tech stays ON_DUTY)"

  - method: GET
    path: "/service-jobs/{id}/dispatches"
    description: "List dispatches for a job (reverse-reachability for Dispatch.service_job_id)"
    roles: [Dispatcher, Technician]
    code: 200
    input: ["limit?", "offset?"]
    output: Dispatch[]
    side_effects: []

  - method: GET
    path: "/dispatches"
    description: "List dispatches, filterable by technician (reverse-reachability for Dispatch.technician_id)"
    roles: [Dispatcher, Technician]
    code: 200
    input: ["technician_id?", "service_job_id?", "status?", "limit?", "offset?"]
    output: Dispatch[]
    side_effects: []

  - method: GET
    path: "/dispatches/{id}"
    description: "Get a dispatch"
    roles: [Dispatcher, Technician]
    code: 200
    input: []
    output: Dispatch
    side_effects: []

  - method: POST
    path: "/dispatches/{id}/depart"
    description: "Technician departs (ASSIGNED -> EN_ROUTE)"
    roles: [Technician]
    code: 200
    input: []
    output: Dispatch
    side_effects: ["status ASSIGNED -> EN_ROUTE"]

  - method: POST
    path: "/dispatches/{id}/arrive"
    description: "Technician arrives on-site (EN_ROUTE -> ARRIVED), drives job to ON_SITE"
    roles: [Technician]
    code: 200
    input: [arrived_at_minute]
    output: Dispatch
    side_effects:
      - "status EN_ROUTE -> ARRIVED; stamp arrived_at_minute; compute actual_response_minutes"
      - "Technician -> ON_SITE; job_status DISPATCHED -> ON_SITE"

  - method: POST
    path: "/dispatches/{id}/cancel"
    description: "Cancel a dispatch (frees the ETA window)"
    roles: [Dispatcher]
    code: 200
    input: []
    output: Dispatch
    side_effects: ["status -> CANCELLED (Technician.status unchanged)"]

  # ---------------- Technician ----------------
  - method: POST
    path: "/technicians"
    description: "Register a technician"
    roles: [Dispatcher]
    code: 201
    input: [full_name, certified_for, base_travel_minutes]
    output: Technician
    side_effects: ["status=ON_DUTY"]

  - method: GET
    path: "/technicians"
    description: "List technicians"
    roles: [Dispatcher, Technician]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Technician[]
    side_effects: []

  - method: GET
    path: "/technicians/{id}"
    description: "Get a technician"
    roles: [Dispatcher, Technician]
    code: 200
    input: []
    output: Technician
    side_effects: []

  - method: POST
    path: "/technicians/{id}/set-off-duty"
    description: "Take a technician off duty (no longer dispatchable)"
    roles: [Dispatcher]
    code: 200
    input: []
    output: Technician
    side_effects: ["status -> OFF_DUTY"]

  - method: POST
    path: "/technicians/{id}/set-on-duty"
    description: "Return a technician to duty (dispatchable again)"
    roles: [Dispatcher]
    code: 200
    input: []
    output: Technician
    side_effects: ["status -> ON_DUTY"]

  # ---------------- JobBay & BayBooking ----------------
  - method: POST
    path: "/job-bays"
    description: "Create a workshop bay"
    roles: [Dispatcher]
    code: 201
    input: [bay_name]
    output: JobBay
    side_effects: ["status=OPEN"]

  - method: GET
    path: "/job-bays"
    description: "List job bays"
    roles: [Dispatcher, Technician]
    code: 200
    input: ["limit?", "offset?"]
    output: JobBay[]
    side_effects: []

  - method: GET
    path: "/job-bays/{id}"
    description: "Get a job bay"
    roles: [Dispatcher, Technician]
    code: 200
    input: []
    output: JobBay
    side_effects: []

  - method: POST
    path: "/job-bays/{id}/close-for-maint"
    description: "Take a bay out of service for maintenance"
    roles: [Dispatcher]
    code: 200
    input: []
    output: JobBay
    side_effects: ["status OPEN -> CLOSED_FOR_MAINT"]

  - method: POST
    path: "/job-bays/{id}/reopen"
    description: "Return a bay to service"
    roles: [Dispatcher]
    code: 200
    input: []
    output: JobBay
    side_effects: ["status CLOSED_FOR_MAINT -> OPEN"]

  - method: POST
    path: "/bay-bookings"
    description: "Book a bench slot in a bay for a job (bay must be OPEN; closed-interval overlap check)"
    roles: [Dispatcher]
    code: 201
    input: [service_job_id, job_bay_id, slot_start_minute, slot_end_minute]
    output: BayBooking
    side_effects: ["Validate bay OPEN (else ERR_BAY_NOT_OPEN); closed-interval overlap check; create BayBooking BOOKED"]

  - method: GET
    path: "/bay-bookings"
    description: "List bay bookings, filterable by job or bay (reverse-reachability for BayBooking.service_job_id and BayBooking.job_bay_id)"
    roles: [Dispatcher, Technician]
    code: 200
    input: ["service_job_id?", "job_bay_id?", "status?", "limit?", "offset?"]
    output: BayBooking[]
    side_effects: []

  - method: GET
    path: "/bay-bookings/{id}"
    description: "Get a bay booking"
    roles: [Dispatcher, Technician]
    code: 200
    input: []
    output: BayBooking
    side_effects: []

  - method: POST
    path: "/bay-bookings/{id}/release"
    description: "Release a bench slot"
    roles: [Dispatcher]
    code: 200
    input: []
    output: BayBooking
    side_effects: ["status BOOKED -> RELEASED"]

  # ---------------- OnSiteQuote ----------------
  - method: POST
    path: "/service-jobs/{id}/quotes"
    description: "Draft an on-site quote (computes estimated_total_cents)"
    roles: [Technician]
    code: 201
    input: [labor_hours, part_lines]
    output: OnSiteQuote
    side_effects: ["status=DRAFTED; compute estimated_total_cents from service_type base rate + surcharges"]

  - method: GET
    path: "/service-jobs/{id}/quotes"
    description: "List quotes for a job (reverse-reachability for OnSiteQuote.service_job_id)"
    roles: [Dispatcher, Technician, Customer]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: OnSiteQuote[]
    side_effects: []

  - method: GET
    path: "/quotes/{id}"
    description: "Get a quote"
    roles: [Dispatcher, Technician, Customer]
    code: 200
    input: []
    output: OnSiteQuote
    side_effects: []

  - method: POST
    path: "/quotes/{id}/submit"
    description: "Submit a draft quote (computes final_total_cents, requires job ON_SITE)"
    roles: [Technician]
    code: 200
    input: []
    output: OnSiteQuote
    side_effects: ["compute final_total_cents (round-per-line then sum); status DRAFTED -> SUBMITTED"]

  - method: POST
    path: "/quotes/{id}/approve"
    description: "Customer approves a submitted quote"
    roles: [Customer]
    code: 200
    input: []
    output: OnSiteQuote
    side_effects: ["status SUBMITTED -> APPROVED; ServiceJob.amount_due_cents := final_total_cents"]

  - method: POST
    path: "/quotes/{id}/reject"
    description: "Customer rejects a submitted quote (releases reserved parts)"
    roles: [Customer]
    code: 200
    input: []
    output: OnSiteQuote
    side_effects: ["status SUBMITTED -> REJECTED; RESERVED PartReservations -> RELEASED (inventory restocked)"]

  - method: POST
    path: "/quotes/{id}/request-revision"
    description: "Customer requests changes (SUBMITTED -> DRAFTED revision loop)"
    roles: [Customer]
    code: 200
    input: []
    output: OnSiteQuote
    side_effects: ["status SUBMITTED -> DRAFTED"]

  - method: POST
    path: "/quotes/{id}/reopen"
    description: "Technician reopens a rejected quote (REJECTED -> DRAFTED)"
    roles: [Technician]
    code: 200
    input: []
    output: OnSiteQuote
    side_effects: ["status REJECTED -> DRAFTED"]

  - method: PUT
    path: "/quotes/{id}"
    description: "Update a DRAFTED quote's labor_hours/part_lines before re-submit"
    roles: [Technician]
    code: 200
    input: ["labor_hours?", "part_lines?"]
    output: OnSiteQuote
    side_effects: ["recompute estimated_total_cents; only allowed while status==DRAFTED"]

  # ---------------- LockPart & PartReservation ----------------
  - method: POST
    path: "/lock-parts"
    description: "Create a LockPart inventory SKU"
    roles: [InventoryManager]
    code: 201
    input: [sku, "part_status?", "restricted_blank?", units_total]
    output: LockPart
    side_effects: ["units_available=units_total, units_reserved=0, units_committed=0, version=1"]

  - method: GET
    path: "/lock-parts"
    description: "List lock parts"
    roles: [InventoryManager, Dispatcher, Technician]
    code: 200
    input: ["part_status?", "limit?", "offset?"]
    output: LockPart[]
    side_effects: []

  - method: GET
    path: "/lock-parts/{id}"
    description: "Get a lock part (read current version for OCC)"
    roles: [InventoryManager, Dispatcher, Technician]
    code: 200
    input: []
    output: LockPart
    side_effects: []

  - method: PUT
    path: "/lock-parts/{id}"
    description: "Restock or discontinue a lock part"
    roles: [InventoryManager]
    code: 200
    input: ["units_total?", "part_status?", expected_lockpart_version]
    output: LockPart
    side_effects: ["adjust units_total / part_status; recompute units_available; increments LockPart.version by 1"]

  - method: POST
    path: "/part-reservations"
    description: "Reserve units of a LockPart for a quote (OCC on LockPart.version)"
    roles: [Technician]
    code: 201
    input: [on_site_quote_id, lock_part_id, quantity, expected_lockpart_version]
    output: PartReservation
    side_effects:
      - "Validate part not DISCONTINUED, authorization present if restricted_blank, stock sufficient, version matches"
      - "Create PartReservation RESERVED; LockPart.units_available -= quantity; units_reserved += quantity; increments LockPart.version by 1"

  - method: GET
    path: "/part-reservations"
    description: "List part reservations, filterable by quote or part (reverse-reachability for PartReservation.on_site_quote_id and PartReservation.lock_part_id)"
    roles: [Technician, InventoryManager, Dispatcher]
    code: 200
    input: ["on_site_quote_id?", "lock_part_id?", "status?", "limit?", "offset?"]
    output: PartReservation[]
    side_effects: []

  - method: GET
    path: "/part-reservations/{id}"
    description: "Get a part reservation"
    roles: [Technician, InventoryManager, Dispatcher]
    code: 200
    input: []
    output: PartReservation
    side_effects: []

  # ---------------- WarrantyClaim actions ----------------
  - method: GET
    path: "/warranty-claims/{id}"
    description: "Get a warranty claim"
    roles: [Dispatcher, Customer]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: []

  - method: POST
    path: "/warranty-claims/{id}/approve"
    description: "Approve a warranty claim (drives refund on the job)"
    roles: [Dispatcher]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects:
      - "status FILED -> APPROVED"
      - "Selected CAPTURED Payment -> REFUNDED; job net_paid_cents recomputed; payment_status -> REFUNDED"

  - method: POST
    path: "/warranty-claims/{id}/deny"
    description: "Deny a warranty claim"
    roles: [Dispatcher]
    code: 200
    input: []
    output: WarrantyClaim
    side_effects: ["status FILED -> DENIED"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- auth ---
  - { id: ERR_MISSING_AUTH_CONTEXT, http: 401, condition: "X-User-ID or X-User-Role header missing/invalid" }
  - { id: ERR_FORBIDDEN_ROLE, http: 403, condition: "Role not permitted for this operation" }
  - { id: ERR_NOT_JOB_OWNER, http: 403, condition: "Acting Customer is not the owner of the parent ServiceJob" }
  # --- not found ---
  - { id: ERR_JOB_NOT_FOUND, http: 404, condition: "ServiceJob id does not exist" }
  - { id: ERR_TECHNICIAN_NOT_FOUND, http: 404, condition: "Technician id does not exist" }
  - { id: ERR_BAY_NOT_FOUND, http: 404, condition: "JobBay id does not exist" }
  - { id: ERR_QUOTE_NOT_FOUND, http: 404, condition: "OnSiteQuote id does not exist" }
  - { id: ERR_DISPATCH_NOT_FOUND, http: 404, condition: "Dispatch id does not exist" }
  - { id: ERR_LOCKPART_NOT_FOUND, http: 404, condition: "LockPart id does not exist" }
  - { id: ERR_RESERVATION_NOT_FOUND, http: 404, condition: "PartReservation id does not exist" }
  - { id: ERR_PAYMENT_NOT_FOUND, http: 404, condition: "Payment id does not exist" }
  - { id: ERR_CLAIM_NOT_FOUND, http: 404, condition: "WarrantyClaim id does not exist" }
  # --- request validation ---
  - { id: ERR_INVALID_REQUEST, http: 400, condition: "Missing required field or type mismatch in request body" }
  - { id: ERR_INVALID_ENUM, http: 422, condition: "Enum field carries a value outside its declared set (e.g., service_type, auth_kind)" }
  - { id: ERR_INVALID_TIME_WINDOW, http: 422, condition: "eta_end_minute <= eta_start_minute, or slot_end_minute < slot_start_minute, or a minute outside 0..1439" }
  - { id: ERR_INVALID_QUANTITY, http: 422, condition: "PartReservation.quantity is not a positive count (< 1)" }
  - { id: ERR_QUOTE_INCOMPLETE, http: 422, condition: "Submit attempted with labor_hours/part_lines missing on the quote" }
  # --- job state ---
  - { id: ERR_JOB_NOT_DISPATCHABLE, http: 409, condition: "job_status != INTAKE when dispatching" }
  - { id: ERR_JOB_NOT_ON_SITE, http: 409, condition: "Operation requires parent job in ON_SITE (quote submit/reopen)" }
  - { id: ERR_JOB_NOT_CANCELLABLE, http: 409, condition: "job_status not in {INTAKE, DISPATCHED, ON_SITE} when cancelling" }
  - { id: ERR_JOB_NOT_CLOSED, http: 409, condition: "Warranty approve requires parent job CLOSED" }
  - { id: ERR_JOB_NOT_FULLY_PAID, http: 409, condition: "Close requires payment_status == PAID" }
  - { id: ERR_NO_APPROVED_QUOTE, http: 409, condition: "complete-work or payment requires an APPROVED OnSiteQuote on the job" }
  # --- dispatch / technician state ---
  - { id: ERR_DISPATCH_NOT_ASSIGNED, http: 409, condition: "depart requires dispatch ASSIGNED" }
  - { id: ERR_DISPATCH_NOT_EN_ROUTE, http: 409, condition: "arrive requires dispatch EN_ROUTE" }
  - { id: ERR_DISPATCH_NOT_CANCELLABLE, http: 409, condition: "Dispatch not in {ASSIGNED, EN_ROUTE} when cancelling" }
  - { id: ERR_TECHNICIAN_UNAVAILABLE, http: 409, condition: "Technician is OFF_DUTY at dispatch time" }
  - { id: ERR_TECHNICIAN_NOT_CERTIFIED, http: 409, condition: "service_type not in Technician.certified_for" }
  - { id: ERR_ETA_WINDOW_OVERLAP, http: 409, condition: "Technician ETA window overlaps another live dispatch within BUFFER_MINUTES (half-open)" }
  # --- bay ---
  - { id: ERR_BAY_SLOT_OVERLAP, http: 409, condition: "Bay slot overlaps another BOOKED booking on the same bay (closed interval, inclusive endpoints)" }
  - { id: ERR_BAY_NOT_OPEN, http: 409, condition: "Bay is CLOSED_FOR_MAINT and cannot be booked" }
  # --- quote state ---
  - { id: ERR_QUOTE_INVALID_STATE, http: 409, condition: "Quote transition attempted from an incompatible status (e.g., approve a DRAFTED quote, reopen a non-REJECTED quote)" }
  - { id: ERR_QUOTE_ALREADY_APPROVED, http: 409, condition: "Another APPROVED quote already exists on the job" }
  # --- inventory / parts ---
  - { id: ERR_PART_DISCONTINUED, http: 409, condition: "Reservation references a DISCONTINUED LockPart" }
  - { id: ERR_AUTHORIZATION_MISSING, http: 403, condition: "Restricted-blank reservation without a RESTRICTED_BLANK KeyAuthorizationRecord on file for the job" }
  - { id: ERR_INSUFFICIENT_STOCK, http: 409, condition: "LockPart.units_available < requested quantity" }
  - { id: ERR_STALE_LOCKPART_VERSION, http: 412, condition: "expected_lockpart_version != LockPart.version on reservation create or part update" }
  # --- payment / warranty ---
  - { id: ERR_PAYMENT_EXCEEDS_DUE, http: 409, condition: "Capture would push net_paid_cents above amount_due_cents" }
  - { id: ERR_REFUND_EXCEEDS_PAID, http: 409, condition: "Warranty refund amount exceeds job net_paid_cents" }
  - { id: ERR_WARRANTY_EXPIRED, http: 409, condition: "days_since_close > WARRANTY_DAYS at approval" }
  - { id: ERR_CLAIM_INVALID_STATE, http: 409, condition: "Warranty approve/deny attempted on a claim not in FILED" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Dispatcher
    description: "Operations desk: intakes jobs, dispatches technicians, manages bays, closes/cancels jobs, adjudicates warranty claims"
    identity: opaque
    exclusive_operations:
      - "POST /service-jobs — intake a job"
      - "POST /service-jobs/{id}/cancel — cancel a job"
      - "POST /service-jobs/{id}/close — close a job"
      - "POST /service-jobs/{id}/dispatches — dispatch a technician"
      - "POST /dispatches/{id}/cancel — cancel a dispatch"
      - "POST /technicians — register a technician"
      - "POST /job-bays — create a bay"
      - "POST /bay-bookings — book a bay slot"
      - "POST /bay-bookings/{id}/release — release a bay slot"
      - "POST /warranty-claims/{id}/approve — approve a warranty claim"
      - "POST /warranty-claims/{id}/deny — deny a warranty claim"
    shared_operations:
      - "GET endpoints across jobs, dispatches, technicians, bays, quotes, parts, reservations, payments, authorizations, warranty-claims"

  - name: Technician
    description: "Field/bench technician: departs, arrives, drafts/submits/reopens quotes, reserves parts, files authorization records, completes work"
    identity: "entity_backed:Technician"
    exclusive_operations:
      - "POST /dispatches/{id}/depart — depart for a job"
      - "POST /dispatches/{id}/arrive — arrive on-site"
      - "POST /service-jobs/{id}/complete-work — mark work complete"
      - "POST /service-jobs/{id}/quotes — draft a quote"
      - "PUT /quotes/{id} — edit a drafted quote"
      - "POST /quotes/{id}/submit — submit a quote"
      - "POST /quotes/{id}/reopen — reopen a rejected quote"
      - "POST /part-reservations — reserve parts"
      - "POST /service-jobs/{id}/key-authorizations — file an authorization record"
    shared_operations:
      - "GET endpoints across jobs, dispatches, technicians, bays, quotes, parts, reservations, authorizations"

  - name: Customer
    description: "Job owner: approves/rejects/revises submitted quotes and files warranty claims on their own jobs"
    identity: opaque
    exclusive_operations:
      - "POST /quotes/{id}/approve — approve a quote"
      - "POST /quotes/{id}/reject — reject a quote"
      - "POST /quotes/{id}/request-revision — request quote revision"
      - "POST /service-jobs/{id}/warranty-claims — file a warranty claim"
    shared_operations:
      - "GET endpoints across own jobs, quotes, payments, warranty-claims"

  - name: InventoryManager
    description: "Inventory desk: creates/restocks/discontinues LockParts"
    identity: opaque
    exclusive_operations:
      - "POST /lock-parts — create a part SKU"
      - "PUT /lock-parts/{id} — restock/discontinue a part"
    shared_operations:
      - "GET endpoints across lock-parts, part-reservations, jobs, authorizations"

  - name: BillingAgent
    description: "Billing desk: captures payments against approved quotes"
    identity: opaque
    exclusive_operations:
      - "POST /service-jobs/{id}/payments — capture a payment"
    shared_operations:
      - "GET endpoints across jobs, payments"
