# =============================================================================
# PRD Benchmark Scaffold — task_3230
# Blanket Mechanical License Administration & Unmatched Royalty Distribution
# (Mechanical Licensing Collective analogue)
#
# Contains §1.0–§1.7 only. §1.8 lives in SCAFFOLD_DIFFICULTY_DESIGN.yaml;
# §1.9 lives in SCAFFOLD_CORNER_DESIGN.yaml.
# =============================================================================

scenario: |
  Blanket Mechanical License Administration & Unmatched Royalty Distribution
  (The Mechanical Licensing Collective): digital service provider participation
  under a blanket license with monthly usage reporting and royalty payment,
  musical work database construction from publisher and administrator
  registrations with matching to sound recordings, unmatched usage accrual held
  for a claiming period with public search tools for rights holders to claim,
  dispute handling when multiple parties claim the same share of a work,
  historical unmatched royalty distribution using market share methodologies,
  member registration, payee setup and statement delivery, audit rights over
  service provider reporting, data quality initiatives to improve match rates
  over time.

domain_name: blanket-mechanical-license-administration
api_prefix: /mlc

# =============================================================================
# Step 0: Complexity Profile
# =============================================================================
complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation
  entity_topology: graph
  state_machine_shape: branching
  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0: Response Envelope (FIXED — emit verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1: Entity-Relationship Table
# =============================================================================
entities:
  - name: ServiceProvider
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Legal name of the digital service provider" }
      - name: participation_status
        type: enum
        source: system
        default: PENDING
        description: "PENDING | ACTIVE | SUSPENDED | TERMINATED. DSP participation posture under the blanket license."
        constraints: "enum PENDING | ACTIVE | SUSPENDED | TERMINATED"
      - name: accepted_rate_schedule_version
        type: integer
        source: system
        description: "Version of the active RateSchedule the DSP last acknowledged. Auto-bumped on schedule change; required literal input on report acceptance."
      - { name: audit_credits, type: integer, source: system, default: 0, description: "Unused audit entitlements held by this DSP; one credit is consumed per audit opening" }

  - name: Member
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Legal or professional name of the rights holder" }
      - name: member_type
        type: enum
        source: input
        description: "PUBLISHER | SELF_PUBLISHED_SONGWRITER | ADMINISTRATOR. Membership class."
        constraints: "enum PUBLISHER | SELF_PUBLISHED_SONGWRITER | ADMINISTRATOR"
      - name: ipi_number
        type: string
        source: input
        description: "Interested Parties Information number; unique across members when non-null"
        constraints: "unique among members with a non-null ipi_number; null permitted for members without an IPI"
      - { name: is_signatory, type: boolean, source: input, default: false, description: "Whether the member's shares are eligible as signatory market share in historical distributions" }
      - name: status
        type: enum
        source: system
        default: ACTIVE
        description: "ACTIVE | SUSPENDED | TERMINATED. Member account posture."
        constraints: "enum ACTIVE | SUSPENDED | TERMINATED"
      - name: prior_market_share_numerator
        type: integer
        source: computed
        default: 0
        description: "Computed at CycleRun close: signatory members = usage-based count; non-signatory = 1. Frozen for use as the prior epoch in later runs."
      - name: prior_market_share_denominator
        type: integer
        source: computed
        default: 0
        description: "Computed at CycleRun close: signatory members = total signatory usage; non-signatory = count of all members who received any distribution. Frozen with the numerator."

  - name: Payee
    parent: Member
    common_fields: true
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; the member this payee receives funds for" }
      - { name: payee_legal_name, type: string, source: input, description: "Legal name payments are issued to" }
      - { name: payment_method, type: enum, source: input, description: "ACH | WIRE | CHECK", constraints: "enum ACH | WIRE | CHECK" }
      - name: routing_number
        type: string
        source: input
        description: "9-digit ABA routing number; required and digit-only when payment_method is ACH or WIRE; forbidden when CHECK"
        constraints: "exactly 9 digits; must satisfy the ABA checksum: (3*(d1+d4+d7) + 7*(d2+d5+d8) + (d3+d6+d9)) mod 10 == 0"
      - { name: account_number, type: string, source: input, description: "Destination account number; required for ACH | WIRE; forbidden for CHECK" }
      - { name: tax_id, type: string, source: input, description: "US tax identifier; required for all methods", constraints: "9 digits" }
      - name: status
        type: enum
        source: system
        default: ACTIVE
        description: "ACTIVE | SUSPENDED | TERMINATED"
        constraints: "enum ACTIVE | SUSPENDED | TERMINATED"

  - name: MusicalWork
    parent: null
    common_fields: true
    fields:
      - { name: title, type: string, source: input, description: "Work title as registered" }
      - { name: iswc, type: string, source: input, description: "International Standard Musical Work Code; unique when non-null", constraints: "unique among works with non-null iswc; null permitted for unregistered ISWCs" }
      - name: status
        type: enum
        source: system
        default: ACTIVE
        description: "ACTIVE | UNDER_DISPUTE | WITHDRAWN. UNDER_DISPUTE is derived from open disputes and reverts when they resolve."
        constraints: "enum ACTIVE | UNDER_DISPUTE | WITHDRAWN"
      - { name: withdrawn_at, type: datetime, source: system, description: "Timestamp of withdrawal; null until withdrawn" }
      - { name: total_share_percent, type: number, source: computed, description: "Read-only aggregate: sum of share_percent over this work's WorkShares; maintained on every share mutation" }
      - name: match_run_count
        type: integer
        source: system
        default: 0
        description: "Number of MatchRuns in which this work was actually selected as a match target (excludes runs that evaluated it and chose nothing or another work); drives the prior-epoch market-share proxy"

  - name: WorkShare
    parent: MusicalWork
    common_fields: true
    fields:
      - { name: work_id, type: string, source: input, description: "FK -> MusicalWork.id; the work this share belongs to" }
      - { name: claimant_member_id, type: string, source: input, description: "FK -> Member.id; the member asserting ownership of this share" }
      - { name: administered_by_member_id, type: string, source: input, description: "FK -> Member.id; the administrator member (may equal claimant_member_id for self-administered shares); null when no administrator is registered" }
      - { name: share_percent, type: number, source: input, description: "Ownership share of the work, 0 < share_percent <= 100" }
      - { name: effective_from, type: datetime, source: input, description: "Inclusive start of the share's effectiveness interval" }
      - { name: effective_to, type: datetime, source: input, description: "Exclusive end of the share's effectiveness interval; null means open-ended" }
      - name: status
        type: enum
        source: system
        default: ACTIVE
        description: "ACTIVE | DISPUTED | WITHDRAWN"
        constraints: "enum ACTIVE | DISPUTED | WITHDRAWN"
      - { name: supersedes_share_id, type: string, source: input, description: "FK -> WorkShare.id; optional self-referential link declaring this share supersedes an earlier share of the same work" }

  - name: RateSchedule
    parent: null
    common_fields: true
    fields:
      - { name: effective_from, type: datetime, source: input, description: "Inclusive start of the schedule's effectiveness" }
      - { name: effective_to, type: datetime, source: input, description: "Exclusive end of effectiveness; null means open-ended" }
      - { name: rate_cents_under_5min, type: integer, source: input, description: "Statutory rate in cents for phonorecords of 5 minutes or less" }
      - { name: rate_cents_per_minute_over_5min, type: integer, source: input, description: "Statutory rate in cents per minute or fraction thereof for phonorecords over 5 minutes" }
      - name: status
        type: enum
        source: system
        default: PENDING
        description: "PENDING | ACTIVE | SUPERSEDED. Exactly one schedule is ACTIVE at a time."
        constraints: "enum PENDING | ACTIVE | SUPERSEDED"

  - name: UsageReport
    parent: ServiceProvider
    common_fields: true
    fields:
      - { name: service_provider_id, type: string, source: input, description: "FK -> ServiceProvider.id; the DSP filing this report" }
      - { name: reporting_month, type: string, source: input, description: "Calendar month of usage, YYYY-MM; must be a fully elapsed month on submission", constraints: "format YYYY-MM; month end strictly before current time" }
      - name: status
        type: enum
        source: system
        default: DRAFT
        description: "DRAFT | SUBMITTED | ACCEPTED | REJECTED | AMENDED | UNDER_AUDIT | AUDIT_CONFIRMED"
        constraints: "enum DRAFT | SUBMITTED | ACCEPTED | REJECTED | AMENDED | UNDER_AUDIT | AUDIT_CONFIRMED"
      - { name: accepted_rate_schedule_version, type: integer, source: computed, description: "Snapshot of the DSP's accepted_rate_schedule_version captured at acceptance" }
      - { name: total_usage_cents, type: integer, source: computed, default: 0, description: "Sum of royalties_cents over the report's UsageLines" }
      - { name: matched_usage_cents, type: integer, source: computed, default: 0, description: "Sum of royalties_cents over UsageLines whose status is MATCHED" }
      - { name: unmatched_usage_cents, type: integer, source: computed, default: 0, description: "Sum of royalties_cents over UsageLines whose status is UNMATCHED" }
      - { name: payment_due_at, type: datetime, source: system, description: "Payment deadline stamped at acceptance: the 15th day of the month following the reporting month, 00:00:00Z (a report accepted after its deadline is immediately LATE at the next posting run)" }

  - name: UsageLine
    parent: UsageReport
    common_fields: true
    fields:
      - { name: report_id, type: string, source: input, description: "Owning UsageReport id (sub-resource path parent); FK -> UsageReport.id" }
      - { name: isrc, type: string, source: input, description: "ISRC of the sound recording embodied in the usage", constraints: "12 characters: 2 letters, 3 alphanumeric, 7 digits" }
      - { name: track_title, type: string, source: input, description: "Track title as reported by the DSP" }
      - { name: plays_count, type: integer, source: input, description: "Number of phonorecords delivered; must be > 0" }
      - { name: duration_seconds, type: integer, source: input, description: "Playing time in seconds; must be > 0" }
      - { name: royalties_cents, type: integer, source: computed, description: "Statutory royalty for this line computed from the schedule effective on the reporting month (see usage_line_royalty calculation)" }
      - name: status
        type: enum
        source: system
        default: PENDING_MATCH
        description: "PENDING_MATCH | MATCHED | UNMATCHED | CLAIMED_MATCHED | DISPUTE_HELD | DISTRIBUTED"
        constraints: "enum PENDING_MATCH | MATCHED | UNMATCHED | CLAIMED_MATCHED | DISPUTE_HELD | DISTRIBUTED"
      - { name: matched_work_id, type: string, source: system, description: "FK -> MusicalWork.id; the work this line matched to (by auto-match or claim); null while unmatched" }

  - name: RoyaltyAccrual
    parent: UsageLine
    common_fields: true
    fields:
      - { name: usage_line_id, type: string, source: input, description: "FK -> UsageLine.id; the unmatched line this accrual holds" }
      - { name: service_provider_id, type: string, source: input, description: "FK -> ServiceProvider.id; the DSP whose usage funded the accrual" }
      - { name: amount_cents, type: integer, source: computed, description: "Snapshot of the UsageLine.royalties_cents at accrual creation; immutable thereafter" }
      - { name: hold_expires_at, type: datetime, source: system, description: "Claiming-period deadline: 36 months after the first day of the month following the UsageReport's reporting month" }
      - { name: reporting_month, type: string, source: system, description: "Reporting month copied from the UsageReport for pool-window selection" }
      - name: status
        type: enum
        source: system
        default: HELD
        description: "HELD | CLAIMED | RELEASED | DISTRIBUTED | FORFEITED"
        constraints: "enum HELD | CLAIMED | RELEASED | DISTRIBUTED | FORFEITED"
      - { name: matched_work_id, type: string, source: system, description: "FK -> MusicalWork.id; the work the accrual was claimed against; null until CLAIMED" }

  - name: MatchRun
    parent: null
    common_fields: true
    fields:
      - { name: initiated_by, type: string, source: system, description: "Opaque id of the MLCAdministrator who started the run (audit trail only)" }
      - { name: total_lines_evaluated, type: integer, source: computed, default: 0, description: "Count of PENDING_MATCH and UNMATCHED usage lines considered" }
      - { name: lines_matched, type: integer, source: computed, default: 0, description: "Count of lines transitioned to MATCHED by this run" }
      - { name: lines_promoted_unmatched, type: integer, source: computed, default: 0, description: "Count of PENDING_MATCH lines that evaluated to no-match and became UNMATCHED (spawn accruals)" }
      - { name: match_rate_bps, type: integer, source: computed, default: 0, description: "lines_matched * 10000 / total_lines_evaluated, integer division; 0 when total_lines_evaluated is 0" }
      - name: status
        type: enum
        source: system
        default: COMPLETED
        description: "COMPLETED only — a run executes atomically within its request"
        constraints: "enum COMPLETED"

  - name: Claim
    parent: RoyaltyAccrual
    common_fields: true
    fields:
      - { name: accrual_id, type: string, source: input, description: "FK -> RoyaltyAccrual.id; the held accrual being claimed" }
      - { name: claimant_member_id, type: string, source: input, description: "FK -> Member.id; the member asserting ownership" }
      - { name: claimed_work_id, type: string, source: input, description: "FK -> MusicalWork.id; the work the claimant says the usage embodies" }
      - { name: share_percent_claimed, type: number, source: input, description: "Share of the accrual asserted, 0 < share <= 100" }
      - name: status
        type: enum
        source: system
        default: PENDING
        description: "PENDING | VALIDATED | REJECTED | WITHDRAWN | DISPUTED | RESOLVED"
        constraints: "enum PENDING | VALIDATED | REJECTED | WITHDRAWN | DISPUTED | RESOLVED"

  - name: Dispute
    parent: MusicalWork
    common_fields: true
    fields:
      - { name: work_id, type: string, source: input, description: "FK -> MusicalWork.id; the work whose share is contested" }
      - { name: share_context, type: string, source: input, description: "Free-text locator naming the contested share (e.g. member and share percent); informational only" }
      - name: claim_ids
        type: array
        source: system
        description: "Server-built list of Claim ids folded into this dispute; the initiating claim is element 0"
      - name: status
        type: enum
        source: system
        default: OPEN
        description: "OPEN | RESOLVED | ESCALATED"
        constraints: "enum OPEN | RESOLVED | ESCALATED"
      - { name: resolution_note, type: string, source: input, description: "Operator note captured at resolution" }

  - name: Statement
    parent: Member
    common_fields: false
    fields:
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; the member receiving this statement" }
      - { name: period_month, type: string, source: input, description: "Statement period, YYYY-MM", constraints: "format YYYY-MM" }
      - { name: gross_cents, type: integer, source: computed, default: 0, description: "Sum of allocated_cents over the statement's StatementLines" }
      - { name: adjustments_cents, type: integer, source: computed, default: 0, description: "Signed sum of adjustment StatementLines" }
      - { name: net_cents, type: integer, source: computed, default: 0, description: "gross_cents + adjustments_cents" }
      - name: status
        type: enum
        source: system
        default: DRAFT
        description: "DRAFT | FINALIZED | DELIVERED"
        constraints: "enum DRAFT | FINALIZED | DELIVERED"

  - name: StatementLine
    parent: Statement
    common_fields: false
    fields:
      - { name: statement_id, type: string, source: input, description: "FK -> Statement.id; the statement this line rolls up into" }
      - { name: usage_line_id, type: string, source: input, description: "FK -> UsageLine.id; the usage line this allocation derives from; null for adjustment lines" }
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; the member credited" }
      - { name: allocated_cents, type: integer, source: computed, description: "Signed allocation; positive for earnings lines, may be negative for adjustments" }
      - { name: line_type, type: enum, source: input, description: "MATCHED_EARNINGS | CLAIM_EARNINGS | DISTRIBUTION | ADJUSTMENT", constraints: "enum MATCHED_EARNINGS | CLAIM_EARNINGS | DISTRIBUTION | ADJUSTMENT" }
      - { name: payee_id, type: string, source: system, description: "FK -> Payee.id; the payee resolved at posting time; null if none active", constraints: "references Payee.id or null" }

  - name: AuditEngagement
    parent: ServiceProvider
    common_fields: true
    fields:
      - { name: service_provider_id, type: string, source: input, description: "FK -> ServiceProvider.id; the DSP under audit" }
      - { name: auditor_member_id, type: string, source: input, description: "FK -> Member.id; the member that opened the audit (consumed one audit credit from the DSP)" }
      - { name: scope_months, type: array, source: input, description: "List of YYYY-MM months under examination; every month must already be covered by an AUDIT_CONFIRMED or ACCEPTED report of this DSP" }
      - name: status
        type: enum
        source: system
        default: OPEN
        description: "OPEN | FINDINGS_ISSUED | CLOSED | WITHDRAWN"
        constraints: "enum OPEN | FINDINGS_ISSUED | CLOSED | WITHDRAWN"
      - { name: findings_note, type: string, source: input, description: "Auditor findings text captured at FINDINGS_ISSUED" }
      - { name: adjustment_cents, type: integer, source: computed, default: 0, description: "Signed true-up applied to scoped reports at closure" }

  - name: CycleRun
    parent: null
    common_fields: true
    fields:
      - { name: cycle_month, type: string, source: input, description: "The calendar month in which this distribution cycle is run, YYYY-MM; unique", constraints: "format YYYY-MM; unique across CycleRuns" }
      - { name: pool_from_month, type: string, source: input, description: "Oldest reporting month whose expired accruals enter the pool, YYYY-MM" }
      - { name: pool_to_month, type: string, source: input, description: "Newest reporting month whose expired accruals enter the pool, YYYY-MM" }
      - name: status
        type: enum
        source: system
        default: OPEN
        description: "OPEN | CLOSED"
        constraints: "enum OPEN | CLOSED"
      - { name: pool_cents, type: integer, source: computed, default: 0, description: "Total cents swept into the pool at close: sum of amount_cents over swept accruals" }
      - { name: residual_cents, type: integer, source: computed, default: 0, description: "Unallocated remainder after the waterfall; equals the MLC share" }
      - { name: methodology, type: enum, source: input, description: "MARKET_SHARE_USAGE | MARKET_SHARE_PRIOR; distribution methodology pinned at creation", constraints: "enum MARKET_SHARE_USAGE | MARKET_SHARE_PRIOR" }

  - name: DistributionLine
    parent: CycleRun
    common_fields: false
    fields:
      - { name: cycle_run_id, type: string, source: input, description: "FK -> CycleRun.id; the cycle that produced this allocation" }
      - { name: member_id, type: string, source: input, description: "FK -> Member.id; the member receiving this allocation" }
      - { name: allocated_cents, type: integer, source: computed, description: "Cents allocated by the waterfall; 0 for zero-weight members" }
      - { name: weight_numerator, type: integer, source: computed, description: "The integer weight used for this member in the waterfall" }
      - { name: weight_denominator, type: integer, source: computed, description: "The common denominator used across the waterfall" }
      - { name: residual_cents, type: integer, source: computed, default: 0, description: "Remainder cents routed to this member by created_at-ASC remainder ordering" }

# =============================================================================
# §1.2: State Machine Table
# =============================================================================
state_machines:
  - entity: ServiceProvider
    initial_state: PENDING
    terminal_states: [TERMINATED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /mlc/service-providers/{id}/activate"
        actor: MLCAdministrator
        preconditions:
          - "No ACTIVE RateSchedule exists whose effective_from is in the future relative to the DSP's requested activation (informational; not blocking)"
        side_effects:
          - "accepted_rate_schedule_version initialized to the version of the ACTIVE RateSchedule (0 if none is ACTIVE)"

      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /mlc/service-providers/{id}/suspend"
        actor: MLCAdministrator
        preconditions:
          - "DSP has at least one UsageReport in SUBMITTED or UNDER_AUDIT state (ERR_DSP_NOT_SUSPENDABLE when none)"
        side_effects:
          - "Blocks new UsageReport submissions (ERR_DSP_NOT_ACTIVE)"

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /mlc/service-providers/{id}/reinstate"
        actor: MLCAdministrator
        preconditions: []
        side_effects: []

      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /mlc/service-providers/{id}/terminate"
        actor: MLCAdministrator
        preconditions:
          - "No UsageReport of this DSP is in SUBMITTED or UNDER_AUDIT state (ERR_DSP_HAS_OPEN_REPORTS)"
          - "No AuditEngagement of this DSP is in OPEN or FINDINGS_ISSUED state (ERR_AUDIT_IN_PROGRESS)"
        side_effects:
          - "All HELD accruals funded by this DSP remain HELD (pool eligibility unchanged)"

      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /mlc/service-providers/{id}/terminate"
        actor: MLCAdministrator
        preconditions:
          - "Same preconditions as ACTIVE -> TERMINATED"
        side_effects: []

  - entity: Member
    initial_state: ACTIVE
    terminal_states: [TERMINATED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /mlc/members/{id}/suspend"
        actor: MLCAdministrator
        preconditions: []
        side_effects:
          - "Member's ACTIVE Payees are unaffected (payee suspension is a separate action)"

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /mlc/members/{id}/reinstate"
        actor: MLCAdministrator
        preconditions: []
        side_effects: []

      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /mlc/members/{id}/terminate"
        actor: MLCAdministrator
        preconditions:
          - "Member is not the claimant of any WorkShare in ACTIVE or DISPUTED status (ERR_MEMBER_HAS_ACTIVE_SHARES)"
          - "Member is not the claimant of any Claim in PENDING or DISPUTED status (ERR_CLAIM_NOT_PENDING)"
        side_effects:
          - "Member's ACTIVE Payees -> TERMINATED (cascade down)"

      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /mlc/members/{id}/terminate"
        actor: MLCAdministrator
        preconditions:
          - "Same preconditions as ACTIVE -> TERMINATED"
        side_effects:
          - "Member's ACTIVE Payees -> TERMINATED (cascade down)"

  - entity: Payee
    initial_state: ACTIVE
    terminal_states: [TERMINATED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /mlc/members/{id}/payees/{payeeId}/suspend"
        actor: MLCAdministrator
        preconditions: []
        side_effects: []

      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /mlc/members/{id}/payees/{payeeId}/reinstate"
        actor: MLCAdministrator
        preconditions: []
        side_effects: []

      - from: ACTIVE
        to: TERMINATED
        trigger: "POST /mlc/members/{id}/payees/{payeeId}/terminate"
        actor: MLCAdministrator
        preconditions:
          - "The owning Member has at least one other Payee in ACTIVE or SUSPENDED status (ERR_LAST_PAYEE_TERMINATION)"
        side_effects: []

      - from: SUSPENDED
        to: TERMINATED
        trigger: "POST /mlc/members/{id}/payees/{payeeId}/terminate"
        actor: MLCAdministrator
        preconditions:
          - "The owning Member has at least one other Payee in ACTIVE or SUSPENDED status (ERR_LAST_PAYEE_TERMINATION)"
        side_effects: []

  - entity: MusicalWork
    initial_state: ACTIVE
    terminal_states: [WITHDRAWN]
    transitions:
      - from: ACTIVE
        to: UNDER_DISPUTE
        trigger: "system (automatic when a Dispute on this work enters OPEN)"
        actor: system
        preconditions: []
        side_effects:
          - "New WorkShares may still be created; claims naming this work route into the dispute"

      - from: UNDER_DISPUTE
        to: ACTIVE
        trigger: "system (automatic when the last OPEN Dispute on this work resolves; not fired when other OPEN disputes remain)"
        actor: system
        preconditions: []
        side_effects: []

      - from: ACTIVE
        to: WITHDRAWN
        trigger: "POST /mlc/works/{id}/withdraw"
        actor: MLCAdministrator
        preconditions:
          - "Work is in ACTIVE or UNDER_DISPUTE (ERR_INVALID_STATE otherwise)"
          - "No UsageLine in PENDING_MATCH, MATCHED, CLAIMED_MATCHED, or DISPUTE_HELD references this work (ERR_WORK_HAS_ACTIVE_USAGE)"
          - "No RoyaltyAccrual in HELD status names this work as matched_work_id (ERR_WORK_HAS_HELD_ACCRUALS)"
        side_effects:
          - "All WorkShares of this work in ACTIVE or DISPUTED status -> WITHDRAWN (cascade down)"
          - "withdrawn_at stamped"

      - from: UNDER_DISPUTE
        to: WITHDRAWN
        trigger: "POST /mlc/works/{id}/withdraw"
        actor: MLCAdministrator
        preconditions:
          - "Same preconditions as ACTIVE -> WITHDRAWN"
          - "All OPEN Disputes on this work are force-closed as ESCALATED with resolution_note 'WORK_WITHDRAWN' (side effect, not a precondition)"
        side_effects:
          - "Same cascade as ACTIVE -> WITHDRAWN"

  - entity: WorkShare
    initial_state: ACTIVE
    terminal_states: [WITHDRAWN]
    transitions:
      - from: null
        to: ACTIVE
        trigger: "POST /mlc/works/{id}/shares (creation)"
        actor: MLCAdministrator
        preconditions:
          - "Sum of share_percent over the work's ACTIVE WorkShares plus the new share must not exceed 100 (ERR_SHARE_SUM_EXCEEDS_100)"
          - "No overlapping same-claimant ACTIVE share without supersedes_share_id (ERR_SHARE_OVERLAP_NEEDS_SUPERSEDE)"
          - "expected_work_version must equal the work's current version (ERR_STALE_VERSION)"
        side_effects:
          - "MusicalWork.total_share_percent recomputed"
          - "MusicalWork.version incremented by 1"
          - "Superseded share -> WITHDRAWN when supersedes_share_id present"

      - from: ACTIVE
        to: DISPUTED
        trigger: "system (automatic when a Dispute naming this share's work and context opens)"
        actor: system
        preconditions: []
        side_effects: []

      - from: DISPUTED
        to: ACTIVE
        trigger: "system (automatic when the owning dispute resolves in this share's favor)"
        actor: system
        preconditions: []
        side_effects: []

      - from: DISPUTED
        to: WITHDRAWN
        trigger: "system (automatic when the owning dispute resolves against this share, or the work withdraws)"
        actor: system
        preconditions: []
        side_effects: []

      - from: ACTIVE
        to: WITHDRAWN
        trigger: "POST /mlc/works/{id}/shares/{shareId}/withdraw (or system cascade on work withdrawal)"
        actor: MLCAdministrator
        preconditions:
          - "Share is in ACTIVE status (ERR_INVALID_STATE otherwise)"
        side_effects:
          - "MusicalWork.total_share_percent recomputed (derived field reconciliation; rejects with ERR_SHARE_SUM_EXCEEDS_100 when the remaining ACTIVE shares still exceed 100 — impossible after a withdrawal, so this never fires here)"

  - entity: RateSchedule
    initial_state: PENDING
    terminal_states: [SUPERSEDED]
    transitions:
      - from: PENDING
        to: ACTIVE
        trigger: "POST /mlc/rate-schedules/{id}/activate"
        actor: MLCAdministrator
        preconditions:
          - "effective_from <= current logical time (ERR_RATE_SCHEDULE_NOT_YET_EFFECTIVE)"
          - "No other ACTIVE RateSchedule has an overlapping [effective_from, effective_to) window with this one (ERR_RATE_SCHEDULE_OVERLAP)"
        side_effects:
          - "Any other RateSchedule in ACTIVE status -> SUPERSEDED (at most one is ACTIVE)"
          - "Every ServiceProvider in ACTIVE or SUSPENDED status: accepted_rate_schedule_version := this schedule's version (bubble up)"

      - from: ACTIVE
        to: SUPERSEDED
        trigger: "system (automatic when another schedule activates)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: UsageReport
    initial_state: DRAFT
    terminal_states: [AMENDED, AUDIT_CONFIRMED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /mlc/usage-reports/{id}/submit"
        actor: ServiceProviderUser
        preconditions:
          - "Owning DSP is in ACTIVE status (ERR_DSP_NOT_ACTIVE)"
          - "Report has at least one UsageLine (ERR_EMPTY_REPORT)"
          - "reporting_month is a fully elapsed month (ERR_FUTURE_PERIOD)"
          - "The payload's accepted_rate_schedule_version equals the DSP's current accepted_rate_schedule_version (ERR_STALE_RATE_SCHEDULE)"
        side_effects:
          - "Recompute total_usage_cents over the report's lines (ledger sync)"

      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /mlc/usage-reports/{id}/accept"
        actor: MLCAdministrator
        preconditions:
          - "Report is in SUBMITTED (ERR_INVALID_STATE)"
          - "Payload accepted_rate_schedule_version equals the DSP's current accepted_rate_schedule_version (ERR_STALE_RATE_SCHEDULE)"
          - "The DSP's other reports: no earlier reporting_month is still in SUBMITTED state (ERR_OUT_OF_ORDER_ACCEPTANCE)"
        side_effects:
          - "accepted_rate_schedule_version snapshot stored on the report"
          - "payment_due_at stamped = 15th of month following reporting_month, 00:00:00Z"
          - "Every UsageLine of the report in PENDING_MATCH -> evaluated by the acceptance match sweep: lines that match become MATCHED (royalty posting queued); lines that do not match become UNMATCHED and spawn a HELD RoyaltyAccrual (cascade: UsageReport -> UsageLine -> RoyaltyAccrual)"
          - "matched_usage_cents and unmatched_usage_cents computed and frozen on the report"
          - "One audit credit granted to the DSP (audit_credits += 1)"

      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /mlc/usage-reports/{id}/reject"
        actor: MLCAdministrator
        preconditions:
          - "Report is in SUBMITTED (ERR_INVALID_STATE)"
        side_effects:
          - "Report returns to DRAFT on resubmission path (see REJECTED -> DRAFT)"

      - from: REJECTED
        to: DRAFT
        trigger: "POST /mlc/usage-reports/{id}/reopen"
        actor: ServiceProviderUser
        preconditions:
          - "Report is in REJECTED (ERR_INVALID_STATE)"
        side_effects:
          - "Cycle DRAFT -> SUBMITTED -> REJECTED -> DRAFT may repeat without bound"

      - from: ACCEPTED
        to: UNDER_AUDIT
        trigger: "system (automatic when an AuditEngagement covering this report's month opens)"
        actor: system
        preconditions: []
        side_effects: []

      - from: UNDER_AUDIT
        to: AUDIT_CONFIRMED
        trigger: "system (automatic when the covering AuditEngagement closes with adjustment_cents == 0)"
        actor: system
        preconditions: []
        side_effects: []

      - from: UNDER_AUDIT
        to: AMENDED
        trigger: "system (automatic when the covering AuditEngagement closes with adjustment_cents != 0)"
        actor: system
        preconditions: []
        side_effects:
          - "total_usage_cents, matched_usage_cents, unmatched_usage_cents adjusted by the audit's adjustment_cents (applied to matched first; overflow to unmatched)"
          - "Signed delta flows into an ADJUSTMENT StatementLine on the DSP-facing statement of the auditor member's next FINALIZED statement (ledger sync)"

  - entity: UsageLine
    initial_state: PENDING_MATCH
    terminal_states: [DISTRIBUTED]
    transitions:
      - from: PENDING_MATCH
        to: MATCHED
        trigger: "system (match sweep at report acceptance or MatchRun)"
        actor: system
        preconditions:
          - "Exactly one ACTIVE MusicalWork survives the deterministic matcher for this line (see deterministic_matching calculation)"
        side_effects:
          - "matched_work_id set"
          - "Matched-earnings posting: for each ACTIVE WorkShare of the matched work effective at the report's reporting month, compute allocated cents (see per_share_allocation); these postings queue for the next Statement finalization of each claimant member"

      - from: PENDING_MATCH
        to: UNMATCHED
        trigger: "system (match sweep at report acceptance or MatchRun, no surviving work)"
        actor: system
        preconditions: []
        side_effects:
          - "Spawn a HELD RoyaltyAccrual with amount_cents = this line's royalties_cents, hold_expires_at = reporting_month + 1 month, day 1, + 36 months (cascade)"

      - from: UNMATCHED
        to: MATCHED
        trigger: "system (a later MatchRun re-evaluates UNMATCHED lines and the deterministic matcher now resolves exactly one work — data-quality improvement path)"
        actor: system
        preconditions:
          - "Exactly one ACTIVE MusicalWork survives the deterministic matcher for this line"
        side_effects:
          - "The line's HELD RoyaltyAccrual -> RELEASED, its cents return to the matched-royalty stream (compensating invariant R2)"
          - "matched_work_id set; matched-earnings postings queued as in PENDING_MATCH -> MATCHED"

      - from: UNMATCHED
        to: CLAIMED_MATCHED
        trigger: "system (automatic when a Claim on this line's accrual is VALIDATED)"
        actor: system
        preconditions: []
        side_effects:
          - "matched_work_id set to the claim's claimed_work_id"
          - "Accrual -> CLAIMED; claim-earnings postings computed per per_share_allocation against the claimed work"

      - from: CLAIMED_MATCHED
        to: DISPUTE_HELD
        trigger: "system (automatic when a Dispute opens over the claimed share)"
        actor: system
        preconditions: []
        side_effects:
          - "Queued claim-earnings postings for this line are frozen until the dispute resolves"

      - from: DISPUTE_HELD
        to: CLAIMED_MATCHED
        trigger: "system (automatic when the dispute resolves and the claim survives)"
        actor: system
        preconditions: []
        side_effects:
          - "Frozen postings unfreeze"

      - from: DISPUTE_HELD
        to: UNMATCHED
        trigger: "system (automatic when the dispute resolves against the claim)"
        actor: system
        preconditions: []
        side_effects:
          - "Accrual returns to HELD (claim folded back); matched_work_id cleared"
          - "Frozen postings discarded"

      - from: MATCHED
        to: DISTRIBUTED
        trigger: "system (automatic when the line's matched earnings have been posted to a FINALIZED statement AND the work is later swept by a CycleRun that includes the line's reporting month)"
        actor: system
        preconditions: []
        side_effects: []

      - from: UNMATCHED
        to: DISTRIBUTED
        trigger: "system (automatic when the line's accrual is swept into a CLOSED CycleRun pool)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: RoyaltyAccrual
    initial_state: HELD
    terminal_states: [DISTRIBUTED, FORFEITED]
    transitions:
      - from: HELD
        to: CLAIMED
        trigger: "system (automatic when a Claim against this accrual is VALIDATED)"
        actor: system
        preconditions: []
        side_effects:
          - "matched_work_id set to the claim's claimed_work_id"
          - "Accrual amount flows to claim-earnings postings via per_share_allocation"

      - from: HELD
        to: RELEASED
        trigger: "system (automatic when a MatchRun matches the accrual's usage line)"
        actor: system
        preconditions: []
        side_effects:
          - "Accrual amount returns to the matched-royalty stream (compensating invariant R2)"

      - from: HELD
        to: DISTRIBUTED
        trigger: "system (automatic at CycleRun close when hold_expires_at <= cycle close time and reporting_month within [pool_from_month, pool_to_month])"
        actor: system
        preconditions: []
        side_effects:
          - "amount_cents swept into CycleRun.pool_cents"
          - "UsageLine -> DISTRIBUTED"

      - from: HELD
        to: FORFEITED
        trigger: "system (automatic at CycleRun close when hold_expires_at <= cycle close time but reporting_month outside [pool_from_month, pool_to_month])"
        actor: system
        preconditions: []
        side_effects:
          - "amount_cents NOT swept into the pool; the funds remain outside distribution (conservation invariant P3: pool_cents counts only swept accruals)"

  - entity: Claim
    initial_state: PENDING
    terminal_states: [REJECTED, WITHDRAWN, RESOLVED]
    transitions:
      - from: PENDING
        to: VALIDATED
        trigger: "POST /mlc/claims/{id}/validate"
        actor: MLCAdministrator
        preconditions:
          - "Claim is PENDING (ERR_INVALID_STATE)"
          - "Target accrual is HELD (ERR_ACCRUAL_NOT_HELD)"
          - "The claimed work has an ACTIVE WorkShare for the claimant member with share_percent >= share_percent_claimed (ERR_CLAIMANT_SHARE_NOT_FOUND)"
          - "hold_expires_at > current logical time (ERR_HOLD_EXPIRED)"
        side_effects:
          - "Accrual -> CLAIMED; UsageLine -> CLAIMED_MATCHED"
          - "If a second PENDING claim against the same accrual's share context exists, a Dispute opens instead — see PENDING -> DISPUTED"

      - from: PENDING
        to: DISPUTED
        trigger: "system (automatic when validating a claim while another PENDING claim contests the same accrual share, or when a Dispute is opened manually over the claimed share)"
        actor: system
        preconditions: []
        side_effects:
          - "Claim folded into the new Dispute's claim_ids"
          - "UsageLine -> DISPUTE_HELD; MusicalWork -> UNDER_DISPUTE"

      - from: DISPUTED
        to: RESOLVED
        trigger: "system (automatic when the owning Dispute resolves in this claim's favor)"
        actor: system
        preconditions: []
        side_effects:
          - "If the accrual is still HELD and the line DISPUTE_HELD: accrual -> CLAIMED, line -> CLAIMED_MATCHED, postings unfreeze"

      - from: DISPUTED
        to: REJECTED
        trigger: "system (automatic when the owning Dispute resolves against this claim)"
        actor: system
        preconditions: []
        side_effects:
          - "Accrual returns to HELD; line returns to UNMATCHED"

      - from: PENDING
        to: REJECTED
        trigger: "POST /mlc/claims/{id}/reject"
        actor: MLCAdministrator
        preconditions:
          - "Claim is PENDING (ERR_INVALID_STATE)"
        side_effects: []

      - from: PENDING
        to: WITHDRAWN
        trigger: "POST /mlc/claims/{id}/withdraw"
        actor: MemberUser
        preconditions:
          - "Claim is PENDING (ERR_INVALID_STATE)"
          - "Acting member is the claimant_member_id (ERR_NOT_CLAIM_OWNER)"
        side_effects: []

  - entity: Dispute
    initial_state: OPEN
    terminal_states: [RESOLVED, ESCALATED]
    transitions:
      - from: OPEN
        to: RESOLVED
        trigger: "POST /mlc/disputes/{id}/resolve"
        actor: MLCAdministrator
        preconditions:
          - "Dispute is OPEN (ERR_INVALID_STATE)"
          - "Payload names exactly one winning claim_id from claim_ids (ERR_DISPUTE_WINNER_NOT_IN_SET)"
        side_effects:
          - "Winning claim -> RESOLVED; every other claim in claim_ids -> REJECTED"
          - "MusicalWork -> ACTIVE when no other OPEN dispute remains on the work (compound re-derivation)"
          - "UsageLine and accrual settle per the claim transitions above"

      - from: OPEN
        to: ESCALATED
        trigger: "POST /mlc/disputes/{id}/escalate"
        actor: MLCAdministrator
        preconditions:
          - "Dispute is OPEN (ERR_INVALID_STATE)"
          - "Dispute has been OPEN for at least 90 logical days (ERR_DISPUTE_TOO_FRESH)"
        side_effects:
          - "All folded claims remain DISPUTED; the accrual stays in its current hold posture (no funds move)"

  - entity: Statement
    initial_state: DRAFT
    terminal_states: [DELIVERED]
    transitions:
      - from: DRAFT
        to: FINALIZED
        trigger: "POST /mlc/members/{id}/statements/{statementId}/finalize"
        actor: MLCAdministrator
        preconditions:
          - "Statement is DRAFT (ERR_INVALID_STATE)"
          - "Member has at least one Payee in ACTIVE status (ERR_NO_ACTIVE_PAYEE)"
        side_effects:
          - "gross_cents, adjustments_cents, net_cents recomputed from current StatementLines (derived field reconciliation)"
          - "Every StatementLine.payee_id resolved to the member's ACTIVE payee (selector: the ACTIVE payee with the earliest created_at; tie-break n/a — creation order unique per member-second; empty set -> precondition failure above)"

      - from: FINALIZED
        to: DELIVERED
        trigger: "POST /mlc/members/{id}/statements/{statementId}/deliver"
        actor: MLCAdministrator
        preconditions:
          - "Statement is FINALIZED (ERR_INVALID_STATE)"
        side_effects:
          - "Statement and its lines become immutable (no update endpoint exists)"

      - from: FINALIZED
        to: DRAFT
        trigger: "POST /mlc/members/{id}/statements/{statementId}/reopen"
        actor: MLCAdministrator
        preconditions:
          - "Statement is FINALIZED (ERR_INVALID_STATE)"
          - "No newer FINALIZED or DELIVERED statement exists for the same member with period_month > this statement's period_month (ERR_STATEMENT_SUPERSEDED)"
        side_effects:
          - "Cyclic revision loop FINALIZED -> DRAFT -> FINALIZED may repeat"

  - entity: AuditEngagement
    initial_state: OPEN
    terminal_states: [CLOSED, WITHDRAWN]
    transitions:
      - from: OPEN
        to: FINDINGS_ISSUED
        trigger: "POST /mlc/audits/{id}/issue-findings"
        actor: MemberUser
        preconditions:
          - "Audit is OPEN (ERR_INVALID_STATE)"
          - "Acting member is auditor_member_id (ERR_NOT_AUDIT_OWNER)"
        side_effects:
          - "findings_note captured"

      - from: FINDINGS_ISSUED
        to: CLOSED
        trigger: "POST /mlc/audits/{id}/close"
        actor: MLCAdministrator
        preconditions:
          - "Audit is FINDINGS_ISSUED (ERR_INVALID_STATE)"
          - "Payload adjustment_cents is an integer (may be negative, zero, or positive; magnitude capped at the sum of total_usage_cents over scoped reports — ERR_AUDIT_ADJUSTMENT_OUT_OF_RANGE)"
        side_effects:
          - "Scoped UsageReports in UNDER_AUDIT -> AUDIT_CONFIRMED (adjustment 0) or AMENDED (adjustment != 0)"
          - "Adjustment ledger sync per the AMENDED transition"
          - "The DSP regains one audit credit (audit_credits += 1) when adjustment_cents == 0; consumes it permanently otherwise"

      - from: OPEN
        to: WITHDRAWN
        trigger: "POST /mlc/audits/{id}/withdraw"
        actor: MemberUser
        preconditions:
          - "Audit is OPEN (ERR_INVALID_STATE)"
          - "Acting member is auditor_member_id (ERR_NOT_AUDIT_OWNER)"
        side_effects:
          - "Scoped UsageReports in UNDER_AUDIT -> back to ACCEPTED"
          - "The DSP regains the consumed audit credit"

  - entity: CycleRun
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /mlc/cycle-runs/{id}/close"
        actor: MLCAdministrator
        preconditions:
          - "CycleRun is OPEN (ERR_INVALID_STATE)"
          - "No other CycleRun with cycle_month < this cycle_month is still OPEN (ERR_CYCLE_OUT_OF_ORDER)"
        side_effects:
          - "Sweep: every RoyaltyAccrual with hold_expires_at <= current logical time transitions per its window inclusion (DISTRIBUTED if reporting_month in [pool_from_month, pool_to_month], else FORFEITED)"
          - "pool_cents := sum of amount_cents over swept-to-DISTRIBUTED accruals"
          - "Waterfall: allocate pool_cents across members per historical_market_share_allocation (weights per methodology), creating DistributionLines and queuing DISTRIBUTION postings"
          - "Member.prior_market_share_numerator / _denominator recomputed and frozen for the next epoch (bubble up)"
          - "MusicalWork.match_run_count frozen into the usage-based proxy for signatory members"

  - entity: MatchRun
    initial_state: COMPLETED
    terminal_states: [COMPLETED]
    transitions:
      - from: COMPLETED
        to: COMPLETED
        trigger: "n/a — a MatchRun is created already-COMPLETED by POST /mlc/match-runs (atomic execution)"
        actor: MLCAdministrator
        preconditions: []
        side_effects:
          - "Data-quality initiative metric: match_rate_bps on each run provides the longitudinal series"

# =============================================================================
# §1.2.1: Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: report-submit-stale-rate-version
    parent_entity: ServiceProvider
    write_endpoint: "POST /mlc/service-providers/{id}/usage-reports/{reportId}/submit"
    occ_field: "accepted_rate_schedule_version"
    description: |
      Submitting a UsageReport whose payload accepted_rate_schedule_version
      lags the DSP's current accepted_rate_schedule_version (which advanced
      when a new RateSchedule activated) is rejected: the client priced its
      lines against a superseded schedule and must re-acknowledge. This is
      the sanctioned OCC mechanism over the DSP's rate-acknowledgement view.
    error_id: ERR_STALE_RATE_SCHEDULE
    http_status: 412

  - rule_id: report-accept-stale-rate-version
    parent_entity: ServiceProvider
    write_endpoint: "POST /mlc/service-providers/{id}/usage-reports/{reportId}/accept"
    occ_field: "accepted_rate_schedule_version"
    description: |
      Accepting a UsageReport with an accepted_rate_schedule_version that no
      longer equals the DSP's current value is rejected, even when the report
      is legitimately in SUBMITTED: a schedule change between submit and
      accept repriced the statutory basis, so the acceptance would rest on a
      stale rate view.
    error_id: ERR_STALE_RATE_SCHEDULE
    http_status: 412

  - rule_id: share-create-stale-work
    parent_entity: MusicalWork
    write_endpoint: "POST /mlc/works/{id}/shares"
    occ_field: "expected_work_version"
    description: |
      Creating a WorkShare against a MusicalWork whose version has advanced
      since the client last observed it is rejected: a superseding share may
      have just been registered (legitimately replacing the share set the
      client read), so the client's 100-percent arithmetic is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3: Calculation Rules Table
# =============================================================================
calculations:
  - name: usage_line_royalty
    trigger: "UsageLine creation (and re-derivation on report reopen)"
    algorithm: tiered_pricing
    formula: |
      Let S = the RateSchedule whose [effective_from, effective_to) contains
      the first day of the report's reporting_month (eligibility: status in
      {ACTIVE, SUPERSEDED}; the schedule ACTIVE at report acceptance is the
      authoritative one — SUPERSEDED schedules still price their own window).
      Let d = duration_seconds, n = plays_count.
      If d <= 300: unit = S.rate_cents_under_5min
      Else:        unit = max(S.rate_cents_under_5min,
                              S.rate_cents_per_minute_over_5min * ceil(d / 60))
      royalties_cents = n * unit
      All arithmetic in integer cents; no rounding occurs.
    input_set: "The UsageLine being created; the RateSchedule window containing the reporting month"
    constants:
      FIVE_MIN_SECONDS: 300
      RATE_UNDER_5MIN_CENTS_2026: 131
      RATE_PER_MIN_OVER_5MIN_CENTS_2026: 252
    precision: "integer cents; no fractional rounding"
    variants:
      - name: current_schedule_pricing
        when: "The reporting month falls in the ACTIVE schedule's window"
        difference: "Prices with the ACTIVE schedule"
      - name: superseded_schedule_pricing
        when: "The reporting month falls in a SUPERSEDED schedule's window (back-dated report)"
        difference: "Prices with the SUPERSEDED schedule for that window — identical inputs (plays, duration) yield different royalties_cents under different schedules"

  - name: report_total_reconciliation
    trigger: "UsageReport submit, accept, and audit amendment"
    algorithm: aggregation
    formula: |
      provisional_total (at submit): total_usage_cents = sum of royalties_cents
      over ALL lines regardless of line status.
      final_split (at accept): matched_usage_cents = sum over lines that the
      acceptance sweep moved to MATCHED; unmatched_usage_cents = sum over lines
      moved to UNMATCHED; the invariant
      matched_usage_cents + unmatched_usage_cents == total_usage_cents MUST hold.
      At audit amendment with signed delta D: matched_usage_cents absorbs D
      first; if matched_usage_cents would go negative, the remainder flows to
      unmatched_usage_cents (never below zero); total_usage_cents += D.
    input_set: "All UsageLines of the report (no status filter at submit; status-partitioned at accept)"
    constants: {}
    precision: "integer cents"
    variants:
      - name: provisional_total_variant
        when: "At submit, before any matching"
        difference: "Single aggregate over all lines, no status partition"
      - name: final_split_variant
        when: "At accept, after the match sweep"
        difference: "Two partitioned aggregates whose sum is invariant with the provisional total — identical line set, two readings"

  - name: deterministic_matching
    trigger: "Match sweep at report acceptance; every MatchRun"
    algorithm: constraint_propagation
    formula: |
      Candidate set for a UsageLine (isrc I, title T):
        eligibility filter: MusicalWork.status == ACTIVE, and the work is
        reachable from the ISRC-to-work registry: in this scaffold the registry
        is modeled by exact-match keys — a work is a candidate iff
        lower(trim(work.title)) == lower(trim(T)).
      Ranking expression: works with non-null iswc rank above works with null
        iswc (iswc-present flag DESC).
      Tie-break: among equal ranks, work.created_at ASC; further ties cannot
        occur (created_at has 3-fractional-digit uniqueness per write).
      Selection rule: if the candidate set is empty -> no match (line goes
      UNMATCHED). If the top-ranked candidate exists -> MATCHED to that work.
      The matcher NEVER uses work.id for any decision.
      MusicalWork.match_run_count increments only when this work is SELECTED
      (not merely evaluated).
    input_set: "UsageLines in PENDING_MATCH (at accept) or PENDING_MATCH ∪ UNMATCHED (at MatchRun); MusicalWorks in ACTIVE status"
    constants: {}
    precision: "n/a (selector)"
    variants: []

  - name: per_share_allocation
    trigger: "Matched-earnings and claim-earnings posting; statement line materialization"
    algorithm: waterfall_allocation
    formula: |
      Given a line's cents C and the ordered set of ACTIVE WorkShares of the
      matched/claimed work effective during the report's reporting month
      (effective_from <= month_start AND (effective_to IS NULL OR
      effective_to > month_start); ordering: effective_from ASC, then
      share.created_at ASC):
      ROUNDING ORDER IS PINNED: round each share's allocation first, then sum.
        allocated_i = floor(C * share_i.share_percent / 100)
      remainder = C - sum(allocated_i)
      Distribute remainder one cent at a time to shares in the pinned order,
      cycling if remainder > share count (remainder is always < 100 here
      because each floor drops < 1 cent... precisely: remainder < number of
      shares, so each share receives at most 1 remainder cent).
    input_set: "ACTIVE WorkShares of the work effective in the reporting month"
    constants: {}
    precision: "integer cents via floor per share; remainder distributed in pinned order"
    variants: []

  - name: historical_market_share_allocation
    trigger: "CycleRun close"
    algorithm: waterfall_allocation
    formula: |
      Let P = pool_cents, M = the ordered set of members with status == ACTIVE
      at close, ordered by member.created_at ASC.
      EVALUATION ORDER IS PINNED (circular-looking dependency resolved):
        step 1: compute every member's integer weight w_i (below) — weights do
                NOT depend on any allocation result.
        step 2: W = sum(w_i). If W == 0, every member receives 0 and
                residual_cents := P (the MLC keeps the pool).
        step 3: base_i = floor(P * w_i / W) for every member.
        step 4: R = P - sum(base_i). Distribute R one cent per member in the
                pinned order (member.created_at ASC) until exhausted
                (R < |M| always, so each member gets at most 1 residual cent).
        step 5: residual_cents := 0 unless W == 0 (step 2) — i.e., after the
                waterfall the residual is exactly the cents intentionally left
                unallocated by rule (zero in normal operation).
      Weight definitions (mode (a): >= 3 inputs with non-linear interaction):
        methodology == MARKET_SHARE_USAGE:
          if member.is_signatory:  w_i = number of DISTINCT MusicalWorks with
              match_run_count > 0 whose ACTIVE-or-DISPUTED WorkShares name the
              member as claimant (usage-based signatory share)
          else:                    w_i = 1 (non-signatory flat share)
        methodology == MARKET_SHARE_PRIOR:
          if member.prior_market_share_denominator > 0:
              w_i = member.prior_market_share_numerator  (prior epoch usage)
          else:
              w_i = 1  (new-member floor)
      Nested min/max arises because the new-member floor (max(w_i, 1)) and the
      signatory-vs-flat branch interact with the W == 0 collapse branch.
    input_set: "Members with status == ACTIVE at cycle close; CycleRun methodology; frozen prior-epoch fields; MusicalWork.match_run_count and WorkShare claimant links"
    constants: {}
    precision: "integer cents via floor per member; remainder in created_at ASC order"
    variants:
      - name: usage_based_market_share
        when: "methodology == MARKET_SHARE_USAGE"
        difference: "Signatory members weighted by distinct matched-work count; non-signatories flat 1"
      - name: prior_epoch_market_share
        when: "methodology == MARKET_SHARE_PRIOR"
        difference: "All members weighted by frozen prior-epoch numerator, falling back to 1 when no prior epoch exists — identical pool and membership produce different allocations across the two methodologies"

  - name: member_prior_epoch_snapshot
    trigger: "CycleRun close (after the waterfall)"
    algorithm: aggregation
    formula: |
      For every member (any status at close):
        if member.is_signatory:
          prior_market_share_numerator := count of DISTINCT MusicalWorks with
            match_run_count > 0 having a WorkShare (any status) claimant ==
            this member
          prior_market_share_denominator := total number of DISTINCT
            MusicalWorks with match_run_count > 0
        else:
          prior_market_share_numerator := 1
          prior_market_share_denominator := number of members who received a
            DistributionLine in this close (allocated_cents > 0 OR
            residual_cents > 0)
    input_set: "All members; all MusicalWorks with match_run_count > 0; this run's DistributionLines"
    constants: {}
    precision: "integer counts"
    variants: []

  - name: audit_adjustment_application
    trigger: "AuditEngagement close"
    algorithm: aggregation
    formula: |
      Let D = adjustment_cents (signed). For each scoped report, apply D in
      scope_months order (chronological by reporting_month ASC):
        absorb = min(matched_usage_cents, |D|) when D < 0, applied as negative
        matched_usage_cents += clamp(D, -matched_usage_cents, +inf)
        any unabsorbed negative remainder flows to unmatched_usage_cents
        total_usage_cents += D
      D is consumed report-by-report until exhausted.
    input_set: "UsageReports of the audited DSP whose reporting_month is in scope_months, ordered by reporting_month ASC"
    constants: {}
    precision: "integer cents"
    variants: []

# =============================================================================
# §1.4: Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers must be present and well-formed"
    error_id: ERR_MISSING_AUTH
    http_status: 401
    applies_to: "all endpoints"

  - priority: 2
    category: auth
    check: "The role in X-User-Role must be permitted for the endpoint per §1.5 roles"
    error_id: ERR_UNAUTHORIZED_ROLE
    http_status: 403
    applies_to: "all endpoints"

  - priority: 3
    category: existence
    check: "Resource ids in the path must exist, validated left-to-right"
    error_id: "ERR_SERVICE_PROVIDER_NOT_FOUND | ERR_MEMBER_NOT_FOUND | ERR_PAYEE_NOT_FOUND | ERR_WORK_NOT_FOUND | ERR_SHARE_NOT_FOUND | ERR_RATE_SCHEDULE_NOT_FOUND | ERR_USAGE_REPORT_NOT_FOUND | ERR_USAGE_LINE_NOT_FOUND | ERR_ACCRUAL_NOT_FOUND | ERR_CLAIM_NOT_FOUND | ERR_DISPUTE_NOT_FOUND | ERR_STATEMENT_NOT_FOUND | ERR_AUDIT_NOT_FOUND | ERR_CYCLE_RUN_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path ids"

  - priority: 4
    category: existence
    check: "Request body must be well-formed and all required input fields present"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all endpoints with a request body"

  - priority: 5
    category: state
    check: "Target resource must be in the state required by the operation (per §1.2 from/preconditions)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 6
    category: state
    check: "Owning ServiceProvider must be ACTIVE for report creation/submission; owning Member must be ACTIVE for payee/claim operations"
    error_id: ERR_DSP_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /mlc/service-providers/{id}/usage-reports, POST /mlc/service-providers/{id}/usage-reports/{reportId}/submit, payee and claim creation under members"

  - priority: 7
    category: business_temporal
    check: "reporting_month must be a fully elapsed month (month end strictly before current logical time)"
    error_id: ERR_FUTURE_PERIOD
    http_status: 422
    applies_to: "POST /mlc/service-providers/{id}/usage-reports, POST /mlc/service-providers/{id}/usage-reports/{reportId}/submit"

  - priority: 8
    category: business_temporal
    check: "WorkShare effective interval must be well-formed: effective_to is null or effective_to > effective_from"
    error_id: ERR_INVALID_SHARE_INTERVAL
    http_status: 422
    applies_to: "POST /mlc/works/{id}/shares"

  - priority: 9
    category: business_temporal
    check: "RateSchedule activation requires effective_from <= current logical time"
    error_id: ERR_RATE_SCHEDULE_NOT_YET_EFFECTIVE
    http_status: 422
    applies_to: "POST /mlc/rate-schedules/{id}/activate"

  - priority: 10
    category: business_constraint
    check: "Sum of share_percent over a work's ACTIVE WorkShares must not exceed 100 after this mutation"
    error_id: ERR_SHARE_SUM_EXCEEDS_100
    http_status: 409
    applies_to: "POST /mlc/works/{id}/shares"

  - priority: 11
    category: business_referential
    check: "A new WorkShare that overlaps [effective_from, effective_to) with an existing ACTIVE WorkShare of the SAME claimant_member_id on the same work must declare supersedes_share_id pointing at that share (half-open interval overlap: [a,b) vs [c,d) overlap iff a < d AND c < b)"
    error_id: ERR_SHARE_OVERLAP_NEEDS_SUPERSEDE
    http_status: 409
    applies_to: "POST /mlc/works/{id}/shares"

  - priority: 12
    category: business_referential
    check: "supersedes_share_id, when present, must name an ACTIVE or WITHDRAWN WorkShare of the same work (and on success the superseded share -> WITHDRAWN)"
    error_id: ERR_SUPERSEDES_NOT_FOUND
    http_status: 422
    applies_to: "POST /mlc/works/{id}/shares"

  - priority: 13
    category: business_safety
    check: "Payee routing_number must be exactly 9 digits and satisfy the ABA checksum (3*(d1+d4+d7)+7*(d2+d5+d8)+(d3+d6+d9)) mod 10 == 0; required for ACH|WIRE, forbidden for CHECK"
    error_id: ERR_PAYEE_ROUTING_INVALID
    http_status: 422
    applies_to: "POST /mlc/members/{id}/payees"

  - priority: 14
    category: business_fiscal
    check: "accept must not leave the DSP with unmatched_usage_cents exceeding 60% of total_usage_cents (data-quality circuit breaker; boundary: exactly 60% passes, strictly above fails — compared as unmatched_usage_cents * 100 <= 60 * total_usage_cents)"
    error_id: ERR_MATCH_RATE_FLOOR_BREACH
    http_status: 422
    applies_to: "POST /mlc/service-providers/{id}/usage-reports/{reportId}/accept"

  - priority: 15
    category: business_fiscal
    check: "accepted_rate_schedule_version in the payload must equal the DSP's current accepted_rate_schedule_version (OCC)"
    error_id: ERR_STALE_RATE_SCHEDULE
    http_status: 412
    applies_to: "POST /mlc/service-providers/{id}/usage-reports/{reportId}/submit, POST /mlc/service-providers/{id}/usage-reports/{reportId}/accept"

  - priority: 16
    category: business_fiscal
    check: "expected_work_version in the payload must equal the work's current version (OCC)"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: "POST /mlc/works/{id}/shares"

  - priority: 17
    category: business_constraint
    check: "No earlier reporting_month report of this DSP may still be in SUBMITTED state (in-order acceptance)"
    error_id: ERR_OUT_OF_ORDER_ACCEPTANCE
    http_status: 409
    applies_to: "POST /mlc/service-providers/{id}/usage-reports/{reportId}/accept"

  - priority: 18
    category: business_temporal
    check: "The new ACTIVE RateSchedule's [effective_from, effective_to) must not overlap the currently ACTIVE schedule's window (adjacent windows where one.effective_to == other.effective_from are permitted — half-open semantics)"
    error_id: ERR_RATE_SCHEDULE_OVERLAP
    http_status: 409
    applies_to: "POST /mlc/rate-schedules/{id}/activate"

  - priority: 19
    category: business_temporal
    check: "Claim validation requires accrual.hold_expires_at > current logical time (a claim at exactly hold_expires_at is rejected — boundary is strict >)"
    error_id: ERR_HOLD_EXPIRED
    http_status: 422
    applies_to: "POST /mlc/claims/{id}/validate"

  - priority: 20
    category: business_temporal
    check: "Dispute escalation requires the dispute to have been OPEN for at least 90 logical days (boundary: exactly 90 days passes)"
    error_id: ERR_DISPUTE_TOO_FRESH
    http_status: 422
    applies_to: "POST /mlc/disputes/{id}/escalate"

  - priority: 21
    category: business_safety
    check: "Segregation of duties: the MLCAdministrator who opened (initiated) a MatchRun-driven re-evaluation may not also validate a claim produced from its results; more concretely, POST /mlc/claims/{id}/validate is rejected when X-User-ID equals the initiated_by of the most recent MatchRun that touched the claim's accrual's usage line"
    error_id: ERR_SOD_CONFLICT
    http_status: 403
    applies_to: "POST /mlc/claims/{id}/validate"

  - priority: 22
    category: business_fiscal
    check: "Statement finalization requires the member to have at least one ACTIVE Payee"
    error_id: ERR_NO_ACTIVE_PAYEE
    http_status: 422
    applies_to: "POST /mlc/members/{id}/statements/{statementId}/finalize"

  - priority: 23
    category: business_fiscal
    check: "Audit closure adjustment magnitude must not exceed the sum of total_usage_cents over the scoped reports"
    error_id: ERR_AUDIT_ADJUSTMENT_OUT_OF_RANGE
    http_status: 422
    applies_to: "POST /mlc/audits/{id}/close"

  - priority: 24
    category: business_constraint
    check: "CycleRun close requires no earlier-month CycleRun still OPEN"
    error_id: ERR_CYCLE_OUT_OF_ORDER
    http_status: 409
    applies_to: "POST /mlc/cycle-runs/{id}/close"

  - priority: 25
    category: business_constraint
    check: "DSP termination requires no SUBMITTED or UNDER_AUDIT reports"
    error_id: ERR_DSP_HAS_OPEN_REPORTS
    http_status: 409
    applies_to: "POST /mlc/service-providers/{id}/terminate"

  - priority: 26
    category: business_constraint
    check: "Member termination requires no ACTIVE or DISPUTED WorkShares claimant-linked to the member"
    error_id: ERR_MEMBER_HAS_ACTIVE_SHARES
    http_status: 409
    applies_to: "POST /mlc/members/{id}/terminate"

  - priority: 27
    category: business_referential
    check: "Work withdrawal requires no non-terminal usage lines or HELD accruals referencing the work"
    error_id: ERR_WORK_HAS_ACTIVE_USAGE
    http_status: 409
    applies_to: "POST /mlc/works/{id}/withdraw"

  - priority: 28
    category: business_referential
    check: "Claim validation requires an ACTIVE WorkShare of the claimed work with claimant_member_id == claim.claimant_member_id and share_percent >= share_percent_claimed"
    error_id: ERR_CLAIMANT_SHARE_NOT_FOUND
    http_status: 422
    applies_to: "POST /mlc/claims/{id}/validate"

  - priority: 29
    category: business_referential
    check: "Claim validation requires the target accrual in HELD status"
    error_id: ERR_ACCRUAL_NOT_HELD
    http_status: 409
    applies_to: "POST /mlc/claims/{id}/validate"

  - priority: 30
    category: business_referential
    check: "Dispute resolution winner must be one of the dispute's claim_ids"
    error_id: ERR_DISPUTE_WINNER_NOT_IN_SET
    http_status: 422
    applies_to: "POST /mlc/disputes/{id}/resolve"

  - priority: 31
    category: auth
    check: "MemberUser acting on a claim/audit must be the owning claimant_member_id / auditor_member_id"
    error_id: ERR_NOT_CLAIM_OWNER
    http_status: 403
    applies_to: "POST /mlc/claims/{id}/withdraw, POST /mlc/audits/{id}/issue-findings, POST /mlc/audits/{id}/withdraw"

  - priority: 32
    category: business_constraint
    check: "AuditEngagement creation consumes one of the DSP's audit_credits; rejected when audit_credits == 0"
    error_id: ERR_AUDIT_CREDITS_EXHAUSTED
    http_status: 422
    applies_to: "POST /mlc/service-providers/{id}/audits"

  - priority: 33
    category: business_constraint
    check: "Terminating a payee requires at least one other ACTIVE or SUSPENDED payee on the member"
    error_id: ERR_LAST_PAYEE_TERMINATION
    http_status: 409
    applies_to: "POST /mlc/members/{id}/payees/{payeeId}/terminate"

# =============================================================================
# §1.5: API Endpoint Table
# =============================================================================
endpoints:
  # --- ServiceProvider ---
  - method: POST
    path: "/mlc/service-providers"
    description: "Register a digital service provider under the blanket license"
    roles: [MLCAdministrator]
    code: 201
    input: [legal_name]
    output: ServiceProvider
    side_effects: ["participation_status = PENDING", "audit_credits = 0"]

  - method: GET
    path: "/mlc/service-providers"
    description: "List service providers"
    roles: [MLCAdministrator, ServiceProviderUser, MemberUser, PublicSearcher]
    code: 200
    input: ["limit?", "offset?", "participation_status?"]
    output: "ServiceProvider[]"
    side_effects: []

  - method: GET
    path: "/mlc/service-providers/{id}"
    description: "Get one service provider"
    roles: [MLCAdministrator, ServiceProviderUser, MemberUser, PublicSearcher]
    code: 200
    input: []
    output: ServiceProvider
    side_effects: []

  - method: POST
    path: "/mlc/service-providers/{id}/activate"
    description: "Activate DSP participation"
    roles: [MLCAdministrator]
    code: 200
    input: []
    output: ServiceProvider
    side_effects: ["participation_status -> ACTIVE", "accepted_rate_schedule_version initialized from ACTIVE schedule"]

  - method: POST
    path: "/mlc/service-providers/{id}/suspend"
    description: "Suspend a DSP (requires an open report)"
    roles: [MLCAdministrator]
    code: 200
    input: []
    output: ServiceProvider
    side_effects: ["participation_status -> SUSPENDED"]

  - method: POST
    path: "/mlc/service-providers/{id}/reinstate"
    description: "Reinstate a suspended DSP"
    roles: [MLCAdministrator]
    code: 200
    input: []
    output: ServiceProvider
    side_effects: ["participation_status -> ACTIVE"]

  - method: POST
    path: "/mlc/service-providers/{id}/terminate"
    description: "Terminate DSP participation"
    roles: [MLCAdministrator]
    code: 200
    input: []
    output: ServiceProvider
    side_effects: ["participation_status -> TERMINATED"]

  - method: GET
    path: "/mlc/service-providers/{id}/usage-reports"
    description: "List usage reports of a DSP (FK reverse reachability)"
    roles: [MLCAdministrator, ServiceProviderUser]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "UsageReport[]"
    side_effects: []

  - method: GET
    path: "/mlc/service-providers/{id}/audits"
    description: "List audits of a DSP (FK reverse reachability)"
    roles: [MLCAdministrator, MemberUser]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "AuditEngagement[]"
    side_effects: []

  # --- Member ---
  - method: POST
    path: "/mlc/members"
    description: "Register a member (publisher, self-published songwriter, or administrator)"
    roles: [MLCAdministrator]
    code: 201
    input: [legal_name, member_type, "ipi_number?", "is_signatory?"]
    output: Member
    side_effects: ["status = ACTIVE"]

  - method: GET
    path: "/mlc/members"
    description: "List members"
    roles: [MLCAdministrator, ServiceProviderUser, MemberUser, PublicSearcher]
    code: 200
    input: ["limit?", "offset?", "status?", "member_type?"]
    output: "Member[]"
    side_effects: []

  - method: GET
    path: "/mlc/members/{id}"
    description: "Get one member"
    roles: [MLCAdministrator, ServiceProviderUser, MemberUser, PublicSearcher]
    code: 200
    input: []
    output: Member
    side_effects: []

  - method: POST
    path: "/mlc/members/{id}/suspend"
    description: "Suspend a member"
    roles: [MLCAdministrator]
    code: 200
    input: []
    output: Member
    side_effects: ["status -> SUSPENDED"]

  - method: POST
    path: "/mlc/members/{id}/reinstate"
    description: "Reinstate a member"
    roles: [MLCAdministrator]
    code: 200
    input: []
    output: Member
    side_effects: ["status -> ACTIVE"]

  - method: POST
    path: "/mlc/members/{id}/terminate"
    description: "Terminate a member (cascades to payees)"
    roles: [MLCAdministrator]
    code: 200
    input: []
    output: Member
    side_effects: ["status -> TERMINATED", "ACTIVE Payees -> TERMINATED"]

  - method: GET
    path: "/mlc/members/{id}/payees"
    description: "List payees of a member (FK reverse reachability)"
    roles: [MLCAdministrator, MemberUser]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "Payee[]"
    side_effects: []

  - method: GET
    path: "/mlc/members/{id}/statements"
    description: "List statements of a member (FK reverse reachability)"
    roles: [MLCAdministrator, MemberUser]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "Statement[]"
    side_effects: []

  # --- Payee ---
  - method: POST
    path: "/mlc/members/{id}/payees"
    description: "Set up a payee for a member"
    roles: [MemberUser, MLCAdministrator]
    code: 201
    input: [payee_legal_name, payment_method, "routing_number?", "account_number?", tax_id]
    output: Payee
    side_effects: ["status = ACTIVE", "ABA checksum enforced when routing_number present"]

  - method: GET
    path: "/mlc/members/{id}/payees/{payeeId}"
    description: "Get one payee"
    roles: [MLCAdministrator, MemberUser]
    code: 200
    input: []
    output: Payee
    side_effects: []

  - method: POST
    path: "/mlc/members/{id}/payees/{payeeId}/suspend"
    description: "Suspend a payee"
    roles: [MLCAdministrator]
    code: 200
    input: []
    output: Payee
    side_effects: ["status -> SUSPENDED"]

  - method: POST
    path: "/mlc/members/{id}/payees/{payeeId}/reinstate"
    description: "Reinstate a payee"
    roles: [MLCAdministrator]
    code: 200
    input: []
    output: Payee
    side_effects: ["status -> ACTIVE"]

  - method: POST
    path: "/mlc/members/{id}/payees/{payeeId}/terminate"
    description: "Terminate a payee (never the last one)"
    roles: [MLCAdministrator]
    code: 200
    input: []
    output: Payee
    side_effects: ["status -> TERMINATED"]

  # --- MusicalWork / WorkShare ---
  - method: POST
    path: "/mlc/works"
    description: "Register a musical work in the database"
    roles: [MLCAdministrator, MemberUser]
    code: 201
    input: [title, "iswc?"]
    output: MusicalWork
    side_effects: ["status = ACTIVE", "total_share_percent = 0"]

  - method: GET
    path: "/mlc/works"
    description: "Public search tool: list/search works"
    roles: [MLCAdministrator, ServiceProviderUser, MemberUser, PublicSearcher]
    code: 200
    input: ["limit?", "offset?", "title?", "iswc?", "status?"]
    output: "MusicalWork[]"
    side_effects: []

  - method: GET
    path: "/mlc/works/{id}"
    description: "Get one work"
    roles: [MLCAdministrator, ServiceProviderUser, MemberUser, PublicSearcher]
    code: 200
    input: []
    output: MusicalWork
    side_effects: []

  - method: POST
    path: "/mlc/works/{id}/withdraw"
    description: "Withdraw a work from the database"
    roles: [MLCAdministrator]
    code: 200
    input: []
    output: MusicalWork
    side_effects: ["status -> WITHDRAWN", "ACTIVE/DISPUTED WorkShares -> WITHDRAWN", "OPEN Disputes -> ESCALATED with WORK_WITHDRAWN note"]

  - method: POST
    path: "/mlc/works/{id}/shares"
    description: "Register a publisher/administrator share on a work (OCC-guarded)"
    roles: [MLCAdministrator, MemberUser]
    code: 201
    input: [claimant_member_id, "administered_by_member_id?", share_percent, effective_from, "effective_to?", "supersedes_share_id?", expected_work_version]
    output: WorkShare
    side_effects: ["status = ACTIVE", "MusicalWork.total_share_percent recomputed (rejects with ERR_SHARE_SUM_EXCEEDS_100 when the sum would exceed 100)", "increments MusicalWork.version by 1", "superseded share -> WITHDRAWN when supersedes_share_id present"]

  - method: GET
    path: "/mlc/works/{id}/shares"
    description: "List shares of a work (FK reverse reachability)"
    roles: [MLCAdministrator, ServiceProviderUser, MemberUser, PublicSearcher]
    code: 200
    input: ["limit?", "offset?", "status?", "claimant_member_id?"]
    output: "WorkShare[]"
    side_effects: []

  - method: GET
    path: "/mlc/works/{id}/shares/{shareId}"
    description: "Get one share"
    roles: [MLCAdministrator, ServiceProviderUser, MemberUser, PublicSearcher]
    code: 200
    input: []
    output: WorkShare
    side_effects: []

  - method: GET
    path: "/mlc/statements/{statementId}"
    description: "Get one statement (flat alias for the member-scoped GET)"
    roles: [MLCAdministrator, MemberUser]
    code: 200
    input: []
    output: Statement
    side_effects: []

  - method: GET
    path: "/mlc/payees/{payeeId}"
    description: "Get one payee (flat alias for the member-scoped GET)"
    roles: [MLCAdministrator, MemberUser]
    code: 200
    input: []
    output: Payee
    side_effects: []

  - method: GET
    path: "/mlc/shares"
    description: "Filtered list of work shares across works (FK reverse reachability by claimant_member_id / administered_by_member_id / supersedes_share_id)"
    roles: [MLCAdministrator, ServiceProviderUser, MemberUser, PublicSearcher]
    code: 200
    input: ["limit?", "offset?", "claimant_member_id?", "administered_by_member_id?", "supersedes_share_id?", "status?"]
    output: "WorkShare[]"
    side_effects: []

  - method: GET
    path: "/mlc/shares/{id}"
    description: "Get one work share (flat alias for the work-scoped GET)"
    roles: [MLCAdministrator, ServiceProviderUser, MemberUser, PublicSearcher]
    code: 200
    input: []
    output: WorkShare
    side_effects: []

  - method: GET
    path: "/mlc/usage-lines"
