          - calculations.identity_match_confidence.variants.RENORMALIZE
        excluded_because:
          difficulty_instance: confidence_strict_zero_vs_renormalize_forks_link_state
          rationale: "That §1.8 instance feeds identical evidence to both policies and asserts the divergent confidences AND the divergent initial link states (PROPOSED vs auto-CONFIRMED with the merge cascade), which is the full variant-divergence claim."

