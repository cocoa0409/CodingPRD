  # ===========================================================================
  - rule_id: boundary_precision_check
    instances:
      - name: rent_cap_strict_greater_boundary
        grounds:
          - calculations.capped_rent_increase
          - entities.RentSchedule.fields.cap_applied
        distinguishing_aspect: "A CA proposal exactly equal to the cap ceiling (60000 -> 63000, ceiling floor(60000*1.05)=63000) sets cap_applied=false because the test is strict proposed > max_allowed — numeric-threshold boundary on the rent-schedules endpoint."
        test_recipe:
          setup:
            - "CA lot at 60000c, proposed exactly 63000c (== 5% ceiling)"
          setup_api_calls:
            - call: "POST /communities"
              payload: { name: "B1 Comm", state_code: "CA" }
              as: ParkManager
              captures: { comm_id: $.data.id }
            - call: "POST /lots"
              payload: { community_id: "${comm_id}", lot_number: "B1", base_rent_cents: 60000 }
              as: ParkManager
              captures: { lot_id: $.data.id }
          trigger:
            - call: "POST /rent-schedules"
              payload: { lot_id: "${lot_id}", proposed_rent_cents: 63000, effective_date: "2027-01-01" }
              as: ParkManager
              captures: { sched_id: $.data.id }
          assert:
            - "RentSchedule.${sched_id}.new_rent_cents == 63000"
            - "RentSchedule.${sched_id}.cap_applied == false"

      - name: apportion_empty_occupied_set_boundary
        grounds:
          - validations[priority=16]
          - errors[ERR_NO_OCCUPIED_LOTS]
          - entities.Community.fields.occupied_lot_count
        distinguishing_aspect: "Apportioning a bill when occupied_lot_count == 0 (empty candidate set, a different metric than the cap threshold) returns ERR_NO_OCCUPIED_LOTS via the apportion endpoint — empty-collection edge."
        test_recipe:
          setup:
            - "CA community with lots created but none OCCUPIED, a DRAFT WATER bill"
          setup_api_calls:
            - call: "POST /communities"
              payload: { name: "B2 Comm", state_code: "CA", utility_apportionment_method: "PER_CAPITA" }
              as: ParkManager
              captures: { comm_id: $.data.id }
            - call: "POST /lots"
              payload: { community_id: "${comm_id}", lot_number: "B2", base_rent_cents: 60000 }
              as: ParkManager
              captures: { lot_id: $.data.id }
            - call: "POST /utility-bills"
              payload: { community_id: "${comm_id}", utility_type: "WATER", period_start: "2026-01-01", period_end: "2026-02-01", master_charge_cents: 10000 }
              as: ParkManager
              captures: { bill_id: $.data.id }
          trigger:
            - call: "POST /utility-bills/${bill_id}/apportion"
              payload: {}
              as: ParkManager
          assert:
            - "response error_id == ERR_NO_OCCUPIED_LOTS"
            - "http status == 409"

  # ===========================================================================
  - rule_id: cross_entity_state_dependency
    instances:
      - name: lease_activate_depends_on_lot_status
        grounds:
          - state_machines.LotLease.PENDING_to_ACTIVE
          - state_machines.Lot.VACANT_to_OCCUPIED
          - validations[priority=8]
          - errors[ERR_LOT_NOT_VACANT]
        distinguishing_aspect: "LotLease PENDING->ACTIVE is gated by the target Lot's status: a second first-occupancy lease on an already-OCCUPIED lot is rejected ERR_LOT_NOT_VACANT — the Lease->Lot entity pair."
        test_recipe:
          setup:
            - "CA lot already OCCUPIED by resident A; a second PENDING lease for resident B targets the same lot"
          setup_api_calls:
            - call: "POST /communities"
              payload: { name: "X1 Comm", state_code: "CA" }
              as: ParkManager
              captures: { comm_id: $.data.id }
            - call: "POST /lots"
              payload: { community_id: "${comm_id}", lot_number: "X1", base_rent_cents: 60000 }
              as: ParkManager
              captures: { lot_id: $.data.id }
            - call: "POST /residents"
              payload: { community_id: "${comm_id}", full_name: "RA", household_size: 2 }
              as: ParkManager
              captures: { res_a: $.data.id }
            - call: "POST /residents"
              payload: { community_id: "${comm_id}", full_name: "RB", household_size: 2 }
              as: ParkManager
              captures: { res_b: $.data.id }
            - call: "POST /lot-leases"
              payload: { lot_id: "${lot_id}", resident_id: "${res_a}", start_date: "2026-01-01" }
              as: ParkManager
              captures: { lease_a: $.data.id }
            - call: "POST /lot-leases/${lease_a}/activate"
              payload: {}
              as: ParkManager
            - call: "POST /lot-leases"
              payload: { lot_id: "${lot_id}", resident_id: "${res_b}", start_date: "2026-02-01" }
              as: ParkManager
              captures: { lease_b: $.data.id }
          trigger:
            - call: "POST /lot-leases/${lease_b}/activate"
              payload: {}
              as: ParkManager
          assert:
            - "response error_id == ERR_LOT_NOT_VACANT"
            - "http status == 409"

      - name: supersede_blocked_by_open_eviction_on_lease
        grounds:
          - state_machines.Lot.OCCUPIED_to_OCCUPIED
          - validations[priority=10]
          - errors[ERR_EVICTION_IN_PROGRESS]
          - state_machines.EvictionCase.NOTICE_SERVED_to_CURED
        distinguishing_aspect: "A home-sale supersede activation is gated by the prior LotLease having no open EvictionCase: with a NOTICE_SERVED eviction on the lease, supersede is rejected ERR_EVICTION_IN_PROGRESS — the Lease->EvictionCase entity pair, different from Lease->Lot."
        test_recipe:
          setup:
            - "CA lot OCCUPIED by resident A, A's lease under a NOTICE_SERVED eviction (LEASE_VIOLATION); a successor lease for buyer B targets the lot with supersedes_lease_id = A's lease"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00.000Z" }
              as: ParkManager
            - call: "POST /communities"
              payload: { name: "X2 Comm", state_code: "CA" }
              as: ParkManager
              captures: { comm_id: $.data.id }
            - call: "POST /lots"
              payload: { community_id: "${comm_id}", lot_number: "X2", base_rent_cents: 60000 }
              as: ParkManager
              captures: { lot_id: $.data.id }
            - call: "POST /residents"
              payload: { community_id: "${comm_id}", full_name: "RA", household_size: 2 }
              as: ParkManager
              captures: { res_a: $.data.id }
            - call: "POST /residents"
              payload: { community_id: "${comm_id}", full_name: "RB", household_size: 2 }
              as: ParkManager
              captures: { res_b: $.data.id }
            - call: "POST /lot-leases"
              payload: { lot_id: "${lot_id}", resident_id: "${res_a}", start_date: "2026-01-01" }
              as: ParkManager
              captures: { lease_a: $.data.id }
            - call: "POST /lot-leases/${lease_a}/activate"
              payload: {}
              as: ParkManager
              captures: { lot_v: $.data.version }
            - call: "POST /eviction-cases"
              payload: { lease_id: "${lease_a}", reason: "LEASE_VIOLATION" }
              as: ParkManager
              captures: { ev_id: $.data.id }
            - call: "GET /lots/${lot_id}"
              payload: {}
              as: ParkManager
              captures: { lot_v2: $.data.version }
            - call: "POST /lot-leases"
              payload: { lot_id: "${lot_id}", resident_id: "${res_b}", start_date: "2026-02-01", supersedes_lease_id: "${lease_a}", expected_lot_version: "${lot_v2}" }
              as: ParkManager
              captures: { lease_b: $.data.id }
          trigger:
            - call: "POST /lot-leases/${lease_b}/activate"
              payload: { expected_lot_version: "${lot_v2}" }
              as: ParkManager
          assert:
            - "response error_id == ERR_EVICTION_IN_PROGRESS"
            - "http status == 409"

  # ===========================================================================
  - rule_id: resource_temporal_overlap
    instances:
      - name: rent_increase_12_month_spacing_overlap
        grounds:
          - validations[priority=11]
          - state_machines.RentSchedule.ACCEPTED_to_EFFECTIVE
          - errors[ERR_INCREASE_TOO_SOON]
          - entities.RentSchedule.fields.effective_date
        distinguishing_aspect: "Two EFFECTIVE rent increases on the same Lot must be >= 12 months apart by effective_date; a second EFFECTIVE schedule dated 6 months after the first is rejected ERR_INCREASE_TOO_SOON — closed >= interval semantics on the Lot/RentSchedule resource."
        test_recipe:
          setup:
            - "CA lot with one EFFECTIVE schedule effective 2027-01-01; a second accepted schedule effective 2027-07-01 (only 6 months later)"
          setup_api_calls:
            - call: "POST /communities"
              payload: { name: "T1 Comm", state_code: "CA" }
              as: ParkManager
              captures: { comm_id: $.data.id }
            - call: "POST /lots"
              payload: { community_id: "${comm_id}", lot_number: "T1", base_rent_cents: 60000 }
              as: ParkManager
              captures: { lot_id: $.data.id }
            - call: "POST /residents"
              payload: { community_id: "${comm_id}", full_name: "RT", household_size: 2 }
              as: ParkManager
              captures: { res_id: $.data.id }
            - call: "POST /lot-leases"
              payload: { lot_id: "${lot_id}", resident_id: "${res_id}", start_date: "2026-01-01" }
              as: ParkManager
              captures: { lease_id: $.data.id }
            - call: "POST /lot-leases/${lease_id}/activate"
              payload: {}
              as: ParkManager
            - call: "POST /rent-schedules"
              payload: { lot_id: "${lot_id}", proposed_rent_cents: 62000, effective_date: "2027-01-01" }
              as: ParkManager
              captures: { sched1: $.data.id }
            - call: "POST /rent-schedules/${sched1}/accept"
              payload: {}
              as: Resident
              as_user_id: "${res_id}"
            - call: "POST /rent-schedules/${sched1}/apply"
              payload: {}
              as: ParkManager
            - call: "POST /rent-schedules"
              payload: { lot_id: "${lot_id}", proposed_rent_cents: 63000, effective_date: "2027-07-01" }
              as: ParkManager
              captures: { sched2: $.data.id }
            - call: "POST /rent-schedules/${sched2}/accept"
              payload: {}
              as: Resident
              as_user_id: "${res_id}"
          trigger:
            - call: "POST /rent-schedules/${sched2}/apply"
              payload: {}
              as: ParkManager
          assert:
            - "response error_id == ERR_INCREASE_TOO_SOON"
            - "http status == 409"

      - name: eviction_cure_window_adjudicate_before_deadline
        grounds:
          - validations[priority=13]
          - state_machines.EvictionCase.NOTICE_SERVED_to_ADJUDICATED
          - errors[ERR_CURE_PERIOD_ACTIVE]
          - calculations.cure_deadline_derivation
        distinguishing_aspect: "Adjudication is gated by an open half-line cure window: while now <= cure_deadline the window is OPEN and adjudication is rejected ERR_CURE_PERIOD_ACTIVE — a point-vs-deadline interval on the EvictionCase resource, different semantics than the 12-month closed gap."
        test_recipe:
          setup:
            - "NONPAYMENT eviction on a CA lease (60-day cure), clock still inside the cure window (notice 2026-01-01, now 2026-02-01)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-01-01T00:00:00.000Z" }
              as: ParkManager
            - call: "POST /communities"
              payload: { name: "T2 Comm", state_code: "CA" }
              as: ParkManager
              captures: { comm_id: $.data.id }
            - call: "POST /lots"
              payload: { community_id: "${comm_id}", lot_number: "T2", base_rent_cents: 55000 }
              as: ParkManager
              captures: { lot_id: $.data.id }
            - call: "POST /residents"
              payload: { community_id: "${comm_id}", full_name: "RT2", household_size: 2 }
              as: ParkManager
              captures: { res_id: $.data.id }
            - call: "POST /lot-leases"
              payload: { lot_id: "${lot_id}", resident_id: "${res_id}", start_date: "2026-01-01" }
              as: ParkManager
              captures: { lease_id: $.data.id }
            - call: "POST /lot-leases/${lease_id}/activate"
              payload: {}
              as: ParkManager
            - call: "POST /eviction-cases"
              payload: { lease_id: "${lease_id}", reason: "NONPAYMENT" }
              as: ParkManager
              captures: { ev_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00.000Z" }
              as: ParkManager
          trigger:
            - call: "POST /eviction-cases/${ev_id}/adjudicate"
              payload: {}
              as: ParkManager
          assert:
            - "response error_id == ERR_CURE_PERIOD_ACTIVE"
            - "http status == 409"

  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: apportionment_conservation_sum_equals_master
        grounds:
          - calculations.utility_apportionment
          - entities.UtilityBill.fields.master_charge_cents
          - entities.UtilityBill.fields.apportioned_total_cents
          - entities.UtilityCharge.fields.amount_cents
        distinguishing_aspect: "Conserved quantity = total billed cents: sum(UtilityCharge.amount_cents) MUST equal UtilityBill.master_charge_cents exactly after apportionment, with no cent lost to rounding (largest-remainder distribution is the compensating step)."
        test_recipe:
          setup:
            - "CA PER_CAPITA community, 3 occupied lots hh 4/2/1, WATER master 10000c apportioned"
