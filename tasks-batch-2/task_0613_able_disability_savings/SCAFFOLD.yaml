# =============================================================================
# ABLE Disability Savings Account — state ABLE program (Expert band)
# §1.0–§1.7. Difficulty design (§1.8) and corner design (§1.9) live in sibling files.
# =============================================================================

scenario: |
  ABLE Disability Savings Account (state ABLE program): eligibility (disability onset before 26)
  & certification, contribution limit & annual cap, qualified-disability-expense (QDE) tracking,
  means-tested-benefit (SSI/Medicaid) asset disregard & $100k threshold, investment options,
  529-to-ABLE rollover, Medicaid payback at death, authorized-representative management

domain_name: able-disability-savings
api_prefix: /able

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: ledger_reconciliation
  complexity_layers:
    - rate_threshold_triggers          # $100k SSI threshold, annual cap, ABLE-to-Work FPL cap
    - dual_variant_calculation         # SSI vs Medicaid asset-disregard treatment of identical balance
    - cascading_side_effects           # contribution → balance/basis/earnings → SSI posture; death → payback waterfall
    - optimistic_concurrency           # CREATE-with-supersede on Account.version (contributions/distributions)

  entity_topology: hybrid
  # Beneficiary -> Account (1:1 lifecycle owner) -> {Contribution, Distribution, AuthorizedRepresentative,
  # InvestmentChange, Certification} children, plus QDERecord nested under Distribution and MedicaidClaim
  # nested under Account; InvestmentOption and Program are flat configuration peers.

  state_machine_shape: branching
  # Certification: branching with revert (PENDING -> {CERTIFIED, DENIED}, CERTIFIED -> EXPIRED -> recertify loop)
  # Distribution: branching fork-join (REQUESTED -> {APPROVED -> DISBURSED, REJECTED}; DISBURSED -> SUBSTANTIATED/CLAWED_BACK)
  # Account: branching lifecycle with cross-entity guards and a parallel SSI-posture dimension

  relationship_patterns:
    - one_to_many       # Account has many Contributions / Distributions / AuthorizedRepresentatives
    - cross_aggregate   # Account.ssi_posture depends on Beneficiary.other_countable_resources_cents + Program threshold
    - polymorphic       # Contribution.contribution_type spans REGULAR / ABLE_TO_WORK / ROLLOVER_529

  role_model: peer_roles
  # Beneficiary (acts on own account), AuthorizedRepresentative (acts on a managed account),
  # ProgramAdministrator (program/config/eligibility decisions), MedicaidAgency (files death payback).

  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Program
    parent: null
    common_fields: true   # id, created_at, updated_at, version
    fields:
      - { name: name, type: string, source: input, description: "State ABLE program name" }
      - { name: state_code, type: string, source: input, description: "Two-letter administering state code, e.g. CA" }
      - { name: annual_contribution_cap_cents, type: integer, source: input, description: "Base annual contribution cap = federal gift-tax exclusion, in cents (e.g. 1900000)" }
      - { name: able_to_work_fpl_cents, type: integer, source: input, description: "Federal poverty line (single, contiguous US) used as the ABLE-to-Work additional-contribution ceiling, in cents (e.g. 1506000)" }
      - { name: ssi_suspension_threshold_cents, type: integer, source: input, description: "ABLE-balance disregard ceiling for SSI ($100,000), in cents (e.g. 10000000)", default: 10000000 }
      - { name: ssi_resource_limit_cents, type: integer, source: input, description: "SSI countable-resource limit ($2,000), in cents", default: 200000 }
      - { name: program_fee_bps, type: integer, source: input, description: "Annual program management fee in basis points (e.g. 30 = 0.30%)" }
      - { name: nonqualified_additional_tax_pct, type: number, source: input, description: "Additional tax rate on the earnings portion of a non-qualified distribution (e.g. 0.10)", default: 0.10 }
      - { name: max_investment_changes_per_year, type: integer, source: input, description: "Maximum investment-option changes per calendar year (federal rule = 2)", default: 2 }
      - { name: disability_onset_max_age, type: integer, source: input, description: "Maximum age at disability onset for eligibility (26 under current law)", default: 26 }

  - name: InvestmentOption
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> Program.id" }
      - { name: name, type: string, source: input, description: "Portfolio name, e.g. Aggressive Growth" }
      - { name: risk_tier, type: enum, source: input, description: "CONSERVATIVE | MODERATE | AGGRESSIVE | CASH" }
      - { name: is_open, type: boolean, source: input, description: "Whether the portfolio accepts new elections", default: true }

  - name: Beneficiary
    parent: null
    common_fields: true
    fields:
      - { name: program_id, type: string, source: input, description: "FK -> Program.id" }
      - { name: full_name, type: string, source: input, description: "Beneficiary legal name" }
      - { name: birth_date, type: string, source: input, description: "Date of birth, ISO 8601 date (YYYY-MM-DD)" }
      - { name: disability_onset_date, type: string, source: input, description: "Date the qualifying disability began, ISO 8601 date" }
      - { name: state_code, type: string, source: input, description: "Beneficiary state of residence" }
      - { name: other_countable_resources_cents, type: integer, source: input, description: "Non-ABLE countable resources for means-test purposes, in cents", default: 0 }
      - { name: receives_ssi, type: boolean, source: input, description: "Whether the beneficiary currently receives SSI", default: false }
      - { name: receives_medicaid, type: boolean, source: input, description: "Whether the beneficiary currently receives Medicaid", default: false }
      - { name: employer_retirement_plan_participant, type: boolean, source: input, description: "True if contributing to an employer-sponsored retirement plan (disqualifies ABLE-to-Work contributions)", default: false }
      - { name: gross_employment_income_ytd_cents, type: integer, source: input, description: "Gross employment income year-to-date, in cents (caps ABLE-to-Work additional contributions)", default: 0 }
      - { name: is_deceased, type: boolean, source: computed, description: "True once a death has been recorded for this beneficiary" }
      - { name: eligibility_status, type: enum, source: computed, description: "UNCERTIFIED | CERTIFIED | DENIED | EXPIRED — CERTIFIED when a Certification with status=CERTIFIED whose half-open window [effective_date, expires_on) contains current_utc exists; otherwise mirrors the status of the Certification with the greatest effective_date (tie-break: greatest created_at); UNCERTIFIED when none exists" }

  - name: Certification
    parent: Beneficiary
    common_fields: true
    fields:
      - { name: beneficiary_id, type: string, source: input, description: "FK -> Beneficiary.id" }
      - { name: basis, type: enum, source: input, description: "SSI_SSDI_ENTITLEMENT | DISABILITY_DIAGNOSIS — the eligibility pathway claimed" }
      - { name: diagnosis_code, type: string, source: input, required: false, description: "Required when basis=DISABILITY_DIAGNOSIS; physician diagnosis code" }
      - { name: effective_date, type: string, source: input, description: "Date certification takes effect, ISO 8601 date" }
      - { name: expires_on, type: string, source: input, description: "Recertification deadline, ISO 8601 date" }
      - { name: status, type: enum, source: system, description: "PENDING -> CERTIFIED | DENIED ; CERTIFIED -> EXPIRED" }
    note: "Validity window is the half-open interval [effective_date, expires_on). Two certifications for the same beneficiary may not have overlapping windows (resource_temporal_overlap, half-open semantics — windows that share only the endpoint date do NOT overlap)."

  - name: Account
    parent: Beneficiary
    common_fields: true
    fields:
      - { name: beneficiary_id, type: string, source: input, description: "FK -> Beneficiary.id" }
      - { name: investment_option_id, type: string, source: input, description: "FK -> InvestmentOption.id — currently elected portfolio" }
      - { name: status, type: enum, source: system, description: "OPEN -> SUSPENDED -> OPEN (loop) ; OPEN/SUSPENDED -> FROZEN_DEATH -> CLOSED" }
      - { name: balance_cents, type: integer, source: computed, description: "Current account balance = basis + earnings - distributed, in cents" }
      - { name: basis_cents, type: integer, source: computed, description: "Sum of POSTED contribution amounts (cost basis), in cents" }
      - { name: earnings_cents, type: integer, source: computed, description: "Investment earnings recorded via /_market/credit_earnings minus the earnings portion of distributions, in cents" }
      - { name: regular_contrib_ytd_cents, type: integer, source: computed, description: "Sum of POSTED REGULAR + ROLLOVER_529 contribution amounts in the current calendar year, in cents (counts toward the annual cap)" }
      - { name: atw_contrib_ytd_cents, type: integer, source: computed, description: "Sum of POSTED ABLE_TO_WORK contribution amounts in the current calendar year, in cents" }
      - { name: investment_changes_ytd, type: integer, source: computed, description: "Count of investment-option changes in the current calendar year" }
      - { name: ssi_posture, type: enum, source: computed, description: "SSI_OK | SSI_SUSPENDED — SSI_SUSPENDED when SSI countable resources exceed the SSI resource limit (see ssi_asset_disregard calc)" }
      - { name: medicaid_paid_since_open_cents, type: integer, source: input, description: "Cumulative Medicaid medical assistance paid on the beneficiary's behalf since account establishment, in cents", default: 0 }
      - { name: premiums_paid_by_beneficiary_cents, type: integer, source: input, description: "Medicaid buy-in premiums the beneficiary paid while alive (deducted from any payback claim), in cents", default: 0 }

  - name: AuthorizedRepresentative
    parent: Account
    common_fields: true
    fields:
      - { name: account_id, type: string, source: input, description: "FK -> Account.id" }
      - { name: full_name, type: string, source: input, description: "Representative legal name" }
      - { name: relationship, type: enum, source: input, description: "PARENT | GUARDIAN | POA_AGENT | SPOUSE" }
      - { name: authority_start, type: string, source: input, description: "First date this representative may act, ISO 8601 date (inclusive)" }
      - { name: authority_end, type: string, source: input, description: "Last date this representative may act, ISO 8601 date (inclusive)" }
      - { name: status, type: enum, source: system, description: "ACTIVE -> REVOKED" }
    note: "Authority window is the CLOSED interval [authority_start, authority_end]. Two ACTIVE representatives with the same relationship on the same account may not have overlapping authority windows (resource_temporal_overlap, closed semantics — windows that touch at a shared endpoint date DO overlap, contrasting with Certification's half-open windows)."

  - name: Contribution
    parent: Account
    common_fields: true
    fields:
      - { name: account_id, type: string, source: input, description: "FK -> Account.id" }
      - { name: contribution_type, type: enum, source: input, description: "REGULAR | ABLE_TO_WORK | ROLLOVER_529" }
      - { name: amount_cents, type: integer, source: input, description: "Contribution amount in cents (must be > 0)" }
      - { name: source_529_plan, type: string, source: input, required: false, description: "Name of source 529 plan; required when contribution_type=ROLLOVER_529" }
      - { name: contribution_date, type: string, source: system, description: "Logical-clock date the contribution was posted, ISO 8601 date" }
      - { name: status, type: enum, source: system, description: "POSTED -> REVERSED. (A contribution that fails contribution_headroom or any validation returns an error and is NOT persisted, so there is no REJECTED state.)" }

  - name: Distribution
    parent: Account
    common_fields: true
    fields:
      - { name: account_id, type: string, source: input, description: "FK -> Account.id" }
      - { name: amount_cents, type: integer, source: input, description: "Requested distribution amount in cents (must be > 0)" }
      - { name: category, type: enum, source: input, description: "HOUSING | EDUCATION | HEALTH | TRANSPORTATION | BASIC_LIVING | LEGAL | OTHER" }
      - { name: status, type: enum, source: system, description: "REQUESTED -> APPROVED -> DISBURSED -> SUBSTANTIATED | CLAWED_BACK ; REQUESTED -> REJECTED" }
      - { name: earnings_portion_cents, type: integer, source: computed, description: "Pro-rata earnings portion of the disbursed amount at disbursement time, in cents (see distribution_earnings_split calc)" }
      - { name: qualified_amount_cents, type: integer, source: computed, description: "Sum of substantiated QDERecord.amount_cents for this distribution, in cents" }
      - { name: nonqualified_amount_cents, type: integer, source: computed, description: "amount_cents - qualified_amount_cents after substantiation, in cents" }
      - { name: additional_tax_cents, type: integer, source: computed, description: "10% additional tax on the earnings portion of the non-qualified amount, in cents (see nonqualified_penalty calc)" }
      - { name: counts_against_ssi_housing, type: boolean, source: computed, description: "True when category=HOUSING and the disbursement is retained across a month boundary (housing QDEs affect SSI)" }

  - name: QDERecord
    parent: Distribution
    common_fields: true
    fields:
      - { name: distribution_id, type: string, source: input, description: "FK -> Distribution.id" }
      - { name: expense_category, type: enum, source: input, description: "HOUSING | EDUCATION | HEALTH | TRANSPORTATION | BASIC_LIVING | LEGAL | OTHER" }
      - { name: amount_cents, type: integer, source: input, description: "Substantiated expense amount in cents (must be > 0)" }
      - { name: receipt_reference, type: string, source: input, description: "Receipt / invoice reference identifier" }
      - { name: expense_date, type: string, source: input, description: "Date the expense was incurred, ISO 8601 date" }

  - name: MedicaidClaim
    parent: Account
    common_fields: true
    fields:
      - { name: account_id, type: string, source: input, description: "FK -> Account.id" }
      - { name: claimed_amount_cents, type: integer, source: input, description: "Gross amount the Medicaid agency claims it paid since account open, in cents" }
      - { name: allowed_payback_cents, type: integer, source: computed, description: "Actual payback after deductions and the waterfall, in cents (see medicaid_payback calc)" }
      - { name: residual_to_estate_cents, type: integer, source: computed, description: "Account balance remaining for the estate after the payback waterfall, in cents" }
      - { name: status, type: enum, source: system, description: "FILED -> SETTLED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Certification
    initial_state: PENDING
    terminal_states: [DENIED, EXPIRED]
    transitions:
      - from: PENDING
        to: CERTIFIED
        trigger: "POST /able/certifications/{id}/decide (decision=APPROVE)"
        actor: ProgramAdministrator
        preconditions:
          - "Beneficiary.disability_onset_date age < Program.disability_onset_max_age (ERR_ONSET_AGE_INELIGIBLE)"
          - "basis=DISABILITY_DIAGNOSIS requires non-empty diagnosis_code (ERR_DIAGNOSIS_REQUIRED)"
        side_effects:
          - "Certification.status = CERTIFIED"
          - "Beneficiary.eligibility_status recomputed to CERTIFIED"
      - from: PENDING
        to: DENIED
        trigger: "POST /able/certifications/{id}/decide (decision=DENY)"
        actor: ProgramAdministrator
        preconditions: []
        side_effects:
          - "Certification.status = DENIED"
          - "Beneficiary.eligibility_status recomputed"
      - from: CERTIFIED
        to: EXPIRED
        trigger: "system: logical clock advances past Certification.expires_on (POST /_clock/set_current_utc)"
        actor: system
        preconditions:
          - "current_utc date >= Certification.expires_on (half-open window [effective_date, expires_on) no longer contains current_utc)"
        side_effects:
          - "Certification.status = EXPIRED"
          - "Beneficiary.eligibility_status recomputed to EXPIRED"
          - "Cross-entity: the beneficiary's Account (if OPEN) is moved to SUSPENDED (eligibility lapse)"
        note: "Recertify by creating a new, non-overlapping Certification window and approving it; reinstate then reopens the Account."

  - entity: Account
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: SUSPENDED
        trigger: "POST /able/accounts/{id}/suspend OR system on certification expiry"
        actor: ProgramAdministrator | system
        preconditions:
          - "Account.status == OPEN"
        side_effects:
          - "Account.status = SUSPENDED"
          - "Contributions and distributions are blocked while SUSPENDED (ERR_ACCOUNT_NOT_OPEN)"
      - from: SUSPENDED
        to: OPEN
        trigger: "POST /able/accounts/{id}/reinstate"
        actor: ProgramAdministrator
        preconditions:
          - "Account.status == SUSPENDED"
          - "Beneficiary.eligibility_status == CERTIFIED (ERR_NOT_CERTIFIED)"
        side_effects:
          - "Account.status = OPEN"
      - from: OPEN
        to: FROZEN_DEATH
        trigger: "POST /able/beneficiaries/{id}/record_death"
        actor: ProgramAdministrator
        preconditions:
          - "Beneficiary.is_deceased == false"
        side_effects:
          - "Beneficiary.is_deceased = true"
          - "Account.status = FROZEN_DEATH"
          - "All ACTIVE AuthorizedRepresentatives -> REVOKED"
          - "All REQUESTED/APPROVED Distributions -> REJECTED (no further beneficiary disbursements)"
          - "No new Contributions or Distributions permitted (ERR_ACCOUNT_NOT_OPEN)"
        note: "Cascade source. Death is recorded on the Beneficiary but freezes the Account."
      - from: SUSPENDED
        to: FROZEN_DEATH
        trigger: "POST /able/beneficiaries/{id}/record_death"
        actor: ProgramAdministrator
        preconditions:
          - "Beneficiary.is_deceased == false"
        side_effects:
          - "Beneficiary.is_deceased = true"
          - "Account.status = FROZEN_DEATH"
          - "All ACTIVE AuthorizedRepresentatives -> REVOKED"
      - from: FROZEN_DEATH
        to: CLOSED
        trigger: "POST /able/accounts/{id}/medicaid-claims/{claim_id}/settle"
        actor: ProgramAdministrator
        preconditions:
          - "Account.status == FROZEN_DEATH"
          - "MedicaidClaim.status == FILED"
        side_effects:
          - "MedicaidClaim.status = SETTLED"
          - "Account.balance_cents decremented by MedicaidClaim.allowed_payback_cents"
          - "MedicaidClaim.residual_to_estate_cents recorded"
          - "Account.status = CLOSED"

  - entity: AuthorizedRepresentative
    initial_state: ACTIVE
    terminal_states: [REVOKED]
    transitions:
      - from: ACTIVE
        to: REVOKED
        trigger: "POST /able/authorized-representatives/{id}/revoke OR cascade on Account -> FROZEN_DEATH"
        actor: Beneficiary | ProgramAdministrator | system
        preconditions:
          - "AuthorizedRepresentative.status == ACTIVE"
        side_effects:
          - "AuthorizedRepresentative.status = REVOKED"
          - "The representative can no longer act on the account"

  - entity: Distribution
    initial_state: REQUESTED
    terminal_states: [REJECTED, SUBSTANTIATED, CLAWED_BACK]
    transitions:
      - from: REQUESTED
        to: APPROVED
        trigger: "POST /able/distributions/{id}/approve"
        actor: Beneficiary | AuthorizedRepresentative
        preconditions:
          - "Account.status == OPEN (ERR_ACCOUNT_NOT_OPEN)"
          - "Distribution.amount_cents <= Account.balance_cents (ERR_INSUFFICIENT_BALANCE)"
        side_effects:
          - "Distribution.status = APPROVED"
      - from: REQUESTED
        to: REJECTED
        trigger: "POST /able/distributions/{id}/reject OR cascade on Account -> FROZEN_DEATH"
        actor: ProgramAdministrator | system
        preconditions:
          - "Distribution.status == REQUESTED"
        side_effects:
          - "Distribution.status = REJECTED"
      - from: APPROVED
        to: DISBURSED
        trigger: "POST /able/distributions/{id}/disburse"
        actor: Beneficiary | AuthorizedRepresentative
        preconditions:
          - "Account.status == OPEN (ERR_ACCOUNT_NOT_OPEN)"
          - "Distribution.amount_cents <= Account.balance_cents (ERR_INSUFFICIENT_BALANCE)"
        side_effects:
          - "Distribution.status = DISBURSED"
          - "distribution_earnings_split runs: Distribution.earnings_portion_cents set pro-rata at disbursement"
          - "Account.balance_cents decreases by amount_cents (basis_cents and earnings_cents reduced pro-rata)"
          - "Account.ssi_posture recomputed (ssi_asset_disregard)"
      - from: APPROVED
        to: REJECTED
        trigger: "cascade on Account -> FROZEN_DEATH"
        actor: system
        preconditions:
          - "Distribution.status == APPROVED"
        side_effects:
          - "Distribution.status = REJECTED"
      - from: DISBURSED
        to: SUBSTANTIATED
        trigger: "POST /able/distributions/{id}/substantiate"
        actor: Beneficiary | AuthorizedRepresentative
        preconditions:
          - "Distribution.status == DISBURSED"
          - "Sum of attached QDERecord.amount_cents == Distribution.amount_cents (ERR_QDE_MISMATCH)"
        side_effects:
          - "Distribution.status = SUBSTANTIATED"
          - "Distribution.qualified_amount_cents = amount_cents; nonqualified_amount_cents = 0; additional_tax_cents = 0"
      - from: DISBURSED
        to: CLAWED_BACK
        trigger: "POST /able/distributions/{id}/clawback"
        actor: ProgramAdministrator
        preconditions:
          - "Distribution.status == DISBURSED"
        side_effects:
          - "Distribution.status = CLAWED_BACK"
          - "nonqualified_penalty runs: qualified_amount_cents = sum of attached QDERecords; nonqualified_amount_cents = amount_cents - qualified_amount_cents; additional_tax_cents computed on the earnings portion of the nonqualified amount"

  - entity: MedicaidClaim
    initial_state: FILED
    terminal_states: [SETTLED]
    transitions:
      - from: FILED
        to: SETTLED
        trigger: "POST /able/accounts/{id}/medicaid-claims/{claim_id}/settle"
        actor: ProgramAdministrator
        preconditions:
          - "MedicaidClaim.status == FILED"
          - "Account.status == FROZEN_DEATH"
        side_effects:
          - "MedicaidClaim.status = SETTLED"
          - "Account.balance_cents decremented by MedicaidClaim.allowed_payback_cents"
          - "Account.status -> CLOSED"
        note: "This transition is the same operation captured in the Account FROZEN_DEATH -> CLOSED transition; the claim and the account advance together atomically."

  - entity: Contribution
    initial_state: POSTED
    terminal_states: [REVERSED]
    transitions:
      - from: POSTED
        to: REVERSED
        trigger: "POST /able/contributions/{id}/reverse"
        actor: ProgramAdministrator
        preconditions:
          - "Contribution.status == POSTED"
          - "Account.status == OPEN (ERR_ACCOUNT_NOT_OPEN)"
        side_effects:
          - "Contribution.status = REVERSED"
          - "Account.basis_cents and balance_cents decrease by amount_cents (compensating: leaves balance = sum POSTED contributions - distributed)"
          - "Account.regular_contrib_ytd_cents or atw_contrib_ytd_cents decreases by amount_cents (compensating: restores headroom)"
          - "Account.ssi_posture recomputed"
        note: "Compensating action for a posted contribution; conserves the contribution-ledger invariant."

# =============================================================================
# §1.2.1 Concurrency Rules (OCC on Account.version only)
# =============================================================================
concurrency_rules:
  - rule_id: contribution-create-stale-account
    parent_entity: Account
    write_endpoint: "POST /able/accounts/{id}/contributions"
    occ_field: "expected_account_version"
    description: |
      Posting a Contribution against an Account whose version has advanced since the
      client last observed it is rejected. A prior writer's contribution legitimately
      raised basis/balance and consumed annual-cap headroom; the current writer's view
      of the account (and thus its remaining cap) is stale, so the create is refused on
      a stale-version check.
    error_id: ERR_STALE_ACCOUNT_VERSION
    http_status: 412

  - rule_id: distribution-disburse-stale-account
    parent_entity: Account
    write_endpoint: "POST /able/distributions/{id}/disburse"
    occ_field: "expected_account_version"
    description: |
      Disbursing an APPROVED Distribution against an Account whose version has advanced
      since the client last observed it is rejected. Another disbursement or contribution
      may have changed the balance and earnings ratio that the pro-rata split depends on,
      so the current writer's observed account state is stale and the disburse is refused.
    error_id: ERR_STALE_ACCOUNT_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: contribution_headroom
    trigger: "POST /able/accounts/{id}/contributions (before POSTED)"
    algorithm: threshold
    formula: |
      # Mode (a): >=3 inputs, nested min, branch on contribution_type. Evaluated against
      # the CURRENT calendar-year YTD totals (calendar year of the logical clock).
      if contribution_type in {REGULAR, ROLLOVER_529}:
          used   = Account.regular_contrib_ytd_cents
          room   = Program.annual_contribution_cap_cents - used
          if amount_cents > room: reject ERR_ANNUAL_CAP_EXCEEDED
      if contribution_type == ROLLOVER_529:
          # additional single-rollover ceiling layered on top of the annual cap test above
          if amount_cents > Program.annual_contribution_cap_cents: reject ERR_ROLLOVER_LIMIT_EXCEEDED
      if contribution_type == ABLE_TO_WORK:
          if Beneficiary.employer_retirement_plan_participant: reject ERR_ATW_INELIGIBLE
          atw_cap = min(Program.able_to_work_fpl_cents, Beneficiary.gross_employment_income_ytd_cents)
          room    = atw_cap - Account.atw_contrib_ytd_cents
          if amount_cents > room: reject ERR_ATW_CAP_EXCEEDED
    input_set: "POSTED contributions in the current calendar year, grouped by type; ROLLOVER_529 counts with REGULAR toward the annual cap."
    constants:
      ANNUAL_CAP_REFERENCE: "Program.annual_contribution_cap_cents"
      ATW_FPL_REFERENCE: "Program.able_to_work_fpl_cents"
    precision: "integer cents; no rounding (all inputs are integer cents)"
    note: "Order is pinned: annual-cap test runs before the single-rollover-ceiling test, so a rollover that breaches both yields ERR_ANNUAL_CAP_EXCEEDED first."

  - name: ssi_asset_disregard
    trigger: "after any contribution POSTED/REVERSED, after any distribution DISBURSED, and on GET /able/accounts/{id}/means-test"
    algorithm: threshold
    formula: |
      able_countable_for_ssi = max(0, Account.balance_cents - Program.ssi_suspension_threshold_cents)
      ssi_total_countable    = Beneficiary.other_countable_resources_cents + able_countable_for_ssi
      Account.ssi_posture    = SSI_SUSPENDED if ssi_total_countable > Program.ssi_resource_limit_cents else SSI_OK
    input_set: "Single Account balance + owning Beneficiary.other_countable_resources_cents."
    constants:
      SSI_THRESHOLD: "Program.ssi_suspension_threshold_cents ($100,000)"
      SSI_RESOURCE_LIMIT: "Program.ssi_resource_limit_cents ($2,000)"
    precision: "integer cents; strict > comparison at the $100,000 and $2,000 boundaries"
    variants:
      - name: federal_ssi
        when: "Evaluating SSI eligibility (means-test endpoint, variant=SSI)"
        difference: "Only the ABLE balance ABOVE $100,000 is countable; if total countable > $2,000, SSI is SUSPENDED (not terminated)."
      - name: medicaid
        when: "Evaluating Medicaid eligibility (means-test endpoint, variant=MEDICAID)"
        difference: "The ENTIRE ABLE balance is disregarded for Medicaid regardless of the $100,000 threshold; only Beneficiary.other_countable_resources_cents is countable, so the same balance never affects Medicaid the way it affects SSI."

  - name: distribution_earnings_split
    trigger: "Distribution APPROVED -> DISBURSED"
    algorithm: aggregation
    formula: |
      # Pro-rata earnings ratio captured at disbursement time.
      if Account.balance_cents == 0: earnings_ratio = 0
      else: earnings_ratio = Account.earnings_cents / Account.balance_cents
      Distribution.earnings_portion_cents = round_half_up(amount_cents * earnings_ratio)
      basis_portion = amount_cents - Distribution.earnings_portion_cents
      Account.earnings_cents -= Distribution.earnings_portion_cents
      Account.basis_cents    -= basis_portion
      Account.balance_cents  -= amount_cents
    input_set: "Single Distribution against its Account's balance/earnings snapshot at disbursement."
    constants: {}
    precision: "2 decimal places of a dollar = integer cents, round_half_up on earnings_portion_cents"
    note: "earnings_ratio is captured at disbursement so a later balance change does not retroactively move this distribution's split."

  - name: nonqualified_penalty
    trigger: "Distribution DISBURSED -> CLAWED_BACK"
    algorithm: threshold
    formula: |
      # Mode (a): >=3 inputs (amount, substantiated QDE sum, earnings_portion), nested.
      qualified_amount_cents    = sum(QDERecord.amount_cents for QDERecords attached to this distribution)
      nonqualified_amount_cents = max(0, Distribution.amount_cents - qualified_amount_cents)
      # earnings fraction of the nonqualified part, using the split captured at disbursement
      if Distribution.amount_cents == 0: nonqual_earnings = 0
      else: nonqual_earnings = Distribution.earnings_portion_cents * (nonqualified_amount_cents / Distribution.amount_cents)
      additional_tax_cents = round_half_up(nonqual_earnings * Program.nonqualified_additional_tax_pct)
    input_set: "Single Distribution + its attached QDERecords."
    constants:
      ADDITIONAL_TAX_PCT: "Program.nonqualified_additional_tax_pct (0.10)"
    precision: "integer cents, round_half_up on additional_tax_cents"
    note: "Penalty applies only to the EARNINGS portion of the NON-QUALIFIED amount; a fully-substantiated distribution yields additional_tax_cents = 0."

  - name: medicaid_payback
    trigger: "POST /able/accounts/{id}/medicaid-claims (FILED) and on settle"
    algorithm: waterfall_allocation
    formula: |
      # Ordered buckets over the account balance at death. Mode (b)-relevant: deductions
      # are applied in a pinned order (subtract pending-approved off the top BEFORE capping,
      # then subtract premiums from the gross claim BEFORE the min) so the result is well-defined.
      pending_approved = sum(Distribution.amount_cents for Distributions in {APPROVED}) # off the top
      after_bucket1    = max(0, Account.balance_cents - pending_approved)
      claimable        = max(0, MedicaidClaim.claimed_amount_cents - Account.premiums_paid_by_beneficiary_cents)
      allowed_payback_cents     = min(after_bucket1, claimable)
      residual_to_estate_cents  = after_bucket1 - allowed_payback_cents
    input_set: "Single Account at death: balance, APPROVED distributions (pending), premiums-paid deduction, gross Medicaid claim."
    constants: {}
    precision: "integer cents; no rounding"
    note: "Premiums paid by the beneficiary are deducted from the gross claim FIRST; then the claim is capped at the post-bucket-1 balance. Order is pinned."

  - name: program_management_fee
    trigger: "POST /able/accounts/{id}/assess-fee (period close)"
    algorithm: aggregation
    formula: |
      # Mode (b): nested rounding where order matters. The monthly fee is rounded to cents
      # FIRST, then the rounded monthly fees are summed across the requested number of months
      # ("round-per-period then sum"). This is the pinned order.
      monthly_rate = (Program.program_fee_bps / 10000) / 12
      monthly_fee_cents = round_half_up(period_end_balance_cents * monthly_rate)   # per-period rounding
      total_fee_cents   = monthly_fee_cents * months          # then sum (equal-balance simplification)
      Account.balance_cents -= total_fee_cents                # fee debits basis-equivalent ledger
    input_set: "Single Account; period_end_balance_cents and months supplied in the request body."
    constants:
      FEE_BPS_REFERENCE: "Program.program_fee_bps"
    precision: "round_half_up to integer cents on EACH monthly fee BEFORE summing (round-then-sum)"
    note: "Round-then-sum is pinned: summing 12 rounded monthly fees can differ by cents from rounding one annual figure; the per-period rounding is authoritative."

  - name: certification_window_overlap
    trigger: "POST /able/beneficiaries/{id}/certifications"
    algorithm: interval_merge
    formula: |
      # HALF-OPEN interval semantics [effective_date, expires_on).
      # Two windows A=[a1,a2) and B=[b1,b2) overlap iff a1 < b2 AND b1 < a2.
      # Adjacency where a2 == b1 (one ends exactly where the next begins) is NOT an overlap.
      for each existing Certification C of this beneficiary (status in {PENDING, CERTIFIED, DENIED, EXPIRED}):
          if new.effective_date < C.expires_on AND C.effective_date < new.expires_on:
              reject ERR_CERT_WINDOW_OVERLAP
    input_set: "All Certifications of the target beneficiary, any status."
    constants: {}
    precision: "calendar-date comparison; boundary date shared between adjacent windows is exclusive on the right (no overlap)"
    note: "Contrast with representative_authority_overlap, which uses CLOSED intervals where a shared endpoint DOES overlap."

  - name: representative_authority_overlap
    trigger: "POST /able/accounts/{id}/authorized-representatives"
    algorithm: interval_merge
    formula: |
      # CLOSED interval semantics [authority_start, authority_end].
      # Two windows A=[a1,a2] and B=[b1,b2] overlap iff a1 <= b2 AND b1 <= a2.
      # Touching at a shared endpoint (a2 == b1) IS an overlap under closed semantics.
      for each existing ACTIVE AuthorizedRepresentative R on this account with R.relationship == new.relationship:
          if new.authority_start <= R.authority_end AND R.authority_start <= new.authority_end:
              reject ERR_REP_AUTHORITY_OVERLAP
    input_set: "ACTIVE AuthorizedRepresentatives on the target account whose relationship equals the new rep's relationship."
    constants: {}
    precision: "calendar-date comparison; shared endpoint date DOES collide (closed intervals)"
    note: "Contrast with certification_window_overlap, which uses HALF-OPEN intervals where a shared endpoint does NOT collide. REVOKED reps are ignored."

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header present and is one of the declared roles"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "Acting role is permitted for this operation per §1.7"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "All path-referenced resources exist, validated left-to-right"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: auth
    check: "For Beneficiary acting on own account: X-User-ID equals Account.beneficiary_id. For AuthorizedRepresentative: an ACTIVE AuthorizedRepresentative with id=X-User-ID exists on the account (ERR_NOT_ACCOUNT_OWNER)"
    error_id: ERR_NOT_ACCOUNT_OWNER
    http_status: 403
    applies_to: "account-scoped writes by Beneficiary / AuthorizedRepresentative"

  - priority: 5
    category: business_constraint
    check: "Request body fields present, correctly typed, enum members valid, amount_cents > 0"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: all writes

  - priority: 6
    category: state
    check: "Target resource is in a valid state for the requested transition (per §1.2)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: all state-transition endpoints

  - priority: 7
    category: state
    check: "OCC: expected_account_version matches Account.version on contribution-create and distribution-disburse"
    error_id: ERR_STALE_ACCOUNT_VERSION
    http_status: 412
    applies_to: "POST /able/accounts/{id}/contributions, POST /able/distributions/{id}/disburse"

  - priority: 8
    category: state
    check: "Account.status == OPEN for any contribution or distribution write"
    error_id: ERR_ACCOUNT_NOT_OPEN
    http_status: 409
    applies_to: "contributions, distributions"

  - priority: 9
    category: business_referential
    check: "Reinstate requires Beneficiary.eligibility_status == CERTIFIED"
    error_id: ERR_NOT_CERTIFIED
    http_status: 409
    applies_to: "POST /able/accounts/{id}/reinstate"

  - priority: 10
    category: business_safety
    check: "Certification approval: disability onset age strictly below Program.disability_onset_max_age"
    error_id: ERR_ONSET_AGE_INELIGIBLE
    http_status: 409
    applies_to: "POST /able/certifications/{id}/decide"

  - priority: 11
    category: business_referential
    check: "Certification with basis=DISABILITY_DIAGNOSIS must carry a non-empty diagnosis_code"
    error_id: ERR_DIAGNOSIS_REQUIRED
    http_status: 422
    applies_to: "POST /able/beneficiaries/{id}/certifications"

  - priority: 12
    category: business_constraint
    check: "ABLE_TO_WORK contribution: beneficiary is NOT an employer_retirement_plan_participant"
    error_id: ERR_ATW_INELIGIBLE
    http_status: 409
    applies_to: "POST /able/accounts/{id}/contributions"

  - priority: 13
    category: business_fiscal
    check: "REGULAR/ROLLOVER_529 contribution would not push regular_contrib_ytd over the annual cap"
    error_id: ERR_ANNUAL_CAP_EXCEEDED
    http_status: 409
    applies_to: "POST /able/accounts/{id}/contributions"

  - priority: 14
    category: business_fiscal
    check: "A single ROLLOVER_529 contribution does not exceed the annual contribution cap on its own"
    error_id: ERR_ROLLOVER_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "POST /able/accounts/{id}/contributions"

  - priority: 15
    category: business_fiscal
    check: "ABLE_TO_WORK contribution would not push atw_contrib_ytd over min(FPL, gross_employment_income_ytd)"
    error_id: ERR_ATW_CAP_EXCEEDED
    http_status: 409
    applies_to: "POST /able/accounts/{id}/contributions"

  - priority: 16
    category: business_fiscal
    check: "Distribution approve/disburse amount does not exceed Account.balance_cents"
    error_id: ERR_INSUFFICIENT_BALANCE
    http_status: 409
    applies_to: "POST /able/distributions/{id}/approve, POST /able/distributions/{id}/disburse"

  - priority: 17
    category: business_constraint
    check: "Substantiation: sum of attached QDERecord.amount_cents equals Distribution.amount_cents"
    error_id: ERR_QDE_MISMATCH
    http_status: 409
    applies_to: "POST /able/distributions/{id}/substantiate"

  - priority: 18
    category: business_constraint
    check: "Investment-option change does not exceed Program.max_investment_changes_per_year in the current calendar year"
    error_id: ERR_INVESTMENT_CHANGE_LIMIT
    http_status: 409
    applies_to: "POST /able/accounts/{id}/investment-changes"

  - priority: 19
    category: business_referential
    check: "ROLLOVER_529 contribution must carry a non-empty source_529_plan"
    error_id: ERR_INVALID_REQUEST
    http_status: 422
    applies_to: "POST /able/accounts/{id}/contributions"

  - priority: 20
    category: business_temporal
    check: "New certification window [effective_date, expires_on) must not overlap (half-open) any existing certification window for the beneficiary"
    error_id: ERR_CERT_WINDOW_OVERLAP
    http_status: 409
    applies_to: "POST /able/beneficiaries/{id}/certifications"

  - priority: 21
    category: business_temporal
    check: "New representative authority window [authority_start, authority_end] must not overlap (closed) any ACTIVE rep of the same relationship on the account"
    error_id: ERR_REP_AUTHORITY_OVERLAP
    http_status: 409
    applies_to: "POST /able/accounts/{id}/authorized-representatives"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- Program (config) ----
  - method: POST
    path: "/able/programs"
    description: "Create the state ABLE program configuration"
    roles: [ProgramAdministrator]
    code: 201
    input: [name, state_code, annual_contribution_cap_cents, able_to_work_fpl_cents, "ssi_suspension_threshold_cents?", "ssi_resource_limit_cents?", program_fee_bps, "nonqualified_additional_tax_pct?", "max_investment_changes_per_year?", "disability_onset_max_age?"]
    output: Program
    side_effects: ["Program created"]

  - method: GET
    path: "/able/programs/{id}"
    description: "Fetch a program"
    roles: [ProgramAdministrator, Beneficiary, AuthorizedRepresentative]
    code: 200
    input: []
    output: Program
    side_effects: []

  # ---- InvestmentOption (config) ----
  - method: POST
    path: "/able/investment-options"
    description: "Create an investment option (portfolio)"
    roles: [ProgramAdministrator]
    code: 201
    input: [program_id, name, risk_tier, "is_open?"]
    output: InvestmentOption
    side_effects: ["InvestmentOption created"]

  - method: GET
    path: "/able/investment-options/{id}"
    description: "Fetch an investment option"
    roles: [ProgramAdministrator, Beneficiary, AuthorizedRepresentative]
    code: 200
    input: []
    output: InvestmentOption
    side_effects: []

  - method: GET
    path: "/able/investment-options"
    description: "List investment options, optionally filtered by program"
    roles: [ProgramAdministrator, Beneficiary, AuthorizedRepresentative]
    code: 200
    input: ["program_id?", "limit?", "offset?"]
    output: InvestmentOption[]
    side_effects: []

  # ---- Beneficiary ----
  - method: POST
    path: "/able/beneficiaries"
    description: "Register a beneficiary"
    roles: [ProgramAdministrator]
    code: 201
    input: [program_id, full_name, birth_date, disability_onset_date, state_code, "other_countable_resources_cents?", "receives_ssi?", "receives_medicaid?", "employer_retirement_plan_participant?", "gross_employment_income_ytd_cents?"]
    output: Beneficiary
    side_effects: ["Beneficiary created with eligibility_status=UNCERTIFIED, is_deceased=false"]

  - method: GET
    path: "/able/beneficiaries/{id}"
    description: "Fetch a beneficiary (includes computed eligibility_status)"
    roles: [ProgramAdministrator, Beneficiary, AuthorizedRepresentative]
    code: 200
    input: []
    output: Beneficiary
    side_effects: []

  - method: GET
    path: "/able/beneficiaries"
    description: "List beneficiaries, optionally filtered by program"
    roles: [ProgramAdministrator, Beneficiary, AuthorizedRepresentative]
    code: 200
    input: ["program_id?", "limit?", "offset?"]
    output: Beneficiary[]
    side_effects: []

  - method: POST
    path: "/able/beneficiaries/{id}/record_death"
    description: "Record beneficiary death; freezes the account and cascades"
    roles: [ProgramAdministrator]
    code: 200
    input: []
    output: Beneficiary
    side_effects:
      - "Beneficiary.is_deceased=true"
      - "Account OPEN/SUSPENDED -> FROZEN_DEATH"
      - "ACTIVE AuthorizedRepresentatives -> REVOKED"
      - "REQUESTED/APPROVED Distributions -> REJECTED"

  # ---- Certification ----
  - method: POST
    path: "/able/beneficiaries/{id}/certifications"
    description: "Create a certification record; its validity window [effective_date, expires_on) must not overlap an existing certification window for this beneficiary"
    roles: [ProgramAdministrator]
    code: 201
    input: [basis, "diagnosis_code?", effective_date, expires_on]
    output: Certification
    side_effects: ["certification_window_overlap enforced (half-open)", "Certification created status=PENDING"]

  - method: GET
    path: "/able/certifications/{id}"
    description: "Fetch a certification"
    roles: [ProgramAdministrator, Beneficiary, AuthorizedRepresentative]
    code: 200
    input: []
    output: Certification
    side_effects: []

  - method: GET
    path: "/able/certifications"
    description: "List certifications, optionally filtered by beneficiary"
    roles: [ProgramAdministrator, Beneficiary, AuthorizedRepresentative]
    code: 200
    input: ["beneficiary_id?", "limit?", "offset?"]
    output: Certification[]
    side_effects: []

  - method: POST
    path: "/able/certifications/{id}/decide"
    description: "Approve or deny a pending certification"
    roles: [ProgramAdministrator]
    code: 200
    input: [decision]
    output: Certification
    side_effects:
      - "status -> CERTIFIED or DENIED"
      - "Beneficiary.eligibility_status recomputed"

  # ---- Account ----
  - method: POST
    path: "/able/accounts"
    description: "Open an ABLE account for a certified beneficiary"
    roles: [ProgramAdministrator]
    code: 201
    input: [beneficiary_id, investment_option_id, "medicaid_paid_since_open_cents?", "premiums_paid_by_beneficiary_cents?"]
    output: Account
    side_effects: ["Account created status=OPEN, balances=0, ssi_posture=SSI_OK"]

  - method: GET
    path: "/able/accounts/{id}"
    description: "Fetch an account (includes computed ledger + ssi_posture)"
    roles: [ProgramAdministrator, Beneficiary, AuthorizedRepresentative]
    code: 200
    input: []
    output: Account
    side_effects: []

  - method: GET
    path: "/able/accounts"
    description: "List accounts, optionally filtered by beneficiary or investment option"
    roles: [ProgramAdministrator, Beneficiary, AuthorizedRepresentative]
    code: 200
    input: ["beneficiary_id?", "investment_option_id?", "limit?", "offset?"]
    output: Account[]
    side_effects: []

  - method: GET
    path: "/able/accounts/{id}/means-test"
    description: "Compute means-test impact for a given variant (SSI or MEDICAID)"
    roles: [ProgramAdministrator, Beneficiary, AuthorizedRepresentative]
    code: 200
    input: [variant]
    output: "{ variant: string, able_countable_for_ssi_cents: integer, total_countable_cents: integer, ssi_posture: string, affects_benefit: boolean }"
    side_effects: []

  - method: POST
    path: "/able/accounts/{id}/suspend"
    description: "Suspend an OPEN account"
    roles: [ProgramAdministrator]
    code: 200
    input: []
    output: Account
    side_effects: ["status -> SUSPENDED"]

  - method: POST
    path: "/able/accounts/{id}/reinstate"
    description: "Reinstate a SUSPENDED account (requires CERTIFIED beneficiary)"
    roles: [ProgramAdministrator]
    code: 200
    input: []
    output: Account
    side_effects: ["status -> OPEN"]

  - method: POST
    path: "/able/accounts/{id}/assess-fee"
    description: "Assess the program management fee for a period (round-per-month then sum)"
    roles: [ProgramAdministrator]
    code: 200
    input: [period_end_balance_cents, months]
    output: Account
    side_effects: ["Account.balance_cents decremented by total_fee_cents"]

  # ---- Investment changes (event log child of Account) ----
  - method: POST
    path: "/able/accounts/{id}/investment-changes"
    description: "Change the account's elected investment option (max N per calendar year)"
    roles: [Beneficiary, AuthorizedRepresentative]
    code: 200
    input: [investment_option_id]
    output: Account
    side_effects: ["Account.investment_option_id updated", "Account.investment_changes_ytd incremented"]

  # ---- AuthorizedRepresentative ----
  - method: POST
    path: "/able/accounts/{id}/authorized-representatives"
    description: "Add an authorized representative; its authority window [authority_start, authority_end] must not overlap an existing ACTIVE rep of the same relationship on this account"
    roles: [ProgramAdministrator, Beneficiary]
    code: 201
    input: [full_name, relationship, authority_start, authority_end]
    output: AuthorizedRepresentative
    side_effects: ["representative_authority_overlap enforced (closed)", "AuthorizedRepresentative created status=ACTIVE"]

  - method: GET
    path: "/able/authorized-representatives/{id}"
    description: "Fetch an authorized representative"
    roles: [ProgramAdministrator, Beneficiary, AuthorizedRepresentative]
    code: 200
    input: []
    output: AuthorizedRepresentative
    side_effects: []

  - method: GET
    path: "/able/authorized-representatives"
    description: "List authorized representatives, optionally filtered by account"
    roles: [ProgramAdministrator, Beneficiary, AuthorizedRepresentative]
    code: 200
    input: ["account_id?", "limit?", "offset?"]
    output: AuthorizedRepresentative[]
    side_effects: []

  - method: POST
    path: "/able/authorized-representatives/{id}/revoke"
    description: "Revoke an authorized representative"
    roles: [ProgramAdministrator, Beneficiary]
    code: 200
    input: []
    output: AuthorizedRepresentative
    side_effects: ["status -> REVOKED"]

  # ---- Contribution ----
  - method: POST
    path: "/able/accounts/{id}/contributions"
    description: "Post a contribution (REGULAR / ABLE_TO_WORK / ROLLOVER_529); OCC-guarded"
    roles: [ProgramAdministrator, Beneficiary, AuthorizedRepresentative]
    code: 201
    input: [contribution_type, amount_cents, "source_529_plan?", expected_account_version]
    output: Contribution
    side_effects:
      - "contribution_headroom enforced"
      - "Contribution created status=POSTED, contribution_date stamped from logical clock"
      - "Account.basis_cents, balance_cents, and the matching YTD total increase by amount_cents"
      - "Account.ssi_posture recomputed (ssi_asset_disregard)"
      - "increments Account.version by 1"

  - method: GET
    path: "/able/contributions/{id}"
    description: "Fetch a contribution"
    roles: [ProgramAdministrator, Beneficiary, AuthorizedRepresentative]
    code: 200
    input: []
    output: Contribution
    side_effects: []

  - method: GET
    path: "/able/contributions"
    description: "List contributions, optionally filtered by account"
    roles: [ProgramAdministrator, Beneficiary, AuthorizedRepresentative]
    code: 200
    input: ["account_id?", "limit?", "offset?"]
    output: Contribution[]
    side_effects: []

  - method: POST
    path: "/able/contributions/{id}/reverse"
    description: "Reverse a posted contribution (compensating action)"
    roles: [ProgramAdministrator]
    code: 200
    input: []
    output: Contribution
    side_effects:
      - "status -> REVERSED"
      - "Account ledger and YTD total decremented by amount_cents"
      - "Account.ssi_posture recomputed"
      - "increments Account.version by 1"

  # ---- Distribution ----
  - method: POST
    path: "/able/accounts/{id}/distributions"
    description: "Request a distribution"
    roles: [ProgramAdministrator, Beneficiary, AuthorizedRepresentative]
    code: 201
    input: [amount_cents, category]
    output: Distribution
    side_effects: ["Distribution created status=REQUESTED"]

  - method: GET
    path: "/able/distributions/{id}"
    description: "Fetch a distribution (includes computed earnings/qualified/tax fields)"
    roles: [ProgramAdministrator, Beneficiary, AuthorizedRepresentative]
    code: 200
    input: []
    output: Distribution
    side_effects: []

  - method: GET
    path: "/able/distributions"
    description: "List distributions, optionally filtered by account"
    roles: [ProgramAdministrator, Beneficiary, AuthorizedRepresentative]
    code: 200
    input: ["account_id?", "limit?", "offset?"]
    output: Distribution[]
    side_effects: []

  - method: POST
    path: "/able/distributions/{id}/approve"
    description: "Approve a requested distribution"
    roles: [Beneficiary, AuthorizedRepresentative]
    code: 200
    input: []
    output: Distribution
    side_effects: ["status -> APPROVED"]

  - method: POST
    path: "/able/distributions/{id}/reject"
    description: "Reject a requested distribution"
    roles: [ProgramAdministrator]
    code: 200
    input: []
    output: Distribution
    side_effects: ["status -> REJECTED"]

  - method: POST
    path: "/able/distributions/{id}/disburse"
    description: "Disburse an approved distribution; computes pro-rata earnings split; OCC-guarded"
    roles: [Beneficiary, AuthorizedRepresentative]
    code: 200
    input: [expected_account_version]
    output: Distribution
    side_effects:
      - "status -> DISBURSED"
      - "distribution_earnings_split runs; Distribution.earnings_portion_cents set"
      - "Account.balance_cents/basis_cents/earnings_cents reduced"
      - "Account.ssi_posture recomputed"
      - "increments Account.version by 1"

  - method: POST
    path: "/able/distributions/{id}/substantiate"
    description: "Mark a disbursed distribution as fully substantiated by attached QDERecords"
    roles: [Beneficiary, AuthorizedRepresentative]
    code: 200
    input: []
    output: Distribution
    side_effects: ["status -> SUBSTANTIATED", "qualified_amount_cents/nonqualified_amount_cents/additional_tax_cents finalized"]

  - method: POST
    path: "/able/distributions/{id}/clawback"
    description: "Claw back a disbursed distribution; computes the non-qualified additional tax"
    roles: [ProgramAdministrator]
    code: 200
    input: []
    output: Distribution
    side_effects: ["status -> CLAWED_BACK", "nonqualified_penalty runs; additional_tax_cents computed"]

  # ---- QDERecord ----
  - method: POST
    path: "/able/distributions/{id}/qde-records"
    description: "Attach a qualified-disability-expense record to a disbursed distribution"
    roles: [Beneficiary, AuthorizedRepresentative]
    code: 201
    input: [expense_category, amount_cents, receipt_reference, expense_date]
    output: QDERecord
    side_effects: ["QDERecord created and linked to the distribution"]

  - method: GET
    path: "/able/qde-records/{id}"
    description: "Fetch a QDE record"
    roles: [ProgramAdministrator, Beneficiary, AuthorizedRepresentative]
    code: 200
    input: []
    output: QDERecord
    side_effects: []

  - method: GET
    path: "/able/qde-records"
    description: "List QDE records, optionally filtered by distribution"
    roles: [ProgramAdministrator, Beneficiary, AuthorizedRepresentative]
    code: 200
    input: ["distribution_id?", "limit?", "offset?"]
    output: QDERecord[]
    side_effects: []

  # ---- MedicaidClaim ----
  - method: POST
    path: "/able/accounts/{id}/medicaid-claims"
    description: "File a Medicaid payback claim against a deceased beneficiary's frozen account"
    roles: [MedicaidAgency]
    code: 201
    input: [claimed_amount_cents]
    output: MedicaidClaim
    side_effects: ["medicaid_payback computed", "MedicaidClaim created status=FILED with allowed_payback_cents + residual_to_estate_cents"]

  - method: GET
    path: "/able/medicaid-claims/{id}"
    description: "Fetch a Medicaid claim (includes computed payback + residual)"
    roles: [ProgramAdministrator, MedicaidAgency]
    code: 200
    input: []
    output: MedicaidClaim
    side_effects: []

  - method: GET
    path: "/able/medicaid-claims"
    description: "List Medicaid claims, optionally filtered by account"
    roles: [ProgramAdministrator, MedicaidAgency]
    code: 200
    input: ["account_id?", "limit?", "offset?"]
    output: MedicaidClaim[]
    side_effects: []

  - method: POST
    path: "/able/accounts/{id}/medicaid-claims/{claim_id}/settle"
    description: "Settle a filed Medicaid claim; debits payback and closes the account"
    roles: [ProgramAdministrator]
    code: 200
    input: []
    output: MedicaidClaim
    side_effects: ["MedicaidClaim.status -> SETTLED", "Account.balance_cents debited by allowed_payback_cents", "Account.status -> CLOSED"]

  # ---- Test-driving: logical clock ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Server startup default is 2026-01-01T00:00:00Z; the clock never falls back to wall time. Advancing past a CERTIFIED certification's expires_on auto-expires it and suspends the account."
    roles: [ProgramAdministrator]
    code: 200
    input: [to_iso8601]
    output: "{ current_utc: string }"
    side_effects:
      - "logical clock advanced"
      - "any CERTIFIED Certification with expires_on < new date -> EXPIRED"
      - "owning Account (if OPEN) -> SUSPENDED on such expiry"

  - method: POST
    path: "/_market/credit_earnings"
    description: "Credit investment earnings (or losses) to an account, simulating market movement"
    roles: [ProgramAdministrator]
    code: 200
    input: [account_id, earnings_delta_cents]
    output: Account
    side_effects:
      - "Account.earnings_cents and balance_cents adjusted by earnings_delta_cents"
      - "Account.ssi_posture recomputed"
      - "increments Account.version by 1"

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "X-User-Role header missing or not a recognized role" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Acting role not permitted for this operation" }
  - { id: ERR_NOT_ACCOUNT_OWNER, http: 403, condition: "Beneficiary/AuthorizedRepresentative is not the owner/active representative of the target account" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "A path-referenced resource does not exist" }
  - { id: ERR_INVALID_REQUEST, http: 422, condition: "Missing/invalid body field, bad enum, non-positive amount, or ROLLOVER_529 without source_529_plan" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource not in a valid state for the requested transition" }
  - { id: ERR_STALE_ACCOUNT_VERSION, http: 412, condition: "expected_account_version does not match Account.version on an OCC-guarded write" }
  - { id: ERR_ACCOUNT_NOT_OPEN, http: 409, condition: "Contribution/distribution attempted while Account is not OPEN" }
  - { id: ERR_NOT_CERTIFIED, http: 409, condition: "Reinstate attempted while beneficiary eligibility_status != CERTIFIED" }
  - { id: ERR_ONSET_AGE_INELIGIBLE, http: 409, condition: "Certification approval where disability onset age >= disability_onset_max_age" }
  - { id: ERR_DIAGNOSIS_REQUIRED, http: 422, condition: "DISABILITY_DIAGNOSIS certification created without a diagnosis_code" }
  - { id: ERR_ATW_INELIGIBLE, http: 409, condition: "ABLE_TO_WORK contribution by an employer-retirement-plan participant" }
  - { id: ERR_ANNUAL_CAP_EXCEEDED, http: 409, condition: "REGULAR/ROLLOVER_529 contribution would exceed the annual contribution cap" }
  - { id: ERR_ROLLOVER_LIMIT_EXCEEDED, http: 409, condition: "A single ROLLOVER_529 contribution exceeds the annual cap on its own" }
  - { id: ERR_ATW_CAP_EXCEEDED, http: 409, condition: "ABLE_TO_WORK contribution would exceed min(FPL, gross employment income YTD)" }
  - { id: ERR_INSUFFICIENT_BALANCE, http: 409, condition: "Distribution amount exceeds account balance" }
  - { id: ERR_QDE_MISMATCH, http: 409, condition: "Substantiation where attached QDERecord amounts do not sum to the distribution amount" }
  - { id: ERR_INVESTMENT_CHANGE_LIMIT, http: 409, condition: "Investment-option change would exceed the per-calendar-year limit" }
  - { id: ERR_CERT_WINDOW_OVERLAP, http: 409, condition: "New certification window overlaps (half-open) an existing certification window for the beneficiary" }
  - { id: ERR_REP_AUTHORITY_OVERLAP, http: 409, condition: "New representative authority window overlaps (closed) an existing ACTIVE rep of the same relationship on the account" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: ProgramAdministrator
    description: "Administers the program: config, eligibility decisions, account lifecycle, reversals, clawbacks, settlements"
    identity: opaque
    exclusive_operations:
      - "POST /able/programs — create program"
      - "POST /able/investment-options — create investment option"
      - "POST /able/beneficiaries — register beneficiary"
      - "POST /able/beneficiaries/{id}/record_death — record death"
      - "POST /able/beneficiaries/{id}/certifications — create certification"
      - "POST /able/certifications/{id}/decide — approve/deny certification"
      - "POST /able/accounts — open account"
      - "POST /able/accounts/{id}/suspend — suspend account"
      - "POST /able/accounts/{id}/reinstate — reinstate account"
      - "POST /able/accounts/{id}/assess-fee — assess management fee"
      - "POST /able/contributions/{id}/reverse — reverse contribution"
      - "POST /able/distributions/{id}/reject — reject distribution"
      - "POST /able/distributions/{id}/clawback — claw back distribution"
      - "POST /able/accounts/{id}/medicaid-claims/{claim_id}/settle — settle Medicaid claim"
      - "POST /_clock/set_current_utc — advance logical clock"
      - "POST /_market/credit_earnings — credit earnings"
    shared_operations:
      - "POST /able/accounts/{id}/contributions — post contribution (shared with Beneficiary, AuthorizedRepresentative)"
      - "POST /able/accounts/{id}/distributions — request distribution (shared)"
      - "POST /able/accounts/{id}/authorized-representatives — add representative (shared with Beneficiary)"
      - "POST /able/authorized-representatives/{id}/revoke — revoke representative (shared with Beneficiary)"
      - "GET endpoints — reads"

  - name: Beneficiary
    description: "The account owner with a disability; acts on their own account"
    identity: "entity_backed:Beneficiary"
    exclusive_operations: []
    shared_operations:
      - "POST /able/accounts/{id}/contributions — post contribution to own account"
      - "POST /able/accounts/{id}/distributions — request distribution from own account"
      - "POST /able/distributions/{id}/approve — approve own distribution"
      - "POST /able/distributions/{id}/disburse — disburse own distribution"
      - "POST /able/distributions/{id}/substantiate — substantiate own distribution"
      - "POST /able/distributions/{id}/qde-records — attach QDE record"
      - "POST /able/accounts/{id}/investment-changes — change own investment option"
      - "POST /able/accounts/{id}/authorized-representatives — add own representative"
      - "POST /able/authorized-representatives/{id}/revoke — revoke own representative"
      - "GET endpoints — reads"

  - name: AuthorizedRepresentative
    description: "Person with signature authority managing the account on the beneficiary's behalf"
    identity: "entity_backed:AuthorizedRepresentative"
    exclusive_operations: []
    shared_operations:
      - "POST /able/accounts/{id}/contributions — post contribution to managed account"
      - "POST /able/accounts/{id}/distributions — request distribution"
      - "POST /able/distributions/{id}/approve — approve distribution"
      - "POST /able/distributions/{id}/disburse — disburse distribution"
      - "POST /able/distributions/{id}/substantiate — substantiate distribution"
      - "POST /able/distributions/{id}/qde-records — attach QDE record"
      - "POST /able/accounts/{id}/investment-changes — change investment option"
      - "GET endpoints — reads"

  - name: MedicaidAgency
    description: "State Medicaid agency filing a payback claim against a deceased beneficiary's account"
    identity: opaque
    exclusive_operations:
      - "POST /able/accounts/{id}/medicaid-claims — file Medicaid payback claim"
    shared_operations:
      - "GET /able/medicaid-claims — read Medicaid claims"
