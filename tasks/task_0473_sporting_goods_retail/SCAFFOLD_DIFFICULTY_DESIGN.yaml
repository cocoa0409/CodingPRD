              captures: { inv_id: $.data.id, inv_v: $.data.version }
            - call: "POST /store-inventory/${inv_id}/receive"
              payload: { quantity: 4, expected_store_inventory_version: "${inv_v}" }
              as: PlatformAdmin
            - call: "POST /service-tickets"
              payload: { customer_id: "${cust_id}", store_id: "${store_id}", service_type: "RACKET_STRING", part_sku_id: "${part_sku}" }
              as: ServiceTech
              captures: { tkt_id: $.data.id }
            - call: "POST /service-tickets/${tkt_id}/start"
              payload: {}
              as: ServiceTech
          trigger:
            - call: "POST /service-tickets/${tkt_id}/cancel"
              payload: {}
              as: ServiceTech
          assert:
            - "StoreInventory.${inv_id}.on_hand_qty == 4 (conserved)"
            - "StoreInventory.${inv_id}.reserved_qty == 0"
            - "StoreInventory.${inv_id}.available_qty == 4"
            - "ServiceTicket.${tkt_id}.status == CANCELLED"
