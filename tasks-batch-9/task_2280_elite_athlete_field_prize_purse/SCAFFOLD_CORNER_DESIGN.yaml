        distinguishing_aspect: >-
          The selector always returns the LOWEST free bib of the division pool, so after three
          athletes take 11, 12 and 13 and the holder of 12 withdraws, the fourth assignment must
          return 12 rather than 14.
        test_recipe:
          setup:
            - "One FIELD_OPEN edition with an ELITE MALE bib pool of 11..20."
            - "Four ACCEPTED invitations for four athletes, all with whereabouts_filed true; three are bibbed in creation order."
