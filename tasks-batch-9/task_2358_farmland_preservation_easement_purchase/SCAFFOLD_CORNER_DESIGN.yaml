            - "trigger call 2 returns HTTP 200 and Application.${app_a_id}.status == ACCEPTED with funding_plan_status == OBLIGATED"
            - "trigger call 3 shows FundingSource.${src_local_id}.committed_cents == 56127723 and available_cents == 3872277 and status == ACTIVE, because 56,127,723 < floor(60,000,000 * 0.95) == 57,000,000"
            - "trigger call 4 returns HTTP 409 with error code ERR_SOURCE_WINDOW_CAPACITY_EXCEEDED because obligating PT's 8,925,000 LOCAL reservation would make the source's OBLIGATED total 65,052,723 > authorized_cents 60,000,000"
            - "trigger call 5 shows Application.${app_pt_id}.status == OFFER_ISSUED and funding_plan_status == FUNDED and closing_status == NOT_APPLICABLE"
