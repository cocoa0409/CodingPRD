          - errors.ERR_FORBIDDEN_ROLE
        distinguishing_aspect: "Paying statements is exclusive to SettlementOfficer; the grower who owns the statement cannot mark it paid — 403 ERR_FORBIDDEN_ROLE even after the dispute deadline."
        test_recipe:
