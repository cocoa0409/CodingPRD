            - { call: "POST /aog/quotes/${q1}/issue", payload: {}, as: AogDeskAgent, captures: { q_v2: $.data.version } }
            - { call: "POST /aog/quotes/${q1}/reject", payload: {}, as: CustomerContact, as_user_id: "${cust_id}", captures: { q_v3: $.data.version } }
            - { call: "POST /aog/quotes/${q1}/revise", payload: { expected_quote_version: "${q_v3}", validity_hours: 24 }, as: AogDeskAgent }
            - { call: "POST /aog/quotes/${q1}/issue", payload: {}, as: AogDeskAgent, captures: { q_v5: $.data.version } }
          trigger:
            - { call: "POST /aog/quotes/${q1}/accept", payload: { expected_quote_version: "${q_v2}" }, as: CustomerContact, as_user_id: "${cust_id}", captures: { err: $.data.error_id } }
            - { call: "POST /aog/quotes/${q1}/accept", payload: { expected_quote_version: "${q_v5}" }, as: CustomerContact, as_user_id: "${cust_id}", captures: { st: $.data.status } }
          assert:
            - "stale accept (version 2 vs current 5): error_id == ERR_STALE_QUOTE_VERSION, HTTP 412"
            - "fresh accept (version 5): succeeds, status ACCEPTED, order created"

      - name: occ_customer_adjust_stale_version
        claim_type: optimistic_concurrency
        grounds: ["concurrency_rules[customer-adjust-stale-version]", "errors[ERR_STALE_CUSTOMER_VERSION]"]
        distinguishing_aspect: "OCC on the Customer version: two strictly sequential adjustments, both carrying the version observed before the first posted, succeed once and then fail 412 — the second caller's balance view was invalidated by the first posting."
        test_recipe:
          setup: ["customer created (version 1)"]
          setup_api_calls:
            - { call: "POST /aog/customers", payload: { name: "OccCust", country_code: "US", credit_limit_cents: 100000000 }, as: FinanceController, captures: { cust_id: $.data.id, c_v1: $.data.version } }
          trigger:
            - { call: "POST /aog/customers/${cust_id}/credit-adjustments", payload: { entry_type: "MANUAL_DEBIT", amount_cents: 1000, expected_customer_version: "${c_v1}", memo: "first" }, as: FinanceController, captures: { e1: $.data.id } }
            - { call: "POST /aog/customers/${cust_id}/credit-adjustments", payload: { entry_type: "MANUAL_DEBIT", amount_cents: 1000, expected_customer_version: "${c_v1}", memo: "second (stale)" }, as: FinanceController, captures: { err: $.data.error_id } }
            - { call: "GET /aog/customers/${cust_id}", payload: {}, as: FinanceController, captures: { bal: $.data.outstanding_balance_cents, ver: $.data.version } }
          assert:
            - "first adjustment posts (201)"
            - "second adjustment with the same expected version: error_id == ERR_STALE_CUSTOMER_VERSION, HTTP 412"
            - "outstanding_balance_cents == 1000 (exactly one posting), version == 2"

      - name: lease_period_boundary_inclusive
        claim_type: rate_threshold
        grounds: [calculations.loan_settlement, "entities.LoanAgreement.fields.billed_cents"]
        distinguishing_aspect: "Lease period debits fire when clock >= start_at + k*30d — at exactly the 30-day boundary the debit IS posted (inclusive >=), doubling billed_cents from 750000 to 1500000."
        test_recipe:
          setup: ["LEASE lease_periods 2, rate 25000, [2026-05-01, 2026-06-30); first period debited at creation; clock set to exactly 2026-05-31T00:00:00Z"]
          setup_api_calls:
            - { call: "POST /aog/customers", payload: { name: "BoundLease", country_code: "US", credit_limit_cents: 100000000 }, as: FinanceController, captures: { cust_id: $.data.id } }
            - { call: "POST /aog/parts", payload: { part_number: "PN-LB", description: "x", rotable: true, list_price_cents: 900000, core_value_cents: 200000 }, as: WarehouseOperator, captures: { p1: $.data.id } }
            - { call: "POST /aog/inventory-units", payload: { part_id: "${p1}", serial_number: "SN-LB1", condition: "OVERHAULED", trace_doc_level: "FAA_8130", warehouse_code: "WH-1" }, as: WarehouseOperator, captures: { u1: $.data.id } }
            - { call: "POST /aog/loans", payload: { customer_id: "${cust_id}", unit_id: "${u1}", loan_type: "LEASE", daily_rate_cents: 25000, lease_periods: 2, start_at: "2026-05-01T00:00:00Z", due_at: "2026-06-30T00:00:00Z" }, as: AogDeskAgent, captures: { ln: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-05-31T00:00:00Z" }, as: PlatformOps }
          trigger:
            - { call: "POST /_system/run-sweeps", payload: {}, as: PlatformOps, captures: { n_lease: $.data.lease_debits_posted } }
            - { call: "GET /aog/customers/${cust_id}", payload: {}, as: FinanceController, captures: { bal: $.data.outstanding_balance_cents } }
          assert:
            - "lease_debits_posted == 1 (the boundary instant is included)"
            - "outstanding_balance_cents == 1500000 (750000 at creation + 750000 at the 2026-05-31T00:00:00Z boundary)"
            - "LoanAgreement.${ln}.status remains ACTIVE (due 2026-06-30 not reached)"

      - name: cascading_side_effects_layer
        claim_type: cascading_side_effects
        grounds: [complexity_profile.complexity_layers]
        excluded_because:
          difficulty_instance: transitive_cascade / delivery_cascade_invoice_to_balance
          rationale: "N-level cascade verified end-to-end by the named §1.8 instance (deliver -> order -> ledger -> balance) plus lease_sweep_suspension_cascade."

      - name: dual_variant_calculation_layer
        claim_type: dual_variant_calculation
        grounds: [complexity_profile.complexity_layers]
        excluded_because:
          difficulty_instance: dual_variant_calc / core_penalty_provisional_vs_final
          rationale: "Both variants exercised with delta asserted; sibling instance loan_vs_lease_settlement_divergence covers the second domain."

  - section: consistency_model
    instances:
      - name: immediate_visibility_after_mutation
        claim_type: immediate_consistency
        grounds: [complexity_profile.consistency_model, calculations.outstanding_balance_recompute]
        distinguishing_aspect: "Immediate consistency: a unit create is visible in the parent's available_count on the very next read, and a posted ledger adjustment is visible in outstanding_balance_cents without any sweep or delay."
        test_recipe:
          setup: ["part PN-IM with zero units; customer with one MANUAL_DEBIT posted"]
          setup_api_calls:
            - { call: "POST /aog/parts", payload: { part_number: "PN-IM", description: "x", rotable: false, list_price_cents: 1000 }, as: WarehouseOperator, captures: { p1: $.data.id, ac0: $.data.available_count } }
            - { call: "POST /aog/customers", payload: { name: "ImmAir", country_code: "US", credit_limit_cents: 100000000 }, as: FinanceController, captures: { cust_id: $.data.id, cv: $.data.version } }
          trigger:
            - { call: "POST /aog/inventory-units", payload: { part_id: "${p1}", serial_number: "SN-IM1", condition: "NEW", trace_doc_level: "FAA_8130", warehouse_code: "WH-1" }, as: WarehouseOperator }
            - { call: "GET /aog/parts/${p1}", payload: {}, as: WarehouseOperator, captures: { ac1: $.data.available_count } }
            - { call: "POST /aog/customers/${cust_id}/credit-adjustments", payload: { entry_type: "MANUAL_DEBIT", amount_cents: 777, expected_customer_version: "${cv}", memo: "now" }, as: FinanceController }
            - { call: "GET /aog/customers/${cust_id}", payload: {}, as: FinanceController, captures: { bal: $.data.outstanding_balance_cents } }
          assert:
            - "PartMaster.available_count goes 0 -> 1 on the immediate read after create"
            - "Customer.outstanding_balance_cents == 777 on the immediate read after the adjustment"

      - name: order_get_not_found
        claim_type: not_found
        grounds: ["errors[ERR_ORDER_NOT_FOUND]", entities.SalesOrder]
        distinguishing_aspect: "The same typed-404 contract applies to cascade-created entities: a random order id yields ERR_ORDER_NOT_FOUND even though orders are never created directly."
        test_recipe:
          setup: ["empty DB"]
          setup_api_calls: []
          trigger:
            - { call: "GET /aog/orders/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2", payload: {}, as: AogDeskAgent, captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_ORDER_NOT_FOUND, HTTP 404"
