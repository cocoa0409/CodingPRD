            - call: "POST /ria/standing-instructions/${si_id}/verify"
              payload: { verification_token: "${si_tok}" }
              as: Client
              as_user_id: "${h_id}"
          trigger:
            - call: "POST /ria/money-movements"
              payload: { account_id: "${acct_id}", standing_instruction_id: "${si_id}", amount_cents: 200000, movement_type: "ACH_DISBURSEMENT", authorization_note: "Client confirmed 2026-09-01 tranche one" }
              as: AdvisorOperationsLead
              captures: { mm1_id: $.data.id }
            - call: "POST /ria/money-movements/${mm1_id}/submit"
              payload: {}
              as: AdvisorOperationsLead
            - call: "POST /ria/money-movements/${mm1_id}/authorize"
              payload: {}
              as: Client
              as_user_id: "${h_id}"
            - call: "POST /ria/money-movements"
              payload: { account_id: "${acct_id}", standing_instruction_id: "${si_id}", amount_cents: 200000, movement_type: "ACH_DISBURSEMENT", authorization_note: "Client confirmed 2026-09-01 tranche two" }
              as: AdvisorOperationsLead
              captures: { mm2_id: $.data.id }
            - call: "POST /ria/money-movements/${mm2_id}/submit"
              payload: {}
              as: AdvisorOperationsLead
            - call: "POST /ria/money-movements/${mm2_id}/authorize"
              payload: {}
              as: Client
              as_user_id: "${h_id}"
            - call: "POST /ria/money-movements"
              payload: { account_id: "${acct_id}", standing_instruction_id: "${si_id}", amount_cents: 100001, movement_type: "ACH_DISBURSEMENT", authorization_note: "Client confirmed 2026-09-01 tranche three" }
              as: AdvisorOperationsLead
              captures: { mm3_id: $.data.id }
            - call: "POST /ria/money-movements/${mm3_id}/submit"
              payload: {}
              as: AdvisorOperationsLead
            - call: "POST /ria/money-movements/${mm3_id}/authorize"
              payload: {}
              as: Client
              as_user_id: "${h_id}"
              captures: { err_limit: $.data.error_id }
          assert:
            - "StandingInstruction.${si_id}.consumed_period_cents == 400000 after the two accepted tranches"
            - "the third authorization is rejected with error_id ERR_STANDING_LIMIT_EXCEEDED and HTTP status 409"
            - "StandingInstruction.${si_id}.consumed_period_cents stays 400000 after the rejection"
            - "MoneyMovementInstruction.${mm3_id}.movement_status is still PENDING_AUTHORIZATION"
            - "a 100000-cent fourth movement would still fit the remaining 100000-cent capacity, so the boundary is the SUM and not the largest single interval"

      - name: account_listing_slot_cooldown_gap_semantics
        grounds:
          - validations[priority=43]
          - state_machines.HouseholdAccount.OPEN_to_OPEN
          - entities.HouseholdAccount.fields.last_listed_at
          - errors[ERR_LISTING_COOLDOWN]
        distinguishing_aspect: "Half-open adjacency semantics on the HouseholdAccount listing-slot resource rather than the StandingInstruction capacity resource: a second listing exactly one hour after the first is OUTSIDE the cooldown (the interval is [prev, prev + 1 hour) ) and is admitted, while a listing one second short of the boundary is rejected."
        test_recipe:
          setup:
            - "Logical clock at 2026-09-01T00:00:00Z. Firm with EXECUTED agreement and GRANTED TRADING_AUTHORIZATION entitlement, firm_posture OPEN."
            - "One household with one OPEN account RIA-108001 holding a single listed lot."
          setup_api_calls:
