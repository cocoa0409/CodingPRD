scaffold_corner_design:
  - section: entities
    instances:
      - name: incident_create_defaults_and_server_minted_system_fields
        claim_type: Creation
        grounds:
          - entities.Incident.fields.currency_code
          - entities.Incident.fields.status
          - entities.Incident.common_fields
        distinguishing_aspect: "POST /field-ops/incidents with only the seven required fields yields status MONITORING, currency_code USD, version 1 and a bare UUID id with no type prefix."
        test_recipe:
          setup: ["empty database, logical clock at its default 2026-09-01T00:00:00Z"]
          setup_api_calls: []
          trigger:
            - call: "POST /field-ops/incidents"
              payload: { name: "Central Valley Floods", country_code: "US", disaster_type: "FLOOD", severity_level: 4, target_daily_meals: 12000, funding_ceiling_cents: 5000000 }
              as: PlatformAdmin
              captures: { inc_id: "$.data.id", inc_status: "$.data.status", inc_currency: "$.data.currency_code", inc_version: "$.data.version" }
          assert:
            - "${inc_status} == \"MONITORING\""
            - "${inc_currency} == \"USD\""
            - "${inc_version} == 1"
            - "Incident.${inc_id}.activated_at == null and Incident.${inc_id}.wind_down_started_at == null and Incident.${inc_id}.closed_at == null"
            - "Incident.${inc_id}.spent_cents == 0 and Incident.${inc_id}.committed_cents == 0 and Incident.${inc_id}.delivered_meal_total == 0"

      - name: distribution_site_create_missing_required_site_name_returns_400
        claim_type: Required Fields
        grounds:
          - endpoints.POST /field-ops/distribution-sites
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "A create that omits the required site_name field is rejected with ERR_INVALID_REQUEST before any existence, state or business rule runs."
        test_recipe:
          setup: ["an incident exists"]
          setup_api_calls:
            - call: "POST /field-ops/incidents"
              payload: { name: "Central Valley Floods", country_code: "US", disaster_type: "FLOOD", severity_level: 4, target_daily_meals: 12000, funding_ceiling_cents: 5000000 }
              as: PlatformAdmin
              captures: { inc_id: "$.data.id" }
          trigger:
            - call: "POST /field-ops/distribution-sites"
              payload: { incident_id: "${inc_id}", site_type: "SHELTER", population_served: 300, daily_meal_request: 600, access_constraint: "OPEN" }
              as: LogisticsCoordinator
              captures: { err_missing: "$.data.error_id" }
          assert:
            - "${err_missing} == \"ERR_INVALID_REQUEST\""

      - name: meal_order_get_not_found_returns_404
        claim_type: Not Found
        grounds:
          - endpoints.GET /field-ops/meal-orders/{id}
          - errors[ERR_MEAL_ORDER_NOT_FOUND]
        distinguishing_aspect: "A GET on a syntactically valid but unknown meal-order id returns ERR_MEAL_ORDER_NOT_FOUND with HTTP 404 rather than an empty object."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "GET /field-ops/meal-orders/8a3e1c0b-2f4d-4a91-9c8b-12e7b6a0f1d2"
              as: ProductionPlanner
              captures: { err_nf: "$.data.error_id" }
          assert:
            - "${err_nf} == \"ERR_MEAL_ORDER_NOT_FOUND\""

      - name: incident_create_invalid_enum_returns_400
        claim_type: Type Constraints
        grounds:
          - entities.Incident.fields.disaster_type
          - errors[ERR_INVALID_REQUEST]
        distinguishing_aspect: "disaster_type is closed over six enum members, so TSUNAMI is rejected with ERR_INVALID_REQUEST while WILDFIRE is accepted."
        test_recipe:
          setup: ["empty database"]
          setup_api_calls: []
          trigger:
            - call: "POST /field-ops/incidents"
              payload: { name: "Bay Wildfire", country_code: "US", disaster_type: "TSUNAMI", severity_level: 4, target_daily_meals: 12000, funding_ceiling_cents: 5000000 }
              as: PlatformAdmin
              captures: { err_enum: "$.data.error_id" }
            - call: "POST /field-ops/incidents"
              payload: { name: "Bay Wildfire", country_code: "US", disaster_type: "WILDFIRE", severity_level: 4, target_daily_meals: 12000, funding_ceiling_cents: 5000000 }
              as: PlatformAdmin
              captures: { inc_ok: "$.data.id" }
          assert:
            - "${err_enum} == \"ERR_INVALID_REQUEST\""
            - "Incident.${inc_ok}.disaster_type == \"WILDFIRE\""

      - name: incident_listing_pagination_envelope_and_has_more
        claim_type: Listing
        grounds:
          - endpoints.GET /field-ops/incidents
          - response_envelope.pagination_fields
        distinguishing_aspect: "The list endpoint honours limit and offset and always returns limit, offset, total_count and has_more in the envelope, so limit=1 over two incidents reports has_more true."
        test_recipe:
          setup: ["two incidents exist"]
          setup_api_calls:
            - call: "POST /field-ops/incidents"
              payload: { name: "Central Valley Floods", country_code: "US", disaster_type: "FLOOD", severity_level: 4, target_daily_meals: 12000, funding_ceiling_cents: 5000000 }
              as: PlatformAdmin
              captures: { inc_a: "$.data.id" }
            - call: "POST /field-ops/incidents"
              payload: { name: "Bay Wildfire", country_code: "US", disaster_type: "WILDFIRE", severity_level: 3, target_daily_meals: 6000, funding_ceiling_cents: 2000000 }
              as: PlatformAdmin
              captures: { inc_b: "$.data.id" }
          trigger:
            - call: "GET /field-ops/incidents?limit=1&offset=0"
              as: PlatformAdmin
              captures: { total: "$.meta.total_count", has_more: "$.meta.has_more", first_id: "$.data[0].id" }
          assert:
            - "${total} == 2"
            - "${has_more} == true"
            - "${first_id} != null"

      - name: field_kitchen_computed_food_safety_score_input_ignored
        claim_type: Computed Fields
        grounds:
          - entities.FieldKitchen.fields.food_safety_score
          - calculations.field_kitchen_food_safety_score
        distinguishing_aspect: "food_safety_score is not an accepted create input: supplying it is rejected as an undeclared field, and the stored value is the one derived from power_source, water_source, refrigeration_hours_available and daily_capacity_meals."
        test_recipe:
          setup: ["an incident is ACTIVE and an assessment is SUBMITTED"]
          setup_api_calls:
            - call: "POST /field-ops/incidents"
              payload: { name: "Central Valley Floods", country_code: "US", disaster_type: "FLOOD", severity_level: 4, target_daily_meals: 12000, funding_ceiling_cents: 5000000 }
              as: PlatformAdmin
              captures: { inc_id: "$.data.id" }
            - call: "POST /field-ops/assessments"
              payload: { incident_id: "${inc_id}", assessed_at: "2026-09-01T06:00:00Z", population_affected: 40000, estimated_daily_meal_need: 9000, access_constraint: "LIMITED", water_available: false, power_available: true, partner_kitchens_identified: 2 }
              as: FieldCoordinator
              captures: { asmt_id: "$.data.id" }
            - call: "POST /field-ops/incidents/${inc_id}/transitions"
              payload: { to_state: "ACTIVE" }
              as: FieldCoordinator
          trigger:
            - call: "POST /field-ops/field-kitchens"
              payload: { incident_id: "${inc_id}", assessment_id: "${asmt_id}", site_name: "Riverside Depot", latitude: 36.75, longitude: -119.77, power_source: "GENERATOR", water_source: "TRUCKED", refrigeration_hours_available: 12, daily_capacity_meals: 500, food_safety_score: 100 }
              as: FieldCoordinator
              captures: { err_extra: "$.data.error_id" }
            - call: "POST /field-ops/field-kitchens"
              payload: { incident_id: "${inc_id}", assessment_id: "${asmt_id}", site_name: "Riverside Depot", latitude: 36.75, longitude: -119.77, power_source: "GENERATOR", water_source: "TRUCKED", refrigeration_hours_available: 12, daily_capacity_meals: 500 }
              as: FieldCoordinator
              captures: { fk_id: "$.data.id", fk_score: "$.data.food_safety_score" }
          assert:
            - "${err_extra} == \"ERR_INVALID_REQUEST\""
            - "${fk_score} == 80"
            - "FieldKitchen.${fk_id}.site_status == \"SITED\""

  - section: state_machines
    instances:
      - name: incident_winding_down_reverts_to_active_on_later_assessment
        claim_type: Valid Transition
        grounds:
          - state_machines.Incident.WINDING_DOWN_to_ACTIVE
          - state_machines.Incident.ACTIVE_to_WINDING_DOWN
          - entities.Incident.fields.wind_down_started_at
        distinguishing_aspect: "The Incident machine is cyclic rather than linear: WINDING_DOWN returns to ACTIVE only when an Assessment is submitted with assessed_at strictly after wind_down_started_at, and the WINDING_DOWN transition demobilises kitchens still in SITED or UTILITIES_PENDING."
        test_recipe:
          setup: ["an incident is ACTIVE with one SUBMITTED assessment and one FieldKitchen still in SITED"]
          setup_api_calls:
            - call: "POST /field-ops/incidents"
              payload: { name: "Central Valley Floods", country_code: "US", disaster_type: "FLOOD", severity_level: 4, target_daily_meals: 12000, funding_ceiling_cents: 5000000 }
              as: PlatformAdmin
              captures: { inc_id: "$.data.id" }
            - call: "POST /field-ops/assessments"
              payload: { incident_id: "${inc_id}", assessed_at: "2026-09-01T06:00:00Z", population_affected: 40000, estimated_daily_meal_need: 9000, access_constraint: "LIMITED", water_available: false, power_available: true, partner_kitchens_identified: 2 }
              as: FieldCoordinator
              captures: { asmt_id: "$.data.id" }
            - call: "POST /field-ops/incidents/${inc_id}/transitions"
              payload: { to_state: "ACTIVE" }
              as: FieldCoordinator
            - call: "POST /field-ops/field-kitchens"
              payload: { incident_id: "${inc_id}", assessment_id: "${asmt_id}", site_name: "Riverside Depot", latitude: 36.75, longitude: -119.77, power_source: "GENERATOR", water_source: "TRUCKED", refrigeration_hours_available: 12, daily_capacity_meals: 500 }
              as: FieldCoordinator
              captures: { fk_id: "$.data.id" }
          trigger:
            - call: "POST /field-ops/incidents/${inc_id}/transitions"
              payload: { to_state: "WINDING_DOWN" }
              as: PlatformAdmin
              captures: { status_winding: "$.data.status", fk_after_winding: "$.data.wind_down_started_at" }
            - call: "POST /field-ops/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-03T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /field-ops/assessments"
              payload: { incident_id: "${inc_id}", assessed_at: "2026-09-03T00:00:00Z", population_affected: 45000, estimated_daily_meal_need: 11000, access_constraint: "RESTRICTED", water_available: false, power_available: false, partner_kitchens_identified: 1 }
              as: FieldCoordinator
              captures: { asmt2_id: "$.data.id" }
            - call: "POST /field-ops/incidents/${inc_id}/transitions"
              payload: { to_state: "ACTIVE" }
              as: PlatformAdmin
          assert:
            - "${status_winding} == \"WINDING_DOWN\""
            - "FieldKitchen.${fk_id}.site_status == \"DEMOBILIZED\""
            - "Incident.${inc_id}.status == \"ACTIVE\""
            - "Incident.${inc_id}.wind_down_started_at == null"

      - name: meal_order_terminal_lockdown_rejects_further_transitions
        claim_type: Terminal State Lockdown
        grounds:
          - state_machines.MealOrder.QUALITY_HOLD_to_REJECTED
          - errors[ERR_ENTITY_TERMINAL]
          - entities.MealOrder.terminal_states
        distinguishing_aspect: "Once a MealOrder reaches REJECTED no outgoing transition exists, so a subsequent READY request is refused with ERR_ENTITY_TERMINAL rather than ERR_INVALID_STATE."
        test_recipe:
          setup: ["a REJECTED MealOrder exists for a CONTRACTED / PRODUCING partner kitchen"]
          setup_api_calls:
            - call: "POST /field-ops/incidents"
              payload: { name: "Central Valley Floods", country_code: "US", disaster_type: "FLOOD", severity_level: 4, target_daily_meals: 12000, funding_ceiling_cents: 5000000 }
              as: PlatformAdmin
              captures: { inc_id: "$.data.id" }
            - call: "POST /field-ops/assessments"
              payload: { incident_id: "${inc_id}", assessed_at: "2026-09-01T06:00:00Z", population_affected: 40000, estimated_daily_meal_need: 9000, access_constraint: "LIMITED", water_available: false, power_available: true, partner_kitchens_identified: 2 }
              as: FieldCoordinator
              captures: { asmt_id: "$.data.id" }
            - call: "POST /field-ops/incidents/${inc_id}/transitions"
              payload: { to_state: "ACTIVE" }
              as: FieldCoordinator
            - call: "POST /field-ops/partner-kitchens"
              payload: { incident_id: "${inc_id}", business_name: "Casa Rosa", owner_name: "Rosa Delgado", cuisine_tags: ["LOCAL"], daily_capacity_meals: 1200, per_meal_price_cents: 1500, bank_verified: true }
              as: PartnershipLead
              captures: { pk_id: "$.data.id" }
            - call: "POST /field-ops/partner-kitchens/${pk_id}/transitions"
              payload: { dimension: "CONTRACT", to_state: "VETTING" }
              as: PartnershipLead
            - call: "POST /field-ops/partner-kitchens/${pk_id}/transitions"
              payload: { dimension: "CONTRACT", to_state: "CONTRACTED", vetting_score: 72 }
              as: PartnershipLead
            - call: "POST /field-ops/partner-kitchens/${pk_id}/transitions"
              payload: { dimension: "PRODUCTION", to_state: "PRODUCING" }
              as: KitchenOperator
              as_user_id: "${pk_id}"
            - call: "GET /field-ops/partner-kitchens/${pk_id}"
              as: ProductionPlanner
              captures: { pk_v: "$.data.version" }
            - call: "POST /field-ops/meal-orders"
              payload: { incident_id: "${inc_id}", partner_kitchen_id: "${pk_id}", menu_name: "Arroz con Pollo", dietary_tags: ["VEGETARIAN"], ordered_meals: 500, scheduled_start: "2026-09-01T08:00:00Z", production_hours: 4, expected_partner_kitchen_version: "${pk_v}" }
              as: ProductionPlanner
              captures: { mo_id: "$.data.id" }
            - call: "POST /field-ops/meal-orders/${mo_id}/transitions"
              payload: { to_state: "IN_PRODUCTION" }
              as: ProductionPlanner
            - call: "POST /field-ops/meal-orders/${mo_id}/transitions"
              payload: { to_state: "QUALITY_HOLD", produced_meals: 500 }
              as: KitchenOperator
              as_user_id: "${pk_id}"
            - call: "POST /field-ops/meal-orders/${mo_id}/transitions"
              payload: { to_state: "REJECTED", quality_check_score: 40 }
              as: FoodSafetyOfficer
          trigger:
            - call: "POST /field-ops/meal-orders/${mo_id}/transitions"
              payload: { to_state: "READY", quality_check_score: 95 }
              as: FoodSafetyOfficer
              captures: { err_terminal: "$.data.error_id" }
          assert:
            - "${err_terminal} == \"ERR_ENTITY_TERMINAL\""
            - "MealOrder.${mo_id}.status == \"REJECTED\""

      - name: meal_order_invalid_transition_from_placed_to_delivered
        claim_type: Invalid Transitions
        grounds:
          - state_machines.MealOrder.transitions
          - errors[ERR_INVALID_STATE]
        distinguishing_aspect: "PLACED has exactly one non-cancel outgoing edge, so a direct PLACED -> DELIVERED request is refused with ERR_INVALID_STATE and the row is left in PLACED."
        test_recipe:
          setup: ["a PLACED MealOrder exists"]
          setup_api_calls:
            - call: "POST /field-ops/incidents"
              payload: { name: "Central Valley Floods", country_code: "US", disaster_type: "FLOOD", severity_level: 4, target_daily_meals: 12000, funding_ceiling_cents: 5000000 }
              as: PlatformAdmin
              captures: { inc_id: "$.data.id" }
            - call: "POST /field-ops/assessments"
              payload: { incident_id: "${inc_id}", assessed_at: "2026-09-01T06:00:00Z", population_affected: 40000, estimated_daily_meal_need: 9000, access_constraint: "LIMITED", water_available: false, power_available: true, partner_kitchens_identified: 2 }
              as: FieldCoordinator
              captures: { asmt_id: "$.data.id" }
            - call: "POST /field-ops/incidents/${inc_id}/transitions"
              payload: { to_state: "ACTIVE" }
              as: FieldCoordinator
            - call: "POST /field-ops/partner-kitchens"
              payload: { incident_id: "${inc_id}", business_name: "Casa Rosa", owner_name: "Rosa Delgado", cuisine_tags: ["LOCAL"], daily_capacity_meals: 1200, per_meal_price_cents: 1500, bank_verified: true }
              as: PartnershipLead
              captures: { pk_id: "$.data.id" }
            - call: "POST /field-ops/partner-kitchens/${pk_id}/transitions"
              payload: { dimension: "CONTRACT", to_state: "VETTING" }
              as: PartnershipLead
            - call: "POST /field-ops/partner-kitchens/${pk_id}/transitions"
              payload: { dimension: "CONTRACT", to_state: "CONTRACTED", vetting_score: 72 }
              as: PartnershipLead
            - call: "GET /field-ops/partner-kitchens/${pk_id}"
              as: ProductionPlanner
              captures: { pk_v: "$.data.version" }
            - call: "POST /field-ops/meal-orders"
              payload: { incident_id: "${inc_id}", partner_kitchen_id: "${pk_id}", menu_name: "Arroz con Pollo", dietary_tags: ["VEGETARIAN"], ordered_meals: 500, scheduled_start: "2026-09-01T08:00:00Z", production_hours: 4, expected_partner_kitchen_version: "${pk_v}" }
              as: ProductionPlanner
              captures: { mo_id: "$.data.id" }
          trigger:
            - call: "POST /field-ops/meal-orders/${mo_id}/transitions"
              payload: { to_state: "DELIVERED" }
              as: LogisticsCoordinator
              captures: { err_state: "$.data.error_id" }
          assert:
            - "${err_state} == \"ERR_INVALID_STATE\""
            - "MealOrder.${mo_id}.status == \"PLACED\""
            - "MealOrder.${mo_id}.final_cost_cents == 0"

      - name: ingredient_purchase_confirm_requires_approved_supplier
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.IngredientPurchase.REQUESTED_to_CONFIRMED
          - state_machines.Supplier.PROSPECT_to_APPROVED
          - errors[ERR_SUPPLIER_NOT_APPROVED]
        distinguishing_aspect: "REQUESTED -> CONFIRMED succeeds while the producer is still PROSPECT — the first order is the trial that promotes it — whereas the same call on a SUSPENDED producer is refused with ERR_SUPPLIER_NOT_APPROVED. A producer is driven to SUSPENDED without ever delivering by abandoning one order, which lifts disputed_purchase_count to 1 and drops reliability_score to 25, below the floor of 40."
        test_recipe:
          setup: ["a supplier has one purchase abandoned from REQUESTED to CANCELLED, putting it in SUSPENDED standing with reliability_score 25, and a second REQUESTED purchase"]
          setup_api_calls:
            - call: "POST /field-ops/incidents"
              payload: { name: "Central Valley Floods", country_code: "US", disaster_type: "FLOOD", severity_level: 4, target_daily_meals: 12000, funding_ceiling_cents: 5000000 }
              as: PlatformAdmin
              captures: { inc_id: "$.data.id" }
            - call: "POST /field-ops/assessments"
              payload: { incident_id: "${inc_id}", assessed_at: "2026-09-01T06:00:00Z", population_affected: 40000, estimated_daily_meal_need: 9000, access_constraint: "LIMITED", water_available: false, power_available: true, partner_kitchens_identified: 2 }
              as: FieldCoordinator
              captures: { asmt_id: "$.data.id" }
            - call: "POST /field-ops/incidents/${inc_id}/transitions"
              payload: { to_state: "ACTIVE" }
              as: FieldCoordinator
            - call: "POST /field-ops/partner-kitchens"
              payload: { incident_id: "${inc_id}", business_name: "Casa Rosa", owner_name: "Rosa Delgado", cuisine_tags: ["LOCAL"], daily_capacity_meals: 1200, per_meal_price_cents: 1500, bank_verified: true }
              as: PartnershipLead
              captures: { pk_id: "$.data.id" }
            - call: "POST /field-ops/suppliers"
              payload: { incident_id: "${inc_id}", producer_name: "Valle Verde Cooperative", locality: "San Joaquin", product_categories: ["PRODUCE"] }
              as: SourcingOfficer
              captures: { sup_id: "$.data.id" }
            - call: "POST /field-ops/ingredient-purchases"
              payload: { incident_id: "${inc_id}", supplier_id: "${sup_id}", partner_kitchen_id: "${pk_id}", item_description: "maize flour", quantity_kg: 1000, unit_price_cents_per_kg: 300 }
              as: SourcingOfficer
              captures: { p1: "$.data.id" }
            - call: "POST /field-ops/ingredient-purchases"
              payload: { incident_id: "${inc_id}", supplier_id: "${sup_id}", partner_kitchen_id: "${pk_id}", item_description: "black beans", quantity_kg: 500, unit_price_cents_per_kg: 500 }
              as: SourcingOfficer
              captures: { p2: "$.data.id" }
          trigger:
            - call: "POST /field-ops/ingredient-purchases/${p1}/transitions"
              payload: { to_state: "CANCELLED" }
              as: SourcingOfficer
            - call: "POST /field-ops/ingredient-purchases/${p2}/transitions"
              payload: { to_state: "CONFIRMED" }
              as: SourcingOfficer
              captures: { err_suspended: "$.data.error_id" }
          assert:
            - "${err_suspended} == \"ERR_SUPPLIER_NOT_APPROVED\""
            - "Supplier.${sup_id}.status == \"SUSPENDED\""
            - "Supplier.${sup_id}.reliability_score == 25"
            - "IngredientPurchase.${p2}.status == \"REQUESTED\""

      - name: distribution_site_side_effect_on_first_delivered_stop
        claim_type: Side Effect Execution
        grounds:
          - state_machines.DistributionSite.REGISTERED_to_ACTIVE
          - state_machines.DistributionStop.PENDING_to_DELIVERED
          - entities.DistributionSite.fields.received_meals_total
        distinguishing_aspect: "Confirming the first stop for a REGISTERED site performs two side effects in one request: the site moves REGISTERED -> ACTIVE and received_meals_total rises by exactly the delivered meal count."
        test_recipe:
          setup: ["a DELIVERING run has one PENDING stop of 30 planned meals at a REGISTERED site"]
          setup_api_calls:
            - call: "POST /field-ops/incidents"
              payload: { name: "Central Valley Floods", country_code: "US", disaster_type: "FLOOD", severity_level: 4, target_daily_meals: 12000, funding_ceiling_cents: 5000000 }
              as: PlatformAdmin
              captures: { inc_id: "$.data.id" }
            - call: "POST /field-ops/assessments"
              payload: { incident_id: "${inc_id}", assessed_at: "2026-09-01T06:00:00Z", population_affected: 40000, estimated_daily_meal_need: 9000, access_constraint: "LIMITED", water_available: false, power_available: true, partner_kitchens_identified: 2 }
              as: FieldCoordinator
              captures: { asmt_id: "$.data.id" }
            - call: "POST /field-ops/incidents/${inc_id}/transitions"
              payload: { to_state: "ACTIVE" }
              as: FieldCoordinator
            - call: "POST /field-ops/field-kitchens"
              payload: { incident_id: "${inc_id}", assessment_id: "${asmt_id}", site_name: "Riverside Depot", latitude: 36.75, longitude: -119.77, power_source: "GENERATOR", water_source: "TRUCKED", refrigeration_hours_available: 12, daily_capacity_meals: 500 }
              as: FieldCoordinator
              captures: { fk_id: "$.data.id" }
            - call: "POST /field-ops/field-kitchens/${fk_id}/transitions"
              payload: { to_state: "UTILITIES_PENDING" }
              as: FieldCoordinator
            - call: "POST /field-ops/field-kitchens/${fk_id}/transitions"
              payload: { to_state: "FOOD_SAFETY_CLEARED" }
              as: FoodSafetyOfficer
            - call: "POST /field-ops/field-kitchens/${fk_id}/transitions"
              payload: { to_state: "OPERATIONAL" }
              as: FieldCoordinator
            - call: "POST /field-ops/distribution-sites"
              payload: { incident_id: "${inc_id}", site_name: "Oak Shelter", site_type: "SHELTER", population_served: 300, daily_meal_request: 600, access_constraint: "OPEN" }
              as: LogisticsCoordinator
              captures: { s1: "$.data.id" }
            - call: "POST /field-ops/distribution-runs"
