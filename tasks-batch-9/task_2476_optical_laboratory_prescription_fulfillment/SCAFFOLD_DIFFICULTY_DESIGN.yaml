  # =========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: benefit_void_reverses_the_ledger_and_returns_rolling_benefit_used_to_zero
        grounds:
          - state_machines.RxOrder.billing_status.BENEFIT_APPLIED_to_BENEFIT_VOIDED
          - calculations.patient_benefit_used_rolling
          - entities.SettlementEntry.fields.entry_type
          - entities.Patient.fields.benefit_used_cents
        distinguishing_aspect: |
          The conserved quantity is MONEY IN CENTS: benefit-void appends a compensating
          BENEFIT_REVERSAL of +40000 rather than deleting the INSURANCE_BENEFIT row, so the ledger
          nets back to the full 81977 gross, patient_portion_cents returns to 81977 and the patient's
          rolling benefit_used_cents returns to exactly its pre-application value of 0.
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z; full progressive fixture with plan cap 40000."
            - "Verified prescription and an expedited order with frame 21995 and AR_PREMIUM + HARDCOAT."
