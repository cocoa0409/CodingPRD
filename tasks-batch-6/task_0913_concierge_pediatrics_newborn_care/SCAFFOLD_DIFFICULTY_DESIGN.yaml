            - "after b1 and b2, EntitlementGrant.${grant_id}.booked_count == 2 and available_count == 1"
            - "after b3, EntitlementGrant.${grant_id}.available_count == 0, booked_count == 3, status == EXHAUSTED, and available_count + booked_count + consumed_count == 3"
            - "ConsultBooking.${b4_id}.coverage_route == OVERAGE"
