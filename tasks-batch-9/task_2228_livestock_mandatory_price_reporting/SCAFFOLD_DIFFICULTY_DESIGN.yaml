              payload: {}
              as: ProgramAdmin
            - call: "POST /registrations/${reg_hi}/determine"
              payload: {}
              as: ProgramAdmin
            - call: "POST /registrations/${reg_fl}/determine"
              payload: {}
              as: ProgramAdmin
          assert:
            - "At threshold-1: Registration.${reg_lo}.measured_head == 124999, threshold_head == 125000, determination_outcome == EXEMPT and registration_number == null"
            - "At threshold: Registration.${reg_eq}.measured_head == 125000, determination_outcome == MANDATORY (>= is inclusive) and registration_number matches MPR-2026-NNNN"
            - "At threshold+1: Registration.${reg_hi}.measured_head == 125001 and determination_outcome == MANDATORY"
