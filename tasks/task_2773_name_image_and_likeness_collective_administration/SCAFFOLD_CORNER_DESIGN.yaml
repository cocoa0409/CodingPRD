          assert:
            - "${doc_before} == NONE"
            - "${err_id} == ERR_TAXPAYER_DOC_REQUIRED"
            - "The rejected release returned 422 and created no PaymentRelease row."
            - "${doc_after} == W8BEN"
            - "${treaty_after} == false"
            - "${dc_ver2} == ${dc_ver1}"
            - "${rel_status} == RELEASED"
            - "${rel_basis} == NRA_STATUTORY"
            - "${rel_withheld} == 30000"
            - "${rel_net} == 70000"
            - "Athlete.${ath_id}.tax_form_required == FORM_1042_S"
            - "DealContract.${dc_id}.released_total_cents == 100000"

      - name: schema_check_precedes_existence_check_returns_invalid_request
        claim_type: priority_ordering
        grounds: [validations.priority_5_schema_body_shape, validations.priority_7_existence_body_foreign_key, errors.ERR_INVALID_REQUEST]
        distinguishing_aspect: "A single request violating both priority 5 and priority 7 must surface ERR_INVALID_REQUEST, not ERR_COLLECTIVE_NOT_FOUND; the reverse-order implementation dereferences the unknown foreign key first and returns 404."
        test_recipe:
          setup: ["One collective with one OPEN tier, so a well-formed donor request would succeed."]
          setup_api_calls:
            - call: "POST /nil/collectives"
              payload: { name: "Order Collective", institution_name: "Order Institution", institution_ipeds_code: "024100", home_state_code: "OH", association_ruleset: "NCAA_2024" }
              as: PlatformAdmin
              captures: { col_id: $.data.id }
            - call: "POST /nil/collectives/${col_id}/membership-tiers"
              payload: { tier_code: "T1", tier_name: "Ord Base", annual_dues_cents: 20000, benefit_rank: 1 }
              as: CollectiveDirector
              captures: { tier_id: $.data.id }
            - call: "POST /nil/membership-tiers/${tier_id}/transitions"
              payload: { action: "OPEN" }
              as: CollectiveDirector
          trigger:
            - call: "POST /nil/donor-members"
              payload: { collective_id: "00000000-0000-0000-0000-0000000000aa", membership_tier_id: "${tier_id}" }
              as: CollectiveDirector
              captures: { err_both: $.data.error_id }
            - call: "POST /nil/donor-members"
              payload: { collective_id: "00000000-0000-0000-0000-0000000000aa", membership_tier_id: "${tier_id}", display_name: "Ord Donor", email: "ord@example.com" }
              as: CollectiveDirector
              captures: { err_existence_only: $.data.error_id }
          assert:
            - "${err_both} == ERR_INVALID_REQUEST"
            - "The doubly-invalid request returns 400, so priority 5 outranks priority 7."
            - "${err_existence_only} == ERR_COLLECTIVE_NOT_FOUND"
            - "The second request returns 404, proving the existence check does run once the body shape is valid."
            - "GET /nil/donor-members?collective_id=${col_id} returns 0 rows."

      - name: missing_auth_header_returns_401_and_unknown_role_returns_400
        claim_type: priority_ordering
        grounds: [validations.priority_1_auth_headers_present, validations.priority_2_auth_role_recognised, validations.priority_3_rbac_endpoint_role_allowed]
        distinguishing_aspect: "The auth ladder is ordered 1 then 2 then 3, so an absent header must give 401 before role recognition, an unrecognised role must give 400 before RBAC, and only a recognised but unpermitted role reaches the 403."
        test_recipe:
          setup: ["No data is required: all three checks run before any body or existence handling."]
          setup_api_calls: []
          trigger:
            - call: "POST /nil/collectives"
              payload: { name: "Auth Ladder", institution_name: "Auth Institution", institution_ipeds_code: "024200", home_state_code: "TX", association_ruleset: "NCAA_2024" }
              as: NONE
              captures: { err_missing: $.data.error_id }
            - call: "POST /nil/collectives"
              payload: { name: "Auth Ladder", institution_name: "Auth Institution", institution_ipeds_code: "024200", home_state_code: "TX", association_ruleset: "NCAA_2024" }
              as: NotARealRole
              captures: { err_unknown_role: $.data.error_id }
            - call: "POST /nil/collectives"
              payload: { name: "Auth Ladder", institution_name: "Auth Institution", institution_ipeds_code: "024200", home_state_code: "TX", association_ruleset: "NCAA_2024" }
              as: TreasuryOfficer
              captures: { err_unauthorized: $.data.error_id }
          assert:
            - "${err_missing} == ERR_MISSING_AUTH_HEADER"
            - "The first call omits both X-User-Role and X-User-ID and returns 401."
            - "${err_unknown_role} == ERR_INVALID_ROLE"
            - "The second call sends X-User-Role: NotARealRole with a valid X-User-ID and returns 400."
            - "${err_unauthorized} == ERR_UNAUTHORIZED"
            - "The third call uses a real but unpermitted role and returns 403, since POST /nil/collectives is exclusive to PlatformAdmin."
            - "GET /nil/collectives as PlatformAdmin returns 0 rows, so none of the three rejected requests created a collective."

      - name: fiscal_rule_is_masked_by_the_higher_priority_state_rule
        claim_type: priority_conflict
        grounds: [validations.priority_17_state_contract_lifecycle, validations.priority_45_release_within_payout_eligible]
        excluded_because:
          difficulty_instance: priority_pair_validation_conflict / state_beats_fiscal_on_payment_release_against_terminated_contract
          rationale: "That §1.8 instance constructs a request that violates priority 17 and priority 45 simultaneously and asserts the priority 17 error with its 409 status, which is exactly this claim."

  - section: endpoints
    instances:

      - name: donor_member_list_filters_by_status_and_membership_tier
        claim_type: standard_crud
        grounds: ['endpoints."GET /nil/donor-members"', entities.DonorMember.fields.status, entities.MembershipTier]
        distinguishing_aspect: "status and membership_tier_id are ANDed, not ORed: with two PROSPECT donors on different tiers and one ACTIVE donor, each filter alone and the pair together return different row counts."
        test_recipe:
          setup:
            - "One collective with two OPEN tiers (rank 1 dues 20000 and rank 2 dues 60000)."
            - "Donor One on tier 1 with a settled contribution of gross 50000, so it bubbles up to ACTIVE."
            - "Donor Two on tier 1 and Donor Three on tier 2, both left PROSPECT."
          setup_api_calls:
            - call: "POST /nil/collectives"
              payload: { name: "Filtered Collective", institution_name: "Filtered Institution", institution_ipeds_code: "024300", home_state_code: "TX", association_ruleset: "NCAA_2024" }
              as: PlatformAdmin
              captures: { col_id: $.data.id }
            - call: "POST /nil/collectives/${col_id}/membership-tiers"
              payload: { tier_code: "T1", tier_name: "Filt Base", annual_dues_cents: 20000, benefit_rank: 1 }
              as: CollectiveDirector
              captures: { tier1: $.data.id }
            - call: "POST /nil/collectives/${col_id}/membership-tiers"
              payload: { tier_code: "T2", tier_name: "Filt Club", annual_dues_cents: 60000, benefit_rank: 2 }
              as: CollectiveDirector
              captures: { tier2: $.data.id }
            - call: "POST /nil/membership-tiers/${tier1}/transitions"
              payload: { action: "OPEN" }
              as: CollectiveDirector
            - call: "POST /nil/membership-tiers/${tier2}/transitions"
              payload: { action: "OPEN" }
              as: CollectiveDirector
            - call: "POST /nil/donor-members"
              payload: { collective_id: "${col_id}", membership_tier_id: "${tier1}", display_name: "Filt Donor One", email: "f1@example.com" }
              as: CollectiveDirector
              captures: { d1: $.data.id }
            - call: "POST /nil/donor-members"
              payload: { collective_id: "${col_id}", membership_tier_id: "${tier1}", display_name: "Filt Donor Two", email: "f2@example.com" }
              as: CollectiveDirector
              captures: { d2: $.data.id }
            - call: "POST /nil/donor-members"
              payload: { collective_id: "${col_id}", membership_tier_id: "${tier2}", display_name: "Filt Donor Three", email: "f3@example.com" }
              as: CollectiveDirector
              captures: { d3: $.data.id }
            - call: "POST /nil/contributions"
              payload: { donor_member_id: "${d1}", gross_amount_cents: 50000, source_kind: "ONE_TIME_GIFT", designation: "UNRESTRICTED", processor_outcome: "APPROVE" }
              as: TreasuryOfficer
              captures: { contrib_id: $.data.id, contrib_net: $.data.net_amount_cents }
          trigger:
            - call: "GET /nil/donor-members"
              payload: { collective_id: "${col_id}", status: "PROSPECT" }
              as: CollectiveDirector
              captures: { p_first: "$.data[0].id", p_second: "$.data[1].id" }
            - call: "GET /nil/donor-members"
              payload: { collective_id: "${col_id}", membership_tier_id: "${tier1}" }
              as: CollectiveDirector
              captures: { t1_first: "$.data[0].id" }
            - call: "GET /nil/donor-members"
              payload: { collective_id: "${col_id}", membership_tier_id: "${tier1}", status: "PROSPECT" }
              as: CollectiveDirector
              captures: { both_first: "$.data[0].id" }
          assert:
            - "${contrib_net} == 48520"
            - "The status filter returns exactly 2 rows with meta.total_count 2."
            - "${p_first} == ${d2}"
            - "${p_second} == ${d3}"
            - "The tier filter returns exactly 2 rows with meta.total_count 2."
            - "${t1_first} == ${d1}"
            - "The combined filter returns exactly 1 row with meta.total_count 1."
            - "${both_first} == ${d2}"
            - "DonorMember.${d1}.status == ACTIVE"

      - name: commitment_restructure_supersedes_the_original_and_links_it
        claim_type: cross_reference_link
        grounds: ['endpoints."POST /nil/commitments/{id}/restructure"', entities.Commitment.fields.superseded_by_commitment_id, state_machines.sm_commitment_status]
        distinguishing_aspect: "Restructure is the only producer of the self-referential link: it must return the NEW row, cancel the original, set the original's superseded_by_commitment_id to the new id, and leave the new row's own link NULL so the chain cannot cycle."
        test_recipe:
          setup: ["One collective, one OPEN tier, one donor, and one ACTIVE MAJOR_GIFT_PLEDGE of 300000 over 3 installments."]
          setup_api_calls:
            - call: "POST /nil/collectives"
              payload: { name: "Restructure Collective", institution_name: "Restructure Institution", institution_ipeds_code: "024400", home_state_code: "OH", association_ruleset: "NCAA_2026" }
              as: PlatformAdmin
              captures: { col_id: $.data.id }
            - call: "POST /nil/collectives/${col_id}/membership-tiers"
              payload: { tier_code: "T3", tier_name: "Restr Club", annual_dues_cents: 90000, benefit_rank: 3 }
              as: CollectiveDirector
              captures: { tier_id: $.data.id }
            - call: "POST /nil/membership-tiers/${tier_id}/transitions"
              payload: { action: "OPEN" }
              as: CollectiveDirector
            - call: "POST /nil/donor-members"
              payload: { collective_id: "${col_id}", membership_tier_id: "${tier_id}", display_name: "Restr Donor", email: "restr@example.com" }
              as: CollectiveDirector
              captures: { donor_id: $.data.id, donor_ver: $.data.version }
            - call: "POST /nil/commitments"
              payload: { donor_member_id: "${donor_id}", kind: "MAJOR_GIFT_PLEDGE", amount_cents: 300000, billing_interval: "NONE", installments_total: 3, expected_donor_member_version: "${donor_ver}" }
              as: CollectiveDirector
              captures: { old_id: $.data.id, old_link_before: $.data.superseded_by_commitment_id, old_status_before: $.data.status }
          trigger:
            - call: "POST /nil/commitments/${old_id}/restructure"
              payload: { amount_cents: 180000, installments_total: 2 }
              as: CollectiveDirector
              captures: { new_id: $.data.id, new_status: $.data.status, new_amount: $.data.amount_cents, new_kind: $.data.kind, new_interval: $.data.billing_interval, new_link: $.data.superseded_by_commitment_id, new_charged: $.data.installments_charged }
          assert:
            - "${old_link_before} == null"
            - "${old_status_before} == ACTIVE"
            - "${new_id} != ${old_id}"
            - "${new_status} == ACTIVE"
            - "${new_amount} == 180000"
            - "${new_kind} == MAJOR_GIFT_PLEDGE"
            - "${new_interval} == NONE"
            - "${new_link} == null"
            - "${new_charged} == 0"
            - "Commitment.${old_id}.status == CANCELLED"
            - "Commitment.${old_id}.superseded_by_commitment_id == ${new_id}"
            - "DonorMember.${donor_id}.status == PROSPECT, because the new ACTIVE commitment prevents the LAPSED bubble-up."
            - "GET /nil/commitments?superseded_by_commitment_id=${new_id} returns exactly one row and it is ${old_id}."
            - "MembershipTier.${tier_id}.active_commitment_count == 1"

      - name: subscription_charge_cycle_charges_only_recurring_commitments
        claim_type: bulk_action
        grounds: ['endpoints."POST /nil/collectives/{id}/billing-runs"', entities.Commitment.fields.installments_charged, calculations.calc_contribution_processing_fee]
        distinguishing_aspect: "One SUBSCRIPTION_CHARGE_CYCLE call must charge every RECURRING_SUBSCRIPTION of the collective and skip the MAJOR_GIFT_PLEDGE entirely, minting one settled Contribution per charged commitment with per-row fees, and the run must touch no OCC version."
        test_recipe:
          setup:
            - "One collective, one OPEN tier, one donor."
            - "Three commitments on that donor in creation order: a MONTHLY RECURRING_SUBSCRIPTION of 5000, an ANNUAL RECURRING_SUBSCRIPTION of 12000, and a MAJOR_GIFT_PLEDGE of 300000 with billing_interval NONE."
            - "Each create re-reads the donor version, because a successful commitment create bumps DonorMember.version."
          setup_api_calls:
            - call: "POST /nil/collectives"
              payload: { name: "Billing Collective", institution_name: "Billing Institution", institution_ipeds_code: "024500", home_state_code: "CA", association_ruleset: "NCAA_2026" }
              as: PlatformAdmin
              captures: { col_id: $.data.id }
            - call: "POST /nil/collectives/${col_id}/membership-tiers"
              payload: { tier_code: "T2", tier_name: "Bill Club", annual_dues_cents: 60000, benefit_rank: 2 }
              as: CollectiveDirector
              captures: { tier_id: $.data.id }
            - call: "POST /nil/membership-tiers/${tier_id}/transitions"
              payload: { action: "OPEN" }
              as: CollectiveDirector
            - call: "POST /nil/donor-members"
              payload: { collective_id: "${col_id}", membership_tier_id: "${tier_id}", display_name: "Bill Donor", email: "bill@example.com" }
              as: CollectiveDirector
              captures: { donor_id: $.data.id, ver_a: $.data.version }
            - call: "POST /nil/commitments"
              payload: { donor_member_id: "${donor_id}", kind: "RECURRING_SUBSCRIPTION", amount_cents: 5000, billing_interval: "MONTHLY", expected_donor_member_version: "${ver_a}" }
              as: CollectiveDirector
              captures: { cm_monthly: $.data.id }
            - call: "GET /nil/donor-members/${donor_id}"
              payload: {}
              as: CollectiveDirector
              captures: { ver_b: $.data.version }
            - call: "POST /nil/commitments"
              payload: { donor_member_id: "${donor_id}", kind: "RECURRING_SUBSCRIPTION", amount_cents: 12000, billing_interval: "ANNUAL", expected_donor_member_version: "${ver_b}" }
              as: CollectiveDirector
              captures: { cm_annual: $.data.id }
            - call: "GET /nil/donor-members/${donor_id}"
              payload: {}
              as: CollectiveDirector
              captures: { ver_c: $.data.version }
            - call: "POST /nil/commitments"
              payload: { donor_member_id: "${donor_id}", kind: "MAJOR_GIFT_PLEDGE", amount_cents: 300000, billing_interval: "NONE", installments_total: 3, expected_donor_member_version: "${ver_c}" }
              as: CollectiveDirector
              captures: { cm_pledge: $.data.id }
            - call: "GET /nil/collectives/${col_id}"
              payload: {}
              as: TreasuryOfficer
              captures: { col_ver_before: $.data.version, settled_before: $.data.settled_net_funds_cents }
          trigger:
            - call: "POST /nil/collectives/${col_id}/billing-runs"
              payload: { run_kind: "SUBSCRIPTION_CHARGE_CYCLE" }
              as: TreasuryOfficer
              captures: { charged: $.data.charged_commitment_count, settled_count: $.data.settled_contribution_count, failed_count: $.data.failed_contribution_count, recomputed: $.data.recomputed_contribution_count, executed_at: $.data.executed_at }
          assert:
            - "${settled_before} == 0"
            - "${charged} == 2"
            - "${settled_count} == 2"
            - "${failed_count} == 0"
            - "${recomputed} == 0"
            - "${executed_at} == 2026-08-01T00:00:00Z"
            - "Commitment.${cm_monthly}.installments_charged == 1"
            - "Commitment.${cm_annual}.installments_charged == 1"
            - "Commitment.${cm_pledge}.installments_charged == 0"
            - "Commitment.${cm_pledge}.status == ACTIVE"
            - "GET /nil/contributions?donor_member_id=${donor_id} returns exactly 2 rows, both with source_kind SUBSCRIPTION_CHARGE and status SETTLED, ordered by sequence_no ASC."
            - "The 5000 charge has processing_fee_cents 175 and net_amount_cents 4825; the 12000 charge has processing_fee_cents 378 and net_amount_cents 11622."
            - "Collective.${col_id}.settled_net_funds_cents == 16447"
            - "Collective.${col_id}.version == ${col_ver_before}, because a billing run touches no OCC version."
            - "A second identical run charges the same two commitments again and takes installments_charged to 2 on each, so the run is intentionally not idempotent."

      - name: clock_endpoint_reports_previous_and_new_utc
        claim_type: action_endpoint
        grounds: ['endpoints."POST /nil/_clock/set_current_utc"', determinism_conventions.logical_clock]
        distinguishing_aspect: "The clock starts at the fixed default 2026-08-01T00:00:00Z rather than wall-clock time, it may be moved backward, and every stamped field must come from it, so previous_utc on the second call must equal the first call's current_utc."
        test_recipe:
          setup: ["A fresh server whose clock has never been set."]
          setup_api_calls: []
          trigger:
            - call: "POST /nil/collectives"
              payload: { name: "Clock Collective", institution_name: "Clock Institution", institution_ipeds_code: "024600", home_state_code: "TX", association_ruleset: "NCAA_2024" }
              as: PlatformAdmin
              captures: { col_id: $.data.id, created_at_default: $.data.created_at }
            - call: "POST /nil/_clock/set_current_utc"
              payload: { current_utc: "2026-09-15T12:00:00Z" }
              as: PlatformAdmin
              captures: { prev_1: $.data.previous_utc, cur_1: $.data.current_utc }
            - call: "POST /nil/collectives"
              payload: { name: "Clock Collective Two", institution_name: "Clock Institution Two", institution_ipeds_code: "024700", home_state_code: "OH", association_ruleset: "NCAA_2026" }
              as: PlatformAdmin
              captures: { col2_id: $.data.id, created_at_forward: $.data.created_at }
            - call: "POST /nil/_clock/set_current_utc"
              payload: { current_utc: "2026-08-05T00:00:00Z" }
              as: PlatformAdmin
              captures: { prev_2: $.data.previous_utc, cur_2: $.data.current_utc }
            - call: "POST /nil/collectives"
              payload: { name: "Clock Collective Three", institution_name: "Clock Institution Three", institution_ipeds_code: "024800", home_state_code: "CA", association_ruleset: "NAIA" }
              as: PlatformAdmin
              captures: { col3_id: $.data.id, created_at_backward: $.data.created_at }
          assert:
            - "${created_at_default} == 2026-08-01T00:00:00Z"
            - "${prev_1} == 2026-08-01T00:00:00Z"
            - "${cur_1} == 2026-09-15T12:00:00Z"
            - "${created_at_forward} == 2026-09-15T12:00:00Z"
            - "${prev_2} == 2026-09-15T12:00:00Z"
            - "${cur_2} == 2026-08-05T00:00:00Z"
            - "${created_at_backward} == 2026-08-05T00:00:00Z"
            - "The clock does not tick between calls: two collectives created back to back under the same clock setting carry byte-identical created_at values."
            - "A malformed current_utc such as \"not-a-timestamp\" returns ERR_INVALID_REQUEST with 400 and leaves the clock unchanged."

      - name: deal_contract_read_exposes_all_derived_totals_together
        claim_type: computed_read
        grounds: [entities.DealContract.fields.released_total_cents, entities.DealContract.fields.deliverable_value_total_cents, 'endpoints."GET /nil/deal-contracts/{id}"']
        distinguishing_aspect: "One GET must reconcile three independent derivations at once: the release ledger, the non-forfeited deliverable value, and the payment dimension, with a FORFEITED sibling excluded from the value total while a VERIFIED one is included."
        test_recipe:
          setup:
            - "A collective with 487470 cents of settled UNRESTRICTED net funds (gross 500000, fee 12530)."
            - "One ENROLLED athlete with taxpayer_doc_on_file W9 and one ACTIVE contract worth 200000 with disclosure ACCEPTED."
            - "Three deliverables of 80000, 60000 and 60000: the first VERIFIED, the second left PENDING, the third WAIVED."
            - "One CONTRACT_ADVANCE release of 50000 in RELEASED."
          setup_api_calls:
            - call: "POST /nil/collectives"
              payload: { name: "Derived Collective", institution_name: "Derived Institution", institution_ipeds_code: "024900", home_state_code: "OH", association_ruleset: "NCAA_2024" }
              as: PlatformAdmin
              captures: { col_id: $.data.id }
            - call: "POST /nil/collectives/${col_id}/membership-tiers"
              payload: { tier_code: "T3", tier_name: "Deriv Club", annual_dues_cents: 90000, benefit_rank: 3 }
              as: CollectiveDirector
              captures: { tier_id: $.data.id }
            - call: "POST /nil/membership-tiers/${tier_id}/transitions"
              payload: { action: "OPEN" }
              as: CollectiveDirector
            - call: "POST /nil/donor-members"
