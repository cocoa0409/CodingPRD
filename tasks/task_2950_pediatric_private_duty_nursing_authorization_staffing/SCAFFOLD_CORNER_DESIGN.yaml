      - name: fiscal_ceilings_reject_the_payer_cap_before_the_requested_hours
        claim_type: Priority Ordering
        grounds:
          - validations[priority 34 ERR_PAYER_HOUR_CAP_EXCEEDED]
          - validations[priority 35 ERR_APPROVED_EXCEEDS_REQUESTED]
          - endpoints[POST /pdn/authorizations]
        distinguishing_aspect: >-
          With a payer cap of 84 and a requested 56, an approval of 90 breaks both fiscal rules and
          must report the lower priority number (34, the payer cap); 60 breaks only rule 35; 40
          breaks neither and creates the authorization.
        test_recipe:
          setup:
            - "Payer cap 84 h/wk; a SUBMITTED plan of care requesting 56 h/wk."
          setup_api_calls:
            - call: "POST /pdn/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-03T06:00:00Z" }
              as: AgencyAdmin
              as_user_id: "admin-001"
