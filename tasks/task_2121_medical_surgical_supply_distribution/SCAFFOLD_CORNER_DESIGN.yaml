            - call: "POST /lots"
              payload: { item_id: "${item_id}", lot_code: "LOT-LATE", expiry_date: "2027-01-01T00:00:00Z", received_quantity: 50 }
              as: DistributionOperator
              as_user_id: "dc-op-1"
              captures: { lot_late_id: $.data.id }
            - call: "POST /lots"
