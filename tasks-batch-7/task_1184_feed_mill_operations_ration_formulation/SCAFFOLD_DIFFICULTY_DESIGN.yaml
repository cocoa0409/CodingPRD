# =============================================================================
# SCAFFOLD_DIFFICULTY_DESIGN.yaml — Test Targeting Index (§1.8)
# 9 rules x >=2 differentiated instances = 19 instances
# =============================================================================
scaffold_difficulty_design:
  - rule_id: dual_variant_calc
    instances:
      - name: order_price_quoted_vs_final_diverges
        grounds:
          - calculations.order_price
          - calculations.effective_spot_price
          - entities.CustomerOrder.fields.quoted_total_cents
          - entities.CustomerOrder.fields.final_total_cents
        distinguishing_aspect: |
          Same ration, same order: the quoted variant (forward-looking contract-blend projection at
          quote time) prices corn at 30000 while the final variant (actual per-weighment costs) prices
          it at 31000 from a later tick and at actual tons 7.140 — quoted 426420 vs final 439121 cents.
          Entity domain: CustomerOrder pricing. Different domain from the assay instance below.
        test_recipe:
          setup:
            - "Catalog: corn (30000 c/t) + SBM (52000 c/t); formula F-GROW optimized to corn70/SBM30 and ACTIVE"
            - "Customer with credit_limit_cents 1000000; order of 10 tons QUOTED at 426420 then CONFIRMED"
            - "Line L1, corn bin 20t, SBM bin 20t; batch of 10 tons BATCHING; a late corn tick at 31000 lands before weighing"
          setup_api_calls:
            - { call: "POST /api/ingredients", payload: { code: "CORN", name: "Yellow corn", hazard_class: "STANDARD", is_flush_material: false, crude_protein_pct: 9.0, crude_fiber_pct: 2.2, metabolizable_energy_kcal_kg: 3300 }, as: MillManager, captures: { corn_id: $.data.id } }
            - { call: "POST /api/ingredients", payload: { code: "SBM", name: "Soybean meal", hazard_class: "STANDARD", is_flush_material: false, crude_protein_pct: 44.0, crude_fiber_pct: 7.0, metabolizable_energy_kcal_kg: 2600 }, as: MillManager, captures: { sbm_id: $.data.id } }
            - { call: "POST /api/price-ticks", payload: { ingredient_id: "${corn_id}", price_cents_per_ton: 30000, effective_from: "2026-04-01T00:00:00Z" }, as: MillManager }
            - { call: "POST /api/price-ticks", payload: { ingredient_id: "${sbm_id}", price_cents_per_ton: 52000, effective_from: "2026-04-01T00:00:00Z" }, as: MillManager }
            - { call: "POST /api/formulas", payload: { code: "F-GROW", min_protein_pct: 19.5, max_fiber_pct: 5.0, min_energy_kcal_kg: 3000 }, as: Nutritionist, captures: { f_id: $.data.id, f_v: $.data.version } }
            - { call: "POST /api/formulas/${f_id}/optimize", payload: { expected_formula_version: "${f_v}" }, as: Nutritionist }
            - { call: "POST /api/formulas/${f_id}/activate", payload: {}, as: Nutritionist }
            - { call: "POST /api/customers", payload: { name: "Acme Farms", credit_limit_cents: 1000000 }, as: MillManager, captures: { cust_id: $.data.id, cust_v: $.data.version } }
            - { call: "POST /api/orders", payload: { formula_id: "${f_id}", tons: 10, expected_customer_version: "${cust_v}" }, as: Customer, as_user_id: "${cust_id}", captures: { ord_id: $.data.id } }
            - { call: "POST /api/orders/${ord_id}/confirm", payload: {}, as: Customer, as_user_id: "${cust_id}" }
            - { call: "POST /api/employees", payload: { full_name: "Olly Operator", capability: "OPERATOR" }, as: MillManager, captures: { op_id: $.data.id } }
            - { call: "POST /api/employees", payload: { full_name: "Quinn Quality", capability: "QUALITY_TECH" }, as: MillManager, captures: { qt_id: $.data.id } }
            - { call: "POST /api/lines", payload: { code: "L1" }, as: MillManager, captures: { line_id: $.data.id } }
            - { call: "POST /api/bins", payload: { code: "BIN-C", capacity_tons: 50 }, as: MillManager, captures: { binc_id: $.data.id } }
            - { call: "POST /api/bins/${binc_id}/assign", payload: { ingredient_id: "${corn_id}" }, as: MillManager }
            - { call: "POST /api/bins/${binc_id}/replenish", payload: { tons: 20 }, as: MillManager }
            - { call: "POST /api/bins", payload: { code: "BIN-S", capacity_tons: 50 }, as: MillManager, captures: { bins_id: $.data.id } }
            - { call: "POST /api/bins/${bins_id}/assign", payload: { ingredient_id: "${sbm_id}" }, as: MillManager }
            - { call: "POST /api/bins/${bins_id}/replenish", payload: { tons: 20 }, as: MillManager }
            - { call: "POST /api/batches", payload: { order_id: "${ord_id}", line_id: "${line_id}", target_tons: 10, planned_start_at: "2026-05-02T10:00:00Z", planned_end_at: "2026-05-02T11:00:00Z" }, as: MillManager, captures: { bat_id: $.data.id } }
            - { call: "POST /api/batches/${bat_id}/start", payload: {}, as: Operator, as_user_id: "${op_id}" }
            - { call: "POST /api/price-ticks", payload: { ingredient_id: "${corn_id}", price_cents_per_ton: 31000, effective_from: "2026-04-15T00:00:00Z" }, as: MillManager }
            - { call: "POST /api/batches/${bat_id}/weighments", payload: { ingredient_id: "${corn_id}", bin_id: "${binc_id}", actual_tons: 7.140 }, as: Operator, as_user_id: "${op_id}", captures: { w_corn: $.data.id } }
            - { call: "POST /api/batches/${bat_id}/weighments", payload: { ingredient_id: "${sbm_id}", bin_id: "${bins_id}", actual_tons: 3.000 }, as: Operator, as_user_id: "${op_id}" }
            - { call: "POST /api/batches/${bat_id}/mix", payload: {}, as: Operator, as_user_id: "${op_id}" }
            - { call: "POST /api/samples", payload: { batch_id: "${bat_id}", sample_type: "COMPOSITE" }, as: QualityTech, as_user_id: "${qt_id}", captures: { sam_id: $.data.id } }
            - { call: "POST /api/samples/${sam_id}/result", payload: { protein_pct_actual: 19.6, crude_fiber_pct_actual: 4.0, moisture_pct: 0 }, as: QualityTech, as_user_id: "${qt_id}" }
            - { call: "POST /api/batches/${bat_id}/release", payload: {}, as: QualityTech, as_user_id: "${qt_id}" }
          trigger:
            - { call: "POST /api/orders/${ord_id}/complete", payload: {}, as: MillManager }
          assert:
            - "CustomerOrder.${ord_id}.quoted_total_cents == 426420"
            - "CustomerOrder.${ord_id}.final_total_cents == 439121"
            - "CustomerOrder.${ord_id}.final_total_cents != CustomerOrder.${ord_id}.quoted_total_cents"
            - "Weighment.${w_corn}.unit_price_cents == 31000 and Weighment.${w_corn}.line_cost_cents == 221340"
            - "Customer.${cust_id}.credit_used_cents == 439121 (reclassed from quoted 426420 to final)"

      - name: sample_assay_as_fed_vs_dry_matter_flips_outcome
        grounds:
          - calculations.assay_adjustment
          - entities.QualitySample.fields.protein_dry_matter
          - state_machines.QualitySample.PENDING_to_PASS
        distinguishing_aspect: |
          Same assay record, two bases: as-fed protein 18.72 is BELOW the pinned 19.5 floor (would FAIL)
          while the moisture-corrected dry-matter basis computes exactly 19.50 (PASSES). Release gating
          uses the dry-matter variant, so the batch stays MIXED instead of cascading to HOLD.
          Entity domain: QualitySample assay — different domain from CustomerOrder pricing above.
        test_recipe:
          setup:
            - "Catalog + ACTIVE F-GROW (corn70/SBM30; min_protein 19.5, max_fiber 5.0); customer confirmed order 10t"
            - "Batch 10t on L1 in MIXED with corn 7.000 / SBM 3.000 weighed"
          setup_api_calls:
            - { call: "POST /api/ingredients", payload: { code: "CORN", name: "Yellow corn", hazard_class: "STANDARD", crude_protein_pct: 9.0, crude_fiber_pct: 2.2, metabolizable_energy_kcal_kg: 3300 }, as: MillManager, captures: { corn_id: $.data.id } }
            - { call: "POST /api/ingredients", payload: { code: "SBM", name: "Soybean meal", hazard_class: "STANDARD", crude_protein_pct: 44.0, crude_fiber_pct: 7.0, metabolizable_energy_kcal_kg: 2600 }, as: MillManager, captures: { sbm_id: $.data.id } }
            - { call: "POST /api/price-ticks", payload: { ingredient_id: "${corn_id}", price_cents_per_ton: 30000, effective_from: "2026-04-01T00:00:00Z" }, as: MillManager }
            - { call: "POST /api/price-ticks", payload: { ingredient_id: "${sbm_id}", price_cents_per_ton: 52000, effective_from: "2026-04-01T00:00:00Z" }, as: MillManager }
            - { call: "POST /api/formulas", payload: { code: "F-GROW", min_protein_pct: 19.5, max_fiber_pct: 5.0, min_energy_kcal_kg: 3000 }, as: Nutritionist, captures: { f_id: $.data.id, f_v: $.data.version } }
            - { call: "POST /api/formulas/${f_id}/optimize", payload: { expected_formula_version: "${f_v}" }, as: Nutritionist }
            - { call: "POST /api/formulas/${f_id}/activate", payload: {}, as: Nutritionist }
            - { call: "POST /api/customers", payload: { name: "Acme Farms", credit_limit_cents: 1000000 }, as: MillManager, captures: { cust_id: $.data.id, cust_v: $.data.version } }
            - { call: "POST /api/orders", payload: { formula_id: "${f_id}", tons: 10, expected_customer_version: "${cust_v}" }, as: Customer, as_user_id: "${cust_id}", captures: { ord_id: $.data.id } }
            - { call: "POST /api/orders/${ord_id}/confirm", payload: {}, as: Customer, as_user_id: "${cust_id}" }
            - { call: "POST /api/employees", payload: { full_name: "Olly Operator", capability: "OPERATOR" }, as: MillManager, captures: { op_id: $.data.id } }
            - { call: "POST /api/employees", payload: { full_name: "Quinn Quality", capability: "QUALITY_TECH" }, as: MillManager, captures: { qt_id: $.data.id } }
            - { call: "POST /api/lines", payload: { code: "L1" }, as: MillManager, captures: { line_id: $.data.id } }
            - { call: "POST /api/bins", payload: { code: "BIN-C", capacity_tons: 50 }, as: MillManager, captures: { binc_id: $.data.id } }
            - { call: "POST /api/bins/${binc_id}/assign", payload: { ingredient_id: "${corn_id}" }, as: MillManager }
            - { call: "POST /api/bins/${binc_id}/replenish", payload: { tons: 20 }, as: MillManager }
            - { call: "POST /api/bins", payload: { code: "BIN-S", capacity_tons: 50 }, as: MillManager, captures: { bins_id: $.data.id } }
            - { call: "POST /api/bins/${bins_id}/assign", payload: { ingredient_id: "${sbm_id}" }, as: MillManager }
            - { call: "POST /api/bins/${bins_id}/replenish", payload: { tons: 20 }, as: MillManager }
            - { call: "POST /api/batches", payload: { order_id: "${ord_id}", line_id: "${line_id}", target_tons: 10, planned_start_at: "2026-05-02T10:00:00Z", planned_end_at: "2026-05-02T11:00:00Z" }, as: MillManager, captures: { bat_id: $.data.id } }
            - { call: "POST /api/batches/${bat_id}/start", payload: {}, as: Operator, as_user_id: "${op_id}" }
            - { call: "POST /api/batches/${bat_id}/weighments", payload: { ingredient_id: "${corn_id}", bin_id: "${binc_id}", actual_tons: 7.000 }, as: Operator, as_user_id: "${op_id}" }
            - { call: "POST /api/batches/${bat_id}/weighments", payload: { ingredient_id: "${sbm_id}", bin_id: "${bins_id}", actual_tons: 3.000 }, as: Operator, as_user_id: "${op_id}" }
            - { call: "POST /api/batches/${bat_id}/mix", payload: {}, as: Operator, as_user_id: "${op_id}" }
            - { call: "POST /api/samples", payload: { batch_id: "${bat_id}", sample_type: "COMPOSITE" }, as: QualityTech, as_user_id: "${qt_id}", captures: { sam_id: $.data.id } }
          trigger:
            - { call: "POST /api/samples/${sam_id}/result", payload: { protein_pct_actual: 18.72, crude_fiber_pct_actual: 4.8, moisture_pct: 4.0 }, as: QualityTech, as_user_id: "${qt_id}" }
          assert:
            - "QualitySample.${sam_id}.protein_dry_matter == 19.5 (18.72 / 0.96, round_half_up 2dp)"
            - "QualitySample.${sam_id}.fiber_dry_matter == 5.0 (4.8 / 0.96), exactly at pinned max -> passes"
            - "QualitySample.${sam_id}.result == PASS"
            - "as-fed basis 18.72 < pinned_min_protein_pct 19.5 would have failed; dry-matter variant flipped the outcome"
            - "Batch.${bat_id}.status == MIXED (no HOLD cascade fired)"

  - rule_id: combinatorial_formula
    instances:
      - name: optimizer_greedy_clamped_allocation
        grounds:
          - calculations.least_cost_ration_solve
          - entities.Formula.fields.lines
        distinguishing_aspect: |
          Mode (a): >=3 inputs with non-linear interaction — the allocation loops nested
          min(MAX_INCLUSION_PCT=70, remaining) clamps over a status/price-filtered, price-ranked
          candidate set: corn takes the 70% clamp, wheat collides with the moving remainder and is
          clamped to 30%, SBM is squeezed out entirely (0% lines dropped).
        test_recipe:
          setup:
            - "Three ACTIVE priced ingredients: corn 30000 (protein 9), wheat 33000 (protein 12), SBM 52000 (protein 44)"
            - "Formula F-3WAY with loose constraints (min_protein 5.0, max_fiber 20.0, min_energy 1000)"
          setup_api_calls:
            - { call: "POST /api/ingredients", payload: { code: "CORN", name: "Yellow corn", hazard_class: "STANDARD", crude_protein_pct: 9.0, crude_fiber_pct: 2.2, metabolizable_energy_kcal_kg: 3300 }, as: MillManager, captures: { corn_id: $.data.id } }
            - { call: "POST /api/ingredients", payload: { code: "WHEAT", name: "Wheat", hazard_class: "STANDARD", crude_protein_pct: 12.0, crude_fiber_pct: 3.0, metabolizable_energy_kcal_kg: 3200 }, as: MillManager, captures: { wheat_id: $.data.id } }
            - { call: "POST /api/ingredients", payload: { code: "SBM", name: "Soybean meal", hazard_class: "STANDARD", crude_protein_pct: 44.0, crude_fiber_pct: 7.0, metabolizable_energy_kcal_kg: 2600 }, as: MillManager, captures: { sbm_id: $.data.id } }
            - { call: "POST /api/price-ticks", payload: { ingredient_id: "${corn_id}", price_cents_per_ton: 30000, effective_from: "2026-04-01T00:00:00Z" }, as: MillManager }
            - { call: "POST /api/price-ticks", payload: { ingredient_id: "${wheat_id}", price_cents_per_ton: 33000, effective_from: "2026-04-01T00:00:00Z" }, as: MillManager }
            - { call: "POST /api/price-ticks", payload: { ingredient_id: "${sbm_id}", price_cents_per_ton: 52000, effective_from: "2026-04-01T00:00:00Z" }, as: MillManager }
            - { call: "POST /api/formulas", payload: { code: "F-3WAY", min_protein_pct: 5.0, max_fiber_pct: 20.0, min_energy_kcal_kg: 1000 }, as: Nutritionist, captures: { f_id: $.data.id, f_v: $.data.version } }
          trigger:
            - { call: "POST /api/formulas/${f_id}/optimize", payload: { expected_formula_version: "${f_v}" }, as: Nutritionist }
          assert:
            - "Formula.${f_id}.lines == [{ingredient_id: ${corn_id}, inclusion_pct: 70}, {ingredient_id: ${wheat_id}, inclusion_pct: 30}] (rank by price ASC; wheat clamped by min(70, remaining 30); SBM excluded)"
            - "Formula.${f_id}.total_protein_pct == 9.9 (0.7*9 + 0.3*12)"
            - "Formula.${f_id}.provisional_cost_cents_per_ton == 30900 (0.7*30000 + 0.3*33000)"
            - "Formula.${f_id}.meets_constraints == true"

      - name: weighment_per_line_rounding_beats_sum_then_round
        grounds:
          - calculations.weighment_pricing
          - calculations.order_price
          - entities.Weighment.fields.line_cost_cents
          - entities.Batch.fields.ingredient_cost_cents
        distinguishing_aspect: |
          Mode (b): nested rounding order — the scaffold pins round-per-weighment-then-sum. Two corn
          weighments of 0.035t at 30010 c/t round to 1050 each (sum 2100) plus SBM 1560 give batch
          cost 3660; the forbidden sum-then-round alternative yields 3661. One cent of divergence
          separates a conforming implementation from a non-conforming one. Different mode from the
          optimizer instance (mode a).
        test_recipe:
          setup:
            - "Catalog: corn 30010 c/t, SBM 52000 c/t; F-GROW ACTIVE (corn70/SBM30)"
            - "Order of 0.1 tons CONFIRMED; batch target 0.1t in BATCHING (line targets: corn 0.070t, SBM 0.030t)"
          setup_api_calls:
            - { call: "POST /api/ingredients", payload: { code: "CORN", name: "Yellow corn", hazard_class: "STANDARD", crude_protein_pct: 9.0, crude_fiber_pct: 2.2, metabolizable_energy_kcal_kg: 3300 }, as: MillManager, captures: { corn_id: $.data.id } }
            - { call: "POST /api/ingredients", payload: { code: "SBM", name: "Soybean meal", hazard_class: "STANDARD", crude_protein_pct: 44.0, crude_fiber_pct: 7.0, metabolizable_energy_kcal_kg: 2600 }, as: MillManager, captures: { sbm_id: $.data.id } }
            - { call: "POST /api/price-ticks", payload: { ingredient_id: "${corn_id}", price_cents_per_ton: 30010, effective_from: "2026-04-01T00:00:00Z" }, as: MillManager }
            - { call: "POST /api/price-ticks", payload: { ingredient_id: "${sbm_id}", price_cents_per_ton: 52000, effective_from: "2026-04-01T00:00:00Z" }, as: MillManager }
            - { call: "POST /api/formulas", payload: { code: "F-GROW", min_protein_pct: 19.5, max_fiber_pct: 5.0, min_energy_kcal_kg: 3000 }, as: Nutritionist, captures: { f_id: $.data.id, f_v: $.data.version } }
            - { call: "POST /api/formulas/${f_id}/optimize", payload: { expected_formula_version: "${f_v}" }, as: Nutritionist }
            - { call: "POST /api/formulas/${f_id}/activate", payload: {}, as: Nutritionist }
            - { call: "POST /api/customers", payload: { name: "Tiny Trial Co", credit_limit_cents: 1000000 }, as: MillManager, captures: { cust_id: $.data.id, cust_v: $.data.version } }
            - { call: "POST /api/orders", payload: { formula_id: "${f_id}", tons: 0.1, expected_customer_version: "${cust_v}" }, as: Customer, as_user_id: "${cust_id}", captures: { ord_id: $.data.id } }
            - { call: "POST /api/orders/${ord_id}/confirm", payload: {}, as: Customer, as_user_id: "${cust_id}" }
            - { call: "POST /api/employees", payload: { full_name: "Olly Operator", capability: "OPERATOR" }, as: MillManager, captures: { op_id: $.data.id } }
            - { call: "POST /api/lines", payload: { code: "L1" }, as: MillManager, captures: { line_id: $.data.id } }
            - { call: "POST /api/bins", payload: { code: "BIN-C", capacity_tons: 50 }, as: MillManager, captures: { binc_id: $.data.id } }
            - { call: "POST /api/bins/${binc_id}/assign", payload: { ingredient_id: "${corn_id}" }, as: MillManager }
            - { call: "POST /api/bins/${binc_id}/replenish", payload: { tons: 5 }, as: MillManager }
            - { call: "POST /api/bins", payload: { code: "BIN-S", capacity_tons: 50 }, as: MillManager, captures: { bins_id: $.data.id } }
            - { call: "POST /api/bins/${bins_id}/assign", payload: { ingredient_id: "${sbm_id}" }, as: MillManager }
            - { call: "POST /api/bins/${bins_id}/replenish", payload: { tons: 5 }, as: MillManager }
            - { call: "POST /api/batches", payload: { order_id: "${ord_id}", line_id: "${line_id}", target_tons: 0.1, planned_start_at: "2026-05-02T10:00:00Z", planned_end_at: "2026-05-02T11:00:00Z" }, as: MillManager, captures: { bat_id: $.data.id } }
            - { call: "POST /api/batches/${bat_id}/start", payload: {}, as: Operator, as_user_id: "${op_id}" }
          trigger:
            - { call: "POST /api/batches/${bat_id}/weighments", payload: { ingredient_id: "${corn_id}", bin_id: "${binc_id}", actual_tons: 0.035 }, as: Operator, as_user_id: "${op_id}", captures: { w1_id: $.data.id } }
            - { call: "POST /api/batches/${bat_id}/weighments", payload: { ingredient_id: "${corn_id}", bin_id: "${binc_id}", actual_tons: 0.035 }, as: Operator, as_user_id: "${op_id}", captures: { w2_id: $.data.id } }
            - { call: "POST /api/batches/${bat_id}/weighments", payload: { ingredient_id: "${sbm_id}", bin_id: "${bins_id}", actual_tons: 0.030 }, as: Operator, as_user_id: "${op_id}", captures: { w3_id: $.data.id } }
          assert:
            - "Weighment.${w1_id}.line_cost_cents == 1050 (round_half_up(0.035 * 30010) = round_half_up(1050.35))"
            - "Weighment.${w2_id}.line_cost_cents == 1050"
            - "Weighment.${w3_id}.line_cost_cents == 1560"
            - "Batch.${bat_id}.ingredient_cost_cents == 3660 (1050 + 1050 + 1560, per-weighment rounding pinned)"
            - "Batch.${bat_id}.ingredient_cost_cents != 3661 (the forbidden sum-then-round result)"

  - rule_id: non_linear_state_machine
    instances:
      - name: batch_rework_cycle_hold_to_batching_to_mixed
        grounds:
          - state_machines.Batch.MIXED_to_HOLD
          - state_machines.Batch.HOLD_to_BATCHING
          - state_machines.Batch.BATCHING_to_MIXED
        distinguishing_aspect: |
          Batch machine is cyclic: MIXED -> HOLD -> BATCHING -> MIXED (rework loop), reachable twice
          in one lifetime. Different entity from the CustomerOrder revision loop instance.
        test_recipe:
          setup:
            - "Catalog + F-GROW ACTIVE; order 10t CONFIRMED; batch 10t MIXED with corn 7.000 / SBM 3.000"
            - "A FAIL sample (dry-matter protein 17.0 < 19.5) puts the batch on HOLD"
          setup_api_calls:
            - { call: "POST /api/ingredients", payload: { code: "CORN", name: "Yellow corn", hazard_class: "STANDARD", crude_protein_pct: 9.0, crude_fiber_pct: 2.2, metabolizable_energy_kcal_kg: 3300 }, as: MillManager, captures: { corn_id: $.data.id } }
            - { call: "POST /api/ingredients", payload: { code: "SBM", name: "Soybean meal", hazard_class: "STANDARD", crude_protein_pct: 44.0, crude_fiber_pct: 7.0, metabolizable_energy_kcal_kg: 2600 }, as: MillManager, captures: { sbm_id: $.data.id } }
            - { call: "POST /api/price-ticks", payload: { ingredient_id: "${corn_id}", price_cents_per_ton: 30000, effective_from: "2026-04-01T00:00:00Z" }, as: MillManager }
            - { call: "POST /api/price-ticks", payload: { ingredient_id: "${sbm_id}", price_cents_per_ton: 52000, effective_from: "2026-04-01T00:00:00Z" }, as: MillManager }
            - { call: "POST /api/formulas", payload: { code: "F-GROW", min_protein_pct: 19.5, max_fiber_pct: 5.0, min_energy_kcal_kg: 3000 }, as: Nutritionist, captures: { f_id: $.data.id, f_v: $.data.version } }
            - { call: "POST /api/formulas/${f_id}/optimize", payload: { expected_formula_version: "${f_v}" }, as: Nutritionist }
            - { call: "POST /api/formulas/${f_id}/activate", payload: {}, as: Nutritionist }
            - { call: "POST /api/customers", payload: { name: "Acme Farms", credit_limit_cents: 1000000 }, as: MillManager, captures: { cust_id: $.data.id, cust_v: $.data.version } }
            - { call: "POST /api/orders", payload: { formula_id: "${f_id}", tons: 10, expected_customer_version: "${cust_v}" }, as: Customer, as_user_id: "${cust_id}", captures: { ord_id: $.data.id } }
            - { call: "POST /api/orders/${ord_id}/confirm", payload: {}, as: Customer, as_user_id: "${cust_id}" }
            - { call: "POST /api/employees", payload: { full_name: "Olly Operator", capability: "OPERATOR" }, as: MillManager, captures: { op_id: $.data.id } }
            - { call: "POST /api/employees", payload: { full_name: "Quinn Quality", capability: "QUALITY_TECH" }, as: MillManager, captures: { qt_id: $.data.id } }
