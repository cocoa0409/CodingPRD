            - "IncidentReport.${inc_id}.escalation_level == 2"
            - "IncidentReport.${inc_id}.escalated_by_user_id == 'sup-b'"
            - "IncidentReport.${inc_id}.closed_by_user_id == 'sup-a'"
            - "IncidentReport.${inc_id}.resolution_note == 'Both parties removed; police report filed.'"

      - name: guard_employment_and_license_dimensions_evolve_independently
        grounds:
          - state_machines.Guard.employment_status=ACTIVE_to_employment_status=SUSPENDED
          - state_machines.Guard.employment_status=SUSPENDED_to_employment_status=ACTIVE
          - state_machines.Guard.license_status=LICENSED_to_license_status=EXPIRED
          - entities.Guard.fields.employment_status
          - entities.Guard.fields.license_status
          - calculations.guard_license_status
        distinguishing_aspect: |
          Non-linear shape on Guard (a different entity from IncidentReport): two PARALLEL state dimensions on
          one row — a SUSPEND leaves license_status == LICENSED untouched, a compliance sweep flips license_status
          to EXPIRED while employment_status stays SUSPENDED, and REINSTATE returns employment_status to ACTIVE
          while license_status remains EXPIRED.
        test_recipe:
          setup:
            - "Guard Rex is ACTIVE and LICENSED; his LICENSE credential expires 2026-05-10T00:00:00Z."
            - "Logical clock at 2026-05-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /guards"
              payload: { full_name: "Rex Cole", employee_code: "G-040", pay_rate_cents_per_hour: 2200 }
              as: ComplianceOfficer
              captures: { guard_id: $.data.id }
            - call: "POST /credentials"
              payload: { guard_id: "${guard_id}", kind: "LICENSE", code: "GUARD_CARD", credential_number: "L-040", expires_at: "2026-05-10T00:00:00Z" }
              as: ComplianceOfficer
              captures: { lic_id: $.data.id }
            - call: "POST /credentials/${lic_id}/verify"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /guards/${guard_id}/status"
              payload: { action: "ACTIVATE" }
              as: ComplianceOfficer
          trigger:
            - call: "POST /guards/${guard_id}/status"
              payload: { action: "SUSPEND" }
              as: ComplianceOfficer
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-11T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /compliance-sweeps"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /guards/${guard_id}/status"
              payload: { action: "REINSTATE" }
              as: ComplianceOfficer
          assert:
            - "After SUSPEND: Guard.${guard_id}.employment_status == SUSPENDED and Guard.${guard_id}.license_status == LICENSED"
            - "After compliance sweep: Guard.${guard_id}.license_status == EXPIRED and Guard.${guard_id}.employment_status == SUSPENDED"
            - "After REINSTATE: Guard.${guard_id}.employment_status == ACTIVE and Guard.${guard_id}.license_status == EXPIRED"
            - "Credential.${lic_id}.status == EXPIRED"

  # =========================================================================
  # Rule 4 — Transitive cascade chains from different triggers
  # =========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: license_expiry_sweep_cascades_to_site_at_risk
        grounds:
          - state_machines.Guard.license_status=LICENSED_to_license_status=EXPIRED
          - calculations.guard_license_status
          - calculations.guard_committed_hours
          - calculations.site_coverage_status
          - entities.Site.fields.coverage_status
        distinguishing_aspect: |
          Depth-4 cascade triggered by POST /compliance-sweeps: (1) Credential VERIFIED→EXPIRED causes
          (2) Guard.license_status→EXPIRED, which causes (3) the guard's future SCHEDULED shift to be released
          to OPEN_UNFILLED with committed_hours→0.0, which causes (4) Site.coverage_status→AT_RISK. Each hop is
          caused by the previous hop, not by the sweep call itself.
        test_recipe:
          setup:
            - "Guard Kim is ACTIVE and LICENSED with a LICENSE expiring 2026-05-10T00:00:00Z."
            - "A shift on 2026-05-12T08:00Z→16:00Z (break 30, scheduled_hours 7.5) is SCHEDULED to Kim; Guard.committed_hours == 7.5; Site.coverage_status == COVERED."
            - "The logical clock has been advanced to 2026-05-11T00:00:00Z (past the licence expiry, 32h before the shift starts) but no sweep has run yet, so license_status is still LICENSED."
