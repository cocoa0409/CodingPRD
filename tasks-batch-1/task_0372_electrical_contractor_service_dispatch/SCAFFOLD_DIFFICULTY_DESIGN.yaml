              as: Dispatcher
              captures: { job_id: $.data.id, job_v0: $.data.version }
            - call: "POST /v1/estimates"
              payload: { job_id: "${job_id}", pricing_mode: "FLAT_RATE", expected_job_version: "${job_v0}", flat_rate_cents: 10000 }
              as: Dispatcher
              captures: { est_id: $.data.id }
            - call: "POST /v1/estimates/${est_id}/send"
              payload: {}
              as: Dispatcher
            - call: "POST /v1/estimates/${est_id}/accept"
              payload: {}
              as: Customer
              as_user_id: "${cust_id}"
            - call: "GET /v1/service-jobs/${job_id}"
              payload: {}
              as: Dispatcher
              captures: { job_vacc: $.data.version }
            - call: "POST /v1/dispatches"
              payload: { job_id: "${job_id}", technician_id: "${tech_id}", window_start: "2026-07-15T09:00:00Z", window_end: "2026-07-15T10:00:00Z", expected_job_version: "${job_vacc}" }
              as: Dispatcher
              captures: { disp_id: $.data.id }
            - call: "POST /v1/dispatches/${disp_id}/depart"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /v1/dispatches/${disp_id}/arrive"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /v1/service-jobs/${job_id}/complete"
              payload: {}
              as: Technician
              as_user_id: "${tech_id}"
            - call: "POST /v1/service-jobs/${job_id}/invoice"
              payload: {}
              as: Dispatcher
            - call: "POST /v1/callbacks"
              payload: { job_id: "${job_id}", reason: "loose ground" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { cb_id: $.data.id }
          trigger:
            - call: "POST /v1/callbacks/${cb_id}/resolve"
              payload: {}
              as: Dispatcher
              captures: { err: $.data.error_id }
          assert:
            - "Callback.${cb_id}.status == OPEN (resolve rejected, unchanged)"
            - "ServiceJob.${job_id}.status == WARRANTY (parent not yet back in COMPLETED/INVOICED)"
            - "HTTP status == 409"
            - "data.error_id == ERR_INVALID_STATE"

