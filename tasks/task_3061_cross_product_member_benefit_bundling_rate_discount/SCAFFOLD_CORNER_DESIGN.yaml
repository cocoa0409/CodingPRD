              payload: { member_id: "${l006_id}" }
              as: PlatformAdmin
          assert:
            - "the closed holding is still returned by the default list with adoption_status CLOSED and closed_at set"
            - "there is no DELETE endpoint for /benefits/holdings/{holding_id}, so the row is never removed"
            - "GET /benefits/holdings?member_id=${l006_id}&adoption_status=CLOSED returns exactly 1 row"
            - "Member.${l006_id}.product_adoption_count == 0, so the closed row is excluded from the derived count while remaining queryable"

  # ===========================================================================
  - section: consistency_model
    instances:

      - name: read_side_recomputation_makes_eventual_rollups_visible_without_a_write
