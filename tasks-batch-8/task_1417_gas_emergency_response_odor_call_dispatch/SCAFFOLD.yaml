scenario: |
  Gas Emergency Response & Odor Call Dispatch (gas utility emergency response): call intake & priority classification, response-time clock & first-responder coordination, atmospheric reading & make-safe action, shutoff & customer premise entry, follow-up leak repair work order, inside-vs-outside responsibility determination, regulatory response-time reporting, media/public-safety notification

domain_name: gas-emergency-response
api_prefix: /gas-ops

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - derived_field_reconciliation
  entity_topology: hybrid
  state_machine_shape: parallel   # GasIncident lifecycle_status x entry_status; cyclic loops on GasIncident/RegulatoryReport/RepairWorkOrder
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED — EMIT VERBATIM)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
# Logical clock: every timestamp the server stamps (created_at, received_at,
# dispatched_at, arrived_at, pause boundaries, report periods, shift windows)
# reads the logical clock. The logical clock defaults to 2026-08-01T00:00:00Z
# at server startup and is advanced only via POST /_clock/set_current_utc.
entities:
  - name: ServiceTerritory
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Territory display name" }
      - { name: p1_threshold_minutes, type: integer, source: input, description: "SLA response threshold for P1 incidents; breach iff adjusted_elapsed_seconds > p1_threshold_minutes*60" }
      - { name: p2_threshold_minutes, type: integer, source: input, description: "SLA response threshold for P2 incidents" }
      - { name: p3_threshold_minutes, type: integer, source: input, description: "SLA response threshold for P3 incidents" }
      - { name: p4_threshold_minutes, type: integer, source: input, description: "SLA response threshold for P4 incidents" }
      - { name: recurrence_window_hours, type: integer, source: input, description: "A new call for a normalized address whose last incident closed within [closed_at, closed_at + recurrence_window_hours) reopens that incident; at exactly closed_at + window a NEW incident is created (half-open)" }
      - { name: repair_budget_cap_cents, type: integer, source: input, description: "Cap on repair_reserved_cents; scheduling a work order that would push reserved over the cap is rejected" }
      - { name: repair_reserved_cents, type: integer, source: computed, default: 0, description: "Sum of current_estimate_cents over RepairWorkOrders of this territory in status SCHEDULED, IN_PROGRESS, ON_HOLD (OPEN work orders are not yet reserved)" }

  - name: FieldTechnician
    parent: null
    common_fields: true
    fields:
      - { name: full_name, type: string, source: input, description: "Technician full name" }
      - { name: badge_number, type: string, source: input, description: "Unique badge number" }
      - { name: home_territory_id, type: string, source: input, description: "FK -> ServiceTerritory.id; technician's home territory" }
      - { name: hourly_rate_cents, type: integer, source: input, description: "Labor hourly rate in cents" }
      - { name: is_active, type: boolean, source: input, default: true, description: "Inactive technicians cannot be dispatched" }
      - { name: on_shift, type: boolean, source: computed, description: "true iff current logical-clock time falls inside any TechnicianShift [shift_start, shift_end) of this technician" }
      - { name: active_assignment_count, type: integer, source: computed, default: 0, description: "Count of DispatchAssignments for this technician in status EN_ROUTE or ON_SCENE" }
      - { name: weighted_load, type: integer, source: computed, default: 0, description: "Sum over active assignments of urgency weight of the assignment incident's current priority: P1=4, P2=3, P3=2, P4=1" }
      - { name: last_cleared_at, type: datetime, source: computed, description: "cleared_at of this technician's most recent CLEARED assignment; null if never cleared" }

  - name: TechnicianShift
    parent: FieldTechnician
    common_fields: false
    fields:
      - { name: technician_id, type: string, source: input, description: "FK -> FieldTechnician.id; shift owner" }
      - { name: shift_start, type: datetime, source: input, description: "Shift start (inclusive); half-open interval [shift_start, shift_end)" }
      - { name: shift_end, type: datetime, source: input, description: "Shift end (exclusive); must be strictly after shift_start" }

  - name: RepairCrew
    parent: null
    common_fields: true
    fields:
      - { name: crew_code, type: string, source: input, description: "Unique crew code" }
      - { name: territory_id, type: string, source: input, description: "FK -> ServiceTerritory.id; crew's operating territory" }
      - { name: hourly_rate_cents, type: integer, source: input, description: "Crew hourly billing rate in cents" }
      - { name: is_active, type: boolean, source: input, default: true, description: "Inactive crews cannot be scheduled" }

  - name: EmergencyCall
    parent: null
    common_fields: false
    fields:
      - { name: caller_name, type: string, source: input, description: "Caller name" }
      - { name: caller_phone, type: string, source: input, description: "Caller phone" }
      - { name: address_line, type: string, source: input, description: "Street address of the reported odor/leak" }
      - { name: city, type: string, source: input, description: "City of the reported location" }
      - { name: territory_id, type: string, source: input, description: "FK -> ServiceTerritory.id; territory covering the address" }
      - { name: location_context, type: enum, source: input, description: "INSIDE_STRUCTURE | OUTSIDE_STRUCTURE | METER_AREA | PUBLIC_SPACE | UNKNOWN" }
      - { name: occupancy_type, type: enum, source: input, default: SINGLE_FAMILY, description: "SINGLE_FAMILY | MULTI_FAMILY | PUBLIC_ASSEMBLY | SCHOOL | HOSPITAL" }
      - { name: odor_reported, type: boolean, source: input, description: "Caller reports gas odor" }
      - { name: symptoms_reported, type: boolean, source: input, description: "Caller reports illness symptoms" }
      - { name: hissing_reported, type: boolean, source: input, description: "Caller reports hissing sound" }
      - { name: implied_priority, type: enum, source: computed, description: "P1 if symptoms_reported; else P2 if odor_reported and location_context==INSIDE_STRUCTURE; else P3 if odor_reported; else P4" }
      - { name: classification, type: enum, source: system, description: "PRIMARY (spawned new incident) | DUPLICATE (linked to non-terminal incident at same normalized address) | RECURRENCE (reopened a CLOSED incident within recurrence window)" }
      - { name: is_duplicate, type: boolean, source: system, description: "true iff classification==DUPLICATE" }
      - { name: incident_id, type: string, source: system, description: "FK -> GasIncident.id; incident this call is linked to" }
      - { name: received_at, type: datetime, source: system, description: "Logical-clock timestamp at call intake" }

  - name: GasIncident
    parent: null
    common_fields: true
    fields:
      - { name: territory_id, type: string, source: system, description: "FK -> ServiceTerritory.id; from the primary call" }
      - { name: normalized_address, type: string, source: computed, description: "upper(trim(address_line)) + '|' + upper(trim(city)) + '|' + territory_id; dedup/recurrence match key" }
      - { name: occupancy_type, type: enum, source: system, description: "Copied from the primary call" }
      - { name: lifecycle_status, type: enum, source: system, description: "NEW | TRIAGED | DISPATCHED | ON_SCENE | MAKE_SAFE_IN_PROGRESS | MONITORING | CLOSED | REOPENED | MERGED" }
      - { name: entry_status, type: enum, source: system, default: NOT_REQUIRED, description: "Parallel dimension: NOT_REQUIRED | AWAITING_AUTHORIZATION | AUTHORIZED | FORCED | REFUSED" }
      - { name: priority, type: enum, source: system, description: "P1 | P2 | P3 | P4; initialized to primary call implied_priority, changed by triage/reclassify/auto-escalation (auto-escalation only raises)" }
      - { name: severity_score, type: integer, source: computed, default: 0, description: "0-100 weighted score per incident_severity_score calculation; recomputed on every AtmosphericReading creation and on duplicate-call escalation" }
      - { name: linked_call_count, type: integer, source: computed, default: 1, description: "Number of EmergencyCalls linked to this incident (PRIMARY + DUPLICATEs + RECURRENCEs)" }
      - { name: reopen_count, type: integer, source: computed, default: 0, description: "Number of CLOSED -> REOPENED transitions" }
      - { name: response_clock_started_at, type: datetime, source: system, description: "Logical time of the PRIMARY call; reset to the RECURRENCE call time on reopen" }
      - { name: first_arrival_at, type: datetime, source: system, description: "Logical time of the first DispatchAssignment arrival in the current response segment; null until arrival; reset to null on reopen" }
      - { name: prior_segment_adjusted_seconds, type: integer, source: computed, default: 0, description: "adjusted_elapsed_seconds of the previous response segment, archived on reopen" }
      - { name: pause_total_seconds, type: integer, source: computed, default: 0, description: "Sum of CLOSED ResponseClockPause durations [started_at, ended_at) for the current segment; an OPEN pause contributes (now - started_at) at read time" }
      - { name: raw_elapsed_seconds, type: integer, source: computed, description: "(first_arrival_at or now) - response_clock_started_at, in seconds, ignoring pauses" }
      - { name: adjusted_elapsed_seconds, type: integer, source: computed, description: "raw_elapsed_seconds - pause_total_seconds, floored at 0" }
      - { name: threshold_minutes, type: integer, source: computed, description: "Territory threshold for the incident's CURRENT priority (dynamic: follows reclassification)" }
      - { name: breach_class, type: enum, source: computed, description: "NONE | RESPONDED_LATE | NO_RESPONSE; NONE iff adjusted_elapsed_seconds <= threshold_minutes*60; RESPONDED_LATE iff first_arrival_at set and adjusted > threshold; NO_RESPONSE iff no arrival yet and adjusted > threshold" }
      - { name: awaiting_dispatch, type: boolean, source: computed, default: false, description: "true when lifecycle_status==DISPATCHED and no active (EN_ROUTE/ON_SCENE) assignment exists (set by preemption)" }
      - { name: evacuation_required, type: boolean, source: computed, default: false, description: "true iff any AtmosphericReading on this incident has pct_lel >= 10.0" }
      - { name: make_safe_completed, type: boolean, source: system, default: false, description: "Set by POST .../make-safe/complete" }
      - { name: leak_confirmed, type: boolean, source: system, default: false, description: "Set by POST .../make-safe/complete input leak_confirmed" }
      - { name: gas_flow_stopped, type: boolean, source: computed, default: false, description: "true iff any ShutoffOrder on this incident is in EXECUTED or RESTORED" }
      - { name: responsibility, type: enum, source: computed, description: "Responsibility of the current FINAL ResponsibilityDetermination (INSIDE_CUSTOMER | OUTSIDE_COMPANY | SHARED); null when no FINAL determination" }
      - { name: customer_referral_required, type: boolean, source: computed, default: false, description: "true when responsibility resolves to INSIDE_CUSTOMER" }
      - { name: auto_notification_created, type: boolean, source: system, default: false, description: "Idempotence flag: at most one auto PublicNotification per incident" }
      - { name: closed_at, type: datetime, source: system, description: "Logical time of the most recent CLOSED transition; null while not closed" }

  - name: DispatchAssignment
    parent: GasIncident
    common_fields: true
    fields:
      - { name: incident_id, type: string, source: system, description: "FK -> GasIncident.id" }
      - { name: technician_id, type: string, source: system, description: "FK -> FieldTechnician.id; request-supplied or selector-chosen" }
      - { name: status, type: enum, source: system, description: "EN_ROUTE | ON_SCENE | CLEARED | PREEMPTED | CANCELLED" }
      - { name: sla_threshold_minutes, type: integer, source: system, description: "Incident threshold_minutes snapshot at dispatch time (informational; breach verdicts always use the incident's current threshold)" }
      - { name: dispatched_at, type: datetime, source: system, description: "Logical time of creation (assignment starts EN_ROUTE)" }
      - { name: arrived_at, type: datetime, source: system, description: "Logical time of arrive; null until arrived" }
      - { name: cleared_at, type: datetime, source: system, description: "Logical time of clear; null until cleared" }
      - { name: preempt_reason, type: string, source: input, description: "Reason recorded on preemption" }
      - { name: notes, type: string, source: input, description: "Dispatcher notes" }

  - name: ResponseClockPause
    parent: GasIncident
    common_fields: true
    fields:
      - { name: incident_id, type: string, source: system, description: "FK -> GasIncident.id" }
      - { name: reason, type: enum, source: input, description: "CUSTOMER_NOT_HOME | ACCESS_BLOCKED" }
      - { name: started_at, type: datetime, source: system, description: "Logical time at pause creation (inclusive)" }
      - { name: ended_at, type: datetime, source: system, description: "Logical time at pause end (exclusive); null while OPEN" }
      - { name: status, type: enum, source: computed, description: "OPEN | CLOSED" }
      - { name: duration_seconds, type: integer, source: computed, description: "ended_at - started_at for CLOSED pauses; (now - started_at) for OPEN at read time" }

  - name: AtmosphericReading
    parent: GasIncident
    common_fields: false
    fields:
      - { name: incident_id, type: string, source: system, description: "FK -> GasIncident.id" }
      - { name: technician_id, type: string, source: system, description: "FK -> FieldTechnician.id; recording technician (acting user)" }
      - { name: pct_lel, type: number, source: input, description: "Percent of lower explosive limit, 0.0-100.0, one decimal" }
      - { name: co_ppm, type: number, source: input, description: "Carbon monoxide reading in ppm, >= 0" }
      - { name: reading_context, type: enum, source: input, description: "INSIDE | OUTSIDE | CONFINED_SPACE" }
      - { name: taken_at, type: datetime, source: system, description: "Logical time at recording" }

  - name: MakeSafeAction
    parent: GasIncident
    common_fields: false
    fields:
      - { name: incident_id, type: string, source: system, description: "FK -> GasIncident.id" }
      - { name: technician_id, type: string, source: system, description: "FK -> FieldTechnician.id; acting technician" }
      - { name: action_type, type: enum, source: input, description: "VENTILATE | SHUT_APPLIANCE_VALVE | EVACUATE | SECURE_AREA | OTHER" }
      - { name: notes, type: string, source: input, description: "Free-text notes" }
      - { name: performed_at, type: datetime, source: system, description: "Logical time at recording" }

  - name: PremiseEntryAuthorization
    parent: GasIncident
    common_fields: false
    fields:
      - { name: incident_id, type: string, source: system, description: "FK -> GasIncident.id" }
      - { name: method, type: enum, source: input, description: "CUSTOMER_CONSENT | EMERGENCY_FORCED | WARRANT; EMERGENCY_FORCED and WARRANT require Supervisor actor" }
      - { name: authorized_by_name, type: string, source: input, description: "Name of the person/warrant authorizing entry" }
      - { name: recorded_by_user_id, type: string, source: system, description: "X-User-ID of the recorder (opaque actor stamp, not an FK)" }

  - name: ShutoffOrder
    parent: GasIncident
    common_fields: true
    fields:
      - { name: incident_id, type: string, source: system, description: "FK -> GasIncident.id" }
      - { name: scope, type: enum, source: input, description: "METER | APPLIANCE | SERVICE_LINE" }
      - { name: entry_required, type: boolean, source: input, description: "true when execution requires premise entry" }
      - { name: reason, type: string, source: input, description: "Reason for shutoff" }
      - { name: status, type: enum, source: system, description: "REQUESTED | AUTHORIZED | DECLINED | EXECUTED | RESTORED" }
      - { name: requested_by_user_id, type: string, source: system, description: "X-User-ID of requester (actor stamp, not an FK)" }
      - { name: authorized_by_user_id, type: string, source: system, description: "X-User-ID of authorizing Supervisor; null until authorized" }
      - { name: executed_by_technician_id, type: string, source: system, description: "Technician id who executed; null until executed" }
      - { name: executed_at, type: datetime, source: system, description: "Logical time of execution; null until executed" }
      - { name: restored_at, type: datetime, source: system, description: "Logical time of restoration; null until restored" }

  - name: ResponsibilityDetermination
    parent: GasIncident
    common_fields: true
    fields:
      - { name: incident_id, type: string, source: system, description: "FK -> GasIncident.id" }
      - { name: responsibility, type: enum, source: input, description: "INSIDE_CUSTOMER | OUTSIDE_COMPANY | SHARED" }
      - { name: basis, type: enum, source: input, description: "METER_LOCATION | BARHOLE_SURVEY | CUSTOMER_APPLIANCE_TRACE | EXCAVATION" }
      - { name: notes, type: string, source: input, description: "Free-text basis notes" }
      - { name: status, type: enum, source: system, description: "DRAFT | FINAL | SUPERSEDED" }
      - { name: drafted_by_user_id, type: string, source: system, description: "X-User-ID of the Supervisor who created the draft (actor stamp, not an FK)" }
      - { name: finalized_by_user_id, type: string, source: system, description: "X-User-ID of the Supervisor who finalized; must differ from drafted_by_user_id; null until finalized" }
      - { name: finalized_at, type: datetime, source: system, description: "Logical time of finalization; null until final" }

  - name: RepairWorkOrder
    parent: GasIncident
    common_fields: true
    fields:
      - { name: incident_id, type: string, source: system, description: "FK -> GasIncident.id" }
      - { name: origin, type: enum, source: system, description: "AUTO_DETERMINATION (created by responsibility finalization) | MANUAL (created by Supervisor)" }
      - { name: status, type: enum, source: system, description: "OPEN | SCHEDULED | IN_PROGRESS | ON_HOLD | COMPLETED | CANCELLED" }
      - { name: crew_id, type: string, source: system, description: "FK -> RepairCrew.id; null until scheduled" }
      - { name: provisional_estimate_cents, type: integer, source: computed, description: "Creation-time estimate from the (responsibility-at-creation x incident priority) matrix; UNDETERMINED row applies when no FINAL determination exists at creation" }
      - { name: current_estimate_cents, type: integer, source: computed, description: "final_cost_cents when COMPLETED, else provisional_estimate_cents; this is the value counted in territory repair_reserved_cents while non-terminal" }
      - { name: scheduled_window_start, type: datetime, source: input, description: "Planned crew arrival window start; null until scheduled" }
      - { name: scheduled_window_end, type: datetime, source: input, description: "Planned crew departure; must be after window start" }
      - { name: lines, type: array, source: input, description: "Completion parts lines: [{ description, quantity, unit_price_cents, discount_pct }]; discount_pct in [0,1)" }
      - { name: labor_minutes, type: integer, source: input, description: "Actual labor minutes reported at completion" }
      - { name: labor_billed_minutes, type: integer, source: computed, description: "labor_minutes rounded UP to the next multiple of 15 (15 stays 15)" }
      - { name: final_cost_cents, type: integer, source: computed, description: "Sum of per-line rounded totals + rounded labor cost; see repair_cost_final" }
      - { name: completed_at, type: datetime, source: system, description: "Logical completion time; null until completed" }
      - { name: cancel_reason, type: string, source: input, description: "Reason recorded on cancel" }

  - name: RegulatoryReport
    parent: null
    common_fields: true
    fields:
      - { name: territory_id, type: string, source: input, description: "FK -> ServiceTerritory.id" }
      - { name: period_start, type: datetime, source: input, description: "Report period start (inclusive); half-open [period_start, period_end)" }
      - { name: period_end, type: datetime, source: input, description: "Report period end (exclusive); must be after period_start" }
      - { name: status, type: enum, source: system, description: "DRAFT | SUBMITTED | ACCEPTED | REJECTED" }
      - { name: generated_at, type: datetime, source: system, description: "Logical time the snapshot was (re)computed" }
      - { name: submitted_at, type: datetime, source: system, description: "Logical time of submission; null until submitted" }
      - { name: incident_count, type: integer, source: computed, description: "Incidents of the territory with response_clock_started_at in [period_start, period_end), excluding MERGED incidents" }
      - { name: determined_count, type: integer, source: computed, description: "Included incidents whose outcome is determined at generation time: first_arrival_at set OR adjusted_elapsed_seconds > threshold" }
      - { name: pending_count, type: integer, source: computed, description: "incident_count - determined_count" }
      - { name: compliant_count_raw, type: integer, source: computed, description: "Determined incidents compliant under the RAW elapsed variant" }
      - { name: compliant_count_adjusted, type: integer, source: computed, description: "Determined incidents compliant under the ADJUSTED (pause-subtracted) variant" }
      - { name: compliance_rate_raw, type: number, source: computed, description: "compliant_count_raw / determined_count; null when determined_count == 0" }
      - { name: compliance_rate_adjusted, type: number, source: computed, description: "compliant_count_adjusted / determined_count; null when determined_count == 0" }
      - { name: needs_regeneration, type: boolean, source: computed, default: false, description: "true when a covered incident (or a new incident in the period) changed after this DRAFT was generated; cleared on regenerate; never set on SUBMITTED/ACCEPTED reports" }
      - { name: regeneration_count, type: integer, source: computed, default: 0, description: "Number of regenerations" }
      - { name: reject_reason, type: string, source: input, description: "Regulator's rejection reason" }
      - { name: stats, type: object, source: computed, description: "Per-priority breakdown { P1: {total, determined, compliant_raw, compliant_adjusted}, ... } for audit detail" }

  - name: PublicNotification
    parent: GasIncident
    common_fields: true
    fields:
      - { name: incident_id, type: string, source: system, description: "FK -> GasIncident.id" }
      - { name: channel, type: enum, source: input, description: "MEDIA | PUBLIC_ALERT | AGENCY_NOTICE" }
      - { name: headline, type: string, source: input, description: "Notification headline" }
      - { name: body, type: string, source: input, description: "Notification body" }
      - { name: origin, type: enum, source: system, description: "MANUAL | AUTO_PRIORITY (incident reached P1) | AUTO_SEVERITY (severity_score >= 80)" }
      - { name: status, type: enum, source: system, description: "DRAFT | ISSUED | RETRACTED | DISCARDED" }
      - { name: issued_at, type: datetime, source: system, description: "Logical time issued; null until issued" }
      - { name: retracted_at, type: datetime, source: system, description: "Logical time retracted; null until retracted" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
# GasIncident carries TWO parallel state dimensions that evolve independently:
# lifecycle_status (NEW->TRIAGED->DISPATCHED->ON_SCENE->MAKE_SAFE_IN_PROGRESS->
# MONITORING->CLOSED, with the CLOSED->REOPENED->TRIAGED recurrence cycle and the
# MERGED terminal state) and entry_status (NOT_REQUIRED<->AWAITING_AUTHORIZATION
# ->AUTHORIZED|FORCED|REFUSED). Transitions on one dimension never change the
# other except where a side_effect says so explicitly.
state_machines:
  - entity: GasIncident
    initial_state: NEW
    terminal_states: [MERGED]
    transitions:
      - from: NEW
        to: TRIAGED
        trigger: "POST /gas-ops/incidents/{incidentId}/triage"
        actor: Dispatcher | Supervisor
        preconditions:
          - "lifecycle_status in {NEW, REOPENED} (else ERR_INCIDENT_NOT_ACTIVE 409 with state conflict)"
        side_effects:
          - "priority := input priority; incident.version increments"
          - "If priority == P1 and auto_notification_created == false: auto-create PublicNotification (origin AUTO_PRIORITY, channel PUBLIC_ALERT, status DRAFT); auto_notification_created := true"
          - "Any DRAFT or REJECTED RegulatoryReport covering response_clock_started_at gets needs_regeneration := true"
      - from: REOPENED
        to: TRIAGED
        trigger: "POST /gas-ops/incidents/{incidentId}/triage"
        actor: Dispatcher | Supervisor
        preconditions:
          - "lifecycle_status in {NEW, REOPENED}"
        side_effects:
          - "Same side effects as NEW -> TRIAGED"
      - from: TRIAGED
        to: DISPATCHED
        trigger: "system (automatic on first DispatchAssignment creation for the incident)"
        actor: system
        preconditions: []
        side_effects:
          - "incident.version increments"
      - from: DISPATCHED
        to: ON_SCENE
        trigger: "system (automatic on first DispatchAssignment arrival in the current response segment)"
        actor: system
        preconditions: []
        side_effects:
          - "first_arrival_at := arrival logical time; response clock stops for this segment"
          - "Any OPEN ResponseClockPause is auto-closed with ended_at := arrived_at"
          - "breach_class recomputed (RESPONDED_LATE iff adjusted_elapsed_seconds > threshold_minutes*60)"
      - from: ON_SCENE
        to: MAKE_SAFE_IN_PROGRESS
        trigger: "system (automatic on first MakeSafeAction creation)"
        actor: system
        preconditions: []
        side_effects: []
      - from: MAKE_SAFE_IN_PROGRESS
        to: MONITORING
        trigger: "POST /gas-ops/incidents/{incidentId}/make-safe/complete"
        actor: FieldTechnician
        preconditions:
          - "lifecycle_status in {ON_SCENE, MAKE_SAFE_IN_PROGRESS} (else ERR_INCIDENT_NOT_ACTIVE 409)"
          - "If any linked EmergencyCall has odor_reported == true and no AtmosphericReading exists for the incident: ERR_ATMOSPHERIC_READING_REQUIRED 422"
          - "If evacuation_required == true and no MakeSafeAction with action_type == EVACUATE exists: ERR_MAKE_SAFE_NOT_COMPLETED 422"
        side_effects:
          - "make_safe_completed := true; leak_confirmed := input leak_confirmed"
          - "incident.version increments; DRAFT/REJECTED covering reports marked needs_regeneration"
      - from: ON_SCENE
        to: MONITORING
        trigger: "POST /gas-ops/incidents/{incidentId}/make-safe/complete with no_make_safe_required=true"
        actor: FieldTechnician
        preconditions:
          - "Same preconditions as MAKE_SAFE_IN_PROGRESS -> MONITORING (reading requirement still applies when odor reported)"
        side_effects:
          - "Same side effects as MAKE_SAFE_IN_PROGRESS -> MONITORING"
      - from: MONITORING
        to: CLOSED
        trigger: "POST /gas-ops/incidents/{incidentId}/close"
        actor: Supervisor
        preconditions:
          - "lifecycle_status == MONITORING (else ERR_INCIDENT_NOT_ACTIVE 409)"
          - "make_safe_completed == true (else ERR_MAKE_SAFE_NOT_COMPLETED 422)"
          - "If leak_confirmed == true: a ResponsibilityDetermination with status FINAL exists (else ERR_DETERMINATION_REQUIRED 422)"
          - "No DispatchAssignment in EN_ROUTE or ON_SCENE (else ERR_OPEN_DISPATCHES_EXIST 409)"
          - "No ShutoffOrder in REQUESTED or AUTHORIZED (else ERR_OPEN_SHUTOFF_ORDER 409)"
        side_effects:
          - "closed_at := now; incident.version increments"
          - "DRAFT/REJECTED covering reports marked needs_regeneration"
      - from: CLOSED
        to: REOPENED
        trigger: "system (automatic on a RECURRENCE EmergencyCall: same normalized_address, closed_at within [closed_at, closed_at + territory.recurrence_window_hours))"
        actor: system
        preconditions: []
        side_effects:
          - "reopen_count += 1; linked_call_count += 1"
          - "prior_segment_adjusted_seconds := adjusted_elapsed_seconds of the closed segment"
          - "response_clock_started_at := recurrence call received_at; first_arrival_at := null; pause_total_seconds := 0; breach_class recomputed (NONE)"
          - "make_safe_completed := false; entry_status := NOT_REQUIRED"
          - "incident.version increments; DRAFT/REJECTED covering reports marked needs_regeneration"
      - from: NEW
        to: MERGED
        trigger: "POST /gas-ops/incidents/{incidentId}/merge-duplicate (this incident is the merge SOURCE)"
        actor: Supervisor
        preconditions:
          - "Source lifecycle_status in {NEW, TRIAGED, DISPATCHED} (else ERR_INVALID_STATE 409)"
          - "Target incident exists, is not MERGED/CLOSED, is a different incident, and shares the source's normalized_address (else ERR_MERGE_TARGET_INVALID 409)"
        side_effects:
          - "All EmergencyCalls of the source are re-linked to the target; target.linked_call_count += source.linked_call_count"
          - "Target.priority := max(target.priority, source.priority) (P1 highest); if raised, target breach re-evaluated and target auto-notification rule applies"
          - "Source closed out as MERGED; source.version increments; target.version increments"
      - from: TRIAGED
        to: MERGED
        trigger: "POST /gas-ops/incidents/{incidentId}/merge-duplicate (source side)"
        actor: Supervisor
        preconditions: ["Same as NEW -> MERGED"]
        side_effects: ["Same as NEW -> MERGED"]
      - from: DISPATCHED
        to: MERGED
        trigger: "POST /gas-ops/incidents/{incidentId}/merge-duplicate (source side)"
        actor: Supervisor
        preconditions:
          - "Same as NEW -> MERGED, plus: no DispatchAssignment in EN_ROUTE or ON_SCENE (else ERR_OPEN_DISPATCHES_EXIST 409)"
        side_effects: ["Same as NEW -> MERGED"]
      - from: NOT_REQUIRED
        to: AWAITING_AUTHORIZATION
        trigger: "POST /gas-ops/incidents/{incidentId}/entry-status with to_status=AWAITING_AUTHORIZATION"
        actor: FieldTechnician | Supervisor
        preconditions:
          - "lifecycle_status in {ON_SCENE, MAKE_SAFE_IN_PROGRESS, MONITORING} (else ERR_INCIDENT_NOT_ACTIVE 409)"
          - "entry_status in {NOT_REQUIRED, REFUSED}"
        side_effects: ["incident.version increments"]
      - from: REFUSED
        to: AWAITING_AUTHORIZATION
        trigger: "POST /gas-ops/incidents/{incidentId}/entry-status with to_status=AWAITING_AUTHORIZATION"
        actor: FieldTechnician | Supervisor
        preconditions: ["Same as NOT_REQUIRED -> AWAITING_AUTHORIZATION"]
        side_effects: ["incident.version increments"]
      - from: AWAITING_AUTHORIZATION
        to: AUTHORIZED
        trigger: "POST /gas-ops/incidents/{incidentId}/premise-entry-authorizations with method=CUSTOMER_CONSENT"
        actor: Dispatcher | Supervisor
        preconditions: ["entry_status == AWAITING_AUTHORIZATION (else ERR_INVALID_STATE 409)"]
        side_effects: ["incident.version increments"]
      - from: AWAITING_AUTHORIZATION
        to: FORCED
        trigger: "POST /gas-ops/incidents/{incidentId}/premise-entry-authorizations with method=EMERGENCY_FORCED or WARRANT"
        actor: Supervisor
        preconditions: ["entry_status == AWAITING_AUTHORIZATION (else ERR_INVALID_STATE 409)"]
        side_effects: ["incident.version increments"]
      - from: AWAITING_AUTHORIZATION
        to: REFUSED
        trigger: "POST /gas-ops/incidents/{incidentId}/entry-status with to_status=REFUSED"
        actor: FieldTechnician | Supervisor
        preconditions: ["entry_status == AWAITING_AUTHORIZATION"]
        side_effects: ["incident.version increments"]
      - from: AUTHORIZED
        to: NOT_REQUIRED
        trigger: "system (automatic on incident close)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: DispatchAssignment
    initial_state: EN_ROUTE
    terminal_states: [CLEARED, PREEMPTED, CANCELLED]
    transitions:
      - from: EN_ROUTE
        to: ON_SCENE
        trigger: "POST /gas-ops/dispatches/{dispatchId}/arrive"
        actor: FieldTechnician
        preconditions:
          - "status == EN_ROUTE (else ERR_INVALID_STATE 409)"
          - "X-User-ID == assignment.technician_id (else ERR_NOT_ASSIGNED_TO_INCIDENT 403)"
        side_effects:
          - "arrived_at := now; assignment.version increments"
          - "If this is the incident's first arrival in the current segment: incident ON_SCENE transition fires (clock stop, pause auto-close, breach re-eval)"
      - from: ON_SCENE
        to: CLEARED
        trigger: "POST /gas-ops/dispatches/{dispatchId}/clear"
        actor: FieldTechnician
        preconditions:
          - "status == ON_SCENE (else ERR_INVALID_STATE 409)"
          - "X-User-ID == assignment.technician_id (else ERR_NOT_ASSIGNED_TO_INCIDENT 403)"
        side_effects:
          - "cleared_at := now; technician.active_assignment_count -= 1; technician.last_cleared_at := now; weighted_load recomputed"
      - from: EN_ROUTE
        to: PREEMPTED
        trigger: "POST /gas-ops/dispatches/{dispatchId}/preempt"
        actor: Supervisor
        preconditions:
          - "status == EN_ROUTE (ON_SCENE cannot be preempted: ERR_DISPATCH_NOT_PREEMPTABLE 409)"
          - "Target incident exists, lifecycle_status in {TRIAGED, DISPATCHED}, and target priority is strictly higher than source incident priority (P1 highest) (else ERR_INVALID_STATE 409)"
        side_effects:
          - "This assignment -> PREEMPTED; technician.active_assignment_count -= 1"
          - "New DispatchAssignment auto-created on the target incident for the same technician, status EN_ROUTE, dispatched_at := now; technician.active_assignment_count += 1 (net zero)"
          - "If the source incident has no remaining active assignment: source.awaiting_dispatch := true"
          - "Target incident TRIAGED -> DISPATCHED if it was TRIAGED"
      - from: EN_ROUTE
        to: CANCELLED
        trigger: "POST /gas-ops/dispatches/{dispatchId}/cancel"
        actor: Supervisor
        preconditions: ["status == EN_ROUTE (else ERR_INVALID_STATE 409)"]
        side_effects:
          - "technician.active_assignment_count -= 1; weighted_load recomputed"
          - "If the incident has no remaining active assignment: incident.awaiting_dispatch := true"

  - entity: ResponseClockPause
    initial_state: OPEN
    terminal_states: [CLOSED]
    transitions:
      - from: OPEN
        to: CLOSED
        trigger: "POST /gas-ops/response-clock-pauses/{pauseId}/end"
        actor: Dispatcher | Supervisor
        preconditions: ["status == OPEN (else ERR_INVALID_STATE 409)"]
        side_effects:
          - "ended_at := now; incident.pause_total_seconds recomputed; incident breach_class re-evaluated"
      - from: OPEN
        to: CLOSED
        trigger: "system (automatic on incident first arrival; ended_at := arrived_at)"
        actor: system
        preconditions: []
        side_effects: ["incident.pause_total_seconds recomputed"]

  - entity: ShutoffOrder
    initial_state: REQUESTED
    terminal_states: [DECLINED, RESTORED]
    transitions:
      - from: REQUESTED
        to: AUTHORIZED
        trigger: "POST /gas-ops/shutoff-orders/{shutoffId}/authorize"
        actor: Supervisor
        preconditions: ["status == REQUESTED (else ERR_INVALID_STATE 409)"]
        side_effects: ["authorized_by_user_id := X-User-ID"]
      - from: REQUESTED
        to: DECLINED
        trigger: "POST /gas-ops/shutoff-orders/{shutoffId}/decline"
        actor: Supervisor
        preconditions: ["status == REQUESTED (else ERR_INVALID_STATE 409)"]
        side_effects: []
      - from: AUTHORIZED
        to: EXECUTED
        trigger: "POST /gas-ops/shutoff-orders/{shutoffId}/execute"
        actor: FieldTechnician
        preconditions:
          - "status == AUTHORIZED (else ERR_INVALID_STATE 409)"
          - "X-User-ID is a technician with an active (EN_ROUTE/ON_SCENE) assignment on the incident (else ERR_NOT_ASSIGNED_TO_INCIDENT 403)"
          - "If entry_required == true: incident.entry_status in {AUTHORIZED, FORCED} (else ERR_ENTRY_NOT_AUTHORIZED 422)"
        side_effects:
          - "executed_at := now; executed_by_technician_id := X-User-ID; incident.gas_flow_stopped recomputed (true)"
          - "If scope == METER and incident.evacuation_required == true and incident.auto_notification_created == false: auto-create PublicNotification (origin AUTO_SEVERITY, channel MEDIA, status DRAFT); auto_notification_created := true"
      - from: EXECUTED
        to: RESTORED
        trigger: "POST /gas-ops/shutoff-orders/{shutoffId}/restore"
        actor: FieldTechnician
        preconditions:
          - "status == EXECUTED (else ERR_INVALID_STATE 409)"
          - "X-User-ID is a technician with an active assignment on the incident (else ERR_NOT_ASSIGNED_TO_INCIDENT 403)"
        side_effects: ["restored_at := now"]

  - entity: ResponsibilityDetermination
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: FINAL
        trigger: "POST /gas-ops/responsibility-determinations/{determinationId}/finalize"
        actor: Supervisor
        preconditions:
          - "status == DRAFT (else ERR_DETERMINATION_NOT_DRAFT 409)"
          - "X-User-ID != drafted_by_user_id (segregation of duties: else ERR_SEGREGATION_OF_DUTIES 403)"
        side_effects:
          - "finalized_at := now; finalized_by_user_id := X-User-ID"
          - "Any other FINAL determination for the same incident -> SUPERSEDED"
          - "incident.responsibility recomputed; if responsibility == INSIDE_CUSTOMER: incident.customer_referral_required := true"
          - "If responsibility in {OUTSIDE_COMPANY, SHARED}: auto-create RepairWorkOrder (origin AUTO_DETERMINATION, status OPEN, provisional_estimate_cents from matrix; OPEN orders hold no budget reservation)"
          - "incident.version increments; DRAFT/REJECTED covering reports marked needs_regeneration"
      - from: FINAL
        to: SUPERSEDED
        trigger: "system (automatic when a newer determination for the same incident is finalized)"
        actor: system
        preconditions: []
        side_effects: []

  - entity: RepairWorkOrder
    initial_state: OPEN
    terminal_states: [COMPLETED, CANCELLED]
    transitions:
      - from: OPEN
        to: SCHEDULED
        trigger: "POST /gas-ops/repair-work-orders/{workOrderId}/schedule"
        actor: Supervisor
        preconditions:
          - "status == OPEN (else ERR_INVALID_STATE 409)"
          - "window_end strictly after window_start (else ERR_INVALID_TIME_RANGE 400)"
          - "A FINAL ResponsibilityDetermination exists for the incident (else ERR_DETERMINATION_REQUIRED 422)"
          - "Crew exists, is_active, crew.territory_id == incident.territory_id (else ERR_INVALID_STATE 409 for mismatch)"
          - "Travel buffer: for every other non-cancelled work order on the same crew, new window [window_start, window_end) must leave a gap of at least 30 minutes from the existing window: window_start >= existing.window_end + 30min OR window_end <= existing.window_start - 30min (else ERR_TRAVEL_BUFFER_VIOLATION 409)"
          - "territory.repair_reserved_cents + current_estimate_cents would stay <= territory.repair_budget_cap_cents after scheduling (else ERR_REPAIR_BUDGET_EXCEEDED 402)"
        side_effects:
          - "crew_id := input crew; windows stored; version increments"
          - "territory.repair_reserved_cents += current_estimate_cents"
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /gas-ops/repair-work-orders/{workOrderId}/start"
        actor: Supervisor
        preconditions: ["status == SCHEDULED (else ERR_INVALID_STATE 409)"]
        side_effects: []
      - from: IN_PROGRESS
        to: ON_HOLD
        trigger: "POST /gas-ops/repair-work-orders/{workOrderId}/hold"
        actor: Supervisor
        preconditions: ["status == IN_PROGRESS (else ERR_INVALID_STATE 409)"]
        side_effects: []
      - from: ON_HOLD
        to: IN_PROGRESS
        trigger: "POST /gas-ops/repair-work-orders/{workOrderId}/resume"
        actor: Supervisor
        preconditions: ["status == ON_HOLD (else ERR_INVALID_STATE 409)"]
        side_effects: []
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /gas-ops/repair-work-orders/{workOrderId}/complete"
        actor: Supervisor
        preconditions:
          - "status == IN_PROGRESS (else ERR_INVALID_STATE 409)"
          - "lines is a non-empty array and labor_minutes >= 0 (else ERR_INVALID_REQUEST 400)"
        side_effects:
          - "final_cost_cents computed per repair_cost_final; current_estimate_cents := final_cost_cents"
          - "territory.repair_reserved_cents -= provisional_estimate_cents (release the reservation made at schedule time)"
          - "completed_at := now"
      - from: OPEN
        to: CANCELLED
        trigger: "POST /gas-ops/repair-work-orders/{workOrderId}/cancel"
        actor: Supervisor
        preconditions: ["status in {OPEN, SCHEDULED, ON_HOLD} (else ERR_INVALID_STATE 409)"]
        side_effects:
          - "No reserved-budget change (OPEN work orders hold no reservation)"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /gas-ops/repair-work-orders/{workOrderId}/cancel"
        actor: Supervisor
        preconditions: ["status in {OPEN, SCHEDULED, ON_HOLD}"]
        side_effects: ["territory.repair_reserved_cents -= current_estimate_cents"]
      - from: ON_HOLD
        to: CANCELLED
        trigger: "POST /gas-ops/repair-work-orders/{workOrderId}/cancel"
        actor: Supervisor
        preconditions: ["status in {OPEN, SCHEDULED, ON_HOLD}"]
        side_effects: ["territory.repair_reserved_cents -= current_estimate_cents"]

  - entity: RegulatoryReport
    initial_state: DRAFT
    terminal_states: [ACCEPTED]
    transitions:
      - from: DRAFT
        to: SUBMITTED
        trigger: "POST /gas-ops/regulatory-reports/{reportId}/submit"
        actor: Supervisor
        preconditions:
          - "status == DRAFT (else ERR_REPORT_NOT_DRAFT 409)"
          - "needs_regeneration == false (a stale draft must be regenerated first: else ERR_REPORT_NOT_DRAFT 409 with stale-detail message)"
        side_effects:
          - "submitted_at := now; snapshot frozen (later incident changes do NOT set needs_regeneration on SUBMITTED reports)"
      - from: SUBMITTED
        to: ACCEPTED
        trigger: "POST /gas-ops/regulatory-reports/{reportId}/accept"
        actor: Regulator
        preconditions: ["status == SUBMITTED (else ERR_INVALID_STATE 409)"]
        side_effects: []
      - from: SUBMITTED
        to: REJECTED
        trigger: "POST /gas-ops/regulatory-reports/{reportId}/reject"
        actor: Regulator
        preconditions: ["status == SUBMITTED (else ERR_INVALID_STATE 409)"]
        side_effects: ["reject_reason := input reason"]
      - from: REJECTED
        to: DRAFT
        trigger: "POST /gas-ops/regulatory-reports/{reportId}/regenerate"
        actor: Supervisor
        preconditions: ["status in {DRAFT, REJECTED} (else ERR_INVALID_STATE 409)"]
        side_effects:
          - "All snapshot counts and rates recomputed at current logical time; generated_at := now; needs_regeneration := false; regeneration_count += 1"
      - from: DRAFT
        to: DRAFT
        trigger: "POST /gas-ops/regulatory-reports/{reportId}/regenerate"
        actor: Supervisor
        preconditions: ["status in {DRAFT, REJECTED}"]
        side_effects: ["Same recompute as REJECTED -> DRAFT"]

  - entity: PublicNotification
    initial_state: DRAFT
    terminal_states: [RETRACTED, DISCARDED]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /gas-ops/public-notifications/{notificationId}/issue"
        actor: Supervisor
        preconditions: ["status == DRAFT (else ERR_NOTIFICATION_NOT_DRAFT 409)"]
        side_effects: ["issued_at := now"]
      - from: ISSUED
        to: RETRACTED
        trigger: "POST /gas-ops/public-notifications/{notificationId}/retract"
        actor: Supervisor
        preconditions: ["status == ISSUED (else ERR_NOTIFICATION_NOT_ISSUED 409)"]
        side_effects: ["retracted_at := now"]
      - from: DRAFT
        to: DISCARDED
        trigger: "POST /gas-ops/public-notifications/{notificationId}/discard"
        actor: Supervisor
        preconditions: ["status == DRAFT (else ERR_NOTIFICATION_NOT_DRAFT 409)"]
        side_effects: []

# =============================================================================
# 1.2.1 Concurrency Rules (true races only, resolved by OCC on parent version)
# =============================================================================
concurrency_rules:
  - rule_id: incident-reclassify-stale-version
    parent_entity: GasIncident
    write_endpoint: "POST /gas-ops/incidents/{incidentId}/reclassify-priority"
    occ_field: expected_incident_version
    description: |
      Reclassifying an incident's priority against a GasIncident whose version
      has advanced since the client last observed it is rejected. Each
      reclassification legitimately supersedes the prior assessment, and
      automatic escalations (duplicate calls, severity recompute) advance the
      incident version between a dispatcher's read and write; a stale
      expectation therefore proves the decision was made on outdated facts.
    error_id: ERR_STALE_INCIDENT_VERSION
    http_status: 412

  - rule_id: determination-create-stale-version
    parent_entity: GasIncident
    write_endpoint: "POST /gas-ops/incidents/{incidentId}/responsibility-determinations"
    occ_field: expected_incident_version
    description: |
      Creating a ResponsibilityDetermination against a GasIncident whose
      version has advanced since the client last observed it is rejected. A
      determination drafted on a stale incident snapshot (e.g., before a
      make-safe completion changed leak_confirmed) is not a valid basis for
      the responsibility record.
    error_id: ERR_STALE_INCIDENT_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: response_elapsed_time
    trigger: "On read of GasIncident, on first arrival, on pause end, on reclassify, and at RegulatoryReport generation"
    algorithm: aggregation
    formula: |
      segment_end = first_arrival_at if first_arrival_at is set else now (logical clock)
      raw_elapsed_seconds = segment_end - response_clock_started_at   (seconds, exact)
      pause_total_seconds = sum over ResponseClockPauses of the incident's current segment of
                            (ended_at or now) - started_at            (each segment is [started_at, ended_at), half-open)
      adjusted_elapsed_seconds = max(0, raw_elapsed_seconds - pause_total_seconds)
    input_set: "ResponseClockPauses belonging to the incident created at or after the current segment start (response_clock_started_at); pauses from prior segments are archived into prior_segment_adjusted_seconds and never re-counted"
    constants:
      FLOOR_SECONDS: 0
    precision: "whole seconds; no rounding"
    variants:
      - name: raw
        when: "RegulatoryReport raw-variant compliance counts and the incident's raw_elapsed_seconds field"
        difference: "Ignores all pauses: uses raw_elapsed_seconds directly for threshold comparison"
      - name: adjusted
        when: "RegulatoryReport adjusted-variant counts, breach_class determination, and the incident's adjusted_elapsed_seconds field"
        difference: "Subtracts pause_total_seconds from raw_elapsed_seconds before threshold comparison"

  - name: sla_breach_classification
    trigger: "On first arrival, on pause end, on priority reclassification (manual or automatic), and at report generation"
    algorithm: threshold
    formula: |
      threshold_seconds = threshold_minutes * 60
      where threshold_minutes = territory.<pN>_threshold_minutes for the incident's CURRENT priority
      if adjusted_elapsed_seconds > threshold_seconds:     # strictly greater; equality is COMPLIANT
          breach = true
      else:
          breach = false
      breach_class = NONE              if breach == false
                   = RESPONDED_LATE    if breach and first_arrival_at set
                   = NO_RESPONSE       if breach and first_arrival_at is null
      Raw-variant compliance uses the same comparison with raw_elapsed_seconds.
    input_set: "The single incident under evaluation"
    constants:
      STRICTLY_GREATER: true   # boundary: elapsed == threshold*60 is compliant
    precision: "whole seconds"

  - name: incident_severity_score
    trigger: "On every AtmosphericReading creation and on every EmergencyCall link (primary, duplicate, recurrence)"
    algorithm: weighted_scoring
    formula: |
      lel_factor = 1.0 if max_pct_lel >= 10.0 else 0.5 if max_pct_lel >= 5.0 else 0.2 if max_pct_lel > 0 else 0.0
      co_factor  = 1.0 if max_co_ppm >= 70 else 0.5 if max_co_ppm >= 35 else 0.0
      occupancy_factor = 1.0 if occupancy_type in {PUBLIC_ASSEMBLY, SCHOOL, HOSPITAL}
                         else 0.6 if occupancy_type == MULTI_FAMILY
                         else 0.3   # SINGLE_FAMILY
      symptom_factor = 1.0 if any linked EmergencyCall has symptoms_reported == true else 0.0
      severity_score = min(100, max(0, round(40*lel_factor + 25*co_factor + 20*occupancy_factor + 15*symptom_factor)))
      where max_pct_lel / max_co_ppm are the maxima over ALL AtmosphericReadings of the incident
      (zero readings -> max_pct_lel = 0, max_co_ppm = 0)
    input_set: "All AtmosphericReadings of the incident (any reading_context); all linked EmergencyCalls"
    constants:
      LEL_EVACUATION_THRESHOLD: 10.0   # pct_lel >= 10.0 also sets incident.evacuation_required
      LEL_ACTION_THRESHOLD: 5.0
      CO_HIGH_PPM: 70
      CO_MODERATE_PPM: 35
      AUTO_NOTIFY_SEVERITY: 80         # severity_score >= 80 triggers AUTO_SEVERITY notification
    precision: "integer score; round half up from the weighted sum"

  - name: repair_cost_final
    trigger: "POST /gas-ops/repair-work-orders/{workOrderId}/complete"
    algorithm: tiered_pricing
    formula: |
      # Pinned rounding order: per-line rounding FIRST, then labor, then sum. Never sum-then-round.
      for each line in lines:
          line_total_cents = round_half_up(line.quantity * line.unit_price_cents * (1 - line.discount_pct))
      parts_total_cents = sum(line_total_cents)
      labor_billed_minutes = ceil(labor_minutes / 15) * 15          # quarter-hour ceiling
      labor_cost_cents = round_half_up((labor_billed_minutes / 60) * crew.hourly_rate_cents)
      final_cost_cents = parts_total_cents + labor_cost_cents
    input_set: "The completing work order's lines array and labor_minutes; the assigned crew's hourly_rate_cents"
    constants:
      LABOR_QUANTUM_MINUTES: 15
    precision: "integer cents, round_half_up at each pinned step"
    variants:
      - name: provisional
        when: "At work-order creation (auto or manual)"
        difference: "provisional_estimate_cents = PROVISIONAL_MATRIX[responsibility_at_creation][incident.priority]; no lines involved"
      - name: final
        when: "At completion"
        difference: "final_cost_cents from the pinned per-line-then-sum formula above; replaces current_estimate_cents"

  - name: provisional_estimate_matrix
    trigger: "RepairWorkOrder creation"
    algorithm: aggregation
    formula: |
      PROVISIONAL_MATRIX (cents):
        OUTSIDE_COMPANY: { P1: 150000, P2: 90000, P3: 45000, P4: 20000 }
        INSIDE_CUSTOMER: { P1: 0,      P2: 0,     P3: 0,     P4: 0     }   # customer-side: referral, no company cost
        SHARED:          { P1: 75000,  P2: 45000, P3: 22500, P4: 10000 }
        UNDETERMINED:    { P1: 60000,  P2: 60000, P3: 60000, P4: 60000 }   # used for MANUAL creation before a FINAL determination
      responsibility_at_creation = incident.responsibility if a FINAL determination exists else UNDETERMINED
    input_set: "The incident's current FINAL determination (if any) and current priority"
    constants:
      MATRIX_DEFINED_IN_FORMULA: true
    precision: "integer cents"

  - name: regulatory_compliance_snapshot
    trigger: "POST /gas-ops/regulatory-reports (generation) and POST .../regenerate"
    algorithm: aggregation
    formula: |
      # Pinned evaluation order (circular-looking dependency made explicit):
      #   (1) for each candidate incident recompute pauses -> adjusted/raw elapsed
      #   (2) evaluate breach verdicts against the incident's CURRENT priority threshold
      #   (3) aggregate counts and rates
      candidates = incidents where territory_id matches AND response_clock_started_at in [period_start, period_end)
                   AND lifecycle_status != MERGED
      incident_count = |candidates|
      determined     = candidates where first_arrival_at set OR adjusted_elapsed_seconds > threshold_minutes*60
      determined_count = |determined|; pending_count = incident_count - determined_count
      compliant_count_adjusted = |determined where adjusted_elapsed_seconds <= threshold_minutes*60|
      compliant_count_raw      = |determined where raw_elapsed_seconds      <= threshold_minutes*60|
      compliance_rate_adjusted = compliant_count_adjusted / determined_count   (null when determined_count == 0)
      compliance_rate_raw      = compliant_count_raw      / determined_count   (null when determined_count == 0)
    input_set: "GasIncidents of the territory keyed on response_clock_started_at (current segment), MERGED excluded; OPEN pauses at generation time are computed as ending at the generation timestamp for eligibility purposes (an incident whose only path to 'determined' runs through a still-open pause is NOT determined until arrival or threshold crossing under that virtual close)"
    constants:
      EMPTY_DENOMINATOR_RATE: null
    precision: "rates as decimal fractions, 4 decimal places, round_half_up"
    variants:
      - name: raw_variant
        when: "compliant_count_raw / compliance_rate_raw"
        difference: "Threshold comparison uses raw_elapsed_seconds (pauses ignored)"
      - name: adjusted_variant
        when: "compliant_count_adjusted / compliance_rate_adjusted"
        difference: "Threshold comparison uses adjusted_elapsed_seconds (pauses subtracted)"

  - name: dispatch_candidate_ranking
    trigger: "POST /gas-ops/incidents/{incidentId}/dispatches when technician_id is omitted"
    algorithm: weighted_scoring
    formula: |
      # Pinned evaluation order (dependency cycle made explicit):
      #   (1) freeze every candidate incident's CURRENT priority
      #   (2) compute weighted_load per technician from active assignments using frozen priorities
      #   (3) rank candidates; assignment creation then mutates counts for the NEXT request
      eligible = technicians where is_active == true
                 AND on_shift == true
                 AND home_territory_id == incident.territory_id
                 AND active_assignment_count < 2
      rank by: weighted_load ASC (P1=4, P2=3, P3=2, P4=1 over active assignments),
               then last_cleared_at ASC with null first,
               then technician.created_at ASC
      choose rank 1; if eligible is empty -> ERR_NO_AVAILABLE_TECHNICIAN 409
    input_set: "FieldTechnicians and their active DispatchAssignments at request time"
    constants:
      MAX_ACTIVE_ASSIGNMENTS: 2
    precision: "integer loads"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-ID and X-User-Role headers present and X-User-Role is a declared role"
    error_id: ERR_MISSING_OR_INVALID_USER_CONTEXT_HEADER
    http_status: 400
    applies_to: "all"

  - priority: 2
    category: auth
    check: "Role is permitted on this endpoint per §1.5 roles"
    error_id: ERR_INSUFFICIENT_PERMISSIONS
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "Path resource ids exist, validated left-to-right (territory, then technician/crew/incident, then child)"
    error_id: "ERR_TERRITORY_NOT_FOUND | ERR_TECHNICIAN_NOT_FOUND | ERR_CREW_NOT_FOUND | ERR_CALL_NOT_FOUND | ERR_INCIDENT_NOT_FOUND | ERR_DISPATCH_NOT_FOUND | ERR_PAUSE_NOT_FOUND | ERR_SHUTOFF_NOT_FOUND | ERR_DETERMINATION_NOT_FOUND | ERR_WORK_ORDER_NOT_FOUND | ERR_REPORT_NOT_FOUND | ERR_NOTIFICATION_NOT_FOUND"
    http_status: 404
    applies_to: "all endpoints with path ids"

  - priority: 4
    category: auth
    check: "Read scoping and segregation of duties: Regulator may read only CLOSED/MERGED incidents and non-DRAFT reports and never writes (ERR_REGULATOR_SCOPE_RESTRICTED); FieldTechnician may read/annotate only incidents where it holds or held a DispatchAssignment and may act only on its own assignments (ERR_NOT_ASSIGNED_TO_INCIDENT); determination finalizer must differ from drafter (ERR_SEGREGATION_OF_DUTIES)"
    error_id: "ERR_REGULATOR_SCOPE_RESTRICTED | ERR_NOT_ASSIGNED_TO_INCIDENT | ERR_SEGREGATION_OF_DUTIES"
    http_status: 403
    applies_to: "scoped GETs, technician action endpoints, determination finalize"

  - priority: 5
    category: business_constraint
    check: "Request shape: required fields present, enum values in domain, numeric ranges (pct_lel 0-100, co_ppm >= 0, discount_pct [0,1)), end strictly after start on time ranges"
    error_id: "ERR_INVALID_REQUEST | ERR_INVALID_TIME_RANGE"
    http_status: 400
    applies_to: "all mutating endpoints"

  - priority: 6
    category: state
    check: "Target resource in a legal from-state for the requested transition (incident lifecycle/entry, assignment, pause, shutoff, determination, work order, report, notification)"
    error_id: "ERR_INVALID_STATE | ERR_INCIDENT_NOT_TRIAGED | ERR_INCIDENT_NOT_ACTIVE | ERR_DETERMINATION_NOT_DRAFT | ERR_REPORT_NOT_DRAFT | ERR_NOTIFICATION_NOT_DRAFT | ERR_NOTIFICATION_NOT_ISSUED | ERR_DISPATCH_NOT_PREEMPTABLE | ERR_OPEN_PAUSE_EXISTS"
    http_status: 409
    applies_to: "all state-transition endpoints"

  - priority: 7
    category: business_safety
    check: "Safety gates: odor-reported incident needs >= 1 AtmosphericReading before make-safe completion (ERR_ATMOSPHERIC_READING_REQUIRED); evacuation_required needs an EVACUATE action before completion (ERR_MAKE_SAFE_NOT_COMPLETED); entry_required shutoff execution needs entry_status in {AUTHORIZED, FORCED} (ERR_ENTRY_NOT_AUTHORIZED)"
    error_id: "ERR_ATMOSPHERIC_READING_REQUIRED | ERR_MAKE_SAFE_NOT_COMPLETED | ERR_ENTRY_NOT_AUTHORIZED"
    http_status: 422
    applies_to: "make-safe/complete, shutoff execute"

  - priority: 8
    category: business_temporal
    check: "Temporal/availability: technician on_shift and territory match and capacity < 2 on explicit dispatch (ERR_TECHNICIAN_OFF_SHIFT, ERR_TECHNICIAN_TERRITORY_MISMATCH, ERR_TECHNICIAN_CAPACITY_REACHED; empty auto-select pool ERR_NO_AVAILABLE_TECHNICIAN); shift windows half-open non-overlap per technician (ERR_SHIFT_OVERLAP); crew travel buffer >= 30 min between scheduled windows (ERR_TRAVEL_BUFFER_VIOLATION)"
    error_id: "ERR_TECHNICIAN_OFF_SHIFT | ERR_TECHNICIAN_TERRITORY_MISMATCH | ERR_TECHNICIAN_CAPACITY_REACHED | ERR_NO_AVAILABLE_TECHNICIAN | ERR_SHIFT_OVERLAP | ERR_TRAVEL_BUFFER_VIOLATION"
    http_status: 409
    applies_to: "dispatch create, shift create, work-order schedule"

  - priority: 9
    category: business_referential
    check: "Cross-entity referential gates: close requires FINAL determination when leak_confirmed (ERR_DETERMINATION_REQUIRED), no active dispatches (ERR_OPEN_DISPATCHES_EXIST), no open shutoffs (ERR_OPEN_SHUTOFF_ORDER); work-order schedule requires FINAL determination (ERR_DETERMINATION_REQUIRED); merge target same normalized_address and non-terminal (ERR_MERGE_TARGET_INVALID)"
    error_id: "ERR_DETERMINATION_REQUIRED | ERR_OPEN_DISPATCHES_EXIST | ERR_OPEN_SHUTOFF_ORDER | ERR_MERGE_TARGET_INVALID"
    http_status: 422
    applies_to: "incident close, work-order schedule, merge-duplicate (ERR_OPEN_DISPATCHES_EXIST, ERR_OPEN_SHUTOFF_ORDER, ERR_MERGE_TARGET_INVALID return 409; ERR_DETERMINATION_REQUIRED returns 422)"

  - priority: 10
    category: business_fiscal
    check: "Fiscal: scheduling a work order must keep territory.repair_reserved_cents + current_estimate_cents <= repair_budget_cap_cents"
    error_id: ERR_REPAIR_BUDGET_EXCEEDED
    http_status: 402
    applies_to: "work-order schedule"

