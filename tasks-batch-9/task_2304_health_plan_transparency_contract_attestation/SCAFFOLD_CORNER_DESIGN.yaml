# =============================================================================
# Task 2304 — Health Plan Transparency & Contract Attestation Compliance
# §1.9 Scaffold Corner Design — breadth coverage index for every testable claim
# in SCAFFOLD.yaml §1.1–§1.7 that SCAFFOLD_DIFFICULTY_DESIGN.yaml (§1.8) does not
# already probe. Sections and claim_type values are taken verbatim from
# references/claim-extraction-guide.md. Corners already asserted by a §1.8
# instance appear as excluded_because stubs naming that instance.
# =============================================================================
scaffold_corner_design:
  - section: entities
    instances:
      - name: create_plan_year_initialises_derived_fields
        claim_type: creation
        grounds:
          - entities.PlanYear
          - response_envelope.success
        distinguishing_aspect: "A freshly created PlanYear must come back 201 in lifecycle_status SETUP with every derived field at its zero point (compliance_posture COMPLIANT, deficiency_points 0, penalty_exposure_cents 0, tool_sla_breach_count 0, attestation_status NOT_STARTED, freeze_flag false, version 1) — not ACTIVE, and not with a null posture."
        test_recipe:
          setup:
            - "Empty database; logical clock moved to 2027-01-02T09:00:00Z."
          setup_api_calls:
            - call: "POST /compliance/_clock/set_current_utc"
              payload: { current_utc: "2027-01-02T09:00:00Z" }
              as: PlatformOperator
          trigger:
            - call: "POST /compliance/plan-years"
              payload: { sponsor_name: "Meridian Manufacturing Benefit Plan", plan_year_label: "PY2027", start_date: "2027-01-01", end_date: "2027-12-31", covered_lives: 6000, attestation_deadline_date: "2028-01-31", rxdc_deadline_date: "2028-06-01" }
              as: PlanSponsorAdmin
              captures: { py: "$.data.id" }
          assert:
            - "response HTTP status == 201 and response_type == \"object\" with meta.api_request_id and meta.api_request_timestamp present"
            - "response data.lifecycle_status == \"SETUP\", data.compliance_posture == \"COMPLIANT\", data.deficiency_points == 0, data.penalty_exposure_cents == 0, data.tool_sla_breach_count == 0"
            - "response data.attestation_status == \"NOT_STARTED\", data.freeze_flag == false, data.freeze_reason == null, data.last_compliance_run_at == null, data.version == 1"
            - "GET /compliance/plan-years/${py} -> data.covered_lives == 6000 and data.plan_year_label == \"PY2027\" and data.rxdc_deadline_date == \"2028-06-01\""

      - name: plan_year_create_missing_required_covered_lives_rejected
        claim_type: required_fields
        grounds:
          - validations[priority=4]
          - errors[ERR_INVALID_REQUEST]
          - entities.PlanYear.fields.covered_lives
        distinguishing_aspect: "covered_lives is source: input with no default, so omitting it must be refused 400 ERR_INVALID_REQUEST rather than defaulted to 0 or 1 (which would silently pick size_multiplier 1.0 for every later accrual)."
        test_recipe:
          setup:
            - "Empty database; clock at 2027-01-02T09:00:00Z."
          setup_api_calls:
            - call: "POST /compliance/_clock/set_current_utc"
              payload: { current_utc: "2027-01-02T09:00:00Z" }
              as: PlatformOperator
          trigger:
            - call: "POST /compliance/plan-years"
              payload: { sponsor_name: "Meridian Manufacturing Benefit Plan", plan_year_label: "PY2027", start_date: "2027-01-01", end_date: "2027-12-31", attestation_deadline_date: "2028-01-31", rxdc_deadline_date: "2028-06-01" }
              as: PlanSponsorAdmin
          assert:
            - "response HTTP status == 400 and response data.error_id == \"ERR_INVALID_REQUEST\" with a non-empty data.message"
            - "GET /compliance/plan-years -> data has 0 elements and total_count == 0"

      - name: tool_sla_target_uptime_default_applied
        claim_type: defaults
        grounds:
          - entities.PriceComparisonTool.fields.sla_target_uptime_pct
          - endpoints[POST /compliance/price-comparison-tools]
        distinguishing_aspect: "sla_target_uptime_pct is optional with default 99.00; omitting it must store exactly 99.00 (not null, not 100, not 99.0 rendered as an integer), because the uptime comparison in calculations.tool_monthly_uptime reads this field."
        test_recipe:
          setup:
            - "ACTIVE PlanYear PY2027 with one TPA contract; clock at 2027-01-05T09:00:00Z."
          setup_api_calls:
            - call: "POST /compliance/_clock/set_current_utc"
              payload: { current_utc: "2027-01-05T09:00:00Z" }
              as: PlatformOperator
            - call: "POST /compliance/plan-years"
              payload: { sponsor_name: "Meridian Manufacturing Benefit Plan", plan_year_label: "PY2027", start_date: "2027-01-01", end_date: "2027-12-31", covered_lives: 6000, attestation_deadline_date: "2028-01-31", rxdc_deadline_date: "2028-06-01" }
              as: PlanSponsorAdmin
              captures: { py: "$.data.id" }
            - call: "POST /compliance/vendors"
              payload: { legal_name: "Cascade Health Administrators", vendor_type: "TPA", contact_email: "ops@cascade.example" }
              as: PlanSponsorAdmin
              captures: { v_tpa: "$.data.id" }
            - call: "POST /compliance/contracts"
              payload: { plan_year_id: "${py}", vendor_id: "${v_tpa}", contract_type: "TPA", term_start: "2027-01-01", term_end: "2028-01-01", annual_fee_cents: 48000000 }
              as: PlanSponsorAdmin
            - call: "POST /compliance/plan-years/${py}/activate"
              payload: {}
              as: PlanSponsorAdmin
          trigger:
            - call: "POST /compliance/price-comparison-tools"
              payload: { plan_year_id: "${py}", tool_name: "Meridian Care Cost Finder", covered_items_count: 800 }
              as: PlanSponsorAdmin
              captures: { tool: "$.data.id" }
          assert:
            - "response HTTP status == 201 with data.sla_target_uptime_pct == 99.00 and data.status == \"PENDING_LAUNCH\""
            - "GET /compliance/price-comparison-tools/${tool} -> data.sla_target_uptime_pct == 99.00, data.launched_at == null, data.outage_windows == [], data.sla_breach_open == false, data.last_evaluated_month == null"

      - name: mrf_create_system_fields_generated
        claim_type: system_fields
        grounds:
          - entities.MachineReadableFile.fields.status
          - entities.MachineReadableFile.fields.validation_error_count
          - endpoints[POST /compliance/machine-readable-files]
        distinguishing_aspect: "Every non-input field of a new MachineReadableFile is server-minted: status DRAFT, validation_error_count null (NOT 0 — 0 means 'validated clean' and would publish), published_at null, superseded_at null, version 1, and an id that is a bare UUID with no type prefix."
        test_recipe:
          setup:
            - "ACTIVE PlanYear PY2027 with one TPA contract; clock at 2027-06-01T09:00:00Z."
          setup_api_calls:
            - call: "POST /compliance/_clock/set_current_utc"
              payload: { current_utc: "2027-06-01T09:00:00Z" }
              as: PlatformOperator
            - call: "POST /compliance/plan-years"
              payload: { sponsor_name: "Meridian Manufacturing Benefit Plan", plan_year_label: "PY2027", start_date: "2027-01-01", end_date: "2027-12-31", covered_lives: 6000, attestation_deadline_date: "2028-01-31", rxdc_deadline_date: "2028-06-01" }
              as: PlanSponsorAdmin
              captures: { py: "$.data.id" }
            - call: "POST /compliance/vendors"
              payload: { legal_name: "Cascade Health Administrators", vendor_type: "TPA", contact_email: "ops@cascade.example" }
              as: PlanSponsorAdmin
              captures: { v_tpa: "$.data.id" }
            - call: "POST /compliance/contracts"
              payload: { plan_year_id: "${py}", vendor_id: "${v_tpa}", contract_type: "TPA", term_start: "2027-01-01", term_end: "2028-01-01", annual_fee_cents: 48000000 }
              as: PlanSponsorAdmin
            - call: "POST /compliance/plan-years/${py}/activate"
              payload: {}
              as: PlanSponsorAdmin
          trigger:
            - call: "POST /compliance/machine-readable-files"
              payload: { plan_year_id: "${py}", file_type: "IN_NETWORK_RATES", posting_month: "2027-06", public_url: "https://transparency.meridian.example/2027-06/in-network-rates.json", row_count: 812004, schema_version: "1.2.0" }
              as: PlanSponsorAdmin
              captures: { mrf: "$.data.id" }
          assert:
            - "response HTTP status == 201 with data.status == \"DRAFT\", data.validation_error_count == null, data.published_at == null, data.superseded_at == null, data.version == 1"
            - "response data.id matches the bare-UUID shape (36 characters, no type prefix such as \"mrf_\")"
            - "GET /compliance/machine-readable-files/${mrf} -> data.row_count == 812004 and data.schema_version == \"1.2.0\" and data.created_at == \"2027-06-01T09:00:00.000Z\""

      - name: contract_compensation_disclosure_required_computed
        claim_type: computed_fields
        grounds:
          - entities.ServiceProviderContract.fields.compensation_disclosure_required
          - validations[priority=31]
        distinguishing_aspect: "compensation_disclosure_required is computed strictly from contract_type: true for a BROKER contract, false for the TPA contract in the same plan year. It is never taken from input, and it is the field validation priority 31 consults."
        test_recipe:
          setup:
            - "ACTIVE PlanYear PY2027 with one TPA contract; clock at 2027-02-01T09:00:00Z."
          setup_api_calls:
            - call: "POST /compliance/_clock/set_current_utc"
              payload: { current_utc: "2027-02-01T09:00:00Z" }
              as: PlatformOperator
            - call: "POST /compliance/plan-years"
              payload: { sponsor_name: "Meridian Manufacturing Benefit Plan", plan_year_label: "PY2027", start_date: "2027-01-01", end_date: "2027-12-31", covered_lives: 6000, attestation_deadline_date: "2028-01-31", rxdc_deadline_date: "2028-06-01" }
              as: PlanSponsorAdmin
              captures: { py: "$.data.id" }
            - call: "POST /compliance/vendors"
              payload: { legal_name: "Cascade Health Administrators", vendor_type: "TPA", contact_email: "ops@cascade.example" }
              as: PlanSponsorAdmin
              captures: { v_tpa: "$.data.id" }
            - call: "POST /compliance/contracts"
              payload: { plan_year_id: "${py}", vendor_id: "${v_tpa}", contract_type: "TPA", term_start: "2027-01-01", term_end: "2028-01-01", annual_fee_cents: 48000000 }
              as: PlanSponsorAdmin
              captures: { c_tpa: "$.data.id" }
            - call: "POST /compliance/plan-years/${py}/activate"
              payload: {}
              as: PlanSponsorAdmin
            - call: "POST /compliance/vendors"
              payload: { legal_name: "Harborline Insurance Brokers", vendor_type: "BROKER", contact_email: "service@harborline.example" }
              as: PlanSponsorAdmin
              captures: { v_brk: "$.data.id" }
          trigger:
            - call: "POST /compliance/contracts"
              payload: { plan_year_id: "${py}", vendor_id: "${v_brk}", contract_type: "BROKER", term_start: "2027-01-01", term_end: "2028-01-01", annual_fee_cents: 2400000 }
              as: PlanSponsorAdmin
              captures: { c_brk: "$.data.id" }
          assert:
            - "response HTTP status == 201 with data.compensation_disclosure_required == true, data.gag_review_status == \"NOT_REVIEWED\", data.data_rights_status == \"NOT_SECURED\", data.prohibited_clause_count == 0, data.remediation_round == 0"
            - "GET /compliance/contracts/${c_tpa} -> data.compensation_disclosure_required == false"
            - "GET /compliance/contracts?plan_year_id=${py} -> data has exactly 2 elements"

      - name: get_plan_year_unknown_id_not_found
        claim_type: not_found
        grounds:
          - validations[priority=3]
          - errors[ERR_PLAN_YEAR_NOT_FOUND]
        distinguishing_aspect: "A well-formed but unused UUID in the path must yield 404 ERR_PLAN_YEAR_NOT_FOUND — the entity-specific code, not a generic 404 or ERR_INVALID_REQUEST."
        test_recipe:
          setup:
            - "Empty database; clock left at its startup value 2026-08-01T00:00:00Z."
          setup_api_calls: []
          trigger:
            - call: "GET /compliance/plan-years/00000000-0000-4000-8000-000000000000"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
          assert:
            - "response HTTP status == 404 and response data.error_id == \"ERR_PLAN_YEAR_NOT_FOUND\" with response_type == \"error\""

      - name: list_contracts_filter_and_pagination_interact
        claim_type: listing
        grounds:
          - endpoints[GET /compliance/contracts]
          - response_envelope.pagination_fields
          - response_envelope.pagination_defaults
        distinguishing_aspect: "With three contracts in the plan year, limit=2&offset=0 must return 2 rows with total_count 3 and has_more true; offset=2 returns the last row with has_more false; adding contract_type=BROKER narrows total_count to 1 — the filter must be applied BEFORE the page window, not after."
        test_recipe:
          setup:
            - "ACTIVE PlanYear PY2027 with three contracts: TPA, BROKER and CONSULTANT; clock at 2027-02-01T09:00:00Z."
          setup_api_calls:
            - call: "POST /compliance/_clock/set_current_utc"
              payload: { current_utc: "2027-02-01T09:00:00Z" }
              as: PlatformOperator
            - call: "POST /compliance/plan-years"
              payload: { sponsor_name: "Meridian Manufacturing Benefit Plan", plan_year_label: "PY2027", start_date: "2027-01-01", end_date: "2027-12-31", covered_lives: 6000, attestation_deadline_date: "2028-01-31", rxdc_deadline_date: "2028-06-01" }
              as: PlanSponsorAdmin
              captures: { py: "$.data.id" }
            - call: "POST /compliance/vendors"
              payload: { legal_name: "Cascade Health Administrators", vendor_type: "TPA", contact_email: "ops@cascade.example" }
              as: PlanSponsorAdmin
              captures: { v_tpa: "$.data.id" }
            - call: "POST /compliance/contracts"
              payload: { plan_year_id: "${py}", vendor_id: "${v_tpa}", contract_type: "TPA", term_start: "2027-01-01", term_end: "2028-01-01", annual_fee_cents: 48000000 }
              as: PlanSponsorAdmin
            - call: "POST /compliance/plan-years/${py}/activate"
              payload: {}
              as: PlanSponsorAdmin
            - call: "POST /compliance/vendors"
              payload: { legal_name: "Harborline Insurance Brokers", vendor_type: "BROKER", contact_email: "service@harborline.example" }
              as: PlanSponsorAdmin
              captures: { v_brk: "$.data.id" }
            - call: "POST /compliance/contracts"
              payload: { plan_year_id: "${py}", vendor_id: "${v_brk}", contract_type: "BROKER", term_start: "2027-01-01", term_end: "2028-01-01", annual_fee_cents: 2400000 }
              as: PlanSponsorAdmin
            - call: "POST /compliance/vendors"
              payload: { legal_name: "Pinehurst Benefits Consulting", vendor_type: "CONSULTANT", contact_email: "advisors@pinehurst.example" }
              as: PlanSponsorAdmin
              captures: { v_cons: "$.data.id" }
            - call: "POST /compliance/contracts"
              payload: { plan_year_id: "${py}", vendor_id: "${v_cons}", contract_type: "CONSULTANT", term_start: "2027-01-01", term_end: "2028-01-01", annual_fee_cents: 875000 }
              as: PlanSponsorAdmin
          trigger:
            - call: "GET /compliance/contracts?plan_year_id=${py}&limit=2&offset=0"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "GET /compliance/contracts?plan_year_id=${py}&limit=2&offset=2"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "GET /compliance/contracts?plan_year_id=${py}&contract_type=BROKER"
              payload: {}
              as: ComplianceOfficer
              as_user_id: "officer-1"
          assert:
            - "the first response has response_type == \"array\", exactly 2 elements, total_count == 3, has_more == true, limit == 2, offset == 0"
            - "the second response has exactly 1 element, total_count == 3, has_more == false"
            - "the third response has exactly 1 element with data[0].contract_type == \"BROKER\", total_count == 1, has_more == false, limit == 10, offset == 0"

      - name: penalty_ledger_entry_is_immutable_append_only
        claim_type: immutability
        grounds:
          - entities.PenaltyLedgerEntry.immutable
          - entities.PenaltyLedgerEntry.common_fields
          - endpoints[GET /compliance/penalty-ledger-entries/{id}]
        distinguishing_aspect: "PenaltyLedgerEntry declares common_fields: false with immutable: true, so a posted entry exposes id and created_at but NO version and NO updated_at field, and §1.5 declares no PUT/PATCH/DELETE for the collection — the only write path is /reverse, which appends a new row."
        test_recipe:
          setup:
            - "ACTIVE PlanYear PY2027 (covered_lives 6000) whose TPA contract was gag-reviewed with prohibited_clause_count 4 and escalated, posting one GAG_CLAUSE ACCRUAL of 30000; clock at 2027-05-04T09:00:00Z."
          setup_api_calls:
            - call: "POST /compliance/_clock/set_current_utc"
              payload: { current_utc: "2027-05-04T09:00:00Z" }
              as: PlatformOperator
            - call: "POST /compliance/plan-years"
              payload: { sponsor_name: "Meridian Manufacturing Benefit Plan", plan_year_label: "PY2027", start_date: "2027-01-01", end_date: "2027-12-31", covered_lives: 6000, attestation_deadline_date: "2028-01-31", rxdc_deadline_date: "2028-06-01" }
              as: PlanSponsorAdmin
              captures: { py: "$.data.id" }
            - call: "POST /compliance/vendors"
              payload: { legal_name: "Cascade Health Administrators", vendor_type: "TPA", contact_email: "ops@cascade.example" }
              as: PlanSponsorAdmin
              captures: { v_tpa: "$.data.id" }
            - call: "POST /compliance/contracts"
              payload: { plan_year_id: "${py}", vendor_id: "${v_tpa}", contract_type: "TPA", term_start: "2027-01-01", term_end: "2028-01-01", annual_fee_cents: 48000000 }
              as: PlanSponsorAdmin
              captures: { c_tpa: "$.data.id" }
            - call: "POST /compliance/plan-years/${py}/activate"
              payload: {}
              as: PlanSponsorAdmin
            - call: "POST /compliance/contracts/${c_tpa}/gag-review"
              payload: { clause_inventory_count: 40, prohibited_clause_count: 4 }
              as: ComplianceOfficer
              as_user_id: "officer-1"
            - call: "POST /compliance/contracts/${c_tpa}/escalate-gag"
              payload: { escalation_note: "Vendor refuses to strike the cost-data restrictions." }
              as: ComplianceOfficer
              as_user_id: "officer-1"
          trigger:
            - call: "GET /compliance/penalty-ledger-entries?plan_year_id=${py}"
              payload: {}
              as: ExternalAuditor
              as_user_id: "auditor-1"
              captures: { acc1: "$.data[0].id" }
          assert:
            - "the listed entry exposes id and created_at == \"2027-05-04T09:00:00.000Z\" and carries NO version field and NO updated_at field"
            - "GET /compliance/penalty-ledger-entries/${acc1} -> data.entry_type == \"ACCRUAL\", data.deficiency_type == \"GAG_CLAUSE\", data.signed_amount_cents == 30000, data.posted_by_user_id == \"officer-1\", data.reverses_entry_id == null, data.remediation_plan_id == null"
            - "§1.5 declares no PUT, PATCH or DELETE endpoint under /compliance/penalty-ledger-entries; the only write path is POST /compliance/penalty-ledger-entries/{id}/reverse"

      - name: vendor_create_invalid_enum_rejected
        claim_type: type_constraints
        grounds:
          - validations[priority=4]
          - errors[ERR_INVALID_REQUEST]
          - entities.Vendor.fields.vendor_type
        distinguishing_aspect: "vendor_type is a closed enum of five members; REINSURER is not one of them, so the create must be refused 400 ERR_INVALID_REQUEST and no Vendor row may be persisted."
        test_recipe:
          setup:
            - "Empty database; clock at 2027-01-02T09:00:00Z."
          setup_api_calls:
            - call: "POST /compliance/_clock/set_current_utc"
              payload: { current_utc: "2027-01-02T09:00:00Z" }
              as: PlatformOperator
          trigger:
            - call: "POST /compliance/vendors"
              payload: { legal_name: "Northwind Reinsurance", vendor_type: "REINSURER", contact_email: "desk@northwind.example" }
              as: PlanSponsorAdmin
          assert:
            - "response HTTP status == 400 and response data.error_id == \"ERR_INVALID_REQUEST\""
            - "GET /compliance/vendors -> data has 0 elements and total_count == 0"

      - name: contract_create_unknown_vendor_id_not_found
        claim_type: parent_relationships
        grounds:
          - validations[priority=6]
          - errors[ERR_VENDOR_NOT_FOUND]
          - complexity_profile.entity_topology
        distinguishing_aspect: "The topology is flat, so parents arrive as FK fields in the body: a body vendor_id that resolves to nothing must return 404 ERR_VENDOR_NOT_FOUND (the vendor-specific code, not ERR_CONTRACT_NOT_FOUND and not a 422), and the plan year must gain no contract."
        test_recipe:
          setup:
            - "One SETUP PlanYear PY2027 and no vendors; clock at 2027-01-02T09:00:00Z."
          setup_api_calls:
            - call: "POST /compliance/_clock/set_current_utc"
              payload: { current_utc: "2027-01-02T09:00:00Z" }
              as: PlatformOperator
            - call: "POST /compliance/plan-years"
              payload: { sponsor_name: "Meridian Manufacturing Benefit Plan", plan_year_label: "PY2027", start_date: "2027-01-01", end_date: "2027-12-31", covered_lives: 6000, attestation_deadline_date: "2028-01-31", rxdc_deadline_date: "2028-06-01" }
              as: PlanSponsorAdmin
              captures: { py: "$.data.id" }
          trigger:
            - call: "POST /compliance/contracts"
              payload: { plan_year_id: "${py}", vendor_id: "00000000-0000-4000-8000-0000000000ff", contract_type: "TPA", term_start: "2027-01-01", term_end: "2028-01-01", annual_fee_cents: 48000000 }
              as: PlanSponsorAdmin
          assert:
            - "response HTTP status == 404 and response data.error_id == \"ERR_VENDOR_NOT_FOUND\""
            - "GET /compliance/contracts?plan_year_id=${py} -> data has 0 elements"
            - "GET /compliance/plan-years/${py} -> data.lifecycle_status == \"SETUP\" and data.version == 1"

  - section: state_machines
    instances:
      - name: plan_year_activate_without_tpa_contract_rejected
        claim_type: precondition_enforcement
        grounds:
          - state_machines.PlanYear.SETUP_to_ACTIVE
          - validations[priority=18]
          - errors[ERR_TPA_CONTRACT_REQUIRED]
        distinguishing_aspect: "SETUP -> ACTIVE requires at least one contract with contract_type TPA. A plan year holding only a BROKER contract must be refused 409 ERR_TPA_CONTRACT_REQUIRED and stay in SETUP — 'at least one contract of any type' is the wrong precondition."
        test_recipe:
          setup:
            - "One SETUP PlanYear PY2027 whose only contract is a BROKER contract; clock at 2027-01-02T09:00:00Z."
          setup_api_calls:
            - call: "POST /compliance/_clock/set_current_utc"
              payload: { current_utc: "2027-01-02T09:00:00Z" }
              as: PlatformOperator
            - call: "POST /compliance/plan-years"
              payload: { sponsor_name: "Meridian Manufacturing Benefit Plan", plan_year_label: "PY2027", start_date: "2027-01-01", end_date: "2027-12-31", covered_lives: 6000, attestation_deadline_date: "2028-01-31", rxdc_deadline_date: "2028-06-01" }
              as: PlanSponsorAdmin
              captures: { py: "$.data.id" }
            - call: "POST /compliance/vendors"
              payload: { legal_name: "Harborline Insurance Brokers", vendor_type: "BROKER", contact_email: "service@harborline.example" }
              as: PlanSponsorAdmin
              captures: { v_brk: "$.data.id" }
            - call: "POST /compliance/contracts"
              payload: { plan_year_id: "${py}", vendor_id: "${v_brk}", contract_type: "BROKER", term_start: "2027-01-01", term_end: "2028-01-01", annual_fee_cents: 2400000 }
              as: PlanSponsorAdmin
          trigger:
            - call: "POST /compliance/plan-years/${py}/activate"
              payload: {}
              as: PlanSponsorAdmin
          assert:
            - "response HTTP status == 409 and response data.error_id == \"ERR_TPA_CONTRACT_REQUIRED\""
            - "GET /compliance/plan-years/${py} -> data.lifecycle_status == \"SETUP\" and data.compliance_posture == \"COMPLIANT\""

