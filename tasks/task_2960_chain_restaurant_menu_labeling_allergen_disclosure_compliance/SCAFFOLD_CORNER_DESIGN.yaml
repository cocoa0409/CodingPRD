      - name: temporary_item_offer_windows_merge_then_cross_the_sixty_day_limit
        claim_type: interval_merge
        grounds:
          - calculations.temporary_item_exemption_days
          - calculations.temporary_item_exemption_days.constants.EXEMPTION_DAY_LIMIT
          - endpoints[POST /menu-items/{id}/offer-windows]
          - endpoints[POST /menu-items/{id}/exemption-reviews]
        distinguishing_aspect: "One TEMPORARY item accumulates 30 + 15 adjacent days that merge into a single 45-day span, then a 14-day window behind a real gap that stays disjoint (59 days, still exempt), then a single extra day that lands exactly on EXEMPTION_DAY_LIMIT and flips the item into the covered set; a 2025 window is present throughout and is filtered out of the 2026 total."
        test_recipe:
          setup:
            - "One brand with 20 OPERATING units and a single TEMPORARY item, so the brand's coverage hinges entirely on whether that item is exempt."
            - "The automatic recomputation after POST /menu-items/{id}/offer-windows uses the logical clock's year (2026) as the review year."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /jurisdictions"
              payload: { code: "ID-MIN", name: "Idaho", preemption_mode: "PREEMPTED" }
              as: PlatformAdmin
              captures: { juris: $.data.id }
            - call: "POST /brands"
              payload: { legal_name: "Golden Grill Holdings LLC", doing_business_as: "Golden Grill" }
              as: PlatformAdmin
              captures: { brand: $.data.id }
            - call: "POST /brands/${brand}/establishment-batches"
              payload: { jurisdiction_id: "${juris}", unit_count: 20, unit_status: "OPERATING", operates_under_brand_name: true, unit_label_prefix: "ID-B" }
              as: PlatformAdmin
            - call: "POST /menu-items"
              payload: { brand_id: "${brand}", name: "Pumpkin Spice Shake", item_class: "TEMPORARY", variable_type: "NONE", first_offered_on: "2025-12-01" }
              as: BrandComplianceOfficer
              as_user_id: "${brand}"
              captures: { item: $.data.id }
            - call: "POST /menu-items/${item}/offer-windows"
              payload: { start_date: "2025-12-01", end_date: "2025-12-31" }
              as: BrandComplianceOfficer
              as_user_id: "${brand}"
            - call: "POST /menu-items/${item}/offer-windows"
              payload: { start_date: "2026-01-01", end_date: "2026-01-30" }
              as: BrandComplianceOfficer
              as_user_id: "${brand}"
            - call: "POST /menu-items/${item}/offer-windows"
              payload: { start_date: "2026-01-31", end_date: "2026-02-14" }
              as: BrandComplianceOfficer
              as_user_id: "${brand}"
            - call: "POST /menu-items/${item}/offer-windows"
              payload: { start_date: "2026-03-01", end_date: "2026-03-14" }
              as: BrandComplianceOfficer
              as_user_id: "${brand}"
          trigger:
            - call: "POST /menu-items/${item}/offer-windows"
              payload: { start_date: "2026-04-01", end_date: "2026-04-01" }
              as: BrandComplianceOfficer
              as_user_id: "${brand}"
            - call: "POST /menu-items/${item}/exemption-reviews"
              payload: { review_year: 2025 }
              as: BrandComplianceOfficer
              as_user_id: "${brand}"
            - call: "POST /menu-items/${item}/exemption-reviews"
              payload: { review_year: 2026 }
              as: BrandComplianceOfficer
              as_user_id: "${brand}"
          assert:
            - "setup_api_calls[5] response data.cumulative_offered_days == 0 - the 2025-12-01 window is outside the 2026 review year"
            - "setup_api_calls[6] response data.cumulative_offered_days == 30"
            - "setup_api_calls[7] response data.cumulative_offered_days == 45 - 2026-01-31 starts exactly one day after 2026-01-30 ends, so the two windows merge into 2026-01-01..2026-02-14"
            - "setup_api_calls[8] response data.cumulative_offered_days == 59 - 2026-03-01 is more than one day after 2026-02-14, so the 14-day window stays disjoint"
            - "after setup_api_calls[8]: MenuItem.${item}.labeling_exempt == true, labeling_status == NOT_REQUIRED, and Brand.${brand}.standard_item_count == 0 with coverage_reason NO_STANDARD_MENU_ITEMS"
            - "trigger[0] response data.cumulative_offered_days == 60 and data.labeling_exempt == false and data.labeling_status == DECLARATION_PENDING - the limit is inclusive, 60 is no longer below 60"
            - "after trigger[0]: Brand.${brand}.standard_item_count == 1, counted_unit_count == 20, coverage_status == COVERED and coverage_reason == COVERED_BY_UNIT_COUNT"
            - "trigger[1] response data.cumulative_offered_days == 31 and data.labeling_exempt == true and data.labeling_status == NOT_REQUIRED - the 2025 review year sees only the December window"
            - "after trigger[1]: Brand.${brand}.coverage_status == NOT_COVERED with coverage_reason NO_STANDARD_MENU_ITEMS"
            - "trigger[2] response data.cumulative_offered_days == 60 and data.labeling_exempt == false, and Brand.${brand}.coverage_status == COVERED again"
            - "MenuItem.${item}.offer_windows has exactly 5 entries after trigger[2] - a review never mutates the window list"

