      - name: corner_franchise_capital_share_half_up_tie_keeps_residual_invariant
        claim_type: precision
        grounds:
          - calculations.franchise_fee_allocation
          - constants.CAPITAL_RATE_BP
          - constants.ADMIN_RESERVE_BP_BASE
          - entities.FundingPeriod.fields.total_program_funds_cents
        distinguishing_aspect: "An allocable base of 1000033 makes the capital share land on an exact .5 tie (322010.5) whose floor is even, so ROUND_HALF_UP gives 322011 where truncation or half-even would give 322010; the operating residual absorbs the cent and the three buckets still sum to the base."
        test_recipe:
          setup:
            - "No funding period exists for fiscal_year 2026 quarter 1."
            - "The period is created on the ACCRUAL basis with service_period_earned_cents 1000033 and capital_grant_cents 0, so the allocable base is 1000033 (< HIGH_TIER_THRESHOLD_CENTS, admin_bp 800)."
          setup_api_calls:
            - call: "POST /funding-periods"
              payload: {fiscal_year: 2026, quarter: 1, basis: "ACCRUAL", gross_franchise_fee_cents: 1100000, service_period_earned_cents: 1000033, remittance_received_cents: 990000, capital_grant_cents: 0}
              as: FinanceOfficer
              as_user_id: "fin-1"
              captures: {fp_id: $.data.id, base_at_create: $.data.allocable_base_cents}
          trigger:
            - call: "POST /funding-periods/${fp_id}/report-submit"
              payload: {}
              as: FinanceOfficer
              as_user_id: "fin-1"
              captures: {base: $.data.allocable_base_cents, admin: $.data.admin_reserve_cents, capital: $.data.capital_allocation_cents, operating: $.data.operating_allocation_cents, total: $.data.total_program_funds_cents}
          assert:
            - "${base_at_create} == 0 — allocation fields stay zero until report-submit"
            - "${base} == 1000033 and ${admin} == 80003 (raw 80002.64 rounds up, it is not truncated to 80002)"
            - "${capital} == 322011 — the distributable 920030 * 3500 / 10000 = 322010.5 ties and ROUND_HALF_UP goes up"
            - "${operating} == 598019 as the residual 920030 - 322011"
            - "${total} == 1000033 and 80003 + 322011 + 598019 == 1000033 — no cent is created or lost"
            - "All five figures are integer cents; none is emitted as a decimal string"

