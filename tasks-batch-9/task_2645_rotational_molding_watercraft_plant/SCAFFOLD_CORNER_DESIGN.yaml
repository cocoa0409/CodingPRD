            - "ProductionOrder.${po}.version is identical before and after the third clock step, and status is still 'BLOCKED_RESIN' with blocked_reason 'NO_QUALIFIED_RESIN_LOT' — a no-op cascade writes nothing"

      # ------------------------------------------------------------------ stubs
      - name: sm_branching_fork_from_scheduled_cycle_diverges_to_oven_or_abort
        claim_type: "Shape: branching"
        grounds:
          - state_machines.MoldingCycle.SCHEDULED_to_OVEN_RUNNING
          - state_machines.MoldingCycle.SCHEDULED_to_ABORTED
          - complexity_profile.state_machine_shape
        excluded_because:
          difficulty_instance: "non_linear_state_machine / molding_cycle_scheduled_fork_with_divergent_abort_compensation"
          rationale: "That instance drives two sibling cycles out of the same SCHEDULED state down the two outgoing edges in one run and then contrasts their compensation: the started branch consumes its charge irreversibly while the aborted branch returns it to available_kg. It already asserts both fork legs, their divergent side effects and the fact that the legs never reconverge."

      - name: sm_cyclic_finished_unit_rework_loop_terminates_at_rework_count_two
        claim_type: "Shape: cyclic"
        grounds:
          - state_machines.FinishedUnit.build_status.INSPECTED_to_REWORK
          - state_machines.FinishedUnit.build_status.REWORK_to_TRIMMED
          - entities.FinishedUnit.fields.rework_count
        excluded_because:
          difficulty_instance: "non_linear_state_machine / finished_unit_rework_loop_edge_closed_by_logistics_axis"
          rationale: "The rework loop is traversed there to its termination condition, including the rework_count ceiling and the point at which the loop edge is closed off by the parallel logistics axis — a superset of 'the entity can loop back and the loop count is respected'."

      - name: sm_backward_edge_shipment_unseal_clears_quote_and_requires_reseal
        claim_type: "Shape: cyclic"
        grounds:
          - state_machines.Shipment.SEALED_to_LOADING
          - endpoints.POST_/shipments/{shipment_id}/unseal
          - calculations.shipment_freight
        excluded_because:
          difficulty_instance: "non_linear_state_machine / shipment_unseal_revert_forces_requote_on_a_new_discount_tier"
          rationale: "That instance takes the SEALED -> LOADING backward edge, asserts that the quote fields are cleared, then re-seals at a different utilisation and asserts the new tier — it covers the loop edge and proves the revert is not a no-op, which is more than the shape row asks for."

      - name: sm_cascade_down_demold_service_due_aborts_sibling_scheduled_cycles
        claim_type: "Side effect pattern: Cascade down"
        grounds:
          - state_machines.Mold.AVAILABLE_to_MAINTENANCE
          - state_machines.MoldingCycle.SCHEDULED_to_ABORTED
          - state_machines.ResinCharge.RESERVED_to_RELEASED
        excluded_because:
          difficulty_instance: "transitive_cascade / demold_service_cascade_unblocks_three_resin_blocked_orders"
          rationale: "CASCADE-B is driven there from its head (a demould that pushes cycles_since_service onto the service interval) through all five links, including the abort of the sibling SCHEDULED cycles on that mould and the release of their charges. The corner asserted here for CASCADE-E would be a duplicate for CASCADE-B."

      - name: sm_cross_entity_order_blocks_and_unblocks_on_resin_lot_state
        claim_type: "Side effect pattern: Cross-entity"
        grounds:
          - state_machines.ProductionOrder.READY_TO_SCHEDULE_to_BLOCKED_RESIN
          - state_machines.ProductionOrder.BLOCKED_RESIN_to_READY_TO_SCHEDULE
          - state_machines.ResinLot.AVAILABLE_to_QUARANTINED
        excluded_because:
          difficulty_instance: "cross_entity_state_dependency / production_order_blocks_on_resin_lot_quarantine_and_unblocks_on_release"
          rationale: "That instance quarantines the lot, asserts the order's induced BLOCKED_RESIN state and blocked_reason, then releases the quarantine and asserts the return edge — entity A changes, entity B's state and fields are verified in both directions."

      - name: sm_guarded_store_blocked_by_frozen_warehouse_posture
        claim_type: "Shape: guarded transitions"
        grounds:
          - state_machines.FinishedUnit.logistics_status.UNALLOCATED_to_STORED
          - state_machines.Warehouse.RESTRICTED_to_FROZEN
          - errors.ERR_WAREHOUSE_FROZEN
        excluded_because:
          difficulty_instance: "cross_entity_state_dependency / finished_unit_store_gated_by_warehouse_frozen_posture"
          rationale: "The store transition is exercised there against all three postures of the target site, including the FROZEN refusal and the successful store once the posture relaxes — exactly the 'A -> B only if entity C is in state X' claim, with the boundary arithmetic of the posture thresholds on top."

      - name: sm_ledger_sync_resin_mass_three_buckets_across_reserve_consume_release
        claim_type: "Side effect pattern: Ledger sync"
        grounds:
          - entities.ResinLot.fields.available_kg
          - entities.ResinLot.fields.reserved_kg
          - entities.ResinLot.fields.consumed_kg
          - state_machines.ResinCharge.RESERVED_to_CONSUMED
          - state_machines.ResinCharge.RESERVED_to_RELEASED
        excluded_because:
          difficulty_instance: "compensating_invariant / resin_mass_ledger_conserved_across_reserve_release_and_irreversible_consume"
          rationale: "That instance reconciles the lot's three mass buckets before and after every charge event and asserts the sum against received_kg at each step, which is the strongest possible form of the before/after ledger reconciliation this row asks for."

      - name: sm_ledger_sync_warranty_reserve_and_paid_across_approve_and_void
        claim_type: "Side effect pattern: Ledger sync"
        grounds:
          - entities.ProductModel.fields.warranty_reserve_cents
          - entities.ProductModel.fields.warranty_paid_cents
          - state_machines.WarrantyClaim.UNDER_REVIEW_to_APPROVED
          - state_machines.WarrantyClaim.APPROVED_to_VOID
        excluded_because:
          difficulty_instance: "compensating_invariant / warranty_reserve_ledger_conserved_across_approve_and_void"
          rationale: "The claim's approval moves money from the model's reserve to its paid bucket and the void moves it back; that instance asserts both buckets after each transition and the conserved total throughout, so the ancestor-field sync is already pinned in both directions."

      - name: sm_compensation_release_storage_reverses_footprint_with_anchor_promotion
        claim_type: "Side effect pattern: Compensation"
        grounds:
          - state_machines.FinishedUnit.logistics_status.STORED_to_UNALLOCATED
          - entities.Warehouse.fields.committed_cube_m3
          - entities.FinishedUnit.fields.is_zone_anchor
        excluded_because:
          difficulty_instance: "compensating_invariant / storage_footprint_conserved_with_asymmetric_anchor_promotion"
          rationale: "Releasing a stored hull is the compensating half of the store, and that instance shows the reversal is asymmetric: when the anchor leaves, a follower is promoted and the site's committed cube is recomputed rather than simply decremented. It asserts the no-drift end state after the round trip."

      - name: sm_precondition_oven_arm_window_conflict_on_cycle_create
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.ProductionOrder.READY_TO_SCHEDULE_to_IN_PRODUCTION
          - errors.ERR_OVEN_WINDOW_CONFLICT
          - calculations.oven_arm_window_check
        excluded_because:
          difficulty_instance: "resource_temporal_overlap / oven_arm_half_open_span_with_symmetric_changeover_buffer"
          rationale: "That instance probes the arm precondition at four adjacent instants around the buffered half-open span (inside, exactly at the boundary, one second past it, and on a different arm), so the precondition's error and its exact geometry are both already asserted."

      - name: sm_precondition_cooling_bay_aggregate_slot_capacity_on_cycle_create
        claim_type: Precondition Enforcement
        grounds:
          - state_machines.ProductionOrder.READY_TO_SCHEDULE_to_IN_PRODUCTION
          - errors.ERR_COOLING_BAY_CAPACITY_EXCEEDED
          - calculations.cooling_bay_slot_check
        excluded_because:
          difficulty_instance: "resource_temporal_overlap / cooling_bay_closed_interval_aggregate_slot_capacity"
          rationale: "The bay's aggregate capacity precondition is driven there to saturation and one past it on a CLOSED interval, including the touching-endpoint case that distinguishes the bay's geometry from the oven arm's — a strict superset of this corner."
# =============================================================================
# §1.9 Scaffold Corner Design — FRAGMENT: sections `calculations` + `validations`
# Task: task_2645_rotational_molding_watercraft_plant
#
# Fragment only: no top-level `scaffold_corner_design:` key. Two section blocks.
#
# Conventions inherited verbatim from SCAFFOLD_DIFFICULTY_DESIGN.yaml (§1.8):
#   * the logical clock starts at 2026-08-01T00:00:00Z via POST /_clock/set_current_utc;
#     when an endpoint takes an explicit actual timestamp the clock is set first
#     and the identical instant is passed;
#   * opaque roles act as fixed audit ids "admin-1" / "planner-1" / "agent-1";
#     §1.4 priority 1 requires a non-empty X-User-ID on EVERY call;
#   * MOLDING_OPERATOR, ASSEMBLY_TECH and QUALITY_INSPECTOR are always three
#     distinct Technician rows (§1.4 priority 57 segregation of duties);
#   * production orders are created WITHOUT demand_bucket_id unless the instance
#     targets the build-ahead quota;
#   * literal identifiers are prefixed CV / cv so they cannot collide with the
#     §1.8 file's identifiers;
#   * every numeric assert derived from a §1.3 formula is a literal computed by
#     running that formula with its §1.3 `constants:` under Decimal /
#     ROUND_HALF_UP; the arithmetic is shown inline in the assert text.
#   * YAML anchors named cvA_/cvB_/.../cvW_ share reference-data call objects
#     between instances that need the identical precondition.
# =============================================================================

  - section: calculations
    instances:

      # ---------------------------------------------------------------- Table 3
      - name: calc_correct_result_cycle_charge_rollup_divide_then_round_melt_index
        claim_type: Correct Result
        grounds:
          - calculations.cycle_charge_rollup
          - entities.MoldingCycle.weighted_melt_index_g10min
          - endpoints.POST_/resin-charges
        distinguishing_aspect: "Two 20.000 kg charges drawn from lots of melt index 3.00 and 4.05 give a mass-weighted blend of exactly 3.525, which must land on 3.53 — an implementation that averages the two melt indices unweighted also gets 3.525, but one that rounds HALF_EVEN returns 3.52 and fails."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z. Empty database."
            - "ProductModel PM-CVA (nominal_charge_kg 40.000, charge_tolerance_pct 5.00, melt window 2.50..6.00, max_regrind_pct 30.00), a single-cavity mould, one oven station, one FORCED_AIR bay, four technicians, one site, and two qualifying resin lots that differ ONLY in melt index (3.00 and 4.05)."
            - "ProductionOrder PO-CVA released to READY_TO_SCHEDULE and one SCHEDULED MoldingCycle whose charge rollups are still 0.000."
          setup_api_calls:
            - &cvA_clock
              call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-01T00:00:00Z" }
              as: PlantAdmin
              as_user_id: "admin-1"
            - &cvA_t_res
              call: "POST /technicians"
              payload: { employee_code: "T-CVRES", full_name: "Rhea Resin", role_code: "RESIN_TECH", certifications: ["RESIN_BLENDING"] }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { t_res: $.data.id }
            - &cvA_t_op
              call: "POST /technicians"
              payload: { employee_code: "T-CVOPR", full_name: "Otto Oven", role_code: "MOLDING_OPERATOR", certifications: [] }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { t_op: $.data.id }
            - &cvA_t_asm
              call: "POST /technicians"
              payload: { employee_code: "T-CVASM", full_name: "Abel Assembly", role_code: "ASSEMBLY_TECH", certifications: ["FIXTURE_ASSEMBLY"] }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { t_asm: $.data.id }
            - &cvA_t_qc
              call: "POST /technicians"
              payload: { employee_code: "T-CVQCI", full_name: "Kira Quality", role_code: "QUALITY_INSPECTOR", certifications: ["WALL_GAUGE", "IMPACT_RIG"] }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { t_qc: $.data.id }
            - &cvA_pm
              call: "POST /product-models"
              payload: { model_code: "PM-CVA", hull_type: "KAYAK", size_class: "MID", resin_grade: "HDPE_LINEAR", master_color_code: "SEAFOAM", max_color_delta_e: 1.50, required_additive_package_code: "UV12", max_regrind_pct: 30.00, min_melt_index_g10min: 2.50, max_melt_index_g10min: 6.00, nominal_charge_kg: 40.000, charge_tolerance_pct: 5.00, min_cooling_minutes: 30, target_wall_thickness_mm: 6.00, wall_thickness_min_mm: 4.50, wall_cv_max_pct: 12.00, impact_test_min_joules: 90.00, gross_cube_m3: 1.5000, nest_factor: 0.5000, unit_weight_kg: 30.000, msrp_cents: 180000, warranty_basis: "PRO_RATA_AGE", initial_warranty_reserve_cents: 500000, seasonal_family: "PADDLE" }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { pm: $.data.id }
            - &cvA_mold
              call: "POST /molds"
              payload: { mold_code: "MLD-CVA-1", product_model_id: "${pm}", size_class: "MID", cavity_count: 1, nominal_charge_kg: 40.000, service_interval_cycles: 10 }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { mold: $.data.id }
            - &cvA_oven
              call: "POST /oven-stations"
              payload: { station_code: "OV-CVA", arm_count: 2, max_size_class: "OVERSIZE", changeover_buffer_min: 15, energy_cents_per_min: 100 }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { station: $.data.id }
            - &cvA_bay
              call: "POST /cooling-bays"
              payload: { bay_code: "CB-CVA", concurrent_slot_capacity: 2, airflow_mode: "FORCED_AIR" }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { bay: $.data.id }
            - &cvA_wh
              call: "POST /warehouses"
              payload: { site_code: "WH-CVA", footprint_capacity_cube_m3: 100.0000, zones: [{ zone_code: "Z-A", capacity_cube_m3: 100.0000 }], restricted_threshold_pct: 85.00, frozen_threshold_pct: 95.00 }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { wh: $.data.id }
            - &cvA_lot_a
              call: "POST /resin-lots"
              payload: { lot_code: "LOT-CVA-A", resin_grade: "HDPE_LINEAR", melt_index_g10min: 3.00, color_code: "SEAFOAM", color_delta_e: 0.50, additive_package_code: "UV12", regrind_pct_by_mass: 10.00, cost_cents_per_kg: 210, received_kg: 100.000, expires_on: "2027-12-31" }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { lot_a: $.data.id, lot_a_v: $.data.version }
            - &cvA_lot_b
              call: "POST /resin-lots"
              payload: { lot_code: "LOT-CVA-B", resin_grade: "HDPE_LINEAR", melt_index_g10min: 4.05, color_code: "SEAFOAM", color_delta_e: 0.50, additive_package_code: "UV12", regrind_pct_by_mass: 10.00, cost_cents_per_kg: 210, received_kg: 100.000, expires_on: "2027-12-31" }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { lot_b: $.data.id, lot_b_v: $.data.version }
            - &cvA_po
              call: "POST /production-orders"
              payload: { order_code: "PO-CVA", product_model_id: "${pm}", target_warehouse_id: "${wh}", ordered_qty: 1 }
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { po: $.data.id }
            - &cvA_release
              call: "POST /production-orders/${po}/release"
              payload: {}
              as: PlantAdmin
              as_user_id: "admin-1"
              captures: { po_v: $.data.version }
            - &cvA_cycle
              call: "POST /molding-cycles"
              payload: { production_order_id: "${po}", oven_station_id: "${station}", arm_index: 1, cooling_bay_id: "${bay}", oven_start_at: "2026-08-01T09:00:00Z", scheduled_oven_minutes: 60, scheduled_cooling_minutes: 30, oven_temp_c: 288.0, arm_rpm_major: 8.00, arm_rpm_minor: 2.00, cooling_mode: "FORCED_AIR", expected_production_order_version: "${po_v}" }
              as: MoldingOperator
              as_user_id: "${t_op}"
              captures: { cyc: $.data.id }
          trigger:
            - &cvA_charge_1
              call: "POST /resin-charges"
              payload: { molding_cycle_id: "${cyc}", resin_lot_id: "${lot_a}", charge_kg: 20.000, regrind_kg: 2.000, expected_resin_lot_version: "${lot_a_v}" }
              as: ResinTechnician
              as_user_id: "${t_res}"
              captures: { ch1: $.data.id }
            - &cvA_charge_2
              call: "POST /resin-charges"
              payload: { molding_cycle_id: "${cyc}", resin_lot_id: "${lot_b}", charge_kg: 20.000, regrind_kg: 2.000, expected_resin_lot_version: "${lot_b_v}" }
              as: ResinTechnician
              as_user_id: "${t_res}"
              captures: { ch2: $.data.id }
            - call: "GET /molding-cycles/${cyc}"
              payload: {}
              as: MoldingOperator
              as_user_id: "${t_op}"
          assert:
            - "both charge creations return 201 and MoldingCycle.${cyc}.charged_mass_kg == 40.000 (20.000 + 20.000, 3 dp)"
            - "MoldingCycle.${cyc}.weighted_melt_index_g10min == 3.53 — numerator 20.000*3.00 + 20.000*4.05 = 141.00000, divided by 40.000 = 3.525, quantised to 2 dp ROUND_HALF_UP = 3.53 (HALF_EVEN would return 3.52)"
            - "MoldingCycle.${cyc}.cycle_regrind_pct == 10.00 — total regrind 2.000 + 2.000 = 4.000 over 40.000 * 100 = 10.000, 2 dp = 10.00"
            - "ResinCharge.${ch1}.virgin_kg == 18.000 and ResinCharge.${ch1}.charge_regrind_pct == 10.00; the same holds for ${ch2}"
            - "ResinCharge.${ch1}.status == RESERVED and ResinCharge.${ch2}.status == RESERVED"
            - "ResinLot.${lot_a}.available_kg == 80.000, reserved_kg == 20.000, consumed_kg == 0.000 and 80.000 + 20.000 + 0.000 == received_kg 100.000"
            - "MoldingCycle.${cyc}.status is still SCHEDULED — the rollups are recomputed on charge create, not on start-oven"

      - name: calc_input_set_filtering_cycle_rollup_excludes_released_charge
        claim_type: Input Set Filtering
        grounds:
          - calculations.cycle_charge_rollup
          - endpoints.POST_/resin-charges/{resin_charge_id}/release
          - state_machines.ResinCharge.RESERVED_to_RELEASED
        distinguishing_aspect: "A third 6.000 kg charge moves the blend from 3.53 to 3.46; releasing that one charge must restore exactly 3.53 and 40.000 kg, proving the rollup reads only RESERVED-or-CONSUMED charges instead of every ResinCharge row ever attached to the cycle."
        test_recipe:
          setup:
            - "Exactly the state left by calc_correct_result_cycle_charge_rollup_divide_then_round_melt_index: cycle ${cyc} SCHEDULED with two RESERVED charges of 20.000 kg (melt 3.00 and 4.05), charged_mass_kg 40.000, weighted_melt_index_g10min 3.53."
            - "Lot LOT-CVA-A has 80.000 kg available and its version has been incremented once by the first charge, so a fresh version is read before the third charge is reserved."
          setup_api_calls:
            - *cvA_clock
            - *cvA_t_res
            - *cvA_t_op
            - *cvA_t_asm
            - *cvA_t_qc
            - *cvA_pm
            - *cvA_mold
            - *cvA_oven
            - *cvA_bay
            - *cvA_wh
            - *cvA_lot_a
            - *cvA_lot_b
            - *cvA_po
            - *cvA_release
            - *cvA_cycle
            - *cvA_charge_1
            - *cvA_charge_2
            - call: "GET /resin-lots/${lot_a}"
              payload: {}
              as: ResinTechnician
              as_user_id: "${t_res}"
              captures: { lot_a_v2: $.data.version }
          trigger:
            - call: "POST /resin-charges"
              payload: { molding_cycle_id: "${cyc}", resin_lot_id: "${lot_a}", charge_kg: 6.000, regrind_kg: 0.600, expected_resin_lot_version: "${lot_a_v2}" }
              as: ResinTechnician
              as_user_id: "${t_res}"
              captures: { ch3: $.data.id }
            - call: "GET /molding-cycles/${cyc}"
              payload: {}
              as: MoldingOperator
              as_user_id: "${t_op}"
            - call: "POST /resin-charges/${ch3}/release"
              payload: { release_reason: "BLEND_CORRECTION" }
              as: ResinTechnician
              as_user_id: "${t_res}"
            - call: "GET /molding-cycles/${cyc}"
              payload: {}
              as: MoldingOperator
              as_user_id: "${t_op}"
          assert:
            - "after the third charge: MoldingCycle.${cyc}.charged_mass_kg == 46.000 and weighted_melt_index_g10min == 3.46 — (20.000*3.00 + 20.000*4.05 + 6.000*3.00) = 159.00000 over 46.000 = 3.45652..., 2 dp HALF_UP = 3.46"
            - "after the third charge: MoldingCycle.${cyc}.cycle_regrind_pct == 10.00 (4.600 / 46.000 * 100)"
            - "after the release: ResinCharge.${ch3}.status == RELEASED and released_reason is the supplied BLEND_CORRECTION, not the CYCLE_ABORTED default"
            - "after the release: MoldingCycle.${cyc}.charged_mass_kg == 40.000 and weighted_melt_index_g10min == 3.53 — identical to the two-charge value, so the RELEASED row contributes nothing"
            - "after the release: MoldingCycle.${cyc}.cycle_regrind_pct == 10.00"
            - "ResinLot.${lot_a}.available_kg == 80.000 and reserved_kg == 20.000 — the 6.000 kg moved back out of reserved_kg, and 80.000 + 20.000 + 0.000 == 100.000 still holds"
            - "ResinCharge.${ch1}.status and ResinCharge.${ch2}.status are both still RESERVED and untouched"

      - name: calc_precision_cycle_regrind_pct_round_half_up_two_dp
        claim_type: Precision
        grounds:
          - calculations.cycle_charge_rollup
          - entities.MoldingCycle.cycle_regrind_pct
          - entities.ResinCharge.charge_regrind_pct
        distinguishing_aspect: "Charges of 25.000 kg / 2.000 kg regrind (8.00 pct) and 15.000 kg / 1.522 kg regrind (10.15 pct) give a blended 8.805 pct that must round HALF_UP to 8.81 — averaging the two per-charge percentages instead yields 9.08, and truncating yields 8.80."
        test_recipe:
          setup:
            - "The PM-CVA reference data of calc_correct_result_cycle_charge_rollup_divide_then_round_melt_index (nominal_charge_kg 40.000, tolerance 5.00 pct, max_regrind_pct 30.00), with ProductionOrder PO-CVA released and one SCHEDULED cycle holding no charges yet."
          setup_api_calls:
            - *cvA_clock
            - *cvA_t_res
            - *cvA_t_op
            - *cvA_t_asm
            - *cvA_t_qc
            - *cvA_pm
            - *cvA_mold
            - *cvA_oven
            - *cvA_bay
            - *cvA_wh
            - *cvA_lot_a
            - *cvA_lot_b
            - *cvA_po
            - *cvA_release
            - *cvA_cycle
          trigger:
            - call: "POST /resin-charges"
              payload: { molding_cycle_id: "${cyc}", resin_lot_id: "${lot_a}", charge_kg: 25.000, regrind_kg: 2.000, expected_resin_lot_version: "${lot_a_v}" }
              as: ResinTechnician
              as_user_id: "${t_res}"
              captures: { chp1: $.data.id }
            - call: "POST /resin-charges"
              payload: { molding_cycle_id: "${cyc}", resin_lot_id: "${lot_b}", charge_kg: 15.000, regrind_kg: 1.522, expected_resin_lot_version: "${lot_b_v}" }
              as: ResinTechnician
              as_user_id: "${t_res}"
              captures: { chp2: $.data.id }
            - call: "GET /molding-cycles/${cyc}"
              payload: {}
              as: MoldingOperator
              as_user_id: "${t_op}"
          assert:
            - "ResinCharge.${chp1}.charge_regrind_pct == 8.00 (2.000 / 25.000 * 100) and virgin_kg == 23.000"
            - "ResinCharge.${chp2}.charge_regrind_pct == 10.15 — 1.522 / 15.000 * 100 = 10.14666..., 2 dp HALF_UP = 10.15 — and virgin_kg == 13.478"
            - "MoldingCycle.${cyc}.cycle_regrind_pct == 8.81 — blended regrind (2.000 + 1.522) = 3.522 over charged mass 40.000 * 100 = 8.80500, 2 dp HALF_UP = 8.81 (truncation gives 8.80; averaging 8.00 and 10.15 gives 9.08)"
            - "MoldingCycle.${cyc}.charged_mass_kg == 40.000 and weighted_melt_index_g10min == 3.39 — (25.000*3.00 + 15.000*4.05) = 135.75000 over 40.000 = 3.39375, 2 dp HALF_UP = 3.39"
            - "8.81 is at or below ProductModel.PM-CVA.max_regrind_pct 30.00, so both charge creations return 201 and no ERR_REGRIND_LIMIT_EXCEEDED is raised"
            - "ResinLot.${lot_a}.available_kg == 75.000 and ResinLot.${lot_b}.available_kg == 85.000"

      - name: calc_input_set_filtering_order_cost_consumed_charges_and_demolded_cycles_only
        claim_type: Input Set Filtering
        grounds:
          - calculations.production_order_cost
          - endpoints.GET_/production-orders/{production_order_id}/cost-summary
          - endpoints.POST_/molding-cycles/{molding_cycle_id}/abort
        distinguishing_aspect: "A second cycle that is SCHEDULED with a RESERVED 12.500 kg charge, and then ABORTED, must leave every figure in the cost summary bit-identical: material reads CONSUMED charges only and oven energy reads DEMOLDED cycles only."
        test_recipe:
          setup:
            - "Logical clock at 2026-08-01T00:00:00Z. ProductModel PM-CVB (nominal_charge_kg 25.000, tolerance 5.00 pct, min_cooling_minutes 30), single-cavity mould, oven station OV-CVA at 100 cents/min, FORCED_AIR bay, four technicians, site WH-CVA, resin lot LOT-CVB at 213 cents/kg with 200.000 kg."
            - "ProductionOrder PO-CVB (ordered_qty 2) has run one full cycle: two 12.500 kg charges CONSUMED, 60 oven minutes, DEMOLDED, and its single hull trimmed, outfitted and inspected PASS, so completed_qty is 1 and the order is IN_PRODUCTION."
          setup_api_calls:
            - *cvA_clock
            - *cvA_t_res
            - *cvA_t_op
            - *cvA_t_asm
            - *cvA_t_qc
