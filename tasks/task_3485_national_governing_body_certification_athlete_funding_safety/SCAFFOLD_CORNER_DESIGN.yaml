              as: CommitteeAdmin
              captures: { a_id: $.data.id }
            - call: "POST /api/athletes/${a_id}/transitions"
              payload: { to_state: "SCREENING_CLEARED" }
              as: SafeSportOfficer
            - call: "POST /api/athletes/${a_id}/transitions"
              payload: { to_state: "TRAINING_CURRENT" }
              as: SafeSportOfficer
            - call: "POST /api/athletes/${a_id}/transitions"
              payload: { to_state: "ELIGIBLE" }
              as: SafeSportOfficer
            - call: "POST /api/athletes/${a_id}/results"
              payload: { event_name: "August Cup", event_grade: "A", placing: 1, event_date: "2026-08-01T00:00:00Z" }
              as: Athlete
