      - name: discharge_application_requires_borrower_veteran_status
        grounds:
          - validations[priority=23]
          - entities.Borrower.fields.military_status
          - entities.DischargeApplication.fields.discharge_type
        distinguishing_aspect: |
          DIFFERENT entity pair: DischargeApplication ←→ Borrower (vs Payment ←→ Loan above).
          Creating a DischargeApplication with discharge_type=
          VETERAN_TOTAL_PERMANENT_DISABILITY against a Borrower with
          military_status=NONE is rejected via priority 23 ERR_NOT_VETERAN. The
