        as: NurseryManager
      - call: POST /reforestation/seedling-orders
        payload:
          landowner_id: ${lo_id}
          destination_zone_id: ${z_dst}
          species: DOUGLAS_FIR
          quantity: 4000
          requested_ship_date: '2027-04-05'
        as: Landowner
        as_user_id: ${lo_id}
        captures:
          o_id: $.data.id
      - call: POST /reforestation/seedling-orders/${o_id}/confirm
        payload: {}
