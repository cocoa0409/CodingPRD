            - "ACTIVE offering 'Lunch Circuit' with participation_target = 4 and max_participants_per_session = 6."
            - "Three sessions: 2026-08-05 (started, two members checked in, then COMPLETED), 2026-08-12 (SCHEDULED, forecast 3), 2026-08-19 (SCHEDULED, forecast 2)."
            - "Two EMPLOYEE members ELIGIBLE with SIGNED waivers and ACTIVE badges."
