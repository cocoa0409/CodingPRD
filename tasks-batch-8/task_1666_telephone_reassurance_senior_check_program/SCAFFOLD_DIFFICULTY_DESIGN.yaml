  # ---------------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: capacity_admission_at_exact_free_slot_boundary
        grounds:
          - calculations.effective_capacity
          - state_machines.Participant.UNDER_REVIEW_to_ENROLLED
        distinguishing_aspect: |
          Metric: free capacity slots (integer, >= 1 admits) exercised via POST approve — different
          metric and endpoint than the streak and load boundaries. At gross_free == 1 the applicant
          is ENROLLED; at gross_free == 0 the next applicant is WAITLISTED. No off-by-one tolerated.
        test_recipe:
          setup:
            - "Program total_capacity 2, max_reserve_slots 0; PF1 enrolled (occupied 1)"
            - "P2 and P3 both UNDER_REVIEW with valid contacts"
          setup_api_calls:
            - { call: "POST /api/programs", payload: { name: "AAA", total_capacity: 2, current_policy_version: "v2026.1", max_reserve_slots: 0 }, as: ProgramCoordinator, captures: { prog_id: $.data.id } }
            - { call: "POST /api/participants", payload: { full_name: "F1", date_of_birth: "1950-11-01", phone: "555-2300", address: "1 Bnd Rd", referral_source: "SELF", age_band: "AGE_65_74", lives_alone: false, mobility: "NONE", cognitive_concern: false, chronic_conditions_count: 1, recent_hospitalization: false, recent_bereavement: false }, as: IntakeWorker, captures: { f1: $.data.id } }
