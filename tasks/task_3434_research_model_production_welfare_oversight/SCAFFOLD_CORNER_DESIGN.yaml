# =============================================================================
# 1.9 Scaffold Corner Design (Coverage Index for Non-Difficulty Tests)
# =============================================================================
# Breadth walk of SCAFFOLD.yaml 1.1-1.7 per references/claim-extraction-guide.
# Every recipe replays against the 1.5 endpoint table from empty-DB; the logical
# clock defaults to 2026-09-01T00:00:00Z. Instance names are unique across this
# file and SCAFFOLD_DIFFICULTY_DESIGN.yaml.
scaffold_corner_design:
  - section: entities
    instances:
      - name: facility_creation_defaults_and_envelope
        claim_type: creation
        grounds: [entities.Facility, endpoints.POST /api/facilities, response_envelope]
        distinguishing_aspect: "POST with all four required fields returns 201, a success envelope with meta.api_request_id, registration_status defaulted to REGISTERED, and version 1."
        test_recipe:
          setup:
            - "empty database"
          setup_api_calls: []
          trigger:
            - call: "POST /api/facilities"
              payload: { name: "Site Alpha", site_code: "SA", registration_number: "REG-001", registration_expires_at: "2027-09-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { fac_id: $.data.id }
          assert:
            - "HTTP status == 201"
            - "envelope carries meta.api_request_id and response_type == object"
            - "Facility.${fac_id}.registration_status == REGISTERED  (system default)"
            - "Facility.${fac_id}.version == 1"

      - name: strain_immutable_no_version_field
        claim_type: immutability
        grounds: [entities.ModelStrain]
        distinguishing_aspect: "ModelStrain declares common_fields: false — its read carries id and created_at but no version or updated_at field, and no update endpoint exists."
        test_recipe:
          setup:
            - "one strain created"
          setup_api_calls:
            - call: "POST /api/strains"
              payload: { strain_code: "C57BL6J", species: "MOUSE", immune_class: "IMMUNOCOMPETENT", breeding_type: "INBRED", min_barrier_level: "MPF", gestation_days: 21, wean_age_days: 21, typical_litter_size: 6, base_price_cents: 1000 }
              as: PlatformAdmin
              captures: { strain_id: $.data.id }
          trigger:
            - call: "GET /api/strains/${strain_id}"
              as: PlatformAdmin
          assert:
            - "response data contains id and created_at"
            - "response data has no 'version' key and no 'updated_at' key"
            - "ModelStrain.${strain_id}.strain_code == C57BL6J"

      - name: cohort_age_weeks_computed_from_logical_clock
        claim_type: computed_fields
        grounds: [entities.Cohort.fields.age_weeks, calculations.cohort_age_weeks]
        distinguishing_aspect: "age_weeks is derived, never stored from input: born 2026-08-18, it reads 2 at the default clock 2026-09-01 and 3 after the clock advances to 2026-09-08."
        test_recipe:
          setup:
            - "EXPANDING colony; cohort born 2026-08-18T00:00:00Z (14 days before the default clock)"
          setup_api_calls:
            - call: "POST /api/facilities"
              payload: { name: "Site Alpha", site_code: "SA", registration_number: "REG-001", registration_expires_at: "2027-09-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /api/rooms"
              payload: { facility_id: "${fac_id}", room_code: "R1", barrier_level: "VF", excluded_agents: ["MHV", "MPV"], cage_capacity: 100 }
              as: FacilityManager
              captures: { room_id: $.data.id }
            - call: "POST /api/strains"
              payload: { strain_code: "C57BL6J", species: "MOUSE", immune_class: "IMMUNOCOMPETENT", breeding_type: "INBRED", min_barrier_level: "MPF", gestation_days: 21, wean_age_days: 21, typical_litter_size: 6, base_price_cents: 1000 }
              as: PlatformAdmin
              captures: { strain_id: $.data.id }
            - call: "POST /api/protocols"
              payload: { facility_id: "${fac_id}", protocol_number: "P-100", pi_name: "Dr. Xu", species: "MOUSE", approved_animal_quota: 1000, effective_date: "2026-09-01T00:00:00Z", expiration_date: "2029-09-01T00:00:00Z" }
              as: FacilityManager
              as_user_id: "fm_1"
              captures: { prot_id: $.data.id }
            - call: "POST /api/protocols/${prot_id}/transition"
              payload: { target_state: "SUBMITTED" }
              as: FacilityManager
              as_user_id: "fm_1"
            - call: "POST /api/protocols/${prot_id}/transition"
              payload: { target_state: "UNDER_REVIEW" }
              as: IACUCReviewer
              as_user_id: "rev_1"
            - call: "POST /api/protocols/${prot_id}/transition"
              payload: { target_state: "APPROVED" }
              as: IACUCReviewer
              as_user_id: "rev_1"
            - call: "POST /api/colonies"
              payload: { room_id: "${room_id}", strain_id: "${strain_id}", protocol_id: "${prot_id}", breeding_pair_count: 10 }
              as: FacilityManager
              captures: { col_id: $.data.id }
            - call: "POST /api/colonies/${col_id}/transition"
              payload: { target_state: "EXPANDING" }
              as: FacilityManager
            - call: "POST /api/cohorts"
              payload: { colony_id: "${col_id}", birth_date: "2026-08-18T00:00:00Z", count_male: 5, count_female: 5, avg_weight_g_male: 20.0, avg_weight_g_female: 20.0 }
              as: FacilityManager
              captures: { coh_id: $.data.id }
          trigger:
            - call: "GET /api/cohorts/${coh_id}"
              as: FacilityManager
              captures: { age_t0: $.data.age_weeks }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-08T00:00:00Z" }
              as: PlatformAdmin
            - call: "GET /api/cohorts/${coh_id}"
              as: FacilityManager
              captures: { age_t1: $.data.age_weeks }
          assert:
            - "age_t0 == 2  (floor(14 days / 7))"
            - "age_t1 == 3  (floor(21 days / 7) after the clock advance)"

      - name: room_not_found_returns_404
        claim_type: not_found
        grounds: ["errors[ERR_NOT_FOUND]", "endpoints.GET /api/rooms/{id}"]
        distinguishing_aspect: "A well-formed but absent room id returns the 404 error envelope."
        test_recipe:
          setup:
            - "empty database"
          setup_api_calls: []
          trigger:
            - call: "GET /api/rooms/11111111-2222-4333-8444-555555555555"
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_NOT_FOUND"
            - "HTTP status == 404"

      - name: room_missing_capacity_returns_invalid_request
        claim_type: required_fields
        grounds: [entities.BarrierRoom.fields.cage_capacity, "errors[ERR_INVALID_REQUEST]", "validations[priority=8]"]
        distinguishing_aspect: "Omitting required field cage_capacity on room creation is a 400 ERR_INVALID_REQUEST, not a 404 or 422."
        test_recipe:
          setup:
            - "one facility"
          setup_api_calls:
            - call: "POST /api/facilities"
              payload: { name: "Site Alpha", site_code: "SA", registration_number: "REG-001", registration_expires_at: "2027-09-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { fac_id: $.data.id }
          trigger:
            - call: "POST /api/rooms"
              payload: { facility_id: "${fac_id}", room_code: "R1", barrier_level: "VF", excluded_agents: ["MHV"] }
              as: FacilityManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST"
            - "HTTP status == 400"

      - name: room_invalid_enum_rejected
        claim_type: type_constraints
        grounds: [entities.BarrierRoom.fields.barrier_level, "errors[ERR_INVALID_ENUM]"]
        distinguishing_aspect: "barrier_level 'SUPER_CLEAN' is outside the declared member set and returns ERR_INVALID_ENUM."
        test_recipe:
          setup:
            - "one facility"
          setup_api_calls:
            - call: "POST /api/facilities"
              payload: { name: "Site Alpha", site_code: "SA", registration_number: "REG-001", registration_expires_at: "2027-09-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { fac_id: $.data.id }
          trigger:
            - call: "POST /api/rooms"
              payload: { facility_id: "${fac_id}", room_code: "R1", barrier_level: "SUPER_CLEAN", excluded_agents: ["MHV"], cage_capacity: 100 }
              as: FacilityManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_ENUM"
            - "HTTP status == 400"

      - name: duplicate_strain_code_rejected
        claim_type: type_constraints
        grounds: [entities.ModelStrain.fields.strain_code, "errors[ERR_DUPLICATE_KEY]", "validations[priority=8]"]
        distinguishing_aspect: "A second strain reusing strain_code C57BL6J collides with the uniqueness rule and returns ERR_DUPLICATE_KEY 409."
        test_recipe:
          setup:
            - "one strain with strain_code C57BL6J"
          setup_api_calls:
            - call: "POST /api/strains"
              payload: { strain_code: "C57BL6J", species: "MOUSE", immune_class: "IMMUNOCOMPETENT", breeding_type: "INBRED", min_barrier_level: "MPF", gestation_days: 21, wean_age_days: 21, typical_litter_size: 6, base_price_cents: 1000 }
              as: PlatformAdmin
          trigger:
            - call: "POST /api/strains"
              payload: { strain_code: "C57BL6J", species: "RAT", immune_class: "IMMUNOCOMPROMISED", breeding_type: "OUTBRED", min_barrier_level: "VF", gestation_days: 22, wean_age_days: 21, typical_litter_size: 8, base_price_cents: 2000 }
              as: PlatformAdmin
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_DUPLICATE_KEY"
            - "HTTP status == 409"

      - name: contract_polymorphic_site_xor_enforced
        claim_type: required_fields
        grounds: [entities.WelfareInspection.fields.facility_id, entities.WelfareInspection.fields.customer_id, "errors[ERR_INVALID_REQUEST]"]
        distinguishing_aspect: "An inspection naming both facility_id and customer_id (or neither) violates the exactly-one-site rule."
        test_recipe:
          setup:
            - "one facility and one customer"
          setup_api_calls:
            - call: "POST /api/facilities"
              payload: { name: "Site Alpha", site_code: "SA", registration_number: "REG-001", registration_expires_at: "2027-09-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /api/customers"
              payload: { institution_name: "Inst A", account_number: "ACCT-1", credit_limit_cents: 100000, accepted_min_health_status: "MPF", is_commercial: false }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
          trigger:
            - call: "POST /api/inspections"
              payload: { facility_id: "${fac_id}", customer_id: "${cust_id}", inspection_type: "ROUTINE", scheduled_date: "2026-09-05T00:00:00Z" }
              as: WelfareInspector
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_REQUEST  (both site keys set)"
            - "HTTP status == 400"

  - section: state_machines
    instances:
      - name: protocol_review_resubmission_loop
        claim_type: valid_transition
        grounds: ["state_machines.IACUCProtocol.REVISION_REQUESTED_to_SUBMITTED", "state_machines.IACUCProtocol.UNDER_REVIEW_to_REVISION_REQUESTED"]
        distinguishing_aspect: "The review cycle is traversable: DRAFT->SUBMITTED->UNDER_REVIEW->REVISION_REQUESTED->SUBMITTED->UNDER_REVIEW->APPROVED, and resubmission refreshes submitted_by_user_id."
        test_recipe:
          setup:
            - "one facility; protocol P-100 in DRAFT"
          setup_api_calls:
            - call: "POST /api/facilities"
              payload: { name: "Site Alpha", site_code: "SA", registration_number: "REG-001", registration_expires_at: "2027-09-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /api/protocols"
              payload: { facility_id: "${fac_id}", protocol_number: "P-100", pi_name: "Dr. Xu", species: "MOUSE", approved_animal_quota: 100, effective_date: "2026-09-01T00:00:00Z", expiration_date: "2029-09-01T00:00:00Z" }
              as: FacilityManager
              as_user_id: "fm_1"
              captures: { prot_id: $.data.id }
          trigger:
            - call: "POST /api/protocols/${prot_id}/transition"
              payload: { target_state: "SUBMITTED" }
              as: FacilityManager
              as_user_id: "fm_1"
            - call: "POST /api/protocols/${prot_id}/transition"
              payload: { target_state: "UNDER_REVIEW" }
              as: IACUCReviewer
              as_user_id: "rev_1"
            - call: "POST /api/protocols/${prot_id}/transition"
              payload: { target_state: "REVISION_REQUESTED" }
              as: IACUCReviewer
              as_user_id: "rev_1"
            - call: "POST /api/protocols/${prot_id}/transition"
              payload: { target_state: "SUBMITTED" }
              as: FacilityManager
              as_user_id: "fm_2"
            - call: "POST /api/protocols/${prot_id}/transition"
              payload: { target_state: "UNDER_REVIEW" }
              as: IACUCReviewer
              as_user_id: "rev_1"
            - call: "POST /api/protocols/${prot_id}/transition"
              payload: { target_state: "APPROVED" }
              as: IACUCReviewer
              as_user_id: "rev_1"
              captures: { final_state: $.data.status }
          assert:
            - "final_state == APPROVED  (full loop traversed)"
            - "IACUCProtocol.${prot_id}.submitted_by_user_id == fm_2  (refreshed at resubmission)"

      - name: protocol_rejected_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.IACUCProtocol.UNDER_REVIEW_to_REJECTED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "REJECTED is terminal: a later APPROVED attempt returns ERR_INVALID_STATE and changes nothing."
        test_recipe:
          setup:
            - "protocol in UNDER_REVIEW"
          setup_api_calls:
            - call: "POST /api/facilities"
              payload: { name: "Site Alpha", site_code: "SA", registration_number: "REG-001", registration_expires_at: "2027-09-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /api/protocols"
              payload: { facility_id: "${fac_id}", protocol_number: "P-100", pi_name: "Dr. Xu", species: "MOUSE", approved_animal_quota: 100, effective_date: "2026-09-01T00:00:00Z", expiration_date: "2029-09-01T00:00:00Z" }
              as: FacilityManager
              as_user_id: "fm_1"
              captures: { prot_id: $.data.id }
            - call: "POST /api/protocols/${prot_id}/transition"
              payload: { target_state: "SUBMITTED" }
              as: FacilityManager
              as_user_id: "fm_1"
            - call: "POST /api/protocols/${prot_id}/transition"
              payload: { target_state: "UNDER_REVIEW" }
              as: IACUCReviewer
              as_user_id: "rev_1"
            - call: "POST /api/protocols/${prot_id}/transition"
              payload: { target_state: "REJECTED" }
              as: IACUCReviewer
              as_user_id: "rev_1"
          trigger:
            - call: "POST /api/protocols/${prot_id}/transition"
              payload: { target_state: "APPROVED" }
              as: IACUCReviewer
              as_user_id: "rev_2"
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE"
            - "HTTP status == 409"
            - "IACUCProtocol.${prot_id}.status == REJECTED"

      - name: colony_retired_terminal_lockdown
        claim_type: terminal_state_lockdown
        grounds: ["state_machines.Colony.PHASING_OUT_to_RETIRED", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "RETIRED is reachable only after the last active cohort is culled; from RETIRED every further lifecycle transition fails."
        test_recipe:
          setup:
            - "PRODUCTION colony whose single cohort was fully culled; colony moved PRODUCTION->PHASING_OUT->RETIRED"
          setup_api_calls:
            - call: "POST /api/facilities"
              payload: { name: "Site Alpha", site_code: "SA", registration_number: "REG-001", registration_expires_at: "2027-09-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /api/rooms"
              payload: { facility_id: "${fac_id}", room_code: "R1", barrier_level: "VF", excluded_agents: ["MHV", "MPV"], cage_capacity: 100 }
              as: FacilityManager
              captures: { room_id: $.data.id }
            - call: "POST /api/strains"
              payload: { strain_code: "C57BL6J", species: "MOUSE", immune_class: "IMMUNOCOMPETENT", breeding_type: "INBRED", min_barrier_level: "MPF", gestation_days: 21, wean_age_days: 21, typical_litter_size: 6, base_price_cents: 1000 }
              as: PlatformAdmin
              captures: { strain_id: $.data.id }
            - call: "POST /api/protocols"
              payload: { facility_id: "${fac_id}", protocol_number: "P-100", pi_name: "Dr. Xu", species: "MOUSE", approved_animal_quota: 1000, effective_date: "2026-09-01T00:00:00Z", expiration_date: "2029-09-01T00:00:00Z" }
              as: FacilityManager
              as_user_id: "fm_1"
              captures: { prot_id: $.data.id }
            - call: "POST /api/protocols/${prot_id}/transition"
              payload: { target_state: "SUBMITTED" }
              as: FacilityManager
              as_user_id: "fm_1"
            - call: "POST /api/protocols/${prot_id}/transition"
              payload: { target_state: "UNDER_REVIEW" }
              as: IACUCReviewer
              as_user_id: "rev_1"
            - call: "POST /api/protocols/${prot_id}/transition"
              payload: { target_state: "APPROVED" }
              as: IACUCReviewer
              as_user_id: "rev_1"
            - call: "POST /api/colonies"
              payload: { room_id: "${room_id}", strain_id: "${strain_id}", protocol_id: "${prot_id}", breeding_pair_count: 10 }
              as: FacilityManager
              captures: { col_id: $.data.id }
            - call: "POST /api/colonies/${col_id}/transition"
              payload: { target_state: "EXPANDING" }
              as: FacilityManager
            - call: "POST /api/cohorts"
              payload: { colony_id: "${col_id}", birth_date: "2026-09-01T00:00:00Z", count_male: 5, count_female: 5, avg_weight_g_male: 20.0, avg_weight_g_female: 20.0 }
              as: FacilityManager
              captures: { coh_id: $.data.id }
            - call: "POST /api/colonies/${col_id}/transition"
              payload: { target_state: "PRODUCTION" }
              as: FacilityManager
            - call: "POST /api/colonies/${col_id}/transition"
              payload: { target_state: "PHASING_OUT" }
              as: FacilityManager
            - call: "POST /api/cohorts/${coh_id}/transition"
              payload: { target_state: "CULLED", cull_male: 5, cull_female: 5 }
              as: Veterinarian
            - call: "POST /api/colonies/${col_id}/transition"
              payload: { target_state: "RETIRED" }
              as: FacilityManager
          trigger:
            - call: "POST /api/colonies/${col_id}/transition"
              payload: { target_state: "PRODUCTION" }
              as: FacilityManager
              captures: { err: $.data.error_id }
          assert:
            - "error_id == ERR_INVALID_STATE  (RETIRED is terminal)"
            - "HTTP status == 409"
            - "Colony.${col_id}.lifecycle_status == RETIRED"
            - "Cohort.${coh_id}.status == CULLED and count_male == 0"

      - name: order_delivered_cannot_return_to_sourcing
        claim_type: invalid_transition
        grounds: ["state_machines.CustomerOrder", "errors[ERR_INVALID_STATE]"]
        distinguishing_aspect: "No backward edge exists out of DELIVERED: a SOURCING attempt on a delivered order is rejected while CANCELLED remains legal earlier in the lifecycle."
        test_recipe:
          setup:
            - "order fully delivered (2M/2F) via the standard ship/accept flow"
          setup_api_calls:
            - call: "POST /api/facilities"
              payload: { name: "Site Alpha", site_code: "SA", registration_number: "REG-001", registration_expires_at: "2027-09-01T00:00:00Z" }
              as: PlatformAdmin
              captures: { fac_id: $.data.id }
            - call: "POST /api/rooms"
              payload: { facility_id: "${fac_id}", room_code: "R1", barrier_level: "VF", excluded_agents: ["MHV", "MPV"], cage_capacity: 100 }
              as: FacilityManager
              captures: { room_id: $.data.id }
            - call: "POST /api/strains"
              payload: { strain_code: "C57BL6J", species: "MOUSE", immune_class: "IMMUNOCOMPETENT", breeding_type: "INBRED", min_barrier_level: "MPF", gestation_days: 21, wean_age_days: 21, typical_litter_size: 6, base_price_cents: 1000 }
              as: PlatformAdmin
              captures: { strain_id: $.data.id }
            - call: "POST /api/protocols"
              payload: { facility_id: "${fac_id}", protocol_number: "P-100", pi_name: "Dr. Xu", species: "MOUSE", approved_animal_quota: 1000, effective_date: "2026-09-01T00:00:00Z", expiration_date: "2029-09-01T00:00:00Z" }
              as: FacilityManager
              as_user_id: "fm_1"
              captures: { prot_id: $.data.id }
            - call: "POST /api/protocols/${prot_id}/transition"
              payload: { target_state: "SUBMITTED" }
              as: FacilityManager
              as_user_id: "fm_1"
            - call: "POST /api/protocols/${prot_id}/transition"
              payload: { target_state: "UNDER_REVIEW" }
              as: IACUCReviewer
              as_user_id: "rev_1"
            - call: "POST /api/protocols/${prot_id}/transition"
              payload: { target_state: "APPROVED" }
              as: IACUCReviewer
              as_user_id: "rev_1"
            - call: "POST /api/colonies"
              payload: { room_id: "${room_id}", strain_id: "${strain_id}", protocol_id: "${prot_id}", breeding_pair_count: 10 }
              as: FacilityManager
              captures: { col_id: $.data.id }
            - call: "POST /api/colonies/${col_id}/transition"
              payload: { target_state: "EXPANDING" }
              as: FacilityManager
            - call: "POST /api/cohorts"
              payload: { colony_id: "${col_id}", birth_date: "2026-09-01T00:00:00Z", count_male: 10, count_female: 10, avg_weight_g_male: 20.0, avg_weight_g_female: 20.0 }
              as: FacilityManager
              captures: { coh_id: $.data.id }
            - call: "POST /api/colonies/${col_id}/transition"
              payload: { target_state: "PRODUCTION" }
              as: FacilityManager
            - call: "POST /api/cohorts/${coh_id}/transition"
              payload: { target_state: "HOLD" }
              as: FacilityManager
            - call: "POST /api/customers"
              payload: { institution_name: "Inst A", account_number: "ACCT-1", credit_limit_cents: 1000000, accepted_min_health_status: "MPF", is_commercial: false }
              as: PlatformAdmin
              captures: { cust_id: $.data.id }
            - call: "POST /api/orders"
              payload: { strain_id: "${strain_id}", quantity_male: 2, quantity_female: 2, min_age_weeks: 4, max_age_weeks: 6, min_weight_g: 18.0, max_weight_g: 22.0, required_delivery_date: "2026-10-13T12:00:00Z" }
              as: Customer
              as_user_id: "${cust_id}"
              captures: { ord_id: $.data.id }
            - call: "POST /api/orders/${ord_id}/transition"
              payload: { target_state: "SOURCING" }
              as: FacilityManager
              captures: { o_v2: $.data.version }
            - call: "POST /api/allocations"
              payload: { order_id: "${ord_id}", cohort_id: "${coh_id}", qty_male: 2, qty_female: 2, expected_order_version: "${o_v2}" }
              as: FacilityManager
            - call: "GET /api/orders/${ord_id}"
              as: FacilityManager
              captures: { o_v3: $.data.version }
            - call: "POST /api/shipments"
