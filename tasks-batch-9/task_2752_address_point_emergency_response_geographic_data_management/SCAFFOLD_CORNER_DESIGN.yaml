            - "DiscrepancyCase.${case_id}.concurred_by_side == \"COUNTERPARTY\""
            - "DiscrepancyCase.${case_id}.resolved_value == null and adopted_at == null"
            - "DiscrepancyCase.${case_id}.version == 3   # create 1, proposal +1, concur +1"
            - "DiscrepancyProposal.${p1_id}.status == \"PENDING\"   # not VOIDED — the case never escalated"
            - "RoadCenterline.${road_id}.primary_name == \"W OAK ST\" and version == 1"
            - "RoadCenterline.${road_id}.open_discrepancy_case_count == 1   # CONCURRED is not a resolved status"

      - name: road_retire_cascade_down_to_units_and_pins
        claim_type: cascade_down
        excluded_because:
          difficulty_instance: road_retire_cascades_points_units_pins_package
          rationale: "That §1.8 transitive_cascade instance already drives the full five-level cascade down from a PUBLISHED RoadCenterline retire — base points to ROAD_RETIRED, units reached only through their parent to PARENT_RETIRED, FRESH pins to STALE, and the SEALED package to INVALIDATED/PIN_STALE — and asserts that terminal children are skipped. A separate corner test would repeat it verbatim."

      - name: adoption_cascade_crosses_road_points_report_and_package
        claim_type: cross_entity
        excluded_because:
          difficulty_instance: discrepancy_adopt_cascades_road_points_report_package
          rationale: "The §1.8 transitive_cascade instance already walks the adoption cascade across four different aggregates (RoadCenterline demotion, AddressPoint confidence_basis reset, QcValidationReport DECERTIFIED, ProvisioningPackage INVALIDATED/REPORT_DECERTIFIED) and checks each entity's state and fields."

      - name: request_void_compensates_every_minted_point
        claim_type: compensation
        excluded_because:
          difficulty_instance: assignment_void_restores_assignable_slot_count
          rationale: "The §1.8 compensating_invariant instance already voids a FULFILLED request, asserts every minted point reaches VOIDED with retire_reason REQUEST_VOIDED, and asserts assignable_slot_count returns to its exact pre-assign value with no drift."

      - name: boundary_retire_compensates_coverage_counters
        claim_type: compensation
        excluded_because:
          difficulty_instance: boundary_retire_restores_coverage_pair_conservation
          rationale: "The §1.8 compensating_invariant instance already retires an ACTIVE boundary and asserts covered_cell_count, gap_pair_count and active_assignment_count return exactly to their pre-activation values."

      - name: rollback_restores_the_previous_published_package
        claim_type: compensation
        excluded_because:
          difficulty_instance: package_rollback_preserves_single_published_package
          rationale: "The §1.8 compensating_invariant instance already covers the PUBLISHED -> SUPERSEDED -> PUBLISHED restore cycle and the invariant that exactly one package per (channel, jurisdiction_id) is PUBLISHED at any instant."

      - name: slot_and_counter_refresh_sync_ancestor_fields
        claim_type: ledger_sync
        excluded_because:
          difficulty_instance: assignment_void_restores_assignable_slot_count
          rationale: "ROAD_SLOT_REFRESH is the only ancestor-derived ledger in this scaffold and that instance reconciles the before/after values of RoadCenterline.assignable_slot_count_<side> across an assign/void pair."

      - name: confidence_refresh_only_touches_non_terminal_points
        claim_type: conditional_cascade
        excluded_because:
          difficulty_instance: road_retire_cascades_points_units_pins_package
          rationale: "That instance already asserts the conditional guard on the cascade — only AddressPoints with status IN {PENDING, ACTIVE} are mutated, and an already-RETIRED point keeps its original retire_reason and version."

      - name: address_point_activate_guarded_by_road_state
        claim_type: precondition_enforcement
        excluded_because:
          difficulty_instance: address_point_activate_requires_validated_road
          rationale: "The §1.8 cross_entity_state_dependency instance already enforces the PENDING -> ACTIVE guard against a DRAFT road and shows the same call succeeding once the road is VALIDATED."

      - name: package_seal_guarded_by_report_certification
        claim_type: precondition_enforcement
        excluded_because:
          difficulty_instance: package_seal_requires_certified_report
          rationale: "The §1.8 cross_entity_state_dependency instance already enforces the DRAFT -> SEALED guard on QcValidationReport.status == CERTIFIED (ERR_QC_REPORT_NOT_CERTIFIED) and the successful seal after certification."

      - name: boundary_activate_guarded_by_agency_status
        claim_type: precondition_enforcement
        excluded_because:
          difficulty_instance: boundary_activate_requires_active_agency
          rationale: "The §1.8 cross_entity_state_dependency instance already enforces the PROPOSED -> ACTIVE guard on Agency.status == ACTIVE (ERR_AGENCY_NOT_ACTIVE)."

  # =========================================================================
  # SECTION: calculations  (guide Table 3 + algorithm-type rows + dual-variant
  # rows)
  # =========================================================================
  - section: calculations
    instances:
      - name: normalized_name_expands_only_the_last_token
        claim_type: correct_result
        grounds:
          - calculations.normalized_road_name
          - calculations.normalized_road_name.constants.ROAD_TYPE_ABBREVIATIONS
        distinguishing_aspect: "Only the LAST token is expanded and only if it is a key of ROAD_TYPE_ABBREVIATIONS: \"St Andrews Ct\" becomes \"ST ANDREWS COURT\" (the leading ST is left alone), \"Oak Ln\" and \"Oak Lane\" both collapse to the identical key \"OAK LANE\", and punctuation plus repeated spaces are stripped before the lookup."
        test_recipe:
          setup:
            - "One jurisdiction LARCO."
            - "Four centerlines created with deliberately awkward names and non-overlapping ranges."
          setup_api_calls:
            - call: "POST /gis/jurisdictions"
              payload: { name: "Larimer County", code: "LARCO", jurisdiction_type: "COUNTY", postal_city: "FORT COLLINS" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
              captures: { j_id: $.data.id }
          trigger:
            - call: "POST /gis/road-centerlines"
              payload: { primary_name: "St Andrews Ct", jurisdiction_id: "${j_id}", from_addr_left: 100, to_addr_left: 198, parity_left: "EVEN", from_addr_right: 101, to_addr_right: 199, parity_right: "ODD" }
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { r1_id: $.data.id }
            - call: "POST /gis/road-centerlines"
              payload: { primary_name: "Oak Ln", jurisdiction_id: "${j_id}", from_addr_left: 100, to_addr_left: 198, parity_left: "EVEN", from_addr_right: 101, to_addr_right: 199, parity_right: "ODD" }
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { r2_id: $.data.id }
            - call: "POST /gis/road-centerlines"
              payload: { primary_name: "Oak Lane", jurisdiction_id: "${j_id}", from_addr_left: 200, to_addr_left: 298, parity_left: "EVEN", from_addr_right: 201, to_addr_right: 299, parity_right: "ODD" }
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { r3_id: $.data.id }
            - call: "POST /gis/road-centerlines"
              payload: { primary_name: "  W.  Oak   Blvd ", jurisdiction_id: "${j_id}", from_addr_left: 300, to_addr_left: 398, parity_left: "EVEN", from_addr_right: 301, to_addr_right: 399, parity_right: "ODD" }
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { r4_id: $.data.id }
          assert:
            - "all four calls return status_code 201"
            - "RoadCenterline.${r1_id}.normalized_name == \"ST ANDREWS COURT\"   # leading ST is NOT expanded"
            - "RoadCenterline.${r1_id}.primary_name == \"St Andrews Ct\"   # spelling preserved verbatim"
            - "RoadCenterline.${r2_id}.normalized_name == \"OAK LANE\""
            - "RoadCenterline.${r3_id}.normalized_name == \"OAK LANE\"   # identical key to r2 — this is why they collide"
            - "RoadCenterline.${r4_id}.normalized_name == \"W OAK BOULEVARD\"   # dot removed, space runs collapsed, ends trimmed"
            - "GET /gis/road-centerlines with normalized_name \"OAK LANE\" returns meta.total_count == 2"

      - name: assignable_slot_count_tracks_capacity_and_consumption
        claim_type: aggregation
        grounds:
          - calculations.assignable_slot_count
          - cascade_rules.ROAD_SLOT_REFRESH
        distinguishing_aspect: "capacity = floor((to - from)/2) + 1 = 50 for LEFT [100,198] EVEN; each base point consumes exactly one slot (50 -> 49 -> 48), subaddress units consume NONE (still 48), and retiring a base point returns one (49) while the RIGHT side never moves."
        test_recipe:
          setup:
            - "One jurisdiction LARCO with cell C001 and a DRAFT centerline, LEFT [100,198] EVEN, RIGHT [101,199] ODD."
          setup_api_calls:
            - call: "POST /gis/jurisdictions"
              payload: { name: "Larimer County", code: "LARCO", jurisdiction_type: "COUNTY", postal_city: "FORT COLLINS" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
              captures: { j_id: $.data.id }
            - call: "POST /gis/coverage-cells"
              payload: { cell_code: "C001", jurisdiction_id: "${j_id}" }
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { cell_id: $.data.id }
            - call: "POST /gis/road-centerlines"
              payload: { primary_name: "N MAPLE STREET", jurisdiction_id: "${j_id}", from_addr_left: 100, to_addr_left: 198, parity_left: "EVEN", from_addr_right: 101, to_addr_right: 199, parity_right: "ODD" }
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { road_id: $.data.id }
          trigger:
            - call: "POST /gis/address-points"
              payload: { house_number: 100, road_centerline_id: "${road_id}", side: "LEFT", source: "PARCEL", postal_city: "FORT COLLINS", cell_id: "${cell_id}", geometry_verified: true }
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { p100_id: $.data.id }
            - call: "POST /gis/address-points"
              payload: { house_number: 102, road_centerline_id: "${road_id}", side: "LEFT", source: "PARCEL", postal_city: "FORT COLLINS", cell_id: "${cell_id}", geometry_verified: true }
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { p102_id: $.data.id }
            - call: "POST /gis/address-points"
              payload: { house_number: 100, road_centerline_id: "${road_id}", side: "LEFT", source: "PARCEL", postal_city: "FORT COLLINS", cell_id: "${cell_id}", geometry_verified: true, unit_type: "UNIT", unit_id: "1" }
              as: GisAnalyst
              as_user_id: "analyst-1"
            - call: "POST /gis/address-points"
              payload: { house_number: 100, road_centerline_id: "${road_id}", side: "LEFT", source: "PARCEL", postal_city: "FORT COLLINS", cell_id: "${cell_id}", geometry_verified: true, unit_type: "UNIT", unit_id: "2", parent_address_point_id: "${p100_id}" }
              as: GisAnalyst
              as_user_id: "analyst-1"
            - call: "POST /gis/address-points/${p102_id}/retire"
              payload: { retire_reason: "Duplicate parcel record" }
              as: GisAnalyst
              as_user_id: "analyst-1"
          assert:
            - "at creation (before any point) assignable_slot_count_left == 50 and assignable_slot_count_right == 50"
            - "after the 100 point RoadCenterline.${road_id}.assignable_slot_count_left == 49"
            - "after the 102 point RoadCenterline.${road_id}.assignable_slot_count_left == 48"
            - "the third call (unit_id \"1\" with no parent_address_point_id) returns 422 ERR_SUBADDRESS_PARENT_INVALID and does NOT change the slot count"
            - "after the accepted unit (unit_id \"2\") RoadCenterline.${road_id}.assignable_slot_count_left == 48   # units consume no slot"
            - "after retiring the 102 point RoadCenterline.${road_id}.assignable_slot_count_left == 49"
            - "RoadCenterline.${road_id}.assignable_slot_count_right == 50 throughout"
            - "AddressPoint.${p100_id}.unit_child_count == 1"

      - name: next_house_number_reuses_the_lowest_gap
        claim_type: chronological
        grounds:
          - calculations.next_house_number_selection
          - state_machines.AddressAssignmentRequest.READY_TO_ASSIGN_to_FULFILLED
        distinguishing_aspect: "With base points already at 100 and 104 the candidate set is {102, 106, 108, ...} and assign picks min = 102 — the interior gap, not the next number after the highest existing address (106)."
        test_recipe:
          setup:
            - "One jurisdiction LARCO with cell C001 and a VALIDATED centerline, LEFT [100,198] EVEN."
            - "PARCEL base points at 100 and 104 (both PENDING)."
            - "One assignment request on (road, LEFT) with no proposed_house_number, GIS-approved and utility-cleared."
          setup_api_calls:
            - call: "POST /gis/jurisdictions"
              payload: { name: "Larimer County", code: "LARCO", jurisdiction_type: "COUNTY", postal_city: "FORT COLLINS" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
              captures: { j_id: $.data.id }
            - call: "POST /gis/coverage-cells"
              payload: { cell_code: "C001", jurisdiction_id: "${j_id}" }
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { cell_id: $.data.id }
            - call: "POST /gis/road-centerlines"
              payload: { primary_name: "N MAPLE STREET", jurisdiction_id: "${j_id}", from_addr_left: 100, to_addr_left: 198, parity_left: "EVEN", from_addr_right: 101, to_addr_right: 199, parity_right: "ODD" }
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { road_id: $.data.id }
            - call: "POST /gis/road-centerlines/${road_id}/validate"
              payload: {}
              as: GisAnalyst
              as_user_id: "analyst-1"
            - call: "POST /gis/address-points"
              payload: { house_number: 100, road_centerline_id: "${road_id}", side: "LEFT", source: "PARCEL", postal_city: "FORT COLLINS", cell_id: "${cell_id}", geometry_verified: true }
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { p100_id: $.data.id }
            - call: "POST /gis/address-points"
              payload: { house_number: 104, road_centerline_id: "${road_id}", side: "LEFT", source: "PARCEL", postal_city: "FORT COLLINS", cell_id: "${cell_id}", geometry_verified: true }
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { p104_id: $.data.id }
            - call: "POST /gis/address-assignment-requests"
              payload: { permit_number: "BP-2026-0300", parcel_id: "8712300300", road_centerline_id: "${road_id}", side: "LEFT" }
              as: PermitCoordinator
              as_user_id: "permit-1"
              captures: { req_id: $.data.id }
            - call: "POST /gis/address-assignment-requests/${req_id}/gis-review"
              payload: { decision: "APPROVE" }
              as: GisAnalyst
              as_user_id: "analyst-1"
            - call: "POST /gis/address-assignment-requests/${req_id}/utility-clearance"
              payload: { decision: "CLEAR" }
              as: PermitCoordinator
              as_user_id: "permit-1"
          trigger:
            - call: "POST /gis/address-assignment-requests/${req_id}/assign"
              payload: {}
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { minted_id: $.data.assigned_address_point_id }
          assert:
            - "status_code == 200"
            - "AddressAssignmentRequest.${req_id}.assigned_house_number == 102   # min of the candidate set, not 106"
            - "AddressAssignmentRequest.${req_id}.fulfillment_status == \"FULFILLED\""
            - "AddressAssignmentRequest.${req_id}.minted_point_count == 1   # requested_unit_count defaulted to 0"
            - "AddressAssignmentRequest.${req_id}.version == 4   # create 1, review +1, clearance +1, assign +1"
            - "AddressPoint.${minted_id}.house_number == 102 and side == \"LEFT\""
            - "AddressPoint.${minted_id}.source == \"PERMIT\" and status == \"PENDING\""
            - "AddressPoint.${minted_id}.geometry_verified == false and unit_id == null"
            - "AddressPoint.${minted_id}.postal_city == \"FORT COLLINS\"   # taken from the jurisdiction"
            - "AddressPoint.${minted_id}.cell_id == \"${cell_id}\"   # lowest cell_code in the jurisdiction"
            - "AddressPoint.${minted_id}.confidence_score == 69.00   # 60 PERMIT + 0 + 8 + 6 - 5 VALIDATED"
            - "RoadCenterline.${road_id}.assignable_slot_count_left == 47   # 48 -> 47"

      - name: low_confidence_cutoff_defect_fires_below_seventy_only
        claim_type: threshold
        grounds:
          - calculations.qc_defect_scan.constants.LOW_CONFIDENCE_CUTOFF
          - calculations.qc_quality_score.strict_certification
          - calculations.provisioning_eligibility_score
        distinguishing_aspect: "LOW_CONFIDENCE_CUTOFF 70 is a strict less-than test: a point at 71.00 emits no ADDRESS_LOW_CONFIDENCE defect while a point at 69.00 emits one (plus ADDRESS_MISSING_GEOMETRY), giving exactly four defects, quality_score 88.75 (38.70 + 25.05 + 25.00), advisory 90.63 and is_provisioning_eligible false."
        test_recipe:
          setup:
            - "One jurisdiction LARCO (postal_city FORT COLLINS) with cell C001."
            - "One DRAFT centerline \"N MAPLE STREET\" (already normalized, qc_dirty true), LEFT [100,198] EVEN."
            - "Point A: PERMIT, geometry_verified true, postal match, base -> 60+12+8+6-15 = 71.00."
            - "Point B: PARCEL, geometry_verified false, postal match, base -> 70+0+8+6-15 = 69.00."
          setup_api_calls:
            - call: "POST /gis/jurisdictions"
              payload: { name: "Larimer County", code: "LARCO", jurisdiction_type: "COUNTY", postal_city: "FORT COLLINS" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
              captures: { j_id: $.data.id }
            - call: "POST /gis/coverage-cells"
              payload: { cell_code: "C001", jurisdiction_id: "${j_id}" }
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { cell_id: $.data.id }
            - call: "POST /gis/road-centerlines"
              payload: { primary_name: "N MAPLE STREET", jurisdiction_id: "${j_id}", from_addr_left: 100, to_addr_left: 198, parity_left: "EVEN", from_addr_right: 101, to_addr_right: 199, parity_right: "ODD" }
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { road_id: $.data.id }
            - call: "POST /gis/address-points"
              payload: { house_number: 100, road_centerline_id: "${road_id}", side: "LEFT", source: "PERMIT", postal_city: "FORT COLLINS", cell_id: "${cell_id}", geometry_verified: true }
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { ptA_id: $.data.id }
            - call: "POST /gis/address-points"
              payload: { house_number: 102, road_centerline_id: "${road_id}", side: "LEFT", source: "PARCEL", postal_city: "FORT COLLINS", cell_id: "${cell_id}", geometry_verified: false }
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { ptB_id: $.data.id }
          trigger:
            - call: "POST /gis/qc-validation-reports"
              payload: { scope: "ROAD", road_centerline_id: "${road_id}" }
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { rep_id: $.data.id }
          assert:
            - "status_code == 201"
            - "AddressPoint.${ptA_id}.confidence_score == 71.00 and AddressPoint.${ptB_id}.confidence_score == 69.00"
            - "QcValidationReport.${rep_id}.defect_count == 4"
            - "QcValidationReport.${rep_id}.blocking_defect_count == 2   # ADDRESS_MISSING_GEOMETRY on B, ROAD_UNVALIDATED"
            - "QcValidationReport.${rep_id}.warning_defect_count == 1   # ROAD_QC_DIRTY"
            - "QcValidationReport.${rep_id}.info_defect_count == 1      # ADDRESS_LOW_CONFIDENCE on B only"
            - "GET /gis/qc-validation-reports/${rep_id}/defects with defect_code ADDRESS_LOW_CONFIDENCE returns meta.total_count == 1 and data[0].entity_ref_id == \"${ptB_id}\""
            - "GET /gis/qc-validation-reports/${rep_id}/defects with defect_code ADDRESS_MISSING_GEOMETRY returns meta.total_count == 1 and data[0].entity_ref_id == \"${ptB_id}\""
            - "QcValidationReport.${rep_id}.quality_score == 88.75   # 0.45*86=38.70 + 0.30*83.5=25.05 + 25.00"
            - "QcValidationReport.${rep_id}.advisory_quality_score == 90.63   # 39.38 + 26.25 + 25.00"
            - "QcValidationReport.${rep_id}.quality_tier == \"B\""
            - "QcValidationReport.${rep_id}.provisioning_eligibility_score == 88.75   # no waivers, no penalty"
            - "QcValidationReport.${rep_id}.is_provisioning_eligible == false"

      - name: certified_variant_withholds_full_coverage_bonus_on_a_gapped_cell
        claim_type: variant_selection
        grounds:
          - calculations.address_point_confidence_score.certified
          - state_machines.QcValidationReport.GENERATED_to_CERTIFIED
        distinguishing_aspect: "The CERTIFIED variant is applied at certification, but FULL_COVERAGE_BONUS is withheld because the point's cell still has three gap service types, so certified_confidence_score == 96.00 == confidence_score (delta 0.00) while confidence_basis flips to CERTIFIED — proving the bonus is conditional, not automatic."
        test_recipe:
          setup:
            - "One jurisdiction LARCO with cell C001 and NO emergency service boundaries (all three service types uncovered)."
            - "One centerline created (v1), validated (v2), published (v3)."
            - "One PARCEL base point at 100 LEFT, geometry_verified true, postal match, created after publication -> 70+12+8+6-0 = 96.00."
            - "One ROAD-scoped report over that road, generated by analyst-1, carrying zero defects."
          setup_api_calls:
            - call: "POST /gis/jurisdictions"
              payload: { name: "Larimer County", code: "LARCO", jurisdiction_type: "COUNTY", postal_city: "FORT COLLINS" }
              as: SystemAdmin
              as_user_id: "sysadmin-1"
              captures: { j_id: $.data.id }
            - call: "POST /gis/coverage-cells"
              payload: { cell_code: "C001", jurisdiction_id: "${j_id}" }
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { cell_id: $.data.id }
            - call: "POST /gis/road-centerlines"
              payload: { primary_name: "N MAPLE STREET", jurisdiction_id: "${j_id}", from_addr_left: 100, to_addr_left: 198, parity_left: "EVEN", from_addr_right: 101, to_addr_right: 199, parity_right: "ODD" }
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { road_id: $.data.id }
            - call: "POST /gis/road-centerlines/${road_id}/validate"
              payload: {}
              as: GisAnalyst
              as_user_id: "analyst-1"
            - call: "POST /gis/road-centerlines/${road_id}/publish"
              payload: {}
              as: QcCertifier
              as_user_id: "qc-1"
            - call: "POST /gis/address-points"
              payload: { house_number: 100, road_centerline_id: "${road_id}", side: "LEFT", source: "PARCEL", postal_city: "FORT COLLINS", cell_id: "${cell_id}", geometry_verified: true }
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { pt_id: $.data.id }
            - call: "POST /gis/qc-validation-reports"
              payload: { scope: "ROAD", road_centerline_id: "${road_id}" }
              as: GisAnalyst
              as_user_id: "analyst-1"
              captures: { rep_id: $.data.id }
          trigger:
            - call: "POST /gis/qc-validation-reports/${rep_id}/certify"
              payload: {}
              as: QcCertifier
              as_user_id: "qc-1"
          assert:
            - "status_code == 200"
            - "QcValidationReport.${rep_id}.defect_count == 0   # published road, normalized name, qc_dirty false, geometry-verified point"
            - "QcValidationReport.${rep_id}.quality_score == 100.00 and quality_tier == \"A\""
            - "QcValidationReport.${rep_id}.provisioning_eligibility_score == 100.00 and is_provisioning_eligible == true"
            - "QcValidationReport.${rep_id}.status == \"CERTIFIED\""
            - "QcValidationReport.${rep_id}.certified_by_user_id == \"qc-1\" and certified_at == \"2026-08-01T00:00:00.000Z\""
            - "QcValidationReport.${rep_id}.generated_by_user_id == \"analyst-1\""
            - "AddressPoint.${pt_id}.confidence_score == 96.00   # provisional number left untouched"
