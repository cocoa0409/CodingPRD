            - "error_id == ERR_PETITION_NOT_UNDER_REVIEW (409)"

      - name: equivalency_create_on_suspended_agreement_returns_not_editable
        claim_type: violation_to_error
        grounds:
          - "validations[priority=12]"
          - "errors[ERR_AGREEMENT_NOT_EDITABLE]"
        distinguishing_aspect: "A SUSPENDED agreement is not editable: equivalency creation fails with ERR_AGREEMENT_NOT_EDITABLE — and the OCC version check (p5) must pass first, so the request carries the fresh post-suspend version."
        test_recipe:
          setup: ["partner, course, agreement ACTIVE then SUSPENDED (version advanced by each mutation)"]
          setup_api_calls:
            - { call: "POST /api/partner-institutions", payload: { name: "Suspend College", institution_code: "SP", credit_system: "SEMESTER" }, as: RegistrarAdmin, captures: { p_id: "$.data.id" } }
            - { call: "POST /api/internal-courses", payload: { course_code: "MATH-150", title: "Calculus I", credit_hours: 4.0, level: "LOWER", department: "MATH", gened_tags: [] }, as: RegistrarAdmin, captures: { c1: "$.data.id" } }
            - { call: "POST /api/articulation-agreements", payload: { partner_institution_id: "${p_id}", program_scope: "ALL", effective_start: "2024-08-01", effective_end: "2027-07-31" }, as: RegistrarAdmin, captures: { ag_id: "$.data.id" } }
            - { call: "POST /api/articulation-agreements/${ag_id}/activate", as: RegistrarAdmin }
            - { call: "POST /api/articulation-agreements/${ag_id}/suspend", as: RegistrarAdmin }
            - { call: "GET /api/articulation-agreements/${ag_id}", as: RegistrarAdmin, captures: { ag_v_now: "$.data.version" } }
          trigger:
            - { call: "POST /api/articulation-agreements/${ag_id}/course-equivalencies", payload: { internal_course_id: "${c1}", external_course_code: "M-101", external_title: "Calc", external_credit_hours: 4.0, effective_from: "2024-08-01", effective_until: "2027-07-31", expected_agreement_version: "${ag_v_now}" }, as: RegistrarAdmin, captures: { err: "$.data.error_id" } }
          assert:
            - "error_id == ERR_AGREEMENT_NOT_EDITABLE (409) — OCC passed (fresh version) so the state rule is what fires"

