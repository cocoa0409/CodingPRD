  - rule_id: resource_temporal_overlap
    instances:
      - name: guard_band_inflated_channel_may_touch_but_not_overlap_neighbour
        grounds:
          - validations[priority=10]
          - errors[ERR_CHANNEL_OVERLAP_GUARD_BAND]
          - entities.Sector.fields.lower_edge_mhz
          - entities.Sector.fields.upper_edge_mhz
          - entities.InterferenceCoordination.fields.guard_band_mhz
        distinguishing_aspect: |
          The contested resource is SPECTRUM on a Sector and the interval semantics are
          buffer-inflated frequency intervals with a strict-inequality overlap test: the proposal
          3555.0/10.0 with guard_band_mhz 2.0 occupies [3548.0, 3562.0], which is ACCEPTED against a
          neighbour occupying [3562.0, 3572.0] (the edges touch at exactly 3562.0) and REJECTED with
          ERR_CHANNEL_OVERLAP_GUARD_BAND against a neighbour occupying [3561.0, 3571.0] (one MHz of
          true overlap).
        test_recipe:
          setup:
            - "Two ACTIVE towers RB-TWR-001 and RB-TWR-002, each with one ACCEPTED BackhaulCircuit, sharing licence CBRS-PAL-4412 (3550.0-3650.0 MHz, max_eirp_dbm 47.0)."
            - "Sector S1 on tower A: azimuth 90.0, channel 3555.0/10.0, edges 3550.0-3560.0, eirp_dbm 42.0, ACTIVE."
            - "Sector SB on tower B: azimuth 135.0, channel 3567.0/10.0, edges 3562.0-3572.0, ACTIVE - azimuth separation from S1 is 45 degrees, under MIN_AZIMUTH_SEPARATION_DEG 60, so the overlap test applies."
            - "Sector SC on tower B: azimuth 135.0, channel 3566.0/10.0, edges 3561.0-3571.0, ACTIVE - one MHz lower than SB."
            - "Logical clock at its startup default 2026-08-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /towers"
              payload: { site_code: "RB-TWR-001", latitude: 41.2500, longitude: -104.8000, ground_elevation_m: 1200.0, antenna_agl_m: 45.0, lease_landowner_name: "Hartley Ranch LLC", lease_monthly_base_rent_cents: 45000, lease_escalator_pct: 0.0275, lease_start_date: "2023-04-01", lease_term_months: 60 }
              as: NetworkEngineer
              captures: { tower_a_id: $.data.id }
            - call: "POST /backhaul-circuits"
              payload: { tower_id: "${tower_a_id}", carrier_name: "Prairie Fiber", circuit_ref: "PF-CIR-8801", committed_mbps: 500, monthly_cost_cents: 120000 }
              as: NetworkEngineer
              captures: { circuit_a_id: $.data.id }
            - call: "POST /backhaul-circuits/${circuit_a_id}/state-changes"
              payload: { to_state: "INSTALLED" }
              as: NetworkEngineer
            - call: "POST /backhaul-circuits/${circuit_a_id}/state-changes"
              payload: { to_state: "ACCEPTED", measured_mbps: 505.0 }
              as: NetworkEngineer
            - call: "POST /towers/${tower_a_id}/status-changes"
              payload: { to_status: "ACTIVE" }
