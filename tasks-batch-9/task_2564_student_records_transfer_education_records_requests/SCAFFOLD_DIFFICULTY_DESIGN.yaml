          assert:
            - "LegalDemand.${demand_id}.status == \"PRODUCED\""
            - "LegalDemand.${demand_id}.produced_at == \"2026-10-02T08:30:00.000Z\""
            - "LegalDemand.${demand_id}.produced_page_count == 40"
            - "LegalDemand.${demand_id}.notification_sent_at == null"
            - "LegalDemand.${demand_id}.notified_party == null"
            - "GET /records-office/students/${student_id}/disclosure-log returns exactly 1 row"
            - "that DisclosureLogEntry.disclosure_type == \"LEGAL_DEMAND\""
            - "that DisclosureLogEntry.source_type == \"LEGAL_DEMAND\""
            - "that DisclosureLogEntry.source_id == \"${demand_id}\""
            - "that DisclosureLogEntry.page_count == 40"
            - "that DisclosureLogEntry.disclosed_at == \"2026-10-02T08:30:00.000Z\""
            - "that DisclosureLogEntry.logged_by_user_id == \"legal-1\""
            - "RetentionSchedule.${schedule_id}.last_activity_at == \"2026-10-02T08:30:00.000Z\""
            - "RetentionSchedule.${schedule_id}.destruction_eligible_at == \"2031-10-02T08:30:00.000Z\""
            - "RetentionSchedule.${schedule_id}.exit_anchored_eligible_at == \"2031-08-14T00:00:00.000Z\""
            - "Student.${student_id}.records_disposition_date == \"2031-10-02T08:30:00.000Z\""

  - rule_id: priority_pair_validation_conflict
    instances:
      - name: rights_transferred_beats_optout_window
        grounds:
          - validations.priority_21_rights_have_transferred_to_student
          - validations.priority_82_directory_optout_within_grace_window
          - entities.Student.fields.is_eligible_student
          - entities.Student.fields.directory_optout_deadline_at
          - errors.ERR_RIGHTS_TRANSFERRED
          - errors.ERR_OPTOUT_WINDOW_CLOSED
        distinguishing_aspect: |
          Category pair authorization (priority 21) versus business_rule (priority 82): a parent of
          an 18-year-old submits an opt-out after the grace window has closed, so BOTH rules are
          violated and only ERR_RIGHTS_TRANSFERRED / 403 may surface. The control call in the same
          run proves rule 82 really is violated at that instant, because the parent of a minor
          created in the same second gets ERR_OPTOUT_WINDOW_CLOSED / 422.
        test_recipe:
          setup:
            - "CA rule with directory_optout_grace_days 14."
            - "Two students created at the 2026-08-01T00:00:00Z default clock, so both have directory_optout_deadline_at 2026-08-15T00:00:00.000Z."
            - "Student ADULT has dob 2008-08-01 and is therefore exactly 18 at the default clock, so is_eligible_student is true; student MINOR has dob 2012-05-05 and is_eligible_student false."
            - "Clock moved to 2026-08-20T00:00:00Z, five days past both deadlines."
          setup_api_calls:
            - call: "POST /records-office/state-rules"
              payload: { state_code: "CA", transfer_response_days: 10, discipline_inclusion_mode: "SUSPENSIONS_AND_EXPULSIONS", discipline_min_days_removed: 10, include_pending_investigations: false, sped_requires_consent: true, amendment_hearing_days: 30, destruction_min_age_years: 5, directory_optout_grace_days: 14, notification_wait_days: 7 }
              as: SystemAdmin
            - call: "POST /records-office/districts"
              payload: { name: "Sending Unified", district_code: "SEND01", state_code: "CA" }
              as: SystemAdmin
              captures: { send_district_id: "$.data.id" }
            - call: "POST /records-office/students"
              payload: { district_id: "${send_district_id}", first_name: "Jonah", last_name: "Adeyemi", dob: "2008-08-01", grade_level: 12, has_iep: false, guardian_user_id: "guardian-jonah", student_user_id: "student-jonah" }
              as: RecordsClerk
              captures: { adult_student_id: "$.data.id" }
            - call: "POST /records-office/students"
              payload: { district_id: "${send_district_id}", first_name: "Kira", last_name: "Adeyemi", dob: "2012-05-05", grade_level: 8, has_iep: false, guardian_user_id: "guardian-jonah" }
              as: RecordsClerk
              captures: { minor_student_id: "$.data.id" }
            - call: "POST /records-office/_clock/set_current_utc"
              payload: { current_utc: "2026-08-20T00:00:00Z" }
              as: SystemAdmin
          trigger:
            - call: "PATCH /records-office/students/${adult_student_id}/directory-optout"
              payload: { directory_optout_categories: ["NAME", "PHOTO"] }
              as: Parent
              as_user_id: "guardian-jonah"
            - call: "PATCH /records-office/students/${minor_student_id}/directory-optout"
              payload: { directory_optout_categories: ["NAME", "PHOTO"] }
              as: Parent
              as_user_id: "guardian-jonah"
          assert:
            - "the first trigger call returns HTTP 403 with data.error_id == \"ERR_RIGHTS_TRANSFERRED\""
            - "the first trigger call does NOT return ERR_OPTOUT_WINDOW_CLOSED"
            - "the second trigger call returns HTTP 422 with data.error_id == \"ERR_OPTOUT_WINDOW_CLOSED\""
            - "Student.${adult_student_id}.is_eligible_student == true"
            - "Student.${adult_student_id}.directory_optout_deadline_at == \"2026-08-15T00:00:00.000Z\""
            - "Student.${adult_student_id}.directory_optout_received_at == null"
            - "Student.${adult_student_id}.directory_optout_effective == false"
            - "Student.${minor_student_id}.directory_optout_effective == false"

      - name: occ_stale_version_beats_room_double_booking
        grounds:
          - validations.priority_41_inspection_request_version_current
          - validations.priority_70_inspection_room_interval_free
          - concurrency_rules.appointment-create-stale-inspection-request
          - errors.ERR_STALE_INSPECTION_REQUEST_VERSION
          - errors.ERR_ROOM_DOUBLE_BOOKED
          - state_machines.ReviewAppointment.SCHEDULED_to_SUPERSEDED
        distinguishing_aspect: |
          Category pair optimistic_lock (priority 41) versus temporal_conflict (priority 70) — a
          different pair from the authorization/business_rule instance. One request body carries
          both a stale expected_inspection_request_version and an interval that collides with the
          existing appointment inside the 15-minute turnover buffer; only 412 /
          ERR_STALE_INSPECTION_REQUEST_VERSION is acceptable, and the paired call with the current
          version proves the 409 was genuinely available.
        test_recipe:
          setup:
            - "CA rule and SEND01 (CA) exist; one student with has_iep false and guardian guardian-lena."
            - "One ACTIVE inspection room ROOM-A with 4 seats."
            - "The parent files an inspection request at the default clock, so statutory_inspection_due_at is 2026-09-15T00:00:00.000Z and any 2026-08-10 appointment is inside the window."
            - "Appointment 1 is booked in ROOM-A for 2026-08-10T09:00:00Z-10:00:00Z using the version captured before it, which bumps InspectionRequest.version."
            - "stale_version is the version read BEFORE appointment 1; current_version is read after it."
          setup_api_calls:
            - call: "POST /records-office/state-rules"
              payload: { state_code: "CA", transfer_response_days: 10, discipline_inclusion_mode: "SUSPENSIONS_AND_EXPULSIONS", discipline_min_days_removed: 10, include_pending_investigations: false, sped_requires_consent: true, amendment_hearing_days: 30, destruction_min_age_years: 5, directory_optout_grace_days: 14, notification_wait_days: 7 }
              as: SystemAdmin
            - call: "POST /records-office/districts"
              payload: { name: "Sending Unified", district_code: "SEND01", state_code: "CA" }
              as: SystemAdmin
              captures: { send_district_id: "$.data.id" }
            - call: "POST /records-office/inspection-rooms"
              payload: { room_code: "ROOM-A", site_name: "District Records Annex", seats: 4 }
              as: SystemAdmin
              captures: { room_id: "$.data.id" }
            - call: "POST /records-office/students"
              payload: { district_id: "${send_district_id}", first_name: "Lena", last_name: "Whitcombe", dob: "2013-03-21", grade_level: 7, has_iep: false, guardian_user_id: "guardian-lena" }
              as: RecordsClerk
              captures: { student_id: "$.data.id" }
            - call: "POST /records-office/students/${student_id}/inspection-requests"
              payload: { requested_categories: ["ACADEMIC"], copies_requested: false }
              as: Parent
              as_user_id: "guardian-lena"
              captures: { inspection_request_id: "$.data.id" }
            - call: "GET /records-office/inspection-requests/${inspection_request_id}"
              payload: {}
              as: RecordsOfficer
              captures: { stale_version: "$.data.version" }
            - call: "POST /records-office/inspection-requests/${inspection_request_id}/appointments"
              payload: { room_id: "${room_id}", start_at: "2026-08-10T09:00:00Z", end_at: "2026-08-10T10:00:00Z", expected_inspection_request_version: "${stale_version}" }
              as: RecordsOfficer
              as_user_id: "officer-1"
              captures: { appointment_1_id: "$.data.id" }
            - call: "GET /records-office/inspection-requests/${inspection_request_id}"
              payload: {}
              as: RecordsOfficer
              captures: { current_version: "$.data.version" }
          trigger:
            - call: "POST /records-office/inspection-requests/${inspection_request_id}/appointments"
              payload: { room_id: "${room_id}", start_at: "2026-08-10T10:15:00Z", end_at: "2026-08-10T11:00:00Z", expected_inspection_request_version: "${stale_version}" }
              as: RecordsOfficer
              as_user_id: "officer-1"
            - call: "POST /records-office/inspection-requests/${inspection_request_id}/appointments"
              payload: { room_id: "${room_id}", start_at: "2026-08-10T10:15:00Z", end_at: "2026-08-10T11:00:00Z", expected_inspection_request_version: "${current_version}" }
              as: RecordsOfficer
              as_user_id: "officer-1"
          assert:
            - "the first trigger call returns HTTP 412 with data.error_id == \"ERR_STALE_INSPECTION_REQUEST_VERSION\""
            - "the first trigger call does NOT return ERR_ROOM_DOUBLE_BOOKED"
            - "the second trigger call returns HTTP 409 with data.error_id == \"ERR_ROOM_DOUBLE_BOOKED\""
            - "ReviewAppointment.${appointment_1_id}.status == \"SCHEDULED\""
            - "InspectionRequest.${inspection_request_id}.status == \"SCHEDULED\""
            - "InspectionRequest.${inspection_request_id}.version == ${current_version}"
            - "GET /records-office/review-appointments?inspection_request_id=${inspection_request_id} returns exactly 1 row"

  - rule_id: boundary_precision_check
    instances:
      - name: directory_optout_deadline_inclusive_millisecond
        grounds:
          - validations.priority_82_directory_optout_within_grace_window
          - entities.Student.fields.directory_optout_deadline_at
          - entities.Student.fields.directory_optout_effective
          - entities.StateRecordsRule.fields.directory_optout_grace_days
          - errors.ERR_OPTOUT_WINDOW_CLOSED
        distinguishing_aspect: |
          Metric: an instant, tested at the INCLUSIVE endpoint to the millisecond on PATCH
          /students/{id}/directory-optout. At exactly 2026-08-15T00:00:00.000Z the opt-out is
          accepted and directory_optout_effective becomes true; at 2026-08-15T00:00:00.001Z the
          identical payload is refused with 422. An implementation using a strict < comparison or
          truncating to whole days fails one of the two calls.
        test_recipe:
          setup:
            - "CA rule with directory_optout_grace_days 14."
            - "Two minor students created at the default 2026-08-01T00:00:00Z clock, so both carry directory_optout_deadline_at 2026-08-15T00:00:00.000Z."
            - "The clock is then parked exactly on the deadline for the first call."
          setup_api_calls:
            - call: "POST /records-office/state-rules"
              payload: { state_code: "CA", transfer_response_days: 10, discipline_inclusion_mode: "SUSPENSIONS_AND_EXPULSIONS", discipline_min_days_removed: 10, include_pending_investigations: false, sped_requires_consent: true, amendment_hearing_days: 30, destruction_min_age_years: 5, directory_optout_grace_days: 14, notification_wait_days: 7 }
              as: SystemAdmin
            - call: "POST /records-office/districts"
