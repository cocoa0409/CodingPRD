          - errors[ERR_STALE_BOOKING_VERSION]
          - validations[priority 21]
        distinguishing_aspect: "The first acceptance is what invalidates the client's view: a second acceptance replaying the pre-acceptance booking version is rejected 412, and re-reading the booking makes the identical call succeed, so the money lands exactly once per offer."
        test_recipe:
