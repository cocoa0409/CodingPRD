              captures: { ktid: $.data.id }
            - call: "POST /drone-ops/knowledge-tests/${ktid}/grade"
              payload: { raw_score: 87 }
              as: ComplianceOfficer
            - call: "POST /drone-ops/aircraft"
              payload: { owner_pilot_id: "${pid}", model: "Cond 1", serial_number: "SN-CND-01", takeoff_weight_g: 249, max_altitude_ft: 900 }
              as: Pilot
              as_user_id: "${pid}"
              captures: { acid: $.data.id }
            - call: "POST /drone-ops/aircraft/${acid}/register"
              payload: {}
              as: ComplianceOfficer
            - call: "POST /drone-ops/insurance-policies"
              payload: { pilot_id: "${pid}", insurer_name: "Northwind Aviation", policy_number: "POL-CND-01", coverage_limit_cents: 2000000, deductible_cents: 50000, effective_from: "2026-05-01T00:00:00Z", effective_until: "2027-05-01T00:00:00Z", indemnification_clause_accepted: true }
              as: Pilot
