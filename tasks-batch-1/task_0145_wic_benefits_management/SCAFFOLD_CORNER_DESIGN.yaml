  # ===========================================================================
  - section: cross_cutting_complexity_layers
    instances:
      - name: occ_stale_clinic_version_on_appointment
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.appointment-schedule-stale-clinic
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "After scheduling appointment #1 (clinic.version advances to 2), a second POST /clinic-appointments still carrying expected_clinic_version equal to the pre-advance value is rejected with ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["Clinic created (version 1); one appointment scheduled, bumping version to 2; the captured pre-advance version is reused."]
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "Agency OCC1", state_code: "CA", caseload_cap: 25 }
              as: EligibilityClerk
              as_user_id: clerk1
              captures: { agency_id: $.data.id }
            - call: "POST /clinics"
              payload: { agency_id: "${agency_id}", name: "Clinic OCC1", appointment_buffer_minutes: 0 }
              as: EligibilityClerk
              as_user_id: clerk1
              captures: { clinic_id: $.data.id }
            - call: "POST /households"
              payload: { agency_id: "${agency_id}", household_size: 3, adjunctive_program: "SNAP" }
              as: EligibilityClerk
              as_user_id: clerk1
              captures: { hh_id: $.data.id }
            - call: "POST /participants"
              payload: { household_id: "${hh_id}", full_name: "OCC Kid", ssn_last4: "1414", category: "CHILD" }
              as: EligibilityClerk
              as_user_id: clerk1
              captures: { p_id: $.data.id }
            - call: "GET /clinics/${clinic_id}"
              payload: {}
              as: EligibilityClerk
              as_user_id: clerk1
              captures: { clinic_ver_pre: $.data.version }
            - call: "POST /clinic-appointments"
              payload: { clinic_id: "${clinic_id}", participant_id: "${p_id}", purpose: "INITIAL_CERT", start_utc: "2026-03-10T09:00:00.000Z", end_utc: "2026-03-10T09:30:00.000Z", expected_clinic_version: "${clinic_ver_pre}" }
              as: EligibilityClerk
              as_user_id: clerk1
          trigger:
            - call: "POST /clinic-appointments"
              payload: { clinic_id: "${clinic_id}", participant_id: "${p_id}", purpose: "NUTRITION_ED", start_utc: "2026-03-10T11:00:00.000Z", end_utc: "2026-03-10T11:30:00.000Z", expected_clinic_version: "${clinic_ver_pre}" }
              as: EligibilityClerk
              as_user_id: clerk1
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 412"
            - "response.data.error_id == ERR_STALE_VERSION"

      - name: occ_stale_participant_version_on_food_prescription
        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules.foodprescription-issue-stale-participant
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "After one food-prescription issuance bumps participant.version, a second POST /food-prescriptions reusing the pre-issuance participant version is rejected with ERR_STALE_VERSION (412)."
        test_recipe:
          setup: ["Certified PREGNANT participant; one prescription issued (participant.version bumped); the pre-issuance version is reused."]
          setup_api_calls:
            - call: "POST /agencies"
              payload: { name: "Agency OCC2", state_code: "CA", caseload_cap: 25 }
              as: EligibilityClerk
              as_user_id: clerk1
              captures: { agency_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { agency_id: "${agency_id}", to_iso8601: "2026-03-02T00:00:00.000Z" }
              as: EligibilityClerk
              as_user_id: clerk1
            - call: "POST /households"
              payload: { agency_id: "${agency_id}", household_size: 2, pregnancy_count: 1, adjunctive_program: "MEDICAID" }
              as: EligibilityClerk
              as_user_id: clerk1
              captures: { hh_id: $.data.id }
            - call: "POST /participants"
              payload: { household_id: "${hh_id}", full_name: "OCC Preg", ssn_last4: "1515", category: "PREGNANT" }
              as: EligibilityClerk
              as_user_id: clerk1
              captures: { p_id: $.data.id }
            - call: "POST /applications"
              payload: { participant_id: "${p_id}" }
              as: EligibilityClerk
              as_user_id: clerk1
              captures: { app_id: $.data.id }
            - call: "POST /income-records"
              payload: { application_id: "${app_id}", gross_amount_cents: 150000, pay_frequency: "MONTHLY" }
              as: EligibilityClerk
              as_user_id: clerk1
            - call: "POST /applications/${app_id}/determine-income"
              payload: {}
              as: EligibilityClerk
              as_user_id: clerk1
            - call: "POST /applications/${app_id}/assess-risk"
              payload: { risk_factor_codes: ["GEST_DIABETES"] }
              as: CompetentProfessionalAuthority
              as_user_id: cpa1
            - call: "POST /applications/${app_id}/approve"
              payload: {}
              as: CompetentProfessionalAuthority
              as_user_id: cpa1
            - call: "GET /certifications"
              payload: {}
              as: CompetentProfessionalAuthority
              as_user_id: cpa1
              captures: { cert_id: "$.data[0].id" }
            - call: "GET /participants/${p_id}"
              payload: {}
              as: CompetentProfessionalAuthority
              as_user_id: cpa1
              captures: { p_ver_pre: $.data.version }
            - call: "POST /food-prescriptions"
              payload: { certification_id: "${cert_id}", issuance_mode: "FULL", line_items: [{food_category: "MILK", requested_units: 4}], expected_participant_version: "${p_ver_pre}" }
              as: CompetentProfessionalAuthority
              as_user_id: cpa1
          trigger:
            - call: "POST /food-prescriptions"
              payload: { certification_id: "${cert_id}", issuance_mode: "FULL", line_items: [{food_category: "EGGS", requested_units: 2}], expected_participant_version: "${p_ver_pre}" }
              as: CompetentProfessionalAuthority
              as_user_id: cpa1
              captures: { err: $.data.error_id }
          assert:
            - "response.status == 412"
            - "response.data.error_id == ERR_STALE_VERSION"

      - name: cascade_chain_terminate_covered
        claim_type: cascading_side_effects
        grounds:
          - state_machines.Certification.ACTIVE_to_TERMINATED
        excluded_because:
          difficulty_instance: transitive_cascade / terminate_to_prescription_to_ebt_depth3
          rationale: "The terminate -> prescription void -> EBT recompute cascade is fully exercised by the named §1.8 instance."

      - name: derived_remaining_value_reconciliation_covered
        claim_type: derived_field_reconciliation
        grounds:
          - calculations.ebt_reconciliation
        excluded_because:
          difficulty_instance: compensating_invariant / ebt_value_units_conserved_on_void
          rationale: "EBT remaining_value_cents derived-field reconciliation is asserted by the named §1.8 instance."

