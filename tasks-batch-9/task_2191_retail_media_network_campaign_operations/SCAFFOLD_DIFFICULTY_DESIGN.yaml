              as: AccountManager
              as_user_id: "am-7"
              captures: { li_user_id: $.data.id, li_user_v: $.data.version }
            - call: "POST /rmn/product-assignments"
              payload: { line_item_id: "${li_user_id}", catalog_product_id: "${prod_id}", is_hero: true, expected_line_item_version: "${li_user_v}" }
              as: CatalogOps
              as_user_id: "co-4"
            - call: "POST /rmn/line-items/${li_user_id}/submit-eligibility"
