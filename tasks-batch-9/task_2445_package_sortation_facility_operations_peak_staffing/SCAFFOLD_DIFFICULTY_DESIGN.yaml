            - call: "POST /sortation/sort-centers/${center_id}/sort-chutes"
              payload: { chute_number: "C1", throughput_pph: 900 }
              as: FacilityAdmin
            - call: "POST /sortation/sort-centers/${center_id}/sort-chutes"
              payload: { chute_number: "C2", throughput_pph: 900 }
              as: FacilityAdmin
            - call: "POST /sortation/sort-centers/${center_id}/shift-plans"
              payload: { shift_date: "2026-08-03", shift_window_start: "2026-08-03T06:00:00Z", shift_window_end: "2026-08-03T14:00:00Z", forecast_volume: 96000, planned_core_headcount: 20, planned_seasonal_headcount: 0, labor_budget_cents: 500000 }
              as: LaborPlanner
              as_user_id: "u_planner_1"
              captures: { plan_id: $.data.id }
          trigger:
            - call: "POST /sortation/shift-plans/${plan_id}/submit"
              payload: {}
              as: LaborPlanner
              as_user_id: "u_planner_1"
          assert:
            - "SortCenter.${center_id}.ops_posture == RESTRICTED at creation, with no jam and no injury"
            - "ShiftPlan.${plan_id}.required_headcount == 19"
            - "ShiftPlan.${plan_id}.required_headcount != 20"
            - "ShiftPlan.${plan_id}.shift_hours == 8.00"
            - "ShiftPlan.${plan_id}.status == SUBMITTED and submitted_by_user_id == u_planner_1"

  # =====================================================================
  # Rule 3 - non-linear state machines (parallel, branching+cyclic, counted cycle)
  # =====================================================================
  - rule_id: non_linear_state_machine
    instances:
      - name: outbound_load_parallel_load_and_seal_dimensions
        grounds:
          - state_machines.OutboundLoad.load_status
          - state_machines.OutboundLoad.seal_status
          - state_machines.OutboundLoad.LOADED_to_DISPATCHED
          - validations.32_ERR_LOAD_NOT_SEALED
          - endpoints.POST_/sortation/package-exceptions
        distinguishing_aspect: |
          OutboundLoad carries two independent state dimensions. seal_status cycles
          UNSEALED -> SEALED -> BROKEN -> SEALED driven by an exception filed against the load, while
          load_status stays LOADED throughout; dispatch is the join point that reads both dimensions,
          so the same LOADED load is dispatchable, then not dispatchable, then dispatchable again
          without load_status ever changing.
        test_recipe:
          setup:
            - "Center SC1 (automation 70, flex_pool_total 20), inbound door IN-1, outbound door OUT-1, chute C1, lane L-WEST mapped to C1 for 06:00-14:00"
            - "A trailer with manifest_package_count 3000 fully unloaded (wip 3000)"
            - "An outbound load with trailer_cube_cuft 3800 and dispatch_cut_time 13:00, scanned with 100 SMALL packages (load_status LOADING), then closed (LOADED), then sealed with SEAL-A (seal_status SEALED)"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T06:00:00Z" }
              as: FacilityAdmin
            - call: "POST /sortation/sort-centers"
              payload: { code: "SC1", name: "Memphis Sort 1", automation_utilization_pct: 70, flex_pool_total: 20 }
              as: FacilityAdmin
              captures: { center_id: $.data.id }
            - call: "POST /sortation/sort-centers/${center_id}/dock-doors"
              payload: { door_number: "IN-1", kind: "INBOUND" }
              as: FacilityAdmin
              captures: { door_in_id: $.data.id }
            - call: "POST /sortation/sort-centers/${center_id}/dock-doors"
              payload: { door_number: "OUT-1", kind: "OUTBOUND" }
              as: FacilityAdmin
              captures: { door_out_id: $.data.id }
            - call: "POST /sortation/sort-centers/${center_id}/sort-chutes"
              payload: { chute_number: "C1", throughput_pph: 1200 }
              as: FacilityAdmin
              captures: { chute1_id: $.data.id, chute1_v: $.data.version }
            - call: "POST /sortation/sort-centers/${center_id}/destination-lanes"
              payload: { lane_code: "L-WEST", region: "WEST", service_class: "GROUND", forecast_hourly_volume: 3000 }
              as: FacilityAdmin
              captures: { lane1_id: $.data.id }
            - call: "POST /sortation/chute-assignments"
              payload: { chute_id: "${chute1_id}", destination_lane_id: "${lane1_id}", window_start: "2026-08-03T06:00:00Z", window_end: "2026-08-03T14:00:00Z", expected_chute_version: "${chute1_v}" }
              as: SortSupervisor
            - call: "POST /sortation/trailer-appointments"
              payload: { sort_center_id: "${center_id}", door_id: "${door_in_id}", trailer_code: "T-IN-1", window_start: "2026-08-03T06:00:00Z", window_end: "2026-08-03T07:00:00Z", priority_class: "STANDARD", manifest_package_count: 3000 }
              as: InboundCoordinator
              captures: { appt_id: $.data.id }
            - call: "POST /sortation/trailer-appointments/${appt_id}/arrive"
              payload: {}
              as: InboundCoordinator
            - call: "POST /sortation/trailer-appointments/${appt_id}/start-unload"
              payload: {}
              as: InboundCoordinator
            - call: "POST /sortation/trailer-appointments/${appt_id}/complete-unload"
              payload: {}
              as: InboundCoordinator
            - call: "POST /sortation/outbound-loads"
              payload: { sort_center_id: "${center_id}", door_id: "${door_out_id}", destination_lane_id: "${lane1_id}", trailer_code: "T-OUT-1", trailer_cube_cuft: 3800, dispatch_cut_time: "2026-08-03T13:00:00Z" }
              as: SortSupervisor
              captures: { load_id: $.data.id }
            - call: "POST /sortation/outbound-loads/${load_id}/scan-packages"
              payload: { small_count: 100 }
              as: SortSupervisor
            - call: "POST /sortation/outbound-loads/${load_id}/close-load"
              payload: {}
              as: SortSupervisor
            - call: "POST /sortation/outbound-loads/${load_id}/seal"
              payload: { seal_code: "SEAL-A" }
              as: SortSupervisor
          trigger:
            - call: "POST /sortation/package-exceptions"
              payload: { sort_center_id: "${center_id}", exception_type: "DAMAGED", package_count: 25, outbound_load_id: "${load_id}" }
              as: SortSupervisor
            - call: "POST /sortation/outbound-loads/${load_id}/dispatch"
              payload: {}
              as: OpsManager
            - call: "POST /sortation/outbound-loads/${load_id}/seal"
              payload: { seal_code: "SEAL-B" }
              as: SortSupervisor
            - call: "POST /sortation/outbound-loads/${load_id}/dispatch"
              payload: {}
              as: OpsManager
          assert:
            - "after the exception create OutboundLoad.${load_id}.seal_status == BROKEN, seal_code == null, and load_status is STILL LOADED (the dimensions moved independently)"
            - "the first dispatch attempt returns ERR_LOAD_NOT_SEALED with HTTP 409 and leaves load_status == LOADED and seal_status == BROKEN"
            - "after the re-seal OutboundLoad.${load_id}.seal_status == SEALED, seal_code == SEAL-B, load_status == LOADED"
            - "after the second dispatch OutboundLoad.${load_id}.load_status == DISPATCHED, seal_status == SEALED, dispatched_at == 2026-08-03T06:00:00Z"
            - "OutboundLoad.${load_id}.package_count == 100 and cube_used_cuft == 33.50 throughout the trigger (no scan happened)"
            - "SortCenter.${center_id}.exception_hold_count == 25 and wip_package_count == 2875"

      - name: shift_plan_branching_fork_and_revision_cycle
        grounds:
          - state_machines.ShiftPlan.SUBMITTED_to_REJECTED
          - state_machines.ShiftPlan.REJECTED_to_DRAFT
          - state_machines.ShiftPlan.SUBMITTED_to_APPROVED
          - calculations.required_headcount
          - calculations.flex_pool_conservation_invariant
        distinguishing_aspect: |
          A different shape from the parallel OutboundLoad instance: ShiftPlan forks at SUBMITTED into
          two branches with deliberately divergent side-effect sets (REJECTED reserves no flex at all,
          APPROVED reserves flex and prices the plan) and then closes the revision cycle
          DRAFT -> SUBMITTED -> REJECTED -> DRAFT, where the revise clears required_headcount and the
          submitter identity so the second pass through the fork recomputes from the new forecast.
        test_recipe:
          setup:
            - "Center SC1 (automation 70, flex_pool_total 20) with a single chute C1"
            - "ShiftPlan 2026-08-03 06:00-14:00, forecast_volume 4000, planned_core_headcount 4, planned_seasonal_headcount 0, labor_budget_cents 200000, submitted by u_planner_1 so required_headcount == 4"
            - "The plan is rejected by u_ops_1 and then revised by u_planner_2 to forecast_volume 40000 with planned_core_headcount 2"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T05:00:00Z" }
              as: FacilityAdmin
            - call: "POST /sortation/sort-centers"
              payload: { code: "SC1", name: "Memphis Sort 1", automation_utilization_pct: 70, flex_pool_total: 20 }
              as: FacilityAdmin
              captures: { center_id: $.data.id }
            - call: "POST /sortation/sort-centers/${center_id}/sort-chutes"
              payload: { chute_number: "C1", throughput_pph: 1200 }
              as: FacilityAdmin
            - call: "POST /sortation/sort-centers/${center_id}/shift-plans"
              payload: { shift_date: "2026-08-03", shift_window_start: "2026-08-03T06:00:00Z", shift_window_end: "2026-08-03T14:00:00Z", forecast_volume: 4000, planned_core_headcount: 4, planned_seasonal_headcount: 0, labor_budget_cents: 200000 }
              as: LaborPlanner
              as_user_id: "u_planner_1"
              captures: { plan_id: $.data.id }
            - call: "POST /sortation/shift-plans/${plan_id}/submit"
              payload: {}
              as: LaborPlanner
              as_user_id: "u_planner_1"
            - call: "POST /sortation/shift-plans/${plan_id}/reject"
              payload: { rejection_reason: "forecast understated for the peak week" }
              as: OpsManager
              as_user_id: "u_ops_1"
            - call: "GET /sortation/sort-centers/${center_id}"
              payload: {}
              as: OpsManager
              as_user_id: "u_ops_1"
              captures: { center_v_after_reject: $.data.version }
            - call: "POST /sortation/shift-plans/${plan_id}/revise"
              payload: { forecast_volume: 40000, planned_core_headcount: 2 }
              as: LaborPlanner
              as_user_id: "u_planner_2"
          trigger:
            - call: "POST /sortation/shift-plans/${plan_id}/submit"
              payload: {}
              as: LaborPlanner
              as_user_id: "u_planner_2"
            - call: "POST /sortation/shift-plans/${plan_id}/approve"
              payload: { expected_center_version: "${center_v_after_reject}" }
              as: OpsManager
              as_user_id: "u_ops_1"
          assert:
            - "on the REJECTED branch the plan had status == REJECTED, rejection_reason == 'forecast understated for the peak week', flex_draw_count == 0, planned_labor_cents == 0"
            - "the REJECTED branch left SortCenter.${center_id}.flex_pool_available == 20 and flex_pool_reserved == 0 (divergent from the APPROVED branch)"
            - "after the revise the plan had status == DRAFT, required_headcount == 0, submitted_by_user_id == null, rejection_reason == null, forecast_volume == 40000, planned_core_headcount == 2"
            - "after the trigger submit ShiftPlan.${plan_id}.required_headcount == 6 (recomputed from the revised forecast, not the original 4)"
            - "after the trigger approve ShiftPlan.${plan_id}.status == APPROVED, flex_draw_count == 4, planned_labor_cents == 127411, provisional_cost_per_package_cents == 3.49"
            - "SortCenter.${center_id}.flex_pool_available == 16 and flex_pool_reserved == 4, and flex_pool_total 20 == 16 + 4"
            - "ShiftPlan.${plan_id}.submitted_by_user_id == u_planner_2 and approved_by_user_id == u_ops_1 (the OCC version captured before the revise is still current because reject and revise never touch the center)"

      - name: trailer_jam_cycle_bounded_by_retry_limit
        grounds:
          - state_machines.TrailerAppointment.UNLOADING_to_JAM_HELD
          - state_machines.TrailerAppointment.JAM_HELD_to_UNLOADING
          - entities.TrailerAppointment.fields.jam_count
          - validations.29_ERR_JAM_RETRY_LIMIT_REACHED
          - calculations.lane_pressure
        distinguishing_aspect: |
          A counted cycle, unlike the parallel dimensions and the fork-plus-revision shapes: the
          appointment loops UNLOADING <-> JAM_HELD three times, jam_count is monotonically increasing
          and is deliberately NOT decremented by the compensating resume, so the fourth jam-hold is
          refused by the retry limit while the appointment stays in UNLOADING and can still complete.
        test_recipe:
          setup:
            - "Center SC1 (automation 70) with inbound door IN-1, chute C1 (1200 pph) and lane L-WEST (forecast_hourly_volume 3000) assigned to C1 for 06:00-14:00"
            - "One trailer appointment with manifest_package_count 3000 in status UNLOADING"
            - "Three complete jam-hold / resume-unload cycles already performed, so jam_count == 3, status == UNLOADING, chute C1 back to ACTIVE and lane backlog back to 0"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T06:00:00Z" }
              as: FacilityAdmin
            - call: "POST /sortation/sort-centers"
              payload: { code: "SC1", name: "Memphis Sort 1", automation_utilization_pct: 70, flex_pool_total: 20 }
              as: FacilityAdmin
              captures: { center_id: $.data.id }
            - call: "POST /sortation/sort-centers/${center_id}/dock-doors"
              payload: { door_number: "IN-1", kind: "INBOUND" }
              as: FacilityAdmin
              captures: { door_in_id: $.data.id }
            - call: "POST /sortation/sort-centers/${center_id}/sort-chutes"
              payload: { chute_number: "C1", throughput_pph: 1200 }
              as: FacilityAdmin
              captures: { chute1_id: $.data.id, chute1_v: $.data.version }
            - call: "POST /sortation/sort-centers/${center_id}/destination-lanes"
              payload: { lane_code: "L-WEST", region: "WEST", service_class: "GROUND", forecast_hourly_volume: 3000 }
              as: FacilityAdmin
              captures: { lane1_id: $.data.id }
            - call: "POST /sortation/chute-assignments"
              payload: { chute_id: "${chute1_id}", destination_lane_id: "${lane1_id}", window_start: "2026-08-03T06:00:00Z", window_end: "2026-08-03T14:00:00Z", expected_chute_version: "${chute1_v}" }
              as: SortSupervisor
              captures: { ca1_id: $.data.id }
            - call: "POST /sortation/trailer-appointments"
              payload: { sort_center_id: "${center_id}", door_id: "${door_in_id}", trailer_code: "T-IN-1", window_start: "2026-08-03T06:00:00Z", window_end: "2026-08-03T07:00:00Z", priority_class: "STANDARD", manifest_package_count: 3000 }
              as: InboundCoordinator
              captures: { appt_id: $.data.id }
            - call: "POST /sortation/trailer-appointments/${appt_id}/arrive"
              payload: {}
              as: InboundCoordinator
            - call: "POST /sortation/trailer-appointments/${appt_id}/start-unload"
              payload: {}
              as: InboundCoordinator
            - call: "POST /sortation/trailer-appointments/${appt_id}/jam-hold"
              payload: { chute_id: "${chute1_id}", jam_reason: "BELT_JAM_1" }
              as: InboundCoordinator
            - call: "POST /sortation/trailer-appointments/${appt_id}/resume-unload"
              payload: { chute_id: "${chute1_id}" }
              as: InboundCoordinator
            - call: "POST /sortation/trailer-appointments/${appt_id}/jam-hold"
              payload: { chute_id: "${chute1_id}", jam_reason: "BELT_JAM_2" }
              as: InboundCoordinator
            - call: "POST /sortation/trailer-appointments/${appt_id}/resume-unload"
              payload: { chute_id: "${chute1_id}" }
              as: InboundCoordinator
            - call: "POST /sortation/trailer-appointments/${appt_id}/jam-hold"
              payload: { chute_id: "${chute1_id}", jam_reason: "BELT_JAM_3" }
              as: InboundCoordinator
            - call: "POST /sortation/trailer-appointments/${appt_id}/resume-unload"
              payload: { chute_id: "${chute1_id}" }
              as: InboundCoordinator
          trigger:
            - call: "POST /sortation/trailer-appointments/${appt_id}/jam-hold"
              payload: { chute_id: "${chute1_id}", jam_reason: "BELT_JAM_4" }
              as: InboundCoordinator
            - call: "POST /sortation/trailer-appointments/${appt_id}/complete-unload"
              payload: {}
              as: InboundCoordinator
          assert:
            - "before the trigger TrailerAppointment.${appt_id}.status == UNLOADING and jam_count == 3 (the three resumes did not decrement the retry counter)"
            - "the fourth jam-hold returns ERR_JAM_RETRY_LIMIT_REACHED with HTTP 409"
            - "the refused jam-hold changes nothing: status stays UNLOADING, jam_count stays 3, SortChute.${chute1_id}.status == ACTIVE with jam_hold_count == 3, ChuteAssignment.${ca1_id}.status == ACTIVE"
            - "DestinationLane.${lane1_id}.backlog_package_count == 0 and lane_pressure_ratio == 0.0000 after the third resume (each cycle restored the backlog exactly)"
            - "SortCenter.${center_id}.open_jam_count == 0 and ops_posture == OPEN before the trigger (never FROZEN, since only one appointment was ever held at a time)"
            - "the follow-up complete-unload succeeds: status == UNLOADED, SortCenter.${center_id}.wip_package_count == 3000, packages_inducted_count == 3000"

  # =====================================================================
  # Rule 4 - transitive cascades with different triggers and depths
  # =====================================================================
  - rule_id: transitive_cascade
    instances:
      - name: jam_hold_depth4_cascade_to_center_posture
        grounds:
          - state_machines.TrailerAppointment.UNLOADING_to_JAM_HELD
          - state_machines.ChuteAssignment.ACTIVE_to_SUSPENDED
          - calculations.lane_pressure
          - calculations.ops_posture_derivation
          - endpoints.POST_/sortation/trailer-appointments/{id}/jam-hold
        distinguishing_aspect: |
          Depth-4 cascade off one jam-hold call: L1 appointment -> L2 chute -> L3 every ACTIVE chute
          assignment on that chute -> L4 each assignment's destination lane backlog, capacity and
          pressure ratio -> L5 the center's open_jam_count and derived ops_posture. Two lanes are
          attached to the jammed chute so the L3/L4 fan-out is observable on both.
        test_recipe:
          setup:
            - "Center SC1 (automation 70, posture OPEN) with inbound door IN-1"
            - "Chute C1 with throughput_pph 1200 and max_concurrent_destinations 2"
            - "Lanes L-WEST (forecast_hourly_volume 3000) and L-EAST (forecast_hourly_volume 1200), each with an ACTIVE ChuteAssignment on C1 for 06:00-14:00"
            - "One trailer appointment in status UNLOADING on IN-1"
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T06:00:00Z" }
              as: FacilityAdmin
            - call: "POST /sortation/sort-centers"
              payload: { code: "SC1", name: "Memphis Sort 1", automation_utilization_pct: 70, flex_pool_total: 20 }
              as: FacilityAdmin
              captures: { center_id: $.data.id }
            - call: "POST /sortation/sort-centers/${center_id}/dock-doors"
              payload: { door_number: "IN-1", kind: "INBOUND" }
              as: FacilityAdmin
              captures: { door_in_id: $.data.id }
            - call: "POST /sortation/sort-centers/${center_id}/sort-chutes"
              payload: { chute_number: "C1", throughput_pph: 1200, max_concurrent_destinations: 2 }
              as: FacilityAdmin
              captures: { chute1_id: $.data.id, chute1_v: $.data.version }
