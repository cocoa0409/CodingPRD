  - method: GET
    path: "/distributors/{did}/booking-agreements/{baid}/box-office-reports/{rid}"
    description: "Read BoxOfficeReport"
    roles: [PlatformAdmin, Booker, Exhibitor, SettlementClerk, Auditor]
    code: 200
    input: []
    output: BoxOfficeReport
    side_effects: []

  - method: GET
    path: "/distributors/{did}/booking-agreements/{id}/box-office-reports"
    description: "List reports for agreement"
    roles: [PlatformAdmin, Booker, Exhibitor, SettlementClerk, Auditor]
    code: 200
    input: ["limit?", "offset?", "status?", "week_index?", "booking_agreement_id?"]
    output: "BoxOfficeReport[]"
    side_effects: []

  - method: POST
    path: "/distributors/{did}/booking-agreements/{baid}/box-office-reports/{rid}/submit"
    description: "Submit a DRAFT report"
    roles: [Exhibitor]
    code: 200
    input: []
    output: BoxOfficeReport
    side_effects: ["status → SUBMITTED"]

  - method: POST
    path: "/distributors/{did}/booking-agreements/{baid}/box-office-reports/{rid}/void"
    description: "Void a DRAFT or SUBMITTED report"
    roles: [Exhibitor, Booker]
    code: 200
    input: []
    output: BoxOfficeReport
    side_effects: ["status → VOIDED; recomputes any PROVISIONAL Settlement gross"]

  # --- Settlement ---
  - method: GET
    path: "/distributors/{did}/booking-agreements/{baid}/settlements/{sid}"
    description: "Read Settlement"
    roles: [PlatformAdmin, Booker, Exhibitor, SettlementClerk, Auditor]
    code: 200
    input: []
    output: Settlement
    side_effects: []

  - method: GET
    path: "/distributors/{did}/booking-agreements/{id}/settlements"
    description: "List settlements for agreement"
    roles: [PlatformAdmin, Booker, Exhibitor, SettlementClerk, Auditor]
    code: 200
    input: ["limit?", "offset?", "status?", "week_index?", "variant?", "booking_agreement_id?"]
    output: "Settlement[]"
    side_effects: []

  - method: POST
    path: "/distributors/{did}/booking-agreements/{baid}/settlements/{sid}/mark_settled"
    description: "Mark settlement settled (exhibitor paid)"
    roles: [SettlementClerk]
    code: 200
    input: []
    output: Settlement
    side_effects: ["status → SETTLED; BookingAgreement.weeks_played += 1; current_week_rental_pct recomputed"]

  - method: POST
    path: "/distributors/{did}/booking-agreements/{baid}/settlements/{sid}/dispute"
    description: "Dispute a settlement"
    roles: [Exhibitor]
    code: 200
    input: []
    output: Settlement
    side_effects: ["status → DISPUTED; Distributor.lifecycle_posture → FROZEN"]

  - method: POST
    path: "/distributors/{did}/booking-agreements/{baid}/settlements/{sid}/resolve_dispute"
    description: "Resolve a disputed settlement"
    roles: [SettlementClerk]
    code: 200
    input: []
    output: Settlement
    side_effects: ["status → FINALIZED; if no other DISPUTED, Distributor.lifecycle_posture → ACTIVE"]

  - method: POST
    path: "/distributors/{did}/booking-agreements/{baid}/settlements/{sid}/write_off"
    description: "Write off a settlement (bad debt)"
    roles: [SettlementClerk]
    code: 200
    input: []
    output: Settlement
    side_effects: ["status → WRITTEN_OFF; weeks_played += 1"]

  # --- HoldoverDecision ---
  - method: GET
    path: "/distributors/{did}/booking-agreements/{id}/holdover-decisions"
    description: "List holdover decisions for agreement"
    roles: [PlatformAdmin, Booker, Exhibitor, Auditor]
    code: 200
    input: ["limit?", "offset?", "decision?", "booking_agreement_id?"]
    output: "HoldoverDecision[]"
    side_effects: []

  # --- MarketingCommitment ---
  - method: POST
    path: "/distributors/{did}/markets/{mid}/marketing-commitments"
    description: "Create a marketing co-op commitment"
    roles: [MarketingLead]
    code: 201
    input: [film_id, "theatre_id?", committed_cents, coop_share_pct]
    output: MarketingCommitment
    side_effects: ["status=DRAFT, spent_cents=0"]

  - method: GET
    path: "/distributors/{did}/markets/{mid}/marketing-commitments/{mcid}"
    description: "Read MarketingCommitment"
    roles: [PlatformAdmin, Booker, MarketingLead, Auditor]
    code: 200
    input: []
    output: MarketingCommitment
    side_effects: []

  - method: GET
    path: "/distributors/{did}/markets/{id}/marketing-commitments"
    description: "List commitments for market"
    roles: [PlatformAdmin, Booker, MarketingLead, Auditor]
    code: 200
    input: ["limit?", "offset?", "film_id?", "theatre_id?", "status?", "market_id?"]
    output: "MarketingCommitment[]"
    side_effects: []

  - method: GET
    path: "/distributors/{did}/marketing-commitments"
    description: "List commitments across the distributor (filtered by film/theatre/market)"
    roles: [PlatformAdmin, Booker, MarketingLead, Auditor]
    code: 200
    input: ["limit?", "offset?", "film_id?", "theatre_id?", "market_id?", "status?"]
    output: "MarketingCommitment[]"
    side_effects: []

  - method: GET
    path: "/distributors/{did}/films/{id}/marketing-commitments"
    description: "Sub-resource: commitments for a given film"
    roles: [PlatformAdmin, Booker, MarketingLead, Auditor]
    code: 200
    input: ["limit?", "offset?"]
    output: "MarketingCommitment[]"
    side_effects: []

  - method: GET
    path: "/distributors/{did}/theatres/{id}/marketing-commitments"
    description: "Sub-resource: commitments for a given theatre"
    roles: [PlatformAdmin, Booker, MarketingLead, Auditor]
    code: 200
    input: ["limit?", "offset?"]
    output: "MarketingCommitment[]"
    side_effects: []

  - method: POST
    path: "/distributors/{did}/markets/{mid}/marketing-commitments/{mcid}/commit"
    description: "Commit a draft (validates budget cap)"
    roles: [MarketingLead]
    code: 200
    input: []
    output: MarketingCommitment
    side_effects: ["status → COMMITTED; Market.coop_committed_cents += committed_cents"]

  - method: POST
    path: "/distributors/{did}/markets/{mid}/marketing-commitments/{mcid}/cancel"
    description: "Cancel a draft or unspent commitment"
    roles: [MarketingLead]
    code: 200
    input: []
    output: MarketingCommitment
    side_effects: ["status → CANCELLED; decrement coop_committed_cents if was COMMITTED"]

  # --- ZoneClearance ---
  - method: POST
    path: "/distributors/{did}/markets/{mid}/zone-clearances"
    description: "Grant a zone clearance"
    roles: [Booker]
    code: 201
    input: [film_id, theatre_id, clearance_radius_km, effective_from_utc, effective_until_utc, "parent_dispute_id?"]
    output: ZoneClearance
    side_effects: ["status=GRANTED"]

  - method: GET
    path: "/distributors/{did}/markets/{mid}/zone-clearances/{zid}"
    description: "Read ZoneClearance"
    roles: [PlatformAdmin, Booker, Exhibitor, Auditor]
    code: 200
    input: []
    output: ZoneClearance
    side_effects: []

  - method: GET
    path: "/distributors/{did}/markets/{id}/zone-clearances"
    description: "List clearances for market"
    roles: [PlatformAdmin, Booker, Exhibitor, Auditor]
    code: 200
    input: ["limit?", "offset?", "film_id?", "theatre_id?", "status?", "market_id?", "parent_dispute_id?"]
    output: "ZoneClearance[]"
    side_effects: []

  - method: GET
    path: "/distributors/{did}/zone-clearances"
    description: "List clearances across the distributor (filtered by film/theatre/parent_dispute)"
    roles: [PlatformAdmin, Booker, Exhibitor, Auditor]
    code: 200
    input: ["limit?", "offset?", "film_id?", "theatre_id?", "market_id?", "status?", "parent_dispute_id?"]
    output: "ZoneClearance[]"
    side_effects: []

  - method: GET
    path: "/distributors/{did}/films/{id}/zone-clearances"
    description: "Sub-resource: clearances for a given film"
    roles: [PlatformAdmin, Booker, Exhibitor, Auditor]
    code: 200
    input: ["limit?", "offset?"]
    output: "ZoneClearance[]"
    side_effects: []

  - method: GET
    path: "/distributors/{did}/theatres/{id}/zone-clearances"
    description: "Sub-resource: clearances granted to a given theatre"
    roles: [PlatformAdmin, Booker, Exhibitor, Auditor]
    code: 200
    input: ["limit?", "offset?"]
    output: "ZoneClearance[]"
    side_effects: []

  - method: GET
    path: "/distributors/{did}/zone-clearances/{id}"
    description: "Read a ZoneClearance by id (single-resource GET; enables parent-chain derivation)"
    roles: [PlatformAdmin, Booker, Exhibitor, Auditor]
    code: 200
    input: []
    output: ZoneClearance
    side_effects: []

  - method: GET
    path: "/distributors/{did}/zone-clearances/{id}/children"
    description: "Sub-resource: superseding rulings whose parent_dispute_id points at this clearance"
    roles: [PlatformAdmin, Booker, Exhibitor, Auditor]
    code: 200
    input: ["limit?", "offset?"]
    output: "ZoneClearance[]"
    side_effects: []

  - method: POST
    path: "/distributors/{did}/markets/{mid}/zone-clearances/{zid}/challenge"
    description: "Challenge a granted clearance"
    roles: [Exhibitor]
    code: 200
    input: []
    output: ZoneClearance
    side_effects: ["status → CHALLENGED"]

  - method: POST
    path: "/distributors/{did}/markets/{mid}/zone-clearances/{zid}/rule"
    description: "Rule on a challenged clearance (uphold or overrule)"
    roles: [Booker]
    code: 200
    input: [ruling]
    output: ZoneClearance
    side_effects: ["status → UPHELD or OVERRULED; on OVERRULED, cascade to PROPOSED/COUNTERED bookings for original theatre"]

  # --- AncillaryWindow ---
  - method: POST
    path: "/distributors/{did}/films/{fid}/ancillary-windows"
    description: "Schedule an ancillary window"
    roles: [Booker]
    code: 201
    input: [window_kind, scheduled_start_utc]
    output: AncillaryWindow
    side_effects: ["status=SCHEDULED"]

  - method: GET
    path: "/distributors/{did}/films/{fid}/ancillary-windows/{awid}"
    description: "Read AncillaryWindow"
    roles: [PlatformAdmin, Booker, Auditor]
    code: 200
    input: []
    output: AncillaryWindow
    side_effects: []

  - method: GET
    path: "/distributors/{did}/films/{id}/ancillary-windows"
    description: "List ancillary windows"
    roles: [PlatformAdmin, Booker, Auditor]
    code: 200
    input: ["limit?", "offset?", "window_kind?", "status?", "film_id?"]
    output: "AncillaryWindow[]"
    side_effects: []

  - method: POST
    path: "/distributors/{did}/films/{fid}/ancillary-windows/{awid}/cancel"
    description: "Cancel a scheduled ancillary window"
    roles: [Booker]
    code: 200
    input: []
    output: AncillaryWindow
    side_effects: ["status → CANCELLED"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  # --- Auth ---
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing or malformed X-User-Role / X-User-ID headers"

  - id: ERR_ROLE_FORBIDDEN
    http: 403
    condition: "Role not authorized for this operation"

  - id: ERR_SOD_VIOLATION
    http: 403
    condition: "Segregation-of-duties: same user cannot settle an agreement they created"

  # --- Existence / Referential ---
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Resource not found at the specified path"

  - id: ERR_REFERENTIAL_INTEGRITY
    http: 422
    condition: "Foreign key references a non-existent entity"

  - id: ERR_SCREEN_THEATRE_MISMATCH
    http: 422
    condition: "screen_id's theatre_id does not match request theatre_id"

  # --- Concurrency ---
  - id: ERR_STALE_VERSION
    http: 412
    condition: "expected_<parent>_version does not match current version (OCC)"

  # --- State / Posture ---
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Resource is in wrong state for requested transition"

  - id: ERR_DISTRIBUTOR_FROZEN
    http: 409
    condition: "Distributor.lifecycle_posture == FROZEN; new bookings blocked while a dispute is open"

  - id: ERR_FILM_NOT_BOOKABLE
    http: 409
    condition: "Film.lifecycle_status is not in {PRE_RELEASE, IN_RELEASE, HOLDOVER_PHASE}"

  - id: ERR_THEATRE_INACTIVE
    http: 409
    condition: "Theatre.status is not ACTIVE"

  - id: ERR_SCREEN_UNAVAILABLE
    http: 409
    condition: "Screen already committed to another booking or in MAINTENANCE"

  # --- Zone / KDM ---
  - id: ERR_ZONE_CLEARANCE_CONFLICT
    http: 409
    condition: "Requested theatre lies within another UPHELD zone clearance's radius and closed-interval window"

  - id: ERR_KDM_WINDOW_CONFLICT
    http: 409
    condition: "Proposed KDM window overlaps another ISSUED/LIVE KDM on the same screen (half-open)"

  - id: ERR_PRINT_NOT_READY
    http: 409
    condition: "BookingAgreement.print_status not in prerequisite state (e.g., KDM requires DCP_DELIVERED)"

  # --- Fiscal / Terms ---
  - id: ERR_INVALID_RENTAL_TERMS
    http: 422
    condition: "week_one_rental_pct outside [0.00, 0.95] OR floor_pct > week_one_rental_pct"

  - id: ERR_COOP_BUDGET_EXCEEDED
    http: 409
    condition: "Marketing commit would push market.coop_committed_cents over 4x weekly budget"

  - id: ERR_WIDE_GATE_NOT_MET
    http: 409
    condition: "WIDE release requires screens_committed >= min_screens_for_wide"

  # --- Temporal ---
  - id: ERR_ANCILLARY_TOO_EARLY
    http: 422
    condition: "AncillaryWindow.scheduled_start_utc < Film.theatrical_window_end"

  - id: ERR_REPORT_OUTSIDE_WINDOW
    http: 422
    condition: "BoxOfficeReport.report_date is not within current or prior week_epoch"

  # --- Holdover ---
  - id: ERR_HOLDOVER_NOT_ELIGIBLE
    http: 409
    condition: "weeks_played < min_weeks_committed (holdover not yet earned)"

  # --- Malformed ---
  - id: ERR_INVALID_REQUEST
    http: 400
    condition: "Malformed request payload; missing required field; invalid enum value"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: PlatformAdmin
    description: "Operator; creates distributor/market/theatre/screen infrastructure; manages clock"
    identity: opaque
    exclusive_operations:
      - "POST /distributors"
      - "POST /distributors/{did}/markets"
      - "POST /distributors/{did}/theatres"
      - "POST /distributors/{did}/theatres/{tid}/screens"
      - "POST /distributors/{did}/theatres/{tid}/suspend"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET read-only access to all resources"

  - name: Booker
    description: "Distributor's booker; negotiates terms, manages films, agreements, DCP, KDM, zone, ancillary, holdover"
    identity: opaque
    exclusive_operations:
      - "POST /distributors/{did}/films"
      - "POST /distributors/{did}/films/{fid}/open_release"
      - "POST /distributors/{did}/films/{fid}/pull"
      - "POST /distributors/{did}/films/{fid}/request_ancillary_handoff"
      - "POST /distributors/{did}/films/{fid}/ancillary-windows"
      - "POST /distributors/{did}/films/{fid}/ancillary-windows/{awid}/cancel"
      - "POST /distributors/{did}/aggregate-deals"
      - "POST /distributors/{did}/aggregate-deals/{aid}/activate"
      - "POST /distributors/{did}/booking-agreements"
      - "POST /distributors/{did}/booking-agreements/{baid}/cancel"
      - "POST /distributors/{did}/booking-agreements/{baid}/holdover"
      - "POST /distributors/{did}/booking-agreements/{baid}/holdover_release"
      - "POST /distributors/{did}/booking-agreements/{baid}/dcp-shipments"
      - "POST /distributors/{did}/booking-agreements/{baid}/dcp-shipments/{sid}/mark_returned"
      - "POST /distributors/{did}/booking-agreements/{baid}/dcp-shipments/{sid}/mark_lost"
      - "POST /distributors/{did}/booking-agreements/{baid}/kdm-keys"
      - "POST /distributors/{did}/booking-agreements/{baid}/kdm-keys/{kid}/extend"
      - "POST /distributors/{did}/booking-agreements/{baid}/kdm-keys/{kid}/revoke"
      - "POST /distributors/{did}/markets/{mid}/zone-clearances"
      - "POST /distributors/{did}/markets/{mid}/zone-clearances/{zid}/rule"
    shared_operations:
      - "POST /distributors/{did}/booking-agreements/{baid}/counter (with Exhibitor)"
      - "POST /distributors/{did}/booking-agreements/{baid}/accept (with Exhibitor)"
      - "POST /distributors/{did}/booking-agreements/{baid}/decline (with Exhibitor)"
      - "POST /distributors/{did}/booking-agreements/{baid}/box-office-reports/{rid}/void (with Exhibitor)"
      - "GET read-only access to all resources"

  - name: Exhibitor
    description: "Theatre circuit representative; counters/accepts terms, reports box office, disputes settlements, challenges clearances"
    identity: opaque
    exclusive_operations:
      - "POST /distributors/{did}/booking-agreements/{baid}/dcp-shipments/{sid}/mark_delivered"
      - "POST /distributors/{did}/booking-agreements/{baid}/box-office-reports"
      - "POST /distributors/{did}/booking-agreements/{baid}/box-office-reports/{rid}/submit"
      - "POST /distributors/{did}/booking-agreements/{baid}/settlements/{sid}/dispute"
      - "POST /distributors/{did}/markets/{mid}/zone-clearances/{zid}/challenge"
    shared_operations:
      - "POST /distributors/{did}/booking-agreements/{baid}/counter (with Booker)"
      - "POST /distributors/{did}/booking-agreements/{baid}/accept (with Booker)"
      - "POST /distributors/{did}/booking-agreements/{baid}/decline (with Booker)"
      - "POST /distributors/{did}/booking-agreements/{baid}/box-office-reports/{rid}/void (with Booker)"
      - "GET read-only access to all resources"

  - name: SettlementClerk
    description: "Back-office role; closes weeks, settles payments; MUST NOT have created the underlying agreement (SoD)"
    identity: opaque
    exclusive_operations:
      - "POST /distributors/{did}/close_box_office_week"
      - "POST /distributors/{did}/booking-agreements/{baid}/settlements/{sid}/mark_settled"
      - "POST /distributors/{did}/booking-agreements/{baid}/settlements/{sid}/resolve_dispute"
      - "POST /distributors/{did}/booking-agreements/{baid}/settlements/{sid}/write_off"
    shared_operations:
      - "GET read-only access to all resources"

  - name: MarketingLead
    description: "Marketing role; manages co-op commitments in a market"
    identity: opaque
    exclusive_operations:
      - "POST /distributors/{did}/markets/{mid}/marketing-commitments"
      - "POST /distributors/{did}/markets/{mid}/marketing-commitments/{mcid}/commit"
      - "POST /distributors/{did}/markets/{mid}/marketing-commitments/{mcid}/cancel"
    shared_operations:
      - "GET read-only access to all resources"

  - name: Auditor
    description: "Read-only audit role"
    identity: opaque
    exclusive_operations: []
    shared_operations:
      - "GET read-only access to all resources"
