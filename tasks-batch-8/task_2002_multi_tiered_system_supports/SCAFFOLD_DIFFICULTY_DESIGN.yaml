            - "Second pause succeeded: plan transitioned ACTIVE→PAUSED→ACTIVE→PAUSED→ACTIVE (cycle is legal)"
            - "Interventionist.committed_minutes_per_week == 90 after final resume (decrement on pause + increment on resume nets to plan cost)"
            - "Plan.version advanced on each transition: v0=1 → v1=2 → v2=3 → v3=4 → v4=5"

      - name: tier_movement_proposed_superseded_proposed_loop
        grounds:
          - state_machines.TierMovement.PROPOSED_to_SUPERSEDED
          - state_machines.TierMovement.transitions
        distinguishing_aspect: |
          TierMovement exhibits branching-with-replacement (non-linear): a second PROPOSED
          movement for the same student SUPERSEDES the first, and the first can never reach
          RATIFIED — parallel sibling lifecycle on TierMovement distinct from StudentPlan's cycle.
        test_recipe:
          setup:
            - "Student T at TIER_2 (ratified via screening path); latest_band supports TIER_3"
            - "TeamMeeting M CONVENED"
          setup_api_calls:
            - call: "POST /districts"
              payload: { name: "D", academic_year: "2025-2026" }
              as: PlatformAdmin
              captures: { d_id: $.data.id }
            - call: "POST /districts/${d_id}/schools"
              payload: { name: "S", grade_span_low: 3, grade_span_high: 5 }
              as: PlatformAdmin
              captures: { s_id: $.data.id }
            - call: "POST /districts/${d_id}/schools/${s_id}/benchmark-cut-points"
              payload: { window_kind: "FALL", grade_level: 3, subject: "READING", tier2_max_score: 100, tier3_max_score: 70 }
              as: DistrictCoordinator
            - call: "POST /districts/${d_id}/schools/${s_id}/screening-windows"
              payload: { window_kind: "FALL", opens_on: "2026-08-01", closes_on: "2026-08-31" }
              as: DistrictCoordinator
              captures: { w_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /districts/${d_id}/schools/${s_id}/students"
              payload: { full_name: "T", grade_level: 3 }
              as: SchoolRegistrar
              captures: { t_id: $.data.id }
            # Score 65 → TIER_3 band, but we'll ratify TIER_2 first then propose TIER_3.
            # Note: eligibility says "TIER_1 → to_tier MUST equal latest_band". So
            # for this setup we need to ratify a TIER_3 first then propose back to TIER_2? No —
            # instead let's use raw=80 (TIER_2 band), ratify TIER_2, then later screen TIER_3 band
            # via a second window. Simpler: skip the screen re-test; propose TIER_3 citing
            # 'teacher observation' — but eligibility requires evidence. Use WINTER window.
            - call: "POST /districts/${d_id}/schools/${s_id}/screening-windows/${w_id}/scores"
              payload: { student_id: "${t_id}", subject: "READING", raw_score: 80 }
              as: Teacher
            - call: "POST /districts/${d_id}/schools/${s_id}/screening-windows/${w_id}/close"
              payload: {}
              as: DistrictCoordinator
            - call: "POST /districts/${d_id}/schools/${s_id}/screening-windows/${w_id}/score"
              payload: {}
              as: DistrictCoordinator
            - call: "POST /districts/${d_id}/schools/${s_id}/team-meetings"
              payload: { scheduled_on: "2026-08-06" }
              as: TeamLead
              captures: { m_id: $.data.id }
            - call: "POST /districts/${d_id}/schools/${s_id}/team-meetings/${m_id}/convene"
              payload: {}
              as: TeamLead
            - call: "GET /districts/${d_id}/schools/${s_id}/students/${t_id}/tier-movements"
              payload: {}
              as: TeamLead
              captures: { mv_id: "$.data[0].id" }
            - call: "GET /districts/${d_id}/schools/${s_id}/students/${t_id}"
              payload: {}
              as: TeamLead
              captures: { t_v: $.data.version }
            - call: "POST /districts/${d_id}/schools/${s_id}/team-meetings/${m_id}/ratify"
              payload: { movement_id: "${mv_id}", expected_student_version: "${t_v}" }
              as: TeamLead
            # Add a WINTER window where T scores 65 (TIER_3 band)
            - call: "POST /districts/${d_id}/schools/${s_id}/benchmark-cut-points"
              payload: { window_kind: "WINTER", grade_level: 3, subject: "READING", tier2_max_score: 100, tier3_max_score: 70 }
              as: DistrictCoordinator
            - call: "POST /districts/${d_id}/schools/${s_id}/screening-windows"
              payload: { window_kind: "WINTER", opens_on: "2026-12-01", closes_on: "2026-12-15" }
              as: DistrictCoordinator
              captures: { w2_id: $.data.id }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-12-05T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /districts/${d_id}/schools/${s_id}/screening-windows/${w2_id}/scores"
              payload: { student_id: "${t_id}", subject: "READING", raw_score: 65 }
              as: Teacher
            - call: "POST /districts/${d_id}/schools/${s_id}/screening-windows/${w2_id}/close"
              payload: {}
              as: DistrictCoordinator
            - call: "POST /districts/${d_id}/schools/${s_id}/screening-windows/${w2_id}/score"
              payload: {}
              as: DistrictCoordinator
            - call: "GET /districts/${d_id}/schools/${s_id}/students/${t_id}"
              payload: {}
              as: TeamLead
              captures: { t_v2: $.data.version }
          trigger:
            # Propose first TIER_3 movement
            - call: "POST /districts/${d_id}/schools/${s_id}/students/${t_id}/tier-movements"
              payload: { to_tier: "TIER_3", rationale: "First proposal", expected_student_version: "${t_v2}" }
              as: TeamLead
              captures: { mv1_id: $.data.id, mv1_status: $.data.status }
            # Propose second TIER_3 movement (supersedes the first)
            - call: "GET /districts/${d_id}/schools/${s_id}/students/${t_id}"
              payload: {}
              as: TeamLead
              captures: { t_v3: $.data.version }
            - call: "POST /districts/${d_id}/schools/${s_id}/students/${t_id}/tier-movements"
              payload: { to_tier: "TIER_3", rationale: "Second proposal — supersedes first", expected_student_version: "${t_v3}" }
              as: TeamLead
              captures: { mv2_id: $.data.id }
            - call: "GET /districts/${d_id}/schools/${s_id}/students/${t_id}/tier-movements/${mv1_id}"
              payload: {}
              as: TeamLead
              captures: { mv1_final: $.data.status }
          assert:
            - "TierMovement.${mv1_id}.status == 'SUPERSEDED' (first proposal auto-superseded by second)"
            - "TierMovement.${mv2_id}.status == 'PROPOSED' (newest proposal survives)"
            - "Two PROPOSED movements for same student never coexist — second write forces first into SUPERSEDED (non-linear sibling replacement)"

