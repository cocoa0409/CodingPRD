      - name: consecutive_miss_count_stays_below_the_tolerance_after_one_miss_and_resets_on_a_met_year
        claim_type: rate_threshold_triggers
        grounds:
          - complexity_profile.complexity_layers
          - entities.PerformanceIndicator.fields.consecutive_miss_count
          - calculations.performance_indicator_actual.constants.MISS_TOLERANCE
          - state_machines.PerformanceIndicator.AGREED_to_NOT_MET
          - state_machines.PerformanceIndicator.NOT_MET_to_MET
        distinguishing_aspect: |
          MISS_TOLERANCE is 2, so this instance probes the cumulative counter from BELOW the trigger and then proves the
          reset. One miss must leave consecutive_miss_count at 1 with no escalation whatsoever — the indicator stays
          NOT_MET, the program stays STATE_APPROVED and the REQUESTED expenditure stays REQUESTED, which is the only way
          to show the cascade is gated on reaching the tolerance rather than on any miss. Three further verified
          attainments then lift the final actual from 40.00 to 100.00, and the next close must both score MET and reset
          the counter to 0, so a counter that only ever increments is caught.
