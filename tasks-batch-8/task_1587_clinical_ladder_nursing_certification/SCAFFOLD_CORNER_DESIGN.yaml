        claim_type: pagination_with_filtering
        grounds: [response_envelope.pagination_defaults]
        distinguishing_aspect: "limit=0 or limit=101 is clamped/rejected per envelope defaults (min 1, max 100); limit=100 accepted."
        test_recipe:
          setup: ["One nurse exists"]
          setup_api_calls:
            - call: "POST /clinical-ladder/nurses"
              payload: { employee_code: "RN-PG", full_name: "Pg Nurse", hire_date: "2020-01-01T00:00:00Z", home_unit: "MED-2E" }
              as: ProgramAdmin
          trigger:
            - call: "GET /clinical-ladder/nurses"
              payload: { limit: 100, offset: 0 }
              as: ProgramAdmin
              captures: { pg_ok: $.data }
            - call: "GET /clinical-ladder/nurses"
              payload: { limit: 101, offset: 0 }
              as: ProgramAdmin
              captures: { pg_err: $.data.error_id }
          assert:
            - "pg_ok is an array (limit 100 accepted)"
            - "pg_err == ERR_INVALID_REQUEST (limit 101 out of bounds)"

