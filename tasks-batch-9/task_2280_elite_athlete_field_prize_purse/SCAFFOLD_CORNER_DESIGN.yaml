      - name: corner_cyclic_invitation_shape_bounded_by_round_cap
        claim_type: cyclic
        grounds:
          - state_machines.Invitation.OFFERED_to_COUNTERED
          - complexity_profile.state_machine_shape
        excluded_because:
          difficulty_instance: non_linear_state_machine / invitation_negotiation_cycle_offered_countered_to_round_cap
          rationale: "That §1.8 instance drives the OFFERED <-> COUNTERED loop twice and asserts the ERR_NEGOTIATION_ROUNDS_EXHAUSTED termination condition at round_count == 2 * max_negotiation_rounds."

      - name: corner_parallel_result_dimensions_evolve_independently
        claim_type: parallel
        grounds:
          - entities.RaceResult.fields.certification_status
          - entities.RaceResult.fields.record_claim_status
          - complexity_profile.state_machine_shape
        excluded_because:
          difficulty_instance: non_linear_state_machine / race_result_parallel_dimensions_with_record_resubmission_loop
          rationale: "That §1.8 instance walks four record_claim_status transitions while asserting certification_status stays CERTIFIED throughout."

      - name: corner_guarded_transition_award_approval_needs_cleared_test
        claim_type: guarded_transitions
        grounds:
          - state_machines.PrizeAward.COMPUTED_to_APPROVED
        excluded_because:
          difficulty_instance: cross_entity_state_dependency / cross_entity_award_approval_requires_cleared_in_competition_test
          rationale: "That §1.8 instance asserts the cross-entity guard both unsatisfied (two distinct 422s) and satisfied."

      - name: corner_cross_entity_side_effect_adverse_finding_chain
        claim_type: cross_entity
        grounds:
          - state_machines.DopingTest.COLLECTED_to_ADVERSE
        excluded_because:
          difficulty_instance: transitive_cascade / adverse_finding_four_hop_clawback_and_breach_cascade
          rationale: "That §1.8 instance verifies every cross-entity side effect of the ADVERSE adjudication down four hops."

      - name: corner_ledger_sync_edition_fields_track_child_changes
        claim_type: ledger_sync
        grounds:
          - calculations.purse_and_budget_ledger
        excluded_because:
          difficulty_instance: compensating_invariant / compensating_appearance_budget_invariant_across_withdraw_and_reissue
          rationale: "That §1.8 instance reconciles the edition ledger before and after each child mutation."

      - name: corner_compensation_withdraw_reverses_every_side_effect
        claim_type: compensation
        grounds:
          - state_machines.Invitation.ACCEPTED_to_WITHDRAWN
        excluded_because:
          difficulty_instance: compensating_invariant / compensating_appearance_budget_invariant_across_withdraw_and_reissue
          rationale: "That §1.8 instance asserts commitment, bib and fluid-slot reversal with zero drift after a recommit."

      - name: corner_conditional_cascade_only_breach_reasons_touch_invitation
        claim_type: conditional_cascade
        grounds:
          - state_machines.RaceResult.CERTIFIED_to_DISQUALIFIED
          - state_machines.Invitation.ACCEPTED_to_BREACHED
        excluded_because:
          difficulty_instance: compensating_invariant / compensating_purse_ledger_invariant_across_disqualification_and_recompute
          rationale: "That §1.8 instance disqualifies with MISSED_TEST_THRESHOLD, which is outside the breach set, and asserts the invitation stays ACCEPTED while the award still voids."

