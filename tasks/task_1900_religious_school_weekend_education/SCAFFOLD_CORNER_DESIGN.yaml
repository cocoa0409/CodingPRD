            - { call: "POST /school/school-years/${y_id}/security-plan", payload: { plan_document: "P" }, as: SchoolAdmin, captures: { sp: $.data.id } }
            - { call: "POST /school/security-plans/${sp}/submit", payload: {}, as: SchoolAdmin }
            - { call: "POST /school/security-plans/${sp}/approve", payload: {}, as: SchoolAdmin }
            - { call: "POST /school/school-years/${y_id}/open", payload: {}, as: SchoolAdmin }
            - { call: "POST /school/teachers", payload: { full_name: "T", email: "t@x.org", background_check_cleared: true }, as: SchoolAdmin, captures: { t_id: $.data.id } }
            - { call: "POST /school/teachers/${t_id}/vet", payload: {}, as: SchoolAdmin }
            - { call: "POST /school/teachers/${t_id}/hire", payload: {}, as: SchoolAdmin }
            - { call: "POST /school/school-years/${y_id}/sections", payload: { grade: "G3", hebrew_level: "BEGINNER", capacity: 5, room: "R1", day_of_week: "SUN", start_time: "10:00", end_time: "11:30", teacher_id: "${t_id}" }, as: SchoolAdmin, captures: { sec: $.data.id, sv: $.data.version } }
            - { call: "POST /school/families", payload: { family_name: "Fam OV", primary_email: "ov@x.org", membership_status: "MEMBER" }, as: SchoolAdmin, captures: { fam: $.data.id, fam_v: $.data.version } }
            - { call: "POST /school/families/${fam}/students", payload: { full_name: "Ov", grade: "G3", hebrew_level: "BEGINNER" }, as: SchoolAdmin, captures: { stu: $.data.id } }
            - { call: "POST /school/sections/${sec}/enrollments", payload: { student_id: "${stu}", expected_section_version: "${sv}" }, as: SchoolAdmin }
            - { call: "POST /school/families/${fam}/invoices", payload: { school_year_id: "${y_id}", expected_family_version: "${fam_v}" }, as: SchoolAdmin, captures: { inv1: $.data.id } }
          trigger:
            - { call: "POST /school/families/${fam}/invoices", payload: { school_year_id: "${y_id}", expected_family_version: "${fam_v}" }, as: SchoolAdmin, captures: { err: $.data.error_id } }
          assert:
            - "err == ERR_STALE_VERSION (HTTP 412) — Family.version advanced to 2 on the first issue"
            - "Invoice.${inv1} remains ISSUED (the stale re-issue did NOT supersede it)"

      - name: layer_dual_variant_calculation
        claim_type: dual_variant_calculation
        grounds: [complexity_profile.complexity_layers]
        excluded_because:
          difficulty_instance: "dual_variant_calc / tuition_provisional_estimate_vs_final_invoice_line (plus assistance_award_percent_of_net_vs_flat_cap, attendance_current_vs_projected_percentage)"
          rationale: "All three declared dual-variant calculations are exercised with divergence asserts in section 1.8."

      - name: layer_cascading_side_effects
        claim_type: cascading_side_effects
        grounds: [complexity_profile.complexity_layers]
        excluded_because:
          difficulty_instance: "transitive_cascade / teacher_separation_cascade_section_session_milestone (plus volunteer_entry_void_cascade_commitment_to_milestone)"
          rationale: "Both cascade chains are verified end-to-end in section 1.8; closure cascade additionally covered by corner closure_cancels_covered_sessions."

      - name: layer_rate_threshold_triggers
        claim_type: rate_threshold_triggers
        grounds: [complexity_profile.complexity_layers]
        excluded_because:
          difficulty_instance: "boundary_precision_check / milestone_attendance_exactly_80pct_boundary (attendance >= 80 inclusive) and cross_entity_state_dependency / milestone_schedule_requires_family_volunteer_fulfilled (hours >= 8 inclusive)"
          rationale: "Both threshold boundaries (percentage and hours) are exercised at their exact inclusive edges in section 1.8."

