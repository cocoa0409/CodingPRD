  # ===========================================================================
  # Rule 4: transitive_cascade — cascades where each link is caused by the
  # previous link. Two chains from different triggers.
  # ===========================================================================
  - rule_id: transitive_cascade
    instances:
      - name: termination_approval_cascades_pip_close_employee_term_link_rows
        grounds:
          - state_machines.OutcomeDecision.PROPOSED_to_APPROVED
          - state_machines.PerformanceImprovementPlan.ACTIVE_to_CLOSED_TERMINATED
          - entities.RatingCycleOutcomeLink
        distinguishing_aspect: |
          Depth-3 chain triggered by outcome-decision approve:
          (1) OutcomeDecision APPROVED -> PIP transitions to CLOSED_TERMINATED;
          (2) PIP CLOSED_TERMINATED -> Employee.employment_status flips to
          TERMINATED and terminated_at is stamped; (3) Employee termination
          + plan close -> RatingCycleOutcomeLink rows are materialized for
          every rating cycle whose [window_start, window_end) intersects
          the plan window. Each link is caused by the previous link, not
          by the original approve call.
        test_recipe:
          setup:
            - "Org unit with rating cycle RC1 [2026-07-01, 2026-12-31) status OPEN"
            - "PIP P1 ACTIVE for E1 with end_date 2026-08-31, legal review SUBMITTED with recommendation=PROCEED"
            - "Clock at 2026-09-01 (post end_date)"
          setup_api_calls:
            - call: "POST /hr-org-units"
              payload: { name: "OU1" }
              as: HRSystemAdmin
              captures: { ou_id: $.data.id }
            - call: "POST /hr-org-units/${ou_id}/rating-cycles"
              payload: { label: "2026-H2", window_start: "2026-07-01T00:00:00Z", window_end: "2026-12-31T00:00:00Z" }
              as: HRBusinessPartner
