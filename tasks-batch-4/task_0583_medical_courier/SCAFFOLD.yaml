# =============================================================================
# PRD-bench seed tables — Medical Courier & Specimen Logistics (STAT routes)
# Difficulty band: Expert
# =============================================================================

scenario: |
  583. Medical Courier & Specimen Logistics (STAT routes): pickup/stop manifest &
  route, specimen type & temperature/chain-of-custody, STAT vs scheduled run, scan
  at pickup/dropoff & ETA, missed-stop & exception, driver/vehicle & credential,
  recurring lab route, per-stop/per-mile billing

domain_name: medical-courier
api_prefix: /med-courier

complexity_profile:
  primary_archetype: "Compliance / audit"
  secondary_archetype: "Pricing engine"
  complexity_layers:
    - dual_variant_calculation      # provisional vs final run charge; estimated vs final specimen risk
    - cascading_side_effects        # missed-stop and dropoff-delivery propagation chains
    - rate_threshold_triggers       # temperature-excursion boundary on cold-chain specimens
    - optimistic_concurrency        # OCC on Route.version for supersede-billing create
  entity_topology: hybrid           # Route→Stop→Specimen tree + cross-cutting Driver/Vehicle/LabClient/RateCard refs
  state_machine_shape: parallel     # Specimen carries independent custody_status × integrity_status; Stop is cyclic
  relationship_patterns:
    - one_to_many                   # Route has many Stops / Specimens / Exceptions
    - cross_aggregate               # Specimen references two Stops (pickup + dropoff); ScanEvent references Driver
  role_model: peer_roles            # Dispatcher / Driver / LabClient / ComplianceOfficer own distinct surfaces
  consistency_model: immediate

# =============================================================================
# 1.0 Response Envelope (FIXED)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# 1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: RateCard
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Human label for the rate card" }
      - { name: per_stop_fee_cents, type: integer, source: input, description: "Flat fee charged per served (COMPLETED) stop, in cents", constraints: ">= 0" }
      - { name: per_mile_rate_cents, type: integer, source: input, description: "Cents charged per mile driven", constraints: ">= 0" }
      - { name: stat_surcharge_pct, type: number, source: input, description: "Fractional surcharge applied to base charge on STAT runs (e.g. 0.30)", constraints: ">= 0" }
      - { name: stat_surcharge_cap_cents, type: integer, source: input, description: "Upper bound (cents) on the STAT surcharge after multiplication", constraints: ">= 0" }
      - { name: temp_handling_fee_cents, type: integer, source: input, description: "Cents added per temperature-controlled specimen (temp_requirement != AMBIENT)", constraints: ">= 0" }

  - name: LabClient
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Ordering laboratory name" }
      - { name: budget_cents, type: integer, source: input, description: "Spending ceiling for this lab across all issued billings, in cents", constraints: ">= 0" }
      - { name: contact, type: string, source: input, default: null, description: "Optional contact string" }
      - { name: billed_balance_cents, type: integer, source: computed, default: 0, description: "Read-only = sum of RunBilling.net_charge_cents for this lab where status == ISSUED" }

  - name: Driver
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Driver full name" }
      - { name: credential_type, type: enum, source: input, description: "STANDARD | BLOODBORNE | HAZMAT" }
      - { name: credential_expiry, type: datetime, source: input, description: "ISO-8601 UTC instant the credential lapses; valid iff credential_expiry > clock now" }
      - { name: status, type: enum, source: system, default: "ACTIVE", description: "ACTIVE | SUSPENDED (see Driver state machine)" }

  - name: Vehicle
    parent: null
    common_fields: true
    fields:
      - { name: plate, type: string, source: input, description: "License plate / asset tag" }
      - { name: has_refrigeration, type: boolean, source: input, description: "Whether the vehicle carries active refrigeration" }
      - { name: sanitation_buffer_minutes, type: integer, source: input, default: 30, description: "Required idle gap (minutes) after a run release before the next run's scheduled_start", constraints: ">= 0" }
      - { name: status, type: enum, source: system, default: "AVAILABLE", description: "AVAILABLE | IN_USE (see Vehicle state machine)" }
      - { name: last_released_at, type: datetime, source: system, default: null, description: "Clock instant the vehicle was last freed by a route completion; null until first release" }

  - name: RouteTemplate
    parent: LabClient
    common_fields: true
    fields:
      - { name: lab_client_id, type: string, source: input, description: "FK -> LabClient.id; owning lab" }
      - { name: rate_card_id, type: string, source: input, description: "FK -> RateCard.id; rate card copied onto generated routes" }
      - { name: cadence, type: enum, source: input, description: "DAILY | WEEKDAYS | WEEKLY" }
      - { name: default_run_type, type: enum, source: input, description: "STAT | SCHEDULED applied to generated routes unless overridden" }
      - { name: stop_specs, type: array, source: input, description: "Ordered array of { sequence, address, stop_kind, planned_leg_miles } used to synthesize Stops on generation" }

  - name: Route
    parent: null
    common_fields: true
    fields:
      - { name: lab_client_id, type: string, source: input, description: "FK -> LabClient.id; ordering lab" }
      - { name: rate_card_id, type: string, source: input, description: "FK -> RateCard.id; pricing basis" }
      - { name: template_id, type: string, source: system, default: null, description: "FK -> RouteTemplate.id; set only when the route was generated from a template" }
      - { name: driver_id, type: string, source: system, default: null, description: "FK -> Driver.id; set on assign, cleared on unassign" }
      - { name: vehicle_id, type: string, source: system, default: null, description: "FK -> Vehicle.id; set on assign, cleared on unassign" }
      - { name: run_type, type: enum, source: input, description: "STAT | SCHEDULED" }
      - { name: scheduled_start, type: datetime, source: input, description: "Planned run start (ISO-8601 UTC)" }
      - { name: scheduled_end, type: datetime, source: input, description: "Planned run end (ISO-8601 UTC); must be > scheduled_start" }
      - { name: planned_total_miles, type: number, source: input, description: "Planned total route mileage; drives the provisional charge", constraints: ">= 0" }
      - { name: sla_deadline, type: datetime, source: computed, description: "= scheduled_start + (STAT?120min:480min); see calc route_sla_deadline" }
      - { name: provisional_charge_cents, type: integer, source: computed, default: null, description: "Set on dispatch; provisional variant of route_charge" }
      - { name: final_charge_cents, type: integer, source: computed, default: null, description: "Set on complete; final variant of route_charge" }
      - { name: status, type: enum, source: system, default: "PLANNED", description: "PLANNED | ASSIGNED | DISPATCHED | COMPLETED" }

  - name: Stop
    parent: Route
    common_fields: true
    fields:
      - { name: route_id, type: string, source: system, description: "FK -> Route.id; owning route" }
      - { name: sequence, type: integer, source: input, description: "1-based ordinal within the route; unique per route", constraints: ">= 1" }
      - { name: address, type: string, source: input, description: "Stop street address / label" }
      - { name: stop_kind, type: enum, source: input, description: "PICKUP | DROPOFF | BOTH" }
      - { name: planned_leg_miles, type: number, source: input, description: "Planned miles for the leg arriving at this stop", constraints: ">= 0" }
      - { name: actual_leg_miles, type: number, source: system, default: null, description: "Odometer miles reported on the first scan (arrival); drives the final charge" }
      - { name: leg_charge_cents, type: integer, source: computed, default: null, description: "Set at stop completion = per_stop_fee_cents + round_half_up(actual_leg_miles * per_mile_rate_cents)" }
      - { name: arrived_at, type: datetime, source: system, default: null, description: "Clock instant of first scan; cleared on reschedule" }
      - { name: completed_at, type: datetime, source: system, default: null, description: "Clock instant the stop reached COMPLETED" }
      - { name: status, type: enum, source: system, default: "SCHEDULED", description: "SCHEDULED | ARRIVED | COMPLETED | MISSED" }

  - name: Specimen
    parent: Route
    common_fields: true
    fields:
      - { name: route_id, type: string, source: system, description: "FK -> Route.id; owning route" }
      - { name: pickup_stop_id, type: string, source: input, description: "FK -> Stop.id; stop where the specimen is collected" }
      - { name: dropoff_stop_id, type: string, source: input, description: "FK -> Stop.id; stop where the specimen is delivered" }
      - { name: specimen_type, type: enum, source: input, description: "BLOOD | TISSUE | URINE | SWAB | CULTURE" }
      - { name: temp_requirement, type: enum, source: input, description: "AMBIENT | REFRIGERATED | FROZEN" }
      - { name: required_temp_min_c, type: number, source: input, description: "Inclusive lower bound of the acceptable temperature band (Celsius)" }
      - { name: required_temp_max_c, type: number, source: input, description: "Inclusive upper bound of the acceptable temperature band (Celsius); must be >= required_temp_min_c" }
      - { name: custody_status, type: enum, source: system, default: "AWAITING_PICKUP", description: "AWAITING_PICKUP | IN_TRANSIT | DELIVERED | EXCEPTION (custody dimension)" }
      - { name: integrity_status, type: enum, source: system, default: "INTACT", description: "INTACT | COMPROMISED (integrity dimension, independent of custody)" }
      - { name: excursion_count, type: integer, source: system, default: 0, description: "Number of temperature excursions observed across scans" }
      - { name: picked_up_at, type: datetime, source: system, default: null, description: "Clock instant of the PICKUP scan" }
      - { name: delivered_at, type: datetime, source: system, default: null, description: "Clock instant of the DROPOFF scan" }
      - { name: estimated_risk_score, type: integer, source: computed, default: null, description: "Set at pickup; estimated variant of specimen_risk" }
      - { name: final_risk_score, type: integer, source: computed, default: null, description: "Set at delivery; final variant of specimen_risk" }

  - name: ScanEvent
    parent: Specimen
    common_fields: false   # append-only chain-of-custody record; carries only id + created_at
    fields:
      - { name: specimen_id, type: string, source: input, description: "FK -> Specimen.id; specimen scanned" }
      - { name: driver_id, type: string, source: system, description: "FK -> Driver.id; acting driver (from X-User-ID)" }
      - { name: stop_id, type: string, source: system, description: "FK -> Stop.id; stop at which the scan occurred" }
      - { name: scan_type, type: enum, source: input, description: "PICKUP | DROPOFF" }
      - { name: temp_reading_c, type: number, source: input, description: "Measured temperature (Celsius) at scan time" }
      - { name: leg_miles, type: number, source: input, description: "Odometer miles for the leg reaching this stop" }
      - { name: scanned_at, type: datetime, source: system, description: "Clock instant of the scan" }
      - { name: is_excursion, type: boolean, source: computed, description: "True iff temp_reading_c < specimen.required_temp_min_c OR > specimen.required_temp_max_c" }

  - name: RouteException
    parent: Route
    common_fields: true
    fields:
      - { name: route_id, type: string, source: system, description: "FK -> Route.id; owning route" }
      - { name: stop_id, type: string, source: system, default: null, description: "FK -> Stop.id; implicated stop, if any" }
      - { name: specimen_id, type: string, source: system, default: null, description: "FK -> Specimen.id; implicated specimen, if any" }
      - { name: exception_type, type: enum, source: system, description: "MISSED_STOP | TEMP_EXCURSION | CREDENTIAL_LAPSE" }
      - { name: detail, type: string, source: system, description: "System-generated description of the exception" }
      - { name: resolution_note, type: string, source: input, default: null, description: "Free-text note captured on resolve" }
      - { name: status, type: enum, source: system, default: "OPEN", description: "OPEN | RESOLVED" }

  - name: RunBilling
    parent: Route
    common_fields: true
    fields:
      - { name: route_id, type: string, source: system, description: "FK -> Route.id; billed route (one active billing supersedes prior drafts)" }
      - { name: lab_client_id, type: string, source: system, description: "FK -> LabClient.id; billed lab" }
      - { name: gross_charge_cents, type: integer, source: computed, description: "Pre-surcharge base of the final route charge, in cents" }
      - { name: surcharge_cents, type: integer, source: computed, description: "STAT surcharge component (0 for SCHEDULED), in cents" }
      - { name: net_charge_cents, type: integer, source: computed, description: "= gross_charge_cents + surcharge_cents = Route.final_charge_cents" }
      - { name: status, type: enum, source: system, default: "DRAFT", description: "DRAFT | ISSUED | VOIDED" }

# =============================================================================
# 1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Route
    initial_state: PLANNED
    terminal_states: [COMPLETED]
    transitions:
      - from: PLANNED
        to: ASSIGNED
        trigger: "POST /med-courier/routes/{id}/assign"
        actor: Dispatcher
        preconditions:
          - "route.status == PLANNED (ERR_ROUTE_INVALID_STATE)"
          - "driver exists (ERR_DRIVER_NOT_FOUND) and vehicle exists (ERR_VEHICLE_NOT_FOUND)"
          - "driver.status == ACTIVE AND driver.credential_expiry > clock_now (ERR_DRIVER_CREDENTIAL_INVALID)"
          - "vehicle.status == AVAILABLE (ERR_VEHICLE_NOT_AVAILABLE) [Route depends on Vehicle state]"
          - "no other Route of this driver in {ASSIGNED, DISPATCHED} whose [scheduled_start, scheduled_end) overlaps this route's [scheduled_start, scheduled_end) (ERR_DRIVER_SCHEDULE_CONFLICT)"
          - "vehicle.last_released_at is null OR route.scheduled_start >= vehicle.last_released_at + vehicle.sanitation_buffer_minutes (ERR_VEHICLE_BUFFER_CONFLICT)"
        side_effects:
          - "set route.driver_id, route.vehicle_id"
          - "vehicle.status AVAILABLE -> IN_USE"

      - from: ASSIGNED
        to: PLANNED
        trigger: "POST /med-courier/routes/{id}/unassign"
        actor: Dispatcher
        preconditions:
          - "route.status == ASSIGNED (ERR_ROUTE_INVALID_STATE)"
        side_effects:
          - "clear route.driver_id, route.vehicle_id"
          - "vehicle.status IN_USE -> AVAILABLE (last_released_at NOT set; run never executed)"

      - from: ASSIGNED
        to: DISPATCHED
        trigger: "POST /med-courier/routes/{id}/dispatch"
        actor: Dispatcher
        preconditions:
          - "route.status == ASSIGNED (ERR_ROUTE_INVALID_STATE)"
          - "route has >= 1 Stop (ERR_ROUTE_HAS_NO_STOPS)"
          - "driver.status == ACTIVE AND driver.credential_expiry > clock_now (ERR_DRIVER_CREDENTIAL_INVALID) [re-checked; may have lapsed since assign]"
          - "driver.credential_type sufficient for every specimen (ERR_CREDENTIAL_TYPE_INSUFFICIENT): CULTURE requires {BLOODBORNE,HAZMAT}; temp_requirement FROZEN requires HAZMAT"
          - "vehicle.has_refrigeration == true if any specimen.temp_requirement in {REFRIGERATED, FROZEN} (ERR_VEHICLE_REFRIGERATION_REQUIRED)"
          - "lab.billed_balance_cents + provisional_charge_cents <= lab.budget_cents (ERR_BUDGET_EXCEEDED)"
        side_effects:
          - "compute route.provisional_charge_cents via calc route_charge (provisional variant)"

      - from: DISPATCHED
        to: COMPLETED
        trigger: "POST /med-courier/routes/{id}/complete"
        actor: Dispatcher
        preconditions:
          - "route.status == DISPATCHED (ERR_ROUTE_INVALID_STATE)"
          - "every Stop of the route is in {COMPLETED, MISSED} (ERR_STOPS_NOT_RESOLVED)"
        side_effects:
          - "compute route.final_charge_cents via calc route_charge (final variant, COMPLETED stops only)"
          - "vehicle.status IN_USE -> AVAILABLE; set vehicle.last_released_at = clock_now"

  - entity: Stop
    initial_state: SCHEDULED
    terminal_states: [COMPLETED]
    transitions:
      - from: SCHEDULED
        to: ARRIVED
        trigger: "POST /med-courier/stops/{id}/scan (first scan at this stop)"
        actor: Driver
        preconditions:
          - "parent route.status == DISPATCHED (ERR_ROUTE_INVALID_STATE) [Stop depends on Route state]"
          - "acting driver.id == route.driver_id (ERR_UNAUTHORIZED)"
        side_effects:
          - "set stop.arrived_at = clock_now"
          - "set stop.actual_leg_miles = scan.leg_miles (first scan only)"

      - from: ARRIVED
        to: COMPLETED
        trigger: "system: bubble-up re-evaluation after each scan"
        actor: system
        preconditions:
          - "every Specimen with pickup_stop_id == stop.id has custody_status != AWAITING_PICKUP"
          - "every Specimen with dropoff_stop_id == stop.id has custody_status == DELIVERED"
        side_effects:
          - "set stop.completed_at = clock_now"
          - "compute stop.leg_charge_cents = per_stop_fee_cents + round_half_up(actual_leg_miles * per_mile_rate_cents)"

      - from: SCHEDULED
        to: MISSED
        trigger: "POST /med-courier/stops/{id}/miss"
        actor: Driver | Dispatcher
        preconditions:
          - "parent route.status == DISPATCHED (ERR_ROUTE_INVALID_STATE)"
          - "stop.status in {SCHEDULED, ARRIVED} (ERR_STOP_INVALID_STATE)"
        side_effects:
          - "CASCADE link 1 (caused by stop -> MISSED): every Specimen whose pickup_stop_id == stop.id OR dropoff_stop_id == stop.id and custody_status in {AWAITING_PICKUP, IN_TRANSIT} -> custody_status = EXCEPTION"
          - "CASCADE link 2 (caused by each Specimen -> EXCEPTION): create one RouteException{exception_type: MISSED_STOP, route_id, stop_id, specimen_id, status: OPEN}"
          - "if the stop had no implicated specimens: create one RouteException{exception_type: MISSED_STOP, route_id, stop_id, specimen_id: null, status: OPEN}"

      - from: ARRIVED
        to: MISSED
        trigger: "POST /med-courier/stops/{id}/miss"
        actor: Driver | Dispatcher
        preconditions:
          - "parent route.status == DISPATCHED (ERR_ROUTE_INVALID_STATE)"
        side_effects:
          - "same MISSED cascade as SCHEDULED -> MISSED"

      - from: MISSED
        to: SCHEDULED
        trigger: "POST /med-courier/stops/{id}/reschedule"
        actor: Dispatcher
        preconditions:
          - "stop.status == MISSED (ERR_STOP_INVALID_STATE)"
        side_effects:
          - "clear stop.arrived_at; stop.status -> SCHEDULED (revision cycle SCHEDULED->MISSED->SCHEDULED)"

  - entity: Specimen   # dimension 1 of 2 — custody_status (parallel to integrity_status)
    initial_state: AWAITING_PICKUP
    terminal_states: [DELIVERED, EXCEPTION]
    transitions:
      - from: AWAITING_PICKUP
        to: IN_TRANSIT
        trigger: "POST /med-courier/stops/{id}/scan (scan_type == PICKUP)"
        actor: Driver
        preconditions:
          - "specimen.custody_status == AWAITING_PICKUP (ERR_SPECIMEN_INVALID_STATE)"
          - "scan target stop.id == specimen.pickup_stop_id (ERR_SPECIMEN_STOP_MISMATCH)"
        side_effects:
          - "set specimen.picked_up_at = clock_now"
          - "compute specimen.estimated_risk_score via calc specimen_risk (estimated variant)"
          - "run calc temperature_excursion_eval on this scan"

      - from: IN_TRANSIT
        to: DELIVERED
        trigger: "POST /med-courier/stops/{id}/scan (scan_type == DROPOFF)"
        actor: Driver
        preconditions:
          - "specimen.custody_status == IN_TRANSIT (ERR_SPECIMEN_INVALID_STATE)"
          - "scan target stop.id == specimen.dropoff_stop_id (ERR_SPECIMEN_STOP_MISMATCH)"
        side_effects:
          - "set specimen.delivered_at = clock_now"
          - "compute specimen.final_risk_score via calc specimen_risk (final variant)"
          - "run calc temperature_excursion_eval on this scan"
          - "CASCADE (caused by specimen -> DELIVERED): re-evaluate dropoff Stop bubble-up (may drive Stop ARRIVED -> COMPLETED)"

      - from: AWAITING_PICKUP
        to: EXCEPTION
        trigger: "system: parent Stop -> MISSED cascade"
        actor: system
        preconditions:
          - "pickup or dropoff stop of the specimen transitioned to MISSED"
        side_effects:
          - "specimen removed from deliverable set; contributes to a MISSED_STOP RouteException"

      - from: IN_TRANSIT
        to: EXCEPTION
        trigger: "system: parent Stop -> MISSED cascade"
        actor: system
        preconditions:
          - "dropoff stop of an in-transit specimen transitioned to MISSED"
        side_effects:
          - "specimen removed from deliverable set; contributes to a MISSED_STOP RouteException"

  - entity: Specimen   # dimension 2 of 2 — integrity_status (parallel to custody_status)
    initial_state: INTACT
    terminal_states: [COMPROMISED]
    transitions:
      - from: INTACT
        to: COMPROMISED
        trigger: "POST /med-courier/stops/{id}/scan (any scan whose reading breaches the band)"
        actor: Driver
        preconditions:
          - "calc temperature_excursion_eval returns is_excursion == true (temp_reading_c < required_temp_min_c OR > required_temp_max_c)"
        side_effects:
          - "specimen.integrity_status INTACT -> COMPROMISED"
          - "specimen.excursion_count += 1"
          - "create RouteException{exception_type: TEMP_EXCURSION, route_id, stop_id, specimen_id, status: OPEN}"
        note: "Evolves independently of custody_status; a specimen may be both DELIVERED and COMPROMISED at once."

  - entity: Vehicle
    initial_state: AVAILABLE
    terminal_states: []
    transitions:
      - from: AVAILABLE
        to: IN_USE
        trigger: "system: Route PLANNED -> ASSIGNED"
        actor: system
        preconditions: ["vehicle.status == AVAILABLE (ERR_VEHICLE_NOT_AVAILABLE)"]
        side_effects: ["reserved for the assigned route"]
      - from: IN_USE
        to: AVAILABLE
        trigger: "system: Route ASSIGNED -> PLANNED (unassign) OR Route DISPATCHED -> COMPLETED (complete)"
        actor: system
        preconditions: []
        side_effects: ["on complete: set vehicle.last_released_at = clock_now; on unassign: leave last_released_at unchanged"]

  - entity: Driver
    initial_state: ACTIVE
    terminal_states: []
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "POST /med-courier/drivers/{id}/credential (action == SUSPEND)"
        actor: ComplianceOfficer
        preconditions: ["driver.status == ACTIVE (ERR_DRIVER_INVALID_STATE)"]
        side_effects: ["driver.status -> SUSPENDED; driver treated as credential-invalid on subsequent assign/dispatch"]
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /med-courier/drivers/{id}/credential (action == REINSTATE)"
        actor: ComplianceOfficer
        preconditions: ["driver.status == SUSPENDED (ERR_DRIVER_INVALID_STATE)"]
        side_effects: ["driver.status -> ACTIVE"]
      - from: ACTIVE
        to: ACTIVE
        trigger: "POST /med-courier/drivers/{id}/credential (action == RENEW)"
        actor: ComplianceOfficer
        preconditions: ["driver.status == ACTIVE (ERR_DRIVER_INVALID_STATE)"]
        side_effects: ["set driver.credential_expiry = payload.credential_expiry"]

  - entity: RunBilling
    initial_state: DRAFT
    terminal_states: [VOIDED]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /med-courier/billings/{id}/issue"
        actor: Dispatcher
        preconditions:
          - "billing.status == DRAFT (ERR_BILLING_INVALID_STATE)"
          - "lab.billed_balance_cents + billing.net_charge_cents <= lab.budget_cents (ERR_BUDGET_EXCEEDED)"
        side_effects:
          - "COMPENSABLE forward action: lab.billed_balance_cents += billing.net_charge_cents"
      - from: ISSUED
        to: VOIDED
        trigger: "POST /med-courier/billings/{id}/void"
        actor: Dispatcher
        preconditions:
          - "billing.status == ISSUED (ERR_BILLING_INVALID_STATE)"
        side_effects:
          - "COMPENSATION: lab.billed_balance_cents -= billing.net_charge_cents (restores the conserved money total)"

  - entity: RouteException
    initial_state: OPEN
    terminal_states: [RESOLVED]
    transitions:
      - from: OPEN
        to: RESOLVED
        trigger: "POST /med-courier/exceptions/{id}/resolve"
        actor: ComplianceOfficer
        preconditions:
          - "exception.status == OPEN (ERR_EXCEPTION_INVALID_STATE)"
        side_effects:
          - "set exception.resolution_note = payload.resolution_note"

# =============================================================================
# 1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:
  - rule_id: billing-create-stale-route
    parent_entity: Route
    write_endpoint: "POST /med-courier/routes/{id}/billing"
    occ_field: "expected_route_version"
    description: |
      Generating a RunBilling against a Route whose version has advanced since the
      client last observed it is rejected as a stale-version write. A prior billing
      create (which legitimately supersedes any earlier draft) has already advanced
      route.version, so the current writer's expected_route_version no longer matches
      and the create is refused. Resolved purely by the OCC version check.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# 1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: route_sla_deadline
    trigger: "on Route creation and on template generation"
    algorithm: threshold
    formula: |
      sla_minutes = 120 if run_type == STAT else 480
      sla_deadline = scheduled_start + sla_minutes minutes
    input_set: "the route's run_type and scheduled_start"
    constants: { STAT_SLA_MIN: 120, SCHEDULED_SLA_MIN: 480 }
    precision: "whole minutes; ISO-8601 UTC"

  - name: route_charge
    trigger: "provisional variant on dispatch (ASSIGNED->DISPATCHED); final variant on complete (DISPATCHED->COMPLETED)"
    algorithm: tiered_pricing
    formula: |
      # --- PROVISIONAL (at dispatch) : round the whole-route mileage ONCE ---
      stop_subtotal   = per_stop_fee_cents * count(all Stops of the route)
      mile_subtotal   = round_half_up(planned_total_miles * per_mile_rate_cents)
      temp_count      = count(Specimens where temp_requirement != AMBIENT)
      temp_subtotal   = temp_handling_fee_cents * temp_count
      base            = stop_subtotal + mile_subtotal + temp_subtotal
      surcharge       = min(round_half_up(base * stat_surcharge_pct), stat_surcharge_cap_cents) if run_type == STAT else 0
      provisional_charge_cents = base + surcharge

      # --- FINAL (at complete) : round EACH COMPLETED leg, THEN sum ---
      # COMPLETED stops only (MISSED stops excluded). Order stops by sequence ASC.
      for each Stop s in COMPLETED stops (ordered by sequence ASC, tie-break created_at ASC):
          leg_charge_cents[s] = per_stop_fee_cents + round_half_up(s.actual_leg_miles * per_mile_rate_cents)
      leg_stop_subtotal = sum(leg_charge_cents[s])          # per-leg rounded, THEN summed
      temp_count_final  = count(Specimens where temp_requirement != AMBIENT AND custody_status == DELIVERED)
      temp_subtotal_f   = temp_handling_fee_cents * temp_count_final
      base_f            = leg_stop_subtotal + temp_subtotal_f
      surcharge_f       = min(round_half_up(base_f * stat_surcharge_pct), stat_surcharge_cap_cents) if run_type == STAT else 0
      final_charge_cents = base_f + surcharge_f
    input_set: "provisional: ALL stops + ALL specimens + planned_total_miles. final: COMPLETED stops (actual_leg_miles) + DELIVERED temp specimens only."
    constants: { rounding: round_half_up }
    precision: "integer cents, round_half_up"
    variants:
      - name: provisional
        when: "computed at dispatch"
        difference: "uses planned_total_miles rounded once (round-then-not-sum) and counts ALL stops/specimens"
      - name: final
        when: "computed at complete"
        difference: "rounds each COMPLETED leg's mileage independently and sums the rounded legs (sum-of-rounded); excludes MISSED stops and non-DELIVERED specimens — diverges from provisional whenever per-leg rounding differs from whole-route rounding"

  - name: specimen_risk
    trigger: "estimated variant on PICKUP scan; final variant on DROPOFF scan"
    algorithm: weighted_scoring
    formula: |
      base_risk = { BLOOD:10, TISSUE:20, URINE:5, SWAB:5, CULTURE:15 }[specimen_type]
      # estimated (at pickup): planned transit = route.scheduled_end - route.scheduled_start
      est_minutes = minutes(route.scheduled_end - route.scheduled_start)
      estimated_risk_score = base_risk + round_half_up(est_minutes / 10)
      # final (at delivery): actual transit + excursion penalty
      act_minutes = minutes(specimen.delivered_at - specimen.picked_up_at)
      final_risk_score = base_risk + round_half_up(act_minutes / 10) + (excursion_count * EXCURSION_PENALTY)
    input_set: "estimated: specimen_type + route window. final: specimen_type + actual transit + excursion_count."
    constants: { EXCURSION_PENALTY: 25, TIME_DIVISOR_MIN: 10 }
    precision: "integer points, round_half_up"
    variants:
      - name: estimated
        when: "at PICKUP scan"
        difference: "uses the planned route window and ignores excursions"
      - name: final
        when: "at DROPOFF scan"
        difference: "uses the realized pickup->delivery duration and adds excursion_count * 25 — different subject-matter (specimen risk) than route_charge"

  - name: temperature_excursion_eval
    trigger: "on every scan (PICKUP or DROPOFF)"
    algorithm: threshold
    formula: |
      is_excursion = (temp_reading_c < specimen.required_temp_min_c) OR (temp_reading_c > specimen.required_temp_max_c)
      # BOUNDARY: reading exactly == required_temp_max_c (or == required_temp_min_c) is IN BAND (inclusive); no excursion.
      if is_excursion: specimen.integrity_status -> COMPROMISED; specimen.excursion_count += 1; open TEMP_EXCURSION exception
    input_set: "the scan's temp_reading_c against the specimen's inclusive [required_temp_min_c, required_temp_max_c] band"
    constants: {}
    precision: "temperatures compared to 2 decimal places; band bounds are inclusive"

  - name: lab_billed_balance
    trigger: "on RunBilling issue (+=) and void (-=)"
    algorithm: aggregation
    formula: |
      lab.billed_balance_cents = sum(RunBilling.net_charge_cents for that lab where status == ISSUED)
    input_set: "RunBilling rows of the lab whose status == ISSUED (VOIDED and DRAFT excluded)"
    constants: {}
    precision: "integer cents"

# =============================================================================
# 1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - { priority: 1,  category: auth,                 check: "X-User-Role and X-User-ID headers present and X-User-Role is a known role", error_id: ERR_UNAUTHENTICATED,           http_status: 401, applies_to: "all" }
  - { priority: 2,  category: auth,                 check: "role permitted for the operation; entity-backed roles acting on owned resource (Driver.id == route.driver_id; LabClient.id == route.lab_client_id)", error_id: ERR_UNAUTHORIZED, http_status: 403, applies_to: "all" }
  - { priority: 3,  category: existence,            check: "every path/body-referenced resource exists, validated left-to-right", error_id: "ERR_*_NOT_FOUND",             http_status: 404, applies_to: "all" }
  - { priority: 4,  category: business_constraint,  check: "request body well-formed: required fields present, enums in range, scheduled_end > scheduled_start, required_temp_max_c >= required_temp_min_c", error_id: ERR_VALIDATION, http_status: 400, applies_to: "all writes" }
  - { priority: 5,  category: state,                check: "target resource in the correct state for this transition (route/stop/specimen/billing/exception/driver)", error_id: "ERR_*_INVALID_STATE", http_status: 409, applies_to: "all transitions" }
  - { priority: 6,  category: state,                check: "OCC: payload expected_route_version == route.version", error_id: ERR_STALE_VERSION,               http_status: 412, applies_to: "POST /med-courier/routes/{id}/billing" }
  - { priority: 7,  category: business_safety,      check: "driver.status == ACTIVE AND driver.credential_expiry > clock_now", error_id: ERR_DRIVER_CREDENTIAL_INVALID,   http_status: 422, applies_to: "assign, dispatch" }
  - { priority: 8,  category: business_safety,      check: "driver.credential_type sufficient for all specimens (CULTURE->BLOODBORNE/HAZMAT; FROZEN->HAZMAT)", error_id: ERR_CREDENTIAL_TYPE_INSUFFICIENT, http_status: 422, applies_to: "dispatch" }
  - { priority: 9,  category: business_safety,      check: "vehicle.has_refrigeration == true when any specimen requires REFRIGERATED/FROZEN", error_id: ERR_VEHICLE_REFRIGERATION_REQUIRED, http_status: 422, applies_to: "dispatch" }
  - { priority: 10, category: business_referential, check: "vehicle.status == AVAILABLE at assign", error_id: ERR_VEHICLE_NOT_AVAILABLE,         http_status: 409, applies_to: "assign" }
  - { priority: 11, category: business_referential, check: "scan target stop is the specimen's pickup_stop (PICKUP) or dropoff_stop (DROPOFF)", error_id: ERR_SPECIMEN_STOP_MISMATCH, http_status: 422, applies_to: "scan" }
  - { priority: 12, category: business_constraint,  check: "driver has no other {ASSIGNED,DISPATCHED} route whose [start,end) half-open interval overlaps (adjacency end==start allowed)", error_id: ERR_DRIVER_SCHEDULE_CONFLICT, http_status: 409, applies_to: "assign" }
  - { priority: 13, category: business_constraint,  check: "vehicle sanitation buffer: route.scheduled_start >= vehicle.last_released_at + sanitation_buffer_minutes", error_id: ERR_VEHICLE_BUFFER_CONFLICT, http_status: 409, applies_to: "assign" }
  - { priority: 14, category: business_constraint,  check: "route has >= 1 Stop", error_id: ERR_ROUTE_HAS_NO_STOPS,          http_status: 422, applies_to: "dispatch" }
  - { priority: 15, category: business_constraint,  check: "stop.sequence unique within the route", error_id: ERR_DUPLICATE_STOP_SEQUENCE,     http_status: 409, applies_to: "POST /med-courier/routes/{id}/stops" }
  - { priority: 16, category: business_constraint,  check: "all Stops in {COMPLETED, MISSED} before route completion", error_id: ERR_STOPS_NOT_RESOLVED,       http_status: 409, applies_to: "complete" }
  - { priority: 17, category: business_fiscal,      check: "lab.billed_balance_cents + charge <= lab.budget_cents (charge = provisional at dispatch, net at issue)", error_id: ERR_BUDGET_EXCEEDED, http_status: 402, applies_to: "dispatch, issue" }

# =============================================================================
# 1.5 API Endpoint Table
# =============================================================================
endpoints:
  # ---- configuration / actor setup ----
  - { method: POST, path: "/med-courier/rate-cards", description: "Create a rate card", roles: [Dispatcher], code: 201, input: [name, per_stop_fee_cents, per_mile_rate_cents, stat_surcharge_pct, stat_surcharge_cap_cents, temp_handling_fee_cents], output: RateCard, side_effects: [] }
  - { method: GET,  path: "/med-courier/rate-cards/{id}", description: "Fetch a rate card", roles: [Dispatcher, ComplianceOfficer, LabClient], code: 200, input: [], output: RateCard, side_effects: [] }
  - { method: POST, path: "/med-courier/lab-clients", description: "Create a lab client", roles: [Dispatcher], code: 201, input: [name, budget_cents, "contact?"], output: LabClient, side_effects: [] }
  - { method: GET,  path: "/med-courier/lab-clients/{id}", description: "Fetch a lab client (incl. billed_balance_cents)", roles: [Dispatcher, ComplianceOfficer, LabClient], code: 200, input: [], output: LabClient, side_effects: [] }
  - { method: POST, path: "/med-courier/drivers", description: "Create a driver", roles: [Dispatcher, ComplianceOfficer], code: 201, input: [name, credential_type, credential_expiry], output: Driver, side_effects: [] }
  - { method: GET,  path: "/med-courier/drivers/{id}", description: "Fetch a driver", roles: [Dispatcher, ComplianceOfficer], code: 200, input: [], output: Driver, side_effects: [] }
  - { method: POST, path: "/med-courier/drivers/{id}/credential", description: "Renew/suspend/reinstate a driver credential", roles: [ComplianceOfficer], code: 200, input: [action, "credential_expiry?"], output: Driver, side_effects: ["ACTIVE<->SUSPENDED; RENEW sets credential_expiry"] }
  - { method: POST, path: "/med-courier/vehicles", description: "Create a vehicle", roles: [Dispatcher], code: 201, input: [plate, has_refrigeration, "sanitation_buffer_minutes?"], output: Vehicle, side_effects: [] }
  - { method: GET,  path: "/med-courier/vehicles/{id}", description: "Fetch a vehicle", roles: [Dispatcher, ComplianceOfficer], code: 200, input: [], output: Vehicle, side_effects: [] }

  # ---- recurring lab route templates ----
  - { method: POST, path: "/med-courier/route-templates", description: "Create a recurring lab-route template", roles: [Dispatcher], code: 201, input: [lab_client_id, rate_card_id, cadence, default_run_type, stop_specs], output: RouteTemplate, side_effects: [] }
  - { method: GET,  path: "/med-courier/route-templates", description: "List route templates (filterable)", roles: [Dispatcher, LabClient], code: 200, input: ["lab_client_id?", "rate_card_id?", "limit?", "offset?"], output: "RouteTemplate[]", side_effects: [] }
  - { method: GET,  path: "/med-courier/route-templates/{id}", description: "Fetch a route template", roles: [Dispatcher, LabClient], code: 200, input: [], output: RouteTemplate, side_effects: [] }
  - { method: POST, path: "/med-courier/route-templates/{id}/generate-route", description: "Instantiate a Route (+Stops) from a template", roles: [Dispatcher], code: 201, input: [scheduled_start, scheduled_end, "run_type?"], output: Route, side_effects: ["create Route (template_id set, status PLANNED); create one Stop per template.stop_specs entry; compute sla_deadline"] }

  # ---- route lifecycle ----
  - { method: POST, path: "/med-courier/routes", description: "Create a route", roles: [Dispatcher, LabClient], code: 201, input: [lab_client_id, rate_card_id, run_type, scheduled_start, scheduled_end, planned_total_miles], output: Route, side_effects: ["compute sla_deadline"] }
  - { method: GET,  path: "/med-courier/routes", description: "List routes (filterable)", roles: [Dispatcher, ComplianceOfficer, LabClient], code: 200, input: ["lab_client_id?", "rate_card_id?", "template_id?", "driver_id?", "vehicle_id?", "status?", "limit?", "offset?"], output: "Route[]", side_effects: [] }
  - { method: GET,  path: "/med-courier/routes/{id}", description: "Fetch a route", roles: [Dispatcher, ComplianceOfficer, LabClient, Driver], code: 200, input: [], output: Route, side_effects: [] }
  - { method: POST, path: "/med-courier/routes/{id}/stops", description: "Append a stop to a route", roles: [Dispatcher, LabClient], code: 201, input: [sequence, address, stop_kind, planned_leg_miles], output: Stop, side_effects: [] }
  - { method: POST, path: "/med-courier/routes/{id}/specimens", description: "Register a specimen on a route (pickup/dropoff stops)", roles: [Dispatcher, LabClient], code: 201, input: [pickup_stop_id, dropoff_stop_id, specimen_type, temp_requirement, required_temp_min_c, required_temp_max_c], output: Specimen, side_effects: [] }
  - { method: POST, path: "/med-courier/routes/{id}/assign", description: "Assign driver + vehicle (PLANNED->ASSIGNED)", roles: [Dispatcher], code: 200, input: [driver_id, vehicle_id], output: Route, side_effects: ["set driver_id/vehicle_id; vehicle->IN_USE"] }
  - { method: POST, path: "/med-courier/routes/{id}/unassign", description: "Release driver + vehicle (ASSIGNED->PLANNED)", roles: [Dispatcher], code: 200, input: [], output: Route, side_effects: ["clear driver_id/vehicle_id; vehicle->AVAILABLE"] }
  - { method: POST, path: "/med-courier/routes/{id}/dispatch", description: "Dispatch a route (ASSIGNED->DISPATCHED)", roles: [Dispatcher], code: 200, input: [], output: Route, side_effects: ["compute provisional_charge_cents"] }
  - { method: POST, path: "/med-courier/routes/{id}/complete", description: "Complete a route (DISPATCHED->COMPLETED)", roles: [Dispatcher], code: 200, input: [], output: Route, side_effects: ["compute final_charge_cents; vehicle->AVAILABLE + last_released_at"] }
  - { method: POST, path: "/med-courier/routes/{id}/billing", description: "Generate a RunBilling for a completed route (OCC on route.version)", roles: [Dispatcher], code: 201, input: [expected_route_version], output: RunBilling, side_effects: ["snapshot gross/surcharge/net from route.final_charge_cents; increments Route.version by 1"] }

  # ---- stop / scan operations ----
  - { method: GET,  path: "/med-courier/stops", description: "List stops (filterable)", roles: [Dispatcher, ComplianceOfficer, LabClient, Driver], code: 200, input: ["route_id?", "status?", "limit?", "offset?"], output: "Stop[]", side_effects: [] }
  - { method: GET,  path: "/med-courier/stops/{id}", description: "Fetch a stop", roles: [Dispatcher, ComplianceOfficer, LabClient, Driver], code: 200, input: [], output: Stop, side_effects: [] }
  - { method: POST, path: "/med-courier/stops/{id}/scan", description: "Record a pickup/dropoff scan (chain-of-custody + temperature)", roles: [Driver], code: 201, input: [specimen_id, scan_type, temp_reading_c, leg_miles], output: ScanEvent, side_effects: ["stop SCHEDULED->ARRIVED on first scan; specimen custody transition; excursion eval; bubble-up stop completion"] }
  - { method: POST, path: "/med-courier/stops/{id}/miss", description: "Mark a stop missed (cascade to specimens + exceptions)", roles: [Driver, Dispatcher], code: 200, input: [], output: Stop, side_effects: ["MISSED cascade: specimens->EXCEPTION; open MISSED_STOP exceptions"] }
  - { method: POST, path: "/med-courier/stops/{id}/reschedule", description: "Reschedule a missed stop (MISSED->SCHEDULED)", roles: [Dispatcher], code: 200, input: [], output: Stop, side_effects: ["clear arrived_at"] }

  # ---- specimens / scan-events / exceptions / billings (reads + resolution) ----
  - { method: GET,  path: "/med-courier/specimens", description: "List specimens (filterable)", roles: [Dispatcher, ComplianceOfficer, LabClient, Driver], code: 200, input: ["route_id?", "pickup_stop_id?", "dropoff_stop_id?", "custody_status?", "limit?", "offset?"], output: "Specimen[]", side_effects: [] }
  - { method: GET,  path: "/med-courier/specimens/{id}", description: "Fetch a specimen", roles: [Dispatcher, ComplianceOfficer, LabClient, Driver], code: 200, input: [], output: Specimen, side_effects: [] }
  - { method: GET,  path: "/med-courier/scan-events", description: "List chain-of-custody scan events (filterable)", roles: [Dispatcher, ComplianceOfficer, LabClient, Driver], code: 200, input: ["specimen_id?", "driver_id?", "stop_id?", "limit?", "offset?"], output: "ScanEvent[]", side_effects: [] }
  - { method: GET,  path: "/med-courier/scan-events/{id}", description: "Fetch a scan event", roles: [Dispatcher, ComplianceOfficer, LabClient, Driver], code: 200, input: [], output: ScanEvent, side_effects: [] }
  - { method: GET,  path: "/med-courier/exceptions", description: "List route exceptions (filterable)", roles: [Dispatcher, ComplianceOfficer, LabClient], code: 200, input: ["route_id?", "stop_id?", "specimen_id?", "status?", "limit?", "offset?"], output: "RouteException[]", side_effects: [] }
  - { method: GET,  path: "/med-courier/exceptions/{id}", description: "Fetch a route exception", roles: [Dispatcher, ComplianceOfficer, LabClient], code: 200, input: [], output: RouteException, side_effects: [] }
  - { method: POST, path: "/med-courier/exceptions/{id}/resolve", description: "Resolve an open exception (OPEN->RESOLVED)", roles: [ComplianceOfficer], code: 200, input: ["resolution_note?"], output: RouteException, side_effects: [] }
  - { method: GET,  path: "/med-courier/billings", description: "List run billings (filterable)", roles: [Dispatcher, ComplianceOfficer, LabClient], code: 200, input: ["route_id?", "lab_client_id?", "status?", "limit?", "offset?"], output: "RunBilling[]", side_effects: [] }
  - { method: GET,  path: "/med-courier/billings/{id}", description: "Fetch a run billing", roles: [Dispatcher, ComplianceOfficer, LabClient], code: 200, input: [], output: RunBilling, side_effects: [] }
  - { method: POST, path: "/med-courier/billings/{id}/issue", description: "Issue a draft billing (DRAFT->ISSUED, debits lab)", roles: [Dispatcher], code: 200, input: [], output: RunBilling, side_effects: ["lab.billed_balance_cents += net_charge_cents"] }
  - { method: POST, path: "/med-courier/billings/{id}/void", description: "Void an issued billing (ISSUED->VOIDED, credits lab back)", roles: [Dispatcher], code: 200, input: [], output: RunBilling, side_effects: ["lab.billed_balance_cents -= net_charge_cents"] }

  # ---- logical clock (test-driving) ----
  - { method: POST, path: "/_clock/set_current_utc", description: "Set the server logical clock. Startup default is 2026-05-01T00:00:00Z; before any set the clock reads exactly this default (never wall-clock).", roles: [Dispatcher], code: 200, input: [to_iso8601], output: null, side_effects: ["all clock_now reads use this value"] }

# =============================================================================
# 1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED,            http: 401, condition: "missing/unknown X-User-Role or X-User-ID" }
  - { id: ERR_UNAUTHORIZED,               http: 403, condition: "role not permitted, or entity-backed role acting on a resource it does not own" }
  - { id: ERR_VALIDATION,                 http: 400, condition: "malformed body: missing required field, invalid enum, scheduled_end <= scheduled_start, or required_temp_max_c < required_temp_min_c" }
  - { id: ERR_ROUTE_NOT_FOUND,            http: 404, condition: "route id does not exist" }
  - { id: ERR_STOP_NOT_FOUND,             http: 404, condition: "stop id does not exist" }
  - { id: ERR_SPECIMEN_NOT_FOUND,         http: 404, condition: "specimen id does not exist" }
  - { id: ERR_DRIVER_NOT_FOUND,           http: 404, condition: "driver id does not exist" }
  - { id: ERR_VEHICLE_NOT_FOUND,          http: 404, condition: "vehicle id does not exist" }
  - { id: ERR_LAB_CLIENT_NOT_FOUND,       http: 404, condition: "lab client id does not exist" }
  - { id: ERR_RATE_CARD_NOT_FOUND,        http: 404, condition: "rate card id does not exist" }
  - { id: ERR_TEMPLATE_NOT_FOUND,         http: 404, condition: "route template id does not exist" }
  - { id: ERR_EXCEPTION_NOT_FOUND,        http: 404, condition: "route exception id does not exist" }
  - { id: ERR_BILLING_NOT_FOUND,          http: 404, condition: "run billing id does not exist" }
  - { id: ERR_ROUTE_INVALID_STATE,        http: 409, condition: "route not in the state required for the transition" }
  - { id: ERR_STOP_INVALID_STATE,         http: 409, condition: "stop not in the state required for the transition" }
  - { id: ERR_SPECIMEN_INVALID_STATE,     http: 409, condition: "specimen custody_status not valid for this scan (e.g. dropoff before pickup)" }
  - { id: ERR_BILLING_INVALID_STATE,      http: 409, condition: "billing not in DRAFT (issue) or not in ISSUED (void)" }
  - { id: ERR_EXCEPTION_INVALID_STATE,    http: 409, condition: "exception not OPEN when resolving" }
  - { id: ERR_DRIVER_INVALID_STATE,       http: 409, condition: "driver credential action invalid for current status (e.g. SUSPEND an already-SUSPENDED driver)" }
  - { id: ERR_STALE_VERSION,              http: 412, condition: "expected_route_version != route.version on billing create (OCC)" }
  - { id: ERR_DRIVER_CREDENTIAL_INVALID,  http: 422, condition: "driver SUSPENDED or credential_expiry <= clock_now at assign/dispatch" }
  - { id: ERR_CREDENTIAL_TYPE_INSUFFICIENT, http: 422, condition: "driver credential_type too low for a specimen (CULTURE->BLOODBORNE/HAZMAT; FROZEN->HAZMAT)" }
  - { id: ERR_VEHICLE_REFRIGERATION_REQUIRED, http: 422, condition: "vehicle lacks refrigeration but a specimen requires REFRIGERATED/FROZEN" }
  - { id: ERR_VEHICLE_NOT_AVAILABLE,      http: 409, condition: "vehicle.status != AVAILABLE at assign" }
  - { id: ERR_DRIVER_SCHEDULE_CONFLICT,   http: 409, condition: "driver already assigned to an overlapping [start,end) route window" }
  - { id: ERR_VEHICLE_BUFFER_CONFLICT,    http: 409, condition: "route.scheduled_start falls within the vehicle sanitation buffer after its last release" }
  - { id: ERR_ROUTE_HAS_NO_STOPS,         http: 422, condition: "dispatch attempted on a route with zero stops" }
  - { id: ERR_DUPLICATE_STOP_SEQUENCE,    http: 409, condition: "stop.sequence already used on this route" }
  - { id: ERR_SPECIMEN_STOP_MISMATCH,     http: 422, condition: "scan target stop is not the specimen's pickup (PICKUP) or dropoff (DROPOFF) stop" }
  - { id: ERR_STOPS_NOT_RESOLVED,         http: 409, condition: "route completion attempted while some stop is neither COMPLETED nor MISSED" }
  - { id: ERR_BUDGET_EXCEEDED,            http: 402, condition: "lab.billed_balance_cents + charge would exceed lab.budget_cents (dispatch provisional / issue net)" }

# =============================================================================
# 1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Dispatcher
    description: "Operations controller: builds routes/templates, assigns and dispatches, resolves logistics, generates and voids billing."
    identity: "opaque"
    exclusive_operations:
      - "POST /med-courier/rate-cards"
      - "POST /med-courier/lab-clients"
      - "POST /med-courier/vehicles"
      - "POST /med-courier/route-templates"
      - "POST /med-courier/route-templates/{id}/generate-route"
      - "POST /med-courier/routes/{id}/assign"
      - "POST /med-courier/routes/{id}/unassign"
      - "POST /med-courier/routes/{id}/dispatch"
      - "POST /med-courier/routes/{id}/complete"
      - "POST /med-courier/routes/{id}/billing"
      - "POST /med-courier/routes/{id}/reschedule"
      - "POST /med-courier/billings/{id}/issue"
      - "POST /med-courier/billings/{id}/void"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "POST /med-courier/routes (with LabClient)"
      - "POST /med-courier/routes/{id}/stops (with LabClient)"
      - "POST /med-courier/routes/{id}/specimens (with LabClient)"
      - "POST /med-courier/stops/{id}/miss (with Driver)"
      - "POST /med-courier/drivers (with ComplianceOfficer)"
      - "all GET reads"

  - name: Driver
    description: "Courier who executes runs: scans specimens at pickup/dropoff and reports missed stops for their own assigned route."
    identity: "entity_backed:Driver"
    exclusive_operations:
      - "POST /med-courier/stops/{id}/scan (only for stops whose route.driver_id == X-User-ID)"
    shared_operations:
      - "POST /med-courier/stops/{id}/miss (with Dispatcher)"
      - "GET reads of own routes/stops/specimens/scan-events"

  - name: LabClient
    description: "Ordering laboratory: builds its own routes and manifests, views its billing."
    identity: "entity_backed:LabClient"
    exclusive_operations: []
    shared_operations:
      - "POST /med-courier/routes (lab_client_id == X-User-ID)"
      - "POST /med-courier/routes/{id}/stops (own routes)"
      - "POST /med-courier/routes/{id}/specimens (own routes)"
      - "GET reads of own routes/specimens/exceptions/billings"

  - name: ComplianceOfficer
    description: "Governs driver credentials and adjudicates chain-of-custody exceptions."
    identity: "opaque"
    exclusive_operations:
      - "POST /med-courier/drivers/{id}/credential"
      - "POST /med-courier/exceptions/{id}/resolve"
    shared_operations:
      - "POST /med-courier/drivers (with Dispatcher)"
      - "GET reads"
