  # =========================================================================
  # Rule 5 - Validation priority conflicts across different error-category pairs
  # =========================================================================
  - rule_id: priority_pair_validation_conflict
    instances:

      - name: state_priority_beats_temporal_priority_on_timesheet_create
        grounds:
          - validations[priority=7]
          - validations[priority=14]
          - errors[ERR_ASSIGNMENT_NOT_ACTIVE]
          - errors[ERR_WEEK_OUTSIDE_TERM]
        distinguishing_aspect: |
          Error-category pair `state` (priority 7, ERR_ASSIGNMENT_NOT_ACTIVE)
          versus `business_temporal` (priority 14, ERR_WEEK_OUTSIDE_TERM). A
          single POST /timesheets violates both and MUST return the state error.
        test_recipe:
          setup:
            - "Assignment 2026-06-07 .. 2026-09-05 with contract FULLY_EXECUTED, so staffing_status is PENDING_START - never activated."
            - "Logical clock left at its 2026-05-01 default."
            - "The submitted week 2026-05-31 is both before the assignment start_date AND after the clock date, so ERR_WEEK_OUTSIDE_TERM is independently violated."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-05-01T00:00:00Z" }
              as: PlatformAdmin
            - call: "POST /per-diem-localities"
              payload: { locality_code: "PHX-AZ", state_code: "AZ", daily_lodging_cents: 15000, daily_mie_cents: 7900, effective_from: "2026-01-01" }
