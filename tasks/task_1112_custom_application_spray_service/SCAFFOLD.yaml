# =============================================================================
# Task 1112 — Custom Application & Spray Service (co-op custom applicator)
# Seed tables: §1.0–§1.7
# =============================================================================

scenario: |
  generate task hard than expert level! 1112. Custom Application & Spray Service (co-op custom applicator): work order by field & product prescription, applicator license & record-keeping requirement, tank mix compatibility & rinsate management, weather/drift restriction & buffer compliance, application timing window & re-entry interval, per-acre billing & product markup, drift complaint investigation, equipment calibration record

domain_name: custom-spray-service
api_prefix: /api

complexity_profile:
  primary_archetype: compliance_audit
  secondary_archetype: temporal_windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
  entity_topology: flat
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - many_to_many
    - self_referential
    - cross_aggregate
  role_model: segregation_of_duties
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Customer
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Grower / farm account name" }
      - { name: billing_email, type: string, source: input, description: "Invoice delivery email" }
      - { name: rate_per_acre_cents, type: integer, source: input, description: "Contracted application service fee per treated acre, in cents" }
      - { name: credit_limit_cents, type: integer, source: input, description: "Maximum outstanding invoice balance allowed, in cents" }
      - { name: outstanding_cents, type: integer, source: computed, default: 0, description: "Sum of final_amount_cents over this customer's ISSUED invoices; debited on issue, credited on void or payment of a formerly issued invoice" }

  - name: Field
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; owning grower account" }
      - { name: label, type: string, source: input, description: "Human label, e.g. 'North 40'" }
      - { name: crop, type: string, source: input, description: "Crop under treatment, e.g. CORN" }
      - { name: acres, type: number, source: input, description: "Total field acreage; work order acres_to_treat may not exceed this" }
      - { name: buffer_clearance_ft, type: integer, source: input, description: "Measured distance in feet from field boundary to nearest sensitive area (water, school, organic neighbor)" }
      - { name: rei_until, type: datetime, source: computed, default: null, description: "Re-entry interval lockout end; set at each work order completion to completed_at + max(rei_hours of applied products), never moved earlier; null when no application has completed" }

  - name: Product
    parent: null
    common_fields: true
    fields:
      - { name: name, type: string, source: input, description: "Product trade name" }
      - { name: epa_registration_no, type: string, source: input, description: "EPA registration number on the label" }
      - { name: category, type: enum, source: input, description: "HERBICIDE | INSECTICIDE | FUNGICIDE — applicator license must cover every category in a tank mix" }
      - { name: rei_hours, type: integer, source: input, description: "Re-entry interval in hours after application" }
      - { name: max_wind_mph, type: number, source: input, description: "Label maximum sustained wind speed for application" }
      - { name: min_temp_f, type: number, source: input, description: "Label minimum air temperature (F)" }
      - { name: max_temp_f, type: number, source: input, description: "Label maximum air temperature (F)" }
      - { name: required_buffer_ft, type: integer, source: input, description: "Label-required downwind buffer to sensitive areas; must be <= field buffer_clearance_ft" }
      - { name: unit_cost_cents, type: integer, source: input, description: "Co-op cost per gallon of product, in cents" }
      - { name: markup_pct, type: number, source: input, description: "Product markup percentage applied on top of unit_cost_cents when billing (15 means 15%)" }

  - name: CompatibilityRule
    parent: null
    common_fields: false
    fields:
      - { name: product_a_id, type: string, source: input, description: "FK -> Product.id; one side of the unordered pair" }
      - { name: product_b_id, type: string, source: input, description: "FK -> Product.id; other side of the unordered pair" }
      - { name: verdict, type: enum, source: input, description: "COMPATIBLE | CONDITIONAL | INCOMPATIBLE — CONDITIONAL requires uses_adjuvant=true on the work order" }
      - { name: note, type: string, source: input, required: false, description: "Free-text label note" }
      # At most one rule per unordered pair {a,b}; a pair with no rule is treated as COMPATIBLE.

  - name: Prescription
    parent: null
    common_fields: true
    fields:
      - { name: field_id, type: string, source: input, description: "FK -> Field.id; target field" }
      - { name: season_year, type: integer, source: input, description: "Growing season year; at most one APPROVED prescription per (field_id, season_year)" }
      - { name: valid_from, type: datetime, source: input, description: "Application window open (inclusive)" }
      - { name: valid_to, type: datetime, source: input, description: "Application window close (inclusive); scheduled_end must be <= valid_to" }
      - { name: carrier_gpa, type: number, source: input, description: "Total carrier volume (water + product) per acre in gallons; drives load and rinsate math" }
      - { name: lines, type: array, source: input, description: "Array of { product_id, rate_per_acre } — prescribed product set; each product appears at most once; rate_per_acre > 0" }
      - { name: status, type: enum, source: system, description: "DRAFT | APPROVED | SUPERSEDED" }
      - { name: created_by_user_id, type: string, source: system, description: "X-User-ID of the creating Agronomist (opaque operator id, not an entity reference)" }

  - name: Applicator
    parent: null
    common_fields: true
    fields:
      - { name: display_name, type: string, source: input, description: "Applicator name" }
      - { name: license_no, type: string, source: input, description: "State applicator license number" }
      - { name: license_expires_on, type: datetime, source: input, description: "License expiry instant; license valid for a job iff license_expires_on >= scheduled_end" }
      - { name: license_categories, type: array, source: input, description: "Array of category enums the license covers (HERBICIDE | INSECTICIDE | FUNGICIDE)" }
      - { name: status, type: enum, source: system, description: "ACTIVE | SUSPENDED | REVOKED" }
      - { name: penalty_points_lifetime, type: integer, source: computed, default: 0, description: "Sum of severity weights over all SUBSTANTIATED drift complaints (MINOR=2, MAJOR=5), no recency multiplier" }
      - { name: rolling_score_365, type: integer, source: computed, default: 0, description: "Sum of severity weights over SUBSTANTIATED complaints substantiated within trailing 365 days; doubled when >= 2 substantiations fall within trailing 90 days" }

  - name: Equipment
    parent: null
    common_fields: true
    fields:
      - { name: unit_label, type: string, source: input, description: "Sprayer unit label, e.g. 'Sprayer-1'" }
      - { name: tank_capacity_gal, type: integer, source: input, description: "Tank capacity in gallons; drives load count" }
      - { name: status, type: enum, source: system, description: "AVAILABLE | CALIBRATION_DUE" }
      - { name: calibration_valid_until, type: datetime, source: computed, default: null, description: "performed_at + 180 days of the most recent PASS CalibrationRecord; null until first PASS; not changed by FAIL" }

  - name: CalibrationRecord
    parent: null
    common_fields: false
    fields:
      - { name: equipment_id, type: string, source: input, description: "FK -> Equipment.id; sprayer under test" }
      - { name: applicator_id, type: string, source: system, description: "FK -> Applicator.id; performing applicator, taken from X-User-ID when role is Applicator; required in payload when role is CoopAdmin" }
      - { name: performed_at, type: datetime, source: system, description: "Logical clock value at record creation" }
      - { name: target_gpa, type: number, source: input, description: "Target sprayer output, gallons per acre" }
      - { name: measured_gpa, type: number, source: input, description: "Measured sprayer output, gallons per acre" }
      - { name: error_pct, type: number, source: computed, description: "round(|measured_gpa - target_gpa| / target_gpa * 100, 2)" }
      - { name: verdict, type: enum, source: computed, description: "PASS iff error_pct <= 5.0 else FAIL" }

  - name: WeatherObservation
    parent: null
    common_fields: false
    fields:
      - { name: observed_at, type: datetime, source: input, description: "Instant the weather reading was taken" }
      - { name: wind_mph, type: number, source: input, description: "Sustained wind speed" }
      - { name: temp_f, type: number, source: input, description: "Air temperature (F)" }
      - { name: inversion_present, type: boolean, source: input, description: "True when a temperature inversion is present (drift risk)" }
      - { name: recorded_by_user_id, type: string, source: system, description: "X-User-ID of the recorder" }

  - name: WorkOrder
    parent: null
    common_fields: true
    fields:
      - { name: customer_id, type: string, source: input, description: "FK -> Customer.id; billing account" }
      - { name: field_id, type: string, source: input, description: "FK -> Field.id; target field" }
      - { name: prescription_id, type: string, source: input, description: "FK -> Prescription.id; governing prescription" }
      - { name: acres_to_treat, type: number, source: input, description: "Acres to treat; must be > 0 and <= field.acres" }
      - { name: applicator_id, type: string, source: system, description: "FK -> Applicator.id; assigned applicator; null until scheduled; cleared on cascade revert" }
      - { name: equipment_id, type: string, source: system, description: "FK -> Equipment.id; assigned sprayer; null until scheduled; cleared on cascade revert" }
      - { name: scheduled_start, type: datetime, source: system, description: "Scheduled window open; null until scheduled" }
      - { name: scheduled_end, type: datetime, source: system, description: "Scheduled window close; null until scheduled" }
      - { name: uses_adjuvant, type: boolean, source: system, default: false, description: "True when the tank mix includes the adjuvant required by CONDITIONAL compatibility pairs" }
      - { name: status, type: enum, source: system, description: "DRAFT | SCHEDULED | IN_PROGRESS | WEATHER_HOLD | COMPLETED | CLOSED | CANCELLED" }
      - { name: started_at, type: datetime, source: system, default: null, description: "Logical clock at start" }
      - { name: completed_at, type: datetime, source: system, default: null, description: "Logical clock at completion" }
      - { name: estimated_total_cents, type: integer, source: computed, default: null, description: "Provisional invoice_amount computed at schedule time from prescribed rates; null while DRAFT; cleared on cascade revert" }
      - { name: rinsate_generated_gal, type: number, source: computed, default: 0, description: "Rinsate volume generated at completion = ceil(acres_to_treat * carrier_gpa / tank_capacity_gal) loads * tank_capacity_gal * 0.02, 1 decimal" }
      - { name: rinsate_balance_gal, type: number, source: computed, default: 0, description: "rinsate_generated_gal - sum of disposal RinsateRecord.volume_gal; must be 0 to close" }

  - name: ApplicationRecord
    parent: null
    common_fields: true
    fields:
      - { name: work_order_id, type: string, source: system, description: "FK -> WorkOrder.id; exactly one record per work order" }
      - { name: applicator_id, type: string, source: system, description: "FK -> Applicator.id; applicator who performed the work, snapshotted from the work order" }
      - { name: lines, type: array, source: input, description: "Array of { product_id, actual_rate_per_acre }; must cover exactly the prescription's product set" }
      - { name: started_at, type: datetime, source: system, description: "Copied from work order started_at" }
      - { name: completed_at, type: datetime, source: system, description: "Copied from work order completed_at" }
      - { name: status, type: enum, source: system, description: "SUBMITTED | CERTIFIED | RETURNED" }
      - { name: returned_note, type: string, source: input, required: false, description: "Compliance officer's reason when RETURNED" }
      - { name: certified_by_user_id, type: string, source: system, default: null, description: "X-User-ID of certifier; MUST differ from applicator_id (segregation of duties)" }

  - name: RinsateRecord
    parent: null
    common_fields: false
    fields:
      - { name: work_order_id, type: string, source: input, description: "FK -> WorkOrder.id; the completed work order whose rinsate is being disposed" }
      - { name: kind, type: enum, source: input, description: "FIELD_DISPOSAL | CONTAINMENT_DISPOSAL" }
      - { name: volume_gal, type: number, source: input, description: "Disposed volume; must be > 0 and <= current rinsate_balance_gal" }
      - { name: disposal_field_id, type: string, source: input, required: false, description: "FK -> Field.id; required for FIELD_DISPOSAL and must equal the work order's field_id" }
      - { name: manifest_no, type: string, source: input, required: false, description: "Containment manifest number; required for CONTAINMENT_DISPOSAL" }
      - { name: recorded_at, type: datetime, source: system, description: "Logical clock at creation" }

  - name: DriftComplaint
    parent: null
    common_fields: true
    fields:
      - { name: complainant_customer_id, type: string, source: system, description: "FK -> Customer.id; filing grower, taken from X-User-ID (may be a neighbor of the treated field)" }
      - { name: work_order_id, type: string, source: input, description: "FK -> WorkOrder.id; complained-about application; must be COMPLETED" }
      - { name: applicator_id, type: string, source: system, description: "FK -> Applicator.id; denormalized from the work order at filing" }
      - { name: description, type: string, source: input, description: "Complaint narrative" }
      - { name: severity, type: enum, source: input, description: "MINOR | MAJOR — drives penalty weight on substantiation" }
      - { name: status, type: enum, source: system, description: "FILED | INVESTIGATING | SUBSTANTIATED | DISMISSED" }
      - { name: findings_note, type: string, source: input, required: false, description: "Investigator findings recorded on substantiate/dismiss" }

  - name: Invoice
    parent: null
    common_fields: true
    fields:
      - { name: work_order_id, type: string, source: system, description: "FK -> WorkOrder.id; exactly one invoice per work order, created at completion" }
      - { name: provisional_amount_cents, type: integer, source: computed, description: "invoice_amount provisional variant (prescribed rates), computed at work order completion" }
      - { name: final_amount_cents, type: integer, source: computed, default: null, description: "invoice_amount final variant (certified actual rates), computed when the application record is CERTIFIED" }
      - { name: status, type: enum, source: system, description: "DRAFT | ISSUED | PAID | VOIDED" }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Prescription
    initial_state: DRAFT
    terminal_states: [SUPERSEDED]
    transitions:
      - from: DRAFT
        to: APPROVED
        trigger: "POST /api/prescriptions/{id}/approve"
        actor: Agronomist
        preconditions:
          - "OCC: payload expected_field_version must equal Field.version of prescription.field_id (else ERR_STALE_VERSION 412)"
          - "buffer compliance: every line product's required_buffer_ft <= Field.buffer_clearance_ft (else ERR_BUFFER_VIOLATION)"
          - "tank mix: no line pair with verdict INCOMPATIBLE (else ERR_INCOMPATIBLE_TANK_MIX)"
        side_effects:
          - "Any other APPROVED Prescription with same (field_id, season_year) -> SUPERSEDED"
          - "increments Field.version by 1 (approval changes the field's governing prescription)"
          - "increments Prescription.version by 1"
      - from: APPROVED
        to: SUPERSEDED
        trigger: "system (automatic when another prescription for the same field_id + season_year is approved)"
        actor: system
        preconditions: []
        side_effects:
          - "increments Prescription.version by 1"
        note: "DRAFT prescriptions are never auto-superseded; only the single APPROVED one per field+season is replaced."

  - entity: WorkOrder
    initial_state: DRAFT
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: DRAFT
        to: SCHEDULED
        trigger: "POST /api/work-orders/{id}/schedule"
        actor: Dispatcher
        preconditions:
          - "Prescription of prescription_id is APPROVED (else ERR_PRESCRIPTION_NOT_APPROVED)"
          - "Applicator exists and status == ACTIVE (else ERR_APPLICATOR_NOT_ACTIVE)"
          - "applicator.license_expires_on >= scheduled_end (else ERR_LICENSE_EXPIRED)"
          - "applicator.license_categories covers every product category in the prescription lines (else ERR_LICENSE_CATEGORY_MISSING)"
          - "every line product's required_buffer_ft <= field.buffer_clearance_ft (else ERR_BUFFER_VIOLATION)"
          - "no line pair verdict INCOMPATIBLE (else ERR_INCOMPATIBLE_TANK_MIX); every CONDITIONAL pair requires uses_adjuvant == true (else ERR_ADJUVANT_REQUIRED)"
          - "prescription.valid_from <= scheduled_start AND scheduled_end <= prescription.valid_to AND scheduled_start < scheduled_end (else ERR_OUTSIDE_APPLICATION_WINDOW / ERR_VALIDATION)"
          - "no other SCHEDULED or IN_PROGRESS work order on the same field with half-open interval overlap [start, end) (else ERR_FIELD_TIME_CONFLICT; adjacency end == start is allowed)"
          - "no other SCHEDULED or IN_PROGRESS work order of the same applicator within a 30-minute travel buffer, i.e. padded overlap [start - 30min, end + 30min) (else ERR_APPLICATOR_TIME_CONFLICT)"
          - "equipment status == AVAILABLE AND equipment.calibration_valid_until != null AND >= scheduled_end (else ERR_CALIBRATION_OVERDUE)"
          - "customer.outstanding_cents + estimated_total_cents <= customer.credit_limit_cents (else ERR_CREDIT_LIMIT_EXCEEDED)"
        side_effects:
          - "sets applicator_id, equipment_id, scheduled_start, scheduled_end, uses_adjuvant"
          - "estimated_total_cents = invoice_amount(provisional) over prescription rates"
          - "increments WorkOrder.version by 1"
      - from: SCHEDULED
        to: SCHEDULED
        trigger: "POST /api/work-orders/{id}/reschedule"
        actor: Dispatcher
        preconditions:
          - "OCC: payload expected_work_order_version must equal current WorkOrder.version (else ERR_STALE_VERSION 412)"
          - "window and overlap preconditions re-evaluated for the new window (ERR_OUTSIDE_APPLICATION_WINDOW / ERR_FIELD_TIME_CONFLICT / ERR_APPLICATOR_TIME_CONFLICT)"
          - "if applicator_id present in payload: license/active/category checks re-run; if equipment_id present: calibration check re-runs"
        side_effects:
          - "applies new window and any reassignment"
          - "increments WorkOrder.version by 1"
      - from: SCHEDULED
        to: IN_PROGRESS
        trigger: "POST /api/work-orders/{id}/start"
        actor: Applicator
        preconditions:
          - "X-User-ID == work_order.applicator_id (else ERR_FORBIDDEN)"
          - "logical now <= scheduled_end (else ERR_OUTSIDE_APPLICATION_WINDOW)"
          - "field.rei_until is null OR logical now >= field.rei_until (else ERR_REI_ACTIVE)"
          - "latest WeatherObservation by observed_at is <= 60 minutes old relative to now (else ERR_OBSERVATION_STALE)"
          - "mix_weather_envelope(latest observation, prescription products) passes (else ERR_WEATHER_WINDOW_VIOLATION)"
          - "applicator still ACTIVE and license_expires_on >= now (else ERR_APPLICATOR_NOT_ACTIVE / ERR_LICENSE_EXPIRED)"
        side_effects:
          - "started_at = logical now"
          - "increments WorkOrder.version by 1"
      - from: IN_PROGRESS
        to: WEATHER_HOLD
        trigger: "system (automatic when a newly posted WeatherObservation violates the mix envelope of an IN_PROGRESS work order)"
        actor: system
        preconditions: []
        side_effects:
          - "increments WorkOrder.version by 1"
        note: "Assignment is retained; the same applicator resumes once weather clears."
      - from: WEATHER_HOLD
        to: IN_PROGRESS
        trigger: "POST /api/work-orders/{id}/resume"
        actor: Applicator
        preconditions:
          - "X-User-ID == work_order.applicator_id (else ERR_FORBIDDEN)"
          - "latest WeatherObservation <= 60 minutes old (else ERR_OBSERVATION_STALE) and envelope passes (else ERR_WEATHER_WINDOW_VIOLATION)"
        side_effects:
          - "increments WorkOrder.version by 1"
      - from: IN_PROGRESS
        to: COMPLETED
        trigger: "POST /api/work-orders/{id}/complete"
        actor: Applicator
        preconditions:
          - "X-User-ID == work_order.applicator_id (else ERR_FORBIDDEN)"
          - "payload lines cover exactly the prescription product set, each once, actual_rate_per_acre > 0 (else ERR_VALIDATION)"
        side_effects:
          - "completed_at = logical now; status COMPLETED"
          - "creates ApplicationRecord (status SUBMITTED) snapshotting lines, applicator_id, started_at, completed_at"
          - "Field.rei_until = max(existing rei_until, completed_at + max(rei_hours over applied products)); increments Field.version by 1"
          - "rinsate_generated_gal per rinsate_generation; rinsate_balance_gal = rinsate_generated_gal"
          - "creates Invoice (status DRAFT) with provisional_amount_cents = invoice_amount(provisional)"
          - "increments WorkOrder.version by 1"
      - from: COMPLETED
        to: CLOSED
        trigger: "POST /api/work-orders/{id}/close"
        actor: Dispatcher
        preconditions:
          - "ApplicationRecord for this work order is CERTIFIED (else ERR_RECORD_NOT_CERTIFIED)"
          - "rinsate_balance_gal == 0 (else ERR_RINSATE_BALANCE_OPEN)"
          - "Invoice status in {PAID, VOIDED} (else ERR_INVOICE_UNSETTLED)"
        side_effects:
          - "increments WorkOrder.version by 1"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /api/work-orders/{id}/cancel"
        actor: "Grower (own customer) | Dispatcher"
        preconditions: []
        side_effects:
          - "increments WorkOrder.version by 1"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /api/work-orders/{id}/cancel"
        actor: "Grower (own customer) | Dispatcher"
        preconditions: []
        side_effects:
          - "increments WorkOrder.version by 1"
      - from: SCHEDULED
        to: DRAFT
        trigger: "system (automatic cascade when the assigned applicator becomes SUSPENDED or REVOKED, or the assigned equipment becomes CALIBRATION_DUE)"
        actor: system
        preconditions: []
        side_effects:
          - "clears applicator_id, equipment_id, scheduled_start, scheduled_end; uses_adjuvant -> false; estimated_total_cents -> null"
          - "increments WorkOrder.version by 1"

  - entity: ApplicationRecord
    initial_state: SUBMITTED
    terminal_states: [CERTIFIED]
    transitions:
      - from: SUBMITTED
        to: CERTIFIED
        trigger: "POST /api/application-records/{id}/certify"
        actor: "ComplianceOfficer | Applicator"
        preconditions:
          - "certifier X-User-ID != record.applicator_id (else ERR_SEGREGATION_OF_DUTIES; an applicator may only certify another applicator's record)"
        side_effects:
          - "certified_by_user_id = X-User-ID"
          - "Invoice of work_order_id: final_amount_cents = invoice_amount(final) over record lines; increments Invoice.version by 1"
          - "increments ApplicationRecord.version by 1"
      - from: SUBMITTED
        to: RETURNED
        trigger: "POST /api/application-records/{id}/return"
        actor: ComplianceOfficer
        preconditions:
          - "payload returned_note non-empty (else ERR_VALIDATION)"
        side_effects:
          - "increments ApplicationRecord.version by 1"
      - from: RETURNED
        to: SUBMITTED
        trigger: "POST /api/application-records/{id}/resubmit"
        actor: Applicator
        preconditions:
          - "X-User-ID == record.applicator_id (else ERR_FORBIDDEN)"
          - "payload lines cover exactly the prescription product set (else ERR_VALIDATION)"
        side_effects:
          - "lines replaced; returned_note cleared"
          - "increments ApplicationRecord.version by 1"

  - entity: Applicator
    initial_state: ACTIVE
    terminal_states: [REVOKED]
    transitions:
      - from: ACTIVE
        to: SUSPENDED
        trigger: "system (automatic when a DriftComplaint against this applicator is SUBSTANTIATED and rolling_score_365 < 10 after the penalty is applied)"
        actor: system
        preconditions: []
        side_effects:
          - "Cascade hop 3: every SCHEDULED WorkOrder with this applicator_id -> DRAFT (applicator_id, equipment_id, window cleared)"
          - "increments Applicator.version by 1"
      - from: SUSPENDED
        to: ACTIVE
        trigger: "POST /api/applicators/{id}/reinstate"
        actor: ComplianceOfficer
        preconditions:
          - "no DriftComplaint with this applicator_id is INVESTIGATING (else ERR_INVESTIGATION_PENDING)"
        side_effects:
          - "increments Applicator.version by 1"
      - from: SUSPENDED
        to: REVOKED
        trigger: "system (automatic on complaint substantiation when rolling_score_365 >= 10 after the penalty is applied)"
        actor: system
        preconditions: []
        side_effects:
          - "Cascade hop 3: every SCHEDULED WorkOrder with this applicator_id -> DRAFT (assignment cleared)"
          - "increments Applicator.version by 1"

  - entity: Equipment
    initial_state: AVAILABLE
    terminal_states: []
    transitions:
      - from: AVAILABLE
        to: CALIBRATION_DUE
        trigger: "system (automatic when a CalibrationRecord with verdict FAIL is posted for this equipment)"
        actor: system
        preconditions: []
        side_effects:
          - "Cascade hop 2: every SCHEDULED WorkOrder with this equipment_id -> DRAFT (assignment cleared)"
          - "increments Equipment.version by 1"
      - from: CALIBRATION_DUE
        to: AVAILABLE
        trigger: "system (automatic when a CalibrationRecord with verdict PASS is posted for this equipment)"
        actor: system
        preconditions: []
        side_effects:
          - "calibration_valid_until = performed_at + 180 days"
          - "increments Equipment.version by 1"
      - from: AVAILABLE
        to: AVAILABLE
        trigger: "system (PASS calibration while already AVAILABLE extends validity)"
        actor: system
        preconditions: []
        side_effects:
          - "calibration_valid_until = performed_at + 180 days"
          - "increments Equipment.version by 1"

  - entity: DriftComplaint
    initial_state: FILED
    terminal_states: [SUBSTANTIATED, DISMISSED]
    transitions:
      - from: FILED
        to: INVESTIGATING
        trigger: "POST /api/drift-complaints/{id}/open-investigation"
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "no applicator change: investigation alone does not suspend; it blocks invoice issue (ERR_COMPLAINT_HOLD) and reinstate (ERR_INVESTIGATION_PENDING)"
          - "increments DriftComplaint.version by 1"
      - from: INVESTIGATING
        to: SUBSTANTIATED
        trigger: "POST /api/drift-complaints/{id}/substantiate"
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "Cascade hop 1: applicator.penalty_points_lifetime += weight(severity); rolling_score_365 recomputed (Applicator mutation)"
          - "Cascade hop 2 (caused by hop 1): applicator ACTIVE -> SUSPENDED when rolling_score_365 < 10, or SUSPENDED -> REVOKED when rolling_score_365 >= 10"
          - "Cascade hop 3 (caused by hop 2): every SCHEDULED WorkOrder with this applicator_id -> DRAFT (assignment cleared)"
          - "Invoice of the complained work order, if DRAFT or ISSUED -> VOIDED; if it was ISSUED, customer.outstanding_cents -= final_amount_cents (increments Customer.version by 1)"
          - "increments DriftComplaint.version by 1"
      - from: INVESTIGATING
        to: DISMISSED
        trigger: "POST /api/drift-complaints/{id}/dismiss"
        actor: ComplianceOfficer
        preconditions: []
        side_effects:
          - "no applicator change (investigation never suspended them); findings_note recorded"
          - "increments DriftComplaint.version by 1"

  - entity: Invoice
    initial_state: DRAFT
    terminal_states: [PAID, VOIDED]
    transitions:
      - from: DRAFT
        to: ISSUED
        trigger: "POST /api/invoices/{id}/issue"
        actor: CoopAdmin
        preconditions:
          - "ApplicationRecord of the work order is CERTIFIED so final_amount_cents exists (else ERR_RECORD_NOT_CERTIFIED)"
          - "no DriftComplaint for this work order in FILED or INVESTIGATING (else ERR_COMPLAINT_HOLD)"
          - "customer.outstanding_cents + final_amount_cents <= credit_limit_cents (else ERR_CREDIT_LIMIT_EXCEEDED)"
        side_effects:
          - "customer.outstanding_cents += final_amount_cents; increments Customer.version by 1"
          - "increments Invoice.version by 1"
      - from: ISSUED
        to: PAID
        trigger: "POST /api/invoices/{id}/pay"
        actor: Grower
        preconditions:
          - "X-User-ID == work order's customer_id (else ERR_FORBIDDEN)"
        side_effects:
          - "customer.outstanding_cents -= final_amount_cents; increments Customer.version by 1"
          - "increments Invoice.version by 1"
      - from: DRAFT
        to: VOIDED
        trigger: "POST /api/invoices/{id}/void OR system (complaint substantiation)"
        actor: "CoopAdmin | system"
        preconditions: []
        side_effects:
          - "no outstanding change (DRAFT invoices never debited)"
          - "increments Invoice.version by 1"
      - from: ISSUED
        to: VOIDED
        trigger: "POST /api/invoices/{id}/void OR system (complaint substantiation)"
        actor: "CoopAdmin | system"
        preconditions: []
        side_effects:
          - "customer.outstanding_cents -= final_amount_cents; increments Customer.version by 1"
          - "increments Invoice.version by 1"

# =============================================================================
# §1.2.1 Concurrency Rules (OCC only)
# =============================================================================
concurrency_rules:
  - rule_id: prescription-approve-stale-field
    parent_entity: Field
    write_endpoint: "POST /api/prescriptions/{id}/approve"
    occ_field: expected_field_version
    description: |
      Approving a prescription against a Field whose version has advanced since the
      agronomist last read it is rejected with 412. This captures the case where
      another approval has just superseded the previously APPROVED prescription for
      the same field + season_year (a legitimate, allowed supersede) and the current
      writer's view of the field's governing prescription is therefore stale. The
      rule is expressed purely as a stale-version check on Field.version.
    error_id: ERR_STALE_VERSION
    http_status: 412
  - rule_id: workorder-reschedule-stale-version
    parent_entity: WorkOrder
    write_endpoint: "POST /api/work-orders/{id}/reschedule"
    occ_field: expected_work_order_version
    description: |
      Rescheduling a SCHEDULED work order is legitimate repeatedly (the window and
      assignments may be amended any number of times while SCHEDULED), so a second
      reschedule carrying a stale expected_work_order_version cannot be rejected on
      state grounds. It is rejected with 412 purely because the client's observed
      WorkOrder.version is stale.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: invoice_amount
    trigger: "provisional: at work order schedule (estimated_total_cents) and at completion (Invoice.provisional_amount_cents); final: at application-record certification (Invoice.final_amount_cents)"
    algorithm: tiered_pricing
    formula: |
      service_fee_cents = round_half_up(acres_to_treat * customer.rate_per_acre_cents)
      for each line i (prescription rates for provisional; certified actual rates for final):
        line_cents_i = round_half_up(acres_to_treat * rate_i * product_i.unit_cost_cents * (1 + product_i.markup_pct / 100))
      total_cents = service_fee_cents + sum(line_cents_i)
      PINNED ROUNDING ORDER: each product line is rounded to whole cents (half-up)
      FIRST, then summed; the service fee is rounded independently. Summing raw
      values and rounding once is a different, non-conforming algorithm.
    input_set: "WorkOrder.acres_to_treat, Customer.rate_per_acre_cents, and the prescription (provisional) or ApplicationRecord (final) lines joined to Product.unit_cost_cents / markup_pct"
    precision: "whole cents, round_half_up, per line then summed"
    variants:
      - name: provisional
        when: "work order schedule and completion (invoice creation)"
        difference: "uses Prescription.lines rate_per_acre"
      - name: final
        when: "application record CERTIFIED"
        difference: "uses ApplicationRecord.lines actual_rate_per_acre; may diverge from provisional whenever actuals differ from prescribed rates"

  - name: mix_weather_envelope
    trigger: "work order start, resume, and automatic WEATHER_HOLD evaluation on each new WeatherObservation"
    algorithm: constraint_propagation
    formula: |
      eff_max_wind = min(product.max_wind_mph over prescription line products)
      eff_temp_low = max(product.min_temp_f over line products)
      eff_temp_high = min(product.max_temp_f over line products)
      latest_obs = WeatherObservation with max observed_at (tie-break: latest created_at)
      fresh := (now - latest_obs.observed_at) <= OBS_MAX_AGE_MINUTES * 60 seconds
      passes := fresh
                AND latest_obs.wind_mph <= eff_max_wind        # boundary: equal passes
                AND eff_temp_low <= latest_obs.temp_f <= eff_temp_high
                AND latest_obs.inversion_present == false
    input_set: "the work order's prescription line products and the freshest WeatherObservation"
    constants:
      OBS_MAX_AGE_MINUTES: 60
    precision: "wind/temp compared as given; no rounding"

  - name: rinsate_generation
    trigger: "work order completion"
    algorithm: aggregation
    formula: |
      total_mix_gal = acres_to_treat * prescription.carrier_gpa
      loads = ceil(total_mix_gal / equipment.tank_capacity_gal)
      rinsate_generated_gal = round(loads * equipment.tank_capacity_gal * RINSE_FRACTION_PER_TANK, 1)
      rinsate_balance_gal starts equal to rinsate_generated_gal; each RinsateRecord
      disposal decrements rinsate_balance_gal by its volume_gal.
    input_set: "the completing WorkOrder, its Prescription.carrier_gpa, and assigned Equipment.tank_capacity_gal"
    constants:
      RINSE_FRACTION_PER_TANK: 0.02
    precision: "1 decimal place, round_half_up"

  - name: calibration_verdict
    trigger: "CalibrationRecord creation"
    algorithm: threshold
    formula: |
      error_pct = round(abs(measured_gpa - target_gpa) / target_gpa * 100, 2)
      verdict = PASS if error_pct <= PASS_ERROR_PCT_MAX else FAIL   # boundary: exactly 5.0 passes
      on PASS: equipment.calibration_valid_until = performed_at + CALIBRATION_VALID_DAYS days; equipment AVAILABLE
      on FAIL: equipment.status -> CALIBRATION_DUE (calibration_valid_until unchanged)
    input_set: "the new CalibrationRecord"
    constants:
      PASS_ERROR_PCT_MAX: 5.0
      CALIBRATION_VALID_DAYS: 180
    precision: "error_pct at 2 decimal places, round_half_up"

  - name: applicator_compliance_score
    trigger: "complaint substantiation (and on read as derived fields)"
    algorithm: weighted_scoring
    formula: |
      weight(severity) = W_MAJOR if MAJOR else W_MINOR
      lifetime = sum(weight over all SUBSTANTIATED complaints for the applicator)
      rolling = sum(weight over SUBSTANTIATED complaints whose substantiation
                    (updated_at of the SUBSTANTIATED transition) is within trailing ROLLING_DAYS days of now)
      if count(SUBSTANTIATED within trailing RECENCY_DAYS days) >= 2:
          rolling = rolling * RECENCY_MULTIPLIER
      revocation: rolling >= REVOKE_THRESHOLD  # boundary: exactly 10 revokes
    input_set: "DriftComplaint rows for the applicator with status SUBSTANTIATED"
    constants:
      W_MINOR: 2
      W_MAJOR: 5
      ROLLING_DAYS: 365
      RECENCY_DAYS: 90
      RECENCY_MULTIPLIER: 2
      REVOKE_THRESHOLD: 10
    precision: "integer points"
    variants:
      - name: rolling_365
        when: "license revocation check"
        difference: "365-day window with the 90-day recency doubler; stored as Applicator.rolling_score_365"
      - name: lifetime
        when: "compliance reporting / audit"
        difference: "no time window, no multiplier; stored as Applicator.penalty_points_lifetime; same complaint set can yield a different score"

  - name: rei_window
    trigger: "work order completion (sets) and work order start (checks)"
    algorithm: threshold
    formula: |
      on completion: field.rei_until = max(existing field.rei_until or -inf,
                                           completed_at + max(product.rei_hours over applied products) hours)
      entry check at start: passes iff field.rei_until is null OR now >= field.rei_until
      # boundary: now exactly equal to rei_until passes (half-open lockout)
    input_set: "the completed work order's applied products; the starting work order's field"
    precision: "datetimes to the second"

  - name: outstanding_balance
    trigger: "invoice issue, pay, void"
    algorithm: aggregation
    formula: |
      customer.outstanding_cents = sum(Invoice.final_amount_cents over invoices of the
      customer's work orders with status == ISSUED)
      issue: += final_amount_cents ; pay: -= final_amount_cents ; void of ISSUED: -= final_amount_cents
      void of DRAFT: no change (DRAFT invoices are not part of the sum)
    input_set: "invoices joined through WorkOrder.customer_id, status ISSUED only"
    precision: "whole cents"

  - name: schedule_overlap_rules
    trigger: "work order schedule and reschedule"
    algorithm: interval_merge
    formula: |
      Field double-booking: reject when another work order on the same field with
      status in {SCHEDULED, IN_PROGRESS} has half-open interval overlap:
        existing.scheduled_start < new.scheduled_end AND new.scheduled_start < existing.scheduled_end
      (adjacency — existing.end == new.start — is ALLOWED for the field).
      Applicator double-booking: same test but intervals are padded by the travel
      buffer: [scheduled_start - 30min, scheduled_end + 30min); with padding,
      back-to-back jobs (end == start) CONFLICT for the same applicator.
    input_set: "SCHEDULED/IN_PROGRESS work orders sharing the field_id or applicator_id"
    constants:
      TRAVEL_BUFFER_MINUTES: 30
    precision: "datetimes to the second"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role header names a declared role and X-User-ID header is present"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "role is permitted on the endpoint; ownership/assignment checks: Grower may only create/cancel/pay for own customer_id; Applicator may only start/resume/complete/resubmit work assigned to them"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: auth
    check: "segregation of duties on certification: certifier X-User-ID must differ from record.applicator_id"
    error_id: ERR_SEGREGATION_OF_DUTIES
    http_status: 403
    applies_to: "POST /api/application-records/{id}/certify"
  - priority: 4
    category: existence
    check: "request body shape: required fields present, types valid, enum members valid, numbers positive where required"
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all"
  - priority: 5
    category: existence
    check: "path ids and body FK references exist"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"
  - priority: 6
    category: state
    check: "target resource is in a valid from-state for the transition; linked-entity state preconditions (prescription APPROVED, applicator ACTIVE, record CERTIFIED)"
    error_id: "ERR_INVALID_STATE | ERR_PRESCRIPTION_NOT_APPROVED | ERR_APPLICATOR_NOT_ACTIVE | ERR_RECORD_NOT_CERTIFIED | ERR_INVESTIGATION_PENDING"
    http_status: 409
    applies_to: "all action endpoints"
  - priority: 7
    category: business_safety
    check: "regulatory safety gates: REI lockout, weather envelope + freshness, license validity and category coverage, buffer clearance, tank-mix compatibility and adjuvant"
    error_id: "ERR_REI_ACTIVE | ERR_WEATHER_WINDOW_VIOLATION | ERR_OBSERVATION_STALE | ERR_LICENSE_EXPIRED | ERR_LICENSE_CATEGORY_MISSING | ERR_BUFFER_VIOLATION | ERR_INCOMPATIBLE_TANK_MIX | ERR_ADJUVANT_REQUIRED"
    http_status: 409
    applies_to: "schedule, start, resume, prescription approve"
  - priority: 8
    category: business_temporal
    check: "timing windows and interval conflicts: prescription window, field/applicator overlap, calibration validity horizon, complaint filing window"
    error_id: "ERR_OUTSIDE_APPLICATION_WINDOW | ERR_FIELD_TIME_CONFLICT | ERR_APPLICATOR_TIME_CONFLICT | ERR_CALIBRATION_OVERDUE | ERR_COMPLAINT_WINDOW_CLOSED"
    http_status: 409
    applies_to: "schedule, reschedule, start, drift-complaint create"
  - priority: 9
    category: business_constraint
    check: "domain constraints: acreage cap, rinsate accounting, disposal field match, complaint hold on invoicing, duplicate open complaint, invoice settlement before close"
    error_id: "ERR_ACREAGE_EXCEEDED | ERR_RINSATE_BALANCE_OPEN | ERR_RINSATE_OVER_DISPOSAL | ERR_DISPOSAL_FIELD_MISMATCH | ERR_COMPLAINT_HOLD | ERR_DUPLICATE_OPEN_COMPLAINT | ERR_INVOICE_UNSETTLED"
    http_status: 409
    applies_to: "work-order create/close, rinsate create, invoice issue, complaint create"
  - priority: 10
    category: business_fiscal
    check: "credit limit: outstanding + prospective amount must stay within customer credit_limit_cents"
    error_id: ERR_CREDIT_LIMIT_EXCEEDED
    http_status: 409
    applies_to: "schedule, invoice issue"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # --- logical clock (test-driving; default time fixed) ---
  - method: POST
    path: "/api/_clock/set_current_utc"
    description: "Sets the server logical clock. Before any call, the logical clock reads exactly 2026-05-01T00:00:00Z and never falls back to wall-clock time."
    roles: [CoopAdmin]
    code: 200
    input: [to_iso8601]
    output: { current_utc: string }
    side_effects: []

  # --- Customer ---
  - method: POST
    path: "/api/customers"
    description: "Create a grower customer account"
    roles: [CoopAdmin]
    code: 201
    input: [name, billing_email, rate_per_acre_cents, credit_limit_cents]
    output: Customer
    side_effects: ["outstanding_cents = 0"]
  - method: GET
    path: "/api/customers/{id}"
    description: "Get a customer (Grower may only read own id)"
    roles: [CoopAdmin, Dispatcher, ComplianceOfficer, Grower]
    code: 200
    input: []
    output: Customer
    side_effects: []
  - method: GET
    path: "/api/customers"
    description: "List customer accounts with pagination"
    roles: [CoopAdmin, Dispatcher, ComplianceOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: Customer[]
    side_effects: []

  # --- Field ---
  - method: POST
    path: "/api/fields"
    description: "Create a field; Grower must pass customer_id equal to X-User-ID"
    roles: [Grower, CoopAdmin]
    code: 201
    input: [customer_id, label, crop, acres, buffer_clearance_ft]
    output: Field
    side_effects: ["rei_until = null"]
  - method: GET
    path: "/api/fields/{id}"
    description: "Get a field"
    roles: [Grower, Agronomist, Dispatcher, Applicator, ComplianceOfficer, CoopAdmin]
    code: 200
    input: []
    output: Field
    side_effects: []
  - method: GET
    path: "/api/fields"
    description: "List fields with optional filters"
    roles: [Grower, Agronomist, Dispatcher, Applicator, ComplianceOfficer, CoopAdmin]
    code: 200
    input: ["customer_id?", "limit?", "offset?"]
    output: Field[]
    side_effects: []

  # --- Product ---
  - method: POST
    path: "/api/products"
    description: "Create a catalog product"
    roles: [CoopAdmin]
    code: 201
    input: [name, epa_registration_no, category, rei_hours, max_wind_mph, min_temp_f, max_temp_f, required_buffer_ft, unit_cost_cents, markup_pct]
    output: Product
    side_effects: []
  - method: GET
    path: "/api/products/{id}"
    description: "Get a product"
    roles: [Grower, Agronomist, Dispatcher, Applicator, ComplianceOfficer, CoopAdmin]
    code: 200
    input: []
    output: Product
    side_effects: []

  # --- CompatibilityRule ---
  - method: POST
    path: "/api/compatibility-rules"
    description: "Declare an unordered product-pair verdict; duplicate pair rejected with ERR_VALIDATION"
    roles: [CoopAdmin]
    code: 201
    input: [product_a_id, product_b_id, verdict, "note?"]
    output: CompatibilityRule
    side_effects: []
  - method: GET
    path: "/api/compatibility-rules/{id}"
    description: "Get a compatibility rule"
    roles: [Agronomist, Dispatcher, CoopAdmin]
    code: 200
    input: []
    output: CompatibilityRule
    side_effects: []
  - method: GET
    path: "/api/compatibility-rules"
    description: "List compatibility rules; either side filterable"
    roles: [Agronomist, Dispatcher, CoopAdmin]
    code: 200
    input: ["product_a_id?", "product_b_id?", "limit?", "offset?"]
    output: CompatibilityRule[]
    side_effects: []

  # --- Prescription ---
  - method: POST
    path: "/api/prescriptions"
    description: "Create a DRAFT prescription (lines: array of {product_id, rate_per_acre})"
    roles: [Agronomist]
    code: 201
    input: [field_id, season_year, valid_from, valid_to, carrier_gpa, lines]
    output: Prescription
    side_effects: ["status = DRAFT; created_by_user_id = X-User-ID"]
  - method: GET
    path: "/api/prescriptions/{id}"
    description: "Get a prescription"
    roles: [Agronomist, Dispatcher, Grower, CoopAdmin, ComplianceOfficer]
    code: 200
    input: []
    output: Prescription
    side_effects: []
  - method: GET
    path: "/api/prescriptions"
    description: "List prescriptions with filters"
    roles: [Agronomist, Dispatcher, Grower, CoopAdmin, ComplianceOfficer]
    code: 200
    input: ["field_id?", "season_year?", "status?", "limit?", "offset?"]
    output: Prescription[]
    side_effects: []
  - method: POST
    path: "/api/prescriptions/{id}/approve"
    description: "Approve a DRAFT prescription (OCC on Field.version); supersedes any APPROVED prescription for the same field+season"
    roles: [Agronomist]
    code: 200
    input: [expected_field_version]
    output: Prescription
    side_effects:
      - "status DRAFT -> APPROVED; prior APPROVED for same (field_id, season_year) -> SUPERSEDED"
      - "increments Field.version by 1"
      - "increments Prescription.version by 1"

  # --- Applicator ---
  - method: POST
    path: "/api/applicators"
    description: "Create an applicator"
    roles: [CoopAdmin]
    code: 201
    input: [display_name, license_no, license_expires_on, license_categories]
    output: Applicator
    side_effects: ["status = ACTIVE; penalty_points_lifetime = 0; rolling_score_365 = 0"]
  - method: GET
    path: "/api/applicators/{id}"
    description: "Get an applicator"
    roles: [Dispatcher, ComplianceOfficer, CoopAdmin, Applicator]
    code: 200
    input: []
    output: Applicator
    side_effects: []
  - method: POST
    path: "/api/applicators/{id}/reinstate"
    description: "Reinstate a SUSPENDED applicator; blocked while any of their complaints is INVESTIGATING"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: Applicator
    side_effects: ["status SUSPENDED -> ACTIVE; increments Applicator.version by 1"]

  # --- Equipment ---
  - method: POST
    path: "/api/equipment"
    description: "Create a sprayer unit"
    roles: [CoopAdmin]
    code: 201
    input: [unit_label, tank_capacity_gal]
    output: Equipment
    side_effects: ["status = AVAILABLE; calibration_valid_until = null"]
  - method: GET
    path: "/api/equipment/{id}"
    description: "Get equipment"
    roles: [Dispatcher, Applicator, CoopAdmin, ComplianceOfficer]
    code: 200
    input: []
    output: Equipment
    side_effects: []

  # --- CalibrationRecord ---
  - method: POST
    path: "/api/calibration-records"
    description: "Post a calibration measurement; verdict computed; PASS extends validity 180 days, FAIL marks equipment CALIBRATION_DUE and reverts its SCHEDULED work orders to DRAFT"
    roles: [Applicator, CoopAdmin]
    code: 201
    input: [equipment_id, target_gpa, measured_gpa, "applicator_id?"]
    output: CalibrationRecord
    side_effects:
      - "applicator_id = X-User-ID when role Applicator; required in payload when role CoopAdmin"
      - "PASS: calibration_valid_until = performed_at + 180 days; equipment AVAILABLE"
      - "FAIL: equipment -> CALIBRATION_DUE; cascade: its SCHEDULED work orders -> DRAFT"
  - method: GET
    path: "/api/calibration-records/{id}"
    description: "Get a calibration record"
    roles: [Dispatcher, Applicator, CoopAdmin, ComplianceOfficer]
    code: 200
    input: []
    output: CalibrationRecord
    side_effects: []
  - method: GET
    path: "/api/calibration-records"
    description: "List calibration records"
    roles: [Dispatcher, Applicator, CoopAdmin, ComplianceOfficer]
    code: 200
    input: ["equipment_id?", "applicator_id?", "limit?", "offset?"]
    output: CalibrationRecord[]
    side_effects: []

  # --- WeatherObservation ---
  - method: POST
    path: "/api/weather-observations"
    description: "Post a weather observation; any IN_PROGRESS work order whose mix envelope it violates moves to WEATHER_HOLD"
    roles: [Applicator, Dispatcher]
    code: 201
    input: [observed_at, wind_mph, temp_f, inversion_present]
    output: WeatherObservation
    side_effects: ["cascade: IN_PROGRESS work orders failing mix_weather_envelope -> WEATHER_HOLD"]
  - method: GET
    path: "/api/weather-observations"
    description: "List weather observations, newest observed_at first"
    roles: [Applicator, Dispatcher, CoopAdmin, ComplianceOfficer]
    code: 200
    input: ["limit?", "offset?"]
    output: WeatherObservation[]
    side_effects: []

  # --- WorkOrder ---
  - method: POST
    path: "/api/work-orders"
    description: "Create a DRAFT work order; Grower must pass own customer_id"
    roles: [Grower, Dispatcher]
    code: 201
    input: [customer_id, field_id, prescription_id, acres_to_treat]
    output: WorkOrder
    side_effects: ["status = DRAFT; ERR_ACREAGE_EXCEEDED when acres_to_treat > field.acres"]
  - method: GET
    path: "/api/work-orders/{id}"
    description: "Get a work order"
    roles: [Grower, Dispatcher, Applicator, ComplianceOfficer, CoopAdmin]
    code: 200
    input: []
    output: WorkOrder
    side_effects: []
  - method: GET
    path: "/api/work-orders"
    description: "List work orders with filters"
    roles: [Grower, Dispatcher, Applicator, ComplianceOfficer, CoopAdmin]
    code: 200
    input: ["customer_id?", "field_id?", "prescription_id?", "applicator_id?", "equipment_id?", "status?", "limit?", "offset?"]
    output: WorkOrder[]
    side_effects: []
  - method: POST
    path: "/api/work-orders/{id}/schedule"
    description: "Assign applicator + equipment + window; runs the full gate chain (see state machine)"
    roles: [Dispatcher]
    code: 200
    input: [applicator_id, equipment_id, scheduled_start, scheduled_end, "uses_adjuvant?"]
    output: WorkOrder
    side_effects: ["status -> SCHEDULED; estimated_total_cents computed (provisional); increments WorkOrder.version by 1"]
  - method: POST
    path: "/api/work-orders/{id}/reschedule"
    description: "Amend window and/or assignment of a SCHEDULED work order (OCC on WorkOrder.version)"
    roles: [Dispatcher]
    code: 200
    input: [scheduled_start, scheduled_end, "applicator_id?", "equipment_id?", "uses_adjuvant?", expected_work_order_version]
    output: WorkOrder
    side_effects: ["increments WorkOrder.version by 1"]
  - method: POST
    path: "/api/work-orders/{id}/start"
    description: "Assigned applicator starts the job; REI + weather envelope gates"
    roles: [Applicator]
    code: 200
    input: []
    output: WorkOrder
    side_effects: ["status -> IN_PROGRESS; started_at = now; increments WorkOrder.version by 1"]
  - method: POST
    path: "/api/work-orders/{id}/resume"
    description: "Resume from WEATHER_HOLD after a passing fresh observation"
    roles: [Applicator]
    code: 200
    input: []
    output: WorkOrder
    side_effects: ["status -> IN_PROGRESS; increments WorkOrder.version by 1"]
  - method: POST
    path: "/api/work-orders/{id}/complete"
    description: "Assigned applicator completes with actual product rates; creates ApplicationRecord + DRAFT Invoice, sets field REI, generates rinsate"
    roles: [Applicator]
    code: 200
    input: [lines]
    output: WorkOrder
    side_effects:
      - "status -> COMPLETED; completed_at = now"
      - "creates ApplicationRecord (SUBMITTED)"
      - "Field.rei_until updated; increments Field.version by 1"
      - "rinsate_generated_gal / rinsate_balance_gal set"
      - "creates Invoice DRAFT with provisional_amount_cents"
      - "increments WorkOrder.version by 1"
  - method: POST
    path: "/api/work-orders/{id}/cancel"
    description: "Cancel a DRAFT or SCHEDULED work order"
    roles: [Grower, Dispatcher]
    code: 200
    input: []
    output: WorkOrder
    side_effects: ["status -> CANCELLED; increments WorkOrder.version by 1"]
  - method: POST
    path: "/api/work-orders/{id}/close"
    description: "Close a COMPLETED work order once record CERTIFIED, rinsate balance 0, invoice PAID or VOIDED"
    roles: [Dispatcher]
    code: 200
    input: []
    output: WorkOrder
    side_effects: ["status -> CLOSED; increments WorkOrder.version by 1"]

  # --- ApplicationRecord ---
  - method: GET
    path: "/api/application-records/{id}"
    description: "Get an application record"
    roles: [Dispatcher, Applicator, ComplianceOfficer, CoopAdmin]
    code: 200
    input: []
    output: ApplicationRecord
    side_effects: []
  - method: GET
    path: "/api/application-records"
    description: "List application records (the 1:1 record of a work order is discovered via work_order_id filter, array of 0-1)"
    roles: [Dispatcher, Applicator, ComplianceOfficer, CoopAdmin]
    code: 200
    input: ["work_order_id?", "applicator_id?", "status?", "limit?", "offset?"]
    output: ApplicationRecord[]
    side_effects: []
  - method: POST
    path: "/api/application-records/{id}/certify"
    description: "Certify a SUBMITTED record; certifier must not be the performing applicator; recomputes invoice final amount"
    roles: [ComplianceOfficer, Applicator]
    code: 200
    input: []
    output: ApplicationRecord
    side_effects: ["status -> CERTIFIED; certified_by_user_id set; Invoice.final_amount_cents computed (final variant); increments Invoice.version by 1; increments ApplicationRecord.version by 1"]
  - method: POST
    path: "/api/application-records/{id}/return"
    description: "Return a SUBMITTED record for correction"
    roles: [ComplianceOfficer]
    code: 200
    input: [returned_note]
    output: ApplicationRecord
    side_effects: ["status -> RETURNED; increments ApplicationRecord.version by 1"]
  - method: POST
    path: "/api/application-records/{id}/resubmit"
    description: "Performing applicator resubmits a RETURNED record with corrected lines"
    roles: [Applicator]
    code: 200
    input: [lines]
    output: ApplicationRecord
    side_effects: ["status -> SUBMITTED; lines replaced; returned_note cleared; increments ApplicationRecord.version by 1"]

  # --- RinsateRecord ---
  - method: POST
    path: "/api/rinsate-records"
    description: "Record a rinsate disposal against a COMPLETED work order; decrements rinsate_balance_gal"
    roles: [Applicator]
    code: 201
    input: [work_order_id, kind, volume_gal, "disposal_field_id?", "manifest_no?"]
    output: RinsateRecord
    side_effects: ["work_order.rinsate_balance_gal -= volume_gal; increments WorkOrder.version by 1"]
  - method: GET
    path: "/api/rinsate-records/{id}"
    description: "Get a rinsate record"
    roles: [Dispatcher, Applicator, ComplianceOfficer, CoopAdmin]
    code: 200
    input: []
    output: RinsateRecord
    side_effects: []
  - method: GET
    path: "/api/rinsate-records"
    description: "List rinsate records"
    roles: [Dispatcher, Applicator, ComplianceOfficer, CoopAdmin]
    code: 200
    input: ["work_order_id?", "disposal_field_id?", "limit?", "offset?"]
    output: RinsateRecord[]
    side_effects: []

  # --- DriftComplaint ---
  - method: POST
    path: "/api/drift-complaints"
    description: "Grower files a drift complaint against a COMPLETED work order within 30 days of completion; one open complaint per work order"
    roles: [Grower]
    code: 201
    input: [work_order_id, description, severity]
    output: DriftComplaint
    side_effects: ["status = FILED; complainant_customer_id = X-User-ID; applicator_id denormalized from work order"]
  - method: GET
    path: "/api/drift-complaints/{id}"
    description: "Get a drift complaint"
    roles: [Grower, ComplianceOfficer, CoopAdmin]
    code: 200
    input: []
    output: DriftComplaint
    side_effects: []
  - method: GET
    path: "/api/drift-complaints"
    description: "List drift complaints with filters"
    roles: [Grower, ComplianceOfficer, CoopAdmin]
    code: 200
    input: ["complainant_customer_id?", "work_order_id?", "applicator_id?", "status?", "limit?", "offset?"]
    output: DriftComplaint[]
    side_effects: []
  - method: POST
    path: "/api/drift-complaints/{id}/open-investigation"
    description: "FILED -> INVESTIGATING; blocks invoice issue for the work order while open (no applicator suspension at this step)"
    roles: [ComplianceOfficer]
    code: 200
    input: []
    output: DriftComplaint
    side_effects: ["increments DriftComplaint.version by 1"]
  - method: POST
    path: "/api/drift-complaints/{id}/substantiate"
    description: "INVESTIGATING -> SUBSTANTIATED; adds penalty weight, may revoke license, voids the work order's invoice"
    roles: [ComplianceOfficer]
    code: 200
    input: [findings_note]
    output: DriftComplaint
    side_effects: ["cascade: penalty points -> possible REVOKED -> SCHEDULED work orders -> DRAFT; invoice DRAFT/ISSUED -> VOIDED; increments DriftComplaint.version by 1"]
  - method: POST
    path: "/api/drift-complaints/{id}/dismiss"
    description: "INVESTIGATING -> DISMISSED; releases the complaint hold on invoicing"
    roles: [ComplianceOfficer]
    code: 200
    input: [findings_note]
    output: DriftComplaint
    side_effects: ["increments DriftComplaint.version by 1"]

  # --- Invoice ---
  - method: GET
    path: "/api/invoices/{id}"
    description: "Get an invoice"
    roles: [Grower, Dispatcher, CoopAdmin, ComplianceOfficer]
    code: 200
    input: []
    output: Invoice
    side_effects: []
  - method: GET
    path: "/api/invoices"
    description: "List invoices with filters"
    roles: [Grower, Dispatcher, CoopAdmin, ComplianceOfficer]
    code: 200
    input: ["work_order_id?", "status?", "limit?", "offset?"]
    output: Invoice[]
    side_effects: []
  - method: POST
    path: "/api/invoices/{id}/issue"
    description: "Issue a DRAFT invoice after record certification; debits customer outstanding"
    roles: [CoopAdmin]
    code: 200
    input: []
    output: Invoice
    side_effects: ["customer.outstanding_cents += final_amount_cents; increments Customer.version by 1; increments Invoice.version by 1"]
  - method: POST
    path: "/api/invoices/{id}/pay"
    description: "Grower pays own ISSUED invoice"
    roles: [Grower]
    code: 200
    input: []
    output: Invoice
    side_effects: ["customer.outstanding_cents -= final_amount_cents; increments Customer.version by 1; increments Invoice.version by 1"]
  - method: POST
    path: "/api/invoices/{id}/void"
    description: "Void a DRAFT or ISSUED invoice; ISSUED void credits outstanding"
    roles: [CoopAdmin]
    code: 200
    input: []
    output: Invoice
    side_effects: ["if ISSUED: customer.outstanding_cents -= final_amount_cents; increments Customer.version by 1; increments Invoice.version by 1"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - { id: ERR_UNAUTHENTICATED, http: 401, condition: "Missing/unknown X-User-Role or missing X-User-ID" }
  - { id: ERR_FORBIDDEN, http: 403, condition: "Role not allowed on endpoint, or ownership/assignment check failed" }
  - { id: ERR_SEGREGATION_OF_DUTIES, http: 403, condition: "Certifier X-User-ID equals the performing applicator_id" }
  - { id: ERR_VALIDATION, http: 400, condition: "Malformed body: missing required field, bad type, bad enum, non-positive quantity, duplicate compatibility pair" }
  - { id: ERR_NOT_FOUND, http: 404, condition: "Path id or referenced FK does not exist" }
  - { id: ERR_INVALID_STATE, http: 409, condition: "Target resource not in a valid from-state for the requested transition" }
  - { id: ERR_STALE_VERSION, http: 412, condition: "expected_*_version does not match the parent entity's current version (OCC)" }
  - { id: ERR_PRESCRIPTION_NOT_APPROVED, http: 409, condition: "Schedule attempted against a prescription not in APPROVED state" }
  - { id: ERR_APPLICATOR_NOT_ACTIVE, http: 409, condition: "Assigned applicator is SUSPENDED or REVOKED" }
  - { id: ERR_RECORD_NOT_CERTIFIED, http: 409, condition: "Invoice issue / work order close attempted before application record CERTIFIED" }
  - { id: ERR_INVESTIGATION_PENDING, http: 409, condition: "Reinstate attempted while a complaint against the applicator is INVESTIGATING" }
  - { id: ERR_REI_ACTIVE, http: 409, condition: "Start attempted while field.rei_until is in the future" }
  - { id: ERR_WEATHER_WINDOW_VIOLATION, http: 409, condition: "Wind/temperature/inversion outside the mix envelope" }
  - { id: ERR_OBSERVATION_STALE, http: 409, condition: "Latest weather observation older than 60 minutes at start/resume" }
  - { id: ERR_LICENSE_EXPIRED, http: 409, condition: "License expires before scheduled_end (schedule) or before now (start)" }
  - { id: ERR_LICENSE_CATEGORY_MISSING, http: 409, condition: "Applicator license lacks a category present in the tank mix" }
  - { id: ERR_BUFFER_VIOLATION, http: 409, condition: "A product's required_buffer_ft exceeds field.buffer_clearance_ft" }
  - { id: ERR_INCOMPATIBLE_TANK_MIX, http: 409, condition: "A line pair has verdict INCOMPATIBLE" }
  - { id: ERR_ADJUVANT_REQUIRED, http: 409, condition: "A CONDITIONAL pair is present but uses_adjuvant is false" }
  - { id: ERR_OUTSIDE_APPLICATION_WINDOW, http: 409, condition: "Scheduled window outside prescription valid_from/valid_to, or start after scheduled_end" }
  - { id: ERR_FIELD_TIME_CONFLICT, http: 409, condition: "Half-open interval overlap with another SCHEDULED/IN_PROGRESS work order on the same field" }
  - { id: ERR_APPLICATOR_TIME_CONFLICT, http: 409, condition: "Padded (30-min travel buffer) overlap with another SCHEDULED/IN_PROGRESS work order of the same applicator" }
  - { id: ERR_CALIBRATION_OVERDUE, http: 409, condition: "Equipment not AVAILABLE or calibration_valid_until < scheduled_end" }
  - { id: ERR_COMPLAINT_WINDOW_CLOSED, http: 409, condition: "Complaint filed more than 30 days after work order completion" }
  - { id: ERR_ACREAGE_EXCEEDED, http: 409, condition: "acres_to_treat > field.acres" }
  - { id: ERR_RINSATE_BALANCE_OPEN, http: 409, condition: "Close attempted with rinsate_balance_gal != 0" }
  - { id: ERR_RINSATE_OVER_DISPOSAL, http: 409, condition: "Disposal volume exceeds current rinsate_balance_gal" }
  - { id: ERR_DISPOSAL_FIELD_MISMATCH, http: 409, condition: "FIELD_DISPOSAL to a field other than the work order's own field" }
  - { id: ERR_COMPLAINT_HOLD, http: 409, condition: "Invoice issue attempted while a complaint on the work order is FILED or INVESTIGATING" }
  - { id: ERR_DUPLICATE_OPEN_COMPLAINT, http: 409, condition: "A complaint for the same work order is already FILED or INVESTIGATING" }
  - { id: ERR_INVOICE_UNSETTLED, http: 409, condition: "Close attempted while invoice is neither PAID nor VOIDED" }
  - { id: ERR_CREDIT_LIMIT_EXCEEDED, http: 409, condition: "outstanding_cents + prospective amount exceeds customer credit_limit_cents" }

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Grower
    description: "Farming customer; requests work, files drift complaints, pays invoices"
    identity: "entity_backed:Customer"
    exclusive_operations:
      - "POST /api/drift-complaints — file complaint (complainant = self)"
      - "POST /api/invoices/{id}/pay — pay own invoice"
    shared_operations:
      - "POST /api/fields — create field for own customer_id"
      - "POST /api/work-orders — create work order for own customer_id"
      - "POST /api/work-orders/{id}/cancel — cancel own work order"
      - "GET reads on own resources"

  - name: Agronomist
    description: "Writes and approves field prescriptions"
    identity: "opaque"
    exclusive_operations:
      - "POST /api/prescriptions — create DRAFT prescription"
      - "POST /api/prescriptions/{id}/approve — approve (OCC on Field.version)"
    shared_operations:
      - "GET reads on fields, products, prescriptions, compatibility rules"

  - name: Dispatcher
    description: "Co-op operations staff; schedules and closes work orders"
    identity: "opaque"
    exclusive_operations:
      - "POST /api/work-orders/{id}/schedule — assign applicator/equipment/window"
      - "POST /api/work-orders/{id}/reschedule — amend a scheduled job (OCC)"
      - "POST /api/work-orders/{id}/close — close a completed order"
    shared_operations:
      - "POST /api/work-orders — create on behalf of a customer"
      - "POST /api/work-orders/{id}/cancel"
      - "POST /api/weather-observations"
      - "GET reads"

  - name: Applicator
    description: "Licensed spray operator; executes work orders and keeps records"
    identity: "entity_backed:Applicator"
    exclusive_operations:
      - "POST /api/work-orders/{id}/start — start own assigned job"
      - "POST /api/work-orders/{id}/resume — resume own held job"
      - "POST /api/work-orders/{id}/complete — complete own job with actual rates"
      - "POST /api/application-records/{id}/resubmit — resubmit own RETURNED record"
      - "POST /api/rinsate-records — record rinsate disposal"
    shared_operations:
      - "POST /api/calibration-records — post calibration"
      - "POST /api/application-records/{id}/certify — only another applicator's record"
      - "POST /api/weather-observations"
      - "GET reads"

  - name: ComplianceOfficer
    description: "Regulatory/compliance staff; certifies records, investigates complaints, reinstates applicators"
    identity: "opaque"
    exclusive_operations:
      - "POST /api/drift-complaints/{id}/open-investigation"
      - "POST /api/drift-complaints/{id}/substantiate"
      - "POST /api/drift-complaints/{id}/dismiss"
      - "POST /api/applicators/{id}/reinstate"
      - "POST /api/application-records/{id}/return"
    shared_operations:
      - "POST /api/application-records/{id}/certify"
      - "GET reads"

  - name: CoopAdmin
    description: "Co-op administrator; manages catalog, people, equipment, billing"
    identity: "opaque"
    exclusive_operations:
      - "POST /api/customers, /api/products, /api/applicators, /api/equipment, /api/compatibility-rules — registry management"
      - "POST /api/invoices/{id}/issue — issue invoice"
      - "POST /api/invoices/{id}/void — void invoice"
      - "POST /api/_clock/set_current_utc — test clock"
    shared_operations:
      - "POST /api/fields — create field for any customer"
      - "POST /api/calibration-records — record calibration (applicator_id in payload)"
      - "GET reads"
