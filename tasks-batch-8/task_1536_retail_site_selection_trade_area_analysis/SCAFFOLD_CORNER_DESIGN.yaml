        claim_type: optimistic_concurrency
        grounds:
          - concurrency_rules[model-lock-stale-site]
          - errors[ERR_STALE_VERSION]
        distinguishing_aspect: "Locking with expected_site_version one behind the site's current version (an expression over the captured value) fails 412 ERR_STALE_VERSION; the model stays DRAFT and the site version is unchanged."
        test_recipe:
          setup: ["Site SCREENED (version 2 after screening) with a DRAFT model"]
          setup_api_calls:
            - call: "POST /api/markets"
              payload: { name: "Metro O1", state_code: "TX", population: 500000, median_household_income_cents: 9000000, population_growth_bp: 300, psychographic_index: 130, base_target_stores: 5, annual_capex_budget_cents: 2000000000, max_rent_psf_cents: 40000, prototype_sales_cents: 900000000 }
              as: PlatformAdmin
              captures: { mkt_id: $.data.id }
            - call: "POST /api/markets/${mkt_id}/evaluate"
              payload: {}
              as: PlatformAdmin
            - call: "POST /api/sites"
              payload: { market_id: "${mkt_id}", address: "5 Elm St", format_type: "STANDARD", square_footage: 10000, asking_rent_psf_cents: 3000, cam_psf_cents: 800, tax_psf_cents: 400, build_cost_cents: 500000000 }
              as: RealEstateAnalyst
              captures: { site_id: $.data.id }
            - call: "POST /api/sites/${site_id}/run-screening"
              payload: {}
              as: RealEstateAnalyst
