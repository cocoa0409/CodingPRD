            - { call: "POST /fleet-wash/vehicles", payload: { customer_id: "${cust_id}", site_id: "${site_id}", plate: "R1", vehicle_class: "SEDAN" }, as: PlatformAdmin, captures: { q1: $.data.id } }
            - { call: "POST /fleet-wash/vehicles", payload: { customer_id: "${cust_id}", site_id: "${site_id}", plate: "R2", vehicle_class: "SEDAN" }, as: PlatformAdmin, captures: { q2: $.data.id } }
            - { call: "POST /fleet-wash/vehicles", payload: { customer_id: "${cust_id}", site_id: "${site_id}", plate: "R3", vehicle_class: "SEDAN" }, as: PlatformAdmin, captures: { q3: $.data.id } }
            - { call: "POST /fleet-wash/vehicles", payload: { customer_id: "${cust_id}", site_id: "${site_id}", plate: "R4", vehicle_class: "SEDAN" }, as: PlatformAdmin, captures: { q4: $.data.id } }
            - { call: "POST /fleet-wash/vehicles", payload: { customer_id: "${cust_id}", site_id: "${site_id}", plate: "R5", vehicle_class: "SEDAN" }, as: PlatformAdmin, captures: { q5: $.data.id } }
            - { call: "POST /fleet-wash/vans", payload: { name: "VAN-RC", tank_capacity_gal: 100, reclaim_system: "BASIC" }, as: PlatformAdmin, captures: { van_id: $.data.id } }
            - { call: "POST /fleet-wash/vans/${van_id}/events", payload: { event_type: "LOAD_WATER", gallons: 96 }, as: Dispatcher }
            - { call: "POST /fleet-wash/technicians", payload: { name: "Tech RC" }, as: PlatformAdmin, captures: { tech_id: $.data.id } }
            - { call: "POST /fleet-wash/routes", payload: { route_date: "2026-08-05", van_id: "${van_id}", lead_technician_id: "${tech_id}" }, as: Dispatcher, captures: { route_id: $.data.id, route_v: $.data.version } }
            - { call: "POST /fleet-wash/wash-orders", payload: { customer_id: "${cust_id}", site_id: "${site_id}", vehicle_ids: ["${q1}", "${q2}", "${q3}", "${q4}", "${q5}"], scheduled_window_start: "2026-08-05T13:00:00Z", scheduled_window_end: "2026-08-05T14:00:00Z" }, as: PlatformAdmin, captures: { oa_id: $.data.id } }
            - { call: "POST /fleet-wash/wash-orders/${oa_id}/events", payload: { event_type: "CONFIRM" }, as: Dispatcher }
            - { call: "POST /fleet-wash/wash-orders", payload: { customer_id: "${cust_id}", site_id: "${site_id}", vehicle_ids: ["${q1}", "${q2}", "${q3}", "${q4}", "${q5}"], scheduled_window_start: "2026-08-05T14:00:00Z", scheduled_window_end: "2026-08-05T15:00:00Z" }, as: PlatformAdmin, captures: { ob_id: $.data.id } }
            - { call: "POST /fleet-wash/wash-orders/${ob_id}/events", payload: { event_type: "CONFIRM" }, as: Dispatcher }
          trigger:
            - { call: "POST /fleet-wash/routes/${route_id}/stops", payload: { wash_order_id: "${oa_id}", expected_route_version: "${route_v}" }, as: Dispatcher }
            - { call: "GET /fleet-wash/routes/${route_id}", payload: {}, as: Dispatcher, captures: { cnt_a: $.data.assigned_vehicle_count, rv2: $.data.version } }
            - { call: "POST /fleet-wash/routes/${route_id}/stops", payload: { wash_order_id: "${ob_id}", expected_route_version: "${rv2}" }, as: Dispatcher, captures: { sb_id: $.data.id } }
            - { call: "GET /fleet-wash/routes/${route_id}", payload: {}, as: Dispatcher, captures: { cnt_b: $.data.assigned_vehicle_count } }
            - { call: "POST /fleet-wash/routes/${route_id}/stops/${sb_id}/events", payload: { event_type: "REMOVE" }, as: Dispatcher }
            - { call: "GET /fleet-wash/routes/${route_id}", payload: {}, as: Dispatcher, captures: { cnt_c: $.data.assigned_vehicle_count } }
          assert:
            - "cnt_a == 5 (available 35; 5 + 35 == 40)"
            - "cnt_b == 10 (available 30; 10 + 30 == 40)"
            - "After compensating REMOVE: cnt_c == 5 (available 35; invariant restored exactly)"
