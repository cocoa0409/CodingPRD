scaffold_difficulty_design:

  # =================================================================
  # Rule 1 — dual_variant_calc (>= 2, different entity domains)
  # =================================================================
  - rule_id: dual_variant_calc
    instances:
      - name: return_premium_pro_rata_vs_short_rate
        grounds:
          - calculations.return_premium
          - entities.Policy.fields.return_premium_cents
          - entities.Product.fields.cancellation_basis
          - state_machines.Policy.ACTIVE_to_CANCELLED
        distinguishing_aspect: |
          On the Policy/return-premium domain: identical premium, term, and cancel
          date yield return_premium_cents == 604932 under PRO_RATA but == 544438
          under SHORT_RATE (carrier keeps the 10% penalty), a 60494-cent divergence.
        test_recipe:
          setup:
            - "Two carriers each ACTIVE; one product PRO_RATA, one product SHORT_RATE."
            - "Two producers ACTIVE, each with an ACTIVE AUTO license in CA and an ACTIVE appointment with the respective carrier in CA."
            - "Two ACTIVE policies, identical annual_premium_cents=1200000, term 2026-01-01..2027-01-01, on different products; clock at 2026-07-01."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-07-01T00:00:00Z" }
              as: AgencyAdmin
            - call: "POST /carriers"
              payload: { name: "Carrier PR", naic_code: "10001", default_new_business_commission_pct: 0.15, default_renewal_commission_pct: 0.10 }
              as: AgencyAdmin
              captures: { car_pr_id: $.data.id, car_pr_v: $.data.version }
            - call: "POST /carriers/${car_pr_id}/activate"
              payload: { expected_carrier_version: "${car_pr_v}" }
              as: AgencyAdmin
            - call: "POST /carriers"
              payload: { name: "Carrier SR", naic_code: "10002", default_new_business_commission_pct: 0.15, default_renewal_commission_pct: 0.10 }
              as: AgencyAdmin
              captures: { car_sr_id: $.data.id, car_sr_v: $.data.version }
            - call: "POST /carriers/${car_sr_id}/activate"
              payload: { expected_carrier_version: "${car_sr_v}" }
              as: AgencyAdmin
            - call: "POST /products"
              payload: { carrier_id: "${car_pr_id}", line_of_business: "AUTO", name: "Auto PR", cancellation_basis: "PRO_RATA" }
              as: AgencyAdmin
              captures: { prod_pr_id: $.data.id }
            - call: "POST /products"
              payload: { carrier_id: "${car_sr_id}", line_of_business: "AUTO", name: "Auto SR", cancellation_basis: "SHORT_RATE" }
              as: AgencyAdmin
              captures: { prod_sr_id: $.data.id }
            - call: "POST /producers"
              payload: { full_name: "Prod One", npn: "NPN001", default_split_pct: 1.0 }
              as: AgencyAdmin
              captures: { prod1_id: $.data.id }
            - call: "POST /producers"
              payload: { full_name: "Prod Two", npn: "NPN002", default_split_pct: 1.0 }
              as: AgencyAdmin
              captures: { prod2_id: $.data.id }
            - call: "POST /licenses"
              payload: { producer_id: "${prod1_id}", state_code: "CA", line_of_business: "AUTO", effective_date: "2025-01-01T00:00:00Z", expiration_date: "2030-01-01T00:00:00Z" }
              as: AgencyAdmin
            - call: "POST /licenses"
              payload: { producer_id: "${prod2_id}", state_code: "CA", line_of_business: "AUTO", effective_date: "2025-01-01T00:00:00Z", expiration_date: "2030-01-01T00:00:00Z" }
              as: AgencyAdmin
            - call: "POST /appointments"
              payload: { carrier_id: "${car_pr_id}", producer_id: "${prod1_id}", state_code: "CA" }
              as: AgencyAdmin
              captures: { appt1_id: $.data.id, appt1_v: $.data.version }
            - call: "POST /appointments/${appt1_id}/approve"
              payload: { expected_appointment_version: "${appt1_v}" }
              as: AgencyAdmin
              captures: { appt1_v2: $.data.version }
            - call: "POST /appointments/${appt1_id}/activate"
              payload: { expected_appointment_version: "${appt1_v2}" }
              as: AgencyAdmin
            - call: "POST /appointments"
              payload: { carrier_id: "${car_sr_id}", producer_id: "${prod2_id}", state_code: "CA" }
              as: AgencyAdmin
              captures: { appt2_id: $.data.id, appt2_v: $.data.version }
            - call: "POST /appointments/${appt2_id}/approve"
              payload: { expected_appointment_version: "${appt2_v}" }
              as: AgencyAdmin
              captures: { appt2_v2: $.data.version }
            - call: "POST /appointments/${appt2_id}/activate"
              payload: { expected_appointment_version: "${appt2_v2}" }
              as: AgencyAdmin
            - call: "POST /accounts"
              payload: { name: "Acct PR", servicing_producer_id: "${prod1_id}", account_type: "PERSONAL" }
              as: AgencyAdmin
              captures: { acct_pr_id: $.data.id }
            - call: "POST /accounts"
              payload: { name: "Acct SR", servicing_producer_id: "${prod2_id}", account_type: "PERSONAL" }
              as: AgencyAdmin
              captures: { acct_sr_id: $.data.id }
            - call: "POST /policies"
              payload: { account_id: "${acct_pr_id}", product_id: "${prod_pr_id}", writing_producer_id: "${prod1_id}", state_code: "CA", annual_premium_cents: 1200000, effective_date: "2026-01-01T00:00:00Z", expiration_date: "2027-01-01T00:00:00Z" }
              as: Producer
              as_user_id: "${prod1_id}"
              captures: { pol_pr_id: $.data.id, pol_pr_v: $.data.version }
            - call: "POST /policies/${pol_pr_id}/bind"
              payload: { expected_policy_version: "${pol_pr_v}" }
              as: Producer
              as_user_id: "${prod1_id}"
              captures: { pol_pr_v2: $.data.version }
            - call: "POST /policies/${pol_pr_id}/activate"
              payload: { expected_policy_version: "${pol_pr_v2}" }
              as: AccountManager
            - call: "POST /policies"
              payload: { account_id: "${acct_sr_id}", product_id: "${prod_sr_id}", writing_producer_id: "${prod2_id}", state_code: "CA", annual_premium_cents: 1200000, effective_date: "2026-01-01T00:00:00Z", expiration_date: "2027-01-01T00:00:00Z" }
              as: Producer
              as_user_id: "${prod2_id}"
              captures: { pol_sr_id: $.data.id, pol_sr_v: $.data.version }
            - call: "POST /policies/${pol_sr_id}/bind"
              payload: { expected_policy_version: "${pol_sr_v}" }
              as: Producer
              as_user_id: "${prod2_id}"
              captures: { pol_sr_v2: $.data.version }
            - call: "POST /policies/${pol_sr_id}/activate"
              payload: { expected_policy_version: "${pol_sr_v2}" }
              as: AccountManager
              captures: { pol_sr_v3: $.data.version }
          trigger:
            - call: "POST /policies/${pol_pr_id}/cancel"
              payload: { expected_policy_version: "${pol_pr_v2}", cancellation_date: "2026-07-01T00:00:00Z", cancellation_reason: "INSURED_REQUEST" }
              as: AccountManager
              captures: { pol_pr_rp: $.data.return_premium_cents }
            - call: "POST /policies/${pol_sr_id}/cancel"
              payload: { expected_policy_version: "${pol_sr_v3}", cancellation_date: "2026-07-01T00:00:00Z", cancellation_reason: "INSURED_REQUEST" }
              as: AccountManager
              captures: { pol_sr_rp: $.data.return_premium_cents }
          assert:
            - "Policy.${pol_pr_id}.return_premium_cents == 604932"
            - "Policy.${pol_pr_id}.earned_premium_cents == 595068"
            - "Policy.${pol_sr_id}.return_premium_cents == 544438"
            - "Policy.${pol_sr_id}.earned_premium_cents == 655562"

      - name: statement_open_live_vs_finalized_frozen
        grounds:
          - calculations.commission_statement_rollup
          - entities.CommissionStatement.fields.net_payable_cents
          - state_machines.CommissionStatement.OPEN_to_FINALIZED
        distinguishing_aspect: |
          On the CommissionStatement domain: the same producer/period yields
          net_payable_cents == 264000 frozen at FINALIZED, but an OPEN statement
          recomputed after the in-window cancellation (cancellation_date 2026-02-15)
          would show net 10126 (chargeback 253874 applied) — the frozen variant
          ignores the post-finalize cancel and stays at 264000.
        test_recipe:
          setup:
            - "One ACTIVE carrier + AUTO product with new_business_commission_pct=0.20, PRO_RATA basis."
            - "One ACTIVE producer with ACTIVE CA AUTO license and ACTIVE CA appointment, default_split_pct 1.0."
            - "One policy annual_premium_cents=1200000 activated 2026-02-01 with a single WRITING split_pct=1.0; clock 2026-03-01."
            - "An OPEN CommissionStatement for the producer over [2026-02-01, 2026-02-28)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: AgencyAdmin
            - call: "POST /carriers"
              payload: { name: "Carrier S", naic_code: "20001", default_new_business_commission_pct: 0.15, default_renewal_commission_pct: 0.10 }
              as: AgencyAdmin
              captures: { car_id: $.data.id, car_v: $.data.version }
            - call: "POST /carriers/${car_id}/activate"
              payload: { expected_carrier_version: "${car_v}" }
              as: AgencyAdmin
            - call: "POST /products"
              payload: { carrier_id: "${car_id}", line_of_business: "AUTO", name: "Auto S", new_business_commission_pct: 0.20, cancellation_basis: "PRO_RATA" }
              as: AgencyAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /producers"
              payload: { full_name: "Prod S", npn: "NPN201", default_split_pct: 1.0 }
              as: AgencyAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /licenses"
              payload: { producer_id: "${prod_id}", state_code: "CA", line_of_business: "AUTO", effective_date: "2025-01-01T00:00:00Z", expiration_date: "2030-01-01T00:00:00Z" }
              as: AgencyAdmin
            - call: "POST /appointments"
              payload: { carrier_id: "${car_id}", producer_id: "${prod_id}", state_code: "CA" }
              as: AgencyAdmin
              captures: { appt_id: $.data.id, appt_v: $.data.version }
            - call: "POST /appointments/${appt_id}/approve"
              payload: { expected_appointment_version: "${appt_v}" }
              as: AgencyAdmin
              captures: { appt_v2: $.data.version }
            - call: "POST /appointments/${appt_id}/activate"
              payload: { expected_appointment_version: "${appt_v2}" }
              as: AgencyAdmin
            - call: "POST /accounts"
              payload: { name: "Acct S", servicing_producer_id: "${prod_id}", account_type: "PERSONAL" }
              as: AgencyAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /policies"
              payload: { account_id: "${acct_id}", product_id: "${prod_id}", writing_producer_id: "${prod_id}", state_code: "CA", annual_premium_cents: 1200000, effective_date: "2026-02-01T00:00:00Z", expiration_date: "2027-02-01T00:00:00Z" }
              as: Producer
              as_user_id: "${prod_id}"
              captures: { pol_id: $.data.id, pol_v: $.data.version }
            - call: "POST /commission-splits"
              payload: { policy_id: "${pol_id}", producer_id: "${prod_id}", split_pct: 1.0, role: "WRITING", expected_policy_version: "${pol_v}" }
              as: Producer
              as_user_id: "${prod_id}"
              captures: { split_id: $.data.id }
            - call: "GET /policies/${pol_id}"
              payload: {}
              as: Producer
              as_user_id: "${prod_id}"
              captures: { pol_v_after_split: $.data.version }
            - call: "POST /policies/${pol_id}/bind"
              payload: { expected_policy_version: "${pol_v_after_split}" }
              as: Producer
              as_user_id: "${prod_id}"
              captures: { pol_v_bound: $.data.version }
            - call: "POST /policies/${pol_id}/activate"
              payload: { expected_policy_version: "${pol_v_bound}" }
              as: AccountManager
              captures: { pol_v_active: $.data.version }
            - call: "POST /commission-statements"
              payload: { producer_id: "${prod_id}", period_start: "2026-02-01T00:00:00Z", period_end: "2026-02-28T00:00:00Z" }
              as: TrustAccountant
              captures: { stmt_id: $.data.id, stmt_v: $.data.version }
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-03-01T00:00:00Z" }
              as: AgencyAdmin
          trigger:
            - call: "POST /commission-statements/${stmt_id}/finalize"
              payload: { expected_commissionstatement_version: "${stmt_v}" }
              as: TrustAccountant
              captures: { stmt_net_frozen: $.data.net_payable_cents }
            - call: "POST /policies/${pol_id}/cancel"
              payload: { expected_policy_version: "${pol_v_active}", cancellation_date: "2026-02-15T00:00:00Z", cancellation_reason: "INSURED_REQUEST" }
              as: AccountManager
            - call: "GET /commission-statements/${stmt_id}"
              payload: {}
              as: TrustAccountant
              captures: { stmt_net_after: $.data.net_payable_cents }
          assert:
            - "CommissionStatement.${stmt_id}.gross_commission_cents == 264000 (1200000*0.20=240000 agency, *1.10 tier, *1.0 split)"
            - "CommissionStatement.${stmt_id}.net_payable_cents == 264000 (frozen at finalize)"
            - "the GET after the in-window cancel still returns net_payable_cents == 264000 (frozen variant ignores the chargeback; an OPEN statement would have shown 10126)"
            - "CommissionStatement.${stmt_id}.status == FINALIZED"

  # =================================================================
  # Rule 2 — combinatorial_formula (>= 2, different modes a/b/c)
  # =================================================================
  - rule_id: combinatorial_formula
    instances:
      - name: accrual_tiered_rate_with_term_kind_branch
        grounds:
          - calculations.producer_commission_accrual
          - entities.Product.fields.new_business_commission_pct
          - entities.Carrier.fields.default_new_business_commission_pct
          - entities.Policy.fields.term_kind
        distinguishing_aspect: |
          Mode (a): >=3 inputs (term_kind branch selects new-business vs renewal
          rate, rate falls back Product->Carrier, then a volume-tier multiplier
          on annual_premium) interact non-linearly. annual=1200000, product
          rate 0.20, tier 1.10 => agency 264000; WRITING split 0.7 => 184800.
        test_recipe:
          setup:
            - "ACTIVE carrier (default_new=0.15); AUTO product overrides new_business_commission_pct=0.20, PRO_RATA."
            - "ACTIVE producer with ACTIVE CA AUTO license + ACTIVE CA appointment."
            - "New-business policy annual_premium_cents=1200000 with WRITING split 0.7 + SERVICING split 0.3, activated."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-01T00:00:00Z" }
              as: AgencyAdmin
            - call: "POST /carriers"
              payload: { name: "Carrier T", naic_code: "30001", default_new_business_commission_pct: 0.15, default_renewal_commission_pct: 0.10 }
              as: AgencyAdmin
              captures: { car_id: $.data.id, car_v: $.data.version }
            - call: "POST /carriers/${car_id}/activate"
              payload: { expected_carrier_version: "${car_v}" }
              as: AgencyAdmin
            - call: "POST /products"
              payload: { carrier_id: "${car_id}", line_of_business: "AUTO", name: "Auto T", new_business_commission_pct: 0.20, cancellation_basis: "PRO_RATA" }
              as: AgencyAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /producers"
              payload: { full_name: "Writer", npn: "NPN301", default_split_pct: 0.7 }
              as: AgencyAdmin
              captures: { writer_id: $.data.id }
            - call: "POST /producers"
              payload: { full_name: "Servicer", npn: "NPN302", default_split_pct: 0.3 }
              as: AgencyAdmin
              captures: { svc_id: $.data.id }
            - call: "POST /licenses"
              payload: { producer_id: "${writer_id}", state_code: "CA", line_of_business: "AUTO", effective_date: "2025-01-01T00:00:00Z", expiration_date: "2030-01-01T00:00:00Z" }
              as: AgencyAdmin
            - call: "POST /appointments"
              payload: { carrier_id: "${car_id}", producer_id: "${writer_id}", state_code: "CA" }
              as: AgencyAdmin
              captures: { appt_id: $.data.id, appt_v: $.data.version }
            - call: "POST /appointments/${appt_id}/approve"
              payload: { expected_appointment_version: "${appt_v}" }
              as: AgencyAdmin
              captures: { appt_v2: $.data.version }
            - call: "POST /appointments/${appt_id}/activate"
              payload: { expected_appointment_version: "${appt_v2}" }
              as: AgencyAdmin
            - call: "POST /accounts"
              payload: { name: "Acct T", servicing_producer_id: "${writer_id}", account_type: "PERSONAL" }
              as: AgencyAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /policies"
              payload: { account_id: "${acct_id}", product_id: "${prod_id}", writing_producer_id: "${writer_id}", state_code: "CA", annual_premium_cents: 1200000, effective_date: "2026-02-01T00:00:00Z", expiration_date: "2027-02-01T00:00:00Z" }
              as: Producer
              as_user_id: "${writer_id}"
              captures: { pol_id: $.data.id, pol_v: $.data.version }
            - call: "POST /commission-splits"
              payload: { policy_id: "${pol_id}", producer_id: "${writer_id}", split_pct: 0.7, role: "WRITING", expected_policy_version: "${pol_v}" }
              as: Producer
              as_user_id: "${writer_id}"
              captures: { wsplit_id: $.data.id }
            - call: "GET /policies/${pol_id}"
              payload: {}
              as: Producer
              as_user_id: "${writer_id}"
              captures: { pol_v2: $.data.version }
            - call: "POST /commission-splits"
              payload: { policy_id: "${pol_id}", producer_id: "${svc_id}", split_pct: 0.3, role: "SERVICING", expected_policy_version: "${pol_v2}" }
              as: Producer
              as_user_id: "${writer_id}"
              captures: { ssplit_id: $.data.id }
            - call: "GET /policies/${pol_id}"
              payload: {}
              as: Producer
              as_user_id: "${writer_id}"
              captures: { pol_v3: $.data.version }
            - call: "POST /policies/${pol_id}/bind"
              payload: { expected_policy_version: "${pol_v3}" }
              as: Producer
              as_user_id: "${writer_id}"
              captures: { pol_v4: $.data.version }
          trigger:
            - call: "POST /policies/${pol_id}/activate"
              payload: { expected_policy_version: "${pol_v4}" }
              as: AccountManager
            - call: "GET /commission-splits/${wsplit_id}"
              payload: {}
              as: AgencyAdmin
              captures: { wsplit_status: $.data.status }
          assert:
            - "CommissionSplit.${wsplit_id}.status == LOCKED"
            - "writing producer accrual for Policy.${pol_id} == 184800 (agency 264000 * 0.7)"
            - "servicing producer accrual for Policy.${pol_id} == 79200 (agency 264000 * 0.3)"

      - name: statement_round_per_line_then_sum_order
        grounds:
          - calculations.commission_statement_rollup
          - calculations.producer_commission_accrual
          - entities.CommissionStatement.fields.gross_commission_cents
        distinguishing_aspect: |
          Mode (b): nested rounding order is pinned — each per-policy WRITING accrual
          line is round_half_up'd first, then the statement sums the already-rounded
          lines. Policy A (annual 600007) and Policy B (annual 600008) each yield an
          un-rounded writing line of 25410.5 at split 0.5; round-per-line gives
          25411+25411 = 50822, whereas sum-then-round would give round(50821.0)=50821.
          The scaffold pins round-per-line-then-sum, so gross == 50822 (not 50821).
        test_recipe:
          setup:
            - "ACTIVE carrier default_new=0.077; AUTO product no rate override (rate falls back to 0.077), PRO_RATA."
            - "Writing producer + servicing producer, both ACTIVE; writing producer has ACTIVE CA AUTO license + appointment."
            - "Two policies (annual 600007 and 600008), each WRITING split 0.5 (writing producer) + SERVICING split 0.5 (servicing producer), both activated in [2026-02-01,2026-02-28)."
            - "OPEN statement for the WRITING producer over [2026-02-01,2026-02-28)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-02-05T00:00:00Z" }
              as: AgencyAdmin
            - call: "POST /carriers"
              payload: { name: "Carrier R", naic_code: "30002", default_new_business_commission_pct: 0.077, default_renewal_commission_pct: 0.05 }
              as: AgencyAdmin
              captures: { car_id: $.data.id, car_v: $.data.version }
            - call: "POST /carriers/${car_id}/activate"
              payload: { expected_carrier_version: "${car_v}" }
              as: AgencyAdmin
            - call: "POST /products"
              payload: { carrier_id: "${car_id}", line_of_business: "AUTO", name: "Auto R", cancellation_basis: "PRO_RATA" }
              as: AgencyAdmin
              captures: { prod_id: $.data.id }
            - call: "POST /producers"
              payload: { full_name: "Writer R", npn: "NPN401", default_split_pct: 0.5 }
              as: AgencyAdmin
              captures: { writer_id: $.data.id }
            - call: "POST /producers"
              payload: { full_name: "Servicer R", npn: "NPN402", default_split_pct: 0.5 }
              as: AgencyAdmin
              captures: { svc_id: $.data.id }
            - call: "POST /licenses"
              payload: { producer_id: "${writer_id}", state_code: "CA", line_of_business: "AUTO", effective_date: "2025-01-01T00:00:00Z", expiration_date: "2030-01-01T00:00:00Z" }
              as: AgencyAdmin
            - call: "POST /appointments"
              payload: { carrier_id: "${car_id}", producer_id: "${writer_id}", state_code: "CA" }
              as: AgencyAdmin
              captures: { appt_id: $.data.id, appt_v: $.data.version }
            - call: "POST /appointments/${appt_id}/approve"
              payload: { expected_appointment_version: "${appt_v}" }
              as: AgencyAdmin
              captures: { appt_v2: $.data.version }
            - call: "POST /appointments/${appt_id}/activate"
              payload: { expected_appointment_version: "${appt_v2}" }
              as: AgencyAdmin
            - call: "POST /accounts"
              payload: { name: "Acct R", servicing_producer_id: "${writer_id}", account_type: "PERSONAL" }
              as: AgencyAdmin
              captures: { acct_id: $.data.id }
            - call: "POST /policies"
              payload: { account_id: "${acct_id}", product_id: "${prod_id}", writing_producer_id: "${writer_id}", state_code: "CA", annual_premium_cents: 600007, effective_date: "2026-02-01T00:00:00Z", expiration_date: "2027-02-01T00:00:00Z" }
              as: Producer
              as_user_id: "${writer_id}"
              captures: { polA_id: $.data.id, polA_v: $.data.version }
            - call: "POST /commission-splits"
              payload: { policy_id: "${polA_id}", producer_id: "${writer_id}", split_pct: 0.5, role: "WRITING", expected_policy_version: "${polA_v}" }
              as: Producer
              as_user_id: "${writer_id}"
            - call: "GET /policies/${polA_id}"
              payload: {}
              as: Producer
              as_user_id: "${writer_id}"
              captures: { polA_v2: $.data.version }
            - call: "POST /commission-splits"
              payload: { policy_id: "${polA_id}", producer_id: "${svc_id}", split_pct: 0.5, role: "SERVICING", expected_policy_version: "${polA_v2}" }
              as: Producer
              as_user_id: "${writer_id}"
            - call: "GET /policies/${polA_id}"
