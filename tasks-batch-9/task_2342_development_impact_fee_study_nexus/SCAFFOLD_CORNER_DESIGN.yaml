  # ===========================================================================
  - section: rbac
    instances:
      - name: calls_with_missing_x_user_headers_are_unauthenticated
        claim_type: authentication
        grounds:
          - validations[priority=1]
          - errors.ERR_UNAUTHENTICATED
          - endpoints[POST /_clock/set_current_utc]
        distinguishing_aspect: |
          Authentication is checked at priority 1, ahead of role, path resolution and body
          shape, so a header-less read of an existing row still returns 401 rather than 200,
          and a header-less write with an otherwise perfect body still returns 401 rather
          than 403 or 422. The clock endpoint is the single declared exception and must keep
          working with no headers at all, otherwise no test fixture could set up time.
        test_recipe:
          setup:
            - "FeeProgram HARBOR exists at version 1."
            - "The three trigger calls are sent with NO X-User-ID and NO X-User-Role header (call 2 sends a blank X-User-ID)."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-05T00:00:00Z" }
              as: ProgramAdministrator
            - call: "POST /fee-programs"
              payload: { name: "City of Harbor Impact Fee Program", jurisdiction_code: "HARBOR" }
              as: ProgramAdministrator
              as_user_id: "admin-1"
              captures: { prog_id: $.data.id, prog_v: $.data.version }
          trigger:
            - call: "GET /fee-programs/${prog_id}"
              as: "(no X-User-ID / X-User-Role headers sent)"
            - call: "POST /fee-programs"
              payload: { name: "Ghost Program", jurisdiction_code: "GHOST" }
              as: "(no X-User-ID / X-User-Role headers sent)"
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-01-06T00:00:00Z" }
              as: "(no X-User-ID / X-User-Role headers sent)"
          assert:
            - "Call 1: HTTP 401 with error_id ERR_UNAUTHENTICATED and data null - the row exists but is never read."
            - "Call 2: HTTP 401 with error_id ERR_UNAUTHENTICATED, NOT 403 and NOT 422; no FeeProgram named Ghost Program is created."
            - "Call 3: HTTP 200 - POST /_clock/set_current_utc is the one endpoint exempt from the header requirement, and the clock reads 2026-01-06T00:00:00Z afterwards."
