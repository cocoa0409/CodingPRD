        distinguishing_aspect: "The cited RedemptionOrder must belong to the entitlement's own account: account A consuming its own entitlement while citing account B's order returns 422 ERR_ORDER_ACCOUNT_MISMATCH, and used_count stays 0 — this is an ownership check on the cited row, not on the caller."
