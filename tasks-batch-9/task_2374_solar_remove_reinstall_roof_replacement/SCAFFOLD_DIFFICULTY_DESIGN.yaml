              as: ProjectCoordinator
              captures: { crew_id: $.data.id }
            - call: "POST /reroof/projects"
              payload: { site_address: "77 Ocotillo Ln, Chandler AZ", ownership_model: "HOST_OWNED", system_dc_kw: 6.0, roofer_party_id: "${roofer_id}", solar_owner_party_id: "${owner_id}", solar_contractor_party_id: "${crew_id}", baseline_daily_kwh: 30.0, downtime_days_estimated: 4, upgrade_budget_cents: 2000000 }
              as: ProjectCoordinator
              captures: { proj_id: $.data.id }
            - call: "POST /reroof/projects/${proj_id}/party-approvals"
              payload: { party_id: "${roofer_id}" }
              as: ProjectCoordinator
              captures: { ap_roof: $.data.id }
            - call: "POST /reroof/projects/${proj_id}/party-approvals"
              payload: { party_id: "${owner_id}" }
              as: ProjectCoordinator
              captures: { ap_own: $.data.id }
            - call: "POST /reroof/party-approvals/${ap_roof}/decision"
              payload: { decision: "APPROVE" }
              as: RoofingContractor
              as_user_id: "${roofer_id}"
            - call: "POST /reroof/party-approvals/${ap_own}/decision"
              payload: { decision: "APPROVE" }
              as: SolarOwner
              as_user_id: "${owner_id}"
            - call: "POST /reroof/work-windows"
              payload: { project_id: "${proj_id}", party_id: "${roofer_id}", trade: "ROOFING", start_utc: "2026-08-05T08:00:00Z", end_utc: "2026-08-05T12:00:00Z" }
              as: ProjectCoordinator
              captures: { w_base: $.data.id }
          trigger:
            - call: "POST /reroof/work-windows"
              payload: { project_id: "${proj_id}", party_id: "${roofer_id}", trade: "ROOFING", start_utc: "2026-08-05T12:00:00Z", end_utc: "2026-08-05T16:00:00Z" }
              as: ProjectCoordinator
              captures: { err_id: $.data.error_id }
            - call: "POST /reroof/work-windows"
              payload: { project_id: "${proj_id}", party_id: "${roofer_id}", trade: "ROOFING", start_utc: "2026-08-05T13:30:00Z", end_utc: "2026-08-05T17:00:00Z" }
              as: ProjectCoordinator
              captures: { w_ok: $.data.id }
            - call: "POST /reroof/work-windows"
              payload: { project_id: "${proj_id}", party_id: "${crew_id}", trade: "SOLAR_REMOVAL", start_utc: "2026-08-05T12:00:00Z", end_utc: "2026-08-05T16:00:00Z" }
              as: ProjectCoordinator
              captures: { w_other: $.data.id }
          assert:
            - "trigger call 1 returns HTTP 409"
            - "${err_id} == ERR_CREW_WINDOW_CONFLICT"
            - "trigger call 2 returns HTTP 201 and WorkWindow.${w_ok}.status == SCHEDULED"
