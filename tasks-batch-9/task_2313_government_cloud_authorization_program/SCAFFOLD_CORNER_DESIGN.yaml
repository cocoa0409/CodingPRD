  - name: the_final_impact_variant_runs_only_on_the_determination_endpoint
    claim_type: variant_selection
    grounds:
    - calculations.impact_level_determination.variants
    - validations[priority=18]
    - errors[ERR_NO_CONFIRMED_DATA_CATEGORY]
    distinguishing_aspect: 'Declaring a category runs the preliminary variant only: preliminary_impact_level is written while
      final_impact_level and baseline_id stay null, and the determination endpoint refuses outright because the final variant''s
      input set (CONFIRMED rows) is empty. After the confirm, the same endpoint computes the final level and selects the baseline.'
