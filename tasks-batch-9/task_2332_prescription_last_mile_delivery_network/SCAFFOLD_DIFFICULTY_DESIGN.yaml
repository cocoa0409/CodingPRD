  # ===========================================================================
  - rule_id: compensating_invariant
    instances:
      - name: plan_grant_budget_conserved_across_reserve_and_cancel
        conserved_quantity: "PlanGrant.grant_budget_cents == remaining_cents + committed_cents + consumed_cents"
        grounds:
          - calculations.plan_grant_commitment_and_absorption
          - state_machines.Delivery.QUEUED_to_CANCELLED
          - state_machines.PlanGrant.ACTIVE_to_EXHAUSTED
          - entities.PlanGrant.fields.remaining_cents
        distinguishing_aspect: |
          The conserved quantity is money: the three-way split of a grant budget into remaining,
          committed and consumed must sum to the budget at every observation, and a cancel must
          restore the pre-reservation split exactly, including flipping the derived status back from
          EXHAUSTED to ACTIVE with no residue left behind.
        test_recipe:
          setup:
            - "Commercial plan at 10%; PlanGrant funded to exactly 150 cents with a 150-cent cap, so one standard delivery consumes the whole pool."
            - "One READY standard Z1 order and a 14:00-16:00Z window of capacity 1."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { current_utc: "2026-08-03T09:00:00Z" }
              as: NetworkOps
            - call: "POST /health-plans"
              payload: { name: "Meridian Health", payer_type: "COMMERCIAL", member_cost_share_pct: 0.10 }
              as: NetworkOps
              captures: { hp1_id: $.data.id }
            - call: "POST /plan-grants"
              payload: { health_plan_id: "${hp1_id}", benefit_year: 2026, grant_budget_cents: 150, per_delivery_cap_cents: 150 }
              as: NetworkOps
              captures: { g1_id: $.data.id }
            - call: "POST /pharmacies"
              payload: { name: "Cedar Rx", state_code: "WA", cold_chain_certified: true, controlled_license_tier: "CII_V", return_window_minutes: 240 }
              as: NetworkOps
              captures: { ph1_id: $.data.id }
            - call: "POST /delivery-zones"
