scenario: "Flexible-Rent & Rent-Splitting Platform: enrollment & pay-schedule (split/defer), fee & repayment, landlord full-rent remittance, delinquency & recovery, autopay & reminder, eligibility/underwriting, property integration, reporting"
domain_name: "flexible-rent-splitting"
api_prefix: "/api"

complexity_profile:
  primary_archetype: ledger_reconciliation
  secondary_archetype: workflow_orchestration
  complexity_layers:
    - dual_variant_calculation
    - cascading_side_effects
    - scheduled_actions
    - optimistic_concurrency

  entity_topology: flat
  # Peer entities linked by explicit foreign keys (renter_id, property_id, cycle_id,
  # case_id). No deep URL nesting except sub-resource reads. Chosen for diversity.

  state_machine_shape: branching
  # Application forks SUBMITTED->{APPROVED,DECLINED}; Installment cycles
  # SCHEDULED<->FAILED (retry loop); DelinquencyCase cycles
  # IN_OUTREACH->PROMISE_TO_PAY->BROKEN_PROMISE->IN_OUTREACH; AutopayMandate
  # cycles ACTIVE<->PAUSED. Multiple non-linear machines on different entities.

  relationship_patterns:
    - one_to_many          # Property->Renter, BillingCycle->Installment, BillingCycle->LedgerEntry
    - cross_aggregate      # DelinquencyCase references BillingCycle + Renter; Remittance references Property + BillingCycle

  role_model: segregation_of_duties
  # CollectionsManager who approves a charge-off MUST differ from the
  # CollectionsAgent who last recorded a recovery action on the same case.
  # Underwriter (decisions) is a distinct peer from PlatformAdmin (remittance/ops).

  consistency_model: immediate
  # All ledger, cascade, and derived-field updates land atomically within the
  # triggering request's response.

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =====================================================================
# §1.1 Entity-Relationship Table
# =====================================================================
entities:
  - name: Property
    parent: null
    common_fields: true
    fields:
      - name: landlord_name
        type: string
        source: input
        description: "Legal name of the landlord / property owner."
      - name: unit_label
        type: string
        source: input
        description: "Human label for the unit, e.g. 'Maple Court #4B'."
      - name: full_rent_cents
        type: integer
        source: input
        description: "Full monthly rent the platform remits to the landlord, in cents."
        constraints: "> 0"
      - name: rent_due_day
        type: integer
        source: input
        description: "Day-of-month rent is due (1-28)."
        constraints: "1..28"
      - name: remittance_account_ref
        type: string
        source: input
        description: "Opaque payout account handle for landlord remittance."
      - name: integration_status
        type: enum
        source: input
        description: "Property integration state gating remittance."
        default: PENDING
        constraints: "one of {PENDING, ACTIVE, SUSPENDED}"
      - name: status
        type: enum
        source: computed
        description: "Lifecycle mirror of integration_status for listing filters."
        default: PENDING
        constraints: "one of {PENDING, ACTIVE, SUSPENDED}"

  - name: Renter
    parent: null
    common_fields: true
    fields:
      - name: property_id
        type: string
        source: input
        description: "FK -> Property.id; the property this renter rents."
      - name: email
        type: string
        source: input
        description: "Renter contact email; unique per property."
      - name: full_name
        type: string
        source: input
        description: "Renter full name."
      - name: portion_rent_cents
        type: integer
        source: input
        description: "The renter's own share of monthly rent that is financed/split, in cents."
        constraints: "> 0"
      - name: status
        type: enum
        source: computed
        description: "Enrollment lifecycle; ENROLLED is set by Application approval cascade."
        default: PROSPECT
        constraints: "one of {PROSPECT, UNDERWRITING, ENROLLED, SUSPENDED}"
      - name: risk_band
        type: enum
        source: computed
        description: "Underwriting band from latest APPROVED Application risk_score. Null until approved."
        constraints: "one of {LOW, MEDIUM, HIGH} or null"
      - name: approved_limit_cents
        type: integer
        source: computed
        description: "Max portion_rent_cents the renter may finance per cycle; set by Application approval. 0 until approved."
        default: 0
      - name: autopay_enabled
        type: boolean
        source: computed
        description: "Mirror of the renter's AutopayMandate.status == ACTIVE."
        default: false

  - name: Application
    parent: null
    common_fields: true
    fields:
      - name: renter_id
        type: string
        source: input
        description: "FK -> Renter.id; the applicant."
      - name: reported_monthly_income_cents
        type: integer
        source: input
        description: "Self-reported monthly income used in underwriting, in cents."
        constraints: "> 0"
      - name: requested_split_count
        type: integer
        source: input
        description: "How many installments the applicant wants to split rent into (2..4)."
        constraints: "2..4"
      - name: prior_delinquency_count
        type: integer
        source: input
        description: "Self-declared count of prior rent delinquencies used in scoring."
        default: 0
        constraints: ">= 0"
      - name: status
        type: enum
        source: computed
        description: "Underwriting decision lifecycle."
        default: SUBMITTED
        constraints: "one of {SUBMITTED, APPROVED, DECLINED, WITHDRAWN}"
      - name: risk_score
        type: integer
        source: computed
        description: "Weighted underwriting score 0..100, higher = safer. Computed at submission."
      - name: risk_band
        type: enum
        source: computed
        description: "Band derived from risk_score: LOW>=75, MEDIUM>=50, else HIGH."
        constraints: "one of {LOW, MEDIUM, HIGH}"
      - name: approved_limit_cents
        type: integer
        source: computed
        description: "Computed max financeable portion; copied to Renter on APPROVED."
      - name: decision_reason
        type: string
        source: computed
        description: "Human-readable reason for APPROVED/DECLINED; null while SUBMITTED."

  - name: BillingCycle
    parent: null
    common_fields: true
    fields:
      - name: renter_id
        type: string
        source: input
        description: "FK -> Renter.id; whose rent this cycle finances."
      - name: property_id
        type: string
        source: computed
        description: "FK -> Property.id; copied from the renter at cycle creation."
      - name: cycle_month
        type: string
        source: input
        description: "Billing month in YYYY-MM; unique per renter."
      - name: cycle_start_date
        type: datetime
        source: input
        description: "ISO date the rent is due for this cycle (installment day-0 anchor)."
      - name: mode
        type: enum
        source: input
        description: "Pay-schedule strategy."
        constraints: "one of {SPLIT, DEFER}"
      - name: split_count
        type: integer
        source: input
        description: "Number of installments in SPLIT mode (2..4). In DEFER mode fixed to 2."
        constraints: "2..4"
      - name: deferred_amount_cents
        type: integer
        source: input
        description: "DEFER mode only: portion pushed to the deferred installment, in cents."
        default: 0
      - name: planned_defer_days
        type: integer
        source: input
        description: "DEFER mode only: days after cycle_start the deferred installment is due (1..MAX_DEFER_DAYS)."
        default: 0
      - name: full_rent_cents
        type: integer
        source: computed
        description: "Snapshot of Property.full_rent_cents at creation; amount remitted to landlord."
      - name: portion_cents
        type: integer
        source: computed
        description: "Snapshot of Renter.portion_rent_cents at creation; total the renter repays across installments."
      - name: fee_provisional_cents
        type: integer
        source: computed
        description: "Flex fee computed at creation (membership + split + planned defer carry). See calculations.flex_fee."
      - name: fee_final_cents
        type: integer
        source: computed
        description: "Flex fee re-computed at settlement using actual defer days; null until SETTLED."
      - name: repaid_amount_cents
        type: integer
        source: computed
        description: "Sum of PAID Installment.amount_cents for this cycle. See calculations.cycle_repaid_amount."
        default: 0
      - name: net_remitted_cents
        type: integer
        source: computed
        description: "sum(LedgerEntry.amount_cents where entry_type=REMITTANCE_ADVANCE) - sum(where entry_type=REVERSAL). Conserved quantity for the remittance invariant."
        default: 0
      - name: outstanding_cents
        type: integer
        source: computed
        description: "portion_cents - repaid_amount_cents; principal the renter still owes."
      - name: status
        type: enum
        source: computed
        description: "Cycle lifecycle."
        default: SCHEDULED
        constraints: "one of {SCHEDULED, REMITTED, SETTLED, DELINQUENT, WRITTEN_OFF, CANCELLED}"

  - name: Installment
    parent: null
    common_fields: true
    fields:
      - name: cycle_id
        type: string
        source: input
        description: "FK -> BillingCycle.id; parent cycle."
      - name: sequence_no
        type: integer
        source: computed
        description: "1-based order within the cycle; drives rounding-remainder allocation and due-date spacing."
      - name: due_date
        type: datetime
        source: computed
        description: "ISO datetime the installment is due (cycle_start_date + offset days)."
      - name: amount_cents
        type: integer
        source: computed
        description: "Principal share for this installment, in cents. Sum over non-CANCELLED installments equals portion_cents."
      - name: kind
        type: enum
        source: computed
        description: "IMMEDIATE (day-0), SPLIT (spaced), or DEFERRED (DEFER mode second installment)."
        constraints: "one of {IMMEDIATE, SPLIT, DEFERRED}"
      - name: attempt_count
        type: integer
        source: computed
        description: "Number of charge attempts so far; retry loop caps at MAX_ATTEMPTS."
        default: 0
      - name: paid_at
        type: datetime
        source: computed
        description: "Logical clock time the installment reached PAID; null otherwise."
      - name: status
        type: enum
        source: computed
        description: "Installment lifecycle with retry loop."
        default: SCHEDULED
        constraints: "one of {SCHEDULED, PAID, FAILED, WAIVED, CANCELLED}"

  - name: Remittance
    parent: null
    common_fields: true
    fields:
      - name: cycle_id
        type: string
        source: input
        description: "FK -> BillingCycle.id; the cycle whose full rent is remitted."
      - name: property_id
        type: string
        source: computed
        description: "FK -> Property.id; landlord payout target, copied from the cycle."
      - name: amount_cents
        type: integer
        source: computed
        description: "Full rent advanced to the landlord, in cents (= cycle.full_rent_cents)."
      - name: sent_at
        type: datetime
        source: computed
        description: "Logical clock time the remittance was sent."
      - name: status
        type: enum
        source: computed
        description: "Remittance lifecycle."
        default: SENT
        constraints: "one of {SENT, REVERSED}"

  - name: AutopayMandate
    parent: null
    common_fields: true
    fields:
      - name: renter_id
        type: string
        source: input
        description: "FK -> Renter.id; mandate owner. One mandate per renter."
      - name: method_ref
        type: string
        source: input
        description: "Opaque payment-method handle used for autopay charges."
        default: null
      - name: status
        type: enum
        source: computed
        description: "Mandate lifecycle; auto-created PAUSED on Application approval."
        default: PAUSED
        constraints: "one of {PAUSED, ACTIVE, REVOKED}"

  - name: DelinquencyCase
    parent: null
    common_fields: true
    fields:
      - name: cycle_id
        type: string
        source: input
        description: "FK -> BillingCycle.id; the delinquent cycle. One open case per cycle."
      - name: renter_id
        type: string
        source: computed
        description: "FK -> Renter.id; copied from the cycle."
      - name: recovery_round
        type: integer
        source: computed
        description: "Increments each time the case re-enters IN_OUTREACH from BROKEN_PROMISE."
        default: 0
      - name: accrued_late_fee_cents
        type: integer
        source: computed
        description: "Cumulative late fees: LATE_FEE_FLAT_CENTS at open + LATE_FEE_ROUND_CENTS per broken promise."
        default: 0
      - name: principal_outstanding_cents
        type: integer
        source: computed
        description: "Snapshot of cycle.outstanding_cents; unpaid principal driving payoff math."
      - name: reinstatement_amount_cents
        type: integer
        source: computed
        description: "Reinstatement payoff (calculations.delinquency_payoff): principal_outstanding_cents + accrued_late_fee_cents."
      - name: settlement_amount_cents
        type: integer
        source: computed
        description: "Settlement payoff (calculations.delinquency_payoff): principal_outstanding_cents + SETTLEMENT_ADMIN_FEE_CENTS (late fees waived)."
      - name: promise_date
        type: datetime
        source: computed
        description: "Current promise-to-pay target date; null unless in PROMISE_TO_PAY."
      - name: opened_at
        type: datetime
        source: computed
        description: "Logical clock time the case opened; anchors RECOVERY_MIN_DAYS for charge-off."
      - name: last_recovery_agent_id
        type: string
        source: computed
        description: "X-User-ID of the CollectionsAgent who last recorded a recovery action; drives charge-off SoD."
        default: null
      - name: status
        type: enum
        source: computed
        description: "Recovery lifecycle with an outreach cycle."
        default: OPEN
        constraints: "one of {OPEN, IN_OUTREACH, PROMISE_TO_PAY, BROKEN_PROMISE, RESOLVED, CHARGED_OFF}"

  - name: RecoveryAction
    parent: null
    common_fields: false
    fields:
      - name: case_id
        type: string
        source: input
        description: "FK -> DelinquencyCase.id; the case this action advances."
      - name: action_type
        type: enum
        source: input
        description: "Recovery step recorded by a CollectionsAgent."
        constraints: "one of {OUTREACH, PROMISE_SET, RETRY_CHARGE, NOTE}"
      - name: agent_id
        type: string
        source: computed
        description: "X-User-ID of the acting CollectionsAgent; stamped onto the case as last_recovery_agent_id."
      - name: promise_date
        type: datetime
        source: input
        description: "For PROMISE_SET: the promised pay date (within PROMISE_MAX_DAYS). Null otherwise."
        default: null
      - name: note
        type: string
        source: input
        description: "Free-text collections note."
        default: null

  - name: Reminder
    parent: null
    common_fields: false
    fields:
      - name: renter_id
        type: string
        source: computed
        description: "FK -> Renter.id; recipient."
      - name: cycle_id
        type: string
        source: computed
        description: "FK -> BillingCycle.id; the cycle the reminder concerns."
      - name: kind
        type: enum
        source: computed
        description: "Reminder category emitted as a side-effect."
        constraints: "one of {OVERDUE, PROMISE_CONFIRMATION, CHARGE_OFF_NOTICE}"
      - name: channel
        type: string
        source: computed
        description: "Delivery channel; fixed EMAIL in this scaffold."
        default: EMAIL
      - name: sent_at
        type: datetime
        source: computed
        description: "Logical clock time the reminder was emitted."

  - name: LedgerEntry
    parent: null
    common_fields: false
    fields:
      - name: cycle_id
        type: string
        source: input
        description: "FK -> BillingCycle.id; the cycle this money movement belongs to."
      - name: entry_type
        type: enum
        source: computed
        description: "Money-movement category."
        constraints: "one of {REMITTANCE_ADVANCE, REPAYMENT, FEE, FEE_REFUND, LATE_FEE, WRITE_OFF, REVERSAL}"
      - name: amount_cents
        type: integer
        source: computed
        description: "Signed amount in cents. REMITTANCE_ADVANCE/FEE/LATE_FEE positive; REPAYMENT/FEE_REFUND/WRITE_OFF/REVERSAL negative to the platform receivable per PRD sign convention."
      - name: memo
        type: string
        source: computed
        description: "Human-readable description of the entry."

# =====================================================================
# §1.2 State Machine Table
# =====================================================================
state_machines:
  - entity: Application
    initial_state: SUBMITTED
    terminal_states: [APPROVED, DECLINED, WITHDRAWN]
    transitions:
      - from: SUBMITTED
        to: APPROVED
        trigger: "POST /api/applications/{id}/decision {decision: APPROVE}"
        actor: Underwriter
        preconditions:
          - "risk_score >= DECLINE_SCORE_THRESHOLD (50)"
          - "income_to_rent_ratio >= MIN_RATIO (1.5)"
        side_effects:
          - "set Application.approved_limit_cents, risk_band, decision_reason"
          - "cascade: Renter.status := ENROLLED (from PROSPECT/UNDERWRITING)"
          - "cascade: Renter.approved_limit_cents := Application.approved_limit_cents; Renter.risk_band := Application.risk_band"
          - "cascade: create AutopayMandate for renter in PAUSED (if none exists)"
        note: "Depth-2 cascade origin: Application->Renter->AutopayMandate."
      - from: SUBMITTED
        to: DECLINED
        trigger: "POST /api/applications/{id}/decision {decision: DECLINE}"
        actor: Underwriter
        preconditions:
          - "risk_score < DECLINE_SCORE_THRESHOLD OR income_to_rent_ratio < MIN_RATIO"
        side_effects:
          - "set Application.decision_reason"
          - "cascade: Renter.status := SUSPENDED (blocks cycle creation)"
      - from: SUBMITTED
        to: WITHDRAWN
        trigger: "POST /api/applications/{id}/decision {decision: WITHDRAW}"
        actor: Renter
        preconditions:
          - "acting Renter owns the Application"
        side_effects:
          - "set decision_reason := 'withdrawn by renter'"

  - entity: AutopayMandate
    initial_state: PAUSED
    terminal_states: [REVOKED]
    transitions:
      - from: PAUSED
        to: ACTIVE
        trigger: "PATCH /api/autopay-mandates/{id} {status: ACTIVE, method_ref}"
        actor: Renter
        preconditions:
          - "method_ref present (non-null)"
        side_effects:
          - "Renter.autopay_enabled := true"
      - from: ACTIVE
        to: PAUSED
        trigger: "PATCH /api/autopay-mandates/{id} {status: PAUSED}"
        actor: Renter
        preconditions: []
        side_effects:
          - "Renter.autopay_enabled := false"
        note: "ACTIVE<->PAUSED forms a cycle (non-linear)."
      - from: ACTIVE
        to: REVOKED
        trigger: "PATCH /api/autopay-mandates/{id} {status: REVOKED}"
        actor: Renter
        preconditions: []
        side_effects:
          - "Renter.autopay_enabled := false"
      - from: PAUSED
        to: REVOKED
        trigger: "PATCH /api/autopay-mandates/{id} {status: REVOKED}"
        actor: Renter
        preconditions: []
        side_effects: []

  - entity: BillingCycle
    initial_state: SCHEDULED
    terminal_states: [SETTLED, WRITTEN_OFF, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: REMITTED
        trigger: "POST /api/billing-cycles/{id}/remit"
        actor: PlatformAdmin
        preconditions:
          - "Property.integration_status == ACTIVE  (cross-entity: Remittance->Property)"
          - "no non-REVERSED Remittance already exists for this cycle"
        side_effects:
          - "create Remittance (SENT, amount_cents = full_rent_cents)"
          - "append LedgerEntry(REMITTANCE_ADVANCE, +full_rent_cents)"
          - "append LedgerEntry(FEE, +fee_provisional_cents)"
          - "recompute net_remitted_cents (:= full_rent_cents)"
      - from: REMITTED
        to: SCHEDULED
        trigger: "POST /api/remittances/{id}/reverse"
        actor: PlatformAdmin
        preconditions:
          - "Remittance.status == SENT"
          - "cycle.status == REMITTED (no repayments recorded yet: repaid_amount_cents == 0)"
        side_effects:
          - "Remittance.status := REVERSED"
          - "append LedgerEntry(REVERSAL, -full_rent_cents)"
          - "append LedgerEntry(FEE_REFUND, -fee_provisional_cents)"
          - "recompute net_remitted_cents (:= 0)  [compensating: remittance invariant]"
      - from: REMITTED
        to: SETTLED
        trigger: "POST /api/billing-cycles/{id}/settle"
        actor: PlatformAdmin
        preconditions:
          - "repaid_amount_cents >= portion_cents (outstanding_cents <= 0; boundary at exactly 0)"
        side_effects:
          - "compute fee_final_cents via calculations.flex_fee (final variant)"
          - "if fee_final_cents < fee_provisional_cents: append LedgerEntry(FEE_REFUND, -(fee_provisional_cents - fee_final_cents))"
          - "cycle.status := SETTLED"
      - from: REMITTED
        to: DELINQUENT
        trigger: "POST /api/billing-cycles/{id}/assess-delinquency OR installment final-attempt failure cascade"
        actor: PlatformAdmin | system
        preconditions:
          - "at least one Installment past due_date (clock > due_date) and not PAID/WAIVED/CANCELLED, and outstanding_cents > 0"
        side_effects:
          - "create DelinquencyCase (OPEN, principal_outstanding_cents = outstanding_cents, opened_at = clock)"
          - "cascade: DelinquencyCase applies LATE_FEE -> append LedgerEntry(LATE_FEE, +LATE_FEE_FLAT_CENTS); case.accrued_late_fee_cents := LATE_FEE_FLAT_CENTS"
          - "cascade: emit Reminder(OVERDUE)"
        note: "Depth-3 cascade origin (installment failure path): Installment->BillingCycle->DelinquencyCase->LedgerEntry."
      - from: DELINQUENT
        to: SETTLED
        trigger: "POST /api/delinquency-cases/{id}/resolve"
        actor: CollectionsAgent
        preconditions:
          - "cycle.outstanding_cents <= 0 (renter has paid remaining principal)"
        side_effects:
          - "DelinquencyCase.status := RESOLVED"
          - "cycle.status := SETTLED"
      - from: DELINQUENT
        to: WRITTEN_OFF
        trigger: "POST /api/delinquency-cases/{id}/charge-off"
        actor: CollectionsManager
        preconditions:
          - "case eligible for charge-off (see DelinquencyCase machine)"
        side_effects:
          - "DelinquencyCase.status := CHARGED_OFF"
          - "append LedgerEntry(WRITE_OFF, -outstanding_cents)"
          - "cascade: emit Reminder(CHARGE_OFF_NOTICE)"
      - from: SCHEDULED
        to: CANCELLED
        trigger: "POST /api/billing-cycles/{id}/cancel"
        actor: PlatformAdmin
        preconditions:
          - "no SENT Remittance exists (never remitted)"
        side_effects:
          - "cascade: all SCHEDULED/FAILED Installments -> CANCELLED"

  - entity: Installment
    initial_state: SCHEDULED
    terminal_states: [PAID, WAIVED, CANCELLED]
    transitions:
      - from: SCHEDULED
        to: PAID
        trigger: "POST /api/installments/{id}/charge (success)"
        actor: Renter | PlatformAdmin
        preconditions:
          - "parent cycle.status == REMITTED or DELINQUENT"
          - "if method == AUTOPAY: renter's AutopayMandate.status == ACTIVE (cross-entity: Installment->AutopayMandate)"
        side_effects:
          - "attempt_count += 1; status := PAID; paid_at := clock"
          - "append LedgerEntry(REPAYMENT, -amount_cents)"
          - "recompute cycle.repaid_amount_cents, outstanding_cents"
          - "bubble-up: if outstanding_cents <= 0 and cycle DELINQUENT -> no auto-settle (requires explicit resolve/settle)"
      - from: SCHEDULED
        to: FAILED
        trigger: "POST /api/installments/{id}/charge (simulated failure via outcome=FAIL)"
        actor: Renter | PlatformAdmin
        preconditions:
          - "attempt_count < MAX_ATTEMPTS (3)"
        side_effects:
          - "attempt_count += 1; status := FAILED"
      - from: FAILED
        to: SCHEDULED
        trigger: "POST /api/installments/{id}/retry"
        actor: Renter | PlatformAdmin
        preconditions:
          - "attempt_count < MAX_ATTEMPTS (3)"
        side_effects:
          - "status := SCHEDULED (re-armed for another charge)"
        note: "SCHEDULED<->FAILED is the retry cycle (non-linear)."
      - from: FAILED
        to: WAIVED
        trigger: "POST /api/installments/{id}/charge is blocked once attempt_count == MAX_ATTEMPTS; collections may waive"
        actor: CollectionsAgent
        preconditions:
          - "parent DelinquencyCase exists and status in {IN_OUTREACH, PROMISE_TO_PAY, BROKEN_PROMISE}"
        side_effects:
          - "status := WAIVED; recompute cycle.repaid_amount_cents treating WAIVED as satisfied principal"
        note: "Waiver is recorded via recovery-actions NOTE side-effect; modeled here for completeness."

  - entity: Remittance
    initial_state: SENT
    terminal_states: [REVERSED]
    transitions:
      - from: SENT
        to: REVERSED
        trigger: "POST /api/remittances/{id}/reverse"
        actor: PlatformAdmin
        preconditions:
          - "parent cycle.status == REMITTED and cycle.repaid_amount_cents == 0"
        side_effects:
          - "see BillingCycle REMITTED->SCHEDULED compensation"

  - entity: DelinquencyCase
    initial_state: OPEN
    terminal_states: [RESOLVED, CHARGED_OFF]
    transitions:
      - from: OPEN
        to: IN_OUTREACH
        trigger: "POST /api/delinquency-cases/{id}/recovery-actions {action_type: OUTREACH}"
        actor: CollectionsAgent
        preconditions: []
        side_effects:
          - "case.last_recovery_agent_id := X-User-ID; create RecoveryAction(OUTREACH)"
      - from: IN_OUTREACH
        to: PROMISE_TO_PAY
        trigger: "POST /api/delinquency-cases/{id}/recovery-actions {action_type: PROMISE_SET, promise_date}"
        actor: CollectionsAgent
        preconditions:
          - "promise_date within PROMISE_MAX_DAYS (14) of clock (temporal)"
        side_effects:
          - "case.promise_date := promise_date; last_recovery_agent_id := X-User-ID; create RecoveryAction(PROMISE_SET); emit Reminder(PROMISE_CONFIRMATION)"
      - from: PROMISE_TO_PAY
        to: BROKEN_PROMISE
        trigger: "POST /api/delinquency-cases/{id}/assess (clock > promise_date and outstanding_cents > 0)"
        actor: CollectionsAgent | system
        preconditions:
          - "clock > promise_date and cycle.outstanding_cents > 0"
        side_effects:
          - "apply LATE_FEE_ROUND_CENTS: accrued_late_fee_cents += LATE_FEE_ROUND_CENTS; append LedgerEntry(LATE_FEE, +LATE_FEE_ROUND_CENTS)"
      - from: BROKEN_PROMISE
        to: IN_OUTREACH
        trigger: "POST /api/delinquency-cases/{id}/recovery-actions {action_type: OUTREACH}"
        actor: CollectionsAgent
        preconditions: []
        side_effects:
          - "recovery_round += 1; last_recovery_agent_id := X-User-ID; create RecoveryAction(OUTREACH)"
        note: "BROKEN_PROMISE->IN_OUTREACH closes the recovery cycle (non-linear)."
      - from: OPEN
        to: RESOLVED
        trigger: "POST /api/delinquency-cases/{id}/resolve"
        actor: CollectionsAgent
        preconditions:
          - "cycle.outstanding_cents <= 0"
        side_effects:
          - "cascade: cycle.status := SETTLED"
      - from: IN_OUTREACH
        to: RESOLVED
        trigger: "POST /api/delinquency-cases/{id}/resolve"
        actor: CollectionsAgent
        preconditions:
          - "cycle.outstanding_cents <= 0"
        side_effects:
          - "cascade: cycle.status := SETTLED"
      - from: PROMISE_TO_PAY
        to: RESOLVED
        trigger: "POST /api/delinquency-cases/{id}/resolve"
        actor: CollectionsAgent
        preconditions:
          - "cycle.outstanding_cents <= 0"
        side_effects:
          - "cascade: cycle.status := SETTLED"
      - from: BROKEN_PROMISE
        to: RESOLVED
        trigger: "POST /api/delinquency-cases/{id}/resolve"
        actor: CollectionsAgent
        preconditions:
          - "cycle.outstanding_cents <= 0"
        side_effects:
          - "cascade: cycle.status := SETTLED"
      - from: BROKEN_PROMISE
        to: CHARGED_OFF
        trigger: "POST /api/delinquency-cases/{id}/charge-off"
        actor: CollectionsManager
        preconditions:
          - "clock >= opened_at + RECOVERY_MIN_DAYS (30) (temporal)"
          - "acting CollectionsManager X-User-ID != last_recovery_agent_id (segregation of duties)"
          - "cycle.outstanding_cents > 0"
        side_effects:
          - "cascade: cycle.status := WRITTEN_OFF; append LedgerEntry(WRITE_OFF, -outstanding_cents); emit Reminder(CHARGE_OFF_NOTICE)"
      - from: IN_OUTREACH
        to: CHARGED_OFF
        trigger: "POST /api/delinquency-cases/{id}/charge-off"
        actor: CollectionsManager
        preconditions:
          - "clock >= opened_at + RECOVERY_MIN_DAYS (30)"
          - "acting CollectionsManager X-User-ID != last_recovery_agent_id"
          - "cycle.outstanding_cents > 0"
        side_effects:
          - "cascade: cycle.status := WRITTEN_OFF; append LedgerEntry(WRITE_OFF, -outstanding_cents); emit Reminder(CHARGE_OFF_NOTICE)"

# =====================================================================
# §1.2.1 Concurrency Rules
# =====================================================================
concurrency_rules:
  - rule_id: reschedule-stale-cycle
    parent_entity: BillingCycle
    write_endpoint: "POST /api/billing-cycles/{id}/reschedule"
    occ_field: "expected_cycle_version"
    description: |
      Rescheduling a BillingCycle rebuilds its installment layout, cancelling the
      prior SCHEDULED installments and minting a fresh set (a new plan that
      legitimately supersedes the prior plan under the pay-schedule rules). A
      reschedule request that carries a cycle version older than the cycle's
      current version is rejected as stale, because the layout it means to
      supersede is not the one currently in effect.
    error_id: ERR_STALE_CYCLE_VERSION
    http_status: 412

# =====================================================================
# §1.3 Calculation Rules Table
# =====================================================================
calculations:
  - name: underwriting_risk_score
    trigger: "on POST /api/renters/{id}/applications (Application submission)"
    algorithm: weighted_scoring
    formula: |
      # >=3 inputs with non-linear tiered sub-scores (combinatorial mode (a)).
      ratio = reported_monthly_income_cents / portion_rent_cents   # renter's portion, from Renter
      ratio_score  = 100 if ratio >= 3.0 else 70 if ratio >= 2.0 else 40 if ratio >= 1.5 else 10
      split_score  = 100 if requested_split_count <= 2 else 70 if requested_split_count == 3 else 40
      delinq_score = 100 if prior_delinquency_count == 0 else 60 if prior_delinquency_count == 1 else 20
      risk_score = round_half_up(W_RATIO*ratio_score + W_SPLIT*split_score + W_DELINQ*delinq_score)  # 0..100
      risk_band  = 'LOW' if risk_score >= 75 else 'MEDIUM' if risk_score >= 50 else 'HIGH'
      approved_limit_cents = min(portion_rent_cents * LIMIT_MULT[risk_band],
                                 round_half_up(reported_monthly_income_cents * INCOME_LIMIT_PCT))
      # decision at APPROVE time: APPROVE iff risk_score >= DECLINE_SCORE_THRESHOLD and ratio >= MIN_RATIO
    input_set: "Single Application's inputs plus the linked Renter.portion_rent_cents."
    constants:
      W_RATIO: 0.5
      W_SPLIT: 0.2
      W_DELINQ: 0.3
      LIMIT_MULT: { LOW: 3, MEDIUM: 2, HIGH: 1 }
      INCOME_LIMIT_PCT: 0.5
      DECLINE_SCORE_THRESHOLD: 50
      MIN_RATIO: 1.5
      RISK_BAND_LOW_MIN: 75
      RISK_BAND_MEDIUM_MIN: 50
    precision: "integer score (round_half_up); integer cents for limit (round_half_up)"

  - name: installment_schedule
    trigger: "on POST /api/billing-cycles (creation) and POST /api/billing-cycles/{id}/reschedule"
    algorithm: waterfall_allocation
    formula: |
      # Rounding-ORDER matters (combinatorial mode (b)): floor equal shares FIRST,
      # then distribute the leftover cents ONE per installment to the EARLIEST
      # sequence numbers. NEVER round each share independently (that would drop cents).
      if mode == SPLIT:
        n = split_count
        base = portion_cents // n                       # integer floor
        remainder = portion_cents - base * n            # 0..n-1 leftover cents
        for k in 1..n:
          amount[k] = base + (1 if k <= remainder else 0)   # earliest sequences absorb remainder
          due_date[k] = cycle_start_date + (k-1) * SPLIT_STEP_DAYS[n] days
          kind[k] = IMMEDIATE if k == 1 else SPLIT
      if mode == DEFER:
        # exactly 2 installments: immediate remainder now, deferred chunk later
        amount[1] = portion_cents - deferred_amount_cents   # IMMEDIATE, due day 0
        amount[2] = deferred_amount_cents                   # DEFERRED, due cycle_start + planned_defer_days
        kind = [IMMEDIATE, DEFERRED]
      assert sum(amount) == portion_cents                   # conserved obligation
    input_set: "One BillingCycle at creation; portion_cents and mode fields."
    constants:
      SPLIT_STEP_DAYS: { 2: 14, 3: 10, 4: 7 }
      MIN_SPLIT_COUNT: 2
      MAX_SPLIT_COUNT: 4
      MIN_INSTALLMENT_GAP_DAYS: 5
      MAX_DEFER_DAYS: 25
    precision: "integer cents; floor division then remainder allocation, no per-share rounding"

  - name: flex_fee
    trigger: "provisional: on POST /api/billing-cycles creation; final: on POST /api/billing-cycles/{id}/settle"
    algorithm: tiered_pricing
    formula: |
      # Evaluation order is pinned (combinatorial mode (c)): the defer carry fee is
      # computed on deferred_amount_cents ONLY (the raw principal deferred), NOT on the
      # financed-total-including-fee. This avoids the circular fee = pct*(principal+fee).
      membership_component = MEMBERSHIP_FEE_BY_BAND[Renter.risk_band]
      split_component = max(0, split_count - 1) * PER_EXTRA_SPLIT_FEE_CENTS
      if mode == DEFER:
        defer_carry_component = round_half_up(deferred_amount_cents * DEFER_DAILY_BPS * defer_days / 10000)
      else:
        defer_carry_component = 0
      flex_fee_cents = membership_component + split_component + defer_carry_component
    input_set: "One BillingCycle plus the linked Renter.risk_band."
    constants:
      MEMBERSHIP_FEE_BY_BAND: { LOW: 1500, MEDIUM: 2500, HIGH: 4000 }
      PER_EXTRA_SPLIT_FEE_CENTS: 500
      DEFER_DAILY_BPS: 30
    precision: "integer cents, round_half_up"
    variants:
      - name: provisional
        when: "at cycle creation (fee_provisional_cents), charged as LedgerEntry(FEE) on remit"
        difference: "defer_days = planned_defer_days (the SCHEDULED deferred due offset)"
      - name: final
        when: "at settlement (fee_final_cents)"
        difference: "defer_days = actual days = floor((deferred installment paid_at - cycle_start_date) in days); if the renter paid the deferred installment early, final < provisional and the delta is refunded via LedgerEntry(FEE_REFUND)"

  - name: delinquency_payoff
    trigger: "read on GET /api/delinquency-cases/{id} and GET /api/billing-cycles/{id}/summary; drives resolve vs charge-off"
    algorithm: aggregation
    formula: |
      principal_outstanding = cycle.portion_cents - cycle.repaid_amount_cents   # unpaid principal
      reinstatement_amount = principal_outstanding + accrued_late_fee_cents      # full arrears incl. late fees
      settlement_amount    = principal_outstanding + SETTLEMENT_ADMIN_FEE_CENTS  # late fees WAIVED, admin fee added
    input_set: "One DelinquencyCase plus its linked BillingCycle principal fields."
    constants:
      SETTLEMENT_ADMIN_FEE_CENTS: 1500
    precision: "integer cents"
    variants:
      - name: reinstatement
        when: "renter cures the full arrears to reactivate the schedule"
        difference: "adds the full accrued_late_fee_cents"
      - name: settlement
        when: "collections negotiates a discounted lump-sum payoff"
        difference: "waives accrued late fees, adds a flat SETTLEMENT_ADMIN_FEE_CENTS instead; differs from reinstatement whenever accrued_late_fee_cents != SETTLEMENT_ADMIN_FEE_CENTS"

  - name: late_fee_accrual
    trigger: "on BillingCycle REMITTED->DELINQUENT (open) and DelinquencyCase PROMISE_TO_PAY->BROKEN_PROMISE"
    algorithm: threshold
    formula: |
      days_overdue = floor((clock - earliest_unpaid_installment.due_date) in days)
      apply_open_fee = (days_overdue >= GRACE_DAYS)     # boundary: >= not > ; day 4 -> no fee, day 5 -> fee
      open_fee  = LATE_FEE_FLAT_CENTS if apply_open_fee else 0
      broken_promise_fee = LATE_FEE_ROUND_CENTS         # per BROKEN_PROMISE transition
      accrued_late_fee_cents = open_fee + broken_promise_fee * (number of BROKEN_PROMISE transitions so far)
    input_set: "One DelinquencyCase and its cycle's earliest unpaid installment."
    constants:
      GRACE_DAYS: 5
      LATE_FEE_FLAT_CENTS: 2500
      LATE_FEE_ROUND_CENTS: 1000
    precision: "integer cents"

  - name: cycle_repaid_amount
    trigger: "recomputed on Installment SCHEDULED->PAID, FAILED->WAIVED, and reschedule/cancel"
    algorithm: aggregation
    formula: |
      # Source: Installments of THIS cycle with status IN {PAID, WAIVED}; sum their amount_cents.
      # WAIVED principal counts as satisfied. CANCELLED and SCHEDULED/FAILED excluded.
      repaid_amount_cents = sum(installment.amount_cents
                                for installment in cycle.installments
                                if installment.status in {PAID, WAIVED})
      outstanding_cents = portion_cents - repaid_amount_cents
    input_set: "All Installments of one BillingCycle filtered to status IN {PAID, WAIVED}."
    constants: {}
    precision: "integer cents; exact sum, no rounding"

# =====================================================================
# §1.4 Validation Rules Table (ordered by priority; lowest number wins)
# =====================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers present"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"
  - priority: 2
    category: auth
    check: "role permitted for this endpoint per §1.7 RBAC"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"
  - priority: 3
    category: business_constraint
    check: "request body well-formed: required fields present, enums valid, integers non-negative and of correct type (e.g. rent_due_day 1..28). Domain range checks like split_count and defer window are enforced later as business_constraint rules, not here."
    error_id: ERR_VALIDATION
    http_status: 400
    applies_to: "all write endpoints"
  - priority: 4
    category: existence
    check: "path-referenced resources exist, validated left-to-right"
    error_id: ERR_*_NOT_FOUND
    http_status: 404
    applies_to: "all endpoints with path ids"
  - priority: 5
    category: business_referential
    check: "acting Renter (entity_backed) owns the target resource (renter_id / cycle.renter_id / installment's cycle renter_id matches X-User-ID); acting PropertyManager owns the property"
    error_id: ERR_OWNERSHIP_VIOLATION
    http_status: 403
    applies_to: "renter- and property-owned reads/writes"
  - priority: 6
    category: state
    check: "target resource is in a state that permits this transition (e.g., installment SCHEDULED before charge; cycle REMITTED before settle; application SUBMITTED before decision)"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all state-transition endpoints"
  - priority: 7
    category: state
    check: "installment attempt_count < MAX_ATTEMPTS before a charge/retry is permitted"
    error_id: ERR_MAX_ATTEMPTS_EXCEEDED
    http_status: 409
    applies_to: "POST /api/installments/{id}/charge, /retry"
  - priority: 8
    category: business_safety
    check: "charge-off approver (CollectionsManager X-User-ID) differs from case.last_recovery_agent_id (segregation of duties)"
    error_id: ERR_SOD_VIOLATION
    http_status: 403
    applies_to: "POST /api/delinquency-cases/{id}/charge-off"
  - priority: 9
    category: business_referential
    check: "cross-entity state: cycle creation requires Renter.status == ENROLLED"
    error_id: ERR_RENTER_NOT_ENROLLED
    http_status: 409
    applies_to: "POST /api/billing-cycles"
  - priority: 10
    category: business_referential
    check: "cross-entity state: remit requires Property.integration_status == ACTIVE"
    error_id: ERR_PROPERTY_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /api/billing-cycles/{id}/remit"
  - priority: 11
    category: business_referential
    check: "cross-entity state: an AUTOPAY-method charge requires the renter's AutopayMandate.status == ACTIVE"
    error_id: ERR_AUTOPAY_NOT_ACTIVE
    http_status: 409
    applies_to: "POST /api/installments/{id}/charge (method=AUTOPAY)"
  - priority: 12
    category: business_temporal
    check: "DEFER cycle: planned_defer_days in 1..MAX_DEFER_DAYS; defer request's new due offset within window"
    error_id: ERR_DEFER_WINDOW_EXCEEDED
    http_status: 422
    applies_to: "POST /api/billing-cycles (mode=DEFER), POST /api/installments/{id}/defer"
  - priority: 13
    category: business_temporal
    check: "promise_date within PROMISE_MAX_DAYS of clock"
    error_id: ERR_PROMISE_WINDOW_EXCEEDED
    http_status: 422
    applies_to: "POST /api/delinquency-cases/{id}/recovery-actions (PROMISE_SET)"
  - priority: 14
    category: business_temporal
    check: "charge-off only after clock >= case.opened_at + RECOVERY_MIN_DAYS"
    error_id: ERR_RECOVERY_PERIOD_NOT_ELAPSED
    http_status: 422
    applies_to: "POST /api/delinquency-cases/{id}/charge-off"
  - priority: 15
    category: business_constraint
    check: "split_count within MIN_SPLIT_COUNT..MAX_SPLIT_COUNT for SPLIT mode"
    error_id: ERR_INVALID_SPLIT_COUNT
    http_status: 422
    applies_to: "POST /api/billing-cycles (mode=SPLIT), POST /api/billing-cycles/{id}/reschedule"
  - priority: 16
    category: business_constraint
    check: "consecutive installment due dates at least MIN_INSTALLMENT_GAP_DAYS apart (reschedule custom offsets)"
    error_id: ERR_INSTALLMENT_GAP_TOO_SHORT
    http_status: 422
    applies_to: "POST /api/billing-cycles/{id}/reschedule"
  - priority: 17
    category: business_constraint
    check: "at most one non-CANCELLED BillingCycle per (renter_id, cycle_month)"
    error_id: ERR_DUPLICATE_CYCLE
    http_status: 409
    applies_to: "POST /api/billing-cycles"
  - priority: 18
    category: business_fiscal
    check: "portion_cents <= Renter.approved_limit_cents"
    error_id: ERR_LIMIT_EXCEEDED
    http_status: 402
    applies_to: "POST /api/billing-cycles"
  - priority: 19
    category: business_fiscal
    check: "settle requires repaid_amount_cents >= portion_cents (outstanding_cents <= 0)"
    error_id: ERR_INSUFFICIENT_REPAYMENT
    http_status: 422
    applies_to: "POST /api/billing-cycles/{id}/settle"
  - priority: 20
    category: business_fiscal
    check: "charge-off / resolve require outstanding_cents to satisfy the transition (charge-off needs > 0; resolve needs <= 0)"
    error_id: ERR_NO_OUTSTANDING_BALANCE
    http_status: 422
    applies_to: "POST /api/delinquency-cases/{id}/charge-off"
  - priority: 21
    category: business_fiscal
    check: "OCC: expected_cycle_version matches BillingCycle.version on reschedule"
    error_id: ERR_STALE_CYCLE_VERSION
    http_status: 412
    applies_to: "POST /api/billing-cycles/{id}/reschedule"

# =====================================================================
# §1.5 API Endpoint Table
# =====================================================================
endpoints:
  # ---- logical clock (test-driving) ----
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the server logical clock. Startup default is 2026-07-01T00:00:00Z; before any call the clock reads exactly this default and never falls back to wall-clock time."
    roles: [PlatformAdmin]
    code: 200
    input: [to_iso8601]
    output: null
    side_effects: ["logical clock advances to to_iso8601 for all subsequent deadline/overdue math"]

  # ---- Property ----
  - method: POST
    path: "/api/properties"
    description: "Register a landlord property."
    roles: [PlatformAdmin]
    code: 201
    input: [landlord_name, unit_label, full_rent_cents, rent_due_day, remittance_account_ref, "integration_status?"]
    output: Property
    side_effects: ["status mirrors integration_status"]
  - method: GET
    path: "/api/properties/{id}"
    description: "Fetch a property."
    roles: [PlatformAdmin, PropertyManager]
    code: 200
    input: []
    output: Property
    side_effects: []
  - method: GET
    path: "/api/properties"
    description: "List properties."
    roles: [PlatformAdmin]
    code: 200
    input: ["status?", "limit?", "offset?"]
    output: Property[]
    side_effects: []
  - method: PATCH
    path: "/api/properties/{id}/integration"
    description: "Set property integration_status (PENDING/ACTIVE/SUSPENDED)."
    roles: [PlatformAdmin]
    code: 200
    input: [integration_status]
    output: Property
    side_effects: ["status := integration_status"]
  - method: GET
    path: "/api/properties/{id}/remittances"
    description: "List remittances sent for a property (reverse-reach Remittance.property_id)."
    roles: [PlatformAdmin, PropertyManager]
    code: 200
    input: []
    output: Remittance[]
    side_effects: []

  # ---- Renter ----
  - method: POST
    path: "/api/renters"
    description: "Create a renter (PROSPECT) attached to a property."
    roles: [PlatformAdmin]
    code: 201
    input: [property_id, email, full_name, portion_rent_cents]
    output: Renter
    side_effects: []
  - method: GET
    path: "/api/renters/{id}"
    description: "Fetch a renter."
    roles: [PlatformAdmin, Renter]
    code: 200
    input: []
    output: Renter
    side_effects: []
  - method: GET
    path: "/api/renters"
    description: "List renters, optionally filtered by property (reverse-reach Renter.property_id)."
    roles: [PlatformAdmin]
    code: 200
    input: ["property_id?", "status?", "limit?", "offset?"]
    output: Renter[]
    side_effects: []

  # ---- Application (underwriting) ----
  - method: POST
    path: "/api/renters/{id}/applications"
    description: "Submit an underwriting application; computes risk_score/band/approved_limit immediately."
    roles: [Renter, PlatformAdmin]
    code: 201
    input: [reported_monthly_income_cents, requested_split_count, "prior_delinquency_count?"]
    output: Application
    side_effects: ["compute risk_score, risk_band, approved_limit_cents (calculations.underwriting_risk_score)", "Renter.status := UNDERWRITING"]
  - method: GET
    path: "/api/applications/{id}"
    description: "Fetch an application."
    roles: [Underwriter, PlatformAdmin, Renter]
    code: 200
    input: []
    output: Application
    side_effects: []
  - method: GET
    path: "/api/renters/{id}/applications"
    description: "List a renter's applications (reverse-reach Application.renter_id)."
    roles: [Underwriter, PlatformAdmin, Renter]
    code: 200
    input: []
    output: Application[]
    side_effects: []
  - method: POST
    path: "/api/applications/{id}/decision"
    description: "Underwriter approves/declines, or renter withdraws, a SUBMITTED application."
    roles: [Underwriter, Renter]
    code: 200
    input: [decision]
    output: Application
    side_effects:
      - "APPROVE: set approved_limit/risk_band/decision_reason; cascade Renter.status:=ENROLLED, copy limit+band; create AutopayMandate PAUSED"
      - "DECLINE: cascade Renter.status:=SUSPENDED"
      - "WITHDRAW: set decision_reason"

  # ---- Autopay ----
  - method: GET
    path: "/api/renters/{id}/autopay-mandate"
    description: "Fetch the renter's autopay mandate (reverse-reach AutopayMandate.renter_id; array of 0..1)."
    roles: [Renter, PlatformAdmin]
    code: 200
    input: []
    output: AutopayMandate[]
    side_effects: []
  - method: GET
    path: "/api/autopay-mandates/{id}"
    description: "Fetch an autopay mandate."
    roles: [Renter, PlatformAdmin]
    code: 200
    input: []
    output: AutopayMandate
    side_effects: []
  - method: PATCH
    path: "/api/autopay-mandates/{id}"
    description: "Renter sets mandate status (ACTIVE/PAUSED/REVOKED) and method_ref."
    roles: [Renter]
    code: 200
    input: [status, "method_ref?"]
    output: AutopayMandate
    side_effects: ["Renter.autopay_enabled := (status == ACTIVE)"]

  # ---- BillingCycle ----
  - method: POST
    path: "/api/billing-cycles"
    description: "Create a monthly pay-schedule cycle; snapshots rent/portion, computes provisional fee, builds installments."
    roles: [PlatformAdmin]
    code: 201
    input: [renter_id, cycle_month, cycle_start_date, mode, "split_count?", "deferred_amount_cents?", "planned_defer_days?"]
    output: BillingCycle
    side_effects:
      - "snapshot full_rent_cents (Property), portion_cents (Renter)"
      - "compute fee_provisional_cents (calculations.flex_fee provisional)"
      - "build Installments (calculations.installment_schedule)"
      - "copy property_id from renter"
  - method: GET
    path: "/api/billing-cycles/{id}"
    description: "Fetch a billing cycle."
    roles: [PlatformAdmin, Renter, PropertyManager]
    code: 200
    input: []
    output: BillingCycle
    side_effects: []
  - method: GET
    path: "/api/billing-cycles"
    description: "List billing cycles filtered by renter and/or property (reverse-reach BillingCycle.renter_id and .property_id)."
    roles: [PlatformAdmin]
    code: 200
    input: ["renter_id?", "property_id?", "status?", "limit?", "offset?"]
    output: BillingCycle[]
    side_effects: []
  - method: POST
    path: "/api/billing-cycles/{id}/reschedule"
    description: "Rebuild the installment layout (supersedes prior plan). OCC-guarded on cycle version."
    roles: [PlatformAdmin]
    code: 200
    input: [expected_cycle_version, "mode?", "split_count?", "deferred_amount_cents?", "planned_defer_days?", "due_offsets_days?"]
    output: BillingCycle
    side_effects:
      - "cancel prior SCHEDULED Installments; mint a fresh set (calculations.installment_schedule)"
      - "increments BillingCycle.version by 1"
      - "conserves sum(non-CANCELLED Installment.amount_cents) == portion_cents"
  - method: POST
    path: "/api/billing-cycles/{id}/remit"
    description: "Advance full rent to the landlord and charge the provisional fee."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Remittance
    side_effects:
      - "requires Property.integration_status == ACTIVE"
      - "create Remittance(SENT); LedgerEntry(REMITTANCE_ADVANCE,+full_rent), LedgerEntry(FEE,+fee_provisional)"
      - "cycle.status := REMITTED; recompute net_remitted_cents"
  - method: POST
    path: "/api/billing-cycles/{id}/settle"
    description: "Settle a fully-repaid cycle; computes final fee and refunds provisional overcharge."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: BillingCycle
    side_effects:
      - "requires outstanding_cents <= 0"
      - "compute fee_final_cents (calculations.flex_fee final); LedgerEntry(FEE_REFUND) if final < provisional"
      - "cycle.status := SETTLED"
  - method: POST
    path: "/api/billing-cycles/{id}/cancel"
    description: "Cancel a never-remitted cycle; cascades installment cancellation."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: BillingCycle
    side_effects: ["cascade SCHEDULED/FAILED Installments -> CANCELLED", "cycle.status := CANCELLED"]
  - method: POST
    path: "/api/billing-cycles/{id}/assess-delinquency"
    description: "Time-driven delinquency check; opens a case and accrues the flat late fee when past due."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: BillingCycle
    side_effects:
      - "if an installment is past due (clock > due_date) and outstanding_cents > 0: cycle.status := DELINQUENT"
      - "create DelinquencyCase(OPEN); LedgerEntry(LATE_FEE,+LATE_FEE_FLAT_CENTS) when days_overdue >= GRACE_DAYS; emit Reminder(OVERDUE)"
  - method: GET
    path: "/api/billing-cycles/{id}/installments"
    description: "List a cycle's installments (reverse-reach Installment.cycle_id)."
    roles: [PlatformAdmin, Renter]
    code: 200
    input: []
    output: Installment[]
    side_effects: []
  - method: GET
    path: "/api/billing-cycles/{id}/remittances"
    description: "List a cycle's remittances (reverse-reach Remittance.cycle_id)."
    roles: [PlatformAdmin, PropertyManager]
    code: 200
    input: []
    output: Remittance[]
    side_effects: []
  - method: GET
    path: "/api/billing-cycles/{id}/ledger"
    description: "List a cycle's ledger entries (reverse-reach LedgerEntry.cycle_id)."
    roles: [PlatformAdmin, PropertyManager]
    code: 200
    input: []
    output: LedgerEntry[]
    side_effects: []
  - method: GET
    path: "/api/billing-cycles/{id}/reminders"
    description: "List reminders for a cycle (reverse-reach Reminder.cycle_id)."
    roles: [PlatformAdmin, Renter]
    code: 200
    input: []
    output: Reminder[]
    side_effects: []
  - method: GET
    path: "/api/billing-cycles/{id}/summary"
    description: "Computed reporting read: cycle with net_remitted_cents, outstanding_cents, repaid_amount_cents, fee fields."
    roles: [PlatformAdmin, Renter, PropertyManager]
    code: 200
    input: []
    output: BillingCycle
    side_effects: []

  # ---- Installment ----
  - method: GET
    path: "/api/installments/{id}"
    description: "Fetch an installment."
    roles: [PlatformAdmin, Renter]
    code: 200
    input: []
    output: Installment
    side_effects: []
  - method: POST
    path: "/api/installments/{id}/charge"
    description: "Attempt a repayment charge (MANUAL or AUTOPAY). outcome simulates success/failure deterministically."
    roles: [Renter, PlatformAdmin]
    code: 200
    input: [method, "outcome?"]
    output: Installment
    side_effects:
      - "SUCCEED: status:=PAID, paid_at:=clock, LedgerEntry(REPAYMENT,-amount); recompute repaid/outstanding"
      - "FAIL: status:=FAILED; attempt_count+=1"
      - "AUTOPAY requires renter AutopayMandate.status == ACTIVE"
  - method: POST
    path: "/api/installments/{id}/retry"
    description: "Re-arm a FAILED installment for another charge (retry loop, capped at MAX_ATTEMPTS)."
    roles: [Renter, PlatformAdmin]
    code: 200
    input: []
    output: Installment
    side_effects: ["status FAILED -> SCHEDULED"]
  - method: POST
    path: "/api/installments/{id}/defer"
    description: "Push a SCHEDULED installment to a later due date within MAX_DEFER_DAYS; conserves total obligation."
    roles: [Renter, PlatformAdmin]
    code: 200
    input: [new_due_offset_days]
    output: Installment
    side_effects:
      - "cancel the source installment; mint a DEFERRED installment (same amount, due cycle_start + new_due_offset_days)"
      - "sum(non-CANCELLED Installment.amount_cents) unchanged == portion_cents"

  # ---- Remittance ----
  - method: GET
    path: "/api/remittances/{id}"
    description: "Fetch a remittance."
    roles: [PlatformAdmin, PropertyManager]
    code: 200
    input: []
    output: Remittance
    side_effects: []
  - method: POST
    path: "/api/remittances/{id}/reverse"
    description: "Reverse a SENT remittance (compensation); restores net_remitted_cents to 0."
    roles: [PlatformAdmin]
    code: 200
    input: []
    output: Remittance
    side_effects:
      - "requires cycle.repaid_amount_cents == 0"
      - "Remittance.status:=REVERSED; LedgerEntry(REVERSAL,-full_rent), LedgerEntry(FEE_REFUND,-fee_provisional)"
      - "cycle.status := SCHEDULED; net_remitted_cents := 0"

  # ---- DelinquencyCase / recovery ----
  - method: GET
    path: "/api/delinquency-cases/{id}"
    description: "Fetch a delinquency case (includes reinstatement/settlement payoff figures)."
    roles: [PlatformAdmin, CollectionsAgent, CollectionsManager]
    code: 200
    input: []
    output: DelinquencyCase
    side_effects: []
  - method: GET
    path: "/api/delinquency-cases"
    description: "List delinquency cases filtered by cycle and/or renter (reverse-reach DelinquencyCase.cycle_id and .renter_id)."
    roles: [PlatformAdmin, CollectionsAgent, CollectionsManager]
    code: 200
    input: ["cycle_id?", "renter_id?", "status?", "limit?", "offset?"]
    output: DelinquencyCase[]
    side_effects: []
  - method: POST
    path: "/api/delinquency-cases/{id}/recovery-actions"
    description: "Record a recovery step (OUTREACH/PROMISE_SET/RETRY_CHARGE/NOTE); drives the recovery state cycle."
    roles: [CollectionsAgent]
    code: 201
    input: [action_type, "promise_date?", "note?"]
    output: RecoveryAction
    side_effects:
      - "OUTREACH: OPEN->IN_OUTREACH or BROKEN_PROMISE->IN_OUTREACH (recovery_round+=1); stamp last_recovery_agent_id"
      - "PROMISE_SET: IN_OUTREACH->PROMISE_TO_PAY; set promise_date; emit Reminder(PROMISE_CONFIRMATION)"
      - "stamp case.last_recovery_agent_id := X-User-ID"
  - method: GET
    path: "/api/delinquency-cases/{id}/recovery-actions"
    description: "List a case's recovery actions (reverse-reach RecoveryAction.case_id)."
    roles: [CollectionsAgent, CollectionsManager, PlatformAdmin]
    code: 200
    input: []
    output: RecoveryAction[]
    side_effects: []
  - method: POST
    path: "/api/delinquency-cases/{id}/assess"
    description: "Time-driven promise check: PROMISE_TO_PAY -> BROKEN_PROMISE when clock > promise_date and outstanding remains."
    roles: [CollectionsAgent, PlatformAdmin]
    code: 200
    input: []
    output: DelinquencyCase
    side_effects: ["PROMISE_TO_PAY->BROKEN_PROMISE; accrued_late_fee_cents += LATE_FEE_ROUND_CENTS; LedgerEntry(LATE_FEE,+LATE_FEE_ROUND_CENTS)"]
  - method: POST
    path: "/api/delinquency-cases/{id}/charge-off"
    description: "CollectionsManager writes off a case after the recovery period; SoD-guarded against the last recovery agent."
    roles: [CollectionsManager]
    code: 200
    input: []
    output: DelinquencyCase
    side_effects:
      - "requires clock >= opened_at + RECOVERY_MIN_DAYS and X-User-ID != last_recovery_agent_id and outstanding_cents > 0"
      - "status:=CHARGED_OFF; cascade cycle.status:=WRITTEN_OFF; LedgerEntry(WRITE_OFF,-outstanding); emit Reminder(CHARGE_OFF_NOTICE)"
  - method: POST
    path: "/api/delinquency-cases/{id}/resolve"
    description: "Resolve a case once the renter has cured the outstanding principal."
    roles: [CollectionsAgent]
    code: 200
    input: []
    output: DelinquencyCase
    side_effects: ["requires outstanding_cents <= 0", "status:=RESOLVED; cascade cycle.status:=SETTLED"]

  # ---- Reminder ----
  - method: GET
    path: "/api/renters/{id}/reminders"
    description: "List a renter's reminders (reverse-reach Reminder.renter_id)."
    roles: [PlatformAdmin, Renter]
    code: 200
    input: []
    output: Reminder[]
    side_effects: []

# =====================================================================
# §1.6 Error Code Catalog
# =====================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "X-User-Role or X-User-ID header missing/blank"
  - id: ERR_UNAUTHORIZED
    http: 403
    condition: "authenticated role not permitted for this endpoint/operation"
  - id: ERR_VALIDATION
    http: 400
    condition: "malformed body: missing required field, invalid enum, integer out of declared range"
  - id: ERR_PROPERTY_NOT_FOUND
    http: 404
    condition: "referenced Property id does not exist"
  - id: ERR_RENTER_NOT_FOUND
    http: 404
    condition: "referenced Renter id does not exist"
  - id: ERR_APPLICATION_NOT_FOUND
    http: 404
    condition: "referenced Application id does not exist"
  - id: ERR_BILLING_CYCLE_NOT_FOUND
    http: 404
    condition: "referenced BillingCycle id does not exist"
  - id: ERR_INSTALLMENT_NOT_FOUND
    http: 404
    condition: "referenced Installment id does not exist"
  - id: ERR_REMITTANCE_NOT_FOUND
    http: 404
    condition: "referenced Remittance id does not exist"
  - id: ERR_MANDATE_NOT_FOUND
    http: 404
    condition: "referenced AutopayMandate id does not exist"
  - id: ERR_DELINQUENCY_CASE_NOT_FOUND
    http: 404
    condition: "referenced DelinquencyCase id does not exist"
  - id: ERR_OWNERSHIP_VIOLATION
    http: 403
    condition: "entity_backed Renter/PropertyManager acting on a resource they do not own"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "target resource not in a state that permits this transition"
  - id: ERR_MAX_ATTEMPTS_EXCEEDED
    http: 409
    condition: "installment charge/retry attempted when attempt_count == MAX_ATTEMPTS"
  - id: ERR_SOD_VIOLATION
    http: 403
    condition: "charge-off approver X-User-ID equals case.last_recovery_agent_id (segregation of duties)"
  - id: ERR_RENTER_NOT_ENROLLED
    http: 409
    condition: "cycle creation attempted while Renter.status != ENROLLED"
  - id: ERR_PROPERTY_NOT_ACTIVE
    http: 409
    condition: "remit attempted while Property.integration_status != ACTIVE"
  - id: ERR_AUTOPAY_NOT_ACTIVE
    http: 409
    condition: "AUTOPAY-method charge while renter AutopayMandate.status != ACTIVE"
  - id: ERR_DEFER_WINDOW_EXCEEDED
    http: 422
    condition: "planned_defer_days or defer offset outside 1..MAX_DEFER_DAYS"
  - id: ERR_PROMISE_WINDOW_EXCEEDED
    http: 422
    condition: "promise_date beyond PROMISE_MAX_DAYS from clock"
  - id: ERR_RECOVERY_PERIOD_NOT_ELAPSED
    http: 422
    condition: "charge-off before clock >= opened_at + RECOVERY_MIN_DAYS"
  - id: ERR_INVALID_SPLIT_COUNT
    http: 422
    condition: "split_count outside MIN_SPLIT_COUNT..MAX_SPLIT_COUNT"
  - id: ERR_INSTALLMENT_GAP_TOO_SHORT
    http: 422
    condition: "reschedule due offsets closer than MIN_INSTALLMENT_GAP_DAYS"
  - id: ERR_DUPLICATE_CYCLE
    http: 409
    condition: "a non-CANCELLED BillingCycle already exists for (renter_id, cycle_month)"
  - id: ERR_LIMIT_EXCEEDED
    http: 402
    condition: "portion_cents exceeds Renter.approved_limit_cents at cycle creation"
  - id: ERR_INSUFFICIENT_REPAYMENT
    http: 422
    condition: "settle attempted while outstanding_cents > 0"
  - id: ERR_NO_OUTSTANDING_BALANCE
    http: 422
    condition: "charge-off attempted while outstanding_cents <= 0"
  - id: ERR_STALE_CYCLE_VERSION
    http: 412
    condition: "reschedule expected_cycle_version != BillingCycle.version"

# =====================================================================
# §1.7 RBAC Matrix
# =====================================================================
roles:
  - name: PlatformAdmin
    description: "Operations: configures properties, creates renters/cycles, remits, settles, runs delinquency assessment."
    identity: "opaque"
    exclusive_operations:
      - "POST /api/properties, PATCH /api/properties/{id}/integration"
      - "POST /api/renters"
      - "POST /api/billing-cycles, /reschedule, /remit, /settle, /cancel, /assess-delinquency"
      - "POST /api/remittances/{id}/reverse"
      - "POST /_clock/set_current_utc"
    shared_operations:
      - "GET reads across properties, renters, applications, cycles, installments, remittances, ledger, reminders, cases"
      - "POST /api/renters/{id}/applications (on behalf of a renter)"
      - "POST /api/installments/{id}/charge, /retry, /defer"
  - name: Underwriter
    description: "Reviews applications and issues APPROVE/DECLINE decisions. Cannot touch money movement (SoD from ops)."
    identity: "opaque"
    exclusive_operations:
      - "POST /api/applications/{id}/decision (APPROVE/DECLINE)"
    shared_operations:
      - "GET /api/applications/{id}, GET /api/renters/{id}/applications"
  - name: CollectionsAgent
    description: "Works delinquency recovery: outreach, promises, retries, resolve."
    identity: "opaque"
    exclusive_operations:
      - "POST /api/delinquency-cases/{id}/recovery-actions"
      - "POST /api/delinquency-cases/{id}/assess"
      - "POST /api/delinquency-cases/{id}/resolve"
    shared_operations:
      - "GET /api/delinquency-cases, /{id}, /{id}/recovery-actions"
  - name: CollectionsManager
    description: "Approves charge-offs. SoD: must differ from the agent who last worked the case."
    identity: "opaque"
    exclusive_operations:
      - "POST /api/delinquency-cases/{id}/charge-off"
    shared_operations:
      - "GET /api/delinquency-cases, /{id}, /{id}/recovery-actions"
  - name: Renter
    description: "Enrolled resident: applies, manages autopay, charges/defers own installments, withdraws own application."
    identity: "entity_backed:Renter"
    exclusive_operations:
      - "PATCH /api/autopay-mandates/{id} (own mandate)"
    shared_operations:
      - "POST /api/renters/{id}/applications (own), POST /api/applications/{id}/decision (WITHDRAW own)"
      - "POST /api/installments/{id}/charge, /retry, /defer (own cycle)"
      - "GET own renter, applications, autopay-mandate, cycles, installments, reminders"
  - name: PropertyManager
    description: "Landlord-side viewer of their property's remittances and cycles."
    identity: "entity_backed:Property"
    exclusive_operations: []
    shared_operations:
      - "GET /api/properties/{id} (own), /api/properties/{id}/remittances (own)"
      - "GET /api/billing-cycles/{id}, /remittances, /ledger, /summary (own property's cycles)"

