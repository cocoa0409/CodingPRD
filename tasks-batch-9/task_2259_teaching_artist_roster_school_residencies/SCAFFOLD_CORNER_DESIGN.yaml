              captures: { resp_status: $.data.status, resp_enc: $.data.encumbered_cents }
            - call: "GET /residencies/${r1_id}"
              payload: {}
              as: FiscalOfficer
              captures: { read_enc: $.data.encumbered_cents, read_avail: $.data.available_cents, read_proj: $.data.projected_cost_cents }
            - call: "GET /sessions/${sess1_id}"
              payload: {}
              as: TeachingArtist
              as_user_id: "${a1_id}"
              captures: { read_session_enc: $.data.encumbered_cents, read_session_status: $.data.status }
          assert:
            - "${resp_status} == CONFIRMED"
            - "${resp_enc} == 13974 — the encumbrance is already present in the confirm response itself"
            - "${read_enc} == ${resp_enc} and ${read_avail} == 186026 == 200000 - ${resp_enc} in the very next read"
            - "${read_session_enc} == 13974 and ${read_session_status} == CONFIRMED"
            - "${read_proj} == 13974 + 9 * 13974 (the confirmed session at its actual projection plus the nine still-unscheduled sessions)"
            - "no read returns a stale ledger figure at any point in the sequence"
