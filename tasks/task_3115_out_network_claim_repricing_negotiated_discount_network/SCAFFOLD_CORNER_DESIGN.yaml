      - name: determination_input_snapshot_is_frozen_at_pricing
        claim_type: derived_field_reconciliation
        grounds:
          - entities.RepricingDetermination.fields.input_snapshot
          - state_machines.RepricingDetermination
        distinguishing_aspect: "After pricing, loading a NEW Medicare rate row (or retiring the policy) does not alter the existing determination's input_snapshot or the claim's allowed amount — the snapshot is frozen and the computation_trace immutable."
