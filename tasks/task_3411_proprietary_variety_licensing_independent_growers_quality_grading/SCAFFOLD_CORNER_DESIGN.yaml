          - errors.ERR_LOT_QUANTITY_EXCEEDED
        distinguishing_aspect: "Reservation at creation is bounded by the lot: planning 600 plants against a 500-plant lot fails 409 ERR_LOT_QUANTITY_EXCEEDED at POST /licensing/plantings — no PLANNED row is created."
        test_recipe:
