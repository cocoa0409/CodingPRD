            - call: "GET /loyalty-programs/${prog_id}"
              payload: {}
              as: ProgramAdmin
              captures: { prog_v2: "$.data.version" }
            - call: "POST /program-change-notices"
              payload: { program_id: "${prog_id}", change_type: "AWARD_PRICING", effective_at: "2026-08-20T00:00:00Z", grandfather_until: "2026-08-25T00:00:00Z", expected_program_version: "${prog_v2}" }
              as: ProgramAdmin
              captures: { n2_id: "$.data.id" }
          trigger:
            - call: "POST /program-change-notices/${n1_id}/announce"
              payload: {}
              as: ProgramAdmin
              captures: { err: "$.data.error_id" }
            - call: "POST /program-change-notices/${n2_id}/announce"
              payload: {}
              as: ProgramAdmin
          assert:
            - "the first trigger returns HTTP 409 with data.error_id == ERR_REACTION_RISK_EXCEEDED"
            - "ProgramChangeNotice.${n1_id}.status == DRAFT"
            - "ProgramChangeNotice.${n1_id}.announced_at == null"
            - "the second trigger returns HTTP 200"
            - "ProgramChangeNotice.${n2_id}.status == ANNOUNCED"
            - "ProgramChangeNotice.${n2_id}.notice_days == 19"
            - "ProgramChangeNotice.${n2_id}.exposed_member_count == 0"
            - "ProgramChangeNotice.${n2_id}.member_reaction_index == 85"

      - name: reversal_transaction_links_to_the_row_it_undoes
        claim_type: cross_reference_link
        grounds:
          - endpoints[POST /mile-transactions]
          - endpoints[GET /mile-transactions]
          - entities.MileTransaction.fields.reverses_transaction_id
          - entities.MemberAccount.fields.lifetime_miles
        distinguishing_aspect: "A REVERSAL row carries a live FK to the REDEEM it undoes and is retrievable by that FK, restores the balance to 10000, and - unlike the earn - does NOT count toward lifetime_miles, which stays at 10000 rather than becoming 14000."
        test_recipe:
          setup:
            - "One LoyaltyProgram in OPEN, current_period 2026-08."
            - "One MemberAccount at elite_tier BASE with a 10000-mile partner earn and a 4000-mile redemption, so mile_balance is 6000."
            - "Logical clock at its 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /loyalty-programs"
              payload: { name: "SkyMiles Link", current_period: "2026-08" }
              as: ProgramAdmin
              captures: { prog_id: "$.data.id" }
            - call: "POST /member-accounts"
              payload: { program_id: "${prog_id}", external_member_ref: "MBR-LINK", home_region: "AMER" }
              as: ProgramAdmin
              captures: { mem_id: "$.data.id" }
            - call: "POST /mile-transactions"
              payload: { member_id: "${mem_id}", txn_type: "PARTNER_EARN", activity_date: "2026-07-05", base_miles: 10000 }
              as: RevenueAccountant
              captures: { earn_id: "$.data.id" }
            - call: "POST /mile-transactions"
              payload: { member_id: "${mem_id}", txn_type: "REDEEM", activity_date: "2026-07-25", base_miles: 4000 }
              as: RevenueAccountant
              captures: { redeem_id: "$.data.id" }
          trigger:
            - call: "POST /mile-transactions"
              payload: { member_id: "${mem_id}", txn_type: "REVERSAL", activity_date: "2026-08-01", base_miles: 4000, reverses_transaction_id: "${redeem_id}" }
              as: RevenueAccountant
              captures: { rev_id: "$.data.id" }
          assert:
            - "the trigger returns HTTP 201"
            - "MileTransaction.${rev_id}.reverses_transaction_id == ${redeem_id}"
            - "MileTransaction.${rev_id}.total_miles == 4000"
            - "MileTransaction.${rev_id}.tier_bonus_miles == 0"
            - "MileTransaction.${rev_id}.bonus_miles == 0"
            - "MileTransaction.${rev_id}.qualifying_miles_credited == 0"
            - "MemberAccount.${mem_id}.mile_balance == 10000"
            - "MemberAccount.${mem_id}.lifetime_miles == 10000"
            - "LoyaltyProgram.${prog_id}.outstanding_miles == 10000"
            - "GET /mile-transactions?reverses_transaction_id=${redeem_id} returns total_count 1"
            - "GET /mile-transactions?member_id=${mem_id} returns total_count 3"

  # ===================================================================
  # Table 6 walk: every catalog code must be triggerable. Codes already
  # driven by a §1.8 instance or by an earlier §1.9 section are not
  # repeated here; the instances below close the remaining gaps.
  - section: errors
    instances:

      - name: every_unresolvable_identifier_returns_its_own_not_found_code
        claim_type: error_triggerable
        grounds:
          - validations[priority=5]
          - validations[priority=6]
          - errors.ERR_PROGRAM_NOT_FOUND
          - errors.ERR_ISSUER_NOT_FOUND
          - errors.ERR_AGREEMENT_NOT_FOUND
          - errors.ERR_ORDER_NOT_FOUND
          - errors.ERR_MEMBER_NOT_FOUND
          - errors.ERR_TRANSACTION_NOT_FOUND
          - errors.ERR_PROMOTION_NOT_FOUND
          - errors.ERR_AWARD_WINDOW_NOT_FOUND
          - errors.ERR_PARTNER_NOT_FOUND
          - errors.ERR_NOTICE_NOT_FOUND
          - errors.ERR_FRAUD_CASE_NOT_FOUND
          - errors.ERR_POSTING_NOT_FOUND
        distinguishing_aspect: "Twelve distinct 404 codes must be distinguishable rather than collapsed into one generic not-found, and the thirteenth call proves the body-FK path (reverses_transaction_id) reports ERR_TRANSACTION_NOT_FOUND too - not ERR_INVALID_REQUEST - because FK existence (priority 6) is checked after schema but with its own code."
        test_recipe:
          setup:
            - "One LoyaltyProgram in OPEN with one MemberAccount, so the database is non-empty and the misses are genuine misses."
            - "No issuer, agreement, order, transaction, campaign, window, partner airline, notice, fraud case or posting exists."
            - "Logical clock at its 2026-08-01T00:00:00Z default."
          setup_api_calls:
            - call: "POST /loyalty-programs"
              payload: { name: "SkyMiles NotFound", current_period: "2026-08" }
              as: ProgramAdmin
              captures: { prog_id: "$.data.id" }
            - call: "POST /member-accounts"
              payload: { program_id: "${prog_id}", external_member_ref: "MBR-404", home_region: "AMER" }
              as: ProgramAdmin
              captures: { mem_id: "$.data.id" }
          trigger:
            - call: "GET /loyalty-programs/00000000-0000-4000-8000-000000000001"
              payload: {}
              as: ProgramAdmin
              captures: { e_program: "$.data.error_id" }
            - call: "GET /co-brand-issuers/00000000-0000-4000-8000-000000000002"
              payload: {}
              as: ProgramAdmin
              captures: { e_issuer: "$.data.error_id" }
            - call: "GET /mile-sale-agreements/00000000-0000-4000-8000-000000000003"
              payload: {}
              as: ProgramAdmin
              captures: { e_agreement: "$.data.error_id" }
            - call: "GET /mile-purchase-orders/00000000-0000-4000-8000-000000000004"
              payload: {}
              as: ProgramAdmin
              captures: { e_order: "$.data.error_id" }
            - call: "GET /member-accounts/00000000-0000-4000-8000-000000000005"
              payload: {}
              as: ProgramAdmin
              captures: { e_member: "$.data.error_id" }
            - call: "GET /mile-transactions/00000000-0000-4000-8000-000000000006"
              payload: {}
              as: ProgramAdmin
              captures: { e_txn: "$.data.error_id" }
            - call: "GET /promotion-campaigns/00000000-0000-4000-8000-000000000007"
              payload: {}
              as: ProgramAdmin
              captures: { e_promo: "$.data.error_id" }
            - call: "GET /award-inventory-windows/00000000-0000-4000-8000-000000000008"
              payload: {}
              as: ProgramAdmin
              captures: { e_window: "$.data.error_id" }
            - call: "GET /partner-airlines/00000000-0000-4000-8000-000000000009"
              payload: {}
              as: ProgramAdmin
              captures: { e_partner: "$.data.error_id" }
            - call: "GET /program-change-notices/00000000-0000-4000-8000-000000000010"
              payload: {}
              as: ProgramAdmin
              captures: { e_notice: "$.data.error_id" }
            - call: "GET /fraud-cases/00000000-0000-4000-8000-000000000011"
              payload: {}
              as: ProgramAdmin
              captures: { e_case: "$.data.error_id" }
            - call: "GET /deferred-revenue-postings/00000000-0000-4000-8000-000000000012"
              payload: {}
              as: ProgramAdmin
              captures: { e_posting: "$.data.error_id" }
            - call: "POST /mile-transactions"
              payload: { member_id: "${mem_id}", txn_type: "REVERSAL", activity_date: "2026-08-01", base_miles: 100, reverses_transaction_id: "00000000-0000-4000-8000-000000000013" }
              as: RevenueAccountant
              captures: { e_fk: "$.data.error_id" }
          assert:
            - "call 1 returns HTTP 404 with data.error_id == ERR_PROGRAM_NOT_FOUND"
            - "call 2 returns HTTP 404 with data.error_id == ERR_ISSUER_NOT_FOUND"
            - "call 3 returns HTTP 404 with data.error_id == ERR_AGREEMENT_NOT_FOUND"
            - "call 4 returns HTTP 404 with data.error_id == ERR_ORDER_NOT_FOUND"
            - "call 5 returns HTTP 404 with data.error_id == ERR_MEMBER_NOT_FOUND"
            - "call 6 returns HTTP 404 with data.error_id == ERR_TRANSACTION_NOT_FOUND"
            - "call 7 returns HTTP 404 with data.error_id == ERR_PROMOTION_NOT_FOUND"
            - "call 8 returns HTTP 404 with data.error_id == ERR_AWARD_WINDOW_NOT_FOUND"
            - "call 9 returns HTTP 404 with data.error_id == ERR_PARTNER_NOT_FOUND"
            - "call 10 returns HTTP 404 with data.error_id == ERR_NOTICE_NOT_FOUND"
            - "call 11 returns HTTP 404 with data.error_id == ERR_FRAUD_CASE_NOT_FOUND"
            - "call 12 returns HTTP 404 with data.error_id == ERR_POSTING_NOT_FOUND"
            - "call 13 returns HTTP 404 with data.error_id == ERR_TRANSACTION_NOT_FOUND"
