scenario: |
  Last-Mile Delivery Route Optimization (UPS/FedEx style): route planning,
  signature requirement, time windows, redelivery, transit center sorting,
  customer appointment adjustment, Driver Release authorization, Hazmat.

domain_name: last-mile-delivery
api_prefix: /parcels

complexity_profile:
  primary_archetype: workflow_orchestration
  secondary_archetype: temporal_windowing
  complexity_layers:
    - cascading_side_effects
    - dual_variant_calculation
    - rate_threshold_triggers
    - compliance_audit
    - scheduled_deferred_actions
  entity_topology: hybrid
  state_machine_shape: cyclic
  relationship_patterns:
    - one_to_many
    - cross_aggregate
    - polymorphic
  role_model: peer_roles
  consistency_model: immediate

response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:
  - name: Customer
    parent: null
    common_fields: true
    fields:
      - name: email
        type: string
        source: input
        description: Customer contact email
        constraints: unique, RFC 5322 format
      - name: full_name
        type: string
        source: input
        description: Display name printed on labels
      - name: phone
        type: string
        source: input
        description: SMS-capable phone for ETA + appointment notifications
        constraints: E.164 format
      - name: default_address_id
        type: string
        source: input
        description: FK to Address used when a parcel omits a destination
        default: null
      - name: driver_release_authorized
        type: boolean
        source: input
        description: Standing authorization to leave parcels without signature at this customer's default address
        default: false
      - name: redelivery_attempts_used_30d
        type: integer
        source: computed
        description: Count of REATTEMPT_SCHEDULED transitions in the trailing 30 days for parcels owned by this customer
        default: 0

  - name: Address
    parent: Customer
    common_fields: false
    fields:
      - name: customer_id
        type: string
        source: input
        description: FK to owning Customer
      - name: line1
        type: string
        source: input
        description: Street address
      - name: city
        type: string
        source: input
        description: City
      - name: postal_code
        type: string
        source: input
        description: 5-digit postal code; routing key for service area
      - name: latitude
        type: number
        source: input
        description: Geocoded latitude
        constraints: -90.0 to 90.0
      - name: longitude
        type: number
        source: input
        description: Geocoded longitude
        constraints: -180.0 to 180.0
      - name: residential
        type: boolean
        source: input
        description: Affects signature/driver-release defaults
        default: true

  - name: TransitCenter
    parent: null
    common_fields: true
    fields:
      - name: code
        type: string
        source: input
        description: Three-letter hub code (e.g., LAX, JFK)
        constraints: unique, exactly 3 uppercase letters
      - name: serviced_postal_prefixes
        type: array
        source: input
        description: List of 3-digit postal prefixes this center sorts for
      - name: hazmat_certified
        type: boolean
        source: input
        description: True if the hub may sort and stage Hazmat parcels
        default: false
      - name: parcels_on_belt
        type: integer
        source: computed
        description: Count of parcels currently in IN_TRANSIT_HUB state assigned to this center
        default: 0

  - name: Driver
    parent: null
    common_fields: true
    fields:
      - name: badge_id
        type: string
        source: input
        description: Public driver badge number
        constraints: unique
      - name: home_center_id
        type: string
        source: input
        description: FK to TransitCenter where the driver checks in
      - name: hazmat_endorsement
        type: boolean
        source: input
        description: True if certified to load/unload Hazmat parcels
        default: false
      - name: status
        type: enum
        source: computed
        description: Lifecycle state of the driver
        constraints: values [OFF_DUTY, ON_DUTY, ON_ROUTE, RETURNED]
        default: OFF_DUTY

  - name: Parcel
    parent: null
    common_fields: true
    fields:
      - name: tracking_number
        type: string
        source: system
        description: Server-minted 12-character alphanumeric tracker
        constraints: unique, uppercase letters and digits only
      - name: customer_id
        type: string
        source: input
        description: FK to recipient Customer
      - name: destination_address_id
        type: string
        source: input
        description: FK to Address; defaults to customer.default_address_id when omitted
      - name: origin_center_id
        type: string
        source: input
        description: FK to TransitCenter where parcel was inducted
      - name: weight_kg
        type: number
        source: input
        description: Declared weight in kilograms
        constraints: 0.01 to 70.0
      - name: declared_value
        type: number
        source: input
        description: Insured value in USD
        constraints: 0.00 to 50000.00
      - name: signature_required
        type: boolean
        source: input
        description: Recipient must sign on delivery; overrides driver_release_authorized
        default: false
      - name: hazmat_class
        type: enum
        source: input
        description: UN Hazmat class; null if not regulated
        constraints: values [NONE, CLASS_2, CLASS_3, CLASS_4, CLASS_8, CLASS_9]
        default: NONE
      - name: time_window_start
        type: datetime
        source: input
        description: Earliest acceptable delivery instant (UTC)
      - name: time_window_end
        type: datetime
        source: input
        description: Latest acceptable delivery instant (UTC)
      - name: status
        type: enum
        source: computed
        description: Current lifecycle state of the parcel
        constraints: values [INDUCTED, IN_TRANSIT_HUB, SORTED, ON_VEHICLE, OUT_FOR_DELIVERY, DELIVERED, EXCEPTION, RETURNED_TO_SENDER]
        default: INDUCTED
      - name: redelivery_attempts
        type: integer
        source: computed
        description: Count of failed delivery attempts that triggered a reattempt schedule
        default: 0
      - name: quoted_fee
        type: number
        source: computed
        description: Provisional shipping fee at induction (forward-looking estimate)
        default: 0.00
      - name: final_fee
        type: number
        source: computed
        description: Definitive fee after all attempts, surcharges and redelivery costs are tallied
        default: null
      - name: last_attempt_outcome
        type: enum
        source: computed
        description: Outcome of the most recent delivery attempt; null until first attempt
        constraints: values [NONE, DELIVERED_SIGNED, DRIVER_RELEASED, NO_ONE_HOME, REFUSED, ADDRESS_INVALID, HAZMAT_BLOCKED]
        default: NONE

  - name: Route
    parent: TransitCenter
    common_fields: true
    fields:
      - name: center_id
        type: string
        source: input
        description: FK to originating TransitCenter
      - name: driver_id
        type: string
        source: input
        description: FK to assigned Driver
      - name: planned_date
        type: string
        source: input
        description: Calendar date (YYYY-MM-DD) of the route in the center's local tz
      - name: status
        type: enum
        source: computed
        description: Route lifecycle state
        constraints: values [PLANNED, DISPATCHED, IN_PROGRESS, CLOSED, CANCELLED]
        default: PLANNED
      - name: total_distance_km
        type: number
        source: computed
        description: Sum of leg distances after sequencing optimization
        default: 0.00
      - name: stop_count
        type: integer
        source: computed
        description: Number of RouteStop rows attached to this route
        default: 0
      - name: hazmat_present
        type: boolean
        source: computed
        description: True if any RouteStop carries a parcel with hazmat_class != NONE
        default: false

  - name: RouteStop
    parent: Route
    common_fields: false
    fields:
      - name: route_id
        type: string
        source: input
        description: FK to parent Route
      - name: parcel_id
        type: string
        source: input
        description: FK to Parcel scheduled at this stop
      - name: sequence
        type: integer
        source: computed
        description: 1-indexed delivery order assigned by the optimizer
        constraints: unique per route_id
      - name: planned_arrival
        type: datetime
        source: computed
        description: Optimizer-computed arrival within parcel.time_window_start..end
      - name: planned_departure
        type: datetime
        source: computed
        description: planned_arrival + SERVICE_TIME_MIN minutes
      - name: status
        type: enum
        source: computed
        description: Stop lifecycle state
        constraints: values [PLANNED, ARRIVED, COMPLETED, FAILED, SKIPPED]
        default: PLANNED

  - name: DeliveryAttempt
    parent: Parcel
    common_fields: false
    fields:
      - name: parcel_id
        type: string
        source: input
        description: FK to Parcel
      - name: route_stop_id
        type: string
        source: input
        description: FK to RouteStop that produced this attempt
      - name: driver_id
        type: string
        source: input
        description: FK to Driver who attempted
      - name: attempted_at
        type: datetime
        source: system
        description: Server-stamped instant of the attempt
      - name: outcome
        type: enum
        source: input
        description: How the attempt resolved
        constraints: values [DELIVERED_SIGNED, DRIVER_RELEASED, NO_ONE_HOME, REFUSED, ADDRESS_INVALID, HAZMAT_BLOCKED]
      - name: signature_blob_ref
        type: string
        source: input
        description: Opaque reference to a signature capture artifact; required when outcome=DELIVERED_SIGNED
        default: null
      - name: release_location
        type: string
        source: input
        description: Free-text drop spot (e.g., "front porch"); required when outcome=DRIVER_RELEASED
        default: null

  - name: Appointment
    parent: Parcel
    common_fields: true
    fields:
      - name: parcel_id
        type: string
        source: input
        description: FK to Parcel under appointment
      - name: requested_window_start
        type: datetime
        source: input
        description: New earliest delivery time requested by customer
      - name: requested_window_end
        type: datetime
        source: input
        description: New latest delivery time requested by customer
      - name: status
        type: enum
        source: computed
        description: Appointment lifecycle state
        constraints: values [PENDING, ACCEPTED, REJECTED, SUPERSEDED]
        default: PENDING
      - name: fee_charged
        type: number
        source: computed
        description: APPOINTMENT_CHANGE_FEE if accepted; 0 otherwise
        default: 0.00

  - name: Clock
    parent: null
    common_fields: false
    fields:
      - name: now
        type: datetime
        source: system
        description: Server's logical current time; advanced only via /_clock/advance for tests

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:
  - entity: Parcel
    initial_state: INDUCTED
    terminal_states: [DELIVERED, RETURNED_TO_SENDER]
    transitions:
      - from: INDUCTED
        to: IN_TRANSIT_HUB
        trigger: "POST /parcels/{id}/induct-to-hub"
        actor: SortingHubOperator
        preconditions:
          - "Parcel.hazmat_class != NONE implies origin_center.hazmat_certified == true"
          - "Parcel.weight_kg <= 70.0"
        side_effects:
          - "Increment TransitCenter.parcels_on_belt for origin_center_id"
          - "Recompute Parcel.quoted_fee using shipping_fee_quote (forward_looking)"
      - from: IN_TRANSIT_HUB
        to: SORTED
        trigger: "POST /parcels/{id}/sort"
        actor: SortingHubOperator
        preconditions:
          - "Destination postal prefix (first 3 digits) is in origin_center.serviced_postal_prefixes"
          - "If Parcel.hazmat_class != NONE then origin_center.hazmat_certified == true"
        side_effects:
          - "Decrement TransitCenter.parcels_on_belt"
      - from: SORTED
        to: ON_VEHICLE
        trigger: "POST /routes/{route_id}/stops (assigning parcel to a stop)"
        actor: Dispatcher
        preconditions:
          - "Parent Route.status == PLANNED"
          - "If Parcel.hazmat_class != NONE then assigned Driver.hazmat_endorsement == true"
        side_effects:
          - "Create RouteStop with sequence appended to route"
          - "Increment Route.stop_count; if hazmat parcel, set Route.hazmat_present=true"
          - "Recompute Route.total_distance_km via route_distance_total (constraint_propagation)"
      - from: ON_VEHICLE
        to: OUT_FOR_DELIVERY
        trigger: "POST /routes/{route_id}/dispatch"
        actor: Dispatcher
        preconditions:
          - "Route.status == PLANNED"
          - "Route.stop_count >= 1"
          - "If Route.hazmat_present == true then assigned Driver.hazmat_endorsement == true"
        side_effects:
          - "Route.status -> DISPATCHED then IN_PROGRESS atomically"
          - "Driver.status -> ON_ROUTE"
          - "All parcels on the route advance ON_VEHICLE -> OUT_FOR_DELIVERY"
      - from: OUT_FOR_DELIVERY
        to: DELIVERED
        trigger: "POST /parcels/{id}/attempts (outcome in {DELIVERED_SIGNED, DRIVER_RELEASED})"
        actor: Driver
        preconditions:
          - "Clock.now within [time_window_start, time_window_end] inclusive on both ends"
          - "If outcome=DELIVERED_SIGNED then signature_blob_ref is provided"
          - "If outcome=DRIVER_RELEASED then signature_required=false AND Customer.driver_release_authorized=true AND Parcel.hazmat_class==NONE"
        side_effects:
          - "Create DeliveryAttempt row; set Parcel.last_attempt_outcome"
          - "RouteStop.status -> COMPLETED"
          - "Recompute Parcel.final_fee via shipping_fee_final (chronological)"
      - from: OUT_FOR_DELIVERY
        to: EXCEPTION
        trigger: "POST /parcels/{id}/attempts (outcome in {NO_ONE_HOME, REFUSED, ADDRESS_INVALID, HAZMAT_BLOCKED})"
        actor: Driver
        preconditions:
          - "Outcome value is one of the failure outcomes above"
        side_effects:
          - "Create DeliveryAttempt row; set Parcel.last_attempt_outcome"
          - "RouteStop.status -> FAILED"
          - "Increment Parcel.redelivery_attempts"
      - from: EXCEPTION
        to: SORTED
        trigger: "POST /parcels/{id}/reattempt"
        actor: Dispatcher
        preconditions:
          - "Parcel.redelivery_attempts < MAX_REDELIVERY_ATTEMPTS (3)"
          - "Customer.redelivery_attempts_used_30d < CUSTOMER_REDELIVERY_CAP_30D (10)"
          - "last_attempt_outcome != ADDRESS_INVALID (address invalid blocks reattempt)"
        side_effects:
          - "Parcel returns to SORTED queue at origin_center"
          - "If Appointment exists in PENDING, supersede it to SUPERSEDED"
      - from: EXCEPTION
        to: RETURNED_TO_SENDER
        trigger: "POST /parcels/{id}/return-to-sender"
        actor: Dispatcher
        preconditions:
          - "Parcel.redelivery_attempts >= MAX_REDELIVERY_ATTEMPTS (3) OR last_attempt_outcome == ADDRESS_INVALID"
        side_effects:
          - "Recompute Parcel.final_fee via shipping_fee_final (chronological), including return surcharge"
          - "Refund declared_value insurance per business rules (out of scope for benchmark)"

  - entity: Route
    initial_state: PLANNED
    terminal_states: [CLOSED, CANCELLED]
    transitions:
      - from: PLANNED
        to: DISPATCHED
        trigger: "POST /routes/{route_id}/dispatch"
        actor: Dispatcher
        preconditions:
          - "Route.stop_count >= 1"
          - "Driver.status == ON_DUTY"
          - "If Route.hazmat_present == true then Driver.hazmat_endorsement == true"
        side_effects:
          - "Auto-advance Route.status DISPATCHED -> IN_PROGRESS atomically"
          - "Cascade: all parcels in ON_VEHICLE on this route advance to OUT_FOR_DELIVERY"
          - "Driver.status -> ON_ROUTE"
      - from: DISPATCHED
        to: IN_PROGRESS
        trigger: "system auto-transition immediately after dispatch"
        actor: system
        preconditions: []
        side_effects: []
      - from: IN_PROGRESS
        to: CLOSED
        trigger: "POST /routes/{route_id}/close"
        actor: Driver
        preconditions:
          - "Every RouteStop is in COMPLETED, FAILED or SKIPPED"
        side_effects:
          - "Driver.status -> RETURNED"
          - "All parcels still in OUT_FOR_DELIVERY transition to EXCEPTION (treated as NO_ONE_HOME)"
      - from: PLANNED
        to: CANCELLED
        trigger: "POST /routes/{route_id}/cancel"
        actor: Dispatcher
        preconditions:
          - "Route has not been dispatched"
        side_effects:
          - "All parcels in ON_VEHICLE on this route revert to SORTED"
          - "All RouteStop rows are deleted (cascade)"
          - "Route.hazmat_present recalculated to false"

  - entity: Appointment
    initial_state: PENDING
    terminal_states: [ACCEPTED, REJECTED, SUPERSEDED]
    transitions:
      - from: PENDING
        to: ACCEPTED
        trigger: "POST /appointments/{id}/accept"
        actor: Dispatcher
        preconditions:
          - "Parent Parcel.status in {SORTED, ON_VEHICLE, OUT_FOR_DELIVERY, EXCEPTION}"
          - "requested_window_start < requested_window_end"
          - "Window is at least MIN_APPT_WINDOW_HOURS (2) long"
        side_effects:
          - "Parcel.time_window_start and time_window_end overwritten to the new window"
          - "Appointment.fee_charged set to APPOINTMENT_CHANGE_FEE; reflected in shipping_fee_final"
          - "If Parcel is currently on a Route in PLANNED state, the RouteStop's planned_arrival is recomputed; sequence may change"
      - from: PENDING
        to: REJECTED
        trigger: "POST /appointments/{id}/reject"
        actor: Dispatcher
        preconditions:
          - "Window cannot be honored (parent Parcel already DELIVERED or RETURNED_TO_SENDER, or window overlaps a CLOSED route's date)"
        side_effects:
          - "Appointment.fee_charged remains 0.00"
      - from: PENDING
        to: SUPERSEDED
        trigger: "system auto-transition when Parcel reattempt occurs (EXCEPTION -> SORTED) or when customer files a new Appointment"
        actor: system
        preconditions:
          - "A new Appointment was created for the same parcel_id, OR Parcel re-entered SORTED"
        side_effects: []

  - entity: Driver
    initial_state: OFF_DUTY
    terminal_states: []
    transitions:
      - from: OFF_DUTY
        to: ON_DUTY
        trigger: "POST /drivers/{id}/check-in"
        actor: Driver
        preconditions: []
        side_effects: []
      - from: ON_DUTY
        to: ON_ROUTE
        trigger: "system on Route dispatch"
        actor: system
        preconditions: []
        side_effects: []
      - from: ON_ROUTE
        to: RETURNED
        trigger: "POST /routes/{route_id}/close"
        actor: Driver
        preconditions: []
        side_effects: []
      - from: RETURNED
        to: OFF_DUTY
        trigger: "POST /drivers/{id}/check-out"
        actor: Driver
        preconditions: []
        side_effects: []

# -----------------------------------------------------------------------------
# §1.2.1 Concurrency Rules
# -----------------------------------------------------------------------------
concurrency_rules:
  - scenario: "Two dispatchers assign the same parcel to two different routes simultaneously"
    guarantee: "At most one RouteStop exists per parcel while parcel is in ON_VEHICLE; second assignment rejected"
    error_id: ERR_PARCEL_ALREADY_ON_ROUTE
    http_status: 409
    serialization: "First-writer-wins on RouteStop.parcel_id uniqueness"

  - scenario: "Driver records DELIVERED_SIGNED while customer files an appointment change for the same parcel"
    guarantee: "Exactly one operation succeeds; loser is rejected"
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on Parcel.status"

  - scenario: "Two drivers try to close the same Route concurrently"
    guarantee: "Exactly one close succeeds; second is rejected because the route is already CLOSED"
    error_id: ERR_INVALID_STATE
    http_status: 409
    serialization: "First-writer-wins on Route.status"

  - scenario: "Cancel-route and add-stop arrive simultaneously on a PLANNED route"
    guarantee: "At most one succeeds; if cancel wins, add-stop sees a CANCELLED route"
    error_id: ERR_ROUTE_NOT_PLANNED
    http_status: 409
    serialization: "First-writer-wins on Route.status"

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:
  - name: shipping_fee_quote
    trigger: "On Parcel induction (INDUCTED -> IN_TRANSIT_HUB) or on PATCH /parcels/{id} that mutates weight/destination/hazmat/signature flags while still in INDUCTED or IN_TRANSIT_HUB"
    algorithm: forward_looking
    formula: |
      base_fee = BASE_FEE
      weight_fee = ceil(max(0, weight_kg - WEIGHT_FREE_KG)) * WEIGHT_PER_KG_FEE
      distance_km = haversine(origin_center.lat/lon, destination_address.lat/lon)  # use stored coordinates
      distance_fee = ceil(distance_km / DISTANCE_BUCKET_KM) * DISTANCE_BUCKET_FEE
      hazmat_fee = HAZMAT_SURCHARGE if hazmat_class != NONE else 0
      signature_fee = SIGNATURE_SURCHARGE if signature_required else 0
      residential_fee = RESIDENTIAL_SURCHARGE if destination.residential else 0
      raw = base_fee + weight_fee + distance_fee + hazmat_fee + signature_fee + residential_fee
      quoted_fee = round_half_up(raw, 2)
      # NOTE: this is forward-looking — it presumes a single successful first-attempt delivery,
      # zero redelivery_attempts, and ignores any future Appointment.fee_charged.
    input_set: "Parcel and its destination Address and origin TransitCenter at the moment of quote"
    constants:
      BASE_FEE: 5.00
      WEIGHT_FREE_KG: 1.0
      WEIGHT_PER_KG_FEE: 0.75
      DISTANCE_BUCKET_KM: 25.0
      DISTANCE_BUCKET_FEE: 1.50
      HAZMAT_SURCHARGE: 12.00
      SIGNATURE_SURCHARGE: 2.50
      RESIDENTIAL_SURCHARGE: 1.00
    precision: "2 decimal places, round_half_up; applied once at the end after summation"
    variants:
      - name: hazmat_quote
        when: "Parcel.hazmat_class != NONE"
        difference: "Adds HAZMAT_SURCHARGE; downstream sorting is gated by hub.hazmat_certified"
      - name: signature_quote
        when: "Parcel.signature_required == true"
        difference: "Adds SIGNATURE_SURCHARGE and disables driver-release as a valid delivery outcome"

  - name: shipping_fee_final
    trigger: "On terminal Parcel transition to DELIVERED or RETURNED_TO_SENDER"
    algorithm: chronological
    formula: |
      # Process DeliveryAttempt rows in attempted_at ascending order.
      total = quoted_fee
      for attempt in attempts ordered by attempted_at ASC:
        if attempt.outcome in {NO_ONE_HOME, REFUSED}:
          total += REATTEMPT_FEE
        elif attempt.outcome == ADDRESS_INVALID:
          total += ADDRESS_CORRECTION_FEE
          break  # no further attempts allowed
      # Apply accepted appointment changes (each ACCEPTED Appointment charges once):
      total += APPOINTMENT_CHANGE_FEE * count(Appointment where parcel_id=this and status=ACCEPTED)
      # Apply return-to-sender surcharge if terminal state is RETURNED_TO_SENDER:
      if parcel.status == RETURNED_TO_SENDER:
        total += RETURN_TO_SENDER_FEE
      final_fee = round_half_up(total, 2)
      # Order matters: redelivery surcharges accrue chronologically, THEN appointment fees,
      # THEN return surcharge. Reordering produces drift when a customer files an appointment
      # after a failed attempt then the parcel is still returned.
    input_set: "All DeliveryAttempt rows for parcel + all ACCEPTED Appointments + parcel.status at terminalization"
    constants:
      REATTEMPT_FEE: 3.00
      ADDRESS_CORRECTION_FEE: 8.00
      APPOINTMENT_CHANGE_FEE: 4.50
      RETURN_TO_SENDER_FEE: 7.00
    precision: "2 decimal places, round_half_up; applied once at the end"
    variants:
      - name: success_path_final
        when: "terminal state == DELIVERED"
        difference: "Excludes RETURN_TO_SENDER_FEE"
      - name: return_path_final
        when: "terminal state == RETURNED_TO_SENDER"
        difference: "Includes RETURN_TO_SENDER_FEE and stops appending after ADDRESS_INVALID"

  - name: route_distance_total
    trigger: "On RouteStop create/delete or sequence re-numbering"
    algorithm: constraint_propagation
    formula: |
      # Iterate stops in sequence ASC; sum haversine(stop[i-1], stop[i]).
      # Stop 0 is the origin TransitCenter (lat/lon stored on the center).
      total_km = 0.0
      prev = (origin_center.lat, origin_center.lon)
      for stop in stops ordered by sequence ASC:
        addr = stop.parcel.destination_address
        leg = haversine(prev, (addr.latitude, addr.longitude))
        total_km += leg
        prev = (addr.latitude, addr.longitude)
      # No return-to-hub leg in total_distance_km.
      route.total_distance_km = round_half_up(total_km, 2)
    input_set: "All RouteStop rows of this route plus origin center coordinates"
    constants:
      EARTH_RADIUS_KM: 6371.0
    precision: "2 decimal places, round_half_up"

  - name: planned_arrival_assignment
    trigger: "On RouteStop create or route re-sequence"
    algorithm: interval_merge
    formula: |
      # Greedy time assignment respecting each parcel's time_window:
      cursor = route.planned_date at 08:00 local of origin_center
      for stop in stops ordered by sequence ASC:
        leg_km = haversine(prev, addr)
        travel_min = ceil((leg_km / AVG_SPEED_KMH) * 60)
        cursor = cursor + travel_min minutes
        if cursor < parcel.time_window_start:
          cursor = parcel.time_window_start   # wait
        if cursor > parcel.time_window_end:
          raise ERR_TIME_WINDOW_INFEASIBLE
        stop.planned_arrival = cursor
        cursor = cursor + SERVICE_TIME_MIN minutes
        stop.planned_departure = cursor
    input_set: "All RouteStop rows + their parcel time windows + origin center coords"
    constants:
      AVG_SPEED_KMH: 40.0
      SERVICE_TIME_MIN: 6
      DEPART_HOUR_LOCAL: 8
    precision: "Minute granularity; arrival truncated to the start of the minute"

  - name: customer_redelivery_rolling_count
    trigger: "Read on appointment accept and on reattempt; updated on every EXCEPTION -> SORTED transition"
    algorithm: aggregation
    formula: |
      # Count DeliveryAttempt rows belonging to parcels owned by this customer
      # whose outcome is NO_ONE_HOME or REFUSED and attempted_at >= now - 30 days.
      # Used to enforce CUSTOMER_REDELIVERY_CAP_30D.
      redelivery_attempts_used_30d = count(DeliveryAttempt a
                                            join Parcel p on a.parcel_id=p.id
                                            where p.customer_id=this.id
                                              and a.outcome in {NO_ONE_HOME, REFUSED}
                                              and a.attempted_at >= now - interval 30 days)
    input_set: "DeliveryAttempt rows joined to Parcel filtered by customer_id"
    constants:
      CUSTOMER_REDELIVERY_CAP_30D: 10
    precision: "Integer count; window is rolling 30 days [now-30d, now] half-open at the lower bound (>= now-30d)"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:
  - priority: 1
    category: auth
    check: "X-User-Role and X-User-ID headers are present and well-formed"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: all

  - priority: 2
    category: auth
    check: "X-User-Role is one of {Customer, Driver, Dispatcher, SortingHubOperator, ComplianceOfficer} and permitted for this endpoint per §1.7"
    error_id: ERR_FORBIDDEN
    http_status: 403
    applies_to: all

  - priority: 3
    category: existence
    check: "Every path id resolves to a row (validated left-to-right)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: all

  - priority: 4
    category: existence
    check: "Foreign-key fields in request bodies resolve to existing rows"
    error_id: ERR_REFERENCE_NOT_FOUND
    http_status: 422
    applies_to: "all mutation endpoints"

  - priority: 5
    category: state
    check: "Target resource is in a state that admits the requested operation per §1.2"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all transition endpoints"

  - priority: 6
    category: business_safety
    check: "Hazmat parcel may only be sorted at a hazmat_certified TransitCenter"
    error_id: ERR_HAZMAT_HUB_NOT_CERTIFIED
    http_status: 422
    applies_to: "POST /parcels/{id}/induct-to-hub, POST /parcels/{id}/sort"

  - priority: 7
    category: business_safety
    check: "Hazmat parcel may only be assigned to a Driver with hazmat_endorsement=true"
    error_id: ERR_DRIVER_NO_HAZMAT_ENDORSEMENT
    http_status: 422
    applies_to: "POST /routes/{route_id}/stops, POST /routes/{route_id}/dispatch"

  - priority: 8
    category: business_safety
    check: "Driver-release outcome forbidden when signature_required=true OR hazmat_class != NONE OR customer.driver_release_authorized=false"
    error_id: ERR_DRIVER_RELEASE_NOT_AUTHORIZED
    http_status: 422
    applies_to: "POST /parcels/{id}/attempts"

  - priority: 9
    category: business_safety
    check: "Signature outcome requires signature_blob_ref to be present and non-empty"
    error_id: ERR_SIGNATURE_MISSING
    http_status: 422
    applies_to: "POST /parcels/{id}/attempts"

  - priority: 10
    category: business_referential
    check: "Destination postal prefix matches origin_center.serviced_postal_prefixes on sort"
    error_id: ERR_HUB_NOT_SERVICING_POSTAL
    http_status: 422
    applies_to: "POST /parcels/{id}/sort"

  - priority: 11
    category: business_temporal
    check: "Delivery attempt's Clock.now lies within [time_window_start, time_window_end] inclusive"
    error_id: ERR_OUTSIDE_TIME_WINDOW
    http_status: 422
    applies_to: "POST /parcels/{id}/attempts"

  - priority: 12
    category: business_temporal
    check: "Appointment requested window is feasible: window length >= MIN_APPT_WINDOW_HOURS (2) and start < end"
    error_id: ERR_APPOINTMENT_WINDOW_INVALID
    http_status: 422
    applies_to: "POST /appointments, POST /appointments/{id}/accept"

  - priority: 13
    category: business_constraint
    check: "RouteStop time-window infeasibility: planned_arrival exceeds parcel.time_window_end during planned_arrival_assignment"
    error_id: ERR_TIME_WINDOW_INFEASIBLE
    http_status: 422
    applies_to: "POST /routes/{route_id}/stops"

  - priority: 14
    category: business_constraint
    check: "Parcel may appear on at most one RouteStop while parcel.status==ON_VEHICLE (uniqueness on parcel_id)"
    error_id: ERR_PARCEL_ALREADY_ON_ROUTE
    http_status: 409
    applies_to: "POST /routes/{route_id}/stops"

  - priority: 15
    category: business_constraint
    check: "Route must be in PLANNED status to add or remove stops or to cancel"
    error_id: ERR_ROUTE_NOT_PLANNED
    http_status: 409
    applies_to: "POST /routes/{route_id}/stops, DELETE /routes/{route_id}/stops/{stop_id}, POST /routes/{route_id}/cancel"

  - priority: 16
    category: business_constraint
    check: "Parcel.redelivery_attempts < MAX_REDELIVERY_ATTEMPTS (3) when reattempting"
    error_id: ERR_REDELIVERY_LIMIT_EXCEEDED
    http_status: 422
    applies_to: "POST /parcels/{id}/reattempt"

  - priority: 17
    category: business_constraint
    check: "Customer.redelivery_attempts_used_30d < CUSTOMER_REDELIVERY_CAP_30D (10) at the moment of reattempt"
    error_id: ERR_CUSTOMER_REDELIVERY_CAP_REACHED
    http_status: 422
    applies_to: "POST /parcels/{id}/reattempt"

  - priority: 18
    category: business_fiscal
    check: "Parcel.weight_kg must be > 0 and <= 70.0 (boundary precision: 70.0 ok, 70.01 rejected)"
    error_id: ERR_PARCEL_WEIGHT_OUT_OF_RANGE
    http_status: 422
    applies_to: "POST /parcels, PATCH /parcels/{id}"

  - priority: 19
    category: business_fiscal
    check: "Parcel.declared_value must be >= 0 and <= 50000.00"
    error_id: ERR_DECLARED_VALUE_OUT_OF_RANGE
    http_status: 422
    applies_to: "POST /parcels, PATCH /parcels/{id}"

  - priority: 20
    category: business_constraint
    check: "OCC: request version (when supplied) equals current resource version"
    error_id: ERR_VERSION_CONFLICT
    http_status: 409
    applies_to: "all PATCH endpoints"

  - priority: 21
    category: business_temporal
    check: "Clock advance must be forward-only (to_iso8601 >= current Clock.now)"
    error_id: ERR_CLOCK_BACKWARDS
    http_status: 422
    applies_to: "POST /_clock/advance"

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:
  # -------- Customers + addresses ---------
  - method: POST
    path: /customers
    description: "Create a customer record"
    roles: [Dispatcher]
    code: 201
    input: [email, full_name, phone, "driver_release_authorized?"]
    output: Customer
    side_effects: []

  - method: GET
    path: /customers/{id}
    description: "Read a customer (includes redelivery_attempts_used_30d)"
    roles: [Customer, Dispatcher]
    code: 200
    input: []
    output: Customer
    side_effects: ["Recompute customer_redelivery_rolling_count on read"]

  - method: PATCH
    path: /customers/{id}
    description: "Update customer profile or toggle driver_release_authorized"
    roles: [Customer, Dispatcher]
    code: 200
    input: ["full_name?", "phone?", "driver_release_authorized?", "default_address_id?", "version?"]
    output: Customer
    side_effects: []

  - method: POST
    path: /customers/{id}/addresses
    description: "Add a delivery address to a customer"
    roles: [Customer, Dispatcher]
    code: 201
    input: [line1, city, postal_code, latitude, longitude, "residential?"]
    output: Address
    side_effects: []

  # -------- Transit centers ---------
  - method: POST
    path: /transit-centers
    description: "Register a TransitCenter"
    roles: [Dispatcher]
    code: 201
    input: [code, serviced_postal_prefixes, "hazmat_certified?"]
    output: TransitCenter
    side_effects: []

  - method: GET
    path: /transit-centers/{id}
    description: "Read a TransitCenter including parcels_on_belt counter"
    roles: [Dispatcher, SortingHubOperator]
    code: 200
    input: []
    output: TransitCenter
    side_effects: []

  # -------- Drivers ---------
  - method: POST
    path: /drivers
    description: "Create a Driver"
    roles: [Dispatcher]
    code: 201
    input: [badge_id, home_center_id, "hazmat_endorsement?"]
    output: Driver
    side_effects: []

  - method: POST
    path: /drivers/{id}/check-in
    description: "Driver goes ON_DUTY"
    roles: [Driver, Dispatcher]
    code: 200
    input: []
    output: Driver
    side_effects: ["Driver.status -> ON_DUTY"]

  - method: POST
    path: /drivers/{id}/check-out
    description: "Driver returns to OFF_DUTY"
    roles: [Driver, Dispatcher]
    code: 200
    input: []
    output: Driver
    side_effects: ["Driver.status -> OFF_DUTY"]

  # -------- Parcels ---------
  - method: POST
    path: /parcels
    description: "Induct a parcel into the network (status INDUCTED)"
    roles: [Dispatcher, SortingHubOperator]
    code: 201
    input: [customer_id, "destination_address_id?", origin_center_id, weight_kg, declared_value, "signature_required?", "hazmat_class?", time_window_start, time_window_end]
    output: Parcel
    side_effects: ["System mints tracking_number", "shipping_fee_quote runs"]

  - method: GET
    path: /parcels/{id}
    description: "Read parcel by id"
    roles: [Customer, Dispatcher, Driver, SortingHubOperator]
    code: 200
    input: []
    output: Parcel
    side_effects: []

  - method: GET
    path: /parcels
    description: "List parcels with filters status/customer_id/origin_center_id/hazmat_class"
    roles: [Dispatcher, SortingHubOperator]
    code: 200
    input: ["status?", "customer_id?", "origin_center_id?", "hazmat_class?", "limit?", "offset?"]
    output: "Parcel[]"
    side_effects: []

  - method: PATCH
    path: /parcels/{id}
    description: "Update parcel fields while in INDUCTED or IN_TRANSIT_HUB"
    roles: [Dispatcher, SortingHubOperator]
    code: 200
    input: ["weight_kg?", "declared_value?", "signature_required?", "hazmat_class?", "destination_address_id?", "time_window_start?", "time_window_end?", "version?"]
    output: Parcel
    side_effects: ["Re-run shipping_fee_quote (recompute Parcel.quoted_fee)"]

  - method: POST
    path: /parcels/{id}/induct-to-hub
    description: "Transition INDUCTED -> IN_TRANSIT_HUB"
    roles: [SortingHubOperator]
    code: 200
    input: []
    output: Parcel
    side_effects: ["Increment origin_center.parcels_on_belt", "Re-run shipping_fee_quote"]

  - method: POST
    path: /parcels/{id}/sort
    description: "Transition IN_TRANSIT_HUB -> SORTED"
    roles: [SortingHubOperator]
    code: 200
    input: []
    output: Parcel
    side_effects: ["Decrement origin_center.parcels_on_belt"]

  - method: POST
    path: /parcels/{id}/attempts
    description: "Record a delivery attempt; advances parcel to DELIVERED or EXCEPTION"
    roles: [Driver]
    code: 201
    input: [route_stop_id, outcome, "signature_blob_ref?", "release_location?"]
    output: DeliveryAttempt
    side_effects: ["RouteStop.status updated", "Parcel.last_attempt_outcome set", "Parcel.redelivery_attempts incremented on failure", "On terminal success, shipping_fee_final runs"]

  - method: POST
    path: /parcels/{id}/reattempt
    description: "Transition EXCEPTION -> SORTED"
    roles: [Dispatcher]
    code: 200
    input: []
    output: Parcel
    side_effects: ["Parcel re-enters SORTED queue", "Any PENDING Appointment supersedes"]

  - method: POST
    path: /parcels/{id}/return-to-sender
    description: "Transition EXCEPTION -> RETURNED_TO_SENDER"
    roles: [Dispatcher]
    code: 200
    input: []
    output: Parcel
    side_effects: ["shipping_fee_final runs with return surcharge"]

  # -------- Routes ---------
  - method: POST
    path: /routes
    description: "Create a Route at a TransitCenter for a Driver and date"
    roles: [Dispatcher]
    code: 201
    input: [center_id, driver_id, planned_date]
    output: Route
    side_effects: []

  - method: GET
    path: /routes/{id}
    description: "Read a Route incl. computed total_distance_km, stop_count, hazmat_present"
    roles: [Dispatcher, Driver]
    code: 200
    input: []
    output: Route
    side_effects: []

  - method: POST
    path: /routes/{id}/stops
    description: "Append a parcel to a Route as a RouteStop"
    roles: [Dispatcher]
    code: 201
    input: [parcel_id]
    output: RouteStop
    side_effects: ["Parcel SORTED -> ON_VEHICLE", "route_distance_total recomputed", "planned_arrival_assignment recomputed"]

  - method: DELETE
    path: /routes/{route_id}/stops/{stop_id}
    description: "Remove a stop while Route.status==PLANNED"
    roles: [Dispatcher]
    code: 204
    input: []
    output: null
    side_effects: ["Parcel reverts ON_VEHICLE -> SORTED", "route_distance_total recomputed", "Route.hazmat_present recomputed"]

  - method: POST
    path: /routes/{id}/dispatch
    description: "Transition Route to DISPATCHED -> IN_PROGRESS atomically"
    roles: [Dispatcher]
    code: 200
    input: []
    output: Route
    side_effects: ["Driver.status -> ON_ROUTE", "All parcels ON_VEHICLE -> OUT_FOR_DELIVERY"]

  - method: POST
    path: /routes/{id}/close
    description: "Driver closes the route at end of shift"
    roles: [Driver]
    code: 200
    input: []
    output: Route
    side_effects: ["Driver.status -> RETURNED", "Any remaining OUT_FOR_DELIVERY parcels advance to EXCEPTION"]

  - method: POST
    path: /routes/{id}/cancel
    description: "Cancel a PLANNED route"
    roles: [Dispatcher]
    code: 200
    input: []
    output: Route
    side_effects: ["All RouteStops deleted; parcels revert ON_VEHICLE -> SORTED"]

  # -------- Appointments ---------
  - method: POST
    path: /appointments
    description: "Customer requests a new delivery window for a parcel"
    roles: [Customer, Dispatcher]
    code: 201
    input: [parcel_id, requested_window_start, requested_window_end]
    output: Appointment
    side_effects: ["Any previously PENDING Appointment for same parcel transitions to SUPERSEDED"]

  - method: POST
    path: /appointments/{id}/accept
    description: "Dispatcher accepts an appointment"
    roles: [Dispatcher]
    code: 200
    input: []
    output: Appointment
    side_effects: ["Parcel.time_window_* overwritten", "If parcel on PLANNED route, planned_arrival_assignment re-runs", "fee_charged set to APPOINTMENT_CHANGE_FEE"]

  - method: POST
    path: /appointments/{id}/reject
    description: "Dispatcher rejects an appointment"
    roles: [Dispatcher]
    code: 200
    input: []
    output: Appointment
    side_effects: []

  # -------- Test-only clock ---------
  - method: POST
    path: /_clock/advance
    description: "Advance the server's logical clock; used by tests to traverse time windows"
    roles: [Dispatcher, Driver, Customer, SortingHubOperator, ComplianceOfficer]
    code: 200
    input: [to_iso8601]
    output: Clock
    side_effects: ["Clock.now set to the supplied instant; only forward motion allowed"]

# =============================================================================
# §1.6 Error Code Catalog
# =============================================================================
errors:
  - id: ERR_UNAUTHENTICATED
    http: 401
    condition: "Missing or malformed X-User-Role / X-User-ID headers"
  - id: ERR_FORBIDDEN
    http: 403
    condition: "Role not permitted to call this endpoint or to act on this resource"
  - id: ERR_NOT_FOUND
    http: 404
    condition: "Resource referenced in URL does not exist"
  - id: ERR_REFERENCE_NOT_FOUND
    http: 422
    condition: "FK field in body refers to a non-existent row"
  - id: ERR_INVALID_STATE
    http: 409
    condition: "Operation not allowed in resource's current state"
  - id: ERR_VERSION_CONFLICT
    http: 409
    condition: "Submitted version does not match current resource version"
  - id: ERR_HAZMAT_HUB_NOT_CERTIFIED
    http: 422
    condition: "Hazmat parcel routed through a hub with hazmat_certified=false"
  - id: ERR_DRIVER_NO_HAZMAT_ENDORSEMENT
    http: 422
    condition: "Hazmat parcel attempted to be assigned to a driver lacking hazmat_endorsement"
  - id: ERR_DRIVER_RELEASE_NOT_AUTHORIZED
    http: 422
    condition: "Driver-release outcome attempted while signature_required, hazmat_class!=NONE, or customer.driver_release_authorized=false"
  - id: ERR_SIGNATURE_MISSING
    http: 422
    condition: "DELIVERED_SIGNED outcome submitted without signature_blob_ref"
  - id: ERR_OUTSIDE_TIME_WINDOW
    http: 422
    condition: "Delivery attempt occurs outside parcel.time_window_start..end"
  - id: ERR_APPOINTMENT_WINDOW_INVALID
    http: 422
    condition: "Appointment window length < 2h or start >= end"
  - id: ERR_TIME_WINDOW_INFEASIBLE
    http: 422
    condition: "Adding a stop pushes planned_arrival beyond parcel.time_window_end"
  - id: ERR_PARCEL_ALREADY_ON_ROUTE
    http: 409
    condition: "Parcel already linked to a RouteStop while in ON_VEHICLE"
  - id: ERR_ROUTE_NOT_PLANNED
    http: 409
    condition: "Stop add/remove or cancel attempted on a Route whose status != PLANNED"
  - id: ERR_HUB_NOT_SERVICING_POSTAL
    http: 422
    condition: "Destination postal prefix not in TransitCenter.serviced_postal_prefixes during sort"
  - id: ERR_REDELIVERY_LIMIT_EXCEEDED
    http: 422
    condition: "Parcel.redelivery_attempts already at MAX_REDELIVERY_ATTEMPTS (3)"
  - id: ERR_CUSTOMER_REDELIVERY_CAP_REACHED
    http: 422
    condition: "Customer.redelivery_attempts_used_30d already at CUSTOMER_REDELIVERY_CAP_30D (10)"
  - id: ERR_PARCEL_WEIGHT_OUT_OF_RANGE
    http: 422
    condition: "Parcel.weight_kg outside (0, 70.0]"
  - id: ERR_DECLARED_VALUE_OUT_OF_RANGE
    http: 422
    condition: "Parcel.declared_value outside [0, 50000]"
  - id: ERR_CLOCK_BACKWARDS
    http: 422
    condition: "POST /_clock/advance attempted with to_iso8601 earlier than current Clock.now"

# =============================================================================
# §1.7 RBAC Matrix
# =============================================================================
roles:
  - name: Customer
    description: "End recipient of parcels; can read own parcels and file appointments"
    identity: "entity_backed:Customer"
    exclusive_operations:
      - "POST /appointments (on a parcel they own)"
    shared_operations:
      - "GET /parcels/{id} (only own parcels)"
      - "GET /customers/{id} (only own record)"
      - "PATCH /customers/{id} (only own record)"
      - "POST /customers/{id}/addresses (only own record)"

  - name: Driver
    description: "Physically performs delivery attempts and route closure"
    identity: "entity_backed:Driver"
    exclusive_operations:
      - "POST /parcels/{id}/attempts"
      - "POST /routes/{id}/close"
    shared_operations:
      - "POST /drivers/{id}/check-in (own record)"
      - "POST /drivers/{id}/check-out (own record)"
      - "GET /parcels/{id} (parcels on routes assigned to self)"
      - "GET /routes/{id} (own routes)"

  - name: Dispatcher
    description: "Plans routes, assigns drivers, manages parcels, accepts/rejects appointments"
    identity: "opaque"
    exclusive_operations:
      - "POST /routes"
      - "POST /routes/{id}/stops"
      - "DELETE /routes/{route_id}/stops/{stop_id}"
      - "POST /routes/{id}/dispatch"
      - "POST /routes/{id}/cancel"
      - "POST /parcels/{id}/reattempt"
      - "POST /parcels/{id}/return-to-sender"
      - "POST /appointments/{id}/accept"
      - "POST /appointments/{id}/reject"
      - "POST /transit-centers"
      - "POST /drivers"
      - "POST /customers"
    shared_operations:
      - "POST /parcels"
      - "PATCH /parcels/{id}"
      - "GET /parcels (list with filters)"

  - name: SortingHubOperator
    description: "Operates a TransitCenter belt; inducts and sorts parcels"
    identity: "opaque"
    exclusive_operations:
      - "POST /parcels/{id}/induct-to-hub"
      - "POST /parcels/{id}/sort"
    shared_operations:
      - "POST /parcels"
      - "PATCH /parcels/{id} (while parcel in INDUCTED or IN_TRANSIT_HUB)"
      - "GET /parcels (list with filters)"

  - name: ComplianceOfficer
    description: "Audits hazmat handling and signature/driver-release exceptions; read-only on operational endpoints"
    identity: "opaque"
    exclusive_operations: []
    shared_operations:
      - "GET /parcels/{id}"
      - "GET /parcels (list)"
      - "GET /routes/{id}"
      - "GET /transit-centers/{id}"
      - "GET /customers/{id}"
