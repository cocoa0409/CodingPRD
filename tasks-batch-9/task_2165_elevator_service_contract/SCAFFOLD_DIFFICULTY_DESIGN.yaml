# =============================================================================
# §1.8 Scaffold Difficulty Design (Test Targeting Index)
# task_2165_elevator_service_contract
# Every instance grounds in SCAFFOLD.yaml §1.1-§1.7. Deleting this file changes
# no declared behavior; it only makes coverage harder to audit.
# Logical clock default before any /_clock/set_current_utc call: 2026-08-01T00:00:00Z
# =============================================================================
scaffold_difficulty_design:

  # ===========================================================================
  - rule_id: dual_variant_calc
    instances:

      - name: uptime_exclusive_vs_inclusive_diverge_on_same_car
        grounds:
          - calculations.car_uptime_percentage
          - calculations.car_uptime_percentage.variants.EXCLUSIVE
          - calculations.car_uptime_percentage.variants.INCLUSIVE
          - entities.ElevatorCar.fields.scheduled_downtime_minutes
          - endpoints[GET /elevator-program/cars/{carId}/uptime-report]
        distinguishing_aspect: |
          Instance domain is ElevatorCar AVAILABILITY: one car, one August period, one 2880-minute
          planned window and one 360-minute unplanned callback outage yield uptime_pct_exclusive
          99.14 and uptime_pct_inclusive 92.74 from identical stored rows, because EXCLUSIVE removes
          planned minutes from the denominator and INCLUSIVE does not.
        test_recipe:
          setup:
            - "One ACTIVE FULL_MAINTENANCE contract with one car C1."
            - "C1 has one REPAIR DowntimeWindow of exactly 2880 minutes inside 2026-08 (status COMPLETED after the clock passes it)."
            - "C1 has one CLEARED MALFUNCTION callback whose outage interval is exactly 360 minutes inside 2026-08."
            - "Logical clock sits at 2026-09-01T00:00:00Z so the August period is fully elapsed."
          setup_api_calls:
            - call: "POST /elevator-program/contracts"
              payload: { building_name: "Harborview Tower", building_address: "1 Harbor St", jurisdiction_code: "NY-NYC", fire_district_code: "FD-07", building_manager_user_id: "bm-1", contractor_user_id: "sc-1", scope_type: "FULL_MAINTENANCE", penalty_schedule: "SCHEDULE_A", monthly_base_fee_cents: 500000, callback_response_minutes: 60, entrapment_response_minutes: 30, term_start_date: "2026-01-01", term_end_date: "2026-12-31" }
              as: ProgramAdministrator
              as_user_id: "pa-1"
              captures: { k_id: $.data.id }
            - call: "POST /elevator-program/contracts/${k_id}/activate"
              payload: {}
              as: ProgramAdministrator
              as_user_id: "pa-1"
            - call: "POST /elevator-program/cars"
              payload: { contract_id: "${k_id}", car_code: "CAR-A", car_type: "TRACTION", capacity_lbs: 3500 }
              as: ProgramAdministrator
              as_user_id: "pa-1"
              captures: { c1_id: $.data.id }
            - call: "POST /elevator-program/downtime-windows"
              payload: { car_id: "${c1_id}", window_type: "REPAIR", window_start: "2026-08-10T08:00:00Z", window_end: "2026-08-12T08:00:00Z" }
              as: ProgramAdministrator
              as_user_id: "pa-1"
              captures: { w1_id: $.data.id }
            - call: "POST /elevator-program/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:00:00Z" }
              as: ProgramAdministrator
              as_user_id: "pa-1"
            - call: "POST /elevator-program/callbacks"
              payload: { car_id: "${c1_id}", callback_type: "MALFUNCTION", out_of_service: true }
              as: BuildingManager
              as_user_id: "bm-1"
              captures: { cb1_id: $.data.id }
            - call: "POST /elevator-program/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T15:00:00Z" }
              as: ProgramAdministrator
              as_user_id: "pa-1"
            - call: "POST /elevator-program/callbacks/${cb1_id}/arrive"
              payload: {}
              as: ServiceContractor
              as_user_id: "sc-1"
            - call: "POST /elevator-program/callbacks/${cb1_id}/clear"
              payload: { resolution_note: "door operator reset" }
              as: ServiceContractor
              as_user_id: "sc-1"
            - call: "POST /elevator-program/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdministrator
              as_user_id: "pa-1"
          trigger:
            - call: "GET /elevator-program/cars/${c1_id}/uptime-report"
              payload: { period_month: "2026-08" }
              as: BuildingManager
              as_user_id: "bm-1"
          assert:
            - "uptime_report.period_minutes == 44640"
            - "uptime_report.planned_downtime_minutes == 2880"
            - "uptime_report.unplanned_outage_minutes == 360"
            - "uptime_report.available_minutes == 41400"
            - "uptime_report.uptime_pct_exclusive == 99.14"
            - "uptime_report.uptime_pct_inclusive == 92.74"
            - "uptime_report.uptime_pct_exclusive != uptime_report.uptime_pct_inclusive"
            - "uptime_report.outage_interval_count == 2"
            - "ElevatorCar.${c1_id}.scheduled_downtime_minutes == 2880"

      - name: penalty_schedule_a_vs_b_diverge_on_identical_incident_data
        grounds:
          - calculations.penalty_assessment_amount
          - calculations.penalty_assessment_amount.variants.SCHEDULE_A
          - calculations.penalty_assessment_amount.variants.SCHEDULE_B
          - entities.ServiceContract.fields.penalty_schedule
          - entities.PenaltyAssessment.fields.amount_cents
          - endpoints[POST /elevator-program/penalties]
        distinguishing_aspect: |
          Instance domain is the ServiceContract FISCAL ledger, not car availability: two contracts
          carrying byte-identical incident data (same fee 480000, same 2880-minute planned window,
          same 360-minute breached callback, same FULL_MAINTENANCE/EXCLUSIVE uptime of 99.14) produce
          amount_cents 25000 under SCHEDULE_A and 9600 under SCHEDULE_B.
        test_recipe:
          setup:
            - "Contract KA: FULL_MAINTENANCE, SCHEDULE_A, monthly_base_fee_cents 480000, ACTIVE, one car A1."
            - "Contract KB: FULL_MAINTENANCE, SCHEDULE_B, monthly_base_fee_cents 480000, ACTIVE, one car B1."
            - "Each car has one 2880-minute REPAIR window and one CLEARED MALFUNCTION callback with response_minutes 360 (> the 60-minute SLA), so each car's EXCLUSIVE uptime is 99.14."
            - "Logical clock sits at 2026-09-01T00:00:00Z, so 2026-08 is closed."
          setup_api_calls:
            - call: "POST /elevator-program/contracts"
              payload: { building_name: "Alpha House", building_address: "2 Alpha Ave", jurisdiction_code: "NY-NYC", fire_district_code: "FD-07", building_manager_user_id: "bm-a", contractor_user_id: "sc-a", scope_type: "FULL_MAINTENANCE", penalty_schedule: "SCHEDULE_A", monthly_base_fee_cents: 480000, callback_response_minutes: 60, entrapment_response_minutes: 30, term_start_date: "2026-01-01", term_end_date: "2026-12-31" }
              as: ProgramAdministrator
              as_user_id: "pa-1"
              captures: { ka_id: $.data.id }
            - call: "POST /elevator-program/contracts/${ka_id}/activate"
              payload: {}
              as: ProgramAdministrator
              as_user_id: "pa-1"
            - call: "POST /elevator-program/cars"
              payload: { contract_id: "${ka_id}", car_code: "CAR-A1", car_type: "TRACTION", capacity_lbs: 3000 }
              as: ProgramAdministrator
              as_user_id: "pa-1"
              captures: { a1_id: $.data.id }
            - call: "POST /elevator-program/contracts"
              payload: { building_name: "Beta House", building_address: "3 Beta Ave", jurisdiction_code: "NY-NYC", fire_district_code: "FD-07", building_manager_user_id: "bm-b", contractor_user_id: "sc-b", scope_type: "FULL_MAINTENANCE", penalty_schedule: "SCHEDULE_B", monthly_base_fee_cents: 480000, callback_response_minutes: 60, entrapment_response_minutes: 30, term_start_date: "2026-01-01", term_end_date: "2026-12-31" }
              as: ProgramAdministrator
              as_user_id: "pa-1"
              captures: { kb_id: $.data.id }
            - call: "POST /elevator-program/contracts/${kb_id}/activate"
              payload: {}
              as: ProgramAdministrator
              as_user_id: "pa-1"
            - call: "POST /elevator-program/cars"
              payload: { contract_id: "${kb_id}", car_code: "CAR-B1", car_type: "TRACTION", capacity_lbs: 3000 }
              as: ProgramAdministrator
              as_user_id: "pa-1"
              captures: { b1_id: $.data.id }
            - call: "POST /elevator-program/downtime-windows"
              payload: { car_id: "${a1_id}", window_type: "REPAIR", window_start: "2026-08-10T08:00:00Z", window_end: "2026-08-12T08:00:00Z" }
              as: ProgramAdministrator
              as_user_id: "pa-1"
            - call: "POST /elevator-program/downtime-windows"
              payload: { car_id: "${b1_id}", window_type: "REPAIR", window_start: "2026-08-10T08:00:00Z", window_end: "2026-08-12T08:00:00Z" }
              as: ProgramAdministrator
              as_user_id: "pa-1"
            - call: "POST /elevator-program/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:00:00Z" }
              as: ProgramAdministrator
              as_user_id: "pa-1"
            - call: "POST /elevator-program/callbacks"
              payload: { car_id: "${a1_id}", callback_type: "MALFUNCTION", out_of_service: true }
              as: BuildingManager
              as_user_id: "bm-a"
              captures: { cba_id: $.data.id }
            - call: "POST /elevator-program/callbacks"
              payload: { car_id: "${b1_id}", callback_type: "MALFUNCTION", out_of_service: true }
              as: BuildingManager
              as_user_id: "bm-b"
              captures: { cbb_id: $.data.id }
            - call: "POST /elevator-program/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T15:00:00Z" }
              as: ProgramAdministrator
              as_user_id: "pa-1"
            - call: "POST /elevator-program/callbacks/${cba_id}/arrive"
              payload: {}
              as: ServiceContractor
              as_user_id: "sc-a"
            - call: "POST /elevator-program/callbacks/${cba_id}/clear"
              payload: { resolution_note: "reset" }
              as: ServiceContractor
              as_user_id: "sc-a"
            - call: "POST /elevator-program/callbacks/${cbb_id}/arrive"
              payload: {}
              as: ServiceContractor
              as_user_id: "sc-b"
            - call: "POST /elevator-program/callbacks/${cbb_id}/clear"
              payload: { resolution_note: "reset" }
              as: ServiceContractor
              as_user_id: "sc-b"
            - call: "POST /elevator-program/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdministrator
              as_user_id: "pa-1"
            - call: "GET /elevator-program/contracts/${ka_id}"
              payload: {}
              as: ProgramAdministrator
              as_user_id: "pa-1"
              captures: { ka_v: $.data.version }
            - call: "GET /elevator-program/contracts/${kb_id}"
              payload: {}
              as: ProgramAdministrator
              as_user_id: "pa-1"
              captures: { kb_v: $.data.version }
          trigger:
            - call: "POST /elevator-program/penalties"
              payload: { contract_id: "${ka_id}", period_month: "2026-08", expected_contract_version: "${ka_v}" }
              as: ProgramAdministrator
              as_user_id: "pa-1"
              captures: { pa_id: $.data.id }
            - call: "POST /elevator-program/penalties"
              payload: { contract_id: "${kb_id}", period_month: "2026-08", expected_contract_version: "${kb_v}" }
              as: ProgramAdministrator
              as_user_id: "pa-1"
              captures: { pb_id: $.data.id }
          assert:
            - "PenaltyAssessment.${pa_id}.uptime_pct_applied == 99.14"
            - "PenaltyAssessment.${pb_id}.uptime_pct_applied == 99.14"
            - "PenaltyAssessment.${pa_id}.uptime_variant_applied == \"EXCLUSIVE\""
            - "PenaltyAssessment.${pb_id}.uptime_variant_applied == \"EXCLUSIVE\""
            - "PenaltyAssessment.${pa_id}.late_callback_count == 1"
            - "PenaltyAssessment.${pb_id}.late_callback_count == 1"
            - "PenaltyAssessment.${pa_id}.schedule_applied == \"SCHEDULE_A\""
            - "PenaltyAssessment.${pa_id}.raw_amount_cents == 25000"
            - "PenaltyAssessment.${pa_id}.cap_amount_cents == 120000"
            - "PenaltyAssessment.${pa_id}.amount_cents == 25000"
            - "PenaltyAssessment.${pb_id}.schedule_applied == \"SCHEDULE_B\""
            - "PenaltyAssessment.${pb_id}.raw_amount_cents == 9600"
            - "PenaltyAssessment.${pb_id}.cap_amount_cents == 144000"
            - "PenaltyAssessment.${pb_id}.amount_cents == 9600"
            - "PenaltyAssessment.${pa_id}.service_credit_cents == 4128"
            - "PenaltyAssessment.${pb_id}.service_credit_cents == 4128"

  # ===========================================================================
  - rule_id: combinatorial_formula
    instances:

      - name: schedule_b_tier_breach_severity_and_cap_interact_nonlinearly
        grounds:
          - calculations.penalty_assessment_amount
          - calculations.car_uptime_percentage.variants.INCLUSIVE
          - entities.PenaltyAssessment.fields.raw_amount_cents
          - entities.PenaltyAssessment.fields.cap_amount_cents
          - endpoints[POST /elevator-program/penalties]
        distinguishing_aspect: |
          MODE (a) — a single formula with four interacting inputs (tiered uptime rate, per-breach
          percentage, a 1/2/3 severity branch keyed on entrapment presence, and an outer min() cap):
          uptime 92.74 selects tier 0.20, one entrapment breach adds 0.04 and forces weight 3, giving
          raw 360000, which the 30%-of-fee cap clamps to 150000. Every one of the four inputs must be
          read correctly for 150000 to appear.
        test_recipe:
          setup:
            - "One ACTIVE OIL_AND_GREASE contract (so the INCLUSIVE uptime variant applies) with SCHEDULE_B, monthly_base_fee_cents 500000, entrapment_response_minutes 30, one car."
            - "The car has a 2880-minute REPAIR window and one CLEARED ENTRAPMENT callback with response_minutes 360, breaching the 30-minute entrapment SLA and producing a 360-minute unplanned outage."
            - "Logical clock at 2026-09-01T00:00:00Z."
          setup_api_calls:
            - call: "POST /elevator-program/contracts"
              payload: { building_name: "Gamma Lofts", building_address: "4 Gamma Rd", jurisdiction_code: "NY-NYC", fire_district_code: "FD-11", building_manager_user_id: "bm-g", contractor_user_id: "sc-g", scope_type: "OIL_AND_GREASE", penalty_schedule: "SCHEDULE_B", monthly_base_fee_cents: 500000, callback_response_minutes: 60, entrapment_response_minutes: 30, term_start_date: "2026-01-01", term_end_date: "2026-12-31" }
              as: ProgramAdministrator
              as_user_id: "pa-1"
              captures: { kg_id: $.data.id }
            - call: "POST /elevator-program/contracts/${kg_id}/activate"
              payload: {}
              as: ProgramAdministrator
              as_user_id: "pa-1"
            - call: "POST /elevator-program/cars"
              payload: { contract_id: "${kg_id}", car_code: "CAR-G1", car_type: "HYDRAULIC", capacity_lbs: 2500 }
              as: ProgramAdministrator
              as_user_id: "pa-1"
              captures: { g1_id: $.data.id }
            - call: "POST /elevator-program/downtime-windows"
              payload: { car_id: "${g1_id}", window_type: "REPAIR", window_start: "2026-08-10T08:00:00Z", window_end: "2026-08-12T08:00:00Z" }
              as: ProgramAdministrator
              as_user_id: "pa-1"
            - call: "POST /elevator-program/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T09:00:00Z" }
              as: ProgramAdministrator
              as_user_id: "pa-1"
            - call: "POST /elevator-program/callbacks"
              payload: { car_id: "${g1_id}", callback_type: "ENTRAPMENT", passengers_trapped: 2, out_of_service: true }
              as: BuildingManager
              as_user_id: "bm-g"
              captures: { cbg_id: $.data.id }
            - call: "POST /elevator-program/callbacks/${cbg_id}/fire-dispatch"
              payload: { incident_number: "FD-2026-0815" }
              as: FireDispatcher
              as_user_id: "fd-1"
            - call: "POST /elevator-program/_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-05T15:00:00Z" }
              as: ProgramAdministrator
              as_user_id: "pa-1"
            - call: "POST /elevator-program/callbacks/${cbg_id}/arrive"
              payload: {}
              as: ServiceContractor
              as_user_id: "sc-g"
            - call: "POST /elevator-program/callbacks/${cbg_id}/clear"
              payload: { resolution_note: "passengers released" }
              as: ServiceContractor
              as_user_id: "sc-g"
            - call: "POST /elevator-program/_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-01T00:00:00Z" }
              as: ProgramAdministrator
              as_user_id: "pa-1"
            - call: "GET /elevator-program/contracts/${kg_id}"
              payload: {}
              as: ProgramAdministrator
              as_user_id: "pa-1"
              captures: { kg_v: $.data.version }
          trigger:
            - call: "POST /elevator-program/penalties"
              payload: { contract_id: "${kg_id}", period_month: "2026-08", expected_contract_version: "${kg_v}" }
              as: ProgramAdministrator
              as_user_id: "pa-1"
              captures: { pg_id: $.data.id }
          assert:
            - "PenaltyAssessment.${pg_id}.uptime_variant_applied == \"INCLUSIVE\""
            - "PenaltyAssessment.${pg_id}.uptime_pct_applied == 92.74"
            - "PenaltyAssessment.${pg_id}.entrapment_breach_count == 1"
            - "PenaltyAssessment.${pg_id}.late_callback_count == 0"
            - "PenaltyAssessment.${pg_id}.missed_visit_count == 0"
            - "PenaltyAssessment.${pg_id}.raw_amount_cents == 360000"
            - "PenaltyAssessment.${pg_id}.cap_amount_cents == 150000"
            - "PenaltyAssessment.${pg_id}.amount_cents == 150000"
            - "PenaltyAssessment.${pg_id}.service_credit_cents == 36300"
            - "ServiceContract.${kg_id}.penalty_balance_cents == 150000"

