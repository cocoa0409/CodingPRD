    path: "/cottage-food/producers"
    description: "List producers"
    roles: [Producer, HealthInspector, HealthAdmin, MarketManager]
    code: 200
    input: ["county?", "status?", "limit?", "offset?"]
    output: "Producer[]"
    side_effects: []
  - method: GET
    path: "/cottage-food/producers/{id}"
    description: "Get a producer"
    roles: [Producer, HealthInspector, HealthAdmin, MarketManager]
    code: 200
    input: []
    output: Producer
