        distinguishing_aspect: "Mislabeling prevention end-to-end: a TUNA lot tested as ESCOLAR is quarantined, relabeled to the verified species (species_declared := ESCOLAR, mislabel_flag := true), and only after the CA is resolved can it be released to ACCEPTED — now treated as ESCOLAR (not histamine-susceptible)."
