# =============================================================================
# 1.8 Scaffold Difficulty Design (Test Targeting Index)
# Cross-reference of SCAFFOLD.yaml 1.1-1.7 against the nine 0.5 Difficulty Rules.
# Every instance grounds in declared scaffold elements; deleting this file leaves
# the scaffold's behaviour identical.
# Logical clock starts at 2026-08-01T00:00:00Z on every fresh server.
# =============================================================================
scaffold_difficulty_design:

  - rule_id: dual_variant_calc
    instances:

      - name: unit_price_pin_at_line_write_vs_settlement_reprice_diverge
        grounds:
          - calculations.contract_unit_price
          - entities.OrderLine.fields.pinned_unit_price_cents
          - entities.OrderLine.fields.settled_unit_price_cents
          - state_machines.GpoContract.PENDING_ACTIVATION_to_ACTIVE
          - state_machines.GpoContract.ACTIVE_to_SUPERSEDED
        distinguishing_aspect: |
          Dual-variant instance in the ORDER-LINE COST domain: pin_at_line_write and
          settlement_reprice read identical OrderLine inputs yet return 9540 and 9200
          because the contract that priced the line was superseded between line write
          and delivery, and order_total_cents keeps the pinned figure.
        test_recipe:
          setup:
            - "One ACUTE supply room, one AMBIENT case item (wac 12000)."
            - "Contract CTR-A (TIER_2, ACUTE, 2026-01-01..2026-12-31) ACTIVE with a line at tier_price 9000 / floor 8000."
            - "An order with a single line for 10 cases written at 2026-08-01, submitted and allocated from a 100-unit lot."
            - "Successor contract CTR-B (TIER_1, ACUTE, 2026-09-01..2026-12-31, supersedes CTR-A) ACTIVE at 2026-09-05 with a line at tier_price 9200 / floor 8000; CTR-A is therefore SUPERSEDED and its lines BLOCKED."
            - "The order sits on a dispatched route, IN_TRANSIT, at clock 2026-09-05."
          setup_api_calls:
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-08-01T00:00:00Z" }
              as: ContractAdmin
            - call: "POST /supply-rooms"
              payload: { facility_code: "FAC-001", room_code: "OR-CORE-1", gpo_member_class: "ACUTE", room_type: "OR_CORE", refrigerated: true, controlled_secured: true, controlled_license_status: "ACTIVE", window_open_min: 360, window_close_min: 1080, credit_limit_cents: 5000000 }
              as: ContractAdmin
              captures: { room_id: $.data.id }
            - call: "POST /items"
              payload: { sku: "SKU-GLOVE-CS", description: "Sterile surgical glove, case of 24", manufacturer_code: "MFR-ACME", uom: "CS", wac_cents: 12000, handling_class: "AMBIENT", units_per_parent: 24 }
              as: ContractAdmin
              captures: { item_glove_id: $.data.id }
            - call: "POST /contracts"
              payload: { manufacturer_code: "MFR-ACME", contract_code: "CTR-A", tier: "TIER_2", member_class_scope: "ACUTE", effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-12-31T23:59:59Z" }
              as: ContractAdmin
              captures: { ctr_a_id: $.data.id }
            - call: "POST /contracts/${ctr_a_id}/lines"
              payload: { item_id: "${item_glove_id}", tier_price_cents: 9000, floor_price_cents: 8000, chargeback_eligible: true }
              as: ContractAdmin
              captures: { cl_a_id: $.data.id }
            - call: "POST /contracts/${ctr_a_id}/transition"
              payload: { to_status: "PENDING_ACTIVATION" }
              as: ContractAdmin
            - call: "POST /contracts/${ctr_a_id}/transition"
              payload: { to_status: "ACTIVE" }
              as: ContractAdmin
            - call: "POST /supply-rooms/${room_id}/formulary-items"
              payload: { item_id: "${item_glove_id}", facility_item_code: "FAC-GLOVE", par_qty: 400, reorder_point: 100 }
              as: MaterialsManager
              as_user_id: "${room_id}"
              captures: { fi_glove_id: $.data.id }
            - call: "POST /formulary-items/${fi_glove_id}/decision"
              payload: { decision: "APPROVED" }
              as: Clinician
              as_user_id: "clin-1"
            - call: "POST /lots"
              payload: { item_id: "${item_glove_id}", lot_code: "LOT-A1", expiry_date: "2027-06-30T00:00:00Z", received_quantity: 100 }
              as: DistributionOperator
              as_user_id: "dc-op-1"
              captures: { lot_a_id: $.data.id }
            - call: "POST /orders"
              payload: { supply_room_id: "${room_id}" }
              as: MaterialsManager
              as_user_id: "${room_id}"
              captures: { order_id: $.data.id, order_v1: $.data.version }
            - call: "POST /orders/${order_id}/lines"
              payload: { item_id: "${item_glove_id}", requested_qty: 10, expected_order_version: "${order_v1}" }
              as: MaterialsManager
              as_user_id: "${room_id}"
              captures: { line_id: $.data.id }
            - call: "POST /orders/${order_id}/submit"
              payload: {}
              as: MaterialsManager
              as_user_id: "${room_id}"
            - call: "POST /orders/${order_id}/allocate"
              payload: {}
              as: DistributionOperator
              as_user_id: "dc-op-1"
            - call: "POST /contracts"
              payload: { manufacturer_code: "MFR-ACME", contract_code: "CTR-B", tier: "TIER_1", member_class_scope: "ACUTE", effective_from: "2026-09-01T00:00:00Z", effective_to: "2026-12-31T23:59:59Z", supersedes_contract_id: "${ctr_a_id}" }
              as: ContractAdmin
              captures: { ctr_b_id: $.data.id }
            - call: "POST /contracts/${ctr_b_id}/lines"
              payload: { item_id: "${item_glove_id}", tier_price_cents: 9200, floor_price_cents: 8000, chargeback_eligible: true }
              as: ContractAdmin
              captures: { cl_b_id: $.data.id }
            - call: "POST /contracts/${ctr_b_id}/transition"
              payload: { to_status: "PENDING_ACTIVATION" }
              as: ContractAdmin
            - call: "POST /_clock/set_current_utc"
              payload: { to_iso8601: "2026-09-05T00:00:00Z" }
              as: ContractAdmin
            - call: "POST /contracts/${ctr_b_id}/transition"
              payload: { to_status: "ACTIVE" }
              as: ContractAdmin
            - call: "POST /delivery-routes"
              payload: { route_code: "RT-1", service_date: "2026-09-05", vehicle_class: "REEFER_VAN" }
              as: DistributionOperator
              as_user_id: "dc-op-1"
              captures: { route_id: $.data.id }
            - call: "POST /delivery-routes/${route_id}/stops"
              payload: { order_id: "${order_id}", arrival_min: 480, service_minutes: 30 }
              as: DistributionOperator
              as_user_id: "dc-op-1"
            - call: "POST /delivery-routes/${route_id}/dispatch"
              payload: {}
              as: DistributionOperator
              as_user_id: "dc-op-1"
          trigger:
            - call: "POST /orders/${order_id}/deliver"
              payload: {}
              as: DistributionOperator
              as_user_id: "dc-op-1"
          assert:
            - "OrderLine.${line_id}.pinned_unit_price_cents == 9540"
            - "OrderLine.${line_id}.settled_unit_price_cents == 9200"
            - "OrderLine.${line_id}.pinned_unit_price_cents != OrderLine.${line_id}.settled_unit_price_cents"
            - "OrderLine.${line_id}.extended_price_cents == 95400"
            - "OrderLine.${line_id}.line_fee_cents == 2624"
            - "ReplenishmentOrder.${order_id}.order_total_cents == 98024"
            - "GpoContract.${ctr_a_id}.status == SUPERSEDED"
            - "ContractLine.${cl_a_id}.activation_state == BLOCKED"
            - "ContractLine.${cl_b_id}.activation_state == ACTIVE"

      - name: par_suggestion_standard_topoff_vs_lum_split_diverge
        grounds:
          - calculations.par_replenishment_suggestion
          - entities.FormularyItem.fields.par_qty
          - entities.FormularyItem.fields.on_hand_qty
          - entities.Item.fields.units_per_parent
        distinguishing_aspect: |
          Dual-variant instance in the INVENTORY REPLENISHMENT domain, a different
          entity domain from the order-line cost variant: on identical FormularyItem
          state (par 100, on_hand 30, units_per_parent 24) STANDARD_TOPOFF returns
          3 cases / 72 eaches while LUM_SPLIT returns 2 cases plus 22 eaches / 70 eaches.
        test_recipe:
          setup:
            - "One ACUTE supply room."
            - "One AMBIENT case item with units_per_parent 24."
            - "An APPROVED formulary mapping with par_qty 100, reorder_point 30, lum_enabled true and on_hand_qty driven to exactly 30 by one cycle-count adjustment."
          setup_api_calls:
            - call: "POST /supply-rooms"
              payload: { facility_code: "FAC-002", room_code: "GEN-STORE-2", gpo_member_class: "ACUTE", room_type: "GENERAL_STORE" }
              as: ContractAdmin
              captures: { room_id: $.data.id }
            - call: "POST /items"
              payload: { sku: "SKU-GAUZE-CS", description: "Gauze sponge, case of 24", manufacturer_code: "MFR-ACME", uom: "CS", wac_cents: 7000, handling_class: "AMBIENT", units_per_parent: 24 }
              as: ContractAdmin
              captures: { item_id: $.data.id }
            - call: "POST /supply-rooms/${room_id}/formulary-items"
              payload: { item_id: "${item_id}", facility_item_code: "FAC-GAUZE", par_qty: 100, reorder_point: 30, lum_enabled: true }
              as: MaterialsManager
              as_user_id: "${room_id}"
              captures: { fi_id: $.data.id }
            - call: "POST /formulary-items/${fi_id}/decision"
              payload: { decision: "APPROVED" }
              as: Clinician
              as_user_id: "clin-1"
              captures: { fi_v2: $.data.version }
            - call: "POST /formulary-items/${fi_id}/adjust-on-hand"
              payload: { delta_qty: 30, expected_formulary_item_version: "${fi_v2}" }
              as: MaterialsManager
              as_user_id: "${room_id}"
          trigger:
            - call: "GET /formulary-items/${fi_id}/replenishment-suggestion"
              payload: { variant: "STANDARD_TOPOFF" }
              as: MaterialsManager
              as_user_id: "${room_id}"
              captures: { std_cases: $.data.suggested_case_qty, std_eaches: $.data.suggested_each_qty, std_total: $.data.suggested_total_eaches }
            - call: "GET /formulary-items/${fi_id}/replenishment-suggestion"
              payload: { variant: "LUM_SPLIT" }
              as: MaterialsManager
              as_user_id: "${room_id}"
              captures: { lum_cases: $.data.suggested_case_qty, lum_eaches: $.data.suggested_each_qty, lum_total: $.data.suggested_total_eaches }
          assert:
            - "FormularyItem.${fi_id}.on_hand_qty == 30"
            - "${std_cases} == 3 and ${std_eaches} == 0 and ${std_total} == 72"
            - "${lum_cases} == 2 and ${lum_eaches} == 22 and ${lum_total} == 70"
            - "${std_total} != ${lum_total}"
            - "both responses report eligible == true and deficit_eaches == 70"

  - rule_id: combinatorial_formula
    instances:

      - name: unit_price_nested_max_then_min_with_lum_and_cold_adders
        grounds:
          - calculations.contract_unit_price
          - entities.ContractLine.fields.floor_price_cents
          - entities.Item.fields.wac_cents
          - entities.FormularyItem.fields.lum_enabled
        distinguishing_aspect: |
          Mode (a): a five-input non-linear formula (tier multiplier, LUM adder,
          cold adder with its own inner max, contract floor, WAC ceiling) whose
          nesting order max(raw, floor) then min(., wac) is observable - line A
          settles at 4652 where neither bound binds and line B at 500 where the
          floor overrides a raw of 170.
        test_recipe:
          setup:
            - "One refrigerated ACUTE supply room."
            - "Two COLD_CHAIN each-level items: ITEM-A wac 5000, ITEM-B wac 5000."
            - "Contract CTR-T3 (TIER_3, ACUTE) ACTIVE with line A tier_price 4000 / floor 3500 and line B tier_price 100 / floor 500."
            - "Both items APPROVED on the room's formulary with lum_enabled true."
            - "A DRAFT order carrying one line of each item, quantity 1."
          setup_api_calls:
            - call: "POST /supply-rooms"
              payload: { facility_code: "FAC-003", room_code: "ICU-3", gpo_member_class: "ACUTE", room_type: "ICU", refrigerated: true }
              as: ContractAdmin
              captures: { room_id: $.data.id }
            - call: "POST /items"
              payload: { sku: "SKU-VAX-A-EA", description: "Refrigerated biologic A, each", manufacturer_code: "MFR-BIO", uom: "EA", wac_cents: 5000, handling_class: "COLD_CHAIN", units_per_parent: 1 }
              as: ContractAdmin
              captures: { item_a_id: $.data.id }
            - call: "POST /items"
              payload: { sku: "SKU-VAX-B-EA", description: "Refrigerated biologic B, each", manufacturer_code: "MFR-BIO", uom: "EA", wac_cents: 5000, handling_class: "COLD_CHAIN", units_per_parent: 1 }
              as: ContractAdmin
              captures: { item_b_id: $.data.id }
            - call: "POST /contracts"
              payload: { manufacturer_code: "MFR-BIO", contract_code: "CTR-T3", tier: "TIER_3", member_class_scope: "ACUTE", effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-12-31T23:59:59Z" }
              as: ContractAdmin
              captures: { ctr_id: $.data.id }
            - call: "POST /contracts/${ctr_id}/lines"
              payload: { item_id: "${item_a_id}", tier_price_cents: 4000, floor_price_cents: 3500 }
              as: ContractAdmin
            - call: "POST /contracts/${ctr_id}/lines"
              payload: { item_id: "${item_b_id}", tier_price_cents: 100, floor_price_cents: 500 }
              as: ContractAdmin
            - call: "POST /contracts/${ctr_id}/transition"
              payload: { to_status: "PENDING_ACTIVATION" }
              as: ContractAdmin
            - call: "POST /contracts/${ctr_id}/transition"
              payload: { to_status: "ACTIVE" }
              as: ContractAdmin
            - call: "POST /supply-rooms/${room_id}/formulary-items"
              payload: { item_id: "${item_a_id}", facility_item_code: "FAC-VAX-A", par_qty: 50, reorder_point: 10, lum_enabled: true }
              as: MaterialsManager
              as_user_id: "${room_id}"
              captures: { fi_a_id: $.data.id }
            - call: "POST /formulary-items/${fi_a_id}/decision"
              payload: { decision: "APPROVED" }
              as: Clinician
              as_user_id: "clin-1"
            - call: "POST /supply-rooms/${room_id}/formulary-items"
              payload: { item_id: "${item_b_id}", facility_item_code: "FAC-VAX-B", par_qty: 50, reorder_point: 10, lum_enabled: true }
              as: MaterialsManager
              as_user_id: "${room_id}"
              captures: { fi_b_id: $.data.id }
            - call: "POST /formulary-items/${fi_b_id}/decision"
              payload: { decision: "APPROVED" }
              as: Clinician
              as_user_id: "clin-1"
            - call: "POST /orders"
              payload: { supply_room_id: "${room_id}" }
              as: MaterialsManager
              as_user_id: "${room_id}"
              captures: { order_id: $.data.id, order_v1: $.data.version }
          trigger:
            - call: "POST /orders/${order_id}/lines"
              payload: { item_id: "${item_a_id}", requested_qty: 1, expected_order_version: "${order_v1}" }
              as: MaterialsManager
              as_user_id: "${room_id}"
              captures: { line_a_id: $.data.id }
            - call: "GET /orders/${order_id}"
              payload: {}
              as: MaterialsManager
              as_user_id: "${room_id}"
              captures: { order_v2: $.data.version }
            - call: "POST /orders/${order_id}/lines"
              payload: { item_id: "${item_b_id}", requested_qty: 1, expected_order_version: "${order_v2}" }
              as: MaterialsManager
              as_user_id: "${room_id}"
              captures: { line_b_id: $.data.id }
          assert:
            - "OrderLine.${line_a_id}.pinned_unit_price_cents == 4652"
            - "OrderLine.${line_b_id}.pinned_unit_price_cents == 500"
            - "OrderLine.${line_a_id}.line_fee_cents == 128"
            - "OrderLine.${line_b_id}.line_fee_cents == 14"
            - "ReplenishmentOrder.${order_id}.order_total_cents == 5294"

      - name: order_total_rounds_distribution_fee_per_line_before_summing
        grounds:
          - calculations.order_total
          - entities.OrderLine.fields.line_fee_cents
          - entities.ReplenishmentOrder.fields.order_total_cents
        distinguishing_aspect: |
          Mode (b): nested rounding whose order changes the answer. Two lines of
          exactly 200 cents each round to a 6-cent fee per line for a total of 412;
          summing first and rounding once over 400 cents yields 411. The scaffold
          pins per-line rounding, so 412 is the only correct total.
        test_recipe:
          setup:
            - "One ACUTE supply room."
            - "Two AMBIENT case items priced at exactly 200 cents each under a TIER_1 contract (tier_price 200, floor 100, wac 5000)."
            - "Both items APPROVED on the room's formulary."
            - "A DRAFT order carrying one line of each item, quantity 1."
          setup_api_calls:
            - call: "POST /supply-rooms"
              payload: { facility_code: "FAC-004", room_code: "GEN-STORE-4", gpo_member_class: "ACUTE", room_type: "GENERAL_STORE" }
              as: ContractAdmin
              captures: { room_id: $.data.id }
            - call: "POST /items"
              payload: { sku: "SKU-TAPE-CS", description: "Surgical tape, case", manufacturer_code: "MFR-ACME", uom: "CS", wac_cents: 5000, handling_class: "AMBIENT", units_per_parent: 12 }
              as: ContractAdmin
              captures: { item_a_id: $.data.id }
            - call: "POST /items"
              payload: { sku: "SKU-SWAB-CS", description: "Prep swab, case", manufacturer_code: "MFR-ACME", uom: "CS", wac_cents: 5000, handling_class: "AMBIENT", units_per_parent: 12 }
              as: ContractAdmin
              captures: { item_b_id: $.data.id }
            - call: "POST /contracts"
              payload: { manufacturer_code: "MFR-ACME", contract_code: "CTR-T1", tier: "TIER_1", member_class_scope: "ACUTE", effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-12-31T23:59:59Z" }
              as: ContractAdmin
              captures: { ctr_id: $.data.id }
            - call: "POST /contracts/${ctr_id}/lines"
              payload: { item_id: "${item_a_id}", tier_price_cents: 200, floor_price_cents: 100 }
              as: ContractAdmin
            - call: "POST /contracts/${ctr_id}/lines"
              payload: { item_id: "${item_b_id}", tier_price_cents: 200, floor_price_cents: 100 }
              as: ContractAdmin
            - call: "POST /contracts/${ctr_id}/transition"
              payload: { to_status: "PENDING_ACTIVATION" }
              as: ContractAdmin
            - call: "POST /contracts/${ctr_id}/transition"
              payload: { to_status: "ACTIVE" }
              as: ContractAdmin
            - call: "POST /supply-rooms/${room_id}/formulary-items"
              payload: { item_id: "${item_a_id}", facility_item_code: "FAC-TAPE", par_qty: 60, reorder_point: 12 }
              as: MaterialsManager
              as_user_id: "${room_id}"
              captures: { fi_a_id: $.data.id }
            - call: "POST /formulary-items/${fi_a_id}/decision"
              payload: { decision: "APPROVED" }
              as: Clinician
              as_user_id: "clin-1"
            - call: "POST /supply-rooms/${room_id}/formulary-items"
              payload: { item_id: "${item_b_id}", facility_item_code: "FAC-SWAB", par_qty: 60, reorder_point: 12 }
              as: MaterialsManager
              as_user_id: "${room_id}"
              captures: { fi_b_id: $.data.id }
            - call: "POST /formulary-items/${fi_b_id}/decision"
              payload: { decision: "APPROVED" }
              as: Clinician
              as_user_id: "clin-1"
            - call: "POST /orders"
              payload: { supply_room_id: "${room_id}" }
              as: MaterialsManager
              as_user_id: "${room_id}"
              captures: { order_id: $.data.id, order_v1: $.data.version }
          trigger:
            - call: "POST /orders/${order_id}/lines"
              payload: { item_id: "${item_a_id}", requested_qty: 1, expected_order_version: "${order_v1}" }
              as: MaterialsManager
              as_user_id: "${room_id}"
              captures: { line_a_id: $.data.id }
            - call: "GET /orders/${order_id}"
              payload: {}
              as: MaterialsManager
              as_user_id: "${room_id}"
              captures: { order_v2: $.data.version }
            - call: "POST /orders/${order_id}/lines"
              payload: { item_id: "${item_b_id}", requested_qty: 1, expected_order_version: "${order_v2}" }
              as: MaterialsManager
              as_user_id: "${room_id}"
              captures: { line_b_id: $.data.id }
          assert:
            - "OrderLine.${line_a_id}.extended_price_cents == 200 and OrderLine.${line_a_id}.line_fee_cents == 6"
            - "OrderLine.${line_b_id}.extended_price_cents == 200 and OrderLine.${line_b_id}.line_fee_cents == 6"
            - "ReplenishmentOrder.${order_id}.order_total_cents == 412"
            - "ReplenishmentOrder.${order_id}.order_total_cents != 411"

      - name: chargeback_admin_bracket_keyed_on_gross_not_on_net
        grounds:
          - calculations.chargeback_settlement
          - entities.ChargebackClaim.fields.gross_chargeback_cents
          - entities.ChargebackClaim.fields.admin_fee_pct
          - entities.ChargebackClaim.fields.net_chargeback_cents
        distinguishing_aspect: |
          Mode (c): a circular-looking dependency pinned to a four-step order. Gross
          lands on exactly 50000, selecting the 0.015 bracket for an admin fee of 750
          and a net of 49250. Re-deriving the bracket from the net (49250 < 50000)
          would select 0.020 and produce 49000, so the pinned evaluation order is
          directly observable.
        test_recipe:
          setup:
            - "One ACUTE supply room, one AMBIENT case item with wac 60000."
            - "Contract CTR-CB (TIER_1, ACUTE) ACTIVE with a chargeback-eligible line at tier_price 10000 / floor 9000, so the settled unit price is exactly 10000."
            - "An order with one line of quantity 1, allocated from a lot, routed, dispatched and delivered at 2026-08-01, so gross chargeback is exactly (60000 - 10000) * 1 == 50000."
          setup_api_calls:
            - call: "POST /supply-rooms"
              payload: { facility_code: "FAC-005", room_code: "OR-CORE-5", gpo_member_class: "ACUTE", room_type: "OR_CORE" }
              as: ContractAdmin
              captures: { room_id: $.data.id }
            - call: "POST /items"
              payload: { sku: "SKU-IMPLANT-EA", description: "Orthopaedic implant, each", manufacturer_code: "MFR-ORTHO", uom: "EA", wac_cents: 60000, handling_class: "AMBIENT", units_per_parent: 1 }
              as: ContractAdmin
              captures: { item_id: $.data.id }
            - call: "POST /contracts"
              payload: { manufacturer_code: "MFR-ORTHO", contract_code: "CTR-CB", tier: "TIER_1", member_class_scope: "ACUTE", effective_from: "2026-01-01T00:00:00Z", effective_to: "2026-12-31T23:59:59Z" }
              as: ContractAdmin
              captures: { ctr_id: $.data.id }
            - call: "POST /contracts/${ctr_id}/lines"
              payload: { item_id: "${item_id}", tier_price_cents: 10000, floor_price_cents: 9000, chargeback_eligible: true }
              as: ContractAdmin
            - call: "POST /contracts/${ctr_id}/transition"
              payload: { to_status: "PENDING_ACTIVATION" }
              as: ContractAdmin
            - call: "POST /contracts/${ctr_id}/transition"
              payload: { to_status: "ACTIVE" }
              as: ContractAdmin
            - call: "POST /supply-rooms/${room_id}/formulary-items"
              payload: { item_id: "${item_id}", facility_item_code: "FAC-IMPLANT", par_qty: 10, reorder_point: 2 }
              as: MaterialsManager
              as_user_id: "${room_id}"
              captures: { fi_id: $.data.id }
