# =============================================================================
# PRD Benchmark Scaffold — task_3008_off_price_opportunistic_buying_pack_hold_store
#
# Off-price opportunistic buying, pack-and-hold warehousing, cluster-based
# store allocation, compare-at ticketing, buyer open-to-buy discipline,
# markdown cadence with weeks-on-floor rules, and shrink control.
# =============================================================================

scenario: |
  Off-Price Opportunistic Buying, Pack-and-Hold & Store Allocation (TJX Companies):
  opportunistic purchase decisions on closeouts, cancellations and packaway lots
  with no pre-committed assortment, pack-and-hold warehousing of goods intended
  for a later season with holding cost and aging review, store-level allocation
  by demographic cluster rather than uniform assortment, ticketing with
  compare-at price substantiation and regional price zones, buyer open-to-buy
  discipline with liquidity reserved for late-season deals, vendor relationship
  management balancing brand protection with discreet sourcing, in-store
  markdown cadence with fixed weeks-on-floor rules, shrink control on unticketed
  and mixed-lot merchandise

domain_name: off-price-opportunistic-buying
api_prefix: ""

complexity_profile:
  primary_archetype: quota / allocation
  secondary_archetype: temporal windowing
  complexity_layers:
    - optimistic_concurrency
    - cascading_side_effects
    - dual_variant_calculation
    - ops_run_checkpoint
    - scheduled / deferred actions
  entity_topology: flat
  state_machine_shape: compound
  relationship_patterns:
    - one_to_many
    - cross_aggregate
  role_model: hierarchical_override
  consistency_model: immediate

# =============================================================================
# §1.0 Response Envelope (FIXED — verbatim)
# =============================================================================
response_envelope:
  success: |
    { "meta": { "api_request_id": "req_xxx", "api_request_timestamp": "ISO8601" },
      "response_type": "object" | "array", "data": {} }
  error: |
    { "meta": { ... }, "response_type": "error",
      "data": { "error_id": "ERR_XXX", "message": "..." } }
  pagination_fields: ["limit", "offset", "total_count", "has_more"]
  pagination_defaults: { limit: 10, min: 1, max: 100, offset: 0 }

# =============================================================================
# §1.1 Entity-Relationship Table
# =============================================================================
entities:

  - name: MerchandiseSeason
    parent: null
    common_fields: true
    fields:
      - { name: season_code, type: string, source: input, description: "Unique season code, e.g. SS2027; unique across all seasons", constraints: "unique" }
      - { name: start_date, type: datetime, source: input, description: "Selling window start (date-only ISO 8601, UTC midnight)" }
      - { name: end_date, type: datetime, source: input, description: "Selling window end; must be strictly after start_date" }
      - { name: department_otb_budget_cents, type: integer, source: input, description: "Total departmental open-to-buy budget for the season, cents >= 0", constraints: ">= 0" }
      - { name: packaway_reserve_ratio, type: number, source: input, description: "Fraction of budget sequestered for late-season packaway deals, in [0, 1]", constraints: ">= 0 and <= 1" }
      - { name: status, type: enum, source: system, description: "DRAFT | OPEN | CLOSED", default: DRAFT }
      - { name: committed_forward_cents, type: integer, source: computed, description: "Provisional in-season commitments: sum of landed cost over accepted Lots with disposition IMMEDIATE", default: 0 }
      - { name: committed_packaway_cents, type: integer, source: computed, description: "Provisional packaway commitments: sum of landed cost over accepted Lots with disposition PACKAWAY", default: 0 }
      - { name: spent_forward_cents, type: integer, source: computed, description: "Finalized forward spend: sum of extended_cost_cents over ReceiptLines on RECEIVED receipts against IMMEDIATE lots", default: 0 }
      - { name: spent_packaway_cents, type: integer, source: computed, description: "Finalized packaway spend: same over PACKAWAY lots", default: 0 }

  - name: Vendor
    parent: null
    common_fields: true
    fields:
      - { name: legal_name, type: string, source: input, description: "Vendor legal name" }
      - { name: vendor_code, type: string, source: input, description: "Unique short vendor code", constraints: "unique" }
      - { name: discretion_level, type: enum, source: input, description: "STANDARD | CONFIDENTIAL | QUIET; CONFIDENTIAL/QUIET lots are hidden from non-senior buyers" }
      - { name: ticket_discretion_required, type: boolean, source: input, description: "True when brand protection requires this vendor's tickets to omit the vendor name" }
      - { name: default_zone_code, type: string, source: input, description: "Price zone code governing compare-at substantiation for this vendor's lots (e.g. NE, MW, SE, TX, MT, WC)" }
      - { name: vendor_tier, type: enum, source: input, description: "A | B | C; declining tier excludes the vendor from later promotions", constraints: "one of A, B, C" }

  - name: PriceZone
    parent: null
    common_fields: true
    fields:
      - { name: zone_code, type: string, source: input, description: "Unique zone code: NE | MW | SE | TX | MT | WC", constraints: "unique" }
      - { name: compare_at_multiplier, type: number, source: input, description: "Minimum allowed ratio of compare-at price to our retail in this zone; > 1", constraints: "> 1" }
      - { name: markdown_cadence_weeks, type: integer, source: input, description: "Markdown price step every N weeks on floor for non-clearance stores in this zone; 1..8", constraints: ">= 1 and <= 8" }
      - { name: clearance_weeks, type: integer, source: input, description: "Force-clearance threshold: store SKUs on floor this many weeks go to CLEARANCE; > markdown_cadence_weeks", constraints: "> markdown_cadence_weeks and <= 52" }

  - name: Lot
    parent: null
    common_fields: true
    fields:
      - { name: lot_code, type: string, source: input, description: "Buyer-facing lot code; unique", constraints: "unique" }
      - { name: vendor_id, type: string, source: system, description: "FK -> Vendor.id; supplying vendor" }
      - { name: season_id, type: string, source: system, description: "FK -> MerchandiseSeason.id; season the lot is bought against" }
      - { name: lot_type, type: enum, source: input, description: "CLOSEOUT | CANCELLATION | PACKAWAY" }
      - { name: disposition, type: enum, source: input, description: "IMMEDIATE (ship to stores this season) | PACKAWAY (pack-and-hold for a later season)" }
      - { name: asking_price_cents, type: integer, source: input, description: "Vendor asking price for the whole lot, cents > 0", constraints: "> 0" }
      - { name: mixed_lot, type: boolean, source: input, description: "True when the lot mixes departments/styles; forces ShrinkCase merge_mode HIGH_VALUE_SORT", default: false }
      - { name: unit_count, type: integer, source: input, description: "Declared units in the lot, > 0", constraints: "> 0" }
      - { name: expected_sell_through_pct, type: number, source: input, description: "Buyer-projected sell-through fraction in (0, 1]", constraints: "> 0 and <= 1" }
      - { name: estimated_unit_retail_cents, type: integer, source: input, description: "Buyer-projected average retail per unit, cents > 0", constraints: "> 0" }
      - { name: offer_expires_at, type: datetime, source: input, description: "Vendor offer expiry; evaluation must occur strictly before this instant" }
      - { name: target_season_id, type: string, source: input, description: "FK -> MerchandiseSeason.id; required when disposition == PACKAWAY, must differ from season_id and be DRAFT", constraints: "required iff disposition == PACKAWAY" }
      - { name: landed_cost_cents, type: integer, source: computed, description: "Negotiated price + allocated freight, set at evaluation; null until evaluated", default: null }
      - { name: deal_quality_score, type: number, source: computed, description: "Calculation deal_quality_score output at evaluation; null until evaluated", default: null }
      - { name: status, type: enum, source: system, description: "OFFERED | EVALUATED | ACCEPTED | PASSED | CANCELLED", default: OFFERED }
      - { name: cancel_reason, type: enum, source: system, description: "VENDOR_PULL | BUYER_WITHDRAW | OFFER_EXPIRED; set on cancellation", default: null }

  - name: LotLine
    parent: null
    common_fields: true
    fields:
      - { name: lot_id, type: string, source: system, description: "FK -> Lot.id; owning lot" }
      - { name: style_code, type: string, source: input, description: "Style/SKU code" }
      - { name: department, type: enum, source: input, description: "APPAREL | HOME | BEAUTY | ACCESSORIES" }
      - { name: quantity, type: integer, source: input, description: "Units of this line, > 0", constraints: "> 0" }
      - { name: unit_cost_cents, type: integer, source: input, description: "Per-unit cost within the lot, cents >= 0", constraints: ">= 0" }
      - { name: compare_at_claim_cents, type: integer, source: input, description: "Vendor-claimed compare-at unit price; must pass substantiation at ticketing", constraints: "> 0" }
      - { name: target_retail_cents, type: integer, source: input, description: "Planned unit retail before zone rounding", constraints: "> 0" }

  - name: Warehouse
    parent: null
    common_fields: true
    fields:
      - { name: warehouse_code, type: string, source: input, description: "Unique warehouse code", constraints: "unique" }
      - { name: pallet_capacity, type: integer, source: input, description: "Total pallet slots, > 0", constraints: "> 0" }
      - { name: zone_code, type: string, source: input, description: "Home price zone of the warehouse" }
      - { name: monthly_holding_rate_per_pallet_cents, type: integer, source: input, description: "Charged per stored pallet per calendar month (pro-rated at day granularity on entry/release)", constraints: ">= 0" }

  - name: PackawayHold
    parent: null
    common_fields: true
    fields:
      - { name: lot_id, type: string, source: system, description: "FK -> Lot.id; exactly one hold per lot; unique", constraints: "unique" }
      - { name: warehouse_id, type: string, source: system, description: "FK -> Warehouse.id; storing warehouse" }
      - { name: season_id, type: string, source: system, description: "FK -> MerchandiseSeason.id; buying season" }
      - { name: target_season_id, type: string, source: system, description: "FK -> MerchandiseSeason.id; season the goods are intended for" }
      - { name: pallet_count, type: integer, source: input, description: "Pallets occupied, > 0", constraints: "> 0" }
      - { name: entry_date, type: datetime, source: system, description: "Date goods entered the warehouse (logical clock date)" }
      - { name: release_window_start, type: datetime, source: input, description: "Earliest permitted release date (date-only)" }
      - { name: release_window_end, type: datetime, source: input, description: "Latest permitted release date; strictly after release_window_start" }
      - { name: release_date, type: datetime, source: system, description: "Actual release date; null until released", default: null }
      - { name: accrued_holding_cost_cents, type: integer, source: computed, description: "Calculation holding_cost_accrual output; 0 at entry, recomputed by reviews and release", default: 0 }
      - { name: review_count, type: integer, source: computed, description: "Number of aging reviews run against this hold", default: 0 }
      - { name: age_bucket, type: enum, source: system, description: "FRESH | AGING | STALE per hold_age_bucket", default: FRESH }
      - { name: status, type: enum, source: system, description: "STORED | AGING_REVIEW | RELEASED | LIQUIDATED", default: STORED }

  - name: Store
    parent: null
    common_fields: true
    fields:
      - { name: store_code, type: string, source: input, description: "Unique store code", constraints: "unique" }
      - { name: cluster_code, type: enum, source: input, description: "Demographic cluster: URBAN_PREMIUM | SUBURBAN_FAMILY | VALUE_RURAL" }
      - { name: zone_code, type: string, source: input, description: "Price zone of the store; must reference an existing PriceZone.zone_code" }
      - { name: storage_capacity_units, type: integer, source: input, description: "Maximum sellable units the store can hold, > 0", constraints: "> 0" }
      - { name: clearance_outlet, type: boolean, source: input, description: "Clearance stores ignore markdown_cadence and take clearance-priority allocations", default: false }

  - name: AllocationPlan
    parent: null
    common_fields: true
    fields:
      - { name: lot_id, type: string, source: system, description: "FK -> Lot.id; lot being allocated" }
      - { name: season_id, type: string, source: system, description: "FK -> MerchandiseSeason.id; selling season of the plan" }
      - { name: total_units, type: integer, source: input, description: "Units entering the plan, > 0", constraints: "> 0" }
      - { name: cluster_weights, type: object, source: input, description: "Map of cluster_code -> weight > 0; must cover exactly the clusters of eligible stores" }
      - { name: status, type: enum, source: system, description: "DRAFT | APPROVED | EXECUTED | SUPERSEDED | CANCELLED", default: DRAFT }
      - { name: superseded_by_id, type: string, source: system, description: "FK -> AllocationPlan.id; the plan that superseded this one; null unless SUPERSEDED", default: null }

  - name: StoreSku
    parent: null
    common_fields: true
    fields:
      - { name: store_id, type: string, source: system, description: "FK -> Store.id" }
      - { name: lot_line_id, type: string, source: system, description: "FK -> LotLine.id" }
      - { name: ticket_id, type: string, source: system, description: "FK -> Ticket.id; required at placement so every sellable unit trace to a ticketed price" }
      - { name: season_id, type: string, source: system, description: "FK -> MerchandiseSeason.id; selling season" }
      - { name: allocation_plan_id, type: string, source: system, description: "FK -> AllocationPlan.id; null for manually placed stock", default: null }
      - { name: units_on_hand, type: integer, source: input, description: "Units placed in the store, > 0", constraints: "> 0" }
      - { name: floor_date, type: datetime, source: system, description: "Logical-clock date the SKU first hit the floor" }
      - { name: weeks_on_floor, type: integer, source: computed, description: "floor((today - floor_date)/7); recomputed by markdown and liquidation sweeps", default: 0 }
      - { name: markdown_step, type: integer, source: computed, description: "Number of markdown steps taken", default: 0 }
      - { name: current_price_cents, type: integer, source: computed, description: "Initialized from the ticket's zone retail; reduced by markdown events", default: null }
      - { name: status, type: enum, source: system, description: "ON_FLOOR | MARKED_DOWN | CLEARANCE | SOLD_OUT | LIQUIDATED", default: ON_FLOOR }

  - name: Ticket
    parent: null
    common_fields: false
    fields:
      - { name: lot_line_id, type: string, source: system, description: "FK -> LotLine.id" }
      - { name: zone_code, type: string, source: input, description: "Price zone this ticket is valid for" }
      - { name: ticket_retail_cents, type: integer, source: computed, description: "Our retail after zone rounding rule: floor(target_retail_cents * zone rounding) ending in 9 cents" }
      - { name: compare_at_cents, type: integer, source: computed, description: "Substantiated compare-at price; null when omitted" }
      - { name: compare_at_omitted, type: boolean, source: computed, description: "True when substantiation failed and compare-at was omitted", default: false }
      - { name: vendor_name_on_ticket, type: boolean, source: computed, description: "False when vendor discretion requires omission", default: true }
      - { name: substantiation_notes, type: string, source: input, description: "Evidence supporting the compare-at claim", default: "" }
      - { name: status, type: enum, source: system, description: "ACTIVE | VOIDED", default: ACTIVE }

  - name: Receipt
    parent: null
    common_fields: true
    fields:
      - { name: lot_id, type: string, source: system, description: "FK -> Lot.id; lot being received" }
      - { name: warehouse_id, type: string, source: system, description: "FK -> Warehouse.id; receiving warehouse" }
      - { name: receipt_date, type: datetime, source: system, description: "Logical-clock date of receipt" }
      - { name: status, type: enum, source: system, description: "OPEN | RECEIVED", default: OPEN }

  - name: ReceiptLine
    parent: null
    common_fields: false
    fields:
      - { name: receipt_id, type: string, source: system, description: "FK -> Receipt.id" }
      - { name: lot_line_id, type: string, source: system, description: "FK -> LotLine.id" }
      - { name: declared_qty, type: integer, source: system, description: "Quantity declared on the lot line at receipt creation" }
      - { name: received_qty, type: integer, source: input, description: "Physically received units, 0..declared_qty", constraints: ">= 0 and <= declared_qty" }
      - { name: variance_qty, type: integer, source: computed, description: "declared_qty - received_qty" }
      - { name: variance_value_cents, type: integer, source: computed, description: "Calculation receipt_variance_valuation output" }

  - name: ShrinkCase
    parent: null
    common_fields: true
    fields:
      - { name: store_id, type: string, source: system, description: "FK -> Store.id; store where shrink was found" }
      - { name: store_sku_id, type: string, source: system, description: "FK -> StoreSku.id; null when units_untraceable > 0", default: null }
      - { name: lot_id, type: string, source: system, description: "FK -> Lot.id; null when units_untraceable > 0 (mixed-lot merge by value sort)", default: null }
      - { name: shrink_type, type: enum, source: input, description: "UNSCANNED_UNIT | MIXED_LOT_OVERAGE | MIXED_LOT_SHORTAGE | DAMAGE" }
      - { name: merge_mode, type: enum, source: input, description: "FIFO | HIGH_VALUE_SORT; must be HIGH_VALUE_SORT when the underlying lot is mixed_lot", default: FIFO }
      - { name: units_lost, type: integer, source: input, description: "Units written off, >= 0; may be 0 when units_untraceable > 0", constraints: ">= 0" }
      - { name: units_untraceable, type: integer, source: input, description: "Units that cannot be traced to any store SKU, >= 0; may be 0 when units_lost > 0", constraints: ">= 0" }
      - { name: shrink_value_cents, type: integer, source: computed, description: "Calculation shrink_valuation output" }
      - { name: status, type: enum, source: system, description: "OPEN | CONFIRMED | VOIDED", default: OPEN }

  - name: MarkdownEvent
    parent: null
    common_fields: false
    fields:
      - { name: store_sku_id, type: string, source: system, description: "FK -> StoreSku.id" }
      - { name: step_number, type: integer, source: system, description: "Markdown step applied by this event" }
      - { name: old_price_cents, type: integer, source: system, description: "Price before the event" }
      - { name: new_price_cents, type: integer, source: system, description: "Price after the event" }
      - { name: markdown_cents, type: integer, source: system, description: "old_price_cents - new_price_cents" }
      - { name: event_type, type: enum, source: system, description: "CADENCE | FORCE_CLEARANCE" }
      - { name: effective_date, type: datetime, source: system, description: "Logical-clock date of the event" }

  - name: LiquidationOrder
    parent: null
    common_fields: true
    fields:
      - { name: store_id, type: string, source: system, description: "FK -> Store.id" }
      - { name: lot_id, type: string, source: system, description: "FK -> Lot.id" }
      - { name: reason, type: enum, source: system, description: "CLEARANCE_WEEKS_EXCEEDED | PACKAWAY_STALE" }
      - { name: recovery_rate_pct, type: number, source: system, description: "Expected recovery fraction in (0, 1]; supplied on manual creation, pinned to CASCADE_RECOVERY_RATE_PCT for cascade-created (packaway-stale) orders", constraints: "> 0 and <= 1" }
      - { name: expected_units, type: integer, source: system, description: "Units on hand at order creation" }
      - { name: actual_units, type: integer, source: system, description: "Units confirmed at execution; null until executed", default: null }
      - { name: recovery_value_cents, type: integer, source: computed, description: "Calculation liquidation_recovery output", default: null }
      - { name: status, type: enum, source: system, description: "DRAFT | APPROVED | EXECUTED | CANCELLED", default: DRAFT }

# =============================================================================
# §1.2 State Machine Table
# =============================================================================
state_machines:

  - entity: MerchandiseSeason
    initial_state: DRAFT
    terminal_states: [CLOSED]
    transitions:
      - from: DRAFT
        to: OPEN
        trigger: "POST /merchandise-seasons/{id}/open"
        actor: PlanningLead
        preconditions:
          - "season.status == DRAFT (else ERR_INVALID_STATE)"
          - "no other season with status == OPEN exists (ERR_SEASON_ALREADY_OPEN)"
        side_effects:
          - "MerchandiseSeason.version += 1"
      - from: OPEN
        to: CLOSED
        trigger: "POST /merchandise-seasons/{id}/close"
        actor: PlanningLead
        preconditions:
          - "season.status == OPEN (else ERR_INVALID_STATE)"
          - "no Lot with season_id == season.id has status in {OFFERED, EVALUATED} (ERR_OPEN_LOTS_REMAIN)"
          - "every PackawayHold with season_id == season.id has status in {RELEASED, LIQUIDATED} (ERR_PACKAWAY_HOLDS_ACTIVE)"
          - "no AllocationPlan with season_id == season.id has status in {DRAFT, APPROVED} (ERR_PLAN_NOT_EXECUTABLE)"
        side_effects:
          - "MerchandiseSeason.version += 1"
          - "every StoreSku with season_id == season.id and status in {ON_FLOOR, MARKED_DOWN, CLEARANCE} has weeks_on_floor recomputed from the logical clock (calculation markdown_cadence_step, recompute-only mode)"

  - entity: Lot
    initial_state: OFFERED
    terminal_states: [ACCEPTED, PASSED, CANCELLED]
    transitions:
      - from: OFFERED
        to: EVALUATED
        trigger: "POST /lots/{id}/evaluate"
        actor: Buyer
        preconditions:
          - "lot.status == OFFERED (else ERR_INVALID_STATE)"
          - "logical clock < lot.offer_expires_at (ERR_OFFER_EXPIRED)"
          - "Buyer tier SENIOR or lot.vendor.discretion_level == STANDARD (ERR_VENDOR_DISCRETION)"
        side_effects:
          - "calculation deal_quality_score -> lot.deal_quality_score"
          - "if payload.negotiated_price_cents is supplied: lot.landed_cost_cents = negotiated_price_cents + FREIGHT_SURCHARGE_CENTS_PER_LOT; else lot.landed_cost_cents = lot.asking_price_cents + FREIGHT_SURCHARGE_CENTS_PER_LOT"
          - "Lot.version += 1"
      - from: EVALUATED
        to: OFFERED
        trigger: "POST /lots/{id}/evaluate (re-evaluation loop: revises score and landed cost)"
        actor: Buyer
        preconditions:
          - "lot.status == EVALUATED (else ERR_INVALID_STATE)"
          - "logical clock < lot.offer_expires_at (ERR_OFFER_EXPIRED)"
          - "Buyer tier SENIOR or lot.vendor.discretion_level == STANDARD (ERR_VENDOR_DISCRETION)"
        side_effects:
          - "calculation deal_quality_score -> lot.deal_quality_score (recomputed)"
          - "lot.landed_cost_cents recomputed with the same negotiated-price rule"
          - "Lot.version += 1"
      - from: EVALUATED
        to: ACCEPTED
        trigger: "POST /lots/{id}/accept"
        actor: Buyer
        preconditions:
          - "lot.status == EVALUATED (else ERR_INVALID_STATE)"
          - "payload.expected_season_version == season.version (ERR_STALE_VERSION, 412)"
          - "Buyer tier SENIOR or lot.vendor.discretion_level == STANDARD (ERR_VENDOR_DISCRETION)"
          - "open_to_buy_forward_commit or open_to_buy_packaway_commit admits lot.landed_cost_cents (ERR_OTB_FORWARD_EXCEEDED | ERR_OTB_PACKAWAY_EXCEEDED)"
          - "if lot.disposition == PACKAWAY: lot.target_season_id references an existing MerchandiseSeason with status == DRAFT and != lot.season_id (ERR_TARGET_SEASON_NOT_DRAFT)"
        side_effects:
          - "if lot.disposition == IMMEDIATE: season.committed_forward_cents += lot.landed_cost_cents (calculation open_to_buy_forward_commit)"
          - "if lot.disposition == PACKAWAY: season.committed_packaway_cents += lot.landed_cost_cents (calculation open_to_buy_packaway_commit)"
          - "MerchandiseSeason.version += 1 (commitment mutates the season)"
          - "Lot.version += 1"
      - from: EVALUATED
        to: PASSED
        trigger: "POST /lots/{id}/pass"
        actor: Buyer
        preconditions:
          - "lot.status == EVALUATED (else ERR_INVALID_STATE)"
          - "Buyer tier SENIOR or lot.vendor.discretion_level == STANDARD (ERR_VENDOR_DISCRETION)"
        side_effects:
          - "Lot.version += 1"
      - from: OFFERED
        to: CANCELLED
        trigger: "POST /lots/{id}/cancel with reason, or system when offer expires unevaluated"
        actor: "Buyer | system"
        preconditions:
          - "lot.status == OFFERED (else ERR_INVALID_STATE)"
          - "cancel_reason in {VENDOR_PULL, BUYER_WITHDRAW, OFFER_EXPIRED}"
        side_effects:
          - "lot.cancel_reason set from payload (or OFFER_EXPIRED when system-fired)"
          - "Lot.version += 1"
      - from: EVALUATED
        to: CANCELLED
        trigger: "POST /lots/{id}/cancel"
        actor: Buyer
        preconditions:
          - "lot.status == EVALUATED (else ERR_INVALID_STATE)"
        side_effects:
          - "lot.cancel_reason set from payload"
          - "Lot.version += 1"

  - entity: PackawayHold
    initial_state: STORED
    terminal_states: [RELEASED, LIQUIDATED]
    transitions:
      - from: STORED
        to: AGING_REVIEW
        trigger: "POST /packaway-holds/{id}/aging-review (with trigger_reason AGING_THRESHOLD) or system aging sweep"
        actor: "InventoryPlanner | system"
        preconditions:
          - "hold.status == STORED (else ERR_INVALID_STATE)"
          - "hold.age_bucket != FRESH (i.e. days_since_entry >= AGING_REVIEW_DAYS; else ERR_AGING_REVIEW_PREMATURE)"
        side_effects:
          - "calculation holding_cost_accrual -> hold.accrued_holding_cost_cents"
          - "hold.review_count += 1"
          - "PackawayHold.version += 1"
      - from: AGING_REVIEW
        to: STORED
        trigger: "POST /packaway-holds/{id}/aging-review with trigger_reason DECISION_KEEP (reviewer elects to keep holding)"
        actor: InventoryPlanner
        preconditions:
          - "hold.status == AGING_REVIEW (else ERR_INVALID_STATE)"
        side_effects:
          - "calculation holding_cost_accrual -> hold.accrued_holding_cost_cents"
          - "hold.review_count += 1"
          - "PackawayHold.version += 1"
      - from: AGING_REVIEW
        to: RELEASED
        trigger: "POST /packaway-holds/{id}/aging-review with trigger_reason DECISION_RELEASE (reviewer releases early)"
        actor: InventoryPlanner
        preconditions:
          - "hold.status == AGING_REVIEW (else ERR_INVALID_STATE)"
          - "today within [release_window_start, release_window_end] inclusive (ERR_HOLD_WINDOW_CLOSED)"
        side_effects:
          - "calculation holding_cost_accrual -> final accrual at release date"
          - "hold.release_date = today; hold.review_count += 1"
          - "PackawayHold.version += 1"
      - from: AGING_REVIEW
        to: LIQUIDATED
        trigger: "POST /packaway-holds/{id}/aging-review with trigger_reason DECISION_LIQUIDATE"
        actor: InventoryPlanner
        preconditions:
          - "hold.status == AGING_REVIEW (else ERR_INVALID_STATE)"
        side_effects:
          - "calculation holding_cost_accrual -> final accrual at liquidation date"
          - "creates LiquidationOrder(lot_id = hold.lot_id, reason = PACKAWAY_STALE, status DRAFT, recovery_rate_pct = CASCADE_RECOVERY_RATE_PCT (0.25)) at the warehouse's nearest clearance store (Store with clearance_outlet == true in the warehouse zone; tie-break created_at ASC)"
          - "hold.review_count += 1"
          - "PackawayHold.version += 1"
      - from: STORED
        to: LIQUIDATED
        trigger: "POST /packaway-holds/{id}/liquidate"
        actor: InventoryPlanner
        preconditions:
          - "hold.status == STORED (else ERR_INVALID_STATE)"
          - "hold.age_bucket == STALE (days_since_entry >= STALE_DAYS; else ERR_AGING_REVIEW_PREMATURE)"
        side_effects:
          - "calculation holding_cost_accrual -> final accrual at liquidation date"
          - "creates LiquidationOrder(lot_id = hold.lot_id, reason = PACKAWAY_STALE, status DRAFT, recovery_rate_pct = CASCADE_RECOVERY_RATE_PCT (0.25)) at the warehouse's nearest clearance store (Store with clearance_outlet == true in the warehouse zone; tie-break created_at ASC)"
          - "PackawayHold.version += 1"
      - from: STORED
        to: RELEASED
        trigger: "POST /packaway-holds/{id}/release"
        actor: InventoryPlanner
        preconditions:
          - "hold.status == STORED (else ERR_INVALID_STATE)"
          - "release_window_start <= today <= release_window_end inclusive (ERR_HOLD_WINDOW_CLOSED)"
          - "today >= hold.target_season.start_date and target season status == OPEN (ERR_TARGET_SEASON_NOT_OPEN)"
          - "payload.expected_hold_version == hold.version (ERR_STALE_VERSION, 412)"
        side_effects:
          - "calculation holding_cost_accrual -> final accrual at release date"
          - "hold.release_date = today"
          - "PackawayHold.version += 1"
          - "the released units become eligible for allocation into target_season (an AllocationPlan may then be created against lot_id with season_id == target_season_id)"

  - entity: AllocationPlan
    initial_state: DRAFT
    terminal_states: [EXECUTED, SUPERSEDED, CANCELLED]
    transitions:
      - from: DRAFT
        to: APPROVED
        trigger: "POST /allocation-plans/{id}/approve"
        actor: AllocationManager
        preconditions:
          - "plan.status == DRAFT (else ERR_INVALID_STATE)"
          - "cluster coverage: every cluster_code key of plan.cluster_weights has at least one Store, and every cluster that has at least one Store is a key of cluster_weights (ERR_CLUSTER_UNCOVERED)"
          - "no other AllocationPlan for the same lot_id with status in {APPROVED, EXECUTED} (ERR_LOT_ALREADY_ALLOCATED)"
        side_effects:
          - "AllocationPlan.version += 1"
      - from: APPROVED
        to: EXECUTED
        trigger: "POST /allocation-plans/{id}/execute"
        actor: AllocationManager
        preconditions:
          - "plan.status == APPROVED (else ERR_INVALID_STATE)"
          - "plan.season.status == OPEN (ERR_SEASON_NOT_OPEN)"
        side_effects:
          - "calculation cluster_allocation runs: units rounded per cluster, then per store; creates one StoreSku per (store, lot_line) pair with allocation_plan_id == plan.id, floor_date = today, current_price_cents from the ticket for the store's zone (ticket must exist and be ACTIVE for every placed line, else ERR_TICKET_NOT_ISSUED)"
          - "AllocationPlan.version += 1"
      - from: DRAFT
        to: SUPERSEDED
        trigger: "system (when a newer plan for the same lot_id is approved via POST /allocation-plans with payload.expected_lot_version matching)"
        actor: system
        preconditions:
          - "plan.status == DRAFT"
        side_effects:
          - "plan.superseded_by_id set to the newer plan"
          - "AllocationPlan.version += 1"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /allocation-plans/{id}/cancel"
        actor: AllocationManager
        preconditions:
          - "plan.status == DRAFT (else ERR_INVALID_STATE)"
        side_effects:
          - "AllocationPlan.version += 1"
      - from: APPROVED
        to: CANCELLED
        trigger: "POST /allocation-plans/{id}/cancel"
        actor: AllocationManager
        preconditions:
          - "plan.status == APPROVED (else ERR_INVALID_STATE)"
        side_effects:
          - "AllocationPlan.version += 1"

  - entity: StoreSku
    initial_state: ON_FLOOR
    terminal_states: [SOLD_OUT, LIQUIDATED]
    transitions:
      - from: ON_FLOOR
        to: MARKED_DOWN
        trigger: "system markdown sweep (POST /_clock/set_current_utc advances the clock; sweep applies when weeks_on_floor >= (markdown_step + 1) * zone.markdown_cadence_weeks and store.clearance_outlet == false)"
        actor: system
        preconditions:
          - "store_sku.status == ON_FLOOR"
          - "weeks_on_floor >= (markdown_step + 1) * zone.markdown_cadence_weeks"
        side_effects:
          - "calculation markdown_cadence_step -> current_price_cents, markdown_step += 1"
          - "creates MarkdownEvent(event_type CADENCE)"
      - from: MARKED_DOWN
        to: MARKED_DOWN
        trigger: "system markdown sweep (repeat cadence step)"
        actor: system
        preconditions:
          - "store_sku.status == MARKED_DOWN"
          - "weeks_on_floor >= (markdown_step + 1) * zone.markdown_cadence_weeks"
        side_effects:
          - "calculation markdown_cadence_step -> current_price_cents, markdown_step += 1"
          - "creates MarkdownEvent(event_type CADENCE)"
      - from: ON_FLOOR
        to: CLEARANCE
        trigger: "system markdown sweep (weeks_on_floor >= zone.clearance_weeks)"
        actor: system
        preconditions:
          - "store_sku.status in {ON_FLOOR, MARKED_DOWN}"
          - "weeks_on_floor >= zone.clearance_weeks"
        side_effects:
          - "current_price_cents = CLEARANCE_FLOOR_MULTIPLIER * base price per markdown_cadence_step clearance branch"
          - "creates MarkdownEvent(event_type FORCE_CLEARANCE)"
      - from: MARKED_DOWN
        to: CLEARANCE
        trigger: "system markdown sweep (weeks_on_floor >= zone.clearance_weeks)"
        actor: system
        preconditions:
          - "weeks_on_floor >= zone.clearance_weeks"
        side_effects:
          - "same as ON_FLOOR -> CLEARANCE"
      - from: CLEARANCE
        to: LIQUIDATED
        trigger: "POST /liquidation-orders/{id}/execute"
        actor: StoreOpsLead
        preconditions:
          - "liquidation order status == APPROVED"
        side_effects:
          - "StoreSku.units_on_hand consumed to 0; liquidation_recovery computed (actual variant)"
      - from: ON_FLOOR
        to: LIQUIDATED
        trigger: "POST /liquidation-orders/{id}/execute (packaway-stale liquidations hit non-clearance floor stock)"
        actor: StoreOpsLead
        preconditions:
          - "liquidation order status == APPROVED"
        side_effects:
          - "same as CLEARANCE -> LIQUIDATED"
      - from: MARKED_DOWN
        to: LIQUIDATED
        trigger: "POST /liquidation-orders/{id}/execute"
        actor: StoreOpsLead
        preconditions:
          - "liquidation order status == APPROVED"
        side_effects:
          - "same as CLEARANCE -> LIQUIDATED"
      - from: ON_FLOOR
        to: SOLD_OUT
        trigger: "system (sell-through depletion recorded by POST /store-skus/{id}/deplete)"
        actor: StoreOpsLead
        preconditions:
          - "store_sku.status in {ON_FLOOR, MARKED_DOWN, CLEARANCE}"
          - "payload.units_sold > 0 and units_sold <= units_on_hand (ERR_NEGATIVE_ON_HAND)"
        side_effects:
          - "units_on_hand -= units_sold; status -> SOLD_OUT only when units_on_hand reaches 0"
      - from: MARKED_DOWN
        to: SOLD_OUT
        trigger: "POST /store-skus/{id}/deplete"
        actor: StoreOpsLead
        preconditions:
          - "same as ON_FLOOR -> SOLD_OUT"
        side_effects:
          - "same as ON_FLOOR -> SOLD_OUT"
      - from: CLEARANCE
        to: SOLD_OUT
        trigger: "POST /store-skus/{id}/deplete"
        actor: StoreOpsLead
        preconditions:
          - "same as ON_FLOOR -> SOLD_OUT"
        side_effects:
          - "same as ON_FLOOR -> SOLD_OUT"

  - entity: ShrinkCase
    initial_state: OPEN
    terminal_states: [CONFIRMED, VOIDED]
    transitions:
      - from: OPEN
        to: CONFIRMED
        trigger: "POST /shrink-cases/{id}/confirm"
        actor: ShrinkAuditor
        preconditions:
          - "case.status == OPEN (else ERR_INVALID_STATE)"
          - "if store_sku_id is not null: store_sku.units_on_hand >= units_lost (ERR_SHRINK_EXCEEDS_ON_HAND)"
        side_effects:
          - "calculation shrink_valuation -> shrink_value_cents"
          - "if store_sku_id is not null: store_sku.units_on_hand -= units_lost; if units_on_hand reaches 0 the StoreSku transitions to SOLD_OUT"
          - "ShrinkCase.version += 1"
      - from: OPEN
        to: VOIDED
        trigger: "POST /shrink-cases/{id}/void"
        actor: ShrinkAuditor
        preconditions:
          - "case.status == OPEN (else ERR_INVALID_STATE)"
        side_effects:
          - "ShrinkCase.version += 1"

  - entity: LiquidationOrder
    initial_state: DRAFT
    terminal_states: [EXECUTED, CANCELLED]
    transitions:
      - from: DRAFT
        to: APPROVED
        trigger: "POST /liquidation-orders/{id}/approve"
        actor: PlanningLead
        preconditions:
          - "order.status == DRAFT (else ERR_INVALID_STATE)"
        side_effects:
          - "calculation liquidation_recovery (provisional variant) -> recovery_value_cents"
          - "LiquidationOrder.version += 1"
      - from: APPROVED
        to: EXECUTED
        trigger: "POST /liquidation-orders/{id}/execute"
        actor: StoreOpsLead
        preconditions:
          - "order.status == APPROVED (else ERR_INVALID_STATE)"
        side_effects:
          - "order.actual_units = units pulled; calculation liquidation_recovery (actual variant) -> recovery_value_cents (overwrites provisional)"
          - "affected StoreSkus -> LIQUIDATED with units_on_hand consumed to 0"
          - "LiquidationOrder.version += 1"
      - from: DRAFT
        to: CANCELLED
        trigger: "POST /liquidation-orders/{id}/cancel"
        actor: PlanningLead
        preconditions:
          - "order.status == DRAFT (else ERR_INVALID_STATE)"
        side_effects:
          - "LiquidationOrder.version += 1"

  - entity: Receipt
    initial_state: OPEN
    terminal_states: [RECEIVED]
    transitions:
      - from: OPEN
        to: RECEIVED
        trigger: "POST /receipts/{id}/complete"
        actor: WarehouseClerk
        preconditions:
          - "receipt.status == OPEN (else ERR_INVALID_STATE)"
          - "every ReceiptLine on the receipt has received_qty recorded (ERR_RECEIPT_LINE_QTY_INVALID)"
        side_effects:
          - "calculation receipt_variance_valuation -> per-line variance_qty, extended_cost_cents, variance_value_cents"
          - "for each line with variance_qty > 0: creates one ShrinkCase(status OPEN, store_id = null, store_sku_id = null, lot_id = receipt.lot_id, shrink_type = MIXED_LOT_SHORTAGE when lot.mixed_lot else UNSCANNED_UNIT, merge_mode = HIGH_VALUE_SORT when lot.mixed_lot else FIFO, units_lost = 0, units_untraceable = variance_qty)"
          - "season spend recompute (calculations open_to_buy_forward_commit / open_to_buy_packaway_commit spend side): spent_forward_cents / spent_packaway_cents updated from extended_cost_cents; MerchandiseSeason.version += 1"
          - "Receipt.version += 1"

  - entity: Ticket
    initial_state: ACTIVE
    terminal_states: [VOIDED]
    transitions:
      - from: ACTIVE
        to: VOIDED
        trigger: "POST /tickets/{id}/void"
        actor: PricingAnalyst
        preconditions:
          - "ticket.status == ACTIVE (else ERR_INVALID_STATE)"
          - "no StoreSku with ticket_id == ticket.id and status in {ON_FLOOR, MARKED_DOWN, CLEARANCE} (ERR_TICKET_IN_USE)"
        side_effects:
          - "none beyond status change (Ticket has no version field: common_fields false)"

# =============================================================================
# §1.2.1 Concurrency Rules
# =============================================================================
concurrency_rules:

  - rule_id: lot-accept-stale-season
    parent_entity: MerchandiseSeason
    write_endpoint: "POST /lots/{id}/accept"
    occ_field: "expected_season_version"
    description: |
      Accepting an evaluated Lot commits budget against its MerchandiseSeason and
      bumps season.version. A client whose view of the season predates the latest
      commitment (e.g. another accepted lot has since advanced the version) holds
      a stale budget picture, so the accept is rejected with ERR_STALE_VERSION
      rather than committing against obsolete open-to-buy figures.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: hold-release-stale-hold
    parent_entity: PackawayHold
    write_endpoint: "POST /packaway-holds/{id}/release"
    occ_field: "expected_hold_version"
    description: |
      Releasing a PackawayHold finalizes its accrued holding cost and bumps
      hold.version. A client whose view of the hold predates the latest aging
      review (which recomputes accrual and advances the version) would release
      against an obsolete cost basis, so the release is rejected with
      ERR_STALE_VERSION.
    error_id: ERR_STALE_VERSION
    http_status: 412

  - rule_id: plan-create-stale-lot
    parent_entity: Lot
    write_endpoint: "POST /allocation-plans"
    occ_field: "expected_lot_version"
    description: |
      Creating an AllocationPlan for a lot whose version has advanced since the
      client last observed it is rejected: under the product rule a newly
      approved plan legitimately supersedes the lot's prior DRAFT plan, so a
      create carrying an old expected_lot_version acts on a stale lot view and
      fails with ERR_STALE_VERSION.
    error_id: ERR_STALE_VERSION
    http_status: 412

# =============================================================================
# §1.3 Calculation Rules Table
# =============================================================================
calculations:

  - name: deal_quality_score
    trigger: "POST /lots/{id}/evaluate (including re-evaluation from EVALUATED)"
    algorithm: weighted_scoring
    formula: |
      # mode (a): >= 3 inputs with non-linear interaction
      margin_pct = max(0.0, (estimated_unit_retail_cents - unit_cost_basis_cents) / estimated_unit_retail_cents)
        where unit_cost_basis_cents = landed_cost_cents / unit_count (division BEFORE rounding)
      sell_through = min(expected_sell_through_pct, 1.0)
      discretion_penalty = 15 if vendor.discretion_level == CONFIDENTIAL else (25 if QUIET else 0)
      lot_type_bonus = {CLOSEOUT: 10, CANCELLATION: 5, PACKAWAY: 0}[lot_type]
      raw = 100 * (0.6 * margin_pct + 0.4 * sell_through) - discretion_penalty + lot_type_bonus
      deal_quality_score = clamp(raw, 0.0, 100.0)
      landed_cost_cents = (negotiated_price_cents if supplied else asking_price_cents) + FREIGHT_SURCHARGE_CENTS_PER_LOT
    input_set: "the Lot being evaluated, its Vendor, and lot fields (unit_count, expected_sell_through_pct, estimated_unit_retail_cents)"
    constants:
      FREIGHT_SURCHARGE_CENTS_PER_LOT: 150000
      WEIGHT_MARGIN: 0.6
      WEIGHT_SELL_THROUGH: 0.4
      DISCRETION_PENALTY_CONFIDENTIAL: 15
      DISCRETION_PENALTY_QUIET: 25
      LOT_TYPE_BONUS_CLOSEOUT: 10
      LOT_TYPE_BONUS_CANCELLATION: 5
      LOT_TYPE_BONUS_PACKAWAY: 0
    precision: "2 decimal places, round_half_up; landed_cost_cents is integer cents (no rounding needed)"
    variants: []

  - name: open_to_buy_forward_commit
    trigger: "Lot EVALUATED -> ACCEPTED with disposition IMMEDIATE; receipt completion (spend side); season open/close reads"
    algorithm: threshold
    formula: |
      # mode (c): circular-looking dependency, evaluation order pinned
      # STEP 1 (compute caps from budget, never from commitments):
      packaway_cap_cents   = floor(department_otb_budget_cents * packaway_reserve_ratio)
      forward_cap_cents    = department_otb_budget_cents - packaway_cap_cents
      # STEP 2 (compute available from caps and provisional commitments):
      forward_available    = forward_cap_cents - committed_forward_cents
      packaway_available   = packaway_cap_cents - committed_packaway_cents
      # STEP 3 (admission check on the candidate lot):
      admit iff candidate_landed_cost_cents <= forward_available  (disposition IMMEDIATE)
      # STEP 4 (only after admission): committed_forward_cents += candidate_landed_cost_cents
      # Spend side (finalization, receipt completion):
      #   per receipt line rl: extended_cost_cents = round_half_up(rl.received_qty * lot.landed_cost_cents / lot.unit_count)
      spent_forward_cents = sum over ReceiptLines rl where rl.receipt.status == RECEIVED
                            and rl.receipt.lot.disposition == IMMEDIATE
                            of rl.extended_cost_cents
      over_spend_alert = spent_forward_cents > committed_forward_cents   # reported on season reads
    input_set: "MerchandiseSeason + all Lots with season_id == season.id and status == ACCEPTED; ReceiptLines on RECEIVED receipts whose receipt.lot.disposition == IMMEDIATE"
    constants:
      PACKAWAY_RESERVE_FLOOR: 0.0
    precision: "integer cents; floor for the cap multiplication"
    variants:
      - name: provisional_view
        when: "lot acceptance and any read before receipt completion"
        difference: "availability computed from committed_* (provisional landed cost at acceptance)"
      - name: finalized_view
        when: "after receipt completion"
        difference: "spent_* computed from actual extended_cost_cents; over-spend vs committed is reported, never silently absorbed"

  - name: open_to_buy_packaway_commit
    trigger: "Lot EVALUATED -> ACCEPTED with disposition PACKAWAY"
    algorithm: threshold
    formula: |
      # same pinned evaluation order as open_to_buy_forward_commit, packaway side:
      # STEP 1: packaway_cap_cents = floor(department_otb_budget_cents * packaway_reserve_ratio)
      # STEP 2: packaway_available = packaway_cap_cents - committed_packaway_cents
      # STEP 3: admit iff candidate_landed_cost_cents <= packaway_available
      # STEP 4: committed_packaway_cents += candidate_landed_cost_cents
      # Packaway acceptance ALSO accrues a projected holding cost reservation:
      projected_holding_cents = estimated_pallets * warehouse_rate_cents_per_month * months_to_target
      # months_to_target = ceil((target_season.start_date - today).days / 30); projected cost is
      # informational on the season read and does NOT consume the cap.
    input_set: "MerchandiseSeason + ACCEPTED PACKAWAY lots; projected holding cost derived from the receiving warehouse rate"
    constants: {}
    precision: "integer cents"
    variants: []

  - name: holding_cost_accrual
    trigger: "PackawayHold creation (0), every aging review, and release/liquidation"
    algorithm: decay_function
    formula: |
      # dual-variant on the PackawayHold entity domain
      days_held = (as_of_date - entry_date).days    # as_of_date = today for reviews; release_date on release
      full_months = days_held // 30
      remainder_days = days_held - 30 * full_months
      # base (pro-rata) variant:
      accrued_cents = pallet_count * rate_cents_per_month * full_months
                      + floor(pallet_count * rate_cents_per_month * remainder_days / 30)
      # month-boundary variant bills any started month in full:
      # accrued_cents = pallet_count * rate_cents_per_month * (full_months + (1 if remainder_days > 0 else 0))
      # variant selection is by the storing warehouse's zone: warehouses with zone_code == WC
      # use month_boundary; every other zone uses pro_rata_daily.
    input_set: "the PackawayHold and its Warehouse.monthly_holding_rate_per_pallet_cents"
    constants:
      DAYS_PER_BILLING_MONTH: 30
    precision: "integer cents; floor on the pro-rata remainder"
    variants:
      - name: pro_rata_daily
        when: "default for all holds (base variant above)"
        difference: "partial months billed at day granularity with floor"
      - name: month_boundary
        when: "holds whose warehouse has zone_code == WC (west-coast billing convention)"
        difference: "any started month billed in full; same 30-day month definition"

  - name: hold_age_bucket
    trigger: "system aging sweep on every logical-clock advance; also recomputed inside holding_cost_accrual"
    algorithm: threshold
    formula: |
      days_since_entry = (today - entry_date).days
      bucket = FRESH if days_since_entry < AGING_REVIEW_DAYS
               else AGING if days_since_entry < STALE_DAYS
               else STALE
      # boundary: exactly AGING_REVIEW_DAYS days -> AGING (>=, not >);
      #           exactly STALE_DAYS days -> STALE
    input_set: "all PackawayHolds with status in {STORED, AGING_REVIEW}"
    constants:
      AGING_REVIEW_DAYS: 90
      STALE_DAYS: 270
    precision: "integer days"
    variants: []

  - name: compare_at_substantiation
    trigger: "POST /tickets (ticket issue for a lot line in a zone)"
    algorithm: threshold
    formula: |
      # dual-variant on the Ticket entity domain
      # vendor-claimed variant:
      if compare_at_claim_cents >= ceil(ticket_retail_cents * zone.compare_at_multiplier):
          compare_at_cents = compare_at_claim_cents
          compare_at_omitted = false
      else:
          compare_at_cents = null
          compare_at_omitted = true        # print ticket without compare-at; do NOT reject
      # zone-book variant: when the zone publishes a zone_book reference for the style,
      # compare_at_candidate = min(compare_at_claim_cents, zone_book_cents) subject to the
      # same multiplier gate; can substantiate values below the vendor claim.
      # vendor_claim zones: MW, SE, TX, MT. zone_book zones: NE, WC.
      # ticket_retail_cents (the gate base) = round_half_up(target_retail_cents * zone_retail_multiplier)
      # then adjusted down to the nearest 9-ending price; zone_retail_multiplier = 1.0 for every
      # zone in this benchmark (regional differentiation enters through the compare-at multiplier,
      # not through retail).
    input_set: "LotLine.compare_at_claim_cents, LotLine.target_retail_cents, PriceZone.compare_at_multiplier"
    constants:
      ZONE_RETAIL_MULTIPLIER: 1.0
      ZONE_BOOK_ZONES: "NE,WC"
    precision: "integer cents; ceil on the multiplier gate so the boundary is exact"
    variants:
      - name: vendor_claim
        when: "zones without a published zone book (MW, SE, TX, MT)"
        difference: "compare-at taken from vendor claim gated by the zone multiplier"
      - name: zone_book
        when: "zones with a published zone book (NE, WC)"
        difference: "compare-at = min(vendor claim, zone book) then gated; can substantiate lower values"

  - name: markdown_cadence_step
    trigger: "system markdown sweep on logical-clock advance (and recompute-only at season close)"
    algorithm: threshold
    formula: |
      # mode (b): nested rounding where order matters
      # PINNED ORDER: per-StoreSku step reduction first (round the new price per SKU),
      # never a bulk rate applied then distributed.
      weeks_on_floor = floor((today - floor_date).days / 7)
      zone = store.zone; store = store_sku.store
      if store.clearance_outlet:
          # clearance stores skip cadence entirely
          no change until weeks_on_floor >= zone.clearance_weeks
      if weeks_on_floor >= zone.clearance_weeks:
          new_price = round_half_up_to_9_ending(base_price_cents * CLEARANCE_FLOOR_MULTIPLIER)
          # clearance floor: 0.30 * base, ending in 9 cents
      elif weeks_on_floor >= (markdown_step + 1) * zone.markdown_cadence_weeks:
          # exactly one step per sweep per SKU even if multiple cadence boundaries crossed:
          new_price = round_half_up_to_9_ending(current_price_cents * (1 - MARKDOWN_STEP_RATE))
      # round_half_up_to_9_ending(x): round x to integer cents (half up), then adjust down to
      # the nearest price ending in 9 cents (e.g. 2452 -> 2449; 2400 -> 2399).
    input_set: "StoreSkus with status in {ON_FLOOR, MARKED_DOWN} whose season status == OPEN; the store's PriceZone"
    constants:
      MARKDOWN_STEP_RATE: 0.20
      CLEARANCE_FLOOR_MULTIPLIER: 0.30
    precision: "integer cents, round_half_up then 9-ending adjustment"
    variants: []

  - name: receipt_variance_valuation
    trigger: "POST /receipts/{id}/complete"
    algorithm: aggregation
    formula: |
      # mode (b): nested rounding, pinned order
      # PINNED ORDER: value each line FIRST, then sum (per-line valuation, never lot-average).
      for each ReceiptLine rl:
          rl.variance_qty = rl.declared_qty - rl.received_qty
          rl.extended_cost_cents = round_half_up(rl.received_qty * lot.landed_cost_cents / lot.unit_count)
          rl.variance_value_cents = round_half_up(rl.variance_qty * lot.landed_cost_cents / lot.unit_count)
      receipt_total_variance_cents = sum of rl.variance_value_cents over lines
    input_set: "ReceiptLines of the completing Receipt; the parent Lot (landed_cost_cents, unit_count)"
    constants: {}
    precision: "integer cents, round_half_up per line before summing"
    variants: []

  - name: shrink_valuation
    trigger: "POST /shrink-cases/{id}/confirm"
    algorithm: waterfall_allocation
    formula: |
      # chronological application with merge-policy variants
      if store_sku_id is not null:
          unit_value_cents = round_half_up(lot.landed_cost_cents / lot.unit_count)
          shrink_value_cents = units_lost * unit_value_cents
      else:
          # mixed-lot untraceable merge: order the lot's LotLines by merge policy
          if merge_mode == FIFO: order LotLines by created_at ASC (tie-break: created_at ASC only)
          if merge_mode == HIGH_VALUE_SORT: order by compare_at_claim_cents DESC, tie-break created_at ASC
          shrink_value_cents = sum over the first units_untraceable units drawn in that order
                               of the line's unit_cost_cents
    input_set: "the ShrinkCase; its StoreSku/Lot when traceable; the lot's LotLines when merged"
    constants: {}
    precision: "integer cents, round_half_up on the per-unit basis"
    variants:
      - name: fifo_merge
        when: "merge_mode == FIFO (default for non-mixed lots)"
        difference: "units valued in lot-line creation order"
      - name: high_value_sort_merge
        when: "merge_mode == HIGH_VALUE_SORT (mandatory for mixed_lot == true)"
        difference: "units valued from the highest compare-at lines first; can differ materially from FIFO"

  - name: cluster_allocation
    trigger: "POST /allocation-plans/{id}/execute"
    algorithm: waterfall_allocation
    formula: |
      # Efraimidis-Spirakis-free deterministic proportional allocation with largest-remainder:
      # STEP 1: eligible stores = stores with cluster_code in cluster_weights keys and
      #         storage_capacity_units > 0, ordered by cluster then store.created_at ASC.
      # STEP 2: cluster_quota_c = floor(total_units * weight_c / sum(weights)) for each cluster;
      #         distribute the remainder (total_units - sum(quota)) one unit at a time to clusters
      #         by descending fractional part; tie-break: cluster_code lexicographic ASC.
      # STEP 3: within a cluster, store_quota_s = floor(cluster_quota_c / n_stores_in_cluster);
      #         remainder one unit per store in store.created_at ASC order, but a store never
      #         receives more than storage_capacity_units; overflow units spill to the next store
      #         in created_at order within the cluster, then to other clusters by descending
      #         weight (tie-break cluster_code ASC).
      # STEP 4: a store receiving 0 units produces no StoreSku row (empty allocation is not an error).
      # Clearance stores: clearance_outlet == true stores are ranked FIRST within their cluster
      # regardless of created_at when reason == CLEARANCE_WEEKS_EXCEEDED liquidation context.
    input_set: "AllocationPlan (total_units, cluster_weights), eligible Stores, and each LotLine's ticket for the store's zone"
    constants: {}
    precision: "integer units; largest-remainder with pinned tie-breaks"
    variants: []

  - name: liquidation_recovery
    trigger: "POST /liquidation-orders/{id}/approve (provisional) and /execute (actual)"
    algorithm: aggregation
    formula: |
      provisional (at approve):
          recovery_value_cents = round_half_up(expected_units * current_unit_basis_cents * recovery_rate_pct)
      actual (at execute):
          recovery_value_cents = round_half_up(actual_units * current_unit_basis_cents * recovery_rate_pct)
      current_unit_basis_cents = store_sku.current_price_cents at the time of the variant's run
    input_set: "the LiquidationOrder and its affected StoreSkus"
    constants:
      CASCADE_RECOVERY_RATE_PCT: 0.25
    precision: "integer cents, round_half_up"
    variants:
      - name: provisional
        when: "at approve, before units are pulled"
        difference: "uses expected_units"
      - name: actual
        when: "at execute"
        difference: "uses actual_units; overwrites the provisional value"

# =============================================================================
# §1.4 Validation Rules Table (ordered by priority)
# =============================================================================
validations:

  - priority: 1
    category: auth
    check: "X-User-Role header present and one of the declared roles; X-User-ID present (entity-backed roles must reference an existing entity id of that type when ownership matters)"
    error_id: ERR_UNAUTHENTICATED
    http_status: 401
    applies_to: "all"

  - priority: 2
    category: auth
    check: "role is permitted for the endpoint per §1.5 roles list"
    error_id: ERR_UNAUTHORIZED
    http_status: 403
    applies_to: "all"

  - priority: 3
    category: existence
    check: "every path id and body FK resolves to an existing resource, validated left-to-right in the path (season -> lot -> line -> ...)"
    error_id: ERR_NOT_FOUND
    http_status: 404
    applies_to: "all"

  - priority: 4
    category: existence
    check: "request body well-formed: required fields present, types match, enum values in range, unknown fields rejected"
    error_id: ERR_INVALID_REQUEST
    http_status: 400
    applies_to: "all"

  - priority: 5
    category: state
    check: "target resource in a valid from-state for the attempted transition"
    error_id: ERR_INVALID_STATE
    http_status: 409
    applies_to: "all action endpoints"

  - priority: 6
    category: business_temporal
    check: "lot evaluation/acceptance occurs strictly before lot.offer_expires_at (logical clock)"
    error_id: ERR_OFFER_EXPIRED
    http_status: 422
    applies_to: ["POST /lots/{id}/evaluate", "POST /lots/{id}/accept"]

  - priority: 7
    category: business_safety
    check: "vendor discretion: CONFIDENTIAL/QUIET vendors' lots may be evaluated, accepted, or passed only by Buyer tier SENIOR"
    error_id: ERR_VENDOR_DISCRETION
    http_status: 403
    applies_to: ["POST /lots/{id}/evaluate", "POST /lots/{id}/accept", "POST /lots/{id}/pass", "GET /lots", "GET /lots/{id}"]

  - priority: 8
    category: business_temporal
    check: "packaway release occurs within [release_window_start, release_window_end] inclusive and at/after target season start (ERR_HOLD_WINDOW_CLOSED for the window; ERR_TARGET_SEASON_NOT_OPEN for a target season not yet OPEN)"
    error_id: ERR_HOLD_WINDOW_CLOSED
    http_status: 422
    applies_to: ["POST /packaway-holds/{id}/release", "POST /packaway-holds/{id}/aging-review"]

  - priority: 9
    category: business_temporal
    check: "aging review requires days_since_entry >= AGING_REVIEW_DAYS (age_bucket != FRESH); direct liquidation requires days_since_entry >= STALE_DAYS (age_bucket == STALE)"
    error_id: ERR_AGING_REVIEW_PREMATURE
    http_status: 422
    applies_to: ["POST /packaway-holds/{id}/aging-review", "POST /packaway-holds/{id}/liquidate"]

  - priority: 10
    category: business_referential
    check: "PACKAWAY lot acceptance requires target_season_id referencing an existing DRAFT season != buying season"
    error_id: ERR_TARGET_SEASON_NOT_DRAFT
    http_status: 422
    applies_to: ["POST /lots/{id}/accept", "POST /lots", "POST /packaway-holds"]

  - priority: 11
    category: business_fiscal
    check: "IMMEDIATE lot landed cost fits within forward open-to-buy availability (forward_cap - committed_forward)"
    error_id: ERR_OTB_FORWARD_EXCEEDED
    http_status: 422
    applies_to: ["POST /lots/{id}/accept"]

  - priority: 12
    category: business_fiscal
    check: "PACKAWAY lot landed cost fits within packaway open-to-buy availability (packaway_cap - committed_packaway)"
    error_id: ERR_OTB_PACKAWAY_EXCEEDED
    http_status: 422
    applies_to: ["POST /lots/{id}/accept"]

  - priority: 13
    category: business_temporal
    check: "allocation plan execute requires the plan's selling season status == OPEN"
    error_id: ERR_SEASON_NOT_OPEN
    http_status: 422
    applies_to: ["POST /allocation-plans/{id}/execute"]

  - priority: 14
    category: business_constraint
    check: "packaway hold creation has sufficient pallet capacity at the warehouse (existing STORED/AGING_REVIEW holds + new <= pallet_capacity)"
    error_id: ERR_WAREHOUSE_OVER_CAPACITY
    http_status: 422
    applies_to: ["POST /packaway-holds"]

  - priority: 15
    category: business_referential
    check: "every placed lot line has an ACTIVE ticket for the store's zone before allocation execute or manual placement"
    error_id: ERR_TICKET_NOT_ISSUED
    http_status: 422
    applies_to: ["POST /allocation-plans/{id}/execute", "POST /store-skus"]

  - priority: 15
    category: business_referential
    check: "ticket issuance requires the lot line's lot to be ACCEPTED and the zone_code to reference an existing PriceZone"
    error_id: ERR_TICKET_NOT_ISSUED
    http_status: 422
    applies_to: ["POST /tickets"]

  - priority: 16
    category: business_constraint
    check: "store placement does not exceed store.storage_capacity_units (existing on-hand + placed <= capacity)"
    error_id: ERR_STORE_OVER_CAPACITY
    http_status: 422
    applies_to: ["POST /store-skus", "POST /allocation-plans/{id}/execute"]

  - priority: 17
    category: business_constraint
    check: "shrink confirmation does not drive units_on_hand negative; deplete units_sold <= units_on_hand"
    error_id: ERR_NEGATIVE_ON_HAND
    http_status: 422
    applies_to: ["POST /shrink-cases/{id}/confirm", "POST /store-skus/{id}/deplete"]

  - priority: 18
    category: business_constraint
    check: "receipt line received_qty within [0, declared_qty]"
    error_id: ERR_RECEIPT_LINE_QTY_INVALID
    http_status: 422
    applies_to: ["POST /receipts/{id}/complete", "PATCH /receipts/{id}/lines/{lineId}"]

  - priority: 19
    category: business_referential
    check: "season close blocked while lots are unadjudicated, holds unclosed, or plans unexecuted"
    error_id: ERR_OPEN_LOTS_REMAIN
    http_status: 422
    applies_to: ["POST /merchandise-seasons/{id}/close"]

  - priority: 20
    category: business_referential
    check: "season close blocked while packaway holds for the season are still STORED or AGING_REVIEW"
    error_id: ERR_PACKAWAY_HOLDS_ACTIVE
    http_status: 422
    applies_to: ["POST /merchandise-seasons/{id}/close"]

  - priority: 21
    category: business_constraint
    check: "only one season may be OPEN at a time"
    error_id: ERR_SEASON_ALREADY_OPEN
    http_status: 422
    applies_to: ["POST /merchandise-seasons/{id}/open"]

  - priority: 22
    category: business_constraint
    check: "allocation plan approve blocked when another plan for the same lot is APPROVED or EXECUTED"
    error_id: ERR_LOT_ALREADY_ALLOCATED
    http_status: 422
    applies_to: ["POST /allocation-plans/{id}/approve"]

  - priority: 23
    category: business_constraint
    check: "ticket void blocked while live store stock references the ticket"
    error_id: ERR_TICKET_IN_USE
    http_status: 422
    applies_to: ["POST /tickets/{id}/void"]

  - priority: 24
    category: business_constraint
    check: "uniqueness: season_code, vendor_code, zone_code, lot_code, warehouse_code, store_code; one PackawayHold per lot_id; one open AllocationPlan chain per lot"
    error_id: ERR_DUPLICATE_CODE
    http_status: 409
    applies_to: ["POST /merchandise-seasons", "POST /vendors", "POST /price-zones", "POST /lots", "POST /warehouses", "POST /stores", "POST /packaway-holds"]

  - priority: 25
    category: business_constraint
    check: "OCC: expected_*_version matches the parent's current version"
    error_id: ERR_STALE_VERSION
    http_status: 412
    applies_to: ["POST /lots/{id}/accept", "POST /packaway-holds/{id}/release", "POST /allocation-plans"]

# =============================================================================
# §1.5 API Endpoint Table
# =============================================================================
endpoints:

  # --- logical clock (test-driving) ---
  - method: POST
    path: "/_clock/set_current_utc"
    description: "Set the logical clock. Before any call to this endpoint the logical clock reads exactly 2026-09-01T00:00:00Z (server startup default; never falls back to wall-clock). Advancing the clock triggers the aging sweep (hold_age_bucket) and the markdown sweep (markdown_cadence_step)."
    roles: [PlanningLead]
    code: 200
    input: [to_iso8601]
    output: { current_utc: datetime }
    side_effects: ["hold_age_bucket recompute over STORED/AGING_REVIEW holds", "markdown_cadence_step sweep over live StoreSkus", "weeks_on_floor recompute"]

  # --- MerchandiseSeason ---
  - method: POST
    path: "/merchandise-seasons"
    description: "Create a season in DRAFT"
    roles: [PlanningLead]
    code: 201
    input: [season_code, start_date, end_date, department_otb_budget_cents, packaway_reserve_ratio]
    output: MerchandiseSeason
    side_effects: ["committed_*/spent_* initialized to 0"]

  - method: GET
    path: "/merchandise-seasons"
    description: "List seasons"
    roles: [PlanningLead, Buyer, AllocationManager, InventoryPlanner, PricingAnalyst, WarehouseClerk, StoreOpsLead, ShrinkAuditor]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "MerchandiseSeason[]"
    side_effects: []

  - method: GET
    path: "/merchandise-seasons/{id}"
    description: "Get a season including computed open-to-buy fields and over_spend alert"
    roles: [PlanningLead, Buyer, AllocationManager, InventoryPlanner, PricingAnalyst, WarehouseClerk, StoreOpsLead, ShrinkAuditor]
    code: 200
    input: []
    output: MerchandiseSeason
    side_effects: []

  - method: POST
    path: "/merchandise-seasons/{id}/open"
    description: "Open a DRAFT season (only one OPEN at a time)"
    roles: [PlanningLead]
    code: 200
    input: []
    output: MerchandiseSeason
    side_effects: ["MerchandiseSeason.version += 1"]

  - method: POST
    path: "/merchandise-seasons/{id}/close"
    description: "Close an OPEN season once all lots adjudicated, holds closed, plans executed"
    roles: [PlanningLead]
    code: 200
    input: []
    output: MerchandiseSeason
    side_effects: ["MerchandiseSeason.version += 1", "weeks_on_floor recompute on live StoreSkus"]

  # --- Vendor ---
  - method: POST
    path: "/vendors"
    description: "Register a vendor"
    roles: [PlanningLead]
    code: 201
    input: [legal_name, vendor_code, discretion_level, ticket_discretion_required, default_zone_code, vendor_tier]
    output: Vendor
    side_effects: []

  - method: GET
    path: "/vendors"
    description: "List vendors"
    roles: [PlanningLead, Buyer, AllocationManager, InventoryPlanner, PricingAnalyst]
    code: 200
    input: ["limit?", "offset?", "discretion_level?"]
    output: "Vendor[]"
    side_effects: []

  - method: GET
    path: "/vendors/{id}"
    description: "Get a vendor"
    roles: [PlanningLead, Buyer, AllocationManager, InventoryPlanner, PricingAnalyst]
    code: 200
    input: []
    output: Vendor
    side_effects: []

  - method: GET
    path: "/vendors/{id}/lots"
    description: "Reverse-reachability: lots offered by a vendor (visibility per discretion rule)"
    roles: [Buyer, PlanningLead, PricingAnalyst]
    code: 200
    input: ["limit?", "offset?", "status?"]
    output: "Lot[]"
    side_effects: []

  # --- PriceZone ---
  - method: POST
    path: "/price-zones"
    description: "Create a price zone"
    roles: [PricingAnalyst]
    code: 201
    input: [zone_code, compare_at_multiplier, markdown_cadence_weeks, clearance_weeks]
