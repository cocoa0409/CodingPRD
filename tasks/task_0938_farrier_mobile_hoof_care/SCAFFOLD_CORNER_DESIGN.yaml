  # =========================================================================
  # Validations
  # =========================================================================
  - section: validations
    instances:

      - name: corner_reset_on_a_barefoot_limb_is_rejected
        claim_type: Violation to Error
        grounds: ["validations[priority=38]", "errors[ERR_RESET_REQUIRES_SHOD_LIMB]", state_machines.LimbState]
        distinguishing_aspect: "A RESET has no shoe to reuse on a BAREFOOT limb, so the line is refused with 422 ERR_RESET_REQUIRES_SHOD_LIMB and nothing is written."
        test_recipe:
          setup: ["A fresh horse whose four limbs are all BAREFOOT and one UNROUTED appointment."]
          setup_api_calls:
            - call: "POST /barns"
              payload: { name: "Ridgeview", zone: "A", served_weekdays: ["MON", "TUE", "WED", "THU", "FRI"], access_open_minute: 420, access_close_minute: 1020, blackout_dates: [] }
              as: PlatformAdmin
              captures: { barn_a: "$.data.id" }
