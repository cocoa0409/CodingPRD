          trigger:
            - call: "GET /api/contractors/${con_id}"
              as: PlatformAdmin
              captures: { v_mid: $.data.verification_status, s_mid: $.data.standing_status }
            - call: "POST /api/contractors/${con_id}/verify"
              payload: { outcome: "VERIFIED" }
              as: ComplianceOfficer
              captures: { v_end: $.data.verification_status, s_end: $.data.standing_status }
          assert:
            - "after finalize: Contractor.verification_status == VERIFICATION_FAILED AND standing_status == SUSPENDED_STANDING (final score 0.3*12.0 + 45 + 45 = 93.6 >= 75 => CRITICAL)"
            - "RiskAudit(${audit_id}).risk_level == CRITICAL"
            - "after re-verify: verification_status == VERIFIED while standing_status REMAINS SUSPENDED_STANDING — the two dimensions moved independently"
      - name: nsm_filing_rejection_and_correction_cycles
        grounds:
          - state_machines.TaxForm1099Filing
          - entities.TaxForm1099Filing.fields.status
        distinguishing_aspect: |
          Entity = TaxForm1099Filing (distinct from Contractor): cyclic machine —
          SUBMITTED -> REJECTED_AGENCY -> SUBMITTED (resubmission loop) and
          ACCEPTED -> SUPERSEDED via CORRECTION submission. A single filing rides
          the rejection loop once and is then superseded by a correction filing.
        test_recipe:
          setup:
            - "VERIFIED contractor; ORIGINAL filing tax_year 2026, reportable 100000 (two in-year SERVICE_FEE items)"
          setup_api_calls:
            - call: "POST /api/jurisdictions"
              payload: { code: "US-CA", test_type: "ABC_TEST", state_filing_threshold_cents: 0, max_active_exceptions: 5, min_insurance_cents: 100000 }
              as: PlatformAdmin
              captures: { jur_ca: $.data.id }
            - call: "POST /api/contractors"
              payload: { legal_name: "Cycle Rider LLC", entity_type: "LLC", ein: "12-0001681", insurance_coverage_cents: 500000 }
              as: EngagementManager
              captures: { con_id: $.data.id }
            - call: "POST /api/contractors/${con_id}/verify"
              payload: { outcome: "VERIFIED" }
              as: ComplianceOfficer
            - call: "POST /api/filings"
              payload: { contractor_id: "${con_id}", state_jurisdiction_id: "${jur_ca}", tax_year: 2026, payment_line_items: [ { amount_cents: 60000, payment_date: "2026-03-10", kind: "SERVICE_FEE" }, { amount_cents: 40000, payment_date: "2026-06-15", kind: "SERVICE_FEE" } ] }
              as: TaxReportingSpecialist
              captures: { fil_id: $.data.id }
            - call: "POST /api/filings/${fil_id}/submit"
              payload: {}
              as: TaxReportingSpecialist
            - call: "POST /api/filings/${fil_id}/agency-response"
              payload: { outcome: "REJECTED" }
              as: TaxReportingSpecialist
              captures: { st_rej: $.data.status }
          trigger:
            - call: "POST /api/filings/${fil_id}/submit"
              payload: {}
              as: TaxReportingSpecialist
              captures: { st_resub: $.data.status }
            - call: "POST /api/filings/${fil_id}/agency-response"
              payload: { outcome: "ACCEPTED" }
              as: TaxReportingSpecialist
              captures: { st_acc: $.data.status }
            - call: "POST /api/filings"
              payload: { contractor_id: "${con_id}", state_jurisdiction_id: "${jur_ca}", tax_year: 2026, kind: "CORRECTION", corrects_filing_id: "${fil_id}", payment_line_items: [ { amount_cents: 60000, payment_date: "2026-03-10", kind: "SERVICE_FEE" }, { amount_cents: 45000, payment_date: "2026-06-15", kind: "SERVICE_FEE" } ] }
              as: TaxReportingSpecialist
              captures: { corr_id: $.data.id }
            - call: "POST /api/filings/${corr_id}/submit"
              payload: {}
              as: TaxReportingSpecialist
              captures: { st_corr: $.data.status }
            - call: "GET /api/filings/${fil_id}"
              as: PlatformAdmin
              captures: { st_orig: $.data.status }
            - call: "GET /api/contractors/${con_id}"
              as: PlatformAdmin
              captures: { lifetime: $.data.lifetime_reported_cents }
          assert:
            - "resubmission loop: status REJECTED_AGENCY -> SUBMITTED -> ACCEPTED rode the cycle"
            - "correction submit: original filing (${fil_id}).status == SUPERSEDED; correction (${corr_id}).status == SUBMITTED"
            - "Contractor(${con_id}).lifetime_reported_cents == 105000 (correction 60000+45000 in, original 100000 out)"

  - rule_id: transitive_cascade
    instances:
      - name: tc_suspend_cascade_engagement_contract_amendment_exception
        grounds:
          - state_machines.Engagement.ACTIVE_to_SUSPENDED
          - state_machines.ContractAgreement.EXECUTED_to_SUSPENDED
          - state_machines.ContractAmendment.PROPOSED_to_VOIDED
          - state_machines.ExceptionGrant.ACTIVE_to_REVOKED
        distinguishing_aspect: |
          Depth-4 chain from POST /api/engagements/{id}/suspend: engagement
          SUSPENDED mutates contract (EXECUTED -> SUSPENDED); the contract
          mutation voids its PROPOSED amendment; the amendment voiding revokes
          the ExceptionGrant it referenced; the revocation recomputes contractor
          standing to WATCH. Each link is caused by the previous link.
