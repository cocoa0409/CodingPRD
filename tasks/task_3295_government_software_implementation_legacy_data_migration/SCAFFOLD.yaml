  - name: status
    type: enum
    source: system
    description: PROPOSED | READINESS_CHECKED | APPROVED | EXECUTED | ROLLED_BACK | CANCELLED
  - name: readiness_score
    type: integer
    source: computed
    default: 0
    description: 0..100 weighted readiness; recompute on every gate-affecting mutation
  - name: readiness_notes
    type: string
    source: system
    default: ''
  - name: executed_at
    type: datetime
    source: system
    default: null
  - name: rolled_back_at
    type: datetime
    source: system
    default: null
- name: SupportTransition
  parent: null
  common_fields: true
  fields:
  - name: contract_id
    type: string
    source: system
    description: FK -> ProcurementContract.id; exactly one per contract, created at go-live
  - name: warranty_end_on
    type: string
    source: system
    description: planned go-live date + WARRANTY_DAYS
  - name: status
    type: enum
    source: system
    description: WARRANTY | STABILIZATION | STEADY_STATE | SUNSET
  - name: open_sev1_count
    type: integer
    source: computed
    default: 0
    description: Count of SupportTicket severity SEV1 with resolution null
  - name: total_tickets
    type: integer
    source: computed
    default: 0
  - name: sla_breach_count
    type: integer
    source: computed
    default: 0
- name: SupportTicket
  parent: null
  common_fields: true
  fields:
  - name: support_transition_id
    type: string
    source: system
    description: FK -> SupportTransition.id
  - name: severity
    type: enum
    source: input
    description: SEV1 | SEV2 | SEV3
  - name: summary
    type: string
    source: input
  - name: raised_on
    type: string
    source: system
    description: ISO date from logical clock at creation
  - name: resolution
    type: enum
    source: system
    default: null
    description: null | RESOLVED | WORKAROUND | DEFERRED | DUPLICATE
  - name: resolved_on
    type: string
    source: system
    default: null
  - name: breached_sla
    type: boolean
    source: computed
    default: false
