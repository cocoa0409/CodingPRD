          - errors[ERR_ACCESS_WINDOW_INVALID]
          - endpoints[POST /adoptions]
        distinguishing_aspect: |
          The access window is half-open [access_start_date, access_end_date): a zero-length window
          is refused, a start before term_start_date is refused, an end beyond term_end_date + 1 day
          is refused, and the exclusive end exactly at term_end_date + 1 (2026-12-12) is accepted -
          which is what lets a title cover the final instructional day.
