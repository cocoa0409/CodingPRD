            - { call: "POST /pcb/fab-orders", payload: { customer_id: "${cust}", service_lane: "QUICK_TURN", quick_turn_lane_id: "${lane}", board_x_mils: 2000, board_y_mils: 3000, layer_count: 2, surface_finish: "HASL", quantity_boards: 300, requested_ship_date: "2026-08-10T00:00:00Z" }, as: Customer, as_user_id: "${cust}", captures: { o1: $.data.id } }
            - { call: "POST /pcb/fab-orders/${o1}/stackups", payload: { revision: 1, total_thickness_mils: 62, dielectric_material: "FR4_TG170", copper_weight_oz: 1, impedance_controlled: false }, as: CAMOperator, captures: { s1: $.data.id } }
            - { call: "POST /pcb/stackups/${s1}/lock", payload: {}, as: ProcessEngineer }
            - { call: "POST /pcb/fab-orders/${o1}/submit-dfm", payload: {}, as: Customer, as_user_id: "${cust}" }
            - { call: "POST /pcb/fab-orders/${o1}/dfm-approve", payload: {}, as: ProcessEngineer, captures: { o1_v: $.data.version } }
