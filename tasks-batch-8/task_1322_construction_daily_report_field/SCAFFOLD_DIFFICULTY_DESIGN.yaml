# §1.8 Scaffold Difficulty Design — Test Targeting Index
scaffold_difficulty_design:
  # ------------------------------------------------------------------
  # Rule 1: dual_variant_calc (two different entity domains)
  # ------------------------------------------------------------------
  - rule_id: dual_variant_calc
    instances:
      - name: progress_percent_units_vs_cost_weighted
        grounds:
          - calculations.calc_progress_percent
          - entities.Project.fields.percent_complete_units
          - entities.Project.fields.percent_complete_cost
        distinguishing_aspect: |
          Same approved rollup data yields units_based_pct == 75.00 (unweighted mean of
          per-item capped percents) but cost_weighted_pct == 54.55 (cost-weighted, uncapped)
          — two valid algorithms on the WorkItem/progress domain producing different results.
        test_recipe:
          setup:
            - "Project ACTIVE with WorkItem A (100 LF @ 1000 cents) and WorkItem B (100 CY @ 10000 cents)"
            - "Report 2026-08-05 APPROVED with quantity entries: A=100 (area A1), B=50 (area A1)"
          setup_api_calls:
            - { call: "POST /projects", payload: { name: "P1", contract_number: "C-DV1", scheduled_shift_hours: 8 }, as: SystemAdmin, captures: { proj: $.data.id } }
            - { call: "POST /projects/${proj}/activate", payload: {}, as: SystemAdmin }
            - { call: "POST /work-areas", payload: { project_id: "${proj}", code: "A1" }, as: SystemAdmin, captures: { area: $.data.id } }
            - { call: "POST /work-items", payload: { project_id: "${proj}", cost_code: "03-100", description: "Curb", budgeted_quantity: 100, unit: "LF", unit_cost_cents: 1000 }, as: SystemAdmin, captures: { wi_a: $.data.id } }
            - { call: "POST /work-items", payload: { project_id: "${proj}", cost_code: "03-200", description: "Concrete", budgeted_quantity: 100, unit: "CY", unit_cost_cents: 10000 }, as: SystemAdmin, captures: { wi_b: $.data.id } }
            - { call: "POST /daily-reports", payload: { project_id: "${proj}", report_date: "2026-08-05" }, as: Superintendent, as_user_id: "supt-1", captures: { rep: $.data.id, rep_v: $.data.version } }
            - { call: "POST /quantity-entries", payload: { report_id: "${rep}", work_item_id: "${wi_a}", work_area_id: "${area}", quantity_installed: 100, expected_report_version: "${rep_v}" }, as: Superintendent, as_user_id: "supt-1" }
            - { call: "GET /daily-reports/${rep}", payload: {}, as: SystemAdmin, captures: { rep_v2: $.data.version } }
            - { call: "POST /quantity-entries", payload: { report_id: "${rep}", work_item_id: "${wi_b}", work_area_id: "${area}", quantity_installed: 50, expected_report_version: "${rep_v2}" }, as: Superintendent, as_user_id: "supt-1" }
            - { call: "POST /weather-observations", payload: { report_id: "${rep}", observed_at: "2026-08-05T08:00:00Z", condition: "CLEAR", work_impact: "NONE" }, as: Superintendent, as_user_id: "supt-1" }
            - { call: "POST /crew-entries", payload: { report_id: "${rep}", work_area_id: "${area}", subcontractor: "SubCo", trade: "Labor", worker_count: 2, hours_per_worker: 8, work_performed: "framing" }, as: Superintendent, as_user_id: "supt-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T17:00:00Z" }, as: SystemAdmin }
            - { call: "POST /daily-reports/${rep}/submit", payload: {}, as: Superintendent, as_user_id: "supt-1" }
            - { call: "POST /daily-reports/${rep}/start-review", payload: {}, as: ProjectManager, as_user_id: "pm-1" }
            - { call: "POST /daily-reports/${rep}/approve", payload: {}, as: ProjectManager, as_user_id: "pm-1" }
          trigger:
            - { call: "GET /projects/${proj}/progress-summary", payload: {}, as: ProjectManager, captures: { units_pct: $.data.units_based_pct, cost_pct: $.data.cost_weighted_pct } }
          assert:
            - "progress-summary.units_based_pct == 75.00"
            - "progress-summary.cost_weighted_pct == 54.55"
            - "units_pct != cost_pct (same input set, two valid algorithms, different results)"

      - name: lost_day_calendar_vs_prorated
        grounds:
          - calculations.calc_lost_day_classification
          - entities.DailyReport.fields.weather_lost_day_calendar
          - entities.DailyReport.fields.weather_lost_day_fraction
        distinguishing_aspect: |
          Same weather delay input (3.00 lost hours of an 8h shift) yields
          weather_lost_day_calendar == false (3.00 < 4.00 threshold) but
          weather_lost_day_fraction == 0.38 — dual variants on the DelayEvent/weather
          domain (different entity domain from the progress instance above).
        test_recipe:
          setup:
            - "Project ACTIVE, scheduled_shift_hours 8 (shift window 07:00-15:00)"
            - "Report 2026-08-05 DRAFT with a WEATHER delay event 07:30-10:30 classified EXCUSABLE_NON_COMPENSABLE"
          setup_api_calls:
            - { call: "POST /projects", payload: { name: "P2", contract_number: "C-DV2", scheduled_shift_hours: 8 }, as: SystemAdmin, captures: { proj: $.data.id } }
            - { call: "POST /projects/${proj}/activate", payload: {}, as: SystemAdmin }
            - { call: "POST /work-areas", payload: { project_id: "${proj}", code: "A1" }, as: SystemAdmin, captures: { area: $.data.id } }
            - { call: "POST /daily-reports", payload: { project_id: "${proj}", report_date: "2026-08-05" }, as: Superintendent, as_user_id: "supt-1", captures: { rep: $.data.id } }
            - { call: "POST /weather-observations", payload: { report_id: "${rep}", observed_at: "2026-08-05T08:00:00Z", condition: "RAIN", work_impact: "STOPPAGE", precipitation_in: 0.4 }, as: Superintendent, as_user_id: "supt-1" }
            - { call: "POST /delay-events", payload: { report_id: "${rep}", work_area_id: "${area}", start_at: "2026-08-05T07:30:00Z", end_at: "2026-08-05T10:30:00Z", cause: "WEATHER" }, as: Superintendent, as_user_id: "supt-1", captures: { dev: $.data.id } }
            - { call: "POST /delay-events/${dev}/classify", payload: { classification: "EXCUSABLE_NON_COMPENSABLE" }, as: ProjectManager, as_user_id: "pm-1" }
          trigger:
            - { call: "GET /daily-reports/${rep}", payload: {}, as: ProjectManager, captures: { lost_h: $.data.weather_lost_hours, cal: $.data.weather_lost_day_calendar, frac: $.data.weather_lost_day_fraction } }
            - { call: "GET /delay-events/${dev}", payload: {}, as: ProjectManager, captures: { dev_lost: $.data.lost_hours } }
          assert:
            - "DelayEvent.${dev}.lost_hours == 3.00"
            - "DailyReport.${rep}.weather_lost_hours == 3.00"
            - "DailyReport.${rep}.weather_lost_day_calendar == false"
            - "DailyReport.${rep}.weather_lost_day_fraction == 0.38"

  # ------------------------------------------------------------------
  # Rule 2: combinatorial_formula (modes a, c, b)
  # ------------------------------------------------------------------
  - rule_id: combinatorial_formula
    instances:
      - name: tm_ticket_total_tiered_standby_conditional
        grounds:
          - calculations.calc_tm_ticket_total
        distinguishing_aspect: |
          Mode (a): >= 3 inputs with non-linear interaction — OT/DT tiered rates (1.5x/2.0x),
          an equipment standby multiplier (0.5x) that switches on a cross-entity condition
          (parent report has a STOPPAGE WeatherObservation), and tiered material markup:
          labor 130000 + equipment 16000 (standby halved) + materials 33000 = total 179000.
        test_recipe:
          setup:
            - "Report 2026-08-05 DRAFT with a STOPPAGE weather observation"
            - "TmTicket: labor {worker_count 2, reg 8, ot 2, dt 1, rate 5000}; equipment {4h, 8000, standby true}; material {qty 10, unit 3000}"
          setup_api_calls:
            - { call: "POST /projects", payload: { name: "P3", contract_number: "C-CF1" }, as: SystemAdmin, captures: { proj: $.data.id } }
            - { call: "POST /projects/${proj}/activate", payload: {}, as: SystemAdmin }
            - { call: "POST /work-areas", payload: { project_id: "${proj}", code: "A1" }, as: SystemAdmin, captures: { area: $.data.id } }
            - { call: "POST /work-items", payload: { project_id: "${proj}", cost_code: "09-100", description: "Extra work", budgeted_quantity: 500, unit: "EA", unit_cost_cents: 100 }, as: SystemAdmin, captures: { wi: $.data.id } }
            - { call: "POST /daily-reports", payload: { project_id: "${proj}", report_date: "2026-08-05" }, as: Superintendent, as_user_id: "supt-1", captures: { rep: $.data.id } }
            - { call: "POST /weather-observations", payload: { report_id: "${rep}", observed_at: "2026-08-05T09:00:00Z", condition: "RAIN", work_impact: "STOPPAGE" }, as: Superintendent, as_user_id: "supt-1" }
          trigger:
            - { call: "POST /tm-tickets", payload: { report_id: "${rep}", work_item_id: "${wi}", description: "Rain day standby extra", labor_lines: [ { trade: "Labor", worker_count: 2, regular_hours: 8, ot_hours: 2, dt_hours: 1, rate_cents: 5000 } ], equipment_lines: [ { equipment_type: "Crane", hours: 4, rate_cents: 8000, standby: true } ], material_lines: [ { description: "Rebar", quantity: 10, unit_price_cents: 3000 } ] }, as: Superintendent, as_user_id: "supt-1", captures: { labor: $.data.labor_cost_cents, equip: $.data.equipment_cost_cents, msub: $.data.materials_subtotal_cents, mmark: $.data.materials_markup_cents, total: $.data.total_cents } }
          assert:
            - "TmTicket.labor_cost_cents == 130000"
            - "TmTicket.equipment_cost_cents == 16000  # 4*8000*0.5 standby (STOPPAGE present)"
            - "TmTicket.materials_subtotal_cents == 30000"
            - "TmTicket.materials_markup_cents == 3000  # 10% low tier"
            - "TmTicket.total_cents == 179000"

      - name: material_markup_tier_keyed_on_pre_markup_subtotal
        grounds:
          - calculations.calc_material_markup
        distinguishing_aspect: |
          Mode (c): circular-looking dependency — markup tier is keyed on the PRE-markup
          subtotal while the markup itself inflates the post-markup amount. Pinned order gives
          subtotal 100000 -> LOW tier 10% -> markup 10000 (post 110000 must NOT re-tier), and
          subtotal 100001 -> HIGH tier 5% -> markup 5000. Boundary 100000 uses <= semantics.
        test_recipe:
          setup:
            - "Report 2026-08-05 DRAFT (no STOPPAGE needed); two tickets: T1 material qty 100 x 1000 cents; T2 material qty 1 x 100001 cents"
          setup_api_calls:
            - { call: "POST /projects", payload: { name: "P4", contract_number: "C-CF2" }, as: SystemAdmin, captures: { proj: $.data.id } }
            - { call: "POST /projects/${proj}/activate", payload: {}, as: SystemAdmin }
            - { call: "POST /work-items", payload: { project_id: "${proj}", cost_code: "09-100", description: "Extra work", budgeted_quantity: 500, unit: "EA", unit_cost_cents: 100 }, as: SystemAdmin, captures: { wi: $.data.id } }
            - { call: "POST /daily-reports", payload: { project_id: "${proj}", report_date: "2026-08-05" }, as: Superintendent, as_user_id: "supt-1", captures: { rep: $.data.id } }
          trigger:
            - { call: "POST /tm-tickets", payload: { report_id: "${rep}", work_item_id: "${wi}", description: "T1 at cap", labor_lines: [], material_lines: [ { description: "Steel", quantity: 100, unit_price_cents: 1000 } ] }, as: Superintendent, as_user_id: "supt-1", captures: { t1_sub: $.data.materials_subtotal_cents, t1_mark: $.data.materials_markup_cents, t1_cost: $.data.materials_cost_cents } }
            - { call: "POST /tm-tickets", payload: { report_id: "${rep}", work_item_id: "${wi}", description: "T2 one cent over", labor_lines: [], material_lines: [ { description: "Steel", quantity: 1, unit_price_cents: 100001 } ] }, as: Superintendent, as_user_id: "supt-1", captures: { t2_sub: $.data.materials_subtotal_cents, t2_mark: $.data.materials_markup_cents, t2_cost: $.data.materials_cost_cents } }
          assert:
            - "T1.materials_subtotal_cents == 100000"
            - "T1.materials_markup_cents == 10000   # LOW tier at exactly 100000 (<=)"
            - "T1.materials_cost_cents == 110000"
            - "T2.materials_subtotal_cents == 100001"
            - "T2.materials_markup_cents == 5000    # HIGH tier 5%, round_half_up(5000.05)=5000"
            - "T2.materials_cost_cents == 105001"

      - name: quantity_rollup_per_entry_rounding_order
        grounds:
          - calculations.calc_quantity_rollup
        distinguishing_aspect: |
          Mode (b): nested rounding order pinned as round-per-entry-then-sum — two entries of
          1.2344 each store 1.234 + 1.234 so installed_to_date == 2.468 after approve, where
          sum-then-round would produce 2.469.
        test_recipe:
          setup:
            - "Project ACTIVE; WorkItem budget 100 LF @ 1000; Report 2026-08-05 APPROVED with entries 1.2344 (area A1) and 1.2344 (area A2)"
          setup_api_calls:
            - { call: "POST /projects", payload: { name: "P5", contract_number: "C-CF3" }, as: SystemAdmin, captures: { proj: $.data.id } }
            - { call: "POST /projects/${proj}/activate", payload: {}, as: SystemAdmin }
            - { call: "POST /work-areas", payload: { project_id: "${proj}", code: "A1" }, as: SystemAdmin, captures: { area1: $.data.id } }
            - { call: "POST /work-areas", payload: { project_id: "${proj}", code: "A2" }, as: SystemAdmin, captures: { area2: $.data.id } }
            - { call: "POST /work-items", payload: { project_id: "${proj}", cost_code: "03-100", description: "Curb", budgeted_quantity: 100, unit: "LF", unit_cost_cents: 1000 }, as: SystemAdmin, captures: { wi: $.data.id } }
            - { call: "POST /daily-reports", payload: { project_id: "${proj}", report_date: "2026-08-05" }, as: Superintendent, as_user_id: "supt-1", captures: { rep: $.data.id, rep_v: $.data.version } }
            - { call: "POST /quantity-entries", payload: { report_id: "${rep}", work_item_id: "${wi}", work_area_id: "${area1}", quantity_installed: 1.2344, expected_report_version: "${rep_v}" }, as: Superintendent, as_user_id: "supt-1", captures: { qe1: $.data.id, qe1_rounded: $.data.rounded_quantity } }
            - { call: "GET /daily-reports/${rep}", payload: {}, as: SystemAdmin, captures: { rep_v2: $.data.version } }
            - { call: "POST /quantity-entries", payload: { report_id: "${rep}", work_item_id: "${wi}", work_area_id: "${area2}", quantity_installed: 1.2344, expected_report_version: "${rep_v2}" }, as: Superintendent, as_user_id: "supt-1" }
            - { call: "POST /weather-observations", payload: { report_id: "${rep}", observed_at: "2026-08-05T08:00:00Z", condition: "CLEAR", work_impact: "NONE" }, as: Superintendent, as_user_id: "supt-1" }
            - { call: "POST /crew-entries", payload: { report_id: "${rep}", work_area_id: "${area1}", subcontractor: "SubCo", trade: "Labor", worker_count: 1, hours_per_worker: 8, work_performed: "pour" }, as: Superintendent, as_user_id: "supt-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T17:00:00Z" }, as: SystemAdmin }
            - { call: "POST /daily-reports/${rep}/submit", payload: {}, as: Superintendent, as_user_id: "supt-1" }
            - { call: "POST /daily-reports/${rep}/start-review", payload: {}, as: ProjectManager, as_user_id: "pm-1" }
            - { call: "POST /daily-reports/${rep}/approve", payload: {}, as: ProjectManager, as_user_id: "pm-1" }
          trigger:
            - { call: "GET /work-items/${wi}", payload: {}, as: ProjectManager, captures: { installed: $.data.installed_to_date } }
          assert:
            - "QuantityEntry.${qe1}.rounded_quantity == 1.234"
            - "WorkItem.${wi}.installed_to_date == 2.468  # round-per-entry-then-sum, NOT 2.469"

  # ------------------------------------------------------------------
  # Rule 3: non_linear_state_machine (three different entities)
  # ------------------------------------------------------------------
  - rule_id: non_linear_state_machine
    instances:
      - name: daily_report_revision_cycle
        grounds:
          - state_machines.DailyReport.UNDER_REVIEW_to_REVISION_REQUESTED
          - state_machines.DailyReport.REVISION_REQUESTED_to_DRAFT
        distinguishing_aspect: |
          Cyclic loop on DailyReport: UNDER_REVIEW -> REVISION_REQUESTED -> DRAFT -> SUBMITTED
          again; revision_count increments once and content_posture flips SEALED -> EDITABLE ->
          SEALED, re-admitting child writes mid-cycle (crew entry created during the loop).
        test_recipe:
          setup:
            - "Report 2026-08-05 driven to UNDER_REVIEW, then revision requested"
          setup_api_calls:
            - { call: "POST /projects", payload: { name: "P6", contract_number: "C-SM1" }, as: SystemAdmin, captures: { proj: $.data.id } }
            - { call: "POST /projects/${proj}/activate", payload: {}, as: SystemAdmin }
            - { call: "POST /work-areas", payload: { project_id: "${proj}", code: "A1" }, as: SystemAdmin, captures: { area: $.data.id } }
            - { call: "POST /daily-reports", payload: { project_id: "${proj}", report_date: "2026-08-05" }, as: Superintendent, as_user_id: "supt-1", captures: { rep: $.data.id } }
            - { call: "POST /weather-observations", payload: { report_id: "${rep}", observed_at: "2026-08-05T08:00:00Z", condition: "CLEAR", work_impact: "NONE" }, as: Superintendent, as_user_id: "supt-1" }
            - { call: "POST /crew-entries", payload: { report_id: "${rep}", work_area_id: "${area}", subcontractor: "SubCo", trade: "Labor", worker_count: 2, hours_per_worker: 8, work_performed: "framing" }, as: Superintendent, as_user_id: "supt-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T17:00:00Z" }, as: SystemAdmin }
            - { call: "POST /daily-reports/${rep}/submit", payload: {}, as: Superintendent, as_user_id: "supt-1" }
            - { call: "POST /daily-reports/${rep}/start-review", payload: {}, as: ProjectManager, as_user_id: "pm-1" }
          trigger:
            - { call: "POST /daily-reports/${rep}/request-revision", payload: { reason: "Fix manpower" }, as: ProjectManager, as_user_id: "pm-1", captures: { st1: $.data.status, rc: $.data.revision_count, posture: $.data.content_posture } }
            - { call: "POST /crew-entries", payload: { report_id: "${rep}", work_area_id: "${area}", subcontractor: "SubCo", trade: "Electric", worker_count: 1, hours_per_worker: 4, work_performed: "temp power" }, as: Superintendent, as_user_id: "supt-1", captures: { ce: $.data.id } }
            - { call: "POST /daily-reports/${rep}/return-to-draft", payload: {}, as: Superintendent, as_user_id: "supt-1", captures: { st2: $.data.status } }
            - { call: "POST /daily-reports/${rep}/submit", payload: {}, as: Superintendent, as_user_id: "supt-1", captures: { st3: $.data.status } }
          assert:
            - "after request-revision: status == REVISION_REQUESTED, revision_count == 1, content_posture == EDITABLE"
            - "CrewEntry create during REVISION_REQUESTED succeeds (posture loop re-opens editing): ${ce} exists"
            - "after return-to-draft: status == DRAFT"
            - "after resubmit: status == SUBMITTED and revision_count still == 1"

      - name: tm_ticket_signature_fork_and_revision_cycle
        grounds:
          - state_machines.TmTicket.PARTIALLY_SIGNED_to_FULLY_SIGNED
          - state_machines.TmTicket.REJECTED_to_DRAFT
        distinguishing_aspect: |
          Branching + cycle on TmTicket (different entity than DailyReport): ordered signature
          fork (owner-first attempt rejected with ERR_SIGNATURE_ORDER; contractor-then-owner
          succeeds), then REJECTED -> DRAFT revision loop clears both signatures and bumps
          revision_count.
        test_recipe:
          setup:
            - "Report 2026-08-05 DRAFT; DRAFT ticket with one labor line (total 100 cents)"
          setup_api_calls:
            - { call: "POST /projects", payload: { name: "P7", contract_number: "C-SM2" }, as: SystemAdmin, captures: { proj: $.data.id } }
            - { call: "POST /projects/${proj}/activate", payload: {}, as: SystemAdmin }
            - { call: "POST /work-items", payload: { project_id: "${proj}", cost_code: "09-100", description: "Extra", budgeted_quantity: 500, unit: "EA", unit_cost_cents: 100 }, as: SystemAdmin, captures: { wi: $.data.id } }
            - { call: "POST /daily-reports", payload: { project_id: "${proj}", report_date: "2026-08-05" }, as: Superintendent, as_user_id: "supt-1", captures: { rep: $.data.id } }
            - { call: "POST /tm-tickets", payload: { report_id: "${rep}", work_item_id: "${wi}", description: "Extra labor", labor_lines: [ { trade: "Labor", worker_count: 1, regular_hours: 1, ot_hours: 0, dt_hours: 0, rate_cents: 100 } ] }, as: Superintendent, as_user_id: "supt-1", captures: { tk: $.data.id } }
            - { call: "POST /tm-tickets/${tk}/submit-for-signature", payload: {}, as: Superintendent, as_user_id: "supt-1" }
          trigger:
            - { call: "POST /tm-tickets/${tk}/sign", payload: { signer_role: "OWNER" }, as: OwnerRep, as_user_id: "owner-1", captures: { order_err: $.data.error_id } }
            - { call: "POST /tm-tickets/${tk}/sign", payload: { signer_role: "CONTRACTOR" }, as: ContractorRep, as_user_id: "ctr-1", captures: { st1: $.data.status } }
            - { call: "POST /tm-tickets/${tk}/sign", payload: { signer_role: "OWNER" }, as: OwnerRep, as_user_id: "owner-1", captures: { st2: $.data.status } }
            - { call: "POST /tm-tickets/${tk}/reject", payload: { reason: "Rate dispute" }, as: ProjectManager, as_user_id: "pm-1", captures: { st3: $.data.status } }
            - { call: "POST /tm-tickets/${tk}/revise", payload: {}, as: Superintendent, as_user_id: "supt-1", captures: { st4: $.data.status, rc: $.data.revision_count, cs: $.data.contractor_signed_by, os: $.data.owner_signed_by } }
          assert:
            - "owner-first sign rejected: order_err == ERR_SIGNATURE_ORDER (409)"
            - "after contractor sign: status == PARTIALLY_SIGNED"
            - "after owner sign: status == FULLY_SIGNED"
            - "after reject: status == REJECTED"
            - "after revise: status == DRAFT, revision_count == 1, contractor_signed_by == null, owner_signed_by == null"

      - name: incident_recordable_branching_fork
        grounds:
          - state_machines.Incident.UNDER_INVESTIGATION_to_CLOSED_NOT_RECORDABLE
          - state_machines.Incident.OSHA_NOTIFIED_to_CLOSED_RECORDABLE
        distinguishing_aspect: |
          Branching fork on Incident (third entity): NEAR_MISS closes via CLOSED_NOT_RECORDABLE
          with retention_class staying STANDARD; LOST_TIME forks through OSHA_NOTIFIED to
          CLOSED_RECORDABLE with sticky retention_class CLAIMS_HOLD — divergent side-effect
          sets per branch.
        test_recipe:
          setup:
            - "Report 2026-08-05 DRAFT; two incidents: I1 NEAR_MISS, I2 LOST_TIME with linked media"
          setup_api_calls:
            - { call: "POST /projects", payload: { name: "P8", contract_number: "C-SM3" }, as: SystemAdmin, captures: { proj: $.data.id } }
            - { call: "POST /projects/${proj}/activate", payload: {}, as: SystemAdmin }
            - { call: "POST /work-areas", payload: { project_id: "${proj}", code: "A1" }, as: SystemAdmin, captures: { area: $.data.id } }
            - { call: "POST /daily-reports", payload: { project_id: "${proj}", report_date: "2026-08-05" }, as: Superintendent, as_user_id: "supt-1", captures: { rep: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T17:00:00Z" }, as: SystemAdmin }
            - { call: "POST /incidents", payload: { report_id: "${rep}", work_area_id: "${area}", occurred_at: "2026-08-05T09:00:00Z", severity: "NEAR_MISS", narrative: "Crane load swung over walkway; no contact." }, as: SafetyOfficer, as_user_id: "so-1", captures: { i1: $.data.id, i1_rec: $.data.recordable } }
            - { call: "POST /incidents", payload: { report_id: "${rep}", work_area_id: "${area}", occurred_at: "2026-08-05T10:00:00Z", severity: "LOST_TIME", narrative: "Worker fell from ladder at level 3 east and was hospitalized overnight." }, as: SafetyOfficer, as_user_id: "so-1", captures: { i2: $.data.id, i2_rec: $.data.recordable, i2_deadline: $.data.osha_notification_deadline } }
            - { call: "POST /media-attachments", payload: { report_id: "${rep}", work_area_id: "${area}", media_type: "PHOTO", file_url: "s3://evidence/i2.jpg", captured_at: "2026-08-05T10:05:00Z", linked_incident_id: "${i2}" }, as: SafetyOfficer, as_user_id: "so-1" }
            - { call: "POST /incidents/${i1}/begin-investigation", payload: {}, as: SafetyOfficer, as_user_id: "so-1" }
            - { call: "POST /incidents/${i2}/notify-osha", payload: {}, as: SafetyOfficer, as_user_id: "so-1" }
          trigger:
            - { call: "POST /incidents/${i1}/close", payload: { outcome: "NOT_RECORDABLE" }, as: SafetyOfficer, as_user_id: "so-2", captures: { i1_st: $.data.status } }
            - { call: "POST /incidents/${i2}/close", payload: { outcome: "RECORDABLE" }, as: SafetyOfficer, as_user_id: "so-2", captures: { i2_st: $.data.status } }
            - { call: "GET /daily-reports/${rep}", payload: {}, as: SafetyOfficer, captures: { ret: $.data.retention_class, hold: $.data.distribution_hold } }
          assert:
            - "I1.recordable == false and I1.status == CLOSED_NOT_RECORDABLE (fork branch 1)"
            - "I2.recordable == true, osha_notification_deadline == 2026-08-06T10:00:00Z (+24h), status == CLOSED_RECORDABLE via OSHA_NOTIFIED (fork branch 2)"
            - "DailyReport.retention_class == CLAIMS_HOLD (sticky side effect of branch 2 only)"
            - "DailyReport.distribution_hold == false (no open incidents remain)"

  # ------------------------------------------------------------------
  # Rule 4: transitive_cascade (two different triggers)
  # ------------------------------------------------------------------
  - rule_id: transitive_cascade
    instances:
      - name: incident_close_releases_distribution_hold
        grounds:
          - state_machines.Incident.REPORTED_to_CLOSED_NOT_RECORDABLE
          - state_machines.DistributionRecord.BLOCKED_to_PENDING
          - calculations.calc_report_posture
        distinguishing_aspect: |
          Depth-3 cascade from the close trigger: incident close -> report.has_open_incident
          recomputes false -> distribution_hold follows to false -> every BLOCKED
          DistributionRecord flips back to PENDING. Each link is caused by the previous one.
        test_recipe:
          setup:
            - "Report APPROVED; one DistributionRecord PENDING; then a FIRST_AID incident flips hold ON and the record to BLOCKED"
          setup_api_calls:
            - { call: "POST /projects", payload: { name: "P9", contract_number: "C-TC1" }, as: SystemAdmin, captures: { proj: $.data.id } }
            - { call: "POST /projects/${proj}/activate", payload: {}, as: SystemAdmin }
            - { call: "POST /work-areas", payload: { project_id: "${proj}", code: "A1" }, as: SystemAdmin, captures: { area: $.data.id } }
            - { call: "POST /daily-reports", payload: { project_id: "${proj}", report_date: "2026-08-05" }, as: Superintendent, as_user_id: "supt-1", captures: { rep: $.data.id } }
            - { call: "POST /weather-observations", payload: { report_id: "${rep}", observed_at: "2026-08-05T08:00:00Z", condition: "CLEAR", work_impact: "NONE" }, as: Superintendent, as_user_id: "supt-1" }
            - { call: "POST /crew-entries", payload: { report_id: "${rep}", work_area_id: "${area}", subcontractor: "SubCo", trade: "Labor", worker_count: 2, hours_per_worker: 8, work_performed: "framing" }, as: Superintendent, as_user_id: "supt-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T17:00:00Z" }, as: SystemAdmin }
            - { call: "POST /daily-reports/${rep}/submit", payload: {}, as: Superintendent, as_user_id: "supt-1" }
            - { call: "POST /daily-reports/${rep}/start-review", payload: {}, as: ProjectManager, as_user_id: "pm-1" }
            - { call: "POST /daily-reports/${rep}/approve", payload: {}, as: ProjectManager, as_user_id: "pm-1" }
            - { call: "POST /distribution-records", payload: { report_id: "${rep}", recipient_email: "owner@x.com", recipient_role: "OWNER" }, as: ProjectManager, as_user_id: "pm-1", captures: { drec: $.data.id } }
            - { call: "POST /incidents", payload: { report_id: "${rep}", work_area_id: "${area}", occurred_at: "2026-08-05T15:00:00Z", severity: "FIRST_AID", narrative: "Minor cut treated onsite." }, as: SafetyOfficer, as_user_id: "so-1", captures: { inc: $.data.id } }
            - { call: "GET /distribution-records/${drec}", payload: {}, as: ProjectManager, captures: { rec_mid: $.data.status } }
          trigger:
            - { call: "POST /incidents/${inc}/close", payload: { outcome: "NOT_RECORDABLE" }, as: SafetyOfficer, as_user_id: "so-2", captures: { inc_st: $.data.status } }
            - { call: "GET /distribution-records/${drec}", payload: {}, as: ProjectManager, captures: { rec_end: $.data.status } }
            - { call: "GET /daily-reports/${rep}", payload: {}, as: ProjectManager, captures: { hold: $.data.distribution_hold, ret: $.data.retention_class } }
          assert:
            - "mid-cascade: DistributionRecord.${drec}.status == BLOCKED (incident create flipped hold)"
            - "after close: Incident.status == CLOSED_NOT_RECORDABLE"
            - "L1: DailyReport.has_open_incident == false; L2: distribution_hold == false"
            - "L3: DistributionRecord.${drec}.status == PENDING (auto-unblocked by hold release)"
            - "DailyReport.retention_class == STANDARD (non-recordable incident never sets CLAIMS_HOLD)"

      - name: approve_rollup_cascade_to_project_percent
        grounds:
          - state_machines.DailyReport.UNDER_REVIEW_to_APPROVED
          - calculations.calc_quantity_rollup
          - calculations.calc_progress_percent
        distinguishing_aspect: |
          Depth-3 cascade from the approve trigger (different trigger than incident close):
          approve -> WorkItem.installed_to_date += rounded quantities -> WorkItem.status
          recomputes NOT_STARTED -> COMPLETE -> Project percent fields recompute.
        test_recipe:
          setup:
            - "Project with WorkItem A (100 LF @1000) and WorkItem B (100 CY @10000, untouched)"
            - "Report APPROVED carrying one quantity entry A=100"
          setup_api_calls:
            - { call: "POST /projects", payload: { name: "P10", contract_number: "C-TC2" }, as: SystemAdmin, captures: { proj: $.data.id } }
            - { call: "POST /projects/${proj}/activate", payload: {}, as: SystemAdmin }
            - { call: "POST /work-areas", payload: { project_id: "${proj}", code: "A1" }, as: SystemAdmin, captures: { area: $.data.id } }
            - { call: "POST /work-items", payload: { project_id: "${proj}", cost_code: "03-100", description: "Curb", budgeted_quantity: 100, unit: "LF", unit_cost_cents: 1000 }, as: SystemAdmin, captures: { wi_a: $.data.id } }
            - { call: "POST /work-items", payload: { project_id: "${proj}", cost_code: "03-200", description: "Concrete", budgeted_quantity: 100, unit: "CY", unit_cost_cents: 10000 }, as: SystemAdmin, captures: { wi_b: $.data.id } }
            - { call: "POST /daily-reports", payload: { project_id: "${proj}", report_date: "2026-08-05" }, as: Superintendent, as_user_id: "supt-1", captures: { rep: $.data.id, rep_v: $.data.version } }
            - { call: "POST /quantity-entries", payload: { report_id: "${rep}", work_item_id: "${wi_a}", work_area_id: "${area}", quantity_installed: 100, expected_report_version: "${rep_v}" }, as: Superintendent, as_user_id: "supt-1" }
            - { call: "POST /weather-observations", payload: { report_id: "${rep}", observed_at: "2026-08-05T08:00:00Z", condition: "CLEAR", work_impact: "NONE" }, as: Superintendent, as_user_id: "supt-1" }
            - { call: "POST /crew-entries", payload: { report_id: "${rep}", work_area_id: "${area}", subcontractor: "SubCo", trade: "Labor", worker_count: 2, hours_per_worker: 8, work_performed: "pour" }, as: Superintendent, as_user_id: "supt-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T17:00:00Z" }, as: SystemAdmin }
            - { call: "POST /daily-reports/${rep}/submit", payload: {}, as: Superintendent, as_user_id: "supt-1" }
            - { call: "POST /daily-reports/${rep}/start-review", payload: {}, as: ProjectManager, as_user_id: "pm-1" }
          trigger:
            - { call: "POST /daily-reports/${rep}/approve", payload: {}, as: ProjectManager, as_user_id: "pm-1" }
            - { call: "GET /work-items/${wi_a}", payload: {}, as: ProjectManager, captures: { inst_a: $.data.installed_to_date, st_a: $.data.status } }
            - { call: "GET /work-items/${wi_b}", payload: {}, as: ProjectManager, captures: { st_b: $.data.status } }
            - { call: "GET /projects/${proj}/progress-summary", payload: {}, as: ProjectManager, captures: { units_pct: $.data.units_based_pct, cost_pct: $.data.cost_weighted_pct } }
          assert:
            - "L1: WorkItem.${wi_a}.installed_to_date == 100.0"
            - "L2: WorkItem.${wi_a}.status == COMPLETE (100 >= 100); WorkItem.${wi_b}.status == NOT_STARTED (untouched)"
            - "L3: units_based_pct == 50.00 (mean of 1.00 and 0.00); cost_weighted_pct == 9.09 (100000/1100000)"

  # ------------------------------------------------------------------
  # Rule 5: priority_pair_validation_conflict (two different category pairs)
  # ------------------------------------------------------------------
  - rule_id: priority_pair_validation_conflict
    instances:
      - name: ticket_approve_state_beats_fiscal
        grounds:
          - validations[priority=6]
          - validations[priority=11]
          - state_machines.TmTicket.FULLY_SIGNED_to_APPROVED
        distinguishing_aspect: |
          state (priority 6) vs business_fiscal (priority 11): a DRAFT ticket whose
          total 130000 exceeds its 1000-cent ceiling, when approved, must return
          ERR_TICKET_INVALID_TRANSITION (409) — the fiscal ERR_TM_CEILING_EXCEEDED is
          never evaluated because the state gate runs first.
        test_recipe:
          setup: ["Report 2026-08-05 DRAFT; DRAFT ticket: labor total 130000 cents, ceiling 1000"]
          setup_api_calls:
            - { call: "POST /projects", payload: { name: "P11", contract_number: "C-VC1" }, as: SystemAdmin, captures: { proj: $.data.id } }
            - { call: "POST /projects/${proj}/activate", payload: {}, as: SystemAdmin }
            - { call: "POST /work-items", payload: { project_id: "${proj}", cost_code: "09-100", description: "Extra", budgeted_quantity: 500, unit: "EA", unit_cost_cents: 100 }, as: SystemAdmin, captures: { wi: $.data.id } }
            - { call: "POST /daily-reports", payload: { project_id: "${proj}", report_date: "2026-08-05" }, as: Superintendent, as_user_id: "supt-1", captures: { rep: $.data.id } }
            - { call: "POST /tm-tickets", payload: { report_id: "${rep}", work_item_id: "${wi}", description: "Over-ceiling extra", labor_lines: [ { trade: "Labor", worker_count: 2, regular_hours: 8, ot_hours: 2, dt_hours: 1, rate_cents: 5000 } ], authorized_ceiling_cents: 1000 }, as: Superintendent, as_user_id: "supt-1", captures: { tk: $.data.id } }
          trigger:
            - { call: "POST /tm-tickets/${tk}/approve", payload: {}, as: ProjectManager, as_user_id: "pm-1", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_TICKET_INVALID_TRANSITION with http 409 (state beats fiscal)"
            - "error_id != ERR_TM_CEILING_EXCEEDED"
            - "TmTicket.${tk}.status remains DRAFT"

      - name: incident_create_safety_beats_temporal
        grounds:
          - validations[priority=7.1]
          - validations[priority=9.3]
        distinguishing_aspect: |
          business_safety (priority 7.1) vs business_temporal (priority 9.3): an incident
          with FATALITY severity but a 5-char narrative AND a future occurred_at must return
          ERR_INCIDENT_NARRATIVE_REQUIRED (safety) — not ERR_INCIDENT_OCCURRED_IN_FUTURE
          (temporal). Different error-category pair than the state-vs-fiscal instance.
        test_recipe:
          setup: ["Report 2026-08-05 DRAFT; logical clock at 2026-08-05T17:00:00Z"]
          setup_api_calls:
            - { call: "POST /projects", payload: { name: "P12", contract_number: "C-VC2" }, as: SystemAdmin, captures: { proj: $.data.id } }
            - { call: "POST /projects/${proj}/activate", payload: {}, as: SystemAdmin }
            - { call: "POST /work-areas", payload: { project_id: "${proj}", code: "A1" }, as: SystemAdmin, captures: { area: $.data.id } }
            - { call: "POST /daily-reports", payload: { project_id: "${proj}", report_date: "2026-08-05" }, as: Superintendent, as_user_id: "supt-1", captures: { rep: $.data.id } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T17:00:00Z" }, as: SystemAdmin }
          trigger:
            - { call: "POST /incidents", payload: { report_id: "${rep}", work_area_id: "${area}", occurred_at: "2026-08-06T09:00:00Z", severity: "FATALITY", narrative: "short" }, as: SafetyOfficer, as_user_id: "so-1", captures: { err: $.data.error_id } }
          assert:
            - "error_id == ERR_INCIDENT_NARRATIVE_REQUIRED with http 422 (safety beats temporal)"
            - "error_id != ERR_INCIDENT_OCCURRED_IN_FUTURE"
            - "no Incident row is created"

  # ------------------------------------------------------------------
  # Rule 6: boundary_precision_check (different metrics + endpoints)
  # ------------------------------------------------------------------
  - rule_id: boundary_precision_check
    instances:
      - name: ot_boundary_exactly_eight_and_twelve_hours
        grounds:
          - calculations.calc_manpower_split
          - validations[priority=4]
        distinguishing_aspect: |
          Metric: hours; endpoint: POST /crew-entries read back via GET /daily-reports/{id}.
          Exactly 8.0 h/worker yields ZERO OT (OT starts strictly above 8); exactly 12.0
          yields 4.00 OT and ZERO DT (DT starts strictly above 12) — band edges are inclusive
          downward.
        test_recipe:
          setup: ["Report 2026-08-05 DRAFT with crew entries: 3 workers x 8.0h and 2 workers x 12.0h"]
          setup_api_calls:
            - { call: "POST /projects", payload: { name: "P13", contract_number: "C-BP1" }, as: SystemAdmin, captures: { proj: $.data.id } }
            - { call: "POST /projects/${proj}/activate", payload: {}, as: SystemAdmin }
            - { call: "POST /work-areas", payload: { project_id: "${proj}", code: "A1" }, as: SystemAdmin, captures: { area: $.data.id } }
            - { call: "POST /daily-reports", payload: { project_id: "${proj}", report_date: "2026-08-05" }, as: Superintendent, as_user_id: "supt-1", captures: { rep: $.data.id } }
            - { call: "POST /crew-entries", payload: { report_id: "${rep}", work_area_id: "${area}", subcontractor: "SubCo", trade: "Labor", worker_count: 3, hours_per_worker: 8.0, work_performed: "framing" }, as: Superintendent, as_user_id: "supt-1", captures: { ce1: $.data.id, ce1_ot: $.data.ot_hours, ce1_dt: $.data.dt_hours } }
            - { call: "POST /crew-entries", payload: { report_id: "${rep}", work_area_id: "${area}", subcontractor: "SubCo", trade: "Electric", worker_count: 2, hours_per_worker: 12.0, work_performed: "overtime pull" }, as: Superintendent, as_user_id: "supt-1", captures: { ce2: $.data.id, ce2_reg: $.data.regular_hours, ce2_ot: $.data.ot_hours, ce2_dt: $.data.dt_hours } }
          trigger:
            - { call: "GET /daily-reports/${rep}", payload: {}, as: Superintendent, captures: { tw: $.data.total_workers, mr: $.data.manhours_regular, mo: $.data.manhours_ot, md: $.data.manhours_dt } }
          assert:
            - "CrewEntry(8.0h x3): ot_hours == 0.00 and dt_hours == 0.00 (8.0 exactly is all regular)"
            - "CrewEntry(12.0h x2): regular_hours == 16.00, ot_hours == 8.00, dt_hours == 0.00 (12.0 exactly caps OT band at 4)"
            - "DailyReport.total_workers == 5, manhours_regular == 40.00, manhours_ot == 8.00, manhours_dt == 0.00"

      - name: ceiling_equality_passes_approval
        grounds:
          - validations[priority=11]
          - state_machines.TmTicket.FULLY_SIGNED_to_APPROVED
        distinguishing_aspect: |
          Metric: money in cents; endpoint: POST /tm-tickets/{id}/approve. total_cents exactly
          EQUAL to authorized_ceiling_cents passes (<= semantics) while the same ticket at
          one cent more would fail — different metric and endpoint than the OT boundary.
        test_recipe:
          setup:
            - "Report 2026-08-05 SUBMITTED (STOPPAGE weather present); ticket total exactly 179000 with ceiling 179000, FULLY_SIGNED"
          setup_api_calls:
            - { call: "POST /projects", payload: { name: "P14", contract_number: "C-BP2" }, as: SystemAdmin, captures: { proj: $.data.id } }
            - { call: "POST /projects/${proj}/activate", payload: {}, as: SystemAdmin }
            - { call: "POST /work-areas", payload: { project_id: "${proj}", code: "A1" }, as: SystemAdmin, captures: { area: $.data.id } }
            - { call: "POST /work-items", payload: { project_id: "${proj}", cost_code: "09-100", description: "Extra", budgeted_quantity: 500, unit: "EA", unit_cost_cents: 100 }, as: SystemAdmin, captures: { wi: $.data.id } }
            - { call: "POST /daily-reports", payload: { project_id: "${proj}", report_date: "2026-08-05" }, as: Superintendent, as_user_id: "supt-1", captures: { rep: $.data.id } }
            - { call: "POST /weather-observations", payload: { report_id: "${rep}", observed_at: "2026-08-05T09:00:00Z", condition: "RAIN", work_impact: "STOPPAGE" }, as: Superintendent, as_user_id: "supt-1" }
            - { call: "POST /crew-entries", payload: { report_id: "${rep}", work_area_id: "${area}", subcontractor: "SubCo", trade: "Labor", worker_count: 2, hours_per_worker: 8, work_performed: "standby" }, as: Superintendent, as_user_id: "supt-1" }
            - { call: "POST /tm-tickets", payload: { report_id: "${rep}", work_item_id: "${wi}", description: "Rain day extra", labor_lines: [ { trade: "Labor", worker_count: 2, regular_hours: 8, ot_hours: 2, dt_hours: 1, rate_cents: 5000 } ], equipment_lines: [ { equipment_type: "Crane", hours: 4, rate_cents: 8000, standby: true } ], material_lines: [ { description: "Rebar", quantity: 10, unit_price_cents: 3000 } ], authorized_ceiling_cents: 179000 }, as: Superintendent, as_user_id: "supt-1", captures: { tk: $.data.id, total: $.data.total_cents } }
            - { call: "POST /tm-tickets/${tk}/submit-for-signature", payload: {}, as: Superintendent, as_user_id: "supt-1" }
            - { call: "POST /tm-tickets/${tk}/sign", payload: { signer_role: "CONTRACTOR" }, as: ContractorRep, as_user_id: "ctr-1" }
            - { call: "POST /tm-tickets/${tk}/sign", payload: { signer_role: "OWNER" }, as: OwnerRep, as_user_id: "owner-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T17:00:00Z" }, as: SystemAdmin }
            - { call: "POST /daily-reports/${rep}/submit", payload: {}, as: Superintendent, as_user_id: "supt-1" }
          trigger:
            - { call: "POST /tm-tickets/${tk}/approve", payload: {}, as: ProjectManager, as_user_id: "pm-1", captures: { st: $.data.status } }
          assert:
            - "TmTicket.total_cents == 179000 (equals ceiling exactly)"
            - "approve succeeds: status == APPROVED (equality passes the <= gate)"

  # ------------------------------------------------------------------
  # Rule 7: cross_entity_state_dependency (three different entity pairs)
  # ------------------------------------------------------------------
  - rule_id: cross_entity_state_dependency
    instances:
      - name: submit_blocked_by_uninspected_delivery
        grounds:
          - validations[priority=10.3]
          - state_machines.MaterialDelivery.PARTIAL_to_INSPECTED
        distinguishing_aspect: |
          Pair MaterialDelivery -> DailyReport: submit is rejected while any delivery is
          PARTIAL (ERR_DELIVERY_NOT_INSPECTED); after resolve-recount drives the delivery to
          INSPECTED, the same submit succeeds.
        test_recipe:
          setup: ["Report DRAFT with weather+crew and a delivery inspected only partially (60 accept / 25 reject of 100)"]
          setup_api_calls:
            - { call: "POST /projects", payload: { name: "P15", contract_number: "C-XD1" }, as: SystemAdmin, captures: { proj: $.data.id } }
            - { call: "POST /projects/${proj}/activate", payload: {}, as: SystemAdmin }
            - { call: "POST /work-areas", payload: { project_id: "${proj}", code: "A1" }, as: SystemAdmin, captures: { area: $.data.id } }
            - { call: "POST /delivery-zones", payload: { project_id: "${proj}", zone_code: "Z1", buffer_minutes: 30 }, as: SystemAdmin, captures: { zone: $.data.id } }
            - { call: "POST /daily-reports", payload: { project_id: "${proj}", report_date: "2026-08-05" }, as: Superintendent, as_user_id: "supt-1", captures: { rep: $.data.id } }
            - { call: "POST /weather-observations", payload: { report_id: "${rep}", observed_at: "2026-08-05T08:00:00Z", condition: "CLEAR", work_impact: "NONE" }, as: Superintendent, as_user_id: "supt-1" }
            - { call: "POST /crew-entries", payload: { report_id: "${rep}", work_area_id: "${area}", subcontractor: "SubCo", trade: "Labor", worker_count: 2, hours_per_worker: 8, work_performed: "unload" }, as: Superintendent, as_user_id: "supt-1" }
            - { call: "POST /deliveries", payload: { report_id: "${rep}", delivery_zone_id: "${zone}", po_number: "PO-1", material_description: "Rebar", delivered_qty: 100, unit: "TON", scheduled_window_start: "2026-08-05T09:00:00Z", scheduled_window_end: "2026-08-05T10:00:00Z" }, as: Superintendent, as_user_id: "supt-1", captures: { del: $.data.id } }
            - { call: "POST /deliveries/${del}/inspect", payload: { accepted_qty: 60, rejected_qty: 25 }, as: Superintendent, as_user_id: "supt-1", captures: { del_st: $.data.status } }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T17:00:00Z" }, as: SystemAdmin }
          trigger:
            - { call: "POST /daily-reports/${rep}/submit", payload: {}, as: Superintendent, as_user_id: "supt-1", captures: { err: $.data.error_id } }
            - { call: "POST /deliveries/${del}/resolve-recount", payload: { recount_accepted_qty: 15 }, as: Superintendent, as_user_id: "supt-1", captures: { del_st2: $.data.status } }
            - { call: "POST /daily-reports/${rep}/submit", payload: {}, as: Superintendent, as_user_id: "supt-1", captures: { st2: $.data.status } }
          assert:
            - "delivery after partial inspect: status == PARTIAL (pending_recount_qty == 15)"
            - "first submit rejected: error_id == ERR_DELIVERY_NOT_INSPECTED (409)"
            - "after resolve-recount: delivery status == INSPECTED"
            - "second submit succeeds: report status == SUBMITTED"

      - name: distribution_create_blocked_by_report_state
        grounds:
          - validations[priority=10.4]
          - state_machines.DistributionRecord.PENDING_to_SENT
        distinguishing_aspect: |
          Pair DailyReport -> DistributionRecord (different pair than the delivery->report
          instance): creating a distribution record while the report is UNDER_REVIEW fails
          with ERR_REPORT_NOT_APPROVED; after approve the same call succeeds with PENDING.
        test_recipe:
          setup: ["Report 2026-08-05 in UNDER_REVIEW"]
          setup_api_calls:
            - { call: "POST /projects", payload: { name: "P16", contract_number: "C-XD2" }, as: SystemAdmin, captures: { proj: $.data.id } }
            - { call: "POST /projects/${proj}/activate", payload: {}, as: SystemAdmin }
            - { call: "POST /work-areas", payload: { project_id: "${proj}", code: "A1" }, as: SystemAdmin, captures: { area: $.data.id } }
            - { call: "POST /daily-reports", payload: { project_id: "${proj}", report_date: "2026-08-05" }, as: Superintendent, as_user_id: "supt-1", captures: { rep: $.data.id } }
            - { call: "POST /weather-observations", payload: { report_id: "${rep}", observed_at: "2026-08-05T08:00:00Z", condition: "CLEAR", work_impact: "NONE" }, as: Superintendent, as_user_id: "supt-1" }
            - { call: "POST /crew-entries", payload: { report_id: "${rep}", work_area_id: "${area}", subcontractor: "SubCo", trade: "Labor", worker_count: 2, hours_per_worker: 8, work_performed: "framing" }, as: Superintendent, as_user_id: "supt-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T17:00:00Z" }, as: SystemAdmin }
            - { call: "POST /daily-reports/${rep}/submit", payload: {}, as: Superintendent, as_user_id: "supt-1" }
            - { call: "POST /daily-reports/${rep}/start-review", payload: {}, as: ProjectManager, as_user_id: "pm-1" }
          trigger:
            - { call: "POST /distribution-records", payload: { report_id: "${rep}", recipient_email: "arch@x.com", recipient_role: "ARCHITECT" }, as: ProjectManager, as_user_id: "pm-1", captures: { err: $.data.error_id } }
            - { call: "POST /daily-reports/${rep}/approve", payload: {}, as: ProjectManager, as_user_id: "pm-1" }
            - { call: "POST /distribution-records", payload: { report_id: "${rep}", recipient_email: "arch@x.com", recipient_role: "ARCHITECT" }, as: ProjectManager, as_user_id: "pm-1", captures: { rec: $.data.id, st: $.data.status } }
          assert:
            - "while UNDER_REVIEW: error_id == ERR_REPORT_NOT_APPROVED (409)"
            - "after APPROVED: distribution record created with status == PENDING"

      - name: delay_finalize_blocked_on_draft_report
        grounds:
          - validations[priority=10.5]
          - state_machines.DelayEvent.CLASSIFIED_to_FINAL
        distinguishing_aspect: |
          Pair DailyReport -> DelayEvent (third distinct pair): finalize of a CLASSIFIED delay
          event fails with ERR_DELAY_FINALIZE_REQUIRES_SUBMITTED_REPORT while the parent
          report is DRAFT, and succeeds once the report is SUBMITTED.
        test_recipe:
          setup: ["Report DRAFT with a delay event classified EXCUSABLE_COMPENSABLE"]
          setup_api_calls:
            - { call: "POST /projects", payload: { name: "P17", contract_number: "C-XD3", scheduled_shift_hours: 8 }, as: SystemAdmin, captures: { proj: $.data.id } }
            - { call: "POST /projects/${proj}/activate", payload: {}, as: SystemAdmin }
            - { call: "POST /work-areas", payload: { project_id: "${proj}", code: "A1" }, as: SystemAdmin, captures: { area: $.data.id } }
            - { call: "POST /daily-reports", payload: { project_id: "${proj}", report_date: "2026-08-05" }, as: Superintendent, as_user_id: "supt-1", captures: { rep: $.data.id } }
            - { call: "POST /delay-events", payload: { report_id: "${rep}", work_area_id: "${area}", start_at: "2026-08-05T09:00:00Z", end_at: "2026-08-05T10:00:00Z", cause: "OWNER" }, as: Superintendent, as_user_id: "supt-1", captures: { dev: $.data.id } }
            - { call: "POST /delay-events/${dev}/classify", payload: { classification: "EXCUSABLE_COMPENSABLE" }, as: ProjectManager, as_user_id: "pm-1" }
          trigger:
            - { call: "POST /delay-events/${dev}/finalize", payload: {}, as: ProjectManager, as_user_id: "pm-1", captures: { err: $.data.error_id } }
            - { call: "POST /weather-observations", payload: { report_id: "${rep}", observed_at: "2026-08-05T08:00:00Z", condition: "CLEAR", work_impact: "NONE" }, as: Superintendent, as_user_id: "supt-1" }
            - { call: "POST /crew-entries", payload: { report_id: "${rep}", work_area_id: "${area}", subcontractor: "SubCo", trade: "Labor", worker_count: 2, hours_per_worker: 8, work_performed: "framing" }, as: Superintendent, as_user_id: "supt-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T17:00:00Z" }, as: SystemAdmin }
            - { call: "POST /daily-reports/${rep}/submit", payload: {}, as: Superintendent, as_user_id: "supt-1" }
            - { call: "POST /delay-events/${dev}/finalize", payload: {}, as: ProjectManager, as_user_id: "pm-1", captures: { st: $.data.status } }
          assert:
            - "while report DRAFT: error_id == ERR_DELAY_FINALIZE_REQUIRES_SUBMITTED_REPORT (409)"
            - "after report SUBMITTED: delay event status == FINAL"

  # ------------------------------------------------------------------
  # Rule 8: resource_temporal_overlap (different interval semantics)
  # ------------------------------------------------------------------
  - rule_id: resource_temporal_overlap
    instances:
      - name: delay_compensable_overlap_half_open_adjacency
        grounds:
          - validations[priority=9.5]
          - state_machines.DelayEvent.RECORDED_to_CLASSIFIED
        distinguishing_aspect: |
          Resource: WorkArea via DelayEvent; semantics: HALF-OPEN [start,end) — event B
          starting exactly at A's end (11:00 == 11:00) is adjacency and classifies fine,
          while C [10:30,12:00) truly overlaps and is rejected with
          ERR_DELAY_OVERLAP_COMPENSABLE.
        test_recipe:
          setup: ["Report DRAFT; area A1; delay A 09:00-11:00 classified EXCUSABLE_COMPENSABLE"]
          setup_api_calls:
            - { call: "POST /projects", payload: { name: "P18", contract_number: "C-TO1", scheduled_shift_hours: 8 }, as: SystemAdmin, captures: { proj: $.data.id } }
            - { call: "POST /projects/${proj}/activate", payload: {}, as: SystemAdmin }
            - { call: "POST /work-areas", payload: { project_id: "${proj}", code: "A1" }, as: SystemAdmin, captures: { area: $.data.id } }
            - { call: "POST /daily-reports", payload: { project_id: "${proj}", report_date: "2026-08-05" }, as: Superintendent, as_user_id: "supt-1", captures: { rep: $.data.id } }
            - { call: "POST /delay-events", payload: { report_id: "${rep}", work_area_id: "${area}", start_at: "2026-08-05T09:00:00Z", end_at: "2026-08-05T11:00:00Z", cause: "OWNER" }, as: Superintendent, as_user_id: "supt-1", captures: { devA: $.data.id } }
            - { call: "POST /delay-events/${devA}/classify", payload: { classification: "EXCUSABLE_COMPENSABLE" }, as: ProjectManager, as_user_id: "pm-1", captures: { a_lost: $.data.lost_hours } }
            - { call: "POST /delay-events", payload: { report_id: "${rep}", work_area_id: "${area}", start_at: "2026-08-05T11:00:00Z", end_at: "2026-08-05T12:30:00Z", cause: "OWNER" }, as: Superintendent, as_user_id: "supt-1", captures: { devB: $.data.id } }
            - { call: "POST /delay-events", payload: { report_id: "${rep}", work_area_id: "${area}", start_at: "2026-08-05T10:30:00Z", end_at: "2026-08-05T12:00:00Z", cause: "OWNER" }, as: Superintendent, as_user_id: "supt-1", captures: { devC: $.data.id } }
          trigger:
            - { call: "POST /delay-events/${devB}/classify", payload: { classification: "EXCUSABLE_COMPENSABLE" }, as: ProjectManager, as_user_id: "pm-1", captures: { b_st: $.data.status, b_lost: $.data.lost_hours } }
            - { call: "POST /delay-events/${devC}/classify", payload: { classification: "EXCUSABLE_COMPENSABLE" }, as: ProjectManager, as_user_id: "pm-1", captures: { err: $.data.error_id } }
          assert:
            - "A.lost_hours == 2.00 (09:00-11:00 fully inside shift 07:00-15:00)"
            - "B adjacent at 11:00 classifies fine: status == CLASSIFIED, lost_hours == 1.50 (half-open: end==start is not overlap)"
            - "C [10:30,12:00) overlaps A and B: error_id == ERR_DELAY_OVERLAP_COMPENSABLE (409)"
            - "C remains RECORDED"

      - name: delivery_zone_window_buffer_closed_interval
        grounds:
          - validations[priority=9.6]
        distinguishing_aspect: |
          Resource: DeliveryZone via MaterialDelivery (different resource than WorkArea);
          semantics: CLOSED intervals PLUS a mandatory buffer gap — B starting exactly
          buffer_minutes (30) after A's end passes, while C leaving only 29 minutes collides
          (touching without buffer is a collision, unlike the delay half-open adjacency rule).
        test_recipe:
          setup: ["Report DRAFT; zone Z1 buffer 30; delivery A window [09:00, 10:00]"]
          setup_api_calls:
            - { call: "POST /projects", payload: { name: "P19", contract_number: "C-TO2" }, as: SystemAdmin, captures: { proj: $.data.id } }
            - { call: "POST /projects/${proj}/activate", payload: {}, as: SystemAdmin }
            - { call: "POST /delivery-zones", payload: { project_id: "${proj}", zone_code: "Z1", buffer_minutes: 30 }, as: SystemAdmin, captures: { zone: $.data.id } }
            - { call: "POST /daily-reports", payload: { project_id: "${proj}", report_date: "2026-08-05" }, as: Superintendent, as_user_id: "supt-1", captures: { rep: $.data.id } }
            - { call: "POST /deliveries", payload: { report_id: "${rep}", delivery_zone_id: "${zone}", po_number: "PO-A", material_description: "Rebar", delivered_qty: 10, unit: "TON", scheduled_window_start: "2026-08-05T09:00:00Z", scheduled_window_end: "2026-08-05T10:00:00Z" }, as: Superintendent, as_user_id: "supt-1", captures: { delA: $.data.id } }
          trigger:
            - { call: "POST /deliveries", payload: { report_id: "${rep}", delivery_zone_id: "${zone}", po_number: "PO-B", material_description: "Concrete", delivered_qty: 5, unit: "CY", scheduled_window_start: "2026-08-05T10:30:00Z", scheduled_window_end: "2026-08-05T11:30:00Z" }, as: Superintendent, as_user_id: "supt-1", captures: { delB: $.data.id } }
            - { call: "POST /deliveries", payload: { report_id: "${rep}", delivery_zone_id: "${zone}", po_number: "PO-C", material_description: "Lumber", delivered_qty: 1, unit: "EA", scheduled_window_start: "2026-08-05T10:29:00Z", scheduled_window_end: "2026-08-05T11:00:00Z" }, as: Superintendent, as_user_id: "supt-1", captures: { err: $.data.error_id } }
          assert:
            - "B created: gap 10:00 -> 10:30 == 30 min == buffer (>= passes)"
            - "C rejected: gap 29 min < 30 -> error_id == ERR_DELIVERY_WINDOW_OVERLAP (409)"
            - "only 2 deliveries exist on the report"

  # ------------------------------------------------------------------
  # Rule 9: compensating_invariant (different conserved quantities)
  # ------------------------------------------------------------------
  - rule_id: compensating_invariant
    instances:
      - name: approve_reopen_reapproves_conserve_installed_to_date
        grounds:
          - calculations.calc_quantity_rollup
          - state_machines.DailyReport.UNDER_REVIEW_to_APPROVED
          - state_machines.DailyReport.APPROVED_to_UNDER_REVIEW
        distinguishing_aspect: |
          Conserved quantity: WorkItem cumulative installed units. approve adds +2.468, reopen
          subtracts exactly -2.468 (back to 0), re-approve adds +2.468 again — never 4.936:
          installed_to_date == SUM(rounded_quantity) over ACTIVE entries on APPROVED/LOCKED
          reports, invariant across the forward/compensating pair.
        test_recipe:
          setup: ["Report with two quantity entries 1.2344 (areas A1, A2) on one WorkItem (budget 100)"]
          setup_api_calls:
            - { call: "POST /projects", payload: { name: "P20", contract_number: "C-CI1" }, as: SystemAdmin, captures: { proj: $.data.id } }
            - { call: "POST /projects/${proj}/activate", payload: {}, as: SystemAdmin }
            - { call: "POST /work-areas", payload: { project_id: "${proj}", code: "A1" }, as: SystemAdmin, captures: { area1: $.data.id } }
            - { call: "POST /work-areas", payload: { project_id: "${proj}", code: "A2" }, as: SystemAdmin, captures: { area2: $.data.id } }
            - { call: "POST /work-items", payload: { project_id: "${proj}", cost_code: "03-100", description: "Curb", budgeted_quantity: 100, unit: "LF", unit_cost_cents: 1000 }, as: SystemAdmin, captures: { wi: $.data.id } }
            - { call: "POST /daily-reports", payload: { project_id: "${proj}", report_date: "2026-08-05" }, as: Superintendent, as_user_id: "supt-1", captures: { rep: $.data.id, rep_v: $.data.version } }
            - { call: "POST /quantity-entries", payload: { report_id: "${rep}", work_item_id: "${wi}", work_area_id: "${area1}", quantity_installed: 1.2344, expected_report_version: "${rep_v}" }, as: Superintendent, as_user_id: "supt-1" }
            - { call: "GET /daily-reports/${rep}", payload: {}, as: SystemAdmin, captures: { rep_v2: $.data.version } }
            - { call: "POST /quantity-entries", payload: { report_id: "${rep}", work_item_id: "${wi}", work_area_id: "${area2}", quantity_installed: 1.2344, expected_report_version: "${rep_v2}" }, as: Superintendent, as_user_id: "supt-1" }
            - { call: "POST /weather-observations", payload: { report_id: "${rep}", observed_at: "2026-08-05T08:00:00Z", condition: "CLEAR", work_impact: "NONE" }, as: Superintendent, as_user_id: "supt-1" }
            - { call: "POST /crew-entries", payload: { report_id: "${rep}", work_area_id: "${area1}", subcontractor: "SubCo", trade: "Labor", worker_count: 1, hours_per_worker: 8, work_performed: "pour" }, as: Superintendent, as_user_id: "supt-1" }
            - { call: "POST /_clock/set_current_utc", payload: { to_iso8601: "2026-08-05T17:00:00Z" }, as: SystemAdmin }
            - { call: "POST /daily-reports/${rep}/submit", payload: {}, as: Superintendent, as_user_id: "supt-1" }
            - { call: "POST /daily-reports/${rep}/start-review", payload: {}, as: ProjectManager, as_user_id: "pm-1" }
          trigger:
            - { call: "POST /daily-reports/${rep}/approve", payload: {}, as: ProjectManager, as_user_id: "pm-1" }
            - { call: "GET /work-items/${wi}", payload: {}, as: ProjectManager, captures: { inst1: $.data.installed_to_date } }
            - { call: "POST /daily-reports/${rep}/reopen", payload: { reason: "Quantity audit" }, as: ProjectManager, as_user_id: "pm-1" }
            - { call: "GET /work-items/${wi}", payload: {}, as: ProjectManager, captures: { inst2: $.data.installed_to_date, st2: $.data.status } }
            - { call: "POST /daily-reports/${rep}/approve", payload: {}, as: ProjectManager, as_user_id: "pm-1" }
            - { call: "GET /work-items/${wi}", payload: {}, as: ProjectManager, captures: { inst3: $.data.installed_to_date } }
          assert:
            - "after first approve: installed_to_date == 2.468"
            - "after reopen (compensation): installed_to_date == 0 and status == NOT_STARTED"
            - "after re-approve: installed_to_date == 2.468 again (no double count, no drift)"

      - name: delivery_inspection_partition_conserved
        grounds:
          - state_machines.MaterialDelivery.DELIVERED_to_PARTIAL
          - state_machines.MaterialDelivery.PARTIAL_to_INSPECTED
        distinguishing_aspect: |
          Conserved quantity: delivered quantity partition (different conserved quantity than
          installed units). accepted + rejected + pending_recount == delivered_qty (100) at
          creation, after partial inspect (60/25 -> 15 pending), and after resolve-recount
          (70/30/0) — the compensating recount action closes the partition without drift.
        test_recipe:
          setup: ["Report DRAFT; delivery of 100 TON"]
          setup_api_calls:
            - { call: "POST /projects", payload: { name: "P21", contract_number: "C-CI2" }, as: SystemAdmin, captures: { proj: $.data.id } }
            - { call: "POST /projects/${proj}/activate", payload: {}, as: SystemAdmin }
            - { call: "POST /delivery-zones", payload: { project_id: "${proj}", zone_code: "Z1", buffer_minutes: 30 }, as: SystemAdmin, captures: { zone: $.data.id } }
            - { call: "POST /daily-reports", payload: { project_id: "${proj}", report_date: "2026-08-05" }, as: Superintendent, as_user_id: "supt-1", captures: { rep: $.data.id } }
            - { call: "POST /deliveries", payload: { report_id: "${rep}", delivery_zone_id: "${zone}", po_number: "PO-1", material_description: "Rebar", delivered_qty: 100, unit: "TON", scheduled_window_start: "2026-08-05T09:00:00Z", scheduled_window_end: "2026-08-05T10:00:00Z" }, as: Superintendent, as_user_id: "supt-1", captures: { del: $.data.id, pend0: $.data.pending_recount_qty } }
          trigger:
            - { call: "POST /deliveries/${del}/inspect", payload: { accepted_qty: 60, rejected_qty: 25 }, as: Superintendent, as_user_id: "supt-1", captures: { acc1: $.data.accepted_qty, rej1: $.data.rejected_qty, pend1: $.data.pending_recount_qty, st1: $.data.status } }
            - { call: "POST /deliveries/${del}/resolve-recount", payload: { recount_accepted_qty: 10 }, as: Superintendent, as_user_id: "supt-1", captures: { acc2: $.data.accepted_qty, rej2: $.data.rejected_qty, pend2: $.data.pending_recount_qty, st2: $.data.status } }
          assert:
            - "at creation: accepted 0 + rejected 0 + pending_recount 100 == 100"
            - "after inspect(60,25): 60 + 25 + 15 == 100, status == PARTIAL"
            - "after resolve-recount(10): 70 + 30 + 0 == 100, status == INSPECTED"
